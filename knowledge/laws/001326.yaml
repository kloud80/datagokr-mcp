# 참전유공자 예우 및 단체설립에 관한 법률 — 법제처 현행 원문 (2026-09-30 조회). 참조: dataset:15098572
law_id: '001326'
name: 참전유공자 예우 및 단체설립에 관한 법률
short_names:
  - 참전유공자법
promulgated: '2026-09-08'
effective: '2026-09-08'
articles:
  - no: '1'
    title: 목적
    text: 제1조(목적) 이 법은 국가에 공헌하고 헌신한 참전유공자(參戰有功者)에게 국가가 합당한 예우와 지원을 함으로써 참전유공자의 명예를 선양(宣揚)하고 국민의 애국정신을 기르는 데 이바지함을 목적으로 한다.
  - no: '2'
    title: 정의
    text: "제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. \"6ㆍ25전쟁\"이란 1950년 6월 25일부터 1953년 7월 27일 사이에 발생한 전투 및 1948년 8월 15일부터 1955년 6월 30일 사이에 발생한 전투 중 별표의 전투를 말한다.\n2. \"참전유공자\"란 다음 각 목의 어느 하나에 해당하는 사람을 말한다. 다만, 6ㆍ25전쟁이나 1964년 7월 18일부터 1973년 3월 23일까지 월남전쟁 참전 중 범죄행위로 인하여 금고 이상의 형을 선고받고 불명예스러운 제대를 하거나 파면된 사실이 있는 사람은 제외한다."
  - no: '3'
    title: 적용 대상자
    text: 제3조(적용 대상자) 참전유공자 또는 그 배우자(사실혼 관계에 있는 사람을 포함한다. 다만, 배우자 및 사실혼 관계에 있는 사람이 참전유공자와 혼인 또는 사실혼 후 그 참전유공자가 아닌 다른 사람과 사실혼 관계에 있거나 있었던 경우는 제외한다. 이하 같다)로서 제5조에 따라 등록된 사람은 이 법에 따른 예우를 받는다. <개정 2025.9.16>
  - no: '4'
    title: 국가 등의 책무
    text: "제4조(국가 등의 책무) 국가와 지방자치단체는 참전유공자의 예우와 지원을 위하여 다음 각 호의 사업을 한다.\n1. 참전유공자의 명예를 선양하기 위한 사업\n2. 참전유공자의 호국정신을 계승하기 위한 사업\n3. 참전유공자의 복리를 증진하기 위한 사업\n4. 6ㆍ25전쟁 참전국과의 우호를 증진하기 위한 사업"
  - no: 4의2
    title:
    text: 제4조의2 삭제 <2020.3.24>
  - no: 4의3
    title: 해외 파병용사의 날
    text: 제4조의3(해외 파병용사의 날) 국가는 해외 파병용사의 희생과 공헌을 기리기 위하여 필요하다고 판단될 경우 해외 파병용사의 날을 정하여 행사를 할 수 있다.
  - no: '5'
    title: 등록 및 결정
    text: "제5조(등록 및 결정)\n① 참전유공자 또는 그 배우자로서 이 법을 적용받으려는 사람은 대통령령으로 정하는 바에 따라 국가보훈부장관에게 등록을 신청하여야 한다. <개정 2023.3.4, 2025.9.16>\n② 국가보훈부장관은 제1항에 따른 등록신청을 받으면 대통령령으로 정하는 바에 따라 참전유공자 또는 그 배우자로서의 요건을 확인한 후 등록할지를 결정하여야 하며, 참전유공자의 배우자에 해당하는지 결정하기 위하여 필요한 경우에는 「국가유공자 등 예우 및 지원에 관한 법률」 제74조의5에 따른 보훈심사위원회(이하 \"보훈심사위원회\"라 한다)의 심의ㆍ의결을 거칠 수 있다. <개정 2023.3.4, 2025.9.16>\n③ 다음 각 호의 사람 중 해당 등록신청 서류에 의하여 제2조제2호 각 목의 어느 하나의 요건에 해당함이 객관적으로 인정되는 사람 또는 그 배우자에 대해서는 그 등록한 날에 이 법에 따른 참전유공자 또는 그 배우자로 등록한 것으로 본다. <개정 2025.9.16>\n1. 「국가유공자 등 예우 및 지원에 관한 법률」에 따라 국가유공자 또는 그 배우자로 등록된 사람\n2. 「보훈보상대상자 지원에 관한 법률」에 따라 보훈보상대상자 또는 그 배우자로 등록된 사람\n3. 「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」에 따라 고엽제후유증환자 또는 고엽제후유의증환자로 등록된 사람\n④ 국가보훈부장관은 제3항 각 호의 어느 하나에 해당하는 사람에 대해서는 지체 없이 이 법의 적용 대상이 되는 참전유공자 또는 그 배우자에 해당하는지를 확인하고, 이에 해당하면 본인에게 제3항에 따라 참전유공자 또는 그 배우자로 등록된 사실을 알려야 한다. <개정 2023.3.4, 2025.9.16>\n⑤ 국가보훈부장관은 제2조제2호에 따른 참전유공자임에도 불구하고 제1항 및 제2항에 따른 등록을 마치지 못하고 사망한 사람에 대해서는 참전유공자로 기록하고 예우 및 관리를 할 수 있다. <신설 2016.5.29, 2023.3.4>"
  - no: 5의2
    title: 신상 변동의 신고 등
    text: "제5조의2(신상 변동의 신고 등)\n①제5조에 따라 참전유공자 또는 그 배우자로 등록된 사람이 다음 각 호의 어느 하나에 해당하면 본인이나 그 유족 또는 가족은 국가보훈부령으로 정하는 바에 따라 지체 없이 국가보훈부장관에게 그 사실을 신고하여야 한다. <개정 2015.12.22, 2023.3.4, 2025.9.16>\n1. 사망한 경우\n2. 제38조제2항 또는 제39조제1항에 해당하게 된 경우\n3. 국적을 상실한 경우\n4. 1년 이상 계속하여 행방불명 상태인 경우\n5. 제4호에 해당하던 사람으로서 그 사유가 소멸한 경우\n6. 성명ㆍ주소 또는 생년월일이 변동된 경우\n7. 참전 기록이나 그 밖의 군 기록 등이 변경 또는 정정된 사실이 있는 경우\n8. 배우자에 해당하지 아니하게 된 경우\n9. 그 밖에 국가보훈부령으로 정하는 신상 변동이 있는 경우\n②국가보훈부장관은 제1항에 따른 신고를 받으면 지체 없이 다음 각 호 중 필요한 조치를 하고, 신고인에게 그 내용과 사유를 알려야 한다. <개정 2015.12.22, 2023.3.4>\n1. 등록취소\n2. 미지급 참전명예수당의 지급 또는 지급된 참전명예수당의 환수\n3. 그 밖에 국가보훈부령으로 정하는 조치\n③ 국가보훈부장관은 제1항 각 호의 신상 변동을 확인하기 위하여 참전유공자, 그 유족 또는 가족에게 필요한 자료의 제출을 요구할 수 있다. 이 경우 자료의 제출을 요구받은 사람은 정당한 사유가 없으면 이에 따라야 한다. <신설 2015.12.22, 2023.3.4>"
  - no: '6'
    title: 참전명예수당
    text: "제6조(참전명예수당)\n① 국가보훈부장관은 65세 이상의 참전유공자에게는 참전의 명예를 기리기 위하여 참전명예수당을 지급한다. 다만, 참전명예수당을 받을 수 있는 사람(이하 \"수당지급 대상자\"라 한다)이 다음 각 호의 어느 하나에 해당하는 경우에는 본인이 참전명예수당과 다음 각 호의 어느 하나에 해당하는 보훈급여금 또는 수당 중 하나를 선택하게 하여 지급한다. <개정 2023.3.4>\n1. 「국가유공자 등 예우 및 지원에 관한 법률」 제4조제1항제4호ㆍ제6호ㆍ제7호 또는 제9호에 해당하는 사람으로서 같은 법 제11조에 따른 보훈급여금을 지급받는 경우\n2. 「보훈보상대상자 지원에 관한 법률」 제2조제1항제2호에 해당하는 사람으로서 같은 법 제10조에 따른 보훈급여금을 지급받는 경우\n3. 「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」 제7조의3에 따른 수당을 지급받는 경우\n② 참전명예수당은 제1항에 따른 참전명예수당 지급연령이 된 날이 속하는 달부터 제5조의2제1항제1호ㆍ제2호 및 제4호에 규정된 사유가 발생한 날이 속하는 달까지 지급한다. 다만, 참전명예수당 지급연령이 지난 후에 제5조제1항에 따른 등록신청을 한 경우에는 등록신청을 한 날이 속하는 달부터 지급한다.\n③ 참전유공자가 국적을 상실한 경우에도 참전명예수당을 지급할 수 있다.\n④ 참전명예수당은 수당지급 대상자가 지정하는 예금계좌[「우체국예금ㆍ보험에 관한 법률」에 따른 체신관서(이하 \"체신관서\"라 한다) 또는 「은행법」에 따른 은행(이하 \"은행\"이라 한다)의 계좌를 말한다. 이하 같다]에 입금하는 방법으로 지급한다. 다만, 정보통신망(「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제1호에 따른 정보통신망을 말한다. 이하 같다)의 손상 등 대통령령으로 정하는 불가피한 사유가 있는 경우에는 해당 수당지급 대상자의 신청에 따라 현금으로 지급할 수 있다.\n⑤ 제4항 본문에 따라 참전명예수당을 지급하는 경우 수당지급 대상자가 본인 명의로 참전명예수당만 입금될 수 있는 예금계좌를 개설하여 지정한 경우에는 해당 예금계좌로 참전명예수당을 입금하여야 한다.\n⑥ 미지급 참전명예수당의 지급에 관하여는 「국가유공자 등 예우 및 지원에 관한 법률」 제18조를 준용한다.\n⑦ 참전명예수당은 월액(月額)으로 지급하며, 그 지급액 등은 대통령령으로 정한다."
  - no: 6의2
    title: 권리의 보호
    text: "제6조의2(권리의 보호)\n① 참전명예수당을 받을 권리는 양도하거나 압류할 수 없으며, 담보로 제공할 수 없다.\n② 제6조제5항에 따라 입금된 월 참전명예수당 중 「국민기초생활 보장법」 제2조제11호에 따른 기준 중위소득(이하 \"기준 중위소득\"이라 한다) 등을 고려하여 대통령령으로 정하는 액수 이하의 금액에 관한 채권은 압류할 수 없다.\n③ 제1항 및 제2항에도 불구하고 제36조에 따라 참전명예수당 등을 환수하는 경우에는 제6조제1항에 따른 참전명예수당을 압류할 수 있다."
  - no: 6의3
    title: 생계지원금
    text: "제6조의3(생계지원금)\n① 다음 각 호의 어느 하나에 해당하는 사람에게는 대통령령으로 정하는 바에 따라 생활수준을 고려하여 생계지원금을 지급할 수 있다. <개정 2025.9.16>\n1. 80세 이상의 참전유공자\n2. 80세 이상의 배우자(참전유공자가 사망한 경우에 한정한다)\n② 제1항에 따른 생계지원금 지급대상자가 다음 각 호의 어느 하나에 해당하는 경우에는 본인의 선택에 따라 제1항에 따른 생계지원금이나 다음 각 호에 규정된 생활조정수당ㆍ생계지원금 중 어느 하나를 지급한다.\n1. 「5ㆍ18민주유공자예우 및 단체설립에 관한 법률」 제89조의2에 따른 생계지원금을 지급받는 경우\n2. 「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」 제7조의10에 따른 생계지원금을 지급받는 경우\n3. 「국가유공자 등 예우 및 지원에 관한 법률」 제14조에 따른 생활조정수당을 지급받는 경우\n4. 「독립유공자예우에 관한 법률」 제14조에 따른 생활조정수당을 지급받는 경우\n5. 「보훈보상대상자 지원에 관한 법률」 제13조에 따른 생활조정수당을 지급받는 경우\n6. 「특수임무유공자 예우 및 단체설립에 관한 법률」 제75조의2에 따른 생계지원금을 지급받는 경우\n③ 생계지원금의 지급 신청, 수급권 확인ㆍ심사를 위한 국가보훈부장관의 조사ㆍ질문 등의 권한, 금융정보등의 제공 요청 및 생계지원금 신청의 촉진 등에 관하여는 「국가유공자 등 예우 및 지원에 관한 법률」 제14조의2부터 제14조의5까지의 규정을 준용한다. 이 경우 \"생활조정수당\"은 \"생계지원금\"으로 본다. <개정 2023.3.4>\n④ 생계지원금의 지급, 권리의 보호 및 생계지원금의 지급정지 등에 관하여는 「국가유공자 등 예우 및 지원에 관한 법률」 제17조의2 및 제18조부터 제20조까지의 규정을 준용한다.\n⑤ 생계지원금은 월액으로 하며, 그 지급액, 지급방법, 그 밖에 지급에 필요한 사항은 대통령령으로 정한다."
  - no: '7'
    title: 의료지원
    text: "제7조(의료지원)\n① 참전유공자가 다음 각 호의 의료기관에서 진료를 받는 경우 그 진료비용(약제비용을 포함한다. 이하 이 조에서 같다)은 본인이 부담하게 될 비용의 범위에서 대통령령으로 정하는 바에 따라 감면(減免)하며, 그 감면된 비용은 국가가 부담한다. <개정 2015.12.22, 2021.4.20, 2023.7.11, 2026.2.19>\n1. 국가의 의료기관(「한국보훈복지의료공단법」 제7조에 따른 보훈병원을 포함한다)\n2. 지방자치단체의 의료기관\n3. 대통령령으로 정하는 공공단체가 설립ㆍ운영하는 의료기관\n② 국가는 제1항에 따른 참전유공자의 진료를 제1항의 의료기관 외의 의료기관에 위탁하여 할 수 있다. 이 경우 그 진료비용은 본인이 부담하게 될 비용의 범위에서 대통령령으로 정하는 바에 따라 감면하며, 그 감면된 비용은 국가가 부담한다. <개정 2023.7.11, 2026.2.19>\n③ 제1항과 제2항에 따른 진료 또는 진료비용 지원의 방법ㆍ절차ㆍ범위 및 상한 등 의료지원의 기준은 대통령령으로 정한다. <개정 2009.2.6, 2015.12.22, 2023.7.11>"
  - no: '8'
    title: 양로지원
    text: "제8조(양로지원)\n① 65세 이상인 참전유공자로서 부양의무자(부양의무가 있는 배우자, 부모, 자녀 및 그 배우자를 말한다. 이하 이 항에서 같다)가 없는 사람(부양의무자가 있으나 대통령령으로 정하는 부양능력이 없는 경우를 포함한다)에 대해서는 국가 또는 지방자치단체가 설치ㆍ운영하는 양로시설에서 지원할 수 있다. <개정 2025.1.21>\n② 국가는 제1항에 따른 양로지원을 국가 또는 지방자치단체가 설치ㆍ운영하는 양로시설 외의 양로시설에 위탁하여 할 수 있으며, 이에 드는 비용은 국가가 부담한다."
  - no: 8의2
    title: 요양지원에 대한 보조
    text: "제8조의2(요양지원에 대한 보조)\n① 국가보훈부장관은 참전유공자 중 「노인장기요양보험법」 제23조제1항제1호 또는 제2호에 따른 재가급여나 시설급여를 받는 사람에게는 기준 중위소득 등 생활수준을 고려하여 본인이 부담하여야 할 비용의 일부를 보조할 수 있다. <개정 2023.3.4>\n② 제1항에 따른 보조금 지급 대상자의 구체적인 선정 기준, 그 지급액 등 필요한 사항은 대통령령으로 정한다."
  - no: 8의3
    title: 요양지원에 대한 보조금 지급 신청
    text: "제8조의3(요양지원에 대한 보조금 지급 신청)\n① 제8조의2에 따라 요양지원에 대한 보조금을 받으려는 사람(이하 \"보조금 수급희망자\"라 한다)은 국가보훈부장관에게 보조금 지급을 신청하여야 한다. <개정 2023.3.4>\n② 보조금 수급희망자가 제1항에 따라 신청하는 경우에 본인과 그 가구원(보조금 수급희망자와 생계 또는 주거를 같이 하는 사람으로서 대통령령으로 정하는 사람을 말한다. 이하 같다)은 다음 각 호의 자료 또는 정보 제공에 동의한다는 서면을 제출하여야 한다. <개정 2025.1.21>\n1. 「금융실명거래 및 비밀보장에 관한 법률」 제2조제2호 및 제3호에 따른 금융자산 및 금융거래의 내용에 대한 자료 또는 정보 중 예금의 평균잔액과 그 밖에 대통령령으로 정하는 자료 또는 정보(이하 \"금융정보\"라 한다)\n2. 「신용정보의 이용 및 보호에 관한 법률」 제2조제1호에 따른 신용정보 중 채무액과 그 밖에 대통령령으로 정하는 자료 또는 정보(이하 \"신용정보\"라 한다)\n3. 「보험업법」 제4조제1항 각 호에 따른 보험에 가입하여 납부한 보험료와 그 밖에 대통령령으로 정하는 자료 또는 정보(이하 \"보험정보\"라 한다)\n③ 국가보훈부장관은 제1항에 따른 신청을 받으면 제8조의4에 따른 조사 결과에 따라 보조금을 지급할지를 결정하여야 한다. <개정 2023.3.4>\n④ 제1항에 따른 요양지원에 대한 보조금 지급의 신청 방법ㆍ절차 및 제2항에 따른 동의의 방법ㆍ절차 등에 관하여 필요한 사항은 대통령령으로 정한다."
  - no: 8의4
    title: 조사ㆍ질문 등
    text: "제8조의4(조사ㆍ질문 등)\n① 국가보훈부장관은 요양지원에 대한 보조금 수급권의 발생 또는 상실을 확인하기 위하여 보조금 수급희망자 및 보조금 수급자(참전유공자로서 요양지원에 대한 보조금을 받고 있는 사람을 말한다. 이하 같다)와 그 가구원에 대하여 필요한 서류나 그 밖에 소득ㆍ재산 등에 관한 자료의 제출을 요구할 수 있으며, 소속 공무원으로 하여금 보조금 수급희망자 및 보조금 수급자와 그 가구원의 주거, 그 밖에 필요한 장소에 출입하여 서류 등을 조사하게 하거나 관계인에게 필요한 질문을 하게 할 수 있다. <개정 2023.3.4, 2025.1.21>\n② 제1항에 따라 출입ㆍ조사ㆍ질문을 하는 사람은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 내보여야 한다.\n③ 국가보훈부장관은 보조금 수급희망자 및 보조금 수급자와 그 가구원이 제1항에 따른 서류 또는 자료의 제출을 거부하거나 조사ㆍ질문을 거부ㆍ방해 또는 기피하는 경우에는 요양지원에 대한 보조금 지급 신청을 각하하거나 요양지원에 대한 보조금의 지급을 중지할 수 있다. <개정 2023.3.4, 2025.1.21>\n④ 제1항에 따른 조사ㆍ질문의 범위ㆍ시기 및 내용에 관하여 필요한 사항은 대통령령으로 정한다."
  - no: 8의5
    title: 금융정보등의 제공
    text: "제8조의5(금융정보등의 제공)\n① 국가보훈부장관은 「금융실명거래 및 비밀보장에 관한 법률」 제4조제1항과 「신용정보의 이용 및 보호에 관한 법률」 제32조제1항에도 불구하고 보조금 수급희망자와 그 가구원이 제8조의3제2항에 따라 제출한 동의 서면을 전자적 형태로 바꾼 문서에 의하여 금융회사 등(「금융실명거래 및 비밀보장에 관한 법률」 제2조제1호에 따른 금융회사등 및 「신용정보의 이용 및 보호에 관한 법률」 제25조에 따른 신용정보집중기관을 말한다. 이하 같다)의 장에게 금융정보ㆍ신용정보 또는 보험정보(이하 \"금융정보등\"이라 한다)의 제공을 요청할 수 있다. <개정 2023.3.4, 2025.1.21>\n② 국가보훈부장관은 보조금 수급자와 그 가구원의 수급권 심사를 위하여 필요하다고 인정하는 경우에는 「금융실명거래 및 비밀보장에 관한 법률」 제4조제1항과 「신용정보의 이용 및 보호에 관한 법률」 제32조제1항에도 불구하고 대통령령으로 정하는 인적사항과 조회기준일 및 조회기간 등을 적은 문서 또는 정보통신망으로 금융회사 등의 장에게 금융정보등을 제공하도록 요청할 수 있다. <개정 2023.3.4, 2025.1.21>\n③ 제1항과 제2항에 따라 금융정보등의 제공을 요청받은 금융회사 등의 장은 「금융실명거래 및 비밀보장에 관한 법률」 제4조제1항과 「신용정보의 이용 및 보호에 관한 법률」 제32조제1항에도 불구하고 이를 국가보훈부장관에게 제공하여야 한다. <개정 2023.3.4>\n④ 제3항에 따라 금융정보등을 제공하는 금융회사 등의 장은 금융정보등의 제공 사실을 명의인에게 통보하여야 한다. 다만, 명의인의 동의가 있는 경우에는 「금융실명거래 및 비밀보장에 관한 법률」 제4조의2제1항에도 불구하고 통보하지 아니할 수 있다.\n⑤ 제1항부터 제3항까지의 규정에 따른 금융정보등의 제공 요청 및 제공은 정보통신망을 이용하여야 한다. 다만, 정보통신망의 손상 등 불가피한 사유가 있는 경우에는 그러하지 아니하다.\n⑥ 제1항과 제2항에 따른 업무에 종사하고 있거나 종사하였던 사람은 업무를 수행하면서 취득한 금융정보등을 이 법에서 정한 목적 외의 다른 용도로 사용하거나 다른 사람 또는 기관에 제공하거나 누설해서는 아니 된다.\n⑦ 제1항부터 제3항까지 및 제5항에 따른 금융정보등의 제공 요청 및 제공 등에 필요한 사항은 대통령령으로 정한다."
  - no: 8의6
    title: 보훈재가복지서비스
    text: "제8조의6(보훈재가복지서비스)\n① 국가보훈부장관은 다음 각 호의 어느 하나에 해당하는 사람에게 원활한 일상생활을 위하여 가정에서 가사활동, 건강관리 및 정서활동 등을 지원하는 보훈재가복지서비스를 제공할 수 있다. <개정 2023.3.4, 2025.9.16>\n1. 제3조의 참전유공자\n2. 제1호에 해당하는 사람의 배우자\n② 제1항에 따른 지원을 받으려는 사람은 국가보훈부장관에게 그 지원을 신청하여야 한다. <개정 2023.3.4>\n③ 제1항에 따른 서비스 및 지원 대상의 구체적인 선정기준은 국가보훈부장관이 정한다. <개정 2023.3.4>"
  - no: 8의7
    title: 심리적 재활 등
    text: "제8조의7(심리적 재활 등)\n① 국가보훈부장관은 참전유공자의 심리적 안정과 사회 적응을 위하여 심리상담 등 심리재활서비스에 관한 시책을 마련하고, 그 사업을 수행하여야 한다. <개정 2023.3.4>\n② 제1항에 따른 지원의 내용ㆍ방법 등에 필요한 사항은 대통령령으로 정한다."
  - no: 8의8
    title: 장례서비스
    text: "제8조의8(장례서비스)\n① 국가보훈부장관은 생계가 곤란하거나, 연고자가 없는 참전유공자가 사망한 경우 예산의 범위에서 장례서비스를 제공할 수 있다. 다만, 사망한 참전유공자가 「국민기초생활 보장법」 제2조제2호에 따른 수급자인 경우에는 장례서비스를 제공하여야 한다.\n② 제1항에 따른 장례서비스를 제공받으려는 유족 등 장례를 주관하는 자는 장례기간 중에 국가보훈부장관에게 장례서비스의 제공을 신청하여야 한다.\n③ 제1항에 따른 장례서비스의 내용, 대상 및 방법 등은 국가보훈부장관이 정한다."
  - no: 8의9
    title: 고독사 예방 및 관리
    text: "제8조의9(고독사 예방 및 관리)\n① 국가보훈부장관은 참전유공자를 고독사(「고독사 예방 및 관리에 관한 법률」 제2조에 따른 고독사를 말한다. 이하 같다) 위험으로부터 보호하기 위하여 고독사 예방 및 관리에 필요한 정책을 수립ㆍ시행하여야 한다.\n② 국가보훈부장관은 제1항에 따른 고독사 예방 및 관리 정책의 수립ㆍ시행에 필요한 기초 자료로 활용하기 위하여 참전유공자의 고독사 현황 등에 대한 실태조사를 실시할 수 있다.\n③ 국가보훈부장관은 제1항에 따른 고독사 예방 및 관리 정책의 수립ㆍ시행을 위하여 필요한 경우 관계 행정기관, 지방자치단체 등과 협력체계를 구축할 수 있다.\n④ 제2항에 따른 고독사 실태조사의 실시에 필요한 사항은 대통령령으로 정한다."
  - no: 8의10
    title: 형사사법정보의 제공 등
    text: "제8조의10(형사사법정보의 제공 등)\n① 국가보훈부장관은 제8조의9제2항에 따른 고독사 실태조사를 실시하기 위하여 필요한 경우에는 경찰청장 및 해양경찰청장에게 「형사사법절차 전자화 촉진법」 제2조제3호의 형사사법정보(이하 \"형사사법정보\"라 한다)의 제공을 요청할 수 있다.\n② 제1항에 따라 형사사법정보의 제공을 요청받은 기관(이하 \"제공기관\"이라 한다)의 장은 정당한 사유가 없으면 이에 따라야 한다.\n③ 형사사법정보의 제공 범위 및 방법에 관하여는 국가보훈부장관과 제공기관의 장이 협의하여 결정한다.\n④ 제공기관의 장은 국가보훈부장관에게 형사사법정보에 포함되어 있는 개인의 정보 등을 보호하기 위하여 사용방법ㆍ사용부서나 그 밖에 필요한 사항에 대하여 제한을 하거나 형사사법정보의 안전성 확보를 위하여 필요한 조치(이하 \"정보보호조치\"라 한다)를 강구하도록 요청할 수 있다.\n⑤ 누구든지 이 법에 따라 제공받은 형사사법정보를 목적 외의 용도로 사용하거나 제3자에게 제공하여서는 아니 된다.\n⑥ 제공기관의 장은 국가보훈부장관이 정보보호조치를 하지 아니하거나 제5항을 위반하는 경우에는 형사사법정보의 제공을 중지 또는 제한할 수 있다."
  - no: '9'
    title: 묘지에의 안장
    text: "제9조(묘지에의 안장)\n①참전유공자로 등록된 사람의 유골은 본인 또는 유족이 원하는 바에 따라 국가가 조성하거나 조성할 묘지나 국가 또는 지방자치단체가 조성경비의 100분의 50 이상을 부담한 시설(이하 \"묘지\"라 한다)에 안장(安葬)하거나 안치(安置)할 수 있다. 다만, 제39조제1항 각 호의 어느 하나에 해당하는 사람은 그러하지 아니하다. <개정 2005.7.29, 2013.5.22, 2015.12.22>\n② 참전유공자(제1항 단서에 해당하는 사람은 제외한다)로서 제5조에 따른 등록을 마치지 못하고 사망한 사람의 유족이 희망하는 경우에는 그 유골을 묘지에 안장하거나 안치할 수 있다. <개정 2015.12.22>\n③ 묘지에 안장되거나 안치된 사람의 배우자는 본인 또는 유족의 희망에 따라 합장(合葬)할 수 있다. <개정 2015.12.22>\n④ 참전유공자가 사망한 경우에는 예산의 범위에서 장제보조비(葬祭補助費)를 지급하거나 그 밖의 보조를 할 수 있다. 다만, 국립묘지 또는 묘지에 안장하거나 안치하는 경우에는 장제보조비를 지급하지 아니한다. <신설 2015.12.22>\n⑤ 제4항에 따른 장제보조비를 지급받을 대상 및 순위에 관하여는 「국가유공자 등 예우 및 지원에 관한 법률」 제13조를 준용한다. 이 경우 같은 법 제13조에 따른 유족이 없으면 사망 당시 생활을 같이 하고 있던 친족 중 재산상속인이 될 사람의 신청에 따라 해당 재산상속인에게 이를 지급할 수 있고, 재산상속인이 될 사람도 없는 경우에는 장제를 하는 사람에게 이를 지급할 수 있다. <개정 2015.12.22>\n⑥ 제1항부터 제3항까지의 규정에 따른 유골의 안장 또는 안치 대상의 범위, 위치배정, 신청방법 및 절차 등에 필요한 사항은 국가보훈부령으로 정한다. <개정 2015.12.22, 2023.3.4>\n⑦ 삭제 <2015.12.22>"
  - no: '10'
    title: 고궁 등의 이용지원
    text: 제10조(고궁 등의 이용지원) 참전유공자에 대해서는 대통령령으로 정하는 바에 따라 국가 또는 지방자치단체에서 관리하는 고궁ㆍ공원 등의 시설을 무료로 이용하게 하거나 그 요금을 할인하여 이용하게 할 수 있다.
  - no: '11'
    title: 권리의 발생시기
    text: 제11조(권리의 발생시기) 이 법에 따라 예우 및 지원을 받을 권리는 제5조제1항 및 제3항에 따른 등록신청을 한 날이 속하는 달부터 발생한다. 다만, 제6조의3에 따른 생계지원금 및 제8조의3제1항에 따른 보조금을 신청하는 경우에는 그 신청한 날이 속하는 달부터 해당 지원을 받을 권리가 발생한다. <개정 2021.8.17>
  - no: '12'
    title: 사업의 재원
    text: 제12조(사업의 재원) 제4조에 따른 사업을 위한 재원은 「보훈기금법」에 따른 보훈기금에서 지원한다.
  - no: 12의2
    title: 보조금
    text: 제12조의2(보조금) 국가 또는 지방자치단체는 참전유공자의 명예를 선양하거나 호국정신을 계승하기 위한 사업 등을 하는 법인에 대하여 예산의 범위에서 보조금을 지급할 수 있다. <개정 2015.12.22>
  - no: 12의3
    title: 주택의 우선 공급
    text: "제12조의3(주택의 우선 공급)\n① 국가나 지방자치단체는 참전유공자에게 국가나 지방자치단체에 의하여 건설되거나 국가 또는 지방자치단체의 재정이나 「주택도시기금법」에 따른 주택도시기금의 지원을 받아 건설ㆍ공급되는 주택을 무주택기간과 생활수준 등을 고려하여 대통령령으로 정하는 바에 따라 우선 공급할 수 있다.\n② 「주택법」 제54조에 따라 민영주택을 건설ㆍ공급하는 사업주체는 참전유공자에게 그 민영주택 건설ㆍ공급량의 일부를 우선 공급할 수 있다.\n③ 제1항 또는 제2항에 따라 주택을 공급받으려는 사람은 국가보훈부장관에게 신청하여야 한다. 이 경우 주택 공급의 신청절차와 신청인의 생활수준 파악을 위한 절차 등은 제8조의3부터 제8조의5까지의 규정을 준용한다. <개정 2023.3.4>"
