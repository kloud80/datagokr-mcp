# 부동산 가격공시에 관한 법률 — 법제처 현행 원문 (2026-09-30 조회). 참조: domain:국토관리/국토정보, domain:국토관리/주택
law_id: '001827'
name: 부동산 가격공시에 관한 법률
short_names:
  - 부동산공시법
promulgated: '2020-06-09'
effective: '2020-12-10'
articles:
  - no: '1'
    title: 목적
    text: 제1조(목적) 이 법은 부동산의 적정가격(適正價格) 공시에 관한 기본적인 사항과 부동산 시장ㆍ동향의 조사ㆍ관리에 필요한 사항을 규정함으로써 부동산의 적정한 가격형성과 각종 조세ㆍ부담금 등의 형평성을 도모하고 국민경제의 발전에 이바지함을 목적으로 한다.
  - no: '2'
    title: 정의
    text: "제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. \"주택\"이란 「주택법」 제2조제1호에 따른 주택을 말한다.\n2. \"공동주택\"이란 「주택법」 제2조제3호에 따른 공동주택을 말한다.\n3. \"단독주택\"이란 공동주택을 제외한 주택을 말한다.\n4. \"비주거용 부동산\"이란 주택을 제외한 건축물이나 건축물과 그 토지의 전부 또는 일부를 말하며 다음과 같이 구분한다.\n5. \"적정가격\"이란 토지, 주택 및 비주거용 부동산에 대하여 통상적인 시장에서 정상적인 거래가 이루어지는 경우 성립될 가능성이 가장 높다고 인정되는 가격을 말한다."
  - no: '3'
    title: 표준지공시지가의 조사ㆍ평가 및 공시 등
    text: "제3조(표준지공시지가의 조사ㆍ평가 및 공시 등)\n① 국토교통부장관은 토지이용상황이나 주변 환경, 그 밖의 자연적ㆍ사회적 조건이 일반적으로 유사하다고 인정되는 일단의 토지 중에서 선정한 표준지에 대하여 매년 공시기준일 현재의 단위면적당 적정가격(이하 \"표준지공시지가\"라 한다)을 조사ㆍ평가하고, 제24조에 따른 중앙부동산가격공시위원회의의 심의를 거쳐 이를 공시하여야 한다.\n② 국토교통부장관은 표준지공시지가를 공시하기 위하여 표준지의 가격을 조사ㆍ평가할 때에는 대통령령으로 정하는 바에 따라 해당 토지 소유자의 의견을 들어야 한다.\n③ 제1항에 따른 표준지의 선정, 공시기준일, 공시의 시기, 조사ㆍ평가 기준 및 공시절차 등에 필요한 사항은 대통령령으로 정한다.\n④ 국토교통부장관이 제1항에 따라 표준지공시지가를 조사ㆍ평가하는 경우에는 인근 유사토지의 거래가격ㆍ임대료 및 해당 토지와 유사한 이용가치를 지닌다고 인정되는 토지의 조성에 필요한 비용추정액, 인근지역 및 다른 지역과의 형평성ㆍ특수성, 표준지공시지가 변동의 예측 가능성 등 제반사항을 종합적으로 참작하여야 한다. <개정 2020.4.7>\n⑤ 국토교통부장관이 제1항에 따라 표준지공시지가를 조사ㆍ평가할 때에는 업무실적, 신인도(信認度) 등을 고려하여 둘 이상의 「감정평가 및 감정평가사에 관한 법률」에 따른 감정평가법인등(이하 \"감정평가법인등\"이라 한다)에게 이를 의뢰하여야 한다. 다만, 지가 변동이 작은 경우 등 대통령령으로 정하는 기준에 해당하는 표준지에 대해서는 하나의 감정평가법인등에 의뢰할 수 있다. <개정 2020.4.7>\n⑥ 국토교통부장관은 제5항에 따라 표준지공시지가 조사ㆍ평가를 의뢰받은 감정평가업자가 공정하고 객관적으로 해당 업무를 수행할 수 있도록 하여야 한다. <신설 2020.4.7>\n⑦ 제5항에 따른 감정평가법인등의 선정기준 및 업무범위는 대통령령으로 정한다. <개정 2020.4.7>\n⑧ 국토교통부장관은 제10조에 따른 개별공시지가의 산정을 위하여 필요하다고 인정하는 경우에는 표준지와 산정대상 개별 토지의 가격형성요인에 관한 표준적인 비교표(이하 \"토지가격비준표\"라 한다)를 작성하여 시장ㆍ군수 또는 구청장에게 제공하여야 한다. <개정 2020.4.7>"
  - no: '4'
    title: 표준지공시지가의 조사협조
    text: 제4조(표준지공시지가의 조사협조) 국토교통부장관은 표준지의 선정 또는 표준지공시지가의 조사ㆍ평가를 위하여 필요한 경우에는 관계 행정기관에 해당 토지의 인ㆍ허가 내용, 개별법에 따른 등록사항 등 대통령령으로 정하는 관련 자료의 열람 또는 제출을 요구할 수 있다. 이 경우 관계 행정기관은 정당한 사유가 없으면 그 요구를 따라야 한다. <개정 2020.6.9>
  - no: '5'
    title: 표준지공시지가의 공시사항
    text: "제5조(표준지공시지가의 공시사항) 제3조에 따른 공시에는 다음 각 호의 사항이 포함되어야 한다.\n1. 표준지의 지번\n2. 표준지의 단위면적당 가격\n3. 표준지의 면적 및 형상\n4. 표준지 및 주변토지의 이용상황\n5. 그 밖에 대통령령으로 정하는 사항"
  - no: '6'
    title: 표준지공시지가의 열람 등
    text: 제6조(표준지공시지가의 열람 등) 국토교통부장관은 제3조에 따라 표준지공시지가를 공시한 때에는 그 내용을 특별시장ㆍ광역시장 또는 도지사를 거쳐 시장ㆍ군수 또는 구청장(지방자치단체인 구의 구청장에 한정한다. 이하 같다)에게 송부하여 일반인이 열람할 수 있게 하고, 대통령령으로 정하는 바에 따라 이를 도서ㆍ도표 등으로 작성하여 관계 행정기관 등에 공급하여야 한다.
  - no: '7'
    title: 표준지공시지가에 대한 이의신청
    text: "제7조(표준지공시지가에 대한 이의신청)\n① 표준지공시지가에 이의가 있는 자는 그 공시일부터 30일 이내에 서면(전자문서를 포함한다. 이하 같다)으로 국토교통부장관에게 이의를 신청할 수 있다.\n② 국토교통부장관은 제1항에 따른 이의신청 기간이 만료된 날부터 30일 이내에 이의신청을 심사하여 그 결과를 신청인에게 서면으로 통지하여야 한다. 이 경우 국토교통부장관은 이의신청의 내용이 타당하다고 인정될 때에는 제3조에 따라 해당 표준지공시지가를 조정하여 다시 공시하여야 한다.\n③ 제1항 및 제2항에서 규정한 것 외에 이의신청 및 처리절차 등에 필요한 사항은 대통령령으로 정한다."
  - no: '8'
    title: 표준지공시지가의 적용
    text: "제8조(표준지공시지가의 적용) 제1호 각 목의 자가 제2호 각 목의 목적을 위하여 지가를 산정할 때에는 그 토지와 이용가치가 비슷하다고 인정되는 하나 또는 둘 이상의 표준지의 공시지가를 기준으로 토지가격비준표를 사용하여 지가를 직접 산정하거나 감정평가법인등에 감정평가를 의뢰하여 산정할 수 있다. 다만, 필요하다고 인정할 때에는 산정된 지가를 제2호 각 목의 목적에 따라 가감(加減) 조정하여 적용할 수 있다. <개정 2020.4.7>\n1. 지가 산정의 주체\n2. 지가 산정의 목적"
  - no: '9'
    title: 표준지공시지가의 효력
    text: 제9조(표준지공시지가의 효력) 표준지공시지가는 토지시장에 지가정보를 제공하고 일반적인 토지거래의 지표가 되며, 국가ㆍ지방자치단체 등이 그 업무와 관련하여 지가를 산정하거나 감정평가법인등이 개별적으로 토지를 감정평가하는 경우에 기준이 된다. <개정 2020.4.7>
  - no: '10'
    title: 개별공시지가의 결정ㆍ공시 등
    text: "제10조(개별공시지가의 결정ㆍ공시 등)\n① 시장ㆍ군수 또는 구청장은 국세ㆍ지방세 등 각종 세금의 부과, 그 밖의 다른 법령에서 정하는 목적을 위한 지가산정에 사용되도록 하기 위하여 제25조에 따른 시ㆍ군ㆍ구부동산가격공시위원회의 심의를 거쳐 매년 공시지가의 공시기준일 현재 관할 구역 안의 개별토지의 단위면적당 가격(이하 \"개별공시지가\"라 한다)을 결정ㆍ공시하고, 이를 관계 행정기관 등에 제공하여야 한다.\n② 제1항에도 불구하고 표준지로 선정된 토지, 조세 또는 부담금 등의 부과대상이 아닌 토지, 그 밖에 대통령령으로 정하는 토지에 대하여는 개별공시지가를 결정ㆍ공시하지 아니할 수 있다. 이 경우 표준지로 선정된 토지에 대하여는 해당 토지의 표준지공시지가를 개별공시지가로 본다.\n③ 시장ㆍ군수 또는 구청장은 공시기준일 이후에 분할ㆍ합병 등이 발생한 토지에 대하여는 대통령령으로 정하는 날을 기준으로 하여 개별공시지가를 결정ㆍ공시하여야 한다.\n④ 시장ㆍ군수 또는 구청장이 개별공시지가를 결정ㆍ공시하는 경우에는 해당 토지와 유사한 이용가치를 지닌다고 인정되는 하나 또는 둘 이상의 표준지의 공시지가를 기준으로 토지가격비준표를 사용하여 지가를 산정하되, 해당 토지의 가격과 표준지공시지가가 균형을 유지하도록 하여야 한다.\n⑤ 시장ㆍ군수 또는 구청장은 개별공시지가를 결정ㆍ공시하기 위하여 개별토지의 가격을 산정할 때에는 그 타당성에 대하여 감정평가법인등의 검증을 받고 토지소유자, 그 밖의 이해관계인의 의견을 들어야 한다. 다만, 시장ㆍ군수 또는 구청장은 감정평가법인등의 검증이 필요 없다고 인정되는 때에는 지가의 변동상황 등 대통령령으로 정하는 사항을 고려하여 감정평가법인등의 검증을 생략할 수 있다. <개정 2020.4.7>\n⑥ 시장ㆍ군수 또는 구청장이 제5항에 따른 검증을 받으려는 때에는 해당 지역의 표준지의 공시지가를 조사ㆍ평가한 감정평가법인등 또는 대통령령으로 정하는 감정평가실적 등이 우수한 감정평가법인등에 의뢰하여야 한다. <개정 2020.4.7>\n⑦ 국토교통부장관은 지가공시 행정의 합리적인 발전을 도모하고 표준지공시지가와 개별공시지가와의 균형유지 등 적정한 지가형성을 위하여 필요하다고 인정하는 경우에는 개별공시지가의 결정ㆍ공시 등에 관하여 시장ㆍ군수 또는 구청장을 지도ㆍ감독할 수 있다.\n⑧ 제1항부터 제7항까지에서 규정한 것 외에 개별공시지가의 산정, 검증 및 결정, 공시기준일, 공시의 시기, 조사ㆍ산정의 기준, 이해관계인의 의견청취, 감정평가법인등의 지정 및 공시절차 등에 필요한 사항은 대통령령으로 정한다. <개정 2020.4.7>"
  - no: '11'
    title: 개별공시지가에 대한 이의신청
    text: "제11조(개별공시지가에 대한 이의신청)\n① 개별공시지가에 이의가 있는 자는 그 결정ㆍ공시일부터 30일 이내에 서면으로 시장ㆍ군수 또는 구청장에게 이의를 신청할 수 있다.\n② 시장ㆍ군수 또는 구청장은 제1항에 따라 이의신청 기간이 만료된 날부터 30일 이내에 이의신청을 심사하여 그 결과를 신청인에게 서면으로 통지하여야 한다. 이 경우 시장ㆍ군수 또는 구청장은 이의신청의 내용이 타당하다고 인정될 때에는 제10조에 따라 해당 개별공시지가를 조정하여 다시 결정ㆍ공시하여야 한다.\n③ 제1항 및 제2항에서 규정한 것 외에 이의신청 및 처리절차 등에 필요한 사항은 대통령령으로 정한다."
  - no: '12'
    title: 개별공시지가의 정정
    text: 제12조(개별공시지가의 정정) 시장ㆍ군수 또는 구청장은 개별공시지가에 틀린 계산, 오기, 표준지 선정의 착오, 그 밖에 대통령령으로 정하는 명백한 오류가 있음을 발견한 때에는 지체 없이 이를 정정하여야 한다.
  - no: '13'
    title: 타인토지에의 출입 등
    text: "제13조(타인토지에의 출입 등)\n① 관계 공무원 또는 부동산가격공시업무를 의뢰받은 자(이하 \"관계공무원등\"이라 한다)는 제3조제4항에 따른 표준지가격의 조사ㆍ평가 또는 제10조제4항에 따른 토지가격의 산정을 위하여 필요한 때에는 타인의 토지에 출입할 수 있다.\n② 관계공무원등이 제1항에 따라 택지 또는 담장이나 울타리로 둘러싸인 타인의 토지에 출입하고자 할 때에는 시장ㆍ군수 또는 구청장의 허가(부동산가격공시업무를 의뢰 받은 자에 한정한다)를 받아 출입할 날의 3일 전에 그 점유자에게 일시와 장소를 통지하여야 한다. 다만, 점유자를 알 수 없거나 부득이한 사유가 있는 경우에는 그러하지 아니하다.\n③ 일출 전ㆍ일몰 후에는 그 토지의 점유자의 승인 없이 택지 또는 담장이나 울타리로 둘러싸인 타인의 토지에 출입할 수 없다.\n④ 제2항에 따라 출입을 하고자 하는 자는 그 권한을 표시하는 증표와 허가증을 지니고 이를 관계인에게 내보여야 한다.\n⑤ 제4항에 따른 증표와 허가증에 필요한 사항은 국토교통부령으로 정한다."
  - no: '14'
    title: 개별공시지가의 결정ㆍ공시비용의 보조
    text: 제14조(개별공시지가의 결정ㆍ공시비용의 보조) 제10조에 따른 개별공시지가의 결정ㆍ공시에 소요되는 비용은 대통령령으로 정하는 바에 따라 그 일부를 국고에서 보조할 수 있다.
  - no: '15'
    title: 부동산 가격정보 등의 조사
    text: "제15조(부동산 가격정보 등의 조사)\n① 국토교통부장관은 부동산의 적정가격 조사 등 부동산 정책의 수립 및 집행을 위하여 부동산 시장동향, 수익률 등의 가격정보 및 관련 통계 등을 조사ㆍ관리하고, 이를 관계 행정기관 등에 제공할 수 있다.\n② 제1항에 따른 부동산 가격정보 등의 조사의 대상, 절차 등에 필요한 사항은 대통령령으로 정한다.\n③ 제1항에 따른 조사를 위하여 관계 행정기관에 국세, 지방세, 토지, 건물 등 관련 자료의 열람 또는 제출을 요구하거나 타인의 토지 등에 출입하는 경우에는 제4조 및 제13조를 각각 준용한다."
  - no: '16'
    title: 표준주택가격의 조사ㆍ산정 및 공시 등
    text: "제16조(표준주택가격의 조사ㆍ산정 및 공시 등)\n① 국토교통부장관은 용도지역, 건물구조 등이 일반적으로 유사하다고 인정되는 일단의 단독주택 중에서 선정한 표준주택에 대하여 매년 공시기준일 현재의 적정가격(이하 \"표준주택가격\"이라 한다)을 조사ㆍ산정하고, 제24조에 따른 중앙부동산가격공시위원회의 심의를 거쳐 이를 공시하여야 한다.\n② 제1항에 따른 공시에는 다음 각 호의 사항이 포함되어야 한다.\n1. 표준주택의 지번\n2. 표준주택가격\n3. 표준주택의 대지면적 및 형상\n4. 표준주택의 용도, 연면적, 구조 및 사용승인일(임시사용승인일을 포함한다)\n5. 그 밖에 대통령령으로 정하는 사항\n③ 제1항에 따른 표준주택의 선정, 공시기준일, 공시의 시기, 조사ㆍ산정 기준 및 공시절차 등에 필요한 사항은 대통령령으로 정한다.\n④ 국토교통부장관은 제1항에 따라 표준주택가격을 조사ㆍ산정하고자 할 때에는 「한국부동산원법」에 따른 한국부동산원(이하 \"부동산원\"이라 한다)에 의뢰한다. <개정 2020.6.9>\n⑤ 국토교통부장관이 제1항에 따라 표준주택가격을 조사ㆍ산정하는 경우에는 인근 유사 단독주택의 거래가격ㆍ임대료 및 해당 단독주택과 유사한 이용가치를 지닌다고 인정되는 단독주택의 건설에 필요한 비용추정액, 인근지역 및 다른 지역과의 형평성ㆍ특수성, 표준주택가격 변동의 예측 가능성 등 제반사항을 종합적으로 참작하여야 한다. <개정 2020.4.7>\n⑥ 국토교통부장관은 제17조에 따른 개별주택가격의 산정을 위하여 필요하다고 인정하는 경우에는 표준주택과 산정대상 개별주택의 가격형성요인에 관한 표준적인 비교표(이하 \"주택가격비준표\"라 한다)를 작성하여 시장ㆍ군수 또는 구청장에게 제공하여야 한다.\n⑦ 제3조제2항ㆍ제4조ㆍ제6조ㆍ제7조 및 제13조는 제1항에 따른 표준주택가격의 공시에 준용한다. 이 경우 제7조제2항 후단 중 \"제3조\"는 \"제16조\"로 본다."
  - no: '17'
    title: 개별주택가격의 결정ㆍ공시 등
    text: "제17조(개별주택가격의 결정ㆍ공시 등)\n① 시장ㆍ군수 또는 구청장은 제25조에 따른 시ㆍ군ㆍ구부동산가격공시위원회의 심의를 거쳐 매년 표준주택가격의 공시기준일 현재 관할 구역 안의 개별주택의 가격(이하 \"개별주택가격\"이라 한다)을 결정ㆍ공시하고, 이를 관계 행정기관 등에 제공하여야 한다.\n② 제1항에도 불구하고 표준주택으로 선정된 단독주택, 그 밖에 대통령령으로 정하는 단독주택에 대하여는 개별주택가격을 결정ㆍ공시하지 아니할 수 있다. 이 경우 표준주택으로 선정된 주택에 대하여는 해당 주택의 표준주택가격을 개별주택가격으로 본다.\n③ 제1항에 따른 개별주택가격의 공시에는 다음 각 호의 사항이 포함되어야 한다.\n1. 개별주택의 지번\n2. 개별주택가격\n3. 그 밖에 대통령령으로 정하는 사항\n④ 시장ㆍ군수 또는 구청장은 공시기준일 이후에 토지의 분할ㆍ합병이나 건축물의 신축 등이 발생한 경우에는 대통령령으로 정하는 날을 기준으로 하여 개별주택가격을 결정ㆍ공시하여야 한다.\n⑤ 시장ㆍ군수 또는 구청장이 개별주택가격을 결정ㆍ공시하는 경우에는 해당 주택과 유사한 이용가치를 지닌다고 인정되는 표준주택가격을 기준으로 주택가격비준표를 사용하여 가격을 산정하되, 해당 주택의 가격과 표준주택가격이 균형을 유지하도록 하여야 한다.\n⑥ 시장ㆍ군수 또는 구청장은 개별주택가격을 결정ㆍ공시하기 위하여 개별주택의 가격을 산정할 때에는 표준주택가격과의 균형 등 그 타당성에 대하여 대통령령으로 정하는 바에 따라 부동산원의 검증을 받고 토지소유자, 그 밖의 이해관계인의 의견을 들어야 한다. 다만, 시장ㆍ군수 또는 구청장은 부동산원의 검증이 필요 없다고 인정되는 때에는 주택가격의 변동상황 등 대통령령으로 정하는 사항을 고려하여 부동산원의 검증을 생략할 수 있다. <개정 2020.6.9>\n⑦ 국토교통부장관은 공시행정의 합리적인 발전을 도모하고 표준주택가격과 개별주택가격과의 균형유지 등 적정한 가격형성을 위하여 필요하다고 인정하는 경우에는 개별주택가격의 결정ㆍ공시 등에 관하여 시장ㆍ군수 또는 구청장을 지도ㆍ감독할 수 있다.\n⑧ 개별주택가격에 대한 이의신청 및 개별주택가격의 정정에 대하여는 제11조 및 제12조를 각각 준용한다. 이 경우 제11조제2항 후단 중 \"제10조\"는 \"제17조\"로 본다.\n⑨ 제1항부터 제8항까지에서 규정한 것 외에 개별주택가격의 산정, 검증 및 결정, 공시기준일, 공시의 시기, 조사ㆍ산정의 기준, 이해관계인의 의견청취 및 공시절차 등에 필요한 사항은 대통령령으로 정한다."
  - no: '18'
    title: 공동주택가격의 조사ㆍ산정 및 공시 등
    text: "제18조(공동주택가격의 조사ㆍ산정 및 공시 등)\n① 국토교통부장관은 공동주택에 대하여 매년 공시기준일 현재의 적정가격(이하 \"공동주택가격\"이라 한다)을 조사ㆍ산정하여 제24조에 따른 중앙부동산가격공시위원회의 심의를 거쳐 공시하고, 이를 관계 행정기관 등에 제공하여야 한다. 다만, 대통령령으로 정하는 바에 따라 국세청장이 국토교통부장관과 협의하여 공동주택가격을 별도로 결정ㆍ고시하는 경우는 제외한다. <개정 2020.6.9>\n② 국토교통부장관은 공동주택가격을 공시하기 위하여 그 가격을 산정할 때에는 대통령령으로 정하는 바에 따라 공동주택소유자와 그 밖의 이해관계인의 의견을 들어야 한다.\n③ 제1항에 따른 공동주택의 조사대상의 선정, 공시기준일, 공시의 시기, 공시사항, 조사ㆍ산정 기준 및 공시절차 등에 필요한 사항은 대통령령으로 정한다.\n④ 국토교통부장관은 공시기준일 이후에 토지의 분할ㆍ합병이나 건축물의 신축 등이 발생한 경우에는 대통령령으로 정하는 날을 기준으로 하여 공동주택가격을 결정ㆍ공시하여야 한다.\n⑤ 국토교통부장관이 제1항에 따라 공동주택가격을 조사ㆍ산정하는 경우에는 인근 유사 공동주택의 거래가격ㆍ임대료 및 해당 공동주택과 유사한 이용가치를 지닌다고 인정되는 공동주택의 건설에 필요한 비용추정액, 인근지역 및 다른 지역과의 형평성ㆍ특수성, 공동주택가격 변동의 예측 가능성 등 제반사항을 종합적으로 참작하여야 한다. <개정 2020.4.7>\n⑥ 국토교통부장관이 제1항에 따라 공동주택가격을 조사ㆍ산정하고자 할 때에는 부동산원에 의뢰한다. <개정 2020.6.9>\n⑦ 국토교통부장관은 제1항 또는 제4항에 따라 공시한 가격에 틀린 계산, 오기, 그 밖에 대통령령으로 정하는 명백한 오류가 있음을 발견한 때에는 지체 없이 이를 정정하여야 한다.\n⑧ 공동주택가격의 공시에 대하여는 제4조ㆍ제6조ㆍ제7조 및 제13조를 각각 준용한다. 이 경우 제7조제2항 후단 중 \"제3조\"는 \"제18조\"로 본다."
  - no: '19'
    title: 주택가격 공시의 효력
    text: "제19조(주택가격 공시의 효력)\n① 표준주택가격은 국가ㆍ지방자치단체 등이 그 업무와 관련하여 개별주택가격을 산정하는 경우에 그 기준이 된다.\n② 개별주택가격 및 공동주택가격은 주택시장의 가격정보를 제공하고, 국가ㆍ지방자치단체 등이 과세 등의 업무와 관련하여 주택의 가격을 산정하는 경우에 그 기준으로 활용될 수 있다."
  - no: '20'
    title: 비주거용 표준부동산가격의 조사ㆍ산정 및 공시 등
    text: "제20조(비주거용 표준부동산가격의 조사ㆍ산정 및 공시 등)\n① 국토교통부장관은 용도지역, 이용상황, 건물구조 등이 일반적으로 유사하다고 인정되는 일단의 비주거용 일반부동산 중에서 선정한 비주거용 표준부동산에 대하여 매년 공시기준일 현재의 적정가격(이하 \"비주거용 표준부동산가격\"이라 한다)을 조사ㆍ산정하고, 제24조에 따른 중앙부동산가격공시위원회의 심의를 거쳐 이를 공시할 수 있다.\n② 제1항에 따른 비주거용 표준부동산가격의 공시에는 다음 각 호의 사항이 포함되어야 한다.\n1. 비주거용 표준부동산의 지번\n2. 비주거용 표준부동산가격\n3. 비주거용 표준부동산의 대지면적 및 형상\n4. 비주거용 표준부동산의 용도, 연면적, 구조 및 사용승인일(임시사용승인일을 포함한다)\n5. 그 밖에 대통령령으로 정하는 사항\n③ 제1항에 따른 비주거용 표준부동산의 선정, 공시기준일, 공시의 시기, 조사ㆍ산정 기준 및 공시절차 등에 필요한 사항은 대통령령으로 정한다.\n④ 국토교통부장관은 제1항에 따라 비주거용 표준부동산가격을 조사ㆍ산정하려는 경우 감정평가법인등 또는 대통령령으로 정하는 부동산 가격의 조사ㆍ산정에 관한 전문성이 있는 자에게 의뢰한다. <개정 2020.4.7>\n⑤ 국토교통부장관이 비주거용 표준부동산가격을 조사ㆍ산정하는 경우에는 인근 유사 비주거용 일반부동산의 거래가격ㆍ임대료 및 해당 비주거용 일반부동산과 유사한 이용가치를 지닌다고 인정되는 비주거용 일반부동산의 건설에 필요한 비용추정액 등을 종합적으로 참작하여야 한다.\n⑥ 국토교통부장관은 제21조에 따른 비주거용 개별부동산가격의 산정을 위하여 필요하다고 인정하는 경우에는 비주거용 표준부동산과 산정대상 비주거용 개별부동산의 가격형성요인에 관한 표준적인 비교표(이하 \"비주거용 부동산가격비준표\"라 한다)를 작성하여 시장ㆍ군수 또는 구청장에게 제공하여야 한다.\n⑦ 비주거용 표준부동산가격의 공시에 대하여는 제3조제2항ㆍ제4조ㆍ제6조ㆍ제7조 및 제13조를 각각 준용한다. 이 경우 제7조제2항 후단 중 \"제3조\"는 \"제20조\"로 본다."
  - no: '21'
    title: 비주거용 개별부동산가격의 결정ㆍ공시 등
    text: "제21조(비주거용 개별부동산가격의 결정ㆍ공시 등)\n① 시장ㆍ군수 또는 구청장은 제25조에 따른 시ㆍ군ㆍ구부동산가격공시위원회의 심의를 거쳐 매년 비주거용 표준부동산가격의 공시기준일 현재 관할 구역 안의 비주거용 개별부동산의 가격(이하 \"비주거용 개별부동산가격\"이라 한다)을 결정ㆍ공시할 수 있다. 다만, 대통령령으로 정하는 바에 따라 행정안전부장관 또는 국세청장이 국토교통부장관과 협의하여 비주거용 개별부동산의 가격을 별도로 결정ㆍ고시하는 경우는 제외한다. <개정 2017.7.26>\n② 제1항에도 불구하고 비주거용 표준부동산으로 선정된 비주거용 일반부동산 등 대통령령으로 정하는 비주거용 일반부동산에 대하여는 비주거용 개별부동산가격을 결정ㆍ공시하지 아니할 수 있다. 이 경우 비주거용 표준부동산으로 선정된 비주거용 일반부동산에 대하여는 해당 비주거용 표준부동산가격을 비주거용 개별부동산가격으로 본다.\n③ 제1항에 따른 비주거용 개별부동산가격의 공시에는 다음 각 호의 사항이 포함되어야 한다.\n1. 비주거용 부동산의 지번\n2. 비주거용 부동산가격\n3. 그 밖에 대통령령으로 정하는 사항\n④ 시장ㆍ군수 또는 구청장은 공시기준일 이후에 토지의 분할ㆍ합병이나 건축물의 신축 등이 발생한 경우에는 대통령령으로 정하는 날을 기준으로 하여 비주거용 개별부동산가격을 결정ㆍ공시하여야 한다.\n⑤ 시장ㆍ군수 또는 구청장이 비주거용 개별부동산가격을 결정ㆍ공시하는 경우에는 해당 비주거용 일반부동산과 유사한 이용가치를 지닌다고 인정되는 비주거용 표준부동산가격을 기준으로 비주거용 부동산가격비준표를 사용하여 가격을 산정하되, 해당 비주거용 일반부동산의 가격과 비주거용 표준부동산가격이 균형을 유지하도록 하여야 한다.\n⑥ 시장ㆍ군수 또는 구청장은 비주거용 개별부동산가격을 결정ㆍ공시하기 위하여 비주거용 일반부동산의 가격을 산정할 때에는 비주거용 표준부동산가격과의 균형 등 그 타당성에 대하여 제20조에 따른 비주거용 표준부동산가격의 조사ㆍ산정을 의뢰 받은 자 등 대통령령으로 정하는 자의 검증을 받고 비주거용 일반부동산의 소유자와 그 밖의 이해관계인의 의견을 들어야 한다. 다만, 시장ㆍ군수 또는 구청장은 비주거용 개별부동산가격에 대한 검증이 필요 없다고 인정하는 때에는 비주거용 부동산가격의 변동상황 등 대통령령으로 정하는 사항을 고려하여 검증을 생략할 수 있다.\n⑦ 국토교통부장관은 공시행정의 합리적인 발전을 도모하고 비주거용 표준부동산가격과 비주거용 개별부동산가격과의 균형유지 등 적정한 가격형성을 위하여 필요하다고 인정하는 경우에는 비주거용 개별부동산가격의 결정ㆍ공시 등에 관하여 시장ㆍ군수 또는 구청장을 지도ㆍ감독할 수 있다.\n⑧ 비주거용 개별부동산가격에 대한 이의신청 및 정정에 대하여는 제11조 및 제12를 각각 준용한다. 이 경우 제11조제2항 후단 중 \"제10조\"는 \"제21조\"로 본다.\n⑨ 제1항부터 제8항까지에서 규정한 것 외에 비주거용 개별부동산가격의 산정, 검증 및 결정, 공시기준일, 공시의 시기, 조사ㆍ산정의 기준, 이해관계인의 의견청취 및 공시절차 등에 필요한 사항은 대통령령으로 정한다."
  - no: '22'
    title: 비주거용 집합부동산가격의 조사ㆍ산정 및 공시 등
    text: "제22조(비주거용 집합부동산가격의 조사ㆍ산정 및 공시 등)\n① 국토교통부장관은 비주거용 집합부동산에 대하여 매년 공시기준일 현재의 적정가격(이하 \"비주거용 집합부동산가격\"이라 한다)을 조사ㆍ산정하여 제24조에 따른 중앙부동산가격공시위원회의 심의를 거쳐 공시할 수 있다. 이 경우 시장ㆍ군수 또는 구청장은 비주거용 집합부동산가격을 결정ㆍ공시한 경우에는 이를 관계 행정기관 등에 제공하여야 한다.\n② 제1항에도 불구하고 대통령령으로 정하는 바에 따라 행정안전부장관 또는 국세청장이 국토교통부장관과 협의하여 비주거용 집합부동산의 가격을 별도로 결정ㆍ고시하는 경우에는 해당 비주거용 집합부동산의 비주거용 개별부동산가격을 결정ㆍ공시하지 아니한다. <개정 2017.7.26>\n③ 국토교통부장관은 비주거용 집합부동산가격을 공시하기 위하여 비주거용 집합부동산의 가격을 산정할 때에는 대통령령으로 정하는 바에 따라 비주거용 집합부동산의 소유자와 그 밖의 이해관계인의 의견을 들어야 한다.\n④ 제1항에 따른 비주거용 집합부동산의 조사대상의 선정, 공시기준일, 공시의 시기, 공시사항, 조사ㆍ산정 기준 및 공시절차 등에 필요한 사항은 대통령령으로 정한다.\n⑤ 국토교통부장관은 공시기준일 이후에 토지의 분할ㆍ합병이나 건축물의 신축 등이 발생한 경우에는 대통령령으로 정하는 날을 기준으로 하여 비주거용 집합부동산가격을 결정ㆍ공시하여야 한다.\n⑥ 국토교통부장관이 제1항에 따라 비주거용 집합부동산가격을 조사ㆍ산정하는 경우에는 인근 유사 비주거용 집합부동산의 거래가격ㆍ임대료 및 해당 비주거용 집합부동산과 유사한 이용가치를 지닌다고 인정되는 비주거용 집합부동산의 건설에 필요한 비용추정액 등을 종합적으로 참작하여야 한다.\n⑦ 국토교통부장관은 제1항에 따라 비주거용 집합부동산가격을 조사ㆍ산정할 때에는 부동산원 또는 대통령령으로 정하는 부동산 가격의 조사ㆍ산정에 관한 전문성이 있는 자에게 의뢰한다. <개정 2020.6.9>\n⑧ 국토교통부장관은 제1항 또는 제4항에 따라 공시한 가격에 틀린 계산, 오기, 그 밖에 대통령령으로 정하는 명백한 오류가 있음을 발견한 때에는 지체 없이 이를 정정하여야 한다.\n⑨ 비주거용 집합부동산가격의 공시에 대해서는 제4조ㆍ제6조ㆍ제7조 및 제13조를 각각 준용한다. 이 경우 제7조제2항 후단 중 \"제3조\"는 \"제22조\"로 본다."
  - no: '23'
    title: 비주거용 부동산가격공시의 효력
    text: "제23조(비주거용 부동산가격공시의 효력)\n① 제20조에 따른 비주거용 표준부동산가격은 국가ㆍ지방자치단체 등이 그 업무와 관련하여 비주거용 개별부동산가격을 산정하는 경우에 그 기준이 된다.\n② 제21조 및 제22조에 따른 비주거용 개별부동산가격 및 비주거용 집합부동산가격은 비주거용 부동산시장에 가격정보를 제공하고, 국가ㆍ지방자치단체 등이 과세 등의 업무와 관련하여 비주거용 부동산의 가격을 산정하는 경우에 그 기준으로 활용될 수 있다."
  - no: '24'
    title: 중앙부동산가격공시위원회
    text: "제24조(중앙부동산가격공시위원회)\n① 다음 각 호의 사항을 심의하기 위하여 국토교통부장관 소속으로 중앙부동산가격공시위원회(이하 이 조에서 \"위원회\"라 한다)를 둔다. <개정 2020.4.7, 2020.6.9>\n1. 부동산 가격공시 관계 법령의 제정ㆍ개정에 관한 사항 중 국토교통부장관이 심의에 부치는 사항\n2. 제3조에 따른 표준지의 선정 및 관리지침\n3. 제3조에 따라 조사ㆍ평가된 표준지공시지가\n4. 제7조에 따른 표준지공시지가에 대한 이의신청에 관한 사항\n5. 제16조에 따른 표준주택의 선정 및 관리지침\n6. 제16조에 따라 조사ㆍ산정된 표준주택가격\n7. 제16조에 따른 표준주택가격에 대한 이의신청에 관한 사항\n8. 제18조에 따른 공동주택의 조사 및 산정지침\n9. 제18조에 따라 조사ㆍ산정된 공동주택가격\n10. 제18조에 따른 공동주택가격에 대한 이의신청에 관한 사항\n11. 제20조에 따른 비주거용 표준부동산의 선정 및 관리지침\n12. 제20조에 따라 조사ㆍ산정된 비주거용 표준부동산가격\n13. 제20조에 따른 비주거용 표준부동산가격에 대한 이의신청에 관한 사항\n14. 제22조에 따른 비주거용 집합부동산의 조사 및 산정 지침\n15. 제22조에 따라 조사ㆍ산정된 비주거용 집합부동산가격\n16. 제22조에 따른 비주거용 집합부동산가격에 대한 이의신청에 관한 사항\n17. 제26조의2에 따른 계획 수립에 관한 사항\n18. 그 밖에 부동산정책에 관한 사항 등 국토교통부장관이 심의에 부치는 사항\n② 위원회는 위원장을 포함한 20명 이내의 위원으로 구성한다.\n③ 위원회의 위원장은 국토교통부 제1차관이 된다.\n④ 위원회의 위원은 대통령령으로 정하는 중앙행정기관의 장이 지명하는 6명 이내의 공무원과 다음 각 호의 어느 하나에 해당하는 사람 중 국토교통부장관이 위촉하는 사람이 된다.\n1. 「고등교육법」에 따른 대학에서 토지ㆍ주택 등에 관한 이론을 가르치는 조교수 이상으로 재직하고 있거나 재직하였던 사람\n2. 판사, 검사, 변호사 또는 감정평가사의 자격이 있는 사람\n3. 부동산가격공시 또는 감정평가 관련 분야에서 10년 이상 연구 또는 실무경험이 있는 사람\n⑤ 공무원이 아닌 위원의 임기는 2년으로 하되, 한차례 연임할 수 있다.\n⑥ 국토교통부장관은 필요하다고 인정하면 위원회의 심의에 부치기 전에 미리 관계 전문가의 의견을 듣거나 조사ㆍ연구를 의뢰할 수 있다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 위원회의 조직 및 운영에 필요한 사항은 대통령령으로 정한다."
  - no: '25'
    title: 시ㆍ군ㆍ구부동산가격공시위원회
    text: "제25조(시ㆍ군ㆍ구부동산가격공시위원회)\n① 다음 각 호의 사항을 심의하기 위하여 시장ㆍ군수 또는 구청장 소속으로 시ㆍ군ㆍ구부동산가격공시위원회를 둔다. <개정 2020.6.9>\n1. 제10조에 따른 개별공시지가의 결정에 관한 사항\n2. 제11조에 따른 개별공시지가에 대한 이의신청에 관한 사항\n3. 제17조에 따른 개별주택가격의 결정에 관한 사항\n4. 제17조에 따른 개별주택가격에 대한 이의신청에 관한 사항\n5. 제21조에 따른 비주거용 개별부동산가격의 결정에 관한 사항\n6. 제21조에 따른 비주거용 개별부동산가격에 대한 이의신청에 관한 사항\n7. 그 밖에 시장ㆍ군수 또는 구청장이 심의에 부치는 사항\n② 제1항에 규정된 것 외에 시ㆍ군ㆍ구부동산가격공시위원회의 조직 및 운영에 필요한 사항은 대통령령으로 정한다."
  - no: '26'
    title: 공시보고서의 제출 등
    text: "제26조(공시보고서의 제출 등)\n① 정부는 표준지공시지가, 표준주택가격 및 공동주택가격의 주요사항에 관한 보고서를 매년 정기국회의 개회 전까지 국회에 제출하여야 한다. <개정 2020.4.7>\n② 국토교통부장관은 제3조에 따른 표준지공시지가, 제16조에 따른 표준주택가격, 제18조에 따른 공동주택가격, 제20조에 따른 비주거용 표준부동산가격 및 제22조에 따른 비주거용 집합부동산가격을 공시하는 때에는 부동산의 시세 반영률, 조사ㆍ평가 및 산정 근거 등의 자료를 국토교통부령으로 정하는 바에 따라 인터넷 홈페이지 등에 공개하여야 한다. <신설 2020.4.7>"
  - no: 26의2
    title: 적정가격 반영을 위한 계획 수립 등
    text: "제26조의2(적정가격 반영을 위한 계획 수립 등)\n① 국토교통부장관은 부동산공시가격이 적정가격을 반영하고 부동산의 유형ㆍ지역 등에 따른 균형성을 확보하기 위하여 부동산의 시세 반영률의 목표치를 설정하고, 이를 달성하기 위하여 대통령령으로 정하는 바에 따라 계획을 수립하여야 한다.\n② 제1항에 따른 계획을 수립하는 때에는 부동산 가격의 변동 상황, 지역 간의 형평성, 해당 부동산의 특수성 등 제반사항을 종합적으로 고려하여야 한다.\n③ 국토교통부장관이 제1항에 따른 계획을 수립하는 때에는 관계 행정기관과의 협의를 거쳐 공청회를 실시하고, 제24조에 따른 중앙부동산가격공시위원회의 심의를 거쳐야 한다.\n④ 국토교통부장관, 시장ㆍ군수 또는 구청장은 부동산공시가격을 결정ㆍ공시하는 경우 제1항에 따른 계획에 부합하도록 하여야 한다."
  - no: '27'
    title: 공시가격정보체계의 구축 및 관리
    text: "제27조(공시가격정보체계의 구축 및 관리)\n① 국토교통부장관은 토지, 주택 및 비주거용 부동산의 공시가격과 관련된 정보를 효율적이고 체계적으로 관리하기 위하여 공시가격정보체계를 구축ㆍ운영할 수 있다.\n② 국토교통부장관은 제1항에 따른 공시가격정보체계를 구축하기 위하여 필요한 경우 관계 기관에 자료를 요청할 수 있다. 이 경우 관계 기관은 정당한 사유가 없으면 그 요청을 따라야 한다. <개정 2020.6.9>\n③ 제1항 및 제2항에 따른 정보 및 자료의 종류, 공시가격정보체계의 구축ㆍ운영방법 등에 필요한 사항은 대통령령으로 정한다."
  - no: 27의2
    title: 회의록의 공개
    text: 제27조의2(회의록의 공개) 제24조에 따른 중앙부동산가격공시위원회 및 제25조에 따른 시ㆍ군ㆍ구부동산가격공시위원회 심의의 일시ㆍ장소ㆍ안건ㆍ내용ㆍ결과 등이 기록된 회의록은 3개월의 범위에서 대통령령으로 정하는 기간이 지난 후에는 대통령령으로 정하는 바에 따라 인터넷 홈페이지 등에 공개하여야 한다. 다만, 공익을 현저히 해할 우려가 있거나 심의의 공정성을 침해할 우려가 있다고 인정되는 이름, 주민등록번호 등 대통령령으로 정하는 개인 식별 정보에 관한 부분의 경우에는 그러하지 아니하다.
  - no: '28'
    title: 업무위탁
    text: "제28조(업무위탁)\n① 국토교통부장관은 다음 각 호의 업무를 부동산원 또는 국토교통부장관이 정하는 기관에 위탁할 수 있다. <개정 2020.4.7, 2020.6.9>\n1. 다음 각 목의 업무 수행에 필요한 부대업무\n2. 제6조에 따른 표준지공시지가, 제16조제7항에 따른 표준주택가격, 제18조제8항에 따른 공동주택가격, 제20조제7항에 따른 비주거용 표준부동산가격 및 제22조제9항에 따른 비주거용 집합부동산가격에 관한 도서ㆍ도표 등 작성ㆍ공급\n3. 제3조제8항, 제16조제6항 및 제20조제6항에 따른 토지가격비준표, 주택가격비준표 및 비주거용 부동산가격비준표의 작성ㆍ제공\n4. 제15조에 따른 부동산 가격정보 등의 조사\n5. 제27조에 따른 공시가격정보체계의 구축 및 관리\n6. 제1호부터 제5호까지의 업무와 관련된 업무로서 대통령령으로 정하는 업무\n② 국토교통부장관은 제1항에 따라 그 업무를 위탁할 때에는 예산의 범위에서 필요한 경비를 보조할 수 있다."
  - no: '29'
    title: 수수료 등
    text: "제29조(수수료 등)\n① 부동산원 및 감정평가법인등은 이 법에 따른 표준지공시지가의 조사ㆍ평가, 개별공시지가의 검증, 부동산 가격정보ㆍ통계 등의 조사, 표준주택가격의 조사ㆍ산정, 개별주택가격의 검증, 공동주택가격의 조사ㆍ산정, 비주거용 표준부동산가격의 조사ㆍ산정, 비주거용 개별부동산가격의 검증 및 비주거용 집합부동산가격의 조사ㆍ산정 등의 업무수행을 위한 수수료와 출장 또는 사실 확인 등에 소요된 실비를 받을 수 있다. <개정 2020.4.7, 2020.6.9>\n② 제1항에 따른 수수료의 요율 및 실비의 범위는 국토교통부장관이 정하여 고시한다."
  - no: '30'
    title: 벌칙 적용에서 공무원 의제
    text: "제30조(벌칙 적용에서 공무원 의제) 다음 각 호의 어느 하나에 해당하는 사람은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다.\n1. 제28조제1항에 따라 업무를 위탁받은 기관의 임직원\n2. 중앙부동산가격공시위원회의 위원 중 공무원이 아닌 위원"
source: https://www.law.go.kr/법령/부동산가격공시에관한법률
fetched_at: '2026-09-30'
