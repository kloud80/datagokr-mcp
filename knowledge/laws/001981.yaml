  - no: '24'
    title: 댐사용권의 설정
    text: "제24조(댐사용권의 설정)\n① 댐사용권은 다목적댐의 저수를 특정용도에 사용하려는 자의 신청을 받아 기후에너지환경부장관이 설정한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n② 기후에너지환경부장관은 제1항에 따라 댐사용권을 설정할 때에는 다음 각 호의 사항을 명백히 하여야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n1. 설정목적\n2. 댐사용권에 따라 확보될 저수의 최고ㆍ최저 수위(水位)와 저수량\n③ 제2항제2호의 사항은 해당 댐의 효용이 제대로 발휘될 수 있도록 정하여야 한다.\n④ 기후에너지환경부장관은 제16조에 따라 댐건설 완료 고시를 하였을 때에는 지체 없이 해당 댐사용권설정예정자에게 댐사용권을 설정하여 주어야 한다. <개정 2013.3.23, 2018.6.8, 2021.6.15, 2025.10.1>\n⑤ 댐사용권설정예정자는 제1항에 따라 댐사용권을 설정받기 전이라도 기후에너지환경부장관의 허가를 받아 다목적댐의 저수를 특정용도에 사용할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>"
  - no: '25'
    title: 댐사용권의 설정요건
    text: "제25조(댐사용권의 설정요건) 기후에너지환경부장관은 신청인이 다음 각 호의 요건을 갖춘 경우에만 댐사용권을 설정하여야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n1. 댐사용권을 설정하려는 용도에 다목적댐의 저수를 사용하는 것이 기본계획에 적합한 경우\n2. 다목적댐의 저수를 이용하려는 사업을 하는 데에 필요한 허가ㆍ인가 등을 받은 경우"
  - no: '26'
    title: 특정용도를 위한 하천점용의 제한
    text: 제26조(특정용도를 위한 하천점용의 제한) 다목적댐의 저수를 특정용도에 사용하려는 자는 「하천법」 제33조에 따른 하천의 점용허가와 같은 법 제50조에 따른 하천수의 사용허가를 받고 제24조에 따른 댐사용권을 설정받아야 한다.
  - no: '27'
    title: 댐사용권설정의 거부
    text: "제27조(댐사용권설정의 거부)\n① 기후에너지환경부장관은 기본계획에 댐사용권설정예정자로 정하여진 자가 아닌 자에 대하여는 댐사용권의 설정을 거부할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n② 기후에너지환경부장관은 다음 각 호의 어느 하나에 해당하는 경우에는 댐사용권설정예정자에 대한 댐사용권설정을 거부하여야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n1. 댐사용권설정예정자가 제25조의 요건에 적합하지 아니한 경우\n2. 제20조제1항에 따른 부담금을 납부하지 아니한 경우"
  - no: '28'
    title: 저수가 확보될 지역
    text: 제28조(저수가 확보될 지역) 댐사용권에 따라 저수가 확보될 지역은 제24조제2항제2호에 따른 저수의 최고수위면이 토지에 접속되는 선으로 둘러싸인 지역으로 한다.
  - no: '29'
    title: 댐사용권의 성질
    text: 제29조(댐사용권의 성질) 댐사용권은 물권(物權)으로 보며, 이 법에 특별한 규정이 있는 경우를 제외하고는 부동산에 관한 규정을 준용한다.
  - no: '30'
    title: 댐사용권의 처분제한
    text: "제30조(댐사용권의 처분제한)\n① 댐사용권은 상속, 법인의 합병 또는 그 밖의 포괄승계, 양도, 체납처분, 강제집행 및 저당권의 목적이 되는 외에 다른 권리의 목적으로 할 수 없다.\n② 저당권설정등록이 된 댐사용권은 그 저당권자의 동의가 없으면 분할ㆍ병합 또는 포기하거나 그 설정목적을 변경할 수 없다."
  - no: '31'
    title: 댐사용권에 대한 취소 등
    text: "제31조(댐사용권에 대한 취소 등)\n① 기후에너지환경부장관은 댐사용권자에 대하여 「하천법」 제33조에 따른 하천의 점용허가와 같은 법 제50조에 따른 하천수의 사용허가의 전부 또는 일부를 취소하는 경우에 해당 댐사용권자 외의 자에 대하여는 종전과 같은 하천수 사용을 인정할 수 없을 때에는 댐사용권자에 대한 점용허가 등의 취소에 상응하여 그 댐사용권을 취소하거나 변경하도록 하여야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n② 기후에너지환경부장관은 댐사용권자에 대하여 「하천법」 제33조에 따른 하천의 점용허가와 같은 법 제50조에 따른 하천수의 사용허가의 전부 또는 일부를 취소하는 경우에 해당 댐사용권자 외의 자에 대하여 새로 하천수 사용을 인정할 필요가 있을 때에는 해당 댐사용권자에게 적절한 기간을 정하여 댐사용권의 전부 또는 일부를 다른 자에게 양도하도록 명할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n③ 기후에너지환경부장관은 제2항에 따른 기간에 댐사용권자가 그 댐사용권을 양도하지 아니할 때에는 해당 댐사용권자 외의 자가 댐사용권자에 대한 하천수의 사용허가와 같은 내용의 하천수의 사용허가를 받을 수 있는 경우에만 해당 댐사용권의 전부 또는 일부를 취소할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n④ 기후에너지환경부장관은 다음 각 호의 어느 하나에 해당하는 경우로 댐사용권을 그대로 유지하는 것이 곤란한 경우에는 댐사용권에 대한 취소 또는 변경의 처분을 할 수 있다. 이 경우 미리 댐사용권자의 의견을 들어야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n1. 댐의 증축ㆍ개축 등으로 저수용량이 변경된 경우\n2. 댐의 저수 이용상황 등이 변경된 경우\n⑤ 기후에너지환경부장관은 제4항에 따라 댐사용권에 대한 취소나 변경의 처분을 하는 경우에는 제11조제4항에 따라 고시된 기본계획 중 저수의 용도별 배분에 관한 사항을 변경하여 고시하여야 한다. <개정 2013.3.23, 2018.6.8, 2021.6.15, 2025.10.1>"
  - no: '32'
    title: 등록
    text: "제32조(등록)\n① 댐사용권과 댐사용권을 목적으로 하는 저당권의 설정ㆍ변경ㆍ이전ㆍ소멸과 처분의 제한은 기후에너지환경부에 갖추어 두는 댐사용권등록부에 등록하지 아니하면 그 효력이 없다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n② 제1항에서 규정한 사항 외에 댐사용권과 댐사용권을 목적으로 하는 저당권의 등록에 필요한 사항은 대통령령으로 정한다."
  - no: '33'
    title: 납부금
    text: 제33조(납부금) 댐사용권자는 제24조제4항에 따라 댐사용권을 설정받은 경우를 제외하고는 대통령령으로 정하는 바에 따라 산출한 금액의 납부금을 국고에 납부하여야 한다. 이 경우 납부금을 산출할 때에는 제20조제2항제1호에 따라 산정한 추정투자액을 고려하여야 한다.
  - no: '34'
    title: 부담금 등의 반환
    text: "제34조(부담금 등의 반환)\n① 국가는 제31조에 따라 댐사용권에 대하여 취소 또는 변경의 처분을 하였을 때에는 제20조제1항에 따라 납부된 부담금이나 제33조에 따라 납부된 납부금의 일부를 반환하여야 한다.\n② 제1항에 따라 반환할 금액은 해당 부담금이나 납부금의 산출방법과 동일한 방법으로 산출하되, 제24조제4항에 따라 댐사용권을 설정받은 자에게 반환할 금액은 제20조제1항에 따른 부담금에서 대통령령으로 정하는 바에 따라 산정한 상각액을 뺀 금액을 초과하여서는 아니 된다.\n③ 국가는 제31조에 따른 취소나 변경의 처분으로 소멸한 댐사용권에 저당권설정등록이 되어 있을 때에는 그 저당권자가 승낙한 경우를 제외하고는 제1항에 따른 반환금을 공탁하여야 한다. 이 경우 댐사용권에 대한 저당권자는 공탁된 반환금에 대하여 권리를 행사할 수 있다."
  - no: '35'
    title: 사용료의 수납 등
    text: "제35조(사용료의 수납 등)\n① 댐사용권자나 댐사용권설정예정자는 해당 댐의 저수를 사용하는 자로부터 사용료를 받을 수 있다. 다만, 댐건설 이전에 「하천법」 제50조에 따른 하천수의 사용허가를 받아 하천의 물을 사용하는 경우에는 사용료를 받지 아니한다.\n② 제1항에 따른 사용료는 댐사용권자나 댐사용권설정예정자가 제20조제1항에 따라 부담한 금액이나 제33조에 따라 납부한 금액의 범위에서 댐의 저수를 사용하는 자가 사용하는 수량 등을 고려하여 정하여야 한다.\n③ 댐사용권자나 댐사용권설정예정자는 제1항에 따라 사용료를 받으려는 경우에는 그 산출방법과 수납방법 및 수납기한 등을 정하여 미리 기후에너지환경부장관의 승인을 받아야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>"
  - no: '36'
    title: 다목적댐관리비용의 부담
    text: "제36조(다목적댐관리비용의 부담)\n① 다목적댐의 유지, 수리 또는 그 밖의 관리에 필요한 비용은 국고ㆍ댐사용권자 또는 댐수탁관리자의 부담으로 한다. 이 경우 댐수탁관리자가 부담하는 비용은 해당 댐의 수탁관리에 따른 수입의 범위이어야 한다.\n② 제1항에 따른 비용의 부담에 필요한 사항은 대통령령으로 정한다."
  - no: '37'
    title: 부담금 등의 강제징수
    text: "제37조(부담금 등의 강제징수)\n① 기후에너지환경부장관은 다음 각 호의 어느 하나에 해당하는 부담금 또는 납부금을 납부하지 아니한 자가 있을 때에는 납부기한을 정하여 서면으로 독촉하여야 한다. <개정 2013.3.23, 2016.12.2, 2018.6.8, 2025.3.25, 2025.10.1>\n1. 제20조제1항에 따른 부담금\n2. 삭제<2025.3.25>\n3. 제33조에 따른 납부금\n4. 제36조에 따른 댐사용권자의 부담금\n② 기후에너지환경부장관은 제1항에 따른 독촉을 받은 자가 그 납부기한까지 부담금 및 납부금을 납부하지 아니할 때에는 국세 체납처분의 예에 따라 징수할 수 있다. <개정 2013.3.23, 2016.12.2, 2018.6.8, 2025.3.25, 2025.10.1>\n③ 제1항에 따른 부담금과 납부금을 징수할 권리는 5년간 행사하지 아니하면 시효로 소멸한다. <개정 2016.12.2, 2025.3.25>"
  - no: '38'
    title: 다목적댐의 인정 등
    text: "제38조(다목적댐의 인정 등)\n① 기후에너지환경부장관은 기후에너지환경부장관 외의 자가 건설한 댐으로 다목적댐으로서의 효용이 큰 댐에 대하여는 해당 댐을 건설한 자와 협의하여 정당한 보상을 하고 해당 댐을 이 법에 따른 다목적댐으로 할 수 있다. 이 경우 기후에너지환경부장관은 대통령령으로 정하는 바에 따라 해당 댐을 건설한 자에게 댐사용권을 설정하여 줄 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n② 기후에너지환경부장관은 제1항에 따라 다목적댐이 아닌 댐을 다목적댐으로 한 경우에는 대통령령으로 정하는 바에 따라 지체 없이 다음 각 호의 사항을 고시하여야 한다. <개정 2013.3.23, 2018.6.8, 2021.6.15, 2025.10.1>\n1. 다목적댐 인정 사유\n2. 제11조제1항제2호부터 제4호까지의 사항\n3. 해당 댐을 건설한 자에 대한 보상에 관한 사항\n③ 국가는 기후에너지환경부장관 외의 자가 건설하는 댐으로 다목적댐으로서의 효용이 큰 댐에 대하여는 해당 댐을 건설하는 자에게 건설에 필요한 비용의 일부를 보조하거나 대출을 알선할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n④ 기후에너지환경부장관은 제3항에 따라 보조를 하거나 대출을 알선하였을 때에는 그 보조나 대출을 받은 자에게 해당 댐건설에 관한 지시를 하거나 건설의 목적인 해당 댐의 시설을 검사하거나 보고하게 할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>"
  - no: '39'
    title: 이주정착지 미이주자 등에 대한 지원
    text: 제39조(이주정착지 미이주자 등에 대한 지원) 댐건설사업시행자는 수몰이주민 중 이주정착지에 이주하지 아니하는 자와 그 밖에 대통령령으로 정하는 자에게 댐건설로 인한 실향 및 생활기반 상실 등을 고려하여 대통령령으로 정하는 바에 따라 지원을 할 수 있다. <개정 2021.6.15>
  - no: '40'
    title: 수몰이주민에 대한 지원
    text: "제40조(수몰이주민에 대한 지원)\n① 기후에너지환경부장관은 수몰이주민이 원활하게 이주하여 정착할 수 있도록 주택의 신축 등 생활기반을 조성하기 위하여 필요한 경우 「주택도시기금법」에 따른 주택도시기금을 우선하여 지원하도록 국토교통부장관에게 요청할 수 있다. <개정 2013.3.23, 2015.1.6, 2018.6.8, 2025.10.1>\n② 댐건설사업시행자는 수몰이주민의 생활기반조성을 위하여 필요한 때에는 기후에너지환경부장관에게 「주택도시기금법」에 따른 주택도시기금의 우선지원을 요청할 수 있다. <개정 2013.3.23, 2015.1.6, 2018.6.8, 2025.10.1>\n③ 댐건설지역을 관할하거나 댐건설에 따라 용수(用水)의 혜택을 받는 지역을 관할하는 지방자치단체의 장과 댐수탁관리예정자는 대통령령으로 정하는 바에 따라 직업훈련의 실시 등 수몰이주민의 생계지원을 위하여 필요한 조치를 할 수 있다."
  - no: '41'
    title: 댐주변지역정비사업
    text: "제41조(댐주변지역정비사업)\n① 대통령령으로 정하는 기준 이상의 댐의 주변지역을 관할하는 시장ㆍ군수 또는 구청장은 해당 댐의 건설로 여건이 변할 것을 고려하여 해당 댐 주변지역의 경제를 진흥하고 생활환경을 개선하기 위하여 댐건설기간에 정비사업(이하 \"댐주변지역정비사업\"이라 한다)을 시행하여야 한다.\n② 제1항의 기준에 해당하는 댐의 기본계획이 고시된 경우에는 댐의 본체가 있는 지역을 관할하는 시ㆍ도지사는 지체 없이 댐주변지역정비사업에 관한 계획을 수립하여 기후에너지환경부장관의 승인을 받아야 한다. 다만, 시ㆍ도지사 또는 시장ㆍ군수가 건설하는 댐인 경우에는 기후에너지환경부장관의 승인을 필요로 하지 아니한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n③ 시ㆍ도지사는 제2항에 따라 댐주변지역정비사업에 관한 계획을 수립하려는 경우에는 미리 댐건설사업시행자 및 관할 시장ㆍ군수 또는 구청장과 협의하여야 한다.\n④ 제1항에 따른 댐 주변지역의 범위와 댐주변지역정비사업의 구체적인 내용에 관한 사항은 대통령령으로 정한다."
  - no: '42'
    title: 댐주변지역정비사업의 재원
    text: "제42조(댐주변지역정비사업의 재원)\n① 댐주변지역정비사업은 다음 각 호의 총저수용량에 따른 기초금액과 저수면적, 총저수용량, 수몰세대와 지역특성에 따른 개발수요 등을 고려하여 대통령령으로 정하는 방법에 따라 산정한 추가금액을 합한 기준금액의 범위에서 시행한다. <개정 2012.1.17>\n1. 20백만세제곱미터 이상 150백만세제곱미터 미만: 300억원\n2. 150백만세제곱미터 이상: 400억원\n② 댐주변지역정비사업에 드는 재원은 댐건설사업시행자와 관할 시장ㆍ군수 또는 구청장이 부담한다.\n③ 제2항에 따른 댐주변지역정비사업의 재원의 구체적인 부담기준과 관리에 관한 사항은 대통령령으로 정한다."
  - no: '43'
    title: 댐주변지역지원사업
    text: "제43조(댐주변지역지원사업)\n① 댐관리청이나 댐수탁관리자는 댐건설이 완료된 후 대통령령으로 정하는 댐 주변지역의 주민소득 증대와 복지 증진 등을 도모하기 위하여 매년 대통령령으로 정하는 바에 따라 댐 주변지역의 지원사업(이하 \"댐주변지역지원사업\"이라 한다)에 관한 계획을 수립하여야 한다.\n② 댐관리청이나 댐수탁관리자는 제1항에 따라 댐주변지역지원사업에 관한 계획을 수립하려는 경우에는 미리 댐 주변지역을 관할하는 시장ㆍ군수 또는 구청장과 협의하여야 한다.\n③ 댐수탁관리자는 제1항에 따라 댐주변지역지원사업에 관한 계획을 수립하였을 때에는 이를 댐관리청에 제출하여야 한다.\n④ 댐주변지역지원사업은 대통령령으로 정하는 바에 따라 다음 각 호의 어느 하나에 해당하는 자가 시행한다.\n1. 댐관리청 또는 댐수탁관리자\n2. 댐 주변지역을 관할하는 시장ㆍ군수 또는 구청장\n⑤ 제1항에 따른 댐주변지역지원사업에 관한 계획을 수립하여야 하는 지역의 범위는 대통령령으로 정한다."
  - no: '44'
    title: 댐주변지역지원사업의 재원
    text: "제44조(댐주변지역지원사업의 재원)\n① 댐주변지역지원사업에 필요한 재원은 다음 각 호의 자금으로 조성한다. 다만, 제1호와 제2호의 출연금은 제43조에 따른 댐주변지역지원사업의 대상 댐으로 한정한다.\n1. 댐관리청이나 댐사용권자의 출연금\n2. 생활용수댐ㆍ공업용수댐의 수도사업자의 출연금\n3. 차입금\n4. 조성된 자금의 운용으로 생기는 수익금\n② 댐관리청, 댐사용권자나 생활용수댐ㆍ공업용수댐의 수도사업자는 다음 각 호에 해당하는 비율의 금액을 제1항제1호와 제2호의 출연금으로 출연하여야 한다. <개정 2021.6.15>\n1. 전전년도 발전판매(發電販賣) 수입금의 100분의 6 이내\n2. 전전년도 생활용수ㆍ공업용수 판매량에 전전년도 「한국수자원공사법」에 따른 한국수자원공사의 댐용수요금 단가를 곱한 금액의 100분의 22 이내\n③ 제1항에 따라 조성된 댐주변지역지원사업의 재원은 댐관리청이나 댐수탁관리자가 운영한다. 이 경우 댐관리청이나 댐수탁관리자는 제1항에 따른 댐주변지역지원사업의 재원을 별도의 회계로 구분하여 관리하여야 한다."
  - no: 44의2
    title: 댐 주변지역의 친환경공간 조성
    text: "제44조의2(댐 주변지역의 친환경공간 조성)\n① 제41조와 제43조에 따른 다목적댐 주변지역을 관할하는 시장ㆍ군수 또는 구청장은 댐 주변지역의 발전을 도모하기 위하여 「물환경보전법」 등 관계 법률에 따른 오염총량관리에 지장이 없는 범위에서 대통령령으로 정하는 바에 따라 댐의 호수ㆍ늪 및 주변경관을 활용한 자연학습장, 생태공원, 수상체육시설 등 휴양ㆍ문화ㆍ여가활동 등을 위한 공간(이하 \"친환경공간\"이라 한다)을 조성하기 위한 사업을 시행할 수 있다. <개정 2017.1.17>\n② 시장ㆍ군수 또는 구청장은 제1항에 따른 댐 주변지역의 친환경공간 조성을 위한 사업을 시행하려는 경우에는 미리 댐관리청과 협의하여야 한다."
  - no: 44의3
    title: 공공시설 등의 우선설치
    text: 제44조의3(공공시설 등의 우선설치) 중앙행정기관의 장 및 관할 시장ㆍ군수 또는 구청장은 댐 주변지역의 경제 진흥 및 생활환경 개선을 위하여 도로, 다리, 수도 등 공공시설의 설치 및 그 밖에 대통령령으로 정하는 사업을 우선적으로 시행할 수 있다.
  - no: 44의4
    title: 공공하수도의 설치
    text: "제44조의4(공공하수도의 설치)\n① 댐건설사업시행자는 「환경영향평가법」 제27조부터 제31조까지의 규정에 따른 협의내용(「환경영향평가법」 제21조에 따라 재협의된 내용과 같은 법 제33조에 따른 환경보전방안을 포함한다)을 이행하기 위하여 필요한 경우에는 「하수도법」 제74조제3항에 따라 공공하수도관리청으로부터 댐건설기간 중에 공공하수도의 설치를 위탁받아 설치할 수 있다. <개정 2011.7.21>\n② 다음 각 호의 어느 하나에 해당하는 자는 제1항에 따른 공공하수도의 설치에 드는 비용 중 지방비 부담분의 전부 또는 일부를 부담할 수 있다.\n1. 다목적댐의 경우에는 댐의 저수를 생활용수와 공업용수로 이용할 댐사용권설정예정자\n2. 생활용수댐ㆍ공업용수댐의 경우에는 수도사업자"
  - no: '45'
    title: 기후에너지환경부장관 등의 권한
    text: "제45조(기후에너지환경부장관 등의 권한)\n① 기후에너지환경부장관은 댐건설에 관한 기본계획이 고시된 경우에는 「하천법」과 「골재채취법」에도 불구하고 사업시행지와 제16조제1항 및 제2항에 따라 고시된 하천구역에서의 다음 각 호의 처분 등을 한다. 다만, 시ㆍ도지사 또는 시장ㆍ군수가 건설하는 댐의 경우에는 해당 시ㆍ도지사 또는 시장ㆍ군수가 다음 각 호의 처분 등을 하며, 제5조제2항에 따라 댐의 관리를 위탁한 경우 그 위탁의 범위에 속하는 처분 등은 대통령령으로 정하는 바에 따라 댐수탁관리자가 한다. <개정 2013.3.23, 2018.6.8, 2021.6.15, 2025.10.1>\n1. 「하천법」 제30조에 따른 하천공사 시행의 허가, 같은 법 제33조에 따른 하천의 점용허가 및 같은 법 제50조에 따른 하천수의 사용허가\n2. 제1호의 허가를 받은 자에 대한 「하천법」 제5조제2항에 따른 권리ㆍ의무 승계 신고의 수리\n3. 「하천법」 제46조제6호에 따른 야영, 취사와 떡밥ㆍ생선가루 등 미끼를 사용하여 하천을 오염시키는 낚시행위를 금지하는 지역의 지정\n4. 「골재채취법」 제22조에 따른 골재채취의 허가\n5. 제1호부터 제4호까지의 처분 등과 관련한 다음 각 목의 처분\n② 기후에너지환경부장관, 시ㆍ도지사, 시장ㆍ군수 또는 댐수탁관리자는 제1항에 따른 처분 등을 하려는 경우에는 미리 관계 행정기관의 장과 협의하여야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n③ 기후에너지환경부장관, 시ㆍ도지사 또는 시장ㆍ군수는 제1항에 따른 처분 등을 하려는 경우에는 미리 댐수탁관리자의 의견을 들어야 한다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n④ 댐수탁관리자는 「하천법」 제37조제1항부터 제4항까지의 규정에도 불구하고 제1항제1호 및 제4호에 따라 허가를 받은 자로부터 점용료나 사용료를 징수하여 댐의 관리비용으로 사용할 수 있다."
  - no: '46'
    title: 「하천법」과의 관계
    text: 제46조(「하천법」과의 관계) 이 법에서 정한 사항 외에 댐의 건설과 관리에 필요한 사항은 「하천법」을 적용한다.
  - no: '47'
    title: 청문
    text: "제47조(청문) 댐관리청은 다음 각 호의 어느 하나에 해당하는 처분을 할 때에는 미리 청문을 하여야 한다.\n1. 제31조제2항에 따른 댐사용권의 양도명령\n2. 제45조제1항제5호에 따른 허가의 취소"
  - no: '48'
    title: 권한의 위임 등
    text: "제48조(권한의 위임 등)\n① 이 법에 따른 기후에너지환경부장관의 권한은 대통령령으로 정하는 바에 따라 그 일부를 소속 기관의 장 또는 시ㆍ도지사에게 위임할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>\n② 기후에너지환경부장관, 시ㆍ도지사 또는 시장ㆍ군수는 이 법에 따른 조사ㆍ연구 및 댐건설 등의 업무의 일부를 대통령령으로 정하는 바에 따라 댐 관련 법인ㆍ단체 또는 기관에 위탁 또는 대행하게 할 수 있다. <개정 2013.3.23, 2018.6.8, 2025.10.1>"
  - no: 48의2
    title: 댐건설비용의 지원
    text: 제48조의2(댐건설비용의 지원) 국가나 시ㆍ도지사는 예산의 범위에서 지방자치단체인 댐건설사업시행자에게 댐건설사업에 필요한 비용의 전부 또는 일부를 보조할 수 있다.
  - no: '49'
    title: 벌칙
    text: 제49조(벌칙) 제8조를 위반하여 공공의 피해를 발생시키거나 치수(治水)에 장해를 일으킨 댐수탁관리자의 임직원은 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2021.6.15>
  - no: '50'
    title:
    text: 제50조 삭제 <2005.12.7>
  - no: '51'
    title:
    text: 제51조 삭제 <2026.3.17>
  - no: '52'
    title: 양벌규정
    text: 제52조(양벌규정) 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제49조의 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다. <개정 2026.3.17>
  - no: '53'
    title: 과태료
    text: "제53조(과태료)\n① 행정청이 아닌 자로서 제14조제3항부터 제5항까지에 따른 허가나 동의를 받지 아니하고 같은 조 제1항에 따른 행위를 한 자에게는 1천만원 이하의 과태료를 부과한다. <신설 2026.3.17>\n② 정당한 사유 없이 제14조제1항에 따른 행위를 방해하거나 거부한 자에게는 300만원 이하의 과태료를 부과한다. <개정 2021.6.15, 2026.3.17>\n③ 제1항 및 제2항에 따른 과태료는 대통령령으로 정하는 바에 따라 기후에너지환경부장관이나 시ㆍ도지사(시ㆍ도지사가 건설하는 댐과 관련한 위반행위에 대한 과태료만 해당한다), 시장ㆍ군수 또는 구청장이 부과ㆍ징수한다. <개정 2012.1.17, 2013.3.23, 2018.6.8, 2025.10.1, 2026.3.17>"
source: https://www.law.go.kr/법령/댐건설ㆍ관리및주변지역지원등에관한법률
