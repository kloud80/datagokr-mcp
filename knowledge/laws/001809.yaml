# 주택법 — 법제처 현행 원문 (2026-09-30 조회). 참조: domain:국토관리/주택
law_id: '001809'
name: 주택법
short_names: []
promulgated: '2026-09-08'
effective: '2027-03-09'
articles:
  - no: '1'
    title: 목적
    text: 제1조(목적) 이 법은 쾌적하고 살기 좋은 주거환경 조성에 필요한 주택의 건설ㆍ공급 및 주택시장의 관리 등에 관한 사항을 정함으로써 국민의 주거안정과 주거수준의 향상에 이바지함을 목적으로 한다.
  - no: '2'
    title: 정의
    text: "제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2017.12.26, 2018.1.16, 2018.8.14, 2020.6.9, 2020.8.18, 2021.12.21, 2023.6.7, 2023.12.26, 2026.3.5, 2026.9.8>\n1. \"주택\"이란 세대(世帶)의 구성원이 장기간 독립된 주거생활을 할 수 있는 구조로 된 건축물의 전부 또는 일부 및 그 부속토지를 말하며, 단독주택과 공동주택으로 구분한다.\n2. \"단독주택\"이란 1세대가 하나의 건축물 안에서 독립된 주거생활을 할 수 있는 구조로 된 주택을 말하며, 그 종류와 범위는 대통령령으로 정한다.\n3. \"공동주택\"이란 건축물의 벽ㆍ복도ㆍ계단이나 그 밖의 설비 등의 전부 또는 일부를 공동으로 사용하는 각 세대가 하나의 건축물 안에서 각각 독립된 주거생활을 할 수 있는 구조로 된 주택을 말하며, 그 종류와 범위는 대통령령으로 정한다.\n4. \"준주택\"이란 주택 외의 건축물과 그 부속토지로서 주거시설로 이용가능한 시설 등을 말하며, 그 범위와 종류는 대통령령으로 정한다.\n5. \"국민주택\"이란 다음 각 목의 어느 하나에 해당하는 주택으로서 국민주택규모 이하인 주택을 말한다.\n6. \"국민주택규모\"란 주거의 용도로만 쓰이는 면적(이하 \"주거전용면적\"이라 한다)이 1호(戶) 또는 1세대당 85제곱미터 이하인 주택(「수도권정비계획법」 제2조제1호에 따른 수도권을 제외한 도시지역이 아닌 읍 또는 면 지역은 1호 또는 1세대당 주거전용면적이 100제곱미터 이하인 주택을 말한다)을 말한다. 이 경우 주거전용면적의 산정방법은 국토교통부령으로 정한다.\n7. \"민영주택\"이란 국민주택을 제외한 주택을 말한다.\n8. \"임대주택\"이란 임대를 목적으로 하는 주택으로서, 「공공주택 특별법」 제2조제1호가목에 따른 공공임대주택과 「민간임대주택에 관한 특별법」 제2조제1호에 따른 민간임대주택으로 구분한다.\n9. \"토지임대부 분양주택\"이란 토지의 소유권은 제15조에 따른 사업계획의 승인을 받아 토지임대부 분양주택 건설사업을 시행하는 자가 가지고, 건축물 및 복리시설(福利施設) 등에 대한 소유권[건축물의 전유부분(專有部分)에 대한 구분소유권은 이를 분양받은 자가 가지고, 건축물의 공용부분ㆍ부속건물 및 복리시설은 분양받은 자들이 공유한다]은 주택을 분양받은 자가 가지는 주택을 말한다.\n10. \"사업주체\"란 제15조에 따른 주택건설사업계획 또는 대지조성사업계획의 승인을 받아 그 사업을 시행하는 다음 각 목의 자를 말한다.\n11. \"주택조합\"이란 많은 수의 구성원이 제15조에 따른 사업계획의 승인을 받아 주택을 마련하거나 제66조에 따라 리모델링하기 위하여 결성하는 다음 각 목의 조합을 말한다.\n12. \"주택단지\"란 제15조에 따른 주택건설사업계획 또는 대지조성사업계획의 승인을 받아 주택과 그 부대시설 및 복리시설을 건설하거나 대지를 조성하는 데 사용되는 일단(一團)의 토지를 말한다. 다만, 다음 각 목의 시설로 분리된 토지는 각각 별개의 주택단지로 본다.\n13. \"부대시설\"이란 주택에 딸린 다음 각 목의 시설 또는 설비를 말한다.\n14. \"복리시설\"이란 주택단지의 입주자 등의 생활복리를 위한 다음 각 목의 공동시설을 말한다.\n15. \"기반시설\"이란 「국토의 계획 및 이용에 관한 법률」 제2조제6호에 따른 기반시설을 말한다.\n16. \"기간시설\"(基幹施設)이란 도로ㆍ상하수도ㆍ전기시설ㆍ가스시설ㆍ통신시설ㆍ지역난방시설 등을 말한다.\n17. \"간선시설\"(幹線施設)이란 도로ㆍ상하수도ㆍ전기시설ㆍ가스시설ㆍ통신시설 및 지역난방시설 등 주택단지(둘 이상의 주택단지를 동시에 개발하는 경우에는 각각의 주택단지를 말한다) 안의 기간시설을 그 주택단지 밖에 있는 같은 종류의 기간시설에 연결시키는 시설을 말한다. 다만, 가스시설ㆍ통신시설 및 지역난방시설의 경우에는 주택단지 안의 기간시설을 포함한다.\n18. \"공구\"란 하나의 주택단지에서 대통령령으로 정하는 기준에 따라 둘 이상으로 구분되는 일단의 구역으로, 착공신고 및 사용검사를 별도로 수행할 수 있는 구역을 말한다.\n19. \"세대구분형 공동주택\"이란 공동주택의 주택 내부 공간의 일부를 세대별로 구분하여 생활이 가능한 구조로 하되, 그 구분된 공간의 일부를 구분소유 할 수 없는 주택으로서 대통령령으로 정하는 건설기준, 설치기준, 면적기준 등에 적합한 주택을 말한다.\n20. \"도시형 생활주택\"이란 다음 각 목의 어느 하나에 해당하는 세대수 미만의 국민주택규모에 해당하는 주택으로서 대통령령으로 정하는 주택을 말한다.\n21. \"에너지절약형 친환경주택\"이란 저에너지 건물 조성기술 등 대통령령으로 정하는 기술을 이용하여 에너지 사용량을 절감하거나 이산화탄소 배출량을 저감할 수 있도록 건설된 주택을 말하며, 그 종류와 범위는 대통령령으로 정한다.\n22. \"건강친화형 주택\"이란 건강하고 쾌적한 실내환경의 조성을 위하여 실내공기의 오염물질 등을 최소화할 수 있도록 대통령령으로 정하는 기준에 따라 건설된 주택을 말한다.\n23. \"장수명 주택\"이란 구조적으로 오랫동안 유지ㆍ관리될 수 있는 내구성을 갖추고, 입주자의 필요에 따라 내부 구조를 쉽게 변경할 수 있는 가변성과 수리 용이성 등이 우수한 주택을 말한다.\n24. \"공공택지\"란 다음 각 목의 어느 하나에 해당하는 공공사업에 의하여 개발ㆍ조성되는 공동주택이 건설되는 용지를 말한다.\n25. \"리모델링\"이란 제66조제1항 및 제2항에 따라 건축물의 노후화 억제 또는 기능 향상 등을 위한 다음 각 목의 어느 하나에 해당하는 행위를 말한다.\n26. \"리모델링 기본계획\"이란 세대수 증가형 리모델링으로 인한 도시과밀, 이주수요 집중 등을 체계적으로 관리하기 위하여 수립하는 계획을 말한다.\n27. \"입주자\"란 다음 각 목의 구분에 따른 자를 말한다.\n28. \"사용자\"란 「공동주택관리법」 제2조제6호에 따른 사용자를 말한다.\n29. \"관리주체\"란 「공동주택관리법」 제2조제10호에 따른 관리주체를 말한다."
  - no: '3'
    title: 다른 법률과의 관계
    text: 제3조(다른 법률과의 관계) 주택의 건설 및 공급에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다.
  - no: '4'
    title: 주택건설사업 등의 등록
    text: "제4조(주택건설사업 등의 등록)\n① 연간 대통령령으로 정하는 호수(戶數) 이상의 주택건설사업을 시행하려는 자 또는 연간 대통령령으로 정하는 면적 이상의 대지조성사업을 시행하려는 자는 국토교통부장관에게 등록하여야 한다. 다만, 다음 각 호의 사업주체의 경우에는 그러하지 아니하다. <개정 2026.9.8>\n1. 국가ㆍ지방자치단체\n2. 한국토지주택공사\n3. 지방공사\n4. 「공익법인의 설립ㆍ운영에 관한 법률」 제4조에 따라 주택건설사업을 목적으로 설립된 공익법인\n5. 제11조에 따라 설립된 주택조합(리모델링주택조합 또는 제5조제2항에 따라 등록사업자와 공동으로 주택건설사업을 하는 주택조합만 해당한다)\n6. 근로자를 고용하는 자(제5조제3항에 따라 등록사업자와 공동으로 주택건설사업을 시행하는 고용자만 해당하며, 이하 \"고용자\"라 한다)\n② 제1항에 따라 등록하여야 할 사업자의 자본금과 기술인력 및 사무실면적에 관한 등록의 기준ㆍ절차ㆍ방법 등에 필요한 사항은 대통령령으로 정한다."
  - no: '5'
    title: 공동사업주체
    text: "제5조(공동사업주체)\n① 토지소유자가 주택을 건설하는 경우에는 제4조제1항에도 불구하고 대통령령으로 정하는 바에 따라 제4조에 따라 등록을 한 자(이하 \"등록사업자\"라 한다)와 공동으로 사업을 시행할 수 있다. 이 경우 토지소유자와 등록사업자를 공동사업주체로 본다.\n② 제11조에 따라 설립된 주택조합(세대수를 증가하지 아니하는 리모델링주택조합은 제외한다)이 그 구성원의 주택을 건설하는 경우에는 대통령령으로 정하는 바에 따라 등록사업자(지방자치단체ㆍ한국토지주택공사 및 지방공사를 포함한다)와 공동으로 사업을 시행할 수 있다. 이 경우 주택조합과 등록사업자를 공동사업주체로 본다.\n③ 고용자가 그 근로자의 주택을 건설하는 경우에는 대통령령으로 정하는 바에 따라 등록사업자와 공동으로 사업을 시행하여야 한다. 이 경우 고용자와 등록사업자를 공동사업주체로 본다.\n④ 제1항부터 제3항까지에 따른 공동사업주체 간의 구체적인 업무ㆍ비용 및 책임의 분담 등에 관하여는 대통령령으로 정하는 범위에서 당사자 간의 협약에 따른다."
  - no: '6'
    title: 등록사업자의 결격사유
    text: "제6조(등록사업자의 결격사유) 다음 각 호의 어느 하나에 해당하는 자는 제4조에 따른 주택건설사업 등의 등록을 할 수 없다.\n1. 미성년자ㆍ피성년후견인 또는 피한정후견인\n2. 파산선고를 받은 자로서 복권되지 아니한 자\n3. 「부정수표 단속법」 또는 이 법을 위반하여 금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 2년이 지나지 아니한 자\n4. 「부정수표 단속법」 또는 이 법을 위반하여 금고 이상의 형의 집행유예를 선고받고 그 유예기간 중에 있는 자\n5. 제8조에 따라 등록이 말소(제6조제1호 및 제2호에 해당하여 말소된 경우는 제외한다)된 후 2년이 지나지 아니한 자\n6. 임원 중에 제1호부터 제5호까지의 규정 중 어느 하나에 해당하는 자가 있는 법인"
  - no: '7'
    title: 등록사업자의 시공
    text: "제7조(등록사업자의 시공)\n① 등록사업자가 제15조에 따른 사업계획승인(「건축법」에 따른 공동주택건축허가를 포함한다)을 받아 분양 또는 임대를 목적으로 주택을 건설하는 경우로서 그 기술능력, 주택건설 실적 및 주택규모 등이 대통령령으로 정하는 기준에 해당하는 경우에는 그 등록사업자를 「건설산업기본법」 제9조에 따른 건설사업자로 보며 주택건설공사를 시공할 수 있다. <개정 2019.4.30>\n② 제1항에 따라 등록사업자가 주택을 건설하는 경우에는 「건설산업기본법」 제40조ㆍ제44조ㆍ제93조ㆍ제94조, 제98조부터 제100조까지, 제100조의2 및 제101조를 준용한다. 이 경우 \"건설사업자\"는 \"등록사업자\"로 본다. <개정 2019.4.30>"
  - no: '8'
    title: 주택건설사업의 등록말소 등
    text: "제8조(주택건설사업의 등록말소 등)\n① 국토교통부장관은 등록사업자가 다음 각 호의 어느 하나에 해당하면 그 등록을 말소하거나 1년 이내의 기간을 정하여 영업의 정지를 명할 수 있다. 다만, 제1호 또는 제5호에 해당하는 경우에는 그 등록을 말소하여야 한다. <개정 2018.8.14, 2024.1.16>\n1. 거짓이나 그 밖의 부정한 방법으로 등록한 경우\n2. 제4조제2항에 따른 등록기준에 미달하게 된 경우. 다만, 「채무자 회생 및 파산에 관한 법률」에 따라 법원이 회생절차개시의 결정을 하고 그 절차가 진행 중이거나 일시적으로 등록기준에 미달하는 등 대통령령으로 정하는 경우는 예외로 한다.\n3. 고의 또는 과실로 공사를 잘못 시공하여 공중(公衆)에게 위해(危害)를 끼치거나 입주자에게 재산상 손해를 입힌 경우\n4. 제6조제1호부터 제4호까지 또는 제6호 중 어느 하나에 해당하게 된 경우. 다만, 법인의 임원 중 제6조제6호에 해당하는 사람이 있는 경우 6개월 이내에 그 임원을 다른 사람으로 임명한 경우에는 그러하지 아니하다.\n5. 제90조제1항을 위반하여 등록증의 대여 등을 한 경우\n5의2. 제90조제2항을 위반하여 등록증을 빌리거나 허락 없이 등록사업자의 성명 또는 상호로 이 법에서 정한 사업이나 업무를 수행 또는 시공한 경우\n5의3. 제90조제4항을 위반하여 이 법에서 정한 사업이나 업무를 수행 또는 시공하기 위하여 같은 조 제2항의 행위를 교사하거나 방조한 경우\n6. 다음 각 목의 어느 하나에 해당하는 경우\n7. 「택지개발촉진법」 제19조의2제1항을 위반하여 택지를 전매(轉賣)한 경우\n8. 「표시ㆍ광고의 공정화에 관한 법률」 제17조제1호에 따른 처벌을 받은 경우\n9. 「약관의 규제에 관한 법률」 제34조제2항에 따른 처분을 받은 경우\n10. 그 밖에 이 법 또는 이 법에 따른 명령이나 처분을 위반한 경우\n② 제1항에 따른 등록말소 및 영업정지 처분에 관한 기준은 대통령령으로 정한다."
  - no: '9'
    title: 등록말소 처분 등을 받은 자의 사업 수행
    text: 제9조(등록말소 처분 등을 받은 자의 사업 수행) 제8조에 따라 등록말소 또는 영업정지 처분을 받은 등록사업자는 그 처분 전에 제15조에 따른 사업계획승인을 받은 사업은 계속 수행할 수 있다. 다만, 등록말소 처분을 받은 등록사업자가 그 사업을 계속 수행할 수 없는 중대하고 명백한 사유가 있을 경우에는 그러하지 아니하다.
  - no: '10'
    title: 영업실적 등의 제출
    text: "제10조(영업실적 등의 제출)\n① 등록사업자는 국토교통부령으로 정하는 바에 따라 매년 영업실적(개인인 사업자가 해당 사업에 1년 이상 사용한 사업용 자산을 현물출자하여 법인을 설립한 경우에는 그 개인인 사업자의 영업실적을 포함한 실적을 말하며, 등록말소 후 다시 등록한 경우에는 다시 등록한 이후의 실적을 말한다)과 영업계획 및 기술인력 보유 현황을 국토교통부장관에게 제출하여야 한다.\n② 등록사업자는 국토교통부령으로 정하는 바에 따라 월별 주택분양계획 및 분양 실적을 국토교통부장관에게 제출하여야 한다."
  - no: '11'
    title: 주택조합의 설립 등
    text: "제11조(주택조합의 설립 등)\n① 많은 수의 구성원이 주택을 마련하거나 리모델링하기 위하여 주택조합을 설립하려는 경우(제5항에 따른 직장주택조합의 경우는 제외한다)에는 관할 특별자치시장, 특별자치도지사, 시장, 군수 또는 구청장(구청장은 자치구의 구청장을 말하며, 이하 \"시장ㆍ군수ㆍ구청장\"이라 한다)의 인가를 받아야 한다. 인가받은 내용을 변경하거나 주택조합을 해산하려는 경우에도 또한 같다.\n② 제1항에 따라 주택을 마련하기 위하여 주택조합설립인가를 받으려는 자는 다음 각 호의 요건을 모두 갖추어야 한다. 다만, 제1항 후단의 경우에는 그러하지 아니하다. <개정 2020.1.23, 2026.9.8>\n1. 해당 주택건설대지의 80퍼센트 이상에 해당하는 토지에 대하여 다음 각 목의 구분에 따른 권원을 확보할 것\n2. 해당 주택건설대지의 15퍼센트 이상에 해당하는 토지의 소유권을 확보할 것\n③ 제1항에 따라 주택을 리모델링하기 위하여 주택조합을 설립하려는 경우에는 다음 각 호의 구분에 따른 구분소유자(「집합건물의 소유 및 관리에 관한 법률」 제2조제2호에 따른 구분소유자를 말한다. 이하 같다)와 의결권(「집합건물의 소유 및 관리에 관한 법률」 제37조에 따른 의결권을 말한다. 이하 같다)의 결의를 증명하는 서류를 첨부하여 관할 시장ㆍ군수ㆍ구청장의 인가를 받아야 한다. <개정 2026.9.8>\n1. 주택단지 전체를 리모델링하고자 하는 경우에는 주택단지 전체의 구분소유자와 의결권의 각 3분의 2 이상의 결의 및 각 동(입주자 공유가 아닌 복리시설의 경우에는 주택단지의 입주자 공유가 아닌 복리시설 전체를 하나의 동으로 본다. 이하 이 항에서 같다)의 구분소유자와 의결권의 각 과반수의 결의\n2. 동을 리모델링하고자 하는 경우에는 그 동의 구분소유자 및 의결권의 각 3분의 2 이상의 결의\n3. 인접한 둘 이상의 주택단지가 결합하여 전체를 리모델링하고자 하는 경우에는 각 주택단지별로 주택단지 전체의 구분소유자와 의결권의 각 3분의 2 이상의 결의 및 각 동의 구분소유자와 의결권의 각 과반수의 결의\n④ 제5조제2항에 따라 주택조합과 등록사업자가 공동으로 사업을 시행하면서 시공할 경우 등록사업자는 시공자로서의 책임뿐만 아니라 자신의 귀책사유로 사업 추진이 불가능하게 되거나 지연됨으로 인하여 조합원에게 입힌 손해를 배상할 책임이 있다.\n⑤ 국민주택을 공급받기 위하여 직장주택조합을 설립하려는 자는 관할 시장ㆍ군수ㆍ구청장에게 신고하여야 한다. 신고한 내용을 변경하거나 직장주택조합을 해산하려는 경우에도 또한 같다.\n⑥ 주택조합은 그 구성원을 위하여 건설하는 주택을 그 조합원에게 우선 공급할 수 있으며, 제5항에 따른 직장주택조합에 대하여는 사업주체가 국민주택을 그 직장주택조합원에게 우선 공급할 수 있다. <개정 2026.9.8>\n⑦ 제1항에 따라 인가를 받는 주택조합의 설립방법ㆍ설립절차, 주택조합 구성원의 자격기준ㆍ제명ㆍ탈퇴 및 주택조합의 운영ㆍ관리 등에 필요한 사항과 제5항에 따른 직장주택조합의 설립요건 및 신고절차 등에 필요한 사항은 대통령령으로 정한다. <개정 2016.12.2>\n⑧ 제7항에도 불구하고 조합원은 조합규약으로 정하는 바에 따라 조합에 탈퇴 의사를 알리고 탈퇴할 수 있다. <개정 2016.12.2>\n⑨ 탈퇴한 조합원(제명된 조합원을 포함한다)은 조합규약으로 정하는 바에 따라 부담한 비용의 환급을 청구할 수 있다. <개정 2016.12.2>"
  - no: 11의2
    title: 주택조합업무의 대행 등
    text: "제11조의2(주택조합업무의 대행 등)\n① 주택조합(리모델링주택조합은 제외한다. 이하 이 조 및 제12조의2에서 같다) 및 주택조합의 발기인은 조합원 모집 등 제2항에 따른 주택조합의 업무를 제5조제2항에 따른 공동사업주체인 등록사업자 또는 다음 각 호의 어느 하나에 해당하는 자로서 대통령령으로 정하는 자본금을 보유한 자 외의 자에게 대행하게 할 수 없다. <개정 2017.2.8, 2020.1.23, 2026.9.8>\n1. 등록사업자\n2. 「공인중개사법」 제9조에 따른 중개업자\n3. 「도시 및 주거환경정비법」 제102조에 따른 정비사업전문관리업자\n4. 「부동산개발업의 관리 및 육성에 관한 법률」 제4조에 따른 등록사업자\n5. 「자본시장과 금융투자업에 관한 법률」에 따른 신탁업자\n6. 그 밖에 다른 법률에 따라 등록한 자로서 대통령령으로 정하는 자\n② 제1항에 따라 업무대행자에게 대행시킬 수 있는 주택조합의 업무는 다음 각 호와 같다. <개정 2020.1.23>\n1. 조합원 모집, 토지 확보, 조합설립인가 신청 등 조합설립을 위한 업무의 대행\n2. 사업성 검토 및 사업계획서 작성업무의 대행\n3. 설계자 및 시공자 선정에 관한 업무의 지원\n4. 제15조에 따른 사업계획승인 신청 등 사업계획승인을 위한 업무의 대행\n5. 계약금 등 자금의 보관 및 그와 관련된 업무의 대행\n6. 그 밖에 총회의 운영업무 지원 등 국토교통부령으로 정하는 사항\n③ 주택조합 및 주택조합의 발기인은 제2항제5호에 따른 업무 중 계약금 등 자금의 보관 업무는 제1항제5호에 따른 신탁업자에게 대행하도록 하여야 한다. <신설 2020.1.23>\n④ 제1항에 따른 업무대행자는 국토교통부령으로 정하는 바에 따라 사업연도별로 분기마다 해당 업무의 실적보고서를 작성하여 주택조합 또는 주택조합의 발기인에게 제출하여야 한다. <신설 2020.1.23>\n⑤ 제1항부터 제4항까지의 규정에 따라 주택조합의 업무를 대행하는 자는 신의에 따라 성실하게 업무를 수행하여야 하고, 자신의 귀책사유로 주택조합(발기인을 포함한다) 또는 조합원(주택조합 가입 신청자를 포함한다)에게 손해를 입힌 경우에는 그 손해를 배상할 책임이 있다. <개정 2020.1.23>\n⑥ 국토교통부장관은 주택조합의 원활한 사업추진 및 조합원의 권리 보호를 위하여 공정거래위원회 위원장과 협의를 거쳐 표준업무대행계약서를 작성ㆍ보급할 수 있다. <개정 2020.1.23>\n⑦ 제1항에 따른 업무대행자는 제2항제1호부터 제4호까지 및 제6호에 해당하는 업무와 같은 항 제5호에 해당하는 대행업무를 병행하여 할 수 없다. <신설 2026.9.8>"
  - no: 11의3
    title: 조합원 모집 신고 및 공개모집
    text: "제11조의3(조합원 모집 신고 및 공개모집)\n① 제11조제1항에 따라 지역주택조합 또는 직장주택조합의 설립인가를 받기 위하여 조합원을 모집하려는 자는 해당 주택건설대지의 80퍼센트 이상에 해당하는 토지에 대하여 제11조제2항제1호 각 목의 구분에 따른 권원을 확보하여 관할 시장ㆍ군수ㆍ구청장에게 신고하고, 공개모집의 방법으로 조합원을 모집하여야 한다. 조합 설립인가를 받기 전에 신고한 내용을 변경하는 경우에도 또한 같다. <개정 2020.1.23, 2026.9.8>\n② 제1항에도 불구하고 공개모집 이후 조합원의 사망ㆍ자격상실ㆍ탈퇴 등으로 인한 결원을 충원하거나 미달된 조합원을 재모집하는 경우에는 신고하지 아니하고 선착순의 방법으로 조합원을 모집할 수 있다.\n③ 제1항에 따른 모집 시기, 모집 방법 및 모집 절차 등 조합원 모집의 신고, 공개모집 및 조합 가입 신청자에 대한 정보 공개 등에 필요한 사항은 국토교통부령으로 정한다.\n④ 제1항에 따라 신고를 받은 시장ㆍ군수ㆍ구청장은 신고내용이 이 법에 적합한 경우에는 신고를 수리하고 그 사실을 신고인에게 통보하여야 한다.\n⑤ 시장ㆍ군수ㆍ구청장은 다음 각 호의 어느 하나에 해당하는 경우에는 조합원 모집 신고를 수리할 수 없다. <개정 2026.9.8>\n1. 이미 신고된 사업대지와 전부 또는 일부가 중복되는 경우\n2. 이미 수립되었거나 수립 예정인 도시ㆍ군계획, 이미 수립된 토지이용계획 또는 이 법이나 관계 법령에 따른 건축기준 및 건축제한 등에 따라 해당 주택건설대지에 모집신고서상 건설ㆍ공급 계획에 따른 조합주택을 건설할 수 없는 경우\n2의2. 조합주택 건설 사업과 관련된 「국토의 계획 및 이용에 관한 법률」 제49조에 따른 지구단위계획(이하 \"지구단위계획\"이라 한다)이 수립되지 아니한 경우\n3. 제11조의2제1항에 따라 조합업무를 대행할 수 있는 자가 아닌 자와 업무대행계약을 체결한 경우 등 신고내용이 법령에 위반되는 경우\n4. 신고한 내용이 사실과 다른 경우\n⑥ 제1항에 따라 조합원을 모집하려는 주택조합의 발기인은 대통령령으로 정하는 자격기준을 갖추어야 한다. <신설 2020.1.23>\n⑦ 제6항에 따른 주택조합의 발기인은 조합원 모집 신고를 하는 날 주택조합에 가입한 것으로 본다. 이 경우 주택조합의 발기인은 그 주택조합의 가입 신청자와 동일한 권리와 의무가 있다. <신설 2020.1.23>\n⑧ 제1항에 따라 조합원을 모집하는 자(제11조의2제1항에 따라 조합원 모집 업무를 대행하는 자를 포함한다. 이하 \"모집주체\"라 한다)와 주택조합 가입 신청자는 다음 각 호의 사항이 포함된 주택조합 가입에 관한 계약서를 작성하여야 한다. <신설 2020.1.23>\n1. 주택조합의 사업개요\n2. 조합원의 자격기준\n3. 분담금 등 각종 비용의 납부예정금액, 납부시기 및 납부방법\n4. 주택건설대지의 사용권원 및 소유권을 확보한 면적 및 비율\n5. 조합원 탈퇴 및 환급의 방법, 시기 및 절차\n6. 그 밖에 주택조합의 설립 및 운영에 관한 중요 사항으로서 대통령령으로 정하는 사항\n⑨ 제4항에 따라 모집 신고가 수리된 이후에는 해당 조합주택 건설과 관련된 지구단위계획은 「국토의 계획 및 이용에 관한 법률」 제26조제1항에 따른 주민의 입안 제안으로 수립ㆍ변경할 수 없다. 다만, 상위 계획이나 관계 법령의 변경 등 대통령령으로 정하는 경우에는 그러하지 아니한다. <신설 2026.9.8>"
  - no: 11의4
    title: 설명의무
    text: "제11조의4(설명의무)\n① 모집주체는 제11조의3제8항 각 호의 사항을 주택조합 가입 신청자가 이해할 수 있도록 설명하여야 한다.\n② 모집주체는 제1항에 따라 설명한 내용을 주택조합 가입 신청자가 이해하였음을 국토교통부령으로 정하는 바에 따라 서면으로 확인을 받아 주택조합 가입 신청자에게 교부하여야 하며, 그 사본을 5년간 보관하여야 한다."
  - no: 11의5
    title: 조합원 모집 광고 등에 관한 준수사항
    text: "제11조의5(조합원 모집 광고 등에 관한 준수사항)\n① 모집주체가 주택조합의 조합원을 모집하기 위하여 광고를 하는 경우에는 다음 각 호의 내용이 포함되어야 한다. <개정 2026.9.8>\n1. \"지역주택조합 또는 직장주택조합의 조합원 모집을 위한 광고\"라는 문구\n2. 조합원의 자격기준에 관한 내용\n3. 주택건설대지의 사용권원 및 소유권을 확보한 비율\n3의2. 사업비 구성표(토지매입비, 공사비, 업무대행비, 금융비용 등 구분) 및 구성항목별 구체적인 산출근거 등 국토교통부령으로 정하는 사항\n3의3. 모집 신고 당시 해당 사업예정부지의 지구단위계획(건축물의 용도, 용적률, 건폐율, 높이 등)에 관한 사항\n3의4. 제11조의3제9항에 따른 지구단위계획 수립ㆍ변경 제한에 관한 사항\n4. 그 밖에 조합원 보호를 위하여 대통령령으로 정하는 내용\n② 모집주체가 조합원 가입을 권유하거나 모집 광고를 하는 경우에는 다음 각 호의 행위를 하여서는 아니 된다.\n1. 조합주택의 공급방식, 조합원의 자격기준 등을 충분히 설명하지 않거나 누락하여 제한 없이 조합에 가입하거나 주택을 공급받을 수 있는 것으로 오해하게 하는 행위\n2. 제5조제4항에 따른 협약이나 제15조제1항에 따른 사업계획승인을 통하여 확정될 수 있는 사항을 사전에 확정된 것처럼 오해하게 하는 행위\n3. 사업추진 과정에서 조합원이 부담해야 할 비용이 추가로 발생할 수 있음에도 주택 공급가격이 확정된 것으로 오해하게 하는 행위\n4. 주택건설대지의 사용권원 및 소유권을 확보한 비율을 사실과 다르거나 불명확하게 제공하는 행위\n5. 조합사업의 내용을 사실과 다르게 설명하거나 그 내용의 중요한 사실을 은폐 또는 축소하는 행위\n6. 그 밖에 조합원 보호를 위하여 대통령령으로 정하는 행위\n③ 모집주체가 조합원 모집 광고를 하는 방법 및 절차, 그 밖에 필요한 사항은 대통령령으로 정한다."
  - no: 11의6
    title: 조합 가입 철회 및 가입비 등의 반환
    text: "제11조의6(조합 가입 철회 및 가입비 등의 반환)\n① 모집주체는 주택조합의 가입을 신청한 자가 주택조합 가입을 신청하는 때에 납부하여야 하는 일체의 금전(이하 \"가입비등\"이라 한다)을 대통령령으로 정하는 기관(이하 \"예치기관\"이라 한다)에 예치하도록 하여야 한다. <개정 2020.1.23>\n② 주택조합의 가입을 신청한 자는 가입비등을 예치한 날부터 30일 이내에 주택조합 가입에 관한 청약을 철회할 수 있다.\n③ 청약 철회를 서면으로 하는 경우에는 청약 철회의 의사를 표시한 서면을 발송한 날에 그 효력이 발생한다.\n④ 모집주체는 주택조합의 가입을 신청한 자가 청약 철회를 한 경우 청약 철회 의사가 도달한 날부터 7일 이내에 예치기관의 장에게 가입비등의 반환을 요청하여야 한다.\n⑤ 예치기관의 장은 제4항에 따른 가입비등의 반환 요청을 받은 경우 요청일부터 10일 이내에 그 가입비등을 예치한 자에게 반환하여야 한다.\n⑥ 모집주체는 주택조합의 가입을 신청한 자에게 청약 철회를 이유로 위약금 또는 손해배상을 청구할 수 없다.\n⑦ 제2항에 따른 기간 이내에는 제11조제8항 및 제9항을 적용하지 않는다.\n⑧ 제1항에 따라 예치된 가입비등의 관리, 지급 및 반환과 제2항에 따른 청약 철회의 절차 및 방법 등에 관한 사항은 대통령령으로 정한다."
  - no: '12'
    title: 실적보고 및 관련 자료의 공개
    text: "제12조(실적보고 및 관련 자료의 공개)\n① 주택조합의 발기인 또는 임원은 다음 각 호의 사항이 포함된 해당 주택조합의 실적보고서를 국토교통부령으로 정하는 바에 따라 사업연도별로 분기마다 작성하여야 한다. <신설 2020.1.23>\n1. 조합원(주택조합 가입 신청자를 포함한다. 이하 이 조에서 같다) 모집 현황\n2. 해당 주택건설대지의 사용권원 및 소유권 확보 현황\n3. 그 밖에 조합원이 주택조합의 사업 추진현황을 파악하기 위하여 필요한 사항으로서 국토교통부령으로 정하는 사항\n② 주택조합의 발기인 또는 임원은 주택조합사업의 시행에 관한 다음 각 호의 서류 및 관련 자료가 작성되거나 변경된 후 15일 이내에 이를 조합원이 알 수 있도록 인터넷과 그 밖의 방법을 병행하여 공개하여야 한다. <개정 2020.1.23>\n1. 조합규약\n2. 공동사업주체의 선정 및 주택조합이 공동사업주체인 등록사업자와 체결한 협약서\n3. 설계자 등 용역업체 선정 계약서\n4. 조합총회 및 이사회, 대의원회 등의 의사록\n5. 사업시행계획서\n6. 해당 주택조합사업의 시행에 관한 공문서\n7. 회계감사보고서\n8. 분기별 사업실적보고서\n9. 제11조의2제4항에 따라 업무대행자가 제출한 실적보고서\n10. 그 밖에 주택조합사업 시행에 관하여 대통령령으로 정하는 서류 및 관련 자료\n③ 제2항에 따른 서류 및 다음 각 호를 포함하여 주택조합사업의 시행에 관한 서류와 관련 자료를 조합원이 열람ㆍ복사 요청을 한 경우 주택조합의 발기인 또는 임원은 15일 이내에 그 요청에 따라야 한다. 이 경우 복사에 필요한 비용은 실비의 범위에서 청구인이 부담한다. <개정 2020.1.23>\n1. 조합원 명부\n2. 주택건설대지의 사용권원 및 소유권 확보 비율 등 토지 확보 관련 자료\n3. 그 밖에 대통령령으로 정하는 서류 및 관련 자료\n④ 주택조합의 발기인 또는 임원은 원활한 사업추진과 조합원의 권리 보호를 위하여 연간 자금운용 계획 및 자금 집행 실적 등 국토교통부령으로 정하는 서류 및 자료를 국토교통부령으로 정하는 바에 따라 매년 정기적으로 시장ㆍ군수ㆍ구청장에게 제출하여야 한다. <신설 2019.12.10, 2020.1.23>\n⑤ 제2항 및 제3항에 따라 공개 및 열람ㆍ복사 등을 하는 경우에는 「개인정보 보호법」에 의하여야 하며, 그 밖의 공개 절차 등 필요한 사항은 국토교통부령으로 정한다. <개정 2019.12.10, 2020.1.23>"
  - no: 12의2
    title: 주택조합 사업비의 총회의결 등
    text: "제12조의2(주택조합 사업비의 총회의결 등)\n① 주택조합사업에 드는 비용이 100분의 10(생산자물가상승률은 제외한다) 이상 늘어나는 경우에는 총회의 의결을 거쳐야 한다.\n② 제1항에 따른 총회의 의결은 조합원 3분의 2 이상의 출석과 출석 조합원 3분의 2 이상의 찬성으로 의결하여야 한다."
  - no: '13'
    title: 조합임원의 결격사유 등
    text: "제13조(조합임원의 결격사유 등)\n① 다음 각 호의 어느 하나에 해당하는 사람은 주택조합의 발기인 또는 임원이 될 수 없다. <개정 2020.1.23, 2020.6.9>\n1. 미성년자ㆍ피성년후견인 또는 피한정후견인\n2. 파산선고를 받은 사람으로서 복권되지 아니한 사람\n3. 금고 이상의 실형을 선고받고 그 집행이 종료(종료된 것으로 보는 경우를 포함한다)되거나 집행이 면제된 날부터 2년이 지나지 아니한 사람\n4. 금고 이상의 형의 집행유예를 선고받고 그 유예기간 중에 있는 사람\n5. 금고 이상의 형의 선고유예를 받고 그 선고유예기간 중에 있는 사람\n6. 법원의 판결 또는 다른 법률에 따라 자격이 상실 또는 정지된 사람\n7. 해당 주택조합의 공동사업주체인 등록사업자 또는 업무대행사의 임직원\n② 주택조합의 발기인이나 임원이 다음 각 호의 어느 하나에 해당하는 경우 해당 발기인은 그 지위를 상실하고 해당 임원은 당연히 퇴직한다. <개정 2020.1.23>\n1. 주택조합의 발기인이 제11조의3제6항에 따른 자격기준을 갖추지 아니하게 되거나 주택조합의 임원이 제11조제7항에 따른 조합원 자격을 갖추지 아니하게 되는 경우\n2. 주택조합의 발기인 또는 임원이 제1항 각 호의 결격사유에 해당하게 되는 경우\n③ 제2항에 따라 지위가 상실된 발기인 또는 퇴직된 임원이 지위 상실이나 퇴직 전에 관여한 행위는 그 효력을 상실하지 아니한다. <개정 2020.1.23>\n④ 주택조합의 임원은 다른 주택조합의 임원, 직원 또는 발기인을 겸할 수 없다. <신설 2020.1.23>"
  - no: '14'
    title: 주택조합에 대한 감독 등
    text: "제14조(주택조합에 대한 감독 등)\n① 국토교통부장관 또는 시장ㆍ군수ㆍ구청장은 주택공급에 관한 질서를 유지하기 위하여 특히 필요하다고 인정되는 경우에는 국가가 관리하고 있는 행정전산망 등을 이용하여 주택조합 구성원의 자격 등에 관하여 필요한 사항을 확인할 수 있다.\n② 시장ㆍ군수ㆍ구청장은 주택조합 또는 주택조합의 구성원이 다음 각 호의 어느 하나에 해당하는 경우에는 주택조합의 설립인가를 취소할 수 있다.\n1. 거짓이나 그 밖의 부정한 방법으로 설립인가를 받은 경우\n2. 제94조에 따른 명령이나 처분을 위반한 경우\n③ 삭제 <2020.1.23>\n④ 시장ㆍ군수ㆍ구청장은 모집주체가 이 법을 위반한 경우 시정요구 등 필요한 조치를 명할 수 있다. <신설 2019.12.10>\n⑤ 국토교통부장관, 특별시장ㆍ통합특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사 또는 특별자치도지사(이하 \"시ㆍ도지사\"라 한다), 시장ㆍ군수ㆍ구청장은 이 법에 따른 주택조합의 원활한 사업추진을 위하여 관계 공무원 및 전문가로 구성된 점검반을 구성하여 모집주체 및 주택조합(제15조제1항에 따른 사업계획승인을 받은 경우에는 사업주체를 포함한다)에 대한 현장조사를 실시할 수 있으며, 현장조사 결과에 따라 위법사항의 시정요구 또는 수사기관에 고발 등 필요한 조치를 할 수 있다. 이 경우 관할 지방자치단체의 장, 모집주체 및 주택조합은 대통령령으로 정하는 자료의 제공 등 점검반의 활동에 적극 협조하여야 하며, 현장조사에 관하여는 제93조제2항부터 제4항까지를 준용한다. <신설 2026.9.8>"
  - no: 14의2
    title: 주택조합의 해산 등
    text: "제14조의2(주택조합의 해산 등)\n① 주택조합은 제11조제1항에 따른 주택조합의 설립인가를 받은 날부터 3년이 되는 날까지 사업계획승인(제66조에 따른 리모델링 허가를 포함한다)을 받지 못하는 경우 대통령령으로 정하는 바에 따라 총회의 의결을 거쳐 해산 여부를 결정하여야 한다. <개정 2026.9.8>\n② 주택조합의 발기인은 제11조의3제1항에 따른 조합원 모집 신고가 수리된 날부터 2년이 되는 날까지 주택조합 설립인가를 받지 못하는 경우 대통령령으로 정하는 바에 따라 주택조합 가입 신청자 전원으로 구성되는 총회 의결을 거쳐 주택조합 사업의 종결 여부를 결정하도록 하여야 한다.\n③ 주택조합의 임원은 제49조제1항 또는 제3항에 따른 사용검사를 받은 날(리모델링주택조합은 이전고시가 있은 날)부터 1년이 되는 날까지 주택조합 해산을 위한 총회를 소집하여야 한다. 이 경우 주택조합의 해산은 조합원 과반수의 출석과 출석 조합원 과반수의 찬성으로 의결한다. <신설 2026.9.8>\n④ 주택조합의 임원이 제3항에 따른 기간 이내에 총회를 소집하지 아니한 경우에는 관계 법령이나 조합규약에서 정하고 있는 절차에도 불구하고 조합원 5분의 1 이상의 요구로 소집된 총회에서 조합원 과반수의 출석과 출석 조합원 과반수의 동의를 받아 주택조합의 해산을 의결할 수 있다. 이 경우 대통령령으로 정하는 바에 따라 총회 소집 요구자 대표로 선출된 자가 조합 해산을 위한 총회의 소집 및 진행을 할 때에는 조합장의 권한을 대행한다. <신설 2026.9.8>\n⑤ 주택조합이 제3항에 따라 총회를 소집하도록 한 기간이 경과한 날부터 6개월 이내에 해산을 의결하지 아니하는 경우에는 시장ㆍ군수ㆍ구청장이 해당 주택조합의 설립인가를 취소하여야 한다. 다만, 조합이 정당한 사유를 소명한 경우에는 유예기간을 부여할 수 있다. <신설 2026.9.8>\n⑥ 제1항부터 제4항까지 중 어느 하나에 따라 총회를 소집하려는 주택조합의 임원, 발기인 또는 총회 소집 요구자 대표로 선출된 자는 총회가 개최되기 7일 전까지 회의 목적, 안건, 일시 및 장소를 정하여 조합원 또는 주택조합 가입 신청자에게 통지하여야 한다. <개정 2026.9.8>\n⑦ 제1항, 제3항 또는 제4항에 따라 해산을 결의하거나 제2항에 따라 사업의 종결을 결의하거나 제5항에 따라 주택조합의 설립인가가 취소된 경우 대통령령으로 정하는 바에 따라 청산인을 선임하여야 한다. 다만, 청산인이 될 자가 없는 경우에는 「민법」 제83조에도 불구하고 시장ㆍ군수ㆍ구청장은 법원에 청산인의 선임을 청구할 수 있다. <개정 2026.9.8>\n⑧ 제7항에 따라 선임된 청산인은 지체 없이 청산의 목적범위에서 성실하게 청산인의 직무를 수행하여야 한다. <신설 2026.9.8>\n⑨ 주택조합의 발기인은 제2항에 따른 총회의 결과(사업의 종결을 결의한 경우에는 청산계획을 포함한다)를 관할 시장ㆍ군수ㆍ구청장에게 국토교통부령으로 정하는 바에 따라 통지하여야 한다. <개정 2026.9.8>"
  - no: 14의3
    title: 회계감사
    text: "제14조의3(회계감사)\n① 주택조합은 대통령령으로 정하는 바에 따라 회계감사를 받아야 하며, 그 감사결과를 관할 시장ㆍ군수ㆍ구청장에게 보고하여야 한다.\n② 주택조합의 임원 또는 발기인은 계약금등(해당 주택조합사업에 관한 모든 수입에 따른 금전을 말한다)의 징수ㆍ보관ㆍ예치ㆍ집행 등 모든 거래 행위에 관하여 장부를 월별로 작성하여 그 증빙서류와 함께 제11조에 따른 주택조합 해산인가를 받는 날까지 보관하여야 한다. 이 경우 주택조합의 임원 또는 발기인은 「전자문서 및 전자거래 기본법」 제2조제2호에 따른 정보처리시스템을 통하여 장부 및 증빙서류를 작성하거나 보관할 수 있다."
  - no: 14의4
    title: 주택조합사업의 시공보증
    text: "제14조의4(주택조합사업의 시공보증)\n① 주택조합이 공동사업주체인 시공자를 선정한 경우 그 시공자는 공사의 시공보증(시공자가 공사의 계약상 의무를 이행하지 못하거나 의무이행을 하지 아니할 경우 보증기관에서 시공자를 대신하여 계약이행의무를 부담하거나 총 공사금액의 50퍼센트 이하에서 대통령령으로 정하는 비율 이상의 범위에서 주택조합이 정하는 금액을 납부할 것을 보증하는 것을 말한다)을 위하여 국토교통부령으로 정하는 기관의 시공보증서를 조합에 제출하여야 한다.\n② 제15조에 따른 사업계획승인권자는 제16조제2항에 따른 착공신고를 받는 경우에는 제1항에 따른 시공보증서 제출 여부를 확인하여야 한다."
  - no: 14의5
    title: 공사비 검증요청 등
    text: "제14조의5(공사비 검증요청 등)\n① 주택조합 또는 제66조제2항에 따라 리모델링을 하려는 입주자대표회의(이하 이 조에서 \"주택조합등\"이라 한다)는 시공자와 계약을 체결한 이후 다음 각 호의 어느 하나에 해당하는 때에는 「한국부동산원법」에 따른 한국부동산원, 한국토지주택공사 또는 지방공사(이하 이 조에서 \"검증기관\"이라 한다)에 공사비 검증을 요청하여야 한다.\n1. 조합원 또는 공동주택 소유자 5분의 1 이상이 검증 의뢰를 요청하는 경우\n2. 공사비의 증액 비율(당초 계약금액 대비 누적 증액 규모의 비율로서 생산자물가상승률은 제외한다)이 다음 각 목의 어느 하나에 해당하는 경우\n3. 제1호 또는 제2호에 따른 공사비 검증이 완료된 이후 공사비의 증액 비율(검증 당시 계약금액 대비 누적 증액 규모의 비율로서 생산자물가상승률은 제외한다)이 100분의 3 이상인 경우\n② 제1항에 따라 공사비 검증을 요청받은 검증기관은 주택조합등과 시공자에게 산출내역서 등 대통령령으로 정하는 검증에 필요한 자료의 제출을 요청할 수 있으며, 주택조합등과 시공자는 검증기관이 요청한 날부터 30일 이내에 필요한 자료를 제출하여야 한다. 다만, 검증기관이 인정하는 경우에는 30일 이내의 범위에서 연장할 수 있다.\n③ 제1항에 따라 공사비 검증을 요청받은 검증기관은 공사비 검증결과를 보고서로 작성하여 주택조합등에 제출하여야 하고, 주택조합등은 공사비 검증보고서를 총회 또는 입주자대표회의에서 공개하여야 한다.\n④ 제3항에 따라 공개한 공사비 검증결과를 반영하여 주택조합등이 시공자와 공사비 증액 계약을 하려는 경우 계약 체결 전에 공사비 증액 규모에 대하여 조합총회의 의결 또는 주민투표를 거쳐야 한다.\n⑤ 제1항에도 불구하고 공사비에 대한 분쟁 등 대통령령으로 정하는 사유가 있는 때에는 시장ㆍ군수ㆍ구청장이 검증기관에 공사비 검증을 요청할 수 있다.\n⑥ 공사비의 증액에 관하여 분쟁이 발생한 경우 주택조합등 또는 시공자는 「건설산업기본법」 제69조에 따른 건설분쟁 조정위원회에 분쟁의 조정을 신청할 수 있다.\n⑦ 국토교통부장관은 공사비 증액기준, 설계변경 범위 등의 내용이 기재된 표준계약서를 마련하고, 주택조합등과 시공자가 계약을 체결할 때 이를 사용하도록 권장할 수 있다.\n⑧ 제1항에 따른 공사비 검증의 방법 및 절차, 검증 수수료, 그 밖에 필요한 사항은 국토교통부장관이 정하여 고시한다."
  - no: '15'
    title: 사업계획의 승인
    text: "제15조(사업계획의 승인)\n① 대통령령으로 정하는 호수 이상의 주택건설사업을 시행하려는 자 또는 대통령령으로 정하는 면적 이상의 대지조성사업을 시행하려는 자는 다음 각 호의 사업계획승인권자(이하 \"사업계획승인권자\"라 한다. 국가 및 한국토지주택공사가 시행하는 경우와 대통령령으로 정하는 경우에는 국토교통부장관을 말하며, 이하 이 조, 제16조부터 제19조까지 및 제21조에서 같다)에게 사업계획승인을 받아야 한다. 다만, 주택 외의 시설과 주택을 동일 건축물로 건축하는 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다. <개정 2021.1.12, 2026.3.5, 2026.9.8>\n1. 주택건설사업 또는 대지조성사업으로서 해당 대지면적이 10만제곱미터 이상인 경우: 시ㆍ도지사 또는 「지방자치법」 제198조제1항에 따른 인구 50만 이상의 대도시(이하 \"대도시\"라 한다)의 시장\n2. 주택건설사업 또는 대지조성사업으로서 해당 대지면적이 10만제곱미터 미만인 경우: 특별시장ㆍ통합특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수\n② 제1항에 따라 사업계획승인을 받으려는 자는 사업계획승인신청서에 주택과 그 부대시설 및 복리시설의 배치도, 대지조성공사 설계도서 등 대통령령으로 정하는 서류를 첨부하여 사업계획승인권자에게 제출하여야 한다.\n③ 주택건설사업을 시행하려는 자는 대통령령으로 정하는 호수 이상의 주택단지를 공구별로 분할하여 주택을 건설ㆍ공급할 수 있다. 이 경우 제2항에 따른 서류와 함께 다음 각 호의 서류를 첨부하여 사업계획승인권자에게 제출하고 사업계획승인을 받아야 한다.\n1. 공구별 공사계획서\n2. 입주자모집계획서\n3. 사용검사계획서\n④ 제1항 또는 제3항에 따라 승인받은 사업계획을 변경하려면 사업계획승인권자로부터 변경승인을 받아야 한다. 다만, 국토교통부령으로 정하는 경미한 사항을 변경하는 경우에는 그러하지 아니하다.\n⑤ 제1항 또는 제3항의 사업계획은 쾌적하고 문화적인 주거생활을 하는 데에 적합하도록 수립되어야 하며, 그 사업계획에는 부대시설 및 복리시설의 설치에 관한 계획 등이 포함되어야 한다.\n⑥ 사업계획승인권자는 제1항 또는 제3항에 따라 사업계획을 승인하였을 때에는 이에 관한 사항을 고시하여야 한다. 이 경우 국토교통부장관은 관할 시장ㆍ군수ㆍ구청장에게, 특별시장ㆍ통합특별시장ㆍ광역시장 또는 도지사는 관할 시장, 군수 또는 구청장에게 각각 사업계획승인서 및 관계 서류의 사본을 지체 없이 송부하여야 한다. <개정 2026.3.5>"
  - no: '16'
    title: 사업계획의 이행 및 취소 등
    text: "제16조(사업계획의 이행 및 취소 등)\n① 사업주체는 제15조제1항 또는 제3항에 따라 승인받은 사업계획대로 사업을 시행하여야 하고, 다음 각 호의 구분에 따라 공사를 시작하여야 한다. 다만, 사업계획승인권자는 대통령령으로 정하는 정당한 사유가 있다고 인정하는 경우에는 사업주체의 신청을 받아 그 사유가 없어진 날부터 1년의 범위에서 제1호 또는 제2호가목에 따른 공사의 착수기간을 연장할 수 있다.\n1. 제15조제1항에 따라 승인을 받은 경우: 승인받은 날부터 5년 이내\n2. 제15조제3항에 따라 승인을 받은 경우\n② 사업주체가 제1항에 따라 공사를 시작하려는 경우에는 국토교통부령으로 정하는 바에 따라 사업계획승인권자에게 신고하여야 한다.\n③ 사업계획승인권자는 제2항에 따른 신고를 받은 날부터 20일 이내에 신고수리 여부를 신고인에게 통지하여야 한다. <신설 2021.1.5>\n④ 사업계획승인권자는 다음 각 호의 어느 하나에 해당하는 경우 그 사업계획의 승인을 취소(제2호 또는 제3호에 해당하는 경우 「주택도시기금법」 제26조에 따라 주택분양보증이 된 사업은 제외한다)할 수 있다. <개정 2021.1.5>\n1. 사업주체가 제1항(제2호나목은 제외한다)을 위반하여 공사를 시작하지 아니한 경우\n2. 사업주체가 경매ㆍ공매 등으로 인하여 대지소유권을 상실한 경우\n3. 사업주체의 부도ㆍ파산 등으로 공사의 완료가 불가능한 경우\n⑤ 사업계획승인권자는 제4항제2호 또는 제3호의 사유로 사업계획승인을 취소하고자 하는 경우에는 사업주체에게 사업계획 이행, 사업비 조달 계획 등 대통령령으로 정하는 내용이 포함된 사업 정상화 계획을 제출받아 계획의 타당성을 심사한 후 취소 여부를 결정하여야 한다. <개정 2021.1.5>\n⑥ 제4항에도 불구하고 사업계획승인권자는 해당 사업의 시공자 등이 제21조제1항에 따른 해당 주택건설대지의 소유권 등을 확보하고 사업주체 변경을 위하여 제15조제4항에 따른 사업계획의 변경승인을 요청하는 경우에 이를 승인할 수 있다. <개정 2021.1.5>"
  - no: '17'
    title: 기반시설의 기부채납
    text: "제17조(기반시설의 기부채납)\n① 사업계획승인권자는 제15조제1항 또는 제3항에 따라 사업계획을 승인할 때 사업주체가 제출하는 사업계획에 해당 주택건설사업 또는 대지조성사업과 직접적으로 관련이 없거나 과도한 기반시설의 기부채납(寄附採納)을 요구하여서는 아니 된다.\n② 국토교통부장관은 기부채납 등과 관련하여 다음 각 호의 사항이 포함된 운영기준을 작성하여 고시할 수 있다.\n1. 주택건설사업의 기반시설 기부채납 부담의 원칙 및 수준에 관한 사항\n2. 주택건설사업의 기반시설의 설치기준 등에 관한 사항\n③ 사업계획승인권자는 제2항에 따른 운영기준의 범위에서 지역여건 및 사업의 특성 등을 고려하여 자체 실정에 맞는 별도의 기준을 마련하여 운영할 수 있으며, 이 경우 미리 국토교통부장관에게 보고하여야 한다."
  - no: '18'
    title: 사업계획의 통합심의 등
    text: "제18조(사업계획의 통합심의 등)\n① 사업계획승인권자는 필요하다고 인정하는 경우에 도시계획ㆍ건축ㆍ환경ㆍ교통ㆍ재해 등 사업계획승인과 관련된 다음 각 호의 사항을 통합하여 검토 및 심의(이하 \"통합심의\"라 한다)할 수 있다. <개정 2026.2.3>\n1. 「건축법」에 따른 건축심의\n2. 「국토의 계획 및 이용에 관한 법률」에 따른 도시ㆍ군관리계획 및 개발행위 관련 사항\n3. 「대도시권 광역교통 관리에 관한 특별법」에 따른 광역교통 개선대책\n4. 「도시교통정비 촉진법」에 따른 교통영향평가\n5. 「경관법」에 따른 경관심의\n6. 「교육환경 보호에 관한 법률」에 따른 교육환경에 대한 평가\n7. 「소방시설 설치 및 관리에 관한 법률」에 따른 성능위주설계에 대한 평가\n8. 「자연재해대책법」에 따른 재해영향평가\n9. 그 밖에 사업계획승인권자가 필요하다고 인정하여 통합심의에 부치는 사항\n② 사업계획승인권자는 제15조제1항 또는 제3항에 따라 사업계획승인을 받으려는 자가 통합심의를 신청하는 경우 통합심의를 하여야 한다. 다만, 사업계획의 특성 및 규모 등으로 인하여 제1항 각 호 중 어느 하나에 대하여 통합심의가 적절하지 아니하다고 인정하는 경우에는 그 사항을 제외하고 통합심의를 할 수 있다. <신설 2024.1.16>\n③ 제15조제1항 또는 제3항에 따라 사업계획승인을 받으려는 자가 통합심의를 신청하는 경우 제1항 각 호와 관련된 서류를 첨부하여야 한다. 이 경우 사업계획승인권자는 통합심의를 효율적으로 처리하기 위하여 필요한 경우 제출기한을 정하여 제출하도록 할 수 있다. <개정 2024.1.16>\n④ 사업계획승인권자가 시장ㆍ군수ㆍ구청장인 경우로서 시ㆍ도지사가 제1항 각 호의 어느 하나에 해당하는 권한을 가진 경우에는 사업계획승인권자가 시ㆍ도지사에게 통합심의를 요청할 수 있다. <신설 2024.1.16>\n⑤ 통합심의를 하는 지방자치단체의 장은 다음 각 호의 어느 하나에 해당하는 위원회 등에 속하고 해당 위원회 등의 장의 추천을 받은 위원 등과 사업계획승인권자가 속한 지방자치단체 및 제4항에 따라 통합심의를 하는 지방자치단체 소속 공무원으로 소집된 공동위원회를 구성하여 통합심의를 하여야 한다. 이 경우 공동위원회의 구성, 통합심의의 방법 및 절차에 관한 사항은 대통령령으로 정한다. <개정 2024.1.16, 2026.2.3>\n1. 「건축법」에 따른 중앙건축위원회 및 지방건축위원회\n2. 「국토의 계획 및 이용에 관한 법률」에 따라 해당 주택단지가 속한 지방자치단체에 설치된 지방도시계획위원회\n3. 「대도시권 광역교통 관리에 관한 특별법」에 따라 광역교통 개선대책에 대하여 심의권한을 가진 국가교통위원회\n4. 「도시교통정비 촉진법」에 따른 교통영향평가심의위원회\n5. 「경관법」에 따른 경관위원회\n6. 「교육환경 보호에 관한 법률」에 따른 교육환경보호위원회\n7. 「소방시설 설치 및 관리에 관한 법률」에 따른 성능위주설계평가단 또는 중앙소방기술심의위원회\n8. 「자연재해대책법」에 따른 재해영향평가심의위원회\n9. 제1항제9호에 대하여 심의권한을 가진 관련 위원회\n⑥ 사업계획승인권자는 통합심의를 한 경우 특별한 사유가 없으면 심의 결과를 반영하여 사업계획을 승인하여야 한다. <개정 2024.1.16>\n⑦ 통합심의를 거친 경우에는 제1항 각 호에 대한 검토ㆍ심의ㆍ조사ㆍ협의ㆍ조정 또는 재정을 거친 것으로 본다. <개정 2024.1.16>"
  - no: '19'
    title: 다른 법률에 따른 인가ㆍ허가 등의 의제 등
    text: "제19조(다른 법률에 따른 인가ㆍ허가 등의 의제 등)\n① 사업계획승인권자가 제15조에 따라 사업계획을 승인 또는 변경 승인할 때 다음 각 호의 허가ㆍ인가ㆍ결정ㆍ승인 또는 신고 등(이하 \"인ㆍ허가등\"이라 한다)에 관하여 제3항에 따른 관계 행정기관의 장과 협의한 사항에 대하여는 해당 인ㆍ허가등을 받은 것으로 보며, 사업계획의 승인고시가 있은 때에는 다음 각 호의 관계 법률에 따른 고시가 있은 것으로 본다. <개정 2016.1.19, 2016.12.27, 2021.7.20, 2022.12.27, 2026.9.8>\n1. 「건축법」 제11조에 따른 건축허가, 같은 법 제14조에 따른 건축신고, 같은 법 제16조에 따른 허가ㆍ신고사항의 변경 및 같은 법 제20조에 따른 가설건축물의 건축허가 또는 신고\n2. 「공간정보의 구축 및 관리 등에 관한 법률」 제15조제4항에 따른 지도등의 간행 심사\n3. 「공유수면 관리 및 매립에 관한 법률」 제8조에 따른 공유수면의 점용ㆍ사용허가, 같은 법 제10조에 따른 협의 또는 승인, 같은 법 제17조에 따른 점용ㆍ사용 실시계획의 승인 또는 신고, 같은 법 제28조에 따른 공유수면의 매립면허, 같은 법 제35조에 따른 국가 등이 시행하는 매립의 협의 또는 승인 및 같은 법 제38조에 따른 공유수면매립실시계획의 승인\n4. 「광업법」 제42조에 따른 채굴계획의 인가\n5. 「국토의 계획 및 이용에 관한 법률」 제30조에 따른 도시ㆍ군관리계획(같은 법 제2조제4호다목의 계획 및 같은 호 마목의 계획 중 같은 법 제51조제1항에 따른 지구단위계획구역 및 지구단위계획만 해당한다)의 결정, 같은 법 제56조에 따른 개발행위의 허가, 같은 법 제86조에 따른 도시ㆍ군계획시설사업시행자의 지정, 같은 법 제88조에 따른 실시계획의 인가 및 같은 법 제130조제2항에 따른 타인의 토지에의 출입허가\n6. 「농어촌정비법」 제23조에 따른 농업생산기반시설의 사용허가\n7. 「농지법」 제34조에 따른 농지전용(農地轉用)의 허가 또는 협의\n8. 「도로법」 제36조에 따른 도로공사 시행의 허가, 같은 법 제61조에 따른 도로점용의 허가\n9. 「도시개발법」 제3조에 따른 도시개발구역의 지정, 같은 법 제11조에 따른 시행자의 지정, 같은 법 제17조에 따른 실시계획의 인가 및 같은 법 제64조제2항에 따른 타인의 토지에의 출입허가\n10. 「사도법」 제4조에 따른 사도(私道)의 개설허가\n11. 「사방사업법」 제14조에 따른 토지의 형질변경 등의 허가, 같은 법 제20조에 따른 사방지(砂防地) 지정의 해제\n12. 「산림보호법」 제9조제1항 및 같은 조 제2항제1호ㆍ제2호에 따른 산림보호구역에서의 행위의 허가ㆍ신고. 다만, 「산림자원의 조성 및 관리에 관한 법률」에 따른 채종림 및 시험림과 「산림보호법」에 따른 산림유전자원보호구역의 경우는 제외한다.\n13. 「산림자원의 조성 및 관리에 관한 법률」 제36조제1항ㆍ제5항에 따른 입목벌채등의 허가ㆍ신고. 다만, 같은 법에 따른 채종림 및 시험림과 「산림보호법」에 따른 산림유전자원보호구역의 경우는 제외한다.\n14. 「산지관리법」 제14조ㆍ제15조에 따른 산지전용허가 및 산지전용신고, 같은 법 제15조의2에 따른 산지일시사용허가ㆍ신고\n15. 「소하천정비법」 제10조에 따른 소하천공사 시행의 허가, 같은 법 제14조에 따른 소하천 점용 등의 허가 또는 신고\n16. 「수도법」 제17조 또는 제49조에 따른 수도사업의 인가, 같은 법 제52조에 따른 전용상수도 설치의 인가\n17. 「연안관리법」 제25조에 따른 연안정비사업실시계획의 승인\n18. 「유통산업발전법」 제8조에 따른 대규모점포의 등록\n19. 「장사 등에 관한 법률」 제27조제1항에 따른 무연분묘의 개장허가\n20. 「지하수법」 제7조 또는 제8조에 따른 지하수 개발ㆍ이용의 허가 또는 신고\n21. 「초지법」 제23조에 따른 초지전용의 허가\n22. 「택지개발촉진법」 제6조에 따른 행위의 허가\n23. 「하수도법」 제16조에 따른 공공하수도에 관한 공사 시행의 허가, 같은 법 제34조제2항에 따른 개인하수처리시설의 설치신고\n24. 「하천법」 제30조에 따른 하천공사 시행의 허가 및 하천공사실시계획의 인가, 같은 법 제33조에 따른 하천의 점용허가 및 같은 법 제50조에 따른 하천수의 사용허가\n25. 「부동산 거래신고 등에 관한 법률」 제11조에 따른 토지거래계약에 관한 허가\n26. 「전기안전관리법」 제8조에 따른 자가용전기설비의 공사계획의 인가 및 신고\n27. 「소방시설 설치 및 관리에 관한 법률」 제6조제1항에 따른 건축허가등의 동의\n28. 「장애인ㆍ노인ㆍ임산부 등의 편의증진 보장에 관한 법률」 제9조의2에 따른 편의시설 설치기준의 적합성 확인\n② 인ㆍ허가등의 의제를 받으려는 자는 제15조에 따른 사업계획승인을 신청할 때에 해당 법률에서 정하는 관계 서류를 함께 제출하여야 한다.\n③ 사업계획승인권자는 제15조에 따라 사업계획을 승인하려는 경우 그 사업계획에 제1항 각 호의 어느 하나에 해당하는 사항이 포함되어 있는 경우에는 해당 법률에서 정하는 관계 서류를 미리 관계 행정기관의 장에게 제출한 후 협의하여야 한다. 이 경우 협의 요청을 받은 관계 행정기관의 장은 사업계획승인권자의 협의 요청을 받은 날부터 20일 이내에 의견을 제출하여야 하며, 그 기간 내에 의견을 제출하지 아니한 경우에는 협의가 완료된 것으로 본다.\n④ 제3항에 따라 사업계획승인권자의 협의 요청을 받은 관계 행정기관의 장은 해당 법률에서 규정한 인ㆍ허가등의 기준을 위반하여 협의에 응하여서는 아니 된다.\n⑤ 대통령령으로 정하는 비율 이상의 국민주택을 건설하는 사업주체가 제1항에 따라 다른 법률에 따른 인ㆍ허가등을 받은 것으로 보는 경우에는 관계 법률에 따라 부과되는 수수료 등을 면제한다."
  - no: '20'
    title: 주택건설사업 등에 의한 임대주택의 건설 등
    text: "제20조(주택건설사업 등에 의한 임대주택의 건설 등)\n① 사업주체(리모델링을 시행하는 자는 제외한다)가 다음 각 호의 사항을 포함한 사업계획승인신청서(「건축법」 제11조제3항의 허가신청서를 포함한다. 이하 이 조에서 같다)를 제출하는 경우 사업계획승인권자(건축허가권자를 포함한다)는 「국토의 계획 및 이용에 관한 법률」 제78조의 용도지역별 용적률 범위에서 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 조례로 정하는 기준에 따라 용적률을 완화하여 적용할 수 있다.\n1. 제15조제1항에 따른 호수 이상의 주택과 주택 외의 시설을 동일 건축물로 건축하는 계획\n2. 임대주택의 건설ㆍ공급에 관한 사항\n② 제1항에 따라 용적률을 완화하여 적용하는 경우 사업주체는 완화된 용적률의 60퍼센트 이하의 범위에서 대통령령으로 정하는 비율 이상에 해당하는 면적을 임대주택으로 공급하여야 한다. 이 경우 사업주체는 임대주택을 국토교통부장관, 시ㆍ도지사, 한국토지주택공사 또는 지방공사(이하 \"인수자\"라 한다)에 공급하여야 하며 시ㆍ도지사가 우선 인수할 수 있다. 다만, 시ㆍ도지사가 임대주택을 인수하지 아니하는 경우 다음 각 호의 구분에 따라 국토교통부장관에게 인수자 지정을 요청하여야 한다.\n1. 특별시장, 광역시장 또는 도지사가 인수하지 아니하는 경우: 관할 시장, 군수 또는 구청장이 제1항의 사업계획승인(「건축법」 제11조의 건축허가를 포함한다. 이하 이 조에서 같다)신청 사실을 특별시장, 광역시장 또는 도지사에게 통보한 후 국토교통부장관에게 인수자 지정 요청\n2. 특별자치시장 또는 특별자치도지사가 인수하지 아니하는 경우: 특별자치시장 또는 특별자치도지사가 직접 국토교통부장관에게 인수자 지정 요청\n③ 제2항에 따라 공급되는 임대주택의 공급가격은 「공공주택 특별법」 제50조의3제1항에 따른 공공건설임대주택의 분양전환가격 산정기준에서 정하는 건축비로 하고, 그 부속토지는 인수자에게 기부채납한 것으로 본다.\n④ 사업주체는 제15조에 따른 사업계획승인을 신청하기 전에 미리 용적률의 완화로 건설되는 임대주택의 규모 등에 관하여 인수자와 협의하여 사업계획승인신청서에 반영하여야 한다.\n⑤ 사업주체는 공급되는 주택의 전부(제11조의 주택조합이 설립된 경우에는 조합원에게 공급하고 남은 주택을 말한다)를 대상으로 공개추첨의 방법에 의하여 인수자에게 공급하는 임대주택을 선정하여야 하며, 그 선정 결과를 지체 없이 인수자에게 통보하여야 한다.\n⑥ 사업주체는 임대주택의 준공인가(「건축법」 제22조의 사용승인을 포함한다)를 받은 후 지체 없이 인수자에게 등기를 촉탁 또는 신청하여야 한다. 이 경우 사업주체가 거부 또는 지체하는 경우에는 인수자가 등기를 촉탁 또는 신청할 수 있다."
  - no: '21'
    title: 대지의 소유권 확보 등
    text: "제21조(대지의 소유권 확보 등)\n① 제15조제1항 또는 제3항에 따라 주택건설사업계획의 승인을 받으려는 자는 해당 주택건설대지의 소유권을 확보하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. <개정 2020.1.23, 2026.9.8>\n1. 지구단위계획의 결정(제19조제1항제5호에 따라 의제되는 경우를 포함한다)이 필요한 주택건설사업의 해당 대지면적의 80퍼센트 이상을 사용할 수 있는 권원(權原)[제5조제2항에 따라 등록사업자와 공동으로 사업을 시행하는 주택조합(리모델링주택조합은 제외한다)의 경우에는 80퍼센트 이상의 소유권을 말한다. 이하 이 조, 제22조 및 제23조에서 같다]을 확보하고(국공유지가 포함된 경우에는 해당 토지의 관리청이 해당 토지를 사업주체에게 매각하거나 양여할 것을 확인한 서류를 사업계획승인권자에게 제출하는 경우에는 확보한 것으로 본다), 확보하지 못한 대지가 제22조 및 제23조에 따른 매도청구 대상이 되는 대지에 해당하는 경우\n2. 사업주체가 주택건설대지의 소유권을 확보하지 못하였으나 그 대지를 사용할 수 있는 권원을 확보한 경우\n3. 국가ㆍ지방자치단체ㆍ한국토지주택공사 또는 지방공사가 주택건설사업을 하는 경우\n4. 제66조제2항에 따라 리모델링 결의를 한 리모델링주택조합이 제22조제2항에 따라 매도청구를 하는 경우\n② 사업주체가 제16조제2항에 따라 신고한 후 공사를 시작하려는 경우 사업계획승인을 받은 해당 주택건설대지에 제22조 및 제23조에 따른 매도청구 대상이 되는 대지가 포함되어 있으면 해당 매도청구 대상 대지에 대하여는 그 대지의 소유자가 매도에 대하여 합의를 하거나 매도청구에 관한 법원의 승소판결(확정되지 아니한 판결을 포함한다)을 받은 경우에만 공사를 시작할 수 있다. <개정 2020.6.9>"
  - no: '22'
    title: 매도청구 등
    text: "제22조(매도청구 등)\n① 제21조제1항제1호에 따라 사업계획승인을 받은 사업주체는 다음 각 호에 따라 해당 주택건설대지 중 사용할 수 있는 권원을 확보하지 못한 대지(건축물을 포함한다. 이하 이 조 및 제23조에서 같다)의 소유자에게 그 대지를 시가(市價)로 매도할 것을 청구할 수 있다. 이 경우 매도청구 대상이 되는 대지의 소유자와 매도청구를 하기 전에 3개월 이상 협의를 하여야 한다.\n1. 주택건설대지면적의 95퍼센트 이상의 사용권원을 확보한 경우: 사용권원을 확보하지 못한 대지의 모든 소유자에게 매도청구 가능\n2. 제1호 외의 경우: 사용권원을 확보하지 못한 대지의 소유자 중 지구단위계획구역 결정고시일 10년 이전에 해당 대지의 소유권을 취득하여 계속 보유하고 있는 자(대지의 소유기간을 산정할 때 대지소유자가 직계존속ㆍ직계비속 및 배우자로부터 상속받아 소유권을 취득한 경우에는 피상속인의 소유기간을 합산한다)를 제외한 소유자에게 매도청구 가능\n② 제1항에도 불구하고 제66조제2항에 따른 리모델링의 허가를 신청하기 위한 동의율을 확보한 경우 리모델링 결의를 한 리모델링주택조합은 그 리모델링 결의에 찬성하지 아니하는 자의 주택 및 토지에 대하여 매도청구를 할 수 있다. <개정 2020.1.23>\n③ 제1항 및 제2항에 따른 매도청구에 관하여는 「집합건물의 소유 및 관리에 관한 법률」 제48조를 준용한다. 이 경우 구분소유권 및 대지사용권은 주택건설사업 또는 리모델링사업의 매도청구의 대상이 되는 건축물 또는 토지의 소유권과 그 밖의 권리로 본다."
  - no: '23'
    title: 소유자를 확인하기 곤란한 대지 등에 대한 처분
    text: "제23조(소유자를 확인하기 곤란한 대지 등에 대한 처분)\n① 제21조제1항제1호에 따라 사업계획승인을 받은 사업주체는 해당 주택건설대지 중 사용할 수 있는 권원을 확보하지 못한 대지의 소유자가 있는 곳을 확인하기가 현저히 곤란한 경우에는 전국적으로 배포되는 둘 이상의 일간신문에 두 차례 이상 공고하고, 공고한 날부터 30일 이상이 지났을 때에는 제22조에 따른 매도청구 대상의 대지로 본다.\n② 사업주체는 제1항에 따른 매도청구 대상 대지의 감정평가액에 해당하는 금액을 법원에 공탁(供託)하고 주택건설사업을 시행할 수 있다.\n③ 제2항에 따른 대지의 감정평가액은 사업계획승인권자가 추천하는 「감정평가 및 감정평가사에 관한 법률」에 따른 감정평가법인등 2인 이상이 평가한 금액을 산술평균하여 산정한다. <개정 2016.1.19, 2020.4.7>"
  - no: '24'
    title: 토지에의 출입 등
    text: "제24조(토지에의 출입 등)\n① 국가ㆍ지방자치단체ㆍ한국토지주택공사 및 지방공사인 사업주체가 사업계획의 수립을 위한 조사 또는 측량을 하려는 경우와 국민주택사업을 시행하기 위하여 필요한 경우에는 다음 각 호의 행위를 할 수 있다.\n1. 타인의 토지에 출입하는 행위\n2. 특별한 용도로 이용되지 아니하고 있는 타인의 토지를 재료적치장 또는 임시도로로 일시 사용하는 행위\n3. 특히 필요한 경우 죽목(竹木)ㆍ토석이나 그 밖의 장애물을 변경하거나 제거하는 행위\n② 제1항에 따른 사업주체가 국민주택을 건설하거나 국민주택을 건설하기 위한 대지를 조성하는 경우에는 토지나 토지에 정착한 물건 및 그 토지나 물건에 관한 소유권 외의 권리(이하 \"토지등\"이라 한다)를 수용하거나 사용할 수 있다.\n③ 제1항의 경우에는 「국토의 계획 및 이용에 관한 법률」 제130조제2항부터 제9항까지 및 같은 법 제144조제1항제2호ㆍ제3호를 준용한다. 이 경우 \"도시ㆍ군계획시설사업의 시행자\"는 \"사업주체\"로, \"제130조제1항\"은 \"이 법 제24조제1항\"으로 본다."
  - no: '25'
    title: 토지에의 출입 등에 따른 손실보상
    text: "제25조(토지에의 출입 등에 따른 손실보상)\n① 제24조제1항에 따른 행위로 인하여 손실을 입은 자가 있는 경우에는 그 행위를 한 사업주체가 그 손실을 보상하여야 한다.\n② 제1항에 따른 손실보상에 관하여는 그 손실을 보상할 자와 손실을 입은 자가 협의하여야 한다.\n③ 손실을 보상할 자 또는 손실을 입은 자는 제2항에 따른 협의가 성립되지 아니하거나 협의를 할 수 없는 경우에는 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 관할 토지수용위원회에 재결(裁決)을 신청할 수 있다.\n④ 제3항에 따른 관할 토지수용위원회의 재결에 관하여는 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제83조부터 제87조까지의 규정을 준용한다."
  - no: '26'
    title: 토지매수 업무 등의 위탁
    text: "제26조(토지매수 업무 등의 위탁)\n① 국가 또는 한국토지주택공사인 사업주체는 주택건설사업 또는 대지조성사업을 위한 토지매수 업무와 손실보상 업무를 대통령령으로 정하는 바에 따라 관할 지방자치단체의 장에게 위탁할 수 있다.\n② 사업주체가 제1항에 따라 토지매수 업무와 손실보상 업무를 위탁할 때에는 그 토지매수 금액과 손실보상 금액의 2퍼센트의 범위에서 대통령령으로 정하는 요율의 위탁수수료를 해당 지방자치단체에 지급하여야 한다."
  - no: '27'
    title: 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」의 준용
    text: "제27조(「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」의 준용)\n① 제24조제2항에 따라 토지등을 수용하거나 사용하는 경우 이 법에 규정된 것 외에는 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」을 준용한다.\n② 제1항에 따라 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」을 준용하는 경우에는 \"「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제20조제1항에 따른 사업인정\"을 \"제15조에 따른 사업계획승인\"으로 본다. 다만, 재결신청은 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제23조제1항 및 제28조제1항에도 불구하고 사업계획승인을 받은 주택건설사업 기간 이내에 할 수 있다."
  - no: '28'
    title: 간선시설의 설치 및 비용의 상환
    text: "제28조(간선시설의 설치 및 비용의 상환)\n① 사업주체가 대통령령으로 정하는 호수 이상의 주택건설사업을 시행하는 경우 또는 대통령령으로 정하는 면적 이상의 대지조성사업을 시행하는 경우 다음 각 호에 해당하는 자는 각각 해당 간선시설을 설치하여야 한다. 다만, 제1호에 해당하는 시설로서 사업주체가 제15조제1항 또는 제3항에 따른 주택건설사업계획 또는 대지조성사업계획에 포함하여 설치하려는 경우에는 그러하지 아니하다.\n1. 지방자치단체: 도로 및 상하수도시설\n2. 해당 지역에 전기ㆍ통신ㆍ가스 또는 난방을 공급하는 자: 전기시설ㆍ통신시설ㆍ가스시설 또는 지역난방시설\n3. 국가: 우체통\n② 제1항 각 호에 따른 간선시설은 특별한 사유가 없으면 제49조제1항에 따른 사용검사일까지 설치를 완료하여야 한다.\n③ 제1항에 따른 간선시설의 설치 비용은 설치의무자가 부담한다. 이 경우 제1항제1호에 따른 간선시설의 설치 비용은 그 비용의 50퍼센트의 범위에서 국가가 보조할 수 있다.\n④ 제3항에도 불구하고 제1항의 전기간선시설을 지중선로(地中線路)로 설치하는 경우에는 전기를 공급하는 자와 지중에 설치할 것을 요청하는 자가 각각 50퍼센트의 비율로 그 설치 비용을 부담한다. 다만, 사업지구 밖의 기간시설로부터 그 사업지구 안의 가장 가까운 주택단지(사업지구 안에 1개의 주택단지가 있는 경우에는 그 주택단지를 말한다)의 경계선까지 전기간선시설을 설치하는 경우에는 전기를 공급하는 자가 부담한다.\n⑤ 지방자치단체는 사업주체가 자신의 부담으로 제1항제1호에 해당하지 아니하는 도로 또는 상하수도시설(해당 주택건설사업 또는 대지조성사업과 직접적으로 관련이 있는 경우로 한정한다)의 설치를 요청할 경우에는 이에 따를 수 있다.\n⑥ 제1항에 따른 간선시설의 종류별 설치 범위는 대통령령으로 정한다.\n⑦ 간선시설 설치의무자가 제2항의 기간까지 간선시설의 설치를 완료하지 못할 특별한 사유가 있는 경우에는 사업주체가 그 간선시설을 자기부담으로 설치하고 간선시설 설치의무자에게 그 비용의 상환을 요구할 수 있으며, 간선시설 설치의무자는 이에 따라야 한다. <개정 2026.2.3>\n⑧ 제7항에 따른 간선시설 설치 비용의 상환 방법 및 절차 등에 필요한 사항은 대통령령으로 정한다."
  - no: '29'
    title: 공공시설의 귀속 등
    text: "제29조(공공시설의 귀속 등)\n① 사업주체가 제15조제1항 또는 제3항에 따라 사업계획승인을 받은 사업지구의 토지에 새로 공공시설을 설치하거나 기존의 공공시설에 대체되는 공공시설을 설치하는 경우 그 공공시설의 귀속에 관하여는 「국토의 계획 및 이용에 관한 법률」 제65조 및 제99조를 준용한다. 이 경우 \"개발행위허가를 받은 자\"는 \"사업주체\"로, \"개발행위허가\"는 \"사업계획승인\"으로, \"행정청인 시행자\"는 \"한국토지주택공사 및 지방공사\"로 본다.\n② 제1항 후단에 따라 행정청인 시행자로 보는 한국토지주택공사 및 지방공사는 해당 공사에 귀속되는 공공시설을 해당 국민주택사업을 시행하는 목적 외로는 사용하거나 처분할 수 없다."
  - no: '30'
    title: 국공유지 등의 우선 매각 및 임대
    text: "제30조(국공유지 등의 우선 매각 및 임대)\n① 국가 또는 지방자치단체는 그가 소유하는 토지를 매각하거나 임대하는 경우에는 다음 각 호의 어느 하나의 목적으로 그 토지의 매수 또는 임차를 원하는 자가 있으면 그에게 우선적으로 그 토지를 매각하거나 임대할 수 있다.\n1. 국민주택규모의 주택을 대통령령으로 정하는 비율 이상으로 건설하는 주택의 건설\n2. 주택조합이 건설하는 주택(이하 \"조합주택\"이라 한다)의 건설\n3. 제1호 또는 제2호의 주택을 건설하기 위한 대지의 조성\n② 국가 또는 지방자치단체는 제1항에 따라 국가 또는 지방자치단체로부터 토지를 매수하거나 임차한 자가 그 매수일 또는 임차일부터 2년 이내에 국민주택규모의 주택 또는 조합주택을 건설하지 아니하거나 그 주택을 건설하기 위한 대지조성사업을 시행하지 아니한 경우에는 환매(還買)하거나 임대계약을 취소할 수 있다."
  - no: '31'
    title: 환지 방식에 의한 도시개발사업으로 조성된 대지의 활용
    text: "제31조(환지 방식에 의한 도시개발사업으로 조성된 대지의 활용)\n① 사업주체가 국민주택용지로 사용하기 위하여 도시개발사업시행자[「도시개발법」에 따른 환지(換地) 방식에 의하여 사업을 시행하는 도시개발사업의 시행자를 말한다. 이하 이 조에서 같다]에게 체비지(替費地)의 매각을 요구한 경우 그 도시개발사업시행자는 대통령령으로 정하는 바에 따라 체비지의 총면적의 50퍼센트의 범위에서 이를 우선적으로 사업주체에게 매각할 수 있다.\n② 제1항의 경우 사업주체가 「도시개발법」 제28조에 따른 환지 계획의 수립 전에 체비지의 매각을 요구하면 도시개발사업시행자는 사업주체에게 매각할 체비지를 그 환지 계획에서 하나의 단지로 정하여야 한다.\n③ 제1항에 따른 체비지의 양도가격은 국토교통부령으로 정하는 바에 따라 「감정평가 및 감정평가사에 관한 법률」에 따른 감정평가법인등이 감정평가한 감정가격을 기준으로 한다. 다만, 임대주택을 건설하는 경우 등 국토교통부령으로 정하는 경우에는 국토교통부령으로 정하는 조성원가를 기준으로 할 수 있다. <개정 2016.1.19, 2020.4.7>"
  - no: '32'
    title: 서류의 열람
    text: 제32조(서류의 열람) 국민주택을 건설ㆍ공급하는 사업주체는 주택건설사업 또는 대지조성사업을 시행할 때 필요한 경우에는 등기소나 그 밖의 관계 행정기관의 장에게 필요한 서류의 열람ㆍ등사나 그 등본 또는 초본의 발급을 무료로 청구할 수 있다.
  - no: '33'
    title: 주택의 설계 및 시공
    text: "제33조(주택의 설계 및 시공)\n① 제15조에 따른 사업계획승인을 받아 건설되는 주택(부대시설과 복리시설을 포함한다. 이하 이 조, 제49조, 제54조 및 제61조에서 같다)을 설계하는 자는 대통령령으로 정하는 설계도서 작성기준에 맞게 설계하여야 한다.\n② 제1항에 따른 주택을 시공하는 자(이하 \"시공자\"라 한다)와 사업주체는 설계도서에 맞게 시공하여야 한다."
  - no: '34'
    title: 주택건설공사의 시공 제한 등
    text: "제34조(주택건설공사의 시공 제한 등)\n① 제15조에 따른 사업계획승인을 받은 주택의 건설공사는 「건설산업기본법」 제9조에 따른 건설사업자로서 대통령령으로 정하는 자 또는 제7조에 따라 건설사업자로 간주하는 등록사업자가 아니면 이를 시공할 수 없다. <개정 2019.4.30>\n② 공동주택의 방수ㆍ위생 및 냉난방 설비공사는 「건설산업기본법」 제9조에 따른 건설사업자로서 대통령령으로 정하는 자(특정열사용기자재를 설치ㆍ시공하는 경우에는 「에너지이용 합리화법」에 따른 시공업자를 말한다)가 아니면 이를 시공할 수 없다. <개정 2019.4.30>\n③ 국가 또는 지방자치단체인 사업주체는 제15조에 따른 사업계획승인을 받은 주택건설공사의 설계와 시공을 분리하여 발주하여야 한다. 다만, 주택건설공사 중 대통령령으로 정하는 대형공사로서 기술관리상 설계와 시공을 분리하여 발주할 수 없는 공사의 경우에는 대통령령으로 정하는 입찰방법으로 시행할 수 있다."
  - no: '35'
    title: 주택건설기준 등
    text: "제35조(주택건설기준 등)\n① 사업주체가 건설ㆍ공급하는 주택의 건설 등에 관한 다음 각 호의 기준(이하 \"주택건설기준등\"이라 한다)은 대통령령으로 정한다.\n1. 주택 및 시설의 배치, 주택과의 복합건축 등에 관한 주택건설기준\n2. 세대 간의 경계벽, 바닥충격음 차단구조, 구조내력(構造耐力) 등 주택의 구조ㆍ설비기준\n3. 부대시설의 설치기준\n4. 복리시설의 설치기준\n5. 대지조성기준\n6. 주택의 규모 및 규모별 건설비율\n② 지방자치단체는 그 지역의 특성, 주택의 규모 등을 고려하여 주택건설기준등의 범위에서 조례로 구체적인 기준을 정할 수 있다.\n③ 사업주체는 제1항의 주택건설기준등 및 제2항의 기준에 따라 주택건설사업 또는 대지조성사업을 시행하여야 한다."
  - no: '36'
    title: 도시형 생활주택의 건설기준
    text: "제36조(도시형 생활주택의 건설기준)\n① 사업주체(「건축법」 제2조제12호에 따른 건축주를 포함한다)가 도시형 생활주택을 건설하려는 경우에는 「국토의 계획 및 이용에 관한 법률」에 따른 도시지역에 대통령령으로 정하는 유형과 규모 등에 적합하게 건설하여야 한다.\n② 하나의 건축물에는 도시형 생활주택과 그 밖의 주택을 복합하여 건축할 수 없다. 다만, 대통령령으로 정하는 요건을 갖춘 경우에는 그러하지 아니하다."
  - no: '37'
    title: 에너지절약형 친환경주택 등의 건설기준
    text: "제37조(에너지절약형 친환경주택 등의 건설기준)\n① 사업주체가 제15조에 따른 사업계획승인을 받아 주택을 건설하려는 경우에는 에너지 고효율 설비기술 및 자재 적용 등 대통령령으로 정하는 바에 따라 에너지절약형 친환경주택으로 건설하여야 한다. 이 경우 사업주체는 제15조에 따른 서류에 에너지절약형 친환경주택 건설기준 적용 현황 등 대통령령으로 정하는 서류를 첨부하여야 한다.\n② 사업주체가 대통령령으로 정하는 호수 이상의 주택을 건설하려는 경우에는 친환경 건축자재 사용 등 대통령령으로 정하는 바에 따라 건강친화형 주택으로 건설하여야 한다."
  - no: '38'
    title: 장수명 주택의 건설기준 및 인증제도 등
    text: "제38조(장수명 주택의 건설기준 및 인증제도 등)\n① 국토교통부장관은 장수명 주택의 건설기준을 정하여 고시할 수 있다.\n② 국토교통부장관은 장수명 주택의 공급 활성화를 유도하기 위하여 제1항의 건설기준에 따라 장수명 주택 인증제도를 시행할 수 있다.\n③ 사업주체가 대통령령으로 정하는 호수 이상의 주택을 공급하고자 하는 때에는 제2항의 인증제도에 따라 대통령령으로 정하는 기준 이상의 등급을 인정받아야 한다.\n④ 국가, 지방자치단체 및 공공기관의 장은 장수명 주택을 공급하는 사업주체 및 장수명 주택 취득자에게 법률 등에서 정하는 바에 따라 행정상ㆍ세제상의 지원을 할 수 있다.\n⑤ 국토교통부장관은 제2항의 인증제도를 시행하기 위하여 인증기관을 지정하고 관련 업무를 위탁할 수 있다.\n⑥ 제2항의 인증제도의 운영과 관련하여 인증기준, 인증절차, 수수료 등은 국토교통부령으로 정한다.\n⑦ 제2항의 인증제도에 따라 국토교통부령으로 정하는 기준 이상의 등급을 인정받은 경우 「국토의 계획 및 이용에 관한 법률」에도 불구하고 대통령령으로 정하는 범위에서 건폐율ㆍ용적률ㆍ높이제한을 완화할 수 있다."
  - no: '39'
    title: 공동주택성능등급의 표시
    text: "제39조(공동주택성능등급의 표시) 사업주체가 대통령령으로 정하는 호수 이상의 공동주택을 공급할 때에는 주택의 성능 및 품질을 입주자가 알 수 있도록 「녹색건축물 조성 지원법」에 따라 다음 각 호의 공동주택성능에 대한 등급을 발급받아 국토교통부령으로 정하는 방법으로 입주자 모집공고에 표시하여야 한다.\n1. 경량충격음ㆍ중량충격음ㆍ화장실소음ㆍ경계소음 등 소음 관련 등급\n2. 리모델링 등에 대비한 가변성 및 수리 용이성 등 구조 관련 등급\n3. 조경ㆍ일조확보율ㆍ실내공기질ㆍ에너지절약 등 환경 관련 등급\n4. 커뮤니티시설, 사회적 약자 배려, 홈네트워크, 방범안전 등 생활환경 관련 등급\n5. 화재ㆍ소방ㆍ피난안전 등 화재ㆍ소방 관련 등급"
  - no: '40'
    title: 환기시설의 설치 등
    text: 제40조(환기시설의 설치 등) 사업주체는 공동주택의 실내 공기의 원활한 환기를 위하여 대통령령으로 정하는 기준에 따라 환기시설을 설치하여야 한다.
  - no: '41'
    title: 바닥충격음 성능등급 인정 등
    text: "제41조(바닥충격음 성능등급 인정 등)\n① 국토교통부장관은 제35조제1항제2호에 따른 주택건설기준 중 공동주택 바닥충격음 차단구조의 성능등급을 대통령령으로 정하는 기준에 따라 인정하는 기관(이하 \"바닥충격음 성능등급 인정기관\"이라 한다)을 지정할 수 있다.\n② 바닥충격음 성능등급 인정기관은 성능등급을 인정받은 제품(이하 \"인정제품\"이라 한다)이 다음 각 호의 어느 하나에 해당하면 그 인정을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 그 인정을 취소하여야 한다.\n1. 거짓이나 그 밖의 부정한 방법으로 인정받은 경우\n2. 인정받은 내용과 다르게 판매ㆍ시공한 경우\n3. 인정제품이 국토교통부령으로 정한 품질관리기준을 준수하지 아니한 경우\n4. 인정의 유효기간을 연장하기 위한 시험결과를 제출하지 아니한 경우\n③ 제1항에 따른 바닥충격음 차단구조의 성능등급 인정의 유효기간 및 성능등급 인정에 드는 수수료 등 바닥충격음 차단구조의 성능등급 인정에 필요한 사항은 대통령령으로 정한다.\n④ 바닥충격음 성능등급 인정기관의 지정 요건 및 절차 등은 대통령령으로 정한다.\n⑤ 국토교통부장관은 바닥충격음 성능등급 인정기관이 다음 각 호의 어느 하나에 해당하는 경우 그 지정을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 그 지정을 취소하여야 한다.\n1. 거짓이나 그 밖의 부정한 방법으로 바닥충격음 성능등급 인정기관으로 지정을 받은 경우\n2. 제1항에 따른 바닥충격음 차단구조의 성능등급의 인정기준을 위반하여 업무를 수행한 경우\n3. 제4항에 따른 바닥충격음 성능등급 인정기관의 지정 요건에 맞지 아니한 경우\n4. 정당한 사유 없이 2년 이상 계속하여 인정업무를 수행하지 아니한 경우\n⑥ 국토교통부장관은 바닥충격음 성능등급 인정기관에 대하여 성능등급의 인정현황 등 업무에 관한 자료를 제출하게 하거나 소속 공무원에게 관련 서류 등을 검사하게 할 수 있다.\n⑦ 제6항에 따라 검사를 하는 공무원은 그 권한을 나타내는 증표를 지니고 이를 관계인에게 내보여야 한다.\n⑧ 사업주체가 대통령령으로 정하는 두께 이상으로 바닥구조를 시공하는 경우 사업계획승인권자는 「국토의 계획 및 이용에 관한 법률」 제50조 및 제52조제1항제4호에 따라 지구단위계획으로 정한 건축물 높이의 최고한도의 100분의 115를 초과하지 아니하는 범위에서 조례로 정하는 기준에 따라 건축물 높이의 최고한도를 완화하여 적용할 수 있다. <신설 2024.1.16>"
  - no: 41의2
    title: 바닥충격음 성능검사 등
    text: "제41조의2(바닥충격음 성능검사 등)\n① 국토교통부장관은 바닥충격음 차단구조의 성능을 검사하기 위하여 성능검사의 기준(이하 이 조에서 \"성능검사기준\"이라 한다)을 마련하여야 한다.\n② 국토교통부장관은 제5항에 따른 성능검사를 전문적으로 수행하기 위하여 성능을 검사하는 기관(이하 \"바닥충격음 성능검사기관\"이라 한다)을 대통령령으로 정하는 지정 요건 및 절차에 따라 지정할 수 있다.\n③ 바닥충격음 성능검사기관의 지정 취소, 자료 제출 및 서류 검사 등에 관하여는 제41조제5항부터 제7항까지를 준용한다. 이 경우 \"바닥충격음 성능등급 인정기관\"은 \"바닥충격음 성능검사기관\"으로, \"인정업무\"는 \"바닥충격음 성능검사업무\"로 본다.\n④ 국토교통부장관은 바닥충격음 성능검사기관의 업무를 수행하는 데에 필요한 비용을 지원할 수 있다.\n⑤ 사업주체는 제15조에 따른 사업계획승인을 받아 시행하는 주택건설사업의 경우 제49조에 따른 사용검사를 받기 전에 바닥충격음 성능검사기관으로부터 성능검사기준에 따라 바닥충격음 차단구조의 성능을 검사(이하 이 조에서 \"성능검사\"라 한다)받아 그 결과를 사용검사권자에게 제출하여야 한다.\n⑥ 사용검사권자는 제5항에 따른 성능검사 결과가 성능검사기준에 미달하는 경우 대통령령으로 정하는 바에 따라 사업주체에게 보완 시공, 손해배상 등의 조치를 권고할 수 있다.\n⑦ 제6항에 따라 조치를 권고받은 사업주체는 대통령령으로 정하는 기간 내에 권고사항에 대한 조치결과를 사용검사권자에게 제출하여야 한다.\n⑧ 사업주체는 제5항에 따라 사용검사권자에게 제출한 성능검사 결과 및 제7항에 따라 사용검사권자에게 제출한 조치결과를 대통령령으로 정하는 방법에 따라 입주예정자에게 알려야 한다. <신설 2024.1.16>\n⑨ 국토교통부장관은 층간소음 저감 정책을 수립하기 위하여 필요하다고 판단하는 경우 사용검사권자에게 제5항에 따라 제출된 성능검사 결과 및 제7항에 따라 제출된 조치결과를 국토교통부장관에게 제출하도록 요청할 수 있다. 이 경우 자료 제출을 요청받은 사용검사권자는 정당한 사유가 없으면 이에 따라야 한다. <신설 2024.1.16>\n⑩ 바닥충격음 성능검사기관은 제5항에 따른 성능검사 결과를 토대로 대통령령으로 정하는 기준과 절차에 따라 매년 우수 시공자를 선정하여 공개할 수 있다. <신설 2024.1.16>\n⑪ 성능검사의 방법, 성능검사 결과의 제출, 성능검사에 드는 수수료 등 필요한 사항은 대통령령으로 정한다. <개정 2024.1.16>"
  - no: '42'
    title: 소음방지대책의 수립
    text: "제42조(소음방지대책의 수립)\n① 사업계획승인권자는 주택의 건설에 따른 소음의 피해를 방지하고 주택건설 지역 주민의 평온한 생활을 유지하기 위하여 주택건설사업을 시행하려는 사업주체에게 대통령령으로 정하는 바에 따라 소음방지대책을 수립하도록 하여야 한다.\n② 사업계획승인권자는 대통령령으로 정하는 주택건설 지역이 도로와 인접한 경우에는 해당 도로의 관리청과 소음방지대책을 미리 협의하여야 한다. 이 경우 해당 도로의 관리청은 소음 관계 법률에서 정하는 소음기준 범위에서 필요한 의견을 제시할 수 있다.\n③ 제1항에 따른 소음방지대책 수립에 필요한 실외소음도와 실외소음도를 측정하는 기준은 대통령령으로 정한다.\n④ 국토교통부장관은 제3항에 따른 실외소음도를 측정할 수 있는 측정기관(이하 \"실외소음도 측정기관\"이라 한다)을 지정할 수 있다.\n⑤ 국토교통부장관은 실외소음도 측정기관이 다음 각 호의 어느 하나에 해당하는 경우에는 그 지정을 취소할 수 있다. 다만, 제1호에 해당하는 경우 그 지정을 취소하여야 한다.\n1. 거짓이나 그 밖의 부정한 방법으로 실외소음도 측정기관으로 지정을 받은 경우\n2. 제3항에 따른 실외소음도 측정기준을 위반하여 업무를 수행한 경우\n3. 제6항에 따른 실외소음도 측정기관의 지정 요건에 미달하게 된 경우\n⑥ 실외소음도 측정기관의 지정 요건, 측정에 소요되는 수수료 등 실외소음도 측정에 필요한 사항은 대통령령으로 정한다."
  - no: '43'
    title: 주택의 감리자 지정 등
    text: "제43조(주택의 감리자 지정 등)\n① 사업계획승인권자가 제15조제1항 또는 제3항에 따른 주택건설사업계획을 승인하였을 때와 시장ㆍ군수ㆍ구청장이 제66조제1항 또는 제2항에 따른 리모델링의 허가를 하였을 때에는 「건축사법」 또는 「건설기술 진흥법」에 따른 감리자격이 있는 자를 대통령령으로 정하는 바에 따라 해당 주택건설공사의 감리자로 지정하여야 한다. 다만, 사업주체가 국가ㆍ지방자치단체ㆍ한국토지주택공사ㆍ지방공사 또는 대통령령으로 정하는 자인 경우와 「건축법」 제25조에 따라 공사감리를 하는 도시형 생활주택의 경우에는 그러하지 아니하다. <개정 2018.3.13>\n② 다음 각 호의 단체 및 협회는 제1항에 따른 감리자를 지정하기 위하여 공동으로 주택건설공사 감리비 지급기준을 정하여 국토교통부장관의 승인을 받아야 한다. 승인받은 사항을 변경하려는 경우에도 또한 같다. <신설 2024.1.16>\n1. 제85조에 따른 주택사업자단체\n2. 「건설기술 진흥법」 제69조에 따른 건설엔지니어링사업자단체\n3. 「건축사법」 제31조에 따른 대한건축사협회\n③ 사업계획승인권자는 감리자가 감리자의 지정에 관한 서류를 부정 또는 거짓으로 제출하거나, 업무 수행 중 위반 사항이 있음을 알고도 묵인하는 등 대통령령으로 정하는 사유에 해당하는 경우에는 감리자를 교체하고, 그 감리자에 대하여는 1년의 범위에서 감리업무의 지정을 제한할 수 있다. <개정 2024.1.16>\n④ 사업주체(제66조제1항 또는 제2항에 따른 리모델링의 허가만 받은 자도 포함한다. 이하 이 조, 제44조 및 제47조에서 같다)와 감리자 간의 책임 내용 및 범위는 이 법에서 규정한 것 외에는 당사자 간의 계약으로 정한다. <개정 2018.3.13, 2024.1.16>\n⑤ 국토교통부장관은 제4항에 따른 계약을 체결할 때 사업주체와 감리자 간에 공정하게 계약이 체결되도록 하기 위하여 감리용역표준계약서를 정하여 보급할 수 있다. <개정 2024.1.16>"
  - no: '44'
    title: 감리자의 업무 등
    text: "제44조(감리자의 업무 등)\n① 감리자는 자기에게 소속된 자를 대통령령으로 정하는 바에 따라 감리원으로 배치하고, 다음 각 호의 업무를 수행하여야 한다. <개정 2024.1.16>\n1. 시공자가 설계도서에 맞게 시공하는지 여부의 확인\n2. 시공자가 사용하는 건축자재가 관계 법령에 따른 기준에 맞는 건축자재인지 여부의 확인\n3. 주택건설공사에 대하여 「건설기술 진흥법」 제55조에 따른 품질시험을 하였는지 여부의 확인\n4. 시공자가 사용하는 마감자재 및 제품이 제54조제3항에 따라 사업주체가 시장ㆍ군수ㆍ구청장에게 제출한 마감자재 목록표 및 영상물 등과 동일한지 여부의 확인\n4의2. 주택건설공사의 하수급인(「건설산업기본법」 제2조제14호에 따른 하수급인을 말한다)이 「건설산업기본법」 제16조에 따른 시공자격을 갖추었는지 여부의 확인\n5. 그 밖에 주택건설공사의 감리에 관한 사항으로서 대통령령으로 정하는 사항\n② 감리자는 제1항 각 호에 따른 업무의 수행 상황을 국토교통부령으로 정하는 바에 따라 사업계획승인권자(제66조제1항 또는 제2항에 따른 리모델링의 허가만 받은 경우는 허가권자를 말한다. 이하 이 조, 제45조, 제47조 및 제48조에서 같다) 및 사업주체에게 보고하여야 한다. <개정 2018.3.13>\n③ 감리자는 제1항 각 호의 업무를 수행하면서 위반 사항을 발견하였을 때에는 지체 없이 시공자 및 사업주체에게 위반 사항을 시정할 것을 통지하고, 7일 이내에 사업계획승인권자에게 그 내용을 보고하여야 한다.\n④ 시공자 및 사업주체는 제3항에 따른 시정 통지를 받은 경우에는 즉시 해당 공사를 중지하고 위반 사항을 시정한 후 감리자의 확인을 받아야 한다. 이 경우 감리자의 시정 통지에 이의가 있을 때에는 즉시 그 공사를 중지하고 사업계획승인권자에게 서면으로 이의신청을 할 수 있다.\n⑤ 제43조제1항에 따른 감리자의 지정 방법ㆍ절차, 제1항제4호의2에 따른 시공자격 여부의 확인 및 제4항에 따른 이의신청의 처리 등에 필요한 사항은 대통령령으로 정한다. <개정 2024.1.16>\n⑥ 사업주체는 제43조제4항의 계약에 따른 공사감리비를 국토교통부령으로 정하는 바에 따라 사업계획승인권자에게 예치하여야 한다. <신설 2018.3.13, 2024.1.16>\n⑦ 사업계획승인권자는 제6항에 따라 예치받은 공사감리비를 감리자에게 국토교통부령으로 정하는 절차 등에 따라 지급하여야 한다. 다만, 감리자가 감리업무를 소홀히 하여 사업계획승인권자로부터 제48조제2항에 따라 시정명령을 받은 경우 사업계획승인권자는 감리자가 시정명령을 이행완료할 때까지 감리비 지급을 유예할 수 있다. <개정 2018.3.13, 2024.1.16>"
  - no: '45'
    title: 감리자의 업무 협조
    text: "제45조(감리자의 업무 협조)\n① 감리자는 「전력기술관리법」 제14조의2, 「정보통신공사업법」 제8조, 「소방시설공사업법」 제17조에 따라 감리업무를 수행하는 자(이하 \"다른 법률에 따른 감리자\"라 한다)와 서로 협력하여 감리업무를 수행하여야 한다.\n② 다른 법률에 따른 감리자는 공정별 감리계획서 등 대통령령으로 정하는 자료를 감리자에게 제출하여야 하며, 감리자는 제출된 자료를 근거로 다른 법률에 따른 감리자와 협의하여 전체 주택건설공사에 대한 감리계획서를 작성하여 감리업무를 착수하기 전에 사업계획승인권자에게 보고하여야 한다.\n③ 감리자는 주택건설공사의 품질ㆍ안전 관리 및 원활한 공사 진행을 위하여 다른 법률에 따른 감리자에게 공정 보고 및 시정을 요구할 수 있으며, 다른 법률에 따른 감리자는 요청에 따라야 한다."
  - no: '46'
    title: 건축구조기술사와의 협력
    text: "제46조(건축구조기술사와의 협력)\n① 수직증축형 리모델링(세대수가 증가되지 아니하는 리모델링을 포함한다. 이하 같다)의 감리자는 감리업무 수행 중에 다음 각 호의 어느 하나에 해당하는 사항이 확인된 경우에는 「국가기술자격법」에 따른 건축구조기술사(이하 \"건축구조기술사\"라 한다)로서 해당 건축물의 리모델링 구조설계를 담당한 건축구조기술사의 협력을 받아야 한다. 다만, 구조설계를 담당한 건축구조기술사가 사망하는 등 대통령령으로 정하는 사유로 감리자가 협력을 받을 수 없는 경우에는 대통령령으로 정하는 건축구조기술사의 협력을 받아야 한다. <개정 2026.2.3>\n1. 수직증축형 리모델링 허가 시 제출한 구조도 또는 구조계산서와 다르게 시공하고자 하는 경우\n2. 내력벽(耐力壁), 기둥, 바닥, 보 등 건축물의 주요 구조부에 대하여 수직증축형 리모델링 허가 시 제출한 도면보다 상세한 도면 작성이 필요한 경우\n3. 내력벽, 기둥, 바닥, 보 등 건축물의 주요 구조부의 철거 또는 보강 공사를 하는 경우로서 국토교통부령으로 정하는 경우\n4. 그 밖에 건축물의 구조에 영향을 미치는 사항으로서 국토교통부령으로 정하는 경우\n② 감리자는 감리업무 수행 중에 「재난 및 안전관리 기본법」 제3조제1호가목에 따른 자연재난이 발생하여 건축물의 주요 구조부의 균열 등 건축물의 구조에 영향을 미치는 사항으로서 국토교통부령으로 정하는 사항이 확인된 경우에는 대통령령으로 정하는 건축구조기술사의 협력을 받아야 한다. <신설 2026.2.3>\n③ 제1항 또는 제2항에 따라 감리자에게 협력한 건축구조기술사는 분기별 감리보고서 및 최종 감리보고서에 감리자와 함께 서명날인하여야 한다. <개정 2026.2.3>\n④ 제1항 또는 제2항에 따라 협력을 요청받은 건축구조기술사는 독립되고 공정한 입장에서 성실하게 업무를 수행하여야 한다. <개정 2026.2.3>\n⑤ 수직증축형 리모델링을 하려는 자 또는 사업주체는 제1항 또는 제2항에 따라 감리자에게 협력한 건축구조기술사에게 적정한 대가를 지급하여야 한다. <개정 2026.2.3>"
  - no: '47'
    title: 부실감리자 등에 대한 조치
    text: 제47조(부실감리자 등에 대한 조치) 사업계획승인권자는 제43조 및 제44조에 따라 지정ㆍ배치된 감리자 또는 감리원(다른 법률에 따른 감리자 또는 그에게 소속된 감리원을 포함한다)이 그 업무를 수행할 때 고의 또는 중대한 과실로 감리를 부실하게 하거나 관계 법령을 위반하여 감리를 함으로써 해당 사업주체 또는 입주자 등에게 피해를 입히는 등 주택건설공사가 부실하게 된 경우에는 그 감리자의 등록 또는 감리원의 면허나 그 밖의 자격인정 등을 한 행정기관의 장에게 등록말소ㆍ면허취소ㆍ자격정지ㆍ영업정지나 그 밖에 필요한 조치를 하도록 요청할 수 있다.
  - no: '48'
    title: 감리자에 대한 실태점검 등
    text: "제48조(감리자에 대한 실태점검 등)\n① 사업계획승인권자는 주택건설공사의 부실방지, 품질 및 안전 확보를 위하여 해당 주택건설공사의 감리자를 대상으로 각종 시험 및 자재확인 업무에 대한 이행 실태 등 대통령령으로 정하는 사항에 대하여 실태점검(이하 \"실태점검\"이라 한다)을 실시할 수 있다.\n② 사업계획승인권자는 실태점검 결과 제44조제1항에 따른 감리업무의 소홀이 확인된 경우에는 시정명령을 하거나, 제43조제3항에 따라 감리자 교체를 하여야 한다. <개정 2024.1.16>\n③ 사업계획승인권자는 실태점검에 따른 감리자에 대한 시정명령 또는 교체지시 사실을 국토교통부령으로 정하는 바에 따라 국토교통부장관에게 보고하여야 하며, 국토교통부장관은 해당 내용을 종합관리하여 제43조제1항에 따른 감리자 지정에 관한 기준에 반영할 수 있다."
  - no: 48의2
    title: 사전방문 등
    text: "제48조의2(사전방문 등)\n① 사업주체는 제49조제1항에 따른 사용검사를 받기 전에 입주예정자가 해당 주택을 방문하여 공사 상태를 미리 점검(이하 \"사전방문\"이라 한다)할 수 있게 하여야 한다.\n② 입주예정자는 사전방문 결과 하자[공사상 잘못으로 인하여 균열ㆍ침하(沈下)ㆍ파손ㆍ들뜸ㆍ누수 등이 발생하여 안전상ㆍ기능상 또는 미관상의 지장을 초래할 정도의 결함을 말한다. 이하 같다]가 있다고 판단하는 경우 사업주체에게 보수공사 등 적절한 조치를 해줄 것을 요청할 수 있다.\n③ 제2항에 따라 하자(제4항에 따라 사용검사권자가 하자가 아니라고 확인한 사항은 제외한다)에 대한 조치 요청을 받은 사업주체는 대통령령으로 정하는 바에 따라 보수공사 등 적절한 조치를 하여야 한다. 이 경우 입주예정자가 조치를 요청한 하자 중 대통령령으로 정하는 중대한 하자는 대통령령으로 정하는 특별한 사유가 없으면 사용검사를 받기 전까지 조치를 완료하여야 한다.\n④ 제3항에도 불구하고 입주예정자가 요청한 사항이 하자가 아니라고 판단하는 사업주체는 대통령령으로 정하는 바에 따라 제49조제1항에 따른 사용검사를 하는 시장ㆍ군수ㆍ구청장(이하 \"사용검사권자\"라 한다)에게 하자 여부를 확인해줄 것을 요청할 수 있다. 이 경우 사용검사권자는 제48조의3에 따른 공동주택 품질점검단의 자문을 받는 등 대통령령으로 정하는 바에 따라 하자 여부를 확인할 수 있다.\n⑤ 사업주체는 제3항에 따라 조치한 내용 및 제4항에 따라 하자가 아니라고 확인받은 사실 등을 대통령령으로 정하는 바에 따라 입주예정자 및 사용검사권자에게 알려야 한다.\n⑥ 국토교통부장관은 사전방문에 필요한 표준양식을 정하여 보급하고 활용하게 할 수 있다.\n⑦ 제2항에 따라 보수공사 등 적절한 조치가 필요한 하자의 구체적인 기준 등에 관한 사항은 대통령령으로 정하고, 제1항부터 제6항까지에서 규정한 사항 외에 사전방문의 절차 및 방법 등에 관한 사항은 국토교통부령으로 정한다."
  - no: 48의3
    title: 품질점검단의 설치 및 운영 등
    text: "제48조의3(품질점검단의 설치 및 운영 등)\n① 시ㆍ도지사는 제48조의2에 따른 사전방문을 실시하고 제49조제1항에 따른 사용검사를 신청하기 전에 공동주택의 품질을 점검하여 사업계획의 내용에 적합한 공동주택이 건설되도록 할 목적으로 주택 관련 분야 등의 전문가로 구성된 공동주택 품질점검단(이하 \"품질점검단\"이라 한다)을 설치ㆍ운영할 수 있다. 이 경우 시ㆍ도지사는 품질점검단의 설치ㆍ운영에 관한 사항을 조례로 정하는 바에 따라 대도시 시장에게 위임할 수 있다.\n② 품질점검단은 대통령령으로 정하는 규모 및 범위 등에 해당하는 공동주택의 건축ㆍ구조ㆍ안전ㆍ품질관리 등에 대한 시공품질을 대통령령으로 정하는 바에 따라 점검하여 그 결과를 시ㆍ도지사(제1항 후단의 경우에는 대도시 시장을 말한다)와 사용검사권자에게 제출하여야 한다.\n③ 사업주체는 제2항에 따른 품질점검단의 점검에 협조하여야 하며 이에 따르지 아니하거나 기피 또는 방해해서는 아니 된다.\n④ 사용검사권자는 품질점검단의 시공품질 점검을 위하여 필요한 경우에는 사업주체, 감리자 등 관계자에게 공동주택의 공사현황 등 국토교통부령으로 정하는 서류 및 관련 자료의 제출을 요청할 수 있다. 이 경우 자료제출을 요청받은 자는 정당한 사유가 없으면 이에 따라야 한다.\n⑤ 사용검사권자는 제2항에 따라 제출받은 점검결과를 제49조제1항에 따른 사용검사가 있은 날부터 2년 이상 보관하여야 하며, 입주자(입주예정자를 포함한다)가 관련 자료의 공개를 요구하는 경우에는 이를 공개하여야 한다.\n⑥ 사용검사권자는 대통령령으로 정하는 바에 따라 제2항에 따른 품질점검단의 점검결과에 대한 사업주체의 의견을 청취한 후 하자가 있다고 판단하는 경우 보수ㆍ보강 등 필요한 조치를 명하여야 한다. 이 경우 대통령령으로 정하는 중대한 하자는 대통령령으로 정하는 특별한 사유가 없으면 사용검사를 받기 전까지 조치하도록 명하여야 한다.\n⑦ 제6항에 따라 보수ㆍ보강 등의 조치명령을 받은 사업주체는 대통령령으로 정하는 바에 따라 조치를 하고, 그 결과를 사용검사권자에게 보고하여야 한다. 다만, 조치명령에 이의가 있는 사업주체는 사용검사권자에게 이의신청을 할 수 있다.\n⑧ 사용검사권자는 공동주택의 시공품질 관리를 위하여 제48조의2에 따라 사업주체에게 통보받은 사전방문 후 조치결과, 제6항 및 제7항에 따른 조치명령, 조치결과, 이의신청 등에 관한 사항을 대통령령으로 정하는 정보시스템에 등록하여야 한다.\n⑨ 제1항부터 제8항까지에서 규정한 사항 외에 품질점검단의 구성 및 운영, 이의신청 절차 및 이의신청에 따른 조치 등에 필요한 사항은 대통령령으로 정한다."
  - no: '49'
    title: 사용검사 등
    text: "제49조(사용검사 등)\n① 사업주체는 제15조에 따른 사업계획승인을 받아 시행하는 주택건설사업 또는 대지조성사업을 완료한 경우에는 주택 또는 대지에 대하여 국토교통부령으로 정하는 바에 따라 시장ㆍ군수ㆍ구청장(국가 또는 한국토지주택공사가 사업주체인 경우와 대통령령으로 정하는 경우에는 국토교통부장관을 말한다. 이하 이 조에서 같다)의 사용검사를 받아야 한다. 다만, 제15조제3항에 따라 사업계획을 승인받은 경우에는 완공된 주택에 대하여 공구별로 사용검사(이하 \"분할 사용검사\"라 한다)를 받을 수 있고, 사업계획승인 조건의 미이행 등 대통령령으로 정하는 사유가 있는 경우에는 공사가 완료된 주택에 대하여 동별로 사용검사(이하 \"동별 사용검사\"라 한다)를 받을 수 있다.\n② 사업주체가 제1항에 따른 사용검사를 받았을 때에는 제19조제1항에 따라 의제되는 인ㆍ허가등에 따른 해당 사업의 사용승인ㆍ준공검사 또는 준공인가 등을 받은 것으로 본다. 이 경우 사용검사권자는 미리 관계 행정기관의 장과 협의하여야 한다. <개정 2020.1.23>\n③ 제1항에도 불구하고 다음 각 호의 구분에 따라 해당 주택의 시공을 보증한 자, 해당 주택의 시공자 또는 입주예정자는 대통령령으로 정하는 바에 따라 사용검사를 받을 수 있다.\n1. 사업주체가 파산 등으로 사용검사를 받을 수 없는 경우에는 해당 주택의 시공을 보증한 자 또는 입주예정자\n2. 사업주체가 정당한 이유 없이 사용검사를 위한 절차를 이행하지 아니하는 경우에는 해당 주택의 시공을 보증한 자, 해당 주택의 시공자 또는 입주예정자. 이 경우 사용검사권자는 사업주체가 사용검사를 받지 아니하는 정당한 이유를 밝히지 못하면 사용검사를 거부하거나 지연할 수 없다.\n④ 사업주체 또는 입주예정자는 제1항에 따른 사용검사를 받은 후가 아니면 주택 또는 대지를 사용하게 하거나 이를 사용할 수 없다. 다만, 대통령령으로 정하는 경우로서 사용검사권자의 임시 사용승인을 받은 경우에는 그러하지 아니하다.\n⑤ 제46조제2항에 따라 감리를 받은 주택의 사업주체는 해당 주택의 입주예정자의 과반수가 주택의 구조안전성 등을 확인하기 위하여 제1항에 따른 사용검사를 받기 전에 현장점검을 요청하는 경우에는 이에 따라야 한다. 이 경우 현장점검의 절차 및 방법 등에 필요한 사항은 대통령령으로 정한다. <신설 2026.2.3>"
  - no: '50'
    title: 사용검사 등의 특례에 따른 하자보수보증금 면제
    text: "제50조(사용검사 등의 특례에 따른 하자보수보증금 면제)\n① 제49조제3항에 따라 사업주체의 파산 등으로 입주예정자가 사용검사를 받을 때에는 「공동주택관리법」 제38조제1항에도 불구하고 입주예정자의 대표회의가 사용검사권자에게 사용검사를 신청할 때 하자보수보증금을 예치하여야 한다.\n② 제1항에 따라 입주예정자의 대표회의가 하자보수보증금을 예치할 경우 제49조제4항에도 불구하고 2015년 12월 31일 당시 제15조에 따른 사업계획승인을 받아 사실상 완공된 주택에 사업주체의 파산 등으로 제49조제1항 또는 제3항에 따른 사용검사를 받지 아니하고 무단으로 점유하여 거주(이하 이 조에서 \"무단거주\"라 한다)하는 입주예정자가 2016년 12월 31일까지 사용검사권자에게 사용검사를 신청할 때에는 다음 각 호의 구분에 따라 「공동주택관리법」 제38조제1항에 따른 하자보수보증금을 면제하여야 한다. <개정 2020.6.9>\n1. 무단거주한 날부터 1년이 지난 때: 10퍼센트\n2. 무단거주한 날부터 2년이 지난 때: 35퍼센트\n3. 무단거주한 날부터 3년이 지난 때: 55퍼센트\n4. 무단거주한 날부터 4년이 지난 때: 70퍼센트\n5. 무단거주한 날부터 5년이 지난 때: 85퍼센트\n6. 무단거주한 날부터 10년이 지난 때: 100퍼센트\n③ 제2항 각 호의 무단거주한 날은 주택에 최초로 입주예정자가 입주한 날을 기산일로 한다. 이 경우 입주예정자가 입주한 날은 주민등록 신고일이나 전기, 수도요금 영수증 등으로 확인한다.\n④ 제1항에 따라 무단거주하는 입주예정자가 사용검사를 받았을 때에는 제49조제2항을 준용한다. 이 경우 \"사업주체\"를 \"무단거주하는 입주예정자\"로 본다.\n⑤ 제1항에 따라 입주예정자의 대표회의가 하자보수보증금을 예치한 경우 「공동주택관리법」 제36조제3항에 따른 담보책임기간은 제2항에 따라 면제받은 기간만큼 줄어드는 것으로 본다. <개정 2017.4.18>"
  - no: '51'
    title: 공업화주택의 인정 등
    text: "제51조(공업화주택의 인정 등)\n① 국토교통부장관은 다음 각 호의 어느 하나에 해당하는 부분을 국토교통부령으로 정하는 성능기준 및 생산기준에 따라 맞춤식 등 공업화공법으로 건설하는 주택을 공업화주택(이하 \"공업화주택\"이라 한다)으로 인정할 수 있다.\n1. 주요 구조부의 전부 또는 일부\n2. 세대별 주거 공간의 전부 또는 일부[거실(「건축법」 제2조제6호에 따른다)ㆍ화장실ㆍ욕조 등 일부로서의 기능이 가능한 단위 공간을 말한다]\n② 국토교통부장관, 시ㆍ도지사 또는 시장ㆍ군수는 다음 각 호의 구분에 따라 주택을 건설하려는 자에 대하여 「건설산업기본법」 제9조제1항에도 불구하고 대통령령으로 정하는 바에 따라 해당 주택을 건설하게 할 수 있다.\n1. 국토교통부장관: 「건설기술 진흥법」 제14조에 따라 국토교통부장관이 고시한 새로운 건설기술을 적용하여 건설하는 공업화주택\n2. 시ㆍ도지사 또는 시장ㆍ군수: 공업화주택\n③ 공업화주택의 인정에 필요한 사항은 대통령령으로 정한다."
  - no: '52'
    title: 공업화주택의 인정취소
    text: "제52조(공업화주택의 인정취소) 국토교통부장관은 제51조제1항에 따라 공업화주택을 인정받은 자가 다음 각 호의 어느 하나에 해당하는 경우에는 공업화주택의 인정을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 그 인정을 취소하여야 한다.\n1. 거짓이나 그 밖의 부정한 방법으로 인정을 받은 경우\n2. 인정을 받은 기준보다 낮은 성능으로 공업화주택을 건설한 경우"
  - no: '53'
    title: 공업화주택의 건설 촉진
    text: "제53조(공업화주택의 건설 촉진)\n① 국토교통부장관, 시ㆍ도지사 또는 시장ㆍ군수는 사업주체가 건설할 주택을 공업화주택으로 건설하도록 사업주체에게 권고할 수 있다.\n② 공업화주택의 건설 및 품질 향상과 관련하여 국토교통부령으로 정하는 기술능력을 갖추고 있는 자가 공업화주택을 건설하는 경우에는 제33조ㆍ제43조ㆍ제44조 및 「건축사법」 제4조를 적용하지 아니한다."
  - no: '54'
    title: 주택의 공급
    text: "제54조(주택의 공급)\n① 사업주체(「건축법」 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 하여 제15조제1항에 따른 호수 이상으로 건설ㆍ공급하는 건축주와 제49조에 따라 사용검사를 받은 주택을 사업주체로부터 일괄하여 양수받은 자를 포함한다. 이하 이 장에서 같다)는 다음 각 호에서 정하는 바에 따라 주택을 건설ㆍ공급하여야 한다. 이 경우 국가유공자, 보훈보상대상자, 장애인, 철거주택의 소유자, 그 밖에 국토교통부령으로 정하는 대상자에게는 국토교통부령으로 정하는 바에 따라 입주자 모집조건 등을 달리 정하여 별도로 공급할 수 있다. <개정 2018.3.13>\n1. 사업주체(공공주택사업자는 제외한다)가 입주자를 모집하려는 경우: 국토교통부령으로 정하는 바에 따라 시장ㆍ군수ㆍ구청장의 승인(복리시설의 경우에는 신고를 말한다)을 받을 것\n2. 사업주체가 건설하는 주택을 공급하려는 경우\n② 주택을 공급받으려는 자는 국토교통부령으로 정하는 입주자자격, 재당첨 제한 및 공급 순위 등에 맞게 주택을 공급받아야 한다. 이 경우 제63조제1항에 따른 투기과열지구 및 제63조의2제1항에 따른 조정대상지역에서 건설ㆍ공급되는 주택을 공급받으려는 자의 입주자자격, 재당첨 제한 및 공급 순위 등은 주택의 수급 상황 및 투기 우려 등을 고려하여 국토교통부령으로 지역별로 달리 정할 수 있다. <개정 2017.8.9>\n③ 사업주체가 제1항제1호에 따라 시장ㆍ군수ㆍ구청장의 승인을 받으려는 경우(사업주체가 국가ㆍ지방자치단체ㆍ한국토지주택공사 및 지방공사인 경우에는 견본주택을 건설하는 경우를 말한다)에는 제60조에 따라 건설하는 견본주택에 사용되는 마감자재의 규격ㆍ성능 및 재질을 적은 목록표(이하 \"마감자재 목록표\"라 한다)와 견본주택의 각 실의 내부를 촬영한 영상물 등을 제작하여 승인권자에게 제출하여야 한다.\n④ 사업주체는 주택공급계약을 체결할 때 입주예정자에게 다음 각 호의 자료 또는 정보를 제공하여야 한다. 다만, 입주자 모집공고에 이를 표시(인터넷에 게재하는 경우를 포함한다)한 경우에는 그러하지 아니하다.\n1. 제3항에 따른 견본주택에 사용된 마감자재 목록표\n2. 공동주택 발코니의 세대 간 경계벽에 피난구를 설치하거나 경계벽을 경량구조로 건설한 경우 그에 관한 정보\n⑤ 시장ㆍ군수ㆍ구청장은 제3항에 따라 받은 마감자재 목록표와 영상물 등을 제49조제1항에 따른 사용검사가 있은 날부터 2년 이상 보관하여야 하며, 입주자가 열람을 요구하는 경우에는 이를 공개하여야 한다.\n⑥ 사업주체가 마감자재 생산업체의 부도 등으로 인한 제품의 품귀 등 부득이한 사유로 인하여 제15조에 따른 사업계획승인 또는 마감자재 목록표의 마감자재와 다르게 마감자재를 시공ㆍ설치하려는 경우에는 당초의 마감자재와 같은 질 이상으로 설치하여야 한다.\n⑦ 사업주체가 제6항에 따라 마감자재 목록표의 자재와 다른 마감자재를 시공ㆍ설치하려는 경우에는 그 사실을 입주예정자에게 알려야 한다.\n⑧ 사업주체는 공급하려는 주택에 대하여 대통령령으로 정하는 내용이 포함된 표시 및 광고(「표시ㆍ광고의 공정화에 관한 법률」 제2조에 따른 표시 또는 광고를 말한다. 이하 같다)를 한 경우 대통령령으로 정하는 바에 따라 해당 표시 또는 광고의 사본을 시장ㆍ군수ㆍ구청장에게 제출하여야 한다. 이 경우 시장ㆍ군수ㆍ구청장은 제출받은 표시 또는 광고의 사본을 제49조제1항에 따른 사용검사가 있은 날부터 2년 이상 보관하여야 하며, 입주자가 열람을 요구하는 경우 이를 공개하여야 한다. <신설 2019.12.10>"
  - no: 54의2
    title: 주택의 공급업무의 대행 등
    text: "제54조의2(주택의 공급업무의 대행 등)\n① 사업주체는 주택을 효율적으로 공급하기 위하여 필요하다고 인정하는 경우 주택의 공급업무의 일부를 제3자로 하여금 대행하게 할 수 있다.\n② 제1항에도 불구하고 사업주체가 입주자자격, 공급 순위 등을 증명하는 서류의 확인 등 국토교통부령으로 정하는 업무를 대행하게 하는 경우 국토교통부령으로 정하는 바에 따라 다음 각 호의 어느 하나에 해당하는 자(이하 이 조에서 \"분양대행자\"라 한다)에게 대행하게 하여야 한다.\n1. 등록사업자\n2. 「건설산업기본법」 제9조에 따른 건설업자로서 대통령령으로 정하는 자\n3. 「도시 및 주거환경정비법」 제102조에 따른 정비사업전문관리업자\n4. 「부동산개발업의 관리 및 육성에 관한 법률」 제4조에 따른 등록사업자\n5. 다른 법률에 따라 등록하거나 인가 또는 허가를 받은 자로서 국토교통부령으로 정하는 자\n③ 사업주체가 제2항에 따라 업무를 대행하게 하는 경우 분양대행자에 대한 교육을 실시하는 등 국토교통부령으로 정하는 관리ㆍ감독 조치를 시행하여야 한다."
  - no: '55'
    title: 자료제공의 요청
    text: "제55조(자료제공의 요청)\n① 국토교통부장관은 제54조제2항에 따라 주택을 공급받으려는 자의 입주자자격, 주택의 소유 여부, 재당첨 제한 여부, 공급 순위 등을 확인하거나 제56조의3에 따라 요청받은 정보를 제공하기 위하여 필요하다고 인정하는 경우에는 주민등록 전산정보(주민등록번호ㆍ외국인등록번호 등 고유식별번호를 포함한다), 가족관계 등록사항, 국세, 지방세, 금융, 토지, 건물(건물등기부ㆍ건축물대장을 포함한다), 자동차, 건강보험, 국민연금, 고용보험 및 산업재해보상보험 등의 자료 또는 정보의 제공을 관계 기관의 장에게 요청할 수 있다. 이 경우 관계 기관의 장은 특별한 사유가 없으면 이에 따라야 한다. <개정 2020.1.23>\n② 국토교통부장관은 「금융실명거래 및 비밀보장에 관한 법률」 제4조제1항과 「신용정보의 이용 및 보호에 관한 법률」 제32조제2항에도 불구하고 제54조제2항에 따라 주택을 공급받으려는 자의 입주자자격, 공급 순위 등을 확인하기 위하여 본인, 배우자, 본인 또는 배우자와 세대를 같이하는 세대원이 제출한 동의서면을 전자적 형태로 바꾼 문서에 의하여 금융기관 등(「금융실명거래 및 비밀보장에 관한 법률」 제2조제1호에 따른 금융회사등 및 「신용정보의 이용 및 보호에 관한 법률」 제25조에 따른 신용정보집중기관을 말한다. 이하 같다)의 장에게 다음 각 호의 자료 또는 정보의 제공을 요청할 수 있다. <개정 2020.1.23>\n1. 「금융실명거래 및 비밀보장에 관한 법률」 제2조제2호ㆍ제3호에 따른 금융자산 및 금융거래의 내용에 대한 자료 또는 정보 중 예금의 평균잔액과 그 밖에 국토교통부장관이 정하는 자료 또는 정보(이하 \"금융정보\"라 한다)\n2. 「신용정보의 이용 및 보호에 관한 법률」 제2조제1호에 따른 신용정보 중 채무액과 그 밖에 국토교통부장관이 정하는 자료 또는 정보(이하 \"신용정보\"라 한다)\n3. 「보험업법」 제4조제1항 각 호에 따른 보험에 가입하여 납부한 보험료와 그 밖에 국토교통부장관이 정하는 자료 또는 정보(이하 \"보험정보\"라 한다)\n③ 국토교통부장관이 제2항에 따라 금융정보ㆍ신용정보 또는 보험정보(이하 \"금융정보등\"이라 한다)의 제공을 요청하는 경우 해당 금융정보등 명의인의 정보제공에 대한 동의서면을 함께 제출하여야 한다. 이 경우 동의서면은 전자적 형태로 바꾸어 제출할 수 있으며, 금융정보등을 제공한 금융기관 등의 장은 「금융실명거래 및 비밀보장에 관한 법률」 제4조의2제1항과 「신용정보의 이용 및 보호에 관한 법률」 제35조에도 불구하고 금융정보등의 제공사실을 명의인에게 통보하지 아니할 수 있다.\n④ 국토교통부장관 및 사업주체(국가, 지방자치단체, 한국토지주택공사 및 지방공사로 한정한다)는 제1항 및 제2항에 따른 자료를 확인하기 위하여 「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 연계하여 사용할 수 있다.\n⑤ 국토교통부 소속 공무원 또는 소속 공무원이었던 사람과 제4항에 따른 사업주체의 소속 임직원은 제1항과 제2항에 따라 얻은 정보와 자료를 이 법에서 정한 목적 외의 다른 용도로 사용하거나 다른 사람 또는 기관에 제공하거나 누설하여서는 아니 된다."
  - no: '56'
    title: 입주자저축
    text: "제56조(입주자저축)\n① 국토교통부장관은 주택을 공급받으려는 자에게 미리 입주금의 전부 또는 일부를 저축(이하 \"입주자저축\"이라 한다)하게 할 수 있다. <개정 2020.1.23>\n② 제1항에서 \"입주자저축\"이란 국민주택과 민영주택을 공급받기 위하여 가입하는 주택청약종합저축을 말한다.\n③ 입주자저축계좌를 취급하는 기관(이하 \"입주자저축취급기관\"이라 한다)은 「은행법」에 따른 은행 중 국토교통부장관이 지정한다. <신설 2020.1.23>\n④ 입주자저축은 한 사람이 한 계좌만 가입할 수 있다. <신설 2020.1.23>\n⑤ 국토교통부장관은 다음 각 호의 업무를 수행하기 위하여 필요한 경우 「금융실명거래 및 비밀보장에 관한 법률」 제4조제1항에도 불구하고 입주자저축취급기관의 장에게 입주자저축에 관한 자료 및 정보(이하 \"입주자저축정보\"라 한다)를 제공하도록 요청할 수 있다. <신설 2020.1.23>\n1. 주택을 공급받으려는 자의 입주자자격, 재당첨 제한 여부 및 공급 순위 등 확인 및 정보제공 업무\n2. 입주자저축 가입을 희망하는 자의 기존 입주자저축 가입 여부 확인 업무\n3. 「조세특례제한법」 제89조의2에 따라 세금우대저축 취급기관과 세금우대저축자료 집중기관 상호 간 입주자저축과 관련된 세금우대저축자료를 제공하도록 중계하는 업무\n4. 제1호부터 제3호까지의 규정에 따라 이미 보유하고 있는 정보의 정확성, 최신성을 유지하기 위한 정보요청 업무\n⑥ 제5항에 따라 입주자저축정보의 제공 요청을 받은 입주자저축취급기관의 장은 「금융실명거래 및 비밀보장에 관한 법률」 제4조에도 불구하고 입주자저축정보를 제공하여야 한다. <신설 2020.1.23>\n⑦ 제6항에 따라 입주자저축정보를 제공한 입주자저축취급기관의 장은 「금융실명거래 및 비밀보장에 관한 법률」 제4조의2제1항에도 불구하고 입주자저축정보의 제공사실을 명의인에게 통보하지 아니할 수 있다. 다만, 입주자저축정보를 제공하는 입주자저축취급기관의 장은 입주자저축정보의 명의인이 요구할 때에는 입주자저축정보의 제공사실을 통보하여야 한다. <신설 2020.1.23>\n⑧ 입주자저축정보의 제공 요청 및 제공은 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제1호의 정보통신망을 이용하여야 한다. 다만, 정보통신망의 손상 등 불가피한 사유가 있는 경우에는 그러하지 아니하다. <신설 2020.1.23>\n⑨ 그 밖에 입주자저축의 납입방식ㆍ금액 및 조건 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2020.1.23>\n⑩ 이 조에 따른 업무에 종사하거나 종사하였던 자는 업무를 수행하면서 취득한 입주자저축정보를 다른 법률에 특별한 규정이 없으면 제5항 각 호의 업무를 수행하기 위한 목적 외의 다른 용도로 사용하거나 다른 사람 또는 기관에 제공하거나 누설해서는 아니 된다. <신설 2020.1.23>\n⑪ 국토교통부장관(제89조제4항제2호에 따라 입주자저축정보의 제공 요청 업무를 위탁받은 주택청약업무수행기관을 포함한다)은 입주자저축정보를 다른 법률에 따라 제5항 각 호의 업무를 수행하기 위한 목적 외의 용도로 사용하거나 다른 사람 또는 기관에 제공하는 경우에는 「개인정보 보호법」 제18조제4항에 따라 그 사용 또는 제공의 법적 근거, 목적 및 범위 등을 관보 또는 인터넷 홈페이지 등에 게재하여야 한다. <신설 2020.1.23>"
  - no: 56의2
    title: 주택청약업무수행기관
    text: 제56조의2(주택청약업무수행기관) 국토교통부장관은 제55조에 따른 입주자자격, 공급 순위 등의 확인과 제56조에 따른 입주자저축의 관리 등 주택공급과 관련하여 국토교통부령으로 정하는 업무를 효율적으로 수행하기 위하여 주택청약업무수행기관을 지정ㆍ고시할 수 있다.
  - no: 56의3
    title: 입주자자격 정보 제공 등
    text: "제56조의3(입주자자격 정보 제공 등)\n① 국토교통부장관은 주택을 공급받으려는 자가 요청하는 경우 주택공급 신청 전에 입주자자격, 주택의 소유 여부, 재당첨 제한 여부, 공급 순위 등에 관한 정보를 제공할 수 있다.\n② 제1항에 따라 정보를 제공하기 위하여 필요한 경우 국토교통부장관은 정보 제공을 요청하는 자 및 배우자, 정보 제공을 요청하는 자 또는 배우자와 세대를 같이하는 세대원에게 개인정보의 수집ㆍ제공 동의를 받아야 한다."
  - no: '57'
    title: 주택의 분양가격 제한 등
    text: "제57조(주택의 분양가격 제한 등)\n① 사업주체가 제54조에 따라 일반인에게 공급하는 공동주택 중 다음 각 호의 어느 하나에 해당하는 지역에서 공급하는 주택의 경우에는 이 조에서 정하는 기준에 따라 산정되는 분양가격 이하로 공급(이에 따라 공급되는 주택을 \"분양가상한제 적용주택\"이라 한다. 이하 같다)하여야 한다. <개정 2021.7.20, 2023.12.26>\n1. 공공택지\n2. 공공택지 외의 택지에서 주택가격 상승 우려가 있어 제58조에 따라 국토교통부장관이 「주거기본법」 제8조에 따른 주거정책심의위원회(이하 \"주거정책심의위원회\"라 한다)의 심의를 거쳐 지정하는 지역\n② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 제1항을 적용하지 아니한다. <개정 2020.8.18, 2021.4.13, 2021.7.20, 2022.5.3, 2023.12.26, 2026.2.3, 2026.9.8>\n1. 도시형 생활주택\n2. 「경제자유구역의 지정 및 운영에 관한 특별법」 제4조에 따라 지정ㆍ고시된 경제자유구역에서 건설ㆍ공급하는 공동주택으로서 같은 법 제25조에 따른 경제자유구역위원회에서 외자유치 촉진과 관련이 있다고 인정하여 이 조에 따른 분양가격 제한을 적용하지 아니하기로 심의ㆍ의결한 경우\n3. 「관광진흥법」 제70조제1항 또는 제2항에 따라 지정된 관광특구에서 건설ㆍ공급하는 공동주택으로서 해당 건축물의 층수가 50층 이상이거나 높이가 150미터 이상인 경우\n4. 한국토지주택공사 또는 지방공사가 다음 각 목의 정비사업의 시행자(「도시 및 주거환경정비법」 제2조제8호 및 「소규모주택정비에 관한 특례법」 제2조제1항제5호에 따른 사업시행자를 말한다)로 참여하는 등 대통령령으로 정하는 공공성 요건을 충족하는 경우로서 해당 사업에서 건설ㆍ공급하는 주택\n4의2. 「도시 및 주거환경정비법」 제2조제2호가목에 따른 주거환경개선사업 및 같은 호 나목 후단에 따른 공공재개발사업에서 건설ㆍ공급하는 주택\n5. 「도시재생 활성화 및 지원에 관한 특별법」에 따른 주거재생혁신지구에서 시행하는 혁신지구재생사업에서 건설ㆍ공급하는 주택\n6. 「공공주택 특별법」 제2조제3호마목에 따른 도심 공공주택 복합사업에서 건설ㆍ공급하는 주택\n7. 「공공주택 특별법」 제27조의3에 따른 쪽방 밀집지역을 포함하는 공공주택사업에서 건설ㆍ공급하는 주택\n③ 제1항의 분양가격은 택지비와 건축비로 구성(토지임대부 분양주택의 경우에는 건축비만 해당한다)되며, 구체적인 명세, 산정방식, 감정평가기관 선정방법 등은 국토교통부령으로 정한다. 이 경우 택지비는 다음 각 호에 따라 산정한 금액으로 한다. <개정 2016.1.19, 2016.12.27>\n1. 공공택지에서 주택을 공급하는 경우에는 해당 택지의 공급가격에 국토교통부령으로 정하는 택지와 관련된 비용을 가산한 금액\n2. 공공택지 외의 택지에서 분양가상한제 적용주택을 공급하는 경우에는 「감정평가 및 감정평가사에 관한 법률」에 따라 감정평가한 가액에 국토교통부령으로 정하는 택지와 관련된 비용을 가산한 금액. 다만, 택지 매입가격이 다음 각 목의 어느 하나에 해당하는 경우에는 해당 매입가격(대통령령으로 정하는 범위로 한정한다)에 국토교통부령으로 정하는 택지와 관련된 비용을 가산한 금액을 택지비로 볼 수 있다. 이 경우 택지비는 주택단지 전체에 동일하게 적용하여야 한다.\n④ 제3항의 분양가격 구성항목 중 건축비는 국토교통부장관이 정하여 고시하는 건축비(이하 \"기본형건축비\"라 한다)에 국토교통부령으로 정하는 금액을 더한 금액으로 한다. 이 경우 기본형건축비는 시장ㆍ군수ㆍ구청장이 해당 지역의 특성을 고려하여 국토교통부령으로 정하는 범위에서 따로 정하여 고시할 수 있다.\n⑤ 사업주체는 분양가상한제 적용주택으로서 공공택지에서 공급하는 주택에 대하여 입주자모집 승인을 받았을 때에는 입주자 모집공고에 다음 각 호[국토교통부령으로 정하는 세분류(細分類)를 포함한다]에 대하여 분양가격을 공시하여야 한다.\n1. 택지비\n2. 공사비\n3. 간접비\n4. 그 밖에 국토교통부령으로 정하는 비용\n⑥ 시장ㆍ군수ㆍ구청장이 제54조에 따라 공공택지 외의 택지에서 공급되는 분양가상한제 적용주택 중 분양가 상승 우려가 큰 지역으로서 대통령령으로 정하는 기준에 해당되는 지역에서 공급되는 주택의 입주자모집 승인을 하는 경우에는 다음 각 호의 구분에 따라 분양가격을 공시하여야 한다. 이 경우 제2호부터 제6호까지의 금액은 기본형건축비[특별자치시ㆍ특별자치도ㆍ시ㆍ군ㆍ구(구는 자치구의 구를 말하며, 이하 \"시ㆍ군ㆍ구\"라 한다)별 기본형건축비가 따로 있는 경우에는 시ㆍ군ㆍ구별 기본형건축비]의 항목별 가액으로 한다.\n1. 택지비\n2. 직접공사비\n3. 간접공사비\n4. 설계비\n5. 감리비\n6. 부대비\n7. 그 밖에 국토교통부령으로 정하는 비용\n⑦ 제5항 및 제6항에 따른 공시를 할 때 국토교통부령으로 정하는 택지비 및 건축비에 가산되는 비용의 공시에는 제59조에 따른 분양가심사위원회 심사를 받은 내용과 산출근거를 포함하여야 한다."
  - no: 57의2
    title: 분양가상한제 적용주택 등의 입주자의 거주의무 등
    text: "제57조의2(분양가상한제 적용주택 등의 입주자의 거주의무 등)\n① 다음 각 호의 어느 하나에 해당하는 주택의 입주자(상속받은 자는 제외한다. 이하 이 조 및 제57조의3에서 \"거주의무자\"라 한다)는 해당 주택의 최초 입주가능일부터 3년 이내(제4호에 따른 토지임대부 분양주택의 경우에는 최초 입주가능일을 말한다)에 입주하여야 하고, 해당 주택의 분양가격과 국토교통부장관이 고시한 방법으로 결정된 인근지역 주택매매가격의 비율에 따라 5년 이내의 범위에서 대통령령으로 정하는 기간(이하 \"거주의무기간\"이라 한다) 동안 계속하여 해당 주택에 거주하여야 한다. 다만, 해외 체류 등 대통령령으로 정하는 부득이한 사유가 있는 경우 그 기간은 해당 주택에 거주한 것으로 본다. <개정 2021.1.5, 2021.4.13, 2024.3.19>\n1. 사업주체가 「수도권정비계획법」 제2조제1호에 따른 수도권(이하 \"수도권\"이라 한다)에서 건설ㆍ공급하는 분양가상한제 적용주택\n2. 삭제<2024.3.19>\n3. 삭제<2024.3.19>\n4. 토지임대부 분양주택\n② 거주의무자는 제1항에 따른 거주의무를 이행하지 아니한 경우 해당 주택을 양도(매매ㆍ증여나 그 밖에 권리 변동을 수반하는 모든 행위를 포함하되, 상속의 경우는 제외한다. 이하 이 조 및 제101조에서 같다)할 수 없다. 다만, 거주의무자가 제1항 각 호 외의 부분 단서 이외의 사유로 거주의무기간 이내에 거주를 이전하려는 경우 거주의무자는 대통령령으로 정하는 바에 따라 한국토지주택공사(사업주체가 「공공주택 특별법」 제4조에 따른 공공주택사업자인 경우에는 공공주택사업자를 말한다. 이하 이 조, 제64조, 제78조의2 및 제106조에서 같다)에 해당 주택의 매입을 신청하여야 한다. <개정 2024.3.19>\n③ 한국토지주택공사는 제2항 단서 또는 제8항에 따라 매입신청을 받거나 거주의무자 및 제7항에 따라 주택을 공급받은 사람(이하 \"거주의무자등\"이라 한다)이 제1항 또는 제7항을 위반하였다는 사실을 알게 된 경우 위반사실에 대한 의견청취를 하는 등 대통령령으로 정하는 절차를 거쳐 대통령령으로 정하는 특별한 사유가 없으면 해당 주택을 매입하여야 한다. <개정 2024.3.19>\n④ 한국토지주택공사가 제3항에 따라 주택을 매입하는 경우 거주의무자등에게 그가 납부한 입주금과 그 입주금에 「은행법」에 따른 은행의 1년 만기 정기예금의 평균이자율을 적용한 이자를 합산한 금액(이하 \"매입비용\"이라 한다)을 지급한 때에는 그 지급한 날에 한국토지주택공사가 해당 주택을 취득한 것으로 본다. <개정 2024.3.19>\n⑤ 사업주체는 제1항에 따른 주택을 공급하는 경우에는 거주의무자가 거주의무기간을 거주하여야 해당 주택을 양도할 수 있음을 소유권에 관한 등기에 부기등기하여야 한다. 이 경우 부기등기는 주택의 소유권보존등기와 동시에 하여야 하며, 부기등기에 포함되어야 할 표기내용 등은 대통령령으로 정한다. <개정 2024.3.19>\n⑥ 거주의무자등은 거주의무기간을 거주한 후 지방자치단체의 장으로부터 그 거주사실을 확인받은 경우 제5항에 따른 부기등기 사항을 말소할 수 있다. 이 경우 거주사실의 확인 등의 절차ㆍ방법 등에 필요한 사항은 대통령령으로 정한다. <개정 2024.3.19>\n⑦ 한국토지주택공사는 제3항 및 제4항에 따라 취득한 주택을 국토교통부령으로 정하는 바에 따라 재공급하여야 하며, 주택을 재공급받은 사람은 거주의무기간 중 잔여기간을 계속하여 거주하지 아니하고 그 주택을 양도할 수 없다. 다만, 제1항 각 호 외의 부분 단서의 사유에 해당하는 경우 그 기간은 해당 주택에 거주한 것으로 본다. <개정 2024.3.19>\n⑧ 제7항에 따라 주택을 재공급받은 사람이 같은 항 단서 이외의 사유로 거주의무기간 이내에 거주를 이전하려는 경우에는 대통령령으로 정하는 바에 따라 한국토지주택공사에 해당 주택의 매입을 신청하여야 한다. <신설 2024.3.19>\n⑨ 한국토지주택공사가 제3항 및 제4항에 따라 주택을 취득하거나 제7항에 따라 주택을 공급하는 경우에는 제64조제1항을 적용하지 아니한다. <개정 2024.3.19>"
  - no: 57의3
    title: 분양가상한제 적용주택 등의 거주실태 조사 등
    text: "제57조의3(분양가상한제 적용주택 등의 거주실태 조사 등)\n① 국토교통부장관 또는 지방자치단체의 장은 거주의무자등의 실제 거주 여부를 확인하기 위하여 거주의무자등에게 필요한 서류 등의 제출을 요구할 수 있으며, 소속 공무원으로 하여금 해당 주택에 출입하여 조사하게 하거나 관계인에게 필요한 질문을 하게 할 수 있다. 이 경우 서류 등의 제출을 요구받거나 해당 주택의 출입ㆍ조사 또는 필요한 질문을 받은 거주의무자등은 모든 세대원의 해외출장 등 특별한 사유가 없으면 이에 따라야 한다. <개정 2024.3.19>\n② 국토교통부장관 또는 지방자치단체의 장은 제1항에 따른 조사를 위하여 필요한 경우 주민등록 전산정보(주민등록번호ㆍ외국인등록번호 등 고유식별번호를 포함한다), 가족관계 등록사항 등 실제 거주 여부를 확인하기 위하여 필요한 자료 또는 정보의 제공을 관계 기관의 장에게 요청할 수 있다. 이 경우 자료의 제공을 요청받은 관계 기관의 장은 특별한 사유가 없으면 이에 따라야 한다.\n③ 제1항에 따라 출입ㆍ조사ㆍ질문을 하는 사람은 국토교통부령으로 정하는 증표를 지니고 이를 관계인에게 내보여야 하며, 조사자의 이름ㆍ출입시간 및 출입목적 등이 표시된 문서를 관계인에게 교부하여야 한다.\n④ 국토교통부 또는 지방자치단체의 소속 공무원 또는 소속 공무원이었던 사람은 제1항과 제2항에 따라 얻은 정보와 자료를 이 법에서 정한 목적 외의 다른 용도로 사용하거나 다른 사람 또는 기관에 제공하거나 누설하여서는 아니 된다."
  - no: '58'
    title: 분양가상한제 적용 지역의 지정 및 해제
    text: "제58조(분양가상한제 적용 지역의 지정 및 해제)\n① 국토교통부장관은 제57조제1항제2호에 따라 주택가격상승률이 물가상승률보다 현저히 높은 지역으로서 그 지역의 주택가격ㆍ주택거래 등과 지역 주택시장 여건 등을 고려하였을 때 주택가격이 급등하거나 급등할 우려가 있는 지역 중 대통령령으로 정하는 기준을 충족하는 지역은 주거정책심의위원회 심의를 거쳐 분양가상한제 적용 지역으로 지정할 수 있다.\n② 국토교통부장관이 제1항에 따라 분양가상한제 적용 지역을 지정하는 경우에는 미리 시ㆍ도지사의 의견을 들어야 한다.\n③ 국토교통부장관은 제1항에 따른 분양가상한제 적용 지역을 지정하였을 때에는 지체 없이 이를 공고하고, 그 지정 지역을 관할하는 시장ㆍ군수ㆍ구청장에게 공고 내용을 통보하여야 한다. 이 경우 시장ㆍ군수ㆍ구청장은 사업주체로 하여금 입주자 모집공고 시 해당 지역에서 공급하는 주택이 분양가상한제 적용주택이라는 사실을 공고하게 하여야 한다.\n④ 국토교통부장관은 제1항에 따른 분양가상한제 적용 지역으로 계속 지정할 필요가 없다고 인정하는 경우에는 주거정책심의위원회 심의를 거쳐 분양가상한제 적용 지역의 지정을 해제하여야 한다.\n⑤ 분양가상한제 적용 지역의 지정을 해제하는 경우에는 제2항 및 제3항 전단을 준용한다. 이 경우 \"지정\"은 \"지정 해제\"로 본다.\n⑥ 분양가상한제 적용 지역으로 지정된 지역의 시ㆍ도지사, 시장, 군수 또는 구청장은 분양가상한제 적용 지역의 지정 후 해당 지역의 주택가격이 안정되는 등 분양가상한제 적용 지역으로 계속 지정할 필요가 없다고 인정하는 경우에는 국토교통부장관에게 그 지정의 해제를 요청할 수 있다.\n⑦ 제6항에 따라 분양가상한제 적용 지역 지정의 해제를 요청하는 경우의 절차 등 필요한 사항은 대통령령으로 정한다."
  - no: '59'
    title: 분양가심사위원회의 운영 등
    text: "제59조(분양가심사위원회의 운영 등)\n① 시장ㆍ군수ㆍ구청장은 제57조에 관한 사항을 심의하기 위하여 분양가심사위원회를 설치ㆍ운영하여야 한다.\n② 시장ㆍ군수ㆍ구청장은 제54조제1항제1호에 따라 입주자모집 승인을 할 때에는 분양가심사위원회의 심사결과에 따라 승인 여부를 결정하여야 한다.\n③ 분양가심사위원회는 주택 관련 분야 교수, 주택건설 또는 주택관리 분야 전문직 종사자, 관계 공무원 또는 변호사ㆍ회계사ㆍ감정평가사 등 관련 전문가 10명 이내로 구성하되, 구성 절차 및 운영에 관한 사항은 대통령령으로 정한다.\n④ 분양가심사위원회의 위원은 제1항부터 제3항까지의 업무를 수행할 때에는 신의와 성실로써 공정하게 심사를 하여야 한다."
  - no: '60'
    title: 견본주택의 건축기준
    text: "제60조(견본주택의 건축기준)\n① 사업주체가 주택의 판매촉진을 위하여 견본주택을 건설하려는 경우 견본주택의 내부에 사용하는 마감자재 및 가구는 제15조에 따른 사업계획승인의 내용과 같은 것으로 시공ㆍ설치하여야 한다.\n② 사업주체는 견본주택의 내부에 사용하는 마감자재를 제15조에 따른 사업계획승인 또는 마감자재 목록표와 다른 마감자재로 설치하는 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 일반인이 그 해당 사항을 알 수 있도록 국토교통부령으로 정하는 바에 따라 그 공급가격을 표시하여야 한다.\n1. 분양가격에 포함되지 아니하는 품목을 견본주택에 전시하는 경우\n2. 마감자재 생산업체의 부도 등으로 인한 제품의 품귀 등 부득이한 경우\n③ 견본주택에는 마감자재 목록표와 제15조에 따라 사업계획승인을 받은 서류 중 평면도와 시방서(示方書)를 갖춰 두어야 하며, 견본주택의 배치ㆍ구조 및 유지관리 등은 국토교통부령으로 정하는 기준에 맞아야 한다."
  - no: '61'
    title: 저당권설정 등의 제한
    text: "제61조(저당권설정 등의 제한)\n① 사업주체는 주택건설사업에 의하여 건설된 주택 및 대지에 대하여는 입주자 모집공고 승인 신청일(주택조합의 경우에는 사업계획승인 신청일을 말한다) 이후부터 입주예정자가 그 주택 및 대지의 소유권이전등기를 신청할 수 있는 날 이후 60일까지의 기간 동안 입주예정자의 동의 없이 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다. 다만, 그 주택의 건설을 촉진하기 위하여 대통령령으로 정하는 경우에는 그러하지 아니하다.\n1. 해당 주택 및 대지에 저당권 또는 가등기담보권 등 담보물권을 설정하는 행위\n2. 해당 주택 및 대지에 전세권ㆍ지상권(地上權) 또는 등기되는 부동산임차권을 설정하는 행위\n3. 해당 주택 및 대지를 매매 또는 증여 등의 방법으로 처분하는 행위\n② 제1항에서 \"소유권이전등기를 신청할 수 있는 날\"이란 사업주체가 입주예정자에게 통보한 입주가능일을 말한다.\n③ 제1항에 따른 저당권설정 등의 제한을 할 때 사업주체는 해당 주택 또는 대지가 입주예정자의 동의 없이는 양도하거나 제한물권을 설정하거나 압류ㆍ가압류ㆍ가처분 등의 목적물이 될 수 없는 재산임을 소유권등기에 부기등기(附記登記)하여야 한다. 다만, 사업주체가 국가ㆍ지방자치단체 및 한국토지주택공사 등 공공기관이거나 해당 대지가 사업주체의 소유가 아닌 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다.\n④ 제3항에 따른 부기등기는 주택건설대지에 대하여는 입주자 모집공고 승인 신청(주택건설대지 중 주택조합이 사업계획승인 신청일까지 소유권을 확보하지 못한 부분이 있는 경우에는 그 부분에 대한 소유권이전등기를 말한다)과 동시에 하여야 하고, 건설된 주택에 대하여는 소유권보존등기와 동시에 하여야 한다. 이 경우 부기등기의 내용 및 말소에 관한 사항은 대통령령으로 정한다.\n⑤ 제4항에 따른 부기등기일 이후에 해당 대지 또는 주택을 양수하거나 제한물권을 설정받은 경우 또는 압류ㆍ가압류ㆍ가처분 등의 목적물로 한 경우에는 그 효력을 무효로 한다. 다만, 사업주체의 경영부실로 입주예정자가 그 대지를 양수받는 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다.\n⑥ 사업주체의 재무 상황 및 금융거래 상황이 극히 불량한 경우 등 대통령령으로 정하는 사유에 해당되어 「주택도시기금법」에 따른 주택도시보증공사(이하 \"주택도시보증공사\"라 한다)가 분양보증을 하면서 주택건설대지를 주택도시보증공사에 신탁하게 할 경우에는 제1항과 제3항에도 불구하고 사업주체는 그 주택건설대지를 신탁할 수 있다.\n⑦ 제6항에 따라 사업주체가 주택건설대지를 신탁하는 경우 신탁등기일 이후부터 입주예정자가 해당 주택건설대지의 소유권이전등기를 신청할 수 있는 날 이후 60일까지의 기간 동안 해당 신탁의 종료를 원인으로 하는 사업주체의 소유권이전등기청구권에 대한 압류ㆍ가압류ㆍ가처분 등은 효력이 없음을 신탁계약조항에 포함하여야 한다.\n⑧ 제6항에 따른 신탁등기일 이후부터 입주예정자가 해당 주택건설대지의 소유권이전등기를 신청할 수 있는 날 이후 60일까지의 기간 동안 해당 신탁의 종료를 원인으로 하는 사업주체의 소유권이전등기청구권을 압류ㆍ가압류ㆍ가처분 등의 목적물로 한 경우에는 그 효력을 무효로 한다."
  - no: '62'
    title: 사용검사 후 매도청구 등
    text: "제62조(사용검사 후 매도청구 등)\n① 주택(복리시설을 포함한다. 이하 이 조에서 같다)의 소유자들은 주택단지 전체 대지에 속하는 일부의 토지에 대한 소유권이전등기 말소소송 등에 따라 제49조의 사용검사(동별 사용검사를 포함한다. 이하 이 조에서 같다)를 받은 이후에 해당 토지의 소유권을 회복한 자(이하 이 조에서 \"실소유자\"라 한다)에게 해당 토지를 시가로 매도할 것을 청구할 수 있다.\n② 주택의 소유자들은 대표자를 선정하여 제1항에 따른 매도청구에 관한 소송을 제기할 수 있다. 이 경우 대표자는 주택의 소유자 전체의 4분의 3 이상의 동의를 받아 선정한다.\n③ 제2항에 따른 매도청구에 관한 소송에 대한 판결은 주택의 소유자 전체에 대하여 효력이 있다.\n④ 제1항에 따라 매도청구를 하려는 경우에는 해당 토지의 면적이 주택단지 전체 대지 면적의 5퍼센트 미만이어야 한다.\n⑤ 제1항에 따른 매도청구의 의사표시는 실소유자가 해당 토지 소유권을 회복한 날부터 2년 이내에 해당 실소유자에게 송달되어야 한다.\n⑥ 주택의 소유자들은 제1항에 따른 매도청구로 인하여 발생한 비용의 전부를 사업주체에게 구상(求償)할 수 있다."
  - no: '63'
    title: 투기과열지구의 지정 및 해제
    text: "제63조(투기과열지구의 지정 및 해제)\n① 국토교통부장관 또는 시ㆍ도지사는 주택가격의 안정을 위하여 필요한 경우에는 주거정책심의위원회(시ㆍ도지사의 경우에는 「주거기본법」 제9조에 따른 시ㆍ도 주거정책심의위원회를 말한다. 이하 이 조에서 같다)의 심의를 거쳐 일정한 지역을 투기과열지구로 지정하거나 이를 해제할 수 있다. 이 경우 투기과열지구는 그 지정 목적을 달성할 수 있는 최소한의 범위에서 시ㆍ군ㆍ구 또는 읍ㆍ면ㆍ동의 지역 단위로 지정하되, 택지개발지구(「택지개발촉진법」 제2조제3호에 따른 택지개발지구를 말한다) 등 해당 지역 여건을 고려하여 지정 단위를 조정할 수 있다. <개정 2021.1.5>\n② 제1항에 따른 투기과열지구는 해당 지역의 주택가격상승률이 물가상승률보다 현저히 높은 지역으로서 그 지역의 청약경쟁률ㆍ주택가격ㆍ주택보급률 및 주택공급계획 등과 지역 주택시장 여건 등을 고려하였을 때 주택에 대한 투기가 성행하고 있거나 성행할 우려가 있는 지역 중 대통령령으로 정하는 기준을 충족하는 곳이어야 한다. <개정 2021.8.10>\n③ 국토교통부장관 또는 시ㆍ도지사는 제1항에 따라 투기과열지구를 지정하였을 때에는 지체 없이 이를 공고하고, 국토교통부장관은 그 투기과열지구를 관할하는 시장ㆍ군수ㆍ구청장에게, 특별시장, 광역시장 또는 도지사는 그 투기과열지구를 관할하는 시장, 군수 또는 구청장에게 각각 공고 내용을 통보하여야 한다. 이 경우 시장ㆍ군수ㆍ구청장은 사업주체로 하여금 입주자 모집공고 시 해당 주택건설 지역이 투기과열지구에 포함된 사실을 공고하게 하여야 한다. 투기과열지구 지정을 해제하는 경우에도 또한 같다.\n④ 국토교통부장관 또는 시ㆍ도지사는 투기과열지구에서 제2항에 따른 지정 사유가 없어졌다고 인정하는 경우에는 지체 없이 투기과열지구 지정을 해제하여야 한다.\n⑤ 제1항에 따라 국토교통부장관이 투기과열지구를 지정하거나 해제할 경우에는 미리 시ㆍ도지사의 의견을 듣고 그 의견에 대한 검토의견을 회신하여야 하며, 시ㆍ도지사가 투기과열지구를 지정하거나 해제할 경우에는 국토교통부장관과 협의하여야 한다. <개정 2018.3.13>\n⑥ 국토교통부장관은 반기마다 주거정책심의위원회의 회의를 소집하여 투기과열지구로 지정된 지역별로 해당 지역의 주택가격 안정 여건의 변화 등을 고려하여 투기과열지구 지정의 유지 여부를 재검토하여야 한다. 이 경우 재검토 결과 투기과열지구 지정의 해제가 필요하다고 인정되는 경우에는 지체 없이 투기과열지구 지정을 해제하고 이를 공고하여야 한다. <개정 2021.4.13>\n⑦ 투기과열지구로 지정된 지역의 시ㆍ도지사, 시장, 군수 또는 구청장은 투기과열지구 지정 후 해당 지역의 주택가격이 안정되는 등 지정 사유가 없어졌다고 인정되는 경우에는 국토교통부장관 또는 시ㆍ도지사에게 투기과열지구 지정의 해제를 요청할 수 있다.\n⑧ 제7항에 따라 투기과열지구 지정의 해제를 요청받은 국토교통부장관 또는 시ㆍ도지사는 요청받은 날부터 40일 이내에 주거정책심의위원회의 심의를 거쳐 투기과열지구 지정의 해제 여부를 결정하여 그 투기과열지구를 관할하는 지방자치단체의 장에게 심의결과를 통보하여야 한다.\n⑨ 국토교통부장관 또는 시ㆍ도지사는 제8항에 따른 심의결과 투기과열지구에서 그 지정 사유가 없어졌다고 인정될 때에는 지체 없이 투기과열지구 지정을 해제하고 이를 공고하여야 한다."
  - no: 63의2
    title: 조정대상지역의 지정 및 해제
    text: "제63조의2(조정대상지역의 지정 및 해제)\n① 국토교통부장관은 다음 각 호의 어느 하나에 해당하는 지역으로서 대통령령으로 정하는 기준을 충족하는 지역을 주거정책심의위원회의 심의를 거쳐 조정대상지역(이하 \"조정대상지역\"이라 한다)으로 지정할 수 있다. 이 경우 제1호에 해당하는 조정대상지역은 그 지정 목적을 달성할 수 있는 최소한의 범위에서 시ㆍ군ㆍ구 또는 읍ㆍ면ㆍ동의 지역 단위로 지정하되, 택지개발지구(「택지개발촉진법」 제2조제3호에 따른 택지개발지구를 말한다) 등 해당 지역 여건을 고려하여 지정 단위를 조정할 수 있다. <개정 2021.1.5, 2021.8.10>\n1. 주택가격, 청약경쟁률, 분양권 전매량 및 주택보급률 등을 고려하였을 때 주택 분양 등이 과열되어 있거나 과열될 우려가 있는 지역\n2. 주택가격, 주택거래량, 미분양주택의 수 및 주택보급률 등을 고려하여 주택의 분양ㆍ매매 등 거래가 위축되어 있거나 위축될 우려가 있는 지역\n② 국토교통부장관은 제1항에 따라 조정대상지역을 지정하는 경우 다음 각 호의 사항을 미리 관계 기관과 협의할 수 있다.\n1. 「주택도시기금법」에 따른 주택도시보증공사의 보증업무 및 주택도시기금의 지원 등에 관한 사항\n2. 주택 분양 및 거래 등과 관련된 금융ㆍ세제 조치 등에 관한 사항\n3. 그 밖에 주택시장의 안정 또는 실수요자의 주택거래 활성화를 위하여 대통령령으로 정하는 사항\n③ 국토교통부장관은 제1항에 따라 조정대상지역을 지정하는 경우에는 미리 시ㆍ도지사의 의견을 듣고 그 의견에 대한 검토의견을 회신하여야 한다. <개정 2026.9.8>\n④ 국토교통부장관은 조정대상지역을 지정하였을 때에는 지체 없이 이를 공고하고, 그 조정대상지역을 관할하는 시장ㆍ군수ㆍ구청장에게 공고 내용을 통보하여야 한다. 이 경우 시장ㆍ군수ㆍ구청장은 사업주체로 하여금 입주자 모집공고 시 해당 주택건설 지역이 조정대상지역에 포함된 사실을 공고하게 하여야 한다.\n⑤ 국토교통부장관은 조정대상지역으로 유지할 필요가 없다고 판단되는 경우에는 주거정책심의위원회의 심의를 거쳐 조정대상지역의 지정을 해제하여야 한다.\n⑥ 제5항에 따라 조정대상지역의 지정을 해제하는 경우에는 제3항 및 제4항 전단을 준용한다. 이 경우 \"지정\"은 \"해제\"로 본다.\n⑦ 국토교통부장관은 반기마다 주거정책심의위원회의 회의를 소집하여 조정대상지역으로 지정된 지역별로 해당 지역의 주택가격 안정 여건의 변화 등을 고려하여 조정대상지역 지정의 유지 여부를 재검토하여야 한다. 이 경우 재검토 결과 조정대상지역 지정의 해제가 필요하다고 인정되는 경우에는 지체 없이 조정대상지역 지정을 해제하고 이를 공고하여야 한다. <신설 2021.1.5>\n⑧ 조정대상지역으로 지정된 지역의 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 조정대상지역 지정 후 해당 지역의 주택가격이 안정되는 등 조정대상지역으로 유지할 필요가 없다고 판단되는 경우에는 국토교통부장관에게 그 지정의 해제를 요청할 수 있다. <개정 2021.1.5>\n⑨ 제8항에 따라 조정대상지역의 지정의 해제를 요청하는 경우의 절차 등 필요한 사항은 국토교통부령으로 정한다. <개정 2021.1.5>"
  - no: '64'
    title: 주택의 전매행위 제한 등
    text: "제64조(주택의 전매행위 제한 등)\n① 사업주체가 건설ㆍ공급하는 주택[해당 주택의 입주자로 선정된 지위(입주자로 선정되어 그 주택에 입주할 수 있는 권리ㆍ자격ㆍ지위 등을 말한다)를 포함한다. 이하 이 조 및 제101조에서 같다]으로서 다음 각 호의 어느 하나에 해당하는 경우에는 10년 이내의 범위에서 대통령령으로 정하는 기간(이하 \"전매제한기간\"이라 한다)이 지나기 전에는 그 주택을 전매(매매ㆍ증여나 그 밖에 권리의 변동을 수반하는 모든 행위를 포함하되, 상속의 경우는 제외한다. 이하 같다)하거나 이의 전매를 알선할 수 없다. 이 경우 전매제한기간은 주택의 수급 상황 및 투기 우려 등을 고려하여 대통령령으로 지역별로 달리 정할 수 있다. <개정 2017.8.9, 2020.8.18, 2021.4.13, 2023.12.26>\n1. 투기과열지구에서 건설ㆍ공급되는 주택\n2. 조정대상지역에서 건설ㆍ공급되는 주택. 다만, 제63조의2제1항제2호에 해당하는 조정대상지역 중 주택의 수급 상황 등을 고려하여 대통령령으로 정하는 지역에서 건설ㆍ공급되는 주택은 제외한다.\n3. 분양가상한제 적용주택. 다만, 수도권 외의 지역 중 주택의 수급 상황 및 투기 우려 등을 고려하여 대통령령으로 정하는 지역으로서 투기과열지구가 지정되지 아니하거나 제63조에 따라 지정 해제된 지역 중 공공택지 외의 택지에서 건설ㆍ공급되는 분양가상한제 적용주택은 제외한다.\n4. 공공택지 외의 택지에서 건설ㆍ공급되는 주택. 다만, 제57조제2항 각 호의 주택 및 수도권 외의 지역 중 주택의 수급 상황 및 투기 우려 등을 고려하여 대통령령으로 정하는 지역으로서 공공택지 외의 택지에서 건설ㆍ공급되는 주택은 제외한다.\n5. 「도시 및 주거환경정비법」 제2조제2호나목 후단에 따른 공공재개발사업(제57조제1항제2호의 지역에 한정한다)에서 건설ㆍ공급하는 주택\n6. 토지임대부 분양주택\n② 제1항제1호부터 제5호까지의 주택을 공급받은 자의 생업상의 사정 등으로 전매가 불가피하다고 인정되는 경우로서 대통령령으로 정하는 경우에는 제1항을 적용하지 아니한다. 다만, 제1항제3호의 주택을 공급받은 자가 전매하는 경우에는 한국토지주택공사가 그 주택을 우선 매입할 수 있다. <개정 2017.8.9, 2020.8.18, 2023.12.26>\n③ 제1항(제6호는 제외한다)을 위반하여 주택의 입주자로 선정된 지위의 전매가 이루어진 경우, 사업주체가 매입비용을 그 매수인에게 지급한 경우에는 그 지급한 날에 사업주체가 해당 입주자로 선정된 지위를 취득한 것으로 보며, 제2항 단서에 따라 한국토지주택공사가 분양가상한제 적용주택을 우선 매입하는 경우에도 매입비용을 준용하되, 해당 주택의 분양가격과 인근지역 주택매매가격의 비율 및 해당 주택의 보유기간 등을 고려하여 대통령령으로 정하는 바에 따라 매입금액을 달리 정할 수 있다. <개정 2020.8.18, 2023.12.26>\n④ 사업주체가 제1항제3호, 제4호 및 제6호에 해당하는 주택을 공급하는 경우(한국주택토지공사가 제6항에 따라 주택을 재공급하는 경우도 포함한다)에는 그 주택의 소유권을 제3자에게 이전할 수 없음을 소유권에 관한 등기에 부기등기하여야 한다. <개정 2017.8.9, 2023.12.26>\n⑤ 제4항에 따른 부기등기는 주택의 소유권보존등기와 동시에 하여야 하며, 부기등기에는 \"이 주택은 최초로 소유권이전등기가 된 후에는 「주택법」 제64조제1항에서 정한 기간이 지나기 전에 한국토지주택공사(제64조제2항 단서 및 제78조의2제3항에 따라 한국토지주택공사가 매입한 주택을 공급받는 자를 포함한다) 외의 자에게 소유권을 이전하는 어떠한 행위도 할 수 없음\"을 명시하여야 한다. <개정 2023.12.26>\n⑥ 한국토지주택공사는 제2항 단서 및 제78조의2제3항에 따라 매입한 주택을 국토교통부령으로 정하는 바에 따라 재공급하여야 하며, 해당 주택을 공급받은 자는 전매제한기간 중 잔여기간 동안 그 주택을 전매할 수 없다. 이 경우 제78조의2제3항에 따라 매입한 주택은 토지임대부 분양주택으로 재공급하여야 한다. <개정 2023.12.26>\n⑦ 국토교통부장관은 제1항 및 제6항을 위반한 자에 대하여 10년의 범위에서 국토교통부령으로 정하는 바에 따라 주택의 입주자자격을 제한할 수 있다. <신설 2020.8.18, 2023.12.26>\n⑧ 한국토지주택공사가 제6항에 따라 주택을 재공급하는 경우에는 제1항을 적용하지 아니한다. <신설 2023.12.26>"
  - no: '65'
    title: 공급질서 교란 금지
    text: "제65조(공급질서 교란 금지)\n① 누구든지 이 법에 따라 건설ㆍ공급되는 주택을 공급받거나 공급받게 하기 위하여 다음 각 호의 어느 하나에 해당하는 증서 또는 지위를 양도ㆍ양수(매매ㆍ증여나 그 밖에 권리 변동을 수반하는 모든 행위를 포함하되, 상속ㆍ저당의 경우는 제외한다. 이하 이 조에서 같다) 또는 이를 알선하거나 양도ㆍ양수 또는 이를 알선할 목적으로 하는 광고(각종 간행물ㆍ인쇄물ㆍ전화ㆍ인터넷, 그 밖의 매체를 통한 행위를 포함한다)를 하여서는 아니 되며, 누구든지 거짓이나 그 밖의 부정한 방법으로 이 법에 따라 건설ㆍ공급되는 증서나 지위 또는 주택을 공급받거나 공급받게 하여서는 아니 된다. <개정 2020.6.9>\n1. 제11조에 따라 주택을 공급받을 수 있는 지위\n2. 제56조에 따른 입주자저축 증서\n3. 제80조에 따른 주택상환사채\n4. 그 밖에 주택을 공급받을 수 있는 증서 또는 지위로서 대통령령으로 정하는 것\n② 국토교통부장관 또는 사업주체는 다음 각 호의 어느 하나에 해당하는 자에 대하여는 그 주택 공급을 신청할 수 있는 지위를 무효로 하거나 이미 체결된 주택의 공급계약을 취소하여야 한다. <개정 2021.3.9>\n1. 제1항을 위반하여 증서 또는 지위를 양도하거나 양수한 자\n2. 제1항을 위반하여 거짓이나 그 밖의 부정한 방법으로 증서나 지위 또는 주택을 공급받은 자\n③ 사업주체가 제1항을 위반한 자에게 대통령령으로 정하는 바에 따라 산정한 주택가격에 해당하는 금액을 지급한 경우에는 그 지급한 날에 그 주택을 취득한 것으로 본다.\n④ 제3항의 경우 사업주체가 매수인에게 주택가격을 지급하거나, 매수인을 알 수 없어 주택가격의 수령 통지를 할 수 없는 경우 등 대통령령으로 정하는 사유에 해당하는 경우로서 주택가격을 그 주택이 있는 지역을 관할하는 법원에 공탁한 경우에는 그 주택에 입주한 자에게 기간을 정하여 퇴거를 명할 수 있다.\n⑤ 국토교통부장관은 제1항을 위반한 자에 대하여 10년의 범위에서 국토교통부령으로 정하는 바에 따라 주택의 입주자자격을 제한할 수 있다.\n⑥ 국토교통부장관 또는 사업주체는 제2항에도 불구하고 제1항을 위반한 공급질서 교란 행위가 있었다는 사실을 알지 못하고 주택 또는 주택의 입주자로 선정된 지위를 취득한 매수인이 해당 공급질서 교란 행위와 관련이 없음을 대통령령으로 정하는 바에 따라 소명하는 경우에는 이미 체결된 주택의 공급계약을 취소하여서는 아니 된다. <신설 2021.3.9>\n⑦ 사업주체는 제2항에 따라 이미 체결된 주택의 공급계약을 취소하려는 경우 국토교통부장관 및 주택 또는 주택의 입주자로 선정된 지위를 보유하고 있는 자에게 대통령령으로 정하는 절차 및 방법에 따라 그 사실을 미리 알려야 한다. <신설 2021.3.9>"
  - no: '66'
    title: 리모델링의 허가 등
    text: "제66조(리모델링의 허가 등)\n① 공동주택(부대시설과 복리시설을 포함한다)의 입주자ㆍ사용자 또는 관리주체가 공동주택을 리모델링하려고 하는 경우에는 허가와 관련된 면적, 세대수 또는 입주자 등의 동의 비율에 관하여 대통령령으로 정하는 기준 및 절차 등에 따라 시장ㆍ군수ㆍ구청장의 허가를 받아야 하며, 허가받은 사항을 변경하는 경우에도 또한 같다. 다만, 대통령령으로 정하는 경미한 사항을 변경하는 경우에는 시장ㆍ군수ㆍ구청장에게 신고하여야 한다. <개정 2026.9.8>\n② 제1항에도 불구하고 대통령령으로 정하는 기준 및 절차 등에 따라 리모델링 결의를 한 리모델링주택조합이나 소유자 전원의 동의를 받은 입주자대표회의(「공동주택관리법」 제2조제1항제8호에 따른 입주자대표회의를 말하며, 이하 \"입주자대표회의\"라 한다)가 시장ㆍ군수ㆍ구청장의 허가를 받아 리모델링을 할 수 있으며, 허가받은 사항을 변경하는 경우에도 또한 같다. 다만, 대통령령으로 정하는 경미한 사항을 변경하는 경우에는 시장ㆍ군수ㆍ구청장에게 신고하여야 한다. <개정 2020.1.23, 2026.9.8>\n③ 제2항에 따라 리모델링을 하는 경우 제11조제1항에 따라 설립인가를 받은 리모델링주택조합의 총회 또는 소유자 전원의 동의를 받은 입주자대표회의에서 「건설산업기본법」 제9조에 따른 건설사업자 또는 제7조제1항에 따라 건설사업자로 보는 등록사업자를 시공자로 선정하여야 한다. <개정 2019.4.30>\n④ 제3항에 따른 시공자를 선정하는 경우에는 국토교통부장관이 정하는 경쟁입찰의 방법으로 하여야 한다. 다만, 경쟁입찰의 방법으로 시공자를 선정하는 것이 곤란하다고 인정되는 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다.\n⑤ 제1항 또는 제2항에 따른 리모델링에 관하여 시장ㆍ군수ㆍ구청장이 관계 행정기관의 장과 협의하여 허가받은 사항에 관하여는 제19조를 준용하고, 허가에 따른 공사의 착수 및 허가의 취소는 제16조제1항 및 제4항부터 제6항까지를 준용한다. <개정 2026.9.8>\n⑥ 제1항에 따라 시장ㆍ군수ㆍ구청장이 세대수 증가형 리모델링(대통령령으로 정하는 세대수 이상으로 세대수가 증가하는 경우로 한정한다. 이하 이 조에서 같다)을 허가하려는 경우에는 기반시설에의 영향이나 도시ㆍ군관리계획과의 부합 여부 등에 대하여 「국토의 계획 및 이용에 관한 법률」 제113조제2항에 따라 설치된 시ㆍ군ㆍ구도시계획위원회(이하 \"시ㆍ군ㆍ구도시계획위원회\"라 한다)의 심의를 거쳐야 한다. 이 경우 세대수 증가 범위의 종합적인 검토 등을 위하여 대통령령으로 정하는 바에 따라 시ㆍ군ㆍ구도시계획위원회와 「건축법」 제4조에 따른 건축위원회의 심의를 공동으로 할 수 있다. <개정 2026.9.8>\n⑦ 공동주택의 입주자ㆍ사용자ㆍ관리주체ㆍ입주자대표회의 또는 리모델링주택조합이 제1항 또는 제2항에 따른 리모델링에 관하여 시장ㆍ군수ㆍ구청장의 허가를 받은 후 그 공사를 완료하였을 때에는 시장ㆍ군수ㆍ구청장의 사용검사를 받아야 하며, 사용검사에 관하여는 제49조를 준용한다.\n⑧ 시장ㆍ군수ㆍ구청장은 제7항에 해당하는 자가 거짓이나 그 밖의 부정한 방법으로 제1항ㆍ제2항 및 제5항에 따른 허가를 받은 경우에는 리모델링 허가를 취소할 수 있다. <개정 2026.9.8>\n⑨ 제71조에 따른 리모델링 기본계획 수립 대상지역에서 세대수 증가형 리모델링을 허가하려는 시장ㆍ군수ㆍ구청장은 해당 리모델링 기본계획에 부합하는 범위에서 허가하여야 한다."
  - no: '67'
    title: 권리변동계획의 수립
    text: 제67조(권리변동계획의 수립) 세대수가 증가되는 리모델링을 하는 경우에는 기존 주택의 권리변동, 비용분담 등 대통령령으로 정하는 사항에 대한 계획(이하 "권리변동계획"이라 한다)을 수립하여 사업계획승인 또는 리모델링 허가를 받아야 한다. <개정 2026.9.8>
  - no: '68'
    title: 증축형 리모델링의 안전진단
    text: "제68조(증축형 리모델링의 안전진단)\n① 제2조제25호나목 및 다목에 따라 증축하는 리모델링(이하 \"증축형 리모델링\"이라 한다)을 하려는 자는 시장ㆍ군수ㆍ구청장에게 안전진단을 요청하여야 하며, 안전진단을 요청받은 시장ㆍ군수ㆍ구청장은 해당 건축물의 증축 가능 여부의 확인 등을 위하여 안전진단을 실시하여야 한다.\n② 시장ㆍ군수ㆍ구청장은 제1항에 따라 안전진단을 실시하는 경우에는 대통령령으로 정하는 기관에 안전진단을 의뢰하여야 하며, 안전진단을 의뢰받은 기관은 리모델링을 하려는 자가 추천한 건축구조기술사(구조설계를 담당할 자를 말한다)와 함께 안전진단을 실시하여야 한다.\n③ 시장ㆍ군수ㆍ구청장이 제1항에 따른 안전진단으로 건축물 구조의 안전에 위험이 있다고 평가하여 「도시 및 주거환경정비법」 제2조제2호다목에 따른 재건축사업 및 「소규모주택정비에 관한 특례법」 제2조제1항제3호다목에 따른 소규모재건축사업의 시행이 필요하다고 결정한 건축물은 증축형 리모델링을 하여서는 아니 된다. <개정 2017.2.8, 2026.9.8>\n④ 시장ㆍ군수ㆍ구청장은 제66조제1항에 따라 수직증축형 리모델링을 허가한 후에 해당 건축물의 구조안전성 등에 대한 상세 확인을 위하여 안전진단을 실시하여야 한다. 이 경우 안전진단을 의뢰받은 기관은 제2항에 따른 건축구조기술사와 함께 안전진단을 실시하여야 하며, 리모델링을 하려는 자는 안전진단 후 구조설계의 변경 등이 필요한 경우에는 건축구조기술사로 하여금 이를 보완하도록 하여야 한다.\n⑤ 제2항 및 제4항에 따라 안전진단을 의뢰받은 기관은 국토교통부장관이 정하여 고시하는 기준에 따라 안전진단을 실시하고, 국토교통부령으로 정하는 방법 및 절차에 따라 안전진단 결과보고서를 작성하여 안전진단을 요청한 자와 시장ㆍ군수ㆍ구청장에게 제출하여야 한다.\n⑥ 시장ㆍ군수ㆍ구청장은 제1항 및 제4항에 따라 안전진단을 실시하는 비용의 전부 또는 일부를 리모델링을 하려는 자에게 부담하게 할 수 있다.\n⑦ 그 밖에 안전진단에 관하여 필요한 사항은 대통령령으로 정한다."
  - no: '69'
    title: 전문기관의 안전성 검토 등
    text: "제69조(전문기관의 안전성 검토 등)\n① 시장ㆍ군수ㆍ구청장은 수직증축형 리모델링을 하려는 자가 「건축법」에 따른 건축위원회의 심의를 요청하는 경우 구조계획상 증축범위의 적정성 등에 대하여 대통령령으로 정하는 전문기관에 안전성 검토를 의뢰하여야 한다.\n② 시장ㆍ군수ㆍ구청장은 제66조제1항에 따라 수직증축형 리모델링을 하려는 자의 허가 신청이 있거나 제68조제4항에 따른 안전진단 결과 국토교통부장관이 정하여 고시하는 설계도서의 변경이 있는 경우 제출된 설계도서상 구조안전의 적정성 여부 등에 대하여 제1항에 따라 검토를 수행한 전문기관에 안전성 검토를 의뢰하여야 한다.\n③ 제1항 및 제2항에 따라 검토의뢰를 받은 전문기관은 국토교통부장관이 정하여 고시하는 검토기준에 따라 검토한 결과를 대통령령으로 정하는 기간 이내에 시장ㆍ군수ㆍ구청장에게 제출하여야 하며, 시장ㆍ군수ㆍ구청장은 특별한 사유가 없는 경우 이 법 및 관계 법률에 따른 위원회의 심의 또는 허가 시 제출받은 안전성 검토결과를 반영하여야 한다.\n④ 시장ㆍ군수ㆍ구청장은 제1항 및 제2항에 따른 전문기관의 안전성 검토비용의 전부 또는 일부를 리모델링을 하려는 자에게 부담하게 할 수 있다.\n⑤ 국토교통부장관은 시장ㆍ군수ㆍ구청장에게 제3항에 따라 제출받은 자료의 제출을 요청할 수 있으며, 필요한 경우 시장ㆍ군수ㆍ구청장으로 하여금 안전성 검토결과의 적정성에 대하여 「건축법」에 따른 중앙건축위원회의 심의를 받도록 요청할 수 있다. <개정 2020.6.9>\n⑥ 시장ㆍ군수ㆍ구청장은 특별한 사유가 없으면 제5항에 따른 심의결과를 반영하여야 한다.\n⑦ 그 밖에 전문기관 검토 등에 관하여 필요한 사항은 대통령령으로 정한다."
  - no: '70'
    title: 수직증축형 리모델링의 구조기준
    text: 제70조(수직증축형 리모델링의 구조기준) 수직증축형 리모델링의 설계자는 국토교통부장관이 정하여 고시하는 구조기준에 맞게 구조설계도서를 작성하여야 한다.
  - no: '71'
    title: 리모델링 기본계획의 수립권자 및 대상지역 등
    text: "제71조(리모델링 기본계획의 수립권자 및 대상지역 등)\n① 특별시장ㆍ광역시장 및 대도시의 시장은 관할구역에 대하여 다음 각 호의 사항을 포함한 리모델링 기본계획을 10년 단위로 수립하여야 한다. 다만, 세대수 증가형 리모델링에 따른 도시과밀의 우려가 적은 경우 등 대통령령으로 정하는 경우에는 리모델링 기본계획을 수립하지 아니할 수 있다.\n1. 계획의 목표 및 기본방향\n2. 도시기본계획 등 관련 계획 검토\n3. 리모델링 대상 공동주택 현황 및 세대수 증가형 리모델링 수요 예측\n4. 세대수 증가에 따른 기반시설의 영향 검토\n5. 일시집중 방지 등을 위한 단계별 리모델링 시행방안\n6. 그 밖에 대통령령으로 정하는 사항\n② 대도시가 아닌 시의 시장은 세대수 증가형 리모델링에 따른 도시과밀이나 일시집중 등이 우려되어 도지사가 리모델링 기본계획의 수립이 필요하다고 인정한 경우 리모델링 기본계획을 수립하여야 한다.\n③ 리모델링 기본계획의 작성기준 및 작성방법 등은 국토교통부장관이 정한다."
  - no: '72'
    title: 리모델링 기본계획 수립절차
    text: "제72조(리모델링 기본계획 수립절차)\n① 특별시장ㆍ광역시장 및 대도시의 시장(제71조제2항에 따른 대도시가 아닌 시의 시장을 포함한다. 이하 이 조부터 제74조까지에서 같다)은 리모델링 기본계획을 수립하거나 변경하려면 14일 이상 주민에게 공람하고, 지방의회의 의견을 들어야 한다. 이 경우 지방의회는 의견제시를 요청받은 날부터 30일 이내에 의견을 제시하여야 하며, 30일 이내에 의견을 제시하지 아니하는 경우에는 이의가 없는 것으로 본다. 다만, 대통령령으로 정하는 경미한 변경인 경우에는 주민공람 및 지방의회 의견청취 절차를 거치지 아니할 수 있다.\n② 특별시장ㆍ광역시장 및 대도시의 시장은 리모델링 기본계획을 수립하거나 변경하려면 관계 행정기관의 장과 협의한 후 「국토의 계획 및 이용에 관한 법률」 제113조제1항에 따라 설치된 시ㆍ도도시계획위원회(이하 \"시ㆍ도도시계획위원회\"라 한다) 또는 시ㆍ군ㆍ구도시계획위원회의 심의를 거쳐야 한다.\n③ 제2항에 따라 협의를 요청받은 관계 행정기관의 장은 특별한 사유가 없으면 그 요청을 받은 날부터 30일 이내에 의견을 제시하여야 한다.\n④ 대도시의 시장은 리모델링 기본계획을 수립하거나 변경하려면 도지사의 승인을 받아야 하며, 도지사는 리모델링 기본계획을 승인하려면 시ㆍ도도시계획위원회의 심의를 거쳐야 한다."
  - no: '73'
    title: 리모델링 기본계획의 고시 등
    text: "제73조(리모델링 기본계획의 고시 등)\n① 특별시장ㆍ광역시장 및 대도시의 시장은 리모델링 기본계획을 수립하거나 변경한 때에는 이를 지체 없이 해당 지방자치단체의 공보에 고시하여야 한다.\n② 특별시장ㆍ광역시장 및 대도시의 시장은 5년마다 리모델링 기본계획의 타당성을 검토하여 그 결과를 리모델링 기본계획에 반영하여야 한다. <개정 2020.6.9>\n③ 그 밖에 주민공람 절차 등 리모델링 기본계획 수립에 필요한 사항은 대통령령으로 정한다."
  - no: '74'
    title: 세대수 증가형 리모델링의 시기 조정
    text: "제74조(세대수 증가형 리모델링의 시기 조정)\n① 국토교통부장관은 세대수 증가형 리모델링의 시행으로 주변 지역에 현저한 주택부족이나 주택시장의 불안정 등이 발생될 우려가 있는 때에는 주거정책심의위원회의 심의를 거쳐 특별시장, 광역시장, 대도시의 시장에게 리모델링 기본계획을 변경하도록 요청하거나, 시장ㆍ군수ㆍ구청장에게 세대수 증가형 리모델링의 사업계획 승인 또는 허가의 시기를 조정하도록 요청할 수 있으며, 요청을 받은 특별시장, 광역시장, 대도시의 시장 또는 시장ㆍ군수ㆍ구청장은 특별한 사유가 없으면 그 요청에 따라야 한다.\n② 시ㆍ도지사는 세대수 증가형 리모델링의 시행으로 주변 지역에 현저한 주택부족이나 주택시장의 불안정 등이 발생될 우려가 있는 때에는 「주거기본법」 제9조에 따른 시ㆍ도 주거정책심의위원회의 심의를 거쳐 대도시의 시장에게 리모델링 기본계획을 변경하도록 요청하거나, 시장ㆍ군수ㆍ구청장에게 세대수 증가형 리모델링의 사업계획 승인 또는 허가의 시기를 조정하도록 요청할 수 있으며, 요청을 받은 대도시의 시장 또는 시장ㆍ군수ㆍ구청장은 특별한 사유가 없으면 그 요청에 따라야 한다.\n③ 제1항 및 제2항에 따른 시기조정에 관한 방법 및 절차 등에 관하여 필요한 사항은 국토교통부령 또는 시ㆍ도의 조례로 정한다."
  - no: '75'
    title: 리모델링 지원센터의 설치ㆍ운영
    text: "제75조(리모델링 지원센터의 설치ㆍ운영)\n① 시ㆍ도지사, 시장ㆍ군수ㆍ구청장은 리모델링의 원활한 추진을 지원하기 위하여 리모델링 지원센터를 설치하여 운영할 수 있다. <개정 2026.9.8>\n② 리모델링 지원센터는 다음 각 호의 업무를 수행할 수 있다.\n1. 리모델링주택조합 설립을 위한 업무 지원\n2. 설계자 및 시공자 선정 등에 대한 지원\n3. 권리변동계획 수립에 관한 지원\n4. 그 밖에 지방자치단체의 조례로 정하는 사항\n③ 리모델링 지원센터의 조직, 인원 등 리모델링 지원센터의 설치ㆍ운영에 필요한 사항은 지방자치단체의 조례로 정한다."
  - no: '76'
    title: 공동주택 리모델링에 따른 특례
    text: "제76조(공동주택 리모델링에 따른 특례)\n① 공동주택의 소유자가 리모델링에 의하여 전유부분(「집합건물의 소유 및 관리에 관한 법률」 제2조제3호에 따른 전유부분을 말한다. 이하 이 조에서 같다)의 면적이 늘거나 줄어드는 경우에는 「집합건물의 소유 및 관리에 관한 법률」 제12조 및 제20조제1항에도 불구하고 대지사용권은 변하지 아니하는 것으로 본다. 다만, 세대수 증가를 수반하는 리모델링의 경우에는 권리변동계획에 따른다.\n② 공동주택의 소유자가 리모델링에 의하여 일부 공용부분(「집합건물의 소유 및 관리에 관한 법률」 제2조제4호에 따른 공용부분을 말한다. 이하 이 조에서 같다)의 면적을 전유부분의 면적으로 변경한 경우에는 「집합건물의 소유 및 관리에 관한 법률」 제12조에도 불구하고 그 소유자의 나머지 공용부분의 면적은 변하지 아니하는 것으로 본다.\n③ 제1항의 대지사용권 및 제2항의 공용부분의 면적에 관하여는 제1항과 제2항에도 불구하고 소유자가 「집합건물의 소유 및 관리에 관한 법률」 제28조에 따른 규약으로 달리 정한 경우에는 그 규약에 따른다.\n④ 임대차계약 당시 다음 각 호의 어느 하나에 해당하여 그 사실을 임차인에게 고지한 경우로서 제66조제1항 및 제2항에 따라 리모델링 허가를 받은 경우에는 해당 리모델링 건축물에 관한 임대차계약에 대하여 「주택임대차보호법」 제4조제1항 및 「상가건물 임대차보호법」 제9조제1항을 적용하지 아니한다.\n1. 임대차계약 당시 해당 건축물의 소유자들(입주자대표회의를 포함한다)이 제11조제1항에 따른 리모델링주택조합 설립인가를 받은 경우\n2. 임대차계약 당시 해당 건축물의 입주자대표회의가 직접 리모델링을 실시하기 위하여 제68조제1항에 따라 관할 시장ㆍ군수ㆍ구청장에게 안전진단을 요청한 경우\n⑤ 리모델링주택조합의 법인격에 관하여는 「도시 및 주거환경정비법」 제38조를 준용한다. 이 경우 \"정비사업조합\"은 \"리모델링주택조합\"으로 본다. <신설 2020.1.23>\n⑥ 이전고시ㆍ권리변동계획에 따라 소유권이 이전되는 토지 또는 건축물에 대한 권리의 확정ㆍ등기절차 등에 관하여는 「도시 및 주거환경정비법」 제86조, 제87조 및 제88조를 준용한다. 이 경우 \"사업시행자\"는 \"입주자ㆍ사용자ㆍ관리주체ㆍ입주자대표회의 또는 리모델링주택조합\"으로, \"제83조제3항 및 제4항에 따른 고시가 있은 때\"는 \"제66조제7항에 따라 사용검사를 받은 때\"로, \"관리처분계획\"은 \"권리변동계획\"으로, \"정비사업\"은 \"리모델링\"으로, \"준공인가\"는 \"사용검사\"로, \"시장ㆍ군수등\"은 \"시장ㆍ군수ㆍ구청장\"으로, \"토지등소유자에게 분양하는 대지 또는 건축물\"은 \"권리변동계획에 따라 구분소유자에게 소유권이 이전되는 토지 또는 건축물\"로, \"일반에게 분양하는 대지 또는 건축물\"은 \"권리변동계획에 따라 구분소유자 외의 자에게 소유권이 이전되는 토지 또는 건축물\"로 본다. <신설 2020.1.23, 2026.9.8>\n⑦ 공동주택의 소유자가 제11조제3항에 따라 결의하거나 리모델링주택조합의 총회 또는 입주자대표회의에서 의사를 결정하는 경우 대통령령으로 정하는 바에 따라 전자적 방법(「전자문서 및 전자거래 기본법」 제2조제2호에 따른 정보처리시스템을 사용하거나 그 밖에 정보통신기술을 이용하는 방법을 말한다)을 통하여 결의하거나 그 의사를 결정할 수 있다. <신설 2026.9.8>"
  - no: '77'
    title: 부정행위 금지
    text: "제77조(부정행위 금지) 공동주택의 리모델링과 관련하여 다음 각 호의 어느 하나에 해당하는 자는 부정하게 재물 또는 재산상의 이익을 취득하거나 제공하여서는 아니 된다.\n1. 입주자\n2. 사용자\n3. 관리주체\n4. 입주자대표회의 또는 그 구성원\n5. 리모델링주택조합 또는 그 구성원"
  - no: '78'
    title: 토지임대부 분양주택의 토지에 관한 임대차 관계
    text: "제78조(토지임대부 분양주택의 토지에 관한 임대차 관계)\n① 토지임대부 분양주택의 토지에 대한 임대차기간은 40년 이내로 한다. 이 경우 토지임대부 분양주택 소유자의 75퍼센트 이상이 계약갱신을 청구하는 경우 40년의 범위에서 이를 갱신할 수 있다.\n② 토지임대부 분양주택을 공급받은 자가 토지소유자와 임대차계약을 체결한 경우 해당 주택의 구분소유권을 목적으로 그 토지 위에 제1항에 따른 임대차기간 동안 지상권이 설정된 것으로 본다.\n③ 토지임대부 분양주택의 토지에 대한 임대차계약을 체결하고자 하는 자는 국토교통부령으로 정하는 표준임대차계약서를 사용하여야 한다.\n④ 토지임대부 분양주택을 양수한 자 또는 상속받은 자는 제1항에 따른 임대차계약을 승계한다.\n⑤ 토지임대부 분양주택의 토지임대료는 해당 토지의 조성원가 또는 감정가격 등을 기준으로 산정하되, 구체적인 토지임대료의 책정 및 변경기준, 납부 절차 등에 관한 사항은 대통령령으로 정한다.\n⑥ 제5항의 토지임대료는 월별 임대료를 원칙으로 하되, 토지소유자와 주택을 공급받은 자가 합의한 경우 대통령령으로 정하는 바에 따라 임대료를 선납하거나 보증금으로 전환하여 납부할 수 있다. <개정 2023.12.26>\n⑦ 제1항부터 제6항까지에서 정한 사항 외에 토지임대부 분양주택 토지의 임대차 관계는 토지소유자와 주택을 공급받은 자 간의 임대차계약에 따른다.\n⑧ 토지임대부 분양주택에 관하여 이 법에서 정하지 아니한 사항은 「집합건물의 소유 및 관리에 관한 법률」, 「민법」 순으로 적용한다."
  - no: 78의2
    title: 토지임대부 분양주택의 공공매입
    text: "제78조의2(토지임대부 분양주택의 공공매입)\n① 토지임대부 분양주택을 공급받은 자는 제64조제1항에도 불구하고 전매제한기간이 지나기 전에 대통령령으로 정하는 바에 따라 한국토지주택공사에 해당 주택의 매입을 신청할 수 있다. <개정 2023.12.26>\n② 한국토지주택공사는 제1항에 따라 매입신청을 받거나 제64조제1항을 위반하여 토지임대부 분양주택의 전매가 이루어진 경우 대통령령으로 정하는 특별한 사유가 없으면 대통령령으로 정하는 절차를 거쳐 해당 주택을 매입하여야 한다. <개정 2023.12.26>\n③ 한국토지주택공사가 제2항에 따라 주택을 매입하는 경우 다음 각 호의 구분에 따른 금액을 그 주택을 양도하는 자에게 지급한 때에는 그 지급한 날에 한국토지주택공사가 해당 주택을 취득한 것으로 본다. <개정 2023.12.26>\n1. 제1항에 따라 매입신청을 받은 경우: 해당 주택의 매입비용과 보유기간 등을 고려하여 대통령령으로 정하는 금액\n2. 제64조제1항을 위반하여 전매가 이루어진 경우: 해당 주택의 매입비용\n④ 한국토지주택공사가 제2항에 따라 주택을 매입하는 경우에는 제64조제1항을 적용하지 아니한다. <신설 2023.12.26>"
  - no: '79'
    title: 토지임대부 분양주택의 재건축
    text: "제79조(토지임대부 분양주택의 재건축)\n① 토지임대부 분양주택의 소유자가 제78조제1항에 따른 임대차기간이 만료되기 전에 「도시 및 주거환경정비법」 등 도시개발 관련 법률에 따라 해당 주택을 철거하고 재건축을 하고자 하는 경우 「집합건물의 소유 및 관리에 관한 법률」 제47조부터 제49조까지에 따라 토지소유자의 동의를 받아 재건축할 수 있다. 이 경우 토지소유자는 정당한 사유 없이 이를 거부할 수 없다.\n② 제1항에 따라 토지임대부 분양주택을 재건축하는 경우 해당 주택의 소유자를 「도시 및 주거환경정비법」 제2조제9호나목에 따른 토지등소유자로 본다.\n③ 제1항에 따라 재건축한 주택은 토지임대부 분양주택으로 한다. 이 경우 재건축한 주택의 준공인가일부터 제78조제1항에 따른 임대차기간 동안 토지소유자와 재건축한 주택의 조합원 사이에 토지의 임대차기간에 관한 계약이 성립된 것으로 본다.\n④ 제3항에도 불구하고 토지소유자와 주택소유자가 합의한 경우에는 토지임대부 분양주택이 아닌 주택으로 전환할 수 있다."
  - no: '80'
    title: 주택상환사채의 발행
    text: "제80조(주택상환사채의 발행)\n① 한국토지주택공사와 등록사업자는 대통령령으로 정하는 바에 따라 주택으로 상환하는 사채(이하 \"주택상환사채\"라 한다)를 발행할 수 있다. 이 경우 등록사업자는 자본금ㆍ자산평가액 및 기술인력 등이 대통령령으로 정하는 기준에 맞고 금융기관 또는 주택도시보증공사의 보증을 받은 경우에만 주택상환사채를 발행할 수 있다.\n② 주택상환사채를 발행하려는 자는 대통령령으로 정하는 바에 따라 주택상환사채발행계획을 수립하여 국토교통부장관의 승인을 받아야 한다.\n③ 주택상환사채의 발행요건 및 상환기간 등은 대통령령으로 정한다."
  - no: '81'
    title: 발행책임과 조건 등
    text: "제81조(발행책임과 조건 등)\n① 제80조에 따라 주택상환사채를 발행한 자는 발행조건에 따라 주택을 건설하여 사채권자에게 상환하여야 한다.\n② 주택상환사채는 기명증권(記名證券)으로 하고, 사채권자의 명의변경은 취득자의 성명과 주소를 사채원부에 기록하는 방법으로 하며, 취득자의 성명을 채권에 기록하지 아니하면 사채발행자 및 제3자에게 대항할 수 없다.\n③ 국토교통부장관은 사채의 납입금이 택지의 구입 등 사채발행 목적에 맞게 사용될 수 있도록 그 사용 방법ㆍ절차 등에 관하여 대통령령으로 정하는 바에 따라 필요한 조치를 하여야 한다."
  - no: '82'
    title: 주택상환사채의 효력
    text: 제82조(주택상환사채의 효력) 제8조에 따라 등록사업자의 등록이 말소된 경우에도 등록사업자가 발행한 주택상환사채의 효력에는 영향을 미치지 아니한다.
  - no: '83'
    title: 「상법」의 적용
    text: 제83조(「상법」의 적용) 주택상환사채의 발행에 관하여 이 법에서 규정한 것 외에는 「상법」 중 사채발행에 관한 규정을 적용한다. 다만, 한국토지주택공사가 발행하는 경우와 금융기관 등이 상환을 보증하여 등록사업자가 발행하는 경우에는 「상법」 제478조제1항을 적용하지 아니한다.
  - no: '84'
    title: 국민주택사업특별회계의 설치 등
    text: "제84조(국민주택사업특별회계의 설치 등)\n① 지방자치단체는 국민주택사업을 시행하기 위하여 국민주택사업특별회계를 설치ㆍ운용하여야 한다.\n② 제1항의 국민주택사업특별회계의 자금은 다음 각 호의 재원으로 조성한다.\n1. 자체 부담금\n2. 주택도시기금으로부터의 차입금\n3. 정부로부터의 보조금\n4. 농협은행으로부터의 차입금\n5. 외국으로부터의 차입금\n6. 국민주택사업특별회계에 속하는 재산의 매각 대금\n7. 국민주택사업특별회계자금의 회수금ㆍ이자수입금 및 그 밖의 수익\n8. 「재건축초과이익 환수에 관한 법률」에 따른 재건축부담금 중 지방자치단체 귀속분\n③ 지방자치단체는 대통령령으로 정하는 바에 따라 국민주택사업특별회계의 운용 상황을 국토교통부장관에게 보고하여야 한다."
  - no: '85'
    title: 협회의 설립 등
    text: "제85조(협회의 설립 등)\n① 등록사업자는 주택건설사업 및 대지조성사업의 전문화와 주택산업의 건전한 발전을 도모하기 위하여 주택사업자단체를 설립할 수 있다.\n② 제1항에 따른 단체(이하 \"협회\"라 한다)는 법인으로 한다.\n③ 협회는 그 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다.\n④ 이 법에 따라 국토교통부장관, 시ㆍ도지사 또는 대도시의 시장으로부터 영업의 정지처분을 받은 협회 회원의 권리ㆍ의무는 그 영업의 정지기간 중에는 정지되며, 등록사업자의 등록이 말소되거나 취소된 때에는 협회의 회원자격을 상실한다."
  - no: '86'
    title: 협회의 설립인가 등
    text: "제86조(협회의 설립인가 등)\n① 협회를 설립하려면 회원자격을 가진 자 50인 이상을 발기인으로 하여 정관을 마련한 후 창립총회의 의결을 거쳐 국토교통부장관의 인가를 받아야 한다. 협회가 정관을 변경하려는 경우에도 또한 같다.\n② 국토교통부장관은 제1항에 따른 인가를 하였을 때에는 이를 지체 없이 공고하여야 한다."
  - no: '87'
    title: 「민법」의 준용
    text: 제87조(「민법」의 준용) 협회에 관하여 이 법에서 규정한 것 외에는 「민법」 중 사단법인에 관한 규정을 준용한다.
  - no: '88'
    title: 주택정책 관련 자료 등의 종합관리
    text: "제88조(주택정책 관련 자료 등의 종합관리)\n① 국토교통부장관 또는 시ㆍ도지사는 적절한 주택정책의 수립 및 시행을 위하여 주택(준주택을 포함한다. 이하 이 조에서 같다)의 건설ㆍ공급ㆍ관리 및 이와 관련된 자금의 조달, 주택가격 동향 등 이 법에 규정된 주택과 관련된 사항에 관한 정보를 종합적으로 관리하고 이를 관련 기관ㆍ단체 등에 제공할 수 있다.\n② 국토교통부장관 또는 시ㆍ도지사는 제1항에 따른 주택 관련 정보를 종합관리하기 위하여 필요한 자료를 관련 기관ㆍ단체 등에 요청할 수 있다. 이 경우 관계 행정기관 등은 특별한 사유가 없으면 요청에 따라야 한다.\n③ 사업주체 또는 관리주체는 주택을 건설ㆍ공급ㆍ관리할 때 이 법과 이 법에 따른 명령에 따라 필요한 주택의 소유 여부 확인, 입주자의 자격 확인 등 대통령령으로 정하는 사항에 대하여 관련 기관ㆍ단체 등에 자료 제공 또는 확인을 요청할 수 있다."
  - no: '89'
    title: 권한의 위임ㆍ위탁
    text: "제89조(권한의 위임ㆍ위탁)\n① 이 법에 따른 국토교통부장관의 권한은 대통령령으로 정하는 바에 따라 그 일부를 시ㆍ도지사 또는 국토교통부 소속 기관의 장에게 위임할 수 있다.\n② 국토교통부장관 또는 지방자치단체의 장은 이 법에 따른 권한 중 다음 각 호의 권한을 대통령령으로 정하는 바에 따라 주택산업 육성과 주택관리의 전문화, 시설물의 안전관리 및 자격검정 등을 목적으로 설립된 법인 또는 「주택도시기금법」 제10조제2항 및 제3항에 따라 주택도시기금 운용ㆍ관리에 관한 사무를 위탁받은 자 중 국토교통부장관 또는 지방자치단체의 장이 인정하는 자에게 위탁할 수 있다.\n1. 제4조에 따른 주택건설사업 등의 등록\n2. 제10조에 따른 영업실적 등의 접수\n3. 제48조제3항에 따른 부실감리자 현황에 대한 종합관리\n4. 제88조에 따른 주택정책 관련 자료의 종합관리\n③ 국토교통부장관은 제55조제1항 및 제2항에 따른 관계 기관의 장에 대한 자료제공 요청에 관한 사무를 보건복지부장관 또는 지방자치단체의 장에게 위탁할 수 있다.\n④ 국토교통부장관은 다음 각 호의 사무를 제56조의2에 따라 지정ㆍ고시된 주택청약업무수행기관에 위탁할 수 있다. <신설 2020.1.23>\n1. 제55조제1항에 따른 주민등록 전산정보 및 주택의 소유 여부 확인을 위한 자료의 제공 요청\n2. 제56조에 따른 입주자저축정보의 제공 요청\n3. 제1호 및 제2호에 따라 제공받은 자료 또는 정보를 활용한 입주자자격, 주택의 소유 여부, 재당첨 제한 여부, 공급 순위 등의 확인 및 해당 정보의 제공"
  - no: '90'
    title: 등록증의 대여 등 금지
    text: "제90조(등록증의 대여 등 금지)\n① 등록사업자는 다른 사람에게 자기의 성명 또는 상호를 사용하여 이 법에서 정한 사업이나 업무를 수행 또는 시공하게 하거나 그 등록증을 대여하여서는 아니 된다. <개정 2024.1.16>\n② 누구든지 등록사업자로부터 그 성명이나 상호를 빌리거나 허락 없이 등록사업자의 성명 또는 상호로 이 법에서 정한 사업이나 업무를 수행 또는 시공하거나 그 등록증을 빌려서는 아니 된다. <신설 2024.1.16>\n③ 누구든지 제1항 및 제2항에서 금지된 행위를 알선하여서는 아니 된다. <신설 2024.1.16>\n④ 등록사업자, 제2조제11호에 따른 주택조합의 임원(발기인을 포함한다) 및 제11조의2에 따른 업무대행자는 이 법에서 정한 사업이나 업무를 수행 또는 시공하기 위하여 제2항의 행위를 교사하거나 방조하여서는 아니 된다. <신설 2024.1.16>"
  - no: '91'
    title: 체납된 분양대금 등의 강제징수
    text: "제91조(체납된 분양대금 등의 강제징수)\n① 국가 또는 지방자치단체인 사업주체가 건설한 국민주택의 분양대금ㆍ임대보증금 및 임대료가 체납된 경우에는 국가 또는 지방자치단체가 국세 또는 지방세 체납처분의 예에 따라 강제징수할 수 있다. 다만, 입주자가 장기간의 질병이나 그 밖의 부득이한 사유로 분양대금ㆍ임대보증금 및 임대료를 체납한 경우에는 강제징수하지 아니할 수 있다.\n② 한국토지주택공사 또는 지방공사는 그가 건설한 국민주택의 분양대금ㆍ임대보증금 및 임대료가 체납된 경우에는 주택의 소재지를 관할하는 시장ㆍ군수ㆍ구청장에게 그 징수를 위탁할 수 있다.\n③ 제2항에 따라 징수를 위탁받은 시장ㆍ군수ㆍ구청장은 지방세 체납처분의 예에 따라 이를 징수하여야 한다. 이 경우 한국토지주택공사 또는 지방공사는 시장ㆍ군수ㆍ구청장이 징수한 금액의 2퍼센트에 해당하는 금액을 해당 시ㆍ군ㆍ구에 위탁수수료로 지급하여야 한다."
  - no: '92'
    title: 분양권 전매 등에 대한 신고포상금
    text: 제92조(분양권 전매 등에 대한 신고포상금) 시ㆍ도지사는 제64조를 위반하여 분양권 등을 전매하거나 알선하는 자를 주무관청에 신고한 자에게 대통령령으로 정하는 바에 따라 포상금을 지급할 수 있다.
  - no: '93'
    title: 보고ㆍ검사 등
    text: "제93조(보고ㆍ검사 등)\n① 국토교통부장관 또는 지방자치단체의 장은 필요하다고 인정할 때에는 다음 각 호의 어느 하나에 해당하는 자에게 필요한 보고를 하게 하거나, 관계 공무원으로 하여금 사업장에 출입하여 필요한 검사를 하게 할 수 있다. 다만, 제2조제24호에 따른 공공택지를 공급하기 위하여 한국토지주택공사등(제4조제1항제1호부터 제4호까지에 해당하는 자를 말한다)이 제4조제2항에 따른 등록기준 관련 검사를 요청하는 경우 요청받은 지방자치단체의 장은 검사요청을 받은 날부터 30일 이내에 검사결과를 통보하여야 한다. <개정 2024.1.16>\n1. 이 법에 따른 신고ㆍ인가ㆍ승인 또는 등록을 한 자\n2. 관할구역에서 공공택지를 공급받은 자(제4조제1항 단서에 해당하는 자는 제외한다)\n② 제1항에 따른 검사를 할 때에는 검사 7일 전까지 검사 일시, 검사 이유 및 검사 내용 등 검사계획을 검사를 받을 자에게 알려야 한다. 다만, 긴급한 경우나 사전에 통지하면 증거인멸 등으로 검사 목적을 달성할 수 없다고 인정하는 경우에는 그러하지 아니하다.\n③ 제1항에 따라 검사를 하는 공무원은 그 권한을 나타내는 증표를 지니고 이를 관계인에게 내보여야 한다.\n④ 제1항에 따른 보고ㆍ검사 등에서 제8조에 따른 조치가 필요하다고 판단되는 다른 지방자치단체 등록사업자가 있는 경우 관할 시ㆍ도지사에게 통보하여야 한다. <신설 2024.1.16>"
  - no: 93의2
    title: 보고ㆍ검사 등에 따른 자료요청
    text: "제93조의2(보고ㆍ검사 등에 따른 자료요청)\n① 국토교통부장관 또는 지방자치단체의 장은 제93조에 따른 보고ㆍ검사 등에 필요한 자료로서 기술인력에 해당하는 자의 고용보험, 국민연금보험, 국민건강보험, 산업재해보상보험, 건설근로자 퇴직공제 및 경력증명, 사업자등록증명, 소득금액증명, 법인등기임원에 관한 자료를 관계 기관의 장에게 요청할 수 있다. 이 경우 자료의 제공을 요청받은 관계 기관의 장은 특별한 사유가 없으면 이에 따라야 한다.\n② 국토교통부장관 또는 지방자치단체의 장은 제1항의 자료를 확인하기 위하여 필요하면 「전자정부법」 제36조제1항에 따라 행정정보를 공동이용할 수 있다."
  - no: '94'
    title: 사업주체 등에 대한 지도ㆍ감독
    text: 제94조(사업주체 등에 대한 지도ㆍ감독) 국토교통부장관 또는 지방자치단체의 장은 사업주체 및 공동주택의 입주자ㆍ사용자ㆍ관리주체ㆍ입주자대표회의나 그 구성원 또는 리모델링주택조합이 이 법 또는 이 법에 따른 명령이나 처분을 위반한 경우에는 공사의 중지, 원상복구 또는 그 밖에 필요한 조치를 명할 수 있다.
  - no: '95'
    title: 협회 등에 대한 지도ㆍ감독
    text: 제95조(협회 등에 대한 지도ㆍ감독) 국토교통부장관은 협회를 지도ㆍ감독한다.
  - no: '96'
    title: 청문
    text: "제96조(청문) 국토교통부장관 또는 지방자치단체의 장은 다음 각 호의 어느 하나에 해당하는 처분을 하려면 청문을 하여야 한다. <개정 2021.1.5, 2026.9.8>\n1. 제8조제1항에 따른 주택건설사업 등의 등록말소\n2. 제14조제2항 또는 제14조의2제5항에 따른 주택조합의 설립인가취소\n3. 제16조제4항에 따른 사업계획승인의 취소\n4. 제66조제8항에 따른 리모델링 허가의 취소"
  - no: '97'
    title: 벌칙 적용에서 공무원 의제
    text: "제97조(벌칙 적용에서 공무원 의제) 다음 각 호의 어느 하나에 해당하는 자는 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다. <개정 2020.1.23, 2026.9.8>\n1. 제14조의5에 따라 공사비 검증을 요청받은 한국부동산원, 한국토지주택공사 또는 지방공사의 임직원\n2. 제44조 및 제45조에 따라 감리업무를 수행하는 자\n3. 제48조의3제1항에 따른 품질점검단의 위원 중 공무원이 아닌 자\n4. 제59조에 따른 분양가심사위원회의 위원 중 공무원이 아닌 자"
  - no: '98'
    title: 벌칙
    text: "제98조(벌칙)\n① 제33조, 제43조, 제44조(같은 조 제1항제4호의2는 제외한다), 제46조 또는 제70조를 위반하여 설계ㆍ시공 또는 감리를 함으로써 「공동주택관리법」 제36조제3항에 따른 담보책임기간에 공동주택의 내력구조부에 중대한 하자를 발생시켜 일반인을 위험에 처하게 한 설계자ㆍ시공자ㆍ감리자ㆍ건축구조기술사 또는 사업주체는 10년 이하의 징역에 처한다. <개정 2017.4.18, 2024.1.16>\n② 제1항의 죄를 범하여 사람을 죽음에 이르게 하거나 다치게 한 자는 무기징역 또는 3년 이상의 징역에 처한다."
  - no: '99'
    title: 벌칙
    text: "제99조(벌칙)\n① 업무상 과실로 제98조제1항의 죄를 범한 자는 5년 이하의 징역이나 금고 또는 5천만원 이하의 벌금에 처한다.\n② 업무상 과실로 제98조제2항의 죄를 범한 자는 10년 이하의 징역이나 금고 또는 1억원 이하의 벌금에 처한다."
  - no: '100'
    title: 벌칙
    text: 제100조(벌칙) 제55조제5항, 제56조제10항 및 제57조의3제4항을 위반하여 정보 또는 자료를 사용ㆍ제공 또는 누설한 사람은 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2018.12.18, 2020.1.23, 2020.8.18>
  - no: '101'
    title: 벌칙
    text: "제101조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. 다만, 제2호 및 제3호에 해당하는 자로서 그 위반행위로 얻은 이익의 3배에 해당하는 금액이 3천만원을 초과하는 자는 3년 이하의 징역 또는 그 이익의 3배에 해당하는 금액 이하의 벌금에 처한다. <개정 2016.12.2, 2018.12.18, 2020.1.23, 2020.8.18, 2024.3.19, 2026.9.8>\n1. 제11조의2제1항 또는 제7항을 위반하여 조합업무를 대행하게 한 주택조합, 주택조합의 발기인 및 조합업무를 대행한 자\n1의2. 고의로 제33조를 위반하여 설계하거나 시공함으로써 사업주체 또는 입주자에게 손해를 입힌 자\n1의3. 제57조의2제2항 또는 제7항을 위반하여 거주의무를 이행하지 아니하고 해당 주택을 양도한 자\n2. 제64조제1항을 위반하여 주택을 전매하거나 이의 전매를 알선한 자\n3. 제65조제1항을 위반한 자\n4. 제66조제3항을 위반하여 리모델링주택조합이 설립인가를 받기 전에 또는 입주자대표회의가 소유자 전원의 동의를 받기 전에 시공자를 선정한 자 및 시공자로 선정된 자\n5. 제66조제4항을 위반하여 경쟁입찰의 방법에 의하지 아니하고 시공자를 선정한 자 및 시공자로 선정된 자"
  - no: '102'
    title: 벌칙
    text: "제102조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. 다만, 제5호 또는 제18호에 해당하는 자로서 그 위반행위로 얻은 이익의 50퍼센트에 해당하는 금액이 2천만원을 초과하는 자는 2년 이하의 징역 또는 그 이익의 2배에 해당하는 금액 이하의 벌금에 처한다. <개정 2016.12.2, 2018.12.18, 2019.4.23, 2019.12.10, 2020.1.23, 2024.1.16, 2026.9.8>\n1. 제4조에 따른 등록을 하지 아니하거나, 거짓이나 그 밖의 부정한 방법으로 등록을 하고 같은 조의 사업을 한 자\n2. 제11조의3제1항을 위반하여 신고하지 아니하고 조합원을 모집하거나 조합원을 공개로 모집하지 아니한 자\n2의2. 제11조의5를 위반하여 조합원 가입을 권유하거나 조합원을 모집하는 광고를 한 자\n2의3. 제11조의6제1항을 위반하여 가입비등을 예치하도록 하지 아니한 자\n2의4. 제11조의6제4항을 위반하여 가입비등의 반환을 요청하지 아니한 자\n3. 제12조제2항에 따른 서류 및 관련 자료를 거짓으로 공개한 주택조합의 발기인 또는 임원\n4. 제12조제3항에 따른 열람ㆍ복사 요청에 대하여 거짓의 사실이 포함된 자료를 열람ㆍ복사하여 준 주택조합의 발기인 또는 임원\n4의2. 제12조의2에 따른 총회의 의결을 거치지 아니하고 사업비 증액을 임의로 추진한 조합임원\n4의3. 제14조의5제4항에 따른 조합총회의 의결 또는 주민투표를 거치지 아니하고 공사비 증액 계약을 체결한 조합임원 또는 입주자대표\n5. 제15조제1항ㆍ제3항 또는 제4항에 따른 사업계획의 승인 또는 변경승인을 받지 아니하고 사업을 시행하는 자\n6. 삭제<2018.12.18>\n6의2. 과실로 제33조를 위반하여 설계하거나 시공함으로써 사업주체 또는 입주자에게 손해를 입힌 자\n7. 제34조제1항 또는 제2항을 위반하여 주택건설공사를 시행하거나 시행하게 한 자\n8. 제35조에 따른 주택건설기준등을 위반하여 사업을 시행한 자\n9. 제39조를 위반하여 공동주택성능에 대한 등급을 표시하지 아니하거나 거짓으로 표시한 자\n10. 제40조에 따른 환기시설을 설치하지 아니한 자\n11. 고의로 제44조제1항(같은 항 제4호의2는 제외한다)에 따른 감리업무를 게을리하여 위법한 주택건설공사를 시공함으로써 사업주체 또는 입주자에게 손해를 입힌 자\n12. 제49조제4항을 위반하여 주택 또는 대지를 사용하게 하거나 사용한 자(제66조제7항에 따라 준용되는 경우를 포함한다)\n13. 제54조제1항을 위반하여 주택을 건설ㆍ공급한 자(제54조의2에 따라 주택의 공급업무를 대행한 자를 포함한다)\n14. 제54조제3항을 위반하여 건축물을 건설ㆍ공급한 자\n14의2. 제54조의2제2항을 위반하여 주택의 공급업무를 대행하게 한 자\n15. 제57조제1항 또는 제5항을 위반하여 주택을 공급한 자\n16. 제60조제1항 또는 제3항을 위반하여 견본주택을 건설하거나 유지관리한 자\n17. 제61조제1항을 위반하여 같은 항 각 호의 어느 하나에 해당하는 행위를 한 자\n18. 제77조를 위반하여 부정하게 재물 또는 재산상의 이익을 취득하거나 제공한 자\n19. 제81조제3항에 따른 조치를 위반한 자"
  - no: '103'
    title: 벌칙
    text: 제103조(벌칙) 제59조제4항을 위반하여 고의로 잘못된 심사를 한 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 2018.12.18>
  - no: '104'
    title: 벌칙
    text: "제104조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 2019.12.10, 2020.1.23, 2020.6.9, 2020.8.18, 2024.1.16, 2026.2.3, 2026.9.8>\n1. 제8조에 따른 영업정지기간에 영업을 한 자\n1의2. 제11조의2제4항을 위반하여 실적보고서를 제출하지 아니한 업무대행자\n1의3. 제12조제1항을 위반하여 실적보고서를 작성하지 아니하거나 제12조제1항 각 호의 사항을 포함하지 않고 작성한 주택조합의 발기인 또는 임원\n2. 제12조제2항을 위반하여 주택조합사업의 시행에 관련한 서류 및 자료를 공개하지 아니한 주택조합의 발기인 또는 임원\n3. 제12조제3항을 위반하여 조합원의 열람ㆍ복사 요청을 따르지 아니한 주택조합의 발기인 또는 임원\n4. 삭제<2020.1.23>\n4의2. 제14조제4항 또는 제5항에 따른 시정요구 등의 명령을 위반한 자\n4의3. 제14조의2제6항을 위반하여 총회의 개최를 통지하지 아니한 자\n4의4. 제14조의3제1항에 따른 회계감사를 받지 아니한 자\n4의5. 제14조의3제2항을 위반하여 장부 및 증빙서류를 작성 또는 보관하지 아니하거나 거짓으로 작성한 자\n4의6. 제14조의5제3항을 위반하여 공사비 검증결과를 조합원 또는 공동주택 소유자에게 공개하지 아니한 조합임원 또는 입주자대표\n5. 삭제<2018.12.18>\n6. 과실로 제44조제1항(같은 항 제4호의2는 제외한다)에 따른 감리업무를 게을리하여 위법한 주택건설공사를 시공함으로써 사업주체 또는 입주자에게 손해를 입힌 자\n7. 제44조제4항을 위반하여 시정 통지를 받고도 계속하여 주택건설공사를 시공한 시공자 및 사업주체\n8. 제46조제1항 또는 제2항에 따른 건축구조기술사의 협력, 제68조제5항에 따른 안전진단기준, 제69조제3항에 따른 검토기준 또는 제70조에 따른 구조기준을 위반하여 사업주체, 입주자 또는 사용자에게 손해를 입힌 자\n9. 제48조제2항에 따른 시정명령에도 불구하고 필요한 조치를 하지 아니하고 감리를 한 자\n10. 제57조의2제1항 및 제7항을 위반하여 거주의무기간 중에 실제로 거주하지 아니하고 거주한 것으로 속인 자\n11. 제66조제1항 및 제2항을 위반한 자\n12. 제90조제1항을 위반하여 등록증의 대여 등을 한 자\n12의2. 제90조제2항을 위반하여 등록사업자의 성명이나 상호를 빌리거나 허락 없이 등록사업자의 성명이나 상호로 이 법에서 정한 사업이나 업무를 수행 또는 시공하거나 등록증을 빌린 자\n12의3. 제90조제3항을 위반하여 알선한 자\n12의4. 제90조제4항을 위반하여 같은 조 제2항의 행위를 교사하거나 방조한 자\n13. 제93조제1항에 따른 검사 등을 거부ㆍ방해 또는 기피한 자\n14. 제94조에 따른 공사 중지 등의 명령을 위반한 자"
  - no: '105'
    title: 양벌규정
    text: "제105조(양벌규정)\n① 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제98조의 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 10억원 이하의 벌금에 처한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.\n② 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제99조, 제101조, 제102조 및 제104조의 어느 하나에 해당하는 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다."
  - no: '106'
    title: 과태료
    text: "제106조(과태료)\n① 다음 각 호의 어느 하나에 해당하는 자에게는 2천만원 이하의 과태료를 부과한다. <개정 2020.1.23>\n1. 제48조의2제1항을 위반하여 사전방문을 실시하게 하지 아니한 자\n2. 제48조의3제3항을 위반하여 점검에 따르지 아니하거나 기피 또는 방해한 자\n3. 제78조제3항에 따른 표준임대차계약서를 사용하지 아니하거나 표준임대차계약서의 내용을 이행하지 아니한 자\n4. 제78조제5항에 따른 임대료에 관한 기준을 위반하여 토지를 임대한 자\n② 다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다. <개정 2016.12.2, 2019.4.23, 2020.1.23, 2021.4.13, 2026.2.3>\n1. 제11조의2제3항을 위반하여 자금의 보관 업무를 대행하도록 하지 아니한 자\n2. 제11조의3제8항에 따른 주택조합 가입에 관한 계약서 작성 의무를 위반한 자\n3. 제11조의4제1항에 따른 설명의무 또는 같은 조 제2항에 따른 확인 및 교부, 보관 의무를 위반한 자\n4. 제13조제4항을 위반하여 겸직한 자\n5. 제46조제1항 또는 제2항을 위반하여 건축구조기술사의 협력을 받지 아니한 자\n5의2. 제49조제5항에 따른 현장점검 요청에 따르지 아니한 자\n6. 제54조의2제3항에 따른 조치를 하지 아니한 자\n③ 다음 각 호의 어느 하나에 해당하는 자에게는 500만원 이하의 과태료를 부과한다. <개정 2019.12.10, 2020.1.23, 2021.8.10, 2024.1.16>\n1. 제12조제4항에 따른 서류 및 자료를 제출하지 아니한 주택조합의 발기인 또는 임원\n2. 제16조제2항에 따른 신고를 하지 아니한 자\n2의2. 제41조의2제8항을 위반하여 성능검사 결과 또는 조치결과를 입주예정자에게 알리지 아니하거나 거짓으로 알린 자\n2의3. 제44조제1항제4호의2에 따른 시공자격 여부의 확인을 하지 아니한 감리자\n3. 제44조제2항에 따른 보고를 하지 아니하거나 거짓으로 보고를 한 감리자\n3의2. 제44조제3항에 따른 보고를 하지 아니하거나 거짓으로 보고를 한 감리자\n4. 제45조제2항에 따른 보고를 하지 아니하거나 거짓으로 보고를 한 감리자\n4의2. 제48조의2제3항을 위반하여 보수공사 등의 조치를 하지 아니한 자\n4의3. 제48조의2제5항을 위반하여 조치결과 등을 입주예정자 및 사용검사권자에게 알리지 아니한 자\n4의4. 제48조의3제4항 후단을 위반하여 자료제출 요구에 따르지 아니하거나 거짓으로 자료를 제출한 자\n4의5. 제48조의3제7항을 위반하여 조치명령을 이행하지 아니한 자\n5. 제54조제2항을 위반하여 주택을 공급받은 자\n6. 제54조제8항을 위반하여 같은 항에 따른 사본을 제출하지 아니하거나 거짓으로 제출한 자\n7. 제93조제1항에 따른 보고 또는 검사의 명령을 위반한 자\n④ 다음 각 호의 어느 하나에 해당하는 자에게는 300만원 이하의 과태료를 부과한다. <개정 2021.4.13, 2024.3.19>\n1. 제57조의2제2항 및 제8항을 위반하여 한국토지주택공사에 해당 주택의 매입을 신청하지 아니한 자\n2. 제57조의3제1항에 따른 서류 등의 제출을 거부하거나 해당 주택의 출입ㆍ조사 또는 질문을 방해하거나 기피한 자\n⑤ 제1항부터 제4항까지에 따른 과태료는 대통령령으로 정하는 바에 따라 국토교통부장관 또는 지방자치단체의 장이 부과한다. <개정 2020.8.18>"
