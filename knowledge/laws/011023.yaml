  - no: '39'
    title: 측량기술자
    text: "제39조(측량기술자)\n① 이 법에서 정하는 측량은 측량기술자가 아니면 할 수 없다. <개정 2020.2.18>\n② 측량기술자는 다음 각 호의 어느 하나에 해당하는 자로서 대통령령으로 정하는 자격기준에 해당하는 자이어야 하며, 대통령령으로 정하는 바에 따라 그 등급을 나눌 수 있다.\n1. 「국가기술자격법」에 따른 측량 및 지형공간정보, 지적, 측량, 지도 제작, 도화(圖畵) 또는 항공사진 분야의 기술자격 취득자\n2. 측량, 지형공간정보, 지적, 지도 제작, 도화 또는 항공사진 분야의 일정한 학력 또는 경력을 가진 자\n③ 측량기술자는 전문분야를 측량분야와 지적분야로 구분한다. <신설 2013.7.17>"
  - no: '40'
    title: 측량기술자의 신고 등
    text: "제40조(측량기술자의 신고 등)\n① 측량업무에 종사하는 측량기술자(「건설기술 진흥법」 제2조제8호에 따른 건설기술인인 측량기술자와 「기술사법」 제2조에 따른 기술사는 제외한다. 이하 이 조에서 같다)는 국토교통부령으로 정하는 바에 따라 근무처ㆍ경력ㆍ학력 및 자격 등(이하 \"근무처 및 경력등\"이라 한다)을 관리하는 데에 필요한 사항을 국토교통부장관에게 신고할 수 있다. 신고사항의 변경이 있는 경우에도 같다. <개정 2013.3.23, 2013.5.22, 2018.8.14, 2020.2.18>\n② 국토교통부장관은 제1항에 따른 신고를 받았으면 측량기술자의 근무처 및 경력등에 관한 기록을 유지ㆍ관리하여야 한다. <개정 2013.3.23, 2020.2.18>\n③ 국토교통부장관은 측량기술자가 신청하면 근무처 및 경력등에 관한 증명서(이하 \"측량기술경력증\"이라 한다)를 발급할 수 있다. <개정 2013.3.23, 2020.2.18>\n④ 국토교통부장관은 제1항에 따라 신고를 받은 내용을 확인하기 위하여 필요한 경우에는 중앙행정기관, 지방자치단체, 「초ㆍ중등교육법」 제2조 및 「고등교육법」 제2조의 학교, 신고를 한 측량기술자가 소속된 측량 관련 업체 등 관련 기관의 장에게 관련 자료를 제출하도록 요청할 수 있다. 이 경우 그 요청을 받은 기관의 장은 특별한 사유가 없으면 요청에 따라야 한다. <개정 2013.3.23, 2020.2.18>\n⑤ 이 법이나 그 밖의 관계 법률에 따른 인가ㆍ허가ㆍ등록ㆍ면허 등을 하려는 행정기관의 장은 측량기술자의 근무처 및 경력등을 확인할 필요가 있는 경우에는 국토교통부장관의 확인을 받아야 한다. <개정 2013.3.23, 2020.2.18>\n⑥ 제1항에 따른 신고가 신고서의 기재사항 및 구비서류에 흠이 없고, 관계 법령 등에 규정된 형식상의 요건을 충족하는 경우에는 신고서가 접수기관에 도달된 때에 신고된 것으로 본다. <신설 2017.10.24>\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 측량기술자의 신고, 기록의 유지ㆍ관리, 측량기술경력증의 발급 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23, 2017.10.24, 2020.2.18>"
  - no: '41'
    title: 측량기술자의 의무
    text: "제41조(측량기술자의 의무)\n① 측량기술자는 신의와 성실로써 공정하게 측량을 하여야 하며, 정당한 사유 없이 측량을 거부하여서는 아니 된다.\n② 측량기술자는 정당한 사유 없이 그 업무상 알게 된 비밀을 누설하여서는 아니 된다.\n③ 측량기술자는 둘 이상의 측량업자에게 소속될 수 없다.\n④ 측량기술자는 다른 사람에게 측량기술경력증을 빌려 주거나 자기의 성명을 사용하여 측량업무를 수행하게 하여서는 아니 된다."
  - no: '42'
    title: 측량기술자의 업무정지 등
    text: "제42조(측량기술자의 업무정지 등)\n① 국토교통부장관은 측량기술자 (「건설기술 진흥법」 제2조제8호에 따른 건설기술인인 측량기술자는 제외한다)가 다음 각 호의 어느 하나에 해당하는 경우에는 1년(지적기술자의 경우에는 2년) 이내의 기간을 정하여 측량업무의 수행을 정지시킬 수 있다. 이 경우 지적기술자에 대하여는 대통령령으로 정하는 바에 따라 중앙지적위원회의 심의ㆍ의결을 거쳐야 한다. <개정 2013.3.23, 2013.5.22, 2013.7.17, 2018.8.14, 2020.2.18>\n1. 제40조제1항에 따른 근무처 및 경력등의 신고 또는 변경신고를 거짓으로 한 경우\n2. 제41조제4항을 위반하여 다른 사람에게 측량기술경력증을 빌려 주거나 자기의 성명을 사용하여 측량업무를 수행하게 한 경우\n3. 지적기술자가 제50조제1항을 위반하여 신의와 성실로써 공정하게 지적측량을 하지 아니하거나 고의 또는 중대한 과실로 지적측량을 잘못하여 다른 사람에게 손해를 입힌 경우\n4. 지적기술자가 제50조제1항을 위반하여 정당한 사유 없이 지적측량 신청을 거부한 경우\n② 국토교통부장관은 지적기술자가 제1항 각 호의 어느 하나에 해당하는 경우 위반행위의 횟수, 정도, 동기 및 결과 등을 고려하여 지적기술자가 소속된 한국국토정보공사 또는 지적측량업자에게 해임 등 적절한 징계를 할 것을 요청할 수 있다. <신설 2013.7.17, 2014.6.3>\n③ 제1항에 따른 업무정지의 기준과 그 밖에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23, 2013.7.17, 2020.2.18>"
