  - no: '64'
    title: 토지의 조사ㆍ등록 등
    text: "제64조(토지의 조사ㆍ등록 등)\n① 국토교통부장관은 모든 토지에 대하여 필지별로 소재ㆍ지번ㆍ지목ㆍ면적ㆍ경계 또는 좌표 등을 조사ㆍ측량하여 지적공부에 등록하여야 한다. <개정 2013.3.23>\n② 지적공부에 등록하는 지번ㆍ지목ㆍ면적ㆍ경계 또는 좌표는 토지의 이동이 있을 때 토지소유자(법인이 아닌 사단이나 재단의 경우에는 그 대표자나 관리인을 말한다. 이하 같다)의 신청을 받아 지적소관청이 결정한다. 다만, 신청이 없으면 지적소관청이 직권으로 조사ㆍ측량하여 결정할 수 있다.\n③ 제2항 단서에 따른 조사ㆍ측량의 절차 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23>"
  - no: '65'
    title: 지상경계의 구분 등
    text: "제65조(지상경계의 구분 등)\n① 토지의 지상경계는 둑, 담장이나 그 밖에 구획의 목표가 될 만한 구조물 및 경계점표지 등으로 구분한다.\n② 지적소관청은 토지의 이동에 따라 지상경계를 새로 정한 경우에는 다음 각 호의 사항을 등록한 지상경계점등록부를 작성ㆍ관리하여야 한다.\n1. 토지의 소재\n2. 지번\n3. 경계점 좌표(경계점좌표등록부 시행지역에 한정한다)\n4. 경계점 위치 설명도\n5. 그 밖에 국토교통부령으로 정하는 사항\n③ 제1항에 따른 지상경계의 결정 기준 등 지상경계의 결정에 필요한 사항은 대통령령으로 정하고, 경계점표지의 규격과 재질 등에 필요한 사항은 국토교통부령으로 정한다."
  - no: '66'
    title: 지번의 부여 등
    text: "제66조(지번의 부여 등)\n① 지번은 지적소관청이 지번부여지역별로 차례대로 부여한다.\n② 지적소관청은 지적공부에 등록된 지번을 변경할 필요가 있다고 인정하면 시ㆍ도지사나 대도시 시장의 승인을 받아 지번부여지역의 전부 또는 일부에 대하여 지번을 새로 부여할 수 있다.\n③ 제1항과 제2항에 따른 지번의 부여방법 및 부여절차 등에 필요한 사항은 대통령령으로 정한다."
  - no: '67'
    title: 지목의 종류
    text: "제67조(지목의 종류)\n① 지목은 전ㆍ답ㆍ과수원ㆍ목장용지ㆍ임야ㆍ광천지ㆍ염전ㆍ대(垈)ㆍ공장용지ㆍ학교용지ㆍ주차장ㆍ주유소용지ㆍ창고용지ㆍ도로ㆍ철도용지ㆍ제방(堤防)ㆍ하천ㆍ구거(溝渠)ㆍ유지(溜池)ㆍ양어장ㆍ수도용지ㆍ공원ㆍ체육용지ㆍ유원지ㆍ종교용지ㆍ사적지ㆍ묘지ㆍ잡종지로 구분하여 정한다.\n② 제1항에 따른 지목의 구분 및 설정방법 등에 필요한 사항은 대통령령으로 정한다."
  - no: '68'
    title: 면적의 단위 등
    text: "제68조(면적의 단위 등)\n① 면적의 단위는 제곱미터로 한다.\n② 면적의 결정방법 등에 필요한 사항은 대통령령으로 정한다."
  - no: '69'
    title: 지적공부의 보존 등
    text: "제69조(지적공부의 보존 등)\n① 지적소관청은 해당 청사에 지적서고를 설치하고 그 곳에 지적공부(정보처리시스템을 통하여 기록ㆍ저장한 경우는 제외한다. 이하 이 항에서 같다)를 영구히 보존하여야 하며, 다음 각 호의 어느 하나에 해당하는 경우 외에는 해당 청사 밖으로 지적공부를 반출할 수 없다.\n1. 천재지변이나 그 밖에 이에 준하는 재난을 피하기 위하여 필요한 경우\n2. 관할 시ㆍ도지사 또는 대도시 시장의 승인을 받은 경우\n② 지적공부를 정보처리시스템을 통하여 기록ㆍ저장한 경우 관할 시ㆍ도지사, 시장ㆍ군수 또는 구청장은 그 지적공부를 지적정보관리체계에 영구히 보존하여야 한다. <개정 2013.7.17>\n③ 국토교통부장관은 제2항에 따라 보존하여야 하는 지적공부가 멸실되거나 훼손될 경우를 대비하여 지적공부를 복제하여 관리하는 정보관리체계를 구축하여야 한다. <개정 2013.3.23, 2013.7.17>\n④ 지적서고의 설치기준, 지적공부의 보관방법 및 반출승인 절차 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23>"
  - no: '70'
    title: 지적정보 전담 관리기구의 설치
    text: "제70조(지적정보 전담 관리기구의 설치)\n① 국토교통부장관은 지적공부의 효율적인 관리 및 활용을 위하여 지적정보 전담 관리기구를 설치ㆍ운영한다. <개정 2013.3.23>\n② 국토교통부장관은 지적공부를 과세나 부동산정책자료 등으로 활용하기 위하여 주민등록전산자료, 가족관계등록전산자료, 부동산등기전산자료 또는 공시지가전산자료 등을 관리하는 기관에 그 자료를 요청할 수 있으며 요청을 받은 관리기관의 장은 특별한 사정이 없으면 그 요청을 따라야 한다. <개정 2013.3.23, 2020.6.9>\n③ 제1항에 따른 지적정보 전담 관리기구의 설치ㆍ운영에 관한 세부사항은 대통령령으로 정한다."
  - no: '71'
    title: 토지대장 등의 등록사항
    text: "제71조(토지대장 등의 등록사항)\n① 토지대장과 임야대장에는 다음 각 호의 사항을 등록하여야 한다. <개정 2011.4.12, 2013.3.23>\n1. 토지의 소재\n2. 지번\n3. 지목\n4. 면적\n5. 소유자의 성명 또는 명칭, 주소 및 주민등록번호(국가, 지방자치단체, 법인, 법인 아닌 사단이나 재단 및 외국인의 경우에는 「부동산등기법」 제49조에 따라 부여된 등록번호를 말한다. 이하 같다)\n6. 그 밖에 국토교통부령으로 정하는 사항\n② 제1항제5호의 소유자가 둘 이상이면 공유지연명부에 다음 각 호의 사항을 등록하여야 한다. <개정 2013.3.23>\n1. 토지의 소재\n2. 지번\n3. 소유권 지분\n4. 소유자의 성명 또는 명칭, 주소 및 주민등록번호\n5. 그 밖에 국토교통부령으로 정하는 사항\n③ 토지대장이나 임야대장에 등록하는 토지가 「부동산등기법」에 따라 대지권 등기가 되어 있는 경우에는 대지권등록부에 다음 각 호의 사항을 등록하여야 한다. <개정 2013.3.23>\n1. 토지의 소재\n2. 지번\n3. 대지권 비율\n4. 소유자의 성명 또는 명칭, 주소 및 주민등록번호\n5. 그 밖에 국토교통부령으로 정하는 사항"
  - no: '72'
    title: 지적도 등의 등록사항
    text: "제72조(지적도 등의 등록사항) 지적도 및 임야도에는 다음 각 호의 사항을 등록하여야 한다. <개정 2013.3.23>\n1. 토지의 소재\n2. 지번\n3. 지목\n4. 경계\n5. 그 밖에 국토교통부령으로 정하는 사항"
  - no: '73'
    title: 경계점좌표등록부의 등록사항
    text: "제73조(경계점좌표등록부의 등록사항) 지적소관청은 제86조에 따른 도시개발사업 등에 따라 새로이 지적공부에 등록하는 토지에 대하여는 다음 각 호의 사항을 등록한 경계점좌표등록부를 작성하고 갖춰 두어야 한다. <개정 2013.3.23>\n1. 토지의 소재\n2. 지번\n3. 좌표\n4. 그 밖에 국토교통부령으로 정하는 사항"
  - no: '74'
    title: 지적공부의 복구
    text: 제74조(지적공부의 복구) 지적소관청(제69조제2항에 따른 지적공부의 경우에는 시ㆍ도지사, 시장ㆍ군수 또는 구청장)은 지적공부의 전부 또는 일부가 멸실되거나 훼손된 경우에는 대통령령으로 정하는 바에 따라 지체 없이 이를 복구하여야 한다.
  - no: '75'
    title: 지적공부의 열람 및 등본 발급
    text: "제75조(지적공부의 열람 및 등본 발급)\n① 지적공부를 열람하거나 그 등본을 발급받으려는 자는 해당 지적소관청에 그 열람 또는 발급을 신청하여야 한다. 다만, 정보처리시스템을 통하여 기록ㆍ저장된 지적공부(지적도 및 임야도는 제외한다)를 열람하거나 그 등본을 발급받으려는 경우에는 특별자치시장, 시장ㆍ군수 또는 구청장이나 읍ㆍ면ㆍ동의 장에게 신청할 수 있다. <개정 2012.12.18>\n② 제1항에 따른 지적공부의 열람 및 등본 발급의 절차 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23>"
  - no: '76'
    title: 지적전산자료의 이용 등
    text: "제76조(지적전산자료의 이용 등)\n① 지적공부에 관한 전산자료(연속지적도를 포함하며, 이하 \"지적전산자료\"라 한다)를 이용하거나 활용하려는 자는 다음 각 호의 구분에 따라 국토교통부장관, 시ㆍ도지사 또는 지적소관청에 지적전산자료를 신청하여야 한다. <개정 2013.3.23, 2013.7.17, 2017.10.24>\n1. 전국 단위의 지적전산자료: 국토교통부장관, 시ㆍ도지사 또는 지적소관청\n2. 시ㆍ도 단위의 지적전산자료: 시ㆍ도지사 또는 지적소관청\n3. 시ㆍ군ㆍ구(자치구가 아닌 구를 포함한다) 단위의 지적전산자료: 지적소관청\n② 제1항에 따라 지적전산자료를 신청하려는 자는 대통령령으로 정하는 바에 따라 지적전산자료의 이용 또는 활용 목적 등에 관하여 미리 관계 중앙행정기관의 심사를 받아야 한다. 다만, 중앙행정기관의 장, 그 소속 기관의 장 또는 지방자치단체의 장이 신청하는 경우에는 그러하지 아니하다. <개정 2017.10.24>\n③ 제2항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 관계 중앙행정기관의 심사를 받지 아니할 수 있다. <개정 2017.10.24>\n1. 토지소유자가 자기 토지에 대한 지적전산자료를 신청하는 경우\n2. 토지소유자가 사망하여 그 상속인이 피상속인의 토지에 대한 지적전산자료를 신청하는 경우\n3. 「개인정보 보호법」 제2조제1호에 따른 개인정보를 제외한 지적전산자료를 신청하는 경우\n④ 제1항 및 제3항에 따른 지적전산자료의 이용 또는 활용에 필요한 사항은 대통령령으로 정한다. <개정 2013.7.17>"
  - no: 76의2
    title: 부동산종합공부의 관리 및 운영
    text: "제76조의2(부동산종합공부의 관리 및 운영)\n① 지적소관청은 부동산의 효율적 이용과 부동산과 관련된 정보의 종합적 관리ㆍ운영을 위하여 부동산종합공부를 관리ㆍ운영한다.\n② 지적소관청은 부동산종합공부를 영구히 보존하여야 하며, 부동산종합공부의 멸실 또는 훼손에 대비하여 이를 별도로 복제하여 관리하는 정보관리체계를 구축하여야 한다.\n③ 제76조의3 각 호의 등록사항을 관리하는 기관의 장은 지적소관청에 상시적으로 관련 정보를 제공하여야 한다.\n④ 지적소관청은 부동산종합공부의 정확한 등록 및 관리를 위하여 필요한 경우에는 제76조의3 각 호의 등록사항을 관리하는 기관의 장에게 관련 자료의 제출을 요구할 수 있다. 이 경우 자료의 제출을 요구받은 기관의 장은 특별한 사유가 없으면 자료를 제공하여야 한다."
  - no: 76의3
    title: 부동산종합공부의 등록사항 등
    text: "제76조의3(부동산종합공부의 등록사항 등) 지적소관청은 부동산종합공부에 다음 각 호의 사항을 등록하여야 한다. <개정 2016.1.19>\n1. 토지의 표시와 소유자에 관한 사항: 이 법에 따른 지적공부의 내용\n2. 건축물의 표시와 소유자에 관한 사항(토지에 건축물이 있는 경우만 해당한다): 「건축법」 제38조에 따른 건축물대장의 내용\n3. 토지의 이용 및 규제에 관한 사항: 「토지이용규제 기본법」 제10조에 따른 토지이용계획확인서의 내용\n4. 부동산의 가격에 관한 사항: 「부동산 가격공시에 관한 법률」 제10조에 따른 개별공시지가, 같은 법 제16조, 제17조 및 제18조에 따른 개별주택가격 및 공동주택가격 공시내용\n5. 그 밖에 부동산의 효율적 이용과 부동산과 관련된 정보의 종합적 관리ㆍ운영을 위하여 필요한 사항으로서 대통령령으로 정하는 사항"
  - no: 76의4
    title: 부동산종합공부의 열람 및 증명서 발급
    text: "제76조의4(부동산종합공부의 열람 및 증명서 발급)\n① 부동산종합공부를 열람하거나 부동산종합공부 기록사항의 전부 또는 일부에 관한 증명서(이하 \"부동산종합증명서\"라 한다)를 발급받으려는 자는 지적소관청이나 읍ㆍ면ㆍ동의 장에게 신청할 수 있다.\n② 제1항에 따른 부동산종합공부의 열람 및 부동산종합증명서 발급의 절차 등에 관하여 필요한 사항은 국토교통부령으로 정한다."
  - no: 76의5
    title: 준용
    text: 제76조의5(준용) 부동산종합공부의 등록사항 정정에 관하여는 제84조 를 준용한다.
  - no: '77'
    title: 신규등록 신청
    text: 제77조(신규등록 신청) 토지소유자는 신규등록할 토지가 있으면 대통령령으로 정하는 바에 따라 그 사유가 발생한 날부터 60일 이내에 지적소관청에 신규등록을 신청하여야 한다.
  - no: '78'
    title: 등록전환 신청
    text: 제78조(등록전환 신청) 토지소유자는 등록전환할 토지가 있으면 대통령령으로 정하는 바에 따라 그 사유가 발생한 날부터 60일 이내에 지적소관청에 등록전환을 신청하여야 한다.
  - no: '79'
    title: 분할 신청
    text: "제79조(분할 신청)\n① 토지소유자는 토지를 분할하려면 대통령령으로 정하는 바에 따라 지적소관청에 분할을 신청하여야 한다.\n② 토지소유자는 지적공부에 등록된 1필지의 일부가 형질변경 등으로 용도가 변경된 경우에는 대통령령으로 정하는 바에 따라 용도가 변경된 날부터 60일 이내에 지적소관청에 토지의 분할을 신청하여야 한다."
  - no: '80'
    title: 합병 신청
    text: "제80조(합병 신청)\n① 토지소유자는 토지를 합병하려면 대통령령으로 정하는 바에 따라 지적소관청에 합병을 신청하여야 한다.\n② 토지소유자는 「주택법」에 따른 공동주택의 부지, 도로, 제방, 하천, 구거, 유지, 그 밖에 대통령령으로 정하는 토지로서 합병하여야 할 토지가 있으면 그 사유가 발생한 날부터 60일 이내에 지적소관청에 합병을 신청하여야 한다.\n③ 다음 각 호의 어느 하나에 해당하는 경우에는 합병 신청을 할 수 없다. <개정 2020.2.4>\n1. 합병하려는 토지의 지번부여지역, 지목 또는 소유자가 서로 다른 경우\n2. 합병하려는 토지에 다음 각 목의 등기 외의 등기가 있는 경우\n3. 그 밖에 합병하려는 토지의 지적도 및 임야도의 축척이 서로 다른 경우 등 대통령령으로 정하는 경우"
  - no: '81'
    title: 지목변경 신청
    text: 제81조(지목변경 신청) 토지소유자는 지목변경을 할 토지가 있으면 대통령령으로 정하는 바에 따라 그 사유가 발생한 날부터 60일 이내에 지적소관청에 지목변경을 신청하여야 한다.
  - no: '82'
    title: 바다로 된 토지의 등록말소 신청
    text: "제82조(바다로 된 토지의 등록말소 신청)\n① 지적소관청은 지적공부에 등록된 토지가 지형의 변화 등으로 바다로 된 경우로서 원상(原狀)으로 회복될 수 없거나 다른 지목의 토지로 될 가능성이 없는 경우에는 지적공부에 등록된 토지소유자에게 지적공부의 등록말소 신청을 하도록 통지하여야 한다.\n② 지적소관청은 제1항에 따른 토지소유자가 통지를 받은 날부터 90일 이내에 등록말소 신청을 하지 아니하면 대통령령으로 정하는 바에 따라 등록을 말소한다.\n③ 지적소관청은 제2항에 따라 말소한 토지가 지형의 변화 등으로 다시 토지가 된 경우에는 대통령령으로 정하는 바에 따라 토지로 회복등록을 할 수 있다."
  - no: '83'
    title: 축척변경
    text: "제83조(축척변경)\n① 축척변경에 관한 사항을 심의ㆍ의결하기 위하여 지적소관청에 축척변경위원회를 둔다.\n② 지적소관청은 지적도가 다음 각 호의 어느 하나에 해당하는 경우에는 토지소유자의 신청 또는 지적소관청의 직권으로 일정한 지역을 정하여 그 지역의 축척을 변경할 수 있다.\n1. 잦은 토지의 이동으로 1필지의 규모가 작아서 소축척으로는 지적측량성과의 결정이나 토지의 이동에 따른 정리를 하기가 곤란한 경우\n2. 하나의 지번부여지역에 서로 다른 축척의 지적도가 있는 경우\n3. 그 밖에 지적공부를 관리하기 위하여 필요하다고 인정되는 경우\n③ 지적소관청은 제2항에 따라 축척변경을 하려면 축척변경 시행지역의 토지소유자 3분의 2 이상의 동의를 받아 제1항에 따른 축척변경위원회의 의결을 거친 후 시ㆍ도지사 또는 대도시 시장의 승인을 받아야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 축척변경위원회의 의결 및 시ㆍ도지사 또는 대도시 시장의 승인 없이 축척변경을 할 수 있다.\n1. 합병하려는 토지가 축척이 다른 지적도에 각각 등록되어 있어 축척변경을 하는 경우\n2. 제86조에 따른 도시개발사업 등의 시행지역에 있는 토지로서 그 사업 시행에서 제외된 토지의 축척변경을 하는 경우\n④ 축척변경의 절차, 축척변경으로 인한 면적 증감의 처리, 축척변경 결과에 대한 이의신청 및 축척변경위원회의 구성ㆍ운영 등에 필요한 사항은 대통령령으로 정한다."
  - no: '84'
    title: 등록사항의 정정
    text: "제84조(등록사항의 정정)\n① 토지소유자는 지적공부의 등록사항에 잘못이 있음을 발견하면 지적소관청에 그 정정을 신청할 수 있다.\n② 지적소관청은 지적공부의 등록사항에 잘못이 있음을 발견하면 대통령령으로 정하는 바에 따라 직권으로 조사ㆍ측량하여 정정할 수 있다.\n③ 제1항에 따른 정정으로 인접 토지의 경계가 변경되는 경우에는 다음 각 호의 어느 하나에 해당하는 서류를 지적소관청에 제출하여야 한다.\n1. 인접 토지소유자의 승낙서\n2. 인접 토지소유자가 승낙하지 아니하는 경우에는 이에 대항할 수 있는 확정판결서 정본(正本)\n④ 지적소관청이 제1항 또는 제2항에 따라 등록사항을 정정할 때 그 정정사항이 토지소유자에 관한 사항인 경우에는 등기필증, 등기완료통지서, 등기사항증명서 또는 등기관서에서 제공한 등기전산정보자료에 따라 정정하여야 한다. 다만, 제1항에 따라 미등기 토지에 대하여 토지소유자의 성명 또는 명칭, 주민등록번호, 주소 등에 관한 사항의 정정을 신청한 경우로서 그 등록사항이 명백히 잘못된 경우에는 가족관계 기록사항에 관한 증명서에 따라 정정하여야 한다. <개정 2011.4.12>"
  - no: '85'
    title: 행정구역의 명칭변경 등
    text: "제85조(행정구역의 명칭변경 등)\n① 행정구역의 명칭이 변경되었으면 지적공부에 등록된 토지의 소재는 새로운 행정구역의 명칭으로 변경된 것으로 본다.\n② 지번부여지역의 일부가 행정구역의 개편으로 다른 지번부여지역에 속하게 되었으면 지적소관청은 새로 속하게 된 지번부여지역의 지번을 부여하여야 한다."
  - no: '86'
    title: 도시개발사업 등 시행지역의 토지이동 신청에 관한 특례
    text: "제86조(도시개발사업 등 시행지역의 토지이동 신청에 관한 특례)\n① 「도시개발법」에 따른 도시개발사업, 「농어촌정비법」에 따른 농어촌정비사업, 그 밖에 대통령령으로 정하는 토지개발사업의 시행자는 대통령령으로 정하는 바에 따라 그 사업의 착수ㆍ변경 및 완료 사실을 지적소관청에 신고하여야 한다.\n② 제1항에 따른 사업과 관련하여 토지의 이동이 필요한 경우에는 해당 사업의 시행자가 지적소관청에 토지의 이동을 신청하여야 한다.\n③ 제2항에 따른 토지의 이동은 토지의 형질변경 등의 공사가 준공된 때에 이루어진 것으로 본다.\n④ 제1항에 따라 사업의 착수 또는 변경의 신고가 된 토지의 소유자가 해당 토지의 이동을 원하는 경우에는 해당 사업의 시행자에게 그 토지의 이동을 신청하도록 요청하여야 하며, 요청을 받은 시행자는 해당 사업에 지장이 없다고 판단되면 지적소관청에 그 이동을 신청하여야 한다."
  - no: '87'
    title: 신청의 대위
    text: "제87조(신청의 대위) 다음 각 호의 어느 하나에 해당하는 자는 이 법에 따라 토지소유자가 하여야 하는 신청을 대신할 수 있다. 다만, 제84조에 따른 등록사항 정정 대상토지는 제외한다. <개정 2014.6.3>\n1. 공공사업 등에 따라 학교용지ㆍ도로ㆍ철도용지ㆍ제방ㆍ하천ㆍ구거ㆍ유지ㆍ수도용지 등의 지목으로 되는 토지인 경우: 해당 사업의 시행자\n2. 국가나 지방자치단체가 취득하는 토지인 경우: 해당 토지를 관리하는 행정기관의 장 또는 지방자치단체의 장\n3. 「주택법」에 따른 공동주택의 부지인 경우: 「집합건물의 소유 및 관리에 관한 법률」에 따른 관리인(관리인이 없는 경우에는 공유자가 선임한 대표자) 또는 해당 사업의 시행자\n4. 「민법」 제404조에 따른 채권자"
  - no: '88'
    title: 토지소유자의 정리
    text: "제88조(토지소유자의 정리)\n① 지적공부에 등록된 토지소유자의 변경사항은 등기관서에서 등기한 것을 증명하는 등기필증, 등기완료통지서, 등기사항증명서 또는 등기관서에서 제공한 등기전산정보자료에 따라 정리한다. 다만, 신규등록하는 토지의 소유자는 지적소관청이 직접 조사하여 등록한다. <개정 2011.4.12>\n② 「국유재산법」 제2조제10호에 따른 총괄청이나 같은 조 제11호에 따른 중앙관서의 장이 같은 법 제12조제3항에 따라 소유자 없는 부동산에 대한 소유자 등록을 신청하는 경우 지적소관청은 지적공부에 해당 토지의 소유자가 등록되지 아니한 경우에만 등록할 수 있다. <개정 2011.3.30>\n③ 등기부에 적혀 있는 토지의 표시가 지적공부와 일치하지 아니하면 제1항에 따라 토지소유자를 정리할 수 없다. 이 경우 토지의 표시와 지적공부가 일치하지 아니하다는 사실을 관할 등기관서에 통지하여야 한다.\n④ 지적소관청은 필요하다고 인정하는 경우에는 관할 등기관서의 등기부를 열람하여 지적공부와 부동산등기부가 일치하는지 여부를 조사ㆍ확인하여야 하며, 일치하지 아니하는 사항을 발견하면 등기사항증명서 또는 등기관서에서 제공한 등기전산정보자료에 따라 지적공부를 직권으로 정리하거나, 토지소유자나 그 밖의 이해관계인에게 그 지적공부와 부동산등기부가 일치하게 하는 데에 필요한 신청 등을 하도록 요구할 수 있다. <개정 2011.4.12>\n⑤ 지적소관청 소속 공무원이 지적공부와 부동산등기부의 부합 여부를 확인하기 위하여 등기부를 열람하거나, 등기사항증명서의 발급을 신청하거나, 등기전산정보자료의 제공을 요청하는 경우 그 수수료는 무료로 한다. <개정 2011.4.12>"
  - no: '89'
    title: 등기촉탁
    text: "제89조(등기촉탁)\n① 지적소관청은 제64조제2항(신규등록은 제외한다), 제66조제2항, 제82조, 제83조제2항, 제84조제2항 또는 제85조제2항에 따른 사유로 토지의 표시 변경에 관한 등기를 할 필요가 있는 경우에는 지체 없이 관할 등기관서에 그 등기를 촉탁하여야 한다. 이 경우 등기촉탁은 국가가 국가를 위하여 하는 등기로 본다.\n② 제1항에 따른 등기촉탁에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23>"
  - no: '90'
    title: 지적정리 등의 통지
    text: 제90조(지적정리 등의 통지) 제64조제2항 단서, 제66조제2항, 제74조, 제82조제2항, 제84조제2항, 제85조제2항, 제86조제2항, 제87조 또는 제89조에 따라 지적소관청이 지적공부에 등록하거나 지적공부를 복구 또는 말소하거나 등기촉탁을 하였으면 대통령령으로 정하는 바에 따라 해당 토지소유자에게 통지하여야 한다. 다만, 통지받을 자의 주소나 거소를 알 수 없는 경우에는 국토교통부령으로 정하는 바에 따라 일간신문, 해당 시ㆍ군ㆍ구의 공보 또는 인터넷홈페이지에 공고하여야 한다. <개정 2013.3.23>
  - no: 90의2
    title: 연속지적도의 관리 등
    text: "제90조의2(연속지적도의 관리 등)\n① 국토교통부장관은 연속지적도의 관리 및 정비에 관한 정책을 수립ㆍ시행하여야 한다.\n② 지적소관청은 지적도ㆍ임야도에 등록된 사항에 대하여 토지의 이동 또는 오류사항을 정비한 때에는 이를 연속지적도에 반영하여야 한다.\n③ 국토교통부장관은 제2항에 따른 지적소관청의 연속지적도 정비에 필요한 경비의 전부 또는 일부를 지원할 수 있다.\n④ 국토교통부장관은 연속지적도를 체계적으로 관리하기 위하여 대통령령으로 정하는 바에 따라 연속지적도 정보관리체계를 구축ㆍ운영할 수 있다.\n⑤ 국토교통부장관 또는 지적소관청은 제2항에 따른 연속지적도의 관리ㆍ정비 및 제4항에 따른 연속지적도 정보관리체계의 구축ㆍ운영에 관한 업무를 대통령령으로 정하는 법인, 단체 또는 기관에 위탁할 수 있다. 이 경우 위탁관리에 필요한 경비의 전부 또는 일부를 지원할 수 있다.\n⑥ 제1항 및 제2항에 따른 연속지적도의 관리ㆍ정비의 방법 등에 필요한 사항은 국토교통부령으로 정한다."
  - no: '91'
    title: 국가지명위원회 등의 설치
    text: "제91조(국가지명위원회 등의 설치)\n① 지명에 관한 다음 각 호의 사항을 심의ㆍ의결하기 위하여 국토교통부에 국가지명위원회를 둔다. <개정 2013.3.23, 2020.2.18, 2022.6.10>\n1. 지명의 제정ㆍ변경 및 폐지에 관한 사항\n2. 지명 관련 법령, 제도 및 정책의 개선에 관한 사항\n3. 그 밖에 지명에 관하여 필요한 사항으로서 대통령령으로 정하는 사항\n② 관할 지역의 지명의 제정ㆍ변경 및 폐지에 관한 사항과 그 밖에 지명에 관한 중요 사항을 심의ㆍ의결하기 위하여 시ㆍ도에 시ㆍ도 지명위원회를 두고, 시ㆍ군 또는 구(자치구를 말한다. 이하 같다)에 시ㆍ군ㆍ구 지명위원회를 둔다. <개정 2022.6.10>\n③ 국가지명위원회, 시ㆍ도 지명위원회 및 시ㆍ군ㆍ구 지명위원회의 위원 중 공무원이 아닌 위원은 「형법」 제127조 및 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다. <신설 2019.12.10, 2022.6.10>\n④ 국가지명위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정하고, 시ㆍ도 지명위원회와 시ㆍ군ㆍ구 지명위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정하는 기준에 따라 해당 지방자치단체의 조례로 정한다. <개정 2019.12.10, 2022.6.10>"
  - no: 91의2
    title: 지명의 결정
    text: "제91조의2(지명의 결정)\n① 시ㆍ군ㆍ구의 지명에 관한 사항은 해당 지역을 관할하는 시ㆍ도지사가 시장ㆍ군수ㆍ구청장이 관할 시ㆍ군ㆍ구 지명위원회의 심의ㆍ의결을 거쳐 보고한 사항에 대하여 시ㆍ도 지명위원회의 심의ㆍ의결을 거쳐 결정한다. 다만, 둘 이상의 시ㆍ군ㆍ구에 걸치는 지명에 관한 사항은 해당 지역을 관할하는 시ㆍ도지사가 시장ㆍ군수ㆍ구청장의 의견을 들은 후 시ㆍ도 지명위원회의 심의ㆍ의결을 거쳐 결정하고, 둘 이상의 시ㆍ도에 걸치는 지명에 관한 사항은 국토교통부장관이 시ㆍ도지사의 의견을 들은 후 국가지명위원회의 심의ㆍ의결을 거쳐 결정한다.\n② 제1항에도 불구하고 시ㆍ도지사는 대한민국의 영토의 경계와 관련된 지명의 결정에 관한 사항 등 대통령령으로 정하는 경우에는 국토교통부장관에게 그 결정을 요청할 수 있다.\n③ 국토교통부장관 및 시ㆍ도지사가 지명을 결정(제91조의3에 따라 재심의하는 경우를 포함한다)하는 경우 대통령령으로 정하는 지명결정 원칙을 준수하여야 한다.\n④ 제1항 및 제2항에 따라 결정된 지명에 대하여 국토교통부장관은 시ㆍ도지사에게 통보하고, 시ㆍ도지사는 국토교통부장관 및 관할 시장ㆍ군수ㆍ구청장에게 각각 통보하여야 한다.\n⑤ 국토교통부장관은 제1항 및 제2항에 따라 결정된 지명을 제91조의3에 따른 재심의 청구 기간이 도과된 후 지체 없이 고시하여야 한다. 다만, 같은 조에 따른 재심의 청구ㆍ요구가 있는 경우에는 그러하지 아니하다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 지명의 결정ㆍ통보 및 고시 등에 필요한 사항은 대통령령으로 정한다."
  - no: 91의3
    title: 결정된 지명에 대한 재심의 청구
    text: "제91조의3(결정된 지명에 대한 재심의 청구)\n① 제91조의2에 따라 결정된 지명에 대하여 이의가 있는 경우에는 제91조의2제4항에 따른 통보를 받은 날부터 30일 이내에 시ㆍ도지사는 국토교통부장관에게, 시장ㆍ군수ㆍ구청장은 시ㆍ도지사에게 각각 재심의를 청구할 수 있다.\n② 시장ㆍ군수ㆍ구청장은 제1항에 따른 시ㆍ도지사의 재심의 결과에 대하여 이의가 있는 경우 제5항에 따른 통보를 받은 날부터 30일 이내에 국토교통부장관에게 재심의를 청구할 수 있다.\n③ 제1항 및 제2항에 따라 국토교통부장관이 재심의한 안건에 대해서 시ㆍ도지사 및 시장ㆍ군수ㆍ구청장은 다시 재심의를 청구할 수 없다.\n④ 국토교통부장관은 제91조의2제1항에 따라 시ㆍ도지사가 결정한 지명이 같은 조 제3항에 따른 지명결정 원칙에 부합하지 아니한다고 인정하는 경우에는 같은 조 제4항에 따른 통보를 받은 날부터 30일 이내에 시ㆍ도지사에게 재심의를 요구할 수 있다.\n⑤ 제1항, 제2항 및 제4항에 따른 재심의 결과의 통보에 관한 사항은 제91조의2제4항을 준용한다. 이 경우 국토교통부장관은 제2항에 따른 재심의 결과를 재심의를 청구한 시장ㆍ군수ㆍ구청장에게도 통보하여야 한다.\n⑥ 국토교통부장관은 제1항, 제2항 또는 제4항에 따른 재심의 절차를 거쳐 지명이 결정된 경우에는 그 지명을 지체 없이 고시하여야 한다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 재심의 절차ㆍ방법 및 결과 통보 등에 필요한 사항은 대통령령으로 정한다."
  - no: 91의4
    title: 자료제출 등의 요청
    text: 제91조의4(자료제출 등의 요청) 국토교통부장관, 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 지명의 결정을 위하여 필요한 경우 관계 중앙행정기관 또는 지방자치단체의 장에게 관련 자료의 제출 또는 의견의 제시 등을 요청할 수 있다. 이 경우 요청을 받은 관계 중앙행정기관 또는 지방자치단체의 장은 특별한 사유가 없으면 이에 따라야 한다.
  - no: '92'
    title: 측량기기의 검사
    text: "제92조(측량기기의 검사)\n① 측량업자는 트랜싯, 레벨, 그 밖에 대통령령으로 정하는 측량기기에 대하여 5년의 범위에서 대통령령으로 정하는 기간마다 국토교통부장관이 실시하는 성능검사를 받아야 한다. 다만, 「국가표준기본법」 제14조에 따라 국가교정업무 전담기관의 교정검사를 받은 측량기기로서 국토교통부장관이 제6항에 따른 성능검사 기준에 적합하다고 인정한 경우에는 성능검사를 받은 것으로 본다. <개정 2013.3.23, 2020.4.7>\n② 한국국토정보공사는 성능검사를 위한 적합한 시설과 장비를 갖추고 자체적으로 검사를 실시하여야 한다. <개정 2014.6.3>\n③ 제93조제1항에 따라 측량기기의 성능검사업무를 대행하는 자로 등록한 자(이하 \"성능검사대행자\"라 한다)는 제1항에 따른 국토교통부장관의 성능검사업무를 대행할 수 있다. <개정 2013.3.23, 2020.4.7>\n④ 한국국토정보공사와 성능검사대행자는 제6항에 따른 성능검사의 기준, 방법 및 절차와 다르게 성능검사를 하여서는 아니 된다. <신설 2020.4.7>\n⑤ 국토교통부장관은 한국국토정보공사와 성능검사대행자가 제6항에 따른 기준, 방법 및 절차에 따라 성능검사를 정확하게 하는지 실태를 점검하고, 필요한 경우에는 시정을 명할 수 있다. <신설 2020.4.7>\n⑥ 제1항 및 제2항에 따른 성능검사의 기준, 방법 및 절차와 제5항에 따른 실태점검 및 시정명령 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23, 2020.4.7>"
  - no: '93'
    title: 성능검사대행자의 등록 등
    text: "제93조(성능검사대행자의 등록 등)\n① 제92조제1항에 따른 측량기기의 성능검사업무를 대행하려는 자는 측량기기별로 대통령령으로 정하는 기술능력과 시설 등의 등록기준을 갖추어 시ㆍ도지사에게 등록하여야 하며, 등록사항을 변경하려는 경우에는 시ㆍ도지사에게 신고하여야 한다.\n② 시ㆍ도지사는 제1항에 따라 등록신청을 받은 경우 등록기준에 적합하다고 인정되면 신청인에게 측량기기 성능검사대행자 등록증을 발급한 후 그 발급사실을 공고하고 국토교통부장관에게 통지하여야 한다. <개정 2013.3.23>\n③ 성능검사대행자는 제2항에 따라 발급받은 등록증을 잃어버리거나 못쓰게 된 때에는 국토교통부령으로 정하는 바에 따라 재발급 받을 수 있다. <신설 2022.6.10>\n④ 시ㆍ도지사는 제1항에 따른 신고를 받은 날부터 20일 이내에 신고수리 여부를 신고인에게 통지하여야 한다. <신설 2021.8.10, 2022.6.10>\n⑤ 시ㆍ도지사가 제4항에 따른 기간 내에 신고수리 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신고인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 신고를 수리한 것으로 본다. <신설 2021.8.10, 2022.6.10>\n⑥ 성능검사대행자가 폐업을 한 경우에는 30일 이내에 국토교통부령으로 정하는 바에 따라 시ㆍ도지사에게 폐업사실을 신고하여야 한다. <개정 2013.3.23, 2020.4.7, 2021.8.10, 2022.6.10>\n⑦ 성능검사대행자와 그 검사업무를 담당하는 임직원은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다. <개정 2020.4.7, 2021.8.10, 2022.6.10>\n⑧ 성능검사대행자의 등록, 등록사항의 변경신고, 측량기기 성능검사대행자 등록증의 발급, 검사 수수료 등에 필요한 사항은 국토교통부령으로 정한다. <개정 2013.3.23, 2021.8.10, 2022.6.10>"
  - no: '94'
    title: 성능검사대행자 등록의 결격사유
    text: "제94조(성능검사대행자 등록의 결격사유) 다음 각 호의 어느 하나에 해당하는 자는 성능검사대행자의 등록을 할 수 없다. <개정 2013.7.17, 2020.6.9>\n1. 피성년후견인 또는 피한정후견인\n2. 이 법을 위반하여 징역의 실형을 선고받고 그 집행이 종료(집행이 종료된 것으로 보는 경우를 포함한다)되거나 집행이 면제된 날부터 2년이 지나지 아니한 자\n3. 이 법을 위반하여 징역형의 집행유예를 선고받고 그 유예기간 중에 있는 자\n4. 제96조제1항에 따라 등록이 취소된 후 2년이 지나지 아니한 자\n5. 임원 중에 제1호부터 제4호까지의 어느 하나에 해당하는 자가 있는 법인"
  - no: '95'
    title: 성능검사대행자 등록증의 대여 금지 등
    text: "제95조(성능검사대행자 등록증의 대여 금지 등)\n① 성능검사대행자는 다른 사람에게 자기의 성능검사대행자 등록증을 빌려 주거나 자기의 성명 또는 상호를 사용하여 성능검사대행업무를 수행하게 하여서는 아니 된다.\n② 누구든지 다른 사람의 성능검사대행자 등록증을 빌려서 사용하거나 다른 사람의 성명 또는 상호를 사용하여 성능검사대행업무를 수행하여서는 아니 된다."
  - no: '96'
    title: 성능검사대행자의 등록취소 등
    text: "제96조(성능검사대행자의 등록취소 등)\n① 시ㆍ도지사는 성능검사대행자가 다음 각 호의 어느 하나에 해당하는 경우에는 성능검사대행자의 등록을 취소하거나 1년 이내의 기간을 정하여 업무정지 처분을 할 수 있다. 다만, 제1호ㆍ제4호ㆍ제6호 또는 제7호에 해당하는 경우에는 성능검사대행자의 등록을 취소하여야 한다. <개정 2020.4.7>\n1. 거짓이나 그 밖의 부정한 방법으로 등록을 한 경우\n1의2. 제92조제5항에 따른 시정명령을 따르지 아니한 경우\n2. 제93조제1항의 등록기준에 미달하게 된 경우. 다만, 일시적으로 등록기준에 미달하는 등 대통령령으로 정하는 경우는 제외한다.\n3. 삭제<2022.11.15>\n4. 제95조를 위반하여 다른 사람에게 자기의 성능검사대행자 등록증을 빌려 주거나 자기의 성명 또는 상호를 사용하여 성능검사대행업무를 수행하게 한 경우\n5. 정당한 사유 없이 성능검사를 거부하거나 기피한 경우\n6. 거짓이나 부정한 방법으로 성능검사를 한 경우\n7. 업무정지기간 중에 계속하여 성능검사대행업무를 한 경우\n8. 다른 행정기관이 관계 법령에 따라 등록취소 또는 업무정지를 요구한 경우\n② 시ㆍ도지사는 제1항에 따라 성능검사대행자의 등록을 취소하였으면 취소 사실을 공고한 후 국토교통부장관에게 통지하여야 한다. <개정 2013.3.23>\n③ 시ㆍ도지사는 제1항에 따라 업무정지를 명하여야 하는 경우로서 그 업무정지가 해당 영업의 이용자에게 심한 불편을 주거나 공익을 해칠 우려가 있는 경우에는 업무정지 처분을 갈음하여 4천만원 이하의 과징금을 부과할 수 있다. <개정 2022.11.15>\n④ 시ㆍ도지사는 제3항에 따라 과징금 부과처분을 받은 자가 납부기한까지 과징금을 내지 아니하면 「지방행정제재ㆍ부과금의 징수 등에 관한 법률」에 따라 징수한다. <신설 2022.11.15>\n⑤ 제1항에 따른 성능검사대행자의 등록취소 및 업무정지 처분에 관한 세부 기준과 제3항에 따른 과징금의 부과기준 및 과징금의 징수에 관하여 필요한 사항은 대통령령으로 정한다. <신설 2022.11.15>"
  - no: '97'
    title: 연구ㆍ개발의 추진 등
    text: "제97조(연구ㆍ개발의 추진 등)\n① 국토교통부장관은 측량 및 지적제도의 발전을 위한 시책을 추진하여야 한다. <개정 2013.3.23, 2020.2.18>\n② 국토교통부장관은 제1항에 따른 시책에 관한 연구ㆍ기술개발 및 교육 등의 업무를 수행하는 연구기관을 설립하거나 대통령령으로 정하는 관련 전문기관에 해당 업무를 수행하게 할 수 있다. <개정 2013.3.23, 2020.2.18>\n③ 국토교통부장관은 제2항에 따른 연구기관 또는 관련 전문기관에 예산의 범위에서 제2항에 따른 업무를 수행하는 데에 필요한 비용의 전부 또는 일부를 지원할 수 있다. <개정 2013.3.23, 2020.2.18>\n④ 국토교통부장관은 측량 및 지적제도에 관한 정보 생산과 서비스 기술을 향상시키기 위하여 관련 국제기구 및 국가 간 협력 활동을 추진하여야 한다. <개정 2013.3.23, 2020.2.18>"
  - no: '98'
    title: 측량 분야 종사자 등의 교육훈련
    text: "제98조(측량 분야 종사자 등의 교육훈련)\n① 국토교통부장관은 측량업무 수행능력의 향상을 위하여 측량기술자와 그 밖에 측량 분야와 관련된 업무에 종사하는 자에 대하여 교육훈련을 실시할 수 있다. <개정 2013.3.23, 2020.2.18, 2020.4.7>\n② 성능검사대행자 및 그 소속 직원은 측량기기 성능검사의 품질향상과 서비스제고를 위하여 국토교통부령으로 정하는 바에 따라 국토교통부장관이 실시하는 교육을 받아야 한다. <신설 2020.4.7>"
  - no: '99'
    title: 보고 및 조사
    text: "제99조(보고 및 조사)\n① 국토교통부장관, 시ㆍ도지사, 대도시 시장 또는 지적소관청은 다음 각 호의 어느 하나에 해당하는 경우에는 그 사유를 명시하여 해당 각 호의 자에게 필요한 보고를 하게 하거나 소속 공무원으로 하여금 조사를 하게 할 수 있다. <개정 2013.3.23, 2020.2.18, 2020.4.7>\n1. 측량업자 또는 지적측량수행자가 고의나 중대한 과실로 측량을 부실하게 하여 민원을 발생하게 한 경우\n2. 삭제<2020.2.18>\n3. 측량업자가 제44조제2항에 따른 측량업의 등록기준에 미달된다고 인정되는 경우\n4. 성능검사대행자가 성능검사를 부실하게 하거나 등록기준에 미달된다고 인정되는 경우\n5. 제92조제5항에 따른 한국국토정보공사와 성능검사대행자에 대한 실태점검을 위하여 필요한 경우\n② 제1항에 따라 조사를 하는 경우에는 조사 3일 전까지 조사 일시ㆍ목적ㆍ내용 등에 관한 계획을 조사 대상자에게 알려야 한다. 다만, 긴급한 경우나 사전에 조사계획이 알려지면 조사 목적을 달성할 수 없다고 인정하는 경우에는 그러하지 아니하다.\n③ 제1항에 따라 조사를 하는 공무원은 그 권한을 표시하는 증표를 지니고 관계인에게 이를 내보여야 한다.\n④ 제3항의 증표에 관한 사항은 국토교통부령으로 정한다. <개정 2013.3.23, 2020.2.18>"
  - no: '100'
    title: 청문
    text: "제100조(청문) 국토교통부장관, 시ㆍ도지사 또는 대도시 시장은 다음 각 호의 어느 하나에 해당하는 처분을 하려는 경우에는 청문을 하여야 한다. <개정 2013.3.23, 2020.2.18>\n1. 삭제<2020.2.18>\n2. 제52조제1항에 따른 측량업의 등록취소\n3. 삭제<2020.2.18>\n4. 제96조제1항에 따른 성능검사대행자의 등록취소"
  - no: '101'
    title: 토지등에의 출입 등
    text: "제101조(토지등에의 출입 등)\n① 이 법에 따라 측량을 하거나, 측량기준점을 설치하거나, 토지의 이동을 조사하는 자는 그 측량 또는 조사 등에 필요한 경우에는 타인의 토지ㆍ건물ㆍ공유수면 등(이하 \"토지등\"이라 한다)에 출입하거나 일시 사용할 수 있으며, 특히 필요한 경우에는 나무, 흙, 돌, 그 밖의 장애물(이하 \"장애물\"이라 한다)을 변경하거나 제거할 수 있다. <개정 2020.2.18>\n② 제1항에 따라 타인의 토지등에 출입하려는 자는 관할 특별자치시장, 특별자치도지사, 시장ㆍ군수 또는 구청장의 허가를 받아야 하며, 출입하려는 날의 3일 전까지 해당 토지등의 소유자ㆍ점유자 또는 관리인에게 그 일시와 장소를 통지하여야 한다. 다만, 행정청인 자는 허가를 받지 아니하고 타인의 토지등에 출입할 수 있다. <개정 2012.12.18>\n③ 제1항에 따라 타인의 토지등을 일시 사용하거나 장애물을 변경 또는 제거하려는 자는 그 소유자ㆍ점유자 또는 관리인의 동의를 받아야 한다. 다만, 소유자ㆍ점유자 또는 관리인의 동의를 받을 수 없는 경우 행정청인 자는 관할 특별자치시장, 특별자치도지사, 시장ㆍ군수 또는 구청장에게 그 사실을 통지하여야 하며, 행정청이 아닌 자는 미리 관할 특별자치시장, 특별자치도지사, 시장ㆍ군수 또는 구청장의 허가를 받아야 한다. <개정 2012.12.18>\n④ 특별자치시장, 특별자치도지사, 시장ㆍ군수 또는 구청장은 제3항 단서에 따라 허가를 하려면 미리 그 소유자ㆍ점유자 또는 관리인의 의견을 들어야 한다. <개정 2012.12.18>\n⑤ 제3항에 따라 토지등을 일시 사용하거나 장애물을 변경 또는 제거하려는 자는 토지등을 사용하려는 날이나 장애물을 변경 또는 제거하려는 날의 3일 전까지 그 소유자ㆍ점유자 또는 관리인에게 통지하여야 한다. 다만, 토지등의 소유자ㆍ점유자 또는 관리인이 현장에 없거나 주소 또는 거소가 분명하지 아니할 때에는 관할 특별자치시장, 특별자치도지사, 시장ㆍ군수 또는 구청장에게 통지하여야 한다. <개정 2012.12.18>\n⑥ 해 뜨기 전이나 해가 진 후에는 그 토지등의 점유자의 승낙 없이 택지나 담장 또는 울타리로 둘러싸인 타인의 토지에 출입할 수 없다.\n⑦ 토지등의 점유자는 정당한 사유 없이 제1항에 따른 행위를 방해하거나 거부하지 못한다.\n⑧ 제1항에 따른 행위를 하려는 자는 그 권한을 표시하는 허가증을 지니고 관계인에게 이를 내보여야 한다. <개정 2012.12.18>\n⑨ 제8항에 따른 허가증에 관하여 필요한 사항은 국토교통부령으로 정한다. <개정 2012.12.18, 2013.3.23, 2020.2.18>"
  - no: '102'
    title: 토지등의 출입 등에 따른 손실보상
    text: "제102조(토지등의 출입 등에 따른 손실보상)\n① 제101조제1항에 따른 행위로 손실을 받은 자가 있으면 그 행위를 한 자는 그 손실을 보상하여야 한다.\n② 제1항에 따른 손실보상에 관하여는 손실을 보상할 자와 손실을 받은 자가 협의하여야 한다.\n③ 손실을 보상할 자 또는 손실을 받은 자는 제2항에 따른 협의가 성립되지 아니하거나 협의를 할 수 없는 경우에는 관할 토지수용위원회에 재결(裁決)을 신청할 수 있다.\n④ 관할 토지수용위원회의 재결에 관하여는 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제84조부터 제88조까지의 규정을 준용한다."
  - no: '103'
    title: 토지의 수용 또는 사용
    text: "제103조(토지의 수용 또는 사용)\n① 국토교통부장관은 기본측량을 실시하기 위하여 필요하다고 인정하는 경우에는 토지, 건물, 나무, 그 밖의 공작물을 수용하거나 사용할 수 있다. <개정 2013.3.23, 2020.2.18>\n② 제1항에 따른 수용 또는 사용 및 이에 따른 손실보상에 관하여는 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」을 적용한다."
  - no: '104'
    title: 업무의 수탁
    text: 제104조(업무의 수탁) 국토교통부장관은 그 업무 수행에 지장이 없는 범위에서 공익을 위하여 필요하다고 인정되면 국토교통부령으로 정하는 바에 따라 측량 업무를 위탁받아 수행할 수 있다. <개정 2013.3.23, 2020.2.18>
  - no: '105'
    title: 권한의 위임ㆍ위탁 등
    text: "제105조(권한의 위임ㆍ위탁 등)\n① 이 법에 따른 국토교통부장관의 권한은 그 일부를 대통령령으로 정하는 바에 따라 소속 기관의 장, 시ㆍ도지사, 대도시 시장 또는 지적소관청에 위임할 수 있다. <개정 2013.3.23, 2020.2.18, 2022.6.10>\n② 이 법에 따른 국토교통부장관, 시ㆍ도지사, 대도시 시장 및 지적소관청의 권한 중 다음 각 호의 업무에 관한 권한은 대통령령으로 정하는 바에 따라 한국국토정보공사, 「공간정보산업 진흥법」 제24조에 따른 공간정보산업협회 또는 「민법」 제32조에 따라 국토교통부장관의 허가를 받아 설립된 비영리법인으로서 대통령령으로 정하는 측량 관련 인력과 장비를 갖춘 법인에 위탁할 수 있다. <개정 2013.3.23, 2013.7.17, 2014.6.3, 2020.2.18, 2021.7.20, 2022.6.10>\n1. 삭제<2020.2.18>\n1의2. 제10조의2에 따른 측량업정보 종합관리체계의 구축ㆍ운영\n1의3. 제10조의3에 따른 측량업자의 측량용역사업에 대한 사업수행능력 공시 및 실적 등의 접수 및 내용의 확인\n2. 제15조제4항에 따른 지도등의 간행에 관한 심사\n2의2. 제15조의2에 따른 정밀도로지도의 간행에 관한 심사\n3. 제18조제3항에 따른 공공측량성과의 심사\n4. 삭제<2020.2.18>\n5. 삭제<2020.2.18>\n6. 삭제<2020.2.18>\n7. 삭제<2020.2.18>\n8. 삭제<2020.2.18>\n9. 제40조에 따른 측량기술자의 신고 접수, 기록의 유지ㆍ관리, 측량기술경력증의 발급, 신고받은 내용의 확인을 위한 관련 자료 제출 요청 및 제출 자료의 접수, 측량기술자의 근무처 및 경력등의 확인\n10. 제44조제2항 및 제5항에 따른 측량업의 등록신청 및 변경신고의 접수\n10의2. 제44조제4항에 따른 측량업등록증 및 측량업등록수첩의 재발급 신청의 접수\n10의3. 제46조제1항에 따른 측량업자의 지위 승계신고의 접수\n10의4. 제48조에 따른 측량업의 휴업ㆍ폐업 등 신고의 접수\n11. 제98조에 따른 지적기술자의 교육훈련\n12. 제8조제1항에 따른 측량기준점(지적기준점에 한정한다)의 관리\n13. 제8조제5항에 따른 측량기준점(지적기준점에 한정한다)표지의 현황조사 보고의 접수\n③ 제2항에 따라 국토교통부장관, 시ㆍ도지사, 대도시 시장 및 지적소관청으로부터 위탁받은 업무에 종사하는 한국국토정보공사, 「공간정보산업 진흥법」 제24조에 따른 공간정보산업협회 또는 비영리법인의 임직원은 「형법」 제127조 및 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다. <개정 2013.3.23, 2013.7.17, 2014.6.3, 2020.2.18, 2022.6.10>"
  - no: '106'
    title: 수수료 등
    text: "제106조(수수료 등)\n① 다음 각 호의 어느 하나에 해당하는 신청 등을 하는 자는 국토교통부령으로 정하는 바에 따라 수수료를 내야 한다. <개정 2013.3.23, 2013.7.17, 2020.2.18, 2021.7.20, 2022.6.10>\n1. 제14조제2항 및 제19조제2항에 따른 측량성과 등의 복제 또는 사본의 발급 신청\n2. 제15조에 따른 기본측량성과ㆍ기본측량기록 또는 같은 조 제1항에 따라 간행한 지도등의 활용 신청\n3. 제15조제4항 및 제15조의2제1항에 따른 지도등 간행의 심사 신청\n4. 제16조 또는 제21조에 따른 측량성과의 국외 반출 허가 신청\n5. 제18조에 따른 공공측량성과의 심사 요청\n6. 제27조에 따른 지적기준점성과의 열람 또는 그 등본의 발급 신청\n7. 삭제<2020.2.18>\n8. 삭제<2020.2.18>\n9. 제44조제2항에 따른 측량업의 등록 신청\n10. 제44조제4항에 따른 측량업등록증 및 측량업등록수첩의 재발급 신청\n11. 삭제<2020.2.18>\n12. 삭제<2020.2.18>\n13. 제75조에 따른 지적공부의 열람 및 등본 발급 신청\n14. 제76조에 따른 지적전산자료의 이용 또는 활용 신청\n14의2. 제76조의4에 따른 부동산종합공부의 열람 및 부동산종합증명서 발급 신청\n15. 제77조에 따른 신규등록 신청, 제78조에 따른 등록전환 신청, 제79조에 따른 분할 신청, 제80조에 따른 합병 신청, 제81조에 따른 지목변경 신청, 제82조에 따른 바다로 된 토지의 등록말소 신청, 제83조에 따른 축척변경 신청, 제84조에 따른 등록사항의 정정 신청 또는 제86조에 따른 도시개발사업 등 시행지역의 토지이동 신청\n16. 제92조제1항에 따른 측량기기의 성능검사 신청\n17. 제93조제1항에 따른 성능검사대행자의 등록 신청\n18. 제93조제3항에 따른 성능검사대행자 등록증의 재발급 신청\n② 제24조제1항에 따라 지적측량을 의뢰하는 자는 국토교통부령으로 정하는 바에 따라 지적측량수행자에게 지적측량수수료를 내야 한다. <개정 2013.3.23>\n③ 제2항에 따른 지적측량수수료는 국토교통부장관이 매년 12월 31일까지 고시하여야 한다. <개정 2013.3.23, 2020.6.9>\n④ 지적소관청이 제64조제2항 단서에 따라 직권으로 조사ㆍ측량하여 지적공부를 정리한 경우에는 그 조사ㆍ측량에 들어간 비용을 제2항에 준하여 토지소유자로부터 징수한다. 다만, 제82조에 따라 지적공부를 등록말소한 경우에는 그러하지 아니하다.\n⑤ 제1항에도 불구하고 다음 각 호의 경우에는 수수료를 면제할 수 있다. <개정 2012.12.18, 2013.7.17, 2020.2.18>\n1. 제1항제1호 또는 제2호의 신청자가 공공측량시행자인 경우\n2. 삭제<2020.2.18>\n3. 삭제<2020.2.18>\n4. 제1항제13호의 신청자가 국가, 지방자치단체 또는 지적측량수행자인 경우\n5. 제1항제14호의2 및 제15호의 신청자가 국가 또는 지방자치단체인 경우\n⑥ 제1항 및 제4항에 따른 수수료를 국토교통부령으로 정하는 기간 내에 내지 아니하면 국세 또는 지방세 체납처분의 예에 따라 징수한다. <개정 2013.3.23, 2020.2.18>"
  - no: '107'
    title: 벌칙
    text: 제107조(벌칙) 측량업자로서 속임수, 위력(威力), 그 밖의 방법으로 측량업과 관련된 입찰의 공정성을 해친 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2020.2.18>
  - no: '108'
    title: 벌칙
    text: "제108조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. <개정 2020.2.18>\n1. 제9조제1항을 위반하여 측량기준점표지를 이전 또는 파손하거나 그 효용을 해치는 행위를 한 자\n2. 고의로 측량성과를 사실과 다르게 한 자\n3. 제16조 또는 제21조를 위반하여 측량성과를 국외로 반출한 자\n4. 제44조를 위반하여 측량업의 등록을 하지 아니하거나 거짓이나 그 밖의 부정한 방법으로 측량업의 등록을 하고 측량업을 한 자\n5. 삭제<2020.2.18>\n6. 제92조제1항에 따른 성능검사를 부정하게 한 성능검사대행자\n7. 제93조제1항을 위반하여 성능검사대행자의 등록을 하지 아니하거나 거짓이나 그 밖의 부정한 방법으로 성능검사대행자의 등록을 하고 성능검사업무를 한 자"
  - no: '109'
    title: 벌칙
    text: "제109조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 2013.3.23, 2020.2.18, 2021.7.20, 2022.6.10>\n1. 제14조제2항 또는 제19조제2항을 위반하여 무단으로 측량성과 또는 측량기록을 복제한 자\n2. 제15조제4항 및 제15조의2제1항에 따른 심사를 받지 아니하고 지도등을 간행하여 판매하거나 배포한 자\n3. 삭제<2020.2.18>\n4. 제39조제1항을 위반하여 측량기술자가 아님에도 불구하고 측량을 한 자\n5. 제41조제2항을 위반하여 업무상 알게 된 비밀을 누설한 측량기술자\n6. 제41조제3항을 위반하여 둘 이상의 측량업자에게 소속된 측량기술자\n7. 제49조제1항을 위반하여 다른 사람에게 측량업등록증 또는 측량업등록수첩을 빌려주거나 자기의 성명 또는 상호를 사용하여 측량업무를 하게 한 자\n8. 제49조제2항을 위반하여 다른 사람의 측량업등록증 또는 측량업등록수첩을 빌려서 사용하거나 다른 사람의 성명 또는 상호를 사용하여 측량업무를 한 자\n9. 제50조제3항을 위반하여 제106조제2항에 따른 지적측량수수료 외의 대가를 받은 지적측량기술자\n10. 거짓으로 다음 각 목의 신청을 한 자\n11. 제95조제1항을 위반하여 다른 사람에게 자기의 성능검사대행자 등록증을 빌려 주거나 자기의 성명 또는 상호를 사용하여 성능검사대행업무를 수행하게 한 자\n12. 제95조제2항을 위반하여 다른 사람의 성능검사대행자 등록증을 빌려서 사용하거나 다른 사람의 성명 또는 상호를 사용하여 성능검사대행업무를 수행한 자"
  - no: '110'
    title: 양벌규정
    text: 제110조(양벌규정) 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제107조부터 제109조까지의 어느 하나에 해당하는 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.
  - no: '111'
    title: 과태료
    text: "제111조(과태료)\n① 제13조제4항을 위반하여 고시된 측량성과에 어긋나는 측량성과를 사용한 자에게는 300만원 이하의 과태료를 부과한다.\n② 다음 각 호의 어느 하나에 해당하는 자에게는 200만원 이하의 과태료를 부과한다.\n1. 정당한 사유 없이 측량을 방해한 자\n2. 제92조제1항을 위반하여 측량기기에 대한 성능검사를 받지 아니하거나 부정한 방법으로 성능검사를 받은 자\n3. 정당한 사유 없이 제99조제1항에 따른 보고를 하지 아니하거나 거짓으로 보고를 한 자\n4. 정당한 사유 없이 제99조제1항에 따른 조사를 거부ㆍ방해 또는 기피한 자\n5. 정당한 사유 없이 제101조제7항을 위반하여 토지등에의 출입 등을 방해하거나 거부한 자\n③ 다음 각 호의 어느 하나에 해당하는 자에게는 100만원 이하의 과태료를 부과한다.\n1. 제40조제1항을 위반하여 거짓으로 측량기술자의 신고를 한 자\n2. 제44조제5항을 위반하여 측량업 등록사항의 변경신고를 하지 아니한 자\n3. 제46조제1항을 위반하여 측량업자의 지위 승계 신고를 하지 아니한 자\n4. 제48조를 위반하여 측량업의 휴업ㆍ폐업 등의 신고를 하지 아니하거나 거짓으로 신고한 자\n5. 제93조제1항을 위반하여 성능검사대행자의 등록사항 변경을 신고하지 아니한 자\n6. 제93조제6항을 위반하여 성능검사대행업무의 폐업신고를 하지 아니한 자\n7. 정당한 사유 없이 제98조제2항에 따른 교육을 받지 아니한 자\n④ 제1항부터 제3항까지의 규정에 따른 과태료는 대통령령으로 정하는 바에 따라 국토교통부장관, 시ㆍ도지사, 대도시 시장 또는 지적소관청이 부과ㆍ징수한다."
source: https://www.law.go.kr/법령/공간정보의구축및관리등에관한법률
