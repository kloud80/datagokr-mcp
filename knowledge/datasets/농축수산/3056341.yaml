summary_user: 연안정비사업 대상 해변(개소)별로 소재 광역시도·시군구, 조사 연도, 조사된 연안침식 등급을 담은 전국 단위 파일 데이터(CSV, 약 225KB)로, 좌표가 없는 비공간 목록이다. 연안관리 담당자나 분석가가 "우리 시군구 해변 가운데 침식 등급이 나쁜 곳은 어디이고 연도별로 어떻게 달라졌나" 같은 질문을 확인하는 데 쓴다. 법정동코드(bjd_cd)가 실측 조인 키라서 행정구역 코드 기반 통계나 다른 해양공간·연안 데이터와 지역 단위로 이어 쓴다.
