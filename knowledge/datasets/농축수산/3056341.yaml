description_portal: 이 데이터는 해양수산부에서 연안정비사업(연안에서 시행하는  연안재해로부터 연안을 보호하고 훼손된 연안을 정비하는 사업)중 연안침식 조사 결과를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 연안정비사업이 실시된 해변의 명칭, 해변이 위치한 시군구, 조사 시행 연도 및 조사된 연안 침식 등급 정보 등으로 구성되어 있습니다.   본 데이터는 연안지역별 침식 현황 분석, 연안관리 정책의 효율성 평가, 그리고 지역별 연안정비사업 추진실적 모니터링 등의 업무에 활용될 수 있습니다.
