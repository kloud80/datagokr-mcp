summary_user: 과실전문생산단지 조성사업(용배수로·경작로 정비 등 과수 생산·출하기반 구축) 가운데 단지기반 사업의 집행 정보를 연도와 시도·시군구별로 담은 전국 단위 비공간 집계 자료이며, 교부액·전년도 이월액·예산액·이월액·불용액·실집행률 같은 예산 집행 항목이 들어 있다. 정책 담당자나 연구자가 "어느 시군구에서 과수 단지기반 사업 예산이 얼마나 실제로 집행됐고, 이월·불용은 얼마나 났는가"를 따질 때 쓴다. 전역 조인 키는 확인되지 않았고, 시도·시군구 이름과 코드(CTRD_CODE, SIGNGU_CODE)를 매핑해서 같은 기관의 다른 과수·농업 사업 자료나 지역별 통계와 이어 쓴다.
description_portal: 해당 데이터는 과실전문생산단지조성사업 단지기반과 관련된 자료로, 과실전문생산단지조성사업은 과실전문생산단지 조성을 위한 용배수로, 경작로 정비 등 과수생산 및 출하기반 구축에 대한 사업입니다. 이를 통해 과실전문생산단지의 조성 현황을 확인할 수 있으며, 기반 시설 구축이 과수 생산성 향상과 품질 관리에 어떤 기여를 하고 있는지를 분석할 수 있습니다. 또한 정책 담당자와 연구자에게는 과수 산업의 경쟁력 강화와 지역 특화작목 육성을 위한 근거 자료로 활용될 수 있고, 농업인들에게는 장기적인 경영 안정화와 수익성 제고를 위한 참고 자료가 됩니다. 나아가 본 데이터는 과수 산업의 지속 가능성과 유통 효율성을 높이는 동시에, 농업·농촌 경제 활성화에도 기여할 수 있는 중요한 기반 자료입니다.
