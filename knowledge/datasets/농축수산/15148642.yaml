summary_user: 해양수산부가 전국 해역을 격자 단위로 나눠 기준년도별 해수면상승률을 좌표(엑스·와이좌표)와 함께 담은 공간 파일로, CSV 한 건(약 4.4MB)으로 제공된다. 연안 지자체·해양정책 분석가가 '우리 지역 앞바다의 해수면이 얼마나 빨리 오르고 있는가'를 확인해 연안 침수·기후적응 계획의 기초 자료로 쓴다. 전역 조인 키는 없으므로 좌표를 기준으로 다른 공간 데이터(연안 행정구역 경계, 조위 관측소 위치 등)와 공간 결합해 쓰고, 같은 기관 데이터와는 격자 체계로만 맞춰 볼 수 있다.
description_portal: 이 데이터는 해양수산부에서 해수면상승률에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호,  해수면상승기준년도, 격자아이디, 엑스좌표, 와이좌표, 해수면상승률 데이터로 구성되어 있습니다.본 데이터는 해수면상승률 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해수면상승률이란 지구온난화 등의 영향으로 해수면의 높이가 상승하는 현상을 수치로 표현한 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
