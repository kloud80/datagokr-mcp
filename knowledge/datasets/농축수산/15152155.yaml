description_portal: 한국해양진흥공사(KOBC)의 주요 목적은 해운기업의 안정적인 선박 도입과 유동성 확보를 지원하여 해운 경쟁력을 강화하고 국가 경제 발전에 이바지하는 것입니다. 이를 위해 선박금융, 공공선주 사업, 해상 공급망 안정화 지원, 해운업계의 ESG 경영 및 친환경/디지털 전환 지원 등 다양한 사업을 수행합니다.한국해양진흥공사의 운영목적에서도 선박금융, 공공선주 사업, 해운업계 지원 등을 위해서 해운사의 선박은 중요한 관리 대상입니다.관련해서 해양진흥공사가 보유한 데이터를 해운사의 보호 정보를 제외하고 제공해 드립니다.
