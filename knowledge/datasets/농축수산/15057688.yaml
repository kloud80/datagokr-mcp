summary_user: 경기도 내 전통주 제조업체가 주류제조면허를 받기 위해 발급받은 추천서 이력을 건별로 담으며, 시군명·접수일·업체명·추천 주류 종류·연간 제조수량·부지와 건물 면적·자금소요액·발급일자·도로명/지번 주소·위경도 좌표를 포함한다. 전통주 산업 정책 담당자나 연구자가 '경기도 어느 시군에서 어떤 종류의 전통주 양조장이 늘고 있는가'를 확인하거나, 관광 사업자가 양조장 위치를 지도에 표시해 체험 코스를 짜는 데 쓴다. 전역 조인 키는 없고 시군 코드(SIGUN_CD)·시군명으로 경기도의 다른 시군 단위 데이터와 연결하며, 위경도 좌표로 공간 데이터와 겹쳐 쓴다.
description_portal: 전통주 주류제조면허 추천서 발급 현황 데이터는 경기도 내 전통주 제조업체의 면허 추천 발급 이력을 담고 있으며, 시군명, 접수번호, 접수일, 업체명, 주소(도로명·지번), 위도·경도 좌표, 추천주류 종류, 연간 제조수량, 부지·건물 규모, 자금소요액, 발급일자 등의 항목으로 구성되어 있습니다. 해당 데이터는 전통주 산업의 현황을 파악하고, 주류 제조업 허가 추이 및 업종별 제조 역량을 분석하는 데 활용할 수 있습니다. 특히 연간 제조수량과 주류 종류는 지역별 특산주 개발, 전통주 산업 육성 정책 수립, 농업과 연계한 6차 산업 활성화 연구 등에 중요한 기초자료가 됩니다. 또한 양조장 위치 정보는 전통주 체험 관광, 지역 축제 연계 상품 개발 등 문화·관광 자원으로 확장 활용될 수 있습니다.
