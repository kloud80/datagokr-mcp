summary_user: 과실 품목별로 생산자와 유통 주체가 맺은 출하약정 현황을 사업연도·지역본부·사업방식·품목 단위로 담으며, 사업비, 약정물량과 출하물량(톤), 출하율, 참여 조합 수와 참여 농가 수가 들어 있는 전국 범위의 집계 자료다. 정책 담당자나 산지 유통 조직이 '올해 사과 출하약정 물량 대비 실제 출하율은 지역본부별로 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명(PRDLST_NM)이나 연도·지역본부 이름으로 맞춰 이어야 하며, KAMIS 가격 자료와 묶으려면 품목코드 매핑이 따로 필요하다.
description_portal: 해당 데이터는 과실 수급 및 가격 안정을 도모하기 위해 관리되는 자료로, 주요 항목에는 품목, 약정실적, 출하약정액 등이 포함되어 있습니다. 이 자료는 특정 과실 품목별로 생산자와 유통 주체 간에 이루어진 출하 약정 현황을 보여주며, 약정 물량과 금액을 기반으로 시장 수급 조절과 가격 안정화를 지원하는 역할을 합니다. 본 데이터는 정책 담당자에게는 과실 유통 정책 수립 및 가격 안정 대책 마련의 근거가 되고, 농업인과 산지 유통 조직에게는 출하 전략을 세우는 참고 자료로 활용됩니다. 또한 연구자와 산업 관계자에게는 과실 유통 구조와 가격 형성 메커니즘을 분석할 수 있는 실증적 데이터를 제공하여, 장기적으로 과수 산업의 안정적 성장과 농업 경쟁력 강화에 기여할 수 있는 의미 있는 자료라 할 수 있습니다.
