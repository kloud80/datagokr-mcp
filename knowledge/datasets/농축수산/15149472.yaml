description_portal: 한국농어촌공사에서 시행 중인 종전부동산사업의 주요 개발지구 6개에 대한 각 지구별 매각을 위한  공고정보를  제공합니다. 각 지구의 해당지역은 경기도 수원시 및 화성시 입니다. 각 지구의 사업은 도시개발사업 후 매각, 지구단위계획 수립 후 매각, 현상태 매각의 방식으로 추진되고 있습니다. 또한 각 지구별 사업기간은 2012년을 시작으로 2035년까지 사업기간종료를 목표로 하고 있습니다. 각 지구별 매각은 한국자산관리공사(캠코)에서 관리하는 공매포털시스템 온비드(www.onbid.co.kr)에 공고를 게시하여 진행하며, 자세한 공고내용은 온비드 내 검색메뉴에서 첨부한 공고관리 데이터 중 공고번호 항목으로 조회하면 확인이 가능합니다.
