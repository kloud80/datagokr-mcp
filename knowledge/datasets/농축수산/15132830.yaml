summary_user: 전라남도 어장도관리시스템에 실린 양식장과 해변·해수욕장을 한 행씩 담은 원천 목록 파일로, 고유번호·이름·법정동코드와 분류 값을 담고 읍면동 단위까지 위치를 구분한다. 어업인이나 지역 분석가가 '우리 읍면동에 어떤 양식장과 해수욕장이 있는가'처럼 특정 지역의 양식장 분포와 해변 위치를 확인하는 데 쓴다. 법정동코드(bjd_cd)를 키로 행정구역 코드표나 다른 읍면동 단위 통계와 이어 쓴다.
description_portal: '- 전라남도 어장도관리시스템에 게재된 해변 및 양식장 정보(고유번호, 양식장 및 해변 해수욕장 이름, 법정동 코드 등)에 대해 조회하실 수 있습니다.- 이 데이터를 활용하면 다음과 같은 정보를 얻을 수 있습니다.- 양식장 위치 및 종류 : 어류 양식장, 해조류 양식장 등- 해변 및 해수욕장 정보 : 위치, 시설, 접근성 등- 법정동 코드 : 행정 구역별 분류- 이를 통해 특정 지역의 양식장 분포를 파악하거나, 해수욕장의 위치 및 시설 정보를 확인할 수 있습니다.- 이러한 자료를 활용하여 전라남도의 해양 자원에 대한 깊이 있는 분석이나, 관광 및 어업 관련 계획 수립에 유용하게 활용하실 수 있습니다.'
