description_portal: 이 데이터는 해양수산부에서 부산용도구역 내 해양관광구역 정보를 제공하기 위해 수집한 파일 형식의 데이터입니다.  본 데이터의 주요 내용은 부산 지역의 해양관광구역 공간정보번호, ID, 면적, 상세정보 등으로 구성되어 있습니다.  본 데이터는 해양관광구역의 관리 정책 수립, 해양관광 자원 현황 파악, 그리고 관련 기관의 해양관광 개발계획 수립 등 행정업무와 연구자료로 활용될 수 있습니다. 추가로 해당 지역 내 해양관광 개발에 관심 있는 민간기업 또는 지역사회에서 관광콘텐츠 기획, 공간 조성 등과 같은 분야에도 참고자료로 사용할 수 있습니다.
