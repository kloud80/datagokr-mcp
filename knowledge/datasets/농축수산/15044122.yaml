summary_user: 시도별 귀농가구 수를 집계한 통계표로, 전국 합계와 부산·대구·인천·울산·세종·경기·강원·충북·충남·전북·전남·경북·경남·제주 등 시도가 열로 펼쳐진 비공간 집계 자료다. 귀농·귀촌 정책 담당자나 지역 분석가가 '어느 시도로 귀농하는 가구가 많고 해마다 어떻게 달라지는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지역 통계와는 시도 이름을 맞춰 붙여야 한다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 시도별 귀농가구수 현황 통계입니다. 제공 항목에는 부산, 대구, 인천, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주가 포함되어 있으며, 전국 귀농가구의 분포를 체계적으로 확인할 수 있습니다. 이를 통해 지역별 귀농 규모와 추세를 분석할 수 있으며, 청년층과 고령층의 귀농 참여 현황도 파악할 수 있습니다. 해당 자료는 귀농·귀촌 정책 수립, 정착 지원 프로그램 기획, 지역 맞춤형 교육·컨설팅 설계 등 다양한 정책적 활용이 가능하며, 농촌 인구구조 변화와 지역 활성화 전략 수립에 필요한 근거 자료로 제공됩니다.
