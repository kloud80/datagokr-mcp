summary_user: 경기도 사이버식물병원시스템의 참고자료(매뉴얼·사용법 등)에 붙은 첨부파일 목록을 파일 한 건 단위로 담는 메타 정보 데이터로, 첨부파일 번호·원본 파일명·시스템 저장 파일명이 들어 있다. 병해 진단이나 작물 관리 참고자료를 찾는 농업인이나 시스템 관리자가 '이 참고자료에 내려받을 첨부파일이 있는가'를 확인하는 데 쓴다. 포털 설명상 참고자료_정보 테이블과 첨부파일 번호(atch_file_no)로 이어 쓰지만, 실측 컬럼에서 다른 데이터와 맞출 전역 조인 키는 확인되지 않았다.
description_portal: 참고자료_첨부파일 테이블은 병해 진단 및 작물 관리에 참조할 수 있는 참고자료에 첨부된 파일 이름 정보를 제공하는 데이터입니다. 이 테이블에는 첨부파일 고유 번호, 원본 파일명, 시스템에서 저장한 파일명이 포함되어 있습니다. 사이버식물병원시스템에 저장된 첨부파일명만을 제공하여 매뉴얼 및 사용법 목록을 확인할 수 있습니다. 이 데이터는 참고자료_정보 테이블과 연계되어 해당 제목과 요약 설명에 대한 첨부파일이 있는지를 판단하는 데 사용됩니다. 시스템을 관리하는 메타 정보 성격의 데이터입니다.
