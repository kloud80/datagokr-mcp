summary_user: 한국마사회 서울·부산경남·제주 경마장에서 활동하는 기수 한 명당 한 행으로, 소속조·생년월일·데뷔/은퇴일자·기승 가능 중량과 통산·최근 1년 출주 및 1~3착 횟수를 담은 기수별 집계 데이터다. 경마 팬이나 분석가가 '특정 경마장 기수 중 최근 1년 승률이 높은 기수는 누구인가'처럼 기수 성적을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 같은 기관의 경주·출주표 데이터와는 기수번호(jkNo)나 기수명으로 맞춰 잇는다.
description_portal: 한국마사회 서울, 부산경남, 제주 경마장에서 활동 중인 기수정보 자료를 제공합니다. (제공자료는 시행경마장명, 기수명, 기수번호, 소속조, 생년월일, 나이, 데뷔일자, 은퇴일자, 기능가능 소속조중량, 기능가능 타조중량, 통산 총출주회수, 통산 1착회수 , 통산 2착회수, 통산 3착회수, 최근1년 총출주회수, 최근1년 1착회수, 최근1년 2착회수, 최근1년 3착회수 자료입니다.) - 요청메시지는 기수번호(jk_no), 기수명(jk_name), 시행경마장구분(meet)을 이용하여 조회할 수 있으며, 시행경마장구분(meet)을 입력하지 않았을 경우에는 1(서울경마장)이 기본값으로 입력되어 조회 됩니다.※ 영천경마 시행에 따른 시행경마(권역) 표출시 부산경남경마와 영천경마를 합쳐서 영남경마로 표출합니다.
team:
