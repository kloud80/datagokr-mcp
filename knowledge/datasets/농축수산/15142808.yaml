description_portal: '"이 데이터는 2023년 1월부터 2026년 3월까지 해상에서 운용되는 바다내비 송수신기 장비정보를 기록하고 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부 바다내비 송수신기 장비의 설치 유무와 장비별 기본 정보 및 송수신 관련 정보로 구성되어 있습니다. 개인정보는 삭제 처리 되었으며, 장비가 선박에 설치되어 있는지 여부와 무관하게 송수신기 자체의 장비정보만 포함되어 있습니다.  본 데이터는 선박 내 통신장비의 도입 및 운용 현황 파악, 해양 교통 및 통신망 인프라 분석, 바다내비 송수신기의 보급 정책 수립, 장비 유지관리 및 관련 제도 개선 등의 업무 수행에 활용될 수 있습니다.'
