summary_user: 연안여객선 항로별로 변침점의 순번·위경도 좌표·변침점명과 기항지명을 한 점씩 행으로 담은 파일 데이터이며, 전국 범위 28,422행 규모다. 연안여객선이 어떤 경로의 어느 지점을 거쳐 가는지 확인하거나 해상 입지·해양공간 검토에서 항로와의 겹침을 따지려는 분석가가 쓴다. 위도(LAT)·경도(LON) 좌표 키로 해양용도구역 등 다른 해양공간 좌표 데이터와 이어 쓰고, 항로 분류(ID)와 항로명으로 항로 단위로 묶는다.
description_portal: 본 데이터는 한국해양교통안전공단에서 관리하는 연안여객선의 항로정보를 체계적으로 제공하기 위해 구축되었다.데이터는 각 항로의 고유 분류코드와 명칭을 포함하며, 항로 내 변침점 및 해당 지점의 위경도 좌표와 변침점명을 상세히 수록하였다.아울러, 항로상에 위치한 주요 기항지명을 함께 제공함으로써 항로별 운항경로와 해상교통 관리를 지원한다.이를 통해 연안여객선 운항의 안전성과 효율성을 도모하고, 관련 기관 및 국민이 항로 정보를 신속하고 정확하게 활용할 수 있도록 하는 것을 목적으로 한다.본 데이터는 해양 교통 안전과 항로 관리 체계의 투명성 제고에 기여하는 중요한 기초 자료임을 밝힌다.
