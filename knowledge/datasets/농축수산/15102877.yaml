summary_user: 농식품인재개발원(옛 농식품공무원교육원)이 2022년에 운영한 집합교육과 이러닝 과정의 연간 계획을 과정별로 담은 파일로, 과정명·기수·일정·일수·인원이 한 행에 들어 있고 범위는 전국 단위 비공간 자료다. 농식품 분야 공무원이나 교육 담당자가 '2022년에 어떤 교육 과정이 몇 기수, 언제, 며칠간, 몇 명 규모로 계획됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 과정명 같은 이름 매핑이나 같은 기관 자료로만 이을 수 있다.
