description_portal: 국립산림품종관리센터에서 운영하는 산림종자아카데미의 연도별 운영실적을 종합한 정보로, 산림교육 프로그램 운영 현황을 비롯하여 코로나19 상황에 대응한 비대면 교육 프로그램, 자유학기제 연계 활동, 기관 방문 프로그램 등 다양한 형태의 교육 운영 결과를 포함하고 있습니다. 본 자료는 각 프로그램별 참여 인원 수를 기준으로 정리되어 있으며, 이를 합산하여 우리 기관의 연간 방문 및 참여 실적을 총괄적으로 파악할 수 있습니다.주요 참여자는 청소년과 어린이가 상당 비중을 차지하나, 구체적인 연령별 세부 통계는 본 자료에 포함되어 있지 않습니다. 또한 특정 프로그램이 해당 연도에 운영되지 않았거나 참여자가 없을 경우, 실적은 ‘0’으로 표시되어 있음을 알려드립니다. 따라서 본 자료를 활용하실 때는 각 수치가 실제 운영 여부 및 참여 규모를 직접 반영한다는 점을 참고하시기 바랍니다.
