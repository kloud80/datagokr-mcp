description_portal: '농림수산식품교육문화정보원 농업온 시스템의 영농가이드 농약에 대한 데이터는 농업 종사자 및 농민들에게 매우 중요한 정보를 제공합니다. 이 데이터는 재배와 관련된 다양한 농약의 정보를 포함하고 있으며, 사용 시점이나 횟수에 대한 상세한 내용까지 담고 있어 농업 생산성 향상에 기여할 수 있습니다. 데이터는 특히 농약 사용에 있어 법적 기준을 준수하고 안전한 농업을 위한 지침으로 활용될 수 있습니다. 또한, 농업 관련 교육 자료 및 연구에 중요한 기초 자료로도 쓰일 수 있습니다. 이 데이터는 다음과 같은 구조로 이루어져 있습니다. 재배순번(숫자형): 농작물의 재배 순서를 의미하며, 정보번호(숫자형): 각 농약 정보의 고유 번호를 나타냅니다. 농약종류코드(문자형): 농약의 종류를 구분하는 코드이고, 농약명(문자형): 사용되는 농약의 이름을 포함합니다. 사용시기내용(문자형): 농약 사용의 적절한 시기를 안내하며, 사용횟수(숫자형): 해당 농약을 사용할 수 있는 횟수를 명시합니다. 비고(문자형): 추가적인 정보가 기재되어 있습니다. 이러한 정보를 통해 농업인들은 보다 효율적이고 안전한 농사 활동을 진행할 수 있습니다.'
