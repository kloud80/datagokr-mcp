summary_user: 국립자연휴양림별 예약 건을 기관(휴양림) 이름·아이디, 예약 상품명, 숙박일자, 예약 상태(확정·대기·취소 등) 단위로 담은 건별 예약 자료로, 포털 설명상 2023년 3월 15일부터 2024년 2월 28일까지의 전국 휴양림 예약을 대상으로 한다. 휴양림 운영자나 분석가가 "어느 휴양림의 어떤 객실이 어느 날짜에 예약이 몰리고 취소가 잦은가"처럼 숙박 수요와 성수기를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 휴양림·시설 데이터와는 기관명(insttnm)이나 같은 기관의 기관아이디로 이름·코드를 맞춰 연결해야 한다.
limits: 표준 조인 키나 좌표가 없어 주소·위치 기반 결합은 직접 이름 매칭이 필요하고, 행정구역 단위 공간 분석은 이 데이터만으로는 안 된다. 개발계정은 하루 1,000회 호출로 제한된다.
