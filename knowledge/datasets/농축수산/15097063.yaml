description_portal: 이 데이터셋은 제주특별자치도 관할 지역에서 등록된 축종별 농업경영체 중 ‘농업법인’을 대상으로 한 현황 자료로, 각 축종별 농업법인 수 및 이들이 운영 중인 사육 규모 정보가 포함되어 있습니다. 농업법인은 개인이 아닌 법인 형태로 농업·축산업을 수행하는 단위로, 이 데이터를 통해 법인 중심의 축산업 구조, 축종별 산업 분포, 대규모 사육 현황 등을 파악할 수 있습니다. 이러한 정보는 축산 정책 수립, 산업 구조 분석, 축산업 지원 계획, 지역 농업법인 현황 조사, 공급망 구조 이해 등을 위해 활용될 수 있으며, 데이터는 CSV 형식으로 무료 제공됩니다.
