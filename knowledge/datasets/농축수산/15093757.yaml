description_portal: 1. 데이터 설명본 데이터는 남원시에서 추진 중인 길고양이 TNR(Trap-Neuter-Return) 사업의 체계적 관리를 위해 구축된 동물보호관리카드 정보입니다. 포획된 길고양이의 기본 정보부터 중성화 수술, 방사까지의 전 과정을 상세히 기록함으로써 지역 내 길고양이 개체 수를 조절하고 동물복지를 향상시키는 것을 목적으로 합니다. 수의사와의 협력을 통한 중성화 수술 현황, 캣맘 등 시민참여자들의 활동 지원, 입양 연계 등 종합적인 동물보호 정책 추진에 활용되며, 과학적이고 체계적인 길고양이 관리 정책 수립을 위한 기초자료로 활용됩니다.2. 데이터 항목명관리번호, 포획일시, 축종, 품종, 색상, 성별, 체중, 나이, 중성화수술 여부, 중성화수술 병원, 중성화수술 일시, 방사일시, 방사장소3. 기대효과이 데이터는 지역사회의 길고양이 개체 수 조절과 동물보호 정책의 효율성을 높여 인간과 동물이 조화롭게 공존하는 건전한 도시환경 조성에 기여할 것입니다. 더불어 데이터 기반의 정확한 현황 파악을 통해 예산 배정과 정책 수립의 합리성을 크게 향상시킬 수 있습니다.
