summary_user: 국립해양조사원이 우리나라 관할해역 조석 예보지점별로 예측일시와 조위 높이를 시계열로 담은 예보 데이터이며, 예보지점명과 위도·경도가 함께 붙고 범위는 전국 개별 지점 단위다. 낚시객·어업인·항만 운영자가 '이 항구 근처 내일 몇 시에 물이 얼마나 차고 빠지나'를 확인하거나, 연구자가 지점별 조위 변화를 분석하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 예보지점 코드·지점명을 같은 기관(KHOA) 관측소 코드에 맞추거나 위도·경도(lat, lot) 좌표로 근접 매칭해 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 우리나라 관할해역 조석 예보지점의 시계열 조석 정보(조위, 시각)를 제공하기 위해 수집한 데이터 입니다. 예보지점 코드, 요청일자, 시간 간격을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 예보지점명, 예측일시, 예보지점의 위도/경도 위치정보 및 조위 높이 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
