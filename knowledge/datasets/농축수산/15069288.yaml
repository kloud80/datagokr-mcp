summary_user: 산림탄소상쇄제도로 등록된 산림탄소상쇄사업을 사업 한 건당 한 행으로 담은 전국 단위 파일(CSV)이다. 사업번호·등록일·사업유형·산림경영유형·사업자·대상지 주소·면적(ha)·예상 총/연간 흡수량·인증서등록번호·모니터링 최종차수가 들어 있다. 기업 ESG 담당자나 분석가가 "우리 지역에서 어떤 유형의 산림탄소상쇄사업이 진행 중이고, 예상 흡수량은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 산림 자원 데이터(임상도·국가산림자원조사 등)와는 대상지 주소나 사업자명을 이름으로 맞춰 이어 쓴다.
description_portal: 산림탄소상쇄제도에 따라 산림에서 이산화탄소를 흡수한 양을 등록하고, 제3자 검증을 거쳐 최종적으로 인증된 결과를 기록한 데이터입니다. 이 정보는 산림탄소상쇄사업의 실질적 흡수 성과와 해당 사업의 정당성을 확보하기 위해 필수적으로 관리되며, 사업명, 인증 연도, 인증 흡수량(tCO₂), 인증일, 검증기관, 사업 위치 등 다양한 항목을 포함합니다. 본 데이터는 탄소흡수량 평가, 온실가스 감축 실적 보고, 환경 인증 활용, 배출권 거래 준비, 산림기반 기후변화 대응 정책 수립 등 다양한 분야에서 활용됩니다.
