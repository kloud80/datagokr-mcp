summary_user: 경기도 시군별·해면/내수면 구분별로 어가 유형(전업, 1종겸업, 2종겸업)의 가구 수와 그 인구 수, 어업 종사자 수를 집계일자 기준으로 담은 집계 통계다. 경기도 어느 시군에 전업어가나 내수면 어업 인구가 많은지 비교해 어업 지원·어업인 복지 대상을 가늠하려는 정책 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(SIGUN_NM)이나 시군코드 같은 경기도 기관 코드로 다른 경기도 시군 통계와 이름·코드 매핑해 잇는다.
description_portal: 경기도 내 어가 및 어가인구 수 집계 현황입니다. 해면내수면구분, 전업어가수, 겸업어가수(1종, 2종), 어업종사자수 등의 정보를 제공합니다.이 데이터는 대한민국 각 시군별 어가 수 및 어업 종사자 인구에 대한 집계 현황을 정리한 자료로, 집계일자, 시군명, 해면·내수면 구분, 어가 유형별 가구 수(전업어가, 1종겸업어가, 2종겸업어가), 해당 어가의 인구 수(호 기준), 전체 어업 종사자 수 등의 항목으로 구성되어 있습니다. ‘해면’은 바다 어업을, ‘내수면’은 하천·호수 등을 기반으로 한 어업을 의미하며, ‘전업어가’는 주 수입원이 어업인 가구를 나타냅니다. 이 데이터는 지역별 어업 활동 특성 파악, 어업 지원 정책 수립, 해양 및 수산자원 관리, 어업인 복지 정책 설계 등에 활용될 수 있으며, 특히 내수면과 해면 어업의 구분을 통해 다양한 형태의 지역 어업 실태를 비교 분석할 수 있습니다. 데이터는 해양수산부 또는 지자체의 수산 관련 행정 시스템을 기반으로 수집된 공공통계 자료입니다.
