description_portal: 이 데이터는 해양수산부에서 수출입 월단위 집계 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 집계년도, 집계월, 보고서번호, 기관코드, 집계시점, 집계여부, 프로시저실행내역, 최초생성시점, 최종변경시점 등으로 구성되어 있습니다.  본 데이터는 해양수산부의 수출입 관련 월별 통계자료 취합, 수출입 흐름 분석, 관련 기관 간 협업 자료로 활용할 수 있으며, 기업에서는 연도별 및 월별 수출입 추세 파악, 내·외부 감사자료 참고, 정책 연구자료로 사용할 수 있습니다. 또한 관련 통계 서비스 구축, 행정 보고서 작성, 해양수산 정책 수립 참고용 자료로도 활용할 수 있습니다.
