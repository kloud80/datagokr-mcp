summary_user: 한국해양교통안전공단이 2025년 1월 1일부터 12월 31일까지 검사한 여객선·화물선·예선·유조선 등 일반선박을 건별로 정리한 파일로, 선박마다 총톤수·길이·너비·깊이·선질·용도·세부용도·선적항 같은 제원을 담는다(전국 범위, CSV 약 0.7MB). 해양교통 정책 담당자나 분석가가 '지난해 검사받은 일반선박 중 선적항별·용도별로 어떤 선종이 몇 척이고 톤수 분포는 어떤가'를 집계하는 데 쓴다. 실측 컬럼에 선박번호 같은 전역 조인 키가 없어, 다른 데이터와는 선적항 이름이나 용도 명칭을 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 한국해양교통안전공단이 2025년도에 수행한 일반선박 검사현황을 정리한 자료이다. 일반선박에는 여객선, 화물선, 예선, 유조선 등 다양한 선종이 포함되며, 주요 항목은 총톤수, 길이, 너비, 깊이, 선질, 용도, 세부용도, 선적항 등으로 구성되어 있다. 본 데이터는 일반선박의 제원 및 용도에 관한 정보를 제공하며, 검사 합격 여부나 세부 검사결과는 포함되어 있지 않다. 이 자료는 선박의 기본적 특성과 활용 목적을 파악하는 데 활용될 수 있으며, 해양교통 정책 수립, 선종별 통계 분석, 민원 응대 등 행정업무의 기초자료로 참고할 수 있다. 관계 기관 및 일반 국민이 일반선박 정보를 명확히 파악하고 해양안전 관련 업무에 참고할 수 있도록 구성하였다. 본 데이터는 2025년 1월 1일부터 2025년 12월 31일까지 수행된 일반선박 검사현황을 2026년 6월 17일 기준으로 추출한 자료이다.
