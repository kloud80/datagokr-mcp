description_portal: '- 전라남도 귀농,귀촌 가구현황(시군별, 연도별 귀농, 귀촌, 가구 현황)에 관한 데이터를 조회하실 수 있습니다.- "귀농"과 "귀촌"은 도시에서 농촌으로 이주하는 것을 의미하지만, 목적과 성격에 따라 구분됩니다.- 귀농(歸農) 정의: 농사를 짓기 위해 도시에서 농촌으로 이주하는 것. 목적: 농업을 생업으로 삼기 위한 이주. 주 대상자: 은퇴자, 조기 퇴직자, 농업에 관심 있는 청년층 등. 필요 조건: 농지 확보, 농업 기술 및 지식 습득 등- 귀촌(歸村) 정의: 농사를 짓지 않더라도, 농촌의 삶을 선택해 정착하는 것. 목적: 조용한 환경, 자연 속 삶, 공동체 문화 등을 위한 이주. 주 대상자: 원격 근무자, 퇴직자, 자연 친화적 삶을 원하는 사람 등.- 귀농과의 차이점: 생계를 농업으로 하지 않아도 됨.  작은 사업, 예술 활동, 온라인 직업 등과 병행 가능.'
