summary_user: 농림축산검역본부가 관리하는 도축검사실적을 월(YM)·시도·도축장·축종 단위로 집계해 당월 실적과 누계를 담는 전국 범위 데이터다. 축산업계·연구자·지자체가 '이 지역 도축장에서 이번 달 소·돼지가 몇 마리 도축됐고 올해 누계는 얼마인가' 같은 질문에 쓴다. 전역 조인 키는 없어 시도 코드(CTRD_CODE)나 축종 코드(LVSTCKSPC_CODE), 도축장 이름으로 같은 기관 자료나 축산물 가격 자료와 맞춰 이어 쓴다.
