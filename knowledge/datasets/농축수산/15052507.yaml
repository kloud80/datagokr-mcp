summary_user: 국립농산물품질관리원이 정부 수매 등 국가검사 대상인 하곡·추곡을 검사한 실적을 연도·품목·행정구역·업무구분별 수량과 수량단위로 담은 집계 데이터이며, 범위는 전국입니다. 농업 분석가나 연구자가 특정 연도에 어느 지역에서 어떤 곡물이 얼마나 검사됐는지, 연도별 검사 물량이 어떻게 바뀌었는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·행정구역명 같은 이름을 매핑해 연결해야 하고, KAMIS 등 가격 데이터와 붙일 때는 품목코드 체계가 서로 달라 별도 매핑이 필요하다.
description_portal: 농산물 검사는 농산물에 대한 국가검사를 실시함으로써 농산물의 품질향상, 공정 원활한 거래 및 소비의 합리화를 도모하여 국민경제 발전에 기여하기 위하여 추진하고 있으며, 검사대상농산물은 정부가 수매하거나 생산자단체등이 정부를 대행하여 수매하는 농산물, 정부가 수출·수입하거나 생산자단체 등이 정부를 대행하여 수출·수입하는 농산물, 정부가 수매 또는 수입하여 가공한 농산물 등이 있습니다. 본 정보는 국립농산물품질관리원에서 관리하는 하추곡 검사 실적으로서, 구분명, 년도, 품목명, 행정구역명, 업무구분명, 수량단위, 수량으로 구성된 데이터입니다.
