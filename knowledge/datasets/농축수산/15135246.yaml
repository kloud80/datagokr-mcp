description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에 위치한 식용곤충 관련 사업체들의 현황을 체계적으로 정리한 자료입니다. 4차 산업혁명 시대의 미래 식량자원으로 주목받고 있는 고소애, 굼벵이, 쌍별귀뚜라미 등 식용곤충을 생산·가공·판매하는 기업들의 기본 정보를 담고 있습니다. 이 데이터는 친환경적이고 고단백 식품으로서의 식용곤충 산업 현황을 분석하고, 관련 정책 수립 및 산업 육성 전략 마련을 위해 구축되었습니다.2. 데이터 항목명- 사업장명- 업종- 소재지- 주소- 전화번호3. 기대 효과식용곤충 산업의 체계적인 관리와 육성을 통해 미래 식량 안보를 확보하고 친환경 단백질 공급원을 다양화할 수 있습니다. 더불어 지역 내 신산업 발굴, 농가 소득 증대, 관련 창업 활성화 등 지역경제 발전에 긍정적인 영향을 미칠 것으로 기대됩니다.
