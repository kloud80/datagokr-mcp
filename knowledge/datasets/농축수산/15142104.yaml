description_portal: 충청북도 단양군의 내수면 어업허가 현황으로 2014년부터 2025년까지 자망, 각망, 투망 및 가물치, 동자개 생산량 등을 정리한 데이터입니다. 각 연도별 자망, 각망, 투망의 허가 및 신고 수와 가물치, 동자개, 대농갱이, 메기, 뱀장어, 블루길, 큰입우럭, 붕어, 빙어, 쏘가리, 은어, 잉어, 피라미, 기타어류, 다슬기의 킬로그램 및 원단위 생산량 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 지역 내수면 어업허가 현황  파악, 분석 및 연구자료로 매우 유용하게 활용 될 수 있습니다. 데이터기준일자는 2025년 2월 25일입니다. 담당부서는 단양군청 농림환경국 농업축산과이며 문의주시면 최신의 충청북도 단양군 내수면 어업허가 현황 내역을 열람하실 수 있게 도와드립니다
