summary_user: 국립농산물품질관리원이 농산물 표준규격품 출하 사후관리 결과를 연도별·관할기관별로 집계한 데이터로, 조사개소수·조사건수·조사수량과 부적격 건수·수량을 담으며 범위는 전국이다. 표준규격 정책 담당자나 분석가가 "관할기관별로 조사 대비 부적격 비율이 어떻게 달라지고 해마다 어떻게 변했는가"를 확인하고 보고서를 쓰는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 관할기관 이름을 맞춰 연결해야 하며, KAMIS 가격 데이터와 이어 쓰려면 별도 매핑이 필요하다.
description_portal: 농산물표준규격관리란 농산물을 통일된 기준에 맞도록 선별·포장하여 등급을 분류하고 규격 포장재로 출하하는 것으로 국립농산물품질관리원에서는 실제 기준에 맞도록 출하되고 있는지 사후관리 업무를 진행하고 있는데 본 정보는 연도별 관할기관별 조사개소수, 조사건수, 조사수량, 부적격수, 부적격수량을 집계하여 제공하고 있습니다. 조사건수별 부적격 수량 비교 등 정보를 활용하여 규격품 출하가 어느 정도이루어지고 있는지에 대한 현황을 파악하여 표준규격 관련 각종 보고서 작성 등에 활용이 가능할 것으로 기대됩니다.
