summary_user: 국내 산 3,368개(제목 기준)에 대해 산 이름, 소재지 주소, 높이, 관리 주체, 개요·상세 설명, 이미지 정보를 산 한 곳 단위의 건별 목록으로 담은 전국 범위 API이며, 100대 명산은 상세 설명이 추가된다. 등산객이나 관광 콘텐츠 제작자가 '어느 지역에 높이 몇 m의 어떤 산이 있고, 탐방 코스와 볼거리는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 산 이름이나 소재지 주소(mntiadd)를 맞추는 방식, 또는 산림청의 다른 데이터와 기관 코드로만 연결한다.
description_portal: 우리나라 산에 관한 정보 제공 서비스는 산 이름, 산의 상세정보, 산 높이 등 기본적인 지리·환경 정보를 담고 있으며, 이를 통해 각 산의 자연적 특성과 탐방 여건을 확인할 수 있습니다. 특히 100대 명산으로 지정된 경우에는 관련 상세 설명이 추가로 제공되어 산의 역사적·문화적 가치, 생태적 중요성, 주요 탐방 코스와 볼거리 등을 한눈에 알 수 있습니다. 이러한 자료는 국민이 산행을 계획하거나 관광 자원으로 활용할 때 유용하며, 동시에 산림 관리와 보존 정책의 기반이 됩니다. 또한 지역별 분포와 관리 체계에 관한 정보까지 함께 제공되어 행정적 활용도 높습니다.
