        - 강원특별자치도 인제군 상남면 상남리
      op: /mntInfoOpenAPI2
      stats:
        unique: 931
    - name: mntiadmin
      type: string
      null_rate: 0.0
      sample_values:
        - 공주시청
        - 정선군청
