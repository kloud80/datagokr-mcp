description_portal: 이 자료는 서귀포시에서 허가된 다양한 어업권 현황을 정리한 데이터로서, 어업권 유형(마을어업, 정치어업, 협동양식, 양식어업), 대상 구분(해조류·패류·어류 등), 시군구 위치, 어업권 건수 및 어장 면적(헥타르) 등의 핵심 항목을 담고 있어요. 행정기관은 이 정보를 바탕으로 해양자원 관리, 어업권 할당 규모, 어장 공간 활용 현황, 양식업 발전 계획 및 어업의 지속가능성 평가 등에 활용할 수 있고, 어민 사회에서는 자신의 어업권 범위나 허가 상태, 어장 면적으로 권리 및 활동 기반 이해에 유용해요. 또한 해양환경 변화, 자원 고갈 위험, 보존대상 어장 지정 여부 등의 환경·어업정책 결정에도 중요한 기초자료가 됩니다.
