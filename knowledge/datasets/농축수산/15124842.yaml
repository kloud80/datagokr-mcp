summary_user: 서귀포시에서 면허된 어업권을 면허번호 단위로 한 건씩 담은 파일로, 어업의 종류·읍면동·어장위치·양식물 종류·어업방법·면적(제곱미터)·면허 시작일과 완료일을 담는다(csv 약 6.7KB, 시군구 범위). 어민이나 수산 분석가가 "우리 마을 앞바다 어장의 면허가 언제 끝나고 면적은 얼마인가"처럼 특정 어장의 면허 기간과 규모를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 없어서, 다른 데이터와는 읍면동 이름이나 면허번호를 직접 맞춰 보는 방식으로만 이어 쓴다.
limits: 표준 행정코드나 사업자번호 같은 공통 키가 없어 다른 기관 데이터와 자동으로 결합하기 어렵다. 범위는 서귀포시 한 곳뿐이라 제주도 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다.
