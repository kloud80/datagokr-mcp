description_portal: 본 자료는 가축위생방역지원본부 예찰원이 전국 축산농가를 대상으로 실시한 전화예찰 결과를 집계한 시군별·축종별 임상증상 발생 현황입니다. 예찰원은 농가와의 통화를 통해 사육 중인 가축의 건강 상태와 임상증상 유무를 확인하고, 해당 정보를 전산에 기록하여 조기 질병검색 체계를 강화하고 있습니다. 자료에는 도본부 및 사무소, 시군, 축종, 발견일자, 사육두수, 이상두수, 임상증상 종류, 그리고 임상증상에 따른 조치방법이 포함되어 있습니다. 임상증상은 설사, 폐사, 선회증상 등 가축전염병 발생 가능성을 조기 감지할 수 있는 주요 지표로 활용되며, 전화예찰 결과는 지역별 질병 발생 동향을 신속히 파악하는 데 기여합니다. 또한, 해당 데이터는 가축질병 예방예찰과 더불어 농가 자율방역 의식을 제고하고, 시군별 방역정책 수립 및 긴급 대응계획 마련에 활용됩니다. 특히, 발견된 임상증상과 조치방법의 연계분석은 향후 가축전염병 예방·통제 및 재난대응 역량 강화를 위한 중요한 기반자료로 제공됩니다.자세한 사항은 가축위생방역지원본부 방역사업부에서 확인하실 수 있습니다.044-550-5560
