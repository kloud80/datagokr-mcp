description_portal: 이 데이터는 해양수산부에서 연안정비 사업의 일환으로 연안침식 백사장 면적 변화 현황을 파악하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 시도별 변화지역번호, 변화시작 및 변화 종료년도, 변화한 백사장의 면적과 잠식된 면적/너비 및 퇴적면적과 너비 값 등 정보로 구성되어 있습니다.  본 데이터는 관련 기관에서 연안 침식 모니터링, 백사장 복원·관리방안 정책 수립, 연안재해 예방사업 기획, 해안환경 변화의 과학적 분석, 연안관광 계획 수립 등 업무를 위한 참고 자료로 활용될 수 있습니다.
