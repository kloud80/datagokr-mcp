summary_user: 제주 사려니숲길-1(절물휴양림 방향) 무장애여행 코스의 지점별 위도·경도·해발고도와 장소 설명·이미지 정보를 담은 건별 원천 데이터다. 휠체어 이용자·고령자 동반 여행객이나 관광 서비스 개발자가 '이 숲길의 무장애 동선이 어디로 이어지고 지점별 고도 차는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 좌표(위도·경도)로 지도·주변 시설 데이터와 겹쳐 보거나, 같은 기관의 다른 무장애여행 코스와 이름으로 묶어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 사려니숲길-1(절물휴양림방향) 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 사려니숲길-1은 제주시 절물휴양림 방향을 출발점으로 하는 무장애 여행 코스 정보로, 숲속 자연 환경 속에서 접근성을 고려한 산책 동선과 편의시설 정보를 제공한다. 이 코스에는 장애인 전용 주차장, 경사로 및 무장애 데크길, 장애인 화장실 등이 정비되어 있어 휠체어 이용자·교통약자·고령자도 이용이 가능한 열린관광지로 설계되었다. 삼나무 중심의 울창한 숲과 완만한 지형 덕분에 보행 약자 또는 가족 단위 방문객도 부담 없이 자연을 체험할 수 있으며, 관광 접근성 강화와 무장애 관광지 확대, 정책 수립 및 관광 서비스 개선을 위한 기초 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
