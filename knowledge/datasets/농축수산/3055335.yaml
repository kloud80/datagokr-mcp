summary_user: 국립농산물품질관리원이 받은 농산물 검정 신청 현황을 신청 건 단위로 담으며, 신청일자·품목·종류·생산지·검정항목(수분·단백질·발아율·이물 등)·검정기관으로 구성되고 범위는 전국이다. 분석가나 업계 관계자가 "어느 생산지·품목에서 어떤 검정 신청이 언제 많았나"처럼 기간·생산지·검정기관·품목별 검정 현황을 집계해 보고서에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·생산지 이름을 매핑해야만 이을 수 있고, KAMIS 등 가격 데이터와 연결할 때도 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 농산물의 원산지, 품질, 성분 등과 관련하여 국립농산물품질관리원이 검정 신청을 받은 현황 정보로서, 검정 신청일자, 농산물 품목, 농산물 종류, 생산지, 검정 항목, 검정기관 항목으로 구성되어 있습니다. 품목 및 종류에 따라 수분, 단백질, 발아율, 이물 등의 검정 항목이 존재합니다.  농산물 검정정보에 관심이 많은 사용자는 기간별 검정현황, 생산지별 검정현황, 검정기관별 검정현황, 품목별 검정현황 등 다양한 정보를 통계 데이터를 작성하여 관련 보고서 작성 등에 참고자료로 활용이 가능할 것으로 기대됩니다.
