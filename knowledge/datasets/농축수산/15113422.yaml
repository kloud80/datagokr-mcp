description_portal: 이 데이터는 남해에 위치한 등부표 정보를 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 남해 해역 내 각 등부표 자료 출처, 위치, 좌표, 명칭 등으로 구성되어 있습니다.  본 데이터는 해양수산부에서 남해 일대 항로를 안전하게 관리하고, 선박 운항 시 암초나 수심이 얕은 구역 등 해상 장애물의 위치를 식별하여 사고를 예방하는 데 활용될 수 있습니다. 또한 해운·항만 분야의 연구, 해상 교통 관제 시스템 개발, 해양 공간 관리와 해저 지형 분석, 해양 안전 정책 수립 등의 업무에도 활용될 수 있습니다.
