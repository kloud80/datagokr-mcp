description_portal: 충청북도 옥천군_귀농귀촌지원정책 현황 데이터는 옥천군에서 귀농·귀촌인의 안정적인 정착을 돕기 위해 시행하는 각종 지원정책 정보를 집약한 공공데이터입니다. 이 데이터는 사업명, 대상 및 자격조건, 지원기준(지원금액, 지원 내용, 한도 등), 데이터 기준일 같은 항목으로 구성되어 있으며, 매년 최신 내용으로 갱신됩니다. 옥천군의 주요 정책으로는 농업창업 및 주택구입 융자지원(농업창업 최대 3억원, 주택구입·신축 7,500만원 한도), 주택수리비 지원(1세대 당 500만원 한도), 농기계 구입비 지원, 시설하우스 신축지원(1곳당 최대 1,150만원), 농지구입 취득세 지원, 귀농인의 집 임대(최대 1년), 농업인 공익수당 지급(연 60만원 지역화폐), 여성농업인 행복바우처(연 20만원), 각종 영농·정착교육 등이 포함됩니다.데이터는 파일(CSV 등) 및 OpenAPI(JSON, XML) 방식 모두로 무료 제공되며, 제공기관은 옥천군청 행정과입니다. 누구나 공공데이터포털에서 바로 내려받아 활용할 수 있어 접근성이 뛰어납니다. 본 데이터는 귀농귀촌 지원 정책 현황의 행정 관리, 정책 수립, 지역 실태 조사, 귀농귀촌 희망자 대상 안내자료, 연구 및 민간 활용 등 다양한 목적에 쓰입니다. 정책별 지원 자격 및 조건, 최신 지원 내역 등 실무에 필요한 상세 정보를 빠짐없이 제공한다는 점에서 실제 수요자와 연구자, 행정기관 모두에게 유익한 자료로 평가됩니다
