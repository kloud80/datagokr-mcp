summary_user: 경기도 31개 시군의 종오리업(번식용 오리·씨알 생산·판매, 위탁사육) 사업장을 한 곳씩 담은 인허가 원천 목록으로, 사업장명·인허가일자·폐업일자·영업상태·도로명/지번 주소·면적·종업원수를 담는다. 방역 담당자나 축산 분석가가 '우리 시군에 지금 영업 중인 종오리 사업장이 어디에 몇 곳 있는가'를 확인하거나 지역별 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소 문자열로 다른 경기도 축산업 인허가 자료나 행정구역 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 종오리업체의 현황을 수록한 자료로, 번식용 오리 또는 씨알을 생산하여 판매하거나 위탁사육을 하는 사업체 정보를 제공합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태명, 소재지 도로명 및 지번주소, 우편번호, 면적, 총종업원수, 축산업무구분명, 축산물가공업구분명 등으로 구성되어 있습니다. 해당 데이터는 오리 사육과 부화산업 관련 업체의 인허가 및 운영 현황을 파악하는 데 활용되며, 지역별 종오리 산업 분포 분석, 방역 및 사육시설 정책 수립, 가축 번식 기반 연구 등의 목적으로 활용 가능합니다. 데이터는 행정안전부에서 제공되며, 31개 시군의 인허가 정보를 포함하고 있습니다.
