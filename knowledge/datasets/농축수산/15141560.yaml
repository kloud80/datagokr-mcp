description_portal: 이 데이터는 해양수산부에서 해도 제작 및 해양 안전 관리 목적으로 수집된 해양수산부_노출암 데이터입니다.  본 데이터의 주요 내용은 고조와 저조에 관계없이 항시 해수면에 노출되는 해상의 바위에 관한 정보로, 노출암의 일련번호, 좌표, 해도번호 등 정보를 포함하고 있습니다.  본 데이터는 해도 제작과 갱신, 선박 항로 계획, 해양 구조물 설치를 위한 입지 선정, 연안 개발 사업 및 해양 사고 예방을 위한 해양 공간 정보 관리에 활용될 수 있습니다. 또한, 해양 관련 연구기관에서는 노출암 분포 분석이나 연안 지형 변동 연구, 해양 환경 변화 모니터링에도 활용할 수 있습니다.
