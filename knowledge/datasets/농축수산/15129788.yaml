summary_user: 해양수산부가 해양사고 방지를 위해 지정한 시운전금지해역을 해역 단위로 담은 파일로, 근거 법령·고시기관명·고시일자와 해역의 공간정보(경계)·공간정보일련번호를 전국 범위로 수록한다(CSV 약 100KB). 선박 시운전을 계획하는 조선소·해운사가 '이 해역에서 시운전해도 되는가'를 확인하거나, 해상풍력 등 해양공간 입지를 검토하는 분석가가 규제 해역을 겹쳐 보는 데 쓴다. 전역 공통 조인 키는 없어서, 다른 해양용도구역·보호구역 데이터와는 공간정보를 이용한 위치 중첩이나 기관명·법령명 매칭으로만 연결한다.
description_portal: 이 데이터는 「해사안전법」 제14조의2에 따라 해양사고를 방지하기 위한 시운전금지해역을 지정하고 관리할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 관련 관계법령, 고시기관명, 고시일자 및 시운전금지해역의 공간정보 및 공간정보일련번호로 구성되어 있습니다.  본 데이터는 해양수산 관련 업무를 담당하는 행정기관에서 해양사고 예방 정책 수립이나 특정 해역 내 시운전 관련 행정 절차에 활용될 수 있으며, 해운업계에서는 선박 운항 계획 수립 시 참고 자료로 사용할 수 있습니다.
