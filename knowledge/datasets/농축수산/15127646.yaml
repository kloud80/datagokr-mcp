summary_user: 한국농어촌공사 농지연금에 가입한 계약의 가입연도, 가입 당시 연령대(60대~90대), 계약자 소재지 시군구, 지목(답·전·과수원), 면적(㎡), 월지급금(원)을 담은 전국 범위 CSV 파일(약 1.7MB)이며, 포털은 2012~2025년 계약정보를 자료년도별 통계로 제공한다고 설명한다. 정책 분석가나 농업인이 '어느 시군구에서 어떤 연령대가 얼마나 넓은 논·밭을 담보로 매달 얼마를 받는가'처럼 지역·연령별 가입 추이와 지급 수준을 살피는 데 쓴다. 전역 조인 키(PNU 등)는 없어서, 다른 농지·인구 통계와는 시군구 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: '- 한국농어촌공사 농지연금사업은 농업인이 소유한 농지를 담보로 노후생활안정자금을 매월 연금방식으로 지급하여 농업인의 노후생활안정을 지원하는 사업입니다.- 한국농어촌공사 농지연금사업은 농업인이 소유한 농지를 담보로 가입방식에 따라 최대 300만원까지 월 지급금이 계산됩니다.- 본 개방데이터는 한국농어촌공사 농지연금사업에 가입한 가입자의 계약정보로 가입연도, 가입연령대, 지역, 지목, 면적, 등 2012년부터 2025년까지 계약정보 자료년도별 통계데이터로 제공합니다.*데이터 항목 설명 가입년도 : 농지연금사업 가입 당시 년도 가입당시 연령   - 60~69 : 60대  - 70~79 : 70대  - 80~89 : 80대  - 90~99 : 90대 면적 : 제곱미터(㎡) 지목 : 답, 전, 과수원 월지급금 : (원)'
