description_portal: '[한국농수산식품유통공사] KAMIS 농산물유통정보 가공식품 소매가격 일별 정보로 시장조사 용역이 매일 시장에 나가 가공식품의 가격을 조사한 결과를 정보로 제공 - 즉석밥, 두부, 김치, 고추장, 된장, 간장, 맛김(조미김), 콩나물aT(한국농수산식품유통공사)는 ‘83.4월부터 국내 농수산물의 유통질서 확립, 수급조절 및 가격안정 정책수립 등을 위한 목적으로 유통정보 조사활동을 수행해오고 있으며, aT가 조사한 유통정보의 효율적인 분산을 통한 정보수요자의 유통에 관한 이해증진 및 정보활용도 제고를 위해 ’03.4월부터 Kamis(농수산물 유통정보) 홈페이지를 구축하여 서비스 중에 있습니다.Kamis 유통정보는 전국 주요 도·소매시장 대상으로 매일(토·일·공휴일 제외) 가격을 조사하여 공개하는 농수산물 도·소매가격정보부터 거래동향/전망, 알뜰장보기 물가정보, 성수품·제철농산물 정보 등 농수산물의 유통과 관련한 다양하고 특화된 정보 서비스가 가장 큰 특징입니다.aT는 유통정보 제공을 통해 농수산물 거래주체(생산·유통·소비자) 등의 시장출하 및 매매에 관한 의사결정과 합리적인 소비를 지원하고 있으며, 최근에는 가격정보 Open-API 제공을 통해 민간기업의 신규 비즈니스 창출에도 기여하고 있습니다.'
