summary_user: 일본과 중화권(중국·마카오·홍콩·대만)을 대상으로 2012~2021년 10개년 농식품 수출 실적과 2021년의 전년 대비 증감률을 정리한 연도별 집계 통계로, 건별 원천 자료가 아니며 공간 정보 없이 전국 단위로 담는다. 수출 지원 담당자나 농식품 수출기업이 '지난 10년 동안 일본과 중화권 수출이 늘었는가, 줄었는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 수출·가격 자료와 함께 쓰려면 국가명과 연도로 맞춰야 하고, 품목코드는 KAMIS·HS·KOSIS마다 달라 별도 매핑이 필요하다.
description_portal: 해당 데이터는 일본 및 중화권(중국, 마카오, 홍콩, 대만) 지역을 대상으로 2012년부터 2021년까지 10개년에 걸친 농식품 수출 실적 및 전년 대비 2021년 수출실적 증감률 등을 정리한 통계자료입니다. 이를 통해 해당 지역의 연도별 농식품 수출 동향과 시장 규모, 수출 증가 및 감소 추세를 파악할 수 있으며, 주요 수출 품목과 국가별 수출 구조, 경쟁력 및 성장 잠재력을 분석할 수 있습니다. 또한, 국내 농식품 산업의 해외시장 확대 전략 수립, 정책 결정, 수출 지원 프로그램 설계 등 다양한 분야에서 기초 자료로 활용 가능하며, 정책 담당자, 연구기관, 기업 등 농식품 관련 이해관계자들이 실질적 의사결정과 전략 수립에 참고할 수 있는 중요한 자료입니다.
