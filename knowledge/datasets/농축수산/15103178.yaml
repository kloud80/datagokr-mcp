description_portal: 한국수목원정원관리원은 수목원 기반의 연구성과를 체계적으로 관리하고 지식재산 활용을 촉진하기 위해 특허 출원·등록 현황 정보를 개방형 데이터로 제공합니다. 본 데이터는 출원 및 등록된 특허 정보를 포함하며, 주요 항목으로는 출원명칭, 출원번호, 출원일, 등록번호, 등록일, 출원인 등이 포함됩니다. 특히 유효성분 추출, 천연물 기반 조성물, 식물 추출물 등을 활용한 발명 사례가 다수 포함되어 있어 수목을 기반으로 한 바이오·농업·의약 분야 특허의 현황을 파악할 수 있습니다.데이터는 CSV 형식으로 제공되며, 특허별로 분류된 정형화된 구조를 따릅니다. 각 특허 항목은 출원/등록 단계에 따라 구분되어 있으며, 출원/등록 일자 및 고유번호 외에도 출원인 소속, 발명 요약 등 참고 정보가 포함됩니다. 이를 통해 기관의 연구성과를 외부에서 분석하거나, 추출물 기반의 유효성분·조성물 연구 방향을 설정하는 데 활용할 수 있습니다.본 데이터는 수목원 기반 지식재산 분석, 특허 기술 동향 조사, 산업·학술 연구 등에 활용할 수 있습니다.기술이전 대상 발굴, 융복합 기술개발, 바이오소재 산업화 전략 수립 등의 목적으로 유관기관, 대학, 기업 등에서 폭넓게 사용할 수 있으며, 특히 식물자원 기반 고부가가치 기술 연구의 기초자료로 유용합니다.
