summary_user: 인천광역시의 연도별 농업진흥구역과 농업보호구역 면적(ha)을 담은 시 단위 집계 파일로, 필지별 원천이 아니며 파일 크기도 257바이트로 몇 개 연도 행만 있는 작은 표다. 인천시 농지 보전 정책 담당자나 분석가가 "인천의 농업진흥지역 면적이 해마다 얼마나 줄었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시도의 같은 통계나 인천시 농지전용 자료와는 연도 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: '인천광역시 연도별 농업진흥구역, 농업보호구역 면적에 관한 항목명으로 구성되어 있는 정보를 나타냅니다.* 면적(단위 : ha)<활용 목적>이 자료는 인천시의 농지 보전 정책 및 토지 이용 계획 수립의 핵심 기초 자료입니다. 농지 면적의 변화 추이를 분석하여 도시 개발과의 충돌을 관리하고, 농업 생산 기반 시설 투자 및 농촌 지역 개발 계획을 수립하는 데 중요한 정보를 제공합니다.인천시 농업 진흥 지역의 관리 현황 파악 및 농지 보전 정책 수립을 위한 핵심 기반 정보입니다.해당 데이터는 공공데이터포털에서 확인할 수 있습니다.'
