summary_user: 경기도 안의 가축분뇨 수집·운반업 사업장을 한 곳당 한 행으로 담은 건별 현황 자료로, 영업 중인 곳뿐 아니라 폐업·인허가 취소된 곳까지 시군, 사업장명, 인허가일, 영업상태, 폐업일, 주소·우편번호, 좌표를 포함한다. 축산농가나 시군 축산환경 담당자가 '우리 시군에서 지금 영업 중인 분뇨 수집·운반업체는 어디인가'를 확인하거나, 업체의 개업·폐업 흐름을 볼 때 쓴다. 다른 데이터와 바로 묶을 전역 조인 키는 없으므로, 시군코드(SIGUN_CD)나 주소·위경도를 기준으로 같은 경기도 데이터나 행정구역 자료에 이름·코드를 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 가축분뇨 수집 및 운반을 담당하는 업체의 사업장 현황을 정리한 자료로, 시군별 사업장 명칭, 인허가일자, 영업상태, 소재지 주소 및 우편번호 등 다양한 항목으로 구성되어 있습니다. 이 데이터는 현재 운영 중인 업체뿐 아니라 폐업 및 인허가 취소 이력을 포함하고 있어, 가축분뇨 처리와 관련된 환경관리 및 행정정보의 흐름을 파악하는 데 유용합니다. 주요 활용 분야로는 지역 축산환경 관리 정책 수립, 분뇨처리 기반시설 분석, 환경영업 종사자 관리, 위생관리 시스템 개선, 지속가능한 축산업 기반 조성 등이 있습니다.
