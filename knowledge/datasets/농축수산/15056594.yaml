summary_user: 경기도 31개 시군의 종돈업(번식용 돼지 생산·판매·사육위탁) 업체 인허가 정보를 사업장 한 곳씩 담으며, 인허가일자·폐업일자·영업상태, 소재지 주소와 위도·경도 좌표를 포함한다. 방역 담당자나 축산 분석가가 '경기도 어느 시군에 영업 중인 종돈업체가 몰려 있는가'를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 데이터와 맞춰 쓰며, 품목 가격 데이터(KAMIS 등)와 바로 이어지는 품목코드도 없다.
description_portal: 이 데이터는 경기도 내 종돈업체에 대한 인허가 현황을 담고 있으며, 번식용 돼지를 생산하고 판매하거나 타인에게 사육을 위탁하는 사업체의 정보를 제공합니다. 주요 항목은 시군명, 시군코드, 사업장명, 인허가일자, 폐업일자, 영업상태명, 축산업무구분명, 축산물가공업구분명, 소재지 도로명 및 지번주소, 우편번호, 소재지면적, 종업원 수, 위도·경도 좌표 등으로 구성되어 있습니다. 본 데이터는 돼지 번식 산업의 구조 분석, 방역 관리, 축산업 등록업체 모니터링, 정책 수립 등 다양한 축산 관련 행정 및 연구에 활용될 수 있습니다. 데이터는 행정안전부에서 제공하며, 경기도 31개 시군의 인허가 데이터를 포함하고 있습니다.
