summary_user: 2016년 이후 녹색자금으로 조성된 산림복지시설인 나눔숲을 시설 한 곳씩 담은 전국 단위 파일로, 구분·지역·관리기관명·주소·연락처를 담는다. 지자체 담당자나 분석가가 "우리 지역에 나눔숲이 어디에 있고 어느 기관이 관리하나"를 확인하거나, 지역별 분포를 보고 산림복지 사각지대를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 휴양·복지시설 데이터와는 주소·기관명 같은 이름 매칭으로만 연결한다.
description_portal: 해당 데이터는 2016년 이후 녹색자금을 통해 조성된 산림복지시설인 나눔숲의 조성정보를 담고 있습니다. 주요 항목으로는 조성연도, 관리기관, 사업명, 주소, 위도, 경도, 조성면적 등이 포함되어 있습니다. 이 데이터는 연도별 나눔숲 조성 현황과 지역별 분포를 파악하는 데 유용하며, 이를 기반으로 산림복지 인프라의 균형적인 확충과 사각지대 해소를 위한 정책 수립에 활용될 수 있습니다. 또한 조성면적과 위치정보를 통해 각 시설의 규모와 접근성을 비교 분석할 수 있어, 향후 유지관리 방안 마련 및 예산 배분의 합리성을 높이는 데 기초자료로 기능할 수 있습니다. 아울러 나눔숲의 사회적 가치 평가와 관련 연구에도 활용될 수 있는 데이터입니다.
