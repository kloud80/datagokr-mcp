summary_user: 한국마사회 경마공원(서울·제주·부산경남)과 장외 지사 등 사업장별로 경마요일에 따른 좌석 구매요일과 온라인 구매 시작·종료 시간을 담는 비공간 기준정보이다. 경마장이나 지사 좌석을 온라인으로 예매하려는 이용자가 '이번 주 토요일 경주 좌석은 어느 요일 몇 시부터 살 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명(branchName)을 이름으로 맞추거나 같은 기관의 다른 데이터와만 연결한다.
description_portal: 한국마사회 서울, 제주, 부산경남 경마공원을 포함한 지사의 경마요일에 따른 좌석구매요일과 구매시간 정보를 제공합니다. (제공정보는 사업장명(branchName), 경마요일(raceDay), 구매요일(purchaseDay), 온라인구매시작시간(onlineStartTime), 온라인구매종료시간(onlineEndTime) 자료입니다.) - 요청메세지에 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다. - 사업장 항목에는 강동, 강북, 광명, 광주, 구리, 대구, 대전, 도봉, 동대문, 부산동구, 부산연제, 부천, 분당, 서울파크, 선릉, 수원, 시흥, 안산, 영등포, 용산, 의정부, 인천남구, 인천부평, 인천연수, 인천중구, 일산, 제주파크, 종로, 중랑, 창원, 천안, 청담 자료 입니다.
