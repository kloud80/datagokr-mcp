description_portal: 성남시 내 축산농가 현황 데이터로, 시군명, 농장주,축종명,상세구분,사육두수,소재지도로명주소, 소재지지번주소 등의 항목으로 구성되어 있습니다. 성남시 축산농가 현황 데이터는 「축산법」 및 「가축전염병예방법」 등에 따라 성남시 관내에서 가축을 사육하거나 축산업을 영위하는 농가 및 업체의 등록·신고 정보를 체계적으로 정리한 자료입니다. 본 데이터는 가축 방역대책 수립, 축산 정책 지원 대상자 선정, 축산물 유통 기반 분석, 환경오염 관리(가축분뇨 처리 대상 파악) 등에 활용되며, 특히 도시지역인 성남시에서는 도심형 소규모 축산·가축사육 민원 관리, 도시농업과의 연계, 가축사육 제한구역 설정 등과도 밀접한 연관성을 가집니다.
