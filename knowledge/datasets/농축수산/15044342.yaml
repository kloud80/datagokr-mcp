summary_user: 한국농어촌공사가 관리하는 농업용 관정(농업용 지하수 개발시설)을 시설 한 곳당 한 행으로 담은 전국 단위 시설제원 파일로, 소재지·착공·준공년도와 함께 수혜면적, 관정지름·심도, 일양수량, 펌프 마력 같은 제원을 담는다. 가뭄 때 어느 지역에 대체 용수원이 될 관정이 얼마나 있고 양수 능력이 어느 정도인지 따지려는 지자체·연구자의 질문에 쓴다. 표준코드(dam_cd)를 키로 같은 공사의 다른 농업기반시설 제원 데이터와 잇고, 소재지 주소로 지역 단위 농업용수·가뭄 자료와 맞춘다.
description_portal: '- 농업기반시설 중 하나인 **관정(灌井, 농업용 지하수 개발시설)**에 대한 정보이며, 한국농어촌공사에서 관리중인 농업용 관정에 대한 정보를 제공합니다. - 해당 데이터에서는 관정에 대한 기본정보(표준시설코드,시설명,소재지,착공년도,준공년도,종별,구분,유역면적,홍수면적,만수면적,수혜면적 등)을 제공합니다.해당데이터는- 농업용수 수급 현황 및 지역별 지하수 개발 현황 분석- 가뭄 및 수자원 부족 시 대체 용수 확보를 위한 정책 수립- 환경영향평가 및 지하수 자원 관리 연구- 재해 대응 및 시설 유지보수 등에 활용할 수 있습니다----------------------------<단위>면적: ha한발빈도: m3/일관정지름: mm심도: m양수량: m3/일마력:KW'
