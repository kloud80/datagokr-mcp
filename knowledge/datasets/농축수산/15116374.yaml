description_portal: '국립수목원 국가생물종지식정보시스템의 식물상식 >> 유사식물비교구분 메뉴에서 제공되는 데이터로, 연꽃-수련과 같이 서로 유사한 식물에 대한 구분을 할 수 있도록 비교주체식물, 비교대상식물, 형태설명, 생태설명, 기타 등에 대한 설명과 이미지를 제공합니다.예시 : 연꽃과 수련은 모두 연못이나 호수에 사는 수생식물로 둥근 잎모양을 하고 있고 잎자루가 잎의 한 가운데 달리는 점, 그리고 꽃이 크며 꽃잎과 꽃받침의 구분이 어렵고 많은 수가 달리는 점 등에서 비슷하다. 두 식물의 차이점은 잎과 꽃에서 쉽게 찾아볼 수 있다. 잎의 차이로는 연꽃은 잎이 완전히 둥근 모양을 하는 반면 수련은 한쪽이 좁게 찢어진 모양으로 되어 있다.'
