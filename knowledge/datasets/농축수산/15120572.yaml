description_portal: '산림항공 관리소 기준 일출 및 일몰 시간 정보를 제공 데이터입니다. 일자별로 관리소, 일출시간, 일몰시간에 관한 정보를 제공합니다. 일출, 일몰시간을 산정하는 위치 기준은 각 관리소(본부 및 관리소 12개소)의 위치 입니다.계절에 따라 일출, 일몰시간을 확인할 수 있으며, 임무 시 항공기 운항에 영향을 주는 비행 가능시간 산정, 운항계획 수립 등 산림헬기의 안전한 운항과 비행계획 수립을 지원하기 위한 데이터입니다.  * 관리소 : 본부, 익산, 양산, 영암, 안동, 강릉, 진천, 함양, 청양, 서울, 울진, 제주, 비무장지대* 포함일자 : 2025.1.1.~12.31.'
