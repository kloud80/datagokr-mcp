description_portal: 이 데이터는 해양수산부에서 내항여객선조류데이터에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관할지사명칭항로명칭조석_기항지 명칭조석_삭망조석_양현조석_평균항조석_조시차 데이터로 구성되어 있습니다.본 데이터는 내항여객선조류데이터 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.내항여객선조류데이터란 내항(국내)에서 운항하는 여객선 항로의 조류(조류) 정보 데이터를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
