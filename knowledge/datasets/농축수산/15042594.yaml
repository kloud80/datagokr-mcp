summary_user: 농촌진흥청이 선정한 스마트팜 우수농가(완숙토마토·딸기·파프리카)의 온실환경, 작물생육, 생산량 공개 데이터를 농가별·연도·주차 단위로 담는다. 시설원예 농가나 연구자가 우수농가의 주차별 3.3㎡당 생산량과 재배면적을 자기 농장과 견주어 보는 데 쓴다. 전역 조인 키는 없고 농가코드(frmhsId)로 세 오퍼레이션을 서로 잇는다. 다른 데이터와는 작목 이름 매핑으로만 연결되며, 조회에 필요한 농가코드도 별도 코드표에서 먼저 받아야 한다.
description_portal: '0 농촌진흥청 스마트팜 우수농가에 대한 공개용 데이터셋(온실환경, 작물생육, 생산량)을 제공합니다.  - 대상 작목 : 완숙토마토, 딸기, 파프리카  - 제공되는 서비스 항목    . 대상작목(완숙토마토, 딸기, 파프리카) 우수농가 온실환경정보 : 스마트팜 우수농가의 공개 데이터셋 온실환경 정보 조회 제공    . 대상작목(완숙토마토, 딸기, 파프리카) 우수농가 생산량정보 : 스마트팜 우수농가의 공개 데이터셋 생산량 정보 조회 제공    . 대상작목(완숙토마토, 딸기, 파프리카) 우수농가 작물생육정보 : 스마트팜 우수농가의 공개 데이터셋 작물생육 정보 조회 제공※ 서비스URL 변경으로 기존 사용자는 2021년 1월 부터 접속이 안될 수 있으니, 기술명세서를 참고하여 서비스URL을 변경해 주십시오,'
team:
