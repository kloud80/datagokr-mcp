        required: false
        desc: 페이지 번호
      - name: searchFrmhsCode
        required: true
        desc: 농가식별아이디(농가 데이터셋 별 ID) *농가코드표 참조
      - name: searchMeasDt
        required: false
        desc: 정보 측정일시를 검색 'yyyyMMddHH'
      - name: returnType
        required: false
        desc: 응답명세 타입json / xml (default xml)
