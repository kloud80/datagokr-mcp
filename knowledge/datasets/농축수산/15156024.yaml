summary_user: 국립해양조사원이 현장 관측한 해수유동(유향·유속)을 바탕으로 산출한 조류예보를 예보지점별 시계열(시각·유향·유속)로 제공하는 API이며, 검증 시 전국 범위에서 24행을 받았다. 낚시·레저 이용자나 해상 작업자가 특정 해역의 시간대별 조류 방향과 속도를 확인하는 질문에 쓴다. 예보지점 위도(lat)·경도(lot) 좌표로 다른 위치 데이터와 이어 쓰며, 실측 조인 키는 좌표(lat)이고 기관 자체 관측소코드 체계도 있다.
description_portal: 해양수산부 국립해양조사원_조류예보(시계열) 서비스는 국립해양조사원에서 현장 관측을 통해 수집된 해수유동(유향, 유속) 관측 데이터를 기반으로 조류 조화상수 추출 및 조류예보 데이터를 산출하여, 우리나라 관할해역 조류 예보지점의 시계열 조류 정보(유향, 유속, 시각)를 제공하는 서비스입니다. 관할해역 200여개 지점의 데이터를 조회할 수 있습니다. 데이터는 매년(1년 주기) 갱신됩니다. 서비스 개요, 지점 코드 정보, 오퍼레이션 명세 정보는 붙임의 오픈 api 활용가이드를 참고하시기 바랍니다.
