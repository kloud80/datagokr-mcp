description_portal: '국가농작물병해충관리시스템에서는 농가와 일반 사용자가 농작물 병해충 피해를 진단받을 수 있는 상담 서비스를 운영한다.사용자는 상담을 신청할 때 다음과 같은 정보를 직접 입력하거나 업로드한다.대상 작물 정보(품목명) : 예: 사과, 벼, 고추 등 어떤 작물에서 문제가 발생했는지 입력한다.병해충 발생일 : 피해가 처음 관찰된 날짜를 기록한다.(이는 병의 진행 단계와 방제 시기 판단에 활용된다.)피해 증상 설명 : 잎 색이 변했다, 구멍이 생겼다, 열매가 썩는다 등 발견된 증상을 서술한다.피해 사진 업로드 : 병해충의 실제 증상을 시각적으로 확인하기 위한 핵심 데이터로, 전문가 진단 정확도를 높인다.지역 정보(발생 위치) : 시·군 단위 지역을 입력하여 지역별 병해충 발생 양상과 확산 가능성을 분석하는 데 쓰인다.사용자가 이 정보를 제출하면, 시스템은 해당 분야의 전문가(작물·병해충 담당 연구사 등)에게 상담 요청을 전달한다.전문가는 사진과 제출된 정보를 바탕으로 아래와 같은 결과 데이터를 생성한다.진단 소견: 어떤 병해충인지, 피해 정도는 어느 수준인지 분석한 내용권장 방제 방법: 약제 방제, 생물적 방제, 농작업 관리 등 구체적인 대응 방법추가 조치사항: 재발 방지 요령, 추가 관찰 필요성 등상담이 완료되면 사용자는 답변 만족도(만족·보통·불만족 등)를 입력할 수 있으며, 이 정보는 서비스 품질 평가 자료로 활용된다.'
