description_portal: 산림청이 관리하는 산림과학기술연구 활동을 통해 생산된 논문 및 지식재산권 실적 정보를 체계적으로 정리한 데이터입니다. 이 자료는 산림 분야 연구성과의 관리와 활용을 위해 구축된 것으로, 논문실적뿐만 아니라 특허 관련 정보도 함께 제공됩니다. 주요 항목에는 특허구분(국내/국제), 출원번호, 등록번호, 지적재산권명, 논문명(국문/영문), 발표일, 학술지명, 연구기관명, 연구자명 등이 포함되어 있습니다. 이를 통해 산림과학기술 분야에서 창출된 지식의 법적 보호 상태, 연구 성과의 활용 가능성, 지식재산화 현황 등을 종합적으로 파악할 수 있습니다.
