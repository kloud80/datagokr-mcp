summary_user: 전국 축산농장을 시도·시군구·읍면동과 축종(소·돼지·닭·오리 등)별로 묶어 농장 수(FARM_CO)를 담은 집계 데이터이며, 범위는 전국이고 좌표 없는 비공간 자료다. 축산 정책 담당자나 방역 분석가가 '우리 읍면동에 돼지 농장이 몇 곳인가'처럼 지역별 축종 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구·읍면동 이름을 행정구역 코드표에 맞춰 매핑하거나 같은 기관 자료와만 이어 쓴다.
description_portal: 본 정보는 축산물품질평가원의 축산물이력정보(소, 돼지)와 가축위생방역지원본부(닭, 오리 등 기타 축종)의 축산농장 방역정보를 기반으로 구축된 전국 축산농장에 대한 농장별 현황 정보입니다. 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 상이할 수 있으니 데이터 활용 시 참고하시기 바랍니다. 이 데이터는 축산농장의 농장별 사육 현황과 농장 위치, 방역 상황 등을 파악하는 데 활용되며, 축산업 정책 수립과 방역 관리, 농업 통계 분석에 중요한 기초 자료로 기능합니다. 농림축산식품부는 해당 정보를 통해 축산업의 효율성과 투명성 향상에 기여하고자 합니다.
