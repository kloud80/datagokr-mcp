summary_user: 2015년 제·개정 농축수산물 표준코드의 단위코드와 같은 뜻을 가진 2013년 표준코드 단위를 한 행씩 짝지은 신구 매핑표로, 신·구 단위코드와 단위명, 갱신일자를 담는 전국 단위 비공간 코드 데이터다. 분석가가 2013년 코드 체계로 쌓인 과거 가격·유통 자료와 2015년 이후 자료를 합칠 때 단위가 서로 무엇에 해당하는지 맞추는 데 쓴다. 다른 데이터셋과 직접 이어 줄 전역 조인 키는 없으며, 같은 기관의 표준코드를 쓰는 자료에서 신·구 단위코드(STD_UNIT_NEW_CODE, STD_UNIT_CODE)나 단위명으로 대조해 연결한다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 '신구표준단위목록조회' API는 2015년 제·개정된 농축수산물 표준코드의 단위코드와 동일한 의미를 가지는 2013년 농축수산물 표준코드의 정보를 제공하는 서비스입니다. 이 API는 농수축산물에 대한 정확한 단위 측정을 위해 필수적인 정보를 제공하며, 이에 따라 해당 데이터를 활용한 다양한 연구 및 정책 수립이 가능합니다. API를 통해 제공되는 데이터는 단위코드(신구), 단위명(신구), 업데이트일자 등 다양한 표준코드 매핑 정보를 포함하고 있습니다. 이를 통해 사용자는 과거와 현재의 표준코드를 비교하여 농수산물의 품질 기준을 명확히 파악할 수 있으며, 각종 통계 자료 및 연구 결과물에 활용하여 정책적 결정을 지원하는 데 기여할 수 있습니다.  따라서 농림축산업 관련 기관 및 연구자들에게 유용한 정보를 제공하게 됩니다.
