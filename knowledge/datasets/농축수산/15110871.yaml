description_portal: '제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍콩레이 데이터를 제공합니다.항목: 일반정보(피해요인), 일반정보(피해대상), 도로명/지번 주소, 행정동코드, 위도, 경도 등* 2018년 제주특별자치도 내에서 발생한 태풍 콩레이(Typhoon Kong-Rey)로 인한 자연재해 피해 현황을 행정동 단위로 상세히 기록한 자료입니다. 대분류·중분류·소분류로 구분된 피해 유형, 피해 구분, 피해 요인 및 대상(품종) 등 정밀한 피해 정보를 제공하며, GIS 기반 분석과 시각화에 필요한 공간 정보(도로명주소, 지번주소, 행정동 코드, 위도/경도)도 포함하고 있습니다.* 활용 분야 : GIS 기반 공간 시각화 및 분석재난 대응 및 자원 배치 기획, 정책 및 인프라 개선 자료 등"'
