summary_user: 울산광역시가 정리한 원산지 표시 의무 대상 농산물 품목 목록으로, 구분·품목류·대상 품목 세 열로 된 2KB 남짓의 작은 CSV 파일이다. 판매자나 유통업체가 '내가 파는 이 농산물이 원산지 표시 대상인가'를 확인하거나, 단속·교육 담당자가 대상 품목 범위를 참고할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 품목명을 문자열로 맞춰 이어야 한다.
description_portal: 본 데이터는 원산지 표시 의무 대상 농산물 품목 정보이다. 품목별 명칭, 표시 기준, 적용 대상, 법적 근거 등의 세부 내용을 포함한다. 원산지 표시 제도는 소비자에게 농산물의 생산지 정보를 제공하여 알 권리를 보장하고 합리적인 구매를 지원하는 제도이다. 해당 자료는 원산지 표시 단속 계획 수립, 유통업체 교육, 소비자 보호 정책 개발에 활용된다. 표시 대상 품목 현황을 통해 유통업체 및 판매자가 원산지 표시 의무를 올바르게 이행할 수 있도록 안내한다. 또한 원산지 허위 표시 및 혼동 표시를 단속하여 공정한 농산물 유통 질서를 확립한다. 소비자가 신뢰할 수 있는 농산물을 구매하도록 지원하며, 국내 농산물 보호 및 농업 경쟁력 강화에 기여한다.
