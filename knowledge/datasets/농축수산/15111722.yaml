summary_user: 국내 수목의 수피(나무 줄기 겉껍질) 사진 한 장마다 한 행으로, 수목의 향명·학명, 촬영 일자·시간대·지역, 사진과 어노테이션 파일의 이름·주소(URL), 데이터 생성일자를 담은 건별 목록이며 전국 범위의 CSV 파일(약 37MB)이다. 수목 식별 인공지능을 만드는 개발자나 연구자가 '수피 사진만으로 이 나무가 어떤 수종인지 가려낼 학습 데이터를 어디서 구하나'라는 질문에 쓰고, 숲 해설·나무의사 교육 자료로도 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없으며, 학명이나 향명을 수종 목록 등과 이름으로 맞춰 이어 써야 한다.
limits: 전역 조인 키가 없어 다른 산림 자원 데이터와는 학명·향명 같은 이름 매핑으로만 연결된다. 촬영 지역은 개별 주소 수준으로 기록되어 있어 시군구 등 행정구역 단위로 묶으려면 별도 정리가 필요하다.
