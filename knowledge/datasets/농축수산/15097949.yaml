summary_user: 전국 100대 명산 주변의 관광·전망 지점 같은 관심지점(POI)을 지점 한 건씩 담으며, 숲길명과 위도·경도·해발고도, 장소유형, 설명, 이정표 목적지와 방향 정보를 함께 제공한다. 등산객 안내 앱 개발자나 지역 관광 분석가가 "이 명산 숲길 위의 전망지점과 이정표는 어디에 있고 어느 방향을 가리키나"를 지도에 표시할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못했으므로, 숲길명·장소명 이름 매칭이나 같은 기관의 숲길 식별자(frtrlId), 위경도 좌표 기반 공간 결합으로 연결한다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 전국 100대 명산 관련 관광 주요 관심지점(POI) 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천장소유형명, 원천장소유형코드, 장소명, 설명내용, 기준일시, 원천조사진행방향명, 이정표목적지명, 원천이정표목적지방향명, 원천이정표목적지코드 정보를 호출할 수 있으며, 이를 활용하여 100대 명산 주변 관광, 전망지점 등의 위치정보 시각화, 탐방객 동선 안내, 지역 관광콘텐츠 개발, GIS 기반 관광인프라 분석 등 다양한 분야에서 활용할 수 있는 정보를 JSON+XML 포맷으로 지원합니다.
