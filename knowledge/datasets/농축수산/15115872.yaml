summary_user: 해양수산부 어선원부를 어선 한 척(어선번호) 단위로 담은 전국 범위 원장 파일(CSV)로, 어선명·호출부호·선적항·엔진 마력과 동력·길이·폭·깊이·전체톤수·구획별 용적·진수일자·최초등록일자·현행 여부를 담는다. 수산 행정 담당자나 분석가가 특정 선적항에 현재 등록된 어선이 몇 척이고 톤수와 엔진 마력이 어떻게 분포하는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 어선번호·허가일련번호·항구명 같은 이름·번호 매핑이나 같은 기관 코드로만 잇는다. 어업 허가 원장과는 어선번호로, 해운·항만 선박 등록과는 어선 범위에서만 겹친다.
description_portal: 이 데이터는 해양수산부에서 어선원부 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 어선번호, 등록처리일자, 현행여부, 어선번호년도구분, 기관전체톤수측정번호, 전체톤수측정년도, 전체톤수측정일련번호, 기관허가번호, 허가년도, 허가일련번호, 어선명, 호출부호명, 어선종류구분, 어선재질구분, 선적항구번호, 항구명, 범장구분, 엔진종류코드, 엔진마력, 엔진동력, 엔진수, 추진기종류구분 정보 등으로 구성되어 있습니다.  본 데이터는 어선 등록과 관리 업무 수행, 어선 허가 이력 확인이나 어선 관련 행정 처리 시 정보 조회, 어선의 위치 파악, 기관별 어선 통계 자료 산출, 어업 정책 수립 시 참고 자료로 활용될 수 있습니다.
