description_portal: 한국수목원정원관리원은 국립백두대간수목원 내 전시원의 생육환경 모니터링을 위해 온도 및 습도 로그 데이터를 수집하고 이를 공공데이터로 제공하고 있습니다.본 데이터는 호랑이숲, 자생식물원, 야생화언덕, 암석원 등 주요 전시원별로 설치된 센서를 통해 측정된 온·습도 정보를 기반으로 하며, 특정 시간 간격으로 기록된 환경 로그 데이터입니다. 이를 통해 식물 생육에 영향을 미치는 전시원별 마이크로 기후 분석이 가능하며, 시설 운영과 생태연구, 환경 교육 자료 등으로 활용할 수 있습니다.데이터는 CSV 형식으로 제공되며, 시간 기반 측정값이 전시원별로 정리되어 있습니다.항목은 측정일시, 전시원 명칭, 온도(°C), RH, 이슬점으로 구성되어 있으며, 로그(기록) 방식으로 시계열 데이터 구조를 갖고 있어 연속적이고 비교 가능한 환경 데이터를 제공합니다. 측정 주기는 보통 1시간 단위이며, 이를 통해 시간별 온도·습도 변화 추이 분석이 가능합니다.이 데이터는 식물 생육 환경 연구, 실내외 식재 전략 수립, 교육용 환경 콘텐츠 개발 등 다양한 분야에서 활용됩니다. 연구기관은 전시원별 생태 환경 차이를 분석하고, 교육기관은 온습도 변화에 따른 식물 반응 수업자료로 활용할 수 있습니다. 또한 민간기업은 스마트팜 시스템 개발, 환경 시뮬레이션 도구 구성 등에도 연계할 수 있어 디지털 수목원 기반 조성에 기여하는 기초 데이터로 활용 가치가 높습니다.
