        required: false
        example: '98'
        desc: 검색값과 상품 소분류코드가 일치하는 데이터를 검색
      - name: selectable
        required: false
        example: corp_cd
        desc: 응답으로 받고 싶은 컬럼명을 선택하여 검색(구분자','로 다중선택)
