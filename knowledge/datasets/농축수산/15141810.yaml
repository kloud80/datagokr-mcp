summary_user: 전국 공영도매시장의 경매 건별 원천 기록(품목·포장·등급·물량·낙찰가·거래정산일자)을 담은 API로, 전체 30,957건이 2025-02-10부터 2026-08-27까지 걸쳐 있다. 식자재 구매자나 유통업자, 물가 분석가가 특정 품목이 어느 도매시장에서 어떤 등급·포장으로 얼마에 낙찰됐는지 확인하는 데 쓴다. 도매시장·법인·등급·포장·산지·품목 코드는 같은 기관의 농축수산물 표준코드 API로 풀어 이어 쓰며, 전역 조인 키는 없어 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
description_portal: '전국 공영도매시장에서 거래되는 농수산물의 품목, 포장종류, 등급, 거래량, 가격, 정산일자 등 유통 전반에 관한 경매 원천정보를 제공합니다.★ API 명세서가 첨부되어있습니다. API 활용에 참고하실 수 있습니다.★ 기존 도매시장통합 홈페이지에서 제공하던 API와 현재 공공데이터포털에서 제공 중인 API 간 컬럼 변경 내역도 동일 파일 내에 있으므로 이용에 참고하실 수 있습니다.* 도매시장 통합 홈페이지:국 32개 공영 도매시장의 다양한 정보를 한곳에 통합 제공하는 종합 플랫폼실시간 경매 현황부터 통계, 출하자 시스템, 지원 정책 등 광범위한 기능을 갖추고 있어, 농수산물 유통과 수급관리에 필수적인 디지털 인프라 역할 수행코드 정보는 한국농수산식품유통공사_농축수산물 표준코드 API를 조회 후 확인바랍니다. (https://www.data.go.kr/data/15141818/openapi.do)코드 종류 :whsl_mrkt_cd : 도매시장 코드corp_cd : 법인 코드unit_cd : 단위 코드sz_cd : 크기 코드plor_cd : 산지 코드pkg_cd : 포장 코드grd_cd : 등급 코드gds_lclsf_cd : 품목 코드 (대분류)gds_mclsf_cd : 품목 코드 (중분류)gds_sclsf_cd : 품목 코드 (소분류)* 일자관련 요청파라미터는 YYYY-MM-DD 형식으로 입력해야 정상적으로 처리됩니다.'
