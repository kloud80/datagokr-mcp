      - name: cond[whsl_mrkt_cd::EQ]
        required: true
        example: '110001'
        desc: 검색값과 도매시장코드가 일치하는 데이터를 검색
      - name: cond[corp_cd::EQ]
        required: false
        example: '11000101'
        desc: 검색값과 법인코드가 일치하는 데이터를 검색
      - name: cond[gds_lclsf_cd::EQ]
        required: false
        example: '06'
