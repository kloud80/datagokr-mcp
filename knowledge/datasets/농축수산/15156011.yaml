summary_user: 조위관측소별로 실측 조위와 예측 조위의 고·저조 발생시각과 조석 높이 차이(시각편차·조위편차)를 담은 조석성과 데이터로, 관측소 코드와 요청연월을 넣어 월 단위로 전국 관측소 값을 조회한다. 항만·연안 안전관리 담당자나 해양 연구자가 특정 관측소에서 조석 예측이 실제 물때와 얼마나 어긋났는지 확인할 때 쓴다. 전역 조인 키는 없으므로 국립해양조사원(바다누리) 자체 관측소코드나 관측소 위도·경도(lat, lot)를 기준으로 같은 기관의 조위·조류 관측 데이터와 연결한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소의 조석 관측과 예측 데이터간 간 고·저조 발생시각, 조석 높이의 편차 정보를 제공하기 위해 수집한 데이터 입니다. 관측소 코드, 요청연월을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 실측일시, 예측일시, 관측소의 위도/경도 위치정보 및 실측 조위 값, 예측 조위 값, 극치 종류, 결측구간설명, 시각편차, 조위편차 정로로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
