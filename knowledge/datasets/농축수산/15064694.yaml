summary_user: 김포시 관내 유아숲을 시설 한 곳당 한 행으로 담은 소규모 csv 파일로, 시설명·지번주소·조성면적(제곱미터)·주요시설·데이터 기준일자를 담는다. 아이를 데리고 갈 만한 가까운 유아숲이 어디에 있고 규모와 시설이 어떤지 찾는 학부모나 어린이집·유치원 교사, 읍면동별 유아숲 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소 정제·좌표 변환해 행정구역이나 다른 산림휴양 시설 데이터에 이름·위치 기준으로 붙여 쓴다.
