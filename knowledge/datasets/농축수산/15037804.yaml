summary_user: 한국농어촌공사가 운영하는 지하수관측소의 목록을 관측소 단위로 담은 파일 데이터로, 전국 1,110곳이 관측소코드·관측소명·관측망구분·대수층·주소 등과 함께 들어 있다. 농업용수 공급이나 가뭄 대응, 해안 지하수 염분·오염 감시를 살피는 담당자와 분석가가 우리 지역에 어떤 관측소가 있는지 찾을 때 쓴다. 주소·주소코드(address)를 키로 다른 지역 자료와 이어 쓸 수 있고, 이 파일에는 수위·전기전도도 같은 관측값 자체는 없어 관측값 자료는 따로 찾아야 한다.
description_portal: 한국농어촌공사에서 운영,관리하는 지하수관측소 정보(농어촌 지하수의 개발,이용 및 보전,관리를 위한 관측망 운영)관측망구분농촌지하수관측망농촌 지역의 지하수 자원을 체계적으로 관측, 관리하기 위해 설치된 관측소입니다.주로 농업용수 안정공급, 가뭄대응, 지하수 오염 감시를 목적으로 사용됩니다해수침투해안 지역의 지하수에 해수가 침투하는 현상을 상시 감시하고 분석하기위해 설치된 관측망입니다.주로 염분 농도 변화, 지하수 수위, 전기전도도 등을 측정하여지하수 오염, 농업용수, 식수 피해를 예방하고 대응하기 위한 과학적 근거를 제공합니다
