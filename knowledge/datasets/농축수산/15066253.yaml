summary_user: 국립종자원이 보급하는 정부보급종(벼·콩·팥·보리·밀·호밀) 종자의 공급가격을 연산·작물·품종·공급단위·소독 여부별로 담은 전국 단위 CSV 파일(약 40KB)이다. 농가나 영농 지원 담당자가 특정 연산의 벼 품종 보급종을 소독종자로 받을 때 단위무게당 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작물명·품종명 같은 이름 매핑으로만 이어 쓰며, KAMIS 등 유통가격 데이터와 붙이려면 품목코드 매핑이 따로 필요하다.
limits: 공급가격은 해마다 정부 정책과 작황에 따라 달라지고 가격이 정해지는 시기도 일정하지 않아, 연산 간 단순 비교나 시세 추이로 해석하는 데 주의해야 한다. 공통 코드 키가 없어 지역·농가 단위 분석이나 다른 기관 데이터와의 직접 결합은 어렵다.
