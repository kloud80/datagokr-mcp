summary_user: KAMIS 농축수산물 도·소매가격 조사에서 어떤 부류·품목·품종을 조사하는지 정리한 품목 목록 파일로, 조사구분(도매·소매)별로 부류·품목·품종과 부류별·전체 품목 수, 품종 수를 담는다. 가격 데이터를 분석하는 사람이 "이 품목의 도매가나 소매가가 KAMIS에서 조사되는지, 어떤 품종 단위로 나뉘는지"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 KAMIS 가격 데이터와는 품목·품종 이름으로 맞춰 이어 쓰고, 도매시장·HS·KOSIS 품목코드와는 별도 매핑이 필요하다.
description_portal: 농축수산물 유통가격 조사를 위한 농축수산물 가격조사 품목정보로,도매 및 소매별 조사품목, 종류별 구분조사, 조사시기, 조사지역 등의 정보를 제공합니다.농수축산물에 대한 유통가격을 정확하게 조사·수집하여 정보 수요자(생산자, 소비자, 유통업자, 관계기관 등) 에게 신속히 제공함으로써 시장출하 및 매매에 관한 의사결정을 돕고, 건전한 유통질서를 확립하여 원활한 수급조절을 유도하는 동시에 실효성 있는 가격안정 대책추진을 위한 정책자료를 제공하는데 그 목적이 있습니다.aT(한국농수산식품유통공사)는 ‘83.4월부터 국내 농수산물의 유통질서 확립, 수급조절 및 가격안정 정책수립 등을 위한 목적으로 유통정보 조사활동을 수행해오고 있으며, aT가 조사한 유통정보의 효율적인 분산을 통한 정보수요자의 유통에 관한 이해증진 및 정보활용도 제고를 위해 ’03.4월부터 Kamis(농수산물 유통정보) 홈페이지를 구축하여 서비스 중에 있습니다.Kamis 유통정보는 전국 주요 도·소매시장 대상으로 매일(토·일·공휴일 제외) 가격을 조사하여 공개하는 농수산물 도·소매가격정보부터 거래동향/전망, 알뜰장보기 물가정보, 성수품·제철농산물 정보 등 농수산물의 유통과 관련한 다양하고 특화된 정보 서비스가 가장 큰 특징입니다.aT는 유통정보 제공을 통해 농수산물 거래주체(생산·유통·소비자) 등의 시장출하 및 매매에 관한 의사결정과 합리적인 소비를 지원하고 있으며, 최근에는 가격정보 Open-API 제공을 통해 민간기업의 신규 비즈니스 창출에도 기여하고 있습니다.
