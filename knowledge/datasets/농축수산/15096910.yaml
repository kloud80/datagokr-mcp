summary_user: 제주특별자치도에서 재배되는 채소류를 연도(연산)와 채소 대분류·소분류별로 나눠 재배 면적(ha), 생산량(톤), 조수입(백만원)을 담은 집계 통계로, 범위는 제주도 시도 단위입니다. 제주 농업 정책 담당자나 유통업체·연구자가 '제주에서 어떤 채소가 얼마나 재배되고 생산·소득 규모는 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS 가격 등 다른 데이터와는 품목명을 직접 매핑해야 이어 쓸 수 있으며, 품목코드는 KAMIS·도매시장·KOSIS마다 달라 별도 매핑이 필요합니다.
description_portal: 제주특별자치도 채소류 재배 현황 데이터는 2021년을 기준으로, 제주도 내에서 재배되는 채소류의 재배 면적, 생산량, 조수입(농가소득) 정보를 체계적으로 정리한 공공 통계자료이다. 제공기관은 제주특별자치도청이며, CSV 형식으로 공개되어 누구나 다운로드 및 분석이 가능하다. 본 자료는 품목별‧행정구역별 채소 재배 규모와 경제적 성과를 확인할 수 있어, 농업 정책 기획, 지역 농산물 유통 전략 수립, 농가 지원 정책 설계, 생산량 및 가격 안정성 분석 등에 활용될 수 있다. 또한 연구자나 민간 유통업체는 제주 채소류 생산 패턴, 지역별 재배 밀도, 농가 소득 구조를 분석할 수 있으며, 지역 농업 경쟁력 평가, 수요예측, 친환경‧계절농산물 전략 개발 등에도 기초 자료로 유용하다.
