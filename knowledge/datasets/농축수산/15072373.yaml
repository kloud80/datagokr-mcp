description_portal: 산림청이 추진하는 산림과학기술 관련 기술수요조사에서 도출된 핵심 평가 항목과 기술 목표 정보를 체계적으로 정리한 데이터입니다. 이 자료는 산림 분야 기술개발에 있어 중점적으로 고려해야 할 기술수요의 주안점과 기술수준 현황을 파악하기 위한 것으로, 각 항목별로 평가항목명, 측정단위, 세계수준, 국내수준, 개발목표치 등의 정보를 제공합니다. 이를 통해 현재 국내 기술이 국제 수준과 비교해 어느 정도의 수준에 있는지 분석하고, 앞으로 도달해야 할 기술목표치를 설정함으로써 R&D 방향성 설정, 정책 기획, 예산 배분, 기술 로드맵 수립 등에 활용됩니다.
