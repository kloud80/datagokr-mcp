description_portal: 전라남도 영광군에 소재한 미곡처리장(RPC, Rice Processing Complex)의 운영 현황에 대한 데이터로, 지역 내 쌀 가공시설의 분포와 역량을 파악하기 위한 기초자료로 활용됩니다. 수록 항목에는 연번, 구분, 업체명, 전화번호, 도로명 주소, 시간당 쌀 가공능력(톤 단위), 저장능력 등이 포함되며, 지역 내 쌀의 수확·가공·저장·유통 체계 전반을 이해할 수 있도록 정리되어 있습니다. 이 데이터는 영광군 쌀 산업 정책 수립, 원활한 유통망 확보, 저장시설 확충 계획, 농업기반시설 투자 분석, 공공비축미 수매 계획 수립 등 다양한 행정적‧산업적 분야에서 활용 가능합니다. 또한 지역농협, RPC 운영법인, 농업인단체, 농산물 유통기업, 소비자 단체 등 다양한 이해관계자에게 실질적인 참고자료로 제공됩니다.
