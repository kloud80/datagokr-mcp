summary_user: 수산물 이력제에 등록된 참여업체를 업체 단위로 한 행씩 담은 파일로, 이력추적등록번호·등록기관·단체유형·신청구분·사용시스템·이력관리방법과 위도·경도를 전국 범위로 담는다(약 269KB CSV). 수산물 이력추적번호를 보고 그 업체가 어느 기관에 등록됐는지, 어떤 방식으로 이력을 관리하는지, 어디에 있는지 확인할 때 쓴다. 이력추적등록번호(fish_traceability_no)가 조인 키라서 같은 번호를 쓰는 수산물 이력·유통 데이터와 연결하고, 좌표로 지도나 행정구역 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 해양수산부에서 이력등록참여업체에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 이력추적등록번호, 등록기관코드명, 단체유형구분명, 신청구분명, 사용시스템구분명, 이력관리방법명, 위도, 경도 데이터로 구성되어 있습니다.본 데이터는 이력등록참여업체 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
