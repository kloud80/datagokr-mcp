description_portal: 1. 데이터 설명전북특별자치도 남원시의 허브식물원이 보유한 식물 수종에 대한 상세 현황 정보를 담고 있는 데이터입니다. 지리산허브밸리 인근에 자리 잡은 허브식물원에서 현재 재배하고 관리하고 있는 다양한 허브와 약용식물의 종류를 체계적으로 정리하여, 효과적인 식물원 운영 및 방문객 정보 제공을 목적으로 구축되었습니다. 이 데이터는 허브식물원의 식물종에 대한 기본 정보를 포함하고 있어 식물원 관리, 교육 프로그램 개발, 관광 정보 제공 등 다양한 분야에서 활용될 수 있습니다.2. 데이터 항목명데이터 항목 정보가 제공되지 않았습니다.3. 기대 효과허브식물원의 체계적인 식물수종 정보를 공개함으로써 관광객 유치를 촉진하고 지역 관광 활성화에 기여할 수 있으며, 동시에 허브 관련 연구기관과 농업인들에게 유용한 기초자료를 제공할 수 있습니다.
