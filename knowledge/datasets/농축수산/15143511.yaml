description_portal: 경상남도 거제시 소재 굴 양식장 등록 사항에 대한 데이터로 양식장의 소재지, 면허번호, 면적(ha단위), 주소, 데이터기준일자 항목을 제공합니다. 양식장 운영 현황 파악과 시각적 지도 작성, 연구 및 산업 활용을 위한 기초자료로 제공됩니다. 이 데이터는 거제시 수산과에서 관리하며, 양식장 위치 기반의 공간정보로도 활용 가능합니다. 굴 양식장에 대한 면허번호는 해당 양식장이 법적으로 허가받은 어업권을 식별하는 고유 번호입니다. 이 번호를 통해 양식장 등록 여부, 허가 조건, 위치, 면적 등의 정보를 확인할 수 있습니다.
