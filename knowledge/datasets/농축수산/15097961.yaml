summary_user: 전국 100대 명산 숲길 입구 구간의 노면정보를 좌표 지점 단위로 담으며, 경로·숲길 식별자와 숲길명, 위도·경도·해발고도, 1~3단계 원천 노면유형(코드·이름), 기준일시를 함께 제공한다. 등산객이나 탐방로 관리자가 '이 명산의 숲길 입구는 흙길인지 포장·계단 구간인지, 해발 몇 m에서 시작하는지'를 확인하거나 입구 구간 정비·접근성 평가, GIS 공간분석에 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어 숲길명·산 이름 매핑이나 같은 기관(한국등산트레킹지원센터)의 숲길 식별자(frtrlId)·경로 식별자로 연결하고, 좌표(위도·경도)로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 전국 100대 명산의 숲길 입구 구간에 대한 노면정보를 조회할 수 있는 서비스입니다.API를 통해 경로식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천노면유형명, 원천노면유형코드, 기준일시 등의 속성을 호출할 수 있으며, 이를 활용해 명산별 입구 구간의 지형특성 분석, 탐방로 정비·보수 관리, 접근성 평가, GIS 기반 공간분석 등에 다양하게 활용이 가능한 정보를 JSON+XML 포맷으로 지원합니다.
