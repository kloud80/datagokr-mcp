summary_user: 전국 잠업 관련 누에씨 생산실적과 생산계획을 표 형태로 담은 외부 파일 데이터로, 행정구역별 공간 구분 없이 전국 단위로 제공된다. 잠업 정책 담당자나 연구자가 누에씨 생산량이 연도별로 어떻게 변하고 계획 대비 실적이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 품목·연도 이름을 직접 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 해당 데이터는 누에씨 생산실적 및 계획에 관한 데이터로, 잠업에 종사하는 전국의 모든 잠업가구의 양잠형태별 생산현황, 누에 생산, 판매 실적 등을 조회할 수 있는 서비스입니다. 이를 통해 농가별 생산 능력, 양잠 형태별 효율성, 누에 생산량 변화 추이를 분석할 수 있으며, 판매 실적과 연계해 잠업 농가의 소득 구조와 시장 참여 정도를 평가할 수 있습니다. 또한 이러한 정보는 잠업 관련 정책 수립, 지원 사업 계획, 기술 보급 전략, 시설 현대화, 소득 안정화 방안 마련 등 다양한 목적으로 활용될 수 있으며, 뽕밭 규모, 생산 형태, 누에 생산 계획 등을 종합적으로 분석함으로써 지속 가능한 양잠업 육성과 경쟁력 강화에 기여할 수 있습니다.
