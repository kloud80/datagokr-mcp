description_portal: 경기도 이천시에 등록된 비료생산업체의 제조장 위치 및 사업자 정보를 제공하는 데이터입니다. 항목은 법인(상호)명, 제조장 도로명주소 및 지번주소, 전화번호, 비료의 종류 및 명칭, 생산능력(톤/일), 사업자등록번호, 기준일자 등으로 구성되어 있으며, 지역 내 비료제조시설의 공간 분포와 생산여건을 파악할 수 있습니다. 본 데이터는 비료생산업 등록현황 관리, 영농자재 수급 분석, 품질관리·허가제도 운영, 환경영향 평가, 농업기반시설 정책 수립 등에 활용됩니다. 특히 생산능력 및 원료정보 항목은 품목별 수급예측, 기준 초과 여부 점검, 비료 안전성 확보 등 관련 정책 추진 시 핵심 자료로 사용됩니다.
