summary_user: 농림축산식품부 소관 국고보조사업을 회계·세부사업·내역사업별로 묶어 연도별 국고보조금액, 지원자격, 간략한 지원내용을 담은 엑셀 집계표로, 범위는 전국이며 지역 구분은 없습니다. 농업인·농업법인이 자신이 받을 수 있는 보조사업과 지원자격을 확인하거나, 분석가가 "어느 사업에 국고보조금이 얼마나 배정됐는가"를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명 같은 이름을 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 농림축산식품부 농림축산식품분야 보조금 현황으로 회계별, 세부사업별, 내역사업별로 연도별 국고보조금액 정보를 제공합니다. 2025년 기준 530개 내역사업에 대한 사업비와 지원자격에 대해 엑셀표로 정보를 제공합니다. 또한 간략한 지원내용 정보를 제공함으로써 농식품사업 보조금 현황을 파악할 수 있습니다. 농식품사업 보조는 농림축산식품부 등 공공기관이 농업인, 농업법인 등에게 재정적 지원을 제공하는 제도로 보조금, 융자금, 이차보전금, 기타자금 등 다양한 형태로 운영됩니다.
