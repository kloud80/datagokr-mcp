description_portal: 이 데이터는 해양수산부에서 실시간최근수온에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일자, 관측소한글명, 관측소영문명, 수온, 염분, 용존산소, 기상청 데이터 유무 데이터로 구성되어 있습니다.본 데이터는 실시간최근수온정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.실시간최근수온이란 특정 해역의 바닷물 온도가 현재 시점에서 얼마나 되는지, 즉 가장 최근에 측정된 수온 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
