summary_user: 전국 김 종자 생산업체를 업체 명부 번호 단위로 한 줄씩 담은 조사 파일로, 유리사상체 기준의 생산계획량·생산량, 육상·해상 시설 면적, 종자 생산방식, 국내·해외 판매량과 판매금액, 원인별 폐사량, 사육수온, 모조 구입 현황을 담는다. 정책 담당자나 연구자가 '김 종자 업체들의 생산량 대비 폐사량은 얼마이고, 질병·자연재해 중 어떤 원인이 큰가', '국내와 해외 판매 비중은 어떤가'를 따질 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 업체 명부 번호는 이 파일 안에서만 식별자로 쓰고 다른 데이터와는 이름 매핑이나 같은 기관 자료로만 이어 붙인다.
limits: 업체 소재지나 행정구역 코드가 실측 컬럼에 없어 지역별 비교나 지도화는 이 파일만으로 어렵다. 수온·특보 같은 해양 관측소 자료와 바로 연결할 키도 없다.
