description_portal: 데이터 수집 목적 및 과정김은 우리나라 해조류 산업의 대표 품목으로, 안정적인 종자 공급은 산업 성장과 수출 경쟁력 확보의 핵심 요소입니다. 한국수산자원공단은 김 종자 생산업체를 대상으로 종자 생산 현황과 시설 정보를 체계적으로 조사하여 데이터베이스를 구축하였습니다. 본 데이터는 전국 김 종자 생산업체의 기본 현황과 종자 생산 방식, 생산계획을 종합적으로 파악하여 정책 수립과 산업 지원의 근거 자료로 활용하기 위해 수집된 것입니다.데이터 세부 항목데이터는 (업체 현황) 김 종자 생산업체 명부 번호, 사업장 소재지, 인허가 정보, (생산 정보) 종자 생산 시작일, 연간 종자 생산계획량, 실제 생산량, (시설 현황) 육상 종자배양시설 면적, 해상 종자배양시설 면적, (종자 특성) 종자 생산방식, 품종별 특성 및 배양 단계별 관리 자료 등으로 구성됩니다. 또한 연도별 종자 생산량 추이, 지역별 차이, 시설 유형별 생산 특성 자료를 함께 포함하여 분석에 활용할 수 있습니다.활용 기대효과정부와 지자체는 김 종자 생산 현황 데이터를 활용하여 해조류 산업 육성 정책, 종자 보급 지원사업, 수출 확대 전략 수립에 기초자료로 삼을 수 있습니다. 학계와 연구기관은 종자 생산방식, 시설 규모, 생산성과 자료를 활용하여 품종개량 연구, 종자 배양 기술 개발, 기후변화 대응 연구에 기여할 수 있습니다. 업계는 생산계획량과 시설 현황을 참고하여 시장 수요를 반영한 경영 전략 수립 및 종자 보급 계획에 활용할 수 있습니다. 또한 국민은 본 데이터를 통해 우리나라 대표 해조류 산업의 종자 기반과 그 중요성을 이해할 수 있으며, 지속가능한 수산자원 관리의 필요성에 대한 인식을 높일 수 있습니다.※ 제공 데이터는 개인정보 보호 및 품질관리 절차를 거쳐 일부 원자료와 차이가 있을 수 있습니다.
