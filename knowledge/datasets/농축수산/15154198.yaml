description_portal: 농업용어유의어는 언어별로 구분되어 국문/영문/한자 등의 언어로 작성된 농업용어의 유의어를 구분하여 관리하기 위한 자료입니다.유의어의 구분은 한글, 한자, 영어, 일본어, 중국어등 총 19개 언어로 구분되어 있습니다.등록된 전체 유의어는 73,524건 입니다.각각의 언어별로 한글, 한자, 영어, 일본어의 형태가 등록되어있으며 유의어에 대한 설명을 포함하고 있습니다.데이터의 발생시점은 신규발굴되는 농업용어가 존재할 경우 해당 용어의 적합성 등을 검토하여 등록합니다.최초 데이터는 2009년 11월에 등록되었으며 최종 데이터는 2009년 11월에 등록되었습니다.농업용어 유의어정보의 변경이 발생 할 경우 수시로 수정됩니다.
