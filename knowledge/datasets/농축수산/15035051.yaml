description_portal: 충청북도 제천시 가축분비료생산업체의 상세내역입니다.해당 데이터의 목록에는 업체명, 비료종류, 경도, 위도, 업체주소, 업체전화번호, 데이터 기준일자로 구성되어 있습니다.충청북도 제천시에서 생산되는 비료의 종류는 가축분뇨를 활용한 발효액과 가축분을 활용한 퇴비 2가지 입니다.가축분비료(축산물 유기질 비료)는 소, 돼지, 닭 등 가축의 분뇨를 주 원료로 하여 발효(부숙) 과정을 거쳐 만든 비료를 말합니다.화학 비료와 달리 토양의 물리적 성질을 개선하고 미생물 생태계를 풍성하게 만드는 역할을 합니다.
