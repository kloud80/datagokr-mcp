description_portal: 부산광역시에 등록된 12개소 전통주 제조업체의 업체명 및 소재지, 주종, 주원료, 업체 대표 전화번호에 대한 정보를 제공합니다.전통주(傳統酒)는 한국에서 전통적으로 내려오는 제조 방법에 따라 만드는 술을 부르는 말이다. 각 지방의 독특한 방법으로 만드는 민속주가 있습니다. 제조방법에 따라 양조주와 증류주로 나뉜다. 양조주는 순곡주(향기나 맛 첨가 없이 오로지 곡물로만 빚은 술)와 혼양곡주(술에 독특한 향을 내기 위해 꽃이나 식물의 잎을 넣어 빚은 술)로 구분되고 순곡주는 거르는 방법에 따라 탁주와 청주로 구별됩니다.
