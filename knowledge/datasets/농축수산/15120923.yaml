summary_user: 농식품 분야의 표준단어·표준용어·표준도메인을 정리한 메타데이터 표준 파일로, 도메인 하나당 한 행에 도메인 그룹·분류·이름과 데이터타입·길이·소수점·저장/표현형식·단위·허용값을 담으며 범위는 전국·비공간이다. 농식품 데이터를 다루는 기관·사업자·분석가가 '가격·품목 데이터를 새로 설계하거나 여러 시스템 데이터를 합칠 때 이 항목을 어떤 이름과 형식으로 정의해야 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도메인명·용어 이름을 대조하는 방식으로만 이어 쓰며, KAMIS·도매시장·HS·KOSIS처럼 품목코드 체계가 서로 다른 유통 가격 데이터의 항목 정의를 맞추는 참고표로 쓴다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 농식품 분야의 표준 데이터로, 농식품 표준단어, 농식품 표준용어, 농식품 표준도메인 정보를 포함하고 있습니다. 이 데이터는 농식품 관련 데이터의 체계적 관리와 활용을 위해 마련된 것으로, 동일한 의미를 가지는 용어의 일관된 사용을 가능하게 하여 데이터의 정확성과 신뢰성을 높이는 데 중요한 역할을 합니다. 특히 기관별·시스템별로 상이하게 사용되던 용어를 표준화함으로써 데이터 연계와 공유가 원활해지고, 정책 수립과 연구 활동에서 혼선을 줄일 수 있습니다. 또한 농식품 산업 전반에 걸친 데이터 품질 관리의 기반을 마련하여 효율적인 정보 관리가 가능해지며, 민간 및 공공 영역에서 데이터 기반 서비스 개발이나 연구 자료로도 활용될 수 있습니다. 나아가 이러한 표준화 정보는 농식품 데이터 거버넌스 체계를 강화하고, 장기적으로 농업·식품·축산 분야의 디지털 전환을 촉진하는 데 중요한 기초 자료로 기능합니다.
