description_portal: 어종테이블은 우리나라 하천 생태계의 어류 서식 현황을 체계적으로 관리하고 제공합니다. 이 시스템은 하천의 호나경조사, 어류분포, 서식밀도, 주요 종별 출현 현황 등을 데이터 베이스화하여 누구나 열람할 수 있도록 구축되었습니다. 우리나라 하천에는 잉어, 붕어, 피라미, 메기 등과 같은 담수 어종을 비롯하여 뱀장어, 은어, 연어처럼 회유성 어종도 다양하게 서식하고 있으며, 일부는 멸종 위기종으로 지정되어 특별한 관리가 필요합니다. 이러한 어류들의 서식지를 지속적으로 모니터링 하고 어도의 설치 개손 효과를 분석하여 어류의 이동과 번식을 지원합니다. 또한 지역별 어종 다양성 변화 수질 및 수환경에 따른 종별 분포 특성 등을 종합적으로 보여주어 일반 국민들의 생태계 보전의 중요성을 이해 하는 데 도움을 줍니다. 미래세대를 위한 친환경 수자원 관리 기반을 마련하는 핵심 자료로 활용되고 있습니다.
