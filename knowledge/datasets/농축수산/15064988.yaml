summary_user: 인천광역시 산림면적을 침엽수림·활엽수림·혼효림·죽림·무입목지 등 임상별로 나눠 2020년 기준 헥타르 단위로 집계한 소형 통계 파일(CSV 약 100바이트)이다. 지역 산림 분석가나 담당자가 '인천 산림은 어떤 숲 유형이 얼마나 차지하는가'를 확인하거나 산림 경영·보전 계획의 기초 수치로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역·연도의 임상별 산림면적 통계와는 임상 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
