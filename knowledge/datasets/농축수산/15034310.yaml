description_portal: 천안시 관내 축산업에 종사하는  농가 현황(한우, 육우, 돼지, 가금류 등)으로 농장명, 주사육축종, 사업장소재지 등을 제공합니다천안시 축산농가현황 데이터는 지역 내 축산 농가의 기본 정보를 체계적으로 관리하기 위해 구축된 자료입니다. 각 농가의 고유 번호, 사업장명, 주사육업종, 소재지 주소를 포함하여 사육두수와 데이터 기준일을 함께 제공합니다. 본 데이터는 축종별 분포, 농가 밀집도, 생산 기반 현황 등을 분석하는 데 활용되며, 축산 정책 수립, 방역 관리, 지역 환경 모니터링 등 다양한 행정 목적에도 활용할 수 있는 기초 자료입니다.
