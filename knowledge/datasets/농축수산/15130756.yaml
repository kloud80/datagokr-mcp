summary_user: 경기도의 과수 품목별 생산 현황을 기준년도·품목(배, 체리, 아로니아, 떫은감 등)별로 농가 수, 재배면적(ha), 생산량(톤)으로 정리한 집계 자료이며, 범위는 시도 단위의 비공간 데이터다. 정책 담당자나 분석가가 '경기도에서 특정 과일을 재배하는 농가와 면적, 생산량이 해마다 어떻게 변했나'를 확인해 재배 지원이나 공급 전략을 검토하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 품목명(prodlst_nm)과 기준년도를 이름으로 맞춰 이어야 하며, KAMIS 가격 등과 연결하려면 품목코드 매핑이 필요하다.
description_portal: '이 데이터는 연도별 과수 품목별 생산 현황을 정리한 자료로, 기준년도, 품목명(예: 배, 체리, 아로니아, 떫은감 등), 농가 수, 재배면적(ha), 생산량(톤)으로 구성되어 있습니다. 특정 품목에 대한 농가 참여 규모, 재배 공간 규모, 총 생산량을 확인할 수 있어 과수산업의 규모와 변화를 파악하는 데 유용합니다. 과일 품목별 재배 현황을 분석하여 수요 기반 작물 정책 수립, 재배 지원 정책 타당성 검토, 품목별 시장공급 전략 수립 등에 활용될 수 있으며, 지역별 과수 집중도 평가 및 친환경 재배 확대 등 정책 개발의 기초자료로도 활용 가능합니다.'
