description_portal: 2022년도 기준, 전라남도 나주시의 농기계임대사업소 농기계 임대 현황입니다.농기계화 촉진을 통한 농가 노동력 절감을 위한 정책사업입니다나주시는 "더 편리한 임대, 더 안전한 영농"을 목표로 임대사업을 수행하고 있습니다.농기계임대사업소 운영으로 농기계 구입이 어려운 농가에 농기계를 임대함으로써 농기계 구입부담을 경감하고 밭농업 기계화율 제고합니다.또한 농기계임대사업소 활성화로 농업인의 편리한 임대와 안전한 영농을 제공 하고 있습니다. 나주시 농기계 임대현황은 농기계임대사업 현황을 임대기종명, 임대수, 임대기간, 임대일수, 임대료, 작업내용, 작업면적 등을 제공합니다.
