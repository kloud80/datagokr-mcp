summary_user: 전국 100대 명산 숲길 코스의 노면 정보를 지점(좌표) 단위로 담은 API로, 경로·숲길 식별자와 숲길명, 위도·경도·해발고도, 원천 노면유형(1~3단계 코드·명칭), 기준일시를 제공한다. 등산객이나 등산 앱·지도 서비스 개발자가 '이 명산 코스의 어느 구간이 흙길·암릉·계단 같은 어떤 노면인가'를 확인하거나, 분석가가 구간별 접근성·안전성과 유지보수 대상을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 숲길명·코스 식별자(crseId) 같은 같은 기관 코드나 위경도 좌표를 기준으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 전국 100대 명산의 숲길 구간(코스) 노면 정보를 조회할 수 있는 서비스입니다.API를 통해 경로식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천노면유형명, 원천노면유형코드, 기준일시 등의 속성을 호출할 수 있으며, 이를 활용해 구간별 노면 특성 파악, 접근성·안전성 평가, 코스 유지보수 계획 수립, GIS 기반 시각화 등 다양한 분석과 서비스 개발에 적용할 수 있는 정보를 JSON+XML 포맷으로 지원합니다.
