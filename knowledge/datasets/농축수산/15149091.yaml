description_portal: 해양수산부 해양수산인재개발원에서 운영중인 바다배움터 게시판자료에 관한 데이터 입니다.TLMEA010 테이블은 마스터 테이블이며 색인ID와 게시물아이디는 같은 값입니다.TLMEA010 테이블에서 게시물작성자아이디와 게시물작성자이름 컬럼은 개인정보로 삭제되었음을 알려드립니다.TLMEA010의 색인아이디와 TLMEA020의 색인아이디, 게시물아이디는 같은 값이며TLMEA020은 TLMEA010의 게시글 정보에 따른 세부 내용이 포함되어있습니다.TLMEA040은 각 게시물의 조회에 대한 데이터이며, TLMEA010의 색인아이디와 TLMEA040의 색인아이디는 동일합니다.TLMEA040의 게시물아이디는 각 게시판별로 부여된 별도의 아이디값입니다.TLMEA040의 게시물조회아이디와 게시물조회아이피는 개인정보이므로 삭제되었습니다. 바다배움터의 게시판 중 현재 존재하지 않는 게시판이 존재할 수 있으며,TLMEA010에서 삭제된 게시물이 있지만 TLMEA020,TLMEA040에서 삭제되지 않은 쓰레기데이터가 남아있습니다.
