summary_user: 2020년 곤충산업 현황 실태조사 결과를 담은 전국 단위 집계표로, 곤충 사육·가공·유통 농가·업체의 사육시설 현황, 사육곤충 판매액, 가공유통 판매액, 체험학습장 현황을 담는다. 곤충산업 창업을 검토하는 사업자나 정책 담당자가 '2020년 곤충 사육·가공 업체 규모와 판매액은 어느 정도였나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명·항목명을 직접 맞추거나 같은 기관 자료끼리만 연결할 수 있다.
description_portal: 해당 데이터는 곤충산업 현황 실태조사 데이터로, 주요 항목으로는 사육시설 현황, 사육곤충판매액, 가공유통판매액, 체험학습장 현황 등을 포함하고 있습니다. 이를 통해 곤충산업의 전반적인 규모와 경제적 가치를 파악할 수 있으며, 산업별 수익 구조 및 지역별 사육·가공·체험 인프라 분포를 이해할 수 있습니다. 또한 사육시설과 체험학습장의 현황 정보를 분석함으로써 곤충산업의 성장 가능성과 신규 창업 기회를 평가할 수 있으며, 곤충산업 관련 정책 수립과 지원 전략 마련, 농업·식품 산업과 연계한 부가가치 창출 방안 개발 등에도 활용될 수 있는 기초 자료로 구성되어 있습니다. 이를 통해 곤충산업 전반에 대한 실태 파악과 정책적·산업적 의사결정에 필요한 통계적 근거를 제공하고 있습니다.
