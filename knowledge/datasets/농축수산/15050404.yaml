summary_user: 국립농산물품질관리원이 관리하는 농산물우수관리(GAP) 인증농가를 인증번호 단위로 담은 현황 자료로, 소재지·품목·재배면적(㎡)·생산계획량(톤)을 전국 범위로 수록한다. 유통업자나 식자재 구매 담당자가 특정 지역·품목에서 GAP 인증을 받은 농가가 얼마나 있고 재배면적과 생산계획량이 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 이름이나 품목명을 매핑해야 하며, 특히 품목은 KAMIS·도매시장·KOSIS 품목코드와 체계가 달라 별도 매핑이 필요하다.
description_portal: 농산물우수관리인증은 생산에서 판매 단계까지 안전관리체계를 구축하여 소비자에게 안전한 농산물을 공급, 농산물의 안전성 확보를 통한 소비자 신뢰 제고 및 국제시장에서 우리 농산물의 경쟁력 강화, 저투입 지속가능한 농업을 통한 농업환경 보호를 목적으로 도입한 제도로서 본 정보는 국립농산물품질관리원에서 관리하는 농산물우수관리(GAP) 인증농가 현황 정보로서, 인증번호, 소재지, 품목, 재배면적(제곱미터), 생산 계획량(톤) 항목으로 구성되어 있습니다. 지역별.품목별 등 농산물우수관리 인증현황에 관심이 많은 경우에 유용하게 활용할 수 있을 것으로 기대됩니다.
