description_portal: 이 데이터는 해양수산부의 바다내비 그룹 정보 체계 마련을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 바다내비 시스템 구축 시 설정된 메뉴구성, 코드구성, 그리고 시스템 간 연계구성 정보를 포함하고 있습니다. 해당 데이터는 시스템 구축 당시의 일회성 정보입니다.본 데이터는 해양·항만 정보시스템 개발업체가 해상 교통정보 통합 및 서비스 개선을 위한 분류체계 분석, 시스템 구성을 위한 사전 기초자료 수집, 그리고 연계 서비스 도입 시 기존 체계 참고 등에 활용될 수 있습니다. 또한 해양정보 관련 기관에서 내부 시스템 개선 방향 도출, 교통정보 표준화 연구, 정책자료 작성 시 참고자료로 활용할 수 있습니다.
