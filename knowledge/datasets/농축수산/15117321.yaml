description_portal: 한국농어촌공사에서 설치/관리 하고 있는 염도 정보 입니다.소속 본부 및 지사 칼럼이 제공됩니다.염도계가 설치되어 있는 시설명이 제공됩니다.배수장, 관정, 배수갑문, 양수장 등 염도계가 설치되어있는 위치명이 제공됩니다.시설 구분값으로 관정, 배수장, 양수장, 방조제 등의 정보가 기재되어 있습니다.한국농어촌공사에서 관리하는 염도계는 해안가 주변 농업기반시설물에 주로 설치되어 있습니다.염도 위치정보, 염도값, 마지막 계측데이터를 제공합니다.최신 데이터 데이터의 경우 RAWRIS 시스템에서 받아서 활용하시는걸 추천드립니다.
