summary_user: "경기평택항만공사 소관 평택항 부두시설을 선석 단위로 정리한 현황 목록으로, 포털 설명 기준 62개 선석의 부두명·선석번호·접안능력·하역능력·운영사·처리화물 등을 담는다(민간 운영 부두는 빠져 있다). 물류 분석가나 항만 이용 사업자가 '평택항에서 특정 화물(예: 자동차·컨테이너)을 처리하는 선석과 운영사가 어디인지'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 항만·물동량 데이터와는 부두명이나 운영사명(co_nm)을 이름으로 맞춰 연결해야 한다."
description_portal: 이 데이터는 경기평택항만공사 소속의 부두시설 현황을 담고 있으며, 총 62개의 선석에 대한 정보를 포함하고 있습니다. 주요 항목은 부두시설, 선석번호, 접안능력, 하역능력, 운영사, 처리화물 등으로, 각 부두의 선석별 기능과 역할, 담당 운영사 및 처리되는 화물의 종류 등을 확인할 수 있습니다.이 데이터는 평택항의 물류 기능과 처리 능력, 항만 운영 주체에 대한 정보를 파악하고, 물동량 분석 및 향후 항만 개발 전략 수립의 기초 자료로 활용될 수 있습니다.※  경기도 산하 공공기관인 경기평택항만공사 소관 부두시설 현황으로 민간에서 운영하는 부두 정보는 제외되었습니다.
