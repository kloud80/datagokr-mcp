description_portal: '공공데이터는 경상남도 사천시 관내에서 활동하는*농업 작목반(작물별 생산자 조직*들의 상세 정보를 집계한 현황 자료입니다. 이 자료는 사천시 농업의 주요 생산 구조와 규모를 파악하고, 농산물 수급 조절, 기술 보급 및 공동 마케팅을 지원하기 위한 기초 자료로 활용됩니다.제공되는 주요 데이터 항목은 다음과 같습니다.명칭: 각 농업 작목반의 공식적인 이름을 명시합니다.대표자: 해당 작목반을 이끌어가는 대표자의 성명을 기록합니다.주요 생산품: 작목반이 주력으로 재배하거나 생산하는 농산물의 종류를 분류하여 농업 특성을 보여줍니다.생산량: 해당 작목반이 연간 혹은 특정 기간 동안 생산하는 농산물의 규모를 구체적인 수치로 제공하여 생산력을 파악할 수 있습니다.이 현황 자료는 사천시 농업의 협업 체계 및 집단 재배 규모를 투명하게 보여주며, 지역 농업 정책 수립 및 농가 지원 사업의 효율성을 높이는 데 중요한 역할을 합니다.'
