description_portal: 국립종자원의 국제종자생명교육센터는 농업 종사자, 학생, 공무원, 일반인을 대상으로 종자생명 분야 전문교육을 담당합니다.교육센터는 교육동과 숙소동으로 이루어져 있으며, 교육동은 지하1층에서 지상 4층으로 구성됩니다. 교육센터에서 각 강의동을 대관할 수도 있습니다.본 자료는 교육동 각 강의실에 대한 정보를 포함하고 있습니다.강의실의 명칭, 강의실 번호, 사용가능 여부, 강의실의 주 목적 정보가 포함됩니다.※ 제공되는 데이터는 "CSV(Comma Separated Values, 쉼표로 값을 구분하여 데이터를 저장하는 파일 형식)" 타입으로 엑셀(Excel), 한셀, CSV 전용 뷰어나 메모장등으로 데이터 확인이 가능합니다.
