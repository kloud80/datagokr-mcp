description_portal: 농림식품기술기획평가원에서 보유하고 있는 농림식품 판매기술 정보입니다. 농림식품 분야 연구개발을 통해 개발된 판매 가능 기술에 관한 정보를 포함합니다. 파일데이터(CSV) 형태로 개방하고 있으며, 과학기술분류(대,중,소), 농림식품과학기술분류(대,중,소), 판매기술명, 기술키워드(3개), 기술완성도, 희망거래유형, 기술이전조건, 기술이전금액, 기술개요, 기술의우수성, 활용가능분야 정보를 포함하고 있습니다.기술상용화플랫폼(newat.or.kr)에서 판매기술 정보를 확인할 수 있습니다. 기업 및 기관이 필요로 하는 기술을 손쉽게 발굴하고, 농림식품 기술의 사업화 가능성을 사전에 검토할 수 있도록 돕습니다. 기술이전 활성화 및 산업 현장 활용을 촉진하여 연구성과의 실용적 가치를 높이는 데 기여합니다. 본 정보는 기술이전과 사업화를 희망하는 수요자에게 유용한 참고자료로 활용될 수 있으며, 공공데이터포털(data.go.kr)을 통해 누구나 자유롭게 이용할 수 있습니다.
