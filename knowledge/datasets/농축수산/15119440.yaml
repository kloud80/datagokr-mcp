summary_user: 2021~2024년 국내 철새에 위치추적기를 부착해 얻은 이동 정보를 개체 단위로 담는다. 연도·북상일·조류종(부착코드)·추적기코드와 북상 전 국내 위치, 북상 후 국외 위치가 함께 들어 있다. 방역 담당자나 연구자가 특정 종이 언제 국내 어느 지역을 떠나 어느 나라로 북상했는지 확인해 조류인플루엔자 예찰 시기와 지역을 정하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 위치 이름이나 조류종 이름을 맞춰 연결해야 한다.
description_portal: 2021년부터 2024년까지의 국내 철새 이동정보로 연도, 북상일, 조류종(위치추적기 부착코드), 북상 전 국내 위치 및 북상 후 국외 위치 정보를 포함한 데이터임- 연도별 이동 시기, 북상 이동 일자, 이동 개체의 종별 구분,, 위치 추적기 부착 코드 등을 포함하고 있음- 철새의 국내 서식지 위치 및 북상 후 국외 주요 경로 정보를 함께 제공하여, 국내외 철새 이동 패턴을 체계적으로 분석할 수 있도록 구성- 해당 데이터를 통해 철새의 생태학적 연구뿐만 아니라, 조류인플루엔자(AI) 등 주요 전염병 예찰 및 방역 정책 수립에도 활용 가능
