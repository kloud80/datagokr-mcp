description_portal: 이 데이터는 해양수산부에서 한국 어선의 일본 EEZ(배타적 경제수역) 내 협정 어업 활동과 관련된 협정 기본 정보 제공을 목적으로 수집된 데이터입니다.    본 데이터의 주요 내용은 기준년도, 어업종류코드, EEZ어종코드, 업종한글명, 업종영문명, 업종한자명, 어종한글명, 어종영문명, 어종한자명, 조업수역코드, 사용어구코드, 확정여부, 확정일자, 최초생성시점, 최종변경시점, 데이터기준일자로 구성되어 있습니다.  본 데이터는 한일 EEZ어업협정에 따라 한국 어선의 일본 EEZ 내 조업과 관련된 업종 및 어종, 조업 수역 정보 등을 체계적으로 기록, 분석하는 데 활용할 수 있으며, 어업관계 행정처리, 양국 협정 변화와 조업 조건 분석, 연구기관의 해양수산 정책 연구, 관련 산업의 현황 및 변동성 추이 파악 용도로 사용할 수 있습니다.
