summary_user: 우리나라 영해의 바깥 한계선과 영해 폭을 재는 기준선인 직선기선을 담은 전국 범위의 파일 데이터로, 압축 파일(약 19MB) 하나로 제공된다. 해상풍력 사업자나 해양공간계획 분석가가 '이 해역이 영해 안인지, 직선기선 기준으로 어디까지가 우리 관할인지'를 확인할 때 쓴다. 실측 컬럼에서 공통 조인 키를 찾지 못했으므로, 해양용도구역·보호구역·EEZ 등 다른 해양공간 데이터와는 이름 대조나 같은 기관 자료끼리의 공간 중첩으로 이어 쓴다.
