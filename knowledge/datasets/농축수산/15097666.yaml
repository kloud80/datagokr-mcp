description_portal: 데이터는 경기도 화성시에서 포도 재배 스마트팜을 대상으로 낙엽기 시기에 측정된 토양 습도 정보를 수집한 자료이다. 데이터는 개별 농가 단위로 구성되며, 각 항목에는 농가 고유번호, 측정 지점의 공간정보(x, y 좌표), 해당 위치에서 수집된 지습 값이 포함되어 있다. 이는 스마트농업 환경에서 낙엽기 토양 수분 상태를 파악하기 위한 기초 자료로 활용 가능하며, 작물의 생육 조건 분석, 재배환경 개선 및 농업기술 지원 등의 목적으로 활용될 수 있다. 데이터는 현장 측정 장비를 통해 일회성으로 수집되었다. 자료 활용 시 기상 조건, 토양 유형 등 지역적 특성을 함께 고려하는 것이 중요하다. 농업 정책 수립, 연구 개발, 환경 변화 대응 등 다양한 분야에 기여할 수 있는 기초 데이터이다.
