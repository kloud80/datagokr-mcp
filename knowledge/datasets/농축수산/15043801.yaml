description_portal: 이 데이터는 해양수산부에서 해양사고의 발생 현황을 유형별로 파악하고 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2002년부터 2012년까지 각 연도별로 충돌, 접촉, 좌초, 전복 등 사고 유형에 따라 분류된 해양사고 발생 건수로 구성되어 있습니다.  본 데이터는 유관 국가기관에서 해양사고의 유형별 트렌드를 분석하여 해양 안전정책 수립 및 개선, 해양시설 및 장비의 안전 기준 강화 등 행정적 업무를 위한 기초 데이터로 활용할 수 있습니다. 또한, 해운·조선 관련 기업에서 사고 방지 대책 마련 등을 위한 자료로 사용될 수 있습니다.
