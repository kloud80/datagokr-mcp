summary_user: 갯벌어장 관측소별로 관측일자·관측시간마다 측정한 수온을 담은 건별 측정 파일(csv, 약 29KB)이며, 범위는 전국이고 공간 좌표는 없다. 양식·갯벌 어업인이나 해양 행정 담당자가 특정 갯벌어장 관측소의 수온이 언제 얼마나 오르내렸는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 관측·어장 데이터와는 관측소 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 갯벌어장실시간측정에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일자, 관측소, 관측시간, 수온 데이터로 구성되어 있습니다.본 데이터는 갯벌어장실시간측정 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.갯벌어장이란 갯벌에서 다양한 수산자원이 서식하며 어업 활동이 이루어지는 곳을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
