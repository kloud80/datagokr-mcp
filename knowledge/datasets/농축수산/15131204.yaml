summary_user: 농식품 공공데이터포털에 접수된 데이터 분석 신청을 건별로 담으며, 신청 일련번호·제목·신청 데이터명·요청 시작일과 종료일이 들어 있고 범위는 전국·비공간이다. 연구자나 공공데이터 담당자가 "농식품 분야에서 어떤 데이터에 분석 신청이 몰리는가"처럼 데이터 활용 동향을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 신청 데이터명을 데이터셋 이름에 맞추는 식의 이름 매핑으로만 연결한다.
description_portal: 농림축산식품부는 농식품 공공데이터 포털에 대한 데이터 분석 신청 정보를 제공합니다. 이 데이터는 데이터 분석 신청 일련번호, 제목, 신청 데이터명, 요청 시작일, 요청 종료일 등을 포함하고 있습니다. 이를 통해 농식품 공공데이터 포털의 데이터 분석 신청 현황을 파악하고, 관련 데이터의 활용 가능성을 평가하는 데 활용됩니다. 또한, 데이터 분석 신청 정보를 통해 농식품 분야의 데이터 활용 동향을 파악하고, 향후 데이터 분석 및 활용 전략 수립에 기여하고자 합니다. 이러한 정보는 농식품 분야의 데이터 분석자, 연구자, 공공데이터 활용자 등에게 유용한 참고자료로 활용될 수 있습니다.
