summary_user: 공공급식통합플랫폼(학교급식전자조달시스템)으로 수집된 전국 학교급식 식재료 계약을 계약서 건별로 담으며, 변경계약 차수·계약형태·계약일자·납품 기간·계약금액·구매사(학교)와 출하자 및 각각의 시도가 들어 있다(CSV 약 103MB). 급식 관계자가 비슷한 학교의 계약금액과 납품 기간을 보고 예산을 잡거나, 식재료 업체가 어느 시도 학교에 다른 지역 출하자가 얼마나 납품하는지 따져 보는 데 쓴다. 전역 조인 키는 없고, 구매사·출하자 시도코드나 시도명으로 지역 통계와 맞추거나 구매사명으로 학교 정보와 이름을 맞춰 잇는다.
description_portal: '공공급식통합플랫폼(https://ns.eat.co.kr/)을 통해 수집된 학교급식 계약 현황- 학교에서 제공하고 있는 급식의 식재료납품사를 매칭하여 건강하고 투평한 입찰 정보를 제공함. 학부모 및 학생들이 신뢰하고 먹을 수 있는 급식을 위한 백데이터를 제공.- 학교급식 계약건을 기반으로 계약일자별 납품정보, 계약 금액, 구매사 및 출하자 정보 등 제공* 학교급식전자조달시스템: 학교가 급식 재료를 구하기 위하여 업체를 선정하고 계약을 체결하는 급식재료 전문 전자조달 시스템* 데이터 활용 예급식 관계자: 계약금액과 납품 기간을 바탕으로 예산 계획 등 효과적인 의사결정에 참고식재료 조달업체: 지역별 납품 기간, 지역 간 거래 비율을 분석해 효율적인 공급망 구축'
