summary_user: 전국 100대 명산 주요 숲길 구간의 관심지점(POI)을 지점 한 건씩 담으며, 지점마다 위도·경도·해발고도, 장소 유형, 장소명·설명, 이정표 목적지(최대 4개)와 방향, 기준일시가 붙는다. 등산객이나 탐방 안내 서비스 개발자가 '이 산 이 숲길에서 이정표·안전시설·주요 지점이 어디에 있고 어느 방향을 가리키나'를 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 숲길식별자(frtrlId)·숲길명으로 같은 기관의 숲길 정보와 묶거나 좌표로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 전국 100대 명산의 주요 숲길 구간에 대한 관심지점(POI) 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천장소유형명, 원천장소유형코드, 장소명, 설명내용, 기준일시, 원천조사진행방향명, 이정표목적지명, 원천이정표목적지방향명, 원천이정표목적지코드 정보를 호출할 수 있으며, 이를 활용하여 탐방로 구간별 안내, 주요 포인트 시각화, 안전시설 위치 파악, 숲길 이용정보 분석, GIS 기반 경로 시각화 및 관리 시스템 구축 등 다양한 분야에서 활용할 수 있는 정보를 JSON+XML 포맷으로 지원합니다.
