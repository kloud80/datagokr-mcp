summary_user: 전년도에 생산된 산림사업용 유묘의 가격을 수종별·묘령별로 정리한 전국 단위 집계 파일로, 한 해분(2025년산 유묘 가격) 한 장짜리 표(csv 522바이트)입니다. 지자체·산림 관련 기관 담당자나 조림 사업자가 '올해 조림 사업에서 특정 수종 유묘를 공공 구매할 때 단가를 얼마로 잡아야 하나'를 확인해 예산과 사업 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수종 이름을 맞춰 연결해야 하며, 같은 기관의 종묘 관련 자료나 조림 실적 자료와 수종명 기준으로 이어 쓴다.
description_portal: 본 자료는 전년도에 생산된 산림사업용 유묘의 가격 현황을 정리한 것입니다. 국가 또는 지방자치단체가 산지 조림 등 공공 목적의 산림사업을 위해 구입하는 경우의 가격을 기준으로 하며, 일반 시중에서 거래되는 가격과는 차이가 있음을 알려드립니다.산림청은 「산림자원의 조성 및 관리에 관한 법률 시행령」 제16조에 근거하여 매년 산림용 종묘가격을 고시하고 있습니다. 이 자료는 산림사업 관련 예산 편성, 조림 사업 계획 수립, 공공기관 구매 기준 설정 등 다양한 행정·정책적 목적에 활용될 수 있습니다.더 구체적이고 상세한 정보는 산림청 고시(제2024-125호)를 통해 확인할 수 있습니다.
