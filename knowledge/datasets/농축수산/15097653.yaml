description_portal: 데이터는 경기도 화성시 내 포도 스마트팜 농가를 대상으로 2019년 1월부터 3월까지의 휴면기 기간 동안 측정된 지습 정보를 수집·정리한 것이다. 해당 기간은 작물 생육이 정지된 상태로, 뿌리의 활력 유지와 수분 관리가 중요한 시기이며, 지습 변화는 향후 생육 시작에 영향을 미칠 수 있다. 데이터는 농가별 위치 기반으로 수집되었으며, 측정 시점별 토양 수분량 값을 포함하고 있다. 각 농가별 토양의 수분 상태를 파악함으로써 재배 환경의 적정성 여부를 판단하는 데 활용 가능하며, 향후 포도 재배 전략 수립과 품질 관리에도 기초 자료로 제공될 수 있다. 공간정보와 연계된 구조로 구성되어 있어 지역 기반 농업정책 수립 및 분석에도 유용하다.
