description_portal: '경기도 평택시에 등록된 가금류 농장의 운영 현황을 제공하는 데이터입니다. 항목은 구분명, 소재지지번주소, 소재지도로명주소, 사육마리수 등으로 구성되어 있으며, 지역 내 가금류 사육농가의 위치와 규모, 축종 구성을 확인할 수 있습니다. 본 데이터는 조류인플루엔자 등 가축 질병 방역대책 수립, 축산자원 분포 분석, 농업경영통계 생산, 가축위생방역본부 대응자료, 가금류 유통정책 수립 등에 활용됩니다. 1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※문의 : 평택시 농업기술센터 축산반려동물과(031-8024-3814)'
