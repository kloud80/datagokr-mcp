summary_user: 국립수목원 표본DB를 근거로 식물의 분포지역을 시도·시군구·상세주소와 분포식물 학명·국명 단위로 담은 파일 데이터이며, 전국 89,881행 규모다. 분석가나 산림 담당자가 특정 식물종이 어느 지역에서 확인되는지, 취약종이 어디에 분포하는지 찾는 질문에 쓴다. 상세주소(address)를 조인 키로 다른 주소 기반 자료와 이어 쓰며, 별도의 코드표나 다른 식별 키는 필드에 없다.
description_portal: 국립수목원 국가생물종지식정보시스템의 데이터 중 식물의 분포지역에 대한 정보로 시도명(도,광역시), 시군구명(시,군,구), 상세주소, 분포식물학명, 분포식물국명 등의 정보를 제공합니다.국립수목원에서 제공하는 표본정보는 각 대학 식물 표본관, 연구소등에서 소장하고 있는 식물표본을 정보화하였으며, 현재 구축된 약70만점의 표본DB를 근거한 분포정보를 제공하고 있습니다.이를 활용해 기후변화에 따른 식물의 분포역 동태 파악 및 취약종 관리에 활용, 한반도 산림식생의 효율적인 관리 방안 및 산림정책 수립에 활용됩니다.
