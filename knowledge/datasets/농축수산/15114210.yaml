description_portal: 이 데이터는 해양수산부에서 서해안에 설치된 자동위치식별신호표지(AIS)의 현황을 파악하고 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 자동위치식별신호표지의 공간정보 일련번호, 수집 대상 자료 출처명과 출처 상세정보, 표지의 명칭과 설치 위치 명칭 등으로 구성되어 있습니다.본 데이터는 서해 해역의 항로 안전 관리, 해상 교통체계 구축, 신호표지 점검 및 관리 계획 수립, 해사 정보 시스템 연계 자료로 활용될 수 있으며, 실시간 항행 안전 정보를 필요로 하는 관제 시스템 개발, 해양사고 예방 및 관련 정책자료로 사용될 수 있습니다.
