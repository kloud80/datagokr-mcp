description_portal: '이 데이터는 지역 내 양돈농가의 사육 현황을 체계적으로 정리한 자료입니다. 각 농가별로 등록된 축종, 사육두수, 사육시설 규모, 오폐수 처리 방법 등의 주요 정보를 포함하고 있으며, 축산업 행정 관리, 가축전염병 예방대책, 환경오염 저감정책 수립 등 다양한 분야에서 활용될 수 있습니다. 특히 사육두수와 면적 정보를 통해 양돈산업의 규모를 파악할 수 있고, 오폐수 처리 방식 데이터를 통해 친환경 축산정책의 추진 방향을 분석할 수 있습니다. 본 데이터는 총 8개 항목으로 구성되어 있습니다.사업장명칭: 등록된 양돈농장의 공식 명칭입니다.등록축종: 해당 농장에서 사육 중인 축종으로, ‘양돈’으로 표기됩니다.사업장소재지(지번): 농장이 위치한 행정구역 및 지번 주소입니다.사육두수: 농장에서 사육 중인 돼지의 총 마리 수를 나타냅니다.동수(계): 농장 내 돈사(사육시설)의 총 동 수를 의미합니다.면적(계): 전체 사육시설의 면적을 제곱미터(㎡) 단위로 표시합니다.오폐수처리방법: 분뇨 및 오폐수를 처리하는 방식으로, ‘퇴액비자원화’ 등이 포함됩니다.데이터기준일자: 본 데이터가 집계된 기준일을 나타냅니다.'
