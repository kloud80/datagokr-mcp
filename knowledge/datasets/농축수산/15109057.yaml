summary_user: 전국 산지코드를 우편번호·시도·시군·동 단위로 조회해 돌려주는 코드 참조 API로, 건별 거래나 가격이 아니라 지역 주소와 산지코드를 짝지은 기준 정보를 담는다. 도매시장 경락·산지 가격 자료를 지역별로 묶어 보려는 분석가가 '이 산지코드는 어느 시군·읍면동인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 우편번호나 시도·시군·동 이름을 매핑하거나 같은 기관의 다른 코드 API(품목·도매시장 코드 등)와 맞춰 잇는다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 "농수산식품부 OpenAPI 서비스"는 농수산식품 관련 각종 코드 정보를 체계적으로 관리하고 공유하기 위한 시스템입니다. 이 서비스를 통해 제공되는 주요 데이터는 가락시장품목코드, 가락시장단위코드, 도매시장코드, 도매시장법인코드, 등급코드, 단위코드, 부류표준품목코드, 품목표준코드, 품종표준코드, 그리고 산지코드 등 다양합니다. 이러한 데이터는 농수산물 유통 및 거래 분석에 중요한 기초자료로 활용될 수 있으며, 예를 들어, 유통업체는 소비 트렌드를 파악하고, 연구기관은 농수산물 산업의 발전 방향을 모색할 수 있습니다. 또한, 본 서비스의 '산지코드조회' 기능을 통해 사용자들은 우편번호, 시도, 시군, 동을 검색조건으로 하여 정확한 산지코드정보를 제공받을 수 있습니다. 이는 지역 농산물의 출처를 명확히 하고, 관련 통계 데이터 작성 시 유용하게 활용될 수 있습니다.
