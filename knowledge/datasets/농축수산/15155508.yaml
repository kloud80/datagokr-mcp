description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소, 해양관측소 및 해양과학기지 등을 통해 관측된 최신 해양 관측 데이터를 제공하기 위해 수집한 데이터 입니다. 관측소 코드, 관측일자, 시간 간격 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 관측소 경도/위도 위치정보, 관측일시 및 조위, 수온, 염분, 기온, 기압, 풍향, 풍속, 유향, 유속 등의 해양 관측 데이터로 구성되어 있습니다. 본 데이터를 활용하여 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양 환경 연구 등에 활용될 수 있습니다.
