summary_user: 전국 조위관측소 등에서 관측한 최신 해양 관측값(조위·수온·염분·기온·기압·풍향·풍속·유향·유속)을 관측소 단위로 돌려주는 API이며, 검증 호출에서 24행이 수신됐다. 연안 낚시·레저 이용자나 항만·어업 종사자가 지금 바다의 조위와 수온, 바람 상태가 어떤지 확인하는 질문에 쓴다. 관측소 경도·위도 좌표(lat)를 조인 키로 삼아 다른 위치 기반 데이터와 잇고, 바다누리(KHOA) 자체 관측소 코드로 같은 기관의 다른 관측·예보 데이터와 맞춰 쓴다.
limits: API 전체 건수가 24건이라 관측소 수가 한정되어 있고, 시계열 이력 분석에는 맞지 않는 최신값 중심 데이터다. 조인 키로 확인된 것은 좌표(lat)뿐이며, 관측소 코드는 기관 자체 코드라 다른 기관 코드체계와 바로 맞지 않을 수 있다. 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
