summary_user: 어선별 제원(길이·너비·깊이, 총톤수, 추진기관, 선적항, 조선자, 진수년월일)과 등록·변경 일시를 신고서 단위로 쌓은 어선기본정보 변동 이력 파일로, 전국 범위이며 CSV 한 개(약 19만 바이트)로 받는다. 어선 거래나 검사를 앞둔 사업자·행정 담당자가 "이 어선번호의 배는 언제 톤수나 기관이 바뀌었나"처럼 특정 어선의 연혁과 제원 변동을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 어선번호나 어선 명칭을 매개로 같은 해양수산부의 어업 허가·어선 등록 데이터와 이름·번호 매핑으로 연결한다.
