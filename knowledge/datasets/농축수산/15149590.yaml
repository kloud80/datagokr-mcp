summary_user: 해양수산부가 환경관리해역에 설치한 해양수질자동측정망의 측정결과를 관측날짜별로 담은 파일(CSV, 약 95KB)로, 수온·염분·전기전도도·수소이온농도·용존산소량·탁도·클로로필A 같은 수질 항목과 일사량·기온·상대습도·풍속·풍향 같은 기상 항목을 함께 담는다. 연구자나 양식 어업인이 "환경관리해역에서 용존산소가 낮아지거나 수온이 오른 시기가 언제였나"처럼 수질 변화를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 해양 관측 자료와는 관측날짜를 기준으로 맞추거나 측정소 이름·같은 기관 코드 매핑으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 해양수질자동측정망(환경관리해역)측정결과에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측날짜, 전기전도도, 수온, 수소이온농도, 용존산소량, 탁도, 탁도임시, 일사량, 기온, 상대습도, 풍속, 풍향, 전압, 염분, 클로로필A 데이터로 구성되어 있습니다.본 데이터는 해양수질자동측정망(환경관리해역)측정결과 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양수질자동측정망이란 전국 연안 및 주요 해역에 설치된 자동 측정소에서 수온, 염분, 용존산소 등 해양수질 항목을 실시간으로 측정하고 데이터를 전송하여 해양 환경 상태의 변화를 파악하고 예측·예보하는 시스템을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
