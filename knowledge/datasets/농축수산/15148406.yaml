summary_user: 농업분야 재정사업의 사업보조금 지급 현황을 신청번호 단위로 담은 파일 데이터로, 지자체사업명·사업기간·개인/법인 구분·등록기관과 국고·지방비의 보조·융자, 자부담·기타 금액을 담는다(전국 범위, csv 약 20KB). 분석가나 지자체 담당자가 "어느 시군구에서 어떤 농업 보조사업에 국고와 지방비, 자부담이 얼마씩 들어갔나"를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 주소(기본주소)나 사업명·등록기관 이름을 맞춰서만 이을 수 있다.
description_portal: 농림축산식품부에서는 사업보조금지급정보를 제공합니다.본 정보 제공 데이터는 신청번호, 내역사업년도, 지자체사업명, 사업시작년도, 사업종료년도, 검증구분, 개인법인구분, 등록기관, 기본주소, 사용구분, 신청년도, 국고보조, 국고융자, 지방비보조, 지방비융자, 자부담, 기타, 기타특이사항등의 정보를 포함하고 있습니다.본 제공자료는 농업분야재정사업에서 사업보조금지급 현황에 대한 정보를 보여주는 데이터 입니다.기본주소 항목은 민감데이터로 시군구까지만 표기하였습니다.기타 항목은 보조금이나 융자외 기타금액에 대한 데이터입니다.
