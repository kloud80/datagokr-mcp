description_portal: '이 데이터는 해양수산부에서 수산물 품종별 어업생산량 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2001년~2013년까지의 어류, 패류, 갑각류, 연체동물, 기타수산동물, 해조류 등 품종별로 집계된 연도별 어업생산량(단위: 천톤)으로 구성되어 있습니다.  본 데이터는 수산업 관련 연구기관에서 품종별 어업생산 동향 분석, 어업 생산 정책 수립에 참고자료로 활용할 수 있으며, 어업 관련 산업 종사자들이 생산계획 수립이나 품종별 시장 동향 파악을 위한 근거 자료로 사용할 수 있습니다. 또한 교육기관에서 수산업 동향 분석 및 관련 교육 자료로 제공될 수 있습니다.'
