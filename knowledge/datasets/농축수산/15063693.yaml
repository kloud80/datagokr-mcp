summary_user: 전년도(2025년산)에 생산된 산림사업용 용기묘의 가격을 수종별·묘령별로 정리한 전국 단위 소규모 파일(csv 467바이트)이며, 국가·지자체가 공공 산림사업용으로 구입할 때의 기준가를 담는다. 지자체 담당자나 조림 사업자가 '올해 조림 예산을 짤 때 특정 수종 용기묘 한 본에 얼마로 잡아야 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 임산물·종묘 데이터와는 수종명을 이름으로 맞춰 잇는 수밖에 없다.
