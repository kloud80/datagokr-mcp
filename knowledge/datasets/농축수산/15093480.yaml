description_portal: 지속가능한 산림경영계획 수립을 위한 기초자료로서, 국유림 내에서 실시된 산림조사 결과 중 산림 소생물권에 관한 정보를 포함한 세부 내역입니다. 소생물권이란 산림 생태계 내에 서식하는 미소 생물이나 저등식물, 곤충류, 균류, 이끼류 등 다양한 생물군을 지칭하며, 해당 데이터는 이들 생물종의 분포, 서식 환경, 생태적 특성 등을 조사·기록한 것입니다. 이는 산림의 생물다양성 보전과 생태적 건강성 평가, 산림유전자원 보호구역 지정, 산림복원사업 기획, 탄소흡수원 관리, 산림경영단위의 생태 가치 분석 등 다양한 분야에서 활용됩니다.
