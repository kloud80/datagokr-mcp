description_portal: '○ 통계개요* 통계명 : 농축산물 판매규모별 농가* 근거법령 :통계법 제17조 및 제1항에 의한 지정통계(승인번호 제10145호)* 작성목적 : 농림어가와 인구, 경영규모 및 형태 등의 변화추이를 파악하여 국가, 지방자치단체 및연구기관 등의 각종 정책수립, 연구분석 및 평가를 위한 기초자료 제공* 조사체계 : 조사원→지방통계청(사무소)→통계청* 공표주기 : 매년* 공표범위 : 지역- 서울시내용 - 서울시 농축산물 판매규모별 농가수○ 용어설명* 농가 : 조사기준일 현재 논이나 밭을 1,000㎡(10a) 이상 직접 경작하는 가구* 농림어가인구 : 주민등록이나 가족관계등록부와 관계없이 매년 12월 1일 현재, 가구에서 취사, 취침 등생계를 같이하는 사람을 말하며 가족, 친인척, 기타 동거인을 모두 포함○ 기타* 추정과정의 반올림으로 인해 세목과 그 총계가 일치하지 않는 경우도 있음* 농가가 직접 생산한 모든 농산물과 가축 및 그 생산물 중 실제 판매한 농축산물을 대상으로 조사하며,판매금액은 생산비를 제외한 순 수익금이 아니라 판매한 총금액으로 조사'
