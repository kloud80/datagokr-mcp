description_portal: <데이터 설명> 경상남도의 지역별 축산시설 악취 민원 현황에 관한 자료입니다. 가축분뇨로 인한 악취민원의 유형은 축사시설, 토지살포, 액비살포, 기타 등으로 조사되었습니다. 이 데이터는 경상남도 가축분뇨 악취 민원 건수를 파악할 때 활용할 수 있습니다. <데이터 구성 및 세부 항목> 이 데이터는 시군명, 월별 민원건수 등의 데이터를 포함하고있습니다.  <갱신주기 안내>해당 공공데이터는 수시(일회성) 데이터로, 경남도에서는 현재 해당 민원에 대한 주기적으로 갱신되는 자료를 관리하고 있지 않습니다.
