description_portal: 이 자료는 농촌진흥청이 운영하는 **농업경영종합정보시스템(AMIS)**의 팝업 알림 정보를 수록한 것입니다. 팝업은 시스템 내에서 사용자에게 주요 정보를 신속히 전달하기 위한 수단으로 활용되며, 농업경영정보, 농식품 유통 동향, 농업통계 발표, 농산물 가격정보, 시스템 점검 안내, 정책 변경 사항 등 다양한 내용을 포함합니다. 본 자료는 각 팝업의 제목, 내용, 노출 기간, 링크 정보, 대상 사용자 등으로 구성되어 있으며, AMIS 홈페이지 접속 시 시의성 있는 정보를 효과적으로 제공하기 위한 기반 데이터로 활용됩니다. 팝업 알림은 사용자 편의와 정보 접근성을 높이는 역할을 하며, 농업경영 및 관련 행정업무에 필요한 최신 정보를 빠르게 확산하는 데 기여하고 있습니다.
