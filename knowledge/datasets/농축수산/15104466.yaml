description_portal: '해양수산과학기술진흥원이 제공하는 해양수산 분야 국가연구개발사업 세부 과제별 연구비 정보로, 연구개발 자금의 배분과 집행 현황을 종합적으로 제공한다. 예산년도, 사업명, 과제명, 수행유형, 연구기관명, 기관유형, 연구책임자명, 연구개발 시작일과 종료일, 총 연구비, 정부출연금 등 다양한 항목을 포함하여 과제 단위별 재정 현황을 체계적으로 파악할 수 있다. 이를 통해 연구기관은 연구비 운용을 점검하고, 정책 담당자는 예산 계획 수립과 투자 효율성 평가에 참고할 수 있으며, 산업계는 사업 참여 시 재정 구조를 이해하는 데 활용 가능하다. 특히 연구비 배분의 투명성 확보, 성과 중심의 예산 관리, 연구개발 투자 효과성 분석 등 다양한 목적에 기여한다. 본 데이터는 해양수산 연구개발의 재정적 흐름을 세부 단위에서 조망할 수 있는 기초자료로서, 연구자·정책입안자·산업 관계자 모두에게 실질적 가치를 제공한다. 참고: 2023년 이후 범부처통합연구지원시스템(IRIS)으로 해당 시스템이 이관되어 데이터 생산 중단'
