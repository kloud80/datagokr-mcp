description_portal: '"해양수산기술거래플랫폼_지식정보" 데이터는 해양수산과학기술진흥원(KIMST)이 해양수산 기술 분야의 이용자들에게 제공하는 다양한 지식 콘텐츠의 목록을 체계적으로 정리한 자료입니다. 이 데이터의 목적은 플랫폼 사용자들이 필요한 기술 관련 정보에 쉽고 빠르게 접근할 수 있도록 돕는 것입니다. 주요 컬럼은 제공되는 콘텐츠의 명칭인 지식정보명, 해당 정보로 직접 이동할 수 있는 웹 주소(링크), 그리고 정보가 시스템에 등록된 시점(등록일자)으로 구성되어 있습니다. 이 데이터는 해양수산 분야의 최신 동향, 정책 자료, 기술 보고서 등 다양한 지식 정보를 탐색하는 데 활용되며, 정보 접근성을 높이는 핵심 역할을 수행합니다.'
