description_portal: 귀농귀촌 가구수 지표는 도시민의 농촌 유입 규모와 성격을 보여주는 핵심 통계로, 농촌 인구구조 변화와 정책 수립에 중요한 의미를 지닌다. 귀농가구는 농촌으로 이주해 실제 농업에 종사하는 가구를 말하며, 귀촌가구는 농업 여부와 상관없이 농촌에 거주하는 가구를 의미한다. 이 지표는 농림축산식품부와 통계청의 조사로 산출되며, 연령, 출신 지역, 정착 지역 등 다양한 세부항목이 포함된다. 최근 경향을 보면 귀농가구는 농업 수익성 저하와 노동 강도, 기후변화로 감소세를 보이고, 귀촌가구는 은퇴세대의 정착 수요, 재택근무 확산, 주말 농업 문화 등으로 증가하는 추세다. 이로써 농촌은 단순 생산 기반을 넘어 주거·여가 공간으로 변모하고 있음을 알 수 있다. 다만 단순 가구수만으로 정착 성공 여부를 파악하기는 어렵기에 정착률과 소득, 사회 적응도 같은 보조 지표와 함께 종합적으로 해석해야 한다.
