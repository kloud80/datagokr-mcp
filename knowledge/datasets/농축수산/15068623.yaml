description_portal: '가축재해보험은 자연재해 등으로 인한 가축피해를 보험을 통해 보상함으로써 축산 농가의 소득 및 경영 안정을 도모하고 안정적인 축산업을 뒷받침하기 위해 시행하는 제도입니다.1997년 도입 이후 보험 품목 확대, 보장 강화 등을 통해 가입규모가 증가하고 있습니다.- (근거법령) 농어업재해보험법- (사업대상자) 축산업 허가(등록) 및 농업경영체 등록을 한 개인 또는 법인- (보험목적물) "25년 기준 16개 축종 및 가축사육시설본 자료는 가축재해보험 지자체 보조 예산의 사용액, 잔액, 집행률 등 세부현황을 수록하였습니다.이 데이터는 정책보험 정책 수립 및 제도 개선을 위한 기초자료로 활용되며, 농업재해보험에 대한 이해를 돕고 관련된 연구 또는 통계분석 등에 활용될 수 있도록 제공합니다.* 수록자료 및 단위 : 금액(원), 집행률 및 지원비율(%)※ 본 자료는 매년 연말에 전년도 말 기준 자료로 갱신하여 제공합니다.'
