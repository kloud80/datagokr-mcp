summary_user: 제주시 관내 산림의 전체면적을 연도별로 담고, 이를 침엽수·활엽수·혼효림 입목지와 무입목지 같은 임상별 면적, 국유림·공유림(도유림)·사유림 같은 소유별 면적으로 나눈 시군구 단위 집계 통계다(csv 674바이트의 소규모 파일). 분석가나 연구자가 '제주시 산림 중 사유림 비중과 침엽수림 비중은 얼마인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시군구 산림 통계와는 연도와 지역명을 맞춰 붙여야 한다.
description_portal: 본 데이터는 제주특별자치도 제주시 관내의 전체적인 산림 자원 분포와 토지 소유 구조를 종합적으로 파악할 수 있는 통계 자료입니다.해당 연도(2026년 기준) 제주시의 총 산림 규모를 의미하는 "전체면적"을 바탕으로, 산림을 구성하는 식생 현황과 소유 주체별 면적을 매우 상세하게 구분하여 제공하고 있습니다. 먼저 수종별 식생 분포를 살펴보면, 소나무나 삼나무 등으로 이루어진 "침엽수입목지", 참나무류 등 잎이 넓은 나무 중심의 "활엽수입목지", 두 수종이 자연스럽게 섞여 있는 "혼효림입목지", 그리고 나무가 덮여있지 않은 빈 땅인 "무입목지"로 산림의 생태학적 구성을 명확히 수치화하여 보여줍니다.또한 산림의 행정적 소유권에 따라 국가가 직접 관리하는 "국유림", 지자체가 소유한 "공유림(도유림)", 그리고 개인이나 민간 법인이 소유하고 있는 "사유림"으로 관리 주체를 분류하고 있습니다. 이를 통해 제주시 내 산림 자원의 사유화 비율과 공공 관리 인프라의 비중을 직관적으로 확인할 수 있습니다.
