description_portal: 이 데이터는 해양수산부에서 선박과 어선에 설치된 AIS(자동식별시스템) 및 V-PASS(위치정보 전송장치)의 위치 정보를 기반으로 구축된 융합 선박 항적도 데이터를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 선박 ID, 선종, 길이 등 선박 정보와 선박의 공간정보로 구성되어 있습니다. 본 데이터는 항로 분석을 통한 해상 교통 관리, 선박 밀집 지역 파악을 통한 사고 예방 대책 마련, 특정 구간의 선박 교통량 분석 등 해양 안전 및 관리 업무에 활용될 수 있습니다. 또한 해상 물류 경로 최적화, 해양환경 보전 정책 수립 등과 같은 분야에서도 본 데이터를 기반으로 한 분석 및 연구에 활용할 수 있습니다.
