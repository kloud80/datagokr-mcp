description_portal: 이 데이터는 해양수산부에서 연안생태조사에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 연안상태조사위도목록, 연안생태조사경도목록, 연안생태조사도위도, 연안생태조사분위도, 연안생태조사초위도, 연안생태조사도경도, 연안생태조사분경도, 연안생태조사초경도, 연안생태조사위도, 연안생태조사경도, 연안생태조사년도, 공간정보 데이터로 구성되어 있습니다.본 데이터는 연안생태조사 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.연안생태조사란 우리나라 연안 생태계의 현황과 변화를 체계적으로 파악하고, 건강한 해양 생태계 보전과 지속가능한 이용을 위한 과학적 기초 자료를 확보하기 위해 갯벌과 연안의 생물 및 환경을 조사하는 활동을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
