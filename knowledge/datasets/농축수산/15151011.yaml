summary_user: 경기도 사이버식물병원 진단 데이터에서 쓰는 읍면동 단위 주소 코드표로, 동 코드(dong_cd)와 동 이름을 한 행씩 담는 참조 테이블이다. 식물 병해 진단 의뢰 기록을 읍면동 단위로 묶어 "우리 동네에서 병해 의뢰가 얼마나 몰리는가" 같은 지역별 병해 분포를 보려는 분석가가 쓴다. 같은 사이버식물병원의 주소_시군구·주소_시도·진단_의뢰_주소 테이블과 동 코드로 잇는다. 실측 컬럼에서 행정표준코드 같은 전역 조인 키는 확인되지 않아, 다른 기관 데이터와는 동 이름 매핑으로만 연결된다.
description_portal: 주소_읍면동 테이블은 우리나라의 가장 세분화된 행정구역인 읍면동 단위의 정보를 제공합니다. 각 행정 단위는 고유한 동 코드와 함께 동 이름을 포함하고 있으며, 병해 발생 위치의 정확한 공간 정보를 분석할 때 활용됩니다. 이 테이블은 주소_시군구, 주소_시도와 함께 주소 계층 구조를 완성하며, 진단_의뢰_주소 테이블에서 병해 발생지를 읍면동 단위로 확인하고자 할 때 사용됩니다. 지역별 병해 감염률, 방제 대응 정책 수립, 공간 클러스터 분석 등 정밀한 지역 분석이 필요한 경우 유용하게 활용됩니다.정형화된 주소체계를 통해 병해 발생 위치 데이터를 정확하게 연결하고, 데이터 일관성을 유지할 수 있습니다.
