summary_user: 농림축산검역본부가 보유한 식물검역 연구장비의 현황을 장비 한 대(건)씩 담은 전국 단위 목록으로, 장비가 등록된 검역지명, 장비명(해부현미경, 전자현미경, 저온저장고, 항온수조 등), 규격이 들어 있다. 연구기관·학계·산업계 연구자가 '병해충 분석이나 병원체 검출에 필요한 장비를 어느 검역지가 갖고 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 검역지명이나 장비명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 식물검역연구장비 보유 현황을 종합적으로 제공하는 자료- 보유 장비의 명칭,장비등록검역지명,장비명,규격 등 주요 정보를 포함- 해부현미경, 전자현미경, 저온저장고, 항온수조 등 연구 장비의 세부 내역을 확인할 수 있음- 연구장비의 등록 현황을 체계적으로 관리하여 효율적인 장비 운용과 연구 지원에 기여- 식물검역 기술 개발, 병해충 분석, 병원체 검출 등 과학적 연구 수행을 위한 기반 자료로 활용 가능- 장비 운영 및 관리 현황을 투명하게 공개하여 연구 장비의 활용도 제고- 연구기관, 학계, 산업계 등이 공동 활용할 수 있도록 기초자료를 제공
