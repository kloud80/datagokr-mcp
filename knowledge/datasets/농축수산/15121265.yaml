description_portal: 이 데이터는 해양수산부가 항만가이드라인 요청 이력을 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 지능형 해상교통정보시스템(바다내비) 내에서 도선사예선지원서비스(SV51)를 대상으로 한 항만가이드라인 요청 이력을 기반으로 테이블 형식으로 구성되어 있습니다. 데이터에는 메시지 ID, 요청 선박 식별번호, 요청 일시 등 정보를 포함하고 있습니다.  본 데이터는 항만을 출입하거나 이용해야 하는 선박 운항계획 수립, 도선 업무 지원, 항만 운영의 효율성 제고와 관련 정책 개발 등에 활용될 수 있습니다. 또한, 항만관리기관이 서비스 요청 현황을 체계적으로 분석하고, 도선사 예선지원서비스 업무 프로세스 개선 및 향후 서비스 운영 방향에 참고 자료로 사용할 수 있습니다.
