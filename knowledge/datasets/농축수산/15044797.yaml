description_portal: 경상북도에서 등록된 관광농원의 현황을 제공하는 자료입니다. 관광농원은 농촌의 자연환경과 농업 자원을 활용하여 체험, 숙박, 식음 등의 관광 서비스를 제공하는 시설입니다. 이 자료에는 지자체명, 시군명, 농원명, 소재지, 주요시설 등의 정보가 포함되어 있으며, 농촌관광 활성화, 정책 수립, 관련 산업 분석 등에 활용될 수 있습니다. 또한 일반 국민이 농촌 체험 장소를 선택하는 데 유용한 참고자료가 되며, 지자체 및 유관기관의 행정 업무에도 활용도가 높습니다. 경상북도는 본 데이터를 주기적으로 갱신하여 신뢰도 높은 정보를 제공하고 있으며, 공공데이터 포털을 통해 자유롭게 열람 및 이용이 가능합니다. 데이터 관련 부서 및 연락처는 농업대전환과 054-880-3328 입니다.
