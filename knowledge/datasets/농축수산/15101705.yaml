summary_user: 과수거점산지유통센터 건립지원사업의 연도·시도·시군구별 예산 집행 현황을 담는 집계 데이터로, 필드명으로 보아 교부액·예산액·집행액·이월액·불용액·실집행률 같은 금액 항목이 들어 있고 범위는 전국입니다. 정책 분석가나 지역 농업 관계자가 '어느 시군구에 과수 유통센터 지원 예산이 얼마나 내려가 실제로 얼마나 집행됐나'를 확인하는 데 쓴다. 시도·시군구 이름과 코드(SIGNGU_CODE) 컬럼이 있지만 실측상 전역 조인 키로 확인되지 않아, 다른 지역 통계나 농산물 유통 가격 데이터와는 이름·코드 매핑으로 이어 써야 한다.
description_portal: 해당 데이터는 과수거점산지유통센터 건립지원사업에 관한 자료로, 과수거점산지유통센터 건립지원사업은 집하, 선별, 포장, 예냉·저온저장, 냉장수송시설, 위생시설, 신선편의시설, 가공시설 등 일괄 지원하여 현대화된 유통시설의 중심축으로 육성하는 사업입니다. 이를 통해 현대화된 유통시설을 구축하고, 과실류의 품질 유지와 신선도 확보를 극대화하며, 물류 효율성을 높일 수 있습니다. 또한, 단지 내 생산과 유통이 체계적으로 연결되어 안정적인 출하와 판매가 가능하게 하고, 농가 소득 증대와 지역 농업 경쟁력 강화에도 기여합니다. 이러한 지원은 장기적으로 과실 산업의 지속 가능한 발전을 도모하며, 소비자에게는 안전하고 신선한 과실을 안정적으로 공급할 수 있는 기반을 마련합니다.
