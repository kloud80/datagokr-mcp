description_portal: '본 자료는 충청남도 부여군 관내에서 토석(골재·토사 등)을 채취하기 위해 관련 법령에 따라 허가를 받은 사업장 전체를 대상으로 수집·정제한 행정데이터입니다.데이터는 수허가자 기본정보, 허가지 위치정보, 채취용도, 허가면적, 허가기간, 데이터 기준일자 등으로 구성되어 있으며, 부여군의 토석채취 행정업무, 환경관리, 복구계획 수립, 허가 만료 모니터링, 정책 분석 등에 활용할 수 있는 기초자료입니다.데이터 구성 및 포함 범위데이터는 크게 1) 사업장 기본정보, 2) 허가 상세내역 두 부분으로 구성되어 있습니다.1. 사업장 기본정보수허가자 상호: 토석채취 허가를 신청하고 승인받은 업체명(법인 또는 개인)으로, 동일 사업자가 복수의 허가를 보유한 경우 항목이 중복될 수 있습니다.허가지 주소: 채취가 이루어지는 실제 장소의 법정주소(읍·면·리 단위 포함)로 구성되며, 다수 필지를 포함하는 경우 “산168-1 외 1필지”와 같이 표기됩니다.채취 용도 정보: 사업자가 본 허가를 통해 채취한 골재·토사를 어떤 목적(쇄골재용·토목용·조경용 등)으로 사용할지 나타낸 정보로, 두 개 이상의 용도 조합이 가능하며 “+” 기호로 연결됩니다.2. 허가 상세내역허가면적(㎡): 토석채취가 허용된 면적을 제곱미터 단위로 제공하며, 사업장의 규모를 파악할 수 있는 핵심 지표입니다.허가시작일·허가종료일: 허가 기간을 의미하며, 허가 종료일 이후에는 법령에 따라 채취행위가 제한되거나 별도의 연장 절차가 필요합니다.데이터 기준일자: 본 자료가 행정시스템 기준으로 업데이트된 날짜이며, 실제 허가 변경 상황은 이후 행정절차에 따라 변동될 수 있습니다.'
