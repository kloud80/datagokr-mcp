description_portal: 이 자료는 농촌진흥청이 운영하는 **농업경영종합정보시스템(AMIS)**의 농산물소득분석을 위해 활용되는 조사입력항목 코드 정보를 포함하고 있습니다. 해당 코드 체계는 농축산물 소득자료를 수집·입력하는 과정에서 사용하는 주요 항목들을 표준화한 것으로, 작목별·지역별로 기대 가능한 소득을 단순 평균이 아닌, 실제 농가의 경영실적을 기반으로 체계적으로 분석할 수 있도록 설계되었습니다. 조사 항목은 생산량, 판매단가, 총수입, 직접경비, 간접경비, 순소득 등 경영 성과 전반을 포괄하며, 개별 농가의 실적을 다른 농가와 비교하거나 경영계획을 수립하는 데 필요한 정량적 지표로 활용됩니다. 본 자료는 영농설계, 경영개선 지도, 품목별 수익성 분석 등 다양한 정책 및 현장 컨설팅의 근거자료로 활용되며, 효율적이고 지속 가능한 농장 경영을 위한 핵심 기초자료입니다.
