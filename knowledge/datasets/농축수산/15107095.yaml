summary_user: 경기도농수산진흥원의 친환경농산물 학교급식 지원 현황을 지원년도·시군별로 집계해 지원 대상 학교수, 학생수, 평균 급식일수를 담는다. 경기도 시군별 친환경 급식 지원 규모가 해마다 어떻게 달라졌는지, 시군 간 지원이 고르게 이뤄지는지 살피려는 정책 담당자·분석가가 쓴다. 전역 조인 키는 없어서 시군명(sigun_nm)과 지원년도를 이름 그대로 맞춰 학생수·학교 통계 같은 다른 시군 단위 자료와 잇는다.
description_portal: 이 데이터는 경기도농수산진흥원에서 친환경농산물 지원대상 학교수, 지원 대상 학교의 평균 급식일수와 학생수 값을 제공합니다. 주요 항목으로는 지원년도, 시군명, 평균급식일수, 학교수, 학생수가 포함되어 있으며, 각 시군의 학교급식 운영일수와 수혜 대상 규모를 분석할 수 있습니다. 해당 데이터는 지역별 친환경 급식 정책의 확산 정도와 운영 실태를 평가하거나 친환경 급식 공급 계획 수립 등 활용에 사용할 수 있습니다. 평균급식일수는 연간 급식 운영의 지속성을 나타내며, 학교수와 학생수 항목은 급식 대상의 물리적 규모를 의미합니다. 특히 지역 간 균형 있는 급식 지원 여부나 친환경 식재료 사용 확대 정책 수립에 참고자료로 활용할 수 있습니다.
