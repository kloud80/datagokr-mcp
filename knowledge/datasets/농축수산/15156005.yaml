summary_user: 국가해양관측망의 월간 품질처리(QC) 관측자료를 관측소·관측일자 단위로 담는 API이며, 수온·염분·파고·파주기·기온·기압·풍속·유속의 일별 최솟값·평균값·최댓값과 1시간 자료를 제공한다. 연안·항만 안전관리 담당자나 낚시·레저 이용자, 양식업자가 특정 관측소의 파고·수온이 어땠는지 확인하는 질문에 쓴다. 관측소 위도(lat)를 좌표 키로 삼아 다른 위치 기반 데이터와 잇고, 바다누리(KHOA) 자체 관측소코드로 같은 기관의 관측·예보 자료와 맞춘다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 국가해양관측망 월간 품질처리(QC)를 수행한 관측자료(일별 최소, 최대, 평균값과 1시간 자료)를 제공하기 위해 수집한 데이터 입니다. 관측소 코드, 관측일자 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소 유형, 관측소명, 관측일시, 관측소의 위도/경도 위치정보 및 수온, 수온 최솟값, 수온 평균값, 수온 최댓값, 염분, 염분 최솟값, 염분 평균값, 염분 최댓값, 유의파고, 유의파고 최솟값, 유의파고 평균값, 유의파고 최댓값, 유의파주기, 유의파주기 최솟값, 유의파주기 평균값, 유의파주기 최댓값, 최대파고, 최대파고 최솟값, 최대파고 평균값, 최대파고 최댓값, 최대 파주기, 최대 파주기 최솟값, 최대 파주기 평균값, 최대 파주기 최댓값, 기온, 기온 최솟값, 기온 평균값, 기온 최댓값, 기압, 기압 최솟값, 기압 평균값, 기압 최댓값, 풍향, 풍속, 풍속 최솟값, 풍속 평균값, 풍속 최댓값, 최대순간풍속, 최대순간풍속 최솟값, 최대순간풍속 평균값, 최대순간풍속 최댓값, 유향, 유속, 유속 최솟값, 유속 평균값, 유속 최댓값 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
