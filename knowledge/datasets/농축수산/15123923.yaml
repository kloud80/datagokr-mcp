description_portal: 이 자료는 농촌진흥청이 운영하는 농업경영종합정보시스템(AMIS) 내 농산물소득조사 통합게시판에 게시된 정보를 수록한 것입니다. 게시판은 농산물소득조사와 관련된 질의응답, 해설 자료, 공지사항, 조사표 활용 사례 등을 공유하는 공간으로, 조사 담당자 및 농업인, 유관기관 실무자 간의 정보 소통과 업무 지원을 목적으로 운영됩니다. 게시물은 소득조사에 대한 이해를 돕기 위한 설명, 조사 기준 변경 안내, 품목별 소득 산정 방식, 통계 활용 사례, 조사표 작성 지침 등 다양한 내용을 포함하고 있습니다. 이를 통해 농산물소득조사의 정확성과 활용도를 높이며, 농가소득 분석과 정책 수립에 필요한 현장 의견을 반영하는 데 기여하고 있습니다.
