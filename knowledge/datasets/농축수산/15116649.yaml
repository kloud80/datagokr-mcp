summary_user: 한국농어촌공사 농지연금 가입자를 월 연금수령액 규모에 따라 50만원 미만부터 250만원 이상까지 6개 구간으로 나눠, 2011년부터 각 구간에 가입한 고객 수를 집계한 전국 단위 통계 파일(csv, 561바이트)이다. 농지연금 가입을 고민하는 농업인이나 정책 분석가가 '가입자 대부분이 매달 얼마 정도를 받는가'처럼 연금액 분포를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 항목 이름을 맞추거나 같은 기관의 농지연금 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '- 한국농어촌공사 농지연금사업은 농업인이 소유한 농지를 담보로 노후생활안정자금을 매월 연금방식으로 지급하여 농업인의 노후생활안정을 지원하는 사업입니다.- 한국농어촌공사 농지연금사업은 농업인이 소유한 담보농지의 규모와 가입방식에 따라 최대 300만원까지 월 지급금이 계산됩니다.- 본 개방데이터는 한국농어촌공사 농지연금사업 가입자의 월 연금수령액을 규모별로 구분하여 2011년부터 현재까지 구간에 가입한 고객수를 통계낸 자료로 50만원 미만부터 250만원 이상까지 6개구간으로 구분된 가입자수를 제공합니다.'
