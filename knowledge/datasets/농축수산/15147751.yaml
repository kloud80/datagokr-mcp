description_portal: 이 데이터는 해양수산부에서 내항여객선월별운항통제데이터에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 연도, 월, 관할지부명, 항로명, 통제일수태풍, 통제일수풍량정보, 통제일수풍량주의보, 통제일수기상악화, 통제일수안개, 통제일수기타, 비운항일수선박검사, 비운항일수선박정비, 비운항일수기타 데이터로 구성되어 있습니다.본 데이터는 내항여객선월별운항통제데이터 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.운항통제란 선박의 운항잉 안전하고 효율적으로 이루어지도록 운항 전반을 관리하고 통제하는 활동을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
