description_portal: 해당 데이터는 경상북도 영천시 농업기상정보시스템 내 표출되는 서리 발생 현황입니다.서리는 대기 중의 수증기가 승화 작용에 의해 지면이나 지상의 물체에 얼음 결정체로 붙어 있는 현상을 지칭합니다.2017년 3월부터 2026년 2월달 까지의 서리 발생현황을 표출하고 있습니다.칼럼은 연번, 관측소, 서리구분, 발생일, 데이터기준일자 5개의 칼럼으로 구성되어 있으며 서리구분 컬럼은 관리자등록, 농가보고 2단계로 표출되어 집니다.해당 데이터와 관련하여 추가적으로 궁금하신 사항이 있으신 경우 영천시 농업기술센터 기술지원과로 연락주시면 감사드리겠습니다.
