summary_user: 실내에서 식물을 기르고 가꾸는 방법(식물 종류, 재배 환경, 물주기·햇빛·통풍 관리, 병해충 예방 등)을 메뉴명·제목·내용·등록일 단위의 글로 담은 콘텐츠 파일로, 전국 대상의 비공간 자료입니다. 집·사무실·학교에 식물을 두려는 국민이나 교육·콘텐츠 제작자가 '이 공간에 어떤 식물을 어떻게 관리하면 좋은가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·식물 이름 같은 텍스트 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: 실내 공간에서 식물을 재배하고 가꾸는 방법에 대한 종합 정보를 포함하고 있으며, 주요 식물의 종류, 적합한 재배 환경, 관리 요령, 병해충 예방 등의 내용을 담고 있다. 특히 주거 공간, 사무실, 학교 등 다양한 장소에서 적용할 수 있도록 맞춤형 사례와 이미지 자료를 함께 제공하여 실용성을 높이고 있다. 식물의 생장 조건, 물주기 주기, 햇빛과 통풍 관리 등의 기초부터 시작하여 초보자도 쉽게 따라 할 수 있도록 구성되어 있다. 정서적 안정, 공기정화, 인테리어 효과 등 실내정원의 다양한 이점을 소개하며, 도시 생활 속 녹색환경 조성에 기여하는 콘텐츠이다.
