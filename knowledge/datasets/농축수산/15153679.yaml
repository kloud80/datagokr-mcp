description_portal: 한국해양교통안전공단이 제공하는 본 데이터는 해양안전 교육의 운영 체계와 교육 현장에서 활용되는 교구의 보유 및 관리 현황을 종합적으로 정리한 것이다. 교육 과정별 실시 규모, 대상 인원, 교구의 종류, 교구 상태 정보, 휴관일, 휴일 등을 포함하여 해양안전 역량 강화 활동의 실효성을 파악하고 시설 예약이 불가능한 휴관일 및 휴일 정보를 제공하여 이용에 불편이 없도록 정보를 제공한다. 또한 기관의 교육 품질 향상과 교구 관리의 효율성 분석을 지원하며, 해양안전 정책 수립과 현장 안전관리 개선을 위한 기반 자료로 활용될 수 있도록 구성된 것이다.
