description_portal: 이 데이터는 **농업기반시설(저수지, 양배수장, 취입보, 관정, 집수암거 등)**에 대해 실시한 정기 안전진단 및 점검 결과를 제공합니다.농업기반시설은 농업용수 공급과 배수, 농경지 보호를 위해 중요한 역할을 하는 시설로, 구조적 안정성과 기능 유지가 필수적입니다. 해당 데이터는 시설구분, 시설코드, 시설명, 점검일자, 종합평가, 주소, 좌표해당데이터는 아래와같은 용도로 활용 할 수 있습니다.- 농업기반시설 유지보수 및 재해 예방 정책 수립- 취약 시설 조기 파악 및 위험 관리- 농업용수 안정적 공급을 위한 시설 관리 체계 구축- 연구기관의 안전성 분석 및 정책 평가 자료
