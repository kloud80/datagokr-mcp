summary_user: 1997년 고시된 과거 산지구분도(1:25,000 종이 도면)의 도엽 목록을 전국 범위로 담으며, 도엽 한 장마다 도엽명·도엽번호·행정구역·축척과 좌상단·우하단 좌표가 한 행으로 들어 있다. 1997년 당시 특정 지역의 산지구분도 도엽이 무엇이고 어느 좌표 범위를 덮는지 찾아, 산지 구분 변화를 추적하려는 연구자나 토지이용 실무자가 쓴다. 전역 조인 키는 없어서 행정구역 이름이나 도엽번호로 다른 도엽 색인과 맞추거나, 좌표 범위로 공간 자료와 겹쳐 보는 방식으로만 연결한다.
limits: 도면 자체나 필지별 보전·준보전 구분 값은 없고 도엽 색인 정보만 있어, 필지 단위 규제 판단에는 쓰지 못한다. 법정동코드·PNU 같은 공통 키가 없어 다른 데이터와는 이름 매칭이나 좌표로만 연결된다.
