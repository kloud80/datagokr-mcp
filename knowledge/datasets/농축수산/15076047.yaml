description_portal: 전라남도 순천시 농산물산지유통센터(APC)는 순천 지역 농산물의 수확부터 소비자에게 전달되기까지 모든 과정을 체계적으로 관리하는 핵심 유통 시설입니다. 2010년 건립된 이 센터는 농산물의 수집, 선별, 포장, 저장, 판매를 한 곳에서 처리하며, 순천 농산물의 부가가치를 높이고 유통 효율성을 극대화하는 데 중요한 역할을 합니다.특히, 순천 APC는 단감, 매실, 배, 참다래 등 순천의 주요 과실을 중심으로 운영됩니다. 최첨단 자동화 선별 설비를 갖춰 하루 최대 50톤, 연간 11,000톤 이상의 물량을 처리할 수 있으며, 과실 손상을 최소화하고 균일한 품질의 농산물을 유통할 수 있도록 돕습니다. 이를 통해 순천 농산물의 시장 경쟁력을 강화하고, '하누리네'와 같은 공동 브랜드를 육성하여 인지도를 높이는 데 기여하고 있습니다.또한, 순천 APC는 국내 시장뿐 아니라 해외 수출 활성화에도 적극적으로 나서고 있습니다. 미국, 대만, 싱가포르 등지로 순천의 품질 좋은 과일을 수출하며 지역 농산물의 판로를 확대하고, 농가 소득 증대에 직접적으로 기여합니다. 더불어, 상품성이 떨어지는 농산물을 활용한 가공품 생산과 친환경 농산물의 학교 급식 공급 등 다양한 방식으로 지역 농업의 부가가치를 창출하며 순천 농업의 지속 가능한 발전을 이끌고 있습니다.
