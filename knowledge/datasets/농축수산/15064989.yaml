summary_user: 인천광역시 군·구별 산림의 임목축적량(m³)을 침엽수·활엽수·혼효림 임상별로 나눠 집계한 통계 파일로, 포털 설명상 2020년 기준이며 csv 한 개(290바이트)의 작은 표입니다. 인천 지역 산림 담당자나 분석가가 '인천의 어느 군·구에 어떤 임상의 나무가 얼마나 쌓여 있나'를 확인해 산림 경영·탄소 흡수원 관리의 기초 자료로 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 행정구역 이름(행정구역)을 맞춰 붙여야 하며, 국가통계포털 산림기본통계의 행정구역별 임상별 면적 및 축적 통계와 비교해 쓴다.
description_portal: '인천광역시가 제공하는 임상별 임목축적 현황 공공데이터는 지역 내 산림의 임목 축적량을 침엽수, 활엽수, 혼효림 등 임상별로 구분하여  집계한 통계 자료입니다. 이 데이터는 지역 산림 자원의 규모 및 가치를 파악하고, 산림 경영 계획, 탄소 흡수원 관리, 임목 생산 정책 수립의 기초 자료로 활용됩니다.연도별 임목축적량 (m³): 군구별 2020년의 임목 축적 총량을 세제곱미터 단위로 제공합니다.해당 데이터는 국가통계포털 > 산림기본통계 > 행정구역별 임상별 면적 및 축적과 공공데이터포털에서 확인할 수 있습니다.'
