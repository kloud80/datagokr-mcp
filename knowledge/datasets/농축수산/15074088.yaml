summary_user: 전국 낚시 어선업 신고 어선을 한 척씩 담은 건별 원장으로, 어선 일련번호·어선명·총톤수·선적항·최대 승선인원과 어업 인허가 명칭·영업 유효기간을 담는다. 낚시객이나 지자체·안전관리 담당자가 특정 낚시어선이 신고된 배인지, 선적항이 어디이고 몇 명까지 태울 수 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 선적항명·어선명 같은 이름 매핑이나 어선번호로 해양수산부의 다른 어선·허가 데이터와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 낚시 어선과 관련된 정보를 제공하기 위해 수집한 데이터입니다.  전체 정보 조회 또는 어선일련번호 등 특정 파라미터 입력으로 데이터를 제공받을 수 있으며, 본 데이터의 주요 내용은 어선 일련번호, 어선 명칭, 총톤수, 선적항, 최대 승선인원수 및 어업 인허가 번호와 유효기간 등 어선 관련 상세정보로 구성되어 있습니다.   본 데이터는 낚시 어선업의 사업체 분포, 영업구역별 신고 현황, 선박의 특성 분석 등 해양수산 관련 정책 연구, 어선업 관리 체계 점검, 안전관리 방안 마련, 낚시 산업 실태 조사 등에 활용될 수 있습니다.
