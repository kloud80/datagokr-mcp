summary_user: 국립해양조사원 타이드베드 예측조위의 기반이 되는 전국 기준항(관측소)별 조화상수를 관측소 한 곳당 한 행으로 담은 CSV 파일로, 위경도와 4대 분조(M2·S2·K1·O1)의 진폭·지각, 대조평균고조면·평균해수면·평균고조간격을 포함한다. 해양 앱 개발자나 연구자가 '이 기준항의 반일주조와 일주조 중 어느 쪽이 우세하고 조차가 얼마나 되는가'를 따지거나 자체 조위 예측·물때 계산의 입력값으로 쓴다. 전역 조인 키는 없으며, 관측소 코드·관측소 명을 기준으로 같은 기관(KHOA 바다누리)의 조위 관측·예측 데이터와 맞춰 쓰고, 좌표로 주변 지점과 공간적으로 대응시킨다.
description_portal: '기준항 조화상수 정보(해양수산부 국립해양조사원 제공)이 데이터는 국립해양조사원에서 운영하는 타이드베드(TideBed) 예측조위 서비스의 기반이 되는 기준항 조화상수 정보를 제공합니다.조화상수란, 조위(바닷물 높이) 변화를 예측하기 위해 사용하는 수치 값으로, 태양과 달의 중력 등 다양한 천체 운동에 따른 해수면 변화를 수학적으로 분석해 계산됩니다.이 데이터는 조위 예측을 위한 기준이 되는 측정지점(기준항)에 대한 조화상수를 제공하며, 예측 정확도를 높이기 위한 핵심 정보로 활용됩니다. 조화상수는 지역별 해양 특성에 따라 다르게 나타나며, 이를 기반으로 국민이 이용하는 조석표, 물때 정보 등이 생성됩니다.데이터 구성관측소 명관측소 코드위치정보(경도)위치정보(위도)M2 진폭 : 주태음 반일주조의 진폭M2 지각 : 주태음 반일주조의 지각S2 진폭 : 주태양 반일주조의 진폭S2 지각 : 주태양 반일주조의 지각K1 진폭 : 일월합성 일주조의 진폭K1 지각 :일월합성 일주조의 지각O1 진폭 : 주태음 일주조의 진폭O1 지각 : 주태음 일주조의 진폭대조평균고조면평균해수면평균고조간격활용 예시낚시, 해수욕, 해상 레저 등 바닷물의 흐름이나 수위 변화 예측해양 관련 앱 및 서비스 개발해양과학 연구 및 교육 자료로 활용관련 서비스타이드베드(TideBed) 예측조위 서비스www.khoa.go.kr/oceandata'
