description_portal: 이 데이터는 해양수산부에서 한국 어선의 중국 EEZ(배타적 경제수역) 내 협정 어업 활동과 관련된 협정 업종 기본 정보 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 중국 EEZ(배타적경제수역)에서의 한국 어선 관련 협정업종에 대한 허가 연도, 어업종류코드, 업종명, 합의 척수, 총 할당량, 확정 여부, 확정 일자, 최초 생성 시점, 최종 변경 시점, 데이터 기준일자 등으로 구성되어 있습니다.  본 데이터는 정부 및 관련 기관이 한중 어업협정과 관련된 업종별 어선 허가 및 자원 할당 실태를 분석하는 데 활용될 수 있으며, 국내외 연구기관에서는 수산 정책 연구나 EEZ 협정 조건 변화에 따른 어업 자원 변동성 분석 등 연구자료로 사용할 수 있습니다. 또한, 업계에서는 어업 허가 정책 변화 및 자원 할당 동향을 모니터링하여 관련 사업 계획에 참고할 수 있습니다.
