summary_user: 전국 연안의 마을어업·정치망어업 어장을 공간정보 일련번호 단위로 한 건씩 담은 파일로, 시도·시군구, 어업종류·유형, 어업면허명, 어장면적, 개정년도를 포함한다. 해역별로 어떤 유형의 어장이 얼마나 넓게 분포하는지 보려는 정책 담당자나 연구자가 시군구별 어장 이용 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 시군구코드(sgg_cd)나 시군구명으로 행정구역 단위 통계와 맞추거나 어업종류코드로 같은 기관의 어업 허가·면허 자료와 이어 쓴다.
