description_portal: 이 데이터는 우리나라 연안의 어장정보를 체계적으로 관리하고 어업 자원에 대한 현황 파악을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 각 마을어업과 정치망어업에 대한 정보로, 양식대상 종명, 어업방법명, 어업유형명, 어업종류코드 등의 데이터로 구성되어 있습니다.  본 데이터는 어업 관련 정책 수립 시 근거자료로 사용할 수 있으며, 어업 자원 분포와 해역별 어업유형 분석 자료로도 활용될 수 있습니다. 연구기관에서는 어장 이용 현황 조사, 어업 종사자 지원방안 마련, 어장 관리 체계 연구 등에 본 데이터를 활용하여 보다 구체적이고 신뢰성 있는 분석 자료로 삼을 수 있습니다.
