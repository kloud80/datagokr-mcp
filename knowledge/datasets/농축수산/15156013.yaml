summary_user: 국립해양조사원 조위관측소별로 매월의 최극 고조·저조 높이와 발생 시각, 연 최극 고조·저조를 관측소 위치(위도·경도)와 함께 담은 월 단위 집계 데이터이며, 범위는 전국 관측소다. 연안·항만 안전관리자나 연구자가 "우리 항구 인근 관측소에서 이번 달·올해 가장 높았던 만조와 가장 낮았던 간조는 언제, 얼마였나"를 확인해 해양재해 대응이나 어업·해상교통 일정 조정에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 조석·조류 데이터와는 관측소코드·관측소명 매핑이나 위도·경도 좌표로만 연결한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소의 매월의 최극조위(고조, 저조) 정보를 제공하기 위해 수집한 데이터 입니다. 관측소 코드를 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 관측연월, 관측소의 위도/경도 위치정보 및 월 최극 고조, 월 최극 고조 시각, 고조위 구분, 월 최극 저조, 월 최극 저조 시각, 저조위구분, 연 최극 고조, 연 최극 고조 시각, 연 최극 저조, 연 최극 저조 시각 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
