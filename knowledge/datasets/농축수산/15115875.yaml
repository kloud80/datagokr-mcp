summary_user: 어업경영체별로 등록된 어류양식 생산 현황을 건별로 담은 전국 단위 파일로, 경영체등록번호·지청·일련번호 단위로 현재 사육량, 생산량, 생산금액, 계통·비계통 판매 비율이 들어 있다. 수산 정책 분석가나 연구기관이 지역(지청)별로 양식 경영체의 생산 규모와 수협 계통판매 의존도가 어떤지 파악하는 데 쓴다. 어업경영체등록번호(fishery_business_no)와 어업번호(fishery_no)를 키로 같은 어업경영체 확정 계열의 다른 표나 어업 허가·면허 데이터와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 어업경영체의 어류양식생산 현황을 파악, 제공하기 위해 수집된 데이터입니다.   본 데이터의 주요 내용은 어업경영체등록번호, 지청코드, 일련번호, 수산물품목코드, 현재사육량, 생산량, 생산금액, 수탁여부, 과거어업경영체등록번호, 최초생성시점, 최종변경시점, 가공상태코드, 어업구분, 어업번호, 계통판매비율, 비계통판매비율, 비계통판매코드, 데이터기준일자 등으로 구성되어 있습니다.   본 데이터는 어업경영체별 어류양식생산 실태를 정량적으로 분석하여 어업정책 수립이나 지원사업 추진, 수산자원 관리, 지역 단위 어업경영체 현황 파악 등에 활용될 수 있습니다. 또한 생산·유통 구조를 조사하거나 어업경영체 현황 통계자료로서 연구기관 및 공공기관에서 정책 연구, 시장 동향 분석, 생산현황 모니터링 등의 분야에 활용할 수 있습니다.
