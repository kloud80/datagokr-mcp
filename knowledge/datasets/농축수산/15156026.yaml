summary_user: 사용자가 입력한 좌표에 대해 가장 가까운 기준항의 조시차·조고비로 환산한 1분 간격 예측 조위를 담으며, 기준항과 선택지점의 예측조위와 주요 분조(M2·S2·K1·O1) 진폭·위상, 평균해면을 함께 제공하는 계산형 API이다. 낚시·레저객이나 어업인, 항만 안전 담당자가 '내가 있는 바다 지점의 특정 날짜 물때와 조위 변화는 어떤가'를 확인하거나 연구자가 조석 분석에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 기준항명이나 기준항 위경도(lat, lot)를 기준으로 관측소 정보와 이름·좌표로 맞춰 연결해야 한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 사용자가 입력한 좌표와 가장 가까운 기준항(관측지점)으로부터의 조시차, 조고비를 계산하여 산출된 예측 조위를 제공하기 위해 수집한 데이터 입니다. 선택지점의 위도/경도 위치정보, 요청일자, 시간 간격을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 기준항명, 기준항 예측일시, 기준항의 위도/경도 위치정보, 선택지점 예측일시 및 기준항 예측조위, 기준항 M2조위진폭, 기준항 M2조위위상, 기준항 S2조위진폭, 기준항 S2조위위상, 기준항 K1조위진폭, 기준항 K1조위위상, 기준항 O1조위진폭, 기준항 O1조위위상, 선택지점 예측조위, 선택지점 M2조위진폭, 선택지점 M2조위위상, 선택지점 S2조위진폭, 선택지점 S2조위위상, 선택지점 K1조위진폭, 선택지점 K1조위위상, 선택지점 O1조위진폭, 선택지점 O1조위위상, 조고비, 조시차, 평균해면(cm) 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
