description_portal: 농식품지식정보서비스에서 사용되는 테마 키워드 목록입니다. 농림수산식품교육문화정보원은 농업 정보 플랫폼 ‘농업ON’을 통해 사용자 관심 주제에 따라 콘텐츠를 체계적으로 분류하고 있으며, 본 데이터는 콘텐츠에 연계된 테마 키워드 정보를 정리한 자료입니다. 데이터는 키워드 번호, 순번, 키워드, 등록일자 항목으로 구성되어 있으며, 각 키워드는 콘텐츠 주제 분류와 연계되어 사용자 검색 편의성 향상, 주제 중심 콘텐츠 탐색, 관련 콘텐츠 자동 연결 등의 기능을 수행합니다. 이를 통해 사용자 맞춤형 정보 제공, 콘텐츠 추천 시스템 개발, 주제 기반 정보 아카이빙 체계 구축 등에 활용되며, 플랫폼의 정보 서비스 품질 향상과 이용자 경험 개선을 위한 기초 자료로 공공데이터포털을 통해 개방됩니다.
