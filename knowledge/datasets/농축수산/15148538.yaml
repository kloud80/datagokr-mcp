summary_user: 전국 유어장(낚시·어패류 채취가 허용되도록 지정된 수면) 219건을 장소별로 담은 CSV 원천 파일로, 유어장명·고시일자·어촌계명·주요 어종·공간정보 등을 포함한다. 낚시나 채취가 허용된 어장이 어디에 있고 어느 어촌계가 관련되는지 확인하려는 해양 행정 담당자나 분석가가 쓴다. 시설지번주소(address)로 다른 주소 기반 자료와 이어 쓰며, 해양공간객체번호와 공간정보 필드는 해양공간 자료와 대조하는 데 쓸 수 있으나 조인 키로 확인된 것은 주소뿐이다.
description_portal: 이 데이터는 해양수산부에서 항박도에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 해양공간객체번호, 유어장관리일자, 유어장명, 정의내용, 해양정책법령명, 상세조항명, 참조정보, 유어장개정일자 등의 데이터로 구성되어 있습니다.본 데이터는 항박도 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.유어장이란 어업 활동이 허용된 수면에서 낚시, 어패류 채취 등 낚시를 즐길 수 있도록 지정된 장소를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
