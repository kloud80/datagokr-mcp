description_portal: 본 데이터는 경기도 화성시에서 운영 중인 스마트팜 중 포도 재배 농가를 대상으로 설치된 강우량 측정 장비를 통해 수집된 일별 강우량 정보를 포함한다. 측정 항목에는 자료가 수집된 일자, 강우량 계측기가 설치된 장소명, 해당 일자의 강우량 수치가 포함되어 있으며, 스마트팜의 농업 환경 분석 및 기상 요인에 따른 작물 생육 영향 평가에 활용 가능하다. 데이터는 특정 기간 동안 측정된 값으로 구성되어 있으며, 향후 유사 작물 재배지의 환경 분석이나 작황 예측 등에 기초자료로 사용될 수 있다. 특히 스마트농업 기술 확산과 데이터 기반 영농정책 수립에 기여할 수 있는 기초 자료로 활용도가 높다. 단위는 밀리미터(mm)이며, 특정 지역의 기상환경을 반영한다. 공공데이터 이용자는 강우량 분포와 농업 생산성과의 상관관계 분석 등에 본 자료를 참고할 수 있다.
