summary_user: 전국 공영도매시장의 도매시장법인·공판장에서 이뤄진 농수산물 경매 거래를 건별로 담으며, 품목·거래량·가격·정산일자 등을 제공하고 API 전체 건수는 120,015건이다. 농산물 유통업자나 식자재 구매 담당자가 '오늘 가락시장에서 특정 품목이 어느 가격에 얼마나 낙찰됐나' 같은 시세 동향을 확인하는 데 쓴다. 전역 조인 키는 없으며, 법인 코드(corp_cd) 등 도매시장·품목·단위 코드는 aT 농축수산물 표준코드 API로 이름을 풀어 연결하고, KAMIS·HS·KOSIS 품목코드와는 체계가 달라 별도 매핑이 필요하다.
description_portal: '전국 도매시장법인과 공판장(전국 공영도매시장)에서 실시간으로 거래되는 경매정보는 농수산물의 품목, 거래량, 가격, 정산일자 등의 경매정보를 실시간으로 제공해 시장 동향을 파악하는 데 활용할 수 있습니다. 도매시장 통합 홈페이지를 통해 제공하는 데이터입니다.★ API 명세서가 첨부되어있습니다. API 활용에 참고하실 수 있습니다.* 도매시장 통합 홈페이지전국 32개 공영 도매시장의 다양한 정보를 한곳에 통합 제공하는 종합 플랫폼실시간 경매 현황부터 통계, 출하자 시스템, 지원 정책 등 광범위한 기능을 갖추고 있어, 농수산물 유통과 수급관리에 필수적인 디지털 인프라 역할 수행코드 정보는 한국농수산식품유통공사_농축수산물 표준코드 API를 조회 후 확인바랍니다. (https://www.data.go.kr/data/15141818/openapi.do)코드 종류 : whsl_mrkt_cd : 도매시장 코드corp_cd : 법인 코드unit_cd : 단위 코드sz_cd : 크기 코드plor_cd : 산지 코드pkg_cd : 포장 코드grd_cd : 등급 코드gds_lclsf_cd : 품목 코드 (대분류)gds_mclsf_cd : 품목 코드 (중분류)gds_sclsf_cd : 품목 코드 (소분류)* 일자관련 요청파라미터는 YYYY-MM-DD 형식으로 입력해야 정상적으로 처리됩니다.'
