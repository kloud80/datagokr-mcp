description_portal: '농림수산식품교육문화정보원_농식품FTA활용정보서비스_국가관련의 데이터입니다. 국가코드테이블 관련 데이터로, 각 국의 식품 및 농림업 분야에서의 자유무역협정(FTA) 활용 정보를 제공하며, 국가 간의 무역 장벽을 더욱 효율적으로 이해하고 대응할 수 있도록 지원합니다. 본 데이터는 농식품 분야에서 각각의 국가와의 무역 관계를 이해하는 데 중요한 역할을 하며, 농림수산식품 분야의 정책 수립 및 운영에 유용하게 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 국가코드(문자형) : 해당 국가의 고유 코드, 국가명(문자형) : 해당 국가의 공식 명칭, 국가명영문(문자형) : 해당 국가의 영문 명칭, 사용여부(문자형) : 데이터의 활용 여부를 나타냅니다. 이를 통해 사용자는 필요한 국 정보를 쉽게 조회하고, FTA 활용 관련 자료를 참고함으로써, 무역 전략 수립에 도움을 받을 수 있습니다.'
