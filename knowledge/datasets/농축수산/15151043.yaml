summary_user: 경기도 사이버식물병원에 들어온 식물병 진단의뢰 건마다 의뢰자가 고른 병해 증상 분류를 한 행씩 담는 건별 원천 데이터로, 진단의뢰번호·증상 분류번호·작목번호 세 칸으로 이루어진다. 진단의뢰에서 작목별로 어떤 증상이 자주 선택되는지 보려는 농업 분석가나 병해 상담 담당자가 쓴다. 전역 조인 키는 없으며, 증상 이름·계층과 작물 이름을 보려면 같은 기관의 증상 분류·작목 테이블과 번호(symptms_class_no, tre_no)로 이어야 하고 같은 진단의뢰번호로 다른 진단의뢰 테이블과 맞춘다.
description_portal: 진단_의뢰_증상 테이블은 진단의뢰 건에 대해 선택된 병해 증상 분류 정보를 기록하는 데이터입니다. 각 행은 진단의뢰번호(dx_req_num)와 함께 증상 분류번호(증상_분류_번호), 작목번호(작목_번호)로 구성되며, 특정 작물에서 관찰된 병해 증상을 분류체계에 따라 지정합니다.이 테이블은 증상_분류(sympt_class) 및 작목(crop) 테이블과 연계되어 병해 유형의 명칭 및 계층 구조, 작물 정보 등을 함께 조회할 수 있게 합니다. 이를 통해 사용자는 진단의뢰별 병해 유형의 경향성을 파악하거나 작목별 증상 발생 패턴을 분석하는 데 활용할 수 있습니다.
