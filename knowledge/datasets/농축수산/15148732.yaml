description_portal: 이 데이터는 해양수산부에서 해양사고발생현황에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 해양사고발생종류, 해양사고발생년, 해양사고발생월, 해양사고발생일, 해양사고발생시, 해양사고발생분, 해양사고위도구분, 해양사고위치도위도, 해양사고위치분위도, 해양사고위치초위도 등의  데이터로 구성되어 있습니다.본 데이터는 해양사고발생현황 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양사고발생현황이란 해상에서 발생하는 선박 관련 사고 건수와 그로 인한 인명 피해 등을 통계적으로 파악한 자료를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
