description_portal: 이 데이터는 전북특별자치도 군산시에서 운영하는 주민소득지원시스템을 기반으로, 친환경농업 실천 농가에 지급되는 친환경직불제 지원 현황을 수록한 공공데이터입니다. 친환경직불제는 고품질 안전농산물 생산과 지속가능한 농업 환경 조성을 위해 친환경 인증을 받은 농가에 일정 금액을 지급하는 제도로, 본 데이터에는 시군명, 읍면, 마을, 신청일, 신청면적, 필지수 등의 상세한 항목이 포함되어 있습니다. 총 190건의 신청 내역이 수록되어 있으며, 지역별 신청 규모와 실천 정도를 파악하거나 정책 효과 분석, 향후 예산 편성 등에 활용될 수 있습니다. 데이터는 CSV 형식으로 제공되며, 누구나 무료로 내려받을 수 있으며, 최신 등록일은 2026년 5월 20일입니다.
