summary_user: 부산공동어시장에서 위탁판매(위판)된 살오징어·고등어·삼치류·방어류·전갱이류·청어 등 주요 어종의 거래를 위판일자·상품명·어종상태별 위판중량과 위판금액으로 담은 CSV 파일입니다. 수산물 유통 분석가나 수산 가공·유통 사업자가 "부산공동어시장에서 고등어 위판 시세와 물량이 날짜별로 어떻게 움직였나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 위판장·도매시장 가격 자료와는 위판일자와 상품명(어종 이름)을 맞춰 이어 써야 하며, 어종코드 체계는 수협·수산과학원·HS가 서로 달라 이름 매핑이 필요하다.
description_portal: 이 데이터는 해양수산부가 수산물유통종합정보시스템을 통해 부산공동어시장에서 거래되는 위판 현황을 파악할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 살오징어, 고등어, 망치고등어, 삼치류, 방어류, 전갱이류, 청어 등 주요 어종별 위탁판매 내역으로, 각 어종별 가격과 중량 정보가 포함되어 있습니다.본 데이터는 부산공동어시장 내 수산물 유통 흐름 파악, 어종별 위판 시세 조사, 유통경로 분석 등에 활용될 수 있습니다. 정책 수립 시 어시장 거래 동향 자료로 활용하거나, 기업은 시장 분석 및 공급망 관리, 학계에서는 어획 및 유통 실태 연구 자료로 사용할 수 있습니다.
