summary_user: 산림청 소관 사단법인·재단법인·특수법인 등 비영리법인을 법인 한 곳당 한 행으로 담은 목록 파일로, 법인 구분·설립근거·설립목적·설립일자·대표자·소관부서 담당자와 전화번호를 담는다(전국 범위, 비공간). 산림 분야에서 활동하는 비영리단체가 어떤 곳들이고 어떤 목적과 근거로 설립됐는지, 담당 부서에 어디로 연락하는지 확인하려는 연구자·행정 담당자·협력 기관이 쓴다. 전역 조인 키가 없어 다른 데이터와는 법인명 문자열 매칭이나 산림청 소관 다른 자료와의 수작업 대조로만 잇는다.
description_portal: 비영리법인 현황 데이터는 산림청 소관 사단법인, 재단법인, 특수법인 등 다양한 비영리단체의 설립 근거와 목적, 설립일자, 대표자, 담당자 연락처 등 주요 정보를 포함하여 제공합니다. 2025년 2월 기준으로 최신 현황을 반영하고 있어 각 법인의 구분과 설립 목적을 명확히 파악하실 수 있으며, 산림 관련 비영리단체 현황 조사, 정책 수립, 협력체계 구축 등에 유용하게 활용하실 수 있습니다. 또한 데이터는 정기적으로 갱신되어 신뢰성 있는 정보를 제공하며, 행정기관과 연구기관에서 근거 자료로 활용하실 수 있어 정책 결정과 성과 평가 과정에서도 중요한 역할을 합니다.
