summary_user: 전국 승마장의 이름·대표자명·전화번호·주소·사업자번호를 승마장 한 곳당 한 행으로 담은 기본 정보 목록이며, 시·도 이름으로 걸러 조회한다. 승마 체험이나 말산업 사업을 준비하는 사람이 '우리 지역(시·도)에 어떤 승마장이 있고 연락처가 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(pobAdr)를 지오코딩하거나 시·도 이름, 사업자번호를 이름·코드 매핑해 연결해야 한다.
limits: 표준 행정구역 코드나 공통 식별 키가 없어 다른 데이터셋과 바로 조인할 수 없고, 시·도 이름과 주소 문자열을 맞춰 연결해야 한다. 세부 부문은 농산물 유통 가격으로 분류돼 있지만 이 데이터에는 가격 정보가 없다. 개발계정은 하루 3,000회까지 호출할 수 있다.
