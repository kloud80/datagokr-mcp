description_portal: 한국해양수산연수원이 제공하는 한미르호의 연간 항해실습 운항계획을 정리한 자료입니다. 수산계 종합승선실습과 기초승선실습에 대한 1차~9차의 항차별 일정을 포함하며, 각 실습 항차별 실습 일자도 명시되어 있습니다.파일 형식은 CSV이며, 실습선 운영의 체계적인 스케줄 관리, 해양계열 교육과정 연계, 해기인력 양성 계획 수립 등을 위해 활용할 수 있습니다. 해양수산연수원의 교육훈련 수요 대응, 정기 훈련 프로그램 조정 및 인력 배치에도 중요한 기초자료로 사용됩니다.* 항차, 구분, 실습일자, 지역의 데이터를 포함하고 있습니다.변경사항이 있을 수 있으니 자세한 사항은 1899-3600로 연락주시길 바랍니다
