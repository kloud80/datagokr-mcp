description_portal: 이 데이터는 해양수산부에서 원양어업(먼 바다에서의 어업활동)의 어업생산량 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 1990년부터 2018년까지 연도별 원양어업의 어업생산량 정보로 구성되어 있습니다.본 데이터는 관련 기관에서의 원양어업 관련 정책 수립을 위한 기초자료, 어업 생산량 변화 연구, 해양수산 산업 동향 분석 등 활동에 활용될 수 있습니다. 또한, 국가 간 어업 생산 현황 비교, 장기적 어업 자원 변동 분석, 어업 생산 가치 추이 파악 연구에 사용될 수 있습니다.
