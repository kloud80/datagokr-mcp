description_portal: 가축위생방역지원본부는 「가축전염병 예방법」에 따라 전국 축산농가를 대상으로 전화예찰을 실시하여 주요 가축전염병의 발생 가능성을 조기에 탐지하고 있습니다. 본 자료는 시군별 전화예찰 현황을 집계한 통계로, 구제역(FMD), 아프리카돼지열병(ASF), 고병원성조류인플루엔자(HPAI) 등 국내 가축산업에 큰 영향을 미칠 수 있는 재난형 전염병을 중심으로 관리하고 있습니다. 전화예찰은 농가와의 직접 통화를 통해 임상증상, 사육환경, 방역관리 상태를 확인하는 방식으로 진행되며, 이는 현장 출동 이전 단계에서 조기경보 기능을 수행하는 중요한 예방예찰 수단입니다. 또한, 시군별로 세분화된 현황자료를 제공함으로써 지방자치단체와 중앙정부가 지역별 특성을 반영한 재난대응 정책을 수립할 수 있도록 지원합니다. 특히, 반복적인 전화예찰을 통해 축산농가의 경각심을 제고하고, 의심 사례가 발생할 경우 신속한 현장 대응과 차단방역이 가능하도록 정보를 연계합니다. 본 자료는 가축전염병의 확산 방지를 위한 선제적 대응 기반으로 활용되며, 국가 재난대응체계와 연동되어 농가·지자체·중앙정부 간 협업을 강화하는 데 중요한 기초자료로 제공됩니다.자세한 사항은 가축위생방역지원본부 방역사업부에서 확인하실 수 있습니다.044-550-5560
