description_portal: 데이터는 경기도 화성시의 포도 스마트팜 농가를 대상으로 수확기 기간 중 측정된 습도 정보를 포함한다. 각 농가는 고유 식별번호를 가지며, 위치 정보를 나타내는 공간 좌표값(x, y)과 함께 수확기 동안의 습도 측정값이 제공된다. 해당 정보는 포도 작물의 생육 및 품질에 영향을 주는 환경요소 분석, 수확 적기 판단, 병해 발생 가능성 예측 등에 활용될 수 있다. 또한 농가별 미세기후 특성 분석, 자동화 환경 제어 기준 설정, 스마트팜 운영 전략 수립 등 정밀농업의 기초자료로 활용도가 높다. 본 데이터는 위치 기반 습도 정보를 포함하고 있어 공간분석이 가능하며, 농업기술 관련 연구기관, 정책 수립 기관, 민간 서비스 개발자 등 다양한 수요자가 활용할 수 있는 공공 데이터이다.
