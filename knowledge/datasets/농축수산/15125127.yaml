    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: type
        required: false
        example: xml
        desc: 데이터 타입
      - name: srchFrtrlNm
        required: false
        example: 가리산
        desc: 산명
      - name: srchCtpvNm
        required: false
        example: 강원특별자치도
        desc: 시도명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
