summary_user: 우리나라 100대 명산의 기본정보(산명·산코드·시도·주소·위도·경도·해발고도)를 산 단위로 담은 목록 API이다. 다만 검증 호출에서는 전체 건수 1, 수신 1행으로 확인되었다. 산악관광 담당자나 분석가가 명산의 위치와 고도를 지도에 올리거나 지역별 분포를 볼 때 쓰며, 주소(addrNm)와 좌표(lat) 키로 등산로·휴양림 등 다른 산림 휴양 데이터와 이어 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2023년 11월 24일에 등록하여 제공하는 오픈API 서비스로, 우리나라 100대 명산의 기본정보를 조회할 수 있는 서비스입니다.API를 통해 산식별자, 산명, 산코드, 시도명, 주소명, 위도, 경도, 해발고도, 데이터추출일시 등의 속성을 호출할 수 있으며, 이를 활용하여 명산별 위치정보 기반의 등산코스 안내, 산악관광 콘텐츠 개발, GIS 지도 시각화, 지역별 명산 분포 분석 등 다양한 분야에서 활용이 가능하며 JSON+XML 포맷을 지원합니다.
team:
