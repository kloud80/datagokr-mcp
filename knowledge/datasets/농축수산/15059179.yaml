summary_user: 경기도 해양수산과가 집계한 수산업 통계로, 어가 수·어선 수·어항 수·갯벌 면적·수협 수·염전 면적·어촌체험마을 수 같은 항목별로 경기도 수치와 전국 수치, 그 비율을 연도(SUM_YY)와 함께 담은 시도 단위 집계 자료입니다. 지역 수산정책 담당자나 분석가가 "경기도 어선·어가가 전국에서 차지하는 비중은 몇 %인가" 같은 질문에 답하거나 지역 수산업 규모를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 통계 항목명(수산업통계분류명)이나 연도를 이름으로 맞춰 붙여야 합니다.
description_portal: 이 데이터는 경기도 해양수산과에서 제공하는 수산업 통계로, 전국 수산업 현황과 경기도 수산업 현황을 비교하여 제시합니다. 수산업통계분류명(FSHRS_STATS_CLASS_NM)을 기준으로 어가 수, 어선 수, 어항 수, 갯벌 면적, 수협 수, 염전 면적, 어촌체험마을 수 등 다양한 항목에 대해 경기도와 전국 수치를 함께 제공하며, 항목별로 수량과 비율(%)이 포함되어 있어 경기도 수산업의 상대적 규모 및 특성을 쉽게 파악할 수 있습니다. 이 데이터는 수산정책 수립, 지역 수산업 경쟁력 분석, 어촌지역 개발사업 계획 수립 등의 근거자료로 활용될 수 있습니다.
