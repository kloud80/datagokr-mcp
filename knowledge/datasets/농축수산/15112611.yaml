description_portal: 이 데이터는 해양수산부에서 지식정보 생산모델을 활용하여 파고에 대한 3분 간격(3단계)의 격자별 예측값 정보를 제공하기 위해 수집된 데이터입니다.  격자번호, 예측시간 등 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 격자코드, 분석시간, 예측파고, 예측일자 정보로 구성되어 있습니다. 본 데이터는 관계 기관에서 해양 안전 관리, 해양 산업 계획 수립, 선박 운항 계획 수립 등 활동을 위한 기초 자료로 활용될 수 있습니다. 또한, 연구기관에서 해양 기상 등 관련 연구활동 수행을 위해 활용할 수 있습니다,
