summary_user: 해양수산부 지식정보 생산모델이 계산한 파고 예측값을 3분 격자 단위로, 격자코드·예측일자·예측시간별 예측파고(prdnWvhgh)로 담는 전국 범위 모델 예측 데이터다. 낚시·해양레저 이용자나 선박 운항 담당자가 특정 해역 격자에서 어느 날 몇 시에 파고가 얼마나 높을지 확인해 출항·활동 여부를 판단하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없고, 격자코드(gridCd)를 위경도나 해역으로 바꾸는 매핑을 따로 갖춰야 관측소 실측값 등 다른 해양 관측·예보 데이터와 이어 쓸 수 있다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해, 격자코드의 위치 정보 없이는 행정구역이나 바다누리 관측소코드와 바로 연결할 수 없다. 포털 활용신청 후 serviceKey로 호출하며, 개발계정은 하루 10,000회로 제한된다.
