summary_user: 해양수산부가 관리하는 특정도서의 공간정보를 WMS(지도 이미지)와 WFS(텍스트 피처) 두 방식으로 내려주는 API로, 도서 명칭·지정년도·조사년도·관리기관 등을 담고 검증 호출에서는 전국 범위의 10행이 수신됐다. 연구기관이나 행정기관이 특정도서가 어디에 있고 언제 지정됐으며 어느 기관이 관리하는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 도서 이름 매핑이나 같은 기관 코드로만 잇고, 해상풍력 등 입지 규제를 따지는 해양공간 용도구역·보호구역 데이터와 함께 보는 용도로 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와 자동 결합은 안 되고 이름·코드 매핑이 필요하다. 검증 수신은 10행이며 행정단위는 개별(주소·좌표)이므로 전체 건수나 갱신 주기는 확인되지 않는다. 포털 활용신청은 자동승인이며 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
