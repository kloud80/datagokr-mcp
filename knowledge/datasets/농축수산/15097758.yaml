description_portal: 이 데이터는 해양수산부가 특정도서에 관한 정보를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 WMS(웹 맵 서비스) 및 WFS(웹 피처 서비스) 형태로 구분되어 있습니다. WMS데이터는 반환 이미지 크기(픽셀), 검색 범위, 좌표체계 파라미터로 맵 이미지 파일을 조회할 수 있으며, WFS는 특정도서 명칭, 지정년도를 파라미터로 특정도서의 텍스트 형태 공간정보, 조사년도, 관리기관, 지정년도 등 정보를 조회할 수 있습니다.본 데이터는 연구기관이 특정도서의 보호 현황 및 지도 정보를 분석하거나, 행정기관이 도서 관리 및 정책 수립 시 기초자료로 활용할 수 있습니다. 또한, 도서 보호 관련 신고 이력 및 서비스 정보 파악에 활용될 수 있습니다.
