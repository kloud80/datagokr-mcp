description_portal: 산림 및 도시숲 내에 설치되어 미세먼지 농도를 실시간으로 측정 및 분석하여 10분단위로 산림 내 미세먼지 농도와 성분 정보 제공산림 및 도시숲에 설치된 관측 장비를 통해 미세먼지(PM10, PM2.5) 농도와 성분을 실시간으로 측정·분석하는 데이터입니다. 해당 정보는 10분 단위로 수집 및 제공되며, 숲이 미세먼지 저감에 미치는 영향을 정량적으로 파악할 수 있도록 지원합니다. 관측 데이터는 숲 내외부 미세먼지 비교 분석, 계절별·시간대별 농도 변화, 기상조건과의 상관관계 등을 연구하는 데 활용되며, 산림의 대기정화 기능 평가, 도시숲 설계 개선, 공공보건 정책 수립 등에 기초 자료로 제공됩니다.
