description_portal: 본 데이터는 경기도 광주시의 우제류 축산농가 현황 정보를 제공합니다. 소, 돼지, 양 등 발굽이 둘로 갈라진 우제류 가축을 사육하는 농가의 위치와 사육 규모 정보를 담고 있습니다. 농장명은 축산 농가의 명칭이며, 축종은 사육하는 가축의 종류를 나타냅니다. 사육두수는 농가에서 기르는 가축의 마릿수를 제공하고, 소재지 주소는 농장의 위치를 표시합니다. 위도와 경도는 정확한 지리 좌표를 제공합니다. 본 데이터는 가축 질병 관리, 축산 방역 정책, 축산 환경 관리, 가축 사육 통계, 농축산업 지원 정책 수립 등에 활용됩니다.
