summary_user: '임산물 품목별 가격을 조사일자(DATES)·품목·등급·조사지역 단위로 담은 가격 조회 API로, 범위는 전국이며 행 하나가 한 날짜·품목·등급·지역의 가격 한 건이다. 유통업체나 분석가가 특정 기간 동안 특정 임산물(예: 표고버섯) 가격이 지역·등급별로 어떻게 움직였는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 가격 데이터와 이으려면 품목코드·등급코드·지역코드를 이름이나 같은 기관 코드로 매핑해야 하며, 품목코드는 KAMIS·도매시장·HS·KOSIS마다 체계가 달라 대응표가 필요하다.'
description_portal: 본 서비스는 임산물의 가격정보를 종합적으로 조회할 수 있는 API로, 사용자는 가락 도매시장과 강서 도매시장의 가격정보를 통해 다양한 농수축산물의 품목과 지역, 그리고 유통센터에 따른 가격 변동을 실시간으로 확인할 수 있습니다. 이 데이터는 농업 관계자, 유통업체, 연구자 등에게 큰 도움이 되며, 시장 가격 동향을 분석하거나 가격 예측을 위한 기초 자료로 활용될 수 있습니다. 오퍼레이션 정보에 따르면, 사용자는 특정 기간과 품목에 대한 세부가격 정보를 요청할 수 있으며, 조사일자, 품목정보, 시장정보 및 가격정보 등 다채로운 데이터를 포함하고 있어 보다 신뢰할 수 있는 정보 제공이 가능합니다. 이를 통해 이용자는 임산물 가격의 흐름을 파악하고, 보다 합리적인 거래 결정을 내릴 수 있도록 지원받을 수 있습니다.
