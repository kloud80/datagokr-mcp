summary_user: 농작물재해보험의 보험금 지급 실적을 연도별로 집계한 전국 단위 통계 파일로, 해마다 지급건수, 보험금(백만원), 건당 보험금(천원), 손해율(%)을 담는다. 농업정책 분석가나 연구자가 "재해가 컸던 해에 보험금 지급과 손해율이 얼마나 늘었는가"처럼 연도별 지급 규모 추이를 확인하고 재해보험 제도의 효과를 평가할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞춰 붙여야 하며, 지역·품목 단위 데이터와는 직접 연결되지 않는다.
description_portal: 해당 데이터는 연도별 농작물재해보험 보험금 지급 통계자료로, 농업재해보험은 농가의 경영 안정과 안정적인 재생산 활동을 지원하기 위해 2001년부터 도입된 제도입니다. 주요 항목으로는 연도, 지급건수, 보험금, 건당 보험금, 손해율 등을 포함하고 있습니다. 본 자료는 연도별 보험금 지급 규모와 추이를 확인할 수 있어, 자연재해 발생 현황과 피해 규모를 간접적으로 파악할 수 있으며, 이를 바탕으로 농업재해보험 제도의 효과성 평가, 재해 대응 정책 수립, 농가 경영 안정성 강화 방안 마련 등에 활용될 수 있습니다.
