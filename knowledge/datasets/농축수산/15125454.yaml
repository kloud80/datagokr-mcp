description_portal: '"2022년 동물 보호복지 실태조사"를 바탕으로 작성한 동물등록 현황입니다. 2022년까지 시도, 시군구별 축종(개, 고양이)에 따른 동물 등록 누계(사망 제외) 자료입니다.개 등록 누계(A), 고양이 등록 누계(B), 총 등록 누계(C=A+B)- 등록 현황을 통해 지역별 등록률 차이를 분석할 수  있음, 등록제 홍보 성과에 대한 참조 자료로 확인 가능하다.- 정부 및 지자체는 본 데이터를 활용하여 반려동물 등록 참여율  제고, 유기 , 유실 동물 예방, 보호관리 체계 강화 등 관련 근거 자료로 활용 가능하다.- 반려동물 양육 추세, 지역별 분포 특성등을 분석하는 연구 자료로 활용 가능하다.'
