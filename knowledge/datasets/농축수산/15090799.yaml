summary_user: 스마트축산 양계 농장에서 수집한 일일 산란 기록을 농장(농장아이디)·계군 개체 번호·산란일자별로 담으며, 품종·입추일·일령·현재 사육 수수·도폐사 수수와 왕란·특란·대란·중란·소란 등 크기별 계란 수 및 총산란수를 건별로 기록한다. 양계 농가나 축산 분석가가 '일령이 늘수록 하루 산란수와 특란·왕란 비율이 어떻게 바뀌고 폐사는 얼마나 생기는가'를 따져 생산량을 예측하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 농장아이디·품종명 같은 이름 매핑이나 같은 기관 코드로만 이을 수 있고, 계란 가격과 비교하려면 KAMIS 등 유통가격 품목코드를 따로 맞춰야 한다.
description_portal: '본 데이터셋은 스마트축산의 양계 분야에서 수집된 일일 산란 정보를 제공하는 데이터입니다. 이 정보는 축산업 종사자들이 양계 관리에 필요한 정확한 데이터를 확인하고, 이를 토대로 생산성을 높일 수 있도록 도움을 줍니다. 특히, 농장별로 산란 상황을 실시간으로 확인할 수 있어, 효과적인 사육 관리를 통한 경영 효율성을 극대화하는 데 기여합니다. 데이터는 일령, 산란일자, 현재 수수, 도폐사 수수, 산란크기별 수 등의 정보를 체계적으로 정리하고 있습니다. 이러한 데이터를 통해 농가는 생산량을 예측하고 필요에 따라 조정을 할 수 있으며, 특히 산란 크기별 수치는 계란 생산의 질과 수량을 판단하는 데 중요한 기준이 됩니다. 더불어, 데이터는 다음과 같은 구조로 이루어져 있습니다. 농장아이디(문자형): 농장의 고유 식별 아이디, 개체 구별 번호(숫자형): 각 개체를 구별하기 위한 번호, 품종명(문자형): 닭의 품종명, 입추일(날짜형): 병아리가 태어난 날짜, 일령(숫자형): 병아리의 나이, 산란일자(날짜형): 산란이 이루어진 날짜, 현재수수(숫자형): 현재 사육하고 있는 수의 양, 도폐사 수수(숫자형): 폐사된 수의 양, 왕란, 특란, 대란, 중란, 소란, 경란, 오란, 파란 (각 숫자형): 각 크기별 계란 수, 기타 산란수(숫자형): 기타 산란 수, 총산란수(숫자형): 일일 총산란 수입니다. 이러한 데이터는 스마트축산 사업의 일환으로 생산성을 높이는 다양한 분석 및 연구에 활용될 수 있습니다.'
