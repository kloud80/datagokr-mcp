summary_user: 농식품 공공데이터 포털이 제공하는 API의 목록 정보를 API 한 건당 한 행으로 담으며, 아이디·명칭·영문명·사용 여부·버전이 들어 있다(범위는 전국·비공간 메타데이터). 개발자나 분석가가 "농식품 데이터를 받으려면 어떤 API가 현재 사용 중이고 버전은 무엇인가"를 확인할 때 쓴다. 전역 조인 키는 없으므로, API 아이디나 명칭을 같은 포털의 개별 API 명세와 이름으로 맞춰 연결한다.
description_portal: 농림축산식품부는 농식품 공공데이터 포털의 API 데이터 정보를 제공합니다. 이 데이터는 API 아이디, API 명칭, 영문명, 사용 여부, 버전 등을 포함하고 있습니다. 이를 통해 농식품 공공데이터 포털에서 제공하는 다양한 API의 상세 정보를 확인하고, 해당 API를 활용한 시스템 연동 및 데이터 활용 방안을 모색할 수 있습니다. 또한, API 정보를 통해 농식품 분야의 데이터 기반 서비스 개발 및 정책 수립에 기여하고자 합니다. 이러한 정보는 개발자, 데이터 분석가, 정책 입안자 등에게 유용한 참고자료로 활용될 수 있습니다.
