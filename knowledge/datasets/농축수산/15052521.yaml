description_portal: '- 한국농어촌공사 경영회생 지역별 현황을 제공하고 있습니다.- 경영회생 사업이란 농업 경영체의 경영 회생을 지원하기 위한 농지 매입 사업입니다.- 부채 등으로 경영위기에 처한 농가의 농지들을 매입하고, 농가는 매각대금으로 부채를 상환한 후 경영회생을 도모할 수 있습니다.- 매입농지등은 당해농가에 장기임대하고 그 기간 동안 환매권을 부여하여 경영의 지속성, 안전성을 보장합니다.- 본 데이터는 한국농어촌공사_경영회생 지역별 인원(명), 면적(ha), 금액의 년도별 지원현황에 대한 통계자료 개방하고 있습니다.'
