description_portal: 경상북도 경주시에서 제공하는 본 데이터는 지역 내 산불 발생에 관한 통계 및 이력 정보를 담고 있으며, 연도별 산불 건수, 발생 원인, 피해면적, 발생 지점 등 다양한 항목을 포함하고 있다. 데이터는 산림보호와 재해예방을 위한 정책 수립, 산불 예방 교육, 위험지역 분석, 계절별 대응 체계 마련 등에 활용될 수 있다. 특히 원인 분류 정보와 발생 시기 데이터를 기반으로 사전 예방 조치 수립과 대응 전략 수립이 가능하다. 발생 위치는 행정구역 단위로 정비되어 지역별 위험도 파악과 관리에 용이하며, 산불 발생 추이를 장기적으로 분석하는 데에도 적합하다. 본 자료는 산림경영과에서 관리하고 있으며, 경주시의 재난 대응력 제고와 지역사회 안전 확보를 위해 개방하는 공공데이터이다.
