summary_user: 국립수산물품질관리원이 수행한 수산물 방사능검사 현황을 전국 범위로 담는 데이터로, 필드명으로 보아 품종·시료 채취일·채취 장소·세슘과 요오드 검출량·적합 판정·검사기관이 검사 건별로 들어 있다. 소비자나 유통업자가 특정 품종의 수산물이 언제 어디서 채취돼 방사능 검사에서 적합 판정을 받았는지 확인하거나, 분석가가 품종·시기별 세슘·요오드 검출 추이를 볼 때 쓴다. 전역 조인 키는 없어 다른 수산물 유통·가격 데이터와는 품종 이름이나 채취 장소 이름을 직접 맞춰 이어야 하며, 어종코드는 수협·수산과학원·HS 체계가 서로 달라 매핑이 필요하다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국립수산물품질관리원에서 제공하는 방사능검사현황 관련 정보입니다.\""
