summary_user: 스마트축산 양돈 농장의 포유모돈을 개체별로 기록한 데이터로, 교배일·분만일·산차·총산자수·사산·포유자돈 폐사두수·이유두수 같은 번식 성적과 급이 설정량·섭취량을 담으며 범위는 전국이다. 양돈 농가나 축산 분석가가 '분만 후 사료 섭취량이 이유두수나 자돈 폐사와 어떤 관계가 있나' 같은 질문을 따져 모돈 관리 방식을 정할 때 쓴다. 농장 내부 식별자(농장아이디)와 개체 번호로 같은 기관의 다른 스마트축산 양돈 데이터와 맞춰 볼 수 있지만, 전역 조인 키나 행정구역 코드는 없다.
description_portal: '농림수산식품교육문화정보원에서 제공하는 스마트축산 양돈 분야의 포유모돈 정보는, 양돈 분야에서의 포유모돈 급이 정보 및 다양한 관련 정보를 포함하고 있습니다. 이 데이터는 교배일, 분만일, 산자수 및 폐사두수와 같은 중요 지표를 통해 포유모돈의 생육 상태와 생산성을 평가하는 데 필요한 유용한 정보를 제공합니다. 이러한 정보는 축산 생산성 향상 및 효율적인 관리 전략 수립에 활용될 수 있습니다. 또한, 급이 정보와 모돈 정보 간의 상관관계 분석이 가능하여, 전문가들이 데이터 기반의 의사결정을 내리는 데 큰 도움이 될 것입니다. 데이터를 통한 상세한 분석은 품질 높은 축산물 생산을 위한 기초 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 농장아이디(문자형) : 각 농장을 구별하는 고유 식별 번호를 포함하며, 개체 구별 번호(숫자형) : 포유모돈의 각 개체를 구별하는 번호입니다. 산차(숫자형) : 포유모돈의 출산 차수를 나타내며, 교배지수(숫자형) : 교배의 횟수를 나타냅니다. 교배일(날짜형) : 포유모돈이 교배된 날짜이며, 임신 사고기간(숫자형) 및 임신 사고 원인(문자형) : 임신 중 발생한 사고에 관한 정보를 포함합니다. 분만일(날짜형) : 포유모돈의 분만이 이루어진 날짜를 나타내며, 이는 총산자수(숫자형), 미라(숫자형), 사산(숫자형), 실산자수(숫자형), 생시도태두수(숫자형), 양자전입두수(숫자형), 양자전출두수(숫자형), 포유자돈폐사 두수(숫자형), 부분이유 두수(숫자형), 포유기간(숫자형), 이유일(날짜형), 이유두수(숫자형)으로 데이터가 구성되어 있습니다.'
