summary_user: 경관보전직접지불 사업지구별로 사업년도, 시도·시군구·읍면동, 대상지구명, 동계·하계 절기, 농지구분, 경관작물명, 참여 농가수, 대상면적(㎡)을 담은 전국 단위 비공간 파일 데이터이다. 정책 담당자나 연구자가 어느 지역에서 어떤 경관작물을 몇 농가가 얼마의 면적으로 재배해 직불 지원을 받았는지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도·시군구·읍면동 이름을 행정구역 코드에 매핑하거나 작물명을 이름으로 맞춰야 다른 데이터와 이을 수 있다.
description_portal: 해당 데이터는 지구별 경관작물 재배에 따른 경관보전직불과 관련된 자료로, 주요 항목으로는 사업년도, 지자체, 지구명, 작물명, 참여농가수, 지원면적 등을 포함하고 있습니다. 이를 통해 특정 지역에서 어떤 경관작물이 재배되고 있는지, 해당 사업에 몇 개 농가가 참여했는지, 그리고 지원이 이루어진 면적 규모가 어느 정도인지를 종합적으로 확인할 수 있습니다. 이러한 자료는 지역별 농업 경관 보전 활동의 실태를 체계적으로 파악할 수 있게 해주며, 정책 효과성을 분석하거나 향후 지원 정책의 방향을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다. 또한 지자체 단위의 세부 데이터를 통해 지역 간 경관작물 재배 특성과 참여 농가의 분포를 비교·분석할 수 있어, 농업과 환경 보전이 조화를 이루는 지속 가능한 농촌 발전 전략 마련에도 기여할 수 있습니다. 나아가 본 데이터는 연구자, 행정기관, 정책 담당자들에게 경관보전직불제 운영 성과를 평가하고, 제도 개선 및 확산 방안을 마련하는 실질적인 참고 자료로서 의미가 큽니다.
