summary_user: 유기질비료지원사업에 참여하는 계약업체와 그 제품(부산물비료 중 가축분퇴비·퇴비)을 사업년도·시도기관별로 한 행씩 담은 전국 단위 파일로, 제품단가·지방비지원단가·총생산량·신청 및 선정 물량(포)을 함께 담는다. 농업인이 우리 시도에서 지원받을 수 있는 퇴비 제품과 단가가 무엇인지 확인하거나, 분석가가 시도별 업체 선정 물량을 비교하는 데 쓴다. 업체일련번호(fertilizer_biz_sn)가 실측 조인 키라서 같은 사업의 다른 업체·공급 자료와 이어 쓰고, 시도기관코드로 지역 단위 집계에 붙인다.
description_portal: 농림축산식품부에서는 유기질 계약업체정보를 제공합니다.본 정보 제공 데이터는 사업년도, 시도기관, 업체일련번호, 업체명, 제품일련번호, 비종, 비종분류, 비종등급, 제품단가, 제품명, 총생산량, 신청물량포, 선정물량포, 물량포업데이트일, 공급일련번호, 지방비지원단가, 관할기관, 업체거리등의 정보를 포함하고 있습니다.본 제공자료는 유기질비료지원사업에 대한 정보를 보여주는 데이터 입니다.비종으로는 부산물비료가 있으며, 비종분류에는 가축분퇴비, 퇴비가 있습니다.사업년도별 시도기관별 업체일련번호로 업체를 식별하여 비종, 제품단가, 제품명, 총샌상량 등을 확인 할 수 있습니다.
