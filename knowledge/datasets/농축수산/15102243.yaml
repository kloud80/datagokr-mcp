summary_user: 국립농산물품질관리원이 관리하는 무항생제축산물 인증 정보를 인증 건 단위로 담으며, 인증번호·인증종류·인증농가·품목·사육두수·생산계획량·인증기간(시작·종료일)을 전국 범위로 제공한다. 소비자나 유통·식자재 구매 사업자가 특정 농가나 축산물이 현재 유효한 무항생제 인증을 받았는지, 인증기간이 언제까지인지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못해, 인증농가명·품목명을 이름으로 맞추거나 같은 기관의 다른 인증 데이터와 인증번호로 대조하는 방식으로만 연결한다.
description_portal: 무항생제축산물 인증제도란 소비자에게 보다 안전한 축산물을 공급하기 위해 국립농산물품질관리원에서 지정한 인증기관에서 엄격한 인증기준으로 심사하여, 정보가 그 안전성을 인증해주는 제도로 항생제가 첨가되지 않은 사료를 급여하여 항생제로부터 보다 안전한 축산물을 생산․공급하고자 2007년 도입하였으며, 본 정보는 국립농산물품질관리원에서 관리하는 무항생제축산물 인증품목 정보로서, 인증구분명, 인증번호, 인증농가, 인증품목명, 사육두수, 생산계획량, 인증기간(시작일), 인증기간(종료일) 항목으로 구성된 데이터입니다.
