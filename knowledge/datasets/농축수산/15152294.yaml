description_portal: '한국해양진흥공사는 해운 관련 금융 업무를 수행하고 있습니다.주요 금융 업무를 보면1. 선박금융:-선박도입 투자-선박도입 보증-보유선박 투자 및 보증-친환경 선박 지원2. 인프라 투자:-항만·물류시설 투자: -항만하역설비 투자: -설비 및 경영 지원:-컨테이너 박스 리스: -친환경 설비 개량 사업:-경영 지원: 등의 다양한 금융 업무를 수행합니다.금융 업무 수행 시 여러가지 금융업무가 발생하며, 여러가지 업무 중 해양진흥공사가 주로 사용하는 업무를 등록하여 관리하고 있습니다.해당 정보는 금융거래 시 시스템에서 사용 중이며, 관련 정보를 제공 드립니다.'
