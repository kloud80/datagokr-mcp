summary_user: 경상북도 영천시 농지를 드론 실측과 팜맵으로 조사한 결과를 팜맵 필지 단위로 담은 건별 원천 파일로, 필지마다 면적(제곱미터)·지번코드·동리·지번·재배작물이 들어 있다. 농업 분석가나 농정 담당자가 영천시의 특정 동리·지번 필지에 어떤 작물이 얼마의 면적으로 재배되는지 확인할 때 쓴다. 실측에서 전역 조인 키는 찾지 못했으므로, 다른 농지·필지 데이터와는 지번코드나 동리·지번 같은 이름·코드를 맞춰 붙이거나 같은 기관 자료끼리 이어 쓴다.
