summary_user: 과수고품질생산시설현대화지원사업의 연도별·시도·시군구별 사업 내역을 담은 데이터로, 사업계획명·품목·세부사업 구분과 사업량·단가, 국고보조·지방비·국고융자·자부담 같은 재원 구성을 행 단위로 기록한다. 지자체 담당자나 정책 분석가가 "우리 시군의 사과·배 시설 현대화 지원에 국비와 지방비가 얼마씩 들어갔나"를 확인할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시도·시군구 이름이나 코드(SIGNGU_CODE), 품목명을 매핑해 이어 써야 한다.
description_portal: 해당 데이터는 과수고품질생산시설현대화지원사업에 대해 정리한 정보를 제공하고 있습니다. 이를 통해 농가는 안정적인 생산 여건을 확보하고 노동력을 절감할 수 있으며, 소비자에게는 품질이 우수한 과실을 안정적으로 공급할 수 있습니다. 또한 정책적으로는 지역별 과수산업의 균형 발전과 농가 소득 증대, 과수 유통 경쟁력 강화에 기여하게 됩니다. 나아가 해당 사업은 기후변화에 대응할 수 있는 시설 개선과 스마트 농업 기술 도입의 기반을 마련하는 효과도 있어, 지속가능한 과수산업 발전과 농업 경쟁력 제고를 위한 핵심 지원 사업이라 할 수 있습니다.
