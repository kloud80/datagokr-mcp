summary_user: 전국 파프리카 스마트팜 시설의 수집일별 내외부 환경(온도·습도·일사량·CO2·토양·양액)과 냉난방·커튼·팬 등 장치 작동 상태를 시설 단위로 담은 데이터로, 포털 설명상 생장길이·엽수·착과수 같은 생육 지표와 융복합되어 있다. 연구자나 스마트팜 경영인이 '내부 온도·CO2·양액 EC를 어떻게 관리할 때 파프리카 생육이 좋아지는가' 같은 환경-생육 상관 분석이나 AI 학습 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 품목명 매핑으로만 연결하며, 시설ID는 이 데이터 안에서 시설을 구분하는 데 쓴다.
description_portal: 본 데이터는 농림수산식품교육문화정보원에서 제공하는 파프리카 작물에 대한 스마트팜(시설원예) ICT 정보와 생육 정보를 융복합한 데이터로, 구체적으로는 온도, 습도, 일사량, 풍량, 풍속, 토양 정보를 포함하고 있으며, 이러한 데이터는 작물 생육의 중요한 요소로 작용합니다. 또한 생육 정보로는 생장길이, 엽수, 엽장, 엽폭, 줄기직경, 화방높이, 개화마디(화방), 착과마디(화방), 착과수, 열매수 등의 다양한 지표가 포함되어 있습니다. 이 데이터는 작물의 ICT 정보와 생육 정보 간의 상관관계를 분석하는 데 활용될 수 있으며, 전반적으로 농업 분야의 인공지능(AI) 분석에 필수적인 융복합 데이터로 자리 잡을 수 있습니다. 따라서 연구자, 농업 경영인, 그리고 스마트 농업 관련 기업들이 이 데이터를 통해 데이터를 기반으로 한 의사결정을 할 수 있는 기초 자료로 활용될 것입니다.
