description_portal: 해당 데이터는 한국해양교통안전공단이 2025년 7월부터 2026년 6월까지 수행한 낚시어선 안전성 검사 실적을 정리한 자료이다. 낚시어선은 낚시 승객의 승선 및 해양레저 활동에 사용되는 어선으로, 주요 항목에는 총톤수, 길이, 너비, 깊이, 선질, 용도, 세부용도, 선적항, 처리구분 등이 포함된다. 선질은 FRP, 강, 알루미늄합금 등으로 구분되며, 처리구분 항목을 통해 검사 처리 현황을 확인할 수 있다. 본 데이터는 낚시어선의 기본 제원, 용도, 선적항 및 검사 처리 현황을 파악하기 위한 기초자료로 활용될 수 있으며, 해양사고 예방, 해양교통 안전관리, 정책 수립, 통계 분석, 민원 응대 등 행정업무에 참고할 수 있다. 본 데이터의 대상기간은 2025년 7월 1일부터 2026년 6월 17일까지이며, 데이터 기준일은 2026-06-17이다.
