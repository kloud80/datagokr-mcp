summary_user: 항만기본계획에 포함된 무역항·연안항별 계획명, 관련 법령, 계획년도·완료년도, 지역, 항만 종류와 수상·육상 항만구역 면적, 안벽·방파제 길이, 잔교·상옥 수, 야적장 면적, 접안·하역능력, 공간정보를 담은 전국 범위 파일(CSV 약 2.5MB)이다. 항만 정책 분석가나 투자 검토자가 "특정 지역 무역항의 계획상 안벽 길이와 하역능력이 얼마인가"처럼 항만별 인프라 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 항만·지역 데이터와는 지역명이나 항만 이름을 매핑해 붙여야 한다.
description_portal: 이 데이터는 항만기본계획(무역항 연안항)을 수립하고 시행 과정에서 참고하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 항만기본계획에 포함된 기본계획명, 관련 법령, 계획년도, 지역, 항만시설정보(항만 면적, 시설물 제원 등), 공간정보 등으로 구성되어 있습니다.  본 데이터는 항만 계획 수립 및 운영 전략 수립, 항만 배후지역 발전 계획의 기초자료, 항만 인프라 투자 타당성 분석, 지역별 항만 정책 수립, 항만 행정 및 관련 법령 검토 등 공공 및 민간의 항만 분야 연구나 정책 자료로 활용될 수 있습니다.
