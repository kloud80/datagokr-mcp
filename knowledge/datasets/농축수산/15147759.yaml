summary_user: 축산계열화사업자별 등록번호·상호·자본금·사업자유형·영업상태와 경영년도별 관계인(이름·관계·기간) 경영사실, 그리고 돼지·오리·육계·산란계·토종닭·염소·종계·삼계·육용오리 9개 축종 수치를 사업자 단위로 담은 전국 파일(CSV, 약 22KB)이다. 계열화사업자가 현재 영업 중인지, 어떤 축종을 다루는지, 경영진 구성이 어떻게 바뀌었는지를 확인하려는 축산 농가·거래 사업자·정책 분석가가 쓴다. 계열화사업자 등록번호(integrator_rgst_no)를 키로 같은 기관의 다른 축산계열화사업 관리 데이터와 잇고, 지역 코드나 품목코드는 없어 KAMIS 가격 데이터와 바로 붙지 않는다.
