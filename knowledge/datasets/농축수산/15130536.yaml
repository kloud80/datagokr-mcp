description_portal: '- 전라남도 산림자원연구소 산림학교의 교육 프로그램에 대한 정보(교육명, 교육대상, 교육장소, 교육방법 및 기간)를 조회하실 수 있습니다.- 전라남도산림자원연구소는 전라남도의 산림 자원 관리 및 연구를 담당하는 기관입니다. 이 연구소는 산림의 지속 가능한 관리와 활용을 위한 다양한 연구와 정책 개발을 수행하고 있습니다.- 주요 업무: 산림 자원의 지속 가능한 관리 방안 연구, 산림 생태계 보전 및 복원 기술 개발, 산림 자원 활용을 위한 정책 및 제도 연구, 산림 관련 교육 및 홍보 활동- 산림 생태 연구: 산림 생태계의 구조와 기능을 이해하고 보전 방안을 모색합니다.- 산림 자원 활용 연구: 목재, 약용 식물 등 산림 자원의 효율적인 활용 방안을 연구합니다.- 산림 정책 연구: 산림 자원의 관리와 활용을 위한 정책 및 제도 개선 방안을 제시합니다.- 산림 교육 및 홍보: 도민을 대상으로 한 산림 교육 프로그램과 홍보 활동을 통해 산림의 중요성을 알립니다.'
