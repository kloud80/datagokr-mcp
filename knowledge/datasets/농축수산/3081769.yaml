description_portal: 본 데이터는 관내 농업 및 축산업 분야의 현황 정보이다. 농가 수, 경작 면적, 주요 재배 작물, 생산량, 가축 사육 농가 수, 가축 사육 마리 수, 축종별 현황 등의 상세 정보를 포함한다. 논, 밭, 과수원, 시설 재배 등 농업 유형별 현황과 한우, 젖소, 돼지, 닭 등 축종별 사육 현황이 집계되어 있다. 본 정보는 농축산 정책 수립, 농가 지원 사업 계획, 농축산물 생산 계획, 가축 질병 관리, 농촌 경제 활성화 방안 수립 등에 활용되며, 지역 1차 산업 발전을 위한 기초 자료로 제공된다. 농축산 현황 분석을 통해 농가의 안정적인 생산 활동을 지원하고, 지역 농축산업의 경쟁력을 강화하며, 지속 가능한 농촌 발전과 농가 소득 증대를 위한 정책 수립에 기여한다.
