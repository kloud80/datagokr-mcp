description_portal: 경기도 수원시 수목원별(일월수목원, 영흥수목원) 보유 식물의 일련번호, 학명, 과명, 국명, 수량, 보유경위, 관리기간 등에 관한 정보를 제공합니다. 식물자원의 보존 히스토리가 명확해져 관리 품질이 원활하고 품명을 개방함으로서 식물원 간 교환 기증 협력이 가능합니다. 방문객 입장에서 정확한 생물학적 정보를 접할 수 있어 교육 효과가 커지고 투명한 정보 제공으로 수목원이 신뢰성 높은 공공자원으로 자리 잡을 수 있습니다. 또한 정원이나 식물에 관심 있는 시민에게 식물 찾기, 자료 조사가 훨씬 쉬워집니다.
