description_portal: '- 전라남도 친환경축산물 인증기관현황 (인증기관명, 전화번호, 지정번호 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도의 친환경 축산물은 자연 친화적이고 동물 복지를 고려한 축산 방식으로 생산된 안전하고 건강한 축산물을 의미합니다.- 전라남도 친환경 축산물 특징 : - 무항생제·무농약 사육 : 화학물질 사용을 최소화하고, 항생제나 합성 첨가제를 사용하지 않는 건강한 사육 환경을 유지합니다.- 동물 복지 실천 : 동물들이 스트레스 없이 자연에 가까운 환경에서 자랄 수 있도록 사육 조건을 개선합니다.- 엄격한 인증 절차 : 전라남도 농업기술원 등 인증기관이 정기적으로 점검해 위생, 사료, 사육 관리 등 여러 기준을 충족해야 인증을 받을 수 있습니다.- 안전한 먹거리 제공 : 소비자에게 신뢰받는 안전한 축산물을 공급합니다.'
