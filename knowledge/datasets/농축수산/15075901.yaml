description_portal: '이 데이터는 경상북도 봉화군에 위치한 농산물산지유통센터(APC)의 현황을 정리한 자료입니다. 각 유통센터의 명칭, 소재지, 취급 품목, 시설 유형 등으로 구성되어 있으며, 봉화군 내 농산물 유통시설 정보를 표 형식으로 제공합니다. 데이터는 총 7개 컬럼으로 구성되어 있으며, 기준일은 2026년 6월 30일입니다.· 번호: 데이터에 수록된 유통센터의 일련번호로, 각 행을 구분하기 위해 부여된 고유 번호입니다.· 시군: 유통센터가 속한 시·군의 명칭으로, 이 데이터는 모두 ‘봉화군’으로 표시됩니다.· 유통시설: 농산물 유통시설의 유형을 나타내며, ‘일반APC’ 등으로 표기됩니다.· 사업장명: 농산물산지유통센터의 공식 명칭입니다.· 주소: 유통센터의 도로명 주소로, 시설의 위치를 나타냅니다.· 품목: 해당 유통센터에서 주로 취급하는 농산물 품목입니다. 예: 사과.· 데이터기준일자: 데이터가 집계된 기준일로, 2026년 6월 30일로 명시되어 있습니다.'
