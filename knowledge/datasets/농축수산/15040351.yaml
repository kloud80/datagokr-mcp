description_portal: '○ 경상남도 거창군 농업작목반 현황에 대한 데이터로  경상남도 거창군 농업작목반 작목반 명칭,  경상남도 거창군 농업작목반 인원,  경상남도 거창군 농업작목반 소재지도로명주소,  경상남도 거창군 농업작목반 소재지지번주소,  경상남도 거창군 농업작목반 주요생산품 정보를 제공합니다○ 데이터기준일 : 2025. 11. 01.○ 농업 작목반은 같은 품목의 농산물을 재배하는 농가들이 모여 생산, 유통, 판매 등을 공동으로 진행하여 소득을 높이기 위한 조직입니다. 주로 농협 단위조합 내에서 조합원들이 품목별로 결성하며, 영농조합법인이나 농업회사법인 형태로 운영되기도 합니다.'
