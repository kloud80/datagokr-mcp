summary_user: 전북특별자치도의 농지전용허가 현황을 공공·민간 부문과 도로·공장·주택 등 용도별로 나눠 허가 건수와 전용 면적을 농업진흥구역·농업보호구역·진흥지역 밖, 논(답)·밭(전)별로 담은 집계표다(CSV 약 2KB, 시도 단위). 지역 정책 분석가가 "전북에서 어떤 목적의 개발이 농업진흥지역 안의 논을 얼마나 전용했나"처럼 개발 압력과 농지 보전 실태를 살피는 데 쓴다. 실측 컬럼에 필지번호(PNU)나 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 용도명·지역명을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 전북특별자치도 내에서 농지가 다른 용도로 전환되는 '농지전용' 허가 현황을 상세히 보여주는 통계 자료입니다. 공공 부문과 민간 부문으로 나누어, 도로·공장·주택 등 어떤 목적으로 농지가 전용되었는지를 구체적으로 제시하고 있습니다. 또한, 전환된 농지가 농업진흥지역 안팎에 위치하는지, 논(답)인지 밭(전)인지까지 세밀하게 구분하여 토지 이용의 변화를 깊이 있게 추적할 수 있도록 합니다. 이 자료는 지역의 개발 압력과 농지 보전 실태를 파악하고, 지속가능한 국토 이용 및 도시 계획 정책을 수립하는 데 있어 핵심적인 기초 데이터로 활용됩니다.
