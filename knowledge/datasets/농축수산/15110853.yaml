description_portal: '"제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍나리(서귀포) 데이터를 제공합니다.항목: 일반정보(피해요인), 일반정보(피해대상), 도로명/지번 주소, 행정동코드, 위도, 경도 등* 2007년 제주특별자치도 서귀포시에 영향을 준 태풍 나리(Typhoon Nari)로 인한 자연재해 피해 현황을 행정동 단위로 정밀히 기록한 자료입니다. 피해 유형을 대·중·소분류로 세분화하고 피해 구분, 요인, 대상(품종) 정보를 구조적으로 담고 있으며, 공간 분석에 활용 가능한 도로명·지번 주소, 행정동 코드, 위도·경도 등의 공간정보를 포함합니다.* 활용 분야 : 공간 기반 재해 시각화 및 분석, 재난 대응 계획 수립, 정책 기반 인프라 관리 등"'
