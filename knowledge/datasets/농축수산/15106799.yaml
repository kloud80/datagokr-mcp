description_portal: '"산업페열의 농업적 활용모델"은 폐열 두 종류(발전소 온배수, 소각장.제조업체의 폐열)와 활용 형태 세종류(온실난방, 농산물 건조, 주택난방)를 조합하여 총 여섯개의 모델로 개발되었다. 산업폐열을 농업에 이용하고자 할 때, 각 구성요소의 용량, 크기 등 설계기준을 제공함으로써 폐열 이용시설 설계의 기초자료로 이용할 수 있다.  "산업폐열 분포 지도"는 공공성이 강한 발전소 22개소, 쓰레기 소각장 41개소 그리고 이미 농업에 폐열을 활용하고 있거나, 활용하고자 하는 의지가 있는 일반 제조업체 3개소를 포함하여 총 66개소의 폐열 발생원을 기본 데이터로 구성되었다.'
