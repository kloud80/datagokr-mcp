description_portal: 이 데이터는 해양수산 및 어촌사회의 인구·정주환경·사회지표 현황을 읍면동 단위로 체계적으로 파악하고, 어촌지역의 구조 변화, 인구 구성 변화,등을 위해 2022년에 수집·구축된 정보입니다.해양수산 및 어촌사회의 인구사회(TB_OCEANMARN_POPLTN_SOCTY), 해양수산 및 어촌사회의 물리환경(TB_OCEANMARN_PHYSICL_ENVRN), 해양수산 및 어촌사회의 산업경제(TB_OCEANMARN_INDUST_ECNMY)를 포함합니다.이 데이터를 통해 어촌지역의 인구 구조 변화와 어가·청년·고령 인구 비중을 분석할 수 있으며, 지역소멸위험 수준 진단, 정주여건·인구유출 모니터링,  해양수산 분야 지역 맞춤형 사업계획 수립, 사회지표 기반의 지역지원 우선순위 설정 등에 활용될 수 있습니다.파일내 항목별 코드는 코드북을 참고해 주시기 바랍니다.
