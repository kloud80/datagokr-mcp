description_portal: 이 자료는 농촌진흥청이 운영하는 **농업경영종합정보시스템(AMIS)**에서 제공하는 농업회계 프로그램 **‘회계박사’**의 질의응답 게시판에 등록된 첨부파일 정보를 수록한 데이터입니다. 회계박사는 농업경영체의 회계 관리와 재무기록을 돕기 위한 전문 프로그램으로, 사용자들은 게시판을 통해 회계처리 방법, 기능 사용법, 오류 해결 등 다양한 질문을 등록하며, 이에 대해 관리자나 운영기관에서 제공한 답변과 함께 관련 설명 자료나 예시 파일이 첨부되기도 합니다. 본 자료에는 질의응답 게시물과 연계된 첨부파일의 제목, 파일명, 등록일, 연결 게시글 ID 등의 정보가 포함되어 있으며, 회계 실무 향상과 프로그램의 효율적인 활용을 지원하는 데 활용됩니다. 사용자 간의 정보 공유뿐 아니라 회계 지식의 축적과 확산을 위한 유용한 자료입니다.
