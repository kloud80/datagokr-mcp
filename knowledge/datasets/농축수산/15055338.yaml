summary_user: 전라남도 광양시에서 허가된 농지전용 건을 소재지(읍면·리동), 공부상 지목, 전용면적(㎡), 전용목적, 협의구분 단위로 담은 건별 현황 파일(CSV)이다. 광양시 안에서 어느 지역 농지가 어떤 목적으로 얼마나 전용되었는지 알고 싶은 주민·사업자나 농지 전용 추세를 보는 분석가가 쓴다. 필지고유번호(PNU)나 법정동코드 같은 공통 조인 키는 없어서, 다른 농지·토지 데이터와는 소재지 이름을 맞추는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 농업진흥지역·팜맵 필지 등 필지 단위 데이터와 바로 연결되지 않고, 소재지 이름 매핑이 필요하다. 범위는 광양시 한 곳뿐이라 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다.
