summary_user: 2015년 제·개정 농축수산물 표준크기코드와 같은 뜻의 2013년 구 크기코드를 한 행씩 짝지어 담은 코드 매핑표로, 신코드·신크기명(STD_MG_NEW_CODE)과 구코드·구크기명, 갱신일자를 담는다. 유통업체나 가격 분석가가 2013년 기준 코드로 기록된 과거 거래·가격 자료의 크기 구분을 2015년 표준코드로 바꿔 시계열을 맞출 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 기관의 표준코드 체계를 쓰는 데이터와 크기코드·크기명을 맞대어 연결하고, KAMIS·도매시장·KOSIS 등 다른 체계와는 별도 매핑이 필요하다.
description_portal: 본 데이터는 2015년에 제·개정된 농축수산물 표준코드와 동일한 의미를 가지는 2013년의 농축수산물 표준코드 정보를 제공하는 중요한 데이터입니다. 이 데이터는 품목, 시장, 단위, 포장, 크기, 등급, 산지 등 다양한 기준에 따라 분류된 농수축산물의 표준화된 정보를 담고 있습니다. 특히, 크기코드를 기준으로 신구 표준코드를 매핑하여 각 크기와 관련된 정보를 명확하게 제공하므로, 농업 관련 분야나 유통업체에서 이 정보를 활용하여 제품을 분류하고 관리하는 데 유용합니다. 오퍼레이션 정보에 따르면, API의 "신구표준크기목록조회"는 2015년의 표준크기코드와 같은 의미를 가진 2013년의 크기코드를 조회할 수 있도록 하며, 크기코드, 크기명, 업데이트일자 등과 같은 중요한 매핑 정보를 포함하고 있어, 사용자는 이를 통해 필요한 데이터를 쉽게 확보할 수 있습니다. 이러한 정보는 농수축산물의 표준화된 관리와 유통에 필수적으로 요구되는 요소입니다.
