description_portal: 이 데이터는 해양수산부에서 전국 항만별 로딩암(액체류 등을 선박에 적재/하역하는데 사용되는 장비) 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 인천, 부산, 울산, 마산, 대산, 군산, 광양, 평택·당진항 등 전국 주요 항만에 설치된 마린 로딩암의 규격, 제작년도 등 현황 정보로 구성되어 있습니다.  본 데이터는 항만 운영기관이 항만별 시설 운영 현황을 점검하거나 해양시설 장비의 관리 및 유지보수 계획을 수립하는 데 활용될 수 있습니다. 또한 항만 시설 투자, 항만별 인프라 비교 분석, 해양 물류 관련 연구 및 정책 검토 등에 활용될 수 있습니다.
