summary_user: 제주시 관내 농지전용허가를 구분·용도별로 묶어 허가 건수와 전용 면적(㎡)을 농업진흥구역·농업보호구역·진흥지역 밖, 논(답)·밭(전)별로 나눠 담은 집계표로, 필지별 원천 자료가 아니며 파일 크기는 약 1.2KB로 작다. 제주시에서 어떤 용도로 농지가 많이 전용되었는지, 진흥구역 안의 논밭이 얼마나 전용되었는지를 보려는 분석가·농정 담당자가 쓴다. 실측 컬럼에 전역 조인 키(필지번호·행정코드 등)가 없어 다른 데이터와는 용도 분류명이나 같은 기관(제주시) 기준으로만 맞대어 쓴다.
description_portal: 이 데이터는 제주특별자치도 제주시의 농업기반시설 업무와 관련하여 농지전용허가 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 친환경농정과이며, 제주시 관내에서 이루어진 농지전용 허가의 세부 내용과 규모를 파악할 수 있도록 구성되어 있습니다.데이터에는 구분, 용도별, 건수, 그리고 농업진흥구역 및 보호구역 내외의 답(논)과 전(밭)에 대한 면적(㎡), 데이터기준일자 등의 정보가 수록되어 있습니다. "구분"과 "용도별" 항목을 통해 농지가 어떤 목적으로 전용되었는지 분류별 현황을 파악할 수 있으며, "건수" 항목을 통해 허가된 실적의 규모를 확인할 수 있습니다. 특히 농업진흥구역(답/전), 농업보호구역(답/전), 농업진흥지역밖(답/전)으로 세분화된 면적 항목을 제공하여, 각 용도구역 및 지목별로 전용된 농지의 정확한 규모를 구체적으로 확인할 수 있습니다. 또한 "데이터기준일자"를 통해 해당 정보의 작성 기준 시점을 알 수 있습니다.
