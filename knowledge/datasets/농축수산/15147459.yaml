summary_user: 전국 어장 면허를 건별로 담은 2023년 파일 데이터로, 검증 시 684행을 받았고 면허명·어업방법·양식대상종·면적·면허 시작/종료일·위치 좌표를 포함한다. 지자체나 연구자가 특정 해역에 어떤 양식 어장 면허가 있고 면허 기간이 언제까지인지 확인하는 데 쓴다. 어장위도·어장경도와 최소·최대 X·Y 좌표를 좌표 키로 삼아 다른 공간 데이터와 겹쳐 보며, 어선 등록과는 어선 단위에서만 겹치지만 이 파일에는 어선번호나 사업자번호 필드가 없다.
description_portal: 이 데이터는 해양수산부에서 어장정보_2023에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 일련번호, 시군구명, 시도명, 관련부서명, 개정년도, 어업면허명, 어업방법명, 양식대상종명, 어장위치설명, 어장면적, 어장면허시작일자, 어장면허종료일자, 어장면허번호, 어장위도, 어장경도, 최소엑스좌표, 최소와이좌표, 최대엑스좌표, 최대와이좌표, 공간정보 데이터로 구성되어 있습니다.본 데이터는 어장정보_2023 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어장정보란 특정 수산 동식물, 어업의 종류, 면적, 위치 등 어업 활동과 관련된 다양한 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
