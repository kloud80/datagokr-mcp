description_portal: '○ 통계개요* 통계명 : 농수산물 도매시장별 유통량* 통계종류 : 서울소재 도매시장별 농수산물유통 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 도매시장에서의 농수산물 유통 현황을 파악하여 농수산물의 수급 및가격안정 등 관련정책 수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 농수산물유통공사, 노량진수산주식회사 등 → 서울특별시 민생경제과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울소재 도매시장(가락시장, 강서시장, 노량진수산시장 등) 및유사도매시장별 농ㆍ수ㆍ축산물 유통량 및 금액 현황○ 용어설명* 공영도매시장 : 농수축산물의 도매거래를 위해 중앙 및 지방정부의 공공투자에 의해지방자치잔체가 개설한 시장* 가락시장 : 국내 최초 최대의 공영도매시장. 농수산물 도매 유통의 중심, 과일, 채소,선어, 활어, 건어, 패류, 육류 취급* 강서시장 : 서울 강서구 외발산동에 위치, 농산물 도매 유통의 중심, 과일, 채소 취급* 양곡시장 : 서울시 양재동에 위치, 양곡부류 전 품목 취급* 노량진수산시장 : 내륙지 최대 수산물전문 도매시장'
