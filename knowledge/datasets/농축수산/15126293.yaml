description_portal: 농림식품기술기획평가원에서 보유하고 있는 농림식품 RnD 타연구개발사업활용 성과 정보 데이터입니다. 파일데이터(CSV) 형태로 개방하고 있으며, 기준년도, 과제관리번호, 과제구분, 내역사업명, 과제명, 성과발생일, 사업명, 총연구비 정보를 포함하고 있습니다.1년 주기로 데이터를 개방하고 있으며, 데이터 이용 시 주기성 과거 데이터 확인 부탁드립니다. 연구개발 성과 유형에 따라 사업화, 특허, 학술발표, 고용창출 등 세분화되며, 각 성과는 연구개발 결과가 산업 현장, 사회 정책, 학문 분야 등에 어떻게 활용되고 확산되었는지를 보여줍니다. 일반 국민 누구나 공공데이터포털(data.go.kr)을 통해 열람할 수 있도록 개방되어 있으며, 농림식품RnD 사업의 투명성과 접근성을 제고하는 데 기여하고 있습니다.
