description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「연안관리법」 제2, 20조에 따라 연안침식으로 인하여 심각한 피해가 발생 또는 그러한 우려가 있어 지정된 연안침식관리구역의 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 연안침식관리구역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 구역의 명칭, 정의, 관계법령, 제/개정일자 및 관계부서 정보 등을 포함하고 있습니다.  본 데이터는 해양환경 및 연안안전 연구, 연안침식 위험지역에 대한 지역계획 수립, 정부 및 관련 기관의 정책 시행, 지자체의 해안방재시설 관리, 민간기업의 사회환경영향평가 등 다양한 실제 업무 및 정책 수행에 활용될 수 있습니다.
