summary_user: 해양수산부 국립해양조사원이 연안침식으로 심각한 피해가 났거나 우려되어 지정한 연안침식관리구역을 담은 SHP 공간정보 파일로, 구역별 명칭·관계법령·제/개정일자·관계부서 정보를 함께 담는다(전국 범위, zip 약 27KB). 지자체 방재 담당자나 연안 개발 사업자가 "우리 해안 또는 사업 예정지가 연안침식관리구역에 들어가는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구역 명칭 매핑이나 공간 중첩(해양용도구역·공유수면 등 해양공간 레이어와 겹쳐 보기)으로 이어 쓴다.
