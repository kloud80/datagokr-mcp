summary_user: 도매시장별 주요 양채류·쌈채소의 월별 경매 요약으로, 월·도매시장·품목·품종·거래규격별 평균 경매가와 총 거래물량을 담은 집계 데이터이며 포털 설명상 기간은 2013년 1월부터 2016년 5월까지다. 외식업체나 식자재 구매 담당자가 "양상추·쌈채소는 어느 달, 어느 도매시장에서 싸고 물량이 많았나" 같은 구매 시점 판단과 과거 가격 동향 분석에 쓴다. 전역 조인 키가 없어 품종코드나 품목명·도매시장명을 KAMIS·도매시장 가격 데이터의 코드와 따로 매핑해야 이어 쓸 수 있다.
description_portal: "본 데이터셋은 농림수산식품교육문화정보원에서 제공하는 도매시장별 주요 양채류 및 쌈채소의 월별 거래현황을 기록한 데이터로, 2013년 1월부터 2016년 5월까지의 품종별 및 거래규격별 평균 경매가와 총 경매 물량에 대한 요약정보를 담고 있습니다. 이 데이터는 주로 국내 민간 외식업체에서 요청한 자료로, 양채류의 가격 동향 및 거래량을 분석하여 최적의 구매 시점을 판단하는 데 유용하게 활용될 수 있습니다. 또한, 농림수산식품 분야에 속하는 다양한 업체와 연구자들이 시장의 동향을 파악하고 소비 트렌드를 예측하는 데 중요한 기초 자료로 활용됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. DATES(문자형): 경매가 진행된 월을 나타내며, 'YYYYMM' 형태의 문자열로 구성되어 있습니다. MARKETNM(문자형): 도매시장명을 나타내는 컬럼으로, 특정 도매시장을 식별하는 데 사용됩니다. MCLASSNAME(문자형): 품목명을 나타내며, 예를 들어 '배추', '상추' 등과 같은 주요 양채류의 종류를 포함합니다. SCLASSNAME(문자형): 세분화된 품종명을 나타냅니다. SCLASSCODE(문자형): 품종을 식별하는 고유 코드입니다. PRODUCTUNIT(숫자형): 거래가 이루어진 단위로, 보통 0.1kg 단위로 거래됩니다. UNITNAME(문자형): 거래의 규격을 나타냅니다. PRICE(숫자형): 경매가로, 해당 품종의 평균 거래가격을 나타냅니다. TOT(숫자형): 거래물량으로, 특정 품종이 경매에서 거래된 총량을 포함합니다."
