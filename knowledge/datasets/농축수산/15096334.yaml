description_portal: 데이터는 경작지의 토양 상태를 과학적으로 분석하여 토양의 비옥도 및 농업 적합성을 진단한 결과를 수록한 자료이다. 화성시 관내에서 채취한 토양 시료를 대상으로 산도(pH), 유효인산(mg/kg), 유효규산(mg/kg), 유기물(g/kg), 마그네슘(cmol+/kg), 칼륨(cmol+/kg), 칼슘(cmol+/kg) 등의 주요 양분 성분을 분석한 정보를 포함한다. 또한 전기전도도(dS/m)), 나트륨(cmol+/kg), 석회소요량(kg/10a), 양이온치환용량(cmol+/kg) 등 화학적 특성치도 함께 제공하여 작물 재배에 적절한 토양 환경 조성을 위한 기초자료로 활용될 수 있다. 항목에는 채취년도, 토양검정일, 경지구분, 주소 등 기본 정보가 포함되며, 농가 맞춤형 비료 처방 및 토양개량 사업 기획의 기초자료로 제공된다. 정기적인 토양 검정 결과를 통해 지속가능한 농업 기반 마련에 기여하고자 한다.
