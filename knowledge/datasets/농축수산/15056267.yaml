description_portal: 본 데이터는 제주특별자치도 제주시 내 농산물산지유통시설(APC 등)의 인프라 및 전반적인 운영 실태를 파악할 수 있는 핵심 통계 자료입니다.각 거점 유통시설의 시설명과 소유/운영 주체(농협 등)를 비롯하여 설치 연도, 부지 및 건물 규모와 같은 물리적 인프라 정보를 상세히 제공합니다. 이와 함께 감귤, 마늘, 양배추, 브로콜리 등 시설별 주 취급 품목과 연간 가동 일수, 실제 처리 물량 데이터를 수록하고 있어, 제주시 관내 주요 농산물의 산지 처리 능력과 물류 흐름을 직관적으로 확인할 수 있습니다. 지역 농산물 유통 체계의 효율성을 진단하고 시설 현대화를 추진하기 위한 기초 자료로 사용할 수 있습니다.
