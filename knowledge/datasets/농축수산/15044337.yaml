summary_user: 한국농어촌공사가 관리하는 전국 취입보(하천·저수지 물을 끌어 농업용수로 공급하는 시설)를 시설 한 곳당 한 행으로 담은 제원 파일로, 시설명·소재지·착공/준공년도·유역·홍수·만수·수혜면적(ha)·한발빈도·언체 구조와 길이·높이 등을 담는다. 농업용수 관리나 안전점검 담당자, 분석가가 '우리 지역 취입보는 언제 지어졌고 수혜면적이 얼마인가', '준공 후 오래된 보가 어디에 몰려 있나' 같은 질문에 쓴다. 표준코드(dam_cd)가 조인 키라서 같은 표준시설코드를 쓰는 다른 농업기반시설 제원·점검 데이터와 잇고, 소재지 주소로 지역 단위 자료와 붙인다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 취입보에 대한 데이터입니다.- 취입보는 수원의 물을 취수하여 농업용수로 공급하는 시설입니다. - 주로 하천이나 저수지에서 물을 끌어올리는 역할을 하며- 물의 취수, 유량조절, 수질보호 등의 기능이 있습니다.- 본 데이터는 취입보에 대한 기본정보(표준시설코드,시설명,소재지,착공년도,준공년도,종별,구분,유역면적,홍수면적,만수면적,수혜면적 등)를 제공합니다.<단위>면적: ha한발빈도: 년길이: m높이: m폭: m수심: m- 해당 데이터는 농업용수 관리, 안전점검, 재난 관리 등 다양한 분야에서 활용 가능합니다.'
