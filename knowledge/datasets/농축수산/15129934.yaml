description_portal: '본 데이터는 제주특별자치도 제주시 관내 양돈농가의 운영 실태를 파악하기 위해 수집된 현황 자료로, 축산업 허가 또는 등록된 농가 정보를 기반으로 구성되어 있습니다. 양돈농가의 규모와 분포, 사육 환경을 체계적으로 관리하여 지속가능한 축산업 발전과 가축질병 방지, 악취 저감 등 환경보호 정책 수립을 위한 기초자료로 활용됩니다.주요 항목사업장명칭: 양돈업에 종사하는 농가 또는 법인의 명칭사업장 소재지: 양돈장이 위치한 도로명 주소 또는 행정구역사육시설 규모: 돈사(돼지우리)의 구조, 면적 등 시설의 물리적 크기사육규모: 실제 사육 중인 돼지의 두수 또는 최대 수용 가능 마릿수 등활용 목적이 데이터는 가축전염병 예방을 위한 방역 대상 농가 관리, 양돈산업 구조 분석, 축산 환경 개선, 축산 악취 민원 대응, 농업 정책 수립 등에 활용됩니다. 또한 지역별 양돈농가 밀집도와 사육 규모에 따른 집중 관리 방안 마련에도 활용될 수 있습니다. 제주시 축산과에서 관리하고 있습니다.'
