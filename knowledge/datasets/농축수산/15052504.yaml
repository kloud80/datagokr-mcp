summary_user: 국립농산물품질관리원이 적발한 농축산물 원산지표시 위반을 처분년월·시도·위반 품목·위반 유형별로 묶어 위반 건수와 위반 물량(kg)을 담은 전국 단위 집계 현황이다. 소비자나 분석가가 어느 시도에서 어떤 품목의 원산지 거짓표시·미표시가 많이 적발되는지, 그리고 그 추이가 어떤지를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명(SD_NM)이나 품목명을 이름으로 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 농산물원산지표시제도는 농산물, 수산물이나 그 가공품 등에 대하여 적정하고 합리적인 원산지 표시를 하도록 하여 소비자의 알권리를 보장하고, 공정한 거래를 유도함으로써 생산자와 소비자를 보호하기 위하여 도입한 제도로서 본 정보는 국립농산물품질관리원에서 관리하는 농축산물 원산지표시 시도별 품목별 위반 현황 정보로서, 처분년월, 업무 구분명, 시도명, 위반 품목, 위반 유형, 위반 건수, 위반 물량(kg) 항목으로 구성되어 있습니다. 농산물 원산지 품목별 위반 현황 정보를 활용하는 데 관심이 있는 경우 유용하게 사용할 것으로 기대됩니다.
