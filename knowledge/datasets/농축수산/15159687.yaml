description_portal: 김천시 축산물판매업 현황 데이터는 「축산물 위생관리법」에 따라 영업 신고 또는 허가를 받은 축산물판매업소의 등록 정보를 제공하는 공공데이터입니다. 본 데이터에는 식육판매업, 식육즉석판매가공업 등 축산물 판매 관련 영업장의 업소명, 소재지, 영업형태 등 기본 현황이 포함되어 있으며, 시민들에게 안전한 축산물 유통 정보를 제공하고 관련 산업 현황 파악 및 정책 수립의 기초자료로 활용됩니다. 현재 김천시에는 총 223개소의 축산물판매업소가 등록되어 운영되고 있으며, 축산물 위생관리 및 소비자 알권리 보장을 위한 공공서비스 자료로 제공됩니다.
