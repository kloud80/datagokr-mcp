description_portal: 이 데이터는 해양수산부에서 해양경비관할구역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 해양공간객체번호, 제작일자, 관할구역명, 정의내용, 해양정책법령명, 상세조항명, 해양조사관련부서명, 참조URL주소, 소속명 데이터로 구성되어 있습니다.본 데이터는 해양경비관할구역 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양경비관할구역이란 해양경찰이 해양 안보 확보, 치안 유지, 해상사고 대응, 해양오염 방제 등의 임무를 수행하는 데 책임을 지는 바다 위 영역을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
