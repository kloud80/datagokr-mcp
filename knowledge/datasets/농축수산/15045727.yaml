summary_user: 2015년 제·개정된 농축수산물 표준코드의 도매시장 법인코드와 그 이전에 쓰던 구 법인코드를 시장별로 짝지어 담은 전국 단위 코드 매핑표(CSV 약 23KB)다. 과거 도매시장 경락·반입 자료를 현재 표준법인코드 기준 자료와 합쳐 법인별 거래 추이를 보려는 분석가가 '옛 코드의 이 법인이 지금 어느 코드인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 같은 기관의 도매시장 경락가격 자료 등과 시장코드·법인코드(및 구코드) 값을 맞춰 연결한다.
description_portal: 본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘농수축산 신구표준법인목록’에 대한 상세 정보이다. 2015년 제·개정된 농축수산물 표준코드의 도매시장 법인과 동일한 의미를 가지는 과거에 사용하던 도매시장 법인코드를 나타낸 정보로, 법인코드, 법인명, 구법인코드, 구법인명, 업데이트일자 등의 항목으로 구성되어 있다. 해당 데이터는 농축수산물 유통 및 거래 시 과거와 현재의 법인코드 간 매핑 정보를 제공하여, 데이터 연계 및 분석에 활용될 수 있다. 특히, 과거 법인코드와 명칭을 현재의 표준법인코드와 비교 제공함으로써, 시스템 간 호환성과 이력 관리의 정확성을 높이는 데 기여한다. 데이터는 CSV, XML, JSON 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 오픈 API 형태로 활용 가능하다.
