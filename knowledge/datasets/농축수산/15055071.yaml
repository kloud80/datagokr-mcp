description_portal: 우리나라는 2002년에 UPOV(국제식물신품종연맹)에 가입하였고, 가입 후 10년 이내에 전 식물로 품종보호 대상식물을 확대하여야 했음. 1998년 이 후 품종보호제도 도입 이후 2012년에 전 식물로 확대하기 까지 품종보호 대상식물을 연도별로 지정한 내역최근 이슈가 되고 있는 샤인머스캣, 딸기 등 품종보호제도 운영을 위한 품종보호 작물 지정 내역이 요구되는 상황에서 매년 말 기준 연간 자료 수정하여 업데이트하고 있음식물 지식재산권으로 신품종 육종가의 권리를 부여하는 제도로써 필수로 필요한 자료임
