description_portal: 전라남도 수산물 가공업체 현황은 대한민국 수산업의 중심지로서 풍부한 수산자원을 바탕으로 가공산업이 집약적으로 발전한 모습을 보여준다. 주요 가공품목은 김, 젓갈, 멸치, 조기, 굴, 전복 등 다양한 품종의 염장품과 냉동·건조 수산물, 수산가공식품이며 최근에는 HACCP 인증제품과 즉석 편의식품까지 확대되고 있다. 업체들은 여수, 목포, 완도, 신안, 고흥 등 연안지역을 중심으로 분포하며, 이는 어획지와 근접한 입지를 이용해 원료를 신선하게 가공할 수 있는 장점이 있다. 또한 현지 수산물 가공업은 내수시장뿐만 아니라 중국, 일본, 미국 등으로의 수출에서도 큰 비중을 차지하며 지역경제와 일자리 창출에 핵심적인 역할을 한다
