summary_user: 농식품 공공데이터 포털에 올라 있는 데이터셋 목록을 데이터 한 건당 한 행으로 담는 메타데이터 목록으로, 데이터 아이디·이름·갱신 주기 코드·언어·조회수·보유 형태·누적 데이터 수·삭제 여부를 전국 단위(비공간)로 제공한다. 분석가나 담당자가 '농업·농촌 분야에 어떤 공공데이터가 있고, 어느 것이 많이 조회되며 갱신 주기는 어떤가'를 파악하거나 데이터 현황을 비교·평가할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 데이터 이름 매칭이나 같은 기관 내부 코드(데이터 아이디)로만 연결된다.
description_portal: 본 데이터는 농림축산식품부가 제공하는 농식품 공공데이터 포털의 데이터 목록 정보를 포함합니다. 데이터 아이디, 데이터 명, 갱신 주기 코드, 언어, 조회수, 보유 형태 코드, 누적 데이터 수, 삭제 여부 등의 항목으로 구성되어 있습니다. 이를 통해 농업 및 농촌 분야의 공공데이터 현황을 파악하고 관리하는 기초 자료로 활용됩니다. 또한 정책 수립과 연구 분석에 필요한 데이터 정보 비교 및 평가에 도움이 됩니다. 단, 정보 수집 범위와 주기의 차이로 실제 현장 정보와 상이할 수 있으니 데이터 활용 시 참고하시기 바랍니다. 본 데이터는 농림축산식품부의 데이터 기반 행정 지원과 정책 개발에 기여합니다.
