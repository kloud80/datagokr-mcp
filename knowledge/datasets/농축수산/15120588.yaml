description_portal: 축산물등급판정 통계연보는 축산물품질평가원에서 매년 발행하는 국가승인통계(제388001호)로, 소, 돼지, 닭, 오리, 계란, 말 등 주요 축산물의 등급판정 결과와 가격 동향을 집대성한 자료입니다.  이 연보는 소, 돼지, 닭 등 주요 축종에 대해 총 62종의 방대한 통계자료를 수록하고 있습니다. 소, 돼지, 닭, 오리, 계란, 말의 등급판정 물량, 등급별 출현율, 성별/지역별 판정 현황 등을 포함합니다. 그 중 축산물등급판정 통계연보 2025년도에서 표1-4 소 품종(한우, 육우, 젖소)별 성(암, 수, 거세)별 육량등급(A, B, C)별 육량지수(Index)를 제공합니다. 전체데이터의 확인 (등급판정통계연보)은 축산물품질평가원 누리집 정보공개 > 통계연보 에서 확인이 가능합니다.는 2006년부터 축산물등급판정통계연보 정보를 확인할수 있습니다.  축산물등급판정통계연보는 매년 3월에 발간하며 추가적인 통계정보는 축산물품질평가원 누리집에서 열람 및 내려받기가 가능합니다.  연보 발행 전 최신 동향은 통계월보를 통해 매달 업데이트되는 수치를 확인할 수 있습니다.
