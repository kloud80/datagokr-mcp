description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)가 제주도 내 고품질 감귤 농가를 대상으로 2020년 11월부터 12월까지 진행한 감귤 크기 성장 측정 결과를 정리한 자료입니다. 각 데이터 항목은 농가관리번호(나무구분), 1차 측정크기, 2차 측정크기, 3차 측정크기, 4차 측정크기, 5차 측정크기로 구성되어 있으며, 농가관리번호는 해당 농가를 구분하는 고유번호와 괄호 안에 해당 나무의 번호를 함께 표기하는 형식으로 나타납니다. 예를 들어 ‘1(3)’은 1번 농가의 3번 나무를 의미하고, ‘11(2)’는 11번 농가의 2번 나무를 지칭합니다. 측정크기 값은 감귤의 실제 크기를 수치로 나타낸 값으로, 일정 간격을 두고 총 5회에 걸쳐 동일 개체에 대해 반복 측정한 데이터를 포함하고 있습니다. 이 데이터는 고품질 감귤의 생장 추이를 분석하고 시기별 성장 속도, 농가별 생육 차이, 품질 관리 지표 등을 종합적으로 파악할 수 있는 기초 자료로 활용되며, 품질예측 모델링, 스마트농업 기술 적용, 생육관리 전략 수립 등 다양한 농업 기술 및 정책 지원에 유의미한 정보로 제공될 수 있습니다.
