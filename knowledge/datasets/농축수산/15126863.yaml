summary_user: 연안침식에 영향을 주는 파도 특성을 측정년도·측정지역별로 담은 건별 측정 파일로, 파도 방향(16방위), 파고(m), 주기(초)가 측정 ID 단위로 기록돼 있고 범위는 전국이다. 연안 관리 담당자나 연구자가 "특정 해안의 우세 파향과 파고가 해마다 어떻게 달랐나"를 확인해 침식 취약지 관리나 연안 구조물 설계의 파 조건 근거로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 연안침식·해안선 자료와는 측정지역명이나 같은 기관의 측정지역코드를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 해양수산부에서 연안침식에 영향을 미치는 파도의 특성 조사 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 파향 및 파고 측정년도, 측정지역, 파향파고측정ID, 측정된 파도의 방향 구분, 파고의 길이와 등 정보로 구성되어 있습니다.  본 데이터는 유관 국가기관에서 해안선 변화 모니터링, 연안 재해 평가, 연안 침식 취약 지역의 관리 대책 수립, 해양·연안 기반 시설 설계 시 파 조건 분석, 파동 역학 관련 연구, 연안 관리 정책수립 등 활동을 위한 근거 자료로 활용될 수 있습니다.측정파도방향코드는 N(북) NNE(북북도) NE(북동) ENE(동북동) E(동) ESE(동남동) SE(남동) SSE(남남동) S(남) SSW(남남서) SW(남서) WSW(서남서) W(서) WNW(서북서) NW(북서) NNW(북북서) 입니다. 측정파고길이의 단위는  m(미터) 입니다.
