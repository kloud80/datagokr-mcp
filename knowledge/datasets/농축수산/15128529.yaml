description_portal: 이 데이터는 해양수산부에서 항만기술기준의 최근 고시 현황을 체계적으로 관리하고 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 설계기준, 표준시방서, 전문시방서, 신기술 활용, 항만기본계획, 지침 등 항만기술기준의 제·개정 고시 제목과 내용으로 구성되어 있습니다.  본 데이터는 항만 관련 정책 수립, 기술 기준 검토 및 개선, 항만 설계와 운영에 필요한 동향 파악, 항만 건설 및 유지관리 업무에 참고자료로 활용될 수 있습니다. 또한, 항만 기술 변화에 따른 업계의 대응 방안 모색, 법적 근거 마련에 필요한 자료 연구 등에 사용될 수 있습니다.
