description_portal: '농촌진흥청은 한식의 종류와 활용, GAP인증 현황과 한식에 포함된 식품성분표 등 한식에 관련된 다양한 정보를 제공하여 한식의 세계화에 앞장서고 있습니다. - 제공정보 : 1. 한식요리정보(음식명, 식품코드, 식품명, 등록자 고유번호, 음식 재료 등), 2. 한식 활용(한식코드, 식품코드, 한식이름, 재료, 도구, 요리방법, 활용요리, 사진, 영문사진), 3. GAP 인증 현황(단체명, 품목명, 지역정보, 지정일자, 사용여부 등),  4. 국가표준식품성분표, 5. 한식요리 방법 등  * 활용예사 : 한식요리를 만들기 위한 재료 및 방법, 사진을 제공하여 식품재료 판매 활용 등 관련 산업 이용'
