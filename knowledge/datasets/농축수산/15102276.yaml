description_portal: 한국수목원정원관리원은 수목원 기반 생물자원 및 생태연구 성과의 공유를 위해 학술발표 현황 정보를 공공데이터로 제공합니다.이 데이터는 산하 기관 소속 연구진이 외부 학술대회 등에서 발표한 학술성과 목록으로, 발표 제목, 저자, 소속, 발표 연도, 학술행사명, 발표 구분(구두·포스터) 등으로 구성되어 있습니다. 주요 주제는 수목원 운영, 생물다양성 보전, 식물자원 활용, 생태 교육 및 전시연계 연구 등으로, 산림 및 정원 기반의 실증연구 동향을 파악하는 데 유용한 자료입니다.데이터는 CSV 형식으로 제공되며, 연도별·연구자별 정렬이 가능하도록 표준화된 구조로 구성되어 있습니다.항목에는 발표 제목, 발표자명, 소속기관, 발표 연도, 발표형식, 학술행사명, 개최장소 등이 포함되어 있으며, 발표 주제나 연도 기준으로 검색 및 분류가 가능합니다. 이를 통해 기관의 연구 이슈 흐름, 연구자별 활동 특성, 연도별 발표량 분석 등이 체계적으로 가능합니다.본 데이터는 식물·생태·정원분야 연구자, 정책 수립자, 교육기관 등에 유용한 과학기술정보 자원입니다.연구기관은 유사 주제 탐색 및 협업 발굴에, 교육기관은 실제 학술사례 기반의 교육 콘텐츠 구성에, 행정기관은 기관 연구성과 활용도 및 과학기술 연계 정책 수립 자료로 활용할 수 있습니다. 특히 정원·수목원 기반 실증연구 자료로서 공공성과 현장성을 동시에 갖춘 고가치 데이터입니다.
