summary_user: KAMIS 품목·품종·등급별로 조사일 평균가격과 1~4주 전 평균가격을 단위가격과 kg 환산가격으로 함께 담은 전국 단위 가격 추이 데이터다. 농업인이 출하 시점을 정하거나 식자재 구매 담당자가 '이번 주 배추 값이 한 달 전보다 얼마나 올랐나'를 확인하는 데 쓴다. 전역 조인 키는 없고 품목코드(item_cd)·품종코드(vrty_cd)로 같은 KAMIS 계열 데이터와만 이어 쓰며, 도매시장·HS·KOSIS 자료와 붙이려면 품목코드 매핑이 따로 필요하다.
description_portal: 한국농수산식품유통공사의 조회일 기준 평균가격, 1~4주전 평균가격 추이 제공 데이터로,조사일자, 구분코드, 구분명, 부류코드, 부류명, 품목코드, 품목명, 품종코드, 품종명, 등급코드, 등급명, 단위, 단위크기, 조사일평균가격, 조사일kg환산평균가격, 1주일전평균가격, 1주일전kg환산평균가격, 2주일전평균가격, 2주일전kg환산평균가격, 3주일전평균가격, 3주일전kg환산평균가격, 4주일전평균가격, 4주일전kg환산평균가격을 제공합니다.★ API명세서 및 관련 코드정보가 첨부되어 있습니다.기대활용분야 - (국민) 농산물유통정보를 활용하여 농산물 판매·구매 계획 수립, 농산물 유통 분야 사업모델 발굴, 유통 과정 부가가치 창출, 개인 및 기관의 연구 목적으로 활용 등 다양한 빅데이터를 활용하여 융복합 기대 - (유통) 농산물유통정보 분석으로 생산성 관리, 재고관리 등 유통 분야 활용 - (농업종사자) 농산물유통정보 가격등락, 추이 정보 등을 활용, 농산물유통정보 데이터 확보를 통한 출하선택·결정권 강화 - (정책담당자) 농산물유통정보 분석을 통해 주요품목 수급안정 및 농산물 가격변동 완화 - (지자체:도매시장 개설자)농산물유통정보를 활용한 재고 및 물류 최적화
