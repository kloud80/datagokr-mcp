description_portal: 데이터는 경기도 화성시에서 운영 중인 포도 스마트팜 농가를 대상으로 수확기 기간에 측정된 토양 지온 정보를 제공한다. 각 농가는 고유번호로 식별되며, 공간정보를 나타내는 좌표값(x, y)과 함께 수확기 중 기록된 지온 수치가 포함되어 있다. 본 자료는 수확 시기의 토양 온도 분포를 분석하고, 포도 품질 유지, 병해 발생 가능성 예측, 수확 적기 판단 등과 관련된 의사결정에 활용될 수 있다. 또한 농가별 환경 특성을 반영한 스마트팜 운영 전략 수립, 지역 간 재배 조건 비교, 정밀 농업 기술의 고도화에도 기여할 수 있다. 위치 기반의 환경 데이터로서, 농업 기술 개발자, 정책 수립 기관, 연구자 등이 다양한 분석 및 연구에 참고 자료로 활용 가능하다.
