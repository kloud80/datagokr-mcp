description_portal: 본 자료는 가축위생방역지원본부가 전국 시군별 축산농가를 대상으로 실시한 질병검색 현황을 정리한 것입니다. 방역사는 농장을 직접 방문하여 임상증상을 확인하고, 필요 시 시료채취를 통해 가축전염병 여부를 검사합니다. 데이터에는 검출일자, 시도·시군, 축종 및 품종, 사육두수, 임상증상, 검사결과, 조치결과 등이 포함되어 있습니다. 검사 결과는 ‘이상무’에서부터 ‘대장균감염증’ 등 특정 질병 진단까지 기록되며, 조치결과는 열화상카메라 활용, 시료채취(분변) 등 농장의 실제 대응 방안이 구체적으로 기재됩니다. 이러한 자료는 시군별·축종별 질병 발생 동향을 파악하는 기초자료로 활용되며, 가축전염병 예방과 신속 대응을 위한 과학적 근거를 제공합니다. 또한, 질병 검색 결과는 정책수립 및 평가 등에 반영되며, 발생 위험이 높은 농가에 대한 집중 관리와 보완 조치를 가능하게 합니다. 본 자료는 가축 방역정책 수립, 질병 발생 추세 분석, 살처분 및 예방접종 정책 마련 등 국가 차원의 가축전염병 대응을 위한 핵심 데이터로 제공됩니다.자세한 사항은 가축위생방역지원본부 방역사업부에서 확인하실 수 있습니다.044-550-5560
