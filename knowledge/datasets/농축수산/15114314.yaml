status: active
summary_user: 연안관리법에 따라 관리되는 자연해안 관리목표를 행정구역별로 집계한 파일로, 자연·인공 해안의 바닷가 수와 해안선 수, 조간대 수, 각 항목의 개발수요 건수, 목표 면적·길이와 목표율을 담는다(전국 범위, 약 7KB CSV). 지자체 해안 보전 담당자나 연구자가 "우리 시군의 자연해안선 목표율은 얼마이고 개발수요는 몇 건인가"를 확인하거나 지역 간 보전 목표를 비교하는 데 쓴다. 전역 조인 키는 없어서, 행정구역 코드·명칭(자연해안행정구역코드)을 다른 행정구역 기준 통계와 이름·코드로 맞춰 연결해야 한다.
limits: 행정구역 단위 집계표이고 좌표·경계가 없는 비공간 데이터라 개별 해안선이나 바닷가의 위치를 지도에 표시할 수 없다. 표준 공통 키가 확인되지 않아 다른 데이터와 붙일 때는 행정구역 코드 체계가 같은지 먼저 점검해야 한다.
