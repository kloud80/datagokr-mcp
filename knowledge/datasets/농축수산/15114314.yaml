description_portal: 이 데이터는 해양수산부에서 연안관리법에 의거하여 관리되는, 수행이 완료된 자연해안 목표집계정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 대상 해안이 위치한 행정구역 코드와 명칭, 자연 및 인공해안의 바닷가 및 해안선수, 각 항목별 수요건수, 목표면적/길이 및 목표율 정보로 구성되어 있습니다.본 데이터는 연안의 자연 상태 보전 및 관리 현황을 파악하기 위한 정책 기초자료로 활용할 수 있으며, 학계에서는 연안 환경 변화 연구, 지자체 및 관련 기관에서는 해안 보전 정책 수립과 이행 점검에 사용할 수 있습니다.
