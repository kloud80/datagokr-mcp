description_portal: 농촌관광 관련 농촌체험휴양마을, 관광농원, 농어촌 민박을 대상으로 체험, 교육, 숙박, 음식에 대한 농촌관광 등급결정 현황을 제공합니다.3부문 모두 1등급 시 으뜸촌으로 선정됩니다.농촌관광등급결정 현황을 제공하여 농촌 여행지 선정 시 가이드가 될 수 있습니다.농촌관광등급결정 정보는 심사 후 3년간 유효하며, 체험마을 등 농촌 경영체의 신청에 따라 접수 받아 심사를 진행합니다.26년 현재 779개 경영체를 대상으로 등급정보가 부여되었습니다.시도, 시군구, 마을이름, 선정년도, 부문별 등급 현황이 명시되어 있습니다.
