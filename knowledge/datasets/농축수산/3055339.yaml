summary_user: 국립농산물품질관리원이 수행한 수입농산물 검사를 신청번호 단위로 담은 전국 범위의 건별 자료로, 품목명·원산지명·관할사무소명·등록일자와 검사수량, 규격합치·규격미달 수량(톤)이 들어 있습니다. 수입업체나 유통·정책 분석가가 "특정 원산지에서 들어온 특정 품목이 검사에서 규격미달로 판정된 물량이 얼마인가" 같은 질문에 답하거나, 품목·원산지·사무소·기간별 수입 동향을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·원산지명 같은 이름으로 매핑해 잇고, KAMIS 가격이나 HS·KOSIS 품목코드와 붙이려면 품목코드 매핑표를 따로 만들어야 한다.
description_portal: 국립농산물품질관리원에서 관리하는 수입농산물 검사에 대한 정보로서, 검사 신청번호, 품목명, 원산지명, 관할 사무소명, 통보일자, 검사 수량, 규격합치 수량(톤), 규격미달 수량(톤) 항목으로 구성되어 있습니다. 농산물 품목별 수입농산물 검사현황, 농산물 원산지별 수입농산물 검사현황, 관할사무소별 수입농산물 검사현황, 기간별 수입농산물 검사현황 등 통계자료를 작성하여 수입농산물 검사에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대되며, 수입동향 파악 등 자료로도 활용이 가능할 것으로 기대됩니다.
