description_portal: 축산물품질평가원에서 제공하고 있는 소도체 도매시장별 등급별 경락가격은  월별로 제공되고 있는 자료로, 10개의 도매시장(협식식품, 부경축공, 삼성식품, 제주축협, 농협부천, 농협고령, 창녕축공, 안동봉화, 농협나주, 도드람, 농협음성, 관성(홍성), 농협포크빌)별 경락가격 정보 조회가 가능합니다.  또한 등급별로  두수와 경락가격 정보를 제공하고 있습니다.  월별로 제공하고 있어 경매가격 추이를 알수 있어, 변화추이를 파악하는데 중요한 기초자료로 활용되고, 해당 통계자료는 다양한 형태로 내려받을 수 있어 쉽게 접근 및 활용이 가능합니다.
