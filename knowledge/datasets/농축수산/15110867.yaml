description_portal: '제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍링링 데이터를 제공합니다.항목: 일반정보(피해요인), 일반정보(피해대상), 도로명/지번 주소, 행정동코드, 위도, 경도 등* 2018년 제주특별자치도에서 발생한 태풍 링링(Typhoon Lingling)으로 인한 자연재해 피해 정보를 행정동 단위로 상세하게 기록한 자료입니다. 대·중·소분류의 피해 유형, 피해 구분, 요인, 대상 품종 등을 포함하여 다양한 피해 양상을 세분화하고 기록하고 있으며, 도로명주소·지번주소·행정동 코드·위도·경도 등의 공간 정보도 함께 제공하여 GIS 기반 분석과 시각화에 특히 유용합니다.* 활용 분야 : GIS 기반 피해 시각화 및 공간 분석, 재난 대응 전략 수립, 태풍 간 비교 분석 등"'
