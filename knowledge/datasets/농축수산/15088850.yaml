summary_user: 산림복지전문업지원시스템에서 추출한 산림복지 자격증 발급 내역을 담은 전국 단위 파일로, 자격취득연도·자격종류(산림치유지도사, 숲해설가, 유아숲지도사, 숲길등산지도사)·성명이 행 단위로 들어 있다. 연구기관이나 정책 담당자가 연도별·자격종류별 산림복지 자격 취득자 수가 어떻게 변해 왔는지 집계해 인력 수급이나 양성 정책을 검토하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 자격종류 이름이나 연도로 맞추는 방식으로만 같은 기관의 산림복지 자료와 연결한다.
description_portal: 해당 데이터는 산림복지전문업지원시스템에서 추출한 산림복지자격증 발급 관련 정보를 포함하고 있으며, 자격증 종류에는 산림치유지도사, 숲해설가, 유아숲지도사, 숲길등산지도사로 구분됩니다. 주요 항목으로는 자격취득연도, 자격종류, 성명 등이 포함되어 있습니다. 이 자료는 산림복지 분야 인력의 자격 현황을 파악하고 자격 취득 추이 분석, 인력 수급 계획 수립, 교육 및 양성 정책의 방향 설정 등에 활용될 수 있습니다. 또한, 산림복지서비스의 질적 향상을 위한 핵심 기반 데이터로서, 정책기관 및 연구기관에서 폭넓게 활용될 수 있습니다.
