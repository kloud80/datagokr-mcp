description_portal: '○ 통계개요* 통계명 : 친환경 농·축산물 인증 현황* 통계종류 : 서울시 친환경 농·축산물의 인증현황을 제공하는 일반·보고통계* 작성목적 : 친환경농·축산물 인층현황을 파악하여 고품질 농산물을 제공하기 위한정책수립 등에 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 국립농산물품질관리원* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 친환경 농산물(유기, 무농약, 저농약) 및 축산물(유기,무항생제)의농가수 및 면적, 출하량 현황○ 용어설명* 친환경 농산물은 유기합성농약 및 화학비료 사용량에 따라 유기,무농약,저농약 농산물로구분* 친환경농산물 : 환경을 보전하고 소비자에게 보다 안전한 농산물을 공급하기 위해농약과 화학비료 및 사료첨가제 등 화학자재를 전혀 사용하지 않거나최소량만을 사용하여 생산한 농산물임- 유기농산물 : 3년이상 유기합성농약과 화학비료를 사용하지 않고 재배- 무농약농산물 : 유기합성농약은 사용하지않고 화학비료는 권장시비량의 1/3이하로 재배- 저농약농산물 : 화학비료, 유기합성농약은 기준량의 1/2이하 사용, 제초제 사용불가'
