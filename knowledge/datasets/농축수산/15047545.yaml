summary_user: 국립농산물품질관리원이 생산·유통 단계 안전성조사에서 채취한 농산물 시료별로 생물독소 등 독소류 분석결과를 담은 건별 원천 데이터로, 품목·수거단계·재배양식·생산자·주소·재배면적·조사물량·등록일자·분석결과를 전국 범위로 담는다. 소비자나 식품·유통 사업자가 특정 품목이 어느 단계·지역에서 수거돼 독소류 검사에서 어떤 결과를 받았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·주소 같은 이름 매핑으로만 이어 쓰며, KAMIS 등 가격 데이터와 붙일 때도 품목명 대응표를 따로 만들어야 한다.
description_portal: 안전성조사는 농산물의 생산·유통·판매 단계에서 농약 등 유해물질 안전성조사를 통해 부적합품의 시중 유통을 차단하여 안전한 농산물을 공급을 목적으로 도입되었으며, 농산물 독소류 검사는 안전성조사시 채취한 시료에서 생물독소 등이 검출되는지 분석하는 것으로 본 정보는 국립농산물품질관리원에서 관리하는 생산, 유통 단계에서의 농산물 독소류 분석결과(품목, 수거단계, 재배양식, 생산자, 지역, 재배면적, 조사물량, 등록일자, 분석결과)정보입니다. 농산물 안전성에 관한 사항 중 독소류와 관련된 사항에 관심이 많은 경우 유용한 정보가 될 것으로 기대됩니다.
