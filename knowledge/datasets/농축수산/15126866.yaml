description_portal: 이 데이터는 해양수산부에서 연안침식의 영향을 받는 하천의 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 연안침식이 발생하는 하천의 하천 현황 지역, 하천명, 하천 등급, 하천의 유로 길이, 전체 하천 길이, 하천 면적, 하천 유입량, 하천 수위 높이, 하천 너비 등 항목별 세부 정보로 구성되어 있습니다.  본 데이터는 해양수산부의 연안정비 정책 수립 시 연안 침식 하천의 특성 분석, 하천 관리 방안 마련, 국가 및 지자체의 하천 보전계획 수립의 기초 자료로 활용될 수 있습니다. 또한 하천 환경 평가 및 변화 모니터링, 연안 침식 방지와 관련된 연구의 기초자료로도 활용할 수 있습니다.
