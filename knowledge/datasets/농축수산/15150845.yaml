summary_user: 경기도 워라밸링크 플랫폼에 올라온 자연휴양림을 한 곳당 한 행으로 담은 시설 목록으로, 휴양림명·주소·운영시간·휴무일·입장료·요금 감면 대상·홈페이지·위경도와 숲속의집·야영장 같은 시설 사진 설명을 포함한다. 가족 나들이를 계획하는 도민이 '가까운 휴양림 중 입장료 감면을 받을 수 있고 이번 주말에 여는 곳은 어디인가'를 찾을 때나, 관광 콘텐츠·휴양지 추천 서비스를 만드는 사업자가 시설 기본 정보를 모을 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서 휴양림 이름이나 주소로 맞추거나 위경도(lat, logt)로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도에서 제공하는 ‘워라밸링크’ 플랫폼의 자연휴양림 정보를 체계적으로 정리한 자료로, 주요 자연휴양림의 명칭, 주소, 운영시간, 입장료, 요금 감면 대상, 휴무일 등의 기본 정보와 각 휴양림에 대한 이미지 설명까지 포함되어 있습니다. 항목으로는 ‘고유번호’, ‘휴양림명’, ‘기관유형’, ‘운영일시’, ‘시설문의’, ‘입장료’, ‘요금감면대상’, ‘이미지파일부가설명1~10’, ‘조회수’ 등이 있으며, 특히 ‘이미지파일부가설명’ 필드를 통해 숲속의집, 야영장, 꽃정원 등 이미지파일 각 숫자값에 대한 정보를 제공하여 이용자들이 시설 전반을 직관적으로 이해할 수 있도록 구성되어 있습니다. 해당 데이터는 가족휴양, 공공레저시설 소개, 지역별 자연공간 활용현황 분석 등 워라밸(일과 삶의 균형) 구현과 관련된 정책홍보, 관광콘텐츠 기획, 사용자 맞춤형 휴양지 추천 등 다양한 분야에 활용 가능합니다.
