summary_user: 전국 농어촌체험휴양마을과 마을별 체험프로그램을 한 행씩 담은 파일로, 마을명·시도·시군구·도로명/지번 주소·위경도·대표자·연락처·지정일자·관리기관을 함께 싣는다(2022~2023년 자료, CSV 약 33만 바이트). 여행자나 지자체·관광 분석가가 '우리 지역 근처에 어떤 체험마을이 있고 어떤 체험(프로그램 구분)을 하는가'를 찾거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 시도·시군구 이름이나 주소, 위경도 좌표로 행정구역·관광지 데이터와 맞춰 붙인다.
description_portal: 본 데이터는 2022년과 2023년 농어촌체험휴양마을 및 체험프로그램 자료로, 각 체험마을의 기본 및 프로그램 정보를 포함하고 있습니다.주요 항목으로는 체험마을명, 시도명, 시군구명, 체험프로그램명, 체험프로그램구분과 소재지 도로명 주소, 지번주소, 대표자 성명, 대표 전화번호, 지정일자, 홈페이지주소, 관리기관명, 위도경도, 데이터 기준일자가 포함되어 있습니다.농어촌체험휴양마을 표준데이터셋 등록 과거자료로 1회성 데이터입니다.해당 데이터를 통해 마을의 위치와 관리 주체, 체험 프로그램 현황을 정확히 파악할 수 있으며 관광객 안내, 체험 프로그램 홍보 등 다양한 목적으로 활용 가능합니다.
