description_portal: 이 데이터는 해양수산부 국립해양조사원에서 해양안전심판원 데이터를 기반으로 한 선박사고 포인트 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 선박사고 포인트의 SHP형식 공간정보 파일로 구성되어 있으며, 각 포인트의 사고번호, 사고내용, 사고선박명, 사고 발생일자, 사고발생 해역 및 사고당시 선박의 방위각 정보 등을 포함하고 있습니다.  본 데이터는 선박 운항사, 보험사 등에서 사고 발생 빈도 및 유형 분석, 위험 예방 대책 마련, 해양 운송 경로상의 사고 취약 지점 파악 등의 목적에 활용될 수 있습니다. 또한, 해양수산 행정기관에서는 정책 수립 근거자료로 활용하며, 해양안전 교육기관에서는 사고 사례 분석 및 교육자료로 사용할 수 있습니다.
