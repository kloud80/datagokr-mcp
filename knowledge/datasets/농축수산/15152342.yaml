description_portal: 한국해양진흥공사가 관리하는 대손충당금 산출을 위한 기준정보를 제공합니다.대손충당금은 미래에 발생할 수 있는 대손(회수 불능 채권) 위험에 대비하기 위해 산출합니다. 회계의 보수주의 원칙에 따라 예상되는 손실을 미리 비용으로 인식하는 과정입니다. 미리 쌓아둔 충당금으로 먼저 상계 처리하여 재무 상태를 안정적으로 관리할 수 있습니다. 한국해양진흥공사에서 동일한 사유로 대손충당금 관리를 하고 있으며,  관리한 필요한 항목 정보를 준비하여 제공해 드리고 있습니다.상세 내용은 첨부 화일을 참고해 주세요한국해양진흥공사의 신용등급별, 회계연월별 별 대손충당금 관리 현황입니다.
