description_portal: 해양수산부는 해양생명 자원통합정보시스템(MBRIS, Marine Bio-Resource Information System)을 통해 체계적으로 관리되는 해양생물다양성 정보를 환경부에 제공하여 국가 차원의 생물다양성 정보공유체계 구축에 기여하고 있습니다. 이를 통해 우리나라 해역에서 채집된 다양한 해양생물의 출현기록, 분류학적 정보, 위치정보 등 핵심데이터가 연구자와 정책담당자들에게 개방·활용될 수 있으며, 생물다양성 연구와 국가 정책 수립의 과학적 근거로 활용됩니다. 나아가 이러한 데이터 제공은 학술연구 지원뿐만 아니라 해양 환경관리, 기후변화대응, 생태계 보전 정책의 수립에도 직접적으로 기여하며, 국내해양생물연구 역량강화와 함께 국제적 협력 및 글로벌 해양정책 논의를 위하여 개방하고 있습니다.
