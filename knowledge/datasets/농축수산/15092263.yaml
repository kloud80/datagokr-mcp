description_portal: '강원특별자치도 강릉시 관내 가금농가(닭·오리 등)를 대상으로 사업장별 위치, 등록 축종, 사육두수, 축사 동수와 면적 등을 정리한 데이터로, 지역 가금류 사육 현황과 농장 규모를 한눈에 파악할 수 있도록 구성된 자료입니다. 개별 가금농장을 단위로 정리되어 있어 방역·환경 관리, 가금산업 정책 수립 등에 활용할 수 있습니다.사업장명칭: 가금류를 사육·경영하는 농장 또는 사업장의 공식 명칭등록축종: 해당 농장에서 등록·사육 중인 가금류 축종(예: 육계, 산란계, 토종닭, 오리, 거위 등)사업장소재지(지번): 가금농장이 위치한 토지의 지번 주소(토지대장 기준 위치 파악용)사업장소재지(도로명): 농장의 도로명 주소(내방·내비게이션·지도 서비스 연계용)사육두수: 사업장에서 실제 사육 중인 가금류의 총 두수(마릿수, 신고 기준)동수(계): 축사를 포함한 가금 사육 시설 동(건물)의 총 개수면적(계): 가금 사육 시설의 전체 면적 또는 축사 연면적 합계(제곱미터 단위)데이터기준일자: 가금농가 현황이 조사·취합·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 가금농가의 분포와 규모, 축종별 사육구조를 체계적으로 파악할 수 있어, 고병원성 AI 등 가금 전염병 방역계획 수립, 집중 관리가 필요한 밀집 사육지역 파악, 가금 사료·수의서비스·출하 인프라 수요 분석, 축산 환경·악취 관리 대상 농가 선정, 가금농가 지원정책 및 스마트양계·시설 현대화 사업 기획 등의 기초 자료로 활용할 수 있는 가금류 사육현황 공공데이터입니다.'
