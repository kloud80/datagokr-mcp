summary_user: 국립해양조사원이 수행한 비실시간 장·단기 조석관측 지점의 명칭, 위도·경도, 관측연도, 관측 유형(단기·장기)을 지점별로 담은 전국 범위의 CSV 파일(약 47KB)이다. 신규 항만 건설이나 해안 보호시설 설계를 앞둔 기술자·연구자가 '이 해역 근처에서 과거 언제 조위 관측이 이루어졌는가'를 확인할 때 쓴다. 전역 조인 키는 없어 관측지점 코드(관측지점 코드명)나 지점 이름으로 같은 기관(바다누리) 조위 자료와 맞추거나, 위도·경도 좌표로 다른 해양·공간 데이터와 위치 기준으로 겹쳐 쓴다.
description_portal: 비실시간 장단기 조석관측 지점 정보(해양수산부 국립해양조사원 제공)이 데이터는 국립해양조사원에서 수행한 비실시간 장·단기 조석관측 지점의 위치 및 관측 연도 정보를 제공합니다.조석관측은 바닷물의 높낮이(조위) 변화를 측정하는 것으로, 짧게는 1주일, 길게는 1년 이상 장기간에 걸쳐 수행됩니다.이러한 관측은 신규 항만 건설, 해안 보호시설 설계, 해양 연구 등 다양한 분야에서 활용되는 기초자료로 매우 중요합니다.본 데이터에는 관측 지점의 명칭, 위도·경도(위치), 관측이 이루어진 연도 등의 정보가 포함되어 있으며, 과거 조위 데이터를 확인하거나 활용하고자 하는 국민과 전문가에게 유용한 자료입니다.데이터 구성관측지점 고유번호관측 유형관측지점 명위도경도관측연도관측유형 세부(단기, 장기)활용 예시교육·연구기관의 해양자료 수집민간 앱·서비스의 조석정보 기반 자료로 활용
