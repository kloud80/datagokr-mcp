description_portal: '해발고, 경사도, 연평균기온, 방위, 토성, 토심, 토양수분, 토양경도, 소밀도, 수종, 영급 등 총 11개 인자를 활용하여 자연 상태에서 가장 적합하게 자랄 수 있는 환경을 지도화 한 정보입니다. 해당 정보는 곰취의 재배적지도 GIS데이터로 곰취의 재배적지를 제공합니다.공간데이터(SHP) 파일 데이터이기 때문에 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.* 참고: 곰취는 국화과의 쌍자엽식물로 근생엽이 발달하는 다년초로 우리나라에는 전국에 걸쳐 심산의 수림 밑이나 습하고 비옥한 초생지 및 산꼴짜기의 계류에 연하여 군생한다.  곰취의 경우 해발고는 중부지역과 남부지역은 지역적인 편차를 고려하여 다르게 적용하였고 중부지역은 300m~1,400m 이내, 남부지역은 400m~1,400m 이내의 높이에서 재배가능하고 상층 임분의 경우 활엽수일 때, 수령은 3영급 이상일 때 재배가능하다. 중부지역은 300m이하, 1,400m이상, 남부지역은 400m이하, 1,400m 이상의 높이, 상층 임분의 경우 침엽수 혹은 혼효림 일 때, 수령은 2영급 이하일 때 재배가 어렵다.'
