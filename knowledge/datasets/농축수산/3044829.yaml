summary_user: 인천 삼산농산물도매시장에서 경매로 거래된 농산물의 경락 내역을 경매일자·도매법인·품목·품종·산지별로 거래물량(kg)과 경락단가(원)와 함께 담은 파일 데이터이며, 받은 CSV는 약 15MB 규모다. 식자재 구매자나 유통 분석가가 '이번 주 삼산시장에서 특정 품목·품종의 경락단가가 산지별로 얼마였고 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS나 다른 도매시장 경락 데이터와는 품목·품종 이름을 매핑해 이어 써야 한다.
description_portal: 삼산농산물도매시장에서는 경매를 통해 거래된 농산물의 실시간 경락가격 정보를 제공하여 시장의 공정성과 투명성 강화에 기여하고 있습니다.또한, 농산물의 산지 및 품종 정보를 기반으로 국산·수입산별 거래실적을 집계하고, 거래방식(경매·정가수의)별 실적과 월간 경락정보를 도매시장 홈페이지에 정기적으로 공개함으로써, 유통에 대한 객관적이고 신뢰도 높은 정보를 제공하고 있습니다.이러한 정보는 품목별 유통 동향, 품종별 수급 상황, 가격 추이 분석 등 시장 참여자들의 합리적인 의사결정을 위한 기초자료로 다양하게 활용되고 있습니다.
