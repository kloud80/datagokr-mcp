description_portal: 1. 데이터 설명  이 데이터는 전북특별자치도 남원시에 위치한 버섯 배지 생산·판매 업체 정보를 담고 있습니다. 버섯 배지는 표고버섯이나 느타리버섯처럼 다양한 버섯 품종을 키울 때 꼭 필요한 영양 기반입니다. 남원시의 버섯 재배 농가에서는 이 정보를 활용해 신뢰할 수 있는 배지 공급처를 한눈에 확인할 수 있습니다. 배지를 공급하는 업체 입장에서도, 잠재 고객과 직접 연결될 수 있는 기회를 얻게 됩니다. 더불어, 지역 버섯 산업의 생태계를 살펴보고, 관련 농업 정책을 세울 때 기초 자료로 쓰이기도 합니다. 업체별 운영 여부가 포함되어 있어 실제 거래가 가능한 곳만 골라볼 수 있게 정리되어 있습니다.2. 데이터 항목  농가명, 사업자등록번호, 연락처, 주소, 운영 또는 폐업 여부3. 기대 효과  이 데이터를 통해 버섯 재배 농가의 배지 구매가 한층 더 효율적으로 이루어질 수 있습니다. 또한 지역 내 농업 네트워크가 활성화되면서, 남원시 버섯 산업의 전체적인 경쟁력도 높아질 것으로 기대할 수 있습니다.
