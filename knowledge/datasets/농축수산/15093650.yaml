description_portal: 길고양이의 개체 수 조절 및 동물 복지 향상을 위해 추진되는 중성화수술(TNR) 사업의 관리 내역을 정리한 데이터입니다. 관리번호, 공고번호, 포획자, 포획일시 및 장소, 축종, 품종, 색상, 성별, 체중, 나이, 중성화 여부, 병원명, 수술 일시, 방사자, 방사일시, 방사장소 등 세부 항목으로 구성되어 있습니다. 본 데이터는 지자체 및 동물보호센터의 사업 수행 과정을 기반으로 수집되며, 길고양이 개체 수 관리, 방역·질병 예방, 주민 민원 대응 등 다양한 행정 및 정책 목적에 활용됩니다. 더불어 동물복지 기반의 정책 설계, 민간 구조단체 협력, 지역 사회의 생태계 조성에도 유용한 자료로 활용될 수 있습니다.
