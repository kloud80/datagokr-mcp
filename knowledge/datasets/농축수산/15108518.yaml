description_portal: 본 데이터는 수목원 내 전시원의 입체적 현장감을 디지털화하여 비대면 관람 환경을 제공하고 공간 정보 기반의 전시 관리 인프라를 구축할 목적으로 한국수목원정원관리원이 관리하는 전시원 VR 화상 정보를 제공하는 데이터입니다. 전시원 코드 및 전시원명 등의 고유 식별 정보와 함께 각 전시원의 주요 구역별 파노라마 및 3차원 VR 이미지 링크 데이터를 수록했습니다. 시공간 제약 없는 디지털 수목원 관람 서비스 제공부터 VR 기반의 식물 전시 기획 및 공간 관리 그리고 가상 공간 컨텐츠 개발의 기초 데이터로 활용됩니다.
