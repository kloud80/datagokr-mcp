summary_user: 한국수목원정원관리원이 관리하는 수목원의 전시원별로 전시원명·설명, 대표 구역(지점)명, 파노라마·VR 이미지 링크(imgUrl)와 촬영 연도 등을 담는 전국 범위의 비공간 목록형 API입니다. 직접 가지 않고 특정 수목원 전시원의 현장 모습을 VR 이미지로 보여 주는 온라인 관람 서비스나 가상 전시 콘텐츠를 만들려는 개발자가 '이 수목원에 어떤 전시원이 있고 어떤 VR 화상이 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수목원명(arbrtNm)·전시원명 같은 이름 매핑이나 같은 기관의 수목원 정보 데이터와의 이름 대조로만 이어 쓴다.
limits: 표준 시설코드나 좌표가 없어 위치 기반 분석이나 다른 기관 시설 데이터와의 키 결합은 할 수 없고 이름 매칭에 의존해야 합니다. 개발계정은 일 10,000회 호출 제한이 있으며 serviceKey를 쿼리로 넘겨야 합니다.
