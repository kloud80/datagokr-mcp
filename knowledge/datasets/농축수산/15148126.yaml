description_portal: 축산물품질평가원에서 제공되고 있는 시도별 소의 출생두수 정보는 축산유통 통계누리에서 제공되고 있는 자료입니다. 축산물이력제를 기반으로 데이터가 집계되고 있고, 전국 및 시군구별(부산을 포함하여 16개 시군구) 로  소(한우, 젖소, 육우) 의 출생두수가 집계되고 있습니다.  또한 암, 수로 조회가능하며 월별로 조회가 가능하고 품종별로 구분되어 있어 이용자가 데이터를 요약할수 있고 다양한 방식으로 다운받아 활용할수 있습니다.  출생두수의 변화추이를 관찰할 수 있어 축산물 수급예측에 중요한 자료로 활용됩니다.
