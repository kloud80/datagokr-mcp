description_portal: 대전광역시 소 브루셀라 검진현황 자료는 12개월 이상 소를 대상으로 거래 또는 도축장 출하 시 실시된 브루셀라병 검진 실적을 체계적으로 기록한 자료입니다. 이 자료는 각 연도별, 월별로 검진 대상 두수, 양성 및 음성 판정 두수, 검진장소, 검진일자 등 세부 항목을 포함하고 있어 지역 내 브루셀라병 발생 동향과 감염 예방 관리 현황을 명확하게 파악할 수 있습니다. 브루셀라병은 소에서 유산과 불임을 유발해 축산농가에 경제적 피해를 주며, 인수공통전염병 특성상 사람에게도 감염 위험이 있어 공중보건 차원에서의 관리가 매우 중요합니다. 이 자료는 가축전염병의 조기 발견과 확산 방지, 방역 정책 수립, 축산물 안전성 확보, 농가 지원 정책 마련 등 다양한 분야에서 활용될 수 있습니다.
legal_basis_portal: 농림축산식품부에서 실시하는 가축방역 사업 실시요령 및 결핵병 및 브루셀라병 방역실시요령
