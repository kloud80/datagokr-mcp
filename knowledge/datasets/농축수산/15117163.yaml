description_portal: '- 우리기관은 자연재해대책법 제29조의2(가뭄 방재를 위한 예보 및 경보), 같은 법 시행령 제23조(가뭄 방재를 위한 예보 및 경보 체계의 운영)에 근거하여 농림축산식품부와 함께 농업가뭄 분야에 대한 예보 및 경보 데이터를 제공하고 있습니다.- 본 예경보는 행정안전부, 기후에너지환경부(생공용수가뭄), 기상청(기상가뭄) 등 관계부처와 함께 부처 합동 가뭄 예경보 보도자료로 제공됩니다.- 해당 데이터는 농업가뭄 분야의 자료만을 제공합니다.- 컬럼설명(1) 기준일자 : 예경보 발표 기준시점(2) 가뭄현황 : 기준시점 당시의 가뭄 현황이며 가뭄 우려단계에 따라 0(정상),1(관심),2(주의),3(경계),4(심각)으로 구분됩니다.(3) 가뭄전망 : 가뭄전망1, 가뭄전망2, 가뭄전망3은 각각 향후 1개월, 2개월, 3개월의 가뭄단계 전망치를 나타내며, 가뭄현황 표출방식과 같습니다.'
