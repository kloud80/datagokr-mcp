description_portal: 데이터는 경기도 화성시 관내 포도 스마트팜 농가에서 2019년 4월부터 6월까지 측정한 개화기 지온 정보를 수집한 자료이다. 해당 데이터는 생육 초기단계인 개화기의 지온 변화를 중심으로 구성되어 있으며, 스마트팜에 설치된 센서를 통해 자동 수집된 결과값이다. 농가별로 측정 지점이 상이하며, 일자별 평균 지온 정보가 포함되어 있다. 본 자료는 작물의 생장에 영향을 미치는 지온의 변화 경향을 분석하고, 스마트농업 정책 수립 및 현장 컨설팅 자료로 활용될 수 있다. 아울러 지역별 생육환경 특성을 파악하고, 기상 변화에 따른 재배관리 전략 수립에도 참고가 가능하다. 해당 데이터는 단일 수집 건으로, 특정 기간의 농업 환경 정보를 담고 있으며 향후 연구·분석을 위한 기초자료로서의 가치가 있다.
