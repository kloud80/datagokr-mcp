description_portal: 농림축산식품부 지정 국가중요농업유산 소개 자료로 입니다. 국가중요농업유산명, 부제목, 지정번호, 지정년도, 특징 등을 담고 있습니다.국가중요농업유산은 유형·무형의 농업자원 중에서 보전할 가치가 있는 농업자원을 지정하는 제도입니다.- 국가중요농업유산이란?▶ 지역주민이 환경에 적응하면서 오랫동안 형성·진화해 온 것으로 보전·유지 및 전승할 만한 가치가 있는 전통적 농업활동 시스템과 이의 결과로서 나타난 농촌의 경관 등 모든 산물우리나라는 2012년에 국가중요농업유산 제도를 도입하였다. 도입 당시의 명칭은 국가중요농어업유산이었다. 그러다 2013년 3월, 농림축산식품부와 해양수산부가 분리되면서 농업유산과 어업유산으로 나뉘어 운영되고 있다. 이후 2015년에 ｢농어업인의 삶의 질 향상 및 농어촌지역 개발 촉진에 관한 특별법｣이 개정되면서 제30조의 2에 ‘국가중요농업유산의 보전ㆍ활용’이 추가되어 법률적 근거가 마련되었으며, 이 법의 시행규칙에 국가중요농업유산의 지정대상, 지정기준, 신청 및 지정 절차, 보전ㆍ활용 계획 등에 대해 규정하고 있다. 이를 근거로 “농업인이 해당 지역의 환경ㆍ사회ㆍ풍습 등에 적응하면서 오랫동안 형성시켜 온 유형ㆍ무형의 농업자원 중에서 보전할 가치가 있는 농업자원”을 국가중요농업유산으로 지정할 수 있다.
