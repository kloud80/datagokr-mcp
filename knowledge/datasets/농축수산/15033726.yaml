description_portal: 본 데이터는 경상북도 칠곡군 관내 산지에서 허가된 토석채취허가 공공데이터 파일 자료입니다. 이는 산지전용허가지(허가지 주소)에서 반출되는 부수적 토석채취허가 현황에 대한 다양한 정보를 제공하고 있습니다. 소재지, 지번, 용도,면적, 연간생산량, 사무실 연락처, 수허가자 상호, 허가 기간,  데이터기준일 등의 정보를 제공합니다. 토석채취 허가는 흙과 돌(토석)을 자연에세 파내어 사용할 수 있도록 해당 지방자치단체에 공식적으로 허가는 받는 사항으로, 무분별한 채굴 방지, 산림 등 훼손 방지 등을 위하여 허가를 득한 후 채취가 가능합니다.
