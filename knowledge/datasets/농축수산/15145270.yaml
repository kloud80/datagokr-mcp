summary_user: 농업경영체가 등록한 임지(산지 등) 필지별로 공부·실제 지목과 면적, 임차 기간, 휴경·폐경 면적, 재배 품목과 노지·시설 재배면적을 담은 건별 원천 파일로, 범위는 전국이며 필지·건물 단위다. 농업 분석가가 경영체 하나가 어떤 임지에서 어떤 품목을 노지와 시설 중 어디서 얼마나 재배하는지 확인할 때 쓴다. 경영체순번(agri_entity_sn)과 농지일련번호(farmland_sn)를 키로 같은 기관의 농업경영체·농지 필지 데이터와 잇는다.
description_portal: 농림축산식품부에서는 임지별재배품목정보를 제공합니다.본 정보 제공 데이터는 경영체순번, 농지일련번호, 대장구분, 공동경작여부, 경영형태, 토지대장검증여부, 공부지목, 실제지목, 공부농지면적, 실제농지면적, 미이용휴경면적, 미이용폐경면적, 가지번여부, 진흥여부, 농지삭제사유, 임차시작일, 임차종료일, 산여부, 공유지분명수, 쌀이모작여부, 농지삭제일시, 등록기관구분, 등록구분, 최초등록일자, 경영방식구분, 품목일련번호, 품목, 노지재배면적, 시설재배면적, 시설종류, 시설일련번호등의 정보를 포함하고 있습니다.경영체일련번호는 경영체정보보호를 목적으로 테이블내에서 순차채번을 적용하였으며, 동일 경영체인경우 같은 경영체일련번호로 식별이 가능합니다.
