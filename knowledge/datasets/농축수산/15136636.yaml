description_portal: 본 데이터는 농림수산식품교육문화정보원이 운영하는 ‘농업ON’ 플랫폼의 메인 콘텐츠 영역과 관련된 정보이다. 사용자에게 주요 농업 정보를 효과적으로 전달하고 서비스 접근성을 높이기 위한 목적으로 구성된 콘텐츠로, 온라인 행정 서비스의 품질 향상과 정보 전달력 강화를 목표로 한다. 이용자의 관심 주제에 따라 구성되는 콘텐츠 흐름을 체계적으로 관리함으로써, 정보 노출의 전략성과 사용자 중심의 정보 설계를 동시에 실현하고자 한다. 본 자료는 농업정보 서비스의 효율성을 높이고, 대국민 홍보, 교육, 정책 안내 등 다양한 목적의 공공 콘텐츠 운영을 위한 기반 자료로 활용된다. 디지털 행정 환경에서 정보 서비스 품질과 공공성과의 균형을 고려한 자료이다.
