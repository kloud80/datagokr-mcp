summary_user: 숲길과 관련된 역사문화 자원을 소장품 한 건 단위로 담으며, 소장품명·유형·소장구분·수량·국적·시대·재질(상위·하위)·수집일자와 수집사유·특이사항을 제공하고 범위는 전국·비공간이다. 연구자나 정책 담당자가 '숲길 관련 소장 문화유산은 어느 시대·어떤 재질이 많은가'처럼 유형별·시대별 분포를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소장품명·시대명 같은 이름 매핑이나 같은 기관(한국등산트레킹지원센터)의 숲길 데이터와 이름으로만 이어 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2023년 11월 24일에 등록하여 제공하는 오픈API 서비스로, 숲길에 관련된 역사문화 자원 정보를 조회할 수 있는 서비스입니다.API를 통해 소장품식별자, 소장품명, 소장구분명, 소장품수량, 국적명, 시대명, 재질상위명, 재질하위명, 수집일자, 수집사유명, 소장품유형명, 특이사항내용, 데이터추출일시 등의 속성을 호출할 수 있으며, 이를 활용해 숲길 내 문화유산의 유형별·시대별 분포를 분석하거나, 지역별 문화자원의 특성과 보존 현황을 파악하는 등 다양한 연구와 정책 수립에 사용할 수 있습니다.
