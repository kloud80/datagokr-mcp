description_portal: 축산농장정보는 축산법에 의거 가축사육업에 등록한 축산농장에 대한 데이터이며 축종, 농가주소, 등록허가 자료가 있으니 참고하시기 바랍니다.축산농장정보에 포함하는 축산업이란 종축업, 부화업, 정액등 처리업 및 가축사육업을 말하며종축업이란 종축을 사육하고 그 종축에서 번식용 가축 또는 씨알을 판매하는 업을 말합니다.그리고 부화업이란 닭, 오리 또는 메추리의 알을 인공 부화 시설로 부화시켜 판매하는 업을 말합니다정액등처리업이란 종축에서 정액, 난자 또는 수정란을 채취 처리하여 판매하는 업을 말하며가축사육업은 판매할 목적으로 가축을 사육하거나 젖, 알, 꿀을 생산하는 업을 말합니다.이에 따라 축산법에서 등록을 하는 축산농장에 대하여는 자료가 관리되나 무허가로 운영중인 축산농장 정보는 별도로 관리되는 것이 없음에 따라 제외됨을 알려드립니다.통영시 가축사육 현황 자료는 통영시 홈페이지 통계연보에 수록되어 있으니 참고하시기 바랍니다.
