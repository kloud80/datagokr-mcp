description_portal: '전국 고정조사구역 내 산림 대기오염 모니터링 및 피해 조사 결과를 집대성한 자료입니다. 이 데이터는 1991년~2007년까지  강우 기간 동안의 대기오염물질 침적 상태와 이에 따른 임분(산림 군집)의 환경 변화, 수목 피해 정도 등을 과학적으로 분석한 결과를 포함하고 있습니다. 주요 조사 항목에는 산성강우, 대기 중 오염물질 농도, 토양 산성화, 수목 생리 이상, 임분 구조 변화 등이 있으며, 이는 기후변화 대응, 산림 건강성 평가, 오염 원인 분석, 생태계 회복 전략 수립에 활용됩니다.(조사항목 : 채수량,총강우량,강우산도(PH),수소이온농도(H),수소이온총량(H),전기전도도,염소이온(Cl),질산염이온(NO3),황산이온(SO4),나트륨(Na),암모늄이온(NH4),칼륨(K),마그네슘(Mg),칼슘(Ca),설치기간(일수),이산화황(ppm),이산화질소(ppm),이산화황(ppb),이산화질소(ppb))'
