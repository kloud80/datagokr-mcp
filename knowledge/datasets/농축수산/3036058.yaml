description_portal: '- 전라남도 시군의 도축장 현황에 관한 데이터를 조회하실 수 있습니다.- 도축장명, 가축 종류, 주소, HACCP여부 등에 대한 정보를 제공합니다.- 전라남도는 도축장에 대한 엄격한 위생 관리와 안전성 확보를 위해 도축장 수를 제한하고 있으며, 이를 통해 소비자에게 안전한 축산물을 공급하고 있습니다.- 전라남도 동물위생시험소는 도축장에 대한 위생 상태 점검과 도체의 식용 여부 판단을 위한 도축 검사를 실시하고 있습니다. 검사 항목으로는 생체 검사, 해체 검사, 실험실 검사 등이 있으며, 검사 결과 이상이 없을 경우 도축된 고기에 합격 표시를 부여하고 도축검사증명서를 발급합니다. 또한, 도축검사 수수료는 가축의 종류에 따라 다르게 적용됩니다.'
