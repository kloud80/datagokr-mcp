summary_user: 도매시장에서 거래되는 농산물의 분류 체계를 부류·품목·품종 3단계 코드와 이름(LARGE·MID·SMALL과 각 명칭)으로 담은 전국 단위 비공간 코드표입니다. 도매 경락가나 반입물량 데이터를 받은 분석가가 '이 품목코드가 어떤 작물·품종인가'를 확인하거나 품목명을 코드로 바꿀 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관(농림축산식품부) 도매시장 데이터의 품목코드나 품목명 매칭으로만 연결하며, KAMIS·HS·KOSIS 코드와는 별도 매핑이 필요합니다.
description_portal: 농림축산식품부는 도매시장에서 거래되는 농산물의 품목 정보를 제공하는 OPEN‑API 서비스를 운영합니다. 본 데이터는 부류코드, 품목코드, 품종코드, 부류명, 품목명, 품종명 등의 항목으로 구성되어 있으며, 이를 통해 농산물의 분류 체계를 표준화하여 파악할 수 있습니다. 품목 정보는 농산물 유통의 효율성을 높이고, 거래 실적 분석 및 정책 수립에 필요한 기초 자료로 활용됩니다. 또한, 표준화된 품목 코드를 통해 데이터의 일관성과 정확성을 높이며, 농업 통계 수집 및 유통망 구조 파악에 기여합니다. 해당 데이터는 농산물 유통의 투명성과 효율성 향상을 위한 핵심 자료로 기능합니다.
