description_portal: 이 데이터는 대구시 도시농업포털에서 제공하는 체험 농장의 목록입니다. 각 농장은 위치와 함께 제공되며, 체험 활동을 원하는 시민들이 해당 농장에서 참여할 수 있는 다양한 체험 프로그램을 안내합니다. 예를 들어, 사과체험농장, 딸기농장, 편백숲체험농장 등 여러 농장이 포함되어 있으며, 이들 농장은 대구시의 도시농업 활성화와 시민 참여를 촉진하는 역할을 합니다. 데이터는 각 농장의 주소와 명칭을 포함하고 있어, 시민들이 지역 농업 체험에 참여할 수 있도록 정보 제공 및 접근성을 높이는 데 활용됩니다.
