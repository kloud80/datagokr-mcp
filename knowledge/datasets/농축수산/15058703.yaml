summary_user: 경기도 안 낚시터를 한 곳씩 담은 등록·허가 현황으로, 집계년도·시군·등록/허가 구분·낚시터명·면적(ha)·이용료·도로명/지번 주소·위경도를 담는다. 낚시객이나 레저·관광 분석가가 "우리 시군에 허가된 낚시터는 어디이고 이용료는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)로 같은 기관의 시군 단위 자료와 맞추고, 주소·위경도로 지도나 다른 위치 자료와 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 낚시터의 등록 및 허가 현황을 정리한 자료로, 각 낚시터의 명칭, 면적, 위치, 등록 구분, 이용 요금 등의 정보를 포함하고 있습니다. 주요 항목은 집계년도, 시군명, 등록구분명(등록/허가), 낚시터명, 낚시터면적(ha), 이용료, 위치 주소(도로명/지번), 우편번호, 위도·경도(WGS84) 좌표 등이며, 이는 낚시터의 지리적 분포 및 행정 관리 상태를 확인하는 데 활용됩니다. 본 데이터는 낚시 활동과 관련된 지역관광 정책 수립, 수질·환경 관리, 레저산업 육성, 수변지역 개발계획 등에 유용하게 사용될 수 있으며, 위도·경도 정보는 지도 기반의 시각화나 GIS 분석에 활용 가능합니다.
