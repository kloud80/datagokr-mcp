description_portal: 손익계산서는 농지관리기금의 한 해 동안의 재정 운용 성과를 수익과 비용 측면에서 정리한 결산 원장으로, 기금운용활동에서 발생한 이자수익, 투자수익 등 수입과 사업 진행,운영비 등 지출을 비교해 순이익 또는 손실을 산출합니다.수익은 농지 처분 및 임대 수입, 융자이자, 정부 및 다른 기금으로부터의 출연금 등으로 구성됩니다.비용은 기금의 목적사업, 사업 운영비 등으로 구성됩니다.손익계산서를 통해 기금 운용의 경제성과 재정 상태를 파악하고 향후 운용 계획 수립에 참고 지표로 활용할 수 있습니다.
