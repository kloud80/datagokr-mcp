description_portal: 농촌진흥청 농촌지도사업 시행지침에 따라 벼 작물의 생육조사를 주산단지 중심으로 선정하고 주기적으로 농작물의 생육상황을 조사하여 병해충 방제, 시비 등 기술정보의 확신 및 기상재해에 대비한 기술지도 자료로 활용하고 있습니다. 관련한 벼 생육상황을 조사한 결과를 제공합니다. 벼의 생육조사 기간은 6월부터 9월이며, 벼의 생육시기에 따라 조사항목이 달라집니다. 조사 지점은 산간지, 중간지, 평야지의 대표적인 들에 설치하며  지대별 설치 개소수는 지역 내 벼 재배면적 비율에 따라 적정한 개소수를 산정하여 운영합니다.
