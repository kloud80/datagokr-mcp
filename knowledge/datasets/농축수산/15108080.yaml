summary_user: 한국등산트레킹지원센터가 등록한 국가숲길 6곳(DMZ펀치볼둘레길, 내포문화숲길, 대관령숲길, 백두대간트레일, 울진금강소나무숲길, 지리산둘레길)의 코스별 경로를 GPX 트랙·트랙포인트 파일로, 숲길별 코스 범례를 엑셀로 담은 zip 파일(약 1.1MB)이다. 등산·트레킹 앱 개발자나 GIS 분석가가 '지리산둘레길 각 코스의 경로와 시작·종료 지점, 거리는 어떻게 되나'를 지도에 그리거나 분석할 때 쓴다. 범례의 국가숲길명·코스명·코스식별자(CRSE_ID)로 GPX 파일과 코스를 맞추지만, 전역 조인 키는 없어 다른 데이터와는 숲길·코스 이름 매핑이나 좌표 기반 공간 결합으로 잇는다.
