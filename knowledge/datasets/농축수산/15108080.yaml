description_portal: 이 데이터는 한국등산·트레킹지원센터에서 제공한 국가숲길의 코스정보(트랙 및 트랙포인트)를 GPX 파일 포맷 형태로 숲길별 코스 범례를 엑셀 파일로 제공하고 있으며, 2023년 8월 25일 기준으로 등록된 자료입니다.이 데이터에 포함된 국가숲길은 총 6개로 DMZ펀치볼둘레길, 내포문화숲길, 대관령숲길, 백두대간트레일, 울진금강소나무숲길, 지리산둘레길입니다. 각 숲길 경로 GPX 파일에는 각 코스의 시작점 및 종료점 좌표, 전체 거리 정보가 포함되어 있고, 숲길별 코스 범례를 제공하여 숲길 경로 파악, 트레킹 코스 시각화, 지리정보시스템(GIS) 분석, 모바일 등산 앱 활용 등 다양한 목적으로 활용할 수 있습니다.
