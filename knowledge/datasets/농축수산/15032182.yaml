description_portal: '이 자료는 국립산림품종관리센터에서 조성·관리하는 채종원의 현황을 정리한 것으로, 각 채종원이 소속된 담당 사업소(지역)와 조성 연도, 조성 면적, 수종이름  등 세부 정보를 포함하고 있습니다. 이를 통해 채종원의 조성 규모와 시기적 분포, 수종별 면적 확대 추이를 한눈에 확인할 수 있으며, 향후 종자 공급 계획이나 산림자원 관리 정책을 수립하는 데 기초 자료로 활용될 수 있습니다.*채종원 : 채종원(seed orchard)은 유전적으로 우수한 나무들의 집단으로 열등한 유전인자를 지닌 외부 화분오염(pollen contamination)을 방지하며, 대량의 우수한 종자를 쉽게 생산하고 채취할 수 있도록 운영ㆍ관리되는 종자 공급원이다.'
