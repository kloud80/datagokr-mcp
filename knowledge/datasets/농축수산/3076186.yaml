description_portal: '광주광역시 소재하는 가축 통계조사를 제공합니다가축통계조사는 매년 농업통계조사 규칙 제3조에 근거해 축산법상 주요가축(한우, 젓소, 돼지, 닭, 오리)및 증감내역,기타가축 16종(말, 염소, 사슴, 꿀벌 등)을 포함한 총 21종을 제공합니다.1. 농업통계조사 규칙 제3조에 근거해 축산법상가축통계조사결과를 주요데이터 별로 정리하여 제공합니다.2. 주요가축(한육우, 젓소, 돼지, 닭(유계,산란계))에 대하여 사육마리수 규모별 농가호수와 연령별 성별 마리수를 제공합니다.3. 기타가축 16종(말, 염소, 사슴, 꿀벌 등) 등에 대하여 사육규모별 가구수, 연령별 성별 마리수 등을 제공합니다.- 목적 : 가축의 사육규모별 가구(농장)수와 연령별․성별 마릿수를 파악하여 축산정책수립과 축산부문 연구를 위한 기초자료로 활용- 조사체계․ 한우, 육우, 젖소 : 축산물품질평가원 ↔ 통계청․ 돼지 : 조사대상 농장 → 지방통계청(사무소) → 통계청․ 닭,오리 : 조사대상 가구 → 지방통계청(사무소) → 통계청- 조사업무흐름․ 매분기(3,6,9,12월) 1~15일 조사 실시 및 조사표 내용 검토(6월 조사는 18일까지)․ 내용 검토 이후 조사월 말일까지 종합내검 및 보완조사 실시․ 종합내검 및 보완조사 이후 공표일까지 집계 및 분석'
