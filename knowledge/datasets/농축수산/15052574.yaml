description_portal: TAC(Total Allowable Catch)의 사전적인 의미는 어업자원의 지속적 이용을 목적으로 어획량을 정하여 관리하는 제도로서, 이 데이터는 어업자원의 지속적 이용을 목적으로 어종별로 어획량을 승인 관리하는 현황 정보입니다.본 데이터의 주요 내용은 어종명, 총허용어획량, 신청 어선척수, 신청량, 허가 어선척수, 허가량 정보로, 표와 차트(막대, 꺾은선) 형태로 확인할 수 있습니다.예를 들어, 어떤 어종이 할당량 대비 얼마나 신청했고, 얼마나 허가되었는지 분석함으로써 TAC 제도의 집행 현황, 어획 압력, 허가 관행 등을 파악할 수 있다.년도와 어종, 관할기관(지역)을 선택하여 조회할 수 있으며, 데이터를 원하실 경우에는 파일 다운로드 후 데이터를 확인해주시기 바랍니다.
