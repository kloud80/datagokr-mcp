description_portal: 이 데이터는 충남지역 해양수산 관련 특성평가를 위한 격자 단위의 공간정보 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부 충남특성평가격자별 공간정보일련번호, 격자아이디, 레이어명 등으로 구성되어 있습니다.  본 데이터는 각 격자별 해양수산 자원의 특성 분포 파악, 충남 해역 내 해양공간 활용 계획 수립, 어업 및 해양개발 관련 정책의 기초자료로 활용될 수 있습니다. 또한 공간정보 기반의 연구, 해양환경 관리, 해량자원 조사 분석 등의 업무 수행에도 사용할 수 있습니다.
