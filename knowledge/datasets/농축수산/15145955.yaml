description_portal: '수치조류도 기반 조화상수 정보(해양수산부 국립해양조사원)이 데이터는 국립해양조사원에서 제공하는 수치조류도 기반의 조화상수 정보를 포함하고 있습니다. 조화상수는 조류의 주기를 구성하는 기본 요소로, 각 위치에서의 조류 특성을 수치적으로 표현할 수 있도록 도와줍니다. 제공되는 정보에는 위치별 조화상수의 진폭(Amplitude) 및 지각(Phase lag) 값이 포함되어 있으며, 다양한 해양활동 및 연구에 활용될 수 있습니다.조화상수(Harmonic constant)는 조석을 주기적으로 일으키는 각 분조(조석성분)의 특성을 수치로 나나탠 값입니다. 조석은 태양과 달의 인력, 지구의 자전 및 공전 운동에 의해 다양한 주기 성분(분조)으로 나눌 수 있고, 이 각각의 성문을 조화분석 기법으로 분석합니다.아래는 조석을 일으키는 각 분조 리스트 입니다.각 분조들은 각각 주기와 크기, 위상이 다르며, 합쳐져서 우리가관측하는 실제 조석곡선을 만듭니다.j1_진폭: j1 분조의 진폭j1_지각: j1 분조의 지각k1_진폭: k1 분조의 진폭k1_지각: k1 분조의 지각k2_진폭: k2 분조의 진폭k2_지각: k2 분조의 지각l2_진폭: l2 분조의 진폭l2_지각: l2 분조의 지각m1_진폭: m1 분조의 진폭m1_지각: m1 분조의 지각m2_진폭: m2 분조의 진폭m2_지각: m2 분조의 지각mu2_진폭 : mu2 분조의 진폭mu2_지각 : mu2 분조의 지각n2_진폭: n2 분조의 진폭n2_지각: n2 분조의 지각nu2_진폭:nu2 분조의 진폭nu2_지각:nu2 분조의 지각o1_진폭: o1 분조의 진폭o1_지각: o1 분조의 지각oo1_진폭:oo1 분조의 진폭oo1_지각:oo1 분조의 지각p1_진폭: p1 분조의 진폭p1_지각: p1 분조의 지각q1_진폭: q1 분조의 진폭q1_지각: q1 분조의 지각s2_진폭: s2 분조의 진폭s2_지각: s2 분조의 지각'
