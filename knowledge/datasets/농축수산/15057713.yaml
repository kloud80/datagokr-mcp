summary_user: 영농여건불리농지로 지정된 농지를 시도·시군구 행정구역 단위로 담은 전국 범위의 공간 데이터를 API로 제공한다. 농지 거래나 전용을 검토하는 사람이 어떤 농지가 농업진흥지역 밖의 경사지 등 영농여건이 불리한 농지에 해당하는지 확인할 때 쓴다. 시도·시군구 코드(sido_cd, sigungu_cd)와 본번·부번(bon_bun, bu_bun) 필드가 있어 같은 기관 코드나 지번 정보와 이름·코드 매핑으로 이을 수 있지만, 전역 조인 키는 확인되지 않았다.
description_portal: 영농여건불리농지는 다음 요건을 모두 충족하는 농지- 농업진흥지역 밖 농지 중에서 최상단부부터 최하단부까지의 평균경사율이 15% 이상인 농지- 시·군의 읍·면지역 내에 있는 농지- 평균경사율이 15% 이상인 농지를 포함해 해당지역의 집단화된 농지의 규모가 2ha 미만인 농지- 농업용수·농로 등 농업생산기반의 정비 정도와 농기계의 이용 및 접근 가능성, 통상적인 영농 관행을 참작할 때, 영농여건이 불리하고 생산성이 낮다고 인정되는 농지
