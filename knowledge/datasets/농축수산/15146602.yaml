summary_user: 전국 조위관측소 60곳의 고유번호, 유형, 이름(한글·영문), 위도·경도를 관측소 한 곳당 한 행으로 담은 파일 데이터이다. 연안 수위 관측 지점이 어디에 있는지 찾으려는 해양 분석가나 예보·해상 안전 담당자가 쓴다. 위도·경도(coord)로 다른 위치 기반 데이터와 맞춰 쓰며, 관측소코드는 바다누리 자체 키라서 같은 기관 조석·수위 관측 자료와 이어 쓸 때 참고한다.
description_portal: 이 데이터는 국립해양조사원에서 관리하는 조위관측소 운영 현황 데이터입니다. 데이터에는 각 조위관측소의 고유번호, 위치 좌표 정보 등이 포함되어 있습니다.조위관측소는 해양 및 연안지역의 수위 변화를 실시간으로 관측하여, 해양 환경 모니터링, 해양재난 예방, 항로 안전 확보, 그리고 수치모델의 설정 및 검증에 중요한 역할을 합니다. 또한, 이 데이터는 해양 연구, 해양 예보, 해상 교통 관리, 해상 풍력 발전 등 다양한 분야에서 활용되어 해양 관련 정책 및 산업 발전에 기여하고 있습니다.본 데이터는 조위관측소의 운영 현황과 위치 정보를 정확하게 제공함으로써, 해양 환경 분석 등 기초자료로 활용될 수 있습니다.
