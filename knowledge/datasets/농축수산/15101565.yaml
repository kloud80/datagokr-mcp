summary_user: 농업 분야의 어려운 용어를 순우리말로 바꾼 용어 목록으로, 한 행에 분류(CL_NM), 기존 용어, 원어, 쉬운 우리말 용어를 담은 사전형 자료이며 포털 설명상 109개 용어를 전국 단위·비공간으로 다룬다. 귀농·귀촌인이나 농업 교육·홍보 담당자가 '이 한자어·외래어 농업용어를 쉬운 말로 어떻게 바꿔 쓰나'를 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키나 코드표가 없어, 다른 농업 자료와는 기존 용어명을 글자 그대로 맞추는 방식으로만 연결한다.
description_portal: 해당 데이터는 한글에 대한 자부심을 높이고, 도시농업인, 귀농·귀촌인 등 누구나 쉽게 활용할 수 있도록 농업분야에서 사용되는 어려운 용어를 우리말로 순화한 109개의 순우리말 농업용어 목록 정보입니다. 이를 통해 농업 관련 의사소통의 편의성을 높이고, 농업 교육 및 홍보, 정책 수립과 연구 분석 등 다양한 분야에서 활용할 수 있습니다. 또한 지역별 특성과 변화 추이를 반영하여 농가 지원, 산업 경쟁력 강화, 소비자 신뢰 제고 등 실무적 적용에도 활용될 수 있으며, 우리말 사용 문화 확산에도 기여할 수 있는 기초 자료로 활용됩니다.
