summary_user: 농수축산물 시장 전문가가 작성한 시황 글을 건별로 담으며, 분석일자(VIEWDATE), 대·중분류 품목명과 코드, 가격 의견, 물량 의견, 작성 주체, 본문 등을 포함한다. 유통업자나 분석가가 특정 품목의 향후 가격 전망과 공급·수요 동향에 대한 전문가 의견을 확인할 때 쓴다. 전역 조인 키가 없어 다른 가격 데이터와는 품목명이나 같은 기관의 품목 분류코드(LCODE·MCODE)를 매핑해 이어 쓴다.
description_portal: 농림수산식품교육문화정보원이 제공하는 농수축산물에 대한 유통단계별(산지, 도매, 소매) 품목별 가격 정보는 동일 기준으로 재가공하여 제공되는 유통 통합 정보입니다. 이 데이터는 농수축산물의 가격 동향을 파악하는 데 큰 도움을 주며, 이를 통해 소비자는 신선한 농수축산물을 합리적인 가격에 구매할 수 있는 정보를 얻을 수 있습니다. 또한, 유통업체와 생산자들은 가격 정보를 분석하여 시장의 수요와 공급을 예측하고, 이를 바탕으로 경영 전략을 수립하는 데 활용할 수 있습니다. API는 농수축산물 시장 전문가가 작성한 시황정보를 제공하며, 이는 시황분석일자, 품목정보, 시장동향 분석, 가격전망, 공급상황, 수요동향, 특이사항 등의 정보를 포함하여 전문가의 시장 분석 의견과 예측 정보를 제공합니다. 이를 통해 사용자는 농수축산물 시장의 정성적 분석정보를 종합적으로 확보할 수 있습니다.
