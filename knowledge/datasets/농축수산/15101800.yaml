summary_user: 전국 잠업 농가를 누에사육 규모별로 나눠 농가수를 집계한 표로, 기능성 양잠 규모현황 등 양잠형태별 현황을 전국 단위(비공간)로 담은 외부 파일이다. 잠업 지원사업 담당자나 연구자가 '기능성 양잠을 하는 농가는 어느 사육 규모에 몰려 있는가'처럼 규모별 산업 구조를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항목 이름 매핑이나 같은 기관(농림축산식품부) 통계와 맞춰서만 이어 쓴다.
description_portal: 해당 데이터는 누에사육 규모별 농가수에 관한 데이터로, 전국의 잠업에 종사하는 모든 잠업가구의 양잠형태별 생산현황과 누에 생산, 판매 실적을 조회할 수 있는 서비스입니다. 이를 통해 생산량과 판매 실적 데이터를 연계하여 분석함으로써 지역별·규모별 산업 현황을 체계적으로 이해할 수 있어, 잠업 산업의 정책 방향 설정과 경쟁력 강화 전략 마련에 중요한 자료로 활용됩니다. 정책 담당자에게는 잠업 지원사업 설계, 시설 투자 계획, 기술 보급 및 교육 프로그램 수립에 기초 자료가 되고, 연구자에게는 양잠 산업의 현황과 발전 가능성을 실증적으로 분석할 수 있는 데이터로 의미가 있습니다. 나아가 본 데이터는 국내 잠업 산업의 지속 가능한 발전, 농가 소득 증대, 지역 특화 산업 육성에 기여할 수 있는 핵심 자료라 할 수 있습니다.
