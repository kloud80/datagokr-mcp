summary_user: 전라남도 함평군에 등록된 내수면(하천·저수지 등 내륙 수역) 양식장의 이름과 주소를 양식장 한 곳당 한 행으로 담은 시군구 단위 파일(CSV 약 5.6KB)이다. 함평군 안 어디에 내수면 양식장이 있는지, 특정 지역 주변의 양식장 분포를 확인하려는 주민·행정 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 양식장명이나 주소 문자열을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 전라남도 함평군은 수산자원 관리와 친환경 양식 산업 육성을 위해 관내 내수면 양식장에 대한 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군에 등록된 내수면(하천, 저수지 등 내륙 수역) 양식장에 대한 기본 현황을 포함하고 있으며, 양식장명과 상세주소 항목으로 구성되어 있습니다. 해당 데이터는 양식업 분포 현황 분석, 수산자원 보호구역 관리, 양식장 기반 수질·환경 모니터링 체계 구축 등에 활용될 수 있으며, 수산행정 정책 수립, 지역 특산 어종 관리, 민원 대응 및 방역 계획 수립 등에서도 실질적인 기초자료로 활용됩니다. 또한, 친환경 양식기술 도입, 어업인 지원사업 설계, 내수면 수산업 경쟁력 강화를 위한 중요한 공공정보입니다.
