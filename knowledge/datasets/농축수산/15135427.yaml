description_portal: 이 자료는 채종원에서 생산된 종자가 어떤 방식으로 공급되고 있는지를 정리한 현황표입니다. 우선 종자를 크게 활엽수와 침엽수로 나누어 관리하고 있으며, 각각의 구분 아래에서는 구체적인 수종 이름이 일일이 기재되어 있습니다. 또한 단순히 어떤 종자가 있다는 것에서 그치지 않고, 해당 종자를 실제로 공급받는 지자체 지역이 어디인지가 함께 표시됩니다. 이 과정에서 중앙행정기관 차원에서는 산림청 소속 기관의 목록도 함께 포함되어 있어, 국가 차원과 지방 차원의 분배 현황을 동시에 파악할 수 있게 됩니다.아울러 단순한 품목별 기록에 그치지 않고, 각 수종별로 얼마만큼의 종자가 제공되었는지에 대한 제공량도 함께 제시되어 있습니다.
