summary_user: 곡성군 안 경제림 조림지를 읍면·리 단위로 한 줄씩 담은 파일로, 각 조림지의 지목, 지적 면적, 식재면적(헥타르), 조림수종, 조림년도를 기록한다. 곡성군 어느 마을에 어떤 나무를 언제 얼마나 심었는지 확인하려는 산림 분석가나 임업인이 수종별·연도별 조림 실적을 정리하는 데 쓴다. 전역 조인 키는 없어서, 다른 산림 통계나 행정구역 자료와는 시군구명·읍면·리 이름을 맞춰서 연결해야 한다.
limits: 범위는 곡성군 한 시군구뿐이어서 다른 지역과 비교하려면 각 기관 파일을 따로 모아야 한다. 법정동 코드 같은 표준 키가 없어 지명을 문자열로 맞출 때 표기 차이에 주의해야 한다.
