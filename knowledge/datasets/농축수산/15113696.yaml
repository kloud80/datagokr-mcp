description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「낚시 관리 및 육성법」 제27조에 따라 대통령령으로 설정된 인접 시·도간 낚시어선의 공동영업구역 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 공동영업구역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 구역의 사업구역코드, 구역명, 관계법령, 정의, 제/개정일자 및 관련부서 정보 등을 포함하고 있습니다.본 데이터는 낚시어선업을 운영하는 사업자에게 영업구역 확인과 허가·신고 절차 이행, 관계 행정기관의 구역 관리, 정책 시행과 관련 제도 운영 근거 마련 등에 활용될 수 있습니다. 공공기관에서는 규제 준수 여부 검토, 수산자원 관리 정책 수립, 지역별 공동영업구역 현황 파악을 위한 자료로도 사용할 수 있습니다.
