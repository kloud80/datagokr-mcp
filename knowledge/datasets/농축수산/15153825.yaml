description_portal: 경상북도 농업방송 정보는 경상북도 농업방송(GBATV)에서 제공하는 영상 콘텐츠와 카테고리 구조를 체계적으로 정리한 자료로, 영상 분류체계와 개별 영상의 속성을 함께 파악할 수 있도록 구성된 데이터이다. 카테고리 정보에는 프로그램 이름, 등록일, 순번, 노출여부가 포함되어 있어 방송 채널의 콘텐츠 편성 구조와 화면 노출 기준을 확인할 수 있다. 영상 정보에는 영상 등록일, 제목, 자체영상주소, 영상파일명, 실행시간, 조회수가 포함되어 있으며, 각 영상의 주요 내용과 시청 현황을 파악하는 데 활용된다. 실행시간은 분과 초를 합한 재생 길이를 의미하고 조회수는 이용자의 시청 빈도를 나타낸다. 이 자료는 지역 농업 정보 제공, 정책 홍보, 농업 교육 콘텐츠 분석 등 다양한 분야에서 활용 가능한 기초 데이터로서 가치가 높다. 자료관련문의는 053-320-0412로 하시기 바랍니다.
