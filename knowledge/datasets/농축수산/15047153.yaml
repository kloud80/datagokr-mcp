description_portal: '○ 통계개요* 통계명 : 수의사현황* 통계종류 : 서울시 수의사의 직업별 분포 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「수의사법」에 의해 수의사면허를 소지하고 활동중인 수의사* 작성목적 : 우리나라 활동중인 수의사 인력 및 직업별 분포를 파악하여 관련 정책수립의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 동물보호과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 수의사 직업별(행정, 연구, 공수의, 개업수의, 학교 등) 분포 현황○ 용어설명* 수의사 : 수의사법에 의해 수의사면허를 소지하고 활동중인 수의사로, 행정은 기술직렬의수의직, 연구직 등으로 구분. 공수의는 개업수의 중에 공수의로 위촉된 자○ 기 타* 공수의는 개업수의사 중에서 선정되었으며, 중복으로 잡히지 않도록 개업수의사에서는포함하지 않음○ 출 처 : 서울특별시 동물보호과'
