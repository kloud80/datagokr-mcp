summary_user: 국립수산물품질관리원의 수산물 수입검역 통계를 재난안전데이터 공유플랫폼에서 연계해 전국 단위로 제공하며, 수출입 구분·용도·국가·학명·품목·형태별로 건수·중량·금액과 불합격 건수·중량·금액, 집계일자(CMPTN_YMD)를 담는다. 수산물 수입업자나 분석가가 "어느 나라에서 들어온 어떤 품목이 검역에서 얼마나 불합격됐는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 수산물 유통·가격 데이터와는 국가명·품목명·학명 같은 이름 매핑으로만 이어 붙여야 한다.
