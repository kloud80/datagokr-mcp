description_portal: 'ㅇ 시설 채소 농가에서 재배하는 주요 작목에 대해서 참고하고 활용가능한 데이터를 세트로 묶어서 연도별로 정리하여 개방함.ㅇ 개방데이터 : 농촌진흥청 내 "농업재배 전주기DB구축" 사업에서 수집한 시설채소 농가 데이터ㅇ 개방 항목 : 품목별 환경, 생육, 생산(판매), 재배정보  * 환경 : 일사량, 내외부온도, 습도 등  * 생육: 초장, 엽수, 구고, 구직경, 줄기굵기 등  * 농가정보(재배): 전체면적, 품종, 포장면적, 정식일자 등ㅇ 품목 : 토마토, 방울토마토, 딸기, 파프리카, 참외, 오이, 국화 , 가지, 수박ㅇ 참여농가: 2024 작기 237농가, 토마토(28농가),방울토마토(79농가), 딸기(25농가), 파프리카(22농가), 참외(17농가), 오이(38농가), 국화(12농가), 가지(9농가), 수박(7농가)'
