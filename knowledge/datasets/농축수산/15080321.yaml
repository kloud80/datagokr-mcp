description_portal: 2020년 산림과학원에서 조사한 홍릉, 양재, 시화, 고매 지역의 관측소 주변 DEM. 유동인구, 주거인구, 교통량 정보를 제공합.산림과학원이 홍릉, 양재, 시화, 고매 지역의 청정넷 대기질 관측소 주변 환경 특성을 정밀하게 분석하기 위해 구축한 데이터입니다. 본 자료는 유관기관으로부터 수집된 정보를 공간분석 및 환경가치 평가에 적합하도록 가공·변환한 것으로, 디지털표고모델(DEM), 유동인구, 주거인구, 교통량 등의 항목을 포함합니다. 이 데이터는 관측소 주변 지역의 지형 특성, 인구활동 밀도, 교통 흐름 등과 대기질 간의 상관관계 분석에 활용되며, 도시기후, 미세먼지 확산 경로, 대기정화 효과 평가, 정책대상지 선정 등 다양한 목적에 활용됩니다.
