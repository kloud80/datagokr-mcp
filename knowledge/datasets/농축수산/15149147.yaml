summary_user: 전국 무인도서 2,372건을 섬별 한 행씩 담은 건별 원천 파일로, 도서명·시도·시군·지번주소·토지소유자 구분·면적·구역 상태·확정일자·위경도와 공간정보를 포함한다. 해양 행정·정책 담당자나 분석가가 특정 지역에 무인도서가 몇 곳 있고 면적과 소유 구분이 어떤지 확인하는 질문에 쓴다. 지번주소(address)와 위도·경도(coord)가 조인 키라서 주소나 좌표 기반의 다른 해양공간·토지 데이터와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 무인도서에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 무인도서명, 무인도서시도명, 시군명, 무인도서지번주소, 토지소유자구분명, 무인도서면적, 구역상태설명, 무인도확정일자, 위도, 무인도서경도, 조사기관명, 공간정보 데이터로 구성되어 있습니다.본 데이터는 무인도서 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.무인도서란 바다로 둘러싸여 있고 만조 시에도 해수면 위로 드러나는 자연적으로 형성된 땅이며, 사람이 거주하지 않는 곳을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
