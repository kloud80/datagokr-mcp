description_portal: 이 데이터는 해양수산부에서 실시간관측소에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 설치일자, 종료일자, 관측소한글명, 관측소영문명, 관측소지역, 관측소상세주소, 관측그룹명, 관측설명, 표층수심 등의 데이터로 구성되어 있습니다.본 데이터는 실시간관측소정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.실시간관측소정보란 관측소에서 실시간으로 측정하고 있는 기상, 해양, 환경 등의 데이터를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
