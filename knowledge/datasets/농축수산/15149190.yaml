summary_user: 전국 실시간 해양관측소 259곳을 한 곳당 한 행으로 담은 목록 데이터로, 설치일자·관측소명·주소·좌표·관측그룹과 수심층별·기상 항목별 사용 여부를 싣는다. 낚시·레저 이용자나 양식 사업자, 해양 분석가가 내 지역 가까이에 어떤 관측소가 있고 어떤 항목을 재는지 찾는 데 쓴다. 관측소상세주소와 경도·위도(좌표)로 다른 위치 기반 데이터와 이어 쓰며, 바다누리(KHOA) 관측소코드는 설명에 있으나 필드 목록에는 없다.
