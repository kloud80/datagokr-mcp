description_portal: 이 데이터는 해양수산부에서 바닷가현황기본에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 바닷가소재지주소, 바닷가지적도면적, 바닷가연속도면적, 바닷가인접지번주소1, 바닷가인접지번주소2, 바닷가인접지번주소3, 바닷가인접지번주소4, 바닷가점유시설물내용, 바닷가점유자특이사항내용, 바닷가조사일자, 바닷가관리년도 데이터로 구성되어 있습니다.본 데이터는 바닷가현황기본 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바닷가현황이란 바다와 육지가 만나는 지역(바닷가)의 현재 상태나 상황을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
