summary_user: 산림탄소상쇄사업을 한 건씩 등록번호(탄소사업등록고유번호) 단위로 담은 전국 범위 원천 목록으로, 사업 종류·참여 유형·등록 상태, 사업 기간, 총·연간 탄소흡수량, 사업지 면적, 신청·접수·평가 일시가 들어 있다. 기업이나 지자체 담당자, 탄소중립 분석가가 "어떤 종류의 산림탄소상쇄사업이 얼마나 등록돼 있고 예상 흡수량은 얼마인가"를 확인하는 데 쓴다. 다른 데이터와 바로 묶을 전역 조인 키는 없어서 사업자명이나 사업장 우편번호 같은 이름·코드 매핑으로만 산림 통계 등 다른 자료와 이어 쓴다.
description_portal: 산림탄소상쇄사업의 등록 현황을 종합적으로 제공하는 데이터입니다. 주요 항목에는 사업고유등록번호, 사업시작일, 탄소흡수량, 사업내용 등이 포함되어 있으며, 각 사업의 등록 상태, 참여 유형, 면적, 규모, 평가 일정 등 세부 정보가 체계적으로 정리되어 있습니다. 이 자료는 산림을 통한 탄소중립 실현과 온실가스 감축 정책 수립에 활용하실 수 있으며, 연구, 정책 평가, 사업 관리 등 다양한 분야에서 참고하실 수 있습니다. 또한 데이터는 최신 정보로 지속적으로 갱신되어 신뢰성 높은 근거 자료로 활용 가능하며, 행정기관과 연구기관에서 정책 결정과 성과 평가 과정에서도 중요한 역할을 합니다.
