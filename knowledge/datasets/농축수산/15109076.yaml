summary_user: 전국 축산농장 현황을 시도·시군구·읍면동과 축종(소·돼지·닭·오리 등)별로 농장 수(FARM_CO)로 집계한 데이터로, 축산물품질평가원 이력정보와 가축위생방역지원본부 방역정보를 바탕으로 한다. 방역 담당자나 분석가가 "우리 시군구에 돼지 농장이 몇 곳이나 있나"처럼 지역별 축종 사육 농장 분포를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구·읍면동 이름이나 축종명을 맞춰 연결해야 한다.
description_portal: 본 정보는 축산물품질평가원의 소·돼지 축산물이력정보와 가축위생방역지원본부의 닭, 오리 등 기타 축종 방역정보를 기반으로 구축된 전국 축산농장 현황 정보입니다. 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 차이가 있을 수 있으니 데이터 활용 시 유의하시기 바랍니다. 이 데이터는 축산농장의 사육 현황과 방역 상황을 파악하는 데 활용되며, 축산업 정책 수립과 방역 관리, 농업 통계 분석에 중요한 기초 자료로 기능합니다. 농림축산식품부는 해당 정보를 통해 축산업의 투명성과 효율성 향상에 기여하고자 합니다.
