summary_user: 농작물재해보험의 보험금 지급 실적을 품목별로 집계한 전국 단위 통계 파일로, 품목마다 지급건수, 보험금(백만원), 건당 보험금(천원), 손해율(%)을 담는다. 농업정책 분석가나 보험 담당자가 "어떤 작물이 재해 보험금을 가장 많이 받았고 손해율이 높은가"처럼 품목별 재해 취약성과 보험 지원 규모를 비교하는 데 쓴다. 전역 조인 키나 품목코드가 없어 다른 데이터와는 품목명으로만 이어 써야 하며, KAMIS 등 유통 가격 데이터와 붙이려면 품목명 매핑이 필요하다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 품목별 농작물재해보험 보험금 지급 통계자료로, 농업재해보험은 농가의 경영안정과 안정적 재생산 활동을 지원하기 위해 2001년부터 도입된 제도입니다. 주요 항목으로는 품목, 지급건수, 보험금, 건당 보험금, 손해율 등을 포함하고 있습니다. 이를 통해 특정 품목이 재해에 얼마나 취약한지와 보험제도의 실질적인 지원 효과를 파악할 수 있습니다. 또한 재해 유형과 품목 특성에 따른 보험금 지급 차이를 분석함으로써, 품목별 맞춤형 재해 대응 전략 마련, 보험제도 개선, 정책 지원 방향 설정 등에 유용하게 활용될 수 있습니다. 더 나아가 시기별·품목별 보험금 지급 추이를 분석하면 농업재해보험의 효과성 평가와 농가 경영안정 기여 정도를 객관적으로 검증할 수 있습니다.
