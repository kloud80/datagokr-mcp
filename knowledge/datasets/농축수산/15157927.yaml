summary_user: 2025년 수원·춘천·전주·밀양에서 채취한 벼 시료의 RNA 시퀀싱 결과를 TPM으로 정규화한 유전자 발현량을 담은 파일로, 유전자(feature_name)별 행에 6월 중순부터 9월 하순까지 채취일자별 시료(rch250616~rch250924) 열이 붙은 구조다. 연구자나 AI 개발자가 생육 시기에 따라 어떤 유전자 발현이 달라지는지 보고, 불량환경·병해충 조기 예측 모델을 학습·검증하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 기상·토양·병해충 발생 데이터와는 채취일자(열 이름의 날짜)와 지역을 손으로 맞춰야 이을 수 있다.
description_portal: 이 데이터셋은 2025년 수원·춘천·전주·밀양 4개 지역에서 채취한 벼 시료의 RNA 시퀀싱(RNA-seq) 결과에, 동일 시기·지역의 기상·토양 정보와 NCPMS 병해충 발생 이력을 융합하여 구축한 농작물 생체정보 데이터이다. 각 샘플은 TPM으로 정규화된 유전자 발현량과 병해충별 발생 유무(one-hot 라벨)를 포함하며, 벼의 전 생육 기간에 대한 불량환경·병해충 조기 예측 AI 모델의 학습·검증·테스트용으로 활용된다.* 데이터 라벨링 내역 및 메타데이터 는 FILE 탭 참조* 구축된 학습 데이터 중 토양, 기상, 병해충 발생이력 정보 저작권 변경금지(CC-ND)에 해당하여 이를 제외하고 생체정보(유전자 발현 특성)만 제공합니다.
