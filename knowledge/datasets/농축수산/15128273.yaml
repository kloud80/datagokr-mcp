description_portal: 이 데이터는 해양수산부에서 우리나라 인근 해역의 파랑 발생 현황을 파악하고, 파랑 관측 인프라 운영을 위한 정보를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 파랑 스펙트럼 관측 지점별 종합 정보로 구성되어 있으며, 관측 지점의 위치, 설치 및 운영 현황, 관측 시기, 수집 데이터 등이 포함되어 있습니다.  본 데이터는 해양 예보 서비스 제공, 해양 개발사업의 위험 평가, 파랑 관측 장비의 설치·운영 계획 수립, 해양·기상 연구기관 및 공공기관의 해양환경 분석 등 파랑 관측과 관련된 정보 활용에 사용할 수 있습니다.
