summary_user: 농축수산물 표준단위코드마다 같은 뜻을 갖는 조사가격 단위명을 산지·도매·소매별로 짝지어 둔 전국 단위 매핑 목록이며, 업데이트일자를 함께 담는다. 농산물 가격 분석가가 산지·도매·소매 가격을 비교할 때 단위 표기가 서로 달라 'kg'와 '상자' 같은 조사 단위를 어떤 표준단위로 맞춰야 하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 표준단위코드(STD_UNIT_CODE)나 단위명을 매개로 같은 기관의 표준코드·가격 조사 데이터와 이름·코드 매핑으로 잇는다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 이 데이터는 2015년에 제정 및 개정된 농축수산물 표준코드(부류 및 품목과 품종)와 동일한 의미를 가지는 조사가격 표준코드를 포함하고 있습니다. 이 정보는 농업 및 수산업 관련 데이터 분석이나 연구에 활용될 수 있으며, 특히 표준화된 코드 체계를 통해 식품의 출처 및 품질 개선에 기여할 수 있습니다. 이 API에는 표준단위매핑목록조회라는 오퍼레이션이 포함되어 있으며, 각 단위코드와 동일한 의미를 가지는 다양한 조사가격 표준 단위명(산지, 도매, 소매) 정보를 제공하고 있습니다. 이를 통해 사용자는 표준단위코드, 표준단위명, 조사단위명(산지, 도매, 소매), 업데이트일자 등을 기반으로 다양한 관련 정보를 손쉽게 조회할 수 있습니다.
