summary_user: 농업법인 현황조사의 응답 자료로, 법인별 식별번호(list ID)마다 조사기준, 시도·시군구, 경지면적, 가중치와 법인 형태·근로자 수·작물·투자 등 설문 문항(Q로 시작하는 필드) 응답을 담은 전국 범위 조사 원자료입니다. 정책 연구자나 분석가가 '어느 지역 농업법인의 경지면적과 근로자 규모, 주 생산 작물이 어떻게 분포하는가'처럼 가중치를 적용한 농업법인 실태 통계를 낼 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못했으므로, 시도·시군구 이름을 맞추거나 같은 기관 자료와 코드로 연결하는 방식으로만 이어 쓴다.
description_portal: '농림수산식품교육문화정보원에서 제공하는 농업법인 현황조사는 우리나라의 농업법인에 대한 다양한 정보를 담고 있는 데이터입니다. 본 데이터는 법인형태, 근로자 수, 작물종류, 경지면적, 투자현황 등의 항목으로 구성되어 있으며, 이를 통해 농업 경영체에 대한 통계적 분석이 가능합니다. 이러한 정보는 농업 정책 수립, 연구 개발, 농업 관련 사업의 검토 및 개선 등에 매우 유용하게 활용될 수 있습니다. 또한, 각 법인별 투자의 규모와 작물 선택에 대한 데이터는 농업의 생태계와 경제적 가치를 이해하는 데 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: - list ID (숫자형) : 농업법인의 고유 식별번호- year (숫자형) : 조사 연도- area (숫자형) : 경지면적- wt (숫자형) : 특정 법인의 가중치- Q2a (숫자형) : 법인 형태 코드- Q2b (숫자형) : 근로자 수- Q5 (숫자형) : 생산하는 작물의 종류- Q4a_2 (숫자형) : 투자 규모- Q4a_3 (숫자형) : 작물 수- Q4a_4 (숫자형) : 통계적 값 기타 항목들데이터 입력 형식은 주로 숫자형과 문자형으로 이루어져 있으며, 조사된 각 항목에 유의미한 데이터를 제시하고 있습니다.'
