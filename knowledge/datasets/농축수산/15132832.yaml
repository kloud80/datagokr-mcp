description_portal: '- 전라남도 어장도관리시스템에 게재된 해안선 정보(SORIND값, 추가정보, 해안선 둘레길이값 등)에 대해 조회하실 수 있습니다.- 전라남도는 대한민국에서 가장 긴 해안선을 보유한 지역으로, 총 해안선 길이는 약 6,800km에 달합니다. 이는 전국 해안선 총 길이의 약 45%를 차지하며, 특히 리아스식 해안, 섬, 만, 갯벌 등 다양한 해양 지형이 발달해 있습니다.- 전라남도의 해안선은 자연적 요인과 인공적 요인에 의해 지속적으로 변화하고 있습니다. 국립해양조원에 따르면, 전국 해안선 총 길이는 1만5285.4km로, 그 중 자연해안선은 약 9730.1km(약 64%)를 차지하며, 인공해안선은 약 5555.3km(약 36%)로 증가 추세에 있습니다. 특히 방파제 등의 인공 구조물의 증·신설로 인한 해안선의 변화가 두드러집니다.'
