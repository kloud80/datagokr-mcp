description_portal: 경상남도 직속기관인 농업기술원은 품종육성사업을 수행하고 있습니다.매년 육성된 우량계통은 경상남도종자위원회 자체 심의를 거쳐 국립종자원에 출원신청하고 재배심사 통과 후 품종 등록됩니다.2005년부터 2025년까지 등록된 품종에 대해 작물명, 품종명, 계통명, 등록년도, 주요특성으로 구성된 데이터입니다.식량작물은 벼, 밀, 고구마, 원예작물은 딸기, 멜론, 양파, 파프리카, 화훼류는 거베라, 국화, 나리, 장미, 카네이션, 칼랑코에, 호접란, 과수는 단감, 사과, 특용작물은 버섯, 형개, 감국 품종을 육성 및 등록 하였고, 2025년 기준 437여 품종이 등록되었습니다.
