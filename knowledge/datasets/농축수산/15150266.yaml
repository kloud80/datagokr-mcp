summary_user: 한국농어촌공사가 계측한 농수로 지점별 수위와 유량을 수로측정지점코드와 계측일시 단위로 담은 건별 계측 데이터이며, 범위는 전국입니다. 농업용수 관리자나 재난 분석가가 '특정 농수로 지점의 수위가 최근 몇 시간 동안 얼마나 올랐는가'를 확인하는 데 씁니다. 전역 조인 키는 없으며, 수로측정지점코드(WTRC_MSRMT_FPOTG_CD)를 같은 기관의 지점 코드나 지점명 매핑으로 이어야 다른 데이터와 연결됩니다.
description_portal: "'행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국농어촌공사에서 제공하는 정보로 수로측정지점코드, 계측일시, 수위, 유량 정보를 제공하고 있습니다."
