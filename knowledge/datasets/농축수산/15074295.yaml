summary_user: 2020년 12월 31일 기준 곤충산업 실태조사 결과를 전국 단위 집계표로 담으며, 곤충농가 수·사육면적 같은 생산통계, 가공업체 수·판매량·판매액 같은 유통통계, 체험학습장·지자체 보조사업 같은 산업통계로 구성된다. 정책 담당자나 연구자가 '곤충 사육 농가와 판매액이 어느 정도 규모인가'를 확인하는 기초 자료로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명·곤충명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 해당 데이터는 2020년 12월 31일 기준으로 실시된 곤충산업 현황 실태조사 결과를 기반으로 제공되는 자료입니다. 제공 목록으로는 생산통계(곤충농가 수, 사육사 형태, 사육면적), 유통통계(가공업체 수, 농가별·곤충별 판매량 및 판매액, 판매장 수), 산업통계(체험학습장 및 생태원 수, 지자체 보조사업 현황 등)가 포함되어 있습니다. 이 데이터는 곤충을 활용한 식품, 사료, 환경, 바이오 산업 등 다양한 분야의 산업 동향을 파악하는 기초 자료로 활용될 수 있습니다. 또한 곤충산업 관련 정책 수립, 제도 개선, 연구개발 방향 설정에 유용하며,지역별 산업 지원 전략 수립과 곤충 관련 체험·교육 프로그램 운영에도 참고할 수 있습니다. 더 나아가, 학계와 산업계에서는 곤충산업의 성장 가능성을 평가하고, 지속가능한 미래 산업으로 발전시키기 위한 근거 자료로 활용할 수 있습니다.
