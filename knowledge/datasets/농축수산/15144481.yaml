description_portal: 23년 1월 이후 바다 내비게이션* 설치 선박에 제공된 해양사고 관련 통항분리대 위반 서비스 이력을 제공합니다.* 바다 내비게이션은 선박에 장착하는 이내비게이션(e-navigation) 장비를 말하며 "지능형해상교통정보법"에 따라 21년 1월 30일 이후 건조되거나 외국으로 부터 수입되는 선박(어선, 일반선박, 모터보트 및 세일링 요트)은 해당 단말기(장비)를 의무적으로 장착해야합니다.해당 경보는 본선에서 지정된 통항분리대를 위반하여 항해를 하는 경우 선박에 경보 알람("현재 통항분리대 역주행 으로 운항 중입니다" 등)을 제공하여 본선의 안전항해를 유도함에 있으며이력조회를 통해 본선의 사용자가 해당 경보를 인지, 확인하였는지의 여부를 확인 할 수 있습니다.특정 선박에 관한 정보(선명, 선주정보 등)은 비공개 처리하였습니다.
