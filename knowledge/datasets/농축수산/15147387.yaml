description_portal: 이 데이터는 해양수산부에서 무신호에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 제작일자, 전자해도단계코드, 해양공간객체영문명, 신호소멸간격, 무신호일련번호, 기타정보영문내용, 기타정보한글내용, 최소규모수, 자료생성일자, 원본자료내용, 수준구분코드, 공간정보 데이터로 구성되어 있습니다.본 데이터는 무신호 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.무신호란 안개, 눈, 노을, 연무 등으로 인해 시계가 나빠졌을 때 선박의 안전을 위해 음향 신호를 발사하는 장치나 시스템을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
