description_portal: 이 데이터는 해양수산부에서 수산정책자금의 금리인하 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2012년부터 2019년까지 직접융자 형태의 수산분야 정책자금 사업의 사업명과 사업별 금리 현황 정보로 구성되어 있습니다.  본 데이터는 정책자금 지원을 받은 수산업 종사자 및 관련 금융기관이 당시 금리 동향을 확인하거나, 정부 및 연구기관에서 정책자금 운용 실태 및 금리 변동의 영향을 분석하는 자료로 활용될 수 있습니다. 또한, 수산업계의 자금 조달 환경에 대한 이해를 높이는 기초자료로도 이용될 수 있습니다.
