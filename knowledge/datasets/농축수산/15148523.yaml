description_portal: 이 데이터는 해양수산부에서 바다목장인공어초설치에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 년도, 설치시작일자, 설치종료일자, 해역, 어초이름, 정렬타입, 시도, 시군, 동, 리 데이터로 구성되어 있습니다.본 데이터는 항 바다목장인공어초설치 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바다목장인공어초란 인공적으로 해저에 구조물을 설치하여 수산생물의 서식지, 산란장, 은신처를 제공함으로써 수산자원을 증대하고 어업소득을 높이기 위한 어장시설을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
