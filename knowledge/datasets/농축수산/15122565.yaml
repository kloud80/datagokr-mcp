description_portal: '농림수산식품교육문화정보원 농업온 시스템의 품목 정보에 대한 데이터는 다양한 농업 및 수산물 품목에 대한 상세한 정보를 제공하는 소중한 자료입니다. 이 데이터는 품목 구분코드, 품목 대분류, 품목 중분류와 같은 다양한 항목을 포함하고 있으며, 각 품목에 대해 정확하고 통계적인 정보를 제공합니다. 농업 및 수산업 관련 연구, 정책 수립, 시장 조사 등의 다양한 분야에서 활용될 수 있습니다. 예를 들어, 농산물의 생산량 및 유통량 변화를 분석하여 농림 정책에 대한 효과적인 대안을 모색하는 데 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 품목 구분 코드(숫자형) : 각 품목을 식별하는 고유 코드입니다. 품목 대분류(문자형) : 대분류의 카테고리를 나타내며, 예를 들어, 과실류, 채소류 등의 정보를 포함합니다. 품목 중분류(문자형) : 중분류 카테고리로, 특정 품목에 대한 세부 정보를 제공하며, 예를 들어, 특정한 종류의 과일이나 채소의 이름이 기재됩니다.'
