summary_user: 직선영해기선(영해 등 해양 관할구역의 외측 한계를 재는 기준선)을 전자해도 기반의 선형 공간정보(SHP) 파일로 담은 데이터로, 기선별 지정국·묘사정보·개발권한 한계구분 등이 들어 있고 범위는 전국입니다. 해양 관할구역을 조사하는 기관이나 해상풍력 입지를 검토하는 사업자가 '이 해역이 영해기선 안쪽인가 바깥쪽인가'를 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 묶을 공통 조인 키가 없으므로, 해양용도구역·보호구역 같은 다른 해양공간 레이어와는 속성 키가 아니라 공간 중첩(GIS 오버레이)이나 이름 대조로 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 직선영해기선(영해 또는 기타 외측 한계를 측정하는 한계선)관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 전자해도를 기반으로 한 직선영해기선의 SHP형태 선형 공간정보 파일로 구성되어 있으며, 각 기선의 지정국, 묘사정보, 개발권한 한계구분 및 기타 정보 등을 포함하고 있습니다.본 데이터는 관계 기관에서 해양 관할구역 조사, 항해 안전 정보 제공, 관련 법령 적용 및 해양 공간 관리 등에 활용될 수 있습니다. 또한, 해운 및 물류 관련 기업에서 운항 계획 수립 등 업무를 위한 기초 자료로 활용할 수 있습니다.
