description_portal: '- 전라남도내 수산물지리적표시에 관한 현황(품목,  등록명칭, 등록자, 주소, 데이터기준일자 등)데이터입니다.- 전라남도는 청정 해역과 우수한 수산물로 유명하며, 다양한 수산물이 지리적 표시를 통해 품질과 지역성을 인정받고 있습니다.- 지리적 표시는 특정 지역에서 생산된 농수산물의 품질과 명성을 보호하고, 소비자에게 지역 특산물의 우수성을 알리기 위한 제도입니다. 전라남도는 이러한 지리적 표시를 통해 지역 경제 활성화와 농수산물의 브랜드 가치를 높이고 있습니다.- 전라남도의 수산물은 청정 해역에서 자란 우수한 품질을 자랑하며, 지리적 표시를 통해 그 가치를 인정받고 있습니다.'
