description_portal: '맞춤형 농지 지원 희망 신청 및 추천 현황은 농지를 구하고자 하는 고객이 신청한 희망 지역과 면적. 금액을 확인 후 매도 및 임대 신청된 적합한 농지 매물을 추천한 데이터 입니다.연도 및 지역 기준으로 평균 희망 금액, 평균 희망 면적, 평균 추천 면적, 평균 추천 금액 으로 구성된 데이터 입니다.* 데이터 항목 설명 - 연도와 시도시군구 기준 희망 면적, 희망 금액, 추천 면적, 추천 금액 데이터 - 희망 면적과 금액의 경우, 1 ~ 99999999 와 같은 임의 설정값은 제외하였으며, 평균 수치값은 최저, 최고값을 제외 후 계산한 데이터 - 면적 : 제곱미터(㎡) 기준 - 금액 : 원 단위'
