summary_user: 제주 절물자연휴양림 안의 무장애여행 관련 지점을 한 행씩 담은 원천 목록으로, 지점별 아이디와 위도·경도·해발고도를 담고 포털 설명상 장소설명과 이미지 정보도 함께 제공한다. 휠체어 이용자나 노약자·유아를 동반한 여행자, 관광 정책 담당자가 절물휴양림에서 이동약자가 이용할 수 있는 지점이 어디에 있는지 지도로 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표나 장소 이름을 맞춰 연결하거나 같은 기관(제주특별자치도)의 무장애여행정보 시리즈와 나란히 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 절물휴양림 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다.* 절물자연휴양림은 제주 제주시 명림로 584에 위치한 공공 산림 휴양지로, 울창한 삼나무 숲과 완만한 산책로를 갖추어 교통약자 및 휠체어 이용자도 접근 가능한 무장애 여행지로 설계된 곳입니다. 휠체어 대여, 장애인 전용 주차구역, 장애인 화장실, 무단차 출입구 등이 마련되어 있으며, 주요 산책로는 계단 없이 경사도가 낮은 동선으로 구성되어 있어 노약자·유아 동반자 모두 이용이 용이합니다. 약수터, 연못, 잔디광장, 목공예체험장, 숙박시설 등 다양한 부대시설이 있어 단순 산책을 넘어 휴식과 자연 체험이 가능한 열린관광지입니다. 무장애 관광 인프라 제공, 가족 또는 이동약자 동반 관광 활성화, 정책 수립 및 관광 서비스 개선의 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
