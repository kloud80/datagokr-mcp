description_portal: 해파리 모니터링 설문 응답결과 상세는 설문 응답자가 보고한 해파리 출현 여부와 출현 위치에 대한 세부 정보를 관리하는 데이터이다. 각 설문 응답결과에 대해 해파리를 관측했는지 여부를 구분하고, 해파리를 관측한 경우에는 실제 출현이 확인된 해역이나 항·포구 등 구체적인 위치 정보를 함께 저장한다. 응답상세ID를 통해 해파리를 보지 못했음(1) 또는 보았음(2)으로 구분하며, 해파리를 관측한 응답의 경우에는 동해 대진항, 묵호항 연안, 보령 외연도 부근, 서산 대산항 연안 등 실제 조사자가 확인한 출현 지역을 상세결과로 기록한다. 이를 통해 단순한 출현 여부뿐만 아니라 해파리의 발생 위치와 분포 현황을 체계적으로 관리할 수 있으며, 지역별 출현 특성 분석, 해파리 확산 경로 파악, 위험 해역 예측, 연안 안전관리 및 어업 피해 예방을 위한 기초자료로 활용된다. 또한 동일 조사기간 동안 수집된 다양한 출현 위치 정보를 축적하여 해파리 발생 추세를 장기적으로 분석하고, 해양환경 변화에 따른 발생 양상을 파악하는 데 활용되는 중요한 상세 데이터이다.
