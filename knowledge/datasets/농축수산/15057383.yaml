summary_user: 경기도에서 폐사한 가축을 매몰 등으로 처리하도록 지원한 장비의 현황을 집계년도·시군별로 묶은 집계 자료이며, 지원 대수(사업량)와 도비·시군비·자부담 사업비를 담는다. 축산정책 담당자나 예산 분석가가 '어느 시군에 처리장비가 몇 대 지원됐고 도와 시군, 농가가 비용을 어떻게 나눴는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군명이나 시군코드(SIGUN_CD)를 이름·코드 매핑으로 맞추거나 경기도 같은 기관의 코드로만 잇는다.
description_portal: 본 데이터는 경기도에서 폐사된 가축의 매몰 등 처리를 위해 지원된 장비 비용 현황을 집계한 자료로, 가축 방역과 환경 위생 관리에 활용됩니다. 주요 항목은 집계년도, 시군명, 시군코드, 사업량(대), 도비사업비, 시군비사업비, 자부담금사업비 등으로 구성됩니다. 이를 통해 시군별 장비 지원 규모와 비용 분담 구조를 파악할 수 있으며, 축산 분야 재난 대응 정책, 가축 질병 발생 시 긴급 지원 체계 마련, 예산 집행 관리 등에 유용합니다. 또한 데이터는 Open API를 통해 XML 및 JSON 형식으로 제공되어, 축산정책 연구, 예산 분석, 행정 의사결정 지원 등에 폭넓게 활용될 수 있습니다.
