summary_user: 유기농업자재의 공시 현황을 공시 건별로 담으며, 공시번호·자재 종류·자재명·제품명·공시 등록일과 유효기간(시작·종료일)·제품 가격·업체명·대표자·사업장 주소·관리기관을 전국 범위로 제공한다. 농가가 쓰려는 유기농업자재가 공시된 제품인지, 공시 유효기간이 남았는지, 어느 업체가 만드는지를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 다른 자료와는 업체명·제품명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 해당 데이터는 유기농업자재의 공시 및 품질인증 현황과 생산·판매량, 품질검사 현황 등을 종합적으로 정리한 자료입니다. 이 자료는 농가에게는 검증된 품질 정보를 기반으로 신뢰성 있는 유기농업자재를 선택할 수 있는 기준을 제공하고, 정책 담당자에게는 친환경농업 지원 정책을 수립하거나 제도를 개선하는 근거 자료로 활용됩니다. 또한 연구자에게는 유기농업자재 산업의 생산·유통·소비 구조와 발전 추세를 실증적으로 분석할 수 있는 유용한 자료가 됩니다. 나아가 본 데이터는 유기농업 확산과 지속가능한 농업 환경 조성을 촉진하며, 친환경 농업 기반 강화, 농가 경영 안정, 농업의 환경 친화적 전환을 뒷받침하는 중요한 기초자료라 할 수 있습니다.
