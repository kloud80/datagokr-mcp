description_portal: 이 데이터는 VHFDSC 단말기를 장비한 선박에서 발생한 조난신호를 수집하여 선박의 안전 관리와 신속한 대응을 지원하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 조난 단계, 조난 신호 발생 위치의 위도와 경도, 조난 신호를 보낸 어선 번호, 어선 식별용 MMSI번호, 조난 신호가 발생한 일시 등의 항목으로 구성되어 있습니다.  본 데이터는 해양 사고 발생 시 근처 구조세력의 신속한 출동 및 위치 파악에 활용할 수 있으며, 선박 안전정책 수립이나 해양 사고 사례 분석, 해양 관련 연구 및 교육 자료로 사용될 수 있습니다. 또한, 해양수산 관련 기관에서 어선의 조난 사례 및 구조 현황을 파악하여 조난 대응 체계의 개선 방안 마련에 활용할 수 있습니다.
