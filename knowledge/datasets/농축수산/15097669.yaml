description_portal: 데이터는 경기도 화성시 관내 스마트팜에서 포도를 재배하는 농장을 대상으로 2020년 1월부터 3월까지의 휴면기 기간 동안 수집된 지온 정보를 포함한다. 해당 자료는 포도 생육 전 단계인 휴면기의 토양 온도 변화를 농장별로 기록한 것으로, 작물의 생리적 변화 예측과 재배 시기 조정 등에 활용될 수 있다. 휴면기 지온 정보는 저온 피해 방지, 발아 시기 판단, 병해 발생 가능성 분석 등 다양한 농업적 의사결정에 기초자료로 제공된다. 데이터는 농장 단위로 구분되며, 측정 시점별 토양 온도 값이 포함되어 있다. 기후변화 대응, 품종별 생육 조건 비교, 재배 환경 평가 등 다양한 분야에서 활용 가능성이 높다. 본 자료는 정밀 농업 실현과 농업 기술 고도화에 기여할 수 있는 실증 기반 데이터로서 의의가 있다.
