summary_user: 과실전문생산단지 기반조성사업(용수원 개발·농로 개설·과원 경지정리 등)의 연도별·시군구별 예산·교부액·집행액·이월액·불용액·실집행률을 담은 전국 단위 집계 자료다. 정책 담당자나 지자체가 "우리 시군의 과수 기반조성 예산이 해마다 얼마나 실제로 집행됐는가"를 따져 지원 규모를 조정할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로, 다른 데이터와는 시도·시군구 이름이나 코드(CTRD_CODE, SIGNGU_CODE)를 맞춰 매핑해 이어 쓴다.
description_portal: 해당 데이터는 과실전문생산단지 기반조성사업 단지기반에 관한 자료로, 과실전문생산단지 기반조성사업은 과실전문생산단지 조성을위한 용수원 개발(관정, 양수장 등), 농로개설, 과원 경지정리 등 과수생산 및 출하 기반 구축 사업입니다. 주요 항목으로는 연도, 시도, 시도코드, 시군구, 시군구코드 등을 포함하고 있습니다. 본 자료는 정책 담당자에게는 지역 단위 과수 기반 정비의 성과를 분석하고 향후 지원 규모를 조정하는 근거가 되며, 지자체와 농가는 과수 생산 기반 확충 및 유통 효율성 제고를 위한 전략 수립에 활용할 수 있습니다. 나아가 본 데이터는 지역별 과수산업 균형 발전, 농가 소득 안정, 과수 유통 경쟁력 강화를 뒷받침하는 중요한 기초자료라 할 수 있습니다.
