description_portal: '"제주특별자치도 내 미곡생산량(백미)정보 데이터를 제공합니다.항목: 연도, 시도, 전체면적, 전체 생상량, 논벼면적, 논벼 10a 생상량, 농벼 생산량, 밭벼 면적 등* 1965년부터 2020년까지 제주특별자치도 내에서 생산된 미곡(백미)의 생산면적과 생산량을 기록한 장기 통계 자료입니다.이 자료는 논과 밭을 구분하여 집계된 생산 데이터를 제공하며, 연도별로 농지 유형별 생산량과 면적 변화를 구체적으로 비교할 수 있습니다. 단순한 생산 추세 확인을 넘어, 시기별 농업 구조의 변화와 토지 이용 방식의 차이를 살펴볼 수 있어 농업 발전사 연구에 중요한 참고 자료가 됩니다.* 활용 분야 : 생산 추세 분석, 농업 정책 수립, 지역 농업 구조 연구 등"'
