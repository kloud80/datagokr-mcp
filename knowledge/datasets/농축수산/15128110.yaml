description_portal: 이 데이터는 해양수산부에서 연안포털을 통해 관련사이트 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 선박검사, 어항안내, 기술동향 등 정보 획득을 위한 관련 사이트 URL주소, 사이트명, 설명 등으로 구성되어 있습니다.  본 데이터는 연안 및 해양 분야의 정보 접근성과 서비스 이용 편의성 향상을 위해 활용될 수 있으며, 정책담당자는 유관 기관 간 협력체계 파악 및 정책지원자료로 활용할 수 있습니다. 연구기관 및 행정기관 등에서는 해양수산 관련 서비스 현황 파악, 기관별 정보 안내 시스템 개선 방안 마련, 대국민 통합 정보 제공채널 연구 등에 본 데이터를 사용할 수 있습니다.
