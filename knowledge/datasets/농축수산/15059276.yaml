summary_user: 경기도 31개 시군의 가축 인공수정소 사업장 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소·WGS84 위경도·업태·축산고유번호가 들어 있다. 축산 사업자나 지역 축산정책 담당자가 '우리 시군에서 지금 영업 중인 인공수정소는 어디이고 언제 인허가를 받았나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 축산 인허가 데이터와는 사업장명·주소 매칭이나 축산고유번호(STOCKRS_IDNTFY_NO)로 이어 붙여야 하고, 위경도로 지도에 겹쳐 볼 수 있다.
description_portal: 이 데이터는 경기도 내 31개 시군에 위치한 가축 인공 수정소업체의 인허가 현황을 제공하는 자료로, 가축의 인공수정을 수행하는 사업장에 대한 정보를 담고 있습니다. 총 27개 항목으로 구성되며, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소, 위치정보(WGS84 위도·경도 및 좌표값), 총 종업원 수, 축산업무구분명, 축산물가공업구분명, 업태구분명, 축산고유번호 등의 정보를 포함합니다. 본 자료는 가축 번식 관련 기술 기반 시설의 분포 현황, 축산업 전문성 분석, 지역 축산정책 수립의 기초 자료로 활용될 수 있으며, 행정안전부에서 주간 단위로 갱신하여 Open API 형식으로 제공됩니다.
