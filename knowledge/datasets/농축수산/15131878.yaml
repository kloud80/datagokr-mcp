summary_user: 지자체·개인·민간단체가 운영하며 분양 중인 전국 텃밭을 한 곳씩 담은 목록으로, 텃밭 유형·운영 주체·주소·위경도·분양 면적과 가격·부대시설·신청 방법을 포함한다. 도시에 사는 시민이 '우리 동네에서 분양 중인 텃밭은 어디이고 얼마인가'를 찾거나, 분석가가 지역별 도시텃밭 분포를 볼 때 쓴다. 전역 조인 키는 없어서 시도·시군구 코드와 이름(AREA_LCD·AREA_MCD) 매핑이나 위경도로 다른 행정·공간 데이터와 연결한다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 이 API는 지자체, 개인, 민간단체가 운영하고 분양중인 텃밭에 대한 종합 정보를 제공합니다. 이 데이터는 텃밭의 유형, 운영 주체, 정확한 위치, 연락처 정보, 분양 가격, 부대시설 정보, 신청 방법 등을 포함합니다. 특히, 도시농업을 활성화하고 텃밭을 이용하려는 시민들에게 유용한 자료입니다. 본 API는 텃밭 분양 현황 및 관련 정보를 제공하여 도시인들이 텃밭을 활용한 농업 체험 및 자기 주도적인 식량 생산을 할 수 있도록 돕습니다. 또한, 운영주체, 위치, 분양 면적 및 비용, 이용 기간, 편의시설, 교통 접근성 등 세부 정보를 제공하여 사용자에게 보다 현실적이고 유익한 정보를 안내합니다. 이러한 데이터를 통해 사용자들은 보다 손쉽게 자신에게 적합한 텃밭을 찾고 신청할 수 있습니다.
