description_portal: '이 데이터는 해양수산부에서 천해양식(얕은 바다에서 서식하는 생물 양식)업 생산 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 1996년부터 2013년까지 연도별로 천해양식업에서 생산된 어류, 패류, 갑각류, 연체동물, 기타수산동물, 해조류 등 주요 품종별 생산량(단위: M/T)으로 구성되어 있습니다.  본 데이터는 천해양식업 분야의 생산 변화 추이 분석, 품종별 생산 비중 확인, 해양수산 정책의 효과 분석, 그리고 양식업 관련 연구기관 및 업계에서 생산전략 수립, 시장 수요 예측 등에 활용될 수 있습니다.'
