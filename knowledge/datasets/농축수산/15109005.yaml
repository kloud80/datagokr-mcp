description_portal: 한국마사회의 등록마필에 대하여 소재지 정보를 제공합니다. (제공정보는 등록일(regDt), 등록사유코드명(regRsCd), 소재지유형코드명(sitlTypeCd), 소재지명(sitlNm), 소재지우편번호(sitlPostNo), 소재지주소(sitlAdr), 소재지지번주소(lnoSitlAdr), 소재지전화번호(sitlTelNo), 시도명(sidoNm), 시군구명(ccdNm), 승마장여부(hrcosYn), 생산목장여부(stdfrYn), 조련센터여부(trinnCentYn) 자료입니다.)- 요청메세지에 시도명(sido_nm), 등록일 검색시작일자(reg_dt_fr), 등록일 검색종료일자(reg_dt_to), 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다.- 입력변수 미입력시 등록일 기준 최근 1년간의 자료가 표출됩니다.
team:
  dept: 통합유지관리
services:
  - op: /HorseSite
    name: 소재지기본연계 정보 조회 서비스
    endpoint: https://apis.data.go.kr/B551015/API289/HorseSite
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: reg_dt_fr
        required: false
        example: '20220917'
        desc: 등록일 검색시작일(FROM) (YYYYMMDD 형식)
      - name: reg_dt_to
        required: false
        example: '20220917'
        desc: 등록일 검색종료일(TO) (YYYYMMDD 형식)
      - name: sido_nm
        required: false
        example: 충청남도
        desc: 시도명 입력
      - name: _type
        required: false
        example: xml
        desc: 데이터형식변경
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 3000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
