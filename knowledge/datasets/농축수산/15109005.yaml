summary_user: 한국마사회 등록마필이 머무는 소재지(목장·승마장·조련센터 등)를 등록 건별로 담은 원천 목록으로, 등록일·등록사유·소재지 유형·명칭·도로명/지번 주소·전화번호와 승마장·생산목장·조련센터 여부를 전국 범위에서 개별 주소 단위로 제공한다. 말 산업 사업자나 분석가가 '특정 시도에 최근 1년간 새로 등록된 생산목장·승마장은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시도명·시군구명이나 주소를 기준으로 행정구역 자료와 이름 매핑하거나 같은 기관의 마필 관련 데이터와 연결해야 한다.
limits: 마필 개체 정보나 가격 정보는 담지 않으며, 세부 부문이 농산물 유통 가격으로 분류돼 있지만 KAMIS 품목코드와는 이어지지 않는다. 다른 데이터와 공통 코드 키가 없어 시도·시군구 이름이나 주소 문자열로만 결합할 수 있다. 검색 조건을 넣지 않으면 등록일 기준 최근 1년치만 반환되고, 개발계정은 하루 3,000회까지 호출할 수 있다.
