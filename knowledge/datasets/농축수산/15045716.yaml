description_portal: '1. 조사평가 대상 확인 : 한국식품안전관리인증원 홈페이지에서, HACCP 인증업체의 심사대상을 확인하실 수 있습니다.[출처] 가축사육업, 종축업부화업 해썹(HACCP) 자체평가 요령|작성자 HACCP2. 대상업체 확인은 "인증번호", "인허가번호", "업체명"으로 검색이 가능합니다 (인허가번호, 인증번호, 업체명 3가지 방법 중 선택하여 검색)1) 인허가번호, 인증번호, 업체명 조회* 주의사항 : 업체명으로 검색하는 경우 업체명을 기입하고 지역을 선택한 후 검색해주세요. 2) 조사평가 대상확인(1) 인허가번호 : 인허가번호를 입력하세요.(2) 인증번호 : 예)2022-1-1234(3) 업체명 : 업체명 입력하세요.3) 심사대상 구분은 아래와 같습니다.(1) 연장심사 : 연장심사 신청 시, 사전 일정 협의 후 현장심사 진행(2) 조사평가(자체) : 자체적으로 평가 진행하여 제출* 자체평가 제출은 자체평가 시스템 이용 또는 우편으로 제출(3) 조사평가(현장평가) : 각 기관에서 사전 일정 통보 없이 불시에 방문하 여 조사 평가 실시* 농장의 경우 법위반 및 전년도 심사 미흡업체에 대하여 불시 점검이 이루어질 수 있습니다.3. 심사대상(기관별)1) 지방식약청 : (1) 식품 업체, (2) 축산물 의무(완료) 업체 : 식육가공업, 유가공업, 알가공업, 식용란선별 포장업, 식육포장처리업(1,2단계)2) 한국식품안전관리인증원 지원 : 지방식약청 관리 대상 이외 업종6. 주의사항1) 식품안전 사건·사고 발생 또는 관련 법령 위반 등 문제 발생 시, 연초 평가 종류와 무관하게 별도의 공지 없이 현장평가(불시)를 진행할 수 있습니다.2) 또한 연장심사, 자체평가 업체라 하더라도 각 기관 운영 계획에 따라 필요시 별도의 공지 없이 현장평가(불시)를 진행할 수 있습니다.3) ‘민간참여형 식품안전관리시스템 시범사업’에 참여하는 기관*에서 인증받은 업체(GFSI 규격인증'
