description_portal: 이 데이터는 해양수산부에서 한국 어선의 일본 EEZ(배타적 경제수역) 내 어업 활동과 관련된 협정사항 상세정보 제공을 목적으로 수집된 데이터입니다.본 데이터의 주요 내용은 기준년도, 어업종류코드, EEZ 어종코드, 일련번호, 업종 한글명, 업종 영문명, 업종 한자명, 어종 한글명, 어종 영문명, 어종 한자명, 어종코드, 합의척수(어선 수), 총할당량, 확정여부, 확정일자, 최초 생성 시점, 최종 변경 시점, 데이터 기준일자로 구성되어 있습니다.  본 데이터는 한일 양국 간 EEZ 내 어업 활동의 합의된 사항을 확인, 관련 정책 검토, 업종 및 어종별 어획 한도 파악, 과거 협정 변동 이력 조회, 수산 정책 연구, 한일 소극장교섭 실적 분석, 어업 관리 계획 수립 등 각종 행정 및 연구 목적에 활용될 수 있습니다.
