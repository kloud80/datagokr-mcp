description_portal: 식물 신품종 육성자의 권리를 부여하기 위하여 품종보호제도를 운영하고 있으며, 신품종을 출원한 품종에 대한 서류심사, 재배심사, 종합심사 등을 거쳐 신품종을 등록하고 있다.신품종을 육성한 주체별(국내개인, 국내종자업계, 국내지자체, 국내국가기관, 국내기타,외국개인, 외국종자업계, 외국기타)로 품종보호 출원 및 등록 현황을 정리한 표이다.육성 주체별로 수치화한 자료로 관련 통계자료 작성에 유용한 자료이다.국립종자원에 출원한 농업종자에 대한 품종으로 산림종자, 수산식물종자는 제외한 자료이다.
