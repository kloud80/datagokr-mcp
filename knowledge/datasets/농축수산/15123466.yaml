description_portal: 이 자료는 농촌진흥청이 운영하는 농업경영종합정보시스템(AMIS) 웹 포털 메인페이지에 노출되는 이미지형 팝업에 대한 정보를 포함하고 있습니다. 주로 시스템 사용자에게 전달해야 할 공지사항, 주요 서비스 안내, 교육 홍보, 정책 변경사항 등을 시각적으로 효과적으로 전달하기 위한 용도로 활용됩니다. 본 데이터에는 팝업의 제목, 이미지 파일명, 공지 내용, 게시 시작일, 종료일, 연결 URL 등 주요 항목들이 수록되어 있으며, 팝업 노출 대상 및 우선순위 설정 정보도 포함될 수 있습니다. 이 자료는 사용자 접근성과 정보 전달 효율을 높이기 위한 콘텐츠 운영의 일환으로, 농업경영체 및 관련 기관 사용자들에게 주요 정보를 빠르게 제공하는 데 활용됩니다.
