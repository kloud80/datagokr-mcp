description_portal: 경상남도 창원시의 축산농가 주소 및 사육두수에 대한 데이터 입니다. 항목은 사업장 명칭, 주사육 업종, 사업장소재지(지번), 면적이 포함되어 있습니다.가축 사육 시설 및 축산업 운영 현황을 지역 단위로 정리한 자료입니다. 이 데이터는 농가 수, 사육 가축 종류 및 규모, 분포 지역 정보를 바탕으로 축산 정책 수립, 방역 대책, 환경 관리, 지역경제 분석, 민원 대응 등 다양한 목적에 활용될 수 있습니다.데이터가 많을 경우 일반 뷰어(엑셀, 메모장 등)에서 일부 정보만 표시될 수 있으므로, R, Python, GIS 등 분석 전용 도구 사용을 추천합니다.사육 가축 종류별(소·돼지·닭 등), 규모 기준, 인증/허가 상태 등 세부 정의는 제공기관의 메타데이터 또는 기술문서를 확인해 주세요.
