summary_user: 경기도 내 단속기관별로 불법어업 단속 실적을 연도와 위반 유형(무허가·무면허 조업, 이중 자망 사용, 어구사용 위반, 허가 외 어구 적재 등)에 따라 적발건수로 집계한 시도 단위 비공간 자료다. 수산 행정 담당자나 분석가가 "경기도에서 최근 어떤 위반 유형의 적발이 늘었는가"를 보고 집중 단속 분야를 정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속기관명·단속년도 같은 이름·연도 값을 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 이 데이터는 불법어업 행위에 대한 연도별 단속 실적을 항목별로 정리한 자료로, 수산자원 보호와 어업질서 확립을 위한 행정 활동의 일환으로 수집되었습니다. 주요 항목으로는 단속기관명, 단속내역, 단속년도, 적발건수, 데이터수집일자가 포함되며, 단속내역에는 무허가·무면허 조업, 이중 자망 사용, 어구사용 위반, 허가 외 어구 적재 등 다양한 위반 유형이 명시되어 있습니다. 본 자료는 어업 위반 행위의 경향 분석, 단속 강도 조정, 수산 정책 수립에 활용될 수 있으며, 특정 위반유형의 발생 빈도를 파악함으로써 법령 개선 또는 집중 단속이 필요한 분야를 식별하는 데 유용합니다. 연도별 변화 추이를 비교하여 어업질서의 개선 정도를 파악할 수 있습니다
