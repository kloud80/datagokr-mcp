summary_user: aT 온라인도매시장(KAFB2B)에 등록된 농산물 판매상품을 상품 한 건씩 담은 파일로, 판매자 상호와 사업자등록번호, 상품명, 판매단가, 품목·품종, 포장단위·규격, 판매가능수량, 상품등록일자가 들어 있다(전국 범위, CSV 약 21.9MB). 유통업체나 식자재 구매자가 "온라인 도매시장에서 이 품목·품종은 어떤 포장 규격에 얼마에 나와 있나"를 확인하거나, 분석가가 품목별 호가 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 KAMIS 도매·소매 가격 등 다른 가격 데이터와는 품목·품종 이름을 매핑해 붙여야 하고, 판매자 사업자등록번호로 사업자 정보와 대조하는 정도가 직접 연결 수단이다.
description_portal: 온라인 도매시장(KAFB2B)은  공식 허가를 받은 판매자와 구매자가 온라인을 통해 농산물을 거래하는 플랫폼으로, 기존의 도매시장과 달리, 거래단계는 축소되고 유통비용은 감소하는 전국단위 온라인 도매 플랫폼입니다. 본 데이터는 온라인 도매시장에서 거래되는 농산물의 정보를 담고 있으며, 각 상품에 대한 사업자명, 상품명, 가격, 품목/품종, 단위포장, 수량 등의 세부 정보를 제공합니다. 본  데이터를 통해 유통업체나 도매시장에서는 적정 가격 책정과 재고 관리에 도움이 됩니다. 또한, 농산물의 원산지, 품목, 품종 정보를 통해 소비자에게 신뢰할 수 있는 상품을 제공하고, 유통 경로를 투명하게 관리할 수 있습니다. 정부나 연구기관에서는 농산물 유통의 효율성 분석, 가격 예측 등 정책 수립에 활용할 수 있습니다.
