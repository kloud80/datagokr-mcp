description_portal: 경기도 양주시_농촌관광분야 농촌지도시범사업 현황 데이터는 양주시에서 추진한 농촌지도 시범사업의 내용을 체계적으로 관리하기 위한 자료다. 총 24행으로 구성되어 있으며, 관리기관명, 연도, 보조사업명, 통계구분, 재원, 주요사업내용, 보조사업자, 총사업비, 보조금, 자부담 등 다양한 항목을 포함한다. 이 데이터는 연도별·기관별 사업 추진 현황을 명확히 보여주어 농촌관광 활성화 정책 및 지원 방향을 수립하는 데 기초자료로 활용된다. 또한 보조금과 자부담 금액이 함께 제공되어 사업 재정 구조를 분석할 수 있고, 민간자치단체 및 정부 재원의 투입 비율을 비교하는 데 유용하다. 주요사업내용은 각 사업의 목적과 추진 방식, 기대 효과를 파악할 수 있는 중요한 지표가 되며, 농촌관광 인프라 확충, 지역 주민 소득 증대, 공동체 강화 등 다양한 측면에서 활용 가능하다. 이 데이터는 농촌 지역 개발 및 관광 산업 육성, 행정기관의 사업 평가 및 계획 수립 과정에서 핵심적인 참고 자료로 제공된다.
