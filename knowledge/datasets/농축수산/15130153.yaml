summary_user: 연안침식 피해가 심각하거나 우려되어 해양수산부가 지정한 연안침식관리구역의 구역 경계를 면(polygon) 단위로 담은 전국 범위 파일이며, 포털 설명상 맹방해변·봉편해변·꽃지해변 등 7개소가 지정되어 있다. 해안 개발·모래채취·연안정비 사업을 검토하는 사업자나 분석가가 '이 해변이 연안침식관리구역 안에 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 구역명·지명 매핑이나 공간 중첩으로만 이어 쓴다.
description_portal: '연안침식관리구역은 연안침식으로 인한 피해가 심각하거나 우려되는 지역을 정부(해양수산부)가 특별히 지정하여 관리하는 구역으로, 모래채취 제한 및 연안정비 사업 등을 통해 침식을 막고 해안선을 보호하며, 주민 피해를 예방하는 것을 목표로 합니다. 현재 맹방해변, 꽃지해변 등 국내 여러 지역이 이 구역으로 지정되어 있으며, 국가 차원에서 체계적인 관리가 이루어집니다. 주요 특징지정 목적: 연안침식 심화에 대응하여 피해를 예방하고, 자연 상태의 해안선을 보전하기 위함입니다.관리 주체: 해양수산부 장관이 지정하며, 「연안관리법」에 근거합니다.주요 관리 내용:모래채취 제한: 구역 내 모래채취를 금지하거나 제한하여 침식의 원인을 제거합니다.연안정비 사업: 침식 원인 정밀조사 후 정비 사업을 시행하여 해변을 복구하고, 주민 생활 안정을 도모합니다.토지 매수: 필요시 침식 피해 우려 지역의 토지를 매수할 수 있습니다.지정 현황: 현재 7개소가 지정되어 있으며, 맹방해변(강원 삼척), 봉편해변(경북 울진), 꽃지해변(충남 태안) 등이 포함됩니다. 관련 법령연안관리법: 제20조의2에 따라 연안침식관리구역을 지정하고 관리하는 근거가 됩니다.'
