summary_user: 국립수산물품질관리원의 수산검역(여행자 휴대품) 통계를 연·월과 품목명·학명별로 모은 전국 단위 집계 자료로, 건수·중량·환산중량·금액이 전체와 처분 구분별(적합, 반입금지 등으로 보이는 항목)로 나뉘어 있다. 분석가가 "여행객이 들여오다 반입금지된 수산물은 어떤 품목이 월별로 얼마나 되나" 같은 질문을 볼 때 쓴다. 실측 컬럼에 공통 조인 키가 없어, 다른 수산물 통계와는 연·월(YR, MM)과 품목명·학명을 이름으로 맞춰 이어 붙여야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국립수산물품질관리원에서 제공하는 수산검역(휴대품) 통계 정보입니다.\""
