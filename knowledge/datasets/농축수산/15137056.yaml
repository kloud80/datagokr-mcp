summary_user: 농촌진흥청이 언론에 배포한 보도자료를 건별로 모은 목록 파일로, 건마다 제목·보도일자·원문 보기 주소를 담는다(전국 단위, CSV 약 687KB). 기자·분석가·농업인이 '농촌진흥청이 특정 시기에 어떤 연구성과나 현안 대응을 발표했는가'를 날짜순으로 찾아볼 때 쓴다. 다른 데이터와 직접 이을 조인 키는 없으며, 보도일자나 제목 속 품목·주제어로 가격·통계 자료와 맞춰 보는 정도로만 연결한다.
description_portal: 농촌진흥청은 주요 정책, 연구성과, 현안 대응 등 국민이 알아야 할 다양한 소식을 보도자료 형식으로 작성하여 언론사에 배포하고 있습니다. 언론사는 이를 바탕으로 기사를 작성해 국민이 쉽게 접하고 이해할 수 있도록 전달하며, 농촌진흥청은 이를 통해 정책과 사업을 더욱 널리 알리고 있습니다. 이 서비스는 단순한 정보 제공을 넘어 정책 추진의 투명성을 높이고, 국민과 농업인 모두가 국가 농업 정책의 흐름을 신속하게 확인할 수 있도록 돕습니다. 또한 공신력 있는 언론을 통한 기사화 과정을 거쳐 정책 신뢰도를 강화하고, 국민과의 소통을 확대하는 중요한 홍보 창구 역할을 하고 있습니다.
