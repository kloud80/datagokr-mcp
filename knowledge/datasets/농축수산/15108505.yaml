summary_user: 백두대간 지역에 자생·재배되는 약용식물을 종 단위로 정리해 학명·국명·과명·영명과 형태 특징, 약용 정보, 유사종, 이미지 주소를 담은 정보 API이며, 범위는 전국·비공간으로 분류된다. 연구자나 서비스 개발자가 '이 약초의 학명과 약용 부위·효능은 무엇이고 비슷한 종은 무엇인가'를 확인하거나 약용식물 식별 서비스의 기초 자료를 마련하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식물·산림 데이터와는 학명(scnm)이나 국명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 백두대간 영역 내 자생 및 재배되는 약용식물 자원의 생태 정보와 효능 데이터를 체계적으로 관리하여 약용 유전자원의 보전 및 바이오 산업 활용 인프라를 구축할 목적으로 한국수목원정원관리원이 조사 및 수집한 약용식물 자원 정보를 제공하는 데이터입니다. 약용식물의 고유 식별 번호와 함께 학명 및 국명 중심의 표준 분류 체계를 수록하고 주요 약용 부위와 효능 정보 및 생육 환경 특성과 수집 이력 등의 세부 학술 데이터를 체계적으로 수록했습니다. 백두대간 약용식물 자원의 서식지 보전 정책 수립부터 천연물 기반 바이오 의약품 및 기능성 소재 연구와 인공지능 기반 약용식물 식별 서비스 개발의 기초 자료로 활용됩니다.
