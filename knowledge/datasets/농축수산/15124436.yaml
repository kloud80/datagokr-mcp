description_portal: '- 전라남도 각 시군별 임산물(조경재, 수실, 약용식물, 산나물, 버섯) 생산현황(생산량, 생산액)에 대한 정보를 조회하실 수 있습니다.- 전라남도는 다양한 임산물의 생산지로, 산림 자원을 활용한 임산업이 활발히 이루어지고 있습니다. 임산물은 산에서 자생하거나 재배되는 식물로, 식용, 약용, 공예, 산업용 등 다양한 용도로 활용됩니다.- 전라남도의 풍부한 산림 자원을 활용한 임산물 산업은 지역 경제와 주민들의 삶에 중요한 역할을 하고 있습니다. 지속 가능한 임산물 생산과 소비를 위해 지역 사회와의 협력이 더욱 중요해지고 있습니다.- 전라남도는 임산물의 생산과 유통을 촉진하기 위해 다양한 정책과 지원을 실시하고 있습니다.'
