summary_user: 축산농가 종사자·축산업 관련 종사자·가축 소유자와 동거가족이 해외로 나갈 때 낸 출국신고를 건별로 담으며, 성별·출국일시·귀국예정일·출발항·구분 항목을 전국 단위(비공간)로 제공한다. 방역 담당자나 분석가가 축산관계자의 해외 출국이 어느 시기, 어느 출발항에 몰리는지 보고 귀국 시점 방역 점검을 계획하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 출국일·출발항 같은 이름이나 날짜를 맞추거나 같은 기관 자료와 대조하는 방식으로만 잇는다.
description_portal: 축산관계자 출국신고를 통해 해외로 출국한 축산관계자의 출입국일, 신고방법, 이용항만 등의 현황 제공(축산관계자 중 해외로 출국시 출국신고 현황을 제공함)- 본 데이터는 축산관계자 및 동거가족 등이 해외 출국 시 제출한 출국 신고 현황을 종합적으로 정리한 자료임- 가축전염병 예방 및 국내 축산업 보호를 목적으로, 해외 위험지역등을 방문하는 축산농가 종사자, 축산업 관련 종사자, 가축 소유자 및 동거인을 대상으로 한 출국신고 내역을 포함함- 수집된 정보는 해외 가축전염병 발생국가 방문 여부, 고위험지역  체류 현황, 위험노출 가능성을 확인하기 위한 참조자료로 활용
