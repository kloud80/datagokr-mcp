description_portal: 본 데이터는 법적으로 지정 보호받거나 관리 필요성이 높은 보호식물 자원의 생태 이력을 보전하고 관련 정책 수립 기반을 마련할 목적으로 한국수목원정원관리원이 관리 및 조사한 보호식물 자원의 종합 정보를 제공하는 데이터입니다. 보호식물의 고유 식별 번호와 함께 학명 및 국명 중심의 표준 분류 체계를 구성하고 지정 법령 정보와 지정 등급 및 생육지 분포 특성과 관리 상태 등의 세부 항목을 체계적으로 수록했습니다. 국가 지정 보호식물의 자생지 복원 및 서식지 보전 관리 정책 수립부터 생물다양성 학술 연구와 생태계 모니터링 인프라 구축의 기초 자료로 활용됩니다
