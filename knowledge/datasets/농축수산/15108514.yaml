summary_user: 백두대간 보호식물을 종 단위로 정리한 API로, 국명·학명·과명, 특징과 생육지 설명, 희귀식물 등급, 특산식물 여부, 기후변화 취약종 여부, 이미지 주소를 담는다. 연구자나 생태 분석가가 '특정 식물이 희귀식물 몇 등급이고 특산식물이나 기후변화 취약종에 해당하는가'를 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 다른 식물·생물종 목록과는 학명(scnm)이나 국명을 맞춰 연결해야 한다.
limits: 전국 범위의 비공간 데이터라서 좌표나 행정구역이 없고, 자생지 위치를 지도에 표시하거나 지역별로 집계하는 데는 쓸 수 없다. 공통 식별 코드가 없으므로 학명 표기가 다르면 다른 데이터와 연결되지 않을 수 있다.
