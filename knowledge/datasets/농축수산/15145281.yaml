description_portal: 농림축산식품부에서는 교육실적관리정보를 제공합니다.본 정보 제공 데이터는 사업년도, 신청분기, 신청일련번호, 교육실적일련번호, 교육실적구분, 교육실적명, 교육시간, 발급기관, 비고, 승인구분, 교육인정시간등의 정보를 포함하고 있습니다.본 제공자료는 청년농업인영농정착지원사업의 일부 과정으로농가, 농업인, 청년조합원등을 대상으로 자격증이나 사업지원을 받기위한 교육이수 현황에 대한 정보를 보여주는 데이터 입니다.교육기관(발급기관)에서 진행한 교육 내용을 확인 할 수 있으며 비고 내용에서 교육 실시 일자, 교육수료증명, 교육관련 자격취득 정보, 수료증 발급에관한 정보등을 확인 할 수 있습니다.
