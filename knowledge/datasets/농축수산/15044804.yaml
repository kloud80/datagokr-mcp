description_portal: 가축사육업 현황은 가축을 사육하는 사업장의 분포와 기본 현황을 파악하기 위해 정리한 자료입니다. 이 자료에는 가축사육업이 이루어지는 지역 정보와 사육업 관련 사업장의 현황을 확인할 수 있는 항목이 포함되어 있어 시군구 단위로 가축사육업 분포를 살펴볼 수 있도록 구성되어 있습니다. 가축사육업 현황 자료는 축산업 관리와 관련된 행정 업무에서 기초적인 현황 파악을 위해 활용될 수 있으며 동일한 행정구역 단위의 농업 통계나 환경 관리 자료와 연계하여 참고할 수 있는 기준 정보로 활용될 수 있습니다. 또한 특정 시점 기준으로 작성된 현황 자료이므로 시기별 가축사육업 변동을 비교하거나 관리 대상 현황을 정리하는 데에도 활용할 수 있습니다. 이 자료는 가축사육업의 지역별 분포를 객관적으로 확인하기 위한 현황성 자료로서 축산업 관련 행정 기록 관리와 기초 통계 정리에 필요한 정보를 제공합니다.
