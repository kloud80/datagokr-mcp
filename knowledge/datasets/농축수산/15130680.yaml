summary_user: 경기도 시군별로 임대용 농기계 보유 대수를 이앙기·트랙터·콤바인·파종기·관리기·기타로 나눠 담은 집계 자료이며, 데이터 기준일자가 함께 붙는다. 농업기술센터나 지자체 담당자, 농업인이 '우리 시군 임대사업소에 트랙터나 콤바인이 몇 대 있고 다른 시군보다 부족한가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 시군별로 임대 가능한 농기계의 보유 현황을 정리한 자료입니다. 주요 항목에는 시군명, 이앙기수, 트랙터수, 콤바인수, 파종기수, 관리기수, 기타수 및 데이터기준일자가 포함되어 있으며, 각 시군이 보유한 다양한 농기계의 대수를 확인할 수 있습니다. 해당 데이터는 지역별 농기계 지원 현황을 분석하거나 농기계 수요예측, 농업기반시설 개선 정책 수립 등에 활용될 수 있습니다. 특히 농기계 보유 비율이 낮은 지역의 수요를 파악하거나 농기계 이용률 제고를 위한 자료로 유용합니다. 항목별 농기계는 농업 생산 활동에 필수적인 기계로, 해당 데이터는 농업기술센터나 지방정부의 농기계 지원정책 평가 및 계획 수립에 활용 가능합니다.
