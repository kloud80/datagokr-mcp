summary_user: 전국 도매시장(공영·일반법정·민영 구분)의 시장별 현황을 한 행씩 담은 파일로, 개장일, 입주법인 수, 시장도매인 수, 부지·건물·경매장·저온저장고·주차장 등 시설 면적(제곱미터)을 담는다. 유통 분석가나 출하 농가·도매업자가 "어느 도매시장이 경매장·저온저장 시설 규모가 크고 입주법인이 많은가"를 비교하거나, 경락 가격·반입물량 분석에 시장 규모를 곁들일 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS 경락가격·반입물량 등 다른 도매시장 데이터와는 시장명(시장명) 문자열을 맞춰 연결해야 한다.
limits: 시장 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 시장명 표기 차이를 직접 매핑해야 한다. 시설 규모 현황표일 뿐 경매 물량·가격·거래 실적은 담지 않으며, 품목코드도 KAMIS·도매시장·HS·KOSIS마다 달라 가격 데이터 연계 시 별도 매핑이 필요하다.
