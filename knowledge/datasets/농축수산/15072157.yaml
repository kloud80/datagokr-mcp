description_portal: 전국 도매시장(공영, 일반법정, 민영)의 현황 정보(개장일, 입주법인 수, 시장도매인 수, 부지규모, 건물규모, 등)입니다.도매시장 통합 홈페이지를 통해 제공하고 있는 데이터 입니다.* 도매시장 통합 홈페이지:aT가 운영하는 전국 공영도매시장 경매정보 통합 플랫폼입니다. 서울 가락동을 비롯한 32개 도매시장의 경매 물량, 가격, 거래 현황을 실시간으로 제공하며, 출하자 신고, 전자송품장 처리, 유통 통계 조회 등 다양한 기능을 지원합니다. 농가와 중도매인, 소비자가 모두 활용할 수 있어 투명한 가격 형성과 유통 효율성 제고에 기여하는 대표적인 농산물 유통 정보 서비스
