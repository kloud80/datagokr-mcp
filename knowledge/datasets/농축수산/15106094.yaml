summary_user: 전국에 설치된 어도를 한 건씩 담은 시설 현황 파일로, 연결된 보 명칭·관리기관·행정구역·하천권역과 수계, 도분초 좌표, 형식과 폭·길이·높이·경사도 같은 제원을 담는다. 하천 관리자나 수생태 연구자가 특정 수계나 시군구에 어도가 몇 개, 어떤 형식으로 설치돼 있는지 보고 개선사업 우선순위를 정하는 데 쓴다. 전역 조인 키는 없으므로 시군구명·하천명을 이름으로 맞추거나 도분초 좌표를 십진 좌표로 바꿔 하천·보 공간자료와 겹쳐 쓴다.
description_portal: 이 데이터는 해양수산부에서 전국 어도 현황을 파악하고 관리하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 전국에 설치된 어도의 명칭, 어도 관리기관, 어도의 주소 및 좌표 정보, 어도의 폭, 길이, 높이 등과 같은 어도 제원 정보 등으로 구성되어 있습니다.  본 데이터는 전국 어도 설치 현황 분석, 하천 및 강 유역의 생태 통로 실태 조사, 시설 유지관리 계획 수립, 어도 관련 정책 및 연구자료 근거 마련, 어도 개선사업 우선순위 선정, 지역별 수생생태계 연계성 평가 등과 같은 분야에 활용될 수 있습니다.
