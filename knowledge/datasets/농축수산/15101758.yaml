summary_user: 전국 가축 인공수정소를 한 곳씩 이름·주소·전화번호와 생성·수정 일시로 담은 시설 목록 데이터다. 축산 농가나 관련 사업자가 "우리 지역에서 연락할 수 있는 인공수정소가 어디인가"를 찾거나, 분석가가 지역별 시설 분포를 볼 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 주소나 시설명을 문자열로 맞춰 행정구역·지오코딩 자료와 이어 쓴다.
description_portal: 해당 데이터는 축산법 제17조에 따라 가축에 대한 인공수정 행위를 수행하는 시설 등에 근거한 가축 인공수정소 현황에 대한 통계자료입니다. 주요 항목으로는 이름, 전화번호, 주소 등을 포함하고 있습니다. 이를 통해 전국 가축 인공수정 시설의 분포와 규모, 운영 상황을 종합적으로 파악할 수 있습니다. 본 자료는 축산 정책 수립, 시설 관리 및 지원, 가축 번식 기술 보급, 질병 예방 및 축산 생산성 향상 등 다양한 분야에서 기초자료로 활용될 수 있으며, 효율적인 축산 인공수정 관리와 가축 개체수 유지, 농가 지원 정책 마련에도 중요한 근거 자료로 활용됩니다.
