description_portal: 농림축산식품부에서 지정한 대한민국식품명인 데이터입니다.대한민국식품명인은  식품의 제조ㆍ가공 및 조리 등 식품 분야에서 우리 식품의 계승ㆍ발전을 위하여 오랜 기간 종사해 온 사람으로서 「식품산업진흥법」  제14조제1항에 따라 농림축산식품부에서 지정합니다.1994년부터 동 제도를 운영해오고 있으며, 지금까지 총 99명이 지정되었고, 지정해제(사망 등)로 인해 2025년 9월 현재 81명이 활동 중입니다.데이터 내용은 지정 연도 및 지정일, 성명, 지정분야(기능, 품목), 소재지(시도 및 시군)입니다.매년 신규 지정이 이뤄지고 있으며, 데이터 등록 주기는 1년입니다.이와 관련하여 자세한 내용은 농림축산식품부 홈페이지 내 알림소식 > 공지공고 또는 보도자료에서 "식품명인"을 검색하시면 확인할 수 있습니다.
