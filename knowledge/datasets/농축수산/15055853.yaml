summary_user: 2018년 기준으로 양식어업권(면허)의 건수와 면적을 품종 구분(어류·패류·해조류·기타 양식생물)별 행, 부산·인천·울산·경기·강원·충남·전북·전남·경북·경남·제주 11개 시도별 열로 집계한 전국 단위 표입니다. 지역별로 어떤 품종의 양식 면허가 얼마나 많고 넓게 분포하는지 비교하려는 양식산업 정책 담당자나 어업 사업 기획자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도 이름이나 품종명을 직접 맞춰 연결해야 한다.
description_portal: 이 데이터는 해양수산부가 품종별 양식어업권(면허) 현황을 파악, 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 2018년도를 기준으로 품종별(어류, 패류, 해조류, 기타 양식생물)과 시도별로 구분하여 어업권 건수 및 해당 어업권 면적 정보를 제공합니다.본 데이터는 어업 관련 사업을 기획하거나 지역별 어업권 현황을 분석할 때 참고 자료로 활용될 수 있으며, 어업정책 수립 및 양식산업 지원 방안 마련, 각 지역에서의 수산자원 관리 및 어업인 지원 정책 자료 등으로도 활용할 수 있습니다.
