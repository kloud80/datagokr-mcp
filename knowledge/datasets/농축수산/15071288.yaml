description_portal: 해양생명자원통합정보시스템(MBRIS)는 해양생물 종 통계정보를 제공하고 있습니다. 주요정보에는 해양생물 분류군별 국내기록종, 국내확보종, 보유종, 보유점수에 대한 정보를 제공하고 있습니다. 또한, 해양생명자원 책임기관과 20여개의 기탁등록보존기관에서 보유하고 있는 현황정보도 제공하고 있습니다. 각 기관별로 국내확보종, 보유종, 그리고 표본과 표본외 자원의 현황정보를 제공하고 있습니다. 이러한 정보를 통해서 해양생물의 기록종 현황과 기록종 대비 확보한 현황을 한눈에 파악할수 있어 체계적으로 국내 해양생물 다양성정보를 확보 관리할수 있도록 기여하고 있습니다.
