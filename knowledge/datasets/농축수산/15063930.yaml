description_portal: 재정운영표는 농지관리기금의 한 해 동안의 재정 운용 결과를 종합적으로 나타낸 결산원장으로, 수입, 지출의 세부 내역과 자금운용 현황을 체계적으로 기록한 재무 보고서입니다.수익은 기금사업으로 인한 이자와 임대료 수입, 정부와 다른 기금으로부터 받는 출연금 등으로 구성됩니다.비용은 농지 지원 등 목적 사업을 위해 지출된 금액을 포함하고 있습니다. 재정운영표를 통해 농지관리기금의 재정 운영 성과를파악, 재정 건전성 분석, 정책결정에 활용하는 등 객관적인 지표로서 기초 자료로 활용됩니다.
