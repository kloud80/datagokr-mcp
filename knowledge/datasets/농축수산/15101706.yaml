summary_user: 과수시설현대화 사업의 지원 실적을 연도·시도·시군구·사업계획·품목·세부사업별로 집계해 사업량, 단가, 국고보조·지방비·융자·자부담 금액을 담는다. 지자체 담당자나 과수 정책 분석가가 "어느 시군에 어떤 과수 품목의 시설 현대화(과원 정비·용수원 개발 등) 예산이 얼마나 투입됐나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 시도·시군구 이름과 코드(CTRD_CODE, SIGNGU_CODE)를 행정구역 코드표에 맞춰 다른 지역 통계와 잇는다.
description_portal: 해당 데이터는 생산시설 현대화를 통한 고품질 과수를 생산하고 재해를 예방함으로써 과수산업의 경쟁력을 강화하기 위해 추진된 지역별 시설 지원 실적 현황을 제공합니다. 이를 통해 우량품종 갱신, 과원 정비, 농로 개선, 용수원 개발 등 다양한 시설 현대화 사업이 지역별로 어떻게 지원되었는지를 확인할 수 있으며, 지원 대상 농가와 시설 규모, 투자 내역 등을 종합적으로 파악할 수 있습니다. 이러한 데이터는 고품질 과수 생산 기반을 마련하고, 재해 대응 능력을 높이며, 지역 농업 경쟁력 강화 및 지속 가능한 과수 산업 육성을 위한 정책 수립과 전략 마련에 중요한 기초 자료로 활용될 수 있습니다.
