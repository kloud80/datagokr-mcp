summary_user: 해양수산부 어선거래시스템에 등록된 어선 매물의 선박 정보(선박번호, 선박명 등)와 거래 현황을 전국 범위로 담은 파일 데이터로, 포털 설명상 선박구분·어업유형·총톤수 같은 매물 항목을 포함한다. 어선을 사고팔려는 어업인이나 어선 시장 동향을 보는 분석가가 '지금 어떤 어선이 매물로 나와 있고 거래 추이는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 어선 등록 원장 등 다른 자료와는 선박번호·선박명 같은 이름·번호 매칭으로만 이어 쓴다.
