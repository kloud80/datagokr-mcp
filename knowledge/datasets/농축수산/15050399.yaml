summary_user: 국립농산물품질관리원이 GAP(농산물우수관리) 인증담당자와 시설담당자를 대상으로 실시하는 연간 교육 일정을 교육 회차 단위로 담으며, 교육일자·교육지역·교육기관·교육장소·교육인원으로 구성되고 범위는 전국이다. 인증기관 직원이나 시설인증사업자가 '이수 조건을 채우려면 언제 어느 지역 교육에 참여해야 하나'를 확인하거나 신규 채용 직원의 교육 일정을 잡는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육지역·교육기관 이름을 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: GAP 인증담당자 및 시설담당자 교육일정 정보는 GAP(농산물우수관리) 인증담당자 및 시설담당자를 대상으로 국립농산물품질관리원에서 실시하는 연간 교육 일정 정보로서, 교육일자, 교육지역, 교육기관, 교육 장소, 교육 인원 항목으로 구성되어 있습니다. 교육을 희망하는 인증담당자 및 시설담당자가 본 정보를 통하여 필요한 시기에 교육에 참여할 수 있으며, 교육 이수 조건 충족을 위한 참고자료로 활용할 수 있습니다. 아울러, 인증기관이나 시설인증사업자는 소속 직원 채용 등으로 인한 교육 수요에 대응할 수 있습니다.
