description_portal: 국산 목재(제재목)의 육안등급에 따른 구조 설계값 산출에 활용할 수 있는 역학 성능 중 압축 강도 데이터입니다. 크기가 두께 38 mm, 너비 89 mm, 3600 mm인 낙엽송 제재목에 대한 육안등급 구분 경과와 실대제 성능 실험을 결과로 포함하고 있습니다. 육안등급은 국립산림과학원 고시<목재제품의 규격과 품질기준의> 부속서 1(제재목)에 따라 옹이, 연륜, 굽음을 측정하여 결정(열 6)하였습니다. 파괴가 발생한 부분의 목재 결점이 옹이인 경우, 옹이의 종류와 크기를 측정하여 파괴된 부분의 육안등급(열 9)을 기록하였습니다. 실대재 성능 실험에서 얻어진 최대 압축 하중(열(10)을 제재목 단면적의 크기(38X89 mm2)로 나눠  압축 강도(열11)를 산출하였습니다.
