description_portal: 이 데이터는 해양수산부에서 해양생물다양성지수에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 조사일자, 조사계절, 조사경도, 조사위도, 식물플랑크톤지수, 동물플랑크톤지수, 대형저서동물지수, 공간정보 데이터로 구성되어 있습니다.본 데이터는 해양생물다양성지수 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양생물다양성지수란 해양 생물의 종 다양성, 생태계 다양성, 유전자 다양성을 종합적으로 나타내는 지표를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
