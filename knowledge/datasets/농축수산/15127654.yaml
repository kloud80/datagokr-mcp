description_portal: 이 데이터는 해양수산부에서 연안정비사업 내 연안침식과 관련된 등급, 현황 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 연안침식 등급, 등급 현황, 등급 연도별 집계로 구분되어 있으며, 연안침식 등급 정보는 지역명, 일련번호, 등급 구분코드 등 정보, 현황정보는 조사년도, 연안침식으로 인한 지표 변화정보, 연도별 집계는 각 지역의 연도별 등급코드 정보로 구성되어 있습니다.본 데이터는 연안 지역의 침식 상태를 분석하여 연안 정비 계획 수립, 환경 영향 평가, 해안선 변화 연구 등에 활용될 수 있습니다.
