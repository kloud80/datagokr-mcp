summary_user: 전국 연안을 시도·시군구·침식지역 단위로 나눠 지역별 연안침식 등급과 조사년도별 현황을 담고, 2003년부터 2018년까지 지역별 연도 등급을 한 행에 펼친 집계도 함께 제공한다. 연안 지자체 담당자나 해안선 변화 연구자가 "우리 시군구 해변의 침식 등급이 해마다 어떻게 달라졌나"를 확인하고 연안정비 계획 대상지를 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시도·시군구 이름이나 기관 내부의 연안침식지역코드(cstWashArCd)·GIS키값으로 맞춰 이어 쓴다.
