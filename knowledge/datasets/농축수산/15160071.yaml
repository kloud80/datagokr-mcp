summary_user: 서해 배타적경제수역(EEZ)을 특성평가용 격자로 나눈 공간정보를 격자 단위로 담은 파일로, 격자마다 공간정보 일련번호·격자번호·격자아이디·레이어명·레이어 분류설명이 들어 있다(CSV 약 14KB). 해양공간계획 담당자나 해상풍력 등 입지를 검토하는 분석가가 '서해 EEZ의 특정 해역이 어떤 평가 격자에 속하고 어떤 레이어로 분류되는가'를 확인하는 기초 자료로 쓴다. 전역 조인 키는 없어서 다른 데이터와는 격자번호·격자아이디 같은 이름 매핑이나 해양수산부 내부 코드로만 이어 붙일 수 있다.
description_portal: 이 데이터는 해양수산부에서 서해EEZ 특성평가격자에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 격자번호, 격자아이디, 레이어명, 레이어분류설명 데이터로 구성되어 있습니다.본 데이터는 서해EEZ 특성평가격자 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
