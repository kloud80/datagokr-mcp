summary_user: 버섯 유전자 전사체 서열을 기존 유전자집단과 비교한 정렬 결과를 서열 한 건씩 담은 CSV 파일(약 1MB)로, 유사유전자의 길이·시작·끝 위치·매칭율과 대응 유전자집단의 설명·고유번호(Accession)·매칭 비율을 함께 담는다. 버섯 유전체를 연구하거나 품종을 개발하는 연구자가 "이 전사체 서열은 어떤 기능의 유전자와 얼마나 닮았나"를 확인하고 유전마커 후보를 고를 때 쓴다. 공공데이터 사이의 전역 조인 키는 없고, 유전자집단 고유번호(Accession)로 외부 유전자 서열 데이터베이스의 정보를 찾아 대조하는 방식으로 이어 쓴다.
description_portal: 버섯 유전자 전사체 분석 및 서열 배열 정보(유전체 염기서열 분석 및 각 염기서열의 기능 주석 작업을 통하여 주요 분자의 유전마커 확립을 위한 정보 제공)버섯 유전자 전사체의 서열 배열 및 기능 주석 정보를 제공하여 주요 분자의 유전마커 확립에 활용할 수 있다. 유사유전자 이름, 길이, 시작 및 끝 위치, 매칭율, 유전자집단 설명, 고유번호, 매칭비율 등 다양한 항목을 포함한다. 버섯의 유전체 연구, 품종 개발, 생명공학, 분자생물학 연구 등 다양한 분야에서 활용 가능하며, 최신 유전체 분석 결과를 반영하여 주기적으로 갱신된다.
