description_portal: 이 데이터는 해양수산부에서 인공어초종류집에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 어초명, 입력일, 어초개발자, 어초개발년도, 어초재질, 어초상세설명, 최종 권리자, 선정년도, 개당단가, 어류 설계단가, 해조류, 설계단가 데이터로 구성되어 있습니다.본 데이터는 인공어초종류집 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.인공어초종류는 대상 어종과 해양 환경에 따라 다양하며, 주로 어류용, 패조류용으로 나뉘고, 재질로는 콘크리트, 강재, 복합소재, 세라믹 등이 있습니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
