summary_user: 농수축산물의 산지·도매·소매 유통단계 사이에서 품목코드·단위·포장 기준을 맞추기 위한 변환 규칙을 단계·품목별 행으로 담은 전국 단위 기준 정보로, 가격 자체보다 단계 간 환산 규칙을 담는다. 분석가나 유통업자가 '산지에서 kg 단위로 거래된 품목이 소매에서는 어떤 단위·코드로 바뀌는가'를 확인해 단계별 가격을 같은 기준으로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 유통단계 코드(STEP_CODE)·품목코드·단위코드를 KAMIS 등 다른 가격 데이터의 품목명·코드와 직접 매핑해 이어 써야 한다.
description_portal: 농수축산물에 대한 유통단계별(산지, 도매, 소매) 품목별 가격 정보를 동일기준으로 재가공한 유통통합 정보입니다. 본 데이터는 농수축산물의 유통 전 과정에서 발생하는 가격 변동 및 품목의 특성을 보다 명확하게 이해하고 분석할 수 있도록 지원합니다. 이를 통해 소비자와 판매자는 가격 정보에 대한 투명성을 확보할 수 있으며, 정부와 정책 입안자는 이를 바탕으로 유통 정책 및 시장 개발 방향을 설정하는 데 큰 도움을 받을 수 있습니다. 유통단계별 변환규칙 정보는 산지, 도매, 소매 간의 품목코드, 단위, 등급, 포장상태 등과 같은 세부 정보를 포함하여 다양한 유통 단계를 아우르는 표준화 및 규칙 정립을 목적으로 합니다. 또한, 제공되는 데이터는 농수축산물의 유통 과정 전반에 걸쳐 발생하는 변환비율을 명확히 하여, 실제 유통 과정에서의 효율성을 높이는 데 기여합니다. 관련 오퍼레이션으로는 농수축산물 유통단계별 변환 규칙 정보를 제공하며, 이 API를 통해 사용자는 단계별로 품목의 변환규칙과 가격 정보를 정리하여 활용할 수 있습니다.
