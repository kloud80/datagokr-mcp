description_portal: '농림수산식품교육문화정보원 농업온 시스템의 지역 시군코드에 대한 데이터는 한국의 시군구를 식별하기 위한 기본 정보를 제공합니다. 본 데이터는 농업 물자와 정책을 지원하고 분석하기 위해 사용되며, 시군구코드, 시도코드, 시군구명, 기상청시도코드, 기상청시군구코드를 포함하고 있습니다. 이러한 정보는 농업 교육 및 기술 지원 프로그램, 지역별 농업 통계 수집, 기상 예보와의 연계 등 다양한 분야에 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 시군구코드(숫자형) : 해당 지역의 고유 식별 번호를 나타내며, 시도코드(숫자형) : 해당 지역이 속한 주의 고유 식별 번호를 나타냅니다. 시군구명(문자형) : 지역의 이름을 상세히 설명하며, 기상청시도코드(숫자형) : 기상청에서 정의한 주의 코드, 기상청시군구코드(숫자형) : 기상청에서 정의한 지역 코드로 구성되어 있습니다. 이러한 데이터는 정부 및 민간 기관에서 정책 수립 및 계획에 중요한 기초자료로 활용될 수 있습니다.'
