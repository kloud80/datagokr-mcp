description_portal: 한국해양교통안전공단은 항만에서 수행되는 건설작업 과정에 투입되는 항만건설작업선 정보를 국민과 산업계에 제공하기 위하여 본 데이터를 개방한다. 본 데이터에는 항만건설장비를 탑재하여 항만구역 내에서 건설작업을 수행하는 선박으로, 기중기선, 준설선, 항타기선, 지반개량기선 등이 포함된다. 해당 선박은 선박검사를 받아야 하며, 본 데이터는 우리 공단에 검사된 현황을 확인할 수 있도록 구성되어 있다. 특히 항만건설작업선은 건조 시점과 장비 설치 방식에 따라 구분된다. 2007년 11월 4일 이후 건조되어 선박으로 등록된 항타기, 지반개량기, 기중기, 준설기를 설치한 부선과, 동일 시점 이전 건조·등록된 해당 장비 설치 부선이 이에 포함된다. 또한 건설기계관리법에 따라 등록·안전검사를 받아오던 준설선 역시 현행 규정에 따라 관리 대상에 속한다. 본 데이터는 항만공사 수행 선박의 안전성과 합법성을 확보하기 위한 기반 자료로서, 행정기관의 정책 수립과 민간기업의 사업계획 검토, 연구기관의 학술연구 등 다양한 분야에서 활용될 수 있다. 공단은 본 데이터 개방을 통해 투명성을 보장하고, 국민에게는 이해 가능한 정보 제공을, 산업계에는 실질적 활용 가치를 제공한다.
