status: active
summary_user: 한국농수산식품유통공사가 도매시장·법인·상품 분류·단위별로 조회일 기준 평균출하수량과 평균출하량, 그리고 1~4주 전 같은 값을 함께 담은 전국 범위의 주간 추이 집계 데이터다. 농업인이나 유통업자가 "이번 주 특정 도매시장에 들어오는 품목 물량이 한 달 전보다 늘었나"를 보고 출하 시기와 출하처를 고를 때 쓴다. 상품대분류·중분류 코드(gds_lclsf_cd, gds_mclsf_cd)가 있지만 전역 조인 키는 없어, 같은 기관의 도매 경락가격·반입물량 데이터와는 코드나 이름을 맞춰 잇고 KAMIS·HS·KOSIS 품목코드와는 별도 매핑이 필요하다.
limits: 공유되는 전역 조인 키가 없어 다른 기관 데이터와는 품목·시장 이름이나 코드 매핑으로만 연결된다. 품목코드 체계가 KAMIS·도매시장·HS·KOSIS마다 달라 그대로 합치면 품목이 어긋날 수 있다. 개발계정은 하루 10,000회로 호출이 제한된다.
