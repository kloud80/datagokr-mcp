summary_user: 전국 잠업 현황 통계 가운데 뽕나무 묘목의 생산·공급 현황을 담은 전국 단위 집계표이며, 지역별 공간 정보는 없다. 잠업 정책 담당자나 양잠 창업을 검토하는 사람이 뽕나무 묘목이 얼마나 생산·공급되는지 보고 누에 생산 기반의 규모를 가늠하는 데 쓴다. 실측 컬럼에서 공통 조인 키가 확인되지 않아 다른 데이터와는 연도·항목 이름을 맞추거나 같은 기관의 잠업 통계끼리만 이어 쓴다.
description_portal: 해당 데이터는 뽕나무 묘목 생산공급 현황에 관한 데이터로, 잠업에 종사하는 전국의 모든 잠업가구를 대상으로 양잠 형태별 생산 현황, 누에 생산량 및 판매현황 등을 제공하고 있습니다. 이를 통해 잠업 산업의 전반적인 규모와 생산 구조를 이해할 수 있으며, 뽕나무 묘목 공급과 누에 생산량 간의 연계성을 파악할 수 있습니다. 또한 잠업 관련 정책 수립, 산업 지원 전략 마련, 신규 창업 또는 생산 효율화 방안 개발 등에 활용할 수 있습니다. 이러한 데이터는 잠업 산업의 경쟁력 강화와 지속 가능한 생산 체계 구축, 뽕나무 묘목 및 누에 생산 관련 농가 지원 정책 마련을 위한 기초 자료로 활용될 수 있으며, 전국 단위의 잠업 현황을 종합적으로 이해하고 산업 발전 방향을 모색하는 데 중요한 통계적 근거를 제공합니다.
