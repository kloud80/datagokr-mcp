description_portal: 해당 데이터는 한국산림복지진흥원에서 산림치유숲길을 이용한 방문자를 대상으로 측정한 건강정보(운동량 측정)에 관한 자료입니다. 주요 항목으로는 일자, 성별, 연령대, 시작시간, 측정기간, 이동거리, 심박수, 속력, 칼로리 소모량, 산소섭취량 등이 포함되어 있으며, 이용자의 산림 활동 중 건강 변화와 신체 반응을 정량적으로 파악할 수 있습니다. 이 자료는 산림치유 효과 검증, 건강 증진 프로그램 개발, 맞춤형 산림복지 서비스 기획 등에 활용 가능한 기초 데이터로 의미를 기지고 있습니다. 단, 2021년부터 수집된 자료는 국가연구개발사업(과제번호:2021384A00-2123-0101)의 일환으로 생산된 정보로, 「공공기관의 정보공개에 관한 법률」 제9조 제5호에 따라 공개가 제한됩니다.
