description_portal: '가축분퇴비는 **가축의 분뇨를 발효·부숙시켜 만든 퇴비(有機肥料)**입니다. 축산환경 개선, 자원 재활용, 화학비료 대체 등 다양한 측면에서 중요한 자원으로 간주됩니다. 하지만 적정 부숙 없이 살포될 경우 악취, 병해충, 토양 오염 등 환경문제를 유발할 수 있기 때문에 엄격한 관리 기준과 법적 규정이 적용됩니다.-정의: 소, 돼지, 닭 등 가축의 분뇨에 톱밥, 왕겨 등 부숙보조재를 섞어 발효시킨 퇴비-형태: 고체 형태로, 포대 또는 더미 형태로 농경지에 살포-목적: 유기물 공급, 토양개량, 화학비료 절감본 데이터는 충청남도 아산시 관내 가축분비료 제조업체 현황으로 업체명, 비료종류, 업체주소, 업체전화번호의 내용을 포함합니다.'
