description_portal: 본 데이터는 국내 정원 산업 활성화와 식물 소재 정보의 표준화 기반을 마련할 목적으로 한국수목원정원관리원이 수집 및 검증한 정원식물 자원의 생육 및 활용 정보를 제공하는 정보입니다. 정원식물의 고유 식별 번호와 함께 학명 및 국명 중심의 기본 분류 체계를 구성하고 생육 특성과 개화 시기 및 주요 용도와 관리 방법 등의 세부 특성 데이터를 체계적으로 수록했습니다. 일반 대문의 정원 조성 및 식재 계획 수립부터 식물 컨텐츠 개발과 정원 산업 관련 학술 연구 및 데이터 기반 정원 관리 인프라 구축에 표준 자료로 활용됩니다.
