summary_user: 한국수목원정원관리원이 수집·검증한 정원식물을 종(식물) 단위로 정리한 정보로, 국명·학명·과명과 특징, 꽃 색, 개화·결실·잎 관련 시기, 재배 관리 방법, 정원 활용 정보, 이미지 주소를 담으며 범위는 전국·비공간이다. 정원을 꾸미려는 개인이나 조경·정원 사업자가 '봄에 노란 꽃이 피고 관리가 쉬운 정원식물은 무엇인가' 같은 식재 계획 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 국명(krnm)·학명(scnm) 같은 이름 매칭으로만 이어 쓴다.
limits: 공통 식별 코드가 없어 다른 식물·산림 데이터와 이름 매칭으로만 연결되며, 국명 표기 차이로 매칭이 어긋날 수 있다. 위치 정보가 없는 비공간 데이터라 수목원 위치나 자생지 분포는 알 수 없다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
