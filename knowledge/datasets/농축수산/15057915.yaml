summary_user: 한국마사회 서울·제주·영남(부산경남과 영천 합산) 경마장에 소속된 현역 조교사 한 명 단위로 생년월일·나이·데뷔일자·소속조와 통산 및 최근 1년의 출주·1~3위 횟수, 승률·복승률·연승률을 담는다. 경마 팬이나 분석가가 '특정 경마장 조교사 중 최근 1년 승률이 가장 높은 사람은 누구인가'처럼 조교사 성적을 비교하는 데 쓴다. 전역 조인 키는 없고, 조교사번호(trNo)·조교사명과 시행경마장 구분으로 같은 한국마사회의 경주·마필 관련 데이터와 이름·코드 매핑으로만 잇는다.
description_portal: 한국마사회 서울, 부산경남, 제주 경마장에 소속된 조교사에 대한 정보를 제공합니다. (제공자료는 생년월일, 나이, 데뷔일자, 통산 출주횟수, 통산 1위횟수, 통산 2위횟수, 통산 3위횟수, 통산 승률, 통산 복승률, 통산 연승률, 최근1년 출주횟수, 최근1년 1위횟수, 최근1년 2위횟수, 최근1년 3위횟수, 최근1년 승률, 최근1년 복승률, 최근1년 연승률 자료입니다.) - 요청메세지는 시행경마장구분(meet:1.서울,2.제주,3.영남), 조교사명(tr_name), 조교사번호(tr_no)를 이용하여 자료를 조회할 수 있습니다.- 현역 조교사 자료만 표출되도록 개선 되었으며 생년월일과 나이(조회기준일이 생일 이전이면 -1 계산) 표출되도록 개선 되었습니다.※ 영천경마 시행에 따른 시행경마(권역) 표출시 부산경남경마와 영천경마를 합쳐서 영남경마로 표출합니다.
