description_portal: 이 데이터셋은 제주특별자치도 관내에서 법정 가축전염병에 해당하지 않는 ‘비법정 가축질병’에 대해 실시된 진단 내역을 정리한 공공데이터로, 검사 대상 농가 및 축종, 검사 날짜, 검사 항목, 검사 결과 등이 포함되어 있다. 법정 지정 질병 이외 가축 건강 상태 및 기타 위생 문제를 포괄적으로 관리하기 위해 활용된 자료이며, 각 농가에서 어떤 병이 진단되었는지, 검사 빈도 및 결과 분포를 분석할 수 있다. 이를 통해 축산 위생 수준, 질병 발생 패턴, 농가 건강 관리 실태, 예방 조치 필요 구역 파악, 가축 복지 및 방역 정책 수립 등에 유용한 기초 정보를 제공한다. 데이터는 CSV 형태로 공개되어 있으며, 누구나 무료로 다운로드하여 분석 및 활용이 가능하다.
