summary_user: 농식품 공공·빅데이터 활용 창업경진대회의 수상작을 작품 한 건 단위로 담으며, 대회명·분야와 포상·작품명·활용한 공공데이터명·등록일로 구성되고 범위는 전국·비공간이다. 창업 준비자나 공공데이터 활용자가 '농식품 공공데이터로 어떤 창업 아이템이 수상했고 어떤 데이터를 썼나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 활용 공공데이터명(활용 공공데이터명)을 데이터셋 제목과 이름으로 맞춰 해당 원천 데이터를 찾아 잇는 방식으로만 연결한다.
description_portal: 농림축산식품부는 농식품 공공·빅데이터 활용 창업경진대회에 대한 정보를 제공합니다. 이 데이터는 대회명, 분야, 포상, 작품명, 활용된 공공데이터명, 데이터 등록일 등을 포함하고 있습니다. 이를 통해 농식품 분야의 공공데이터를 활용한 창업 아이디어를 발굴하고, 관련 기술 및 사업화 가능성을 평가하는 데 활용됩니다. 또한, 공공데이터를 활용한 창업 사례를 통해 농식품 산업의 디지털 혁신과 창업 생태계 활성화에 기여하고자 합니다. 이러한 정보는 농식품 분야의 창업자, 연구자, 공공데이터 활용자 등에게 유용한 참고자료로 활용될 수 있습니다.
