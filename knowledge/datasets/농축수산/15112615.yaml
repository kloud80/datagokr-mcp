summary_user: 해양수산부가 전국 해역을 격자로 나눠 3분 간격(3단계) 격자별로 파고·파향·파장·평균파주기를 분석일자·분석시간 단위로 담은 API 데이터다. 선박 운항자나 해양 레저·구조 계획 담당자가 특정 해역 격자의 특정 시각 파고와 파향이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어 격자코드(gridCd)와 경도·위도 좌표를 기준으로 다른 해양 관측·예보 데이터와 위치를 맞춰 잇는다.
description_portal: 이 데이터는 해양수산부에서 3분 간격(3단계)의 격자별 파랑 속성정보를 제공하기 위해 수집한 데이터입니다.  격자번호, 분석일자, 분석시간 등 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 격자코드, 분석시간, 평균파주기, 파향, 파고 등으로 구성되어 있습니다.  본 데이터는 선박 운항 경로 선정, 해상 구조활동 계획, 해양 시설물 설계, 연안 안전성 평가 등 해양 공간 활용에 필요한 기초 자료로 활용될 수 있습니다. 또한, 해안 침식이나 해상 교통 흐름 분석, 해양 기상 예측 모델 구축 등 전문 분석 업무에도 적용할 수 있습니다.
