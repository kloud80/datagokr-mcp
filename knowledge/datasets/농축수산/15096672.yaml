summary_user: 제주특별자치도 전체를 대상으로 2015~2020년 연도별·과수 품종(대분류·소분류)별 생산면적(ha)과 생산량(톤)을 담은 시도 단위 집계 통계다. 농업 분석가나 정책 담당자가 "제주에서 감귤 품종별 재배면적과 생산량이 해마다 어떻게 바뀌었나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 품종 이름을 맞춰 연결해야 하고, KAMIS 등 유통 가격 데이터와 붙이려면 품목코드 매핑이 따로 필요하다.
description_portal: 이 데이터셋은 제주특별자치도 전체를 대상으로 2015년부터 2020년까지 연도별 및 과수의 품종 대분류 및 소분류 기준으로 ‘생산면적(헥타르)’과 ‘생산량’을 기록한 통계 자료이다.  CSV 형식으로 공개되며, 품종별로 어떤 과수가 어느 정도 면적에서 얼마나 생산되었는지 체계적으로 파악할 수 있어 농업 현황 분석, 품종별 생산량 추이 파악, 농산물 정책 및 유통 계획 수립, 지역 농업 경쟁력 평가, 기후변화 대응 농업 전략 수립 등 다양한 목적으로 활용할 수 있다. 또한 과수 재배 패턴 변화, 품종별 수확량 증감, 지역 특화 작목 파악, 농업 인프라 배치와 농산물 공급 계획 등에 유용한 기초 데이터로 기능한다.
