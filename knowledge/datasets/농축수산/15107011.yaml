description_portal: '이 데이터는 RPC 시설을 식별하고 그 규모를 파악하는데 필요한 세가지 핵심 정보만 포함합니다.1. 주소 및 연락처(식별 정보)  - RPC 명칭: 핵심 식별자이며, 분석 시 동일 법인/계열사를 묶는 기준으로 사용됨  - 주소: RPC 시설이 위치한 정확한 소재지  /  - 연락처: RPC와 접촉할 수 있는 전화번호 등2. 설치 년도(이력 정보) : 해당 RPC 시설이 가동을 시작한 연도(시설의 노후도 및 운영 기간 파악 가능)3. 시설 규모(물리적 현황) : RPC의 전체 크기나 연간 처리 능력(톤), 혹은 저장 시설 규모(톤) 등 해당 시설의 물리적 크기를 나타내는 단일 지표,      일반적으로 시설 규모는 1년 동안 최대로 처리(도정) 가능한 벼의 무게(톤)를 의미하는 경우가 많으며, 이 수치는 해당 RPC가 지역 쌀 생산량 중 어느 정도를 감당할 수 있는지를 나타내는 지표4. 저장 시설 용량 : 시설 규모에 포함될 수 있는 중요한 항목으로, 벼 수확기 이후 원료곡를 얼마나 효율적으로 장기 보관할 수 있는지를 나타냄. 이는 쌀의 품질 유지 및 수급 조절 능력과 직결됨.* 데이터 활용: 이 데이터는 운영 효율성 지표(가동률, 판매량 등)나 세부 가공 설비 현황과 같은 정보가 제공되지 않으므로, RPC의 단순 현황 파악 및 지리적 분포 분석에 주로 활용될 수 있음** 미곡종합처리장(RPC)  - RPC는 농가에서 수확한 벼를 쌀 제품으로 만드는 전 과정을 일괄 처리하는 종합 관리 시설입니다.  - 주요 기능은 벼의 수집, 건조/저장, 도정(가공), 선별 및 포장, 유통/판매입니다.  - 도입 목적은 농가의 노동력 및 비용 절감을 돋고, 과학적인 관리를 통해 쌀의 품질을 균일하게 향상시키는 것입니다.  - RPC는 고품질 쌀의 브랜드화와 생산 계열화를 통해 농가 소득 증대에 기여합니다.  - 주로 농협이나 민간 법인에 의해 운영되며, 쌀 산업의 경쟁력을 높이는 핵심 거점 역할을 합니다.'
