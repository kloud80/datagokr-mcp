description_portal: 본 데이터셋은 농림축산식품부 국립종자원이 관리하는 ‘정부보급종 원종정선 현황’ 정보를 제공한다. 작물별 정부보급종(원종)과 정선(선정) 결과를 연도별·품종별로 정리하여 보급 대상 품종, 선정 기준, 보급 현황 등을 한눈에 파악할 수 있다.  데이터는 매년 국립종자원에서 현장 조사와 품종 시험 결과를 종합해 업데이트하며, CSV·XLSX 형식으로 제공된다. 주요 항목은 작물명, 품종명, 원종 여부, 정선 연도, 보급량, 지역별 배포 현황 등이며, 식별코드와 설명을 함께 제공해 연계 분석이 용이하도록 설계되었다.  연구자는 품종 개선·신품종 개발에, 지방자치단체와 농업인은 보급계획 수립에, 정책 담당자는 보급 효율성 및 품질 관리에 활용할 수 있다. 또한 빅데이터와 GIS와 연계해 지역별 보급 효과를 시각화하고, 향후 종자 정책 수립의 근거 자료로 활용할 수 있다.
