description_portal: '- 국가농식품 통계 서비스 입니다.- 전남도 22개 시군의 채소, 시설채소 재배 농가수, 재배면적, 수확면적, 생산량, 전년대비 증감률 정보 통계자료를 제공합니다. - 전라남도는 전국 배추 생산량의 약 40%를 차지하며, 무와 고추도 주요 생산 품목으로 꼽힙니다.- 전라남도는 다양한 채소작물의 주요 생산지로 알려져 있으며, 지역별로 특화된 품목들이 있습니다. - 전라남도의 채소작물은 지역 특성에 맞춰 다양하게 재배되며, 국내외 시장에서 높은 평가를 받고 있습니다. 앞으로도 지속 가능한 농업과 품질 높은 생산을 위해 다양한 지원과 노력이 필요합니다.'
