description_portal: 본 데이터는 어업경영체를 대상으로 실시한 현지조사 결과 중, ‘기타 양식품종’에 대한 생산 현황과 경영 실태를 기록한 정보를 제공합니다.각 조사 건마다 고유하게 부여되는 현지조사접수번호와 현지조사번호, 그리고 행정구역별 지청코드 및 지청코드명 등을 통해 조사 단위와 행정기관 정보를 식별할 수 있습니다. 조사 과정에서 확인된 사육 현황과 생산 실적은 현재사육량, 생산량, 생산금액 등 주요 항목으로 수집되며, 양식 경영체가 생산·출하 구조를 어떻게 운영하는지를 보여주는 계통판매비율과 비계통판매비율도 함께 제공됩니다.
