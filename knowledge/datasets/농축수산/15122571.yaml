summary_user: 농업온 시스템의 영농가이드로, 작물 한 종마다 한 행에 제철 시기, 재배 난이도, 재배 시작·종료월, 발아·생육 적정 온도, 연작피해 여부, 재배팁·효과·주요성분을 담은 전국 단위 작물 재배 안내 파일(csv 약 30KB)이다. 귀농인이나 텃밭을 가꾸는 사람이 '이 작물은 몇 월에 심고 몇 도에서 잘 자라며 키우기 어려운가'를 확인하거나, 교육 담당자가 영농 계획·작물 선택 자료를 만드는 데 쓴다. 이어 쓰는 키는 영농작물번호(agrion_farm_crop_no)뿐이며, KAMIS 가격 데이터의 품목코드와 대응하는 코드는 없어 가격과 붙이려면 작물명으로 따로 매핑해야 한다.
description_portal: '농림수산식품교육문화정보원 농업온 시스템의 영농가이드에 대한 데이터로서, 영농작물번호, 작물명, 작물자음, 제철명, 제철월, 난이도 코드 등의 항목을 포함하고 있습니다. 본 데이터는 다양한 작물에 대한 재배 정보를 제공하여 농업 종사자들이 효율적으로 작물을 재배할 수 있도록 돕는 중요한 자료입니다. 농업에 대한 이해를 돕고, 최적의 재배 기간 및 환경 조건을 제공하여 생산성을 높이는 데 기여합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 영농작물번호(숫자형) : 각 작물에 대한 고유 식별 번호입니다. 작물명(문자형) : 재배할 작물의 이름입니다. 작물자음(문자형) : 매칭을 위한 자음 코드입니다. 제철명(문자형) : 작물이 주로 재배되는 기간입니다. 제철월(숫자형) : 작물이 가장 자주 수확되는 달입니다. 난이도코드(숫자형) : 작물 재배의 난이도를 나타내는 코드입니다. 각 작물에 대한 요약 정보와 재배 팁, 효과 등도 포함되어 있어 농업인이 필요로 하는 다양한 정보를 제공합니다. 이 데이터는 농업 교육 및 연구, 영농 계획 수립, 작물 선택 시의 참고 자료로 활용될 수 있습니다.'
