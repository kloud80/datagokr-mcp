summary_user: 아세안 지역을 대상으로 2012년부터 2021년까지 10개년 연간 농식품 수출실적과 2021년 전년 대비 증감률을 정리한 집계 통계로, 건별 거래가 아닌 연도별 합계 수치를 담는다. 정책 담당자·연구기관·농식품 수출기업이 '최근 10년간 아세안으로의 농식품 수출이 얼마나, 어떤 추세로 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 수출·가격 데이터와는 국가명·품목명 같은 이름 매핑으로만 이어 쓰며, 품목코드는 KAMIS·HS·KOSIS마다 달라 별도 매핑이 필요하다.
description_portal: 해당 데이터는 아세안 지역을 대상으로 2012년부터 2021년까지 10개년에 걸친 연간 농식품 수출실적 및 전년 대비 2021년 수출실적 증감률 등을 정리한 통계자료입니다. 이를 통해 아세안 지역에 대한 연도별 농식품 수출 동향과 시장 규모, 성장 및 변동 추세를 파악할 수 있으며, 주요 수출 품목과 국가별 수출 구조, 경쟁력 분석에도 활용 가능합니다. 또한, 국내 농식품 산업의 해외시장 확대 전략 수립, 수출 정책 결정, 지원 프로그램 설계 등 다양한 분야에서 기초 자료로 활용될 수 있으며, 정책 담당자, 연구기관, 농식품 기업 등 관련 이해관계자들이 실질적 의사결정과 전략 수립에 참고할 수 있는 중요한 자료입니다.
