description_portal: 식물원·동물원·휴양림 정보 데이터는 자연·생태 관련 시설을 체계적으로 분류하고 위치 기반 정보를 제공하기 위해 구축된 자료입니다. 키는 각 시설을 식별하는 고유값이며, 분류1·분류2·분류3 항목은 시설의 유형을 단계적으로 구분하여 식물원, 동물원, 휴양림 등 세부 카테고리를 명확히 파악할 수 있도록 합니다. 검색어는 이용자가 해당 시설을 찾을 때 활용되는 대표 키워드입니다. 명칭은 시설의 공식 한글 이름을 나타내며, 행정 시·행정 구·행정 동 정보는 시설의 정확한 위치와 행정구역을 제공합니다. 이 데이터는 자연·생태 관광 안내, 도시 녹지 관리, 교육·체험 프로그램 운영 등 다양한 행정·관광 서비스에서 활용되는 기초 자료입니다.
