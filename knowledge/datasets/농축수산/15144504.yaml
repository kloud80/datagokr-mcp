description_portal: '식물신품종보호제도에 따라 등록된 내용을 정리한 자료입니다.(식물신품종보호제도는 우수한 품종을 육성한 육종가의 권리를 보호하고, 품종의 상업적 가치를 보장하기 위한 법적 장치 입니다. 우리나라에서는 국립종자원이 이를 관할하고 있으며, 육종가(또는 기관)가 개발한 품종은 심사를 통해 품종보호권을 부여 받습니다.)- 품종보호 신청 및 현황 관리: 현재까지 보호 신청된 감귤 품종들의 정보를 확인할 수 있습니다.- 감귤 신품종 개발 추이 파악: 출원일자와 출원인을 통해 어떤 기관이 언제 품종을 개발했는지 분석할 수 있습니다.- 감귤 품종 식별 및 홍보: 사진과 특성 정보를 통해 품종별 차이를 식별하고, 홍보 자료로 활용 가능.'
