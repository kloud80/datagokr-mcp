summary_user: 산림청이 등록·관리하는 산림탄소상쇄사업을 사업 한 건당 한 행으로 담은 전국 단위 파일(CSV, 약 465KB)로, 사업 종류·참여유형, 사업 기간과 최초 모니터링 기간, 신청·접수·평가·등록 일시와 등록 상태, 총·연간 탄소흡수량, 인증서 버퍼 비율 등을 담는다. 탄소중립·ESG 분석가나 사업 참여를 검토하는 산주·기업이 '산림탄소상쇄사업은 어떤 종류로 몇 건이 등록됐고 예상 흡수량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업자명이나 사업장 우편번호 같은 이름·코드 매핑으로만 느슨하게 연결한다.
description_portal: 산림탄소상쇄사업 등록관리 현황 데이터는 산림을 통한 탄소 흡수와 탄소중립 실현을 위해 추진되는 산림탄소상쇄사업의 등록 및 관리 정보를 체계적으로 제공합니다. 사업의 고유번호, 참여유형, 시작일과 종료일, 모니터링 일정, 사업 내용, 신청 및 접수 일시, 평가 및 등록 상태, 흡수량, 인증서 관련 수치 등 다양한 항목이 포함되어 있습니다. 이를 통해 산림 탄소상쇄사업의 진행 현황을 파악하고, 정책 수립, 연구, 탄소중립 실천 방안 마련 등 다양한 분야에서 활용할 수 있습니다. 데이터는 정기적으로 갱신되어 최신 정보를 반영합니다.
