description_portal: '경상북도 어선현황 데이터는 어업의 기본적 생산수단인 어선의 등록사항을 파악하여 수산정책수립의 기초자료로 활용하기 위한 자료입니다. 보고대상 지역은 경상북도이며, 시군구에 등록된 모든 어선을 대상으로 작성됩니다.시군별·톤급별 어선세력 및 동력여부에 따라 작성되었습니다. * 어선 : 어업, 어획물운반업 또는 수산물 가공업 등 수산업에 종사하는 선박을 말하며, 수산업에 관한 시험, 조사, 지도, 단속 또는 교습에 종사하는 선박을 포함함* 어업 : 수산동식물을 포획·채취하거나 양식하는 사업과 염전에서 바닷물을 자연 증발시켜 소금을 생산하는 사업을 말함* 동력어선 : 추진기관을 설치한 어선을 말함이외, 더 자세한 통계자료는 경상북도 해양수산과(054-880-7733)로 문의 부탁드립니다.'
