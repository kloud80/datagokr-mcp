summary_user: 전국 연안침식 조사 지점별 현황을 담은 API로, 침식 고유번호·지역명·분석내용·관찰내용과 보고서·그래프·사진·시설사진 파일 정보를 제공하며 전체 39,254건이다. 지자체·연구기관 담당자나 분석가가 특정 해안의 침식 원인과 변화를 확인해 연안정비 사업 대상지를 고르는 데 쓴다. 전역 조인 키는 없고 연안침식고유번호와 법정동코드(cstWashBdongCd)로 같은 기관 코드나 지역명 매핑을 거쳐 다른 지역 데이터와 잇는다.
description_portal: 이 데이터는 해양수산부에서 연안침식 조사와 관련된 현황, 이미지 정보를 제공하기 위해 수집한 데이터입니다.  전체 데이터 조회 또는 고유번호, 지역명 등 특정 파라미터 입력을 통해 데이터를 제공받을 수 있으며, 본 데이터의 주요 내용은 연안침식고유번호, 연안침식지역명, 분석내용 등으로 구성되어 있습니다.  본 데이터는 연안관리 계획 수립, 특정 지역의 침식 원인 분석, 장기적 변화 모니터링, 침식 방지 사업 수행 및 효과 검토를 위한 기초자료로 활용될 수 있습니다. 지자체 및 연구기관에서는 해당 데이터를 활용해 연안정비 사업 지역 선정, 침식 저감 방안 마련, 향후 관리 방안 수립에 참고자료로 사용할 수 있습니다.
team:
