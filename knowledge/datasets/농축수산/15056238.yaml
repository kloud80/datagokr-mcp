description_portal: 2024년 광주광역시 조류인플루엔자 검사 현황에 대한 데이터입니다. 조류엔플루엔자는 제1종 가축전염병으로 닭이나 칠면조 등 조류의 급성호흡기 질병으로 100%에 가까운 폐사율을 보이는 질병입니다. 광주광역시에서 가축전염병예방법, 조류인플루엔자 방역실시요령에 근거하여 관내 사육 중인 육용오리, 산란계, 토종닭, 메추리, 기러기 등 에 대해서 검사하는 조류인플루엔자 바이러스 항원·항체 검사를 실시하고 있습니다. 다음 데이터는 년간 검사 계획건수, 조류인플루엔자 검사건수, 조류인플루엔자 검사결과, 조류인플루엔자 검사 기준일 등의 항목을 제공합니다.
