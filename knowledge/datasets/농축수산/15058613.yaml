summary_user: 경기도 시군별 어항을 한 건씩 담은 목록으로, 시군명과 어항명, 국가어항·지방어항 같은 구분, 도로명·지번 주소로 된 위치, 비고를 시군구 단위로 제공한다. 어촌 정비나 수산 기반 시설을 검토하는 분석가가 '경기도 어느 시군에 국가어항과 지방어항이 몇 곳씩 있는가' 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으며, 시군명이나 시군 코드(SIGUN_CD)를 다른 경기도 데이터와 이름·코드로 맞춰 연결해야 한다.
description_portal: '이 데이터는 경기도 해양수산과에서 제공하는 시군별 어항 수 및 관련 정보를 담고 있으며, 주요 항목에는 시군명, 어항명, 어항 위치, 어항의 구분명(예: 국가어항, 지방어항), 비고란 등이 포함됩니다. 경기도 내 어촌과 수산업의 기초 인프라인 어항의 분포를 파악하고, 어항 기능과 역할에 따른 공간적 특성을 확인할 수 있는 자료로 활용됩니다. 어항 위치는 도로명 및 지번 주소로 제공되며, 지역 해양 자원의 개발 가능성 평가, 어촌 정비 사업, 수산물 유통 기반 구축, 어업인 편의시설 확보 등에 참고자료로 유용합니다. 특히, 항만계획이나 해양공간계획 수립 시 기반 자료로도 활용될 수 있습니다.'
