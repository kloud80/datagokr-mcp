summary_user: 농업경영체 등록 현황을 시도별·축종별로 묶은 집계 자료로, 경영체 수 합계와 시설 여부별 경영체 수, 경영형태별 시설 개수, 사육 규모를 담으며 범위는 전국입니다. 지역별 축산 경영체 분포를 보려는 정책 분석가나 지원사업 담당자가 "어느 시도에 특정 축종 사육 경영체가 몇 곳이고 시설을 갖춘 곳은 얼마인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·축종명 같은 이름을 맞춰서만 이어 쓸 수 있습니다.
description_portal: 해당 데이터는 농업경영체의 등록 현황을 체계적으로 정리한 자료로, 제공 목록으로는 지역별로 구분하여 경영인력에 대한 일반현황, 농지 등 및 농작물 재배, 가축,곤충 사육 현황 등의 정보를 포함하고 있습니다. 농업경영체 등록제도는 '농어업경영체 육성 및 지원에 관한 법률' 제4조에 따라 농업, 농촌의 다양한 지원, 보조금 등을 받기 위해 농업경영체가 본인의 농업경영정보를 자발적으로 등록하는 제도입니다. 이 자료는 농업정책 수립과 맞춤형 지원사업 추진에 활용되며, 특히 농업인의 실질적인 경영 현황을 반영하는 데 중요한 근거로 사용될 수 있습니다. 또한 농업 경영 실태를 분석하여 농촌 발전 전략, 청년 농업인 육성 방안, 농업 경쟁력 강화 대책 등을 마련할 수 있습니다.
