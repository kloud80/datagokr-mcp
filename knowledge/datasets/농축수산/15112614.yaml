summary_user: 해양수산부 지식정보 생산모델이 계산한 파고 예측값을 2단계 격자별·15분 간격으로 담은 API이며, 격자코드·예측일자·분석시간·예측파고로 구성되고 범위는 전국 해역이다. 낚시·레저객이나 선박 운항 담당자가 특정 격자 해역의 앞으로 몇 시간 파고가 얼마나 높아지는지 확인해 출항·활동 여부를 판단하는 데 쓴다. 전역 조인 키는 없어 격자코드(gridCd)를 격자 위치 정보와 따로 매핑해야 하며, 같은 기관의 다른 해양 예보·관측 데이터와는 격자나 이름 대응으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 지식정보 생산모델을 활용하여 파고에 대한 15분 간격(2단계)의 격자별(2단계 격자) 예측값 정보를 제공하기 위해 수집된 데이터입니다.  격자번호, 예측시간 등 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 격자코드, 분석시간, 예측파고, 예측일자 정보로 구성되어 있습니다.  이 데이터는 해상 안전 관리, 연안 및 항만 관리, 해양 기상 예측, 선박 운항 계획 수립 등 해상 활동의 의사결정 지원에 활용될 수 있습니다. 또한 해양 관련 연구나 정책 기초자료로도 활용될 수 있습니다.
