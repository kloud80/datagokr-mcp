description_portal: 본 데이터는 어업경영체를 대상으로 실시하는 현지조사 과정에서 수집된 기타 양식품종의 생산 현황과 경영 정보를 제공합니다.각 조사 건마다 부여되는 현지조사접수번호와 현지조사번호를 중심으로, 담당 지청코드 및 명칭, 조사일자, 조사 일련번호 등 행정적 식별 정보가 포함되어 있습니다. 또한 양식 경영 실태를 파악하기 위한 핵심 지표로 현재 사육량, 생산량, 생산금액, 계통·비계통 판매비율, 수탁 여부 등의 생산·판매 관련 정보가 제공됩니다.어업구분과 어업번호는 조사 대상 경영체의 등록 정보를 식별하는 데 활용되며, 최초 생성시점과 최종 변경시점 등 데이터 이력 관리 정보, 그리고 데이터 기준일자 등 시계열 관리에 필요한 항목도 함께 수록되어 있습니다.
