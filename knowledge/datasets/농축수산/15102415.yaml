summary_user: 농식품공공데이터포털(data.mafra.go.kr)이 개방하는 데이터셋의 목록과 메타데이터를 데이터셋 한 건씩 담으며, 데이터셋명·설명·제공기관·담당자·키워드·이용허락(CCL)·갱신주기·제공 형태(그리드·API·파일·링크·원문·차트·지도) 여부·등록일과 수정일을 포함하는 전국 단위 비공간 목록이다. 분석가나 개발자가 "KAMIS 가격이나 도매시장 경락 같은 농식품 데이터를 어느 기관이 어떤 형식과 주기로 제공하는가"를 확인해 쓸 원천 데이터를 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 데이터셋 이름이나 같은 기관의 데이터 식별자(DATASET_ID·DATA_ID)로만 맞춰 이어 쓴다.
description_portal: 농림축산식품부 공공데이터 포탈에서 제공중인 개방 데이터 목록을 확인할 수 있는 API입니다. 본 API를 통해 각 제공기관별, 분류별, 제공 유형별로 분류된 다양한 농식품 관련 개방데이터 목록을 제공합니다. 이를 통해 사용자들은 공공 데이터의 활용 가능성을 높일 수 있으며, 다양한 연구 및 정책 수립에 필요한 기초 자료를 확보할 수 있습니다. 또한, 이 API는 농식품 분야의 공공데이터에 대한 메타데이터 정보를 제공하여, 데이터의 카테고리, 제공 기관, 데이터 형식, 업데이트 주기 등을 쉽게 조회할 수 있습니다. 이처럼 농식품 공공데이터 포털은 데이터 활용을 통해 국민의 이해와 참여를 높이고, 투명한 농식품 정책 정보 제공에 기여하고 있습니다.
