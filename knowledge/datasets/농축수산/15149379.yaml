description_portal: 이 데이터는 해양수산부에서 직선기선에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 제작일자, 기타정보영문내용, 기타정보한글내용, 공간정보 데이터로 구성되어 있습니다.본 데이터는 직선기선 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.직선기선이란 해안선 굴곡이 심하고 섬이 많은 지역에서, 육지의 돌출부와 가장 외곽의 섬들을 직선으로 연결하여 영해를 설정하는 기준선을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.*해당 데이터는 공간정보 데이터로 gis 툴을 이용하여 지도에서 레이어로 확인하실 수 있습니다.
