description_portal: 이 데이터는 사업대상지의 기본 현황, 입지·지형 특성, 어촌형 관광·체험 가능성, 사업수행 여건 등을 체계적으로 파악하여 대상지 선정의 타당성 분석, 사업 추진 계획 수립, 지역 특성 기반의 어촌뉴딜 전략 도출을 지원하기 위해 2019년부터 2022년까지 수집·구축된 정보입니다.사업대상지 기본정보(TB_BSNS_DESTSTUS), 사업대상지 평가현황(TB_PRFRM_EVLTN)를 포함합니다.이 데이터를 통해 사업대상지의 입지·환경·인구·관광수요·접근성·지형특성 등을 종합적으로 분석할 수 있으며, 대상지 적합성 평가, 어촌뉴딜300 등 지역기반 사업의 후보지 발굴, 사업 타당성 검토, 맞춤형 개발 전략 수립, 성과관리 지표 설정, 연차별 투자계획 수립 등에 활용될 수 있습니다.파일내 항목별 코드는 코드북을 참고해 주시기 바랍니다.
