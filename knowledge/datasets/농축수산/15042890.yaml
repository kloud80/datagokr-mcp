description_portal: 해당 데이터는 경상북도 영천시의 토석 채취 허가 및 채석 신고 현황을 나타내는 자료입니다. 본 데이터는 영천시 내에서 허가받거나 신고된 토석 채취업체들의 상세 정보를 포함하고 있으며, 허가 및 신고의 연번, 업체명, 연락처, 허가 또는 신고 대상지 주소, 채취 용도, 허가 면적과 허가량, 허가 시작일과 종료일, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 영천시 내 토석 채취 활동의 현황을 체계적으로 파악할 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 산림과로 연락주시기 바랍니다.
