summary_user: 국립수산과학원 실시간 수온 관측소를 관측소 1곳당 1행으로 정리한 전국 범위의 관측소 정보 파일이다. 각 행에는 관측소코드와 한글·영문명, 관측그룹, 위도·경도, 설치일자, 그리고 수온·염분(전기전도도)·용존산소·클로로필·유향·유속·파고·기상 항목을 표층·중층·저층별로 관측하는지(사용유무)가 담긴다. 양식어업인이나 분석가가 '우리 양식장 근처에서 저층 용존산소까지 재는 관측소가 어디인가'를 확인하는 데 쓰며, 전역 조인 키는 없으므로 같은 기관의 관측소코드나 관측소명, 위경도 근접 매칭으로 실시간 수온 관측값 등과 이어 쓴다.
limits: 필드 목록상 이 파일은 관측소 속성과 항목별 사용 여부를 담고 있어, 포털 설명에 나온 수심별 수온·염분 관측값 자체는 확인되지 않는다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 행정구역 코드나 다른 기관(바다누리 등)의 관측소코드와 바로 결합되지 않는다.
