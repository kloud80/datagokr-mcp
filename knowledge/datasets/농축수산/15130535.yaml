description_portal: '- 전라남도 산림자원연구소 홈페이지의 공지사항(산림학교 및 산림학교 교육정보, 산림자원연구소 채용정보 등)에 대한 정보를 조회하실 수 있습니다.- 전라남도 산림자원연구소는 전라남도의 산림 자원 보전과 활용을 위한 연구 및 체험 교육을 제공하는 기관입니다. 나주에 위치하며, 다양한 산림 관련 프로그램과 연구를 통해 지역 주민과 방문객들에게 산림의 중요성을 알리고 있습니다.- 운영 시간 : 평일 기준 오전 9시부터 오후 6시까지 운영되며, 주말 및 공휴일은 사전 예약제로 운영될 수 있으니 방문 전에 확인하시기 바랍니다.- 예약 방법 : 홈페이지를 통해 프로그램 예약 및 문의가 가능합니다.- 전라남도 산림자원연구소는 산림의 가치를 배우고 체험할 수 있는 다양한 프로그램을 제공하고 있습니다. 자연과 함께 힐링하고 싶은 분들에게 추천드립니다.'
