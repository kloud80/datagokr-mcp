summary_user: 경기도 시군별로 직불제 지원의 계획(농가 수·면적·예산)과 실제 집행금액·집행잔액을 기준년도 단위로 담은 집계 자료다. 지역 정책 분석가나 예산 담당자가 '어느 시군이 직불금 예산을 계획 대비 얼마나 집행했고 잔액이 얼마나 남았나'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(sigun_nm)과 기준년도를 이름 매핑해 다른 시군 단위 농업·예산 자료와 이어 쓴다.
description_portal: 이 데이터는 직불제도 하에서 시군별 농가에 대한 계획 및 실제 지원현황을 나타낸 자료입니다. 데이터 주요 항목으로는 기준년도, 시군명, 계획농가수, 계획면적, 계획예산금액, 실적집행금액, 집행잔액 등이 포함되어 있으며, 지역별 예산 계획과 실제 집행 내역을 비교 분석할 수 있습니다. 직불제는 농업인의 소득안정과 농업의 공익적 기능 유지를 위해 정부가 지급하는 보조금 제도로, 본 데이터는 해당 제도의 집행효율성을 평가하거나 향후 예산편성의 기초자료로 활용될 수 있습니다. 단위는 농가 수(호), 면적(ha), 금액(원)으로 제공되며, 집행잔액을 통해 예산 활용률을 확인할 수 있습니다. 2023년 자료부터 직불금 지원관련 공개 데이터의 항목이 변경되어 최신 자료는 경기도 홈페이지 사전정보공표 자료를 참고해주시기 바랍니다.
