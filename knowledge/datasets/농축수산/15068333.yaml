description_portal: 2019년 말 기준으로 전국 시도별 가로수 조성 실적을 정리한 통계 데이터입니다. 이 자료는 도시 내 녹지 확충과 생활환경 개선을 위한 가로수 식재 현황을 파악하기 위해 구축된 것으로, 각 지역별 식재 수종, 식재 수량, 도로 구간 길이, 관리 주체 등을 포함합니다. 이를 통해 각 지방자치단체의 가로수 조성 노력, 도시녹지 분포, 지역별 가로수 밀도와 관리 수준 등을 비교 분석할 수 있습니다. 이 데이터는 도시경관 개선, 미세먼지 저감, 열섬현상 완화, 생태적 연결성 강화 등의 효과 분석에 활용될 수 있습니다.
