summary_user: 친환경인증을 받은 농축산물(무농약·유기농산물, 무항생제·유기축산물, 유기가공식품, 취급자 등)을 인증 건별로 담으며, 인증번호·인증 종류·인증농가·품목·재배면적(축산은 사육두수)·생산 또는 수입 계획량·인증기간을 전국 범위로 제공한다. 유통업자나 식자재 구매자가 특정 농가·품목의 친환경인증이 유효기간 안에 있는지 확인하거나, 분석가가 인증 종류별·품목별 친환경인증 현황을 집계하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목명·농가명 같은 이름 매핑이나 같은 기관 코드로만 연결하며, KAMIS 가격 데이터와 붙일 때도 품목명 매핑이 필요하다.
description_portal: 무농약농산물, 유기농산물, 무항생제축산물, 유기축산물, 무농약원료가공식품, 유기가공식품, 비식용유기가공품, 취급자 등 친환경인증을 받은 농축산물에 대한 인증 정보로서, 인증번호, 인증 종류명, 인증농가, 인증 품목명, 재배면적(축산물의 경우 사육 두수), 생산 또는 수입 계획량, 인증기간 시작일, 인증기간 종료일, 원재료 인증구분 항목으로 구성되어 있습니다. 인증종류별 친환경인증현황, 인증품목별 친환경인증현황 등 통계자료를 작성하여 친환경인증에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대됩니다.
