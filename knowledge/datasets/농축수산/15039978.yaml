description_portal: 한국농어촌공사에서 관리하는 농업생산기반시설의 인허가(하천점용허가) 정보입니다.농업기반시설(저수지, 양배수장, 취입보, 관정, 집수암거 등)의 설치·개량·폐지 과정에서 발생하는 허가, 신고, 승인 등의 행정처리 정보를 담고 있으며, 허가권자, 처리일자, 허가 조건 등의 항목을 포함합니다.공사 관리 시설에 대한 기본정보(본부, 지사, 시설명, 표준시설코드 등)와 허가/점용에 대한 정보(하천명, 하천등급, 허가/점용위치, 허가/점용면적, 유수사용량, 유량계측시설 등)을 제공합니다.해당데이터는 아래와같읕 자료로 활용 가능합니다.- 농업기반시설 설치·운영 현황 관리- 지역별 시설 인허가 추이 분석- 정책 수립 및 시설 투자계획 수립- 연구기관의 농업기반시설 법적 관리 체계 분석----------------------------<참고사항>1. 시설인허가 정보에서 점용기간 종료일자가 없는 허가정보는 영구사용정보 이며, 이외 공백 정보는 미집계(등록)된 내역입니다.2. 표준시설코드에 해당되는 값은 시설명입니다.
