description_portal: '동물병원의 명칭, 주소, 연락처, 방사선장비 보유 여부 및 데이터 기준일자를 포함한 자료.반려동물 진료 서비스 제공기관의 공간 분포와 장비 보유 현황을 파악할 수 있어, 지역 내 수의 의료 인프라 진단 및 동물복지 향상 정책 수립의 기초자료로 활용됨.활용 목적 및 특징– 방사선장비 보유 여부를 통한 정밀 진단 가능 병원 식별– 병원별 소재지 기반 의료 접근성 및 분포 분석 가능– 반려동물 진료 수요 증가에 따른 의료시설 확충 판단에 활용– 행정구역별 의료자원 현황 모니터링 및 민원 대응 자료 제공주요 항목 설명● 병원명: 동물병원의 명칭● 소재지주소: 병원이 위치한 도로명 주소● 전화번호: 병원의 대표 연락처● 방사선장비 보유현황: 해당 병원의 방사선 진단장비 보유 여부'
