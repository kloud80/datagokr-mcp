summary_user: 경기도 우수축산물 학교급식 전산시스템에서 학교급식에 공급된 축산물의 월별 정산 자료로, 정산년월·품목분류·품명·부위별 총수량을 집계해 담는다. 급식 계획 담당자나 유통 정책 분석가가 "학교급식에서 어떤 축산물 품목·부위가 월별로 얼마나 공급되고 선호되는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS 가격 등 다른 데이터와는 품명·부위 이름을 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 학교급식에 사용된 우수축산물에 대한 월별 정산 자료를 포함하고 있습니다. 주요 항목은 정산년월, 품목분류, 품명, 부위, 총수량으로 구성되어 있으며, 축산물의 품명 및 부위별로 실제 공급된 총수량이 기록되어 있습니다. 이 데이터는 학교급식에 공급된 축산물의 품목별 사용 현황을 분석하거나, 급식 계획 수립, 공급업체 평가 및 농축산물 유통 정책 마련에 활용될 수 있습니다. 또한, 정산정보를 통해 공급과 수요의 추이 및 품목 선호도를 파악할 수 있는 기초자료로 활용 가능합니다. 2015년~ 2021년까지의 연도별 정산 자료는 File 탭의 압축 파일을 확인해주시기바랍니다.
