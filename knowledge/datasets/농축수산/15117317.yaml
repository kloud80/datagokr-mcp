summary_user: 하천 관측소의 위치정보를 하천별 한 행씩 담은 파일 데이터로, 하천코드·하천명·관할기관·주소·경도·위도를 싣고 전국 1,374행이다. 수위 관측 지점이 어느 하천의 어디에 있는지 찾으려는 분석가나 담당자가 쓴다. 하천주소·하천세부주소(address)와 경도·위도(coord)를 키로 다른 지리·행정 데이터와 이어 쓰며, 포털 설명은 상세 수위 자료를 홍수통제소 API에서 받으라고 안내한다.
limits: 위치정보만 담으며 수위 측정값은 없어 실시간·상세 수위는 홍수통제소 API를 써야 한다. 세부 부문이 농산물 유통 가격으로 분류돼 있으나 내용은 하천 위치라 맞지 않고, 하천·수문 관측 부문으로 옮기자는 제안이 있다. 필드별 명세상 의미와 코드표는 입력에 없다.
