description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「선박 교통관제에 관한 법률」에 따라 해양경찰청장이 해양수산부장관과 협의하여 고시사는 선박안전교통관제구역의 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 선박교통관제구역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 구역의 명칭, 청의, 관계법령, 제/개정일 및 관계부서 정보 등을 포함하고 있습니다. 본 데이터는 해양 관련 기관에서 선박의 안전한 항로 확보 및 사고 예방 대책 수립, 선박 운항 및 입항 관리, 수로 정보 제공, 관제구역 내 통항 규칙 마련 등 정책 지원 자료로 활용될 수 있습니다. 또한 선박 운항 경로 분석, 해양공간계획, 해상물류 및 항만 운영 계획 수립에도 본 데이터를 활용할 수 있습니다.
