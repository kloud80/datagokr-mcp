summary_user: 충청북도 농가경영종합관리시스템의 영농활동 일지 중 농가별 품목 재배 이력을 건별로 담은 파일(CSV 약 37만 바이트)로, 재배연도·면적·주요품종·재배유형(노지·시설 등)·재배 시작월과 종료월·조성주수·비고를 기록한다. 충북 지역 농가가 어떤 품종을 어떤 방식으로 언제부터 언제까지 얼마나 넓게 재배하는지 지역 재배 경향을 살피려는 분석가·정책 담당자가 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 같은 시스템의 다른 테이블이나 품종명 등 이름 매핑으로만 연결한다.
description_portal: '농가경영종합관리시스템에서 관리되는 영농활동 일지에 대한 데이터를 수록한 테이블로, 각 농가의 품목별 재배활동 이력을 체계적으로 기록하고 있습니다. 테이블에는 품목재배일련번호, 재배연도, 등록일시, 수정일시 등 기본적인 이력 정보 외에도 해당 품목이 재배된 면적, 주요 품종의 명칭, 재배유형(예: 노지, 시설 등), 재배기간의 시작월과 종료월, 그리고 실제 조성된 주수 등의 상세한 영농 정보가 포함되어 있습니다. 아울러 ‘작업유형’ 및 ‘비고’ 항목을 통해 농가의 구체적인 작업 내용과 특이사항까지 함께 기록되어 있어, 개별 농가의 경영 분석은 물론, 지역 단위의 재배 경향 분석 및 정책 수립 자료로도 활용될 수 있습니다.'
