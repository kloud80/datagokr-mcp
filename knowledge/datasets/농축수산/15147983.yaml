description_portal: 이 데이터는 해양수산부에서 정선해양수층자료에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일시, 위도, 경도, 수심(m), 수온(C), 염분(psu), 용존산소(ml L), 인산염인(ug-at L), 아질산질소(ug-at L), 질산질소(ug-at L), 규산규소(ug-at L), 수소이온농도(pH) 데이터로 구성되어 있습니다.본 데이터는 정선해양수층자료 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.정선해양이란 정해진 노선(항로)을 따라 해양을 조사하는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
