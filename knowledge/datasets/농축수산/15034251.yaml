description_portal: 본 데이터는 경상북도 경주시의 축산업 현황을 정리한 자료로, 파일 형식으로 제공된다. 주요 항목은 주사육업종, 사업장소재지(지번), 영업상태구분, 사육두수, 면적 등으로 구성되어 있으며, 축산업체의 운영 현황과 규모를 종합적으로 확인할 수 있다. 이를 통해 경주시 내 축산업의 분포와 지역별 특성을 파악할 수 있으며, 정책 수립 및 행정 업무 지원의 기초자료로 활용된다. 특히 사육두수와 면적 자료는 가축 방역 체계 수립, 환경영향 평가, 자원 관리 전략 마련에 중요한 근거가 된다. 또한 축산업 현황 데이터는 농축산 관련 연구자, 행정기관, 일반 시민이 폭넓게 활용할 수 있으며, 경주시는 정기적으로 해당 정보를 갱신하여 최신 동향을 반영한다.
