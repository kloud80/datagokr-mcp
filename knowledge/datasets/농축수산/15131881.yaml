description_portal: '한국해양진흥공사(KOBC)가 운영하는 한국형 컨테이너선 운임지수 (KCCI)는데이터 수집 목적- 부산항을 기점으로 한 13개 주요 항로의 컨테이너선 운임 정보를 중앙집중적으로 수집·제공하여 국내 해운물류 시장의 투명성을 높입니다- 해양물류정책 수립, 산업 분석, 그리고 금융·투자기관의 의사결정을 위한 신뢰할 수 있는 지표를 제공하기 위함입니다.데이터 수집 및 산출 과정- 운임공표제 의무자료 수집 (25%) : 해운회사들이 정기적으로 신고하는 공표운임(public freight rates) 데이터를 수집합니다.- 패널리스트 제공운임 수집 (75%) : 선정된 패널리스트 운송사업자 및 포워더로부터 실제 계약운임을 자료 형태로 수집합니다.- 가중평균 산출각 항로별로 공표운임 25%와 패널리스트 운임 75%를 가중합산하여 해당 항로 운임지수를 계산합니다.- 종합지수 산정 및 배포13개 항로의 가중 운임지수를 합산하여 KCCI 종합지수를 산출하고, 매주 월요일 14시 KOBC 웹사이트 및 보고서를 통해 발표합니다. 데이터 세부 항목- 13개 주요 항로 운임지수 : 북미(US West/East), 유럽, 지중해, 중동, 호주, 남미(동안/서안), 아프리카(남·서아프리카), 아시아(중국·일본·동남아) (k- 항로별 가중치 : 각 항로의 중요도와 수출입 물량을 반영한 가중치 설정 → 종합지수 구성 시 반영- 운임 구성 요소 : 공표운임(public rate), 패널리스트 운임(actual contracted rate)활용 기대 효과- 시장 모니터링 : 항로별·전세계 운임 동향을 실시간으로 확인하여 시장 과열·침체 사전 인지 가능- 운송계약 및 입찰 기준 : 가중 방식으로 신뢰도 높은 운임 기준을 제시하여 계약 안정성 확보- 선대 운영 및 리스크 관리 : 장기적 운임 추세 분석을 통해 운항 계획 수립 및 변동성 대응 전략 마련- 정책 및 금융 의사결정 지원 : 공공기관·금융기관·투자사는 공식 지표로 활용, 해운산업 활성화 및 투자 판단 근거로 용'
