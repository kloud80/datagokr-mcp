summary_user: 부산광역시 국제수산물유통시설관리사업소(국제수산물도매시장)에 입하된 수산물을 도매법인별·경매일자별 품목 단위로 묶어 거래물량(kg), 물량비(%), 거래금액(원), 금액비(%)를 담은 집계 데이터이다. 수산물 유통업자나 물가 분석가가 "이번 달 국제수산물도매시장에서 어떤 어종이 얼마나 반입되고 얼마에 거래됐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 위판장·도매시장 경락 데이터와는 품목명(fishName)과 경매일자(auDate)·경매월(auMonth)을 이름·날짜 기준으로 맞춰 이어 쓴다.
description_portal: 농수산물유통 및 가격안정에 관한 법률에 의거하여 부산광역시 국제수산물유통시설관리사업소에서 유통되는 수산물에 대한 도매법인별, 경매일자별 품목, 수탁일자, 거래물량(kg), 물량비(%), 거래금액(원), 금액비(%)에 대한 정보를 제공하고 있습니다. ※ 추가로 제공되는 각종 수산물의 월별 주요반입품목과 출하지별 거래실적에 관한 정보는 국제수산물유통시설관리사업소 홈페이지에서 확인할 수 있습니다.
