description_portal: 광우병은 소해면상뇌증입니다. 광주광역시에서는 가축전염병예방법, 소해면상뇌증(BSE) 및 정밀검사 세부요령에 근거하여 진행성 신경증상 소, 도축장에서 신경증사을 보이는 4세이상소, 기립불능 폐사소 등 BSE 임상증상을 보이는 의심축에 대해 소 BSE 신속검사 (ELISA법)으로 검사를 실시하고 있습니다. 다음 데이터는 2016년부터 2025년 광주광역시에서 실시한 소해면상뇌증 검사 실적으로 농림축산식품부에서 정해준 검사계획건을 바탕으로 광주광역시내에서 소해면상뇌증 임상증상을 보이는 소에 대해서 검사한 결과입니다. 광주광역시에서 2025년 소해면상뇌증 검사를 실시한 소는 모두 관내 도축장 2개소에 출하된 기립불능소(사고소, 부상)로 모두 24두에 대한 검사를 실시하였고 소 해면상뇌증 검사결과 모두 음성입니다.
legal_basis_portal: 광주광역시 보건환경연구원에서 검사한 실적입니다.
