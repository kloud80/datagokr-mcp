description_portal: 부산광역시 강서구 어선 현황(어선 척수 등)에 관한 데이터로 1톤미만,  1톤이상 5톤미만, 5톤이상 10톤미만, 10톤이상 100톤미만 동력어선 및 무동력어선 척수- 어선법 제2조(정의)에 따라 어선이란 다음 각 목의 어느 하나에 해당하는 선박을 말한다.가. 어업(「양식산업발전법」에 따른 양식업을 포함한다. 이하 같다), 어획물운반업 또는 수산물가공업(이하 “수산업”이라 한다)에 종사하는 선박나. 수산업에 관한 시험ㆍ조사ㆍ지도ㆍ단속 또는 교습에 종사하는 선박다. 어선법 제8조제1항에 따른 건조허가를 받아 건조 중이거나 건조한 선박라. 어선법 제13조제1항에 따라 어선의 등록을 한 선박
