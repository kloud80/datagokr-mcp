description_portal: 매년 농촌재능나눔 활동 일반단체, 지역단체 및 대학및 대학교 동아리 를 공모를 신청을 통하여 모집하고 있습니다.개인자격 공모및 농촌재능나눔 대상공모 모집 하고 있습니다. 이에따른 공모를 스마일재능뱅크 시스템을 활용하여 공모사항등을 알려 공모신청을 받도록 하고 있습니다.공모에 대한 내용등을 알리는 목록입니다.사업목적 기관,기업,단체및 개인이 가지고 있는 지식,경험,기술등 다양한 재능을 농촌지역과 함께 나눔으로써 농촌취약계층 복지지원및 농촌주민삶의 질 향상 도모 공모단체의 다양한 전문성을 활용한 농촌재능나눔 활동을 추진합니다.
