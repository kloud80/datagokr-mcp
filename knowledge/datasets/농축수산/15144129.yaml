description_portal: '본 데이터는 김천시 농업기술센터 산하 농기계임대사업소에서 운영 중인 농기계의 현황 정보를 담고 있습니다. 본점 외 5개 지점에서 보유한 농기계의 지점명, 기계명, 규격, 주요 작업, 구입일자, 제조자, 구입금액, 임대금액, 사용 목적 등의 항목으로 구성되어 있으며, 지역 농업인의 임대 신청 편의성을 높이고, 농기계 이용률 제고, 장비 수급 및 유지관리 계획 수립, 농업 정책 수립에 필요한 기초 자료로 활용될 수 있습니다. 또한 지점별 보유 현황을 통해 지역별 수요에 맞춘 효율적인 장비 배치와 운영이 가능하도록 돕습니다.사용목적설명 : R- 임대용,예비농기계용 , E-교육용, L-장기임대용, C-사업소관리용, T-폐기대상, D-폐기, S-기타'
