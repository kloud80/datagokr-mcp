description_portal: MBRIS가 보유한 해양생명종목록은 한반도 주변해역에 서식하는 해양생물의 존재를 확인하고, 연구하기 위한 참조데이터 및 기초데이터입니다.이 자료에는 척추동물, 무척추동물, 식물, 미생물 등 다양한 분류군에 대해 확보된 종 수와 보유점수가 정리되어 있으며, 기관별 자원 관리 현황 또한 함께 제시되어 있습니다. 이를 통해 어떤 기관이 어떤 생물자원을 얼마나 보유하고 있는지, 그리고 국내 해양생물 종 기록 대비 실제 확보·보존된 자원의 수준이 어떠한지 파악할 수 있습니다.이 데이터는 해양생태계 보전 정책 수립, 생물다양성 관리, 연구용 자원 배분, 생명자원 활용 기반 조성 등 다양한 공공 목적에 활용될 수 있습니다.
