description_portal: 이 데이터는 해양수산부에서 낚시어선업신고대장정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 일련번호, 최대승객수, 최대선원수, 출입항명, 낚시어선영업구역명, 낚시어선영업장소명, 영업장소특수주소 데이터로 구성되어 있습니다.본 데이터는 낚시어선업신고대장정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.낚시어선업신고대장정보란 낚시어선업자, 즉 낚시어선을 운영하며 낚시객을 태우고 낚시를 하게 하는 업을 영위하는 사람들이 법령에 따라 «낚시 관리 및 육성법»에 따라 해당 행정기관에 신고한 업체의 ▲영업 정보 ▲어선 정보 ▲어업허가 사항 등 낚시어선업에 관한 각종 정보를 기록하고 관리하는 대장 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
