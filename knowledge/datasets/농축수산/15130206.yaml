summary_user: 국립해양조사원이 2022년 기준 국내 연안의 마을어업·양식어업·정치망어업 어장을 SHP 공간정보 파일로 담은 데이터로, 어장별 주소·어업구분·어업종류·어업방법·양식물 종류·면적·면허기간을 포함하며 범위는 전국이다. 해양공간계획이나 연안개발 사업 담당자가 '사업 예정 해역에 겹치는 양식·정치망 어장이 어디에 있고 면허기간이 언제까지인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소 등 이름 매칭이나 공간 중첩으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 국내 연안의 마을어업, 양식어업, 정치망어업에 대한 어장 정보 제공을 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2022년을 기준으로 국내 연안 어장의 SHP형식 공간정보 파일로 구성되어 있으며,  각 어장의 주소, 어업구분, 어업종류, 어업방법, 양식물의 종류, 어장 면적 및 어업 면허기간 등 정보를 포함하고 있습니다.  본 데이터는 해양 공간계획 수립, 연안개발 사업 시 어장 위치파악, 어업 활동구역의 현황 분석, 공간정보 기반 정책연구, 해양환경 관리 계획 수립 등에 활용될 수 있습니다.
