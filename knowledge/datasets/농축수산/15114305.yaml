summary_user: 연안관리법에 따른 연안통합관리 2차 지역계획 중 완료된 계획을 시군구 단위로 정리한 파일 데이터로, 계획 고시번호·고시일자, 대상 해역명, 용도해역·기능 구분, 현황과 관리방향, 관련 법령, 육역·해역 면적을 담는다(전국 범위, CSV 약 13만 바이트). 지자체나 해양공간 분석가가 '우리 시군구 연안의 어느 해역이 어떤 기능으로 지정돼 어떤 관리방향이 정해졌는가'를 확인하거나 해상풍력 등 입지 검토 때 연안 용도 규제를 살피는 데 쓴다. 전역 조인 키는 없어 시도명·시군구명이나 해역명을 이름으로 맞춰 행정구역 코드표나 다른 해양공간 데이터와 이어 써야 한다.
description_portal: 이 데이터는 연안관리법에 의거하여 관리되는 연안통합관리 2차 지역계획정보 중 완료된 계획의 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 연안관리지역계획 고시번호, 대상 해역명, 기능 구분, 계획현황 및 면적 등 계획지역 정보와 관련 법령 및 고시일자 등 정보로 구성되어 있습니다. 본 데이터는 지방자치단체 및 해양 수산 관련 기관에서 지역 연안 계획 수립, 해역별 용도 관리 방안 마련, 연안 공간 활용 정책 검토 및 해역별 관리계획 점검 등 수행을 위한 기초 자료로 활용될 수 있습니다.
