description_portal: '- 전라남도 내 시군별 토석채취허가현황에 대한 자료입니다.- 시군명, 소재지, 지번, 용도, 허가면적, 허가수량, 허가기간(시작일/종료일)에 대한 데이터를 제공합니다. - 토석채취허가 절차 안내1. 신청서 제출 : 해당 시군청 개발행위허가 부서에 토석채취허가 신청서를 제출합니다.2. 서류 심사: 제출된 서류를 바탕으로 법적 요건 및 환경 영향을 검토합니다.3. 현장 조사: 필요 시 현장 조사를 통해 실제 조건을 확인합니다.4. 허가 통지: 허가 여부를 신청자에게 통지하며, 허가 시 조건을 명시합니다.- 토석채취허가와 관련하여 더 궁금하신 사항이나 특정 지역에 대한 정보가 필요하시면 알려주시기 바랍니다.'
