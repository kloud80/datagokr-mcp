summary_user: 경상남도 농가 수를 경지면적 규모 구간(plowAr)별로 나누어 2000년부터 2017년까지 연도별 열로 담은 시도 단위 집계 자료입니다. 농업 정책 분석가나 연구자가 '경남에서 소규모 경지를 가진 농가는 2000년대 이후 얼마나 줄었고 대규모 농가는 늘었는가' 같은 영농 규모 구조 변화를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 통계와는 경지면적 구간 이름이나 연도를 기준으로 맞춰 붙여야 한다.
limits: 시도 단위의 비공간 집계라 시군·읍면이나 필지(PNU) 단위 분석, 지도 연계에는 쓸 수 없다. 공통 코드가 없어 다른 데이터와 자동으로 조인되지 않으며, 연도가 행이 아니라 열(연도별 농가수 필드)로 펼쳐져 있어 시계열로 쓰려면 형태를 바꿔야 한다.
