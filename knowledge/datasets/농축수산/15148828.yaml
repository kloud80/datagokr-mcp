summary_user: 공유수면매립 기본계획에 반영된 매립 지구를 건별로 담은 전국 단위 파일로, 지구명·신청자·상세주소·매립 목적과 목적 구분·면적·고시번호와 고시(협의)일자·사업 진행 단계를 담는다. 연안 개발 사업자나 해양공간 분석가가 특정 해역이나 주소 인근에 매립 계획이 잡혀 있는지, 어떤 목적으로 얼마나 넓게 계획됐고 어느 단계까지 진행됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양공간 데이터와는 상세주소나 지구명, 고시번호를 기준으로 이름·주소 매칭을 해서 이어 써야 한다.
description_portal: 이 데이터는 해양수산부에서 공유수면매립기본계획에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공유수면매립기본계획일련번호, 공유수면매립기본계획신청지구명, 공유수면매립기본계획고시협의일자, 공유수면매립기본계획고시번호, 공유수면매립기본계획신청자명, 공유수면매립기본계획상세주소, 공유수면매립기본계획목적내용, 공유수면매립목적구분, 공유수면매립기본계획면적, 공유수면매립기본계획사업진행단계, 공유수면매립기본계획비고 데이터로 구성되어 있습니다.본 데이터는 공유수면매립기본계획 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면매립기본계획이란 공유수면의 무분별한 개발을 막고 합리적인 이용·관리를 위해 10년 단위로 수립되는 국가 계획을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
