description_portal: '○ 배경 : 경기도농업기술원은 "경기도ICT정보시스템"을 활용하여 경기도 내 스마트 팜의 환경정보를 수집하여 연구에 활용하고 있다.환경정보는 스마트팜 센서노드 연계를 통해 개별 스마트 팜으로부터 정보시스템에 수집된다.○ 수집기간 : 2019년 2월 ~7월○ 수집기간 : 경기도 안성시 스마트 팜 1개소○ 작목 : 오이(백다다기계)○ 재배 : 토경○ 환경제어시스템명 : 반딧불이○ 활용분야 : 작물의 생육 조건 최적화, 환경 제어 자동화 알고리즘 개선, 이상기후 대응 재배 전략 수립 등 스마트 농업 기술 개발에 활용가능'
