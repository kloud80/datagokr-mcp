summary_user: 전국 농촌마을을 마을 단위로 한 건씩 담은 기본정보로, 마을 ID·이름·기준연도·마을 유형·대표자 이름과 직업·귀농 인구수와 가구수·농지 관련 항목·갱신일을 담는다(포털 설명상 약 2,600개 마을). 귀농·귀촌을 고려하는 사람이 '이 마을에 귀농한 인구와 가구가 얼마나 되고 어떤 유형의 마을인가'를 확인하거나, 연구자가 농촌마을 특성과 인구 동향을 비교하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했다. 그래서 마을 이름 매핑이나 같은 기관(농림수산식품교육문화정보원) 데이터의 마을 ID로만 연결한다.
description_portal: 이 데이터는 전국의 2,600여 개 농촌마을에 대한 기본정보를 제공하는 API입니다. 각 마을의 이름, 역사, 경우에 따라 귀농현황, 인구현황 및 주택현황 등을 포함한 풍부한 농촌마을 관련 정보를 매 2년마다 갱신할 예정입니다. 이를 통해 사용자들은 농촌 마을의 전반적인 특성을 이해하고, 귀농, 귀촌을 고려하는 사람들에게 중요한 기초자료를 제공받을 수 있습니다. 또한, 이 API를 통해 농촌 마을의 공간적 배치나 인구 동향을 분석할 수 있어, 정책 수립이나 연구 분야에서의 활용도가 매우 높습니다. 특히 비즈니스 진출을 원하는 이들이 해당 마을의 기본적인 정보에 접근하여 지역적 시장 가능성을 평가하는 데 유용할 것입니다.
