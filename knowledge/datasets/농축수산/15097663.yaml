description_portal: 데이터는 경기도 화성시 관내 포도 스마트팜 농가를 대상으로 수집한 낙엽기 온도 정보를 기록한 자료이다. 항목에는 농가번호, 농장번호, 그리고 특정 시점의 온도 값이 포함되어 있으며, 포도나무 생육 종료 단계에서 발생하는 낙엽기와 관련된 기온 변화를 정량적으로 파악할 수 있도록 구성되었다. 해당 정보는 스마트팜 기반의 자동기록장치를 통해 수집된 것으로, 기온 변화와 낙엽 시점 간의 상관관계 분석, 재배 일정 조정, 병해충 방지 시기 판단 등에 활용 가능하다. 특히 낙엽기 기온은 포도 생육주기 마무리와 동해 예방을 위한 핵심 지표로, 작물의 건강한 월동을 유도하고 다음 생육기의 품질 향상에 기여할 수 있다. 본 자료는 재배 농가별 데이터로 구성되어 농장 단위의 환경 차이를 반영한다.
