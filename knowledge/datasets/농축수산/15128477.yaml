description_portal: '도시개발사업 완료에 따른 시설물 관리 이관 시설- 대상지:다문지구소공원 외 32개소- 소공원 8EA, 어린이공원 4EA, 문화공원 3EA, 녹지 17EA, 기타 1EA- 사업내용: 예·제초, 보식, 전정, 덩굴,고사목,맹아,열매 제거,노후화 시설물 보수 등 연중 관리를 통하여 생활권 내 다양한 녹생공간 조성으로 쾌적한 생활환경 및 휴식공간 제공도시공원 및 녹지 등에 관한 법률 제 2조(정의)“도시공원”이란 도시지역에서 도시자연경관을 보호하고 시민의 건강ㆍ휴양 및 정서생활을 향상시키는 데에 이바지하기 위하여 설치 또는 지정된 다음 각 목의 것을 말한다. 다만, 제3조, 제14조, 제15조, 제16조, 제16조의2, 제17조, 제19조, 제19조의2, 제19조의3, 제20조, 제21조, 제21조의2, 제22조부터 제25조까지, 제39조, 제40조, 제42조, 제46조, 제48조의2, 제52조 및 제52조의2에서는 나목에 따른 도시자연공원구역은 제외한다.가. 「국토의 계획 및 이용에 관한 법률」 제2조제6호나목에 따른 공원으로서 같은 법 제30조에 따라 도시ㆍ군관리계획으로 결정된 공원나. 「국토의 계획 및 이용에 관한 법률」 제38조의2에 따라 도시ㆍ군관리계획으로 결정된 도시자연공원구역(이하 “도시자연공원구역”이라 한다)'
