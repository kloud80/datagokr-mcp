summary_user: 경기도 사이버식물병원에 들어온 진단의뢰마다 의뢰자가 고른 피해 증상 코드를 한 행씩 담은 건별 원천 테이블로, 진단의뢰 하나에 증상이 여러 개 연결된다. 증상 유형별 의뢰 건수를 세어 어떤 병해 양상이 자주 의뢰되는지 집계하려는 농업 분석가나 지자체 담당자가 쓴다. 전역 조인 키는 없고, 진단의뢰번호(diagns_rqst_no)로 같은 기관의 진단의뢰 테이블과, 피해 증상 코드로 증상 분류·작목 증상 테이블과 이어 증상명을 붙여 쓴다.
description_portal: 진단_의뢰_피해증상 테이블은 진단의뢰에 포함된 병해 증상 정보를 구조화하여 저장한 데이터로, 의뢰 시 선택된 피해 증상 코드를 보유합니다. 각 레코드는 진단의뢰번호(dx_req_num)와 피해_증상_코드(damage_sympt_cd)로 구성되며, 하나의 진단 요청에 다수의 피해 증상이 연결될 수 있습니다.이 테이블의 피해_증상_코드는 병해 증상의 분류 정보를 담고 있는 증상_분류(sympt_class) 또는 작목_증상(dx_crop_sympt)과 연계되어 보다 세분화된 증상명과 진단 기준을 파악할 수 있도록 지원합니다.이를 통해 동일 작물에 발생 가능한 다양한 병해 양상과 피해 범주를 정량적으로 분석하거나 증상 유형별 병해 진단 통계를 집계하는 데 활용됩니다.
