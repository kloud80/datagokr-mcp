description_portal: '평택시 농업생태원 농가 정보 데이터는 평택시 대표 홈페이지 DB 데이터로서 지역 내 농업생태원 정보를 파악하여 농업생태 관리, 농업 체험 확대, 농업·관광 연계정책 수립에 활용하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 농업생태원에 참여하는 농가의 위치, 재배 품목, 운영 형태 등을 손쉽게 확인할 수 있으며, 민간·연구기관은 농업 체험 프로그램 개발, 지역 농산물 유통 연구, 친환경 농업 기반 구축, 농업교육 서비스 기획 등 폭넓은 분야에서 활용할 수 있습니다. 본 데이터에는 농가명, 주소, 주요 생산품, 참여 프로그램 여부, 방문 가능 여부 등이 포함되어 있어 지역 농업 생태계의 구조를 종합적으로 이해하는 데 도움이 됩니다. 이러한 자료는 농업정책 수립, 농촌관광 활성화, 농가 지원사업 설계, 지역 농산물 브랜드 가치 향상 등 공공·민간 영역의 다양한 활용을 가능하게 하는 중요한 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
