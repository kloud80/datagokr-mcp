summary_user: 농지연금 가입자의 담보농지를 가입년도·도별·지목(전·답·과수원)별로 묶어 면적(천제곱미터)과 농지가격 합계(백만원)를 담은 전국 단위 집계 통계로, 필지별 원천 자료가 아니며 파일 크기는 677바이트의 작은 CSV입니다. 농지연금 정책 분석가나 가입을 검토하는 농업인이 '어느 도에서 어떤 지목의 농지가 연금 담보로 많이 잡히고, 담보 가치는 해마다 어떻게 달라졌나'를 볼 때 쓴다. 필지번호(PNU) 같은 전역 조인 키는 없으므로, 다른 도별 농지·농가 통계와는 도 이름과 연도를 맞춰 이어 쓴다.
limits: 도 단위 집계라 시군구·필지 단위 분석이나 개별 담보농지의 위치·가격 확인에는 쓸 수 없다. 공간 정보가 없고, 다른 데이터와 붙일 공통 코드가 없어 도 이름 매핑으로만 연결된다.
