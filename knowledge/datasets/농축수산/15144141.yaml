description_portal: '항만출입관리시스템 내 수납내역에 대한 정보 입니다."수납내역" 테이블에는 다음과 같은 정보들이 포함됩니다.납부일시: 실제로 납부가 이루어진 정확한 날짜와 시간입니다.납부자 정보: 납부를 한 주체에 대한 정보입니다. 예를 들어, 선박의 소유주나 선사, 항만 이용 업체, 개인 등이 될 수 있으며, 관련 사업자등록번호나 개인 식별 정보가 포함될 수 있습니다.수납 항목/코드: 어떤 명목으로 납부된 금액인지 명확히 구분하는 정보입니다. 예를 들어, "선박입출항료", "접안료", "화물취급료", "과태료" 등 구체적인 항목 코드가 있을 수 있습니다.관련 대상 정보: 어떤 대상에 대한 수납인지 나타냅니다. 예를 들어, 선박의 경우 선박명, IMO 번호 등이 될 수 있고, 차량의 경우 차량 번호, 인원의 경우 신분증 번호 등이 될 수 있습니다.처리 상태: 수납이 "완료", "취소", "환불" 등 어떤 상태인지 나타냅니다.납부 방법: 현금, 카드, 계좌이체 등 어떤 방식으로 납부가 이루어졌는지에 대한 정보입니다.징수 기관/담당자: 해당 수납을 처리한 기관이나 담당자에 대한 정보입니다.'
