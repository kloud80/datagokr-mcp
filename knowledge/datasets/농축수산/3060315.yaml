description_portal: '축산물가격동향은 한우, 돼지, 닭에 대한 축산물 가격(경매가격) 및  한우(등심, 안심, 갈비, 양지, 설도), 돼지고기(삼겹살, 목살, 앞다리살), 육계, 계란, 우유에 대한 소비자 가격을 제시한 데이터입니다. * 경매가격은 축산물품질평가원에서 조사 및 발표한 자료, 농가수취가격은 경매가격을 기초로 산정한 자료입니다.* 농가수취가격 : (한우) 전국경매가격*(생체중(750kg))*(지육율/100)                              (돼지) 전국경매가격*(생체중(110kg))*(지육율/100)* 적용지율율 : 한우 거세우(59.9%), 한우 비거세우(59.1%), 돼지 탕박(76.7%)* 육계 도매가격은 10호 기준입니다.'
