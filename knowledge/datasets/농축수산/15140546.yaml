summary_user: 도매시장에서 거래되는 농산물의 거래 단위를 단위코드와 단위명 한 쌍으로 담은 전국 단위의 기준 코드표이며, 건별 거래 기록이나 집계 자료는 아니다. 도매시장 경락가격이나 반입물량 자료를 분석하는 사람이 '이 코드가 kg인지 상자인지' 같은 거래 단위를 풀어 읽을 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관(농림축산식품부) 도매시장 거래 데이터의 단위코드 필드와 코드값(CODEID)으로 맞추거나 단위명으로 이어 붙인다.
description_portal: 농림축산식품부는 도매시장에서 거래되는 농산물의 단위 정보를 제공하는 OPEN‑API 서비스를 운영합니다. 본 데이터는 단위코드와 단위명으로 구성되어 있으며, 이를 통해 농산물의 거래 단위 체계를 표준화하여 파악할 수 있습니다. 단위 정보는 농산물 유통의 효율성을 높이고, 거래 실적 분석 및 정책 수립에 필요한 기초 자료로 활용됩니다. 또한, 표준화된 단위 코드를 통해 데이터의 일관성과 정확성을 높이며, 농업 통계 수집 및 유통망 구조 파악에 기여합니다. 해당 데이터는 농산물 유통의 투명성과 효율성 향상을 위한 핵심 자료로 기능합니다.
