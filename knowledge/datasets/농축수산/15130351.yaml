description_portal: 본 데이터는 해양수산부에서 제공하는 어촌뉴딜 공간환경 마스터 플랜 우수사례 자료입니다. 주요 항목으로 지역으로는 충남당진시 난지도항, 경남 남해군 설리향, 전남 목표시 달리도항의 사례정보를 포함하고 있습니다. 이 데이터는 관련분야 현황분석연구, 정책수립 기초자료활용, 학술연구 참고자료활용, 민원응대 업무참고자료, 교육콘텐츠 제작기초자료 등에 활용할 수 있습니다. 환경연구자, 수산물안전관리 담당자, 양식업종사자 등에서 환경모니터링과 안전관리 업무에 활용할 수 있습니다. 해양환경보전과 수산물안전성 확보를 위한 정책수립의 핵심자료로 활용되고 있습니다
