summary_user: 국립농산물품질관리원이 관리하는 가공용쌀(밥쌀용 외 쌀) 유통 단속 결과를 단속 연월·시도별로 집계한 데이터로, 조사 건수와 위반 업체 수, 지정용도 외 사용·표시 위반·관리대장 미비치·기타 위반 건수를 담는다. 정책 분석가나 쌀 유통·가공 사업자가 어느 시도에서 어떤 유형의 가공용쌀 위반이 많았는지, 시기별로 단속 결과가 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시도명이나 연월을 이름 그대로 맞춰 연결해야 한다.
description_portal: 가공용쌀은 "밥쌀용 외 쌀"이라고도 하며 일반 밥쌀과 품종은 같되, 용도를 식품 가공 또는 주정용으로 한정한 쌀로 제분에 특화돼 밀을 대체하는 가루쌀(분질미)과는 품종·용도·특성이 다르다. 가공용쌀은 밥쌀시장에 유통되지 않아 쌀 생산·수급 조정에을 위하여 도입하였으며, 본 정보는 국립농산물품질관리원에서 관리하는 가공용쌀 유통에 대한 단속 현황 정보로서, 단속 연월, 시도, 조사 건수, 위반 업체 수, 지정용도외 사용 건수, 표시 위반 건수, 관리대장 미비치 건수, 기타 위반 건수 항목으로 구성되어 있습니다.
