description_portal: 경기도 양평군 내 반려동물 판매 허가업체에 관한 데이터입니다. 동물판매업이란 반려동물을 구입하여 판매하거나, 판매를 알선 또는 중개하는 영업을 말합니다.  동물보호법 제69조(영업의 허가)에 따른 동물판매업을 등록한 업체의 상호명, 도로명주소, 지번, 위도, 경도, 전화번호등의 항목을 제공합니다. 양평군 내 허가를 득하여 영업 중인 업체는 4개 업체로 반려동물을 구매하고자 할 경우 해당 업체에서 구매 가능합니다. 반려동물 구매시 관련 법령에 따라 반려동물 소유자 의무규정을 준수하여야 합니다. 동물판매업을 하려는 자는 동물보호법에서 정하는 바에 따라 양평군수에게 허가를 득하여야 합니다. 이와 관련한 자세한 사항은 양평군 농업기술센터 축산반려동물과로 문의하여 주시기 바랍니다.
