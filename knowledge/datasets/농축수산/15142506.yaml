summary_user: 국립해양조사원 조위관측소가 수온계로 자동 측정한 실측 수온(℃)을 관측소·관측일시별로 담은 건별 API 데이터로, 검증 호출에서 전국 24행(2026-10-01 하루치)이 수신됐다. 연안 양식장 인근 수온 변화나 수상레저 전 바다 수온을 확인하려는 사업자·국민·분석가가 쓴다. 위도(lat)를 좌표 조인 키로 삼아 다른 좌표 기반 해양 관측 데이터와 잇고, 관측소 코드는 바다누리 자체 키로 관측소 단위 연결에 쓴다.
limits: 검증 호출이 reqDate=20261001 조건이라 확인된 기간은 하루뿐이며, 데이터 자체의 최신성이나 전체 보유 기간을 단정할 수 없다. 조인 키가 좌표(lat)여서 다른 데이터와 맞출 때 좌표 근사 매칭이 필요하다. 호출에는 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
