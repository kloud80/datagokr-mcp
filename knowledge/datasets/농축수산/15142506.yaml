description_portal: 이 데이터는 해양수산부 국립해양조사원의 조위관측소에서 수온계를 이용해 실시간으로 수온을 자동 측정하고, 그 결과를 제공하기 위해 제작되었습니다..  관측소 코드, 관측일, 결과 출력 간격 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소 코드, 관측소 위도, 경도, 관측일시, 측정 수온(℃)값 정보로 구성되어 있습니다.  본 데이터는 연안 생태계 및 어획량 변동 분석, 해양 환경 연구, 실시간 해양 정보 서비스 개발, 기상 및 해양 재난 예측, 해상교통 및 수상레저 안전관리 등 다양한 해양 관련 분야의 연구 및 정책 지원에 활용될 수 있습니다.
