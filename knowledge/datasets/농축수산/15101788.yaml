summary_user: 전국 잠업가구를 대상으로 기능성 양잠 농가의 경영주 연령분포를 정리한 집계표로, 전국 단위·비공간 자료이며 개별 농가 건별 원천이 아니다. 잠업 정책 담당자나 연구자가 '기능성 양잠 경영주 가운데 고령층 비중이 얼마나 되고 청년 신규 진입이 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 같은 기관의 양잠 농가현황 다른 표(양잠형태별 생산·누에 판매 등)와는 항목명이나 연도를 직접 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 양잠농가 현황에 관한 데이터로, 잠업에 종사하는 전국의 모든 잠업가구의 양잠형태별 생산 현황, 누에 생산, 판매현황 및 기능성 양잠 경영주 연령분포 등을 제공하고 있습니다. 이를 통해 잠업 산업의 규모와 구조, 생산 패턴을 종합적으로 파악할 수 있으며, 연령별 경영주 분포 분석을 통해 기능성 양잠 산업의 인력 구성과 세대별 참여 현황을 이해할 수 있습니다. 또한 누에 생산 및 판매 실적 정보를 활용하면 농가의 경제적 성과와 시장 유통 구조를 분석할 수 있으며, 이를 기반으로 잠업 지원 정책 수립, 신규 창업 촉진, 생산 효율화 방안 마련 등 다양한 정책적·산업적 활용이 가능합니다. 이 데이터는 전국 양잠산업 현황을 체계적으로 정리한 기초 자료로서, 잠업 산업 경쟁력 강화와 지속 가능한 생산 기반 구축에 중요한 참고 자료로 활용될 수 있습니다.
