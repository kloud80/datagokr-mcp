description_portal: 동해안 지역의 산불위험에 대비하기 위해 2021년 10월부터 동해안 10개 시군(강원  6개 지역(고성, 속초, 양양, 강릉, 동해, 삼척), 경북 4개 지역(울진, 영덕, 포항, 경주))을 평지 및 산간으로 구분하여(총 20개소) 개소별 1시간 단위로 산불위험예보를 분석하여 제공함. 산불위험지수는 기상(기온, 상대습도, 풍향, 풍속), 임상(침엽수, 활엽수, 혼효림), 지형(고도, 방위 등)을 분석하여 1~100까지의 위험지수로 산출하며, 제공항목으로는 지역별 산불위험지수의 최소값, 최대값, 평균값과 산불위험등급 (낮음(50이하), 다소높음(51~65), 높음(66~85), 매우높음(85 초과))으로 구분하여 10개 지역 20개소의 최근 1개월간 정보를 제공함
