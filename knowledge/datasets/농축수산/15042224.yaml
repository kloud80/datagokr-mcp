description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 지류의 위치 정보를 제공합니다. 본류에 합류하는 작은 하천인 지류의 지리 정보를 담고 있어 수계 관리와 하천 계획에 활용됩니다. 지형지물부호는 지류를 식별하는 지형 분류 코드이며, 지류구분은 하천의 등급이나 규모를 나타냅니다. 경도와 위도는 지류의 정확한 지리 좌표를 제공하고, 지번주소는 지류가 흐르는 지역의 주소 정보를 나타냅니다.본 데이터는 하천 관리, 수계 네트워크 분석, 홍수 예방 계획, 수질 관리, 생태 환경 보전 등에 활용되며 체계적인 하천 관리와 수자원 보호를 지원합니다.
