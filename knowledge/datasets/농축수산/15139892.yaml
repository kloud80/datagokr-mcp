description_portal: "충청북도 충주시 내 돼지 사육시설(일명 '돼지공장')에서 발생하는 가축분뇨의 발생량과 처리공법 정보를 수록한 데이터임. 축산업 관련 환경관리, 수질오염 방지 대책 수립, 폐수 처리시설 계획 수립 등에 활용 가능함.주요 항목은 상호(축산시설 명칭), 시설 소재지, 전화번호, 축산폐수 배출량(일일 또는 연간 기준), 처리시설명, 처리방법(예: 액비화, 정화처리 등), 처리공법(예: 침전, 생물학적 처리, 고도처리 등) 등으로 구성됨.가축분뇨 처리방법 및 처리공법은 환경부 기준에 따라 다양하며, 지역 내 시설의 환경오염 영향도를 분석하거나, 분뇨 처리 효율성 평가, 친환경 축산 전환 정책 수립 등에 참고자료로 활용됨.※ 본 데이터는 자가처리시설 및 위탁처리 포함 여부에 따라 폐수 발생량과 처리방식에 차이가 있을 수 있으며, 시설별 운영 현황은 수시로 변동될 수 있음."
