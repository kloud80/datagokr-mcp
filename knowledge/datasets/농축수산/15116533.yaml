description_portal: 대전광역시 아프리카돼지열병 검사실적 자료는 돼지에만 감염되는 치명적인 바이러스성 출혈성 전염병인 아프리카돼지열병(ASF)에 대한 지역 내 방역 현황을 체계적으로 제공합니다. 이 자료는 사육 중인 돼지, 도축장 출하 돼지, 축산시설 환경시료 등 다양한 검사 대상을 포함하며, 항원검사 실적을  월별로 상세히 기록하고 있습니다. 아프리카돼지열병은 치사율이 30~100%에 이르는 매우 위중한 질병으로, 발병 시 대규모 살처분과 이동제한 등 강력한 방역조치가 필요합니다. 자료는 지역 내 발생 감시, 조기 감염 확인, 감염경로 추적, 농가별 위험도 평가 등 다양한 분석에 활용되며, 축산업 보호와 공공 보건 안전 확보에 중요한 역할을 합니다.
