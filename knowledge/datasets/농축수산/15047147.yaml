description_portal: '○ 통계개요* 통계명 : 임목축적(임상별)* 통계종류 : 서울시 수목의 종류에 따른 산림면적 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 산림면적의 소유ㆍ임목별 현황을 조사ㆍ분석하여 산림정책 수립의기초자료로 활용하고, 산림자원의 관리보호 및 활용을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 해당기관 및 자치구 → 시도 → 산림청* 공표주기 : 정기(5년)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 산림의 임상별 임목축적 현황○ 용어설명* 임목축적 : 장래 목재수확을 거두기 위하여 임지에 보유되어 있는 임목의 전체를 말함- 침엽수림 : 침엽수림의 수관점유면적 또는 입목본수 비율이 75% 이상인 임지- 활엽수림 : 활엽수림의 수관점유면적 또는 입목본수 비율이 75% 이상인 임지- 혼효림 : 침엽수와 활엽수의 수관점유면적 또는 입목본수의 비율이 각각 25%이상75% 미만인 임지'
