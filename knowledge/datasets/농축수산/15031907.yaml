description_portal: '경상남도 거창군 축산농장(한우, 육우, 젖소, 돼지, 육계, 산란계, 오리 등) 데이터로 경상남도 거창군 축산농장의 사업장 명칭, 경상남도 거창군 축산농장의 주사육업종, 경상남도 거창군 축산농장의 두수, 경상남도 거창군 축산농장의 사업장 소재지, 오폐수 배출량, 오폐수 처리방법 항목을 제공합니다. ○ 데이터 제공일 : 2025. 11. 01.○ 축산농장이란 가축을 사육하여 축산물을 생산하는 농장을 의미합니다. 넓게는 축산업을 영위하는 모든 시설을 포함하며, 좁게는 가축을 사육하는 축사 및 관련 시설을 의미하기도 합니다. 축산법에 따라 가축을 사육하는 축산농장은 일정 규모 이상일 경우 지자체에 신고해야 합니다. 축산농장의 오폐수는 수질오염의 주요 원인 중 하나로, 법적 규제와 다양한 처리 기술이 적용되고 있습니다. 모든 축산농가는 폐수를 공공수역에 직접 유입시키지 않도록 처리해야 합니다.'
