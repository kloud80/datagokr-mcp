summary_user: 국립수목원 국가생물종지식정보시스템의 식물자원을 종 단위로 조회하는 API로, 국명·학명·과명과 식물 종ID, 표본수 같은 항목을 담고 전국·비공간 범위다. 연구자나 탐방객이 특정 식물의 학명과 소속 과, 수목원에 보관된 표본이 몇 점인지 확인하는 데 쓴다. 전역 조인 키는 없고, 식물 종ID(plantSpecsId)를 목록 조회에서 먼저 받아 상세·종자·도감 조회에 넘기는 내부 연결이 중심이며, 다른 데이터와는 학명·국명 같은 이름 매칭으로만 잇는다.
description_portal: 국립수목원 국가생물종지식정보시스템에서 식물자원의 항목별 정보 및 상세정보를 조회할 수 있는 서비스로서 식물도감, 특산식물, 식물표본, 식물종자, 민속식물, 외래식물 정보 등을 조회할 수 있습니다.
