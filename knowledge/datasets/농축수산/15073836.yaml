summary_user: 농림축산식품부 소관 녹색기술 인증 건을 한 행씩 담은 전국 단위 파일(CSV, 약 11KB)로, 기술명·신청기관·신규 여부·인증 확정일과 유효기간 만료일을 담는다. 농업 분야 녹색기술 인증을 받은 기관과 기술이 무엇이고 인증이 아직 유효한지를 확인하려는 사업자·투자자·정책 분석가가 쓴다. 녹색기술인증번호(green_cert_no)를 키로 다른 부처의 녹색인증 현황이나 녹색인증 관련 자료와 이어 쓰며, 지역 코드나 품목코드는 없어 농산물 가격(KAMIS) 자료와는 직접 연결되지 않는다.
description_portal: 해당 데이터는 저탄소 녹색성장 기본법 제32조 및 녹색인증제 운영요령(관계부처 합동고시)에 근거하여 저탄소 녹색성장을 실현하기 위해 추진되는 녹색분야 기술 및 프로젝트의 범위를 명획히 규정하고 있으며, 녹색산업에 대한 민간 투자 활성화를 위해 시행되고 있습니다. 이 자료는 국가 차원의 자원 및 환경 위기 극복, 지속 가능한 성장 전략 수립에 중요한 역할을 하며, 학술연구 및 정책 분석의 근거 자료로도 활용될 수 있습니다. 또한, 녹색산업의 발전 방향을 모색하고, 관련 제도의 개선이나 신규 사업 추진에 참고할 수 있습니다.
