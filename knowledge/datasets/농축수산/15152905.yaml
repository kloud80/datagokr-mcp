description_portal: 이 데이터는 해양수산부 어선거래정보의 관리의 목적으로 수집된 데이터 입니다. 본 데이터의 주요 내용은 어선거래시스템 데이터베이스에서 보유하고 있는 어업 설비 거래와 관련된 정보로 구성되어 있으며 설비 명칭, 거래 상태 등 어업 설비의 거래 현황에 관한 항목들로 이루어져 있습니다.본 데이터는 설비중개조건 순번(중개업자 등록 시 순서대로 부여되는 번호) 및 설비매도매수(설비 거래상태로 'deal_request'는 매수신청,'deal_complete'는 거래완료, "real_check'는 실물확인 완료, not_select는 중개업자 미선정, deal_contract는 계약 중을 나타냄)등의 데이터를 포함하고 있습니다. 본 데이터는 어업 설비의 거래 추이 분석, 어업 정책 수립을 위한 참고자료, 어업 설비 시장 동향 모니터링, 어업 설비의 거래 관련 연구 및 내부 관리 자료로 이용될 수 있습니다. 또한, 어선거래시스템의 활성화를 위한 기능 개선에 있어서 항목을 조정하는데 있어서 참고로 활용할 수 있는 데이터입니다.
