summary_user: 국립농산물품질관리원이 관리하는 농산물우수관리(GAP) 인증기관의 부사무소 목록으로, 인증기관별 지정번호·기관명·본사/지사 구분·소재지·전화번호를 사무소 한 곳당 한 행으로 담으며 범위는 전국이다. 농업인이나 생산자단체가 "우리 지역에서 GAP 인증을 신청할 수 있는 인증기관 사무소는 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 GAP 인증 데이터와는 인증기관 지정번호나 기관명을 맞춰 연결해야 한다.
description_portal: 국립농산물품질관리원에서 관리하는 GAP인증기관의 부사무소 정보로서, 지정번호, 인증기관명, 본사/지사, 소재지, 전화번호 항목으로 구성된 데이터입니다. 농산물우수관리(GAP) 인증이란 생산에서 판매 단계까지 안전관리체계를 구축하여 소비자에게 안전한 농산물을 공급하고 농산물의 안전성 확보를 통한 소비자 신뢰 제고 및 국제시장에서의 우리 농산물의 경쟁력 강화하며 저투입 지속가능한 농업을 통한 농업환경 보호를 목적으로 도입된 제도이며 인증기관에서 인증업무를 추진하고 있습니다.
