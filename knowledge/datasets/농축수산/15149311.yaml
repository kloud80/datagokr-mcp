description_portal: 식물신품종 보호법 제16조(품종보호 요건)에 따라 신규성, 구별성, 균일성, 안정성 및 제106조제1항에 따른 품종명칭을 갖춘 품종은 이 법에 따른 품종보호를 받을 수 있으며, 본 데이터는 배추 작물의 출원품종 중 신규성 및 품종명칭 심사와 재배심사를 통한 구별성, 균일성, 안정성 요건을 구비하여 현재 품종보호등록 중인 배추 신품종에 대한 데이터입니다. 신품종에 대한 출원번호, 출원일자, 품종명, 출원인 및 품종의 대표사진 등의 자세한 자료를 제공하고 있습니다. *  “품종”이란 식물학에서 통용되는 최저분류 단위의 식물군으로서 제16조에 따른 품종보호 요건을 갖추었는지와 관계없이 유전적으로 나타나는 특성 중 한 가지 이상의 특성이 다른 식물군과 구별되고 변함없이 증식될 수 있는 것을 말한다.**  “보호품종”이란 이 법에 따른 품종보호 요건을 갖추어 품종보호권이 주어진 품종을 말한다.*** 제55조(품종보호권의 존속기간) 품종보호권의 존속기간은 품종보호권이 설정등록된 날부터 20년으로 한다. 다만, 과수와 임목의 경우에는 25년으로 한다.
