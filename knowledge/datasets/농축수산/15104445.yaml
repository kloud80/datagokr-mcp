description_portal: 해양수산과학기술진흥원이 제공하는 해양수산 분야 연구개발(R&D) 공고 목록으로, 해양수산 분야에서 추진되는 다양한 연구개발 사업과 관련된 공고 정보를 종합적으로 확인할 수 있도록 구성되어 있다. 공고번호, 공고명, 예산연도, 사업명, 공고 시작일, 접수 시작일, 공고 및 접수 종료일, 상태, 공고 담당자 등의 항목을 포함하고 있어 연구자, 기업, 공공기관 등이 손쉽게 사업 참여 기회를 탐색할 수 있다. 또한 예산연도별 연구개발 사업 현황을 비교하거나 공고 일정 관리 및 참여 조건 분석 등 다양한 목적으로 활용 가능하다. 이를 통해 해양수산 연구개발 지원 정책의 흐름을 파악하고, 연구자와 산업계는 전략적으로 연구 과제를 준비할 수 있으며, 정책 담당자는 연구개발 지원체계의 운영 현황을 진단할 수 있다. 나아가 본 데이터는 해양수산 분야의 혁신과 성장을 촉진하는 실질적인 정보 제공을 목적으로 한다.
