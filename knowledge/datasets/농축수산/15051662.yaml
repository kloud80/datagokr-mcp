summary_user: 인천 남촌농산물도매시장의 도매법인별로 일정 기간 취급한 채소·과일의 품목별 거래물량과 거래금액을 집계한 파일(csv)이다. 유통 분석가나 행정 담당자가 '남촌도매시장에서 어느 법인이 어떤 품목을 얼마나, 얼마어치 거래했나'를 파악해 반입·가격 동향을 볼 때 쓴다. 전역 조인 키가 없어 품목명이나 법인명을 KAMIS·다른 도매시장 품목코드와 직접 매핑해야 이어 쓸 수 있다.
description_portal: 인천광역시 남촌농산물도매시장 법인별 품목별 거래실적은 남촌농산물도매시장의 각 법인들이 일정기간 동안 취급한 농산물(채소 및 과일)의 품목별 거래물량과 거래금액을 집계한 자료로 인천광역시 남촌농산물도매시장 내 농산물 유통현황을 파악하고 공급과 수요의 변화 가격변동추이 등을 분석하는데 활용할 수 있습니다. 해당자료는 농산물 유통의 투명성을 제고하고 시장 내 거래현황을 객관적으로 파악할 수 있도록 지원하며, 유통관계자와 소비자 행정기관등이 유통구조분석, 가격동향 모니터링, 정책수립 등의 기초자료로 활용할 수 있다.
