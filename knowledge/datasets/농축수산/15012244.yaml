description_portal: 광주김치는 전라남도의 풍부한 재료(배추, 무, 천일염, 해산물, 젓갈 등)를 사용해 만든 대한민국 대표 전통식품입니다. 전라남도의 풍부한 재료를 활용하여 숙성될 수록 게미진 맛의 진수를 보여주는 광주김치는 대한민국과 세계의 자랑입니다. 전통방식으로 만든 광주김치를 통해 세계인이 사랑하고 즐겨 찾고 있는 유산균이 풍부한 건강식품인 k-푸드의 인기를 느껴보세요. 본 자료는 광주광역시에 소재한 해썹 인증 김치류 식품 제조업체 현황에 대한 데이터로 업체명, 소재지 도로명 주소 등의 항목을 제공합니다.
