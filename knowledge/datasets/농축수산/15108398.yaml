description_portal: 이 데이터는 2022년 경상남도 남해군 지역 내 농지별로 논, 유자, 고구마, 두릅, 참깨, 고추 6가지 주요 작물의 재배 현황을 제공합니다. 드론으로 촬영한 고해상도 이미지를 분석해 농업 디지털전자지도(팜맵) 기반 공간정보로 구축되어, 각 농지마다 어떤 작물이 얼마나 재배되는지 위치와 규모까지 손쉽게 확인할 수 있는 것이 큰 특징입니다. 이를 통해 행정기관은 현장 조사 없이도 신속하게 지역 농업 구조와 작물 분포를 파악해 정책과 지원사업을 효율화할 수 있고, 생산자는 경작지 현황 파악과 경영 분석, 타 농가와의 비교, 효율적인 농사계획 수립에 도움을 받을 수 있습니다. 개발자는 지도 기반 정보 서비스나 농업 빅데이터 분석, 스마트팜 앱 등의 개발에 활용할 수 있습니다. 다만 2022년 기준의 단일 연도 데이터로, 과거·미래 변화 추적에는 한계가 있고, 드론 영상 판독 기준에 따라 실제 재배와 차이가 발생할 수 있으니 참고가 필요합니다.
