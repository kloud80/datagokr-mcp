summary_user: FTA를 체결·발효한 상대국(유라시아·중남미·인도·중동·북미·EU·아세안 등)별 농축산물 교역 현황을 국가와 구분(수출·수입 등) 행으로 나누고, 2019~2024년 연도별 열로 정리한 집계표로, 전국 단위의 비공간 자료다. 농축산물 수출업체나 정책 분석가가 특정 FTA 발효 뒤 해당 국가와의 농축산물 수출입 규모가 어떻게 달라졌는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가명을 기준으로 다른 무역·통계 자료와 이름 매핑해야 이어 쓸 수 있다.
description_portal: 해당 데이터는 농림축산식품부 자유무역협정팀에서 정리한 FTA체결 및 발효 국가별 농축산물 교역 현황에 관한 자료로, 유라시아, 중남미, 인도, 중동, 북미, EU, 아세안 등 FTA체결 및 발효 중인 국가들의 농축산물 교역 현황을 제공하고 있습니다. 이를 통해 FTA 발효에 따른 농축산물 시장 개방 효과와 교역 확대 현황을 체계적으로 파악할 수 있으며, 농업·축산업 분야의 수출 전략 수립과 시장 다변화 방안을 모색하는 데 중요한 기초 자료로 활용될 수 있습니다. 또한 해당 데이터는 국내 농업의 경쟁력 강화와 해외 시장 진출 전략 수립, 나아가 교역 상대국과의 협상 과정에서 실질적인 참고자료로 의미가 있습니다. 정책 담당자에게는 무역 정책 평가 및 보완 대책 수립에 유용하며, 연구자와 산업계에는 FTA로 인한 농축산물 교역 구조 변화와 경제적 파급효과를 분석할 수 있는 기반 자료가 됩니다.
