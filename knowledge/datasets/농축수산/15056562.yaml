summary_user: 전국 농촌마을을 마을 단위(마을 식별자·마을명)로 한 건씩 담고, 자연·경제·문화 자원과 공동체 조직 정보를 항목별로 나눠 싣는다. 귀농 희망자나 농촌개발 담당자가 "이 마을에는 어떤 자연·문화 자원과 주민 조직이 있는가"를 확인하고 마을끼리 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 마을명 매핑이나 같은 기관의 마을 식별자(VILL_ID)로만 잇는다.
description_portal: 농림수산식품교육문화정보원이 제공하는 본 API는 전국의 2,600여개 농촌마을에 대한 자원 및 조직정보를 상세히 모집할 수 있는 기회를 제공합니다. 데이터에는 해당 농촌마을의 마을명, 유래, 귀농현황, 인구현황, 주택현황 등의 기본정보가 포함되어 있으며, 이러한 정보는 매 2년마다 갱신될 예정입니다. 이 정보를 활용하여 농촌개발을 위한 정책 수립에 기여할 수 있으며, 지역 주민의 공동체 활동을 촉진하고, 귀농 인구의 정착 및 농촌 활성화를 지원하는 데 큰 도움이 됩니다. 또한, 농촌마을별 자원 및 조직정보 탐색 기능을 통해 마을의 인적 자원, 물적 자원, 조직현황 및 리더십 구조에 대한 정교한 데이터 분석이 가능하여, 농촌 삶의 질 향상 및 지역사회 발전을 위해 활용할 수 있습니다. 이는 특히 농촌 공동체 활성화와 지속 가능한 농촌 발전의 기반을 다지는 데 매우 유용하게 사용될 수 있습니다.
