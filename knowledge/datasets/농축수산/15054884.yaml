description_portal: 인천광역시가 제공하는 해안선 및 도서 현황 공공데이터는 시내 군/구별로 육지부와 도서부의 해안선 길이, 유인 및 무인 도서의 개수 등을 집계한 통계 자료입니다. 이 데이터는 지역 해양 경계 및 도서 자원의 규모를 파악하고, 해양 안전 정책, 도서 개발 계획, 환경 보전 등의 기초 자료로 활용됩니다.목록 구성1. 군구별(중구, 동구, 미추홀구, 연수구, 남동구, 부평구, 계양구, 서구, 강화군, 옹진군)2. 해안선(육지부, 도서부)3. 도서현황(유인도, 유인도 세대, 유인도 인구, 무인도수)해당 데이터는 공공데이터포털에서 CSV파일을 무료로 다운로드 할 수 있습니다.
