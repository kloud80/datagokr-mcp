summary_user: 시설채소 온실현황과 채소류 생산실적을 조사한 국가승인통계로, 채소류 분류(최대 3단계)와 재배유형(노지·시설 등)별로 연도(2024) 값을 담은 전국 단위 집계표이다. 농업정책 담당자나 연구자가 특정 채소의 재배유형별 생산 규모가 어떤지 확인하고 수급 대책이나 생산 동향 분석의 기초자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 채소 품목명 매핑으로만 연결하며, KAMIS 가격 등과 붙일 때는 기관마다 다른 품목코드를 따로 대조해야 한다.
description_portal: 해당 데이터는 시설채소 온실현황과 채소류 생산실적을 조사하여 농산물 생산 및 수급 대책 수립, 학술연구, 농업정책 등에에 활용하기 위해 마련된 자료입니다. 본 조사는 국가승인통계로 ｢통계법｣ 제18조 및 ｢농업통계조사규칙｣(기획재정부령 제509호, 2015.11.16)에 근거하여 체계적으로 실시되고 있습니다. 해당 자료는 농업정책 수립, 학술연구, 수급 안정화 방안 마련 등 다양한 분야에서 기초자료로 활용되며, 기상 여건 변화나 시장 수요에 따른 채소류 생산 동향 분석에도 중요한 역할을 할 수 있습니다. 이를 통해 농가 지원 정책을 정교하게 설계할 수 있으며, 효율적인 경영 전략 수립과 지속 가능한 채소 산업 발전에 필요한 근거 자료로 활용할 수 있습니다.
