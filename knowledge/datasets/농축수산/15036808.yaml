description_portal: '충청남도 당진시 배 농가 위치 및 재해 현황 안내(데이터 기준일자: 2019년 6월 13일)충청남도 당진시는 지역 대표 특산물인 **배(梨)**의 안정적인 재배와 생산 기반 보호를 위해 배 농가의 위치 정보 및 재해 피해 현황을 관리하고 있습니다.본 자료는 당진시 관내 배 재배 농가의 위치 및 면적, 그리고 해당 농가에서 발생한 주요 재해 이력 등을 정리한 것입니다.농가 위치정보: 행정구역, 주소 또는 좌표 등재배 면적: 농가별 배 재배 면적재해 현황: 병해충, 냉해, 강풍, 우박 등 피해 유형 및 피해 정도본 자료는 과수 재배 기반 관리, 농업재해 대응 정책 수립, 농가 지원 계획 마련,지역특산물 생산 현황 분석, 재해복구 지원 근거자료 등 다양한 행정 및 공공 목적에 활용될 수 있습니다.'
