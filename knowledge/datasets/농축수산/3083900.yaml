summary_user: 경상남도가 기술지도선으로 해상에서 측정한 어장예찰 해황조사 결과를 조사일자·조사지점별 한 행으로 담은 파일(csv, 약 156KB)로, 표층·수심 5m·10m의 수온·염분·용존산소·수소이온농도와 투명도, 지점 위경도를 포함한다. 양식 어업인이나 수산 분석가가 특정 해역의 고수온·저산소 발생 시기와 지점을 확인하고 어장 상태 변화를 추적하는 데 쓴다. 전역 조인 키는 없으므로 지역명·조사지점명칭으로 이름을 맞추거나 조사지점 위도·경도로 다른 해양 관측·어장 데이터와 공간 매칭해 이어 쓴다.
limits: 공통 코드나 식별번호가 없어 다른 데이터와는 이름·좌표 매핑으로만 연결된다. 측정이 불가한 지점은 일부 항목이 비어 있고, 선박 운항 중 측정값이라 방파제·바지선 등 개인 측정값과 다를 수 있다. 범위는 경상남도 내 개별 지점에 한정된다.
