summary_user: 경기도 시군별로 어업분류(내수면어업, 연안구획신고어업 등)와 어업중분류(자망, 통발, 종묘채포 등)에 따른 어업 허가·신고 건수를 집계한 통계로, 건별 허가 원장이 아닙니다. 어느 시군에 어떤 유형의 어업 허가가 많은지 비교하려는 분석가나, 내수면·연안 어업 정책을 세우는 담당자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시군명 이름 매핑으로만 연결한다.
description_portal: '이 데이터는 경기도 내 어업에 대한 허가 및 신고 현황을 나타낸 자료로, 시군명, 어업분류명(예: 내수면어업, 연안구획신고어업 등), 어업중분류명(예: 자망, 통발, 종묘채포 등), 허가건수로 구성되어 있습니다. 어업활동의 유형별로 분류되어 있어 어업의 형태와 규모를 파악할 수 있으며, 시군 단위의 공간정보가 포함되어 지역별 어업 활동의 밀도와 특성을 분석할 수 있습니다. 특히 내수면 중심 어업이나 연안구획 신고 어업과 같은 세부 유형별 허가 건수 통계를 통해 수산 자원관리, 어업정책 수립, 허가제 운영의 실태 평가 등에서 활용될 수 있는 기초자료입니다.'
