description_portal: 이 데이터는 해양수산부에서 수집한 바다내비 표시장치 장비정보를 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 23년 1월부터 26년 3월까지의 바다 내비게이션 표시장치에 대한 장비 정보로 구성되어 있으며, 장비가 선박에 실제로 설치되어 운항 중인지 여부와는 무관하게 장비 자체의 정보를 중심으로 정리된 데이터입니다. 개인정보는 삭제 처리하여 제공되고 있습니다.   본 데이터는 바다내비 표시장치 장비의 보급 현황이나 기술적 특성, 장비 관리 및 장비 운용 정책의 검토 등과 같이 해양수산 관련 장비의 현황 파악, 장비 설치 및 점검 업무, 그리고 관련 장비 제조 및 유통의 실태 파악에 활용될 수 있습니다.
