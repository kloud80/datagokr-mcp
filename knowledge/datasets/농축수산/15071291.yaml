description_portal: 해양생명자원통합정보시스템(MBRIS)은 「해양수산생명자원의 확보·관리 및 이용 등에 관한 법률」에 근거하여, 우리나라 해양수산생명자원의 효율적인 확보, 체계적인 관리, 그리고 지속 가능한 이용을 위한 기반 시스템으로 운영되고 있습니다. 이 시스템은 해양수산생명자원 책임기관과 기탁등록보존기관을 지정·관리하며, 해당 기관들이 보유하고 있는 해양수산생명자원을 시험 및 연구 목적으로 필요한 신청자에게 분양할 수 있도록 지원하는 역할을 수행하고 있습니다. 분양 가능한 자원의 유형으로는 해양생명유전자원, 배양체, 추출물, 생체조직, 표본 등이 있으며, 각 자원은 자원의 특성에 따라 회당 또는 연간 분양 수량이 사전에 정해져 있어, 연구기관이나 기업은 자원 이용 목적에 맞게 합리적으로 자원을 신청하고 활용할 수 있습니다. 이를 통해 MBRIS는 해양자원의 공정한 이용과 공유, 그리고 생명자원의 산업적 확장을 지원하며, 국가적 차원의 생물주권 확립과 해양바이오산업 발전에 기여하고 있습니다.
