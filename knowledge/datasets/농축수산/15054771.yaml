description_portal: 본 데이터는 해양수산부에서 관리하는 업종별 등록어선통계 통계자료입니다. 주요 항목으로 원양/근해/연안/내수면/양식 및 기타 구분별 연승, 트롤, 선망, 통발 등 업종별로 무동력, 동력 등록어선의 척수, 톤수 및 마력수 합계 통계 정보를 포함하고 있습니다. 이 데이터는 어업별 어선분포 현황파악, 선령별 어선교체 계획수립, 톤급별 어업허가 관리업무, 어선안전관리 정책수립 기초자료 등에 활용할 수 있습니다. 어업정책 입안자, 수산업연구자, 어업인단체 관계자 등에서 정책수립과 연구목적으로 유용하게 활용할 수 있습니다.
