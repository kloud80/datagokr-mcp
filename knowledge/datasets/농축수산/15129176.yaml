description_portal: 이 데이터는 금산군 양계농가현황으로 금산군 데이터포털(www.geumsan.go.kr/bigdata)에서 양계구분별 농가수와 마릿수의 데이터의 링크를 제공합니다. 주요 항목으로는 관리번호, 기준일자, 양계구분, 농가수, 마릿수 등이 있으며 요약형 데이터입니다. 양계종류에는 닭, 오리, 칠면조, 거위, 메추리 등이 있습니다. 해당 데이터는 지역 축산업 정책 수립, 방역 계획, 축산환경 개선 등을 위한 기초 통계자료로 유용합니다. 본 데이터는 XLS 형식으로 제공되며, 외부 URL을 통해 상세 데이터를 조회할 수 있도록 구성되어 있습니다. 연간 수집된 단일성 데이터이며, 축산물 유통 정책자료로도 활용이 가능합니다.
