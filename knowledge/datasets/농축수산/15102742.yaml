summary_user: 2017~2021년 전국 농약의 생산량과 출하량을 연도별·약제별(살균제·살충제·제초제)로 정리한 집계표 파일이다. 농약업계 분석가나 정책 담당자가 '최근 몇 년간 제초제 출하량이 늘었는가'처럼 약제 종류별 수급 추세를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·약제 이름을 맞춰 붙이는 방식으로만 연결한다.
description_portal: 해당 데이터는 2017년부터 2021년까지의 연도별, 약제별 농약 생산량 및 출하량에 관한 자료로, 살균제, 살충제, 제초제의 생산량 및 출하량에 대한 내용을 제공하고 있습니다. 이를 통해 농약의 수급 현황과 연도별 추세를 종합적으로 분석할 수 있습니다. 해당 자료는 농약산업의 공급망 관리와 농업 현장의 안전성 평가, 환경 영향 분석에 기초 자료로 활용될 수 있습니다. 또한 정책 입안자는 이 데이터를 기반으로 농약 사용 규제 및 안전 기준을 마련할 수 있으며, 연구자는 농약 사용과 작물 보호 효과 간의 연계성을 분석하는 데 참고할 수 있습니다.
