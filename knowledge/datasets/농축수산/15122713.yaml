description_portal: '농림수산식품교육문화정보원 농업온 시스템의 팝업정보에 대한 데이터입니다. 이 데이터는 팝업순번, 첨부파일, 등록일시, 수정일시, 팝업상단좌표, 팝업왼쪽좌표, 팝업넓이, 팝업높이와 같은 다양한 항목을 포함하고 있습니다. 농업온 시스템은 농업 관련 정보와 교육을 제공하는 플랫폼으로, 사용자가 보다 효과적으로 정보를 활용할 수 있도록 돕고 있습니다. 팝업 정보는 사용자에게 중요한 알림이나 교육 자료, 행사 정보 등을 전달하는 역할을 하기 때문에 매우 유용합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 팝업순번(숫자형) : 각 팝업의 고유 번호, 첨부파일(문자형) : 관련 파일의 식별자, 등록일시(문자형) : 팝업이 등록된 날짜와 시간, 수정일시(문자형) : 팝업 정보가 수정된 날짜와 시간, 팝업상단좌표(숫자형) : 화면에서의 팝업 상단 위치, 팝업왼쪽좌표(숫자형) : 화면에서의 팝업 왼쪽 위치, 팝업넓이(숫자형) : 팝업의 넓이, 팝업높이(숫자형) : 팝업의 높이를 나타냅니다. 이 데이터를 활용하여 농업 관련 정보를 효율적으로 관리하고 사용자에게 적절한 정보를 제공할 수 있습니다.'
