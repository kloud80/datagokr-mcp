description_portal: '- 국가 농식품 통계서비스 자료로 작성한 전라남도 22개 시군 특용(약용)작물에 대한 데이터를 제공합니다. - 작물분류, 작물명, 전체면적, 수확면적, 생산량, 농가수 등을 조회하실 수 있습니다.- 전라남도는 다양한 특용작물의 주요 생산지로서, 지역 농업의 다변화와 부가가치 창출에 중요한 역할을 하고 있습니다. 특용작물은 식용, 약용, 산업용 등으로 활용되며, 지역 경제와 농가 소득 증대에 기여하고 있습니다.- 산업 동향 : 특용작물의 수요 증가와 함께 생산량도 꾸준히 증가하고 있으며, 특히 건강식품으로의 활용이 확대되고 있습니다.- 지원 정책 : 1) 재배 기술 지원 : 전문가를 통한 재배 기술 교육 및 컨설팅 제공 2) 시설 현대화 지원 : 재배 환경 개선을 위한 시설 현대화 지원 3) 브랜드화 및 마케팅 지원 : 특용작물의 브랜드화 및 판로 확대를 위한 마케팅 지원'
