summary_user: 산림청 합법목재 교역촉진제도에 따라 검사를 마치고 통관된 수입 목재·목재제품을 건별로 기록한 전국 단위 파일(csv)로, 제품명·수종명·HS 10단위 부호·포장수량과 단위·원산지 국가를 담는다. 목재 수입업자나 유통·정책 분석가가 어떤 수종·제품이 어느 나라에서 얼마나 들어오는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, HS 10단위 부호(HS10단위부호)나 원산지 국가명을 이름·코드 매핑해 관세청 품목별 수출입 통계 등과 맞춰 볼 수 있다.
description_portal: 산림청이 운영하는 합법목재 교역촉진제도에 따라, 수입된 목재 및 목재제품이 관련 법령에 따라 검사를 완료하고 통관된 이력을 기록한 공식 데이터입니다. 이 제도는 불법벌채로 생산된 목재의 국내 유통을 차단하고, 지속가능한 산림자원 이용과 국제 기준에 부합하는 목재 유통질서 확립을 목표로 시행되고 있습니다. 본 데이터에는 수입 목재(제품)의 품목명, 원산지, 수입 수량 및 단위, 통관일자, 검사기관, 검사결과 등의 세부 정보가 포함되어 있어, 합법 여부를 객관적으로 확인할 수 있는 인증 기반 자료로 활용됩니다.
