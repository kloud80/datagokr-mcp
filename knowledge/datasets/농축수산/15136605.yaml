summary_user: 농식품 공공데이터 포털에 등록된 기관의 기본 정보를 기관 한 곳당 한 행으로 담은 전국 단위 목록으로, 기관명·기관 코드·기관 유형 코드·업종 코드가 들어 있다. 분석가나 데이터 관리자가 '농식품 분야 공공데이터를 어느 기관이 만들고 관리하는지, 그 기관은 어떤 유형·업종인지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 기관명 매핑이나 같은 포털 안의 기관 코드로만 잇는다.
description_portal: 본 데이터는 농림축산식품부에서 제공하는 농식품 공공데이터 포털에 등록된 기관들의 기본 정보를 체계적으로 정리한 자료입니다. 각 기관에 부여된 고유 코드, 명칭, 유형 분류, 업종 코드 등의 항목을 포함하고 있으며, 농식품 분야에서 공공데이터를 생성하거나 관리하는 주체들의 행정적 속성과 구조적 관계를 파악하는 데 유용합니다. 특히 기관 간 역할 분담, 조직 구조, 업무 관할 구역 등을 비교·분석할 수 있는 기초 자료로 활용되며, 데이터 관리체계 고도화, 정책 수립, 행정 지원, 대국민 서비스 개선 등 다양한 목적에 활용될 수 있는 공공데이터 행정 인프라의 핵심 정보 자원입니다.
