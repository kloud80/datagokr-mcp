summary_user: 국립수산과학원 연안정지관측 정점별로 관측일자마다 수온·기온·운량·날씨 상태와 품질관리 표시를 담은 건별 관측 자료이며, 범위는 전국이고 행정구역 단위가 아닌 비공간 자료다. 연안 양식·어업 사업자나 해양 분석가가 특정 연안 정점의 날짜별 수온 변화를 확인하고 고수온·저수온 피해 시기를 따져 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 정점 코드(STA_CD)·정점명이나 해역 그룹명을 이름·코드로 맞춰 연결해야 한다.
