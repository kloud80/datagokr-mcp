description_portal: '풍황계측기는 풍력 발전 가능성을 평가하기 위해 바람(풍황: wind resource)을 장기간 정밀하게 측정·기록하는 장비와 시스템을 의미합니다. 풍력 발전단지 개발의 첫 단계에서 설치되며, 바람의 세기뿐 아니라 방향, 난류 정도 등 여러 요소를 측정하여 발전량을 예측하고 단지의 경제성을 판단하는 데 활용됩니다.풍황계측기 데이터는 특정 지점의 **풍황(風況, 바람의 상태)**을 측정하기 위해 설치된 계측 장비를 통해 수집된 기상 관측 데이터입니다. 풍력 발전 가능성 평가, 환경 영향 분석, 기상 연구, 시설 안전관리 등을 목적으로 합니다.의성군에서 신규신청 혹은 변경신청한 건에 대하여 신청자,허가기간,주소를 정리한 파일입니다.'
