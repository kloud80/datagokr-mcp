description_portal: "농림수산식품교육문화정보원에서 제공하는 영농가이드 영상정보는 농업온 시스템과 관련된 유용한 데이터를 포함하고 있습니다. 이 데이터는 영농에 관심 있는 농민, 교육자 및 연구자들에게 농업 기술 및 최신 정보를 제공하기 위한 목적으로 활용될 수 있습니다. 데이터는 번호, 영상제목, 삭제여부, 등록일시, 수정일시 등의 항목으로 구성되어 있으며, 각각의 항목은 영농 관련 영상의 식별, 내용 확인 및 관리에 필수적인 정보를 담고 있습니다. 이를 통해 사용자들은 다양한 영농 관련 정보를 손쉽게 접근할 수 있고, 관련 콘텐츠를 효율적으로 관리할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  - 번호(숫자형) : 각 영상의 고유 번호로, 순차적으로 할당됩니다.  - 영상제목(문자형) : 해당 영상의 제목으로, 영농과 관련된 주제를 설명합니다.  - 삭제여부(문자형) : 해당 영상이 삭제되었는지를 나타내는 정보로, 'Y'는 삭제됨을 의미합니다.  - 등록일시(날짜형) : 영상이 등록된 날짜 및 시간을 기록합니다.  - 수정일시(날짜형) : 영상 정보가 수정된 날짜 및 시간을 나타냅니다."
