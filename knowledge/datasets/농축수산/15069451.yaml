description_portal: 산림사업 수행 내역과 추진 현황을 체계적으로 관리하기 위한 데이터로, 산림청 산림항공본부의 최근 3년간 산림 헬기를 활용한 산림사업 실적 (산림사업 임무, 산림사업시작일자, 산림사업종료일자, 산림사업일수, 산림사업장소) 정보를 제공합니다. 제공 항목은 산림사업임무, 사업시작일자, 사업종료일자, 사업일수, 사업장소로 구성되어 있으며, 각 사업이 언제부터 언제까지 수행되었는지와 사업이 진행된 지역, 소요 기간 등을 확인할 수 있습니다. 이를 통해 산림사업의 추진 이력과 수행 현황을 관리하고, 기간별·장소별 사업 실적을 분석하는 데 활용할 수 있습니다.
