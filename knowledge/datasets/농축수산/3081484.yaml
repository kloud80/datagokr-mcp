description_portal: 본 데이터는 전북특별자치도 내에서 이루어진 축산물 이동판매 행사의 승인 내역을 담고 있는 자료입니다. 각 지역 축협 및 낙협 등 생산자 단체가 주관하여 특정 기간 동안 임시 판매 장소를 운영한 기록을 보여줍니다. 행사별로 주관 조합, 행사 기간과 장소, 그리고 사용된 판매 차량 번호까지 상세히 명시되어 있습니다. 이 자료는 지역 축산물의 소비 촉진을 위한 직거래 유통 활동의 현황을 파악하는 데 유용합니다. 로컬푸드 활성화 정책을 분석하거나, 지역 생산물의 판로 개척 노력을 이해하기 위한 기초 데이터로 활용될 수 있습니다.
