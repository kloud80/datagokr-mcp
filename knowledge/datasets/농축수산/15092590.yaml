description_portal: 가축전염병 발생현황 공공데이터는 국내외에서 발생한 주요 가축 전염병에 대한 핵심 정보를 제공합니다. 이 데이터에는 낭충봉아부패병, 브루셀라병, 아프리카돼지열병 등 법정 전염병의 발생 현황이 담겨 있습니다. 각 발생 건에 대해 해당 전염병의 명칭, 진단 일자, 영향을 받은 축종, 감염 규모, 그리고 진단 및 확인을 담당한 기관 등의 정보가 포함됩니다.    이러한 정보는 질병의 확산 경로를 분석하고, 신속한 방역 조치를 수립하며, 장기적인 질병 예방 및 관리 정책을 마련하는 데 필수적인 기초 자료로 활용됩니다. 또한, 축산물의 안전성을 확보하고 축산 농가의 경제적 피해를 최소화하는 데 크게 기여하며, 공중 보건 차원에서도 중요한 의미를 가집니다.※ 2025년 9월 2일 기준 2022년 9월 이후 영월군에서 발생한 법정가축전염병은 없습니다.
