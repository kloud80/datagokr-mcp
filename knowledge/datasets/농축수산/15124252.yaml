description_portal: 가락시장은 전국 주요 산지에서 출하되는 농산물을 집하·분산·가격 형성하는 대표적인 공영 도매시장이며,본 데이터는 가락시장에서 반입된 고구마 품목 전체의 거래제도별 반입물량을 수집·정제·가공하여 구축한 자료입니다.고구마는 저장성이 높아 장기 유통이 가능하지만, 출하 시기·기상 조건·작황 등에 따라 생산량 변동과 가격 변동폭이 큰 품목으로,유통시장에서의 공급과잉·공급부족을 예방하고 가격 안정을 도모하기 위해서는 거래제도별 반입물량 흐름을 주기적으로 모니터링하는 것이 중요합니다.이에 따라 본 데이터는 가락시장에서 운영되는 경매(상장거래)와 정가·수의거래(비상장거래) 등 다양한 거래제도별로 반입된 고구마 전 품목의 반입물량 정보를 일정 주기마다 집계하여 구축하였으며,일자, 거래구분(상장·비상장 등), 품목명(고구마 세부 품목명), 반입물량(t) 등의 항목으로 구성되어 있습니다.거래제도별 물량 흐름을 일자 단위로 제공하기 때문에, 시기별 반입량 변화와 제도별 유통 구조 차이를 비교·분석할 수 있습니다.이 데이터를 활용하면거래제도별 반입물량 비중 및 추이 분석을 통해 상장·비상장 거래의 구조적 특징과 시장 점유 비율 파악월별·계절별 반입물량 변동 패턴 분석을 통한 계절적 수급 불균형 예측 및 대응전략 수립반입물량 급증·급감 시점과 도매가격 변동 간 상관관계 분석고구마 품목별·산지별 출하 집중도 및 공급 안정성 평가거래제도별 물류 효율성·유통비용 구조 분석 및 개선 방안 도출반입물량 기반의 수급 예측 모델 구축 및 가격안정 정책 설계등 다각적인 분석이 가능합니다.또한 농업·경제·통계 분야 연구기관은 본 데이터를 활용하여고구마 품목의 계절별 수급 구조 분석, 거래제도별 물류 효율성 비교, 반입물량 예측모델 개발, 가격 변동 요인 연구 등에 활용할 수 있고,농업 유통 관련 공공기관과 지자체는산지별 출하계획 수립, 비상장거래 물량관리, 유통비용 절감 방안 마련, 품질관리 체계 개선, 가격 안정화 대책 수립 등 정책적 활용이 가능합
