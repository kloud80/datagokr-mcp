status: active
summary_user: 국내에 서식하는 버섯의 학명과 추천 국명(버섯명)을 버섯 학명 한 건 단위로 담은 국가표준 명칭 목록으로, 문·강·목·과·속의 분류 정보와 정명/이명 구분, 최종수정일을 함께 제공한다. 연구자·교육자·출판 편집자가 "이 버섯의 공식 국명과 정확한 학명은 무엇이며, 이 학명이 정명인지 이명인지"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 학명·국명 같은 이름 매칭으로만 잇는다. 이 서비스 안에서는 목록 조회로 얻은 버섯 학명ID(fngsScnmId)를 상세 조회에 넘기는 방식으로 연결한다.
limits: 상세 조회는 필수 파라미터인 학명ID를 목록 조회에서 먼저 받아 넘겨야 하며, 상세 오퍼레이션(/scnmInfo2)은 최소 파라미터로 호출했을 때 응답이 없었다. 지역 구분이 없는 전국 단위의 비공간 명칭 목록이어서 서식지나 분포 위치는 알 수 없다. 개발계정 호출 한도는 하루 1,000회다.
