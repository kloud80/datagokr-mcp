description_portal: '"제주특별자치도 내 토석채취허가현황 데이터를 제공합니다.항목: 행정시, 소재지, 주 허가자, 허가사항면적, 허가량, 용도, 허가시작기간 등* 제주특별자치도 내의 토석(흙/모래/자갈 등) 채취 허가 현황을 정리한 자료입니다. 허가된 채취의 소재지, 허가자, 허가 면적과 허가량, 허가 기간, 용도와 연락처 등의 속성이 포함되어 있어, 토석 채취 활동의 규모와 위치, 허가 기간 등의 행정 관리 차원의 파악이 가능합니다. 허가 면적 및 허가량 정보는 허가의 크기 및 영향 범위를 가늠하게 하며, 허가 기간 정보는 활동 지속성 파악에 유용합니다.* 활용 분야 : 환경 영향 평가, 지속 가능한 자원 관리, 공간 분석 및 시각화 등"'
