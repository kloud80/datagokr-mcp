description_portal: 축산물품질평가원이 제공하고 있는 소 작업장별 등급판정 통계정보입니다.   전 지역의 도축장별로 도축두수와 등급판정결과별 도축두수 정보를 제공하고 있습니다.  지역별로 운영되고 있는 도축장 및 작업장 142개소를 포함하여 등급판정결과 (1++A에서 등외) 정보를 월별로 조회할 수 있습니다. 등급별 출현율을 유추할수 있고 지역별도 도축두수를 제공하고 있어 소의 등급변화와 도축변화 추이를 알 수 있습니다. 지역별로 제공하고 있어 축산업계나 물류 계획을 수립할수 있는 참고자료로 할용 될 수 있습니다. 도축물량을 통계정보로 활용하여 축산물 수급정보 예측에 도움이 됩니다.
