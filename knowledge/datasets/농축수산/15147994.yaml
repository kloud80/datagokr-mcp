description_portal: 이 데이터는 해양수산부에서 해양과학조사자료다각형에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 해양과학조사년도, 해양과학조사업체, 해양과학조사기관명, 해양과학조사사업명, 공간정보 등의 데이터로 구성되어 있습니다.본 데이터는 해양과학조사자료다각형 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양과학조사자료란 해양과학조사자료는 해양의 자연현상을 연구하고 밝히기 위한 과학적 조사 및 탐사를 통해 얻어진 기초자료 및 시료를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
