summary_user: 「수난구호법」 시행규칙에 따라 설정된 전국 수난구호 관할해역을 SHP 공간정보 파일(zip, 약 29KB)로 담으며, 해역별 관할 해양경찰서명·해역명·정의·관계법령·제/개정일 정보가 들어 있다. 해운업계나 해양안전 분석가가 "이 해상 사고 지점은 어느 해양경찰서 관할 구역인가"를 판별하거나 구호자원 배치를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 해양경찰서명·해역명 같은 이름 매핑이나 공간 중첩(좌표 기반)으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「수난구호법」 시행규칙 제2조에 따라 수상에서 조난된 사람, 선박 등의 수색, 구조 등 업무를 위해 설정된 수난구호 관할구역 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 수난구호 관할해역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해역별 관할 해양경찰서명, 해역명, 정의, 관계법령, 관계부서 및 제/개정일 등 정보를 포함하고 있습니다. 본 데이터는 해운 및 수상 운송 업계에서 조난사고 발생 시 신속하고 정확한 구호 활동 구역을 파악하는 데 활용될 수 있으며, 관할기관이 상황 발생지역을 분류하거나 구호자원의 배치계획을 수립할 때 참고자료로 사용될 수 있습니다. 또한 해상안전 정책의 수립이나 수난구호 분담체계 개선 연구에 필요한 기초자료로도 활용될 수 있습니다.
