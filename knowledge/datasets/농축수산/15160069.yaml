summary_user: 동해 배타적경제수역(EEZ)을 특성평가용 격자로 나눈 목록으로, 격자마다 공간정보일련번호·격자번호·격자아이디·레이어명·레이어분류설명을 담은 약 9KB 규모의 CSV 파일이다. 해상풍력 입지 검토나 해양공간계획 용도구역 설정처럼 동해 EEZ의 어느 격자가 어떤 평가 레이어에 속하는지 확인하려는 행정·정책 담당자와 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 격자번호·격자아이디나 레이어명을 같은 해양수산부 공동활용체계의 다른 격자·레이어 자료와 이름·코드로 맞춰 이어 쓴다.
