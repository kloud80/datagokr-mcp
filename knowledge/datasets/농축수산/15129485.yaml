summary_user: 농촌체험휴양마을 가운데 경관·서비스, 체험, 숙박, 음식 4개 평가 분야에서 모두 1등급을 받아 으뜸촌으로 지정된 마을을 한 행에 한 곳씩 담은 전국 목록으로, 지정연도·시도·시군구·마을명·상세주소가 들어 있다. 농촌 여행을 계획하는 국민이 '우리 지역 근처에서 체험·숙박·음식이 모두 검증된 체험마을은 어디인가'를 찾거나, 지자체·분석가가 지역별·연도별 으뜸촌 지정 현황을 비교하는 데 쓴다. 데이터 전체에 걸쳐 공통으로 쓰는 조인 키는 없으며, 시도·시군구 이름과 코드(SIGNGU_CODE 등)를 행정구역 코드표에 맞추거나 마을명·주소를 다른 농촌체험휴양마을 자료와 대조해 연결한다.
description_portal: 해당 데이터는 농촌체험휴양마을 중 경관 및 서비스, 체험, 숙박, 음식 등 총 4개 평가 분야에서 모두 1등급을 획득한 마을을 대상으로 부여한 으뜸촌 현황을 제공하는 자료입니다. 이를 통해 농촌관광을 계획하는 국민들에게는 신뢰성 있는 여행지 선택의 기준을 제공합니다. 또한 정부와 지자체는 해당 데이터를 활용하여 우수 마을의 운영 사례를 확산시키고, 다른 마을의 서비스 개선과 경쟁력 강화를 위한 정책적 지원 근거로 삼을 수 있습니다. 나아가 으뜸촌 지정 현황은 농촌체험휴양마을의 질적 성장을 유도하고, 농촌 경제 활성화 및 농업·농촌 가치 확산에 기여할 수 있는 중요한 기초 자료로서 의미를 가집니다.
