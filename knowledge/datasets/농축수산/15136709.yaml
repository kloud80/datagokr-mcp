summary_user: 농림축산식품부 농식품 공공데이터 포털에 등록된 시각화 데이터의 메타데이터를 시각화 한 건당 한 행으로 담는다(데이터 아이디·유형 아이디·엔티티 아이디·제목·설명). 분석가가 '농식품 포털에 어떤 시각화 자료가 있고 각각 무엇을 보여주는가'를 확인해 필요한 시각화나 원천 데이터를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·이름 매핑이나 같은 포털 안의 아이디로만 연결한다.
description_portal: 본 정보는 농림축산식품부의 농식품 공공데이터 포털에 등록된 시각화 데이터의 상세 정보를 제공합니다. 이 데이터는 데이터 아이디, 유형 아이디, 엔티티 아이디, 제목, 설명 등의 메타데이터를 포함하고 있으며, 공공데이터 포털에서 제공하는 다양한 시각화 데이터를 효과적으로 활용하기 위한 기초 자료로 활용될 수 있습니다. 제공되는 데이터는 농업·농촌 분야의 정책 수립 및 분석에 유용하며, 데이터 기반의 의사결정 및 연구에 활용될 수 있습니다. 단, 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 차이가 있을 수 있으므로 데이터 활용 시 참고하시기 바랍니다. 농림축산식품부는 본 정보를 통해 농식품 분야의 데이터 활용을 촉진하고, 정책의 투명성과 효율성을 제고하고자 합니다.
