description_portal: 어촌 지역의 생계 유지를 지원하고 전통 어업 방식의 보존 및 전승을 도모하기 위해 해양수산부 등에서 지정·관리하는 국가중요어업유산의 현황과 세부 정보를 제공하는 데이터입니다. 기후변화와 어촌 인구 감소로 사라져가는 전통 어업 기술과 문화적 가치를 체계적으로 기록하고, 이를 국민과 학계에 개방하여 어촌 지역의 활성화 및 유산 보존 정책 수립을 지원하고자 데이터를 수집 및 구축하였습니다.개방 데이터는 연번, 명칭, 지정일, 대상 지역, 면적(제곱미터), 특징, 데이터기준일자 등 총 7개 항목으로 구성되어 있으며, 제주 해녀어업, 보성 뻘배어업, 남해 죽방렴어업 등을 포함하여 총 16건의 유산 지정 현황 데이터가 포함되어 있습니다.본 데이터는 학계 및 연구기관에서 전통 수산업의 역사적·문화적 가치 연구와 기후변화에 따른 전통 어업의 적응 방식 분석 등에 활용할 수 있습니다. 또한 민간 기업이나 지자체는 이를 기반으로 어촌 체험 관광 프로그램 개발, 지역 특산물 브랜딩, 역사 문화 스토리텔링 콘텐츠 제작 등 어촌 경제 활성화와 관광 자원화 연구에 다각도로 활용할 수 있어 어촌 지역 활성화 및 지역 소멸 위기 대응에 기여할 수 있습니다.※ 제공되는 데이터는 데이터 기준일자 기준의 현황이며, 향후 신규 지정이나 변동 사항이 발생할 경우 주기적으로 업데이트되어 제공될 예정입니다.
