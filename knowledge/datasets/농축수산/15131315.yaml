description_portal: '- 전라남도 천일염 홈페이지에 게재된 연도별 소금박람회(시간, 장소, 참가규모, 주요행사)에 대한 정보를 조회하실 수 있습니다.- 전라남도는 매년 다양한 지역 특산물과 문화를 소개하는 박람회를 개최하고 있습니다. 특히, 소금박람회는 전라남도의 대표적인 행사 중 하나로, 지역 주민과 관광객들에게 큰 관심을 받고 있습니다.- 소금 생산 과정 체험 : 소금이 어떻게 생산되는지 직접 보고 체험할 수 있는 프로그램이 마련됩니다.- 소금 관련 제품 전시 및 판매 : 지역에서 생산된 다양한 소금 제품을 전시하고 판매하는 부스가 운영됩니다.- 문화 공연 및 체험 활동 : 전라남도의 전통 문화와 예술을 체험할 수 있는 다양한 프로그램이 진행됩니다.- 학술 세미나 및 컨퍼런스 : 소금 산업의 발전 방향과 지역 경제에 미치는 영향 등을 논의하는 학술 세미나가 개최됩니다.'
