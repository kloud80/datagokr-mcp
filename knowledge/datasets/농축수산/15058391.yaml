summary_user: 경기도 내 도축업 사업장을 한 곳당 한 행으로 담은 인허가 원천 목록으로, 사업장명·인허가일·영업상태·폐업일·소재지 면적·지번/도로명 주소·우편번호·위경도 좌표를 담는다. 축산물 위생·안전 점검 담당자나 분석가가 '경기도 어느 시군에 현재 영업 중인 도축장이 몇 곳 있고 어디에 있나'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서 같은 기관 데이터와는 시군 코드(SIGUN_CD)로, 다른 데이터와는 사업장명·주소 매칭으로 잇는다.
description_portal: 이 데이터는 경기도 내에서 운영되는 도축업체들의 현황을 종합적으로 보여주는 자료로, 각 사업장의 인허가 기록, 영업 상태, 위치 정보 등이 체계적으로 정리되어 있습니다. 도로명주소와 지번주소, 우편번호, 위경도 좌표와 같은 공간 정보가 포함되어 있어 지역별 분포와 접근성을 분석할 수 있으며, 사업장별 영업 중 여부나 휴업 여부 등 운영 상태를 통해 축산업 인프라의 활성화 정도를 확인할 수 있습니다. 또한 종업원 규모나 시설 관련 정보는 도축업체의 운영 특성과 지역별 산업 구조를 이해하는 데 기초 자료가 됩니다. 이 데이터는 축산물 위생 관리, 도축업체의 안전 점검, 지역 간 도축업 인프라 비교, 축산업 관련 정책 수립 등 공공행정과 연구에 활용할 수 있으며, 나아가 식품안전 및 공급망 관리 차원에서도 중요한 의미를 가집니다.
