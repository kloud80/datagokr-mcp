description_portal: 본 데이터는 전북특별자치도 부안군 관내 가축분뇨를 자원화하여 비료로 생산·유통하는 업체의 현황을 수록한 자료이다. 해당 데이터에는 각 업체의 명칭, 소재지,  생산 가능한 비료의 종류 등의 항목이 포함되어 있다. 가축분뇨 처리와 관련된 친환경 정책 추진 및 지역 내 자원순환 실태 파악을 위한 기초자료로 활용할 수 있다. 또한 농업용 비료 수요 예측, 폐기물 관리 정책 수립, 축산농가의 분뇨처리 의무이행 점검 등 다양한 행정 및 연구 목적에 활용 가능하다. 정기적으로 현행화하여 관련 산업의 변화 흐름과 법령 이행 상태를 반영하고 있으며, 지역 내 자원화 업체의 현황 파악과 행정 지원을 위한 기반자료로서 의미를 지닌다.
