summary_user: 오이 스마트팜(시설원예) 농가별로 수집일 단위의 내·외부 기상(온도·습도·일사량·풍속·강우), 내부 CO2, 토양·양액 상태(EC·pH·지온·지습·급배액), 난방기·환기팬·커튼 등 설비 작동 상태를 담은 건별 환경 데이터이며 범위는 전국이다. 농업 연구자나 스마트팜 기업이 '오이 시설하우스의 내부 온습도와 양액 EC를 어떻게 관리할 때 생육이 좋았는가' 같은 재배환경 분석이나 AI 학습용 데이터 구축에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시설 식별자(시설ID)나 시도·시군구 이름, 품목명 매핑으로만 같은 기관의 다른 작물 스마트팜 데이터나 생육 데이터와 연결한다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 이 데이터셋은 오이 작물에 대한 스마트팜(시설원예) 및 정보통신기술(ICT) 관련 데이터로, 원활한 데이터 통합 관리와 분석을 목적으로 수집된 중요한 정보입니다. 특히, 이 데이터는 온도, 습도, 일사량, 풍량, 풍속, 토양정보 등 다양한 환경 정보와 생육정보인 초장, 마디수, 엽장, 엽폭, 엽수, 줄기직경, 암꽃수 등과 관련된 융복합 작기 데이터로 이루어져 있습니다. 이 데이터는 작물의 성장 과정을 보다 효율적으로 분석할 수 있도록 지원하며, 데이터 간의 상관관계를 분석하여 농업 분야에 인공지능(AI)을 활용한 스마트한 데이터를 구축하는 데 필수적입니다. 또한, 이 데이터는 농업 연구자, 생산자 및 관련 기업이 스마트팜 기술을 활용하고 보다 과학적인 농작물 관리 및 생산성을 높이는 데 활용할 수 있습니다. 이와 같은 정보를 통해 농업 환경 개선과 생산성 제고를 도모할 수 있습니다.
