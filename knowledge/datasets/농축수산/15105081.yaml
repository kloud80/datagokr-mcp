summary_user: 한국마사회 동물병원에서 진료한 말의 진료 건별 기록으로, 마번·마명, 진료일(명세상 '접종일'), 질병명 두 개, 진료병원, 진료장소를 담고 범위는 전국·비공간이다. 마주·조교사나 경마 분석가가 특정 경주마가 언제 어떤 질병으로 어느 병원에서 진료받았는지 확인할 때 쓰며, 마명·마번과 진료일자 기간으로 조회한다. 실측 컬럼에 전역 조인 키는 없어서, 같은 기관의 다른 경주마 데이터와는 마번(hrno)이나 마명으로만 맞춰 잇는다.
description_portal: 한국마사회의 동물병원에서 진료한 말에 대해 진료병원 및 질병에 대한 정보를 제공합니다. (제공정보는 마번(hrno), 마명(hrNm), 접종일(treaDt), 질병명1(illName1), 질병명2(illName2), 진료병원(busnNm), 진료장소(treaPlceNm) 자료입니다.) - 요청메세지에 마명(hrname), 마번(hrno), 진료일자 검색시작일(trea_dt_fr), 진료일자 검색종료일(trea_dt_to), 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다.
