summary_user: 한국마사회가 관리하는 말에게 접종한 백신 기록을 말 한 마리·접종 한 건 단위로 담으며, 마번·마명·접종일자·백신명(국문·영문)·유효기간 연도·접종병원이 들어 있다. 마주·조교사·경마 분석가가 특정 경주마의 백신 접종 이력과 유효기간이 지났는지를 확인할 때 쓴다. 전역 조인 키는 없으므로 같은 기관의 경주마 정보 데이터와 마번(hrno)이나 마명으로 맞춰 이어 쓴다.
description_portal: 한국마사회에서 말에게 접종한 백신종류 및 유효기간, 접종병원등의 정보를 제공합니다.(제공정보는 마번(hrno), 마명(korHrnm), 접종일자(inocDt), 접종명(vaciNm), 영문접종명(vaciEngNm), 유효기간년도(expiryYear), 접종병원(clincNm) 자료입니다.) - 요청메세지에 마명(hrname), 마번(hrno), 접종일 검색시작일(inoc_dt_fr), 접종일 검색종료일(inoc_dt_to), 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다.
team:
