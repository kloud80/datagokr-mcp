description_portal: 경상북도 경상북도 농업환경변동데이터는 농업용수와 토양 환경의 변동 사항을 종합적으로 관리하기 위한 자료입니다. 하천수와 지하수는 측정 지점의 위치와 대상 하천명 관정 깊이 조사 연도와 월을 포함하고 토양 조사는 연도별로 표토와 심토를 구분하여 일련번호 주소 위도와 경도 조사 시기 토양통과 토양통 부호 논 토양 상태와 지역 정보를 함께 제공합니다. 이 자료는 농경지와 농업용수의 시공간별 특성을 파악하고 장기 변화 추세 분석을 통해 친환경 농업 정책 수립과 영농 환경 관리에 활용될 수 있도록 구성되었습니다.
