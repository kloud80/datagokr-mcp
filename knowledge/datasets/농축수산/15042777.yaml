description_portal: 이 자료는 충청남도 청양군에 소재한 축산농가 중 소를 사육하는 농가의 현황을 확인할 수 있도록 정리한 데이터입니다.지역 내 소 사육농가의 농장구분, 소재지, 한우·젖소·육우 사육 마릿수 등을 한눈에 볼 수 있도록 구성하였습니다.데이터 항목은 연번, 농장구분, 소재지, 한우 마리 수, 젖소 마리 수, 육우 마리 수, 데이터기준일 등으로 이루어져 있으며, 관내 소 사육농가의 규모와 분포를 파악하는 데 활용할 수 있습니다.축종별 사육 마릿수를 함께 제공함으로써 지역 축산 현황을 보다 구체적으로 확인할 수 있습니다.이 자료는 소 사육농가 현황 관리, 축산업 관련 자료 작성, 방역 및 지도·점검 업무, 현장 확인 등의 행정업무에 참고할 수 있습니다.아울러 농가별 사육 현황이 체계적으로 관리되면 지역 축산업 현황 파악과 행정업무의 효율성 향상에도 도움이 됩니다.이는 관내 소 사육농가의 규모와 분포를 파악하는 기초자료로서, 축산 현황 관리와 관련 행정업무의 효율적인 추진에 활용될 수 있습니다.
