description_portal: '고양시에 소재한 양식장(수산, 관상어)에 대한 현황자료이며, 폐업 또는 신규등록에 따라 자료 업데이트 예정입니다.양식업은 수산동식물을 인공적으로 기르는 산업으로, 바다,민물,육상 등 다양한 환경에서 이루어집니다.주요특징은 다음과 같습니다.주요유형1. 해수면 양식업 : 바다 수면에서 해조류, 패류, 어류 등을 양식하며 면허 또는 허가제로 운영됩니다.2. 내수면 양식업: 하천, 저수지 등 담수 환경에서 이루어지며, 면허,신고제로 구분됩니다.3. 육상해수양식업: 육상에 수조를 설치해 바닷물을 이용해 양식하는 방식으로 광어(넙치) 양식에 주로 활용됩니다.'
