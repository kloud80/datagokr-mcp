summary_user: 고양시에 있는 수산·관상어 양식장 현황을 양식장 한 곳당 한 행으로 담은 작은 파일(CSV 620바이트)로, 양어장명·어종·수면적·시설위치를 기록한다. 고양시에서 어떤 어종을 기르는 양식장이 어디에 얼마 규모로 있는지 확인하려는 주민·사업자나 지역 내수면 양식 현황을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 양어장명이나 시설위치 주소를 이름 매칭하는 방식으로만 이어 쓸 수 있다.
