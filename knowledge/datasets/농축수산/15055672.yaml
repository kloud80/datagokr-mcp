description_portal: 본 데이터는 전북특별자치도 내에 조성된 산촌생태마을의 현황을 보여주는 자료입니다. 각 시군별로 지정된 산촌생태마을의 명칭을 사업 시기별로 구분하여 목록 형태로 제공하고 있습니다. 이는 산림 자원을 기반으로 지역 공동체를 활성화하고, 도시민에게는 생태 체험 및 휴양 공간을 제공하기 위해 추진된 정책 사업의 결과를 보여줍니다. 이 자료는 농산촌 지역 개발 정책을 연구하거나, 특색 있는 생태 관광지 및 귀농귀촌 대상 지역을 탐색하는 데 유용한 기초 정보를 제공하고 농촌 및 산촌 정책제언에 근거자료로 활용할 수 있습니다.
