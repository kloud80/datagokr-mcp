summary_user: 백두대간 동물상·식물상 조사구간을 한 행씩 담은 전국 단위 원천 파일로, 6,520행에 조사구간 식별번호, 세부구간, 조사시기, 동물조사구간 GPS 좌표(위도·경도 최대 8쌍)가 있고 기간은 2011-05-27~2018-08-20이다. 보전 가치 평가나 환경영향평가를 준비하는 분석가가 특정 백두대간 구간이 언제 어떤 구간으로 조사됐는지 확인하는 데 쓴다. 공통 식별 키는 없고 위·경도 좌표(coord)가 조인 키라서, 좌표로 보호지역이나 산림 공간 자료와 겹쳐 보거나 같은 조사구간 식별번호를 가진 다른 조사 결과와 맞춰 볼 수 있다.
description_portal: 산림의 생물다양성을 조사하고, 백두대간의 동식물 조사를 위해 수행된 조사구간에 대한 공간적 위치, 범위, 지형·지질, 주요 서식지 특성 등 기본 정보를 제공합니다. 또한 각 조사구간별 세부구간정보와 정확한 조사시기, 조사 방법 및 조사 대상 분류군에 관한 개요를 함께 제시하여 자료의 활용성을 높였습니다. 이를 통해 향후 장기 모니터링, 보전 가치 평가, 보호지역 지정, 환경영향평가 및 관련 정책 수립 시 기초자료로 활용할 수 있으며, 연구자와 행정기관, 현장 조사자들이 동일한 기준과 체계 아래 조사 결과를 비교·분석할 수 있도록 지원합니다.
