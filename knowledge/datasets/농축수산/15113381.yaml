summary_user: 정선군 내 양식업·수산종자 생산업체를 업체(허가) 한 건씩 담은 소규모 파일(csv 약 2KB)로, 어업허가 구분·허가번호·어업방법·성명·주소·허가기간·등록일자를 담는다. 정선군에서 송어 등 내수면 양식장을 운영하는 업체가 어디에 있고 허가기간이 언제까지인지 확인하려는 사업자·분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소나 허가번호를 직접 맞춰 이어 쓴다.
description_portal: 양식업 및 수산종자 생산업체에 관한 자료로 업체명, 사업장주소, 전화번호, 대표품종, 주생산품종, 양식장종류, 양식방법, 시설면적 등을 제공합니다.현재 정선군의 양식업은 송어를 기반으로 하고 있으며 강원도 및 전국에서 상위권의 양싱업을 하고 있습니다. 현재 송어를 기반으로 한 양식업체 6개소 이며, 연어를 기반으로 현재 예전의 송어양식장을 인수하여 연어양식을 계획중인 없체가 있으며 양양에 병행하여 사업을 추진중에 있다. 또한 민물새우를  키우며 시작한 농업기술센터 자체에서 시작한 양식업이 2025년에 시작이 되었다.
legal_basis_portal: 양식업 및 수산종자 생산업체에 관한 자료로 업체명, 사업장주소, 전화번호, 대표품종, 주생산품종, 양식장종류, 양식방법, 시설면적 등을 제공합니다.
