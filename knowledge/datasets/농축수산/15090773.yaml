summary_user: 로봇 착유기가 자동으로 수집한 착유 기록을 농장·개체(젖소)·착유 회차 단위로 담은 건별 원천 데이터로, 착유량·착유 시작·종료 일시·전도도·체세포·유지방·유단백·온도 등을 포함하며 범위는 전국이다. 낙농가나 축산 분석가가 '개체별 착유량과 유성분이 산차나 반추시간에 따라 어떻게 달라지는가'처럼 개체 생산성과 건강 상태를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 농장아이디·축산업등록번호·축종코드 같은 이름·코드 매핑이나 같은 기관의 스마트축산 데이터와의 연결로만 이어 쓴다.
description_portal: '본 데이터셋은 스마트축산 낙농분야에 관련된 정보로, 특히 로봇 착유기에 의해 자동으로 수집된 다양한 착유 관련 데이터입니다. 수집되는 주요 항목으로는 착유일시, 전도도, 착유회차, 유지방, 유단백, 공기흐름 등이 포함되어 있습니다. 이러한 데이터는 낙농업체가 각 개체의 급이량과 착유량 간의 상관관계를 분석하고, 생산성과 효율성을 개선하는데 활용될 수 있습니다. 이는 의사결정과 비즈니스 전략 수립에 있어서 중요한 역할을 하게 됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 농장아이디(숫자형) : 각각의 농장을 구분하는 아이디, 개체번호(숫자형) : 착유되고 있는 개체의 고유번호, 축산업등록번호(문자형) : 축산업체의 등록번호, 축종코드(문자형) : 축종을 구분하는 코드, 제조사 아이디(문자형) : 착유기의 제조사에 대한 아이디, 장비코드(문자형) : 장비의 고유코드, 장비번호(문자형) : 장비의 번호, 측정일시(문자형) : 데이터가 수집된 일시, 착유량(숫자형) : 착유된 우유의 양, 착유시작일시(문자형) : 착유 작업이 시작된 일시, 착유종료일시(문자형) : 착유 작업이 종료된 일시, 착유시간(문자형) : 착유에 소요된 시간, 착유회차(숫자형) : 착유 작업의 회차, 전도도(숫자형) : 착유 과정에서 수집되는 전도도 값, 수집구분(문자형) : 데이터 수집의 구분, 수집일자(숫자형) : 데이터가 수집된 날짜, 수집건수(숫자형) : 수집한 데이터의 건수를 나타냅니다.'
