description_portal: '2016년부터 2022년까지 순창 추월산과 여분산에서 측정된 산악기상 정보를 담고 있다. 10m와 2m 높이에서의 연평균 기온, 연평균 최저 및 최고 기온, 누적 강수량, 월별 평균 강수량 등 다양한 기상 요소를 연도별로 제공한다. 주요 컬럼에는 년도, 지점번호, 산이름, 각종 기온 및 강수량 데이터가 포함된다. 이 자료는 산악 지역의 기후 변화 분석, 생태계 연구, 산림 관리, 기상 예측, 재해 예방 등 다양한 분야에서 활용될 수 있다. 정기적으로 갱신되어 최신 기상 동향을 반영한다.(데이터 제공 항목 : 10미터평균기온,10미터평균최저기온,10미터평균최대기온,2미터평균기온,2미터평균최소기온,2미터평균최대기온,누적강수량,1월~12월평균강수량)'
