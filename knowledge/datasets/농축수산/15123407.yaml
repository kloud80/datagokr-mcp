description_portal: 경상북도 문경시 산사태취약지역 지정 현황 공공데이터는 문경시 관내에서 산사태 발생 우려가 있어 관련 법령에 따라 산사태취약지역으로 지정된 지역의 현황을 정리한 자료입니다. 본 데이터는 산사태 예방 및 재해 대응 체계 구축, 산림 재해 관리 및 관련 정책 수립을 위한 기초자료로 활용되고 있습니다.본 데이터의 주요 칼럼은 조사지(시도, 시군구, 읍면동, 리), 지번, 위도(도·분·초), 경도(도·분·초), 소유별(사유림), 취약지역지정이유로 구성되어 있으며, 이를 통해 산사태취약지역의 행정구역별 위치와 정확한 지리적 좌표, 토지 소유 형태 및 취약지역 지정 사유를 종합적으로 확인하실 수 있습니다.해당 공공데이터는 문경시청 산림녹지과에서 관리하고 있으며, 산사태 예방사업 추진, 사전 점검 및 시민 안전 확보를 위한 행정 업무와 각종 분석 자료로 활용되고 있습니다.
