summary_user: 경기도농수산진흥원이 운영하는 도민텃밭의 조성·분양 현황을 운영연도·지역·운영기관별로 담은 현황 데이터로, 면적(단체분양·개인분양·기타 공간조성 면적의 합)과 단체 분양 수, 개인 분양 구획 수와 각 분양 면적을 기록한다. 도시농업에 참여하려는 도민이나 정책 분석가가 "우리 시군에는 도민텃밭이 몇 구획 분양되고 면적은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 지역명(region_nm)·운영기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '이 데이터는 경기도에서 운영하는 도민텃밭의 조성 및 분양 현황을 담고 있으며, 공공 유휴부지를 활용하여 주민에게 제공된 도시농업 공간의 활용 실태를 보여줍니다.이 텃밭 사업은 주민의 도시농업 참여 기회를 확대하고 공동체 회복, 식생활 개선, 여가 활용 등 다양한 사회적 가치를 창출하는 데 목적이 있습니다.* 분양 면적 단위(33.1㎡,16.5㎡)는 한 구획의 면적을 의미합니다.* 면적 값은 단체분양면적+개인분양면적+기타 공간조성 면적입니다.(기타 공간조성: 총 면적 50% 이내에 주차공간, 간이화장실, 농기계보관실, 사무실, 교육장, 휴게시설, 관수시설, 퇴비장, 물탱크(상수도 및 지하수 병행), 둠벙(물웅덩이), 빗물이용장치 등)'
