summary_user: 우리나라 9정맥(금남·금남호남·금북·낙남·낙동·한남금북·한남·한북·호남정맥) 종주길의 관심지점(POI)을 지점 1건 단위로 담으며, 각 지점에 위도·경도·해발고도와 장소 유형(등산로 입구·봉우리·샘터·화장실·쉼터·위험지역 등), 장소명, 설명을 붙여 전국 범위로 제공한다. 정맥 종주를 준비하는 등산객이나 등산앱 개발자가 '이 정맥 구간에서 샘터·화장실·위험지역이 어디에 있는가'를 지도에 표시하고 경로를 분석하는 데 쓴다. 실측 컬럼에 다른 데이터와 공유하는 전역 조인 키는 없어 정맥명(frtrlNm)·장소명 같은 이름 매칭이나 위경도 좌표 기반 공간 결합으로만 등산로·산 정보 데이터와 이어 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2023년 11월 24일에 등록하여 제공하는 오픈API 서비스로 우리나라 9정맥 종주길의 관심지점(POI, Point of Interest) 정보를 실시간으로 조회할 수 있습니다. API를 통해 관심지점식별자, 정맥식별자, 정맥명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 데이터추출일시 등의 주요 속성을 호출할 수 있으며  트레킹 코스 시각화, 지도 기반 경로분석, 모바일 등산앱 연동, GIS 분석 등 다양한 활용 목적에 적합합니다.총 9개의 정맥(금남정맥, 금남호남정맥, 금북정맥, 낙남정맥, 낙동정맥, 한남금북정맥, 한남정맥, 한북정맥, 호남정맥)의 주요 POI(시작점, 종료점, 주요 경유지 등) 정보를 포함하고 있습니다.
