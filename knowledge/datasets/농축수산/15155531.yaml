summary_user: 국립해양조사원 해수유동관측소에서 실측한 표층 유향·유속을 관측소·관측일시별로 담는 API로, 관측소 위치(경도·위도)가 함께 오며 전국 범위 467건이 수신됐다. 연안·항만 조류 흐름을 확인하려는 해양 안전 담당자나 조석·해양환경 분석가가 특정 관측소의 시점별 유향·유속을 알아볼 때 쓴다. 위도(lat) 좌표를 조인 키로 삼아 다른 좌표 기반 해양 관측 자료와 이어 쓰며, 관측소코드는 바다누리(KHOA) 자체 키로 같은 기관 자료와 맞출 때 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 해수유동관측소를 통해 관측된 최신 해양 관측 데이터를 제공하기 위해 수집한 데이터 입니다. 관측소 코드, 관측일시를 파라미터로 데이터를 조회할 수 있으며,  본 데이터의 주요 내용은 관측소명, 관측소 경도/위도 위치정보, 관측일시 및 표층유향과 유속의 해양 관측 데이터로 구성되어 있습니다.  본 데이터를 활용하여 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양 환경 연구 등에 활용될 수 있습니다.
