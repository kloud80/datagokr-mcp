summary_user: 국립농산물품질관리원이 관리하는 유기농업자재 공시 현황을 공시된 자재 한 건씩 담은 전국 단위 목록으로, 공시번호·상표명(자재명)·자재구분·사업자·공시기관·사업장 연락처·제조장 주소로 구성된다. 유기농 실천 농가나 자재 유통업자가 '이 비료·자재가 유기농업에 쓸 수 있도록 공시된 제품인지, 누가 어디서 만드는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업자명·상표명 같은 이름 매핑이나 같은 기관 자료로만 연결한다.
description_portal: 유기농업자재는 유기농산물을 생산, 제조·가공 또는 취급하는 과정에서 사용할 수 있는 허용물질을 원료 또는 재료로 하여 만든 제품을 말하며 유기농업자재 공시제도는 허용물질을 사용하여 생산된 자재인지를 확인하여 그 자재의 명칭, 주성분명, 함량 및 사용방법 등에 관한 정보를 공시하는 제도이며 환경보전, 건강한 농산물 생산, 유기농업 실천농가에게 자재선택의 편의 제공을 목적으로 도입되었습니다. 본 정보는 국립농산물품질관리원에서 관리하는 유기농업자재 현황으로, 공시번호, 상표명(자재명), 자재구분, 사업자, 공시기관, 연락처(사업장), 제조장주소 항목으로 구성된 데이터입니다.
