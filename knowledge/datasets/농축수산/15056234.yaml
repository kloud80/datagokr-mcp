description_portal: '2016년 ~ 2025년 광주광역시 돼지열병 검사현황데 대한 데이터로,  항원검사, 항체검사 건수 등의 항목을 제공합니다. 돼지열병이란? (제1종 가축전염병)    - 원 인 체: Pestivirus (RNA virus)     ※ 아프리카돼지열병 바이러스는 DNA이며 Asfaviridae과   - 증상 및 예방: 고열, 식욕결핍 후 치사율 높음, 예방접종 대상 질병   - 전파경로: 돼지의 분변, 오줌, 눈물, 콧물에 의한 접촉, 경구감염   - 예방․치료: 치료제는 없으며 전국 모든 돼지 예방접종 중  돼지열병 검사요령  - 검사시료: 농장방문 직접 채취, 가축위생방역본부 검사의뢰 등  조치사항  - 돼지열병 백신접종여부 항체검사 기준: 항체양성율 80% 이상  - 혈청검사 결과 백신접종․질병감염 여부 및 면역항체가 수준 등을 분석, 해당농가에 통보하여 농가의 자율방역에 활용    ․ 농  가: 확인검사 없이 과태료 부과(구청)      → 과태료: 1회 위반 200만원, 2회 위반 400만원, 3회 위반 1,000만원    ․ 도축장: 기준미달 농가에 대해 10일 이내에 확인검사(재검사) 13두 실시      → 확인검사(재검사)에서도 기준 미달시 과태료 부과(구청)'
