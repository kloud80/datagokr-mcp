summary_user: 대한민국의 주권·권리가 미치거나 국제법상 개발·이용·보전에 참여할 수 있는 해역, 곧 해양공간의 범위를 공간정보일련번호·격자번호·공간정보(도형)로 담은 전국 단위 공간 파일이다(CSV 약 1.26MB). 해상풍력 같은 해양 개발 사업자나 정책 분석가가 "검토 중인 해역이 우리나라 해양공간 범위 안에 드는가"를 확인할 때 해양공간계획 용도구역 판단의 기초 자료로 쓴다. 전역 조인 키는 없어서 다른 데이터와는 격자번호나 도형을 공간 중첩해 잇거나, 같은 해양수산부 공동활용체계 해양공간 데이터의 코드로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 해양공간의범위에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 격자번호, 공간정보 데이터로 구성되어 있습니다.본 데이터는 해양공간의범위 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양공간의범위란 대한민국의 주권이나 권리가 미치거나, 국제법에 따라 개발·이용·보전에 참여할 수 있는 모든 해역을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
