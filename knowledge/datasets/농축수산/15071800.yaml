description_portal: '- 농식품거래소에서 낙찰받은 건에 대한 계약 형태와 구매사에 대한 정보 제공 - 입찰공고 번호 및 개찰일시 정보 포함 - 학교에서 공급 받는 급식 식자재 공급업체 및 지역별 학교의 낙찰 정보를 제공하여, 학부모에게 학생들이 먹고 있는 식사의 식자재 제공 업체의 정보를 투명하게 제공- 2018년부터 수집된 농식품거래소에서 낙찰 받은 건에 대한 계약형태와 구매사에 대한 정보를 연도별로 제공*농식품거래소: 농수산물 기업간 거래시스템, 단체급식 전달 조달 시스템, 소상공인 직거래 시스템 사업을 통하여 생산자 및 소비자의 이익 증진에 기여하는 플랫폼- 데이터 활용 예시: 입찰 상태 분류, 학교급식 구매사 종류, 월별 개찰 횟수 등- 활용 가능 분야: 낙찰 비교, 구매사 추이 분석, 계약 방법 구분 등'
