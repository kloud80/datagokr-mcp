summary_user: 한국농수산식품유통공사 농집(수출농가 통합지원플랫폼)에 등록된 수출전문농가단지의 농가별 목록으로, 단지명·대표자명·우편번호·농가주소·사업자등록번호·지정년도를 전국 범위에서 건별로 담는다(CSV 약 29KB). 수출 농산물 거래처를 찾는 수출업체나 지역별 수출전문단지 분포를 보려는 분석가가 '우리 지역에 언제 지정된 수출전문농가단지가 어디에 있나'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 상태 조회나 다른 사업자 기반 데이터와 잇고, 농가 주소는 주소 기반 행정구역·필지 정보와 맞춰 쓴다.
description_portal: '농집은 신선 수출농산물 생산,수출,안전,품질 모든 분야에 이르는 수출농가의 체계적 관리를 위한 통합지원플랫폼입니다.농산물 생산 농가 관리, 안정성 관리(농약 관련) 두 가지 업무를 관리하고 있습니다.해당 데이터는 그 중 농산물 생산 농가 관리와 관련된 데이터입니다.생산 단지, 단지 지정 년도, 농가 주소 등의 정보를 제공.*농집: 수출전문농가, 농산물전문생산단지, 수출업체들의 생산 기반 확보 및 수출 관리 체계 확보 지원데이터 설명- 데이터 컬럼 수: 7개- 데이터 컬럼 목록: 단지명, 대표자명, 우편번호, 농가주소, 농가상세주소, 사업자등록번호, 지정년도'
