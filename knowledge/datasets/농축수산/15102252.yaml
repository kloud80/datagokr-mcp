summary_user: 도시농업과 웰빙 관련 글을 메뉴명·제목·내용·등록일 단위로 담은 전국 범위의 비공간 콘텐츠 데이터로, 포털 설명상 식품별 칼로리, 요리법, 공기정화 식물, 베란다 재배 채소 같은 내용을 포함한다. 베란다에서 어떤 채소를 키울 수 있는지, 실내 공기정화에 좋은 식물은 무엇인지 찾는 도시민이나 도시농업 교육 자료를 준비하는 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목·식물 이름을 맞추는 매핑으로만 이어 쓸 수 있다.
description_portal: 농림수산식품교육문화정보원_웰빙도시농업 정보는 농업과 관련된 다양한 도시농업 정보 및 웰빙 정보를 체계적으로 제공합니다. 사용자는 이 정보를 통해 농업의 중요성을 인식하고, 도시 환경에서도 쉽게 농업을 실천할 수 있는 방법을 알게 됩니다. 본 데이터는 식품별 칼로리 정보, 다양한 요리법, 공기 정화에 효과적인 식물, 그리고 베란다에서 재배할 수 있는 채소 종류 등의 내용을 포함하고 있습니다. 이를 통해 도시민들은 건강하고 지속 가능한 생활을 실천할 수 있는 기회를 제공합니다. 해당 정보는 농업 관련 교육 프로그램, 건강식 생활을 원하는 소비자, 그리고 환경을 생각하는 도시민들이 유용하게 활용할 수 있습니다. 나아가, 도시농업 관련 연구 또는 정책 개발에 필요한 기초자료로도 쓰일 수 있어, 도시농업의 활성화에 기여할 것입니다.
