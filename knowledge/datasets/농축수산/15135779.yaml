description_portal: 해양수산과학기술진흥원이 제공하는 해양수산 연구개발(R&D) 연도별 주요 정보로, 해양수산 분야 국가연구개발사업의 연도별 추진 현황을 종합적으로 파악할 수 있도록 구성되어 있다. 사업연도별 사업 수, 총 과제 수, 정부출연금, 협약액 등 예산 현황과 함께, 민간부담금 및 현금·현물 구분 상세 내역, 참여기관 수, 참여인원 수 등 다양한 지표가 포함되어 있다. 이를 통해 해양수산 연구개발의 투자 규모와 재정 구조, 민간 참여 정도를 한눈에 확인할 수 있으며, 연도별 변화를 분석해 연구개발 정책 및 전략 수립의 근거 자료로 활용할 수 있다. 정책 입안자는 예산 및 투자 효율성을 평가할 수 있고, 연구기관은 자원 배분과 과제 기획에 활용할 수 있으며, 산업계는 협력 기회를 모색하는 데 도움이 된다. 본 데이터는 해양수산 R&D 사업의 성장 추세, 재정 기여 구조, 참여 생태계를 총체적으로 이해하는 데 필요한 핵심 자료이다.
