description_portal: 이 데이터는 어촌뉴딜 시범사업 및 어촌신활력증진사업 신청에 필요한 기본 정보, 제출서류 현황 등을 체계적으로 관리하여 사업 신청 절차의 표준화, 신청기관의 특성 분석, 사업계획 검토 및 행정처리의 효율성 제고를 위해 2022년부터 2025년까지 수집·구축된 정보입니다.어촌뉴딜 시범사업 신청서(TB_POST_REQST_INFO), 어촌신활력증진사업 신청서(TB_POST_REQST_INFO_2)를 포함합니다.이 데이터를 통해 신청서류의 충실도·적정성 평가, 지역별 사업신청 특성 파악, 심사·평가 절차 자동화, 사업계획서 기반의 사전 타당성 검토, 사업 대상지 우선순위 설정, 지역개발·해양수산사업 정책결정 지원, 제출서류 검증 및 행정 리스크 관리 등에 활용될 수 있습니다.파일내 항목별 코드는 코드북을 참고해 주시기 바랍니다.
