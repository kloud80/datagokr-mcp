summary_user: 바다내비(지능형 해상교통정보시스템)에 등록된 수치조류도를 검색시간·검색영역별로 담은 파일로, 영역 안 지점의 위경도와 그 지점의 유속(cm/s)·유향(도)을 건별로 기록한다. 해운·항만업계나 해양 연구자가 특정 해역·시각에 조류가 어느 방향으로 얼마나 빠르게 흐르는지 확인해 항로 계획이나 조류 변화 분석에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 해양 관측·예보 데이터와는 지점 위경도와 시간을 기준으로 공간·시간 매칭해 이어 쓴다.
description_portal: 이 데이터는 해양수산부 바다내비 시스템에 등록된 수치조류도 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 2021년부터 2026년까지 지능형 해상교통정보시스템(바다내비)에 등록된 수치조류도 데이터로 구성되어 있습니다. 해당 데이터는 검색시간, 검색영역, 영역의 유속, 유향 등 정보를 포함하고 있습니다.본 데이터는 해양 관련 연구기관에서 조류 변화를 분석하거나 해운·항만업계에서 항로 계획 및 선박 운항에 활용할 수 있으며, 해양 공간계획, 해양산업 활동의 지원, 관련 정책 수립의 근거자료로 사용될 수 있습니다.
