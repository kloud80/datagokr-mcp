summary_user: 산림청 국립산림품종관리센터가 접수한 특용작물·버섯류·산과수 등 산림 품종의 생산·수입·판매 신고를 신고 건별로 담은 전국 단위 파일(CSV)로, 신고필증번호·작물명·품종명칭·구분·접수일자가 들어 있다. 종묘업자·육종가·연구자가 "최근 어떤 버섯·산과수 품종이 수입·판매 신고되어 유통되는가"를 작물별·접수 시기별로 확인해 품종 유통·수입 동향을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작물명·품종명칭 같은 이름 매핑으로만 이어 쓴다.
