summary_user: 대구광역시 내 로컬푸드 직매장과 직거래장터를 매장 한 곳당 한 행으로 담은 목록 파일로, 매장명·대표자·소재지 주소·매장 규모(제곱미터)·운영주체를 담는다(포털 설명 기준 직매장 11개소, 992바이트 CSV). 대구에 사는 소비자가 집 근처 구·군에서 지역 농산물을 직접 살 수 있는 직매장이 어디에 있는지 찾거나, 분석가가 구·군별 로컬푸드 판로 분포와 운영주체를 비교할 때 쓴다. 전역 조인 키는 없어서 소재지 주소의 구·군 이름이나 매장명으로 다른 대구시 데이터와 맞춰 이어 써야 한다.
description_portal: '* 로컬푸드 : 장거리 수송 및 다단계 유통과정을 거치지 않은, 지역에서 생산된 농식품* 로컬푸드 가치  : 지속 가능한 먹거리 선순환 체계 구축   - 이동 거리가 짧아 소비자에게 신선한 먹거리 공급   - 경작 규모가 작은 중소농들에게 안정적인 판로를 제공하고 소득 증대 기여   - 부가가치가 지역 내에서 순환함으로 지역 경제 활성화    - 원거리 물류,농약 지양으로 생태 환경적 농업기반을 유지로 생태 환경 보전*  대구시 로컬푸드 직매장 11개소  현황(매장명, 위치, 규모, 운영주체 등) 데이터 제공    - 동구 3, 북구 2, 달서구 1, 수성구 1, 달성군 2, 군위군 2'
