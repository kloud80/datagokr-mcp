description_portal: 해양수산기술거래플랫폼_나눔기술" 데이터는 해양수산과학기술진흥원(KIMST)이 운영하는 플랫폼에서 제공하는 해양수산 분야 기술의 핵심 정보를 체계적으로 담고 있습니다. 이 데이터는 기술일련번호와 기술명을 기본으로, 기술의 성격을 파악할 수 있는 표준대/중분류 및 해양수산업대/중분류 코드를 포함합니다. 또한 기술의 핵심 내용을 요약하는 적용분야와 기술키워드를 제공하며, 현재의 사업화 상태를 나타내는 거래상태정보가 수록되어 있습니다. 기술 이전 및 활용에 필수적인 정보로 연구자와 연구기관, 그리고 기술료조건 및 기술완성도를 제공합니다. 특히 거래유형을 통상실시권 여부, 기술협력 여부, 기타로 구분하여 기술 거래 방식에 대한 구체적인 정보를 제공합니다. 이 데이터는 해양수산 분야의 기술 이전 및 사업화 촉진을 위한 중요한 자료로 활용됩니다.
