description_portal: 이 데이터는 해양수산부에서 어업경영체의 기타 양식생산 현황을 파악, 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 어업경영체등록번호, 지청코드, 일련번호, 수산물품목코드, 현재사육량 및 단위, 생산량 및 단위, 생산금액, 수탁여부, 과거어업경영체등록번호, 데이터 생성 및 변경 시점, 가공상태코드, 어업구분, 어업번호, 계통 및 비계통 판매비율, 비계통판매코드, 데이터 기준일자로 구성되어 있습니다.  본 데이터는 어업경영체의 기타양식생산 실적과 운영현황을 체계적으로 분석하고 관련 정책의 추진 근거자료로 활용할 수 있으며, 양식 생산 및 유통 현황을 파악하여 어업관리 방안 수립, 어업정책의 타당성 평가, 생산 및 유통 관련 통계분석에 활용될 수 있습니다.
