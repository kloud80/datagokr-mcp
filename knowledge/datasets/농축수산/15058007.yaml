summary_user: 수협 산지조합별 위판장 현황을 담은 데이터로, 위판장마다 조합명·위판장명과 코드, 어선수, 위탁판매인수, 판매금액을 전국 범위(비공간)로 제공한다. 수산물 유통업체가 어느 지역 어느 조합 위판장에서 거래처를 찾을지, 정책 담당자가 지역별 위판장 분포와 판매 규모가 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 수산물 유통 데이터와는 조합코드(mxtrCode)·위판장코드 같은 수협 내부 코드나 조합·위판장 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 수협 산지조합별 위판장 관련 정보를 제공하기 위해 수집한 데이터입니다.전체 데이터 또는 특정 조합, 위판장 명칭/코드 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 조합명, 위판장명, 어선수, 위탁판매인수 및 판매금액 등 정보로 구성되어 있습니다.본 데이터는 수산물 유통업체에서 위판장 정보를 기반으로 거래처를 선정하는 데 활용될 수 있으며, 관련 기관에서는 수산물 유통 구조와 지역별 위판장 분포 정보를 활용한 지원 정책 수립 등에 사용할 수 있습니다.
