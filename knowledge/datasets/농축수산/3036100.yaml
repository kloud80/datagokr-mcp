description_portal: '- 국가 농식품 통계서비스 조사 통계자료- 전라남도 22개 시군 화훼 주요 품목별 면적, 농가수, 판매액, 판매량 등의 정보를 제공합니다.- "화훼작물"은 꽃과 관상용 식물을 통틀어 일컫는 농업 용어입니다. 즉, 꽃을 재배하여 판매하거나 감상용으로 이용하는 식물들을 의미합니다.- 화훼작물의 활용 분야- 가정 및 실내 장식: 공기 정화, 인테리어- 행사용 꽃: 결혼식, 장례식, 기념일 등- 조경 및 도시녹화: 공원, 거리, 건물 외관 등- 수출산업: 고부가가치 작물로 수출되는 경우 많음 (예: 한국의 호접란)- 관련 산업- 원예 산업- 스마트팜 및 온실 재배- 생화 유통 및 플로리스트 산업- 조경 및 정원디자인'
