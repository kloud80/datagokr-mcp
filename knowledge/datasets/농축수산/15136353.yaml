description_portal: 이 데이터는 시도별 어업 현황을 집계하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 시도 행정동 코드, 통계 연도, 시도 행정동 명칭, 어업인 수, 어업 법인 수, 평균 연령, 평균 소득 금액, 해수면 면허 및 허가 건수, 해수면 신고 건수, 내수면 수, 염산업 수, 주요 어종 내역, 최초 생성 시점과 최종 변경 시점 등으로 구성되어 있습니다.   본 데이터는 시도 단위의 어업 활동 실태를 분석하거나 지역별 어업 구조와 수산업 환경을 세부적으로 비교하는데 사용할 수 있으며, 지방자치단체에서 어업 관련 정책 수립과 지원 대상을 선정할 때 기초 자료로 사용할 수 있습니다. 또한, 연구기관에서는 어업인의 연령, 소득, 법인 구조 등 통계 정보를 분석해 수산업의 사회경제적 특성을 파악하는 자료로 활용될 수 있습니다.
