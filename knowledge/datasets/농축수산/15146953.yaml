description_portal: 이 데이터는 충청남도 금산군 내 생산되는 과실의 생산량을 작성한 데이터로 기준연도(2019년부터 계속)별 품목별(사과, 배, 포도, 단감, 구찌뽕, 떪은감, 레드향, 망고, 매실, 복숭아, 블랙베리, 블루베리, 아로니아, 오디, 오미자, 자두, 포도), 읍면별 농가수와 재배면적, 과수면적, 미과수면적, 면적당 생산량(kg)을 제공합니다. 이를 통해 지역별 농업 생산 구조를 분석하고, 농업정책 수립, 유통 및 가격 안정 대책 마련, 학술연구 등 다양한 분야에서 활용할 수 있습니다. 또한 과수 재배 트렌드 변화, 기후변화에 따른 생산량 증감, 지역 특화작물 육성 등 농업 발전 방향을 설정하는 기초자료로 활용될 수 있습니다.
