summary_user: 전국 국립자연휴양림별 기본 정보(이름·기관코드·소개글·주소·조성연도·전화번호·최대수용인원·운영시간)를 휴양림 한 곳당 한 행으로 담은 약 10KB 규모의 CSV 파일이다. 여행객이나 분석가가 '우리 지역 근처 국립자연휴양림은 어디이고, 언제 조성됐으며, 최대 몇 명까지 받는가'를 확인하거나 휴양림 목록을 만들 때 쓴다. 전역 조인 키는 없으므로 다른 휴양림·숲길 데이터와는 휴양림 이름이나 같은 기관의 기관코드를 맞춰 이어 쓴다.
description_portal: 국립자연휴양림의 기본적인 정보를 제공합니다.세부적으로는 기관명, 기관코드, 기관설명, 기관주소, 기관조성년도, 기관전화번호, 최대수용인원, 운영시간 정보를 제공합니다.국립자연휴양림의 기본 설명과 내용을 제공하여 홍보를 도와주기 위한 자료입니다.전국 47개의 국립자연휴양림 기본 정보를 제공하기 위함입니다.동일한 운영시간과 휴양림별 초과인원이 불가능한 수용인원 기준을 가지고 있습니다.휴양림에 대한 기본 정보는 국민비서 구삐인 챗봇을 통해 안대 되고 있으니 참고 부탁드립니다.
