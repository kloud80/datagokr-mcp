summary_user: 식물검역 규제병해충 지정 현황을 병해충 한 종씩 담은 목록으로, 검역지위·구분·분류군·학명 등을 전국 단위(비공간)로 제공한다. 검역 담당자·연구기관·농업인이 '수입 농산물에서 발견된 이 해충이 국내 규제병해충으로 지정돼 있고 검역상 지위가 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학명이나 이름 매핑으로만 이어 쓴다.
description_portal: 식물검역 규제병해충 지정 현황으로 검역지위와 분류, 학명, 일반명 등에 대한 자료를 제공합니다.현재 규제병해충 지정현황은 2022건입니다.-  주요내용으로 규제병해충의 지정 현황, 학명,국명,분류체계,검역상 지위 등을 포함하고 있음-  외래병해충의 국내 유입을 차단하고 국내 농림작물의 피해를 예방하기 위한 검역 정책 수립 및 현장 대응 매뉴얼 작성의 참고자료로 활용될 수 있음 - 현재 지정된 검역병해충 현황을 포함하여 향후 발생 동향 분석 및 병해충 위험 평가에 활용 가능 - 관계기관,연구기관,농업인 등이 활용할 수 있는 정책,연구,실무 지원형 데이터로 활용 가능
