summary_user: 농수산물 온라인 도매시장의 경매·거래 결과를 확정일자와 상품 대·중·소분류별로 담고, 확정수량과 최소·최고·평균 가격을 제공하는 전국 단위 거래정보다. 식자재 구매자나 유통업자가 특정 품목이 온라인 도매시장에서 최근 얼마에, 얼마나 거래됐는지 확인하거나 시세 흐름을 볼 때 쓴다. 전역 조인 키는 없고 온라인 도매시장 자체 분류코드(소분류코드 등)만 있어서, KAMIS나 공영도매시장 경락가격과 비교하려면 품목명이나 코드를 직접 매핑해야 한다.
description_portal: '농수산물 온라인 도매시장에서 거래, 경매 정보로 확정일자, 확정수량 ,상품 대분류, 상품 중분류, 상품 소분류, 최소가, 최고가, 평균가 등을 제공합니다.★ API 명세서가 첨부되어있습니다. API 활용에 참고하실 수 있습니다.*온라인 도매시장: 전통적인 공영도매시장의 거래 방식을 디지털로 전환해, 비대면·실시간 거래가 가능하도록 만든 플랫폼코로나19 이후 농산물 유통환경의 디지털 전환 요구와 산지–도매시장 간 거래 효율화를 위해 구축* 주요 기능🔹 실시간 온라인 경매🔹 출하 반장 서비스- 농가 전용 서비스로, 온라인 도매시장 거래 절차를 간소화- 시세 확인 → 출하 예약 → 운송 신청 → 정산 관리까지 원스톱 서비스🔹 디지털 송품장(전자 전표)🔹 데이터 기반 지원* 일자관련 요청파라미터는 YYYY-MM-DD 형식으로 입력해야 정상적으로 처리됩니다.'
