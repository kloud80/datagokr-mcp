summary_user: 경상남도 각 시군구의 산지를 임업용산지·공익용산지(보전산지)와 준보전산지로 나눈 면적을 연도별로 집계한 파일로, 포털 설명상 2008년부터 2024년까지를 담는다. 지역 개발이나 토지 이용을 검토하는 분석가가 '경남 어느 시군에서 개발 규제가 약한 준보전산지 비중이 늘거나 줄었나'를 볼 때 쓴다. 전역 조인 키가 없어 기관명(시군구 이름)을 행정구역 코드로 매핑하거나 다른 시도의 같은 산림청 산지구분 통계와 이름 기준으로 이어 쓴다.
description_portal: 산지관리법 제4조(산지의 구분)에 따라 산지를 합리적으로 보전하고 이용하기 위하여 전국의 산지를 보전산지, 준보전 산지로 구분하며 보전산지는 산림자원의 조성과 임업경영기반의 구축 등 임업생산 기능의 증진을 위하여 필요한 산지로서 산림청장이 지정하는 산지관리법 제4조제1항제1호가목에 해당하는 임업용 산지와 임업생산과 함께 재해 방지, 수원 보호, 자연생태계 보전, 산지경관 보전, 국민보건휴양 증진 등의 공익 기능을 위하여 필요한 산지를 대상으로 산림청장이 지정하는 산지 산지관리법 제4조의1항1호나목에 해당하는 공익용 산지 및 보전산지 외의 준보전 산지가 있으며 해당 자료는 지역별 산지구분 통계중 2008년부터 2024년 경상남도 각 시군구에 대한 산지구분 데이터
