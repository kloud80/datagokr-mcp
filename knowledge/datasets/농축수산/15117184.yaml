summary_user: 한국농어촌공사가 관리하는 저수지 등 농업생산기반시설의 제원(시설명, 주·보조 수원공 구분, 유역면적·수혜면적(헥타르), 유효저수량(천㎥), 주소코드)을 시설별 한 행으로 담은 전국 단위 파일이다. 농업용수 분석가나 지자체 담당자가 특정 저수지의 유효저수량과 수혜면적을 확인하고, 현재저수량과 나눠 저수율을 산출하는 데 쓴다. 시설별 표준코드(dam_cd)로 저수율·저수량 등 같은 코드를 쓰는 공사 데이터와 잇고, 10자리 법정동코드인 주소코드로 행정구역 단위 데이터와 묶는다.
description_portal: '- 한국농어촌공사는 관리하고 있는 저수지에 대한 저수율(현재저수량/유효저수량)을 산출하기 위해 매년 유효저수량을 포함하여 저수지의 제원 값을 변경 및 확정하고 있습니다.- 본 데이터는 농업생산기반시설 통계연보와 차이가 있을 수 있으며, 조사시점 및 조사방법에 따른 차이임을 밝힙니다.- 컬럼 부가설명(1) 표준코드: 농업생산기반시설에 부여된 시설별 코드입니다.(2) 수원공타입: 주수원공은 "M", 보조수원공은 "S"로 표시됩니다.(3) 주소코드: 법정동코드(10자리)이며, 행정리까지 표현되는 데이터입니다.'
