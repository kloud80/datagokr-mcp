summary_user: KS인증·전통식품인증 등 우수식품 인증을 인증 건별로 담은 전국 단위 원천 목록으로, 인증구분·인증번호·인증기관·인증일자·인증 유효기간(시작·종료일)·인증업체·주소·제품명을 담는다. 소비자가 사려는 식품이 전통식품이나 KS 인증을 받았는지, 언제까지 유효한지 확인하거나, 분석가가 시도별·인증기관별 인증 현황을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·제품명 이름 매칭이나 주소에서 뽑은 시도명으로만 연결해야 하며, KAMIS 가격 데이터와 이으려면 품목명을 따로 매핑해야 한다.
description_portal: KS인증, 전통식품인증 등 우수식품 인증 정보로서, 인증구분, 인증번호, 인증기관, 인증일자, 인증시작일, 인증종료일, 인증업체, 주소, 제품명 항목으로 구성되어 있습니다. 인증구분별 우수식품 인증현황, 인증기관별 우수식품 인증현황, 시도별 우수식품 인증현황, 인증일자별 우수식품 인증현황 등 통계자료를 작성하여 우수식품 인증에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대되며, KS인증 및 전통식품 인증 등 우수식품 인증에 관심이 많은 사용자는 식료품 구입 등에 본 정보를 활용할 수 있을 것으로 기대됩니다.
