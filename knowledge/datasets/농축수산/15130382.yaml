description_portal: '- 전라남도 귀농종합정보센터 홈페이지의 추천작물(각 추천작물의 생육 관련 정보 등)에 대한 정보를 조회하실 수 있습니다.- 귀농할 때 작물 선택은 수익성 + 지역 적합성 + 본인의 역량을 모두 고려해야 합니다. 특히 초기 귀농자라면 재배 난이도가 너무 높거나 대규모 투자가 필요한 작물은 피하는 것이 좋습니다.- 전라남도 귀농의 장점- 기후와 토양이 좋고 다양한 작물 재배에 유리- 섬과 산지가 많아 특산물 개발 여건 풍부- 지자체별 지원 제도 다양 (예: 청년 귀농인 우대, 마을 안착 지원금)- 전라남도 귀농귀촌 종합지원센터 운영- 전라남도 지역 특화작물 : 한라봉, 레드향, 표고버섯, 유자, 참다래, 무화과, 쑥, 약초류 등'
