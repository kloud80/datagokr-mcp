description_portal: 이 데이터는 해양수산부에서 소규모항에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 소규모항위도, 소규모항경도, 소규모항종류, 소규모항명칭, 소규모항주소, 소규모항어선수, 소규모항주요시설, 공간정보 데이터로 구성되어 있습니다.본 데이터는 소규모항 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.소규모항이란 '어촌·어항법'에 따라 지정된 국가어항, 지방어항, 어촌정주어항 등 법정어항이 아닌, 어업인들이 공동으로 이용하는 작은 규모의 항포구를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
