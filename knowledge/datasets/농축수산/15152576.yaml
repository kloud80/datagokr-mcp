description_portal: 이 데이터는 대구시 도시농업포털에서 제공하는 팝업 및 배너 목록입니다. 이 목록은 2025년도 농업체험투어 신청 안내, 구청별 텃밭 신청 종료 안내, 구청별 텃밭 신청기한 알림, 달서구 공영도시텃밭 분양 안내와 같은 공지사항 및 알림을 포함하는 팝업리스트와, 대구시청, 농림축산식품부, 농촌진흥원 등과 같은 관련 기관들의 링크를 포함한 배너리스트로 나누어집니다. 이러한 팝업과 배너는 시민들에게 농업 관련 행사, 프로그램, 정책 등에 대한 최신 정보를 제공하고, 관련 웹사이트로의 이동을 유도합니다. 이 데이터는 대구시의 도시농업 활동을 홍보하고, 시민들의 참여를 촉진하는 중요한 도구로 사용됩니다.
