summary_user: K-Foodtrade(케이푸드 트레이드) 수출 거래알선 플랫폼에 등록된 상품을 한 행씩 담은 건별 목록 파일로, 상품명·기업명·관련 국가·키워드와 등록·갱신 일자를 담는다(전국, 비공간, CSV 약 2.6MB). 해외 바이어나 수출 지원 분석가가 '어떤 한국 기업이 어떤 농식품을 어느 나라와 관련해 수출 상품으로 내놓았는가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상품명·기업명 같은 이름 매칭으로만 연결하며, KAMIS 품목코드나 HS 코드와는 별도 매핑이 필요하다.
description_portal: 'K-Foodtrade 시스템은 온라인을 통한 한국기업의 제품 홍보 및 수출 거래알선을 지원하는 웹 플랫폼입니다.바이어와 수출기업 간의 거래 알선, 한국기업 제품 홍보 및 자료실 제공 등의 업무를 수행하고 있습니다.그 중 케이푸드 트레이드_상품정보 데이터는 K-Foodtrade 시스템에 등록된 모든 상품 정보와 관련된 정보를 포함하고 있습니다.주요 수출 품목, 수출기업, 원산지, 상품에 대한 키워드로 구성되어있습니다.데이터 정보- 데이터 컬럼 수: 5개- 데이터 컬럼 목록: 상품명, 원산지, 키워드, 상품정보입력일자, 상품정보갱신일자'
