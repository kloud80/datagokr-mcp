description_portal: 부산광역시  시역 내 구군별 녹지 현황을 정리한 정보 데이터입니다.  2024년 12월 31일 기준으로 작성되었으며, 고가하부녹지, 쌈지공원, 화단, 입면녹화, 공공청사녹화, 옥상녹화, 하천녹지 등에 대한 정보가 포함되어 있습니다. 부산 시내 16개 구군(중구, 서구, 동구, 영도구, 부산진구,  동래구, 남구, 북구, 해운대구, 사하구, 금정구, 강서구, 연제구, 수영구, 사상구, 기장군)의 정보가 세부적으로 포함되어 있습니다. 각 항목별 면적, 개소,  관목, 교목 등이 기록되어 있으며, 672개의 정보가 기록되어 있습니다. 어느 지역에 어떤 녹지가 조성되어 있는지 참고할 수 있으며, 어느 지역의 녹지 범위가 크고 작은지 확인할 수 있습니다.
