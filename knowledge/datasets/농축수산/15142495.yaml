summary_user: IPCC 6차 평가보고서 기후변화 시나리오를 따른 지역 해양기후 수치모델로 전망한 우리나라 주변 해역의 표층수온 값을 격자 좌표(위도·경도)와 시나리오·지표 구분별로 담으며, 포털 설명상 기간은 2015년부터 2100년까지이고 범위는 전국 해역이다. 수산자원 관리·양식 계획 담당자나 연구자가 '특정 해역의 표층수온이 시나리오별로 금세기 말까지 얼마나 오르는가'를 확인하는 데 쓰고, 조회는 최대·최소 위경도로 영역을 지정해 한다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 좌표(위도·경도)를 기준으로 공간 매칭하거나 같은 기관의 관측 수온 자료와 위치를 맞춰 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 IPCC 6차 평가보고서의 기후변화 시나리오를 따른 지역 해양기후 수치예측모델을 기반으로 전망된 우리나라 주변 해역의 수온 예측정보를 제공하기 위해 수집한 데이터입니다.검색대상 위치의 최대/최소 위·경도 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 2015년부터 2100년까지 전망된 수온 값 등 정보로 구성되어 있습니다.  본 데이터는 관련 기관에서 해양환경 변화 연구, 수산자원 관리 계획 수립, 해양 관련 산업의 장기 전략 수립 등을 위한 기초 자료로 활용될 수 있습니다.
