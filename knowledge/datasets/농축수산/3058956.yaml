description_portal: '전라남도 연도별 학교숲 조성 현황입니다.- 조성기간 : 2003년 ~ 2025년- 조성개소 :  초중고 등 291개 학교- "학교숲 조성"은 학생들의 정서적 안정, 생태적 감수성 함양, 환경 교육의 장 마련 등을 목적으로 학교 내 유휴 공간에 나무와 식물을 심어 숲을 조성하는 사업입니다.- 학교 내 또는 인근 유휴 공간에 다양한 수종의 나무와 식물을 심고, 학생 중심의 숲 체험 및 교육 활동이 가능한 공간을 조성하는 사업.- 조성 목적: 학생들의 자연 친화적 정서 함양, 기후 변화 대응 및 미세먼지 저감, 환경교육 및 생태 감수성 강화, 휴식과 여가, 체험 중심 학습 공간 제공, 지역사회와의 협력 및 커뮤니티 공간 확보'
