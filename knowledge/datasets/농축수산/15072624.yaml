description_portal: '강원도 춘천 및 홍천지역(조사지구분 : A지역, B지역, C지역, Gap, 임지정비구, 태풍피해지, 풍천지구) 잣나무림의 산림 작업방법별 임분발달 조사자료 제공강원도 춘천 및 홍천 지역의 잣나무림을 대상으로, 산림 작업방법에 따른 임분(숲의 군집) 발달 양상을 조사한 연구 자료입니다. 본 조사는 A지역, B지역, C지역, Gap, 임지정비구, 태풍피해지, 풍천지구로 구분된 다양한 환경 조건의 조사구에서 수행되었으며, 간벌, 솎아베기, 정리작업 등 작업 방식에 따라 임분의 생장과 구조가 어떻게 변화하는지를 과학적으로 분석합니다. 수집된 정보는 수고, 흉고직경, 수관밀도, 입목축적 등 생육 특성을 중심으로 정리됩니다.'
