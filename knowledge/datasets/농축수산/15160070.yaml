summary_user: 남해 배타적경제수역(EEZ)을 나눈 특성평가격자의 격자번호·격자 아이디·레이어명·레이어 분류 내용을 격자 단위로 담은 CSV 파일(약 18.9KB)이다. 해상풍력 등 해양공간 입지를 검토하는 분석가가 남해 EEZ의 어느 격자가 어떤 평가 레이어로 분류되는지 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없으며, 격자번호·격자 아이디로 같은 기관(해양수산부)의 다른 해역 특성평가격자나 해양공간 자료와 이름·코드 매핑으로만 잇는다.
