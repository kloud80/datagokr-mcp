description_portal: 경기도 여주시의 우제류 축산 농가에 대한 현황 데이터를 수집·제공하고 있습니다. 본 데이터는 여주시 관내에서 우제류에 해당하는 가축, 즉 소, 돼지 등을 사육하고 있는 축산 농가를 대상으로 하며, 각 농가별로 농장명, 축종명, 사육 두수, 소재지 도로명 주소, 소재지 지번 주소, 위도, 경도 등의 항목으로 구성되어 있습니다. 이를 통해 축산 농가의 정확한 위치 및 사육 규모를 파악할 수 있으며, 특정 축종별 사육 분포 현황, 지역별 집중도, 공간 기반 통계 분석 등 다양한 행정 목적에 활용할 수 있습니다.  특히 가축 질병 발생 시 방역 대응 체계를 신속하게 구축하기 위한 기초 자료로 활용될 수 있으며, 가축전염병 예방, 재난형 가축 질병 발생 시 대응 시나리오 수립, 백신 접종 우선순위 결정 등과 같은 방역 정책 수립에도 실효성 있는 정보를 제공합니다.
