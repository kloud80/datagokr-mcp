description_portal: 전라남도 해남군에서 생산되는 주요 특산물에 대한 현황 데이터입니다. 이 데이터에는 특산물 종류, 생산자 주소, 연락처, 판매 홈페이지, 상품 설명 등에 대한 항목을 제공합니다.해남은  전국에서 가장 넓은 농경지와 삼면이 바다로 둘러싸여 있어 다양한 농축수산물이 생산되고 있습니다. - 전국 최대 물김 생산지로 24년 최초 물김 위판액 1000억원  돌파 - "땅끝햇살", "한눈에 반한쌀" 전국 유일 6년 연속 최고 브랜드 쌀 선정 - 고구마 전국 최대 면적, 생산량 전국 1위, 고구마 최초 지리적표시 농산물 등록 - 34만여톤 생산, 전국 절임배추의 20% 생산
