summary_user: 산림청 국립산림품종관리센터가 「농업생명자원의 보존ㆍ관리 및 이용에 관한 법률」에 따라 지정한 산림생명자원 관리기관 목록으로, 기관별로 기관명·보유 자원명·수집자원 구분·최초 지정 시기·만료 연월을 한 행씩 담은 소규모 집계표(약 1KB CSV, 포털 설명상 12개소)다. 산림 종자·유전자원 연구자나 정책 담당자가 '어느 기관이 어떤 산림생명자원을 맡고 있고 지정이 언제 만료되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 자원명을 이름으로 맞춰서만 이을 수 있다.
description_portal: 다음은 산림청 국립산림품종관리센터에서 「농업생명자원의 보존ㆍ관리 및 이용에 관한 법률」에 따라 지정 및 관리하고 있는 12개소의 산림생명자원 관리기관 목록입니다. 이 목록은 각 기관의 명칭뿐만 아니라, 해당 기관이 보유하고 있는 자원명, 종류, 최초 지정 연도, 자원 관리의 유효기간 및 만료 연도 등의 항목을 포함하고 있습니다.또한 이 자료는 고정된 정보가 아니라, 매년 기관별 현황을 조사하고 관련 데이터를 갱신하여 최신 정보를 반영하고 있습니다. 이를 통해 산림생명자원의 체계적인 보존과 관리가 가능하며, 관련 정책 수립 및 연구 자료로도 활용될 수 있도록 정확성과 신뢰성을 유지하고 있습니다.
