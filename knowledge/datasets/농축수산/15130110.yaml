summary_user: 국립해양조사원이 국내 연안 구역을 SHP 형식 공간정보 파일로 제공하는 데이터로, 구역별 객체ID·구역명·구역번호를 담으며 범위는 전국입니다. 해양공간계획 담당자나 연구자가 '특정 연안 구역이 어디까지이고, 해상풍력 같은 입지 검토 대상지가 어느 연안 구역에 들어가는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 해양용도구역·보호구역 데이터와는 구역명 매핑이나 공간 중첩(겹쳐보기)으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 국내 연안 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해양정보중 연안의 SHP형식 공간정보 파일로 구성되어 있으며, 연안의 객체ID, 구역명, 구역번호 등 정보를 포함하고 있습니다.본 데이터는 해양공간계획 수립 시 연안별 해양정보를 조사·분석하거나, 정책 수립 및 관련 보고서 작성, 해양 이용 현황 평가 등 공공기관 내부 업무에 활용할 수 있습니다. 또한 연구기관에서는 연안 해양환경 및 자원 배분 현황 분석, 연안 관리 연구자료로 이용할 수 있습니다.
