summary_user: 국립해양조사원 조위관측소별로 관측한 평균해면 성과를 담으며, 관측소명·관측년월·관측소 위도/경도와 월 평균해면 높이(cm)를 관측소 단위로 제공하고 범위는 전국 연안 관측소다. 해양 분야 연구자나 연안·항만 관리 담당자가 "특정 조위관측소의 월 평균해면이 해마다 어떻게 변했나"를 확인해 해수면 변화나 조석 분석에 쓴다. 전역 조인 키는 없어 관측소코드(바다누리 자체 코드)나 관측소명으로 같은 기관의 조석·조위 관측 데이터와 잇고, 위도·경도(lat, lot)로 지도나 다른 공간 데이터와 위치 기준으로 맞춘다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소에서 관측한 일별, 연별 평균해면 성과 정보를 제공하기 위해 수집한 데이터 입니다. 관측소 코드를 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 관측년월, 관측소의 위도/경도 위치정보 및 월 평균 해면 정보(cm)로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
