summary_user: 전국 주요 봉우리 주변의 문화자원을 지점(POI) 한 건씩 담은 원천 데이터로, 장소명·설명·위도·경도·해발고도와 소속 숲길명을 함께 제공한다. 등산객이나 탐방코스 기획자가 '이 산 숲길에는 어떤 문화유산이 어디에 있나'를 찾거나, 분석가가 봉우리별 문화자원 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 숲길식별자(frtrlId)·숲길명으로 같은 기관의 숲길·봉우리 데이터와 잇고, 다른 데이터와는 좌표나 장소명 매칭으로만 연결한다.
limits: 다른 기관 데이터와 바로 붙일 공통 코드가 없어 연계는 이름·좌표 매칭이나 같은 기관 식별자에 기대야 한다. 위치는 행정구역 코드 없이 개별 좌표로만 주어지므로 시군구 단위 집계는 좌표를 직접 변환해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
