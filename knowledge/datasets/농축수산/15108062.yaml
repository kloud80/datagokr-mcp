description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 11월 16일에 등록하여 제공하는 오픈API 서비스로, 전국 주요 봉우리에 위치한 문화자원에 대한 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 기준일시 등의 속성을 호출할 수 있으며,이를 활용하여 전국 주요 봉우리의 문화유산 분포 분석, 역사문화 탐방코스 개발, 관광 콘텐츠 기획, 문화자원 보존관리, GIS 기반 문화자원 시각화 등 다양한 분야에서 활용이 가능한 정보를 JSON+XML 포맷으로 지원합니다.
