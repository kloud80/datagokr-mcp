summary_user: 공유수면매립 실시계획 한 건마다 사업시행자명, 최초 승인일자·면적, 변경 승인일자·면적과 변경 내용을 담은 전국 범위의 비공간 건별 목록 파일(CSV 약 36KB)입니다. 해양 행정 담당자나 연안 개발 분석가가 '특정 시행자의 매립 실시계획이 언제 승인됐고 면적이 어떻게 바뀌었나'를 확인하는 데 쓴다. 기본계획 일련번호와 면허 일련번호 필드가 있어 같은 공동활용체계의 공유수면매립 기본계획·면허 내역과 번호로 맞춰 볼 여지는 있으나, 실측상 전역 조인 키는 없어 그 외 데이터와는 시행자명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 공유수면매립실시계획내역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공유수면매립실시계획일련번호, 공유수면매립기본계획일련번호, 공유수면매립면허일련번호, 공유수면매립사업시행자명, 공유수면매립실시계획최초승인일자, 공유수면매립실시계획최초승인면적, 공유수면매립실시계획변경승인일자, 공유수면매립실시계획변경승인면적, 공유수면매립실시계획변경내용 데이터로 구성되어 있습니다.본 데이터는 공유수면매립실시계획내역 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면매립실시계획이란 공유수면(바다, 하천 등 공공용으로 사용되는 물)을 매립하여 새로운 토지를 조성하기 위한 구체적인 공사 계획을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
