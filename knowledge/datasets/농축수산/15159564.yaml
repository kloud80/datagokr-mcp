description_portal: '2020년부터 2024년까지 경상남도 지역에서 생산된 단감의 재배면적과 생산량에 대한 데이터입니다경상남도 단감 재배면적과 생산량 데이터에 따르면, 재배면적은 2020년 4,819ha에서 2024년 6,234ha로 전반적으로 증가하는 경향을 보입니다. 생산량 또한 연도별 기상환경과 작황에 따라 변동하였으며, 2022년에 75,155톤으로 가장 높았고, 2023년에는 감소 후 2024년에 다시 증가하였습니다.2023년에는 가을철 이상강우로 인하여 탄저병 발병으로 생산량이 크게 감소하였습니다.관련 데이터는 2020년부터 2025년까지 신청을 해주셨지만, 2025년 통계는 아직 발표가 되지 않았기 때문에 2024년 데이터까지 제공함을 양해해주시기 바랍니다.데이터 담당부서 : 농업기술원 단감연구소(055-254-1555)'
