summary_user: 농림축산검역본부가 관리하는 전국 가축전염병 발생 건을 발생번호별로 담은 건별 원천 데이터로, 질병명·발생농장·농장 소재지·발생일·축종·발생 두수·진단기관·종식일을 담는다. 방역 담당자나 축산 사업자, 분석가가 '최근 어느 지역 농장에서 어떤 축종에 구제역·조류인플루엔자 같은 질병이 발생했고 종식됐는가'를 확인할 때 쓴다. 실측상 전역 조인 키는 없어서, 농장 소재지 법정동코드(FARM_LOCPLC_LEGALDONG_CODE)나 질병명·축종 코드를 다른 데이터의 이름·코드와 직접 매핑해 이어야 한다.
description_portal: 가축전염병정보, 질병발생농장정보, 가축사육정보, 질병진단정보, 신청자정보, 농장정보 등- 본 데이터는 가축전염예방법 제3조의 2,제12조에 기반하여 농림축산검역본부에서 관리하는 가축 질병발생 현황 정보를 제공함- 가축전염병의 발생 추이와 확산 범위를 체계적으로 기록하여 방역 정책 수립의 기초자료로 활용 가능함- 중앙정부 및 지자체는 본 데이터를 통해 위기 대응 계획 수립, 방역자원 배분, 이동 제한 조치 등 다양한 방역정책을 위한 참조자료로 활용 가능- 연구기관과 산업계에서는 데이터를 활용하여 질병 전파 경로 분석, 예측모델 개발, 위험도 평가 등에 대한 참조자료로 활용 가능
