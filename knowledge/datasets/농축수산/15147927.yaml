description_portal: 축산물품질평가원에서 제공하고 있는 소도체 품종별 성별 판정두수는  축산물등급판정통계 기반으로 작성된 자료입니다. 한우, 젖소, 육우, 교잡우 등 총 4종류의 품종을 대상으로 암, 수 ,거세 및 전체판정두수를 월별로 제공하고 있습니다.  .또한 통계표의 이용자 설정대로 조절하여 통계 요약도 확인이 가능하여 파일로 다운받아 이용자가 쉽게 통계자료를 확인할수 있고 이용자가 차트로 변환 가능하도록 활용가능한 파일도 제공됩니다. 전월 등급판정 통계는 집계 과정 등을 통하여 익월 10일(휴무일인 경우에는 그 다음 근무일) 확정됩니다.
