description_portal: 이 데이터는 해양수산부에서 ISM/ISPS 증서 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 ISM(국제안전경영규칙) 및 ISPS(국제선박 및 항만시설 보안규칙) 증서의 발급기관, 심사일, 발급일, 증서유효기간 시작일, 증서유효기간 종료일, 해당 증서의 코드 등으로 구성되어 있습니다.  본 데이터는 해운·항만 관련 기업이나 선박 관리 기관에서 증서의 발급 이력이나 유효기간 추적 등 선박의 안전관리 시스템 운영에 참고자료로 활용할 수 있으며, 선박 관련 행정 처리, 규정 준수 여부 점검, 업무 보고서 작성 등에 데이터를 제공받을 수 있습니다.
