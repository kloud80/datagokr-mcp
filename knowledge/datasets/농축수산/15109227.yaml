summary_user: 2015년 제·개정 농축수산물 표준코드의 등급코드(신코드)와 같은 뜻의 2013년 표준코드 등급코드(구코드)를 한 행씩 대응시킨 전국 단위 코드 매핑표로, 신·구 등급코드와 등급명, 갱신일자(UPDT_DE)를 담는다. 2013년 코드로 기록된 과거 경락·도매 가격 자료를 최신 등급 기준으로 바꿔 시계열을 잇고 싶은 분석가가 "옛 코드의 이 등급이 지금 코드로는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 같은 기관(data.mafra.go.kr)의 표준코드 기반 가격·거래 자료와 등급코드 값이나 등급명으로 맞춰 연결하며, KAMIS·도매시장·KOSIS 등은 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 신구표준등급목록조회 API는 2015년 제·개정된 농축수산물 표준코드의 등급코드와 동일한 의미를 가지는 2013년 농축수산물 표준코드의 등급코드를 체계적으로 정리하여 나타낸 정보를 제공합니다. 본 API를 통해 사용자는 농축수산물의 품목, 시장, 단위, 포장, 크기, 등급 및 산지에 대한 상세한 데이터를 확인할 수 있으며, 이를 통해 특정 농축수산물의 품질관리에 도움이 되는 유용한 정보를 제공받을 수 있습니다. 또한, API는 최신 등급코드와 과거 등급코드를 매핑하여 보여 줄 수 있으며, 등급코드와 함께 관련된 등급명 및 업데이트일자와 같은 추가적인 표준코드 매핑 정보를 포함하고 있습니다. 이러한 정보는 농업 및 식품 관련 연구와 정책 수립에 필수적인 데이터를 제공하여, 농림수산식품의 품질 개선 및 관리에 기여할 수 있도록 돕습니다.
