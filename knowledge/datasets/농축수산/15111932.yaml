description_portal: 농림식품기술기획평가원에서 개방하고 있는 농림식품RnD 계속과제 정보입니다.파일데이터(CSV) 형태로 개방하고 있으며, 세부사업명, 내역사업명, 연구개발과제번호, 연구개발과제명, 총연구개발기간, 연구기관역할명, 연구기관명, 총 연구개발비, 24년도 연구개발비 정보를 포함하고 있습니다. 농림식품 분야 연구개발(RnD) 과제 중 계속 수행되고 있는 과제의 상세 정보를 포함하고 있습니다. 이를 통해 연구 중복 방지, 유사 과제 분석, 정책 수립 및 사업 기획 등에 폭넓게 활용될 수 있습니다. 특히 과제의 연차별 추진 현황 및 예산 집행 정보를 함께 제공함으로써 연구개발 사업의 효율적 운영과 평가에 필요한 기초 자료로 활용됩니다. 연구자, 정책 입안자, 일반 국민 누구나 공공데이터포털(data.go.kr)을 통해 열람할 수 있도록 개방되어 있으며, 농림식품 RnD 사업의 투명성과 접근성을 제고하는 데 기여하고 있습니다.
