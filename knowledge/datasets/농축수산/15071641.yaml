description_portal: 산림청이 운영하는 산림토목관리시스템을 통해 관리되는 데이터로, 사방사업, 임도설치, 산지복구 등 산림토목사업의 설계용역비 산출 근거와 내역 정보를 제공합니다. 본 자료는 산림토목사업 수행 시, 설계단계에서 산출되는 **용역비 세부 항목(직접인건비, 제경비, 기술료, 부가세 등)**을 포함하며, 사업 규모와 유형에 따라 산정된 비용 데이터를 확인할 수 있습니다. 이 데이터는 예산 편성의 근거자료, 사업 타당성 평가, 사업비 적정성 검토, 공사비와 비교 분석, 설계업체 평가 등 다양한 행정 및 기술적 활용이 가능합니다.
