description_portal: '- 기후변화에 대응하기 위해 전남 해역의 주요 양식어장의 어장관측장비를 설치하고  실시간으로 측정되는  해황자료 제공하여 수산재해 예방 및 수산양식활동을 지원하는 시스템으로 어장관측장비의 설치현황 정보를 제공됩니다.- 전라남도는 어업과 해양 산업의 중심지로서, 어장 관측 및 관리에 필수적인 다양한 첨단 장비와 시스템을 도입하여 해양 환경 모니터링과 어업 관리의 효율성을 높이고 있습니다. - 첨단 장비와 시스템들은 전라남도의 어장 관측과 관리에 중요한 역할을 하고 있으며, 지속 가능한 어업과 해양 환경 보호에 기여하고 있습니다.- 양식품종 : 숭어, 전복, 돔, 우럭, 김, 새꼬막, 다시마, 미역, 조피볼락, 피조개, 굴 등 - 장비유형 : 고정형, 부이형 등'
