summary_user: 한국수목원정원관리원 시드뱅크에 보관된 종자 자원을 건별로 담으며, 포털 설명에 따르면 등록번호·고유번호와 학명·국명, 저장 구분·보관 상태·수집 출처를 수록한다(실측 필드는 국명·학명·일련번호만 확인됨). 연구자나 분석가가 '특정 식물 종의 종자가 국가 시드뱅크에 보존되어 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 식물·종자 데이터와는 학명(scnm)이나 국명 같은 이름 매칭으로만 잇는다.
description_portal: 본 데이터는 국내외 종자 자원의 통합적 관리 및 보전 상태 추적을 통해 국가 야생식물 종자 자산의 안정적인 보존 인프라를 구축할 목적으로 한국수목원정원관리원 시드뱅크에 수용된 종자 자원 전체의 기본 정보를 제공하는 데이터입니다. 시드뱅크 등록 번호와 고유 식별 번호를 바탕으로 학명 및 국명 중심의 표준 식물 분류 체계를 수록하고 주요 저장 구분과 보관 상태 및 종자 수집 출처 등의 핵심 명세 데이터를 체계적으로 수록했습니다. 국가 종자 자원 보존 현황의 투명한 관리와 학술 연구 및 자원 분양 연계 서비스와 인공지능 기반 종자 관리 시스템 구축의 기초 자료로 활용됩니다.
