summary_user: 전국 어선의 선박 검사 신청을 건별로 담은 파일로, 신청 연도·날짜, 검사 신청 유형, 담당 검사 지사, 접수 방법을 기록한다(CSV 약 50MB). 해양수산 분석가나 검사 기관이 연도별·지사별로 어떤 종류의 어선 검사 신청이 얼마나 들어오고 어떤 방법으로 접수되는지 파악하는 데 쓴다. 어선번호 같은 전역 조인 키가 없어 어선 등록·허가 원장과 건별로 잇지 못하고, 검사 지사명이나 연도 기준으로 다른 집계와 맞춰 쓴다.
