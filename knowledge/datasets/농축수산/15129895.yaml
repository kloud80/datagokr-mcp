description_portal: 이 데이터는 해양수산부에서 특정 지역에 서식하는 저서동물의 생체량을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 조사출처, 조사정점, 생물의 영문과 국문 학명 및 생체량값으로 구성되어 있습니다.  본 데이터는 해양 생태계의 생물 다양성 연구, 저서동물 군집 구조 변화 추적, 해역별 환경 구조 평가, 장기적인 해양환경 관리 계획 수립 및 생태계 건강도 조사 등 다양한 분야에 활용될 수 있습니다. 또한 해양 자원 관리와 정책 수립, 환경영향평가 보고, 해양생태계 관련 연구자료로도 참고될 수 있습니다.
