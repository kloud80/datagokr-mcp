summary_user: 과수거점산지유통센터 건립지원사업의 예산 집행 현황을 연도와 시도·시군구 단위로 담은 집계 데이터로, 교부액·전년도 이월액·예산액·집행액·이월액·불용액·실집행률이 들어 있다. 농정 분석가나 지자체 담당자가 '어느 시군구가 산지유통센터 지원 예산을 얼마나 받아 실제로 얼마나 집행했나'를 비교해 지역 간 유통 인프라 지원 격차를 따질 때 쓴다. 실측상 전역 조인 키는 없어서, 다른 데이터와는 시도·시군구 이름이나 코드(CTRD_CODE, SIGNGU_CODE)를 매핑하거나 같은 기관 데이터의 코드로 잇는다.
description_portal: 해당 데이터는 과수거점산지유통센터 건립지원 사업의 현황을 담고 있습니다. 본 사업은 규모화·현대화된 산지유통시설을 지원하여 소규모 유통시설의 중심축으로 육성하는 사업입니다. 이를 통해 농산물 집하·선별·포장·저장·가공 등 일괄처리 체계 구축 수준을 파악할 수 있으며, 지역 간 유통 인프라 격차를 분석해 향후 지원 방향을 설계할 수 있습니다. 또한 지역 거점센터 활용도를 확인해 유통 효율성을 높일 수 있으며, 농산물 가격 안정, 물류비 절감 효과, 산지조직화 기여도 등을 검증하는 기초자료로 활용할 수 있습니다. 궁극적으로 본 데이터는 산지유통 체계 개선과 농산물 경쟁력 강화, 농가 소득 안정화에 기여하는 중요한 자료입니다.
