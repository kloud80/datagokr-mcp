description_portal: 해양생명자원통합정보시스템(MBRIS)은 해양수산생명자원 등급제 정보를 제공하고 있습니다. 해양수산생명자원의 효율적이고 체계적인 관리를 위하여 등급제를 도입하였으며, 안전성·유용성·공급성을 평가하여 활용이 높고 잠재적 가능성이 높은 종의 원천 소재를 확보·관리하고자 합니다. 또한 국립해양생물자원관에서는 해양수산생명자원의 경제적·생태적·학술적 가치를 평가하여 1-3등급의 등급을 부여합니다. 등급기준은 『해양수산생명자원의 등급 절차 및 방법 등에 관한 고시』 별표 1에 고시되어 있습니다. 등급기준은 많은 전문가들의 의견을 수렴하였으며, 국외반출 승인대상 해양수산생명자원은 1-2등급을 대상으로 선정합니다.
