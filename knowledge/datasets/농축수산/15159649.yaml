description_portal: '1. 선박안전법 및 관련 고시에 근거하여 선박의 안전 운항을 위하여 형식승인 및 검정을 받아야 하는 선박용 물건의 제조, 정비를 수행하는 사업장의 자격 요건과 취급 품목 정보를 관리하는 데이터입니다.2. 데이터는 크게 3가지 영역으로 구분됩니다. - 사업장 지정 정보 : 지정인증서번호, 지정구분, 지정일자를 포함하여 해당 사업장의 적격성을 식별합니다. - 취급 품목 정보 : 품목코드, 품목명, 물품규격, 물품형식을 통해 해당 사업장에서 보증하는 선박용 물건을 관리합니다. - 운영 이력 정보 : 이력구분, 변경유형, 품목 추가 및 삭제 일자를 활용하여 품목의 변동 사항을 확인합니다.3. 활용 - 사업장의 지정 정보를 유지하여 선박 내 설치되는 기자재의 품질 및 안전성 확인 - 항구별 지정사업장 분포 및 현황 파악 - 특정 사업장에서 취급 승인된 품목의 범위와 기간 관리'
