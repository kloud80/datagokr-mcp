description_portal: 경상남도 거제시에 등록된 축산물 관련 위생업소의 현황을 제공하는 공공데이터입니다. 도축업, 집유업, 가공업, 보관업, 운반업, 판매업 등 축산물 유통 전반에 걸친 업종별 등록 현황이 포함되어 있습니다. 특히 축산물판매업 중 식육판매업과 식육전문판매업으로 구분하여 보다 세부적인 정보를 제공합니다.이를 통해 지역 내 축산물 유통 및 판매 구조를 파악하고, 위생 관리의 기초 자료로 활용할 수 있습니다. 식품안전 및 축산물 유통과 관련된 정책 수립과 점검에도 활용 가능성이 높습니다. 공공데이터로 제공되어 시민, 기업, 행정기관 등 다양한 주체가 자유롭게 활용할 수 있습니다.
