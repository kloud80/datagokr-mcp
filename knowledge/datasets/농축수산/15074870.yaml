description_portal: 이 데이터는 해양수산부에서 인천 해역의 특성평가 격자 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 WMS(웹 맵 서비스) 및 WFS(웹 피처 서비스) 형태로 구분되어 있습니다. WMS데이터는 반환 이미지 크기(픽셀), 좌표체계, 검색 범위 파라미터로 맵 이미지 파일을 조회할 수 있으며, WFS는 특성평가격자의 텍스트 형태 공간정보와 격자번호 정보를 제공받을 수 있습니다.본 데이터는 지자체 및 관계 기관에서 해양공간계획 수립, 해양환경 모니터링, 해양자원 관리 등 업무를 위한 기초 자료로 활용될 수 있습니다.
