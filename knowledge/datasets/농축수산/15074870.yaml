summary_user: 해양수산부가 인천 해역의 해양공간 특성평가 격자를 WMS(지도 이미지)와 WFS(격자 좌표·격자번호 텍스트) 형태로 내려주는 공간정보 API로, 격자 한 칸 단위의 폴리곤 좌표(posList)를 담는다. 해양공간계획 담당자나 해상풍력 등 입지 검토자가 '인천 앞바다 특정 지점이 어느 평가 격자에 속하고 그 경계가 어디인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 격자번호나 좌표를 기준으로 해양용도구역·보호구역 등 다른 해양공간 레이어와 공간 중첩해 이어 쓴다.
limits: 다른 데이터와 바로 맞물리는 공통 코드 키가 없어 이름·코드 매핑이나 좌표 기반 공간 연산으로만 연결된다. 개발계정은 하루 10,000회 호출 제한이 있고 serviceKey를 쿼리로 넘겨야 한다.
