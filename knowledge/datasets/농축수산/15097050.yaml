description_portal: 이 데이터셋은 제주특별자치도 내 읍·면·동 행정구역 단위로 ‘가금류’를 사육하는 농가의 분포 현황을 집계한 공공데이터로, 각 지역별 가금류 사육 농가 수와 해당 농가의 분포 정보가 포함되어 있다. 이를 통해 지역 단위로 가금류 축산업이 어느 정도 분포되어 있는지를 파악할 수 있어, 축산업 구조 분석, 지역별 축산 농가 밀집도 조사, 축산 관련 정책 수립, 환경 및 위생 관리 계획 수립 등에 활용할 수 있다. 또한 이 데이터는 지역 간 비교를 통해 축산 자원 배치 상태를 분석하고, 가금류 사육 농가 밀집 지역을 기준으로 방역 체계 점검, 축산 관리 우선순위 설정, 지역 농가 지원 정책 설계 등에도 기초 자료로 활용 가능하며, 데이터는 CSV 형식으로 누구나 무료 이용할 수 있다.
