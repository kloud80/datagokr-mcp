description_portal: 이 데이터는 해양수산부에서 항만시설, 어항시설, 연안보전시설, 마리나시설과 관련된 기술기준을 체계적이고 일관성 있게 관리하고 적용하기 위하여 수집된 데이터입니다.  본 데이터의 주요 내용은 기술문서 구분, 분류명, 문서번호 및 명칭으로 구성되어 있습니다.  본 데이터는 항만 및 어항 시설의 신규 조성 또는 개량 사업을 진행하는 설계·시공 업체에서 법령과 절차 준용을 확인할 때 활용될 수 있으며, 정부기관에서는 시설 관리 정책 수립 및 시설 안전점검 지침 마련 시 참고자료로 활용할 수 있습니다. 또한 관련 연구기관에서는 각종 기술 기준 변화 분석과 제도 개선 방안 연구 등에 본 데이터를 이용할 수 있습니다.
