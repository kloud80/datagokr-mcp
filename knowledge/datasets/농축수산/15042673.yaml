description_portal: 산림청 국립산림과학원이 제공하는 수종별 임목생장량(조사년도, 본수, 평균직경, 편균수고 등) 변화의 주기적 모니터링 정보를 제공합니다.국내 주요 수종을 대상으로 임목(나무)의 생장량 변화를 장기적으로 모니터링한 자료로, 산림의 생장 특성과 산림경영 효과를 분석하기 위한 핵심 데이터입니다. 이 자료는 조사년도, 본수, 평균 직경(DBH), 평균 수고(나무 높이), 축적량 등의 항목으로 구성되어 있으며, 고정된 시험지 내 동일 지점을 반복 측정하여 시간에 따른 생장 변화를 정밀하게 추적할 수 있도록 설계되어 있습니다.
