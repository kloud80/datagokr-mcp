description_portal: '해양수산부에서 우리나라 무인도서에 대하여 매년 실시하는 무인도서 실태조사 자료를 정리하고 정리된 데이터를 다양한 곳에서 사용할 수 있도록 제작된 데이터 입니다.무인도서 관리을 위하여 각종 정보에 대하여 세부적으로 정리하였으며, 현장에서 조사된 데이터를 활용할 수 있도록 최대한 정보를 보여지도록 제작된 자료입니다.[데이터 설명]제공 항목 : 무인도서 실태조사 정보 총 29가지 정보(마스터 정보, 토지, 법령, 관리유형 제안, 주변해역이용현황, 주변해역어항현황, 지자체개발계획, 역사문화, 지형지질경관, 식물상, 식물종, 식생, 식생종, 곤충, 곤충종, 조류, 조류종, 포유류, 포유류종, 해양동물, 해양동물종, 해조류, 해조류종, 거주현황, 시설물, 관광자원, 에너지광물자원, 해양쓰레기, 해역수질)조사 범위 :우리나라 주변 해역 내 무인도서조사 구분 : - 1차 실태조사(2007년 ~ 2012년) - 2차 실태조사(2017년 ~ 진행중)무인도서 정보는 해양수산부 무인도서 종합정보제공 사이트에서 확인할 수 있습니다.http://uii.mof.go.kr/UII/INTRO/index.html'
