summary_user: 경기도 안에 등록해 운영 중인 수목원을 한 곳당 한 행으로 담은 현황 목록으로, 수목원 구분(국립·도립·시립 등), 등록승인년도, 규모(ha), 보유 식물 종수, 특징, 대표자·전화번호, 도로명·지번 주소와 WGS84 위경도를 포함한다. 주말에 가까운 수목원을 찾는 시민이나 생태관광·식물자원 현황을 시군별로 비교하려는 분석가가 '우리 시군에 어떤 수목원이 있고 규모와 보유 종수는 얼마인가' 같은 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 시군명·시군코드(SIGUN_CD)나 수목원 이름, 위경도 좌표를 기준으로 휴양림·숲길 등 다른 산림휴양 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 등록 후 운영 중인 수목원에 대한 현황 정보를 제공합니다. 수목원명칭, 전화번호, 등록승인년도, 수목원 구분(국립, 도립, 시립 등), 대표자명, 수목원규모(ha), 보유종수, 수목원의 특징 등 기본적인 운영 정보와 함께, 주소 정보(도로명·지번·우편번호) 및 WGS84 기준의 위도·경도 좌표를 포함하여 수목원의 위치도 명확히 확인할 수 있습니다. 이 데이터는 자연생태 관광자원 분석, 식물자원 보존 관리, 교육 프로그램 기획, 생태체험관광지 발굴 등에 활용될 수 있으며, 정기적인 반기 갱신과 Open API 제공을 통해 접근성과 실효성을 동시에 갖추고 있습니다. 또한 상업적 이용과 콘텐츠 변경이 허용되어 민간 서비스와 융합한 응용이 가능합니다.
