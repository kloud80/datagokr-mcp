summary_user: 국립종자원이 생산한 벼 정부보급종의 품종별 생산량(kg)을 2010년산부터 2025년산까지 연도별 열로 펼쳐 담은 전국 단위 집계표다. 종자 공급 담당자나 농업 분석가가 특정 벼 품종의 보급종 생산이 해마다 늘었는지 줄었는지, 어떤 품종으로 보급이 옮겨 갔는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품종명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 농림축산식품부 국립종자원에서 생산한 벼 정부 보급종의 연도별(2010년부터 기준년도까지), 품종별 생산량(kg)에 대한 데이터로 품종명, 생산연도, 생산량  등의 항목을 제공합니다.※ 정부보급종은 종자산업법 제22조에 따라 정부가 생산·공급하고 있는 종자로 벼, 콩, 팥, 보리, 밀, 호밀 작물이 해당된다.※ 제공되는 데이터는 "CSV(Comma Separated Values, 쉼표로 값을 구분하여 데이터를 저장하는 파일 형식)" 타입으로 엑셀(Excel), 한셀, CSV 전용 뷰어나 메모장등으로 데이터 확인이 가능합니다.
