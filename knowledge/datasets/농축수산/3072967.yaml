summary_user: 농림축산검역본부 농림축산검역검사기술개발사업의 연구과제를 과제 한 건씩 담은 전국 단위 목록으로, 연구과제번호·과제명·연구책임자명을 담는다. 연구자나 정책·연구기획 담당자가 '어떤 검역·안전관리 기술 과제를 누가 수행했나'를 확인하거나 연구성과 현황을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과제명·연구책임자 이름 매핑이나 같은 기관 자료의 과제번호로만 이어 쓴다.
description_portal: 농림축산식품부 농림축산검역본부에서 수행하고 있는 농림축산검역검사기술개발사업의 연구 성과에 대하여 수행년도, 사업구분, 과제분류, 과제명, 연구책임자 등에 대한 정보를 제공하고 있음- 사업별 연구과제에 대해 수행연도,과제명,연구책임자,참여기관,연구비집행현황,과제구분 등의 주요 정보를 포함하고 있음- 해당 데이터는 농림축산 분야 검역 및 안전관리 강화를 위한 기술개발사업의 주요 내용을 체계적으로 정리,집계하여 향후 정책 수립, 연구개발 계획 수립, 연구성과 평가등에 활용 가능함.
