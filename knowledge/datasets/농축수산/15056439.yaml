summary_user: 제주특별자치도 내 육상양식장을 시설 한 곳당 한 행으로 담은 파일로, 상호·주소·데이터 기준일자만 들어 있다(CSV 약 24KB). 어업인이나 연구자가 '제주 어느 읍·면에 육상양식장이 몰려 있는가'처럼 행정구역별 분포와 개별 시설 위치를 확인할 때 쓴다. 전역 조인 키나 면허·허가번호가 없어 다른 어업 면허·허가 데이터와는 상호명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 파일은 제주특별자치도 내에 위치한 육상양식장의 현황을 종합적으로 파악하기 위해 마련된 공공데이터로, 도내 수산업 정책 수립과 산업 분석에 필요한 기초 정보를 제공합니다. 각 양식장의 상호명, 주소, 데이터 기준일자를 포함하고 있어 개별 시설 식별은 물론, 행정구역별 분포 현황, 양식 산업의 공간적 특성, 지역별 운영 집중도 등을 파악할 수 있도록 구성되어 있습니다. 이를 통해 수산자원 관리, 재해 대응, 환경 영향 분석, 스마트 양식장 도입 등 다양한 분야에 활용될 수 있으며, 민간과 학계의 연구 기반 자료로도 유용합니다.
