description_portal: 이 데이터는 해양수산부 바다내비 여객선 정보 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 2021년 기준으로 바다내비시스템에 등록된 여객선에 관한 정보로 구성되어 있습니다. 여객선 정보는 소속 조합지부, 여객선 선명, 출항지, 현재위치, 기항지 여부, 승선인원 및 차량수, 면허항로 정보를 포함하고 있습니다.  본 데이터는 여객선 운항 현황 파악, 선박 안전관리, 해상 교통 정책 수립, 운항 경로 분석, 여객선 수급 현황 점검 등 해운업 및 해상 교통 관련 연구와 정책 자료로 활용될 수 있습니다.
