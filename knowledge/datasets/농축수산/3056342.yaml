description_portal: 이 데이터는 해양수산부에서 연안포털 내 점용·사용중인 공유수면의 현황 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 전체 공유수면 점사용 현황, 업무구분별/공유수면구분별/허가변경구분별/점사용기간별/허가목적별/허가위치별/허가관리기관별/허가면적별 점사용 현황 및 상세정보로 구분되어 있으며, 공유수면 상세 정보는 관리번호. 위치, 허가일 면적, 점사용 목적 , 기간, 유형 등 정보로 구성되어 있습니다.이 데이터는 공유수면의 점용·사용 현황을 파악하여 해양 공간의 효율적 관리와 정책 수립에 활용될 수 있습니다.
