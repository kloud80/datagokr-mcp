summary_user: 전국 어선의 측정 결과를 어선별로 담은 파일로, 선적항·조선지역 코드, 진수일자, 총톤수, 측정 길이·너비·깊이, 폐위장소·상갑판 위아래·제외장소 용적을 담는다(약 7.4MB csv). 분석가나 행정 담당자가 어선의 톤수·선체 규모 분포를 선적항이나 건조 지역별로 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 선적항구코드·조선지역코드를 같은 기관의 코드표나 이름 매핑으로 다른 어선 등록 자료와 연결해야 한다.
description_portal: 이 데이터는 해양수산부에서 어선측정데이터에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 선적항구코드, 조선지역코드, 진수일자, 선박총톤수, 선박측정길이, 선박측정너비, 선박측정깊이, 선박측정깊이, 선박측정중심선, 선박측정길이, 폐위장소의합계용적, 상갑판아래의용적, 상갑판위합계용적, 제외장소합계용적 데이터로 구성되어 있습니다.본 데이터는 어선측정데이터 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
