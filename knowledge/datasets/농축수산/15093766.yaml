description_portal: '강원특별자치도 강릉시의 길고양이 중성화(TNR) 사업 진행 현황을 개체 단위로 기록한 데이터로, 포획부터 중성화수술, 방사까지의 전 과정을 일자·장소·개체 특성별로 관리할 수 있도록 구성된 자료입니다. 길고양이 개체 수 조절과 동물복지 향상, 민원 감소를 위한 사업 진행 상황을 체계적으로 파악하는 데 활용됩니다.포획일자: 길고양이를 실제로 포획한 일자(YYYY-MM-DD 형식)포획장소: 길고양이를 포획한 위치(동·리, 도로명 등 간략 주소 또는 지점명)성별: 포획된 길고양이의 성별 구분(예: 수컷, 암컷 등)체중(kg): 포획 당시 길고양이의 체중 정보(kg 단위)추정나이(세): 수의사·관리기관이 판단한 길고양이의 추정 연령(만 나이 기준 등 지자체 기준)모색: 길고양이의 털색·패턴 정보(예: 고등어태비, 치즈, 삼색, 흰색 등)중성화수술일자: 길고양이의 중성화수술이 실제로 시행된 일자(YYYY-MM-DD 형식)방사일자: 수술 후 회복을 거쳐 다시 원래 생활하던 지역으로 방사한 일자(YYYY-MM-DD 형식)방사장소: 길고양이를 방사한 위치 정보(주요 지점·동·리 등으로 표기)관리기관명: TNR 사업 및 데이터 관리를 담당하는 기관 또는 부서 명칭전화번호: 관련 문의 및 민원 접수 등을 위한 관리기관 연락처(전화번호)데이터기준일자: 해당 길고양이 중성화사업 관리 현황이 마지막으로 취합·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 길고양이 포획·수술·방사 이력 관리, 지역별 TNR 사업 실적 분석, 개체 수 조절 효과 평가, 민원 다발 지역 중심의 우선사업 지역 선정, 동물복지·유기동물 예방 정책 수립 등 길고양이 관리와 관련된 행정·정책 의사결정에 활용할 수 있는 기초 통계자료입니다.'
