description_portal: 이 데이터는 해양수산부에서 선박사고에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호,  사고발생해역명, 사고선박수 등의 데이터로 구성되어 있습니다.본 데이터는 선박사고 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.선박사고란 선박의 구조·설비 또는 운용과 관련하여 사람이 사망하거나 실종되거나 부상당하는 사고, 선박이나 육상·해상시설이 손상되는 사고, 선박이 멸실·유기·행방불명되는 사고, 선박이 충돌·좌초·전복·침몰하는 사고, 해양오염을 일으키는 사고 등을 포괄하는 말을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
