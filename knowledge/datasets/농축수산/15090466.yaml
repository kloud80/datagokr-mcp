description_portal: '농작물재해보험은 자연재해 등으로 인한 농작물 피해를 보험을 통해 실손 보상함으로써 농가의 소득 및 경영 안정을 도모하고 안정적인 농업 재생산 활동을 뒷받침하기 위해 시행하는 제도입니다.2001년 도입 이후 보험 품목과 사업 지역 확대, 보장 강화 등을 통해 가입규모가 매년 증가하고 있습니다.- (근거법령) 농어업재해보험법- (사업대상자) 농업경영체 등록을 한 개인 또는 법인- (보험목적물) "25년 기준 76개 품목 및 시설작물 재배용 농업용 시설물본 자료는 농작물재해보험에 가입된 과수작물의 품목, 품종, 재배방법 등 세부현황을 수록하였습니다.이 데이터는 정책보험 정책 수립 및 제도 개선을 위한 기초자료로 활용되며, 농업재해보험에 대한 이해를 돕고 관련된 연구 또는 통계분석 등에 활용될 수 있도록 제공합니다.* 수록자료 및 단위 : 수령(년), 주수(주), 수확량(kg), 가입가격(원/kg), 과실수(개), 재식주간거리(m), 재식열간거리(m), 재식면적(㎡), 과중(g)※ 본 자료는 매년 연말에 전년도 말 기준 자료로 갱신하여 제공합니다.'
