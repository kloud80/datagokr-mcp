summary_user: 산림청이 관리하는 수목보호기술자의 자격 정보를 사람 단위로 담은 전국 단위 비공간 CSV 파일(약 21KB)로, 이름·자격증번호·합격일·교부일·등록일시를 담는다. 나무병원 업계 관계자나 분석가가 특정 기술자의 자격 보유 여부와 자격증 교부 시점을 확인하거나, 연도별 자격 취득 추이를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자격증번호나 이름을 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 데이터는 산림청이 운영하는 산림사업법인관리시스템에 등록된 나무병원 중 관련 법령을 위반하거나 모범적으로 운영된 사례에 대해 부과된 행정처분 및 포상 등의 상벌조치 내역을 정리한 공공자료입니다. 이 데이터는 나무병원의 행정처분 이력, 위반 내용, 조치 유형(경고, 과태료, 등록취소 등), 조치일자, 법령 근거, 포상 사례 등을 포함하고 있어, 제도적 책임성과 윤리적 운영 여부를 확인할 수 있는 기준으로 활용됩니다. 주요 위반 사례로는 무자격자 운영, 부정확한 병해충 진단 및 방제, 허위보고, 기술자격 미보유 등이 있으며, 이 정보를 통해 나무병원 운영의 투명성 확보, 불법 행위 사전 예방, 우수 병원 발굴 및 인센티브 제공 등의 효과를 기대할 수 있습니다.
