summary_user: 국립농산물품질관리원이 수행한 사료검정 실적을 연도별로 집계한 데이터로, 검정 건수 합계와 유해물질·동물약품·농약·일반성분·광물질·보조제·미생물·기타성분 항목별 검정 건수를 전국 단위로 담는다. 사료 안전관리 정책을 살피는 분석가나 축산·사료업계가 '연도별로 유해물질이나 동물약품 잔류 검정이 얼마나 늘거나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도를 기준으로 같은 기관의 다른 검정·품질관리 통계와 나란히 놓고 보는 방식으로만 이어 쓴다.
description_portal: 사료검정은 사료의 등록성분 또는 유해물질 함유 여부 등을 분석하거나 사료로서의 적합 여부를 감별한느 것으로 사료의 성분함량과 유해물질 검정을 통한 양질의 사료생산 및 안전한 축산물의 생산기반 구축 및 검정결과의 객관성 및 신뢰성 확보를 목적으로 도입된 제도로 본 정보는 국립농산물품질관리원에서 관리하는 사료의 품질 및 안전관리를 위한 일반성분, 유해성분 등 검정 정보로서, 연도, 검정 건수 합계, 유해물질 검정 건수, 동물약품 검정 건수, 농약 검정 건수, 일반성분 검정 건수, 광물질 검정 건수, 보조제 검정 건수, 미생물 검정 건수, 기타성분 검정 건수 항목으로 구성되어 있습니다.
