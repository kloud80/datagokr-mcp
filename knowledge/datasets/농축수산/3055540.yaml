summary_user: 2025년 1~12월 허가일자 기준 전국 시군구별 농지전용 건수와 면적(㎡)을 모은 집계 파일로, 203행을 담는다. 농지를 사거나 개발하려는 사업자와 지자체 담당자, 분석가가 어느 시군구에서 농지전용이 얼마나 이뤄졌는지 확인하는 데 쓴다. 지역코드와 시도명·시군구명으로 같은 기관의 다른 농지 필지 데이터와 이름·코드 매핑을 거쳐 이어 쓰며, PNU 같은 필지 단위 키는 이 파일에 없다.
description_portal: 본 데이터는 허가일자 기준 2025.1.1. ~ 2025.12.31. 기간의 전국 지자체 농지전용현황에 대한 데이터로 2025년도 각 시군구별 농지전용건수(건), 면적(㎡)에 대한 정보를 제공하고 있습니다.농지전용이란 농지를 비농업적 용도로 바꾸는 것으로 농지법 제34조에 의거 농림축산식품부장관의 허가를 받아야 합니다.해당 데이터는 농지관리정책, 개발계획 검토, 토지관리 정책 수립 등 다양한 분야에서 활용 가능하며 연속된 연도별 자료를 활용하면 지역 간 장기적 변화 추세를 확인할 수 있습니다.
