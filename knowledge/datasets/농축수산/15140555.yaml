summary_user: 도매시장에서 활동하는 법인(도매시장법인 등)의 법인코드와 법인명을 한 행씩 담은 전국 단위 코드표로, 건별 거래가 아니라 식별용 기준 목록이다. 도매시장 경락·반입 자료를 분석하는 사람이 "이 거래 기록의 법인코드는 어느 법인인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 같은 기관(농림축산식품부) 도매시장 데이터의 법인코드 값과 맞추거나 법인명으로 매핑해 이어 쓴다.
description_portal: 농림축산식품부는 도매시장에서 활동하는 법인에 대한 정보를 제공하는 OPEN‑API 서비스를 운영합니다. 본 데이터는 법인코드와 법인명으로 구성되어 있으며, 이를 통해 도매시장 내 유통업체의 식별 및 관리가 가능합니다. 법인 정보는 거래 실적 분석, 유통망 구조 파악, 정책 수립 등 다양한 분야에서 활용됩니다. 또한, 표준화된 법인코드를 통해 데이터의 일관성과 정확성을 높이며, 농산물 유통의 효율성과 투명성을 제고하는 데 기여합니다. 해당 데이터는 도매시장 운영의 기초 자료로서, 유통업체의 역할과 시장 내 위치를 명확히 이해하는 데 중요한 역할을 합니다.
