description_portal: 데이터는 경기도 화성시에서 스마트팜 기술을 활용하여 포도를 재배하는 농가를 대상으로 2019년 7월부터 9월까지 수확기에 측정한 습도 정보를 수집한 것이다. 수확기는 과실 품질과 저장성에 직결되는 시기로, 본 자료는 해당 시기 재배 환경의 습도 조건을 정밀하게 파악할 수 있도록 구성되어 있다. 데이터는 농가별로 구분되며, 측정 일시, 지역, 습도 수치 등의 항목으로 구성되어 있다. 이를 기반으로 생육 조건 분석, 병해충 발생 예측, 품질 향상 방안 마련 등에 활용할 수 있다. 또한 기상 조건과 연계한 작황 분석, 스마트농업 의사결정 지원, 재배 환경 최적화 등에도 기초자료로 제공될 수 있는 정보이다. 화성시의 농업 디지털화 및 정밀농업 확대에 기여할 수 있는 실증적 자료로 활용 가능하다.
