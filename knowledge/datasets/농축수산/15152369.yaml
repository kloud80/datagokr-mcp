summary_user: 간척지구에 설치된 자동계측기 관측소(위치 좌표·설치일·최종 측정시간·사용여부)와 이를 운영하는 사업장, 간척농지 지구별 기본정보(조사기간·대표 법정코드·고시면적)를 관측소·지구 단위로 담은 약 14KB 분량의 CSV 파일이다. 특정 간척지구에 어떤 계측 관측소가 어디에 있고 언제까지 측정했는지, 지구의 고시면적이 얼마인지를 확인하려는 농지 분석가나 지역 사업자가 쓴다. 전역 조인 키는 없어 지구코드·관측소 아이디로 이 파일 안의 관측소·사업장·지구 정보를 서로 잇고, 외부 데이터와는 지구별 대표 법정코드나 위경도·지구 이름으로만 맞춰 연결한다.
limits: 실시간 측정자료는 법령상 비공개라 이 파일에 측정값은 없고 관측소별 최종 측정시간만 있다. 실측 컬럼에 PNU 같은 전역 조인 키가 없어 필지 단위 농지 정보와 직접 붙이기 어렵다.
