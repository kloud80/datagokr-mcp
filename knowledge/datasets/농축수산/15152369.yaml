description_portal: '간척지구 내 실시간 모니터링 기능을 구현한 계측기별 정보와 모니터링 업무를 수행하고 있는 간척농지에 대한 기본정보를 제공합니다(간척농지 지구정보, 간척지구 조사기간, 간척지구 조사위치, 간척지구 공구정보, 사업장 정보, 관측소정보, 관측소 별 측정데이터 최종시간 등)[데이터  안내]1. 관측소정보: 간척지구 내 자동계측기 관측소의 정보를 제공합니다(위치 , 관측소명, 최종측정시간 등)2. 사업장정보: 간척지구 내 자동계측기  운영 및 관리하는 사업장 정보를 제공합니다3. 간척농지 지구정보:  간척농지별 지구의 일반정보를 제공하며, 간척지구별 조사기간, 간척지구별 조사위치, 지구 내 공구의 정보를 제공합니다.  4. 실시간 측정자료의 경우 현재 법령상 비밀, 비공개 정보로 제공이 되지 않는 점 참고 부탁드립니다.'
