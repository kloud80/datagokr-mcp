summary_user: 농촌진흥청 국가 표준 식품성분표를 식품 한 가지당 한 행으로 담은 파일로, 식품군·식품명·출처와 에너지·수분·단백질·지방·탄수화물·당류·식이섬유·무기질·비타민 등 영양 성분 함량, 책자 색인 정보를 함께 담는다. 식품 가공 사업자나 식단을 짜는 가정·영양 분석가가 '이 식품 100g에 나트륨·칼륨·단백질이 얼마나 들어 있나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 식품명이나 책자 색인(DB10.2색인·10개정 책자색인) 기준의 이름·코드 매핑으로만 잇고, KAMIS 같은 농산물 가격 데이터와 엮으려면 품목명 대응표를 따로 만들어야 한다.
description_portal: '농촌진흥청은 식품에 포함된 표준 성분표를 코드화하고 함유량을 수치화하여 등록된 정보를 제공하여 영양소 함량을 알기 쉽게 확인할 수 있는 데이터를 제공하고 있습니다. 제공정보 : 1. 식품군, 2. 식품명, 3. 출처, 4. 에너지(칼로리), 5. 수분, 6. 단백질, 7. 지방, 8. 회분, 9. 탄수화물, 10. 당류, 11. 자당, 12. 포도당, 13. 칼슘, 15. 철, 16. 마그네슘, 17. 인, 18. 칼륨, 19. 나트륨,                     20. 아연 등 총 129가지 성분표를 농촌진흥청에서 발간하는 책자 기준 색인정보를 포함하여 제공하고 있음활용: 식품에 포함되어 있는 각종 영양소를 식품 가공에 활용, 개인 맞춤 제품 판매 및 가정 식단에 이용'
