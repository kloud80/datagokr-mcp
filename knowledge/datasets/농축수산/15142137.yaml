summary_user: 직매장·유기 및 일반 자재사·지역 농협·하나로마트·농업기술센터 등 농산업 관련 기관을 한 건씩 담은 전국 단위 목록으로, 기관명·구분코드·주소·전화번호·법정동코드를 담는다. 소비자가 집 근처 농산물 직매장이나 하나로마트를 찾거나, 분석가가 지역별 농업기술센터·자재사 분포를 파악하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으며, 법정동코드(BJDNGCD)나 기관명·주소를 이름·코드 매핑해 행정구역 자료와 붙여 쓰는 정도로만 연결된다.
description_portal: 이 데이터는 농림수산식품교육문화정보원에서 제공하는 농산업 관련 주요 기관의 위치 및 연락처 정보를 통합한 자료입니다. 직매장, 유기 및 일반 자재사, 지역 농협, 하나로마트, 농업기술센터 등의 정보가 포함되어 있으며, 농업 종사자뿐 아니라 일반 소비자에게도 실질적인 도움이 됩니다. 소비자는 인근의 농산물 구매처를 확인하거나, 농업 관련 서비스 기관에 대한 정보를 빠르게 파악할 수 있습니다. 또한, 농업 기술이나 유통망 접근성을 높이고자 하는 경우에도 유용하게 활용될 수 있습니다. 정책 수립, 유통경로 분석, 농업 인프라 현황 파악 등 다양한 방면에서 참고자료로 활용 가능합니다.
