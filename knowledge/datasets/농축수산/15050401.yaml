summary_user: 국립농산물품질관리원이 지정한 전국 농산물우수관리(GAP) 시설을 시설 한 곳당 한 행으로 담으며, 지정번호·관리시설명·운영구분·소재지·지정일자로 구성된다. GAP 인증을 받으려는 농가나 사업자가 '우리 지역 근처에 이용할 수 있는 GAP 시설이 어디 있나'를 찾거나, 분석가가 운영구분·지역·지정 시기별 등록 현황을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 시설명을 이름 매핑해 연결해야 한다.
description_portal: 국립농산물품질관리원에서 관리하는 농산물우수관리(GAP) 시설 정보로서, 지정번호, 관리시설명, 운영 구분, 소재지, 지정일자 항목으로 구성되어 있습니다. 운영구분별 농산물우수관리(GAP) 시설 등록현황, 소재지별 농산물우수관리(GAP) 시설 등록현황, 기간별 농산물우수관리(GAP) 시설 등록현황 등 통계자료를 작성하여 농산물우수관리(GAP) 시설 에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대되며, 농산물우수관리(GAP) 인증사업자는 농산물우수관리(GAP) 시설 이용이 필요한 경우 주변지역 시설정보 확인에 유용하게 이용될 것으로 기대됩니다.
