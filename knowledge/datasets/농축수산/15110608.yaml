description_portal: 본 데이터는 전라남도 나주시 16개 저수지의 수심을  격자(5m x 5m) 단위로 제공합니다. X좌표와 Y좌표는 EPSG:5186(중부원점(GRS80) )의 좌표입니다.격자별 위치정보와 수심값을 포함하고 있어 저수지의 수심 분포를 공간적으로 분석할 수 있다. 저수용량 산정, 가뭄 대응, 수위 변화 분석, 저수지 운영계획 수립 및 수리시설 유지관리에 활용할 수 있으며, 수심이 얕아진 구간이나 퇴적이 집중된 구간을 파악하는 데 유용하다. 또한 준설사업 대상지 검토, 농업용수 공급계획 수립, 재난대응 시뮬레이션, 수문학 연구 및 공간정보 기반 수자원 관리 정책 수립을 위한 기초자료로 활용 가능하다.*2022년 공공데이터 기업매칭 지원사업 결과물
