summary_user: 행정안전부 재난안전데이터 공유플랫폼에서 제공하는 전국 지역별 가축전염병(구제역, 돼지열병 등) 발생 정보를 담으며, 실측 컬럼은 동 코드·연도·통계값·단위명 중심이라 건별 위치보다 지역·연도 단위 집계값에 가까워 보인다. 방역 담당자나 축산 사업자, 분석가가 어느 지역에서 몇 년도에 가축전염병이 얼마나 발생했는지 확인할 때 쓴다. 전역 조인 키는 확인되지 않아 동 코드(DONG_CD)를 행정구역 이름·코드와 매핑해야 다른 지역 데이터와 이을 수 있고, 같은 기관 데이터와 연결할 때도 같은 방식이 필요하다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지역별 가축전염병(구제역, 돼지열병 등) 발생 위치정보입니다.
