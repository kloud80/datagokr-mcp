summary_user: 경기도 내 수산자원 보호구역을 구역별 한 행으로 담은 관리 현황 목록으로, 시군명·시군코드, 보호구역명, 보호구역 면적, 지정고시번호와 고시일자, 집계 기준일을 담는다. 정책 담당자나 해상풍력·개발 입지를 검토하는 분석가가 '이 시군에 수산자원 보호구역이 어디에 얼마만큼 지정돼 있고 언제 고시됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군코드(SIGUN_CD)나 시군명·보호구역명으로 같은 경기도 데이터와 이름·코드를 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 수산자원 보호구역의 관리 현황을 제공합니다. 데이터에는 시군명, 보호지역명, 지정고시번호, 보호지역면적 등의 정보가 포함되어 있으며, 경기도가 관할하는 상수원 보호구역, 하천 현황, 수산자원 보호구역, 토산어종 방류 내용 등을 관리하는 데 활용됩니다. 수산자원 보호구역은 어류와 수생 생태계의 보호 및 회복을 목적으로 설정되며, 수자원의 지속 가능한 이용과 환경보전에 중요한 역할을 합니다. 본 데이터를 통해 지역별 수산자원 보호체계 현황을 파악하고, 생태계 보호, 어족자원 관리, 환경영향평가, 수질관리 및 정책 수립 등에 활용할 수 있습니다. 데이터 이용 시 보호구역 면적 변화나 지정고시 변경 사항을 함께 검토하는 것이 필요합니다.
