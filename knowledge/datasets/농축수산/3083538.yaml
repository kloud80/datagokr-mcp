description_portal: '본 데이터는 제주특별자치도 제주시에서 산림정책의 일환으로 관리하고 있는 임야의 복구벌채 또는 일반벌채 허가 현황을 수록한 자료입니다. 산림자원의 지속 가능한 이용과 생태계 보전, 불법 벌채 방지 및 목재 자원 관리 강화를 위해 허가받은 벌채 행위에 대한 정보를 제공합니다. 허가 절차의 투명성 확보 및 산림영향평가 등 정책적 활용을 위한 기초자료입니다.주요 항목구분: 임복벌채(복구벌채) 또는 일반벌채 등 벌채의 구분접수일자: 벌채허가 신청이 접수된 날짜허가일자: 관할 행정기관에서 허가를 승인한 날짜벌채종별: 간벌, 전면벌채, 수확벌채 등 벌채의 방법 및 유형벌채용도: 목재 생산, 임도 개설, 전용 예정지 정리 등 벌채 목적활용 목적이 데이터는 산림의 계획적 이용과 훼손 최소화를 위한 행정 자료로 활용되며, 산림 훼손 예방, 목재 수급 현황 파악, 산림관리법 이행 점검, 산지 이용 사전 검토 등 다양한 정책 및 규제 업무에 사용됩니다. 또한 국유림·사유림 관리의 효율성과 산림자원의 장기적 보존을 위한 기반 정보로 제공되며, 제주시청에서 정기적으로 관리 및 갱신합니다.'
