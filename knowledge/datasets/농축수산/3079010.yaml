summary_user: 우리나라 농축산물을 HS 품목코드(HSK) 단위로 나눠 기본세율, 양허기준세율, 2015년 양허관세, 시장접근세율, 국제협력관세, 탄력관세, 개방 구분과 개방연도를 담은 전국 단위 품목별 관세율표입니다. 수입업자나 무역 연구자가 특정 농축산물을 들여올 때 어떤 세율이 적용되는지, 그 품목이 언제 시장 개방됐는지 확인하는 데 쓴다. 전역 조인 키는 없고 HS 품목코드(HSK)나 품명으로 무역통계 등과 이어 써야 하며, KAMIS·도매시장·KOSIS 품목코드와는 체계가 달라 따로 매핑해야 한다.
description_portal: 해당 데이터는 우리나라 농축산물의 WTO 양허관세율과 기본세율에 관한 정보를 제공하는 데이터로, 제공 항목에는 HS코드(HSK), 한글 품명, 영문 품명, 기본세율, 양허기준세율, 양허관세, 시장접근세율, 국제협력관세, 탄력관세, 개방구분, 개방연도 등이 포함되어 있습니다. 이를 통해 국내 농축산물의 관세 적용 현황과 WTO 협정에 따른 개방 조건을 명확히 파악할 수 있으며, 수입 개방에 따른 국내 산업 보호 정책과 국제 교역 질서를 동시에 분석할 수 있습니다. 또한 이 자료는 정책 입안자, 무역 관계자, 연구자들이 농축산물의 수입 조건과 시장 개방 수준을 종합적으로 이해하는 데 활용할 수 있으며, 향후 농축산업의 경쟁력 강화와 무역 협상 전략 수립에도 기초 자료로 제공될 수 있습니다.
