description_portal: 도심 속의 대표적인 녹지축의 역할을 하고 있는 가로수는 생태통로나 가로경관의 이미지 구축, 통행 안전성 확보, 도시환경 개선 등의 공익적인 역할을 수행하는 도시의 한 요소로서 작용하고 있다.또한 법적으로 도시숲등의조성및관리에관한법률 제2조에 도로법제10조에 따른 도로(고속국도를 제외한다) 등 대통령령으로 정하는 도로의 도로구역 안 또는 그 주변지역에 조성관리하는 수목을 말한다.광주광역시 자치구별(동구, 서구, 남구, 북구, 광산구) 가로수 현황 정보를 제공하는 것으로 수종별로는 은행나무, 느티나무, 이팝나무, 메타세쿼이아, 왕벚나무, 중국단풍나무, 기타로 구분하고 있다.
