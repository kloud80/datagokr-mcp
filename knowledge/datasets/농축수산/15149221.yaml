description_portal: 이 데이터는 해양수산부에서 어장환경모니터링정점에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 어장환경모니터링해역명, 연안명, 어장도분초위도, 어장도분초경도, 조사기관명, 어장조사년도, 어장위도, 어장경도, 공간정보 데이터로 구성되어 있습니다.본 데이터는 어장환경모니터링정점 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어장환경모니터링정점이란 어장과 주변 해역의 환경 상태를 정기적으로 조사하는 특정 조사 지점을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
