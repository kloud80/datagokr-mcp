summary_user: 경기도 사이버식물병원이 수집한 식물 병해충 이미지 파일마다 현장 촬영 원본 파일명(image_orgnl_nm)과 시스템이 부여한 고유 파일명을 한 행씩 담은 메타정보이며, 범위는 시도·비공간으로 표시된다. 사이버식물병원 이미지 자료를 다루는 개발자나 분석가가 '현장에서 올린 이 사진이 시스템에 어떤 이름으로 저장됐는가'를 확인하거나, 파일명 중복·이미지 호출 오류를 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 기관의 사이버식물병원 질병정보 데이터와는 파일명을 이름 매핑하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 사이버식물병원에서 수집한 식물 병해충 관련 이미지 파일에 대한 메타정보로, 각 이미지의 원본 파일명과 시스템 내에서 부여된 고유 파일명을 제공합니다. ‘이미지원본이름’은 현장에서 촬영된 이미지의 실제 파일명을, ‘이미지이름’은 고유 식별을 위해 내부 시스템에서 부여한 파일명을 의미합니다. 본 데이터는 이미지 자체의 내용 정보를 포함하지 않으므로 병해충 진단에 직접 활용되기보다는, 해당 이미지와 연계된 질병정보 데이터셋을 구성하거나 이미지 파일의 식별·분류 및 관리 체계를 정립하는 데 활용됩니다. 사이버식물병원에서 사용되는 이미지 자원의 정합성 유지, 파일 이름 중복 방지, 이미지 호출 오류 예방 등의 용도로 사용됩니다.
