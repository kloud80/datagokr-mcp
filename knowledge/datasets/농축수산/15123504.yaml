summary_user: 전국의 도시농업 텃밭 분양 정보를 텃밭 한 곳당 한 행으로 담은 CSV 파일로, 텃밭명·운영주체·유형·주소와 전체·분양 면적, 분양가격, 부대시설, 모집기간, 신청방법을 담는다. 텃밭을 분양받으려는 시민이 "우리 동네 근처에 지금 모집 중인 주말농장이 있고, 분양가와 면적은 얼마인가"를 찾을 때 쓴다. 전역 조인 키는 없으므로 주소를 행정구역이나 좌표로 바꿔 지역 단위 자료와 붙여 쓴다.
description_portal: 도시농업의 실천 및 도시농업 가치 확산을 유도하기 위한 데이터로 텃밭명, 운영주체, 유형, 주소, 면적 등의  도시농업을 체험, 도전할 수 있는 텃밭분양 정보를 제공합니다.
