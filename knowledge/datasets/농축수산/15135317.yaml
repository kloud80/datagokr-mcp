description_portal: 이 데이터는 해양수산부가 바다내비 단말기의 유지보수 관련 업무를 수행하는 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 2023년과 2024년 바다내비 단말기를 선박에 설치한 후 해당 선박에 대한 확인서 등록 이력과 반려된 건에 대한 세부 정보로 구성되어 있습니다.본 데이터는 선박의 바다내비 단말기 설치 현황을 모니터링하거나, 유지보수 업무의 효율성 분석 및 선박별 유지보수 이력관리, 등록 및 반려 사례 파악을 통한 행정 프로세스 개선 등 현장 관리와 데이터 기반 정책 추진에 활용될 수 있습니다.
