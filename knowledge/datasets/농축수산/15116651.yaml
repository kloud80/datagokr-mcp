summary_user: 한국농어촌공사 농지연금 가입자를 2011년부터 연도별로 60세부터 90세 이상까지 7개 연령구간으로 나눠 가입자 수를 집계한 전국 단위 통계 파일(csv)이다. 농지연금 정책을 분석하거나 노후 대비를 고민하는 농업인이 '농지연금에 주로 몇 세에 가입하고, 연령대별 가입 추세가 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 연도(구분) 값을 기준으로 같은 기관의 다른 농지연금 통계와 맞춰 보는 식으로만 연결한다.
description_portal: '- 한국농어촌공사 농지연금사업은 농업인이 소유한 농지를 담보로 노후생활안정자금을 매월 연금방식으로 지급하여 농업인의 노후생활안정을 지원하는 사업입니다.- 한국농어촌공사 농지연금사업은 농업인이 소유한 농지를 담보로  가입방식에 따라 최대 300만원까지 월 지급금이 계산됩니다.- 한국농어촌공사 농지연금사업은 신청연도 말일 기준으로 신청인 만60세 이상 가입 가능하며,- 본 개방데이터는 한국농어촌공사 농지연금사업 가입자의 연령대를 구분하여 2011년부터 현재까지 해당 구간에 가입한 고객수를 통계낸 자료로 60세부터 90세이상까지 7개구간으로 구분된 가입자수를 제공합니다.'
