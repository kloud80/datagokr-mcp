summary_user: 산림자원통합관리시스템에서 조사한 임산물 시가를 조사년월·법정동(읍면동)·수종·품등별로 한 건씩 담은 전국 범위 파일(CSV 약 25만 바이트)이다. 임산물 생산자나 유통업자, 산림자원 가치를 평가하는 분석가가 "우리 지역에서 특정 수종의 품등별 시가가 얼마였고 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법정동명이나 수종명 같은 이름을 맞춰 붙이거나 같은 산림청 데이터의 코드로만 연결한다.
description_portal: 임산물의 시가를 조사하여 연도 및 지역별로 제공하는 데이터입니다. 시가조사년월, 시가번호, 주민법정동명, 시가수종명, 품등, 임산물 시가 등 다양한 정보를 포함하고 있으며, 산림자원통합관리시스템을 활용하여 임산물의 시장 가격 변동을 체계적으로 관리하실 수 있습니다. 이를 통해 임산물 유통 현황 파악, 가격 정책 수립, 산림자원 가치 평가, 지역경제 분석 등에 활용하실 수 있으며, 데이터는 정기적으로 갱신되어 최신 시가 정보를 반영합니다. 또한 행정기관과 연구기관에서 신뢰성 있는 근거 자료로 활용하실 수 있어 정책 결정과 성과 평가 과정에서도 중요한 역할을 합니다.
