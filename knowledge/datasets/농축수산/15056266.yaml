description_portal: '본 데이터는 제주특별자치도 제주시 관내에서 산지를 전용하거나 일시 사용하기 위해 지정된 산지 이용 건수 및 면적에 대한 연도별 현황을 수록한 자료입니다. 산지의 체계적인 이용과 보전을 목적으로 수집되며, 산림 훼손 방지와 환경영향 최소화를 위한 행정계획 수립에 활용됩니다.주요 항목해당연도: 산지 이용 지정이 집계된 기준 연도건수: 해당 연도에 산지 이용으로 지정된 승인 또는 허가 건수면적(ha): 이용이 승인된 산지의 총 면적(단위: 헥타르)활용 목적이 데이터는 산지 전용 수요 분석, 난개발 방지 대책 수립, 친환경 산지 이용 계획 수립, 환경영향평가 및 산림정책 조정 등의 행정업무에 활용됩니다. 특히 토지이용 변화, 개발행위 허가 추이, 지역별 산지 전용 집중도 등을 파악하는 데 중요한 기초자료로 제공되며, 제주시청에서 연 1회 이상 정기적으로 집계·관리합니다.'
