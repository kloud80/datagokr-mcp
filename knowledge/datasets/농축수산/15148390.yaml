summary_user: 농업법인관리 사업에서 실태조사 대상으로 선정된 농업법인별로 선정년도·조사상태와, 위반이 확인된 경우 위반사유·후속조치·행정처분 진행상황과 결과를 위반 건 단위로 담은 전국 범위의 CSV 파일(약 38KB)이다. 정책 분석가나 연구자가 '농업법인 실태조사에서 어떤 위반사유가 많고, 위반 후 해산명령 등 후속조치와 행정처분이 실제로 얼마나 이어졌는가'를 살펴보는 데 쓴다. 법인은 내부 관리번호(법인관리일련번호)로만 식별되고 사업자번호 같은 전역 조인 키가 없어, 다른 농업경영체·법인 데이터와는 이름·코드 매핑이나 같은 기관 자료 안에서만 연결된다.
limits: 법인명·사업자번호 등 식별 정보가 없어 특정 법인을 찾거나 외부 법인 등록 데이터와 직접 조인할 수 없다. 범위는 전국이며 지역(행정단위) 구분이 없어 시군별 분석에는 쓰기 어렵다.
