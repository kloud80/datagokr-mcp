summary_user: 전국 32개 공영도매시장(서울 가락·부산 반여·광주 서부 등)에서 경매로 거래된 농산물의 낙찰 총금액과 총물량을 경매일자·도매시장·품목별로 집계해 담은 파일 데이터로, 포털에서 zip(약 19.5MB)으로 받는다. 식자재 구매자나 유통업자, 물가 분석가가 "특정 품목의 도매시장별 일별 경락 물량과 금액이 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 없어 도매시장코드·품목코드나 품목명을 매핑해 다른 데이터와 잇고, 품목코드는 KAMIS·HS·KOSIS 체계와 달라 대응표가 필요하다.
description_portal: 서울 가락, 부산 반여, 광주 서부 도매시장 등 전국 32개 공영도매시장에서 거래되는 일자별 품목/포장형태별 거래금액, 거래량 자료입니다.전국 도매시장의 일자별 품목/포장형태에 따른 경매 낙찰 금액과 물량을 확인할 수 있습니다.공영도매시장지방자치단체가 농수산물의 도매거래를 위해 중앙 및 지방정부의 공공투자에 의해 도시 지역에 개설한 시장임공영도매시장은 1976년 12월 농안법이 제정된후 농수산물 유통의 원활화 및 적정가격유지를 위해 정부와 지방자치단체가 투자하여 도매시장을 건설·운영함농안법에 근거하여 수집되는 데이터입니다.농안법이란 농수산물 유통 및 가격 안정에 관한 법률의 약칭으로 정부가 농수산물 도매시장의 왜곡된 거래관행을 바로 잡아 가격 안정을 도모하기 위해 마련한 법률이다.농수산물의 원활한 유통과 적정한 가격을 유지하게 함으로써 생산자와 소비자의 이익을 보호하고 국민생활의 안정에 이바지함을 목적으로 한다.
