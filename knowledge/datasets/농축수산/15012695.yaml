description_portal: 식물 신품종 육성자의 권리를 부여하기 위하여 품종보호제도를 운영하고 있으며, 신품종을 출원한 품종에 대한 서류심사, 재배심사, 종합심사 등을 거쳐 신품종을 등록하고 있다.조사기준일까지 해외 육성자가 육성한  신품종이 우리나라에 품종보호 출원되어 등록된 품종수를 작물(식물)별로 연도별로 정리한 내역이다.연도별로 수치화되어 있어 최근 해외에서 유행하는 신품종 육종 트렌드를 파악할 수 있어, 신품종 육성가 등에게 유용한 자료이다.국립종자원에 출원한 농업종자 품종으로 산림종자, 수산식물종자는 제외한 자료이다.
