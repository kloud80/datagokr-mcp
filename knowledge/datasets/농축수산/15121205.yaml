summary_user: 산불상황관제시스템에 기록된 산불 건별로 신고일, 발생 주소, 진화 시작·완료 시각, 관할기관, 상황 알림 문자 발송 여부, 해당 지역 일출·일몰 시각을 담은 전국 단위 원천 기록 파일(CSV)이다. 연구자나 지자체 담당자가 "산불 신고부터 진화 완료까지 얼마나 걸렸고, 일몰 이후로 넘어간 진화는 얼마나 되나" 같은 대응 시간 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발생 주소(행정구역명)나 관할기관명을 이름으로 맞춰 이어 써야 하며, 산불정보아이디는 같은 기관의 다른 산불 데이터와 연결할 때만 쓸 수 있다.
description_portal: '1.산불 상태별 정보 개요산불이 발생하면 시간대별 상황 변화와 대응 과정을 정확히 기록하는 것이 중요합니다.산불상황관제시스템에서는 산불의 발생부터 진화 완료까지의 주요 단계별 시간 정보와 담당 기관 정보를 체계적으로 관리합니다.이 정보는 산불 대응의 효율성을 높이고, 사후 원인 분석 및 대응 평가에도 활용됩니다.2. 관리 목적상황 변화 추적: 산불 발생부터 진화 완료까지의 시간 흐름을 단계별로 확인대응 현황 파악: 각 시점에 어떤 기관이 대응했는지를 명확히 구분정보 공유 및 분석: 관계 기관 간 신속한 정보 공유와 사후 대응력 강화3. 제공되는 정보시스템에서는 다음과 같은 항목을 제공합니다.산불발생일: 산불이 실제로 발생한 날짜산불발생주소: 산불이 난 지역의 위치 정보진화시작시간: 불을 끄기 시작한 시각진화완료시간: 산불이 완전히 진화된 시각담당기관명: 해당 산불을 담당한 기관명문자전송여부: 상황 알림 문자가 발송되었는지 여부일출시간 / 일몰시간: 해당 지역의 일출 및 일몰 시각이를 통해 산불 진행 상황과 대응 과정의 시간대별 흐름을 명확히 파악할 수 있으며,사후 분석 및 대응 체계 개선 자료로도 활용할 수 있습니다.'
