summary_user: 경기도 내 단미사료 제조업체의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·WGS84 좌표·소재지면적·종업원수를 포함한다. 축산 농가나 사료 업계 분석가가 "우리 시군에서 지금 영업 중인 단미사료 제조업체는 어디이며 규모는 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시군 코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 경기도의 다른 사료 업체 현황(보조·배합사료 등)과 이름 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 내 단미사료 제조업체의 인허가 현황을 제공합니다. 단미사료는 식물성·동물성 또는 광물성 물질로, 가축에게 직접 급여하거나 배합사료의 원료로 사용되는 사료를 의미합니다. 주요 제공 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘우편번호’, ‘WGS84 위도·경도’, ‘소재지면적’, ‘총종업원수’, ‘축산물가공업구분명’, ‘축산업무구분명’ 등이 포함됩니다. 이를 통해 단미사료 제조업체의 위치, 운영 상태, 시설 규모, 인력 현황 등을 상세히 확인할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 축산업 현황 분석, 가축 영양 관리, 사료산업 정책 수립, 지역별 원료사료 공급 체계 파악 등에 활용할 수 있습니다. 또한 보조사료, 배합사료, 수입사료와의 연계 분석을 통해 국내 사료산업의 구조와 공급망을 종합적으로 이해하는 데 기여할 수 있습니다.
