description_portal: 한국수목원정원관리원은 국립세종수목원의 주요 시설 현황과 에너지 사용 정보를 통합한 시설정보 데이터를 개방형으로 제공하고 있습니다.해당 데이터는 수목원 내 주요 시설에 대한 면적 정보와 함께, 태양광 발전량 및 지역난방 사용량 등 에너지 관리 항목이 포함되어 있습니다. 구체적으로는 건물별 옥상 면적, 전체 주차장 면적, 연구동 및 고객주차장 태양광 발전량(2022~2023년), 지역난방 월별 사용량(2022~2023년) 등의 항목으로 구성되어 있으며, 시설 운영 현황 및 에너지 흐름을 정량적으로 파악할 수 있도록 설계되었습니다.데이터는 CSV 형식으로 제공되며, 항목별 측정 단위와 시계열 정보가 포함된 구조입니다.각 항목은 건물명 또는 공간명, 옥상 면적(㎡), 주차장 면적(㎡), 태양광 발전량(kWh), 지역난방 사용량(MWh), 측정연도, 월 등으로 구성되며, 시설별 에너지 흐름과 공간 활용 현황을 월별 단위로 비교 분석할 수 있습니다. 이를 통해 공간 효율성 분석, 에너지 자립률 추이, 시설별 에너지 기여도 등을 객관적으로 파악할 수 있습니다.본 데이터는 공공기관 시설관리, 에너지 모니터링, 공간계획 수립 등 다양한 분야에서 활용됩니다.공공기관은 건물 면적 대비 에너지 생산·소비 비율 분석, 태양광 시설 효과 검토, 난방 수요 예측 등에 활용할 수 있으며, 연구기관은 기후적응형 수목원 운영 및 스마트 그린 인프라 연구의 기반자료로 활용할 수 있습니다.
