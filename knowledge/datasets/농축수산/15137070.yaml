description_portal: 농림수산식품교육문화정보원은 농업 정보 플랫폼 ‘농업ON’을 통해 주요 농산물의 경락가격 변동 정보를 제공하고 있습니다. 본 데이터는 농식품지식정보서비스의 품목별 가격 추이 조회를 위한 기초 자료이며, 기준연월, 대분류명, 중분류명으로 구성되어 있습니다. 이 데이터는 각 품목의 월별 가격 정보를 연계하기 위한 기준 정보로, 품목별 경락가격 변동 흐름, 계절별 수급 상황, 시장 수요 구조를 파악하는 데 활용됩니다. 또한 품목군 단위로 유통 전략을 수립하거나, 정책 수립 및 수급 예측 모델 구축 시 기준 항목으로 쓰이며, 농산물 가격 정보 서비스 운영 및 시각화 콘텐츠 기획의 기반 자료로도 이용될 수 있습니다. 공공데이터포털을 통해 개방되며, 연도·월 단위의 시계열 분석 구조로 연계가 용이합니다.
