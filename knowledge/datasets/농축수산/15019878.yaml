description_portal: 농어촌민박은 농어촌지역 또는 준농어촌지역에 실제 거주하는 주민이 자신의 주택을 활용하여 운영하는 숙박 형태로, 지역 주민 소득 증대와 농어촌 관광 활성화를 목적으로 한다. 연면적 230㎡ 미만의 단독주택 1개 동을 활용해야 하며, 숙박시설로 운영하기 위해서는 관할 시장·군수에게 신고 절차를 거쳐야 한다. 이러한 농어촌민박 운영기준은 농어촌 주거환경을 해치지 않으면서도 안전하고 합법적인 숙박서비스 제공을 보장하기 위한 제도로, 지역 관광객 수용 능력 향상, 농촌체험과 연계한 프로그램 운영, 지역경제 활성화에 기여한다. 공공데이터로 제공되는 농어촌민박 운영현황은 위치, 시설 규모, 운영자 정보 등을 확인해 농어촌관광 정책 수립 및 시설 관리에 활용할 수 있는 기반자료가 된다.
