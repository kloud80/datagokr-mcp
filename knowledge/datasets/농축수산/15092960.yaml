description_portal: '강원특별자치도 강릉시 관내에서 발생한 가축전염병 내역을 정리한 데이터로, 행정구역·농장 위치·축종·감염두수·진단일자 등을 함께 제공하여 지역별 가축전염병 발생 상황과 피해 규모를 한눈에 파악할 수 있도록 구성된 자료입니다. 개별 발생 건 단위로 정리되어 있어 시기별·공간별 질병 확산 양상과 방역 필요 지점을 분석하는 데 활용할 수 있습니다.행정구역명: 가축전염병이 발생한 농장이 속한 행정구역 명칭(읍·면·동 포함 가능)가축전염병명: 구제역, 고병원성 AI, 돼지열병 등 발생한 가축전염병의 병명농장소재지: 전염병이 발생한 축산농장의 지번 또는 도로명 주소 등 위치 정보축종명: 질병이 발생한 가축의 축종(예: 소, 돼지, 닭, 오리 등)감염두수: 해당 발생 건에서 전염병에 감염된 가축의 마릿수(두수 기준)진단일자: 가축전염병이 공식적으로 진단·확정된 일자(YYYY-MM-DD 형식)데이터기준일자: 수록된 발생 내역이 취합·검증되어 확정된 기준 일자(YYYY-MM-DD 형식)이 데이터는 가축전염병의 발생 시기·지역·축종·피해 규모를 체계적으로 파악할 수 있어, 가축 방역 정책 수립, 고위험 지역 선제 관리, 백신·소독 등 방역 자원 배분 계획, 역학조사 및 질병 확산 경로 분석, 축산 농가 지원대책 마련 등 가축 방역 및 축산 정책 전반에 활용할 수 있는 기초 통계자료입니다.'
