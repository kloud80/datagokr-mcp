description_portal: '- 전라남도 시군에 위치한 여성농업인센터 현황 (센터명, 사업내용, 소재지 등)에 관한 데이터를 조회하실 수 있습니다.- 여성농업인센터는 여성 농업인의 영농 활동, 복지, 교육, 문화 활동을 지원하는 전국 단위 지역 센터입니다. 전남에선 총 4개 센터가 운영되며, 나주·고흥·무안·장성 등에 위치합니다.- 이 기관들은 농촌 복지, 상담, 자녀 돌봄, 문화강좌, 교육 등을 통해 여성농업인의 역량 강화와 삶의 질 향상을 목표로 합니다.- 목적 : 여성농업인 영농·복지·역량 지원- 전남  내 : 나주·고흥·무안·장성 4개 센터- 주요 프로그램 : 농촌 교육, 돌봄, 문화·교육 강좌, 봉사 등'
