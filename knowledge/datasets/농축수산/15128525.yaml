description_portal: 이 데이터는 항만기술기준 정보시스템 내에서 항만 및 어항과 관련된 신기술 정보를 각 기관과 관련 종사자에게 안내하는 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부가 관리하는 항만 및 어항 관련 기술 기준과 신기술의 홍보 내역, 그리고 시스템의 신기술 홍보 게시판 글 제목 및 내용으로 구성되어 있습니다.  본 데이터는 항만 및 어항 설계·운영을 담당하는 전문기관이나, 신기술 개발을 담당하는 연구기관 및 민간기업이 항만기술기준에 명시된 신기술의 적용 가능성과 제도 내 활용 실적 등을 검토할 때 참고 자료로 활용될 수 있습니다. 또한 해양수산부 관련 정책 개발 및 신기술 보급 전략 수립 과정에서 기준 정합성 확인, 신기술 도입 정책 방안 모색 등의 업무에 사용할 수 있습니다.
