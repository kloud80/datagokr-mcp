description_portal: '- 전라남도 귀농종합센터 홈페이지의 현장 및 온라인 교육에 대한 정보(교육기관명, 교육명, 시작일 및 종료일 등)를 조회하실 수 있습니다.- 전라남도 귀농귀촌 종합지원센터는 귀농·귀촌을 희망하는 분들에게 다양한 지원과 정보를 제공하는 기관입니다. 이 센터는 전라남도의 농업기술원과 협력하여 도내 농업의 활성화와 지속 가능한 발전을 목표로 다양한 프로그램과 서비스를 운영하고 있습니다.- 귀농·귀촌을 고려하시는 분들께 전라남도 귀농귀촌 종합지원센터는 다양한 정보와 지원을 통해 안정적인 정착을 돕고 있습니다. 관심 있는 분들은 홈페이지를 통해 자세한 정보를 확인하시고, 필요한 지원을 받으시기 바랍니다.'
