description_portal: '- 한국농어촌공사 과원규모화 통계자료 입니다.- 과원영농규모화사업이란 과수 전업농의 영농 규모를 확대하고 지원하기 위한 사업으로- 과수 전업농 육성 대상자의 영농 규모 확대를 지원하기 위한 사업입니다.- 사업은 과원매매, 과원임대차로 구성되어 있으며- 본 데이터는 과원규모화 매도 및 임대에 관한 통계자료로 사업별, 지역별(도) 계약건수, 면적(헥타르ha), 금액(백만원)의 년도별 통계자료를 제공하고 있습니다.- 해당 데이터는 지역 특성에 맞는 맞춤형 정책을 개발하거나, 지역별 과수 농가의 규모화 추세를 파악하는 등 농업 구조 개선 분석 등에 활용 가능합니다.'
