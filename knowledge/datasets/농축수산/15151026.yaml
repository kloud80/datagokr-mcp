description_portal: 농림축산식품부에서는 조사료 유통업체 현황 정보를 제공합니다.본 정보 제공 데이터는 사업년도, 유통업체일련번호, 관할기관, 관할하부기관, 법인명, 설립일자, 유통업체분류등의 정보를 포함하고 있습니다.본 제공자료는 조사료생산기반확충사업에 대한 정보를 보여주는 데이터 입니다.2022년부터 2025년까지 조사료 유통업체 현황으로, 관할기관 및 하부기관, 설립일자, 유통업체분류 정보를 활용 할 수 있습니다.동일 유통업체일련번호로 업체 식별이 가능합니다.법인명은 민감정보로 마스킹 처리하였습니다. 활용에 참고바랍니다.
