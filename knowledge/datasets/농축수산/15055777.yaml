description_portal: 이 데이터는 전북특별자치도 내 각 시군별로 사육되고 있는 가축 및 특수 동물의 사육 규모를 세부적으로 정리한 자료입니다. 각 시군을 기준으로 한육우, 젖소, 돼지, 닭, 오리, 염소, 면양, 사슴, 토끼, 개 등 주요 가축뿐 아니라 꿀벌, 메추리, 칠면조, 타조, 오소리, 꿩, 기러기, 지렁이 등 다양한 특수 사육 동물에 대해서도 사육 농가 수(호 수)와 총 사육 개체 수(두 수, 수수, 군수 등)를 함께 제공합니다. 해당 데이터는 축산업 분포 현황, 지역별 축산업 규모, 가축 방역 정책 수립, 사육 환경 개선, 지역 농업 지원 정책 마련 등에 활용될 수 있으며, 농업경제 및 동물자원 정책 수립에 있어 중요한 기초자료 역할을 합니다.
