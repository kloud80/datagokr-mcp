description_portal: 농림축산식품부에서는 가공내역정보를 제공합니다.본 정보 제공 데이터는 경영체일련번호, 경영체명, 주품목명, 판매금액, 가공품목순번등의 정보를 포함하고 있습니다.본 제공자료는 경영체별로 가공하는 주품목명과 판매금액에 대한 정보를 보여주는 데이터 입니다.경영체일련번호는 마스킹처리한 경영체명에 대하여 식별이 가능하도록 순차채번을 적용하였으며, 동일 경영체인경우 같은 경영체일련번호로 식별이 가능합니다.동일 주품목명이라 하더라도 경영체에 따라 판매금액이 상이 할 수 있으며, 경영체에서 가공하는 주 품목에 대한 정보를 취득할 수 있습니다.판매금액 정보는 경영체에서 직접 입력한 정보이므로 데이터에 대한 정확성 검토는 별도로 시행하지 않았으므로 참고자료로만 활용하시기 바랍니다.
