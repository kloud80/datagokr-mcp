description_portal: '경기도 고양시 펠릿보일러설치현황 데이터는 연번, 시군, 설치자, 설치장소, 정부보조금, 자부담, 총사업비, 사업완료일, 제작업체, 모델명, 제품규격(kW), 설치업체 명, 대표자, 연락처, 주소 등의 항목을 제공합니다. 펠릿보일러 및 난로 설치사업은 산림바이오매스 신재생에너지 이용 활성화를 목적으로 추진하는 사업입니다.※ 참고 : 2016 ~ 2023년 목재펠릿보일러 설치 없음.※ 펠릿보일러 및 난로 : 건조된 톱밥을 압축하거나 톱밥처럼 나무를 작게 분쇄한 뒤에 작은 원통 모양으로 만든 것을 연료로 사용하는 보일러 혹은 난로.'
