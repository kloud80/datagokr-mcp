description_portal: 이 데이터는 해양수산부에서 연안 침식에 영향을 미치는 바람의 특성 정보를 조사, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 바람 측정위치, 측정일자, 최대풍속, 최대풍향, 순간최대측정풍속, 평균풍속 등 바람의 정보로 구성되어 있습니다.  본 데이터는 해안가 토지 이용 계획 수립 시 연안 침식 위험 지역의 기준자료로 활용될 수 있으며, 연안 침식 저감 대책 마련, 풍속 및 풍향 등 기상 조건 분석을 통한 연안 시설물 설계, 해안재해 예측 연구 자료 등 활동을 위한 기초 자료로 활용될 수 있습니다.
