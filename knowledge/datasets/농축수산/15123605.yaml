summary_user: 전국 17개 시도별로 등록된 목재생산업(원목생산업·제재업·목재수입유통업 등)의 등록 현황을 시도를 열로 펼친 집계표로 담으며, 포털 설명상 2022년 말 기준이고 파일 크기는 522바이트의 작은 표다. 목재산업 정책 담당자나 업계 분석가가 '어느 시도에 제재업 등 목재생산업체가 많이 몰려 있는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 시도 이름을 행정구역 코드와 직접 매핑해야 다른 시도별 임산물·산림 통계와 이을 수 있다.
description_portal: 2022년 말 기준 전국 17개 시도에 등록된 목재생산업의 현황을 지역별로 제공합니다. 원목생산업, 제재업, 목재수입유통업 등 다양한 목재생산업의 등록 현황을 한눈에 파악할 수 있으며, 각 시도별 산업 분포와 규모를 비교 분석할 수 있습니다. 데이터는 목재산업 정책 수립, 지역별 산업 지원, 시장 동향 분석, 산업 육성 전략 마련 등에 활용됩니다. 전국 단위의 목재생산업 등록 현황을 체계적으로 제공하여 관련 기관 및 업계의 의사결정에 도움을 줍니다. 이 데이터는 정기적으로 갱신되며 최신성을 유지합니다.
