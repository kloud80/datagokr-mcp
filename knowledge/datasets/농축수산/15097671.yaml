description_portal: 데이터는 경기도 화성시 관내 스마트팜 중 포도 재배 농장을 대상으로 수집한 개화기(2020년 4월~6월) 온도 정보를 포함한다. 각 농장별로 측정된 개화기 온도는 품종별 생육 환경 분석, 스마트팜 기술 적용 효과 검토 및 작황 예측 등의 기초자료로 활용될 수 있다. 개화기 온도는 작물 생장에 직접적인 영향을 미치는 주요 요소로, 재배 시기 조절 및 병해 예방 등 정밀농업 실현을 위한 기반자료로 중요하다. 데이터는 농장 단위로 구분되며, 기간 내 일별 온도 측정값이 포함되어 있다. 자료는 농업기술연구, 스마트팜 정책 수립, 민간 활용 등 다양한 분야에서의 활용이 가능하다. 단일 수집으로 제공되며 향후 업데이트는 계획되어 있지 않다.
