description_portal: 본 데이터는 경상남도 의령군 관내 양돈농가 현황을 제공합니다. 데이터는 사업장명, 축종, 읍면, 사육두수, 처리방법, 처리구분, 데이터기준일자로 구성되어 있습니다. 본 데이터는 농가 위치와 사육 규모, 분뇨 처리 방식을 활용할 수 있도록 정리되어 있으며, 이용자는 이를 통해 농가별 규모 파악, 축산업 현황 파악, 환경관리, 처리시설 관리 계획 등에 활용됩니다. 행정기관은 이를 통해 오염 예방과 축산환경 개선 정책 수립에 참고할 수 있습니다. 농가는 적정 사육과 처리 체계 유지에 활용할 수 있습니다. 주소 정보는 지도 서비스와 연계해 시각화할 수 있어 현장 점검과 안내 자료에 유용합니다. 본 데이터는 공공데이터포털에서 누구나 활용할 수 있도록 제공됩니다.
