summary_user: 한국수목원정원관리원 시드뱅크에 입고된 종자 자원을 건별로 담으며, 뱅크번호·도입번호, 학명·국명, 도입 당시 학명·국명, 도입국가, 입고일자, 저장형태, 적재일시를 수록한다. 연구자나 생물산업 종사자가 특정 식물 종의 종자가 시드뱅크에 언제 어느 나라에서 들어와 어떤 형태로 보관되고 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 학명(scnm)이나 국명 같은 이름 매핑으로만 연결한다.
limits: 표준 식별 코드가 없어 다른 기관 데이터와 직접 조인할 수 없고 학명·국명 문자열 매칭에 의존해야 한다. 위치 좌표가 없는 전국 단위 비공간 데이터라 지역별 분석에는 쓸 수 없으며, 개발계정은 일 10,000회 호출로 제한된다.
