description_portal: 본 데이터는 국내외 생물유전자원의 안전한 장기 보전과 관련 연구 인프라 조성을 목적으로 한국수목원정원관리원 시드뱅크에 입고되어 관리되는 종자 자원 전체의 이력과 보관 환경을 제공하는 정보입니다. 뱅크번호와 도입번호 같은 고유 식별자와 학명 및 국명 중심의 종 분류 체계를 구성하고, 도입국가명과 입고일자 및 저장형태명과 적재일시 등의 실물 물류 관리 정보를 체계적으로 수록했습니다. 국가 유전자원의 관리 투명성을 확보하고 학술 연구 및 생물 산업 전반에 신뢰성 높은 기초 자료로 활용됩니다.
