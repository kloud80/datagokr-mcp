summary_user: 전국의 축산업 허가·등록 농가를 건별로 담은 파일로, 농가마다 등록 시도·시군구, 축산업 종류(종축업·부화업·정액등처리업·가축사육업), 축종, 허가/등록 구분과 날짜, 영업상태, 폐업일자, 대표자 성별을 기록한다. 지자체 담당자나 연구자가 '우리 시군구에 정상 영업 중인 돼지 사육 농가가 몇 곳이고 최근 몇 년 사이 폐업이 얼마나 늘었나' 같은 지역별 축산업 현황과 방역 대상 규모를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 축종 이름을 맞춰 연결해야 하며, 농산물 유통 가격(KAMIS 등)과 엮으려면 품목코드 매핑을 따로 해야 한다.
description_portal: 헤당 데이터는 전국의 축산업 허가받거나 등록한 개별 축산 농가 현황에 대한 정보로, 주요 항목으로는 축산업, 종축업, 부화업, 정액등처리업, 가축사육업 등이 포함되어 있습니다. 이 자료는 축산업 관리체계를 확립하고, 지역별 산업 특화 전략을 마련하는 데 활용될 뿐만 아니라, 가축 질병 방역 및 안전 관리 정책 수립에도 중요한 기초자료가 됩니다. 또한 정책 담당자에게는 축산업 경쟁력 강화와 지속 가능한 발전을 위한 정책 설계의 근거 자료로 제공되며, 지자체와 농가에는 맞춤형 지원 방안 수립에 도움을 줍니다. 나아가 연구자와 산업 관계자에게는 축산업 현황 분석, 성장 가능성 평가, 산업별 위험 요소 파악 등 다양한 연구와 전략 마련에 활용될 수 있어, 축산업 발전과 농가 경영 안정, 국가 차원의 식량안보 강화에 기여하는 의미 있는 자료라 할 수 있습니다.
