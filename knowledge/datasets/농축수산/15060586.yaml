description_portal: 본 데이터는 경기도 광주시청에서 관리하는 반려동물 등록현황 자료입니다. 주요 제공 항목은 기준년도, 시군명, 읍면동명, 등록동물수, 등록주체(시군구, 대행업체, 기타), RFID종류(내장형, 외장형, 인식표), 등록품종수, 등록소유자수, 동물소유자당 등록동물수, 해당동의등록대행업체수, 데이터기준일자 등으로 구성되어 있습니다. 해당 데이터는 연도별 및 읍면동별 반려동물 등록 실태와 다양한 등록 유형을 파악할 수 있도록 지원합니다. 등록주체별 건수 구분과 RFID 유형별 현황을 제공함으로써 지역 내 반려동물 보호·관리 정책 수립, 동물등록제도 운영 평가, 동물 유실 및 유기 방지 대책 마련 등 행정 업무의 투명성 제고에 활용됩니다.
