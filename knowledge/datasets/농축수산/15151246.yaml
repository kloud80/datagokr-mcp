summary_user: 시중에 유통되는 농약을 품목 한 건씩 정리한 원천 목록 파일로, 농약회사명, 농약코드, 상표명·상품명, 성분 등 상세정보, 입제·액제 같은 제형, 안전사용 정보를 담고 전국 범위의 비공간 자료다(CSV 약 3.9MB). 농업인이나 농자재 판매자가 "이 상품명 농약의 성분과 제형, 안전사용 기준이 무엇인가"를 확인하거나, 연구자가 회사별·제형별 농약 구성을 살펴볼 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 농약코드나 상품명·회사명으로 매핑하거나 같은 기관의 코드 체계를 통해서만 이어 쓴다.
description_portal: 이 데이터는 농자재로 활용되는 다양한 농약의 세부 정보를 체계적으로 정리한 자료입니다. 주요 항목에는 농약회사 식별번호, 회사명, 농약코드, 상품명, 성분 정보, 안전사용 기준, 입제·액제 등 제형 구분이 포함됩니다. 이를 통해 현장에서 사용되는 농약의 종류와 특성을 파악할 수 있으며, 안전사용지침 이행, 작물 보호제 연구, 정책 수립과 교육 자료 개발에 활용될 수 있습니다. 또한 데이터 간 연계가 가능하도록 코드 기반으로 구성되어 있어 연구·분석의 신뢰성을 높입니다. 항목별 정의와 세부 설명은 매뉴얼에서 확인 가능합니다.
