description_portal: 2010년부터 2021년까지 전국 각 지역에서 발생한 산림분야 산업재해 현황을 연도별, 지역별로 집계한 데이터이다. 서울, 부산, 대구 등 17개 시도별로 산업재해 발생 건수와 요양기간을 포함하고 있어, 지역별 재해 발생 패턴 분석 및 지역 특성에 맞는 안전대책 수립에 유용하다. 산업재해 추이 분석, 산림사업 종사자 안전관리, 지역별 위험요인 비교, 정책 평가 및 개선, 재해 예방 교육 자료 등 다양한 목적으로 활용할 수 있다. 정기적으로 갱신되어 최신 동향 파악과 연구, 행정 실무에 폭넓게 적용 가능하다.
