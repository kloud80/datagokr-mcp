summary_user: 한국농어촌공사가 관리하는 전국 방조제의 시설 제원을 시설 한 곳당 한 행으로 담은 원천 목록으로, 표준시설코드·시설명·소재지·착공·준공년도와 제체 길이·높이, 유역·만수·수혜면적, 저수량, 만조위·포용조수량 같은 수치를 담는다. 농업기반시설 담당자나 연안 재해 분석가가 '우리 지역 해안에 있는 방조제는 언제 지어졌고 제체 높이와 보호하는 농경지(수혜면적)는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 다른 농업기반시설 제원 데이터와는 표준코드(표준코드)로, 그 밖의 데이터와는 소재지 주소나 시설명 매칭으로만 잇는다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 방조제에 대한 데이터입니다.- 방조제란 농업생산기반시설의 일종으로 홍수나 해일 등으로부터 농경지를 보호하기 위해 세운 구조물입니다.- 주로 하천이나 해안에 위치하며, 물의 흐름을 조절하고 안전하게 지키는 역할을 하고 있습니다.- 본 데이터는 방조제에 대한 기본정보(표준시설코드,시설명,소재지,착공년도,준공년도,종별,구분,유역면적,홍수면적,만수면적,수혜면적 등)를 제공합니다.<단위>면적 : ha한발빈도 : 년제체길이: m제체높이: m총저수량: 천톤유효저수량: 천톤사수량: 천톤만조위: EL.M포용조수량: 천톤대안거리: km홍수위/사수위/만수위: EL.m- 해당 데이터는 수자원 관리, 홍수 예방 및 대응 안전 점검 등 다양한 분야에서 활용 가능합니다.'
