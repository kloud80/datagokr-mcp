description_portal: 'O 공공데이터 설명 대상작목 : 양파(노지재배)  -2021년 : 양파(27농가)O 대상항목 : 지상부생육, 지하부생육, 농가정보  - 지상부 생육항목 : 엽수, 초장, 잎끝고사장, 엽초장, 엽초경,     . 엽수 : 1cm 이상인 잎의 수(녹색부분이 남아 있으면 잎 하나로 셈)    . 초장 : 양파 최장엽의 총 길이(고사부위를 제이한 전체 길이)    . 잎끝고사장 : 초장을 측정한 잎의 고사된 부분의 길이    . 엽초장 : (구비대전) 지면에서부터 잎이 분열되고 있는 지점까지의 길이, (구비대후) 구의 윗 단면부터 잎이 분열되고 있는 지점까지의 길이    . 엽초경 : (구비대전) 엽초 중 가장 두꺼운 부분의 두께, (구비대후) 지상부 비대구 끝 상부 1cm 지점의 두께  - 지하부 생육항목 : 구직경, 1주무게, 생구무게    . 구직경 : 구가 비대되는 부분의 최대 직경    . 1주무게 : 수확 직후 뿌리를 제거한 개체의 무게    . 생구무게 : 경엽과 경엽을 제거한 지하부의 비대된 구의 무게O 조사구 명칭  - 지상부 : B1,B2,B3(조사시 마다 같은 조사구 연속조사)  - 지하부 : R011,R012.R013(파괴조사로 조사시 마다 다른 조사구 조사)'
