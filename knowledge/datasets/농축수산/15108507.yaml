description_portal: '광주광역시 동구의 주말농장 현황 데이터는 도시 농업 활성화와 주민 여가·체험 활동 지원을 위해 운영 중인 주말농장 정보를 체계적으로 정리한 중요한 생활밀착형 자료입니다. 이 데이터는 주민들이 가까운 생활권 내에서 농작물을 가꾸며 건강한 여가 문화를 형성할 수 있도록 돕고, 행정기관이 주말농장 수요·공급을 파악해 효율적인 운영을 지원하는 데 활용됩니다.데이터는 읍면동, 텃밭명, 면적, 가격, 기간 등으로 구성되어 있으며, 각 구성 요소는 다음과 같은 역할을 합니다.읍면동은 주말농장이 위치한 행정구역을 나타내며, 지역별 주말농장 분포와 접근성을 분석하는 데 중요한 기준이 됩니다.텃밭명은 각 농장의 명칭 또는 구획 구분 이름으로, 농장 관리와 주민 안내 시 식별 정보로 활용됩니다.면적은 개별 텃밭 또는 전체 주말농장의 규모를 나타내며, 분양 가능성, 수용 가능 인원, 작물 재배 적합성 등을 판단하는 핵심 자료입니다.가격은 농장 이용을 위해 주민이 부담해야 하는 비용으로, 운영 유지비, 수요 예측, 이용자 만족도 분석 등에 활용됩니다.기간은 이용 가능한 기간(예: 봄·가을 시즌, 연간 운영 등)을 의미하며, 주민 참여 일정 관리와 운영 계획 수립에 중요한 기준이 됩니다.이 데이터는 동구의 도시농업 정책 추진, 주민참여 확대, 여가·체험 프로그램 개발, 친환경 생활 실천 유도 등에 폭넓게 활용될 수 있는 유용한 기초 자료입니다.'
