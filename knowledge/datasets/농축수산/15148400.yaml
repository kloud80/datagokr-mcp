summary_user: 비료품질관리사업에 등록된 비료품질 시험연구기관을 기관 한 곳당 한 행으로 담은 전국 단위 원천 목록이며, 지정일자·지정번호·지정여부·국가지정여부를 포함한다(CSV 약 3KB). 비료 생산·유통 사업자나 행정 담당자가 특정 시험연구기관이 현재 지정 상태인지, 국가지정 기관인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·지정번호를 이름 매칭하는 방식으로만 이어 쓸 수 있다.
description_portal: 농림축산식품부에서는 비료품질 시험 연구기관정보를 제공합니다.본 정보 제공 데이터는 시험연구기관일련번호, 지정일자, 지정번호, 기관명, 대표자명, 지정여부, 국가지정여부등의 정보를 포함하고 있습니다.본 제공자료는 비료품질관리사업의 비료품질 시험 연구기관에 대한 정보로, 비료품질관리사업에서 등록한 시험연구기관중 지정여부 항목의 데이터로 시험연구기관 지정여부를 확인 할 수 있습니다. 또한 국가지정여부에 대한 정보를 확인 할 수 있습니다.기관명 및 대표자명은 민감정보로 마스킹 처리하여 데이터 일부만 제공하고 있습니다.
