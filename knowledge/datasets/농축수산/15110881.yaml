description_portal: '"제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍미탁 데이터를 제공합니다.항목: 일반정보(피해요인), 일반정보(피해대상), 도로명/지번 주소, 행정동코드, 위도, 경도 등* 제주특별자치도에서 발생한 2019년 태풍 미탁(Typhoon Mitag)으로 인한 자연재해 피해 정보를 행정동 단위로 정밀하게 기록한 자료입니다. 대분류, 중분류, 소분류로 체계화된 피해 유형, 피해 구분, 요인 및 피해 대상을 포함하며, 도로명·지번 주소, 행정동 코드, 위도/경도 좌표와 같은 공간정보를 함께 제공하여 GIS 기반 분석과 시각화에 최적입니다.* 활용 분야 : 공간 기반 재해 시각화 및 분석, 재난 대응 계획 수립, 정책 기반 인프라 관리 등"'
