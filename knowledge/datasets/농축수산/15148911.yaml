description_portal: 이 데이터는 해양수산부에서 해수욕장환경정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 해수욕장명, 경도, 위도, 공간정보 데이터로 구성되어 있습니다.본 데이터는 해수욕장환경정보 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해수욕장환경정보란 해수욕장 이용객에게 물놀이하기 적합한 수질, 해수온도, 백사장, 해안선, 파도, 바람 등 해수욕 활동과 관련된 자연 환경 및 이용 환경의 전반적인 상태를 제공하는 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
