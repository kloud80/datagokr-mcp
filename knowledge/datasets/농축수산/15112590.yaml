description_portal: 해당 데이터는 경상북도 영천시의 시설 녹지(완충녹지) 면적 현황 데이터입니다. 본 데이터는 영천시 내 각 구역별로 조성된 시설 녹지의 위치와 면적 정보를 체계적으로 수집하여 제공하는 자료입니다. 데이터는 구역별로 구분된 필지의 구체적인 지번, 지목, 행정동명, 면적, 주변 환경과의 연계성을 포함하고 있으며, 이를 통해 영천시의 녹지 공간 분포와 규모를 한눈에 파악할 수 있습니다. 시설 녹지는 공공시설을 보호하기 위해 설치한 녹지를 통상 이르는 말이며 이 녹지에는 각종 행위 제한이 있어 녹지에 시설이나 건축물을 설치하거나 토지의 형질을 변경하는 등 녹지를 점용하기 위하여 녹지점용허가를 받아야 합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으신 경우 영천시 공원관리사업소로 연락주시기 바랍니다.
