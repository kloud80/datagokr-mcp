summary_user: 인천광역시의 수리답 면적과 경지정리 현황을 2014~2017년 기준연도별 열로 나눠 담은 시도 단위 집계 통계로, 385바이트짜리 작은 CSV 파일입니다. 지역 농업 기반시설 분석가나 정책 담당자가 '인천의 논 가운데 물을 댈 수 있는 수리답과 경지정리된 면적이 몇 년 사이 어떻게 변했나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 현황 항목 이름이나 연도를 맞추는 방식으로만 이어 쓴다.
description_portal: 인천광역시가 제공하는 이 통계는 수리답(논에 물을 대는 시설이 있는 논) 면적과 경지정리(농지 구획 정리) 현황을 2014년부터 2017년까지의 기준연도로 집계한 자료입니다. 이 데이터는 지역 농업 생산 환경의 기반 시설 현황을 파악하고, 농업 생산성 향상 및 농지 효율화 정책 수립에 활용됩니다. 이 자료는 농업용수 공급 및 토지 효율화 현황 분석에 필수적인 기초 농업 통계입니다.해당 데이터는 국가통계포털(KOSIS)에서 참고 하였으며, 공공데이터포털에서 CSV 파일로 제공되고 있습니다.
