description_portal: '인천광역시 보건환경연구원의 도축검사 통계 공공데이터는 인천 도축장에서 유통되는 소, 돼지, 닭고기의 위생 및 안전성을 검사한 결과입니다.도축검사 결과 : 인천광역시에서 운영하는 도축장 2개소에서 안전한 식육생산을 위해 실시하는 도축검사 수행 결과월별 소, 돼지, 닭 도축검사 실적시민들은 이 데이터를 통해 소비하는 육류의 안전성을 확인하고, 관련 연구자나 기업은 식품 위생 관리 방안을 수립하는 데 활용할 수 있습니다.또한, 이 통계는 식품 안전 정책 수립의 기초 자료로도 활용됩니다. 시민들에게 투명한 정보를 제공하고, 축산물의 안전성을 확보하기 위한 인천광역시의 노력을 보여주는 중요한 공공데이터입니다.'
