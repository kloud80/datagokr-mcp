description_portal: 이 데이터는 해양수산부에서 광업권에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 광물자원광업권개정일자, 위치명, 지적도명, 광물자원명, 광물자원부존면적, 연안관리정보번호, 이용기간내용, 항목번호 데이터로 구성되어 있습니다.본 데이터는 광업권 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.광업권이란 등록된 특정 지역(광구)에서 등록된 광물과 동일한 광상에 부존하는 다른 광물을 채굴하고 취득할 수 있는 배타적 권리를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
