description_portal: 이 데이터는 전북특별자치도의 주요 연안 지역인 군산시, 고창군, 부안군의 어촌 마을 소득액 현황을 연도별로 집계한 통계 자료입니다. 2013년부터 2020년까지 8년간의 기록을 통해 각 지역 어촌의 연간 소득액(백만원 단위) 변화를 명확하게 보여줍니다. 이 자료는 지역별 어촌 관광 및 관련 사업의 경제적 성과를 직접적으로 파악하고 비교 분석하는 데 사용됩니다. 방문객 수 데이터와 연계하여 분석할 경우 관광이 실제 소득 증대에 미치는 영향을 평가할 수 있으며, 어촌 지역의 경제 활성화와 지속 가능한 발전을 위한 정책을 수립하는 데 중요한 근거 자료가 됩니다.
