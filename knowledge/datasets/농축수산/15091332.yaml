summary_user: 숲가꾸기사업을 사업 건별로 묶어 사업명, 사업 시작·종료일, 사업면적, 사업종, 시공업체, 발주기관, 투입인원을 담은 전국 범위의 비공간 파일(CSV 약 4.6MB)이다. 분석가나 산림 정책 담당자가 '어느 발주기관의 숲가꾸기사업에 어떤 업체가 몇 명을 투입했고, 면적 대비 인력 규모는 어떤가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산림 데이터와는 발주기관 이름이나 사업명 같은 텍스트 매핑으로만 이어 쓸 수 있다.
