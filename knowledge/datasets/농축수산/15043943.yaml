description_portal: 이 데이터는 해양수산부에서 해면어업 분야의 연간 어업생산량 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 1990년부터 2018년까지 29년 동안의 연도별 해면어업 생산량으로 구성되어 있습니다.본 데이터는 어업 생산 정책 수립, 해양 수산물 공급 예측, 연도별 생산 변동에 대한 연구 및 통계 분석, 어업 관련 경제 동향 파악 등에 활용될 수 있습니다. 또한 어업 관련 산업체, 연구기관, 정책 담당 부처 등에서 어업 생산 현황 분석, 미래 생산량 전망, 어업 정책 효과 분석 등 다양한 방면에 활용할 수 있습니다.
