summary_user: 도시국가산림조사의 일반토지현황조사 결과를 표본점 단위로 담은 건별 원천 CSV 파일로, 표본점별 조사일자·소재지(시도~번지)·표본점 유형과 함께 토지유형 구성(농업지·주택지·공원·교통시설 등)과 지표 피복도(건물·시멘트·잔디·나지 등)를 기록한다. 도시 산림·녹지 분석가나 지자체 담당자가 "도시 표본점 주변 토지가 어떤 용도로 쓰이고 불투수면이 얼마나 덮여 있는가"를 지역별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 도시국가산림조사 통계와는 표본점번호로, 행정구역 자료와는 소재지 시도·시군구·읍면동 이름 매핑으로만 이어 쓴다.
limits: 전역 조인 키(법정동코드 등)가 없어 다른 데이터와 붙이려면 이름 매핑이 필요하다. 이 파일은 일반토지현황 항목만 담으므로 수목 측정·탄소량 같은 다른 조사 항목은 별도 데이터로 확인해야 한다.
