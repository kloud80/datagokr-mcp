description_portal: 충청남도 시군별 재래우 사육현황 데이터는 충청남도 내에서 사육되는 재래우(칡소)의 규모와 분포를 시군 단위로 파악할 수 있도록 구성된 축산 통계자료다. 각 시군의 재래우 사육두수와 농가수를 함께 제공하여 지역별 사육 기반, 농가 분포, 전통가축 유지 수준을 비교·분석할 수 있다. 해당 자료는 충청남도 축산기술연구소에서 수집·제공하며, 충남 내 재래우의 보급 현황을 정확하게 파악해 유전자원 보존 정책, 지역축산 육성 전략, 농가 지원사업 설계 등에 활용할 수 있다. 또한 연구기관·지자체·일반 활용자에게도 충남 재래우 산업의 현황을 이해하는 기초 참고자료로 제공된다.
