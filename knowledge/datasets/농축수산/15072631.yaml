description_portal: '국내 연구시험림의 산림 구조와 생태 환경을 체계적으로 파악하기 위한 다양한 조사 정보를 포함한 통합 데이터입니다. 본 자료에는 산림조사, 식생조사자료, 임반 상세 현황, 임소반 입지환경, 임소반 임분조사, 임공림 조성 실적 등 연구 기반의 핵심 정보가 수록되어 있습니다. 이를 통해 시험림의 수종 구성, 생장 특성, 입지 조건, 경영 실적, 식생 변화 등을 종합적으로 분석할 수 있으며, 장기 생태 모니터링, 산림경영 기법 연구, 수종 개발, 산림복원 모델 설계 등에 활용됩니다.주요 항목산림조사: 조사일자, 표본점번호, 임종 등식생조사자료: 표본점 번호, plot 번호, 하틍광조건 등'
