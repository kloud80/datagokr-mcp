summary_user: 한국농수산식품유통공사가 조사한 전국 농산물의 조사일 평균 중도매인 판매가격(도매)과 소매가격을 품목·품종·등급별로 담고, 1일·1주일·1개월·1년 전 가격과 kg 환산가격을 함께 제공하는 비공간 가격 데이터다. 소비자·식자재 구매자·유통업자·출하 농가가 '배추 도매가가 지난주나 작년 이맘때보다 얼마나 올랐나' 같은 가격 등락을 확인하는 데 쓴다. 전역 조인 키는 없고, 같은 KAMIS 계열 데이터와는 품목코드(item_cd)·품종코드(vrty_cd)로 연결하며, 도매시장·HS·KOSIS 자료와는 코드 체계가 달라 별도 매핑이 필요하다.
limits: 품목코드가 KAMIS·도매시장·HS·KOSIS마다 달라 다른 기관 자료와 바로 조인할 수 없고 이름·코드 매핑을 거쳐야 한다. 전국 단위 비공간 데이터라 지역별·시장별 가격 비교에는 쓸 수 없다. 개발계정 호출은 하루 10,000회로 제한된다.
