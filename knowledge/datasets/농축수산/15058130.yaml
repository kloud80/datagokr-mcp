summary_user: 경기도 시군별·해면/내수면 구분별로 동력어선과 무동력어선의 척수와 톤수를 집계년월 기준으로 담은 집계 자료이며, 어선 한 척 단위의 등록 원장은 아니다. 경기도 어느 시군에 바다 어업용 동력어선이 많고 내수면 무동력어선은 얼마나 되는지 비교하려는 수산 정책 담당자나 분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으며, 시군명·시군코드(SIGUN_CD)를 이름이나 같은 기관 코드로 맞춰 경기도의 다른 시군 단위 통계와 잇는다.
description_portal: 경기도 내 어선 집계 현황입니다. 시군별 동력척수, 동력톤수, 무동력척수, 무동력톤수와 해면내수면구분 등의 정보를 제공합니다.이 데이터는 경기도 각 시군의 어선 보유 현황을 집계한 자료로, 주요 항목으로는 집계년월, 시군명, 해면·내수면 구분, 동력어선 수(척수 및 톤수), 무동력어선 수(척수 및 톤수) 등이 포함되어 있습니다. ‘해면’은 바다를 기반으로 한 어업 활동을, ‘내수면’은 하천, 호수 등 내륙 수역에서의 어업을 의미하며, ‘동력어선’은 엔진 등 동력 장치를 갖춘 어선을, ‘무동력어선’은 동력 없이 운용되는 어선을 지칭합니다. 이 자료는 지역별 어업 활동 규모, 어선 분포 특성, 수산업 인프라 분석, 어선 등록 관리 및 정책 수립 등에 유용하게 활용되며, 내수면 중심의 어업 지역과 해면 중심 지역을 구분해 비교할 수 있습니다. 데이터는 해양수산부 또는 지방자치단체의 수산 행정 시스템을 기반으로 정기적으로 수집된 공공통계 자료입니다.
