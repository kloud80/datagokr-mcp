description_portal: '이 데이터는 해양수산부 무인도서 종합정보망에서 제공하는 무인도서 자료를 바탕으로 각종 자료를 활용하여 월별 통계에 대한 결과를 제공하는 데이터입니다.데이터는 관리 무인도서 중심으로 매월 각종 정보(지적, 관리유형 등)를 연계하여 통계자료 변화를 확인하기 위함입니다.[데이터 설명]제공 항목: 거리구간별 무인도서 현황 통계, 국토계획법 외 법률 관리 현황 통계, 국토의 계획 및 이용에 관한 법률 외 타법률에 따른 용도지역 현황 통계, 국토의 계획 및 이용에 관한 법률에 따른 시·도별 용도구역 지정 현황 통계, 국토의 계획 및 이용에 관한 법률에 따른 시·도별 용도지구 지정 현황 통계, 국토의 계획 및 이용에 관한 법률에 따른 용도지역 현황 통계, 무인도서 관리유형 변경 현황 통계, 무인도서 관리유형 정정 현황 통계, 무인도서 관리유형 지정 현황 통계, 무인도서 관리유형별 현황 통계, 무인도서 면적규모별 관리유형 현황 통계, 무인도서 소유구분 현황 통계, 무인도서 지목구분 면적 현황 통계, 무인도서 지목구분 현황 통계, 무인도서 지적 현황 통계, 무인도서 지형도면 변경 현황 통계, 무인도서 지형도면 정정 현황 통계, 무인도서 지형도면 지정 현황 통계, 주변해역 관리유형 현황 통계면적은 제곱키로미터 단위로 제공됩니다.무인도서 면적규모별 관리유형 현황 통계의 면적구분은 아래와 같습니다.면적구분1 : 면적(0.003㎢ 미만)면적구분2 : 면적(0.003㎢~0.01㎢)면적구분3 : 면적(0.01㎢~0.05㎢)면적구분4 : 면적(0.05㎢~0.1㎢)면적구분5 : 면적(0.1㎢ 이상)무인도서 정보는 해양수산부 무인도서 종합정보제공 사이트에서 확인할 수 있습니다.http://uii.mof.go.kr/UII/INTRO/index.html'
