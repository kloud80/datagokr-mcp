description_portal: '- 영암방조제는 내수와 해수를 나누어 담수호를 조성함으로써 안정적인 농업용수 공급을 가능하게 하며, 홍수시 사전 내수배수를 통해 재해를 예방하는 중요 시설입니다.- 본 개방데이터는 일일방류량에 대한 데이터로 일자 및 방류량 등의 항목을 제공합니다.: 방류일자(날짜형식), 개문시작시간(00:00:00, 시간:분:초), 폐문종료시간(00:00:00, 시간:분:초), 조작문비(수문 개방 수량, 갯수), 방류량(천톤)- 본 데이터는 지속 가능한 유지관리 및 정책 수립을 위한 기초 자료로 활용되며, 수자원 관리 모델리, 기후변화에 따른 수문 운영 분석 등 다양한 학술 연구와 실무 적용 자료로도 활용 가능합니다.'
