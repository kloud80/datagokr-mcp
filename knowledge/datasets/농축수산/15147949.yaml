description_portal: 축산물품질평가원 통계누리에서 제공되고 있는 농장지역별 소의 품종별 농장수 정보는 축산물이력제 데이터를 기반으로 제공되고 있습니다. 자료는 매달 업데이트 되고 있고 농장지역의 시군구별  상세 구역별로  나타나고 있으며 품종은 한우, 젖소, 육우를 대상으로 농장수 정보를 확인할수 있습니다. 제공된 데이터를 가지고 이용자는 전국 및 시군으로 통합하여 데이터를 집계할 수 있고, 월별로 제공되고 있으므로 농장수의 변화 추이를 쉽게 확인하여 이용자의 목적성에 맞게 활용할 수 있습니다.  농장수 변화를 확인하여 축산물 수급 정보에 활용할수 있습니다.
