summary_user: 주요 무역항 인근 10개 해무관측소에서 관측한 관측일시별 수온·기온·습도·기압·풍향·풍속·시정(가시거리) 값을 관측소 이름과 위경도와 함께 담은 건별 관측 데이터로, 관측소코드와 관측일자를 넣어 조회한다. 항만 운영자나 선사가 '오늘 아침 이 항구 앞바다에 해무가 끼어 시정이 얼마나 떨어졌나'를 확인해 입출항·운항 판단에 쓰고, 분석가는 해무 발생과 기온·수온 차이의 관계를 보는 데 쓴다. 전역 조인 키는 없어서 국립해양조사원(바다누리)의 다른 관측 데이터와는 같은 기관의 관측소코드나 관측소 이름으로, 다른 데이터와는 위경도 좌표로 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 주요 무역항 인근 10개 해무관측소에서 측정된 각종 정보를 제공하기 위해 수집한 데이터입니다.  관측소코드, 관측일자 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소 코드, 수온, 기온, 습도, 풍향, 풍속, 기압, 시정 등의 해양·기상 관측값으로 구성되어 있습니다.  본 데이터는 해운·항만 운영 시 해무로 인한 안전사고 예방과 선박 운항 관리 및 기상재해 대비에 활용될 수 있습니다. 또한 해양환경 연구, 항만 개발계획 수립, 관측 데이터 기반의 해상 교통 정책 설계 등 해양 관련 분야의 분석 자료로 활용될 수 있습니다.
