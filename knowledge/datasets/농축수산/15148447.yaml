description_portal: '[데이터 수집 목적]공공데이터 개방의 주된 목적은 국민의 알 권리를 보장하고, 투명한 행정 시스템을 구축하는 데 있습니다. 한국해양진흥공사의 경우, 기관의 다양한 활동(공사소식, 채용, 입찰 등)과 시장 정보(KDCI)를 데이터화하여 외부에 공개함으로써 국민에게 신뢰성 있는 정보를 제공하고, 이를 통해 새로운 가치를 창출하도록 지원하는 것입니다.[데이터 수집 과정]공공데이터는 다음과 같은 과정을 거쳐 수집됩니다.내부 정보 수집: 기관의 공식 활동(정책, 사업, 예산 등), 인사(채용), 계약(입찰), 그리고 시장 관련 데이터(KDCI) 등 다양한 내부 정보를 정기적으로 수집하고 관리합니다.[데이터 세부 항목]한국해양진흥공사가 공개하는 공공데이터는 게시판 성격에 따라 다양한 세부 항목을 포함합니다.공사소식: 보도자료, 정책 발표, 사업 성과, 행사 일정 등 공사의 주요 활동에 대한 정보.채용정보: 채용 직무, 자격 요건, 전형 절차, 시험 일정 등 구직자에게 필요한 정보.입찰공고: 입찰 대상 사업, 입찰 참가 자격, 제출 서류, 마감 기한 등 입찰 관련 정보.KDCI: 건화물선 선종별(케이프사이즈, 파나막스 등) 및 주요 항로별(태평양, 대서양 등) 운임지수, 주간 집계 데이터 등 해운 시장 관련 정보.[활용 기대 효과]공공데이터 개방은 다양한 분야에서 긍정적인 효과를 가져옵니다.경제적 효과: 공공데이터를 활용한 새로운 애플리케이션, 서비스, 사업 모델을 개발하여 부가가치를 창출합니다. 예를 들어, KDCI 데이터를 활용해 해운 시장 분석 솔루션을 만들 수 있습니다.사회적 효과: 투명한 정보 공개를 통해 국민과 기관 간의 신뢰를 높이고, 시민 참여를 활성화합니다.정책적 효과: 개방된 데이터를 바탕으로 국민과 기업의 목소리를 듣고, 더 나은 정책을 수립하고 평가하는 데 활용할 수 있습니다.학술적 효과: 연구자들에게 신뢰성 있는 자료를 제공하여 학술 연구를 촉진하고, 관련 분야 전문가 양성에 기여합니다.'
