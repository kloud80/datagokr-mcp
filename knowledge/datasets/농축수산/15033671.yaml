description_portal: 강원특별자치도_비료농약법 현황을 제공하여 드립니다.비료업체등록현황은 비료관리법에 따라 등록된 비료 제조, 수입업체의 기본 정보를 수록한 자료입니다.강원특별자치도 비료업체의 관할 지역, 업체명, 대표자 등 기본정보를 포함합니다. 또한, 제조장(영업장) 소재지, 생산 수입 구분, 등록(신고)일자 및 번호, 성분, 분류, 종류, 신고사항, 최종처리업체여부, 영업상태 등으로 포함한 데이터를 제공하고 있습니다.비료 유통의 투명성 제고, 농가의 비료 선택 정보 제공, 행정기관의 관리, 감독에 활용될 수 있습니다.
