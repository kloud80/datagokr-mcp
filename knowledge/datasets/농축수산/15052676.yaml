summary_user: 국립자연휴양림 45개소의 2020년부터 2023년 8월까지 이용객 수를 휴양림(기관)별로 10대부터 100대까지 연령대로 나눠 집계한 파일 데이터이며, 범위는 전국이고 지역은 시군구 단위로 표시된다. 휴양림 운영자나 분석가가 어느 휴양림에 60대 이상 고령 이용객이 많은지, 지역별로 주 이용 연령층이 어떻게 다른지 확인하는 데 쓴다. 전역 조인 키는 없어 기관명·지역명 같은 이름이나 기관코드·지역코드 매핑으로 다른 휴양림 시설·이용 현황 자료와 연결해야 한다.
description_portal: 국립자연휴양림 45개소에서 2020년부터 2023년 8월까지 방문한 이용객의 연령대별 이용 현황을 분석한 자료로, 10대부터 100대까지 각 연령층의 이용자 수를 세분화하여 제공합니다. 주요 컬럼에는 지역명, 휴양림명, 연령대별 이용자 수, 60대 이상 이용자 수 등이 포함되어 있어, 연령별 휴양림 이용 패턴을 파악할 수 있습니다. 이 데이터는 휴양림 운영 정책 수립, 마케팅 전략, 세대별 맞춤 서비스 개발 등에 활용될 수 있으며, 연령별 이용 추이 분석이나 지역별 특성 연구에도 유용합니다. 연 1회 이상 갱신되어 최신 트렌드 반영이 가능합니다.
