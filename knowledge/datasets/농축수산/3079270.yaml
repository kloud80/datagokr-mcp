summary_user: 경상남도 거제시 관내 무인도서를 섬 하나(필지 단위) 한 행으로 담은 원천 목록 파일로, 관리번호·도서명·소재지(면동·리·지번)·지목·면적·관리유형·소유자·기준일을 담는다. 해양공간 관리 담당자나 분석가가 '거제시 무인도서 중 국유·공유·사유는 각각 어디이고 면적은 얼마인가'처럼 보전·이용 제한 검토 대상을 추리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도서명이나 면동·리·지번 소재지 문자열을 맞춰 연결해야 한다.
description_portal: 경상남도 거제시에 소재한 무인도서에 대한 행정 및 지리 정보를 포함하고 있으며, 각 도서의 관리번호, 도서명, 소재지, 지목(지적상 토지 용도), 면적, 관리유형(국유/공유/사유 등), 소유자 정보 등을 제공하고 있습니다.거제시 관내 무인도서의 보전·관리 대상 파악, 생태자원 보호, 관광·어업 등 관련 정책 기초자료 제공을 위해 구축된 것으로, 무인도서의 현황을 체계적으로 파악하고 행정 관리의 효율성을 높이기 위한 기반 자료로 활용될 수 있습니다. 해양생태계 보전 정책 수립, 도서개발·이용 제한 검토, 해양경관 자원화 등의 용도로 활용 가능합니다.
