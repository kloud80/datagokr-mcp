description_portal: 이 데이터는 2021년 기준 제주 지역 내 고품질 감귤 농가에서 수집된 과실당도 및 위치 기반 생육 특성 데이터를 정리한 자료로, 총 10,000건의 데이터가 포함되어 있습니다. 각 데이터는 구분 번호, 대상 아이디, 아이디, 당도키, 측정위치, 평균당도, 평균크기 항목으로 구성되어 있으며, 구분 번호는 1번부터 시작하여 순차적으로 부여된 일련번호입니다. 대상 아이디는 10자리 숫자로 구성되어 농가 또는 개체를 식별할 수 있는 고유값으로 활용되며, 아이디와 당도키는 추가적인 분류 및 관리 목적의 식별 항목으로 사용됩니다. 측정위치는 과실이 측정된 나무의 위치를 나타내며, 상(상부), 중(중간), 하(하부)로 구분되어 감귤의 생육 위치에 따른 당도 및 크기 변화를 파악할 수 있습니다. 평균당도와 평균크기 항목은 모두 소수점 둘째 자리까지 수치로 기록되어 있어 정밀한 품질 분석이 가능하며, 농가별·위치별·개체별 과실 특성을 비교 분석할 수 있도록 설계되어 있습니다. 이 데이터는 고품질 감귤의 품질 관리와 생육 조건 최적화, 위치별 특성 분석, 당도 분포 시각화, 품종별 수확 전략 수립 등에 활용될 수 있으며, 스마트농업 기반의 과학적 품질관리 및 수확 예측 모델 개발에 활용할 수 있는 핵심 기초자료로 기능합니다.
