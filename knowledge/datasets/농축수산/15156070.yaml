summary_user: 한국농수산식품유통공사가 조사한 농산물의 품목·품종·등급별 조사일 평균가격과 kg 환산가격, 그리고 1일·1주일·1개월·1년 전 대비 등락률을 전국 단위로 담은 API다. 식자재 구매 담당자나 유통업자가 "배추 가격이 지난주·작년 같은 때보다 얼마나 올랐나"를 확인하거나, 정책 담당자가 가격 급등 품목을 골라낼 때 쓴다. 전역 조인 키는 없으며, 품목코드(item_cd)와 품종코드(vrty_cd)를 KAMIS 코드 기준으로 맞춰 같은 기관의 다른 KAMIS 가격 데이터와 이어 쓰고, 도매시장·HS·KOSIS 품목코드와는 별도 매핑이 필요하다.
limits: 품목코드 체계가 KAMIS·도매시장·HS·KOSIS마다 달라 다른 기관 데이터와 바로 붙일 수 없고, 이름·코드 매핑을 거쳐야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 가격 비교에는 쓰지 못한다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
