description_portal: 이 데이터는 해양수산부에서 어란자치어에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 년도,  학명_영문명학명_한글명 등의데이터로 구성되어 있습니다.본 데이터는 어란자치어 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어란자치어란 물고기의 번식 단계에 있는 생물로, 어란은 물고기의 알을, 자치어는 부화 후 일정 기간까지의 어린 물고기를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
