summary_user: 선박 항해 안전을 위해 등대·부표 같은 항로표지가 설치되었거나 설치가 필요한 해역을 구역별 공간정보(도형)로 담은 전국 단위 파일(CSV, 약 68만 바이트)로, 해역명·제작일자·근거 법령과 조항·담당 부서·참조 URL이 함께 들어 있다. 해상풍력 등 해양공간 입지를 검토하는 사업자나 분석가가 '이 후보 해역이 항로표지 설치해역과 겹치는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 해양용도구역·보호구역 데이터와는 공간정보를 겹쳐 보는 공간 중첩이나 해역명 매칭으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 항로표지설치해역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 공간정보, 항로표지제작일자, 항로표지설치해역명, 정의내용, 해양정책법령명, 상세조항명, 참조정보, 해양조사관련부서명, 참조URL주소1, 참조URL주소2 데이터로 구성되어 있습니다.본 데이터는 항로표지설치해역 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.항로표지설치해역이란 선박의 안전한 항해를 위해 항로표지(등대, 부표 등)가 설치되거나 설치될 필요가 있는 바다의 특정 구역을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
