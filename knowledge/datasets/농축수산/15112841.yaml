summary_user: 전북특별자치도 장수군 7개 읍면의 농지를 필지(소재지·번지·호) 단위로 담은 건별 파일로, 지목(전·답·과수원)과 면적(제곱미터)을 함께 담는다. 농지 매입을 검토하는 개인이나 지역 농업 분석가가 '장수군 어느 읍면에 과수원 필지가 얼마나 있고 규모는 어떤가'를 확인하는 데 쓴다. 전역 조인 키(PNU 등)가 없어 다른 데이터와는 소재지·번지 주소를 이름으로 맞춰 연결해야 하며, 농업진흥지역·팜맵 같은 필지 정보와 잇는 것도 주소 매핑을 거친다.
description_portal: 전북특별자치도 장수군의 농지에 대한 데이터를 제공하고자 합니다.데이터의 구성은 소재지, 번지, 호, 지목, 면적으로 구성되어 있습니다.면적의 단위는 제곱미터입니다. 지목의 경우 전, 과수원, 답으로 구성되어 있습니다.호의 경우 미공란대신 0으로 입력하였으니 데이터 사용시 참고하시기 바랍니다.이 데이터의 경우 장수군 전체 7개읍면(장수읍, 산서면, 번암면, 장계면, 천천면, 계남면, 계북면)에서 현황입니다.추가적인 데이터가 필요한 경우 공공데이터포털(data.go.kr) 누리집의 데이터 제공 신청을 통해 신청하여 주시기 바랍니다.
