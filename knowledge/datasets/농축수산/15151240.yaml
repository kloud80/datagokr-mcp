summary_user: 농작물을 대분류·중분류(품목)·소분류(품종) 3단계로 나눠 각각 고유 코드를 붙인 전국 단위 농업 표준 품목코드 기준표로, 활용신청 없이 받는 CSV 파일(약 434KB)이다. 농산물 가격·생산·유통 데이터를 다루는 분석가나 개발자가 '이 데이터의 품목코드가 어떤 작물·품종을 가리키는가'를 확인하고 분류체계를 통일할 때 쓴다. 중분류코드(품목코드)를 조인 키로 삼아 품목코드를 쓰는 다른 농산물 데이터와 이어 쓰며, 품종 단위 연결은 소분류코드로 한다.
description_portal: 이 데이터는 농림수산식품교육문화정보원에서 관리하는 농업 표준 품목코드 데이터로, 농작물의 분류체계를 표준화하여 관리하기 위해 구축된 기준 자료입니다. 대분류, 중분류, 소분류 단위로 작물 및 품종을 세분화하여 코드화하였으며, 각 품목별로 고유 식별코드를 부여하여 농업 관련 데이터의 일관성 있는 연계와 관리가 가능하도록 구성되었습니다. 본 데이터는 작물의 분류기준 통일, 통계 분석, 품목별 연구 및 행정 업무의 효율화를 위한 기초 자료로 활용되며, 농업정보시스템, 생산·유통 데이터베이스, 공공데이터 개방 등 다양한 분야에서 활용될 수 있습니다
