summary_user: 친환경농산물의 소매 가격을 조사일·품목·품종·등급·시군구·시장 단위로 담은 건별 조사 가격 데이터로, 조사일 가격과 kg 환산 가격을 함께 제공하며 범위는 전국(시군구 단위)이다. 소비자나 식자재 구매 담당자가 '이번 주 특정 지역 시장의 친환경 사과 kg당 소매가가 얼마이고 최근 어떻게 움직였나'를 확인하는 데 쓴다. 품목코드(item_cd)·품종코드(vrty_cd)로 같은 KAMIS 체계의 일반 소매·도매 가격 데이터와 이어 쓰지만, 전역 조인 키는 없어 다른 기관 데이터와는 품목명·코드 매핑을 거쳐야 한다.
limits: KAMIS 품목코드는 도매시장·HS·KOSIS 품목코드와 체계가 달라 바로 결합할 수 없고 별도 매핑표가 필요하다. 포털 활용신청(자동승인) 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
