summary_user: 경기도 사이버식물병원에 병해 진단을 의뢰할 때 입력된 병해 발생지 주소를 진단의뢰번호별로 담은 건별 원천 테이블로, 주소코드와 1~4단계 행정구역 값, 전체 원주소 문자열을 함께 제공한다. 농업 분석가나 지자체 담당자가 '어느 시군·읍면동에서 식물 병해 진단 의뢰가 많이 들어오는가'처럼 병해 발생 위치의 지역 분포를 볼 때 쓴다. 진단의뢰번호(diagns_rqst_no)로 같은 기관의 진단 의뢰 테이블과, 주소코드(addr_cd)로 같은 기관의 시도·시군구·읍면동 주소 테이블과 잇는 구조이나, 실측상 다른 기관 데이터와 붙일 전역 조인 키는 없어 이름·코드 매핑이 필요하다.
description_portal: 진단_의뢰_주소 테이블은 진단 요청 시 입력된 병해 발생지의 주소 정보를 상세한 행정구역 단위로 분해하여 제공합니다. 이 테이블은 진단의뢰번호(dx_req_num)와 함께, 행정구역 코드(주소_코드)를 통해 주소를 구성하는 1~4단계 정보(level_1~level_4) 및 전체 주소 문자열(원주소)을 제공합니다.주소_코드(address_cd)는 주소_시도, 주소_시군구, 주소_읍면동 테이블의 시도코드, 시군구코드, 동코드와 연계하여 지역 정보를 계층적으로 탐색할 수 있게 합니다. 또한, 이 주소 정보는 진단_의뢰 테이블의 주소코드와도 직접적으로 연결되어 병해 발생 위치에 대한 통계 및 공간 분석 등에 활용됩니다.
