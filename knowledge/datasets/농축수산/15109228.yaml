summary_user: 농축수산물 표준코드 중 산지 코드에 대해 2015년 제정·개정된 신규 산지코드·산지명과 2013년에 쓰던 구 산지코드·산지명을 한 행씩 대조한 코드표로, 전국 범위의 비공간 데이터이며 갱신일자(UPDT_DE)를 함께 담는다. 농산물 유통·가격 데이터를 다루는 분석가나 개발자가 과거 자료에 찍힌 구 산지코드를 현행 표준 산지코드로 바꿔 시계열을 이어 붙일 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 산지코드나 산지명을 기준으로 같은 기관의 다른 표준코드·유통 데이터와 매핑해 연결한다.
description_portal: 본 API는 농림수산식품교육문화정보원에서 제공하는 농축수산물에 대한 표준코드를 조회할 수 있는 서비스입니다. 2015년에 제정 또는 개정된 농축수산물 표준코드는 품목, 시장, 단위, 포장, 크기, 등급, 산지 등의 정보를 포함하고 있으며, 이와 동시에 2013년에 사용된 동일한 농축수산물 표준코드의 신구 대조표도 제공합니다. 이 서비스는 농축수산물의 데이터 통합 관리와 세부적인 산지 코드를 제공함으로써 품질 관리 및 시장 동향에 대한 분석을 가능하게 합니다. 또한, 신청자는 산지코드와 산지명, 업데이트 일자와 같은 다양한 필드를 통해 보다 정확한 정보를 쉽게 조회할 수 있습니다. 이러한 정보는 농축수산물의 유통 및 품질 관리, 연구개발, 정책 수립 등 다양한 분야에서 활용될 수 있습니다. 피드백은 언제든지 환영합니다.
