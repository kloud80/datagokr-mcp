summary_user: 전국 생산해역정점 1,594건을 정점별 좌표(경도·위도)와 공간정보로 담은 건별 원천 파일 데이터이다. 패류 등 식용 수산물을 위생 기준에 따라 관리하는 해역 지점이 어디인지 확인하려는 해양 행정·정책 담당자나 분석가가 쓴다. 경도·위도 좌표(coord)를 키로 다른 해양공간 영역 레이어(용도구역·보호구역·연안 등)와 지도상에서 겹쳐 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 생산해역정점에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보 데이터로 구성되어 있습니다.본 데이터는 생산해역정점 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.생산해역정점이란 식용 수산물, 특히 패류(조개류 등)를 생산하기 위해 위생 기준에 따라 관리되는 특정 해역 지점을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.*해당 데이터는 공간정보 데이터로 gis 툴을 이용하여 지도에서 레이어로 확인하실 수 있습니다.
