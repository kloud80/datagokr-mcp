summary_user: 국유림 경영계획부의 변경 이력을 임반·소반 단위로 담은 건별 원천 파일(csv 약 12MB)로, 차수별 입목지·미립목지·제지 면적과 소반 좌표를 함께 담는다. 국유림 관리 분석가가 특정 임반·소반의 입목지 면적이 경영계획 차수에 따라 어떻게 바뀌었는지 추적하는 데 쓴다. 경영계획부번호(nfm_plan_book_no)와 임반·소반 아이디(nfm_compartment)가 조인 키라서 같은 키를 쓰는 다른 국유림경영정보 데이터와 이어 쓰고, 소반 좌표로 임상도 같은 공간 자료와 겹쳐 본다.
description_portal: 국유림경영정보 경영계획부 이력정보 데이터는 국유림의 체계적인 관리와 효율적 운영을 위해 각 경영계획부의 이력과 관련된 상세 정보를 담고 있다. 경영계획부번호, 이력관리번호, 차기번호, 경영계획구ID, 임반ID, 소반ID 등 다양한 식별자와 함께 입목지면적, 미립목지면적, 제지면적 등 산림자원 관리에 필수적인 면적 정보가 포함되어 있다. 이 자료는 국유림 경영계획 수립, 이력 추적, 산림자원 현황 분석, 정책 평가 등 다양한 목적으로 활용될 수 있다. 정기적으로 갱신되어 최신 정보를 제공한다.
