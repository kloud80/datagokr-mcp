summary_user: 국립농산물품질관리원이 단속한 농수산물 원산지표시 위반을 연도·시도별로 집계한 전국 단위 비공간 데이터로, 거짓표시 적발 개소, 미표시 적발 개소, 과태료(천원)를 담는다. 소비자단체나 정책 분석가가 "우리 시도에서 원산지 거짓표시 적발이 해마다 늘고 있는가"를 확인하거나 시도 간 단속 실적과 과태료 규모를 비교할 때 쓴다. 전역 조인 키는 없어서, 다른 시도별 통계와는 연도와 시도 이름을 맞춰 연결한다.
description_portal: 농산물원산지표시제도는 농산물, 수산물이나 그 가공품 등에 대하여 적정하고 합리적인 원산지 표시를 하도록 하여 소비자의 알권리를 보장하고, 공정한 거래를 유도함으로써 생산자와 소비자를 보호하기 위하여 도입한 제도로서 본 정보는 국립농산물품질관리원에서 관리하는 원산지표시 지역별 적발 현황 정보로서, 연도, 시도, 거짓표시 적발 실적(개소), 미표시 적발 실적(개소), 과태료(천원) 항목으로 구성되어 있습니다. 농산물 원산지 지역별 위반 현황 정보를 활용하는 데 관심이 있는 경우 유용하게 사용할 것으로 기대됩니다.
