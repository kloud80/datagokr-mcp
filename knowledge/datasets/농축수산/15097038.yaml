description_portal: 이 데이터는 제주특별자치도 내에서 수행된 소(牛)의 브루셀라병 검사 실적을 정리한 공공데이터로, 검사 대상 농가 및 개체, 검사 시점, 검사 방법, 검사 결과(양성/음성 여부) 등의 항목이 포함되어 있다. 브루셀라병은 세균 Brucella abortus 등에 의해 발생하는 전염병으로, 감염 시 소에서는 유산, 불임, 생산성 저하 등의 문제가 발생할 수 있으며, 사람에게도 전파될 수 있어 공중보건상으로 중요하다. LHCA+2지식재산형성과제관리시스템+2 이 데이터를 통해 도내 축산농가의 방역 현황, 검사 빈도와 결과 분포, 양성 농가 발생 여부 등을 객관적으로 확인할 수 있어, 지역 방역 정책 수립, 축산물 안전 관리, 가축 및 인수공통전염병 위험 평가, 농가 위생 관리 강화 등을 위한 기초 자료로 활용 가능하다. 자료는 CSV 형식으로 공개되어 있으며, 누구든지 무료로 다운로드해 분석할 수 있다.
