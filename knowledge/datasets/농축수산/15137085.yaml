description_portal: 농식품지식정보서비스에서 사용되는 품목별 가격추이 대표 도매농림수산식품교육문화정보원은 농업 정보 플랫폼 ‘농업ON’을 통해 주요 농산물의 가격 동향을 제공하고 있으며, 본 데이터는 농산물 유통 경로 분석을 위해 정리된 전국 도매시장의 대표 품목별 정보입니다. 항목은 기준연도, 대분류명, 중분류명, 도매시장명으로 구성되며, 품목은 두류(콩), 서류(감자), 과실류(사과·포도·복숭아·블루베리), 과일과채류(토마토·딸기), 엽경채류(배추·양배추) 등으로 분류됩니다. 각 품목별로 거래량이 많거나 가격 지표로 활용되는 대표 도매시장 10개 내외가 지정되어 있으며, 이를 통해 품목별 유통 집중 시장을 파악할 수 있습니다. 데이터는 품목별 가격 분석의 기준 시장을 선정하는 데 활용되며, 유통 흐름, 가격 변동 요인 분석, 지역별 유통 구조 비교 등 다양한 통계적 활용이 가능합니다. 또한, 도매시장별 품목 특성과 유통량 편차를 파악하여 농산물 수급정책 수립, 유통경로 개선, 정책 효과 분석 등에 기초 자료로 제공됩니다.
