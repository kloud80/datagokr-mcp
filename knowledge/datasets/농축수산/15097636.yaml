description_portal: 본 데이터는 2020년 경기도 화성시 관내 포도 스마트팜에서 수집된 환경 요소별 정보를 포함하고 있다. 스마트팜에 설치된 환경센서를 통해 농장 단위로 측정된 온도, 습도, 지습 정보를 10분 간격으로 기록한 자료이다. 수집된 데이터는 농장별로 구분되며, 정밀한 포도 재배환경 분석 및 생육 조건 비교에 활용 가능하다. 데이터의 일부 항목은 현장 사정에 따라 측정되지 않아 공란으로 처리되어 있으며, 이는 미집계된 항목임을 의미한다. 본 자료는 스마트농업 기반 포도 재배지의 환경 관리 및 연구 지원을 위한 기초자료로 제공된다. 데이터는 1회성으로 수집되었으며, 추가 갱신은 이루어지지 않는다.
