description_portal: 산림토목관리시스템을 기반으로 사방사업, 임도설치, 산지복구 등 산림토목사업의 실제 시행 대상지에 대한 정보를 제공하는 데이터입니다. 이 자료는 각 토목사업의 시행 위치, 대상지 좌표, 행정구역(시군구), 면적, 사업유형, 사업명, 관리기관 등을 포함하고 있으며, 대상지를 중심으로 한 계획 수립, 현장 조사, 시공 및 사후관리의 핵심 자료로 활용됩니다. 특히 해당 데이터는 재해위험지 예방, 토사 유출 방지, 산림기반시설 확충, 국유림 경영계획 수립 등 다양한 목적을 위한 사업 대상지 선정과 효율적인 사업 시행에 기여합니다
