summary_user: 산림탄소상쇄사업 가능지로 의뢰된 대상지를 건별로 담은 원천 파일로, 대상지 면적(헥타르)·소재지 주소·등록 구분·지역·승인 일시·사업 신청일자 등을 전국 범위의 개별 주소 단위로 담는다(파일 크기 410바이트로 건수는 매우 적다). 탄소상쇄사업을 검토하는 사업자나 연구자가 "어느 지역에서 얼마 면적의 산림이 탄소상쇄사업 가능지로 의뢰·승인되었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산림 자원·탄소 데이터와는 소재지 주소, 지역명, 사업장 우편번호를 이름·코드로 매핑해서만 이어 쓴다.
description_portal: 산림탄소상쇄사업의 가능지 의뢰 내용을 담은 데이터는 사업 대상지의 면적, 주소, 등록 구분, 지역 코드, 승인 일시 등 다양한 정보를 포함하여 제공합니다. 이 자료는 산림을 활용한 탄소상쇄사업의 신규 대상지를 발굴하고 평가하며, 사업 추진 가능성을 분석하는 데 활용하실 수 있습니다. 정책 입안자, 연구자, 사업자 등은 이 데이터를 통해 산림 탄소상쇄사업의 확장성과 잠재력을 종합적으로 파악하실 수 있으며, 효율적인 사업 전략 수립에도 참고하실 수 있습니다. 또한 데이터는 최신 정보로 정기적으로 갱신되어 신뢰성 높은 근거 자료로 활용 가능하며, 행정기관과 연구기관에서 정책 결정과 성과 평가 과정에서도 중요한 역할을 합니다.
