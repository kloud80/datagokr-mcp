description_portal: '○ 통계개요* 통계명 : 두류생산량* 통계종류 : 서울시 식량작물 생산량 현황을 제공하는 지정ㆍ조사통계* 작성목적 : 식량생산 계획, 토지이용의 개선, 농업경영 개선, 농산물가격 안정, 유통대책등의 농업정책수행과 학술연구 및 국민계정 등 타 가공통계의 기초자료로 활용* 조사체계 : 조사담당자 → 지방통계청 → 통계청* 공표주기 : 정기(매년, 작물별수확기)* 공표범위 : 지역 - 서울시내용 - 서울시 식량작물(미곡·잡곡·두류·서류)의 재배면적 및 생산량 현황○ 용어설명* 미곡은 백미로 현미에 현백률(현미를 쌀로 환산하는 비율) 92.9%를 적용하여 산출* 식량작물 : 미곡, 잡곡, 두류, 서류 등 식량을 생산할 수 있는 작물* 서류의 재배면적은 시설면적이 포함된 수치임* 단위면적(10a)당 수량 : 10a(1,000㎡)의 면적 내에서 수확한 농작물의 수량, 수확량'
