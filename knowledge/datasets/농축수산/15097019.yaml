description_portal: '이 데이터셋은 제주특별자치도 내에서 가축분뇨를 처리하는 농가들을 대상으로, 분뇨 처리 방식별(예: 공공처리시설 이용, 액비화, 퇴비화, 자가 처리 등) 농가 수 현황을 집계한 공공 통계 자료다. 각 처리 방식이 얼마나 많은 농가에서 사용되고 있는지 파악할 수 있어, 분뇨 처리 방식의 분포, 농가별 환경 관리 실태, 자원순환 처리 참여율 등을 분석할 수 있다. 이 정보는 지역의 축산 환경 정책 수립, 분뇨 처리 인프라 구축 우선순위 결정, 악취 및 수질 오염 저감 전략 마련, 자원순환 농업 촉진 계획, 환경 영향 평가 등 다양한 행정·환경관리 및 연구 목적에 활용될 수 있다. 데이터는 CSV 형식으로 제공되어 누구나 열람 및 분석이 가능하다.'
