description_portal: '○ 통계개요* 통계명 : 도축검사실적* 통계종류 : 서울시내 도축검사장(금천, 송파)의 도축현황을 제공하는 일반ㆍ보고통계* 근거법령 :「축산물가공처리법」에 의한 생산실적 보고* 작성목적 : 도축검사실적을 파악하여 축산물의 수급 및 가격안정 등 축산정책 수립에필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 도축검사장 → 보건환경연구원 → 시도* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시내 도축장에서 도축되는 소ㆍ돼지의 두수, 생체량, 지육량 현황○ 용어설명* 생체량 : 살아있는 상태의 가축무게* 지육량 : 내장, 머리, 족, 가죽 등을 제외한 고기와 고기부산물○ 기 타* 금천구는 2007년부터 통계생산 안함* 송파구는 2011년부터 통계생산 안함(충북음성으로 이전하여 검사실적 없음)○ 출 처 : 보건환경연구원'
