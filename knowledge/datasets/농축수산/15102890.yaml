description_portal: 식품을 취급하는 작업장에서 인증을 획득했다는 것은 해당 제품이 안전하게 섭취할 수 있다는 사실을 증명하는 것만이 아니라, 해당 기업이 소비자에게 식품을 판매하는 과정에서 요구되는 전문적·윤리적 기준을 충족했다는 것을 국제적 또는 국내적 수준에서 보장합니다. 즉, HACCP, ISO 22000, FSSC 22000 등과 같은 식품안전 경영 체제 인증을 통해 전 과정의 위생 및 안전관리가 입증되며, 이를 통해 기업은 제품의 안전성을 확보함과 동시에 규제 준수, 품질 관리 시스템, 책임 있는 제조 관행이 갖춰졌음을 대외적으로 알릴 수 있습니다.본 데이터는 농식품수출정보(KATI)에서 제공하는 "2023 농식품 해외인증＆등록 정보 종합 가이드"에서 발췌했습니다.원본 보고서는 "https://www.kati.net/board/globalVillageReportView.do?board_seq=99776&menu_dept2=49&menu_dept3=52" 참조해주시기 바랍니다.
