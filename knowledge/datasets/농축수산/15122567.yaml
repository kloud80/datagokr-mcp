description_portal: '농림수산식품교육문화정보원 농업온 시스템의 병해충 정보에 대한 데이터는 농업 작업 및 연구에 있어 매우 중요한 자료입니다. 이 데이터에는 정렬번호, 병충해명, 특징, 발생시기 내용, 등록일자 업체 등 다양한 항목이 포함되어 있습니다. 농민들이 작물을 안전하게 재배하고, 병해충 예방 및 관리에 필요한 정보를 제공하기 위해 이 데이터를 활용할 수 있습니다. 이를 통해 안정적인 농작물 생산과 함께 품질 향상에 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 정렬번호(숫자형) : 병해충의 고유 번호를 나타냅니다. 병충해명(문자형) : 해당 병해충의 이름을 표기합니다. 특징(문자형) : 병충해의 세부적인 특성과 증상에 대해 설명합니다. 발생시기 내용(문자형) : 병충해가 발생하는 시기에 대한 정보입니다. 등록일자(날짜형) : 데이터가 등록된 날짜를 표기합니다.'
