summary_user: 해양수산부가 고시한 해양용도구역 중 에너지개발구역의 공간정보를 WMS(지도 이미지)와 WFS(텍스트 공간정보) API로 담으며, 검증 수신은 10행이고 범위는 전국, 단위는 구역별 개별 좌표다. 해상풍력 등 해양 에너지 사업의 입지를 검토하거나 인허가 전에 예정 해역이 에너지개발구역에 걸리는지 확인하려는 사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 이름·코드 매핑이나 같은 기관의 용도구역 코드로만 다른 해양공간 데이터와 잇고, 지도 조회에 필요한 bbox·height·width는 다른 데이터에서 받아 넘겨야 한다.
description_portal: 이 데이터는 해양수산부에서 해양용도구역 중 에너지개발구역에 대한 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 WMS(웹 맵 서비스) 및 WFS(웹 피처 서비스) 형태로 구분되어 있습니다. WMS데이터는 반환 이미지 크기(픽셀), 좌표체계 파라미터로 맵 이미지 파일을 조회할 수 있으며, WFS는 에너지개발구역의 텍스트 형태 공간정보와 용도구역코드, 용도구역명, 고시년도, 면적 및 상세내용 정보를 제공받을 수 있습니다.본 데이터는 해양 에너지 개발 사업의 입지 검토, 해양공간 계획 수립, 관련 인허가 절차 사전 검토, 공간정보 기반의 연구자료로 활용될 수 있습니다.
team:
  dept: 해양공간정책과
services:
  - op: /getOpnOpzEnWMS
    name: 해양용도구역_에너지개발구역 WMS 조회
    endpoint: https://apis.data.go.kr/1192000/apVhdService_OpzEn/getOpnOpzEnWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: false
        desc: 좌표체계 EPSG:5179 좌표계 지원
      - name: bbox
        required: true
        desc: 요청 객체의 Bounding box xmin,ymin,xmax,ymax 순서
      - name: width
        required: true
        desc: '반환 이미지의 너비 (단위: 픽셀)'
      - name: height
        required: true
        desc: '반환 이미지의 높이 (단위: 픽셀)'
    approval: auto
    traffic:
      dev: 4000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getOpnOpzEnWFS
    name: 해양용도구역_에너지개발구역 WFS 조회
    endpoint: https://apis.data.go.kr/1192000/apVhdService_OpzEn/getOpnOpzEnWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: bbox
        required: false
        example: 718918.25,1433106.875,1249928.75,2071446.875
        desc: 요청 객체의 Bounding box xmin,ymin,xmax,ymax 순서
      - name: maxFeatures
        required: true
        example: '10'
        desc: '출력되는 피처의 최대 개수(최대값 : 100)'
      - name: ntfc_year
        required: true
        example: '2022'
        desc: 고시년도
      - name: area_id
        required: false
        example: '0004'
        desc: 지역아이디
    approval: auto
    traffic:
      dev: 4000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
