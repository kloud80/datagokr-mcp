summary_user: 어선 한 척씩의 측정 결과를 담은 파일로, 선적항·선박재질·건조지·진수일자와 총톤수·길이·너비·깊이·캠버, 상갑판 위아래 용적 같은 측정 사양을 행 단위로 담고 범위는 전국이다. 분석가가 "선적항별로 어선의 총톤수나 길이 분포가 어떻게 다른가", "재질·건조지·진수 연도별로 어선 규모가 어떻게 달라졌나" 같은 질문에 쓴다. 전역 조인 키가 없어 어선 등록·허가 원장이나 해운·항만 선박 데이터와는 선적항 이름이나 선박구분코드 같은 이름·코드 매핑으로만 이어 쓴다.
