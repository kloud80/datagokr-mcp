description_portal: '한국해양진흥공사(KOBC)가 운영하는 한국형 건화물선 운임종합지수 (KDCI)는1. 데이터 수집 목적 원자재 운송 시장의 투명성 강화 : 철광석, 곡물, 석탄 등 주요 원자재 운송용 건화물선의 운임 정보를 종합하여 투명한 시장 정보를 제공함으로써    시장 신뢰도와 정보 접근성을 향상시킵니다.  정책 및 산업 분석 기반 제공 : 해운·물류 정책 수립, 산업 분석, 금융기관 및 투자자의 의사결정을 위한 신뢰할 수 있는 데이터 포인트를 제공합니다. 2. 데이터 수집 및 산출 과정 지수 구성 방식 : KDCI는 케이프사이즈(Cape), 파나막스(Panamax), 수프라막스(Supramax), 핸디사이즈(Handysize) 4개 선형(time‑charter)에 대한 운임지수를 종합하여 산출합니다.  가중 비율 : 각 선형의 운임지수는 다음과 같은 비율로 가중평균되어 KDCI에 포함됩니다:                    - Cape: 30%, Panamax: 30%, Supramax: 30%, Handysize: 10% 항로 포함 수 : 총 27개 항로에 대한 일간(time‑series) 운임지수를 제공하며, 이를 기반으로 종합지수를 구성합니다. 지수 발표 주기 :일일 운임지수 및 주간/월간 보고서 형태로 정기 발표하며, 공식 데이터는 KOBC 웹사이트 또는 블룸버그 터미널을 통해 공개됩니다.3. 데이터 세부 항목 개별 선형 운임지수 : Cape, Panamax, Supramax, Handysize 별 운임지수 및 일일 평균 정기용선료에 기반한 정보..종합지수 (KDCI 값) : 위의 가중방식을 적용하여 산출된 종합 지수로, 일반적으로 수천 단위의 포인트로 제공됩니다. 예: 최근 기준 KDCI는 약 18,878 포인트 수준 시장 상황 지표 구성 : 각 선형 운임 동향 분석과 시장 변동성 모니터링, 세계 주요 지수(BDI 등)와 비교 가능한 공신력 있는 벤치마크 역할 수행. .외부 기관 등재 및 활용 : KDCI는 블룸버그 터미널에 등재'
