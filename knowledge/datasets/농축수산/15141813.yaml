summary_user: 도매시장에 전자송품장으로 입력된 출하 예약 물량을 건별로 담으며, 출하예정일·도매시장·법인·상품 대·중·소분류와 출하수량(spmt_qty)을 전국 범위로 제공한다. 농산물 유통업자나 분석가가 특정 품목이 언제 어느 도매시장으로 얼마나 들어올 예정인지 확인해 반입 물량과 가격 흐름을 가늠하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 도매시장·법인·품목·단위·산지 등의 코드를 aT 농축수산물 표준코드 API로 풀어 이름이나 같은 기관 코드로 다른 도매 경락·반입물량 데이터와 연결한다.
description_portal: '도매시장에서 전자송품장으로 입력된 출하 물량 예약 정보로 출하예정일, 도매시장코드, 도매시장명, 법인코드, 법인명, 상품대분류, 상품중분류, 상품 소분류 정보 등을 제공합니다.★ API 명세서가 첨부되어있습니다. API 활용에 참고하실 수 있습니다.코드 정보는 한국농수산식품유통공사_농축수산물 표준코드 API를 조회 후 확인바랍니다. (https://www.data.go.kr/data/15141818/openapi.do)코드 종류 :whsl_mrkt_cd : 도매시장 코드corp_cd : 법인 코드unit_cd : 단위 코드sz_cd : 크기 코드plor_cd : 산지 코드pkg_cd : 포장 코드grd_cd : 등급 코드gds_lclsf_cd : 품목 코드 (대분류)gds_mclsf_cd : 품목 코드 (중분류)gds_sclsf_cd : 품목 코드 (소분류)* 일자관련 요청파라미터는 YYYY-MM-DD 형식으로 입력해야 정상적으로 처리됩니다.'
