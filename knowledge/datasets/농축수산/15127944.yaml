description_portal: 이 데이터는 해양수산부에서 도선지원 밀집도 요청 이력 관리를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 지능형 해상교통정보시스템(바다내비)를 통해 도선사예선지원서비스(SV51)를 지원하기 위해 요청된 밀집도 정보의 이력으로 구성되어 있습니다. 해당 이력 데이터에는 메시지 ID, 요청 선박 정보, 일시, 좌표, 범위 등 데이터를 포함하고 있습니다.본 데이터는 항만 운영기관, 해양교통 관련 정책 입안 기관, 해상 안전관리 부서 등에서 도선 지원 상황의 모니터링, 해상 교통혼잡 예측 및 효율적 인력 배치 계획 수립, 그리고 향후 시스템 운영 개선을 위한 참고자료로 활용될 수 있습니다.
