summary_user: 경기도 사이버식물병원에서 병해 진단 대상이 되는 작물(작목)의 목록을 작목 하나당 한 행으로 담은 기준 코드표이며, 상위 작목 번호(up_tre_no)와 깊이로 대분류~소분류 계층을 이룬다. 진단 의뢰나 작목별 증상 자료를 분석하는 사람이 '이 작목 번호가 어떤 작물이고 어느 분류에 속하나'를 확인할 때 쓴다. 같은 시스템의 진단 의뢰·작목 증상 테이블과는 작목 번호(tre_no)로 잇지만, 실측에서 전역 조인 키는 찾지 못해 KAMIS 품목코드 등 다른 기관 자료와는 작물 이름 매핑으로만 연결된다.
description_portal: 작목 테이블은 사이버식물병원 시스템에서 진단 대상이 되는 작물의 정보를 제공하는 기본 데이터입니다. 각 작물은 고유한 작목_번호를 통해 식별되며, 작목_이름은 사용자가 입력한 병해 의뢰 시 선택할 수 있는 작물명을 의미합니다. 작물은 계층적으로 분류되어 있으며, 상위_작목_번호를 통해 대분류~소분류 형태의 작목 분류 체계를 구성합니다.등록자_번호, 등록일자, 수정일자는 작물 정보의 변경 이력을 관리하는 데 활용됩니다. 본 테이블은 진단_의뢰, 작목_증상 등 다양한 테이블에서 참조되어 병해 발생 작물의 특성과 통계를 분석하는 데 활용됩니다.
