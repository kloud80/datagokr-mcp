description_portal: 이 데이터는 서귀포시 관내 농가들이 판매한 농산물의 품목별 판매량, 판매 금액, 출하 시기 및 판매 형태(직거래, 위탁, 도매 등)를 연도별·품종별로 정리한 통계 자료입니다. 농가는 이 정보를 활용해 어느 품목이 얼마나 판매되었는지, 어떤 판매 경로가 효과적이었는지를 확인할 수 있으며, 지자체 및 유통업체는 소비 동향과 시장 변화에 맞추어 재배 품종 선정, 유통지원 정책, 직거래 활성화 전략 등을 설계하는 데 중요한 근거로 활용됩니다. 농업 연구기관은 생산과 판매 간의 연계성을 분석하여 농가 소득 증대 및 농업경영 개선을 위한 자료로 삼을 수 있습니다.
