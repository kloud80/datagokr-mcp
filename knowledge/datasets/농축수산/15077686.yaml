description_portal: '제주특별자치도에서 생산되는 고품질 감귤의 당도 품질을 측정하기 위해 수집된 2020년 11월부터 12월까지의 데이터로, 제주도 내 총 44개 지역을 대상으로 조사한 감귤 당도 관련 정보입니다. 본 데이터는 각 지역별 농가 또는 농업 기반지를 기준으로 감귤의 품질을 정량적으로 파악하기 위해 구축되었으며, 구성 항목으로는 관리번호, 지역(시), 지역(읍/면/동), 경도, 위도, 경사정도(0: 없음, 1: 중간, 2: 가파름), 원지정비 여부(O, X), 나무 간격(m), 시설 보유 여부 및 종류(예: 방풍망, 점적호스 등), 그리고 주차별 당도(Brix) 수치가 포함되어 있습니다. 당도 정보는 2020년 11월 1주차부터 12월 1주차까지 주차 단위로 세분화되어 있어, 시기별 품질 변화 추이를 비교할 수 있는 구조로 되어 있으며, 데이터는 제주 지역의 감귤 재배 환경과 품질 관리 수준을 파악하는 데 매우 유용하게 활용될 수 있습니다.'
