description_portal: 이 데이터는 여객선 운항 전 검사 정보를 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 지능형 해상교통정보시스템(바다내비)을 활용하여 여객선이 운항을 시작하기 전에 실시한 각종 검사 결과에 대한 정보로 구성되어 있습니다. 검사 항목에는 선내 시스템의 원격 모니터링 서비스(SV20) 관련 점검 결과와 2024년 1월부터 4월까지의 여객선별 운항 전 검사 실시 여부 및 점검 항목별 결과가 포함됩니다.  본 데이터는 여객선 운항 전 안전관리를 위한 기초자료로 사용될 수 있으며, 여객선 운항 승인 관련 행정업무, 해양안전 정책 수립, 운항 현장 인력의 준수사항 점검, 선박관리기관의 내부 품질관리 및 관련 분석자료 제공 등에 활용할 수 있습니다.
