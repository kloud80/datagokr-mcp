description_portal: 이 데이터는 해양수산부에서 해양생물종기본정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 학명, 국명, 영명, 종동정등급, 생물분류대분류, 생물분류중분류, 생물분류소분류, 천연기념물여부 등의 데이터로 구성되어 있습니다.본 데이터는 해양생물종 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양생물종이란 바닷물이나 기수 등 해양 서식지에 사는 모든 종류의 생물을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
