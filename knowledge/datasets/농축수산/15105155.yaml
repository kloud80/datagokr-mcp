services:
  - op: /gethorseinfohi
    name: 말정보 및 개체식별_1
    endpoint: https://apis.data.go.kr/B551015/horseinfohi/gethorseinfohi
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: hrname
        required: false
        example: 남산꽃
        desc: 마명
      - name: hrno
        required: false
        example: '0043225'
        desc: 마번
      - name: reg_dt_fr
        required: false
        example: '20210114'
        desc: '경주마 등록 검색시작일 '
      - name: reg_dt_to
        required: false
        example: '20210114'
        desc: '경주마 등록 검색종료일 '
      - name: _type
        required: false
        example: xml
        desc: 데이터형식변경
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 3000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
