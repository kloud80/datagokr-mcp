summary_user: 한국마사회에 등록된 경주마·승용마·관상용마 등 마필 한 마리씩의 개체식별 정보를 담는 건별 원천 API로, 마명·마번·마이크로칩번호·국제마번·혈통(부마·모마)·출생일·폐사일·소유자·소재지·털색과 머리·목·몸통 특징 등을 전국 범위로 제공한다. 말 구매자나 소유자, 경마 분석가가 특정 마필의 혈통·등록 이력과 현재 소유자·용도, 칩번호를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 경주·혈통 데이터와는 마번(hrno)이나 마명으로만 이어 쓴다.
limits: 다른 기관 데이터와 붙일 공통 코드가 없어 이름·마번 매칭이나 같은 기관 코드로만 연결된다. 부문은 농산물 유통 가격으로 분류돼 있지만 가격·유통 정보는 담지 않는다. 개발계정은 하루 3,000회 호출로 제한된다.
