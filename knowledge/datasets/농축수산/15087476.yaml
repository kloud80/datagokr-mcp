summary_user: KAMIS가 5개 도시 16개 도매시장에서 매일 조사한 농축수산물 가격을 모아 69개 품목·116개 품종, 상품·중품 2개 등급별 월평균 도매가격으로 정리한 집계 파일이며, 연도·품목명·품종명·등급명·평균가격·거래 단위(무게·단위명) 7개 컬럼을 담는다. 분석가나 사업자가 '감자 같은 특정 품목의 도매가격이 해마다·달마다 어떻게 움직였나'처럼 품목별 시계열 가격 추이나 도소매 가격 차이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 소매가격 등 다른 KAMIS 자료와는 품목명·품종명·등급명을 이름으로 맞춰 연결해야 한다.
limits: 품목·품종 코드가 없고 이름만 있어 다른 데이터와 붙일 때 이름 매핑이 필요하며, 수산물 어종코드는 수협·수산과학원·HS 체계가 서로 달라 맞추기 어렵다. 범위가 전국 단위라 시장별·지역별 가격은 구분하지 못한다.
