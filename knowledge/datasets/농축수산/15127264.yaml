description_portal: 데이터 수집 목적 및 과정무분별한 어획으로 인한 수산자원 고갈을 방지하고, 어업의 지속가능성을 확보하기 위해 우리나라는 특정 어종에 대해 연간 잡을 수 있는 총허용어획량(TAC, Total Allowable Catch)을 설정하고 있습니다. 본 데이터는 TAC 대상 어종별 연간 어획량 한도와 실제 어획 실적, 제도 운영 현황 등을 종합적으로 관리하기 위해 구축되었습니다. 해양수산부와 한국수산자원공단이 중심이 되어 각 어종별 자원 조사, 업종별 어획 실적 보고, 판매소 집계 자료 등을 수집·정리하여 생산된 데이터입니다.데이터 세부 항목데이터는 (제도 운영 현황) TAC 대상 어종 및 업종, 설정 연도, 허용 어획량, 어획 기간, (실적 자료) 업종별·지역별 어획량, 어획량 대비 허용량 준수율, 지정판매소 거래 현황, (관리 정보) 자원 조사 결과, 제도 운영 관련 통계 등으로 구성되어 있습니다. 또한 연도별 변화 추이와 관리 대상 확대 현황을 함께 제공하여 정책 및 연구에서 활용할 수 있도록 체계화되어 있습니다.활용 기대효과어업인은 TAC 제도 데이터를 통해 연간 허용 어획량과 자신의 업종별 할당량을 명확히 확인함으로써 합법적인 범위 내에서 안정적으로 조업을 계획할 수 있습니다. 정부와 지자체는 본 데이터를 기반으로 어종별 자원 상태를 분석하고, TAC 확대 방안과 제도 개선안을 마련할 수 있으며, 학계와 연구기관은 자원 평가 모델 검증, 어획 동향 분석, 지속가능 어업 연구 등에 활용할 수 있습니다. 또한 일반 국민은 TAC 제도 데이터를 통해 수산자원 관리 정책의 필요성과 효과를 이해하고, 지속가능한 수산물 소비에 동참할 수 있습니다.※ 제공 데이터는 조사·집계 과정에서 품질관리 및 익명 처리 절차를 거쳐 일부 원자료와 차이가 있을 수 있습니다.
