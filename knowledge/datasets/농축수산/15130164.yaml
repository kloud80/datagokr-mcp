summary_user: 「해양심층수법」에 따라 지정된 해양심층수 취수해역의 경계를 면(폴리곤) 단위로 담은 SHP 공간정보 파일(zip 약 56KB)이며, 해역 명칭, 관계법령, 제·개정일, 관계기관, 일일 최대 취수량을 함께 담는다. 해양심층수 개발 사업자나 연구기관이 '사업 예정지가 지정된 취수해역 안에 있는지, 그 해역의 하루 최대 취수량은 얼마인지'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 해역 명칭 매핑이나 공간 중첩(다른 해양용도구역·보호구역 면 자료와 겹쳐 보기)으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「해양심층수법」 제3조 및 제9조에 따라 지정된 해양심층수 취수해역 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해양심층수 취수해역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해역의 명칭, 관계법령, 제/개정일, 관계기관 및 일일 최대 취수량 등 정보를 포함하고 있습니다.  본 데이터는 해양심층수 개발사업에 참여하는 업체의 사업계획 수립, 해양 관련 연구기관의 적합 해역 탐색, 정책 입안부서의 해양심층수 관리 및 보전 정책 자료 등으로 활용될 수 있습니다.
