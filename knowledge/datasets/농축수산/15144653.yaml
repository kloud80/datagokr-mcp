summary_user: 농식품 공공데이터포털에 등록된 데이터셋마다 어떤 컬럼이 있는지를 컬럼 단위로 정리한 메타데이터로, 엔티티별 컬럼 이름·설명·순서와 코드 사용 여부·그룹 코드, 개방·사용·필터 여부를 담는다(전국 범위, 비공간). 분석가나 개발자가 농산물 가격 같은 농식품 데이터를 쓰기 전에 "이 데이터셋에 어떤 항목이 있고, 어느 컬럼이 코드값인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 엔티티 아이디나 컬럼명을 이름 매핑해서 같은 기관 데이터셋의 구조를 대조하는 식으로만 잇는다.
description_portal: 본 데이터는 농림축산식품부에서 관리하는 농식품 공공데이터포털에 등록된 각종 데이터셋의 속성 컬럼 정보를 체계적으로 정리한 자료입니다. 데이터셋별로 포함된 주요 항목들의 명칭, 유형, 길이, 설명 등을 상세히 수록하여 데이터의 구조와 내용을 명확히 파악할 수 있도록 지원합니다. 이를 통해 데이터 이용자들이 농식품 관련 공공데이터를 효율적으로 이해하고 활용할 수 있는 기초 정보를 제공합니다. 또한, 데이터 표준화와 관리 체계 확립에 기여하며, 농업 및 식품 분야의 다양한 연구와 정책 개발에 활용될 수 있습니다. 해당 자료는 데이터의 정확성과 신뢰성을 높이고, 공공데이터의 품질 향상을 위한 중요한 기반이 됩니다.
