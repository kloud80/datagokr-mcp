description_portal: 본 데이터는 경상남도 남해군에 정식으로 등록된 모든 수상레저기구의 상세 제원 및 등록 현황 정보를 체계적으로 제공합니다. 이는 지역 내 수상레저 활동의 안전 관리 강화, 관련 법규 준수 유도, 그리고 해양관광 자원의 효율적이고 지속가능한 활용을 지원함을 주요 목표로 합니다. 각 수상레저기구별로 법적 효력을 갖는 '등록일자', 개인 또는 법인 등 '소유구분', 모터보트, 요트, 수상오토바이 등 구체적인 '기구종류', 해당 기구의 고유 '기구명'(선명), 선체의 크기를 나타내는 '총톤수', 그리고 안전 운항의 기준이 되는 최대 '승선정원' 등 핵심적인 관리 정보를 상세히 포함하고 있습니다. 이 자료는 남해군 관내 수상레저기구의 안전 점검 및 체계적인 관리, 수상 사고 예방 대책 수립, 관련 등록 및 검사 업무의 효율화, 그리고 해양레저관광 활성화를 위한 정책 개발 및 통계 분석의 중요한 기초자료로 활용
