summary_user: 농업용어를 한글·한자·영어·일본어·중국어·북한용어·알기쉬운농업용어의 7개 언어 구분으로 나눠 용어명과 용어설명을 담은 전국 단위 비공간 사전 원천 파일이며, 포털 설명상 2009년 11월부터 2021년 6월까지 등록된 용어를 담는다. 농업 문서를 번역하거나 쉬운 말로 바꾸려는 사람, 또는 기관 공문의 어려운 농업용어를 풀이하려는 분석가가 '이 농업용어의 영문·한자 표기와 쉬운 말은 무엇인가'를 찾는 데 쓴다. 이어 쓸 키는 언어코드(term_lang_cd) 하나뿐이고, 이 키로 언어별 용어를 묶거나 다른 용어집의 언어 구분과 맞춘다. 품목코드나 지역코드 같은 다른 공통 키는 없다.
description_portal: 농업용어사전은 언어별로 구분되어 실제 용어를 국문/영문/한자 등의 언어로 작성된 농업용어를 구분하여 관리하기 위한 자료입니다.용어사전의 구분은 한글, 한자, 영어, 일본어, 중국어, 북한용어, 알기쉬운농업용어로 구분되어 있습니다.각각의 언어를 구분하기 위한 코드형태로 분류하여 7건의 데이터가 등록되어있습니다.각언어별로 등록된 전체 데이터는 414,905건 입니다.데이터의 발생시점은 신규발굴되는 용어가 존재할 경우 해당 용어의 적합성 등을 검토하여 등록합니다.최초 데이터는 2009년 11월에 등록되었으며 최종 데이터는 2021년 6월에 등록되었습니다.용어정보의 변경이 발생 할 경우 수시로 수정됩니다.
