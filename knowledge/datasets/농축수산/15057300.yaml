summary_user: 농림축산검역본부가 관리하는 소의 품종별·암수별 도축실적을 월(YM) 단위로 담은 전국 단위 집계 데이터로, 당월 실적과 누계가 함께 들어 있다. 축산업계나 연구자가 "한우 암소 도축이 최근 몇 달 사이 늘었는가"처럼 품종·성별 도축 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 축종·세부축종 코드나 이름을 매핑하거나 같은 기관 자료와 연결해야 하며, KAMIS 등 가격 데이터와 이으려면 품목코드 매핑이 따로 필요하다.
description_portal: 지역별, 축종(품종)별, 도축장별 도축검사실적- 본 데이터는 농림축산검역본부에서 관리하는 소 품종별, 암수별 도축실적 현황을 제공함- 도축 개체는 암수 구분이 포함되어 세부적인 성별별 도축 현황 파악이 가능함- 도축검사 결과를 통해 위생 기준 충족 여부, 부적합 사례, 질병 발생 여부등 파악을 위한 참조자료로 활용 가능- 정부와 지자체는 본 데이터를 활용하여 축산물 위생정책 수립, 도축시설 감독, 식품 안전관리 강화 수행에 필요한 업무 수행 가능- 축산업계와 연구기관등은 품종별,성별 도축 추세를 분석하여 관련 업무에 대한 참조 자료로 활용 가능
