description_portal: 이 데이터는 해양수산부에서 지능형 해상교통정보시스템(바다내비)내 시스템 상태에 대한 코드 및 내용 정보를 관리, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 분석 아이디, 시스템 코드, 에러 보고 일시, 에러 코드, 에러 상세내용 및 등록/수정일자, 등록/수정자 정보 등으로 구성되어 있습니다.  본 데이터는 바다내비 시스템 관리기관에서 운영 현황 점검, 에러 발생 원인 분석, 시스템 유지관리 계획 수립, 해상교통 안전관리 체계 마련 등 활동을 위한 기초 자료로 활용될 수 있습니다. 또한, 바다내비 시스템 사용자들에게 에러 대응법 마련 등 업무를 위해 활용할 수 있습니다.
