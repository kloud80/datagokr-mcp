legal_basis_portal: TPP 협정 제7.13조 제5항 (투명성 의무사항)웹사이트 등 전자적인 방식을 통해 제안된 SPS조치와 법적근거, 그리고 대중으로부터 받은 서면의견이나 그 요약본을 공개할 의무가 있음. 또한 WTO/SPS 통보시스템을 통해 모든 SPS 조치를 통보하고 전자시스템을 통해 관련 근거 및 서면의견을 공개하는 것은, TPP/SPS에서 새롭게 다뤄진 의무사항임.
