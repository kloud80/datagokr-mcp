summary_user: 2011~2019년 제주도 안에서 이뤄진 불법 어업 단속 건수를 연도별로 선적지·어업 구분(대분류·소분류)에 따라 집계한 통계로, 건별 단속 원천 기록이 아닌 집계 자료다. 연구자나 해양 관련 기관이 '제주에서 어떤 어업 형태의 불법 조업 단속이 해마다 늘었나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 어업 구분 이름을 맞춰 붙이거나, 같은 기관의 다른 자료와 이어 써야 한다.
description_portal: '제주특별자치도 제주 불법 어업 단속 현황 데이터는 2011년부터 2019년까지 도내에서 이뤄진 불법 어업 단속 건수를 선적지, 어업 구분별로 집계한 통계자료이다. 해당 자료는 어떤 어업 형태(예: 어선어업, 낚시어선 등)에서 단속이 이루어졌는지, 연도별 단속 건수 추이, 주요 단속 지점의 선적지 정보 등을 포함하고 있어 제주 지역 해양자원 보호 실태와 불법 조업 경향을 분석하는 데 유용하다. 이 데이터를 바탕으로 제주도청이나 해양 관련 기관은 단속 정책의 효과를 평가하거나 향후 단속 계획을 수립할 수 있으며, 연구자나 환경 단체는 지역 해양생태계 보전, 불법 조업 방지 방안 마련, 어업관리 실태 분석 등에 활용할 수 있는 기반 통계로서 활용 가치가 높다.'
