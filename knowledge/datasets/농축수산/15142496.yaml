summary_user: IPCC 6차 평가보고서 기후변화 시나리오를 따른 지역 해양기후 수치모델로 전망한 우리나라 주변 해역의 해수유동 값을 위·경도 격자 지점별로 담으며, 포털 설명상 2015년부터 2100년까지의 전망치이다. 연구자나 연안 관리 담당자가 '특정 해역의 해류 흐름이 고배출 시나리오에서 금세기 말까지 어떻게 달라지는가'처럼 시나리오(sspSeCd)별 미래 해수유동 변화를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표 범위를 맞추거나 시나리오·지표 구분 코드를 같은 기관의 다른 기후전망 데이터와 대응시켜 연결한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 IPCC 6차 평가보고서의 기후변화 시나리오를 따른 지역 해양기후 수치예측모델을 기반으로 전망된 우리나라 주변 해역의 해수 유동 예측정보를 제공하기 위해 수집한 데이터입니다.검색대상 위치의 최대/최소 위·경도 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 2015년부터 2100년까지 전망된 해수유동 값 등 정보로 구성되어 있습니다.  본 데이터는 관련 기관에서 해양 환경 변화 연구, 해양 재해 예방 대책 수립, 해양 자원 관리 전략 개발 등을 위한 기초 자료로 활용될 수 있습니다.
