summary_user: 농업인 개인(개인일련번호)과 그가 입력한 농지 필지(농지 일련번호)별로 주소·주소코드와 공부상 면적, 실제 면적, 휴경·폐경 등 미이용 면적, 비닐온실 시설 면적을 담은 건별 원천 파일로, 범위는 전국이며 위치는 개별 주소 단위입니다. 정책 분석가가 "어느 지역 농업인의 보유 농지 중 휴경·폐경으로 놀리는 면적이 얼마나 되는가"처럼 농지 이용 실태와 규모화 정도를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 농지·행정 데이터와는 농지 주소코드나 주소 문자열을 이름·코드 매핑으로 맞춰 연결해야 한다.
limits: 개인정보·민감정보 때문에 일부만 제공되는 파일이라 전체 농업인·농지를 대표한다고 보기 어렵다. PNU 같은 공통 필지 키가 실측 컬럼에 없어 팜맵 필지·농업진흥지역 정보와 바로 조인되지 않는다.
