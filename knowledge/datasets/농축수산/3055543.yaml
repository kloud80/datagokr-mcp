summary_user: 농지를 전용하는 자에게 부과하는 농지보전부담금의 시도별 실부과·총수납·수납·가산금·환급의 건수와 금액, 징수율을 담은 집계 파일이며, 필지나 건별 원천이 아니다(파일 크기 약 1.4KB). 분석가나 정책 담당자가 '어느 시도에서 농지전용 부담금 부과와 징수율이 높고 환급은 얼마나 되나'처럼 지역별 농지전용 규모와 징수 실적을 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시도명(구분)을 이름으로 맞춰 시도 단위 농지전용·농업진흥지역 통계 등과 나란히 놓고 봐야 한다.
