description_portal: 이 데이터는 서귀포시 관내 농가들의 재배시설 현황을 정보화한 통계자료입니다. 특히 만감류 중심의 시설재배 농가들이 사용하고 있는 재배 하우스 유형, 면적, 구조, 설비내용 등이 포함되어 있으며, 2021년 ‘공공데이터 기업매칭지원사업’의 산출물로서 농가의 재배여건 개선과 생산성 향상을 위해 구축되었습니다. 이를 통해 농업 경영체는 시설효율성, 설비투자 계획, 재배환경 개선 방향 등을 분석할 수 있고, 지자체는 농업 첨단화 및 스마트팜 보급정책 수립, 지원대상 선정 등에 활용할 수 있는 유용한 자료입니다.
