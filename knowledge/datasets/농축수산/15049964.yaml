description_portal: 농촌진흥청 농촌인적자원개발센터에서 관할하는 다양한 교육기관의 코드 및 명칭, 표준코드 정보를 체계적으로 관리하는 공공데이터입니다. 교육기관코드, 기관명, 과정별 교육분야 매핑코드, 품목별 표준코드 등 교육기관 및 관련 과정·품목의 코드 정보를 통합적으로 제공하여, 농업·농촌분야 교육과정 운영, 교육기관 현황 파악, 품목별 표준화 등 다양한 분야에 활용할 수 있습니다. 예시로 농촌진흥청, 국립농업과학원, 국립원예특작과학원, 국립식량과학원, 국립축산과학원 등의 기관코드와 이름 정보가 포함되어 있습니다.
