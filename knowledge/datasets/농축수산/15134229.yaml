summary_user: 산림보호법에 따라 등록된 나무병원을 법인 한 곳당 한 행으로 담으며, 법인명·대표자·사업종류·주소(시도·시군구·상세주소·우편번호)·영업/폐업 상태를 제공한다. 검증 호출 때 API가 알린 전체 건수와 실제 수신 행은 모두 1건이었고, 범위는 전국, 위치 단위는 개별 주소이다. 수목 관리를 맡길 사업자나 분석가가 '우리 시·군·구에 영업 중인 나무병원이 있는가'를 확인하는 데 쓰고, 주소(lctnaddr)와 상세주소(lctndaddr)를 조인 키로 삼아 주소 기반 지오코딩이나 행정구역 자료와 이어 쓴다.
description_portal: 산림보호법에 따라 관리되는 연도별 나무병원 등록 현황 자료는 각 법인의 운영 실태와 제도적 기반을 종합적으로 보여줍니다. 주요 항목에는 나무병원의 법인명과 대표자명, 수행하는 사업 종류가 포함되어 있으며, 이를 통해 사업의 성격과 목적을 확인할 수 있습니다. 또한 법인의 주소, 등록 시·도 정보가 기재되어 지역별 분포와 관리 현황을 파악할 수 있습니다. 아울러 영업 또는 폐업 여부가 함께 기록되어 있어 운영 지속성 및 행정적 관리의 투명성을 확보합니다. 이러한 자료는 산림병해충 방제, 수목 건강 관리, 전문 인력 배치 현황 등 정책적 의사결정과 국민 생활 환경 개선에 중요한 기초 자료로 활용됩니다.
