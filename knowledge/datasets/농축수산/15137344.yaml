description_portal: 농촌진흥청은 한식 요리에 사용되는 다양한 재료, 예를 들어 채소, 소스 등 각종 식재료 정보를 체계적으로 제공하고 있습니다. 또한, 각 요리를 준비할 때 필요한 재료의 정확한 양과 조리 방법까지 안내하여, 누구나 손쉽게 한식을 조리할 수 있도록 돕습니다. 이 서비스는 요리에 대한 기초 지식이 없는 사람도 따라할 수 있도록 구성되어 있으며, 가정에서의 건강한 식생활 실천과 한식 문화 확산에 기여합니다. 농촌진흥청은 이러한 정보를 통해 국민이 한식의 다양한 맛과 영양을 올바르게 경험하고, 재료 선택과 활용에 대한 이해를 높일 수 있도록 지원하고 있습니다.
