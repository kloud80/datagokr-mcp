summary_user: 갯벌어장의 관측정점별·관측일시별 정기조사 측정값을 담은 건별 파일(csv, 약 33KB)로, 수온·염분·용존산소·pH·COD·용존무기질소·용존무기인·클로로필과 퇴적물 COD·강열감량·산휘발성황화물을 담는다. 굴·조개 등을 채취하는 갯벌어장의 수질·퇴적물 상태가 정점별로 어떻게 변하는지 확인하려는 어업인·지자체 담당자·해양환경 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 관측정점 이름을 매핑하거나 같은 기관의 코드로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 갯벌어장 준실시간(정기조사) 측정에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일시, 관측정점, 수온, 염분, 측정값(DO), 측정값(ph), 측정값(cod), 측정값(din), 측정값(dip), 측정값(chl), 측정값(sed_cod), 측정값(sed_il), 측정값(sed_AVS) 데이터로 구성되어 있습니다.본 데이터는 갯벌어장 준실시간(정기조사) 측정정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.갯벌어장이란 갯벌에 서식하는 풍부한 수산자원을 활용하여 굴, 조개 등의 어패류를 채취하는 등 어업 활동을 하는 곳을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
