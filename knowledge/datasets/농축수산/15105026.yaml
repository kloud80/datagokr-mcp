description_portal: 경기도 여주시의 보호수 현황 자료는 지역 내 소중한 자연자산을 체계적이고 지속적으로 보전·관리하기 위하여 구축된 공적 행정자료입니다. 본 자료에는 보호수의 관리기관명과 지정번호, 보호수 지정일자를 비롯하여 보호수 유형명, 학명, 나무종류 등 기본적인 현황 정보를 충실히 담고 있습니다. 또한 그루수, 나무나이, 나무높이, 가슴높이둘레, 나무갓지름 등 생육 상태와 규모를 객관적으로 확인할 수 있는 항목이 포함되어 있어 보호수의 보존 상태를 종합적으로 파악하는 데 활용할 수 있습니다. 아울러 나무품격명과 나무지목명은 보호수의 공적 가치와 토지 이용 현황을 이해하는 데 기초자료로 활용되며, 소재지 지번주소 및 위도·경도 정보는 보호수의 정확한 위치를 파악함으로써 효율적인 관리·점검과 재해 예방 및 대응 체계 마련에 기여합니다.
