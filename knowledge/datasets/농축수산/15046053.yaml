description_portal: 이 데이터는 해양수산부에서 수산정책자금 금리(농업자금 이차보전) 인하와 관련된 현황 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 원양어업경영자금, 피해복구자금 등 수산정책자금의 사업명칭과 2012년부터 2016년까지의 금리인하 정보로 구성되어 있습니다.  본 데이터는 수산업 관련 기관 및 정책 담당자가 수산정책자금의 금리 변화 추이를 분석하고, 정부 부처에서 수산업 지원정책 마련 시 기초자료로 활용할 수 있습니다. 또한 수산업 종사자들과 금융기관은 수산정책자금의 지원 조건을 확인하고 신규 정책에 대한 준비나 대응 방안 마련에 참고할 수 있습니다.
