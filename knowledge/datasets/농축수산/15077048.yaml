description_portal: 본 데이터는 전라남도 목포시 관할 지역 내 감금류 가축을 사육하는 농장의 현황 정보를 포함하고 있습니다. 수록된 항목으로는 농장명, 축종(사육하는 가축의 종류), 사육 개체 수, 농장의 면적 등 규모 정보, 대표자 성명, 연락 가능한 전화번호, 주소, 농장의 위치를 나타내는 위도 및 경도 좌표 등이 포함되어 있습니다. 해당 자료는 지역 내 가축 사육 환경을 파악하고, 가축 위생 및 방역 관리, 축산 정책 수립 등을 위한 기초자료로 활용됩니다. 특히 축산물의 생산과 유통, 동물복지, 가축 질병 대응 등과 관련된 행정업무에 유용하게 쓰일 수 있도록 구성되어 있으며, 사용자가 위치기반 분석이나 공간정보 시스템(GIS)과 연계하여 활용할 수 있도록 위경도 정보도 함께 제공합니다. 체계적인 데이터 개방을 통해 시민과 전문가에게 정확한 정보를 제공합니다.
