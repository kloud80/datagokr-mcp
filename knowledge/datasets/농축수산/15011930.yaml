description_portal: '지역에서 생산되는 농산물을 사용하여 만든 지역특산주(탁주, 약주, 청주, 증류식 소주, 과실주, 리큐르, 기타주류 등)를 생산하는 업체 및 주종에 관한 데이터로 생산업체의 도로명 주소, 시군명, 주종, 제품의 주원료명(작물명 및 농산물), 제품의 알코올 도수에 관한 기본정보를 제공함.전통주의 정의 : 주세접과 전통주 산업법에 전통주 + 전통주 등으로 규정하고 있음전통주에는 국가 및 시도 무형문화재 보유자가 제조한 술이나, 식품명인이 제조한 술을 민속주와 농업경영체 및 생산자 단체가 직접 생산하거나 제조장 관할 소재지 시군구 및 인접 시군구에서 생산한 농산물을 주원료로(상위 3개)로 사용하여 제조한 술을 말함.'
