description_portal: 이 데이터는 국립해양조사원에서 관리하는 해양관측부이 운영 현황 데이터입니다. 데이터에는 각 해양관측부이의 고유번호, 위치 좌표 등의 정보가 포함되어 있습니다.해양관측부이는 해양의 기초 환경 정보를 실시간으로 수집하는 무인 계측장비로서, 해수면 온도, 파고, 유속, 기압, 기온, 풍향·풍속 등 다양한 해양 및 기상 정보를 관측합니다. 이 장비는 부유 구조물 형태로 해상에 설치되며, 태풍, 고파 등 해양재해 대응뿐 아니라 기후변화 감시, 연안 관리, 수치 예보 모델링 등에 필수적인 자료를 제공합니다.
