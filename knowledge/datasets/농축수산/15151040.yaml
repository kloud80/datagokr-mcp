summary_user: 경기도 사이버식물병원에 접수된 식물 병해 진단의뢰 건마다 전문가나 진단 참여자가 남긴 의견을 의견 단위로 담는 건별 원천 데이터로, 의견 내용·작성자(전문가번호 또는 비회원 이름)·의견 등록일·첨부파일 정보가 들어 있다. 농업기술 교육자료를 만드는 사람이나 분석가가 "이 병해 의뢰에 전문가들이 어떤 진단 의견을 냈는가"를 확인하거나 의견 이력을 추적하는 데 쓴다. 같은 사이버식물병원의 진단의뢰 테이블과 진단의뢰번호(diagns_rqst_no)로 이어 쓰며, 이 키는 같은 기관 데이터 안에서만 통하고 다른 기관 데이터와 잇는 전역 조인 키는 없다.
description_portal: 진단_의뢰_전문가의견 테이블은 사이버식물병원 전문가 또는 진단 참여자가 특정 진단의뢰 건에 대해 작성한 의견 내용을 기록한 데이터입니다. 각 레코드는 진단의뢰번호를 기준으로 연계되며, 전문가의 의견, 작성자 식별자(전문가번호, 비회원_이름), 의견 작성일(의견_등록일), 첨부파일 정보(의견_첨부파일)를 포함합니다. 진단 의뢰건에 대한 전문가 의견이 포함되어 농업기술 교육자료 제작 등에 활용할 수 있습니다. 이 데이터는 진단_의뢰 테이블과 연계되어 관련 내용을 확인할 수 있으며, 병해 진단 정확성 향상 및 의견 추적 이력 관리에 활용됩니다.
