summary_user: 전국 로컬푸드 직매장을 매장 한 곳당 한 행으로 담은 목록으로, 시도·시군구, 매장명, 운영주체(농협 등), 주소, 연락처, 개장일을 포함한다. 소비자가 우리 동네 가까운 로컬푸드 직매장의 위치와 연락처를 찾거나, 분석가가 시군구별 직매장 분포와 개장 시기를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 주소를 행정구역 코드로 직접 매핑해서 이어 쓴다.
description_portal: '로컬푸드 직매장 현황(시군구, 사업장명, 농협명칭 등)제공 목록: 번호, 지역, 시군구, 사업장명, 농협명칭, 개장일, 전화번호, 주소의 내용을 담고 있습니다.직매장 운영 현황 자료는 지역 내에서 생산된 농산물의 공급과 판매 실적을 체계적으로 관리, 분석하기 위해 작성되는 기초 자료입니다. 이를 통해 직매장이 지역 농업인 소득 증대와 안정적 판로 확보에 얼마나 기여하고 있는지를 객관적으로 확인할 수 있으며, 소비자에게 신선하고 안전한 먹거리를 제공하는 기능을 평가할수 있습니다. 지역경제 활성화와 먹거리 선순환 체계 구축을 위한 중요한 참고자료로서의 역할을 수행할 것입니다.'
