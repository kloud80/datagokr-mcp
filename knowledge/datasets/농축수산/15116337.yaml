summary_user: 농지보전부담금 부과 내역을 집계월·관할청·부과구분·납입구분별로 묶어 농업진흥구역·보호구역·진흥지역 밖 등 농지 유형별 면적과 보전금·조성비·부담금·부과금액을 담은 전국 단위 집계 통계이며, 약 87MB 크기의 CSV 파일로 제공된다. 농지 전용 동향을 보는 분석가나 정책 담당자가 '어느 관할청에서 진흥구역 논이 얼마나 전용돼 부담금이 얼마나 부과됐나' 같은 질문에 쓴다. 전역 조인 키(PNU 등)가 없어 다른 데이터와는 관할청 이름이나 같은 기관의 코드 매핑으로만 연결한다.
description_portal: 농지법 제38조에 따라 부과하는 한국농어촌공사에서는 농지를 전요하려는 자에게 농지보전부담금을 부과징수 업무를 대행.- 농지를 전용하려는 자 등에게 농지의 보전·관리 및 조성에 소요되는 비용(농지보전부담금)을 부담하게 하는데, 이 농지보전부담금의 원활한 징수 및 관리 업무를 농지관리기금의 운용·관리업무를 위탁받은 한국농어촌공사가 대행함 - 대행 업무는 농지보전부담금 부과결정에 따른 통지서 발급, 농지보전부담금 수납처리 및 수납 보고, 지자체별 수수료 지급, 농지보전부담금 환급 업무임- 농지보전부담금 부과관련 통계자료로 집계월, 통계형태, 관할청, 발생근거, 납입문서, 농지별 면적/금액/건수 등 약 60여건의 항목을 제공함업데이트 주기는 1년으로 매년 7월에 업데이트 합니다.
