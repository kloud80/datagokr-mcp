summary_user: 국립농산물품질관리원이 유기농업자재 시험연구기관으로 지정한 기관을 기관 한 곳당 한 행으로 담은 전국 단위 목록으로, 지정번호·지정일자·기관명·대표자·소재지·연락처·시험분야를 담는다. 유기농업자재 제조·수입 사업자가 자재의 기준 적합 여부를 시험받으려 할 때 어느 지정기관이 어떤 시험분야를 맡는지, 어디에 연락하는지 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 소재지 같은 이름 매칭으로만 잇는다.
description_portal: 국립농산물품질관리원에서 관리하는 유기농업자재 시험연구기관 지정 현황으로서 지정번호, 지정일자, 기관명, 대표자, 소재지, 연락처, 시험분야에 대한 데이터로 구성되어 있습니다.  유기농업자재는 유기농산물을 생산, 제조·가공 또는 취급하는 과정에서 사용할 수 있는 허용물질을 원료 또는 재료로 하여 만든 제품으로 환경보전, 건강한 농산물 생산, 유기농업 실천농가에게 자재선택의 편의 제공을 목적으로 하고 있습니다. 이러한 유기농업자재 을 분석하여 기준 등 적정 여부를 최종 확인하여 유기농업자재 적정 여부를 시험하는 연구기관입니다.
