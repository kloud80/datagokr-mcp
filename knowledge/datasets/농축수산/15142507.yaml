summary_user: 전국 조위관측소별로 관측일시마다 실측 조위와 예측 조위를 관측소명·위도·경도와 함께 담은 건별 관측 API로, 검증 호출에서는 하루(2026-09-29) 기준 24행이 수신됐다. 낚시·해양레저 이용자나 어업인이 '오늘 이 관측소 앞바다의 실제 물 높이가 예측과 얼마나 다른가'를 확인하거나, 연구자가 조석 예측 오차를 분석하는 데 쓴다. 관측소 위도·경도 좌표(lat)를 키로 다른 해양 관측·예보 데이터나 지도 위치와 이어 쓰며, 조회 파라미터로 쓰는 관측소 코드는 국립해양조사원(바다누리) 자체 체계다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소를 통해 실측된 조위 및 예측 조위 정보를 제공하기 위해 수집한 데이터입니다.  관측소 코드, 관측일자 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 관측일시, 관측소의 위도/경도 위치정보 및 실측 조위와 예측된 조위 값 정보로 구성되어 있습니다.본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
