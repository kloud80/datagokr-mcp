summary_user: 경기도 고양시에서 처리된 산지전용허가를 건별로 담은 파일로, 허가일자·읍면동·지번·지적·허가면적·산지구분·전용목적을 읍면동 단위로 기록한다. 토지이용 분석가나 개발 사업자가 고양시 어느 동에서 어떤 목적으로 얼마만큼의 산지가 전용 허가됐는지, 보전·준보전산지 구분별로 허가가 어떻게 분포하는지 확인하는 데 쓴다. 전역 조인 키(법정동코드·PNU 등)는 없으므로, 읍면동 이름과 지번을 매핑해 토지이용규제·필지 데이터나 산림청 산지구분 원천과 이어 써야 한다.
description_portal: 경기도 고양시 산지전용 허가 현황 데이터로 번호, 허가일자, 읍면동, 지번, 지적, 허가면적, 산지구분, 전용목적 등의 항목을 제공합니다. 본 데이터는 경기도 고양시에서 처리된 산지전용허가 신청과 허가 결과를 정리한 자료로 산지이용변경의 추세와 지역별 허가 특성을 파악할 수 있습니다. 개발행위의 환경적 영향평가나 관리우선지역 도출에도 활용 가능합니다. 또한 읍면동별 전용면적 증감과 용도별 특성분석을 통해 산지보전정책수립과 지속 가능한 토지이용계획을 지원하는 기초 데이터입니다.
