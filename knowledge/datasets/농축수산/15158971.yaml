summary_user: 백두대간을 권역구간·상세구간 단위로 나눠 구간명, 지도상 거리와 실제 구간 거리(미터), 주요 볼거리, 대표 수종·식물·동물, 군락 정보와 개념·유래·가치 설명을 담은 전국 범위의 비공간 안내 데이터다. 등산객이 백두대간 종주 계획을 세울 때 특정 권역의 상세구간별 실제 거리와 볼거리를 확인하거나, 연구자가 구간별 대표 수종·군락을 살펴보는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 등산로·산 정보 등 다른 산림청 데이터와는 구간명·산 이름 같은 이름 매칭으로만 이어 쓴다.
