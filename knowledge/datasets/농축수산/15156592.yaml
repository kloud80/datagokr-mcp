summary_user: 전국 대나무 표준지 한 곳마다 주소와 소재지(시도·시군구), 해발고도·방위·경사도·지형, 수종·임종·수관밀도·면적, 토양형·토성·유효토심·배수·유기물·풍화정도 같은 입지·토양 조사값을 담은 표준지 단위 원천 정보다. 연구자나 지자체 담당자가 "우리 시군의 대나무림은 어떤 토양과 지형에 분포하고 수종은 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산림 통계와는 시도·시군구 이름이나 주소를 매핑해 붙여야 한다.
limits: 표준지번호(bambooSamplePlotId)는 이 데이터 안에서만 쓰는 식별자이고 법정동코드 같은 공통 키가 없어, 다른 데이터와는 이름 매칭으로만 연결된다. 호출에는 포털 활용신청 후 받는 serviceKey가 필요하며 개발계정은 하루 1,000회로 제한된다.
