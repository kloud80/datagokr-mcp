description_portal: "\uFEFF대나무자원정보 API는 국내 대나무 자원의 체계적인 관리와 연구를 지원하기 위해 개발된 데이터 서비스입니다. 해당 API는 표준지 번호, 상세주소, 해발고도, 방위, 수관밀도, 배수 상태, 유효토심, 임종, 지형, 수종, 유기물 함량, 면적, 토양형, 토성, 경사도, 풍화정도 등 다양한 환경 및 지리 정보를 포함하고 있어, 산림 생태 연구, 자원 분포 분석, 정책 수립 등에 활용될 수 있습니다. 특히 소재지 정보를 광역시/도 및 시/군/구 단위로 제공함으로써 지역별 자원 특성을 정밀하게 파악할 수 있으며, 연구자 및 행정기관이 대나무 자원의 현황을 효율적으로 분석하고 활용할 수 있도록 돕습니다."
