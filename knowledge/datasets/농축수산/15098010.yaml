status: active
summary_user: 전국 오감만족숲길 구간의 관심지점(POI)을 지점 한 건씩 담으며, 숲길명·장소명·장소 유형·위도·경도·해발고도·설명과 이정표 목적지(최대 4개)와 방향 정보를 함께 제공한다. 숲길 탐방객이나 지도·관광 서비스 개발자가 특정 숲길에서 이정표·쉼터 같은 지점이 어디에 있고 어느 방향으로 어디를 가리키는지 확인하는 데 쓴다. 전역 조인 키는 확인되지 않아 다른 데이터와는 숲길명·장소명 같은 이름 매칭이나 좌표를 기준으로 붙여 쓰고, 같은 기관의 숲길 데이터와는 숲길 식별자(frtrlId)로 맞춰 볼 여지가 있다.
limits: 실측 컬럼에서 전역 조인 키가 없어 행정구역 코드나 시설 코드로 다른 데이터와 바로 결합할 수 없고, 위치는 행정단위가 아닌 개별 좌표로만 주어진다. 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 10,000회로 호출이 제한된다.
