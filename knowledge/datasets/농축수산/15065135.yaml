description_portal: 경상북도 내 각 시군의 귀농 및 귀촌 가구원의 수를 연도별로 제공합니다. 2013년부터 2025년까지의 귀농 및 귀촌 가구원 수를 포함하고 있으며, 귀농과 귀촌을 구분하여 상세히 기록하였습니다. 귀농 가구원은 도시에서 농촌으로 이주하여 농업에 종사하는 가족 구성원을 의미하며, 귀촌 가구원은 농촌으로 이주하여 농업 외의 업종에 종사하는 구성원을 뜻합니다. 이 데이터는 경상북도의 농촌 인구 변화 및 구조 분석에 중요한 자료로 활용 가능하며, 농촌 사회의 인구 동향을 파악하는 데 유용합니다. 또한, 해당 데이터는 지역별 귀농 및 귀촌 인구의 증감 추이를 통해 농촌 활성화 정책 수립 및 평가에 기초 자료로 사용될 수 있습니다. 데이터는 시군명을 기준으로 정렬되어 있으며, 각 연도별 귀농 및 귀촌 가구원 수가 열(Column)로 나열되어 있어 경상북도의 농촌 인구 변화를 쉽게 확인할 수 있습니다.
