summary_user: 대구광역시 동구 안의 산림욕장을 등록번호 단위로 한 건씩 담고, 시도·시군구, 산림욕장 이름(MTST_BTBS), 위치를 제공하는 시군구 범위 데이터다. 동구 주민이나 여가 계획자가 '동구에 어떤 산림욕장이 어디에 있나'를 확인하거나, 개발자가 지도·관광 안내에 위치를 올릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산림 휴양 데이터와는 시군구명이나 산림욕장 이름을 맞춰 연결해야 한다.
limits: 대구 동구 한 시군구만 다루므로 다른 지역이나 전국 비교에는 이 데이터만으로 부족하다. 공통 시설코드나 행정코드가 없어 다른 데이터와 붙일 때 이름·지역명 매칭이 필요하다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회까지 호출된다.
