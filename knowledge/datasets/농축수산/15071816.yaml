summary_user: 친환경(유기농·무농약) 농산물의 소매가격을 가격등록일자·품목·품종·등급·단위별 평균가격으로 담은 전국 단위 집계 파일로, 포털 설명상 5대 도시 생협·친환경전문점 26개 매장에서 매주 목요일 조사한 38품목 44종류(21년 기준)를 대상으로 한다. 소비자·유통업자·물가 분석가가 "유기농 시금치 소매가는 최근 몇 주간 어떻게 움직였나" 같은 질문에 쓴다. 전역 조인 키가 없어 KAMIS 일반 소매·도매가격 등과는 품목명·품종명·등급명을 이름으로 맞춰 이어 써야 한다.
description_portal: 친환경 농산물 가격정보에 대한 데이터로,- 친환경(유기농, 무농약) 농산물 38품목 44종류의(21년 기준) 소매가격 정보- 전국 5대 도시 소재 생협, 친환경전문점 등 26개 매장에서 매주 목요일에 조사된 소매가격 자료를 제공합니다.aT(한국농수산식품유통공사)는 ‘83.4월부터 국내 농수산물의 유통질서 확립, 수급조절 및 가격안정 정책수립 등을 위한 목적으로 유통정보 조사활동을 수행해오고 있으며, aT가 조사한 유통정보의 효율적인 분산을 통한 정보수요자의 유통에 관한 이해증진 및 정보활용도 제고를 위해 ’03.4월부터 Kamis(농수산물 유통정보) 홈페이지를 구축하여 서비스 중에 있습니다.Kamis 유통정보는 전국 주요 도·소매시장 대상으로 매일(토·일·공휴일 제외) 가격을 조사하여 공개하는 농수산물 도·소매가격정보부터 거래동향/전망, 알뜰장보기 물가정보, 성수품·제철농산물 정보 등 농수산물의 유통과 관련한 다양하고 특화된 정보 서비스가 가장 큰 특징입니다.aT는 유통정보 제공을 통해 농수산물 거래주체(생산·유통·소비자) 등의 시장출하 및 매매에 관한 의사결정과 합리적인 소비를 지원하고 있으며, 최근에는 가격정보 Open-API 제공을 통해 민간기업의 신규 비즈니스 창출에도 기여하고 있습니다.
