description_portal: 해당 데이터는 경상북도 영천시 농업기상정보시스템 내 표출되는 병해충 예측 현황입니다.2017년 3월부터 2025년 9월달 까지의 병해충 예측 현황을 표출하고 있습니다.칼럼은 연번, 관측소, 병해충구분, 발생일, 해제일, 병해충코드, 데이터기준일자 7개의 칼럼으로 구성되어 있습니다.대상은 농작물에 관련 병해충 정보입니다.이를 통해 농작물 관련 병해충 관리 정책 수립, 연구기관의 분석자료,  등으로 다양하게 쓰일 수 있는 데이터입니다.해당 데이터와 관련하여 추가적으로 궁금하신 사항이 있으신 경우 영천시 농업기술센터 기술지원과로 연락주시면 감사드리겠습니다.
