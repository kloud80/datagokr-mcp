summary_user: 한국마사회가 등록한 말(마필) 한 마리 단위로 마번·한글/영문 마명·품종·성별·생산국가·수입국가·출생일자·등록일자를 담은 전국 범위의 기본정보다. 말산업 종사자나 분석가가 특정 말의 혈통 외 기본 신상(어느 나라에서 태어나 언제 등록됐는지)을 마번이나 마명, 출생일 기간으로 찾아볼 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 마번(hrno)이나 마명을 기준으로 한국마사회의 다른 마필·경주 데이터와 이름·코드 매핑으로 연결한다.
limits: 다른 기관 데이터와 바로 붙일 전역 조인 키가 없어 마번·마명 매칭에 의존해야 한다. 분류상 농산물 유통 가격 부문에 들어가 있지만 가격·유통 정보는 없고 마필 기본정보만 담는다. 개발계정은 하루 3,000회 호출 제한이 있다.
