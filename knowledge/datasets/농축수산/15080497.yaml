description_portal: '○ 자료생성년월 : 2025년 8월 27일 ○ 철원군 가축사육업 허가 및 등록 기준 정상엽업중인 양돈농가 수 : 63호○ 데이터 내용 설명 : 기준 철원군 양돈(돼지)농가 데이터입니다. 가축사육업 허가 및 등록된 양돈농장의 사업장 소재지 지번과 도로명주소를 제공하며, 주소는 농가의 등록당시 주소이며, 농가명, 대표자, 연락처는 개인정보로서 제공하지 않습니다. 개방데이터는  양돈농가의 사업장 소재지 중 지번주소 63건, 도로명주소 63건으로 총 126건의 데이터를 제공합니다. 제공되는 데이터는 정상영업중인 농장의 데이터이며 휴업 및 폐업 등 의 농장의 데이터는 제공되지 않습니다.'
