description_portal: 데이터는 경기도 화성시 관내 포도 재배 스마트팜 농가를 대상으로 실시한 토양특성 분석 결과를 수록한 자료이다. 항목에는 지역, 농가번호, 모래·미사·점토의 비율, 토성 분류, 적정 수분함량 범위 등이 포함되어 있으며, 농가별 토양의 물리적 성질을 정량적으로 제공한다. 해당 정보는 작물 생육에 적합한 토양 환경 조성, 스마트팜 기반 재배 조건 설정, 맞춤형 농업 기술 적용 등을 위한 기초자료로 활용 가능하다. 각 농가의 토양 구성 특성을 비교함으로써 지역 간 특성 차이를 파악할 수 있으며, 농업 환경 진단, 토양관리 방안 수립, 농가 맞춤형 컨설팅 등에 참고자료로 제공된다. 본 데이터는 특정 시점의 분석 결과로 구성되어 있으며, 정밀 영농 및 연구 기반의 활용도를 높이고자 개방된다.
