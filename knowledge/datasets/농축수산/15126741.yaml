description_portal: 이 데이터는 해양수산부에서 국내 수산물 가공산업의 현황 및 실적 파악을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 조사년월, 가공집계구분, 관할기관코드, 가공제품코드, 연근해원양구분, 가공종류코드 등 생산 실적 관련 항목과, 각 실적 관련 컬럼명 및 그 값, 그리고 데이터의 최초생성시점과 최종변경시점 등으로 구성되어 있습니다.  본 데이터는 수산물 가공산업에 종사하는 기업이 시장 동향을 분석하거나, 연구기관에서 국내 수산물 가공생산의 구조 및 변화를 파악하는 데 사용할 수 있습니다. 또한, 행정기관은 수산정책 수립 시 정량적 근거 자료로 활용할 수 있습니다.
