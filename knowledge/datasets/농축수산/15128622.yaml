description_portal: '- 한국농어총공사 농지연금사업의 담보농지 데이터입니다.- 농지연금사업이란 농업인의 안정적인 노후 생활 보장을 위해 60세 이상의 농업인이 소유한 농지를 담보로 제공하고, 매달 연금 형태로 노후 생활 안정 자금을 지급받는 제도입니다.- 본 데이터는 한국농어촌공사 농지연금사업 가입시 담보로 설정한 담보농지의 평가방식별(공시가, 감정가) 지급방식의 평균월지급금(전), 평균월지급금(후), 수시인출금 , 평균면적의을 2011년부터 현재까지 통계자료로 작성한 데이터 입니다.- 단위(원, 제곱미터)- 해당 데이터는 농지 연금 제도 개선안을 마련하는 등 정책 개발에 활용 가능하며 개인별 최적 지급방식을 추천하는 등 농업인 맞춤형 컨설팅에 활용하는 등 다양하게 활용 가능합니다.'
