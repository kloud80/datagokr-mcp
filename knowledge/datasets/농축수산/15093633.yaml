description_portal: 「산림청_국유림 대부 사용허가」 데이터는 산림청이 관리하는 국유림을 대상으로, 용도별로 분류된 대부 및 사용허가 현황을 기록한 행정 통계 자료입니다. 이 데이터는 국유림을 일정 기간 동안 민간이나 공공기관이 사용하거나 빌려 쓸 수 있도록 허가한 내용을 포함하며, 공용, 공공용, 공익사업용, 광업용, 학교부지용, 목축용, 산림소득용, 골프·스키장용, 농경용, 주거용, 종교용, 기타용, 조림용 등 다양한 용도로 분류되어 있습니다. 각 용도에 따라 허가 건수, 면적, 사용기간 등 주요 정보가 기록되어 있으며, 국유림 자원의 효율적 활용과 공공성 유지, 지역사회 기여 여부 등을 평가하는 데 중요한 자료로 활용됩니다.
