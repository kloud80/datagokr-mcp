summary_user: 인삼경작 등 농림사업 지원 신청을 신청 건별로 담은 파일로, 사업연도·사업명·신청 일련번호·이력 일련번호·관할 하부 기관·지역명·우편번호·신청일자가 들어 있으며 범위는 전국이다. 인삼 재배 지원사업 담당자나 분석가가 어느 지역에서 언제 신청이 몰렸는지 행정구역별 신청 현황을 볼 때 쓴다. 농림사업 코드(agri_project_cd)와 신청 일련번호(agri_project_aply_sn)를 키로 같은 사업·신청을 다루는 다른 농림사업 신청 데이터와 이어 쓰고, 지역은 지역명·우편번호로 맞춘다.
description_portal: 해당 데이터는 농림축산식품부 인삼경작 관련 신청정보로, 주요 항목으로는 관할 하부 기관 코드, 지역명, 우편번호, 신청일자 등을 포함하고 있습니다. 이를 통해 인삼경작 신청 현황을 행정구역별로 확인할 수 있으며, 지역별 재배 특성과 수요를 분석하는 데 활용할 수 있습니다. 또한 인삼 재배 지원사업의 운영 및 관리, 지역 단위의 인삼 산업 육성 정책 수립, 행정기관의 신청 현황 모니터링 등에 기초 자료로 활용될 수 있습니다. 다만, 이 데이터는 개인정보 및 민감정보가 포함되어 있어 일부만 제공되므로 사용에 유의 부탁드립니다.
