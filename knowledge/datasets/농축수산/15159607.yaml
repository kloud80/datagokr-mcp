summary_user: 부안군이 관리하는 어업면허대장에서 개인정보를 빼고 어업번호, 어업의 종류, 어장 위치, 면적, 어장 좌표(위도·경도)를 담은 파일 데이터로, 시군구 범위의 개별 어장 단위 원장이다(CSV 약 201KB). 어민·수산 사업자나 해양공간 분석가가 부안군 앞바다 어디에 어떤 종류의 면허 어장이 얼마나 넓게 분포하는지 지도로 확인하는 데 쓴다. 전역 조인 키는 없어 같은 어업번호의 좌표를 묶어 어장 영역을 그리거나, 위도·경도로 다른 해양공간 데이터와 공간 중첩해 연결한다.
description_portal: 본 데이터는 부안군의 어업면허대장 데이터이다. 수산업법과 양식산업발전법등 어업 및 양식업 관련한 법률에 근거하여 엑셀파일로 별도로 관리중인 어업면허대장 데이터에서 개인정보를 제외하고 어업번호, 어업의종류, 어장위치, 면적 그리고 어장의 위치정보를 위도와 경도로 나타낸 정보만을 추출하였다. 동일한 어업번호인 위치정보들을 활용하여 지도 시각화 등을 통해 어장의 위치 파악 등 관련 서비스 구축에 활용할 수 있으며, 공간정보 분석을 통해 어업 관련 데이터 분석에 활용할 수 있다.
