summary_user: 열처리업 등록업체의 목재포장재 열처리 소독 실적을 지역(시/도)·월·목재포장재 종류(품목명)별 수량과 단위로 담은 집계 자료이며, 범위는 전국이다. 수출입 물류업체나 방역 정책 분석가가 어느 지역에서 어떤 종류의 목재포장재가 얼마나 열처리 소독됐는지를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시/도 이름이나 품목명 매핑으로만 이어 쓴다.
description_portal: '우리나라는 수출입 과정에서 병해충 유입을 방지하고 국제기준(ISPM 15)에 맞춘 안전한 물류 환경을 조성하기 위해 목재포장재 소독 관리 제도를 운영하고 있습니다. 특히 열처리업 등록업체를 대상으로 매년 목재포장재 종류별 소독 실적을 집계·공표하여 투명성을 높이고, 관련 업계와 국민이 신뢰할 수 있는 정보를 제공하고 있습니다. 이러한 자료는 목재포장재 관리 현황을 파악하고 방역 정책 수립에 중요한 기초 자료로 활용됩니다.제공 내용 : 지역별, 월별, 목재포장재 종류별 목재포장재 열처리 실적이용 방법 : 농식품부 공공데이터 링크로 이동하여 사용2025년 7월까지 실적을 제공하고 있습니다.'
