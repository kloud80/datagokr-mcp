description_portal: 경상남도 거제시의 가축사육현황 공공데이터는 축산업 기반 현황을 파악하기 위해 작성된 자료로, 가축 종류별 사육 가구 수와 개체 수를 포함하고 있습니다. 한육우, 젖소, 돼지, 닭, 오리, 마필(말), 사슴, 토끼, 개, 꿀벌 등 주요 축종별로 각각의 사육 가구 수와 마리 수(또는 군 수)를 세부적으로 제공하고 있으며, 면양, 산양, 칠면조, 거위 등 특수 축종에 대한 정보도 함께 포함되어 있습니다. 본 데이터는 지역 내 축산업의 규모, 유형별 분포, 자원 관리, 방역 계획 수립 등 행정 및 정책 자료로 활용할 수 있으며, 민간 기업, 연구기관에서도 기초 통계로 유용하게 활용됩니다.
