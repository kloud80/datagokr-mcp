description_portal: '한국수목원정원관리원은 자체적으로 개발한 천연물 기반 기술의 민간 이전 현황을 정리한 기술이전 데이터를 공공데이터로 제공하고 있습니다. 이 데이터는 꼬리진달래, 자란초, 실새풀, 도라지, 소나무, 가래나무, 차나무 등 다양한 식물 유래 소재를 활용한 추출물, 조성물, 제조방법 관련 기술을 중심으로 구성되어 있으며, 해당 기술이 실제로 어떤 민간기업에 이전되었는지를 보여주는 사례를 담고 있습니다.공개되는 데이터에는 기술의 명칭과 이전을 받은 업체명이 기본 항목으로 포함되어 있으며, 이를 통해 특정 식물 소재가 어떤 기능성(예: 항산화, 미백, 주름개선, 항균, 항바이러스, 항염 등)에 응용되었고, 어떤 기업들이 기술이전을 통해 사업화를 추진했는지를 확인하실 수 있습니다. 기술이전 업체로는 ㈜아이투비, ㈜헬스밸런스, ㈜엔에스비, 솔지원, 아이오씨아이, ㈜에세파인, 예당, ㈜리치바이오, ㈜블룸어스, ㈜피텐, ㈜국일화학 등 여러 기업이 포함되어 있으며, 각각 화장품, 건강기능식품, 원료소재 산업 등 다양한 분야에서 해당 기술을 활용할 수 있는 잠재력을 지니고 있습니다.데이터는 CSV 형식으로 제공되며, 기술별 정보가 표준화된 형태로 정리되어 있습니다. 현재 공개본에는 기술명과 업체명 중심의 기본 정보가 수록되어 있으나, 추후 확장 시 이전일자, 특허번호, 기술 개요 등의 세부 정보도 추가될 수 있습니다. 본 데이터는 천연물 기반 기술의 산업화 현황을 이해하고, 기술사업화 동향을 분석하며, 기업 협력 전략을 수립하는 데 유용하게 활용하실 수 있습니다. 또한 화장품, 건강기능식품, 식물 보호제 등 다양한 응용 분야에서 신소재 개발 및 고부가가치 창출을 위한 기초자료로도 기능할 수 있습니다.'
