summary_user: 전국 연안정비사업을 사업개요번호와 이력순번 단위로 기록한 건별 사업 정보로, 사업명·정비 장소·사업 기간·사업금액·추진현황·담당기관·시공사 등을 읍면동 수준까지 담는다. 지자체 담당자나 연구자가 '우리 지역 해안에서 어떤 연안정비사업이 언제, 얼마의 예산으로 진행됐고 지금 어느 단계인가'를 확인하거나 연안 정비 이력을 정리하는 데 쓴다. 필드에 법정동코드(연안정비법정동코드)와 항구명이 있지만 실측에서는 전역 조인 키가 확인되지 않아, 다른 데이터와는 지역명·항구명 매핑이나 같은 기관 코드로 이어 써야 한다.
description_portal: 이 데이터는 연안정비사업의 국가계획 수립 및 관리와 관련한 정책 추진 현황을 기록·관리한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 사업개요번호, 사업명, 정비가 이루어지는 장소, 상세주소, 사업 기간, 사업금액 등 속성정보로 구성되어 있습니다.  본 데이터는 해양수산부 및 지방자치단체에서 연안정비사업 계획 수립 과정에서 참고자료로 사용할 수 있으며, 연안의 효율적인 정비와 관리 이력을 파악하는 데 활용될 수 있습니다. 또한, 관련 연구기관에서 연안공간 변화 분석, 정책 평가 연구 등에도 이용될 수 있습니다.
