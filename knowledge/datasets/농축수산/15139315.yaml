description_portal: 관할 해역의 지속 가능한 수산 자원 보호와 안전한 어업 활동 지원, 그리고 청정한 해양 환경 조성을 위해 어업생산과에서 실제 관리하고 운영 중인 관공선의 종합 행정 현황 데이터입니다.일반 국민과 관련 업계 종사자들이 공공 선박의 역할과 운용 현황을 투명하게 이해할 수 있도록, 불법 어업 지도·단속 및 수산 행정 업무 지원, 해양 부유 쓰레기와 방치 폐어구 처리를 위한 해양 정화 및 해양쓰레기 수거·운반, 어민 재산 피해를 최소화하기 위한 적조 예찰 및 방제 등 각 관공선이 현장에서 수행하는 핵심 공익 임무를 구분하여 제공합니다.또한, 선박의  운항구역을 함께 수록하였으며, 선박의 규모와 기동 능력을 객관적으로 파악할 수 있도록 총톤수(GT), 최고 속력(Knots) 등의 물리적 제원 정보를 표준화된 수치로 포함하고 있습니다. 이를 통해 공공 자산인 관공선이 지역 해양 행정에 어떻게 기여하고 있는지 직관적으로 확인할 수 있습니다.
