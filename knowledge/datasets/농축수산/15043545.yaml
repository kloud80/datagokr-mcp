summary_user: 서귀포치유의숲 안의 무장애여행 관련 지점을 건별로 담고, 각 지점에 아이디와 위도·경도·해발고도가 있으며 포털 설명상 장소설명과 이미지 정보도 함께 제공된다. 휠체어 이용자나 보행약자가 노고록 무장애 숲길 같은 이동 경로와 편의시설 위치를 미리 확인하거나, 관광 분야 담당자가 무장애 관광 인프라 개선을 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 좌표나 장소 이름을 직접 맞추거나 같은 기관(제주특별자치도)의 다른 무장애여행정보 시리즈와 나란히 놓고 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 서귀포치유의숲 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 서귀포 치유의 숲은 제주특별자치도 서귀포시 호근동에 위치한 산림 치유·휴양 공간으로, 난대림·온대림·한대림이 함께 어우러진 다양하고 풍부한 식생을 자랑한다. 전체 면적 약 174ha, 산책로 총길이 약 15~18 km 규모이며, 이 중 약 870 m 구간의 ‘노고록 무장애 숲길’은 유니버설 디자인과 나무데크로 포장되어 휠체어 이용자와 보행약자도 숲길을 안전하고 편안하게 이용할 수 있다. 장애인 주차장, 휠체어 대여, 장애인 화장실, 점자블록, 수유실 등 편의시설이 갖춰져 있으며, 산림치유 프로그램과 가족 단위 체험이 마련되어 무장애 관광지로서의 접근성과 자연 치유 기능을 동시에 제공한다. 2020년에는 ‘열린관광지’로 공식 지정된 바 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
