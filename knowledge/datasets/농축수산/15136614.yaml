description_portal: 본 데이터는 농림수산식품교육문화정보원이 운영하는 ‘농업ON’ 플랫폼의 경락가격 시각화 서비스 중 산지별 인기 품목 정보를 제공하는 콘텐츠이다. 주요 산지에서 출하되는 농산물 중 유통량이나 가격 변동이 활발한 품목을 중심으로 정보를 시각화하여, 이용자가 시장 수요와 산지 간 품목 선호도 차이를 쉽게 파악할 수 있도록 지원한다. 시기별·지역별 출하 동향 분석에 유용하며, 생산자에게는 작물 선택 및 출하 전략 수립에, 유통 종사자에게는 수급 조절 및 시장 대응에 도움을 준다. 직관적인 시각화 기반으로 구성되어 있으며, 농산물 유통구조의 이해도 제고와 가격 정보의 접근성 향상을 통해 현장 중심의 농업정보 서비스 강화를 목적으로 활용된다.
