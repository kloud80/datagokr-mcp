summary_user: 백두대간 일대 희귀식물을 종 단위로 담아 학명·국명·과명, 희귀식물 등급, 형태 특징, 생육 환경, 국내외 분포 지역, 이미지 주소 등을 제공하는 전국 범위의 비공간 데이터다. 연구자나 자생지 복원 담당자가 "이 식물의 희귀 등급과 국내 분포지는 어디인가"를 확인하거나 보전 대상 종 목록을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 생물종·산림 데이터와는 학명(scnm)이나 국명(krnm)을 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 멸종위기에 처한 희귀식물 자원의 체계적인 보전과 생물다양성 확충 기반을 마련할 목적으로 한국수목원정원관리원이 관리 및 조사한 희귀식물 자원의 생태적 특성 정보를 제공하는 데이터입니다. 희귀식물의 고유 식별 번호와 함께 학명 및 국명 중심의 표준 분류 체계를 수록하고 희귀식물 등급과 특산식물 여부 및 생육 환경과 분포 특징 등의 세부 항목을 체계적으로 수록했습니다. 자생지 복원 및 서식지 외 보전 정책 수립부터 생물자원 관련 학술 연구와 인공지능 기반 환경 모니터링 인프라 구축의 기초 자료로 활용됩니다.
