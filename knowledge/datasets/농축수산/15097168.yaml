description_portal: 이 데이터는 총 30개의 항목으로 구성된 제주국제자유도시개발센터(JDC) 산하 고품질 감귤 농가 관련 설비 및 품종 조사 자료로, 각 데이터는 번호, 대상 구분, 아이디, 농가키, 조사년도, 경사정도, 원지정비 유무 등으로 구성되어 있습니다. 조사년도는 모두 2021년도로 통일되어 있으며, 설비 항목에는 원지정비 유무, 피복 유무, 우산식 유무, 스프링쿨러 유무, 점적호스 유무, 방산팬 유무, 방품망 유무 등이 포함되어 있고, 해당 항목들은 ‘Y’ 또는 ‘N’의 형식으로 해당 설비의 설치 여부를 나타냅니다. 이는 각 농가가 보유한 재배 환경의 조건과 시설 기반의 차이를 파악할 수 있도록 설계된 데이터로, 감귤 품질과 생산성과의 상관관계를 분석하는 데 유용한 기초자료로 활용될 수 있습니다. 품종 항목에는 궁천, 흥진, 유라, 일남일호, 극조생, 온주, 하례, 하례조생, 조생 등 다양한 품종명이 포함되어 있으며, 각 품종의 특성과 설비 조합 간 관계를 분석해 감귤 농가의 시설 투자 전략, 재배 환경 개선, 생산성 향상에 활용할 수 있습니다. 이 데이터는 감귤 농업의 현장 기반 시설 현황과 재배 특성을 종합적으로 파악할 수 있는 실증적 자료로서, 향후 품질 기준 강화, 정책 지원 대상 설정, 품종별 최적 재배 조건 도출 등에 유의미한 분석 근거로 활용될 수 있습니다.
