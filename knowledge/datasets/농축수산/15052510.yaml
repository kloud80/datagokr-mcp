summary_user: 국립농산물품질관리원이 지정한 농산물 안전성 검사기관 목록으로, 기관 한 곳당 한 행에 지정번호·지정일자·기관명·소재지·업무 범위·검사하는 유해물질 항목을 담고 범위는 전국이다. 농산물 생산자나 유통업자가 "우리 지역에서 잔류농약 검사를 맡길 수 있는 지정 검사기관이 어디인가"를 찾을 때, 분석가가 지역별 검사기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 소재지 주소를 이름 매칭해 이어 붙여야 한다.
description_portal: 안전성조사는 농산물의 생산·유통·판매 단계에서 농약 등 유해물질 안전성조사를 통해 부적합품의 시중 유통을 차단하여 안전한 농산물을 공급을 목적으로 도입되었으며, 안전성검사기관은 안전성조사시 채취한 농산물 등 시료를 검사.분석하는 기관으로 본 정보는 국립농산물품질관리원에서 관리하는 안전성 검사기관 지정 현황 정보로서, 지정번호, 지정일자, 기관명, 검사기관 소재지, 업무 범위, 유해물질 검사항목 데이터로 구성되어 있습니다. 농산물 안전성에 대한 정보에 관심이 많은 분들에게 유용한 정보가 될 것으로 기대됩니다.
