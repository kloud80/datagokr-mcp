summary_user: 해양수산부가 시도생태경관보전지역으로 지정한 지역을 전국 범위로 담은 공간정보로, WFS로는 지역별 경계 좌표(posList)와 지역명(국문·영문)·조사년도·관리기관·지정년도를, WMS로는 지도 이미지를 돌려준다. 해상풍력이나 연안 개발을 검토하는 사업자·분석가가 '예정 부지가 시도생태경관보전지역에 걸리는가'를 사전 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양공간 데이터와는 지역명 매핑이나 좌표 기반 공간 중첩으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 시도생태경관보전 대상으로 지정된 지역 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 WMS(웹 맵 서비스) 및 WFS(웹 피처 서비스) 형태로 구분되어 있습니다. WMS데이터는 반환 이미지 크기(픽셀), 검색 범위, 좌표체계 파라미터로 맵 이미지 파일을 조회할 수 있으며, WFS는 지역명을 파라미터로 시도생태경관보전지역의 텍스트 형태 공간정보와 지역명(국문, 영문), 조사년도, 관리기관, 지정년도 등 정보를 조회할 수 있습니다.본 데이터는 시도별 보전지역 현황 분석, 공간계획 수립, 행정기관의 생태경관보전정책 개발, 자연환경 및 생태계 관리 방안 연구에 활용될 수 있습니다.  또한 관련 지리정보시스템(GIS) 구축, 생태경관 보전지역 내 개발행위 사전 검토, 환경영향평가 자료 작성 등에도 활용될 수 있습니다.
