summary_user: 우리나라 연안의 마을어업·양식어업·정치망어업 어장을 한 건씩 담은 파일로, 어장마다 시도·시군구, 어업종류코드와 어업면허명, 어업유형, 어장면적, 개정년도, 관련부서를 기록하며 범위는 전국·시군구 단위입니다. 어업 정책 담당자나 분석가가 '우리 시군구에 양식어업 어장이 몇 곳이고 면적은 얼마인가' 같은 지역별 어업 면허·어장 현황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 시군구코드(sgg_cd)·시군구명이나 어업종류코드 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 수집한 어장 정보 현황을 파악하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 우리나라 연안의 마을어업, 양식어업, 정치망어업에 대한 어장정보로, 시군구코드와 시군구명, 어업종류코드 및 어업면허명, 어장의 면적 등 정보로 구성되어 있습니다.  본 데이터는 각 지역별 어업 면허 현황을 분석하여 어업 정책의 기초자료로 활용할 수 있으며, 지역별 어업 종사자 현황 파악, 어업 관련 행정업무 지원, 어장 관리정책 수립을 위한 기초자료로 사용할 수 있습니다.
