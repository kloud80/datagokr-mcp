summary_user: 경기도 시군별 논·밭 경지면적, 농업진흥구역·농업보호구역 면적, 농업진흥지역 안의 논·밭 면적과 그 비율을 기준일자(SUM_DE)별로 담은 시군 단위 집계 자료다. 경기도 시군 가운데 농업진흥지역 비중이 큰 곳을 비교하거나, 농지 보전 정책을 세울 때 지역별 농업 기반을 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(SIGUN_NM)이나 경기도 시군코드(SIGUN_CD)를 이름·코드 매핑해 연결해야 한다.
description_portal: 이 데이터는 경기도 내 시군별 농지 면적과 농업진흥지역의 구성 현황을 정리한 자료로, 지역별 경작지 분포와 농지 보호 및 개발 정책의 기초 자료로 활용됩니다. 논과 밭의 경지 면적 외에도 농업진흥구역, 농업보호구역 면적과 농업진흥지역 내 논·밭의 면적 및 그 비율이 포함되어 있어, 지역별 농업 기반의 특성과 활용도를 한눈에 파악할 수 있습니다. 특히 농업진흥지역 논밭비율은 해당 지역이 농업생산 중심지로서 어떤 특성을 지니는지를 판단할 수 있는 지표로 유용합니다. 이 데이터는 농업 생산 기반의 효율적 관리, 농지 보전 정책 수립, 지역별 농업 인프라 분석 등 다양한 연구와 행정적 목적에 활용될 수 있습니다.
