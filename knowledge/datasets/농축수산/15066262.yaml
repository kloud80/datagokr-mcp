description_portal: 정부보급종 수매가격 내역에 대한 데이터로 년산, 작물명, 품종명, 구분, 종자대금, 생산보상금, 포장합계 등의 항목을 제공합니다.※ 수매? 국립종자원이 농가에 보급할 우량 종자를 확보하기 위해, 계약을 통해 생산된 종자(채종 종자)를 농가로부터 사들이는 과정을 의미합니다.※ 정부보급종? 정부보급종은 종자산업법 제22조에 따라 정부가 생산·공급하고 있는 종자로 벼, 콩, 팥, 보리, 밀, 호밀 작물이 해당된다.※ 제공되는 데이터는 "CSV(Comma Separated Values, 쉼표로 값을 구분하여 데이터를 저장하는 파일 형식)" 타입으로 엑셀(Excel), 한셀, CSV 전용 뷰어나 메모장등으로 데이터 확인이 가능합니다.
