summary_user: 국립종자원이 채종 농가로부터 정부보급종(벼·콩·팥·보리·밀·호밀) 종자를 사들일 때의 가격을 연산·작물·품종·구분별로 종자대금, 생산보상금, 포장합계로 담은 전국 단위 CSV 파일이다. 채종 농가나 분석가가 특정 연산에 어떤 품종의 보급종 수매가가 얼마였는지, 연도별로 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 작물명·품종명 같은 이름 매핑으로만 연결하며, KAMIS 등 유통 가격 데이터와 붙일 때는 품목코드 체계가 달라 별도 매핑이 필요하다.
limits: 표준 코드나 공통 키가 없어 다른 가격·통계 데이터와 자동으로 결합되지 않고 이름 매칭에 의존한다. 범위는 전국 단위로, 지역별 수매가격은 구분할 수 없다. 이 데이터는 종자 수매가격이므로 시장 유통 가격(소매·도매)과 같은 성격으로 해석하면 안 된다.
