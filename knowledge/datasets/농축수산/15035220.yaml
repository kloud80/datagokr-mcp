description_portal: 전라남도 나주시 가축분비료생산업체 데이터입니다. 업체명, 비료종류, 주소, 전화번호 등에 관한 정보를 제공합니다. 가축분비료는 가축이 배설한 고체물질을 이용하여 만들어 농림축산부산물의 자원화·재활용을 촉진하고 유기물 공급으로 토양환경을 보전하는 비료이며, 이를 만드는 생산업체의 주소, 전화번호를 제공합니다. 가축분비료는 농작물 재배에 필요한 영양소를 토양에 공급하여 작물 생장에 도움을 줍니다. 가축분비료생산업체는 비료관리법 제11조(비료생산업 등록 등)에 따라 관할 시군구에 등록해야하며, 등록조건 및 타 법령에 저촉이 없어야 합니다. 가축분은 주로 우분, 돈분, 계분 등 축산농가가 사육하는 가축으로부터 발생한 분(고체형태)을 이용하여 비료를 만드는 업체에 대해 데이터를 제공합니다. 생산된 비료는 다양한 경로를 통해 판매되어지고 있으며, 시장 상황에 따라 판매하지 않을 수도 있으므로 기재된 연락처를 통해 확인하시기 바랍니다.*2025년 11월 기준 데이터
