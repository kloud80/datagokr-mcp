description_portal: 이 데이터는 해양수산부에서 연안관리법에 의거 관리되는 바닷가 정보중 조사가 완료된 원격모니터링 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 바닷가의 면적, 바닷가 최종 유형 분류 내용 및 원격모니터링을 통해 확인된 바닷가의 형성·변화 내용 등으로 구성되어 있습니다.  본 데이터는 연안 및 바닷가 환경의 변화 추적과 현황 파악에 참고자료로 활용될 수 있으며, 연안 관리 정책 수립, 해양 및 연안 개발 계획의 수립과 평가, 해양 환경 모니터링 사업 등의 기초자료로 사용될 수 있습니다.
