description_portal: 전라남도 장흥군 관내 버섯배지 생산 및 판매 업체 현황에 대한 데이터로, 지역 내에서 버섯 재배에 필요한 배지를 직접 생산하거나 유통·판매하는 농가와 사업장의 다양한 정보를 포함하고 있다. 각 농가별로 상호명(농가명), 사업장 주소, 연락처 등의 기본적인 식별 정보를 제공하며, 현재 영업 중인지, 폐업했는지 여부를 나타내는 폐업 여부 정보도 함께 수록되어 있다. 이 데이터는 지역 내 버섯 산업의 공급망 구조를 파악하고, 배지 생산 및 유통 경로를 분석하며, 농가 간 협력체계 구축, 원자재 조달 계획, 산업 지원 정책 수립, 지역 경제 활성화 등 다양한 목적에 활용될 수 있다. 또한, 신규 진입 농가나 투자자, 연구기관 등에서도 참고할 수 있는 유용한 자료로 제공된다.
