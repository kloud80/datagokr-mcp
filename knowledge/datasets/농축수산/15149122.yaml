description_portal: 해양수산부 소속기관 해양수산인재개발원에서 운영중인 바다배움터(구 모두의바다) 콘텐츠 관리에 관한 데이터 목록입니다.TLMBB010 테이블은 바다배움터(구 모두의바다)에 등록된 콘텐츠관리에 대한 세부 정보입니다. 콘텐츠 키워드는 선택입력사항으로 공란이 있을 수 있습니다.TLMBB010 각 컬럼의 코드는 코드컬럼 왼쪽의 컬럼 명과 매칭됩니다.TLMBB020 테이블은 TLMBB010 테이블의 콘텐츠과목코드와 연결되며, 각 콘텐츠별 세부차시에 대한 내용입니다.TLMBA020 테이블은 TLMBB020 테이블의 콘텐츠 ID와 연결되며 바다배움터(구 모두의바다)에 등록된 콘텐츠에 대한 세부 정보 항목입니다.각 컬럼의 코드는 코드컬럼 왼쪽의 컬럼 명과 매칭됩니다.콘텐츠 제작년도 및 등록일자는 일부 공란이 포함되어 있을 수 있습니다.이미 삭제된 콘텐츠 정보도 포함하고 있습니다.TLMBA020 테이블중 전체 공란인 컬럼은 삭제되었습니다.
