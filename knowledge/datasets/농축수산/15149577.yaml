summary_user: 전국 해조류·해초류 분포 구역을 어업권·어업권 유형·양식 유형·면적·면허 기간과 함께 건별로 담은 파일 데이터로, 검증 시 1,829행이 수신됐다. 해조류 양식 어업권이 어느 시도·주소에 얼마나 분포하는지 확인하려는 해양 행정·정책 분석가가 쓴다. 주소(address)를 조인 키로 삼아 다른 어장·면허 자료와 이어 보며, 어업 허가·면허·어장 분류 안에서 선박 등록과는 어선 부분에서만 겹친다.
description_portal: 이 데이터는 해양수산부에서 해조류해초류분포에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 해조류해초류분포주소, 해조류해초류분포행정구역시도, 해조류해초류분포어업권, 해조류해초류분포어업권유형, 해조류해초류분포어업방법내용, 해조류해초류분포양식유형 등의 데이터로 구성되어 있습니다.본 데이터는 해조류해초류분포 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해조류는 바다에 사는 모든 광합성 생물을 통칭하는 넓은 개념이고, 해초류는 그 안에 포함되는 특정 그룹을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
