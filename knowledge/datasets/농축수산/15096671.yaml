summary_user: 제주마 등록 현황을 2021년 기준으로 시군구·읍면동별, 말 종류별(기초마·혈통마·고등마 등) 등록 마리 수로 정리한 집계 자료다. 축산·말산업 담당자나 분석가가 '어느 읍면동에 제주마가 많이 사육되고 혈통마 비중은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구·읍면동 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터셋은 제주마의 등록 현황을 2021년 기준으로 읍·면·동 단위 및 종류별(기초마, 혈통마, 고등마/씨수마 등)로 정리한 공공데이터이다. 제공기관은 제주마등록관리 정보시스템이며, CSV 형식으로 누구나 다운로드 가능하다. 이 자료는 제주마의 분포, 혈통 관리 상태 및 사육 현황을 파악할 수 있는 기초 통계로, 축산 정책 수립, 재래종 보전, 말산업 계획, 생물유전자원 관리, 농촌관광 및 승마 산업 기획 등 다양한 분야에서 활용될 수 있다. 또한 품종 보존과 유전적 다양성 유지 여부를 점검하거나, 읍면동 단위로 제주마 사육 밀집 지역을 분석하는 기초 근거자료로서 의미가 있다.
