description_portal: '창원시 관내에 관리되고 등록되어있는 개, 고양이의 동물품종, 동물연령, 해당동물의 주소, 중성화 여부, 소유 상태 등을 상세하게 나타낸 데이터입니다.지자체 또는 반려동물 등록 시스템에서 관리하는 등록된 동물(예: 반려견, 반려묘 등)의 등록 정보와 전체 목록을 정리한 자료입니다. 본 데이터는 등록 동물 수, 품종, 연령대, 성별, 등록 지역 등을 포함하고 있으며, 동물보호 정책 수립, 동물복지 증진, 반려동물 관련 민원 대응 및 교육·홍보 등에 활용 가능합니다.해당 자료는 등록현황 파악과 지자체별 동물 분포 분석, 반려동물 문화 지원, 위반 예방 등을 위해 유용하며 데이터 양이 많을 경우 일반 뷰어에서는 일부 정보만 확인될 수 있으므로 R, Python, GIS 등 분석 전용 도구 사용을 추천합니다.보다 상세한 항목 정의 및 활용 가이드는 제공기관의 메타데이터나 공공데이터포털 기술문서를 참고해 주세요.'
