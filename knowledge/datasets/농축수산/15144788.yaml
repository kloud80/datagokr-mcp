description_portal: '산불상황관제시스템에서는 산불 발생 시 현장 대응의 효율성과 신속성을 높이기 위해, 전국에 분포한 산불 진화대원의 대기장소 정보를 체계적으로 관리 및 제공하고 있습니다.진화대원 대기장소는 산불 발생 시 즉각적으로 투입될 수 있는 진화인력의 전진 배치 장소로, 산불 대응 초기 단계에서의 골든타임 확보와 기동성 확보에 있어 매우 중요한 역할을 합니다.제공되는 주요 데이터 항목관리기관 : 해당 대기장소를 지정·운영하며, 진화인력의 출동 및 물자 관리를 담당대기장소명 : 지역 내 진화대원이 대기하는 장소의 명칭주소 : 행정구역 기준의 위치 정보로, 네비게이션·출동계획 수립 시 활용경도/위도 : GPS 기반의 좌표 정보로, 상황지도 시스템 연계 활용 가능'
