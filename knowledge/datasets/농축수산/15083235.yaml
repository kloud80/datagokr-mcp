description_portal: 해당 데이터는 농림축산식품부가 제공하는 과종품별 과실류 가공 실적과 가공업체 현황에 관한 데이터입니다. 제공 항목으로는 시도, 과실류, 가공명, 연도 등이 포함되어 있으며, 지역별 과실 가공업체 현황과 품목별 가공실적을 종합적으로 확인할 수 있습니다. 이를 통해 지역 특산 과실의 활용도와 가공산업의 규모, 생산 및 유통 구조를 파악할 수 있으며, 과실 가공산업 육성 정책과 농가 소득 증대 전략 수립에 기초자료로 활용됩니다. 또한 해당 데이터는 가공산업 활성화, 농업 부가가치 창출, 지역 경제 활성화를 위한 산업 연계 정책 설계에도 활용될 수 있는 중요한 자료입니다.
