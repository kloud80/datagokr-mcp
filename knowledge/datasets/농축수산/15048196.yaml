summary_user: 전국의 도시농업·텃밭 교육기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 기관코드·기관명·소재 시도·연락처·홈페이지·지정일자를 담는다(CSV 약 4KB의 소규모 원천 목록). 시민이나 교육 담당자가 '우리 시도에서 도시농업 교육을 받을 수 있는 지정 기관은 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도 이름이나 기관명으로 맞춰 붙여야 하며, 같은 기관이 낸 데이터와는 교육기관코드로만 연결된다.
description_portal: 도시농업 및 텃밭 교육기관데 대한 데이터로 교육기관코드, 교육기관명, 시도, 연락처, 홈페이지, 지정일자 정보를 제공합니다.본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘도시농업 교육기관 정보’에 대한 상세 자료이다. 전국의 도시농업 및 텃밭 교육기관에 대한 정보를 포함하며, 각 기관의 코드, 명칭, 소재지(시도), 연락처, 홈페이지 주소, 지정일자 등의 항목으로 구성되어 있다. 해당 데이터는 도시농업 관련 교육기관을 찾고자 하는 시민, 교육자, 정책 담당자 등에게 유용한 정보를 제공하며, 도시농업 활성화 및 교육 인프라 구축에 기여한다. 데이터는 CSV 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 활용이 가능하다. 또한, 오픈 API 형태로도 제공되어 다양한 애플리케이션 및 서비스 개발에 활용될 수 있다.
