description_portal: 이 데이터는 연안관리법에 따라 해양수산부에서 연안통합관리 용도지역지구의 규제 현황을 목록화하여 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 각 용도지역지구의 명칭, 용도지역의제내용, 용도지역행동규제내용 등 용도지역과 관련된 규제 사항에 대한 정보로 구성되어 있습니다.  본 데이터는 연안 공간의 용도별 구역 지정이나 해당 지역의 개발·보전 정책 수립을 위한 기초자료로 활용될 수 있으며, 연구기관이나 행정기관에서 연안공간 관리, 지역별 규제 분석, 정책 집행의 타당성 검토 및 법령 적용 시 근거자료로 활용할 수 있습니다.
