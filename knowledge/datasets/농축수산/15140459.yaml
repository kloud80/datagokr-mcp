summary_user: 주요 품목별 농작업을 표준코드로 정리한 코드표로, 한 행에 시설유형·품목 중분류·프로세스 영역(PA)·농작업(Act)의 코드와 이름, 농작업 정의, 유사용어를 담으며 범위는 전국·비공간입니다. 농업 정보시스템이나 영농일지 앱을 만드는 사업자·분석가가 '이 품목의 이 작업을 어떤 코드로 기록해야 하나'를 정할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 품목명·작업명을 매핑하거나 농림축산식품부의 같은 코드 체계를 쓰는 데이터와만 이어 쓴다.
description_portal: 이 데이터는 농림축산식품부에서 추진하는 농업활동에 필요한 주요 품목별 농작업을 도출하고, 표준코드화를 통해 품목별 농작업코드 및 활용체계에 대한 가이드를 제공합니다. 데이터는 품목명, 농작업명, 농작업코드, 작업단계, 작업설명 등의 항목으로 구성되어 있으며, 각 항목은 표준화된 형식으로 제공되어 체계적인 비교와 분석이 가능하도록 구성되어 있습니다. 또한, 데이터는 농작업의 효율적인 관리와 정보화를 지원하기 위해 개발되었으며, 농업 관련 정보시스템과의 연계를 통해 활용될 수 있습니다. 데이터는 수시로 업데이트되며, 최신 정보를 반영하여 제공됩니다.
