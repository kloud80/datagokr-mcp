description_portal: 생산확인표 및 미감염확인증 발급을 위해 소나무이동 반출금지구역관리 데이터를 제공합니다.- 법정동코드, 법정동명, 반출금지구역발생면적, 반출금지구역지정내용[소나무재선충병 방제특별법] 제9조에 따라 시·군·구청에서 지정 또는 해제하는 소나무류 반출금지구역에 대한 정보를 제공하는 데이터입니다. 이 자료는 소나무류의 이동을 제한하여 재선충병의 확산을 방지하고 건강한 산림 생태계를 유지하기 위한 방역조치로 활용됩니다. 데이터에는 전국 단위의 지정 지역명, 지정일자, 해제일자, 행정구역, 구역 유형 등 세부 정보가 포함되어 있어 행정기관과 연구기관, 정책 담당자가 산림 보호 정책을 수립하거나 방역 현황을 분석하는 데 유용합니다. 다만 해당 데이터는 참고용으로 제공되므로 실제 활용 시에는 반드시 관할 시·군·구청에 최신 정보를 직접 확인하셔야 하며, 이를 통해 정확한 방역 관리와 산림 보호 정책 수립이 가능합니다.
