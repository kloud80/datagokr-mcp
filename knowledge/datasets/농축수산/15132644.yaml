description_portal: 이 데이터는 해양수산부의 바다내비 도선예선지원 서비스를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 도선 및 예선 지원과 관련된 선상 서비스 정보 요청 이력, 해당 단말기의 정보(제조사 및 등록번호), 단말기 고유 호출부호 등이 포함되어 있습니다. 또한 서비스 요청이 발생한 이력과 이에 관련된 메세지 기록으로 구성되어 있습니다.  본 데이터는 항만·해상물류 운송 기업에서 해상교통 안전관리와 선박 운항 지원 시스템 고도화, 선단 관리 시스템 개발 등 현장 운영을 위한 정보 기반 자료로 활용될 수 있습니다. 또한 관련 시스템 개발 및 물동량 예측 모델 연구, 해양교통 정책 수립 시 참고자료로 사용될 수 있습니다.
