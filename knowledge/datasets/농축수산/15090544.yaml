summary_user: 전국 딸기 스마트팜 시설별로 수집일마다 외부·내부 환경(온도·습도·일사량·CO2·풍향·풍속·강우), 토양·양액(EC·pH·급배액), 난방기·커튼·환기팬 등 설비 작동 상태를 담은 시설 단위 측정 자료이며, 시설마다 시도·시군구·품종·재배면적·시설유형이 붙는다. 딸기 재배 농가나 농업 연구자가 '내부 온도·CO2와 양액 EC를 어떻게 관리한 시설에서 어떤 환경이 유지됐나'처럼 환경 조건과 설비 운영을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시도·시군구 이름이나 품목명 매핑으로만 붙이고, 같은 시설 안의 시계열은 시설ID와 수집일로 묶는다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 지역별 딸기 스마트팜(시설원예) ICT 정보는 다양한 환경 변수를 포함하고 있습니다. 이 데이터는 시설 내부의 온도, 습도, 일사량, 풍량, 풍속, 토양정보 등과 같은 ICT 기반의 환경 데이터와 함께, 생육 정보인 초장, 엽병장, 엽장, 엽폭, 엽수, 관부직경 등 다양한 생리적 데이터의 융복합 정보를 제공합니다. 이러한 데이터는 딸기 작물의 생육 환경을 보다 정밀하게 이해하는 데 중요한 역할을 하며, 작물 재배에 있어 최적의 생육조건을 유지할 수 있도록 도와줍니다. 농업 연구자 및 농업 종사자는 이 데이터를 활용하여 스마트팜 및 시설원예 기법을 개선하고, 데이터 기반의 결정 지원 시스템을 개발할 수 있습니다. 또한, 이 데이터를 통해 딸기 작물 생산성 향상과 품질 개선을 목표로 하는 다양한 연구 및 프로젝트에 유용하게 활용될 수 있습니다.
