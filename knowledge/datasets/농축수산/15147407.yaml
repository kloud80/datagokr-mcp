description_portal: 이 데이터는 해양수산부에서 어항개발계획도에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 어항개발계획레이어코드, 어항개발계획길이, 도면레이어명, 도면제작일자, 형상길이, 공간정보 데이터로 구성되어 있습니다.본 데이터는 어항개발계획도 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어항개발계획도란 어촌·어항법에 따라 어항의 지정 및 개발, 운영에 관한 사항과 어항시설의 설치 및 관리 등을 구체적으로 담은 개발 방향과 공간 계획을 나타내는 그림 또는 문서를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
