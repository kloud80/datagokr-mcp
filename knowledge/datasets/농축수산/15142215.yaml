description_portal: 축산환경 교육시스템 온라인 교육과정은 축산업 종사자와 관련 이해관계자들이 축산업을 영위함에 있어 축산환경 관리의 중요성을 체계적으로 학습할 수 있도록 마련된 교육 프로그램입니다. 교육과정은 가축분뇨의 적정 처리, 가축분뇨 자원화, 악취 저감, 수질 및 토양오염 예방, 온실가스 감축 등 친환경 축산 실천 방안을 중심으로 구성됩니다. 온라인으로 제공되기에 시간과 장소의 제약 없이 수강할 수 있으며, 영상 강의, 자료 다운로드, 퀴즈를 통해 이해도를 높일 수 있습니다. 또한 축산환경 관련 법규 준수사항과 정부 정책 동향을 반영하여 농가가 현장에서 바로 적용할 수 있도록 하여 축산업의 지속 가능성과 환경 보전에 이바지하는 것을 목표로 하고 있습니다.
