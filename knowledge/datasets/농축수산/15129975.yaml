summary_user: 「항만지역등 대기질 개선에 관한 특별법」에 따라 지정된 황산화물 배출규제해역의 경계를 SHP 공간정보 파일로 담고, 해역 명칭·관련 법령·제·개정일자·관계부서를 함께 싣는다(zip 약 5.5MB, 전국 범위). 선박 운영자나 해운·항만 업체가 "내 항로나 정박지가 황산화물 배출규제해역 안에 드는가"를 확인할 때 쓴다. 행정기관과 연구기관은 규제해역의 지정 이력을 파악하거나 항만 주변 환경 연구의 기초 자료로 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 해양공간 데이터와는 해역 명칭으로 맞추거나 공간 중첩으로 이어 써야 한다.
