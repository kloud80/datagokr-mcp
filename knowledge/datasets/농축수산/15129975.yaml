description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「항만지역등 대기질 개선에 관한 특별법」에 따라 지정된 황산화물 배출규제해역 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 황산화물 배출규제해역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해역의 명칭, 관련 정책/법령정보, 제/개정일자 및 관계부서 등 정보를 포함하고 있습니다.  본 데이터는 항만이 위치한 지역의 선박 운영자 및 관련 업체가 규제해역 내에서 황산화물 배출 규정을 준수하는 데 참고 자료로 사용할 수 있으며, 관계 행정기관은 규제해역의 지정 이력과 변동 현황을 파악하여 항만 대기환경 개선을 위한 정책 및 제도운영 자료로 활용할 수 있습니다. 또한 항만 주변의 환경 영향 평가 및 관련 연구를 진행하는 연구기관에서 기본 자료로 사용할 수 있습니다.
