description_portal: 해당 데이터는시도별 생산주종, 주류시장현황, 탁주 원료사용현황 등 2012년 주류산업 실태조사 결과를 기반으로 구성된 자료입니다. 제공 목록으로는 순위, 업체명, 출고수량, 출고금액, 점유율, 재료, 국내산 사용량, 수입산사용량, 국내산비율, 수입산비율 등이 포함되어 있습니다. 이 자료는 주류산업 전반의 생산·유통 구조를 이해하고, 국내산 원료 사용 확대 및 수입 의존도 분석에 중요한 근거를 제공합니다. 또한 주류산업 육성 정책, 원료 자급률 제고 방안, 소비자 보호 대책 등을 수립할 수 있습니다. 산업계에서도 시장 점유율 및 원료 수급 현황을 참고하여 경쟁력 강화 전략을 마련하는 데 활용할 수 있는 기초 자료입니다.
