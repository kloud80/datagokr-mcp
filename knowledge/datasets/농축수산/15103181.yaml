description_portal: 우리나라 대표 산림수종 13종을 대상으로 수행된 생체량(바이오매스) 관련 정량 조사 자료로, 각 수종의 생장 특성과 탄소 저장 능력을 과학적으로 분석하기 위한 기반 데이터를 제공합니다. 조사 항목에는 수령, 흉고직경(cm), 수고(m), 수피 외재적 및 내재적 부피(cm³), 줄기(수피 포함/제외) 건중량(g), 가지, 잎, 뿌리 건중량(g) 등의 항목이 포함되어 있습니다. 이 자료는 수종별 바이오매스 구성비 분석, 산림 탄소흡수량 추정, 생물학적 생산력 평가, 산림 경영계획 수립, 기후변화 대응 전략, 바이오에너지 원료 평가 등 다양한 정책과 연구 목적으로 활용됩니다. 실측 기반의 데이터로 신뢰성이 높고, 수종 간의 구조적 차이와 생태적 기능을 비교·분석하는 데 유용한 핵심 기초자료입니다.
