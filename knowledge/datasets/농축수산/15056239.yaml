description_portal: 광주광역시 2025년기준 우리 광주보건환경연구원에서 실시한 가축질병 병성감정결과에 대한 정보입니다. 우리관이샤 병성감정을 실시하는 목적은 새로운 진단기술 도입으로 지속적인 진단서비스 체계를 확립하고, 질병의 신속딘단 및 원인규명으로 농가 경제적 손실을 최소화 시키기 위한 목적입니다.  병성감정 의뢰된 시료에 대해 부검, 병리조직검사, 미생물 검사 등 다양한 정밀검사를 통해 질병원인을 규명한 결과입니다.  병성감정 의뢰 기관은 농가, 방역지원본부, 동물원, 도축장 등 다양하고, 의뢰기관별로  질병의 원인(세균, 바이러스, 기생충, 곰팡이 등)을 정리한 내용입니다.
