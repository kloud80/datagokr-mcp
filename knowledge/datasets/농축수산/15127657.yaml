summary_user: 전국 연안의 침식 모니터링 지역별로 모니터링 연도, 시도·시군구·지역명, 관측일자, 침식 유형, 시작·종료 좌표, 침식 길이·너비, 대응 재료를 담고, 별도 오퍼레이션으로 영상모니터링 장소와 이미지 파일명을 제공하는 건별 지점 단위 데이터다. 연안 지자체 담당자나 분석가가 '우리 시군구 해안 중 어느 구간이 언제 관측됐고 침식 길이가 얼마인가'를 확인하거나 연안정비 사업의 필요성을 따질 때 쓴다. 전역 조인 키는 없어 시도·시군구명 매칭이나 시작·종료 위경도를 이용한 공간 결합으로 해양공간 용도구역 등 다른 해양공간 데이터와 연결하고, 기관 자체 지역코드(cstWashMnrgArCd)는 같은 기관 데이터 안에서만 쓴다.
description_portal: 이 데이터는 해양수산부에서 연안침식 현황 모니터링 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 모니터링 정보 및 영상모니터링 정보 조회에 따라 모니터링 수행 연도, 모니터링 지역, 관측일자, 연안침식 현황 정보 및 영상모니터링 이미지 파일 정보 등으로 구성되어 있습니다.  본 데이터는 연안 지역에서의 침식 현상 분석, 연안정비 사업의 필요성 평가, 장기적인 연안 관리계획 수립, 지역별 침식 변화 추이 관찰 및 정책 수립 근거 자료로 활용될 수 있습니다. 또한 연안 환경 변화에 대한 연구나 공공기관의 연안 관련 행정업무 지원에 사용할 수 있습니다.
team:
  dept: 해양공간정책과
