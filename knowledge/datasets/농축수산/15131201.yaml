summary_user: 농식품 공공데이터 포털 API가 돌려주는 메시지(오류·안내)를 한 건씩 담은 코드 목록으로, 메시지 구분 코드·메시지 아이디·설명·사용여부로 이루어지며 범위는 전국·비공간이다. 농식품 API를 연동하는 개발자나 시스템 관리자가 "호출 응답에 나온 이 메시지 아이디가 무슨 뜻이고 지금도 쓰이는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 포털 API 응답의 메시지 아이디와 이름·코드를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 농림축산식품부는 농식품 공공데이터 포털의 API 메시지 정보를 제공합니다. 이 데이터는 메시지 구분 코드, 설명, 메시지 아이디, 사용 여부 등을 포함하고 있습니다. 이를 통해 농식품 공공데이터 포털의 API 메시지 구조와 내용을 파악하고, 데이터 활용 시 발생할 수 있는 오류 메시지에 대한 이해를 높이는 데 활용됩니다. 또한, API 메시지 정보를 통해 개발자들이 데이터 연동 시 발생할 수 있는 문제를 사전에 예방하고, 원활한 데이터 활용을 지원하고자 합니다. 이러한 정보는 농식품 분야의 데이터 개발자, 시스템 관리자 등에게 유용한 참고자료로 활용될 수 있습니다.
