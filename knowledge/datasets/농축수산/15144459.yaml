description_portal: 2011년부터 2020년까지 새만금 방조제 해수유통량 자료입니다.본 데이터는 새만금 방조제 배수갑문의 유출입 현황으로 일자(년,월,일), 유출량(㎥), 유입량(㎥), 해수유통량(㎥)을 제공합니다.해수유통량(C=A+B)은 유출량(A)과 유입량(B)을 합하여 계산되었으며,자동계측에 의한 자료가 아닌 수위자료에 따른 산술자료('09년 새만금호 내용적표 기준)이므로 참고용으로만 사용하여 주시고 정보관리에 철저를 기하여 주시기 바랍니다.추가 문의사항은 한국농어촌공사 새만금사업단 시설관리부로 연락 부탁드립니다.
