summary_user: 서귀포시 관내 양식장을 육상·해상·내수면·종자양식 같은 종류별로 묶어 양식장 수와 면허·허가·신고 면적(ha)을 담은 시군구 단위 집계 파일(CSV 약 530바이트)입니다. 서귀포시 양식업 담당자나 수산 분석가가 '서귀포에 육상양식장이 몇 곳이고 면허면적은 얼마나 되나'처럼 종류별 양식 규모를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 양식 종류 이름을 맞추거나 같은 기관(서귀포시) 자료끼리만 이어 씁니다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘양식장현황’ 데이터는 관내 양식장의 종류(육상양식, 해상양식, 내수면양식, 종자양식별로)와 해당 양식장 수, 면허·허가·신고된 면적 정보를 포함한 공공데이터입니다.이 데이터는 어업 관련 행정 및 인허가 관리, 해양수산 자원 분포 분석, 양식업 인프라 현황 파악, 면허면적 기반의 생산량 및 환경 영향 연구에 활용될 수 있습니다.또한 연간 단위로 갱신되므로 시계열 자료로서 수산업 정책 수립, 지역경제 기여도 평가, 재해 대비 및 어업환경 변화 분석 등의 목적에도 적합한 기초 자료입니다.
