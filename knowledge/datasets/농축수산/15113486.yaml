description_portal: 본 데이터는 전라남도 광양시로 전입한 인구 중 귀농귀촌 유형에 해당하는 정주이력 정보를 정리한 자료로, 해당 지역에 새롭게 정착한 인구의 규모, 전입 시점, 전입지 주소, 출신지역 등 주요 속성을 포함하고 있습니다. 데이터는 시기별 인구 유입 현황을 파악하고, 정착유형별 분포를 분석하여 농촌지역의 인구구조 변화 및 정책적 수요를 판단하는 데 활용될 수 있도록 정기적으로 갱신됩니다. 행정기관은 이를 바탕으로 귀농귀촌 지원정책, 생활 인프라 구축, 주거‧교통‧의료 등 정착여건 개선사업을 추진할 수 있으며, 민간에서는 마케팅, 사회조사, 지역개발연구 등 다양한 목적으로 활용이 가능합니다. 본 자료는 개인정보를 포함하지 않으며, 광양시의 지역정책 수립과 인구 유입 확대 전략 수립을 위한 기초자료로써 공개되고 있습니다. 누구나 자유롭게 열람 및 활용이 가능하도록 공공데이터포털을 통해 제공됩니다.
