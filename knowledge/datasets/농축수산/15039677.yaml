description_portal: '경기도 평택시 관내 비료 생산업체의 현황을 정리한 자료입니다. 주요 항목으로 법인(상호)명, 제조장소재지지번주소, 위도, 경도, 비료분류, 비료종류, 전화번호 등이 포함되며, 지역 내 유기질 비료 생산 및 공급 실태를 파악하는 데 활용됩니다. 해당 자료는 농업자원 순환과 친환경 농업 실현을 위한 기초자료로 활용될 수 있으며, 비료 품질관리 및 농가 유통 지원을 위한 정책 수립에도 기여합니다. 또한, 비료 생산 및 유통 체계를 종합적으로 분석하여 농업 지원 정책 수립과 자원순환 활성화에 도움을 줍니다. 정기적으로 갱신되어 최신 정보를 제공하며, 농업 종사자 및 관련 기관이 필요한 정보를 쉽게 확인할 수 있도록 제공됩니다.※문의 : 평택시청 농업정책과(031-8024-3621)'
