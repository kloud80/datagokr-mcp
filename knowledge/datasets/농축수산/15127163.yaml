description_portal: "경기도 안성시\uFEFF에서 2024년 2월 8일 기준으로 등록·관리하는 양돈농가\uFEFF의 현황 정보를 제공하는 데이터이다. 각 농가의 사업장명, 소재지 주소, 사육두수, 축종 등 기본 정보를 포함하며, 등록된 모든 농가의 규모와 분포를 한눈에 파악할 수 있도록 구성되어 있다. 본 자료는 축산업 등록·인허가 자료를 기반으로 작성되어 행정업무, 통계 분석, 정책 수립 시 신뢰할 수 있는 기초자료로 활용된다. 특히 방역 관리, 가축 질병 예방, 악취 관리, 환경영향 평가 등 축산 관련 행정정책을 수립하는 데 필요한 핵심 정보를 제공한다. 또한 축산정책과 및 관련 부서에서는 이 데이터를 활용하여 농가 지원 사업, 시설 개선, 사육 규모 조정 등 맞춤형 지원정책을 추진할 수 있다. 이용자는 본 데이터를 통해 지역 내 양돈업\uFEFF의 현황을 체계적으로 파악할 수 있으며, 연구기관과 공공기관에서도 축산 분야 연구와 정책 분석을 위한 참고자료로 활용할 수 있다.​"
