summary_user: 경기도가 G Fish(명품 수산물) 인증을 준 도내 민물고기 양식장을 업체 한 곳당 한 행으로 담으며, 시군명, 양식장명, 양식 품종, 소유자, 지번·도로명 주소, 위도·경도를 포함한다. 소비자나 유통업자가 '우리 시군에서 인증받은 메기·향어 양식장은 어디인가'를 찾거나, 분석가가 인증 양식장의 분포를 지도에 올릴 때 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없어서, 시군코드(SIGUN_CD)나 시군명으로 경기도의 다른 시군 단위 데이터와 잇고 위경도로 공간 결합하는 방식으로만 연결한다.
description_portal: '이 데이터는 경기도 내 명품수산물(G Fish) 생산업체에 대한 정보를 제공하며, 양식장명, 양식품종명, 소유자명, 소재지주소, 위도·경도 등의 항목으로 구성됩니다. G Fish 인증은 경기도가 도내 양식장 265개소를 대상으로 신청을 받아 중금속, 항생물질, 금지약품에 대한 식품의약품안전처 기준에 따른 안전성 검사를 통해 인증 업체를 선정하고, 도지사 인증서를 부여하는 제도입니다. 해당 데이터는 지역 수산물의 품질 관리, 안전한 식품 공급망 구축, 수산업 활성화 정책 수립 등에 활용될 수 있습니다.※ G Fish(지피쉬) : 경기도에서 인증한 명품 수산물 브랜드로, 철저한 안전성 검사와 품질 기준을 충족한 수산물에 부여됩니다.'
