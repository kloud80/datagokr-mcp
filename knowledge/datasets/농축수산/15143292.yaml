description_portal: 전라남도 장흥군 관내 연안에서 이루어지는 어업활동에 대하여 관련 법령에 따라 행정기관이 허가한 어업 현황을 집계한 데이터로, 연안어업허가 건수를 중심으로 제공한다. 본 데이터는 일정 기간 동안 승인된 연안어업 허가 건수를 기준으로 작성되었으며, 지역별 어업 운영 실태와 인허가 추이를 파악하는 데 활용될 수 있다. 또한 수산자원 관리, 어업 질서 유지 및 지속가능한 어업 정책 수립을 위한 기초자료로 활용 가능하며, 지역별 어업 구조 분석과 행정 의사결정 지원에도 유용한 정보를 제공한다. 특히 공공데이터로서 개방되어 다양한 정책 연구 및 민간 활용에도 기여할 수 있다.
