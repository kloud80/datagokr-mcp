description_portal: '본 데이터는 과거부터 현재까지 연평균 기온, 연평균 강수량, 증발산량 등 기후요소에 대해 1981년부터 최근년도까지 시군별로 연단위 자료를 제공하고 있으며, 미래 기후변화 시나리오에 따른 미래기간에 대한 기후요소별 전망값도 제공하고 있습니다.기후변화 시나리오(PST, SSP1, SSP2, SSP3, SSP5)-SSP1: 사회 불균형의 감소와 친환경 기술의 빠른 발달로 기후변화 완화, 적응 능력이 좋은 지속성장가능 사회경제 구조의 저탄소 시나리오-SSP2: 중도 성장의 사회경제 시나리오로 기후변화 완화 및 사회경제 발전 정도가 중간 단계 가정-SSP3: 사회경제 발전의 불균형과 제도적 제한으로 인해 기후변화에 취약한 상태에 놓이는 사회경제 구조의 시나리오-SSP5: 기후정책 부재, 화석연료 기반 성장과 높은 인적 투자로 기후변화 적응 능력은 좋지만 완화능력이 낮은 사회경제 구조의 고탄소 시나리오'
