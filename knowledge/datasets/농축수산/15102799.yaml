summary_user: 수협 조합이 보유한 창고(이용가공)별로 품목(표준코드)마다 기준일자 기준 입고·출고 수량을 담은 건별 기록이며, 조합·창고·품목명이 함께 들어 있는 전국 범위 파일(CSV 약 0.96MB)이다. 수산물 유통 분석가나 수협·가공업체가 특정 조합 창고에 어떤 어종이 언제 얼마나 들어오고 나갔는지, 예컨대 냉동창고의 가오리류 출고 흐름을 확인하는 데 쓴다. 전역 조인 키는 없어 조합코드·창고코드·표준코드를 같은 수협 계열 데이터와 맞추거나 조합명·품목명으로 이어야 하며, 어종코드 체계가 수협·수산과학원·HS 간에 서로 달라 위판 가격 데이터와 연결할 때 매핑이 필요하다.
