summary_user: 경상남도 안의 치유의 숲과 산림욕장을 시설 한 곳당 한 행으로 담은 파일로, 시군명·시설명·소재지·소유구분·조성년도·조성면적(헥타르)과 국비·도비·시군비로 나눈 사업비(백만원)를 기록한다. 경남 주민이 가까운 시군의 치유의 숲이나 산림욕장을 찾을 때, 또는 분석가가 시군별로 산림휴양 시설에 들어간 재원 구성과 조성 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 산림휴양 데이터나 행정구역 통계와는 시군명이나 시설명을 이름으로 맞춰 이어야 한다.
description_portal: 치유의 숲은 국민들의 여가생활하는데 있어서 향기, 경관 등 자연의 다양한 요소를 활용하여 인체의 면역력을 높이고 건강을 치유하고 정신 등을 힐링하고 증진시키도록 조성한 산림시설을 말하며, 다양한 산림의 환경요소를 활용하여 산림치유지도사가 산림치유프로그램을 실행하고 그 효과를 평가 할수있는 시설을 포함한다산림욕장은 국민의 건강증진을 위하여 산림 안에서 맑은 공기를 호흡하고 접촉하며 산책 및 체력단련 등을 할 수 있도록 조성한 산림시설이기도 하며, 피톤치드 향기와 자연경관을 활용해 심신의 안정을 돕기위해 실천하는 공간의 시설을 말한다.
