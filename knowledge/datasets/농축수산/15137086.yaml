description_portal: 농식품지식정보서비스에서 사용되는 화훼경매정보 목록 정보 데이터입니다. 농림수산식품교육문화정보원은 농업 정보 플랫폼 ‘농업ON’을 통해 도매시장에서 거래되는 주요 화훼 품목의 도매시장 경매 결과를 제공하고 있으며, 본 데이터는 일자별 화훼 품목의 거래 정보를 정리한 자료입니다. 구성 항목은 기준일자, 품목코드명, 품목코드, 거래량이며, 거래된 화훼 품종의 명칭과 고유 코드, 해당 일자의 거래량이 포함되어 있습니다. 이 데이터를 통해 품목별 거래 빈도나 수요 규모를 파악할 수 있으며, 특정 품종의 유통 경향 분석, 일자별 거래량 추이 확인, 품종별 시장 점유도 비교 등의 분석이 가능합니다. 또한, 화훼 유통정책 수립, 수요 예측 기반의 재배 계획 수립 등 다양한 농업 행정 및 경영 활용에 필요한 기초자료로 제공됩니다.
