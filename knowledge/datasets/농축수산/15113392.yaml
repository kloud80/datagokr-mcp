description_portal: '강원특별자치도 강릉시의 육상양식업 및 종자생산업체 현황을 정리한 데이터로, 각 업체의 위치·연락처 정보와 함께 생산 품종, 양식장 유형, 양식방법, 시설 규모를 한 번에 확인할 수 있도록 구성된 자료입니다. 양식 산업 구조 파악, 품종별 생산 기반 분석, 관련 지원사업·정책 수립에 활용할 수 있는 기초 정보입니다.업체명: 육상양식업 또는 수산종자 생산을 영위하는 업체의 공식 명칭소재지: 양식장 또는 종자생산시설이 위치한 상세 주소(도로명 또는 지번 주소 등)전화번호: 업체에 직접 연락할 수 있는 대표 전화번호(문의, 출하·계약 상담 등)팩스번호: 행정서류 송부, 계약서·출하 관련 문서 교환 등에 사용되는 팩스 번호대표품종: 해당 업체를 대표하는 주요 양식·생산 품종(예: 송어, 연어, 뱀장어, 치어 등)주생산품종: 실제로 가장 많이 생산·출하하는 주력 품종 목록(복수 품종 기재 가능)양식장종류: 시설 형태나 용도에 따른 양식장 유형(예: 종자양식장, 육성양식장, 시험양식장 등)양식방법: 수조양식, 순환여과식(RAS), 흐름식, 순환식 등 물 공급 방식·시설 구조에 따른 양식 방법시설면적: 양식장 및 관련 시설이 차지하는 전체 면적(제곱미터 기준)으로, 생산 규모를 가늠할 수 있는 지표이 데이터는 업체별 위치·연락처와 생산 품종, 양식방식, 시설 규모 정보를 함께 제공하므로, 지역 수산 양식산업의 구조 분석, 품종별 생산 인프라 파악, 친환경·스마트양식 전환 지원 대상 선정, 수요처–공급처 매칭, 수산 관련 연구·시험사업 계획 수립 등 다양한 정책·산업 분야에서 활용할 수 있는 수산 양식 기반 현황 자료입니다.'
