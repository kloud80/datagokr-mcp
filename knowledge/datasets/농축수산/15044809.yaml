description_portal: 본 데이터는 농기계 보유 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내 농가에서 보유하고 있는 주요 농업 기계의 종류 및 규모를 파악함으로써, 지역 농업의 기계화율 분석과 농업 생산성 증대 방안을 마련하는 데 목적이 있습니다.주요 내용으로는 농기계 현황을 구분하는 기종별구별 정보와 함께, 주요 농기계별 보유 대수 또는 규모를 나타내는 통계 정보가 포함됩니다. 구체적으로는 동력경운기를 비롯하여, 크기별로 분류된 **농용트랙터(소형, 중형, 대형)**의 보유 현황이 제공됩니다. 또한, 작물 재배에 활용되는 스피드 스프레이어와 유형별 **동력이앙기(보행형, 승용형)**의 보유 현황 정보도 상세히 기록되어 있습니다.이 자료는 지역 농업의 기계화 수준 분석, 농업 생산성 향상을 위한 정책 수립, 농기계 보급 및 지원 사업의 우선순위 결정, 그리고 농촌 경제 연구 등에 귀중한 기초 자료로 활용됩니다.
