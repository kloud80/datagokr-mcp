summary_user: 대구북부농수산물도매시장에서 도매시장법인의 상장 경매를 거치지 않고 중도매인이 개설자 허가를 받아 직접 거래할 수 있는 상장예외품목을 중도매인별로 정리한 현황 파일이며, 중도매인명·품목·산지를 담는다. 도매시장 출하자나 유통 분석가가 '무·배추 같은 특정 품목을 상장예외로 취급하는 중도매인이 누구인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 도매시장 경락·가격 데이터와는 품목명·중도매인명을 이름으로 맞춰 잇거나 같은 기관(대구농수산물유통관리공사) 자료끼리만 연결한다.
description_portal: 농안법 제31조제2항 및 농안법시행규칙 제27조에 의거하여 도매시장법인이 상장하기에 적합하지 아니한 농수산물(연간 반입물량 누적비율이 하위 3퍼센트 미만에 해당하는 소량 품목, 품목의 특성으로 인하여 해당 품목을 취급하는 중도매인이 소수인 품목, 그 밖에 상장거래에 의하여 중도매인이 해당 농수산물을 매입하는 것이 현저히 곤란하다고 도매시장 개설자가 인정하는 품목)에 대하여 중도매인이 도매시장의 개설자의 허가를 받아 도매시장법인이 상장하지 아니한 농수산물을 거래할 수 있는 품목을 제공하고 있습니다. 상장예외품목을 취급하는 중도매인은 36명이 있으며, 대상품목으로는 무, 배추, 양배추 등 83개 품목이 있습니다.
