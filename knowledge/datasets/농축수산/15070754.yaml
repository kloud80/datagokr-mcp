description_portal: MBRIS의 해조류 백과사전은 우리나라 연안 및 주변 해역에 서식하는 해조류(해양식물 포함)에 대해 과학적으로 조사된 정보를 체계적으로 정리하여 제공하는 서비스입니다.이 페이지는 생물의 실물 표본 정보, 염기서열 정보, 사진·동영상 등의 이미지 자료, 형태·분포·생활사·생태 등의 설명 정보 등 다양한 유형의 데이터를 포함합니다.해양생물의 다양성을 보전하고, 우리나라 해양생물자원에 대한 주권확보를 위해 해양생물의 유용성에 대한 정보를 공개하여 해양바이오 분야 산업계, 연구자 등에게 도움을 주어 해양바이오 산업의 활성화에 기여합니다.
