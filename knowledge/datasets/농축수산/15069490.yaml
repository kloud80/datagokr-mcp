description_portal: '산림항공본부 화물운반실적 데이터는 항공기를 활용한 화물운반 업무의 수행 현황 데이터입니다.관리소, 화물자재무게, 화물운반 시작일, 종료일, 장소, 일수 정보가 포함되어 있으며, 화물 운반 임무의 수행 기간과 운송 규모, 작업 위치 등을 확인할 수 있습니다.산불진화, 산림재난 대응, 산림사업 지원 등 다양한 항공 임무 수행 과정에서 필요한 화물 운반 이력을 관리합니다. 이를 통해 화물 운반 업무의 진행 현황과 누적 실적을 파악할 수 있습니다.* 관리소 : 본부, 익산, 양산, 영암, 안동, 강릉, 진천, 함양, 청양, 서울, 울진, 제주, 비무장지대* `25년부터 비고 제공 제외, 일수 포함'
