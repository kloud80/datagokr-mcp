summary_user: 농림축산식품부가 운영하는 농식품 공공데이터포털의 메뉴 구성을 메뉴 단위로 담은 목록으로, 메뉴코드·상위메뉴코드·메뉴명·정렬순서·사용여부를 기록하며 범위는 전국·비공간입니다. 포털 운영자나 분석가가 '이 포털의 메뉴는 어떤 계층으로 구성돼 있고 현재 쓰이는 메뉴는 무엇인가'를 확인할 때 쓴다. 다른 데이터와 잇는 전역 조인 키는 없으며, 메뉴 간 계층은 같은 파일 안의 상위메뉴코드로만 이어진다.
description_portal: 본 데이터는 농림축산식품부가 운영하는 농식품 공공데이터포털의 메뉴관리 현황을 체계적으로 정리한 자료입니다. 메뉴별 구성 및 기능 정보를 포함하여 사용자 접근성과 편의성을 높이기 위한 메뉴 구조 설계와 운영 현황을 상세히 기록합니다. 이를 통해 데이터 이용자들이 포털 내 원하는 정보를 원활하게 탐색할 수 있도록 지원하며, 관리자에게는 효율적인 시스템 운영과 메뉴 관리 방안을 제공합니다. 또한, 웹포털의 안정적인 서비스 제공과 사용자 경험 개선을 위한 기초 자료로 활용됩니다. 본 정보는 농식품 공공데이터포털의 효과적인 운영과 관리에 중요한 역할을 수행합니다.
