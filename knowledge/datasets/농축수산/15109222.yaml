summary_user: 2015년 제·개정된 농축수산물 표준코드 중 도매시장 코드에 대해 신규 시장코드·시장명과 2013년 구 시장코드·시장명을 한 행씩 짝지은 전국 단위 매핑표이며, 갱신일자(UPDT_DE)를 함께 담는다. 경락가격·반입물량 같은 도매시장 데이터를 오래 쌓아 온 분석가가 '예전 시장코드로 기록된 자료를 지금 코드로 어떻게 바꿔 이어 붙이나'를 풀 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 같은 기관의 도매시장 코드(WHSAL_MRKT_CODE)를 쓰는 경락·반입 데이터와 시장코드나 시장명으로 맞춰 연결한다.
description_portal: 본 API는 농림수산식품교육문화정보원에서 제공하는 데이터로, 2015년에 제정되거나 개정된 농축수산물 표준코드와 동일한 의미를 가지는 2013년도 농축수산물 표준코드를 종합적으로 나타내는 정보를 제공합니다. 해당 표준코드는 품목, 시장, 단위, 포장, 크기, 등급, 산지로 구성되어 있으며, 농수산물의 품질 및 회전율을 관리하는 데 필수적인 데이터로 활용됩니다. 이를 통해 농업 및 수산업 분야의 다양한 분석과 연구, 정책 수립 시 유용하게 적용될 수 있습니다. 또한, 오퍼레이션 '신구표준시장목록조회'를 통해 업데이트된 시장코드와 기존 시장코드를 매핑하여 제공하며, 시장명, 업데이트 일자 등의 표준코드와의 관계를 명확히 보여주어 사용자가 보다 쉽게 데이터를 이해하고 활용할 수 있도록 돕습니다.
