summary_user: 수입 식물(과수·유실수 묘목 등)에 대한 격리재배검역 결과를 연도·품목·수입국별로 묶어 격리재배 건수·수량, 합격 건수·수량, 병해충 검출 건수·수량과 검출 병해충명을 담은 전국 단위 집계 자료다. 묘목 수입업자나 검역 정책 분석가가 '특정 국가에서 들여온 어떤 품목에서 병해충이 얼마나 자주 검출됐나'를 확인해 수입 여부와 차단 대책을 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 검역·수입 통계와는 품목명·수입국 이름을 맞춰 매핑해야만 이을 수 있다.
description_portal: 식물방역법 제13조에 따른 수입 식물에 대한 식물별 격리재배검역 병해충 검출(처분) 현황에 대한 자료를 제공합니다.  해당 데이터에는 년도별 대상 식물종, 수입 국가, 격리재배건수, 격리재배 수량, 합견 건수, 합격 수량, 검출 수량, 검출병해충 등을 포함하고 있습니다.  이를 통해 연도별·품목별·국가별 식물병해충 검출 현황을 한눈에  알아볼 수 있고, 향후 수입시 해당 자료를 활용하여 과수 유실수 묘목 수입여부를 판단 할 수 있고, 식물 검역 정책 수립 및 병해충 차단 대책 마련의 근거 자료로 활용할 수 있습니다.
