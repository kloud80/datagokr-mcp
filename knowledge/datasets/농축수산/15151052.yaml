summary_user: 경기도 사이버식물병원의 병해 증상 분류 체계를 증상분류 한 건당 한 행으로 담은 코드표성 데이터로, 증상분류명·화면표시명·상위 분류번호·계층 깊이·정렬 순서·사용 여부를 포함해 대분류-중분류-소분류 계층을 이룬다. 농업 분석가나 진단 서비스 개발자가 '작물에 나타난 이 증상이 어떤 상위 증상 유형에 속하는가'를 정리하거나, 진단 의뢰 데이터의 증상명을 통합 분류로 묶어 유형별로 비교할 때 쓴다. 전역 조인 키는 없으며, 테이블 안에서는 상위 분류번호(up_symptms_class_no)로 계층을 잇고, 같은 기관의 작목_증상·진단_의뢰_증상 데이터와는 증상분류번호나 이름 매핑으로만 연결한다.
description_portal: 증상_분류 테이블은 병해 증상을 분류 체계에 따라 체계적으로 정리한 데이터입니다. 각 증상은 고유 번호와 함께 증상분류명, 화면에 표시되는 증상분류명, 상위 증상 분류번호, 등록일, 수정일, 사용 여부, 계층 깊이, 정렬 순서 등의 정보를 포함합니다. 이 테이블은 병해 증상을 대분류-중분류-소분류 형태의 계층 구조로 표현할 수 있으며, 상위 분류번호를 통해 계층 관계를 파악할 수 있습니다. 주요 활용은 작목_증상, 진단_의뢰_증상 등 병해 진단 데이터에서 증상명을 통합 분류 체계로 전환하거나 병해 유형별 증상 비교 분석 등에 사용됩니다.
