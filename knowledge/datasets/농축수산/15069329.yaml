description_portal: 해양생명자원통합정보시스템(MBRIS)은 우리나라 교과서에 수록된 생물 종에 대한 다양한 정보를 종합적으로 제공하고 있습니다. 교과서 수록 생물이란, 지구 생물의 약 80%가 바다에 서식하고 있음에도 불구하고, 인간이 알고 있는 해양생물은 전체의 약 1%에 불과하다는 현실을 반영하여 선정된 중요한 교육 대상입니다. 이러한 상황에서 학생들이 학교 교육을 통해 해양생물의 생태와 중요성을 배우는 것은 매우 뜻깊은 일이며, 미래 세대의 해양 인식 제고에도 중요한 역할을 합니다. 이를 통해 해양생물에 대한 인식을 넓히고, 해양환경 보호와 해양과학에 대한 관심을 자연스럽게 유도하는 데 그 목적이 있습니다.
