description_portal: 이 데이터는 해양수산부에서 우리나라 주변 해역의  격자지점별로 장기간 동안의 유의파고, 주기, 파향과 같은 파랑정보을 추산할 목적으로 구축된 데이터입니다.  본 데이터의 주요 내용은 우리나라 주변 해역에서 장기간의 파랑 추산 자료를 산출하기 위해 설정된  520개의 격자지점의 이름, 좌표 등 공간지형 데이터(SHP파일)로 구성되어 있습니다.본 데이터는 해양 공학 관련 연구, 해양 인프라 설계, 파랑에 의한 구조물 안정성 평가, 해양 위험요소 진단, 해양 재난 대응 정책 수립 등을 위한 기반 데이터로써 활용될 수 있습니다.
