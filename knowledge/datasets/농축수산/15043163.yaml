description_portal: '대한민국 식품명인 지정제도- 목적: 우수한 전통식품의 계승 및 발전을 위하여 식품제조, 가공, 조리 등 분야를 정하여 식품명인으로 지정 및 육성- 신청자격: 해당 식품의 제조,가공,조리 분야에 계속하여 20년 이상 종사하거나, 식품명인으로부터 전수교육을 5년이상 받고 10년 이상 그 업에 종사한 자, 혹은 전통식품의 제조,가공,조리방법을 원형대로 보전 및 그대로 실현할 수 있는 자- 선정주체: 농식품부- 선정절차: 신청자(신청서제출) -> 시도지사(서류검토 및 현지조사) -> 농촌진흥청(현지조사) -> 농식품부(심의위원회 구성, 식품명인 최종 선정)이 데이터는 대한민국 전통 식품의 계승과 발전을 위해 지정된 식품명인들의 정보를 담고 있습니다. 각 식품명인에 대한 지정번호, 성명, 보유 기능(전통식품명 또는 주류 등), 지정일, 그리고 소재지가 포함되어 있으며, 일부는 일반 식품 외에도 수산 분야 식품명인으로 별도 구분되어 있습니다. 1994년부터 최근까지의 지정 이력을 바탕으로 전국에 분포된 식품명인들의 명칭, 지역, 기술 분야를 파악할 수 있으며, 전통 식문화의 지역적 특성과 전승 현황을 분석하는 데 유용하게 활용됩니다. 해당 데이터는 정책 수립, 전통식품 산업 연구, 문화관광 콘텐츠 개발 등의 목적으로도 활용 가능성이 높습니다.'
