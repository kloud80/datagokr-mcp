summary_user: 국립농산물품질관리원이 지정한 차·전통주·김치 분야 전문인력 양성 및 교육훈련기관의 지정현황을 기관 한 곳당 한 행으로 담은 전국 단위 목록이다. 구분, 지정번호, 지정일자, 법인·단체명, 소재지, 인력양성분야가 들어 있다. 전통주나 김치 관련 교육을 받으려는 국민이나 창업 준비자가 "우리 지역에 정부가 지정한 김치(또는 차·전통주) 교육훈련기관이 있는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 법인·단체명이나 소재지 주소를 이름 매칭하는 방식으로만 이어 쓸 수 있다.
description_portal: 전통식품품질인증은 국내산 농수산물을 주원(재)료로 하여 제조·가공·조리되어 우리 고유의 맛·향·색을 내는 우수한 전통식품에 대하여 정부가 품질을 보증하는 제도로 생산자에게는 고품질의 제품생산을 유도하고, 소비자에게는 우수한품질의 우리 전통식품을 공급하기 위한 제도로서 본 정보는 전통식품 중 국립농산물품질관리원에서 관리하는 차, 전통주, 김치 전문인력 양성 및 교육훈련기관 지정에 대한 현황으로서, 구분, 지정번호, 지정일자, 법인_단체명, 소재지, 인력양성분야로 구성된 데이터입니다.
