description_portal: 도시농업 관련 자격증 및 등급에 대한 데이터로 자격종목코드, 자격등급, 자격종목명, 자격등급명 정보를 제공합니다.본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘도시농업 관련 자격증 정보’에 대한 상세 자료이다. 도시농업 분야에서 취득 가능한 자격증의 명칭, 자격증 코드, 발급 기관, 자격 요건, 시험 과목, 응시 절차, 발급 수수료 등의 정보를 포함하고 있다. 해당 데이터는 도시농업에 관심 있는 국민, 예비 도시농부, 교육기관 관계자 등이 자격증 취득을 위한 정보를 쉽게 확인하고 활용할 수 있도록 구성되어 있다. 또한, 자격증별 발급 기관의 연락처 및 홈페이지 주소 등도 함께 제공되어 자격증 취득에 필요한 실질적인 정보를 제공한다. 데이터는 CSV 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 활용이 가능하다.
