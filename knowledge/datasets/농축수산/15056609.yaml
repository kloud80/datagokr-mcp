summary_user: 경기도에 가축거래상인으로 등록된 사업장을 한 곳씩 담은 건별 현황 데이터로, 사업장명·인허가일·영업상태·폐업일·축산업무 구분과 도로명·지번 주소, 위경도를 포함한다. 방역 담당자나 축산 유통 분석가가 '우리 시군에 영업 중인 가축거래상이 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드·시군명(SIGUN_CD)이나 주소·좌표로 다른 경기도 데이터와 이름·위치 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 축산업 중 ‘가축거래상인’으로 등록된 사업체의 현황 정보를 담고 있으며, 지역별로 운영 중인 사업장의 분포와 특성을 파악할 수 있도록 구성되어 있습니다. 데이터에는 각 사업장의 명칭, 인허가 시점, 현재의 영업상태, 그리고 축산업무의 구분 정보가 포함되어 있으며, 이는 주로 행정 관리 및 가축 유통 관련 정책 수립에 활용될 수 있습니다. 또한 도로명주소, 지번주소, 우편번호, WGS84 기준 위도 및 경도 정보를 포함함으로써 지도 기반의 공간분석이나 위치 기반 행정 서비스 제공에도 적합합니다. 해당 데이터는 가축의 거래와 유통 경로 파악, 허가 사업장 집중도 분석, 불법 영업 단속, 축산 관련 방역 관리 등 다양한 공공·행정 목적에 활용될 수 있습니다.
