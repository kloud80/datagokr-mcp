description_portal: 조경수목 관리방법에 책자에서 농약(작물보호제) 사용일람표를 발췌한 파일입니다. 병해충 관리는 수목의 건강을 유지하고 피해를 최소화하기 위해 필수적이며, 병해충의 종류와 특성을 정확히 파악한 후 적절한 방제법을 선택해야 효과적인 관리가 가능합니다. 이 자료에서는 수목명과 병해충명을 함께 검색하면 해당 병해충에 적용 가능한 농약의 유효성분, 사용 시기와 방법, 사용량, 약제의 계통 등의 정보를 쉽게 확인할 수 있도록 구성되어 있습니다. 또한, 농약 사용 시 안전과 환경 보호를 위한 지침과 주의사항도 함께 확인할 수 있도록 한국작물보호협회 홈페이지 내 ‘작물보호제 지침서’ 메뉴를 안내하고 있습니다.
