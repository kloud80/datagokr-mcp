description_portal: '진도군 농업기술센터에서 운영 중인 농기계 임대사업 추진 데이터는 농업인들이 농기계를 임대하여 효율적인 농업 활동을 할 수 있도록 지원하는 프로그램의 세부 정보를 포함한 자료입니다. 이 데이터에는 다양한 농기계 장비의 명칭, 장비형식, 보유대수, 사용료 등이 포함됩니다. 장비명은 특정 농기계의 종류(예: 트랙터, 경운기, 이앙기 등)를 나타내며, 장비형식은 해당 기계의 모델이나 규격을 명시합니다. 보유대수는 센터가 보유하고 있는 해당 장비의 수량을 나타내며, 사용료 항목은 임대료와 관련된 금액 정보를 제공합니다. 이를 통해 농업인들이 필요할 때 적절한 농기계를 합리적인 가격으로 임대할 수 있도록 지원하며, 농업 생산성 향상에 기여할 수 있는 중요한 정보를 제공합니다.'
