summary_user: 국립해양조사원이 조위관측소·조위계로 1일~1년 동안 수행한 장·단기 조석관측의 조위값을 관측지점·관측일시별로 담은 건별 관측 데이터로, 범위는 전국이며 지점마다 위도·경도 좌표가 붙는다. 낚시·레저 이용자나 어업인, 연안 연구자가 특정 연안 지점의 시간대별 물높이 변화와 물때를 확인하거나 조석 분석에 쓴다. 전역 조인 키는 없어 관측지점 코드(관측소코드)나 지점명으로 같은 기관의 다른 해양 관측·예보 데이터와 맞추고, 위도(lat)·경도(lot) 좌표로 다른 공간 데이터와 위치 기반으로 겹쳐 본다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소나 조위계 등을 통해 일정 기간(1일~1년) 동안 수행한 장기 또는 단기 조석관측(조위) 데이터를 제공하기 위해 수집한 데이터 입니다. 관측지점 코드 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측지점명, 관측일시, 관측지점의 위도/경도 위치정보 및 관측값(조위) 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
team:
