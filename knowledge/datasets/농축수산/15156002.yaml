      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        example: '1'
        desc: '페이지번호 (기본값: 1)'
      - name: numOfRows
        required: false
        example: '10'
        desc: '한 페이지 결과 수 (기본값: 10, 최댓값: 300)'
      - name: type
        required: false
        example: xml
        desc: 데이터 타입 (xml 또는 json)
      - name: obsCode
        required: true
        example: SO_1227
        desc: 관측지점 코드
      - name: include
        required: false
        example: lot, lat
        desc: '출력하고자 하는 항목명 (ex: lot, lat)'
      - name: exclude
        required: false
        example: lot, lat
        desc: '출력 제외하고자 하는 항목명 (ex: lot, lat)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
