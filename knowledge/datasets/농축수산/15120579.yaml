description_portal: 산림병해충예보발령 데이터를 제공합니다. 이 데이터에는 병해충 발생 상황을 알리기 위해 발령된 발생예보발령제목, 담당 기관을 나타내는 병해충관리기관코드, 예보가 실제로 발령된 날짜인 발생예보발령일자가 포함됩니다. 또한 예보·경보 등 단계 구분을 나타내는 발생경보예보발령구분, 발령 대상 지역을 식별하기 위한 발생예보발령지역코드, 그리고 구체적인 피해 현황과 방제 유의사항 등을 설명하는 발생예보발령내용 정보를 함께 제공합니다. 이를 활용하여 시기별·지역별 병해충 발생 경향을 분석하고, 선제적 방제 계획 수립 및 정책 결정에 참고자료로 사용할 수 있습니다.
