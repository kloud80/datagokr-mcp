description_portal: 본 데이터는 전라남도 목포시 관할 지역 내 축산농가의 사육 현황 정보를 제공하는 자료입니다. 수록 항목은 농가 또는 사업장의 명칭, 주로 사육하는 축종, 사업장이 위치한 주소, 그리고 사육 중인 가축의 두수로 구성되어 있습니다. 이 자료는 축산업에 대한 지역별 분포 현황을 파악하고, 가축 질병 방역, 축산정책 수립, 환경관리 등의 행정적 기초자료로 활용될 수 있도록 마련되었습니다. 특히, 주요 축종별 사육 규모와 농가 위치를 기반으로, 행정기관의 지원사업 대상 선정, 축산시설 관리 및 위기 대응에 필요한 분석 자료로 유용하게 쓰일 수 있습니다. 데이터는 표 형식으로 제공되며, 축산업 관련 민간기업, 연구기관, 지자체 등이 활용할 수 있도록 개방됩니다. 정확하고 투명한 축산업 관리 기반 조성을 목적으로 합니다.
