description_portal: '- 전라남도 내 국, 공, 사립  자연휴양림 현황에 대해 조회하실 수 있습니다(휴양림명, 위치, 지정면적, 준공연도 등)- 자연휴양림은 숲과 자연환경을 보존하면서 사람들이 건강한 휴식과 여가를 즐길 수 있도록 조성된 산림 휴양 공간입니다. 산림 내 다양한 체험과 자연 속에서의 힐링을 제공하는 시설입니다.- 정의: 자연 환경과 산림을 활용하여 휴양·체험·교육 등을 제공하는 산림 휴양 공간- 목적: 도시 생활에서 벗어나 자연 속에서 휴식, 심신 안정, 체험 기회 제공- 운영 주체:산림청, 지방자치단체, 민간 운영자 등- 주요 특징:  자연림을 최대한 보존하며 최소한의 시설 설치, 숲속 산책로, 등산로, 전망대 등 자연 체험 공간, 숲속의 집, 야영장, 캠핑장, 산림 교육장 등 다양한 숙박 및 체험 시설 제공, 산림치유 프로그램 운영(숲 치유, 명상, 자연 관찰 등)'
