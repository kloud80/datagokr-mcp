summary_user: 전라남도 안의 국립·공립·사립 자연휴양림을 휴양림 한 곳당 한 행으로 정리한 현황 파일로, 시군·휴양림명·위치·지정면적(ha)·준공연도·운영 구분을 담고 시도 범위에서 시군구 단위로 구분된다. 주민이나 여행객이 '우리 시군에 어떤 자연휴양림이 있고 언제 생겼으며 국립인지 공립인지'를 확인하거나, 분석가가 시군별 휴양림 수와 지정면적을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 시설코드·좌표가 없어서, 다른 데이터와는 시군 이름이나 휴양림명을 문자열로 맞춰 이어 써야 한다.
