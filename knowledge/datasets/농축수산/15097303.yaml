summary_user: 해양수산부가 생태경관보전지역으로 지정한 해양 구역을 전국 범위로 담은 공간정보로, 지도 이미지(WMS)와 지역명으로 조회하는 구역 경계 좌표(WFS, 좌표열 posList)를 개별 구역 단위로 제공한다. 해상풍력 같은 해양 개발 사업자나 환경영향평가 담당자가 "계획한 해역이 생태경관보전지역과 겹치는가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 해양용도구역·보호구역 등 다른 해양공간 데이터와는 지역명 매핑이나 좌표 기반 공간 중첩으로 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 생태경관보전대상으로 지정된 지역의 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 WMS(웹 맵 서비스) 및 WFS(웹 피처 서비스) 형태로 구분되어 있습니다. WMS데이터는 반환 이미지 크기(픽셀), 검색 범위, 좌표체계 파라미터로 맵 이미지 파일을 조회할 수 있으며, WFS는 지역명 파라미터로 생태경관보전지역의 텍스트 형태 공간정보를 조회할 수 있습니다.본 데이터는 행정기관의 지역 관리 및 분석, 환경영향평가, 토지 이용 계획 수립, 연구 기관의 생태계 변동 모니터링, 학술 데이터베이스 구축 등에 활용될 수 있습니다.
