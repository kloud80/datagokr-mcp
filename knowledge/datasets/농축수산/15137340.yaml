description_portal: '농촌진흥청은 농업기계 해체 및 재활용 지정 현황과 신기술 농업기계 지정 업체 , 기계 기능 등 농업기계와 관련한 정보를  제공하고 있습니다. - 농업기계 제공정보 : 1. 지정일련번호, 2. 지정일자, 3. 기계명, 4. 업체명, 5. 지원기간, 6. 등록자 고유번호, 7. 지정 제품, 8. 핵심 기술 등    * 예) 유한회사 엠엔디, 농업기계, 브러쉬 회전식, 정격출력 0.4kW, 농산물이 투입되는 경로의 상하로의 폭 조절을 통해 농산물의 크기에 상관없는 세척  - 농업인 개인보호장비 제공정보 : 1. 보호구구분, 2. 코드, 3. 제품명    * 예) 3M 방진마스크(8710L)'
