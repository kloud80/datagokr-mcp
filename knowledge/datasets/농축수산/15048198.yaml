summary_user: 전국 도시 텃밭을 한 곳당 한 행으로 담은 원천 목록으로, 텃밭명·운영주체·유형·주소·전체면적·분양면적·분양가격·부대시설·모집기간·신청방법·등록일과 수정일을 담는다. 도시농업을 해 보려는 개인이나 단체가 '우리 동네 근처에 분양 중인 주말농장이 있고 얼마에 몇 평을 빌릴 수 있나'를 찾을 때 쓴다. 전역 조인 키는 없어서 지역 명칭·코드(AREA_LCD 등)나 주소를 이름 매핑해 행정구역 자료와 잇거나, 같은 기관 자료와만 연결한다.
description_portal: '농림수산식품교육문화정보원에서 제공하는 이 데이터는 도시농업의 활성화 및 가치 확산을 유도하기 위해 설계된 중요한 자료입니다. 사용자들은 이 데이터를 통해 각 지역의 텃밭에 대한 다양한 정보를 얻을 수 있으며, 텃밭 운영주체와 유기적인 소통을 통해 도시농업에 참여할 수 있는 기회를 넓힐 수 있습니다. 데이터는 텃밭명, 운영주체, 유형, 주소, 전체면적, 분양면적과 같은 정보를 포함하고 있어 도시농업을 경험하고 싶은 개인이나 단체가 참고할 수 있도록 구성되어 있습니다. 이 데이터는 도시민들이 직접 농업을 체험하고 일상 속에서 자연과 소통할 수 있는 통로를 제공하며, 지속가능한 도시농업의 성장에 기여합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  - 텃밭명(문자형): 각 텃밭의 고유 이름  - 운영주체(문자형): 텃밭을 운영하는 주체의 유형(예: 개인, 단체 등)  - 유형(문자형): 텃밭의 종류(예: 민영주말농장 등)  - 주소(문자형): 텃밭의 정확한 위치  - 전체면적(숫자형): 텃밭의 전체 면적  - 분양면적(숫자형): 분양 가능한 면적  - 분양가격(숫자형): 분양에 필요한 비용  - 부대시설(문자형): 텃밭 내 부대시설의 종류(예: 화장실)  - 모집기간(문자형): 텃밭을 모집하는 기간  - 신청방법(문자형): 텃밭 신청을 위한 방법  - 등록일(날짜형): 데이터가 등록된 날짜  - 수정일(날짜형): 데이터가 수정된 날짜'
