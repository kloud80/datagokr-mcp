summary_user: 농촌진흥청 '똑똑청년농부' 누리집의 청년농업인 정책·교육·사업 안내와 우수 청년농업인 사례를 게시글 단위(제목·내용·도/시군구 지역명·농가명·품목명·출처)로 담으며, 검증 호출에서는 전국 범위로 1행만 받았다. 청년 창업농이나 귀농 준비자가 '우리 시군구에서 특정 품목으로 성공한 청년농 사례와 지원 정책이 무엇인가'를 찾을 때 쓴다. 전역 조인 키는 없고, 다른 데이터와는 도·시군구 지역명이나 품목명을 이름으로 맞춰 연결하며, 상세 조회에 필요한 코드(sCode, seq, typeDv)는 목록 응답에서 먼저 받아 넘긴다.
description_portal: 농촌진흥청이 운영하는 '똑똑청년농부' 누리집은 청년농업인들에게 필요한 정보를 제공함을 목적으로 개설되었습니다. '똑똑청년농부'에서 제공하는 정보는 청년농업인 관련 정책과 교육, 관련 사업 등입니다. 또한, 우수 청년농업인 사례와 더불어 경영모의계산을 사전에 해볼 수 있습니다. API를 이용하면서 에러가 발생시 result obj안에 메시지 및 에러코드 발생합니다. Q&A 페이지를 운영하고 있기 때문에 추가적인 도움이 필요하면 Q&A를 활용하거나 유선전화를 활용하여 담당자에게 문의할 수 있습니다.
