description_portal: '- 전라남도 내 정보화마을 현황(마을명, 특산물, 소재지, 조성차수, 위도 및 경도 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도 정보화마을은 디지털 기술을 활용하여 농촌 지역의 발전과 도민들의 삶의 질 향상을 목표로 하는 스마트 농촌 플랫폼입니다. 이 마을들은 정보통신기술(ICT)을 기반으로 농업, 관광, 교육, 복지 등 다양한 분야에서 디지털 서비스를 제공하며, 지역 주민들의 참여와 협력을 통해 지속 가능한 발전을 추구합니다.- 전라남도 정보화마을은 디지털 기술을 통해 농촌 지역의 발전을 이끌어가고 있으며, 주민들의 적극적인 참여와 협력을 통해 지속 가능한 스마트 농촌 사회를 만들어가고 있습니다.- 지역 주민들을 대상으로 디지털 교육 프로그램을 운영하여 정보화 역량을 강화하고, ICT 기술을 일상 생활에 적용할 수 있도록 지원합니다.'
