description_portal: 이 데이터는 해양수산부에서 추진하는 어촌뉴딜300사업과 관련하여 질의응답 및 설문조사 정보를 수집한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 어촌어항재생사업 관리시스템을 이용하는 사용자들(대국민, 내부사용자, 지자체 공무원 등)을 대상으로 실시한 시스템 만족도 설문조사 질문코드, 질문내용및 답변 등으로 구성되어 있습니다.   본 데이터는 어촌뉴딜300사업에 참여하는 주민 및 관계자들의 시스템 이용 경험을 분석하거나 사업 운영 및 시스템 개선 방안을 마련하는 데 활용될 수 있습니다. 또한 설문조사 결과를 바탕으로 사용자 요구사항 파악, 정책 수립, 어촌지역 사업 추진 시 참고자료로 사용될 수 있습니다.
