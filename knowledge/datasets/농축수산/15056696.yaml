summary_user: 경기도 시군별·연도별로 한우 농가 지도·관리 지원사업의 지원 유형과 사업량(두수), 도비·시군비·자부담 분담액을 담은 집계 자료다. 축산 행정 담당자나 분석가가 "어느 시군이 어떤 한우 지원사업에 도비와 시군비를 얼마나 들였나" 같은 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않았고, 시군 코드(SIGUN_CD)나 시군명으로 같은 경기도 데이터와 이름·코드를 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 한우 농가를 대상으로 수행된 다양한 지도 및 관리 지원사업의 현황을 정리한 자료로, 연도별 및 시군별로 관련 사업의 집행 규모를 확인할 수 있습니다. 각 행은 특정 시군의 연도별 지원 유형과 함께 지원 규모에 대한 정보를 포함하고 있으며, 사업의 종류에 따라 재정 지원이 어떻게 분담되었는지와 지원 실적 규모를 분석할 수 있습니다. 이를 통해 축산 행정의 재정 집행 현황, 지역별 한우 관련 정책의 중점 분야, 스마트축산이나 품질관리 사업의 확산 여부 등을 파악할 수 있으며, 지역 맞춤형 축산 지원 전략 수립에도 활용될 수 있습니다.
