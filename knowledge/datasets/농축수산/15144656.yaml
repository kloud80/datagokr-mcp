summary_user: 농식품 공공데이터포털에 등록된 코드그룹 목록을 그룹 코드·그룹 명·설명과 정의 명(A~C) 단위로 담은 코드표 성격의 자료로, 범위는 전국·비공간이다. 분석가나 개발자가 농식품 공공데이터를 받아 쓸 때 "이 코드값은 어떤 분류체계에 속하고 무슨 뜻인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 없어, 다른 농식품 데이터셋과는 그룹 코드나 이름을 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 농림축산식품부가 운영하는 농식품 공공데이터포털에 등록된 코드그룹 목록을 체계적으로 정리한 자료입니다. 코드그룹별로 분류체계와 관련 속성 정보를 포함하여 데이터 표준화를 지원하며, 다양한 데이터셋의 일관된 분류와 관리에 활용됩니다. 이를 통해 데이터 이용자들이 농식품 관련 공공데이터의 구조를 명확히 이해하고 효율적으로 활용할 수 있도록 도움을 줍니다. 또한, 공공데이터의 품질 향상과 데이터 관리 체계 확립에 기여하며, 농업 및 식품 분야의 정책 수립과 연구에 중요한 기반 자료로 사용됩니다. 본 자료는 데이터의 정확성과 신뢰성을 높이는 데 필수적입니다.
