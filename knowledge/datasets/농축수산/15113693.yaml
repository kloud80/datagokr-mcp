description_portal: 이 데이터는 해양수산부 국립해양조사원에서 국내 해양과학조사자료 목록통합관리 및 공동활용데이터 중 선형 정보 제공을 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해양과학조사자료의 SHP형식 선형 공간정보 파일로 구성되어 있으며, 각 조사지역의 조사해역코드, 조사기관코드, 조사연도, 조사내용, 조사선박, 조사장비, 조사자 및 자료 담당자 정보 등을 포함하고 있습니다. 본 데이터는 해양과학 연구기관이 해양조사 기초자료를 분석하거나, 해양과 관련된 정책을 수립할 때 조사자료의 활용 현황을 파악하는 데 활용될 수 있으며, 해양공간계획 수립, 해양환경 영향평가, 학술연구 등의 용도로도 활용할 수 있습니다.
