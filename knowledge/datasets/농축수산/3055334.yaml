summary_user: 국립농산물품질관리원이 지리적표시 인증을 내준 농수산물·가공품을 등록 건별로 담으며, 등록번호·등록명칭·등록일자·대상지역·생산계획량·구성현황을 포함하고 범위는 전국이다. 특정 지역 특산품이 지리적표시로 등록됐는지, 언제 등록됐고 생산계획량이 얼마인지 확인하려는 소비자·생산자단체나 기간별 등록 추이를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 등록명칭·대상지역 이름 매핑으로만 잇고, KAMIS 등 가격 데이터와 붙이려면 품목명 매핑이 따로 필요하다.
description_portal: 국립농산물품질관리원에서 관리하는 지리적표시 인증을 획득한 농수산물 또는 농수산 가공품 정보로서, 등록번호, 등록명칭, 등록일자, 대상 지역, 생산 계획량, 구성 현황 항목으로 구성되어 있습니다. 지리적표시제란 농수산물 또는 농수산 가공품의 명성·품질 기타 특징이 특정지역의 지리적 특성에 기인하는 경우 그 특정지역에서 생산된 특산품임을 표시하는 제도입니다. 기간별 등록건수 및 생산계획량 정보 등 통계자료를 작성하여 지리적표시제도에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대됩니다.
