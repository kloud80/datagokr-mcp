description_portal: 성남시 내 개인 주말농장에 대한 자료이며, 농장명 농장주 장소 신청기간 1구좌기준 금액 운영구좌 분양면적 등의 항목으로 구성되어 있습니다.개인 주말농장 현황은 도시 또는 인근 농촌 지역에 거주하는 시민들이 여가 시간에 농작물을 재배할 수 있도록 조성된 소규모 농지(텃밭)의 운영 실태를 나타내는 자료입니다. 주말농장은 도시민의 농업 체험, 여가활동, 공동체 형성, 식생활 교육 등의 측면에서 중요한 역할을 하며, 특히 도시농업 활성화 정책과 연계되어 지자체나 공공기관에서 운영하거나 민간에서 위탁 운영도 합니다.
