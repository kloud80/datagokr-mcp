summary_user: 국가농작물병해충관리시스템과 농림축산검역본부 식물검역정보시스템의 병해충 정보를 병해충 한 건씩 연결한 매핑 파일로, 양쪽 고유번호·검역 식별코드·상세정보·상세정보 주소·병해충명을 담는다(CSV 약 4.6MB). 검역 담당자나 농업 분석가가 '수입 검역에서 쓰는 병해충 코드가 국내 병해충관리시스템의 어떤 병해충 정보와 같은 대상인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 병해충명이나 두 시스템의 고유번호·검역 식별코드로만 같은 기관 자료와 맞춰 쓴다.
description_portal: 이 데이터는 농림수산식품교육문화정보원에서 운영하는 국가농작물병해충관리시스템과 농림축산검역본부의 식물검역정보시스템 간 병해충 정보를 연계한 자료입니다. 주요 항목에는 국가농작물병해충관리시스템 고유번호, 병해충 검역 식별코드, 병해충상세정보, 상세정보 주소, 식물검역정보시스템 병해충명이 포함되어 있습니다. 각 항목은 병해충의 고유번호, 검역코드, 세부정보, 관련 링크 및 병해충명을 제공하여 병해충 데이터를 체계적으로 관리할 수 있도록 구성되었습니다. 데이터 내 코드와 세부 항목의 설명은 제공되는 매뉴얼을 참고하시기 바랍니다.
