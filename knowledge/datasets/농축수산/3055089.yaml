description_portal: 해당 데이터는 기상 여건 등에 따라 수급 불안이 발생하기 쉬운 노지채소 품목에 대해 농협과 농가 간 계약재배를 통해 수급과 가격 안정을 도모한 현황을 정리한 자료입니다. 제공 목록으로는 연도, 시도, 시군구, 읍면동, 사업방식, 품목, 계약농가수, 계약물량, 계약면적, 계약금액 등이 포함되어 있습니다. 이 데이터를 통해 지역별 계약재배 현황을 면밀히 파악하여 수급 불안 품목의 안정적 공급을 지원할 수 있으며, 농가 입장에서는 계약재배 참여 확대 여부와 수익성 개선 방안을 검토하는 근거자료로 활용할 수 있습니다. 또한 노지채소 계약재배 제도의 효과성을 분석하여 농산물 유통구조 개선, 가격 변동성 완화, 소비자 신뢰 제고 등 다방면의 정책 개선에 활용할 수 있습니다.
