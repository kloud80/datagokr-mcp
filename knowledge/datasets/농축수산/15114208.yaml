description_portal: 이 데이터는 해양수산부에서 남해안에 설치된 자동위치식별신호표지(AIS)의 현황을 파악하고 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 자동위치식별신호표지의 공간정보 일련번호, 수집 대상 자료 출처명과 출처 상세정보, 표지의 명칭과 설치 위치 명칭 등으로 구성되어 있습니다.   본 데이터는 남해지역 해상 교통의 안전 관리를 위한 해상신호체계 파악, 신호표지 유지관리 계획 수립, 항해 지원 시스템 개발, 해양 안전시설 개선 등 활동을 위한 기초 데이터로써 활용될 수 있습니다.
