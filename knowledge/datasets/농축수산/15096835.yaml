description_portal: '제주특별자치도 내 GAP 인증 농가 정보 데이터를 제공합니다.항목: 지정연도, 생산자, 품목, 농가수, 재배면적, 생산계획량(톤), 소재지 등* 제주특별자치도 내에서 GAP 인증 농가들에 대한 등록 현황을 정리한 자료입니다. GAP는 “농산물 우수관리제도(Good Agricultural Practices)”의 약자로, 농산물의 안전성과 품질을 보장하는 인증 제도입니다. 제주도 농업 분야에서는 감귤, 한라봉, 천혜향, 딸기, 키위 등 다양한 품목이 GAP 인증을 받고 있으며, 이러한 인증 농가는 재배 방식, 농약 사용, 토양 관리 등을 엄격한 기준 하에 운영됩니다. 이 정보를 통해 제주도의 농업 품질관리 수준, 안전농산물 생산 규모, 인증 농가가 점차 늘고 있는지 또는 특정 품목 중심으로 성장하고 있는지 등을 파악할 수 있습니다.* 활용 분야 : 농업 품질관리 및 안전 인증 확대 전략 수립, 농업 유통 및 마케팅 경쟁력 강화 등데이터 제공처: 국립농산물품질관리원'
