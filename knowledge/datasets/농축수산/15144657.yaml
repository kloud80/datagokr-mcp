summary_user: 농식품 공공데이터포털이 데이터셋을 나누는 분류체계를 분류 코드·분류명·상위 분류 코드·정렬 순서·사용 여부 단위로 담은 목록이며, 범위는 전국·비공간이다. 분석가나 개발자가 농식품 공공데이터포털의 데이터셋이 어떤 분류 계층에 속하는지 확인하고 목록을 분류별로 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 상위 분류 코드로 자기 계층을 잇는 것 외에는 분류명·코드 매핑이나 같은 기관 코드로만 다른 데이터와 연결한다.
description_portal: 본 데이터는 농림축산식품부에서 제공하는 농식품 공공데이터포털의 분류체계 목록을 체계적으로 정리한 자료입니다. 다양한 농식품 관련 데이터셋을 분류하는 기준과 체계를 명확히 하여 데이터의 일관성과 표준화를 지원합니다. 이를 통해 데이터 이용자들은 복잡한 농업 및 식품 관련 정보를 효율적으로 이해하고 분석할 수 있으며, 연구 및 정책 수립에 필요한 기초 자료로 활용할 수 있습니다. 또한, 분류체계의 명확한 정의는 데이터 관리의 정확성을 높이고, 공공데이터 품질 향상에 기여합니다. 본 자료는 농림축산식품부 공공데이터의 체계적 운영과 활용을 위한 중요한 기반 정보를 제공합니다.
