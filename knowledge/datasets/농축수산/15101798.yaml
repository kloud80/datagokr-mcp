summary_user: 전국 잠업가구의 양잠형태별 생산현황, 누에 생산, 판매 실적을 전국 단위로 집계한 표 형태의 파일 데이터로, 첫 열 제목이 '기능성 양잠 현황(총괄)'이고 나머지 열은 이름 없는 다단 표 구조다. 양잠 정책 담당자나 분석가가 '양잠 형태별로 누에 생산량과 판매 실적이 어떻게 나뉘는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목·지역 이름 매핑이나 같은 기관(농림축산식품부) 자료 기준으로만 이어 쓴다.
description_portal: 해당 데이터는 양잠산물 생산현황에 관한 데이터로, 잠업에 종사하는 전국의 모든 잠업가구의 양잠형태별 생산현황, 누에 생산, 판매 실적 등을 조회할 수 있는 서비스입니다. 이 데이터는 잠업 농가의 연간 양잠산물 생산량과 판매 동향을 체계적으로 파악할 수 있도록 구성되어 있으며, 각 농가의 생산 능력, 양잠 형태별 효율성, 누에 생산량과 판매 실적 간의 연계성을 분석하는 데 활용됩니다. 또한 잠업 산업 전반의 생산 구조, 시장 참여 정도, 소득 구조 등을 이해할 수 있어 정책 수립과 지원 사업, 기술 보급, 시설 현대화, 소득 안정화 방안 마련 등 다양한 목적에 활용됩니다. 이를 통해 지속 가능한 양잠업 육성과 경쟁력 강화, 그리고 잠업 관련 산업 발전 전략 수립에도 기초 자료로 활용할 수 있습니다.
