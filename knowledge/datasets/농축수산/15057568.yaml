summary_user: 경기도 농업인 자녀 대학 학자금 지원 현황을 연도(SUM_YY)별로 집계한 통계로, 지원 인원·총지원액과 국비·도비·시군비 분담액을 담는다. 농촌 교육복지 정책 분석가가 '연도별 지원 인원과 지원액, 도와 시군의 재정 분담 비율이 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 기준으로만 맞춰 붙일 수 있다.
description_portal: 이 데이터는 경기도 내 농업인 자녀를 대상으로 한 대학 학자금 지원 현황을 연도별로 정리한 통계 자료입니다. 주요 내용은 지원 인원수와 총지원액을 비롯해, 도비와 시군비로 구성된 재정 분담 구조가 포함되어 제공됩니다. 이 데이터를 통해 특정 시기의 농촌 교육 지원 규모와 정책 변화를 파악할 수 있으며, 농업인 가정의 교육비 부담 경감 효과, 지방정부의 교육복지 실현 노력 등 다양한 행정·정책 분석에 활용될 수 있습니다. 특히 농촌지역 청년층의 고등교육 접근성과 지역 교육격차 해소를 위한 장기적 지원 전략 수립에도 유용한 기초 자료입니다.
