description_portal: '<데이터 수집목적 및 과정> 경상남도에 소재하고, 수의사법에 의거 도지사·시장·군수·구청장에게 동물병원 개설신고가 된 등록정보 현황(2026년 5월 8일 기준)을 제공합니다. 가축, 반려동물 등 양육자들은 동물병원의 주소, 전화번호 등을 활용하여 경상남도내에서 동물진료·예방접종·치료와 같은 동물의료 서비스 제공을 받을 수 있습니다.  ※ 개설 동물병원 : 수의사, 국가 또는 지방자치단체, 동물 진료업을 목적으로 설립한 법인, 수의학을 전공하는 대학(수의학과가 설치된 대학을 포함한다) 및 「민법」이나 특별법에 따라 설립된 비영리법인이 운영하는 동물병원<데이터 구성 및 세부항목> 데이터는 동물병원명, 주소, 대표자명, 신고일자, 근로 수의사수, 면적으로 구성됩니다. 해당 링크를 통해 접속하면 데이터를 조회 및 다운로드 하실 수 있습니다.<데이터 현행화 시기> 해당 데이터는 연간 현행화 데이터입니다. 차기 업데이트 예정일은 2027년 5월 입니다.'
