description_portal: 해양환경정보 통합관리시스템에서 제공하는 갯벌지역을 측량한 공간정보(MULTIPOLYGON 형식)를 제공합니다. 갯벌의 사전적 의미는 ‘고조시에는 잠기고 저조시에는 드러나는 연안의 평탄한 지역’ 을 말한다. 즉 갯벌이란 조류로 운반되어 온 미세한 흙들이 파도가 잔잔한 해안에 오랫동안 쌓여 생기는 평탄한 지형을 말하는 것이다. 다시 말해 갯벌은 주로 조류에 의해 운반되는 퇴적물이 쌓여 이루어지는 해안 퇴적지형이다. 한국의 갯벌은 한반도 서남해안과 황해의 동쪽 연안에 위치하고 있으며, 4개의 구성요소를 가지는 유네스코 연속유산이다.
