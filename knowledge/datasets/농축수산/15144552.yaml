summary_user: 전국 갯벌지역을 측량한 공간정보를 갯벌 구역(폴리곤)별로 담은 파일로, 구역마다 갯벌지역ID·갯벌면적·형상면적·형상길이와 MULTIPOLYGON 형식의 공간정보(공간정보)가 들어 있다. 해양공간계획이나 해상풍력 등 연안 개발 입지를 검토하는 분석가가 '이 사업 예정지가 갯벌과 겹치는가'를 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없으므로, 해양용도구역·보호구역 등 다른 해양공간 데이터와는 공간 중첩(겹침 분석)이나 이름 대조로 이어 쓴다.
limits: 실측 컬럼에 법정동·행정구역 코드 같은 전역 조인 키가 없어 행정단위별 집계나 다른 표와의 직접 결합은 공간 연산 또는 이름 매핑을 거쳐야 한다. 파일 범위는 전국이나 행정단위 구분 없이 제공된다.
