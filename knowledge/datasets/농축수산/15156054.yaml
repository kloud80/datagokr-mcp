summary_user: 전국 산지공판장(도매시장 밖에서 산지 수집·분산을 맡는 공판장)의 경매 거래를 원표·경매순서 단위로 담은 건별 원천 데이터로, 정산일자·품목·규격·등급·물량·낙찰가·원산지 등을 제공한다. 산지 출하 농가나 유통업자가 '이번 주 특정 품목이 산지공판장에서 등급별로 얼마에 낙찰됐나'를 확인하거나, 분석가가 산지 가격과 도매·소매 가격을 비교하는 데 쓴다. 전역 조인 키는 없어 상품대분류·중분류 코드(gds_lclsf_cd 등)와 품목명을 KAMIS·도매시장 품목코드에 직접 매핑해 이어 써야 한다.
