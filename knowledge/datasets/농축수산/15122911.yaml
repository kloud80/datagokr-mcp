summary_user: 경기농정통합시스템에 등록된 경기도 내 자연·생태 체험프로그램을 행사 한 건 단위로 담으며, 주관기관·행사명·모집인원·예약 최대/최소 인원·행사 기간·예약 기간과 시간·휴무요일·당일예약 가능 여부가 들어 있다. 시민이 "이번 달 경기도에서 아이와 갈 수 있는 숲 교육·생태 체험은 언제 예약하나"를 찾거나, 분석가가 공공 체험시설의 운영 기간과 예약 조건을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주관기관명이나 행사명 같은 이름 매핑으로만 잇는다.
description_portal: 이 데이터는 경기농정통합시스템에서 수집한 체험 프로그램 관련 정보로, 경기도 내에서 진행되는 자연·생태 기반의 다양한 체험활동에 대한 정보를 제공합니다. 주요 항목으로는 아이템아이디, 행사주관기관, 행사명, 모집인원, 예약최대·최소인원, 행사일정(시작일 및 종료일), 예약기간 및 시간, 휴무요일, 당일예약가능여부 등이 포함되어 있습니다. 체험프로그램은 주로 지역 내 자연환경 및 생태자원을 활용하여 시민들에게 체험학습과 여가 기회를 제공하는 활동으로, 숲 교육, 민물고기 생태교육, 식물원 해설 등 다양한 형태로 운영됩니다. 본 데이터는 시민참여를 통한 환경교육, 공공체험시설 운영 분석, 지역 관광·교육정책 수립 등에 활용될 수 있으며, 경기도 내 체험프로그램 운영 현황을 체계적으로 파악하는 데 기여할 수 있습니다.
