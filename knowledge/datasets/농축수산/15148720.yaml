description_portal: 이 데이터는 해양수산부에서 해양환경관리공단하구역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일자, 전기전도도, 수온, 수소이온농도, 용존산소량, 탁도, 일사량, 기온, 상대습도, 풍속, 풍향 등의 데이터로 구성되어 있습니다.본 데이터는 해양환경관리공단하구역 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양환경관리공단하구역이란 해양환경공단이 관리하는 강이 바다와 만나는 지점으로 해양생태계와 하천이 연결되는 특수한 지역을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
