summary_user: 국립축산과학원이 등록한 축산 가격동향 보고서를 게시글 단위로 담으며, 보고서 제목·등록일자·조회수·첨부파일 이름과 다운로드 경로가 들어 있고 범위는 전국·비공간이다. 연구자나 유통업 종사자가 특정 기간에 나온 축산물 가격동향 보고서를 찾아 원문 파일을 내려받을 때 쓴다(가격 수치 자체가 아니라 보고서 목록). 실측 컬럼에 전역 조인 키가 없어 KAMIS 등 다른 가격 데이터와는 품목명·기관 코드 같은 이름 매핑으로만 연결한다.
description_portal: 본 자료는 축산물 가격 변동에 대한 정보를 제공하는 축산 가격동향 공공데이터로, 사용자가 원하는 검색 기간을 입력하면 해당 기간에 등록된 축산 가격 관련 정보를 확인할 수 있도록 구성되어 있습니다. 제공되는 정보에는 가격동향 보고서의 제목, 등록일자, 조회수, 그리고 축산 가격동향 정보를 파일 형태로 다운로드할 수 있는 경로가 포함되어 있어, 관련 산업 종사자나 연구자, 정책 수립자 등이 시장 흐름을 분석하고 의사결정에 활용하는 데 유용합니다. 자료는 축산물의 가격 동향을 포함하고 있으며, 시세 변화에 따른 수급 조절, 유통 전략 수립, 소비자 대응 방안 마련 등에 중요한 참고자료로 활용될 수 있습니다.
