summary_user: 2015년 농축수산물 표준코드의 포장상태코드(STD_FRMLC_NEW_CODE)와 2013년 구 표준코드의 포장상태코드를 짝지은 신구 대응표로, 코드·포장상태명·수정일자를 행 단위로 담는 전국 단위 비공간 코드 목록이다. 도매시장 경락가격이나 유통 자료에 구 포장코드와 신 포장코드가 섞여 있을 때 "이 옛 포장코드는 새 기준으로 무엇인가"를 확인하려는 분석가·유통업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관의 표준코드 체계를 쓰는 가격·거래 데이터와 포장코드 값이나 포장상태명으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 2015년에 제정 및 개정된 농축수산물 표준코드에 기반하여, 2013년에 사용된 농축수산물 표준코드와 동일한 의미를 가지는 품목, 시장, 단위, 포장, 크기, 등급 및 산지에 대한 정보를 제공합니다. 이러한 정보는 농수산물의 유통 전 과정에서 그러한 제품들이 표준적으로 어떤 기준으로 포장되고 구분되는지에 대해 중요한 기준이 됩니다. 특히 이 데이터는 최신 기준에 따른 농수산물의 포장상태코드를 포함하고 있어, 학술적인 분석이나 품질검사, 유통 관리 등의 다양한 분야에서 활용될 수 있습니다. 또한, API의 오퍼레이션으로는 신구표준포장목록조회가 제공되며, 이 오퍼레이션은 2015년 농축수산물 표준코드의 포장상태코드와 일치하는 정보를 조회할 수 있습니다. 따라서 포장상태명 및 업데이트일자와 같은 중요한 표준코드 매핑 정보 또한 포함되어 있습니다.
