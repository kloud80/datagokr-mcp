description_portal: '본 자료는 대전광역시 서구 관내에서 추진된 조림사업의 연도별 추진 현황에 대한 정보를 수록하고 있습니다.해당 데이터는 2019년부터 당해년도(데이터 수정일) 까지의 사업 실적을 포함하고 있으며, 각 조림사업의 **대상지 정보(시군 및 세부 소재지)**를 비롯하여, 투입된 사업비, 조림 면적 및 수량 등 사업량, 그리고 **시행된 공종(예: 큰나무조림, 경제림조성, 유휴지활용조림 등)**에 대한 세부 내용을 확인할 수 있도록 구성되어 있습니다.이 자료는 산림자원의 지속 가능한 관리와 향후 조림정책 수립을 위한 기초자료로 활용될 수 있습니다.'
