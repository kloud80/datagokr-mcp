description_portal: '전주시 관내 반려동물 및 산업동물의 진료와 질병 예방을 위해 운영되는 동물병원의 현황을 제공하는 데이터입니다.시민의 동물의료 서비스 이용 편의성을 높이고, 동물복지 정책 수립과 관련 산업 분석의 기초자료로 활용할 수 있습니다.동물병원 인허가 정보를 표준화하여 제공하여 축산농가의 동물의료 서비스 접근성 향상과 가축 질병의 예방 및 신속한 대응 지원합니다.전북특별자치도 전주시의 가축대상 동물병원을 제공하며, 업소명, 신고일자, 주소, 전화번호 등을 제공합니다.제공부서 : 동물정책과'
