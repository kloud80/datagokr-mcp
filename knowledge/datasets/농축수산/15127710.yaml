description_portal: 이 데이터는 해양수산부 어촌뉴딜300사업 대상지의 일반현황과 추진현황을 관리시스템 관리 목적으로 수집한 데이터입니다.  본 데이터의 주요 내용은 2019년도부터 2022년도까지 어촌뉴딜300사업의 대상지별로 구분된 추진현황 정보를 담고 있습니다. 사업년도, 시군구명, 항명, 세부계획 및 수행 정보로 구성되어 있습니다.  본 데이터는 지방자치단체나 어촌 지역의 관련 부서에서 어촌뉴딜300사업의 대상지별 사업 추진 경과를 비교‧분석할 때 활용할 수 있으며, 정책평가나 예산 집행 관리, 사업성과 점검 자료로도 활용될 수 있습니다. 산업계에서는 어촌 지역 개발사업 진출 전 현황 파악이나 사업 참여 전략 수립을 위한 기초자료로 사용할 수 있고, 학계 및 연구기관에서는 지역개발 효과 분석이나 어촌 정책 연구 자료로 활용할 수 있습니다.
