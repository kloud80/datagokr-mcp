summary_user: 농림축산검역본부가 집계한 수출 동물, 합격한 수입 동물, 수출·수입 축산물의 검역실적을 전국 단위로 담은 집계 파일이다(포털 설명은 2023년 기준이지만 실측 첫 컬럼 제목은 '2025년 수출동물 검역실적'). 방역·무역 분석가가 "올해 어떤 동물과 축산물이 얼마나 수입 검역을 통과했는가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목명·국가명 매핑이나 같은 기관 자료로만 연결하며, 축산물 가격(KAMIS) 등과 붙이려면 품목코드 매핑이 따로 필요하다.
description_portal: 2023년  수출 동물, 수입 동물(합격),  수출 축산물 검역, 수입 축산물 검역실적(일반검역, 합격) 정보를 제공하기 위한 데이터- 검역 합격 및 불합격 판정 내역, 주요 질병 검사 결과, 관련 통계 자료를 종합적으로 확인할 수 있음- 국제 교역 과정에서 발생할 수 있는 동축산물 전염병 유입 위험을 차단하는 기초 자료로 활용- 정부 및 관계 기관의 정책 수립, 방역 대책 마련, 무역 협상 등 다양한 분야에서 근거 자료로 제공- 학계, 연구기관, 산업계 등에서 질병 확산 방지, 안전성 검증, 국제 기준 충족을 위한 연구 및 실무 자료로 활용 가능
