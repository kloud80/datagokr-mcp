summary_user: 경기도 사이버식물병원에 등록된 병해 진단 의뢰를 의뢰 한 건 단위로 담으며, 의뢰 제목, 발생지 주소 코드, 작물, 재배 유형·면적, 피해 부위·증상, 발생 시기, 물주기, 전문가 의견과 진단 결과를 포함한다. 농업인이나 도시농업인이 내 작물과 비슷한 증상에 어떤 진단이 내려졌는지 찾아보거나, 분석가가 작물·시기별로 자주 의뢰되는 병해를 살펴보는 데 쓴다. 포털 설명상 의뢰번호로 이미지·증상·주소·전문가의견 등 관련 테이블과 잇는다고 되어 있으나, 실측 컬럼에서는 전역 조인 키를 찾지 못해 다른 데이터와는 작물명·주소 코드 같은 이름·코드 매핑으로만 연결된다.
description_portal: 진단_의뢰 테이블은 사이버식물병원을 통해 등록된 병해 진단 요청 정보를 담고 있는 핵심 데이터입니다. 이 테이블은 사용자가 입력한 의뢰 제목(의뢰_제목)과 함께, 병해 발생지의 주소 코드(주소_코드), 진단 대상 작물의 번호(작목_번호), 재배 환경(재배_유형_코드, 도시민_농업민_코드, 재배_면적_코드 등), 발생 부위 및 증상 정보(피해_부위_코드, 피해_증상_기타_이름), 병해 발생 시기(발생_시기, 재배_시작일자), 수분 관리(수분_량_코드, 수분_횟수_코드), 전문가 진단 결과(진단_결과, 전문가_진단_내용) 등을 포함하고 있습니다.의뢰번호(진단의뢰번호)는 관련 테이블(진단_의뢰_이미지, 진단_의뢰_증상, 진단_의뢰_주소, 전문가의견, 진단결과첨부파일 등)과 연계하는 중심 키로 활용됩니다.
