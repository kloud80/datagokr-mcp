description_portal: 본 데이터는 충청남도에서 추진하는 로컬푸드 연계형 학교급식지원 사업과 관련하여, 2021년도 우수식자재 정보를 통계 추출용으로 정리한 현황 자료입니다. 주요 항목으로는 우수식자재 식품명, 식품설명, 시설명 등의 정보가 포함되어 있어, 학교급식에 사용된 우수 식자재의 종류와 특성, 공급 또는 관리 시설을 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 데이터는 연도별 우수 식자재 활용 실적 분석, 식재료 품질 관리 수준 평가, 지역 농산물 활용도 분석, 학교급식 정책 성과 분석을 위한 기초 통계자료로 활용되며, 향후 우수식자재 선정 기준 개선, 공급체계 고도화, 로컬푸드 기반 공공급식 정책 수립을 위한 참고 자료로 활용될 수 있습니다.
