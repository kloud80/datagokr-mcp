summary_user: 한국수목원정원관리원이 발간·관리하는 종자자료집의 수록 종자를 한 건씩 담은 API로, 학명·국명과 과·속 분류, 수집 국가·지역·연월일, 종자 길이·너비·천립중 같은 형태 특성, 발아율·발아온도 같은 발아 시험 결과, 이미지 주소를 제공한다. 종자 연구자나 분석가가 특정 식물 종자의 크기와 발아 조건을 확인하거나, 고유종·기후변화 취약종 여부로 종자 자원을 골라내는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식물·생물자원 데이터와는 학명·국명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 공통 식별 코드가 없어 다른 데이터셋과 자동으로 이어 붙일 수 없고, 학명·국명 표기를 맞춰 매핑해야 한다. 범위는 전국이지만 행정구역 코드나 좌표가 없는 비공간 데이터라서 지도 분석이나 지역별 집계에는 바로 쓰기 어렵다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
