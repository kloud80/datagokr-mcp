description_portal: 본 데이터는 국내외 종자 자원의 학술적 검증 자료를 표준화하고 종자 자산의 종합적인 연구 인프라를 구축할 목적으로 한국수목원정원관리원이 발간 및 관리하는 종자자료집 발간 정보를 제공하는 데이터입니다. 식물 종자의 고유 식별 번호와 함께 학명 및 국명 중심의 종 분류 체계를 수록하고 자료집 등록 번호와 발간 연도 및 종자의 형태적 특성과 수집 정보 등의 도감 및 세부 학술 데이터를 체계적으로 수록했습니다. 종자 분류 및 동정을 위한 표준 참조 자료 제공부터 생물자원 관련 학술 연구와 인공지능 기반 종자 도감 검색 인프라 구축의 기초 데이터로 활용됩니다.
