description_portal: 한국수목원정원관리원은 자생식물 종자의 생화학 검정 결과를 시각화한 TZ(Tetrazolium) 염색 이미지를 기반으로 한 공공데이터를 제공합니다.이 데이터는 백두대간 지역을 포함한 국내 각지에서 수집한 자생식물 종자의 종자활성 여부를 판별하기 위해 촬영된 TZ이미지와 함께, 과·속·종의 영문명 및 국명, 종자 평균 길이·너비, 수집일, 채집지 등 수집정보를 포함하고 있습니다. 붉게 염색된 종자는 생리적 활성을 보이며, 발아력 판별 및 생존력 평가에 활용됩니다.데이터는 CSV 형식으로 제공되며 TZ이미지와 연동됩니다.주요 항목은 도입번호, 과명, 과국명, 속명, 속국명, 도입학명, 국명, 종자 길이(mm), 너비(mm), 수집일, 채집지(국명) 등으로 구성되어 있습니다.본 데이터는 종자활성 기반 자생식물 보존, 생화학 검정 자동화, 발아력 예측 연구, 종자은행 DB 구축 등 다양한 분야에 활용할 수 있습니다.
