description_portal: '"제주특별자치도 내 노지감귤관측조사(평균열매수)정보 데이터를 제공합니다.항목: 년도, 조사월, 평균개수, 행정시별 평균개수 등* 「제주특별자치도_노지감귤관측조사(평균열매수)정보」는 제주 지역에서 생산되는 노지 감귤의 평균 열매 수(착과량)를 관측하여 제공하는 공공데이터입니다.* 8월에 실시하는 제2차 노지감귤 관측조사의 평균 열매수 (1그루당 열매 수) 통계* 제공년도 : 2007년부터 2024년까지* 데이터 제공 기관: 제주특별자치도 농업기술원자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/join/evaluation/part10/11.htm"'
