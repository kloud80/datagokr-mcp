description_portal: 어촌체험휴양마을은 「도시와 농어촌 간의 교류촉진에 관한 법률」 제 5조에 의해 지정된다. 어업체험을 중심으로 어촌의 자연환경, 생활문화 등과 연계한 관광기반시설을 조성하여 어업 외 소득(관광 등) 증대 및 어촌 활성화 도모를 위한 어촌지역의 체험휴양마을의 데이터 이다. 어촌체험휴양마을의 기본 소개 정보를 제공하며 어촌체험휴양마을별로 보유한 체험, 어촌체험휴양마을 주변 관광지의 유래를 설명하고 마을 주소, 각 마을이 소유한 홈페이지 정보 등을 제공한다. 그 외 마을 특산물 등의 정보도 제공한다.
