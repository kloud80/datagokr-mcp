summary_user: 공익직불금 중 기본형 직불금의 연도별 최종 지급 결과를 농지 면적 구간(0.1ha 최소면적부터)별 지급면적(천ha)과 지급액(억원)으로 묶은 전국 단위 집계 자료이며, 농업인과 농업법인을 모두 포함한다. 정책 분석가나 연구자가 '경작 규모가 작은 농가와 큰 농가에 직불금이 각각 얼마나 돌아가는가' 같은 면적 구간별 지급 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 면적 구간 이름을 맞추거나 같은 기관(농림축산식품부) 자료와 연도 기준으로만 이어 쓴다.
description_portal: 농림축산식품부_공익직불금 면적별 지급금액 자료(Ministry of Agriculture, Food and Rural Affairs_Public Interest Direct Payment Amount paid by area)- 연도별 기본형 직불금 지급 결과에서, 지급 면적 구간별 지급액을 조사한 자료   * 직불금 지급은 농업인 농지 요건의 검증, 준수사항 이행점검 등의 절차를 거쳐 최종 지급된 액수임- 직불금 지급을 위한 최소면적(0.1ha) 부터 조사하여, 직불금 지급 대상 농업인의 경작 면적 현황 등을 파악할 수 있음- 해당 데이터는 농업인 뿐 아니라 농업법인의 직불금 지급 현황까지 포함한 자료임
