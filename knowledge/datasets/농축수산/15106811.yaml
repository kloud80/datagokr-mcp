summary_user: 전남 보성군 관내 육상양식장을 한 곳씩 담은 건별 목록으로, 면허·허가·신고번호, 양식 품종, 양식방법, 소재지 주소, 허가일자·유효일자, 시설규모·수조면적(제곱미터)을 담는다. 수산업 종사자나 정책 담당자가 '보성군에 어떤 품종의 육상양식장이 어디에 있고 허가가 언제 만료되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 소재지 주소나 허가번호 문자열을 맞추거나 같은 기관(보성군) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 전라남도 보성군 관내 육상양식장의 현황을 정리한 자료이다. 주요 항목으로  소재지, 허가번호, 허가 기간, 대표 품종 및 주 생산 품종 등이 포함되며, 지역 내 양식업 운영 실태를 파악하는 데 활용된다. 해당 자료는 수산업 정책 수립 및 해양자원 관리에 기초자료로 활용될 수 있으며, 양식업체의 분포 및 운영 현황을 분석하는 데 도움을 준다. 또한, 수산업 종사자 및 관련 기관이 양식장 정보를 쉽게 확인할 수 있도록 제공된다. 본 데이터는 지역 내 수산업 발전과 지속 가능한 양식업 운영을 지원하며, 해양자원 보호 및 수산경제 활성화에 기여한다. 정기적으로 갱신되어 최신 정보를 반영하며, 양식업체 운영 및 수산업 정책 수립을 위한 참고자료로 활용될 수 있다.
