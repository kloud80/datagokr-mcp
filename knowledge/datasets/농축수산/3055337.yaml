summary_user: 국립농산물품질관리원이 쌀 등 정곡을 검사한 실적을 신청연도·시군·연산(생산연도)·용도·원산지별 검사수량으로 담은 전국 범위의 집계 자료이다. 유통 분석가나 지자체 담당자가 특정 시군에서 수입산 정곡 검사 물량이 연도별로 어떻게 변했는지 살펴 지역 쌀 유통 동향을 파악하는 데 쓴다. 전역 조인 키가 없어 시군 이름이나 원산지·연도 값을 맞춰 다른 쌀 가격·생산 통계와 이어 써야 한다.
description_portal: 국립농산물품질관리원에서 관리하는 쌀 등 정곡에 대한 검사 실적 정보로서, 검사 신청 연도, 시군, 연산(생산 연도), 용도, 원산지, 검사 수량 항목으로 구성되어 있습니다. 시도.시군별 정곡검사 실적 현황, 연산별 정곡검사 실적 현황, 용도별 정곡검사 실적 현황, 원산지별 정곡검사 실적 현황 등 통계자료를 작성하여 우수식품 인증에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대되며, 원산지별 검사수량 정보를 활용하여 수입 정곡 물량을 활용하여 주변 지역 정곡 유통 동향 파악하는 자료로 활용이 가능할 것으로 기대됩니다.
