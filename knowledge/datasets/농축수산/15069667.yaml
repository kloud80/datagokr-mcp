summary_user: 농업경영종합정보시스템(AMIS)의 농가경영개선지원에서 쓰는 작목 목록을 작목코드·코드유형명·공통코드명으로 담은 전국 단위의 소규모 코드표 파일(약 2.6KB CSV)이다. 농가 경영 컨설팅이나 분석가가 AMIS 자료에 나오는 작목코드가 어떤 작목을 뜻하는지 확인할 때 쓴다. 작목코드(amis_crop_cd)를 키로 다른 AMIS 농가경영 데이터와 이어 쓰며, KAMIS·도매시장 품목코드와는 체계가 달라 별도 매핑이 필요하다.
description_portal: 이 자료는 농촌진흥청에서 제공하는 **농업경영종합정보시스템(AMIS)**의 농가경영개선지원 항목 중 작목 선정 및 정보 관리에 관한 데이터를 포함하고 있습니다. 작목정보는 농가의 경영 목표에 따라 최적의 작목을 선택하고, 수익성과 안정성을 확보할 수 있도록 돕는 데 활용됩니다. 작목선정은 단순히 소득이 높은 품목을 고르는 것을 넘어, 수급상태, 시장 트렌드, 입지 조건, 농가의 가용 자원, 생산기술, 판로 확보 여부, 재배 리스크 등의 다면적 요소를 고려해야 하며, 이 자료는 그러한 의사결정을 체계적으로 지원하는 정보를 담고 있습니다. 특히 자원상태 분석, 가능한 작목 리스트 구성, 작목별 특성과 재배 조건, 경제성 분석 등의 요소를 포함하고 있어, 농업인의 경영계획 수립 및 컨설팅, 지역단위 품목 개발 등 다양한 분야에 활용될 수 있습니다. 농가의 수익 극대화와 경영 안정화를 위한 기초자료로 매우 중요한 역할을 합니다.
