description_portal: 농림축산식품부에서는 유기농업자재 지원사업 현황정보를 제공합니다.본 정보 제공 데이터는 년도, 시도명, 시군구명, 농가수, 품목명, 면적, 물량등의 정보를 포함하고 있습니다.본 제공자료는 유기농업자재 지원사업에 대한 정보를 보여주는 데이터 입니다.2017도의 사업년도에 대한 데이터를 포함하고 있습니다.유기농업자재 지원 지역구분으로는 광역시도, 시군구 단위까지 지역정보를 제공하고 있으며, 그에 따른 농가수와 품목, 면적정보, 물량정보를 제공하고 있습니다.품목에는 호밀, 녹비(청)보리, 헤어리베치가 있으며 면적 정보는 소수점 첫 번째 자리까지 표기하였습니다.
