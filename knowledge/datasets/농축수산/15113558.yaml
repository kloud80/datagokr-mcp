summary_user: 국립자연휴양림별로 시설 이용이 막힌 기간(시작일·종료일)과 그 기간의 위약금 면제 여부, 사유를 적은 일정 제목·내용을 건별로 담은 전국 범위 CSV 파일(약 19KB)이다. 예약자나 이용 안내 담당자가 '내가 예약한 휴양림이 이 날짜에 공사·재해 등으로 문을 닫는지, 취소하면 위약금이 면제되는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 휴양림 데이터와는 휴양림명이나 같은 기관의 휴양림아이디를 맞춰서만 이어 쓴다.
