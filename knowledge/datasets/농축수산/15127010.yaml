description_portal: 이 데이터는 해양수산부에서 해양공간계획 및 관리에 관한 법률에 따라 해역의 특성과 이용‧개발을 위한 용도구역 지정 시 필요한 해양공간관리계획도격자 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 격자의 공간정보 일련번호, 격자 분류명, 격자의 명칭 및 좌표를 포함하는 공간정보로 구성되어 있습니다.  본 데이터는 해역 관리계획 수립, 해양 이용 및 개발사업 평가, 해양환경 보전정책 설계, 해양공간의 효율적 관리제도 마련을 위한 연구 등 공공 정책수립 및 행정 업무에 활용될 수 있습니다.
