summary_user: 해양공간관리계획도에 쓰이는 격자를 한 행씩 담은 공간정보 파일로, 격자별 일련번호·분류명·명칭과 좌표(공간정보)를 담으며 범위는 전국 해역이다. 해상풍력 등 해양 이용·개발사업을 검토하는 사업자나 분석가가 "이 해역이 계획도의 어느 격자에 속하는가"를 확인하고 해양용도구역 입지 검토의 위치 기준으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 격자명 같은 이름 매핑이나 공간정보 좌표를 이용한 공간 중첩으로만 이어 쓴다.
limits: 전역 조인 키가 없어 행정구역 코드나 다른 해양 데이터와 키로 바로 결합할 수 없고, 이름 매핑이나 같은 기관 코드로만 연결된다. 행정단위가 비공간 전국 단위로 분류돼 있어 시군구별 집계에는 맞지 않는다.
