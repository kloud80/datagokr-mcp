description_portal: 이 데이터는 해양수산부에서 일본 어선의 한국 EEZ(배타적 경제수역) 내 어업 활동과 관련된 협정사항 상세정보 제공을 목적으로 수집된 데이터입니다.본 데이터의 주요 내용은 기준년도, 어업종류코드, EEZ어종코드, 협정일련번호, 업종의 한글·영문·한자 명칭, 어종의 한글·영문·한자 명칭, 어종코드, 합의된 척수, 어종별 할당량, 확정여부, 확정일자, 최초 생성시점, 최종 변경시점, 데이터 기준일자 등으로 구성되어 있습니다.  본 데이터는 국제 어업 협정 체결 및 이행 현황 관리, 한일 EEZ 내 자원 배분 현황 분석, 어업 관련 정책 수립, 어종별·연도별 어획량 및 배분 실적의 추적 등에 활용될 수 있습니다.
