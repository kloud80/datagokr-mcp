summary_user: 국립수산물품질관리원이 제공하는 전염병 발생현황 통계로, 필드명으로 보아 지역(PBADMS_RGN_NM)·질병명·품종명·연월별 발생 건수를 담는 전국 범위의 집계 자료다. 양식업자나 수산 분석가가 '어느 품종에서 어떤 질병이 어느 지역에서 언제 많이 발생했나'를 확인하는 데 쓴다. 전역 조인 키는 없어 지역명·품종명·연월을 이름으로 맞춰 위판장 경락가격 같은 수산물 유통 데이터와 이어 쓰며, 어종코드는 수협·수산과학원·HS 체계가 서로 달라 별도 매핑이 필요하다.
