summary_user: 도축 뒤 이루어진 한우 등급판정 결과를 개체별로 담은 데이터로, 농가ID·개체번호·도축장·도축일자와 함께 육량등급·육질등급·최종등급, 도체중량·등지방두께·등심면적·근내지방, 경락가격 등을 기록하며 범위는 전국이다. 축산 연구자나 한우 농가가 '도체중량과 근내지방이 육질등급·경락가격과 어떤 관계인가'처럼 품질 개선과 생산 관리를 분석할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 개체번호·농가ID 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: '한우의 등급판정정보는 도축 이후에 이루어진 등급판정 결과를 제공합니다. 이 정보에는 육량등급, 육질등급, 도체중량, 등지방두께와 같은 핵심 개념이 포함되어 있습니다. 또한, EPD(Estimated Progeny Difference) 정보를 활용하여 다양한 상관관계를 분석하는 데 필수적인 빅데이터로 활용될 수 있습니다. 이 데이터는 한우의 품질 개선 및 생산성 향상을 위한 연구나 정책 수립에 중요한 기초 자료로 활용될 수 있습니다. 한우를 생산하는 농가의 생산 관리를 위해 필요한 다양한 지표를 제공하며, 축산업의 경쟁력을 강화하기 위한 기반이 됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. "농가ID"(숫자형) : 한우를 재배하는 농가의 고유 아이디, "개체번호"(숫자형) : 개체별 식별번호, "출하일자"(날짜형) : 축산물의 출하일, "도축장"(문자형) : 해당 도축이 이루어진 장소, "도축일자"(날짜형) : 도축이 이루어진 날짜, "육량등급"(문자형) : 육량의 등급, "육질등급"(문자형) : 육질의 등급, "도체중량"(숫자형) : 도체의 무게, "등지방두께"(숫자형) : 등 부분의 지방 두께, "경락가격"(숫자형) : 경락 동안의 가격, "등급판정일자"(날짜형) : 최종 등급 판정이 이루어진 일자, "육량지수"(숫자형) : 육량을 수치로 나타낸 지수, "등심면적"(숫자형) : 등심의 면적, "등급보정"(숫자형) : 최종 등급에 대한 보정 값, "근내지방"(숫자형) : 근육 내 지방량, "육색"(문자형) : 육색의 질을 나타내며, "지방색"(문자형) : 지방의 색상을 식별합니다. 이러한 데이터는 축산업계의 효율적이고 과학적인 의사결정에 기여할 수 있습니다.'
