summary_user: 부산광역시 해운대구 관할 양식장·마을어업 어장을 어장(면허) 한 건씩 담은 파일로, 어업의 종류, 면허번호, 면적(ha), 양식물, 어장위치(송정동·중2동 지선 등), 양식업권자 기관명·주소·연락처를 포함한다. 해운대구 연안에서 미역·다시마 양식이나 마을어업 어장이 어디에 얼마나 면허되어 있고 권리자가 어느 수협·어촌계인지 확인하려는 어업인·사업자·연안 이용 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 면허번호나 어촌계·수협 이름, 어장위치 지명을 맞춰 연결해야 한다.
description_portal: 부산광역시 해운대구 양식장 현황에 대한 현황자료며, 어업의 종류, 면적(ha), 양식물, 어장위치, 주소 등의 정보를 제공합니다. 부산광역시 해운대구 양식장의 어업의 종류에는 해조류양식, 복합양식, 마을어업 등이 있으며 어장이 위치한 곳은 해운대구 송정동 지선, 중2동 지선 등입니다. 해조류양식의 면적은 총 50ha이며, 복합양식의 면적은 총 34.8ha이며, 마을어업의 면적은 총 172.2384ha입니다. 해조류양식, 복합양식의 경우 미역, 다시마 등을 양식하며, 마을어업의 경우 패류, 해조류, 성게 등을 양식합니다. 양식업권자는 부산시수협, 청사어촌계, 송정어촌계 등이 있습니다.
