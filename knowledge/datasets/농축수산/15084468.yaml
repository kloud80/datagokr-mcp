description_portal: 경기도 고양시 내 설치된 반려견 놀이터의 현황 데이터 입니다.  놀이터  시설명, 도로명주소, 지번주소, 위도, 경도, 관리기관, 전화번호 등의 항목을 제공합니다. 본 데이터는 반려견이 안전하게 이용할 수 있는 고양시 내 반려견 놀이터의 설치현황을 정리한 자료로 이를 통해 지역별 반려동물 친화 시설의 분포 특성을 파악할 수 있으며 주거밀집지역과의 접근성, 시설규모, 이용편의 수준 등을 종합적으로 분석하는데 활용 가능합니다. 또한 반려동물 정책 수립 및 시설 확충 계획, 생활SOC 연계 전략 등을 지원하는 기초자료로 반려동물과 시민이 함께 이용할 수 있는 안전한 도시환경조성에 기여하는 데이터입니다.
