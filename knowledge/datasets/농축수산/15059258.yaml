summary_user: 경기도 31개 시군의 보조사료 제조업체를 사업장 한 곳당 한 행으로 담은 인허가 현황이다. 업체명, 인허가·폐업일자, 영업상태, 도로명·지번 주소와 위경도, 면적, 종업원 수가 들어 있다. 축산 농가나 사료업계 분석가가 우리 시군에 영업 중인 보조사료 제조업체가 어디에 몇 곳 있는지 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 같은 경기도 단미사료·수입사료 업체 현황, 행정구역 데이터와 이름 매핑해 잇는다.
description_portal: 이 데이터는 경기도 내 보조사료 제조업체의 인허가 현황을 제공합니다. 보조사료란 사료의 품질 저하를 방지하거나 효용을 높이기 위해 첨가하는 성분을 제조·판매·공급하는 제품을 말합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘우편번호’, ‘WGS84 위도·경도’, ‘소재지면적’, ‘총종업원수’, ‘축산물가공업구분명’, ‘축산업무구분명’ 등이 포함됩니다. 이를 통해 보조사료 제조업체의 위치, 운영 상태, 규모 및 종업원 현황을 파악할 수 있습니다. 해당 데이터는 경기도 31개 시군 단위로 제공되며, 축산업의 효율적 운영, 가축 건강 증진, 사료산업 정책 수립, 지역별 보조사료 생산 및 유통 관리 등에 활용될 수 있습니다. 또한 수입사료, 단미사료 등 관련 데이터와 비교·분석하여 국내 사료산업의 구조와 특징을 종합적으로 이해하는 데 도움이 됩니다.
