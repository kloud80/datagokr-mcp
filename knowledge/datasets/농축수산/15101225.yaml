summary_user: '국립농산물품질관리원이 관리하는 친환경 인증 농산물을 인증 건별로 담은 전국 단위 비공간 목록으로, 인증번호·인증종류·인증농가·품목·재배면적(사육두수)·생산계획량·인증 시작일과 종료일·원재료 인증구분을 담는다. 유통업자나 식자재 구매 담당자가 특정 품목(예: 유기농 쌀)을 지금 친환경 인증을 유지한 농가가 어디인지, 계획 생산량은 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어 KAMIS 가격 등 다른 데이터와는 품목명을 이름으로 맞추거나 같은 기관 코드로만 연결하며, 품목코드는 체계마다 달라 별도 매핑이 필요하다.'
description_portal: 친환경농축산물이란 생물의 다양성을 증진하고, 토양에서의 생물적 순환과 활동을 촉진하며, 농업생태계를 건강하게 보전하기 위하여 합성농약, 화학비료, 항생제 및 항균제 등 화학자재를 사용하지 아니하거나 사용을 최소화한 건강한 환경에서 생산한 농축산물이며, 친환경농축산물 인증제도는 정부가 지정한 전문 인증기관이 농축산물의 생산 전 과정이 친환경 인증기준에 적합한 지를 심사하여 인증서를 교부하고 친환경농축산물로 인증한 제품에만 인증표시를 할 수 있도록 허용하는 제도로 본 정보는 국립농산물품질관리원에서 관리하는 친환경 인증 획득 농산물에 대한 품목별 인증 현황으로서, 인증번호, 인증종류명, 인증농가, 인증품목명, 재배면적, 생산계획량, 인증기간(시작일), 인증기간(종료일), 원재료인증구분 항목으로 구성된 데이터입니다.
