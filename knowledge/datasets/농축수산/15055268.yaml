description_portal: '경기도 고양시 쌈지공원 현황에 대한 데이터입니다. 연번, 쌈지공원 사업명, 조성년도, 소재지, 면적의 항목을 제공합니다.1. 연번 : 목록의 순서를 나타내는 번호2. 사업명 : 사업의 공식 이름3. 조성년도 : 조성이 완료된 연도4. 소재지 : 사업 시행 위치(지번주소)5. 면적 : 공간의 크기(㎡)도심 내 유휴지, 자투리땅을 활용해 조성한 소규모 녹지공간 정보를 제공합니다.쌈지공원(Pocket Park)의 이름, 위치, 조성년도, 면적 등 주요 정보를 포함합니다.시민의 휴식 공간 확충, 도시 녹지 네트워크 구축, 미관 개선 등 다양한 목적으로 활용됩니다.각 공원의 위치, 조성 내역 및 관리 이력 파악에 유용합니다.정책 수립, 도시환경 개선, 공간 활용 연구 등에 활용할 수 있습니다.'
