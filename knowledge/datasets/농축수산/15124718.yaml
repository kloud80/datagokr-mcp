summary_user: 전국 산림유전자원보호구역의 지정현황을 원시림·고산식물지대·진귀한 임상·희귀식물 자생지·유용식물 자생지·산림습지 및 계곡·자연생태계보전지역 같은 유형별 열로 정리한 전국 단위 집계표로, 184바이트짜리 작은 CSV 파일입니다. 산림 보전 정책이나 생물다양성 연구를 하는 분석가가 보호구역이 어떤 유형에 얼마나 몰려 있는지 전국 구성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 유형 이름을 맞추거나 산림청의 다른 산지 구분·산림보호구역 자료와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
