description_portal: '동물보호법에 따른 동물전시업 등록 현황- 제공 정보 : 지역별 동물전시업 업체 현황, 전체 업체 수 대비 지역별 비율, 관련 종사자수- 동물전시업 :반려동물을 보여주거나 접촉하게 할 목적으로 영업자 소유의 동물을 5마리 이상 전시하는 영업. 다만, 「동물원 및 수족관의 관리에 관한 법률」 제2조제1호에 따른 동물원은 제외(동물보호법 시행규칙 제43조)- 구분 지역 : 서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주- 등록영업 기준 : 동물보호법 제73조제3항에 따른 등록영업의 시설 및 인력기준 별표 11- 등록방법 : 영업등록신청서에 인력현황, 영업장의 시설 명세 및 배치도, 사업계획서 등을 첨부하여 관할 지자체에 제출 및 등록하여야 함'
