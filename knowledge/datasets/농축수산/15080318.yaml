description_portal: 관악, 제주, 고양, 기장, 평창, 횡성 등 전국 주요 지역에 설치된 청정넷(대기질 측정망) 관측소 주변의 녹지 및 그린인프라 현황을 조사한 데이터입니다. 이 데이터는 산림과학원이 수행한 현장조사 결과를 기반으로 하며, **관측소 주변의 임목정보(수종, 수령, 수고 등)**와 측정망의 위치 정보 및 구조를 포함하고 있습니다. 이를 통해 해당 지역의 도시숲, 가로수, 생활권 녹지 등 그린인프라 요소가 대기환경에 미치는 영향을 분석할 수 있으며, 도시 대기질 개선, 미세먼지 저감, 탄소흡수 기능 분석, 녹색도시 정책 수립 등에 활용됩니다.
