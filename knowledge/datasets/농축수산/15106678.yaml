description_portal: 이 데이터는 전라남도 신안군 내수면 양식업 현황을 정리한 자료로, 지역 내 양식 시설의 분포와 규모를 파악하기 위한 공공데이터입니다. 주요 항목으로는 ‘연번’, ‘어업명칭’, ‘시설위치’, ‘수조면적’, ‘시설규모’, ‘시설종류’, ‘수산물품목’ 등이 포함되어 있습니다. 각 레코드는 개별 양식장의 정보를 나타내며, 어업명칭은 사업체명이나 어업 형태를, 시설위치는 양식장이 위치한 행정구역이나 주소를 의미합니다. 수조면적과 시설규모는 양식장의 물리적 규모를 수치로 표현하고, 시설종류는 수조식·가두리식 등 양식 형태를 구분합니다. 수산물품목은 해당 시설에서 양식하는 주요 어종이나 수산물을 나타내며, 데이터기준일자는 정보의 최신화 기준을 명시합니다. 본 데이터는 지역 수산업 현황 파악, 정책 수립, 연구 분석 및 행정 지원에 활용될 수 있는 기초자료입니다.
