summary_user: 한국마사회가 관리하는 마필 혈통서의 기본 내역을 말 한 마리 단위로 담으며, 마번·마명·영문마명·털색·생산국가·성별·출생연도와 혈통서 구분·종류를 제공하고 범위는 전국·비공간이다. 말 생산자·마주·경마 분석가가 특정 말의 출생연도, 생산국, 성별, 혈통서 등록 구분을 확인하거나 출생연도별 마필 목록을 뽑는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 한국마사회의 다른 경주·마필 데이터와는 마번(hrno)이나 마명 같은 기관 내부 식별자로만 이어 쓴다.
description_portal: 한국마사회의 말산업 관련 마필의 혈통서 내역 정보를 제공합니다. (제공정보는 마번(hrno), 마명(hrnm), 영문마명(engHrnm), 혈통서구분명(stdbkGbCd), 혈통서인덱스구분명(stdbkIdxGbCd), 말털색(horseCtcolNm), 생산국가명(pctyCd), 성별구분명(gndrGbCd), 혈통서종류구분코드명(stdbkKndGbCd), 출생연도(foalgYy) 자료입니다.)- 요청메세지에 마필출생연도(foalg_yy), 마번(hrno), 마명(hrnm), 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다.
