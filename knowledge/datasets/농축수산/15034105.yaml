description_portal: '- 한국농어촌공사 가뭄지도 정보를 제공합니다.- 가뭄지도란 특정 지역에서의 가뭄 발생 상황을 시각적으로 나타낸 지도로,- 가뭄의 발생 기간, 대책기간, 피해 지역의 현황 및 급수면적, 저수율 등을 포함하여 가뭄의 영향을 파악하고 대책을 수립하는데 사용되고 있습니다.- 본 데이터는 연말(12월 31일) 기준으로 가뭄위기 경보수준 단계별 저수율 기준 정보를 제공하며- 167개 시군에 대한 한국농어촌공사 관리 저수지 시설개수, 유역면적, 수혜면적, 유효저수량, 저수율, 평년저수율, 평년대비, 가뭄상황 단계를 제공합니다.- 본 개방 데이터를 통해 기상, 수리시설 유무 등 다양한 원인에 의해 발생하는 농업가뭄에 대한 과학적 원인 분석을 할 수 있으며,- 지역별 가뭄정보 분석하고 전략을 마련하는데 활용될 수 있습니다.'
