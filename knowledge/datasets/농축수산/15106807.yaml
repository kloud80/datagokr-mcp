summary_user: 전남 장흥군 관내 육상양식장을 양식장 한 곳당 한 행으로 담은 파일로, 허가자 성명·인허가번호·양식 품목·수조면적과 시설규모(제곱미터)·지번주소를 기록한다. 장흥군에서 어떤 품목을 어디서 얼마만 한 수조 규모로 육상양식하는지 파악하려는 어업인·사업자·지역 수산 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 인허가번호나 지번주소를 이름·주소 매핑으로 맞추거나 같은 기관(장흥군) 자료끼리만 이어 쓴다.
description_portal: 전라남도 장흥군 관내에 위치한 육상양식장 현황으로 구체적으로는 각 양식장을 식별하기 위한 고유 연번과 해당 양식장의 허가자 성명이 포함됩니다. 공식적인 운영 승인을 나타내는 인허가 번호와 함께, 해당 시설에서 주력으로 양식하고 있는 수산물 품목의 종류를 명시하고 있습니다. 또한, 양식 활동이 이루어지는 공간인 수조면적 (제곱미터 등 단위)과 시설의 전반적인 규모에 대한 데이터가 수록되어 있으며, 최종적으로 해당 양식장이 실제로 위치한 구체적인 장소(위치) 정보까지 포함하여 양식업 현황을 체계적으로 파악하고 관리하는 데 필요한 기초 자료로 활용됩니다.
