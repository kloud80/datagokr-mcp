description_portal: 본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘농식품 뉴스 동향’에 대한 상세 정보이다. 영농 관련 뉴스, 세미나 정보, 영농 농정, 농정 연구 속보농식품 주간 동향 등의 항목으로 구성되어 있다. 해당 데이터는 농식품 분야의 최신 동향과 정책 정보를 제공하여, 농업인, 연구자, 정책입안자 등 다양한 이용자가 농업 경영 및 정책 수립에 활용할 수 있다. 특히, 국내외 농식품 관련 이슈를 신속하게 파악하고 대응할 수 있도록 지원한다. 데이터는 CSV 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 활용이 가능하다.
