summary_user: 농림축산식품부가 2025년 현재 수행 중인 연구개발과제를 과제 한 건씩 담은 전국 단위 목록 파일로, 선정연도·사업구분·과제명·주관연구기관·책임자·시작일·종료일·2025년 정부출연금(백만원)을 담는다. 연구자나 기업이 '내 분야와 비슷한 농식품 R&D 과제를 어느 기관이 수행하며 올해 정부출연금이 얼마인가'를 확인하거나, 정책 분석가가 사업구분별 과제 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주관연구기관명이나 과제명 같은 이름을 매핑해서만 연결할 수 있다.
description_portal: 해당 데이터는 2025년 현재 수행 중인 농림축산식품부 연구개발과제의 전반적인 현황을 담고 있으며, 연구개발과제명, 주관연구기관 등의 항목을 포함하고 있습니다. 이를 통해 농림축산식품부가 중점적으로 추진하는 연구개발 분야와 과제별 목표를 확인할 수 있으며, 각 과제를 수행하는 연구기관의 역할과 전문성을 파악할 수 있습니다. 또한 해당 데이터는 연구개발 자원의 효율적 배분과 정책적 우선순위 설정에 중요한 기초 자료로 활용될 수 있으며, 연구자들에게는 동종·유사 연구를 파악하거나 협력 기회를 모색하는 참고자료가 됩니다. 나아가 학계, 산업계, 정책 담당자는 이 데이터를 기반으로 농림축산식품 분야의 연구개발 방향을 분석하고, 성과 확산 및 기술 상용화 전략을 마련할 수 있습니다. 결과적으로 본 데이터는 농림축산식품부 연구개발 정책의 투명성과 신뢰성을 높이고, 연구 생태계 전반의 활성화와 혁신적 성과 창출에 기여할 수 있는 중요한 기반 자료입니다.
