summary_user: 한국농어촌공사가 관리하는 전국 저수지의 일별 관측값을 저수지 코드와 측정일자 단위로 담는다. 수위, 저수량(PONDAGE), 저수율, 유입량, 공급량, 방류량(수문·여수로·기타 등)이 함께 들어 있다. 농업인이나 지자체 담당자가 가뭄철에 '우리 지역 저수지 저수율이 지금 몇 %이고 최근 며칠 사이 얼마나 줄었나'를 확인하는 데 쓰며, 실측 컬럼에는 전역 조인 키가 없어 저수지 코드(RSRVR_CD)를 같은 기관의 저수지 목록·제원 자료와 코드나 이름으로 맞춰 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국농어촌공사에서 제공하는 일 저수지수위에 대한 관련 정보입니다.\""
