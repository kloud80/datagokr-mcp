description_portal: 대형산불위험예보 목록 정보란 대형산불 위험예보는 30ha의 소나무 숲을 대상으로 숲의 건조상태를 나태내는 실효습도와 풍속 등 기상여건을 분석해 대형산불 발생할 가능성이 높은 지역을 조기에 알려주는 시스템임. 2017년부터 시도, 시군구, 읍면동 매시간 기준 당시 풍속 및 실효습도 정보와 함께 대형산불위험예보 정보를 제공하고 있음. 대형산불위험예보는 주의보와 경보로 구분되며, 해당 읍면동의 산불위험지수가 51 이상일 경우, ‘대형산불주의보’는 실효습도 30~45% 이하가 2일이상- 풍속 7~11m/s 미만일 때 발령하고, 대형산불 경보는 실효습도 30% 미만이 2일이상- 풍속 11m/s 이상일 때 발령을 함.
