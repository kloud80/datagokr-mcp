description_portal: 이 데이터는 해양수산부에서 어장정보(2019)에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 최소와이좌표, 최대와이좌표, 시군구명, 시도명, 해양조사관련부서명, 개정년도, 어업면허명, 어업유형명, 어업방법명, 양식유형명, 위치설명, 어장면적, 어장면허시작일자, 어장면허종료일자, 위도, 어장경도, 공간정보 데이터로 구성되어 있습니다.본 데이터는 어장정보(2019) 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어장정보란 어업과 관련하여 물고기를 잡는 어장(漁場)의 현황과 관련된 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
