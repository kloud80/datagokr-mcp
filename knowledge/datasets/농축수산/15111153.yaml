description_portal: '대구광역시 서구 동별 동물등록 현황에 대한 항목을 제공합니다.등록주체별, 등록방식별, 동별 현황, 등록 품종수, 동물소유자수, 동물소유자당 등록동물수 및 합계[용어설명]동물등록제: 등록대상동물의 소유자는 동물의 보호 및 유기. 유실 방지 등을 위하여 동물등록을 하여야 하며, 등록하지 않을 경우 과태료가 부과됩니다.* 등록대상동물: 주택, 준주택에서 기르거나 그외의 장소에서 반려 목적으로 기르는 월령 2개월 이상인 개* 등록대상동물을 등록하지 않을 시 최대 60만원 이하의 과태료가 부과됩니다.[동물등록방법] 1. 내장형 무선식별장치 개체 삽입 2. 외장형 무선식별장치 부착그 외 자세한 사항을 참고하고 싶을 시 대구 서구청 홈페이지 https://www.dgs.go.kr/portal/contents.do?mid=0410020000를 참고하시면 됩니다.'
