summary_user: 환경부가 만든 녹지(녹피) 면적비율 정보를 재난안전데이터 공유플랫폼에서 받는 데이터로, 조사연도·행정구역별로 녹지 면적과 비율, 행정구역 면적, 인구 등의 항목을 담으며 범위는 전국이고 공간 좌표는 없다. 지자체 담당자나 도시·환경 분석가가 '우리 시군구의 녹지 비율은 다른 지역보다 낮은가, 인구 대비 녹지는 충분한가'를 비교하는 데 쓴다. 행정구역 코드(ADMDST_CD)와 행정구역명이 있지만 실측에서는 전역 조인 키로 확인되지 않아, 다른 데이터와는 행정구역 코드나 이름을 맞추는 매핑으로 이어 쓴다.
