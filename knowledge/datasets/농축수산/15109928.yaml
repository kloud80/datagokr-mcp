description_portal: 남본 데이터는 경상남도 남해군 내에서 특색 있는 농촌체험 및 어촌체험 프로그램을 경험할 수 있는 농어촌체험휴양마을의 종합적인 현황 정보를 제공합니다. 이는 방문객에게는 도시를 벗어나 특별한 휴식과 함께 지역 고유의 문화를 체험할 수 있는 기회를, 지역사회에는 새로운 발전 동력과 활력을 제공함을 목표로 합니다. 각 마을별 공식 '휴양마을명', 방문객이 쉽게 찾아갈 수 있도록 상세 '주소'와 지리적 좌표 등을 포함한 '휴양마을의 위치 정보', 그리고 마을에서 제공하는 대표적인 체험 프로그램의 종류, 예약 문의를 위한 연락처, 운영 시기 등 방문객의 선택과 여행 계획 수립에 실질적인 도움을 주는 핵심 정보를 담고 있습니다.
