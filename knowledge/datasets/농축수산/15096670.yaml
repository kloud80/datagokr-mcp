summary_user: 제주특별자치도 내 친환경 인증 농축산물의 출하 실적을 기준 연도·시군구·농축산물 구분·인증기관별로 집계한 통계로, 출하 건수·농가 수·면적(헥타르)·출하량(톤)을 담는다. 정책 담당자나 연구자가 '제주에서 친환경 인증 농축산물 출하량과 참여 농가 수가 연도별·시군구별로 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 기준 연도와 시군구 이름 또는 품목 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도가 2011년부터 2019년까지 집계·공개한 ‘친환경 농축산물 출하 현황’ 통계로, 제주도 내 친환경 인증을 받은 농축산물의 품목별 출하 건수, 출하량을 연도 및 지역(시군구) 단위로 체계적으로 정리한 공공데이터이다.  이 자료는 유기농·무농약·친환경 축산물 등의 실제 출하 실적을 기반으로, 친환경 농업의 보급 현황과 시장 공급 규모를 객관적으로 파악할 수 있는 기초 통계 역할을 한다. 따라서 농업 정책 수립, 친환경 인증 확대 계획, 공급망 및 유통구조 분석, 지역 농업의 지속가능성 평가, 소비자 안전·환경 보전 정책, 농가 지원 및 보조 정책 설계, 친환경 농축산물 수급 예측, 농업과 환경의 공존 전략 마련 등 다양한 행정, 연구, 기획 목적에 활용 가능하다.
