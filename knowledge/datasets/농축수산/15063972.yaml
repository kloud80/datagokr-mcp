summary_user: 한국마사회 서울·제주·부산경남·영천 경마장에서 시행한 경주에 대해 경주일자·판매경마장·발매소·발매형태별 발매건수, 발매금액, 환급금액, 환불건수, 환불금액을 담는다. 경마 매출 추이를 보는 분석가가 '특정 월에 경마장·발매소별 마권 매출과 환급액은 얼마였나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 경주일자, 경마장 이름·발매소명 매핑 또는 같은 기관의 경주 데이터 기준으로만 이어 쓴다.
limits: 전역 조인 키가 없어 외부 데이터와 직접 결합하기 어렵다. 지역 단위는 전국·비공간이라 지도·행정구역 분석에는 바로 쓰기 어렵다. 부문은 농산물 유통 가격으로 분류돼 있으나 내용은 경마 발매 실적이며, 농산물 가격이나 KAMIS 품목코드와는 관계가 없다.
