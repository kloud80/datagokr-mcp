summary_user: 한국농어촌공사가 농지를 전용해 설치한 태양광 발전시설 현황을 시도·시군구·읍면동과 기준년도별로 묶어 필지면적, 태양광 패널 설치 면적, 설치 비율을 담은 전국 단위 집계 파일이다(포털 설명상 2014~2024년). 정책 분석가나 지자체 담당자가 "우리 지역 농지에서 태양광 패널 면적이 해마다 얼마나 늘었고 다른 지역과 비교해 비율이 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키(행정구역 코드·PNU 등)가 없어 다른 농지·행정 데이터와는 시도·시군구·읍면동 이름을 매핑해 이어 붙여야 한다.
limits: 행정구역 이름만 있고 코드나 필지 식별자(PNU)가 없어 필지 단위 조회나 코드 기반 조인이 되지 않으며, 이름 매핑 시 행정구역 변경에 주의해야 한다. 행정단위로 묶은 집계라 개별 발전시설·필지의 위치나 허가 내역은 알 수 없다.
