description_portal: '제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍나리(제주시) 데이터를 제공합니다.항목: 일반정보(피해요인), 일반정보(피해대상), 도로명/지번 주소, 행정동코드, 위도, 경도 등* 2007년 태풍 나리(Typhoon Nari)로 인해 발생한 자연재해 피해 정보를 제주시 행정동 단위로 세밀하게 기록한 자료입니다. 피해 유형은 대·중·소분류 체계로 구분되어 있으며, 피해 구분, 요인, 대상 품종 등의 세부 항목을 포함합니다. 또한, 도로명주소, 지번주소, 행정동 코드, 위도·경도 등의 공간 정보를 포함하고 있어 GIS 기반의 시각화와 공간 분석에 이상적입니다.* 활용 분야 : GIS 기반 공간 시각화 및 분석재난 대응 및 자원 배치 기획, 정책 및 인프라 개선 자료 등"'
