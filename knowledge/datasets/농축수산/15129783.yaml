summary_user: 해양공간계획 특성평가격자 단위로 어선과 일반 선박이 같은 해역에 함께 있었던 분포를 수신일자·격자아이디별 선박수·어선수·합계로 담은 전국 집계 파일(CSV 약 34MB)이다. 해양공간계획 담당자나 해상풍력 입지 분석가가 "어떤 격자에서 어업 활동과 선박 항해가 많이 겹쳐 충돌 위험이나 이용 갈등이 큰가"를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 격자아이디를 같은 해양공간계획 특성평가격자 체계를 쓰는 다른 격자 데이터와 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부가 어선과 일반 선박이 같은 해양공간에서 동시에 활동하는 중첩지역을 파악하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해양공간계획특성평가격자를 기준으로, 특정 지역에서 어업 활동 중인 어선과 항해 중인 선박이 동시에 존재하는 통계 분포로 구성되어 있습니다. 격자ID별 선박수, 어선수 데이터를 포함하고 있습니다.  본 데이터는 해양공간 이용계획 수립, 선박 운항 안전대책 마련, 어업 권익 보호와 관련한 정책 검토 등에 활용될 수 있습니다. 또한 관련 기관이 해양공간 내 선박 충돌 위험도 분석이나 사고 예방 대책 마련, 어선분포 연구자료 마련을 위한 기초자료로 사용할 수 있습니다.
