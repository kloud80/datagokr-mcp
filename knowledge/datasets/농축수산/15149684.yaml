description_portal: 축산물품질평가원에서 제공하고 있는  소(한우, 육우)의 부위별  경락두수와 평균가격을 조회할수 있습니다. 이 정보는 축산유통조사 정보를 취합하여 제공하고 있습니다. 육질등급은 7개로 선택하여 정보를 확인 할 수 있고,  도매시장은 전국을 포함하여 18개 도매시장 정보의 가격을 조회할수 있습니다. 이용자의 활용목적에 따라 데이터를 추출하여 가격정보를 확인할 수 있습니다.  부위는 잡뼈를 포함한 16개 부위정보의 가격 데이터를 확인 할 수 있어 부위별  월별 가격추이를 알 수 있습니다. 이 데이터는 소의 데이터 변화정보를 확인하여 수급정책에 활용 될 수있습니다.
