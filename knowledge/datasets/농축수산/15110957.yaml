summary_user: 전국 공사유림에서 지방자치단체가 수행한 조림 사업을 필지 단위 건별로 담은 파일(CSV, 약 21MB)로, 사업번호·사업기간·발주기관·업체, 조림 장소(지번), 수종·묘령·조림면적·본수·활착본수, 산림기능 구분을 포함하며 포털 설명상 2015~2020년 사업을 다룬다. 산림 분야 분석가나 지자체 담당자가 '어느 시군구에서 어떤 수종을 얼마나 심었고 활착률은 어떤가'를 확인하거나 수종별·지역별 조림 실적과 탄소 흡수원 조성 현황을 살피는 데 쓴다. 시도·시군구·읍면동 코드와 산구분·본번·부번(필지 고유번호 항목 포함)이 있어 행정구역·지적 자료와 이름·코드 매핑으로 맞춰 볼 수 있지만, 실측상 전역 조인 키는 확인되지 않았다.
description_portal: 전국 공사유림에서 지방자치단체가 수행한 산림경영활동 중 조림 사업에 관한 정보를 2015년부터 2020년까지 연도별로 체계적으로 정리한 데이터입니다. 사업번호, 사업년도, 사업기간, 사업명, 발주기관, 업체명, 조림장소, 조림수종, 묘령, 본수, 산림기능구분 등 다양한 항목을 포함합니다. 조림사업의 추진 현황, 수종별 식재 현황, 지역별 조림 면적 및 성과 분석 등에 활용할 수 있으며, 산림자원 관리, 정책 수립, 연구 및 행정 업무 지원에 유용합니다. 데이터는 정기적으로 갱신되어 최신 조림사업 동향 파악에 적합합니다.
