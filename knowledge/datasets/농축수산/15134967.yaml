description_portal: 본 데이터는 충청남도에서 추진하는 로컬푸드 연계형 학교급식지원 사업과 관련하여, 로컬푸드를 공급받는 학교급식 수요기관 현황 및 참여 업체 정보 등을 체계적으로 관리·제공하는 자료입니다. 로컬푸드 연계 학교급식 수요 규모, 수요기관의 유형, 참여 공급업체 현황 등을 종합적으로 파악할 수 있도록 구성되어 있으며, 이를 통해 지역 농산물의 안정적인 판로 확보와 학교급식 식재료의 안정적 공급 체계 구축을 지원합니다. 또한 본 데이터는 로컬푸드 소비 촉진, 학교급식 품질 향상, 지역 농가와 수요기관 간 연계 강화, 공공급식 정책 수립 및 운영 성과 분석을 위한 기초 자료로 활용됩니다.
