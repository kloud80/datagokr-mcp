description_portal: 이 데이터는 해양수산부에서 바닷가원격모니터링기본에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 바닷가관리번호1, 바닷가관리번호2, 바닷가면적, 바닷가시군구명, 바닷가상황내용, 바닷가원격모니터링형성내용, 바닷가항만구역명, 바닷가어항구역명, 바닷가조사년도 데이터로 구성되어 있습니다.본 데이터는 바닷가원격모니터링기본 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바닷가원격모니터링기본란 위성, 센서 등 원격 탐사 기술을 이용하여 육상이나 선박에서 바닷가 지역의 다양한 환경 정보(해수면 온도, 녹조, 지형 변화 등)를 실시간으로 수집하고 분석하여, 해양 환경을 관리하고 보존하는 데 필요한 기초적인 데이터를 제공하는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
