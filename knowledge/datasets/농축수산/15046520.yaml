description_portal: '통계개요* 통계명 : 화훼류 재배현황* 통계종류 : 서울시 화훼류 재배현황을 제공하는 일반ㆍ보고통계* 작성목적 : 화훼류 재배 및 판매현황을 파악하여, 화훼산업 발전을 위한 시책마련 및농업정책 수립 등에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 농림축산식품부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 절화류, 분화류, 초화류(화단용), 관상수류, 화목류 등의 재배현황○ 용어설명* 본 : 줄기를 절단하여 수확하는 품목에 사용되며 수확의 최소단위로 1줄기를 의미함(장미, 국화, 백합 등 꽃봉오리가 달려있는 수확물 1개체)* 분 : 화분에 담겨진 상태로 유통되는 품목에 사용되며 화분의 개수를 의미함(관엽류,난, 초화류 등)* 주 : 포기(그루)를 의미함((관상수류(소나무류, 단풍나무 등 꽃이피지않는 조경수)나화목류(철쭉, 벚나무 등 꽃이피지 않는 조경수)의 단위로 사용))* 구 : 번식을 목적으로 하여 구근의 형태로 수확하는 품목에 사용되며 구근 1개를 의미함(글라디올러스, 백합, 아이리스, 튜립 등)'
