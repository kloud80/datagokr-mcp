summary_user: 농업과학도서관 소장 고농서에 나오는 농업 용어를 한 건씩 담은 용어 목록으로, 용어마다 한글명·한자명과 수록 고문헌명을 함께 기록하며 포털 설명상 고농서 47권(22개 문헌)에서 뽑은 4,645건이다. 농업사·한문 고문헌 연구자가 특정 한자 농업 용어가 어느 고농서에 나오는지, 그 한글 표기가 무엇인지 찾는 데 쓴다. 용어사전일련번호(agri_term_seq)와 고문헌코드(old_agri_doc_cd)가 키라서 같은 기관의 고농서 용례·문헌 정보 데이터와 이어 쓰며, 농산물 가격이나 품목코드와 연결되는 키는 없다.
description_portal: 고농서용어 정보는 농업과학도서관 소장 고농서에 사용된 용어를 관리합니다.용어는 한글명과 한자명을 표기하여 관리하고 있습니다.용어가 수록된 고농서의 도서명을 함께 관리하고 있습니다.데이터의 발생과 관리시점은 농업과학도서관에서 자체기획하여 고문헌 분석 후 자료추출, 자료검증 등의 작업을 거친 후 입력합니다.현재 등록된 데이터는 고농서 47권을 분석하여 도출한 농업용어와 용례를 기록하였습니다.고농서 47권은 22권의 문헌으로 분류하여 관리하고 있습니다.등록된 전체 용어는 4,645건입니다.고문헌 명과 권차, 문헌제목 항목을 데이터로 관리합니다.* 실제 기술된 문헌명과 농업과학도서관 북큐레이션을 매핑하여 데이터를 관리
