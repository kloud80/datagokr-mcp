        required: true
        example: '149.02336'
        desc: 최고경도
      - name: pageNo
        required: false
        example: '1'
        desc: '페이지 번호 기본값: 1'
      - name: numOfRows
        required: false
        example: '10'
        desc: '한 페이지당 데이터 개수 기본값: 10, 최대값: 300'
      - name: include
        required: false
        desc: 출력하고자 하는 항목명 (ex lat,lot)
      - name: exclude
        required: false
        desc: 출력 제외하고자하는 항목명 (ex lat,lot)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
