summary_user: IPCC 6차 평가보고서 기후변화 시나리오에 따라 고해상도 지역해양기후 수치모델로 예측한 우리나라 주변 해역의 2015~2100년 표층염분 전망값을 격자 좌표(위도·경도)별로 담은 모델 산출 자료로, 검색 영역의 최고·최저 위도·경도를 넣어 조회한다. 연구자나 양식·연안 관리 담당자가 '특정 해역의 표층염분이 시나리오별로 금세기 말까지 어떻게 바뀌는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표를 공간적으로 맞추거나 같은 기관의 수온 등 해양기후 전망 자료와 시나리오(sspSeCd) 기준으로 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 IPCC 6차 평가보고서의 기후변화 시나리오에 따라 고해상도 지역해양기후 수치예측모델을 활용하여 우리나라 주변 해역의 2015년~2100년 염분 예측정보 제공을 위해 수집한 데이터입니다검색 영역(최고/최저 위도/경도)값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 시나리오명, 지표구분, 위도, 경도, 염분값 정보로 구성되어 있습니다.본 데이터는 해양 환경 변화 연구, 해양 자원 관리, 연안 재해 예방 및 대응 전략 수립 등에 활용될 수 있습니다.
team:
