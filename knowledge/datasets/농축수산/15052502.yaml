summary_user: 국립농산물품질관리원이 적발한 농산물 원산지표시 위반을 연도·업종별로 묶어 거짓표시와 미표시 적발 업소 수(개소)를 담은 전국 단위 집계 데이터다. 소비자단체나 정책 분석가가 "음식점과 유통업체 중 어느 업종에서 원산지 거짓표시가 많고, 해마다 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 업종 이름을 맞춰 붙여야 한다.
description_portal: 농산물원산지표시제도는 농산물, 수산물이나 그 가공품 등에 대하여 적정하고 합리적인 원산지 표시를 하도록 하여 소비자의 알권리를 보장하고, 공정한 거래를 유도함으로써 생산자와 소비자를 보호하기 위하여 도입한 제도로서 본 정보는 국립농산물품질관리원에서 관리하는 원산지표시업태별 적발 현황 정보로서, 연도, 업종, 거짓표시 적발 실적(개소), 미표시 적발 실적(개소) 항목으로 구성되어 있습니다. 농산물 원산지 업태별 위반 현황 정보를 활용하는 데 관심이 있는 경우 유용하게 사용할 것으로 기대됩니다.
