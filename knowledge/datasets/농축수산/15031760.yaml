description_portal: '경상남도 진주시 가축사육업현황(사업장명칭, 주사육품종, 소재지, 사육두수 등)에 대한 데이터를 제공합니다.축산법 및 같은법 시행규칙 규정에 따라 허가 등록된 경상남도 진주시에 소재하는 가축사육업현황에 대한 데이터를 제공합니다.이 데이터는 사업장명칭(농장/업체의 이름), 주사육업종(주로 사육하는 가축 품종(예: 한우, 돼지, 젖소, 육계 등), 사업장 소재지(지번 주소 및 도로명 주소를 함께 포함), 사육두수(각 사업장에서 해당 품종 기준으로 사육 중인 가축 수), 데이터 기준일(해당 자료의 집계 기준일)을 포함하고 있습니다.가축사육업 허가등록에 대한 자세한 사항은 관련 법령 및 관련 부서에 문의하여 주시기 바랍니다.관련 부서 : 농축산과관련부서 연락처 : 055-749-6197'
