description_portal: 본 데이터는 경상남도 의령군 시설재배농가현황을 제공합니다. 데이터는 연도, 농가수, 재배면적(ha), 데이터 제공기준일로 구성됩니다. 이를 통해 이용자는 연도별 시설재배 농가 수와 총 재배 면적을 한눈에 확인할 수 있으며, 지역 농업 규모 추이 분석에 활용할 수 있습니다. 행정기관 및 농업 담당 부서는 이 자료를 바탕으로 연도별 생산 규모 평가, 정책 효과 검토, 향후 농업 지원 계획 수립 등에 참고할 수 있습니다. 데이터 제공기준일은 자료의 최신 반영 시점을 나타내어 활용 시점의 적합성 판단에 도움을 줍니다. 본 데이터는 공공데이터포털에서 내려받아 사용 가능하며, 지역 농업 기반 정보를 제공하는 중요한 자료입니다.
