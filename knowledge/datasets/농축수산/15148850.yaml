summary_user: 전국 시·도 및 지방청이 낸 공유수면 점용·사용 허가를 건별로 담은 파일 데이터로, 검증 시 7,438행이 수신됐고 허가 기간·면적·목적·이용금액·주소 등을 포함한다. 사업자나 분석가가 특정 해역에 어떤 점용·사용 허가가 있는지, 언제부터 언제까지인지 확인하는 질문에 쓴다. 공유수면점용사용주소(address)를 조인 키로 삼아 주소 기반 다른 해양공간 자료와 이어 쓰며, 해상풍력 등 입지 규제를 보는 해양용도구역 자료와 함께 볼 수 있다.
description_portal: 이 데이터는 해양수산부에서 공유수면점용사용시도지방청허가에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공유수면점용사용관리번호, 공유수면점용사용명, 공유수면점용사용구역명, 공유수면점용사용피허가자협의내용, 공유수면점용사용위치내용, 공유수면점용사용최초허가일자 등의 데이터로 구성되어 있습니다.본 데이터는 공유수면점용사용시도지방청허가 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면점용사용시도지방청허가란  바다, 하천 등 공유수면을 개인이나 단체가 특정 목적(건축물 신축, 흙 채취 등)으로 사용하기 위해 해당 지역을 관리하는 도지사나 지방청으로부터 받는 허가를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
