summary_user: 해양수산부가 유의파고(불규칙한 파도 중 가장 높은 1/3의 평균 파고)를 격자 단위 공간정보로 정리해 공간정보일련번호와 파도높이를 담은 전국 범위의 CSV 파일(약 1.6MB)이다. 해양 행정·정책 담당자나 분석가가 '어느 해역 격자에서 파고가 높게 나타나는가'를 확인하거나, 낚시·레저 안전 관련 해역 파고 수준을 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 격자·일련번호 매핑이나 같은 기관(해양수산부·국립해양조사원 바다누리) 자체 코드로만 이어 쓸 수 있다.
description_portal: 이 데이터는 해양수산부에서 유의파고에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호,  격자아이디, 파도높이 데이터로 구성되어 있습니다.본 데이터는 유의파고 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.유의파고란 불규칙한 파도군 중에서 가장 높은 파도 1/3의 평균 파고를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
