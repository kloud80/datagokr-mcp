description_portal: '이 데이터는 해양생물다양성 연구 및 관리에 활용하기 위해 수집된 해양생물 자원의 기초 정보를 담고 있습니다. 각 로우데이터는 개별 자원 단위를 기반으로 하며, 해양생물명(학명)과 해양생물국명(우리말 이름), 생물분류체계(문·강·목·과·속·종 등), 채집일자, 채집지 위치 정보(위도·경도 포함 가능), 채집국가, 채집해역, 서식환경(예: 연안, 심해, 갯벌, 암반 등) 등의 정보를 포함합니다. 본 데이터는 해양생물 분포 현황, 생태적 특성 분석, 생물다양성 보전 및 해양환경 관리 정책 수립 등 다양한 연구 및 행정 목적에 활용될 수 있습니다.'
