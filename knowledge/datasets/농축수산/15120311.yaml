description_portal: 산사태정보 재난복구비용 산정기준 단비추이(사유시설) 데이터는 1996년부터 2023년까지 사유시설에 대한 산사태 및 관련 재난복구비용의 연도별 변동 현황을 제공하는 중요한 자료입니다. 이 데이터에는 표고재배사, 잔디, 밤, 대추, 약용류 등 다양한 농림업 시설 및 작물별 복구비용이 세분화되어 포함되어 있어 산림재해 발생 시 사유재산 피해 복구비용을 산정하고 예산 계획을 수립하는 데 활용할 수 있습니다. 또한 산림재해 대응 정책 수립, 피해 규모 분석, 연구 및 보험 상품 개발 등 다양한 분야에서 참고자료로 쓰일 수 있으며, 정기적으로 갱신되어 최신 정보를 반영합니다. 행정기관, 연구기관, 정책 담당자뿐만 아니라 일반 이용자에게도 신뢰성 있는 근거 자료로 제공되어 산림재해 관리와 복구 정책 수립에 기여합니다.
