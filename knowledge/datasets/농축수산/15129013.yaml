description_portal: 해당 데이터는 경상북도 영천시 내 풍황계측기 설치 허가 현황을 나타내는 공공데이터입니다. 영천시의 풍황계측기 설치 현황을 체계적으로 파악할 수 있도록 허가일, 만료일, 설치 위치, 목적, 허가자, 데이터 기준일자 등의 상세 정보를 포함하고 있으며, 각 계측기의 위치는 읍면리, 산리, 번지 등 구체적인 주소로 표기되어 있습니다. 본 데이터는 풍황계측기 설치 허가에 관한 정보를 체계적으로 정리하여, 관련 기관 및 이해관계자들이 허가 현황을 신속하게 파악하고, 정책 수립이나 관련 업무 수행에 활용할 수 있도록 제공됩니다. 다만 산지일시사용허가를 득한 풍황계측기 데이터만 보유하고 있으며 설치 장소에 따라 공유수면 점사용허가, 타용도 일시허가, 개발행위허가 등 타 법률에 의하여 풍황계측기 설치 허가를 득할 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 산림과로 연락주시기 바랍니다.
