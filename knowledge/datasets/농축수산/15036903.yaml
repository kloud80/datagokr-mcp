description_portal: 본 데이터는 경기도 광주시청에서 관리하는 친환경농산물 현황 자료입니다. 주요 제공 항목은 친환경농산물관리번호, 단체명, 재배지 상세주소, 인증구분, 품목, 농가수, 인증번호, 인증년도 등으로 구성되어 있으며, 친환경농산물(화학 비료나 제초제, 농약 등을 최대한 사용하지 않고 재배한 농산물)의 인증 상태와 생산 단체, 재배 지역 등의 핵심 정보를 수록하고 있습니다. 해당 데이터는 화학 비료 및 농약 사용을 최소화한 생산 농산물의 유통·관리 투명성을 높이고, 친환경 인증 기준 준수 여부와 품목별 현황을 신속하게 파악할 수 있도록 지원합니다. 또한, 농가별 통계 및 인증 현황을 제공함으로써 지속 가능한 농업 정책 수립에 활용되며, 시민과 관계 기관이 최신 친환경농산물 현황을 쉽고 신뢰성 있게 확인할 수 있습니다.
