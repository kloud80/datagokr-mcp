summary_user: 농촌진흥청 농업경영종합정보시스템에 모인 농업경영체별 상세 정보로, 실측 파일에는 경영체 코드·해당연도·소득구분별 조수입·경영비·소득과 등록일이 담겨 있으며 범위는 전국(비공간)이다. 농업 컨설턴트나 분석가가 '연도별로 경영체의 조수입 대비 경영비와 소득이 어떻게 달라졌나'를 보고 경영 문제를 진단하는 데 쓴다. 전역 조인 키는 없고 농업경영체 코드는 이 기관 내부 코드라서, 같은 기관 자료와 그 코드로 잇거나 이름·코드 매핑을 거쳐야 한다.
description_portal: 이 자료는 농촌진흥청의 농업경영종합정보시스템을 통해 농가경영개선 및 컨설팅을 목적으로 수집된 농업경영체의 상세 정보를 담고 있습니다. 주요 내용에는 경영체의 경영유형, 경작 및 사육 면적, 보유시설, 농기계 보유 현황 등 경영기반 정보와 함께, 품목별 농업소득 정보(총수입, 경영비, 순소득 등)가 포함됩니다. 또한 경영역량 강화를 위한 교육 이력, 정부 및 지자체로부터의 포상 수혜 기록, 각종 지원사업 참여 이력 등도 수록되어 있어, 농업경영체의 전반적인 경영 상황을 다각도로 파악할 수 있습니다. 이 자료는 개별 경영체의 문제 진단과 맞춤형 경영지도 및 컨설팅을 수행하는 데 활용되며, 이를 통해 농가의 경영역량 강화와 소득 증대를 유도하고 지속가능한 농업경영 기반을 구축하는 데 기여합니다.
