description_portal: 이 데이터는 해양수산부에서 강원 지역의 해양 특성을 격자 단위로 조사한 결과를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 강원 지역 특성평가격자 공간정보일련번호, 격자아이디, 레이어명 등으로 구성되어 있습니다.  본 데이터는 강원도 해양수산 공간의 현황 파악, 해양수산 자원의 분포 조사, 격자별 특성 분석, 해양수산 정책의 공간적 기초 자료 제공 등과 같은 목적으로 활용될 수 있습니다. 공공기관에서는 지역 해양수산 정책개발 및 자원관리 방안 수립 시 참고자료로 이용할 수 있으며, 연구기관에서도 강원 해역 및 해안의 공간적 특성을 분석하기 위한 기초 데이터로 사용할 수 있습니다.
