description_portal: 이 데이터셋은 제주특별자치도 내에서 시행된 ‘요네병’ 검사 실적을 정리한 공공데이터로, 각 농가 또는 가축 단위별 검사 건수, 검사 시점, 검사 방법, 검사 결과(양성/음성 여부) 등 세부 정보가 포함되어 있습니다. 요네병은 소와 양 등의 반추동물에서 장 점막에 만성 염증을 일으키며 설사, 쇠약, 비유량 감소, 사료효율 저하 등을 유발하는 가축 전염병으로, 한 번 발생하면 완치가 어렵고 전염성 및 잠복기가 긴 특성을 지니고 있어 농가와 축산 산업에 큰 위협이 됩니다.  이 데이터를 통해 제주 지역 내 요네병 검사 및 감시 현황, 감염 비율, 검사 빈도와 시점, 농가별 상태를 파악할 수 있어 방역관리 실태 평가, 축산위생 정책 수립, 청정농장 인증 여부 확인, 가축전염병 예방 전략 설계 등에 중요한 기초자료로 활용될 수 있습니다. 데이터는 CSV 형식으로 무료 제공됩니다.
