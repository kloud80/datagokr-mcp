description_portal: 본 데이터는 경상북도 청도군 관내에 위치한 양만장(養鰻場)에 대한 인허가 및 운영 현황 정보를 포함하고 있다. 청도군에서 인허가를 받아 운영 중인 양식 어업시설을 대상으로 하며, 사업장명, 전화번호, 인허가번호, 어업명칭, 조업방법, 허가 시작일자 및 종료일자, 시설 위치, 수조면적, 시설규모, 양식 수산물 품목, 데이터 기준일자 등의 항목으로 구성되어 있다. 본 자료는 수산자원 관리, 양식업 정책 수립, 지역 내 양식산업 현황 파악 등에 활용될 수 있으며, 어업인 대상 행정 지원, 어업시설 점검, 수산물 유통 기반 마련 등 다양한 행정 목적의 기초자료로 제공될 수 있다. 민간에서는 양식 어업 분석, 지역 특산물 연구, 수산 관련 산업 육성 자료로도 활용 가능하다.
