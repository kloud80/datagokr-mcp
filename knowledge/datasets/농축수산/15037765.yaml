description_portal: '이공공데이터는 경상남도 사천시 관내에 위치한 축산농가들의 운영 현황을 집계하여 제공하는 자료입니다. 사천시의 축산업 규모와 분포를 파악하고, 가축 전염병 예방 및 축산물 수급 안정화를 위한 정책 수립의 기초 자료로 활용됩니다.파일에 포함된 주요 데이터 항목은 다음과 같습니다.사업장명: 해당 축산 농가의 공식적인 이름 또는 농장명을 명시합니다.주 사육 업종: 농가에서 주력으로 사육하는 가축의 종류 (예: 한우, 돼지, 닭, 오리 등)를 분류하여 축산업의 구조를 보여줍니다.사육 두수: 농가에서 현재 사육 중인 가축의 총 마리(또는 수) 수를 구체적인 숫자로 제공하여 농장의 규모를 파악할 수 있습니다.이 현황 자료는 사천시의 축산업 동향 분석, 가축 방역 대책 수립, 환경 관리 계획 등에 필수적이며, 지역 농업 경제의 안정화에 기여하는 중요한 공공 정보입니다.'
