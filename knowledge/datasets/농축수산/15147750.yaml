description_portal: 농림축산식품부에서는 농림사업 지급기준 조사료정보를 제공합니다.본 정보 제공 데이터는 사업년도, 농림사업명, 지급기준일련번호, 조사료등급, 제조비자부담비율, 건초사일리지가중치, 제조비지원톤금액, 기준일자등의 정보를 포함하고 있습니다.본 제공자료는 조사료생산기반확충사업(통합사업)의 톤당 제조비지원금액에 대한 정보를 보여주는 데이터 입니다.조사료 종류에는 경엽채류, 산채류, 과수, 약용작물, 화훼류, 숙근류, 곡류, 유지류 등이 있으며 제조비 자부담비율은 10%로 고정비 입니다.
