description_portal: '1. 선박이 국제항해에 종사하기 위해 필수적으로 소지해야하는 국제톤수증서와 관련된 행정 정보(발급일자, 장소, 신청구분 등)와 해당 선박의 고유 식별 정보 및 제원(길이, 너비, 톤수 등)을 통합 관리하는 데이터입니다.2. 데이터는 크게 3가지 영역으로 구분 할 수 있습니다. - 선박 고유 식별 정보 : 선박번호, IMO번호 등을 통해 개별 선박을 식별합니다 - 선박 제원 : 길이, 너비, 상갑판깊이, 국제총톤수, 순톤수 같은 정보로 항만 사용료를 산정하는 중요한 지표가 됩니다. - 증서 발급 정보 : 신청일자, 발급일자, 최초측정일자 등 증서 발급 정보를 관리합니다.3. 활용 - 입출항 선박의 규모를 파악하여 접안 시설 배정 및 항만 사용료 계산 - 선박의 톤수 변화나 제원 변경 사항 관리 - 선박의 평균 규모나 톤수 분석'
