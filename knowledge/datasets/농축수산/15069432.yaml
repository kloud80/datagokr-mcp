description_portal: 공중진화대에서 보유하고 활용하는 드론 운영 현황 정보를 제공하는 데이터로, 관리소, 보유현황, 산불현장, 계도, 훈련, 기타 등의 항목으로 구성되어 있다. 본 데이터는 산불 예방 및 대응 활동에 활용되는 드론의 보유 현황과 활용 분야를 체계적으로 관리하고 확인할 수 있도록 제공된다. 드론 활용 목적별 현황을 분석하여 산불 발생 현장 대응, 산림 보호 활동, 예방 계도, 훈련 운영 등 다양한 분야에서의 활용 실태를 파악할 수 있다. 또한 관리소별 드론 보유 현황과 운용 목적을 비교·분석하여 재난 대응 자원 배치, 현장 대응 능력 강화, 효율적인 장비 운영 계획 수립 등에 활용 가능하다. 공공기관 및 연구기관에서는 드론 기반 산불 대응 체계 분석, 무인항공기 활용 확대 방안 연구, 산림재난 대응 정책 수립 및 안전관리 개선을 위한 기초자료로 활용할 수 있는 공공데이터이다.
