summary_user: 한국농수산식품유통공사가 조사연월 단위로 집계한 농산물 중도매인 판매가격과 소매가격을 시군구·품목·품종·등급별로 담으며, 월별·연별 평균가·최고가·최저가와 표준편차·변동계수 같은 변동 지표를 함께 제공하고 범위는 전국 시군구다. 농업인·유통업자·정책담당자가 "특정 품목의 소매가격이 지역별로 월마다 얼마나 오르내렸나"처럼 가격 추이와 변동성을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 품목코드(item_cd)·품종코드(vrty_cd)와 시군구 이름·코드를 매핑해 같은 기관의 KAMIS 가격 데이터 등과 이어 쓴다.
limits: 건별 거래가 아닌 월·연 단위 집계값이므로 일별 시세나 개별 거래 가격은 알 수 없다. 품목코드 체계가 KAMIS·도매시장·HS·KOSIS마다 달라 다른 출처와 결합하려면 코드 매핑이 필요하다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
