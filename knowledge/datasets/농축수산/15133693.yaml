summary_user: 한국농어촌공사가 농지관리기금으로 조성한 간척 농지의 사업지구별 현황을 지구·공구 단위로 담은 전국 범위 파일로, 사업명·사업목적·개발면적·사업효과·주요시설물과 규격·등록일을 포함한다. 간척지 임대·매입을 검토하는 농업인이나 분석가가 특정 간척지구가 어떤 목적으로 얼마나 넓게 개발됐고 어떤 시설물이 있는지 확인하는 데 쓴다. 필지번호(PNU) 같은 전역 조인 키가 없어, 다른 데이터와는 사업명·지구명 이름 매핑이나 같은 기관의 지구코드·공구코드로만 이어 쓴다.
