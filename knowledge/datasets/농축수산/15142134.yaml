summary_user: 농약 한 건(등록번호·상표명·품목명) 단위로 적용 작물·병해충, 주성분 함량, 작용기작, 희석배수·사용량·사용적기·안전사용시기와 횟수, 인축·어독성, 제형, 회사명을 담은 전국 범위의 일반 농업자재 농약 등록 정보다. 농업인이나 연구자가 '특정 작물의 이 병해충에 쓸 수 있는 농약과 그 작용기작, 안전사용 기준은 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작물명·병해충명·품목명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 이 데이터는 병해충과 관련된 농약의 작용 기작을 매칭하여 체계적으로 정리한 일반 농업 자재 농약 데이터입니다. 이 데이터는 산출된 정보를 통하여 농업 종사자 및 연구자들이 특정 병해충에 대한 효과적인 농약의 선택과 활용에 도움을 줄 수 있도록 구성되었습니다. 또한, 농약의 작용 기작에 대한 정보는 농업의 효율성을 높이고, 병해충 관리에 대한 과학적인 접근을 가능하게 하여 자원의 절약 및 환경 보호에 기여할 수 있습니다. 이 데이터는 농업 교육 및 연구, 농약 개발, 병해충 관리 프로그램, 그리고 농업 기술 교육과 같은 여러 분야에서 유용하게 활용될 수 있습니다.
