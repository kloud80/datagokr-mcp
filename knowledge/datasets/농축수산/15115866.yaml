description_portal: 이 데이터는 해양수산부에서 중국 어선의 한국 EEZ(배타적 경제수역) 내 협정 어업 활동과 관련된 협정 기본 정보 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 기준년도, 어업종류코드, 업종명, 합의척수, 총할당량(톤), 정렬번호, 확정여부, 확정일자, 조업수역코드, 사용어구코드, 업종영문명, 업종한자명, 최초생성시점, 최종변경시점, 데이터기준일자로 구성되어 있습니다.  본 데이터는 한중 어업협정에서 중국어선의 조업관리, 정책 이행점검, 연간 할당량 관리, 어종별 및 조업수역별 합의내용 분석, 어업통계 연구, 협정 이행여부 모니터링 등에 활용될 수 있습니다.
