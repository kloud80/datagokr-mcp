description_portal: '2020년 기준으로 산림과학원이 홍릉, 양재, 시화, 고매 지역의 청정넷 대기질 관측소 주변의 사용자 이용 가치를 정량적으로 평가하기 위해 구축한 데이터베이스입니다. 이 데이터는 대기질 개선의 체감도를 반영하기 위해 토지피복 가중치, 예측농도 가중치, 인구밀도 가중치, 교통속도 가중치, 보행속도 가중치 등 다양한 요인을 포함하고 있으며, 해당 지역의 환경 가치와 이용 가능성을 수치화하여 시각적 분석이 가능하도록 설계되었습니다.활용 가능성 : 도시 녹지 계획 수립, 환경 영향 평가, 스마트 시티 설계, 도시숲 조성 관리 등'
