description_portal: 데이터는 경기도 화성시 내 포도 재배 스마트팜 농가를 대상으로 2019년 1월부터 3월까지 수집된 휴면기 온도 정보를 포함한다. 수치는 스마트팜 온실 내 설치된 센서를 통해 자동 측정된 것으로, 각 농가별로 구분되며 일 단위로 정리되어 있다. 해당 데이터는 휴면기 동안의 생육 환경 조건을 파악하고, 향후 작물 재배 및 시설 환경 개선을 위한 기초자료로 활용 가능하다. 포함 항목은 측정일, 온도값, 측정 위치 등이며, 포도 농가의 생육 전 온실 내 온도 관리 실태를 분석하는 데 유용하다. 지역별 농가 간 환경 차이 분석, 스마트팜 운영 현황 파악, 농업 기술 연구 등의 목적으로도 활용될 수 있다.
