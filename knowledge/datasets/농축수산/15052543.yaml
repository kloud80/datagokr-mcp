summary_user: 양재동 화훼공판장의 화훼 경매 실적을 연도별로 집계한 파일로, 절화·난·관엽 세 부류의 거래량(만단)과 거래금액(백만원)을 한 행에 담는다(파일 크기 583바이트의 소규모 집계표). 화훼 농가·꽃 도매상·유통 분석가가 "최근 몇 년간 양재 공판장의 절화 거래량과 거래금액이 어떻게 변했나" 같은 연도별 시장 규모 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞춰 붙여야 하며, KAMIS·도매시장 품목코드와도 직접 이어지지 않는다.
description_portal: 화훼유통정보시스템(https://flower.at.or.kr/main/flowerMain.do)을 통해 수집된 양재동 화훼공판장의 연도별 화훼경매(절화, 난,  관엽류)의 실적(거래량, 거래금액)정보입니다. - 화훼류의 경매 결과를 제공하면서, 국내 꽃시장의 수요 및 공급, 낙찰가격에 따른 시장 공급물량 및 거래금액을 표현할 수 있는 기초 자료를 제공합니다. 국내 화훼시장의 대표 경매장인 양재동 정보를 통해 거래실적을 투명하게 국민들에게 제공코자 합니다. - 해당 데이터는 양재화훼공판장 경매 시세 자료를 기준- 연도별 가격 변동과 거래량 정보를 시기별 가격 예측 및 재고 관리 지원
