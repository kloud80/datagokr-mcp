summary_user: 경기도 사이버식물병원이 제공하는 병해충 방제법, 진단 애플리케이션 안내, 상담 사례집 같은 참고자료의 목록을 자료 한 건마다 제목, 간단한 내용 요약, 등록일로 담는다. 농가나 작물 재배자가 "시금치 병해충 방제 자료나 과수 화상병 진단 자료가 있는가"를 찾아볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 제목 같은 이름으로만 이어 쓸 수 있고, 첨부파일은 포털 설명상 참고자료_첨부파일 테이블과 제목 기준으로 연계해 확인한다.
description_portal: 이 데이터는 사이버식물병원 병해 진단 및 작물 관리와 관련된 외부 또는 내부의 참고자료 정보를 간략하게 제공하는 데이터입니다. 자료는 제목, 내용, 자료등록일로 구성되어 있으며, 시금치 병해충 방제법, 과수 화상병 진단 애플리케이션, 식물병원 상담 사례집 등 다양한 주제의 문서 목록을 제공합니다. 이 테이블은 참고자료의 제목, 간단한 요약 설명, 등록일 정보를 포함하고 있으며 각 항목은 농가 대상 정보 제공, 작물 병해충 예방 및 진단, 농약 안전사용 교육 등의 목적을 가지고 있습니다. 첨부파일이 있는 경우 참고자료_첨부파일 테이블과 연계되어 제목과 파일명을 확인할 수 있습니다.
