summary_user: 품목별 농식품 수출 실적을 2020년과 2021년 두 해에 걸쳐 정리하고 전년 대비 증감률을 함께 담은 전국 단위 집계 통계표다. 농식품 기업이나 정책 담당자가 '2021년에 수출이 크게 늘거나 줄어든 농식품 품목은 무엇인가'를 확인하고 품목별 경쟁력을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 품목명이나 품목코드를 매핑해 이어 쓴다. KAMIS 가격, 도매시장, HS, KOSIS는 품목코드 체계가 서로 달라 별도 대응표가 필요하다.
description_portal: 해당 데이터는 품목별로 2020, 2021년 농식품 수출 실적 및 전년 대비 2021년도 수출 실적 증감률 등을 정리한 통계자료입니다. 이를 통해 개별 품목의 수출 실적 변화와 성장 추세, 가격 변동 및 수출 효율성을 분석할 수 있으며, 수출 전략 수립 및 품목별 경쟁력 평가에 활용 가능합니다. 또한, 국내 농식품 산업의 해외시장 확대와 정책 결정, 무역 지원 프로그램 설계 등 다양한 분야에서 기초 자료로 활용될 수 있어, 정책 담당자, 연구기관, 농식품 기업 등 관련 이해관계자들이 실질적인 의사결정과 전략 수립에 참고할 수 있는 중요한 자료입니다.
