description_portal: 한국농어촌공사에서 시행 중인 종전부동산사업의 주요 개발지구 6개에 대한 각 지구별 상세내역(사업지구명, 소재지, 면적, 사업기간 등)을 제공합니다. 각 지구의 해당지역은 경기도 수원시 및 화성시 입니다. 각 지구의 사업은 도시개발사업 후 매각, 지구단위계획 수립 후 매각, 현상태 매각의 방식으로 추진되고 있습니다.주요 개발지역들은 우수한 교통 및 자연환경을 바탕으로 주거 및 상업용지 조성, 교육 및 상업기능 확장, 공공시설 확충 등으로 사업을 진행하고 있으며, 사업기간은 2012년을 시작으로 2035년까지 사업기간종료를 목표로 하고 있습니다.
