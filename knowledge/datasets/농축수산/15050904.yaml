description_portal: '농림수산식품교육문화정보원에서는 가축 질병에 관련된 다양한 정보를 제공하고 있습니다. 특히 이 데이터는 가축 질병의 명칭뿐만 아니라, 각 질병에 맞는 약품의 분류와 해당 질병의 발생 현황, 감염 경로, 원인체, 증상, 진단, 치료법, 예방 방안 등을 포함하고 있습니다. 이 정보는 축산업 종사자나 농업 관련 연구자, 보건 전문가들이 가축의 건강 관리 및 예방적 조치를 이해하고 실천하는 데 중요한 역할을 할 수 있습니다. 이러한 데이터는 질병 발생을 예방하고 치료할 수 있는 지침을 제공함으로써, 가축의 생산성 향상 및 경제적 손실을 줄이는 데 기여할 것입니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  - 카테고리(문자형) : 질병 정보의 분류를 나타냅니다.- 제목(문자형) : 특정 질병의 이름을 기재합니다.- 요약글(문자형) : 질병에 대한 간단한 설명을 포함합니다.- 서브제목1,2,3,4(문자형) : 각 항목의 제목을 표시합니다.- 서브내용1,2,3,4(문자형) : 해당 서브제목에 대한 구체적인 내용을 설명합니다.- 등록일(날짜형) : 데이터가 등록된 날짜를 나타냅니다.'
