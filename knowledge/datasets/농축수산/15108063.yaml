summary_user: 전국 주요 봉우리 주변의 자연경관 지점(경관자원·포토존·조망점)을 관심지점 단위로 담은 건별 데이터로, 지점마다 위도·경도·해발고도와 장소명, 설명, 소속 숲길이 붙는다. 등산객이나 탐방 안내 서비스 개발자가 '이 숲길에서 조망점이나 포토존은 어디이고 고도는 얼마인가'를 확인하거나 경관 분포를 지도에 시각화하는 데 쓴다. 전역 조인 키는 없으므로, 같은 기관의 숲길식별자(frtrlId)·숲길명으로 다른 등산로·숲길 데이터와 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 11월 16일에 등록하여 제공하는 오픈API 서비스로, 전국 주요 봉우리의 자연경관 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 기준일시 등의 속성을 호출할 수 있으며,이를 활용하여 자연경관 분포 시각화, 관광자원 개발, 경관분석, 탐방로 안내, 환경보전 정책 수립 등 다양한 분야에서 활용이 가능한 경관정보를 JSON+XML 포맷으로 지원합니다.
team:
  dept: 기획조정실
services:
  - op: /getSceneryInfoList
    name: 전국주요봉우리 자연경관정보 조회
    endpoint: https://apis.data.go.kr/B553662/sceneryInfoService/getSceneryInfoList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        example: '1'
        desc: 한 페이지 결과 수
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지 번호
      - name: type
        required: false
        example: xml
        desc: 데이터 타입
      - name: srchFrtrlNm
        required: false
        example: 장등산
        desc: 숲길명
      - name: srchPlaceTpeCd
        required: false
        example: SCENERY
        desc: 장소유형코드
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
