description_portal: 이 데이터는 해양수산부에서 수신된 선박자동식별시스템(AIS) 선박 통계 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 각 선박의 선박번호(MMSI), 정보가 등록된 날짜, 그리고 해당 선박에 대한 AIS 통계 건 수 정보로 구성되어 있습니다.  본 데이터는 관련 기관에서 선박별 이동 현황 및 등록 현황 분석, 선박 활동 패턴 모니터링, 항만 및 해양안전관리 정책 수립, 해상 교통량 변화 분석 등 업무를 위한 기초 자료로 활용될 수 있습니다. 또한, 해상 교통관제 및 혼잡도 분석 등 활동에 사용될 수 있습니다.
