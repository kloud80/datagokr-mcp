summary_user: 인천 남촌농산물도매시장에서 경매로 거래된 채소·과일을 경매일자별·품목별로 물량과 거래금액을 담은 CSV 파일(약 454KB)이다. 식자재 구매자나 유통업자, 분석가가 특정 품목의 남촌시장 경매 거래량과 금액이 날짜별로 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 품목코드가 없어 KAMIS·다른 도매시장 가격과 이어 쓰려면 품목명을 기준으로 직접 매핑해야 한다.
description_portal: 인천광역시 남촌농산물도매시장에서 거래되는 채소 및 과일 농산물에 대한 경매 가격 정보로 거래일자, 품목, 물량, 금액 등을 볼 수 있습니다.인천광역시 남촌농산물도매시장 일별 경매 가격정보는 각 품목에 대한 경매일자별 거래물량, 거래금액, 평균가격, 최고가격 등농산물의 종류별로 경매일, 경매물량, 거래금액, 평균단가 등을 통해 시장 내 유통현황과 가격 변동을 확인할 수 있습니다.유통현황과 가격 변동 확인을 통해 가격변동 추이 분석, 시장 예측, 수급조절 농산물 정책 수립 등에 활용되는 중요한 기초자료 입니다.
