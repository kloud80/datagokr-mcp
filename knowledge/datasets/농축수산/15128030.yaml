description_portal: 국립농업과학원에서 진행한 2018년 이전의 신기술보급사업의 정보(신기술분야, 신기술사업명, 사업연도, 지역, 사업비, 기대효과, 사업내용)를 제공합니다.신기술보급 데이터는 농업 현장에 적용 가능한 최신 연구 성과와 기술 정보를 정리한 자료이다. 작물 재배기술, 토양·비료 관리, 병해충 방제, 스마트농업 기술 등 다양한 분야의 신기술 내용과 적용 방법, 기대 효과 등을 포함하고 있다. 해당 데이터는 농업인이 새로운 기술을 쉽게 이해하고 현장에 활용할 수 있도록 지원하며, 농업 관련 기관과 연구자는 기술 확산, 교육, 정책 수립 및 농업 경쟁력 향상을 위한 기초자료로 활용할 수 있다.
