summary_user: 사업년도별 산지유통시설(APC 등) 한 곳당 한 행으로 시설종류·주소·사용승인일자·운영상태와 자본금·영업이익, 매취·수탁 비율, 통합마케팅 출하 금액·물량, APC 처리 금액·물량, 출하처별(대형유통업체·도매시장·식자재·전자상거래) 비율을 담은 전국 단위 파일(CSV 약 13.6KB)이다. 농업 정책 분석가나 산지조직 관계자가 "지역별 APC가 얼마나 처리하고 출하처가 어디로 쏠려 있는가" 같은 산지 유통 구조 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(행정구역 이름)나 같은 기관 내부의 시설일련번호로만 맞춰 이어 쓰며, KAMIS 가격 데이터와 연결하려면 별도 매핑이 필요하다.
