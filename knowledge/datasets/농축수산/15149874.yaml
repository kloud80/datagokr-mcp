description_portal: 본 데이터는 선박 활동에 따른 대기오염물질 배출량을 표준화된 방식으로 계산하기 위한 기준 자료 입니다.본 데이터에는 오염물질 산출에 필요한 변수에 대한 파라미터 값과 산정식을 제공합니다.본 데이터 내 매개변수는 오염물질 배출량을 산정하는데 필요한 파라미터 값(배출활동, 산업분류별 등)과 이와 관련된 이행년도, 지침에 대한 정보를 함께 제공합니다.해당 데이터를 활용하여 이산화탄소 배출량(CO2), 메테인 배출량(CH4), 이산화질소 배출량(N2O), 에너지환산량 등을 산출하는데 활용할 수 있습니다.
