description_portal: 이 데이터는 해양수산부 국립해양조사원에서 해양안전사고 예방을 위해 전국데이터셋 위험정보 중 갯바위(자연적으로 만들어진 해상 바위) 관련 정보를 수집한 데이터입니다.  본 데이터의 주요 내용은 2017년 기준 전국데이터셋 위험정보 중 갯바위의 SHP형식 공간정보 파일로 구성되어 있으며, 각 갯바위의 명칭, 관련기관 및 국/영문 기타정보 등을 포함하고 있습니다.  본 데이터는 해양환경 연구, 해안선 변화 모니터링, 해양사고와 연계된 위험지역 선정, 해안지역 개발 시 기초자료로 활용될 수 있습니다. 또한 갯바위 주변의 해양생태계 보전, 어업활동 제한구역 설정 등 해양 정책 수립 및 해양공간 관리에도 응용할 수 있습니다.
