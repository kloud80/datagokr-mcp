description_portal: 본 데이터는 2012년부터 최근까지 제주특별자치도 제주시 관내의 감귤 농업 동향과 경제적 지표를 종합한 통계 자료입니다.매년 변화하는 감귤 재배 식부면적(ha)과 함께 품종별(온주조생, 온주중만생, 만감류) 생산량 추이를 상세히 제공합니다. 또한, 수확된 감귤이 시장에서 어떻게 소비되는지 유통 경로(생과반출, 가공처리, 기타소비)를 구분하고, 이를 통해 창출된 농가 전체의 조수입(매출) 데이터를 포함하고 있습니다. 이를 통해 제주시 감귤 산업의 전반적인 흐름과 품종 다변화 트렌드를 명확하게 파악할 수 있습니다.
