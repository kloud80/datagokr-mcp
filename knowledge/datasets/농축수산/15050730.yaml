description_portal: 식물 신품종 육성자의 권리를 부여하기 위하여 품종보호제도를 운영하고 있으며, 신품종을 출원한 품종에 대한 서류심사, 재배심사, 종합심사 등을 거쳐 신품종을 등록하고 있다.1998년부터 조사기준일까지 국립종자원에 품종보호권이 등록된 품종에 대한 목록(등록번호, 등록일자, 소멸(예정)일자, 존속만료일, 출원번호, 출원일, 작물구분, 작물명, 품종명, 출원인, 국가)이다.데이터 기준일까지 우리나라에 품종보호권이 등록되어 있는 목록으로 출원, 등록한 품종과 주요 품종에 대한 출원, 등록 내역을 파악할 수 있어, 신품종 육성가 등에게 유용한 자료이다.국립종자원에 출원, 등록한 농업종자에 대한 품종으로 산림종자, 수산식물종자는 제외한 자료이다.
