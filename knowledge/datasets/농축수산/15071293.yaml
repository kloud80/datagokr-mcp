description_portal: 해양생명자원통합정보시스템(MBRIS)은 해양미생물 바이오뱅크를 운영하고 있습니다. 해양매생물 바이오뱅크는 고부가가치 산업소재로서의 잠재력을 지닌 해양미생물을 지속적으로 탐색하고 확보하며, 이를 체계적으로 관리·보존하고 있습니다. 확보된 미생물은 과학적 가치평가와 유용성 검증을 거쳐, 산업계 및 학계에 정보와 함께 제공됨으로써 실제 활용 가능성을 높이고자 합니다. 해양미생물은 높은 염분, 수압, 저온 등 육상과는 다른 극한 환경에서 적응하며 진화해왔기 때문에, 기존 육상 미생물과는 다른 특이적인 생리활성물질 및 2차 대사산물을 생성하는 특징이 있습니다. 이러한 특성 덕분에 해양미생물은 천연물 기반 의약품, 건강기능식품, 화장품, 산업용 효소 등 다양한 분야에서 차세대 바이오소재로 각광받고 있으며, 전 세계적으로 주목받는 생물자원입니다. 해양미생물 바이오뱅크는 해양수산부와 국립해양생물자원관의 공동 노력으로 구축되어, 국내 바이오산업의 해양자원 활용을 활성화하고 해양바이오분야의 국가경쟁력 제고에 실질적으로 기여하고 있습니다.
