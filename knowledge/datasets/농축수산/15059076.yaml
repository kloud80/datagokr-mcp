summary_user: 경기도 내 도축장과 집유장을 사업장 한 곳씩 담은 현황 목록으로, 시군·도축/집유 구분·사업장명·도축 축종(소·돼지·닭 등)·도로명/지번 주소·우편번호·위경도 좌표를 개별 시설 단위로 담는다. 축산물 유통이나 위생 정책을 보는 분석가가 '우리 시군에 어떤 축종을 잡는 도축장이 어디에 있는가'를 확인하거나 시설 분포를 지도에 올리는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 매개로 다른 경기도 데이터나 행정구역 자료와 이름·코드 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 내 도축장 및 집유장에 대한 현황을 담고 있으며, 축산물 위생관리와 유통경로 파악에 활용됩니다. 주요 항목은 시군명, 시군코드, 도축집유구분명, 사업장명, 도축종류명(소, 돼지, 닭 등), 소재지 도로명 및 지번주소, 우편번호, 위도·경도 좌표 등으로 구성되어 있습니다. 축산물의 위생적 도축과 유제품의 안전한 수집을 위한 시설 분포를 파악할 수 있으며, 관련 정책 수립, 유통 인프라 개선, 지역별 위생관리 실태 분석 등에 활용될 수 있습니다. 데이터는 경기도 동물방역위생과에서 제공하며, 축산물 가공·유통의 초기 단계에 대한 공간적 정보를 제공합니다.
