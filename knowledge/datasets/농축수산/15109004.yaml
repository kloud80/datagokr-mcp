summary_user: 한국마사회에 등록된 경주마 등 등록마의 소유자 정보를 소유자 한 명(등록 건) 단위로 담으며, 소유자명·등록일·생산자 여부·개인/법인 구분·성별·등록사유·말소사유·외국인 국가코드를 제공한다. 마주나 말 산업 분석가가 "최근 1년간 새로 등록하거나 말소된 마주는 개인과 법인이 각각 몇 명인가"처럼 소유자 구성과 등록 추이를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 마사회 데이터와는 소유자명(owrNm) 같은 이름이나 같은 기관의 코드로만 연결한다.
limits: 말 단위 정보나 고유 소유자 번호가 없어 다른 데이터와 정확히 조인하기 어렵고, 이름이 같으면 구분할 수 없다. 요청변수를 넣지 않으면 등록일 기준 1년치만 나오므로, 그보다 긴 기간은 등록일 검색 범위를 지정해 조회해야 한다. 세부 부문이 농산물 유통 가격으로 분류돼 있으나 내용은 말 소유자 정보이며 가격 정보는 없다.
