services:
  - op: /getOpnJnGridV2WMS
    name: 전남-특성평가격자 WMS 조회
    endpoint: https://apis.data.go.kr/1192000/apVhdService_JnGridV2/getOpnJnGridV2WMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: false
        desc: 좌표체계 EPSG:5179 좌표계 지원
      - name: bbox
        required: true
        desc: 요청 객체의 Bounding box xmin,ymin,xmax,yamx 순서
      - name: width
        required: true
        desc: '변환 이미지의 너비 (단위: 픽셀)'
      - name: height
        required: true
        desc: '변환 이미지의 높이 (단위: 픽셀)'
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getOpnJnGridV2WFS
    name: 전남-특성평가격자 WFS 조회
    endpoint: https://apis.data.go.kr/1192000/apVhdService_JnGridV2/getOpnJnGridV2WFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: bbox
        required: false
        desc: 요청 객체의 Bounding box xmin,ymin,xmax,yamx 순서
      - name: maxFeatures
        required: false
        desc: '출력되는 피처의 최대개수(최대값 : 100)'
      - name: msp_id
        required: false
        desc: 격자번호
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
