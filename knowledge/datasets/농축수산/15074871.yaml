summary_user: 전라남도 해역을 나눈 해양공간 특성평가 격자를 WMS 지도 이미지와 WFS 공간정보(격자 좌표 목록·격자번호)로 담는다. 지자체·관계기관 담당자나 분석가가 해상풍력 등 입지를 검토할 때 '이 해역은 어느 특성평가 격자에 속하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 격자 좌표(posList)를 이용한 공간 중첩이나 이름·기관 코드 매핑으로만 잇는다.
limits: WMS 오퍼레이션(/getOpnJnGridV2WMS)은 최소 파라미터로 호출하면 응답이 없었고, 검색 범위(bbox)·이미지 높이·너비 같은 필수 값을 먼저 정해 넘겨야 한다. 행정코드 같은 공통 키가 없어 표 형태의 통계와 바로 결합되지 않는다.
