description_portal: 축산물품질평가원에서 제공하고 있는 돼지 등급별 경락가격 정보입니다. 매월 돼지도체의 등급별로(1등급, 등외 등) 암, 수, 거세, 전체 돼지의 경락가격과 경락두수 통계정보를 확인 할 수 있습니다.  또한 돼지의 탕박과 박피별로  확인 가능합니다.  월별 통계정보를 제공하고 있어  농업·임업·식품·수산업의 구조적 특징과 변화 추이를 파악하는 데 중요한 기초 자료로 활용되며, 이를 토대로 산업별 지원 정책과 발전 전략을 수립할 수 있습니다. 해당 통계자료는 다양한 형식으로 제공하고 있어 접근 및 활용이 용이합니다.  시각화정보(차트)도 제공하고 있어  변화추이를 쉽게 확인 할수 있습니다.
