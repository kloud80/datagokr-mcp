summary_user: 제주특별자치도에 신고된 곤충 사육업체를 업체 한 곳당 한 행으로 담은 현황 자료로, 상호명·주소·사육 품종·신고 업종·데이터 기준일이 들어 있고 범위는 제주도 한 곳이며 위치는 개별 주소 단위다. 농가 지원 담당자나 연구자가 '제주에서 흰점박이꽃무지·귀뚜라미 같은 품종별 사육업체가 어느 지역에 몰려 있나'를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 주소를 지오코딩하거나 상호명·품종 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터셋은 2021년 기준으로 제주특별자치도 내에서 정식 신고된 곤충 사육업체들의 업체명, 대표자명, 주소, 사육 품종 및 신고업종 정보를 포함한 현황 자료이다. 곤충 사육농가 및 법인에 대한 위치·운영 현황을 체계적으로 정리함으로써, 도내 곤충 산업의 분포, 품종 다양성, 사육 규모, 신고 업종 유형 등을 한눈에 파악할 수 있도록 구성되었다. 이 자료는 곤충산업 활성화 정책 수립, 곤충 농가 지원, 산업곤충 유통 구조 분석, 곤충 관련 안전·위생 관리, 생태 관광 연계, 산업 다각화 전략 마련 등 다양한 행정 및 연구 목적으로 활용될 수 있다. 또한 민간업체나 연구기관에서는 곤충 사육업 밀집 지역 분석, 곤충 품종별 사육 농가 현황 파악, 곤충 기반 산업 가능성 탐색 등에 참고할 수 있는 기초 통계로 가치가 높다. 제공기관은 제주특별자치도이며, 데이터는 CSV 형식으로 공개되어 누구나 다운로드 및 분석이 가능하다.
