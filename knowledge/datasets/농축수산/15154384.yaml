description_portal: 이 데이터는 지역협의체의 구성 현황과 운영 여부를 시도·시군구 단위로 체계적으로 관리하고, 사업 참여 조직의 구성 시점, 채용 여부, 사용 여부 등을 파악하기 위해 2019년부터 2022년까지 수집·구축된 정보입니다.지역협의체 구성 및 운영(TB_REGCST_OPER), 지역협의체 명단(TB_REGCST_MLIST), 지역협의체 운영 및 주요내용(TB_REGCST_MAINCN)을 포함합니다.이 데이터를 통해 지역협의체의 구성 시기와 운영 여부를 검토할 수 있으며, 협의체 조직 활성화 현황 점검, 사업 추진 기반 마련을 위한 참여 조직 관리, 지역 참여도 분석, 운영 실태 평가, 지역 협력체계 고도화, 정책 집행 모니터링 등에 활용될 수 있습니다.파일내 항목별 코드는 코드북을 참고해 주시기 바랍니다.
