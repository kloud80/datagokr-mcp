description_portal: '경상남도 거창군의 2006년 제3호 태풍 에위니아로 인한  자연재난 피해 현황 데이터이며, 재난원인, 피해시설등급, 피해구분, 피해요인, 피해위치, 피해기간 정보를 제공합니다.○ 데이터 기준일 : 2006. 07. 10.○ 태풍 에위니아(Ewiniar)는 2006년 7월 10일 전라남도 진도에 상륙한 뒤 전국을 관통하며 큰 피해를 남겼습니다. 이 태풍은 한반도에 상륙한 3년 만의 태풍으로, 상륙 전후로 장마전선과 겹쳐 전국에 기록적인 폭우를 동반했습니다. 특히 7월 9일부터 29일까지 전국 16개 시·도에 걸쳐 사망·실종 62명, 이재민 2,790명, 주택 전파 491동, 반파 596동의 피해가 발생했습니다. 공공시설도 큰 피해를 입어 도로·교량 1,572개소, 하천 1,939개소, 임도 1,071개소가 파손되었고, 전체 피해액은 약 1조 8,344억 원에 달했습니다.'
