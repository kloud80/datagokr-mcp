summary_user: 국립농산물품질관리원이 지정한 농산물우수관리(GAP) 인증기관 목록으로, 기관 한 곳당 한 행에 지정번호·인증기관명·소재지·인증업무범위·지정일자를 담으며 범위는 전국이다. 농업인이 GAP 인증을 받으려 할 때 우리 지역에서 어떤 품목을 인증해 주는 기관이 어디이고 언제 지정됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 인증기관명이나 소재지 주소를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 국립농산물품질관리원에서 관리하는 농산물우수관리(GAP) 인증기관 정보로서, 지정번호, 인증기관명, 소재지, 인증업무범위, 지정일자 항목으로 구성된 데이터입니다. 농산물우수관리(GAP) 인증이란 생산에서 판매 단계까지 안전관리체계를 구축하여 소비자에게 안전한 농산물을 공급하고 농산물의 안전성 확보를 통한 소비자 신뢰 제고 및 국제시장에서의 우리 농산물의 경쟁력 강화하며 저투입 지속가능한 농업을 통한 농업환경 보호를 목적으로 도입된 제도이며 인증기관에서  인증업무를 추진하고 있습니다.
