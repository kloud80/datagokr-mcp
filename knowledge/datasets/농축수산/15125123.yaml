summary_user: 백두대간 종주길의 관심지점(POI)을 지점 한 건씩 담으며, 권역별로 장소명·위도·경도·해발고도와 장소 유형(등산로 입구·봉우리·샘터·쉼터·화장실·야영장·문화자원 등)을 제공한다. 등산객이나 등산앱 개발자가 '이 권역 종주 구간에서 샘터나 쉼터, 화장실이 어디에 있고 해발 몇 m인가'를 확인하거나 종주 코스를 지도에 그리는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없고, 좌표(위도·경도)로 지도·공간 데이터와 겹치거나 장소명·권역명을 이름으로 맞춰 같은 기관의 등산로·숲길 데이터와 연결한다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2023년 11월 24일에 등록하여 제공하는 오픈API 서비스로, 백두대간 종주길의 관심지점(POI) 정보를 조회할 수 있습니다.API를 통해 관관심지점식별자, 권역식별자, 권역명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 데이터추출일시 등의 주요 속성을 호출할 수 있으며  트레킹 코스 시각화, 지도 기반 경로분석, 모바일 등산앱 연동, GIS 분석 등 다양한 활용 목적에 적합하며 REST 방식, JSON+XML 포맷을 지원합니다.
