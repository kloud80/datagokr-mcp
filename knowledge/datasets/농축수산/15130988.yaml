description_portal: 국립수목원 국가생묿종지식정보시스템의 식물표본 데이터를 각 항목 별로 집계하여 제공하는 표본통계 정보서비스로 소장기관, 채집년도, 식물국명, 식물학명, 표본수량, 이미지수량 등의 항목으로 통계 정보를 제공합니다.국립수목원에서 제공하는 표본정보는 각 대학 식물 표본관, 연구소등에서 소장하고 있는 식물표본을 정보화하였으며, 현재 구축된 약70만점의 표본DB를 근거한통계정보를 제공하고 있습니다.조사된 식물목록은 증거표본을 근거로 하여 제작되었다. 지역별로 수집되어진 표본은 분류군별 전문가에게 의뢰하여 교차동정을 실시한 후 재검토하여 결과의 정확성을높였다.
