description_portal: 축산물품질평가원에서 제공하고 있는 돼지 성별 등급별 경락가격 정보는 축산물등급판정통계정보를 기반으로 제공되고 있습니다.이 데이터는 월별로 돼지도체의 경락가격 현황 조회가 가능합니다. 또한  등급(1등급을 포함하여 4개의 등급정보)별로 성별(암, 수, 거세) 로 경락가격 정보를 확인할 수 있습니다.   돼지 등급별 경락가격 정보를 월별로 확인하여 가격 추이를 확인할 수 있어 소비자가 선호하는 돼지 가격을 예측할 수 있는 중요한 정보로 활용 될 수 있습니다.  이는 축산정책 수립과 유통가격정책을 수립할 시 활용 될 수 있습니다.
