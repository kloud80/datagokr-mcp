description_portal: '해운대구 축산물 판매업 현황 데이터는 관내 축산물 판매업체의 업종구분(식육판매업, 식육즉석판매가공업, 우유류판매업, 식육포장처리업, 축산물유통전문판매업), 업체명, 소재지(도로명주소) 정보를 포함하고 있습니다.[축산물위생관리법 시행령에 따른 업종 구분]- 식육포장처리업: 포장육 또는 식육간편조리세트(자신이 절단한 식육을 주원료로 하여 만든 것으로 한정한다)를 만드는 영업- 식육판매업: 식육 또는 포장육을 전문적으로 판매하는 영업(포장육을 다시 절단하거나 나누어 판매하는 영업을 포함한다).- 식육즉석판매가공업: 식육 또는 포장육을 전문적으로 판매(포장육을 다시 절단하거나 나누어 판매하는 것을 포함한다)하면서 식육가공품(통조림ㆍ병조림은 제외한다)을 만들거나 다시 나누어 직접 최종 소비자에게 판매하는 영업.- 우유류판매업: 우유대리점ㆍ우유보급소 등의 형태로 직접 마실 수 있는 유가공품을 전문적으로 판매하는 영업.- 축산물유통전문판매업:  축산물(이 목에서는 포장육ㆍ식육가공품ㆍ유가공품ㆍ알가공품을 말한다)의 가공 또는 포장처리를 축산물가공업의 영업자 또는 식육포장처리업의 영업자에게 의뢰하여 가공 또는 포장처리된 축산물을 자신의 상표로 유통ㆍ판매하는 영업'
