summary_user: 국립농산물품질관리원이 관리하는 하추곡(벼·밀·콩 등 여름·가을에 수확해 국가나 단체가 매입하는 곡류)의 검사 계획량을 연도·품목·행정구역·업무구분별 수량과 단위로 담은 집계 자료이며, 범위는 전국이다. 정책 분석가나 곡물 유통업 종사자가 "올해 어느 지역에서 벼·콩 검사 계획량이 얼마나 잡혔고 전년과 어떻게 다른가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·행정구역명을 이름으로 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: 농산물검사는 농산물에 대한 국가검사를 실시함으로써 농산물의 품질향상, 공정 원활한 거래 및 소비의 합리화를 도모하여 국민경제 발전에 기여하기 위하여 도입한 제도로서 이 중 하추곡은 벼, 밀, 콩 등 여름(하), 가을(추)에 수확하는 곡류 중심으로 국가 또는 단체 등이 매입하는 품목으로 국립농산물품질관리원에서 관리하는 하추곡 검사 계획량 정보로서, 실적구분명, 연도, 품목명, 행정구역명, 업무구분명, 수량 단위, 수량 항목으로 구성되어 있습니다. 연도별. 품목별. 행정구역별 계획량 등에 관심이 높은 경우에 유용한 정보일 것으로 기대됩니다.
