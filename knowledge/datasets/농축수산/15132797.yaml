description_portal: '- 전라남도 어장도관리시스템에 게재된 보전지역 정보(해안 및 갯벌 습지 보전지역 이름, 코드 등)에 대해 조회하실 수 있습니다.- 전라남도의 습지보호지역은 생태적 가치가 높은 습지를 보전하기 위해 지정된 지역으로, 다양한 생물종의 서식지 보호와 생태계 건강성을 유지하는 데 중요한 역할을 합니다. 이러한 지역은 환경부와 전라남도청의 협력을 통해 관리되며, 습지의 훼손을 방지하고 지속 가능한 이용을 도모합니다.- 전라남도의 해안 보전지역은 해양 생태계 보호와 지속 가능한 이용을 위해 지정된 지역으로, 다양한 해양 생물의 서식지와 생태적 가치를 보존하는 데 중요한 역할을 합니다.- 전라남도는 어장도 관리시스템을 통해 해안 및 갯벌 습지 보전지역의 이름, 코드 등을 제공합니다. 이 데이터는 어업 면허와 관련된 정보를 포함하고 있습니다.'
