summary_user: 농식품 공공데이터포털이 제공하는 시각화 자료마다 어떤 항목(컬럼 명)을 어떤 유형과 시각화 순서로 담는지 정리한 메타 정보로, 데이터 아이디·유형 아이디·시각화 순번·항목 순번별로 한 행씩 담으며 범위는 전국·비공간이다. 농식품 시각화 데이터를 가공하거나 시스템에 연계하려는 개발자·분석가가 '이 시각화 데이터셋에는 어떤 컬럼이 어떤 순서로 들어 있나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 같은 기관 시각화 데이터와는 데이터 아이디나 컬럼 명칭을 이름 기준으로 맞춰 연결해야 한다.
description_portal: 농림축산식품부에서 제공하는 본 데이터는 농식품 공공데이터포털에서 제공되는 시각화 자료의 항목 정보를 종합적으로 정리한 것입니다. 각 데이터셋에 포함된 품목분류, 품목명, 생산량, 귀촌인구, 개발일자, 연도별 수치 등 주요 통계 항목을 유형별로 분류하고, 시각화 순서 및 컬럼 명칭을 함께 제공합니다. 이를 통해 농식품 관련 시각화 데이터의 구조를 명확히 파악할 수 있으며, 데이터 분석, 가공, 시스템 연계 및 시각화 개발에 필요한 항목별 필드 정보를 일괄적으로 확인할 수 있습니다. 항목별 시각화 순번과 유형 아이디를 포함하여 다수의 시각화 지표가 정리되어 있어, 농림축산식품 관련 공공데이터 활용의 기반 자료로 기능합니다. 이 데이터는 시각화 항목의 메타 정보를 통합적으로 관리하기 위한 용도로 구축되었습니다.
