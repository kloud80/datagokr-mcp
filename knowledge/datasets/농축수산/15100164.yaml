description_portal: 데이터는 경기도 화성시 송산면에 소재한 휴경지에 대한 현황을 수록한 자료이다. 수록 항목은 조사 시기, 해당 필지 주소, 지목, 면적, 당해 연도의 현장조사 결과 등으로 구성되어 있으며, 농업활동이 중단된 유휴농지의 분포와 특성을 파악하는 데 목적이 있다. 본 자료는 농지이용 실태 점검, 농업 진흥 지역 관리, 경작 유도 정책 수립 등과 같은 행정업무 수행에 기초자료로 활용될 수 있다. 또한, 경작 가능성 평가, 토지 자원 효율화, 농촌 활성화 정책 설계 등 다양한 연구와 분석에도 활용이 가능하다. 화성시는 본 데이터를 통해 휴경지의 효율적 관리와 활용도를 제고하고, 지속 가능한 농업환경 조성에 기여하고자 한다.
