description_portal: '제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍다나스 데이터를 제공합니다.항목: 행정동코드, 행정동명, 피해유형, 피해 규모 등* 2019년 태풍 다나스로 인해 발생한 제주특별자치도의 자연재해 피해 현황을 행정동별로 세부적으로 정리한 공식 자료입니다.이 자료는 태풍으로 인한 피해 상황을 보다 정확하고 구체적으로 파악하며 효과적인 대응 방안을 마련하기 위해 공개되었습니다. 이를 통해 태풍 다나스의 영향 범위와 피해 정도를 분석할 수 있을 뿐 아니라, 향후 유사한 자연재해에 대비한 예방 대책과 재난 관리 정책 수립에도 중요한 참고 자료로 활용될 수 있습니다.* 활용 분야 : 재난 대응 계획 수립, 피해복수 우선순위 설정, 지역별 재난 취약성 분석 등"'
