description_portal: '○ 통계개요* 통계명 : 산림면적(임상별)* 통계종류 : 서울시 수목의 종류에 따른 산림면적 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 산림면적의 소유ㆍ임목별 현황을 조사ㆍ분석하여 산림정책 수립의기초자료로 활용하고, 산림자원의 관리보호 및 활용을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 해당기관 및 자치구 → 시도 → 산림청* 공표주기 : 정기(5년)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 산림의 임상별(입목지 및 무입목지) 면적 현황○ 용어설명* 입목지 : 교목의 울폐도가 30%이상인 임분 또는 ha당 일정본수 이상의 치수(침엽수1,200본, 활엽수 1,600본이상)가 고르게 생육하고 있는 임분으로 세분- 침엽수림 : 침엽수림의 수관점유면적 또는 입목본수 비율이 75% 이상인 임지- 활엽수림 : 활엽수림의 수관점유면적 또는 입목본수 비율이 75% 이상인 임지- 혼효림 : 침엽수와 활엽수의 수관점유면적 또는 입목본수의 비율이 각각 25%이상75% 미만인 임지* 무입목지 : 입목지 이외의 모든 임지로서 미입목지, 황폐지, 제지 등으로 세분- 미입목지 : 무입목지 중 지피와 수관의 총 피복도가 50%미만인 임지- 황폐지 : 지피와 수관의 총 피복도가 50% 미만인 임지- 제지 : 도로, 하천, 소택지, 고정방화선, 저목장, 암석지, 묘지, 방목지, 초지,광업용지, 군사시설부지 및 건물부지 등 임목 육성에 직접 사용되지 않는 임지'
