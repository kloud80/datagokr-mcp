description_portal: '국가해양관측망 관측소 현황해양수산부 국립해양조사원은 전국 연안과 해역에 해양관측망을 구축하여 바다의 높이 파도 바람 기온 등 해양 정보를 실시간으로 수집하고 있습니다 이 데이터는 관측소의 코드명 명칭 유형 위도 경도 영문명 등 기본 정보를 포함하며 바다누리 해양정보 서비스에서 수집된 자료를 기반으로 합니다관측소 유형조위관측소: 해수면 높이 측정종합해양과학기지: 조위 파고 기온 풍속 등 종합 정보 수집해양관측부이: 파도 수온 염분 등 해양정보 수집유관기관 해양관측부이: 타 기관 자료 공유활용 분야재난 예방 및 해양재해 대응선박 안전 운항 및 항만 운영어업 양식장 관리해양 환경 연구와 정책 수립관련 정보는 바다누리 해양정보 서비스 홈페이지에서 확인할 수 있습니다www.khoa.go.kr/oceangrid'
