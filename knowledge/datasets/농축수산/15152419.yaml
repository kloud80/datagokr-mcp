summary_user: 행정안전부가 재난안전데이터 공유플랫폼으로 제공하는 전국 농축산 피해우려 지역 목록으로, 지구명(DSTRCT_NM)·지번/도로명 주소·피해예상면적·피해량 같은 항목을 지역 단위 행으로 담는다. 지자체 담당자나 농업인이 '우리 마을 근처에 농축산 피해가 우려되는 지구가 있는가, 예상 피해 면적은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 동 코드·주소·지구명을 이름이나 코드로 매핑해 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 농축산피해우려지역 관련 데이터 정보입니다.
