summary_user: 농수축산물의 유통단계(산지·도매·소매)별 품목마다 거래단위 코드·명칭과 표준단위 간 매핑, 환산 단위 정보를 행 단위로 담은 전국 단위 기준표다. 서로 다른 단계의 가격을 같은 단위로 맞춰 비교하려는 분석가나 유통업자가 '도매 kg 가격과 소매 개당 가격을 어떻게 환산해 비교하나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 같은 기관의 유통가격 데이터와 품목코드(PUM_CODE)·단계코드·단위코드 이름이나 코드값을 맞춰 연결하며, KAMIS·도매시장·HS·KOSIS 품목코드와는 별도 매핑이 필요하다.
description_portal: 농수축산물에 대한 유통단계별(산지, 도매, 소매) 품목별 가격 정보를 동일 기준으로 재가공한 유통 통합 정보입니다. 이 데이터는 농수축산물이 거래되는 다양한 단계에서의 가격을 비교하고 분석하는 데 매우 유용합니다. 예를 들어, 연구자나 농업관련 종사자는 이를 통해 가격 동향을 파악하고 효과적인 판로 개척을 위한 전략을 수립할 수 있습니다. 또한, 소비자에게는 가격 정보를 제공하여 합리적인 구매 결정을 도와주는 중요한 역할을 합니다. 해당 API는 표준화된 거래단위와 가격 정보를 제공하여, 산지에서 도매, 소매까지의 가격 변동을 포괄적으로 이해할 수 있게 해줍니다. 이를 통해 효과적인 농수축산물 거래를 지원하고, 식품문화 관련 정책 수립 시 기초 자료로 활용되기도 합니다. API의 오퍼레이션은 농수축산물의 거래단위와 표준단위 간의 매핑관계, 거래단위 코드 및 명칭, 환산비율 등 다양한 정보를 제공합니다. 이 정보를 통해 사용자는 특정 품목에 대한 가격 흐름을 보다 명확히 이해할 수 있습니다.
