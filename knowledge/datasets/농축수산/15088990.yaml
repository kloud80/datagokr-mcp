summary_user: 산림복지서비스이용권시스템에서 추출한 기본제공정보로, 이용권을 신청·사용하는 시설과 기관단체(기관명·주소·기관구분)와 시설방문 상세(방문시설, 신청인원, 숙박형태, 체크인·체크아웃일자, 버스대수, 신청상태)를 건별로 담은 전국 범위 CSV 파일(약 55만 바이트)이다. 산림복지 정책 분석가가 이용권으로 어떤 시설에 언제, 몇 명이, 숙박형으로 방문했는지 같은 이용 실태를 사업년도별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 휴양림·치유의숲 시설 데이터와는 기관명·주소 같은 이름 매핑이나 같은 기관 코드(방문시설코드 등)로만 연결한다.
