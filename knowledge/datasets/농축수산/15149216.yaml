summary_user: 관측소별·관측일별로 최고·평균·최저 수온을 담은 집계 파일(CSV, 약 29KB)로, 범위는 전국 연안 관측소입니다. 양식 어가나 해양 행정 담당자가 특정 관측소의 최근 수온 변화를 보고 고수온 피해 위험을 가늠하는 데 쓴다. 전역 조인 키가 없어 관측소 한글명을 기준으로 다른 해양 관측 자료(조석·파고·특보 등)와 이름 매핑으로 연결해 쓴다.
description_portal: 이 데이터는 해양수산부에서 실시간평균수온에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일, 관측소한글명, 최고수온, 평균수온, 최저수온 데이터로 구성되어 있습니다.본 데이터는 실시간평균수온 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.실시간평균수온이란 현재 시점에서 여러 지점이나 시간대의 수온 관측 데이터를 종합하여 산출한 평균값을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
