description_portal: 해양생명자원통합정보시스템(MBRIS)은 해양유전자원 바이오뱅크를 운영하고 있습니다. 해양유전자원 바이오뱅크는 서식지 특이성, 접근성 한계, 채집기술의 제약 등으로 인해 확보가 어려운 해양생물 유전자원을 체계적으로 수집·보존·공유함으로써, 연구자들에게 안정적이고 다양한 연구소재를 제공하고 있습니다. 이를 통해 해양생물에서 유래한 유용 유전자원의 발굴을 촉진하고, 해양바이오산업의 경쟁력을 강화하는 데 기여하고자 합니다. 해양유전자원은 해양 생태계 및 생물의 생명현상을 이해하는 데 핵심적인 요소일 뿐만 아니라, 의약품, 건강기능식품, 화장품, 천연물 소재 등 다양한 산업분야의 원료로서 활용 가치가 매우 높습니다. 바이오뱅크는 이러한 자원을 표준화된 조건에서 보관·관리하여 연구 효율성을 높이고, 해양생물자원의 지속 가능한 이용을 위한 기반을 마련하고 있습니다. 이와 같은 활동은 국가 차원의 생물주권 확보와 생물다양성 보전에 있어서도 중요한 역할을 수행합니다.
