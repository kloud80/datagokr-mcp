description_portal: '본 데이터는 제주특별자치도 제주시에서 관리하는 관내 산림 및 자연휴양 권역 내 등산로 중, 폐쇄된 구간에 대한 현황 정보를 수록한 자료입니다. 산불 예방, 자연훼손 방지, 낙석 위험, 기상 악화, 야생동물 서식지 보호 등의 사유로 등산로 일부가 일시 또는 상시 폐쇄될 수 있으며, 이에 따라 구간별 개방 여부를 체계적으로 관리하고 있습니다.주요 항목관리기관: 해당 등산로를 관리·감독하는 행정기관 또는 부서산명(권역명): 등산로가 포함된 산의 명칭 또는 행정 권역 단위위치: 폐쇄구간이 포함된 상세 지점 또는 행정구역상의 위치등산로 노선번호: 노선 식별을 위한 고유 번호등산로 구간: 등산로 시작점과 종점 또는 주요 구간 구분개방여부: 해당 구간의 현재 개방 상태(예: 개방, 임시폐쇄, 상시폐쇄 등)이 데이터는 제주시 공원녹지과에서 관리합니다.'
