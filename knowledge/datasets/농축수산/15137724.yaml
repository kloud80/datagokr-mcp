summary_user: 쇠고기이력시스템에 등록된 소의 개체별 이력을 담은 건별 원천 파일로, 개체식별번호마다 소의 종류·성별·출생일자·귀표 부착일자·도축폐사일자·인공수정 여부 등을 기록하며 범위는 전국이다. 방역·가축위생 분석가가 브루셀라 검사 대상 개체의 출생·귀표 부착·도축 시점을 확인해 검사 관리 현황을 점검하는 데 쓴다. 개체식별번호(cattle_trace_no)를 키로 축산물 이력제 조회, 도축·등급판정 등 다른 소 이력 데이터와 이어 쓴다.
description_portal: 해당 데이터는 농림축산식품부에서 소브루셀라검사 관리를 위해 쇠고기이력시스템에 등록된 정보입니다. 주요 항목으로는 소의종류 코드, 종류, 성별코드, 성별, 출생일자, 귀표 부착일자, 도축폐사일자, 수정일자, 인공수정개쳬여부 등이 포함되어 있습니다. 이를 통해 소의 개체별 검사 내역과 관리 현황을 기록함으로써 축산물 안전성 확보, 질병 확산 방지, 방역 정책 수립 등에 활용될 수 있으며, 특히 가축위생관리 강화를 통한 소비자 신뢰 제고 및 축산업 경쟁력 확보에 기여할 수 있습니다. 다만, 이 데이터는 개인정보 및 민감정보가 포함되어 있어 일부만 제공되므로 사용에 유의 부탁드립니다.
