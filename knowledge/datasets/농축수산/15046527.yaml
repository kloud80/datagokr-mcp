description_portal: '통계개요* 통계명 : 농업기계 보유현황* 통계종류 : 서울시 농업용 기계보유 현황을 제공하는 일반·보고통계* 작성목적 : 농업기계의 보유량을 조사하여 농업기계의 개발, 수출, 정책 등의 기초자료로활용하기 위함* 조사체계 : 읍·면→ 시·군·구→ 시·도 → 농림축산식품부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 동력경운기, 농용트랙터, 동력이앙기, 관리기, 콤바인,스피드스프레이어곡물건조기, 농산물건조기 등 농업기계 보유현황○ 용어설명* 동력경운기 : 엔진이 탑재되어 있고 농작업을 수행할 수 있도록 주행장치가 2개의 바퀴로 구성되어 있어운전자가 보행하면서 작업하는 경운·정지용 농업기계* 농용트렉터 : 엔진이 탑재되어 있고 4륜이 부착된 승용형으로 운전자가 탑승하여 농작업을 수행하기 위한구조로 되어있는 경운·정지용 농업기계.* 스피드스프레이어(S·S기) : 과수원에서 농약을 살포하기 위해 만들어진 과수용 동력방제기* 동력이앙기 : 동력을 이용하여 모를 이앙하는 농기계* 관리기 : 밭의 경운, 원예작물 등의 관리작업을 주목적으로 하여 다양한 부속작업기를 부착 사용할 수 있음* 콤바인 : 주행하면서 곡식을 베는 일과 탈곡, 정선작업을 동시에 수행하는 수확, 탈곡겸용 농업기계* 곡물건조기 : 벼 또는 보리를 건조할 수있는 농업기계* 농산물건조기 : 버너의 열을 이용 고추, 담배 등 농산물을 건조할 수 있는 농업기계* 파종기: 동력을 이용하여 벼 이외 마늘, 당콩, 감자 등 종자를 파종하는 기계* 정식기: 배추, 고추, 양파, 고구마 등의 어린모를 농경지에 옮겨 심는 기계* 수확기: 벼 외의 땅속작물, 엽채류, 과실류, 사료작물 등을 굴취, 절단, 탈실 등의 방식으로 수확하는 기계* 농업용 멀티콥터: 파종, 시비, 방제와 농작물 생육상태 예찰 등을 위한 장비를 장착하여농산물 생산에 활용되는 농업용 멀티콥터(드론)'
