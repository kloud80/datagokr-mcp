summary_user: 전국 농수산물 산지공판장을 한 곳당 한 행으로 정리한 현황 파일로, 부류·소재지·주소·개장년도와 2019년도 거래실적(백만원), 국비·지방비·자부담 등 재원 구성, 대지·건물·경매장 면적, 지게차·냉장탑차·선별기 같은 물류장비 수, 경매사·중도매인·산지유통인 수를 담는다(약 8KB 규모의 CSV). 지역 유통 정책 분석가나 출하 농어민이 '어느 지역에 어떤 규모와 장비를 갖춘 산지공판장이 있고 거래 규모는 어느 정도인가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공판장 명칭이나 소재지·주소를 기준으로 이름 매칭해 이어 써야 한다.
description_portal: 도매시장 통계연보에 수립된 전국의 산지 공판장 현황 정보(소재지명,거래실적,물류장비,시설규모,유통주체현황 등)를 제공합니다.도매시장 통합 홈페이지를 통해 제공하고 있는 데이터 입니다.* 도매시장 통합 홈페이지:aT가 운영하는 전국 공영도매시장 경매정보 통합 플랫폼입니다. 서울 가락동을 비롯한 32개 도매시장의 경매 물량, 가격, 거래 현황을 실시간으로 제공하며, 출하자 신고, 전자송품장 처리, 유통 통계 조회 등 다양한 기능을 지원합니다. 농가와 중도매인, 소비자가 모두 활용할 수 있어 투명한 가격 형성과 유통 효율성 제고에 기여하는 대표적인 농산물 유통 정보 서비스
