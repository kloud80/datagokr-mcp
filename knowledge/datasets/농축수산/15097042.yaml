description_portal: 이 데이터는 제주특별자치도 가 공개한 ‘아프리카돼지열병(ASF) 검사 실적’에 관한 공공데이터로, 도내 양돈 농가를 대상으로 수행된 검사 건수, 검사 시점, 검사 대상 농가 및 가축 규모, 항원 또는 항체 검사 결과 등을 체계적으로 정리한 자료입니다. ASF는 매우 치명적인 돼지 전염병으로, 발생 시 축산업 전반에 심각한 영향을 미치고 가축 간 전파 위험이 높아 정부 차원에서 엄격히 관리됩니다.지식재산형성과제관리시스템+1 이 데이터는 제주 지역의 방역 관리 상태, 농가별 질병 감시 동향, 방역 정책의 실효성 평가, 양돈업 관리 계획 수립, 축산업 지속 가능성 분석 등 방역 및 축산 관리 전반에 중요한 기초 통계로 활용 가능합니다. 자료는 CSV 포맷으로 공개되며 누구나 무료로 다운로드 및 분석할 수 있도록 제공됩니다.
