summary_user: 도매시장 전자송품장을 바탕으로 도매시장·품목 대분류·중분류별로 출하 예측일자 기준 30일 이후까지의 예측 물량과 상한·하한 예측 물량, 전월 물량을 담은 전국 단위 예측 정보다. 산지 출하자나 도매 구매자가 '다음 달 특정 도매시장에 이 품목이 얼마나 들어올지'를 가늠해 출하·구매 시점을 정하는 데 쓴다. 도매시장 코드(whsl_mrkt_cd)와 품목 대·중분류 코드는 aT 농축수산물 표준코드 API에서 뜻을 확인해 같은 기관 데이터와 이어 쓰며, 실측상 기관 밖 데이터와 바로 맞물리는 전역 조인 키는 없다.
