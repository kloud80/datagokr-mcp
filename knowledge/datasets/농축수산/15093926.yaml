description_portal: 충청북도 증평군 길고양이 중성화관리카드 데이터는 지역 내 길고양이 개체 수 조절, 도시 생태계 보호, 시민 불편 해소 등을 목적으로 실시되는 TNR(Trap-Neuter-Return) 중성화 사업의 수행 내용을 기록한 관리카드 형식의 공공데이터입니다.이 데이터는 길고양이 포획-중성화수술-회복-방사의 전 과정을 체계적으로 기록하며, 각 고양이의 구조정보, 건강상태, 수술 여부, 처리 결과, 방사 장소 등을 포함합니다.중성화사업은 단순한 개체 수 조절을 넘어서 동물복지 실현, 공존 환경 조성, 지자체 반려동물 정책 고도화에 필수적인 행정기반입니다.
