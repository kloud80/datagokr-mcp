description_portal: 농림축산식품부에서는 가축 현황 정보정보를 제공합니다.본 정보 제공 데이터는 민원신청번호, 시설일련번호, 연관지번일련번호, 대장구분, 부번, 본번, 시설주소, 실제시설면적, 공부면적, 공부시설면적, 시설소유자, 공부지목, 토지검증여부, 대표지번구분, 축종일련번호, 축종명, 사육수량등의 정보를 포함하고 있습니다.본 제공자료는 가축사육시설에 대한 면적정보와 시설용지에 대한 지목, 사육하고있는 축종에 대한 정보를 보여주는 데이터 입니다.해당 자료를 통하여 읍면리 단위로 축종에 대한 사육수량 및 면적에 대한 자료로 활용 할 수 있습니다.(* 해당 데이터는 민감정보가 포함되어 있어 시설소유자의 이름 마스킹처리, 시설주소의 상세주소 미표기, 경영체 정보 미표기 등 일부 자료만 제공되므로 사용에 유의 부탁드립니다)
