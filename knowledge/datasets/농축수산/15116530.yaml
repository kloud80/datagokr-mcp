description_portal: 대전광역시 소 결핵 검진 현황 자료는 거래 또는 이동되는 12개월 이상 소를 대상으로 실시한 결핵병 검사 실적을 기록한 자료입니다. 소 결핵병은 만성세균성 질병으로, 주로 감염된 동물의 분비물이나 배설물과의 접촉, 호흡기를 통한 결핵균 흡입 등 다양한 경로로 전파됩니다. 이 자료는 검진 대상 두수, 양성 및 음성 판정 두수등 세부 항목을 포함하고 있어 지역 내 결핵병 발생 현황과 감염 위험도를 체계적으로 파악할 수 있습니다. 결핵병은 제2종 가축전염병으로 분류되어 있어 조기 발견과 신속한 방역 조치가 중요하며, 이 자료는 방역 정책 수립, 감염경로 분석, 축산물 안전성 확보, 농가 지원 정책 마련 등 다양한 분야에서 활용도가 높습니다.
legal_basis_portal: 농림축산식품부에서 실시하는 가축방역 사업 실시요령 및 결핵병 및 브루셀라병 방역실시요령
