description_portal: 전라남도 장흥군 관내 양식어업면허 현황 데이터는 지역 내 각 어장의 면허 정보를 종합적으로 제공한다. 주요 항목에는 패류·해조류 등 면허종류, 각 어장에 부여된 면허번호, 행정 처리 시점을 나타내는 처분일, 그리고 생산 대상 품종이 포함된다. 또한 바닥식·수하식 등 어업종류, 살포식·연승식 등의 양식방법, 어장 규모를 나타내는 면적(ha), 허가의 유효기간인 면허기간을 확인할 수 있다. 여기에 더해 해당 어장이 위치한 어장 위치와 어촌계·개인·협업 등 소유구분 정보를 제공하여, 지역별 양식 어업의 구조와 운영 현황을 한눈에 파악할 수 있도록 구성된다.
