description_portal: 본 데이터는 영광군 해역에서 연안개량안강망 방식으로 허가받아 운영된 어업의 연도별 건수를 제공합니다.개량안강망은 어류 포획 효율성이 높은 어구로, 허가 건수는 지역 수산자원의 활용 정도와 어업 환경 변화의 지표가 됩니다.2009년부터 2024년까지의 허가 데이터를 바탕으로 어업정책 변화, 자원 보존 효과, 업종별 분포 등을 파악할 수 있습니다.수산자원 보호와 지속가능한 어업 관리를 위한 정책 수립에 필요한 기초자료로 활용되며, 해양환경 연구에도 유의미한 자료입니다.어촌계, 어업인, 수산행정기관 등 다양한 이해관계자가 정책 결정과 지역 개발을 위한 기초정보로 활용할 수 있습니다.
