description_portal: '농림수산식품교육문화정보원 농업온 시스템의 영농가이드 추가 정보의 대한 데이터로서농림수산식품교육문화정보원 농업온 시스템의 영농가이드 추가 정보와 관련된 데이터로, 이 데이터는 정보번호, 영농작물번호, 정보유형코드, 정보내용, 정렬번호, 삭제여부, 등록일시, 수정일시 등의 다양한 항목을 포함하고 있습니다. 이러한 데이터는 농업 관련 종사자들에게 영농 가이드라인을 제공하고, 농작물의 특성이나 재배 방법에 대한 정보를 알려주는 데 중요한 역할을 합니다. 특히, 농업에 종사하는 분들이 쉽게 참고할 수 있도록 구성되어 있어, 영농 실천과 관련된 다양한 결정을 지원하는 유용한 자료로 활용됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 정보번호(숫자형) : 각 정보의 고유 식별번호입니다. 영농작물번호(숫자형) : 영농작물에 대한 고유 번호입니다. 정보유형코드(문자형) : 정보의 유형을 구분하는 코드입니다. 정보내용(문자형) : 영농과 관련된 구체적인 정보내용입니다. 정렬번호(숫자형) : 데이터의 우선순위나 정렬 순서를 나타냅니다. 삭제여부(문자형) : 해당 정보가 삭제되었는지 여부를 명시합니다. 등록일시(날짜형) : 정보가 등록된 일시를 나타냅니다. 수정일시(날짜형) : 정보가 수정된 일시를 나타냅니다.'
