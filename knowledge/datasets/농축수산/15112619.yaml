summary_user: 해양수산부가 3분 간격(3단계) 격자별로 분석한 해수 유동 정보로, 격자번호·분석일자·분석시간마다 위도·경도와 유향·유속을 담으며 범위는 전국 해역이다. 연구기관·관계기관이나 해양 사고 대응 담당자가 '특정 해역 격자에서 그 시각 해류가 어느 방향으로 얼마나 빠르게 흘렀나'를 확인해 해수 유동 모델링이나 연안 관리 분석에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 격자의 위도·경도 좌표로 다른 해양 관측 자료와 공간적으로 맞추거나 격자번호(gridCd)를 같은 기관 자료와 대조해 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 해수의 유동과 관련된 정보를 3분 간격(3단계)의 격자별로 제공하기 위해 수집한 데이터입니다.  격자번호, 분석일자, 분석시간 등 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 격자코드, 분석시간, 유향, 유속 등으로 구성되어 있습니다.   본 데이터는 연구기관이나 관계기관에서 해양 환경 변화 분석, 해수 유동성 모델링, 연안 관리 정책 수립, 해양 사고 대응 계획 수립 등 해수 유동 정보에 기반한 분석 및 정책 수립 등 활동을 위한 기초 자료로 활용될 수 있습니다.
