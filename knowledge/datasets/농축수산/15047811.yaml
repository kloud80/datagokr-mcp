summary_user: 경기도 부천시 관내 농지전용 허가(협의) 건을 필지 소재지 단위로 담은 파일로, 소재지·지목·전용면적·협의일자·전용목적을 건별로 기록하며 데이터기준일 시점 1년 현황이다(csv 약 1.4KB의 소규모 파일). 부천시에서 어떤 농지가 어떤 목적으로 얼마나 전용됐는지, 관심 필지 주변에 전용 사례가 있는지 확인하려는 농지 거래자·개발 사업자·분석가가 쓴다. 실측 컬럼에 PNU 같은 전역 조인 키가 없어 농업진흥지역·팜맵 필지 등 다른 농지 데이터와는 소재지 주소를 이름 매칭해 이어 써야 한다.
description_portal: 농지의 전용이란 농지를 농작물의 경작이나 다년생식물의 재배 등 농업생산 또는 대통령령으로 정하는 농지개량 외의 용도로 사용하는 것을 말합니다. 농작물의 경작지나 재배지에 설치하는 고정식온실, 버섯재배사, 비닐하우스, 축사 및 그 부속시설과 농지에 부속한 농막,간이저온저장고,간이퇴비장 또는 간이액비저장조의 설치 행위는 농지의 전용행위가 아니라 이용행위입니다. 농지법 제정(1996. 1. 1.~)으로 농지전용허가를 받는 등 농지를 전용한 경우에만 지목변경이 가능합니다. 해당 자료는 경기도 부천시 관내의 농지전용 허가(협의) 현황에 대한 데이터로 소재지, 공부지목, 전용면적(제곱미터), 협의구분, 전용목적 등의 정보를 제공합니다.* 데이터기준일 시점으로 1년 현황임.
