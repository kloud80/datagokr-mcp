description_portal: 본 데이터는 서울특별시 양천구에서 관내 축산가공업에 대해 처리한 인허가 정보를 체계적으로 정리한 자료이다. 축산물을 원료로 하는 가공업체의 인허가날짜, 사업장명, 주소, 전화번호, 영업상태, 업무구분, 총인원등의 항목을 제공하여 관련 법령 준수 여부와 영업 현황을 명확히 파악할 수 있도록 구성하였다. 각 업체의 기본 정보, 소재지, 허가일자, 처리구분, 관리자 의견 등을 포함하여 행정기관의 업무 투명성을 확보하고, 민원인과 일반 이용자가 필요한 정보를 신속하게 확인할 수 있게 한다. 또한 안전한 축산물 유통 환경 조성을 위한 지도점검 및 관리정책 수립의 기초 자료로 활용될 수 있으며, 지역 내 식품위생 수준 향상과 공공서비스 품질 제고에도 기여하는 데이터이다.* 축산가공업 -식육, 알, 원유 등을 가공하여 소시지, 전난분, 우유 등으로 판매하는 업소
