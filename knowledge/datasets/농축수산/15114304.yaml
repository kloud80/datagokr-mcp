summary_user: 연안관리법에 따른 연안통합관리 1차 지역계획 중 완료된 계획을 세부 구역 단위로 담은 파일로, 권역·계획구분·세부구역 내용·면적과 함께 현황·관리방향·지원·제한 내용, 관련 법률, 고시 연도·일자·번호를 전국 시군구 범위로 수록한다. 해상 개발이나 해상풍력 입지를 검토하는 사업자·분석가가 '이 시군구 연안이 어떤 관리구역으로 지정돼 무엇이 제한되는가'를 확인하거나 권역·구분별 면적 통계를 낼 때 쓴다. 전역 조인 키가 없어 시도명·시군구명(연안관리지역계획시군구명)이나 기관 자체 권역·구분 코드를 이름 매핑해 해양공간계획 용도구역 등 다른 해양공간 데이터와 이어 쓴다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 같은 기관 코드로만 연결된다. 완료된 1차 지역계획만 담으므로 이후 차수나 진행 중인 계획은 이 파일로 확인하지 않는다.
