summary_user: 한국수목원정원관리원 시드뱅크로 도입된 해외 종자 자원의 도입 이력을 도입번호 단위 건별로 담으며, 학명·국명·과·속, 수집국가, 도입경로, 도입일자, 도입수량과 단위, 자원 형태 등을 수록한다. 연구자나 종자 산업 관계자가 '특정 식물 종이나 속의 종자가 어느 나라에서 언제, 얼마나 국내로 도입됐는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학명(scnm)이나 과·속 이름 같은 이름 매핑으로만 연결한다.
limits: 표준 코드나 공통 식별자가 없어 다른 생물자원·식물 데이터와 정확히 결합하기 어렵고, 이름 일치에 의존해야 한다. 범위는 전국 단위의 비공간 데이터라서 좌표나 지역 단위 분석에는 쓸 수 없다. 개발계정은 하루 10,000회까지 호출할 수 있다.
