description_portal: 본 데이터는 해외 생물유전자원의 도입 경로를 명확히 하고 국가 간 자원 협력 및 연구 기반을 확충할 목적으로 한국수목원정원관리원 시드뱅크로 도입되는 종자 자원 전체의 수집 및 수입 이력을 제공하는 정보입니다. 도입번호와 뱅크번호 등 고유 식별자와 함께 도입학명과 도입국명 및 도입국가명 정보를 수록하여 자원의 원산지와 분류 체계를 명확히 규정하고, 수입일자와 수입처 및 도입수량과 수집자 등의 세부 이력 데이터를 체계적으로 관리합니다. 해외 유전자원의 접근 및 이익공유 관련 기준을 준수하고 국가 종자 자산의 유입 경로를 투명하게 관리하며 관련 연구 및 산업 인프라 구축에 활용됩니다.
