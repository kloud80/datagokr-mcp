summary_user: 유기농업자재로 공시된 농약 자재를 자재 1건 단위로 담은 원천 목록으로, 공시번호·상표명·자재명·적용 작물과 병해충·회사·유효기간·지정상태·주성분 함량·사용적기·사용량·사용방법을 전국 범위로 담는다. 유기농 농가나 연구자가 '특정 작물의 특정 병해충에 쓸 수 있는 공시 유기농업자재는 무엇이고 언제 얼마나 쓰나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 작물명·병해충명·회사명 같은 이름 매핑으로만 잇는다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 병해충 및 유기농업자재 작용 기작에 매칭된 유기 농업 자재 농약 데이터입니다. 이 데이터는 유기농업을 진행하는 농업인 및 농업 관련 연구자들에게 매우 중요한 정보로, 해당 자재의 효능이나 작용 기작에 대한 상세한 정보를 제공합니다. 특히 병해충의 종류와 유기 농업의 친환경적인 특징을 고려한 데이터를 수집하여, 다양한 유기농 자재가 병해충 방지에 어떻게 기여하는지를 설명합니다. 이를 통해 농업인들은 효과적이고 안전한 방법으로 병해충을 관리할 수 있으며, 지속 가능한 농업 실천에 기여할 수 있습니다. 또한, 이 데이터는 학술 연구에도 활용될 수 있어, 유기농업의 발전을 위한 기초 자료로 자리잡고 있습니다. 그로 인해 유기농업의 성공적인 정착과 확산에 중요한 역할을 하게 됩니다
