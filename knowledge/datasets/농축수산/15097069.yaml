description_portal: 이 데이터셋은 제주특별자치도가 집계한 “축종별 농가 현황”을 나타내며, 가금류, 소, 돼지 등 주요 축종별로 농가 수(농장 수)와 사육 두수가 어떻게 분포되어 있는지를 정리한 공공데이터입니다. 해당 자료는 제주지역 축산업의 규모와 구조를 파악할 수 있도록 설계되었으며, 축산농가 현황 분석, 축산 정책 수립, 축산업 동향 파악, 공급망 분석, 지역 농업 연구 등에 활용될 수 있습니다. 또한 농가 분포 특징과 축종별 산업 비중을 한눈에 비교할 수 있어 행정계획 수립이나 산업 변화 모니터링에도 효과적입니다. 데이터는 CSV 형식으로 공개되어 있으며, 별도 인증이나 비용 없이 누구나 다운로드하여 활용할 수 있습니다.
