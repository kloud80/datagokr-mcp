description_portal: '20년 9월부터 26년 6월까지 바다 내비게이션* 설치 선박에 제공된 전자해도 구역버전 정보를 제공합니다.* 바다 내비게이션은 선박에 장착하는 이내비게이션(e-navigation) 장비를 말하며 "지능형해상교통정보법"에 따라 21년 1월 30일 이후 건조되거나 외국으로 부터 수입되는 선박(어선, 일반선박, 모터보트 및 세일링 요트)은 해당 단말기(장비)를 의무적으로 장착해야합니다.해당 해도정보는 국립해양조사원 항행통보(Notice to Mariners, NM) 주차별(WK) 업데이트 사항을 연계하여 제공하여 단말기를 설치한 선박은 본선이 항해하는 항로의 해도정보를 주기적으로 업데이트하여안전항해에 활용 가능합니다.제공 자료의 공란의 경우 해당 주차(WK)의 개정사항이 없음을 의미하며 주차(WK) 뒤의 숫자 두 자리(00)는 해당 연도의 00번째 주, 그 뒤 두자리(00) 은 해당 주에 발행된 항행통보(Notice to Mariners, NM) 중 00번째 항목임을 의미합니다.예시) WK39-23: 39주차의 23번째 항행통보'
