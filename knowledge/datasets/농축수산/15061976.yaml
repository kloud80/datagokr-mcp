summary_user: 한국산림복지진흥원이 운영하는 숲체험원·숲치유원·숲추모원 등 소속기관의 기관명, 연락처, 지번·도로명 주소, 위도·경도(WGS84), 법정코드를 기관 한 곳당 한 행으로 담은 전국 단위 소규모 목록 파일(csv 약 2KB)이다. 산림복지시설을 이용하려는 국민이 '가까운 숲치유원이 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 산림복지시설의 지역 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 법정코드·좌표를 매개로 행정구역·공간 단위로 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 산림복지서비스를 이용하고자 하는 수요자를 위하여 한국산림복지진흥원이 운영하는 숲체험원, 숲치유원, 숲추모원의 연락처 및 위치정보를 제공하는 자료입니다. 주요 항목으로는 기관, 연락처, 구주소, 도로명주소, 위도, 경도, 법정코드 등이 포함되어 있습니다. 해당 위치정보는 WGS84좌표체계를 기반으로 하고 있으며, 산림복지시설 이용 희망자들이 보다 쉽게 기관을 찾고 접근할 수 있도록 도움을 주는 중요한 기초정보로 활용될 수 있습니다. 또한 산림복지시설 분포 및 접근성 분석, 시설 운영 정책 수립 및 대국민 안내시스템 구축 등 다양한 분야에서 활용될 수 있는 실용적인 데이터입니다.
