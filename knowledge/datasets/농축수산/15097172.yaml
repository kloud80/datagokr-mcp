summary_user: 2021년 제주 지역 고품질 감귤 농가에서 주별로 측정한 과실 당도와 크기를 농가·과수 단위로 담은 CSV 파일(약 84만 바이트)이며, 측정월·측정주·측정일과 과수별 평균당도·평균크기가 행마다 기록된 원천 측정값이다. 감귤 농가나 농업 분석가가 수확철에 주차별로 당도가 어떻게 오르고 농가마다 품질 차이가 얼마나 나는지 확인하는 데 쓴다. 농가키(jdc_citrus_farm_key)가 조인 키로 확인되어 같은 키를 쓰는 JDC 감귤 농가 데이터와 이어 쓰며, KAMIS 품목코드 같은 가격 데이터용 코드는 없어 유통 가격 자료와 바로 연결되지 않는다.
description_portal: 이 데이터는 2021년 제주 지역 내 고품질 감귤 농가에서 주별로 측정한 과실당도 정보를 포함하고 있습니다. 항목은 구분 번호, 대상 아이디(10자리 숫자), 당도키, 농가키, 측정월(OCT-21 형식), 측정주, 측정일(YYYYMMDD 형식), 과수번호, 평균당도, 평균크기로 구성되어 있습니다. 평균당도와 평균크기는 모두 소수점 아래 둘째 자리까지 표기되어 있으며, 이를 통해 감귤의 품질 및 생육 상태를 주 단위로 정밀하게 분석할 수 있습니다. 본 데이터는 농가별 품질 관리, 시기별 품질 변화 추적, 지역 간 비교 등 다양한 농업 데이터 분석에 활용될 수 있습니다.
