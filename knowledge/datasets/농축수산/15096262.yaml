summary_user: 국립농산물품질관리원이 관리하는 농축산물 원산지 인증 정보를 인증 건별로 담으며, 인증번호·최초 인증일자·인증 유효기간·인증업체명·제품명·원산지·원료 비율·인증기관으로 구성되고 범위는 전국(비공간)이다. 식품 구매자나 유통·가공 사업자가 특정 업체·제품이 원산지 인증을 받았는지, 인증이 아직 유효한지와 원료 원산지·비율이 어떤지를 확인하는 데 쓰고, 분석가는 인증기관별·업체별 인증 현황 집계에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·제품명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 원산지인증 제도는 농업과 식품산업 간 연계발전을 도모하고 농산물을 원료로 가공하고 조리한 식품의 원산지에 대한 신뢰 강화를 위해 운영하는 제도로 본 정보는 국립농산물품질관리원에서 관리하는 농축산물 원산지 인증 정보로서, 인증번호, 최초 인증일자, 인증 유효기간, 인증 업체명, 제품명, 원산지, 비율, 인증기관 항목으로 구성되어 있습니다. 인증기관별 원산지인증현황, 원료 점ㅇㅍ 비율별 원산지인증현황, 인증업체별 원산지인증현황 등 통계자료를 활용하여 각종 보고서 작성 등에 활용이 가능할 것으로 기대됩니다.
