description_portal: <데이터 수집 목적 및 과정> 경상남도 소재 허가받은 도축업에 대한 데이터를 제공하여 필요한 정보를 유용하게 사용할 수 있습니다. 원료 축산물을 생산하는 도축장은 경상남도의 허가 업종으로 HACCP적용 의무 작업장이며, 도축 검사관 및 검사원들의 철저한 위생감시와 안전성검사를 통해 소비자에게 안심하고 믿을 수 있는 식육을 공급하는 것을 목표로 하고 있습니다.<데이터 구성 및 세부항목> CSV파일로 제공되는 데이터는 “시군명, 도축장명, 가축의 종류, 영업장 주소, HACCP지정여부, 영업여부” 로 구성되어 있으며, 해당 링크를 통해 접속하면 데이터를 조회 및 다운로드 할 수 있습니다.
