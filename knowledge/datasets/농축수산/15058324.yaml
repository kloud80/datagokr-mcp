summary_user: 전국 농촌마을(포털 설명상 2,600여 곳)별로 마을 식별번호·마을명과 함께 연계자원 목록, 자연·경제·문화·공동체 자원 설명과 이미지 주소를 마을 한 건씩 담는다. 농촌체험 관광을 계획하는 여행자나 귀농 희망자, 마을 활성화 정책 담당자가 '이 마을에 어떤 관광·문화·교육 자원이 연결돼 있는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 같은 기관의 다른 농촌마을 정보 API와는 마을 식별번호(VILL_ID)로, 그 밖의 데이터와는 마을명이나 지역명을 맞춰서만 이을 수 있다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 이 API는 전국의 2,600여 개 농촌 마을에 대한 풍부한 정보를 담고 있습니다. 농촌 마을의 기본 정보인 마을명과 마을 유래는 물론, 귀농 현황, 인구 현황, 주택 현황 등의 다양한 농촌 마을 현황 정보를 포함하고 있습니다. 이 데이터는 매 2년마다 갱신되어 최신 정보를 유지하며, 관련 연구 및 정책 수립에 활용될 수 있습니다. 특히, 이 API는 농촌 체험 관광과 마을 활성화를 위한 중요한 자료로 작용할 수 있으며, 마을과 연계된 관광자원, 문화자원, 교육자원의 정보도 함께 제공합니다. 사용자는 이러한 정보를 통해 각 농촌 마을의 특성을 이해하고, 귀농 및 투자에 대한 참고자료로 활용할 수 있습니다. 또한, 농촌 마을별 연계자원 정보 조회 기능을 통해 각 마을에서 제공하는 자원들의 상세 정보를 손쉽게 검색할 수 있습니다.
