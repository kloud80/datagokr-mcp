summary_user: 전국 공영 농수산물 도매시장의 법인별 연간 거래량(톤)과 거래금액(백만원)을 시장명·법인명 단위로 정리한 집계 자료이며, 활용신청 없이 받는 작은 CSV 파일(약 4.9KB)입니다. 유통 분석가나 산지 출하자가 어느 도매시장과 도매법인의 거래 규모가 큰지 비교할 때 씁니다. 전역 조인 키가 없어 시장명·법인명을 이름으로 맞춰 KAMIS 도매·경락가격이나 반입물량 자료와 이어 씁니다.
description_portal: 전국 공영 농수산물 도매시장의 정보(도매시장명, 건물규모, 부지규모) 및  법인별 거래금액(백만원) 및 거래물량(톤) 실적 자료입니다.<기본 안내사항>1. 본 데이터는 농수산물유통 및 가격안정에 관한 법률 제17조, 제47조에 의거 개설ㆍ운영되고 있는 농수산물 도매시장을 대상으로 각 시ㆍ도에서 보고한 자료와 유관기관에서 보유하고 있는 자료를 정리하였습니다.2. 자료의 생산에 있어서 기간(期間)을 요하는 자료는 "23. 1. 1 ~ "23.12.31까지의 실적을, 시점(時點)을 요하는 자료는 "23.12.31를 기준으로 작성하였으며, 통계수치는 반올림에 따라 세목(稅目)과 합계란의 수치가 일치하지 않는 경우도 있습니다.3. 데이터에서 “ － ” 부호는 실적이 없거나 확인이 불가능한 경우를 의미합니다.4. 거래실적 표는 기본적으로 상장(법인 및 공판장) 거래실적, 상장예외 거래실적, 시장도매인 거래실적을 모두 포함하고 있습니다.
