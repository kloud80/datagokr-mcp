summary_user: HSK 품목별로 한글·영문 품명, 2014년 실행세율, 칠레·싱가포르·EFTA(스위스·노르웨이·아이슬란드)·아세안·인도·EU·페루·미국·터키·콜롬비아 등 FTA 상대국별 협정세율과 개방구분을 담은 전국 단위 품목표입니다. 농축산물 수출입 기업이나 분석가가 'HS 코드 기준으로 이 품목을 미국산이나 EU산으로 들여오면 일반 실행세율 대비 관세가 얼마나 낮은가'를 확인하는 데 씁니다. 전역 조인 키가 없어 HSK 코드나 품명으로 다른 무역·관세 자료와 매핑해 잇고, KAMIS 가격 자료와는 품목코드 체계가 달라 별도 매핑표를 거쳐야 합니다.
description_portal: 해당 데이터는 농축산물 FTA 협정세율 현황 관련 자료로, 우리나라와 FTA를 체결한 국가들과의 협정세율 정보를 제공합니다. 대상 국가는 칠레, 싱가포르, EFTA, 아세안, 인도, EU, 페루, 미국, 터키, 콜롬비아, 캐나다, 호주, 베트남, 중국, 뉴질랜드, 중미, 영국, 인도네시아, 이스라엘, RCEP 등입니다. 제공 목록으로는 HSK, 한글 품명, 영문 품명, 국가별 협정세율 등이 포함되어 있습니다. 이를 통해 농축산물 수출입 기업은 이 자료를 활용해 비용 절감 전략을 세우고 가격 경쟁력을 확보할 수 있습니다. 또한 정책 당국은 이 데이터를 기반으로 무역 동향을 분석하고, 국내 농업 보호와 해외 시장 개척을 균형 있게 추진하는 정책 수립에 활용할 수 있습니다.
