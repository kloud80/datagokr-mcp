description_portal: 해당 데이터는 전국 학교급식 농산물 및 친환경농산물의 품목별 취급 규모를 추정한 자료로, 농산물 및 친환경농산물 공급실적 대상 품목은 국립농산물품질관리원 친환경농산물 인증통계에서 관리하는 62개 품목으로 설정하였습니다. 이를 통해 학교급식에 활용되는 일반 농산물과 친환경농산물의 공급 현황을 비교·파악할 수 있으며, 지역별·품목별 수급 구조를 객관적으로 이해할 수 있습니다. 본 자료는 교육부와 농림축산식품부 등 정책 담당자에게는 학교급식 정책 수립, 친환경농산물 유통 지원, 지역 단위 공급 계획 마련의 근거 자료로 활용될 수 있고, 농업인과 산지유통조직에게는 안정적인 판로 확대를 위한 전략 수립에 도움이 됩니다. 또한 연구자에게는 친환경 급식 도입 효과와 농산물 소비 구조 변화를 분석할 수 있는 실증 자료로 의미가 있으며, 나아가 본 데이터는 친환경농업 활성화, 학생 건강 증진, 지역 농산물 소비 촉진을 동시에 지원하는 중요한 기초자료라 할 수 있습니다.
