summary_user: 전국 무인도서를 한 섬(관리번호) 단위로 담은 건별 정보로, 섬 이름·소재지(시도~리·지번)·위경도·토지 소유 구분과 국유·공유·사유지 면적·지목·육지와의 거리·영해기점 여부·무인도서 및 주변해역 관리유형·지정고시일을 제공한다. 해양공간 입지를 검토하는 분석가나 사업자가 '특정 시군구 앞바다 무인도 중 개발이 제한되는 관리유형이나 영해기점 섬이 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도·시군구·읍면동 이름이나 지번, 위경도로 행정구역·해양용도구역 등 다른 해양공간 데이터와 맞춰 이어 써야 한다.
description_portal: 이 데이터는 해양수산부에서 전국 및 지역별 무인도서와 그 주변 해역의 보전 및 관리를 위해 구축된 정보를 다른 시스템에서 연계·활용할 수 있도록 제공하기 위해 수집한 데이터입니다.도서명, 시군구코드, 무인도서 관리유형 등 입력 파라미터를 이용하여 데이터를 호출하실 수 있으며, 본 데이터의 주요 내용은 무인도서의 명칭, 위치, 면적, 관리 유형, 주변 해역의 환경 정보 등으로 구성되어 있습니다.본 데이터는 해양 환경 연구, 생태계 보전 정책 수립, 해양관광 개발 계획 수립, 해양 재난 대응 전략 마련 등에 활용될 수 있습니다.
