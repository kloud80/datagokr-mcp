summary_user: 농림사업정보시스템에 등록된 농업경영체의 관외경작 조사 결과를 농지 단위로 담은 파일(csv, 약 36KB)로, 등록된 실제농지·휴경·폐경 면적과 조사로 확인한 면적, 경작 여부·공동경작 여부를 조사 연도별로 함께 싣는다. 농지·농업경영체 정책 분석가가 "관외 농지에서 등록 면적과 실제 조사 면적이 얼마나 다르고, 휴경·폐경은 어느 정도인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으며, 개인·조사·농지 일련번호는 내부 식별용이라 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 농림사업정보시스템에 등록된 농업경영정보의 관외경작 조사 결과를 제공하는 자료입니다. 이를 통해 지역 간 토지 이용 현황을 파악할 수 있으며, 농업인이 실제 경작하는 토지와 등록정보 간의 일치 여부를 확인하여 제도 운영의 투명성과 신뢰성을 높이는 데 기여합니다. 또한 관외경작 비중이 높은 지역이나 특정 작목의 재배 특성을 분석할 수 있어, 향후 농지관리정책이나 농업경영체 등록 제도의 개선 방향을 마련하는 데 활용할 수 있습니다. 나아가 농업정책 수립 시 지역 간 토지 이용 불균형을 해소하고 효율적인 농지 활용을 도모하는 기초자료로서 정책적 가치가 큽니다.
