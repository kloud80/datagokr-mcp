summary_user: 전국 기본수준점(해양조사 때 수심과 간조노출지 높이를 재는 기준점)을 한 점씩 담은 목록으로, 명칭·번호·위도/경도·설치자·재질과 평균해수면(MSL)상·기본수준면(DL)상 높이를 담는다. 해양토목공사 설계자나 연안개발 분석가가 '공사 지점 가까운 기준점의 평균해수면 대비 높이는 얼마인가'를 확인하는 데 쓴다. 기준점 번호(tidal_benchmark_no)를 키로 다른 수준점·조위 자료와 잇고, 위도/경도 좌표로 해도·연안 공간 데이터와 위치 기준으로 겹쳐 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 기본수준점(해양조사시 해양의 수심과 간조노출지의 높이를 측정하기 위해 정한 기준점) 관련 정보 제공을 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 기본수준점의 명칭, 위도/경도, 수준점 설치자, 기준점 재질 및 평균해수면(MSL)상과 기본수준면(DL)상 정보로 구성되어 있습니다.  본 데이터는 해양토목공사 계획과 시공, 해도 제작, 항로설정, 해상교통안전관리, 해양환경 연구, 연안지역 개발 관련 사업 등에서 해양 기준점 정보 활용이 필요한 업무에 활용될 수 있습니다.
