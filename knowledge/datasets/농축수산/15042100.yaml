description_portal: 산림청 국립산림과학원에서 제공한 주요 산림병해충 발생상황 및 천적 밀도 등 기초 자료로, 조사야장명, 조사년도, 세부조사야장, 관련 파일 등을 제공하고 있습니다.국내 산림에서 발생하는 주요 병해충의 발생 현황과 천적 밀도 등 방제 및 생태관리를 위한 기초 자료를 체계적으로 정리한 조사기록입니다. 이 데이터는 조사야장명, 조사년도, 세부조사야장명, 조사구역 정보, 관련 문서 및 파일 등을 포함하며, 병해충의 발생 시기, 밀도, 피해 정도, 생물학적 방제 대상 천적 정보 등을 현장 중심으로 수록하고 있습니다.본 자료는 병해충 확산 예측, 방제 전략 수립, 병해충 모니터링 체계 강화, 생물다양성 분석 등에 활용됩니다.
