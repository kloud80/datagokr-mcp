  - 연안관리 시설물
summary_user: 연안정비사업으로 준공된 시설물을 건별로 담으며, 시설현황(착공·준공일자, 규모, 상태)과 보수·보강 이력, 피해 점검 이력, 시설물 이미지, 일반현황을 5개 오퍼레이션으로 나눠 제공하고, 범위는 전국·개별 시설 단위다. 지자체·연안관리 담당자나 연구자가 '특정 연안정비 시설물이 언제 준공됐고 이후 어떤 보수·보강 공사와 피해 점검을 거쳤는가'를 확인하고 점검 계획을 세우는 데 쓴다. 오퍼레이션끼리는 연안정비사업개요번호(cimpBsnsSmrNo)·시설물번호·사후관리번호로 이어 붙이지만, 다른 데이터셋과 공유하는 전역 조인 키는 없어 외부 데이터와는 시설물명·위치 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 연안정비 관련 준공시설물 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 준공시설물의 시설현황, 보수/보강 이력, 시설물 이미지 정보, 시설물 피해 이력, 시설물 일반현황 조회에 따라 시설물 준공연도, 사업구분, 시설물 위치 등 정보로 구성되어 있습니다.  본 데이터는 연안정비사업의 완료 지점 및 시설물 분포 현황을 확인하거나, 준공 연도별 시설물 관리 및 점검 계획 수립, 지역별 연안정비사업 이력 파악, 법적 고시 현황 확인 등 연안 관리 및 행정 업무, 연구 자료로 활용될 수 있습니다.
