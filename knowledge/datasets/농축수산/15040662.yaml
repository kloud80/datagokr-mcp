description_portal: 충청남도 미더유 인증식당 현황 데이터는 도내 농산물 및 국내산 농산물을 활용해 음식을 만드는 우수 식당을 선정하여 제공하는 자료다. 지역 농산물 소비 촉진과 농가 소득 증대를 위해 운영되는 ‘미더유’ 농가식당 인증제를 기반으로, 인증을 받은 업체의 식당명, 소재지, 업종, 주요 메뉴, 인증일자 등 핵심 정보를 포함한다. 이를 통해 지역 농산물 활용도가 높은 식당의 분포와 특성을 파악할 수 있으며, 지역 음식문화 활성화, 로컬푸드 정책, 외식산업 품질 향상 등에 활용된다. 또한 공공데이터 이용자에게는 충남의 농가식당 인증 체계와 지역 농산물 활용 현황을 이해할 수 있는 기초자료로 제공된다.
