summary_user: 국립자연휴양림의 시설(상품)별 면적·위치(위도·경도)·주소·성수기/비수기 주중·주말 단가·주차 가능 대수를 담은 건별 원천 파일로, 전국 2,219행이다. 휴양림 이용객이 지역별로 시설과 요금을 비교해 어디를 예약할지 정할 때나 분석가가 휴양 시설 분포를 볼 때 쓴다. 상품위치 위·경도(coord)와 주소(address)를 키로 삼아 다른 산림 복지·휴양 데이터나 지도·지역 자료와 이어 쓰며, 시설코드 같은 별도 식별자 키는 필드에 없다.
description_portal: 국립자연휴양림의 주요 및 부대시설에 대한 면적, 위치(위도·경도), 설명, 이용 가능 여부, 주소, 성수기·비수기·주말·평일 단가, 지역, 홈페이지 등 다양한 정보를 종합적으로 제공합니다. 각 시설의 상세 정보와 요금, 주차 가능 대수, 숙박 가능 여부, 캠핑장 운영 현황, 주변 관광지와의 연계성, 교통 접근성 등도 포함되어 있어, 이용자들은 휴양림 선택과 예약, 여행 계획에 참고할 수 있습니다. 또한, 시설 운영 및 관리, 정책 수립, 관광 활성화, 이용자 맞춤형 서비스 개발, 지역 경제 활성화, 환경 보전 활동 지원 등 다양한 분야에서 활용됩니다. 데이터는 정기적으로 갱신되며 최신성을 유지하여 공공데이터 활용에 기여합니다.
