summary_user: 경기도 내 농산물 산지유통센터(APC)를 시설 1곳당 1행으로 정리한 현황 목록으로, 운영 단체명, 도로명·지번 주소, WGS84 위도·경도, 주요 취급 품목을 담는다. 농산물 유통업자나 지역 정책 분석가가 "특정 품목을 선별·포장·출하하는 산지유통센터가 경기도 어느 시군에 있나"를 찾거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표로 공간 결합하거나 품목명을 KAMIS 등 가격 데이터의 품목코드에 직접 매핑해 이어 쓴다.
description_portal: '이 데이터는 경기도 내 농산물 산지유통센터(APC: Agricultural Products Processing Center)의 운영 현황을 정리한 자료로, 각 단체의 명칭, 소재지(도로명주소 및 지번주소), 좌표정보, 주요 취급 품목 등을 포함하고 있습니다. 산지유통센터는 농산물의 선별, 저장, 포장, 출하 등의 기능을 수행하는 지역 농산물 유통의 핵심 인프라로, 생산자 단체와 협동조합 중심으로 운영됩니다. 이 자료는 농산물의 공급 체계 분석, 유통 효율성 평가, 지역별 생산-유통 연계 강화 방안 수립 등에서 기초자료로 활용되며, 로컬푸드 활성화, 신선식품 물류 혁신, 농가소득 안정화를 위한 정책 설계에도 유용합니다.'
