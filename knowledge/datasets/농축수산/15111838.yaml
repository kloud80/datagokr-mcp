summary_user: 고창군 안의 장어 양식업체(양만장)를 사업장 한 곳당 한 행으로 정리한 목록 파일로, 사업장 이름·지번주소·전화번호·데이터기준일자를 담는다. 고창군에서 장어를 양식하는 곳이 어디에 몇 곳 있는지, 특정 양식장의 연락처가 무엇인지 확인하려는 주민·유통업자·지역 수산 현황 분석가가 쓴다. 공통 조인 키나 면허·허가번호가 없어서 다른 어업 허가·면허 원장과는 사업장 이름이나 주소를 직접 맞춰 보는 방식으로만 연결한다.
description_portal: 전북특별자치도 고창군의 "양만장(장어양식업)" 데이터는 고창군 내 장어 양식업체들의 정보를 정리한 자료로, 각 사업장의 명칭, 주소, 연락처 등 기본 정보를 포함하고 있습니다. 이 데이터는 고창군의 수산업 현황을 파악하고, 장어 양식업의 운영 실태를 이해하는 데 활용됩니다. 또한, 해당 정보는 수산업 정책 수립, 장어 양식업의 발전 방향 모색, 지역 경제 활성화 및 일자리 창출을 위한 기초 자료로 활용될 수 있습니다. 이 데이터는 공공데이터포털에서 무료로 제공되며, CSV 형식으로 다운로드하여 활용할 수 있습니다.
