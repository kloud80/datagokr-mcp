summary_user: 어선거래시스템에 올라온 매물 게시물을 한 건씩 담은 원천 목록으로, 게시물별 등록일·어업유형·소재지역·총톤수·조회수를 전국 범위로 담는다(CSV 약 8.7KB). 어선을 사고팔려는 어업인이나 분석가가 '어떤 어업유형·톤수의 어선 매물이 어느 지역에 많이 나오는가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 어선번호·허가번호 원장과 직접 잇지 못하고, 소재지역 이름이나 어업유형 이름을 매핑해야만 다른 어업 허가·어선 등록 자료와 연결된다.
description_portal: 이 데이터는 해양수산부에서 어선거래시스템 내 저장 구조 등 파일과 관련된 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 어선거래시스템에 등록된 게시물의 순번, 등록일자, 어업유형, 소재지역 및 총톤수 등의 정보로 구성되어 있습니다.  본 데이터는 어선 거래, 등록, 관리 이력 등과 관련된 행정 처리 문서 또는 거래 관련 증빙 자료의 보관 및 관리에 활용될 수 있습니다. 또한, 어선 소유권 이전, 등록 절차, 거래 기록 분석 등 어선관련 업무 지원을 위한 기초 데이터로 사용될 수 있습니다.
