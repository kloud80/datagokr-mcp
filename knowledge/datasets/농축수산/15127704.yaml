summary_user: 어촌뉴딜300사업으로 2019~2022년에 선정된 대상지를 한 곳씩 담은 파일로, 대상지명·주소·총사업비·입지여건·기항지 유무·선도사업·리빙랩·체험마을 정보를 전국 범위에서 개별 주소 단위로 담는다. 정책 분석가나 지자체 담당자가 '우리 시군구에 선정된 어촌뉴딜 대상지는 어디이고, 사업비는 얼마이며, 체험마을이나 리빙랩이 있는가'를 확인할 때 쓴다. 신청번호(newdeal_app_no)를 조인 키로 같은 사업의 다른 현황 데이터와 잇고, 시군구코드와 주소로 행정구역 단위 통계나 지도와 맞춰 쓴다.
description_portal: 이 데이터는 해양수산부의 어촌뉴딜300사업 대상지의 일반현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 2019년부터 2022년까지 선정된 어촌뉴딜300사업 대상지명, 주소, 총사업비, 입지여건, 기항지유무, 선도사업, 리빙랩, 체험마을 및 주소 등 정보로 구성되어 있습니다.본 데이터는 어촌지역 개발과 관련한 사업의 진행 현황을 체계적으로 분석하고, 어촌 인프라 개선이나 정책 평가 자료로 활용할 수 있습니다. 또한 앞으로의 어촌뉴딜사업 추진을 위한 배경 자료 및 어촌지역의 투자계획 수립 등에 참고자료로 활용될 수 있습니다.
