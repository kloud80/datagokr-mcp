description_portal: 산림청이 운영하는 산림사업법인관리시스템에 등록된 목재생산 관련 업종에 대한 시군구별 현황을 정리한 공공데이터입니다. 본 자료는 원목생산업, 목재수입유통업, 제재업 등 주요 목재생산업체들을 지역별로 구분하여 체계적으로 수록하고 있으며, 각 업체의 등록번호, 상호, 주소, 업종유형, 등록일자, 관할 행정기관 등을 포함하고 있습니다. 이를 통해 국내 목재산업의 지역별 분포와 등록 현황을 한눈에 파악할 수 있으며, 목재 자원의 생산 및 유통 흐름을 관리하고 정책 수립 시 참고할 수 있는 기초자료로 활용됩니다.
