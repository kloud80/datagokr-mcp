description_portal: 한국수목원정원관리원은 기후변화 대응 및 탄소중립 실현을 위한 수목 기반 생태 데이터를 제공하고 있으며, 국립세종수목원의 이산화탄소 흡수량 정보를 공공데이터로 개방하고 있습니다.해당 데이터는 이팝나무, 메타세쿼이아, 칠엽수, 소나무 등 대표적인 4개 수종을 대상으로 하며, 수종별 탄소 흡수 기능을 정량화한 자료입니다. 각 수종에 대해 흉고직경(DBH), 본수(개체 수), 탄소저장량(kg C), 이산화탄소 흡수량(ton CO₂) 항목이 포함되어 있으며, 수목원의 생물다양성과 기후 기여도를 수치로 확인할 수 있는 기반자료입니다.데이터는 CSV 형식으로 제공되며, 수종별 흡수량을 비교하고 활용할 수 있도록 표준화된 구조로 정리되어 있습니다.항목에는 수종명, 흉고직경(cm), 본수, 탄소저장량(kg C), 이산화탄소 흡수량(ton CO₂) 등이 포함되며, 향후 탄소흡수 모델 구축이나 산림 생태계 분석 등 다양한 연구와 정책수립에 활용이 가능합니다. 수령, 측정일자 등 메타정보가 추가될 수 있으며, 종 단위 분석이나 도시녹지 조성 시에도 유용하게 쓰일 수 있습니다.본 데이터는 도시숲 조성, 탄소배출권 평가, 생물학적 탄소흡수 정책 설계 등 다양한 분야에서 활용할 수 있습니다. 공공기관은 탄소저감 사업 검토, 기후변화 적응형 녹지 전략 수립에, 연구기관은 수종별 탄소 고정능 분석에, 교육기관은 생태 및 환경 교육 자료로 연계 활용할 수 있습니다.
