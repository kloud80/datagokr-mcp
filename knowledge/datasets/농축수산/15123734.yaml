summary_user: WTO 회원국이 낸 SPS(위생·검역) 통보문을 문서 한 건 단위로 담은 파일 데이터로, 통지 회원국·통지 유형·관련 제품과 HS 코드·영향 지역·문서 제목·내용 설명·목적과 근거·효력 발생일·원문(영·스·불) 링크가 들어 있다. 수출입업체나 정책 담당자가 '특정 국가가 우리 수출 품목에 새 위생·검역 규제를 통보했는지, 언제부터 효력이 생기는지'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 관련제품 HS 코드(관련제품(HS))나 회원국 이름을 매핑해 무역통계 등과 이어 쓴다.
description_portal: 농림수산식품교육문화정보원_SPS지원서비스_통보문의 데이터는 농림수산식품의 안전성과 품질을 높이기 위한 정보 제공을 목표로 하는 자료로, SPS(Sanitary and Phytosanitary Measures) 관련 통보문을 포함하고 있습니다. 이 데이터는 TBT(Technical Barriers to Trade)와 연계된 정보, SPS의 주요 사항을 소개하는 SPS 메인 내용, 그리고 관련 정보의 공지 및 논의가 이루어지는 STC(Specific Trade Concerns) 게시판 데이터로 구성되어 있습니다. 이러한 데이터는 농림수산업체, 수출입업체, 관련 공무원, 연구자 등 다양한 이해관계자에게 유익한 정보를 제공합니다. SPS 지원 서비스는 국제 무역에서의 안전 및 위생 기준을 준수하는 데 도움을 주며, 농식품 분야의 Global Market 활성화에 기여할 수 있습니다. 또한, 이 데이터는 정책 수립 및 법령 정비의 기초 자료로 활용될 수 있습니다. 이를 통해, 실질적인 안전 기준 마련과 지속 가능한 농업 환경 조성을 위한 다양한 방안들을 모색할 수 있습니다.
