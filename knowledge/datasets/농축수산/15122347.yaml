description_portal: '- 전라남도 어장관리시스템의 연안정보도 수심면 정보입니다 연안정보도의 x좌표값, y좌표값 면적 등을 조회하실 수 있습니다.- 전라남도 어장도는 전라남도의 해양수산청이 관리하는 어업 면허 구역을 의미합니다. 이는 어업 활동의 합법성과 관리 효율성을 높이기 위해 설정된 해상 구역으로, 어업 면허를 취득한 어선만이 해당 구역에서 어업 활동을 할 수 있습니다.- 어업인 : 어업 면허를 취득하려는 어업인은 해당 구역의 면허 조건과 위치를 확인하여 신청할 수 있습니다.- 연구자 및 정책 담당자 : 어업 활동의 분석 및 정책 수립을 위해 어장도 정보를 활용할 수 있습니다.- 일반 시민 : 어업 활동에 대한 이해를 높이고자 하는 시민들은 어장도 정보를 통해 어업 구역의 분포와 특성을 파악할 수 있습니다.'
