description_portal: 축산물유통정보 다봄에서 조회되고 있는 자료로 축산물품질평가원 소비자가격조사 수집을 기반으로 2022년부터 2026년 까지의 소 1뿔 등급과 1등급의 평균가격, 최대가격, 최소가격, 평년가격을 제공하고 있습니다. 2021년 이전 자료는 한국농수산식품유통공사에서 확인할 수 있습니다. 연도별 소비자 가격을 100그람당 가격으로 조회할수 있고 부위별로(등심, 안심, 설도, 양지, 갈비) 조회가 가능하여 연도별 등급별로 가격추이를 확인 할 수 있습니다. 자료는 축산물 등급판정두수와 연계하여 가격예측 정보로 활용 될 수 있습니다.
