description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 전국 100대 명산의 탐방로 구간 중 갈림길 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천장소유형명, 원천장소유형코드, 장소명, 설명내용, 기준일시, 원천조사진행방향명, 이정표목적지명, 원천이정표목적지방향명, 원천이정표목적지코드 정보를 호출할 수 있으며, 이를 활용하여 탐방로 분기구간 시각화, 경로안내 시스템 구축, 이정표 기반 탐방정보 서비스, GIS 탐방로 분석, 안전관리체계 설계 등에 다양하게 적용할 수 있는 정보를 JSON+XML 포맷으로 지원합니다.
