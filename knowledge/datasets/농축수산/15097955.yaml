summary_user: 전국 100대 명산 탐방로의 갈림길 지점을 한 건씩 담은 원천 데이터로, 지점마다 숲길 식별자·숲길명, 위도·경도·해발고도, 장소 유형, 설명, 이정표 목적지(최대 4개)와 그 방향을 담는다. 등산객이나 탐방 안내 서비스 개발자가 "이 산의 어느 갈림길에서 어느 방향으로 가야 정상이나 하산 지점에 닿는가"를 확인하거나 갈림길을 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 숲길명·산 이름 매핑이나 같은 기관의 숲길 식별자(frtrlId)로 잇고, 좌표(위도·경도)를 써서 공간적으로 겹쳐 본다.
limits: 다른 기관 데이터와 바로 붙일 공통 키가 없어 이름이나 좌표로 맞춰야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
