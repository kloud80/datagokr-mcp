description_portal: 본 데이터는 경기도 화성시 내 포도 스마트팜을 대상으로 수집된 낙엽기의 지온 정보를 제공하는 자료이다. 각 농가에 설치된 센서를 통해 낙엽기 동안 측정된 지온 값을 농가 단위로 수집하였으며, 해당 데이터는 농가별 고유번호, 측정 지점의 공간정보(x, y 좌표), 지온 값 등으로 구성되어 있다. 수집된 정보는 스마트팜 기반의 생육환경 분석, 농업환경 변화 연구 및 작물 생육 패턴 이해에 활용될 수 있다. 데이터는 일회성으로 생산되었으며, 별도의 갱신 주기는 존재하지 않는다. 자료는 현장 측정 기반으로 확보되었으며, 데이터 활용 시 지리적 특성과 시기적 요인을 함께 고려하는 것이 바람직하다. 농업기술 지원, 정책 수립, 기후변화 대응 등 다양한 분야에 활용 가능하다.
