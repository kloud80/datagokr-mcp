summary_user: 제주산 농산물의 도매·소매 유통 가격을 품목(대·중·소분류)·등급·단위·시도·기준일별로 담은 파일로, 당일 가격과 함께 1개월 전·1년 전·평년 가격을 나란히 제공한다. 포털 설명상 기간은 2008년 6월부터 2021년 11월까지이며, 농업 분석가나 유통업체가 '제주산 감귤·월동채소 가격이 평년보다 얼마나 오르내렸나'를 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS·도매시장 경락가 등 다른 가격 자료와는 품목명이나 품목코드 매핑, 그리고 시도·기준일을 맞춰 이어 쓴다.
description_portal: 이 데이터셋은 2008년 6월 4일부터 2021년 11월 10일까지의 기간 동안, 제주산 농산물이 전국 유통 망에서 거래된 도매가격과 소매가격 정보를 정리한 공공 통계자료이다. 제공 기관은 제주특별자치도청 및 그 소속 농업기술센터이며 공개된 CSV 파일 형식으로 누구나 다운로드 가능하다. 본 자료는 제주산 농산물의 유통 가격 동향을 연도별·품목별로 추적할 수 있어, 농업 정책 수립, 가격 안정성 분석, 유통망 구조 평가, 소비자 물가 변동 분석, 농업 생산자 지원 및 시장 전략 수립 등에 기초 자료로 활용되기에 적합하다. 또한 공급-수요 변화, 지역 농산물의 경쟁력, 유통 과정 효율성 등을 연구하거나 민간 유통업체, 소비자 단체, 학계에서 가격 변동과 유통 실태를 객관적으로 분석하는 데 있어 신뢰성 있는 데이터베이스 역할을 한다.
