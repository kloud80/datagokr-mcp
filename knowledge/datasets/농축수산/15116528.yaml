description_portal: 대전광역시 조류인플루엔자 검사실적 자료는 닭, 칠면조, 오리 등 대전지역 조류를 대상으로 실시된 조류인플루엔자(AI) 항원 및 항체 검사 결과를 체계적으로 제공합니다. 이 자료는 각 항원검사와 항체검사, 적합 및 부적합 판정, 금회검사실적과 누계실적등 세부 항목을 포함하고 있습니다. 조류인플루엔자는 급성 전염병으로서 가축전염병 관리와 지역 방역 대책 수립에 매우 중요한 자료로 활용됩니다. 이 자료는 2025년 하반기 대전광역시 보건환경연구원 조류인플루엔자 검사 현황을 보여줍니다.
