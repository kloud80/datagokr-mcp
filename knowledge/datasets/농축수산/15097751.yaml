description_portal: 이 자료는 서귀포시 관내에서 주로 재배되는 만감류 시설재배 농가를 대상으로 시행된 토양성분 분석 결과를 정리한 데이터입니다. 각 농가별로 토양의 pH, 유기물 함량, 인·칼륨·마그네슘 등의 주요 영양성분, 염분 농도 등이 포함되어 있으며, 이를 통해 토양 상태와 작물 생산성 간의 상관관계를 분석할 수 있도록 설계되어 있습니다. 지자체 및 농업기술센터는 이 정보를 활용해 농가별 맞춤형 토양개선 처방, 설비투자 우선순위 설정이 가능하며, 연구기관은 토양비옥도 변화 추이 및 재배환경 개선을 위한 근거자료로 활용할 수 있습니다. 또한 농가 스스로는 토양정보를 바탕으로 시비계획과 작물 선택 전략을 수립하는 데 기여할 수 있습니다.
