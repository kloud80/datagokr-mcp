description_portal: 이 데이터는 해양수산부에서 한국 어선의 중국 EEZ(배타적 경제수역) 내 협정 어업 활동과 관련된 협정 기본 정보 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 허가 연도, 어업 종류 코드, 조업 수역 코드, 사용 어구 코드, 업종 한국어·영어·한자명, 확정 여부, 확정 일자, 최초 생성 시점, 최종 변경 시점, 데이터 기준일자로 구성되어 있습니다.  본 데이터는 한국 어선의 중국 EEZ 내 어업 허가 현황 파악, 어업 관리 정책 수립, 한중 어업 협정 이행 현황 모니터링, 어업종별 허가 동향 분석, 각종 연구 및 통계자료 작성에 활용될 수 있습니다.
