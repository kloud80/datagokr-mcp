summary_user: 전북특별자치도 임실군 관내 양식장을 한 곳씩 행으로 담은 원천 목록 파일(csv, 약 4.9KB)로, 허가번호·허가기간·양식품종·도로명주소·수면적·시설면적·시설종류를 담는다. 임실군에서 어떤 품종을 어느 위치에서 어떤 시설 규모로 양식하는지, 허가가 언제까지인지 확인하려는 어업인·연구자·행정 담당자가 쓴다. 전국 공통 조인 키는 없어 도로명주소로 주소·좌표 데이터에 붙이거나 허가번호·품종명을 같은 기관의 어업 허가 자료와 이름 기준으로 맞춰 쓴다.
description_portal: 전북특별자치도 임실군은 수산자원의 지속 가능한 이용과 지역 수산업 발전을 위해 양식장 현황 공공데이터를 국민에게 제공합니다. 본 자료는 관내 양식장의 위치, 면적, 양식 품종, 허가 정보 등 다양한 정보를 포함하고 있으며, 이를 통해 행정기관뿐만 아니라 수산업 종사자, 연구자, 일반 국민도 폭넓게 활용할 수 있습니다. 누구나 자유롭게 접근 가능한 이 데이터는 친환경 수산업 정책 수립과 투명한 행정 운영에 기여하며, 지역 수산자원의 효율적인 관리와 경쟁력 강화에 중요한 기반이 됩니다. 임실군은 앞으로도 공공데이터 개방을 지속 확대하여 국민과 소통하고, 안전하고 건강한 수산물 생산 환경 조성에 힘쓸 계획입니다.
