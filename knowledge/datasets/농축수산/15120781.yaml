description_portal: '해양수산과학기술진흥원이 제공하는 해양수산 분야 R&D 사업별 통계로, 연도별·사업별 연구개발 현황을 체계적으로 집계한 자료이다. 과제 수, 정부출연금, 협약액, 민간부담금, 참여기관 수, 참여인원 등 다양한 재정 및 참여 정보를 포함하여 해양수산 R&D 사업의 규모와 운영 성과를 종합적으로 파악할 수 있다. 특히 기관 유형별, 수행체계별로 세분화된 협약액과 부담금 현황이 함께 제공되어, 정책 입안자는 이를 통해 예산 배분과 투자 효율성을 평가하고, 연구기관은 자원 운용 및 협력 구조를 분석할 수 있다. 또한 산업계는 참여 기회를 탐색하고, 연구자는 연구개발 생태계의 구조적 특징과 변화를 이해하는 데 참고할 수 있다. 본 데이터는 해양수산 연구개발 사업의 효율적 관리, 성과 기반 정책 수립, 미래 전략적 의사결정 등 다양한 활용 가치를 지닌 핵심 통계 자료이다. 참고: 2023년 이후 범부처통합연구지원시스템(IRIS)으로 해당 시스템이 이관되어 데이터 생산 중단'
