summary_user: 농업ON에 구축된 농작업 기준 정보를 품목별로 담은 데이터로, 품목·분류, 농작업 이름·구분, 재배 방식·작형·재배지역, 작업 순서·시작일·소요일수·작업 내용이 한 행씩 정리돼 있으며 범위는 전국·비공간이다. 농업인이나 교육기관이 '이 품목은 어떤 작업을 어떤 순서로 언제쯤 해야 하나'를 확인하거나 영농 교육·작업 일정표를 만드는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 품목코드(ITEMCD)나 품목명으로 다른 데이터와 매핑해 연결해야 하며, 품목코드는 KAMIS·도매시장·HS·KOSIS마다 체계가 달라 별도 대응표가 필요하다.
description_portal: 농림수산식품교육문화정보원에서 운영 중인 농업ON에 제공하는 현재까지 구축된 농작업 기준 정보 데이터 셋입니다. 이 데이터는 농업과 관련된 다양한 작업의 기준과 절차를 체계적으로 정리하여 농업인 및 관련 종사자들에게 필요한 정보를 제공합니다. 농작업의 종류와 순서, 수행일자 등을 포함하고 있으며, 이를 통해 농업 관리의 효율성을 제고하는 데 기여하고 있습니다. 농업 관련 교육을 필요로 하는 기관이나 단체, 연구자, 정책 입안자 등은 이 데이터를 활용하여 농업 종사자 교육 프로그램을 개발하거나, 농업 정책을 수립하는 데 필요한 기초 자료로 활용할 수 있습니다. 또한, 개인 농업인의 경우에도 실질적인 작업 가이드를 제공받아 더욱 효율적인 농업 경영에 도움을 받을 수 있습니다.
