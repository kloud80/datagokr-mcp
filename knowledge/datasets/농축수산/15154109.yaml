description_portal: 농식품 R&D, 농업기술보급, 농업정책 수립을 효과적으로 지원하기 위해 농촌진흥청의 ⌜소비자패널 가계부⌟ 자료와 설문조사 데이터를 종합적으로 분석하여 발간된 전문 보고서입니다. 2012년부터 2025년까지의 장기간 소비자패널 가계부 데이터를 활용해 품목별 구매 변화, 즉 연도별 구매횟수와 구매금액 등의 추이를 체계적으로 제시하였으며, 동시에 소비자 설문조사를 통해 파악한 선호도와 인식 변화를 함께 담아 소비 행태의 흐름을 보다 입체적으로 이해할 수 있도록 구성하였습니다. 이 자료는 농식품 관련 연구와 정책 방향 설정은 물론, 산업 현장에서의 전략 수립에도 실질적인 근거 자료로 활용될 수 있는 유용한 정보입니다.
