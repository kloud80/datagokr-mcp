description_portal: '통계개요* 통계명 : 산림면적(소유별)* 통계종류 : 서울시 소유별 산림면적 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 산림면적의 소유ㆍ임목별 현황을 조사ㆍ분석하여 산림정책 수립의기초자료로 활용하고, 산림자원의 관리보호 및 활용을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 산림청(공ㆍ사유림)국유림관리소 → 지방산림청 → 산림청(국유림)* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 산림의 소유별(국유림ㆍ공유림ㆍ사유림) 면적 현황○ 용어설명* 공유림 : 시ㆍ도와 시ㆍ군ㆍ구 소유의 산림* 사유림 : 국ㆍ공유림을 제외한 단체 또는 개인 소유의 산림○ 기 타* 산림자원분야(산림면적, 임목축적) 통계는 매년 공표되는 산림기본통계를 기반으로작성되어 왔으나 산림자원의 조성 및 관리에 관한 법률 시행규칙 제36조(산림자원의조사시기 및 내용) 및 산림청 현안점검회의(2011.2.)에 따라 국가산림자원조사 주기를5년 주기로 변경함'
