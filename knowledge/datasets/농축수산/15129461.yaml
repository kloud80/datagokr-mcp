description_portal: 이 데이터는 해양수산부에서 수산물유통종합정보시스템을 통해 갈치의 위탁판매 현황을 통계적으로 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 갈치 품목을 대상으로 한 위탁판매 실적에 관한 다양한 항목들로 구성되어 있습니다. 경매장, 어획자 정보, 거래량, 거래금액, 거래일자 등을 포함하고 있습니다.  본 데이터는 수산물 유통 및 물류 정책 분석, 현장 유통구조 조사, 갈치 시장 동향 파악, 수산업 관련 중장기 전략 수립 등에서 활용될 수 있습니다. 아울러, 갈치 수급 관리 방안 마련이나 통계 기반 보고서 작성 등 행정 및 연구 목적에도 사용할 수 있습니다.
