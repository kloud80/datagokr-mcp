description_portal: '농림수산식품교육문화정보원에서 제공하는 비료표준 사용량 데이터는 농업온 시스템을 통해 관리되고 있으며, 농작물 재배에 필요한 비료의 적정 사용량을 기준으로 설정한 정보입니다. 이 데이터는 연구자, 농업 관련 종사자 및 정책 입안자들에게 유용할 수 있으며, 농작물의 종류에 따라 필요한 영양 성분을 적절히 조절하는 데 도움을 줍니다. 데이터를 구성하는 주요 항목으로는 비료표준작물코드, 비료표준작물명, 비료표준_대_작물코드, 비료표준_대_작물명, 밑거름의 질소, 인산 및 칼리 처방량, 그리고 웃거름의 질소, 인산 및 칼리 처방량이 포함되어 있습니다. 이러한 데이터는 작물 재배 방법 및 비료 사용 계획을 수립하는 데 중요한 참고자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 비료표준작물코드(숫자형): 비료 표준 작물의 고유 코드, 비료표준작물명(문자형): 비료 표준 작물의 이름, 비료표준_대_작물코드(숫자형): 해당 작물이 포함된 대 작물의 고유 코드, 비료표준_대_작물명(문자형): 대 작물의 이름, 밑거름_질소처방량(숫자형): 밑거름으로 사용해야 할 질소의 양, 밑거름_인산처방량(숫자형): 밑거름으로 사용해야 할 인산의 양, 밑거름_칼리처방량(숫자형): 밑거름으로 사용해야 할 칼리의 양, 웃거름_질소처방량(숫자형): 웃거름으로 사용해야 할 질소의 양, 웃거름_인산처방량(숫자형): 웃거름으로 사용해야 할 인산의 양, 웃거름_칼리처방량(숫자형): 웃거름으로 사용해야 할 칼리의 양입니다.'
