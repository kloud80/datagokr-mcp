description_portal: 이 데이터는 해양수산부에서 연안침식으로 인해 발생하는 퇴적물의 조성을 파악하고 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 연안 침식 지역의 시도명, 최적물 조사일자 및 퇴적물의 자갈 비율, 모래 비율, 점토 함량, 평균 입도 등 특성정보로 구성되어 있습니다.본 데이터는 연안정비를 계획 중인 관련 부서에서 침식 현상 진단 및 보전 대책 수립 시 기초자료로 사용할 수 있습니다. 또한 해양 환경 변화 분석과 해안 지형 변화 연구, 연안 시설물 안전성 평가 및 공학적 특성 분석 등 분야에도 활용될 수 있습니다.
