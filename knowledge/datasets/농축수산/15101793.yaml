summary_user: 전국 잠업 농가를 뽕밭 규모별로 나눠 농가 수를 집계한 통계표로, 실측 컬럼은 '기능성 양잠 규모현황' 제목 아래 이름 없는 열들로 이루어진 엑셀형 표다. 잠업 정책 담당자나 연구자가 소규모·중규모·대규모 양잠 농가가 각각 몇 곳인지, 잠업의 규모 구조가 어떤지를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 규모 구간명이나 같은 기관의 양잠 통계를 이름으로 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 뽕밭 규모별 농가수에 관한 데이터로, 잠업에 종사하는 전국의 모든 잠업가구의 양잠형태별 생산현황, 누에 생산, 판매 실적 등을 조회할 수 있는 서비스입니다. 특히 뽕밭 규모별 농가 수를 파악함으로써 잠업 산업의 규모 구조와 분포 현황을 체계적으로 이해할 수 있으며, 소규모·중규모·대규모 농가별 생산 능력과 누에 생산 효율성을 비교 분석할 수 있습니다. 또한 누에 생산 및 판매 현황과 연계하여 농가 수익 구조, 생산성, 시장 참여 정도 등을 평가할 수 있으며, 이를 통해 잠업 관련 정책 수립, 지원 사업 계획, 기술 보급 전략, 시설 현대화, 소득 안정화 방안 등 다양한 활용이 가능합니다. 이 데이터는 뽕밭 규모별 잠업 농가의 관리 및 기능성 잠업 산업 경쟁력 강화, 지속 가능한 양잠업 육성, 농가별 맞춤형 지원 정책 마련을 위한 기초 통계자료로 활용될 수 있습니다.
