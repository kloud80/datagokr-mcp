description_portal: 경기도 이천시 내 산사태취약지역의 지정 현황과 공간적 특성에 관한 정보를 제공하는 데이터입니다. 시군명, 읍면동, 리 단위의 행정구역, 주소, 위도·경도, 취약지역 유형, 지정일자, 면적, 위험등급, 지정여부, 대피장소 등 15개 이상의 항목으로 구성되어 있으며, 산사태 위험이 높아 법적으로 지정·관리되는 장소의 상세 현황을 확인할 수 있습니다. 본 데이터는 재해예방사업 우선순위 결정, 위험지역 주민 대피계획 수립, 지역별 재난 대응 정책 수립, 사방사업계획, 도시계획 및 개발행위 제한 검토 등의 업무에 활용됩니다. 공간좌표 정보는 지도 시각화 및 공간분석에 활용되며, 위기대응 시스템과 연계한 실시간 위험관리 자료로도 활용 가능합니다.
