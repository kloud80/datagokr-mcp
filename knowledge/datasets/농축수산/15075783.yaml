description_portal: 해당 데이터는 2021년 1월 6일 기준 경상북도 영천시에서 운영 중인 농산물산지유통센터의 운영 현황(연번, 시군명, 사업장명, 사업장 소재지, 주요 품목)과 관련된 데이터입니다.경상북도 영천시 내에서 생산되는 다양한 농산물의 산지 위치와 품목별 생산 현황을 상세히 수록하고 있습니다. 경상북도 영천시의 농업 생산 기반을 이해하는 데 중요한 자료로 활용되며, 농산물 유통, 품질 관리, 농업 정책 수립 등에 유용하게 사용될 수 있습니다. 해당 데이터와 관련하여 추가적으로 궁금하신 사항이 있으실 경우 영천시 농업기술센터 농업정책과로 연락주시기 바랍니다.
