summary_user: 전국 녹비작물 종자 공급 현황을 연도·시도·시군구·작물(품목명)별로 집계한 자료로, 필드명으로 보아 농가 수·면적·물량을 담는다. 지자체 담당자나 친환경농업 분석가가 '우리 시군에는 어떤 녹비작물 종자가 얼마나 공급됐고, 다른 지역과 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 시도·시군구 이름과 코드(CTRD_CODE, SIGNGU_CODE)를 행정구역 코드표와 맞춰 다른 지역 통계와 이어 쓴다.
description_portal: 해당 데이터는 친환경농업에 필요한 유기농업자재 중 녹비작물 종자의 지역별 공급 현황을 제공하는 자료입니다. 본 자료는 지역별로 어떤 녹비작물 종자가 어느 정도 공급되고 있는지를 체계적으로 보여줌으로써, 농업인들이 지역 여건에 맞는 종자를 적절히 선택하고 활용할 수 있도록 지원합니다. 또한 정부와 지자체는 이 데이터를 바탕으로 친환경농업 자재 지원 정책의 실효성을 점검하고, 부족 지역에 대한 보급 확대나 균형 있는 공급망 구축 전략을 마련할 수 있습니다. 연구자와 농업 관련 기관에는 친환경농업 활성화를 위한 기초 자료로 활용될 수 있으며, 장기적으로는 화학비료 의존도를 낮추고 지속가능한 농업 생산 체계를 확립하는 데 기여하는 의미 있는 자료라 할 수 있습니다.
