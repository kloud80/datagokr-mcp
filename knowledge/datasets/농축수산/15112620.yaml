summary_user: 해양수산부가 격자별로 해수의 흐름(유향·유속)을 15분 간격으로 분석해 제공하는 API로, 격자코드·분석일자·분석시간별 값을 담는다. 연안 관리나 해양사고 대응 계획을 세우는 연구기관·정부 부서, 분석가가 특정 격자에서 해수가 어느 방향으로 얼마나 빠르게 흐르는지 확인하는 데 쓴다. 경도(lo)·위도(la)가 좌표 조인 키라서 좌표를 가진 다른 해양 관측·예보 자료와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 해수의 유동과 관련된 정보를 15분 간격(2단계)의 격자별로 제공하기 위해 수집한 데이터입니다.  격자번호, 분석일자, 분석시간 등 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 격자코드, 분석시간, 유향, 유속 등으로 구성되어 있습니다.  본 데이터는 연구기관이나 정부 부서에서 해양 환경 변화 분석, 해수 유동성 모델링, 연안 관리 정책 수립, 해양 사고 대응 계획 수립 등 해수의 동적 특성에 기반한 분석 및 정책 수립 등 활동을 위한 기초 자료로 활용될 수 있습니다.
