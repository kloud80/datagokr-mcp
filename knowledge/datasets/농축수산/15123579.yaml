description_portal: '농촌지흥청 농사로 홈페이지에서는 곤충표본목록 정보를 제공합니다. 곤충 목에 따른 곤충 종류를 검색할 수 있습니다. - 제공 정보 : 1. 목 고유번호, 2, 목명, 3. 과 고유번호, 4. 과 한글명, 5. 과 영문명 - 제공 정보 수 : 21개 목명, 총 246가지 곤충정보 제공 - 활용분야 : 곤충정보를 이용한 병해충 정보 제공, 방제방법, 피해 예방 안내 시 정보제공과 곤충 활용 산업에서 해당 곤충정보 활용  * 향후 지속적으로 대상 확대할 예정으로 관련 정보는 국립농업과학원 산업곤충과 및 해충잡초방제과에 문의하시기 바랍니다.'
