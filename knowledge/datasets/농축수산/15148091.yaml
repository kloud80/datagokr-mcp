summary_user: 농림축산검역본부가 발간한 단행본·보고서·팜플렛·연보·뉴스레터·연구보고서·수의과학고서 등을 전자책으로 올린 자료관의 책자 목록으로, 책 한 권이 한 행인 목록이며 파일 첫 칸 제목에 1,325권으로 적혀 있다. 검역·방역 관련 기관 간행물이나 연구성과 자료를 찾는 연구자·수험생·업계 실무자가 '검역본부가 낸 특정 주제 보고서나 연보가 전자책으로 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 도서명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓸 수 있다.
description_portal: 농림축산검역본부 e-book 자료관은 해외 가축전염병 및 식물병해충을 유입을 차단하여 국민 건강을 증진하고, 우리 농축산업을 보호하는 역할을 담당하는 국가표준방역검역 전문기관인 농림축산검역본부에서 발간한 도서를 외부에서 보기 쉽게 전자책으로 구축한 책자 목록을 제공하는 서비스입니다. 일반간행물인 단행본, 보고서, 팜플렛, 법령정보, 사전정보공표가 있고, 정기간행물으로는 기관 연보, 정보지 아름드리, 이번에 발간되었던 정기간행물들이 등록되어 있습니다. 그 외 국내외 동향정보, 도서관뉴스레터와 검역본부 뉴스레터가 있습니다.  연구성과자료로 연구성과활용집, 연구보고서, 연구과제제안서가 있고, 국역사업으로 진행되었던 수의과학고서를 제공하고 있습니다.
