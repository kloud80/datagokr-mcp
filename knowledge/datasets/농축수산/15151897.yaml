description_portal: 울산광역시 울주군 지역의 전업규모 양돈농가(돼지 사육농가) 현황 데이터를 제공합니다. 본 데이터에는 각 농장의 기본 정보인 농장명, 농장소재지와 함께 세부적인 사육두수 현황이 포함되어 있습니다. 사육두수는 모돈, 후보돈, 웅돈, 자돈, 육성돈, 비육돈 등으로 구분되며, 각 항목별 사육 규모를 상세히 나타냅니다. 또한, 이를 종합한 총 사육두수 정보도 함께 제공하여 울주군 내 양돈농가의 규모 및 분포를 한눈에 파악할 수 있도록 구성된 데이터입니다. 본 데이터는 지역 양돈산업의 현황 분석, 정책 수립, 그리고 사육시설 관리 및 생산성 향상 연구에 활용할 수 있습니다.
