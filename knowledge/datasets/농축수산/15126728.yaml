description_portal: 이 데이터는 해양수산부에서 OECD 회원국의 어선현황 정보를 파악하고 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 조사년도, 선박의 동력유무, 선박의 길이코드, 선박 수, 총톤수, 최초 생성시점, 최종 변경시점 등으로 구성되어 있습니다.  해양수산부_OECD어선집계 데이터는 해운 및 수산 정책 수립, 국제기관 및 국내외 해양수산 관련 연구 수행, 국가 간 어선 규모 및 구조 비교분석 자료, 연차별 어선 변동 추이 파악 등 다양한 해양수산 분야의 기초 자료로 활용될 수 있습니다.
