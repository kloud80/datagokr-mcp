summary_user: 지적이 등록된 무인도서를 대상으로 무인도서마다 속한 필지를 한 줄씩 나열하고, 각 필지에 「무인도서의 보전 및 관리에 관한 법률」상 육상지역 관리유형을 매핑한 전국 범위 파일(csv, 약 367KB)이다. 해상풍력·해양관광 등 사업자나 분석가가 특정 무인도 필지가 어떤 관리유형으로 묶여 개발·이용이 제한되는지 확인할 때 쓴다. 필지고유번호(PNU)를 키로 토지대장·토지이용규제·공시지가 등 필지 단위 데이터와 잇고, 무인도서관리번호로 무인도서 종합정보망의 도서 정보(도서명 등)와 연결한다.
description_portal: '이 데이터는 해양수산부 무인도서 종합정보망에서 관리 중인 무인도서를 대상으로, 지적이 등록된 무인도서에 한하여 무인도서별 필지 목록을 제공하고 있습니다.데이터는 scv 형식으로 제공되며, 각 필지별 무인도서의 보전 및 관리에 관한 법률에 의한 무인도서 육상지역의 관리유형을 매핑하여 제공합니다.[데이터 설명]제공 항목: 무인도서관리번호, 필지고유번호(PNU), 무인도서관리유형도서명 등 도서에 대한 자세한 사항은 무인도서 홈페이지 또는 무인도서 API 연계를 통해 참고하시기 바랍니다.무인도서 홈페이지 - http://uii.mof.go.kr/UII/INTRO/index.html무인도서 API 신청 페이지 - http://uii.mof.go.kr/UII/mn/mng_card/apiApplication.do'
