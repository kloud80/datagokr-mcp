description_portal: 이 데이터는 2022년 드론을 활용해 촬영한 고해상도 영상을 판독하여 구축한 농업 디지털전자지도(팜맵) 기반의 남해군 작물 재배 현황 속성 정보입니다. 드론 영상에서 경작지 경계와 작물 유형을 정밀 분석해 실제 재배 작물의 종류, 재배 면적, 위치 등을 구조화한 데이터로, 기존 통계 기반 정보보다 정확도가 높다. 농업 생산계획 수립, 스마트팜 운영, 농지 관리, 재해 대응 등 다양한 행정·정책 활용이 가능하며 지역 농업 구조를 파악하는 데 핵심 자료로 쓰일 수 있다. 또한 지리정보 기반 속성값으로 구성되어 다른 공간정보 시스템과 연계하기 쉽다는 장점이 있다.
