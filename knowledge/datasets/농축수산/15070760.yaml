description_portal: MBRIS의 해양생물분양자원 데이터는 해양생물 자원(표본, 유전자원, 미생물배양체, 추출물 등)을 대상으로 보유기관, 채집지, 채집일, 자원유형, 자원번호 등 다양한 조건으로 검색이 가능합니다.“분양가능 자원”, “대여가능 자원”, 또는 “전체 자원”을 선택해 조회할 수 있으며, 검색 결과는 자원번호, 보유기관, 학명/국명, 채집지, 채집일, 분양 가능 여부 등을 포함한 리스트 형태로 제공됩니다.이 자원검색 기능은 연구자나 기관, 기업 등이 원하는 해양생물 자원을 신청하거나 대여할 수 있도록 설계되어 있으며, 필요한 경우 엑셀 다운로드를 통해 데이터를 일괄 확보할 수도 있습니다.
