summary_user: 「해양환경관리법」에 따라 해양환경 보전에 장애가 있거나 우려가 있어 설정된 전국 특별관리해역을 해역 단위 SHP 공간정보 파일(약 79KB zip)로 담고, 포털 설명상 해역별 코드·명칭·면적을 포함한다. 연안개발이나 해상 개발사업을 검토하는 사업자·분석가가 '이 사업 예정지가 특별관리해역 안에 들어가는가'를 확인하거나 해양공간계획·환경영향평가의 입지 규제 근거를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 해역 명칭·코드 매핑이나 공간 중첩으로만 이어 쓰며, 해양용도구역·보호구역 등 같은 해양공간 영역 레이어와 겹쳐 보는 용도에 맞다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 「해양환경관리법」 시행령 제10조 제2항에 따라 해양환경 보전에 장애가 있거나 장애를 미칠 우려가 있어 설정된 특별관리해역의 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 특별관리해역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해역의 특별관리해역코드, 명칭, 면적 등 정보를 포함하고 있습니다.  본 데이터는 해양환경 보전 정책 수립 시 과학적 근거 자료로 활용할 수 있으며, 특정 해역의 관리 필요성 평가, 연안개발계획의 환경영향평가, 해양공간계획 수립 및 개발사업 인허가 검토 시 참고자료로 사용될 수 있습니다.
