summary_user: 도매시장에서 상장되지 않고 출하자와 중도매인이 직접 거래한 농산물의 거래 건을 정산일자·도매시장·법인·품목(대·중·소분류)·단위·포장·크기·등급·원산지별로 담고, 물량·낙찰가·총가격을 전국 범위로 제공한다. 농업인·유통업자·정책담당자가 '특정 품목이 상장예외 거래로 어느 도매시장에서 얼마에 얼마나 거래됐나'를 확인하고 경매(상장) 가격과 비교할 때 쓴다. 전역 조인 키는 없고, 상품분류코드(gds_lclsf_cd 등)와 도매시장·법인 코드를 같은 기관(aT)의 경락·도매 가격 데이터와 맞춰 잇는다. KAMIS·KOSIS·HS 품목코드와는 이름 또는 코드 매핑으로만 연결한다.
description_portal: 한국농수산식품유통공사의 농안법 제31조에 따른 상장되지 않고 출하자와 중도매인이 직접 거래하는 농산물에 대한 거래정보 데이터로 정산일자, 도매시장코드, 도매시장명, 법인코드, 법인명, 상품대분류코드, 상품대분류명, 상품중분류코드, 상품중분류명, 상품소분류코드, 상품소분류명, 단위코드, 단위명, 포장코드, 포장명, 크기코드, 크기명, 등급코드, 등급명, 물량, 낙찰가, 원산지코드, 원산지명, 단위총물량, 총가격, 단위중량을 제공합니다.★ API 명세서가 첨부되어있습니다. API 활용에 참고하실 수 있습니다.기대활용분야- (국민) 농산물유통정보를 활용하여 농산물 판매·구매 계획 수립, 농산물 유통 분야 사업모델 발굴, 유통 과정 부가가치 창출, 개인 및 기관의 연구 목적으로 활용 등 다양한 빅데이터를 활용하여 융복합 기대- (유통) 농산물유통정보 분석으로 생산성 관리, 재고관리 등 유통 분야 활용- (농업종사자) 농산물유통정보 가격등락, 추이 정보 등을 활용, 농산물유통정보 데이터 확보를 통한 출하선택·결정권 강화- (정책담당자) 농산물유통정보 분석을 통해 주요품목 수급안정 및 농산물 가격변동 완화- (지자체:도매시장 개설자)농산물유통정보를 활용한 재고 및 물류 최적화
