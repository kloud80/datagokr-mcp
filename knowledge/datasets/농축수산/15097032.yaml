description_portal: 이 데이터셋은 제주특별자치도 관내에서 진단된 ‘법정 가축전염병’에 대한 진단 내역을 정리한 공공데이터로, 축종, 전염병명, 검사 건수 및 검사된 가축 마리 수 등의 항목을 포함하고 있다. 즉, 어떤 축종에서 어떤 전염병 검사가 어느 시점에 이루어졌는지, 그리고 몇 마리를 검사했는지의 정보를 담고 있어, 지역 방역 관리 현황과 가축 건강 상태를 객관적으로 파악할 수 있다. 이 자료는 가축 전염병 발생 위험 평가, 방역 정책 수립, 축산 위생 관리 체계 설계, 질병 확산 경로 분석 및 농가 대응 계획 수립 등에 유용한 기초 자료다. 또한 축산업 또는 공중보건 관련 연구, 축산물 안전성 관리, 지역 농가 지원 방안 마련 등의 목적으로도 활용될 수 있으며, CSV 형식으로 누구나 무료다운로드 가능하다.
