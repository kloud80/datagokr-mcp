summary_user: 산림청 산림사업법인관리시스템에 등록된 원목생산업·제재업 등 목재생산 관련 사업체를 전국 시군구 단위로 정리한 현황 파일(CSV, 약 29KB)입니다. 실제 필드는 구분·종류·기관·합계로 구성되어, 지역과 업종별 등록 사업체 수를 담은 집계표로 보입니다. 어느 시군구에 원목생산·제재 업체가 많은지 비교하거나 지역 목재산업 기반을 살펴보는 분석가와 정책 담당자가 쓰며, 공통 조인 키가 없어 다른 지역 통계와는 시도·시군구 이름을 맞춰 연결합니다.
description_portal: 산림청이 운영하는 산림사업법인관리시스템에 등록된 목재생산 관련 사업체들의 정보를 시군구 단위로 분류한 현황 자료입니다. 이 데이터는 원목생산업, 목재수입유통업, 제재업 등 목재산업 전반에 걸친 법인과 업체 정보를 포함하며, 각 업체의 상호, 주소, 업종 구분, 등록번호, 등록일자, 소재지 행정구역(시도·시군구) 등 다양한 항목을 제공합니다. 해당 자료를 통해 지역별 목재산업 분포 및 등록 사업체 수를 파악할 수 있으며, 국내 목재 공급 체계의 구조 분석, 산림자원 활용 현황 파악, 목재산업 기반 정책 수립 등의 기초 자료로 활용됩니다.
