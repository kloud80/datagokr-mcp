description_portal: '강원특별자치도 강릉시 관내 양돈농가(돼지 사육 농가)의 기본 현황을 정리한 데이터로, 농가별 위치, 사육두수, 축사 동수·면적을 한 번에 파악할 수 있도록 구성된 자료입니다. 양돈 산업 규모와 환경·방역 관리 대상 농가를 체계적으로 관리하는 데 활용됩니다.사업장명칭: 양돈농가 또는 축산업 사업장의 공식 명칭등록축종: 해당 사업장에서 등록·사육 중인 축종 구분(예: 돼지 등)사업장소재지(지번): 양돈농가가 위치한 지번 주소(○○동/○○리 ○○번지 등)사업장소재지(도로명): 도로명 주소 체계에 따른 사업장 위치 정보사육두수: 해당 농가에서 실제로 사육 중인 돼지 두수(총 마릿수)동수(계): 농장 내 돼지를 사육하는 축사(동, 棟)의 총 개수면적(계): 모든 축사의 바닥 면적을 합산한 총 면적(㎡ 등 지자체 기준 단위)데이터기준일자: 양돈농가 현황 정보가 마지막으로 확인·갱신된 기준 일자이 데이터는 지역별 양돈농가 분포와 사육 규모를 분석하고, 가축전염병(ASF 등) 방역 계획 수립, 축산악취 및 환경관리, 사료·축산폐기물 처리 지원, 축산정책·축산시설 개선사업 대상 농가 선정 등 양돈 관련 행정·정책 의사결정에 활용할 수 있는 기초 자료입니다.'
