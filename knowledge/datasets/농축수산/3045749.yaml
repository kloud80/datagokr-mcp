description_portal: 부산광역시 서구에 등록된 어선에 대한 정보입니다. 서구에 등록된 어선의 어선번호, 어선명, 어선중량(총톤수), 업종, 선체재질, 어선길이, 어선너비, 어선깊이, 진수일자 등 정보를 제공합니다. 해당 정보를 통해 부산광역시 서구의 수산업 및 어선(선박)에 대해 알 수 있습니다. 부산광역시 서구에는 총 216척의 어선이 있으며, 연안어업 어선 56척, 근해어업 어선 78척, 원양어업 어선 76척, 기타 어선 6척으로 분류할 수 있습니다. 연안어업에는 연안자망, 연안복합, 연안통발 등이 포함되며, 근해어업에는 대형선망, 쌍끌이저인망, 외끌이저인망, 트롤 등이 있습니다.
