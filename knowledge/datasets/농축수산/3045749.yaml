summary_user: 부산광역시 서구에 등록된 어선을 한 척당 한 행으로 담은 파일로, 어선번호·어선명·총톤수·업종·선체재질·길이·너비·깊이·진수일자를 담는다. 수산업 분석가나 지역 정책 담당자가 '서구 등록 어선은 연안·근해·원양 업종별로 몇 척이고 선령과 규모는 어떤가'를 따질 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 어선번호나 어선명 매칭, 또는 같은 기관 자료로만 이어 쓰고, 해운·항만 선박 등록 자료와는 어선 부분에서만 겹친다.
limits: 범위가 부산 서구 한 시군구라서 다른 지역이나 전국 어선 현황은 알 수 없고, 좌표가 없어 위치 분석에는 쓸 수 없다. 표준 코드 키가 없어서 다른 데이터와 연결하려면 어선번호나 이름을 직접 맞춰야 한다.
