description_portal: 본 데이터는 해양수산부에서 관리하는 시도별 톤급별 어선현황 통계자료입니다. 주요 항목으로 시도별 톤급별 등록어선 수와 어선 척수 합계 정보를 포함하고 있습니다. 이 데이터는 어업별 어선분포 현황파악, 선령별 어선교체 계획수립, 톤급별 어업허가 관리업무, 어선안전관리 정책수립 기초자료 등에 활용할 수 있습니다. 또한, 어선 분포 변화나 톤급 구성 변화를 모니터링함으로써 어업 구조 변화 추이, 어업인단체의 활동 범위, 어업 허가 조건 변경 필요성, 해양자원 관리 전략 수립을 위한 기초 자료로 활용할 수 있습니다.
