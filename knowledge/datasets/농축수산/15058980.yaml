summary_user: 수협 산지조합별로 보유한 창고와 그 창고를 이용하는 매출처 수를 조합코드·조합명 단위로 담은 전국 범위의 집계 데이터이며, 조합명을 파라미터로 조회한다. 수산물 유통·물류 기업이나 연구자가 '어느 수협 조합 창고에 거래 매출처가 많이 몰려 있는가'를 비교해 거래처 발굴이나 유통 구조 연구에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수산물 위판·가격 데이터와는 조합코드(mxtrCode)나 조합명을 같은 기관 코드 기준으로 맞춰 이어 붙여야 한다.
description_portal: 이 데이터는 해양수산부에서 수협별로 보유중인 창고 및 매출처 정보를 제공하기 위해 수집한 데이터입니다.조합명 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 조합코드, 조합명 및 조합 창고를 이용하는 매출처 수 정보로 구성되어 있습니다.본 데이터는 수산물 유통 및 물류 관련 기업에서 창고별 매출처 수를 분석하여 거래 전략을 수립하는 데 활용될 수 있습니다. 또한, 관련 기관 및 연구기관에서 수산물 유통 구조와 매출처 분포를 연구하기 위한 기초 자료로 활용할 수 있습니다.
