summary_user: 부산 강서구의 어업 면허를 어업 종류·품종별로 묶어 건수와 면적(ha)을 담은 집계표로, 포털 설명상 총 30건(마을어업 3건, 양식어업 27건), 면적 약 636.9ha이며 파일 크기는 169바이트에 불과하다. 강서구 앞바다(명지동·동선동·가덕도 천성동 병산열도 지선)에서 김·바지락·개량조개 양식 면허가 얼마나, 어느 정도 면적으로 나가 있는지 알고 싶은 어업인·분석가가 쓴다. 면허번호·어장코드 같은 전역 조인 키가 없어 다른 데이터와는 '부산 강서구'라는 지역명이나 품종명으로만 맞춰 붙여야 한다.
