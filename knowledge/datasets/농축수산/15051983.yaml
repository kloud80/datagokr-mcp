description_portal: 부산광역시 강서구 어업 면허에 대한 데이터로 면허 건수 및 면적 그리고  품종에 대한 자료입니다.  총 어업면허 건수는 30건 ,  면적은 636.945hㅁ이며 마을어업 3건과  양식어업 27건이  있습니다. 양식어업은 해조류양식,  복합양식 , 패류양식으로 나뉘며 , 양식어업  품종은 해조류 양식은 김이며,  복합양식은 김, 개량조개,  패류양식은 바지락 등 입니다., 마을어업의 주요 품종은 패류, 해조류 또는 정착성  수산식물입니다.  어장의 위치는 부산 강서구 명지동 지선, 동선동 지선, 가덕도 천성동 병산열도 지선입니다.
