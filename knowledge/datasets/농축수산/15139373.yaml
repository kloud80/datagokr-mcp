description_portal: '해당 데이터는 2022년 기준으로 경상남도 남해군 관내 각 읍·면별 농업 인프라 및 규모를 파악할 수 있는 핵심 지표를 제공합니다. 주요 내용으로, 각 읍·면 단위로 설치 운영 중인 시설 재배하우스의 총 면적(단위: 제곱미터, ㎡)과 해당 지역에서 실제 농업에 종사하고 있는 총 농가 수를 정확히 집계하여 나타냅니다. 이 자료를 통해 남해군 내 지역 간 농업 시설의 분포 현황 및 농가 수의 상대적 차이를 명확히 비교 분석할 수 있으며, 이는 향후 맞춤형 농업 지원 정책 개발, 지역 균형 발전 계획 수립, 그리고 지속 가능한 농업 경쟁력 강화 전략을 마련하는 데 필요한 중요한 기초 통계로 활용됩니다. 본 통계는 남해군 농업의 현재를 객관적으로 진단하고 미래 발전 방향을 설정하는 데 기여할 것입니다.'
