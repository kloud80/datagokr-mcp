summary_user: 시범 지자체 사유림에서 시행된 조림·숲가꾸기 사업을 사업 건별로 담은 원천 파일이며, 사업년도·사업명·사업차수·계획면적·사업면적과 설계·감리업체, 재원·발주 구분, 발주기관 정보가 들어 있다(CSV 약 1.9MB). 분석가나 정책 담당자가 특정 연도에 사유림 조림·숲가꾸기가 어떤 재원으로 얼마나 넓은 면적에서 실행됐는지, 계획 면적 대비 실제 사업 면적은 어땠는지 확인하는 데 쓴다. 실측된 조인 키는 사유림산림사업번호(private_forest_project_no) 하나로, 같은 번호를 쓰는 산림사업 자료와 이어 붙일 수 있으며 산림인허가번호도 담겨 있지만 조인 키로 검증되지는 않았다.
description_portal: 시범 지자체의 사유림에서 수행되는 조림 및 숲가꾸기 사업의 실행 정보를 담은 데이터입니다. 이 자료에는 설계업체명, 감리업체명, 재원구분, 발주구분, 산림인허가번호, 사업차수, 사업년도, 사업명, 계획면적, 사업면적 등 다양한 항목이 포함되어 있습니다. 이를 통해 산림사업의 실행 현황을 종합적으로 확인할 수 있으며, 사업 유형별 면적과 사업 기간, 산림기능 등 세부 정보도 함께 제공됩니다. 이러한 데이터는 산림자원 관리, 정책 수립, 사업 성과 분석 등 다양한 분야에서 활용될 수 있으며, 정기적으로 갱신되어 최신 사유림 산림사업 정보를 반영합니다. 행정기관, 연구기관, 정책 담당자뿐만 아니라 일반 이용자에게도 신뢰성 있는 근거 자료로 제공되어 산림경영과 자원 활용에 기여합니다.
