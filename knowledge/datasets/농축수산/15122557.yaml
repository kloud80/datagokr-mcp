description_portal: '농림수산식품교육문화정보원에서 제공되는 본 데이터는 농업 온 시스템의 경락 가격 정보와 관련하여 매우 중요한 자료로, 농산물의 거래 및 가격 변동을 모니터링하는 데 활용될 수 있습니다. 이 데이터는 도매시장코드, 도매시장명, 법인코드, 도매법인명, 대분류코드, 대분류명, 중분류코드, 중분류명, 소분류코드, 소분류명 등의 항목을 포함하고 있으며, 이를 통해 사용자들은 다양한 분류에 따른 농산물의 경락 가격을 파악할 수 있습니다. 데이터는 농산물의 유통 및 가격정책 수립을 위한 기초 자료로 활용되며, 유통업체와 농민들이 시장 동향을 분석하고 적절한 가격결정을 하는 데 도움을 줍니다. 이 데이터는 다음과 같은 구조로 이루어져 있습니다. 도매시장코드(숫자형): 특정 도매시장을 식별하는 코드, 도매시장명(문자형): 도매시장의 이름, 법인코드(숫자형): 도매법인을 식별하는 코드, 도매법인명(문자형): 도매법인의 이름, 대분류코드(숫자형): 농산물의 대분류를 나타내는 코드, 대분류명(문자형): 대분류의 이름, 중분류코드(문자형): 중분류를 나타내는 코드, 중분류명(문자형): 중분류의 이름, 소분류코드(문자형): 소분류를 나타내는 코드, 소분류명(문자형): 소분류의 이름으로 구성되어 있습니다.'
