description_portal: 이 데이터는 해양수산부에서 동해심층해수및물질순환에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 프로젝트명, 공간정보유형, 위도, 경도, 관측물질국문명, 관측일시, 관측깊이, 관측값 데이터로 구성되어 있습니다.본 데이터는 동해심층해수및물질순환 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.동해심층해수및물질순환이란 동해 심해에 존재하는 차가운 해수가 깊은 곳에서 순환하며, 이 해수의 이동이 동해 내 물질들을 운반하고 확산시키는 과정을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
