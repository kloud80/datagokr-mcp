summary_user: 경기도 시군별 특산물 목록을 품목 단위로 담은 명부형 자료로, 시군명·구분(농산물·수산물·가공식품 등)·브랜드(업체)명·품목명·담당 연락처가 들어 있습니다. 지역 특산물 판로를 찾는 유통업자나 시군별 특산 품목을 비교하려는 정책 담당자가 '이 시군의 특산물과 브랜드는 무엇이고 어디에 문의하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)을 행정구역 이름으로 맞추거나 품목명을 다른 품목코드에 직접 매핑해야 다른 데이터와 이을 수 있다.
description_portal: 이 데이터는 경기도 내 각 시군에서 생산되는 특산물 현황을 정리한 자료로, 품목별로 구분된 특산물의 브랜드명, 품목명, 생산지역(시군명), 구분(농산물, 수산물, 가공식품 등), 담당 부서 연락처 정보를 포함하고 있습니다. 이 자료는 지역 특산물의 유통 촉진, 브랜드화, 마케팅 전략 수립 및 지역경제 활성화를 위한 기초 자료로 활용될 수 있습니다. 또한 소비자와 판매자 간의 연결을 위한 행정지원 및 지역농업 정책 수립에도 유용한 정보로 기능합니다.※ 소관부서에서 갱신이 중단된 데이터입니다. 특산물 현황과 관련된 자료를 확인하고자 하시는 분은 G마크 등록업체 현황을 확인해주시기바랍니다.
