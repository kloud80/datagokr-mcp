description_portal: 본 데이터는 충청남도에서 운영하는 로컬푸드 연계형 학교급식지원 보조금 정산 체계 중, 구간단가표 현황 정보를 제공하는 자료로, 학교별 학생수, 해당 학생수 구간에 적용되는 단가 정보 등을 포함하고 있습니다. 구간단가표는 무상급식 및 로컬푸드 기반 급식지원 예산 산정의 핵심 기준으로 활용되며, 학생 규모에 따라 차등 적용되는 지원 단가를 체계적으로 관리할 수 있도록 구성되어 있습니다. 이를 통해 학교급식 예산의 합리적 배분, 보조금 정산의 정확성 확보, 식재료비 지원 기준의 일관성 유지 등이 가능해지며, 지역 농산물 활용 촉진과 공공급식 정책의 효율적 운영을 지원하는 중요한 기초자료로 활용됩니다.
