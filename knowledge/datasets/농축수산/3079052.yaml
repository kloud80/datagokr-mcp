summary_user: 경상남도 내 수목원을 한 행에 하나씩 담은 시설 단위 현황 파일로, 수목원명·공립/사립 구분·주소·개원일·면적(헥타르)·연락처와 희귀·특산·그 외 식물의 초본·목본·기타 보유 종수를 함께 담는다(파일 크기 840바이트의 소규모 CSV). 주민이나 관광객이 '경남에서 가까운 수목원은 어디이고 얼마나 넓은가', 연구자가 '희귀·특산식물을 가장 많이 보유한 경남 수목원은 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 시설코드가 없어, 다른 수목원·휴양시설 데이터와는 수목원명이나 주소를 맞춰 이어 써야 한다.
description_portal: 경상남도 내 등록·운영 중인 수목원의 현황 정보를 제공하는 데이터입니다. 본 데이터는 수목원명, 공립·사립 구분, 소재지, 개원일, 면적, 연락처 등 기본정보와 함께 희귀식물, 특산식물 및 기타 식물의 초본·목본·기타 종별 보유 현황 정보를 포함하고 있습니다. 경상남도 수목원의 운영 현황과 식물자원 보유 실태를 파악할 수 있으며, 산림자원 보전 및 관리, 생물다양성 증진, 환경교육, 산림휴양 서비스 제공, 정원문화 확산, 관광 활성화 및 관련 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 연구기관, 교육기관, 공공기관 및 일반 국민이 경상남도 수목원의 분포와 식물자원 현황을 확인하는 데 활용할 수 있는 공공데이터입니다.
