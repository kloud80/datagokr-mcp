summary_user: 경기도 후계농업인의 연도별 선정 인원수를 담은 집계 자료로, 개인별 원천이 아니라 연도(SUM_YY)마다 선정 인원(SELECT_PSN_CNT)을 한 줄로 묶은 시도 단위 비공간 통계다. 농업 인력 분석가나 정책 담당자가 '경기도에서 해마다 후계농업인이 얼마나 선정되어 차세대 농업 인력 공급이 꾸준한가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나 같은 기관(경기도) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 후계농업인의 연도별 선정 인원수를 집계한 자료로, 지역 농업을 이끌 차세대 인력의 규모를 보여주는 중요한 통계입니다. 후계농업인은 농업 경영을 계승하거나 새롭게 진입하는 인력입니다. 이 데이터는 특정 시기의 선정 인원 변동을 살펴봄으로써 정책적 지원의 효과와 한계를 가늠할 수 있으며, 지역 농업 경쟁력 강화와 인력 구조 개선의 방향성을 검토하는 데 기초자료가 됩니다. 또한 연도별 추이를 분석하면 농업 인력 공급이 안정적인지, 정책적 투입이 일관되게 유지되고 있는지 확인할 수 있어 농업·농촌 분야의 중장기 전략 수립에도 활용할 수 있습니다.
