summary_user: 2014년 기준 전국 농업진흥지역을 광역시도·행정구역별, 용도구역(진흥구역·보호구역)별로 나눠 경지정리 시행면적(농지·비농지), 용수개발 시행면적, 미시행면적을 ha 단위로 담은 집계 파일입니다. 지역 농정 담당자나 연구자가 "우리 시군의 진흥구역 중 경지정리나 용수개발이 안 된 면적이 얼마인가"를 비교하는 데 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어, 다른 데이터와는 광역시도·행정구역 이름을 매핑해서만 이어 쓴다.
limits: 필지 단위(PNU) 정보가 아닌 행정구역별 면적 집계여서 특정 토지의 농업진흥지역 여부는 확인할 수 없다. 공간 정보가 없는 비공간 표 데이터이고, 조인 키가 없어 행정구역명 대조가 필요하다.
