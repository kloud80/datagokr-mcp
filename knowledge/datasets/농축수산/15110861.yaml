description_portal: '제주특별자치도 내 권역별 자연재해 지역정보 현황 태풍차바 데이터를 제공합니다.항목: 일반정보(피해요인), 일반정보(피해대상), 도로명/지번 주소, 행정동코드, 위도, 경도 등* 2016년 제주특별자치도에 영향을 준 태풍 차바(Typhoon Chaba)로 인한 자연재해 피해 정보를 행정동 단위로 정밀히 기록한 자료입니다. 피해 유형을 대·중·소분류로 세분화하고, 피해 구분, 요인, 대상(품종) 등의 정보를 체계적으로 포함합니다. 도로명주소, 지번주소, 행정동 코드, 위도/경도 등의 공간 정보가 함께 제공되어 GIS 기반의 지도 시각화와 공간 분석에 매우 적합합니다.* 활용 분야 : GIS 기반 피해 시각화 및 공간 분석, 재난 대응 전략 수립, 태풍 간 비교 분석 등"'
