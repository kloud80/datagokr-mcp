description_portal: '* 충청남도 서천군 길고양이 중성화 관리내역(2025.1.1.~2025.11.30.)- 목적: 도심지 또는 주택가에 자연 번식하는 길고양이 개체수 조절 및 길고양이로 인한 소음 및 악취 등으로 인한 민원 발생 사전 예방 ❍사업대상 : 길고양이 중성화 수술 시행 동물보호센터 및 위탁 동물병원 ❍ 사업내용 : 길고양이 포획, 중성화 수술 및 방사 등에 소요되는 비용 지원 -관리번호, 포획일시, 포획장소, 수술일시, 수술병원, 방사일, 방사장소 등- 추진요령: 신고(민원인) → 시․군 접수 → 시․군 총괄 취합 → 직영 및 위탁업체에 민원접수 사항을 전달 → 직영 및 위탁업체는 포획인을 동원, 민원인과 연락 후 현장에 출동                  - 포획인이 민원인과 연락 후(또는 민원인이 직접 포획을 위해) 현장 출동하여 사진촬영, 포획 후 연계 지정된 동물병원으로 이송(사진 기록 등은 KAWIS에 입력 관리)                  - TNR 제외 대상 : 몸무게가 2kg 미만, 기존에 중성화하여 방사한 개체, 수태 또는 포유 중이 확인된 경우, 단 마취 또는 수술 중 수태 또는 포유가 확인된 경우 다음에 따라 조치                  - 장마철혹서기 및 동절기 등의 외부환경 요인으로 중성화 수술 후 회복이 어려울 것으로 판단된 경우 포획 자제, 단 지역 내 캣맘 등의 사후관리가 가능할 경우 포획 등 실시                  - 길고양이 중성화 수술실적 국가동물보호정보시스템(KAWIS)에 반드시 등록'
