description_portal: 본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘농수축산물 표준코드-조사가격품목매핑목록’에 대한 상세 정보이다. 2015년 제·개정된 농축수산물 표준코드의 품목코드와 동일한 의미를 가지는 조사가격 표준 품목코드를 나타낸 정보로, 표준품목코드, 표준품목명, 조사가격품목코드, 조사가격품목명, 업데이트일자 등의 항목으로 구성되어 있다. 해당 데이터는 농축수산물 유통 및 거래 시 과거와 현재의 품목코드 간 매핑 정보를 제공하여, 데이터 연계 및 분석에 활용될 수 있다. 특히, 과거 품목코드와 명칭을 현재의 표준품목코드와 비교 제공함으로써, 시스템 간 호환성과 이력 관리의 정확성을 높이는 데 기여한다. 데이터는 CSV, XML, JSON 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 오픈 API 형태로 활용 가능하다.
