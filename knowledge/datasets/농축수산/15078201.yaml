summary_user: 국립수목원 국가생물종지식정보시스템에 등록된 한반도 수집 고표본(옛 식물표본)을 표본 한 건 단위로 담으며, 학명·국명·과명·과국명과 표본번호(plantOldSmplNo), 이미지 주소, 등록·수정 일시를 제공한다. 식물분류 연구자나 수목원·생물다양성 분석가가 '이 학명의 식물에 대해 한반도에서 채집된 옛 표본이 있고 표본 이미지는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학명이나 국명·과명 같은 이름을 맞춰 잇거나 같은 기관의 식물 정보와 연결해야 한다.
