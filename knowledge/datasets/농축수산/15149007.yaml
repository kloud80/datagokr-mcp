summary_user: 경기도 양주시의 농지를 개별 주소 단위로 법정동코드, 도로명주소, 재배 품목, 재배면적(제곱미터)과 함께 담은 파일 데이터입니다. 양주시에서 어느 동네에 어떤 작물이 얼마나 재배되는지 알고 싶은 농업 행정 담당자나 분석가가 지역별 작물 재배 분포를 파악하는 데 쓴다. 법정동코드(bjd_cd)를 키로 행정구역 코드표나 다른 법정동 단위 농업·토지 데이터와 이어 쓰며, 필지고유번호(PNU)나 팜맵 폴리곤ID는 필드에 없다.
description_portal: 읍·면·동별 농지 현황을 제공하는 데이터입니다.법정동코드, 주소(도로명), 품목, 재배면적 정보를 포함하고 있으며, 지역별 농지 분포와 작물 재배 현황을 체계적으로 파악할 수 있습니다.본 데이터는 농업 생산 기반 현황 분석, 농지 이용 실태 조사, 작물 재배 분포 분석 및 지역별 농업 정책 수립을 위한 기초 자료로 활용됩니다.또한 농업 관련 연구, 통계 분석, 농업 행정 업무 지원, 농촌 지역 개발 계획 수립 등에 활용 가능하며, 농지의 효율적 관리와 지속 가능한 농업 발전에 기여합니다.데이터 이용자는 지역별 재배 품목 및 재배면적 정보를 통해 농업 생산 구조를 분석하고, 농업 정책 및 사업 추진을 위한 객관적인 근거 자료로 활용할 수 있습니다.
