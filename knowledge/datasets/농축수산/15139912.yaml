description_portal: '"제주특별자치도 내 노지감귤관측조사(산도)정보 데이터를 제공합니다.항목: 해당년도, 조사월, 측정항목, 도, 제주시, 서귀포시* 「제주특별자치도_노지감귤관측조사(산도)정보」는 제주 지역 노지 감귤의 산도(Acidity, %)를 정기적으로 조사하여 제공하는 공공데이터입니다.산도는 감귤의 신맛 정도를 나타내는 주요 품질 지표로, 당도(단맛)와 함께 소비자가 느끼는 맛의 균형(당산비)을 결정하는 핵심 요소입니다.이 데이터는 제주 감귤의 품질 관리, 유통 전략 수립, 농업 연구 등에 활용할 수 있는 중요한 기초 자료입니다.* 제공년도 : 2009년부터 2024년까지* 데이터 제공 기관: 제주특별자치도 농업기술원자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/join/evaluation/part10/11.htm"'
