summary_user: 조위관측소 자동기상관측장비로 잰 풍향·풍속을 관측소·관측일시별 건 단위로 담은 API이며, 검증 호출에서는 전국 24행(2026-10-01 하루치)이 수신됐다. 연안·항만 선박 운항 안전을 살피는 사람이나 해양 기상 분석가가 특정 날짜 관측소의 바람 상태를 확인하는 질문에 쓴다. 위도(lat)가 좌표 조인 키이고 관측소 위치(위도·경도)를 담고 있어 같은 해양 관측·예보 계열의 다른 관측소 자료와 좌표나 관측소 코드로 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 조위관측소 자동기상관측장비 기반 실시간 풍향, 풍속 측정 정보를 제공하기 위해 제작되었습니다.  관측소 코드, 관측일자 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 관측일시, 관측소의 위도/경도 위치정보 및 측정된 풍속과 풍향 값 정보로 구성되어 있습니다.  본 데이터는 해양 기상 변화 분석, 연안 및 항만 주변의 선박 운항 안전성 평가, 해양 연구, 기상 정보 기반의 예측 모델 구축, 해양사고 발생 시 원인 분석과 같은 분야에 활용될 수 있습니다.
