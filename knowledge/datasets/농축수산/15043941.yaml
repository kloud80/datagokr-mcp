description_portal: 이 데이터는 해양수산부에서 1990년부터 2023년까지의 내수면어업 생산량 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부가 관리하는 내수면어업(어로 및 양식 결과 포함)의 연도별 생산량 통계로, 생산량 단위는 톤으로 집계되어 있습니다. 각 연도별로 집계된 내수면어업 생산량 데이터를 통해 수산업의 시계열 변동을 확인할 수 있습니다.  본 데이터는 내수면어업 관련 정책 수립 및 평가, 내수면 수산 자원 관리 계획 수립, 내수면어업 발전 전략 연구, 어업인의 경영계획 수립, 학술 연구 수행 등에서 통계 자료로 활용될 수 있습니다.
