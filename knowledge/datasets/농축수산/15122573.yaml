description_portal: '농림수산식품교육문화정보원 농업온 시스템의 영농가이드 병충해 데이터는 농업 종사자와 관련 기관에서 효과적인 농작물 재배를 위해 필수적인 정보를 제공합니다. 이 데이터는 재배 순번, 영농 작물 번호, 병충해 유형 코드, 병충해명, 특징, 발생 시기 내용, 방제 내용 등 다양한 항목을 포함하고 있습니다. 이를 통해 농업인들은 특정 병충해에 대한 정확한 정보를 얻어 이를 예방하고 관리할 수 있는 기반을 마련할 수 있습니다. 또한, 이 데이터는 연구자들이 병해충 예방 연구를 진행하거나 교육 자료로 활용하여 농업 교육에 일조할 수 있도록 지원합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 재배순번(숫자형) : 각 농작물 별로 고유하게 부여된 순번입니다. 영농작물번호(숫자형) : 영농 작물의 분류에 필요한 고유 번호입니다. 병충해유형코드(숫자형) : 병충해의 분류를 돕기 위한 코드입니다. 병충해명(문자형) : 발생하는 병충해의 이름입니다. 특징(문자형) : 병충해의 외형적 및 생리적 특징에 대한 설명입니다. 발생시기내용(문자형) : 병충해가 발생하는 시기에 대한 구체적인 내용입니다. 방재내용(문자형) : 병충해를 방제하기 위한 방법과 제안사항입니다.'
