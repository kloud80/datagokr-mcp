summary_user: 전국 휴양림 186곳을 한 곳당 한 행으로 담은 표준데이터로, 휴양림명·구분·면적·수용인원·입장료·숙박 가능 여부·주요시설과 주소·좌표를 싣는다. 휴양림에서 숙박이 되는지, 입장료는 얼마인지, 우리 지역에 어떤 휴양림이 있는지 찾으려는 국민이나 산림 휴양 수요를 분석하는 사람이 쓴다. 소재지도로명주소(address)와 위도·경도(coord)를 키로 지도·주소 기반의 다른 산림 복지·휴양 데이터나 지역 데이터와 이어 쓰며, 휴양림 고유 코드는 필드에 없다.
limits: 범위는 미상이고 수록 기간은 2021-10-21~2026-08-11이며, 최신 행 날짜는 관측일 기준 52일 전이다. 이 데이터에는 예약 가능 여부나 실시간 이용 현황이 없고, 산불·산사태·임도·국유림 운영 같은 주제는 이 영역에서 다루지 않는다. 홈페이지주소도 주소 키로 잡히지만 지리적 조인에는 도로명주소와 좌표를 쓴다.
