description_portal: '광주광역시 남구 관내에서 운영 중인 동물병원 현황 및 정보(업소명, 소재지지번주소, 연락처)를 제공합니다.  해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2751)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 동물병원이란 동물진료업을 하는 장소로서 관할 관청에 신고한 진료기관을 의미하며, 진료업에는 동물의 질병 예방·진단·치료·수술, 건강증진, 번식 관련 관리 등이 포함되며, 상세한 주요 역할은 다음과 같습니다. - 질병 예방: 예방접종, 구충, 건강검진 등- 진단 및 치료: 각종 질병 진단, 수술, 입원 치료- 건강 관리: 영양·체중 관리, 재활 치료, 치과·피부 관리- 공중방역 지원: 가축 전염병 발생 시 방역 조치 참여- 교육 및 상담: 반려동물 양육·관리 지침 제공 동물병원 대한 정보는 "국가동물보호정보시스템(animal.go.kr)" 에서도 조회 가능하오니, 참고하시기 바랍니다.'
