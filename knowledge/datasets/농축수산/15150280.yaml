summary_user: '농림축산검역본부가 내는 가축전염병 발생정보로, 필드명으로 보아 발생연월·시도·질병·축종별로 발생 농가 수와 두수를 담은 전국 단위 비공간 통계입니다. 방역 담당자나 축산 분석가가 특정 질병(예: 구제역·조류인플루엔자)이 어느 해 어느 시도에서 몇 농가에 발생했는지 추이를 볼 때 쓰는 데이터입니다. 전역 조인 키는 실측에서 확인되지 않았고, 시도 코드·이름(CTPV_STDG_CD)이나 질병·축종 코드를 이름이나 코드로 매핑해 다른 시도별 축산 통계와 붙여야 합니다.'
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 농림축산검역본부에서 제공하는 연도별 가축전염별 발생정보입니다.
