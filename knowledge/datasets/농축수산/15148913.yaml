description_portal: 이 데이터는 해양수산부에서 공유수면매립준공_공간에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 공유수면매립명, 공유수면매립준공번호, 공간정보 데이터로 구성되어 있습니다.본 데이터는 공유수면매립준공 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면매립준공이란 바다, 하천, 호소 등 공공용으로 사용되는 수면이나 수류(공유수면)에 흙, 모래, 돌 등을 인위적으로 채워 토지를 조성하는 공유수면매립 공사가 끝나고, 관계 기관으로부터 공사 내용대로 잘 시행되었음을 확인받아 준공검사증을 받는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
