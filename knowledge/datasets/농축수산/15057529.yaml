summary_user: 경기도 31개 시군의 종계업(번식용 닭·씨알 생산) 사업장 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·소재지 주소와 면적·종업원 수·위경도를 포함한다. 축산 정책 담당자나 분석가가 경기도 어느 시군에 영업 중인 종계장이 몰려 있는지, 언제 폐업이 늘었는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)나 같은 경기도 데이터의 코드, 주소·위경도로만 다른 축산업 인허가 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 31개 시군의 종계업체에 대한 인허가 현황을 제공하며, 종계업은 번식용 닭(씨알)을 생산하거나 사육을 위탁해 판매하는 축산업의 한 형태입니다. 총 20개 항목으로 구성되어 있으며, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소 및 면적, 총 종업원 수, 축산업무구분명, 축산물가공업구분명, 위치정보(WGS84 위도·경도 포함) 등이 포함됩니다. 축산시설 분포 파악, 번식용 가축 관리 현황 분석, 지역 축산정책 수립에 활용될 수 있으며, 데이터는 행정안전부가 제공하며 Open API 형태로 접근 가능합니다. 다만 데이터 갱신은 2018년 9월 6일 이후 중단되었습니다.
