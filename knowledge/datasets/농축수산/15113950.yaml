description_portal: 이 데이터는 해양수산부에서 부산용도구역 내 환경생태계관리구역 정보를 제공하기 위해 수집한 파일 형식의 데이터입니다.  본 데이터의 주요 내용은 부산 지역의 해양용도구역 내 환경생태계관리구역의 공간정보번호, ID, 면적, 상세정보 등으로 구성되어 있습니다.  본 데이터는 해양 환경 보전 정책 수립, 어업 및 개발 행위 계획 시 참고자료, 해양 생태계 관련 연구, 부산지역 해양용도구역 관리 업무 수행에 활용될 수 있습니다. 법령 준수 여부 점검, 행정기관의 인허가 업무, 민간기업의 사업계획 수립 과정에서도 활용 가능합니다.
