summary_user: 전국 잠업 가구를 대상으로 양잠 형태별 생산, 누에 생산·판매, 양잠농가 소득 현황을 정리한 외부 파일 형태의 집계표이며, 시군구 같은 지역 단위가 아닌 전국 단위 통계다. 정책 담당자나 잠업 창업 희망자가 '기능성 양잠 농가의 소득 수준과 판매 구조가 어떤가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목·지역 이름을 직접 맞추거나 같은 기관(농림축산식품부) 자료끼리만 연결한다.
description_portal: 해당 데이터는 양잠 농가현황 관련 데이터로, 잠업에 종사하는 모든 잠업가구의 양잠형태별 생산 현황, 누에 생산, 판매현황 및 양잠농가 소득현황을 조회할 수 있는 서비스를 제공합니다. 이를 통해 잠업 산업의 규모와 구조, 생산 패턴뿐만 아니라 경제적 성과까지 종합적으로 파악할 수 있습니다. 특히 누에 생산 및 판매 현황과 연계하여 농가별 소득 수준을 분석함으로써 잠업 경영의 수익성, 시장 참여 현황, 생산 효율성을 평가할 수 있습니다. 이러한 데이터는 기능성 양잠 산업 발전, 신규 잠업 창업 지원, 생산 시설 개선, 소득 안정화 정책 마련 등 다양한 정책적·산업적 활용에 기초 자료로 활용될 수 있으며, 전국 양잠 농가의 체계적 관리와 잠업 산업 경쟁력 강화를 위한 필수 정보로 제공됩니다.
