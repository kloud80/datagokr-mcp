summary_user: 국립수산물품질관리원이 관리하는 수산물 대상물품의 기준 목록으로, 표준품목 코드와 국문·영문 품목명, HSK 코드, 수량 단위, 사용 여부를 품목 한 건씩 담는 전국 범위의 비공간 코드성 데이터다. 수산물 가격·유통 데이터를 다루는 분석가가 "이 표준품목 코드가 어떤 어종이고 HS 코드로는 무엇인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 기관의 수산물 유통 데이터와는 표준품목 코드(STD_ITEM_CD)나 품목명으로, 무역 통계와는 HSK 코드로 매핑해 이어 쓴다.
