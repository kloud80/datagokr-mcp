description_portal: '전라남도 해남군 내 산림면적현황에 대한 데이터입니다.이 데이터에는 2002년부터 2024년까지 침엽수림, 활엽수, 혼효림, 죽림, 미입목지, 황폐지, 개간, 제지 면적 항목을 제공합니다.해남군의 임야면적은 총면적 1,045.1 제곱킬로미터의 약 42%를 차지하고 있으며, 그 중 침엽수림은 약 56%, 혼효림 약 21%, 활엽수 약 17% 등의 순의 비율을 보임- 침엽수림: 침엽이 달린 구과식물로 구성된 숲의 총칭- 활엽수: 평평하고 넓은 잎이 달린 나무의 총칭- 혼효림: 두 종류 이상의 수종으로 구성된 산림- 미입목지: 전부터 입목이 없는 임지를 가리키는 말이며, 우리나라의 영림계획 작성기준에 따르면 임목도가 30% 이하인 임분을 뜻함* 해남통계연보'
