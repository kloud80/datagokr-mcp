description_portal: 본 데이터는 농림수산식품교육문화정보원이 운영하는 농업 정보 플랫폼 ‘농업ON’에서 제공하는 인기 품목 랭킹 자료입니다. 사용자의 관심도와 검색량을 기반으로 일정 기간 동안 수요가 높은 농산물 품목을 순위화한 정보로, 기준 월, 일, 품목명(종류), 순위(랭크), 품목 분류으로 구성되어 있습니다. 본 자료는 농산물 정보 서비스 기획, 계절별 수요 품목 분석, 트렌드 변화 예측, 소비자 관심 품목 도출 등에 활용됩니다. 또한 품목별 인기 변동 패턴을 바탕으로 맞춤형 콘텐츠 구성이나 홍보 전략 수립 등 사용자 중심의 서비스 개선에 기초자료로 제공될 수 있습니다. 데이터는 공공데이터포털을 통해 개방되며, 월별·품목별 사용자 관심도 흐름을 파악하는 데 유용한 자료입니다.
