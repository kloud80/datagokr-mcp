summary_user: 전국 대표 자조금 단체를 협회 고유번호(ASCT_SNO) 단위로 담은 외부 제공 데이터로, 포털 설명은 협회명·대표 품목·농가 수·납부 대상·산정 기준 같은 기초 현황을 안내하지만 실제 확인된 컬럼은 협회번호와 기준연도·구분코드·금액(SOA_AMT) 계열로 구성되어 있다. 농업 정책 분석가나 생산자단체 관계자가 품목별 자조금 단체가 어떤 규모로 운영되는지 연도별로 살펴볼 때 쓴다. 전역 조인 키는 없어 같은 기관이 낸 다른 자조금 데이터와 협회 고유번호로 잇거나, KAMIS 등 가격 데이터와는 품목명을 직접 매핑해서 연결한다.
