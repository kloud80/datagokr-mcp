description_portal: 해양수산부는 국내에서 수집·관리되는 해양생물 다양성 정보를 국제적으로 공유하기 위해 해양생물 다양성 정보시스템(OBIS, Ocean Biodiversity Information System)과 세계생물 다양성 정보기구(GBIF, Global Biodiversity Information Facility)에 데이터를 제공하고 있습니다. 이를 통해 우리나라 해역에서 채집된 다양한 해양생물의 출현기록, 분류학적 정보, 위치 정보 등이 전세계 연구자와 정책 담당자들에게 공개되어 국제적인 연구와 협력에 활용될 수 있습니다. 또한, 우리나라 해양생물 연구역량을 높이고, 기후변화 대응과 생물다양성 보전, 나아가 글로벌 해양정책 수립 등을 위하여 개방하고 있습니다.
