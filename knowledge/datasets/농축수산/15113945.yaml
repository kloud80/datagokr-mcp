summary_user: 해양수산부가 해양용도구역 최초 고시 대상인 부산용도구역 안의 어업활동보호구역을 구역 단위로 정리한 파일(csv, 약 6KB)로, 공간정보일련번호·용도구역아이디·면적·상세정보를 담는다. 해상풍력 등 해역 이용 입지를 검토하는 사업자나 분석가가 '부산 해역에서 어업활동보호구역으로 지정된 구역은 몇 곳이고 면적은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양용도구역 데이터와는 용도구역아이디(ua_id)나 구역 이름을 직접 맞춰 연결해야 한다.
description_portal: 이 데이터는 해양수산부에서 부산용도구역 내 어업활동보호구역 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해양용도구역 최초 고시 대상인 부산용도구역에 포함된 어업활동보호구역의 공간정보번호, ID, 면적, 상세정보 등으로 구성되어 있습니다.  본 데이터는 어업권 관련 정책의 기초자료로 활용할 수 있으며, 어업활동 보호 및 해역 이용계획 수립, 해양공간관리 방안 도출, 어촌계 및 어업인 대상 현황 분석, 관련 기관의 해양용도구역 관리 업무 지원 등에 활용될 수 있습니다.
