summary_user: 전국 공영도매시장 법인·공판장에서 경매 종료 후 출하자에게 정산된 최종 거래물량과 금액(최저가·최고가·평균가·총가격)을 정산일자·품목·법인 단위로 담은 건별 API이다. 농산물 구매 담당자나 유통 분석가가 특정 정산일에 어느 도매시장·법인에서 어떤 품목이 얼마에 거래됐는지 확인하는 데 쓴다. 도매시장·법인·품목(대·중·소분류)·등급·포장·산지·단위 코드는 한국농수산식품유통공사 농축수산물 표준코드 API로 이름을 확인해 이어 쓰며, 이 데이터 자체에는 전역 조인 키가 없다.
description_portal: '전국 도매시장법인과 공판장(전국 공영도매시장)에서 경매가 종료된 이후 출하자에게 정산이 이루어진 최종 거래물량, 거래금액 정보(최저가, 최고가, 평균가, 총가격)등의 정산정보를 제공합니다.도매시장 통합 홈페이지를 통해 제공하는 데이터입니다.★ API 명세서가 첨부되어있습니다. API 활용에 참고하실 수 있습니다. ★ 기존 도매시장통합 홈페이지에서 제공하던 API와 현재 공공데이터포털에서 제공 중인 API 간 컬럼 변경 내역도 동일 파일 내에 있으므로 이용에 참고하실 수 있습니다.* 도매시장 통합 홈페이지전국 32개 공영 도매시장의 다양한 정보를 한곳에 통합 제공하는 종합 플랫폼실시간 경매 현황부터 통계, 출하자 시스템, 지원 정책 등 광범위한 기능을 갖추고 있어, 농수산물 유통과 수급관리에 필수적인 디지털 인프라 역할 수행코드 정보는 한국농수산식품유통공사_농축수산물 표준코드 API를 조회 후 확인바랍니다. (https://www.data.go.kr/data/15141818/openapi.do)코드 종류 :whsl_mrkt_cd : 도매시장 코드corp_cd : 법인 코드unit_cd : 단위 코드sz_cd : 크기 코드plor_cd : 산지 코드pkg_cd : 포장 코드grd_cd : 등급 코드gds_lclsf_cd : 품목 코드 (대분류)gds_mclsf_cd : 품목 코드 (중분류)gds_sclsf_cd : 품목 코드 (소분류)* 요청파라미터 정산일자는 YYYY-MM-DD 형식으로 입력해야 정상적으로 처리됩니다.'
