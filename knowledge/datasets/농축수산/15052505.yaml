summary_user: 국립농산물품질관리원이 원산지 단속, 축산물이력, 양곡표시, 재사용 화환, GMO, 인삼류 미검사품 등 유통조사 업무별로 처분 연월·시도 단위의 조사장소 수, 위반업소 수, 형사처벌·고발·과태료 부과 건수를 모은 집계 현황이며 범위는 전국입니다. 소비자 단체나 분석가가 '어느 시도에서 원산지 표시 위반 적발과 과태료 부과가 많았나'를 업무 구분별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명(SD_NM)·처분연월 같은 이름·날짜 매핑으로만 잇는다.
description_portal: 농축산물 유통조사는 원산지단속, 축산물이력, 양곡표시, 재사용화환, GMO(유전자변형식품으로 인공적으로 유전자를 분리 또는 재조합하여 의도한 특성을 갖도록 한 농산물), 인삼류 미검사품 단속 등  조사하는 업무로서 국립농산물품질관리원에서 관리하는 농축산물 유통조사 현황 정보로서, 처분연월, 업무구분명, 시도명, 조사장소 수, 위반업소 수, 형사처벌 건수, 고발 건수, 과태료 부과 건수 항목으로 구성되어 있습니다. 원산지단속 등 농축산물 유통조사 업무에 관심이 많은 경우에 유용하게 활용할 것으로 기대됩니다.
