summary_user: 전국 100대 명산의 주요 봉우리를 관심지점(POI) 한 건씩 담은 데이터로, 숲길명·장소명·위도·경도·해발고도·장소유형·설명과 이정표 목적지(최대 4개) 및 방향 정보를 포함한다. 등산객이나 지도·관광 서비스 개발자가 '이 명산의 정상과 주요 봉우리는 어디이고 해발 몇 m인가'를 확인하거나 코스 고도 분석·탐방 지도 제작에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 숲길명·장소명 같은 이름 매칭이나 좌표(위도·경도) 기반 공간 결합으로 이어 쓰고, 숲길식별자(frtrlId)는 같은 기관의 숲길 데이터와 맞춰 보는 용도에 그친다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 전국 100대 명산의 주요 봉우리 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천장소유형명, 원천장소유형코드, 장소명, 설명내용, 기준일시, 원천조사진행방향명, 이정표목적지명, 원천이정표목적지방향명, 원천이정표목적지코드 정보를 호출할 수 있으며, 이를 활용하여 명산별 정상 위치 시각화, 코스 내 주요 봉우리 안내, 탐방로 고도분석, 관광지도 제작, GIS 기반 탐방경로 분석 등에 다양하게 활용할 수 있는 정보를 JSON+XML 포맷으로 지원합니다.
