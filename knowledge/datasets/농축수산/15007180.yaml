description_portal: 본 자료는 경기도 연천군 전역에 위치한 축산업 사업장의 등록정보와 사육 규모를 체계적으로 정리한 데이터로, 주로 행정·지도점검·정책 수립·지역 축산현황 분석에 활용될 수 있다. 데이터는 사업장명, 축산 인허가번호, 주 사육업종, 소재지 주소, 등록일자, 기준일자, 사육두수 등으로 구성되어 있어 각 농장의 운영 형태와 규모를 한눈에 파악할 수 있다. 사육업종은 한우, 육우, 젖소 등 대가축부터 돼지, 육계, 종계·산란계 등 중·소가축까지 다양하며, 이는 연천군 내 축산업이 품목별로 고르게 분포해 있음을 보여준다. 특히 육계 및 종계·산란계 농장은 수만 마리 단위의 대규모 시설이 존재하여 지역 단위 축산 생산량에서 큰 비중을 차지한다. 반면 한우·육우 농장은 비교적 소규모로 운영되며, 전곡읍·미산면·백학면 등 특정 지역에 집중되는 경향을 보인다. 등록일자는 대부분 2004년으로 동일 시기에 축산 인허가 정비 또는 일괄 등록이 이루어진 것으로 확인된다. 주소 정보는 리 단위까지 제공되어 현장 점검이나 GIS 기반 분석에도 활용 가능하다. 또한 사육두수는 실제 사육 현황을 반영하고 있어 방역·환경관리·정책 지원 시 필수 기초 자료가 된다. 본 데이터는 연천군의 축산업 구조를 객관적으로 파악하고, 지속가능한 축산정책과 지역 특성에 맞는 지원체계 구축에 중요한 기반자료로 활용될 수 있다.
