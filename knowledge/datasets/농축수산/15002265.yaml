summary_user: 연안포털에 올라온 공간자료·문서자료 게시물을 건별로 담으며, 자료 목록(자료구분·제목·내용·등록일자), 상세정보, 첨부파일 다운로드 정보의 세 오퍼레이션으로 나뉘는 전국 범위의 비공간 데이터다. 연안 개발 계획이나 환경 영향 평가를 준비하는 분석가가 '연안포털에 어떤 연안 관련 공간·문서 자료가 올라와 있고 첨부파일은 어디서 받는가'를 찾는 데 쓴다. 전역 조인 키는 없고, 목록과 상세·첨부파일 정보는 자료 일련번호(seqno)로 서로 잇되 다른 데이터와는 제목 등 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 연안포털 내의 공간자료와 문서자료를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 연안포털 자료제공 파일 다운로드 정보 현황, 리스트 정보 현황, 상세정보 현황으로 구분되어 있으며, 각각 파일 순번과 다운로드파일, 자료 순번화 일련번호, 자료구분과 제목, 내용 및 등록일자로 구성된 자료 리스트, 자료 리스트와 첨부파일 정보가 수록된 상세정보 현황으로 구성되어 있습니다.본 데이터는 연안 지역의 현황 파악, 연안 개발 계획 수립, 환경 영향 평가, 해양 생태계 연구 등에 활용될 수 있습니다.
