description_portal: 이 데이터는 해양수산부에서 MR 시도 및 선종을 기준으로 어선 세력 집계 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 통계 연도별로 시도 명칭(국문, 영문), 전체 어선 척수, 전체 어선 톤수, 전체 마력, 동력 및 무동력 어선의 척수와 톤수, 평균 톤수, 최종 변경 시점 등 정보로 구성되어 있습니다.  본 데이터는 시도 관계기관에서 어선 세력의 구조 및 변동 추이 분석, 어선 관련 정책 수립, 수산업 지원 사업 기획, 어선 등록 및 관리 체계 마련 등 행정 및 연구 등 활동을 위한 기초 자료로 활용될 수 있습니다.
