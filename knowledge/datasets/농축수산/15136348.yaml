summary_user: 전국 시도별로 통계 연도마다 어선 세력을 집계한 파일로, 전체·동력·무동력 어선의 척수와 톤수, 마력, 평균 톤수를 담는다(건별 어선 원장이 아닌 시도 단위 집계). 수산 정책 분석가나 지자체 담당자가 '우리 시도의 동력 어선 척수와 평균 톤수가 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 시도 코드가 없어, 다른 시도 단위 통계와는 시도명(국문·영문)과 통계 연도를 이름 매핑해서 붙여야 한다.
limits: 시도 단위 집계라 개별 어선 번호나 어업 허가·면허 단위로 내려가 분석할 수 없다. 표준 행정코드가 없어 시도명 표기 차이를 맞추는 매핑이 필요하다. 제목의 '선종 기준'과 달리 실측 필드에는 선종 구분 없이 동력·무동력 구분만 있다.
