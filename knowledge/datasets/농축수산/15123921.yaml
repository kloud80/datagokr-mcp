description_portal: 이 데이터는 농촌진흥청에서 운영하는 농업경영종합정보시스템의 ‘농가경영개선지원’ 사업 중 하나인 ‘농가경영컨설팅’ 관련 자료입니다. 해당 컨설팅은 전문 컨설턴트가 직접 농가를 방문하여 경영 현황을 점검하고, 맞춤형 경영개선 계획을 수립한 뒤 지도 및 자문을 제공하는 방식으로 진행됩니다. 본 데이터에는 컨설팅 대상 농가의 기본 정보와 진단 결과, 수립된 컨설팅 계획, 단계별 지도 내용, 사후관리 계획, 그리고 컨설팅의 성과 평가 내용 등이 포함되어 있어 농가의 경영개선 활동 전반을 종합적으로 파악할 수 있습니다.
