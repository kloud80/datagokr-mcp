description_portal: 산림청 산림항공본부 항공기유류정보 데이터입니다. 산림항공본부에서 운용하는 산림헬기의  항공유 공급 및 수령에 따른 수령소속(본부 및 관리소), 수령호기, 기종, 수령날짜, 잔량, 유류종류, 공급기관(산림항공본부/외부기관), 공급소속정보를 제공합니다. 소속 및 호기별 항공유 잔량(단위:L)을 누적 관리하기 위한 데이터로, 산림헬기 점검을 위해 엔진을 가동 후 별도 항공유 공급을 하지 않을 경우 공급기관, 공급소속은 공란으로 처리됩니다.  공급기관이 외부기관인 경우 공급소속은 공란으로 처리됩니다.
