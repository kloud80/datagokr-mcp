description_portal: 해양환경공단이 관리하는 어촌계 방제대응센터의 운영 현황과 방제기자재 목록 정보를 제공합니다. 본 데이터는 전국 연안 어촌계에 설치된 방제대응센터의 위치, 설치연도, 주요 기능, 운영 현황과 함께 보유 중인 방제기자재의 종류, 수량, 용도 등을 포함하고 있습니다. 방제기자재에는 유흡착제, 방제유흡착포, 방제복, 방제기계류 등이 포함되며, 해양오염 사고 발생 시 신속한 대응과 지역 방제 역량 강화를 목적으로 활용됩니다. 본 자료는 해양오염 대응 체계 분석, 정책 수립, 장비 보급 계획 수립, 지역 방제역량 평가 등에 기초자료로 제공됩니다. 데이터는 표 형식으로 제공되며, 공공기관, 지자체, 연구기관 등에서 활용됩니다.
