description_portal: 제주특별자치도개발공사가 관리하는 감귤복합처리가공 시설 운영 현황으로 감귤복합처리가공시설에서 생산되는 생산품별(농축액)생산량 현황 정보입니다.이는, 도내 감귤 생산과정에서 발생하는 상품성이 떨어지는 감귤을 가공처리하여 농축액 제품으로 제조하여 판매하고 있습니다.감귤농축과정으로 비상품감귤 입고 후 검사, 세척, 착즙, 오일분리, 원심분리, 살균, 농축, 충전, 포장 순으로 제조하여 제품을 제조하는 생산량 정보입니다. 농축액 제품 생산은  가공용 감귤 수매 시기에 맞춰 매년 10월부터 이듬해 2월까지 제품을 생산하고 있습니다.
