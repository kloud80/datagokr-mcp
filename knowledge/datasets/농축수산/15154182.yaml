description_portal: 고농서용례 정보는 농업과학도서관 소장 고농서에 사용된 용어를 활용한 도서와 활용영역을 관리합니다.용례는 용어가 수록된 부분과 용어의 한글명과 한자명을 표기하여 관리하고 있습니다.데이터의 발생과 관리시점은 농업과학도서관에서 자체기획하여 고문헌 분석 후 자료추출, 자료검증 등의 작업을 거친 후 입력합니다.현재 등록된 데이터는 고농서 47권을 분석하여 도출한 농업용어와 용례를 기록하였습니다.고농서 47권은 22권의 문헌으로 분류하여 관리하고 있습니다.등록된 전체 용어는 4,645건입니다.등록된 용어의 활용 자료는 13,913건 입니다.고문헌 명과 권차, 문헌제목 항목을 데이터로 관리합니다.* 실제 기술된 문헌명과 농업과학도서관 북큐레이션을 매핑하여 데이터를 관리
