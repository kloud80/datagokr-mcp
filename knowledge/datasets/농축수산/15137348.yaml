description_portal: 농촌진흥청은 농업인의 안전한 영농활동을 지원하기 위해 현장에서 발생할 수 있는 다양한 위험요인을 사진 정보와 함께 제공하는 서비스를 운영하고 있습니다. 농기계 사용, 농작업 환경, 농약 취급 등에서 발생할 수 있는 잠재적 위험 상황을 시각적으로 보여줌으로써 농업인이 쉽게 이해하고 대비할 수 있도록 돕습니다. 이를 통해 단순한 문자 정보보다 직관적으로 위험성을 인식할 수 있으며, 안전 수칙을 지키고 사전에 예방 조치를 취하는 데 실질적인 도움을 줍니다. 농촌진흥청은 이 서비스를 통해 농업재해를 줄이고, 보다 안전한 농작업 환경을 조성하여 농업인의 건강과 생명을 보호하는 데 앞장서고 있습니다.
