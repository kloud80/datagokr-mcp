description_portal: 데이터는 경기도 화성시에 위치한 포도 재배 스마트팜 농장의 토성 특성을 분석한 자료로, 농장별로 측정된 주요 토양 구성비 정보를 포함한다. 항목에는 설치년도, 모래비율, 미사비율, 점토비율 및 이를 기반으로 산출한 토성 분류값이 포함되어 있으며, 농장별 토양 물리적 특성을 비교·분석할 수 있도록 구성되어 있다. 데이터는 토양 환경에 따른 작물 생육 적합성 판단, 맞춤형 영농설계, 농장 단위의 토양관리 방향 설정 등에 활용 가능하다. 농장별로 토양 특성의 정량적 지표를 제공하여, 스마트팜 기반의 정밀 농업 실현을 위한 기초자료로 사용될 수 있다. 분석 시점 기준으로 수집된 1회성 자료이며, 토양환경 연구, 농업기술 지원, 농가 컨설팅 등 다양한 분야에서 참조 가능하다.
