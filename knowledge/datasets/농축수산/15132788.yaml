summary_user: 전라남도 어장도관리시스템에 실린 도로명 정보를 도로명 한 건마다 한 행으로 담은 파일로, 부여일자·부여사유·고시일자·기점·종점·도로폭·도로길이·도로명심의일자·제정권자를 포함하며 범위는 시도, 단위는 개별 주소입니다. 어장도 관련 위치를 확인하는 어업인이나 분석가가 특정 도로명이 언제 어떤 사유로 부여·고시되었고 어디서 어디까지 이어지는지를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 이름 매핑이나 같은 기관 자료로만 연결된다.
description_portal: '- 전라남도 어장도관리시스템에 게재된 도로명주소 정보(부여일자, 부여사유, 고시일자, 기점, 종점, 도로명심의일 등)에 대해 조회하실 수 있습니다.- 전라남도 어장도는 전라남도의 해양수산청이 관리하는 어업 면허 구역을 의미합니다. 이는 어업 활동의 합법성과 관리 효율성을 높이기 위해 설정된 해상 구역으로, 어업 면허를 취득한 어선만이 해당 구역에서 어업 활동을 할 수 있습니다.- 어업인 : 어업 면허를 취득하려는 어업인은 해당 구역의 면허 조건과 위치를 확인하여 신청할 수 있습니다.- 연구자 및 정책 담당자 : 어업 활동의 분석 및 정책 수립을 위해 어장도 정보를 활용할 수 있습니다.- 일반 시민 : 어업 활동에 대한 이해를 높이고자 하는 시민들은 어장도 정보를 통해 어업 구역의 분포와 특성을 파악할 수 있습니다.'
