description_portal: 부산광역시 화명수목원은 다양한 주제원으로 구성되어 있으며, 각 구역별로 식재된 수종에 대한 현황 데이터를 제공합니다. 관리사 주변, 침엽수원, 수서생태원, 중앙광장, 화목원, 활엽수원, 사계정원, 초화원, 전시온실 등 총 12개 주제원에 대해 목본류와 초본류의 종수 및 본수 데이터를 구분하여 수록하였습니다. 특히 수량 데이터는 식물의 생육형에 따라 상록교목, 낙엽교목, 상록관목, 낙엽관목, 상록덩굴, 낙엽덩굴, 일년생초본, 다년생초본으로 세분화하여 집계함으로써 식생 구조를 보다 명확하게 파악할 수 있도록 하였습니다.
