summary_user: 국가해양관측망(조위관측소·해양관측부이 등)에서 관측한 실측 파랑(파고·파주기·파향)을 관측소별 좌표와 관측일시와 함께 담는다. 연안 낚시·레저 안전이나 해상 작업 일정을 잡을 때 '지금 이 해역의 파고가 얼마인가'를 확인하는 질문에 쓴다. 관측소 위도(lat)를 좌표 키로 삼아 다른 위치 기반 데이터와 잇고, 바다누리 관측소코드로 같은 기관의 다른 관측·예보 데이터와 연결한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 국가해양관측망(조위관측소, 해양관측소, 해양관측부이, 해양과학기지, 해수유동관측소)을 통해 관측된 파랑(파고, 파주기, 파향) 데이터를 제공하기 위해 수집한 데이터 입니다.관측소 코드, 관측일자 등 값을 파라미터로 데이터를 조회할 수 있으며,본 데이터의 주요 내용은 관측소명, 관측일시, 관측소의 위도/경도 위치 정보 및 실측 파랑(파고, 파주기, 파향) 값 정보로 구성되어 있습니다.본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
