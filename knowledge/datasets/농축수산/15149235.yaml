summary_user: 전국 연안바다목장 시설을 개별 지점 단위로 담은 파일(csv, 약 7KB)로, 시설년도·어초 개수·어초 분포면적·시설물량과 도분초 및 십진 위경도 좌표, 공간정보를 함께 담는다. 해양공간계획이나 해상풍력 등 입지를 검토하는 분석가·행정 담당자가 "후보 해역 근처에 이미 조성된 바다목장과 인공어초가 있는가, 언제 얼마나 설치됐는가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키는 없어, 위경도 좌표로 해양용도구역·보호구역 같은 다른 해양공간 데이터와 공간 중첩해 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 연안바다목장에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 시설년도, 어초개수, 어초분포면적, 시설물량, 도위도, 분위도, 연안바다위도도경도동서구분코드, 연안바다목장도경도, 분경도, 초경도, 연안바다목장위도, 연안바다목장경도, 공간정보 데이터로 구성되어 있습니다.본 데이터는 연안바다목장 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.연안바다목장이란 어장의 수산자원을 회복하고 증대시키기 위해 특정 해역에 인공 구조물 등을 설치하여 수산생물들의 산란장 및 서식지를 조성하고, 건강한 종묘를 대량 방류하며, 생태계 복원과 환경 개선을 통해 어업인 소득 증대 및 어촌 활성화를 도모하는 사업을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
