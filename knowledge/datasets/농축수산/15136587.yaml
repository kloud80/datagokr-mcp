description_portal: 본 데이터는 농림수산식품교육문화정보원이 제공하는 ‘농업ON’ 경락가격 시각화 서비스에서 활용되는 경락가격 분류 체계에 대한 정보이다. 도매시장에서 거래되는 주요 농산물의 가격 정보를 체계적으로 구분하고 분류함으로써 사용자에게 보다 명확하고 일관된 가격 정보를 제공하는 데 목적이 있다. 품목별·시장별·시기별 경락가격을 분류 기준에 따라 재구성함으로써, 데이터 분석의 효율성과 시각화 정확도를 높인다. 이 분류 체계는 농산물 유통 구조를 이해하고, 수급 동향 및 가격 흐름을 분석하는 데 있어 기반 자료로 활용될 수 있으며, 농업인, 연구자, 정책입안자 등 다양한 수요자의 정보 접근성과 활용도를 증진시킨다. 직관적인 시각화를 통해 농업 정보 서비스의 전문성과 공공성을 강화하는 데 기여한다.
