description_portal: 본 데이터는 제주특별자치도 제주시 관내 각 읍·면·동별 감귤 재배 규모와 생산 실적을 연도별로 상세하게 기록한 공공 통계 자료입니다.해당 데이터셋은 특정 연도에 제주시를 구성하는 하위 행정구역(한림읍, 애월읍, 조천읍 등) 단위로 감귤 농업의 규모를 세밀하게 추적합니다. 각 지역별로 실제 감귤 농사가 이루어진 토지의 크기를 나타내는 "재배면적(ha)"과 그곳에서 최종적으로 수확된 감귤의 총 "재배량(톤)" 수치를 제공하고 있습니다.이를 통해 제주시 전체의 감귤 생산 인프라가 어떤 읍면동 지역에 집중되어 있는지 공간적 밀집도를 명확히 파악할 수 있습니다. 또한, 연도별 데이터 흐름을 추적하여 특정 지역의 감귤 재배 면적 증감 추이를 확인하거나, 단위 면적(ha) 당 재배량(톤)을 계산하여 각 행정구역별 감귤 농가의 생산성 변화를 비교 분석해 볼 수 있습니다. 지역별 농업 특성의 차이를 이해하고, 제주시 감귤 산업의 공간적 분포 변화를 모니터링할 수 있는 기초 데이터입니다.
