description_portal: 데이터는 경기도 화성시 관내 포도 스마트팜 농가의 수확기 지습 상태를 측정하여 기록한 자료이다. 항목에는 농가번호, 농장번호, 그리고 스마트센서를 통해 측정된 지습 값이 포함되며, 작물의 생육에 직접적인 영향을 미치는 토양 수분 상태를 정량적으로 파악할 수 있도록 구성되어 있다. 본 자료는 수확기를 전후로 하여 수집된 데이터로, 포도 재배지의 수분 분포와 수확 시기 간의 상관관계를 분석하는 데 활용 가능하다. 또한 농장별 토양 수분의 편차를 비교 분석함으로써 수분 과잉 또는 부족에 따른 생육 문제를 사전에 예측하고 관리 방안을 마련할 수 있다. 스마트팜 기술을 통해 실시간으로 수집된 정보로, 과학적 재배 환경 조성과 생산성 향상을 위한 기반 자료로 제공된다. 표준화된 데이터 구조와 식별 정보가 포함되어 있어 사용자 중심의 활용이 용이하며, 공공데이터 이용자의 이해도와 접근성을 높이기 위한 체계적인 정보 제공을 목표로 한다.
