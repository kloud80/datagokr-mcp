summary_user: 전국 과실류 가공 현황을 사과·배·복숭아·포도·감귤 등 과종별 한 행으로 묶고, 2003~2009년 연도별 생산량·가공량(천톤)과 가공 비율(%)을 열로 담은 집계표이며 지역 구분 없는 전국 단위다. 과종별로 생산량 중 가공에 쓰인 비중이 해마다 어떻게 바뀌었는지 알고 싶은 가공업체·정책 분석가가 쓴다. 전역 조인 키가 없어서 다른 생산·가격 통계와는 과종 이름을 직접 맞춰 이어야 하며, KAMIS·도매시장·KOSIS 품목코드와 붙이려면 별도 매핑이 필요하다.
description_portal: 해당 데이터는 전국 과실류 가공업체를 대상으로 사과, 배, 복숭아, 포도, 감귤, 유자, 매실, 복분자, 머루, 감, 오디 등 다양한 과종품과 기타 과실에 대한 생산량 및 가공실적 통계조회 서비스입니다. 이를 통해 과실류 가공업체의 품목별 생산 규모, 가공량, 연간 실적 변동 등을 체계적으로 확인할 수 있으며, 지역별, 품목별 산업 현황 파악에도 활용 가능합니다. 해당 자료는 과실류 가공산업의 현황을 종합적으로 이해하고, 과실류 가공품 개발, 판로 확대, 농가 소득 증대 및 정책 수립, 산업 경쟁력 강화 등 실무적 의사결정을 지원하는 기초 자료로서 중요한 가치를 갖습니다.
