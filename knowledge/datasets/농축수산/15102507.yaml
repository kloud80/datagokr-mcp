summary_user: 국립농산물품질관리원이 지정한 친환경·무항생제 인증기관의 지정 현황을 기관 1곳당 한 행으로 담으며, 구분·지정번호·지정일자·기관명·소재지·전화번호·인증범위를 전국 범위로 제공한다. 친환경 또는 무항생제 인증을 받으려는 농가·축산 사업자가 "우리 지역에서 이 품목을 인증해 주는 지정 기관이 어디이고 연락처는 무엇인가"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 인증기관명·소재지 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 친환경농축산물은 생물의 다양성을 증진하고, 토양에서의 생물적 순환과 활동을 촉진하며, 농업생태계를 건강하게 보전하기 위하여 합성농약, 화학비료, 항생제 및 항균제 등 화학자재를 사용하지 아니하거나 사용을 최소화한 건강한 환경에서 생산한 농축산물을 말하고 무항생제축산물 인증제도는 소비자에게 보다 안전한 축산물을 공급하기 위해 국립농산물품질관리원에서 지정한 인증기관에서 엄격한 인증기준으로 심사하여, 정보가 그 안전성을 인증해주는 제도로 본 정보는 친환경 및 무항생제 인증기관 지정에 관한 현황으로서, 구분, 지정번호, 지정일자, 인증기관명, 인증기관소재지, 전화번호, 인증범위 항목으로 구성된 데이터입니다.
