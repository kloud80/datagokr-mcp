description_portal: 동물용의약품 품목허가 현황은 농림축산검역본부가 동물용의약품에 대해 제조 수입허가한 내역입니다.동물용의약품은 동물용으로만 사용함을 목적으로 하는 의약품이며 약사법 제31조2항에 따라 제조업자가 제조한 의약품을 판매하려는 경우에는 제조판매품목허가 또는 제조판매품목 신고를 받아야 합니다.자료 출처는 동물용의약품정보시스템이며, 추출 기준은 2025년까지 허가된 사항 입니다.데이터는 허가번호(제품별 허가될때 부여된 번호), 업체명, 용도(동물용의약품,의약외품), , 품목명(제품 명칭), 영문품목명, 허가일, 업종(제조,위탁제조,수입업체 명칭)으로 구성되어 있습니다.최근 허가사항은 https://medi.qia.go.kr/searchMedicine 에서 확인하실 수 있습니다.
