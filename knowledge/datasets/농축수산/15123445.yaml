description_portal: 이 자료는 농촌진흥청이 운영하는 **농업경영종합정보시스템(AMIS)**에서 제공하는 농업회계 프로그램 **‘회계박사’**의 질의응답 게시판에 게시된 정보를 수록한 데이터입니다. 회계박사 프로그램은 농업경영체의 회계 관리 및 재무 기록을 지원하기 위한 도구로, 사용자는 해당 게시판을 통해 회계 처리 방법, 기능 활용, 오류 발생 시 대처 방법 등 다양한 문의를 등록할 수 있습니다. 본 자료는 사용자들이 작성한 질문 내용과 그에 대한 관리자 또는 운영기관의 답변으로 구성되어 있으며, 게시일자, 작성자, 답변 여부, 관련 기능 또는 회계 항목 등 다양한 항목을 포함합니다. 이 자료는 회계 실무 과정에서의 문제 해결과 사용자 간 정보 공유를 촉진하고, 프로그램 개선 및 사용자 교육 자료로도 활용됩니다.
