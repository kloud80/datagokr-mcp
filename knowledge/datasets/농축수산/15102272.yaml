description_portal: 한국수목원정원관리원은 식물 및 관련 병원체의 유전자 정보를 국제적으로 등록한 현황을 정리한 「유전정보 등록 현황 데이터」를 공공데이터로 제공하고 있습니다. 이 데이터는 국립백두대간수목원 연구진이 확보한 바이러스 유전자 및 식물엽록체 유전정보  등의 등록 정보를 담고 있으며, 각 등록 건별로 순번(No),등록정보,저자(모두기록),소속,가입번호(accession no)등의 항목을 포함하고 있습니다.데이터에는 Carnation Italian ringspot virus, Soybean yellow common mosaic virus, Cucumber mosaic virus, Beet western yellows virus, Clover yellow vein virus, Apple stem grooving virus, Actinidia yellowing ringspot virus 등 다양한 바이러스 유전자 등록 사례와 함께 Allium 속(분취, 산달래, 참산달래, 두메부추 등)과 Trichophorum 속 식물의 엽록체 게놈 정보가 포함되어 있습니다. 이를 통해 국립백두대간수목원이 수행한 식물 병원체 연구 및 자생식물 유전 자원의 다양성 보존 노력을 확인할 수 있습니다.데이터는 CSV 형식으로 제공되며, 주요 항목은 순번, 등록정보(유전자 또는 게놈 등록 명칭), 저자(연구자명 전체 기록), 소속, 가입번호(Accession No)로 구성되어 있습니다. 현재 공개된 데이터에는 등록일자, 단백질 기능, 등록유형 등은 포함되어 있지 않으며, 등록번호를 통해 국제 염기서열 데이터베이스(DB)에서 원문 서열 정보를 확인하실 수 있습니다.본 데이터는 식물 유전자원의 보존과 연구 성과의 공유를 목적으로 하며, 바이러스 유전자 정보, 식물 엽록체 게놈 연구, 자생식물 유전 자원의 특성 규명 등에 활용될 수 있습니다. 또한 생물다양성 연구, 병해저항성 분석, 분자생물학적 기초 연구 등 다양한 학술 및 산업 분야에서 기초자료로 활용될 수 있습니다.
