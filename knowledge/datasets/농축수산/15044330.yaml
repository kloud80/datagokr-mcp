summary_user: 한국농어촌공사가 관리하는 전국 양배수장을 시설 한 곳당 한 행으로 담은 제원 파일로, 시설명·소재지·착공·준공년도·종별과 유역·홍수·만수·수혜면적(ha), 최대양수량·배수량(㎥/sec), 건물 규모를 담는다. 농업용수 분석가나 지자체 담당자가 특정 지역 양배수장의 수혜면적과 양·배수 능력, 준공 시기를 확인해 노후 시설이나 배수 취약 지역을 따질 때 쓴다. 표준시설코드(dam_cd)가 조인 키라 같은 코드를 쓰는 한국농어촌공사의 다른 농업기반시설 데이터와 이어 쓰고, 소재지 주소로 행정구역 단위 자료와 맞춘다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 양배수장에 대한 데이터 입니다.- 양배수장은 농경지에 물을 공급하고 과도한 물을 배수하는 시설로 농업 생산성을 높이는데 기여합니다.- 지하수 또는 수면에서 물을 양수하여 농경지에 공급하는 양수 기능과, - 강우나 홍수로 인한 과도한 물을 배수하여 농경지의 수위를 적절히 유지하는 배수 기능을 가지고 있습니다.- 본 데이터는 양배수장에 대한 기본정보(표준시설코드,시설명,소재지,착공년도,준공년도,종별,구분,유역면적,홍수면적,만수면적,수혜면적 등)를 제공합니다.<단위>면적 : ha빈도 : 년양수량/배수량: ㎥/sec건물폭: m건물넓이: ㎡건물높이: m층수: 층- 해당 데이터는 시설 관리, 농업 생산성 분석, 환경 모니터링 등에 활용 가능합니다.'
