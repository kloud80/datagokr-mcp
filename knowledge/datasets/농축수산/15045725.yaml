summary_user: 2015년 제·개정된 농축수산물 표준코드의 부류·품목·품종 코드와 같은 뜻을 가진 2013년 표준코드를 한 행씩 짝지어 담은 코드 대응표로, 신·구 코드와 명칭, 업데이트일자를 담는다(CSV 약 1.4MB, 전국·비공간). 유통업체나 분석가가 과거 2013년 코드로 쌓인 가격·거래 자료를 현재 표준품목코드로 옮겨 시계열을 이을 때, 옛 품목코드가 지금 어떤 코드인지 확인하는 데 쓴다. 전역 조인 키는 없으며, 부류·품목·품종 코드나 품목명을 매개로 같은 기관의 KAMIS 가격·품목코드 데이터와 연결한다.
description_portal: 본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘농수축산물 신구표준품목목록’에 대한 상세 정보이다. 2015년 제·개정된 농축수산물 표준코드의 품목코드(부류, 품목, 품종)와 동일한 의미를 가지는 2013년 농축수산물 표준코드의 품목코드(부류, 품목, 품종)를 나타낸 정보로, 각 품목의 신구 표준코드, 품목명, 부류명, 품종명, 업데이트일자 등의 항목으로 구성되어 있다. 해당 데이터는 농축수산물 유통 및 거래 시 과거와 현재의 품목코드 간 매핑 정보를 제공하여, 데이터 연계 및 분석에 활용될 수 있다. 특히, 과거 품목코드와 명칭을 현재의 표준품목코드와 비교 제공함으로써, 시스템 간 호환성과 이력 관리의 정확성을 높이는 데 기여한다. 데이터는 CSV, XML, JSON 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 오픈 API 형태로 활용 가능하다
