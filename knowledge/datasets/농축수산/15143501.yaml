summary_user: 국립수목원 국가생물종지식정보시스템의 버섯 자원을 버섯도감 목록·상세와 버섯표본 목록·상세로 나눠 제공하며, 종별로 학명·국명·과·속 분류와 표본 수(cnt)를 담는다. 버섯 연구자나 생태교육·숲 해설 담당자가 특정 버섯의 학명과 과·속 분류, 국내 표본이 몇 건 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 학명·국명 같은 이름 매핑으로 잇고, 상세 조회는 목록에서 받은 버섯종ID(fngsId)나 도감번호를 넘겨 이어 쓴다.
description_portal: 국립수목원 국가생물종지식정보시스템의 버섯 자원 메뉴에서 항목별 정보 및 상세정보를 제공하는 서비스로 버섯도감 목록 검색, 버섯도감 상세정보 조회, 버섯표본 목록 검색, 버섯표본 상세정보 조회를 하는 오퍼레이션으로 학명, 국명, 채집정보, 도감정보 등의 항목이 제공됩니다.
