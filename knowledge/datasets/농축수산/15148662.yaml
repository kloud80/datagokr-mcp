description_portal: 이 데이터는 해양수산부에서 바닷가포락지기본에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은  포락지시도명, 포락지시군구명, 포락지읍면동명 데이터로 구성되어 있습니다.본 데이터는 바닷가포락지기본 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바닷가포락지란 지적공부에 등록된 토지가 바닷물이나 하천의 침식 작용으로 인해 물속으로 잠겨 원상 복구가 어려운 상태가 된 땅을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
