description_portal: '본 데이터는 한국농어촌공사에서 수행하는 농촌현장포럼 사업의 대상 마을에 대한 종합적인 정보를 포함하고 있습니다.농촌현장포럼은 지역 주민이 주도하여 마을 문제를 발굴하고 해결방안을 모색하는 주민참여형 지역개발 사업입니다.데이터는 포럼 정보, 마을 개요, 자랑거리, 인구 통계, 자연마을 구성, 정주여건, 소득원, 토지 이용 현황, 마을 대표 정보 등 농촌 마을의 현황과 특성을 종합적으로 담은 자료로 구성되어 있습니다.아래는 제공되는 데이터의 주요 항목에 대한 정보입니다. [주요 항목]1) 포럼 정보: 포럼 제목, 설명, 유형, 주체, 시작일 등2) 마을 기본 정보: 마을명, 주소, 소재지 접근성, 자연마을 수, 마을 유래, 대표자명 등3) 인구·가구 정보: 연령대별 성별 인구수, 다문화 가구 현황, 1인가구 수 등4) 마을 특성: 자랑거리(볼거리, 먹을거리, 체험 등), 빈집 수, 슬레이트 주택 수, 귀농·귀촌 인구 등5) 생활 여건 및 안전: 정주 여건, 생활 인프라 보급, 안전성, 환경 경관 등6) 소득원: 주요 산업 및 경제활동 분포 등7) 토지 현황: 전, 답, 과수원, 임야, 대지 면적 등* 마을 대표자명은 개인정보이므로 비식별화 처리 되었습니다. *  해당 지역에 자연마을이 여러건 등록되어 있을 경우 등록된 자연마을의 수에 따라 여러행이 출력될수도 있습니다.'
