summary_user: 사업연도별 기본형 공익직불금(소농직불금·면적직불금) 지급 결과를 전국 단위로 집계한 표로, 지급액(억원)·지급면적(천ha)·지급인원(천호·천명)을 담는다. 정책 분석가나 농업 연구자가 해마다 기본직불금이 얼마나, 몇 농가에, 어느 정도 면적에 지급됐는지 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업연도나 같은 기관 자료의 이름 매핑으로만 맞춰 쓴다.
description_portal: 농림축산식품부_공익직불금 지급 데이터(Ministry of Agriculture, Food and Rural Affairs_Public Interest Direct Payment Data)- 해당 데이터는 사업연도별 기본형 직불금 지급 결과임- 기본직불금은 소농직불금과 면적직불금으로 구분되어 지급 되는데, 소농직불금은 농가당 130만원("24년~) 지급, 면적직불금은 면적별 지급 단가를 적용하여 지급 됨 * 소농직불금은 기본직불금 요건 외 7가지 요건을 추가 충족하여야 지급되며, 농가당 지급되는 점이 면적직불금과 차이가 있음 ** 소농직불금과 면적직불금은 중복으로 지급 불가
