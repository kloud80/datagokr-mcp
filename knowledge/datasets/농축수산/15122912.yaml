summary_user: 경기농정통합시스템에 등록된 경기도 내 먹거리 관련 시민단체를 단체 한 곳당 한 행으로 담은 원천 목록으로, 단체명·소재지·주소·회원수·설립목적·설립일·주요사업·단체유형(복지단체, 식생활교육단체, 사회적기업, 생협·협동조합 등)·등록/수정일시를 담는다. 지자체 먹거리 정책 담당자나 연구자가 "우리 시군에서 식생활교육이나 공공급식 개선 활동을 하는 단체가 어디이며 규모는 어느 정도인가"를 확인하고 협력 단체 네트워크를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소의 시군명이나 단체명 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기농정통합시스템을 통해 수집된 먹거리 관련 시민단체 정보로, 경기도 내 다양한 시민단체의 명칭, 소재지, 주소, 회원수, 설립목적, 설립일, 주요사업, 단체유형, 등록일시 및 수정일시 등의 정보를 포함합니다. 시민단체의 유형은 복지단체, 식생활교육단체, 사회적기업, 생협 및 협동조합 등으로 구분되며, 각 단체는 건강한 먹거리 유통, 식생활 교육, 공공급식 개선, 사회적 돌봄 등 다양한 분야에서 활동하고 있습니다. 이 데이터는 지역사회 내 먹거리 체계 및 정책 수립, 시민단체 네트워크 분석, 먹거리 정의 실현을 위한 기초자료로 활용될 수 있으며, 공공기관 및 연구기관, 지자체의 먹거리 관련 정책 마련에도 유용하게 사용될 수 있습니다.
