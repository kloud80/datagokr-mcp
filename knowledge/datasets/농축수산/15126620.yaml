description_portal: 이 데이터는 해양수산부에서 FAO어선집계 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 조사년도별로 선망기타, 선망어선, 준설어선, 기타어선, 연승기타, 연승어선, 통발어선, 자망어선, 다목적어선, 트롤어선, 합계와 관련된 어선의 집계 값과 함께 최초 및 최종 생성시점, 생성자, 변경자, 어선통계코드, 어선통계구분 등의 정보를 포함하고 있습니다.  본 데이터는 어선 종류별 규모 분석, 어선 수 변화 모니터링, 어업 정책 수립, 해양 및 수산 연구 자료로 활용될 수 있습니다. 또한 각 어선 유형의 비중 변화 추적이나 어업 구조 개선 방안 마련, 국제기구 제출용 통계자료 산출 등에 사용할 수 있습니다.
