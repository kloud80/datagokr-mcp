description_portal: 'O 공공데이터 설명 대상작목 : 마늘  - 2021년 : 마늘(21농가)O 대상항목 : 지상부 생육정보, 지하부생육정보, 농가정보  - 지상부 항목 :  초장, 잎끝고사장, 엽초장, 엽초경    . 초장 : 마늘 최장엽의 총 길이(고사 부위를 제외한 전체길이)    . 잎끝고사장 : 초장을 측정한 잎의 고사된 부분의 길이    . 엽초장 : 구의 윗단면부터 잎이 분열되고 있는 지점까지의 길이    . 엽초경 : 지상부 비대구 끝 상부 1cm 지점의 두께  - 지하부 항목 : 구직경, 1주무게, 생구무게, 건구무게    . 구직경 : 구가 비대되는 부분의 최대 직경    . 1주무게 : 수확 직후 뿌리를 제거한 개체의 무게    . 생구무게 : 경엽과 경엽을 제거한 지하부의 비대된 구의 무게    . 건구무게 : 생구무게 * 0.75O 대조사구 명칭-지상부 : B1,B2,B3(조사시 마다 같은 조사구 연속조사)-지하부 : R011,R012.R013(파괴조사로 조사시 마다 다른 조사구 조사)'
