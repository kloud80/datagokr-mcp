description_portal: 국립산림과학원에서 운영하는 청량 아시아 산림 미세먼지 측정넷(AICAN)은 전국 산림 및 도시숲 내(1개소별 3지점으로 구성)에서 관측하고 있음. 타워형은 숲 높이별(숲 내-외부) 비교, 평지형은 오염원과 숲과의 비교 관측을 진행하고 있으며, 숲의 미세먼지 저감 효과를 정량적으로 분석하기 위해 미세먼지(PM10, ㎍/㎥), 초미세먼지(PM2.5, ㎍/㎥), 극초미세먼지(PM1.0, ㎍/㎥), 그리고 미기상 자료인 온도(℃), 습도(%), 풍향(degree), 풍속(m/s), 기압(hPa) 농도를 실시간으로 측정 및 분석하여 10분단위 결과를 월단위로 제공함.
