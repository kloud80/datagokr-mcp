description_portal: 이 데이터는 해양수산부에서 어선의 선령, 톤급, 선질별 척수 현황을 분석하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 통계년도, 정렬 순서용 필드, 필드구분 항목(선령과 톤급, 선질 구분 등), 어선의 총 척수 및 선령 구간별 척수(5년 이하, 6-10년, 11-15년, 16-20년, 20년 초과~25년 이하, 25년 초과), 최초 생성 시점, 최종 변경 시점으로 구성되어 있습니다.  본 데이터는 해양수산 분야에서 어선의 노후화 현황 진단, 어선 현대화 정책 입안, 어선별 선령 및 선질에 따른 연안 수산자원 관리의 기초자료로 활용될 수 있습니다. 또한 어선 수급 계획 수립 시 기초자료로 사용될 수 있으며, 신조·폐선 관련 연구나 수산업 지원사업 타당성 평가에도 참고할 수 있습니다.
