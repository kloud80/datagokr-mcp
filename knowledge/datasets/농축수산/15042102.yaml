description_portal: 산림청 국립산림과학원에서 임지이용의 합리화와 적지적수 선정을 위한 기초 산림토양도(도엽명, 도엽코드, 도엽번호, 축척 등)를 제공합니다.임지 이용의 효율성과 조림의 적지적수 선정을 위한 기초 자료로서, 산림지역의 토양 특성을 간략하게 정리한 토양도(지도)를 제공합니다. 해당 자료는 도엽명, 도엽코드, 도엽번호, 축척 등의 정보를 포함하고 있으며, 전국 주요 산림지역을 대상으로 제작되었습니다. 이 간이토양도는 토양의 물리적 특성, 배수 상태, 경사도, 표토 깊이 등을 고려하여 임업 계획 수립, 조림지 선정, 임도 설계, 산림복원 대상지 평가 등에 활용됩니다.
