description_portal: 데이터는 경기도 화성시에서 스마트팜으로 포도를 재배하는 농가를 대상으로 2019년 7월부터 9월까지 수확기 동안 측정한 지온 정보를 수집하여 정리한 것이다. 수확기는 과실 품질과 저장성에 영향을 미치는 중요한 시기로, 본 자료는 해당 시기의 뿌리 주변 온도 분포와 변화 추이를 파악하는 데 활용할 수 있다. 데이터는 농가 단위로 구성되어 있으며, 측정일, 시간, 지점별 지온 값 등을 포함한다. 이를 통해 생육 조건 분석, 환경 변화 대응, 작황 개선 등 스마트농업 기반의 의사결정에 기초자료로 활용 가능하다. 또한 지역 맞춤형 농업 기술 적용, 작물 생장 조건 최적화, 기상환경과 연계한 분석에도 기여할 수 있는 정보이다.
