summary_user: 전국 지자체·시군구별로 자연해안선과 인공해안선의 길이, 그리고 그 합계를 담은 집계 표(CSV, 약 2.8KB)입니다. 연안 관리 담당자나 연구자가 '우리 시군구의 해안선 가운데 인공해안선 비중은 얼마인가'처럼 지역별 해안 인공화 정도를 비교할 때 쓴다. 표준 행정코드 같은 전역 조인 키가 없어서, 다른 시군구 단위 통계와는 지자체·시군구 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 매년 해안선 변화에 관한 조사를 통해 측정된 지자체별 해안선 길이 현황 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 지자체, 시군구별 자연해안선, 인공해안선의 길이와 그 합계 정보로 구성되어 있습니다.  본 데이터는 관계 지자체 또는 기관에서 해양 환경 변화 연구, 해안선 관리 정책 수립, 연안 보호 대책 마련, 연안개발사업 타당성 검토, 해양 관광상품 개발 및 연계, 어업 관련 인프라 계획 수립 등 업무 수행을 위한 기초 자료로 사용될 수 있습니다.
