description_portal: 이 데이터는 남해안 지역의 천소수심(주변 해역보다 상대적으로 얕은 수심을 가진 지역) 정보를 제공하기 위한 목적으로 수집된 데이터입니다. 본 데이터의 주요 내용은 남해안에 위치한 천소수심 지역의 공간정보 일련번호, 자료 출처명 및 출처 상세정보, 천소수심 값과 비고 내용으로 구성되어 있습니다.  본 데이터는 해양 관련 기관이나 연구기관에서 남해 해역을 대상으로 수로조사, 항로 계획, 해저지형 분석, 해양공학 연구, 선박 안전운항 계획 수립, 해양개발 사업의 기초자료 확보 등에 활용될 수 있습니다.
