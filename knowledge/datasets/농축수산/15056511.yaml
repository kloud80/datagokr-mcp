summary_user: 수협 산지조합이 운영하는 위판장 268곳의 조합명·위판장명·주소·전화·팩스·홈페이지를 위판장 한 곳당 한 행으로 담은 전국 목록이며, 가격이나 거래량이 아닌 시설 기본정보다. 수산물 유통업체가 특정 지역에서 거래할 위판장과 연락처를 찾거나, 지자체가 지역별 위판장 분포를 파악할 때 쓴다. 실측 조인 키는 사업장주소(addr)이고 조합코드·위판장코드·행정구역코드 필드가 있어, 위판장 경락 가격 데이터와 위판장·조합 기준으로 잇거나 주소를 행정구역 단위로 묶어 쓴다.
