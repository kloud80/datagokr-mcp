summary_user: 공유수면매립 기본계획에 반영된 매립지구를 한 행씩 담은 전국 단위 파일로, 지구명·고시일과 고시번호·신청인·법정동코드·전면해상 위치·매립목적(당시와 현행법 기준)·면적(제곱미터)을 담는다. 연구자나 사업자가 "특정 시군 앞바다에 어떤 목적의 매립지구가 언제, 얼마 규모로 고시됐는가"를 확인하거나 해안 토지 변동을 검토하는 데 쓴다. 법정동코드(bjd_cd)로 행정구역 코드표나 같은 코드를 가진 토지·지역 통계와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 공유수면매립(공유수면에 흙, 모래, 돌, 그 밖의 물건을 인위적으로 채워 넣어 공유수면이 상실되고 지번을 부여하여 소유권 취득이 가능한 토지를 조성하는 것) 현황을 관리하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 공유수면매립지 법정동코드, 위치, 매립목적, 규모 등 정보로 구성되어 있습니다.  본 데이터는 공유수면 매립에 따른 토지 변동 상황을 확인하고자 하는 조사·연구, 토지 관리 정책의 수립, 공유수면 이용 및 개발 계획의 검토, 행정 심사 및 법적 근거 파악, 민간 사업자나 토지 소유자와의 협의 자료로 활용될 수 있습니다.
