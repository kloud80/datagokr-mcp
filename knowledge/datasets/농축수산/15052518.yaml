description_portal: '- 한국농어촌공사가 조성한 간척 농지의 지구별 임대정보 입니다.- 조성토지통합관리시스템(DIMS)을 통해 관리지구, 행정소재지, 면적 등 토지정보를 수집하고 있으며,- 본 개방데이터는 지구별 임대현황에 대한 데이터로 지구, 행정소재지, 임대면적 항목을 제공합니다.(지구, 행정소재지, 임대면적(ha))- 해당 데이터로 지구별 평균 임대면적 산출, 최소/최대 임대면적 등을 확인 할 수 있으며, 주로 공간의 규모와 분포에 대한 기본적인 통계 및 지리적 시각화에 집중하여 정보를 얻을 수 있습니다. - 본 데이터를 기반으로 해당 지역의 공간 활용 현황 등을 유추하는데 활용될 수 있습니다.'
