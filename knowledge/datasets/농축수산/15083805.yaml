description_portal: 전라남도 해남군 산이면 지역의 쌀 생산량 데이터 입니다.이 데이터는 지역, 연도, 쌀생산량 총 3가지의 종류로 구성되었습니다.2010년부터 2025년까지 15년 기간의 산이면 지역의 쌀 생산량입니다.산이면은 양암 방조제로 바다를 막아 양 옆으로 금호호와 영암호가 있으며 간척지가 넓게 펼쳐져 있습니다.그에따라 산이면은 평균적으로 20,000톤 이상 쌀을 생산하여 해남군 14개읍면 중 논 면적과 쌀생산량이 가장 많으며 생산량이 적은 북평면과 10,000톤 이상 차이가 납니다.
