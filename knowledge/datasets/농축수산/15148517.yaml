summary_user: 바다목장(인공어초·해조장 등을 설치해 수산자원 서식처를 만드는 어장)을 조성할 구역의 꼭짓점 좌표를 목장번호·계획년차·좌표번호별로 담은 파일로, 위도·경도를 방향과 도·분으로 나눠 기록하며 전국 범위의 개별 좌표 단위다. 해양 행정 담당자나 분석가가 '특정 바다목장 조성 구역이 바다 위 어디에 걸쳐 있는가'를 지도에 그려 확인할 때 쓴다. 전역 조인 키는 없고, 포털 설명상 목장번호로 바다목장 기본계획·어장조성 관리·효과조사 관리 데이터와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 바다목장어장조성좌표에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 목장번호, 계획년차, 좌표번호, 구역위도방향, 구역위도 도, 구역위도 분, 구역경도방향, 구역경도 도, 구역경도 분 데이터로 구성되어 있습니다.본 데이터는 바다목장어장조성좌표 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바다목장어장조성좌표란  수산자원을 늘리기 위해 바다에 인공어초, 해조장 등을 설치하여 어류의 산란장과 서식처를 만드는 "바다목장"을 조성할 때, 어떤 장소에 시설을 설치하고 어떤 활동을 할 것인지를 나타내는 구체적인 위치(위도, 경도 등)를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.목장번호는 '바다목장 효과조사 관리', '바다목장 어장조성 관리', '바다목장 어장조성 좌표', '바다목장 기본계획' 데이터의 목장번호 컬럼과 매칭 될 수 있습니다.
