description_portal: 농림축산식품부에서는 배합사료 생산실적정보를 제공합니다.본 정보 제공 데이터는 등의 정보를 포함하고 있습니다.본 제공자료는 년도별 월별 축종에 대한 배합사료 생산 실적정보를 보여주는 데이터 입니다.축종대분류에는 고기소, 기타가축, 대용유, 실험동물, 애완동물, 양계용, 양돈용, 어류용, 젖소용이 있습니다.년도별 월별 축종에 해당하는 실적 수와 생산량 합계를 확인 할 수 있으며, 년도별 총생산량에 대한 통계 자료로 활용할 수 있습니다.데이터 중 생산량이 0인 데이터는 데이터 목록에서 제외하였으며, 가장 최신년도의 데이터로 정렬하여 일부만 추출하였습니다.
