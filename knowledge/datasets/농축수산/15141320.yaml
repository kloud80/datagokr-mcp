summary_user: 부산 국제수산물유통시설관리사업소 공판장에서 열린 일일 경매 결과를 각 법인이 정산한 내역으로, 경매일자·법인(사업자)·품목·규격·등급·원산지별 물량, 금액, 최고·평균·최저가를 담는다. 수산물 도매가격을 보는 분석가나 사업자가 '이번 주 부산 공판장에서 특정 어종의 평균 경락가와 물량이 어떻게 움직였나' 같은 물가·시세 질문에 쓴다. 경매 법인의 사업자등록번호(brno)가 실측 조인 키라 사업자 정보와 이어 쓰고, 품목코드는 다른 기관의 어종코드와 체계가 달라 품목명 기준으로 맞춰야 한다.
description_portal: 국제수산물유통시설관리사업소 내의 각 공판장에서 진행된 일일 경매의 결과를 각 법인에서 일일 정산하여 기초 데이터를 생성하고, 그 데이터를 국제수산물유통시설관리사업소에서 운영 유지 관리중인 시장운영정보시스템에서 데이터 반영 그 다음 해당 시스템에서 각 법인의 데이터를 취합 및 가공한 데이터를  매일 1번 국제수산물유통시설관리사업소 대표 홈페이지의 경락정보 메뉴의 연계를 하여 홈페이지에서 국제수산물유통시설관리사업소에서 발생한 모든 일일 경매결과 제공하고있습니다.
