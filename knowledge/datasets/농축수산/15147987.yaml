summary_user: 정선해양관측(선박이 정해진 항로를 따라 조사하는 방식)의 관측 지점 목록으로, 지점마다 해역·정선·정점 번호, 관측 시작·종료일, 경위도, 플랑크톤 채집수심과 바닥수심을 담은 전국 단위 파일(CSV 약 17KB)이다. 연구자나 해양 정책 담당자가 "특정 해역의 어느 정점이 언제부터 언제까지 관측됐고, 수심은 얼마인가"를 확인할 때 쓴다. 정선·정점 조합(ksod_line_station)이 조인 키여서 같은 정선·정점 번호를 쓰는 정선해양관측 결과(수온·염분 등) 데이터와 이어 붙이고, 경위도로 지도나 다른 해양 공간 데이터와 겹쳐 본다.
description_portal: 이 데이터는 해양수산부에서 정선해양관측지점에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 해역, 정선, 정점, 관측시작일, 관측종료일, 경도, 위도, 플랑크톤, 채집수심, 바닥수심 데이터로 구성되어 있습니다.본 데이터는 정선해양관측지점 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.정선해양관측지점이란 선박을 이용해 미리 정해진 경로(정선)를 따라 이동하며 해양의 여러 요소를 조사하는 특정 지점을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
