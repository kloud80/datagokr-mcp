description_portal: 해양생명자원통합정보시스템(MBRIS)은 우리나라 해양생물의 다양성 보전과 해양생물자원에 대한 주권 확보를 목표로, 자원 부국 실현의 기반을 다지기 위해 지속적인 연구와 정보를 제공하고 있습니다. 이를 통해 확보된 유용한 정보는 학술적, 산업적 활용이 가능하도록 체계적으로 정리되어 있으며, 다양한 분야의 연구자 및 기업들에게 중요한 기초자료로 제공됩니다.제공되는 정보는 해양생물의 학명과 과명을 비롯하여 형태적 특징(성상), 분포 지역, 서식 환경, 생리활성 정보 등 기초 생물학적 특성뿐만 아니라, 원료 등록 여부, 산업적 활용 방안, 경제적·사회적 파급 효과, 연구 이용 부위 및 대상 물질 등 응용적 정보까지 포함되어 있습니다.또한, 해당 생물자원에 기반한 특허 출원 현황, 관련 논문, 그리고 항산화, 항염, 항균 작용과 같은 기능성 정보도 함께 제공하여, 신약 개발, 화장품, 식품소재 개발 등 다양한 산업 분야에서 실질적인 연구와 제품화로 이어질 수 있는 고부가가치 자원화를 지원하고 있습니다.
