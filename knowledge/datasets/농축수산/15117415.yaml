description_portal: 산림항공본부 항공기의 안전한 운항을 유지하기 위해 수행되는 감항성 개선지시 사항의 이행 현황을 관리하는 데이터입니다. 항공기의 구조, 장비 또는 부품 등에 대해 점검이나 정비, 부품 교체 등 필요한 조치를 수행하도록 관리하는 정보로, 항공기의 안전성과 신뢰성을 유지하기 위한 기준으로 활용됩니다. 제공 항목은 점검종류, 등록부호, 호기, 관리소, 제목, 작업내용, 작업일자로 구성되어 있으며, 항공기별 적용된 개선지시의 종류와 작업 내용, 수행 일자 등을 확인할 수 있습니다. 또한 관리소별 정비 이력과 감항성 개선조치의 수행 현황을 체계적으로 관리할 수 있습니다.* 감항성 개선 지시에 따른 정비 결과 정보입니다.
