summary_user: 축산물등급판정 통계연보 표 1-6을 옮긴 집계 파일로, 소의 평균 출하월령을 품종(한우·젖소·육우)과 성별(암·수·거세)로 나눠 연도별 전국 단위로 담는다(파일 크기 736바이트의 작은 표). 축산 농가나 분석가가 "한우 거세우의 출하월령이 해마다 줄고 있는가"처럼 사육 기간 추세를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 연도 컬럼을 기준으로 같은 기관의 등급판정 통계나 가격 통계와 나란히 놓고 보는 방식으로만 잇는다.
description_portal: 축산물등급판정 통계연보는 축산물품질평가원에서 매년 발행하는 국가승인통계(제388001호)로, 소, 돼지, 닭, 오리, 계란, 말 등 주요 축산물의 등급판정 결과와 가격 동향을 집대성한 자료입니다. 소, 돼지, 닭, 오리, 계란, 말의 등급판정 물량, 등급별 출현율, 성별/지역별 판정 현황 등을 포함합니다. 그 중 축산물등급판정통계연보 2025년 표 1-6  소의 품종별 (한우 젖소 육우) 과 성별( 거세 암 수) 출하월령을 연도별 제공하는 파일입니다. 한우의 평균 출하월령은 41.9개월로 전년(42.3개월) 대비 0.4개월 감소하였습니다.  전체데이터의 확인 (등급판정통계연보)은 축산물품질평가원 누리집 정보공개 > 통계연보 에서는  2006년부터 축산물등급판정통계연보를 확인할수 있습니다.  제공되는 파일에서는 소의  출하월령별 연도별 비율을 확인할수 있고  연도별 변화를 확인할 수 있습니다. 축산물등급판정통계연보는 매년 3월에 발간하며 추가적인 통계정보는 축산물품질평가원 누리집에서 열람 및 내려받기가 가능합니다. 연보 발행 전 최신 동향은 통계월보를 통해 매달 업데이트되는 수치를 확인할 수 있습니다.
