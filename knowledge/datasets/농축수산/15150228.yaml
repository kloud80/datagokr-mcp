description_portal: 전국파랑 관측자료 제공시스템(WINK)에서 제공하는 항만별 중간역 및 상세역 파랑 스펙트럼 자료의 대상영역과 태풍 및 비태풍 목록 정보입니다.  스펙트럼 영역은 중간역과 상세역으로 구분되며, 중간역은 MID(Middle), 상세역은 DTL(Detail)로 표기되어 있습니다.중간역은 위치에 따라 서해안(MW), 남해안(MS),동해안(ME)로 구분되어 있으며, 상세역은 항별로 나누어져 있습니다. 태풍 및 비태풍 목록은 태풍의 경우 TP(TroPical cyclone)와 태풍 번호, 비태풍의 경우 EC(Extra-tropical Cyclone)와 비태풍 발생일(yyyymmdd)으로 표기되어 있습니다.
