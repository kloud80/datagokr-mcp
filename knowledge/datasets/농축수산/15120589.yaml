description_portal: 축산물등급판정 통계연보는 축산물품질평가원에서 매년 발행하는 국가승인통계(제388001호)로, 소, 돼지, 닭, 오리, 계란, 말 등 주요 축산물의 등급판정 결과와 가격 동향을 집대성한 자료입니다. 소, 돼지, 닭, 오리, 계란, 말의 등급판정 물량, 등급별 출현율, 성별/지역별 판정 현황 등을 포함합니다. 그 중 축산물등급판정  통계연보  표 1-4 연도별 소의  판정두수와 일평균 소 판정물량별 도축장 개소수를 제공하고 있습니다. 일평균 판정물량의 규모는(10두미만, 10두이상~20두 미만, 20두이상~30두미만, 30두이상~50두미만, 50두이상~100두미만, 100두이상)으로 구분하였습니다. 축산물등급판정통계연보는  매년 3월에 발간하며 추가적인 통계정보는  축산물품질평가원 누리집에서  열람 및 내려받기가 가능합니다.  연보 발행 전 최신 동향은 통계월보를 통해 매달 업데이트되는 수치를 확인할 수 있습니다.
