description_portal: '경상남도 남해군 관내의 등록된 축산농장현황입니다. 개방 데이터 항목으로는 소재지 읍면별 사업장명칭, 등록축종, 사업장 도로명주소지, 농장규모(제곱미터)를 포함한 정보입니다. 이 데이터는 농축산과에서 관리하고 있는 데이터이므로 참고하시기 바랍니다.○ 데이터 제공일 : 2025. 08. 19.○ 축산농장이란 가축을 사육하여 축산물을 생산하는 농장을 의미합니다. 넓게는 축산업을 영위하는 모든 시설을 포함하며, 좁게는 가축을 사육하는 축사 및 관련 시설을 의미하기도 합니다. 축산법에 따라 가축을 사육하는 축산농장은 일정 규모 이상일 경우 지자체에 신고해야 합니다.'
