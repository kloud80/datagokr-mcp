description_portal: 이 자료는 농촌진흥청이 운영하는 **농업경영종합정보시스템(AMIS, Agricultural Management Information System)**의 사용자 설문조사 결과를 수록한 것입니다. AMIS는 농업경영 정보의 수집·분석·제공을 통해 농업인의 경영 개선을 지원하는 종합 플랫폼입니다. 본 설문조사 자료는 AMIS 이용자들을 대상으로 시스템 활용 실태, 정보 만족도, 편의성, 정보 신뢰도 등을 평가하고, 개선 방향을 도출하기 위해 수집되었습니다. 주요 내용에는 농업경영주의 경영역량 평가, 농산물소득조사 자료 활용 만족도, 시스템 전반에 대한 사용자 의견 등이 포함되며, 농업인, 컨설턴트, 행정기관 종사자 등 다양한 사용자의 응답이 반영되어 있습니다. 본 자료는 AMIS 서비스의 품질 향상과 정책 수립을 위한 기초자료로 활용됩니다.
