description_portal: 산림항공본부 항공기의 보유 및 운영 현황을 관리하기 위한 데이터로, 운용 중인 항공기의 기본 정보와 도입 이력을 확인할 수 있는 자료입니다. 제공 항목은 호기, 등록부호, 기종, 소속, 도입일, 용도폐지일로 구성되어 있으며, 항공기별 식별 정보와 운영 기관, 사용 기간 등의 정보를 제공합니다. 이를 통해 보유 항공기의 현황을 체계적으로 파악하고, 기체별 운영 상태와 관리 이력을 확인할 수 있습니다. 해당 데이터는 항공 장비의 체계적인 관리와 효율적인 운영을 위한 기초자료로 활용됩니다.* 헬기 도입 후 용도폐지되지 않은 헬기는 용도폐지일 항목이 공란으로 처리됩니다.
