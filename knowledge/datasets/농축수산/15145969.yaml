summary_user: 전국 주요 조위관측소별로 해수면 주간 전망 일자에 맞춰 평균해수면의 평년평균값, 관측된 주간 평균값, 기후변화 경향을 반영한 평년추세값을 담은 시계열 파일(csv, 약 7.7MB)이다. 연안 관리 담당자나 기후변화 연구자가 '이번 주 특정 관측소의 해수면이 평년보다 얼마나 높은가, 장기 추세와 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 관측소 위치 이름(위치)이나 국립해양조사원(바다누리) 자체 관측소코드로 매핑해 같은 기관의 조석·수온 등 관측 데이터와 이어 쓴다.
description_portal: 이 데이터는 국립해양조사원에서 제공하는 해수면 주간 전망 시계열 데이터로, 전국 주요 조위관측소에서 관측된 주간 해수면 변동 정보를 포함하고 있습니다.데이터에는 평균해수면의 평년평균값, 관측된 주간 평균값, 평년추세값(기후 변화에 따른 경향) 등이 포함되어 있으며, 이를 통해 해수면의 단기적 변화뿐만 아니라 장기적인 추세 분석도 가능합니다.이 데이터는 해양재해 대응, 연안 관리, 해수면 상승 분석, 기후변화 연구, 해양 정책 수립 등 다양한 분야에 활용될 수 있습니다.
