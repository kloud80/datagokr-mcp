summary_user: 국립종자원이 생산한 콩 정부보급종의 생산량을 품종별 한 행, 2010년산부터 2025년산까지 연도별 열로 정리한 전국 단위 집계 파일이다. 종자 공급 담당자나 농업 분석가가 '어떤 콩 품종의 보급종 생산이 최근 몇 년 사이 늘었거나 줄었는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품종명을 이름으로 맞추거나 같은 기관(국립종자원)의 다른 작물 보급종 생산 현황과 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 국립종자원에서 생산한 콩 정부보급종에 대해 품종별 생산량에 대한 데이터로  품종명, 생산연도, 생산량 데이터를 제공합니다.* 정부보급종은 종자산업법 제22조에 따라 정부가 생산·공급하고 있으며 엄격한 검사규격에 합격한 정부에서 보증하는 종자로서 벼,콩,팥,보리,밀,호밀 작물이 이에 해당됩니다.* 제공되는 데이터는 CSV(Comma Separated Values, 쉼표로 값을 구분하여 데이터를 저장하는 파일 형식) 타입으로 엑셀(excel), 한셀, csv 전용 뷰어나 메모장 등으로 데이터 확인이 가능합니다.
