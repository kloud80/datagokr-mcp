description_portal: 이 데이터는 해양수산부에서 적조발생이력에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 뉴스제목명, 발생지역명, 적조속보수온정보, 원인생물명, 적조속보위도, 적조속보경도, 공간정보 데이터로 구성되어 있습니다.본 데이터는 적조발생이력 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.적조란 식물성 플랑크톤이 대량으로 증식하여 바닷물의 색깔이 붉은색, 황색 등으로 변색하는 현상을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
