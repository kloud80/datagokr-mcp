summary_user: 해양환경측정망(연안) 관측 결과를 관측일자별로 담은 건별 측정 CSV 파일(약 2.9MB)로, 수심·투명도와 함께 수온·염분·pH·용존산소·COD·질소·인·규산규소·부유물질·클로로필a를 표층과 저층으로 나눠 기록하고 생태구지역등급을 붙인다. 연안 수질 분석가나 양식업자가 '특정 시기에 저층 용존산소가 낮아지거나 영양염(질소·인)이 높아졌는지'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 해양 관측 데이터와는 관측년도·관측월·관측일자 같은 날짜나 이름 매핑으로만 맞춰 쓴다.
description_portal: 이 데이터는 해양수산부에서 해양환경측정망(연안)측정결과대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측년도, 관측월, 관측일자, 날씨, 수심, 투명도, 수온표층, 수온저층 등의 데이터로 구성되어 있습니다.본 데이터는 해양환경측정망(연안)측정결과 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양환경측정망이란 우리나라의 항만, 연근해, 하구역 등 다양한 해양 환경의 상태와 오염원을 정기적으로 조사하고 측정하는 시스템을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
