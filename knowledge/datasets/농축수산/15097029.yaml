description_portal: 이 데이터는 제주특별자치도 내 양돈 농가를 대상으로 수행된 ‘돼지열병(CSF 포함)’ 검사 실적을 정리한 공공데이터로, 항원 검사 및 항체 검사 건수, 검사 시점, 검사 대상 농가 및 해당 가축 규모, 검사 결과 등이 체계적으로 기록되어 있다. 돼지열병은 가축전염병예방법상 엄격히 관리되는 질병으로, 농장의 위생 상태와 방역 실태를 평가하고 질병 발생을 예방하기 위한 핵심 지표로 사용된다. 이 자료는 제주 지역의 축산 방역 관리 현황 파악, 농가별 질병 감시 이력 추적, 방역 정책 및 축산 위생 관리 체계 설계, 축산물 안전성 평가, 농가 지원 계획 수립 등의 행정 및 연구 목적으로 활용 가능한 기초 통계 정보를 제공하며 CSV 형식으로 무료 배포된다
