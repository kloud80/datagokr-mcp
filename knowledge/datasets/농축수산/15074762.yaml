description_portal: 산림청이 1993년부터 2020년까지 추진한 해외조림사업의 연도별, 국가별 조림 면적 정보를 정리한 통계 데이터입니다. 이 데이터는 우리나라가 해외 산림자원 확보와 해외 산림협력 강화를 위해 호주, 뉴질랜드, 인도네시아, 베트남, 파라과이, 우루과이 등 다양한 국가에서 수행한 조림사업의 누적 면적과 연도별 증가 추이를 제공합니다. 각 국가별로 실제 조림이 이뤄진 면적(ha)을 기반으로 구성되어 있으며, 산림청의 국제 산림자원 개발 전략, 목재자원 확보, 탄소흡수원 확보, 해외 산림투자 현황 등을 종합적으로 파악할 수 있습니다.
