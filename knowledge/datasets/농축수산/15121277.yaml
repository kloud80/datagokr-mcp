description_portal: 이 데이터는 해양수산부가 항만 내 도선사예선지원서비스(SV51)를 운영하는 과정에서 발생한 항만가이드라인 응답 이력 관리를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 각 항만에서 제공되는 가이드라인의 응답 이력을 기록한 정보로 구성되어 있으며, 메시지 ID, 요청 선박 식별번호, 선박의 부두, 정박지, 안전도선기준 등 정보 등록일시, 응답이력 등을 포함하고 있습니다.  본 데이터는 항만운영기관이나 정책담당자들이 항만가이드라인 준수 여부를 모니터링하고, 항만 안전관리체계 개선, 도선사 업무 프로세스의 검토, 효율적인 항만 운영 정책 수립 등에 활용될 수 있습니다.
