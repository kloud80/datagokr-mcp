summary_user: 전국의 가축 거래 상인 등록 정보를 상인(등록)별로 담은 파일 데이터로, 등록 시도·시군구, 거래 축종(소·돼지·닭·오리 등), 대표자 성별, 허가·등록 날짜, 영업상태, 폐업일자를 포함한다. 축산 유통 분석가나 지자체 담당자가 "우리 지역에 영업 중인 소 거래 상인이 몇 명이고 최근 몇 년간 신규 등록·폐업이 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시도·시군구 이름이나 축종 이름을 맞춰 연결해야 한다.
description_portal: 해당 데이터는 농림축산식품부가 제공하는 데이터로 전국의 가축 거래 상인 등록 현황을 정리한 데이터로, 지역별로 소, 돼지, 닭, 오리, 기타 가축 거래 상인의 등록 정보를 제공합니다. 이를 통해 지역별 가축 거래 규모와 상인의 분포를 확인할 수 있으며, 축산물 유통 체계와 시장 구조를 종합적으로 분석할 수 있습니다. 해당 자료는 축산물 유통 정책 수립, 거래 투명성 강화, 가축 거래 관리 시스템 개선, 농가와 상인 간 협력 관계 분석에 기초 자료로 활용될 수 있으며, 축산업의 지속 가능한 발전과 유통 효율성 제고에 중요한 의미를 가집니다.
