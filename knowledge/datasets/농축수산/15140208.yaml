description_portal: '농업수입안정보험은 자연재해로 인한 수확량 감소, 시장가격 하락 등으로 인한 농가의 수입 손실을 보상함으로써 농가의 소득 및 경영 안정을 도모하고 안정적인 농업 재생산 활동을 뒷받침하기 위해 시행하는 제도입니다.2015년 도입 이후 보험 품목과 사업 지역 확대, 보장 강화 등을 통해 가입규모가 증가하고 있습니다.- (근거법령) 농어업재해보험법- (사업대상자) 농업경영체 등록을 한 개인 또는 법인- (보험목적물) "25년 기준 15개 품목- (상품유형) 과거수입형, 기대수입형, 실수입형본 자료는 농업수입안정보험의 품목별, 사고원인별(태풍, 냉해, 호우 등) 사고접수 현황을 수록하였습니다이 데이터는 정책보험 정책 수립 및 제도 개선을 위한 기초자료로 활용되며, 농업재해보험에 대한 이해를 돕고 관련된 연구 또는 통계분석 등에 활용될 수 있도록 제공합니다.* 수록자료 및 단위 : 사고접수건수(건)※ 본 자료는 매년 연말에 전년도 말 기준 자료로 갱신하여 제공합니다.'
