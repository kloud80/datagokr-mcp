description_portal: 본 자료는 전라남도 광양시 관내에서 가금류(닭, 오리 등)를 사육하는 농가의 현황을 정리한 공공데이터로, 농장명, 축종, 사육수, 주소, 데이터 기준일 등의 항목으로 구성되어 있습니다. 이 데이터는 가축 질병 방역, 재난 대비, 지역별 축산 분포 분석, 축산 정책 수립 등을 위해 행정기관과 축산 관련 기관에서 광범위하게 활용됩니다.특히 축종과 사육수 정보는 고병원성 AI(조류인플루엔자) 발생 시 위험지역을 설정하고, 사육 밀집지역에 대한 예방적 살처분, 방역대 설정, 사육제한 명령 등의 행정조치에 매우 중요한 기초 자료가 됩니다. 또한 농장 주소 정보는 GPS 기반 방역 시스템, 가축 이동 경로 추적, 사육지 분포 시각화 등에 활용됩니다.
