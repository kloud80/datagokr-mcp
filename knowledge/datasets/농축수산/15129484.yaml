summary_user: 농촌체험휴양마을과 농촌민박 사업자를 대상으로 경관·서비스, 체험, 숙박, 음식 4개 분야의 심사 점수와 등급을 연도·사업구분·시도·시군구·마을(업소)명 단위의 건별 행으로 담으며, 범위는 전국입니다. 여행객이 "이 지역 체험마을 중 숙박·음식 등급이 높은 곳은 어디인가"를 비교하거나, 지자체·분석가가 시군구별 농촌관광 서비스 수준을 파악하는 데 쓴다. 시도·시군구 코드(CTPRVN_CD, SIGNGU_CD)와 명칭은 있지만 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정구역 이름·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 해당 데이터는 농촌체험휴양마을 및 농촌민박 사업자를 대상으로 경관 및 서비스, 체험, 숙박, 음식 등 4개 분야에 대해 심사를 거쳐 결정된 등급 정보를 제공하는 자료입니다. 이 데이터는 농촌 관광 자원의 질적 수준을 객관적으로 평가하여 이용자들에게 신뢰성 있는 정보를 제공하고, 농촌 지역 관광 활성화를 도모하기 위해 마련되었습니다. 이를 통해 국민들은 각 마을과 민박의 서비스 수준과 특성을 비교·선택할 수 있으며, 사업자는 자신의 강점과 개선점을 파악하여 서비스 품질을 향상시킬 수 있습니다. 또한 해당 자료는 지역별 농촌체험휴양마을과 민박업의 운영 실태를 파악하는 기초 자료로 활용되어, 지자체와 정부가 농촌 관광 정책을 수립하고 지원 사업을 추진하는 데 중요한 근거가 됩니다. 나아가 농촌 관광의 신뢰도를 높이고, 체험과 휴양, 숙박, 음식 등 다양한 분야에서 질 높은 서비스를 제공함으로써 농촌 경제 활성화와 농업·농촌의 가치 확산에 기여할 수 있는 의미 있는 자료입니다.
