description_portal: 일반인을 대상으로 텃밭에서 재배할 수 있는  가장 대표적인 품목을 선별하여 품목별 월별 추천 여부 정보를 제공하고 있습니다.본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘텃밭 월별 추천작물정보’ 콘텐츠에 대한 상세 정보이다. 월별로 재배하기 적합한 텃밭 작물의 정보를 제공하며, 각 작물의 파종 시기, 재배 기간, 수확 시기 등을 포함하고 있다. 특히 계절별 기후 조건을 고려하여 작물의 생육에 최적화된 재배 시점을 안내함으로써 도시농업 실천자들이 효율적으로 텃밭을 관리할 수 있도록 지원한다. 데이터는 CSV 형식으로 제공되며, 공공데이터포털을 통해 다운로드 및 활용이 가능하다. 초보자부터 숙련자까지 다양한 이용자가 활용할 수 있는 실용적인 자료로, 도시농업 활성화와 자급자족형 식생활 실천에 기여한다.
