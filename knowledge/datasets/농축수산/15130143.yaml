summary_user: 바다내비(지능형 해상교통정보시스템)의 수치조류도를 바탕으로, 검색 시간과 검색영역(위경도 범위)별로 각 지점의 위도·경도와 그 지점의 조류 유향·유속(cm/s)을 담은 격자 지점 단위 파일 데이터로, 범위는 전국이며 zip 파일(약 55MB)로 받는다. 해상 운송업체나 항만 운영 기관이 '이 시간대 이 해역의 조류가 어느 방향으로 얼마나 빠르게 흐르는가'를 확인해 항로 계획과 항로 안전성 분석에 쓰고, 연구기관은 조류 변동 분석에 쓴다. 전역 조인 키가 없어 다른 데이터와는 지점 위도·경도 좌표로 공간 매칭하거나 바다누리 관측소 등과 이름·위치 기준으로 연결해야 한다.
description_portal: 이 데이터는 해양수산부에서 해상 교통 안전과 효율적인 항로 운용을 지원하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 지능형 해상교통정보시스템(바다내비)에서 제공되는 수치조류도 정보를 기반으로, 검색영역별 조류 데이터, 각 지점의 위도 및 경도 정보, 해당 지점의 조류 유향과 유속 등으로 구성되어 있습니다.  본 데이터는 해상 운송업체가 해상 교통 계획을 수립하거나 조선업에서 선박 운항 경로를 결정할 때 참고자료로 활용될 수 있으며, 해양 수산 관련 연구기관이 해양 환경 분석 및 조류 변동 조사, 예측에 사용할 수 있습니다. 또한 항만 운영 기관이 항만 출입 선박 관리 및 항로 안전성 분석에 적용할 수 있습니다.
