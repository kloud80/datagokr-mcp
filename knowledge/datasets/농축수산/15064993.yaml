description_portal: 천광역시 채소생산량(조미채소) 공공데이터는 지역 내 조미채소류의 재배 면적과 생산량을 체계적으로 기록한 자료로, 농업 현황을 객관적으로 파악할 수 있도록 제공됩니다. 데이터에는 고추, 건고추, 풋고추, 파, 대파, 쪽파, 양파, 마늘, 생강 등 주요 조미채소의 면적(헥타르 단위)과 생산량(톤 단위), 그리고 10에이당 생산량(킬로그램 단위)이 포함되어 있습니다. 각각의 면적과 생산량을 세분화해 보여주며, 연도별 기준일을 통해 시기별 변화를 확인할 수 있습니다.해당 데이터는 국가통계포털(KOSIS)의 농작물생산조사에서 참고하였으며 공공데이터포털에서도 확인할 수 있습니다.
