description_portal: 본 데이터는 인천광역시 동구의 어업 활동 실태를 파악하기 위해 1997년 부터 2024년까지 수집된 어업별·업종별 어선세력 관련 통계자료이다. 주요 항목으로는 연번, 업종, 연도, 어선 척수(척), 총 톤수(톤), 마력수(마력), 총 어획량(톤), 데이터 기준일자 등이 포함된다. 해당 데이터는 동구 관내에서 활동하는 어선들의 수적 분포, 규모, 동력 및 생산량을 업종별로 파악할 수 있어, 수산자원 관리 및 어업정책 수립의 기초자료로 활용된다. 어선 척수와 총 톤수는 해양환경 및 어항 시설 수용능력 분석에, 어획량은 어업 생산성 평가와 수산물 유통정책에 반영 가능하다. 마력수와 어업 규모는 연안어업과 근해어업의 특성을 구분하는 데에도 유용하다. 본 자료는 수산행정, 통계연구, 어업인 지원정책 등에 폭넓게 활용되며 정기적으로 갱신된다.
