summary_user: 해양수산부 갯벌어장 준실시간(정기조사) 측정소의 위치 목록으로, 측정소 한 곳당 한 행에 관측정점·정점명·행정구역명·관측지역과 도분초·십진 형식의 위경도를 담은 전국 범위 원천 파일(약 8.6KB CSV)이다. 갯벌어장 수질·환경 관측값을 해석하는 분석가나 어업인이 '우리 지역 갯벌어장 근처 관측정점이 어디에 있나'를 확인하거나, 측정소를 지도에 표시할 때 쓴다. 전역 조인 키는 없어서, 관측정점명·행정구역명을 이름으로 맞추거나 위경도 좌표로 공간 결합해 갯벌어장 관측값·해양공간 용도구역 자료와 잇는다.
description_portal: 이 데이터는 해양수산부에서 갯벌어장 준실시간(정기조사) 측정소에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측정점, 관측정점명, 행정구역명, 위도(도분초), 경도(도분초), 위도(백분위), 경도(백분위), 관측지역 데이터로 구성되어 있습니다.본 데이터는 갯벌어장 준실시간(정기조사) 측정소 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.갯벌어장이란 갯벌에 서식하는 풍부한 수산자원을 활용하여 굴, 조개 등의 어패류를 채취하는 등 어업 활동을 하는 곳을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
