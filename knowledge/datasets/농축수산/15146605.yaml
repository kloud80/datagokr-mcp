summary_user: 국립해양조사원이 운영하는 전국 해양관측소의 목록으로, 관측소마다 고유번호·유형·국문/영문 이름·위도·경도를 한 행씩 담은 소규모 CSV 파일(594 bytes)이다. 낚시·해양레저 이용자나 해양 분석가가 '내가 가려는 해역에서 가장 가까운 조위 관측소가 어디인가'를 찾을 때나, 관측값을 지도에 올릴 때 위치 기준표로 쓴다. 전역 조인 키는 없고, 관측소 고유번호(KHOA 바다누리 자체 관측소코드)나 관측소명으로 같은 기관의 조석·수온·파고 관측 데이터와 맞춰 잇고, 좌표로 행정구역·해역 공간자료와 겹쳐 쓴다.
description_portal: 이 데이터는 국립해양조사원에서 관리하는 해양관측소 운영 현황 데이터입니다. 데이터에는 각 해양관측소의 고유번호, 위치 좌표 정보 등이 포함되어 있습니다.해양관측소는 해양 및 연안지역의 수위 변화를 실시간으로 관측하여, 해양 환경 모니터링, 해양재난 예방, 항로 안전 확보, 그리고 수치모델의 설정 및 검증에 중요한 역할을 합니다.본 데이터는 해양관측소의 운영 현황과 위치 정보를 정확하게 제공함으로써, 해양 환경 분석 등 기초자료로 활용될 수 있습니다.
