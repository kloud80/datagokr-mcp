summary_user: 산림복지서비스이용권시스템에서 추출한 이용권 신청 정보로, 사업년도·회차별 신청 건마다 수급 유형별 인원(기초·장애·차상위), 성별·연령 인원, 숙박 여부, 1~3순위 희망 이용기간, 신청·승인일자, 총지원금, 선정 여부 등을 담은 전국 범위의 CSV 파일(약 1.28MB)이다. 정책 담당자나 연구자가 '어느 지역·어떤 취약계층이 이용권을 얼마나 신청하고 선정되었는가', '희망 이용 시기가 어디에 몰리는가'를 따져 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 제공자시설 고유코드(USE_FACILITY_CD)나 시설명·주소지역을 같은 기관의 시설 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 해당 데이터는 산림복지서비스이용권시스템에서 추출한 신청정보로, 이용권신청 사용자수 및 사용기간에 대한 제공자시설 관리용 테이블, 이용권신청 마스터정보 관리용 테이블, 이용권신청시 시설 신청담당자 정보 관리용 테이블, 이용권 선정자 추첨용 테이블, 이용권신청 상세정보 관리용 테이블, 개인신청시 대리인 정보 관리용 테이블 등으로 구성되어 있습니다. 이 데이터는 이용권 신청 과정의 전반적인 흐름과 신청자 현황을 체계적으로 파악할 수 있도록 설계되어 있으며, 정책 수립을 위한 기초 통계, 시설 이용 효율성 분석, 신청 절차의 공정성 검토 등 다양한 행정 및 연구 목적에 활용될 수 있습니다. 또한 산림복지서비스의 접근성과 수요자 중심 서비스 개선을 위한 기반 자료로 활용될 수 있습니다.
