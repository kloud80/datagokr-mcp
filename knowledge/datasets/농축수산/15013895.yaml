description_portal: 해당 데이터는 농림축산식품부에서 제공하고 있는 농업·농촌 분야 용어 관련 정보로, 제공 항목으로는 분류, 기존 용어, 한자어(원어), 쉬운 용어 등으로 구성되어 있습니다. 본 자료는 어려운 농업 관련 전문용어를 도시농업인, 귀농·귀촌인 등 누구나 쉽게 이해할 수 있도록 순화하여 정리하였습니다. 이를 통해 농업 관련 정보의 접근성과 이해도를 높이고, 현장에서의 원활한 소통과 정책 전달 효과를 강화할 수 있습니다. 또한 학술 연구와 교육 교재로도 활용 가능하며, 농업 분야의 대국민 인식 개선, 소비자 신뢰 증진, 산업 발전 기반 마련에 기여하는 중요한 자료입니다.
