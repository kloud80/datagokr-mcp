description_portal: 국유림 인근 산촌 주민들과의 보호협약 체결 현황을 담은 데이터입니다. 보호협약 단계, 업무 진행 상태, 보호수탁자 구분 및 명칭, 보호협약 대상지 필지 수, 협약 신청일과 시작일, 종료일, 체결일, 해지일 등 다양한 정보를 포함하고 있습니다. 국유림 보호협약은 산촌 주민이 국유림 보호활동에 참여할 수 있도록 지원하며, 임산물 양여 등 실질적 혜택을 제공하는 제도다. 정책 수립, 산림 보호활동 평가, 지역사회 협력 방안 연구 등 다양한 분야에서 활용 가능합니다. 연도별로 갱신되어 최신 현황을 반영합니다.
