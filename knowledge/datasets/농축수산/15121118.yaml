description_portal: 해당 데이터는 산림청이 운영하는 산림기술정보통합관리시스템에 등록된 산림사업체들의 실적 정보를 종합적으로 수록한 자료로, 산림사업의 기획부터 실행, 완료까지의 전 과정을 체계적으로 관리하고 파악할 수 있도록 구성되어 있다. 이 데이터에는 각 사업체가 수행한 산림사업의 명칭, 발주청, 사업연도, 계약일자, 착수 및 완료일자 등 사업 일정에 관한 정보는 물론, 사업금액, 자재비, 노무비 등 재무 관련 항목과, 작업면적, 조림규모 등 사업의 물리적 규모까지 포함되어 있다. 또한 사업이 실제로 수행된 위치 정보와 현장대리인의 자격 사항, 업체 고유번호, 실적 고유번호, 데이터의 등록 및 수정 일자 등 행정적 관리 항목도 포함되어 있어 사업 수행의 전반적인 이력을 파악하는 데 유용하다.
