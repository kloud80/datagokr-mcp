description_portal: '◎ 데이터셋 : 오이의 정상 및 병해충 이미지의 메타데이터◎ 조사기간 : 2020.9월~12월(4개월)◎ 조사내용 : 오이 작물을 다각도에서 촬용하고 해당 이미지를 전문가가 판독하여 병해충 여부를 진단한 데이터◎ 활용분야 : 사진이미지를 통해 병해충을 진단할 수 있는 시스템(앱) 개발에 활용◎ 수집 방법 : 작물에 병해충 배양을 위해 격리실을 제작한 후 다양한 각도에서 이미지 촬영 한 후 병해충 사진 라벨링히고 병리학 전문가 자문 첨부◎ 데이터 제공 방법  1. 메타데이터는 범정부 데이터포털에 연결된 링크에서 다운로드 가능 2. 이미지 파일 ① 메타데이터의 경로 정보와 파일명을 조합하여 확인 및 다운로드 가능         예) https://www.bigdatahub.go.kr/images/disease/a1_1(1).jpg, ② 대용량 파일로 별도 제공 요청시 직접 제공 가능(300GB이상의 저장장치 별도 준비)'
