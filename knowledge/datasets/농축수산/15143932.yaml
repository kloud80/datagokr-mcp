description_portal: '전라남도 함평군은 축산업 관리와 지역 내 가축사육시설 현황 파악을 위해 관내 가축사육업 사업장에 대한 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군에 등록된 가축사육업 사업장의 전반적인 현황을 나타내며, 사업장 명칭, 주 사육업종(예: 한우, 돼지, 닭 등), 등록된 축종, 사업장 소재지, 관할 행정동명, 영업상태(영업 중, 폐업 등) 등의 정보를 포함하고 있습니다. 해당 데이터는 지역 내 축산업 분포 분석, 가축전염병 대응을 위한 사육시설 관리, 악취 민원 관리 및 축산환경 개선 정책 수립, 축산업 허가 및 변경사항 검토 등에 활용될 수 있으며, 행정기관, 연구기관, 축산 관련 기업 및 지역 주민에게 실질적인 정보를 제공합니다. 또한, 스마트 축산업 도입 기반 자료, 가축사육 제한구역 설정, 환경영향 평가자료 등으로도 활용 가능한 공공정보입니다.'
