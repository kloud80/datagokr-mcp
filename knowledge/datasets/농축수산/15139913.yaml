description_portal: '"제주특별자치도 내 노지감귤관측(횡경크기)정보 데이터를 제공합니다.항목: 해당년도, 조사월, 측정항목, 도, 제주시, 서귀포시* 「제주특별자치도_노지감귤관측조사(횡경크기)정보」는 제주 지역 노지 감귤의 횡경(果実의 가로 직경, fruit diameter)을 정기적으로 조사하여 제공하는 공공데이터입니다.횡경 크기는 감귤의 상품성, 선별 등급, 소비자 선호도를 결정하는 주요 요인으로, 감귤 산업의 품질 관리 및 유통 전략 수립에 중요한 기초 자료가 됩니다.* 제공년도 : 2009년부터 2024년까지* 데이터 제공 기관: 제주특별자치도 농업기술원자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/join/evaluation/part10/11.htm"'
