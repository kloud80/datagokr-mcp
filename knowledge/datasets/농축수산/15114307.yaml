description_portal: 이 데이터는 연안관리법에 따라 연안통합관리의 권역별 과제와 그 집계 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 권역별 세부 추진 과제명, 권역별 요청 사업명, 권역별 대상 지역명 등 권역별로 관리 및 집행된 과제들의 목록으로 구성되어 있습니다.  본 데이터는 해양수산부 및 관계기관이 각 권역별 연안 관리 과제의 추진 현황을 체계적으로 관리하거나, 정책 수립 시 지역별 특성에 따라 과제분류와 사업진행상황을 비교·분석하는 데 활용될 수 있습니다. 또한 연안 통합관리 성과를 평가하거나 향후 연안 개발 및 관리 방향 설정 시 참고 자료로 활용될 수 있습니다.
