summary_user: 공유수면 매립면허를 건별로 담은 원천 데이터로, 면허번호·자격취득일자·관리기관명·면허면적·사업진행단계·면허상태와 고시·신청·면허계획도 파일명, 지방청 담당부서·담당자 연락처를 함께 제공한다. 전국 범위이며 API 전체 건수는 993건이다. 사업자나 분석가가 특정 해역의 매립면허 현황과 담당 지방청을 확인하는 데 쓰고, 지방청 담당자 주소(rpsvcChrgrAddr)가 유일한 조인 키라서 주소 기반 데이터와만 이어 쓸 수 있으며, 해양공간계획 용도구역 같은 입지 규제 자료와 함께 볼 때 참고가 된다.
description_portal: 이 데이터는 해양수산부에서 공유수면매립의 매립면허 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 공유수면매립면허의 면허번호, 취득일자, 관리기관명, 매립면적 및 매립과 관련된 고시/신청/면허계획도 등 파일의 명칭으로 구성되어 있습니다. 또한, 행정지원공통 지방청의 담당부서, 담당자명 및 연락처 등 관련 기관의 정보를 조회할 수 있습니다.본 데이터는 공유수면 관리 및 이용 계획 수립, 매립 관련 행정 업무 처리, 면허현황 점검, 매립 사업의 효율적인 추진을 위한 참고자료로 활용될 수 있습니다.
team:
  dept: 해양공간정책과
services:
  - op: /getReclamLicenseList
    name: 공유수면매립 매립면허정보 조회
    endpoint: https://apis.data.go.kr/1192000/reclamLicenseInfoService/getReclamLicenseList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: pwr_lcns_sno
        required: false
        desc: 공유수면매립면허일련번호
      - name: pwr_lcn_nm
        required: false
        desc: 공유수면매립면허자명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getReclamMofInfo
    name: 행정지원공통 지방해양수산청 업무정보 조회
    endpoint: https://apis.data.go.kr/1192000/reclamLicenseInfoService/getReclamMofInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: rpsvc_job_chrgr_sno
        required: false
        desc: 지방청업무담당자일련번호
      - name: rpsvc_job_chrgr_org_nm
        required: false
        desc: 지방청업무담당자기관명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
