description_portal: 해당 데이터는 국립농업박물관에서 소장하고 있는 농업유물 현황을 정리한 데이터로, 영천경자양안, 추수기, 조작증서, 실타래물레, 초피함지, 우리 민요 시화곡집 등 농업 생산, 생활, 제도, 문화 전반에 걸친 총 4,645개의 유물이 포함되어 있습니다. 이를 통해 전통 농업기술과 생활양식, 농업제도의 변천 과정, 농촌 문화의 다양성을 파악할 수 있으며, 연구자와 정책 담당자에게는 농업사 연구와 문화유산 보존·활용 정책 수립을 위한 중요한 자료로 제공됩니다. 또한 일반 국민에게는 농업의 역사적 가치와 전통을 이해하고 농업문화 자산을 계승하는 데 기여할 수 있는 교육적·전시적 자원으로 활용될 수 있습니다.
