description_portal: 이 데이터는 해양수산부에서 해양수질자동측정망(정기운항선박)측정결과에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일자, 전기전도도, 수온, 수소이온농도, 용존산소량, 탁도, 일사량, 기온, 상대습도, 풍속, 풍향 등의 데이터로 구성되어 있습니다.본 데이터는 해양수질자동측정망(정기운항선박)측정결과 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양수질자동측정망이란 연안의 오염우심해역 등에서 해양수질 상태를 실시간으로 상시 측정하여 해양환경의 변화를 예측·예보하고 오염사고 발생 시 신속한 대응을 위한 정보를 제공하는 시스템을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
