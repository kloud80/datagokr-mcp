description_portal: '경상남도 해역 내 산소부족 물덩어리(빈산소수괴) 어업재해로 인해 발생한 양식수산물 피해 데이터입니다.1. 제공내용 : 연도, 시·군, 품종별 피해 데이터(어가 수, 피해량, 피해금액, 복구지원액)2. 제공범위 : 2024년 이후, 경상남도 해역3. 데이터 참고사항  가. 피해량 단위 : 줄(100m)  나. 피해금액 및 복구지원액 단위 : 백만원  다. 복구지원액은 재난지원금(국비 및 지방비)과 자부담금과 융자금의 합계액이며, 재해보험으로 처리 시 복구지원액 없음※ 산소부족 물덩어리(빈산소수괴)란 바닷물에 녹아있는 산소농도 3mg/L 이하인 물덩어리로, 「농어업재해대책법」 제2조 등에 따른 어업재해(이상조류)에 해당합니다.※ 피해 복구지원과 관련된 자세한 내용은 「농어업재해대책법」, 「어업재해 피해조사 보고 및 복구지원 요령」 등 관련 규정을 참고하시기 바랍니다.※ 본 데이터 내용은 경상남도 "해양수산 현황" 자료집에서도 확인하실 수 있습니다.'
