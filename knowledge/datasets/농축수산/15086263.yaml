description_portal: '인천광역시 영종구 관내에 위치한 식육판매업에 대한 데이터 입니다.파일명 인천광역시_영종구_ 식육판매업 현황파일내용 업소유형, 업소명, 주소 등축산물 위생관리법 시행령제21조(영업의 세부 종류와 범위)7. 축산물판매업의 경우에는 다음 각 목의 구분에 따른 영업가. 식육판매업: 식육 또는 포장육을 전문적으로 판매하는 영업(포장육을 다시 절단하거나 나누어 판매하는 영업을 포함한다). 다만, 다음의 어느 하나에 해당하는 경우는 제외한다.1) 식품을 소매로 판매하는 점포를 경영하는 자(이하 이 호 및 제8호에서 “식품점포경영자”라 한다) 또는 식육판매업 외의 축산물판매업 영업자가 닭ㆍ오리의 식육(제12조의7제2항제1호에 따른 도축업의 영업자가 개체별로 포장한 닭ㆍ오리의 식육을 말한다. 이하 이 호 및 제8호에서 같다) 또는 포장육을 해당 점포 또는 영업장에 있는 냉장시설 또는 냉동시설에 보관 또는 진열하여 그 포장을 뜯지 않은 상태 그대로 해당 점포 또는 영업장에서 최종 소비자에게 판매하는 경우(전화 또는 홈페이지 등을 통해 주문을 받아 배송ㆍ판매하는 경우를 포함한다)2) 「식품위생법 시행령」 제21조제5호나목4)에 따른 집단급식소 식품판매업의 영업자가 닭ㆍ오리의 식육 또는 포장육을 그 포장을 뜯지 아니한 상태 그대로 「식품위생법」 제2조제12호에 따른 집단급식소의 설치ㆍ운영자 또는 같은 법 시행령 제21조제8호마목에 따른 위탁급식영업의 영업자에게 판매하는 경우3) 식육포장처리업의 영업자가 자신이 만든 포장육을 직접 판매하는 경우4) 제8호에 따른 식육즉석판매가공업의 신고를 하고 해당 영업을 하는 경우5) 「전자상거래 등에서의 소비자보호에 관한 법률」 제2조제3호에 따른 통신판매업자가 닭ㆍ오리의 식육 또는 포장육을 판매하는 경우(판매할 때 보관ㆍ관리 또는 배송을 식육판매업 또는 식육포장처리업의 영업자에게 위탁하는 경우로 한정한다)'
