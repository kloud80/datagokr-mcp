description_portal: 공공급식통합플랫폼에서 제공하는 연간 주요 농산물 품목별 소비 실적입니다. 공공급식통합플랫폼은 공공급식 수요처와 지역의 급식지원센터, 공급업체가 간편하게 식재료를 거래할 수 있는 시스템으로, 지역단위 푸드플랜 실현을 위해 농산물유통 및 가격안정에 관한 법률 제70조 2에 근거하여 한국농수산식품유통공사가 운영하고 있습니다.※ 소비량은 식재료 거래 데이터를 활용하여 품목별로 추정한 값이며, 실제 거래량과는 다를 수 있습니다. ※ 식재료 분류 기준은 NEIS 급식시스템 식재료 표준코드이며, 코드 개정 이후 연도부터 분석 가능합니다.
