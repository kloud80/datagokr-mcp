summary_user: 경기도 사이버식물병원에 들어온 병해 진단의뢰 건별로, 결과와 함께 제공된 첨부파일(진단서·교육자료·대응방안 안내서 등의 문서나 이미지)의 원본 파일명, 저장 파일명, 파일 경로를 한 행씩 담는다. 농업인이나 분석가가 특정 진단의뢰에 어떤 형태(jpg, hwp, pdf 등)의 결과 자료가 붙었는지 확인하거나, 진단 결과 자료의 유형별 분포를 살펴보는 데 쓴다. 진단의뢰번호(diagns_rqst_no)로 같은 기관의 진단의뢰·진단결과 데이터와 이어 쓰며, 다른 기관 데이터와 연결할 전역 조인 키는 없다.
description_portal: 진단_의뢰_결과첨부파일 테이블은 진단의뢰 결과와 함께 제공되는 첨부파일 정보를 저장합니다. 진단의뢰번호(dx_req_num)를 기준으로, 해당 진단 건에 첨부된 문서 또는 이미지 등의 파일명을 첨부_원본_파일명, 첨부_파일명, 첨부_파일경로 컬럼을 통해 확인할 수 있습니다. 첨부파일이름으로 이미지(jpg), 문서(hwp, pdf, hwpx 등) 등 첨부파일 형태를 확인할 수 있습니다. 이 데이터는 진단의뢰 상세 페이지에서 제공되는 문서 또는 이미지 콘텐츠와 연계되며, 병해 진단과 관련된 공식 진단서, 교육자료, 대응방안 안내서 등으로 활용됩니다.
