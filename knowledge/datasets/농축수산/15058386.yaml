summary_user: 경기도 31개 시군의 가축 사육업체 인허가 현황을 사업장 단위로 담으며, 사업장명·인허가일자·영업상태·폐업일자·소재지 면적·업태 구분·좌표·축산고유번호 등을 제공한다. 지역 축산 정책 담당자나 분석가가 '우리 시군에서 영업 중인 가축 사육업체는 어디에 얼마나 분포하는가'를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드로 연결해야 하며, 좌표(X_CRDNT_VL·Y_CRDNT_VL)는 지도 위 위치 표시에 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군의 가축 사육업체 인허가 현황을 포함하며, 한우, 육우, 젖소, 돼지, 산란계, 육계, 부화용 알 생산용 가축, 오리, 산양, 사슴, 메추리, 타조 등 다양한 가축을 사육하는 농가의 정보를 제공합니다. 총 23개 항목으로 구성되어 있으며, 사업장명, 인허가일자, 영업상태, 소재지 면적, 축산업무 및 축산물 가공업 구분, 종업원 수, 위치정보(WGS84 좌표), 축산고유번호 등 세부적인 정보를 포함하고 있습니다. 데이터는 축산업 기반 시설의 분포, 가축종별 사육 동향, 지역 단위 축산 정책 수립 등에 활용할 수 있으며, 개인정보 보호를 위해 소재지 주소는 비식별 조치되어 제공됩니다. 행정안전부에서 주간 단위로 제공하며 Open API를 통해 활용이 가능합니다.
