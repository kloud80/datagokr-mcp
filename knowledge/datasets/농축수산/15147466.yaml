summary_user: 선박검사신청서 처리내역에서 뽑은 어선 기관 출력 자료로, 어선별 주기관 대수·출력(킬로와트·마력)·톤수와 선박 용도 구분, 진수일자를 전국 범위로 담은 파일(CSV 약 4.3MB)이다. 정책 분석가나 수산 행정 담당자가 '용도별 어선의 주기관 마력 분포는 어떻고 오래된 어선일수록 출력이 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 어선번호 같은 전역 조인 키가 없어 어선 등록·어업 허가 원장과 건별로 잇기는 어렵고, 선박용도 구분코드를 기준으로 한 집계 수준 비교에 쓴다.
