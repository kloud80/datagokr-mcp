description_portal: 이 데이터는 해양수산부에서 어선기관마력데이터에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 주기관대수, 주기관출력킬로와트, 주기관출력마력, 주기관톤수, 선박용도구분코드, 선박용도세부구분코드, 진수일자 데이터로 구성되어 있습니다.본 데이터는 어선기관마력데이터 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어선기관마력데이터란 선박검사신청서 처리내역 중 어선 기관에 대한 출력 데이터 ∙어선의 세부 기관에 대한 사양과 기관 출력 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
