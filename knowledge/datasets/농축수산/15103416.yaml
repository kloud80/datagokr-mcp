description_portal: '- 2020년도에 생산된 임산물에 대한 생산량과 생산액을 조사한 결과입니다. 표본조사, 타조사 실적을 반영하는 행정조사, 조사원이 현장에서 직접 임업인을 만나 전수조사하는 방식으로 조사합니다.- 산나물류 : 고사리, 도라지, 더덕, 곰취 등- 버섯류 : 표고버섯(건표고 및 생표고)- 약용식물 : 오미자, 구기자, 산수유, 산딸기, 헛개나무 등- 조경재·잔디·야생화 : 조경수, 잔디, 야생화- 수실류 : 떫은감, 밤, 호두, 대추 등- 전라남도는 광범위한 임산물 품목과 전국 최고 수준의 생산량, 그리고 적극적인 지원 정책을 기반으로 1조 원대 임산물 산업 시대를 활짝 열었습니다.'
