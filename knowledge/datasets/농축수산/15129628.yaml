summary_user: 농작물재해보험의 보험료를 전국 시도 단위로 집계한 통계 파일로, 시도별 환급금 차감 후 순보험료·농가보험료, 위험보험료(백만원), 보험료율(%), 건당 보험료(천원)를 담는다. 정책 분석가나 지자체 담당자가 '어느 시도 농가가 건당 보험료를 더 많이 부담하고 보험료율이 높은가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 시도 단위 통계(재해 피해, 농업경영체 수 등)와는 시도 이름을 맞춰 연결해야 한다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 시도별 농작물재해보험 보험료 통계자료로, 농업재해보험은 농가의 경영안정과 안정적인 재생산 활동을 지원하기 위해 2001년부터 도입된 제도입니다. 주요 항목으로는 지역, 환급금 차감 후 순보험료, 환급금 차감 후 농가보험료, 위험보험료, 보험료율, 건당 보험료 등을 포함하고 있습니다. 본 자료는 시도별로 농작물재해보험에 가입한 농가 수와 해당 농가가 납부한 보험료 규모를 확인할 수 있도록 구성되어 있어, 지역별 보험 가입 수준과 부담 정도를 파악하는 데 활용될 수 있습니다. 이를 통해 특정 시도의 농업재해보험 가입 활성화 정도를 비교하거나, 지역별 재해 위험도 및 농업 규모 차이에 따른 보험료 납부 현황을 분석할 수 있습니다. 또한 시도별 보험료 추이는 농작물재해보험 정책의 실효성을 평가하고, 지역 맞춤형 보험 지원 및 농가 경영 안정 대책을 마련하는 기초 자료로 활용될 수 있습니다.
