description_portal: 이 데이터는 해양수산부에서 부산용도구역 내 항만항행구역 정보를 제공하기 위해 수집한 파일 형식의 데이터입니다.  본 데이터의 주요 내용은 부산 지역 해양공간 중 항만항행과 관련하여 지정된 구역의 공간정보 일련번호, 용도구역 아이디, 용도구역의 면적과 구역 상세정보 데이터로 구성되어 있습니다.   본 데이터는 항만시설 운영계획, 관련 기관의 항행계획 수립, 해양안전 관련 정책 기반 자료, 항만 관련 규제 및 관리방안 마련, 해양 공간의 효율적 이용 방안 연구 등 업무 수행을 위한 기초자료로 활용될 수 있습니다.
