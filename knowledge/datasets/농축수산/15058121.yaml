summary_user: 해양수산부 연안포털의 국가연안공간정보 가운데 1:5,000·1:25,000 축척 연안정보도를 도엽 단위로 담은 메타데이터 서비스로, 도엽 목록, 도엽별 상세정보(책임기관, 발행일, 기준계·좌표계·투영법, 도엽경계 등), 다운로드 파일 정보를 전국 범위로 제공한다. 해양공간계획이나 연안재해 분석을 준비하는 분석가가 '이 연안 지역을 덮는 도엽은 무엇이고, 어떤 좌표계로 언제 발행됐으며 파일은 어디서 받는가'를 확인하는 데 쓴다. 다른 데이터와 직접 이을 전역 조인 키는 없어서 도엽번호(mapnumber)·도엽명 같은 이름·코드 매핑으로만 연결하고, 상세 조회에 필요한 코드는 같은 서비스의 목록 조회 결과에서 먼저 받아 넘긴다.
description_portal: 이 데이터는 해양수산부에서 연안포털 내 국가연안공간정보의 연안정보도 도엽 정보와 파일 제공을 위하여 수집한 데이터입니다.본 데이터의 주요 내용은 1:5000, 1:25000 축적 도엽의 리스트 정보, 도엽별 상세정보 및 파일 다운로드 정보로 구분되어 있으며, 각각 도엽명, 도엽번호 리스트, 도엽 책임기관, 발행일, 설명 요약, 기준계, 도엽경계 경/위도, 소스 데이터, 검수기관 등 상세정보, 도엽번호에 따른 다운로드파일 정보로 구성되어 있습니다.본 데이터는 연안지역의 지형 및 지리적 특성을 분석하여 해양공간계획 수립, 연안재해 예방, 해양환경 보호 등의 분야에 활용될 수 있습니다.
