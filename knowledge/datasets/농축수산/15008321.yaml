description_portal: 식물 신품종 육성자의 권리를 부여하기 위하여 품종보호제도를 운영하고 있으며, 신품종을 출원한 품종에 대한 서류심사, 재배심사, 종합심사 등을 거쳐 신품종을 등록하고 있다.현 데이터는 품종보호권이 있었던 식물 신품종 중 그 권한이 소멸된 품종에 대하여 소멸일 출원일, 출원번호, 품종명, 보호권자에 대한 정보를 공고한 현황자료이다.식물 품종보호제도는 우리나라 3개 기관에서 운영 중인데, 해당 데이터는 국립종자원에 출원, 등록한 농업종자에 대한 품종보호권이 소멸된 품종으로 산림종자, 수산식물종자는 제외한 자료이다.
