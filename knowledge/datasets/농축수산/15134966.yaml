description_portal: 본 데이터는 충청남도에서 추진하는 로컬푸드 연계형 학교급식지원 사업과 관련하여, 학교급식에 로컬푸드를 공급하는 공급기관 현황 정보를 체계적으로 관리·제공하는 자료입니다. 주요 항목으로는 로컬푸드 연계 학교급식 공급 거래처명, 거래처 종류 등의 정보가 포함되어 있어, 학교급식에 참여하는 생산자 단체, 유통업체, 협동조합 등 공급 주체의 유형과 현황을 종합적으로 파악할 수 있습니다. 이를 통해 지역 농산물의 학교급식 공급 구조를 분석하고, 안정적인 공급망 구축과 거래 체계의 투명성을 확보할 수 있습니다. 본 데이터는 로컬푸드 활성화 정책 수립, 학교급식 품질 관리, 공급기관 관리 및 지원 정책 마련, 지역 농가와 공공급식 간 연계 강화를 위한 기초 자료로 활용됩니다.
