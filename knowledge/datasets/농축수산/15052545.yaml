summary_user: aT 화훼공판장(양재 꽃시장) 경매에서 구분·연도·분기·품목별로 총 출하(상장)량, 유찰량, 유찰률을 집계한 파일 데이터로, 약 29KB 분량의 CSV다. 화훼 유통업자나 분석가가 "어느 꽃 품목이 어느 분기에 경매에서 많이 팔리지 않고 남았는가"를 보고 품목별 수급과 가격 흐름을 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 화훼 경락가격 데이터와는 품목 이름과 연도·분기를 맞춰 이어야 하며, KAMIS 등 다른 품목코드 체계와는 별도 매핑이 필요하다.
limits: 분기별 품목 집계라 일별·거래 건별 유찰이나 가격은 알 수 없다. 공통 코드 키가 없어 다른 데이터와는 품목명 매칭으로만 연결되고, 포털 설명의 컬럼명(총 출하량·유찰량)과 실제 파일 컬럼명(상장속수·유찰속수)이 달라 단위(속) 확인이 필요하다.
