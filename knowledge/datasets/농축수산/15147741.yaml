summary_user: 농업인안전재해보험(통합사업)에서 농기계 사고 한 건마다 보험 가입금액(대인·대물·본인차량·본인손해·농기계상해), 보험기간, 사고·접수·지급일자, 항목별 지급금액을 담은 건별 원천 파일로, 전국을 시도·시군구 단위로 다룬다. 농업 안전 분석가나 지자체 담당자가 "우리 시군구에서 농기계 사고 보험금이 얼마나, 어떤 항목으로 지급됐나"를 확인하거나 사고일과 지급일 사이 기간을 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명을 행정구역 이름이나 코드로 매핑해서만 이을 수 있다.
description_portal: 농림축산식품부에서는 농기계사고현황정보를 제공합니다.본 정보 제공 데이터는 보험사분류, 시도명, 시군구명, 대물가입금액, 대인가입금액, 본인차량가입금액, 본인손해가입금액, 보험가입합계금액, 보험시작일자, 보험종료일자, 사고접수일자, 사고일자, 지급일자, 대인지급금액, 대물지급금액, 본인손해지급금액, 본인차량지급금액, 보험지급합계금액, 농기계상해가입금액, 농기계상해지급금액등의 정보를 포함하고 있습니다.본 제공자료는 농업인안전재해보험(통합사업)사업의 농기계 사고에대한 보험가입내역과 지급내역, 사고내역 등에 대한 정보를 보여주는 데이터 입니다.
