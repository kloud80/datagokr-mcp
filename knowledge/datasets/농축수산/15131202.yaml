summary_user: 농식품 공공데이터 포털에 등록된 데이터 활용사례를 사례 한 건 단위로 담은 목록으로, 순번·사례명·기본 설명·승인 상태를 담고 범위는 전국·비공간이다. 데이터 분석자나 정책 담당자가 '농식품 공공데이터가 실제로 어떤 서비스나 분석에 쓰였나'를 훑어보고 비슷한 활용 아이디어를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사례명 같은 이름 매핑으로만 느슨하게 이어 쓸 수 있다.
description_portal: 농림축산식품부는 농식품 공공데이터 포털의 활용사례 정보를 제공합니다. 이 데이터는 활용사례의 순번, 사례명, 기본 설명, 승인 상태 코드 등을 포함하고 있습니다. 이를 통해 농식품 공공데이터의 실제 활용 사례를 파악하고, 데이터 활용의 효과성과 적용 가능성을 평가하는 데 활용됩니다. 또한, 다양한 활용 사례를 통해 농식품 분야의 데이터 활용 동향을 이해하고, 향후 데이터 기반 정책 수립 및 서비스 개발에 기여하고자 합니다. 이러한 정보는 농식품 분야의 데이터 분석자, 정책 입안자, 연구자 등에게 유용한 참고자료로 활용될 수 있습니다.
