description_portal: '- 전라남도 내 과실생산 현황(품목별 재배면적, 생산량, 전국면적 및 생산량 등)에 관한 데이터를 조회하실 수 있게 제공하고 있습니다.- 전라남도는 과수 생산이 활발한 지역으로, 주요 과수 품목별 재배면적과 생산량에 대한 최신 통계 자료를 제공합니다.- 전라남도는 과수산업의 경쟁력 강화를 위해 다양한 지원 정책을 운영하고 있습니다 : 1. 과수 재배 기반 확충 지원 : 과수 재배를 위한 시설 현대화 및 스마트 농업 기술 도입 지원 2. 조류 피해 방지 지원 : 과수 재배 중 조류로 인한 피해를 최소화하기 위한 포획 트랩 운영 지원 3. 유통 지원 : 농산물산지유통센터(APC)를 통한 안정적인 유통망 구축 및 가격 안정화 지원'
