summary_user: 인천 삼산농산물도매시장의 과일·채소류 거래실적을 대분류·품목별로 집계해, 품목별 총 거래물량(kg)·거래금액(원)과 3개 도매시장 법인((주)부평농산, (주)경인농산, 인천원예농협 삼산공판장)별 물량·금액을 함께 담은 집계 파일(CSV 약 12.7KB)이다. 인천 지역 농산물 유통업자나 분석가가 "삼산시장에서 어떤 품목이 어느 법인을 통해 얼마나 거래되는가", "법인별 취급 품목 특성은 어떤가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS·타 도매시장 가격 데이터와는 품목명을 기준으로 매핑해 이어 써야 한다.
limits: 품목코드가 없고 품목명만 있어 KAMIS·도매시장·KOSIS 등과 연결하려면 기관마다 다른 품목코드 체계에 맞춰 별도 매핑이 필요하다. 필드에 거래일자·기간 컬럼이 없어 이 파일만으로는 일별·월별 가격 추이나 명절 시기 수급 변화를 바로 분석하기 어렵다.
