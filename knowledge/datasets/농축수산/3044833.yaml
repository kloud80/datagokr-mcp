description_portal: 각 도매시장 법인에서 과일·채소류의 품목별 거래물량과 거래금액을 집계한 데이터 바탕으로, 삼산농산물도매시장 내 유통 동향 및 명절·계절 등 시기의 수급 변화와 가격 추이 분석에 활용됩니다.도매시장 법인이란 도매시장의 운영 주체로, 출하자가 위탁한 농산물을 경매에 의하여 중도매인 또는 매매참가인에게 판매한 후 소정의 위탁 수수료를 받는 회사입니다.현재 우리 도매시장은 (주)부평농산, (주)경인농산, 인천원예농협 삼산공판장이 있습니다.이때 "대분류"는 농산물의 유형을 구분한 항목이며, "품목명"은 대분류에 속하는 세부 품목을 의미합니다."거래물량(KG)"과 "거래금액(원)"은 각 품목의 유통 규모를 나타내며, 법인별 거래실적에 함께 집계되어 유통흐름이나 법인별 취급 특성 분석에 활용됩니다.
