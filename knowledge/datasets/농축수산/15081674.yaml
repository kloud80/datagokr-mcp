summary_user: 전국 유아숲체험원 등록 현황을 시설별 1행으로 담은 파일 데이터로, 499개소의 시설명·주소·전화번호·운영기간·참여방법이 들어 있다. 아이와 갈 숲체험 시설을 찾는 보호자나 어린이집·유치원 교사, 지역별 산림교육 시설 분포를 보는 분석가가 쓴다. 주소(address)를 조인 키로 삼아 같은 주소 체계의 다른 산림 휴양·복지 시설 데이터와 이어 쓴다.
description_portal: '전국 유아숲체험원 등록 현황입니다. 2024년 12월 말 기준으로 499개소 등록하였습니다.  (등록취소 유아숲체험원 제외)또한 유아숲체험원의 주소와 전화번호와 함께 교육시설 운영기간 및 참여방법  등 운영정보를  제공합니다. -  유아숲체험원 :   유아가 산림의 다양한 기능을 체험함으로써 정서를 함양하고 전인적 성장을 할 수 있도록 지도ㆍ교육하는 시설(산림교육의 활성화에 관한 법률 제12조 제1항) - 기대효과 : 미래세대에게 산림교육을 통한 정부의 탄소중립정책의 성공적 지원, 산림교육 활동을 통한 생태적 감수성 증진 및 행복지수를 높여 아이들의 올바른 가치관 확립에 기여.'
