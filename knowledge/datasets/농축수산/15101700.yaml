summary_user: 농림축산식품부와 농협경제지주가 지역농협·과실 농가와 맺은 계약출하 약정 현황을 연도·지역본부·품목·사업방식별로 집계해 담으며, 사업자금, 약정물량과 출하물량(톤), 출하율, 참여 조합 수와 농가 수가 들어 있다(범위 전국). 정책 담당자나 분석가가 "올해 사과·배 계약출하 약정 물량 대비 실제 출하 비율은 지역본부별로 어땠나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, KAMIS 가격 등 다른 데이터와는 연도·품목명·지역본부명을 이름으로 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 농림축산식품부와 농협경제지주가 지역농협 및 과실 생산농가와 계약출하 약정을 체결하여 과일 수급 안정 대책을 추진한 현황을 제공합니다. 주요 항목으로는 연도, 지역본부, 품목명 등을 포함하고 있습니다. 본 자료는 과실 수급 불균형으로 인한 가격 급등락을 완화하고, 농가의 안정적 판로 확보 및 소비자 가격 안정에 기여하는 정책의 성과를 분석하는 데 중요한 역할을 합니다. 이를 통해 정책 담당자는 과실 수급 안정 정책의 효과성을 검토하고 향후 계약출하 확대 방안을 마련할 수 있으며, 농가와 유통업계는 안정적 유통 구조 확립과 수익성 개선을 위한 전략 수립에 활용할 수 있습니다. 나아가 본 데이터는 과일 산업의 경쟁력 강화, 농가 소득 안정, 소비자 신뢰 확보에 기여하는 중요한 기초자료라 할 수 있습니다.
