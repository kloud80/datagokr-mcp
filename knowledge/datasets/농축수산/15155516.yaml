summary_user: 국립해양조사원의 해양관측부이가 관측한 최신 해양 데이터를 관측소 단위로 담는 API이며, 수온·염분·기온·기압·풍향·풍속·유향·유속·파고와 관측소 위치(경도·위도)를 포함하고 전체 24건이 전국 범위로 확인된다. 낚시·레저 이용자나 양식·어업 종사자, 연안·항만 안전 담당자가 지금 바다의 파고·수온이 어떤지 확인하는 질문에 쓴다. 관측소 위도(lat)를 좌표 키로 삼아 다른 위치 기반 데이터와 이어 쓰고, 관측소코드는 바다누리(KHOA) 자체 키라 같은 기관 데이터와 맞출 때 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 해양관측부이를 통해 관측된 최신 해양 관측 데이터를 제공하기 위해 수집한 데이터 입니다. 관측소 코드, 관측일자, 시간 간격 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 관측소명, 관측소 경도/위도 위치정보, 관측일시 및 수온, 염분, 기온, 기압, 풍향, 풍속, 유향, 유속, 파고 등의 해양 관측 데이터로 구성되어 있습니다. 본 데이터를 활용하여 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양 환경 연구 등에 활용될 수 있습니다.
