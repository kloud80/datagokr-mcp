description_portal: 한국농어촌공사에서 운영하고 있는 용수시설통합운영관리시스템(TOMS)에서 사용하는 시설 코드 분류표 입니다.취수탑은 하천, 호수, 저수지 따위에서 취수하기 위해 설치된 탑 모양의 철근 콘크리트 구조물이며, 적정 수심의 물을 선택적으로 취수하고, 이물질을 걸러 하류 펌프장, 관개시설, 처리장 등으로 보내는 역할을 합니다.여수토는 홍수 및 초과 유수를 배수하기 위한 방수로(측수로)이며, 저수지 건설 시 보조적인 배수시설로 덴타 게이트와 함께 활용되기도 합니다.내부시스템의 데이터를 활용할때 사용하시면 됩니다.
