summary_user: 전자해도에서 뽑은 자연해안선(약최고고조위가 해안과 만나는 선) 객체를 한 건씩 담은 전국 범위 CSV 파일로, 객체마다 공간정보 일련번호·해양공간객체번호·제작일자·전자해도 단계코드·전자해도번호를 기록한다. 해양 공간 관리 담당자나 연구자가 '이 자연해안선 구간은 어느 전자해도에서 언제 만든 것인가'를 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 이어 쓸 전역 조인 키는 찾지 못했으며, 전자해도번호나 해양공간객체번호를 같은 기관(해양수산부)의 다른 해양공간 데이터와 맞춰 보는 정도로만 연결한다.
limits: 파일은 비공간 형태로 확인되어 해안선 좌표·형상은 이 파일만으로 얻지 못하고 전자해도 원자료가 따로 필요하다. 행정구역 코드 같은 전역 조인 키가 없어 시군구 단위 집계나 다른 기관 데이터와의 직접 결합은 어렵다.
