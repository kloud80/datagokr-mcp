description_portal: 이 데이터는 해양수산부에서 육지와 바다의 경계선인 약최고고조위가 해안과 접하는 자연해안선 정보를 체계적으로 관리하고 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 전자해도에서 추출된 자연해안선의 공간정보 일련번호, 해양 공간객체번호, 제작일자, 전자해도 내 단계코드 및 전자해도번호 정보로 구성되어 있습니다.  본 데이터는 국가 공공기관의 해양 공간 관리, 해양 관련 업체 및 연구기관에서의 전자해도 제작, 해양경계 조사, 해안 개발 관련 기초 정보 제공 등의 분야에 활용될 수 있습니다.
