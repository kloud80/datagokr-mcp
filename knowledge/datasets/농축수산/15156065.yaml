summary_user: 한국농수산식품유통공사(aT)가 조사한 농산물 소매가격을 조회 기간별로 담은 API로, 조사일자·품목·품종·등급·시군구·시장 단위로 조사일 가격과 kg 환산 가격을 제공하며 범위는 전국, 행정단위는 시군구입니다. 식자재 구매자나 유통업자가 특정 품목의 소매가격이 지난 몇 주 동안 지역별로 어떻게 움직였는지 확인할 때 쓰고, 정책담당자가 수급·물가 동향을 볼 때도 씁니다. 전역 조인 키는 없어 품목코드(item_cd)·품종코드(vrty_cd) 같은 KAMIS 자체 코드나 이름으로 같은 기관의 도매·경락가격 데이터와 연결하며, 도매시장·HS·KOSIS 품목코드와는 별도 매핑이 필요합니다.
limits: 품목코드가 KAMIS·도매시장·HS·KOSIS마다 달라 다른 기관 데이터와 바로 붙일 수 없고 코드 매핑표를 따로 마련해야 합니다. 포털 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한됩니다.
