description_portal: '"제주특별자치도 내 산림 병해충 발생 및 방제 현황 데이터를 제공합니다.항목: 연도, 시군구, 병해충 분류, 발생 면적, 방제 면적 등* 제주특별자치도에서 2015년부터 2019년까지 시군구 구분 및 병해충 종류별로 산림에서 병해충이 얼마나 생겼는지(발생 면적)와 방제(예: 약제 살포나 피해목 제거 등)를 얼마나 했는지(방제 면적)를 기록한 통계자료입니다. 병해충 분류에는 일반병해충(솔잎혹파리, 솔껍질깍지벌레 등), 재선충병 등 다양한 병해충 유형이 포함돼 있고, 지역(시군구) 단위로 세분화돼 있어 공간적 차이도 파악 가능합니다.* 활용 분야 : 병해충 발생 지역별 우선순위 선정, 연도별 발생·방제 추이 분석, 병해충 종류별 방제 효과성 검증 등"'
