summary_user: 부산광역시 국제수산물도매시장에서 거래된 수산물의 경락 내역을 도매법인·경매일자·품목별로 담으며, 수량(box)·중량(kg)·산지·등급·경락가(원)를 함께 제공하는 건별 거래 정보입니다. 수산물 유통업자나 물가 분석가가 '이번 주 부산 공판장에서 고등어 한 상자 경락가가 얼마였나'처럼 어종별 도매가격 추이를 확인할 때 쓴다. 전역 조인 키는 없어 품목명(fishName)이나 도매법인명으로 다른 위판장·도매시장 가격 데이터와 이름 매핑해 이어 써야 합니다.
description_portal: 농수산물유통 및 가격안정에 관한 법률에 의거하여 부산광역시 국제수산물유통시설관리사업소에서 유통되는 수산물에 대한 도매법인별, 경매일자별, 품목, 수량(box), 중량(kg), 산지, 등급, 경락가(원)에 대한 정보를 제공하고 있습니다. ※ 추가로 제공되는 각종 수산물의 월별 주요반입품목과 출하지별 거래실적에 관한 정보는 국제수산물유통시설관리사업소 홈페이지에서 확인할 수 있습니다.
