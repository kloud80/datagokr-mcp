summary_user: 과거 발생한 산불을 건별로 기록한 파일 데이터로, 발생일시·진화종료시간·발생장소(관서·시도·시군구·읍면·동리)·발생원인·피해면적 합계를 담고 범위는 전국, 행정단위는 시군구까지입니다. 산림 당국이나 분석가가 어느 계절·지역에서 어떤 원인의 산불이 잦고 피해면적이 큰지 파악해 예방 정책과 대응 자원 배분의 근거로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름 매핑으로만 연결한다.
description_portal: '1. 산불 통계정보 개요산불통계정보는 과거에 발생한 산불의 발생 시점, 장소, 원인, 피해 규모 등을 종합적으로 분석하기 위한 자료입니다.이 정보는 산불 발생 패턴을 파악하고, 계절·지역별 특성을 분석하여 예방 정책 수립과 대응 전략 개선에 활용됩니다.2. 산불통계정보의 목적산불 발생 추세 분석: 연도별·월별·지역별 발생 현황을 통해 주요 발생 시기와 지역 파악원인별 대응 전략 수립: 산불의 원인 유형을 분석하여 예방 중심의 정책 마련피해 규모 평가: 피해면적을 통계적으로 관리하여 복구 및 자원 배분 근거 확보3. 제공되는 정보시스템에서는 산불통계정보를 다음과 같은 항목으로 제공합니다.발생일시(년·월·일·시간·요일): 산불이 발생한 정확한 시점과 요일진화종료시간(년·월·일·시간): 산불이 완전히 진화된 시각발생장소(관서·시도·시군구·읍면·동리): 산불이 발생한 지역 정보발생원인(구분·세부원인·기타): 산불의 원인 유형 및 구체적 원인피해면적(합계): 산불로 인해 피해를 입은 총 면적이 정보를 통해 산불 발생의 시간적·공간적 특성을 종합적으로 분석할 수 있으며,예방 중심의 산불 관리 정책 수립과 현장 대응력 강화에 활용할 수 있습니다.'
