summary_user: 산림 내 일반 병해충 방제 실적을 사업 건별로 담은 전국 단위 파일(CSV, 약 50만 바이트)로, 병해충명·방제명·관리기관·방제지역·방제사업명·방제면적·방제본수·방제 시작·종료일자를 담는다. 지자체나 분석가가 "어느 지역에서 어떤 병해충을 언제 얼마나 넓게 방제했는가"처럼 병해충별 방제 이력과 지역별 실적을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관리기관명·방제지역명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 산림 내 일반 병해충 방제 현황을 체계적으로 관리하기 위한 이 데이터는 병해충명, 방제명, 관리기관, 방제지역, 방제사업명, 방제면적, 방제 시작 및 종료일자, 방제본수 등 다양한 정보를 포함한다. 이를 통해 병해충의 발생과 확산을 효과적으로 방지하고, 방제사업의 진행 현황과 성과를 분석하여 사업의 효율성을 높일 수 있다. 또한 병해충별 방제 이력 추적, 지역별 실적 비교, 예산 집행의 타당성 검토 등에도 활용되며, 산림 생태계의 건강성을 유지하고 병해충 관리 정책 수립에 기초 자료로 활용된다. 데이터는 정기적으로 갱신되어 최신 방제 현황을 반영하므로, 현장 대응과 전략 수립의 실효성을 높이는 데 기여한다.
