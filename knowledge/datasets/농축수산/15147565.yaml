description_portal: 이 데이터는 해양수산부에서 항만도전자해도에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 생산규모수, 최종변경일자, 해양조사구분코드, 조사년도, 조사기관명, 공간정보 데이터로 구성되어 있습니다.본 데이터는 항만도전자해도 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.항만도전자해도란 항해용 전자해도(ENC) 중 항박도(Harbor Chart)에 해당하는, 항만 및 항만 주변 지역의 상세한 항해 관련 정보를 수록한 디지털 지도를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
