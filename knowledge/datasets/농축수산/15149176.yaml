description_portal: 이 데이터는 해양수산부에서 생산가공출고관리에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 이력추적등록번호, 제품명, 출고구분명, 꼬리표사용여부명, 꼬리표구간, 꼬리표단위, 출고일자, 출고량, 출고단위, 출고단위명, 거래처공사등록명, 상품명, 환산중량(KG) 데이터로 구성되어 있습니다.본 데이터는 생산가공출고관리 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.생산가공이란 원자재나 소재에 인위적인 기술과 노력을 가하여 새로운 제품이나 물건을 만들어내는 일련의 과정을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
