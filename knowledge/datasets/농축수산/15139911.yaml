description_portal: '"제주특별자치도 내 노지감귤관측조사(당도)정보 데이터를 제공합니다.항목: 해당년도, 조사월, 측정항목, 도, 제주시, 서귀포시* 「제주특별자치도_노지감귤관측조사(당도)정보」는 제주특별자치도에서 생산되는 노지 감귤의 품질 및 유통 관리를 위해 실시되는 당도(브릭스) 조사 결과를 담은 공공데이터입니다. 매년 8월에 정기적으로 진행되는 2차 관측조사 결과를 제공하며, 2009년부터 2024년까지의 조사 데이터가 축적되어 있습니다.* 제공년도 : 2009년부터 2024년까지* 데이터 제공 기관: 제주특별자치도 농업기술원자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/join/evaluation/part10/11.htm"'
