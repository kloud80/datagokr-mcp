description_portal: '풍황계측기 허가현황 공공데이터는 풍력발전 사업 추진을 위해 설치되는 풍황계측기에 대한 행정기관의 허가 정보를 체계적으로 정리한 자료로  「산지관리법」 제15조의2 제1항에 근거하여, 풍력 발전 사업 추진을 위한 풍황계측기 설치를 목적으로 김천시 관내 산지에 대해 일시적으로 사용이 허가된 현황을 정리한 것입니다.자료는 김천시 산림과 산지관리팀에서 제공하였으며, **산지전용통합정보시스템(산e랑)**을 통해 접수된 산지일시사용허가 신청 건에 대해 현장 확인, 법적 요건 검토, 이행사항 점검 등의 절차를 거친 후, 최종적으로 허가가 완료된 사례에 한해 정리된 것입니다.📋 자료 개요법적 근거: 산지관리법 제15조의2(산지의 일시사용 허가)자료 범위: 경상북도 김천시 관할 내사용 목적: 풍황계측기 설치 (풍력 발전 가능성 조사)허가 주체: 김천시 산림과 산지관리팀접수 경로: 산지전용통합정보시스템(산e랑)유의 사항본 자료는 산지일시사용 허가가 완료된 건에 한해 제공됩니다. 허가 신청 중이거나 반려된 건은 포함되어 있지 않습니다.현황 자료는 지속적으로 업데이트되며, 해당 업체의 철거 및 원상복구 완료 여부는 별도 관리 대상입니다.만료일 경과 후에도 복구되지 않은 경우 관련 법령에 따라 조치가 취해질 수 있습니다.'
