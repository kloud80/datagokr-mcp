summary_user: 수입 식물(과수묘목·유실수묘목 등)에 부과된 격리재배 검역 명령을 대상 품목별 명령 건수로 묶은 전국 단위 집계 자료로, 포털 설명상 2023년과 2024년 현황을 담는다. 검역·방역 분석가나 묘목 수입업자가 어느 과수묘목 품목이 많이 수입되어 격리재배 명령을 받는지 보고 병해충 유입 위험도를 가늠하는 데 쓴다. 필드는 품목명과 건수뿐이고 전역 조인 키가 없어, 다른 검역·수입 통계와는 품목명을 이름으로 맞춰야만 이어 쓸 수 있다.
description_portal: 식물방역법, 격리재배 검역요령 고시 등에 따라 격리재배명령현황 데이터는 수입 식물(과수묘목, 유실수묘목 등)의 병해충 유입을 예방하기 위해 부과된 격리재배 명령의 집행 내역을 정리한 자료로, 대상 식물종, 명령 건수 등을 제공합니다. 현재 제공되는 자료는 2023년과 2024년의 현황을  취합하여 작성하였고, 국내 수입식물 특히 과수묘목 중 어느 품목이 많이 수입되고 검역되는지 알수가 있고, 이를 통해 수입식물 검역 관리 강화 및 병해충 유입 위험도 평가에 중요한 기초 자료로 활용됩니다.
