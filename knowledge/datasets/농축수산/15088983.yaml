description_portal: 서울농부포털 정책자료 및 도시농업정책 정보 데이터는 서울시의 도시농업과 관련된 주요 정책, 제도, 추진 사례 등을 체계적으로 제공하는 공공정보입니다. 연번을 통해 각 자료를 식별할 수 있으며, 구분 항목을 통해 자료가 일반 정책자료, 연구보고서, 지침, 안내서 등 어떤 유형에 해당하는지 한눈에 파악할 수 있습니다. 제목과 내용에는 도시농업 정책 방향, 지원사업, 법·제도 변화, 교육 및 지원 프로그램 등 시민과 관계자에게 필요한 핵심 정보가 담겨 있습니다. 등록일시는 자료의 최신성 및 정책 변동 시점을 확인하는 기준이 되며, 첨부파일을 통해 상세한 보고서, 계획서, 통계자료, 안내문 등을 내려받아 활용할 수 있습니다. 이 데이터는 도시농업 관련 행정 담당자, 연구자, 활동가, 시민이 서울시 도시농업 정책의 흐름을 이해하고 실제 사업과 참여 활동에 참고하는 데 유용한 자료입니다.
