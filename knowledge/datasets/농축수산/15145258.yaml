description_portal: 농림축산식품부에서는 전출전입 정보를 제공합니다.본 정보 제공 데이터는 사업년도, 경영체일련번호, 전출전입일련번호, 경영체명, 진행상태명, 요청일자, 처리일자, 요청관할기관, 처리관할기관등의 정보를 포함하고 있습니다.본 제공자료는 사업년도별 경영체가 언제 어디로 전출/전입하였는지에 대한 정보를 보여주는 데이터 입니다.요청관할기관 항목을 데이터를 통하여 기존 관할 지역정보를 대략적으로 확인 할 수 있으며, 처리관할기관 항목 데이터를 통하여 이후 관할 지역정보를 대략적으로 확인 할 수 있습니다. 또한 경영체일련번호는 마스킹처리한 경영체명에 대하여 식별이 가능하도록 순차채번을 적용하였으며, 동일 경영체인경우 같은 경영체일련번호로 식별이 가능합니다.
