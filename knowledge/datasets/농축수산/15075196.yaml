description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 서귀포자연휴양림은 제주 서귀포시 대포동 산 1-1번지에 위치한 총면적 255 ha의 자연 숲 휴양림으로, 인공 조림을 최소화하고 제주 본연의 산림 생태를 보존한 우리나라 최남단 자연휴양림이며 해발 약 700 m 고도 덕분에 시내보다 기온이 낮아 초여름부터 가을까지 삼림욕, 산책, 캠핑 등 쾌적한 숲 체험이 가능하고 목재·데크 산책로, 평탄 보행로, 장애인 전용 주차장, 무단차 출입구, 유도 및 보조시설, 숙박동 및 야영장 등 다양한 편의시설이 갖춰져 있어 휠체어 이용자, 고령자, 유아동반가족 등 누구나 자연 속에서 안정적으로 휴식과 치유의 시간을 보낼 수 있는 열린 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
