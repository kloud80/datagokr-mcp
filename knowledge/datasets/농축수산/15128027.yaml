description_portal: 본 데이터는 전라남도 나주시 지역에서 재배되는 배의 생산면적 현황을 정리한 파일로, 읍면동별로 배 재배면적, 생산량을  파악할 수 있는 정보를 포함한다. 배는 나주시 지역을 대표하는 특화 농산물이므로 본 자료를 통해 과수농가의 재배 기반과 지역별 생산 여건을 분석할 수 있다. 농업정책 수립, 과수산업 육성, 농업보조사업 대상 검토, 재해보험 및 농가 지원정책 마련, 농산물 생산량 예측, 유통·판매 전략 수립 등에 활용할 수 있다. 또한 기후변화에 따른 재배 적지 변화, 고령화에 따른 과수 재배면적 감소 여부, 지역 농업 경쟁력 분석을 위한 기초자료로 활용 가능하다. 행정자료뿐 아니라 민간 유통업체와 농업 관련 기업이 산지 규모를 파악하고 계약재배, 저장시설, 가공시설 투자 판단을 할 때 참고자료로 활용할 수 있다.
