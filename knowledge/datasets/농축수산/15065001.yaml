description_portal: 인천광역시 군구별 어업권 현황(해조류, 패류, 어류등, 복합, 협동, 외해양식업,  마을어업, 정치망어업의 건수와 면적)에 대한 정보를 제공합니다. 해당자료는 인천광역시 내에 존재하는 해수면 양식업권, 어업권에 대하여 작성하였습니다.  강화군, 옹진군, 중구, 연수구, 서구에 대한 양식업권과 어업권의 종류별 건수와 해당면적(천제곱미터)에 대하여 제공하는 데이터입니다. 데이터가 존재하는 강화군, 옹진군, 중구, 연수구, 서구에 대하여 작성하였습니다.해당사항에 대한 정보는 인천광역시 수산과로 연락주시면 안내해 드리도록 하겠습니다.
