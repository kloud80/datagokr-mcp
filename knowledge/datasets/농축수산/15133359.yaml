summary_user: 농지보전부담금 부과징수 결과 가운데 수납 실적을 수납년월·관할청별로 집계한 통계로, 보전금·조성비·부담금의 건수와 금액, 그 소계를 담는다(전국 범위, csv 약 429KB). 지자체 담당자나 분석가가 '어느 관할청에서 어느 달에 농지전용 관련 부담금이 얼마나 걷혔나'처럼 농지전용 수요와 부담금 수납 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 농지·행정 데이터와는 관할청 이름 매핑이나 수납년월 기준으로만 이어 쓴다.
limits: 관할청 단위 집계라 필지별 전용 내역이나 개별 부과 건은 알 수 없고, 공간 정보가 없어 지도와 직접 연결되지 않는다. 표준 행정코드가 없으므로 다른 데이터와 붙일 때 관할청 명칭을 직접 맞춰야 한다.
