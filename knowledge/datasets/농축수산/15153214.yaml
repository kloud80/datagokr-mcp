summary_user: 경상북도 농경지를 필지 단위로 나눠 토양부호·토양명(토양통), 세부 토양부호와 그 이름, 필지 경계 공간정보(멀티폴리곤), 길이·면적을 담은 건별 파일 데이터이며, 범위는 시도(경상북도)이고 파일은 약 96KB 크기의 zip입니다. 농업 담당 공무원이나 영농 컨설턴트가 '이 필지의 토양통은 무엇이고, 어떤 작물에 맞으며 시비·토양개량을 어떻게 설계해야 하나'를 GIS에서 확인하는 데 쓴다. 실측 컬럼에는 아이디(ID)만 있고 토지고유번호(PNU) 같은 전역 조인 키가 없어, 다른 농지·필지 데이터와는 공간정보를 겹쳐 보거나 토양부호·토양명으로 맞춰 연결한다.
description_portal: 경상북도 농업환경 필지정보는 농업환경정보통합플랫폼에서 추출된 필지 기반 토양환경 자료로, 각 농경지를 토지고유번호(PNU)로 식별하고 해당 필지의 토양통, 배수등급, 토성, 자갈 함유율 등 주요 토양 특성을 정밀하게 제공하는 데이터입니다. 이 자료에는 필지의 실제 경계를 표현하기 위해 MULTIPOLYGON 형식의 공간정보가 포함되어 있으며, 이는 하나의 필지 또는 여러 부분으로 구성된 필지의 면적과 경계를 좌표 기반으로 시각화하도록 설계되어 있습니다. 이러한 공간정보는 필지 위치와 토양속성을 GIS에서 연계 분석하는 데 활용되며, 농업환경 진단, 작물 재배 적합성 분석, 시비량 산정, 토양개량 사업 설계 등 다양한 행정·현장 업무에서 필수적인 참조자료로 사용됩니다. 또한 필지별로 부여된 토양부호와 해당 토양통의 한글명을 함께 제공하여 토양특성을 직관적으로 이해할 수 있도록 구성되어 있습니다.
