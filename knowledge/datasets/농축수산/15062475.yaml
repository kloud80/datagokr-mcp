summary_user: 성주군에서 생산된 참외의 일자별·단위농협별 물량과 상품·중품 가격을 담은 파일 데이터로, 3.5KB 정도의 작은 CSV입니다. 성주 참외 농가나 유통업자, 분석가가 "최근 성주 참외 상품과 중품 가격이 날짜와 물량에 따라 어떻게 달라졌나"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS 등 다른 가격 데이터와는 날짜와 품목명(참외)을 직접 맞춰 이어 써야 하며, 단위농협은 같은 기관 코드나 이름 매핑으로만 연결된다.
