description_portal: 이 데이터셋은 제주특별자치도에서 시행 중인 가축운송차량 사전신고제의 추진 실적을 정리한 공공데이터로, 신고된 차량 수, 신고 시점, 운송 목적(사료, 사육·집유·출하용, 분뇨·퇴비 운반 등) 및 차량 출입 정보 등이 포함되어 있다. 이 제도는 축산차량을 사전 등록하고 운송 이력을 관리함으로써, 차량을 통한 가축전염병 유입이나 전파 가능성을 최소화하고, 필요 시 역학조사 및 차단 방역에 신속히 대응할 수 있도록 설계된 방역 시스템의 핵심이다. 이 자료를 통해 해당 지역의 축산차량 관리 실태, 운송 경로 및 출입 통제 현황, 방역 체계의 준수 여부 등을 객관적으로 파악할 수 있으며, 축산 방역 정책 수립, 질병 예방 및 방역 자원 배치, 축산물 유통 관리 체계 설계 등에 기초 자료로 활용할 수 있다. 데이터는 CSV 형식으로 무료 제공된다.
