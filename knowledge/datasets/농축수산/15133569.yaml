summary_user: 산림청이 새로 취득한 국유림 재산을 필지 단위로 한 건씩 담은 전국 파일로, 소재지·지번·토지관리번호, 지목, 재산면적, 계약일자, 매수목적, 경영계획 편성예정연도와 편성불가사유, 임반·소반을 담는다. 분석가나 지역 담당자가 "어느 지역에서 어떤 목적으로 국유림을 얼마나 사들였고, 그중 경영계획에 편성되지 못한 필지는 왜 빠졌는가"를 확인하는 데 쓴다. 토지관리번호(PNU)로 연속지적도·토지특성·공시지가 같은 필지 데이터와 잇고, 임반·소반으로 국유림 경영계획구 단위의 산림 데이터와 맞춘다.
description_portal: 국유림의 신규 취득 재산에 대한 정보를 체계적으로 제공하는 이 데이터는 등록연도, 상위기관, 기관, 소재지, 지번, 토지관리번호, 지목, 재산면적, 계약일자, 매수목적, 관리대상여부, 편성예정연도, 계획수립일 등 다양한 항목을 포함한다. 이를 통해 국유림 자산의 현황을 명확히 파악하고, 재산 관리, 예산 편성, 정책 수립 등의 행정업무에 활용할 수 있다. 특히 신규 취득 내역의 투명한 관리와 재산 편입 과정의 이력 관리가 가능하여, 국유재산의 효율적 운용과 책임성 있는 자원 배분에 기여한다. 해당 데이터는 정기적으로 갱신되어 최신 정보가 반영되며, 산림청의 자산 운용 체계 강화 및 지속 가능한 산림 자원 확보를 위한 핵심 자료로 활용된다.
