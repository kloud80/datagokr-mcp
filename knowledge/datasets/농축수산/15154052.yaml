summary_user: 국립수산물품질관리원이 제공하는 국외 수상생물 전염병 발생 현황을 발생 건별로 담으며, 필드 이름으로 보아 전염병 종류·발생일·수상생물 종류·국가명·지역명·보고일이 들어 있는 것으로 보입니다(명세상 필드 설명은 비어 있음). 수산물 수입·양식 사업자나 방역 담당자가 '어느 나라에서 어떤 수산생물 질병이 언제 발생했는가'를 확인해 수입 검역이나 국내 유입 위험을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명·전염병명 같은 이름 매핑이나 같은 기관(국립수산물품질관리원) 자료의 코드로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국립수산물품질관리원에서 제공하는 수상생물별 전염병 현황 정보입니다.
