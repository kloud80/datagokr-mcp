summary_user: 경기도 시군별로 친환경 학교급식에 참여하는 출하회 현황을 단체 한 곳당 한 행으로 담는다. 시군명, 출하회명, 원예·과수 같은 품목 유형, 사무실 주소, 회원수, 학교급식에 공급하는 주요 품목이 들어 있다. 학교급식 납품을 준비하는 농가나 급식 담당자, 지역 먹거리 정책 분석가가 "우리 시군에서 어떤 출하회가 어떤 농산물을 학교급식에 공급하는가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군명이나 품목명을 이름으로 맞춰 연결해야 하고, 가격 데이터와 이으려면 품목명을 KAMIS 등의 품목코드로 따로 매핑해야 한다.
description_portal: 이 데이터는 경기도 내 각 시군에서 친환경 학교급식에 참여하고 있는 출하회의 현황을 기록한 자료로, 지역 농산물의 학교급식 공급 체계를 분석할 수 있도록 구성되어 있습니다. 주요 항목으로는 ‘시군명’을 통해 출하회의 지역을 확인할 수 있으며, ‘출하회명’은 단체명을, ‘구분’은 원예·과수 등 생산 품목의 유형을 나타냅니다. ‘사무실 주소’는 해당 출하회의 소재지이며, ‘회원수’는 해당 단체에 소속된 농가 또는 회원 수를 나타냅니다. ‘학교급식 참여 주요 품목’ 항목은 해당 출하회가 학교급식에 공급하고 있는 주요 농산물을 나열한 것 입니다.
