summary_user: 경기도지사가 품질을 인증한 우수 농특산물(G마크) 등록업체를 업체 한 곳씩 담은 현황으로, 시군명·업체명·인증품목·인증번호·인증기간·지번/도로명 주소·우편번호·위경도 좌표를 포함한다. 소비자나 유통업자가 '우리 시군에 G마크 인증을 받은 업체는 어디이고 무슨 품목을 언제까지 인증받았나'를 확인하거나, 분석가가 인증 업체의 지역 분포와 주 인증 품목군을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 시군명·주소·좌표·사업자등록번호(BIZREGNO) 같은 이름·값 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도에서 품질을 인증한 우수 농특산물에 G마크를 부여받은 등록업체의 현황을 정리한 자료로, 각 업체의 명칭, 인증품목, 인증번호, 인증기간, 소재지 주소(지번 및 도로명), 위경도 좌표 등의 정보를 포함합니다. G마크는 경기도지사가 부여하는 품질 인증 마크로, 도내에서 생산되는 우수 농산물의 경쟁력을 높이기 위한 제도입니다. 해당 데이터는 G마크 인증을 받은 업체 및 품목의 지역 분포, 품질인증 지속기간, 주 인증 품목군 분석 등에 활용될 수 있으며, 도내 농산물 유통 관리, 지역 브랜드 홍보, 친환경 인증 정책 평가 등에 필요한 기초자료로 사용됩니다.
