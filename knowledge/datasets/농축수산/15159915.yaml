description_portal: '경상남도 내 이상수온(고수온·저수온) 및 적조로 인한 어업재해 발생 시 집계된 양식수산물 피해 데이터입니다.개인 어가별 정보는 제공하지 않습니다.연도별, 시·군별, 품종별 단위의 통계 정보를 제공합니다.1. 제공 내용 가. 연도별·시군별·품종별 피해 현황 나. 피해 어가 수 다. 피해량 라. 피해금액 마. 복구지원액2. 제공 범위 : 2024년 이후3. 데이터 참고사항 가. 재해 유형: 이상수온(고수온·저수온), 적조 나. 대상 지역: 경상남도 내 어업재해 피해 발생 시·군 다. 대상 품종: 피해 발생 품종(어류, 패류, 기타) 라. 피해량 단위: 마리, 줄 마. 피해금액 및 복구지원액 단위: 백만 원 바. 복구지원액: 재난지원금(국비·지방비), 자부담금 및 융자금을 포함한 금액이며, 재해보험으로 처리된 경우에는 지원액이 산정되지 않음4. 용어 설명 가. 고수온: 해수온이 28℃ 이상으로 상승하여 양식생물의 면역력 저하 및 폐사를 유발하는 어업재해 나. 저수온: 해수온이 4℃ 이하로 하강하여 양식생물의 면역력 저하 및 폐사를 유발하는 어업재해 다. 적조: 유해성 식물플랑크톤의 대량 증식으로 발생하며, 양식어류의 질식사를 유발하는 자연재난5. 참고사항 가. 피해 복구지원 관련 세부 기준은 「농어업재해대책법」 및 「어업재해 피해조사 보고 및 복구지원 요령」을 참고하시기 바랍니다. 나. 본 자료는 경상남도 「해양수산 현황」 자료집에서도 확인할 수 있습니다.'
