summary_user: 경기도 산사태위험지역에서 추진된 사방사업(사방댐 설치, 산지사방, 계류보전 등)을 관리번호(mng_id)가 붙은 사업 단위로 담으며, 사업완료년도, 상위·하위 시행기관, 시·군·읍면동·리 단위 시공소재지, 국비·지방비·합계사업비를 기록한다. 분석가나 지자체 담당자가 '어느 시군에 사방사업비가 얼마나 투입됐고 국비와 지방비 분담은 어떤가'를 연도별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군·읍면동 이름을 매칭하거나 같은 기관 코드로만 연결한다.
description_portal: 「사방사업 현황」 데이터는 경기도 산사태위험지역을 대상으로 매년 추진되는 산림재해 방지 및 복구사업 현황을 기록한 자료입니다. 주요 항목으로는 사업완료년도, 시행기관(상위·하위), 시공소재지(시·군·읍면동·리), 국비, 지방비, 합계사업비 등이 포함됩니다.이 사업은 산사태와 같은 산림재해를 예방하기 위해 사방댐 설치, 산지사방, 계류보전 등 다양한 형태의 사방사업을 수행하는 것을 목적으로 하며, 각 지역별 예산 투입 내역을 확인할 수 있습니다. 이 데이터는 산림재해 예방 정책 평가, 지역별 투자 규모 비교, 국비·지방비 분담 구조 분석, 산사태 위험도 관리 연구 등에 활용될 수 있습니다.
