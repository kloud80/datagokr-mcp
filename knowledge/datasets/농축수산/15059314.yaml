summary_user: 농림축산검역본부가 관리하는 도축검사실적을 전국 시도 단위로 월별·축종별로 담은 집계 데이터이며, 필드 이름으로 보아 당월 실적과 누계 실적을 함께 제공한다. 축산 분석가나 지자체 담당자가 '올해 우리 도에서 소·돼지 도축이 지난해보다 늘었나'처럼 지역별 도축 추세와 수급을 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시도명·시도코드(CTRD_CODE)나 축종명·축종코드를 이름 또는 같은 기관 코드로 맞춰 잇는다. KAMIS 축산물 가격과 엮을 때는 품목코드 매핑이 따로 필요하다.
description_portal: 지역별, 축종(품종)별, 도축장별 도축검사실적- 본 데이터는 축산물 위생관리법 제 34조 및 동법 시행규칙 제 54조에 근거하여 농림축산검역본부가 관리하는 시도별, 축종(품종)별, 도축장별 도축검사실적 현황을 제공함- 도축검사 결과를 기반으로 위생 기준 충족 여부, 부적합 판정, 질병 발생 현황등에 참고 자료로 활용 가능- 정부와 지차체는 본 데이터를 활용해 도축시설 관리감독, 축산물 위생정책 수립, 지역별 축산물 수급조절등의 참고 자료로 활용 가능- 축산업계 및 연구기관에서도 시도별 도축 추세를 분석하여 관련 업무에 활용 가능
