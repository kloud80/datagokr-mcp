summary_user: 광주(전남광주통합특별시) 서부농수산물도매시장에서 허가를 받아 등록된 중도매인을 한 건씩 담은 명부 파일로, 상호명·허가일자·구분·소속 법인명을 담는다. 도매시장 거래처를 찾는 식자재 구매 사업자나 유통 분석가가 '서부시장의 어느 법인에 어떤 중도매인이 언제부터 허가받아 영업하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KAMIS 가격·경락 자료 등과는 법인명·상호명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 2025년 서부농수산물도매시장 중도매인 등록현황광주광역시 서부농수산무도매시장에서 허가를 받고 등록된 중도매인 자료로 상호명, 허가일자, 소속법인 정보를 포함하고 있습니다.농수산물 유통 및 가격안정에 관한 법률 제25조 및 광주광역시 농수산물도매시장업무조례 시행규칙 제21조에 따라 중도매인의 업무를 하려는 자는 도매시장 개설자에게 허가를 받아야 합니다. 허가 시 법인의 경우  5년 이상 10년 이하, 법인이 아닌 중도매인은 3년 이상 10년 이하 범위에서 허가 유효기간이 설정됩니다.
