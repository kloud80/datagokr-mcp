description_portal: 이 데이터는 해양수산부 연안포털에서 연안 관련 용어를 정리, 제공하기 위한 목적으로 수집한 데이터입니다.  본 데이터의 주요 내용은 2024년 2월을 기준으로 연안에서 사용되는 용어 사전 일련번호, 용어명, 용어 내용, 용어의 국문초성, 영문 첫문자와 기본사용여부 정보로 구성되어 있습니다.  본 데이터는 해양 및 연안 관련 정책 연구, 현장 업무 매뉴얼 작성, 해양수산 행정 시스템 구축 시 용어 일관성 확보, 연구기관에서의 해양수산 관련 교육자료 제작과 연구 논문 작성 등에서 참고자료로 활용될 수 있습니다.
