summary_user: 전국 수협 산지조합의 목록을 조합 한 곳당 한 행으로 담으며, 조합명·조합코드·전화번호·팩스번호로 구성되고 범위는 전국이며 공간 정보는 없다. 수산물 유통 분석가나 사업자가 '특정 산지조합의 코드와 연락처가 무엇인가'를 확인하거나, 위판장 경락가 등 산지 거래 데이터에 나오는 조합을 식별하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 수산물 유통 데이터와는 산지조합명이나 산지조합 코드(mxtrCode)를 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 해양수산부에서 전국 수협 산지조합의 정보를 제공하기 위해 수집한 데이터입니다.  전체 데이터 조회 또는 특정 산지조합명 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 산지조합명, 산지조합 코드, 연락처 정보로 구성되어 있습니다.  본 데이터는 산지조합의 전국적 분포를 파악하여 수산업 경영 전략을 세우는 데 사용될 수 있습니다. 또한, 수산물 거래 흐름 분석, 지역별 유통체계 파악, 정책 연구, 수산업 현황 보고서 작성 등 해양수산 행정 및 수산업 경영 지원 자료로 활용될 수 있습니다.
