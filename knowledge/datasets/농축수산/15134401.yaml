summary_user: aTBid(비축농산물 전자입찰시스템)에서 WTO·FTA에 따른 TRQ 할당관세 농산물의 수입권 배분 공고를 공고 건별로 담은 전국 단위 파일(csv, 약 3.6KB)로, 배분 구분·배분년도·배분물량·공고 기간·상대국명·주지사항이 들어 있다. 수입업자가 "올해 어느 상대국 몫의 TRQ 물량이 얼마나, 언제까지 공고되는가"를 확인하거나, 분석가가 연도별 할당 물량 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 품목코드가 없어서, 다른 데이터와는 배분년도·상대국명·품목명 같은 이름을 맞춰 연결해야 한다.
description_portal: 비축농산물의 전자입찰 서비스 제공, 수매, 보관, 판매를 통해 농산물 물가 안정을 도모하는 비축농산물 전자입찰시스템(aTBid)에서 취급하는 정보 중 수윕권 배분과 관련된 정보입니다.WTO, FTA에 의해 정해진 TRQ 할당관세 농산물 항목에 대한 정보 및 수입권 배분 공고 관련 정보입니다.
