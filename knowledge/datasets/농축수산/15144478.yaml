description_portal: 20년 9월부터 26년 6월까지 바다 내비게이션* 설치 선박에 제공된 해양사고 관련 선박 간 충돌경보 이력을 제공합니다.* 바다 내비게이션은 선박에 장착하는 이내비게이션(e-navigation) 장비를 말하며 "지능형해상교통정보법"에 따라 21년 1월 30일 이후 건조되거나 외국으로 부터 수입되는 선박(어선, 일반선박, 모터보트 및 세일링 요트)은 해당 단말기(장비)를 의무적으로 장착해야합니다.해당 경보는 본선의 위치와 상대선의 위치를 기준으로 현재의 침로와 속력을 분석 후 관심, 주의, 경보 세단계로 구별하여 충돌 위험에 대한 정보를 제공하며 선박에서는 안전항해를 위한 자료로 활용할 수 있습니다.  해당 자료는 선박에서 바다 내비게이션 장비를 통해 충돌 경보를 인지, 확인된 경우에 한하며 개인정보(선박에 관한 정보)는 비공개 처리하였습니다.
