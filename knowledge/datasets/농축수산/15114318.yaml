summary_user: 공유수면 소규모매립 사업을 건별로 담은 목록 파일로, 사업명·면적·공사금액·면허협의일·준공검사일·매립지 주소를 포함하며 전국 408건(1996-10-01~2022-12-31)이다. 분석가나 지자체 담당자가 특정 지역에 소규모매립이 언제 얼마 규모로 있었는지 확인하는 질문에 쓴다. 법정동코드(bjd_cd)와 주소(address) 키로 다른 지역·토지 데이터와 이어 쓰고, 해양공간 영역 데이터와 함께 입지 검토에 참고할 수 있다.
description_portal: 이 데이터는 해양수산부에서 공유수면 관리 및 매립에 관한 법률에 의거하여 관리되는 공유수면 소규모 매립 정보 제공을 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 소규모매립 사업의 사업명, 면적, 사업금액, 매립지 주소 등 매립 관련 정보에 대한 목록으로 구성되어 있습니다.  본 데이터는 공유수면매립 소규모매립 사업의 현황을 분석하거나 매립 사업의 진행 상황 및 지역별 매립 규모를 파악하는 데 활용될 수 있습니다. 또한 허가나 인허가 관련 행정업무, 지자체의 지역개발 계획 수립, 매립지의 이용 실태 조사 등 정책 수립 및 평가, 관리업무에도 활용할 수 있습니다.
