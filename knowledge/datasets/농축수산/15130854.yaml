summary_user: 경기도 내 스마트팜 농가에서 자동 수집한 생육·환경 측정값을 농가·품목 단위 건별로 담으며, 시군·재배 품목·농가 식별자와 함께 외부 환경(외기온도, 풍향·풍속, 일사량·누적 일사량, 강우)과 내부 환경(온도, 상대습도, CO₂ 잔존량, 토양온도)을 기록한다. 연구자나 농업 정책 분석가가 "특정 작물의 시설 내부 온습도·CO₂가 외부 일사량·기상과 어떻게 연동되는가"를 분석하거나 환경 제어 기준을 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명·품목명 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 스마트팜 농가에서 자동 수집된 생육 및 환경 모니터링 정보를 담고 있습니다. 주요 항목에는 지역(도, 시군), 재배 품목, 농가 식별 ID, 정제 여부, 정제값 및 측정값, 외부 환경 요인(풍속, 일사량, 누적 일사량, 강우 여부), 내부 환경 요인(온도, 상대습도, CO₂ 잔존량, 토양온도) 등이 포함됩니다. 이를 통해 작물별 생육 환경과 기상 조건의 상관관계를 분석할 수 있습니다. 또한 환경 제어를 통한 작물 최적화 재배, 기후 변화 대응, 농업 생산성 향상 등 다양한 연구와 정책적 활용이 가능한 데이터 입니다.
