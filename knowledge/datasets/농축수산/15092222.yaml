description_portal: 산림청 산림항공본부 비상근무호기목록에 대한 데이터입니다. 제공 항목은 기종명과 2021년부터 2025년까지의 연도별 비상근무호기 건수로 구성되어 있으며, 최근 5개년 동안 기종별 비상근무 항공기의 운영 실적과 배치 현황을 확인할 수 있습니다. 이를 통해 연도별 비상근무호기 운영 규모와 기종별 운용 현황을 비교·분석할 수 있으며, 비상 대응을 위한 항공자원의 운영 추이를 파악하는 데 활용할 수 있습니다.* CH-47 기종은 2024년 임차하여 1년간 운용한 헬기로 해당 연도를 제외한 비상근무등록 횟수는 0입니다.
