summary_user: 농축수산물 가격 조사에 쓰이는 조사시장 코드·이름을 2015년 제·개정 표준코드 체계의 표준시장 코드·이름에 한 행씩 대응시킨 전국 단위 매핑 목록이다. 가격 분석가나 유통업 담당자가 "조사가격 자료에 적힌 이 시장이 표준코드로는 어느 시장인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 가격 데이터와는 표준시장코드(STD_MRKT_CODE)나 조사시장코드·시장명을 맞춰 보는 코드 매핑으로 연결한다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 표준시장매핑목록조회 API는 2015년 제·개정된 농축수산물 표준코드(부류, 품목, 품종)와 동일한 의미를 가지는 조사가격의 표준 시장코드를 나타내는 정보입니다. 본 API는 농축수산물 관련 시장에서 통용되는 시장코드, 시장명, 및 조사시장명에 대한 매핑 정보를 포함하고 있으며, 사용자는 이를 통해 다양한 분야에 활용할 수 있습니다. 예를 들어, 농업 및 수산업 관련 기관, 연구자, 분석가 등이 이 정보를 통해 시장 가격 변동 및 트렌드를 분석하고 데이터 기반 의사결정을 지원하는 데 기여할 수 있습니다. 특히, API의 오퍼레이션인 표준시장매핑목록조회는 이러한 표준시장코드와 관련된 포괄적인 데이터를 제공하여 사용자가 더욱 쉽게 농축수산물 시장을 이해하고 활용할 수 있도록 도와줍니다. 이 데이터는 소비자와 생산자 간의 원활한 소통을 촉진하며, 투명한 거래 환경을 만드는 데 중요한 역할을 합니다.
