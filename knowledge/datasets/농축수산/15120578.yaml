summary_user: 참나무시들음병으로 고사한 나무를 한 그루(지점)씩 X·Y 좌표, 국가지점번호, 토지관리번호(PNU), 조사일자와 함께 기록한 전국 범위의 건별 공간 자료로, 포털에서 CSV 파일(약 30만 바이트)로 받는다. 산림 담당자나 분석가가 "우리 지역 어느 필지에서 참나무시들음병 고사목이 언제 확인됐고 피해가 어느 방향으로 번지고 있나"를 확인하고 방제 대상지를 고를 때 쓴다. 토지관리번호(PNU)를 키로 필지 단위 토지·지적 자료와 잇고, 좌표와 국가지점번호로는 임상도 같은 공간 자료와 겹쳐 본다.
description_portal: 참나무시들음병 고사목상세정보 데이터는 산림병해충 방제와 관련하여 참나무시들음병으로 인해 고사한 나무의 위치와 상태를 기록한 공간정보 기반의 자료이다. 이 데이터는 지역 X, Y 좌표, 국가지점번호, 토지관리번호(PNU코드), 조사일자 등 주요 정보를 포함하고 있어 병해충의 발생 위치 및 확산 경로를 분석하는 데 효과적으로 활용된다. 또한 방제 계획 수립, 피해 지역 현황 파악, 산림 건강성 평가, 신속한 대응 체계 구축 등에 중요한 역할을 하며, 병해충 발생에 따른 예방 및 사후 조치 수립의 기초 자료로도 유용하다. 해당 정보는 주기적인 현장 조사와 갱신을 통해 최신성을 유지하여 정책 수립과 현장 대응의 실효성을 높이는 데 기여한다.
