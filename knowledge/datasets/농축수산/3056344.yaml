description_portal: 이 데이터는 해양수산부에서 연안포털 내 바닷가 관리 정보를 제공하기 위해 수집한 데이터입니다.주요 내용은 전체 바닷가 목록, 바닷가 상세정보, 점유상태/조사년도/유형분류/지역별/면적 지적도별/면젹 연속도별/관리번호별/소재지별 바닷가 목록 및 바닷가 사진 목록으로 구분되어 있으며, 각 분류별로 조사번호, 해당 바닷가의 공유수면지번관리번호, 소재지, 바닷가가 인접한 지역의 지번주소 등 상세 정보로 구성되어 있습니다.본 데이터는 연안 개발 계획 수립, 환경 영향 평가, 해양 생태계 보호 전략 마련 등에 활용될 수 있습니다.
