description_portal: 한국농어촌공사 경영회생사업은 자연재해, 부채 등으로 농업경영이 어려운 농업인이 사업 참여를 통해 부채를 상환하고 최대 10년 간 해당 농지 등을 장기 임차할 수 있는 사업입니다.경영회생사업 지원대상자는 금융기관 및 공공기관의 부채가 4천만원 이상 또는 최근 3년 이내 기간 중 농업재해로 농가피해율 50%이상이면서 자산대비 부채비율이 40% 이상인 농업경영체(농업인, 농업법인)입니다.해당 데이터는 한국농어촌공사 경영회생사업 참여 전의 작물별 평균 소유규모, 임차규모와 참여 후의 작물별 평균 경작규모를 확인할 수 있는 데이터 입니다.
