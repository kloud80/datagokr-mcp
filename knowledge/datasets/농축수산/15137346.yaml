description_portal: 농촌진흥청은 농업인이 작업 중 부상을 예방할 수 있도록, 작업 유형별로 다칠 수 있는 신체 부위와 그로 인해 발생할 수 있는 질병을 한눈에 안내하는 자료를 제공합니다. 예를 들어 농기계 운행 시 전방 주의 부족으로 머리를 부딪쳐 두통이나 어지럼증이 생길 수 있고, 과수 수확 중 높은 곳에서 작업하다가 어깨를 삐끗해 근육통이 발생할 수 있습니다. 또한 논·밭에서 장시간 허리를 굽히는 모종 심기 작업은 요통과 디스크 위험을 높이며, 장시간 햇볕 노출은 일사병과 피부질환으로 이어질 수 있습니다. 이 자료는 각 작업별 위험 부위, 관련 질병, 예방법을 직관적으로 정리해 농업인의 안전 인식을 높이고, 현장에서 즉시 활용할 수 있도록 제작되었습니다.
