description_portal: 본 데이터는 경상북도 칠곡군의 농기계 임대장비 현황 데이터로 농기계 사업소명, 사업소전화번호, 도로명주소, 위도, 경도, 트랙터및작업기보유대수 및 경운기,관리기,땅속작물수확기,탈곡기 등의 자료를 제공합니다. 본 자료를 통하여 칠곡군 내 농기계임대사업장 위치, 농기계의 종류 등을 확인하고, 필요한 농기계를 시기 적절하게 임대하는 등 효율적 영농사업 운영에 활용하여 주시기 바랍니다. 이 사업은 고가의 농기계를 직접 구매하기 어려운 소규모 농가에게 다양한 농기계를 저렴한 비용으로 빌려주어 안정적인 영농 활동을 지원하는 것을 목표로 합니다.
