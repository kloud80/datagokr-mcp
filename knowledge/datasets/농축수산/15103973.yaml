description_portal: 해양생명자원통합정보시스템(MBRIS)은 전국의 연안 및 도서지역을 중심으로 지역 주민들이 과거부터 현재까지 활용해 온 해양생물자원 관련 전통지식을 체계적으로 조사·분석하고 있습니다. 이 전통지식은 개인이나 공동체가 세대를 거쳐 축적해 온 생활양식, 관습, 기술, 정보 등을 포함하며, 해양수산 생명자원의 지속가능한 이용과 생물주권 확보에 있어 매우 중요한 자산입니다. 해양수산생명자원의 범위는 단순한 동식물에 국한되지 않고, 해양 미생물은 물론 이들 생물로부터 파생된 유전자 및 생물정보까지 아우르는 포괄적인 개념입니다. 이러한 자료는 전통지식의 보존과 과학적 활용 가능성을 높이는 데 기초자료로 활용되며, 향후 정책 수립, 자원 관리, 생물산업 분야 연구에 있어 중요한 기반이 됩니다.
