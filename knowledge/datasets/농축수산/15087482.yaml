summary_user: 한국농수산식품유통공사(aT) KAMIS가 전국 19개 도시 54개 시장에서 매일 조사한 농축수산물 소매가격을 품목·품종·등급(상품/중품)별 월평균 가격으로 묶은 집계 파일로, 포털 설명상 90품목 143품종을 대상으로 하며 연도·유통단계별 무게·단위를 함께 담는다. 소비자나 물가 분석가가 "특정 수산물·농산물이 어느 달에 싸지는지", "품목별 소매가격이 해마다 어떻게 움직였는지"를 확인하는 시계열 비교에 쓴다. 전역 조인 키가 없어 다른 가격 데이터(도매가격·위판장 경락가격 등)와는 품목명·품종명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '월별 소매 가격정보에 대한 데이터로, - 소매 19개 도시 54개 시장에서 조사한 농축수산물 가격자료- 소매 90품목 143품종을 대상으로 2개 등급(상품/중품) 기준으로 조사한 월평균 가격 자료매일 조사된 농수산물의 품목별 월 평균 소매 가격 및 거래량 데이터aT KAMIS에서 제공되는 데이터*KAMIS: 농산물 유통과 관련된 다양한 정보 제공을 위해 aT가 운영 중인 서비스. 전국 주요 도소매시장 가격정보, 거래동향, 성수품-제철 농산물 정보 등 제공데이터 활용 방안 예시- 농산물이 저렴한 시기에 합리적인 소비 가능- 품목별 시계열 가격번속, 도소매 가격 비교'
