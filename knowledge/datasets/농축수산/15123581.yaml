description_portal: 국가농작물병해충관리시스템(NCPMS)은 기후변화에 대응하기 위한 중요한 자료로 기후변화 시나리오 데이터를 제공합니다. 지구 평균 기온의 지속적인 상승과 국내 기온 상승폭이 세계 평균보다 두 배 이상 높다는 분석에 따라, 정부는 2008년 새로운 표준온실가스 시나리오인 대표농도경로(RCP) 4종(2.6, 4.5, 6.0, 8.5)을 선정하였습니다. NCPMS는 이 중 기상청 기후변화시나리오 RCP 기반 기후모델을 적용하여, 10년 주기 연대별 지역별 병해충 및 잡초의 기후변화 영향평가 정보를 제공하고 있습니다. 현재 대용량으로 샘플데이터만 등록된 상태입니다. 전체 데이터를 제공 받길 원하실 경우 담당자에게 별도로 연락주시기 바랍니다.
