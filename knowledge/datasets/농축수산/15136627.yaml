description_portal: 본 데이터는 농식품지식정보서비스에서 제공하는 실시간 가격 조회 목록입니다. 농림수산식품교육문화정보원은 농업 정보 플랫폼 ‘농업ON’을 통해 주요 농산물의 실시간 가격 정보를 제공하고 있으며, 본 자료는 각 도매시장과 상가를 기준으로 품목별 가격 조회를 위한 기초 정보를 정리한 것입니다. 데이터는 조회일자, 도매시장명, 상가명, 품목 대분류, 품목 소분류 항목으로 구성되어 있으며, 실시간 가격 정보 시스템과 연계하여 유통 흐름 분석, 품목별 가격 비교, 수급 예측 등 다양한 응용 서비스에 활용됩니다. 이 데이터는 실시간 데이터 기반의 가격정보 서비스 품질 향상, 소비자 대상 농산물 시세 제공, 유통정책 기획 및 수급관리 체계 운영 등에서 기초 자료로 활용되며, 공공데이터포털을 통해 개방됩니다.
