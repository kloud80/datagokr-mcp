summary_user: 울산광역시 농수산물 도매시장의 거래실적을 구분(법인 등)별로 24년도·25년도 물량(톤)과 금액(백만원)으로 집계한 소규모 파일(csv 286바이트)이다. 울산 도매시장에서 법인별 거래 규모가 전년 대비 얼마나 늘거나 줄었는지 보려는 유통 정책 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키나 품목코드가 없어, 다른 도매시장·KAMIS 가격 자료와는 법인명·연도를 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 농수산물 도매시장 내 법인별 거래 실적 정보이다. 법인별 품목, 거래량, 거래 금액을 포함한다. 도매시장은 농수산물 유통의 중심지로서 대량 거래를 통해 가격을 형성하고 원활한 수급 조절 기능을 수행한다. 해당 자료는 농수산물 유통 정책 수립, 가격 안정화 대책 마련, 시장 거래 투명성 제고에 활용된다. 법인별 거래 실적 분석을 통해 유통 구조를 파악하고 시장 운영 효율화 방안을 마련할 수 있다. 또한 품목별 거래량 및 가격 추이 분석을 통해 수급 불균형 예측 및 대응 계획을 수립한다. 생산자와 소비자가 합리적인 가격 정보를 확인하여 거래 의사 결정에 활용할 수 있도록 지원한다. 본 정보는 정기적으로 갱신된다.
