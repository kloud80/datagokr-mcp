summary_user: 농식품인재개발원(옛 농식품공무원교육원)이 운영하는 공무원 교육과정의 과정별 연간 운영횟수와 일정을 담은 계획표이며, 파일 첫 행이 '2026년도 집합 교육과정 운영계획(안)' 제목이고 나머지 열은 이름 없이 들어온 원본 엑셀 형태다. 농림축산식품부 소속 공무원이나 교육 담당자가 '올해 어떤 직무·리더십·AI 교육과정이 언제 몇 차례 열리는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 과정명 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 농림축산식품부 농식품공무원교육원에서 운영하는 교육에 대한 과정별 연간 운영횟수와 일정 등을 포함한 계획으로 업무성과 창출을 위한 직무전문교육 강화, 신규자 및 AI 등 수요 높은 교육 확대, 리더십 등 역량개발 교육 강화, 공직자의 기본소양 내재화 교육 지속 확대, 업무성과 중심 교육설계 표준모델 개발을 적용, 업무에 도움이 되는 학습 과제 교육 확대, HRD 트렌드를 반영한 다양한 교육방식 활용, 교육과정 평가 및 피트백 강화, 자기주도 학습을 위한 학습플랫폼 개편 및 활성화, 교육원 HRD 역량강화가 세부 과제 입니다.
