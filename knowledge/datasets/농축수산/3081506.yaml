summary_user: 전북특별자치도 시군별로 해면어업과 내수면어업을 나눠 어가 수, 어가 인구, 어업종사자 수를 담은 집계 통계로, 509바이트 크기의 작은 CSV 파일이다. 지역 수산 정책 담당자나 분석가가 '전북에서 어업 가구와 종사자가 가장 많은 시군은 어디이고 해면어업과 내수면어업 비중은 어떻게 다른가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 이름을 행정구역 코드에 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내 시군별 어가 및 어업 인구 현황을 종합적으로 보여주는 통계 자료입니다. 각 지역을 기준으로, 바다에서 조업하는 '해면어업'과 강이나 저수지 등에서 조업하는 '내수면어업'으로 구분하여 관련 정보를 상세히 제공합니다. 세부적으로는 각 어업 형태에 따른 어업 가구 수(어가), 해당 가구의 총인구, 그리고 실제 어업에 종사하는 인구 수를 포함하고 있습니다. 이 자료를 통해 전북특별자치도 내 수산업의 지역별 분포와 규모를 파악하고, 해면어업과 내수면어업의 비중을 비교 분석하는 데 효과적으로 활용할 수 있습니다
