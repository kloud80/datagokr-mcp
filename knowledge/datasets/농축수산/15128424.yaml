description_portal: 인삼을 포함한 농산물 수출과 관련된 기관에 대한 데이터로, 기관명과 기관에서 운영하는 웹사이트 주소와 데이터기준일 정보가 수록되어 있습니다. 2024년 6월 기준 총 8개의 기관 정보가 제공되고 있습니다. 수록된 기관으로는 농산물수출정보, 대한무역투자진흥공사(KOTRA), 관세법령포털정보, FIS식품산업통계정보, 농림축산검역본부, aT수출종합지원시스템, 한국농수산식품유통공사, 농림축산식품부가 있습니다. 본 데이터는 금산군 지역 내 농업 종사자나 수출업체가 수출 절차를 효율적으로 이행하고, 관련 기관과의 협업 또는 자료 검색 시 활용할 수 있도록 구성된 공공데이터입니다. 수출 유통경로 분석, 수출지원을 위한 정책 기초자료 등으로 활용할 수 있습니다.
