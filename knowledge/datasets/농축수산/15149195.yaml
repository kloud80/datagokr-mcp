summary_user: 전국 해양 관측소의 실시간 관측값(풍향·풍속·최대풍속·기온·습도·기압)을 관측소별 건 단위로 담은 CSV 파일로, 확인된 범위는 1,000행이며 모두 2024-03-20 하루치다. 낚시·레저 이용자나 양식 사업자, 분석가가 특정 관측소 주변의 바람과 기압 등 해상 기상 상태를 확인하는 질문에 쓴다. 경도·위도 좌표가 조인 키라서 좌표 기준으로 다른 위치 데이터와 이어 쓰며, 관측소코드 같은 별도 코드표는 필드 목록에 없다.
description_portal: 이 데이터는 해양수산부에서 실시간관측정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측일자, 관측소명, 풍향, 풍속, 최대풍속, 기온, 습도, 기압, 경도, 위도, 값(BAL_VLT), RAW데이터번호데이터로 구성되어 있습니다.본 데이터는 실시간관측정보 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.실시간관측정보란 을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
