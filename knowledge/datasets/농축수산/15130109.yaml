description_portal: 이 데이터는 해양수산부 국립해양조사원에서 국내 연안의 마을어업, 양식어업, 정치망어업에 대한 어장 정보 제공을 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2022년을 기준으로 조사된 전국 어장의 SHP형식 공간정보 파일로 구성되어 있으며,  각 어장의 주소, 어업구분, 어업종류, 어업방법, 양식물의 종류, 어장 면적 및 어업 면허기간 등 정보를 포함하고 있습니다. 본 데이터는 해양수산부 국립해양조사원, 지방자치단체, 어업 관련 협회 등에서 어장 실태조사, 어장 관리 계획 수립, 해양환경 보호 정책 개발을 위한 기초자료로 활용될 수 있습니다. 또한, 어장 위치 및 특성을 토대로 연안 개발, 해양 공간계획, 어업지원사업 등 특정 정책 시행에 참고자료로 사용할 수 있습니다.
