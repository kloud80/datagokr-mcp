description_portal: 한국농어촌공사에서 제공하는 임차농지 현황 데이터입니다.해당 데이터는 전국 시군구별 임차농지 현황에 대한 CSV데이터로 시군구 코드, 시군구명, 필지수, 면적(ha) 항목으로 구성되어 있습니다. 최신 파일의 경우 2025년 3월말 기준 전국 시군구별 임차농지현황에 대한 시군구 코드, 시군구명, 필지수, 면적에 대한 내용을 제공하며,이후 매년 3월 31일 기준 임차농지 현황 데이터에 대해 연간 주기로 업로드 될 예정입니다.해당 데이터와 관련하여 질의사항이 있는 경우 담당자 연락처로 연락주시기 바랍니다.
