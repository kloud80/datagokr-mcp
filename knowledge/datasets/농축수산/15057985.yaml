summary_user: 한국마사회에 등록된 말 한 마리 단위로 마명·출생일·성별·품종·혈통(부마·모마), 소유자·생산자·생산목장, 혈통·번식·경주마 등록 이력, 경매 낙찰 정보, 상금·평균우승거리 같은 경주 성적을 담는 건별 상세정보이며, 범위는 전국이다. 경마 분석가나 마주·생산자가 특정 말의 혈통과 경매 낙찰가, 소속 이력, 누적 성적을 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어 마번(hr_no)·마명이나 한국마사회 내부 번호(생산자·소유자·소재지 번호)로만 같은 기관의 경주·마필 데이터와 연결한다.
description_portal: 한국마사회 마필에 대한 상세정보를 제공합니다. (제공자료는 마번, 마명, 영문마명, 출생일, 성별, 모색, 연령, 생산국, 수입국, 원마명, 품종, 부마 모마 외조부마 관련정보, 용도, 소유자 정보, 조교사, 소재지 정보, 혈통 정보, 번식 정보, 경주마 등록 정보, 경주마 불용정보, 경주마 입사정보, 경주마 퇴사정보, 최종 휴양정보 및 경주 성적정보 등의 자료입니다). - 요청메세지에 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows), 마명(hr_name), 마번(hr_no)을 이용하여 자료를 조회하실 수 있습니다.
