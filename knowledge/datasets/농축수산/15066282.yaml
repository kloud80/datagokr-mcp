description_portal: 정부보급종 원종인수 현황에 대한 데이터로 년산, 지원명, 품종명, 생산기관, 원종격하개별공급, 원종격하계통공급, 원종격하기타, 인수량, 보급종생산용, 타지원전배(원종), 타지원전배(원원종), 원종격상, 원원종격하, 불합격량, 타지원배부량 등의 정보를 제공합니다.※ 원종인수? 원종인수는 정부 기관이나 도(道) 농업기술원 등 전문 기관에서 생산한 "원종(原種)"을 "인수(引受)"하는 과정을 의미해요. 여기서 "인수"는 어떤 물건이나 권리, 책임 등을 넘겨받는다는 뜻입니다. 결국, 새로운 품종의 종자를 안정적으로 증식하고 농가에 보급하기 위해, 보급종 생산에 사용할 종자인 "원종"을 공식적으로 넘겨받는 행위라고 할 수 있습니다.※ 제공되는 데이터는 "CSV(Comma Separated Values, 쉼표로 값을 구분하여 데이터를 저장하는 파일 형식)" 타입으로 엑셀(Excel), 한셀, CSV 전용 뷰어나 메모장등으로 데이터 확인이 가능합니다.
