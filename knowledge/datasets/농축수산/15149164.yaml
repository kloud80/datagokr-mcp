summary_user: 해양수산부가 공동활용체계로 모은 문화재보호구역 공간정보를 구역(공간정보일련번호) 단위로 담은 CSV 파일로, 지역유형·개정년도·법령고시번호·시도·시군명과 구역 도형(공간정보)이 들어 있고 범위는 전국 시군구 단위다. 해상풍력 등 해양공간 입지를 검토하는 사업자나 분석가가 "이 해역·연안 시군에 문화재보호구역이 걸려 있는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 해양용도구역·보호구역 데이터와는 시도·시군명 같은 이름 매핑이나 공간정보 도형 중첩으로 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 문화재보호구역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 지역유형명, 문화재구역개정년도, 법령고시번호, 문화재구역시도명, 시군명, 공간정보 데이터로 구성되어 있습니다.본 데이터는 문화재보호구역 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.문화재보호구역이란 국가지정문화재나 시도지정문화재 등 지정된 문화재를 보존하고 관리하기 위해 문화재 주변으로 설정하는 구역을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
