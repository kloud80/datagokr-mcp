summary_user: 농림축산식품부가 추진하는 보조사업의 지자체별 진행 현황을 사업년도·농림사업코드·사업명·관할 기관 코드 단위로 담은 전국 범위 파일(csv, 약 63KB)이다. 정책 담당자나 분석가가 특정 보조사업이 어느 지자체·기관 관할로 어느 해에 진행됐는지 확인하고, 지역별 추진 차이를 비교하는 데 쓴다. 농림사업 코드(agri_project_cd)를 키로 같은 코드를 쓰는 다른 농림사업 데이터와 이어 쓰며, 관할 기관 코드는 별도 코드표가 제공되지 않아 기관명 매핑을 따로 확인해야 한다.
description_portal: 해당 데이터는 농림축산식품부에서 추진하는 보조사업의 지자체별 진행 현황을 담고 있습니다. 주요 항목으로는 사업년도, 농림사업코드, 사업명, 관할 하부 기관 코드, 관할 기관 코드 등이 포함되어 있습니다. 이를 통해 보조금 집행의 효율성, 지역별 특성에 따른 차이, 사업 추진 과정에서의 개선점 등을 파악하는 데 유용하게 활용될 수 있습니다. 정책 담당자는 이 데이터를 기반으로 보조사업 운영의 균형성과 형평성을 확보하고, 향후 지원 방향을 설정하는 데 참고할 수 있습니다. 다만, 이 데이터는 개인정보 및 민감정보가 포함되어 있어 일부만 제공되므로 사용에 유의 부탁드립니다.
