description_portal: 데이터는 경기도 화성시 내 스마트팜 기술을 적용한 포도 재배 농가를 대상으로, 해당 농가의 관수 여부를 Y/N 형식으로 구분하여 수록한 자료이다. 농가별 고유 식별값과 함께 위치정보는 국가 공간좌표체계인 EPSG 5179 기준으로 제공되며, 개별 농장에서 실제로 관수가 수행되었는지 여부에 대한 이진 정보를 담고 있다. 수록된 정보는 작물 생육 환경의 관리 여부를 파악하고, 농가별 관수 실태 및 자동화 시스템 활용 현황을 분석하는 데 활용될 수 있다. 또한 농업정책 수립 시 스마트팜 기반 시설의 운영현황 진단 및 지역별 기술 보급 수준 평가를 위한 기초자료로 활용 가능하다. 본 자료는 단일 시점 기준으로 수집된 것으로, 사용자 분석 목적에 따라 통계 가공 및 시각화 자료로도 활용할 수 있다.
