summary_user: 국내 여러 수종의 나무 줄기 껍질(수피) 사진을 한 장씩 건별로 담고, 사진·주석 파일 이름과 주소, 국명과 학명, 촬영 지역·날짜·시간대, 데이터 생성일을 함께 제공한다. 숲 해설가나 교육자가 수종별 수피 모습을 자료로 보여줄 때, 또는 분석가가 '수피 사진만으로 수종을 가려내는 AI 분류 모델을 만들 수 있나'를 확인하며 학습 데이터를 모을 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 수종 데이터와는 국명(commonNm)이나 학명 문자열을 맞추는 방식으로만 이어 쓴다.
limits: 다른 데이터와 공통 코드로 바로 붙일 키가 없어 수종명 매핑 정확도에 결합 결과가 좌우된다. 촬영 지역은 위치 좌표가 아닌 비공간 정보라 지도 분석에는 맞지 않는다. 개발계정은 하루 5,000회까지 호출할 수 있다.
