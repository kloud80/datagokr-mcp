description_portal: 수피는 목본식물 줄기에서 형성층 바깥쪽의 모든 조직을 통칭하며, 나무 줄기의 외피로서 보호·수분 유지·병해 저항 등 중요한 생리적 기능을 담당합니다. 본 서비스는 다양한 수종의 수피 이미지를 표준 메타데이터(수종명, 촬영 위치·시기, 해상도, 촬영 조건 등)와 함께 CSV 형태로 개방하여 교육, 숲 해설, 목재 가공업, 나무의사 진단, 인공지능 분류 모델 학습, 시민과학 참여 등 폭넓은 분야에서 활용될 수 있도록 설계되었습니다. 이를 통해 학문적 연구와 산업적 응용 모두에 기여하며, 생태적 가치와 실용적 활용성을 동시에 제공하는 데이터 자원으로 기능합니다.
