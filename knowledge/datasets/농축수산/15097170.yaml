description_portal: 이 데이터는 2021년 기준 제주 지역 내 고품질 감귤 농가를 대상으로 수집된 영농행위 정보로, 총 254개의 개별 데이터가 포함되어 있으며, 농가의 실제 영농활동 이력을 정량적으로 기록한 자료입니다. 각 데이터는 구분, 대상 아이디, 아이디, 농가키, 실행타입, 실행일, 실행량, 실행량 단위, 약제명, 기타사항의 항목으로 구성되어 있습니다. 대상 아이디와 아이디는 모두 농가 식별을 위한 고유값으로 10자리 숫자로 표기되어 있으며, 실행일은 실행이 이루어진 연·월·일 단위의 날짜 정보로 2021년도 기준 데이터만 포함되어 있습니다. 실행타입 항목에는 관수, 적과, 전정, 방제, 시비, 피복 등 주요 영농행위가 구분되어 있으며, 실행량은 해당 작업의 투입량을 나타내고, 실행량 단위는 주로 리터(ℓ)로 기록되어 있습니다. 약제명 항목에는 방제나 시비 등에 사용된 주요 자재 또는 농약명이 기록되어 있으며, 기타사항 항목은 특별한 영농 조건이나 비정형적 활동 기록을 담고 있습니다. 이 데이터는 감귤 농가의 연간 작업 패턴, 영농 활동의 집중 시기, 품질 유지와 관련된 작업 빈도와 투입량 등을 분석하는 데 활용될 수 있으며, 스마트농업 기반 맞춤형 재배관리, 농작업 이력 관리, 품질 예측 및 재배 전략 수립 등 다양한 농업 데이터 기반 의사결정에 기초 자료로 사용될 수 있습니다.
