description_portal: "경기도 안성시_배 재배면적 및 생산량 정보\uFEFF 데이터는 안성시 관내에서 재배되는 배의 재배 현황과 생산 규모를 체계적으로 제공하는 공공데이터이다. 본 데이터는 2015년부터 2023년까지\uFEFF 기간 동안 안성시\uFEFF 내 읍·면·동\uFEFF 행정구역별 배 재배면적과 생산량을 연도별로 정리한 자료이다. 재배면적은 농림축산식품부\uFEFF에 등록된 농업 경영체 자료를 기준으로 산출하여, 지역별 배 재배 기반의 공간적 분포와 규모를 파악할 수 있도록 구성하였다. 생산량은 해당 재배면적에 평균 생산량을 반영한 추정치로 산정하여, 실제 생산 통계가 부재한 경우에도 정책 수립과 행정계획 수립에 참고할 수 있는 지표로 활용 가능하도록 하였다. 이를 통해 이용자는 안성시 배 재배의 시계열 변화를 분석하고, 읍면동 단위의 재배 집중 지역을 식별함으로써 과수 산업 지원, 농업 예산 편성, 지역 특화작목 육성 등의 업무에 기초자료로 활용할 수 있다. 또한 연구자와 민간 이용자는 본 데이터를 활용하여 기후 변화, 농업 구조 변화, 지역 경제와의 연관성 등을 종합적으로 분석함으로써 안성시 배 산업의 지속가능한 발전 방향을 모색하는 데 활용할 수 있는 기초 통계로 삼을 수 있다."
