description_portal: '농림수산식품교육문화정보원 농업온 시스템의 지역 시도코드는 각 지역의 농업 및 식품 관련 정보의 접근성을 높이기 위해 제공되는 데이터입니다. 본 데이터는 각 지역의 시도코드 및 시도명을 포함하고 있어, 다양한 통계나 분석 작업에 활용될 수 있습니다. 예를 들어, 농업 관련 정책을 수립하는 데 유용하며, 농식품 산업의 지역별 발전 상황을 비교 분석하는 데 필수적인 자료로 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 시도코드(숫자형): 각 시도의 고유 코드이며, 시도명(문자형): 해당 시도의 명칭을 나타냅니다. 이러한 정보를 통해 농림수산식품교육문화정보원은 데이터 기반의 의사결정을 지원하고, 지역별 농업 발전을 도모하고자 합니다.'
