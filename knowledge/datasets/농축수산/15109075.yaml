summary_user: 전국 축산농장을 대상질병별로 묶어 시도·시군구·읍면동과 축종(소·돼지·닭·오리 등)마다 농장 수(FARM_CO)를 담은 집계 통계입니다. 방역 담당자나 분석가가 "특정 질병 대상 농장이 어느 지역, 어떤 축종에 몰려 있는가"를 파악할 때 쓴다. 전역 조인 키는 없어서 시도·시군구·읍면동 이름이나 축종명을 문자열로 맞춰 다른 지역 통계와 잇는다.
description_portal: 본 정보는 축산물품질평가원의 축산물이력정보(소, 돼지)와 가축위생방역지원본부(닭, 오리 등 기타 축종)의 축산농장 방역정보를 기반으로 구축된 전국 축산농장에 대한 질병별 통계 현황입니다. 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 상이할 수 있으니 데이터 활용 시 참고하시기 바랍니다. 이 데이터는 축산농장의 질병별 현황, 사육 현황, 위치, 가축 종류 등의 정보를 파악할 수 있으며, 축산업의 질병 관리 및 정책 수립, 유통망 분석에 활용됩니다. 농림축산식품부는 본 데이터를 통해 축산업의 효율성과 투명성 향상에 기여하고자 합니다.
