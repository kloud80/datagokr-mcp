description_portal: 한국수목원정원관리원은 백두대간을 포함한 국내 주요 권역에서 확보한 자생식물 종자의 내부 구조를 확인할 수 있는 X-ray 촬영 이미지 데이터를 공공데이터로 제공합니다.이 데이터는 종자의 형태뿐만 아니라 내부 조직 상태를 비파괴적으로 관찰할 수 있도록 구성되어 있으며, 종자별 과명, 속명, 종명(영문 및 국문) 등 분류 정보를 포함합니다. 자생식물 종자의 건강도, 충실도, 내부 배 발달 여부 등을 정밀하게 분석할 수 있어 종자 선별, 보존, 연구 등에 폭넓게 활용됩니다.데이터는 CSV 형식으로 제공되며, 이미지 파일은 개별 종자와 연동됩니다.주요 항목은 도입번호, 과명, 과국명, 속명, 속국명, 도입학명, 국명 등으로 구성되어 있으며, 각 종자에 대한 X-ray 이미지는 별도 파일 또는 링크로 제공되어 시각적 분석이 가능합니다.본 데이터는 종자 내부 구조 비교, 발아력 예측, 생명력 판별, 식물자원 보전 및 식물학 교육자료로 활용도가 높습니다. 비파괴 분석이 가능한 X-ray 이미지는 종자은행, 연구기관, 교육기관 등에서 다양한 목적으로 사용할 수 있습니다.
