description_portal: '- 전라남도 ICT융복합 확산농가 지원 통합 모니터링 시스템의 2024년 일별 접속통계 정보를 조회하실 수 있습니다.- 전라남도는 ICT(정보통신기술)를 활용하여 농업의 경쟁력을 강화하고 스마트 농업 환경을 조성하기 위해 ICT 융복합 확산농가 지원사업을 추진하고 있습니다. 이 사업은 농업인의 생산성 향상과 경영 효율화를 목표로 하며, 다양한 시설과 장비를 지원합니다.- 대상 농가: 스마트팜 ICT 기술을 도입하여 자동화 시설을 운영하는 농업인 및 생산자단체- 지원 조건: 사전 컨설팅을 통해 기술 도입 가능성이 인정된 농가- 신청서 제출: 관할 시군청에 필요한 서류를 제출'
