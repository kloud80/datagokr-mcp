summary_user: 서귀포시 감귤을 노지 온주·조생·만감류·월동감귤 같은 품종별로 나눠 연도별 재배 면적(헥타르)과 생산량(톤)을 담은 시군구 단위 집계 통계로, 건별 원천 자료가 아니다. 농업 정책 담당자나 연구자가 서귀포 감귤이 노지 온주에서 만감류로 얼마나 전환됐는지, 면적 대비 생산량이 해마다 어떻게 달라졌는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 감귤 통계나 KAMIS 가격 자료와는 연도·품종명을 직접 맞춰 이어야 하며, 품목코드가 KAMIS·도매시장·KOSIS마다 달라 별도 매핑이 필요하다.
description_portal: 이 데이터는 서귀포시에서 생산되는 감귤의 품종별 재배 면적과 생산량이 연도별로 정리된 통계 자료입니다. 노지 온주 감귤, 조생·만감류·월동감귤 등 다양한 품종이 포함되어 있으며, 각 품종별로 연간 재배 면적(헥타르)과 생산량(톤) 간의 관계와 변화 추이를 확인할 수 있습니다. 이를 통해 농업 정책 담당자는 생산 구조 변화, 품종 전환 추세, 재배 효율성 증대 여부 등을 분석하고, 농가 및 유통업체는 품종별 수익성 및 수요 예측에 기반한 경영 전략을 수립할 수 있습니다. 또한 연구기관에서는 기후변화, 품종 개발, 지역 농업 경쟁력 분석 등에 본 데이터를 활용할 수 있습니다.
