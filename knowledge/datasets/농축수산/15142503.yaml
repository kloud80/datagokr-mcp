summary_user: CMEMS 위성 해수면 높이 자료로 산출한 일 단위 표층해류도를 해역(지역명)과 관측일자별로 묶어 해류도 이미지 URL로 제공하는 전국 범위 API입니다. 운항사·어업인·해양 분석가가 특정 해역의 특정 날짜 표층 흐름이 어느 방향이었는지 그림으로 확인할 때 쓴다. 실측 필드에서 전역 조인 키를 찾지 못해, 다른 해양 관측 데이터와는 지역명(ocSeNm)·관측일자를 이름·날짜로 맞춰 연결해야 한다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 코페르니쿠스 해양환경감시서비스(CMEMS)의 인공위성 기반 해수면 높이 자료를 기반으로 일 단위 표층해류를 산출하여 제공하기 위해 제작되었습니다.  검색대상 해역, 검색일시 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 지역명, 관측일자 및 해류도 이미지 URL 정보로 구성되어 있습니다.  본 데이터는 해상 운항 경로 최적화, 해양 사고 및 오염 물질 확산 예측, 수산업 자원 이동 경로 분석, 연근해 환경 모니터링 등을 위한 기초자료로 활용될 수 있습니다.
