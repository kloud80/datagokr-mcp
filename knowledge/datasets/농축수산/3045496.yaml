description_portal: 강원특별자치도에서 운영 중인 농어촌 민박 운영 개소수를 시군별로 분류하였고, 민박명, 민박소재지, 정상운영 여부를 추가적으로 기재하였습니다.또한, 해당 데이터를 통하여 강원특별자치도내 농어촌 민박 운영현황을 데이터화 하여 농촌관광 이용객의 편의성 및 농촌관광 활성화를 제고할 수 있고, 요즘 여행 트렌드 변화에 따른 농어촌 민박에 수요가 증가에 도움을 줄 수 있습니다.아울러, 대규모 리조트 등 숙박 레저시설에 비해 상대적으로 홍보 마케팅이 부족한 농어촌 민박을 해당 데이터로 관리하여 농촌관광 체험객 유치 제고 및 농촌관광 활성화에 기여할 수 있습니다.
