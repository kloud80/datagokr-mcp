summary_user: 서울 양재동 화훼공판장에 입주한 점포를 한 행씩 담은 점포 목록 파일(CSV, 약 20KB)로, 위치·호수·점포명과 취급품목 및 점포소개를 담는다. 꽃을 사려는 소비자나 화훼 사업자가 '양재 화훼공판장 몇 동 몇 호 점포가 어떤 꽃이나 자재를 다루는가'를 찾거나, 물류업자가 건물·층별 취급 품목을 보고 배송 동선을 짤 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 점포명이나 품목명을 직접 맞춰 이어야 하고, 화훼 경락가격 같은 aT 유통 데이터와 함께 볼 때도 품목명을 일일이 대응시켜야 한다.
limits: 가격·거래량은 없고 점포 운영정보만 담기 때문에 시세 분석에는 쓰지 못한다. 포털 설명에는 컬럼 7개(배달여부·홈페이지 등)라고 되어 있으나, 실제 파일 필드는 위치·호수·점포명·취급품목 및 점포소개 4개로 확인되므로 받은 뒤 구조를 확인해야 한다. 공통 코드 키가 없어서 다른 데이터와는 이름을 맞춰 연결해야 한다.
