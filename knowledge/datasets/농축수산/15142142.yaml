summary_user: 영농 활동에서 나오는 폐기물의 종류별 발생량(하우스용·멀칭용 저밀도폴리에틸렌, 고밀도폴리에틸렌, 유리비닐, 플라스틱비닐, 농약봉지, 기타)을 연도(TOT_YR)와 시도·시군구 코드별로 담은 집계 자료이며, 범위는 전국이다. 지자체 환경·농정 담당자나 연구자가 '우리 지역의 폐비닐·농약봉지 발생량이 다른 지역보다 많은가, 해마다 늘고 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 시도·시군구 코드(CTPRVNCD, CTNDCTCD)를 이름이나 행정구역 코드에 맞춰 매핑해야 다른 지역 통계와 이어 쓸 수 있다.
description_portal: 이 데이터는 농림수산식품교육문화정보원이 제공하는 영농폐기물 관련 자료로, 하우스저밀도폴리에틸렌, 농약봉지, 유리비닐 등 영농 활동 중 발생하는 폐기물의 종류별 발생량 정보를 연도별·지역별로 제공합니다.발생량 지표를 통해 폐기물의 배출 규모를 정량적으로 분석할 수 있으며, 지역 간 발생 격차나 품목별 배출 특성을 파악하는 데 유용합니다.이 데이터는 환경 정책 수립이나 폐기물 관리 제도 개선을 위한 참고 자료로 활용될 수 있습니다. 그리고 지속 가능한 농업을 위한 기초 통계자료로 연구, 행정, 교육 등 다양한 분야에서도 활용 가능합니다.
