summary_user: 전국 100대 명산의 주차장·정류장 같은 교통시설 관심지점(POI)을 지점 한 건씩 담고, 지점마다 숲길명, 위도·경도·해발고도, 장소유형, 이정표 목적지와 방향을 함께 준다. 등산객이나 탐방 안내 서비스 개발자가 '이 산 등산로 들머리 근처에 대중교통이나 주차할 곳이 어디 있나'를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서, 숲길식별자(frtrlId)·숲길명이나 좌표를 기준으로 같은 기관의 다른 100대명산 POI·등산로 데이터와 이름·위치로 맞춰 이어 쓴다.
limits: 다른 기관 데이터와 바로 연결할 공통 코드가 없어 숲길명 매칭이나 좌표 근접으로만 결합된다. 개발계정 호출은 하루 10,000회로 제한된다.
