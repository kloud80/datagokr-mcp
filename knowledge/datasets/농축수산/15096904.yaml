description_portal: '제주특별자치도 내 동물 복지 축산 농장 정보 데이터를 제공합니다.항목: 농장명, 소재지, 인증 품목, 인증 날짜, 사육시설(동), 사육시설, 사육규모(마리), 자유방목여부 등* 제주특별자치도 내 동물복지 축산 농장 정보를 정리한 자료이다. 각 농장의 농장명, 소재지, 인증 품목, 사육규모(마리 단위), 사육시설 크기(㎡) 등의 항목이 포함되어 있다. 이 데이터를 통해 동물복지 축산 인증 농가가 제주 지역에 얼마나 분포되어 있는지, 인증 품목별·규모별 농가 특성이 어떠한지를 파악할 수 있으며, 동물복지 기준 준수 실태 평가, 축산업 환경 개선 정책 수립, 인증 확대를 위한 기반 자료로 활용 가능하다.* 활용 분야 : 동물복지 인증 농가 분포 분석, 축산업 환경 개선 및 가축 사육시설 기준 제정 등데이터 제공처: 농림축산권역본부'
