description_portal: 이 데이터는 해양수산부에서 부산지역의 해양 특성을 격자 단위로 조사한 결과를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 부산특성평가격자별 공간정보일련번호, 격자아이디, 레이어명 등과 같은 항목으로 구성되어 있습니다.  본 데이터는 부산지역 해역의 해양환경 및 수산자원 관리에 관한 연구, 정책 수립을 위한 기초자료 준비, 공간단위별 해양수산 자원 특성 분석, 해역 이용 계획 수립, 관련 기관에서의 해양환경 변화 모니터링 및 각종 통계자료 작성 등에 활용될 수 있습니다.
