summary_user: 연안 침식 조사 기선별로 조사일, 기선이 있는 시도·지역, 해안선 너비 변화, 면적, 경사도를 건별로 담은 전국 범위 파일(CSV 약 3.6MB)이다. 해안 지자체나 연안 정책 분석가가 "우리 지역 해안선이 조사 시점마다 얼마나 줄거나 늘었나"를 확인해 침식 대응·연안 정비 우선순위를 판단하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시도명·지역명 또는 자체 지역코드(기선변화지역코드)를 이름·코드 매핑해 연결해야 한다.
description_portal: 이 데이터는 해양수산부에서 연안 침식 기선의 변화 현황을 파악하고 미래 변화를 예측하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 2024년 2월 기준 기선변화 일련번호, 기선이 위치한 시도/지역명, 기선변화 조사일, 변화 해안선 너비, 면적 및 경사도 등 정보로 구성되어 있습니다.  본 데이터는 연안지역 개발 및 보전 정책을 수립하는 데 참고자료로 활용될 수 있으며, 해안선 변화에 따른 사회기반시설 점검, 해안 재해 예방 대책, 행정구역 경계 검토 등 공간정보 분석 업무에도 적용될 수 있습니다.
