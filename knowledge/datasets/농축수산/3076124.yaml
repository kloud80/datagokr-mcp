summary_user: 울산광역시 관내에 설정된 어업권을 분류·구분별로 나눠 시군구 단위의 건수와 면적(제곱미터)으로 집계한 소규모 CSV 파일(607바이트)이다. 울산의 구·군별로 어떤 종류의 어업권이 몇 건, 얼마나 넓은 수면에 설정돼 있는지 보려는 어업인·행정 담당자·분석가가 쓴다. 전역 조인 키가 없어 시군구 이름을 행정구역 코드로 매핑한 뒤 다른 시군구 단위 수산·어촌 통계와 이어 쓴다.
description_portal: 본 데이터는 관내 어업권 설정 현황 정보이다. 어업권별 어업 종류, 어장 위치, 면적, 권리자, 면허 일자, 존속 기간 등의 세부 내용을 포함한다. 어업권은 일정한 수면에서 특정 수산 동식물을 배타적으로 포획·채취하거나 양식할 수 있는 권리이다. 해당 자료는 어업 자원 관리 정책 수립, 어장 관리, 어업 분쟁 조정에 활용된다. 어업권 현황 파악을 통해 수산 자원의 효율적 이용과 어장 환경 보전을 도모할 수 있다. 또한 어업권 신규 면허 발급 시 기존 어업권과의 충돌 여부를 검토하고 적정한 어장 배치 계획을 수립하는 데 활용된다. 어업인이 합법적으로 어업 활동을 수행할 수 있도록 권리 관계를 명확히 하며, 불법 어업 단속 자료로도 활용된다.
