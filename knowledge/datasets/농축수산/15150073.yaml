description_portal: 해당 데이터는 금산군 인삼경작지 현황을 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 합성데이터는 원천데이터와 통계적으로 유사한 패턴을 가진 가상데이터로, 익명화와 통계적 변형 기법을 통해 개인정보를 철저히 보호합니다. 합성 모델(CTGAN, GMM)에 따라 각각 9,983건, 10,000건의 데이터가 수록되어 있습니다. 해당 데이터를 활용하여 금산군 특용작물인 인삼의 경작연도·면적 추세를 파악하여 지원정책 및 유통계획을 수립할 수 있습니다. 또한 지목·읍명동 기반 공간분포와 경작 특성을 분석하고 타 합성데이터와 융복합을 통해 경작지의 계절별, 날찌별 수확량의 연관관계 등을 복합적으로 분석할 수 있습니다.※ csv 파일 내 D열(경작면적) 및 E열(실제면적)의 단위는 ㎡입니다.
