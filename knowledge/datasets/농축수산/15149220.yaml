description_portal: 이 데이터는 해양수산부에서 어장환경관측에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 어장관리해역명, 정점명, 어장관측시작일자, 어장위도, 어장경도, 표층수온측정여부, 수온중층측정여부, 저층수온측정여부, 공간정보 데이터로 구성되어 있습니다.본 데이터는 어장환경관측 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어장환경관측이란 양식 어장의 지속 가능한 이용과 생산성 향상을 위해, 어장 주변의 해수, 퇴적물, 해양생물 등 어장 환경의 상태를 정기적으로 조사하여 과학적 평가와 관리의 기초 자료를 수립하는 활동을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
