description_portal: 이 데이터는 전북특별자치도 내 자연생태우수마을 및 생태복원우수마을 현황을 연도별로 정리한 자료입니다. 각 마을의 최초 지정 연도, 소재지, 지정 기간, 국비 지원액(백만원 단위) 정보를 포함합니다. 자연생태우수마을은 지역 내 생태환경이 우수한 마을을 선정하여 보호 및 지원하는 제도로, 생태계 보전과 주민의 삶의 질 향상을 목표로 합니다. 국비 지원금은 마을별 환경 보전 및 복원 사업에 활용됩니다. 이 데이터는 지역 생태환경 관리, 정책 수립, 생태 복원 및 지속가능한 마을 발전 연구에 유용한 기초자료입니다.
