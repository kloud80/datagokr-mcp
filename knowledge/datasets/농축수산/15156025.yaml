summary_user: 우리나라 관할해역 조류 예보지점별로 창조·낙조류의 최강 유속·유향과 전류 시각을 담은 예보 데이터로, 현장 관측 해수유동 자료에서 조화상수를 추출해 산출한 값이며 범위는 전국이고 지점 단위로 위치(좌표)가 붙는다. 낚시·레저 이용자나 선박 운항자가 "이 해역에서 오늘 조류가 가장 센 시각과 세기, 흐름이 바뀌는 시각은 언제인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 예보지점 경도·위도(lot, lat) 좌표나 지점 이름, 같은 기관의 관측소 코드로만 맞춰 이어 쓴다.
limits: 표준 조인 키가 없으므로 다른 해양 관측·예보 데이터와 연결하려면 좌표나 지점명·기관 자체 코드를 매핑해야 한다. 개발계정은 하루 10,000회 호출로 제한되고 serviceKey를 쿼리로 넘겨야 한다.
