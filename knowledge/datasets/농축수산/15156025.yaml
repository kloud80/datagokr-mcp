description_portal: 해양수산부 국립해양조사원_조류예보 최강창낙조 및 전류 서비스는 국립해양조사원에서 현장 관측을 통해 수집된 해수유동(유향, 유속) 관측 데이터를 기반으로 조류 조화상수 추출 및 조류예보 데이터를 산출하여,  우리나라 관할해역 조류 예보지점의 창·낙조류의 최강 유속·유향 및 전류 시각을 제공하는 서비스입니다. 관할해역 200여개 지점의 데이터를 조회할 수 있습니다. 데이터는 매년(1년 주기) 갱신됩니다. 서비스 개요, 지점 코드 정보, 오퍼레이션 명세 정보는 붙임의 오픈 api 활용가이드를 참고하시기 바랍니다.
