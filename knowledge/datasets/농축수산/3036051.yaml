description_portal: '- 전라남도 대표 명주(남도 전통주 품평회 수상작)에 대한 데이터로 제조업체, 제품명, 도수, 주종, 순위 등 정보를 제공합니다.- 전라남도는 매년 "남도 전통주 품평회"를 개최하여 지역의 우수한 전통주를 발굴하고 있습니다.- 이러한 수상작들은 전라남도의 전통주 품질을 높이고, 지역 농산물의 가치를 높이는 데 기여하고 있습니다.- 전라남도는 다양한 전통주를 보유한 지역으로, 각 지역의 특색을 살린 전통주들이 생산되고 있습니다. - 전라남도의 전통주는 지역의 특색과 전통을 살린 다양한 종류가 있으며, 품평회를 통해 그 우수성을 인정받고 있습니다. 관심 있는 전통주를 찾아보시고, 지역의 맛과 문화를 경험해 보시기 바랍니다.'
