description_portal: 이 데이터는 해양수산부에서 천일염생산정보라벨정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 일련번호 ,천일염이력그룹번호, 그룹일련번호, 꼬리표수량, 단위포함중량명, 중량,  생산년도, 천일염검사일자, 천일염출하일자 데이터로 구성되어 있습니다.본 데이터는 천일염생산정보라벨정보 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.천일염생산정보이란 바닷물을 염전에서 햇볕과 바람을 이용해 자연적으로 증발시켜 만든 천일염의 생산 과정, 방법, 원산지, 특징 등과 관련된 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라 대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
