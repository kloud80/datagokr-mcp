description_portal: 선박검사와 관련된 법령 데이터는 주로 법제처에 등록된 선박 관련 법령들을 중심으로 구성되며, 해당 법의 시행령, 시행규칙, 그리고 그 하위의 기술적 세부사항을 규정한 시설기준 등을 포함합니다. 관련 법령으로는 일반선박에 적용되는 선박안전법, 그 시행령 및 시행규칙과 하위 기준 등이 있으며, 어선에 적용되는 어선법, 그 시행령 및 시행규칙, 하위 기준 등도 포함되어 있습니다. 또한, 수상레저기구와 관련된 규정들도 있습니다. 관련 법규는 선박의 종류(어선, 일반선, 레저기구)에 따라 적용되는에 따라 검사 기준과 절차가 구체적으로 나뉘게 됩니다. 이러한 법령들은 선박의 안전 확보와 검사의 효율성 증대를 목적으로 제정되었으며, 현장 실무자 및 법령 해석자에게 중요한 참고 자료가 됩니다.그 외 낚시 관련법령등도 추가 되어 있습니다.
