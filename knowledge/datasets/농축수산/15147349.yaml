description_portal: 이 데이터는 해양수산부에서 양길항로부에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 제작일자, 전자해도단계코드, 최소범위수심, 방위방위각, 기타정보영문내용, 기타정보한글내용, 최소규모수, 자료생성일자, 원본자료내용, 수준구분코드 데이터로 구성되어 있습니다.본 데이터는 양길항로부 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.양길항로부란 제한된 경계 내부의 항해에 위험하거나 어려운 수역에서 선박의 안전한 항해를 위해 양방향 교통이 설치된 항로를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
