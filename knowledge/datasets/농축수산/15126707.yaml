description_portal: 한국수목원정원관리원은 국립세종수목원의 에너지 자립형 운영을 위한 신재생에너지 활용 실적을 공개하고 있으며, 지열 시스템 이용량 데이터를 공공데이터로 제공합니다.이 데이터는 2020년부터 2024년까지 5년간의 지열 에너지 이용량을 월별로 정리한 자료로, 국립세종수목원 내 주요 건물인 연구동, 분재전시관, 사계절 전시온실, 방문자센터 등의 지열 에너지 사용 정보를 포함합니다. 이를 통해 수목원 내 주요 공간의 에너지 흐름과 효율을 분석하고, 친환경 운영 전략 수립에 필요한 기초자료로 활용할 수 있습니다.데이터는 CSV 형식으로 제공되며, 연도·월 단위의 시계열 구조로 정리되어 있습니다.주요 항목은 건물명, 연도, 월, 지열 이용량(MWh)으로 구성되어 있으며, 각 시설별 에너지 사용 현황을 월별로 비교·분석할 수 있도록 구조화되어 있습니다. 이를 통해 냉난방 수요에 따른 계절별 지열 활용률, 건물별 에너지 소비 특성, 운영 효율성 평가 등의 응용 분석이 가능합니다.본 데이터는 신재생에너지 기반 수목원 운영, 에너지 자립도 분석, 탄소중립 전략 수립 등에 활용됩니다.공공기관은 시설 운영 성능 분석, 지열 시스템 확산 검토 등에 활용할 수 있으며, 연구기관은 기후변화 대응형 수목원 모델 연구와 에너지 절감 효과 검증에 활용할 수 있습니다. 민간분야에서는 친환경 기술 적용 사례 분석 및 스마트 수목원 기술개발에도 활용 가치가 높습니다.
