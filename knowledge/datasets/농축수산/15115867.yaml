description_portal: 이 데이터는 해양수산부에서 중국 어선의 한국 EEZ(배타적 경제수역) 내 어업 활동과 관련된 협정사항 상세정보 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 기준년도, 어업종류코드, 업종일련번호, EEZ어종코드, 총할당량, 최초생성시점, 최종변경시점, 확정여부, 확정일자, 데이터기준일자 등으로 구성되어 있습니다.  본 데이터는 한국 EEZ 내에서 중국어선의 어업 협정 사항을 파악하고, 할당량 변동과 관리 이력을 관리하는 데 활용될 수 있습니다. 정책 담당자는 협정 이행 감시 및 관련 통계자료 산출, 협정 변동사항 이력 관리, 중국어선 어업 관련 업무 문서화 등에 본 데이터를 사용할 수 있습니다.
