summary_user: 농촌진흥청 농촌인적자원개발센터가 운영한 교육과정을 과정 단위로 모은 파일로, 과정명·교육분과명·교육일·교육목적을 담는다(CSV 약 55만 바이트, 전국·비공간). 농업인이나 지도공무원이 원예치료·농업기계·도시농업 같은 분야에 어떤 교육과정이 언제 열렸는지 찾거나, 분석가가 분과별 교육 운영 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 과정명·분과명 같은 이름 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: 농촌진흥청 농촌인적자원개발센터에서 운영한 교육과정 리스트를 관리하는 공공데이터로, 강사가 수행한 교육과정명, 교육분과명, 교육일, 교육목적 및 주요 교육내용 정보를 제공합니다. 과정명에는 원예치료, 식물생리, 농업기계, 식물보호, 토양검정, 농촌문화, 도시농업, 친환경농업 등 농업 및 농촌 현장 실무에 특화된 다양한 교육이 포함되며, 각 과정별 최신 농업기술, 이론, 실습, 정책, 경영 등 실질적이고 체계적인 교육정보를 제공함으로써 농업인, 지도공무원, 연구자 등의 역량강화와 현장 실천을 지원합니다.
