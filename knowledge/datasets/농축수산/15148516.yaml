description_portal: 이 데이터는 해양수산부에서 바다목장어장조성관리에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 목장번호, 계획년차, 시설종류(A:어류용, B:패조류용, C:해조용), 설치형태 데이터로 구성되어 있습니다.본 데이터는 바다목장어장조성관리 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바다목장어장조성관리란 특정 연안 해역에 인공어초 등 시설물을 투입해 수산자원의 산란 및 서식 환경을 조성하고, 건강한 종묘을 방류하여 어장 내 수산자원을 증대시키고 관리하는 국가 정책 사업을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.목장번호는 "바다목장 효과조사 관리", "바다목장 어장조성 관리", "바다목장 어장조성 좌표", "바다목장 기본계획" 데이터의 목장번호 컬럼과 매칭 될 수 있습니다.
