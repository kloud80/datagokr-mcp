summary_user: 경기도 내 닭·오리 등의 알을 인공 부화해 판매하는 부화업체를 사업장 한 곳당 한 행으로 담은 인허가 기반 원천 목록으로, 사업장명·인허가일자·폐업일자·영업상태·도로명/지번 주소·위경도 좌표를 포함한다. 축산 정책 담당자나 분석가가 "우리 시군에 지금 영업 중인 부화업체는 몇 곳이고 어디에 있는가"를 확인하거나 지역별 분포를 지도로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 부화업체의 현황을 기록한 자료로, 닭, 오리 등 가축의 알을 인공적으로 부화하여 판매하는 업체(소)의 정보를 포함하고 있습니다. 주요 항목으로는 시군명 및 시군코드, 사업장명, 인허가일자, 폐업일자, 영업상태, 소재지주소(도로명/지번), 우편번호, 위도·경도 좌표, 업태구분명정보, 총종업원수 등이 있으며, 경기도 31개 시군의 인허가 데이터를 기반으로 구축되었습니다. 본 데이터는 행정안전부에서 제공하며, 축산 관련 정책 수립, 지역별 부화산업 분석, 축산업 등록업체 모니터링 등에 활용할 수 있습니다. 부화업체의 인허가 및 영업 현황을 파악하고, 해당 산업의 지역별 분포를 분석하는 데에도 유용한 자료입니다.
