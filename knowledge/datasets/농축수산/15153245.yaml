summary_user: 해양수산부가 제공하는 연안정비사업구역 정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 담으며, 필드로 보아 시도·시군구·지역명과 연도, 등급이 구역별로 기록된 것으로 보인다(좌표 없는 비공간 데이터). 해안 지역 주민이나 분석가가 "우리 시군구 해안 가운데 연안정비사업 대상 구역은 어디이며 언제 어떤 등급으로 지정됐나"를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않아, 법정동코드로 보이는 필드(STDG_CD)나 시도·시군구 이름을 맞춰 행정구역 단위 다른 연안·재난 데이터와 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 해양수산부에서 제공하는 연안정비사업구역에 대한 관련 정보입니다.\""
