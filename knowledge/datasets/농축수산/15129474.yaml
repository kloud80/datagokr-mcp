summary_user: 축종별 가축재해보험 가입 현황을 소·돼지·가금류 등 16개 축종 단위로 집계한 전국 단위 파일 데이터로, 대상마리수·가입건수·가입마리수·가입률·가입금액을 담으며 확인된 표 제목은 2021년 축종별 가입 현황이다. 농업 정책 담당자나 보험·축산 분석가가 "어느 축종의 재해보험 가입률이 낮아 보급 확대가 필요한가"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 축종 이름을 직접 맞추거나 같은 기관 자료와 연결해야 한다.
description_portal: 해당 데이터는 축종별 가축보험가입 통계정보로, 소, 돼지, 가금류 등 주요 축종을 포함하여 총 16종의 가축에 대한 가축재해보험 가입 현황을 담고 있습니다. 주요 항목으로는 대상마리수, 가입건수, 가입마리수, 가입률, 가입금액 등을 포함하고 있습니다. 자료에는 축종별 보험가입 마리수와 세부 통계가 포함되어 있어, 축종별 보험가입 추이와 규모를 파악할 수 있습니다. 이를 통해 가축재해보험의 축종별 보급 현황을 분석하고, 특정 축종에 대한 보험 수요나 가입률을 비교하여 향후 제도 개선 및 정책 수립의 기초자료로 활용할 수 있습니다.
