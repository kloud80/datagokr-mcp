description_portal: '경상남도 거창군의 2024년 기준는 주말농장(휴양농원, 체험농원 등)에 대한 데이터로, 농장명, 도로명주소, 면적(제곱미터) 정보를 제공 합니다.○ 데이터 기준일 : 2024. 06. 17. (일회성 데이터)○ 주말농장이란 도시민들이 주말이나 여가 시간에 농촌이나 도시 근교의 소규모 농지를 임대해 직접 작물을 재배하며 농사 체험을 즐기는 활동입니다. 주로 상추, 고추, 토마토, 감자 등 간단한 채소를 재배하며, 가족 단위의 여가 활동이나 교육 목적으로도 활용됩니다. 도시 생활에서 벗어나 자연과 교감하고, 건강한 먹거리를 자급자족할 수 있다는 점에서 인기를 끌고 있으며, 도시농업의 한 형태로 환경 보호와 공동체 활성화에도 기여하고 있습니다.'
