description_portal: 국내 산림 내 입목의 생장 상태와 수확 가능량을 과학적으로 분석한 입목재적 및 바이오매스 관련 통계자료입니다. 본 데이터는 입목수간재적표, 입목재적표, 생중량표, 임분수확표 등의 항목으로 구성되어 있으며, 수종별(잣나무, 낙엽송, 리기다소나무, 강원지방 소나무, 중부지방 소나무, 상수리나무, 신갈나무) 생장률과 재적 변화, 생물량 증가량 등을 체계적으로 제공하고 있습니다. 이를 통해 임목의 수확시기 예측, 산림자원 생산성 분석, 조림계획 수립, 탄소흡수량 계산, 바이오매스 기반 자원 활용 등 다양한 목적에 활용됩니다.
