description_portal: '- 친환경농산물 인증 통계를 나타내는 데이터로, 각 시군별 유기농/무농약 농산물 인증건수, 농가수,  인증면적과 출하량 등을 나타냅니다.- 전라남도는 청정 자연환경과 전통 농업이 어우러진 지역으로, 다양한 친환경 농산물이 생산되고 있습니다. 이러한 농산물들은 건강한 먹거리를 찾는 소비자들에게 큰 인기를 끌고 있습니다.- 전라남도의 친환경 농산물은 지역 특성에 따라 다양한 종류와 품질을 자랑합니다. 구매 시에는 인증 마크나 생산 이력 등을 확인하여 안전하고 신뢰할 수 있는 제품을 선택하는 것이 중요합니다.- 전라남도의 친환경 농산물은 건강한 식생활을 추구하는 소비자들에게 최적의 선택이 될 것입니다. 자연과 사람을 생각하는 전라남도의 농산물을 통해 건강한 삶을 누려보세요.'
