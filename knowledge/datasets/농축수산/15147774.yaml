description_portal: 이 데이터는 해양수산부에서 송전철탑위치에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 제작일자, 전자해도단계코드, 최소규모수, 수준구분코드, 공간정보 데이터로 구성되어 있습니다.본 데이터는 송전철탑위치 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.송전철탑란 발전소에서 생산된 전기를 변전소로 보내거나(송전) 변전소에서 전기소비처로 보내기 위해 고압의 전선(송전선)을 높은 곳에 걸어 지상으로부터의 영향을 줄이고 안전하게 수송하도록 지지하는 높은 철제 구조물을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
