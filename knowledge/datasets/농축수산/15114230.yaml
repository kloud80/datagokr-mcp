description_portal: 이 데이터는 해양수산부가 특정도서(지형과 지질, 자연환경이 우수한 도서지역)의 보호와 관리 등을 위해 수집한 파일 형태의 데이터입니다.  본 데이터의 주요 내용은 특정도서의 공간정보 일련번호, 특정도서의 국문 및 영문명, 보호구역 유형코드, 관리기관, 소유자, 지정년도 등 특정도서의 상세 속성 정보로 구성되어 있습니다.  본 데이터는 특정도서의 현황 파악, 보호구역 지정 및 관리 정책 수립, 연안 및 해양관리 연구, 도서생태 환경 모니터링, 관련 행정업무 및 보고자료 작성 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다.
