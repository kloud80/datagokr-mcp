description_portal: 본 데이터는 일본 후쿠시마 원전 인근 6개현에서 주입 후 국내 배출되는 선박평형수의 방사능 오염 여부를 이동형 방사능 측정장비를 활용하여 현장에서 신속하게 조사한 결과를 제공합니다.이 자료는 국내 해양환경 안전을 확보하고, 선박 운항 과정에서 발생할 수 있는 방사능 오염 위험을 체계적으로 관리하기 위한 정책적 대응을 보여주는 정보입니다.항만 운영자와 선박 운항사는 입항 절차와 안전 규정 준수에 필요한 참고자료로 활용할 수 있으며, 해양환경 분야 연구자들은 평형수 이동과 방사능 오염 가능성 간의 관계를 분석하는 기초자료로 사용할 수 있습니다.
