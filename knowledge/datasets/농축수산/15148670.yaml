description_portal: 이 데이터는 해양수산부에서 해양생태도결정등급에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 해역, 정점번호, 종합등급, 항목별 세부등급 가)목, 항목별 세부등급 나)목 1, 항목별 세부등급 나)목 2, 항목별 세부등급 나)목 3, 항목별 세부등급 나)목 4, 항목별 세부등급 나)목 5 등의 데이터로 구성되어 있습니다.본 데이터는 해양생태도결정등급 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양생태도결정등급이란 「해양생태계의 보전 및 관리에 관한 법률」에 따라 해양생태계를 생태적·경관적 가치에 따라 1등급, 2등급, 3등급 등으로 구분하여 작성한 지도를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
