description_portal: 본 자료는 전국 산란계농장을 대상으로 한 고병원성조류인플루엔자(HPAI) 방역기준에 따른 유형부여 현황을 시군별로 정리한 것입니다. 「가축전염병 예방법」 및 농림축산식품부 고시에 따라 산란계 농장은 자율방역 실천 정도와 농장 시설·관리 수준을 기준으로 방역 유형이 평가·등급화됩니다. 유형부여는 고위험군과 저위험군을 명확히 구분하여, 가축전염병 발생 시 살처분 우선순위와 보상금 지급 기준을 합리적으로 적용하기 위한 제도적 장치입니다. 특히, 자율방역을 충실히 이행한 농장은 고시 기준에 따라 살처분 보상금을 최대한 인정받을 수 있으며, 방역 미흡 농장은 감액 적용을 받게 됩니다. 본 자료의 등급 현황은 최근 3개년(2023~2025년) 동안 산란계 농장별 유형부여 결과를 시도·시군 단위로 집계한 것으로, 각 지역의 방역 수준을 비교·평가할 수 있는 기초 자료를 제공합니다. 이를 통해 중앙정부와 지방자치단체는 시군별 방역 취약점을 진단하고, 맞춤형 방역정책 및 재난대응 체계를 강화할 수 있습니다. 또한, 가축전염병 발생 시 살처분 조치와 연계되는 유형부여 결과는 농가의 방역 참여를 촉진하고, 자율방역 문화 정착을 유도하는 중요한 역할을 합니다. 본 자료는 산란계농장의 방역역량을 객관적으로 평가하는 기준이자, 향후 HPAI 등 가축전염병 대응정책 수립과 피해 최소화를 위한 핵심 기반자료로 활용될 것입니다.자세한 사항은 가축위생방역지원본부 방역사업부에서 확인하실 수 있습니다.044-550-5560
