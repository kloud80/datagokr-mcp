description_portal: 본 데이터는 친환경유기농업육성사업의 일환으로, 고품질의 안전한 농산물 생산을 장려하고 지속 가능한 농업환경을 조성하기 위해 시행되는 친환경농산물 인증 농지에 대한 지목별 지급단가 정보를 제공합니다. 특히 국비로 지원되던 친환경농업직불금이 종료된 이후에도 농가의 관행농업 회귀를 방지하고, 친환경농업을 지속적으로 유도하기 위한 생산비 보전 정책이 반영되어 있습니다. 품목별로 인증 단계에 따라 차등적인 지원이 이루어지며, 이는 친환경농산물 인증 수준의 상향을 유도하고 농업 경쟁력을 높이는 데 기여합니다. 데이터는 지목별로 구분된 단가 정보를 통해 행정기관의 정책 수립, 농가의 사업 계획 수립 등에 활용될 수 있습니다.
