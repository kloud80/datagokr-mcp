description_portal: '- 전라남도 내 어선어업 허가 및 신고 건수에 대한 현황 자료입니다. - 2015년부터 2023년까지 자료를 조회하실 수 있습니다.- 어선어업허가는 어선을 이용해 수산자원을 포획하거나 채취하고자 할 때 반드시 받아야 하는 국가의 허가 제도입니다. 어업의 종류, 어선의 크기, 조업 해역 등에 따라 허가 요건과 절차가 다르며, 이는 수산자원을 보호하고 어업 질서를 유지하기 위한 제도입니다.- 주요내용1. 법적 근거 : 「수산업법」 제8조 및 관련 시행령, 시행규칙2. 대상 : 어선을 사용하여 어업을 하려는 자 (자연인 또는 법인)3. 허가 주체 : 해양수산부, 시·도지사, 해양수산청 등 (어업 종류에 따라 다름)'
