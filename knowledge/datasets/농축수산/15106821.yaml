summary_user: 전남 영광군 관내 내수면양식장을 허가 건별로 담은 원천 목록으로, 허가번호·허가자·조업구역·어업방법·양식품종·시설면적·수면적·등록일자와 허가 시작·종료일을 담으며 범위는 영광군 한 개 시군구다(CSV 약 12KB). 영광군에서 어떤 담수어 품종이 어느 구역에서 얼마 면적으로 양식 허가를 받았고 허가가 언제 끝나는지 확인하려는 어업인·행정 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 허가번호나 조업구역 이름을 맞추는 방식, 또는 같은 기관의 다른 어업 허가·면허 자료와 묶는 방식으로만 이어 쓴다.
description_portal: 전라남도 영광군 관내의 내수면양식장 허가 및 운영 현황에 관한 데이터로, 양식업 관련 인허가 정보 및 조업 실태를 종합적으로 제공합니다. 항목은 허가번호, 허가자 성명, 조업구역 위치, 어업방법, 양식 품종, 양식시설 면적, 실제 수면적, 등록일자, 허가 시작일 및 종료일 등으로 구성되어 있습니다. 본 데이터는 지역 내 담수어 양식업 분포를 파악하고, 품종별 양식 특성, 수질관리 대상지, 수면 활용도, 양식업 허가지 역동성 분석 등에 유용하게 활용됩니다. 또한, 수산자원 보전, 친환경 양식기술 적용, 내수면 정책 수립, 양식어가 지원방안 마련, 수산물 유통 경로 설계 등 행정‧연구‧산업 분야에서 활용도가 높습니다.
