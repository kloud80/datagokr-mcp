summary_user: 제주 한라수목원의 무장애여행 정보를 지점별로 담은 원천 데이터로, 위도·경도·해발고도와 장소설명·이미지 정보를 제공한다. 휠체어 이용자나 유모차 동반 가족이 한라수목원의 주차장·화장실·산책로 같은 편의시설 위치를 미리 확인하거나, 관광 정책 담당자가 무장애 동선을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름 매핑이나 좌표(위도·경도) 기준의 공간 대조로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 한라수목원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다.* 한라수목원은 제주 제주시 연동 1100도로변 광이오름 기슭에 위치한 공공 수목원으로, 제주 자생식물과 아열대 식물을 포함해 약 1,100여 종의 식물이 전시 및 관리되고 있다. 본 무장애 여행 정보는 주차장, 산책로, 화장실, 출입구, 보행 동선 등 물리적 접근성 및 편의시설 현황을 종합하여 제공하며, 장애인 전용 주차구역, 휠체어 대여, 장애인 화장실, 점자블록, 유모차 대여, 기저귀 교환대 등 교통약자 및 가족 단위 방문객을 위한 편의가 갖춰져 있다. 완만한 산책로와 무장애 추천 동선 덕분에 누구나 자연 속 산책과 휴식을 누릴 수 있으며, 무장애 관광지 조성, 열린관광지 확대, 관광서비스 개선 및 정책 수립을 위한 유용한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
