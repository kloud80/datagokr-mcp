description_portal: 이 데이터는 해양수산부에서 연안침식 조사 현황정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 연안침식지역명, 연안침식시도명, 연안침식시군구명으로 구성되어 있습니다.본 데이터는 연안정비 사업의 우선순위 결정, 연안침식 피해 예방 대책 수립, 그리고 연안 관련 법령 및 정책 수립 시 참고자료로 활용될 수 있습니다. 또한, 연안 인근 개발계획 수립 시 연안침식에 대한 위험성을 미리 파악하는 데 기초자료로 활용되며, 연안환경 관리, 해양공간계획 및 도시계획 등 연안지역 관리정책의 근거자료로도 사용할 수 있습니다.
