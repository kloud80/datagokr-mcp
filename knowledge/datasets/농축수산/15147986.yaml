summary_user: 해양수산부가 정한 정선(관측 선)과 그 위 정점별로 표준 수심(m)을 짝지은 기초 코드표로, 정선코드·정점코드·수심 세 항목만 담은 전국 단위 비공간 CSV 파일(약 16KB)이다. 해양 관측자료를 다루는 분석가나 행정 담당자가 '이 정선·정점의 표준 수심은 몇 m인가'를 확인하거나 정점 코드를 해석할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 정선해양관측 자료와 정선·정점 코드를 맞춰 붙이는 방식으로만 연결한다.
