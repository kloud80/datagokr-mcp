description_portal: 데이터는 경기도 화성시 관내 스마트팜을 기반으로 포도를 재배하는 농가의 2019년 4월부터 6월까지 개화기 기간 동안 수집한 지습 정보를 정리한 것이다. 개화기는 착과율과 수확량에 영향을 미치는 중요한 생육 단계로, 해당 시기의 뿌리 주변 수분 상태를 파악하는 것이 작물 관리에 핵심적인 요소이다. 데이터는 농가별로 구성되어 있으며, 측정 일자, 시간대, 지점별 지중 습도 수치 등을 포함한다. 이를 통해 토양 수분 변화 분석, 재배 환경 최적화, 스마트 관수 의사결정 등 다양한 분석에 활용 가능하다. 본 자료는 정밀농업 실현을 위한 기초 정보로서, 기후 조건과 생육 반응 간의 관계 분석, 지역 농업 환경에 맞춘 맞춤형 관리 전략 수립에도 활용될 수 있다. 현장 중심의 스마트농업 기술 확산과 데이터 기반 농업 정책 지원에 기여할 수 있는 자료이다.
