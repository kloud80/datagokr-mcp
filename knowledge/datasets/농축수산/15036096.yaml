description_portal: 친환경 농업 확산과 화학비료 사용 절감에 대한 농업계 요구 증대, 가축분뇨의 자원화를 통한 순환농업 활성화 필요성이 높아지고, 지역 내 유기질비료 공급망 체계 구축 및 농업인의 비료 구매 정보 접근성 향상에 대한 요구가 증가함에 따라 충청남도 보령시는 관내 가축분비료 생산업체의 위치, 제품정보, 연락처 등 종합적인 현황 정보를 제공하고 있습니다.개방 데이터는 가축분비료 생산업체의 업체명, 비료명칭, 도로명주소, 지번주소, 위도, 경도, 전화번호, 데이터기준일자 등 총 8개 항목 5건의 상세 정보를 포함하고 있으며, CSV 파일 형태로 공공저작물 이용허락범위에 제한 없이 제공됩니다.농업인·농업법인은 인근 가축분비료 생산업체 정보 확인을 통해 친환경 비료 구매 및 토양 개량에 활용하고, 연구기관·학계는 지역별 유기질비료 생산 현황 분석 및 순환농업 정책 연구에 활용하며, 지방자치단체·농업기관은 친환경 농업 지원 정책 수립 및 가축분뇨 자원화 사업 계획 수립에 활용할 수 있습니다.
