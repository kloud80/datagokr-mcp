description_portal: 산림자원통합정보시스템을 기반으로, 산림자원 매각사업과 관련된 계약 체결 현황을 기록한 데이터입니다. 이 자료는 국유림 등에서 생산된 입목 또는 원목 등 산림자원을 대상으로 한 공개입찰, 수의계약 등의 방식으로 체결된 계약 정보를 제공하며, 계약일자, 계약금액, 매수인, 매각물량, 계약번호 등이 포함되어 있습니다. 이 데이터는 산림자원 매각의 투명성 확보, 계약 이행 관리, 수익 분석, 입찰 기록 추적 등에 활용되며, 공공기관 및 관련 업체에서 사업계획 수립, 가격 동향 분석, 유통 구조 개선 등을 위해 참조합니다.
