description_portal: '- 전라남도 어장도관리시스템에 게재된 환경보전 및 특별관리해역 정보(해역명, 고시일자, 고시번호, 전체면적 등)에 대해 조회하실 수 있습니다.- 전라남도에는 해양환경 보호를 위해 지정된 환경보전해역과 특별관리해역이 있습니다. 이들 해역은 수산자원 보호, 해양생태계 보전, 오염 저감 등을 위해 특별한 관리가 이루어지고 있습니다.- 환경보전해역은 자연환경이 양호하고 수산자원 보호가 필요한 해역으로, 해양오염에 직접 영향을 미치는 육지를 포함하여 지정됩니다.- 특별관리해역은 해양환경 기준 유지가 어려운 해역으로, 해양환경 보전에 현저한 장애가 있거나 장애를 미칠 우려가 있는 해역으로 지정됩니다.- 이러한 해역들은 전라남도의 해양환경 보전과 수산자원 보호를 위해 중요한 역할을 하고 있으며, 지속적인 관리와 모니터링이 필요합니다.'
