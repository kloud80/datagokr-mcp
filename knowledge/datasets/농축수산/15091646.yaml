summary_user: 농촌융복합산업(6차산업) 인증 경영체 제품을 홍보·판매하는 안테나샵을 매장 한 곳당 한 행으로 담은 전국 현황 목록으로, 지원센터·시도·시군구·매장명·주소·운영시간·판매상품·참여 경영체 수·품목 수가 들어 있다. 소비자가 우리 지역 안테나샵이 어디 있고 몇 시에 열며 무엇을 파는지 찾거나, 분석가가 시도별로 매장마다 참여 경영체와 품목이 얼마나 되는지 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명이나 주소로 이름을 맞추는 방식으로만 연결한다.
description_portal: 농촌융복합산업 인증 경영체의 생산제품을 홍보하고 판매하기 위한 마케팅 활동의 거점으로 기능하는 안테나샵 현황 정보는 농림수산식품교육문화정보원의 핵심 데이터 중 하나입니다. 안테나샵은 소비자와의 직접적인 소통을 통해 반응도를 측정하고, 구매 성향을 조사함으로써 효과적인 마케팅 전략을 수립하는 데 기여합니다. 이 정보는 지역 농산물과 다양한 가공식품의 홍보를 통해, 소비자에게는 독창적인 제품을 소개하고, 생산자에게는 판매 촉진의 기회를 제공합니다. 따라서, 이 데이터는 농촌 경제 활성화와 소비 트렌드 분석, 유통 경로 최적화를 위해 다양하게 활용될 수 있습니다. 농촌의 지속 가능한 발전을 위해 지역 자원을 활용한 6차 산업의 활성화에 중요한 역할을 하는 데이터입니다.
