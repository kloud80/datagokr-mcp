description_portal: 이 데이터는 월별 방문객의 요일별 이용 패턴과 성별·연령대별 방문 특성을 종합적으로 분석하기 위해 2022년에 수집·구축된 정보입니다.월별 요일_성_연령별 방문객 통계(TB_MNBY_WEK_SEX_AGE_VISITOR), 월별 유입지별 방문객 통계(TB_MNBY_INFLLACC_VISITOR), 월별 집계 방문객 통계(TB_MNBY_SM_VISITOR)를 포함합니다.이 데이터를 통해 요일별 방문객 집중 요일 파악, 월별 이동 패턴 및 계절성 분석, 성별 방문 특성 비교, 연령대별 유입 경향 분석, 유입지별 방문 분석, 지역·항만 단위의 방문 행태 모니터링이 가능하며, 관광객 분석, 항만 이용 행태 연구, 마케팅 전략 수립, 운영시간 조정, 지역경제·관광정책 의사결정 등 다양한 분야에서 활용될 수 있습니다.파일내 항목별 코드는 코드북을 참고해 주시기 바랍니다.
