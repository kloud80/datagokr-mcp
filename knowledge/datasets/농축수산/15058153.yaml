summary_user: 경기도 해양수산자원연구소가 산천어·송어·무지개송어 등 내수면 민물고기 우량 치어를 양식업체에 유상 분양한 실적을 분양 건별로 담으며, 어종명·분양일·지역명·분양량·단가·세입액(원)을 포함한다. 양식업 분석가나 정책 담당자가 "어느 어종 치어가 어느 지역에 얼마나, 얼마에 분양됐나"처럼 어종별 수요와 지역 분포를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·어종명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 해양수산자원연구소에서 추진한 우량 치어 생산 및 보급 사업의 현황을 담고 있으며, 주요 항목으로는 어종명, 분양일, 지역명, 분양량, 단가(원), 세입액(원) 등이 포함됩니다. 경기도는 산천어, 송어, 무지개송어 등 내수면 민물고기를 중심으로 양식업계의 생산성과 품질을 높이기 위해 치어를 선별 및 보급하였으며, 유상 분양을 통해 수산업 재정 안정화와 지역 양식업체의 경영지원을 도모하였습니다. 해당 데이터는 어종별 수요분석, 양식업체 지원정책 수립, 수산자원 보전 및 유통 흐름 분석 등에 활용될 수 있습니다. 현재는 관련 사업이 종료되어 추가 갱신은 중단된 상태입니다.
