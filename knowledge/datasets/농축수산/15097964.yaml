summary_user: 백두대간 종주코스를 이루는 경로 지점별로 숲길 식별자·숲길명, 위도·경도, 해발고도, 노면유형(1~3단계 코드·이름), 기준일시를 담은 좌표 단위 원천 데이터이며 범위는 전국입니다. 등산객이나 탐방로·GIS 분석가가 '이 종주 구간의 고도 변화와 노면 상태는 어떤가'를 보려고 코스 시각화, 거리·표고 분석에 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 확인되지 않아, 숲길명 같은 이름 매핑이나 위경도 좌표를 이용한 공간 결합으로 다른 등산로·산 정보와 잇는다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 백두대간의 종주코스 정보를 조회할 수 있는 서비스입니다.API를 통해 경로식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천노면유형명, 원천노면유형코드, 기준일시 등의 속성을 호출할 수 있으며,이를 활용하여 백두대간 종주 구간의 위치좌표, 고도, 노면유형 정보를 기반으로 한 코스 시각화, 거리·표고 분석, 탐방로 관리, GIS 공간분석 등 다양한 분야에서 활용이 가능한 정보를 JSON+XML 포맷으로 지원합니다.
