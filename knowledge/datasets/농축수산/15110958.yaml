summary_user: 전국 공사유림에서 지방자치단체가 실시한 숲가꾸기 사업을 사업 건·필지 단위로 담은 원천 파일로, 사업년도·기간·발주기관·수행업체와 시행 필지의 지번·지목·소유구분, 산림기능·임종·사업종, 재적이 들어 있습니다(CSV 약 212MB). 분석가나 지자체 담당자가 '어느 시군구에서 어떤 종류의 숲가꾸기가 어떤 산림기능 구역에 얼마나 시행됐나'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으나 필지 코드(시군구읍면동코드(PNU))와 산구분·본번·부번으로 지적·임상도 같은 필지 단위 자료와 맞춰 보고, 시도·시군구·읍면동 코드로 행정구역 통계와 묶어 쓴다.
limits: 전역 조인 키가 확인되지 않아 다른 데이터와는 지번·행정코드나 이름 매핑으로만 연결되며, 매칭 정확도는 직접 검증해야 한다. 파일이 200MB가 넘는 대용량 CSV라 한 번에 열기보다 나눠 읽는 것이 좋다.
