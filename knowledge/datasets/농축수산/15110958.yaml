description_portal: 전국 공사유림에서 지방자치단체가 실시한 산림경영활동 중 숲가꾸기 사업에 대한 정보를 2015년부터 2020년까지 연도별로 제공합니다. 사업번호, 사업년도, 사업기간, 사업명, 발주기관, 수행업체명, 숲가꾸기 장소, 사업종류, 산림기능구분 등 다양한 항목이 포함되어 있습니다. 이 데이터는 숲가꾸기 사업의 추진 현황, 지역별 사업 분포, 사업 종류별 성과 분석 등에 활용할 수 있으며, 산림자원 관리, 정책 수립, 연구 및 행정 지원에 유용합니다. 정기적으로 갱신되어 최신 숲가꾸기 동향 파악에 적합합니다.
