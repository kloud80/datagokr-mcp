description_portal: 이 데이터는 해양수산부에서 해상풍력평균풍속에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 해상풍력평균풍속경도, 해상풍력평균풍속위도, 해상풍력평균풍속평균풍력에너지생산량, 해상풍력평균풍속평균제곱근편차, 해상풍력평균풍속최소풍력에너지생산량 데이터로 구성되어 있습니다.본 데이터는 해상풍력평균풍속 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해상풍력평균풍속이란 해상풍력발전 단지가 위치한 해역의 평균적인 바람의 세기를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
