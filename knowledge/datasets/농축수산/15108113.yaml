summary_user: 충청남도 서천군의 주요 갯벌을 한 곳씩 담은 목록으로, 갯벌 소개, 대상 마을, 체험거리, 주차 가능 여부, 홈페이지, 도로명·지번 주소, 위도·경도, 담당 부서와 연락처를 담는다. 갯벌체험을 계획하는 방문객이나 관광 안내 서비스 운영자가 '서천에서 주차가 되고 체험할 수 있는 갯벌 마을은 어디이며 문의처는 어디인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표(lat, lot)나 마을 이름으로 맞춰 이어 쓰며, 좌표를 쓰면 지도나 주변 관광·해양공간 데이터와 위치 기준으로 겹쳐 볼 수 있다.
limits: 서천군 한 시군구의 갯벌만 다루므로 다른 지역 갯벌과 비교하는 데는 쓰지 못한다. 표준 코드 형태의 조인 키가 없어 다른 데이터와 연결하려면 이름이나 주소를 직접 맞춰야 한다.
