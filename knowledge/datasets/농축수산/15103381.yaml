description_portal: 대구광역시 북구의 동별 반려동물 등록현황(법정동별 반려동물 등록현황, RFID 종류, 등록 품종수, 동물소유자수 등) 정보를 제공합니다.동물등록대상은  생후 2개월 이상인 모든 반려견 (지자체에 따라 일부 고양이도 의무화 시범 운영 중) 등록 기한은 입양·구매 후 30일 이내 등록(자진신고 기간 없이도 적용)등록방법은  동물병원을 방문하여  내장형(마이크로칩) 또는 외장형 식별장치(인식표/목걸이형) 선택하고신청서 작성 및 등록비를 납무하고 등록증 및 인식표를 발급받음. 미등록시 과태료는 1차 위반 20만원, 2차 위반 40만원, 3차 이상은 최대 100만원입니다.소유권 이전, 이사, 사망 시 등 30일 이내 변경 신고 필수 (온라인 또는 구청·시청에서 가능)입니다.사망 신고 누락 시 최대 50만 원 과태료가 부과됩니다.
