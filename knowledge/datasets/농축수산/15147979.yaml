description_portal: 이 데이터는 해양수산부에서 플랑크톤관측자료에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 정선 관측점, 관측년월(회차), 관측 날짜, 관측 시간, 플래그, Copepoda(요각류)(ind. / ㎥ ), Chaetognatha(모악류)(ind. / ㎥ ), Amphipoda(단각류)(ind. / ㎥ ), Euphausiacea(난바다곤쟁이류)(ind. / ㎥ ), Cladocera(지각류)(ind. / ㎥ ), Chordata(척색류)(ind. / ㎥ ), Dinoflagelate(야광충)(ind. / ㎥ ), Cnidaria(해파리류)(ind. / ㎥ ) 등의 데이터로 구성되어 있습니다.본 데이터는 플랑크톤관측자료 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.플랑크톤이란 수생 생물(水生生物)의 생활형에 의한 분류의 하나. 수중이나 수면에 부유하여 물의 흐름대로 생활하고 있는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
