description_portal: '광주광역시 농업기술센터 농업인상담소 운영 안내(운영 현황)  광주광역시 농업기술센터에서 운영하는 농업인상담소는 지역 농업인에게 전문 상담 및 실질적 지도를 제공하며, 주요 내용은 다음과 같음.1. 상담 분야   - 영농기술   - 병해충 관리   - 작물 재배 방법   - 토양 관리   - 농자재 활용   - 영농 현장 문제 해결   - 생산성 향상   - 농업 경영 및 생활 개선   - 농업 정책 안내 및 관련 제도 안내2. 상담 방법   - 현장 방문 상담   - 전화 상담   - 온라인 상담(이메일, 웹 문의 등)   - 필요 시 농업 현장 맞춤 컨설팅   - 상담 효과 및 프로그램 운영   - 안정적인 영농 활동 수행   - 소득 증대 및 생활 향상   - 현장에서 즉시 적용 가능한 실질적 지원   - 맞춤형 교육 프로그램 제공   - 자료 제공 및 활용 안내   - 농업 정책 안내   - 영농 컨설팅 지원   - 계절별·작물별 특성에 맞춘 지도   - 현장 문제 즉각 대응   - 농업인 대상 워크숍, 세미나, 현장 실습 등 다양한 교육 기회 제공3. 운영 상담소   - 북구(지산·석곡) 농업인 상담소(062-571-1964, 062-266-7713)    - 동곡·본량 (062-943-3161, 062-943-9604)   - 광산서부: 삼도(062-943-7621)   - 서구: 서창·유덕(062-373-4004)   - 남구(062-374-4564) 4. 기타 안내   - 모든 지역 농업인이 편리하게 이용 가능   - 상담소 프로그램과 서비스는 지속적으로 개선·확장   - 농업인 전문 지원 및 현장 실습 기회 제공   - 자료 다운로드, 교육 신청 등은 광주광역시 농업기술센터 홈페이지 이용 가능      (https://www.gwangju.go.kr/agri/)   - 데이터기준일자(2024-10-30)'
