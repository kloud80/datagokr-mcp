description_portal: '○ 통계개요* 통계명 : 농축산물 판매처별 농가* 통계종류 : 지정통계(승인번호 10145)* 근거법령 :통계법 제17조 및 제1항에 의한 지정통계(승인번호 제10145호)* 작성목적 : 농림어가와 인구, 경영규모 및 형태 등의 변화추이를 파악하여 국가,지방자치단체 및 연구기관 등의 각종 정책수립, 연구분석 및 평가를위한 기초자료 제공* 조사체계 : 조사원→지방통계청(사무소)→통계청* 공표주기 : 매년* 공표범위 : 지역- 서울시내용 - 서울시 농축산물 판매처별 농가수 등○ 용어설명* 농가 : 조사기준일 현재 논이나 밭을 1,000㎡(10a) 이상 직접 경작하는 가구* 농림어가인구 : 주민등록이나 가족관계등록부와 관계없이 매년 12월 1일 현재,가구에서 취사, 취침 등 생계를 같이하는 사람을 말하며 가족,친인척, 기타 동거인을 모두 포함'
