summary_user: 수협 산지조합이 보유한 창고를 창고 한 곳당 한 건으로 담으며, 조합명·창고명과 연락처, 주소, 면적(bldar)을 전국 범위로 제공한다. 수산물 물류·유통 사업자가 특정 지역에 어느 조합의 창고가 있고 규모가 어떤지 확인해 운송경로나 보관지를 정하는 데 쓴다. 전역 조인 키는 없으므로 조합코드·조합명으로 같은 수협 계열 데이터(위판장 경락 등)와 이어 쓰고, 다른 데이터와는 주소를 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 해양수산부에서 수협 산지조합이 보유한 창고의 상세 정보를 제공하기 위해 수집한 데이터입니다.  전체 데이터 조회 또는 특정 조합명, 창고명 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 조합코드, 조합명, 창고코드, 창고명, 창고의 연락처, 주소, 면적 등 정보로 구성되어 있습니다.  본 데이터는 수산물 물류/유통 관련 기업에서 최적 운송경로 분석 등 업무를 위해 활용할 수 있습니다. 또한, 산지 창고별 수산물 재고 관리 현황 파악, 수협의 물류 관리업무 지원, 수산물 저장 및 보관 정책 수립 등에 활용될 수 있습니다.
