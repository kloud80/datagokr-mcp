summary_user: 한국마사회 마필에 장착된 마이크로칩 정보를 말 한 마리 단위로 담으며, 마번·마이크로칩번호·국문/영문 마명·출생일자와 출생연도·성별·품종·생산국가를 제공하는 전국 범위의 건별 데이터이다. 마주·생산자·경마 분석가가 특정 마이크로칩번호나 마번이 어느 말(이름·출생연도·품종·생산국)에 해당하는지 확인하거나 출생연도별 마필 목록을 뽑는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 한국마사회 마필 데이터와는 마번(hrno)이나 마명 같은 같은 기관 코드·이름 매핑으로만 이어 쓴다.
description_portal: 한국마사회의 마필에 장착하는 마이크로칩에 대한 정보를 제공합니다. (제공정보는 마번(hrno), 마이크로칩번호(microNo), 마명(korHrnm), 영문마명(engHrnm), 출생일자(foalgDt), 출생연도(foalgYy), 성별구분(gndrGbCd), 품종코드명(spcsCd), 생산국가코드명(pctyCd) 자료입니다.)- 요청메세지에 출생연도(foalg_yy), 마번(hrno), 마이크로칩번호(micro_no), 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다.- 입력변수 미입력시 가장 최근 마필 출생연도의 목록들을 표출합니다.
team:
  dept: 통합유지관리
services:
  - op: /HorseMicroChip
    name: 마이크로칩기본연계 정보 조회 서비스
    endpoint: https://apis.data.go.kr/B551015/API290/HorseMicroChip
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: foalg_yy
        required: false
        example: '2020'
        desc: 출생연도(YYYY형식)
      - name: hrno
        required: false
        example: '0045167'
        desc: 마번
      - name: micro_no
        required: false
        example: '410099800017067'
        desc: 마이크로칩번호
      - name: _type
        required: false
        example: xml
        desc: 데이터형식변경
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 3000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
