description_portal: '해양수산 분야 연구개발(R&D) 과제의 공고 및 접수 현황을 종합적으로 제공하는 데이터셋입니다. 공고명, 과제명, 공고 시작일과 종료일, 공고 상태 등 기본 정보를 비롯해, 기관 유형별로 출연연, 대학, 중소 및 중견기업, 대기업, 기타 기관의 접수 및 선정 현황을 세부적으로 포함하고 있습니다. 또한 사업연도, 사업명, 공고번호, 접수 시작일과 종료일 등 다양한 항목이 수록되어 있어 해양수산 R&D 과제의 공고 및 선정 동향을 한눈에 파악할 수 있습니다. 연구기관, 대학, 기업 등 다양한 주체가 해양수산 R&D 사업 참여 현황을 분석하거나, 정책 수립 및 연구과제 기획, 산업 동향 파악 등에 활용하기에 적합합니다. 참고: 2023년 이후 범부처통합연구지원시스템(IRIS)으로 해당 시스템이 이관되어 데이터 생산 중단'
