description_portal: 본 데이터는 성주군 관내 산사태 취약지역을 지정 기준에 따라 분류하고, 위치와 특성을 체계적으로 정리한 현황 자료이다. 산사태는 지형의 경사, 토양 구조, 강우량 등 다양한 요인에 의해 발생하므로, 위험 가능성이 높은 지역을 사전에 식별하여 관리하는 것이 매우 중요하다. 본 자료는 관련 법령과 기술 기준에 따라 조사된 취약지역의 공간적 범위, 취약지역 지정사유 등을 포함하여 이용자가 지역 내 재해 위험 분포를 명확히 이해하도록 구성하였다. 또한 성주군의 재해예방 사업 추진, 위험지역 사전 정비, 주민 안전관리 계획 수립 등 다양한 행정업무에 활용될 수 있도록 자료의 정확성과 설명의 일관성을 강화하였다. 이를 통해 이용자는 산사태 발생 가능성이 높은 지점을 신속히 파악할 수 있으며, 향후 재난 대응 체계 구축 및 산지 관리 정책 마련에 필요한 기초 정보를 확보할 수 있다.
