summary_user: 2015년 제정·개정된 농축수산물 표준코드를 부류·품목·품종 단위로 담고, 각 표준 품목·품종코드에 대응하는 조사가격 품목·품종코드를 짝지어 놓은 전국 단위 코드 매핑표다. 연구기관이나 유통·식자재 기업의 분석가가 "표준코드로 적힌 품목이 가격조사 자료에서는 어떤 코드·이름으로 잡히는가"를 확인해 서로 다른 가격 자료를 맞출 때 쓴다. 전역 조인 키는 없고, 표준 품목코드(STD_PRDLST_CODE)와 조사 품목코드를 매개로 같은 기관의 가격 자료나 이름 매핑을 통해 다른 데이터와 잇는다.
description_portal: 본 데이터는 2015년에 제정 및 개정된 농축수산물의 표준코드에 대한 정보를 제공합니다. 이 표준코드는 부류, 품목 및 품종 등으로 나뉘어 있으며, 각 품목코드와 동일한 의미를 가지는 조사가격 표준 품목코드를 포함하고 있습니다. 따라서 이 데이터는 농림수산 분야의 품목 매핑 정보와 관련하여 매우 중요한 자료로 활용될 수 있습니다. 특히, 연구기관이나 농업 관련 기업들이 농산물의 품목코드와 그에 대한 조사가격 정보를 활용해 시장 분석 및 연구 자료를 개발하는 데 기여할 수 있습니다. 제공되는 오퍼레이션 정보에 따르면, "표준품목매핑목록조회" API를 통해 표준 품목코드, 표준품목명, 조사품목명 등 다양한 품목 매핑 정보를 열람할 수 있습니다. 이러한 정보는 농축수산물 시장 동향을 파악하고, 관련 정책 수립에 기반이 되는 중요한 자료로 제공됩니다.
