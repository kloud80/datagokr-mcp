description_portal: 해파리 모니터링 결과에 대한 SMS 알림 발송 이력을 관리하기 위해 발송주차, 발송결과, 발송일자, 등록일자 정보를 등록·관리하는 데이터이다. 본 데이터는 2024년부터 2025년까지 수행된 해파리 모니터링 정보의 SMS 발송 내역을 대상으로 구축되었으며, 주차별 정보 제공 현황과 발송 이력을 체계적으로 관리하기 위해 활용된다. 발송주차는 해파리 모니터링 정보가 발송된 기준 주차를 기록하는 항목으로 주간 단위의 정보 제공 현황을 파악하고 발송 시기를 구분하는 데 활용된다. 발송결과는 SMS 발송 처리 후의 상태 정보를 저장하는 항목으로 발송성공, 발송실패 등의 결과를 관리하며, 발송일자는 SMS가 실제로 발송된 일시를 기록하여 알림 전송 이력을 추적하고 발송 시점을 확인할 수 있도록 한다. 또한 등록일자는 해당 발송 정보가 시스템에 최초 등록된 일시를 저장하여 데이터 생성 및 관리 이력을 확인하는 데 활용된다. 이를 통해 2024~2025년 해파리 모니터링 정보의 주차별 발송 현황과 발송 결과를 효율적으로 관리할 수 있으며, 발송 이력 조회, 오류 발생 시 원인 분석, 발송 현황 점검 및 통계자료 생성 등의 업무를 지원한다.
