description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 붉은오름자연휴양림은 제주 서귀포시 표선면 남조로 1487-73에 위치한 약 190ha 규모의 자연 휴양림으로, 울창한 삼나무림과 해송림, 천연림이 어우러진 숲속에서 사계절의 숲 체험이 가능하고, 무장애 나눔길 1 km, 장애인 전용 주차장, 단차 없는 출입구, 점자블록, 장애인 화장실 등 누구나 이용 가능한 유니버설 디자인이 적용되어 장애인, 고령자, 유아 동반 가족 등도 안전하게 산책과 휴양을 즐길 수 있는 열린관광지이며 숙박 가능한 숲속의 집, 산림휴양관, 야영장, 잔디광장, 생태연못, 산책로 등 다양한 편의 및 휴식 시설이 갖춰져 있어 공공 관광 안내, 무장애 관광 코스 설계, 관광 콘텐츠 개발 및 정책 기초 자료로 활용되기에 적합하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
