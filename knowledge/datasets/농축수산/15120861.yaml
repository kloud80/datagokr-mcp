summary_user: 산림청 산림사업용역관리시스템의 계약 건별 기록으로, 계약마다 위탁사업, 수행단계, 사업종, 사유림 구분, 사업명, 면적(제곱미터), 계약금액(원), 계약방법, 진행상태를 담은 전국 단위 비공간 CSV 파일(약 1.9MB)이다. 산림사업 용역을 분석하는 사람이 "사업종이나 계약방법별로 계약금액과 면적이 어떻게 분포하고, 진행 중인 계약은 어느 단계에 있는가"를 확인할 때 쓴다. 실측 조인 키는 계약아이디(forest_service_contract_id) 하나이며, 같은 시스템의 다른 용역 데이터와 이 키로 잇는다.
description_portal: 산림사업용역관리시스템 계약관리 관련 데이터로 계약ID, 위탁사업ID, 수행단계, 계약번호, 사업종코드, 사업명, 면적, 계약금액, 계약방법, 진행상태, 세부사업구분 등 다양한 항목을 포함하여 제공된다. 이를 통해 각 산림사업 용역의 계약 체결부터 이행까지의 전체 과정을 체계적으로 파악할 수 있으며, 사업별 계약 관리, 예산 집행의 적절성 검토, 계약 이행 상태 점검, 사업 성과 분석 등에 효과적으로 활용된다. 또한 계약방법과 사업 특성에 따른 비교 분석이나 정책 개선 자료로도 활용 가능하며, 정기적으로 갱신되어 최신 계약 현황을 반영하므로, 산림사업의 계약 투명성 확보 및 예산 운영의 효율성 제고에 기여하는 핵심 데이터이다.
