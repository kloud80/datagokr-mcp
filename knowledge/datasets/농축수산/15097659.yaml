description_portal: 데이터는 경기도 화성시에서 스마트팜을 기반으로 포도를 재배하는 농가를 대상으로 2019년 7월부터 9월까지 수확기 기간 동안 수집된 온도 정보를 정리한 것이다. 수확기는 과실의 품질 및 저장성에 큰 영향을 미치는 시기로, 본 자료는 해당 시기의 재배 환경 조건을 분석하는 데 활용될 수 있다. 데이터는 농가별로 구분되며, 측정 일자, 시간, 위치별 온도 값 등을 포함하고 있다. 이를 통해 생육 단계별 온도 변화 특성, 기상 환경과의 상관관계, 작황 영향 요인 분석 등에 기초자료로 제공된다. 또한 화성시의 기후 특성을 반영한 스마트농업 기술 개발, 작물 생산성 향상 방안 마련, 맞춤형 재배 전략 수립에도 유용한 정보이다. 현장 중심의 농업 데이터로서 정밀농업 확대와 과학적 영농 기반 조성에 기여할 수 있다.
