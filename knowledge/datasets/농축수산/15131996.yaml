description_portal: '- 한국농어촌공사 용수시설통합운영관리시스템(TOMS) 양,배수장 펌프 정보 입니다.- 양수장이란 강이나 하천 및 호소의 물을 이용하기 위해 양수하여 관개하는 시설을 말하며- 배수장이란 배수가 불량하거나 홍수 시 물이 하천이나 강 및 호소로 빠지지 못하여 농경지 등이 침수되는 경우 기계장치를 이용하여 담수되어 있는 물을 배수하는 시설을 말합니다.- 본 데이터는 펌프에 대한 제원 정보로 시설명, 시설종류, 펌프종류, 양배수, 구경, 유량, 전양정, 실양정, 회전수 데이터를 제공하고 있습니다.- 시설규모에 따라 펌프수량 및 제원이 상이하며, 이에 따라 홍수 재난 대비 펌프가동 횟수나 시기가 달라질 수 있습니다.- 수해 대비 재난 안전 등 기초 자료 산정 시 도움이 되는 자료로 이용될 수 있습니다.'
