summary_user: 한국농어촌공사가 관리하는 전국 집수암거(농경지 지하수를 모아 배수하는 지하수로 시설)의 시설별 제원을 한 행에 한 시설씩 담은 파일로, 시설명·소재지·착공·준공년도와 유역·수혜면적, 관경·매설심도·매설길이, 자연·안정수위 등을 담는다. 농업기반시설 연구자나 지자체 담당자가 "우리 지역 집수암거는 언제 지어졌고 어느 면적에 물을 대는가"처럼 배수 체계 현황과 노후도를 파악하는 데 쓴다. 표준시설코드(dam_cd)가 조인 키여서 같은 코드를 쓰는 한국농어촌공사의 다른 농업기반시설 제원 데이터와 이어 쓰고, 소재지 주소로 행정구역 단위 자료와 묶는다.
description_portal: '이 데이터는 농경지 배수 개선을 위해 설치된 **집수암거(集水暗渠)**의 현황 정보이며 한국농어촌공사가 관리중인 시설에 대한 정보를 제공합니다. 집수암거는 지하에 암거(暗渠, 지하수로)를 설치하여 농경지 내 불필요한 지하수를 모아 배수하는 시설로, 토양의 배수성을 개선하고 농작물 생육환경을 안정화하기 위해 구축됩니다.집수암거에 대한 기본정보(표준시설코드,시설명,소재지,착공년도,준공년도,종별,구분,유역면적,홍수면적,만수면적,수혜면적 등)을 제공합니다.해당데이터는 아래와 같은 용도로 활용할 수 있습니다.- 농경지 배수 체계 분석 및 개선 계획 수립- 수해(침수) 예방 및 농업재해 대응 연구- 농업용수 이용 효율성 향상 및 농업환경 관리- 토양 수분 관리 및 작물 생산성 향상 연구--------------------<단위>면적: ha한발빈도: 년관경: mm심도: m길이: m수위: EL.m'
