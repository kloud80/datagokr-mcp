description_portal: 이 데이터는 해양수산부에서 수협중앙회 위판 집계를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 수협중앙회 조합 코드, 위판 일자, 위탁인 거래처 코드, 물류센터 어종코드, 수협중앙회 조합 명, 수협중앙회 사업장 명, 물류센터 어종 명, 위판 수량, 위판 중량, 단위별 위판 중량, 최초 생성 시점, 최종 변경 시점 등으로 구성되어 있습니다.  본 데이터는 수협중앙회의 위판 현황을 분석하거나 조합별, 어종별, 물류센터별 거래 동향 파악 및 수산물 유통 과정의 투명성 제고와 경영 상태 점검, 유통 물량 집계에 활용될 수 있습니다.
