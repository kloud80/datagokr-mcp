description_portal: 이 데이터는 2020년 11월 기준, 전북특별자치도 내 쌀 가공식품 업체의 현황을 상세하게 보여주는 목록입니다. 각 업체의 상호, 주소, 연락처, 주생산품(주류, 떡류, 누룽지 등)과 같은 기본 정보와 함께, 사업체의 규모를 보여주는 월별 쌀 사용 능력, 그리고 2019년 회계연도 기준 실제 쌀 사용량을 상세히 담고 있습니다. 특히, 실제 사용량을 국내산과 외국산으로 구분하여 원료 조달 현황까지 파악할 수 있도록 구성된 점이 특징입니다. 이 자료는 지역의 쌀 가공 산업 생태계를 분석하고, 식품 제조업체의 원료 수급 동향을 연구하는 데 매우 중요한 산업 데이터입니다.
