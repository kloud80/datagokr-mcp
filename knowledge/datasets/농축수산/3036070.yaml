description_portal: '- 전라남도 내 우수 농축특산물 도지사품질인증업체 현황(품질인증내역, 대상품목, 사용기간)에 관한 데이터를 조회하실 수 있습니다.- 전라남도는 도내 우수 농수축산물 및 가공제품에 대한 "도지사 품질인증제"를 운영하고 있습니다. 이 제도는 청정지역 전남에서 생산된 농수특산물 및 가공식품에 대해 엄격한 심사를 거쳐 도지사가 품질을 인증하는 제도로, 소비자 신뢰를 확보하고 제품 경쟁력을 높이는 데 기여하고 있습니다 .- 인증을 받은 농수특산물은 전라남도의 온라인 쇼핑몰인 "남도장터"를 통해 구매하실 수 있습니다. 또한, 대형마트나 홈쇼핑 등에서도 인증 제품을 만나보실 수 있습니다.- 전라남도의 도지사 품질인증 농산물은 안전하고 우수한 품질을 자랑합니다. 소비자 여러분의 많은 관심과 이용 부탁드립니다.'
