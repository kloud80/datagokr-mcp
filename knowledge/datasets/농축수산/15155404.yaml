description_portal: 본 데이터는 한국토지주택공사의 토지 보상 업무에 있어서 보상금액에 포함되는 각종 작물별 소득인정비율 및 인정금액을 제공하고 있습니다. 소득금액은 주산물 가격에 소득비율을 곱한 값으로 계산되는데 주산물 가격은 주산물 단가와 주산물 생산량의 곱으로 결정합니다. 즉 소득금액은 "주산물단가 X 주산물생산량 X 소득비율" 입니다. 데이터의 소득금액은 발간년도에 따라 다르므로 하나의 값으로 고정되어 있지 않으며 향후에도 변동의 가능성이 있으니 이 점 유의하시기 바랍니다. 또한 일부 작물의 경우 작물코드가 생성되지 않아 공란으로 표시되는 작물이 있다는 점 양해 바랍니다.
