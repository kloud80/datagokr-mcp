description_portal: '경산시 저수지 전산관리시스템 및 운영현황경산시는 농업 생산 기반시설의 효율적 관리를 위해 저수지 전산관리시스템을 운영하고 있습니다. 해당 시스템은 관내 농업용 저수지의 기본현황을 종합적으로 관리하고 있으며, 주요 관리 항목은 다음과 같습니다.기본 정보: 저수지명, 주소지기술 제원: 유역면적, 수혜면적, 계획저수량, 제방형식, 제당높이, 제당길이운영상 정보: 설치년도, 종별(1종/2종), 관리기관명, 데이터 기준일자 등2025년 현재, 경산시는 총 268개소의 농업용 저수지를 관리 중에 있습니다. 이는 전년도 대비 2개소가 용도폐지된 수치입니다.시설물 분류1종 시설물: 2개소계획저수량이 20만 톤 이상2종 시설물: 266개소계획저수량이 20만 톤 미만점검 및 유지관리정기점검:분기별로 각 저수지 담당 읍·면·동 직원과 함께 현장 점검을 실시하고 있습니다.정밀안전진단:계획저수량 5만 톤 이상인 저수지에 대해서는 매년 정밀안전진단을 시행하여 구조적 안정성과 기능 유지 상태를 점검하고 있습니다.경산시는 앞으로도 저수지의 안전성과 기능성을 유지하기 위해 체계적인 전산관리는 물론, 정기적인 점검과 진단을 지속적으로 추진할 계획입니다.'
