summary_user: 경기도 사이버식물병원 시스템의 병해충 진단 정보 중, 작물(작목번호)마다 발생할 수 있는 병해 증상분류번호를 짝지어 담은 건별 매핑 테이블이다. 농업 진단·모니터링 시스템을 만드는 분석가가 '이 작물에는 어떤 증상 유형이 걸릴 수 있나'를 정의하거나 작물별 병해 양상을 정리할 때 쓴다. 증상분류번호(symptms_class_no)로 같은 시스템의 '증상_분류' 테이블과 이어 병해 명칭을 확인하고 '진단_의뢰_증상' 테이블과 엮어 쓰지만, 전역 조인 키는 없어 같은 기관 코드로만 연결된다.
description_portal: 본 데이터는 사이버식물병원 시스템에서 수집된 병해충 진단 정보를 기반으로 하며, 특정 작물에서 발생 가능한 병해 증상을 증상 분류 체계와 연계하여 구성된 '작목_증상' 테이블입니다. 각 행은 고유 식별자인 작목번호와 증상분류번호로 이루어져 있으며, 이를 통해 개별 작물에 발생 가능한 병해 유형과 그에 대한 분류체계를 정의합니다. 이 데이터는 ‘증상_분류’ 테이블과 연계하여 병해의 명칭과 상세 분류 정보를 확인할 수 있으며, ‘진단_의뢰_증상’ 테이블과의 분석적 연계를 통해 병해 발생 이력 분석도 가능합니다. 작물별 병해 양상, 주요 증상 분포, 병해 유형별 대응 전략 수립 등 농업 진단·예방·모니터링 시스템 구축에 유용한 기반 정보로 활용될 수 있습니다. 특히 병해 발생의 시계열적 추이 분석, 병해 다발 작물 탐지, 지역별 병해 경향 파악 등에도 확장 활용이 가능합니다.
