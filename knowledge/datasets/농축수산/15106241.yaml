description_portal: 충청북도 제천시의 GAP(우수약초) 인증을 받은 약초의 생산량 자료입니다.생산년도, 약초명, 재배농가수, 재배면적(ha), 생산량(미터톤), 판매처, 기준일자로 구성되어 있습니다.이 데이터는 충청남도 제천시의 연도별, 품목별(구절초, 길경, 당귀, 더덕, 독활, 두충, 마, 만삼, 사삼, 산수유, 엉겅퀴, 오가피, 오미자, 옻나무, 우슬, 작약, 접시꽃, 지조, 지황, 하수오, 홍화, 황기 등)의 농가수, 생산면적(ha), 생산량(ton) 을 제공합니다. 본 데이터는 약초 산업의 규모와 분포를 파악할 수 있습니다. 한약재 수급 안정화, 약용작물 산업 정책 수립, 농가 경영계획, 학술연구 및 식품·제약 산업 활용 등에 중요한 기초자료로 활용됩니다. 또한 지역별 재배 특성과 생산 동향을 비교·분석함으로써 약초 자원의 효율적 관리와 산업화 전략 마련에 기여할 수 있습니다.
