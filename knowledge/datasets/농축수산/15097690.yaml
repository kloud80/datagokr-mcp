description_portal: 포도 스마트팜에서 수집된 본 데이터는 시설 내 환경센서를 통해 기록된 일별 일사량 정보를 포함한다. 주요 항목은 측정일자, 설치장소명, 일사량으로 구성되어 있으며, 각 재배지의 실제 일사 환경을 수치화한 자료이다. 본 데이터는 포도 재배 시 광조건 분석, 생육환경 평가, 작황 예측 등 다양한 농업 분야에서 기초자료로 활용될 수 있다. 특히, 지역 특성에 따른 일사량 분포를 파악하고 농업 환경의 정밀한 관리를 위한 근거자료로 쓰이기에 적합하다. 데이터는 이해를 돕기 위해 장소별로 구분되어 있으며, 정제된 형식으로 제공되어 활용성이 높다. 농업인, 연구기관, 정책담당자 등이 스마트 농업 기반 구축 및 과학적 재배 전략 수립에 참고할 수 있는 유용한 자료이다. 본 자료는 일회성으로 수집된 것으로, 해당 시기의 환경 조건을 반영하고 있다.
