description_portal: 이 데이터는 제주특별자치도에서 관리하는 돼지 대상 전염병인 ‘돼지오제스키병’에 대한 검사 실적을 정리한 공공데이터로, 검사 농가, 검사 시점, 검사 건수 및 항체 또는 항원 검사 결과 등이 포함되어 있습니다. 돼지오제스키병은 허피스바이러스가 원인인 제2종 가축전염병으로, 감염 시 어미돼지의 유산이나 자돈의 폐사, 성장이 지연되는 등 축산 농가에 큰 피해를 주기 때문에 정기 검사와 감염축 도태가 중요합니다. 이 데이터는 제주 지역 내 검사 이력과 결과 분포를 확인할 수 있어, 방역 현황 점검, 질병 발생 위험 평가, 축산 농가 위생 관리, 축산 정책 수립 및 대응 체계 설계 등에 활용할 수 있는 기초 통계 자료입니다. 제공 형식은 CSV이며, 로그인 없이 누구나 무료로 다운로드하여 분석 가능합니다.
