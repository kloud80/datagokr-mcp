summary_user: 국립해양조사원이 국제수로기구 S-57 표준으로 만든 2레벨(일반도) 전자해도를 SHP 공간정보 파일로 담은 데이터로, 포털 설명상 해도별 해도번호·축척·버전·발행일·조사기관 정보를 포함하며 실제 받은 파일은 약 28KB 크기의 zip 한 건이다. 항만·연안 개발계획을 세우는 분석가나 통항로·해상운송 설계 담당자가 '이 해역을 덮는 일반도 축척 전자해도는 어떤 것이고 언제 발행됐나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 해양공간 데이터(해양용도구역·보호구역 등)와는 해도번호나 이름 매칭, 같은 기관 코드로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 2레벨 전자해도 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 국제수로기구(IHO)의 S-57 표준규격에 따라 제작된 전자해도의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해도의 해도번호, 축척, 해도 버전, 발행일 및 조사기관 등 정보를 포함하고 있습니다.  본 데이터는 항만 및 연안 개발계획 수립 시 해역 특성 분석, 관할구역 내 해상운송 및 통항로 설계, 선박의 안전항해 지원, 구난시스템(SAR) 연계 등 정책 또는 시스템 구축에 참고자료로 활용될 수 있습니다.
