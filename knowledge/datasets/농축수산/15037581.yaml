summary_user: 국립수목원 어린이 생물교실 생물도감을 생물 종 단위로 담은 API로, 목록 검색과 상세 조회 두 오퍼레이션에서 생물분류·국명·과명·속명·학명·설명문과 서식지(숲·들·강) 여부, 멸종위기종·보호종 구분을 제공한다. 어린이 교육 콘텐츠나 학습 앱을 만드는 개발자·교사가 '숲에 사는 멸종위기 곤충에는 어떤 것이 있고 어떤 설명을 붙이면 되나' 같은 질문에 쓴다. 전역 조인 키는 없고, 다른 생물·식물 정보와는 학명(biogyNm)이나 국명으로 이름 매칭해 이어 쓰며 도감번호(childLvbngPilbkNo)는 목록과 상세 조회를 잇는 내부 키로만 쓴다.
description_portal: 국립수목원 어린이 생물교실에서 제공하는 생물도감의 항목별 정보 및 상세 정보를 제공하는 서비스로 어린이 생물도감 목록 검색, 어린이 생물도감 상세 정보를 조회하는 오퍼레이션이 제공됩니다. 도감 정보에는 생물 분류, 생물명, 과명, 학명, 도감 설명문 등의 정보가 제공됩니다.
