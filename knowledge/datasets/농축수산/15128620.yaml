description_portal: '- 한국농어총공사 농지연금사업의 담보농지 데이터입니다.- 농지연금사업이란 농업인의 안정적인 노후 생활 보장을 위해 60세 이상의 농업인이 소유한 농지를 담보로 제공하고, 매달 연금 형태로 노후 생활 안정 자금을 지급받는 제도입니다.- 본 데이터는 한국농어촌공사 농지연금사업의 연도별 담보농지의 건수, 평균가격(원), 평균면적(제곱미터)을 2011년부터 현재까지 통계자료로 작성한 데이터를 제공합니다.- 농지연금사업에서 담보 농지는 특정 요건을 충족해야 하며 농지의 연도별 건수, 평균가격, 평균 면적은 사업의 운영 현황을 보여주는 중요한 지표입니다.- 해당 데이터는 농지 연금 가입자들이 어떤 농지를 담보로 제공하고 있는지 분석하는데 활용될 수 있습니다.'
