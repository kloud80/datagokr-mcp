description_portal: 경상남도 함양군 관내의 축산 농가 현황 자료로 순번, 사업장명칭, 주사육업종, 등록축종, 사육두수, 사업장 소재지(도로명주소), 데이터 기준일자 등으로 구성되어 있습니다.축산농장이란 가축을 사육하여 축산물을 생산하는 농장을 의미하며, 넓게는 축산업을 영위하는 모든 시설을 포함하며, 좁게는 가축을 사육하는 축사 및 관련 시설을 의미하기도 합니다. 관내 축산업의 분포 현황 및 농가별 축종·사육 규모를 한눈에 파악할 수 있습니다. 이를 통해 축산업 육성 및 방역 관리, 정책 수립, 농가 소득 증대, 유통망 정비, 환경 관리와 같은 다양한 행정업무에 활용할 수 있으며, 축산 관련 기관 및 연구자들에게 유용한 기초 데이터로 활용될 수 있습니다.
