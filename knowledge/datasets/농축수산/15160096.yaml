description_portal: 전북특별자치도 장수군의 사과 병해충 예찰조사 현황에 대한 데이터 입니다.데이터의 구성은 예찰일자, 과원위치, 병해충 명, 병해충구분, 발생위치, 기준(개), 범위로 구성되어 있습니다.예찰일자는 2025년 4월부터 10월까지의 데이터로 구성되어 있습니다.병은 10개의 병으로 구분되어 있고 해충은 11개의 해충으로 구분되어 있습니다.발생 위치는 잎, 과실, 나무, 신초, 가지, 흡지, 성충으로 구분되어 있습니다.이 데이터의 경우 장수군 전체 7개읍면(장수읍, 산서면, 번암면, 장계면, 천천면, 계남면, 계북면)에서 현황입니다.추가적인 데이터가 필요한 경우 공공데이터포털(data.go.kr) 누리집의 데이터 제공 신청을 통해 신청하여 주시기 바랍니다.
