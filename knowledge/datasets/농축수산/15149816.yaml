description_portal: 이 데이터는 도매시장에서 거래된 농산물의 품목별 가격 정보를 일 단위로 집계한 자료입니다. 주요 항목에는 정산일자, 대·중·소분류명, 거래 물량, 총금액, 평균 단가가 포함됩니다. 이를 통해 농산물 가격의 단기 변동 상황과 거래 규모를 파악할 수 있으며, 품목별 가격 수준을 비교하거나 시기별 추세를 분석하는 데 유용합니다. 데이터는 농업 경영 의사결정, 유통 시장 모니터링, 수급 정책 마련, 가격 예측 연구의 기초 자료로 활용될 수 있으며, 장기적인 유통 구조 개선과 정책 평가에도 참고될 수 있습니다. 세부 항목 정의와 코드 설명은 매뉴얼을 통해 확인 가능합니다.
