description_portal: '국립산림과학원에서 운영하는 청정넷(AICAN)의 전국 산림 미세먼지 측정소 운영 현황을 담은 데이터로, 관측소 그룹명, 관측소명, 위도, 경도, 해발고도, 주소, 설치일, 설명, 장비명, 장비모델명, 제조사명, 입력일시 등의 정보를 포함한다. 산림 내 미세먼지 농도 측정 및 관리, 대기질 모니터링, 환경 정책 수립, 연구 자료, 지역별 미세먼지 분포 분석 등 다양한 분야에서 활용된다. 최신 운영 현황이 반영되어 신뢰성 높은 환경 정보를 제공한다.* 관측 장소: 흥릉, 시화, 양재, 관악, 제주, 고양, 평창, 전주, 울산, 태안, 광주 등* 데이터 기준일: 2025년 2월 6일'
