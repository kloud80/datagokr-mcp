summary_user: 경기도에서 농촌융복합산업(1·2·3형)으로 인증받은 사업자를 업체 1곳당 1행으로 담은 현황으로, 시군명·업체명·사업자등록번호·주요 생산품목·인증유형·인증번호·인증일자·도로명/지번 주소·우편번호를 포함한다. 시군별로 어떤 인증 사업자가 어떤 품목을 다루는지 확인하거나, 지원 대상 선정과 인증유형별 분포 분석처럼 '우리 시군의 6차산업 인증업체는 어디에 몇 곳인가'를 묻는 정책 담당자·분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명이나 주소 같은 이름 매핑, 사업자등록번호(juregno) 같은 값 대조로만 이을 수 있다.
description_portal: 이 데이터는 경기도 지역에서 농촌융·복합산업으로 인증받은 사업자들의 상세 현황을 포함하고 있으며, 시군명, 인증업체명, 사업자등록번호, 주요 생산품목, 인증유형(1·2·3형 구분), 인증번호 및 인증일자, 소재지 주소(도로명 및 지번), 우편번호 등으로 구성되어 있습니다. 해당 데이터는 농촌자원의 산업화 촉진과 농촌경제 활성화를 위한 융복합 인증제도의 운영 현황을 파악하는 데 활용되며, 각 사업자의 특화된 생산 품목과 활동 범위를 이해하는 데 유용합니다. 또한, 인증 유형별 구분을 통해 사업 형태의 다변화를 분석하거나, 지역 기반 농촌산업 정책 수립 및 지원 대상 선정 등의 기초 자료로도 활용 가능합니다. 특히 주소 정보가 포함되어 있어 지역별 분포 분석 및 공간정보 연계 활용에도 적합합니다.
