description_portal: '본 데이터는산불 위험 SNS 키워드 추출 데이터는 소셜 미디어 플랫폼에서 수집된 키워드를 기반으로 하여 산불 발생 가능성을 평가하고 예측하는 데 사용됩니다. 이 데이터는 특정 키워드의 빈도와 관련성을 분석하여 산불 위험을 조기에 경고하는 데 도움을 줍니다.  출처, 수집일, 제목, 내용, 원본보기링크 등 "산불위험" 키워드로 조회되는 SNS 추출 정보를 제공함(원본보기링크 주소를 통해 상세 원본 내용을 확인할 수 있음)- 데이터 항목은 번호, 수집출처, 수집시드, 링크주소, 게시자, 내용, 수집일자로 구성- 수집시드: 지역, 주민, 심각, 원인, 불법, 대응, 행정, 설치, 계획, 조례, 설치, 논란, 심화, 조성 등으로 산불위험에 관련된 기사들을 분류함'
