description_portal: 이 데이터는 제주특별자치도 내 가축전염병 확산을 예방하기 위해 설치된 ‘소독거점’의 위치와 기본 현황을 정리한 공공데이터로, 각 거점의 명칭, 주소·지번, 좌표 정보 등이 포함되어 있다. 소독거점은 가축 운송 차량과 축산 관련 물류 이동 과정에서 병원체의 외부 유입과 확산을 차단하기 위한 핵심 방역 인프라로 활용되며, 전염병 발생 시 긴급 소독, 이동 경로 통제, 지역별 방역망 운영 등에 필수적이다. 이 자료는 방역정책 수립, 축산시설 관리, 지역별 위험도 평가 등 다양한 행정·연구 분야에서 활용 가능하며 CSV 형식으로 무료 제공된다.
