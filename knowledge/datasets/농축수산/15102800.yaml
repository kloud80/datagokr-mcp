summary_user: 수협 조합이 보유한 이용가공 창고별로 기준일자마다 표준어종별 재고 수량을 한 행씩 담은 전국 단위 파일(CSV, 약 4MB)이다. 수산물 유통 분석가나 가공·유통 사업자가 '특정 시점에 어느 조합 창고에 멸치 같은 어종 재고가 얼마나 쌓여 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 조합코드·창고코드·표준어종코드(또는 조합명·어종명)를 같은 수협 계열 위판·경락 데이터와 이름·코드 매핑으로 이어 쓴다.
