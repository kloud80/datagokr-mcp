summary_user: 농림축산검역본부가 수출 상대국과 합의한 식물검역요건에 따라 지정·등록한 신선농산물 수출검역단지의 현황을 전국 범위로 담은 파일 데이터다. 농가나 수출업체가 특정 품목·국가로 수출할 때 어느 지역에 지정된 수출검역단지가 있는지 확인하거나, 검역 행정·수출 지원 정책의 기초 자료로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 단지명·지역명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 우리나라 농산물의 수출을 위하여 수출 상대국과 협상을 통해 최종 합의한 식물검역요건에 따라 농림축산검역본부에 등록된 신선농산물 수출검역단지 지정 현황을 제공합니다.- 농림축산검역본부에서 지정,운영 중인 신선 농산물 수출검역단지의 현황을 종합적으로 수록한 자료임- 본 데이터는 농림축산검역본부에서 관리하는 신선 농산물 수출검역단지 지정 및 운영 현황을 종합적으로 수록한 자료임- 해당 데이터를 통해 관계 및 유관 기관의 정책 수립, 검역 행정 지원, 농가 수출지원, 국제 협상 대응의 근거 자료로 활용될 수 있으며, 농업인과 수출업체에서도 실무 활용 기초 자료로 참조 가능
