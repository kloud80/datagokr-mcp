summary_user: 겨울철 유휴농경지 녹비작물 재배를 위해 지원된 종자대 내역을 전국 범위로 담으며, 필드 구성으로 보아 연도·시도·시군구·작물(품목명)별로 지원 농가 수·면적·물량을 정리한 지역 단위 집계다. 지자체·정책 담당자나 연구자가 '어느 시군구에서 어떤 녹비작물에 얼마나 많은 농가와 면적이 지원됐는가'를 연도별로 비교할 때 쓴다. 전역 조인 키는 확인되지 않아 시도·시군구 코드나 이름(CTRD_CODE, SIGNGU_CODE)을 행정구역 코드표에 매핑하거나 같은 기관 자료와 연결해서 쓴다.
description_portal: 해당 데이터는 겨울철 유휴농경지에 녹비작물을 재배할 수 있도록 지원된 녹비작물 종자대 내역을 정리한 자료입니다. 이를 통해 농업인은 유휴농경지를 활용하여 토양 개선과 경작 효율성을 높일 수 있으며, 정부와 지자체는 지원 효과를 분석해 향후 친환경농업 정책과 보급 전략을 수립하는 근거 자료로 활용할 수 있습니다. 또한 연구자와 관련 기관에는 녹비작물 활용에 따른 토양 관리 및 환경 보전 효과를 평가할 수 있는 실증 자료가 되며, 장기적으로는 지속 가능한 농업 기반 마련과 친환경 농업 확산에 기여할 수 있는 의미 있는 자료라 할 수 있습니다.
