description_portal: 1. 데이터 주요 내용, 목적, 활용 맥락본 데이터는 전북 남원시 지리산허브밸리 허브식물원에서 관리하는 다양한 허브 식물의 체계적인 관리 정보를 제공합니다. 각 허브 식물의 생육 특성, 재배 조건, 관리 방법, 활용 용도 등에 대한 상세한 정보를 담아, 허브 재배농가와 연구기관, 일반 시민들이 허브 식물에 관한 정확하고 실용적인 정보를 쉽게 얻을 수 있도록 구성했습니다.2. 기대효과이 데이터는 허브 재배 기술 향상과 관련 산업 발전에 기여하고, 지리산 지역의 관광자원 개발 및 지역경제 활성화에 도움을 줄 것으로 기대됩니다. 더불어 시민들의 허브에 대한 이해를 높이고 건강한 생활문화 확산에도 긍정적인 영향을 미칠 것입니다.
