summary_user: 경기도 내 정부관리 양곡 도정공장을 공장 한 곳당 한 행으로 담은 현황 자료로, 시군명·공장명·등급·하루 생산능력(톤)·도로명/지번 주소·우편번호·위경도 좌표를 포함한다. 분석가나 지자체 담당자가 '경기도 어느 시군에 도정공장이 몰려 있고 하루 몇 톤을 가공할 수 있나'를 확인할 때 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 경기도 다른 시군 단위 자료와 맞추거나, 주소·좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 정부관리 양곡가공 도정공장의 현황을 정리한 자료로, 각 도정공장의 등급, 하루 생산능력(톤), 소재지 주소, 우편번호, WGS84 좌표(위도·경도) 정보를 포함합니다. 이를 통해 지역별 곡물 가공시설의 분포와 규모를 파악할 수 있으며, 도정공장별 등급 체계와 생산 능력을 비교할 수 있습니다. 또한 도로명·지번 주소와 좌표 데이터를 통해 공간 분석이 가능하여, 지역 식량자원 관리, 곡물 유통 구조 연구, 지역 농업 산업 기반 평가 등에 활용될 수 있습니다. 이 데이터는 식량 자급률 제고, 곡물 가공 인프라 관리, 농업 정책 수립을 위한 기초자료로서 의미가 있습니다.
