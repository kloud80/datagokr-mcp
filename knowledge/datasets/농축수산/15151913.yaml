summary_user: 한국농어촌공사의 농촌용수 수질측정망 정보를 전국 범위로 담은 데이터로, 컬럼은 저수지 코드(RSRVR_CD), 측정일시(MSRN_DT)와 수위로 보이는 값 두 개(LOLE, CNL_WALE)입니다. 농업용수 관리자나 분석가가 특정 저수지의 측정값이 시점별로 어떻게 바뀌었는지 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 저수지 코드나 이름을 매핑해 한국농어촌공사의 다른 저수지 데이터와 잇는 방식으로만 연결합니다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국농어촌공사에서 제공하는 농촌용수수질측정망 정보입니다.
