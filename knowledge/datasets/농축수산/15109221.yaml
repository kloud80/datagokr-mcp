summary_user: 2015년 제·개정 농축수산물 표준코드와 2013년 표준코드를 부류·품목·품종 단위로 한 행씩 짝지은 전국 대상 코드 대응표로, 신·구 코드와 이름, 갱신일자(UPDT_DE)를 담는다. 유통업체·분석가가 옛 표준코드로 기록된 거래·가격 자료를 현행 품목코드로 바꿔 시계열을 맞출 때 '이 구 품목코드는 새 코드로 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 신·구 품목·품종 코드를 매개로 같은 기관의 표준코드 기반 데이터와 이름·코드 매핑으로 잇고, KAMIS·도매시장·HS·KOSIS 품목코드와는 별도 매핑이 필요하다.
description_portal: 본 데이터는 2015년 제·개정된 농축수산물 표준코드와 동일한 의미를 지닌 2013년 농축수산물 표준코드 관련 정보를 제공합니다. 이 정보를 통해 사용자는 농수산물의 품목, 시장, 단위, 포장, 크기, 등급 및 산지에 대한 구체적인 데이터를 확인할 수 있습니다. 이러한 데이터는 농업, 수산업 및 식품 산업의 환경에서 이용되어, 품목 코드를 정확히 매핑하여 보다 효율적인 경영 및 거래에 기여할 수 있습니다. 특히, 해당 API의 '신구표준품목목록조회' 오퍼레이션은 2015년에 제정된 농축수산물 표준코드의 품목코드와 2013년의 이를 매핑하여, 부류명, 품목명, 품종명, 업데이트 일자 등의 정보를 제공함으로써 사용자가 다양한 품목 관련 데이터에 쉽게 접근할 수 있도록 도와줍니다. 이 데이터는 품목 관리, 시장 조사, 통계 분석 등 다양한 분야에서 활용될 수 있습니다.
