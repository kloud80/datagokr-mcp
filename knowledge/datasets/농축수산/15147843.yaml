description_portal: 축산유통 통계누리에서 제공하고 있는 자료는 출처는 통계청과 가축동향조사를 기반으로 제공되고 있습니다. 오리 시도 사육규모별 가구수 및 마리수 통계 자료로 분기별 지역별 오리 가구수와 사육두수 조사자료 입니다. 지역별로 확인이 가능하여 오리농장 가구수와 사육두수 변화의 추이를 알수 있습니다. 시계열 자료로 활용하여 축산정책 수립 등에 활용가능합니다. 제공되는 파일형태는 엑셀과 csv이고 이용자의 목적에 맞게 활용가능합니다. 또한 이용자 편의성 제고를 위해 차트도 활용할수 있는 시각화 자료도 제공중에 있습니다. 데이터를 활용 할 수 있도록 기초분석 결과도 제공하고 있습니다.
