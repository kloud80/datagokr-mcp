summary_user: 축종별로 자연재해 등 사고·재해 때문에 피해 축산농가에 지급된 가축보험금 현황을 정리한 전국 단위 집계 파일로, 실측 컬럼 기준 2021년 현황 표 형태다. 가축재해보험 제도 개선이나 재해 대응 정책을 검토하는 분석가가 '어떤 축종에서 어떤 재해 피해가 많고 보험금은 얼마나 나갔나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 축산·재해 데이터와는 축종 이름을 직접 맞추는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 축종별 가축보험금 지급 통계 정보로, 자연재해 등 각 사고 및 재해로 인한 피해 축산농가에 지급된 보험금 현황을 축종별로 정리한 자료입니다. 이를 통해 가축의 종류별로 어떤 사고 및 재해로 인한 피해가 많이 발생했는지, 그리고 이에 따라 지급된 보험금 규모가 어떻게 분포하는지를 파악할 수 있습니다. 본 데이터는 축종별 위험 수준을 비교·분석하여 향후 축산농가의 경영 안정화 대책 마련, 가축재해보험 제도 개선, 재해 대응 정책 수립 등 다양한 정책적 의사결정의 기초자료로 활용될 수 있으며, 특히 축종 특성에 따라 발생하는 손실 유형을 반영한 맞춤형 지원방안 마련에도 기여할 수 있습니다.
