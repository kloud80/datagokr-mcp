description_portal: 본 공공데이터는 경상남도 고성군 내 지정된 낚시통제구역 및 낚시금지구역에 관한 상세 안내 정보를 제공합니다. 주요 항목으로는 낚시통제와 금지로 구분된 지정 구분, 바닷가 및 저수지 등의 대상 장소, 관련 법령 및 조례 등 행정적 근거가 포함되어 있습니다. 또한 낚시 행위가 제한되는 세부 지정범위, 지정일자, 지정기간, 지정면적, 그리고 구역 설정의 구체적인 지정사유를 명확히 수록하였습니다. 아울러 민원 문의 및 정확한 현장 안내를 위해 해당 구역을 관할하는 담당부서 정보와 연락처를 함께 수록하였습니다. 본 자료는 수산자원의 지속 가능한 관리와 생태계 보호, 낚시객의 안전사고 예방 및 쾌적한 연안 환경 조성을 목적으로 구축되었습니다.
