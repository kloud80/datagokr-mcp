summary_user: 국립농산물품질관리원이 관리하는 친환경인증 농산물의 2016년 이후 인증 현황을 연도·시도·시군구별로 집계한 통계로, 인증 건수·농가수·면적·출하량을 유기농산물과 무농약농산물로 나눠 담는다. 분석가나 지자체 담당자가 '우리 시도의 유기농 인증 면적과 농가수는 해마다 어떻게 변했나'처럼 지역별 친환경농업 규모와 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 매핑하거나 같은 기관 자료와 맞춰 이어 쓴다.
