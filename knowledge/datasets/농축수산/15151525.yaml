status: active
summary_user: 강원특별자치도 각 시군구의 산지를 임업용산지·공익용산지·준보전산지로 나눠 연도별 면적을 담은 집계 통계로, 포털 설명상 2008년부터 2024년까지를 다룬다. 지역 개발이나 토지 이용을 검토하는 분석가가 '강원 어느 시군에서 개발 규제가 약한 준보전산지 비중이 늘거나 줄었나'를 연도별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구 이름(기관명)을 행정구역 코드로 직접 매핑해야 다른 통계와 이을 수 있고, 필지 단위 토지이용규제(PNU) 데이터와는 바로 연결되지 않는다.
limits: 시군구 단위 집계 면적이라 개별 필지의 보전·준보전 여부는 확인할 수 없다. 표준 행정코드 같은 조인 키가 없어 기관명 문자열을 매핑해야 하며, 공간정보가 없는 비공간 표 형태다.
