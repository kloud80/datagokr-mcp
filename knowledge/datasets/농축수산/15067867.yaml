description_portal: 농어촌지하수관리시스템에 등재된 데이터 중 농촌지하수자원관리조사에서 현장조사한 지하수 관정의 위치정보 및 제원 정보입니다.한국농어촌공사에서는 지하수의 지속가능한 개발과 이용을 위해 지하수관리사업을 통하여 농어촌 지하수자원의 관리를 하고있습니다.농어촌지하수관리시스템이란 한국농어촌공사에서 생성되는 지하수 주제도정보, 시설정보, 관측정보를 온라인으로 제공하기 위한 지하수 활용 시스템으로,농어촌지역의 자하수 이용현황, 수질 및 수리조사 등 각종 지하수 자료를 관리하여 지하수 관리대책 방안을 강구하고 지하수 모니터링을 실시하고 지속적인 감시감리로 농어촌지역 지하수 난개발과 수질오염을 사전예방을 도모하고 있습니다.
