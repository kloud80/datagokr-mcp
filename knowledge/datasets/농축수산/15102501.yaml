summary_user: 공익직불금(기본형)을 전국 시도 단위로 집계한 표로, 시도별 지급 금액(억원)을 담으며 포털 설명상 2023년 지급 결과를 기준으로 한다. 정책 분석가나 지자체 담당자가 '어느 시도에 기본형 공익직불금이 얼마나 지급됐고, 이를 근거로 시도별 농업인·농지 유지 규모가 어느 정도인가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 시도별 농업·농지 통계와는 시도 이름을 맞춰 연결해야 한다.
description_portal: 농림축산식품부_공익직불금(기본형) 시도별 지급 현황- 2023년 시도별 지급 현황(금액)- 전국 농업인을 대상으로 하는 보조사업으로, 경영체 등록 농업인 및 지급 대상 농지 요건을 충족, 준수사항 이행점검 후 최종 농업인에게 지급된 지급 액에 대하여,    전국 시도별 교부 및 지급된 금액을 나타내는 자료- 해당 데이터는 각 사업연도 지급 결과를 토대로 작성한 자료로, 실제 지급금과 차이가 있을 수 있음- 해당데이터를 통해 시도별 대상 농업인 및 지급 대상 농지의 규모를 파악할 수 있음- 2023년 시도별 지급금액을 파악함으로써 시도별 농업인, 농지 유지 규모 파악 할 수 있음
