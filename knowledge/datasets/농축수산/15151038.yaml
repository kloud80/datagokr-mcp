summary_user: 경기도 사이버식물병원에 접수된 진단의뢰 건마다 첨부된 병해 증상 사진을 의뢰번호·이미지번호·촬영 부위 번호 단위로 담은 건별 원천 테이블이다. 식물병 진단 서비스를 분석하는 분석가가 '한 진단의뢰에 어떤 부위 사진이 몇 장 붙었나'를 확인하는 데 쓴다. 포털 설명상 진단의뢰번호(diagns_rqst_no)로 같은 기관의 진단의뢰 테이블과, 이미지번호로 증상 이미지·이미지 정보 테이블과 잇지만, 실측 컬럼에서 전역 조인 키는 확인되지 않아 같은 기관 데이터끼리만 연결된다.
description_portal: 진단_의뢰_이미지 테이블은 사이버식물병원에 등록된 진단의뢰 건에 첨부된 병해 증상 사진 정보를 관리합니다. 이 테이블은 각 진단의뢰번호(진단의뢰번호)에 대해 하나 이상의 이미지번호(이미지번호)를 연결하며, 이미지가 촬영된 병해 부위를 식별하기 위한 이미지_부위_번호도 함께 포함됩니다. 이 테이블의 진단의뢰번호는 진단_의뢰 테이블의 진단의뢰번호와 연계되어 해당 진단 건과 연계된 이미지 정보를 함계 확인할 수 있도록 지원합니다.이미지번호(img_num)는 증상_이미지 테이블이나 이미지_정보 테이블과 연계하여 실제 파일명 및 병해 분류 정보를 추가적으로 탐색할 수 있습니다.
