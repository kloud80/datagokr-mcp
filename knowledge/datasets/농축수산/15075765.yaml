description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 서귀포자연휴양림은 제주시 남서쪽, 서귀포시 대포동 산 1-1번지에 위치한 총면적 255 ha 규모의 천연 숲 휴양림으로, 제주 산림 본연의 자연 생태를 유지하면서 산림욕, 산책, 캠핑, 휴양이 가능한 공간이다. 울창한 난대·온대림이 조성되어 있으며, 무장애 나눔숲길·산책로·차량순환로·야영장 등 다양한 시설이 마련되어 있어, 휠체어 사용자나 교통약자도 접근 가능한 휴양 공간을 제공한다. 장애인 전용 주차구역, 단차 없는 출입구, 경사로, 장애인 화장실 등이 갖추어져 있어 누구나 이용 가능한 열린관광지 환경을 갖추었으며, 숲속의 평온함과 자연 치유 공간으로서 공공 관광 안내, 무장애 관광 코스 설계, 관광 정책 수립, 관광 콘텐츠 및 지도 서비스 제작 등 다양한 공공·관광 분야에서 유용한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
