description_portal: '인천광역시가 제공하는 식량작물 생산량 (정곡) 공공데이터는 지역 내에서 생산되는 주요 곡물류의 재배 면적과 총 생산량을 품종별로 집계한 통계 자료입니다. 이 데이터는 지역 농업 생산 현황과 식량 작물의 수급 상황을 파악하고, 농업 정책 수립, 농가 지원 계획, 식량 안보 대책 등의 기초 자료로 활용되는 것을 목적으로 합니다.*주요 구성 항목은 다음과 같습니다.-정곡별: 현황이 집계된 식량 작물의 종류를 구분합니다.  미곡, 맥류, 잡곡, 두류, 서류가 포함되어 있습니다. * 단위 : 면적 (ha)생산량 (M/T)해당 데이터는 공공데이터포털에서 확인할 수 있습니다.'
