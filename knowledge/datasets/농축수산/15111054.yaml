description_portal: 한국수목원정원관리원은 백두대간 지역을 포함한 국내 주요 권역에서 수집한 자생식물의 종자 촬영 이미지와 기본 정보를 통합한 데이터를 공공데이터로 제공합니다. 이 데이터는 자생식물 종별로 촬영된 종자 이미지와 함께 과명, 속명, 종명에 대한 영문 및 국문명, 평균 종자 너비와 길이, 채집지, 수집일 등의 정보가 포함되어 있으며, 종자 형태 비교, 분류 연구, 종자은행 자료 구축 등에 활용할 수 있습니다. 시각적 이미지와 계량적 특성을 함께 제공함으로써 종자의 형태학적 특성과 수집 정보를 통합적으로 분석할 수 있는 기초 자료를 제공합니다.데이터는 CSV 형식으로 제공되며, 종자별 정보와 이미지파일 연동이 가능한 구조입니다.주요 항목은 도입번호, 과명, 과 국명, 속명, 속 국명, 도입학명, 국명, 종자 평균 길이(mm), 종자 평균 너비(mm), 채집지(국명), 수집일 등으로 구성되어 있습니다. 종자 이미지 파일은 별도 파일로 제공되며, 각 레코드와 연동되어 이미지 기반 분류 분석이나 학습용 콘텐츠 개발에 활용될 수 있습니다.본 데이터는 자생식물 자원 보전, 종자분류 체계 연구, 생태복원 기반자료로 활용도가 높습니다.연구기관은 형태 기반 유연관계 분석, 머신러닝 기반 자동 분류 모델 훈련 등에 활용할 수 있으며, 교육기관에서는 시각적 식물학 콘텐츠로, 공공기관 및 수목원은 종자 DB 구축과 종 보존 정책 수립의 참고 자료로 활용할 수 있습니다.
