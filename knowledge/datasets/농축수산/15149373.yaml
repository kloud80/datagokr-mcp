description_portal: 이 데이터는 해양수산부에서 점사용허가에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 점사용일련번호, 조사년도, 사용목적, 허가면적, 허가일자, 허가기간시작일, 허가기간종료일, 사용료, 점사용허가종류 데이터로 구성되어 있습니다.본 데이터는 점사용허가 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.점사용허가란  공공용 토지(도로, 공유수면 등)의 특정 부분을 개인이나 단체가 사용하도록 허가하는 행위를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
