description_portal: '강원특별자치도 강릉시의 사방지(산사태·토사유출 방지 등을 위해 지정·관리하는 지역) 정보를 정리한 데이터로, 각 사방지의 위치, 면적, 지정·해제 이력과 사업내용을 함께 확인할 수 있도록 구성된 자료입니다. 산사태 등 자연재해 예방과 산지 이용·보전 정책 수립에 활용할 수 있는 기초 공간정보입니다.소재지: 사방지가 위치한 행정구역·지번 등의 기본 위치 정보지목: 해당 토지의 지목(산, 전, 임야 등 토지대장상 용도 구분)지적면적(제곱미터): 토지대장에 등록된 사방지 대상 필지의 전체 면적(㎡)지정면적(제곱미터): 이 중 사방지로 실제 지정된 면적(㎡)사업내용: 사방댐 설치, 사방시설 보강, 사면 안정사업 등 해당 사방지에서 수행된 주요 사업 내용지정일: 해당 지역이 사방지로 공식 지정된 날짜지정고시번호: 사방지 지정을 고시한 법적·행정 고시 번호(예: ○○도 고시 제○호)해제일: 사방지 지정이 해제된 경우, 해제된 날짜(해제 이력이 없으면 공란 또는 미기재)해제고시번호: 사방지 해제를 규정한 고시·공고 번호데이터기준일자: 사방지 지정·해제 및 면적·사업정보 등이 마지막으로 확인·갱신된 기준 일자이 데이터는 사방지의 위치와 면적, 지정·해제 이력, 사업내용을 한눈에 파악할 수 있어 산사태 위험지역 관리, 재해예방시설 유지보수 계획 수립, 산지 개발·이용 인허가 검토, 환경·경관 보전계획 수립 등과 같은 산지 관리 및 재해 예방 정책을 지원하는 데 활용할 수 있습니다.'
