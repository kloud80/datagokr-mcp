summary_user: 농촌진흥청 농업기상관측지점의 일자별 관측값(강수량, 최고·최저·평균기온, 일사량, 습도, 풍향·풍속, 일조시간)과 가까운 기상청 관측지점의 관측값(강수량, 기온, 최대풍속, 적설 등)을 지점 간 거리와 함께 한 행에 묶은 전국 단위 관측 데이터다. 연구자나 농업 분석가가 특정 날짜·지점의 농업기상 관측값을 인근 기상청 관측값과 비교하거나, 작물 생육기 기상 조건을 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 관측일자, 관측지점 위경도, 기상청 지점 코드(KMA_OBSV_PNT_CDCN) 같은 값을 이름·코드 매핑으로 맞춰 연결해야 한다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 농촌진흥청의 농업 기상 정보와 기상청의 기상정보를 결합한 데이터셋입니다. 이 데이터는 농업 관련 연구 및 기후 변화 분석, 기상 예측 모델 개발 등 여러 분야에서 활용될 수 있습니다. 농업 기상 데이터는 농작물의 생육 및 생산성에 큰 영향을 미치므로, 이 정보를 통해 농민 및 관련 기관은 더욱 효과적으로 기상을 관리하고 적절한 농사 전략을 수립할 수 있습니다. 본 데이터셋에는 관측일자, 농업기상관측지점의 위도 및 경도, 강수량, 최고/최저/평균온도, 일사량, 습도, 풍향, 풍속, 일조시간 등의 다양한 기상 정보가 포함되어 있습니다. 또한, 기상청 관측지점의 데이터도 포함되어 있어 각종 기상 조건의 종합적인 검토가 가능합니다. 이를 통해 사용자는 농작물의 성장에 필요한 기후 조건을 면밀히 분석할 수 있습니다. 이처럼 풍부한 기상 데이터를 활용하여 농업의 생산성을 높이고 기후변화에 신속하게 대응할 수 있는 기반을 제공하는 것이 이 API의 핵심입니다.
