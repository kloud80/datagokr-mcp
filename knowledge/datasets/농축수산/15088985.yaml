description_portal: 이 자료는 서울시에서 제공하는 도시농업 관련 학습 및 체험 프로그램 정보를 정리한 목록입니다. 각 프로그램의 제목, 교육내용 요약, 수강 대상, 체험장소, 모집 일정 등이 포함되어 있어 시민이 신청 가능한 도시농업 활동을 쉽게 탐색할 수 있도록 설계되어 있습니다. 도시농업은 도시 내 텃밭운영, 실내 수경재배, 커뮤니티가든 등 녹지‧생태 기반 활동을 뜻하며, 이 데이터를 통해 프로그램 공급 현황, 지역별 참여 기회, 대상별 맞춤형 체험분포 등을 분석할 수 있습니다. 또한 도시농업 활성화나 녹색생활문화 확산을 위한 정책기획, 교육수요 기반분석, 시민참여형 활동 설계 등에 유용한 기초자료입니다.서울도시농업 학습과 체험을 배울수 있는 교육 프로그램 정보를 제공합니다. 등록자치구, 과정명, 신청시작일, 신청종료일, 이용시작일, 이용종료일, 이용 대상 자치구, 모집인원(수량), 신청방법, 신청링크, 이용요금, 주소, 상세주소, 위도, 경도, 주의사항 등의 항목을 제공합니다.
