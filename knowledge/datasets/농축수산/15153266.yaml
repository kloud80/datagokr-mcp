summary_user: 한국농어촌공사가 관리하는 전국 저수지의 제원을 저수지 한 곳당 한 행으로 담으며, 위치(주소·경위도), 착공·준공일, 수혜면적, 유역면적, 총·유효저수량, 제방 형식·높이·길이, 한발·홍수 빈도 같은 시설 정보가 들어 있다. 농업용수 담당자나 재난안전 분석가가 '우리 지역 저수지의 유효저수량과 제방 규모는 얼마인가', '준공한 지 오래된 저수지는 어디인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 저수지코드·저수지명이나 주소코드(ADDR_CD)를 이름·코드로 매핑해 잇거나 같은 기관(한국농어촌공사) 코드로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국농어촌공사에서 제공하는 저수지제원에 대한 관련 정보입니다.\""
team:
