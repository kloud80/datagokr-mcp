description_portal: '○ 통계개요* 통계명 : 농가인구(연령별)* 통계종류 : 서울시 농업 종사가구의 가구원 연령현황을 제공하는 지정ㆍ조사통계* 작성목적 : 농가, 농가인구, 농업경영규모, 영농형태 등의 변화추이를 파악하여 국가,지방자치단체 및 연구기관 등의 농업관련 정책수립, 연구분석 및 평가를 위한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 농가 → 조사담당자 → 지방통계청 → 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 연령별ㆍ성별 농가인구 현황○ 용어설명* 농가인구 : 가족관계 등록부나 주민등록과 관계없이 조사기준일 현재 조사대상 가구에서취사, 취침 등 생계를 같이 하는 사람으로서 가족, 친인척 등을 말하며,농업 고용인 등 혈연관계가 없는 사람도 농업과 관련되면 포함됨○ 기 타* 추정과정의 반올림으로 인해 합계가 일치하지 않는 경우도 있음○ 출 처 : 통계청 농업어업조사」,「농림어업총조사」'
