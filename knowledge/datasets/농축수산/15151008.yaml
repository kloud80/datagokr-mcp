summary_user: 경기도 사이버식물병원 진단 시스템에서 병해 발생지를 행정 단위로 구분하는 데 쓰는 시도 단위 주소 기준표로, 시도 코드(sido_cd)와 시도명만 담은 코드성 테이블이다. 사이버식물병원 진단 데이터를 분석하는 사람이 '어느 시도에서 병해 진단 의뢰가 많은가'처럼 진단 기록을 시도 이름으로 풀어 집계할 때 쓴다. 포털 설명상 같은 시스템의 시군구·읍면동 주소 테이블, 진단 의뢰 주소 테이블과 시도 코드로 이어 쓰지만, 실측 컬럼에는 전역 조인 키가 없어 다른 기관 데이터와는 시도명 매핑으로만 연결한다.
description_portal: 주소_시도 테이블은 우리나라의 시도 단위 행정구역 정보를 포함하는 기본 주소 데이터입니다. 각 시도는 고유의 시도 코드와 시도명을 포함하고 있으며, 병해 진단의 발생지를 행정 단위로 구분하여 통계적 분석이나 공간 기반 시각화 자료에 활용됩니다. 이 테이블은 주소_시군구, 주소_읍면동 테이블과 연계하여 행정구역을 상위에서 하위로 구성하며, 진단_의뢰_주소 테이블에서 병해 발생 주소의 시도 단위를 확인할 때 참조됩니다. 병해 발생 빈도, 지역별 병해 유형 분포 등 다양한 지역 기반 분석이 가능하도록 행정 단위의 표준화를 지원합니다.
