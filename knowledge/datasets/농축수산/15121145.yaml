description_portal: '해양수산과학기술진흥원이 제공하는 해양수산 분야 R&D 특허목록으로, 국가연구개발사업을 통해 창출된 특허 정보를 종합적으로 수록하고 있다. 성과년도, 예산년도, 과제접수번호, 사업명, 과제명, 주관연구기관, 수행기관, 과제구분 등 기본 과제 정보와 함께, 출원명, 출원 및 등록 구분, 출원국가, 출원기관, 출원일자, 출원번호, 등록번호, 기여율 등 다양한 특허 관련 항목이 포함되어 있다. 이를 통해 연구성과의 현황을 한눈에 파악할 수 있으며, 특허 동향 분석, 연구개발 성과 평가, 정책 수립 및 기술사업화 전략 마련 등에 활용할 수 있다. 연구기관은 자체 성과 관리에, 정책 담당자는 연구개발 투자 효과성 분석에, 산업계는 신기술 확보 및 사업화 가능성 검토에 본 자료를 활용할 수 있다. 본 데이터는 해양수산 분야 연구개발 성과의 지식재산(IP)적 가치를 보여주는 핵심 자료로, 연구자·정책입안자·산업계 종사자 모두에게 실질적 참고자료를 제공한다. 참고: 2023년 이후 범부처통합연구지원시스템(IRIS)으로 해당 시스템이 이관되어 데이터 생산 중단'
