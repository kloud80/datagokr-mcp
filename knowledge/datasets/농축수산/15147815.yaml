summary_user: 해양수산부가 운영하는 전국 연안정지관측소의 위치 정보를 관측소별로 담은 목록 파일로, 해역·관측점 코드·관측소 한글명과 영문명·위도·경도로 구성되며 파일 크기는 약 3KB입니다. 해양 행정·정책 담당자나 분석가가 특정 해역 가까이에 어떤 연안 관측 지점이 있는지 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 관측점 코드·관측소명을 같은 기관의 관측 자료와 맞추거나 위경도로 공간 매칭해 잇는다.
description_portal: 이 데이터는 해양수산부에서 연안정지관측소에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 해역, 관측소한글명, 관측소영문명, 위도, 경도 데이터로 구성되어 있습니다.본 데이터는 연안정지관측소 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.연안정지관측소란 해양 환경 및 기상 정보를 얻기 위해 특정 연안 지점에서 주기적으로 관측하는 시설을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
