description_portal: 이 데이터는 해양수산부 바다내비 내에서 사용되는 표시장치의 정보를 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 23년 1월부터 26년 4월까지 바다 내비게이션의 표시장치 마스터 정보로 구성되어 있습니다. 개인정보는 삭제되어 있으며, 각 표시장치의 모델명, 소프트웨어 버전 등 항목들이 포함되어 있습니다.  본 데이터는 해양수산 분야 장비 관리체계 구축, 장비 이력 관리, 장비 통계 산출 및 표준화 작업, 표시장치의 현황 파악, 신규 장비 도입 및 현행화 검토 등에 활용될 수 있습니다. 기관 및 사업자는 장비 관리 시스템 개발, 정책 자료 마련, 행정 보고 등의 목적으로 본 데이터를 참고할 수 있습니다.
