summary_user: 연안의 정해진 관측소에서 매일 일정한 시간에 잰 수온·기온·염도·운량·풍량 값을 관측소(관측점 코드·관측소 한글명)와 관측일시별 행으로 담은 전국 단위 건별 관측 파일이다. 양식 어업인이나 해양 분석가가 '특정 연안 지점의 수온·염분이 시기별로 어떻게 변했나'를 확인하거나 고수온 피해 시기를 되짚을 때 쓴다. 실측 컬럼에 전역 조인 키는 없어 다른 데이터와는 관측점 코드나 관측소 이름을 같은 기관의 관측소 목록과 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 연안정지관측에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 관측점 코드, 관측소 한글명, 관측일시, 수온, 기온, 풍량, 운량, 염도 데이터로 구성되어 있습니다.본 데이터는 연안정지관측 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.연안정지관측이란 특정 연안 지점에서 매일 일정한 시간에 수온, 기온, 염분, 운량, 천기 등 해양 및 기상 요소를 반복적으로 관측하는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
