summary_user: 스마트 APC 플랫폼 서비스를 쓰는 전국 산지유통센터(APC)의 등록번호·업체명·시도·시군·주소를 업체 한 곳당 한 줄로 담은 파일이다. 특정 시군에 스마트 APC에 참여하는 산지유통센터가 어디에 있는지 찾는 농업인·유통사업자나, 지역별 산지유통 인프라 분포를 보려는 분석가가 쓴다. APC 등록번호(apc_rgst_no)를 키로 다른 APC 관련 자료와 잇고, 시도·시군·주소로 지역 단위 자료와 맞춘다.
description_portal: '농산물 산지유통 전 과정에 디지털 기술을 적용하여 유통구조를 혁신하고, 새로운 가치를 창출하는 스마트 APC 플랫폼 서비스를 활용하고 있는 산지유통센터 현황입니다.농산물 유통 과정에서 발생하는 정보와 자료를 디지털화하여 디지털화된 데이터의 연결과 융합을 통해 데이터 기반 실시간 대‧내외 연계를 통해 농산물 유통정보 공동활용 기반을 마련에 참여하는 업체 정보입니다.APC정보지원시스템: APC 생산 관리, 생산 농가 관리, 생산 유통통합 조직 등록 등의 업무를 지원하는 시스템'
