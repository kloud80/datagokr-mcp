description_portal: 경상남도는 지역 내 전통주 양조장을 체계적으로 파악하고 지원하기 위해 “전통주 양조장” 데이터를 제공한다. 이 데이터셋은 전통주 제조업체의 명칭, 소재지,  양조주종 등 기본적인 사업 정보를 포함한다. 데이터는 각 양조장의 신고·등록 자료 조사 결과를 기반으로 매년 12월 말일 기준 연 1회 갱신된다. 주요 항목은 양조장명, 주소, 전통주 종류(막걸리·청주·소주 등)를 제공한다. 파일 형식은 CSV와 JSON을 지원해 다양한 분석 환경에 바로 활용할 수 있다.활용 사례로는 전통주 관광 코스 개발, 지역 브랜드 마케팅, 생산량·수요 예측 모델링, 학술 연구 등이 있다.
