description_portal: 이 데이터는 해양수산부에서 항만가이드라인 항구 목록 응답 이력 관리를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 항만가이드라인에 따라 지능형 해상교통정보시스템(바다내비)에서 제공되는 도선사 예선지원서비스(SV51)와 관련하여 요청, 응답 메시지 ID, 응답 실패여부 등 이력 마스터 데이터로 구성되어 있습니다.  본 데이터는 항만 운영 관련 정책 수립 과정에서 항구 응답 이력 분석, 도선사 예선 지원 서비스의 운영 현황 점검, 항만별 서비스 제공 상황 모니터링, 해상교통 정보시스템의 서비스 품질 개선 등에서 활용될 수 있습니다.
