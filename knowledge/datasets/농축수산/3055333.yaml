summary_user: 국립농산물품질관리원이 관리하는 LMO(유전자변형생물체) 수입승인 건을 연도별로 집계해, 전체와 면실류·옥수수·대두·기타 품목별 물량(천톤)과 금액(천달러)을 담은 전국 단위 통계다. 연구자나 기자가 "GMO 옥수수·대두 수입량이 해마다 어떻게 달라졌나"를 확인하거나, 사료·식품 원료 업계가 품목별 LMO 수입 규모 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 품목명으로만 맞춰 붙이며, 가격·수입 통계와 연결하려면 KAMIS·HS·KOSIS 품목코드와 따로 매핑해야 한다.
description_portal: 유전자변형생물체(LMO)는 생명공학기술을 이용하여 얻어진 새로운 유전물질의 조합을 포함하고 있는 모든 살아있는 생물체를 말하며, 유전자변형생물체(LMO) 안전성 및 위해성 평가는 국민건강과 생물다양성의 보전 및 지속적인 이용에 미치는 위해를 사전에 방지하기 위하기 위해 인체에 대한 안전성과 환경에 대한 위해성으로 나누어 관리하고 있습니다. 본 정보는 국립농산물품질관리원에서 관리하는 LMO(유전자변형생물체) 수입현황 관리정보로서, 면실류, 옥수수, 대두 등의 수입승인 건에 대한  년도, 총계(천톤), 총금액(천달러), 물량(천톤), 금액(천달러) 항목으로 구성된 데이터입니다.
