description_portal: 이 데이터는 해양수산부 국립해양조사원에서 연도별 해안선조사를 통해 조사된 해안선의 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 연도별, 지자체 및 시군구별 자연해안선과 인공해안선, 해안선의 합계 정보로 구성되어 있습니다.  본 데이터는 행정구역별 연도별 해안선 길이 변동을 비교하거나 지자체별 해안선 관리 및 정책 수립의 기초자료로 활용될 수 있습니다. 또한 해안선 정보를 바탕으로 해양공간계획, 연안정비사업, 해양관광 개발방안 마련 등 다양한 공공업무 및 연구 목적으로 이용될 수 있습니다.
