summary_user: 경기도 해역에 설치된 인공어초를 시설 건별로 담은 현황 자료로, 시군명, 용도구분(어류용·패조류용 등), 시설해역, 시설연도, 어초종류, 시설면적(㎡)을 담는다. 연구자나 어업 정책 담당자가 '경기도 어느 시군 해역에 어떤 종류의 어초가 언제, 얼마나 넓게 설치됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 이 데이터는 국내 해역에 설치된 인공어초의 현황을 정리한 자료로, 해양 수산자원의 보호 및 증식을 위한 인공 구조물의 설치 정보를 담고 있습니다. 주요 항목은 용도구분(어류용, 패조류용 등), 시설해역, 시군구분, 시설연도, 어초종류(아치형, 사각형, 테트라형 등), 시설면적(㎡)이며, 각 지역별로 설치된 어초의 특성과 시설 규모를 파악할 수 있습니다. 인공어초는 수중 생물의 서식처 및 산란장을 제공하여 어족자원을 회복하고 해양 생태계 보호에 기여하는 주요 수산 정책 수단입니다. 해당 데이터는 지역별 해양공간 활용 현황 분석, 어업 정책 수립, 해양 생태 복원 연구, 수산자원관리계획 수립 등에 활용될 수 있습니다.
