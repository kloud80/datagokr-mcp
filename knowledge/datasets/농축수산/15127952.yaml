description_portal: 이 데이터는 해양수산부 바다내비 시스템의 상태 정보를 체계적으로 관리하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 지능형 해상교통정보시스템(바다내비) 내에 정의된 상태 코드와 각 코드에 해당하는 시스템 상태의 상세 설명 등 시스템 운영에 필요한 마스터 정보로 구성되어 있습니다.  본 데이터는 해양 관련 정보시스템의 운용 현황 파악, 시스템 장애 분석 자료, 시스템 성능 모니터링 및 해상교통관리 시스템 유지보수 등 현장에서 시스템 전반의 상태를 체계적으로 진단하고 관리하는 데 활용될 수 있습니다. 또한 시스템 개발, 운영 표준화 자료 마련이나 장애 발생 시의 즉각적인 원인 진단, 개선안 도출을 위한 정책 자료로도 사용할 수 있습니다.
