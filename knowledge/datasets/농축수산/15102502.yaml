summary_user: 연도별 공익직불금 지급 결과를 신청 농업인의 연령대(20~90대 구간)별로 묶어 지급면적(천ha)과 지급액(억원)을 담은 전국 단위 집계 데이터다. 직불금이 농지 소유주가 아닌 실경작 농업인에게 지급되므로, 농정 분석가가 '직불금을 받는 경작 농업인은 주로 어느 연령대이고 고령층에 얼마가 지급되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령대 이름 매핑이나 같은 기관(농림축산식품부) 자료 기준으로만 이어 쓴다.
description_portal: 농림축산식품부_공익직불금 연령별 지급금액(Ministry of Agriculture, Food and Rural Affairs_Public Interest Direct Payment Amount paid by age)-  해당 데이터는 연도별 직불금 지급 결과를 바탕으로, 직불금 신청 농업인의 연령대별 지급 금액을 정리한 결과임- 20~90대 구간별 지금 통계로, 직불금 수령 농업인들의 주 연령대 현황을 파악할 수 있음- 직불금 지급은 농지 소유주가 아닌 실 경작 농업인으로, 경작 농업인 현황이라고 볼 수 있음
