summary_user: 전국 축산농장 수를 운영상태(OPER_STTUS_NM)·시도·시군구·읍면동·축종별로 집계한 통계로, 소·돼지는 축산물이력정보, 닭·오리 등은 방역정보를 바탕으로 한 건별 농장 목록이 아닌 농장 수 집계입니다. 방역 담당자나 축산 정책 분석가가 '우리 시군구에서 운영 중인 돼지 농장과 휴업 중인 농장은 각각 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구·읍면동 이름이나 축종 이름을 맞춰 연결해야 한다.
description_portal: 본 정보는 축산물품질평가원의 축산물이력정보(소, 돼지)와 가축위생방역지원본부(닭, 오리 등 기타 축종)의 축산농장 방역정보를 기반으로 구축된 전국 축산농장에 대한 운영상태별 현황 정보입니다. 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 상이할 수 있으니 데이터 활용 시 참고하시기 바랍니다. 이 데이터는 축산농장의 운영 상태와 사육 현황, 방역 상황 등을 파악하는 데 활용되며, 축산업 정책 수립과 방역 관리, 농업 통계 분석에 중요한 기초 자료로 기능합니다. 농림축산식품부는 해당 정보를 통해 축산업의 효율성과 투명성 향상에 기여하고자 합니다.
