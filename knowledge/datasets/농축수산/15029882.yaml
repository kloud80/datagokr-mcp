description_portal: 본 데이터는 경기도 가평군 관내 가금류 농장 현황을 수록한 자료입니다. 항목에는 시군명, 농장명, 축종명, 상세구분, 사육두수, 소재지 도로명주소 및 지번주소, 위도, 경도, 데이터기준일자 등이 포함되어 있으며, 닭·오리·칠면조 등 가금류 축산업 관련 정보를 제공합니다. 본 자료는 가평군 축산업 관리, 방역 대책 수립, 가금류 사육 현황 파악 등에 활용되며, 가축 질병 예방, 축산물 유통 관리, 축산 정책 수립에 기초자료로 유용하게 사용됩니다. 또한 위치 기반 정보를 통해 농장 분포를 분석하거나 GIS 기반 방역 시뮬레이션 등에도 활용 가능합니다. 관련 정보는 가평군 대표홈페이지 사전정보공표를 통해 추가로 확인할 수 있습니다.
