description_portal: '경기도 평택시 내수면의 어업권 현황으로 기준년도, 면허건수, 어업종류, 어구수, 어업인수 등의 항목을 제공합니다. 어업권 현황은 해조류, 패류, 어류 등 다양한 어종의 양식 및 어획에 관한 권리 상태를 나타내는 정보로, 이 정보를 활용하여 지역별 어업 특성, 어획량 변화, 어업 종사자 현황 등을 파악하여 효율적인 어업 정책을 수립하는 데 활용될 수 있습니다. 또한 어업 활동 지원, 어촌 경제 활성화, 환경보호 정책수립 등의 다양한 분야에서 활용할 수 있습니다. 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시청 항만수산과(031-8024-8961)'
