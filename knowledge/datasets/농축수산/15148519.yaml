description_portal: 이 데이터는 해양수산부에서 바다목장효과조사관리에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 단위노력어획어초구개체수, 단위노력어획어초구생체량, 단위노력어획대조군종수, 단위노력어획대조군개체수, 단위노력어획대조군생체량, 부착생물어초구종수 데이터로 구성되어 있습니다.본 데이터는 바다목장효과조사관리 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.바다목장효과조사란 바다목장 사업의 경제적 및 수산자원 증대 효과를 과학적으로 분석하고 평가하는 활동을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.목장번호는 '바다목장 효과조사 관리', '바다목장 어장조성 관리', '바다목장 어장조성 좌표', '바다목장 기본계획' 데이터의 목장번호 컬럼과 매칭 될 수 있습니다.
