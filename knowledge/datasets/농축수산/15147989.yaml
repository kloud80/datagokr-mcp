summary_user: 정해진 관측선·지점(정선·정점)을 따라 선박으로 잰 수온·염분·용존산소·영양염 등을 관측일시와 수심별로 담은 건별 원천 파일로, 전국 184,956행이 2000-01-04부터 2020-12-22까지 들어 있다. 해양 수질·수온 변화를 분석하는 연구자나 해양 정책 담당자가 특정 해역의 수심별 수온·염분 추이를 볼 때 쓴다. 위도·경도 좌표가 조인 키라서 좌표 기반의 다른 해양 데이터와 공간적으로 이어 쓸 수 있고, 정선·정점 코드표나 별도 관측소 키는 필드에 명시돼 있지 않다.
description_portal: 이 데이터는 해양수산부에서 정선해양관측정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 해역, 정선, 정점, 위도, 경도, 관측일시, 관측수심, 수온, 수온 QC Flag, 염분, 염분 QC flag, 용존산소 , 용존산소 QC Flag, 인산염인, 아질산질소, 질산질소, 규산규소, 투명도, 기압, 조사선 데이터로 구성되어 있습니다.본 데이터는 정선해양관측정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.정선해양관측정보란 정해진 해양 관측선과 지점을 따라 선박을 이용해 해수의 물리적, 화학적, 생물학적 특성(수온, 염분, 용존산소 등)과 기상요소를 조사하고 그 결과를 제공하는 정보를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
