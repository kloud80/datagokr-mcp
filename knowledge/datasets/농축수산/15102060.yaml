summary_user: 국립원예특작과학원이 올리는 원예특용작물 가격동향 자료를 게시글 단위(목록·상세)로 담으며, 각 글은 제목·등록일자와 첨부파일 이름·URL로 이루어진 전국 단위 비공간 자료입니다. 식자재 구매자나 유통업 분석가가 배추·양파·사과·느타리버섯·장미 같은 품목의 가격이 전주·전월·전년보다 얼마나 올랐는지 정리한 동향 보고서를 찾을 때 씁니다. 응답에 전역 조인 키가 없으므로 aT KAMIS 도매가격 등 다른 가격 데이터와는 품목 이름을 맞추는 방식으로 이어 쓰고, 기관마다 품목코드가 달라 코드 매핑이 필요합니다.
description_portal: '농촌진흥청 국립원예특작과학원에서 서비스중인 원예특용작물의 전주, 전월, 전년 대비 증감률 가격동향 정보를 조회할 수 있는 서비스로 원예특용작물가격 동향 목록과 상세정보를 제공한다 .대상품목으로는 채소 : 배추, 무, 양파, 파, 시금치, 상추, 깻잎, 고추, 토마토, 메론, 수박과수 : 바나나, 사과, 배특작 : 버섯(느타리, 새송이, 팽이), 수삼화훼 : 장미, 백합, 호접란(*자료출처: aTKamis( 도매가격 ), 화훼(장미, 백합, 호접란)는 양재동 도매가격 인삼은 금산군청 산지시장가격 버섯(표고,양송이) 서울농수산식품공사 도매가격)'
