summary_user: 우리나라 주변 해역에서 기상청·국립해양조사원·해양수산부 등이 운용하는 관측장비로 잰 파랑 값을 관측지점·관측일시별로 담은 파일 데이터로, 최대파고·유의파고와 각 주기, 첨두주기, 파향을 담으며 전국 범위의 약 173MB zip 파일로 받는다. 항만·해양구조물 설계자나 해양 안전 분석가가 '특정 해역에서 유의파고가 일정 높이를 넘은 날이 계절별로 얼마나 되나' 같은 파랑 변동 추세를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 관측 지점 식별자(관측아이디)를 같은 기관의 관측소 코드·지점 목록과 이름이나 코드로 맞춰 위치 정보와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 기상청, 국립해양조사원, 해양수산부등 기관에서 설치 운용하고 있는 관측장비를 통해 우리나라 주변 해역에서의 관측한 파랑자료 전체 데이터를 제공하기 위해 수집되었습니다.  본 데이터의 주요 내용은 관측지점 코드, 지점명, 관측일시, 파고, 주기, 파향 등 해역별 다양한 파랑관측 값으로 구성되어 있습니다.  본 데이터는 항만 및 해양구조물의 설계와 안전점검, 해양 재난 대응 계획 수립, 해상 교통운항 시 안전성 평가, 해양 기상 연구와 통계 분석, 해역별 파랑변동 추세 분석 등에 활용될 수 있습니다.
