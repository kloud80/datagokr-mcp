summary_user: 해양수산부가 해저 지형의 수심 변화를 등고선 형태로 나타낸 수심분포도를 공간정보 일련번호와 공간정보(도형) 값으로 담은 전국 범위 파일 데이터이며, 포털에서 받은 csv는 약 37KB 규모입니다. 해상풍력 등 해양공간 입지를 검토하는 사업자나 분석가가 '이 해역의 수심이 대략 얼마인가'를 GIS 도구에서 레이어로 겹쳐 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 해양용도구역·보호구역 등 다른 해양공간 레이어와는 속성 키가 아니라 공간 중첩으로 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 수심분포도에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 공간정보 데이터로 구성되어 있습니다.본 데이터는 수심분포도 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.수심분포도란 해저의 지형적 특징을 보여주는 등고선 지도이며, 바다나 해저의 수심 변화를 나타낸 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.*해당 데이터는 공간정보 데이터로 gis 툴을 이용하여 지도에서 레이어로 확인하실 수 있습니다.
