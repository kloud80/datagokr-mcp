description_portal: '산불상황관제시스템에서는 산불 발생 시 소중한 생명과 자산을 보호하고, 초기 진화를 위한 대응체계를 강화하기 위해, 전국에 설치된 소화시설 정보를 체계적으로 수집·관리하고 있으며, 이를 공공데이터로 제공합니다.문화재, 전통사찰, 휴양림, 수목원, 공원, 목재체험장, 주요 기반시설 등 산림과 밀접한 연관이 있는 다중 이용시설 및 보호가치가 높은 시설들을 중심으로 현장에 설치된 소화시설 위치와 특성을 관리하고 있습니다.제공되는 주요항목소화시설 주소: 행정구역 단위로 정확한 위치를 제공하여 빠른 접근 가능보호 대상물: 해당 소화시설이 보호하고자 설치된 대상(문화재, 전통사찰 등)을 명시관리 기관: 소화시설 유지관리 및 점검 책임이 있는 기관 정보경위도 좌표: GPS 기반 정밀 위치 정보를 통해 산불상황 지도에 연계 활용 가능'
