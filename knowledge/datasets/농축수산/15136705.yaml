summary_user: 농림축산식품부 농식품 공공데이터 포털에 올라 있는 데이터셋의 메타정보를 데이터셋 한 건당 한 행으로 담는다(아이디, 한글명, 정보 시스템명, 키워드 3개 등), 범위는 전국·비공간이다. 분석가나 담당 공무원이 "농산물 유통 가격(KAMIS 등) 관련 데이터셋이 포털에 어떤 이름과 시스템으로 올라 있는가"처럼 농업·농촌 분야 공공데이터 현황을 파악하고 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 데이터셋 이름이나 같은 기관의 데이터셋 아이디를 맞춰 보는 방식으로만 연결한다.
description_portal: 본 데이터는 농림축산식품부에서 제공하는 농식품 공공데이터 포털 내 데이터셋의 메타정보를 포함합니다. 데이터셋 명칭, 고유 아이디, 분류체계, 주요 키워드와 상세 설명 등 다양한 항목을 체계적으로 수록하였습니다. 이를 통해 농업 및 농촌 분야에서의 공공데이터 현황 파악과 관리에 기초 자료로 활용됩니다. 또한 정책 수립과 연구 분석에 필요한 데이터 정보 비교 및 평가에 도움이 됩니다. 단, 정보 수집 범위와 주기의 차이로 실제 현장 정보와 상이할 수 있으니 데이터 활용 시 참고하시기 바랍니다. 본 데이터는 농림축산식품부의 데이터 기반 행정 지원과 정책 개발을 목적으로 합니다.
