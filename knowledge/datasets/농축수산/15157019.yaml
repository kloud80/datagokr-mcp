description_portal: '구리농수산물도매시장의 청과부류를 취급하는 도매시장법인 및 공판장에는 농협공판장, 구리청과(주), (주)인터넷청과가 있습니다.청과부류는 전자경매를 통해 생성된 데이터를 실시간 경매정보, 정산자료로 각 도매법인 서버에 저장하며, 해당 데이터는 구리농수산물공사 서버로 전송하여 도매법인 자료를 수집하고 있습니다.요청하신 자료는 2016년 8월 1일부터 31일까지의 복숭아 경매 시간이 포함된 실시간 자료입니다.[친환경여부], [재경매여부]. [여러번 입찰중 최고가]는 제공 자료에서 제외합니다.공공데이터포탈에서 [구리농수산물공사 경매 데이터] 또는 [복숭아 낙찰내역 실시간 정보] 로 검색하여 활용해주시기바랍니다.■ 실시간 경매: https://www.gamaco.co.kr/realTime/realTimeAuction/main■ 법인별 경락가: https://www.gamaco.co.kr/corpAuction/main■ 데이터 설명- 데이터 컬럼 수: 14개- 데이터 컬럼 목록: 경매일자,법인명,원표번호,품목코드,품종명,품질등급,규격,단위,사이즈,포장상태,낙찰시간,낙찰가,낙찰자코드,낙찰자'
