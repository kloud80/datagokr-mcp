description_portal: '인천광역시 중구 관내에 위치한 식육포장처리업에 대한 데이터 입니다.파일명 인천광역시_중구_ 식육포장처리업파일내용 업종명, 상호, 소재지 등 제1조(목적) 이 법은 축산물의 위생적인 관리와 그 품질의 향상을 도모하기 위하여 가축의 사육ㆍ도살ㆍ처리와 축산물의 가공ㆍ유통 및 검사에 필요한 사항을 정함으로써 축산업의 건전한 발전과 공중위생의 향상에 이바지함을 목적으로 한다.제22조(영업의 허가) ① 제21조제1항제1호부터 제3호까지 및 제3호의2에 따른 도축업ㆍ집유업ㆍ축산물가공업 또는 식용란선별포장업의 영업을 하려는 자는 총리령으로 정하는 바에 따라 작업장별로 시ㆍ도지사의 허가를 받아야 하고, 같은 항 제4호에 따른 식육포장처리업 또는 같은 항 제5호에 따른 축산물보관업의 영업을 하려는 자는 총리령으로 정하는 바에 따라 작업장별로 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장의 허가를 받아야 한다. 축산물 위생관리법 시행령 제21조(영업의 세부 종류와 범위) 법 제21조에 따른 영업의 세부 종류와 그 범위는 다음 각 호와 같다.4. 식육포장처리업: 포장육 또는 식육간편조리세트(자신이 절단한 식육을 주원료로 하여 만든 것으로 한정한다)를 만드는 영업'
