summary_user: 2025년 수원·춘천·전주·밀양 4개 지역에서 채취한 콩 시료의 RNA 시퀀싱 결과를 TPM으로 정규화한 유전자 발현량을 담은 가공 데이터로, 행은 유전자(feature_name)이고 열은 2025년 7월 7일부터 10월 6일까지의 채취일별 시료입니다. 연구자나 AI 개발자가 콩 생육 기간에 어떤 유전자 발현 변화가 불량환경이나 병해충 발생보다 앞서 나타나는지 확인하고, 조기 예측 모델을 학습·검증하는 데 씁니다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어, 기상·토양·병해충 이력 자료와는 채취일과 지역을 기준으로 직접 맞춰 이어야 합니다.
description_portal: 이 데이터셋은 2025년 수원·춘천·전주·밀양 4개 지역에서 채취한 콩 시료의 RNA 시퀀싱(RNA-seq) 결과에, 동일 시기·지역의 기상·토양 정보와 NCPMS 병해충 발생 이력을 융합하여 구축한 농작물 생체정보 데이터입니다. 각 샘플은 TPM으로 정규화된 유전자 발현량과 병해충별 발생 유무(one-hot 라벨)를 포함하며, 콩의 전 생육 기간에 대한 불량환경·병해충 조기 예측 AI 모델의 학습·검증·테스트용으로 활용됩니다.* 데이터 라벨링 내역 및 메타데이터 는 FILE 탭 참조* 구축된 학습 데이터 중 토양, 기상, 병해충 발생이력 정보 저작권 변경금지(CC-ND)에 해당하여 이를 제외하고 생체정보(유전자 발현 특성)만 제공합니다.
