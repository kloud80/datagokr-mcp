summary_user: 도매시장에서 거래되는 농산물의 포장 유형을 포장코드(CODEID)와 포장명으로 짝지어 담은 전국 단위 코드표로, 건별 거래 원천이 아니라 참조용 분류 목록이다. 도매시장 거래·경락 데이터를 분석하는 사람이 '이 거래 기록의 포장코드가 상자인지 망인지' 같은 질문에 답하려고 코드를 이름으로 풀 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 같은 기관(data.mafra.go.kr)의 도매시장 거래 데이터와 포장코드 값을 맞추거나 이름으로 매핑해 이어 쓴다.
description_portal: 농림축산식품부는 도매시장에서 거래되는 농산물의 포장 정보를 제공하는 OPEN‑API 서비스를 운영합니다. 본 데이터는 포장코드와 포장명으로 구성되어 있으며, 이를 통해 농산물의 포장 유형 및 분류 체계를 파악할 수 있습니다. 포장 정보는 농산물 유통의 효율성을 높이고, 거래 실적 분석 및 정책 수립에 필요한 기초 자료로 활용됩니다. 또한, 표준화된 포장 코드를 통해 데이터의 일관성과 정확성을 높이며, 농업 통계 수집 및 유통망 구조 파악에 기여합니다. 해당 데이터는 농산물 유통의 투명성과 효율성 향상을 위한 핵심 자료로 기능합니다.
