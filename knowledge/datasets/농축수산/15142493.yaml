summary_user: IPCC 6차 평가보고서 기후변화 시나리오를 따른 지역 해양기후 수치모델로 전망한 해수면 상승 높이를 시나리오·지표 구분별로 격자 위·경도 지점 단위로 담으며, 전망 기간은 2015년부터 2100년까지이고 범위는 전국 연안 해역이다. 지자체·연안 관리 담당자나 기후 분석가가 '우리 해안 지역은 특정 기후 시나리오에서 2100년까지 해수면이 얼마나 오르나'를 확인해 연안 기반시설·도시계획 검토에 쓴다. 공통 조인 키는 없어 위도·경도 좌표를 기준으로 행정구역 경계나 연안 시설 위치 데이터와 공간 결합해 쓰고, 같은 기관(국립해양조사원)의 조위 관측 자료와는 좌표나 관측소 매핑으로 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 IPCC 6차 평가보고서의 기후변화 시나리오를 따른 지역 해양기후 수치예측모델을 기반으로 전망된 해수면 상승 예측정보를 제공하기 위해 수집한 데이터입니다.  검색대상 위치의 최대/최소 위·경도 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 2015년부터 2100년까지 전망된 상승 해수면 높이 등 정보로 구성되어 있습니다.  본 데이터는 해수면 상승에 따른 연안 관리, 해양환경 모니터링, 기후변화 영향 분석, 해안을 따라 기반시설 및 도시계획 수립 등에 활용될 수 있습니다. 또한, 기후 시나리오별 해수변화 예측자료로 활용하여 연구 및 정책자료 작성에도 이용될 수 있습니다.
