description_portal: '광주광역시 관내 축산물 가공업 중 유가공업의 식품안전과 관련한 HACCP(안전관리인증기준) 인증 업소 현황입니다.위해분석과 중요관제점(HACCP: Hazard Analysis and Critical Control Points) 또는 단순히 해썹은 생산-제조-유통의 전과정에서 식품의 위생에 해로운 영향을 미칠 수 있는 위해요소를 분석하고, 이러한 위해 요소를 제거하거나 안전성을 확보할 수 있는 단계에 중요관리점을 설정하여 과학적이고 체계적으로 식품의 안전을 관리하는 제도입니다.시민들의 먹거리 안전과 직결되는 핵심 정보를 담고 있으며, 세부 항목으로는 해당 축산물을 생산하는 안전한 업체명과 안전성을 인증받은 구체적인 적용품목이 명시되어 있습니다. 또한, 업체의 정확한 위치를 파악할 수 있는 소재지도로명주소와 함께, 해당 시설이 공식적으로 인증을 받았음을 증명하는 고유한 인증번호, 철저한 심사를 거쳐 최초로 승인된 날짜를 나타내는 최최인증일, 그리고 현재 인증의 유효성을 체크할 수 있는 인증종료일 등의 필수적인 항목들을 체계적으로 제공합니다. 이를 통해 소비자는 물론 유통 관계자들까지 광주 지역 유가공품의 위생 상태와 신뢰도를 한눈에 명확히 파악하고 검증할 수 있는 유용한 지표로 활용할 수 있습니다.'
