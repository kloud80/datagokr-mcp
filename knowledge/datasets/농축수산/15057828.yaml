summary_user: 경기도 내 수입 사료를 판매하거나 단순 재포장하는 업체(소)의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 시군명·인허가일자·영업상태·폐업일자·주소·WGS84 좌표·소재지면적·종업원수를 포함한다. 축산 농가나 사료 유통업자가 '우리 시군에서 지금 영업 중인 수입 사료 업체는 어디인가'를 확인하거나, 분석가가 시군별 수입 사료 업체 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군 코드·시군명(SIGUN_CD)이나 주소·좌표로 다른 경기도 사료 제조업 현황(보조사료·단미사료 등)이나 지도 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 수입 사료 제조업체의 인허가 현황을 제공하며, 수입된 사료를 판매하거나 단순 재포장하는 업체(소)에 관한 정보를 담고 있습니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘우편번호’, ‘WGS84 위도·경도’, ‘소재지면적’, ‘총종업원수’, ‘축산물가공업구분명’, ‘축산업무구분명’ 등이 포함됩니다. 이를 통해 사료 제조업체의 위치, 운영 상태, 규모, 인력 현황 등을 확인할 수 있으며, 수입 사료 시장의 분포 및 공급 체계를 분석하는 데 유용합니다. 데이터는 경기도 31개 시군 단위로 제공되며, 축산업 발전 정책 수립, 가축 사료 공급망 관리, 지역별 사료산업 분포 연구, 안전 관리 및 품질 관리 점검 자료로 활용될 수 있습니다. 또한 보조사료, 단미사료 등 다른 사료 제조업 현황 데이터와 비교하여 수입 사료 산업의 특성을 파악하고 농축산업 발전 전략을 수립하는 데 기초자료로 유용합니다.
