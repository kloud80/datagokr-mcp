summary_user: 특별긴급관세를 부과할 수 있는 농림축산물 품목을 품목(HS코드) 단위로 정리한 목록으로, 연도·순번·HS코드·한글 품명을 담고 범위는 전국·비공간이다. 연구자나 수입업자가 특정 수입 농산물이 수입 급증이나 가격 하락 때 긴급관세 대상이 되는지 확인하고 품목별 수입 동향을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 HS코드(HSK)나 품명으로 수입 통계와 이어 쓰며, KAMIS·도매시장·KOSIS와는 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 해당 데이터는 국내외 가격차에 상당한 율로 양허한 농림축산물의 수입물량이 급증하거나 수입가격이 하락하는 경우에 특별긴급관세를 부과할 수 있는 품목 현황에 관한 자료입니다. 주요 항목으로는 HS코드(HSK), 한글 품명, 영문 품명, 개방연도가 포함되어 있습니다. 이를 통해 수입 통계와 관세 정책을 연계 분석할 수 있습니다. 해당 데이터는 농림축산물 시장의 안정적 수급 관리와 가격 변동에 따른 국내 생산자 보호를 목적으로 활용될 수 있으며, 정책 입안자와 연구자, 유관 기관이 품목별 수입 동향을 모니터링하고, 필요한 경우 신속한 긴급관세 조치를 검토할 수 있는 기초 자료로 활용됩니다. 이를 통해 국내 농림축산물 산업의 경쟁력 유지와 수입 시장의 변동성 대응 전략 수립에도 도움을 줄 수 있습니다.
