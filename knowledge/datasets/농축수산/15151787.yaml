summary_user: 전국 5대 도매시장의 도매가격과 23개 도시 전통시장·대형마트의 소매가격을 조사일·시장·품목·품종·등급별로 한 건씩 담은 일별 가격조사 원천 데이터로, 포털 설명상 1996년부터 2025년 8월까지 도매 76품목, 소매 91품목, 친환경 52품목을 다룬다. 소비자나 유통업자가 '특정 수산물·농산물의 도매가와 소매가가 지역별로 얼마나 차이 나고 최근 어떻게 변했나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 품목코드·시장코드·시도코드는 같은 기관(KAMIS 계열) 코드끼리만 맞추고 외부 데이터와는 품목명·지역명 매핑으로 잇는다.
description_portal: '• (개요) 국내 농수축산물의 도매 76품목 118품종, 소매 91품목 135품종, 친환경 농산물 52품목 54품종에 대한 일자별 도ㆍ소매 가격조사 데이터• (컬럼) 조사일자, 시장명, 시도명, 시군구명, 품목명, 품종명, 도소매조사 구분, 등급명, 산지출하단위크기, 산지출하단위명, 도매출하단위크기, 도매출하단위명, 소매출하단위크기, 소매출하단위명 등• (축적기간) 1996년부터 2025년 8월까지 약 30년간 매일 조사된 농수축산물 가격정보  ※ 단, 기간별로 조사 품목 및 품종 상이• (지역분포) 전국 5대 도매시장의 중도매인 판매가격(도매가격) 및 23개 지역의 전통시장, 대형마트별 소매가격 제공※ 도매가격(5개 도시) : 서울, 부산, 대구, 광주, 대전  ※ 소매가격(23개 도시) : 서울, 인천, 수원, 고양, 용인, 성남, 춘천, 강릉, 대전, 천안, 세종, 청추, 광주, 순천, 전주, 대구, 포항, 안동, 창원, 김해, 부산, 울산, 제주'
