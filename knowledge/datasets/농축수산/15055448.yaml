description_portal: 전북특별자치도 순창군 축산물 판매업체(식육판매업, 우유류판매업, 식용란수집판매업, 축산물유통전문판매업, 식육포장처리업 등) 현황(상호명, 주소, 연락처)에 관한 사항입니다.- "축산물"이랑 식육,포장육,원유(原乳)ㆍ식용란(食用卵)ㆍ식육가공품ㆍ유가공품ㆍ알가공품을 말합니다.- “식육(食肉)”이란 식용을 목적으로 하는 가축의 지육(枝肉), 정육(精肉), 내장, 그 밖의 부분을 말합니다.- “포장육”이란 판매(불특정다수인에게 무료로 제공하는 경우를 포함한다. 이하 같다)를 목적으로 식육을 절단[세절(細切) 또는 분쇄(粉碎)를 포함한다]하여 포장한 상태로 냉장하거나 냉동한 것으로서 화학적 합성품 등의 첨가물이나 다른 식품을 첨가하지 아니한 것을 말합니다.- “원유”란 판매 또는 판매를 위한 처리ㆍ가공을 목적으로 하는 착유(搾乳) 상태의 우유와 양유(羊乳)를 말합니다.
