description_portal: '“그레이인프라”(Grey Infrastructure)란 일반적으로 자연 기반 인프라인 “그린 인프라”(녹지, 자연 친화적 요소) 대비, 건물·도로 등 인간이 만든 구조물 위주 인프라를 말하는 경우가 많으며 본 데이터는 산림과학원에서 조사한 관악, 제주, 고양, 기장, 평창, 횡성 등 지역의 관측소 주변 그레이인프라 조사정보에 대한 데이터로 다리, 나지, 건물, 하천, 도로정보를 제공하고 있음.* 활용가능 분야: 1. 도시계획/인프라 계획 시 기존 건물·도로망 파악 2. 환경 영향 평가 (도로 또는 건물로 인한 환경 변화 분석) 3. 미세먼지나 열섬(Heat Island) 효과 분석4. 재해 대비 및 복구 계획 5. GIS 기반 시각화 및 공간분석'
