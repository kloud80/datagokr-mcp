description_portal: 해당 데이터는 한국해양교통안전공단이 2025년도에 수행한 어선검사 현황을 정리한 자료이다. 주요 항목으로는 어선의 총톤수, 길이, 너비, 깊이, 선질, 용도, 세부용도, 선적항 등이 포함되어 있으며, 어선의 제원 및 용도에 관한 기본 정보를 제공한다. 본 데이터는 어선의 기본적 특성과 활용 목적을 파악하는 데 활용될 수 있으며, 어선 관련 통계 분석, 해양교통 정책 수립, 민원 응대 등 행정업무의 기초자료로 참고할 수 있다. 다만, 검사 합격 여부, 부적합 사항, 세부 검사결과 등은 포함되어 있지 않으므로 개별 어선의 검사결과 확인이나 법적 증빙자료로 활용하기에는 한계가 있다. 본 데이터의 대상기간은 2025년 1월 1일부터 2025년 12월 31일까지이며, 데이터 기준일은 2026-06-17이다.
