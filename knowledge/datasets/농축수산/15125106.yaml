summary_user: 숲길 안내시설(등산로 입구·봉우리·안내소)의 관심지점(POI)을 건별로 담은 API로, 지점 식별자·숲길명·위경도·해발고도·장소 설명을 제공한다. 탐방객이나 등산앱 개발자가 "이 숲길의 입구와 안내소는 어디에 있는가"를 지도에 표시하거나 코스 안내에 쓴다. 숲길식별자(frtrlId)로 같은 센터의 숲길 정보와 이어 쓸 수 있고, 위도·경도(lat/lot)를 좌표 키로 삼아 다른 지도·GIS 데이터와 겹쳐 쓴다.
description_portal: '이 데이터는 한국등산·트레킹지원센터에서 2023년 11월 23일에 등록하여 제공하는 오픈API 서비스로, 숲길 안내시설(POI) 정보를 실시간으로 조회할 수 있습니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 데이터추출일시 등의 주요 속성을 호출할 수 있으며, 트레킹 코스 안내, 지도 기반 위치표시, 모바일 등산앱 연동, GIS 분석 등 다양한 활용 목적에 적합하며 숲길 탐방객의 안전·편의 서비스 향상, 공공 지도 서비스 고도화, 관광·환경 데이터 융합 분석 등에 폭넓게 활용될 수 있습니다.(제약사항 : 제주특별자치도 지역은 현장조사 미시행으로 정보 없음)'
