description_portal: 이 데이터는 연근해어업에 종사하는 동력 어선의 세력을 연도별, 업종별로 집계한 통계 자료입니다. 어업의 종류를 '근해어업'과 '연안어업'으로 구분하고, 각 연도별로 전체 어선의 수(척수), 총 톤수, 그리고 총 마력수를 기록하여 어선 세력의 규모와 동향을 다각도로 파악할 수 있도록 구성되어 있습니다. 이 자료는 전국 단위의 통계를 포함하며, 전북특별자치도의 데이터를 별도로 기입할 수 있는 구조를 가지고 있어 지역별 비교 분석의 틀을 제공합니다. 이는 수산업의 기반이 되는 어선 자원의 현황을 이해하고, 관련 정책 및 자원 관리 계획을 수립하는 데 중요한 기초 정보입니다.
