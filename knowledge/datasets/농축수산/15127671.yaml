description_portal: 이 데이터는 우리나라의 영해(국가가 직접적으로 관할하며 주권을 행사할 수 있는 해역)에 대한 관리를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 한국 영해의 공간정보 일련번호, 레이어 명칭, 분류내용, 좌표값을 포함한 공간정보 등으로 구성되어 있습니다.  본 데이터는 해양수산 정책 수립이나 영해 내 해양 자원 개발 및 보호, 해양 환경 관리 계획 수립 등에 활용될 수 있습니다. 또한 영해 관련 법률 검토, 해양 경계 설정 연구, 항해 및 수산업 활동의 허가·관리 기준 마련 등을 위한 기초 자료로 활용할 수 있습니다.
