description_portal: 이 데이터는 해양수산부에서 공유수면점용사용지자체협의에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공유수면점용사용관리기관명, 공유수면점용사용구역명, 공유수면점용사용피허가자협의내용, 공유수면점용사용피허가자위치내용, 공유수면점용사용최초허가일자, 공유수면점용사용허가일자, 공유수면점용사용면적, 공유수면점용사용목적내용, 공유수면점용사용투기수량공유수면점용사용채취수량, 공유수면점용사용허가시작일자, 공유수면점용사용허가종료일자, 공유수면점용사용이용금액, 공유수면점용사용유형내용, 공유수면점용사용설치인공구조물내용, 공유수면점용사용허가조건내용 데이터로 구성되어 있습니다.본 데이터는 공유수면점용사용지자체협의 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면점용사용지자체협의란 국가나 지방자치단체가 공유수면(바다, 하천 등 공공이 소유한 물이 있는 땅)을 매립하거나 그 위에 건축물을 짓는 등 점용·사용할 때, 다른 법령의 적용을 받는 시설(항만시설, 어항시설 등)과 관련이 있거나 그 시설을 관리하는 기관이 해당 지방자치단체에 속할 경우, 해당 지방자치단체와 미리 협의해야 한다는 의미입니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
