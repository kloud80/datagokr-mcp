summary_user: 국립농산물품질관리원이 안전성조사 때 채취한 농산물 시료의 중금속 분석결과를 시료 건별로 담은 전국 단위 누계 자료로, 품목명·수거단계(생산·유통)·재배양식·생산자·주소·재배면적·조사물량·등록일자·분석결과로 구성된다. 소비자나 유통업자가 특정 품목에서 중금속이 검출된 사례가 있었는지, 생산단계와 유통단계 중 어디서 수거된 시료였는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명이나 주소 같은 이름 기준 매핑으로만 이을 수 있고, KAMIS 등 가격 데이터와 연결하려면 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 안전성조사는 농산물의 생산·유통·판매 단계에서 농약 등 유해물질 안전성조사를 통해 부적합품의 시중 유통을 차단하여 안전한 농산물을 공급을 목적으로 도입되었으며, 농산물 중금속 검사는 안전성조사시 채취한 시료에서 중금속이 검출되는지 분석하는 것으로 본 정보는 국립농산물품질관리원에서 관리하는 생산, 유통단계에서의 농산물 중금속분석결과 누계 정보로서, 품목명, 수거단계, 재배양식, 생산지역, 재배면적, 조사물량, 등록일자, 분석결과 항목으로 구성된 데이터입니다. 농산물 안전성에 관한 사항 중 중금속과 관련된 사항에 관심이 많은 경우 유용한 정보가 될 것으로 기대됩니다.
