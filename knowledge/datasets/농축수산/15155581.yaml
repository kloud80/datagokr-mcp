description_portal: 농촌진흥청 농촌인적자원개발센터(EHRD) 시스템에서 제공하는 온라인 강의 콘텐츠풀 데이터는 농업 분야 학습자에게 제공되는 다양한 디지털 교육자료의 메타데이터를 체계적으로 관리하기 위해 구성된 정보 집합이다. 이 데이터는 동영상 콘텐츠와 PDF 기반의 비정형 자료로 이루어져 있으며, 각 교육 과정에 포함되는 강의의 기본적인 속성과 학습자가 학습 전후로 참고할 수 있는 핵심 정보를 포함한다. 주요 구성 정보는 크게 두 가지로 구분된다. 첫째, 콘텐츠 기본 정보로서 강의 제목, 콘텐츠 유형(동영상·PDF) 등이 포함되어 학습자가 어떤 형태의 학습자료를 접하게 되는지 일목요연하게 보여준다. 둘째, 학습 시간 정보가 포함되는데, 동영상의 경우 실제 재생 시간이 제공되고, PDF 콘텐츠의 경우 지정된 학습 시간이 포함될 수 있어 학습자가 전체 과정 소요 시간을 예측하는 데 도움을 준다. 이러한 콘텐츠풀 데이터는 과정 편성 및 관리 자동화, LMS 화면 구성, 학습 이용 통계 분석 등 다양한 교육 운영 기능의 핵심 기반으로 활용된다. 즉, EHRD 시스템 내에서 학습 콘텐츠를 구조화하고 제공하는 전 과정에 중심축 역할을 하는 필수 메타데이터 세트라고 할 수 있다.
