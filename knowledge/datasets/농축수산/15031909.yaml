description_portal: '- 전라남도 내 해역에 설치된 인공어초의 지역별, 설치년도, 유형별, 위치 정보 등을 제공하기 위한 공공데이터 자료입니다.- 인공어초는 어류나 해양생물의 서식·산란·먹이활동 등을 돕기 위해 인위적으로 해저에 설치하는 구조물을 말합니다.- 대한민국 「수산자원관리법」 제2조 및 관련 고시에 따라 공식 정의됨. 일반적으로 콘크리트, 철강, 섬유 강화 플라스틱(FRP), 폐선박 등을 활용하여 제작- 수산자원 조성 : 어류·패류·해조류의 서식처 및 산란장 제공- 생물 다양성 확대 : 갯녹음(해조류 고사), 서식지 파괴 등 환경문제에 대응- 어획량 증대 : 어초 주변에 어류가 모여 어업 생산성 향상- 해양 생태계 복원 : 자연초 파괴된 지역을 대체하거나 복원'
