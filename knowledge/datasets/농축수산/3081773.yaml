description_portal: 이 데이터는 해양수산부에서 등대문화유산 현황을 파악하고, 체계적으로 관리하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2019년말을 기준으로 등대문화유산으로 지정된 등대의 지정번호, 명칭, 소재지 상세주소, 등대의 수량 및 면적, 건립년도와 관할기관 정보로 구성되어 있습니다.  본 데이터는 관할 지자체 및 기관에서 등대문화유산 보존 정책 수립, 문화유산 관리 현황 분석, 해양유산 관련 교육자료 제작, 등대문화유산을 통한 지역 관광 연계 및 활성화를 위한 마케팅 전략 연구 등에 활용될 수 있습니다.
