summary_user: 통합경영체관리사업에서 농업경영체가 경작을 그만둔 농지(폐경농지)마다 사업년도·농지일련번호·대장구분·본번·부번과 폐경면적, 폐경사유, 실사 등으로 파악한 현재 용도(폐경사유비고)를 건별로 담은 전국 범위의 소규모 CSV 파일이다. 농지 정책 분석가나 농지 거래를 검토하는 사람이 특정 농지가 왜 경작에서 빠졌는지, 지금 어떤 용도로 쓰이는지 확인하는 데 쓴다. 전역 조인 키(PNU 등)가 없어 다른 필지 데이터와는 본번·부번 같은 지번 정보를 이름·코드로 맞춰 연결해야 하며, 같은 사업년도 안에서는 농지일련번호로 동일 농지를 묶는다.
description_portal: 농림축산식품부에서는 농지폐경사유정보정보를 제공합니다.본 정보 제공 데이터는 사업년도, 농지일련번호, 대장구분, 본번, 부번, 폐경사유일련번호, 경영체폐경면적, 폐경사유, 폐경사유비고등의 정보를 포함하고 있습니다.본 제공자료는 통합경영체관리사업에서 폐경농지에 대한 사유를 확인 할 수 있는 데이터로 사업년도별 농지일련번호로 동일한 농지를 파악 할 수 있으며, 하위 본번 부번을 통하여 상세 폐경농지를 확인 할 수있습니다. 폐경사유 비고에는 실사 또는 기타경로로 파악한 현재 사용용도 등에 대한 내용이 있습니다.
