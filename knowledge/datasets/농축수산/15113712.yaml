description_portal: 국내 관광 활성화와 지역관광 수요 증가로 숙박업소에 대한 다양한 정보 제공 필요성이 대두되고, 농어촌 지역의 소득 창출 및 지역경제 활성화를 위한 민박업 육성 정책이 확대되며, 관광객의 편의성 향상과 투명한 숙박정보 제공에 대한 요구가 높아짐에 따라 충청남도 보령시는 관내 농어촌민박업소의 위치, 규모, 시설현황 등 관광객 숙박 선택에 필요한 종합적인 정보를 제공하고 있습니다.개방 데이터는 농어촌민박업소의 시도명, 시군명, 지번주소, 도로명주소, 민박업소명, 객실수, 주택면적, 위도, 경도, 용도지역, 데이터기준일자 등 총 11개 항목 234건의 상세 정보를 포함하고 있습니다.관광객·여행자는 목적지 인근 민박업소 정보 확인을 통해 숙박 계획 수립 및 예약에 활용하고, 관광업체·여행사는 지역별 숙박시설 현황 파악을 통해 관광상품 개발 및 패키지 구성에 활용하며, 지방자치단체·관광진흥기관은 관광 인프라 현황 분석 및 관광정책 수립, 민박업 지원 방안 마련에 활용할 수 있습니다.
