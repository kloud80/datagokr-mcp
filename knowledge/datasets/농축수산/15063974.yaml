description_portal: 한국마사회 서울, 제주, 부산경남, 영천 경마장에서 시행하는 경주에 대해 발매창구정보를 제공합니다.제공정보는 발매창구번호(betwindowNum), 경마장번호(racecourseName), 발매소명(betplaceName), 매장명(divisionName), 발매기유형명(winTypeName), 발매장비모델번호(betdeviceModelNum), 매장구분명(divisionTypeName) 자료입니다.) - 요청메세지에 경마장번호(race-01:지사 포함 서울 02:제주 03:부산경남 04:영천), 페이지 번호(pageNo)와 페이지 당 표출될 건수(numOfRows)를 이용하여 자료를 조회할 수 있습니다.※ 영천경마 시행 이후 요청메세지 경마장번호에 04를 입력시 영천경마 자료를 조회할 수 있습니다.
