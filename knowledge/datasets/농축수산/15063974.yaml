summary_user: 한국마사회 서울(지사 포함)·제주·부산경남·영천 경마장 경주의 마권 발매창구를 창구 단위로 담으며, 창구번호·발매소명·매장명·매장구분·발매기 유형·장비 모델번호를 제공한다. 경마 이용자나 분석가가 특정 경마장·발매소에 어떤 매장과 발매기 유형의 창구가 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 경마장명·발매소명 같은 이름 매핑이나 같은 기관(한국마사회)의 다른 데이터와만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와 코드로 바로 연결할 수 없다. 범위는 전국·비공간이라 좌표나 행정구역 단위 분석에는 따로 주소 매핑이 필요하다. 개발계정은 하루 3,000회 호출로 제한된다.
