description_portal: '한국농수산식품유통공사에서 관리하는 국영무역품목의 시장접근물량 수입계획량(톤)   * 국영무역 : 정부 지정기관(aT 등)이 TRQ 수입권을 갖고 수입하여 국내에 판매, 발생한 수입차익을 정부에 납부 - 농산물의 안정적인 물가 조절을 위해 국가간 협정을 통해 수입하는 품목별 도입물량으로 매년도 의무 수입물량의 정보를 제공하여     국민 및 소비자(실수요자)에게 필요한 농산물 품목의 수입물량을 제공하여 체계적인 입찰 및 수입권배분 스케줄 조정을 할 수 있도록 도움aTBid(한국농수산식품유통공사 비축농산물 전자입찰 시스템)에서 수집되는 데이터입니다.*aTBid:ATBID는 한국농수산식품유통공사(aT)가 운영하는 **농수산식품 입찰·계약 통합 플랫폼**으로, 공사의 각종 입찰 공고, 계약 관리, 전자계약 체결 등을 온라인으로 처리할 수 있도록 지원하는 시스템입니다.이를 통해 투명하고 효율적인 조달 절차를 보장하며, 공급업체와 공사 간의 편리한 소통 창구 역할을 합니다.또한 관련 서류 제출, 진행 현황 확인, 낙찰 결과 조회 등이 가능해 기업과 기관의 업무 부담을 줄이고 공정성을 높이는 데 기여합니다.'
