summary_user: 충주시 농수산물도매시장에 등록된 중도매인의 상호명·성명·전화번호·취급품목을 한 사람(업체)씩 담은 명부 파일(xlsx, 약 16KB)이다. 충주 도매시장에서 특정 품목을 다루는 중도매인이 누구인지, 연락처가 무엇인지 찾으려는 생산자·식자재 구매자나 지역 유통 구조를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키나 품목코드가 없어 다른 데이터와는 취급품목명·상호명 같은 이름으로만 맞춰 이어야 하며, KAMIS·도매시장 경락 가격 데이터와 연결하려면 품목명 매핑이 따로 필요하다.
description_portal: 본 데이터는 충청북도 충주시 소재 도매시장에 등록된 중도매인들의 현황을 제공하는 자료로, 상호명, 중도매인 성명, 전화번호, 취급품목 등의 항목으로 구성되어 있음. 중도매인은 도매시장 내에서 농수축산물 등의 유통을 중개·판매하는 주요 유통 주체로, 이 데이터를 통해 도매시장 유통 구조 및 품목별 판매자 정보를 확인할 수 있음. 해당 자료는 유통 경로 파악, 품목별 전문상인 분석, 소비자와 생산자의 직거래 연계, 도매시장 활성화 정책 수립 등 다양한 분야에서 활용될 수 있으며, 특히 농산물 유통 투명성 확보 및 시장 접근성 개선에도 기여할 수 있음.
