description_portal: 한국농수산식품유통공사의 정가수의매매예약거래시스템 내 등록되어있는 중도매인 주요 관심품목(품목 대분류, 중분류, 소분류 등) 정보 제공정가수의매매예약거래시스템은 농림축산식품부가 정가·수의매매 활성화를 통해 농산물 거래단위 규모화와 가격 변동성을 완화하기 위해 구축한 시스템입니다. 이 시스템은 농산물 거래의 투명성과 효율성을 높여 농가 소득 안정에 기여하는 것을 목표로 하며, 2014년 전자 예약거래시스템 오픈을 시작으로 모바일 시스템도 추가되었습니다. 농산물의 유통 과정에서 가격을 사전에 정해두고 거래를 예약하는 제도적 장치입니다.주요 목적은 농산물 가격 변동으로 인한 생산자와 유통인의 위험을 완화하고, 거래의 안정성과 투명성을 높이는 데 있습니다.
