description_portal: 이 데이터셋은 제주특별자치도 관내 읍·면·동 단위로 돼지를 사육하는 농가의 분포 현황을 집계한 공공데이터입니다. 각 행정구역별로 돼지 사육 농가 수, 지역별 농가 분포, 농가 당 가축 규모 등의 정보를 포함하고 있어, 지역별 축산업 구조와 분포 양상을 객관적으로 확인할 수 있습니다. 이 정보를 바탕으로 지역별 돼지 농가 집중도, 축산 자원 분포, 환경 관리 필요 지역, 축산 정책 타당성 평가, 지원 사업 계획 수립 등 다양한 행정 및 연구 목적에 활용할 수 있습니다. 또한, 농업 연구자나 정책 입안자, 축산 지원 기관 등이 제주지역 돼지 축산업의 현황을 분석하고 지속 가능한 축산업 관리 전략을 세우는 데 기초 자료로 활용될 수 있습니다. 데이터는 CSV 형식으로 누구나 무료로 다운로드 받고 사용할 수 있습니다.
