summary_user: 전국 토마토 스마트팜 시설별(시설ID)로 수집일마다 외부·내부 온습도, 일사량, CO2, 토양·양액 EC·pH 같은 환경 측정값과 난방기·커튼·환기팬 등 장치 작동 상태를 담은 시설원예 데이터다. 연구자나 농업 기업이 '하우스 내부 온도·CO2·양액 관리가 토마토 생육과 어떤 관계인가'를 분석하거나 생육 예측 모델을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 품목명을 매핑해 연결해야 하고, 가격 데이터(KAMIS 등)와 이을 때도 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 본 데이터는 지역별 토마토 작물의 스마트팜(시설원예) ICT 정보와 생육 정보를 융복합하여 분석할 수 있는 중요 자료입니다. 구체적으로는, 온도, 습도, 일사량, 풍량, 풍속, 토양정보와 같은 다양한 ICT 정보를 비롯하여 생장길이, 줄기직경, 엽장, 엽폭, 엽수, 개화군, 착과군, 그리고 열매수와 같은 생육 데이터를 포함하고 있습니다. 이러한 융복합 데이터는 작물의 생육 상태를 파악하고, 지속 가능한 농업을 위한 의사결정에 필수적인 기초 자료로 활용될 수 있습니다. 본 데이터는 연구자, 농업인, 그리고 농업 관련 기업 등 다양한 분야에서 농업 분야에 대한 AI 분석 및 예측 모델 개발에 유용하게 사용될 수 있으며, 이를 통해 농업 생산성을 향상시키고 효율적인 자원 관리를 도모할 수 있습니다.
