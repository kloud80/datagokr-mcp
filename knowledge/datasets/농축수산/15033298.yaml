summary_user: 한국마사회 서울·제주·영남(부산경남과 영천 합산) 경마장의 경주마 소유자인 마주 한 명당 한 행으로, 마주번호·마주명·입사일자, 총등록·취소·현보유 두수, 최근1년과 통산의 출주·1~3착 횟수와 착순상금을 담는다. 경마 분석가나 팬이 특정 마주의 최근 1년 성적과 상금, 보유 마필 규모를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 경주마·경주 성적 데이터와는 마주번호(owNo)나 마주명으로만 이어 쓴다.
limits: 다른 기관 데이터와 붙일 공통 코드가 없어 같은 마사회 코드나 이름 매핑으로만 연결한다. 비공간 데이터라 지역 분석에는 쓰지 않으며, 부문이 농산물 유통 가격으로 분류돼 있으나 내용은 경마 마주 정보라 가격 분석에는 맞지 않는다. 개발계정은 일 3,000회 호출 제한이 있다.
