summary_user: 산림식물 신품종의 품종보호 출원·등록 내역을 품종 한 건당 한 행으로 담은 전국 단위 파일로, 출원번호·작물명·작물분류·품종명칭·진행상태·출원일자·등록일자·등록번호·품종보호기간을 기록한다. 육종가·종묘업자나 분석가가 특정 수종·작물의 등록 품종이 무엇이고 그 권리가 언제까지 유지되는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작물명·품종명칭 같은 이름 매칭이나 출원번호·등록번호를 통한 같은 기관 자료 대조로만 이어 쓴다.
description_portal: 산림식물 품종보호 설정 등록현황에는 다양한 항목이 포함되어 있습니다. 가장 기본적으로는 해당 품종을 구분할 수 있는 출원번호가 기록되며, 이와 함께 어떤 식물에 관한 것인지 나타내는 작물명과, 그 작물이 속하는 작물분류 정보가 제공됩니다. 또한 각 품종에 붙여진 고유의 이름을 뜻하는 품종명칭이 적히고, 그 품종이 현재 어느 단계에 있는지를 확인할 수 있는 구분 및 진행상태가 함께 기재됩니다.더 나아가, 품종보호를 신청한 날짜를 의미하는 출원일자, 실제로 등록이 이루어진 등록일자, 그리고 부여된 등록번호가 차례로 나타납니다. 마지막으로, 그 품종이 법적으로 보호를 받을 수 있는 기간, 즉 품종보호기간도 명확히 표시되어 있어, 이해관계자가 언제까지 권리가 유지되는지를 확인할 수 있습니다.
