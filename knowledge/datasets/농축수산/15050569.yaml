summary_user: 전국 화훼 품목별 재배면적, 판매량(백만분), 판매금액(백만원) 등을 연도별로 담은 집계 통계로, 범위는 전국이고 지역 단위로 나뉜 공간 정보는 아니다. 화훼 농가·유통업자나 분석가가 "어떤 화훼 품목의 재배면적과 판매액이 해마다 어떻게 변하는가"를 살필 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목명이나 연도로 맞춰 이어야 하며, KAMIS·도매시장 가격 자료와 붙이려면 품목코드 매핑이 따로 필요하다.
