summary_user: 시도지방청이 허가한 공유수면 점용·사용 건을 건별로 담은 원천 파일로, 전국 20,211행에 관리기관·위치·목적·허가일·점유유형·면적 등이 들어 있다. 지역 개발이나 해상 시설 입지를 검토하는 분석가·행정 담당자가 특정 해역에 어떤 점용·사용 허가가 있는지 확인하는 질문에 쓴다. 주소(address)와 법정동코드(bjd_cd)로 다른 지역 데이터와 이어 쓰며, 해양용도구역 같은 해양공간 영역 자료와 지역 단위로 겹쳐 보는 데 맞다.
description_portal: 이 데이터는 해양수산부에서 공유수면 관리 및 매립에 관한 법률에 따라 시도지방청에서 점·사용 허가를 받은 공유수면 현황을 관리하고 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 관리기관, 위치, 목적, 허가일, 점·사용 유형 등 시도지방청별 공유수면 점용·사용 허가와 관련된 정보를 포함하고 있습니다.  본 데이터는 공유수면의 점용·사용 실태 파악, 허가 현황 분석, 정책 수립 시 지역별 공유수면 활용 현황 검토 등의 업무에 활용될 수 있습니다. 또한, 공유수면 관리 및 허가 절차 연구, 행정기관의 제도 운영 평가, 지역 개발계획 수립 과정에서 기초자료로 사용할 수 있습니다.
