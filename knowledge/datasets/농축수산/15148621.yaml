summary_user: 해양수산부가 지정한 준보전연안(보전이 원칙이나 휴양 등 환경친화적 소극 개발이 가능한 연안)을 구역별로 담은 공간정보 파일로, 전국 범위에서 연안용도 구분, 육역·해역 구분, 면적, 권역명·지역명, 공간정보(도형)를 함께 제공한다. 해상풍력·연안개발 사업자나 해양공간계획 분석가가 '이 사업 예정지가 준보전연안에 걸려 개발이 제한되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 용도구역·보호구역 데이터와는 권역명·지역명 같은 이름 매칭이나 공간정보 도형 중첩으로 연결한다.
description_portal: 이 데이터는 해양수산부에서 준보전연안에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 연안용도구분명, 육역해역구분명, 준보전연안면적, 준보전연안권역명, 준보전연안지역명, 공간정보 데이터로 구성되어 있습니다.본 데이터는 준보전연안 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.준보전연안이란 우수한 자연경관과 생태계를 보유하고 있어 보전이 원칙이지만, 휴양을 위한 소극적 개발 등 환경친화적 활용이 가능한 연안을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
