summary_user: 소 브루셀라병 검사 현황을 검사일자·축종과 시도·시군구·읍면동 이름별로 담으며, 검사 의뢰·결과·발생·강제 처분 규모를 농가 수와 두수로 나눠 싣는다(필드명 기준 해석, 범위는 전국). 방역 담당자나 연구자가 '어느 지역에서 브루셀라 양성 농가와 두수가 많고 처분이 얼마나 이뤄졌나'를 보고 취약 지역을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 행정구역 이름(시도·시군구·읍면동명)을 행정코드로 매핑하거나 같은 기관 자료와 이름으로 맞춰 잇는다.
description_portal: 해당 데이터는 지역별 소 브루셀라병 검사 현황을 제공하고 있습니다. 본 자료를 통해 지역별 브루셀라병 발생 분포와 방역 관리 수준을 객관적으로 파악할 수 있으며, 정부와 지자체가 추진하는 예방 접종 및 방역 정책의 효과성을 검증하는 데 활용할 수 있습니다. 또한 정책 담당자에게는 지역별 검사 실적과 양성률을 근거로 취약 지역을 선별하고 방역 자원을 효율적으로 배분하는 기초 자료가 되고, 연구자에게는 전염병 발생 추이와 확산 경로를 분석할 수 있는 실증 자료가 됩니다. 나아가 축산 농가에는 질병 예방의 중요성을 인식시키고 사육 관리 개선을 유도함으로써, 궁극적으로는 축산물 안전성 확보와 공중보건 향상에 기여하는 의미 있는 데이터라 할 수 있습니다.
