description_portal: aT센터에서 개최되는 전시, 박람회, 이벤트 등의 행사정보로 행사명, 주최사, 장소 및 참가비, 행사시작일, 종료일 등의 정보를 포함하고 있습니다. - aT센터에서의 행사 정보를 제공하며, 이에 대한 주최기관 또는 협회의 이름과 홈페이지 등의 연계 정보를 제공합니다. 펫, 식품, 경진대회 등 여러 행사가 aT센터에서 진행되고 있으며    연도별 행사의 시작일과 종료일을 정보로 제공하여 양재 aT센터에서 주최가 선호되는 행사들을 알 수 있습니다.한국농수산식품유통공사(aT)의 대표 홈페이지의 정보입니다.at.or.kr은 농수산물의 실시간 경매 정보, 유통·수급 통계, 수출입 뉴스와 지원 사업, FTA 및 민원 상담 등 다양한 정보를 제공하며, 보도자료·공시자료·결산서와 고객 참여 기능도 통합되어 있습니다. 또한 KATI, K-FOOD TRADE 등 연계 플랫폼으로의 접근도 원활하게 지원하여 농식품 유통과 수출 진흥의 종합 창구 역할을 수행합니다.
