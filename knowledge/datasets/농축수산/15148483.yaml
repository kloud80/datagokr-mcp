description_portal: '어도란 댐, 보 등 하천 구조물 등으로 인해 물고기가 상, 하류를 오르내리지 못하는 문제를 해결하기 위해 설치하는 인공 수로 입니다. 어도에는 현재 4개 형식 계단식어도, 아이스하버식 어도, 버티컬 슬롯식 어도, 도벽식 어도가 있습니다. 어도 설치 목적은 물고기의 이동, 산란, 서식권을 보장하고 하천 생태계의 연속성을 확보하여 생물다양성 보전 및 환경친화적인 하천 조성에 있습니다 어도 개보수 사업은 노후화된 어도의 기능저하(침식, 균열, 입구부 출구부 낙차 발생 등)으로 인한 어류 이동이 불가능한 경우어류의 자유로운 이동과 하천 생태계 복원을 위해 조사, 계획, 설계, 시공, 사후 모니터링 까지 체계적으로 어도를 관리 하는 활동이라 할 수 있습니다. 1. 어도 실태조사2. 어도 문제진단: 구조물 기능 저하 원인 파악3. 조치, 시정명령(해양수산부)4. 어도개보수 사업 계획 수립5. 어도개보수 사업 시행6. 어류 이동 모니터링 및 효과분석'
