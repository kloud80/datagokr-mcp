summary_user: 선박 통항 수역 가운데 지형·조류 같은 자연조건이나 교통량 때문에 사고 주의 경계해역으로 지정된 구역을 SHP 공간정보 파일로 담으며, 포털 설명상 해역별 명칭·관계법령·제개정일자·관계기관이 들어 있고 범위는 전국이다. 해운·물류 기업이 운항계획을 세울 때 '이 항로가 주의경계해역을 지나는가'를 확인하거나, 관계 기관이 항로 계획·해상교통 안전대책을 마련할 때 기초자료로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 해역 명칭 매핑이나 공간 중첩(다른 해양공간 용도구역 레이어와 겹쳐 보기)으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 선박이 통항하는 수역에서 지형조류 등 자연조건 및 교통량 등 사유로 지정된 사고주의 경계해역 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 주의경계해역의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해역의 명칭, 관계법령, 제/개정일자 및 관계기관 등 정보를 포함하고 있습니다.  본 데이터는 해운 및 물류 관련 기업에서 운항계획 수립 등 업무를 위해 활용할 수 있습니다. 또한, 관계 기관에서 항로 계획 수립, 해상 교통 관련 정책 연구, 안전관리 방안 마련 등 업무를 위한 기초자료로 활용할 수 있습니다.
