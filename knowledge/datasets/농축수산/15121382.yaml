description_portal: 이 데이터는 해양수산부의 항만가이드라인 항로(GIS)에 대한 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 지능형 해상교통정보시스템(바다내비)에서 도선사예선지원서비스(SV51)를 위한 항만 내 항로의 공간정보(GIS)로 구성되어 있습니다.항구의 명칭, 항로명, 수심, 좌표 등 정보를 포함하고 있습니다. 본 데이터는 항만 운영기관이 도선사와 예선사의 업무 지원을 위한 경로 관리, 내부 시스템 연계, 해상교통 안전 대책 수립에 활용될 수 있으며, 시스템 개발자 및 GIS 분석가는 항만 관련 서비스 개발에 참고자료로 활용할 수 있습니다.
