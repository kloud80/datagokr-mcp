summary_user: 한국 어선이 중국 배타적경제수역(EEZ)에서 조업하도록 받은 허가를 허가 건별로 담은 원천 파일(CSV 약 289KB)로, 허가년도·EEZ 허가번호·허가 기간과 상태, 어선명·한국어선번호·선적항·호출부호, 톤수·길이·엔진 동력·승무원수 같은 선박 제원, 최대허용어획량을 담는다. 어업 정책 담당자나 연구자가 '올해 중국 EEZ 입어 허가를 받은 한국 어선은 몇 척이고, 어떤 규모·선적항의 배들인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 어선 등록·허가 데이터와는 한국어선번호나 호출부호, 어선명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 해양수산부가 관리하는 한국 어선의 중국 EEZ 진입 허가 현황을 파악하고 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 허가년도, EEZ 허가번호, 어선 한자명, 선박 종류 코드, 어선 한글명, 어선 종류 내역, 한국 어선 번호, 선적항 한자명, 선적항 영문명, 호출 부호명, 최대 승무원수 등 정보로 구성되어 있습니다.  본 데이터는 어업 관련 인허가 현황 파악, 어선의 EEZ 내 조업 이력 관리, 한중 EEZ 관련 정책 수립 및 어업 통계 작성, 해양수산 분야 연구 등에서 활용할 수 있습니다.
