summary_user: 100대명산플러스에 포함된 명산의 기본정보(산식별자·산명·산코드·시도명·주소·위도·경도·해발고도)를 산 단위로 담은 API이며, 검증 시 전체 건수는 2건이었다. 등산·휴양 앱 개발자나 분석가가 특정 명산의 위치와 해발고도를 확인하는 질문에 쓴다. 주소(addrNm)와 좌표(lat)를 키로 지도·지역 데이터나 등산로·휴양 시설 데이터와 이어 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2023년 11월 24일에 등록하여 제공하는 오픈API 서비스로, 100대명산플러스에 포함된 명산의 기본정보를 조회할 수 있는 서비스입니다.API를 통해 산식별자, 산명, 산코드, 시도명, 주소명, 위도, 경도, 해발고도, 데이터추출일시 등의 속성을 호출할 수 있으며, 이를 활용해 명산 위치 기반 안내서비스, 등산코스 관리, 산악관광 콘텐츠 개발, GIS 지도 시각화, 지역별 명산 분포 분석 등 다양한 분야에서 활용이 가능하며 JSON+XML 포맷을 지원합니다.
