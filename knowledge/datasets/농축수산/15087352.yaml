summary_user: 농넷 수급관리 품목인 배추·무·건고추·양파·마늘의 도매·소매 가격을 조회일자·품목별로 담은 전국 단위 파일(CSV 약 398KB)로, 일일가격과 함께 전일·전순·전년·평년 가격과 비율, 7단계 가격 위기단계(상승심각~하락심각)를 담는다. 물가를 살피는 분석가나 식자재를 사는 사업자가 '지금 배추 도매가격이 평년보다 얼마나 높고 위기단계는 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 품목코드·품목명으로 KAMIS 일일도매가격 등과 맞춰 쓰되 품목코드가 KAMIS·도매시장·HS·KOSIS마다 달라 매핑이 필요하다.
description_portal: 농넷(www.nongnet.or.kr)에서 제공하고 있는 수급관리 품목(배추,무,건고추,양파,마늘)의 연간 수급상황 정보 - 매월 일단위의 도소매 일일, 전일, 전순, 전년, 평년가격 등을 제공주요 농산물 도매가격을 7단계(상승심각, 상승경계, 상승주의, 안정, 하락주의, 하락경계, 하락심각)로 나누어 현시점의 가격이 어느 정도 수준인지 파악 시에 활용각 품목별 상품 기준 및 무게 기준은 KAMIS  주요 농산물 일일도매가격(https://www.kamis.or.kr/customer/price/wholesale/garak.do)과 동일
