description_portal: 경기도 여주시의 가금류 농장에 대한 현황 데이터를 제공합니다. 본 데이터는 여주시 관내에서 닭, 오리, 칠면조 등 가금류를 사육하는 농가를 대상으로 하며, 농장명, 축종명, 사육 두수, 소재지 도로명 주소, 지번 주소, 위도, 경도 등의 항목으로 구성되어 있습니다. 이 데이터를 활용하면 각 농가의 정확한 위치와 사육 규모를 파악할 수 있으며, 축종별 사육 분포나 지역별 밀집도를 분석하는 데 유용합니다. 특히 고병원성 조류인플루엔자(AI) 발생 등 가금류 전염병에 대한 선제적 방역 대책을 수립하거나, 백신 접종 계획 수립, 농장 단위 출입통제 등 긴급 대응 체계를 마련하는 데 중요한 기초 자료로 활용할 수 있습니다
