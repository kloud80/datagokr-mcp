description_portal: '대전광역시 도축장에 대한 2026년 상반기 도축검사 실적 현황입니다. - 도축장 현황: 지역, 관할지역, 도축장명, 대표자, 주소 등으로 구성. - 도축상황 : 축종별 생체검사 두수 / 도살두수 / 허가두수 / 신고두수 / 생체중량 / 긴급도축  등에 대한 마릿수 및 생체중량 데이터를 확인할 수 있습니다. - 도축검사 폐기내역: 축종별 소화기 / 호흡기 / 순환기 / 비뇨, 생식기  / 기타 / 법정전염병 / 기생충 / 질병외 의 폐기건수와 중량, 그리고 전체 폐기 건수 및 폐기량을 알 수 있습니다. - 도축검사 폐기내역 : 도축검사를 통해 축종별로 폐기되는 건수와 폐기량 데이터 - 2026년 1월부터 6월까지의 도축검사 실적 확인 가능'
