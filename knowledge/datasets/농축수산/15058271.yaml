summary_user: 부산광역시 국제수산물도매시장에서 경매된 수산물의 가격을 도매법인별·경매일자별 품목 단위로 담으며, 품목명·규격·포장형태·등급·산지와 최고·최저·평균 가격을 제공한다. 수산물 유통업자나 물가 분석가가 "이번 주 부산 도매시장에서 고등어 한 상자 평균 경락가가 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 위판장·도매시장 가격 데이터와는 어종명이나 이 기관의 어종코드(fishCode)·법인코드(coCode)를 매핑해야 이어 쓸 수 있다.
description_portal: 농수산물유통 및 가격안정에 관한 법률에 의거하여 부산광역시 국제수산물유통시설관리사업소에서 유통되는 수산물에 대한 도매법인별, 경매일자별 품목, 수탁일자, 거래물량(kg), 물량비(%), 거래금액(원), 금액비(%)에 대한 정보를 제공하고 있습니다. ※ 추가로 제공되는 각종 수산물의 월별 주요반입품목과 출하지별 거래실적에 관한 정보는 국제수산물유통시설관리사업소 홈페이지에서 확인할 수 있습니다.
