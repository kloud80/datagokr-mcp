description_portal: 이 데이터는 해양수산부에서 가공상품관리에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 제품명, 상품명, 생산일자, 생산량, 생산단위, 생산단위명 데이터로 구성되어 있습니다.본 데이터는 가공상품관리 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.가공상품란 농산물, 축산물, 수산물 등의 원료에 식품첨가물을 가하거나, 원형을 알아볼 수 없을 정도로 변형시키거나, 혼합하는 등의 인공적인 과정을 거쳐 맛과 저장성을 높이고 소비하기 편리하게 만든 제품을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
