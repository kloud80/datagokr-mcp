summary_user: 해양수산부·기상청·국립해양조사원이 우리나라 주변 해역에 설치한 파랑 관측지점 77곳의 위치와 관측기관, 설치수심, 자료주기 등을 지점 단위로 담은 목록 파일이다. 항로 안전이나 연안시설의 파랑 영향을 살피는 분석가가 어느 해역에 파랑 관측지점이 있는지 찾는 질문에 쓴다. 지점 경도·위도(coord)를 키로 다른 좌표 기반 데이터와 공간적으로 겹쳐 쓰며, 지점 코드 같은 별도 식별 키는 필드에 없다.
description_portal: 이 데이터는 해양수산부 파랑관측망 관측지점의 위치와 관련 정보를 파악할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부, 기상청, 국립해양조사원에서 구축한 우리나라 주변 해역 내 파랑자료 수집장치의 설치 지점 위치정보로 구성되어 있습니다. 관측기관, 좌표, 자료주기, 관측이름 등이 포함되어 있습니다.  본 데이터는 연안 및 해역 해양관측 사업의 연구 자료, 해양 재난 대응 계획 수립, 선박 항로 안전성 평가, 항만 및 연안시설의 파랑 영향 분석, 해양 기상 예보 등에 활용될 수 있습니다.
