summary_user: 더술(thesool.com)에 등록된 우리나라 전통주를 제품 한 건당 한 행으로 담은 파일로, 제품명·소개·알코올 도수·용량·원재료(성분)·판매여부와 양조장 이름·주소·홈페이지·수상경력을 전국 범위로 담는다. 소비자나 유통·관광 사업자가 '특정 지역 양조장에서 만드는 도수 낮은 탁주나 수상 경력 있는 증류주는 무엇인가'처럼 전통주를 고르고 양조장을 찾는 데 쓴다. 공통 조인 키나 코드표가 없어 다른 데이터와는 양조장 주소를 행정구역·좌표로 바꾸거나 양조장명·제품명을 이름으로 맞춰 이어 쓴다.
description_portal: '더술(https://thesool.com/front/home/M000000000/index.do)에서 제공하는 우리나라 전통주 상품별 알코올 도수, 용량, 원재료 정보 등 제공우리나라에서 생산 및 판매되는 다양한 주류 정보우리술의 다양한 생산정보(제조업체, 제조업체 주소, 알콜 도수, 수상 경력 등) 제공탁주, 청주, 증류주, 과실주, 기타 주류 등 주종별 다양한 우리 술에 관한 정보 제공데이터 설명- 데이터 컬럼 수: 12개- 데이터 컬럼 목록: 제품명, 제품 소개, 알콜도수, 용량, 성분, 특이사항, 특징, 판매여부, 양조장, 양조장주소, 홈페이지주소, 수상경력'
