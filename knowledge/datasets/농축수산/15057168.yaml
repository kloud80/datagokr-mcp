summary_user: 경기도 산림욕장을 한 곳씩 한 행으로 담은 현황 데이터로, 시군, 산림욕장명, 조성연도·조성면적, 국유·공유·사유 소유구분, 국비·도비·시군비 사업비, 도로명·지번 주소와 WGS84 좌표가 들어 있다. 주민이나 여행객이 우리 시군 근처 산림욕장의 위치를 찾을 때, 분석가가 시군별 산림욕장 조성 규모와 사업비 분담을 비교할 때 쓴다. 실측상 전역 조인 키는 없어서 다른 데이터와는 시군명·시군코드(SIGUN_CD) 매핑이나 위경도 좌표 기반 공간 결합으로 잇는다.
description_portal: 이 데이터는 경기도 내 시군별 산림욕장의 현황을 제공하며, 자연환경을 활용한 치유 및 휴양공간으로서의 산림욕장에 대한 정보를 포함합니다. 산림욕장명, 시군명, 조성면적(ha), 조성년도, 소유구분(국유림·공유림·사유림) 등의 항목 외에도, 사업비 항목은 국비·도비·시군비 및 전체 합계를 백만원 단위로 구분하여 제공합니다. 위치정보는 도로명주소, 지번주소, 우편번호, WGS84 위도·경도로 구성되어 있어 공간적 활용이 용이합니다. 이 데이터는 치유의숲 조성 현황 파악, 지역 관광자원 분석, 산림복지 서비스 기획 및 정책 수립 등 다양한 분야에서 활용될 수 있습니다. 데이터는 Open API 방식으로 제공되며, 상업적 활용과 콘텐츠 변경도 허용됩니다.
