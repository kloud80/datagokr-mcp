summary_user: 경기도 내 산란계·육계·오리 등 가금류 사육 농장을 농장 단위로 담으며, 시군명, 축종과 세부 구분, 사육 두수(BREDNG_HEAD_CNT), 도로명·지번 주소, 위도·경도 좌표를 포함한다. 방역 담당자나 분석가가 조류인플루엔자 발생 지점 주변 시군에 어떤 가금 농장이 몇 마리 규모로 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드나 주소·좌표를 기준으로 다른 시군 단위 통계나 지도 데이터와 맞춰 이어 쓴다.
description_portal: 경기도 가금류 농장 현황 데이터는 산란계, 육계, 오리 등 다양한 축종을 사육하는 농장의 정보를 집계하여 제공하는 자료다. 이 데이터에는 농장명, 사육하는 축종명과 세부 구분, 사육 두수(마리), 위치 정보(도로명 주소, 지번 주소, 우편번호, 위도·경도 좌표) 등이 포함되어 있어, 경기도 내 가금류 산업의 전반적인 분포와 규모를 파악하는 데 유용하다. 특히 시군 단위로 데이터를 조회할 수 있어 지역별 가금류 사육 현황을 비교·분석할 수 있으며, 이는 정책 수립이나 축산 자원 관리, 방역 대책 마련에 중요한 기반 자료로 활용될 수 있다.가금류 농장은 조류인플루엔자(AI)와 같은 전염병 발생 시 빠른 차단 방역이 필수적이므로, 해당 데이터는 질병 관리와 예방을 위한 핵심 자료로 기능한다. 예컨대 특정 지역의 고밀도 사육 현황을 확인함으로써 방역 취약 지역을 선제적으로 관리할 수 있으며, 축산물 생산량 추정에도 활용 가능하다. 또한 축산 농가 지원 정책 수립, 사료 수급 계획, 농업 환경 관리 등 다양한 분야에서 기초 자료로 활용된다.지리 정보가 함께 제공되므로 GIS 기반의 공간 분석을 통해 가금류 농장의 분포를 시각화할 수 있으며, 이는 환경영향평가나 농촌 개발 계획 수립 시에도 도움을 준다. 나아가 농장 위치와 사육 규모를 연계 분석하면 지역별 축산업 발전 현황과 문제점을 도출할 수 있고, 친환경 축산 정책이나 지속가능한 농업 모델 설계에도 기여할 수 있다.이 데이터는 행정기관, 연구기관, 학계, 농업 관련 기업 등이 폭넓게 활용할 수 있으며, 궁극적으로 경기도의 축산업 경쟁력 강화와 안전한 먹거리 공급망 구축, 지속가능한 농축산업 발전을 지원하는 데 중요한 역할을 한다.
