summary_user: 후계농업경영인 지원사업 현황을 연도·시도 단위로 집계한 데이터로, 필드명으로 보아 접수 차수별 접수·신청취소·선정·미선정·선정취소·자진취소 건수와 결정·실행·미실행 융자금액을 담으며 범위는 전국입니다. 정책 담당자나 연구자가 '어느 시도에서 후계농 신청 대비 선정 비율과 실제 융자 집행액이 어떻게 달라졌나'를 연도별로 비교하는 데 쓴다. 전역 조인 키는 없어서 시도명(CTRD_NM)이나 시도코드(CTRD_CODE)로 맞춰 시도별 농가·농업인구 통계 등 다른 지역 데이터와 연결한다.
description_portal: 해당 데이터는 후계농업경영인 지원 현황에 대해 제공하고 있습니다. 이를 통해 후계농업경영인 제도가 실제로 어떤 규모와 방식으로 운영되고 있는지를 확인할 수 있습니다. 본 자료는 정책 담당자에게는 청년 농업인 육성 정책의 성과를 평가하고 제도 개선 방향을 설정하는 근거 자료가 되고, 예비 농업인과 청년 창업 농에게는 신청 절차와 지원 현황을 파악할 수 있는 참고자료가 됩니다. 또한 연구자에게는 청년 농업인 정책의 효과성, 지역별 농업 인력 수급 구조를 분석할 수 있는 실증 데이터로 의미가 있으며, 궁극적으로는 농촌 인구 유입 촉진, 농업 인력 구조 개선, 지속 가능한 농업 기반 마련에 기여하는 핵심 자료라 할 수 있습니다.
