summary_user: 국가숲길 구간 위의 관심지점(봉우리·샘터·화장실·쉼터·야영장·위험지역 등)을 지점 한 건씩 위도·경도·해발고도·장소유형·설명과 함께 담은 전국 범위의 건별 원천 데이터다. 탐방객이나 앱 개발자가 "이 숲길 코스에서 화장실·샘터·위험지역은 어디에 있나"를 지도에 표시하거나 위치기반 안내를 만들 때 쓴다. 전역 조인 키는 없고, 숲길식별자(frtrlId)·숲길명으로 같은 기관의 국가숲길 정보와 묶거나 좌표로 다른 산림·관광 데이터와 공간 결합해 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 11월 16일에 등록하여 제공하는 오픈API 서비스로, 국가숲길 구간의 관심지점(POI) 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 기준일시 등의 속성을 호출할 수 있으며,이를 활용하여 국가숲길 코스 안내, 탐방객 위치기반 서비스, GIS 지도 시각화, 관광·환경 정책 데이터 구축 등 다양한 분야에서 활용이 가능한 정보를 JSON+XML 포맷으로 지원합니다.
team:
  dept: 기획조정실
services:
  - op: /getNtnFrtrlInfoList
    name: 국가숲길정보 조회
    endpoint: https://apis.data.go.kr/B553662/ntnFrtrlInfoService/getNtnFrtrlInfoList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        example: '1'
        desc: 한 페이지 결과 수
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지 번호
      - name: type
        required: false
        example: xml
        desc: 데이터 타입
      - name: srchFrtrlNm
        required: false
        example: 내포문화숲길
        desc: 숲길명
      - name: srchPlaceTpeCd
        required: false
        example: PARK
        desc: 장소유형코드
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
