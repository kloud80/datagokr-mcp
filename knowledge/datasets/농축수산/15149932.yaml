description_portal: 주요항목수상년도, 수상내역, 수상타이틀, 분야(정원 등)활용분야국내외 정원박람회, 가든쇼, 조경 관련 대회 및 전시에서의 수상 성과를 종합적으로 제공정원문화 확산 정책 및 조경·정원 산업 육성 성과 분석학술연구, 정책평가, 전시·박람회 운영 참고자료민간 분야 정원디자이너, 기업, 학계의 연구와 교육 자료기대효과정원·조경 분야의 수상실적 데이터를 통해 국내 정원문화의 성장과 국제 경쟁력 강화를 객관적으로 보여줄 수 있다. 해당 데이터는 정원산업의 성과 홍보와 정책 추진 근거로 활용 가능하며, 정원디자이너 및 기업의 활동 성과를 체계적으로 기록·공유함으로써 민간 창작 활동을 지원한다. 또한 국제박람회 참여성과와 수상내역을 축적함으로써 향후 국제 교류 확대, 정원문화 콘텐츠 개발, 정원산업 시장 다변화에 기여할 수 있다.
