description_portal: 이 데이터는 해양수산부에서 조위관측에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은  공간정보일련번호조위관측소아이디해양관측자료유형과거조위관측소아이디구우편번호해양관측지점명관측위도해양관측경도조위관측소고정점명1공간정보경도 데이터로 구성되어 있습니다.본 데이터는 자원기본정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.조위관측란 달, 태양, 지구의 운동으로 인해 발생하는 해수면의 주기적인 높이 변화인 조석(潮汐) 현상을 측정하는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
