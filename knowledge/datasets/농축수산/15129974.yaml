description_portal: 이 데이터는 해양수산부 국립해양조사원에서 종이해도 중 항만도의 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 항만도의 SHP형식 공간정보 파일로 구성되어 있으며, 각 해도의 해도명, 해도번호, 발행일, 축척, 조사기관 등 정보를 포함하고 있습니다.   이 데이터는 해양 관련 연구, 선박 운항계획 수립, 항만 인프라 관리, 해양공학 설계, 교육 자료 등에서 기초정보로 사용할 수 있으며, 항만도 구매 및 활용이 필요한 실무자나 정책 수립 기관, 관련 산업 종사자가 해도 제작 및 최신 항로정보 반영에 참고자료로 활용할 수 있습니다.
