description_portal: 농림식품기술기획평가원에서 보유하고 있는 동향보고서 정보입니다. 파일데이터(CSV) 형태로 개방하고 있으며, 기준년도, 분류, 제목, 발행일, 첨부파일이름 목록을 포함하고 있습니다.1년 주기로 데이터를 개방하고 있으며, 데이터 이용 시 주기성 과거 데이터 확인 부탁드립니다.농기평 대표홈페이지(ipet.re.kr) 자료실 RnD 동향정보 페이지에서 보고서(동향, 기술수준평가, RnD 이슈브리프, 미래기술예측, IPET농산업기술전략) 원문 정보를 확인할 수 있습니다.농림식품 분야의 핵심 기술에 대한 현재 수준을 평가하고, 국내외 기술과의 비교를 통해 기술 격차를 분석하는 기술수준평가보고서, 농림식품 분야의 최신 연구개발 동향, 정책 변화, 산업 이슈 등을 간략하게 정리한 RnD 이슈브리프, 농림식품산업의 중장기적인 기술 발전과 미래 유망 기술을 예측하는 미래기술예측, 국내외 농식품 산업의 기술, 정책, 시장 동향을 종합적으로 분석하는 동향보고서, 농림식품기술기획평가원이 수립한 농산업 기술 발전 전략을 담은 IPET 농산업 기술 전략 보고서 정보입니다.
