summary_user: 전국에서 준공된 연안정비사업 시설물을 건별로 담은 원천 데이터로, 전체 923건이 2000-01-01부터 2025-12-17까지의 준공 기간에 걸쳐 있고 시설물마다 주소·좌표가 있다. 지자체나 분석가가 연안 인프라의 연도별 준공 현황을 파악하고 점검·유지보수 우선순위를 정할 때 쓴다. 위치주소(cimpCptFctLcAddr)가 조인 키라 주소 기준의 다른 데이터와 이어 쓰며, 사업개요번호(cimpBsnsSmrNo)로 연안정비사업 정보와 연결하는 용도로 볼 수 있다.
limits: 조인 키로 실측 확인된 것은 주소(cimpCptFctLcAddr) 하나뿐이며, 그 외 코드표나 키는 확인되지 않았다. 최신 행 날짜가 2025-12-17이라 관측일 기준 289일 전이지만, 이것만으로 데이터가 오래됐다고 단정할 수는 없다. 호출은 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
