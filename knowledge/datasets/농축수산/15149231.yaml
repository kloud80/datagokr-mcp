summary_user: 해양수산부가 해양수산정보 공동활용체계에서 관리하는 역사문화환경보전지역(문화재 주변의 자연경관이나 역사·문화적 가치가 뛰어난 공간)의 구역별 공간정보를 CSV 파일(약 1MB) 하나로 담으며, 각 행에는 일련번호, 분류 내용, 지역 분류, 갱신일자, 공간정보가 들어 있다. 해상풍력·연안 개발 사업자나 해양공간계획 담당자가 "계획한 해역이 역사문화환경보전지역과 겹쳐 입지 규제를 받는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 해양공간 데이터와는 공간정보(geometry)를 겹쳐 보거나 이름·분류 매핑, 같은 기관의 코드로 연결한다.
description_portal: 이 데이터는 해양수산부에서 역사문화환경보전지역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보 데이터로 구성되어 있습니다.본 데이터는 역사문화환경보전지역 공간정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.역사문화환경보전지역이란 문화재 주변의 자연경관이나 역사·문화적 가치가 뛰어난 공간을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
