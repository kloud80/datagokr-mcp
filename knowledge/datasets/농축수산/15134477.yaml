summary_user: KAMIS에서 조사한 전국 농산물 공판장의 도매가격을 일자·시장·품목·단위·등급별 평균가격으로 담은 파일이며, 전일 평균가격과 전년 가격이 함께 들어 있다(csv 약 32.6MB). 식자재 구매 담당자나 유통업자, 물가 분석가가 '특정 공판장에서 이 품목의 오늘 도매가가 어제·작년보다 얼마나 올랐나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시장명·품목명을 이름으로 맞춰 연결해야 하며, 다른 KAMIS 가격 데이터와 붙일 때도 품목명 매핑이 필요하다.
description_portal: 농산물유통정보(KAMIS)에서 농산물 공판장  도매가격 정보입니다. Kamis 유통정보는 전국 주요 도·소매시장 대상으로 매일(토·일·공휴일 제외) 가격을 조사하여 공개하는 농수산물 도·소매가격정보부터 거래동향/전망, 알뜰장보기 물가정보, 성수품·제철농산물 정보 등 농수산물의 유통과 관련한 다양하고 특화된 정보 서비스가 가장 큰 특징입니다. 더 세부적인 데이터를 참고하고 싶다면 kamis.or.kr 로 접속하여 확인하실 수 있습니다.*KAMIS:KAMIS(농산물유통정보시스템)는 aT(한국농수산식품유통공사)가 운영하는 농산물 가격·유통 정보 제공 플랫폼입니다. 전국 도매시장, 소매시장 등에서 수집한 실시간 가격과 수급 동향을 공개해 농업인, 유통업자, 소비자가 합리적으로 의사결정을 할 수 있도록 지원합니다. 또한 품목별 산지·도매·소매 가격, 주간·월간 동향, 기상 및 수급 전망 등 다양한 정보를 제공하여 농산물 유통의 투명성과 예측 가능성을 높이고, 정책 수립에도 활용됩니다
