summary_user: 수협이 운영하는 물류센터·공판장별로 기준일자마다 보관 중인 수산물 품목의 재고량(수량과 킬로그램)을 냉동 등 상태·가공 구분과 함께 담은 전국 범위 파일이다. 수산물 유통업자나 분석가가 "지금 어느 수협 물류센터에 냉동 민대구 같은 품목이 얼마나 쌓여 있나"를 확인하거나 품목별 재고 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 수산물 품목코드·품목명이나 물류센터명을 이름·코드 매핑으로 맞춰 이어야 하며, 어종코드가 수협·수산과학원·HS마다 달라 위판장 경락가격 데이터와 붙일 때 매핑표가 필요하다.
