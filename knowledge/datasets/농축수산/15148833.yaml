description_portal: 이 데이터는 해양수산부에서 공유수면매립면허내역에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공유수면매립면허일련번호, 공유수면매립기본계획일련번호, 공유수면매립면허번호, 공유수면매립면허자격취득일자, 공유수면매립면허자명, 공유수면매립면허관리기관명, 공유수면매립면허면적, 공유수면매립사업진행단계 데이터로 구성되어 있습니다.본 데이터는 공유수면매립면허내역 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면매립면허란 바다, 하천 등 공공이 사용하는 수면을 흙, 모래 등으로 채워 육지로 만드는 공유수면매립을 하기 위해 정부나 지방자치단체의 허가를 받는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
