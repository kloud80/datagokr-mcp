summary_user: 농식품 공공데이터 포털에 등록된 민간데이터의 목록 정보로, 데이터 한 건마다 데이터명·키워드·상위 카테고리·갱신주기·제공 방식과 포맷·제공기관을 담은 전국 범위의 비공간 메타데이터이다. 분석가나 사업자가 '농산물 가격·유통 분야에 어떤 민간 데이터가 어떤 형식과 주기로 나와 있나'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 데이터명이나 제공기관코드를 기준으로 같은 기관의 다른 목록과만 이어 붙일 수 있다.
description_portal: 이 데이터는 농림축산식품부에서 개방한 농식품 분야 공공데이터를 민간에서 활용한 사례 정보를 포함합니다. 주요 항목에는 데이터명, 제공기관, 활용 기업명, 서비스명, 서비스 설명, 활용 유형, 적용 기술 등이 있으며, 각 사례는 정형화된 구조로 정리되어 있습니다. 공공데이터를 기반으로 한 창업, 서비스 개발, 제품화 등 다양한 민간 활용 유형이 포함되며, 각 서비스는 데이터 연계 방식, 기술 활용 유형, 산업 분야 등에 따라 구분됩니다. 이 데이터는 민간에서 공공데이터를 어떤 방식으로 활용하고 있는지를 보여주는 구조화된 자료로서, 항목별로 상세한 정보가 수록되어 있어 비교 분석이 가능합니다.
