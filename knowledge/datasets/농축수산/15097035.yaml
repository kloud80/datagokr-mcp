description_portal: 이 데이터는 제주특별자치도가 관리하는 ‘불법반입 가축 및 축산물 지도단속 실적’ 현황을 정리한 공공데이터로, 공항이나 항만 등 제주로의 동물‧축산물 반입 경로에서 점검된 건수와 그 중 적발된 사례에 대한 정보를 포함하고 있습니다. 각각의 점검 일자, 대상 농가 혹은 반입 품목, 적발 결과 등을 통해 제주로 유입되는 가축 및 축산물의 위반 동향을 파악할 수 있도록 구성되어 있습니다. 이 자료를 활용하면 축산물 유통 체계의 불법 반입 여부 감시, 방역 및 위생 통제, 유통망 안전성 평가, 정책 입안자나 행정기관의 단속 전략 수립 등에 유용하며, 축산물 안전성과 지역 방역 관리 수준을 객관적으로 분석하는 기초 자료가 됩니다. 데이터는 CSV 형식으로 무료 제공됩니다.
