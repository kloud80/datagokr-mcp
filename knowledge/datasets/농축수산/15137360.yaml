summary_user: 작물별로 포함된 성분과 그 함량을 식품 일련번호·성분 코드·함량 값 단위로 담은 전국 단위 비공간 표준성분 파일이다(csv 약 5.4MB). 영양 분석가나 식품 관리 담당자가 '이 작물에는 어떤 성분이 얼마나 들어 있나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 식품 일련번호·성분 코드를 이름이나 같은 기관(농촌진흥청) 코드표에 매핑해야만 이어 쓸 수 있다.
description_portal: 농촌진흥청은 국민과 농업인이 보다 정확한 농산물 정보를 활용할 수 있도록, 작물에 포함된 성분과 함량을 국가표준 코드 기반으로 제공하고 있습니다. 각 작물 정보를 조회하면 해당 성분과 함량이 정리된 표를 함께 확인할 수 있어, 영양 정보 분석이나 연구, 식품 관리 등 다양한 목적으로 활용할 수 있습니다. 이 서비스는 단순한 정보 제공을 넘어, 작물별 영양 성분에 대한 이해를 돕고, 농업인과 소비자가 안전하고 건강한 선택을 할 수 있도록 지원합니다. 또한 표준화된 코드를 활용함으로써 신뢰성과 정확성을 높이고, 농업 데이터 관리와 정책 수립에도 중요한 기반 자료로 활용됩니다.
