summary_user: 경기도 사이버식물병원의 병해 증상 이미지 목록으로, 이미지 한 장마다 이미지 번호와 해당 작물 번호, 증상 분류 번호를 담는 건별 원천 데이터이며 범위는 시도 단위의 비공간 자료입니다. 작물 병해를 진단 의뢰하거나 교육 자료를 만드는 농업인·교육 담당자가 '이 작물의 이 증상은 어떤 모습인가'를 참고 이미지로 확인하는 데 쓴다. 작물 번호(tre_no)와 증상 분류 번호(symptms_class_no)로 같은 기관의 작목·증상 분류 테이블과 이어 쓰지만, 다른 기관 데이터와 연결할 전역 조인 키는 없다.
description_portal: 증상_이미지 테이블은 병해 증상에 대한 시각적 자료를 관리하는 데이터로, 각 이미지가 어떤 작물과 증상 분류에 속하는지를 연결합니다. 이 테이블은 각 이미지가 어떤 작물과 어떤 병해 증상에 해당하는지를 명확히 보여주기 위해, 이미지 번호와 함께 작물 번호, 증상 분류 번호를 포함합니다. 해당정보는 증상 분류 번호와 작물 번호로 각각 증상_분류, 작목 테이블과 연계되어 병해 유형과 작물 특성을 함께 파악할 수 있도록 구성되어 있습니다. 해당 이미지는 진단의뢰 시 참고 이미지로 활용되거나 병해 증상 교육 자료로도 사용될 수 있습니다.
