description_portal: 해양생명자원통합정보시스템(MBRIS)은 해양수산생물의 종 목록 정보를 통합적으로 제공하는 시스템으로, 해양생물 전문가들이 등록하고 관리하는 데이터를 기반으로 실시간 해양수산생물 종 정보를 제공합니다. 사용자는 이 시스템을 통해 국내 해양생물의 분류군별 기록종 현황을 쉽게 검색할 수 있으며, 엑셀 파일로도 다운로드하여 활용할 수 있습니다.또한, 각 해양수산생물을 보유하고 있는 기관에 대한 정보도 함께 제공되는데, 주요 기관으로는 국립해양생물자원관, 기탁등록보존기관, 국립수산과학원이 포함됩니다. 생물 분류군은 척추동물, 무척추동물, 식물, 원생생물, 미생물, 육상담수종으로 나뉘며, 각 분류군별로 별도의 엑셀 시트를 통해 종 목록을 확인할 수 있습니다.제공되는 정보는 국명, 학명뿐 아니라 속명, 과명, 목명, 강명, 문명, 계명 등 생물 분류체계에 기반한 다양한 수준의 정보를 포함하고 있어 해양생물 연구 및 자원 관리에 기여하고 있습니다.
