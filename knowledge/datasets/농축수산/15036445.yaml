description_portal: 이 정보는 안산시 관내 각급 학교에 제공된 농산물 급식 지원 현황을 정리한 자료입니다. 항목은 시설구분, 학교명, 도로명 주소, 지원품목, 데이터 기준일자로 구성되어 있습니다. 해당 품목은 ‘친환경 등 우수농산물·G마크’ 인증 농산물로 표기되어 있으며, 주로 관내 학교를 중심으로 공급되고 있습니다. 본 정보는 학교급식의 품질 관리, 친환경 농산물 유통 지원, 지역 농산물 소비 촉진 등 공공정책 수립 시 유용하게 활용하실 수 있습니다. 또한 민간 영역에서는 친환경 인증 농산물 수요 예측, 농산물 공급망 분석, 지역 농산물 브랜드 육성, 학교급식 납품업체 사업 전략 수립 등 다양한 활용이 가능합니다. 학교 주소 정보가 포함되어 있어 학교별 공급 지역 분포도 분석 및 GIS 기반 급식지원 분석 자료로도 활용 가치가 높습니다.
