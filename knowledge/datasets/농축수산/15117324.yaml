description_portal: 한국농어촌공사 용수시설통합운영관리시스템(TOMS)에서 사용중인 수문 종류 입니다.슬라이드형 수문은 수직으로 승강하는 플레이트형 수무입니다.방사형 수문은 원통형 일부를 사용한 곡면 수문으로, 수압을 효율적으로 분산시켜 회전식으로 열고 닫힙니다.플랩 수문은 위쪽에 힌지가 있어 수압이 일정 수준 이상일 때 자동으로 열리고 닫히는 체크밸브식 수문입니다.팬 게이트는 주로 하천수역이나 홍수조절용으로 사용됩니다.시스템 내부에서 사용하는 수문의 코드값이 분류되어 있습니다.타 데이터와 결합해서 사용하실때 참고 하시길 바랍니다.
