description_portal: '가축위생방역지원본부는 「가축전염병 예방법」 제9조제6항 제3호의2에 따라, 국가가축방역통합정보시스템을 통해 전국 가축사육시설 관련 정보를 체계적으로 수집·관리하고 있습니다.본 데이터는 전국 시군별 한우 사육규모 현황을 최신 기준으로 집계한 통계자료로, 축산농가의 사육규모(호수·두수)를 시도별·시군별 단위로 구분하여 제공합니다.자료 내 사육규모 구분은 다음과 같습니다.1. 2000두 이상2. 2000두 미만 ~ 1000두 이상3. 1000두 미만 ~ 500두 이상4. 500두 미만 ~ 60두 이상5. 60두 미만자료의 용어해석은 다음과 같습니다.1. 호수 : 가축을 사육하는 농가의 수2. 두수(수수) : 사육중인 가축의 마릿수 이 데이터는 가축질병 예방·확산 방지를 위한 아프리카돼지열병(ASF) 등 가축전염병 대응 정책, 가축살처분 및 이동통제, 초동방역 및 방역대선정 등 재난대응 의사결정에 활용될 수 있으며, 「재난 및 안전관리 기본법」 등 관련 법령과도 연계성이 있습니다.또한, 농림축산식품부 축산물 통계, 통계청 농가 현황 등과 결합하여 가축방역 정책자료, 농가 맞춤형 방역대책 수립, 질병 예찰·모니터링 강화 등에 활용할 수 있습니다.주요 활용사례는 아래와 같습니다.1. 우리 지역 축산농가는 몇 호이며 평균 사육 두수는 얼마인지 조사2. 악성 가축전염병이 발생했을 때, 어느 규모의 농가가 가장 취약한지 조사3. 시군별 방역대선정 기준으로 활용하여 초동방역 및 재난대응 계획 수립 등'
