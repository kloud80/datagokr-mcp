summary_user: 경기도 내 비료생산업체를 업체(제조장) 한 곳당 한 행으로 담은 등록 현황으로, 시군·상호·제조장 주소와 위경도, 비료 종류·명칭, 일일 생산능력(톤/일), 제조원자재 비율, 데이터 기준일자를 포함한다. 시군 담당자나 농업·자원순환 분석가가 '우리 시군에 퇴비·복합비료를 하루 몇 톤까지 생산할 수 있는 업체가 어디에 있나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 통한 이름·위치 매핑으로만 다른 데이터와 이어 쓴다.
description_portal: 경기도 비료생산업 등록 현황 데이터는 도내 비료생산업체의 등록 정보를 제공하며, 시군명, 법인(상호)명, 제조장 소재지(도로명·지번), 전화번호, 비료의 종류 및 명칭, 생산능력(톤/일), 제조원자재 비율 정보, 위도·경도 좌표, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 해당 데이터는 업체별 생산 가능 규모와 주요 생산품(퇴비, 복합비료, 토양미생물제제 등)을 확인할 수 있으며, 제조 원자재 구성 비율까지 포함되어 있어 친환경 농업 및 자원 재활용 정책 연구에 유용합니다. 특히, 위치 좌표는 시설 분포 분석과 물류·유통 계획 수립에 활용될 수 있으며, 생산능력 정보는 지역 농업 수요 대비 공급 능력을 평가하는 지표로 사용 가능합니다. 이 데이터는 경기도 내 농업자원 관리, 환경자원 순환체계 강화, 친환경 농업 육성 정책 수립 등 다양한 분야에서 활용할 수 있습니다.
