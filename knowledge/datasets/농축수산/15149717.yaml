description_portal: '데이터 개요「정원누리 정원식물 생산·유통 기업 데이터」는 국내 정원·조경용 식물 생산 농가 및 기업의 정보를 통합하여 제공하는 공공데이터입니다. 본 데이터는 기업별 기본 정보와 함께 대표 생산 식물의 국명·학명·영문명을 포함하고 있어, 정원·조경 산업 현장에서의 활용성과 연구·교육 측면의 확장성을 동시에 고려하여 구축되었습니다. 총 30개 기업의 주소, 대표자, 홈페이지, 기업 소개, 대표 상품 목록이 체계적으로 수록되어 있으며, 수국(Sceintific: Hydrangea macrophylla), 국화(Chrysanthemum morifolium), 구절초(Aster scaber), 참억새(Miscanthus sinensis) 등 국내 수요가 높은 주요 식물 정보를 제공합니다.주요 항목기본 기업 정보: 회사 일련번호, 회사명, 주소, 대표자, 홈페이지 링크대표 생산 품목: 기업별 생산·유통 중인 주요 식물(국명·학명·영문명 포함)기업 소개: 주요 사업 분야(정원식물 생산, 자생식물 재배, 정원 시공, 화훼 연구개발 등)관리 코드: 노출 여부, 삭제 여부활용 분야정원·조경 설계 및 조달: 공공·민간 조경 사업 식재 계획 및 공급망 구축연구 및 교육: 자생식물 산업 연구, 원예·조경 관련 교육 자료산업·정책: 지역농가 협력 네트워크 구축 및 정원산업 생태계 분석 기반기대 효과본 데이터는 실질적인 식물 공급·유통 정보를 제공하여 정원·조경 실무자의 의사결정을 지원하고, 자생식물 기반 연구 및 산업 활성화에 기여합니다. 또한 공공조달, 지역 상생 사업, 정원문화 확산 등 국가 차원의 정책 지원 도구로 활용될 수 있으며, 국가 정원식물 산업 데이터 표준화 및 공공데이터 활용 촉진을 통해 학술·산업·문화 전반의 시너지를 창출할 것으로 기대됩니다.'
