summary_user: 일본 어선이 한국 EEZ(배타적 경제수역)에서 조업하려고 낸 입어 신청을 신청 건별로 담은 원천 파일(CSV, 약 2.9MB)이다. 어선명·선적항·총톤수·마력·선창 정보와 함께 허가 여부, 허가번호, 허가기간, 최대허용어획량, 재교부 이력을 담는다. 분석가나 정책 담당자가 "특정 연도에 한국 EEZ 입어가 허가된 일본 어선은 어떤 업종에 몇 척이고 허용어획량은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 EEZ 신청번호·허가번호, 업종 코드처럼 해양수산부 내부 코드나 어선명 매칭으로만 잇는다.
description_portal: 본 데이터는 해양수산부에서 일본 어선의 한국 EEZ(배타적 경제수역) 내 어업 활동과 관련된 신청 기본정보 제공을 목적으로 수집된 데이터입니다.이 데이터의 주요 내용은 EEZ신청번호,어선영문명,어선일문명,일본어선번호,어업종류코드,국가코드,선적항영문명,선적항일문명,선박총톤수,선박마력,최대속도,최대승무원수,호출부호명,선창종류코드,선창수량,선창용량,부속선척수,허가신청일자,허가유무,최대허용어획량,출력단위구분,신청구분,신청한글내용,신청일문내용,기준년도,EEZ허가번호,일련번호,어선종류내역,허가일자,허가종료일자,최초생성시점,최종변경시점,재교부여부,재교부일자,재교부사유한글내역,재교부사유일문내역,재교부이전EEZ허가번호,데이터기준일자 등으로 구성되어 있습니다.국제 어업 협정 체결 및 이행 현황 관리, 한일 EEZ 내 자원 배분 현황 분석, 어업 관련 정책 수립, 어종별·연도별 어획량 및 배분 실적의 추적 등에 활용될 수 있습니다.
