summary_user: 국립해양조사원이 해양예측정보를 기호와 색상으로 표현한 해황예보도의 지점별 예보일자·예보시각과 이미지 파일명·파일경로를 담는 API로, 지점코드를 넣어 조회하며 범위는 전국이다. 낚시·해양레저 이용자나 해상교통·어업 일정을 짜는 사람이 '이 해역의 해황예보 지도를 어디서 받아 볼 수 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지점명 매핑이나 국립해양조사원(바다누리) 자체 관측소·지점 코드로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 해양체험, 활동과 의사결정 지원을 위해 다양한 해양예측정보를 기호와 색상으로 표현한 해양예보지도를 제공하기 위해 수집한 데이터 입니다. 해황예보도 지점코드를 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 해황예보도 지점코드, 해황예보도 지점명, 해황예보도 예보일자, 해황예보도 예보시각 및 이미지 파일명, 이미지 파일경로 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
