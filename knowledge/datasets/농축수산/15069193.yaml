description_portal: '- 전라남도 22개 시군별 주요 보유 농기계 8종의 보유량 스마트농정 농식품통계 생산활용 시스템 통계자료("24년 기준)입니다. - 농용트랙터, 스피드스프레이어, 동력경운기, 동력이앙기, 콤바인, 관리기, 곡물건조기, 농산물건조기, 파종기, 정식기, 수확기, 농업용 멀티콥터 보유대수 현황에 관한 데이터입니다.- 농용트랙터는 농작업에서 가장 기본적이고 중요한 기계 중 하나입니다. 밭갈이, 씨 뿌리기, 비료 살포, 경운, 운반 등 다양한 작업에 사용되며, 다양한 작업기(예: 쟁기, 로터리, 예취기 등)를 부착해 다목적으로 활용할 수 있습니다.- 콤바인은 곡물 수확과 탈곡을 동시에 할 수 있는 농기계입니다. 주로 쌀, 보리, 밀, 콩 같은 곡식을 한 번에 수확해서 탈곡, 이물질 분리까지 해주기 때문에 농작업 시간을 크게 단축시켜 줍니다.'
