summary_user: 한국마사회가 서울·제주·부산경남·영천 경마장에서 시행한 경주의 상세성적을 경주일자·경주번호별로 출주마 한 마리당 한 행씩 담는 건별 원천 데이터로, 착순·마명·기수·조교사·마주·부담중량·마체중·단승식/연승식 배당률·경주기록·레이팅 등을 포함한다. 경마 분석가나 팬이 특정 경주일의 경주에서 어느 말이 몇 착을 했고 기수·조교사·마체중 변화와 배당률이 성적과 어떻게 맞물렸는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 같은 기관의 다른 경마 데이터와는 마번(hrNo)·기수번호(jkNo)·조교사번호(trNo)·마주번호(owNo)와 경마장·경주일자·경주번호 조합으로만 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 외부 데이터와는 이름·코드 매핑이나 한국마사회 자체 코드로만 연결된다. 조회는 경마장구분·경주일자·경주번호를 지정해야 하고 개발계정은 하루 3,000회로 제한된다. 부문이 농산물 유통 가격으로 분류돼 있으나 내용은 경마 성적이며 농산물 가격 정보는 없다.
