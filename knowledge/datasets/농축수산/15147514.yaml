description_portal: 이 데이터는 해양수산부에서 어선원부정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 어선번호, 어선원부번호, 이력관리일련번호, 어선명, 선적항명, 어선길이, 어선폭, 어선깊이, 어선총톤수 데이터로 구성되어 있습니다.본 데이터는 어선원부정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.어선원부정보란 어선을 운항하는 선원들에 대한 정보를 담은 공적 기록을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
