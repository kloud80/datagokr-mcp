summary_user: 전국 농산물 도매시장의 표준 시장코드와 도매시장명을 짝지어 담은 코드표로, 거래 건별 원천이 아니라 시장 목록을 담은 기준 데이터다. 농산물 유통 분석가나 개발자가 도매 경락·반입물량 데이터에 찍힌 시장코드가 어느 도매시장인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 도매시장 거래 데이터와 시장코드(CODEID)나 시장명으로 맞춰 이어 쓴다.
description_portal: 농림축산식품부는 도매시장에서 거래되는 농산물의 시장 정보를 제공하는 OPEN‑API 서비스를 운영합니다. 본 데이터는 도매시장코드와 도매시장명으로 구성되어 있으며, 이를 통해 전국의 도매시장 정보를 체계적으로 파악할 수 있습니다. 도매시장 정보는 농산물 유통의 효율성을 높이고, 거래 실적 분석 및 정책 수립에 필요한 기초 자료로 활용됩니다. 또한, 표준화된 시장 코드를 통해 데이터의 일관성과 정확성을 높이며, 농업 통계 수집 및 유통망 구조 파악에 기여합니다. 해당 데이터는 농산물 유통의 투명성과 효율성 향상을 위한 핵심 자료로 기능합니다.
