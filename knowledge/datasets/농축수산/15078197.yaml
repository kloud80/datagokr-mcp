summary_user: 국립수목원 국가생물종지식정보시스템의 식물세밀화 정보를 작품 건별로 담으며, 포털 설명상 학명·국명·제작년도·세밀화 구분 등을 제공하는 전국 범위의 비공간 데이터다. 교육자나 콘텐츠 제작자가 "특정 식물(학명·국명)의 세밀화가 있는지, 언제 제작됐는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식물·수목원 데이터와는 학명·국명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 국립수목원 국가생물종지식정보시스템의 식물자원 >> 식물세밀화 메뉴에서 제공되는 정보로, 식물 세밀화의 학명, 국명, 제작년도, 세밀화구분 등의 제보를 제공합니다.식물세밀화는 식물연구의 산물로서 정리되어진 식물체에 대하여 살아있는 식물의 해부학적인 미세한 구조를 비롯하여 사진으로 불가능한 부분이나 모양의 묘사까지도 가능합니다. 또한, 식물학적 측면에서의 정확한 표현은 물론 작가의 예술적 감각이 회화적인 요소로 가미됨으로서 식물의 아름다움을 더한층 돋보이게 할 수 있는 예술작품입니다.
