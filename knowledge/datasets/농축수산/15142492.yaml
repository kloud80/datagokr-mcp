summary_user: 국립해양조사원이 2009~2020년에 제작한 100년빈도 규모의 연안 인접지역 침수범위 예측정보를 시도·시군구 단위로 담으며, 예측 침수값과 침수 범위 공간정보(geom)를 제공한다. 지방자치단체 방재 담당자나 연안 개발 분석가가 '우리 시군구 연안 중 100년빈도 해수 범람 때 어디까지 잠기는가'를 확인해 침수 취약지역 대책이나 개발 입지 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 매핑하거나 공간정보를 겹쳐 연결해야 한다.
limits: 표준 행정코드 같은 공통 조인 키가 없어 이름 매핑에 의존하므로 행정구역 명칭 변경 등 불일치에 주의해야 한다. 개발계정은 하루 10,000회 호출 제한이 있다.
