description_portal: 이 데이터는 해양수산부 국립해양조사원에서 2009년~2020년까지 제작된 100년빈도 규모의 연안 인접지역 침수범위 예측정보를 제공하기 위해 수집한 데이터입니다.  검색 대상 시군구코드 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 시도, 시군구명과 예측 침수값 및 침수시 공간정보 등 정보로 구성되어 있습니다.  본 데이터는 지방자치단체에서 침수 취약 지역의 방재 대책 수립 시 활용할 수 있으며, 재난관리 담당 부서가 안전 진단 및 예방 활동의 기초자료로 사용할 수 있습니다. 또한 침수 위험지구 관리와 연안 개발계획 수립 등 정책 수립 과정에서도 사용할 수 있습니다.
