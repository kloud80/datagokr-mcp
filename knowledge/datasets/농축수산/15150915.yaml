summary_user: 경기도 사이버식물병원 웹사이트의 메뉴를 한 행씩 담은 구조 자료로, 메뉴 이름·페이지 주소·상위 메뉴 코드·메뉴 깊이·하위 메뉴 유무를 담는다. 사이트를 개편하거나 점검하는 운영자·분석가가 "병해충 상담 페이지는 어느 메뉴 아래 몇 단계 깊이에 있나" 같은 질문에 쓴다. 다른 데이터와 잇는 전역 조인 키는 없고, 상위 메뉴 코드(up_menu_cd)로 같은 자료 안의 상하위 계층만 재구성한다.
description_portal: 이 데이터는 사이버식물병원 웹사이트의 전체 메뉴 구조를 보여주는 자료로, 각 메뉴의 이름, URL 경로, 상위 메뉴 코드, 메뉴 깊이(계층), 페이지이름 등으로 구성되어 있습니다. 메뉴는 상위-하위 구조를 갖는 계층적 방식으로 구성되며, ‘상위메뉴코드’와 ‘메뉴깊이’를 통해 구조를 파악할 수 있습니다. ‘자식여부’는 해당 메뉴가 하위 메뉴를 포함하고 있는지를 나타내는 항목입니다. 메뉴 URL은 각 메뉴에 해당하는 페이지 주소를 포함하며, 이 데이터는 웹사이트의 정보 아키텍처 설계, 사용성 평가, 콘텐츠 관리 시스템 구성 등 디지털 서비스 운영의 기반 정보를 제공합니다.
