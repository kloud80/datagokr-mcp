description_portal: "남해군 내 마을어업 면허 현황을 나타내는 공공데이터로, 면허번호, 종별, 유형별, 품종, 어장면적(ha), 대표소유자, 위치 등의 항목으로 구성되어 있습니다.○ 면허번호 : 남해군에 등록된 마을어업의 공식 면허번호를 포함하고 있습니다.○ 종별 : 어업의 종류를 분류한 항목으로, 본 데이터는 모두 '마을어업'에 해당합니다.○ 유형별 : 어업의 운영 유형을 명시하며, 마을 단위의 공동체 기반 어업 활동을 나타냅니다.○ 품종 : 해당 어장에서 주로 관리·양식되는 자원으로, '정착성 수산동식물'(예: 전복, 굴 등)로 구성되어 있습니다.○ 어장면적(ha) : 허가된 어장 면적을 헥타르 단위로 표시하며, 최소 5.5ha에서 최대 28ha까지 다양합니다.○ 대표소유자 : 어업권을 소유·관리하는 어촌계 명칭입니다.○ 위치 : 어장이 위치한 행정구역 및 마을명을 도로명 또는 지명 중심으로 표기하고 있습니다."
