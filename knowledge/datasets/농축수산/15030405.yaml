summary_user: 경상남도 남해군의 마을어업 면허를 면허 한 건당 한 행으로 담은 원천 목록 파일로, 면허번호·종별·유형·품종(정착성 수산동식물)·어장면적(ha)·대표소유자(어촌계)·위치를 담는다. 남해군 어느 마을 어촌계가 얼마나 넓은 마을어업 어장 면허를 갖고 있는지 확인하려는 어업인·행정 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 대표소유자(어촌계명)나 위치의 마을명을 이름으로 맞춰 연결해야 하고, 면허번호는 같은 기관의 어업 면허 원장과 맞출 때만 쓴다.
