summary_user: 전국 치유의숲 38곳을 시설 한 곳당 한 행으로 담은 현황 파일로, 지역·시설명·주소·전화번호·홈페이지·참여방법·관리주체를 싣는다. 가까운 치유의숲이 어디 있고 어떻게 참여하는지 찾는 국민이나 지역별 시설 분포를 보는 분석가가 쓴다. 주소(address)를 키로 휴양림·수목원·등산로 같은 산림 복지·휴양 데이터와 이어 쓰며, 시설 코드표나 좌표 필드는 이 파일에 없다.
description_portal: 전국 각지의 치유의숲 현황을 2022년 11월 기준으로 정리한 데이터입니다. 이 자료에는 지역별 시설명, 주소, 전화번호, 홈페이지, 참여방법, 관리주체 등 다양한 정보가 포함되어 있어 이용자들이 각 치유의숲의 위치와 운영 현황을 쉽게 파악할 수 있습니다. 치유의숲은 산림을 활용한 전문적인 치유 프로그램을 제공하는 공간으로 국민 건강 증진과 심신 회복에 기여하며, 산림복지 서비스 확대에도 중요한 역할을 합니다. 본 데이터는 치유의숲 이용자뿐만 아니라 산림치유 관련 연구자, 정책 담당자 등이 시설 현황을 확인하고 프로그램 참여 및 운영 계획을 수립하는 데 활용할 수 있습니다. 또한 정기적으로 갱신되어 최신 정보를 반영하므로 행정기관, 연구기관, 일반 국민에게도 신뢰성 있는 근거 자료로 제공됩니다. 이를 통해 산림자원 활용과 국민 건강 증진을 동시에 도모할 수 있습니다.
