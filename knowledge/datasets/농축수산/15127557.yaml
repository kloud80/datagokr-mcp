summary_user: 전국 어선의 연도별 집계 자료로, 통계생성년도와 시도·시군구 코드 아래 진수일자, 어선 종류·재질, 엔진 종류·마력, 톤수·길이·폭·깊이, 어업 종류, 무전기·레이더·어군탐지기·구명뗏목 같은 장비 보유 수를 담으며 포털에서 zip 파일(약 0.9MB)로 받는다. 분석가나 정책 담당자가 '어느 시군구에 오래된 소형 목선이나 FRP 어선이 많고 구명장비·통신장비를 얼마나 갖췄는가'처럼 지역별 어선 구조와 안전장비 현황을 살필 때 쓴다. 실측 컬럼에 어선번호 같은 전역 조인 키가 없어 다른 어선 등록·허가 원장과 건별로 붙일 수 없고, 시도·시군구 코드나 어업 종류 코드를 기준으로 행정구역 코드표나 같은 기관의 코드 체계와 맞춰 지역·업종 단위로만 연결한다.
