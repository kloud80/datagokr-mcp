description_portal: '식물 신품종 육성자의 권리를 부여하기 위하여 품종보호제도를 운영하고 있으며, 신품종을 출원한 품종에 대한 서류심사, 재배심사, 종합심사 등을 거쳐 신품종을 등록하고 있다.국립종자원에 식물의 품종명으로 출원하고 그 심사결과로 등록되어 있는 명칭 현황(신고구분, 등록일자, 작물명, 품종명, 신청인, 명칭출원번호, 원사건번호) 자료이다.데이터 기준일까지 우리나라에 출원, 등록한 품종의 명칭 내역을 파악할 수 있어, 신품종 육성가 등에게 유용한 자료이다.국립종자원에 출원, 등록한 농업종자에 대한 품종으로 산림종자, 수산식물종자는 제외한 자료이다.* 참고사항: "신청인"의 공란은 과거 자료로 인하여 최초 데이터 등록("19년말 기준) 및 현재는 확인이 불가한 항목이기 때문임'
