description_portal: '○ 통계개요* 통계명 : 채소류 생산량* 통계종류 : 서울시 채소류 생산량 현황을 제공하는 지정ㆍ조사통계* 작성목적 : 식량생산계획, 토지이용개선, 농업경영개선, 농산물 가격안정, 유통대책 등의농업정책 수행과 학술연구 등 가공통계의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 조사담당자 → 지방통계청 → 통계청* 공표주기 : 정기(매년, 작물별수확기)* 공표범위 : 지역 - 서울시내용 - 서울시 과채류(수박, 참외, 딸기, 오이, 호박, 토마토), 엽채류(배추,시금치, 상추, 양배추), 근채류(무), 조미채소(고추, 파, 마늘, 양파)의재배면적 및 생산량, 단위면적(10a)당 수량 현황○ 용어설명* 채소 : 온갖 푸성귀와 나물을 통털어 이르는 말로 과채류, 엽채류, 근채류, 조미채소로분류됨* 단위면적(10a)당 생산량 현황 : 10a(1,000㎡)의 면적 내에서 수확한 농작물의 수량, 수확량'
