summary_user: 제주특별자치도 고품질 감귤 농가의 기본 정보를 농가 1곳당 1행으로 담은 소규모 CSV 파일(약 3.5KB)로, 농가명·시군구·읍면동·주소·위경도·토지면적과 와이파이·전원설비 유무(Y/N)를 담는다. 감귤 스마트농업 시범농가나 설비 지원 대상을 고르는 담당자·분석가가 'ICT 장비를 바로 설치할 수 있는 농가가 어디에 얼마나 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 위도·경도로 지도·공간정보와 겹치거나 시군구·읍면동 이름으로 다른 제주 지역 자료와 맞춰 쓴다.
description_portal: 이 데이터는 제주특별자치도 내 고품질 감귤 농가 30곳의 기본 정보를 정리한 자료로, 각 농가의 위치, 설비 현황, 식별 정보를 포함하고 있습니다. 주요 데이터 항목은 번호, 대상 구분, 아이디, 농가명, 시군구, 읍면동, 주소, 상세주소, 위도, 경도, 토지면적, 와이파이설비 여부, 전원설비 여부 등으로 구성되어 있습니다. 대상 구분 항목은 각 농가를 식별할 수 있는 10자리 숫자 형식으로 제공되며, 시군구 항목에는 서귀포시와 제주시가 포함되어 지역별 분포를 확인할 수 있습니다. 주소 및 상세주소 항목은 농가의 정확한 위치를 파악할 수 있도록 구성되어 있으며, 위도 및 경도 정보는 지도 기반 위치 분석 및 공간정보 시스템 연계에 활용할 수 있습니다. 토지면적은 각 농가가 보유한 재배지 규모를 나타내며, 와이파이설비 여부, 전원설비 여부는 각 농가에 ICT 기반 스마트농업 적용 가능성을 판단할 수 있는 주요 인프라 항목으로, ‘Y’ 또는 ‘N’ 형식으로 제공됩니다. 이 데이터는 감귤 농가의 스마트화 가능성 진단, 위치 기반 분포 분석, 설비 지원 대상 선정, 지역별 농업 기반 비교 등 다양한 행정적·분석적 목적에 활용될 수 있으며, 농업정책 수립이나 시범농가 선정을 위한 기초자료로도 유용하게 사용될 수 있습니다.
