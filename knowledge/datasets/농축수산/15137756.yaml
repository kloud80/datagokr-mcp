summary_user: 농림축산식품부 지원사업 신청 이력을 사업연도·농림사업 코드와 사업명·신청 일련번호·이력 일련번호·등록일시 단위로 담은 전국 범위의 건별 파일이다(CSV 약 66KB). 정책 분석가가 "연도별로 어떤 농림사업에 신청이 몇 건 몰렸고 추이가 어떻게 변했나"를 확인하는 데 쓴다. 농림사업 코드(agri_project_cd)와 신청 일련번호(agri_project_aply_sn)가 조인 키라 같은 기관의 다른 지원사업 신청·처리 데이터와 사업·신청 단위로 이어 쓰며, 별도 코드표는 제공되지 않는다.
description_portal: 해당 데이터는 농림축산식품부 지원사업 신청정보로, 주요 항목으로는 사업연도, 농림사업, 일련번호, 등록일 등을 포함하고 있습니다. 이를 통해 특정 연도별 지원사업 신청 현황을 체계적으로 파악할 수 있으며, 사업별 신청 규모와 신청자 분포를 분석하는 데 유용하게 활용될 수 있습니다. 또한 사업 연도별 신청 추이를 비교함으로써 농림축산식품 관련 지원사업의 수요 변화를 확인할 수 있고, 이를 기반으로 향후 지원사업 운영 방향을 설정하거나 제도 개선의 근거 자료로 삼을 수 있습니다. 특히 등록일과 일련번호를 통한 데이터 관리 체계화는 신청 절차의 투명성 제고와 행정 효율성 확보에도 기여할 수 있습니다. 이 데이터는 농림사업 전반의 신청·운영 현황을 살펴보고 지원 정책의 실효성을 점검하는 중요한 기초자료로서, 정책 수립 및 사업 성과 분석에 활용될 수 있습니다. 다만, 이 데이터는 개인정보 및 민감정보가 포함되어 있어 일부만 제공되므로 사용에 유의 부탁드립니다.
