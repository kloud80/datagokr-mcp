description_portal: '○ 2004년 제15호 태풍 메기로 인한 거창군 자연재난 현황 데이터이며 2004년 제15호 태풍 메기 재난원인, 2004년 제15호 태풍 메기 피해시설등급, 2004년 제15호 태풍 메기 피해구분, 2004년 제15호 태풍 메기 피해요인, 2004년 제15호 태풍 메기 피해위치,2004년 제15호 태풍 메기  피해시작일, 2004년 제15호 태풍 메기 피해종료일 정보를 제공합니다.○ 데이터기준일 : 2015. 9. 16.○ 2004년 태풍 메기(Megi)는 8월 16일부터 20일까지 활동하며 최저 중심기압 970hPa를 기록한 북서태평양 제15호 태풍입니다. 8월 18일 23UTC: 부산 인근 경상남도 남해안에 상륙 후 내륙으로 진출하였으며 제주와 남부 지방을 중심으로 강풍과 집중호우를 동반했으며, 한국과 일본에서 18명의 사망 및 실종 피해가 보고되었습니다.'
