description_portal: '- 전라남도에서 생산하는 어업별(천해양식, 일반해면, 내수면어업) 수산물 생산량, 생산액  정보를 포함하고 있습니다.- 전라남도는 청정 남해와 수천 개의 섬으로 둘러싸여 있어 풍부하고 다양한 수산문화를 자랑합니다.- 전라남도 수산물은 전복·굴비·게장·홍어·산낙지·연포탕 등 다양한 어종과 향토 요리를 자랑하며, 여수·목포·영광 등 주요 시장과 맛집에서 풍성히 즐길 수 있습니다. 활기찬 시장 문화, 판촉 행사와 함께 지역 특산물을 맛보고 직접 구매도 가능합니다.- 천해양식은 해조류, 패류, 어류로 크게 나눌 수 있으며, 이 중 해조류와 패류가 주요 품종입니다. - 내수면어업은 강, 호수, 저수지, 하천 등 육지 안의 담수에서 이루어지는 어업 활동을 말합니다.'
