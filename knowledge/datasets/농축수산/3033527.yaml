summary_user: 국립농산물품질관리원이 관리하는 농산물 이력추적관리 등록 단체 정보를 등록번호별로 담으며, 등록기관·단계구분·생산자단체명·대표품목·유효기간·도로명주소·등록 농가 수·등록 필지·재배면적이 들어 있고 범위는 전국이다. 유통업자나 식자재 구매 담당자가 특정 품목을 이력추적 등록한 생산자 단체가 어디에 있고 등록이 언제까지 유효한지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 생산자단체명·대표품목 이름이나 도로명주소를 맞춰 연결해야 하며, KAMIS 등 가격 데이터와 이으려면 품목명을 품목코드로 따로 매핑해야 한다.
description_portal: 이력추적관리란 농산물의 안전성 등에 문제가 발생할 경우 해당 농산물을 추적하여 원인을 규명하고 필요한 조치를 할 수 있도록 농산물의 생산부터 판매까지 각 단계별로 정보를 기록·관리하는 것으로 농산물 안전성 문제 발생 시 신속한 원인규명과 정확한 제품회수 등 위험관리, 제품의 품질·안전관리와 신뢰성 확보를 통한 공정한 거래에 기여하기 위하여 도입되었습니다. 본 정보는 국립농산물품질관리원에서 관리하는 농산물 이력추적등록 단체 정보로서, 등록번호, 등록기관, 단계구분, 생산자 단체, 대표자명, 유효기간 시작일, 유효기간 종료일, 대표 품목, 도로명 주소, 등록 농가 수, 등록 필지, 재배 면적 항목으로 구성되어 있습니다.
