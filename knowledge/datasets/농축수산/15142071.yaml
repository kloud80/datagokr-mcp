description_portal: '이 데이터는 연안개량안강망·안강망 어업의 허가 현황을 연도별로 집계한 자료입니다.이를 통해 연안 어업의 허가 구조 변화, 자원관리·생산활동과의 연계성, 정책 도입 전후의 영향을 점검하는 데 유용하며, 지자체와 유관기관은 허가 총량 관리, 어황·어장 이용 변화 모니터링, 안전·환경 규제 설계의 근거로 활용할 수 있습니다*안강망 : 조류를 이용해 어류가 망 안으로 들어오게 하는 정치성(설치형) 어구*개량안강망(연안개량안강망) : 작업 효율·안전성 향상을 위해 구조와 설치 방식을 개선한 개량형 안강망을 연안 수역에서 운영하는 형태'
