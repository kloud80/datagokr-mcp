description_portal: 이 데이터는 해양수산부에서 연안정지관측자료에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 연안정지관측해역명, 정점명, 정점영문명, 관측시작일자, 관측종료일자, 연안관측위도, 연안관측경도, 등록일자, 공간정보 데이터로 구성되어 있습니다.본 데이터는 연안정지관측자료 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.연안정지란 해양 및 기상 요소를 일정하게 반복 관측하는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
