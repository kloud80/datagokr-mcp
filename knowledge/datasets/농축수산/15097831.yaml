description_portal: 농림식품기술기획평가원에서 보유하고 있는 농림식품 RnD 생명자원 성과 정보입니다.파일데이터(CSV) 형태로 개방하고 있으며, 기준년도, 생명자원분류, 과제관리번호, 사업명, 과제명, 등록기탁번호또는 출원등록일자, 등록기탁일 또는 출원등록일, 생명자원명, 생명자원형태 정보를 포함하고 있습니다.1년 주기로 데이터를 개방하고 있으며, 데이터 이용 시 주기성 과거 데이터 확인 부탁드립니다.생명자원은 생명정보, 생물자원, 지식재산권(신품종) 등으로 분류됩니다.연구개발 성과 유형에 따라 사업화, 특허, 학술발표, 고용창출 등 세분화되며, 각 성과는 연구개발 결과가 산업 현장, 사회 정책, 학문 분야 등에 어떻게 활용되고 확산되었는지를 보여줍니다. 일반 국민 누구나 공공데이터포털(data.go.kr)을 통해 열람할 수 있도록 개방되어 있으며, 농림식품RnD 사업의 투명성과 접근성을 제고하는 데 기여하고 있습니다.
