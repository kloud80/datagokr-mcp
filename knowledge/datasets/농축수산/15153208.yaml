summary_user: 한국농어촌공사가 관리하는 전국 저수지의 수위·저수량·저수율·유입량·공급량과 수문·발전·여수로 등 경로별 방류량을 저수지 코드와 측정 일시 단위로 담는 시간별 관측 데이터이며, 범위는 전국이지만 행정구역 정보는 없습니다. 농업용수 관리자나 재난·가뭄 분석가가 특정 저수지의 저수율이 시간대별로 어떻게 변했는지, 집중호우 때 방류량이 얼마나 늘었는지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않았으며, 저수지 코드(RSRVR_CD)로 한국농어촌공사의 다른 저수지 데이터와 잇거나 저수지 이름으로 매핑해 연결한다.
