description_portal: 이 데이터는 해양수산부에서 공유수면 점사용 현황을 파악하고 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 공유수면 관리 및 매립에 관한 법률에 따라 공유수면 점용 및 사용 허가를 받은 대상에 대한 현황으로, 관리기관, 위치, 목적, 허가일, 점사용유형 항목 등으로 구성되어 있습니다.  본 데이터는 연안 및 공유수면 관리 정책 수립, 관련 법률 검토 및 허가 이력 추적, 공유수면 내 점사용 유형 통계 분석, 지자체별 공유수면 관리 대응 체계 마련, 해양공간 활용도 분석 등 공공행정 및 정책연구, 공간계획, 환경영향평가 자료 등으로 활용될 수 있습니다.
