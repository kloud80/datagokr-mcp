summary_user: 공유수면 관리 및 매립에 관한 법률에 따라 공유수면 점용·사용 허가를 받은 건별 현황을 관리기관, 위치, 목적, 최초허가일, 면적, 채취량·투기량, 점사용유형 단위로 담은 전국 범위 파일(xlsx)이다. 지자체·연구자가 "어느 관리기관 관할 공유수면에 어떤 유형의 점사용 허가가 얼마나, 언제부터 나가 있나"를 확인하거나 해상풍력 등 해양공간 입지 검토 때 기존 점사용 현황을 살피는 데 쓴다. 전역 조인 키가 없고 위치도 좌표가 아닌 비공간 항목이라, 다른 데이터와는 관리기관명이나 위치 텍스트를 이름 매핑해서만 이어 쓴다.
limits: 표준 행정코드나 좌표 같은 조인 키가 없어 지도 중첩이나 다른 데이터와의 자동 결합이 어렵고, 관리기관·위치 이름을 직접 맞춰야 한다. 행정단위는 전국 단위의 비공간 자료로 제공된다.
