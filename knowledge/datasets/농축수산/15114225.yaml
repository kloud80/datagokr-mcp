description_portal: 이 데이터는 동해안 지역의 천소수심(주변 해역보다 상대적으로 얕은 수심을 가진 지역) 정보를 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 동해안 해역의 천소수심 정보와 자료 출처명 등으로 구성되어 있습니다.  본 데이터는 해양수산부 및 관련 기관이 동해안 천소수심 정보에 기반하여 해양 안전 관리, 연안 개발 계획 수립, 해양 환경 조사 및 어업 정책 검토 등 다방면의 정책 및 행정적 업무에 활용될 수 있습니다. 또한 해양 관련 연구기관에서는 동해안 수심 자료를 참고하여 기초 조사 및 연구자료로 사용할 수 있습니다.
