summary_user: 경기도 내 낚시어선업 사업장별 기본 정보를 건별로 담으며, 시군·사업장명·인허가일자·폐업일자·업무 시작·종료일자·최대 선원수·최대 승객수·출입항구·소재지 주소를 포함한다. 시군별 낚시어선 규모와 출입항구 분포를 파악하거나, 특정 항구에서 운영 중인 낚시어선의 승객 수용 규모를 확인하는 해상안전·해양관광 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)·시군명이나 항구명·주소 같은 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: 낚시어선업현황 데이터는 국내에서 낚시어선업을 운영하는 사업장에 대한 기본 정보를 담고 있으며, 시군명, 사업장명, 인허가일자, 업무시작일자, 업무종료일자, 최대선원수, 최대승객수, 출입항구명, 소재지 주소 등으로 구성되어 있습니다. 이 데이터는 지역별 낚시어선업의 규모와 분포를 파악하고, 어업 관련 정책 수립이나 안전관리 대책 마련에 활용될 수 있습니다. 특히 승객 수용 능력과 항구 정보는 해양관광 수요 예측 및 해상안전 점검 등 다양한 분야에 응용 가능합니다. 데이터는 각 사업장의 운영 기간 및 종료 여부까지 포함하고 있어, 지속적인 업계 동향 파악에도 유용합니다.
