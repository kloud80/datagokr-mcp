summary_user: 국립농산물품질관리원이 관리하는 수입농산물 유통이력 신고를 연도·품목(HS코드·표준품명) 단위로 묶어 수입물량(kg), 신고건수, 신고업체수를 담은 전국 단위 집계 자료다. 유통업자나 분석가가 "특정 수입 농산물의 연도별 수입물량과 신고 업체 수가 어떻게 변했나" 같은 수입동향 질문에 쓴다. 전역 조인 키는 없고, 품목(HS)코드나 품목명으로 관세청 수출입 통계 같은 HS 기반 자료와 이어 쓰되, KAMIS·도매시장·KOSIS 품목코드와는 체계가 달라 별도 매핑이 필요하다.
description_portal: 국립농산물품질관리원에서 관리하는 연도별, 품목별 수입농산물유통이력 품목별 신고현황으로, 연도, 품목명, HS코드, 수입물량, 신고 건수, 신고 업체수 항목으로 구성된 데이터입니다. 농산물 품목별 수입농산물 신고현황, 농산물 원산지별 수입농산물 신고현황, 관할사무소별 수입농산물 신고현황, 기간별 수입농산물 신고현황 등 통계자료를 작성하여 수입농산물 검사에 대한 각종 보고서 작성 등 업무에 활용할 수 있을 것으로 기대되며, 수입동향 파악 등 자료로도 활용이 가능할 것으로 기대됩니다.
