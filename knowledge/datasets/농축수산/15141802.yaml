description_portal: 본 데이터는 부안군의 관할 구역 내에서 시행되는 연안 개량 안강망 어업에 대한 연도별 허가 건수 현황을 정리한 것이다. 수록 항목은 기준연도, 어업 허가 건수, 시도명, 시군구명, 데이터기준일자로 구성되어 있으며, 특정 시점에서의 지역별 어업 허가 추이를 명확히 파악할 수 있다. 연안 개량 안강망은 근해 수역에서 어획 활동을 수행하는 방식으로, 어업 질서와 수산 자원 보호를 위해 허가가 필요한 유형이다. 본 자료는 수산행정, 어업정책 수립, 연구 및 민간 활용 등 다양한 분야에서 기초자료로 활용 가능하며, 부안군의 어업 허가 행정에 대한 투명성과 이해도를 높이는 데 기여한다. 특히 행정구역별로 구분된 데이터를 통해 지역별 어업 활동의 특성과 변동을 파악할 수 있으며, 어업 자원 관리의 효과성 제고에도 이바지한다.
