summary_user: 경기도 시군·읍면동별로 기준연도마다 집계한 반려동물 등록 현황으로, 등록 마리 수와 등록 경로(시군구·대행업체·기타), 등록 방식(내장형·외장형 무선식별장치, 인식표), 품종 수, 소유자 수, 등록대행업체 수를 담는다. 지자체 담당자나 분석가가 어느 읍면동에서 등록 실적이나 내장형 칩 비율이 낮은지, 소유자 1인당 등록 마리 수(owner_reg_animal_cnt_vl)가 지역마다 어떻게 다른지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와 잇으려면 시군명·읍면동명을 행정구역 코드에 이름으로 매핑한 뒤 인구 등 지역 통계와 연결해야 한다.
description_portal: 이 데이터는 경기도 내 읍면동 단위로 집계된 반려동물 등록 현황 자료로, 각 지역의 연도별 등록 마리 수, 동물 품종 수, 소유자 수, 등록대행업체 수 등을 포함하고 있습니다. 반려동물 등록제는 유기 동물 방지 및 보호자 책임 강화를 위한 제도이며, 해당 데이터는 지역별 등록 실적과 등록유형 분포를 비교 분석할 수 있는 기초자료로 활용됩니다. 또한 반려동물 관련 인프라 구축, 대행업체 정책 설계, 지역별 보호·복지 수요 예측 등에 유용하며, 등록 마리 수 대비 소유자 수 비율 분석 등을 통해 제도의 실효성 검토에도 활용 가능합니다.※ 일부 시군들의 경우 해당 시군의 전체 등록 현황이 제공됩니다.
