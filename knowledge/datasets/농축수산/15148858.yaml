description_portal: 이 데이터는 해양수산부에서 해조류 종조성에 의거한 생태지수에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 년도, 구분명, 평가서명, 정점순번, 정점번호, 위도(Latitude), 경도(Longitude), 시작년도 (YYYY), 시작월 (MM), 시작일 (DD), 종료년도 (YYYY), 종료월 (MM), 종료일 (DD), 종수(Number of species), 풍도(Abundance)(cells/ml), 풍부도 지수(Richness index), 균등 지수(Evenness index), 다양도 지수(Diversity index), 우점도 지수(Dominance index) 데이터로 구성되어 있습니다.본 데이터는 해조류 종조성에 의거한 생태지수 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해조류 종조성에 의거한 생태지수란 해조류의 종류와 양이 얼마나 다양한지 측정하여 해양 생태계의 건강성을 평가하는 지수을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
