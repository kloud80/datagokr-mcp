description_portal: '산림청이 수립한 춘천경영계획구 내 국유림을 대상으로 한 숲가꾸기 활동의 이력 정보를 체계적으로 기록한 데이터입니다. 이 자료는 임소반 단위 경영계획부 번호를 기준으로 하여, 해당 지역에서 이루어진 숲가꾸기 작업의 종류, 시기, 규모, 인력 소요 등을 종합적으로 파악할 수 있도록 구성되어 있습니다. 주요 항목으로는 숲가꾸기번호, 숲가꾸기 종구분코드(예: 솎아베기, 가지치기 등), 작업면적(ha), 작업 횟수, 노동력 투입 정보 등이 포함되어 있으며, 이는 산림의 생장 촉진, 건강성 유지, 재해 예방을 위한 핵심 관리 이력을 제공합니다.'
