summary_user: 경기도 내 배합사료 제조업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 시군명·사업장명·인허가일자·영업상태·폐업일자·주소·WGS84 좌표·소재지면적·총종업원수를 포함하며 범위는 경기도 전역이다. 사료산업 분석가나 축산 정책 담당자가 '경기도 어느 시군에 영업 중인 배합사료 공장이 몰려 있고 규모는 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 경기도 보조사료·수입사료 업체 현황 같은 같은 기관 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 배합사료 제조업체의 인허가 현황을 제공합니다. 배합사료란 단미사료·보조사료 등을 적절한 비율로 혼합하거나 가공하여 가축의 영양 균형을 맞추는 사료를 말합니다. 주요 제공 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘우편번호’, ‘WGS84 위도·경도’, ‘소재지면적’, ‘총종업원수’, ‘축산물가공업구분명’, ‘축산업무구분명’ 등이 포함됩니다. 이를 통해 제조업체의 위치, 운영 상태, 규모 및 인력 현황을 구체적으로 확인할 수 있습니다. 해당 데이터는 경기도 31개 시군 단위로 제공되며, 축산업 현황 분석, 사료산업 정책 수립, 지역별 생산·유통 관리, 가축 사육 효율성 연구 등 다양한 분석에 활용 가능합니다. 또한 보조사료·수입사료 데이터와 비교하여 경기지역 사료산업의 구조적 특성과 공급망을 종합적으로 이해하는 데 기여할 수 있습니다.
