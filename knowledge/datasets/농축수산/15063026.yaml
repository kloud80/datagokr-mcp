summary_user: 구미시 지역 농산물의 도매·소매 구분별로 품목 분류, 상품명, 단위, 당일 경락가격과 1일 전·1개월 전·1년 전 가격, 등락률을 담은 파일(약 10KB csv)로, 데이터 기준일자 시점의 가격 스냅숏이다. 농민·유통업자·소비자가 '구미 지역에서 특정 농산물 가격이 한 달 전이나 1년 전보다 얼마나 올랐나'를 확인하거나, 지자체가 지역 물가 동향을 볼 때 쓴다. 전역 조인 키는 없고 상품번호가 KAMIS·도매시장·KOSIS 품목코드와 다르기 때문에, 다른 가격 데이터와 이으려면 상품명이나 품목코드를 따로 매핑해야 한다.
description_portal: 본 공공데이터는 경상북도 구미시 지역 내 농산물 경매 및 유통 가격 동향을 파악할 수 있는 정보로, 지역 경제 및 농업정책 수립에 유용하게 활용될 수 있도록 수집·정리된 자료입니다. 해당 데이터는 농산물의 도매 및 소매 구분, 농산물 분류, 상품명, 단위 그리고 당일 경매 낙찰 가격을 포함하여 1일 전 가격, 1개월 전 가격, 1년 전 가격과 같은 시계열 가격 정보, 가격 등락률까지 폭넓게 제공합니다.이 데이터는 농산물의 가격 변동 추이를 분석하고, 유통시장 구조 및 계절별 수급 변동 파악에 활용될 수 있으며, 농민, 유통 종사자, 소비자뿐 아니라 행정기관 및 연구기관에서도 시장 예측, 물가 안정 정책, 유통 효율성 제고, 농산물 유통 구조 개선 등을 위한 기초자료로 사용 가능합니다. 또한, 지역 농산물의 경쟁력 분석, 가격 안정 대책 마련, 유통 경로 분석 등 다양한 정책적·경제적 판단의 근거로서 활용도가 높습니다.
