summary_user: 한국산림복지진흥원이 조성을 지원한 전국 무장애나눔길 167건을 길 단위로 담은 파일 데이터이며, 조성연도·관리기관·사업명·주소·좌표·조성길이(m)가 들어 있다. 장애인·고령자 등 이동약자가 이용할 수 있는 숲길이 어느 지역에 얼마나 조성돼 있는지 살피려는 분석가나 지자체 담당자가 쓴다. 주소(address)와 위도·경도(coord)를 키로 휴양림·치유의숲·등산로 등 다른 산림 복지·휴양 데이터나 지도 데이터와 위치 기준으로 이어 쓴다.
description_portal: 해당 데이터는 한국산림복지진흥원이 전국적으로 조성지원을 실시한 무장애나눔길의 조성 현황을 나타내는 정보입니다. 주요 항목으로는 조성연도, 관리기관, 사업명, 주소, 위도, 경도, 조성길이 등이 포함되어 있습니다. 이 데이터는 산림복지서비스 이용자의 접근성 향상과 장애인·고령자 등 이용약자를 위한 이동편의시설의 분포를 파악하는 데 중요한 기초자료로 활용될 수 있으며, 산림복지 인프라 확충과 관련된 정책 수립 및 연구 계획 수립 현황 분석 등 다양한 공공·학술 목적으로 활용될 수 있는 데이터입니다.
