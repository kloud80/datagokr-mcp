description_portal: 경상남도는 도내 위판장, 양식장 등 수산물의 생산단계에서 안전성을 확보하기 위해 연도별로 체계적인 검사를 실시하고 있으며, 해당 검사는 검사 건수, 검사 지역, 검사 품목, 검사 항목, 검사 결과 등의 항목으로 구분되어 관리됩니다. 주요 검사 항목으로는 방사능, 중금속, 동물용 의약품 등이 포함되며, 이는 국민 건강에 직결되는 유해 물질의 검출 여부를 중점적으로 확인하기 위한 것입니다. 특히, 해양환경 및 수산물 소비 증가에 따라 식품 안전성에 대한 관심이 높아지고 있는 상황에서, 경상남도는 철저한 검사 체계를 통해 도민이 안심하고 수산물을 소비할 수 있도록 노력하고 있습니다. 수거된 시료는 정해진 절차에 따라 공인기관에서 분석되며, 기준치를 초과하는 유해 물질이 검출된 경우 해당 수산물은 유통 단계에서 차단되거나 행정 조치가 취해집니다. 이러한 검사 활동은 연도별 통계로도 관리되며, 수산물의 안전한 유통과 국민 건강 보호에 기여하고 있습니다.
