summary_user: 농업법인 경영체를 한 건씩 담은 파일로, 설립년도·법인형태·대표자 생년과 성별·도로명주소 일부, 조합원·준조합원별 출자자 수와 출자금액, 내외국인 상용종사자 수, 생산·가공·유통·수출·관광휴양 등 주요사업 여부를 전국 범위로 담는다. 분석가나 지자체 담당자가 '우리 지역 영농조합·농업회사법인 중 가공·수출을 주요사업으로 하는 곳은 몇 곳이고 출자 규모와 고용 인원은 어느 정도인가'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 다른 기업·법인 데이터와 이어 쓴다.
