description_portal: 전북특별자치도 전주시 양식업 현황 데이터는 전주시 관내 양식업 운영 현황을 체계적으로 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 구분, 면허번호, 시설종류, 양식장명, 도로명주소, 지번주소, 위도, 경도, 면적, 품종 등의 정보를 포함하여 관내 양식장의 위치, 규모 및 운영 특성을 종합적으로 확인할 수 있도록 구성되었습니다.특히 양식장 위치정보(위도·경도)와 시설종류, 면적, 품종 정보를 함께 제공함으로써 수산·내수면 양식업 현황 분석, 지역 산업 구조 파악, 연구·정책 수립 기초자료로 활용할 수 있도록 설계되었습니다. 또한 시민과 관련 종사자가 양식업 분포 및 운영 현황을 쉽게 확인할 수 있어 산업 동향 분석, 창업·투자 검토, 행정 서비스 개선 자료 등 다양한 분야에서 활용이 가능합니다.전주시는 본 데이터를 통해 지역 양식산업 운영의 투명성을 제고하고 공공정보 접근성을 강화하는 것을 목표로 하며, 면허 변경, 신규 등록 및 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 동물정책과에서 제공·관리합니다.
