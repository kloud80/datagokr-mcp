summary_user: 과실출하약정 사업실적을 사업연도·지역본부·사업방식·품목별로 약정 물량(톤)·약정액과 출하 물량·출하액, 출하율을 묶어 담은 전국 단위 요약 집계다. 정책 담당자나 산지 유통 조직이 '특정 연도에 사과·배 같은 과실의 약정 대비 실제 출하 실적이 얼마였나'를 확인하는 데 쓴다. 전역 조인 키가 없어 KAMIS 가격 등 다른 데이터와는 품목명·연도를 직접 맞춰 이어 써야 하고, 품목코드가 KAMIS·도매시장·HS·KOSIS마다 달라 매핑이 필요하다.
description_portal: 해당 데이터는 과실수급출하약정 사업실적 현황에 관한 정보로, 주요 항목에는 품목, 약정실적, 출하약정액 등이 포함되어 있습니다. 본 데이터는 정책 담당자에게는 과실 유통 정책 수립 및 가격 안정 대책 마련의 근거가 되고, 농업인과 산지 유통 조직에게는 출하 전략을 세우는 참고 자료로 활용됩니다. 또한 연구자와 산업 관계자에게는 과실 유통 구조와 가격 형성 메커니즘을 분석할 수 있는 실증적 데이터를 제공하여, 장기적으로 과수 산업의 안정적 성장과 농업 경쟁력 강화에 기여할 수 있는 의미 있는 자료라 할 수 있습니다.
