summary_user: 우리나라 9정맥 주요 코스 구간을 지점 단위로 담은 API로, 경로식별자(crseId)·숲길식별자·숲길명별로 위도·경도·해발고도·노면유형과 기준일시를 제공하며 범위는 전국이고 좌표 단위로 기록된다. 등산객이나 트레킹 앱 개발자, GIS 분석가가 '특정 정맥 구간의 고도 변화와 노면 상태가 어떤지'를 확인하거나 코스를 지도에 시각화할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않아, 숲길명 매칭이나 위경도 좌표 기반 공간 결합 또는 같은 기관(한국등산트레킹지원센터)의 다른 숲길 데이터와 식별자로만 연결한다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 5일에 등록하여 제공하는 오픈API 서비스로, 우리나라 9정맥의 주요 코스 구간에 대한 정보를 조회할 수 있는 서비스입니다.API를 통해 경로식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천노면유형명, 원천노면유형코드, 기준일시 등의 속성을 호출할 수 있으며, 이를 활용해 9정맥 코스의 위치좌표, 고도, 노면특성 등을 기반으로 한 경로분석, 트레킹 코스 시각화, 탐방로 관리 및 GIS 공간분석 등에 활용이 가능한 정보를 JSON+XML 포맷으로 지원합니다.
