description_portal: 이 데이터는 해양수산부에서 넙치방류계획리스트에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 제목, 보급량, 내용, 작성일, 접수시작, 접수종료, 폐기 여부, 방류장소, 펀드, 방류시작, 방류종료 데이터로 구성되어 있습니다.본 데이터는 넙치방류계획리스트 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.넙치방류란 인공적으로 키운 어린 넙치(광어)를 바다 등 자연 서식지에 풀어주어, 줄어든 어족 자원을 늘리고 건강한 바다 생태계를 회복시키려는 활동을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
