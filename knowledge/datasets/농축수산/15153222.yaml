description_portal: 이 데이터는 해양수산부에서 부유생태계에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은  부유생태계_식물플랑크톤 현존량, 부유생태계_식물플랑크톤의 종조성에 의거한 생태지수, 부유생태계_식물플랑크톤 Chla의 정점별 현존량, 부유생태계_동물플랑크톤 현존량, 부유생태계_동물플랑크톤의 정점별 생태지수, 부유생태계_동물플랑크톤의 주요 우점종 데이터로 구성되어 있습니다.본 데이터는 자원기본정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.부유생태계란  물에 떠다니며 사는 부유 생물들로 이루어진 생태계를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
