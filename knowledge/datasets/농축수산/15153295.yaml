summary_user: 해양수산부가 만든 해양공간 특성평가격자 정보를 격자 단위로 담은 데이터로, 격자 번호(LTC_NO)·특성평가격자 식별자·평가지역 이름과 식별자 등이 들어 있으며 범위는 전국이고 행정단위로 나뉘지 않는 비공간 형태로 제공된다. 해상풍력 등 해양 입지를 검토하는 사업자나 분석가가 특정 해역이 어떤 특성평가지역에 속하는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 평가지역 이름·식별자 매핑이나 같은 기관의 해양공간 데이터(해양용도구역 등) 코드로만 이어 쓴다.
