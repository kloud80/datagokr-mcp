description_portal: 본 데이터는 경기도 용인시 내에서 운영 중인 농식품가공업체의 현황 정보를 제공한다. 주요 항목은 업체명, 연락처, 주소, 대표품목으로 구성되어 있으며, 각 업체별 생산 및 가공 품목, 위치, 연락처 등 기본 정보를 체계적으로 수록하고 있다. 이를 통해 용인시 관내 농식품가공업체의 분포, 주요 가공품 현황, 지역 특화 식품 생산 내역 등을 종합적으로 파악할 수 있다. 자료는 농식품 유통 및 판매 정책 수립, 지역경제 활성화, 농업 6차 산업화 지원, 식품 안전관리, 가공업체 네트워크 구축 등 다양한 목적으로 활용된다. 시민, 정책 담당자, 연구자, 창업 희망자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 업체 현황이 반영되어 정기적으로 갱신된다. 공공데이터 개방을 통해 정보의 투명성과 활용성을 높이고, 지역 농식품 산업 발전과 경쟁력 제고에 기여하는 것을 목표로 한다.
