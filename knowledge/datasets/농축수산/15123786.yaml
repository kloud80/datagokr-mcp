description_portal: '농림수산식품교육문화정보원_SPS지원서비스_법령정보는 SPS(위생 및 식품안전) 관련 법령 정보에 관한 데이터입니다. 이 데이터는 품질 관리 및 안전성을 보장하기 위해 필요한 법적 기준을 사용자에게 제공합니다. 본 데이터는 식품 안전 및 위생 관리에 관련된 다양한 법령과 규정을 포함하고 있으며, 연구, 정책 수립 및 관계 기관의 법령 준수 등을 위한 유용한 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 일련번호(숫자형): 데이터의 고유 식별 번호, 담당기관국문(숫자형): 법령을 관할하는 기관의 한국어 이름과 연관된 숫자 코드, 공포일자(날짜형): 법령이 공식적으로 공포된 날짜, 시행일자(날짜형): 법령의 효력이 발생하는 날짜, 법령국문명(문자형): 법령의 한국어 이름, 법령영문명(문자형): 법령의 영어 이름, 링크국문주소(문자형): 한국어로 된 법령의 링크, 링크영문주소(문자형): 영어로 된 법령의 링크, 사용여부(문자형): 데이터의 실제 사용 여부, 공개여부(문자형): 데이터의 공개 여부, 국문여부(문자형): 한국어 지원 여부, 영문여부(문자형): 영어 지원 여부, 첨부국문일련번호(숫자형): 첨부 문서의 식별 번호, 첨부일련번호(숫자형): 일반 첨부 문서의 식별 번호 정보를 포함하고 있습니다. 이러한 정보를 통해 사용자들은 법령에 대한 전반적인 이해를 돕고, 필요한 법적 기준에 쉽게 접근할 수 있습니다.'
