description_portal: 병이나 걱정되는 증세를 다스리는 식품 처방 정보 제공 본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘식품힐링’ 콘텐츠에 대한 상세 정보이다. 식품을 통한 건강 증진과 심리적 안정에 기여하는 식생활 콘텐츠로, 식품 성분의 효능, 질병 예방 효과, 면역력 강화에 도움이 되는 식재료 정보 등을 포함하고 있다. 또한, 대상별(노인, 어린이, 직장인 등) 맞춤 식단 구성, 계절별 건강식 레시피, 바른 먹거리 실천 사례 등이 함께 제공되어 실용성과 활용도를 높이고 있다. 자료는 이미지, 영상, 인포그래픽 등을 통해 제공되며, 식습관 개선 및 식품을 통한 웰빙 실천을 지원한다. 일상 속에서 쉽게 적용할 수 있는 식품 기반 치유 정보를 담고 있으며, 교육과 홍보자료로도 활용 가능한 콘텐츠이다.
