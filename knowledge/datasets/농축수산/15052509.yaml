summary_user: 국립농산물품질관리원이 안전성조사 때 채취한 농산물 시료의 방사능 검사 결과를 연도·국내산/수입산 구분·품목별 검사건수, 적합건수, 부적합건수로 집계한 전국 단위 통계다. 소비자나 분석가가 "특정 연도에 수입 농산물에서 방사능 부적합 판정이 몇 건 나왔는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명을 이름으로 매핑하거나 같은 기관 자료와 연결해야 하며, KAMIS 등과 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 안전성조사는 농산물의 생산·유통·판매 단계에서 농약 등 유해물질 안전성조사를 통해 부적합품의 시중 유통을 차단하여 안전한 농산물을 공급을 목적으로 도입되었으며, 농산물 방사능 검사는 안전성조사시 채취한 시료에서 방사능이 검출되는지 분석하는 것으로 본 정보는 국립농산물품질관리원에서 관리하는 농산물 방사능 검사 현황 정보로서, 검사 연도, 국내산/수입산 구분, 품목, 검사 건수, 적합 건수, 부적합 건수 항목으로 구성되어 있습니다. 농산물 안전성에 관한 사항 중 방사능과 관련된 사항에 관심이 많은 경우 유용한 정보가 될 것으로 기대됩니다.
