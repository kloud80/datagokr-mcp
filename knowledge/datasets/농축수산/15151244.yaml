description_portal: 이 데이터는 도매시장에서 월별로 거래된 농수산물 품목의 물량, 금액, 평균 경락가격 정보를 제공하기 위해 구축된 자료입니다. 주요 항목에는 정산월, 대분류명, 중분류명, 소분류명, 총물량(kg), 총금액(원), 평균경락가가 포함되어 있습니다. 품목별로 거래 규모와 가격 변동을 분석할 수 있으며, 유통 경향 파악, 시장 동향 분석, 가격 예측 및 정책 수립의 기초 자료로 활용됩니다. 본 데이터는 월별 단위의 도매시장 거래 통계를 표준화된 형식으로 제공하여 농수산물 유통 구조의 투명성과 효율성을 높이는 데 기여합니다.
