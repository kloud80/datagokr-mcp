summary_user: 스마트축산 한우 개체별로 농장아이디·개체식별번호·생년월일·성별·계대와 함께 냉도체중·등심단면적·등지방두께·근내지방의 예상유전전달능력(EPD) 등급과 지수를 담은 개체 단위 원천 데이터로, 범위는 전국이다. 한우 농가나 육종·축산 분석가가 "우리 농장 소 중 도체중과 근내지방 유전능력이 높은 개체는 어느 것인가"처럼 번식·선발 개체를 고르는 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 개체식별번호나 농장아이디 같은 값의 이름·코드 매핑 또는 같은 기관 데이터끼리만 연결한다.
description_portal: '농림수산식품교육문화정보원에서 제공하는 한우의 예상유전전달능력(EPD)에 대한 데이터는 한우의 유전적 특성과 향상 가능성을 분석하는 데 필수적인 역할을 합니다. 이 정보에는 냉도체중등급, 냉도체중지수, 등심단면적등급, 등심단면적지수, 등지방두께지수 등의 다양한 지표가 포함되어 있으며, 이를 통해 한우의 성장과 품질 향상에 기여할 수 있습니다. 예상유전전달능력은 축산업계에서 중요한 의사결정을 하는 데 매우 유용하게 활용되며, 상관관계 분석을 통해 보다 나은 생산성과 품질 개선을 도모할 수 있게 합니다. 이 데이터는 다음과 같은 구조로 이루어져 있습니다.- 농장아이디(숫자형): 농장의 식별 아이디로, 유일하게 각 농장을 나타냅니다.- 개체식별번호(숫자형): 각 개체를 식별하는 번호로, 동일 농장 내에서 중복되지 않습니다.- 생년월일(문자형): 개체의 태어난 날짜를 나타내며, 품질 개선에 도움이 되는 정보입니다.- 성별구분(숫자형): 개체의 성별을 나타내는 수치로, 유전적 사실에 따라 다양한 데이터 분석에 활용됩니다.- 계대(문자형): 혈통의 계통을 나타내며, 이력 추적에 유용하게 사용됩니다.- 냉도체중등급(문자형): 가축의 고기 품질을 나타내는 등급으로, 소비 시장에 미치는 영향을 분석하는 데 기여합니다.- 냉도체중지수(숫자형): 냉도체중 성과를 수치적으로 나타내며, 육질 평가에 중요한 영향을 미칩니다.- 등심단면적등급(문자형): 등심의 단면적 등급을 나타내며, 고기 시세에 영향을 미치는 지표입니다.- 등심단면적지수(숫자형): 등심 단면적의 성과를 정량적으로 나타내며 데이터 분석에 중요한 역할을 합니다.- 등지방두께등급(문자형): 지방의 두께를 등급화한 것으로, 고기 품질과 밀접하게 연관되어 있습니다.- 등지방두께지수(숫자형): 지방 두께의 수치적 평가는 고기 품질 향상에 의사결정의 기준으로 작용합니다.- 근내지방등급(문자형): 근육 내 지방의 등급을 나타내며, 육류 제품의 등급에 영향을 줍니다.- 근내지방지수(숫자형): 근내 지방의 성과를'
