summary_user: 해양수치모델용 150m 간격 수심 격자 데이터로, 지점별 위도·경도·수심 값을 건별로 담으며 API 전체 427,829건이 전국 범위를 다룬다. 해양 연구자나 해양공학 분석가가 특정 해역 좌표 범위의 해저 지형과 수심이 어떤지 알아볼 때 쓴다. 위도(lat)가 좌표 조인 키라서 좌표 기반의 해양공간 구역 자료나 해상풍력 입지 검토 자료와 위치로 이어 쓴다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 수심측량자료를 이용하여 제작된 해양수치모델용 150m 간격 수심 데이터셋 정보를 제공하기 위해 수집한 데이터입니다.  검색대상 위치의 최대/최소 위·경도 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 위도, 경도 좌표와 해당 지점의 수심 값 정보로 구성되어 있습니다.  본 데이터는 해양 연구기관의 해저 지형 분석이나 공공기관의 해양영역 기초자료로 활용될 수 있으며, 해양공학 분야에서 해저 지형에 기반한 모델링, 연안 개발 계획 수립, 선박 운항 시뮬레이션 등에 활용할 수 있습니다.
