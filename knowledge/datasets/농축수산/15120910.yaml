summary_user: 산림생물다양성 정맥 조사사업에서 설정한 동물상·식물상·식생 조사구간의 기본정보를 구간별로 담은 CSV 파일(약 640KB)로, 조사권역명, 세부구간 정보, 조사시기, 식생조사 일시와 조사자명 등을 포함한다. 연구자나 현장 조사자가 '이 정맥 구간에서 식생조사가 언제, 누구에 의해 이뤄졌나'를 확인하거나 반복·장기 모니터링 구간을 정하는 데 쓴다. 전역 조인 키는 없으며, 같은 사업의 동물상·식물상 조사 결과 자료와는 정맥사업·조사구간 식별번호나 조사권역명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 산림생물다양성 정맥 동물상 및 식물상 조사구간 기본정보는 산림의 생물다양성을 체계적으로 파악하기 위해 설정된 조사구간에 대한 위치, 면적, 지형·지질, 식생유형 등의 공간 정보를 제공합니다. 또한 정맥을 따라 분포하는 주요 동물상과 식물상의 서식 현황, 보호종 및 침입종 출현 여부, 군집 구조와 종 구성의 특징 등을 함께 제시하여, 산림생태계 건강성 평가와 보전 우선지역 선정의 기초 자료로 활용할 수 있습니다. 아울러 세부구간정보와 조사시기를 함께 제공함으로써 향후 반복 조사, 장기 모니터링, 환경영향평가 및 관련 정책 수립 시 참고할 수 있는 표준화된 기반 정보를 제공합니다. 이 자료는 연구자와 행정기관, 현장 조사자들이 동일한 기준으로 데이터를 수집·비교할 수 있도록 돕는 것을 목표로 합니다.
