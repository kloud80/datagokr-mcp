description_portal: 이 데이터는 해양수산부에서 갯벌조사에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 공간정보일련번호, 해양생태조사정점아이디, 갯벌생태조사정점번호, 갯벌조사위도목록, 갯벌조사경도목록, 갯벌조사도위도, 갯벌조사분위도, 갯벌조사초위도, 갯벌조사도경도, 갯벌조사분경도, 갯벌조사초경도, 갯벌조사위도, 갯벌조사경도, 갯벌조사년도, 정점명, 공간정보 데이터로 구성되어 있습니다.본 데이터는 갯벌조사 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.갯벌조사란 연안 습지의 환경, 생태, 오염 현황 등 전반적인 실태를 파악하고, 이를 통해 갯벌을 보전·복원하며 지속가능하게 이용하기 위한 과학적 기초자료를 마련하는 조사를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
