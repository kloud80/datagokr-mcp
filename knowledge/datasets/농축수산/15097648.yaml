description_portal: 데이터는 2019년 1월부터 3월까지 경기도 화성시 내 포도 스마트팜 농가의 휴면기 기간 동안 수집된 습도 정보를 수록한 것이다. 스마트팜 환경제어 시스템을 통해 자동으로 측정된 실내 습도 수치는 각 농가별로 일 단위로 기록되어 있으며, 정밀한 생육환경 분석과 휴면기 관리에 참고할 수 있도록 구성되어 있다. 본 데이터는 포도 재배 스마트농가의 휴면기 관리 실태를 파악하고, 향후 생육환경 최적화를 위한 기초자료로 활용 가능하다. 데이터는 농가별로 구분되어 있으며, 측정 날짜, 습도 값, 측정 위치 등의 항목을 포함한다. 수집은 휴면기(1~3월) 기간 동안 이루어졌으며, 데이터는 1회성으로 제공된다. 포도 생육 시기 전의 환경 분석이나 지역별 농가 특성 비교 등에 활용될 수 있다.
