description_portal: 식물 신품종 육성자의 권리를 부여하기 위하여 품종보호제도를 운영하고 있으며, 신품종을 출원한 품종에 대한 서류심사, 재배심사, 종합심사 등을 거쳐 신품종을 등록하고 있다.해당 데이터는 1998년부터 2024년까지 국립종자원에 품종보호 출원된 품종에 대한 목록(출원번호, 출원일자, 작물명, 품종명, 출원인, 공개번호)에 대한 자료이다.데이터 기준일까지 우리나라에 출원한 품종과 주요 품종에 대한 출원 내역을 파악할 수 있어, 신품종 육성가 등에게 유용한 자료이다.국립종자원에 출원한 품종으로 산림종자, 수산식물종자는 제외한 자료이다.
