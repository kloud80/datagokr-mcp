summary_user: 전국 숲길 연결망 위의 관심지점(POI)을 지점 한 건씩 담으며, 각 지점마다 숲길 식별자·숲길명, 위도·경도·해발고도, 장소 유형과 장소명, 설명, 이정표 목적지(최대 4개)와 방향 정보를 제공한다. 등산객이나 탐방 서비스 개발자가 '이 숲길 갈림길 이정표는 어느 방향으로 어디를 가리키는가'를 확인하거나, 분석가가 숲길 간 연결 구조를 지도 위에 그릴 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로, 같은 기관의 숲길 데이터와는 숲길 식별자(frtrlId)나 숲길명으로, 그 밖의 데이터와는 좌표나 이름 매핑으로 연결한다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 1월 4일에 등록하여 제공하는 오픈API 서비스로, 숲길 연결망에 대한 관심지점(POI) 정보를 제공하는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 원천장소유형명, 원천장소유형코드, 장소명, 설명내용, 기준일시, 원천조사진행방향명, 이정표목적지명, 원천이정표목적지방향명, 원천이정표목적지코드 정보를 호출할 수 있으며, 이를 활용하여 숲길 간 연결구조 분석, 탐방경로 네트워크 시각화, GIS 기반 경로 최적화, 이정표 및 방향정보 연계 서비스 구축 등 다양한 분야에서 활용할 수 있는 정보를 JSON+XML 포맷으로 지원합니다.
