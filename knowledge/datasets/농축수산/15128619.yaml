description_portal: 한국농어촌공사 농지은행은 경영규모·연령별 농가의 성장단계별로 지원하는 맞춤형농지사업, 노동력부족·고령화로 자경하기 어려운 농지를 임대위탁받아 전업농 등에게 임대하는 임대·수탁사업, 과수원전업농육성대장자를 지원하는 과원규모화사업, 자연재해, 부채의 증가 등으로 일시적 경영위기에 처한 농가를 지원하는 경영회생지원사업, 농업인이 소유한 농지를 담보로 노후생활안정자금을 매월 연금방식으로 지급하는 농지연금사업을 운영중이며, 맞춤형농지사업 중  선 임대 후 매도 사업에 대한 계약 통계자료를 제공합니다.- 선 임대 후 매도 사업이란 청년농이 희망하여 직접 확보한 농지를 공사가 매입 후 청년농에게 매도를 목적으로 조건부 임차하여 청년농이 원리금 상환 후 소유권을 청년농에게 이전하여 영농기반을 마련하고 안정적을 정착을 지원하는 사업입니다.- 본 데이터는 구분별, 계약년도별, 권역별 계약건수(건) 및 계약면적(제곱미터)의 합계내역을 권역별 통계자료를 제공합니다.
