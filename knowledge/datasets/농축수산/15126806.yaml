summary_user: 어선 한 척(비식별 처리된 어선 ID) 단위로 길이·너비·톤수·낚시어선 여부와 항적 공간정보(공간정보)를 담은 전국 범위 파일 데이터로, CSV 한 건(약 20MB)으로 받는다. 해양 정책 분석가나 연구자가 '낚시어선과 일반 어선의 항해 경로가 어느 해역에 몰리는가', '선박 크기별로 운항 범위가 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했고 어선 ID도 암호화돼 있어 어선 등록·허가 원장과 직접 이을 수 없으며, 공간정보를 해역·격자 등 다른 공간 데이터와 겹쳐 보는 방식으로 연결한다.
description_portal: 이 데이터는 해양수산부에서 어선의 항적도(선박이 항해하는 경로와 위치를 기록하는 지도 또는 차트)에 대한 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 데이터 일련번호, 비식별 처리된 어선 ID, 어선의 길이, 톤수 등 어선 정보와 어선의 항적도 공간정보 데이터로 구성되어 있습니다.본 데이터는 어선의 운항 이력 분석, 해상 사고 발생 시 어선 위치 파악, 선박 관리, 해양 활동 연구, 어업 정책 수립, 관련 규정 준수 여부 확인 등 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.
