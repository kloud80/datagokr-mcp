summary_user: 농림수산식품교육문화정보원이 게시한 농식품 분야 세미나·토론회 안내를 게시글 한 건 단위로 담으며, 각 건은 게시 메뉴명·제목·내용·등록일로 이루어진 전국 범위의 비공간 자료다. 농업 정책 연구자나 업계 실무자가 '최근 어떤 농식품 정책·이슈를 주제로 세미나가 열렸나'를 등록일과 제목으로 찾아보는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 제목·내용 속 이름을 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: '농림수산식품교육문화정보원에서 제공하는 농식품 관련 세미나 및 토론회 정보 데이터는 농업 및 식품 산업 분야에 종사하는 전문가와 연구자, 정부 관계자들이 참여하는 중요한 자료입니다. 이런 자료들은 농업 정책 개발 및 실행에 있어 핵심적인 역할을 할 수 있으며, 정책 방향과 관련된 다양한 논의를 촉진하는 데 기여합니다. 데이터는 각 세미나와 토론회의 메뉴명, 제목, 내용, 등록일 등으로 구성되어 있으며, 이를 통해 사용자는 특정 행사에 대한 상세한 정보를 확인할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. - 메뉴명(문자형) : 메뉴의 이름- 제목(문자형) : 세미나의 공식 제목- 내용(문자형) : 세미나의 주요 내용 및 주제에 대한 설명- 등록일(날짜형) : 세미나가 등록된 날짜이 데이터를 활용하면 농식품 관련 최신 이슈와 정책을 이해하고, 유사한 분야에서 진행되는 행사에 대한 정보를 쉽게 찾아볼 수 있습니다.'
