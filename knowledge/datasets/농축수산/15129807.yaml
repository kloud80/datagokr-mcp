description_portal: 이 데이터는 해양수산부에서 공군훈련구역의 해양활용과 관련된 시설물 분포 및 조종사 훈련 구역 운영 정보를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 공군훈련장 내에서 운용되는 다양한 훈련 지역의 위치, 해양 구역 활용 상황, 해당 구역 내 존재하는 항공기 훈련 시설물의 분포 현황 등으로 구성되어 있습니다.   본 데이터는 국방 관련 기관에서 해양 및 항공기 훈련구역 관리계획 수립, 해양수산부 소관 해역별 이용 현황 조사, 해상 교통 및 해양시설 운영 조정, 그리고 공공기관이 훈련 구역 실태 분석 및 향후 확장 계획 자료로 활용할 수 있습니다.
