summary_user: 전국 해조류(김 제외) 종자 생산업체별로 품종 단위의 생산 시작·가이식 시기, 입식량·생산량, 육상·해상 시설 면적, 국내외 판매량·금액, 폐사량과 원인, 모조 보유·구입 현황을 담은 업체·품종별 조사 파일(CSV, 약 23KB)이다. 정책 담당자나 연구자가 미역·다시마·톳 같은 품종별 종자 생산량과 판매처, 폐사 원인 분포를 비교할 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없고 업체 명부 번호도 이 파일 안에서만 쓰는 번호여서, 다른 자료와는 품종명 같은 이름을 맞춰 연결해야 한다.
description_portal: 데이터 수집 목적 및 과정해조류는 해양생태계의 기초 생산자로서 수산자원 보호와 연안 생태계 건강성 유지에 중요한 역할을 합니다. 특히 미역, 다시마, 톳 등 김을 제외한 해조류는 지역 특화 산업과 식품·바이오 소재 산업에서 활용도가 높아 안정적인 종자 생산과 공급이 필요합니다. 한국수산자원공단은 전국 해조류 종자 생산업체를 대상으로 생산 현황과 시설 정보를 조사하여 데이터베이스를 구축하였습니다. 본 데이터는 해조류 종자의 품종별 생산 특성과 시설 기반을 종합적으로 파악하고, 자원조성 및 산업 정책 마련의 기초자료로 활용하기 위해 수집되었습니다.데이터 세부 항목데이터는 (업체 현황) 해조류 종자 생산업체 명부 번호, 사업장 소재지, 인허가 정보, (품종 정보) 해조류 품종명, 생산 시작 시기, (생산 현황) 입식량, 연간 생산량, 누적 생산량, (시설 현황) 육상 배양시설 면적, 해상 배양시설 현황 등으로 구성됩니다. 또한 품종별·지역별 생산량, 시설 규모에 따른 생산 특성, 연도별 생산 변동 자료를 포함하여 산업 분석과 정책 활용이 가능하도록 체계화되어 있습니다.활용 기대효과정부와 지자체는 본 데이터를 활용해 해조류 종자 생산과 공급 현황을 분석하여 지역별 산업 육성 정책, 신품종 개발 지원, 종자 보급 사업 수립에 활용할 수 있습니다. 학계·연구기관은 생산 시작 시기와 입식량, 시설 규모 자료를 토대로 품종별 생산성 분석, 생태적 특성 연구, 기후변화 대응 연구를 수행할 수 있습니다. 업계는 생산계획과 시설 현황 자료를 참고하여 시장 수요를 반영한 경영 전략과 종자 보급 계획을 마련할 수 있습니다. 또한 국민은 본 데이터를 통해 김 이외 해조류 종자산업의 규모와 중요성을 이해하고, 수산자원 관리와 지속가능한 산업 발전의 필요성을 인식할 수 있습니다.※ 제공 데이터는 개인정보 보호와 품질관리 절차를 거쳐 일부 원자료와 차이가 있을 수 있습니다.
