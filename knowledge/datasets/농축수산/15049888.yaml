description_portal: 이 데이터는 서귀포시의 주요 농산물별 연도별 조수익 및 생산량을 체계적으로 구성한 자료입니다. 감귤·기타 과수·채소류·식량작물·특용작물·화훼 등 다양한 구분이 포함된 수량 정보를 통해 농업 생산 구조를 이해할 수 있습니다. 행정기관은 이 데이터를 활용해 농업 정책 수립, 수입 대비 산출량 분석, 지역 농산물 수급 균형 평가, 농가 지원 우선순위 설정, 작목별 성장 추세 분석 등에 활용할 수 있습니다. 또한, 농업 연구기관 및 유통업체는 경향 분석과 시장 대응 전략 수립에, 지역 농가는 작목 전환 계획과 소득 향상 전략을 고민할 때 유용한 자료로 활용할 수 있습니다.
