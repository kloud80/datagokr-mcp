summary_user: 전남광주통합특별시 서부농수산물도매시장의 2025년도 거래실적을 품목별 거래물량(킬로그램)과 거래금액(원)으로 묶은 집계 파일이며, 포털 설명상 월별·법인별·거래방법별·부류별 실적과 청과·수산 품목별 실적을 담는다. 유통업자나 식자재 구매 담당자가 '이 도매시장에서 어떤 청과·수산 품목이 얼마나, 얼마어치 거래됐나'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 품목명으로 맞춰 이어 써야 하며, KAMIS·다른 도매시장 가격과 비교하려면 품목코드 체계가 서로 달라 따로 매핑해야 한다.
limits: 품목코드 같은 공통 키가 없어 KAMIS·KOSIS 등과 붙이려면 품목명 매핑 작업이 필요하다. 공간 정보가 없는 시도 단위 집계여서 산지·지역별 분석에는 맞지 않다.
