description_portal: '강원특별자치도 강릉시 관내 축산농가의 기본 현황을 정리한 데이터로, 농가(사업장)별 위치, 등록 축종, 사육두수, 축사 동수와 면적 등을 한눈에 확인할 수 있도록 구성된 자료입니다. 개별 축산농장을 단위로 정리되어 있어 지역 축산업 규모와 구조를 세부적으로 파악하는 데 활용할 수 있습니다.사업장명칭: 축산업을 영위하는 농가·회사 등 사업장의 공식 이름등록축종: 해당 사업장에서 사육·신고한 주요 축종(예: 한우, 젖소, 돼지, 닭, 오리 등)사업장소재지(지번): 사업장이 위치한 필지의 지번 주소(토지 대장 기준 위치 파악용)사업장소재지(도로명): 사업장의 도로명 주소(내방·지도 서비스 연계 등에 활용)사육두수: 사업장에서 실제로 사육 중인 가축의 두수(마릿수, 축종 합산 또는 신고 기준)동수(계): 축사를 포함한 사육시설의 동(건물) 개수(축사 규모와 구조를 가늠하는 지표)면적(계): 축산시설의 전체 면적 또는 축사 연면적 합계(제곱미터 단위)데이터기준일자: 축산농가 현황이 조사·취합·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 축산농가 분포와 사육 규모, 축사 시설 동수·면적을 체계적으로 파악할 수 있어, 지역 축산업 구조 분석, 가축전염병 방역 및 차단방역 계획 수립, 분뇨·악취 등 환경 관리 대상 농가 파악, 사료·수의서비스·축산 관련 인프라 수요 분석, 축산 정책 지원사업(보조금, 시설 현대화, 스마트축산 등) 대상자 선정 및 기초 자료로 활용할 수 있는 축산업 현황 데이터입니다.'
