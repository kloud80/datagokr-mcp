description_portal: 이 데이터는 해양수산부에서 한반도에 존재하는 갯벌의 위치를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 갯벌의 공간정보 일련번호, 갯벌 명칭, 갯벌의 위치를 나타내는 위도 및 경도 정보로 구성되어 있습니다.본 데이터는 유관 국가기관에서 해양 환경 연구, 갯벌 관리와 보호를 위한 정책 수립, 갯벌 인근 지역 개발 시 환경 영향 평가, 행정구역별 갯벌 분포 현황 분석 등 수행을 위한 기초 자료로 활용될 수 있습니다. 또한, 연구기관에서 해양 생태계의 변화 분석과 관련한 학술 연구 자료로도 사용될 수 있습니다.
