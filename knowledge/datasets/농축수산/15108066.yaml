summary_user: 전국 주요 봉우리 숲길 코스별로 숲길명, 코스 거리, 표고차, 난이도(쉬움·보통·어려움), 기준일시를 담은 건강효과 POI 조회 API이며, 검증 시 전체 8건이 수신되었다. 등산객이나 서비스 개발자가 내 체력에 맞는 코스를 거리·표고차·난이도로 고를 때, 또는 분석가가 코스별 신체 활동 강도를 추정할 때 쓴다. 숲길식별자(frtrlId)·코스식별자(crseId)로 같은 기관의 숲길·코스 데이터와 이어 쓰며, 전역 조인 키는 없어 다른 기관 자료와는 이름이나 코드 매핑이 필요하다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 11월 16일에 등록하여 제공하는 오픈API 서비스로, 전국 주요 봉우리 구간의 건강효과 관련 지표를 조회할 수 있는 서비스입니다.API를 통해 숲길식별자, 숲길명, 코스식별자, 난이도코드, 숲길코스거리, 표고차, 기준일시 등의 속성을 호출할 수 있으며, 이를 바탕으로 코스별 신체 활동 강도 추정, 난이도 기반 코스 추천, 건강·안전 서비스 연계, GIS 분석(거리·표고차 기반 가시화) 등 다양한 활용이 가능하며 JSON+XML 포맷을 지원합니다.
