summary_user: 경기도 사이버식물병원(사이버식물명원) 시스템에서 쓰는 시군구 행정단위 코드표로, 시군구 코드(signgu_cd)와 시군구 명칭 두 항목을 행정단위별 한 행씩 담는다. 병해 진단 의뢰 주소를 시군구 단위로 해석하거나 '어느 시군구에서 병해 진단 의뢰가 많은가'를 집계하려는 분석가가 지역 기준표로 쓴다. 같은 시스템의 시도 주소 테이블, 진단 의뢰 주소 테이블과 시군구 코드로 이어 쓰며, 실측상 전역 조인 키는 없어 다른 기관 데이터와는 시군구 이름이나 코드 매핑으로만 연결한다.
description_portal: 주소_시군구 테이블은 시도 하위의 시군구 행정단위 정보를 담고 있으며, 각 지역은 고유의 시군구 코드와 시군구 명칭으로 구성되어 있습니다. 이 데이터는 병해 진단 요청 시 입력된 주소를 시군구 단위로 분석하거나 행정단위별 병해 발생 현황을 파악하는 데 활용됩니다.이 테이블은 주소_시도와의 연계로 행정구역의 계층 구조를 구성하며, 진단_의뢰_주소 테이블에서 병해 발생 위치의 시군구 정보를 해석할 때 사용됩니다. 공간적 범주에 따른 병해 유형 분포 비교, 정책 수립을 위한 지역 기반 통계 분석 등에 활용 가능합니다.
