summary_user: 해양수산부 항만기본계획 중 국가관리연안항에 관한 정보를 항만·계획 단위로 담는다. 항만별 계획명, 계획연도와 완료연도, 위치, 항만 종류, 수역·육역 항만구역 면적, 방파제·안벽·물양장 같은 시설 규모, 접안·하역능력이 들어 있으며 범위는 전국이고 공간 좌표는 없다. 연구자나 지역 담당자가 "우리 지역 연안항의 계획상 접안능력과 시설 규모는 어느 정도인가"를 확인할 때 쓰고, 전역 조인 키가 없어 다른 데이터와는 항만명·위치명(PSTN_NM)으로 이름을 맞춰 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 해양수산부에서 제공하는 항만기본계획(국가관리연안항) 정보입니다.\""
