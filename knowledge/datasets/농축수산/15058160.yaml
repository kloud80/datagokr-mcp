summary_user: 경기도 종자관리소가 생산해 농가에 공급한 벼 보급종의 공급량을 공급년도·시군·품종별로 담은 집계 데이터로, 사전주문량·일반주문량과 기간 내·기간 외 개별공급량을 구분해 담는다. 종자 보급 담당자나 분석가가 "어느 시군에서 어떤 벼 품종 수요가 늘고 있는가", "사전주문 외 개별 수요가 얼마나 되는가"를 볼 때 쓴다. 전역 조인 키는 실측에서 확인되지 않았으며, 시군명(SIGUN_NM)·시군코드 같은 이름·코드 매핑으로만 다른 경기도 시군 단위 데이터와 연결한다.
description_portal: 경기도 내 벼 보급종 공급량 현황입니다. 식량안보 및 농산물의 안정적 생산을 위한 고품질 우량종자를 경기도 종자관리소에서 생산, 종자갱신이 필요한 종자를 농민이 논에 식재할 수 있도록 경기도에서 공급하는 공급량입니다. 연도별 벼 보급종의 공급현황을 품종별로 구분하여 제공하며, 농업종자 보급 정책 및 지역별 수요 분석 등에 활용할 수 있습니다. 주요 항목은 공급년도, 품종명, 사전주문량, 일반주문량, 기간 내 개별공급량, 기간 외 개별공급량 등으로 구성되어 있으며, 각 품종의 수요 유형별 공급량을 명확히 파악할 수 있도록 설계되어 있습니다. 특히, 사전 및 일반주문 외에도 비정기적 수요를 반영한 개별공급량 정보가 포함되어 있어 벼 품종 보급의 실질적인 흐름을 이해하는 데 도움을 줍니다.
