description_portal: 이 데이터는 해양수산부에서 자동선박식별시스템을 기반으로한 선박 관련 정보를 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해구번호와 현재 해구의 좌/우 상단 및 하단의 경계 위도, 경도 좌표 정보와 데이터 수집일자, 해구 내에서 집계된 선박의 척수 정보로 구성되어 있습니다.  본 데이터는 해양 관리 유관 기관에서의 해상 교통관제, 해역 혼잡도 분석을 통한 항로 계획 및 선박 분산 방안 수립 등 활동을 위한 기초 자료로 활용될 수 있습니다. 또한, 안전사고 분석, 해상 물류동향 파악 등의 업무에 활용될 수 있습니다.
