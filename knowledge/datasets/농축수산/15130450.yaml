summary_user: 국립농산물품질관리원이 관리하는 친환경인증 축산물(유기축산물·무항생제축산물)의 2023년 이후 인증 현황을 연도·시도·시군구별로 집계한 통계로, 인증 건수·농가수·출하량(톤)과 그 합계를 담는다. 지자체·분석가가 우리 시도나 시군구에 무항생제·유기 축산 인증 농가가 몇 곳이고 출하량이 얼마인지 지역별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 통계와는 시도·시군구 이름을 행정구역 코드에 매핑해 이어야 한다.
