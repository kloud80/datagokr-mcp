summary_user: 농식품공무원교육원(농식품인재개발원)이 2021년에 운영한 교육과정을 과정 한 건씩 정리한 계획표로, 과정명·기수·일정·일수·인원과 원격/집합 여부 같은 비고를 담고 범위는 전국 단위의 비공간 자료다. 농식품 분야 공무원이나 교육 담당자가 '2021년에 어떤 교육과정이 언제, 며칠, 몇 명 규모로 열렸는가'를 확인하거나 연도별 교육 운영 규모를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 연도 계획표 등과는 과정명을 맞춰 비교하는 방식으로만 이어 쓸 수 있다.
