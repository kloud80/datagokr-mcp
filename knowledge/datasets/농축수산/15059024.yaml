summary_user: 경기도 내 소·돼지·염소·사슴 같은 우제류 축산 농가를 농장 한 곳당 한 행으로 담은 자료로, 시군명·시군코드, 축종, 사육두수, 지번·도로명 주소와 WGS84 위경도를 함께 제공한다. 방역 담당자나 분석가가 '구제역 발생 농장 반경 안에 어떤 우제류 농장이 몇 두를 기르고 있나'처럼 지역별 사육 규모를 확인하고 방역구역을 설정할 때 쓴다. 전역 조인 키가 없어서 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 행정구역 자료나 GIS 레이어와 이름·코드 매핑 또는 공간 결합을 해야 한다.
description_portal: 이 데이터는 경기도 내 우제류 축산 농가의 사육 현황을 보여주는 자료로, 농장별 사육 축종, 사육두수, 농장명, 도로명주소 및 지번주소, 위도와 경도 등의 항목으로 구성되어 있습니다. 우제류에는 소, 돼지, 염소, 양, 산양, 사슴 등이 포함되며, 사육 중인 가축의 종류와 수를 통해 각 지역의 축산업 규모를 파악할 수 있습니다. 또한 시군명 및 시군코드가 함께 제공되어 지역 단위의 분석이 가능하고, 위치 정보(WGS84 좌표계 기반)를 통해 GIS 기반의 공간분석 및 방역구역 설정 등의 목적으로 활용될 수 있습니다. 농장명은 개인 농장의 경우 마스킹 처리될 수 있으며, 사육두수는 통계적 참고 자료로만 활용해야 합니다. 이 데이터는 가축 질병 예방 및 대응 체계 구축, 축산물 유통경로 분석, 농업 정책 수립 등에 유용한 자료입니다.
