description_portal: 경상북도의 귀농 및 귀촌 가구 수 현황을 연도별로 제공합니다. 각 시군별로 2004년부터 2025년까지의 귀농 및 귀촌 가구 수를 나타내며, 귀농과 귀촌을 구분하여 상세히 기록하고 있습니다. 귀농은 도시에서 농촌으로 이주하여 농업에 종사하는 가구를 의미하며, 귀촌은 농촌으로 이주하였으나 농업 외의 업종에 종사하는 가구를 뜻합니다. 이 데이터는 경상북도의 농촌 활성화 정책 수립 및 연구에 유용한 자료로 활용될 수 있습니다. 귀농 및 귀촌 가구 수의 변화를 통해 지역별 인구 이동 추세를 분석할 수 있으며, 이는 농촌 개발 및 지원 정책의 기초 자료로도 사용될 수 있습니다. 데이터는 시군명을 기준으로 정렬되어 있으며, 각 연도에 따른 귀농 및 귀촌 가구 수가 열(Column)로 나열되어 있습니다. 이를 통해 경상북도의 귀농 및 귀촌 현황을 쉽게 파악할 수 있습니다.
