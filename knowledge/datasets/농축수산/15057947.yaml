summary_user: 해양수산부가 수산물 수출입 때 쓰는 품목분류코드를 품목 한 건씩 담은 코드표로, 수출입품목 코드와 국문·영문·약칭 품목명, 대·중·소·세분류 코드, 대응하는 HSK 세번 코드를 전국 범위(비공간)로 제공한다. 수산물 수출입 업무를 보는 사업자나 분석가가 "이 수산물 품목은 어떤 HSK 코드로 분류되는가"를 확인하거나 품목별 무역 통계를 분류체계에 맞춰 묶는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, HSK 코드(hskTrfclsfCode)나 품목명을 매핑해 관세청 무역통계 같은 HS 기반 자료와 이어 쓴다.
limits: 가격·물량 같은 거래 실적은 없는 분류 코드표다. 어종코드는 수협·수산과학원·HS 체계마다 달라서, 위판장 경락가격 같은 다른 수산물 데이터와 이을 때는 코드를 그대로 맞추지 말고 이름·코드 대응표를 따로 만들어야 한다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
