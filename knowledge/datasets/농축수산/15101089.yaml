summary_user: 전국 해양보호구역을 구역 단위로 담는 외부 API(vworld)로, 보호구역명·고시번호·고시일자·적용법률·관리기관·주소·면적 필드를 제공한다. 해상풍력 등 해양 입지를 검토하는 사업자나 분석가가 특정 해역이 보호구역에 해당하는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 구역명·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 해양생물다양성이 풍부하여 생태적으로 중요하거나 해양경관 등 해양자산이 우수하여 특별히 보전할 가치가 큰 구역으로서 「해양생태계의 보전 및 관리에 관한 법률」에 의하여 국토해양부장관이 지정·고시하는 구역보호구역명칭, 고시번호, 고시일자, 적용법률, 관리기관, 주소, 규모 등을 확인할 수 있음
