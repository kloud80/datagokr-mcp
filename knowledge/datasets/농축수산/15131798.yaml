description_portal: 국가철도공단_영농손실액 산정단가 데이터는 철도사업에 편입되는 부지에서 경작 활동을 하는 농업인을 대상으로 한 영농손실 보상금 산정을 위한 기준 단가를 제공하는 자료입니다. 이 데이터는 시도 및 자치단체별로 구분되어 있으며, 작물의 종류(벼, 밭작물, 과수 등), 재배 방식, 생산량 및 지역 특성에 따라 산출된 보상단가를 포함하고 있습니다. 해당 보상금은 공익사업으로 인한 농업인의 생계 손실을 보전하기 위한 것으로, 보상금 산정의 공정성과 지역 간 형평성을 확보하기 위한 기초자료로 활용됩니다. 이 데이터는 보상계획 수립, 행정처리 기준 설정, 현장 보상 집행 시 근거자료로 사용되며, 공공사업 추진 시 이해관계자의 갈등 완화에도 기여하는 핵심 정보입니다.
