summary_user: 국립농산물품질관리원이 생산·유통 단계에서 수거한 농산물의 잔류농약 분석결과를 조사 건별로 누적해 담은 전국 단위 데이터로, 품목·수거단계·재배양식·생산지 주소·재배면적·조사물량·등록일자·분석결과(적합 여부)로 구성된다. 소비자나 유통·급식 사업자가 특정 품목이 어느 단계·지역에서 잔류농약 부적합으로 판정된 사례가 있었는지 확인하거나, 분석가가 품목·재배양식별 부적합 비율을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품목명이나 주소 문자열을 매핑해 이어야 하며, KAMIS 등 가격 데이터와 붙일 때도 품목코드 체계가 달라 별도 매핑이 필요하다.
description_portal: 안전성  조사는 농산물의 생산·유통·판매 단계에서 농약 등 유해물질 안전성조사를 통해 부적합품의 시중 유통을 차단하여 안전한 농산물을 공급, 인증농산물·수출농산물·인삼 안전관리 등 정책사업과 연계한 고품질 농산물 생산 유도로 품질 경쟁력 향상과 농가소득증대 기여, 유해물질 실태조사, 분석기술 개발 등을 통한 과학적인 안전관리로 우리 농산물의 안전성 향상에 기여하기 위하여 도입되었으며, 본 정보는 국립농산물품질관리원에서 관리하는 생산 및 유통단계의 농산물 잔류농약 분석결과에 대한 누적 데이로서, 품목, 수거단계, 재배양식, 생산 지역, 재배면적, 조사물량, 등록일자, 분석결과 항목으로 구성된 데이터입니다.
