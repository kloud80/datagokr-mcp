summary_user: 농식품 공공데이터포털에서 쓰는 전국 행정구역 분류표로, 행정구역별 코드·명칭과 상위 시도·시군구 코드·명칭, 표시 여부, 위도·경도를 한 행씩 담는다. 분석가가 농식품 분야 데이터의 지역 코드를 시도·시군구 이름으로 풀어 지역별 통계를 낼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정구역 이름·코드 매핑이나 같은 기관(농림축산식품부) 코드 기준으로만 이어 쓴다.
description_portal: 본 데이터는 농림축산식품부가 관리하는 농식품 공공데이터포털에서 사용되는 행정구역 분류 정보를 체계적으로 정리한 자료입니다. 시군구 단위부터 읍면동까지의 세부 행정구역 명칭과 코드가 포함되어 있어, 지역별 데이터 분류와 분석을 용이하게 지원합니다. 이를 통해 다양한 농업 및 식품 관련 데이터의 지역별 통계 작성과 정책 수립에 필수적인 기초 정보를 제공합니다. 또한, 행정구역 코드의 표준화로 데이터의 정확성과 일관성을 높이며, 지방자치단체와 연계한 효율적인 데이터 관리와 활용을 가능하게 합니다. 본 자료는 농식품 분야 공공데이터의 체계적 운영과 지역 맞춤형 정책 개발에 기여합니다.
