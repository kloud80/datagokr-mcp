description_portal: 데이터 설명본 데이터는 전북특별자치도 남원시의 돼지농장에서 발생하는 가축분뇨의 일일 발생량과 처리방식에 관한 체계적인 정보 수집 자료입니다. 축산업 환경관리와 악취 저감을 위한 정책 수립의 기초자료로 활용되며, 각 돼지농장의 분뇨 발생 현황과 자체처리 능력을 파악하여 지역 환경보호와 축산업의 지속가능한 발전을 목표로 구축되었습니다.데이터 항목• 돼지농장상호• 대표자• 주소• 가축분뇨폐수량(일일 기준)• 분뇨 자체처리 여부기대효과축산농가별 분뇨 발생량과 처리 현황을 투명하게 관리함으로써 환경오염 방지와 악취 민원 해결에 기여할 수 있습니다. 더불어 분뇨처리 시설의 효율적 운영과 축산업 환경정책 수립을 위한 과학적 근거 자료로 활용될 것입니다.
