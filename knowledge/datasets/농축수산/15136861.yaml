summary_user: 가락시장 도매시장법인이 2024년 9월 2일 하루 동안 경매로 거래한 건별 결과를 법인명·품목명·품종명·단위·등급·수량·경락가·출하지 단위로 담은 CSV 파일이다. 식자재 구매자나 유통 분석가가 특정 날 가락시장에서 어떤 품목·품종이 어느 산지에서 들어와 등급별로 얼마에 낙찰됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 품목코드가 없어서, KAMIS·다른 도매시장 가격과 이어 쓰려면 품목명·품종명을 이름으로 매핑하거나 출하지 이름을 행정구역과 맞춰야 한다.
