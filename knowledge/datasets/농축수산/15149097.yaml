description_portal: 해양수산부 해양수산인재개발원에서 운영중인 바다배움터 수강 신청 및 수료기준, 회차관리에 관한 데이터 목록입니다.TLMCA040 테이블은 바다배움터에 개설된 각 과정에 대한 회차 관리테이블입니다.TLMCA040 테이블의 각  과정별 주/차시로 콘텐츠가 나뉘어져 있으며,  과정개설코드-과정개설명, 콘텐츠ID-콘텐츠명, 출석인정구분-출석인정구분명으로 매칭됩니다.TLMCA040 테이블의 출석인정시간은 "초" 기준이며 수료를 위한 최소 인정시간을 의미합니다.TLMCA040 테이블의 과정 시작시간 및 종료시간은 2022-02-18 00시00분에 과정이 오픈되며, 2032-12-31 23시 59분 과정이 종료됨을 의미합니다.TLMCA050 테이블의 과정개설코드는 TLMCA040의 과정개설코드와 일치하며 해당 과정에 대한 사용자별 수강신청 정보를 갖고 있습니다.TLMCA050 테이블의 사용자ID 컬럼은 개인정보로 삭제되어있습니다.TLMCA100 테이블의 과정개설코드는 TLMCA040의 과정개설코드와 일치하며 수강생별 수료기준에 대한 정보를 갖고 있습니다.TLMCA100 테이블의 사용자ID 컬럼은 개인정보로 삭제되어있습니다.
