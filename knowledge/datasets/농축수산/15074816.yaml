description_portal: 산림청 과거 산사태 정보 서비스는 산사태 재해년도, 산사태 재해명, 시도명, 시군구명, 읍면명, 산사태 피해면적을 기준으로 과거 발생 이력 데이터를 제공하는 오픈API 서비스입니다. 요청 파라미터에는 재해년도, 지역명, 페이지 번호, 페이지 크기 등이 포함되며, 응답에는 발생 일시, 주소, 좌표, 피해면적 단위, 데이터 기준 기관 등의 메타정보가 담깁니다. 본 API는 JSON·XML 응답과 페이지네이션을 지원하고, 기간·지역 조건 필터링으로 특정 시점·행정구역의 발생 패턴을 신속히 파악할 수 있어 위험도 분석, 대시보드 시각화, 복구 자원 배분 등 정책 수립과 연구에 활용됩니다.
