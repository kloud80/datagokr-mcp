description_portal: '국립자연휴양림 바우처우선예약, 아세안우선예약 정책 삼품정보를 제공합니다.산림복지바우처우선예약국립자연휴양림에서 산림복지 소외자에게 서비스 이용기회를 우선 제공하기 위한 별도의 예약제도로 미 적용 시설은 일반예약으로도 이용가능 합니다.산림복지 바우처 카드 소지회원만 이용가능합니다.아세안우선예약아세안 10개국 출신 외국인이 우선적으로 이용할 수 있도록 국립아세안 자연휴양림에서 우선 예약제를 실시합니다.아세안 10개국 출신으로 사전 등록된 분만 이용 가능합니다.[나의정보] 추가정보 입력 항목에서 아세안 10개국 출신(승인) 체크된 회원 중 관련서류를 팩스 또는 이메일로 숲나들e 고객지원센터에 제출 후 확인된 회원만 신청가능합니다.※ 아세안 10개국 : 브루나이, 캄보디아, 인도네시아, 라오스, 말레이시아, 미얀마, 필리핀, 싱가포르, 태국, 베트남'
