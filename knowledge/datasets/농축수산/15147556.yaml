description_portal: 본 자료는 고병원성조류인플루엔자(HPAI) 등 가축전염병 발생 시 즉각적으로 시행되는 초동방역 투입현황을 정리한 것입니다. 초동방역은 가축전염병 의심 또는 발생 신고가 접수되면, 방역본부와 도본부가 협력하여 즉시 현장에 인력을 투입해 사육가축의 이동통제, 소독, 시료채취, 살처분 지원 등 긴급 방역조치를 시행하는 것을 의미합니다. 자료에는 시도·시군별로 구분된 축종 및 품종, 사육두수, 투입구분, 투입일 및 철수일, 투입인원, 발생 여부 등이 포함되어 있습니다. 특히 산란계 농장을 중심으로 한 AI(조류인플루엔자) 발생 사례에 따른 방역인력의 투입 현황이 상세히 기록되어 있어, 지역별 대응 역량과 투입 자원의 효율성을 평가하는 데 중요한 근거자료로 활용됩니다. 또한 본 자료는 시군별 방역 투입 패턴을 분석하여, 향후 가축전염병 발생 시 투입 인력 규모 및 대응 소요 기간을 예측하는 데 기여합니다. 이를 통해 중앙정부와 지자체는 신속하고 효과적인 방역 정책을 수립할 수 있으며, 농가 단위의 자율방역과 연계된 선제적 재난대응 체계를 강화할 수 있습니다. 본 현황자료는 국가 가축방역 대응능력 향상과 피해 최소화를 위한 핵심 기초자료로 제공됩니다.자세한 사항은 가축위생방역지원본부 방역사업부에서 확인하실 수 있습니다.044-550-5560
