summary_user: '국립농산물품질관리원이 관리하는 농산물우수관리(GAP) 인증 건별 정보로, 인증번호·인증기관·개인/단체 구분·유효기간·품목·주소·등록 농가수와 필지수·재배면적·생산계획량·지정일자를 전국 범위로 담는다. 유통업체나 식자재 구매 담당자가 특정 품목(예: 사과)을 GAP 인증을 유지하는 산지·농가 단위로 찾고, 인증 유효기간이 끝나지 않았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·주소 같은 이름 매핑으로만 잇고, KAMIS 등 가격 데이터와 붙일 때는 기관마다 품목코드가 달라 별도 매핑이 필요하다.'
description_portal: 산물우수관리인증은 생산에서 판매 단계까지 안전관리체계를 구축하여 소비자에게 안전한 농산물을 공급, 농산물의 안전성 확보를 통한 소비자 신뢰 제고 및 국제시장에서 우리 농산물의 경쟁력 강화, 저투입 지속가능한 농업을 통한 농업환경 보호를 목적으로 도입한 제도로서 본 정보는 국립농산물품질관리원에서 관리하는 농산물우수관리(GAP) 인증정보로서, GAP인증번호, 인증기관, 개인/단체 구분명, 유효기간 시작일, 유효기간 종료일, 품목, 주소, 등록 농가수, 등록 필지수, 재배면적, 생산계획량, 지정일자로 구성된 데이터입니다.
