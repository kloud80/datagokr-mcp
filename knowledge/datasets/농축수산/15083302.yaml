description_portal: 본 정보는 농림축산식품부에서 시행한 토양개량제 지원사업의 현황을 제공합니다. 지원사업은 규산질비료와 석회질비료를 포함한 토양개량제를 농업인에게 지원하여 토양의 산도 조절 및 영양 균형을 개선하고, 농작물의 생산성을 향상시키는 것을 목표로 합니다. 제공되는 데이터 항목은 사업년도, 선정년도, 시도, 시군, 읍면동, 비종, 신청면적(㎡), 양(kg), 신청(포), 선정(포) 등으로 구성되어 있습니다. 이러한 정보는 농업 정책 수립, 토양 관리 및 농업 생산성 향상에 활용될 수 있습니다. 단, 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 차이가 있을 수 있으므로 데이터 활용 시 참고하시기 바랍니다.
