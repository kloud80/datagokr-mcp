description_portal: '동물보호법에 따른 동물장묘업 허가 현황- 제공 정보 : 지역별 동물장묘업 업체 현황, 전체 업체 수 대비 지역별 비율, 동물장묘업 시설별 현황 및 장묘업 관련 종사자수- 동물장묘업 : 동물 전용의 장례식장, 동물화장시설, 동물건조장시설, 동물수분해장시설, 동물 전용의 봉안시설 중 하나 이상의 시설을 설치, 운영하는 영업(동물보호법 시행규칙 제38조)- 구분 지역 : 서울, 부산, 대구, 인천, 광주, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남- 허가영업 기준 : 동물보호법 제69조제3항에 따른 허가영업의 시설 및 인력기준 별표 10- 허가방법 : 영업허가신청서에 인력현황, 영업장의 시설 명세 및 배치도, 사업계획서 등을 첨부하여 관할 지자체에 제출 및 허가받아야 함- 데이터 기대효과 : 동물장묘업의 분포와 시설 운영 형태를 파악하여 장묘 서비스 수급 현황을 진단하고, 관련 제도 개선 및 지원 정책 수립 등에 활용 가능'
