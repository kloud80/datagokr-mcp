summary_user: 산림청 산림토목관리시스템에 등록된 국유림 사방사업의 시설 대장을 사업 건별로 담은 CSV 파일(약 97KB)로, 사업 시작·종료일과 설계사·시공사 소속명을 포함한다. 사방사업 이력을 보는 분석가가 "특정 시공사가 언제 어떤 사방사업을 맡았는가"처럼 공사업체·공사 기간 이력을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·업체명 같은 이름 매칭이나 같은 기관 자료 기준으로만 이어 쓴다.
description_portal: 산림청이 운영하는 산림토목관리시스템 내에 구축된 자료로, 국유림을 대상으로 시행된 사방사업의 설계·시공 관련 정보를 체계적으로 기록한 시설 대장 데이터입니다. 산림토목관리시스템은 임도 및 사방시설 등 산림 기반 인프라의 계획, 설계, 시공, 유지관리를 통합적으로 관리하는 정보화 시스템이며, 이 데이터는 그중 사방사업에 특화된 시설 정보를 포함하고 있습니다. 주요 항목에는 등록일, 설계사, 시공사, 사업명, 사업 위치, 사업 유형, 공사 기간 등이 포함되어 있어, 사방사업의 추진 경과와 이력 관리가 가능하도록 구성되어 있습니다. 해당 정보는 산사태 예방, 토사 유출 차단, 재해 복구 등과 관련한 사방시설의 조성 및 성능 관리, 공사업체 이력 분석, 설계·시공 품질 관리, 사업별 예산 집행 이력 추적 등 다양한 행정 및 기술적 업무에 활용됩니다.
