description_portal: 본 데이터는 2009년부터 2024년까지의 연도별 안강망 현황을 제공하며, 세부 항목으로는 연안개량안강망, 안강망, 연안안강망의 개수가 포함되어 있다. 이를 통해 특정 연도의 어업 시설 운영 현황을 확인할 수 있으며, 연도별 변화를 비교함으로써 지역 어업의 추세와 변화를 분석할 수 있다.데이터는 매년 단위로 정리되어 있어 장기적인 어업 통계 연구, 수산 정책 수립, 자원 관리 및 어업 지원 정책 검토에 중요한 기초자료로 활용될 수 있다. 특히 연안 개량형 어업 방식과 전통 어업 방식의 차이를 한눈에 비교할 수 있어 어업 구조 변화 및 지속가능한 수산자원 관리 정책 마련에 유용하다.경상남도 통영시는 안강망 어업허가 개수를 공공데이터로 개방하고 있다. 이 데이터는 시민들이 손쉽게 통영시의 연안개량안강망, 안강망, 연안안강망 어업허가 개수를 확인할 수 있도록 제공되는 자료로 개방되는 주요항목은 연안개량안강망, 안강망, 연안안강망의 개수로 구성되어 있다.
