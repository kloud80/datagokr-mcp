description_portal: 이 데이터는 사업 절차 심의자문위원 관리, 사업 절차 심의자문 과정에서 발생하는 심의자문 일정, 심의자문결과, 조치계획, 첨부자료 등을 체계적으로 관리하기 위해 2017년부터 2025년까지 수집·구축된 정보입니다.사업별심의관리(TB_BYBSNS_DLBRT_MANAGE), 사업별심의위원관리(TB_BYBSNS_DLBMFCMM_MANAGE), 사업별자문관리(TB_BYBSNS_CNSUT_MANAGE), 사업별자문관리상세(TB_BYBSNS_CNSUT_MANAGE_DETAIL_20220717), 사업별자문위원관리(TB_BYBSNS_CNSMFCMM_MANAGE), 위원그룹 관리(TB_MFCMM_GROUP)를 포함합니다.이 데이터를 통해 심의 절차별 진행상황, 심의의견·조치의견, 첨부자료 등록 현황, 조치 완료 여부 및 이력을 체계적으로 파악할 수 있으며, 심의 프로세스 관리, 조치사항 모니터링, 행정업무 효율화, 심의 결과의 신뢰성 확보, 절차 관리의 표준화, 데이터 기반 의사결정 등에 활용될 수 있습니다.파일내 항목별 코드는 코드북을 참고해 주시기 바랍니다.
