summary_user: 중국 다롄·칭다오 지역을 중점으로 조사한 주요 농산물의 기준일자별·품목·품종·생산지역별 최저·최대·평균 거래가격을 담은 1회성 조사 파일(CSV, 약 271KB)이다. 수입 농산물과 경쟁하는 국내 생산자·유통업자나 분석가가 '중국 산지에서 이 품목이 얼마에 거래되는지, 국내 가격과 얼마나 차이 나는지'를 비교하는 데 쓴다. 전역 조인 키가 없어 KAMIS 등 국내 가격 데이터와는 품목명을 매핑해 이어 써야 하며, 품목코드 체계가 KAMIS·도매시장·HS·KOSIS마다 달라 별도 매핑이 필요하다.
description_portal: '해외 생산지 중 대한민국에 영향이 많은 중국지역에서 유통되고 있는 주요 농산물에 대한 가격정보를 다롄, 칭다오 지역을 중점으로 조사한 1회성 데이터농넷에서 제공하고 있는 데이터입니다.*농넷: 실시간 데이터 분석 기반의 농산물 종합 정보를 제공합니다.농산물의 수급 안정과 적정가격 유지를 위한 수급 정보를 다루는 농산물유통 종합정보시스템의 서비스 브랜드 입니다.‘농넷’은 흩어져 있는 농산물의 생산-유통-소비 등 방대한 데이터를 한곳에 모으고 분석하여 ‘데이터’기반의 신속하고 합리적인 수급 의사결정을 지원합니다.'
