description_portal: 이 데이터는 해양수산부에서 울산 온산의 수질자동측정망 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 정점명, 정점코드, 관측일시, 생태구, 해역분류, 해역명, 해역구분, 해역코드, 조사수층, 전기전도도, 염분, 수온, 수소이온농도, 용존산소, 탁도, 클로로필, 유분, 강수량, 암모니아성질소, 질산성질소, 용준무기인, 이산화규소, 총유기탄소 데이터로 구성되어 있습니다.본 데이터는 수질자동측정망 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
