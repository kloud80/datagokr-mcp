summary_user: 제주특별자치도의 양식어업 생산을 해면양식·내수면양식 구분과 양식 방법, 품종별로 묶어 2017년부터 2024년까지 연도별 생산량(톤)과 생산금액(백만원)을 담은 집계표이며, 파일 크기는 1,341바이트로 작다. 수산 분석가나 양식 사업자가 '제주에서 넙치 같은 품종의 양식 생산량과 금액이 최근 몇 년 사이 어떻게 변했나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품종명이나 연도를 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: '제주특별자치도 내 양식어업 현황 데이터를 제공합니다.항목: 구분(해면양식 / 내수면양식)에 따른 연도별(2017년도 부터~) 품종별 물량(M/T)과 금액(백만원) 정보- 해면양식 : 해수면(바다)이나 육상에서 인위적인 시설물을 설치하여 바닷물을 이용하여 수산동식물을 기르는 어업- 내수면어업 : 하천, 호수, 저수지, 댐 등에서 어류, 패류 등을 포획 채취하는 어업을 하거나 인위적인 시설물을 설치하여 민물을 이용하여 어패류 등을 기르는 어업자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1113'
