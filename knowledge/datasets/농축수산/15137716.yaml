summary_user: 쇠고기이력시스템에 등록된 농장을 농장 단위로 담은 전국 파일로, 사업연도·농장등록번호·법정동 주소·폐업 지급 기준 규모·지급 대상 여부를 개별 주소 수준으로 담는다. 축산 정책 분석가가 "어느 지역 농장이 폐업 지원 지급 대상이었고 기준 규모는 어느 정도였나"를 확인하는 데 쓴다. 농장등록번호(농장_등록_번호)로 다른 축산 농장·이력 데이터와 잇고, 법정동 코드로 행정구역별 통계와 묶는다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 쇠고기이력시스템 농장 정보로, 주요 항목으로는 농장식별번호, 농장주소, 폐업 규모, 지급대상 등을 포함하고 있습니다. 이 자료는 농가의 운영 현황과 쇠고기 유통 관리 실태를 체계적으로 파악할 수 있도록 지원하는 중요한 기초 자료입니다. 특히 축산업 현장의 변화 추이와 지역별 특성을 반영하여 정책적 의사결정에 활용될 수 있으며, 농업 발전을 위한 정책 수립, 축산 제도 개선, 축산 연구 분석 등에 다양하게 응용될 수 있습니다. 또한 농가 지원 정책의 효과성을 검토하고 산업 경쟁력을 강화하며 소비자 신뢰를 제고하는 기반 자료로도 유용하게 쓰일 수 있습니다. 다만, 이 데이터에는 개인정보 및 민감정보가 일부 포함되어 있기 때문에 일부 항목만 제한적으로 제공되고 있어 사용에 유의 부탁드립니다.
