summary_user: 농림업 생산액과 생산지수를 품목 계층(품목별 1~8단계)과 항목별로 나누어 2020~2024년 연도별 값으로 담은 전국 단위 집계 통계 파일(csv, 약 35KB)이다. 정책 담당자나 연구자가 '최근 5년간 농림업 전체와 주요 품목의 생산액·생산지수가 늘었나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 품목명을 맞추거나 같은 기관 통계와 이름 기준으로만 연결한다.
limits: 전국 합계만 있고 지역별로 나뉘지 않으며 공간 정보가 없다. 표준 품목 코드 같은 전역 키가 없어 다른 데이터와 붙이려면 품목명을 직접 매핑해야 한다. 산지 구분·규제 부문으로 분류돼 있지만 산지 지번(PNU)이나 보전·준보전 구분 정보는 담지 않는다.
