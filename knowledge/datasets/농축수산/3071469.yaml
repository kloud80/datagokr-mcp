description_portal: '충청북도 충주시 관내 한육우 사육 농가 수에 대한 읍면동별 분포 현황을 제공하는 통계 데이터입니다.축종은 "한육우" 기준이며, 행정동 단위(읍·면·동)별 농가 수가 표 형식으로 구성되어 있습니다.데이터는 각 행정구역에 실제 등록된 사육농가 수를 기준으로 작성되었으며, 단위는 "농가 수"입니다.본 자료는 충주시 축산업 정책 수립, 지역별 가축 방역 계획, 가축 사육 밀집도 분석, 농가 지원 정책 설계 등의 행정 업무에 활용될 수 있습니다.표에 포함되지 않은 축종(예: 돼지, 닭 등)은 별도 통계자료를 통해 확인해야 합니다.읍면동 기준은 통계 작성일 당시 행정구역 기준이며, 향후 개편에 따라 일부 명칭이나 구역이 변경될 수 있습니다.※ 데이터는 시점 기준으로 정리되어 있으며, 수시로 변경될 수 있으므로 최신 정보는 충주시청 축산부서에 확인하는 것이 권장됩니다.'
