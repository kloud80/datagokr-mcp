description_portal: 이 데이터는 해양수산부에서 해저수송관에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은  공간정보일련번호해양공간객체번호제작일자전자해도단계전자해도번호기타정보영문내용기타정보한글내용최소규모수수준구분공간정보 데이터로 구성되어 있습니다.본 데이터는 자원기본정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해저수송관란 바닷속을 가로지르는 관로로, 해저에 매설되어 물, 가스, 석유 등의 물질을 운송하는 관을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
