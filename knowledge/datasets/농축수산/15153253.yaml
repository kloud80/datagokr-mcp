summary_user: 해저에 매설되어 물·가스·석유 등을 운송하는 해저수송관을 객체 한 건씩 담은 공간정보 파일로, 전자해도 번호·단계, 제작일자, 축척 수준과 함께 관로의 위치(공간정보)를 담으며 범위는 전국이다. 해상풍력 등 해양공간 입지를 검토하는 사업자나 분석가가 "계획 해역 안에 해저 관로가 지나가는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 해양공간객체번호·전자해도번호 같은 같은 기관 체계 안의 식별자나 공간 중첩으로만 이어 쓴다.
limits: 전역 조인 키가 없어 행정구역 코드 등으로 다른 통계와 바로 결합할 수 없고, 행정단위는 전국·비공간으로 분류되어 지역별 집계에는 공간 연산이 따로 필요하다. 관로의 용도·운영 주체 같은 속성은 필드 명세에서 확인되지 않는다.
