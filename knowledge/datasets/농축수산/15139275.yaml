description_portal: 전라남도 해남군 26년 2월 기준 육상해수양식업 관련 데이터 입니다.이 데이터에는  육상해수양식업 허가자, 양식품종, 수조면적, 시설면적, 시설위치 등의 허가현황 항목을 제공합니다.해남군에는 29곳의 육상해수양식장이 있으며 주로 넙치, 새유류를 주로 양식하고 있습니다.육상해수양식업은 바다와 멀리 떨어진 육지에 인공적으로 해수 환경을 조성하여 물고기, 패류, 갑각류 등을 기르는 양식 방법으로수조 여러 개를 설치하여 양식하는 육상수조식 양식과 둑을 쌓아 넓은 양식지를 조성하고 물을 채워 양식하는 육상축제식 양식이 있습니다.
