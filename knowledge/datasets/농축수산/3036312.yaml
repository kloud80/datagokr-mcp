description_portal: '품종의 생산, 수입판매신고제도는 종자산업법에 따라 품종의 종자를 생산 또는 수입하여 판매하고자 할 때 고유의 품종명칭과 함께 종자 시료를 첨부하여 국립종자원 등에 신고하도록 의무를 부여하는 제도이다.해당자료는 국립종자원에서 품종보호 소관식물로 담당하고 있는 식물의 종자를 수입, 생산, 판매하기 위해 국립종자원에 신고된 신고된 내역 목록(신고필증 발급일별로 정리)이다.데이터 기준일까지 국립종자원에 생산수입판매신고한 품종에 대한 자료로 우리나라에서 유통되고 있는 종자로 해당 파일에 누락되어 있는 품종은 불법종자이므로 종자유통질서 유지를 위한 중요한 자료이다. 국립종자원에서 소관하고 있는 농업종자에 대한 자료로 산림종자, 수산종자는 제외한 자료이다.* 참고사항: "신고인"의 공란은 과거 자료로 인하여 최초 데이터 등록("19년말 기준) 및 현재는 확인이 불가한 항목이기 때문임'
