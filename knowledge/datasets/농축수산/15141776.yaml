description_portal: 이 데이터는 마리나선박 정비업 등록 업체 현황을 체계적으로 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 마리나항만법 시행령에 근거한 모터보트, 요트, 고무보트, 카누 등 유람, 스포츠 또는 여가용으로 사용되는 선박에 대한 정비 서비스를 제공하는 업체의 명단으로, 각 업체의 업체명, 사업장 주소, 업종, 시설면적 등의 정보를 제공하고 있습니다.본 데이터는 마리나선박 보유자 혹은 해양레저사업 관계자가 정비업체를 쉽게 찾고 비교하여 선박 관리 계획을 세우는데 활용될 수 있으며, 정부 및 공공기관에서는 해운·레저 인프라 관리, 마리나산업 정책 수립, 정비업체 점검 및 지원 방안 마련 등 행정적 업무 수행 시 참고자료로 사용할 수 있습니다.
