summary_user: 전국 시도·시군별로 농업 종사자를 자영 종사자, 상용·일용 고용 근로자, 기타 근로자, 농업경영체 고용주와 외국인 근로자 수로 나눠 연도(TOT_YR) 단위로 집계한 데이터를 담는다. 정책 담당자나 연구자가 "우리 시군에 외국인 계절근로자를 얼마나 배정해야 하나, 고용 인력 중 외국인 비중은 어느 정도인가"를 따질 때 쓴다. 시도·시군 코드 필드(CTPRVNCD, CTNDCTCD)는 있으나 실측에서 전역 조인 키로 확인되지 않아, 다른 지역 통계와는 지역명·코드 매핑을 거쳐 이어 쓴다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 농업종사자 현황에 대한 데이터는 현재 농업 분야에 종사하는 인구의 상세한 정보와 함께 외국인 계절근로자 배정 시, 해당 근로자가 일하게 되는 각 시군별 통합 데이터를 포함하고 있습니다. 이 자료는 농업 관련 정책 개발 및 인력 관리에 필수적이며, 국내 농업의 인력 운영 실태를 파악하는 데 도움을 줍니다. 특히, 외국인 계절근로자의 배정 현황은 농림 수산업계의 노동력 부족 문제 해결을 위한 기초 자료로 활용될 수 있습니다. 따라서 이 데이터를 통해 정책 입안자와 연구자들은 농업 인력 정책을 보다 효율적으로 수립하고 실행할 수 있는 기반을 마련하게 됩니다. 또한, 농업 종사자에 대한 정확한 정보를 통해 지역별 농업의 특성 및 문제점을 파악하고, 지역 경제 활성화 및 인력 유입 방안을 모색하는 데 기여할 수 있습니다. 이와 같이 농림수산식품교육문화정보원에서 제공하는 이 데이터는 농업 종사자의 현황을 종합적으로 이해하는 중요한 자료로 활용될 것입니다.
