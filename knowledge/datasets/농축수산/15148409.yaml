description_portal: 농림축산식품부에서는 시설원예품질 농가 농지 정보를 제공합니다.본 정보 제공 데이터는 사업년도, 관할기관, 농가명, 농업경영체일련번호, 농지일련번호, 지적분류, 농지본번, 농지부번, 지적지목, 지적면적, 농업경영체농지일련번호, 실제지목, 재배품목등의 정보를 포함하고 있습니다.본 제공자료는 시설원예현대화사업에서 시설원에품질관리를 목적으로 농가 및 농지에 대한 정보를 보여주는 데이터 입니다.농업경영체번호는 민감정보로 별도의 채번을 통하여 농업경영체일련번호로 표기하였으며, 동일 농업경영체일련번호로 동일식별이 가능합니다.관할기관은 시군구 단위까지만 표기하였으며, 농가명은 민감정보로 마스킹처리하여 일부만 제공하였습니다.
