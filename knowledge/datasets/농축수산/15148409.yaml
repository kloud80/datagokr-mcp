summary_user: 시설원예현대화사업 대상 농가가 경작하는 농지를 필지 단위로 담은 건별 원천 파일로, 사업년도·시군구 단위 관할기관·마스킹된 농가명과 지적 본번·부번, 지적지목·실제지목, 지적면적, 재배품목을 담는다(csv 약 12KB, 범위 전국). 시설원예 지원사업 분석가가 '사업 대상 농가가 어떤 지목의 농지에서 어떤 품목을 재배하는지, 공부상 지목과 실제 이용이 다른 필지는 얼마나 되는지'를 확인하는 데 쓴다. 전역 조인 키가 없고 농업경영체번호는 별도 채번한 일련번호로 바뀌어 있어 이 파일 안에서 같은 농가 묶기에만 쓰며, 다른 데이터와는 관할 시군구명과 지번(본번·부번)을 이름 매칭으로 맞춰 잇는다.
limits: PNU 같은 전역 필지 키가 실측 컬럼에 없어 농지 필지·팜맵 데이터와 직접 조인되지 않고, 시군구명·지번 매칭으로만 연결된다. 농가명은 마스킹되어 있고 농업경영체일련번호는 재채번된 값이라 실제 농업경영체 등록정보와 연결할 수 없다.
