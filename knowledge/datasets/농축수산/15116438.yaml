summary_user: 한국농어촌공사가 조성한 간척 농지를 필지 단위로 담은 건별 원천 파일로, 토지구분(농지/기타), 행정구역, 지구·공구명, 가지번/실지번 구분, 본번·부번, 면적을 전국 범위로 담는다. 간척지 사업 담당자나 분석가가 특정 간척지구·공구에 농지와 기타 용도 토지가 각각 얼마나 되는지 확인하고 농업 생산성 증대나 타용도 개발 가능성을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 행정구역과 지번(본번·부번)을 다른 필지·지적 자료와 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: '- 한국농어촌공사가 조성한 간척 농지의 관리 현황을 담고 있습니다. - 조성토지통합관리시스템(DIMS)을 통해 관리지구, 행정소재지, 지번, 면적 등 토지정보를 수집하고 있으며,- 본 개방데이터는 토지 구분(농지/기타)과 행정구역 코드, 특정 지구 및 공구별 정보를 제공하며, 가지번/실지번 구분, 실제 지번 그리고 각 필지의 면적을  포함합니다. - 해당 데이터는 간척지 토지의 소유 및 활용 현황을 파악하고 관리하는 데 필요한 기초자료이며, - 간척농지의 농지/기타 구분과 면적 정보를 활용하여 해당 지역의 농업 생산성 증대 또는 타용도 개발 가능성을 검토하는 등의 활용을 할 수 있습니다.'
