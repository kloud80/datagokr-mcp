summary_user: 국립해양조사원이 전국 조석 예보지점의 하루치 고조·저조 정보(예측 시각과 조위, 극치구분)를 지점별로 담은 API다. 연안·항만 안전 점검이나 물때에 맞춘 낚시·어업·해상 작업 일정을 짜는 사람이 "오늘 이 지점의 만조와 간조는 언제, 조위는 얼마인가"를 확인할 때 쓴다. 예보지점 위도(lat)·경도(lot) 좌표로 다른 위치 기반 데이터와 이어 쓰고, 바다누리 자체 관측소코드 체계를 따르므로 타 기관 코드와는 별도 매핑이 필요하다.
description_portal: 이 데이터는 해양수산부 국립해양조사원에서 우리나라 관할해역 조석 예보지점의 검색기준 날짜(1일) 고조, 저조 정보(조위, 시각)를 제공하기 위해 수집한 데이터 입니다. 예보지점 코드, 요청일자를 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 예보지점명, 예측일시, 예보지점의 위도/경도 위치정보 및 예측조위값, 극치구분 정보로 구성되어 있습니다. 본 데이터는 연안 및 항만의 해양 안전관리를 위한 조류 예측, 해양재해 대응 계획 수립, 해상교통 및 어업활동 일정 조정, 연구기관의 조석 분석과 해양환경 연구 등에 활용될 수 있습니다.
