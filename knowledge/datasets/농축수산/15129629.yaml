summary_user: 농작물재해보험의 품목별 가입 현황을 전국 단위 집계로 담으며, 품목마다 대상면적·가입농가수·가입건수·가입농지수·가입금액·가입면적·면적가입률을 제공한다. 정책 담당자나 분석가가 '어떤 작물이 보험 가입률이 낮아 재해 대비가 취약한가'를 확인하거나 품목별 보험 수요를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품목명을 이름으로 맞춰 연결해야 하며, KAMIS·도매시장 등 품목코드 체계와 이을 때는 별도 매핑이 필요하다.
description_portal: 해당 데이터는 농림축산식품부에서 제공하는 품목별 농작물재해보험 보험가입 통계자료로, 농업재해보험은 농가의 경영안정과 안정적인 재생산 활동을 지원하기 위해 2001년부터 도입된 제도입니다. 주요 항목으로는 품목, 대상면적, 가입농가수, 가입건수, 가입농지수, 가입금액, 가입면적, 면적가입률 등을 포함하고 있습니다. 이를 통해 품목별 보험 가입 분포와 농가의 선호도를 분석할 수 있습니다. 또한 각 품목의 재해 위험 수준이나 생산 특성에 따라 보험 가입 현황이 어떻게 달라지는지를 파악할 수 있어, 특정 작물에 대한 보험 수요 예측, 품목별 맞춤형 보험 상품 개발, 재해 대비 정책 수립 등에 활용될 수 있습니다. 나아가 시기별·품목별 가입 추이를 분석함으로써 농업재해보험의 효과성과 농가의 안정적 경영 활동 지원 정도를 평가하는 데에도 중요한 자료로 쓰일 수 있습니다.
