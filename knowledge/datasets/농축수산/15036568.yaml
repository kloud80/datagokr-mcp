summary_user: 충청남도 서천군 관내에서 배를 재배하는 농가를 재배지 주소와 재배면적(제곱미터) 단위로 한 줄씩 담은 소규모 파일(csv, 905바이트)로, 행정단위는 개별 주소 수준이고 범위는 서천군 한 곳이다. 서천군에서 배 재배지가 어느 읍·면에 몰려 있고 면적이 얼마나 되는지 확인하려는 농업 담당자나 지역 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 재배지 주소를 지오코딩하거나 읍·면 이름으로 맞춰 이어 써야 한다.
limits: 농업경영체 등록번호나 사업자번호 같은 공통 키가 없어 경영체·농지 필지 데이터와 바로 결합되지 않고, 주소 문자열 매칭에 의존해야 한다. 서천군 한 곳만 다루므로 다른 시군과 비교하려면 별도 자료가 필요하다.
