description_portal: 소비자들의 안전한 축산물에 대한 관심 증대와 식품 안전성 확보를 위한 체계적인 축산물 유통업체 관리 필요성이 높아지고 있으며, 축산물위생관리법에 따른 적정한 축산물 가공·유통업체 관리와 위생 안전 기준 준수를 위한 현황 파악이 중요해지고 있습니다. 축산업 발전과 축산물 유통 구조 개선을 통한 농가 소득 증대와 지역 축산업 경쟁력 강화의 필요성이 증대되고 있으며, 축산물 가공업체와 유통업체의 투명한 운영과 공정한 경쟁 환경 조성을 위한 정보 공개가 요구되고 있습니다. 축산물 안전 관리와 식중독 예방을 위한 위험요소 관리 시스템 구축과 체계적인 업체 관리·감독의 중요성이 커지고 있으며, 축산물 소비자들의 제품 선택권 보장과 안전한 축산물 구매를 위한 정보 접근성 향상이 필요합니다. 또한 지역 축산업 발전 정책 수립과 축산물 유통 개선 방안 마련을 위한 기초 자료 확보의 필요성이 증가하고 있으며, 축산물 관련 업체의 지역 경제 기여도 분석과 산업 발전 계획 수립을 위한 실증적 데이터 제공이 중요하게 되어, 충청남도 보령시는 관내 145개소 축산물 관련업체의 위치, 연락처 등 축산물 안전 관리와 지역 축산업 발전에 필요한 종합적인 축산물관련업 현황 정보를 제공하고 있습니다.
