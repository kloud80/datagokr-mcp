summary_user: 국가표준식물종관리시스템의 식물종 기본정보를 종 단위로 담은 파일로, 학명 식별자·분류 계급·과·속 구분과 한글명·영명·일명·중명, 원산지·자생지, 형태·잎·꽃·열매·줄기·뿌리 설명, 번식·활용·보호·병충해 정보를 한 행에 담는다. 연구자나 수목원·식물원 담당자가 "이 식물의 표준 한국명과 학명, 자생지와 번식 방법은 무엇인가"를 확인하거나 기관마다 다른 식물명 표기를 하나로 맞추는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 학명 식별자(학명_아이디)·종 코드나 한글명·학명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 국가표준식물종관리시스템에서 사용하는 식물명 정보를 시스템이 인식할 수 있는 구조화 형식으로 분리하고 정규화해 둔 데이터입니다. 학명 기본형과 저자명, 출판 연도와 서지 정보, 분류학적 계급 문 강 목 과 속 종 이하 아종 변종 품종, 이명과 유효명 관계, 한국명과 영문명 등 다국어 동의명, 로마자 표기, 표준 코드와 내부 식별자, 명명 상태와 적용 범위, 상위와 하위 분류군 연결 정보가 항목별 필드로 구분됩니다. 이 표준화된 명칭 키를 기준으로 이후 개체 등록, 도입 및 증식 기록, 보관 위치 변동, 분양과 이전 및 폐기 등 이력 데이터가 연계 저장되며, 용어 검증과 중복 검사, 기관 간 데이터 매칭과 교차 검증을 안정적으로 수행할 수 있습니다.
