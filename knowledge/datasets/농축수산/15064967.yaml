description_portal: '인천광역시 수산물 어획고, 어업별 생산 현황 공공데이터는 인천 지역에서 생산되는 어업 방식별 생산량에 대한 통계 정보를 담고 있습니다. "어획고"는 생산량 또는 생산액을 의미하며, 이 데이터는 해양 수산 정책 수립 및 어촌 경제 분석에 필수적인 기초 자료가 됩니다.<주요 데이터 항목>-연도별 통계: 시간의 흐름에 따른 생산량 변화를 분석하여 어족자원 변동 추이나 계절별 생산 패턴을 예측하는 데 활용됩니다.-어업 방식별 현황: 연근해어업, 해면양식법, 내수면어업 등 생산 방식별로 구분된 생산량 정보가 포함됩니다.해당 데이터는 인천시 사전정보공개(수산업 통계) 또는 공공데이터포털에서 확인할 수 있습니다.'
