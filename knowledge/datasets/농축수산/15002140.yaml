summary_user: 농식품인재개발원이 직무 교육과정에서 견학·실습에 활용하는 전국 농림축산식품산업 현장교육지를 연도별로 정리한 목록으로, 교육지명·소재지·전화번호를 건별로 담는다. 교육 담당자나 농업 현장 견학처를 찾는 기관·단체가 "우리 지역에서 견학이나 실습을 받아주는 농식품 현장은 어디이고 연락처는 무엇인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 교육지명을 이름으로 맞춰 연결해야 한다.
description_portal: 농림축산식품부 농식품공무원교육원에서 직무 교육과정 운영의 내실화와 효과적인 학습을 위하여 전국의 주요 농림축산식품산업 현장을 방문하여 교육생이 현장에서 직접 실습하거나 견학을 통하여 학습효과를 극대화 할 수 있도록 전국의 주요 현장학습 교육지 현황를 데이터베이스화 하여 관리하고 있습니다.  등록 자료는 현장교육지명, 현장교육지가 위치한 지역 소재지, 현장교육지 연락처가 등록되어 있으며 시설물 견학 및 현장교육지 관리 우수사례 등으로 현장 실습이 이루어 지고 있습니다.
