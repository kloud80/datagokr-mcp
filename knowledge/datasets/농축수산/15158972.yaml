summary_user: 백두대간보호구역의 핵심구역과 완충구역을 산림공간정보(1:25000) 기반으로 담은 API이며, 범위는 전국입니다. 개발·인허가 검토자나 분석가가 특정 지역이 백두대간 보호구역(핵심·완충)에 해당해 개발이 규제되는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정구역 이름·도엽명(mapnm) 같은 이름 매핑으로만 이어 쓰며, 토지이용규제의 필지(PNU) 축과는 직접 연결되지 않는다.
limits: 필지 고유번호 같은 공통 키가 없어 토지·규제 데이터와 자동 조인이 어렵고 이름 매핑이 필요하다. 개발계정은 하루 1,000회 호출로 제한된다.
