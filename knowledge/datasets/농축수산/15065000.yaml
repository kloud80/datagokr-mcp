summary_user: 인천광역시 근해어업 허가 현황을 구분별로 2020~2024년 연도 열에 나눠 담은 집계표로, 건별 허가 원장이 아니며 파일 크기가 196바이트에 불과한 작은 표입니다. 수산 정책 담당자나 분석가가 '인천의 근해어업 허가가 최근 5년간 늘었나 줄었나'를 확인할 때 쓴다. 실측 컬럼에 허가번호·어선번호 같은 전역 조인 키가 없어, 다른 데이터와는 구분 이름이나 연도를 맞춰 붙이는 방식으로만 연결된다.
limits: 연도별 집계 수치만 있어 개별 허가·어선·어업인 단위 분석이나 허가번호·어선번호 기반 연계는 할 수 없다. 공통 조인 키가 없어 다른 지역·기관 자료와 비교하려면 구분 명칭을 직접 맞춰야 한다.
