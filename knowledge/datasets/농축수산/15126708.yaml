description_portal: 한국수목원정원관리원은 국립세종수목원의 에너지 사용 현황을 관리하고 에너지 효율 개선을 지원하기 위해 월별 전력 사용량 데이터를 개방형 데이터로 제공합니다.해당 데이터는 2022년부터 2023년까지의 전력 사용 정보를 월별로 구분해 정리한 자료로, 수목원 운영시설의 에너지 소비 현황을 확인할 수 있습니다. 계절별 사용 추이, 냉난방 수요 영향, 운영 시설 간 전력 편차 등을 분석할 수 있어 탄소중립형 수목원 운영을 위한 기초자료로 활용됩니다.데이터는 CSV 형식으로 제공되며, 연도·월 기준의 시계열 구조로 구성되어 있습니다.항목은 연도, 월, 총 전력 사용량(kWh), 세부 전력 요금 또는 고압·저압 구분 등의 보조 정보로 구성되어 있으며, 각 월별 수치가 정리되어 있어 특정 시기의 에너지 사용량 변화 및 패턴 비교가 용이합니다. 이를 통해 전력 피크 시점 분석, 설비 운영 효율 개선 방안 마련 등에 활용할 수 있습니다.본 데이터는 공공시설 에너지 효율 분석, 스마트 관리 시스템 구축, 환경경영 평가 등에 활용할 수 있습니다.공공기관은 온실가스 감축 기반 운영 전략 수립에, 연구기관은 계절별 수목원 에너지 수요 예측 및 분석 모델 개발에 활용할 수 있으며, 민간기업은 건축물 에너지 컨설팅 자료로도 연계 가능합니다. 특히, 공공기관의 에너지 투명성 확보 및 수목원 친환경 운영 이행에 중요한 기반 자료입니다.
