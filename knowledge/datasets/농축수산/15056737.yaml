summary_user: 경기도 축산농가에서 발생한 법정 가축전염병을 발생 건별로 담은 데이터로, 전염병명·농장 소재지·축종·감염 두수(OCCUR_HEAD_CNT)·진단일자·병성감정기관·시군명과 시군코드를 기록한다. 축산농가나 방역 담당자, 분석가가 "우리 시군에서 최근 어떤 가축전염병이 어떤 축종에 몇 두나 발생했나" 같은 지역별 발생 동향을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·시군코드 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 축산농가에서 발생한 법정 가축전염병의 현황을 기록한 자료로, 가축전염병명, 농장소재지, 축종명, 감염두수, 진단일자, 병성감정기관명, 시군명 및 시군코드 등의 항목으로 구성되어 있습니다. 이 데이터는 각 축산농가에서 가축전염병 발생 시 관할 방역기관에 보고된 정보를 기반으로 하며, 지역별 전염병 동향을 분석하고 효과적인 방역대책을 수립하는 데 활용됩니다. 또한 이 데이터는 질병예방정책 수립, 감염 확산 방지 연구, 지역별 방역 예산 계획 등에 중요한 기초자료로 사용될 수 있습니다. 데이터는 경기도 AI데이터행정과에서 제공하며, ‘농림축산식품 공공데이터포털’을 통해 원본이 관리되고 있습니다.
