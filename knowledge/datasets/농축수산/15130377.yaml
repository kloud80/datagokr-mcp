description_portal: '- 전라남도 귀농종합정보센터 홈페이지의 귀농, 귀산, 귀어, 귀촌  각 항목별 우수사례에 대한 정보를 조회하실 수 있습니다.- 센터명: 전라남도 귀농귀촌 종합지원센터, 위치: 전라남도 나주시- 전라남도는 귀농·귀촌을 희망하는 이들에게 다양한 지원과 사례를 제공하고 있습니다.- 귀농을 고려하신다면, 전라남도의 다양한 사례와 지원 프로그램을 참고하여 성공적인 귀농 생활을 준비하시길 바랍니다.- "귀농"이란 도시에서 살던 사람이 농촌으로 이주하여 농업을 생업으로 삼아 살아가는 것을 의미합니다. 단순한 이주를 넘어서, 농사를 짓고 농촌사회에 정착하는 전환적 삶의 선택입니다.'
