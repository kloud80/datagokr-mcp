description_portal: 이 데이터는 산림복지서비스이용권시스템에서 추출한 이용상세정보로, 다양한 이용권 관련 테이블로 구성되어 있습니다. 주요 구성은 신규 발급, 재발급, 충전 등의 이용권 신청 정보 관리 테이블, 이용권 사용 이력과 상태 변화 기록을 위한 이력 관리 테이블, 승인 및 취소 내역을 관리하는 테이블, 이용권 정산 내역을 기록하는 테이블 등을 포함하고 있습니다. 또한, 온라인 이용권 사용 상태(정지, 해제 등)를 카드사와 연계하여 송수신하는 정보 관리 테이블과 함께, 이전 사업에서의 비사용자 정보를 관리하기 위한 테이블도 포함되어 있어, 전반적인 산림복지서비스이용권의 운영 현황과 사용자 반응, 재정 흐름을 총체적으로 분석하는 데 활용될 수 있는 중요한 데이터입니다.
