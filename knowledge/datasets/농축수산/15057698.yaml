summary_user: 전국 농촌 마을 단위로 성별·연령대별(10대~80대) 인구, 총인구·주택 수와 빈집, 귀농 가구·인구, 버스·철도·여객선 운행 현황, 생계 유형별(농업·어업·자영·공공·기타·무직) 인원을 마을마다 한 건씩 담은 현황 데이터입니다. 귀농을 준비하는 사람이 고령화 정도, 빈집 수, 대중교통 여건으로 마을을 비교하거나, 분석가가 마을별 고령화와 귀농 유입 수준을 살피는 데 쓴다. 전역 조인 키가 없어 행정코드로는 다른 데이터와 직접 붙일 수 없고, 마을 ID(VILL_ID)는 같은 기관 데이터끼리, 그 밖에는 마을명 매핑으로만 잇는다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 농촌마을별 인원정보는 전국의 행정리 기준으로 2,600여 개의 농촌 마을에 대한 기본정보와 인구, 주택 현황, 귀농 현황 등을 포괄적으로 다루고 있습니다. 이 데이터셋은 농촌 정책 수립, 귀농 지원 프로그램 개발, 농촌마을 개선 계획에 귀하게 활용될 수 있으며, 매 2년마다 갱신될 예정입니다. 제공되는 마을 정보에는 각 마을의 명칭과 유래가 포함되어 있어, 마을의 역사적 배경도 이해하는 데 도움을 줍니다. 또한, API를 통해 제공되는 '농촌마을별 인원정보 조회' 기능을 이용하면, 특정 농촌 마을의 인구 현황, 세대수, 연령대별 인구 분포 등 다양한 인구통계학적 정보를 쉽게 검색할 수 있습니다. 이는 관련 기관이나 연구자, 정책입안자에게 귀농 지원 및 농촌 인구 관리에 필수적인 자료 제공 역할을 합니다.
