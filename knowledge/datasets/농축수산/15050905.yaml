description_portal: 텃밭 가꾸기 정보 내용본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘텃밭가꾸기’ 콘텐츠에 대한 상세 정보이다. 국민 누구나 쉽게 실천할 수 있는 생활 속 텃밭 조성을 위한 기초 정보를 제공하며, 주요 작물의 선택 방법, 파종 시기, 재배 요령, 수확 방법 등을 포함하고 있다. 가정, 학교, 공동체 공간 등 다양한 장소에서 활용 가능한 텃밭 운영 사례와 함께, 친환경 비료 사용법, 병해충 방제 요령 등의 실용적인 내용도 담고 있다. 초보자도 이해하기 쉽도록 구성된 삽화, 표, 재배 단계별 설명을 통해 자가 재배의 흥미와 참여도를 높이고 있다. 도시농업 활성화와 국민 건강 증진에 기여하는 실천형 콘텐츠로, 교육 및 체험활동 자료로도 활용 가능하다.
