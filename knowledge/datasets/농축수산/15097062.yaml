description_portal: 이 데이터셋은 제주특별자치도 관할 내 축산농가에서 고용 중인 외국인 근로자의 현황을 정리한 공공데이터로, 농가별 외국인 근로자 수, 고용 기간, 축종 또는 농가 유형, 체류 자격 정보 등 외국인 인력 활용 상황이 포함됩니다. 이 자료를 활용하면 제주 지역 축산업의 인력 구조, 외국인 고용 비율, 농가 당 평균 외국인 근로자 수 등의 정보를 파악할 수 있어 외국인 노동력 의존도 평가, 노동력 수급 계획, 이민 정책 및 농업정책 수립, 농가 지원 방안 마련 등에 기초 자료로 활용 가능합니다. 또한, 해당 데이터는 연구자·정책입안자·관계기관이 제주 축산업의 고용 형태 및 인력 변동을 분석하고 지속 가능한 축산업 운영 방안을 검토하는 데 유용하며, CSV 형식으로 누구나 무료 다운로드 가능하도록 제공됩니다.
