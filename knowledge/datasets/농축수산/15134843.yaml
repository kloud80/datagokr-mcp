summary_user: KAMIS 주간알뜰장보기 게시물을 등록번호·발행호수·등록일시와 함께 금주 동향·차주 동향 서술문으로 담은 전국 단위 파일(csv, 약 95KB)로, 품목별 가격 수치가 아닌 주간 동향 요약 글 모음이다. 소비자나 물가 기사를 쓰는 기자가 '이번 주 농수산물 가격이 어떻게 움직였고 다음 주에는 어떻게 될까'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 KAMIS 가격 데이터와는 등록일시(주차) 기준으로 나란히 보는 정도로만 이어 쓴다.
description_portal: aT(한국농수산식품유통공사)는 ‘83.4월부터 국내 농수산물의 유통질서 확립, 수급조절 및 가격안정 정책수립 등을 위한 목적으로 유통정보 조사활동을 수행해오고 있으며, aT가 조사한 유통정보의 효율적인 분산을 통한 정보수요자의 유통에 관한 이해증진 및 정보활용도 제고를 위해 ’03.4월부터 Kamis(농수산물 유통정보) 홈페이지를 구축하여 서비스 중에 있습니다.Kamis 유통정보는 전국 주요 도·소매시장 대상으로 매일(토·일·공휴일 제외) 가격을 조사하여 공개하는  알뜰장보기 물가정보로 농수산물의 주간 가격 상승, 하락 동향을 살펴볼 수 있습니다.더욱 풍성한 정보는 KAMIS 주간알뜰장보기(https://www.kamis.or.kr/customer/trend/economic/economic.do?action=priceInfoNew) 메뉴에서 확인 가능합니다.
