description_portal: 이 데이터는 해양수산부에서 관측소관측정보에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 관측소아이디, 관측코드, 관측시간, 관측값 데이터로 구성되어 있습니다.본 데이터는 관측소관측정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.관측소관측정보란 관측소가 관찰하고 측정한 자연 현상(날씨, 대기 상태 등)에 대한 기록된 자료를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
