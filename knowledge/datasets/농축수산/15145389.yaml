summary_user: 생활해양예보지수 서비스가 지수를 제공하는 전국 해양활동 지점 143곳을 지점별 1행으로 담은 목록 파일이다(지수 종류, 권역, 지역명, 주소, 경도·위도 포함). 해수욕·갯벌체험·바다낚시를 계획하는 국민이나 관광·체험 프로그램 담당자가 "내가 가려는 지역에 해양활동 지수가 제공되는 지점이 있는가"를 확인하는 데 쓴다. 경도·위도 좌표와 주소를 키로 다른 위치 데이터와 이어 쓰며, 지수 값 자체를 담은 데이터나 관측소코드와의 연결 키는 이 파일에 없다.
description_portal: 생활해양예보지수 서비스 지점 목록(해양수산부 국립해양조사원 제공)이 데이터는 국립해양조사원에서 운영하는 생활해양예보지수 서비스에 포함된 전국 해양 활동 지점의 목록을 제공합니다.생활해양예보지수란, 해수욕, 갯벌체험, 바다낚시 등 국민의 해양활동에 필요한 정보를 날씨와 바다 상황을 종합적으로 분석해 지수 형태로 제공하는 서비스입니다.본 데이터는 해당 예보지수가 제공되는 지점의 위치와 명칭, 구분 정보 등을 포함하고 있어 국민들이 원하는 지역의 해양활동 정보를 보다 쉽게 확인하고 활용할 수 있습니다.데이터 구성지수 코드명위치정보(경도)위치정보(위도)서비스 권역지역명주소지수 코드명(세부)활용 예시여행 및 레저 계획 시 해양활동 적합 여부 확인지자체 관광 콘텐츠 개발 및 홍보 자료로 활용해양 안전 및 체험 프로그램 운영 지원민간 기업의 기상·관광 정보 서비스 개발 자료로 활용관련 서비스생활해양예보지수 서비스www.khoa.go.kr/oceandata
