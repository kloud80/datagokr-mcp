description_portal: 경기도 파주시 농가의 축산업 현황을 파악하기 위한 공공데이터로서, 해당 농가의 식별정보를 나타내는 ‘농장명’, 사육 중인 가축의 종류(예:한우,돼지,닭등)을 나타내는 ‘축종명’, 사육 형태나 축종의 세부유형을 나타내는 '상세구분’, 해당 축종의 사육 개체수를 의미하는 ‘사육두수’, 농장의 실제 위치를 표시하는 ‘소재지도로명주소’와 ‘지번주소’, GIS기반의 공간분석이나 지도 시각화를 위한 좌표정보로 활용될 수 있는 ‘위도’와 ‘경도’ 등으로 구성되어 있습니다. 이 데이터는 축산업의 분포, 가축 밀집도, 환경영향평가, 방역정책수립, 재난대응 계획수립, 축산 자원 관리, 지역별 가축분포 분석, 스마트팜 인프라 구축, AI모델링 등 다양한 응용에 필요한 기초정보를 제공하며, 지역 단위의 생산성 분석, 농가 운영 효율성 연구 등의 기초 자료, 정책수립 및 산업연구 등에 활용될 수 있습니다. 현행화된 자료는 오픈 API형태로 개방 중인 '경기도 가금류 농장 현황'을 참고바랍니다.
