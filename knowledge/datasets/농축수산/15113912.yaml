description_portal: 이 데이터는 해양수산부에서 경기 지역의 해양 특성을 격자 단위로 조사한 결과를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 경기 지역 특성평가격자 공간정보일련번호, 격자아이디, 레이어명 등으로 구성되어 있습니다.본 데이터는 국가기관에서 경기 지역의 해양수산 환경의 공간적 분포를 분석, 해양 자원 관리, 해양 공간 계획 수립 지원을 위한 기초 데이터로 활용할 수 있습니다. 또한, 연구기관의 해역 특성 분석, 정책 수립과 지역별 해양 환경 변화 모니터링 자료로 활용될 수 있습니다.
