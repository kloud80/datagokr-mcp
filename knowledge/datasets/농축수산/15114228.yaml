summary_user: 해양수산부가 해양공간 특성평가를 위해 해역을 격자로 나눈 목록으로, 격자마다 격자번호·특성평가격자 아이디와 그 격자가 속한 특성평가 지역명·지역 아이디를 담은 전국 범위 파일(csv, 약 525KB)이다. 해양공간계획 담당자나 해상풍력 입지 분석가가 특정 해역 격자가 어느 특성평가 지역에 속하는지 확인할 때 쓴다. 특성평가격자 아이디(cheval_grid_msp_id)를 키로 다른 해양공간 특성평가·용도구역 자료와 격자 단위로 연결한다.
description_portal: 이 데이터는 해양수산부가 해양공간에 대한 평가를 수행하기 위해 격자 단위로 특성을 구분하여 수집한 데이터입니다.  본 데이터의 주요 내용은 특성평가격자의 공간정보 일련번호, 격자번호, 격자 아이디, 특성평가 지역명과 지역 아이디 정보로 구성되어 있습니다.  본 데이터는 유관 국가기관에서 해양공간의 관리, 정책 설정, 해역 이용계획 수립을 위한 기초 자료로 활용할 수 있습니다. 또한, 연구기관에서 환경영향 검토 및 해양공간 이용에 따른 영향 분석 등을 위한 기초 데이터로써 활용할 수 있습니다.
