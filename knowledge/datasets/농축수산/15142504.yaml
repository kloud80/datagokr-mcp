summary_user: 국립해양조사원이 표층 해류의 월·계절·연·20년 평균값을 지도 이미지로 만든 것을 담으며, 한 건은 지역·기간구분·관측시기별 이미지 URL 하나입니다. 해양오염 확산 경로를 검토하는 분석가나 어업·연안 안전 계획을 세우는 실무자가 "이 해역에서 계절별로 표층 해류가 평균적으로 어느 방향으로 흐르는가"를 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 기관(바다누리) 데이터와는 지역 이름(ocSeNm)이나 기관 자체 코드로 맞춰 이어 써야 합니다.
limits: 값은 수치가 아니라 이미지 URL로 제공되어 유속·유향을 직접 계산하거나 다른 표와 행 단위로 결합하기 어렵고, 공간 좌표가 없는 비공간 데이터입니다. 활용신청은 자동승인되며 serviceKey가 필요하고 개발계정은 하루 10,000회로 호출이 제한됩니다.
