description_portal: 이 데이터는 해양수산부 국립해양조사원에서 표층 해류의 월/계절/년/20년별 평균값을 시각화하여 제공하기 위해 수집한 데이터입니다.  검색지역, 관측연도 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 지역코드, 기간구분, 관측시기, 이미지 URL 정보로 구성되어있습니다.  본 데이터는 해양 연구, 해양 자원 개발, 해양오염 확산 경로 분석, 연안 구조물 설계와 같은 분야에 활용될 수 있습니다. 또한 연안 안전관리, 어업 활동 계획 수립 등 정책 마련 및 실무 업무 지원에도 사용할 수 있습니다.
