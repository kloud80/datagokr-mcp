description_portal: '한국해양교통안전공단(KOMSA)는 해사안전에 기여한 해운사를 지정하여 해운분야 사업자의 안전관리 역량강화를 유도하기 위하여 ‘해사안전 우수사업자’*를 선정하고 있다.(해양수산부가 주최, 한국해양교통안전공단 주관) * 근거 : 해사안전법 제57조의2(해사안전 우수사업자의 지정 등) 제1항공단의 해양교통안전정보시스템(MTIS)을 통해 온라인으로 진행된다.해사안전 우수사업자는 저사고율(60점) 및 안전경영지표(40점)평가결과 80점 이상(100점 만점)을 획득한 사업자 중 내항·외항 최고점을 획득한 각 1개 업체로 지정되며, 결과는 해양수산부·한국해양교통안전공단 홈페이지, 해양교통안전정보시스템(MTIS)에 공개된다.'
