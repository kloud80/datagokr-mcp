description_portal: 1. 소나무재선충병의 정의 소나무재선충병은 소나무재선충이라는 미세한 선충이 소나무류에 침입하여 발생하는 치명적인 산림 병해입니다. 이 선충은 나무의 물과 양분을 이동시키는 통로를 막아 수분 이동을 차단하며, 감염된 나무는 수관이 빠르게 갈변하고 잎이 마르면서 수개월 안에 말라 죽게 됩니다. 이 병은 선충 자체의 이동성은 제한적이지만, 주로 솔수염하늘소와 같은 곤충이 매개 역할을 하면서 확산됩니다. 매개충은 감염된 나무에서 재선충을 옮겨 건강한 소나무에 전파하며, 일단 감염이 일어나면 단기간에 다수의 나무가 피해를 입습니다.2. 관리 필요성 확산 속도가 빠르고 치료가 불가능해 조기 발견과 철저한 관리가 핵심입니다.매년 전국 단위 예찰조사를 실시하고 있으며, GIS 좌표 기반의 발생 현황 데이터는 예방·방제 정책 수립, 학술 연구, 시민 참여형 모니터링 등에 중요한 자료로 활용됩니다.3. 소나무재선충병 발생정보에 대한 제공 데이터는 다음과 같습니다.- 발생관리기관코드, 지역X좌표, 지역Y좌표, 국가지점번호, 토지관리번호(PNU코드), 발생경급수치, 고사목구분, 감염목구분
