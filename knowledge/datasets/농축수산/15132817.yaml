summary_user: 전라남도 어장도관리시스템에 등록된 어업면허 구역의 경계 포인트를 면허번호별로 한 점씩 담은 원천 파일로, 각 점의 기점 대비 방위각·거리와 직각좌표(X·Y)를 포함하며 범위는 전남 시도 단위·개별 좌표 수준이다. 어업인이나 해양공간 분석가가 특정 면허 어장의 경계가 바다 위 어디에 그어지는지를 GIS로 그려 확인하거나, 해상 노선·개발 예정지와 겹치는지 따지는 데 쓴다. 전역 조인 키는 없어 면허번호나 면허지역 이름·코드를 같은 기관의 어업면허 원장과 맞춰 잇고, 좌표로는 다른 해양 공간 데이터와 공간 중첩으로 연결한다.
description_portal: '- 전라남도 어장도관리시스템에 게재된 어업면허 포인트 정보(면허번호, 면허지역_지역코드, 기점에서의 방위각도 및 방위각분, 포인트, 좌표 등)에 대해 조회하실 수 있습니다.- 전라남도의 어장도 관리시스템은 어업 면허, 해상 노선, 해안선 등 해양 공간 정보를 체계적으로 관리하고 제공하는 시스템입니다. 이를 통해 어업 활동의 효율성과 안전성을 높이고, 관련 정책 수립에 활용되고 있습니다.- 분석 도구 활용 : 다운로드한 데이터를 GIS(지리정보시스템) 소프트웨어나 데이터 분석 도구를 사용하여 시각화하고 분석할 수 있습니다.- 정책 수립 및 연구 : 어업 정책 수립, 해양 환경 연구, 해상 교통 최적화 등 다양한 분야에서 활용 가능합니다.'
