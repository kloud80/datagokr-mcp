description_portal: 본 데이터는 경상북도 경주시 관내 양돈농가의 현황을 수록한 파일 형식의 공공데이터이다. 데이터에는 사업장명, 축종, 주소, 사육두수, 오폐수처리방법 등의 항목이 포함되어 있으며, 가축 사육 규모와 환경관리 현황을 종합적으로 파악하기 위해 구축되었다. 이를 통해 경주시 내 돼지 사육 농가의 분포, 사육두수 현황, 오폐수 처리 방식 등을 분석할 수 있으며, 가축분뇨 관리정책, 환경오염 저감대책, 축산업 행정지원 등의 기초자료로 활용된다. 본 자료는 지역 축산업의 지속가능한 발전과 환경보전을 위한 행정 의사결정에 활용될 수 있도록 정기적으로 갱신되고 관리된다. 경주시는 데이터의 정확성과 신뢰성을 확보하기 위해 검증 절차를 거쳐 공개하고 있다.
