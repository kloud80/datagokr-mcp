description_portal: 이 데이터는 해양수산부에서 해양환경현황분석에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 데이터원천, 측정소명, 년도, 월, 수온(℃), 용존산소량(㎎/L), 인산염인(㎎/L), 전기전도도(μS/㎝), 총인(㎎/L), 총질소(㎎/L), 클로로필A(㎎/㎥), 화학적산소요구량(㎎/L), 총질소/총인, 위도, 경도, 날짜 데이터로 구성되어 있습니다.본 데이터는 해양환경현황분석 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.해양환경현황분석이란 연안 및 근해역의 해양환경 상태와 오염원을 정기적으로 조사하고 종합적으로 파악하는 것을 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
