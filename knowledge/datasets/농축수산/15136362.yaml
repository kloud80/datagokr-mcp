summary_user: 통계 연도별로 어선을 톤수·선질 같은 구분(컬럼 구분 1·2) 단위로 묶어 전체 척수와 디젤·소구·가솔린·기타 엔진별 척수를 담은 전국 단위 집계 파일(csv)이다. 수산 정책 담당자나 분석가가 '특정 톤급·선질의 어선 중 디젤 엔진을 단 배는 몇 척인가' 같은 질문에 답하거나 엔진 유형별 어선 분포의 연도별 변화를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 어선 통계와는 통계 연도와 구분 명칭을 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 해양수산부가 어선의 엔진 종류별 집계 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 통계 연도별로 어선의 정렬 1 번호, 정렬 2 번호, 컬럼 구분별 명칭, 전체 어선 척수뿐만 아니라, 디젤 엔진, 소구 엔진, 가솔린 엔진, 기타 엔진을 장착한 어선의 척수, 데이터 최초 생성 시점과 최종 변경 시점 정보로 구성되어 있습니다.  본 데이터는 어선의 종류 및 엔진 유형별 분포를 파악하거나, 엔진별 어선 관리 현황 자료로 활용될 수 있습니다. 또한, 수산업 종사 기관이나 정책 수립 부처에서는 어선 등록 및 현황 조사, 어선 안전성 분석, 어업 정책 결정 등의 기초자료로 사용할 수 있습니다.
