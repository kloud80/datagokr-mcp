summary_user: KAMIS 조사가격을 조사일·조사구분(산지·경락/도매·소매)·지역·시장·품목·품종·단위·등급별로 담고, 당일 가격(TODAY_PRIC)과 전일 가격을 함께 싣는다. 범위는 전국이며, 각 조사 코드 옆에 농수축산물 표준코드로 변환한 시장·품목·품종·단위·등급 코드를 붙인 건별 가격 자료다. 유통업자나 분석가가 특정 품목의 도매 경락가와 소매가가 같은 날 지역별로 얼마나 벌어졌는지 확인할 때 쓰고, 물가 점검이나 식자재 구매 가격의 기준으로도 쓴다. 실측에서 전역 조인 키는 찾지 못해, 표준 품목코드(STD_PRDLST_CODE)·표준 시장코드 같은 기관 코드나 이름 매핑으로 다른 가격·도매시장 자료와 잇는다.
description_portal: '농림수산식품교육문화정보원에서 농수산식품유통공사, 농협중앙회, 수협중앙회, 축산물품질평가원 등 여러 기관과 협력하여 수행한 농수축산물 유통정보 조사는 매우 중요한 데이터입니다. 본 데이터는 유통단계(산지, 경락/도매, 소매)별로 지역에 따라 수집한 농수축산물의 대표 품목에 대한 정보를 포함하고 있으며, 이러한 정보는 주요 소비지에서의 가격 변화 및 유통 경로를 이해하는 데 기여할 수 있습니다. 제공되는 값에는 도매시장경락가격과 산지공판장 가격 등을 포함하며, 사용자들이 통찰력을 얻을 수 있도록 농수축산물표준코드와 연계하여 변환된 조사 가격 코드를 제공합니다. 이 데이터는 예를 들어 농업 관련 정책 수립, 소비자 교육, 유통플랫폼의 가격 결정 등의 다양한 분야에서 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. EXAMIN_DE(숫자형) : 조사 날짜, EXAMIN_SE_NM(문자형) : 조사 가격의 유형, EXAMIN_MRKT_NM(문자형) : 시장 이름, EXAMIN_PRDLST_NM(문자형) : 품목 이름, TODAY_PRIC(숫자형) : 현재 가격 등이 포함되어 있습니다. 이와 같은 데이터 구조는 연구자와 실무자들이 쉽게 활용할 수 있도록 설계되었습니다.'
