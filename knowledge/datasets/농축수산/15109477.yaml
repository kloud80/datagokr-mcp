summary_user: 한국수목원정원관리원 시드뱅크가 보유한 자생식물 종자를 종자 식별번호(seed_id) 단위로 묶어, 학명·국명·과·속 분류 정보와 광학·주사전자현미경으로 촬영한 종자 이미지 파일 경로, 종자 크기(길이·너비), 채집지·채집일을 담는 건별 자료다. 연구자나 AI 개발자가 '이 종자는 어떤 종이며 겉표면 미세구조가 어떻게 생겼는가'를 확인하거나 종자 이미지 인식 모델의 학습 자료를 모을 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로, 학명(scntf_nm)이나 국명으로 다른 식물 정보와 이름 매칭하거나 같은 기관 데이터와 연결해야 한다.
description_portal: 본 데이터는 식물 종자의 미세 구조를 이미지 데이터화하여 분류학적 연구와 종 식별의 정확도를 제고할 목적으로 한국수목원정원관리원 시드뱅크가 보유한 종자 자원의 광학 및 주사전자현미경 촬영 화상 정보를 제공하는 데이터입니다. 종자 고유의 식별 번호와 분류학적 명칭인 학명 및 국명을 기반으로 종자의 겉표면 구조와 미세 형태적 특징을 촬영한 고해상도 이미지 파일 정보를 수록하여 실물 자원과 데이터 간 연계성을 확보했습니다. 종자 분류 및 종 식별을 위한 학술 연구와 인공지능 기반 종자 이미지 인식 모델 개발 및 생물자원 교육 표준 자료로 다양하게 활용됩니다.
