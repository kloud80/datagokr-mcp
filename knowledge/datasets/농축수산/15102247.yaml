summary_user: 농식품 관련 백과사전 항목을 한 건씩 담은 데이터로, 항목마다 카테고리·제목·요약글과 최대 5개의 소제목·본문, 등록일이 들어 있으며 작물재배·비료·병해충·육묘·가축 사육·유통무역·영농기반 등을 전국 단위(비공간)로 다룬다. 농민이나 농업 교육 담당자가 '이 작물의 육묘와 병해충 관리는 어떻게 하나' 같은 영농 기술 질문의 설명 자료를 찾거나 교육 콘텐츠를 만들 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 제목·카테고리의 이름 매핑으로만 연결하며, KAMIS 품목코드 같은 가격 데이터 코드와도 직접 이어지지 않는다.
description_portal: 농림수산식품교육문화정보원에서는 농식품과 관련된 다양한 정보유형을 포함한 오픈백과사전을 제공하고 있습니다. 본 데이터베이스는 작물재배와 관련한 기술적인 정보뿐만 아니라 비료, 병해충 관리, 육묘, 가축 사육 등 각종 농업 관련 정보들을 포괄하고 있습니다. 이로 인해 농민 및 관련 종사자들은 보다 쉽게 필요한 정보를 검색하고 활용할 수 있게 됩니다. 또한, 유통무역과 영농기반에 관한 정보도 포함되어 있어, 농식품의 생산부터 유통에 이르기까지 폭넓은 자료를 제공합니다. 이러한 정보는 정책 분석, 연구, 교육 및 실무에 이르기까지 다양한 분야에서 효율적으로 활용될 수 있습니다. 예를 들어, 농업 교육 프로그램에 이용하거나 새로운 농업 기술 개발에 기여할 수 있습니다. 따라서 본 데이터는 농림수산업의 지속 가능한 발전에 이바지하고 있습니다.
