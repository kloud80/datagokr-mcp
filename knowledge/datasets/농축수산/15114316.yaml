description_portal: 이 데이터는 연안관리법에 따라 연안통합관리의 전략별 과제와 그 집계 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 연안통합관리 전략별 추진 과제의 기본정보, 과제별 목표정보 등으로 구성되어 있습니다. 과제명, 세부추진과제명, 주관주체명 등 정보를 포함하고 있습니다.  본 데이터는 중앙정부 및 지방자치단체의 연안관리 정책 수립, 추진 현황 분석, 연안환경 개선사업 평가, 과제별 목표 달성 현황 확인 등에 활용될 수 있습니다. 또한 관련 연구기관에서는 연안관리 체계에 대한 현황 조사, 연안개발 및 보호 방안 마련, 관련 법제도 개선 방안 연구 등에도 본 데이터를 활용할 수 있습니다.
