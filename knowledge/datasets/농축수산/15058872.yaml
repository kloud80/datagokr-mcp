summary_user: 국립수목원 국가생물종지식정보시스템의 지의류 자원을 도감 항목과 표본 단위로 담으며, 목록 검색과 상세 조회를 함께 제공한다(학명·국명·과·속명, 이미지 주소 등). 지의류를 조사하는 연구자나 숲 해설·교육 담당자가 '이 지의류의 학명과 소속 과·속은 무엇이고 어떤 모습인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 생물종 데이터와는 학명·국명 같은 이름 매핑이나 같은 기관의 코드로만 연결한다.
