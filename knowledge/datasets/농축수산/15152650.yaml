description_portal: 본 데이터는 2013년부터 2024년까지 한국농어촌공사 지역본부별 농지연금 운영 현황을 종합적으로 제공하고 있습니다.농지연금이란 60세 이상 고령농업인이 소유한 농지를 담보로 노후생활 안정자금을 매월 연금으로 지급받는 제도로 "한국농어촌공사 및 농지관리기금법" 제10조(사업) 및 제24조의5(농지를 담보로 한 농업인의 노후생활 안정 지원사업 등)에 근거하여 사업이 시행되고 있습니다.지역본부별 농지연금 연평균 농지평가액(백만원), 농지연금 전담 인력 수(명), 지사 수(개소), 농지연금 연간 지급액(백만원), 농지연금 신규 가입자 수(명), 농지연금 해지자 수(명) 포함하고 있습니다.
