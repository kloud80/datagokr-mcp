summary_user: 경기도 스마트팜 적용 농가에서 수집한 재배 정보(품종·정식일·재식밀도·적과량·수확 시작·종료일 등), 온실 내외 온도·습도 측정값, 센서·구동기 정보, 온실 시설 제원을 농가 식별자(frmhs_id)와 시도·시군구 코드 단위로 담는다. 스마트팜 운영자나 농업 분석가가 '온실 내부 온도·습도 관리 방식이 품종별 수확 시기와 적과량에 어떤 차이를 보이는가' 같은 환경-생육 관계를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시도·시군구 코드(sido_cd, signgu_cd)나 품종명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 스마트팜 기술이 적용된 농가에서 수집된 환경 및 재배 관련 정보를 포함하고 있으며, 주요 항목으로는 경영체 정보(시, 군), 재배 정보(품종, 적과량, 적엽량, 수확 시기 등), 환경 정보(내부 온도, 상대습도 등), 구동기 작동 정보(환기팬, 차광막, 냉난방기 등) 및 연계된 시설 정보 등이 포함됩니다. 해당 데이터는 스마트팜 운영 효율성 향상, 작물 생육 분석, 농가 맞춤형 환경제어 전략 수립 등의 목적에 활용될 수 있으며, 온실 내 환경 요소와 작물 생육과의 상관관계 분석 등 농업 데이터 기반 의사결정 지원에도 유용합니다. 스마트팜 분야, 온실방향 등의 코드값은 파일탭을 참고해주시기 바랍니다.
accrual_periodicity: 수시
team:
  dept: AI미래행정과
