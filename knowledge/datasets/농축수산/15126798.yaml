summary_user: 해양수산부가 해양 개발·이용 행위의 해역이용 적정성과 예상 해양환경영향을 평가한 해역이용협의 건을 사업 단위로 담은 파일로, 사업명·사업수행자명·영향평가 사업면적과 공간정보 일련번호를 포함하며 범위는 전국이고 위치는 개별 주소·좌표 수준이다. 해상풍력 등 해역 개발을 검토하는 사업자나 분석가가 '이 해역 주변에서 어떤 사업이 누구에 의해 얼마나 넓게 협의를 거쳤나'를 확인하는 데 쓴다. 전역 조인 키가 없어 해양공간계획 용도구역·보호구역 등 다른 해양공간 데이터와는 사업명·사업자명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
