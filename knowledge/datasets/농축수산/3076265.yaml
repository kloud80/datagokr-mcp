description_portal: 경상남도는 수산생물질병의 조기진단과 효율적인 확산 방지를 위해 체계적인 방역망을 구축하고 있으며, 이를 위해 공수산질병관리사를 통한 양식현장의 정기적이고 지속적인 예찰 활동을 실시하고 있습니다. 공수산질병관리사는 현장을 직접 방문하여 수산생물의 건강 상태를 점검하고, 이상 징후가 발견될 경우 신속하게 대응할 수 있도록 정보를 수집하고 분석하는 역할을 수행합니다. 이와 함께 수산안전기술원의 전문 인력들도 자체적인 현장 조사를 병행하여 진행함으로써 이중의 진단 체계를 확보하고 있으며, 이를 통해 현장에서 발생할 수 있는 다양한 질병의 유형을 보다 정확하고 신속하게 파악할 수 있습니다. 수산생물 질병 발생 현황은 경상남도 전 지역을 대상으로 정기적으로 조사되며, 그 결과는 공공 데이터로 제공되어 투명하게 관리됩니다. 제공되는 데이터 항목으로는 조사에 참여한 기관명, 조사가 수행된 지역명, 현장 조사 일자, 조사 대상 품종, 질병 분류, 질병명(한글 및 영문 병기) 등이 있으며, 이러한 정보는 질병 예방 정책 수립 및 대응 매뉴얼 마련에 중요한 기초자료로 활용되고 있습니다. 또한 질병 발생 이력과 그 원인 분석을 통해 향후 재발 방지 대책 마련에도 크게 기여하고 있습니다.
