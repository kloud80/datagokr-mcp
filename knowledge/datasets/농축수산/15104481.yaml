summary_user: 농림축산식품부와 농림수산식품교육문화정보원이 현장을 반영해 만든 농경지 전자지도(팜맵) 중 서울·세종·6대 광역시 구간을 SHP 공간파일로 담으며, 활용신청 없이 약 167MB zip 한 묶음으로 받는다. 도시 지역 농지의 위치와 경계를 지도에 올려, 특정 동네에 실제 경작지가 어디에 얼마나 남아 있는지 확인하는 분석가나 농지 정책 담당자가 쓴다. 실측 파싱에서 확인된 컬럼은 속성필드 정의표(필드명·데이터 타입·값 설명)뿐이고 전역 조인 키는 찾지 못해, 다른 농지·필지 데이터와는 지역 이름이나 코드 매핑으로만 연결한다.
description_portal: 농림축산식품부와 농림수산식품교육문화정보원에서 제작한 현장을 반영한 농경지 전자지도인 팜맵 공간정보(SHP) 제공입니다. 이 데이터는 서울 및 세종과 6대 광역시에 걸쳐 있는 농경지의 위치와 관련된 정보를 체계적으로 시각화한 지도 자료로, 농업 관련 정책 수립과 실행에 있어서 유용하게 활용될 수 있습니다. 또한, 시민들이나 농민들은 이를 통해 자신들의 농경지에 대한 이해를 높이고, 보다 나은 농업 경영을 위한 데이터 기반 의사 결정을 내릴 수 있습니다. 팜맵은 농업 발전에 기여할 수 있는 중요한 도구로, 농업 교육기관과 연구기관에서도 사용할 수 있습니다. 예를 들어, 학술 연구나 농업 관련 프로그램 및 교육 자료 개발 시, 본 데이터가 기본 자료로 활용될 수 있습니다.
