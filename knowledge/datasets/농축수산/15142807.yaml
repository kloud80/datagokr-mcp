description_portal: 이 데이터는 해양수산부가 바다내비게이션 시스템의 송수신기 장비에 관한 마스터 정보를 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 2023년 1월부터 2026년 4월까지의 기간 동안 해양수산부에 등록된 바다내비게이션 송수신기(마스터 정보)에 관한 항목들로 구성되어 있습니다. 송수신기 장비 통신번호, 제조사 등 정보를 포함하고 있으며, 개인정보는 삭제처리 되었습니다.  본 데이터는 바다 내비게이션 장비의 현황 및 보급실태를 파악하거나, 해상 안전관리 체계에 관련한 연구, 해양 교통 및 통신 인프라의 구축과 운영 실태 분석 등 관련 정책 수립 및 장비 운영 현황 모니터링 등에서 활용될 수 있습니다.
