description_portal: 농림식품기술기획평가원에서 보유하고 있는 농림식품 RnD 공고정보 입니다. 파일데이터(CSV) 형태로 개방하고 있으며, 기준년도, 공고명, 공고시작일, 공고종료일, 접수시작일, 접수종료일, 공고금액 정보를 포함하고 있습니다.1년 주기로 데이터를 개방하고 있으며, 데이터 이용 시 주기성 과거 데이터 확인 부탁드립니다.농기평 대표홈페이지 (ipet.re.kr)에서 사업 공고 정보에 대해 확인할 수 있습니다.농림식품 RnD 과제 공고의 사업별 접수 일정과 공고 금액 정보를 제공하며, 연구자와 기업 등 수요자가 지원 가능한 과제 현황을 한눈에 파악하고, 신청 전략을 세우는데 도움을 줄 수 있습니다. 또한, 정책 분석, 사업 계획 수립, 예산 기획 등 기초 자료로 활용할 수 있습니다.일반 국민 누구나 공공데이터포털(data.go.kr)을 통해 열람할 수 있도록 개방되어 있으며, 농림식품RnD 사업의 투명성과 접근성을 제고하는 데 기여하고 있습니다.
