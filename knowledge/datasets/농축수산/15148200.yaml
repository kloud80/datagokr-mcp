description_portal: 이 데이터는 기관의 사업 성과평가와 성과지표(KPI) 관리를 위해 2019년부터 2022년까지 수집·구축된 정보입니다.주요 항목으로는 평가년도(EVL_YEAR), 사업년도(BSNS_YEAR), 시도시군구코드(SIDO_SIGNGU_CD), 사업신청번호(BSNS_REQST_NUM), 사업선정번호(BSNS_SLCTN_NUM), 대상항구(TRGET_PRT), 인구지표(POPLTN_SOCTY1~5), 산업경제지표(INDUST_ECNMY1~5), 물리적 환경지표(PHYSICL_ENVIRN1~5), 공통지표(CMMN_IX1~2), 특화지표(SPCLIZ_IX1~3), 등록 및 수정 이력 등이 포함됩니다.이 데이터를 통해 각 사업의 성과지표 변화 추세를 확인할 수 있으며, 정책평가, 행정업무 지원, 성과분석 및 연구, 사업성과 관리, 지표 기반 의사결정 지원 등에 활용할 수 있습니다.
