description_portal: 이 데이터는 해양수산부에서 공유수면매립소규모매립에 대한 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 소규모매립번호, 소규모매립지자체명, 소규모매립사업명, 소규모매립상세주소, 소규모매립목적구분, 소규모매립공사기간내용, 소규모매립면적, 소규모매립공사금액, 소규모매립면허협의일자, 소규모매립준공검사일자, 소규모매립지번주소, 소규모매립협의단계, 소규모매립비고 데이터로 구성되어 있습니다.본 데이터는 공유수면매립소규모매립 정보 확인을 통한 다양한 해양 행정 및 정책 업무를 위한 기초 자료로 활용될 수 있습니다.공유수면소규모매립이란 국가나 지방자치단체가 해안도로, 수산물처리장 등 공공 목적을 위해 1,000㎡ 이하의 공유수면을 매립하는 행위를 의미합니다.본 데이터는 해양수산발전기본법 제32조 및 해양수산정보 공동이용 종합계획에 따라대국민 데이터 개방 확대 및 이용 촉진, 정책활용 지원 목표를 위해 수집, 관리되고 있는 데이터 입니다.
