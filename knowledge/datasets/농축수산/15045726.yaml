summary_user: 농수축산물 도매시장의 현재 표준시장코드와 시장명을 과거 시장코드·시장명과 한 행씩 짝지어 담은 전국 단위 코드 대응표이며, 포털에서 내려받는 CSV 파일은 약 3KB 규모입니다. 가격·유통 분석가가 과거 시장코드로 기록된 경락·거래 이력을 현재 표준시장코드 기준으로 이어 붙여 시장별 가격 추이를 끊김 없이 보려 할 때 쓴다. 시장코드(whsal_mrkt_cd)를 키로 도매시장 경락가격·반입물량 같은 시장 단위 유통 데이터와 잇고, 구시장코드는 과거 이력 데이터를 현재 코드로 바꾸는 데 쓴다.
description_portal: 본 데이터는 농림수산식품교육문화정보원에서 제공하는 ‘농수축산 신구표준시장목록’에 대한 정보이다. 농축수산물의 유통과 가격정보 표준화를 위해 과거 시장코드와 현재 사용 중인 표준시장코드를 연계한 자료이다. 항목에는 시장명, 신구 시장코드, 지역, 적용일자, 변경사유 등이 포함된다. 과거와 현재의 시장 식별 정보를 비교 가능하도록 구성되어 데이터 연계와 추적에 유용하다. 본 데이터는 유통정보 분석, 가격모니터링, 거래이력 관리 등 다양한 분야에서 활용 가능하며, 시스템 간 데이터 호환성과 이력관리의 정확성을 높이는 데 기여한다. 파일 형식은 CSV, XML, JSON이며 공공데이터포털을 통해 다운로드 및 오픈 API로도 활용할 수 있다.
