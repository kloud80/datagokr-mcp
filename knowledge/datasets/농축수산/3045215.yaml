summary_user: 국립농산물품질관리원이 관리하는 탁주·약주·청주·과실주 등 술 품질인증을 인증 건별로 담으며, 인증번호·인증기관·인증업체·품목명과 인증일자·인증 시작일·종료일을 포함하고 범위는 전국입니다. 소비자나 유통업자가 특정 전통주 업체의 제품이 현재 유효한 품질인증을 받았는지, 언제까지 인증이 유지되는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·품목명 같은 이름 매핑으로만 연결한다.
description_portal: 술품질인증 제도는 술 품질인증을 받고자 하는 생산업체가 정부가 지정한 인증기관에 인증을 신청한 술에 대하여 인증기관이 품질 심사 및 인증을 하고 그 인증품에 대하여 정부가 품질을 보증하는 제도로 우리술의 고품질 생산 장려 및 소비자 보호가 목적으로 도입한 제도입니다. 본 정보는 국립농산물품질관리원에서 관리하는 탁주, 약주, 청주, 과실주 등의 술 품질인증 정보로서, 인증번호, 인증기관, 인증업체, 품목명, 인증일자, 인증 시작일자, 인증 종료일자 항목으로 구성되어 있습니다. 전통주에 대한 관심이 많은 분들이 활용하면 좋을 것으로 보입니다.
