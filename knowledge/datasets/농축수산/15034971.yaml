description_portal: 본 데이터는 경기도 용인시 내 가금류 축산 농가의 현황 정보를 제공한다. 주요 항목은 농장명, 축종명, 상세구분, 사육두수, 주소, 위도, 경도 등으로 구성되어 있으며, 닭, 오리, 칠면조 등 다양한 가금류 축종별 농가의 위치와 사육 규모, 운영 현황을 종합적으로 파악할 수 있다. 자료를 통해 용인시 각 지역의 가금류 축산 농가 분포, 축종별 사육 특성, 세부 유형, 생산 규모, 공간 분포 등 다양한 정보를 확인할 수 있다. 본 데이터는 축산 행정 관리, 질병 예방 및 방역 정책, 농업 연구, 지역 농업 정책 수립, 사육 환경 분석, 농가 지원 등 다양한 목적으로 활용된다. 시민, 정책 담당자, 연구자 등 여러 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 농가 현황을 반영하여 정기적으로 갱신된다. 공공데이터 개방을 통해 정보의 신뢰성과 투명성을 높이고, 축산업 발전과 지역 농업 활성화에 기여하는 것을 목표로 한다.
