summary_user: 전국 잠업가구를 대상으로 기능성 양잠업 종사경력별 양잠 농가 현황을 담은 비공간 집계표이며, 포털 설명상 양잠형태별 생산, 누에 생산·판매 현황과 함께 제공된다. 기능성 양잠업 육성이나 신규 창업 지원을 검토하는 분석가가 '경력이 짧은 신규 농가 비중이 얼마나 되는가'처럼 전문 인력 분포와 숙련도를 가늠하는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 양잠·농가 통계와는 지역명·항목명을 맞추는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 양잠 농가현황에 관한 데이터로, 잠업에 종사하는 모든 잠업가구의 양잠형태별 생산현황, 누에 생산, 판매현황 및 기능성 양잠업에 종사한 경력을 조회할 수 있는 서비스를 제공합니다. 이를 통해 잠업 산업의 구조적 특성과 생산 현황을 종합적으로 분석할 수 있으며, 기능성 양잠업 경력 정보를 통해 전문 인력 분포, 기술 숙련도, 경영 안정성 등을 평가할 수 있습니다. 또한 누에 생산과 판매 현황을 연계하여 농가별 수익 구조와 생산 효율성을 파악할 수 있으며, 기능성 양잠업 육성과 관련한 정책 수립, 신규 창업 지원, 생산 시설 개선, 소득 안정화 전략 마련 등 다양한 산업적·정책적 활용에 기초 자료로 활용됩니다. 이 데이터를 통해 전국 양잠 농가의 체계적 관리와 기능성 잠업 산업 경쟁력 강화가 가능하며, 잠업의 지속 가능성과 고부가가치 창출 기반을 마련할 수 있습니다.
