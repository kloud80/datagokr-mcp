description_portal: 농림축산식품부 농업기계화 촉진법에 의거하여  관내 농업인들 대상으로 하여  유상으로 운영되는 농기계 임대사업이며 자세한 내용으로는 링크된 홈페이지 접속후 공지사항 게시판을 참고하시면 농기계임대사업 소개, 농기계임대사업 자격조건안내, 농업기계 보유현황(임대농기계)을 확인 할수있음.관내 농업인의 영농 부담을 경감하고 스마트한 농업환경을 조성하기 위해 농기계임대사업을 적극적으로 추진하고 있음. 이 사업은 고가의 농기계를 직접 구매하기 어려운 소규모 농가에게 다양한 농기계를 저렴한 비용으로 빌려주어 안정적인 영농 활동을 지원하는 것을 목표로 함. 이 사업을 통해 농업인들은 초기 투자 비용없이  필요한 농기계를 적시에 활용하여 생산성을 높이고, 일손 부족 문제 해결에 큰 도움이 됨.  앞으로도 농업인들의 의견을 적극 수렴하여 수요에 맞는 농기계를 지속적으로 확보하고 임대사업소 확충 및 서비스 개선등 농업발전에 기여할 계획임. 농기계임대사업은 농업인들의 스마트하고 효율적인 영농활동을 지원할 예정임
