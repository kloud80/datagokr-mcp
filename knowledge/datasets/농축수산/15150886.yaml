description_portal: '이 자료는 양산시 내 양돈농가의 사육규모와 시설현황을 세부 항목별로 정리한 기초데이터이다.돼지 사육두수, 축사 동수, 시설 면적, 사업장 소재 행정동, 그리고 데이터 기준일자를 함께 기록하여양산시 내 양돈업의 공간적 분포, 규모별 구조, 시설 집적도 등을 정량적으로 파악할 수 있도록 구성되어 있다.1. 등록축종: 본 자료의 주 대상은 “양돈(돼지)”이며, 이 항목은 전체 데이터에서 사육대상 축종을 정의하는 기본 분류 열로, 축종별 통계 산출의 출발점이 된다.2. 사업장소재지(행정동): 농가(축사)가 위치한 면·동 단위의 주소를 나타내며, 지역별 사육 집중도 분석의 기준이 된다.3. 사육두수: 각 농가가 실제로 보유하고 있는 돼지의 마릿수이며, 본 데이터의 핵심 지표이다.사육두수는 양돈업의 규모를 직관적으로 보여주며, 이를 기준으로 양돈 산업의 총사육 규모와 농가당 평균 두수를 산출할 수 있다.예를 들어, 총 사육두수가 15,000두이고 농가 수가 30호라면, 평균 500두 규모의 중대형 농가가 분포하고 있다는 의미가 된다.4. 동수(계): 돼지를 사육하는 축사 동(건물)의 개수를 의미한다.동수 정보는 사육두수 대비 축사 수를 통해 ‘농가별 밀집도(두수/동수)’를 계산할 수 있게 한다.5. 면적(계): 농가가 보유한 축사 부지의 총 면적으로, 보통 ㎡ 단위로 관리된다.면적 항목과 사육두수를 결합하면 **면적당 사육밀도(두수/㎡)**를 산출할 수 있다.'
