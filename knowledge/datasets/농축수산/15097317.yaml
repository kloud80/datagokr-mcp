summary_user: 해양수산부가 수산자원보호대상으로 지정한 구역의 공간정보를 WMS(지도 이미지)와 WFS(구역명 조회, 텍스트 좌표) 형태로 제공하는 API이며, 검증 호출에서 전국 범위의 개별 구역 10행을 받았다. 해상풍력 같은 해양 개발 입지를 검토하는 사업자나 분석가가 "이 해역이 수산자원보호구역에 걸리는가"를 확인하는 데 쓴다. 전역 조인 키가 확인되지 않아 다른 데이터와는 구역명·코드 매핑이나 같은 기관 코드로 잇고, 좌표(posList)를 이용한 공간 중첩으로 해양용도구역 등 다른 해양공간 영역 데이터와 겹쳐 본다.
description_portal: 이 데이터는 해양수산부에서 수산자원보호대상으로 지정된 구역의 정보를 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 WMS(웹 맵 서비스) 및 WFS(웹 피처 서비스) 형태로 구분되어 있습니다. WMS데이터는 반환 이미지 크기(픽셀), 검색 범위, 좌표체계 파라미터로 맵 이미지 파일을 조회할 수 있으며, WFS는 구역명을 파라미터로 수산자원보호구역의 텍스트 형태 공간정보와 구역코드, 면적 등 정보를 조회할 수 있습니다.본 데이터는 수산자원 보호 정책 수립, 해양 환경 연구, 어업 활동 계획 수립 등에 활용될 수 있습니다.
