summary_user: 국립수산물품질관리원이 쓰는 어류 검사분류체계를 담은 코드표 성격의 데이터로, 분류 항목별로 중·소분류 코드와 이름, 과·속·종 코드, 학명, 서식 구분, 패류 여부, 유해 여부, 유사어, HS 코드 등을 한 행씩 담는다. 범위는 전국이며 지역 구분이 없는 비공간 데이터다. 수산물 검사·유통 데이터를 다루는 분석가가 "이 어종명이나 학명이 어떤 검사분류·HS 코드에 해당하나"를 확인하거나, 위판장 경락 가격 같은 수산물 유통 데이터의 어종을 표준 분류에 맞출 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 그래서 다른 데이터와는 어종명·학명·유사어 같은 이름 매핑이나 HS 코드(HSK_CD), 매핑 코드 등 코드 대응으로만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국립수산물품질관리원에서 제공하는 어류 검사분류체계 관련 정보입니다.
