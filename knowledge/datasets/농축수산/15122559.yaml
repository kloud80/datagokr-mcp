description_portal: '농림수산식품교육문화정보원 농업온 시스템의 농업경영장부 현황에 대한 데이터로서, 경영장부의 현황을 월별로 기록하여 농업 경영을 보다 효율적으로 관리할 수 있도록 지원합니다. 이 데이터는 농업 관련 정책 분석, 교육 및 훈련 프로그램 개발, 농업 계열화 촉진 등 다양한 분야에서 활용될 수 있습니다. 데이터는 일자와 함께 영농일지 관련 항목으로 구성되며, 주요 항목에는 영농일지_단식청창농_건수, 영농일지_단식청창농_총건수, 영농일지_단식일반농_건수, 영농일지_단식일반농_총건수, 영농일지_복식청창농_건수 및 영농일지_복식일반농_건수 등 여러 가지가 포함됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 일자(문자형) : 해당 데이터의 기록 날짜, 영농일지_단식청창농_건수(숫자형) : 단식 청창농의 영농일지에서의 기록 건수. 영농일지_단식청창농_총건수(숫자형) : 단식 청창농의 총 영농일지 건수, 영농일지_단식일반농_건수(숫자형) : 일반농 영농일지의 건수, 영농일지_단식일반농_총건수(숫자형) : 일반농 영농일지의 총 건수 등으로 나타나며, 이를 통해 농업 경영의 세부적인 현황을 파악할 수 있도록 설계되어 있습니다.'
