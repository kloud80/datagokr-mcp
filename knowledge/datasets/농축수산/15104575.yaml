description_portal: 해양생명자원통합정보시스템(MBRIS)은 해양생물의 활용성과 연구 효율성을 높이기 위해 다양한 해양생물 관련 논문 정보를 체계적으로 수집하고 공개하고 있습니다. 이 시스템은 논문명, 저자, 발행연도, 초록 등의 핵심 메타데이터를 포함하여 사용자가 연구 및 분석에 활용할 수 있는 기본 정보를 제공합니다. 특히 사용자 편의를 위해 엑셀 다운로드 기능을 제공하여, 다수의 논문 정보를 손쉽게 일괄적으로 내려받아 오프라인에서도 활용할 수 있도록 지원하고 있습니다. 또한, 논문 원문에 대한 접근성 강화를 위해 ‘원문정보 바로가기’ 기능을 마련하여, 외부 학술 데이터베이스나 저널 사이트로 직접 연결되어 관련 논문의 전체 내용을 신속하게 확인할 수 있도록 설계되었습니다. MBRIS는 이를 통해 해양생물 연구자와 관련 산업 종사자들이 해양생명자원을 보다 효과적으로 탐색하고 활용할 수 있도록 돕고 있습니다.
