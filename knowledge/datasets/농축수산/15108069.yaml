summary_user: 전국 주요 봉우리 주변 숲길에서 확인된 야생동식물 관련 지점을 관심지점(POI) 한 건씩 담으며, 각 지점마다 숲길명, 위도·경도, 해발고도, 장소명, 설명 내용, 기준일시가 붙는다. 탐방객 생태해설 콘텐츠를 만드는 사업자나 연구자가 '이 숲길의 어느 고도·지점에서 어떤 야생동물을 만날 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 같은 기관의 다른 숲길·봉우리 데이터와는 숲길식별자(frtrlId)나 숲길명으로 맞추고, 그 밖의 데이터와는 좌표를 기준으로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 한국등산·트레킹지원센터에서 2022년 11월 16일에 등록하여 제공하는 오픈API 서비스로, 전국 주요 봉우리 지역에 서식하는 야생동식물 관련 정보를 조회할 수 있는 서비스입니다.API를 통해 관심지점식별자, 숲길식별자, 숲길명, 위도, 경도, 해발고도, 장소유형코드, 장소명, 설명내용, 기준일시 등의 속성을 호출할 수 있으며,이를 활용하여 산악지역의 생태자원 모니터링, 야생동식물 서식분포 연구, 환경보전 정책 수립, 탐방객 생태해설 콘텐츠 개발 등 다양한 분야에서 활용이 가능하며 JSON+XML 포맷을 지원합니다.
team:
  dept: 기획조정실
services:
  - op: /getWildInfoList1
    name: 전국주요봉우리 야생동식물정보 조회
    endpoint: https://apis.data.go.kr/B553662/wildInfoService1/getWildInfoList1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        example: '1'
        desc: 한 페이지 결과 수
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지 번호
      - name: type
        required: false
        example: xml
        desc: 데이터 타입
      - name: srchFrtrlNm
        required: false
        example: 지리산(천왕봉)
        desc: 숲길명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
