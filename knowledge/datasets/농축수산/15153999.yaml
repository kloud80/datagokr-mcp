summary_user: 해양수산부가 운영하는 해양 관측장비를 장비 단위로 정리한 목록으로, 장비번호·장비 종류·규격·운용 시작일·관측위치·장비 사진·관측지점명을 전국 범위로 담는다. 해양 관측자료를 분석하는 사람이 특정 관측값이 어느 지점의 어떤 장비로 언제부터 측정됐는지 확인할 때 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않아, 관측지점 코드(OBSRVN_FPOTG_CD)나 지점명을 매핑해 같은 기관의 해양 관측·예보 데이터와 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하 제공하고 있습니다.- 해당 데이터는 해양수산부에서 관측장비, 관측위치 등 제공하고 있는 정보입니다.
