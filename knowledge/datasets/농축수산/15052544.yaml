summary_user: 전국 화훼공판장 도매법인을 통해 거래된 화훼 경락 시세를 정산일자·화훼구분·품목·품종·등급별로 집계한 파일 데이터로, 2024-01-01부터 2024-12-31까지 356,362행을 담는다. 꽃 도매·소매업자나 분석가가 특정 품목·품종의 등급별 최고·최저·평균 단가와 총수량·총금액이 연중 어떻게 달랐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 농산물 가격 자료와는 품목명·코드 매핑을 거쳐야 이어지고, 품목코드가 KAMIS·도매시장·HS·KOSIS마다 달라 매핑이 필요하다.
description_portal: '화훼유통정보시스템(https://flower.at.or.kr/main/flowerMain.do)에 수집된전국 5대 화훼공판장 소속 도매법인을 통해 거래되는 품목, 품종들의 경락가격 등 시세자료 -화훼류의 경매시세를 제공하면서, 국내 꽃시장의 수요 및 공급, 낙찰가격에 따른 시장가를 비교할 수 있는 기초 자료를 제공합니다. 국내 화훼시장의 대표 경매장의 정보를 통해 낙찰 내역에 대한 정보를 투명하게 제공하여 국민의 알 권리를 충족하고자 합니다.데이터 설명데이터 컬럼 수: 10개데이터 컬럼 목록:  정산일자, 화훼구분명, 품목명, 품종명, 등급명, 최고단가, 최저단가, 평균단가, 총수량, 총금액'
