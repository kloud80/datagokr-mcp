description_portal: '해양수산과학기술진흥원이 제공하는 해양수산 분야 국가연구개발사업 과제 확정 대상 정보로, 연구개발 과제의 선정 및 확정 현황을 체계적으로 제공한다. 공고번호, 예산년도, 과제접수번호, 사업명, 과제명, 연구책임자, 주관연구기관, 과제담당자, 확정여부 등 다양한 항목을 포함하여 과제의 행정적 절차와 실제 진행 현황을 종합적으로 파악할 수 있다. 이를 통해 연구기관은 과제 추진 방향을 점검하고, 산업계는 참여 기회를 탐색하며, 정책 입안자는 연구개발 과제 선정의 흐름과 정책적 효과를 분석할 수 있다. 특히 신규 과제 기획, 연구개발 동향 파악, 정책 수립 및 제도 개선 등 다각적인 목적에 활용 가능하다. 본 데이터는 해양수산 분야의 연구개발 생태계와 과제 운영의 투명성을 확보하는 중요한 자료로서, 연구자·정책 담당자·산업계 종사자 모두에게 실질적인 가치를 제공한다. 참고: 2023년 이후 범부처통합연구지원시스템(IRIS)으로 해당 시스템이 이관되어 데이터 생산 중단'
