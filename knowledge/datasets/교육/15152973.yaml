summary_user: 경기도 사이버도서관에 참여하는 도서관별 명칭·주소·연락처·홈페이지, 상호대차·두루두루·내 첫 도서관 같은 서비스 제공 여부, 휴관 정보, 위치 좌표를 도서관 한 곳당 한 행으로 담는다. 주민이 우리 동네에서 상호대차가 되는 도서관이 어디인지, 분석가가 시군별 도서관 서비스 분포와 접근성이 어떤지 알아볼 때 쓴다. 전역 조인 키는 없어 도서관명·주소로 매핑하거나 같은 기관의 도서관 코드(librry_cd)로만 다른 자료와 잇고, 위치 좌표는 지도 위 거리 분석에 쓴다.
description_portal: 이 데이터는 경기도 내 공공도서관의 정보를 담고 있으며, 각 도서관의 명칭, 위치 정보(주소1, 주소2), 연락처(전화번호, 팩스번호), 웹사이트 URL, 다양한 서비스 제공 여부(상호대차, 두루두루, 내 첫 도서관 등), 공휴일 운영 정보, 위치 좌표(GPS_X, GPS_Y), 도서관 관리 구분 및 코드 등의 항목으로 구성되어 있습니다. 이 데이터는 경기도 내 도서관 현황 파악, 지역 주민의 도서관 접근성 분석, 공공서비스 개선, 위치 기반 서비스 제공 등에 활용될 수 있습니다. 특히 '상호대차 여부', '두루두루 여부', '내 첫 도서관 여부' 등의 항목은 도서관 간의 자료 공유와 주민 대상 프로그램 운영 여부를 나타내어 정책 수립 시 참고자료로 사용할 수 있습니다.
