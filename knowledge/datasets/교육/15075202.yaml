limits: 학교 표준코드 같은 공통 키가 없어 다른 교육 데이터와 결합할 때 학교명 표기 차이로 매칭 오류가 날 수 있다. 위치는 주소로만 제공되므로 지도 표시에는 별도 좌표 변환이 필요하고, 학생·학급·교원 수 같은 공시 지표는 담지 않는다.
