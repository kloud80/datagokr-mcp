description_portal: '금천구 관내 유치원 안전점검 및 교육 실시 현황을 데이터로 공개하고 있습니다.이 자료에는 관할 교육청, 유치원명, 유치원 유형(공립·사립, 법인·사인·단설·병설), 가스 점검 여부·점검일·점검 결과, 소방 점검 여부·점검일·점검 결과, 전기설비 점검 여부·점검일·점검 결과, 놀이시설 안전검사 대상 여부·검사일·점검 결과, 건물 안·밖 CCTV 대수, 유치원 주소와 같은 정보가 담겨 있습니다.이 데이터를 통해 우리 동네 유치원의 시설과 환경이 안전하게 관리되고 있는지를 확인하실 수 있습니다. 가스, 소방, 전기, 놀이시설 등 주요 안전 설비의 점검 이력과 결과를 한눈에 볼 수 있어, 자녀의 유치원 선택 시 안전성을 중요한 기준으로 삼으실 수 있습니다. 또한 교육·안전 관련 연구, 정책 개선, 지역 사회 안전망 강화 활동에도 참고 자료로 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
