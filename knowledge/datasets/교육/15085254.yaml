summary_user: 외국교육기관·외국인학교별 기준면적, 보유면적, 교지확보율과 연도별 변화, 보유 형태, 등록·수정일자를 담은 API로, 전국 130건이 학교 단위 개별 레코드로 있다. 교육 정책 담당자나 연구자, 학부모가 특정 외국인학교가 교지(학교 부지) 기준을 충족하는지 확인하는 질문에 쓴다. 학교 식별자(schoolId)로 같은 기관 안의 레코드를 잇지만, 다른 데이터와 이어 줄 전역 조인 키는 없어 이름이나 코드 매핑으로 연결해야 한다.
description_portal: 외국교육기관 및 외국인학교에 대한 종합 정보를 제공하여 국내에서 운영 중인 외국계 교육기관의 현황과 특성을 한눈에 파악할 수 있도록 구성된 데이터입니다. 학교별 기준면적, 보유면적, 교지확보율 등 주요 시설 현황과 연도별 변화, 보유 형태, 등록 및 수정일자 등 다양한 정보를 포함하고 있어 교육 정책 수립, 연구, 행정 업무, 학부모 및 학생의 학교 선택 등 다양한 분야에서 활용이 가능합니다. 외국인학교 및 외국교육기관의 시설 기준 충족 여부와 운영 현황 분석 등의 목적에 유용하게 쓰일 수 있습니다.
