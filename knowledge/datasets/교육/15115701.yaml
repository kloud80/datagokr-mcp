description_portal: 서울특별시 중랑구 소재 유치원의 각종 공제회 가입 현황입니다. 제공하는 주요 항목으로는 유치원코드, 유치원명, 설립유형, 학교안전공제회 대상 및 가입여부, 교육시설재난공제회 대상 및 가입여부, 공시차수, 주 등의 정보를 포함합니다. 데이터의 원본시스템은 유치원 알리미입니다. 교육청명과 교육지원청명은 서울특별시교육청, 동부교육지원청입니다. 설립유형으로는 공립(병설), 사립(사인)이 있습니다. 자세한 사항은 서울특별시 열린데이터 광장에 접속하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
