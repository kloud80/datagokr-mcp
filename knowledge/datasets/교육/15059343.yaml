summary_user: 경기도일자리재단 일자리플랫폼 잡아바에 올라온 공공일자리 채용공고를 공고 한 건 단위로 담고, 공고명·기관명·모집 시작일과 종료일·잡아바 상세페이지 주소로 구성된다. 구직자가 "지금 경기도 공공기관 중 모집 중인 채용공고가 어디 있고 언제 마감되나"를 확인하거나, 분석가가 기관별 공공일자리 공고 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM) 같은 이름 매칭으로만 연결한다. 채용 요건 쪽으로는 국가자격 데이터와 이어 볼 수 있지만 이 데이터에는 자격 요건 항목이 없다.
description_portal: '경기도 일자리플랫폼 잡아바에서 제공하는 경기도 내 공공일자리 정보 입니다. 공고명, 기관명, 모집 시작일자 및 종료일자, 잡아바 채용 상세페이지 URL 등으로 구성되어 있습니다.※ 데이터의 한계 : 일부 경기도 외 지역 정보가 포함되어 있습니다.※ 본 정보는 경기도일자리재단에서 운영하는 일자리플랫폼 잡아바!(www.jobaba.net)에서 제공하는 정보입니다.※ 자세한 내용은 상세페이지URL을 통해 확인하시기 바라며, 상세페이지에 있는 내용에 대한 무단복제 및 배포는 금하여 주시기 바랍니다.'
