description_portal: '금천구 관내 학원 및 교습소 현황을 데이터로 공개하고 있습니다.이 자료에는 기관 유형(학원/교습소), 학원명, 주소, 분야, 교습 계열 및 과정 목록/과정명, 정원 및 수용 인원, 수업 시간 및 수강료, 수강료 공개 여부, 기숙학원 여부, 우편번호, 등록일자와 같은 정보가 담겨 있습니다.이 데이터를 통해 관내 학원 및 교습소의 운영 현황과 수강 정보를 한눈에 확인하실 수 있습니다. 또 이를 바탕으로 자녀의 학습 계획, 수강 과정 및 수업료 비교, 기숙학원 여부 확인 등에 따라 어떤 학원이 자녀에게 적합할지를 판단하실 수 있으며, 교육 정책 연구나 지역 교육 환경 분석에도 유용하게 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
