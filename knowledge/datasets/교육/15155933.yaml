description_portal: 교정기관의 수용자들이 직업전환과 사회통합을 목표로, 출소 후 노동시장 재진입과 경제적 자립 기반을 강화, 현대 사회가 요구하는 기술 역량 강화와 디지털 리터러시를 확보하기 위해 다양한 기능경진대회에 참여한 내역이다.데이터는 기능대회명, 업종, 입상종류, 입상일로 구성되어 있으며,전국에서 개최되는 모든 기능대회 중에서 교정기관 수용자들이 참여하여 입상한 기능대회 목록이며, 입상종류는 금, 은, 동, 우수, 장려 등으로 이루어져있습니다.데이터는 매년 전국 교정기관의 수용자들이 참여한 기능대회 입상내역을 년 1회 주기로 업데이트할 예정이다.
