description_portal: '"충청남도교육청_학교별 CCTV 현황" 데이터는 충청남도 내 각급 학교에 설치된 CCTV의 운영 현황을 상세히 담고 있습니다. 구체적으로 각 학교의 CCTV 설치 대수, 설치 위치, 촬영 범위, 촬영 시간, 보관 기간, 관리 부서 및 담당자 정보 등이 포함되어 있습니다. 이 데이터는 개인정보보호법 제25조에 따라 학교의 시설 안전, 화재 예방, 학교폭력 예방 등 목적을 위해 수집되며, 각 학교의 영상정보처리기기 운영·관리 방침에 따라 정기적으로 갱신됩니다. 데이터는 교육청의 교육행정정보시스템과 각 학교의 자체 보고서를 통해 수집되며, 이를 통해 학교별 CCTV 설치 현황을 파악하고, 학생들의 안전한 교육 환경을 조성하는 데 기여합니다. 또한, 이 데이터는 교육 정책 수립, 시설 안전 점검, 범죄 예방 등 다양한 분야에서 활용될 수 있습니다.'
