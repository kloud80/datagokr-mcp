description_portal: 한국장학재단의 학자금대출 제도는 일반 상환 학자금대출, 취업 후 상환 학자금대출, 농촌출신대학(원)생 학자금대출, 학점은행제 학습자 학자금대출 등이 있으며, 이 중 농촌출신대학(원)생 학자금대출 제도는 농어촌출신 학부생 및 대학원생에게 등록금 전액을 무이자로 대출해주고 거치기간과 상환기간을 선택하여 상환이 가능하도록 함으로써 농어업인 자녀들의 고등교육기회를 보장하는 대출제도입니다. 해당 데이터는 농촌출신대학(원)생 학자금대출 실행단계에서 약정체결 시 제공하는 자료로서, 농촌출신대학생 학자금대출의 개요 및 특성, 대출금리 및 지연배상금률, 수수료 및 비용, 이자 및 분할상환금의 계산방법, 연체이자(지연배상금) 부과, 융자 제한 대상자, 상환방법, 조건변경, 상환 유예, 채무면제, 유의사항에 대한 내용이 포함되어있습니다.
