description_portal: 이 자료는 역사관련 사이트에서 제공하는 한국역사정보통합시스템의 역사 자료 메타데이터 중 사전 자료를 통합 검색하기 위해 제공된 메타데이터 정보입니다. 과거 데이터로는 3건의 주기성 과거 데이터가 포함되어 있으며, 각각은 2021년 10월, 2020년 9월, 2019년 9월에 등록된 사전 메타데이터 정보를 나타냅니다. 이러한 정보는 역사정보 연계와 통합 검색 기능을 지원하는 데 중요한 역할을 합니다.주요 제공 정보는 한국역사정보통합시스템이 제공 중인  역사 자료 메타데이터 중 사전 자료
