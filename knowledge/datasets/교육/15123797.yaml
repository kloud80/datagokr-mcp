summary_user: 경기도평생교육진흥원이 제작·공개한 영상 중심 디지털 콘텐츠를 한 편씩 공개 연도, 제목, URL로 정리한 건별 목록이다. 평생교육 담당자나 분석가가 연도별로 어떤 주제(노동인권, AI 음악, 심리, 언어 등)의 영상이 만들어졌는지 확인하거나 관심 주제의 강의 영상을 찾아 바로 열어볼 때 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 데이터와는 연도나 제목 키워드로만 느슨하게 맞춰 쓴다.
description_portal: 「진흥원 디지털 콘텐츠 생성 현황」 데이터는 경기도평생교육진흥원이 제작한 영상 중심의 디지털 콘텐츠 정보를 연도별로 정리한 자료입니다. 데이터는 콘텐츠가 공개된 연도, URL, 제목명으로 구성되어 있으며, 해당 영상들은 평생교육, 노동인권, AI 음악, 심리, 언어, 동기부여 등 다양한 주제를 포함하고 있습니다. 이 자료는 콘텐츠의 주제 흐름 및 시기별 제작 경향 분석, 디지털 콘텐츠 큐레이션, 콘텐츠 성과 분석, 교육자료 아카이빙, 홍보용 콘텐츠 재가공 등 다양한 목적으로 활용될 수 있습니다. 또한 영상 제목에 핵심 키워드가 포함되어 있어 관심 분야의 콘텐츠를 빠르게 식별할 수 있으며, URL을 통해 즉시 접근이 가능하여 사용자 편의성과 실용성이 높은 데이터입니다.
