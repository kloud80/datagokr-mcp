description_portal: 한국역사정보통합시스템이 제공하는 금석문 자료 메타데이터는 역사 관련 사이트에서 통합 검색을 가능하게 하는 중요한 역사정보 연계 데이터입니다. 이 메타데이터는 주기적으로 과거 데이터와 함께 2019년, 2020년, 2021년에 등록된 금석문 자료 정보를 포함하고 있어 한국역사자료의 깊이 있는 접근을 지원합니다. 이를 통해 금석문에 관한 풍부한 역사 데이터를 체계적으로 관리하며, 사용자에게 편리하고 통합된 검색 경험을 제공합니다.제공 형태는 유니코드 데이터로 UTF-8 인코딩으로 열어야 확인됩니다.
