summary_user: 서울 중랑구 어린이집을 한 곳씩 담은 시설 단위 현황으로, 어린이집명·유형·운영상태·주소·전화, 보육실·놀이터·CCTV 수, 정원과 현원, 연령별 반 수·아동 수, 위도·경도를 포함한다. 중랑구에서 집 근처에 빈자리가 있을 만한 어린이집이 어디인지, 동네별 영아반·유아반 공급이 충분한지를 보려는 부모나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 어린이집명·주소 같은 이름 매칭이나 위도·경도 좌표로 이어 써야 한다.
description_portal: 어린이집정보공개포털에서 제공하는 서울특별시 중랑구 어린이집 현황 정보입니다. 본 데이터의 저작권은 어린이집정보공개포털(http://info.childcare.go.kr/)에 있음을 알려드립니다. 이 데이터의 카테고리는 교육, 유아 및 초중등교육입니다. 제공하는 주요 정보로는 어린이집명, 어린이집유형, 운영현황, 상세주소, 전화번호, 보육실수, 놀이터수, cctv 총 설치 수, 위도 경도 등이 있습니다. 자세한 사항은 서울시 열린데이터광장 링크를 클릭하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
