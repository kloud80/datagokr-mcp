summary_user: 경상북도 청도군에서 운영 중인 학원과 교습소를 한 곳당 한 행으로 담은 소규모 CSV 파일(약 3KB)로, 명칭·분야 구분·주소·전화번호가 들어 있다. 학부모나 학생이 청도군 안에서 특정 분야 학원을 찾거나, 분석가가 군 내 학원 분포와 학원가 밀집도를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 행정구역으로 매핑하거나 학원명으로 맞춰 이어 쓴다.
limits: 학원 등록번호 같은 공통 코드가 없어 다른 교육청 학원 데이터나 행정 데이터와 정확히 연결하기 어렵다. 범위는 청도교육지원청 관할로 한정되므로 경상북도 전체 현황을 보려면 다른 교육지원청 파일을 따로 모아야 한다.
