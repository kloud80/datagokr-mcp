summary_user: 제주특별자치도 진로진학 누리집에서 제공하는 전국 대학의 학과별 입학전형 정보를 한 행에 대학·학과·전형 하나씩 담은 파일로, 포털 설명 기준 17,274건이며 계열, 전형명(대·중·소), 설립구분, 지역, 모집군, 모집인원, 1·2단계 전형내용, 입학사정관제 여부를 포함한다. 고교생·학부모·진학 교사가 특정 계열이나 지역의 대학 중 어떤 전형으로 몇 명을 뽑고 단계별로 무엇을 평가하는지 비교하는 데 쓴다. 전역 조인 키나 대학 코드가 없어 다른 대학 정보와는 대학명·학과명 같은 이름 매칭으로만 연결한다.
description_portal: '이 자료는 제주특별자치도 진로진학 누리집에서 제공되는 진로진학정보입니다. 제공되는 내용은 계열, 학과명, 전형유형, 전형명(대,중,소), 설립구분,설립구분(공사립), 지역명,모집군,모집인원,1단계전형내용, 2단계전형내용,대학명(캠퍼스)입학사정관제, 전형유형입니다.데이터 건수는 17,274건입니다. 이 자료는 우리교육청에서 제공되는 자료로 대학교 내용과 상이할 수 있으므로 , 상세한 내용은 해당학교또는 진로진학 홈페이지를 통해서 확인 하시기 바랍니다.진로진학 홈페이지 주소 : https://jinhak.jje.go.kr/?cpath=* 모집인원은 수치형이 아니고 문자형임'
