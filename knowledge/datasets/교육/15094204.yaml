description_portal: 한국사학진흥재단_대학별 기숙사 수용 현황은 한국사학진흥재단의 국공사립대학 캠퍼스별 기숙사 운영현황 집계를 통해 산출된 자료로, 대학의 캠퍼스별 수용 현황을 확인할 수 있습니다.대학의 기숙사 수용 현황 파악을 위해 대학 캠퍼스별 재학생 수, 수용가능인원, 기숙사수용률, 지원자 수, 입사경쟁률 자료를 제공하며, 설립구분별, 학교별, 캠퍼스별, 지역별, 학급별, 학종별로 확인 가능합니다.대학별 기숙사 수용 현황 데이터는 해당 링크에서 조사연도별로 확인이 가능하며, 엑셀파일의 형식으로 다운로드 가능합니다.
