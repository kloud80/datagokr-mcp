description_portal: 경기도교육청미래과학교육원은 수원, 의정부에 위치하고 있으며,미래의 꿈을 키우는 창의융합형 인재 양성을 목적으로학생의 창의력과 잠재력 개발을 위해 다양한 창의융합과학프로그램을 운영하고 있습니다.이 데이터는 경기도 내 학생들을 대상으로 운영하는 체험학습 프로그램 정보입니다.프로그램은 가족천문, 융합과학체험교실, 미과원공유학교로 구분되며, 학교급·학년별로 다양한 융합과학 프로그램이 구성되어 있습니다.프로그램은 경기도교육청미래과학교육원 홈페이지( https://www.gise.kr)의  "체험학습 신청" 메뉴를 통해서 사전신청을 하여야 하며, 신청인원이 많을 경우 추첨 또는 선착순으로 선정이 됩니다.
