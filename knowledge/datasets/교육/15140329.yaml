description_portal: '- 전라남도 내 예비창업자 및 창업초기의 기업을 발굴하여 우량 중소기업으로 육성, 종합적인 지원을 위한 대학창업보육센터 현황에 대해 조회하실 수 있습니다.- 센터명, 소재지, 연락처, 보육실 수, 개소일 등에 관한 데이터를 제공합니다.- 대학창업보육센터(BI, Business Incubation Center)는 예비 창업자와 초기 창업 기업을 대상으로 창업 공간, 멘토링, 교육, 자금 지원 등 다양한 서비스를 제공하여 창업 성공률을 높이고 기업 성장을 지원하는 기관입니다. 전국의 다수 대학에 창업보육센터가 운영되고 있으며, 전라남도 지역에도 여러 대학이 참여하고 있습니다.'
