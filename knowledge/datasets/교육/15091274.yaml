description_portal: 한국과학창의재단은 인공지능(AI) 시대를 선도할 교원의 AI 교육 전문성을 강화하고, 학교 현장에 적용 가능한 우수 교육 모델을 발굴·확산하기 위해 AI교육 교사연구회 운영을 지원하고 있습니다. 교사들의 자발적인 연구 활동을 통해 개발된 성과물을 공유하여 AI 교육의 현장 안착을 돕고자 합니다.개방 데이터는 2020년도에 활동한 30개 AI교육 교사연구회의 최종 성과물 목록입니다. 데이터는 각 연구회의 과제 수행 기간, 대표교사 소속 학교, 참여 교사 수, 그리고 최종적으로 개발된 '교과 융합 AI교육 프로그램', 'AI 리터러시 함양 자료', '학습 모델' 등 성과물의 제목 정보를 포함하고 있습니다.전국의 초·중·고등학교 교사들은 동료 교사들이 직접 개발한 우수 성과물을 AI 교육 수업 설계 및 자료 제작에 참고하여 전문성을 높일 수 있습니다. 교육부 및 시도교육청은 현장 교사들의 연구 결과를 바탕으로 실효성 있는 AI 교육 정책을 수립하고 교사 연수 프로그램을 고도화하는 데 활용할 수 있으며, 교육 콘텐츠 기업은 학교 현장의 요구가 반영된 새로운 AI 교육 상품을 기획하는 데 아이디어를 얻을 수 있습니다.
