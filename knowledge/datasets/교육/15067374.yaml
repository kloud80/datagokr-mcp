description_portal: 제공하는 데이터는 고등교육 교수학습자료 공동활용 체계인 KOCW(Korea OpenCourseWare)를 통해 국내 대학에서 개설된 공학 분야 강의의 목록 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 강의명, 대학명, 교수명, 전공분류, 강의개요, 강의구분, 학년·학기 등 공학 관련 강의의 주요 정보가 포함되어 있습니다. 각 대학 및 교수진이 KOCW 플랫폼에 직접 등록한 강의 정보를 기반으로 하며, 연 1회 정기적으로 데이터가 갱신됩니다. 데이터의 보유 및 제공 근거는 고등교육 혁신과 교수학습자료 공동 활용 촉진을 위한 관련 법령과 정책에 있습니다. 이 데이터는 공학 분야 대학 강의 현황 분석, 교육과정 비교, 교육정책 수립, 교수학습자료 개발, 학습자 맞춤형 강의 추천, 연구 및 통계, 온라인 교육 서비스 개발 등 다양한 분야에서 활용될 수 있습니다. 강의 형태에 따라 일부 강의는 학년·학기 정보가 공란으로 표기될 수 있습니다
