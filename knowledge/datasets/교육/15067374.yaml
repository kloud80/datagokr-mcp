summary_user: KOCW에 국내 대학이 등록한 공학 분야 강의를 강의 1건당 1행으로 담은 목록 파일로, 강의명·대학·교수·대분류/중분류·학년학기·학습자원 언어·라이선스·등록일시·강의 바로가기 주소를 담는다(CSV 약 43만 바이트, 전국 범위). 학습자나 교육 분석가가 "어느 대학이 어떤 공학 세부 분야 공개강의를 올렸고 무료로 바로 들을 수 있는 강의는 무엇인가"를 찾거나 분야별 개설 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 분야 KOCW 강의 목록이나 대학 공시 자료와는 대학명·분류명 같은 이름 매칭으로만 이어 쓴다.
limits: 대학 코드 같은 표준 식별자가 없어 대학 정보 데이터와 붙일 때 대학명 표기 차이를 직접 맞춰야 한다. 강의 목록 정보일 뿐 수강 인원이나 강의 내용 자체는 담지 않으며, 강의 형태에 따라 학년학기가 비어 있는 행이 있다.
