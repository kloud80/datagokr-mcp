description_portal: 대학알리미를 통해 제공되는 대학정보공시 항목 중 계약학과 설치 운영 현황에 대해 설명합니다. 대학별로 현장중심 실무형 교육과정과 산학협력 현황을 포함하고 있어, 대학의 교육 및 연구 활동 전반에 대한 정보를 제공합니다. 계약학과를 중심으로 한 실무형 교육프로그램 현황과 교원의 연구 및 학생 교육 상황을 체계적으로 파악할 수 있습니다. 이는 대학의 다양한 대학교종류와 운영 현황을 정확히 이해하는 데 중요한 자료입니다.<제공데이터>교육부(한국대학교육협의회)가 대학알리미에서 대학정보공시를 서비스 하고 정보공시 항목 중 12. 교원의 연구·학생에 대한 교육 및 산학협력 현황 - 카. 현장중심 실무형 교육과정 개설 현황  - 계약학과 설치 운영 현황을 제공합니다.
