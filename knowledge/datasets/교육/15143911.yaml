description_portal: 이 데이터는 서울시설공단 소속 임직원들이 수강한 교육훈련 이력을 항목별로 정리한 자료입니다. 각 교육은 "공통역량"과 "직무역량"으로 구분되며, 각 역량군별로 교육의 주요 내용, 교육과정 수, 교육에 참여한 인원 수, 총 교육시간(시간 단위)으로 구성됩니다. 예를 들어 ‘공통역량’에는 법정교육, 핵심가치 내재화, 디지털 교육 등이 포함되며, ‘직무역량’에는 직무기초·전문교육, 사내강사 교육 등이 포함됩니다. 모든 수치는 정량데이터이며, 단위와 의미가 명확하게 표기되어 있어 누구나 쉽게 이해할 수 있고, 항목 간 비교도 용이합니다.이 데이터는 사용자가 역량별 교육성과를 한눈에 확인할 수 있도록 설계되었으며, 교육 수요예측, 역량강화 정책 분석 등에 폭넓게 활용될 수 있습니다.
