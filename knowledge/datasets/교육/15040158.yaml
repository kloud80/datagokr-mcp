description_portal: 본 데이터는 경상남도 함안군에서 군민들의 디지털 정보 접근성을 높이고 IT 활용 역량을 강화하기 위해 시행하는 ‘군민 정보화교육’의 연간 및 월별 상세 일정 정보를 제공합니다.데이터의 주요 구성 항목으로는 교육 과정명(컴퓨터 기초, 인터넷 활용, 스마트폰 ), 교육 대상, 교육 기간 및 시간, 교육 장소(함안군청 내 전산교육장 등), 모집 인원 및 신청 방법 등이 포함되어 있습니다.특히 급변하는 디지털 환경에 발맞추어 고령층을 위한 스마트 기기 교육부터 실무 중심의 문서 작성 교육까지 폭넓은 과정 정보를 담고 있어, 군민들의 평생학습 지원 및 지역 내 디지털 격차 해소를 위한 기초 통계와 서비스 개발 자료로 유용하게 활용할 수 있습니다. 수집된 일정 정보는 매 기수 교육 시작 전 주기적으로 업데이트되어 최신성을 유지합니다.
