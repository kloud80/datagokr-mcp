summary_user: 경기도 안에 등록된 학원을 한 곳당 한 행으로 담은 건별 원천 목록으로, 학원명·설립유형·소재지 주소·전화번호·설립일·대표자·정원·운영과목이 들어 있고, 범위는 경기도 전역이며 위치는 개별 주소 단위다(xlsx 약 24MB). 학부모가 동네에서 특정 과목 학원을 찾을 때, 또는 분석가가 "어느 시군·동네에 학원가가 밀집해 있고 이것이 주택 수요와 어떻게 겹치는가"를 볼 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 소재지 주소를 시군구·읍면동 이름으로 매핑하거나 좌표로 변환해서 잇고, 학교 기본정보·학구도와는 지역 단위로 겹쳐 본다.
description_portal: 경기도 내에 등록된 학원의 주요 현황을 체계적으로 제공하는 데이터입니다. 이 데이터에는 학원명, 설립유형(일반, 예체능, 외국어 등), 소재지 주소, 전화번호, 설립일, 대표자명, 정원, 운영과목 등 학원 운영에 관한 구체적인 정보가 포함되어 있습니다. 해당 데이터는 경기도 내 각 교육지원청에서 학원 인가 및 변경, 폐원 등 행정 절차를 통해 수집되며, 「학원의 설립·운영 및 과외교습에 관한 법률」에 근거하여 보유 및 제공하고 있습니다. 데이터는 연 1회 이상 정기적으로 업데이트되어, 신규 학원 개설이나 폐원, 정보 변경 등 주요 변동사항이 반영됩니다.
