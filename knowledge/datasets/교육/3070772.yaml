summary_user: 상주 지역 폐교 한 곳당 한 행으로 활용유형(대부·자체활용 등), 폐교명·폐교연도, 소재지, 건물 연면적과 토지 면적, 대부자·대부활용 유형과 세부내역, 대부 시작·종료일을 담은 건별 현황 파일이며, 범위는 시도 단위이고 위치는 개별 주소로 적혀 있다. 지자체·연구자·사업자가 '상주에서 지금 비어 있거나 대부 기간이 곧 끝나는 폐교는 어디이고 면적은 얼마인가'를 확인해 활용·임대 검토에 쓴다. 전역 조인 키가 없어 다른 데이터와는 폐교명(학교 기본정보와 이름 매칭)이나 소재지 주소(지오코딩 후 행정구역·개발계획 자료와 결합)로만 이어 쓴다.
description_portal: 상주 지역 내 폐교된 학교의 재산이 어떻게 활용되고 있는지에 대한 현황을 종합적으로 안내하는 자료입니다. 이 데이터에는 폐지학교의 임대 및 자체 활용 현황 등 폐교재산의 구체적인 활용 방식이 포함되어 있습니다. 해당 정보는 행정지원과 등 관련 부서에서 폐교의 설립·폐지 및 자산 변동 사항을 공식 행정 절차와 현장 조사, 재산 관리 기록 등을 통해 수집하며, 「공유재산 및 물품 관리법」 등 관련 법령에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 연 1회 정기적으로 갱신되어, 상주 지역 내 폐교재산의 최신 활용 현황을 반영합니다.이 자료는 지역 내 폐교 재산의 효율적 관리와 활용, 임대 및 자체 활용 정책 수립, 공공자산의 투명한 운영, 지역사회 개발 및 활용방안 모색 등 다양한 분야에서 활용됩니다. 또한, 정책 담당자, 연구자, 지방자치단체, 민간기업 등에서 폐교 재산의 활용 가능성 분석, 지역 개발계획 수립, 공공시설 확충 등에도 중요한 참고자료로 사용할 수 있는 공공데이터입니다.
