description_portal: ‘한국학중앙연구원_조선조 무과급제자 정보’는 조선시대 무관을 선발하기 위한 무과(武科) 과거시험의 급제자 명단과 이들의 신상정보를 정리한 데이터입니다.이 데이터는 각 급제자의 이름, 성씨, 본관, 급제 연도, 왕대(응시 시기), 병과(丙科, 乙科 등) 등 기본적인 인적사항은 물론, 일부 인물의 경우 출신지, 생몰년, 관직 이력, 문헌 출처 등의 추가 정보를 포함하고 있습니다.조선시대 무과는 국가 방위를 책임지는 무관 인재를 선발하기 위한 시험으로, 특히 후기에는 지방 유생이나 향리층의 상층 진입 수단으로도 중요하게 작용했습니다.이 데이터를 통해 시대별 무과 급제자 수 추이, 성씨 및 본관 분포 분석, 왕대별 선발 기준 변화, 지방별 무과 합격자 밀도 지도 등 다양한 통계 분석 및 시각화가 가능하며, 계보 연구, 무관제도 연구, 병제사 연구, 지역사회 분석 등 인문·사회과학적 활용도도 높습니다.특히 이 데이터는 문과, 음관, 사마시 급제자 정보와 함께 연계 분석할 경우, 조선시대 신분 상승 경로와 국가 인재 선발 체계의 전체적인 구조를 파악할 수 있는 핵심 공공 인물 메타데이터입니다.
