description_portal: 전라남도교육청 홈페이지는 전남교육의 최신정보를 제공하고 이용자들에게 다양한 교육 콘텐츠를 제공하기 위하여 구축되어 운영 중에 있습니다. 해당 정보는 홈페이지 정보공개 > 재정공개 > 계약정보공개 > 개찰결과 > K에듀파인연계에 공개되어 있는 정보입니다. 해당 정보는 K-에듀파인(국가 교육행정·재정 통합시스템)시스템에서 자동 연계되어 누리집에서 실시간으로 제공되는 정보입니다. 해당 정보를 별도의 요청 없이 홈페이지에 공개함으로써 국민에게 투명한 재정정보를 제공하고 있습니다. 제공되는 정보는 전라남도교육청에서 제공하는 개찰결과로 회계연도, 계약기관, 계약명, 계약번호, 계약명, 낙찰금액, 낙찰비율, 낙찰업체명 등을 제공합니다. 해당정보 전라남도교육청 홈페이지에서 조회도 가능합니다.
