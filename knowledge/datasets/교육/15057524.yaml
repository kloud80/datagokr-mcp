summary_user: 경기도 시군별 학원을 한 곳당 한 행으로 담은 건별 원천 데이터로, 학원명·대표자·전화번호·업종구분·교습과정명과 도로명·지번 주소, 우편번호, 위경도 좌표를 포함한다. 학부모나 학원 창업자가 '우리 동네(읍면동)에 수학·입시 학원이 얼마나 몰려 있나'를 확인하거나, 분석가가 학원가 밀집도를 상권·주택 수요 신호로 볼 때 쓴다. 전역 조인 키는 없어서 시군명·읍면동명(SIGUN_NM, EMD_NM)이나 경기도 시군 코드(SIGUN_CD) 같은 이름·기관 코드로 맞추거나, 좌표·주소로 다른 공간 데이터와 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 학원의 기본 정보를 포함하며, 각 학원의 명칭, 대표자, 전화번호, 소재지 주소(도로명 및 지번), 교습과정명, 업종구분, 행정구역(시군명, 읍면동명) 등의 항목으로 구성되어 있습니다. 학원 업종은 보습, 입시, 논술, 수학, 피아노, 미술 등 다양한 교습과정을 포함하며, 위도 및 경도 정보도 함께 제공되어 GIS 기반 지도 서비스에서 학원 분포를 시각화하는 데 활용될 수 있습니다. 본 데이터는 교육 수요분석, 지역별 학원 밀집도 평가, 학생 맞춤형 학원 검색 시스템 구축 등에 응용 가능하며, Open API로 제공되어 자동화된 시스템 연계 및 통계 서비스 구현도 가능합니다. 특히 교습과정명 항목은 학원별 교육 콘텐츠 분석이나 특정 과목에 대한 학원 분포 연구에 활용할 수 있는 유의미한 정보입니다.
