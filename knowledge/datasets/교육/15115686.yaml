description_portal: 서울특별시 중랑구 소재 유치원 일반 현황입니다. 제공하는 정보 중 주요 항목으로는 교육청명, 교육지원청명, 유치원코드, 유치원명, 설립유형, 운영시간, 주소 등이 있습니다. 해당데이터는 교육, 보육, 유아 및 초중등교육 분야에 속합니다. 원본 출처시스템은 유치원알리미(https://e-childschoolinfo.moe.go.kr)입니다. 교육청은 서울특별시 교육청, 교육지원청명은 동부교육지원청 관련입니다. 자세한 정보는 유치원알리미 또는 서울시 열린데이터광장 링크를 클릭하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
