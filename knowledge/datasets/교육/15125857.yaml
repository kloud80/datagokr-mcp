description_portal: '"전라남도교육청_기숙사 현황" 데이터는 전라남도 내 각급 학교에 설치된 기숙사의 운영 현황을 종합적으로 제공하는 공공데이터입니다. 이 데이터에는 학교별로 학제(중학교, 고등학교, 특수학교 등), 학교명, 도로명 주소, 설립구분(공립/사립), 기숙사 실수, 전체 면적(㎡), 수용정원, 실제 재실인원, 관리인원, 준공연도 등 기숙사 운영에 필요한 주요 정보가 포함되어 있습니다. 면적은 제곱미터 단위로 제공되어 학교별 기숙사 규모를 객관적으로 비교할 수 있습니다.해당 정보는 각 학교와 교육지원청에서 정기적으로 제출하는 공식 자료와 현장 조사를 바탕으로 수집되며, 「초·중등교육법」 및 「공유재산 및 물품관리법」 등 관련 법령에 근거해 보유·제공됩니다. 데이터는 연 1회 정기적으로 갱신되어, 기숙사의 신설, 폐지, 정원 및 재실인원 변동 등 주요 사항이 반영됩니다.이 데이터는 학부모와 학생이 기숙사 운영 학교를 선택하거나, 행정기관이 기숙사 지원 정책 수립, 시설 확충, 관리 인력 배치 등에 활용할 수 있습니다. 또한, 연구기관의 교육 인프라 분석, 언론 및 지역사회의 교육환경 보도, 기숙사 시설 개선 및 안전관리 등 다양한 분야에서 기초자료로 활용됩니다.이처럼 "전라남도교육청_기숙사 현황" 데이터는 지역 내 기숙사 운영의 투명성과 효율성을 높이고, 교육복지 증진과 학생 생활환경 개선에 기여하는 중요한 공공정보입니다'
