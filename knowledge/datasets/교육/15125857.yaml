summary_user: 전라남도(현 전남광주통합특별시교육청) 내 중·고·특수학교 등에 설치된 기숙사를 학교별 한 행으로 담은 현황 파일로, 학제·설립구분·도로명 주소와 기숙사 실수, 면적(㎡), 수용정원, 재실인원, 관리인원, 준공연도를 담는다. 학부모·학생이 '기숙사가 있는 학교는 어디이고 정원 대비 실제 재실인원은 얼마인가'를 확인하거나, 행정·연구자가 노후 기숙사(준공연도)와 관리인력 배치를 비교하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교 기본정보·교원·학생 통계와는 학교명이나 도로명 주소로 맞춰 연결해야 한다.
limits: 실측 컬럼에 학교코드 등 공통 조인 키가 없어 다른 학교 데이터와 붙일 때 학교명·주소 매칭 오류에 주의해야 한다. 범위는 한 시도(전남) 학교 단위이므로 다른 시도와의 비교나 전국 집계에는 그대로 쓸 수 없다.
