summary_user: 경기도 초·중·고·특수학교별로 학생 1인당 1식 기준 실제 집행 급식비를 학교 단위 행으로 담은 집계 자료로, 기준연도·시군·교육지원청·학교급·설립유형(공립/사립)·집계 제외 여부와 사유가 함께 들어 있다. 교육 정책 분석가나 시군 담당자가 '우리 시군 학교의 1인당 급식비가 다른 시군이나 같은 학교급 평균보다 낮은가'처럼 학교·지역 간 급식비 편차와 지원 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)나 학교명·시군코드를 다른 학교 기본정보·재정 데이터와 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 초·중·고·특수학교에서 학생 1인당 지출된 실제 급식비 현황을 집계한 자료입니다.시군명, 학교명, 학교급(초/중/고/특수), 설립유형(공립/사립), 제외여부 및 사유, 그리고 가장 핵심인 학생 1인당 급식비 집행 금액(1식 기준)을 포함하고 있어, 학교 간 급식비 편차, 교육 재정 운영 효율성, 지자체별 지원 수준 분석 등에 활용할 수 있습니다.특히 해당 데이터는 실제 지출된 금액이 기준이므로 정책 수립이나 예산 배분, 공공급식의 형평성 검토 등에 유의미한 자료가 됩니다.급식비는 일반적으로 중식을 기준으로 산정되며, 학교운영위원회 등의 내부 절차를 거쳐 결정됩니다.
