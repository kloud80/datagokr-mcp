description_portal: 이 데이터는 전국 시도교육청을 대상으로 한 초·중등학교의 급식 실시 현황을 제공합니다. 각 초중등학교의 학교코드, 학교명, 급식 운영 방식 등의 정보를 포함하고 있으며, 학교급별로 급식 실시 여부를 확인할 수 있습니다. 데이터는 CSV 형식으로 제공되며, 교육 정책 수립, 학교 급식 운영 현황 분석, 연구 및 통계 자료로 활용될 수 있습니다. 또한, 학교 급식의 지역별 분포, 학교급별 급식실시현황 및 급식운영 방식의 차이를 파악하는 데 유용하게 활용할 수 있는 자료입니다. 또한 학교알리미를 통해서도 현황을 제공하고 있습니다.
