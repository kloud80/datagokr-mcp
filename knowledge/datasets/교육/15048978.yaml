summary_user: 전국 초·중등학교별로 급식 운영방식(직영·전부위탁·일부위탁과 위탁업체명), 전체·급식 학생수와 급식비율, 영양(교)사·조리사·조리원 인원, 배식장소를 한 행씩 담은 정보공시 파일이다. 학부모나 정책 분석가가 "우리 지역 학교 중 급식을 위탁으로 운영하거나 교실에서 배식하는 곳은 어디인가", "학교급·설립구분별로 급식 인력 배치가 어떻게 다른가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 정보공시 학교코드(학교알리미 공시 코드)나 학교명·시도교육청 이름 매핑으로 같은 기관의 다른 정보공시·학교 기본정보와 이어 쓴다.
limits: 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어 다른 기관 데이터와 붙이려면 학교명·코드 매핑이 따로 필요하다. 행정단위는 전국·비공간이라 좌표 없이 지역 이름으로만 위치를 구분한다.
