summary_user: KOCW(국내 대학 공개강의 공동활용 체계)에 등록된 교육학 분야 대학 강의를 강의 1건당 1행으로 담은 목록 파일로, 강의명·대학·교수·대분류/중분류·학년학기·언어·라이선스·등록일시·바로가기 주소를 포함한다(CSV 약 31만 바이트). 교육학을 공부하려는 학습자나 교육과정 연구자가 '어느 대학의 어떤 교수가 교육학 어느 세부 분야 강의를 공개했고 바로 볼 수 있는 링크는 무엇인가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대학명 문자열 매핑으로만 이어 쓰며, 같은 KOCW 다른 분야 강의 목록과는 같은 컬럼 구조로 합쳐 비교한다.
description_portal: 제공하는 데이터는 고등교육 교수학습자료 공동활용 체계인 KOCW(Korea OpenCourseWare)를 통해 국내 대학에서 개설된 교육학 분야 강의의 목록 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 강의명, 대학명, 교수명, 전공분류, 강의개요, 강의구분, 학년·학기 등 교육학 관련 강의의 주요 정보가 포함되어 있습니다. 각 대학 및 교수진이 KOCW 플랫폼에 직접 등록한 강의 정보를 기반으로 하며, 연 1회 정기적으로 데이터가 갱신됩니다. 데이터의 보유 및 제공 근거는 고등교육 혁신과 교수학습자료 공동 활용 촉진을 위한 관련 법령과 정책에 있습니다. 이 데이터는 교육학 분야 대학 강의 현황 분석, 교육과정 비교, 교육정책 수립, 교수학습자료 개발, 학습자 맞춤형 강의 추천, 연구 및 통계, 온라인 교육 서비스 개발 등 다양한 분야에서 활용될 수 있습니다. 강의 형태에 따라 일부 강의는 학년·학기 정보가 공란으로 표기될 수 있습니다
