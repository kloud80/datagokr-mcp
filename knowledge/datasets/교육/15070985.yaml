summary_user: 한국유학종합시스템으로 접수된 외국인 유학생 입학 지원 건수를 국가별 한 행씩, 학사·석사·박사·석박사 통합·전문학사 등 학위과정과 어학연수·교환학생·기타 비학위과정 열로 나눠 집계한 전국 단위 파일(CSV 약 4KB)이다. 대학 국제처나 연구자가 '어느 나라 학생이 학부보다 대학원 과정에 더 많이 지원하는가', '단기 어학연수 수요가 큰 국가는 어디인가'를 비교해 유치 전략을 세우는 데 쓴다. 전역 조인 키는 없어 다른 유학생 통계와는 국가명(국가명) 문자열을 맞춰 연결해야 한다.
description_portal: 이 데이터는 한국유학종합시스템을 통해 접수된 외국인 유학생 입학 지원 현황을 국가별·과정별로 집계한 자료입니다. 학위 과정에는 학사, 석사, 박사, 석박사 통합과정, 전문학사가 포함되며, 비학위 과정에는 어학연수, 교환학생, 기타 과정이 포함되어 있습니다. 이를 통해 특정 국가 출신 학생들이 어떤 교육과정에 주로 지원하는지 비교할 수 있으며, 국가별 지원 경향이나 과정별 선호도를 파악할 수 있습니다. 예를 들어 일부 국가는 학사과정 지원 비중이 높고, 다른 국가는 석·박사와 같은 대학원 과정 지원이 두드러지는 등 지역별 특성이 나타납니다. 또한 어학연수나 교환학생 프로그램을 통한 단기 유학 수요도 확인할 수 있어, 다양한 형태의 유학 경향을 종합적으로 이해하는 데 도움을 줍니다. 이 데이터는 우리나라 고등교육 국제화와 관련한 기초자료로 활용될 수 있으며, 대학이나 연구기관은 이를 통해 유학생 유치 전략을 수립하고 정책적 방향을 논의할 수 있습니다. 일반 국민 또한 한국 유학을 희망하는 외국인 학생들의 전반적인 지원 경향을 이해하는 데 참고할 수 있는 자료입니다.
