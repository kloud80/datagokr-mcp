description_portal: 전라남도교육청 홈페이지는 전남교육의 최신정보를 제공하고 이용자들에게 다양한 교육 콘텐츠를 제공하기 위하여 구축되어 운영 중에 있습니다. 해당 데이터 정보는 전라남도교육청 홈페이지 시스템의 전남농산어촌유학에서 지역현황에 대하여 서술되어 있는 정보이며, 홈페이지 관리 운영자가 원활하게 홈페이지 운영을 위하여 관리하는 누적되어 있는 정보입니다. 전남농산어촌유학 유학 지역 유형 관리 테이블에서는 각 지역별 소개 및 오시는길 등에 대한 정보들입니다. 해당 데이터는 농산어촌유학을 운영하는 지역이 있는 반면 운영하지 않는 지역도 있으므로 데이터에 참고하시기 바랍니다.  해당 정보는 지역코드, 지역 소개, 오시튼길(기차, 버스, 자동차), 사이트주소, 지역이름 등이 포함되어 있습니다.
