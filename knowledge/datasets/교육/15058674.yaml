summary_user: 경기도 고등학교별로 기준년도마다 졸업자 수(남·여)와 진학자·취업자·기타 인원 및 각 비율을 담은 학교 단위 집계 자료다. 학부모나 진로지도 담당자, 교육정책 분석가가 '우리 시군 고등학교들의 대학 진학률과 취업률은 연도별로 어떻게 달라졌나'를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 따라서 시군 코드(SIGUN_CD)나 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD), 학교명 매핑을 통해 학교 기본정보나 교원·학생 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 고등학교 졸업생의 진로 현황을 기록한 자료로, 졸업 이후 학생들이 선택한 진학·취업·기타 경로를 보여줍니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 학교급명, 설립구분명(공립·사립), 주야간명, 졸업자 수(남·여), 진학자 수 및 비율, 취업자 수 및 비율, 기타 인원과 비율이 포함됩니다. 이를 통해 연도별·학교별 졸업생의 진학률과 취업률을 비교하고, 기타 경로 선택 비중을 파악할 수 있습니다. 본 데이터는 고등학교 졸업생의 진로 다양성 분석, 대학 진학률 및 취업률 변화 추세 연구, 지역 간·학교 유형별 차이 검토, 교육 및 진로지도 정책 수립의 근거 자료로 활용될 수 있습니다.
