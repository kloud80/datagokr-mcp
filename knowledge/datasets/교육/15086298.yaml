description_portal: '인천광역시 중구 반려동물숙박업(호텔) 현황입니다.사업장명칭,  주소, 전화번호 등의 데이터를 포함하고 있습니다.반려동물 호텔이란 반려동물이 보호자와 함께 또는 보호자 부재 시에도 안전하고 쾌적하게 머무를 수 있도록 전문적으로 숙박·돌봄 서비스를 제공하는 시설을 말합니다. 숙박뿐만 아니라 급식, 산책, 놀이, 미용·건강관리 등 반려동물의 생활 전반을 지원하며, 위생과 안전관리, 동물복지 기준을 준수하는 것을 특징으로 합니다.전화번호 항목은 개인정보 포함 및 미등록 정보로 일부 데이터값을 공란처리하였습니다.담당부서: 중구청 도시농업과'
