summary_user: 국공사립대학 산학협력단별·회계연도별 결산 현금흐름표로, 현금유입액·기초현금·현금유출액·기말현금과 연구수익·기술이전수익·간접비수익·전입금 같은 세부 계정을 천원 단위로 담는 집계 자료이며 전국 범위의 비공간 파일(csv)이다. 대학 재정 분석가나 정책 담당자가 '어느 대학 산학협력단이 정부·산업체 연구수익과 기술이전수익을 얼마나 거두는가'를 학교별·설립구분별·지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 대학알리미·대학재정 등 다른 대학 공시 자료와는 학교명·법인명·회계연도를 이름 매핑으로 맞춰 이어 쓴다.
description_portal: '한국사학진흥재단_산학협력단 현금흐름표는 한국사학진흥재단의 회계연도별 국공사립대학 산학협력단 예결산 집계를 통해 산출된 자료입니다.산학협력단 현금흐름표 자료를 통해 산학협력단별 현금유입액, 기초현금, 현금유출액, 기말현금 등의 세부내역을 학교별, 설립구분별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(결산 미제출교 제외, 단위: 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
