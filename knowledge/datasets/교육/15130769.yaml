description_portal: 청렴연수원은 공직자 등을 대상으로 청렴교육을 실시하는 전문 교육기관입니다. 2023년에는 청렴 일반교육, 청렴윤리경영 교육, 강사양성 교육, 권익구제 교육, 기관대상 청렴교육 등 다양한 교육과정을 운영하였습니다. 이러한 교육은 부정부패를 예방하고, 청렴한 공직문화를 조성하는 데 중요한 역할을 합니다. 청렴연수원이 2023년도에 실시한 집합교육과정의  과정 개요, 각 과정의 교육내용, 교육횟수를 제공합니다해당 자료는 기관별로 청렴교육 계획을 수립할때 참고하거나 청렴교육 현황 분석에 활용될 수 있습니다.
