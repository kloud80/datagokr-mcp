description_portal: 본 자료는 외국인 학생들의 국내 대학 온라인 입학 지원 현황을 국적별, 학위과정별로 분석한 통계입니다. 중국과 베트남 학생 수가 가장 많으며, 학사·석사·박사 과정뿐 아니라 어학연수와 교환학생 프로그램 참가자도 포함됩니다. 남녀 학생 비율, 다양한 국적, 학위별 지원 현황을 종합해 전반적인 유학생 동향을 파악할 수 있습니다. 이 통계는 한국유학박람회와 연계된 한국유학종합시스템을 통해 제공되어, 대학 입학 지원 및 정책 수립에 기초 자료로 활용될 수 있습니다.외국인의 국내대학 유학을 위한 온라인 입학 지원자수를 국적별, 지원대학별, 학위과정별의 주제별 현황데이터로 제공
