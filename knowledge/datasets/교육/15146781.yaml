description_portal: ‘서울시 은평구 유치원 환경위생관리 현황’ 데이터는 은평구 소재 국·공·사립 유치원의 실내공기질, 미세먼지 등 환경 위생 점검 결과를 유치원알리미에서 수집·가공해 학년도 종료 후 매년 자동 갱신하고 있습니다. CSV·JSON 파일과 REST API 형태로 제공되며, 자료마다 교육지원청, 유치원명, 설립유형, 실내공기질 측정일과 PM10·PM2.5 농도(㎍/㎥), CO₂·포름알데히드 등 유해물질 수치, 환기설비 점검 결과, 환경위생 기준 적합 여부(Y/N), 통계 기준 학년도 등이 포함됩니다.학부모는 공기질 수치와 적합 여부를 확인해 자녀에게 안전한 학습 환경을 선택할 수 있고, 교육청은 기준 미달 유치원을 파악해 현장 컨설팅·공기청정기 지원·환기설비 개선 등을 신속히 추진할 수 있습니다. 지자체는 지역별 초미세먼지 취약기관을 GIS로 시각화해 녹지 조성·저감 대책 우선순위를 세울 수 있으며, 연구자는 교실 공기질과 호흡기 질환 발생률·학습 집중도 간 상관관계를 분석할 수 있습니다.
