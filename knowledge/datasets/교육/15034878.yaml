summary_user: 경기도 김포시 관내 학교를 한 행씩 담은 학교 목록 파일로, 학교급·학교명·도로명/지번 주소·학교장명·교무실/행정실 전화번호와 학급수·학생수·교원수, 데이터기준일자를 학교 단위로 제공한다. 김포시로 이사하려는 학부모가 동네 학교의 학생 수와 학급 규모를 비교하거나, 분석가가 김포시 학교급별 교원 1인당 학생 수를 계산하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서 다른 학교 통계·재정 데이터와는 학교명이나 주소를 직접 맞춰 이어 써야 한다.
description_portal: 경기도 김포시의 학교현황에 대한 정보를 제공합니다. 제공 항목으로는 학교급, 학교명, 소재지 주소, 학교장명, 교무실 전화번호, 행정실 전화번호, 학급수, 학생수, 교원수, 데이터기준일자로 구성되어있으며 주소는 도로명과 지번의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 교육지원청으로 연락주시기 바랍니다.
