summary_user: 경기도 인재개발원 교육대상자의 직급명·직급구분명·직위명과 폐지 여부, 작성·수정 일시를 담은 분류 코드성 현황표로, 건별 교육 실적이 아니라 직급·직위 분류 목록이다. 교육 운영 담당자나 분석가가 "현재 유지되는 직위만 골라 교육대상을 어떻게 나눌까" 같은 질문에 쓰며, 폐지 여부(abl_yn)로 현행 직위만 걸러 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 직급명·직위명 이름 매칭이나 같은 기관(경기도 인재개발원) 데이터끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 인재개발원에서 관리 중인 교육대상자의 직급 및 직위 정보를 분류한 현황입니다. 주요 항목으로는 직급명, 직급구분명, 직위명, 비고, 폐지여부, 작성일시, 수정일시가 있으며, 직책 유형의 다양성과 행정조직에 맞춘 사용자 세분화가 특징입니다. 다양한 직위가 명시되어 있으며, 그 중 일부는 폐지(Y), 일부는 현재 유지(N) 상태로 기록됩니다. 이 분류는 교육대상 선정, 맞춤형 교육 커리큘럼 설계, 수강통계 분석, 정책 대상 분류 등에 활용될 수 있으며, 특히 직무 기반 교육 제공 및 수요 예측 등에 필수적인 기초 인프라 역할을 합니다.
