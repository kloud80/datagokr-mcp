description_portal: 본 자료는 정부초청외국인장학생의 전공과정별 현황을 전공별, 과정별로 분석한 데이터입니다. 석사, 박사, 어학연수, 학사, 석박사 등 다양한 과정의 학생들이 여러 전공 분야에서 공부하고 있음을 보여줍니다. 미리보기에 제시된 표에서는 기계항공공학, 디지털경영, 한국어, 국제관계, 회계, AI 융합 등 다양한 전공명이 포함되어 있으며, 이들 전공 과정별 학생 수가 상세히 기록되어 있습니다. 과거 데이터와 비교 가능하며, 시스템에 등록된 내용 기준으로 실제 사업부서 자료와 차이가 있을 수 있으니 참고가 필요합니다.국외인적자원관리시스템을 통해 관리중인 정부초청외국인장학생의 전공과정별 현황※ 시스템에 등록된 데이터 기준으로 실제 사업부서의 보유자료와 일부 차이가 있을 수 있음
