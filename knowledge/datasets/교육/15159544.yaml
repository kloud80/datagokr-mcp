summary_user: 한국장학재단의 국가장학금(I유형·II유형·다자녀·지역인재)과 학자금대출(취업 후 상환·일반 상환) 상품별로 지원대상, 연령·성적·소득기준, 연간 장학금액, 대출금리·상환방법·대출금액·기간, 신청기간 등을 기준연도·학기 단위로 정리한 전국 단위 상품 안내 표이며, 파일 크기는 약 6KB(CSV)로 소규모다. 대학(원)생과 학부모가 "내 소득·성적 조건으로 어떤 장학금이나 대출을 받을 수 있고 금리·상환 방식은 어떤가"를 비교하거나, 상담·안내 서비스가 상품 조건표로 쓴다. 전역 조인 키는 없어 다른 데이터와는 상품명이나 기준연도·학기를 이름으로 맞춰 연결해야 한다.
description_portal: 한국장학재단에서 지원하는 소득연계형 국가장학금(국가장학금I유형(학생직접지원형), 국가장학금II유형(대학연계지원형), 다자녀 국가장학금, 지역인재장학금) 및 학자금대출(취업 후 상환 학자금대출, 일반 상환 학자금대출) 지원 정보이며 각 상품별 지원대상, 연령기준, 성적기준, 소득기준, 장학금 지원금액(연간기준), 대출금리, 상환방법, 신용요건, 대출금액, 대출기간, 신청기간, 대출실행기간, 홈페이지 정보 등을 제공하고 있습니다.국가장학금I유형(학생직접지원형)은 소득수준에 연계하여 경제적으로 어려운 학생들에게 보다 많은 혜택이 주어지도록 설계된 장학금이며, 국가장학금II유형(대학연계지원형)은 대학의 적극적인 등록금 부담완화 참여를 도모하기 위해 대학 자체노력과 연계하여 지원하는 장학금입니다. 다자녀 국가장학금은 다자녀 가구의 등록금 부담 경감을 위해 지원되는 장학금이며, 지역인재 장학금은 지역대학의 우수 인재 유치 및 미래인재 양성을 위해 지원되는 장학금입니다.취업 후 상환 학자금대출은 학자금지원구간에 따라 대학(원)생에게 학자금(등록금, 생활비)을 대출해주고 취업 등 소득이 발생한 시점부터 소득수준에 따라 원리금을 상환하는 제도이며, 일반 상환 학자금대출은 학부생 및 대학원생에게 학자금대출(등록금 및 생활비)을 지원하고, 대출기간 동안(거치기간 및 상환기간) 원리금을 분할하여 상환하는 제도입니다.
