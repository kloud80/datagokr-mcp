description_portal: '전국 사립의과대학 부속병원 현황을 정리한 것으로, 각 대학별 부속병원의 명칭과 소재지 정보를 포함한다. 서울, 경기, 대구, 부산 등 전국 각지에 위치한 대학병원의 위치와 명칭이 상세히 기록되어 있으며, 의과대학을 가진 다양한 대학교들의 병원 현황을 파악할 수 있다. 해당 목록은 과거 2022년 데이터와 비교할 수 있도록 주기적으로 갱신된다. 이 자료는 의과대학 부속병원의 위치 분포와 병원 명칭을 한눈에 확인할 수 있게 하여 관련 기관과 이해관계자들이 정책 및 행정에 활용할 수 있도록 한다.제공 데이터 : 전국의 사립의과대학 부속병원 현황 데이터. 연번(NO),학교명,학교소재지,부속병원명,부속병원소재지 항목 데이터.'
