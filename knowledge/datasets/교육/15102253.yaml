summary_user: 부산광역시 동래구 관내에서 운영 중인 학교를 학교 한 곳당 한 행으로 담은 CSV 파일로, 학교명·공립/사립 구분·도로명주소·우편번호·대표 전화·팩스·홈페이지와 위도·경도를 담는다. 동래구 주민이나 학부모가 집 근처 학교의 위치와 연락처를 찾거나, 분석가가 구 안의 학교 분포를 지도에 올려 볼 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서 다른 학교 통계·재정 데이터와는 학교명·주소를 맞춰 붙이고, 위도·경도로 좌표 기반 공간 결합을 한다.
description_portal: 부산광역시 동래구 관내에서 운영중인 학교 현황을 나타내는 데이터로 쉼표로 분리된 (.csv) 파일 데이터입니다.데이터 항목 설명1. 시도명2. 시군구명3. 학교명4. 구분(공립, 사립)5. 우편번호6. 상세주소(도로명주소)7. 대표 전화8. 팩스번호9. 홈페이지주소10. 위도11. 경도12. 데이터기준일자본 파일 데이터는 부산광역시 동래구 관내에서 운영중인 학교 현황으로 학교의 사정에 따라 데이터 항목이 변경되거나 삭제됨에 유의하시길 바랍니다.사정상 직접확인이 어려우신 경우에는 부산광역시 동래구 평생교육과 051 550 4662로 직접 문의 하시길 바랍니다.
