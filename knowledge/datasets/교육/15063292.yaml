description_portal: 이 데이터는 교육부 중앙교육연수원에서 실시한 직무연수 과정의 이수 현황을 교육 대상자별로 정리한 자료입니다. 2017년부터 2026년 상반기까지의 연도별 통계를 포함하고 있으며, 교원, 교육전문직, 일반직 공무원 등 다양한 교육 대상자군의 연수 이수 인원을 구분하여 제공합니다. 연도별로 집계된 데이터 외에도 성별 및 연령대별 통계가 포함되어 있어 교육 참여자의 특성과 추이를 다각도로 분석할 수 있습니다. 이 데이터는 교육 수요 예측, 정책 수립, 교육 접근성 분석, 맞춤형 연수 프로그램 설계 등 다양한 행정 및 연구 목적에 활용될 수 있습니다.
