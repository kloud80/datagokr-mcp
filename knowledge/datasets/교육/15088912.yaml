description_portal: '국방대학교는 국가안보 및 국방전문인력 양성을 위해 다양한 교육과정을 운영하고 있습니다.국방대학교 각 교육과정(안보과정, 학위과정, 직무과정, PKO과정)의 연간 학사일정 안내입니다. - 안보과정 : 현역 대령 이상, 고위 공무원(4급 이상), 외국군 장교, 공공기관 및 기타 임직원 대상 안보교육(1년) - 학위과정 : 현역 및 공무원, 일반인 대상 석박사과정 교육(주간석/박사, 야간석사, 주말박사) - 직무과정 : 국방부 및 소속 기관 직원을 위한 직무교육 - PKO과정 : PKO활동을 위해 주요 국가에 파견되기 전 이수하는 교육각 월별 연간 학사일정을 달력과 함께 알기 쉽게 안내함.'
