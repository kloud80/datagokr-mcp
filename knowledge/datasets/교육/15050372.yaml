description_portal: 부산광역시교육청은 관내 유치원의 운영 현황을 교육지원청별로 구분하여 제공하고 있습니다. 본 자료에는 정상 운영 중인 유치원뿐만 아니라, 일정 기간 운영을 중단한 휴원 유치원, 개원 인가를 받았으나 실제 운영이 이루어지지 않는 미운영 유치원, 그리고 가까운 시일 내 휴원이나 폐원이 예정된 유치원의 현황이 함께 포함되어 있습니다.이러한 현황 자료는 학부모와 지역사회가 관할 지역 내 유치원의 운영 상태를 명확히 파악하는 데 도움을 주며, 동시에 부산광역시교육청의 유아교육 정책 수립과 지원 방안 마련을 위한 기초 자료로도 활용됩니다.
