description_portal: 동작구 소재 유치원의 안전점검ㆍ교육 실시 현황 정보를 제공합니다.해당 데이터는 유치원알리미(https://e-childschoolinfo.moe.go.kr) 및 한국교육학술정보원에서 제공되는 자료입니다.이 데이터는 유치원 안전점검 교육 실시현황 관련 데이터로 각 유치원의 명칭이 포함되어 기관별 안전 관리 현황을 확인할 수 있습니다.소방대피훈련 여부 항목은 유치원에서 정기적으로 대피훈련을 실시하는지 확인할 수 있습니다.가스점검 여부 항목을 통해 화재 및 가스 사고 예방 조치를 점검할 수 있습니다.
