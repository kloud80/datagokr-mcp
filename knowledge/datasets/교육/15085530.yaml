description_portal: '○ 통계개요* 통계명 : 상급학교 진학률* 통계종류 : "교육기본통계조사규정"에 의거 상급학교 진학률현황을 제공하는 지정ㆍ보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적ㆍ종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획ㆍ시행ㆍ평가ㆍ연구 등에 주요 정보를제공, 국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 학교 → 구 교육청 → 서울특별시 교육청 → 한국교육개발원* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 일반계ㆍ전문계고 졸업자 현황 및 졸업후 상황(진학, 취업 등) 등○ 용어설명* 진학자 : 진학한 학생수를 작성하되, 각 군 사관학교에 진학한 학생수도 포함함* 취업자 : 취업한 학생수. 단, 직업군인으로서 장기 복무 하사관으로 입대한자도 취업자로 조사함○ 기 타* 기존 일반고가 일반계고로, 실업고가 전문계고로 변경됨* 2011년부터 고등학교 유형이 일반고, 특수목적고, 특성화고, 자율고로 변경됨(초·중등교육법 시행령 제76조의 2, 2010. 6. 29)* 2010년 이전은 합격자 기준이며, 2011년 이후는 대학등록자 기준임○ 출 처 : 서울특별시교육청'
