description_portal: 대구광역시 서구의 서구어린이도서관 자료 현황입니다. 도서 총류, 철학, 종교, 사회,순수, 기술, 예술, 언어, 문학, 역사별 자료 현황입니다.2019년 12월 재개관한 서구어린이도서관은 대구광역시 서구 문화로 123에 위치하고 있다.지하 1층에서 지상 4층까지 구성되어 있으며, 1층에는 유아열람실, 프로그램실, 갤러리존이 있고, 2층에는 어린이열람실, 상상놀이터가 있으며, 3층에는 시청각실, 문화강좌실 1,2가 있으며 4층에는 천체투영관, 옥상정원이 있다.도서자료로는 총 65,541권의 서적을 보유하고 있다. 유아도서 10,325권, 아동도서 32,293권, 일반도서 22,923권이 있다.비도서자료로는 총 1,755종이 있다. DVD 1,751종, 정기간행물 2종, 신문 2종이 있다.
