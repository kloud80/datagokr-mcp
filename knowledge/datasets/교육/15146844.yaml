description_portal: 서울특별시 성동구 유치원 방과후 과정 편성운영정보 입니다. 이 데이터는 성동구 소재 유치원에서 운영하는 방과후 과정의 편성 현황과 운영 내용을 담고 있습니다.  교육청명, 교육지원청명, 유치원코드, 설립유형, 독립편성학급수 등의 정보를 포함하고있습니다. 유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다. 유치원별 방과후 프로그램의 종류, 운영 시간, 참여 대상, 지도 인력, 특화 활동 등을 확인할 수 있어 학부모와 교사가 교육 과정 선택 및 운영 계획을 세우는 데 활용할 수 있는 공공데이터입니다.
