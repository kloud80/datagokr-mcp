description_portal: 재외국민의 교육지원 법률에 근거하여, 전 세계 34개 재외한국학교는 교육부장관이 정하는 교육과정에 준하여 유치원부터 고등학교까지 체계적인 교육을 운영 중이다. 일본, 중국, 대만, 베트남, 사우디아라비아 등 다양한 국가에서 각급 학교들이 마련되어 있으며, 이들 학교들은 초등학교부터 고등학교까지 학년별 교육과정을 편성하고 있다. 이는 재외국민에게 고품질의 한국식 교육을 제공하는 한편, 국제교육 환경에서 학습의 연속성을 보장한다. 파일 일부만 미리보기로 제공되며, 전체 내용은 해당 파일을 통해 확인 가능하다.재외국민의 교육지원 등에 관한 법률 제8조에 의거하여 재외한국학교의 교육과정은 초·중등교육법 제23조의 규정에 따라 교육부장관이 정하는 교육과정에 준하여 편성하고 있는바, 전 세계 재외한국학교(34개교)에서 운영 중인 교육과정 현황을 제공하고자 합니다.
