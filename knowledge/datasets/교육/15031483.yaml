description_portal: 성남 미디어센터의 교육정보(교육종류,카테고리,교육대상,교육명,강사,모집방식,모집인원수,접수기간,교육기간,교육시간,교육장소,수강료,공지사항 등)입니다. 성남미디어센터 교육정보 데이터는 성남시가 운영하는 공공 미디어시설인 성남미디어센터에서 제공하는 미디어 교육 프로그램의 구성, 일정 등의 정보를 체계적으로 정리한 자료입니다. 이 센터는 성남문화재단이 위탁·운영하며, 시민의 미디어 활용 능력 향상과 창작 역량 강화를 목적으로 다양한 강좌를 제공합니다.주요 교육내용은 영상촬영·편집, 유튜브 제작, 1인 미디어 창작, 디지털 콘텐츠 제작, 미디어리터러시, 청소년 대상 미디어 체험 교육 등이 있으며, 정규 강좌와 단기 특강, 시민제안 프로그램으로 구성됩니다.
