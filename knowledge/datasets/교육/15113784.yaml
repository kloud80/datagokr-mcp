description_portal: 학자금대출 사업에 따른 재정 부담 및 재정 전망, 대출원리금 상환실적, 평균 상환기간 등을 감안한 학자금 대출계정의 수지분석을 통해 학자금대출의 장기 균형 유지방안을 수립하기 위한 정책연구 자료입니다.본 연구의 가장 중요한 목적은 일반 상환 학자금대출 및 취업 후 상환 학자금대출 규모 및 상환 현황을 분석하여 학자금 대출계정의 수지를 정밀하게 진단하고, 이를 바탕으로 학자금대출의 장기균형 유지 방안을 위한 기초 자료를 제공하는 것입니다. 목차는 1. 서론, 2. 학자금 대출제도 및 해외연구 동향, 3. 장학재단의 학자금대출 상환 현황, 4. 학자금 대출계정 장기수지 전망 -모형과 예비분석, 5. 학자금대출 상환 부담에 대한 논의, 6. 금리 결정에 대한 논의, 7. 수지 분석 결과, 8. 학자금 대출 제도 개선 방안을 위한 논의로 구성되어 있습니다.
