summary_user: 한국사학진흥재단의 운영 종료된 「융자 One-Stop 시스템」에서 융자금 신청 접수를 관리하던 설정 정보를 배정년도·접수구분·학교급·사업구분·항목별로 담은 이력 파일(xlsx, 약 44KB)로, 개별 융자 신청 건이 아니라 심사지표·수식·쿼리·사용여부 같은 시스템 항목 정의를 담는다. 정보화 담당자나 연구자가 과거 사학 융자 신청을 학교급·사업구분별로 어떤 항목과 심사지표로 접수·심사했는지 구조를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 학교급·사업구분 같은 이름·코드를 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 융자금 신청안내 및 접수등록관련 DB(배정년도, 쿼리, 항목명, 사용여부 등)로 현재는 차세대 시스템이 개발완료 되어 본 시스템은 더이상 신규 데이터가 생성되지 않고 있음본 데이터는 한국사학진흥재단의 「융자 One-Stop 시스템」에서 융자금 신청 안내 및 신청 접수 관리를 위해 활용되었던 정보를 정리한 자료로, 배정년도, 쿼리, 항목명, 사용여부 등 신청 접수 및 관리 과정에서 사용되는 주요 DB 항목을 포함하고 있습니다. 이를 통해 과거 융자 신청 접수 체계 및 데이터 구성 구조를 파악할 수 있습니다.다만, 현재는 차세대 시스템 구축이 완료됨에 따라 기존 One-Stop 시스템은 운영이 종료된 상태이며, 본 데이터는 더 이상 신규 생성 또는 갱신되지 않는 이력 데이터입니다. 따라서 현행 신청 절차 및 시스템 환경과는 차이가 있을 수 있으므로 활용 시 유의가 필요합니다.본 데이터는 과거 신청 접수 관리 체계 분석, 정보화 사업 이력 관리 등 참고 목적의 자료로 활용될 수 있습니다.
