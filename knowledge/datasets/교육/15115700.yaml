description_portal: 서울특별시 중랑구 소재 유치원의 안전점검 및 교육 실시 현황입니다. 제공하는 주요 항목으로는 유치원코드. 유치원명, 설립유형, 소방대피훈련여부, 가스점검여부, 소방안전점검여부, CCTV  설치 등의 정보를 포함합니다. 데이터의 원본시스템은 유치원알리미입니다. 교육청 및 교육지원청명은 서울특별시 교육청, 동부교육지원청입니다. 설립유형은 공립(병설), 사립(사인)이 있습니다. 자세한 사항은 서울특별시 열린데이터광장의 링크를 클릭하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
