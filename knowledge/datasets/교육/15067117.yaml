description_portal: 제고하는 데이터는 에듀넷에서 개발·운영 중인 사회 교과의 다양한 주제별 학습자료를 체계적으로 정리하여 제공하는 공공데이터입니다. 이 데이터는 초·중등 교육과정에 따라 사회 교과의 흥미로운 주제별로 구성되어 있으며, 각 주제는 과목, 주제, 부제, 제목, 키워드, 바로가기 URL 등 구체적인 정보를 포함하고 있습니다. 또한, 각 학습자료에는 다양한 멀티미디어 자료 안내가 함께 제공되어 교사와 학생이 실제 수업이나 자기주도 학습에 효과적으로 활용할 수 있습니다.자료의 수집은 에듀넷에서 개발된 교수학습자료를 기반으로 하며, 교육 현장 및 교과과정의 변화에 따라 신규 자료가 추가되거나 기존 자료가 갱신되는 방식으로 이루어집니다. 데이터의 보유근거는 「초·중등교육법」에 따라 국가 교육정보화 및 교수학습 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 기반합니다. 업데이트 주기는 수시(1회성 데이터)로, 교육과정 개정이나 신규 자료 개발 시마다 최신 자료로 반영됩니다.이 데이터는 교사들의 수업자료 준비, 학생들의 자기주도 학습, 교육 콘텐츠 개발, 교육 연구 등 다양한 교육 현장에서 활용될 수 있습니다.
