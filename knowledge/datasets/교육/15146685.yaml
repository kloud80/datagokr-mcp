description_portal: 서울특별시 광진구 유치원 직위 자격별 교직원 현황 데이터는 서울열린데이터광장(data.seoul.go.kr)을 통해 제공되며, 갱신 주기는 월간입니다. 이 데이터는 광진구 관내 유치원에서 근무하는 교직원의 직위와 자격별 현황을 확인할 수 있는 자료로, 인력 구성의 전문성과 운영 구조를 파악하는 데 활용됩니다. 정보는 유치원알리미(e-childschoolinfo.moe.go.kr) 시스템을 기반으로 하며, 해당 플랫폼을 통해 유치원의 다양한 인사 및 운영 정보를 열람할 수 있습니다. 관련 문의는 성동광진교육지원청(02-2286-3741)으로 하시면 됩니다. 이 데이터는 유치원 인력 수급 계획 수립과 교직원 자격관리 정책 마련에 활용할 수 있습니다.
