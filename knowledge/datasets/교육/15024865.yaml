description_portal: 부산광역시 연제구의 관내 연제구민 대상 정보화교육 정보(교육 대상, 교육 과정명, 교육기간, 교육 장소, 교육장 도로명주소, 교육장 지번주소, 교육장 위도, 교육장 경도, 교육 신청방법, 담당자 연락처 등)를 제공합니다. 2025년 대비 2026년부터는 생성형 AI(챗GPT), 모바일 신분증, 스마트폰, 심화과정으로는 AI를 활용한 이미지 제작 및 편집 등의 교육까지 진행하고 있습니다. 급변하는 사이버 시대에 대응하기 위한 최신 기술들을 중점적으로 교육하고 있습니다. 데이터는 1년 기준으로 업데이트 예정입니다. 연제구민 대상의 디지털배움터 정보화교육은 무료로 진행되며, 평일 오전 10시~12시, 오후 2시 ~ 4시 두 타임 진행됩니다. 이외에도 거제종합사회복지관 1층에 디지털 체험존이 설치되어 있으니 누구든 언제나 방문해서 체험이 가능합니다.
