description_portal: 학생들의 수학 학습 격차 해소 및 자기주도적 학습 능력 신장을 지원하기 위해 한국과학창의재단에서 제공하는 'AskMath 익힘콘텐츠' 데이터입니다. 학생들이 어려워하는 수학 익힘책 문제에 대한 풀이 콘텐츠를 제공하여 수학에 대한 흥미와 이해도를 높이는 것을 목적으로 합니다.개방 데이터는 초등학교 수학 익힘책 문제풀이 콘텐츠 목록으로, '학교', '학기', '제목', '이용방법', '조회수', '등록자', '등록일자' 총 7개 항목으로 구성된 약 1,380여 건의 데이터를 포함하고 있습니다. 각 콘텐츠의 제목을 통해 학년, 학기, 단원, 문제 번호 등 상세한 정보를 파악할 수 있습니다.교육 현장의 교사 및 교육 콘텐츠 개발자들은 '조회수' 데이터를 분석하여 학생들이 어떤 단원이나 문제 유형을 어려워하는지 파악하고, 이를 바탕으로 맞춤형 학습 자료를 개발하거나 수업 계획을 수립하는 데 활용할 수 있습니다. 또한, 교육 정책 수립가들은 데이터 분석을 통해 수학 교육 과정 개선 및 학습 지원 정책 개발을 위한 기초 자료로 활용할 수 있습니다.
