description_portal: 대한민국학술원은 국제 학술 교류 및 협력을 증진하고, 세계적 석학과의 학문적 연계를 강화하기 위하여 학술 업적이 뛰어난 외국인을 명예회원으로 선임합니다. 명예회원의 정원은 20명이고 임기는 4년으로 연임 가능하며, 선출절차는 학술원법이 지정한 학술단체의 장 또는 학술원 회원의 추천으로 해당 분과회 및 명예회원심사위원회 심사를 거쳐 부회 의결과 총회 승인으로 선임됩니다. 대한민국학술원 명회회원은 현재 10명이며, 명회회원 현황은 년간 데이터가 제공됩니다. 회원에 대한 자세한 정보는 대한민국학술원 홈페이지를 이용하시기 바랍니다.
