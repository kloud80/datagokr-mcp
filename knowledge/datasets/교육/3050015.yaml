description_portal: '한국사회복지협의회 사회복지종사자 교육정보는 한국사회복지협의회에서 시행하는 사회복지 현장의 종사자분들에게 필요한 직무능력향상 교육과정 정보를 제공합니다.매년 새로운 트렌드에 적합한 교육과정도 개발하여 제공하고 있습니다.○ 직무공통 : 일선 종사자를 위한 공통영역 교육  - 교육영역 : 평가영역, 지역사회조직, 사례관리, 자원개발관리, 홍보마케팅, 프로그램기획과 평가○ 직무특수 : 특수직무 종사자를 위한 특수영역 교육  - 교육영역 : 사회복지상담, 서비스, 조직인사관리, 회계세무관리, 기능보강유지관리, 법인·시설설치운영○ 직무역량 : 직무능력수준별 직무역량 교육  - 교육영역 : 최고관리자, 상급관리자, 중간관리자, 초급관리자, 경력실무자○ 직무개발 : 직무능력수준별 직무개발 교육  - 교육영역 : 한국산업인력공단 사회복지분야 국가직무능력표준(NCS, National Competency Standards)을 활용하여 개설된 교육으로 능력단위요소별 사회복지행정, 사회복지개발, 프로그램운영에 대한 직무개발 교육'
