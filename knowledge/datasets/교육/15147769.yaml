description_portal: 광양시립도서관 신착도서 목록 데이터는 시민들이 최신 발간 도서를 신속하게 파악하고 도서관 이용 편의를 높이기 위해 제공되는 자료이다. 본 데이터에는 청구기호, 서명, 저작자, 발행자, 발행년, 자료실 등 주요 항목이 포함되어 있으며, 이를 통해 특정 도서의 주제 분류, 저자, 출판사, 발행 시기와 소장 위치를 한눈에 확인할 수 있다. 예를 들어 철학, 사회과학, 문학, 아동 및 청소년 도서 등 다양한 분야가 망라되어 있으며, 중앙도서관의 문화공간, 종합자료실, 특성화서가, 청소년코너 등 자료실 위치가 함께 제공된다. 이 데이터는 도서관 장서 관리와 신간 홍보, 독서 트렌드 분석, 시민 맞춤형 독서 활동 지원에 활용될 수 있으며, 공공데이터로서 개방 시 도서관 서비스 접근성을 높이고 지역 사회 독서문화 확산에 기여한다.
