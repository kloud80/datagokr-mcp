description_portal: 인천국제공항공사 인재개발원의  교육 정보를 체계적으로 제공합니다. 제공되는 정보에는 교육의 구분, 교육 과정, 교육 시간, 월별 교육일자, 진행 차수, 교육 가능 인원 등이 포함되어 있습니다. 교육 과정명으로는 항공보안교관, 공항 및 항공사 보안 책임자, 보안유관부서, 보안검색감독자, 보안검색요원, 항공경비요원, 폭발물처리요원, 항공보안장비 유지보수요원, 행동탐지요원, 대외기관 보안요원 등이 있으며, 구분에는 교관, 인증평가, 보안 책임자, 초기 및 정기 교육, EDS 판독, 재교육, 직무 교육, 보안검색 스킬, X-Ray 판독 등 다양한 항목이 포함됩니다. 또한, 각 교육 과정별로 1월부터 12월까지 월별 교육일자를 제공하고 있습니다.
