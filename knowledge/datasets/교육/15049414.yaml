description_portal: 도립거창대학교 시스템 DB 내 우편번호(신주소)데이터입니다 .(번호, 우편번호, 주소, 시도 데이터를 포함하고 있습니다.) 경상남도 도립거창대학교 시스템의 신우편번호 데이터입니다. 우편번호1, 우편번호2, 주소, 시도 데이터를 포함하고 있습니다. 경남도립거창대학의 교수 및 교직원, 학생들이 사용하는 학사행정시스템에 등록되어 있는 우편번호 입니다. 우편번호를 통해 교수, 교직원, 학생들의 주소를 편리하게 관리할 수 있습니다. 우편번호는 (구)우편번호로 6자리를 사용하고 있습니다. 해당 데이테에 대해서 필요한 사항은 언제든지 경상남도 도립거창대학 정보지원센터 (055-254-2744)로 문의 바랍니다.
