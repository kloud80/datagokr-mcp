summary_user: 서울특별시 성북구의 아동·청소년 지원시설 19곳을 시설별 한 행으로 담은 파일 데이터이다(시설명·주소·운영주체·전화번호·주요사업·행정동·좌표, 기간 2020-01-01~2020-04-01). 성북구 주민이나 분석가가 우리 동네에 어떤 아동·청소년 지원시설이 있고 무슨 사업을 하는지 찾거나 행정동별 분포를 볼 때 쓴다. 주소(address)와 위도·경도(coord)를 키로 다른 지도·위치 데이터와 이어 쓰며, 시설 고유 ID나 코드표는 없다.
limits: 성북구 한 시군구의 19개 시설을 2020년 초 기준으로 담은 스냅숏이라 현재 운영 여부나 이후 신설·폐지는 확인할 수 없다. 이용 인원이나 서비스 실적 같은 수치는 없고, 시설 연결은 주소·좌표 일치에 의존한다. 세부 부문이 학교알리미 공시로 분류돼 있으나 학교 단위 자료가 아니며, 사회복지-아동청소년(youth-facilities)으로 이동하자는 제안이 있다.
