description_portal: '2023년도 범정부 온종일 돌봄 수요조사 결과, 방학 중 돌봄 서비스 이용 희망 시간에 대한 응답 비율이 분석되었다. 오전 7시부터 오후 9시까지의 시간대별로 이용 희망 비율이 구분되었으며, 신입생과 재학생, 학년별로도 차이가 나타났다. 예를 들어, 전체 응답에서는 오전 9시부터 12시 사이가 가장 희망시간으로 나타났고, 학년별로도 1학년이 가장 높은 이용 희망 비율을 보였다. 이날 조사는 오전, 오후 시간대별 다수의 응답을 중복 포함하여 수집되었으며, 오후 5시부터 6시와 기타 시간대에 대한 이용 희망도 순차적으로 감소하는 현상이 관찰되었다. 해당 조사는 중복응답을 포함해 방학 중 온종일 돌봄 서비스 수요를 꼼꼼히 조사한 결과로, 서비스 시간대 조정 및 정책 수립에 중요한 기초자료로 활용될 수 있다.‘2023년도 범정부 온종일 돌봄 수요조사’를 실시한 결과 <방학 중 온종일 돌봄 서비스 이용 희망 시간>에 대한 응답 비율- 오전7시~9시, 오전9시~12시, 12시~오후3시, 오후3시~4시, 오후4시~5시, 오후5시~6시, 오후6시~7시, 오후7시~8시, 오후8시~9시, 필요 없음에 대한 응답 비율- 중복응답- 2023년도 범정부 온종일 돌봄 수요조사 기간 : 2022.9.13.~10.31.'
