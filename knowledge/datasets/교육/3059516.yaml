description_portal: 이 자료는 특수교육 분야의 학술 연구 논문과 연구보고서들을 수록하고 있으며 발달장애아동, 자폐유아, 시각장애아, 청각장애아 등 다양한 장애유형에 대한 교육 관련 내용을 포괄하고 있습니다. 특히 기능적 생활중심 교육과정, 양육 스트레스, 통합교육 실태 분석, 사회성 발달, 의사소통 능력 향상 프로그램 등 장애아동의 교육 방향과 효과에 대해 심도 있게 다루고 있습니다. 미리보기 내용을 통해, 1994년부터 1999년까지의 다양한 연구 주제와 결과들이 체계적으로 정리되어 있어 특수교육 분야 연구와 실무에 중요한 기초자료로 활용될 수 있습니다.특수교육 관련 학술 연구 논문 자료이며 발간년도, 제호,제목,연구자를 포함합니다. 매년 자료를 갱신하며 업무체계분류는 유아및초중등교육 입니다.
