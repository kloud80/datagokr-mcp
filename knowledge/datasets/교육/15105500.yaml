description_portal: 한전KDN의 2024년 통신 및 정보보호 분야 교육계획은 전력ICT 핵심 역량 강화와 사이버 보안 대응력 제고를 목표로 구성되었습니다. 교육과정은 광통신 설계 및 시공, 무선통신 기술, 네트워크 보안, 정보보호 실무 등으로 구성되며, 각 과정별 교육 시간, 인원, 일정이 명확히 설정되어 체계적인 운영이 가능하도록 설계되었습니다. 특히 디지털 전환 가속화에 따라 사이버 위협이 증가함에 따라 정보보호 교육의 중요성이 강조되고 있으며, 실무 중심의 커리큘럼을 통해 현장 적용력을 높이는 데 중점을 두고 있습니다. 이 교육은 직원 개개인의 전문성 강화뿐 아니라 전력망 통신 안정성과 보안성을 확보하는 데 기여할 것으로 기대됩니다.
