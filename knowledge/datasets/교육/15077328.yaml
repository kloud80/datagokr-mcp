description_portal: 경기도 내 초등학교, 중학교, 고등학교 학생의 유학 관련 현황 제공하는 공공교육데이터입니다. 이 데이터는 연도별로 학교급별(초등학교, 중학교, 고등학교) 학생들의 유학 유형(일반 유학, 파견동행, 해외이주)로 집계하여 제공하고 있습니다. 전국 현황과 함께 제공하고 있어 전국학생대비 경기도의 유학현황을 비교할 수 있습니다. 데이터는 연 1회 이상 정기적으로 업데이트됩니다.데이터기준일은 조사일로 입력되었으며, 데이터는 조사년도 기준 전년도입니다.예) 2024년도 교육통계 조사시 2023학년도 자료를 조사함교육기본통계조사 항목 및 자료는 교육통계서비스(https://kess.kedi.re.kr)에서 상세한 정보를 조회하실 수 있습니다.
