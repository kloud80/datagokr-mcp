summary_user: 경기도 사이버도서관에서 도서관별로 예약 요청이 많은 도서 상위 200권을 연월 단위로 집계한 자료로, 서명·저자·발행자·발행연도·ISBN·지역명·도서관명과 예약 건수(qty)를 담는다. 도서관 사서나 분석가가 '우리 지역 도서관에서 이번 달 예약이 몰린 책은 무엇이고 추가 구입이 필요한가'를 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, ISBN이나 도서관명·지역명 같은 이름 매핑으로만 다른 도서·도서관 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 사이버도서관에서 도서관별로 예약 요청이 많은 도서 상위 200권을 연월 단위로 집계한 자료입니다. 항목에는 연월, 도서명(서명), 저자, 발행자, 발행연도, ISBN, 지역명, 도서관명, 수량이 포함되며, 각 도서가 특정 도서관에서 얼마나 많이 예약되었는지를 나타냅니다. ‘수량’은 해당 도서의 예약 건수를 의미하며, 이용자들의 수요와 관심을 반영하는 지표로 활용됩니다. 이 데이터를 통해 도서관별 인기 도서 파악, 장서 수요 예측, 이용자 맞춤형 도서구입 및 자료 서비스 개선 등의 목적으로 활용될 수 있습니다. 특히, 연령별 인기 도서나 계절별 독서 경향 분석에도 활용도가 높습니다.
