summary_user: 인천광역시 미추홀구 내 중학교를 학교 한 곳당 한 행으로 담은 파일로, 교육청·학교명·설립(공립/사립)·유형(남/여/공학)·도로명주소·전화번호·학년별 학급수·특수학급수·위경도를 담는다(CSV 약 1.9KB 규모). 학부모나 지역 분석가가 "우리 동네 근처 중학교는 어디이고 학년별 학급 규모와 특수학급 운영은 어떤가"를 확인하거나 구 안의 학교 배치를 지도로 볼 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 주소 매칭으로 이어야 하고, 위도·경도로 학구도·통학 등 공간 데이터와 겹쳐 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구의 중학교 현황 정보를 담고 있습니다. 연번, 교육청, 등록군구, 학교명, 홈페이지주소, 설립, 유형, 우편번호, 도로명주소, 전화번호, 일학년학급수, 이학년학급수, 삼학년학급수, 특수학급수, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 중학교의 위치와 현황을 파악할 수 있으며, 관교동, 도화동, 용현동, 학익동, 숭의동, 주안동 등 다양한 지역에 분포되어 있습니다. 공립과 사립으로 구분되며, 남자·여자·공학 학교가 모두 존재합니다. 각 학교의 학년별 학급수와 특수학급 운영 현황을 확인할 수 있으며, 위경도 좌표를 통해 정확한 위치를 파악할 수 있습니다. 이 데이터는 지역 내 중학교 교육 인프라 현황 파악, 학교 배치 분석, 교육 정책 연구 등에 활용될 수 있습니다.
