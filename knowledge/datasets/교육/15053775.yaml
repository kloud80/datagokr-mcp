summary_user: 경상북도 봉화교육지원청이 보유·관리하는 봉화군 내 폐교를 학교 한 곳당 한 행으로 담은 파일로, 활용유형·폐교연도·소재지·건물 연면적·토지 면적·토지 대장가격(천원)을 기록하며 원본 CSV는 약 1.3KB 규모의 소량 자료다. 봉화군의 폐교 부지를 임대하거나 매입해 활용하려는 사업자·지자체가 "어느 폐교가 어디에 있고 면적과 대장가격은 얼마이며 지금 어떻게 쓰이고 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 폐교명이나 소재지 주소를 기준으로 학교 기본정보, 다른 교육지원청의 폐교 현황과 이름·주소 매칭으로 이어 써야 한다.
limits: 학교코드 같은 공통 키가 없어 다른 데이터와 자동으로 결합되지 않고, 이름·주소 매칭에 의존해야 한다. 범위가 봉화군 한 지역이므로 경북 전체나 전국 폐교 현황을 보려면 다른 교육지원청 자료를 따로 모아야 한다.
