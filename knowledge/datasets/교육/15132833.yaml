summary_user: 서울특별시교육청 관내 유·초·중·고등학교 가운데 교육복지 사업 우선 지원 학교의 목록을 학교 한 곳당 한 행으로 담으며, 관할 교육지원청·소재 자치구·학교급·학교명·홈페이지·전화번호·주소가 들어 있다(CSV 약 110KB). 학부모나 지역 복지 담당자가 '우리 구에서 교육복지 우선 지원을 받는 학교는 어디인가'를 확인하거나, 분석가가 자치구별 지원 학교 분포를 볼 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교 기본정보·교원·학생 통계와는 학교명이나 주소를 맞춰서만 이어 쓴다.
description_portal: 서울특별시교육청 관내 각급학교(유,초,중,고등학교) 중 교육복지 사업 우선 지원 학교들의 목록으로 해당자료는 서울특별시교육청 학생맞춤지원담당관에서 담당하며 1회성 자료로 올린 자료로 교육지원청(동부교육지원청,서부교육지원청,남부교육지원청,북부교육지원청,중부교육지원청,강동송파교육지원청,강서양천교육지원청,강남서초교육지원청,성북강북교육지원청,성동광진교육지원청,동작관악교육지원청,이외 본청),소재구, 학교급, 학교명, 홈페이지, 전화번호 및 주소 정보를 포함하고 있습니다.
