summary_user: 농식품인재개발원이 발주한 입찰공고를 공고 건별로 담은 데이터로, 공고명·공고번호·기초금액·추정가격·게시일·마감일·계약방법·낙찰자 결정방법·업무구분(물품/용역/공사/외자)·공동수급 여부 등을 포함하며 범위는 전국·비공간이다. 이 기관의 발주 공고를 확인하려는 사업자가 '이번에 어떤 용역·물품 입찰이 열렸고 마감일과 추정가격은 얼마인가'를 확인하거나, 입찰 모니터링 서비스가 기관별 공고를 모으는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기관의 입찰 데이터와는 공고번호(BID_PBANC_NO)·공고기관명 같은 이름·코드를 맞춰서만 이어 쓰고, 학교 기본정보 계열 데이터와 직접 연결되는 키도 없다.
description_portal: 농림축산식품부 농식품인재개발원에서 발주한 연간 입찰 정보로 입찰공고명, 기초금액, 추정가격, 입찰공고일, 입찰마감일, 계약방법, 낙찰자 결정방법, 공고번호, 공고번호 차수, 업무구분(물품/용역/공사/외자), 공동수급 여부, 정정/취소 여부 등의 정보로 구성된 데이터입니다. 기관/업무/지역/업종/키워드별 공고를 수집하여 한 화면에서 조회할 수 있도록 하여 입찰 정보 검색 및 모니터링 기반 서비스 운영에 활용을 지원하고자 합니다. 우리기관의 입찰정보 건수가 연간 10건 이내로 업데이트 주기를 연간으로 설정하였습니다.
