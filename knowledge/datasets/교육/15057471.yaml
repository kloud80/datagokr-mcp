summary_user: 경기도 초등학교의 입학생 수를 학교·연도 단위로 집계한 자료로, 적령아동·유예 및 과령아동·조기입학아동별 남녀 인원, 합계, 비율을 담는다. 교육청이나 분석가가 경기도 시군별로 입학 유예나 조기입학 비율이 어떻게 달라지는지 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다른 학교 통계와는 학교명·시군코드(SIGUN_CD)·지역교육청명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 초등학교의 입학생 현황을 연도별로 제공하는 자료입니다. 초등학교 입학 시점을 기준으로 학생의 입학 유형을 세 가지로 분류하여 통계를 산출하고 있으며, 적령아동, 유예 및 과령아동, 조기입학아동으로 구분됩니다. 각 항목은 남학생, 여학생, 총합으로 구성되어 있어 성별 분석이 가능하며, 더불어 각 항목에 대한 백분율 정보도 함께 제공되어 특정 학교나 지역의 입학 유형별 비율을 파악할 수 있습니다.적령아동은 법적으로 정해진 입학 연령(보통 만 6세)에 해당하여 정상적으로 입학한 아동을 의미합니다. 유예 및 과령아동은 건강상의 이유나 부모의 요청 등으로 입학이 유예되었거나, 해당 연령을 초과하여 입학한 학생을 포함합니다. 조기입학아동은 심신 발달이 빠른 아동이 법적 절차를 통해 입학 연령보다 앞서 초등학교에 입학한 사례를 말합니다. 이러한 정보는 학령인구 감소, 입학 유예 증가, 조기입학 선호 등 교육 관련 사회현상을 분석하는 데 유용하게 활용됩니다.또한, 데이터는 학교 단위로 수집되며, 각 학교의 정보공시코드, 학교급, 설립구분(공립/사립), 시군명, 지역교육청명 등의 정보도 포함되어 있어 지역별 통계 및 행정단위별 비교 분석이 가능합니다.
