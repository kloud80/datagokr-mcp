summary_user: 사립대학 교비회계 결산의 자금계산서를 학교 단위로 담은 집계 파일로, 등록금·입학금·수업료·수강료 수입과 법인 전입금(경상비·법정부담·자산 전입금), 기부금 등 수입 세부 항목을 천원 단위로 담고 법인명·학교급·학종·지역(대·중·소) 구분을 함께 둔다. 분석가나 학부모·연구자가 "어느 사립대가 등록금 수입에 얼마나 의존하고, 법인이 법정부담 전입금을 얼마나 내는가"를 학교별·지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 대학알리미 등 다른 대학 데이터와는 학교명·법인명을 이름으로 맞춰 이어 써야 한다.
description_portal: '한국사학진흥재단_사립대학 교비회계 자금계산서은 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 교비회계 자금계산서 자료를 통해 사립대학 결산내용 중  등록금수입, 전입금수입, 기부금수입, 관리운영비 등의 세부내역을 학교별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(결산 미제출교 제외, 단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
