summary_user: 서귀포시가 소규모학교 육성을 위해 정비한 빈집을 한 채(주소) 단위로 읍면동·마을명·위도·경도·세대 수·리모델링 연도·통학구역 학교와 함께 담은 원천 목록이며, 파일 크기가 347바이트로 몇 건 안 되는 소량 자료다. 농촌 이주를 고려하는 가구나 교육·지역 정책 분석가가 '어느 마을, 어느 학교 통학구역에 정비된 빈집이 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 통학구역 학교 이름(통학구역 학교현황)이나 읍면동·마을명을 학교 기본정보·행정구역 자료와 이름으로 맞추거나, 위도·경도로 지도에 겹쳐 연결한다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘소규모학교 육성지원 빈집정비현황’ 데이터는 소규모 학교의 교육여건 개선 및 지역 활성화를 목적으로 추진된 빈집 정비 사업의 현황을 담고 있는 공공데이터입니다. 이 데이터는 행정구역, 마을명, 빈집의 대표 주소, 위도와 경도 등의 공간 정보, 세대 수, 리모델링 또는 철거 연도, 기준일자 등으로 구성되어 있어, 농촌 지역의 주거환경 개선과 교육 기반 정주 여건 조성 현황을 파악하는 데 활용됩니다. 특히 농산어촌 지역의 인구 유입 촉진, 유휴 주택의 효율적 활용, 지역 기반 교육 정책 수립 등에 필요한 기초자료로써 행정 및 연구 분야에서 다양하게 활용될 수 있습니다.
