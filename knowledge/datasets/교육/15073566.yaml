description_portal: ㅇ 2012년도 대학정보공시 [9-가-1. 등록금 산정근거] 중 등록금 책정 고려요소에 관한 데이터로대학정보공시 대상 대학별 조사년도, 본분교 구분, 적용년도, 고려요소명, 고려여부 등의 데이터를 제공하고 있습니다.등록금 산정근거는 대학에서 등록금을 산정할 때 활용한 근거 자료로서 수입지출 내역, 등록금심의위원회 구성, 평균등록금 인상률 정보 등이 포함되어 있으며,고등교육법에 따라 등록금 인상률은 최근 3개 연도 평균 소비자 물가 상승률의 1.5배를 초과하지 않은 범위내에서 산정해야 합니다.※ 대학정보공시는 「교육관련기관의 정보공개에 관한 특례법 」에 근거하여 대학정보를 정기적으로 또는  수시로 공시하는 것을 말하여, 공시범위는 학생, 교원, 재정, 교육 여건 등 다양한 항목을 포함합니다. 공시된 정보는 대학알리미 사이트 등을 통해서 확인 가능합니다.
