summary_user: 2012년도 대학정보공시 '등록금 산정근거' 항목 중 등록금 책정 고려요소를 대학별·조사년도·본분교·적용년도 단위로 담은 공시 원자료 파일(CSV)로, 고려요소명별로 고려했는지 여부와 내용을 기록한다. 학생·학부모나 교육정책 분석가가 특정 대학이 등록금을 정할 때 어떤 요소(물가, 재정 수입·지출 등)를 고려했다고 공시했는지 대학 간에 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학 공시 데이터와는 학교명·본분교 구분을 이름으로 맞춰 이어 써야 한다.
