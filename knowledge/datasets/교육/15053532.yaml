summary_user: 인천광역시 관내 특성화고등학교를 학교 단위로 정리한 소규모 원장 파일(csv 약 3KB)로, 학교명·계열·구분·설립 유형·지역·전화번호·개설 학과명을 담는다. 학생·학부모나 진로 상담 교사가 인천에서 어떤 특성화고가 어느 지역에 어떤 계열과 학과를 두고 있는지 확인할 때 쓰고, 분석가는 계열별 학교 분포를 볼 때 쓴다. 전역 조인 키(학교 코드 등)가 없어서 학교알리미 공시 같은 학교 단위 자료와는 학교명을 맞춰 이어 써야 한다.
