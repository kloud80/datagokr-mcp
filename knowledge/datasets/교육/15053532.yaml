description_portal: '"인천광역시교육청_특성화고 현황" 데이터는 인천광역시 관내 특성화고등학교의 현황을 종합적으로 제공하는 자료입니다. 주요 제공 정보는 각 특성화고등학교의 학교명, 계열(예: 공업, 상업, 농업 등), 소재지, 전화번호, 개설 학과명 등이며, 학교별로 특성화된 교육과정 및 운영 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 이 데이터는 인천광역시교육청이 관내 특성화고에서 제출받은 공식 현황 자료와 행정통계, 학교 자체 보고 등을 바탕으로 수집·정리하며, 「초·중등교육법」 및 관련 교육부 지침에 근거해 보유 및 관리됩니다. 데이터는 연 1회 정기적으로 업데이트되며, 학교 신설·폐지, 계열 및 학과 개편 등 주요 변동사항이 있을 때마다 최신화됩니다. 이 자료는 진로·진학 지도, 특성화고 지원 정책 수립, 지역 산업과의 연계, 학생·학부모의 학교 선택 정보 제공, 직업교육 활성화 정책 등 다양한 분야에서 활용됩니다.'
