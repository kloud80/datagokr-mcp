summary_user: 경기도 내 유치원을 한 곳씩 담은 건별 현황 자료로, 교육청·교육지원청, 설립유형, 원장·대표자, 설립·개업일, 주소와 좌표, 연령별 학급 수·모집정원·재원 유아 수를 담는다. 학부모가 우리 동네 공립·사립 유치원의 만 3~5세 정원과 현원을 비교하거나, 분석가가 교육지원청별 유아교육 수용 능력을 따질 때 쓴다. 전역 조인 키가 없어 다른 학교·통계 자료와는 유치원명이나 주소 매칭으로 잇고, 정제 좌표·우편번호로 지도나 행정구역 자료와 공간 결합한다.
description_portal: 「유치원현황」 데이터는 경기도 내 시군별 유치원에 대한 정보를 제공하는 자료입니다. 주요 항목에는 교육청명(EDC_ADMT_NM), 교육지원청명(EDU_SPORT_ADMT_NM), 유치원명(KDGT_NM), 설립유형(FNDN_TYPE), 대표자명(REPRSNTV_NM), 유치원장명(KDGT_DIRECTOR_NM), 설립일(FNDN_DAY), 개업일자(OPBIZ_DE), 전화번호(TELNO), 정제도로명주소(REFINE_ROADNM_ADDR), 정제지번주소(REFINE_LOTNO_ADDR), 정제우편번호(REFINE_ZIPNO), 정제WGS84위도(REFINE_WGS84_LAT), 정제WGS84경도(REFINE_WGS84_LOGT) 등이 있습니다. 또한 학급현황(AGE3_CLAS_CNT, AGE4_CLAS_CNT, AGE5_CLAS_CNT, MIXTR_CLAS_CNT, SPECL_CLAS_CNT)과 정원수(인가총정원수, 연령별 모집정원수) 및 영유아수(AGE3_INFANT_CNT, AGE4_INFANT_CNT, AGE5_INFANT_CNT, MIXTR_INFANT_CNT, SPECL_INFANT_CNT) 관련 정보도 포함되어 있어, 유치원의 교육 환경 및 수용 능력을 상세히 파악할 수 있습니다. 이 데이터는 보육정책 수립, 학급 규모 분석, 유아교육 인프라 배치 연구 등에 활용 가능하며, Open API(https://openapi.gg.go.kr/Kndrgrschoolstus)를 통해 교육청 또는 교육지원청 단위로 조건 검색이 가능합니다. 본 자료는 교육취업 분야에 속하며, 상업적 활용 및 가공이 허용되어 공공정책 연구와 민간 서비스 개발에 폭넓게 기여할 수 있습니다.
