summary_user: 경기도 초·중·고등학교 도서관의 이용 현황을 학교별·기준년도별로 담으며, 대출자료 수, 전년도 전체 학생 수, 대여 학생 수, 1인당 대출 비율이 들어 있다. 교육청 담당자나 연구자가 우리 지역 학교의 1인당 대출량이 다른 시군이나 같은 학교급에 비해 낮은지 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 학교 기본정보·통계와는 학교명·시군명 매핑이나 같은 기관의 코드로만 잇는다.
description_portal: 이 데이터는 경기도 내 초·중·고등학교 학교도서관의 이용 현황을 보여주는 자료로, 학생들의 독서활동과 도서관 활용도를 분석하는 데 활용됩니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분(공립·사립), 도서관 대출자료수(권), 전년도 전체 학생 수, 도서관 대여학생 수, 1인당 대출자료 비율(%) 등이 포함됩니다. 이를 통해 학교급별·지역별 도서관 이용 실태와 학생들의 평균 독서량을 비교할 수 있으며, 특정 학교나 지역의 독서활동 특성을 파악할 수 있습니다. 이 데이터는 교육복지 정책, 독서교육 프로그램 운영, 학교도서관 지원사업 평가, 학생들의 학습 및 문화활동 분석 등에 유용하게 활용될 수 있습니다.
