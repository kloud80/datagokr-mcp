description_portal: '지역 주민의 복지 향상과 생활 체육 활성화를 위해 관내 학교들이 보유한 다양한 시설을 일정 시간 동안 개방하고 있으며, 이를 보다 효율적이고 체계적으로 관리하기 위해 ‘시설대여관리 정보’를 데이터화하여 제공합니다. 이 정보는 시흥 관내 학교들이 각 학교에서 제공하는 다양한 시설의 개방 현황을 한눈에 볼 수 있도록 데이터화하여, 사용자들이 쉽게 접근할 수 있습니다.제공되는 데이터는 다음과 같습니다.1. 학교급: 시설을 개방하는 학교의 교육 수준에 따라 분류되며, 초등학교, 중학교, 고등학교, 그리고 기타 각종학교로 나뉘어 있습니다.2. 학교명: 각 시설을 개방하고 있는 학교의 명칭과 관련 기본 정보가 포함됩니다. 이를 통해 위치나 연락처 등 구체적인 정보를 추가로 확인할 수 있습니다.3. 시설구분: 개방 대상이 되는 시설의 종류를 구분하여 제공합니다. 체육관, 운동장, 다목적강당 등이 있으며, 각 시설의 특징과 용도에 따라 이용 신청 시 참고할 수 있습니다.4. 이용정보 (이용 시간 및 단체 정보): 시설을 현재 이용 중인 동호회나 단체의 명칭과 함께 이용 요일, 시간, 총 이용 기간 등의 상세 정보가 포함됩니다. 이를 통해 특정 시간대에 해당 시설이 이미 사용 중인지 여부를 사전에 확인할 수 있으며, 추후 이용 계획을 세우는 데 도움이 됩니다.개방을 제공하지 않는 학교가 있을 수 있으며, 학교측 내부사정에 따라 개방시간이 변동될 수 있습니다.'
