description_portal: 경상북도 문경시 시민정보화교육 공공데이터는 문경시에서 운영하는 시민 대상 정보화교육 과정의 연간 운영 현황을 정리한 자료로, 각 교육과정별 기수, 교육과정명, 교육장소, 수강 신청기간, 실제 교육기간, 교육 시작·종료 시간 등의 정보를 포함하고 있습니다. 본 데이터는 컴퓨터 기초, 한글, 엑셀, 파워포인트, 스마트폰 활용, SNS 활용, 이미지 편집, 영상 편집 등 다양한 정보화교육 과정의 운영 일정을 체계적으로 제공하여 시민들의 교육 참여를 돕고, 행정기관의 교육 운영 관리 및 정책 수립을 지원하기 위한 목적으로 구축되었습니다. 또한 주간 및 야간 과정 구분을 통해 다양한 시민의 학습 여건을 반영하고 있으며, 데이터는 문경시청 홍보전산과에서 관리하고 있습니다.
