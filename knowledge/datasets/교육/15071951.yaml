description_portal: 제공하는 데이터는 전국 대학도서관이 소장한 학위논문 원문 공유 현황을 체계적으로 제공하는 공공데이터입니다. 주요 제공 정보에는 각 대학도서관의 기관코드, 조사년도, 해당 기관에서 공유한 학위논문 건수 등이 포함되어 있습니다. 데이터는 대학도서관이 RISS(학술연구정보서비스) 시스템에 입력한 자료를 기반으로 하며, 국가 학술정보 공동 활용 정책과 관련 법령에 따라 수집·관리됩니다. 업데이트 주기는 수시(1회성 데이터)로, 기관별 원문 공유 현황이 변동될 때마다 최신 정보로 반영됩니다. 이 데이터는 대학도서관의 학위논문 원문 제공 실태 분석, 학술정보 자원 공유 현황 파악, 연구자 및 이용자 서비스 개선, 학술정보 유통 정책 수립, 도서관 협력체계 구축 등 다양한 분야에서 활용될 수 있습니다
