summary_user: 서울특별시 관내 초등학교 도서관의 대출 내역을 대출 1건 단위로 학교명·학년·도서명·대출일자와 함께 담은 1회성 원천 파일이며, 학년이 0이면 교사의 대출이다. 학교 사서나 교육 분석가가 '학년별로 어떤 책이 많이 빌려지는가', '학교마다 대출이 어느 시기에 몰리는가' 같은 독서 실태 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 학교알리미 공시 등 다른 학교 데이터와는 학교명 문자열을 맞춰서만 이어 쓸 수 있다.
