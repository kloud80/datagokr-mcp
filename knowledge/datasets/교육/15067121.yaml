summary_user: 에듀넷에서 구축한 체육 교과 학습자료를 자료 한 건당 한 행으로 정리한 목록 파일로, 과목·주제·부제·제목·키워드와 에듀넷 바로가기 웹주소를 담는다(CSV 약 16KB). 교사가 수업 준비 때 '이 체육 주제에 맞는 에듀넷 자료가 무엇이고 어디서 여나'를 찾거나, 학생이 자기주도 학습 자료를 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주제·키워드 같은 이름 매칭이나 같은 기관(한국교육학술정보원)의 다른 교과 학습자료 목록과 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 제공하는 데이터는 에듀넷에서 구축된 체육 교과의 다양한 주제별 학습자료를 체계적으로 정리하여 제공하는 공공데이터입니다. 이 데이터는 초·중등 교육과정에 맞춰 흥미로운 체육 주제별로 구성되어 있으며, 각 주제는 텍스트 기반의 설명과 함께 실제 수업에 활용할 수 있는 다양한 교육 콘텐츠로 구성되어 있습니다. 자료에는 학습 과목명, 주제, 부제, 제목, 키워드 등 구체적인 정보가 포함되어 있어, 교사와 학생 모두가 수업 준비와 자기주도 학습에 활용할 수 있습니다.데이터의 수집은 에듀넷에서 개발·운영 중인 교수학습자료를 기반으로 하며, 교육 현장과 교과과정의 변화에 따라 새로운 자료가 추가되거나 기존 자료가 갱신되는 방식으로 이루어집니다. 보유근거는 「초중등교육법」에 따라 국가 교육정보화 및 교수학습 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 기반합니다. 업데이트 주기는 ‘수시(1회성 데이터)’로, 교육과정 개정이나 신규 자료 개발 시마다 필요에 따라 최신 자료로 갱신됩니다.이 데이터는 교육 현장에서는 교사들의 수업자료 준비, 학생들의 자기주도 학습, 교육 콘텐츠 개발, 교육 연구 등 다양한 분야에서 활용될 수 있습니다.
