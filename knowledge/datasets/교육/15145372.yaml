summary_user: 정부·지자체·공공기관·민간이 해외유학생에게 주는 장학금 등 학자금 지원 상품을 상품 한 건씩 담은 전국 범위 목록 파일(CSV)로, 지원기관명·상품명·언어·성적·소득 기준, 최대 지원 내용, 선발 방법, 홈페이지 주소를 담는다. 해외 유학을 준비하는 학생이나 학부모가 '내 학년·학교 구분·소득 수준에서 신청할 수 있는 유학 장학금이 무엇인가'를 찾는 데 쓴다. 다른 데이터와 잇는 전역 조인 키가 없어서, 연결하려면 지원기관명이나 학자금 유형·학교·학년 구분 같은 항목을 이름 기준으로 맞춰야 한다.
