description_portal: '금천구 관내 유치원 보험 가입 현황을 데이터로 공개하고 있습니다.이 자료에는 관할 교육청, 유치원명, 유치원 유형(공립·사립, 법인·사인·단설·병설), 가입한 보험명, 대상 여부 및 가입 여부, 보험 업체명(최대 3곳), 유치원 주소와 같은 정보가 담겨 있습니다.이 데이터를 통해 우리 동네 유치원이 어떤 보험에 가입되어 있는지, 그리고 안전·사고 대비 체계가 어떻게 마련되어 있는지를 확인하실 수 있습니다. 또 이를 바탕으로 유치원의 안전 관리 수준과 대비 현황을 비교·검토할 수 있으며, 교육·안전 정책 연구나 제도 개선 자료로도 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술연구원)'
