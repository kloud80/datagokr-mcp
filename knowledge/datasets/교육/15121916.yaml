description_portal: 한국산업인력공단에서 운영중인 능력개발포털 HRD4U(www.hrd4u.or.kr)에서 제공하는 콘텐츠 강의관련 정보로, 강의명과 강의시간 등의 정보가 포함되어 있습니다.2017년 이전 공단에서 개발한 NCS관련 강의 영상 들로, 현재는 관련예산 미편성으로 인해 업데이트되고 있지 않으며, 기존 개발 콘텐츠를 다양한 형태로 제공중입니다.이 개방데이터는 그 중, 동영상 형태의 콘텐츠 관련 데이터로, 강의 영상의 이름 및 강의시간을 제공하는 공공데이터입니다.해당 콘텐츠는 HRD4U 내에서 LMS형태로 제공되고 있습니다.
