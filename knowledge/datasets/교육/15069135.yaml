summary_user: 한국장학재단 학자금대출을 기준년월 시점에서 상품(일반 상환·취업 후 상환)과 대출 실행년도·학기별로 묶어 대출금액, 대출금리, 대출잔액을 담은 전국 단위 집계 파일입니다. 교육 정책 분석가나 연구자가 '취업 후 상환 학자금대출 중 몇 년도 실행분의 잔액이 아직 많이 남아 있는가', '학기별 대출금리와 잔액은 어떻게 변해 왔는가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 대출년도·학기나 상품명을 이름으로 맞추거나 같은 기관(한국장학재단)의 다른 장학·학자금 자료와 나란히 놓고 쓴다.
limits: 개인·대학·지역별 내역은 없고 전국 집계만 담는다(지역 구분 없는 비공간 자료). 포털 설명에 따르면 대출잔액에는 연체 1개월 미만 정상계좌와 연체 1~6개월 미만 계좌의 잔액만 들어가고, 일반 상환은 2009년 이후, 취업 후 상환은 2010년 이후 실행분만 다룬다.
