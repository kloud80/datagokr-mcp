description_portal: 한국교육개발원이 보유한 전문대학과 대학교 등 고등교육기관 졸업자 취업 및 진학률 정보를 바탕으로, 시도별로 기업규모에 따른 취업자수를 분석하였다. 서울 전문대학은 8248명, 대학교는 40160명으로 가장 많으며, 부산, 대구 등 주요 지역에서도 활발한 취업 현황이 나타난다. 기업규모별로 1-5인 미만부터 1000명이상까지 다양한 집단이 조사되어 학제별 및 지역별 취업 현황을 포괄적으로 파악할 수 있다. 이를 통해 고등교육기관 졸업자의 취업 및 진학 경향을 심층 분석하는 데 중요한 기초자료를 제공한다.(제공데이터)한국교육개발원이 보유하고 있는 국내 전문대학, 대학, 교육대학, 산업대학, 각종학교, 기능대학, 일반대학원 각 학제별 취업현황(취업률, 진학률 등) 정보
