summary_user: 경기도일자리재단의 일자리플랫폼 잡아바에 올라온 경기도 내 일자리 지원정책을 공고 단위로 담고, 공고명·기관명·모집 시작·종료일·지원 분류(구직활동·생활·주거·재직·기업 지원)·지역·상세페이지 주소를 제공한다. 구직자나 재직자가 '지금 모집 중인 경기도 주거·생활 지원 정책이 무엇인가'를 찾거나, 분석가가 시군별·분류별 지원정책 공고 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명·지역코드(REGION_CD)나 기관명 매칭으로만 연결하며, 국가자격 부문으로 분류돼 있어 채용·창업 요건 관련 자격 데이터와 주제상으로 함께 볼 수 있다.
description_portal: "경기도 일자리플랫폼 잡아바에서 제공하는 경기도 내 일자리 관련 지원정책(구직활동 지원, 생활 지원, 주거 지원, 재직 지원, 기업 지원) 정보 입니다.※ 데이터의 한계 : 원천기관에서 지역분류가 지정하지 않은 데이터는 제외되어 서비스 중이며, 일부 경기도 내 기관에서 지역분류를 '그외 지역'으로 선택한 경우가 있으니, 착오없으시기 바랍니다.※ 본 정보는 경기도일자리재단에서 운영하는 일자리플랫폼 잡아바!(www.jobaba.net)에서 제공하는 정보입니다.※ 자세한 내용은 상세페이지URL을 통해 확인하시기 바라며, 상세페이지에 있는 내용에 대한 무단복제 및 배포는 금하여 주시기 바랍니다."
