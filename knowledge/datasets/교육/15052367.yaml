summary_user: 서울특별시에 있는 고등학교를 한 학교당 한 행으로 담은 학교 기본정보 목록으로, 표준학교코드·학교명·영문명, 관할 교육청·교육지원청, 도로명주소·전화·홈페이지, 설립구분·남녀공학 여부·고등학교 유형·주야간 구분·설립일 등을 담는다. 학부모나 학생이 '우리 구에 있는 사립 여자 일반고는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 관할 교육지원청별 고등학교 분포를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 표준학교코드(STD_SCHL_CD)나 학교명 매핑, 같은 기관 코드로만 이어 쓰며, 교원·학생·학급 통계나 학교 재정도 이 학교 키로 붙는 것만 연계한다.
description_portal: 서울시 고등학교 기본정보 데이터는 서울특별시에 위치한 고등학교들의 행정·위치·설립·교육 특성 정보를 표준화하여 제공하는 공공데이터입니다. 각 고등학교를 식별하기 위한 표준학교코드와 학교명, 영문학교명이 포함되어 있어 국내외에서 학교를 정확히 구분하고 안내하는 데 활용할 수 있습니다. 시도교육청코드와 시도교육청명, 관할조직명 항목을 통해 각 학교가 어느 시도교육청 및 교육지원청의 관할에 속하는지 알 수 있어, 교육행정 업무 처리와 민원 대응, 행정 구역별 학교 현황 파악에 유용한 구조입니다.도로명우편번호, 도로명주소, 도로명상세주소는 고등학교의 정확한 위치를 제공하여 지도 서비스, 통학 경로 분석, 교육 인프라 분포 분석 등에 활용될 수 있습니다. 전화번호, 팩스번호, 홈페이지주소는 학교와 직접 소통하고 정보를 확인하기 위한 기본 수단으로, 학부모·학생·일반 시민이 학교에 문의하거나 학교 정보를 확인하는 데 중요한 역할을 합니다. 설립구분 항목은 공립, 사립 등 학교의 설립 유형을 구분하여 운영 주체와 재정·운영 구조의 차이를 파악하는 데 도움을 줍니다. 남녀공학구분명은 남학교, 여학교, 남녀공학 여부를 표시하여 학교의 학생 구성 특성을 나타냅니다.
