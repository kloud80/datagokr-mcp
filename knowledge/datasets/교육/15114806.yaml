description_portal: '해당연도 학기별(1, 2학기), 학제별(일반대, 전문대), 설립별(국공립, 사립), 학적별(신입생군, 재학생군) 국가장학금 신청 및 수혜 인원입니다.※ 데이터는 해당연도의 연말기준으로 작성됨※ 1. 신청 인원은 국가장학금 통합신청(I유형 또는 다자녀) 인원, 2. 수혜인원은 장학유형별(Ⅰ유형, 다자녀, Ⅱ유형, 지역인재) 중복제거된 순인원 3. 신입생군: 신입생, 편입생, 재입학생 / 재학생군: 재학생 4. 대학구분, 설립형태의 기타는 소속대학을 지정하지 않고 신청한 학생들의 정보※ 추가적인 정보가 필요하신 경우 한국장학재단 누리집(www.kosaf.go.kr) > 고객센터 > 먼저확인해요 > 자료실 > 한국장학재단 연도별 통계연보를 참고해주시기 바랍니다.'
