summary_user: 서울특별시 동작구 소재 학교를 학교 한 곳당 한 행으로 담은 기본정보 현황으로, 학교명·영문명·학교종류·설립구분·도로명주소·전화·팩스·홈페이지·남녀공학·주야구분·설립일·개교기념일과 고등학교 계열·학과 정보를 포함한다. 학부모나 주민이 "동작구에 있는 남녀공학 고등학교와 그 연락처·주소는 어디인가"를 확인하거나, 분석가가 구 단위 학교 목록의 기준표로 쓴다. 표준 학교코드(SD_SCHUL_CODE, 나이스 학교코드)를 조인 키로 삼아 교원·학생·학급 통계나 교육청·학교 재정 데이터 가운데 같은 학교 키를 가진 것과 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구의 학교 기본정보에 대한 학교명, 소재지, 주소, 전화번호, 홈페이지주소, 남녀공학여부, 주야구분, 개교기념일 등을 확인할 수 있는 현황입니다. 폐교 현황은 학교알리미(http://www.schoolinfo.go.kr/ei/ss/pneiss_a07_s0.do) 사이트의 신설/폐교 학교정보에서 확인 하실수 있습니다 Map에서 검색된 결과는 지도에 300개 까지만 마커로 표시 됩니다
