description_portal: 업로드된 데이터는 과학학습 콘텐츠 개발이나 분류 체계의 대분류 코드 목록입니다. 각 항목은 코드번호와 코드이름, 코드설명, 시스템 관련 여부로 구성되어 있으며, 대표적으로 ‘공룡’, ‘활자’, ‘로봇’ 등 과학, 기술, 인류사에 걸친 주요 주제를 대대적으로 아우릅니다.코드는 ‘콘텐츠대분류’로 시작하여 교육·학문, 자연세계, 산업, 그리고 연대구분, 과학관분류, 지역구분과 같은 구조적 분류로 세분화되어 있어, 학습 자료의 분류나 검색, 시각화 등에 활용도가 높습니다. 특이하게 각 대분류 코드와 함께 육식공룡아이콘, 활자아이콘, 로봇아이콘 등 시각적 정보를 위한 별도의 아이콘 코드도 병행되어 콘텐츠의 표현과 연동이 쉽게 설계되었습니다.‘우리나라 텃새’, ‘축음기’, ‘수의역사’, ‘우리나라 성곽축조과학’, ‘컴퓨터’ 등은 과학, 문화, 역사 등을 융합하여 다학제적 접근이 가능하도록 배치되어 있습니다.국립중앙과학관 홈페이지에 있는 과학학습콘텐츠(우리나라 텃새, 축음기, 공룡, 활자 등 19개)의 전시보유품 정보 목록입니다.
