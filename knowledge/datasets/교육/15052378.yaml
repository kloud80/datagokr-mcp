description_portal: 서울시 특수학교 기본정보 데이터는 서울시 관내 특수학교의 설립 및 운영 현황을 종합적으로 파악할 수 있도록 구성된 교육 행정 데이터입니다. 시도교육청코드와 시도교육청명, 표준학교코드, 학교명, 학교종류명, 소재지명, 관할조직명, 설립구분 등을 통해 각 학교의 행정적·법적 기본 정보를 확인할 수 있으며, 도로명우편번호, 도로명주소, 도로명상세주소, 전화번호, 팩스번호, 홈페이지주소 등은 이용자가 학교 위치와 연락처를 쉽게 찾을 수 있도록 지원합니다. 남녀공학구분명, 고등학교구분명, 산업체특별학급존재여부, 고등학교일반실업구분명, 특수목적고등학교계열명, 입시전후기구분명, 주야구분명 등의 항목은 특수학교의 교육과정 운영 형태와 학제 특성을 세부적으로 보여주는 정보입니다. 또한 설립일자, 개교기념일, 적재일시 정보가 포함되어 있어 학교의 연혁과 데이터 최신성을 함께 파악할 수 있으며, 특수교육 정책 수립, 학교 배치 계획, 연구·통계 분석 등 다양한 분야에서 활용 가능한 기초 자료입니다.
