description_portal: '대구광역시립남부도서관에서는 이용자들의 독서 활동을 지원하고 도서 선택에 도움을 주기 위해 대출 인기도서 목록을 제공하고 있습니다. 이 목록은 도서관에서 대출 빈도가 높은 도서들을 중심으로 구성되며, 각 도서에 대한 상세한 정보를 포함하고 있습니다. 제공되는 정보는 다음과 같습니다 1. 서명: 도서의 제목으로, 독자가 관심 있는 주제나 내용을 쉽게 파악할 수 있도록 합니다. 2. 저자: 도서의 내용을 집필한 사람으로, 저자의 이름을 통해 독자는 선호하는 작가의 작품을 찾을 수 있습니다. 3. 발행자: 도서를 출판한 출판사로, 출판사의 명성을 통해 도서의 신뢰도를 판단할 수 있습니다. 4. 등록번호: 도서관 내에서 해당 도서를 식별하기 위한 고유 번호로, 도서의 관리와 대출에 활용됩니다. 5. 청구기호: 도서관에서 도서를 분류하고 배치하기 위한 코드로, 도서의 주제나 분야를 나타내며, 이용자가 원하는 도서를 서가에서 쉽게 찾을 수 있도록 도와줍니다.'
