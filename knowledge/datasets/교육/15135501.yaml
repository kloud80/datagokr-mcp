description_portal: 한국사학진흥재단이 집계, 분석, 공시하는 학교기업 회계 운영계산서 자료입니다. 학교기업 회계 운영계산서를 통해 학교기업별 수익(매출액, 영업외수익)과 비용(매출원가, 판매비와관리비, 영업외비용, 법인세등비용)의 구조를 파악할 수 있습니다.해당 학교기업 회계 운영계산서 자료는 학교, 학교법인, 설립(국립, 공립, 사립), 학급(대학, 전문대학, 원격대학), 학종, 지역별로 구분되어 있습니다.세부 계정과목에는 매출액, 영업외수익, 국고보조금, 전입금, 기부금, 이자수익, 투자유가증권 처분이익, 기타영업외수익, 자산처분이익, 대손충당금환입, 전기오류수정이익, 고유목적사업준비금환입액 등이 있습니다.
