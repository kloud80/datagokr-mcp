description_portal: '한국잡월드에서 데이터 기준일 현재 운영하는 진로설계관 프로그램에 대한 정보를 공개합니다. 프로그램 제목, 장소, 대상, 기간, 세부 내용의 정보를 확인 하실 수 있습니다.이용 대상 : (주중) 초등학교 4학년(만10세) ~ 고등학교 3학년(만18세)　　　　　(주말) 어린이프로그램 초등학교 1학년 ~ 4학년 포함　　　　　※ 진로탐색 시기의 청소년 대상 프로그램으로 어린이 및 성인의 입장이 제한될 수 있는 점 양해바랍니다.진로탐색 프로그램다양한 진로를 탐색하면서 진로역량을 키우는 프로그램프로그램 주제는 학기별로 변경되며 예약 시 확인 가능프로그램 예시 : 퀴즈! 미래직업, 소중한 직업가치, 도전과 창업 등회차별 운영시간 : 60분 (어린이 프로그램 40분)회차별 최대 수용인원 : 140명 (어린이 프로그램 30명)최소 인원(5인) 미만 시 폐강될 수 있음놀이형 검사 프로그램놀이형 검사란? 기존 지필형 검사와 다르게 사례적용 및 활동 문항이 포함되어 각 개인이 가진 장점을 자연스럽게 이끌어내도록 개발된 검사임재능 스펙트럼 : 다중지능이론(Gardner, 1983)에 기반한 다중지능 8가지 영역의 발달 정도를 측정해 개인의 강점·약점지능을 파악, 이를 토대로 진로 정보를 제공흥미 퀘스트 : Holland 직업흥미이론에 기반하여 개인의 직업적 흥미를 탐색, 이를 토대로 진로정보를 제공검사 소요시간 : 개인별 차이 있음 (단, 1시간 이내 권장)회차 별 수용인원 : 재능 스펙트럼 30명, 흥미 퀘스트 40명'
