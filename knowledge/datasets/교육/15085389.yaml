description_portal: '○ 통계개요* 통계명 : 학생변동상황(전출·전입)* 통계종류 : 시내, 시외 전입 및 전출에 의한 학생이동현황의 일반·보고통계* 작성목적 : 전반적인 교육현황을 파악하여 초중등교육 정책 수립의 기초자료로 활용* 조사체계 : 각급학교→ 시도교육청 → 서울특별시 교육청* 공표주기 : 정기(매년, 4월1일 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 초·중·고 시내·시외 전입 및 전출에 의한 학생이동수 등○ 용어설명* 전출 : 우리학교 현 재학생이 다른 학교로 전학 간 학생* 전입 : 다른 학교 현 재학생이 우리학교로 전학해 온 학생○ 기 타* 조사기준일 : 매년 4월 1일 기준* 당해연도 3월부터 다음해 2월까지를 한 학년도로 함'
