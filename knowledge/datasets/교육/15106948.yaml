description_portal: 사이버보안인재센터에서 제공하는 교육 및 교육결과 정보는 사이버보안 분야 인재 양성을 위한 다양한 교육 프로그램의 세부 현황을 체계적으로 관리하고 있습니다. ‘교육명’은 각 교육 과정의 명칭을 나타내며, ‘교육시간’은 해당 과정의 총 이수 시간을 기록합니다. ‘수강료’는 교육 참가자가 부담하는 비용을 명확히 하여 교육 접근성을 파악할 수 있게 합니다. ‘차수’는 동일 교육 과정이 반복 실시되는 횟수를 표시하며, ‘지역(교육유형)’은 교육이 진행되는 장소 또는 온라인 등 교육의 형태를 구분하는 데 활용됩니다. ‘교육기간’은 각 교육 과정이 진행되는 시작일과 종료일을 포함하여 교육 일정 전반을 관리하며, ‘수료인원’은 해당 과정의 수료자 수를 집계하여 교육 성과와 참여 현황을 나타냅니다. 이와 같은 컬럼들은 교육 프로그램의 기획, 운영, 평가에 필수적인 데이터로 활용되며, 사이버보안 전문 인력 양성과 역량 강화에 기여하는 중요한 정보 자원입니다.
