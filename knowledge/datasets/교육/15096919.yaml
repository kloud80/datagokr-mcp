summary_user: 제주특별자치도에 등록된 사설 학원·독서실의 강사 수와 수강자 수를 기준 연도·시군구·구분별 인원 수로 집계한 통계로, 학원별 건별 원천이 아니라 집계표다. 제주시와 서귀포시 사이에 사교육 인력과 수강생 규모가 어떻게 다른지, 연도별로 늘었는지 줄었는지를 보려는 교육정책 담당자나 연구자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준 연도와 시군구 이름을 맞춰 붙여야 하며, 같은 지역의 학원·교습소 목록이나 학생 수 통계와 함께 강사 1인당 수강자 비율이나 학원 밀집도를 볼 때 쓴다.
description_portal: 제주특별자치도 사설 학원 강사 및 수강자 현황 데이터는 도내 등록된 사설 학원 및 독서실을 대상으로, 각 학원의 강사 수와 수강자 수를 집계한 통계자료이다. 이 데이터는 학원별 규모와 사교육 참여 현황을 파악할 수 있는 기초 정보를 제공하며, 학원 밀집도, 학생 대비 강사 비율, 지역별 사교육 수요 분포를 분석하는 데 유용하다. 교육 정책 수립이나 보육/학원 관련 행정 계획을 세울 때, 지역 내 사교육 시장 규모와 인력·학생 분포를 객관적으로 이해할 수 있는 근거가 된다. 또한 연구자나 시민은 교육비 및 사교육 참여율, 학원 운영 현황, 교육 격차 문제 등을 분석할 때 참고자료로 활용할 수 있으며, 누구나 접근 가능한 공공데이터 형태로 제공된다.
