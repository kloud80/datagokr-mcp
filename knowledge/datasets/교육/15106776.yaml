summary_user: 중소벤처기업연수원(안산)이 운영한 연수과정을 과정 한 건씩 담은 파일로, 과정명·분류·장소·기간과 교육시간·시작일·종료일, 연수비와 기업 규모별 환급액, 신청·등록·수료 인원을 함께 싣는다(csv 약 189KB). 중소기업 인사·교육 담당자가 어떤 직무 과정이 언제 열리고 자사 규모에서 환급을 얼마 받는지 확인하거나, 분석가가 과정별 신청 대비 수료율을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방연수원 운영현황 등과는 과정명·연수원 이름을 맞춰 이어 붙여야 한다.
description_portal: '중소벤처기업진흥공단의 연수사업을 담당하는 6개의 지방연수원* 중 중소벤처기업연수원(안산)에서 운영 중인 연수과정별 운영현황입니다. 해당 목록에서 아래의 칼럼명에 해당하는 데이터를 확인해 주십시오.* 중소벤처기업연수원(안산), 호남연수원(광주), 대구경북연수원(경산), 부산경남연수원(창원), 충청연수원(천안), 글로벌리더십연수원(태백)- 칼럼명: 순번, 연수원, 분류, 장소, 과정명, 기간(일), 교육시간(시), 시작일, 종료일, 연수비(원), 환급액(원), 신청인원(명), 등록인원(명), 수료인원(명)*환급액은 1000인 이상 및 미만, 중소기업에 따라 분류됩니다.'
