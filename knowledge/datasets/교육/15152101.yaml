description_portal: '데이터 구성: 전북특별자치도교육청 유초중고 통학버스 운영 학교에 관한 정보로 학교명, 우편번호, 주소, 도로명주소, 교장실/교무실/행정실 전화번호, 팩스번호, 읍면동, 위도, 경도정보를 포함함활용 목적: 유, 초,중,고, 특수학교 통학차량 운영학교의 주소 및 전화번호 정보 확인 가능공간정보: 위,경도 정보, 주소 및 도로명주소를 포함하고 있음매년 통학버스운영교가 달라질 수 있으므로 연간 데이터 갱신 예정. 통학버스운영에 관한 자세한 정보는 전북특별자치도교육청 통학차량관리시스템( https://edubus.jbe.go.kr/)에서 확인하실 수 있습니다.'
