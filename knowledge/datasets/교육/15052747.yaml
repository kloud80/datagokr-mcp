description_portal: ‘한국학중앙연구원_한국학전자도서관 DB 고서 목록’은 한국학중앙연구원 산하 한국학도서관에서 온라인으로 운영하는 한국학전자도서관에서 검색 가능한 고서(古書) 자료 목록을 정리한 데이터입니다.이 데이터는 서지번호, 청구기호, 서명, 저자, 출판사, 출판년도, 콘텐츠 유형, 소장 서고 등의 항목으로 구성되어 있으며, 조선시대와 근대에 간행된 귀중한 문헌들에 대한 상세 정보를 포함하고 있습니다.해당 데이터는 고문헌의 목록화 및 분류 체계 정립, 디지털 아카이빙, 한국학 연구자료 접근성 확대를 위한 핵심 인프라로서, 서지학 연구, 도서관 장서 관리, 고서 검색 서비스 개발, 교육 콘텐츠 활용 등에 폭넓게 활용될 수 있습니다.특히 장서각 소장의 전통 고서 정보를 공공데이터로 제공함으로써 전통지식 자원의 대중화와 학술적 활용 기반 확대에 기여하는 중요한 자료입니다.
