summary_user: 한국장학재단 학자금대출 가운데 연체 1개월 이상 6개월 미만 계좌의 대출잔액을 기준년월 시점에서 대출년도·대출학기·상품(일반 상환 학자금대출, 은행대출보증)별로 집계해 등록금잔액과 생활비용잔액(원)으로 나누어 담은 전국 단위 집계 파일이다. 교육정책 분석가나 연구자가 "어느 실행년도·학기에 나간 학자금대출에서 단기 연체잔액이 많이 남아 있는가"를 상품별로 비교할 때 쓴다. 전역 조인 키는 없고, 같은 기관의 다른 학자금대출 현황 자료와 기준년월·대출년도·대출학기·상품명을 이름 그대로 맞춰 잇는 방식으로만 연결한다.
limits: 전국 합계만 있어 지역·학교·개인 단위로 나눠 볼 수 없고 공간 정보도 없다. 취업 후 상환 학자금대출은 소득 기준 초과 전까지 상환이 유예돼 연체금액이 없으므로 이 자료에 나타나지 않으며, 6개월 이상 장기 연체도 범위 밖이다.
