summary_user: '서울특별시 관내 고등학교 등의 학교별 학과·계열 편제를 학교-학과 단위 행으로 담으며, 학교명·학교종류·도로명주소·남녀공학·주야과정·특목고 계열·산업체특별학급 여부 같은 학교 운영 특성이 함께 들어 있다. 학생·학부모가 "서울에서 특정 학과(예: 전기·디자인)를 운영하는 직업계고가 어디인가"를 찾거나, 분석가가 직업계고·특목고의 계열 구성을 비교하는 데 쓴다. 표준학교코드(SD_SCHUL_CODE)가 NEIS 학교코드와 같은 키여서, 같은 코드를 쓰는 학교 기본정보·학사일정·시간표 등 NEIS 계열 데이터와 학교 단위로 이어 쓴다.'
description_portal: 서울시 학교 학과 기본정보 데이터는 서울특별시 관내 고등학교 등의 학과·계열 현황을 상세히 제공하는 공공데이터입니다. 표준학교코드, 학교명, 영문학교명, 학교종류명을 통해 학교를 고유하게 식별할 수 있으며, 도로명주소와 상세주소로 학교 위치를 정확히 파악할 수 있습니다. 남녀공학구분명, 고등학교구분명, 주야구분명, 주야과정 등은 학교의 운영 형태와 학생 구성 특성을 보여 줍니다. 또한 계열명과 학과명은 각 학교에서 운영 중인 계열·전공 구조를 확인할 수 있는 핵심 정보로, 진로·진학 설계와 교육과정 분석에 활용할 수 있습니다. 산업체특별학급존재여부, 고등학교일반실업구분명, 특수목적고등학교계열명, 입시전후기구분명 등의 항목은 직업계고·특목고 등 고등학교 단계 교육의 특성을 세부적으로 분석하는 데 도움이 됩니다. 팩스번호는 학교 행정 연락 수단을 제공하며, 적재일시는 데이터가 시스템에 반영된 시점을 나타내어 자료의 최신성을 판단하는 기준이 됩니다. 이 데이터는 학교별 학과 편제 분석, 진학 정보 제공, 교육 정책 수립 및 연구·통계 등 다양한 분야에서 활용 가능한 구조화된 기초 정보입니다.
