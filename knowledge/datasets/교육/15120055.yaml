summary_user: 국외에 설치된 한국교육원의 회계연도별 기관 기초 정보(학교·교육원 구분, 현지 명칭, 한글 명칭, 홈페이지 주소)를 기관 단위로 담은 약 32KB 규모의 CSV 파일이다. 정책 담당자나 연구자가 '어느 나라에 어떤 한국교육원이 운영되고 있으며 공식 홈페이지는 어디인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육원 한글·현지 명칭을 이름 매핑하거나 같은 기관의 대학재정정보시스템 자료와 맞춰 이어 쓴다.
description_portal: 본 데이터는 대학재정정보시스템 내에서 국외에 설치된 한국교육원과의 재정 지원, 해외 교육 지원 사업 및 교육 교류 업무를 효율적으로 관리하기 위해 수집·운영되는 재정 및 기관 기초 정보입니다.주요 수록 항목으로는 한국교육원 식별 코드, 교육원명, 주재국(국가명) 및 주소, 연락처, 관리 파견 부서, 지원 예산 현황, 운영 상태 정보 등이 포함되어 있습니다.본 데이터를 활용하면 해외 한국교육원의 설치·운영 현황과 재정 지원 규모를 체계적으로 모니터링하여 국외 교육 지원 행정의 효율성과 투명성을 높일 수 있습니다. 또한 재외동포 교육 지원 정책 수립, 국외 한글·한국어 교육 기관 실태 분석, 대학 간 글로벌 교육 연계 사업 연구 등 다양한 정책 및 학술 영역에서 유용하게 활용할 수 있습니다.
