summary_user: 대구 달성군 안의 어린이집을 한 곳당 한 행으로 담은 시설 목록 파일로, 행정동·시설 유형(가정·민간·직장 등)·어린이집명·주소·우편번호·위도·경도를 포함한다. 학부모나 지역 정책 담당자가 "우리 동네(행정동)에 어떤 유형의 어린이집이 몇 곳 있고 어디에 있는가"를 확인하거나 보육시설 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 어린이집명·주소 문자열 매칭이나 행정동 이름, 위도·경도 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 달성군 내 보육시설(어린이집)의 현황으로, 행정동, 시설 유형(가정, 민간, 직장 등), 어린이집 명칭, 주소, 우편번호, 위치 좌표(위도·경도) 등의 정보를 포함하고 있습니다. 유아 보육 인프라 분포 파악, 복지정책 수립, 학부모 정보 제공 등의 목적으로 활용 가능한 자료입니다.
