summary_user: 강원특별자치도교육청 관내 학원의 이름·주소·등록상태·강사수·교습과정·과목·정원·교습비와 부대비용(모의고사비·급식비·기숙사비·차량비 등)을 담은 건별 파일 데이터이며, 검증 수신 기준 60,089행이다. 학부모는 우리 동네 학원의 과목별 교습비와 정원을, 분석가나 사업자는 지역별 학원 밀집도를 상권·주택 수요 신호로 보는 질문에 쓴다. 학원주소(address)를 조인 키로 삼아 주소 기반의 다른 지역 데이터나 학교 기본정보와 이어 쓰며, 별도의 학원 고유번호 키는 필드에 없다.
description_portal: 강원특별자치도교육청 관내 학원 관련 현황 자료입니다.본 자료는 학원명, 종류, 분야, 학원주소, 설립자, 일시수용능력인원, 정원합계, 교습계열, 교습과정, 교습과목,교습비 등학원관련한 공개자료를 제공하고 있으며,기준은 2025년 4월 1일자 현황을 게시한 자료입니다.매년 조사 후 취합한 자료를 근거로 현황을 업데이트하고있으며 이를 통해 최신 자료를 제공하고자합니다.본 자료는 강원특별자치도교육청 홈페이지에서도 확인할 수 있으며, 나이스 학원서비스에서도 학원, 교습비등 관련한 정보를 확인 가능합니다.
