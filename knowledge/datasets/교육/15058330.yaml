summary_user: 경기도 안에서 장례지도사 양성 교육을 하는 교육기관을 한 곳씩 담은 목록으로, 시군명·신고번호·교육원명·전화번호와 지번·도로명 주소, 우편번호, WGS84 좌표를 기관별로 제공한다. 장례지도사 자격을 준비하는 사람이 "우리 시군 근처에 신고된 장례지도사 교육원이 어디 있고 연락처는 무엇인가"를 찾거나, 분석가가 시군별 교육기관 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)를 다른 경기도 데이터와 맞춰 잇거나, 주소·좌표로 장례식장 등 위치 데이터와 공간 결합해 쓴다.
description_portal: 「장례지도사교육기관현황」 데이터는 경기도 내에서 장례지도사 양성을 위해 운영되는 교육기관 현황을 제공하는 자료입니다. 주요 항목에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 신고번호명(STATMNT_NO_NM), 교육원명(EDU_INDVDL_NM), 전화번호(TELNO), 소재지우편번호(REFINE_ZIP_CD), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지도로명주소(REFINE_ROADNM_ADDR), WGS84위도(REFINE_WGS84_LAT) 및 WGS84경도(REFINE_WGS84_LOGT)가 포함되어 있습니다. 이를 통해 각 장례지도사 교육기관의 위치, 연락처, 행정구역별 분포를 확인할 수 있으며, 교육기관 운영 실태 및 장례서비스 인력 양성 정책 수립에 기초자료로 활용할 수 있습니다. Open API(https://openapi.gg.go.kr/FunrlcochngEduins)를 통해 시군별 조건 검색이 가능하여, 지역별 교육기관 현황을 쉽게 파악할 수 있습니다. 본 자료는 교육취업 분야 데이터로서 상업적 활용은 가능하나 콘텐츠 변경은 허용되지 않으며, 노인복지·장례문화 연구, 전문 인력 양성 정책, 민간 서비스 개선 등 다양한 분야에서 활용될 수 있습니다.
