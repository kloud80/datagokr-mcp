summary_user: 경기도 시군별 교습소를 한 곳당 한 행으로 담은 건별 목록으로, 시설명·대표자명·교습과정명·전화번호·지번/도로명 주소·우편번호·WGS84 위도·경도를 포함한다. 학부모나 상권 분석가가 '우리 동네(읍면동)에 예능·보통교과 교습소가 얼마나 몰려 있나'를 지도로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)·읍면동명·주소 같은 이름 매핑이나 좌표 기반 공간 결합으로 학원 현황 등 다른 데이터와 잇는다.
description_portal: 경기도 내 시군별 교습소 현황입니다. 시설명, 전화번호, 소재지주소(지번/도로명), 교습과정명 등의 정보를 제공합니다.이 데이터는 경기도 내 각 시군에 위치한 ‘교습소’의 운영 현황을 정리한 자료로, 사교육기관으로 등록된 소규모 교육시설에 대한 기본 정보를 포함하고 있습니다. 교습소는 보통 하나의 교습과정 또는 특정 과목을 중심으로 한 1인 또는 소수 인력 운영의 사교육시설로, 학원과 달리 규모가 작고 개별 교습 중심의 운영 형태를 가집니다. 주요 항목은 시군명, 구/읍면동명, 시설명, 대표자명, 교습과정명(예능, 보통교과 등), 전화번호, 소재지 주소(지번 및 도로명), 우편번호, 위도 및 경도(WGS84 좌표) 등으로 구성되어 있습니다.교습소는 음악, 미술, 수학, 영어 등 특정 분야의 학습을 원하는 학습자들에게 맞춤형 교육을 제공하며, 교육 수요 다양화와 교육 접근성 확대에 기여하고 있습니다. 해당 데이터는 지역별 교육시설 분포 파악, 사교육 시장 동향 분석, 교육 수요에 따른 교습소 집중 지역 도출, 소규모 교육시설 정책 설계, 지리정보 기반 교육시설 지도 제작 등에 활용될 수 있으며, 특히 WGS84 좌표를 통해 GIS 기반의 시각화 및 위치 분석이 가능합니다.본 자료는 경기도 및 시군 교육청에서 수집한 공공데이터로, 지역 교육 인프라 현황 파악 및 공공·사교육 정책 수립의 기초자료로 활용됩니다.
