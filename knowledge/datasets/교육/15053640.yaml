description_portal: 이 문서는 삼일운동과 관련된 다양한 사건과 세부 장소 정보를 포함하고 있습니다. 주요 내용은 평북, 함북, 황해도, 경기 등 각 지역에서 발생한 휴교, 시위, 만세시위, 야간 시위, 화톳불 시위 등 독립운동 활동들로 구성되었습니다. 또한 천도교구의 시위 준비와 독립운동자금 관련 사건도 수록되어 있으며, 한국역사와 사료를 바탕으로 구성된 역사DB 자료로서 삼일운동의 폭넓은 지역적, 유형적 정보를 제공합니다. 이는 삼일운동데이터베이스와 GIS 연계를 통해 지역별 동향을 분석할 수 있는 귀중한 자료임을 알 수 있습니다.
