description_portal: 이 정보는 대구광역시 서구에 위치하고 있는 <서구영어도서관> 대출 순위에 관한 정보로 2026년 2월의 인기있는 책 목록을 제공합니다.서구 영어도서관은 2018년 4월에 개관하였으며, 대구광역시 서구 평리로 35길 90-6번지에 위치하고 있습니다. 보유하고 있는 자료로는 어린이원서 18,044권, 일반원서 649권, 어린이도서 634권, 일반도서 816권, 참고도서 7권 총 20,150권의 도서를 보유하고 있으며, DVD 2,288종, 신문 4종, 정기간행물 5종을 포함하여 총 2,297종의 비도서자료를 소장하고 있습니다.시설현황으로는 B1층에서 2F까지 3층으로 이루어져 있으며 1F에는 영어자료실, 프로그램실2, 리스닝존, VCR룸3개가 있으며 2F에는 스토리텔링존, 새마울문고서구지부, 작은도서관이 있습니다.자세한 사항을 확인하고 싶다면 홈페이지 https://library.daegu.go.kr/seogulib/html.do?menu_idx=108 에서 찾아보실 수 있습니다.
