summary_user: 경상북도청송교육지원청이 보유한 폐교 재산을 학교 한 곳당 한 행으로 담은 건별 목록으로, 소재지·학교명·설립년도·폐교년도·현재 활용 현황·대부(매각) 용도·주소를 포함하며 포털 설명상 33건입니다. 청송 지역 폐교를 임차하거나 매입하려는 주민·사업자가 어느 폐교가 아직 미활용 상태이고 어떤 용도로 대부·매각됐는지 확인하는 데 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·통계와는 학교명이나 주소를 직접 맞춰 이어야 한다.
description_portal: 청송교육지원청이 보유하고 있는 폐교 재산에 대해 소재지, 학교명, 설립 및 폐교 연도, 현재 활용 현황, 주소 등 다양한 정보를 포함한 총 33건의 데이터를 제공하며, 해당 폐교 자산의 임대 및 매각과 관련된 세부 내용까지 체계적으로 확인할 수 있습니다.자세한 사항은 경상북도청송교육지원청 홈페이지의 '청송교육-관내학교현황-폐교현황'에서 확인하시기 바랍니다.https://www.gbe.kr/cs/cm/cntnts/cntntsView.do?mi=6768&cntntsId=1802
