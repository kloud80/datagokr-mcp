description_portal: 본 데이터는 대학재정알리미의 통합공시 서비스에서 제공하는 고등교육재정지원 현황 및 재정 통계 정보입니다. 주요 내용으로는 중앙부처 및 지방자치단체가 고등교육기관(4년제 대학, 전문대학, 대학원 등)에 지원하는 사업별 지원 규모, 지원 주체(부처·지자체), 사업 유형(학술연구, 인력양성, 대학지원 등), 연도별 지원금액 및 수혜 대학 목록 등이 포함됩니다. 정부 및 지자체의 고등교육 재정 투입 현황을 다각도로 비교 분석하고, 대학별 재정 수혜 규모 파악 및 국가·지역 차원의 고등교육 재정 정책 효과성 검증을 위한 핵심 기초 데이터로 유용하게 활용할 수 있습니다.
