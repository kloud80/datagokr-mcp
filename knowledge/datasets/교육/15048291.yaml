description_portal: 광주광역시 소방학교 교육훈련시설에 대한 구체적인 정보를 제공하며 이에 관하여 간단하게 설명드립니다.소방학교 교육훈련시설은 총 13개동으로 되어있으며 총 연면적은 14593㎡입니다.주요 교육훈련시설에 대하여 설명드리자면 본관동(4144㎡)은 교육생의 교육을 위한 강의실 및 사무실 등으로 이루어져있으며, 생활관(3308㎡)은 교육생의 숙박 용도로 운용 중에 있습니다.훈련탑(581㎡) 및 보조훈련탑(390㎡)은 교육생의 현장 대비 훈련을 실시하고 있으며, 교육훈련관(4941㎡)은 내부훈련시설로 구조, 구급 현장활동에 대한 교육 훈련을 실시하고 있습니다.자세한 사항은 데이터 현황[붙임 파일]을 참조하여 주시길 바랍니다.
