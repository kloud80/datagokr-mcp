description_portal: 한국장학재단 대출상품별(일반상환학자금대출, 취업후상환학자금대출, 정부보증부학자금대출, 특별상환유예대출, 군복무이자유예대출, 대졸원리금대출) 사회적배려계층 및 중소기업 재직자 분할상환약정 자료입니다. 분할상환약정금액, 승인건수, 유지건수 정보를 제공하고 있습니다.본 제도는 학자금대출 장기연체로 대위변제 또는 기한이익상실 시 채무전액을 일시에 상환하여야 하나, 상환부담 경감을 위해 분할하여 납부하는 제도입니다.그 중에서 사회적배려계층과 중소기업 재직 중인 채무자의 경우 손해금(지연배상금)을 감면하여 채무상환 부담을 덜어주고 있습니다.상세 내용은 한국장학재단 누리집(www.kosaf.go.kr)을 참고해주시기 바랍니다.
