description_portal: '【직원 현황】:대학 소속*직원(산학협력단**포함)은 입력하며,법인,병설 및 부설학교,부속병원 및 의료원 소속 직원은 제외** (기준) 학교법인 정관, 학교규칙 및 직제 규정, 산학협력단 직제 규정에 명시된 조직의 소속 직원** 산학협력단 직원 중 국책사업단 또는 지방비사업단(중앙정부 및 지자체가 지원하는 R&D 등 사업 추진을 위해 일정기간 설치･운영되는 사업단) 소속의 연구원 및 직원은 제외 ※대학 소속 직원이라면 회계 유형과 관계없이 모두 입력대상이며,외주용역 업체 직원은 대학과 고용관계에 있지 않으므로 대학 소속 직원이 될 수 없음 ※본 대학 직원이면서 비전임교원인 경우 직원과 교원으로서 각각 중복하여 입력 가능【특정직】: 교육연구사, 교육연구관 등 교육을 직접 담당하지 않는 교육직렬의 교육전문직 및 대학회계 예산에서 보수를 지급하는 직원수(국･공립대학만 입력)【일반직】: 행정, 서무 등을 담당하는 사무계열 직원수【기술직】: 일반직에 준하는 직급의 기술자격자 직원수【별정직】: 예비군 중대장(5급 또는 6급 상당),기숙사생관리,모필사 등 특정업무를 담당하기 위해 별도의 자격기준에 의해 임용된 직원수【기능직】: 단순 노무에 종사하는 상기 직급 이외의 직원수 【고용직】: 행정, 서무 등을 담당하는 사무계열 직원으로 일반직으로 채용되었으나 직급 구분이 없는 직원수【기타】: 일용직 등의 직원수'
