summary_user: 한국사회보장정보원 교육홈페이지에 개설된 교육과정의 운영 회차(연도·기수)별 상세 정보를 건별로 담으며, 과정 제목·소개·목표, 수강신청·학습·복습 기간, 정원·대기인원, 교육시간·인정시간, 비용, 지역, 온라인 여부 등을 포함한다(파일 약 14MB, 전국 범위). 복지시설 종사자나 공무원이 행복이음·희망이음·전자바우처 같은 시스템 교육이나 개인정보보호교육이 언제 열리고 정원과 인정시간이 얼마인지 확인할 때 쓰고, 분석가는 연도별 교육 운영 규모를 살필 때 쓴다. 마스터과정 일련번호(ssis_master_course_sn)로 같은 기관의 마스터 교육과정 데이터와 이어 쓰며, 학교코드나 행정구역 코드 같은 외부 공통 키는 없다.
description_portal: '한국사회보장정보원에서 운영하는 교육홈페이지에 개설하여 제공하는 교육과정(내부직원교육, 복지정보시스템교육, 개인정보보호교육 등)에 대한 상세 정보1. 교육대상 : 내부직원, 공무원, 복지시설 및 기관 종사자 등2. 교육과정 종류- 사회보장정보시스템(행복이음), 사회서비스정보시스템(희망이음), 전자바우처, 보육통합, 지역보건의료, 범정부 시스템 교육- 내부직원의 법정교육 및 영량강화교육 등- 개인정보보호교육3. 교육방법 : 대면교육(실습교육, PPT교육 등), 온라인교육(동영상, 화상, 유튜브)'
