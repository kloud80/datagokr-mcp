description_portal: '○ 통계개요* 통계명 : 미취학 아동 보육시설 만족도* 통계종류 : 서울서베이의 서울시민 미취학 아동 보육시설 만족도를 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을제시하는데 목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시내용 - 서울시민의 미취학 아동 보육시설 만족정도(매우 불만족, 약간 불만족, 보통, 약간 만족, 매우 만족)○ 용어설명* 보육시설 : 보호자의 위탁을 받아 영유아를 보육하는 시설○ 기 타* 문항 : 귀댁의 미취학 자녀를 어린이집이나 유치원에 보내는 경우 보육시설에 대한 만족도를말씀해 주십시오'
