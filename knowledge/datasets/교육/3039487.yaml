description_portal: 2020년 통합교육연수시스템 교육연수현황에서는 다양한 교육과정을 통한 과정명별 교육이수가 활발히 진행되었음을 알 수 있습니다. 학교폭력예방 프로그램, 아동학대 예방 교육, 안전교육, 인성교육, 그리고 민주시민교육 등 다양한 사회복지 및 인성 중심 교육이수율이 대체로 높게 나타나며 교사와 학생의 함께 성장하는 교육환경 조성에 기여하고 있습니다. 이수율은 대체로 70%에서 99% 사이로 안정적이며, 특히 긴급복지지원 신고의무자 교육과 아동학대 신고의무자 교육은 이수인원이 많아 높은 참여도를 보입니다. 또한 과거 데이터도 함께 제공되어 지속적인 교육현황 모니터링 및 평가가 이루어지고 있습니다.
