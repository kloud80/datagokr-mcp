description_portal: '"정보과학도서관 정기간행물" 테이블은 도서관에서 소장하고 있는 다양한 정기간행물에 대한 정보를 제공하는 자료입니다. 이 데이터에는 간행물의 고유 식별번호와 함께 간행물의 구분 명칭, 간행물명, 발행주기 등이 포함되어 있어 이용자가 원하는 간행물을 쉽게 찾을 수 있도록 도와줍니다. 또한 해당 간행물이 소장된 자료실의 명칭과 함께 최초 등록일시 및 최근 수정일시 정보를 포함하고 있어 간행물 정보의 변동 사항을 확인할 수 있습니다. 이를 통해 시민들은 정기간행물의 소장 여부 및 열람 위치를 사전에 파악하고 효율적으로 도서관을 이용할 수 있습니다.보다 정확한 정보는 과천시 정보과학도서관 홈페이지(https://www.gclib.go.kr/lib/menu/10016/program/30034/magazineList.do)를 통해 확인하실 수 있습니다.'
