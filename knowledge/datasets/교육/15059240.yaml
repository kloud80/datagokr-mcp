summary_user: 경기도 내 고등학교를 학교 한 곳당 한 행으로 담은 건별 목록으로, 시군명·시군코드, 학교구분, 설립구분(공립/사립), 학교명, 전화번호, 지번·도로명 주소, 우편번호, WGS84 위경도를 포함한다. 학부모나 분석가가 '우리 시군에 공립·사립 고등학교가 어디에 몇 곳 있고 연락처는 무엇인가'를 확인하거나 통학권·학교 분포를 지도로 볼 때 쓴다. 전역 학교코드 같은 공통 조인 키는 없어 다른 교육 통계·재정 데이터와는 학교명 매칭이나 시군코드(SIGUN_CD)·위경도 기반 공간 결합으로 이어 쓴다.
description_portal: '경기도 내의 시군별 고등학교 현황입니다. 학교명, 소재지주소(지번/도로명), 연락처 등의 정보를 제공합니다.※ 출처 : 경기도교육청 홈페이지 학교찾기(http://www.goe.go.kr/edu/school/selectSchoolList.do?menuId=270151220143616&programId=PGM_1000000004&top_m=1&left_m=5&lm_1=6#search)이 데이터는 경기도 내 고등학교의 현황을 나타낸 자료로, 각 학교의 설립 유형(공립/사립), 시설명, 전화번호, 지번주소 및 도로명주소, 우편번호, WGS84 위도 및 경도 좌표 등을 포함하고 있습니다. 이를 통해 지역 내 고등학교의 분포, 설립형태에 따른 분류, 공간적 위치 분석이 가능하며, 학생 통학권 계획, 교육행정 수립, 응급상황 대응 인프라 분석 등에 활용될 수 있습니다. 또한 전화번호와 정확한 주소 정보는 교육 관련 서비스 제공 및 지역사회 교육 네트워크 구축의 기초자료로 활용됩니다.'
