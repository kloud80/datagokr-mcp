summary_user: 서울특별시 종로구 관내 유치원별로 급식 운영 방식, 위탁업체명, 전체 원아 수와 급식 원아 수, 영양교사 배치 여부(단독·공동), 조리사·조리인력 수, 집단급식소 신고 여부 등을 한 행씩 담는 기관 단위 현황 자료이다. 학부모나 구·교육청 담당자가 '우리 동네 유치원 중 급식을 직영하는 곳과 영양교사가 배치된 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 유치원 자료와는 유치원 코드(KINDERCODE)나 유치원명·교육청 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 서울특별시 종로구 관내 유치원의 급식운영 현황을 제공하는 공공자료입니다.자료에는 각 유치원의 급식 실시 여부, 운영 방식, 위생관리 현황 등 세부 정보가 포함되어 있으며, 유아의 건강한 성장과 안전한 급식환경 조성을 위한 행정정책 수립에 활용됩니다.이 데이터는 지방자치단체와 교육청이 급식운영 실태를 점검하고 개선 과제를 도출하는 데 근거자료로 사용되며, 보육환경 개선, 식단 영양관리 강화, 위생 안전기준 마련 등 다양한 정책 추진을 지원합니다.또한 연구기관과 민간에서는 유아급식 품질 향상 방안 연구, 식생활 교육자료 개발, 영양관리 성과 분석 등에 활용할 수 있습니다.종로구의 유아교육 환경 개선과 공공보육 서비스 품질 제고에 기여하는 중요한 행정자료입니다.  * 유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
