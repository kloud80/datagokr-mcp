description_portal: 데이터는 국비·도비 보조금으로 추진되는 정보화 집합교육기관의 연간 실적을 체계적으로 정리한 자료다. 도내 11개 장애인복지관에서 운영하는 정보화 교육을 대상으로 기관별 목표 인원, 실제 교육 참여 인원, 추진실적, 달성 비율 등을 제공한다. 이를 통해 장애인의 디지털 접근성 향상, 정보격차 해소 수준, 기관별 교육 운영 역량을 객관적으로 파악할 수 있다. 또한 교육수요 분석, 예산 집행의 효율성 검토, 향후 정보화교육 정책 방향 설정에 활용 가능한 기초 근거 자료로서, 장애인 디지털 역량 강화 정책의 성과를 정량적으로 평가하는 데 중요한 역할을 한다.
