summary_user: 인천광역시 관내 학교의 전형 유형별 운영 현황을 학교·모집학과 단위로 정리한 xlsx 파일(약 31KB)로, 학교명·성별 구분·모집학과·학급수·정원(명)·비고를 담는다. 학생·학부모가 "인천에서 특정 전형으로 지원할 수 있는 고등학교와 학과별 정원은 얼마인가"를 확인하거나, 분석가가 지역 내 전형별 모집 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 학교 기본정보 등 다른 데이터와는 학교명을 이름 매핑하거나 같은 교육청 자료끼리만 연결한다.
