summary_user: 경기도 초·중·고등학교별로 기준년도마다 1~6학년 학년별 전입·전출 학생 수와 전체 학생 수, 학교 전체 합계를 담은 학교 단위 집계 데이터다. 교육행정 담당자나 분석가가 '우리 시군의 어느 학교에서 전출이 많이 일어나고 학년별로 어떤 차이가 있는가' 같은 학생 이동 규모와 지역별 분포 변화를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 학교 통계·재정 자료와는 학교명·시군명 매칭이나 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD) 같은 기관 코드로만 이어 붙인다.
description_portal: 이 데이터는 경기도 내 초·중·고등학교 학생들의 전입 및 전출 현황과 전체 학생 수를 기록한 자료로, 학년별·학교별 학생 이동 상황을 파악할 수 있습니다. 기준년도, 시군명, 지역교육청명, 학교명, 설립구분 등이 포함되며, 1학년부터 6학년까지 학년별 전입학생수, 전출학생수, 전체학생수가 제공됩니다. 또한 학교 전체 전입·전출 합계와 학생 수 총합을 통해 학교별 이동 규모를 한눈에 확인할 수 있습니다.  이 데이터는 학교급별 전출입 추이 분석, 지역 간 학생 분포 변화, 학년별 이동 패턴 파악 등 교육정책과 학사행정의 기초자료로 활용될 수 있습니다.
