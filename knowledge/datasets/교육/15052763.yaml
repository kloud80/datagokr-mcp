description_portal: ‘한국학중앙연구원_장서각 호위청등록’ 데이터는 조선시대 인조대에 설치된 군영인 호위청(護衛廳)의 운영과 활동 기록을 담고 있는 본문 텍스트 데이터입니다.호위청은 궁궐과 국왕, 주요 관리의 경호를 담당하던 부대로, 해당 자료는 장서각에 소장된 고문서를 디지털화한 것이며, 일자별 행정 명령, 군사 배치, 경비 지시, 임무 수행 내역 등이 XML 구조로 정리되어 있습니다.데이터는 각 문서별로 고유 식별자(ID), 날짜, 제목(title), 본문(body), 담당 업무(duties), 인용문(quotes), 페이지(page) 등의 태그가 포함되어 있어, 군영 행정 문서의 체계적인 분석이 가능합니다.본문에는 병력 배치, 외곽 경계 강화, 근무 교대, 특별 임무 부여, 훈련 사항 등 궁궐 경비와 관련된 상세 내역이 기록되어 있으며, 당일 또는 시기별 상황 변화에 따른 대응 내용도 포함됩니다.이 데이터는 조선 후기 군사 제도 및 왕실 보호 체계에 대한 구체적 연구 자료로 활용될 수 있으며, 궁중 행정 기록 분석, 군영 간 역할 분담 비교, 정권 안정 기조 연구, 정조·영조·인조 시대 군영 정책의 이해에 기여합니다.
