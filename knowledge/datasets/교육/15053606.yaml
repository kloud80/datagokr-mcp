summary_user: 서울 강서구·양천구에 있는 평생직업교육 학원과 평생교육 시설을 기관 한 곳당 한 행으로 담은 목록 파일로, 구 이름·시설 구분·기관명·전화번호·주소가 들어 있다(약 19KB 규모의 CSV). 주민이 '우리 동네(강서·양천)에서 다닐 수 있는 평생교육 기관이 어디이고 연락처는 무엇인가'를 찾거나, 교육지원청·분석가가 관내 평생교육 기관 분포를 파악하는 데 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 데이터와는 기관명·주소를 이름 매칭하거나 주소를 지오코딩해 연결해야 한다.
description_portal: 이 파일은 서울특별시강서양천교육지원청 관내(강서구, 양천구)에 위치한 평생 직업 교육 학원 및 평생교육 시설에 대한 정보를 체계적으로 정리한 데이터입니다. 파일에는 각 기관의 지역(구), 기관 구분(학원/교육시설 등), 기관 또는 학원 명칭, 전화번호, 주소 등의 항목이 포함되어 있어, 특정 지역 내 평생교육 기관 현황을 쉽게 파악할 수 있도록 구성되어 있습니다.이 데이터는 지역 주민들이 가까운 평생교육 기관을 찾거나, 교육청에서 정책 수립 및 기관 관리에 활용하는 데 유용하며 정렬, 필터링 등을 통해 특정 지역이나 기관 유형만 선별해 활용하기도 좋습니다. 전반적으로, 관내 평생직업교육의 현황을 종합적으로 보여주는 행정 및 교육 기초자료라고 할 수 있습니다.
