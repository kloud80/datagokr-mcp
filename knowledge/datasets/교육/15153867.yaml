description_portal: 한국기술교육대학교 온라인평생교육원이 운영하는 스마트 직업훈련 플랫폼(STEP)은 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공하는 국가 직업능력 개발 플랫폼입니다. 이 플랫폼은 고용노동부의 정책 방향에 따라 직업훈련의 품질 향상과 교육 효과의 극대화를 목표로 설계되었으며, 특히 다양한 교육 과정을 체계적으로 관리하고 운영하기 위해 STEP 학습관리시스템 사용자 입력정보 테이블 데이터를 관리하고 있습니다. 본 자료는 학습자가 시스템을 사용하는 과정에서 발생한 키보드 및 마우스 이벤트 로그 및 시간으로 구성되어 있으며  학습자의 집중도 분석, UI/UX 개선, 맞춤형 학습 지원 기능 설계에 활용될 수 있습니다.
