description_portal: 한국과학창의재단은 대한민국 수학교육 발전에 공헌한 우수 교원을 발굴하고 포상하는 '대한민국 수학교육상' 수상자 명단 정보를 제공합니다. 이를 통해 수학교육에 헌신하는 교사들의 노고를 격려하고, 우수한 교육 사례를 확산시켜 대한민국 수학교육의 선진화에 기여하고자 합니다.개방 데이터는 2014년부터 2020년까지의 '대한민국 수학교육상' 수상자 100명의 명단입니다. 데이터는 수상연도, 수상자의 소속 지역, 학교명, 교사명으로 구성되어 있어, 연도별·지역별 수상 현황을 파악하고 우수 수학교사들의 정보를 확인할 수 있습니다.교육청 및 학교는 소속 교원의 수상 실적을 홍보하고, 우수 교사들의 교육 노하우를 공유하는 기회로 활용할 수 있습니다. 교사 및 예비교원은 수상자들의 사례를 통해 교수학습법 개선에 대한 동기를 부여받고 전문성을 신장시킬 수 있으며, 교육 연구기관은 수학교육 우수 사례를 연구하고 정책을 제안하는 데 기초 자료로 활용할 수 있습니다.
