summary_user: 서울특별시성동광진교육지원청 관내(성동구·광진구) 중학교를 학교 한 곳당 한 행으로 담은 작은 목록 파일(csv, 약 2KB)로, 학교급·학교명·설립 구분(공립/사립)·행정구·대표 전화번호·도로명주소를 담는다. 학부모나 주민이 성동구·광진구에 어떤 공립·사립 중학교가 있고 연락처와 주소가 무엇인지 확인하거나, 분석가가 두 자치구 중학교 분포를 주소 단위로 정리할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 주소를 매핑해 이어 붙여야 한다.
