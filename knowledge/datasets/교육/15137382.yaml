description_portal: 한국산업인력공단에서 제공하는 “국가자격 외부평가 시행관리 ‑ 자격증 관리 정보” 공공데이터는 자격증 관리 번호, 자격 관리 재고번호 등의 항목을 포함하여 국가기술자격시험 시행과 자격증 발급 ‑ 사후관리 과정에서 활용되는 세부 정보를 제공합니다. 이 데이터는 자격증의 고유 관리번호를 통해 발급된 자격증을 식별하고, 재고번호를 통해 물리적 발급물의 관리 상태를 추적 ‑ 기록하는 기능을 갖춥니다. 제공 기관은 한국산업인력공단 정보화기획부이며, 데이터는 연간 갱신됩니다. 파일은 CSV 형태로 공공데이터포털을 통해 무료로 다운로드 가능하고, 라이선스는 CC‑Zero로 이용제한이 없습니다. 이용자는 자격증 발급 추적, 분실/재발급 관리, 발급물 재고 관리 및 자격증 관련 행정 절차의 투명성 확보 등에 이 정보를 활용할 수 있습니다.
