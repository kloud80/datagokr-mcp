summary_user: 경기도 내 초·중·고등학교별로 학년·성별로 나눈 학생 체력 측정 평균값(심폐지구력·유연성·근력·순발력·BMI·체지방률)과 체력 1~5등급별 인원·비율, 검사 인원을 기준연도별로 담은 집계 데이터이다. 교육청·학교 체육 담당자나 분석가가 '우리 시군 중학교 여학생의 4·5등급 비율이 다른 지역보다 높은가' 같은 지역·학년·성별 체력 격차 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시군 코드·이름(SIGUN_CD), 교육지원청명, 학교명·정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)를 이름·코드 매핑해 학교 기본정보나 학생 수 통계와 붙인다.
description_portal: 이 데이터는 경기도 내 초·중·고등학교 학생들의 체력 증진 현황을 제공합니다. 주요 항목에는 학교급(초·중·고), 학년, 성별별로 구분된 심폐지구력(왕복 오래달리기, 스텝검사 등), 유연성(앉아 윗몸 앞으로 굽히기), 근력·근지구력(팔굽혀펴기, 윗몸말아올리기, 악력), 순발력(50m 달리기, 제자리멀리뛰기), 비만 지표(BMI, 체지방률) 등이 포함됩니다. 또한 학생들의 체력 수준을 1~5등급으로 구분하여 인원수 및 비율을 제공하므로, 특정 지역이나 성별·학년별 체력 격차를 분석할 수 있습니다. 이 데이터는 학생 건강 증진 정책, 학교 체육 프로그램 개선, 비만 예방 정책 수립에 유용하며, 경기도 교육청이 추진하는 체력 증진 사업의 효과를 평가하는 데도 활용할 수 있습니다. 다른 교육 데이터(학년별 학생수, 체육 시설 현황, 청소년 활동기관 현황 등)와 연계하면 학생 체력과 교육 환경 간 상관관계 분석도 가능합니다.
