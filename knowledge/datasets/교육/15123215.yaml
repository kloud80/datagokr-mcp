summary_user: 경기도청소년수련원이 운영한 공공특성화 사업(환경 감수성·도정 이해 등)을 프로그램별·연월별로 정리해 사업유형, 참가 대상과 교급, 참가인원과 성별 인원, 경기 남부·북부 참가자 수를 담은 집계 자료다. 청소년 정책 담당자나 분석가가 어떤 특성화 프로그램에 어느 교급·지역 청소년이 얼마나 참여했는지, 남부와 북부 사이 참여 편차가 있는지 확인하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 데이터와는 사업명·연월 같은 이름 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도청소년수련원이 운영하는 공공특성화사업에 대한 프로그램 정보와 참가자 현황을 기록한 자료로, 청소년의 환경 감수성 함양, 도정 이해 증진 등 사회적 가치를 반영한 특성화 활동을 중심으로 구성되어 있습니다. 주요 항목으로는 프로그램 분류, 세부 사업명, 사업유형(당일형 등), 연도 및 월별 운영 시기, 참가 대상의 유형 및 교급, 참가인원수 및 성별 인원, 그리고 경기 남부 및 북부 참가자 수를 포함하고 있어 활동별 참여도와 지역 편차를 파악할 수 있습니다. 이 데이터는 공공정책 연계 프로그램 성과분석, 환경교육 효과 측정, 취약계층 청소년 접근성 분석 등 다양한 방면에서 활용 가능하며, 청소년 관련 정책 수립 및 지역사회 연계 사업 기획에 도움을 줄 수 있습니다.
