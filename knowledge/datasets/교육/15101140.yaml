description_portal: 본 데이터는 경기도 광주시청에서 관리하는 시민정보화 교육 현황 자료입니다. 주요 제공 항목은 교육유형(집합교육 여부), 강좌명, 교육요일, 교육시간, 교육시작일, 교육종료일, 교육장주소, 문의전화로 구성되어 있으며, 광주시 시민을 대상으로 운영되는 다양한 정보화 교육의 상세 일정과 장소 정보를 수록하고 있습니다. 해당 데이터는 시민의 디지털 역량 강화와 정보격차 해소를 위해 마련된 교육 프로그램의 운영 현황을 투명하게 공개하는 데 활용됩니다. 또한, 강좌별 교육 일정과 장소, 문의처 정보를 통해 시민들이 원하는 교육을 신속하게 확인하고 참여할 수 있도록 지원합니다.
