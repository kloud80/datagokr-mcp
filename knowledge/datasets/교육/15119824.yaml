summary_user: 경기도 시군별 평생학습관·평생학습센터·주민자치센터 등에서 열리는 평생학습 강좌를 강좌 한 건 단위로 담은 목록으로, 강좌명·운영기관·장소·접수와 강의 기간·수강료·모집정원·상세정보 링크를 포함한다. 주민이 '우리 시군에서 지금 접수 중이고 수강료가 낮은 강좌가 무엇인가'를 찾거나, 분석가가 시군 간 강좌 개설 규모와 수강료 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 시군명(sigun_nm)이나 기관명을 이름으로 맞춰 시군 인구·평생교육기관 통계 같은 다른 자료와 잇는다.
description_portal: 경기도 평생교육진흥원에서 제공하는 데이터로 경기도 시군별 평생학습관, 평생학습센터 및 주민자치센터 등에서 이루어지는 우리동네 평생학습 강좌정보 개설현황 목록입니다.강좌명, 기관명, 강좌장소, 접수 및 강의 기간, 수강료, 모집정원 등의 정보를 포함합니다. 해당 데이터는 시민들의 평생교육 참여 활성화를 위한 강좌 운영 현황을 파악하고자 수집되었으며, 주민자치센터 등 지역 기반의 교육기관을 중심으로 다양한 교육 프로그램의 접근성과 운영 실태를 분석하는 데 활용될 수 있습니다. 강좌정보URL을 통해 상세 학습 내용을 확인할 수 있어 정보 접근성도 용이합니다. 본 자료는 지역 간 교육기회 격차 해소 및 평생학습 정책 수립의 기초자료로 활용될 수 있습니다.
