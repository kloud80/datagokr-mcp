summary_user: 경기도 내 학교를 행정구역·학교급·학제별로 나눠 학교명·설립구분·주소 등 학교 기본정보와 학생 수, 학급 수, 교원·직원 수, 교실 수, 교지 면적 같은 현황을 학교 단위로 담은 엑셀 파일(약 8MB)이다. 교육행정 담당자나 분석가가 "우리 시·군의 학교급별 학급당 학생 수와 교원 배치가 다른 지역과 비교해 어떤가"처럼 지역별 교육 자원 분포와 격차를 따질 때 쓴다. 전역 조인 키가 없어 다른 학교 데이터와는 학교명·주소 같은 이름 매핑이나 같은 기관의 코드로만 이어 붙이고, 학구도와 결합하면 학구 단위 인구 이동을 살피는 데 쓴다.
description_portal: 경기도 내 각 행정구역별로 학교급(유치원, 초등학교, 중학교, 고등학교 등)에 따라 학생 수, 학급 수, 교원 수, 직원 수, 고등학교 진학 현황, 교실 수, 교지 면적 등 학교별 주요 현황 정보를 포함하고 있습니다. 이 데이터는 경기도 내 교육 자원의 분포와 학교 현황을 종합적으로 파악할 수 있도록 구성되어 있으며, 교육 정책 수립, 연구, 행정업무, 학술 분석, 지역별 교육격차 해소 등 다양한 분야에서 활용될 수 있습니다. 교육기본통계조사 항목 및 자료는 교육통계서비스(https://kess.kedi.re.kr/)에서 상세한 정보를 조회하실 수 있습니다.
