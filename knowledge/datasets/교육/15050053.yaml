description_portal: '【입학정원】: 학칙에서 정한 당해연도 신입생의 입학정원【모집인원】: 당해연도 모집요강에서 공고하는 선발인원【정원내 모집인원】:정원내 모집인원 =입학정원 +이월인원 –모집정지인원 –당해연도 2+4약학대학 입학정원【지원자】: 신입생 전형에 지원한 정원내, 정원외 지원자(수시 및 일반･특별전형 등의 지원자 포함)【입학자】: 해당연도에 신입생 전형에 지원하여 입학한 자(모집인원 미달로 추가 모집한 입학자 포함), 정원내와 정원외로 구분【정원내 입학자】: 정원내에서 일반전형과 특별전형에 지원하여 입학한 자【정원외 입학자】: 전형유형에 따라 산업체위탁생, 계약학과, 군위탁생, 농어촌학생, 재외국민 및 외국인, 장애인 등 대상자, 서해 5도 학생 등【정원내 신입생 충원율(%)】: (정원내 입학자 수 / 정원내 모집인원) × 100【경쟁률】: (정원내 지원자 수 / 정원내 모집인원), 소수둘째자리에서 반올림'
