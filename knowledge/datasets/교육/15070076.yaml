summary_user: 대학생 청소년교육지원장학금 사업에서 대학이 반환한 교부금을 반환 건별로 담은 전국 단위 파일로, 배정년도·학기·배정구분, 대학명, 반환금액·이자·국고반납금액, 반환취소, 부당수급 반환 여부를 기록한다. 장학 사업을 분석하는 연구자나 예산 담당자가 '어느 대학이 어느 연도·학기 배정분을 얼마나 반환했고, 그중 부당수급 반환은 얼마인가'를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 대학 데이터와는 대학명 문자열을 맞춰 연결해야 하고, 같은 재단의 장학금 지급 자료와는 상품명·배정년도·학기 기준으로 대조한다.
