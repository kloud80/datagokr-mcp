description_portal: 2021년 11월 개정된 국토교통부 고시(개인택시운송사업 면허의 양수요건 등 관련 교통안전교육에 관한 고시)에 따라 교통안전교육 전 과정을 이수할 필요성이 적은 일반택시운송사업 운전경력자 대상 단축된 교육과정 "개인택시면허 양수교육 경력자과정"이 신설됨. 해당 요건은 "교육신청일"기준 최근 2년간 1년(365일) 이상의 일반택시경력이 필요하지만, 일반택시면허의 경력 인정 범위를 확대하기 위해 기존 "2년"의 경력 인정 범위를 "3년"으로 완화하기 위한 기초자료.
