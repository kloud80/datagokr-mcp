summary_user: 대학별·기준연도별로 등록금 수입과 학비 감면액이 등록금 총액의 10% 이상인지, 경제적 곤란 학생 감면이 총감면액의 30% 이상인지를 비율과 금액으로 담은 집계 파일이며, 범위는 전국이다. 학생·학부모나 교육정책 분석가가 "우리 대학은 등록금 감면 법정 기준을 지키고 있나, 저소득층 감면 비중은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 대학 공시·장학금 자료와는 학교명(학교명)과 기준연도를 맞춰 이름 매핑으로만 연결한다.
description_portal: 「대학 등록금에 관한 규칙」 제3조(등록금의 면제·감액)제2항 준수 여부「대학 등록금에 관한 규칙」 제3조제2항 학교는 해당 학년도에 전체 학생이 납부해야 할 등록금 총액의 10퍼센트 이상에 해당하는 등록금을 학생에게 면제하거나 감액하여야 한다. 이 경우 경제적 사정이 곤란한 학생에게 감면하는 액수가 총감면액의 30퍼센트 이상이 되도록 하여야 한다.※ 본교와 분교가 나뉜 경우는 본교와 분교가 각각 입력(캠퍼스는 본교에 통합 입력)※ 위 법령상 등록금 총액에는 수업료 외에도 입학금이 포함됨을 유의
