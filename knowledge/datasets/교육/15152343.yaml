description_portal: 이 데이터는 충청남도 내 위험물질을 관리하거나 취급할 가능성이 있는 교육기관에 대한 공공데이터입니다. 각 항목은 학교 고유번호(SCHUL_SN), 학교명(SCHUL_NM), 주소(SCHUL_ADRES), 등록일(REG_DATE), 사용 여부(USE_AT)로 구성되어 있으며, 유치원부터 초·중·고등학교, 특수학교까지 다양한 교육기관이 포함되어 있습니다. "USE_AT" 값이 "Y"로 표시된 것은 해당 데이터가 현재 유효하고 관리 대상임을 의미합니다. 이 자료는 학교 내 실험실, 과학실, 창고 등에서 위험물질을 취급하거나 보관할 가능성이 있는 시설을 파악하고, 안전관리 및 사고 예방을 위한 정책 수립에 활용될 수 있습니다. 또한 지역사회와 교육청이 협력하여 학생들의 안전한 학습 환경을 조성하는 데 필요한 기초 정보를 제공합니다.
