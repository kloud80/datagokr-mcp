description_portal: '○ 통계개요* 통계명 : 사교육비 현황* 통계종류 : 지정통계, 조사통계* 조사목적 : 우리나라의 초중고 학생들의 사교육비 실태를 체계적으로 조사하여 공신력있는 통계를 정기적으로 작성,사교육비 경감대책 및 공교육 내실화 등 교육정책 수립의 기초자료 제공* 조사주기 : 매년* 조사체계 : 조사대상 학교 → 지방통계청(사무소) → 통계청* 공표범위 : 지역 - 서울시내용 - 초·중·고교 학생의 월평균 1인당 사교육비 및 사교육율○ 용어설명* 사교육비: 초·중·고 학생들이 학교의 정규 교육과정 이외에 사적인 수요에 의해서 학교 밖에서 받는 보충교육을위해 개인이 지출하는 비용임학원수강, 개인 및 그룹과외, 방문학습지, 인터넷 및 통신강의 등의 수강료(교재비 포함) 지출비용을 의미함○ 기타* 학생 1인당 월평균 사교육비는 전국 초·중·고 전체학생(사교육을 받지 않은 학생 포함)을 대상으로 한 평균금액임* 사교육 참여율은 전체학생 중 사교육비를 지출한 참여학생의 비율임* 사교육비 금액은 물가상승분이 포함된 명목금액임* 사교육비조사에서는 고등학교(일반고, 특수목적고, 자율고, 특성화고 포함)와 일반고(특성화고 제외)로 공표* 학생(개인)단위로 조사되므로 가구단위 통계와 차이가 있을 수 있음을 유의할 필요* 2018년부터 진로·진학 학습상담 비용이 사교육비에 포함됨 (2017년 소급 보정됨)* 2020년 코로나19 상황으로 한시적 통계작성방법 변경(연간화 미적용) 자료 이용시 유의○ 조사기간 및 방법* 연간화 적용: 조사대상월(3~5월, 7~9월)을 조사하고, 이외 조사하지 않은 월은 가계동향조사 교육비 지출구조를 통해추정하여 연간통계 공표연간화 미적용: 조사대상월 이외 월의 사교육비를 추정하지 않고, 조사대상월만을 대상으로 통계 작성'
