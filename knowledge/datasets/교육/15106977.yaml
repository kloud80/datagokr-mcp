summary_user: 고용노동부 정부지원 훈련에 참여하려는 기관이 매년 받는 훈련기관 인증평가 결과를 기관·평가년도별 한 행으로 담은 전국 단위 CSV 파일(약 2.2MB)이다. 훈련기관명, 집체·원격 구분, 신규·기존 구분, 5년·3년·1년인증·인증유예 등급, 우수기관 여부가 들어 있다. 구직자나 재직자가 국비지원 훈련을 고를 때 '이 학원이 몇 년 인증을 받은 우수기관인가'를 확인하는 데 쓰고, 분석가는 연도별 인증등급 분포를 보는 데 쓴다. 전역 조인 키가 없어 훈련과정·훈련기관 정보 같은 다른 데이터와는 훈련기관명 문자열 매칭으로만 연결한다.
description_portal: 고용노동부 정부지원 훈련에 참여를 희망하는 기관에 대해 매년 훈련기관인증평가를 거쳐 선정된 결과이며 훈련기관명, 훈련종류, 기관종류, 평가년도, 평가등급, 우수기관여부를 제공함.훈련종류는 [집체]와 [원격] 총 2가지로 분류되며, [집체]는 집체훈련기관, [원격]은 원격훈련기관을 의미함.기관종류는 [신규]와 [기존] 총 2가지로 분류되며, [신규]는 당해 고용노동부 정부지원 훈련과정 운영 실적이 없는 훈련기관, [기존]은 고용노동부 정부지원 훈련과정 운영 이력이 있는 기관을 의미함.평가등급은 [5년인증], [3년인증], [1년인증], [인증유예] 총 4가지로 분류되며, [5년인증]은 최우수 또는 우수 훈련기관, [3년인증]은 일반 훈련기관, [1년인증]은 신규기관, [인증유예]는 인증등급을 획득하지 못했음을 의미함.
