summary_user: 경기도 소재 대학·전문대학 졸업생의 취업 현황을 기준연도·학교·단과대학·학과 단위로 집계해, 성별 졸업자 수, 건강보험 연계 취업자·해외취업자·농림어업·개인창작 종사자, 진학자, 입대자, 취업불가능자, 외국인 유학생 수와 취업률(EMPLYMT_RT), 1차·2차 유지취업률을 담는다. 진학 상담 교사나 수험생·학부모가 "경기도 안에서 이 학과의 졸업생 취업률과 유지취업률은 어느 정도인가"를 비교하거나, 분석가가 학과 계열별 취업경로를 볼 때 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어서, 학교 기본정보나 교원·학생 통계와는 학교명·학과명(SCHOOL_NM, MJR_NM)을 이름으로 매핑해야 이어 쓸 수 있다.
description_portal: 이 데이터는 대학 및 전문대학 졸업생의 취업 현황을 기록한 자료로, 학교·학과별 졸업자 수와 취업자 수, 진학자 수, 군입대자 수, 취업불가능 인원 등을 포함합니다. 이를 바탕으로 산출된 취업률(%)과 유지 취업률(1차~4차)이 제공됩니다. 또한 외국인 유학생, 입학 당시 기취업자, 교내 취업자 현황도 포함되어 있어 취업경로 분석이 가능합니다. *건강보험연계 취업통계 결과는 학교조사 없이 공공DB연계로만 이뤄진 조사로 개별 학교 단위의 정확한 학교별 취업률을 산출하지 않으므로 경향 파악 등으로만 참고해 주시기 바랍니다.
team:
  dept: AI미래행정과
