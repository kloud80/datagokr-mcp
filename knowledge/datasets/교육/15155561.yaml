description_portal: 본 데이터는 일제강점기 감시대상 인물카드 메타정보로, 일제시기 독립운동가, 사회주의자, 사상범, 기타 반일 행위 등으로 인해 일제 경찰의 감시 대상이 되었던 인물들에 대한 기초 정보를 담고 있습니다. 해당 자료는 독립기념관 등 역사 연구 기관에서 수집 및 정리한 공공 기록물을 바탕으로 하며, 일제시대 조선총독부 경찰 및 헌병대가 작성했던 ‘요시찰인(要視察人)’ 관련 기록의 메타데이터를 중심으로 구성되었습니다. 이 데이터는 일제 감시 체제의 실상과 당시 저항했던 인물들의 활동 범위를 파악하는 데 중요한 사료적 가치를 지닙니다.데이터는 기본적으로 개별 인물 단위로 구성되어 있으며, 각 인물에 대해 이름, 본적지, 주소, 적용 죄명, 그리고 원문 데이터에 접근할 수 있는 URL을 포함하고 있습니다. 특히, "적용죄명" 컬럼은 일제가 감시 대상을 분류하고 탄압하는 데 사용했던 법적 근거를 직접적으로 보여주며, "치안유지법"이 다수 등장하는 것이 특징입니다. "본적지"와 "주소"를 통해 인물들의 지리적 분포와 활동 영역을 유추할 수 있으며, 주소 컬럼의 NULL 값은 인물에 대한 추적이 미흡했거나 기록이 누락되었을 가능성을 시사합니다.이 데이터는 한국 근현대사 연구 및 독립운동사 연구의 기초 자료로 활용될 수 있습니다. 연구자들은 이 데이터를 통해 일제 강점기 감시 체제의 조직적 성격을 분석하고, 감시 대상 인물의 지역별 분포와 사상적 배경을 심층적으로 파악할 수 있습니다. 또한, 일반 대중에게는 일제강점기 수난을 겪었던 무명 애국지사들의 존재를 알리고 역사 교육 자료로 활용되는 데 기여할 수 있습니다.
