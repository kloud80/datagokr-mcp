summary_user: 서울 종로구 관내 유치원별로 건물 건축년도(ARCH_YR), 건물 층수, 건축면적·연면적, 설립유형, 주소 등 건물현황을 유치원 한 곳당 한 행으로 담은 자료로, 유치원알리미 공시 내용을 바탕으로 한다. 교육청·구청 담당자나 연구자가 '종로구에서 지은 지 오래되어 개보수 우선순위가 높은 유치원은 어디인가' 같은 시설 노후도 점검이나 유아교육 인프라 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 유치원알리미 항목(원아 수 등)이나 어린이집 자료와는 유치원 코드(KDGT_CD)·유치원명·주소를 같은 기관 코드 체계 안에서 맞추거나 이름 매핑으로 이어 써야 한다.
description_portal: 본 데이터는 서울특별시 종로구 관내 유치원의 건물현황을 제공하는 공공자료입니다.자료에는 각 유치원의 건물 건축년도, 연면적, 층수, 주요 시설 현황 등 세부 항목이 포함되어 있으며, 유아의 안전한 교육환경 조성과 시설개선 계획 수립에 활용됩니다.이 데이터는 지방자치단체와 교육청이 노후 시설을 점검하고 개보수 및 증축 우선순위를 설정하는 근거자료로 제공되며, 보육환경 개선, 공간 활용 효율화, 안전관리 기준 마련 등 다양한 정책 추진을 지원합니다.또한 연구기관과 민간에서는 교육시설 현황 분석, 유아교육 인프라 수급 조사, 건축·안전 정책 연구 등에 활용할 수 있습니다.종로구의 유아교육 환경 개선과 교육시설 관리 효율성을 높이는 중요한 행정자료입니다. * 유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
