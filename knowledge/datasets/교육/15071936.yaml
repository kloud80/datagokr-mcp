description_portal: 제공하는 데이터는 학술연구정보서비스(RISS) 웹사이트 내에서 운영되는 각종 팝업창의 관리 현황과 내용을 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 팝업의 제목, 노출 기간, 등록일, 내용, 적용 위치 등 팝업창의 운영 및 관리에 필요한 주요 정보가 포함되어 있습니다. 데이터는 RISS 시스템을 통해 팝업이 등록·수정될 때마다 실시간으로 수집되며, 고등교육기관의 학술정보 제공과 이용자 안내, 서비스 공지 등 다양한 목적에 따라 관리됩니다. 보유 및 제공 근거는 「교육관련기관의 정보공개에 관한 특례법」 등 관련 법령과 RISS 서비스 운영 정책에 기반합니다. 업데이트 주기는 팝업 정보가 변경될 때마다 수시로 이루어지며, 대학도서관 및 연구자, 일반 이용자에게 학술정보 서비스 공지, 교육 안내, 시스템 점검 알림 등 다양한 분야에서 활용됩니다
