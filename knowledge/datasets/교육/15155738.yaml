summary_user: 전국 초·중·고등학교의 학급을 한 행씩 담은 건별 원천 데이터로, 학년도·학년·학급명과 주야 과정·학교 과정·계열·학과명 등 반의 기본 성격을 담는다. 학부모나 연구자가 '이 학교에 올해 몇 학년에 어떤 반·학과가 편성돼 있나'를 확인하거나 학교별 학급 편성 현황을 비교하는 데 쓴다. 나이스 학교 코드(SD_SCHUL_CODE)를 키로 같은 나이스 계열의 급식·학사일정·시간표 데이터나 학교 기본정보와 이어 쓰고, 시도교육청 코드로 교육청 단위 묶음도 만든다.
limits: 포털 활용신청과 별개로 외부 사이트(open.neis.go.kr)의 인증키를 받아 호출해야 한다. 지역별 통계가 아닌 학교·학급 단위 자료이며 공간 좌표는 없다.
