description_portal: 학급 기본정보 데이터는 전국 초·중·고등학교에서 운영되는 학급의 명칭과 성격을 국민에게 제공하는 자료입니다. 주요 항목에는 학급명, 학년, 반 번호, 남녀공학 여부, 학급 유형(일반학급, 특수학급, 병설학급 등)이 포함됩니다. 이를 통해 학부모와 학생은 학교의 학급 운영 현황을 확인할 수 있으며, 연구자와 정책 담당자는 학급 규모, 성별 구성, 특수학급 운영 현황 등을 분석할 수 있습니다. 특히 남녀공학 여부는 학교의 성별 통합 교육 현황을 파악하는 데 중요한 지표로 활용됩니다. 이 데이터는 교육부와 한국교육학술정보원(KERIS)이 관리하는 교육행정정보시스템(NICE)에 기반하여 제공되며, 학급 편성 변경이나 신설·폐지 현황을 반영해 최신성을 유지합니다. 학급 기본정보는 교육정책 수립, 학급 운영 연구, 학부모의 학교 선택 등 다양한 분야에서 중요한 기초자료로 활용됩니다.
