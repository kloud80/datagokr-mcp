summary_user: 경기도 내 학교별로 운동장·체육관·강당·일반교실·특별교실·시청각실의 개방 여부를 '유/무/해당없음'으로 담은 학교 단위 현황 데이터이며, 기준연도·시군·지역교육청·학교급·설립구분 같은 기본정보가 함께 들어 있다. 주민이나 생활체육 동호회가 '우리 시군에서 체육관이나 운동장을 개방하는 학교는 어디인가'를 찾거나, 분석가가 학교급·지역별 시설 개방률을 비교하는 데 쓴다. 전역 조인 키는 없어서 학교명·시군 코드(SIGUN_CD)·학교 공시 코드 등을 이름·코드 매핑하거나 같은 기관의 다른 학교 데이터와 맞춰 이어 쓴다.
description_portal: 본 데이터는 경기도 내 학교시설 개방 현황을 종합적으로 제공하는 자료로, 운동장, 체육관, 강당, 일반교실, 특별교실, 시청각실 등의 공간별 개방 여부를 '유', '무', '해당없음'의 형태로 제시하고 있습니다. 각 데이터 항목은 학교명, 시군명, 지역교육청명, 학교급명, 설립구분명 등의 기본정보와 함께 시설별 개방 여부를 포함하고 있으며, 학교알리미 시스템에서 제공된 정보를 바탕으로 경기도 AI데이터행정과가 연간 주기로 갱신하여 제공합니다. 해당 데이터는 교육시설 활용도 분석, 지역사회와의 연계 프로그램 기획, 교육정책 수립 및 공간 개방 확대 여부를 평가하는 데 유용하게 활용될 수 있습니다. 또한, Open API를 통해 인증키와 간단한 파라미터 입력만으로 실시간 데이터를 연계·활용할 수 있습니다.
