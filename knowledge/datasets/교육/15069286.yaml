description_portal: 한국장학재단은 경제적 여건에 관계없이 능력과 의지가 있는 학생이면 누구나 균등한 고등교육 기회를 가질 수 있도록 다양한 학자금대출 제도를 운영하고 있습니다. 해당 데이터는 일별 학자금대출 분할실행건수 및 금액에 대한 데이터로 일반상환학자금대출, 취업후상환학자금대출이 있습니다.(기준일자는 대출실행일의 익일)* 등록금 실행건수는 등록금 분납연계 대출 실행건수를 말하며, 생활비대출은 학기별 생활비 한도 내 분할 실행한 건수를 말함학자금대출 상품에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.
