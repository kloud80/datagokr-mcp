description_portal: '○ 본 파일은 대전광역시 서구 월평도서관(주소: 대전광역시 서구 한밭대로 664)에서 보유하고 있는 도서정보현황 데이터를 포함하고 있습니다.○ 제공되는 데이터에는 다음과 같은 주요 항목이 포함되어 있습니다:* 도서 위치: 해당 도서가 실제로 배치된 서가 또는 열람실의 물리적 위치 정보입니다.* 제어번호: 도서관 내부 시스템에서 각 도서를 고유하게 식별하기 위해 부여된 관리번호로, 시스템 내 검색 및 연계 처리에 사용됩니다.* 등록번호: 도서가 도서관에 최초로 등록될 때 부여되는 고유 식별번호로, 일반적으로 등록 순서에 따라 부여되며 장서 통계 등에서 활용됩니다.* 도서명, 저자, 출판사, 출판년도* 청구기호: 도서관 분류체계(주로 한국십진분류법, KDC 기준)에 따라 각 도서에 부여되는 번호로, 해당 도서의 주제 영역 및 서가 내 위치를 나타내며, 일반적으로 저자 기호와 함께 표시됩니다.* 도서 상태○ 본 데이터는 월평도서관의 도서관리 시스템에서 특정 기준일을 기준으로 추출된 것으로, 해당 기준일 이후의 신규 등록, 도서 이동, 폐기, 도서 상태 변경 등은 반영되지 않았을 수 있습니다. 따라서 실제 보유 현황과 일부 차이가 있을 수 있으며, 보다 정확한 정보가 필요한 경우에는 도서관에 직접 문의하시거나 홈페이지를 통해 확인하시기 바랍니다.'
