description_portal: '이 데이터는 우리동네학습공간 현황을 정리한 자료입니다. 우리동네학습공간이란, 지역주민에게 친근한 우리동네 시설(카페,도서관 등)을 활용하여 함께 배우고 나눔을 실천하는 지역 커뮤니티 공간으로서, 생활 속 평생학습을 지향하며 지역과 소통하고 호흡하는 마을공간입니다. 시설주는 공간을 학습모임에 무료로 제공해 지역커뮤니티공간으로서 이점을 얻고 시민들은 해당 공간에서 학습 모임 활동을 통해 학습 공동체를 형성합니다. 학습공간의 명칭, 유형(예: 카페, 교육시설 등), 도로명 주소, 운영기관전화번호 등의 항목으로 구성되어 있습니다.'
