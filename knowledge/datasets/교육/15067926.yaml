description_portal: 해당 데이터는 한국어능력시험(TOPIK)의 시행국가별 및 연령대별 응시자 수를 상세히 제시하고 있으며, 10대 이하부터 60대 이상까지 다양한 연령층의 응시 현황을 국가별로 비교할 수 있도록 구성되어 있습니다. 미리보기 데이터를 통해 과테말라, 대만, 대한민국, 러시아 등 여러 국가의 응시자 수가 구체적으로 나타나 있어, 언어능력 평가의 국제적 확산과 다양한 국가에서의 한국어 학습 열기를 볼 수 있습니다. 이는 과거 데이터와 주기적으로 비교 가능하여 응시자 수 추이 분석에 유용한 자료입니다.한국어능력시험 시행국가별 연령별 응시자 수에 대한 데이터로 나라별, 10대 이하, 20대, 30대, 40대, 50대, 60대 등을 제공합니다.
