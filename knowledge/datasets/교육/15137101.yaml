description_portal: 교원양성기관 현황을 상세히 다루며, 사범대 및 비사범대에서 진행되는 다양한 양성과 재교육 과정을 포함한다. 일반대학의 교육과와 교직과정을 통한 중등학교정교사 자격 취득 과정, 보건교사 및 영양교사 등의 전문 교원 양성도 보고되어 있다. 또한 교육대학원에서는 교육심리, 상담, AI융합교육 등의 재교육 프로그램이 실시되고 있으며, 체육교육과 같은 실기교사 양성과정도 포함되어 다채로운 교사 양성 체계를 보여준다. 해당 자료는 교육 관련 다양한 학과별 자격종별 표시과목과 폐지여부까지 정리하여 교원 양성 및 재교육에 관한 포괄적인 현황 제공한다.2024년도 교원양성기관 현황교육대학교, 사범대학교, 일반대 교육과, 일반대 교직과정, 교육대학원, 실기교사 양성과정, 전문대 교육과, 전문대 교직과정양성, 재교육, 모집단위, 표시과목
