summary_user: 경기도 각급 학교의 급식비 집행 실적을 학교·기준년도 단위로 담고, 교육청·자치단체·학교·보호자·기타 등 부담 주체별 금액과 비율, 합계를 함께 기록한다. 교육재정 분석가나 지자체 담당자가 어느 시군에서 보호자 부담 비율이 높고 자치단체 분담이 낮은지 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 학교명·학교코드(INFO_PBLNTF_SCHOOL_CD)나 시군명·시군코드를 이름·코드 매핑해 학교 기본정보나 지역 통계와 붙여야 한다.
description_portal: 이 데이터는 경기도 내 각급 학교의 급식비 집행 실적을 기준으로, 급식비의 부담 주체별 분담 내역을 정리한 자료입니다. 주요 항목은 기준년도, 시군명, 지역교육청명, 학교명, 설립구분, 교육청 부담금액 및 비율, 자치단체 부담금액 및 비율, 학교 자체 부담금액, 보호자 부담금액 및 기타 부담금액과 그 비율, 그리고 최종 합계금액과 비율 등으로 구성되어 있습니다. 본 자료를 통해 연도별, 시군별, 기관별 급식비 재정 분담 구조를 분석할 수 있으며, 공공지원 확대 현황, 학부모 부담 완화 정도, 지자체의 교육재정 참여 수준 등을 종합적으로 파악할 수 있습니다. 이는 교육복지정책의 수립, 예산 편성 기준 마련, 지역 간 형평성 분석 등에 활용 가능한 교육재정 관련 데이터입니다.
