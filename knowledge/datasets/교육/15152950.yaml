summary_user: 경기도 사이버도서관에 속한 각 도서관이 기준일까지 시스템에 등록한 장서 누적 건수를 도서관별·기준일별로 집계한 자료다. 경기도 안 도서관 사이의 장서 규모를 비교하거나 기준일을 따라 장서 확충 추세를 보려는 분석가·도서관 운영자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도서관명(librry_nm)이나 경기도 자체 도서관코드를 이름·코드로 맞춰야만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 사이버도서관 소속 각 도서관의 장서 등록 누적 건수를 기준일자별로 집계한 자료입니다. 주요 항목은 기준일, 도서관코드, 도서관명, 장서등록누적건수로 구성되어 있으며, 각 도서관이 해당 시점까지 몇 건의 장서를 시스템에 등록했는지를 보여줍니다. ‘기준일’은 데이터를 수집한 날짜를 의미하고, ‘장서등록누적건수’는 도서관이 보유하고 있는 모든 장서의 누적 등록량을 나타냅니다. 이 데이터는 도서관별 장서 보유량의 규모 비교, 장서 확충 추세 분석, 도서관 운영 현황 파악 등 다양한 목적으로 활용할 수 있으며, 지역 간 장서 인프라 격차를 확인하거나 장서 확장 전략 수립에도 유용합니다.
