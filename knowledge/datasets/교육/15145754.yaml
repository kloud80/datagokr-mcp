description_portal: 서울특별시 중랑구 평생교육기관에 대한 정보를 제공합니다. 평생학습이란 개인의 자아실현, 사회적 통합, 경제적인 경쟁력 제고를 통해 삶의 질과 도시 경쟁력을 향상시키고, 언제 어디서나 누구나 학습할 수 있는 학습공동체를 구축하고자 하는 운동입니다. 평생교육기관 데이터에서는 시설유형별로 기관명과 주소, 전화번호 정보를 제공합니다. 시설유형은 도서관, 복지관(아동, 노인, 다문화관련), 문화시설(박물관, 미술관, 과학관 등), 직업훈련시설, 여성관련시설, 청소년시설, 기타(구민/시민회관, 비영리 단체 등)으로 구성되어 있습니다. 자세한 사항은 파일의 내용을 확인하여 주시기 바랍니다. 감사합니다.
