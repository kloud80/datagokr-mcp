summary_user: 경상북도 내 각급 학교(유치원 포함)의 이름, 우편번호, 주소, 교무실 전화번호, 팩스를 학교별 한 행으로 담은 명부 파일이다(약 214KB CSV). 학부모나 민원인이 경북의 특정 학교 연락처와 소재지를 찾거나, 분석가가 경북 학교 목록을 주소 기준으로 정리할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 실측 컬럼에 없어서, 교원·학생 통계나 재정 자료와는 학교명 매칭이나 주소 기반 매핑으로만 이어 쓴다.
description_portal: '경상북도 내 각급 학교의 운영 현황과 관련된 정보를 체계적으로 제공하는 자료입니다. 이 데이터에는 학교명, 학교유형(예: 초등학교, 중학교, 고등학교 등), 설립구분, 소재지 주소, 개교일, 관할 교육지원청, 학급 수, 학생 수, 교직원 수 등 학교의 기본 현황을 파악할 수 있는 다양한 항목이 포함되어 있습니다. 해당 정보는 각 학교 및 교육지원청에서 제출하는 공식 행정자료와 교육행정포털 시스템을 통해 정기적으로 수집되며, 「교육기본법」 및 경상북도교육청 관련 규정에 따라 공식적으로 보유·관리되고 있습니다.이 데이터는 연 1회 이상 정기적으로 갱신되어 최신의 학교 현황을 반영합니다. 학교 현황정보는 교육정책 수립, 학교 배치 및 지원, 학생 배정, 교육자원 관리, 연구 및 분석, 대외 홍보 등 다양한 분야에서 활용됩니다. 특히 지역별 학교 분포와 규모, 교육 수요 예측, 정책 결정 참고자료, 교육기관 평가 등에서 중요한 기반 자료로 활용할 수 있습니다.'
