summary_user: 한국기술교육대학교 일학습병행대학(주로 계약학과)의 온라인교육 홈페이지(OKLMS)에서 개설강좌별 수강 기록을 학년도·학기·교과목·분반 단위로 담은 CSV 파일(약 1.4MB)로, 수강상태·강의 기간·온라인 진도율·이수(패스) 여부·학년이 들어 있다. 일학습병행 교육을 분석하는 연구자나 담당자가 "학기·교과목별로 온라인 진도율과 패스 비율이 어떻게 다른가"를 살피는 데 쓴다. 교과목코드(koreatech_subject_cd)가 실측 조인 키여서 같은 학교의 교과목·강좌 정보와 이어 쓰고, 지역·행정코드는 없어 지역 데이터와는 직접 붙지 않는다.
description_portal: 'ㅇ 학교법인한국기술교육대학교 OKLMS 수강정보해당 자료는 한국기술교육대학교 일학습병행대학(주 사용 대상 : 계약학과)에서 운영중인 온라인교육(LMS) 홈페이지에서 사용되는 개설강좌 별 수강정보입니다.주 사용 대상은 계약학과 대상이며, 일학습병행대학 온라인교육-OKLMS 홈페이지에서 사용되는 개설강좌 별 수강정보는 아래와 같은 데이터 항목을 제공합니다.- 제공항목 : 학년도,학기,교과목코드,분반,수강상태코드,강의시작일자,강의종료일자,온라인 진도율,삭제여부,페스여부,학년* 해당 자료는 강좌 운영지침에 따라 변동될 수 있으며,연간 갱신 예정입니다.'
