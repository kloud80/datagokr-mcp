description_portal: 한국과학창의재단의 AI 교육 선도학교 운영 사업 설문조사 데이터는 전국의 초·중·고등학교를 대상으로 수집된 AI 교육 현황 자료로, 정보교육실을 구축한 학교와 AI 교육 활동을 운영하는 모델학교 등을 폭넓게 포함하고 있습니다. 2021년부터 2023년까지 3년 동안 동일한 기준으로 조사된 시계열 데이터이기 때문에, 코로나19 이후 변화한 교육 환경이나 AI 교육 정책의 실제 영향, 학교 인프라의 개선 흐름 등을 연도별로 비교·분석할 수 있다는 점이 특징입니다. 데이터는 체계적으로 정리되어 있어 품질과 신뢰성이 높으며, 교육 정책 수립부터 에듀테크 제품 개발, 지역·학교 유형별 격차 분석 등 다양한 분야에서 활용 가능성이 큽니다. 더불어 AI 기반 분석이 용이한 형태로 구성되어 있어 예측 모델링, 학교 AI 교육 역량 진단, 정책 효과 분석 등 다양한 연구 목적에 활용될 수 있는 중요한 공공데이터입니다.
