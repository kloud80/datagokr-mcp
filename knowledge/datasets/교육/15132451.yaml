description_portal: '‘한국학중앙연구원_주제어 사전 정보’ 데이터는 한국학 연구에 활용되는 핵심 용어나 개념을 정리하고 이를 체계적으로 분류한 주제어 사전 자료입니다. 이 데이터는 주표제어와 부표제어를 중심으로 구성되어 있으며, 각 주제어는 유형(예: 제도/관청, 인물, 개념용어 등), 시대(조선/조선후기, 고려/고려후기, 근대/일제강점기 등), 분야(정치·법제, 종교·철학, 역사 등)에 따라 분류되어 있습니다. 이를 통해 연구자들은 고문서나 한국사 자료에서 등장하는 용어의 의미와 맥락을 정확히 파악할 수 있으며, 일반 국민도 시대별·분야별 역사 용어에 대한 이해를 넓히는 데 활용할 수 있습니다. 학술연구, 교육, 데이터 분석 등 다양한 분야에서 한국학의 전문성과 접근성을 높이는 데 기여할 수있습니다.'
