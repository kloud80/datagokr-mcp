description_portal: '‘한국학중앙연구원_한국역대인명정보’ 데이터는 한국의 역사 속 인물들에 대한 신상 및 생애 정보를 구조화된 XML 형식으로 정리한 메타데이터입니다. 이 데이터는 한국의 역사를 기록한 주요 문헌(예: 실록, 승정원일기, 족보 등)과 개인 문집 등에서 확인되는 인물들의 주요 정보를 수록하고 있으며, 성명, 자(字), 호(號), 생몰연대, 출신 지역, 활동 분야, 관련 문헌 등의 항목을 포함하고 있습니다.본 데이터는 DB 구축, 디지털 인물사전 편찬 등을 위한 기초자료로 자유롭게 활용될 수 있으며 , 한국사 및 전통지식정보의 디지털 자산화를 위한 핵심 기반자료로서 유용합니다.'
