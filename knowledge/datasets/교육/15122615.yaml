summary_user: 한국기술교육대학교 일학습병행대학 온라인교육(OKLMS)에 개설된 교과목을 학년도·학기·교과목·분반 단위로 담은 건별 목록으로, 학과·운영학년·이수학점·강의/실험실습 시수·훈련시간·NCS 여부 등을 함께 싣는다(CSV 약 1.4MB). 계약학과 재학생이나 일학습병행 담당자, 직업교육 분석가가 '어느 학과에서 어떤 NCS 기반 과목이 몇 학점·몇 시간으로 열리는가'를 확인하는 데 쓴다. 교과목코드(koreatech_subject_cd)가 조인 키로 확인되어 같은 대학의 다른 학사·강의 자료와 이을 때 쓰고, 학과번호·강의실코드는 대학 내부 코드라 외부 코드표와 바로 맞물리지 않는다.
description_portal: 'ㅇ 학교법인한국기술교육대학교 OKLMS 개설과과목 및 세부정보해당 자료는 한국기술교육대학교 일학습병행대학(주 사용 대상 : 계약학과)에서 운영중인 온라인교육(LMS) 홈페이지내 개설과과목 및 세부정보입니다.주 사용 대상은 한기대 내 계약학과 대상이며, 한국기술교육대학교 일학습병행대학 온라인교육(LMS) 홈페이지 개설과과목 및 세부정보는 아래와 같은 데이터 항목을 제공합니다.- 제공항목 : 학년도,학기,교과목코드,분반,과목타입,개설교과명,학과번호,학과명,운영학년,학점사용여부,이수학점,강의시수 등* 해당 자료는 강좌 운영지침에 따라 변동될 수 있으며,연간 갱신 예정입니다.'
