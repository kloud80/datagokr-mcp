summary_user: 서울특별시강동송파교육지원청 관내(강동구·송파구) 학교를 한 행에 한 학교씩 담은 목록 파일로, 지역·설립구분·학교명·대표 전화번호·도로명 주소·홈페이지를 제공한다. 학부모나 주민이 "송파구에 있는 공립·사립 학교는 어디이고 연락처·주소는 무엇인가"를 확인하거나, 분석가가 두 자치구 학교 분포를 주소 단위로 정리할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 교원·학생 통계나 학교 재정 데이터와는 학교명·주소를 맞춰 이어야 한다.
