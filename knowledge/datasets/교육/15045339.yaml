description_portal: '제주특별자치도 내에 소재하고 있는 국제학교와 관련한 데이터를 제공합니다.항목: 학교명, 위치, 대지면적, 대상, 형태, 상세, 개교일 등*제주영어교육도시 조성사업은 해외유학 어학연수로 인한 외화 유출을 억제하고 교육 분야 국제경쟁력 강화를 위해 제주 국제자유도시와 대한민국 정부가 추진하고 있는 국가 핵심 프로젝트 *세계 명문 교육기관을 유치하여 국내에서도 세계 최고의 교육 서비스를 제공함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/edu/eng/school/kis/guide.htm'
