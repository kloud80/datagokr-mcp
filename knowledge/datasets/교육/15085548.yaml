description_portal: '○ 통계개요* 통계명 : 사설학원 및 독서실* 통계종류 : 서울시 사설학원 및 독서실 현황을 제공하는 지정ㆍ보고통계* 조사대상 : 시도별 교육지원청 소속 사설학원* 작성목적 : 우리나라 교육현황 전반에 대한 과학적ㆍ종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획·시행·평가·연구 등에 주요 정보를 제공, 국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 학교 → 구 교육청 → 서울특별시 교육청 → 한국교육개발원* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 사설학원의 학원수 및 수강자수, 독서실의 독서실수 및 열람실수 등○ 용어설명* 사설학원수 : 학원의설립·운영 및 과외교습에 관한 법률에 의거 등록된 학원 수(직업기술, 국제실무, 인문, 사회, 경영실무, 예능, 입시 검증 및 보충학습 분야의 학원을 포함)* 학교교과교습학원:「유아교육법」 제2조제1호에 따른 유아 또는 「장애인 등에 대한 특수교육법」 제15조제1항 각 호의 어느 하나에해당하는 장애가 있는 자를 대상으로 교습하거나「초중등교육법」제23조제3항에 따른 학교교과과정을 교습하는 학원** 입시검정 및 보습 : 초등학교·중학교·고등학교의 교육과정에 속하는 교과로서 예·체능계 및 실업계 고등학교의 전문교과 제외** 국제화: 보등교과에 속하는 않는 교과로서 유아 또는초등학교·중학교·고등학교 학생을 주된 교습대상으로 하는 실용외국어** 예능: 음악, 미술, 무용** 특수교육: 특수학교 교육과정에 속하는 교과 및 치료교육 활동** 종합: 구분이 2개 이상 해당되는 학원** 기타: 유아교육법 제2조제1호에 해당하는 교습대상으로 교습을 하거나 같은 호에 해당하는 교육과정을 교습하는 학원* 평생직업교육학원: 학교교과교습학원에 따른 학원 외에 평생교육이나 직업교육을 목적으로 하는 학원** 국제화: 성인대상 어학, 통역, 번역** 직업기술 : 산업기반기술, 산업응용기술, 산업서비스, 일반서비'
