description_portal: 이 엑셀 파일은 국제 과학관 협회와 주요 해외 과학관 정보를 체계적으로 수록한 공공 데이터입니다. 과학관명, 위치, 주제분류(협회/과학관), 공식 홈페이지 URL, 협회별 PDF 자료 링크 등 다섯 개 필드를 제공합니다.파일에는 ASPAC(아태과학관협회), ASTC(미국과학관협회), ECSITE(유럽과학관협회), ICOM(국제박물관협의회), SCWC(세계과학관대회), UNESCO(유네스코한국위원회) 등 글로벌 네트워크 협회와 러시아 고생물학회, 중국 과학기술박물관, 일본 국립과학박물관, 스웨덴 기술박물관, 영국 과학·자연사박물관, 태국 과학관 등 대표 기관을 망라합니다. 메타데이터는 표준화된 형식으로 구성되어 통계 분석 및 시각화 도구와 호환되며, 주기적 업데이트로 최신 현황을 반영합니다. 연구·교육 자료로 활용하거나 전시 기획, 관광 콘텐츠 개발, 문화 정책 수립 시 기초 정보로 적합합니다.
