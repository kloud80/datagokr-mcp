summary_user: 독도체험관이 제공하는 교육·체험 자료를 자료 한 건당 한 행으로 정리한 목록으로, 일련번호, 자료 제목(학습 대상·프로그램 유형·주제 포함), 첨부파일 형태(pdf, jpg, zip, 외부 링크 등)를 담은 작은 파일(약 1.9KB)이다. 교사나 체험 프로그램 기획자가 '초등 수업에 쓸 독도 학습지나 AR·메타버스 체험 자료가 있는지, 어떤 형식으로 받을 수 있는지' 확인할 때 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 데이터와는 자료 제목 등 이름 매핑으로만 느슨하게 이어 쓸 수 있다.
description_portal: 이 데이터는 독도체험관에서 제공하는 교육·체험 자료 목록을 정리한 자료로, 각 행에 일련 번호(번호), 자료 제목, 첨부파일 형태 정보를 담고 있습니다. 자료 제목에는 학습 대상(미취학, 초등·중·고 등), 프로그램 유형(학습지, 교육 영상, AR 체험, 메타버스 체험, 만들기 자료 등)과 주제(역사, 자연, 자유학기제 연계 프로그램 등)에 관한 정보가 함께 기술되어 있습니다. ‘첨부파일 형태’ 항목에는 pdf, jpg, zip, link, pdf/ppt, pdf/link 등 제공 형식이 표기되어 있어 인쇄용 자료, 이미지 자료, 압축 패키지, 외부 온라인 콘텐츠 등 자료 유형을 구분할 수 있습니다. 이를 통해 독도 관련 교육자료 현황을 한눈에 파악하고, 학교 수업 활용 자료 구성, 체험 프로그램 설계, 디지털 교육콘텐츠 관리 및 업데이트 계획 수립 등을 위한 기초 데이터로 활용할 수 있습니다.
