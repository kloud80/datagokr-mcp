summary_user: 서울 서부교육지원청 관내(은평구·서대문구·마포구) 유치원·초등학교·중학교·고등학교를 학교 한 곳당 한 행으로 담은 명단 파일로, 행정구역·학제·학교명·본분교 구분·설립유형·주소·전화번호를 담는다. 학부모나 분석가가 '마포구에 있는 공립 중학교는 어디이고 연락처는 무엇인가' 같은 질문에 답하거나, 관내 학교 분포를 구·학제·설립유형별로 세는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서 다른 학교 통계·재정 데이터와는 학교명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '본 데이터는 2026년 6월 기준 서울특별시 서부교육지원청 관내 학교 현황 자료입니다.1. 대상지역: 은평구, 서대문구, 마포구2. 자료제공 범위: 유치원, 초등학교, 중학교, 고등학교 현황3. 내용: 행정구역, 학제, 학교명, 설립유형, 주소, 연락처4. 폐교 목록은 제공되지 않습니다.5. 제공 데이터는 1년 주기로 업데이트 됩니다.'
