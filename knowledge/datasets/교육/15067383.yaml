summary_user: KOCW(Korea OpenCourseWare)에 국내 대학이 등록한 예술·체육 분야 강의를 강의 한 건당 한 행으로 담은 목록으로, 대분류·중분류, 강의명, 대학, 교수, 학년학기, 학습자원 언어, 라이선스, 등록일시, 바로가기 주소를 포함한다(CSV 약 12만 바이트). 학습자나 교수자가 '어느 대학에서 어떤 무용·음악·체육 강의를 공개해 두었고 바로 들을 수 있는 주소는 어디인가'를 찾거나, 분석가가 예술체육 공개강의의 대학별·분야별 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 KOCW 분야별 강의 목록이나 대학 정보와는 대학명·전공분류 같은 이름 매핑으로만 이어 쓴다.
description_portal: 제공하는 데이터는 고등교육 교수학습자료 공동활용 체계인 KOCW(Korea OpenCourseWare)를 통해 국내 대학에서 개설된 예술 및 체육 분야 강의의 목록 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 강의명, 대학명, 교수명, 전공분류, 강의개요, 강의구분, 학년·학기 등 예술·체육 관련 강의의 주요 정보가 포함되어 있습니다. 각 대학 및 교수진이 KOCW 플랫폼에 직접 등록한 강의 정보를 기반으로 하며, 연 1회 정기적으로 데이터가 갱신됩니다. 데이터의 보유 및 제공 근거는 고등교육 혁신과 교수학습자료 공동 활용 촉진을 위한 관련 법령과 정책에 있습니다. 이 데이터는 예술체육 분야 대학 강의 현황 분석, 교육과정 비교, 교육정책 수립, 교수학습자료 개발, 학습자 맞춤형 강의 추천, 연구 및 통계, 온라인 교육 서비스 개발 등 다양한 분야에서 활용될 수 있습니다. 강의 형태에 따라 일부 강의는 학년·학기 정보가 공란으로 표기될 수 있습니다.
