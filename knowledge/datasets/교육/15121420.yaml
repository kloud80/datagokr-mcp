description_portal: 인천시는  시민 누구나 디지털 혜택을 누릴 수 있도록   디지털 역량강화 교육 사업을 추진하고 있습니다.  디지털 역량이 부족한 지역 주민들을 위한 교육을 제공할 뿐만 아니라 일상적인 디지털활용에 어려움을 느낄 때 언제든 찾아와 도움을 받을 수 있도록 지원합니다.<활용 목적>이 자료는 시민들이 거주지 근처의 디지털 교육 시설을 쉽게 찾고 교육 참여 기회를 확대하는 데 사용됩니다. 행정적으로는 지역별/계층별 디지털 교육 수요를 파악하여 배움터의 균형 있는 설치 및 운영을 위한 정책 수립의 기초 자료로 활용됩니다.인천시민의 디지털 역량 강화 및 정보 격차 해소 사업 운영을 위한 핵심 기반 정보입니다.
