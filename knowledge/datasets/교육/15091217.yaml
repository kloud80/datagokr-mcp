description_portal: 한국과학창의재단은 기업, 대학, 공공기관 등이 보유한 인적·물적 자원을 유·초·중등 교육 활동에 활용할 수 있도록 연계하는 교육기부 프로그램을 운영하고 있습니다. 이는 사회가 함께 아이들을 키우는 나눔 문화를 조성하고, 학생들에게는 교실 밖의 다양하고 창의적인 학습 경험을 제공하기 위함입니다.개방 데이터는 2021년부터 2023년까지 운영되는 147건의 교육기부 프로그램 목록입니다. 데이터는 프로그램을 제공하는 기관의 유형(기업, 대학, 단체 등), 기관명, 프로그램명, 모집 대상, 기부 분야(창의적체험활동, 자유학기제 등), 주제, 운영 지역 및 기간 등의 상세 정보를 포함하고 있습니다.전국의 유·초·중·고등학교에서는 본 데이터를 활용하여 학생들에게 필요한 맞춤형 체험학습, 진로체험, 교과연계 프로그램을 무료로 신청하고 교육과정을 풍성하게 만들 수 있습니다. 교육기부 참여를 희망하는 기관 및 단체는 기존 프로그램들을 참고하여 사회공헌 활동을 기획할 수 있으며, 교육 연구자들은 교육기부 현황 분석을 통한 정책 연구에 활용할 수 있습니다.
