description_portal: 이 데이터는 서울연구원이 발간한 서울 인포그래픽스 시리즈 중 일부 자료로, 서울의 사회 변화와 시민 삶의 양상을 시각적으로 보여주기 위해 제작된 것입니다. 각 항목은 제목, 작성일, 출처 URL, 이용 권한, 설명, 자료 유형 등으로 구성되어 있으며, 인포그래픽을 통해 시민들에게 이해하기 쉽고 직관적으로 전달됩니다. 주요 주제로는 젊은 세대의 ‘갓생’ 문화, 새해 첫날 해돋이 명소 방문, 1인 가구의 삶과 행복지수·사회관계 등이 포함됩니다. 이 데이터는 사회적 트렌드와 생활 변화를 수치와 그래픽 자료로 보여주어 정책 수립과 사회 연구에 기초 자료로 활용될 수 있습니다.
