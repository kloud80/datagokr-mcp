summary_user: 대구광역시 달성군 안의 유치원·초·중·고 등 각급 학교를 한 행에 한 학교씩 담은 목록 파일로, 학교명과 지번·도로명 주소, 우편번호, 교무실·행정실·팩스 번호, 홈페이지 주소, 위도·경도를 담는다(약 10KB CSV). 주민이나 분석가가 '달성군 우리 동네 근처에 어떤 학교가 있고 연락처는 무엇인가'를 확인하거나 학교 분포를 지도에 찍을 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 자료와는 학교명 매칭으로 잇고, 위도·경도와 주소로 행정구역·시설 등 공간 자료와 겹쳐 쓴다.
description_portal: 유치원, 초등학교, 중학교, 고등학교 등 각급 학교의 기본 현황 정보를 정리한 자료로, 학교의 명칭, 위치, 설립 유형, 학교급 등 교육 행정 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 학교의 분포 현황과 교육시설 현황을 종합적으로 파악하기 위한 기초자료로 활용된다.또한 학교 현황에 대한 체계적인 관리를 통해 교육시설 운영 실태를 분석하고, 교육 환경 개선과 교육 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 교육시설 관리, 관련 행정 업무 수행, 민원 대응 및 각종 교육 통계 산출을 위한 참고 자료로 활용된다.아울러 지역 내 교육 인프라 현황을 파악하고, 교육 여건 개선과 공공 교육서비스 제공을 위한 정책 추진의 기초자료로 활용되며, 지속적인 교육 행정 관리 및 공공시설 운영을 위한 행정자료로 활용된다.
