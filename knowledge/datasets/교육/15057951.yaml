summary_user: 경기도 내 유료직업소개소를 사업장 한 곳당 한 건으로 담은 인허가 원천 목록으로, 사업장명·인허가일자·영업상태·폐업일자·전화번호와 도로명·지번 주소, WGS84 위경도 좌표를 포함한다. 구직자가 우리 동네에서 현재 영업 중인 유료직업소개소를 찾거나, 분석가가 시군별 소개소 분포와 폐업 추이를 살피는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)나 주소·사업장명을 맞춰 다른 경기도 데이터와 잇고, 좌표로 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 유료직업소개소의 운영 현황을 정리한 자료로, 각 사업장의 인허가일자, 영업상태, 폐업일자 등 행정 정보를 포함하고 있으며, 사업장별 위치정보와 좌표(X, Y 및 WGS84 위도·경도)도 함께 제공됩니다. '영업중', '폐업', '폐업 등', '운영중' 등 다양한 영업상태를 통해 각 소개소의 활동 여부를 구분할 수 있으며, 소재지에 대한 도로명주소 및 지번주소는 위치기반 서비스나 공간분석에 활용될 수 있습니다. 이 데이터는 직업중개서비스의 지역 분포, 영업 지속성 분석, 구직자 대상 안내 서비스 개발, 행정관리 등에서 활용될 수 있으며, 향후 취업정보 전달체계 개선이나 고용서비스의 지역별 수요 예측에도 유용합니다.
