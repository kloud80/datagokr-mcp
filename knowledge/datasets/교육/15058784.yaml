summary_user: 경기도 내 학교별 급식 실시 현황을 기준년도·학교 단위로 담으며, 급식 종류, 직영·위탁 구분과 위탁업체명, 전체 학생 수 대비 급식 학생 수와 급식비율, 영양교사·조리사·조리원 수, 식당·교실 배식 장소 여부를 포함한다. 학부모나 교육·보건 정책 분석가가 '우리 시군의 학교들은 직영인지 위탁인지, 학생 수 대비 조리 인력은 충분한가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군명·학교명 같은 이름이나 같은 기관(경기도) 코드로 매핑해서만 다른 학교 기본정보·학생 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 학교들의 급식 실시 현황을 수록한 자료로, 학교급별·설립구분별로 급식 운영 방식과 참여 현황을 보여줍니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분, 급식종류, 급식학생 수와 전체 학생 수 대비 급식비율(%)이 포함됩니다. 또한 급식 인력인 영양교사, 조리사, 조리원 수가 제공됩니다. 일부 학교는 일부 위탁 또는 전체 위탁업체명을 함께 제공하여 급식 운영 형태의 차이를 확인할 수 있습니다. 이 데이터는 학교급식 운영 현황 분석, 영양 인력 배치 적정성 검토, 급식 참여율 평가, 직영·위탁 급식의 운영 차이 비교, 지역별 학교급식 환경 분석 등 다양한 교육·보건 정책 수립의 기초자료로 활용될 수 있습니다.
