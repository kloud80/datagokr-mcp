summary_user: 인천광역시교육청 관할에서 문을 닫은 학교 한 곳마다 폐교명, 폐교년도, 소재지 주소, 토지·건물 면적, 대부 시작·종료 기간을 한 행으로 담은 건별 파일이다(CSV 약 1.5KB로 소규모). 폐교 부지를 임대하거나 공공시설로 바꾸려는 사업자·지자체 담당자가 "인천에서 지금 대부 중이거나 곧 대부가 끝나는 폐교는 어디이고 면적은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 폐교명이나 소재지 주소를 학교 기본정보·주소 데이터와 이름 매칭해 붙여 쓰고, 구도심 쇠퇴나 통폐합 흐름을 볼 때 학교 신설·통폐합 자료와 함께 본다.
description_portal: '"인천광역시교육청_폐교재산관리현황" 데이터는 인천광역시교육청 관할 내 폐교된 학교의 재산 현황을 종합적으로 제공하는 자료입니다. 주요 제공 정보는 폐교명, 소재지 주소, 폐교일, 재산의 종류(토지, 건물 등), 재산의 면적, 현재 재산의 활용 현황(임대, 매각, 공공 활용 등), 관리 주체 등입니다. 이 데이터는 인천광역시교육청이 각급 학교 및 관련 부서로부터 정기적으로 제출받는 공식 자료와 현장 실태조사를 바탕으로 수집·정리합니다. 데이터의 보유 및 제공 근거는 「국유재산법」, 「공유재산 및 물품 관리법」, 「초·중등교육법」 등 관련 법령과 교육청 내부 지침에 있습니다. 데이터는 폐교 발생, 재산 활용 현황 변동, 재산 매각 또는 임대 등 주요 변동사항이 있을 때마다 정기적으로 업데이트됩니다.이 자료는 폐교 재산의 효율적 관리, 공공자산 활용, 지역사회 시설 전환, 임대·매각 등 행정 업무 지원, 정책 수립 및 연구, 지역개발 및 도시재생 사업 등 다양한 분야에서 활용됩니다.'
