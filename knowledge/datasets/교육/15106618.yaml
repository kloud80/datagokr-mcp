description_portal: 경상북도교육청 상주도서관에서는 지역 주민 여러분의 평생학습 기회를 확대하고, 더 풍요롭고 의미 있는 삶을 영위하실 수 있도록 2025년도 상반기 평생교육 프로그램을 다채롭게 준비하였습니다. 이번 강좌는 교양, 취미, 실생활에 도움이 되는 다양한 분야로 구성되어 있으며, 연령과 관심사에 따라 누구나 자유롭게 참여하실 수 있도록 기획되었습니다.상반기 평생강좌에 대한 자세한 일정, 모집 인원, 강의실 등 구체적인 정보는 상주도서관 누리집에 게시되어 있으며, 신청 또한 누리집을 통해 간편하게 온라인으로 접수하실 수 있습니다.여러분의 지적 호기심을 채우고, 일상에 활력을 더할 소중한 배움의 시간이 될 이번 프로그램에 많은 분들의 관심과 참여를 부탁드립니다.
