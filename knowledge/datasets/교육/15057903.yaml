summary_user: 경기도 초등학교별로 기준년도·시군·지역교육청·설립구분과 함께 표시과목(교과, 국어, 수학, 과학, 사회, 체육, 음악 등)별 남녀 교원 수와 합계를 담은 학교 단위 집계 자료다. 교육청 담당자나 분석가가 "어느 시군·교육지원청에서 특정 과목 교사가 부족하거나 성비가 한쪽으로 치우쳤는가"를 연도별로 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)나 학교명·시군 코드를 이름·코드 매핑해 같은 기관의 학생·학급 통계나 학교 기본정보와 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 초등학교 교원 현황을 표시과목별로 구분하여 정리한 자료로, 교사 인력의 배치와 분포를 파악하는 데 활용됩니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분(공립/사립), 교사 성별 및 과목별 교원 수가 포함되어 있습니다. 이를 통해 특정 연도와 지역별로 교원의 성별 비율, 과목별 교사 수급 현황, 학교급별 인력 분포를 확인할 수 있습니다. 또한 데이터는 지역 간 교원 자원 불균형 분석, 성별 및 과목별 교사 수요 예측, 교원 정책 수립, 교육자원 배분의 근거 자료로 활용될 수 있습니다.
team:
  dept: AI미래행정과
