summary_user: 2025년 기준 전국 국·공·사립대학(전문대·원격대 포함)의 교육용 건물 현황을 대학별로 담은 엑셀 파일(xlsx)로, 포털 설명상 건물의 면적·용도·층수·준공연도가 들어 있다. 교육정책 분석가나 대학 관계자가 '우리 대학의 교육용 건물 규모와 노후도가 비슷한 대학들과 비교해 어느 수준인가'처럼 교사 확보율 산출 근거나 대학 간 시설 인프라 비교를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 대학알리미·대학재정알리미의 학생·교원·재정 자료와는 대학명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 2025년 기준 국·공·사립 및 전문대학의 교육용 건물 현황을 수록한 자료로, 각 대학의 교사 확보율 산출 시 핵심 기초자료로 활용됩니다. 대학별 교육용 건물의 면적, 용도, 층수, 준공연도 등의 정보를 포함하고 있으며, 이는 대학이 제출한 자료를 기반으로 하는 한국사학진흥재단이 수행하는 고등교육기관 정보공시 업무의 정확성과 신뢰도를 높이는 데 기여합니다. 해당 데이터는 교육시설의 적정성 평가, 대학 간 인프라 비교, 재정지원 사업 타당성 검토 등 다양한 정책적 판단의 기준으로 활용할 수 있습니다.
