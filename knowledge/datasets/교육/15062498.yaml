summary_user: 경상남도 교육청과 그 소속 기관의 명칭, 시군구, 도로명주소, 전화·팩스, 홈페이지, 대표자 정보를 기관 한 곳당 한 건씩 담은 개별 목록이며 범위는 경상남도 한 시도다. 학부모나 민원인이 우리 시군의 교육지원청 주소와 연락처를 찾거나, 분석가가 경남 교육행정기관 위치를 지도에 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 학교 기본정보나 교육 통계·재정 데이터와는 기관명·시군구 이름 매칭이나 같은 기관 내부 코드(entid)로만 이어 붙인다.
