summary_user: 전남광주통합특별시교육청(옛 전라남도교육청) 관내 교원·공무원용 관사를 관리기관·관사 단위로 정리한 파일로, 지역·학교급·건축연도·건물형태·동수·세대수와 활용·미활용 세대수, 미활용 사유를 담는다. 교육행정 담당자나 분석가가 '어느 지역 관사가 오래됐고 비어 있는 세대가 얼마나 되며 왜 비어 있나'를 따져 관사 수급과 정비 대상을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 학교 기본정보나 교원 통계와는 관사관리기관명(학교·교육지원청 이름)이나 지역명을 맞춰 붙여야 한다.
description_portal: '"전라남도교육청_관사현황" 데이터는 전라남도교육청이 관내 교원 및 공무원에게 제공하는 관사의 현황을 종합적으로 제공하는 공공데이터입니다. 이 데이터에는 관사명, 읍면동 기준의 소재지, 관사 유형, 관사 수, 현재 입주 현황, 미활용 사유 등 관사 관리와 운영에 필요한 주요 정보가 포함되어 있습니다. 특히, 교원이 실제로 거주 중인 관사도 포함되어 있으나, 개인정보 보호를 위해 주소 정보는 읍면동 단위까지만 제공합니다.관사 현황 자료는 각 학교와 교육지원청에서 분기별 또는 월간으로 제출하는 공식 자료를 바탕으로 수집되며, 「공유재산 및 물품관리법」, 「초·중등교육법」 등 관련 법령에 근거해 보유 및 제공됩니다. 데이터는 정기적으로 갱신되어, 관사의 신설, 폐지, 입주 현황 변동 등 최신 정보를 반영합니다.이 데이터는 행정기관의 관사 관리, 교원 및 공무원 주거 지원 정책 수립, 지역별 관사 수급 현황 분석, 연구기관의 교육 인프라 분석, 언론 및 지역사회의 교육환경 보도 등 다양한 분야에서 활용됩니다. 또한, 관사 미활용 사유와 입주 현황 등은 관사의 효율적 운영과 자원 배분, 향후 정책 개선의 기초자료로도 중요하게 쓰입니다.이처럼 "전라남도교육청_관사현황" 데이터는 교원 및 공무원의 복지 향상과 공공자산의 효율적 관리, 교육환경 개선에 기여하는 핵심 공공정보입니다'
