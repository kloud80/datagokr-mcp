description_portal: 이 데이터는 세종시교육청 홈페이지에서 관리하는 자치법규 공포 현황을 정리한 자료입니다. 자치법규의 순번과 공포 일시, 자치법규 명칭, 자치법규 원문 링크(URL) 등이 포함되어 있어 법규의 체계와 시점을 알 수 있습니다.또한 자치법규코드1레벨은 조례·규칙 등 법규의 기본 유형을 구분하고, 자치법규코드2레벨은 교육·재정·행정 등 분야별로 세분화한 분류 코드입니다. 자치법규공포대분류타입은 제정·개정 등 공포 행위의 유형, 자치법규공포중분류번호와 소분류번호는 법규 공포 건별 식별 및 조회를 위한 관리 번호를 의미합니다.등록 아이디와 등록일시 등 관리 항목도 기록되어 있어 법규 공표 관리 이력 추적이 가능합니다. 이를 통해 교육청 소관 자치법규의 제정·개정 현황을 체계적으로 파악할 수 있으며, 정책 담당자, 연구자, 시민 모두 법규 정보를 확인하고 행정 활용이나 연구 분석 자료로 활용할 수 있습니다.
