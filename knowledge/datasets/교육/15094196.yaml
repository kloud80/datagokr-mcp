description_portal: 한국사학진흥재단_대학별 미사용 토지 비율은 한국사학진흥재단의 대학 교육시설 현황 집계를 통해 산출된 자료로, 국공사립대학별 미사용 토지 현황 자료를 확인할 수 있습니다.대학별 미사용 토지 비율 파악을 위해 대학별 전체 교육용 토지 면적과 미사용 토지 면적을 제공하고, 이에 따른 교육용 토지 중 미사용 토지 비율을 산출하여 제공합니다.해당 자료는 설립구분(국립, 공립, 사립), 학교, 지역, 캠퍼스, 학급, 학종별로 확인이 가능합니다.또한, 대학별 미사용 토지 비율 데이터는 해당 링크에서 조사연도별로 확인이 가능하며, 엑셀파일의 형식으로 다운로드 가능합니다.
