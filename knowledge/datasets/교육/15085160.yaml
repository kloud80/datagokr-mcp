description_portal: '○ 통계개요* 통계명 : 학업성취수준 비율* 통계종류 : 서울시 학업성취도 평가 결과 현황을 제공하는 일반ㆍ조사통계* 작성목적 : 국가에서 정한 교육과정에 근거해 학생들의 교육목표 달성 정도를 평가하는준거참조평가로, 국가수준에서 학생들의 학업성취도 현황 및 변화 추이를파악하여 학교교육의 질을 체계적으로 관리하기 위함* 공표주기 : 정기(1년)* 공표범위 : 지역 - 서울시내용 - 국어, 영어, 수학 학업성취도 평가 지표○ 용어설명* 학업성취도 : 국민공통기본교육과정이 적용되는 중3, 고2를 대상으로 학업성취 수준을평가한 결과* 기초학력미달 : 국가수준 학업성취도 평가에서 전체 중학교 3학년, 고등학교 2학년 학생중 ‘기초학력미달’로 판정된 학생의 비율임. 기초학력미달 기준은 국어,수학, 영어 과목에서 목표성취수준의 20% 이상을 달성하지 못한 경우임'
