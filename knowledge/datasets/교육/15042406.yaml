summary_user: 한국방송통신전파진흥원이 시행하는 국가기술자격검정의 2022년도 기준 집계 통계로, 전파전자통신기사·무선설비기사 등 종목별·성별로 필기와 실기의 접수자·응시자·합격자 수와 합격률을 담는다. 수험생이 응시할 종목의 난이도를 가늠하거나, 정책 연구자가 "방송통신 분야 기사 시험의 실기 합격률은 종목별로 얼마이고 남녀 차이가 있는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자격 통계나 시험 일정 데이터와는 종목명(종목)을 이름으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 한국방송통신전파진흥원에서 시행하는 국가기술자격검정 통계 자료입니다. 해당 자료는 2022년도 기준으로 자격종목과 성별에 따른 필기/실기 접수자 수 · 응시자 수 · 합격자 수 그리고 합격률을 보여줍니다. 해당 자료를 통해 자격검정 운영성과와 합격률 추이를 분석할 수 있습니다. 전파전자통신기사, 무선설비기사 등 한국방송통신전파진흥원에서 주관하는 18개의 국가기술자격검정 현황을 파악할 수 있으며 , 각 종목별 합격 통계를 통해 산업별 기술인력 수급 현황을 파악하는데 도움을 줄 수 있습니다. 본 자료는 자격정책 수립, 직무능력 분석, 기술인력 양성계획 등 공공 및 민간의 인력관리 정책 연구 등에 활용될 수 있습니다. 데이터는 국가기술자격 운영의 투명성과 통계적 신뢰성을 확보하기 위한 기초자료로서 제공됩니다.
