summary_user: 대전동부교육지원청 관할 초·중·고등학교를 학교 한 곳당 한 행으로 담은 명부로, 학교명·학교구분·설립구분(공립/사립)·주소·우편번호·전화·팩스·홈페이지를 담는다(약 32KB CSV 파일). 학부모나 분석가가 "대전 동구·대덕구 쪽 공립 중학교는 어디에 있고 연락처는 무엇인가" 같은 질문에 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학생·교원·학급 통계나 재정 데이터와는 학교명·주소를 매칭해 이어 써야 한다.
description_portal: 대전광역시 동부교육지원청 관할 하에 있는 초·중·고등학교의 운영 현황을 상세히 제공하는 공공데이터입니다. 이 데이터에는 각 학교의 명칭, 설립 유형(공립/사립), 소재지, 홈페이지 주소 등이 포함되어 있습니다.데이터는 대전동부교육지원청 산하의 각 학교에서 제출한 자료를 바탕으로 수집되며, 교육행정정보시스템(NEIS)과 학교 자체 보고서를 통해 정기적으로 갱신됩니다. 해당 데이터는 매년 업데이트 됩니다.이 데이터는 학부모와 학생들이 학교 선택 시 참고할 수 있는 유용한 정보를 제공하며, 교육 정책 담당자들이 지역별 교육 자원 배분 및 프로그램 개선 방향을 설정하는 데 중요한 기초 자료로 활용될 수 있습니다. 또한, 연구기관이나 교육 관련 기업들이 교육 서비스 개발 및 평가에 참고할 수 있습니다.
