description_portal: '이 데이터는 경상북도 김천시 관내에 설치·운영 중인 작은도서관(작은 규모의 공공도서관)에 대한 현황 자료입니다.작은도서관은 지역 주민에게 생활권 내 독서 및 문화 향유 기회를 제공하는 생활밀착형 문화시설로,본 데이터는 각 도서관의 명칭, 도로명 주소, 지번 주소, 위도·경도 좌표, 시설면적, 전화번호 등의 세부 정보를 포함하고 있습니다.자료는 공공도서관 정책 수립, 지역 독서문화 진흥 사업, 생활 SOC 시설 지도화, 문화시설 분포분석, 위치기반 서비스(GIS) 구축 등에 활용됩니다.유의사항 : 면적은 건물 전체 면적이 아닌 도서관 전용공간 기준이며, 실측 시 차이가 발생할 수 있습니다.                   전화번호과 누락되거나 변경될 수 있습니다.'
