summary_user: 전국 발명교육센터를 센터 한 곳당 한 행으로 정리한 현황 파일로, 소속 교육청(17개 시도), 센터명, 운영 기관명, 우편번호가 붙은 주소, 일반전화를 담는다. 학부모나 교사가 우리 지역 교육청 관할에 어떤 발명교육센터가 있고 어디로 연락하면 되는지 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 교육청명·기관명 같은 이름이나 주소를 직접 맞춰 이어야 한다.
description_portal: 발명분야에 흥미와 창의적 잠재력을 갖춘 창의인재 조기 육성 및 발굴을 위한 창의발명교육프로그램의 현장적용 가능한 전국 발명교육센터 현황에 대한 안내 파일 입니다.해당 정보는 교육청, 센터명, 기관명, (우편번호)주소, 일반전화 의 데이터를 포함하고 있으며, 전국에 위치한 발명교육센터의 현황에 대해 안내하고 있습니다.각 교육청은 '서울특별시, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 세종특별자치시, 경기도, 강원도, 충청북도, 충청남도, 전라북도, 전라남도, 경상북도, 경상남도, 제주특별자치도' 로 구분되어 있으며, 교육센터는 해당 교육청에 소속된 형태로 표시되어 있습니다. 기관명과 센터명이 동일한 경우도 있지만 각 기관과 센터의 명칭이 다른 경우도 있어 기관 명칭과 센터 명칭이 따로 표시되었습니다.
