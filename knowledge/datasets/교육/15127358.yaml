description_portal: 세종학당재단이 보유 중인 국가별 세종학당 수강생 수 현황입니다. 현재 연도별로 정리되어 있으며 총 2021부터 2025년까지의 학당별 수강생 수 데이터 현황입니다.해당 자료는 국외 운영 중인 세종학당의 수강생 수 현황으로 실제 현장 수업에 등록 및 참여하여 수강하고 있는 수강생 수 관련 데이터 입니다.각 연도별로 운영 중인 세종학당의 수강생 수를 나타내며 연도별로 수강생 수는 다릅니다.해당 수강생 수를 통해 국가별로 한국어 및 한국문화에 대한 관심과 열정, 학습 참여 정도를 알 수 있으며 이를 통해 국가별 한국어 및 한국문화 수요를 간접적으로 파악이 가능합니다.
