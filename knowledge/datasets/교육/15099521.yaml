summary_user: 전국 학교와 그 학교가 속한 학구를 잇는 연계표로, 한 행마다 학구ID·학교ID·학교명·학교급과 관할 시도교육청·교육지원청, 데이터 기준일자를 담는다. 주택 수요자나 부동산·교육 분석가가 '이 아파트가 속한 학구는 어느 학교에 배정되는가'를 확인할 때 학구와 학교를 맞대는 데 쓴다. 학교ID(school_cd)로 학교 기본정보 데이터와 잇고, 학구ID로 같은 기관의 학구도 경계 데이터와 이어 쓰며, 시도교육청·교육지원청 코드로 관할별 집계에 쓴다.
description_portal: 본 데이터는 (재)한국지방교육행정연구재단에서 관리하는 교육행정구역 공간정보(SHP) 파일입니다. 학교학구연계정보는 전국 17개 시도교육청의 관할지역을 공간정보로 제공하고 있습니다. 해당 파일(SHP)은 GIS(지리정보시스템) 관련 소프트웨어에서 파일을 열어 확인하실수 있습니다.학교학구연계정보 및 코드정보로 구성되어 있으며 이는 (재)한국지방교육행정연구재단에서 관리하는 학구도 공공데이터 관련 파일과 함께 연계하여 활용 할 수 있습니다.※ 학구도 공공데이터 7종은 매년 3월, 9월에 배포되고 있습니다. 데이터 활용에 참고하시기 바랍니다.
