summary_user: 전국 대학교를 학교 한 곳(본교·분교)마다 한 행으로 담은 파일로, 학교구분·학제·설립구분·학교상태와 도로명·지번 주소, 위도·경도, 개교일·홈페이지·대표번호 같은 기본 정보를 함께 담는다. 분석가나 사업자가 '특정 대학 반경 안에 원룸·상권 수요가 얼마나 될까'처럼 대학 위치를 지도에 올려 주변 입지를 따질 때 쓴다. 전역 조인 키가 없어 대학알리미 공시 자료(재학생·기숙사·충원율 등)와는 학교코드나 학교명을 맞춰 이어 쓰고, 다른 공간 데이터와는 위도·경도나 주소로 겹쳐 쓴다.
limits: 실측 컬럼에서 다른 데이터셋과 공통으로 쓰는 조인 키를 찾지 못해, 학교명·코드 매핑이나 같은 기관 코드로만 연결된다. 학생 수·기숙사·재정 같은 공시 수치는 이 파일에 없어 별도 자료와 결합해야 한다.
