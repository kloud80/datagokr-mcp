summary_user: 서울 중랑구에 개설된 학원·교습소를 한 곳씩 담은 건별 목록으로, 학원명·지정번호·등록상태·설립·등록일, 휴원 시작·종료일, 정원과 일시수용능력, 분야·계열·교습과정, 수강료와 공개 여부, 기숙사 여부, 도로명주소를 포함한다. 학부모가 동네에 어떤 과목의 학원이 있고 수강료가 얼마인지 찾거나, 분석가가 학원가 밀집도를 학원 상권·주택 수요 신호로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명주소·우편번호나 행정구역명, 학원명 같은 이름 매칭으로만 잇는다.
description_portal: 서울특별시 중랑구의 개설되어있는 학원 및 교습소의 학원명, 휴원일자, 등록상태, 정원, 분야, 계열 및 과정등을 확인할 수 있으며 수강료 공개여부에 따라 수강료 내용을 확인할 수 있습니다. 이 데이터의 원본시스템은 한국교육학술정보원입니다. 학원 교습소 정보의 제공기관은 동부교육지원청입니다. 제공항목 중 학원분야는 입시, 검정 및 보습, 예능(대), 종합(대) 등이 있습니다. 자세한 사항은 서울특별시 열린데이터 광장에 접속하여 관련데이터를 다운로드 받아 확인하여 주시기 바랍니다. 감사합니다.
