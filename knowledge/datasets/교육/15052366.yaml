summary_user: 서울특별시 내 대안학교·외국인학교 등 정규 초·중·고 이외 각종학교를 학교 한 곳당 한 행으로 담은 기본정보 목록으로, 교육청·표준학교코드·학교명·영문명, 도로명주소·우편번호, 설립구분·남녀공학·주야 구분, 고등학교 세부 구분, 설립일·연락처를 포함한다. 학부모나 연구자가 '서울에 어떤 대안·외국인학교가 어디에 있고 설립 형태와 운영 방식은 어떤가'를 확인하고 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 학교 통계·재정 데이터와는 표준학교코드(STD_SCHL_CD)나 학교명 매핑, 같은 교육청 코드를 통해서만 연결한다.
description_portal: 서울시 각종학교 기본정보 데이터는 서울특별시 내 대안학교, 각종학교, 외국인학교 등 정규 초·중·고 이외 다양한 형태의 학교 현황을 한눈에 파악할 수 있도록 정리한 공공데이터입니다. 시도교육청코드, 표준학교코드, 학교명, 영문학교명 등으로 학교를 고유하게 식별할 수 있으며, 도로명주소와 우편번호, 소재지명 등을 통해 정확한 위치 정보를 제공합니다. 또한 설립구분, 관할조직명, 남녀공학구분명, 주야구분명, 고등학교 관련 세부 구분 항목 등을 포함하여 각 학교의 운영 특성과 교육 형태를 상세히 이해할 수 있도록 구성되어 있습니다. 전화번호, 홈페이지주소 등 연락처 정보도 함께 제공되어 학부모, 학생, 시민, 연구자, 행정기관 등이 각종학교 정보를 확인하고 비교·분석하는 데 유용하게 활용할 수 있는 구조화된 기초 데이터입니다.
