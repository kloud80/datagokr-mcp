summary_user: 대학알리미 공시를 바탕으로 국내 대학의 신입생 충원율·경쟁률, 재학생 충원율, 외국인 학생 수, 중도탈락 비율, 졸업자·취업자 수 같은 학생 지표를 지표별로 담은 집계 데이터이며, 학교구분·지역 단위로 여러 공시년도 값을 나란히 제공하고 범위는 전국이다. 수험생·학부모가 지망 대학의 충원율과 중도탈락률이 최근 몇 년간 어떻게 변했는지 확인하거나, 분석가가 충원율 하락으로 대학가 상권 쇠퇴나 원룸 수요 변화를 가늠하는 데 쓴다. 전역 조인 키는 없고 학교구분(schlDivCd)·학교 ID 코드를 다른 데이터에서 먼저 받아 넘겨야 하므로, 같은 기관의 학교 목록·기숙사·재정 공시와 이 코드나 학교명·지역명 매핑으로 이어 쓴다.
description_portal: 본 데이터는 한국대학교육협의회에서 운영하는 대학알리미를 기반으로 수집된 것으로, 국내 대학의 입학, 재학, 졸업 및 학생 성과 전반에 대한 현황을 종합적으로 제공.주요 항목으로는 대학의 학생 선발 구조와 학사 운영 성과를 파악할 수 있는 지표들이 포함되어 있으며, 구체적으로 신입생 기회균형선발 비율, 신입생 충원율, 외국인 학생 수 및 외국인 중도탈락 학생 수, 입학전형 최종 등록률, 재적학생 수, 재학생 수, 재학생 충원율, 정원내 신입생 경쟁률, 졸업자 수, 취업자 수, 중도탈락 학생 수 및 중도탈락 학생 비율 등이 제공.신입생 기회균형선발 비율은 사회적 배려 대상자 및 다양한 배경을 가진 학생들의 입학 기회를 확대하는 정도를 나타내며, 신입생 충원율과 입학전형 최종 등록률은 대학의 모집 경쟁력과 선호도를 파악할 수 있는 지표이다. 외국인 학생 수와 중도탈락 현황은 대학의 국제화 수준과 외국인 학생 지원 체계를 분석하는 데 활용.또한 재적학생 수와 재학생 수, 재학생 충원율은 대학의 규모와 운영 안정성을 보여주며, 정원내 신입생 경쟁률은 입학 경쟁 수준을 나타낸다. 졸업자 수와 취업자 수는 교육 성과 및 진로 성과를 확인할 수 있는 지표이며, 중도탈락 학생 수와 비율은 학업 지속성과 학생 유지 관리 수준을 평가하는 데 활용.본 데이터는 대학의 입학 경쟁력, 학사 운영 효율성, 학생 유지 및 성과를 종합적으로 분석하고, 고등교육 정책 수립 및 대국민 정보 제공을 위한 기초 자료로 활용.
