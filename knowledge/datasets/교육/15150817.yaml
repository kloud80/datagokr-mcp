description_portal: '2025년 한국잡월드 내부에 위치한 견학 가능 체험관 및 편의시설 관련 데이터입니다.시설별 프로그램, 명칭 정보, 운영시간, 대상, 신청방법(사용방법), 전화번호, 위치, 세부 안내 페이지 정보를 포함하고 있습니다.한국잡월드는 6개의 체험시설과 4개의 편의시설(공개부지, 대관시설, 주차장 등)로 구분되어있습니다.- 포함 컬럼 : 기관명, 프로그램명, 프로그램 설명, 운영시간, 대상, 신청방법, 전화번호, 위치, 세부안내페이지- 편의시설 데이터라는 특성상 연간업로드보다는 생성시 수시 업데이트가 더 적합하다 판단하여 연별 데이터에서 수시 데이터로 데이터 업로드 주기 변경'
