summary_user: 한국장학재단이 운영하는 대학생 연합생활관(고양)의 신규 입주 신청자 수와 선발자 수를 연도·학기별로 성별, 학년(1~6학년), 신청자 지역별로 나눠 담은 집계 파일이다. 예비 입주생이나 학부모가 지역별·학년별로 고양 연합생활관 신규 입주 경쟁이 어느 정도였는지 가늠하거나, 분석가가 지방 출신 대학생의 수도권 주거 수요를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 기준년도·학기나 지역명 같은 이름을 맞춰 붙여야 하며, 같은 재단의 다른 연합생활관 현황과 함께 보는 정도로 연결한다.
description_portal: 교육부 산하 한국장학재단에서 운영하는 대학생 연합생활관(은행권, 고양)의 신규입주 현황 자료임.해당 연도, 각 학기의 입주 유형(신규)에 따른 성별(남여), 학년별(1~6학년), 신청자 지역별(서울,경기,강원, 대구, 부산 등) 에 따른 신청자 및 선발자 수 현황 자료를 담고 있음* 대학생 연합생활관에 관한 자세한 내용은 재단 홈페이지(https://www.kosaf.go.kr/ko/domitory.do?pg=PTHB_Domitory_03_01)를 참고* 2022년도까지는 데이터를 누적건으로 제공, 2023년부터는 해당 연도만 제공
