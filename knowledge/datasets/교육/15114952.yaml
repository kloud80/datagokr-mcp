summary_user: 국가우수장학금(이공계) 사업의 지원금액을 연도·학기별로 시도, 설립구분, 학과, 학년에 따라 나눠 담은 집계 파일로, 전국을 시도 단위로 다룬다. 정책 분석가나 연구자가 어느 지역·설립유형·학년의 이공계 학생에게 장학금이 얼마나 지원됐는지, 학기별로 어떻게 달라졌는지를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 시도별 고등교육·장학 통계와는 시도명이나 설립구분 같은 이름을 맞춰서만 이어 쓴다.
description_portal: 국가우수장학금(이공계) 장학사업의 지원금액 현황 정보(시도별, 설립구분별, 학년별 지원금액 등)를 제공하고 있습니다. 국가 우수장학금(이공계)는 우수인재를 이공계로 적극 유도하여 국가 핵심 인재군으로 육성하는 사업으로 관련 상세 정보는 한국장학재단 누리집(http://www.kosaf.go.kr/ko/scholar.do?pg=scholarship05_06_01)을 참고바랍니다.
