description_portal: 청주시 평생학습관은 시민의 다양하고 고도화된 학습 요구에 부응하고자 지역 내 평생학습 기관과 네트워크를 통해 학습 정보를 공유하고, 우수 프로그램을 개발하여 열린 학습공간을 제공합니다.이 공공데이터는 청주시민의 원활한 학습을 지원할 수 있도록 청주시 관내에 위치한 평생학습관의 정보를 제공합니다. 이 데이터는 평생학습관 이름, 지번 주소 및 도로명 주소, 대표전화번호, 홈페이지 주소를 포함하고 있으며, 학습 참여자, 교육 관련 업무 종사자, 정책 참여 담당자들이 활용하기 적합하며, 위치정보를 활용한 각종 데이터 분석에 활용할 수 있습니다.
