description_portal: '고용노동부에서 관리하는 배우리 교육시스템의 영상교육컨텐츠 현황 정보(등록연도, 영상컨텐츠명, 학습시간  등) 입니다.＊영상(사이버)교육은 인터넷 등 사이버 공간을 활용하여 학습자가 시간과 공간의 제약 없이 원하는 교육시스템에 접근하여 학습을 할 수 있는 교육 방식입니다.- 사이버교육 과정은 전체교육시간의 60%이상이 사이버교육으로 진행되는 과정이며, 우리 부 교육시스템(배우리 사이트)에 탑재 및 관리하고 있습니다.＊비정형학습 교육환경 변화를 반영하여 우리부에서는 다양한 사이버 콘텐츠를 제작하고 있습니다.- 분야:  역량(인공지능, 빅데이터, 디지털 등)분야, 직무(고용, 노동)분야 등데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않을 수 있으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.'
