summary_user: 강원특별자치도 홍천군 국공립 어린이집을 한 곳당 한 행으로 담은 파일로, 어린이집명·운영현황·도로명주소·정원과 현원·보육교직원수·보육실과 놀이터·CCTV·통학차량·인가일자·위경도 등 23개 항목이 들어 있습니다(포털 설명 기준 2025년 3월 24일 기준). 홍천군에서 아이를 맡길 국공립 어린이집을 찾는 부모나, 읍면별 정원 대비 현원 여유와 보육 시설 분포를 살피는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 어린이집코드·어린이집명 매칭이나 주소·위경도 기반 공간 결합으로 잇는다.
description_portal: 강원특별자치도 홍천군의 2025년 3월 24일 기준으로 작성된 어린이집 정보입니다. 해당 데이터는 어린이집명, 유형구분, 운영현황, 주소, 전화번호, 정원수, 현원수, 보육교직원수, 인가일자, 위도, 경도 등 총 23개 항목으로 구성되어 있습니다. 어린이집유형구분은 모두 국공립이며, 운영현황은 운영 또는 미운영으로 표기됩니다. 주소는 도로명주소 형식이며, 위도 및 경도 항목을 통해 위치정보도 제공됩니다. 정원수와 현원수는 어린이집 수용 규모와 실제 이용 현황을 나타내며, 인가일자는 대부분 1980년대부터 2020년대까지 다양하게 분포되어 있습니다.
