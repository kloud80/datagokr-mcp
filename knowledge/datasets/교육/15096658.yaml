summary_user: 제주특별자치도 관내 새마을문고를 문고 한 곳당 한 행으로 담은 목록으로, 문고명·주소·건물면적·열람석 수·보유 도서자료 수·전화번호를 2021년 기준으로 수록한다. 지역 독서문화 분석가나 주민이 '우리 동네 가까이에 열람석과 장서를 갖춘 작은 도서관이 어디 있는가'를 확인하거나 읍면동별 문고 분포와 규모를 비교하는 데 쓴다. 전역 조인 키는 없으므로 주소를 행정구역으로 바꾸거나 문고명으로 매핑해 공공도서관 현황, 인구 통계 등과 이어 쓴다.
description_portal: 이 데이터셋은 2021년 기준으로 제주특별자치도 관내에 소재한 모든 새마을문고의 명칭, 주소, 열람석 수, 보유 도서 자료 수 등을 항목으로 포함하고 있다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과이다. 파일 형식은 CSV이며, 누구나 별도 비용 없이 다운로드 가능하다. 이 데이터는 지역 내 새마을문고 분포와 규모를 파악할 수 있도록 구성되어 있어, 공공도서관 정책 수립, 지역 독서문화 분석, 주민 접근성 평가, 도서관 인프라 현황 파악 등에 유용하다. 다만 이 정보는 2021년 시점을 기준으로 한 일회성 데이터로, 이후 변경된 도서관 현황은 반영되어 있지 않을 수 있다.
