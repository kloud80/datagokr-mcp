description_portal: 본 데이터는 한국사학진흥재단 홈페이지를 통해 제공되는 주요 기관 소식 및 사학진흥 정책 정보를 국민과 이해관계자에게 효과적으로 전달하고자 발송된 뉴스레터의 관리 내역을 수집 및 기록한 데이터입니다. 주요 구성 항목으로는 뉴스레터 제목, 발송 일자, 수신 대상 그룹, 발송 상태, 조회수 및 주요 게재 콘텐츠 목록 등이 포함되어 있습니다. 재단의 주요 사업 안내, 고등교육 정책 동향, 사학 재정 정보 등 대국민 홍보 채널의 운영 현황 및 이력을 한눈에 파악할 수 있으며, 공공기관의 홍보 효과성 분석 및 메일링 서비스 개선을 위한 기초자료로 다양하게 활용할 수 있습니다.
