summary_user: 강원특별자치도 교육지원청별 소속 학교마다 한 행씩 학기별 수업일수와 합계, 1·2학기 시작일, 여름·겨울방학 시작·종료일, 종업식, 재량휴업일(최대 12개)을 담은 학교 단위 학사일정 파일(CSV, 약 105KB)이다. 학부모가 "우리 아이 학교의 여름방학과 재량휴업일이 언제인가"를 확인해 가족 여행·체험학습 날짜를 잡거나, 교육지원청 간 방학 시기를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키(학교코드 등)가 없어 다른 학교 데이터와는 학교명·기관명(교육지원청명) 문자열 매칭으로만 이어 쓴다.
description_portal: 교육지원청별 소속 학교들의 학기별 수업일수, 방학일, 개학일, 재량휴업일을 제공합니다. 여러 학교들의 방학기간과 재량휴업일을 한눈에 확인할 수 있어 학생 또는 교직원을 대상으로 한 행사 계획 시 일정 조율에 활용할 수 있습니다. 또한 학부모들은 자녀의 휴일 일정을 사전에 파악해 가족 여행이나 체험학습 등의 계획을 세우는 데 참고할 수 있습니다.지역 간 교육일정 비교에도 유용하게 활용할 수 있습니다.
