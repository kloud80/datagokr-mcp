description_portal: '"강원특별자치도교육청 강원특별자치도원주교육지원청_원주시 중학교 학교군" 데이터는 원주시 내 중학교 입학 배정과 관련된 학교군 및 중학구 정보를 포함하고 있으며, 학생들의 원활한 중학교 진학을 위한 기초자료로 활용됩니다. 해당 정보는 원주시의 행정구역 및 교육정책에 따라 수립된 중학교 학교군 구획 기준을 바탕으로 수집되며, 「초·중등교육법 시행령」 및 관련 지침에 근거하여 보유 및 제공됩니다. 데이터는 관할 교육지원청에서 입학 배정 계획 수립 시 검토·갱신되며, 학교군 명칭, 관할 동·읍·면, 해당 중학교 목록 등이 포함되어 있습니다. 이 자료는 중학교 입학을 앞둔 학부모 및 학생들이 진학 가능한 학교를 사전에 확인하는 데 유용하며, 교육행정기관에서는 배정 업무의 공정성과 투명성을 확보하고 지역 간 교육 자원의 균형 배치를 위한 기초자료로 활용됩니다.'
