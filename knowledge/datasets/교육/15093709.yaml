description_portal: 사립대학 부채비율DB는 한국사학진흥재단의 사립대학별 결산자료 집계를 통해 산출된 자료로, 사립대학별 부채비율을 통해 대학의 재정 건정성을 확인할 수 있습니다.부채비율의 파악을 위해 학교별 부채(A), 기본금(B), 부채비율(C=A/B)*100을 각각 제공하며, 해당 자료는 학교별, 대학지역별, 학급별(대학, 전문대학, 원격대학), 학종별로 확인이 가능합니다.사립학교별 부채비율(기본금 대비 부채) 데이터는 해당 링크에서 조사연도별로 확인이 가능하며, 엑셀파일의 형식으로 다운로드 가능합니다.
