description_portal: '경상남도 거창군 평생학습강사 현황에 대한 데이터로 분야(기초문해, 학력보완, 직업능력, 문화예술, 인문교양, 시민참여), 세부분야, 인원을 제공합니다.○ 데이터 기준일 : 2025. 12. 01.○ 평생학습강사는 전 생애에 걸쳐 학습을 실현할 수 있도록 다양한 교육 프로그램을 기획하고 운영하는 전문가입니다. 이들은 성인 학습자의 특성과 요구를 반영하여 맞춤형 교육을 제공하며, 문해교육, 인문학, 직업능력 개발, 디지털 역량 강화 등 다양한 분야에서 활동합니다. 또한 지역사회와 협력해 학습 공동체를 형성하고, 주민의 삶의 질 향상과 평생교육 활성화에 기여하는 중요한 역할을 수행합니다. 최근에는 온라인 교육 역량도 요구되며, 비대면 강의 운영 능력도 중요해지고 있습니다.'
