summary_user: 전국 학교의 급식 식단을 학교·일자·식사 구분 단위로 담은 나이스 외부 API이며, 식단 메뉴와 원산지·칼로리·영양 정보 필드를 포함한다. 학부모가 우리 아이 학교의 이번 주 급식 메뉴와 알레르기 정보를 확인하는 질문에 쓴다. 학교 코드(SD_SCHUL_CODE, 조인 키 neis_school_cd)로 같은 나이스 일상 정보의 학사일정·시간표·학급 데이터와 이어 쓴다.
description_portal: 나이스 교육정보 개방 포털은 시도교육청이 제공한 교육정보를 기반으로 다양한 급식식단정보를 포함하여 서비스를 제공하며, 한국교육학술정보원이 운영하는 교육정보 개방 시스템입니다. 사용자는 인증키를 발급받아 웹이나 모바일 어플리케이션 개발에 활용할 수 있어 교육정보를 효율적으로 이용할 수 있습니다. 이 과정에서 트래픽 수는 기관 정책에 따라 다를 수 있으며, 다양한 아이디어 실현이 가능하도록 지원합니다.
