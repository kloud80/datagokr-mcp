summary_user: 서울 금천구 관내 유치원별로 실내공기질·정기소독·미세먼지·조도 점검일자와 결과, 음용수 종류(생수·정수기·상수도·지하수)와 수질검사 여부, 관할 교육청·설립유형·주소를 한 행씩 담은 기관 단위 현황 자료다. 학부모가 '우리 동네 유치원 중 공기질·소독 점검을 최근에 받고 적합 판정을 받은 곳은 어디인가'를 확인하거나, 분석가가 지역 유치원 위생관리 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 유치원 데이터(알리미 기본현황, 어린이집 등)와는 유치원 코드(KINDERCODE)나 유치원명·주소 매핑으로만 이어 쓴다.
description_portal: '유치원 환경위생관리 현황 데이터는 유치원의 환경과 위생 상태를 점검한 정보를 담고 있는 자료입니다. 이 데이터는 유치원에서 운영되는 환경 위생 관리가 어떻게 이루어지고 있는지에 대해 구체적인 사항들을 제공합니다. 데이터에는 관할 교육청, 각 유치원의 이름, 유치원 유형(공립/사립, 법인/사인/병설), 실내공기질 점검일자 및 결과, 정기소독 점검일자 및 결과, 음용수 종류(생수, 정수기, 상수도, 지하수), 미세먼지 검사일자, 조도(빛의 강도)를 검사한 날짜, 유치원 주소가 포함되어 있습니다.이 데이터를 공개하면 국민들이 여러 측면에서 유치원의 위생 상태와 환경을 보다 쉽게 파악할 수 있게 됩니다. 부모님들은 자녀가 다니는 유치원이 얼마나 청결하고 안전한 환경을 제공하는지, 그리고 공기질, 음용수의 안전성, 미세먼지나 조도 검사 결과 등을 확인하고, 이를 통해 자녀가 건강하고 쾌적한 환경에서 교육을 받을 수 있는지 평가하는 데 활용할 수 있습니다.또한, 이 데이터를 활용하여 교육청이나 관련 기관은 유치원의 환경 위생 관리 수준을 비교하고, 개선이 필요한 부분을 찾아내어 문제점을 발견/보완할 수 있으며, 이를 통해  부모님들의 신뢰를 쌓고 유치원 운영에 대한 공공의 책임감을 높이는 데 기여할 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
