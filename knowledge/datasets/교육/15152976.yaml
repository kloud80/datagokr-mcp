summary_user: 경기도 사이버도서관이 보유한 도서를 소장 건별로 담은 자료로, 서지ID·소장ID·등록번호와 본표제·부표제·저자·출판연도·ISBN·분류기호·청구기호, 소장 도서관 부호와 이름이 한 행에 들어 있다. 도서관 운영자나 분석가가 '특정 도서가 어느 도서관에 몇 권 있나', '도서관별로 어떤 주제의 장서가 많은가'를 따지거나 다문화·외국어 자료 확보 상태를 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 서지 데이터와는 ISBN(isbn_no)이나 도서관명 같은 이름·코드 매핑으로만 잇는다.
description_portal: 이 데이터는 경기도 사이버도서관이 보유하고 있는 도서에 대한 소장자료 수집 정보를 정리한 자료로, 각 도서의 상세 서지정보를 포함하고 있습니다. 항목은 서지ID, 소장ID, 등록번호, 도서 제목(본표제), 부표제, 저자, 출판연도, ISBN, 분류기호, 청구기호, 도서관부호, 도서관명으로 구성되어 있으며, 각 도서가 어느 도서관에 소장되어 있는지를 확인할 수 있습니다. ‘청구기호’는 도서관 내에서 도서를 찾아보는 데 사용되는 고유 위치표시 코드이며, ‘분류기호’는 도서의 주제를 나타내는 번호입니다. 이 데이터를 통해 특정 도서의 분포 현황, 도서관별 소장자료의 주제 경향, 도서 메타데이터 정비 등 다양한 분석에 활용할 수 있습니다. 또한 다문화 자료, 외국어 서적 등 포괄적인 장서 확보 상태를 점검할 수 있는 자료로도 유용합니다.
