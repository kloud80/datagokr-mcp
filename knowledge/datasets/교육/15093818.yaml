description_portal: '중소벤처기업 재직자의 역량강화를 위해 연수사업을 담당하는 중소벤처기업연수원의 집합연수 및 이러닝연수에 대한 연수과정 신청현황입니다. 해당 목록에서 아래의 칼럼명에 해당하는 데이터를 확인해 주십시오.- 칼럼명: 기준년, 신청 건수(집합연수), 신청 건수(이러닝연수), 총 신청 건수데이터를 통해 연도별 집합연수 및 이러닝연수 신청건수, 총 신청건수를 확인할 수 있습니다.*중소벤처기업연수원 홈페이지는 중소벤처기업-숲(ssup.kosmes.or.kr)으로 변경되었습니다.* 2011년~2023년은 12월말 기준 데이터이나, 24년은 5월 3일 데이터생성시점 기준입니다.'
