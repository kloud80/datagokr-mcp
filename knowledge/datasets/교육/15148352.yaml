description_portal: '한국데이터산업진흥원이 운영하는 데이터온에어 온라인 교육 과정 정보는 데이터 분석·활용 역량 강화를 위한 다양한 온라인교육/유튜브강의를 한눈에 파악할 수 있도록 정리한 메타데이터입니다. 강의별 기본 정보와 접속 링크를 제공하여, 학생·직장인·실무자 등이 필요한 교육 콘텐츠를 빠르게 찾고 학습 계획을 세우는 데 도움을 줍니다. 특히 데이터분석, 파이썬, SQL, R프로그래밍, 인공지능 등 실무 중심 주제를 체계적으로 탐색할 수 있습니다. 데이터는 아래와 같은 컬럼으로 구성되어 있으며, 해당 데이터를 활용하여 자신의 학습 계획을 수립하거나 커리어 개발에 필요한 기술을 습득할 수 있습니다.제목(문자형) : 각 교육 과정의 제목강의타입(문자형) : 학습매체(예 : 유튜브)강의개수(숫자형) : 각 교육 과정 별 강의수강의제목(문자형) : 교육 과정의 각 강의 제목등록일자(날짜형) : 각 교육 과정 강의의 등록일'
