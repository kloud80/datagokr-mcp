description_portal: 제공하는 데이터는 국내 주요 대학의 연도별 학과별 교육과정 정보를 체계적으로 제공하는 공공데이터입니다. 2022년 기준 강원대학교, 경북대학교, 경상국립대학교, 부산대학교, 서울대학교, 전남대학교, 전북대학교, 제주대학교, 충남대학교, 충북대학교 등 10개 대학의 학과별 교육과정 데이터가 시범적으로 수집·공개되고 있습니다. 주요 제공 정보에는 개설 교과목명, 학점, 이수구분, 학년·학기, 교과목 개요, 담당학과 등 세부 교육과정 정보가 포함됩니다. 각 대학에서 공식적으로 제출한 교육과정 자료를 기반으로 하며, 고등교육 혁신 및 학과 교육과정의 투명한 공개를 위한 정책적·법적 근거에 따라 수집·관리됩니다. 데이터는 신규 교육과정 개편이나 변동 시 수시로 갱신되는 1회성 데이터 형태로 제공됩니다. 이 데이터는 대학별 교육과정 비교, 학과 커리큘럼 분석, 교육정책 수립, 진로·학업 설계, 교육 연구, 통계 등 다양한 분야에서 활용될 수 있습니다
