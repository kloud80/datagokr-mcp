description_portal: '- 전남도립대학교 소속 인력이 창출한 지식재산권(지식재산권 구분, 출원번호, 특허명, 발명자, 등록현황 등)의 현황에 대해 조회하실 수 있습니다.- “지식재산권”(知識財産權, Intellectual Property Rights, IPR)은 창작물이나 발명, 상표, 디자인 등 무형의 창작물에 대한 법적 권리를 말합니다.- 지식재산권의 중요성 : 독점적 이용권을 부여해 경쟁자 모방 차단, 사업 경쟁력 강화 및 수익 창출 수단, 기술이나 브랜드를 거래하거나 라이선스 가능, 창작자의 권리를 법적으로 보호해 혁신 장려- 지식재산권의 종류 : 특허권, 실용신안권, 디자인권, 상표권, 저작권 등'
