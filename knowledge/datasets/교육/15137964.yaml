description_portal: '한국산업인력공단에서 제공하는 “국가기술자격시험 관련 연도별 시험현황 정보(연도별 검정현황, 지역별 등록자 수 등)” 공공데이터는, 국가기술자격시험의 시간적·공간적 흐름과 응시자 규모 변화 및 지역 간 응시 분포 등을 포괄적으로 정리한 자료입니다. 이 데이터에는 매년 시행된 자격시험의 검정횟수, 연도별 응시자 등록자 수, 합격자 수, 시험종목별 실시 횟수, 지역(시·도 등)별 등록자 통계, 자격 구분(등급, 필기·실기 등)별 비교, 연도별 시험 일정 변화 추이, 응시자 성별 및 연령대 구성이 포함될 수 있으며, 데이터 제공 형식(예: CSV, JSON), 데이터 갱신 주기, 관리 기관 부서, 라이선스 및 이용 조건 등의 메타정보도 함께 제공됩니다. 응시자·정책입안자·연구자 등이 국가기술자격제도의 동향을 파악하고 지역 간 자격 시험 수요 및 자격 취득률 분석 등에 활용할 수 있게 설계된 자료입니다.'
