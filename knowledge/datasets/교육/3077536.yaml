summary_user: 양주시 관내 학교별로 일반·특수 학급수, 학생수, 교장·교감·교사 교원수와 교장실·교무실·행정실·당직실 전화번호, 팩스를 한 행씩 담은 작은 CSV 파일(약 5.9KB)이다. 양주시 학부모나 교육 관계자가 "우리 동네 학교의 학급당 학생 수와 교원 규모는 어느 정도이고 행정실 연락처는 무엇인가"를 확인하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어, 교육부·교육청의 학교 기본정보나 교원·학생 통계와는 학교명을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 양주시 관내 학교명, 학급수, 학생수, 교원수, 교장, 교감, 행정실장, 전화번호(교장실, 교무실, 행정실, 당직실), 팩스 등의 항목을 제공합니다.교육 접근성과 안전한 학교 환경 조성, 지역 교육 자원 관리에 활용됩니다.학생 복지 향상과 교육 격차 해소를 위한 기초 자료로서 중요합니다.시민과 교육 관계자가 학교 현황을 쉽게 확인하고, 포용적이고 효율적인 교육 정책 수립에 기여합니다.
