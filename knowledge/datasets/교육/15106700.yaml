summary_user: 강원특별자치도교육청이 관리하는 미활용 폐교를 학교 한 곳씩 담은 파일로, 지역·폐교명·폐교일·소재지·부지면적·필지 수·건물면적·동수·향후계획을 담는다. 폐교 부지를 대부받거나 매입하려는 사업자·지자체가 '우리 지역에 아직 활용되지 않은 폐교가 어디에 얼마 규모로 있는가'를 찾거나, 분석가가 구도심·농산어촌 쇠퇴 지역을 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 폐교명(학교명)을 맞춰 이어 쓴다.
description_portal: 강원특별자치도교육청 미활용 폐교 현황 자료입니다.지역별 폐교명, 폐교일, 소재지, 부지면적, 필지, 건물면적, 동수, 향후계획을 확인하실 수 있습니다.미활용폐교 데이터 기준일은 2025.7.1.자 기준으로 미활용폐교현황은 변경될 수 있습니다.건물연면적이 공란인 경우 건물없이 부지만 관리되고 있는 폐교입니다.대부 및 매각은 교육지원청에서 직접 추진사항 사항으로 자세한 문의는 해당 교육지원청으로 문의하셔야 합니다.교육지원청 연락처는 강원특별자치도교육청 누리집에서 확인할 수 있습니다.
