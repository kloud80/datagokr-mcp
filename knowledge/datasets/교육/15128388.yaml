description_portal: 이 데이터는 1998년에 간행된 《사진유리필름 목록집》(상·하)에 수록된 국사편찬위원회 소장 자료를 기반으로 구축된 데이터베이스입니다. 사진 자료와 유리필름 자료로 구성되어 있으며, 사진 자료는 인화된 사진을, 유리필름 자료는 유리건판 필름 형태로 남아 있는 자료를 의미합니다. 이러한 자료는 한국 근현대사의 시각적 기록으로서, 역사 연구 및 교육 자료로 활용될 수 있습니다. 데이터는 CSV 형식으로 제공되며, 유니코드 UTF-8 인코딩을 사용하여 열람해야 합니다. 공공저작물로서 출처 표시를 조건으로 비상업적 용도로 이용 가능하며, 상업적 이용이나 내용 변경은 금지되어 있습니다.
