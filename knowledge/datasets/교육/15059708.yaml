summary_user: 전북특별자치도에서 야간·시간연장 보육을 하는 어린이집을 한 곳당 한 행으로 담은 목록으로, 유형·주소·정원·아동현원·보육교직원현원·평가인증 여부·통학차량 운영 등을 담는다(csv 약 68KB). 맞벌이 부모가 "우리 동네에서 밤늦게까지 아이를 맡길 수 있는 어린이집이 어디이고 자리가 남아 있나"를 찾거나, 정책 담당자가 시군구별 야간 보육 공급과 수용 여력을 비교하는 데 쓴다. 전역 조인 키는 없으므로 시군구·행정동·우편번호·주소나 어린이집 이름으로 다른 보육·인구 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내에서 야간 및 시간 연장 보육 서비스를 제공하는 어린이집의 현황을 상세히 담은 목록입니다. 각 어린이집의 유형(가정, 법인 등), 주소, 정원, 실제 재원 아동 수, 보육교직원 수 등 운영의 핵심적인 정보들을 포함하고 있습니다. 특히 맞벌이 가정 등 유연한 보육 서비스가 필요한 부모들에게 실질적인 정보를 제공하며, 지역별 특수 보육 시설의 분포와 수용 능력을 파악하는 데 중요한 자료입니다. 이 자료는 보육 정책 입안자들이 지역별 돌봄 서비스의 공급 현황을 분석하고, 필요한 지원 정책을 마련하는 데 기초 자료로 활용됩니다.
