summary_user: 경기도 사이버도서관 상호대차 서비스에서 발생한 도서 이동을 건별 트랜잭션 단위로 담으며, 도서명·등록번호·ISBN·저자·출판사와 요청·제공·반납 도서관, 대출·반납·복귀예정일, 요청·발송·입수 취소 같은 처리 상태 날짜를 포함한다. 도서관 정책 담당자나 분석가가 '어느 도서관이 어느 도서관에 자료를 가장 많이 빌려주는가, 상호대차 요청에서 대출까지 며칠이 걸리는가'를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고, 도서관부호(librry_no 등)로 같은 기관 도서관 목록과 맞추거나 ISBN(isbn_no)을 이름·코드 매핑으로 써서 도서 서지 정보와 잇는 정도로만 연결한다.
description_portal: 이 데이터는 경기도 사이버도서관 내 상호대차 서비스를 통해 발생한 도서 이동 기록을 담고 있는 자료입니다. 상호대차는 한 도서관에 없는 자료를 다른 도서관에서 대출받아 이용자에게 제공하는 서비스로, 데이터는 본표제(도서명), 등록번호, 도서관명, 도서관부호, 대출일시, 반납일시, 복귀예정일, 요청일, 제공도서관, 반납도서관, 트랜잭션 번호, ISBN, 저자, 출판사, 출판연도 등의 항목으로 구성되어 있습니다. 각 항목은 도서의 물리적 이동과 서비스 처리 과정을 세밀히 추적할 수 있게 하며, 도서관 간 협력체계 분석, 도서 이동량 추적, 지역별 자료 수요 분석 등 다양한 정책 자료로 활용될 수 있습니다. 요청 취소, 발송 취소, 입수 취소 등 상태 관리에 대한 정보도 포함되어 있어 서비스 운영 과정의 상세 흐름을 확인할 수 있습니다.
