description_portal: 이 데이터는 경남개발공사가 소속 임직원의 직무능력 향상 및 법정 교육 이수를 목적으로 실시한 각종 교육 과정의 운영 현황을 연도별로 정리한 표입니다. 2018년부터 2020년까지의 교육 이수 실적을 포함하며, 각 교육과정의 명칭, 교육 시작일 및 종료일, 총 이수시간(시간 단위), 교육비 및 기숙사비 등 부대 비용, 교육 형태 및 학습유형, 분류된 학습 분야까지 세부 정보를 포함합니다.주요 항목으로는 법정 교육인 ‘기술자 법정교육’, 업무역량 제고를 위한 ‘직무역량 교육’, 조직문화와 고객만족 향상을 위한 ‘고객리더교육’, 성희롱 예방 및 청렴윤리 교육, 재난 및 안전 분야 교육, 개인정보보호 교육 등이 있으며, 대부분의 교육은 외부 위탁 형식으로 운영되고 집합교육 형태로 진행됩니다. 일부 과정의 경우 교육비 전액 또는 일부가 면제되거나 기숙사비가 포함되기도 하며, 기관의 인재개발 및 법정의무 준수 목적을 모두 아우르고 있습니다.
