description_portal: 주문형학교홈페이지 게시판 관련 데이터입니다.식단목록 관련 테이블 데이터가 포함되어 있습니다.식단 테이블에는 홈페이지를 구축한 2020년도 이후 첫 학기인 2021년 3월 신학기부터의 식단 목록 및 영양소 정보가 포함되어 있습니다.영양소 정보는 칼로리, 탄수화물, 단백질, 지방, 칼슘 등이 포함되어 있으며 따로 입력되지 않은 행은 공란으로 처리되어 있습니다.해당 홈페이지는 내년 기관 홈페이지와 학교 홈페이지 통합개선 사업으로 인해 통합 홈페이지로 개편될 예정이니 해당 부분 참고하시기 바랍니다.
