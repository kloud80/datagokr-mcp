summary_user: 전국 초·중등학교를 학교 한 곳당 한 행으로 담은 위치 원천 데이터로, 학교명·학교급·설립형태·본교/분교·운영상태와 지번·도로명 주소, 위도·경도, 관할 시도교육청·교육지원청을 함께 싣는다. 학부모나 분석가가 '우리 집 근처에 어떤 초등학교·중학교가 있고 어느 교육지원청 관할인가'를 확인하거나 학교 분포를 지도에 올릴 때 쓴다. 학교ID(school_cd)를 키로 학교 공시·학구도 등 다른 학교 단위 데이터와 잇고, 시도교육청·교육지원청 코드로 관할별 묶음을 만들며, 좌표로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 본 데이터는 한국교육시설안전원에서 관리하는 초중등학교위치 공간정보(SHP)를 파일입니다.초중등학교위치는 전국 17개 시도교육청의 관할지역을 공간정보로 제공하고있습니다.해당 파일()은 (지리정보시스템) 관련 소프트웨어에서 파일을 열어 확인하실수 있습니다.초중등학교명칭 및 코드정보로 구성되어 있으며 이는 한국교육시설안전원에서 관리하는 학구도 공공데이터 관련 파일 과 함께 연계하여 활용할 수 있습니다. ※ 학구도 공공데이터 7종은 매년 3월, 9월에 배포되고 있습니다. 데이터 활용에 참고하시기 바랍니다.
