description_portal: '평택시 시민자치대학 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 지역 주민의 자치 역량을 강화하고, 시민참여 확대를 목표로 운영되는 다양한 교육 프로그램의 구성 및 운영 현황을 체계적으로 관리하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 교육 프로그램 내용, 일정 등을 쉽게 확인하여 자치활동 참여 기회를 넓힐 수 있으며, 민간·연구기관은 주민자치 활성화 정책 연구, 지역 리더십 교육 설계, 평생학습 서비스 개발 등 다양한 분야에서 데이터를 활용할 수 있습니다. 본 데이터에는 강좌명, 일정, 장소 등의 항목이 포함되어 있어 시민자치교육의 운영 구조를 이해하는 데 도움이 됩니다. 이러한 자료는 지역 공동체 강화, 주민참여 확대, 자치역량 향상, 교육 접근성 개선 등 공공·민간 영역 모두에서 활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
