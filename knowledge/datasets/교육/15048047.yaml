description_portal: 부산광역시 연제구 연제도서관(연산역 등 4개소 빌리돌리북 포함)은 한국십진분류법(KDC, Korean Decimal Classification)에 따라 각 자료를 주제별로 분류하고 있으며 이러한 주제별 분류대한 정보를 제공하고 있습니다.한국십진분류법이란 도서의 분류 체계중 하나로 모든 도서들을 주제에 따라서 우선 크게 10가지 유형(총류, 철학, 종교, 사회과학, 자연과학, 기술과학, 예술, 언어, 문학, 역사)로 나누고 이후 다시 10가지로 세분화하여 도서를 분류하는 방법입니다. 대부분의 공공도서관에서는 해당 분류에 따라 도서를 정리하고 있습니다.해당 정보를 통해 연제도서관의 주제별 장서 구성 정보를 파악하실 수 있습니다.
