description_portal: 수학교사의 전문성을 신장하고 변화하는 교육 환경에 대응하는 역량을 강화하기 위해, 한국과학창의재단에서 주최하거나 지원한 각종 수학교육 관련 행사의 자료를 제공합니다. 교사, 교육전문직 등 수학교육 관계자 간의 최신 정보 교류와 우수 교육 사례 확산을 목적으로 합니다.개방 데이터는 '전국 수학교육 담당 전문직 워크숍', '수학교사 한마당', '수학클리닉 교원연수' 등 20여 건의 수학교육 행사에서 발표되거나 배포된 자료 목록으로 구성되어 있습니다. 각 자료의 '제목'과 '내용'을 통해 해당 행사의 주제, 목적, 대상 등 상세한 정보를 파악할 수 있으며, 실제 연수 자료집, 발표 자료 등을 포함하고 있습니다.시도교육청 및 교육 연수 기관에서는 이 데이터를 참고하여 교원 연수 프로그램을 기획하거나 강사 섭외를 위한 기초 자료로 활용할 수 있습니다. 수학교사들은 직접 참여하지 못한 행사의 자료를 통해 최신 수학교육 동향을 파악하고 교수학습 방법 개선을 위한 아이디어를 얻는 등 자기계발 자료로 활용할 수 있습니다.
