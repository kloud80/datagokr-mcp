description_portal: 한국전력기술(주) 전력기술분야 미래 인재육성 프로그램인 Power Engineering School(PES) 교육자료(pptx)로, 발전소, 발전 시스템, 시스템 주요 구성기기에 대한 정보를 제공합니다.해당 자료는 발전 기초 이론과 설비 구성을 통합적으로 다루며, 발전 과정에 필수적인 열역학 사이클, 주요 기기 구성, 그리고 에너지 변환 메커니즘을 설명합니다.해당 자료는 발전소 설계, 운영, 시스템 엔지니어링에 관심 있는 전공자 및 에너지산업 종사자, 교육 수강생을 위한 학습 콘텐츠입니다해당 자료는 다음과 같은 내용을 포함하고 있습니다.1. 원자력 발전소와 화력 발전소의 비교- 원자로 형식(PWR, PHWR, BWR, SFR)과 석탄·복합화력 발전 시스템 구조 비교- 발전소 주요 계통(NSSS, BOP) 구분2. 발전 시스템 구성 기기 설명- 증기발생기, 터빈발전기, 복수기, 급수가열기, 탈기기, 주급수펌프 등3. 열역학 이론 기반 발전 사이클 설명- 카르노 사이클, 랭킨 사이클의 구조- 베르누이 방정식 및 증기 상태(포화증기, 과열증기, 건도 등)에 대한 이해
