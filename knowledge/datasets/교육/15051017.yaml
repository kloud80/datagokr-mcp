description_portal: 이 자료는 서울 지역 학생들의 건강검사 결과를 표본조사 방식으로 수집한 것으로, 신체 치수와 생화학적 검사를 포함한다. 키, 몸무게, 혈당, 콜레스테롤, 간기능 수치 및 혈색소 등 다양한 건강 지표가 포함되어 있으며, 도시규모별, 성별, 학년별 분석이 가능하다. 특히 건강검진일과 개별 학생의 고유식별번호가 부여되어 상세한 추적과 비교 연구에 활용할 수 있다. 이러한 데이터는 학생들의 전반적 건강 상태를 평가하고 지역사회 건강 관리에 유용한 기초 자료로 활용된다.(제공데이터)학생건강검사 결과(표본) 서울지역 고유식별번호(ID),최종가중치,학교고유번호(ID),도시규모,도시규모별분석용,학년도,광역시도,시도별,학교급별,학교명,공학여부,학년,반,성별,건강검진일,키,몸무게,혈당식전(mgdl),총콜레스테롤(mgdl),간기능(AST)단위(UL),간기능(ALT)단위(UL),혈색소(gdl),간염검사,수축기,이완기 에 대한 raw data
