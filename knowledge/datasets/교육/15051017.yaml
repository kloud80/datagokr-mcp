summary_user: 학생 한 명당 한 행으로 키·몸무게·식전 혈당·총콜레스테롤·간기능(AST·ALT)·혈색소·혈압·간염검사 결과를 담은 표본조사 원자료이며, 학년도·시도·도시규모·학교급·학년·성별과 최종가중치가 함께 들어 있다. 연구자나 보건·교육 분석가가 '도시규모별·학년별로 학생 비만이나 혈압·혈당 이상 비율이 어떻게 다른가' 같은 질문에 가중치를 적용해 집계할 때 쓴다. 전역 조인 키가 없어 다른 학교 데이터와는 학교명이나 시도 이름을 매핑해서만 이을 수 있고, 학교고유번호(ID)는 이 조사 안에서만 쓰는 번호로 보아야 한다.
limits: 실측 컬럼에서 표준 학교코드 같은 전역 조인 키를 찾지 못해 학교 기본정보와 바로 붙지 않는다. 포털 설명은 서울 지역 표본이라고 하나 실측 범위는 전국·시도 단위로 잡혀 있으니 지역 범위를 먼저 확인하고, 표본 자료이므로 집계할 때 최종가중치를 적용해야 한다.
