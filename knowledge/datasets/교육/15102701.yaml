description_portal: 전라남도 광양시는 영유아의 안전하고 균형 잡힌 성장, 그리고 가정의 보육 부담 완화를 위해 다양한 보육정책을 지속적으로 추진하고 있습니다. 특히 급변하는 사회 환경 속에서 맞벌이 가정 및 다양한 가족 형태가 증가함에 따라, 양질의 보육 서비스를 제공하고자 하는 지역사회의 역할과 책임이 더욱 중요해지고 있습니다.이러한 흐름에 발맞추어, 광양시는 투명하고 체계적인 보육정보 공개를 통해 시민 여러분이 신뢰하고 선택할 수 있는 보육환경을 조성하고자 노력하고 있습니다.이번에 제공되는 ‘어린이집 현황 정보’는 광양시 관내에서 현재 등록되어 운영 중인 전 어린이집의 기본 정보 및 시설·운영 현황을 종합적으로 수록한 자료로, 학부모의 시설 선택, 행정의 정책 수립, 관련 기관의 보육서비스 품질 관리 등에 다양하게 활용될 수 있도록 구성하였습니다.<제공 항목>항목명(내용 설명), 어린이집명(어린이집의 공식 명칭), 어린이집 유형(국공립, 사회복지법인, 민간, 가정, 직장, 협동 등 유형 구분), 정원수(어린이집에 등록 가능한 최대 아동 수), 보육교직원 수(원장, 보육교사, 조리사 등 현재 근무 중인 보육교직원 수), 소재지(어린이집의 실제 주소지), 전화번호(어린이집 대표 연락처), 보육실 수(실제 운영 중인 보육실 수량),  놀이터 수(실외 또는 실내 놀이시설 보유 수), CCTV 설치 여부*어린이집 내 CCTV 설치 여부 (설치됨/설치안됨)), 통학차량 운영 여부(통학 차량 운행 유무 (운행함/운행하지 않음))
