summary_user: 서울특별시 중랑구 소재 유치원별로 실내공기질·정기소독·음용수·지하수 수질·미세먼지·조도 점검 일자와 결과를 담은 유치원 단위 현황 데이터로, 원본은 유치원 알리미이며 범위는 중랑구(동부교육지원청 관할)이다. 학부모가 '우리 동네 유치원이 실내공기질과 미세먼지 점검을 언제 받았고 결과가 적합했는가'를 확인하거나, 분석가가 지역 유치원 환경위생 관리 상태를 비교하는 데 쓴다. 전역 조인 키는 없어 유치원코드(KINDERCODE)·유치원명·주소로 같은 유치원 알리미 계열 데이터(유치원 일반현황 등)나 어린이집 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 서울특별시 중랑구 소재 유치원의 실내공기질, 미세먼지 등 환경 위생 점검 현황입니다. 주요 제공 항목으로는 유치원코드, 유치원명, 설립유형, 실내공기질 점검, 정기소곧, 음용수, 지하수, 미세먼지, 주소 등의 정보를 포함합니다. 데이터의 원본시스템은 유치원 알리미입니다. 교육청명과 교육지원청명은 서울특별시교육청, 동부교육지원청입니다. 설립유형으로는 공립(병설), 사립(사인)이 있습니다. 자세한 사항은 서울특별시 열린데이터 광장에 접속하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
