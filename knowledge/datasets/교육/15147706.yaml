summary_user: 서울 강북구에 개설된 학원·교습소를 한 곳(과정)씩 담은 건별 목록으로, 학원명·지정번호·도로명주소·분야·교습계열·과정·정원·등록상태·휴원 기간·수강료(공개한 곳만)를 시군구 범위로 담는다. 학부모가 강북구에서 특정 과목 학원의 수강료와 정원을 비교하거나, 분석가가 동네별 학원 밀집도를 학원 상권·주택 수요 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 구·교육청의 학원 데이터와는 행정구역명·주소·학원명 같은 이름 매핑으로만 잇는다.
description_portal: 서울특별시시 강북구 학원 교습소정보 데이터는 강북구의 개설되어있는 학원 및 교습소의 학원명, 휴원일자, 등록상태, 정원, 분야, 계열 및 과정등을 확인할 수 있으며 수강료 공개여부에 따라 수강료 내용을 확인할 수 있습니다.학원 교습소정보 데이터는 행정구역명,학원/교습소,학원지정번호,학원명,도로명주소,도로명상세주소,분야명,교습계열명,교습과정목록명,교습과정명,정원합계,일시수용능력인원합계,인당수강료내용,수강료공개여부,기숙사학원여부,도로명우편번호,등록상태명,등록일자,휴원시작일자,휴원종료일자,개설일자,적재일시로 구성되어 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.
