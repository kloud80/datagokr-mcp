description_portal: 이 데이터는 교육기관 웹사이트의 메뉴 구조를 나타낸 자료로, 각 메뉴의 사이트코드, 메뉴코드, 메뉴명, 메뉴종류, 메뉴깊이 등의 정보를 포함하고 있습니다. 메뉴종류는 tab, program, bord, greet, bigmenu, normal, main 등으로 구분되어 있으며, 이를 통해 각 메뉴의 기능과 역할을 파악할 수 있습니다. 예를 들어, ‘공유물품신청’, ‘차량관리’, ‘연수지원 신청’ 등은 program 유형으로 실제 기능을 수행하는 메뉴이며, ‘공지사항’은 bord 유형으로 게시판 기능을 담당합니다. 메뉴깊이는 1~3단계로 구성되어 있어 메뉴의 계층 구조를 이해하는 데 도움이 되며, 사이트별로 메인화면, 학교지원센터, 마을학교 신청 등 다양한 서비스가 제공되고 있음을 보여줍니다. 이 데이터는 웹사이트의 정보구조 설계, 사용자 인터페이스 개선, 기능별 접근 경로 분석 등에 활용될 수 있습니다.
