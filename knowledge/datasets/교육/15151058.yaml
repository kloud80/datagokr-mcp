description_portal: 본 데이터는 「보육교사 특성별 사직·이직 상세」를 주제로 CTGAN 기법을 활용해 생성된 합성데이터로, 실제 교사의 개인정보를 포함하지 않고 성별, 연령대, 학력, 근무지역, 기관유형 등 개인적·환경적 특성과 사직·이직 사유 간의 통계적 관계를 정밀하게 재현하였다. CTGAN은 원본 데이터의 다차원적 분포와 속성 간 상호작용을 학습하여 현실과 유사한 구조를 유지하면서도 식별 위험을 완전히 제거하였다. 본 데이터는 공공기관의 인력정책 수립뿐 아니라 민간 기업의 HR 분석, 근로환경 개선 연구, 직무 만족도 예측모델 개발, 이직 리스크 관리 솔루션 등에서 활용 가치가 높다. 특히 보육교사 이직 패턴의 데이터 기반 분석을 통해 조직 유지율 향상, 맞춤형 복지 프로그램 설계, 근속기간 예측 등 다양한 비즈니스 인사이트 도출에 활용될 수 있다.
