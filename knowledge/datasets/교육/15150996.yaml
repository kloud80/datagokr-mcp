description_portal: 울산광역시교육청 교육행정기관통합누리집의 금칙어 설정이력은 누리집 이용자의 게시글, 댓글, 민원 작성 시 부적절한 단어나 불법·비속어의 사용을 사전에 차단하기 위해 관리되는 공공데이터입니다. 이 데이터에는 금칙어의 추가·수정·삭제 내역과 적용 시점 등이 기록되어 있으며, 누리집 운영의 건전성과 이용자 보호를 위한 관리 이력을 투명하게 확인할 수 있다. 금칙어 설정의 목적은 교육기관 누리집의 공공성과 신뢰성을 유지하고, 비속어나 음란어, 혐오 표현, 허위정보 유포 등을 방지하여 교육행정 관련 정보가 안전하고 품격 있게 소통되는 환경을 조성하는 데 있습니다. 이를 통해 울산광역시교육청은 건전한 온라인 행정문화 정착과 이용자 간 상호존중의 인터넷 이용문화를 확립하고자 합니다.
