description_portal: 국외 한국어 및 한국문화 보급 및 확산을 목적으로 설립하고 운영하고 있습니다.이러한 목적에 근거하여 국외 한국어 및 한국문화 확산을 위한 다양한 온라인 및 오프라인 교육자료를 개발하고 이를 무료로 제공하고 있습니다.본 공공데이터는 세종학당 학습 앱 3개(손안의 세종학당, 세종학당 AI 선생님, 세종학당 농어업 한국어) 중에서 <손안의 세종학당> 학습 앱의 월별 신규 가입자 수를 수집하고 목록화 하여 제공하고자 합니다.참고로 <손안의 세종학당> 학습 앱은 "세종학당 한국어(입문~고급)" 교재 내용을 기반으로 자가 학습이 가능토록 개발한 학습 앱이며, 해당 앱에는 기존 앱(시사, AR, 비즈니스, 어휘, 문법 등)을 통합하여 제공하고 있습니다.<손안의 세종학당> 학습 앱은 구글플레이스토어, 애플스토어, 원스토어 등에서 다운받아 회원 가입 및 로그인 후 무료로 이용 가능하오니, 보다 자세한 사항은 앱스토어에서 확인 바랍니다.
