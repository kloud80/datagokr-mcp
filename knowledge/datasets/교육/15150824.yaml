description_portal: 대구광역시 동구는 동구 관내의 주민들을 대상으로 일상생활에 필요한 컴퓨터 전산 과목을 선정하여 무료로 교육을 하고 있습니다. 우리 구에서 추진하는 주민 정보화 교육에 참여한 개인별 수강 이력 정보를 수집 관리하는 데이터로, 교육 참여 현황을 분석하여 교육 효과성 제고 및 향후 교육 운영계획 수립에 활용하기 위해 수집 관리하고 있습니다. 해당 데이터는 개인정보를 제외하고 연령, 성별, 수강과목, 교육 선발여부, 교육시작시간, 교육종료시간을 중심으로 제공하고 있습니다. 아울러 신청자의 이름 정보는 알파벳형식으로 가명화 처리 하여 개인을 식별할 수 있는 모든 정보가 비 식별화된 상태에서 공개되며, 개인정보 보호법 및 공공데이터의 제공 및 이용 활성화에 관한 법률을 준수하였습니다.
