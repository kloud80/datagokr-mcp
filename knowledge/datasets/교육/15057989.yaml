summary_user: 경기도 내 대학·전문대학의 입학전형 유형별 선발 결과를 기준년도·학교·전형(대·중·소분류) 단위로 담으며, 수시·정시·추가 모집별 모집 인원, 등록 인원, 등록률과 최종 등록률이 들어 있다. 입시 분석가나 정책 담당자가 '어느 대학의 어떤 전형이 정원을 안정적으로 채우는가', '수시와 정시 중 등록률이 낮은 전형은 무엇인가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 학교 통계·재정 자료와는 학교명(SCHOOL_NM)과 설립구분 같은 이름 매핑으로만 이어 붙인다.
description_portal: 이 데이터는 대학 및 전문대학의 입학전형 유형별 선발 결과를 기록한 자료로, 수시·정시·추가 모집 단위에서의 모집 인원과 실제 등록 인원, 등록률을 비교할 수 있도록 구성되어 있습니다. 주요 정보에는 기준년도, 학교종류명, 설립구분, 학교명, 정원구분, 전형유형명, 전형대분류·중분류·소분류, 모집 인원과 등록 인원, 최종 등록률이 포함됩니다. 이를 통해 대학별·전형유형별 선발 구조와 등록 성과를 파악할 수 있으며, 특정 전형의 경쟁력이나 충원 안정성을 확인할 수 있습니다. 이 데이터는 대학 입학 정책 분석, 전형별 지원자 선호도 연구, 교육 수급의 지역 간 불균형 검토, 입학제도 개선 논의 등에 활용할 수 있는 기초 자료입니다.
