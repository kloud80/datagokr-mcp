summary_user: 전국 대학·대학원·전문대학 등 고등교육기관의 학과를 한 행씩 담은 학과 단위 현황으로, 조사연도별로 설립구분·학교구분·본교/분교, 단과대학과 학부·과(전공)명, 주야 구분, 학과 특성·상태, 대·중·소계열, 수업연한, 학위과정을 담는다. 진학 상담가나 교육정책 분석가가 "최근 몇 년 사이 특정 계열 학과가 어느 대학에서 새로 생기거나 폐과됐는가"를 확인하는 데 쓴다. 학교코드(SCHOOL_CD)와 학과코드 필드가 있지만 실측상 전역 조인 키로 확인되지 않아, 다른 학교 통계·재정 데이터와는 학교명·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 본 데이터는 전국 대학 및 대학원, 전문대학 등의 고등교육기관을 대상으로 한 학과별 현황을 제공하는 자료로, 설립구분(국공립/사립), 학교구분, 본교/분교 구분, 단과대학명, 학부·과(전공)명, 주야구분, 학과특성 및 상태, 대·중·소계열 분류, 수업연한, 학위과정명 등의 정보를 포함합니다. 학과 개설·폐과 현황과 계열별 전공 구성을 연도별로 파악할 수 있습니다. 이 데이터는 고등교육 정책 수립, 전공 다변화 분석, 계열별 학문 분야 확대 추세 확인, 대학 경쟁력 평가, 학과별 취업 연계도 조사, 지역별 교육자원 분석 등 다양한 교육 행정 및 연구 목적에 활용될 수 있습니다.
