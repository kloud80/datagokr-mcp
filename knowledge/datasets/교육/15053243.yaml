summary_user: 영주교육지원청 관내에서 운영 중인 교습소를 한 곳당 한 행으로 담은 파일로, 교습소명·분야·교습계열·교습과정·교습과목(반)·일시수용능력인원을 싣는다(csv 약 13.7KB). 학부모나 지역 분석가가 영주에 어떤 과목의 교습소가 몇 곳 있고 수용 규모가 어느 정도인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 교육지원청의 학원·교습소 파일과는 교습소명이나 같은 기관 기준으로만 맞춰 이어 쓴다.
