summary_user: 전국 유치원별로 소방대피훈련·가스·소방안전·전기설비 점검 여부와 일자, 놀이시설 안전검사 대상 여부와 결과, CCTV 설치 여부와 건물 안팎 설치 수를 한 행씩 담은 건별 현황 파일이다. 학부모가 우리 동네 유치원이 소방·가스·전기 점검을 언제 받았고 CCTV를 몇 대 두었는지 비교하거나, 분석가가 설립유형별 안전점검 이행률을 따질 때 쓴다. 전역 조인 키가 없어 다른 유치원 데이터(위치·원아 수 등)와는 교육청명·교육지원청명·유치원명을 이름으로 맞춰 이어야 하며, 어린이집 데이터와 짝지어 볼 때도 마찬가지다.
description_portal: 유치원의 환경위생 및 안전 현황에 대한 자료로, 유치원 내 환경 개선과 위생 관리, 어린이 보호를 위한 안전 대책 등이 포함되어 있습니다. 현황을 파악하여 유치원 환경 및 안전 수준을 향상시키는 데 중점을 두고 있으며, 유치원의 쾌적하고 안전한 교육 환경 조성에 기여하는 내용을 담고 있습니다. 각 유치원의 위생 상태, 안전 점검 현황, 시설 관리 등의 정보를 담고 있으며, CSV 형식으로 제공됩니다. 이 자료는 유치원 환경 개선 및 안전 정책 수립에 활용될 수 있습니다.(제공데이터)교육청명,교육지원청명,유치원명,설립유형,소방대피훈련여부,소방대피훈련일자,가스점검여부,가스점검일자,소방안전점검여부,소방안전점검일자,전기설비점검여부,전기설비점검일자,놀이시설 안전검사 대상여부,놀이시설 안전검사,점검일자놀이시설 안전검사 점검결과 등
