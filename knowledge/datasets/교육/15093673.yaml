description_portal: U-도서관 시스템은 자동화된 무인 도서 대출 및 반납 시스템을 갖춘 스마트 도서관 시스템입니다. 365일, 24시간 연중무휴로 도서관 서비스 범위를 확장하고 대면 서비스 부담을 감소시키고 운영을 효율화합니다. 시간과 공간의 제약을 완화하여 시민들의 독서 접근성을 높여 독서 생활화를 제공합니다.파일내 항목에서 U-도서관시스템이 설치된 위치, 관리 도서관, 장비타입 정보(스마트 도서관 도서 대출반납시스템의  장비명,  장비제조사,  대출·반납 용량, 디스플레이, 인식장비), 서비스개시일을 제공합니다.
