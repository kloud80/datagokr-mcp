description_portal: '다문화 탈북(이주 북한배경)학생 멘토링장학금  대학별  멘토 매칭 유형(대학명, 상품명,  장학년도,  장학학기,  장학회차,  기관모집유형 등)에 관한 정보를 제공함데이터 제공 항목은 사업 참여 대학명, 사업명, 사업 장학연도, 사업 학기, 사업 회차, 기관모집유형(대학발굴형), 기관모집유형(멘토발굴형)이 있습니다. 다문화·탈북(이주 북한배경)학생 멘토링장학금은 이주 북한배경 학생과 대학(원)생 간 매칭을 통해 이주 북한배경학생의 학교생활 적응 및 기초학습을 지원하고, 대학(원)생에게는 멘토링장학금을 지원하는 것을 목적으로 합니다.※ 장학금 관련 상세 정보는 한국장학재단 홈페이지 참고(경로: 한국장학재단 홈페이지(https://www.kosaf.go.kr) > 인재육성 > 다문화·탈북학생 멘토링)'
