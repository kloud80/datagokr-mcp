summary_user: 한국콘텐츠진흥원 온라인 교육 사이트 에듀코카에서 운영하는 방송·영상, 게임, 음악·공연, 웹툰 등 콘텐츠산업 교육과정을 과정 한 건당 한 행으로 담은 목록 파일(csv, 약 167KB)로, 과정명·강사·차시수·러닝타임·난이도·교육대상·장르와 분류 등을 포함한다. 콘텐츠 분야 취업 준비생이나 기업 교육 담당자가 "웹툰 분야 입문자용 무료 온라인 강좌로 무엇이 있고 몇 차시인가"를 찾을 때 쓴다. 과정코드(edukoca_course_cd)가 유일한 식별 키라 에듀코카 수강 실적 등 같은 코드를 쓰는 자료와만 이어 붙일 수 있고, 학교코드나 행정구역 코드는 없어 학교 기본정보나 지역 통계와는 직접 연결되지 않는다.
description_portal: '한국콘텐츠진흥원의 온라인 교육 사이트 에듀코카에서 운영되고 있는 방송/영상, 게임, 음악/공연, 웹툰 등 다양한 콘텐츠산업 관련 교육과정 정보입니다. 이 데이터는 콘텐츠 관련 분야에 종사하거나 이 분야에 진입하고자 하는 수많은 인재들에게 유용한 가이드를 제공합니다. 또한, 콘텐츠 산업의 최신 트렌드와 지식을 학생들이 학습하고 습득하는 데 도움을 줄 수 있는 중요한 자료입니다. 이 데이터를 활용하면 관련 전문가들이 자신의 역량을 향상시키고, 기업체나 기관들도 직원 교육에 필요한 자료를 수집하는 데 이점을 가질 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 과정코드(문자형): 각 과정의 고유한 식별자, 과정명(문자형): 과정의 이름, 제작일자(날짜형): 과정이 언제 제작되었는지를 나타내는 정보, 러닝타임(문자형): 과정의 총 소요 시간, 연관검색어(문자형): 과정과 관련된 키워드, 강사정보(문자형): 과정 강사의 이름, 차시수(숫자형): 과정의 총 차시 수, 미리보기경로(문자형): 과정을 미리 볼 수 있는 링크, 교육대상(문자형): 과정의 적정 수강대상, 강의교재및참고문헌(문자형): 교재 및 추천 도서, 과정개요(문자형): 과정의 간략한 설명, 장르(문자형): 과정의 장르, 대분류(문자형): 대분류 항목, 소분류(문자형): 소분류 항목, 난이도(문자형): 과정의 난이도입니다.'
