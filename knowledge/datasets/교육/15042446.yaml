description_portal: 이 데이터는 한국방송통신전파진흥원에서 발급하는 자격 등에 대한 분야별 민원 현황입니다(2015~2019년). 2019년 기준으로 전파통신기사, 전파통신산업기사, 전파통신기능사 등 자격종목별 신규교부, 재교부, 명원 발급, 수수료 환불, 계산서 발급, 교육이수증, 자격신청, 취득사항 확인서, 시험 관련 확인서 등의 처리 건수를 포함합니다. 본 데이터는 자격증 민원 유형별 접수 및 처리 현황을 통계적으로 분석할 수 있도록 구성되어 있으며, 자격관리 서비스 이용 현황과 민원 처리 추이를 파악하는 데 활용될 수 있습니다. 또한 자격 발급 절차의 효율성을 검토하고 민원 서비스 품질 향상을 위한 기초자료로 활용될 수 있습니다. 데이터는 연도별, 자격종목별, 민원 항목별 건수로 구성됩니다.※취득사항확인서는 특정 다수 자격증에 대한 민원이기 때문에 전체 합에 포함
