summary_user: 한국방송통신전파진흥원이 처리한 자격증 관련 전자민원 건수를 민원년도·자격종목(구분)별로, 신규교부·재교부·자격증명원·수수료환불·시험 관련 확인서 등 민원 항목별로 집계한 통계 파일이다(포털 설명상 2015~2019년, 전국 단위). 전파통신기사 등 방송통신 분야 자격 담당자나 분석가가 '어느 종목에서 재교부나 확인서 발급 민원이 연도별로 늘었는가' 같은 민원 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국가자격 데이터(종목·합격률 등)와는 자격종목 이름을 맞춰서만 연결한다.
limits: 연도·종목별 집계 건수만 담아 개인별·건별 민원이나 처리 기간은 알 수 없다. 공통 코드가 없어 다른 데이터와 잇려면 종목명을 직접 매핑해야 한다. 포털 설명에 따르면 취득사항확인서는 여러 자격증에 걸친 민원이어서 전체 합계에 포함되는 방식이 다르므로 합계 해석에 주의한다.
