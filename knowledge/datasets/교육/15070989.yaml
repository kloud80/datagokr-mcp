description_portal: 한국유학종합시스템을 통한 해외 유학생의 온라인 입학신청 통계에는 국가별, 학사 석사 박사 등 학위 과정별, 그리고 성별로 세분화된 자료가 포함되어 있습니다. 중국과 베트남, 카자흐스탄, 우즈베키스탄 등 다양한 국가에서 학사, 석사, 박사 과정에 지원한 학생이 다수이며, 성별 분포 또한 상세히 나타납니다. 특히 중국은 학사 186명, 석사 227명, 박사 271명으로 여성 지원자가 453명으로 남성 322명보다 많아 여성 유학생 비율이 높은 특징을 보입니다. 이 자료는 한국유학박람회 및 STUDY IN KOREA 프로그램과 연결되어 국내 교육 및 국제 교류 현황을 분석하는 데 중요한 정보를 제공합니다.교육부 국립국제교육원 한국유학종합시스템(스터디인코리아) 온라인 입학신청 통계(국가별, 신청과정별, 성별)
