description_portal: 이 문서는 대한민국학술원 회원들의 다양한 학문적 업적과 삶을 다룬 다큐멘터리 "시대와의 대화" 제작과 방송 계획을 소개하며, 종양학, 한국법제사, 영양학, 사회학, 경제학 등 여러 분야에서 활약한 회원들의 연구 주제를 포함한 내용을 제공합니다. 예를 들어, 종양학 분야의 김병수 회원과 한국법제사 박병호 회원, 영양학의 맹원재 회원 등이 각자의 전문 분야에서 이룬 업적과 연구를 통해 한국 학문의 깊이를 보여주고 있습니다. 이 자료는 다학제적 연구와 학문적 공유의 중요성을 강조하는 동시에, EBS와의 협업으로 학술원의 활동을 대중에게 널리 알리는 역할을 담당합니다.대한민국학술원 회원의 학문적 업적과 삶을 조명하는 다큐멘터리로, EBS와 위탁계약 체결하여 다큐멘터리 "시대와의 대화"로 제작하여 매년 12월중에 방영됩니다.
