description_portal: 천안시 도서관에서 구입한 각종 전자도서 자료를 인터넷에 제공하며,  모바일 및 홈페이지에서 전차책을 대출 구독 가능합니다.천안시 전자책정보 데이터는 지역 시민들에게 제공되는 전자도서 서비스의 구성 현황을 한눈에 파악할 수 있도록 정리된 자료입니다. 도서공급사, 출판사, 분철 여부, 도서 카테고리, 출판일자, 저자 정보를 포함하여 다양한 전자책의 출처와 세부 속성을 제공합니다. 본 데이터는 전자도서관 운영 전략 수립, 도서 수요 분석, 분야별 콘텐츠 확충 계획 등 행정 및 서비스 개선을 위한 기초자료로 활용될 수 있습니다.
