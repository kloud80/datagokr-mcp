summary_user: 경상남도 김해시에 있는 대학·전문대학·대학원을 학교 한 곳당 한 행으로 담은 소규모 파일(csv 약 5KB)로, 학제·설립 구분·본분교·주야 구분·학교상태와 주소·연락처·위도·경도를 담는다. 김해시 안에 어떤 대학이 어디에 있는지 확인하거나, 대학 위치를 지도에 올려 주변 원룸 수요나 대학가 상권을 살펴보려는 분석가·사업자가 쓴다. 전역 조인 키가 없어 다른 대학 공시 자료(재학생·기숙사·충원율 등)와는 학교명으로 맞추거나, 좌표·주소를 기준으로 공간 연계해 쓴다.
