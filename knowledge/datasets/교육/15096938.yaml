summary_user: 제주특별자치도 내 전문대학의 학생 수와 교직원 수를 기준 연도·대학교명·구분(학생/교직원)·성별별 인원 수로 집계한 통계 파일로, 포털 설명상 2016~2020년 자료를 담는다. 지역 정책 담당자나 연구자가 "제주 전문대학의 학생 수는 해마다 어떻게 변했고 교직원 1인당 학생 수와 성비는 얼마인가"를 따질 때 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·통계와는 대학교명 매핑이나 같은 기관 자료로만 이어 쓴다.
description_portal: 이 데이터셋은 2016년부터 2020년까지 기간 동안 제주특별자치도 내에 소재한 전문대학의 학생 수 및 교직원 수를 성별 구분과 함께 연도별로 집계한 통계자료이다. 전문대학별 학생 구성 및 인력 운영 현황을 통해 교육 인프라 규모와 변화 양상을 파악할 수 있으며, 젠더 비율, 학생 수 증감, 교직원 대비 학생 비율 등 세부 지표 분석이 가능하다. 이 정보는 지역 고등‧직업 교육 체계의 상태를 점검하거나, 교육 수요와 공급의 균형, 인력 확보 현황, 정책 수립을 위한 기초 자료로 활용될 수 있다. 또한 지역 내 전문대학의 교육 여건 비교, 학생 구성 변화 추세 분석, 교직원 배치 구조 검토, 고등직업교육 정책 설계 및 평가 자료로서 공공기관, 지방자치단체, 연구기관 등에서 신뢰할 만한 참고 정보를 제공한다. 해당 자료는 CSV 형식으로 제공되며 누구나 다운로드하여 분석에 활용할 수 있다.
