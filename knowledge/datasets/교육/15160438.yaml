description_portal: 보은군 평생학습 프로그램은 지역 주민들이 나이, 직업, 배경과 상관없이 언제든지 자신이 원하는 분야를 배우고 성장할 수 있도록 운영하는 교육 시스템입니다. ‘평생학습’이라는 말처럼, 어린 학생부터 시니어까지 모두가 배움의 기회를 평생 누릴 수 있도록 지원하는 게 핵심입니다.이 프로그램들은 크게 여러 분야로 나뉘는데, 예를 들면 컴퓨터나 스마트폰 사용법 같은 정보화 교육, 그림·음악·공예 같은 문화예술 교육, 건강관리나 운동 같은 생활 체육 프로그램, 그리고 자격증 준비나 취업에 도움이 되는 직무능력 강화 교육 등이 있습니다.이런 다양한 프로그램들이 보은군평생학습관에서 열립니다.왜 이렇게 다양하냐 하면 주민들의 삶의 질을 높이고, 사회적 소통도 활발하게 하면서 지역 공동체가 더 건강해지도록 하는 게 목적입니다. 평생학습을 통해 새로운 친구를 만나고, 자기 자신에 대한 자신감도 키울 수 있습니다데이터 측면에서 보면, 보은군은 해마다 몇 명이나 프로그램에 참가했는지, 어떤 강좌가 인기가 많았는지, 참여자들의 만족도는 어떠한지 꼼꼼히 조사합니다. 이런 데이터를 기반으로 어떤 강좌를 좀 더 늘리고, 어떤 부분을 보완할지 계속 계획하며 운영 중입니다.즉, 보은군 평생학습 프로그램은 단순히 교육을 넘어서 주민들의 생활 전반에 긍정적인 변화를 끌어내는 ‘학습 공동체’ 역할을 톡톡히 하고 있는 셈입니다.
