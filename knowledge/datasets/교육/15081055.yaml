summary_user: 서울시가 운영하는 공공서비스 예약 건을 서비스 한 건 단위로 담은 원천 목록으로, 서비스 분류·상태·이름·장소·이용대상·결제방법·접수 및 이용 기간·이용 시간·좌표·예약 바로가기 주소·취소 기준을 포함한다. 시민이 "이번 주말 우리 구에서 지금 접수 중인 무료 체육시설이나 강좌가 있나"를 찾거나, 분석가가 자치구별 공공서비스 예약 공급 현황을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 지역명(AREANM)·장소명 같은 이름 매핑이나 좌표(X, Y) 기반 공간 결합으로만 이어 쓴다.
description_portal: 서울시 공공서비스예약 종합 정보는 서울시에서 제공하는 다양한 공공서비스를 한곳에서 조회하고 예약할 수 있도록 구성된 데이터입니다. 예약 가능한 서비스의 구분, 분류체계, 상태, 서비스명과 함께 이용 대상, 결제방법, 장소, 상세내용, 연락처 등이 포함되어 있어 시민이 필요한 공공서비스를 쉽게 찾고 이용할 수 있도록 돕습니다. 또한 서비스와 접수의 시작·종료일시, 이용 가능 시간, 지역 정보, 위치 좌표를 제공해 시간·공간적 조건에 맞는 서비스를 선택할 수 있으며, 바로가기 주소와 이미지 정보로 온라인 예약과 사전정보 확인이 가능합니다. 더불어 취소 기준과 마감 시간 정보까지 포함하고 있어 이용자가 예약과 취소를 체계적으로 관리할 수 있는 통합 행정서비스 데이터입니다.
