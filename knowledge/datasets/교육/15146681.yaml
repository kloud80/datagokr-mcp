summary_user: 광진구 관내 유치원별로 공기질 점검, 정기 소독, 미성년 음용수(지하수) 수질검사, 미세먼지·조도 점검의 일자와 결과를 한 행씩 담은 유치원알리미 기반 원천 자료다. 학부모가 '우리 동네 유치원이 실내 공기질과 소독 점검을 언제 받았고 결과가 적합했는가'를 확인하거나, 분석가가 구 단위 유치원 위생관리 실태를 비교하는 데 쓴다. 전역 조인 키는 없어서 유치원 코드(KINDERCODE)나 유치원명·주소로 같은 유치원알리미 계열 데이터나 어린이집 자료와 맞춰 이어 쓴다.
description_portal: 서울특별시 광진구 유치원 환경위생관리 현황 데이터는 서울열린데이터광장(data.seoul.go.kr)을 통해 제공되며, 갱신 주기는 월간입니다. 이 데이터는 광진구 관내 유치원의 실내외 환경 및 위생 관리 실태를 확인할 수 있는 자료로, 유아의 건강과 안전을 위한 교육환경 조성 현황을 파악하는 데 활용됩니다. 정보는 유치원알리미(e-childschoolinfo.moe.go.kr) 시스템을 기반으로 하며, 해당 플랫폼을 통해 유치원의 다양한 운영 정보를 열람할 수 있습니다. 관련 문의는 성동광진교육지원청(02-2286-3741)으로 하시면 됩니다. 이 데이터는 교육시설 위생관리 정책 수립과 유아 보건안전 대응체계 마련에 활용할 수 있습니다.
