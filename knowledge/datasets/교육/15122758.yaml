summary_user: 경기도인재원의 소속 기관과 부서를 한 행씩 담은 조직정보 목록으로, 소속 코드·명칭, 상위 소속, 부서명, 조직 레벨, 조직 전체 코드, 하위부서 여부를 담는다. 경기도인재원의 조직도를 그리거나 특정 부서가 어느 상위 조직에 속하는지 확인하려는 행정 담당자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 부서명·코드 매핑이나 같은 기관 코드로만 잇고, 내부 계층은 상위소속코드(up_positn_cd)로 묶는다.
description_portal: 이 데이터는 경기도인재원의 소속 기관 및 부서의 조직 정보를 체계적으로 정리한 자료로, 각 소속의 코드, 명칭, 상위 소속 정보, 부서명, 조직 레벨, 조직 전체 코드, 하위부서 여부 등의 항목으로 구성되어 있습니다. 조직의 계층 구조는 상위소속코드와 조직전체코드로 명확히 구분되며, 소속시퀀스번호를 통해 고유 식별이 가능합니다. 이 자료는 수원시 및 산하기관의 행정조직 구조를 파악하고, 공공기관의 조직도 생성, 기관별 책임부서 분류, 행정정보 시스템 설계 및 관리 등 다양한 공공행정 분야에서 활용될 수 있습니다.
