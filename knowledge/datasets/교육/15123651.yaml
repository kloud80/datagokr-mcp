summary_user: "국내외 대학·기관이 자발적으로 공개한 강의 동영상·강의자료를 강의 한 건 단위로 담은 파일(CSV, 약 2.1MB)로, 강의명·대학·교수·전공 대분류와 중분류·학년학기·학습자원언어·라이선스·등록일시·바로가기 URL을 포함한다. 학습자나 교수자가 '특정 전공(예: 컴퓨터공학)에서 공개된 강의 중 재사용이 허용된 라이선스의 강의는 어느 대학의 어떤 것인가'를 찾거나, 서비스 개발자가 전공별 공개강의 추천·비교 목록을 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 대학명이나 전공 분류명을 이름으로 맞춰 연결해야 한다."
description_portal: 제공하는 데이터는 국내외 대학 및 기관에서 자발적으로 공개한 강의 동영상과 강의자료의 전공별 정보를 체계적으로 제공하는 공공데이터입니다. 데이터에는 강의명, 대학명, 교수명, 전공 대분류·중분류, 학년학기, 학습자원언어, 라이선스, 등록일시, 강의 바로가기 URL 등 다양한 항목이 포함되어 있습니다. 각 대학 및 기관이 직접 등록한 강의 자료를 기반으로 하며, 고등교육의 교수학습자료 공유 및 학습 접근성 확대 정책에 따라 수집·관리됩니다. 데이터는 시스템에서 수시로 갱신되어 최신 강의 현황을 반영합니다. 이 데이터는 대학생, 교수자, 일반 학습자 등 누구나 전공별 강의자료를 활용할 수 있도록 지원하며, 교육과정 비교, 온라인 강의 서비스 개발, 교수학습자료 연구, 자기주도 학습, 학습자 맞춤형 추천 등 다양한 분야에서 활용됩니다
