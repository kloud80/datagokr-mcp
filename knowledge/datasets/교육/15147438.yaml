description_portal: 이 데이터는 서울연구원에서 수행하는 ‘작은연구 지원사업’ 연구과제 보고서 현황을 정리한 자료입니다. 연도별로 추진된 연구과제의 제목, 작성일, 식별자(URL), 저작권 안내, 간략한 연구 개요 및 보고서 파일 링크가 포함되어 있습니다. 이를 통해 특정 연도의 작은연구 과제 목록과 연구 주제를 확인할 수 있으며, 각 보고서는 도시재생, 청년 문제, 환경, 문화, 복지, 교육, 안전 등 다양한 분야를 다룹니다. 이 자료는 시민 주도의 소규모 연구를 기록·관리함으로써 서울시 정책 연구의 다양성과 창의성을 반영하고, 학계 및 정책 현장에서 참고할 수 있는 기초 데이터를 제공합니다. 특히 사회적 약자 지원, 도시환경 개선, 청년문화 활성화 등 실질적 정책 대안을 발굴하는 데 중요한 자료로 활용됩니다.
