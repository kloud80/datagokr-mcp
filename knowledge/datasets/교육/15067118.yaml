summary_user: 초·중등 음악 교과의 학습자료를 자료 한 건씩 정리한 목록으로, 과목·주제·부제·제목·키워드와 에듀넷 바로가기 웹주소를 담는다(CSV 파일 약 15.8KB). 교사가 "이 단원 주제에 맞는 음악 수업자료가 에듀넷에 무엇이 있나"를 찾거나, 교육 콘텐츠 개발자가 주제별 자료 분포를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주제·키워드 같은 이름 매칭이나 같은 기관의 다른 교과별 학습자료 목록과 나란히 놓는 방식으로만 잇는다.
description_portal: 제공하는 데이터는 초·중등학교 음악 교과의 다양한 주제별 학습자료를 체계적으로 정리하여 제공하는 교육 공공데이터입니다. 해당 데이터는 음악 교과 교육과정에 따라 주제별로 분류된 학습자료의 제목, 과목, 주제, 부제, 키워드, 바로가기 URL 등 구체적인 정보를 포함하고 있습니다. 자료는 에듀넷에서 개발 및 운영하는 교수학습자료를 기반으로 하며, 교육 현장 및 교과과정의 변화에 맞춰 신규 자료가 추가되거나 기존 자료가 갱신되는 방식으로 수집·관리됩니다. 데이터의 보유근거는 「초·중등교육법」에 따라 국가 교육정보화 및 교수학습 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 근거합니다. 업데이트 주기는 수시(1회성 데이터)로, 교육과정 개정이나 신규 자료 개발 시마다 최신 자료로 반영됩니다. 해당 데이터는 교사들의 수업자료 준비, 학생들의 자기주도 학습, 교육 콘텐츠 개발, 교육 연구 등 다양한 교육 현장에서 활용될 수 있습니다.
