description_portal: 본 데이터는 한국사학진흥재단에서 실시하는 연수 프로그램에 참여 신청한 대학 및 교육기관의 고객 관리 정보를 담고 있습니다. 데이터는 연수를 신청한 대학교명(학교법인 및 특수학교 포함), 해당 기관의 소재지 주소, 연수 신청 권수, 데이터 등록일 등의 항목으로 구성되어 있습니다. 사립대학 교직원 및 고등교육 관계자 대상 연수사업의 기관별·지역별 참여 현황 분석, 연수 수요 파악, 지역별 연수 홍보 전략 수립에 유용하게 활용될 수 있으며, 고등교육 관련 연수 정책 개발 및 맞춤형 교육 서비스 제공을 위한 기초 행정 통계 자료로 활용이 가능합니다.
