description_portal: '○ 통계개요* 통계명 : 자율고등학교(국·공립)(2011년 이후)* 통계종류 : 국·공립 자율고등학교 현황을 제공하는 지정·보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적·종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획·시행·평가·연구 등에 주요 정보를제공, 국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 학교 → 구 교육청 → 서울특별시 교육청 → 한국교육개발원* 공표주기 : 정기(매년, 4월 기준)* 공표범위 : 지역 - 서울시 및 자치구,내용 - 자율고등학교(국ㆍ공립)의 학교수, 학생수, 교원수 현황 등'
