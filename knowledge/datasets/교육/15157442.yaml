description_portal: 본 데이터는 국립호남권생물자원관의 2026년 2월 12일 기준으로 작성된 현장교육 운영 현황에 대한 정보입니다. 구성 항목은 일련번호, 프로그램명, 내용, 시작일, 종료일, 장소, 대상, 상세정보로 이루어져 있으며, 일련번호는 1번부터 10번까지 오름차순으로 정렬되어 있습니다. 프로그램명 항목은 "자원관이 살아있다", "(박사님과 함께하는 고하도원정대)가을에 만난 나그네, 새", "크리스마스 별누리, 업사이클링 리스만들기" 등 다양한 체험교육 프로그램의 명칭으로 구성되어 있고, 장소는 주로 국립호남권생물자원관으로 통일되어 있습니다. 대상 항목에는 초등학생, 중학생, 성인 등 다양한 연령층이 포함되어 있으며, 일부 프로그램은 늘봄신청과 일반신청으로 구분되어 운영되고 있습니다. 내용 항목에는 "상설전시실에서 생물자원 미션 해결하기", "새 박사님과 함께 하는 탐조프로그램", "지구도 행복한 업사이클링마스" 등 각 프로그램의 주제와 활동 내용이 기술되어 있어 참여자의 이해를 돕습니다. 시작일과 종료일은 2025년 11월부터 2026년 2월까지의 기간을 포함하고 있으며, 상세정보 항목에는 각 프로그램별 홈페이지 링크가 제공되어 있습니다. 해당 데이터는 생물자원 교육 프로그램 기획, 운영 현황 분석, 홍보자료 작성 등에 활용될 수 있으며, 기관의 교육 활동 이력을 체계적으로 관리하는 데 유용한 자료입니다. 다양한 연령층과 학습 대상을 고려한 현장교육 프로그램 구성에도 참고할 수 있습니다.
