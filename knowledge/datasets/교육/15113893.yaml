summary_user: 한국장학재단의 학자금대출 상품(일반상환, 취업후상환, 농촌출신대학(원)생 융자 등)별로 한 학기에 실행 가능한 최고·최저 기준금액을 상품 단위로 정리한 전국 단위 기준표로, 518바이트 크기의 작은 CSV 파일입니다. 대학(원)생이나 학부모가 "취업후상환 학자금대출로 한 학기에 최대 얼마까지 빌릴 수 있나"처럼 상품별 대출 한도를 확인하거나, 분석가가 상품 간 한도를 비교할 때 쓴다. 공통 조인 키는 없어서, 다른 학자금대출 실적·이용 데이터와는 대출상품명을 이름으로 맞춰 이어 쓴다.
limits: 상품별 기준 한도만 담고 있어 개별 학생이 실제로 받을 수 있는 금액은 알 수 없으며, 실제 실행 금액은 소속 고등교육기관과 신청 상품에 따라 달라진다. 학기별 한도가 없는 상품은 금액 대신 "한도없음"이라는 문자열로 표시되므로 숫자로 계산할 때 따로 처리해야 한다. 다른 데이터와 묶을 전역 조인 키가 없어 상품명 매핑에 의존해야 한다.
