summary_user: 경기도 내 대학·전문대학의 재적 학생을 기준년도·학교(학과) 단위로 집계해 재학생·휴학생·재적생 수를 성별과 정원 내·외로 나눠 담는다. 진학 희망자나 교육정책 분석가가 특정 대학·학과의 학생 규모와 휴학 비중이 해마다 어떻게 변하는지 확인하는 데 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어, 다른 학교 기본정보·교원·재정 데이터와는 학교명 매칭이나 같은 기관(경기도) 데이터의 코드로만 연결한다.
description_portal: 이 데이터는 대학 및 전문대학의 재적 학생 현황을 정리한 자료로, 학교와 학과별로 재학생과 휴학생 규모를 성별 및 정원 내·외 기준으로 구분하여 제공합니다. 주요 항목에는 기준년도, 학교종류명, 설립구분명, 학교명, 학과명, 주야구분명, 학과특성 및 상태(기존·폐과 등), 재학생 수, 휴학생 수, 재적학생 총합 등이 포함되어 있습니다. 이를 통해 특정 학교나 학과의 학생 규모와 학과 운영 상태를 파악할 수 있으며, 성별 및 정원 내·외 비율을 바탕으로 학생 구성의 특성과 변화를 분석할 수 있습니다. 이 데이터는 고등교육 기관의 학과별 학생 분포, 휴학 및 재학 패턴 연구, 학과 운영 현황 점검, 대학의 학사관리 및 교육정책 수립에 활용될 수 있습니다.
