description_portal: 한국산업인력공단에서 관리중인 능력개발포털(HRD4U 정보시스템, https://www.hrd4u.or.kr)에서 제공하는 HRD콘텐츠 중, 영상 콘텐츠의 과정에 대한 정보입니다.HRD4U 의 HRD콘텐츠는 PDF,PPT 형태의 교재와 LMS형태로 제공되는 영상 콘텐츠로 구분되어 있는데,이 데이터는 교재와 관련된 데이터로, 해당 파일의 제목 및 연결되는 국가직무능력(NCS)코드와 체계 등을 제공하고 있습니다.특히, 관련된 코드와 체계를 4단계까지 세분화하여 보여주고 있습니다.
