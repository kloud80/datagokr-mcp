summary_user: 경기도 소재 전문대학원의 졸업생 진로를 기준연도·대학원·단과대학·학과(전공)별로 묶어, 석사·박사 과정마다 학위취득자 수와 취업·진학·입대·외국인유학생·취업불가능·기타·미상 인원을 담은 집계 자료다. 고등교육 정책 담당자나 연구자가 "경기도 전문대학원의 어느 전공에서 박사 졸업자의 취업자 비중이 높은가"처럼 학위 과정별 진로 분포를 비교하는 질문에 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어, 학교 기본정보나 다른 교육 통계와는 대학원명·학과명 같은 이름 매핑으로만 붙인다.
description_portal: 졸업생의 취업현황(전문대학원) 데이터는 경기도에 소재한 전문대학원의 졸업생 취업 및 진로 현황을 제공하는 교육 통계자료입니다. 주요 항목으로는 학교종류명, 설립구분명, 대학원명, 졸업연도시기, 단과대학명, 학과명(전공), 학과특성명 등이 있으며, 석사와 박사 과정별로 학위취득자합계, 취업자수, 진학자수, 입대자수, 외국인유학생수, 취업불가능자수, 기타인원수, 미상인원수 등이 포함됩니다. 이를 통해 졸업생의 진로 분포와 취업 경향을 확인할 수 있으며, 학위 과정별 취업 성과를 비교·분석할 수 있습니다. 데이터는 건강보험 DB 연계를 통한 취업통계 기반으로 제공되며, 학교별 취업률은 직접 산출되지 않지만 전문대학원의 교육성과와 사회 진출 특성을 파악하는 데 유용합니다. 이 자료는 고등교육 정책 수립, 대학원 교육 개선, 취업지원 프로그램 기획, 외국인 유학생 정책 연구 등 다양한 분야에 활용될 수 있습니다.
