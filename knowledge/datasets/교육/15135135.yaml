description_portal: 어린이에게 경제개념을 알기 쉽게 전달하기 위해 재정경제부가 운영하는 어린이 경제교실 홈페이지에 등록된 교육용 콘텐츠 자료입니다. 해당 자료는 경제상식과 핵심 경제개념을 중심으로 구성되어 있으며, 금융, 시장, 무역, 소비, 예산, 세금, 저축, 투자 등 총 8개 주요 분야의 기초 개념과 세부 개념을 포함하고 있습니다. 각 개념은 어린이 눈높이에 맞춰 보다 쉽고 간결하게 설명되어 있어 경제적 개념과 이해가 부족한 어린이들에게 경제에 대한  기초 이해력을 높이는 데 효과적입니다. 본 자료는 학교수업, 가정학습, 방과 후 활동과 특별활동 등 다양한 교육환경에서 활용가능하며, 아동의 합리적 소비습관과 올바른 경제인식 형성을 지원하는데 그 목적이 있다고 할 수 있습니다. 친숙한 사례를 통해 경제개념을 설명하여 정보접근성과 교육효과를 높일 수 있는 경제교육의 기초자료로서 활용도가 높습니다.
