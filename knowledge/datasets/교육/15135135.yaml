summary_user: 재정경제부 어린이 경제교실에 실린 교육용 경제용어를 용어명(경제용어)과 쉬운 설명(용어설명)을 한 쌍으로 묶어 담은 용어집형 파일(CSV 약 78KB)이며, 금융·시장·무역·소비·예산·세금·저축·투자 분야의 기초 개념을 다룬다. 교사나 학부모가 '세금이나 저축을 아이에게 어떻게 설명할까'를 찾을 때, 또는 분석가가 어린이용 경제 용어사전이나 학습 챗봇의 기초 사전을 만들 때 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키는 없으며, 용어명 문자열로 다른 경제용어 사전과 대조하는 정도로만 잇는다.
