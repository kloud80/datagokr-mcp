summary_user: 울릉군에서 운영 중인 학원과 교습소를 한 곳씩 행으로 담은 현황 파일로, 지역·명칭·분야·등록일·문의처와 데이터기준일을 담는다(CSV 381바이트의 소규모 파일). 학부모나 학생이 울릉군에 어떤 분야의 학원·교습소가 있고 어디에 연락하면 되는지 확인할 때, 또는 분석가가 도서 지역의 사교육 인프라 규모를 볼 때 쓴다. 전역 조인 키가 없어 다른 교육지원청의 학원·교습소 현황 파일과는 컬럼을 맞춰 이어 붙이고, 학교 정보 등 다른 데이터와는 지역명이나 학원명을 매칭해 연결한다.
limits: 표준 기관코드나 학원 등록번호 같은 공통 키가 없어 다른 데이터와 정확한 조인이 어렵고, 이름·지역 매칭에 의존해야 한다. 좌표 등 공간 정보가 없어 지도 분석에는 바로 쓰기 어렵다.
