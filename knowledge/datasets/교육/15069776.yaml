description_portal: 국외인적자원관리시스템(HURIK)은 정부초청장학생을 포함한 글로벌 인재 데이터를 사업별과 연도별로 체계적으로 관리하여 등록 현황을 집계하고 있다. 이 시스템은 BRICs 및 ABC 국가 대학생 초청연수, EPIK 영어 프로그램, GKS 우수교환학생 및 우수자비유학생 선발관리, 그리고 TOPIK 성적우수자 초청연수 등 다양한 사업의 연도별 선발 및 누적 인원 데이터를 포괄한다. 각 사업은 다양한 국가와 학생을 대상으로 지속적으로 운영되어 왔으며, 미리보기 자료를 통해 일부 데이터가 공개되어 전체 내용은 별도로 다운로드하여 확인 가능하다. 또한 교원해외파견 사업 등의 특수 목적 프로그램도 포함되어 있어, 이 자료는 다각적인 국제 교육 교류 현황을 파악하는 데 유용하다. 과거 등록인원 데이터도 정기적으로 업데이트되어 최신 정보를 제공하고 있다.국립국제교육원이 선발 및 관리하는 정부초청장학생을 포함한 글로벌인재데이터를 국외인적자원관리시스템(HURIK)로 관리하고 있으며, 그 관리인원을 사업별, 연도별로 집계한 현황 자료
