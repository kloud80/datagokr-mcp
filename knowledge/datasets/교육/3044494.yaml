summary_user: 제주특별자치도 내 학원 13,177건을 학원 한 곳당 한 행으로 담은 건별 원천 데이터로, 등록일은 1990-02-22부터 2025-10-31까지다. 학원 분야·교습과목·교습비·정원·강사수가 있어, 학부모나 분석가가 동네에 어떤 분야 학원이 얼마의 교습비로 몰려 있는지 살필 때 쓴다. 조인 키는 학원주소(address)뿐이라, 같은 주소 체계의 다른 시설·상권·주택 데이터와 주소로 맞춰 이어 쓴다.
