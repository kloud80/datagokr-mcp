summary_user: 서울특별시성북강북교육지원청 관할 유치원·초·중·고·특수학교를 학교 한 곳당 한 행으로 담은 목록 파일(csv, 약 13KB)로, 설립구분·지역·학교급·학교명·주소·전화번호를 담는다. 학부모나 주민이 성북구·강북구 일대에 어떤 학교급의 국·공·사립 학교가 어디에 있는지, 연락처는 무엇인지 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서 다른 학교 통계·재정 자료와는 학교명·주소를 맞춰 붙여야 한다.
description_portal: 서울특별시교육청 성북강북교육지원청 관할 국·공·사립 유치원, 초등학교, 중학교, 고등학교 및 특수학교의 현황 정보를 제공하는 데이터입니다. 학교명, 학교급, 설립구분, 주소, 전화번호 등 교육기관 기본정보를 포함하며, 학생·학부모의 학교 정보 확인, 교육행정 업무 지원, 교육정책 수립, 교육 관련 연구·분석 및 대국민 정보 제공을 위한 기초자료로 활용할 수 있습니다. 관내 학교 현황 파악, 교육통계 작성, 교육서비스 안내, 지역 교육여건 분석 및 학교 정보 검색 등에 활용 가능합니다.(기본 학교정보 등 제공)
