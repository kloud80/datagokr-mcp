description_portal: '평택시 평생학습센터 정기교육 정보는 평택시 대표 홈페이지 DB 데이터로서 시민의 학습 기회를 확대하고 다양한 교육 콘텐츠를 체계적으로 제공하기 위해 운영 중인 정기 강좌의 내용을 정리·관리하여 수집한 자료입니다. 이를 공공데이터로 개방함으로써 시민은 관심 있는 분야의 교육 프로그램, 강의 일정, 수강료 등을 쉽게 확인할 수 있으며, 교육 참여 접근성을 높일 수 있습니다. 또한 민간 교육기관·연구기관은 지역 학습 수요 분석, 교육 참여 패턴 연구, 신규 프로그램 개발, 맞춤형 학습 서비스 구축 등 다양한 분야에 활용할 수 있습니다. 본 데이터에는 강좌명, 장소,접수기간 등 교육 운영에 필요한 상세 정보가 포함되어 있어 시민의 학습 선택을 보다 정확하고 편리하게 지원합니다. 이러한 자료는 평생교육 활성화, 지역 인재 육성, 교육격차 완화, 민·관 협력 기반 학습 생태계 조성 등 공공·민간에서 활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
