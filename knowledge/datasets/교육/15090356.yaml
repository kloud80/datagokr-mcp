summary_user: 2021년 무렵 운영된 근로자직무향상 원격훈련 과정을 과정 단위로 나열한 전국 범위 파일(CSV 약 18KB)로, 과정명과 함께 담당 청·지청·고용센터, 훈련기관 유형, 분류, 훈련방법, 훈련시작일을 담는다. 직업훈련 분석가나 재직자 교육 담당자가 '2021년에 어느 고용센터 관할에서 어떤 분야의 원격 직무향상 과정이 열렸나'를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 훈련·자격 데이터와는 고용센터명·과정명 같은 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 한국산업인력공단에서 모니터링을 위해 운영중인 근로자직무향상 훈련 내 원격훈련 훈련기관과 관련한 지부지사명, 고용노동부 지청, 훈련과정명 등 정보입니다.해당 데이터는 과거(2021)년 당시 운영되었던 근로자직무향상과정을 위주로 구성되었으며, 각 과정명과 해당 과정을 담당하였던 각 고용노동부 지청(고용센터명)의 내용을 담고 있습니다. hrd-net 연계데이터로서 정보가 제공되었으며, 근로자직무향상과정 사업에 참여 중인 행정 업무 권한을 받은 담당자는 hrd-net을 통하여 확인 가능한 정보입니다.
