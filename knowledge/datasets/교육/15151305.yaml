description_portal: 해당 데이터는 보육교사 설문응답을 바탕으로 제작되었고, 스트레스 및 사직,이직의 고위험군 정보가 들어있는 종속변수가 포함되어 있습니다. 데이터를 통해 AI모델에게 교사 개인 특성과 업무 현장에 관한 독립변수들을 효과적으로 학습시키고, 스트레스 및 사직 위험에 대한 분류(Classification)예측이 가능합니다. 한국보육진흥원이 개방한 데이터는 교사 처우(복지, 계약 안전성, 권익 보호 등)를 개선하는데 활용되어 보육교사들의 현장 이탈을 막고, 보육교사들의 스트레스 위험 정도에 대한 예측을 통해 사전에 스트레스 고위험군을 식별하여 개별 관리하는 등의 어린이집 운영 최적화에 사용될 수 있는 유효한 정보를 포함하고 있습니다. 아동 안전 및 보육 품질의 전반적인 개선에 앞서 보육교사에 대한 직무환경 파악이 필요합니다.
