description_portal: 이 문서는 한국역사정보통합시스템에서 제공하는 고문서 데이터를 중심으로 한 역사자료 데이터베이스의 메타데이터 정보에 대해 설명합니다. 특히 주기적으로 제공된 과거 데이터 3건은 2019년부터 2021년까지의 메타데이터 정보를 포함하여 고문서와 역사정보의 연계성을 보여주고 있습니다. 이러한 데이터는 역사연구와 정보통합에 중요한 역할을 하며, 시스템 활용을 통해 다양한 역사자료 접근이 가능함을 알 수 있습니다.** 역사자료DB 연계 검색 사이트인 한국역사정보통합시스템(http://www.koreanhistory.or.kr/)의 고문서 데이터
