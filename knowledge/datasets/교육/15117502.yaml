description_portal: 본 데이터는 인천광역시 미추홀구에서 추진하는 ‘한 도시 한 책 읽기’ 사업의 일환으로 선정된 도서 현황을 수록한 자료입니다. ‘한 도시 한 책 읽기’ 운동은 1998년 미국 시애틀에서 시작된 독서문화운동으로, 우리나라에는 2003년부터 소개되어 여러 도시에서 확산되었습니다. 미추홀구는 2013년부터 해당 사업을 운영하며, 주민과 독서동아리 회원, 독서 전문가, 지역 예술인 등이 추천한 후보 도서를 대상으로 주민투표와 전문가 심사, 도서관운영위원회의 검토 과정을 거쳐 최종 도서를 선정합니다. 데이터에는 연도별, 연령대별(아동·청소년·성인)로 선정된 도서명, 저자, 출판사 등이 포함되어 있으며, 이를 통해 구립도서관, 학교도서관, 사립 작은도서관, 독서동아리, 공동주택, 직장인, 공무원 등 다양한 지역사회와 연계하여 활용됩니다. 본 자료는 주민이 책을 매개로 소통하고 공감하며 건강한 토론 문화를 형성하는 데 기초자료로 제공되며, 더 많은 주민 참여를 독려하기 위한 독서문화 활성화 정책에도 활용됩니다. 또한 미추홀구는 책 읽는 도시 조성을 목표로 지속적으로 도서 선정 및 독서문화 기반을 확산해 나가고 있으며, 데이터는 정기적으로 갱신되어 최신 선정도서 현황을 반영합니다.
