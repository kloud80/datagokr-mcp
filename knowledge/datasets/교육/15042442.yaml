summary_user: 한국방송통신전파진흥원이 관리하는 전파전자통신·무선설비 계열 국가기술자격 종목별로 자격증 신규발급, 재발급, 정정발급 건수와 합계를 담은 전국 단위 집계표이다(csv 약 927바이트의 소규모 파일). 자격 행정 담당자나 분석가가 '전파 분야 자격증은 신규발급 대비 재발급·정정발급 비중이 얼마나 되는가' 같은 발급 유형별 운영 현황을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 종목명(종목) 문자열 매칭으로만 잇는다. 같은 기관의 시험 일정·합격률 자료나 채용·인허가 요건 자료가 연결 대상이다.
