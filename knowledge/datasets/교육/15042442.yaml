description_portal: 이 데이터는 한국방송통신전파진흥원이 관리하는 국가기술자격 자격증 발급 현황을 정리한 것입니다. 전파전자통신기사, 전파전자통신산업기사, 전파전자통신기능사, 무선설비기사, 무선설비산업기사 등 주요 자격종목별 자격증 신규발급, 재발급, 정정발급 건수를 포함합니다. 각 항목은 발급 유형별 건수와 전체 합계로 구성되어 있습니다. 본 데이터는 국가기술자격 합격자의 자격증 발급 현황을 분석하여 자격 관리의 효율성과 행정 절차의 투명성을 확보하기 위한 기초자료로 활용될 수 있습니다. 또한 발급 유형별 비중을 통해 자격제도의 운영 현황을 파악하고, 전자민원 기반 자격증 발급체계 개선에 참고 자료로 활용될 수 있습니다. 데이터는 자격종목별 발급 통계를 기반으로 매년 관리 중입니다.
