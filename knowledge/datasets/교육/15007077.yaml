summary_user: 강원특별자치도 내 자동차 운전전문학원을 학원 한 곳당 한 행으로 정리한 목록으로, 지역·학원명·전화·팩스·우편번호·소재지를 담은 작은 CSV 파일(약 1.9KB)이다. 운전면허를 따려는 주민이 '우리 시군에 있는 운전학원이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시군별 운전학원 분포를 볼 때 쓴다. 공통 조인 키가 없으므로 다른 데이터와는 소재지 주소(좌표 변환 후)나 학원명·지역명 매칭으로 이어 쓴다.
