summary_user: 서울특별시 종로구 관내 유치원별로 공제회 가입 여부와 가입 관련 기본정보를 담은 기관 단위 목록으로, 교육청·교육지원청, 유치원명, 설립유형, 주소와 함께 학교안전공제회·교육시설안전공제회 가입 여부(SCHOOL_DS_YN, EDUCATE_DS_YN로 추정)가 들어 있다. 학부모나 교육행정 담당자가 '종로구의 어느 유치원이 안전 관련 공제회에 가입하지 않았는가'를 확인하거나 구 단위 가입률을 따질 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 유치원알리미 계열의 다른 유치원 데이터나 어린이집 데이터와는 유치원명·주소 매칭이나 같은 기관의 유치원 코드(KINDERCODE)로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 유치원의 공제회 가입현황을 제공하는 공공자료입니다.자료에는 각 유치원의 가입 여부와 관련 기본정보가 포함되어 있으며, 유치원의 안정적 운영과 교직원 복지 향상을 지원하기 위한 정책 추진에 활용됩니다.이 데이터는 교육청 및 지방자치단체가 공제회 가입률을 분석하고 지원대상을 체계적으로 파악하는 근거자료로 사용될 수 있으며, 유치원 운영 실태 조사, 보육환경 개선, 교육기관 안전관리 정책 수립 등에 참고됩니다. 또한 연구기관과 민간에서는 유아교육 품질 향상 방안 연구, 교육 재정 지원정책 검토 등 다양한 분야에서 활용이 가능합니다.*유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
