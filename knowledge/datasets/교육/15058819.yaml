summary_user: 경기도 소재 중·고등학교의 입학생 수를 학교별·학년도별로 집계한 통계로, 당해·이전 연도 졸업자, 검정고시 등 이수자, 외국학교 수학자, 기타 경로로 나눈 남녀·합계 인원과 비율을 담고 정원 외 입학, 재입학·편입학도 따로 센다. 교육 분석가나 정책 담당자가 "우리 시군 고등학교에 검정고시나 해외 귀국 경로로 들어온 학생이 얼마나 되고 정원 외 입학 비중은 어떤가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명·시군명 매칭이나 같은 기관(경기도)의 시군 코드(SIGUN_CD)로만 이어 붙인다.
description_portal: '이 데이터는 경기도 소재 중학교와 고등학교에 입학한 학생들의 현황을 다양한 입학 유형별로 제공하는 통계 자료입니다. 입학 시점을 기준으로 실제 입학한 학생 수를 중심으로, 당해 연도 졸업자, 이전 연도 졸업자, 검정고시 또는 교육과정 이수자, 외국학교 수학자, 기타 경로 입학생 등 여러 유형으로 세분화된 데이터를 포함하고 있습니다. 또한, 정원 내 입학생과 정원 외 입학생, 재입학 및 편입학 학생 수도 별도로 집계하여 입학 경로의 다양성을 포괄적으로 파악할 수 있도록 설계되어 있습니다.각 항목은 남학생, 여학생, 합계를 구분하여 제공하며, 전체 대비 비율 정보도 함께 포함되어 있어 성별 분석과 비율 기반 비교 분석이 가능합니다. 데이터는 학교별로 제공되며, 시군명, 지역명, 지역교육청명, 학교명, 학교급(중학교/고등학교), 설립구분(공립/사립), 주야간 구분 등의 정보를 포함하여 행정구역 및 학교 특성별로 입학생 현황을 분석할 수 있습니다.이 데이터는 학령인구 변화 분석, 교육 수요 예측, 대안 교육 진입 경로 파악(예: 검정고시, 외국학교 귀국생 등), 정원 외 입학 현황 등의 교육 정책 수립 및 연구에 중요한 기초자료로 활용됩니다. 본 데이터는 ‘학교알리미’ 시스템을 기반으로 수집되며, 경기도 AI데이터행정과에서 연 1회 갱신하여 제공하고 있습니다.'
