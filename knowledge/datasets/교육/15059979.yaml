summary_user: 한국산업인력공단이 국가자격 CBT(컴퓨터 기반 시험) 시행 정보를 전국 단위로 담은 CSV 파일(약 1MB)로, 포털 설명은 종목별 과목명·문항 수·시험시간을 담는다고 하지만 필드 목록에는 이력 일련번호·시행계획번호·지사명·액션구분·QIS 사용자 식별자가 있어 시행 처리 이력에 가까운 건별 기록으로 보인다. 수험생이나 분석가가 "이 자격 종목의 CBT 시험은 어느 지사에서 어떤 시행계획으로 진행되었나"를 확인하거나, 자격시험 준비와 운영 분석에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시행계획번호나 지사명 같은 공단 내부 코드와 이름 매핑으로만 이어 쓰며, 같은 부문의 종목·시험 일정·합격률 데이터와 연결할 때도 이 방식을 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 사업자번호나 행정코드로 다른 기관 데이터와 바로 결합할 수 없다. 공간 정보가 없는 전국 단위 데이터라 지역별 분석은 지사명에만 기댈 수 있다. 포털 설명과 실제 필드 구성이 다르므로 과목·문항 수 정보가 들어 있는지 내려받아 확인한 뒤 써야 한다.
