description_portal: 한국산업인력공단에서 모니터링을 위해 운영중인 근로자카드훈련 내 원격훈련 훈련기관과 관련한 고용노동부 지청, 센터명, 훈련과정명 등 정보입니다.해당 데이터는 과거(2023)년 당시 운영되었던 근로자카드훈련 과정을 위주로 구성되었으며, 각 과정명과 해당 과정을 담당하였던 각 고용노동부 지청(고용센터명)의 내용을 담고 있습니다. hrd-net 연계데이터로서 정보가 제공되었으며, 근로자카드훈련 사업에 참여 중인 행정 업무 권한을 받은 담당자는 hrd-net을 통하여 확인 가능한 정보입니다. (현재 예산 미배정으로 인한 업데이트 미정)
