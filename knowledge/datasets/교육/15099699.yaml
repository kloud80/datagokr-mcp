description_portal: '본 데이터는 한국청소년활동진흥원이 운영하는 국립청소년우주센터 소속 덕흥천문대에서 직접 촬영한 저작권이 없는 천체사진 자료로, 국제적으로 통용되는 NGC(New General Catalogue), IC(Index Catalogue), Sh2(Sharpless Catalog) 목록에 수록된 천체 대상에 대한 이미지가 포함되어 있다. 해당 자료는 국내 청소년 천문교육 및 대국민 과학문화 확산을 목적으로 수집되었으며, 다양한 성운, 성단, 은하 등을 고해상도로 촬영하여 JPEG 등의 이미지 파일 형식으로 구성되어 있다. 주요 수록 천체는 대표적인 방출성운(예: Sh2-101), 구상성단(예: NGC 104), 나선은하(예: NGC 891), 반사성운 및 행성상성운 등이며, 각 대상은 육안으로 식별이 어려운 미세 구조까지 포착되어 있어 교육적 가치가 높다.본 데이터는 청소년 천문동아리 활동, 자유학기제 천문학습, 과학관 전시, 온라인 과학콘텐츠 제작 등에 활용할 수 있으며, 특히 ‘저작권 제한 없는 고품질 천체 이미지’라는 점에서 대외용 콘텐츠 개발 및 커뮤니티 기반 자료 배포에도 제약 없이 사용할 수 있다. 또한, 천체의 형태 분류 학습, 별의 진화 과정 탐색, 광학 필터에 따른 이미지 분석 등의 활동에 실질적인 참고자료로 활용 가능하며, 천문학과, 교육기관, 공공천문대 등에서도 시청각 교육자료로 효과적으로 사용될 수 있다.'
