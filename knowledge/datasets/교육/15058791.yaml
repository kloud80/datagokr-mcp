summary_user: 경기도 내 초등학교를 학교 한 곳당 한 행으로 담은 기본정보 목록으로, 시군·설립구분(공립·사립)·학교명·연락처·홈페이지와 도로명·지번 주소, 우편번호, WGS84 위경도를 포함한다. 학부모나 분석가가 '우리 시군에 공립·사립 초등학교가 어디에 몇 곳 있고 연락처는 무엇인가'를 확인하거나, 통학 안전·학교 배치 분석과 지도 서비스를 만들 때 쓴다. 전역 학교코드 같은 공통 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 학교명·주소 매칭, 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '「초등학교 현황」 데이터는 경기도 내 시군별 초등학교의 현황을 제공하는 자료입니다. 주요 항목으로는 시군명(SIGUN_NM), 학교구분명(SCHOOL_DIV_NM), 설립구분명(FOUND_DIV_NM), 시설명(FACLT_NM), 전화번호(TELNO), 팩스번호(FAXNO), 홈페이지주소(HMPG_ADDR), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), WGS84위도(REFINE_WGS84_LAT) 및 WGS84경도(REFINE_WGS84_LOGT)가 포함되어 있습니다. 이를 통해 각 초등학교의 위치 정보, 설립 형태(공립·사립), 연락처 현황을 종합적으로 확인할 수 있습니다. 데이터는 교육행정, 통학 안전대책, 학령인구 변화에 따른 학교 배치 연구, 지도 서비스 구축 등 다양한 분야에서 활용 가능하며, Open API(https://openapi.gg.go.kr/ElmschlM)를 이용하면 조건별(예: 시군, 학교명) 조회가 가능합니다. 본 자료는 교육취업 분야에 속하며, 상업적 활용과 가공이 허용되어 공공정책뿐 아니라 민간 서비스 개발에도 유용하게 활용될 수 있습니다.'
