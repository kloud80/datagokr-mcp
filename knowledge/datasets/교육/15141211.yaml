summary_user: 광주광역시 지역 초·중·고·특수학교의 CCTV 설치 대수를 학교 한 곳당 한 행으로 담고, 카메라 화소수 구간별(50만~100만, 100만~200만, 200만 이상) 대수와 건물 안·밖 설치장소별 대수를 함께 싣는다. 학부모나 교육 분석가가 '우리 학교나 특정 학교급·설립구분(공립·사립·각종학교)의 CCTV가 몇 대이고 저화소 카메라 비중은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어, 다른 학교 기본정보나 통계와는 학교명·학교급 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 광주광역시교육청 학교별 CCTV설치 현황 자료입니다.  학교급별, 설립구분, 학교명, 카메라 화소수별, 설치장소별, CCTV 설치 대수 확인 할 수 있습니다.- 초등학교, 중학교, 고등학교, 특수학교 CCTV 설치 현황입니다.- 설립 구분으로는 공립학교, 사립학교, 각종학교로 구분됩니다.- 총 320개 학교의 CCTV 설치 현황 정보를 제공합니다.- 50만이상 100만미만 화소, 100만이상 200만 미만 화소, 200만 이상 화소의 카메라 정보를 제공합니다.- 학교 건물밖, 학교 건물안의 카메라수 정보와 설치장소별 합계 정보를 제공합니다.- 기준년월일은 2026. 1. 12.자 입니다.
