description_portal: 본 문서는 국립국제교육원이 운영하는 원어민중국어보조교사(CPIK) 사업에 대한 홈페이지 내 조직정보 및 사업운영조직 관련 내용을 담고 있습니다. 원어민중국어보조교사 제도는 한중교류 활성화와 중국어 교육 지원을 목적으로 하며, 관련 기관 및 교육청 연락처가 포함되어 있습니다. 이 문서는 중국어 교육의 국제적 확대와 효율적 운영을 위한 조직 구성을 상세히 안내하며 교육 현장의 원활한 지원을 돕고 있습니다. 미리보기에서는 다양한 지역 교육청과 중국 내 기관들의 연락처 정보가 공개되어 있어 실제 운영과 관리에 활용할 수 있습니다.국립국제교육원이 운영하는 원어민중국어보조교사(CPIK) 대표홈페이지 내 조직정보 안내를 위한 사업운영조직 관련 정보
