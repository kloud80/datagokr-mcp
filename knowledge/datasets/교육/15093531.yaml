description_portal: 한국과학창의재단은 수학을 딱딱하고 어려운 학문이 아닌, 놀이처럼 재미있게 즐길 수 있는 문화로 만들고자 'AskMath' 플랫폼을 통해 다양한 수학놀이 영상 콘텐츠를 제공합니다. 이는 수학적 원리를 놀이에 접목하여 학생들의 학습 동기와 흥미를 유발하고 창의적 사고력을 키우는 데 목적이 있습니다.개방 데이터는 '쌓기나무 놀이', '테셀레이션', '스키테일 암호 만들기' 등 38건의 수학놀이 영상 콘텐츠 목록입니다. 각 데이터는 놀이의 제목, 상세 방법을 안내하는 유튜브 영상 링크(이용방법), 조회수, 등록일자 정보를 포함하여, 가정이나 학교에서 쉽게 따라 할 수 있도록 구성되어 있습니다.가정에서는 학부모와 자녀가 함께 놀이 활동을 하며 자연스럽게 수학적 개념을 익히고 유대감을 형성할 수 있습니다. 초·중등학교 교사는 해당 콘텐츠를 창의적 체험활동이나 수학 수업의 보조 자료로 활용하여 학생들의 참여도를 높이고 수업을 풍성하게 만들 수 있으며, 교육용 콘텐츠 개발자는 수학과 놀이를 융합한 새로운 교육 프로그램 개발에 대한 아이디어를 얻을 수 있습니다.
