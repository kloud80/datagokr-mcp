summary_user: "KOCW(대학공개강의서비스)에 올라온 대학 공개강의를 강의 한 건씩 담은 표준데이터로, 교육 대분류·중분류, 강의명과 설명, 제공대학·교수명, 강의학기, 등록일자, 강의 URL을 담는다. 학생이나 평생학습자가 '특정 분야(예: 공학 중분류)의 무료 대학 강의를 어느 대학 어떤 교수가 열었고 어디서 들을 수 있나'를 찾을 때 쓴다. 전역 조인 키는 없어서 다른 대학 데이터와는 제공대학명 같은 이름 매칭이나 제공기관코드로만 이어 붙인다."
