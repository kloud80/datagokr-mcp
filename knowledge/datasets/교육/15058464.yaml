summary_user: 경기도 내 각급 학교의 교사(校舍) 현황을 기준년도·학교 단위로 담으며, 일반교실·교과교실·특별교실·체육집회공간·보건실·화장실·학생식당·기숙사 등 공간 유형별 개수가 들어 있다. 교육청 담당자나 분석가가 '우리 시군 학교들의 학생식당·탈의실·화장실 같은 시설이 학교 규모에 비해 충분한가'를 비교하고 교육환경 개선 대상을 고를 때 쓴다. 전역 조인 키는 확인되지 않아, 학교 기본정보나 학생·학급 통계와는 학교명·정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)·시군코드를 이름·코드로 매핑해 이어 쓴다.
description_portal: '경기도 교사 현황입니다. 학교 내의 교실, 시청각실, 컴퓨터실, 식당 등의 정보를 제공합니다.일반교실 : 학급교실 등교과교실 : 교과별 특성화된 전용교실(국어교실, 영어교실, 수학교실, 과학교실(이론) 등)이 데이터는 경기도 내 각급 학교의 교사(校舍), 즉 교육시설의 물리적 공간 현황을 정리한 자료로, 기준년도, 시군명, 지역교육청명, 학교명, 교실 및 특수시설 보유 현황 등을 포함합니다. 항목에는 일반교실, 교과교실, 특별교실, 체육집회공간, 보건실, 학생 탈의실·샤워실, 남녀 및 공용 화장실, 학생식당, 기숙사, 기타 공간 수 등이 있으며, 일부 학교는 통계 제외 여부 및 제외 사유도 함께 명시되어 있습니다. 본 데이터는 학교 시설의 물리적 인프라 분석, 교육환경 개선 정책 수립, 교육행정 자원 배분 등에 활용될 수 있으며, 각 학교의 규모와 시설구성 현황을 비교할 수 있는 기초자료로도 유용합니다.'
