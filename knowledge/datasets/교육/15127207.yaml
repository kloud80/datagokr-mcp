description_portal: 재재외국민에게 국내의 초·중등 교육과정에 따른 학교교육을 실시하기 위하여 외국에 설립된 재외 한국학교의 정보를 제공합니다. 제공되는 정보에는 국가, 학교명, 공관명, 교장, 대표전화, 팩스, 주소, 개교일자, 정부설립인가일, 현지설립인가일, 정부운영인가일, 홈페이지 링크 등이 포함되어 있습니다. 이 자료는 재외교육기관포털(okep.moe.go.kr)을 통해 수집되며, 수시로 자동 갱신됩니다. 사용자는 해당 데이터를 통해 재외 한국학교의 현황을 파악하고, 관련 정책 수립 및 연구에 활용할 수 있습니다. 자료는 XLSX 형식으로 제공되며, 공공저작물로서 자유롭게 이용 가능합니다.
