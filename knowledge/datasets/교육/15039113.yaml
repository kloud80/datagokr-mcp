description_portal: '부산광역시 북구에서 활동하는 평생학습 동아리와 관련된 정보로 동아리명, 분류, 소속단체, 설립일자, 회원수, 모임장소 등의 데이터를 제공하고 있으며,평생학습동아리란같은 주제에 관심 있는 성인들이 함께 모여 공부하는 소모임으로써, 일정한 인원의 성인들이 자발적으로 모임을 구성하여 정기적으로 만나정해진 주제에 대한 학습과 토론을 통해 공동의 관심사를 함께 생각하고 실천하는 공동체를 지향하는 모임을 말합니다. 학습동아리 등록 안내- 등록기간 : 연중 수시- 등록대상 : 북구에서 활동하고 있는 학습동아리- 등록방법 : 북구 평생학습관 홈페이지 내 ‘학습동아리’의 ‘학습동아리등록’ 코너 이용'
