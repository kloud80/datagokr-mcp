description_portal: 서울시 은평구 유치원 수업일수 현황’ 데이터는 서울열린데이터광장이 공개하는 공공데이터로서, 은평구 관내 국·공·사립 유치원의 학년도별 실제 수업일수를 집계·제공하고 있습니다. 파일 형식은 CSV와 JSON이며 REST API로도 호출할 수 있고, 하루 1회 이상 자동 갱신되어 신규 변경 사항이 신속히 반영됩니다. 각 레코드에는 교육지원청, 유치원명, 설립유형, 만 3·4·5세 및 혼합·특수학급별 수업일수, 방과후 과정 수업일수, 법정기준(180일) 대비 미달 여부, 통계 기준 학년도 등이 포함됩니다. 학부모는 이를 활용하여 유치원별 학사 일정과 방학 길이를 비교·계획할 수 있으며, 교육청은 법정일수 미달 기관을 즉시 파악해 행정지도를 진행할 수 있습니다. 또한 연구자는 감축 일수와 원격수업 효과를 정량적으로 분석할 수 있고, 지자체는 긴급 돌봄 수요 예측이나 방과후 과정 확대 지원 대상 선정을 위한 근거 자료로 활용할 수 있습니다. 주소를 지오코딩하면 GIS 분석에도 연계가 가능하여, 교육 정책 수립과 서비스 개발 전반에 유용한 데이터입니다.
