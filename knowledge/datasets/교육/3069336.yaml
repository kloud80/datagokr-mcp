summary_user: 여수시 관내 학교급식 친환경농산물 식재료 지원 대상 교육시설(학교·어린이집 등)별로 시설 구분, 학교명, 주소, 수혜 인원을 한 행씩 담은 시군구 범위 파일이다. 여수시 친환경 급식 지원 예산이 어느 학교·어린이집에 몇 명 규모로 배분되는지, 공급 품목 소요량을 가늠하려는 담당자·농가·분석가가 쓴다. 전역 조인 키(학교코드 등)가 없어 학교 기본정보나 학생 통계와는 학교명·주소를 이름 매칭해 붙여야 한다.
description_portal: ❍ 지원 개소별 수혜 대상 규모 통계- 관내 학교급식 친환경농산물 식재료 지원사업의 효율적이고 투명한 추진을 도모하고자, 관내 지원 대상 교육시설별 개소수를 교육지원청과 여성가족과의 협조를 통해 정확히 파악- 각급 학교 및 어린이집별 사업비 산정의 직접적인 기준이 되는 실질 수혜 학생 수 현황을 명확히 정립- 본 통계 자료는 예산 분배의 객관성과 형평성을 확보하는 정량적 지표가 될 뿐만 아니라, 연간 학교급식 친환경농산물 공급 품목의 소요량을 선제적으로 예측하고 관내 친환경 농가별 맞춤형 계약재배 물량을 유기적으로 조절하기 위한 핵심 행정 기초 자료로 활용
