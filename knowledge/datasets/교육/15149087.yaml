description_portal: 한국언론진흥재단의 eNIE 시스템을 활용하기 위해 등록되어 있는 학교유형 정보는 전국 교육기관의 미디어리터러시 교육 참여 현황을 파악할 수 있는 데이터 입니다.등록된 학교들은 유아교육기관, 초등학교, 중학교, 고등학교, 그리고 특수교육기관으로 명확하게 구분되어 있으며, 각 교육 단계별 특성과 요구사항을 반영한 맞춤형 뉴스활용 교육이 가능하도록 분류되어 있습니다. 이를 통해 전국에 분포한 다양한 형태와 규모의 교육기관들이 eNIE 프로그램에 참여하고 있음을 확인할 수 있습니다.특히 유아교육기관부터 특수교육기관에 이르기까지 포괄적인 교육 대상을 아우르고 있어, 연령과 교육적 필요에 관계없이 모든 학습자가 신문활용교육의 혜택을 받을 수 있는 포용적 교육 환경을 구축하고 있습니다. 이러한 학교유형 분류는 교육 정책 수립과 프로그램 개선을 위한 기초 자료로도 활용이 가능합니다.
