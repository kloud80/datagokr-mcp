summary_user: 경기도 내 초·중·고 및 기타 학교별로 기준연도(STD_YY)의 1~6학년 학년별 학급 수, 특수학급·순회학급 수, 전체 학급 합계를 담은 학교 단위 자료이며 시군명·지역교육청명·학교급·설립구분 같은 기본정보가 함께 붙는다. 교육 정책 담당자나 분석가가 '우리 시군 중학교들의 학년별 학급 수와 특수학급 배치는 어떤가'처럼 학급 배치·교원 운용을 검토할 때 쓴다. 실측 컬럼에서 전역 조인 키(표준 학교코드 등)는 확인되지 않아, 다른 학교 기본정보·교원·학생 통계와는 학교명·시군명 같은 이름 매핑으로만 이어 붙인다.
description_portal: 본 데이터는 경기도 내 초등학교, 중학교, 고등학교 및 기타 학교의 학급 수 현황을 학년별로 제공하는 자료로, 각 학교의 1학년부터 6학년까지의 학년별 학급 수, 특수학급 수, 순회학급 수, 전체 학급 총합 등을 포함합니다. 항목에는 학교명, 시군명, 지역교육청명, 학교급명, 설립구분명 등의 기본 정보가 포함되어 있으며, 교육청으로부터 인가받은 정규 학급 수 기준으로 산출됩니다. 특수학급은 통합교육을 위해 일반학교에 설치된 학급이며, 순회학급은 병원, 가정, 복지시설 등을 대상으로 특수교육을 제공하는 형태입니다. 총계 항목의 괄호 안 수치는 특수학급과 순회학급의 합계입니다. 본 데이터는 학교알리미 시스템에 기반하여 경기도 AI데이터행정과에서 연간 단위로 갱신되며, Open API 형태로도 제공되어 행정 분석, 교육 정책 수립, 학급 배치, 교사 인력 운용 등의 의사결정에 활용될 수 있습니다.
