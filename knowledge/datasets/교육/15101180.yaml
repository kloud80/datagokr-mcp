summary_user: 전년도 국가장학금 Ⅰ유형 지원금액을 학기(1·2학기), 학제(일반대·전문대), 설립형태(국립·공립·사립), 대학 소재 광역지자체별로 묶어 총수혜금액으로 담은 집계 파일이며, 금액은 해당연도 연말 기준 반환이 반영된 값이다. 정책 분석가나 연구자가 '사립 전문대와 국립 일반대 중 어느 쪽에, 어느 시도 대학에 Ⅰ유형 장학금이 얼마나 갔는가'를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 대학·지역 통계와는 기준년도·학기와 소재지 시도명, 설립형태 이름을 맞춰 이어 써야 한다.
description_portal: "전년도 학기별(1, 2학기), 학제별(일반대, 전문대), 설립별(국립, 공립, 사립), 대학소재지별(광역지자체) 국가장학금 Ⅰ유형 지원 금액 데이터입니다.※ 해당연도의 연말기준 반환이 반영된 수혜인원 및 수혜금액※ 국가장학금 Ⅰ유형 지급조건: 학자금 지원구간 8구간 이하 학생을 대상으로 성적기준을 충족한 대학생에게 지원구간에 따라 차등지원하는 장학금으로 자세한 정보는 \"한국장학재단 누리집(www.kosaf.go.kr) > 장학금 > 소득연계형 국가장학금 > 국가장학금 Ⅰ유형(학생직접지원형)\"을 확인해주시기 바랍니다.※  '25년 1학기부터 국가장학금 I유형(다자녀) 지원 대상 범위 확대(8구간→9구간)  (참고) 학자금지원구간 지원 대상 범위: ~'24년: 기초 ~ 8구간, '25년 1학기~: 기초 ~ 9구간"
