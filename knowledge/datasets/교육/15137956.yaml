summary_user: 국가기술자격 종목별 공통 편성기준을 담은 CSV 파일(약 147KB)로, 종목·편성기준버전마다 교육훈련목표, 교육훈련 기준시간 총계와 직업기초능력·필수능력단위·선택능력단위별 기준시간, 적용기준일자를 한 행씩 담는다. 교육훈련기관 담당자나 응시 준비자가 '이 자격 종목을 준비하려면 교육훈련을 총 몇 시간, 어떤 능력단위 구성으로 받아야 하나'를 확인하는 데 쓴다. 종목코드(qnet_jm_cd)로 같은 기관의 종목·시험일정·합격률 데이터와 잇고, 편성기준버전코드(organ_std_ver_cd)로 버전별 능력단위 상세 데이터와 맞춰 쓴다.
description_portal: 한국산업인력공단에서 제공하는 “국가기술자격시험 공통 편성기준정보(시험장 시설, 능력단위평가 등)”는 시험의 공정성과 객관성을 확보하고 응시자 및 감독기관이 기준을 준수할 수 있도록 시험운영의 여러 요소들을 표준화하여 제시한 공공데이터입니다. 이 데이터에는 응시자 및 감독자의 역할 및 책임, 능력단위별 평가 항목과 평가 방법, 시험 시행 시 각 단위시험에 요구되는 구체적인 출제 및 평가요소, 평가 도구 및 채점 기준, 시험 시간 및 시험 순서, 응시자 관리 절차 등이 포함되어 있어 시험제도를 준비하거나 운영하는 기관, 응시자 모두에게 필요한 상세 정보를 제공합니다. 이 데이터는 CSV형태로 제공되며, 한국산업인력공단 디지털정보국 자격정보화부에서 관리하고, 연간 단위로 갱신되며, 무료로 누구나 다운로드하여 활용할 수 있습니다.
