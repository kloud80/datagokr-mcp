summary_user: 2026학년도 공립 신규교사 임용시험의 선발 예정 인원을 교원 직종(유치원·초등·중등·특수·보건·영양·사서·전문상담)별 행과 전국 및 17개 시·도별 열로 정리한 집계표이며, 작은 CSV 파일(588바이트) 한 개다. 예비교사가 '올해 어느 시·도에서 내 과목·직종을 몇 명 뽑을 예정인가'를 보고 지원 지역을 정하거나, 분석가가 지역별 교원 신규 수요를 비교하는 데 쓴다. 전역 조인 키는 없으며, 시·도 이름(열 이름)으로 다른 시·도 단위 교육 통계와 이름 매칭으로만 이어 쓴다.
description_portal: 이 자료는 2026학년도 공립학교 신규교사 임용시험의 사전예고 현황을 정리한 것입니다. 유치원, 초등, 중등, 특수, 보건·영양·사서·전문상담 등 다양한 교원 직종별 선발 예정 인원을 전국 및 17개 시·도별로 확인할 수 있습니다. 이는 실제 시험 공고 이전에 제공되는 예비 선발 계획으로, 교원 수급 상황에 따라 일부 변동될 수 있습니다. 국민은 이를 통해 지역별 교원 수요를 한눈에 파악할 수 있으며, 예비교사들은 지원 전략을 세우는 참고자료로 활용할 수 있습니다. 보다 자세한 내용은 각 시·도교육청이 게시하는 보도자료나 기사에서 확인 가능합니다.<참고>□ (사전예고 개요) 시도교육청은 공립 신규교사 임용시험 6개월 전까지 선발 예정 인원 사전 공고  ㅇ 다만, 교원 수급 등 특별한 사유 발생 시, 시험일 3개월 전까지 예고 가능□ (사전예고 공고일) 2025. 8. 6.(수) 10시     ※ 유‧초‧중등‧특수‧비교과 신규교사 임용시험 사전예고 동시 공고□ (사전예고 방법) 17개 시도교육청별 누리집 게재□ (사전예고 선발인원) 17개 시도교육청에서 총 10,232명 ㅇ 유치원 668명, 초등 3,113명*, 중등 4,797명**, 특수교육 839명, 보건 316명, 영양 232명, 사서 45명, 전문상담 222명□ (선발인원 모집공고 일정(예정))   ㅇ (유치원·초등·특수(유·초)) 2025. 9. 10.(수) ㅇ (중등·특수(중등)·비교과) 2025. 10. 1.(수)
