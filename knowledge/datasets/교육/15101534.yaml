summary_user: 고교 취업연계 장려금에 참여하는 전국 고등학교를 장학년도별로 한 행씩 담은 학교 단위 목록 파일로, 고등학교명·고등학교유형(직업계고·일반고 등)·세부유형·학교주소·참여여부를 담는다. 고졸 취업 지원 정책 담당자나 진로 상담 교사가 "우리 지역에서 이 장려금에 참여하는 학교는 어디이고, 어떤 유형의 학교인가"를 확인하는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어서 학교알리미 공시 같은 학교 단위 자료와는 고등학교명·주소를 맞춰 붙여야 한다.
description_portal: 고교 취업연계 장려금 참여 고등학교 유형 및 학교명에 따른 분류입니다. 고교 취업연계 장려금은  청년노동시장의 중소기업 구인난과 대졸자 실업률 상승의 일자리 미스매치 해소 및 과잉학력에 따른 사회적 경감 필요에 따라, 중소 중견기업에 취업(재직)하는 직업계고 3학년, 일반고 3학년 중 직업교육 6개월(180일) 이상 위탁과정 참여 학생을 대상으로 장려금을 지급하는 고졸 취업 지원 제도 입니다. 관련 상세 정보는 한국장학재단 누리집(www.kosaf.go.kr) > 장학금 > 국가근로 및 취업연계 장학금 > 고교 취업연계 장려금에서 확인 가능합니다.
