description_portal: 학원 및 교습소의 운영 현황을 국민에게 공개하는 공공데이터입니다. 이 데이터는 시도교육청 행정시스템  나이스(NEIS) 한국교육학술정보원(KERIS) 공공데이터포털 흐름을 통해 수집·제공됩니다.제공되는 주요 항목은 - 학원/교습소 구분 (학원, 교습소)- 학원명/교습소명- 등록 상태 (정상, 휴원, 폐원 등)- 분야/계열 (입시·보습, 예체능, 외국어, 컴퓨 등)- 정원 (수강 가능 인원)- 수강료 공개 여부 및 금액- 소재지 주소, 연락처
