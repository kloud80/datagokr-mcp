legal_basis_portal: '관련 법령 「학원의 설립·운영 및 과외교습에 관한 법률」학원 및 교습소의 설립·운영, 등록, 관리에 관한 기본 법적 근거를 규정합니다. 시행령 제3조의3: 교습과정의 분류 등 세부 사항을 규정. 시행규칙 제3조, 제4조, 제7조, 제11조, 제16조: 학원·교습소 또는 개인과외교습자의 장부 및 서류 관리 규정. 데이터 수집·관리 주체 각 시·도교육청이 학원 및 교습소의 개설, 변경, 휴원, 폐원 등의 행정 변동 사항을 수집·입력. 한국교육학술정보원(KERIS)이 이를 표준데이터셋으로 정리하여 공공데이터포털 및 NEIS 교육정보 개방포털을 통해 제공.'
