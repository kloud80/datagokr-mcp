description_portal: 한국과학기술원(KAIST)은 세계 각국의 우수 인재를 유치하여 국제 연구 허브로 성장하고 있으며, 외국인 유학생 비율이 국내 대학 중 가장 높은 수준입니다. 학사부터 박사까지 약 90여 개국에서 온 학생들이 재학 중이며, 전체 재학생의 약 10~15%를 차지합니다. 유학생들은 주로 공학, 자연과학, 인공지능, 바이오 분야에 집중되어 있으며, 영어 강의 비율이 높아 전공 수업 참여에 불편이 없습니다. KAIST는 장학금, 기숙사, 한국어 교육 등 유학생 지원 프로그램을 운영하며, 글로벌 네트워크 강화를 위해 지속적으로 국제교류협정을 확대하고 있습니다.
