description_portal: 충청북도 충주시 시립도서관에서 운영하는 북큐레이션 서비스에 따라 추천된 도서 정보를 제공하는 데이터입니다.큐레이션번호, 도서명(제목), 발행연도, 추천연도 및 월, 발행자, 저자, 도서 표지 이미지 URL 등의 항목으로 구성되어 있으며, 독서문화 진흥, 도서관 큐레이션 자료 공유, 공공독서서비스 개발 등에 활용됩니다.북큐레이션은 시기별·주제별로 선정된 추천도서를 체계적으로 분류한 자료로, 시민 대상 맞춤형 독서 콘텐츠 제공을 목적으로 운영됩니다.표지 이미지 URL은 외부 연계 도서 플랫폼의 썸네일 경로로 구성되며, 도서목록 시각화, 추천도서 콘텐츠 구성 등에 활용 가능합니다.발행연도는 해당 도서의 초판 기준이며, 추천연도 및 월은 도서관이 해당 도서를 큐레이션 주제로 선정한 시점 기준입니다.본 데이터는 도서관 홈페이지, 전자정보 게시판, 독서진흥 행사 등 다양한 온·오프라인 콘텐츠 연계 기반 자료로 활용됩니다.※ 추천도서 내용, 주제 키워드, 대상 독자군 등은 별도 큐레이션 안내문 또는 시립도서관 홈페이지를 통해 확인이 필요합니다.
