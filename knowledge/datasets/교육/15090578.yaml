summary_user: 전국 초·중·고등학교의 회계연도별 순세계잉여금을 학교 한 곳·한 회계연도 단위 행으로 담으며, 최초·추경·최종 예산, 세입·세출 결산, 불용액, 사고·명시·계속비 이월액과 건수, 이자·자산 수입 등 결산 항목이 함께 들어 있다(CSV 약 28.7MB). 교육재정 분석가가 "시도·학교급별로 결산 후 남는 잔액이 얼마나 되고, 이월·불용이 많은 학교는 어디인가" 같은 재정 집행 효율 질문에 쓴다. 학교는 실제 학교코드가 아닌 층화추출학교ID로만 식별되어 다른 데이터와 잇는 전역 조인 키가 없으므로, 시도명·시군구명·학교급명·회계년도를 기준으로 지역·학교급 단위로 묶어 다른 통계와 맞춰 쓴다.
description_portal: 제공하는 데이터는 전국 초·중·고등학교의 회계연도별 순세계잉여금 현황을 체계적으로 제공하는 공공데이터입니다. 순세계잉여금은 1회계연도의 세입 결산액에서 세출 결산액, 이월액, 국고보조금잔액, 결산 시 지방채 상환액 등을 차감한 후 남은 금액으로, 각 학교의 재정 집행 후 남은 실질적인 잔액을 의미합니다. 데이터에는 학교별 고유 식별자, 지역, 회계연도, 순세계잉여금 금액 등 구체적인 항목이 포함되어 있습니다. 이 자료는 「교육관련기관의 정보공개에 관한 특례법」 및 지방교육재정 관련 법령에 따라 수집·관리되며, 업데이트 주기는 수시(1회성 데이터)로 이루어집니다. 이 데이터는 학교별 재정운영의 건전성 평가, 교육재정의 효율적 집행 분석, 예산 편성 및 잔액 활용 정책 수립, 연구 및 통계 등 다양한 분야에서 활용됩니다.
