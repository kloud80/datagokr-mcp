summary_user: 인천광역시 미추홀구 내 고등학교를 학교 한 곳당 한 행으로 담은 소규모 CSV 파일(약 2.6KB)로, 학교명·설립 구분·계열·남녀 구분·도로명주소·전화번호·학년별 학급수·특수학급수·위경도를 담는다. 학부모나 지역 분석가가 '미추홀구에 어떤 계열의 공립·사립 고등학교가 어디에 있고 학급 규모는 어느 정도인가'를 확인하거나 학교 배치를 지도에 그릴 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명 매핑으로만 붙이고, 위경도·주소로 공간 데이터와 겹쳐 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구의 고등학교 정보를 담고 있습니다. 연번, 교육청, 소재구, 학교명, 홈페이지주소, 설립, 고등학교유형, 남녀, 주야, 우편번호, 도로명주소, 전화번호, 학년별학급수, 특수학급수, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 고등학교의 위치와 현황을 파악할 수 있으며, 일반고, 특성화고, 특수목적고 등 다양한 유형의 학교가 포함되어 있습니다. 공립과 사립으로 구분되며, 남자·여자·공학 학교가 모두 존재합니다. 각 학교의 학년별 학급수와 특수학급 운영 현황을 확인할 수 있으며, 위경도 좌표를 통해 정확한 위치를 파악할 수 있습니다. 이 데이터는 지역 내 고등학교 교육 인프라 현황 파악, 학교 배치 분석, 교육 정책 연구 등에 활용될 수 있습니다.
