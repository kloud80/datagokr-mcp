summary_user: 경기도안성교육지원청 관내 학교가 지역사회에 개방하는 시설을 시설 한 건씩 담은 목록으로, 학교명·학교구분(초·중·고)·설립구분(공립·사립)·시설주소·우편번호·위도·경도를 포함한 소규모 CSV 파일(약 10KB)이다. 안성 지역 주민이 운동장·체육관 등을 생활체육이나 동호회 활동에 쓰려고 할 때 '우리 집 근처에서 개방하는 학교 시설이 어디인가'를 찾거나, 지자체가 지역 내 개방시설의 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 학교 기본정보와는 학교명 매칭으로, 다른 공간 데이터와는 시설 위도·경도나 주소로 이어 쓴다.
description_portal: 경기도안성교육지원청에서 제공하는 학교시설 개방 현황 정보 목록입니다. 본 데이터는 시설주소, 학교구분, 설립구분, 시설 위도·경도, 학교명, 시설링크, 시설현황번호, 우편번호 등의 항목으로 구성되어 있으며, 관내 학교에서 지역사회에 개방하고 있는 교육시설의 현황을 체계적으로 제공합니다.이 자료는 지역 주민의 생활체육 활동, 문화·평생교육 프로그램 운영 등 공공 목적의 시설 활용을 촉진하기 위해 구축되었으며, 학교 유형(초·중·고등학교), 설립 형태(공립·사립), 위치 정보를 포함하여 누구나 손쉽게 접근하고 활용할 수 있도록 개방되어 있습니다.학교시설 개방 현황 데이터는 지역사회의 교육 인프라로서 학교시설의 공공적 가치를 높이고, 주민 참여형 교육환경 조성을 위한 기초 자료로 활용될 수 있습니다. 또한 지자체, 교육기관, 연구기관 등이 지역 단위의 교육복지 및 시설 운영 정책을 수립하는 데 참고자료로 활용할 수 있습니다.
