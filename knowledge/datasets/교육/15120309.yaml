description_portal: 본 데이터는 전국 고등교육기관(대학, 대학원, 캠퍼스 등)의 기본 현황 및 운영 정보를 제공합니다. 주요 항목으로는 학교한글명, 학교영문명, 학교소재지주소, 학교설립일, 학교법인명, 법인설립일, 학교 공식 홈페이지 URL, 캠퍼스명, 재학생수, 학위과정별(석사과정, 박사과정, 석박사통합과정) 정원 및 현원 정보, 정보공시 여부 등이 포함되어 있습니다. 고등교육기관의 기본 인프라 분석, 지역별 대학 분포 현황 파악, 대학원 학위과정 운영 규모 비교, 대학 행정 및 교육 재정지원 정책 수립을 위한 기초 조사 데이터로 유용하게 활용할 수 있습니다.
