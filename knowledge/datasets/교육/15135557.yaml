summary_user: 사립대학과 학교법인의 회계연도별 예결산을 집계한 운영계산서로, 학교·법인·회계 구분별로 등록금(입학금·수업료)·수강료·전입금·기부금 같은 수익과 인건비·관리운영비 등의 내역을 천원 단위로 담는다. 분석가나 학부모가 특정 사립대학이 등록금 수입에 얼마나 기대고 있는지, 법인이 법정부담전입금을 얼마나 내는지를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학 공시·재정 데이터와는 학교명·법인명이나 지역 구분(대·중·소지역)을 이름으로 맞춰 이어 써야 한다.
description_portal: '한국사학진흥재단_사립대학 법인일반 및 교비 운영계산서는 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 법인일반 및 교비 운영계산서 자료를 통해 학교법인 및 사립대학의 전입금수입, 기부금수입, 인건비, 관리운영비 등의 내역을 학교별, 법인별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
