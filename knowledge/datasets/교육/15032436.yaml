description_portal: 성남시내 평생교육기관 현황에 대한 데이터이며 기관명,전화번호,대/중/소 분류,주소의 항목으로 구성되어 있습니다. 성남시 평생교육기관 현황 데이터는 관내에서 운영 중인 다양한 평생학습 관련 기관들의 정보와 운영 실태를 종합적으로 담고 있는 자료입니다.  성남시는 시민의 생애주기별 학습 수요에 대응하기 위해 공공 도서관, 주민자치센터, 여성·노인복지관, 민간교육시설 등을 연계하여 지역 맞춤형 평생학습 생태계를 조성하고 있으며, 본 데이터는 이러한 기관의 분포 및 특성을 파악하고 정책적 지원 대상을 선정하는 데 활용됩니다.
