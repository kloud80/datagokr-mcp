summary_user: 대전광역시 내 초등학교를 학교 한 곳당 한 행으로 담은 시 단위 목록이며, 학교명·시군구·설립구분·소재지와 학급 수·학생 수·교직원 관련 수치(학년별로 나뉜 것으로 보이는 컬럼 포함)를 싣는다. 학부모가 우리 동네 초등학교의 위치와 학급·학생 규모를 비교하거나, 정책 담당자가 자치구별 초등 교육 수요와 학교 배치를 살펴보는 데 쓴다. 실측 컬럼에 전국 공통 학교코드 같은 조인 키가 없어서, 교육부·교육청 학교 기본정보나 학구도·교원 통계와는 학교명(schulNm)과 주소를 맞춰 붙여야 한다.
description_portal: 대전광역시 초등학교 정보 데이터는 시 내 각 초등학교의 실질적 교육 환경과 운영 현황을 체계적으로 제공합니다. 학교명, 주소, 좌표, 법정동 및 행정동, 전화번호 등 기본 정보를 포함하며, 관할 교육청 별 학급 수, 학생 수, 교직원 현황 등 세부적인 학교 운영 상태까지 폭넓게 수록되어 있습니다. 이를 통해 학부모는 자녀 입학 가능 학교의 위치와 접근성, 인근 교육 여건 파악에 활용할 수 있고, 학교 행정기관이나 정책 담당자는 행정 구역 별 교육 수요, 시설 배치, 인구 변화 대응 등 효과적인 교육 정책 설계와 자원 배분의 근거 자료로 활용됩니다. 2022년 대전광역시 공공데이터 기업매칭지원사업으로 개발한 데이터입니다.
