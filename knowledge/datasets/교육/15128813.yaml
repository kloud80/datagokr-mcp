summary_user: 국가근로장학금 지원인원을 사업연도(해당연도 3월~차년도 2월)·학기·대학설립유형·대학소재지와 근로유형별 참여 여부(교내·교외·장애봉사·외국인봉사·취업연계) 조합으로 집계한 전국 범위 파일 데이터(CSV 약 51KB)다. 정책 분석가나 연구자가 '어느 지역·어떤 설립유형 대학에서 국가근로장학생이 몇 명이고, 취업연계형 참여 비중은 어떻게 변하는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 장학·학자금 통계나 대학 공시 자료와는 대학소재지(시도명)·설립유형 이름을 맞춰 붙여 쓴다.
description_portal: '국가근로장학금의 사업연도 기준 학기별, 대학유형별, 대학소재지별 등 장학금 지원인원 데이터입니다.※ 국가근로장학금 사업연도: 해당연도 3월 ~ 차년도 2월 제공하는 데이터 항목은 사업연도, 상품명, 학기, 대학설립유형, 대학소재지, 일반교내 근로참여여부, 장애봉사유형참여여부, 외국인봉사유형참여여부, 일반교외근로참여여부, 취업연계유형참여여부, 지원인원입니다.(국가근로장학금 사업) 저소득층 대학생에게 학자금(등록금과 생활비) 마련을 위한 근로 기회를 제공하고, 그에 따른 장학금을 지급함으로써 안정적인 학업 여건 조성 및 취업 역량을 제고하는 사업입니다.→ 사업 상세 정보는 "한국장학재단 홈페이지 > 장학금 > 국가근로 및 취업연계 장학금 > 국가근로장학금"을 참고 바랍니다.'
