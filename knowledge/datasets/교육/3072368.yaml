description_portal: 이 데이터는 한국도로교통공단이 2011년부터 2024년까지 수행한 교통안전 사회교육의 연도별·대상별 참가 현황을 정리한 자료입니다. 각 기록은 교육이 실시된 연도와 교육 대상 그룹, 해당 연도의 교육인원 수를 열로 구성하고 있습니다. 교육 대상 그룹은 어린이집·유치원·초등학생, 중고등학생, 어린이교통공원, 교통안전 담당교사, 기관·단체, 기업체, 운수업체, 군부대, 민방위, 노인(보행자), 녹색어머니, 외국인 등 12개로 구분됩니다. 연도별로 동일 그룹 내 교육인원 변동 현황을 파악할 수 있으며, 일부 그룹의 경우 교육이 미실시된 연도는 결측치로 표시되어 있습니다. 교육인원 열은 명 단위로 수집된 수치형 데이터입니다. 전체 데이터는 168개의 관측치로 구성되어 있습니다.
