summary_user: 경남도립거창대학 학사행정시스템에 등록된 (구)6자리 우편번호를 앞 3자리(우편번호1)·뒤 3자리(우편번호2)로 나누어 주소·시도와 함께 담은 우편번호 대응표이며, 개별 주소 단위의 CSV 파일(약 32만 바이트)로 활용신청 없이 받는다. 옛 6자리 우편번호만 남아 있는 학적·인사 주소 자료를 정리하는 담당자나 분석가가 '이 구 우편번호는 어느 시도·주소에 해당하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 우편번호나 주소 문자열을 맞춰 붙여야 하며, 학교코드로 학교 기본정보와 바로 연결되지 않는다.
limits: 전역 조인 키가 없어 학교 통계·재정 데이터와 키로 직접 연결할 수 없고, 주소·우편번호 문자열 매칭에 의존해야 한다. 현행 5자리 국가기초구역 우편번호가 아니라 (구)6자리 체계이므로 최신 주소 검증에는 맞지 않는다.
