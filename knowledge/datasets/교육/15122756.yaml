summary_user: 경기도인재개발원이 공무원·공공기관 직원 대상으로 운영하는 교육과정을 과정·차수 단위로 담은 건별 원천 데이터로, 과정명, 학습방법, 교육일수, 총학습시간, 학습 기간, 수료 기준, 수강신청 기간 등을 포함한다. 교육 담당자나 분석가가 "올해 개설된 온라인 과정의 학습시간과 수료 기준은 어떻게 되는가" 같은 과정 운영 현황을 파악하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했으므로 과정명 등 이름 매핑이나 같은 기관(경기도) 자료끼리만 연결한다.
description_portal: 이 데이터는 경기도인재개발원에서 운영하는 공무원 및 공공기관 대상 교육과정의 상세 현황을 포함하고 있으며, 과정명, 과정ID, 학습방법, 교육일수, 총학습시간, 개설년도, 강의계획서명, 진도확인 여부, 학습시간 등 80여 개 항목으로 구성된 방대한 교육 메타데이터입니다. 과정은 온라인 학습 위주로 구성되어 있으며, 각 과정은 차수별로 구분되며 세부 강의로 나뉘어 있습니다. 데이터에는 각 강의의 학습시간(초), 강의계획서번호, 학습구분, 베스트 후기 여부 등의 실적 정보도 포함됩니다. 이 자료는 공공기관 교육정책 수립, 과정별 참여도 분석, 교육성과 평가, 행정역량 제고를 위한 교육 콘텐츠 개발 등에 폭넓게 활용될 수 있습니다.
accrual_periodicity: 수시
