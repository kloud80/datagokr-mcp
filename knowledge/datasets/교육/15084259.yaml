description_portal: 이 정보는 대구광역시 서구에 위치하고 있는 <원고개도서관> 대출 순위에 관한 정보로 2026년 3월의 인기있는 책 목록을 제공합니다.2018년 11월 개관한 원고개도서관은 대구광역시 서구 달서로 43길 12에 위치하고 있다.지상 1층에서 3층까지 구성되어 있으며, 1층에는 어린이, 유아열람실, 수유실이 있고, 2층에는 일반자료실, 열람실이 있으며, 3층에는 문화강좌실 1&2가 있다.도서자료로는 총 30,096권의 서적을 보유하고 있다. 유아도서 5,481권, 어린이도서 9,668권, 일반도서 14,088권, 치매도서(특화도서) 332권, 큰글자도서 527권이 있다.비도서자료로는 총 1,023종이 있다. DVD 1,000종, 신문 8종, 정기간행물 15종이 있다.
