summary_user: 서울특별시북부교육지원청 관할(도봉구·노원구) 유치원·초·중·고등학교를 한 행에 한 학교씩 담은 명부 파일로, 학교급(교육과정)·설립 구분·학교명·행정구·주소·전화번호를 담는다. 학부모나 지역 분석가가 도봉구·노원구에 어떤 학교가 어디에 있는지, 공립·사립이 몇 곳인지 확인할 때 쓴다. 전역 조인 키(표준 학교코드 등)가 없어 다른 학교 통계·재정 데이터와는 학교명·주소 매칭으로만 이어 쓴다.
description_portal: 해당 자료는 서울특별시북부교육지원청 관내에 있는 모든 유치원, 초등학교, 중학교, 고등학교의 정보를 다루고 있습니다.해당되는 자치구는 서울특별시 도봉구 및 노원구입니다.제공 내용은 해당 시설의 시설구분명과 시설명 그리고 소재하고 있는 자치구와 주소 그리고 전화번호입니다.해당 자료는 매년 갱신되는 자료이오니 이용에 참고 부탁드립니다.이용하실때 궁금한 점이나 문의사항이 있으시면 서울특별시북부교육지원청 행정지원과 배치팀으로 문의 부탁드립니다.해당 자료는 서울특별시북부교육지원청 내부 자료에 의해 작성되었음을 알려드립니다.
legal_basis_portal: 북부교육지원청 교육통계(2026년 4월 기준)에 기반하여 작성된 자료입니다. 해당 자료에 대한 권리는 서울특별시북부교육지원청에 있는 점 안내 드립니다.
