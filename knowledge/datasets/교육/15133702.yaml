summary_user: 경기도 9개 평준화 학군에 속한 고등학교를 학교별 1행으로 담은 파일 데이터로, 학교명·학군·구역·소속교육청·소재지구분·고등학교 구분·남녀공학 구분을 싣고 전체 201행이다. 학부모나 분석가가 우리 지역 고등학교가 어느 학군에 속하는지, 학군별로 학교가 몇 곳인지 확인하는 질문에 쓴다. 소재지구분(address)을 조인 키로 삼아 주소 기반 자료와 이어 쓰며, 학교 기본정보와 연계해 학교 단위로 확장할 수 있다.
description_portal: 경기도 내 평준화지역에 속한 고등학교의 학군별 현황 정보를 담고 있습니다. 구체적으로는 수원, 성남, 안양권, 부천, 고양, 광명, 안산, 의정부, 용인 등 9개 평준화 학군에 포함된 고등학교의 명칭, 소속교육청, 소재지, 소속 학군 등 주요 정보를 제공합니다. 이 데이터는 경기도 고등학교 입학전학 포털시스템 운영에 필요한 중학교 및 고등학교 자료 중, 평준화 학군에 해당하는 고등학교만을 대상으로 하며, 일부 신설 또는 신설 예정교는 제외됩니다. 활용 분야는 고등학교 입학전형 안내, 학군별 학교 현황 분석, 교육정책 수립, 학부모 및 학생의 진학 정보 탐색, 연구기관의 교육통계 분석 등 매우 다양합니다.
