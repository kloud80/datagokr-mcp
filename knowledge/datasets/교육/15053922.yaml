summary_user: 성동광진교육지원청 관내(성동구·광진구) 초등학교를 학교 한 곳당 한 행으로 담은 명부 파일로, 학교급·학교명·설립 구분(공립/사립)·행정구·대표 전화번호·도로명주소를 담는다. 학부모나 지역 분석가가 '광진구에 있는 공립 초등학교는 어디이고 연락처는 무엇인가'처럼 관내 학교 목록과 위치·연락처를 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없으므로 다른 학교 통계·재정 데이터와는 학교명이나 도로명주소를 맞춰 붙여야 한다.
limits: 학교코드가 없어 학생·교원·학급 통계나 재정 데이터와 바로 조인하지 못하고, 학교명·주소 매칭에 기대야 한다. 포털 설명대로 현행화 시점에 따라 실제 현황과 다를 수 있다.
