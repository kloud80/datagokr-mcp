summary_user: KOCW에 국내 대학이 등록한 의약학 분야 강의를 강의 한 건씩 담은 전국 단위 목록으로, 강의명·대학·교수·대분류·중분류·학년학기·언어·라이선스·등록일시·강의 바로가기 주소가 들어 있다(CSV 약 126KB). 의대·약대·간호 등 의약학 전공 학습자가 '특정 과목을 어느 대학 어느 교수가 공개 강의로 올렸는가'를 찾거나, 분석가가 대학별·분야별 공개 강의 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 대학명이나 분류명을 이름 그대로 맞춰 이어야 하며, KOCW 다른 분야 강의 목록과는 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: 제공하는 데이터는 고등교육 교수학습자료 공동활용 체계인 KOCW(Korea OpenCourseWare)를 통해 국내 대학에서 개설된 의약학 분야 강의의 목록 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 강의명, 대학명, 교수명, 전공분류, 강의개요, 강의구분, 학년·학기 등 의약학 관련 강의의 주요 정보가 포함되어 있습니다. 각 대학 및 교수진이 KOCW(Korea OpenCourseWare) 플랫폼에 직접 등록한 강의 정보를 기반으로 하며, 연 1회 정기적으로 데이터가 갱신됩니다. 데이터의 보유 및 제공 근거는 고등교육 혁신과 교수학습자료 공동 활용 촉진을 위한 관련 법령과 정책에 있습니다. 이 데이터는 의약학 분야 대학 강의 현황 분석, 교육과정 비교, 교육정책 수립, 교수학습자료 개발, 학습자 맞춤형 강의 추천, 연구 및 통계, 온라인 교육 서비스 개발 등 다양한 분야에서 활용될 수 있습니다. 강의 형태에 따라 일부 강의는 학년·학기 정보가 공란으로 표기될 수 있습니다
