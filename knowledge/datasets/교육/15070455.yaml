summary_user: 한국장학재단 장학상품별로 학과학제 구분과 학자금 지원구간에 따른 최대 수혜횟수를 정리한 전국 단위 기준표 파일이다(CSV 약 6.7KB, 활용신청 없이 내려받음). 학생·학부모가 "이 장학금을 학제별로 몇 번까지 받을 수 있나"를 확인하거나, 분석가가 상품별 수혜 한도 기준을 정리하는 데 쓴다. 전역 조인 키는 없어 같은 기관의 다른 장학 자료와는 상품코드·상품명 매핑으로만 이어 쓴다.
description_portal: 한국장학재단의 장학 상품별 최대 수혜횟수 정보(상품명, 학과학제구분, 학자금 지원구간, 최대수혜 횟수 등)입니다.상품별 세부유형 구분 등에 따른 최대 수혜횟수는 다를 수 있으며, 현재 운영하고 있지 않은 장학금도 포함되어 있으니 이용시 유의하시기 바랍니다.※ 학자금지원구간 등의 항목에 데이터값이 빈값인 경우는 최대수혜횟수 산출에 학자금 지원 구간의 영향을 받지 않은 경우에 해당※ 장학상품별 세부 내용은 "한국장학재단 홈페이지(https://www.kosaf.go.kr) > 장학금"에서 확인※ "학자금 지원구간"은 일부장학금에 한하여 수혜 횟수에 대한 구분 기준이므로 이 항목이  빈값인 경우는 장학 상품별 최대수혜 횟수에 "학자금 지원구간"의 영향을 받지 않은 경우임※ 학자금 지원구간이란? 기존의 "소득분위", "소득구간" 등의 용어가  변경된 것으로, 매년 보건복지부에서 발표하는 기준중위소득과 연계하여 산정된 학자금 지원구간 경곗값에 따라 지원구간을 결정함
