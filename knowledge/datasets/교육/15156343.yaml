description_portal: 주민자치센터 프로그램 데이터는 주민 대상 교육·취미·체육 과정의 운영 현황을 통합 관리하기 위한 공공데이터이다. 각 레코드는 하나의 교육 과정을 의미하며 과정명, 장소, 교육시작일시, 교육종료일시, 교육시작시간, 교육종료시간, 교육정원, 대기정원, 교육비 항목으로 구성된다. 과정명은 교육 내용과 성격을 나타내고, 장소는 강의실·체육실 등 세부 시설 정보를 제공하여 공간 배치를 분석하는 데 활용된다. 교육시작일시와 교육종료일시는 전체 기간과 회기 일정을 파악하게 해 주며, 교육시작시간과 교육종료시간은 하루 중 실제 운영 시간을 보여 준다. 교육정원과 대기정원은 수용 가능 인원과 대기 규모를, 교육비는 수강료 수준을 나타내어 수요 예측과 이용자 부담 분석, 프로그램별 운영 효율성 평가에 활용될 수 있다
