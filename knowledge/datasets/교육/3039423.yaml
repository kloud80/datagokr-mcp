description_portal: 한국역사용어시소러스는 고대부터 현대까지 한국 역사의 주요 용어들을 수집·분류하여 체계적인 검색 사전을 구축한 데이터베이스로, 조선시대 정치 행정과 인사, 고려시대 중앙행정기구, 삼국시대 군사와 문화 등 다양한 분야의 용어들을 포함한다. 이 데이터는 방대한 한국역사 정보의 용이한 접근과 연구를 돕기 위해 제공되며, 사료 기반으로 정치, 사회, 경제, 문화 관련 전문 어휘들을 폭넓게 다루고 있다.주요 자료를 제공하는 웹 사이트인 한국사데이터베이스(http://db.history.go.kr)에서 서비스중인 한국역사용어를 수집, 분류하여 시소러스 검색 사전을 구축·제공하여 방대한 정보를 보다 용이하게 검색할 수 있도록 돕는 시소러스 DB로 구성되어 있음
