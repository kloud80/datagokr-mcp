summary_user: 광주 광산구에 있는 대안학교를 학교 한 곳당 한 행으로 담은 파일로, 학교명·구분·주소·전화·홈페이지와 교사·학생 수, 학비, 입학자격, 모집시기, 주요수업, 좌표를 함께 싣는다(전체 csv 1.8KB 규모의 소량 목록). 학부모나 학생이 광산구에서 다닐 만한 대안학교의 위치, 학비, 입학 조건을 비교할 때 쓰고, 지역 교육지원 계획을 세울 때 대안교육 기관의 규모를 파악하는 데에도 쓴다. 전역 조인 키나 표준 학교코드가 없어 다른 학교 통계와는 학교명으로 맞추거나 좌표(X·Y)로 지도·학구도 데이터에 겹쳐 쓴다.
description_portal: 광주광역시 광산구에 위치한 대안학교 현황에 관한 정보를 제공합니다. 이 데이터는 각 대안학교의 학교명, 학생 수, 전화번호, 주소 등의 주요 항목을 포함하고 있어, 광산구 내 대안교육 기관의 규모와 위치를 한눈에 파악할 수 있도록 구성되어 있습니다. 교육 정책 수립이나 지역사회 교육 지원 계획을 마련하는 데 활용될 수 있으며, 학부모 및 학생들에게도 대안교육 기관에 대한 기본적인 안내 자료로 유용합니다. ※ 2017년도 자료가 최신자료이며 이후 수집이 중단되어 해당 자료가 없음을 알려드립니다.
