description_portal: 해당 목록은 대학의 장 명의로 학위수여가 가능한 교육훈련기관을 포함하며, 주로 평생교육원과 대학부설 교육원이 중심이다. 전문대학부설 평생교육원과 원격평생교육원도 일부 포함되어 다양한 형태의 평생교육 서비스를 제공하고 있음을 보여준다. 이는 평생교육 및 학점은행제의 다양한 교육기회를 확대하여 학습자들의 자격 취득 지원에 기여함을 의미한다. 또한 문서에는 2021년부터 2026년까지의 데이터를 담고 있으며, 전문과정 및 특별과정도 일부 존재한다는 점이 특징이다. 미리보기에는 수십 개 대학 부설 평생교육원의 명단을 확인할 수 있어 교육훈련기관 현황 파악에 유용하다.(학점은행제) 2021년~2026년 대학의 장 명의 학위수여 교육훈련기관 목록기관명, 교육원 유형 데이터를 제공
