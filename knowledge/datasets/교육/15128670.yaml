summary_user: 경기도 하남시 관내 유치원·초중고·특수학교·대안교육기관을 학교 한 곳당 한 행으로 담은 명부 파일로, 구분·학교명·소재지 주소·행정실/교무실 연락처·개원연도를 담는다. 하남시 주민이나 학부모가 우리 동네 학교의 주소와 연락처, 언제 문을 열었는지를 찾거나, 분석가가 최근 신설 학교가 몰린 지역을 주소로 지도에 찍어 보는 데 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어서, 다른 학교 통계·재정 데이터와는 학교명 매칭이나 주소 지오코딩으로만 이어 붙인다.
limits: 학교코드가 없어 교원·학생·학급 통계나 재정 데이터와 키로 바로 조인할 수 없고, 학교명 표기 차이를 직접 맞춰야 한다. 범위는 하남시 한 곳뿐이며, 학생 수나 학급 수 같은 규모 정보는 담지 않는다.
