summary_user: 국가기술자격시험과 연계된 공통 NCS 능력단위를 단위별로 담으며, 능력단위코드·명칭·수준, NCS 대·중·소·세분류명, 능력단위 정의, NCS·HRD-Net 최종 연계일자, 과정평가형·일학습병행 편성 수를 제공한다. 직업훈련기관이나 교육 담당자가 '특정 NCS 세분류에 속한 능력단위가 무엇이고 과정평가형 자격에 몇 번 편성됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, NCS 능력단위코드(ncsClCd)나 분류명을 이름·코드 매핑하여 같은 기관의 국가기술자격 종목·시험 정보와 연결한다.
description_portal: 페이지(페이지 번호, 페이지당 데이터 수), 제공형태(json, xml)별 NCS능력단위코드, 능력단위명, 능력단위수준, NCS대분류명, NCS중분류명, NCS소분류명, NCS세분류명, 능력단위정의, NCS최종연계일자, HRDNET최종연계일자, 과정평가형 편성수, 일학습병행 편성수, 과정평가형 편성등록파일수의 정보를 제공하는 “공통 NCS 정보 조회” 서비스로 “공통 NCS 정보” API 서비스 중 하나
