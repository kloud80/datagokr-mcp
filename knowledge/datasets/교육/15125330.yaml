description_portal: 한국사학진흥재단_최근 5개년도 국공사립대학 산학협력단 결산DB은 한국사학진흥재단의 회계연도별 국공사립대학 산학협력단 예결산 집계를 통해 산출된 자료입니다.최근 5개년도(20~24회계연도) 국공사립대학 산학협력단 결산DB 자료는 운영계산서, 현금흐름표, 재무상태표 3개 시트로 구성되어 있으며 학교별, 설립구분별, 학급별, 학종별, 지역별로 확인할 수 있습니다.해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.
