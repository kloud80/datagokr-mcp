description_portal: '- 매년 4월 대학정보공시 기준의 대학별 입학정원, 평균입학금, 평균등록금을 확인할 수 있음(분교, 캠퍼스는 본교에 통합 산출) * 「고등교육법」제11조 제2항(2019.2.13. 신설)에 근거하여 학부는 2023년부터 입학금 전면 폐지  ※ 2023년 이전 입학금 폐지 완료한 대학 존재- 등록금 공시조사를 안정적으로 수행하여 국민들이 원하는 대학의 등록금을 적시에 확인할 수 있도록 체계화된 자료 제공 가능- 통계자료 분석 기반 조성으로 등록금 부담 완화 정책, 학자금 지원 사업 등 교육정책 수립 지원 및 교육 연구 기초자료 발굴- 평균등록금은 학기 기준이 아닌 연간 기준으로 작성되었음'
