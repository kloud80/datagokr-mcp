summary_user: 대학별 입학정원, 평균입학금, 연간 기준 평균등록금(원)을 학제·설립·지역 구분과 함께 담은 대학정보공시 기반 집계 파일로, 범위는 전국이며 분교·캠퍼스는 본교에 통합해 산출한다. 학부모·수험생이 지원할 대학의 1년 등록금이 얼마인지 비교하거나, 분석가가 설립 유형·지역별 등록금 수준 차이를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 대학 공시·장학 데이터와는 대학명을 이름 매핑해 연결해야 한다.
limits: 대학코드 같은 공통 키가 없어 대학명 표기 차이에 따른 매칭 오류에 주의해야 한다. 분교·캠퍼스별 등록금은 따로 볼 수 없고, 평균등록금은 학기가 아닌 연간 기준이다. 학부 입학금은 2023년부터 전면 폐지되어 이후 평균입학금 값은 해석에 주의한다.
