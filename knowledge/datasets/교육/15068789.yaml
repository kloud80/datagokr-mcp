summary_user: 인천 서구(제목상 서해구) 안에서 개교가 예정된 학교를 학교별 한 행으로 담은 작은 파일(csv 1,081바이트)로, 학교급·관할 교육청·가칭 학교명·위치·학급수·개교 예정일·부지면적·부지와 시설의 사업방식·사업비를 담는다. 학부모가 "우리 동네에 언제 어떤 학교가 새로 생기나"를 확인하거나, 분석가가 신설 학교를 신도시 학령 수요의 신호로 읽는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학교명(가칭)이나 위치 주소를 이름 매칭해 학교 기본정보·학구도 등과 이어야 한다.
description_portal: 본 공공데이터는 인천광역시 서구에서 개교가 예정된 학교의 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 개교가 예정되는 학교의 학교급별, 교육청별, 위치, 학급수, 개교 예정일, 부지면적, 사업방식 등 다양한 항목을 제공하고 있습니다. 본 공공데이터를 통하여 향후 개교 예정 학교 정보를 확인할 수 있고, 이를 통하여 자녀의 학군 변화나 통학 여건 등을 미리 파악 할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영을 하고 있습니다.
