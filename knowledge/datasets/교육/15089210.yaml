description_portal: 대구광역시 관내 공공도서관의 책나래서비스(배달자료)는 도서관 방문이 어려운 시민들을 위해 도서를 배달해 주는 서비스입니다. 이 서비스는 장애인, 국가유공자, 장기 요양등급을 받은 거동 불편자를 대상으로 하며, 우체국 택배 등을 이용하여 도서를 집까지 배달하고 회수하는 방식으로 운영됩니다. 이를 통해 도서관 이용이 어려운 시민들도 편리하게 도서를 대출하고 반납할 수 있습니다.이 공공데이터는CSV파일형식으로제공되며,신청현황을포함하고있습니다. 데이터에는 등록번호, 서명, 요청일자, 배달일자, 도서관명등의 정보가 포함되어 있어,책나래 서비스의 운영현황을 분석하거나 관련시스템을 개발하는데 활용할 수 있습니다. 책나래서비스 데이터는 무료로 제공되며, 공공데이터포털에서 다운로드 할 수 있습니다.
