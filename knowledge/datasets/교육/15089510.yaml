summary_user: 학점은행제에서 학점 인정 근거가 되는 자격증별 학점 기준을 분야명, 자격증 이름, 발행기관, 중분류, 직무번호 단위로 담은 전국 단위 기준정보 파일(CSV)이다. 학습자나 상담자가 '내가 가진 국가자격증이 학점은행제에서 어느 분야 학점으로 인정되는가'를 확인할 때 쓴다. 자격증 이름(lifelong_cert_name)과 직무번호(cbs_cert_job_no)를 키로 국가기술·전문자격 종목, 시험 일정, 합격률 데이터와 이어 쓰며, 이를 통해 채용·창업 요건 및 업종 인허가 정보와도 연결한다.
