summary_user: 경기도 소재 전문대학·대학교가 설치·운영하는 계약학과를 기준년도·학교·학과 단위로 담은 연도별 현황으로, 학교종류·설립구분, 모체학과와 입학정원, 계약학과 유형·정원·재학생 수, 외부기관·대학·학생의 경비 분담률, 참여 산업체 수 등을 포함한다. 교육정책 분석가나 산학협력 담당자가 '경기도 대학의 재교육형 계약학과에서 학생 부담률은 얼마이고 어느 외부기관 사업이 경비를 지원하는가'처럼 지역 산학협력 실적과 교육비 분담 구조를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키(표준 학교코드 등)가 없어 학교 기본정보·교원·학생 통계와는 학교명(SCHOOL_NM) 이름 매핑으로만 연결한다.
description_portal: 경기도 계약학과 설치 대학별 운영 현황을 제공합니다. 기준년도, 학교명, 계약학과유형, 계약학과정원 등의 정보를 제공합니다.* 계약학과란 정부에서 지정한 중소기업 계약학과에 입학할 경우 등록금의 일부를 지원해 주는 학과입니다.이 데이터는 경기도 소재 전문대학 및 대학교에서 설치·운영 중인 계약학과에 대한 연도별 현황을 나타낸 자료입니다. 주요 항목에는 학교명, 학교종류, 설립구분, 계열명, 모체학과 및 입학정원, 계약학과명, 취득학위명, 계약학과유형명(재교육형 등), 경비지원 외부기관명과 사업명, 외부기관 및 대학 자체 경비지원율, 학생부담률, 산업체 수와 산업체명 등이 포함됩니다. 계약학과는 산업 수요 기반 맞춤형 인재 양성을 목적으로 설립된 학과로, 본 자료는 지역 내 산학협력 활성화, 특화 인력 양성 실적, 교육비 분담 구조 파악 등에 유용하게 활용될 수 있으며, 고용 연계형 교육정책 및 전문기술 훈련 프로그램 평가에도 참고됩니다.
