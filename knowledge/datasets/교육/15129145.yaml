description_portal: 복권기금 꿈사다리 우수 장학사업은 복권기금을 재원으로 저소득층 우수 초·중·고생 중 역량과 잠재력 있는 학생을 발굴하여, 대학 졸업 시까지 지속 지원하는 국가장학제도입니다. 본 사업의 홍보를 위해 뉴스레터를 제작·발행하여 재단 고객 등에 발송하였습니다. 뉴스레터는 사업소식, 공지사항 등 4개의 코너를 카드뉴스와 웹툰 형식 등의 형태로 담아 제작하였습니다. 연 4회 뉴스레터 발행으로, 본 사업 전반의 소식을 정기적으로 제공하고, 장학생 및 멘토 등 이해관계자의 사업 관심도 제고·참여를 활성화하였습니다. 해당 데이터는 뉴스레터의 제목, 발행호, 발송일자, 발송건수 데이터입니다.뉴스레터는 2020년부터 2024년까지 제작·발행하였습니다.
