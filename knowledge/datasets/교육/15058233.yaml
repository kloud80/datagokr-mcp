summary_user: 경기도 소재 일반대학원 졸업생의 취업·진로 현황을 기준연도(STD_YY)·학교·단과대학·학과 단위로 집계한 통계로, 남녀 졸업자수, 건강보험 연계 취업자, 해외취업·1인 창업·프리랜서·진학·입대 인원, 취업률과 차수별 유지취업률을 담는다. 진로 연구자나 정책 담당자가 "경기도 대학원 중 어느 학과 계열의 건강보험 연계 취업률과 유지취업률이 높은가"를 비교하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어, 학교 기본정보나 다른 교육 통계와는 학교명·학과명 매핑이나 같은 기관(경기도) 데이터의 코드로만 연결한다.
description_portal: '졸업생의 취업현황(일반대학원) 데이터는 경기도에 소재한 일반대학원 졸업생의 취업 및 진로 현황을 제공하는 교육 통계자료입니다. 주요 항목은 학교종류명, 설립구분명, 학교명, 단과대학명, 학과명, 학과특성명 등 기본 정보와 함께 남녀 졸업자수, 건강보험연계 취업자수, 해외취업자수, 영농업 종사자수, 개인창작활동 종사자수, 1인 창업자수, 프리랜서수, 진학자수, 입대자수, 취업불가능자수, 외국인유학생수 등이 포함됩니다. 또한 건강보험 직장가입 제외자, 기타 인원, 미상 인원 등 세부 분류가 제시되며, 이를 기반으로 전체 취업률과 성별·유형별 취업률(예: 1차~4차 유지취업률)도 산출할 수 있습니다. 본 데이터는 건강보험 DB를 활용한 연계 조사 결과를 기반으로 제공되며, 개별 학교의 취업률은 직접 산출되지 않습니다. 이 자료는 대학원 졸업생의 사회진출 특성과 고용 형태를 분석하고, 고등교육 성과 평가, 취업지원 정책 설계, 학문 분야별 진로 경향 연구 등에 활용될 수 있습니다.'
