description_portal: 이 정보는 대구광역시 서구에 위치하고 있는 <비원도서관> 대출 순위에 관한 정보로 2026년 2월의 인기있는 책 목록을 제공합니다.2018년 5월 개관한 비원도서관은 대구광역시 서구 달서천로61안길 10에 위치하고 있다.지상 1층에서 3층까지 구성되어 있으며, 1층에는 어린이.유아열람실이 있고, 2층에는 종합자료실이 있으며, 3층에는 평생학습실, 문화강좌실, 북카페가 있다.도서자료로는 총 32,392권의 서적을 보유하고 있다. 일반도서 17,309권, 아동도서 10,024권, 유아도서 5,059권이 있다.비도서자료로는 총 836종이 있다. DVD 814종, 신문 8종, 정기간행물 14종이 있다.
