summary_user: 인천광역시교육청 관할 각급 학교의 2026년 4월 1일 기준 현황을 학교 한 곳당 한 행으로 담은 엑셀 파일로, 학교명·교육지원청·학교급(초·중·고·특수·각종학교)·설립유형·개교일·주소·전화번호를 담는다. 인천 지역 학부모나 분석가가 '우리 동네 교육지원청 관할에 어떤 학교가 있고 국공립·사립 비율은 어떤가' 같은 학교 분포 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 교원·학생·재정 데이터와는 학교명 매칭이나 같은 교육청 코드로만 이어 붙인다.
limits: 파일 첫 행이 제목('2026. 4. 1.자 학교 현황')이라 실제 머리글이 아래 행에 있어 컬럼명이 비어 읽히므로 파싱 시 머리글 행을 직접 지정해야 한다. 표준 학교코드 같은 공통 키가 실측되지 않아 다른 학교 데이터와의 연결은 이름 매칭에 의존하고, 범위는 인천시 한 곳에 한정된다.
