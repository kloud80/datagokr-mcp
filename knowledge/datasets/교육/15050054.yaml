description_portal: '【학위과정】①2025.4.1.기준 해당 대학에 재적 중인 외국인 정규 학위과정 유학생,재학생,휴학생,학사학위취득 유예학생 모두 입력(단,교육과정 공동운영생,연수과정생 등은 입력에서 제외) ②｢고등교육법 시행령｣제29조제2항제2호 규정에 의한 외국인(동항의 제6호 및 제7호의 경우를 포함하되 북한이탈주민은 제외)및 편입생 등을 포함【교육과정 공동운영생】: 외국대학(해당 외국 또는 외국이 공인하는 평가인정기구의 평가인정을 받은 외국대학)과 협약에 의하여 학위과정의 교과를 공동으로 운영하는 교육과정을 이수중인 내･외국인 학생【연수과정-어학연수생】: 대학부설 어학원 등 비학위과정(Non-degree Program)인 어학연수과정에 등록하여 수학하고 있지만 학점은 취득하지 않는 유학생【연수과정-교환학생】: 대학 간 학술교류협정에 의해서 상호 학생을 교환하는 프로그램에 참여하여 학점을 취득하는 유학생【연수과정-방문학생】: 학교간의 협정이 아닌 개인이 해당 대학 방문을 통하여 학점을 취득하는 유학생【연수과정-기타 연수생】: 정규학위과정 학생, 교육과정 공동운영생, 어학연수생, 교환학생, 방문학생을 제외한 기타 연수생【언어능력-TOPIK 4급 이상(예･체능 3급 이상) 학생 수(대학, 대학원, 대학원대학)】: 학위과정생 중 TOPIK 시험에 응시하여 4~6급(예･체능계의 경우 3~6급)의 자격을 취득한 자(TOPIK IBT도 포함)【언어능력-TOPIK 3급 이상 학생 수(전문대학)】: 학위과정생 중 TOPIK 시험에 응시하여 3~6급의 자격을 취득한 자(TOPIK IBT도 포함)【언어능력-영어트랙 TOEFL IBT 59 수준 이상 학생 수】: 영어사용과정(영어트랙)으로 입학한 학생으로 영어 능력 TOEFL IBT 59(또는 IELTS 5.5, CEFR B2, NEW TEPS 202) 이상 취득한 자. 단, TOEIC 성적은 해당되지 않음'
