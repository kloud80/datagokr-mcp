description_portal: 부산광역시 남구의 도서 서비스 운영 실태를 종합적으로 파악할 수 있는 데이터셋입니다. 본 데이터에는 도서 배달 서비스인 ‘책나르미’ 배달 도서 목록과 주민 요구 기반의 ‘비치 희망도서’ 신청 및 비치 현황이 함께 포함되어 있어, 지역 내 도서 수요와 장서 구성 현황을 한눈에 확인할 수 있습니다.‘책나르미’ 데이터는 연령대·지역별 배달 도서 이용 특성을 분석하는 데 활용할 수 있으며, 희망도서 현황은 주민 수요 반영도와 도서관 장서 적정성을 평가하는 데 도움을 줍니다. 이를 통해 남구는 수요 중심의 장서 개발, 독서 문화 진흥 정책 수립, 맞춤형 도서 서비스 제공 등 다양한 행정적 활용이 가능합니다.
