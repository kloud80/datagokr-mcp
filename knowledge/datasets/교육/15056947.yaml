summary_user: 경기도 특수학교별 학생 수를 기준연도(STD_YY) 단위로 담는 학교별 집계 자료로, 유치원부터 초·중·고 학년별 학생 수, 전공과 학생 수, 단계별 순회학생 수, 총계를 함께 싣는다. 경기도 특수교육 담당자나 연구자가 "어느 시군·교육지원청 관할 특수학교에 고등학교 과정·전공과 학생이 몰려 있고 순회교육 대상은 몇 명인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 학교 데이터와는 학교명·시군명이나 경기도 시군코드(SIGUN_CD) 같은 같은 기관 코드로만 맞춰 붙인다.
description_portal: 본 데이터는 경기도 내 특수학교의 학생 수 현황을 학급 및 학년 단위로 제공하는 자료입니다. 유치원부터 고등학교 및 전공과까지의 학년별 학생 수를 포함하며, 각 학년의 순회학생수도 함께 제공되어 특수교육대상 학생의 교육 형태를 파악할 수 있습니다. 주요 항목은 유초등·중등·고등 단계별 학년별 학생 수, 전공과 학생 수, 순회교육 대상자 수, 전체 합계(총계사항)를 포함합니다. 순회학생은 일반적으로 특수교육교사가 일정 시간 학교를 방문하여 교육하는 형태의 교육 대상자를 의미합니다. 데이터는 학교명, 시군명, 지역교육청명, 설립구분명, 학교급명 등의 기본 정보와 함께 제공되며, 특수교육 정책 수립, 학급 및 교원 배치, 예산 수립 등의 행정적 활용뿐만 아니라, 특수교육의 질적 향상을 위한 연구 자료로도 활용될 수 있습니다. 본 데이터는 학교알리미 시스템을 기반으로 하며, 경기도 AI데이터행정과에서 연 1회 제공됩니다.
