summary_user: 전국 17개 시도교육청 관할 학교가 나이스(NEIS)에 입력한 급식 식단을 학교·급식일자·끼니(조식·중식·석식) 단위로 담으며, 요리명과 알레르기 유발 식재료, 원산지, 칼로리, 영양 정보가 함께 들어 있다. 학부모나 학생이 "우리 아이 학교의 이번 주 점심 메뉴와 알레르기 식재료는 무엇인가"를 확인하거나, 분석가가 학교별 식단의 영양 구성을 비교하는 데 쓴다. 나이스 학교코드(SD_SCHUL_CODE)를 키로 학사일정·시간표·학급 정보 같은 다른 나이스 일상 정보와 학교 기본정보에 이어 쓰고, 시도교육청 코드로 교육청 단위 묶음도 가능하다.
description_portal: 제공하는 데이터는 전국 17개 시도교육청 관할 학교에서 실제로 제공하는 급식의 요리명, 원산지 정보, 칼로리 정보, 영양 정보 등 일자별 급식 현황을 체계적으로 수집·제공하는 공공데이터입니다. 각 학교는 나이스(NEIS) 시스템을 통해 급식식단 정보를 입력·관리하며, 학교별 급식 운영 일정이나 식단 변경이 있을 때마다 수시로 데이터가 갱신됩니다. 데이터에는 알레르기 유발 식재료 정보도 포함되어 있어, 학생 건강 및 안전 관리에 활용될 수 있습니다. 데이터의 보유 및 제공 근거는 「초·중등교육법」에 따라 국가 교육정보화와 학교 행정 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 기반합니다. 이 데이터는 학교 급식 운영 현황 분석, 영양 관리, 식단 개선, 교육 정책 수립, 지역별 급식 수준 비교, 학부모 및 학생 대상 정보 제공, 공공 건강 연구, 데이터 기반 급식 서비스 개발 등 다양한 분야에서 활용될 수 있습니다
