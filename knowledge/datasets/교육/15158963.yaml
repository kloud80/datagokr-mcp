summary_user: 대학알리미에 공시된 대학의 기본 정보를 학교 단위로 담은 API로, 학교명·본분교·설립구분(국립·공립·사립)·학교종류·지역 코드와 공시년도를 제공하며 전체 377건, 전국 범위이다. 분석가나 지역 사업자가 우리 지역에 어떤 설립유형·종류의 대학이 몇 곳 있는지 파악하는 질문에 쓴다. 학교아이디(schlId)와 같은 기관의 코드로 대학알리미의 학생·교원·기숙사·등록금·재정 공시 데이터와 이어 쓰며, 전역 조인 키는 없다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 학교명·코드 매핑으로 직접 연결해야 한다. 학생 수, 등록금, 재정 같은 수치는 이 데이터에 없고 기본 정보와 코드 구분만 담는다. 개발계정은 하루 1,000회까지 호출할 수 있다.
