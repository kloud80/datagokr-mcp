description_portal: 본 문서는 초등학생 대상 온종일 돌봄 시설인 돌봄교실 현황을 상세히 제공합니다. 시도 및 시군구 단위로 학교명과 이용인원 정보를 포함하고 있어 지역별 돌봄 수요와 제공 현황을 파악할 수 있습니다. 특히 학교돌봄터, 청소년방과후 프로그램과 함께 초등돌봄 환경을 이해하는 데 유용하며, 교육부 공식 홈페이지를 통해 해당 데이터를 확인할 수 있습니다. 이 자료는 초등 돌봄 정책 수립과 개선 방안 마련에 중요한 기초 자료로 활용됩니다.교육부 대표 홈페이지 >> 초·중·고 교육 >> 초등돌봄교실 현황을 제공합니다. 시도, 시군구, 학교명, 이용인원을 제공합니다.
