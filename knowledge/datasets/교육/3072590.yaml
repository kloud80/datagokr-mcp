summary_user: 서울 노원구 관내 대안학교(대안교육기관)를 학교 한 곳당 한 행으로 담은 목록 파일로, 명칭·위치·건물 면적(제곱미터)·정원·전화번호와 위탁 운영하는 교육 과정(초·중·고, 비고란)을 기록한다. 노원구에서 자녀의 대안교육을 고민하는 학부모가 '집 근처에 중등 과정을 맡은 대안학교가 있고 정원은 몇 명인가'를 확인하거나, 연구자가 구의 대안교육 인프라 규모를 파악하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·통계와는 학교 이름이나 주소를 직접 맞춰야만 이어 쓸 수 있다.
description_portal: 본 데이터는 서울특별시 노원구 관내에 소재한 대안학교의 최신 현황 정보를 제공합니다. 노원구청에서 관리하는 대안교육기관의 기초 자료로서, 교육 소외 계층 지원 및 대안 교육 활성화를 위한 정책 수립과 연구의 기초 자료로 활용하기 위해 작성되었습니다.주요 포함 항목으로는 대안학교의 공식 명칭, 구체적인 소재지(위치), 시설의 규모를 파악할 수 있는 건물 면적, 수용 가능한 학생 정원, 상담 및 문의를 위한 전화번호 등이 포함되어 있습니다. 또한 '비고'란을 통해 해당 학교가 초등, 중등, 고등 과정 중 어떠한 교육 과정을 위탁 운영하고 있는지에 대한 상세 정보를 제공하여 사용자의 편의성을 높였습니다.이 데이터는 노원구의 교육 복지 인프라를 분석하고자 하는 연구자, 자녀의 대안 교육을 고민하는 학부모, 관련 정책을 수립하는 공공기관 등 다양한 수요처에서 유용하게 활용될 수 있습니다. 본 자료의 기준일자는 2026년 4월 14일이며, 노원구의 대안 교육 환경 변화를 반영하고 있습니다.
