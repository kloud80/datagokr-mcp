description_portal: 본 데이터는 서울특별시 성동구에 소재한 유치원의 수업일수 현황을 체계적으로 제공하기 위해 구축되었습니다. 유치원 수업일수는 연령별 표준 교육 일정 및 학사 운영의 기초 자료로, 유아의 발달 단계에 맞춘 교육과정 편성, 학부모의 예측 가능한 돌봄 계획, 정책적 기준 마련 등에 필수적인 정보입니다. 데이터에는 교육청명, 교육지원청명(행정 관할), 유치원코드(고유 식별번호), 유치원명, 설립유형(공립/사립 등), 3세 수업일수, 4세 수업일수 등 각 연령대별 연간 수업일수 현황을 세부적으로 확인할 수 있는 항목이 포함되어 있습니다. 성동구청 및 교육청 등 관할 행정기관에서 정기적으로 현황 점검 및 자료 갱신을 실시해 데이터의 신뢰성과 최신성을 적극적으로 확보하고 있습니다. 이 데이터는 유치원 교육행정 및 운영 정책, 정원 산정 기준 마련, 학부모 정보 제공, 기관별 교육환경 분석, 연구 자료 등 다양한 분야에서 폭넓게 활용될 수 있으며, 정책입안자·학부모·연구자 모두에게 실질적이고 객관적인 자료를 제공합니다. 데이터는 정기적으로 최신화됩니다.
