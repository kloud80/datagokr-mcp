summary_user: 한국유학종합시스템에 접수된 외국인 온라인 입학 지원자 수를 국가별 한 행으로 집계해 학사·석사·박사·석박사·전문학사·어학연수·교환학생·기타 과정별 인원과 남녀·합계를 담은 전국 단위 비공간 파일(csv, 약 3.9KB)이다. 유학생 유치 담당자나 정책 분석가가 "어느 나라 출신이 어떤 학위과정에 많이 지원하는가"를 보고 국가별 유치 전략과 대학가 유학생 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키나 국가코드가 없어 다른 국가별 통계와는 국가명(국가명) 문자열 매핑으로만 연결한다.
description_portal: 이 자료는 외국인의 국내 대학 유학 지원 현황을 국적과 학위과정별로 분석한 통계이다. 중국, 베트남, 카자흐스탄 등 다양한 국가 출신 유학생의 학사, 석사, 박사 과정 지원자 수와 전문학사, 어학연수, 교환학생 등의 현황을 보여준다. 특히 남녀 성별 인원수와 전체 합계가 포함되어 있어 국가별 유학생 규모와 다변화를 파악할 수 있다. 이를 통해 한국유학종합 시스템이 제공하는 온라인 입학 지원자 현황 데이터로서, 한국유학박람회와 STUDY IN KOREA 프로그램과도 관련된다. 이 정보는 외국인 유학생 유치 전략과 교육 정책 수립에 중요한 기초자료로 활용된다.외국인의 국내대학 유학을 위한 온라인 입학 지원자수를 국적별, 지원대학별, 학위과정별의 주제별 현황데이터로 제공
