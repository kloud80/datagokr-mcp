summary_user: 에듀넷의 초·중등 미술 교과 학습자료를 자료 한 건 단위로 정리한 목록으로, 과목·주제·부제·제목·키워드와 바로가기 URL을 담은 전국 범위 CSV 파일(약 17KB)이다. 교사가 "이번 단원 수업에 쓸 미술 주제별 자료가 에듀넷에 어떤 것이 있나"를 찾거나, 교육 콘텐츠 개발자가 주제·키워드별 자료 분포를 살펴볼 때 쓴다. 실측 컬럼에 학교·지역 코드 같은 공통 조인 키가 없어, 다른 교과의 같은 기관 주제별 학습자료와 과목·주제·키워드 이름을 맞춰 묶어 쓰는 정도로만 연결한다.
description_portal: 제공되는 데이터는 에듀넷을 통해 초·중등 미술 교과의 다양한 주제별 학습자료를 체계적으로 정리하여 제공하는 교육공공데이터입니다. 이 데이터는 교과과정에 따라 흥미로운 주제별로 구성되어 있으며, 각 자료에는 과목, 주제, 부제, 제목, 키워드, 바로가기 URL 등 구체적인 정보가 포함되어 있습니다. 자료는 에듀넷에서 개발 및 운영하는 교수학습자료를 기반으로 하며, 교육 현장과 교과과정의 변화에 따라 신규 자료가 추가되거나 기존 자료가 갱신되는 방식으로 수집됩니다. 데이터의 보유근거는 「초·중등교육법」에 따라 국가 교육정보화 및 교수학습 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 근거합니다. 업데이트 주기는 수시(1회성 데이터)로, 교육과정 개정이나 신규 자료 개발 시마다 최신 자료로 반영됩니다. 이 데이터는 교사들의 수업자료 준비, 학생들의 자기주도 학습, 교육 콘텐츠 개발, 교육 연구 등 다양한 교육 현장에서 폭넓게 활용될 수 있습니다.
