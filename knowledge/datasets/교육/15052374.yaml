summary_user: 서울특별시에 있는 중학교를 학교 한 곳당 한 행으로 담은 기본정보 목록이며, 표준학교코드·학교명·영문명, 관할 교육청·교육지원청, 설립 구분, 도로명주소·전화·홈페이지, 개교기념일 등이 들어 있다. 학부모나 서비스 개발자가 '우리 동네 중학교는 어디이고 어느 교육지원청 관할이며 공립인지 사립인지'를 확인하거나, 분석가가 서울 중학교의 분포와 설립 형태를 파악하는 데 쓴다. 표준학교코드(STD_SCHL_CD) 컬럼이 있어 학교 기본정보 마스터로 교원·학생·학급 통계나 학교 재정 자료에 붙이는 기준이 될 수 있으나, 실측에서는 전역 조인 키로 확인되지 않아 학교명·코드 매핑이나 같은 기관 코드로 연결해야 한다.
description_portal: 서울시 중학교 기본정보 데이터는 서울특별시에 위치한 중학교들의 기본 현황을 체계적으로 제공하기 위해 구축된 공공데이터입니다. 각 학교를 식별하기 위한 표준학교코드와 학교명, 영문학교명이 포함되어 있어 국내·외에서 학교를 정확히 구분하고 안내하는 데 활용할 수 있습니다. 시도교육청코드와 시도교육청명, 관할조직명 정보를 통해 각 학교가 어느 교육청과 교육지원청의 관할에 속하는지 알 수 있어 행정 처리와 민원 대응에 활용하기 적합한 구조입니다. 이 데이터는 서울시 중학교의 분포와 설립 형태, 관할 체계, 연락처, 위치 정보를 한눈에 파악할 수 있게 해 주며, 교육행정 업무, 학부모와 학생 대상 정보 서비스, 학교 검색·지도 서비스, 교육 인프라 분석 및 정책 수립, 연구 등 다양한 분야에서 팩트에 기반한 기초 자료로 활용 가능한 구조화된 공공데이터입니다.
