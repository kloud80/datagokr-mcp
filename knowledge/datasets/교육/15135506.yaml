summary_user: 사립대학별 적립금의 전기말누계액·당기인출액·당기적립액·기타증감·당기말누계액을 학교명·학급·학종·지역·회계구분 단위로 담은 결산 집계 파일로, 포털 설명상 전기 2023년·당기 2024년 기준이며 금액 단위는 천원이다. 분석가나 학부모·언론이 "어느 사립대학이 적립금을 얼마나 쌓아 두었고 한 해 동안 얼마를 꺼내 썼나"를 학교별·지역별로 비교하는 데 쓴다. 실측 컬럼에 학교 코드 같은 전역 조인 키가 없어, 대학알리미의 재학생·등록금 자료나 같은 기관의 다른 재정 자료와는 학교명 매핑으로만 이어 쓴다.
description_portal: '한국사학진흥재단_사립대학 적립금은 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 적립금 자료를 통해 사립대학 결산내용 중 적립금 전기말누계액, 당기인출액, 당기적립액, 기타증감액, 당기말누계액을 학교별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.전기 : 2023년당기 : 2024년'
