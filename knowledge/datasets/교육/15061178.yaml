summary_user: 청도군 내 폐교된 학교를 학교 한 곳당 한 행으로 담은 작은 파일(약 2.8KB CSV)로, 폐지학교명·폐교연도·소재지·토지와 건물 면적·관리 현황(임대·매각 등)·활용 현황을 기록한다. 청도에서 임대나 매각으로 활용할 수 있는 폐교 부지가 어디에 있고 면적이 얼마인지 알고 싶은 지자체 담당자, 귀촌·사업 희망자, 지역개발 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 학교명이나 소재지 주소로 맞춰 이어야 하며, 학교 기본정보나 다른 교육지원청의 폐교재산 목록과 이름·주소 매칭으로 연결한다.
description_portal: 청도군 내에서 폐교된 학교의 재산 현황을 종합적으로 안내하는 자료입니다. 이 데이터에는 폐교된 학교의 명칭, 위치(소재지), 부지 및 건물의 면적, 임대 또는 매각 현황, 활용(사용현황) 등 폐교 재산과 관련된 구체적인 정보가 포함되어 있습니다. 이러한 정보는 행정지원과 등 관련 부서에서 폐교의 설립·폐지 및 자산 변동 사항을 공식 행정 절차와 현장 조사, 재산 관리 기록 등을 통해 수집하며, 「공유재산 및 물품 관리법」 등 관련 법령에 근거해 공식적으로 보유·관리되고 있습니다. 해당 데이터는 매년 정기적으로 갱신되어, 청도군 내 폐교재산의 최신 현황을 반영합니다.이 자료는 지역 내 폐교 재산의 효율적 관리와 활용, 임대 및 매각 정책 수립, 공공자산의 투명한 운영, 지역사회 개발 및 활용방안 모색 등 다양한 분야에서 활용될 수 있습니다. 또한 정책 담당자, 연구자, 지방자치단체, 민간기업 등에서 폐교 재산의 활용 가능성 분석, 지역 개발계획 수립, 공공시설 확충 등에도 중요한 참고자료로 사용할 수 있는 교육 공공데이터입니다.
