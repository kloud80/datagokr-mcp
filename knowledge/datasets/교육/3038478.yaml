summary_user: 충청남도 14개 시군(교육지원청 구역) 전체의 유치원·초·중·고·특수·기타학교를 학교 한 곳당 한 행으로 담은 학교 현황 파일로, 포털 설명상 2025년 3월 기준이며 학교급·설립(공립/사립)·신설·휴교·휴원 여부, 학급수·학생수, 주소·연락처를 포함한다. 학부모나 지역 분석가가 "우리 읍면동에 있는 초등학교는 어디이고 학급·학생 규모는 얼마인가" 같은 질문에 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서 다른 학교 통계·재정 데이터와는 학교명·시군명·주소를 맞추는 방식으로만 이어 붙인다.
description_portal: 충청남도교육청의 학교 현황입니다.2025년 3월 기준 충청남도 전체 지역에 대한 학교별 정보입니다.충청남도 전체 14개 시군별 천안/아산/공주/부여/당진/서산/태안/보령/홍성/예산/서천/논산계룡/금산/청양 구역으로 구분하고그 아래에 각 14개 시군별 읍면동 정보를 포함하였습니다.유치원, 초등학교, 중학교, 고등학교, 특수학교, 기타학교로 구분하였고 학교별 설립 구분 공립/사립으로 나누었습니다.각 학교의 신설, 휴교, 휴원 등의 정보를 포함하였습니다.각 학교별 학급수와 학생수 정보가 포함되었고 학교별 우편번호 / 주소 / 연락처/ 팩스번호를 포함하였습니다.
