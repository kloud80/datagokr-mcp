summary_user: 인천광역시 연수구 관내 초·중·고등학교와 특수학교를 학교 한 곳당 한 행으로 담은 파일로, 학교 구분·학교명·학생 수·주소·위도·경도·교무실과 행정실 전화번호가 들어 있다(CSV 약 7KB). 학부모나 개발자가 '연수구 우리 동네 근처에 어떤 학교가 있고 학생 수는 얼마인가'를 확인하거나, 분석가가 지도 위에 학교 분포를 찍어 통학환경·교육 수요를 살피는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명 매칭이나 주소·좌표 기반 공간 결합으로만 이어 쓴다.
