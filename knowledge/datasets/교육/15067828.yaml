description_portal: 이 데이터는 과학학습콘텐츠에 첨부된 이미지·음원·비교 자료 파일 정보를 체계적으로 관리하기 위해 구축되었습니다. 각 파일마다 고유 아이디와 콘텐츠 아이디를 부여해 연관 콘텐츠를 식별할 수 있으며 메인·일반·비교 등 파일 그룹으로 역할을 구분합니다. 원본명·저장명·섬네일명과 URL 형태의 저장 경로가 포함되어 사용자는 실제 파일 위치를 즉시 확인할 수 있습니다. 파일 크기(Byte)와 JPEG·PNG·MP3 등 파일 종류 정보를 통해 용량·포맷 조건을 파악할 수 있고 사용유무 필드를 활용해 활성화된 파일만 선별할 수 있습니다. 이를 통해 교육 플랫폼 연동, 대용량 파일 관리, 통계 분석, 리소스 재활용 등 다양한 운영·분석 업무에 활용 가능합니다
