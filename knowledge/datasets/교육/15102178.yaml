description_portal: 제주특별자치도교육청 소속 초등학교, 중학교, 고등학교, 특수학교 등에 설치되어 있는 CCTV 설치 현황 정보를 제공하는 데이터입니다. 제공항목은 총 8개로 관할 교육청, 학교급, 설립구분, 학교명, 실내 CCTV수, 실외 CCTV수, 총 설치대수, 기준일 입니다. 관할교육청은 고등학교 및 특수학교의 경우 제주특별자치도교육청으로 들어가 있습니다. 초등학교 및 중학교는 학교소재기 주소에 따라 각각 제주시교육지원청 또는 서귀포시교육지원청으로 지정되어 있습니다. 학교급은 초등학교, 중학교, 고등학교, 특수학교로 구분되어 있으며, 설립구분 항목은 국립, 공립, 사립학교로 나누어져 있습니다. 그 외 실내, 실외 설치 CCTV 대수 및 총 설치대수를 확인할 수 있습니다.
