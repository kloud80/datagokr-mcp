summary_user: 서울 성동구·광진구 관내 고등학교를 학교 한 곳당 한 행으로 담은 목록으로, 학교급, 학교명, 공립·사립 구분, 행정구, 대표 전화번호, 도로명주소를 담는다(CSV 약 1.5KB). 학부모나 학생이 성동·광진 지역에 어떤 공립·사립 고등학교가 있고 연락처와 주소가 무엇인지 확인하는 데 쓴다. 전역 학교코드 같은 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 도로명주소를 맞춰 붙여야 한다.
limits: 표준 학교코드가 없어 교원·학생 통계 등과는 이름·주소 매핑으로만 연결되며, 이때 불일치가 생길 수 있다. 포털 설명대로 현행화 시점에 따라 실제 현황과 다를 수 있고, 범위는 성동구·광진구 고등학교에 한정된다.
