description_portal: '○ 통계개요* 통계명 : 평생교육기관 개황(구별)* 통계종류 : 평생교육기관 개황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「평생교육법」제18조* 작성목적 : 우리나라 평생교육기관에 대한 체계적이고 합리적인 평생교육통계조사를실시하여 정부 및 연구자, 일반 국민들의 정보 수요를 충족시키는 자료를제공하는 것을 목적으로 함* 조사체계 : 지역교육청 및 해당기관 → 서울특별시 평생교육담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 평생교육기관의 자치구별 기관수, 프로그램수, 수강인원,교ㆍ강사수, 사무직원 수 등 현황○ 용어설명* 프로그램수 : 교육기간이 1개월 이상이거나, 1개월 미만이지만 교육시수가 8시간이상인 프로그램'
