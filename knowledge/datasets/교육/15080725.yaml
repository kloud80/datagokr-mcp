summary_user: 한국장학재단 고졸자 후속관리 지원모델 개발 사업에 참여하는 거점학교(포털 설명상 24개교)를 학교 한 곳당 한 행으로 담은 목록 파일로, 학교명·시도·대표계열·학교유형·기준연도·주소를 담는다. 미취업·진로미결정 직업계고 졸업생이나 진로 담당 교사가 우리 지역에서 졸업 후 취업상담·취업역량 프로그램을 받을 수 있는 거점학교가 어디인지 찾는 데 쓴다. 전역 조인 키나 학교 코드는 없어서, 다른 학교 데이터와는 학교명·주소·시도 이름 매칭으로만 이어 쓴다.
description_portal: 고졸자 후속관리 지원모델 개발 사업에 참여하는 거점학교는 총 24개교로 중부권9개교, 충청권6개교, 경상권4개교, 전라권5개교입니다. 미취업, 진로미결정 직업계고 졸업생에게 친근감 있는 거점학교와 연계하여 진로상담 등 취업 컨설팅 및 취업역량강화프로그램 교육 제공을 졸업 후까지도 지속 지원하고 있으며, 인근 직업계고에게 사업 성과 공유 등 전파하는 사업입니다. 거점학교는 직업계고 졸업생을 위한 취업지원센터 공간을 마련하고 있으며 사업 전담 지원관이 고졸청년(졸업생)에게 1:1 맞춤 취업지원서비스 등을 제공하고 있습니다.
