description_portal: 이 데이터는 한국영유아보육·교육진흥원이 운영하는 「마음성장 프로젝트」 교육의 개최 현황을 정리한 통계 자료입니다. 해당 프로젝트는 보육교직원을 대상으로 한 심리·정서 지원 및 직무역량 강화 목적의 교육 프로그램으로, 교육 운영 실적을 수치로 기록하고 있습니다. 데이터는 교육명, 교육월, 교육횟수, 이수인원의 항목으로 구성되어 있으며, 각 항목은 교육별 운영 내역을 확인할 수 있도록 표 형식의 집계 구조로 제공됩니다. 이를 통해 특정 시기의 교육 횟수나 이수 규모, 월별 운영 패턴 등 정량적 교육 활동 이력을 확인할 수 있는 형태로 구성되어 있습니다. 교육 운영 실적에 대한 연속적 데이터로, 시계열 분석 또는 연간 교육 추진 현황 비교에 활용 가능한 구조입니다.
