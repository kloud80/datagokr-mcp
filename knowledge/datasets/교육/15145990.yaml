description_portal: '금천구 관내 유치원 교실 면적 현황을 데이터로 공개하고 있습니다.이 자료에는 관할 교육청, 유치원명, 유치원 유형(공립·사립, 법인·사인·단설·병설 등), 교실 수, 공간별 넓이(교실, 체육장, 보건·위생공간, 조리실·급식공간, 기타공간), 유치원 주소와 같은 정보가 담겨 있습니다.이 데이터를 통해 유치원의 교실 수와 공간별 면적 구성을 확인하실 수 있습니다. 또 이를 바탕으로 유치원의 교육·놀이·급식·위생 공간이 얼마나 확보되어 있는지 비교·검토할 수 있으며, 교육 시설 확충이나 개선 계획 수립에도 참고 자료로 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
