description_portal: '1. 데이터 소개본 데이터는 대구광역시 수성구 평생교육 강사현황에 대한 정보를 제공합니다.수성구 평생학습의 질적 향상과 투명한 강사 정보 제공을 목적으로 생성되었습니다.2. 데이터 항목(컬럼) 설명본 데이터는 총 5개의 항목(컬럼)으로 구성되어 있으며, 각 항목의 상세 설명은 다음과 같습니다.번호: 각 강사 데이터를 시스템 내에서 유일하게 식별하기 위해 부여된 고유 일련번호입니다.강사타입: 강사의 소속이나 자격 유형을 나타내는 분류 코드입니다.강사명: 수성구 평생교육 시스템에 등록된 강사의 공식적인 이름입니다.강의내역: 해당 강사가 특정 기간 동안 공식적으로 진행한 총 강의 횟수를 나타내는 숫자형 데이터입니다. 이는 강사의 활동 경험을 객관적인 수치로 보여주는 지표입니다.등록일: 해당 강사의 정보가 평생교육 시스템에 최초로 생성 및 등록된 기준 날짜입니다. (형식: YYYY-MM-DD)'
