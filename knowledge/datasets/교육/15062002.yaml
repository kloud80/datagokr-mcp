summary_user: 강원특별자치도교육청 관내 학교별 CCTV 설치 대수를 지역·학교급·학교명 단위로 담은 파일 데이터로, 범위는 강원 한 개 시도입니다. 학부모나 교육 분석가가 우리 지역 학교에 CCTV가 몇 대 설치돼 있는지, 학교급·지역별로 설치 수준이 어떻게 다른지 비교할 때 쓴다. 학교코드 같은 전역 조인 키가 없어 학교알리미 공시 등 다른 학교 단위 자료와는 학교명·지역명을 맞춰 연결해야 한다.
description_portal: 강원특별자치도교육청 지역별 학교급별 CCTV 설치 운영 현황 자료입니다.지역별, 설립별, 학교급별, 학교명, 화소별(200만 미만/200만 이상) CCTV 설치 대수를 제공하고 있어 학교 CCTV 설치 현황을 비교적 자세하게 확인하실 수 있습니다. 강원특별자치도교육청에서는 초·중등교육법 제30조의8(학생의 안전대책 등)과 학교안전사고 예방 및 보상에 관한 법률 제2장(학교안전사고예방) 등을 근거로  CCTV 설치 운영을 통해 학생 안전사고 및 시설관리 등 각급 학교에서 안전 사각지대에 피사체의 식별이 가능한 수준의 고화소 CCTV를 집중 배치하여 학교 안전을 강화하고 있습니다. 또한 개인정보 보호법을 준수하도록 하여 개인의 영상정보를 안전하게 관리하도록 노력하고 있습니다.
