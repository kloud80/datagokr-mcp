summary_user: 한국사학진흥재단 사립학교 교육환경개선 자금 융자사업의 분기별 변동 이자율(%)을 연도 한 줄에 1~4분기 값으로 담은 집계표로, 2014년 이후 13개 연도 행이 들어 있다. 사립학교 법인·대학 재무 담당자가 융자 원리금 상환 계획을 세우며 "올해 분기별 적용 금리가 어떻게 바뀌어 왔나"를 확인하는 데 쓴다. 전역 조인 키는 없고 연도를 기준으로 공공자금관리기금 차입 금리나 다른 금리 지표와 맞춰 비교하는 정도로 이어 쓴다.
description_portal: 한국사학진흥재단의 사업 중 하나인 "사립학교 교육환경개선 자금 융자사업"의 분기별 변동 이자율 현황을 제공하는 데이터입니다. 본 사업의 융자 이자율은 고정금리가 아닌 변동금리 체계로 운영되며, 관련 규정 및 내부 절차에 따라 매 분기마다 재산정됩니다. 산정된 이자율은 해당 분기 융자 원리금 상환에 적용되며, 이를 기준으로 차입 기관에 대한 원리금 수납이 이루어집니다.이자율 조정 시에는 재정경제부의 공공자금관리기금 차입 이자율을 기본 지표로 활용하며, 이와 함께 융자사업 잔액 규모, 당해연도 융자사업비, 자금 운용 여건 등 복합적인 요소를 종합적으로 고려하여 합리적인 수준에서 결정합니다. 확정된 이자율은 분기별로 관련 기관에 통지되며, 사업 운영의 투명성과 예측 가능성을 확보하는 데 목적이 있습니다.본 데이터는 2014년 이후부터 기준일 현재까지의 이자율 변동 추이를 포함하고 있으며, 연도별 및 분기별 이자율(%) 정보를 체계적으로 제공하고 있습니다. 이를 통해 사업 참여 기관 및 이해관계자는 시기별 금리 변동 흐름을 파악하고, 재무 계획 수립 및 자금 운용에 참고할 수 있습니다.
