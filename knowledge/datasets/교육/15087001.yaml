description_portal: 광주광역시 광산구에서는 주민자치 역량 강화와 문화 여가 활성화를 위해 2016년 한 해 동안 주민자치(문화·여가) 프로그램 현황 자료를 한시적으로 수집하였습니다.이 자료에는 각 프로그램의 명칭, 운영 장소 주소, 참여 대상(아동, 청소년, 성인, 어르신 등), 평균 참여 인원, 연간 운영 횟수, 회당 운영 시간, 프로그램이 개최된 장소 등의 세부 정보가 포함되어 있습니다.특히, 주제별·세대별 특성에 기반한 프로그램 운영 현황을 파악할 수 있어, 2016년 당시 광산구 주민들이 어떤 문화·여가 활동에 얼마나 참여했는지를 입체적으로 조망할 수 있습니다. 다만 이 자료는 2016년 자료만 존재하므로, 이후 변화된 주민 수요나 프로그램 운영 현황을 반영하지는 않고 있다는 점도 참고해야 합니다.
