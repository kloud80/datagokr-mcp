summary_user: 인천 미추홀구 안 초등학교를 학교 한 곳당 한 행으로 담은 원장 파일로, 학교명·설립유형·도로명주소·전화번호와 1~6학년 학년별 학급수, 특수학급수, 위도·경도를 포함한다. 학부모나 지역 분석가가 "우리 동네 가까운 초등학교는 어디이고 학년별 학급 규모와 특수학급 운영은 어떤가" 같은 질문에 답하거나 학교 배치를 지도에 올려 보는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 다른 학교 데이터와는 학교명·주소로 맞추거나 좌표로 공간 결합해야 하며, 학구도와 겹쳐 학구 단위 변화를 보는 보조 자료로 쓴다.
limits: 학교 표준 코드가 없어 학교알리미·나이스 자료와 정확히 1:1로 잇기 어렵고 이름 매칭에 의존한다. 범위가 미추홀구 한 곳에 한정되며, 학생 수·교원·시설 정보는 담지 않고 학급수만 담는다.
