description_portal: 이 데이터는 2025년 기준 국·공·사립 및 전문대학의 교육용 토지 세부 현황을 수록한 자료로, 해당 보유면적은 각 대학의 교지 확보율 산출 시 핵심 기초자료로 활용됩니다. 대학별 교육용 토지의 유형별 면적부터 지목의 유형, 교지 경계선 내외의 위치적 여건 등의 다각적인 공간 정보를 포함하고 있으며, 실제 교육 목적으로 활용하지 않는 유휴 토지 면적에 대해서도 확인할 수 있도록 구성되었습니다. 이는 대학이 제출한 자료를 기반으로 하는 한국사학진흥재단이 수행하는 고등교육기관 정보공시 업무의 정확성과 신뢰도를 높이는 데 기여합니다. 더 나아가 해당 데이터는  대학 간 인프라 비교, 재정지원 사업 타당성 검토 등 다양한 교육 정책 수립을 위한 객관적인 판단 기준으로 활용할 수 있습니다. 해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인하실 수 있습니다.
