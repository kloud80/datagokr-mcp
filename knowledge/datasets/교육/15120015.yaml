summary_user: 2025년 기준 국·공·사립대학(전문·원격 포함)의 교육용 토지 세부 현황을 대학별로 담은 xlsx 파일로, 토지 유형별 면적, 지목, 교지 경계선 안팎 위치, 실제 교육에 쓰지 않는 유휴 토지 면적을 포함하며 범위는 전국이다. 분석가나 정책 담당자가 "이 대학의 교지 확보율 산출 기초가 되는 보유 면적은 얼마이고 유휴 토지는 얼마나 되나" 같은 대학 간 인프라 비교나 재정지원 사업 타당성 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 대학알리미·대학재정알리미의 다른 공시 자료(학생·교원·기숙사·재정)와는 대학명 매칭이나 같은 기관의 코드로만 잇는다.
limits: 파일 첫 행이 제목이고 나머지 컬럼명이 비어 있어(Unnamed) 머리글을 직접 다시 지정해야 하며, 대학 코드 같은 표준 키가 없어 다른 데이터와 붙일 때 이름 매칭 오류에 주의한다. 위치 좌표가 없는 비공간 자료라 지도 분석에는 바로 쓰지 못한다.
