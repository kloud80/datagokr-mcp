summary_user: 제주특별자치도교육청 소속 초·중·고·특수·각종학교의 학사일정을 학교별 한 행으로 담은 엑셀 파일(xlsx, 약 112KB)로, 학교 개요·학급수·학생수·교원수, 학기별 수업일수, 개학·방학·졸업일, 재량휴업일수가 들어 있다. 학부모나 교육 분석가가 '제주 우리 아이 학교의 여름방학 시작일과 재량휴업일은 언제인가' 같은 질문에 쓴다. 실측 컬럼에서 학교 코드 같은 전역 조인 키를 찾지 못해, 다른 학교 데이터와는 학교명 매칭으로만 연결한다.
description_portal: 제주특별자치도교육청 소속 학교(초등학교, 중학교, 고등학교, 특수학교, 각종학교)의 학사일정 현황 정보를  제공하는 데이터입니다. 총 5개 엑셀시트로 작성되어 있으며 각 시트별 세부항목으로 각 학교별 개요와 기본현황, 수업일수 및 학사일정을 확인할 수 있습니다. 학교개요에서는 시도교육청, 지원청, 학교급, 설립구분, 학교명을 확인할 수 있고, 기본현황에서는 학급수(일반학급, 특수학급) 및 전체 학급수, 전체 학생수, 전체 교원수를 볼 수 있습니다. 수업일수 항목에서는 학기별 수업일수 및 총 수업일수를 확인할 수 있습니다. 학사일정에서는 개학일(입학일) 및 여름, 겨울, 봄방학관련 방학일자 및 개학일자, 그리고 졸업일 등을 확인할 수 있습니다. 그 외 재량휴업일(학기별 및 총 재량휴업일수)에 대한 정보도 해당 자료에서 확인할 수 있습니다. 자세한 내용은 제주특별자치도교육청 누리집(www.jje.go.kr) > 뉴스/소식 > 새소식 >  공지사항에서 확인할 수 있습니다.
