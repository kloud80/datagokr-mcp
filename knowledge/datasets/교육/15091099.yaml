description_portal: STEP(Smart Training Education Platform)은 한국기술교육대학교 온라인평생교육원이 운영하는 국가 직업능력 개발 플랫폼으로, 고용노동부의 정책 방향에 따라 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공합니다. 이 플랫폼은 이러닝 기반의 자기주도 학습을 중심으로 구성되어 있으며, 각 교육 과목은 회차별 콘텐츠로 세분화되어 운영됩니다.회차별 콘텐츠는 학습자가 교육 과정을 체계적으로 따라갈 수 있도록 구성된 단위 학습 모듈로, 각 회차는 고유한 제목을 가지고 있으며 해당 회차의 학습 목표, 주제, 핵심 개념을 명확히 전달하는 역할을 합니다. 이러한 제목은 단순한 명칭을 넘어 학습자의 이해를 돕고, 콘텐츠의 흐름을 구조화하는 데 중요한 기능을 합니다.
