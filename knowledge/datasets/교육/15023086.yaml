summary_user: 대구광역시남부교육지원청 관내 유치원·초등학교·중학교를 한 행에 한 곳씩 담은 학교 목록 파일로, 학교급·설립 구분·학교명·행정구역·우편번호·주소·전화·팩스·홈페이지를 담는다(포털 설명상 2025.4.1. 기준). 학부모나 분석가가 '남부교육지원청 관할 동네에 있는 공립·사립 초등학교와 연락처는 어디인가'를 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 주소·행정구역을 맞춰 붙여야 한다.
description_portal: 해당 파일은 대구광역시교육청 산하 대구광역시남부교육지원청 유치원 및 초중등학교 현황 데이터 입니다.2025.4.1. 기준 대구광역시남부교육지원청 관내 유치원 및 초등학교, 중학교 현황에 관한 데이터로 학교(유치원)명, 주소를 비롯한 기본 정보에 관한 데이터를 제공합니다.＊대구광역시남부교육지원청 관할 개별 학교에 대한 구체적인 사항에 대해서는, 해당 학교 또는 관할 교육지원청(대구광역시남부교육지원청)으로 문의해주시기 바랍니다.- 대구광역시남부교육지원청 행정지원과(053-234-0125)
