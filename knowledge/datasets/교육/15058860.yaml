summary_user: 경기도 특수학교별로 기준년도마다 유치원·초·중·고 과정의 학년별 학생 수, 순회학생·전공과 학생 수, 총 학생 수, 교사 수와 교사 1인당 학생 수를 담은 학교 단위 집계 자료이며, 범위는 시도(경기도) 단위다. 교육행정 담당자나 분석가가 'OO 시군의 특수학교는 교사 1인당 학생 수가 얼마이고 공립과 사립 간에 차이가 있는가'처럼 특수교육 수요와 학급·교원 배치의 적정성을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 학교명이나 시군코드(SIGUN_CD), 정보공시 학교코드로 보이는 필드(INFO_PBLNTF_SCHOOL_CD)를 이용해 학교 기본정보, 교원·학생 통계, 재정 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 지역 내 특수학교를 대상으로 학년별 학급수와 학생수, 교사 수 등을 집계한 자료로, 연도별 시군 및 교육청 단위로 제공됩니다. 항목은 기준년도, 시군명, 지역교육청명, 학교명, 설립구분, 학급별 학생 수, 순회학생 수, 전공과 학생 수, 총계학생 수, 교사 수, 교사 1인당 학생 수 등으로 구성되어 있습니다. 해당 데이터는 특수교육 수요 파악, 학급 구성 계획, 교육 인프라 적정성 분석 등에 유용하며, 특히 교사 1인당 학생 수 정보는 교육 서비스의 질적 관리와 자원 배분의 기초 자료로 활용될 수 있습니다. 공립과 사립학교의 운영 규모 비교 및 연도별 변화 추이 분석에도 활용 가능한 공공 교육데이터입니다.
