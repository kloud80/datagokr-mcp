description_portal: '본 데이터는 국립중앙과학관이 제공하는 과학학습용 3D프린터 콘텐츠 자료입니다. 3D프린터의 개념, 역사, 출력 방식(FDM, SLA, SLS 등), 구동 방식(카르테지안, 델타), 다양한 소재(금속, 세라믹, 바이오, 유연한 재료), 3D 모델링 및 슬라이싱 소프트웨어, 국내외 기술 및 개발 동향, 표준화, 의료·기계·전자 등 응용 분야까지 폭넓게 다룹니다. 각 주제별로 PDF 자료가 첨부되어 있어 과학기술 교육, 연구, 창작, 산업 현장 등 다양한 분야에서 활용이 가능합니다데이터 항목명: 콘텐츠 아이디, 대분류코드, 중분류코드, 컨텐츠명, 이름, 감수자, 공개유무, 첨부파일※ 대전광역시 유성구 대덕대로 481(국립중앙과학관)'
