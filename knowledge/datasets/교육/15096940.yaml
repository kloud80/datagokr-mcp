summary_user: 제주특별자치도 관내 국·공립 특수 목적 고등학교(과학고·외국어고·예술·체육고 등)의 학교 수·학급 수·학생 수·교원 수·직원 수·교지·건물 면적·교실 수를 기준 연도와 시군구별로 집계한 통계로, 학교 단위 원천이 아닌 집계 자료이며 포털 설명상 2012~2019년을 다룬다. 교육 행정 담당자나 연구자가 '제주의 특목고 학생 수와 학급 규모가 연도별로 어떻게 변했나'를 확인하거나 특목고와 일반고 비율을 비교하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·교원·학생 통계와는 기준 연도와 시군구 이름을 맞춰서만 연결된다.
description_portal: 이 데이터셋은 2012년부터 2019년까지 제주특별자치도 관내에 등록된 국립 또는 공립 특수 목적 고등학교들의 학교 수, 학급 수, 학생 수 등의 현황을 연도별로 집계한 공공 통계자료이다. 특수 목적 고등학교란 일반 고등학교와 달리 과학고, 외국어고, 예술·체육고 등 특정 교육 목적을 가진 고등학교를 뜻하며, 본 자료는 이러한 학교들의 분포와 규모 변화를 파악할 수 있다. 해당 정보는 지역 교육 인프라 분석, 학교 설립·운영 정책 수립, 교육 자원 배분 검토, 학생 모집 현황 비교, 특목고와 일반고 간 비율 분석 등 교육 행정 및 연구 목적으로 활용될 수 있다. CSV 형식으로 공개되어 있어 누구나 다운로드 가능하며, 행정기관·교육 연구기관·지방자치단체 등에서 제주 지역의 고등교육 체계 현황을 객관적으로 점검하는 기초자료로 유용하다.
