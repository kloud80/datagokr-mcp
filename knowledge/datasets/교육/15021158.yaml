summary_user: 초중등학교와 학구(통학구역)를 연결하는 표준데이터로, 학구ID·학교ID·학교급·시도교육청·교육지원청 정보를 행 단위로 담고 전체 17,985건이다. 이사를 앞둔 가구나 부동산 분석가가 특정 지역 학구가 어느 학교와 연결되는지 확인하는 질문에 쓴다. 학교ID(school_cd)를 조인 키로 삼아 학교 기본정보 계열 데이터와 이어 쓰고, 시도교육청·교육지원청 코드로 지역별 묶음 집계를 한다.
limits: 필드 목록에 학구의 경계 좌표나 주소 범위가 없어 아파트 단위 배정 여부를 이 표만으로 판단할 수 없고, 학구 경계가 폴리곤인지 주소 범위 텍스트인지는 확인되지 않았다. 실측 최신 행 날짜는 2026-03-20이며 수신 범위도 이 날짜 하나로 확인되므로, 학구 조정 반영 시점은 별도로 확인해야 한다.
