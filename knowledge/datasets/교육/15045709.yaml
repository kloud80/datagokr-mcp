description_portal: 서울,인천, 경기권 대학에 입학하는 지역학생들을 위한 남도학숙은 광주광역시와 전남에서 공동으로 운영하고 있습니다. 2025년 남도학숙 입사경쟁률 및 선발인원 현황 자료입니다. 광주와 전남에서  각각 모집하고 있으며 신입생, 재학생, 남성, 여성 경쟁률을 확인할수 있습니다.입사경쟁률, 재입사 및 신규입사 선발인원, 계열별 신규입사 선발인원 등의 정보를 광주,전남 각각 제공합니다.해마다 경쟁률은  광주 전남 지역별, 신입생, 재학생, 남성, 여성 다르므로 남도학숙 입사 선발 지원시 참고하시기 바랍니다.
