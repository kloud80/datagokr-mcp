summary_user: 경기도 특수학교별로 유치원·초등·중학·고등(전공과 포함) 과정의 학년별 남녀 학생 수와 순회학급 학생 수를 집계한 학교 단위 자료로, 교육청명·시군명·학교명·설립 구분이 함께 실린다. 특수교육 행정 담당자나 분석가가 '경기도 시군별 특수학교의 학년별 남녀 학생 분포가 어떻게 다른가'를 확인하고 시설·인력 배치를 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 학교 정보·통계와는 학교명이나 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD) 같은 같은 기관 코드로 맞춰 이어 붙여야 한다.
description_portal: 이 데이터는 경기도 내 특수학교에 재학 중인 학생들의 성별 현황을 학급 및 학년별로 집계한 자료입니다. 유치원, 초등, 중등, 고등 및 전공과 과정별로 남학생과 여학생 수를 구분하여 제공하며, 각 과정에서 운영되는 순회학급 학생 수도 별도로 산출됩니다. 총계 항목에는 학급 내 학생 수뿐 아니라 순회학급 학생 수까지 포함한 합계가 제공되어, 특수학교 교육 대상자의 규모를 정확히 파악할 수 있도록 구성되어 있습니다.자료에는 지역교육청명, 시군명, 학교명, 설립 구분(공립/사립), 학교급 등이 함께 제공되어 지역별 및 학교 유형별 비교 분석이 가능하며, 성별 및 학년별 학생 분포를 통해 특수교육 수요를 세밀하게 파악할 수 있습니다. 특히 유·초·중·고 구간별 학생 현황과 전공과 학생 현황을 모두 포함함으로써, 특수교육의 전 교육단계를 종합적으로 살펴볼 수 있는 특징을 갖습니다.이 데이터는 학령기 특수교육대상자의 성별 구성과 교육단계별 분포를 확인하고, 특수학교의 교육정책 수립 및 시설·인력 배치 계획을 지원하는 기초자료로 활용됩니다. 원천 데이터는 ‘학교알리미’를 기반으로 하며, 경기도 AI데이터행정과에서 연 1회 갱신하여 제공합니다.
