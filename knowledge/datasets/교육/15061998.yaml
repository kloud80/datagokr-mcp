summary_user: 강원특별자치도 내 국·공·사립 유치원(병설 포함)과 초등학교·특수학교의 놀이시설을 시설 단위로 담은 CSV 파일(약 40KB)로, 시설번호·놀이시설명과 안전검사 여부, 안전교육 이수, 보험 가입 여부를 담는다. 학부모나 교육행정 담당자가 우리 지역 학교 놀이시설이 안전검사를 받고 보험에 가입돼 있는지 확인하거나, 미검사·미가입 시설을 골라 점검 대상을 정하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 학교알리미 공시 등 다른 학교 데이터와는 놀이시설명 속 학교 이름을 맞춰 연결해야 한다.
description_portal: '강원특별자치도교육청 학교 놀이시설 현황  데이터를 제공합니다.놀이시설 번호, 학교별 놀이 시설명, 안전 검사 여부, 안전 교육 이수 여부, 보험 가입 현황을 확인하실 수 있습니다.데이터에는 아래의 유치원, 학교의 놀이시설 정보를 포함하고 있습니다.※ 유치원: 국·공·사립 유치원(병설유 및 강원특별자치도교육청유아교육원 포함)※ 학교: 국·공·사립 초등학교, 특수학교 해당 데이터는 행정안전부 어린이놀이시설 안전관리시스템(www.cpf.go.kr)을 통해 관리하고 있으며,학교 이외의 다른 기관에서 관리하는 놀이시설 현황도 확인이 가능합니다.'
