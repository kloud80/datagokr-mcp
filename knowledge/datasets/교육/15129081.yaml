summary_user: 경기도 인재개발원 홈페이지에 게시된 콘텐츠를 한 건씩 담은 목록으로, 콘텐츠 구분(div)·일련번호·제목·설명·게시 여부와 게시 시작·종료일·작성·수정일·링크 주소와 위치·색상 정보를 담는다. 공무원 교육 담당자나 분석가가 특정 기간에 어떤 교육 편성표·학습 이벤트·출석 이벤트·전자책 오디오북·공무원교육기관 링크가 게시됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 콘텐츠 제목 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 인재개발원 홈페이지에 게시된 콘텐츠 목록과 관련 정보를 담고 있으며, 교육 콘텐츠 운영 및 현황 파악을 위한 기반 자료입니다. 주요 항목으로는 콘텐츠 구분, 콘텐츠 일련번호, 제목명, 설명, 게시 시작 및 종료일, 작성·수정일, 링크 주소 및 위치, 색상 정보 등이 있으며, 교육 콘텐츠, 학습 이벤트, 출석 이벤트, 학습후기, 전자책 오디오북, 공무원교육기관 링크 등 다양한 콘텐츠 유형이 포함되어 있습니다. 특히 교육 편성표, 학습 이벤트, 가족 사이트 등은 교육 콘텐츠 관리 및 사용자 접근성 향상에 활용됩니다. 콘텐츠 현황 데이터를 분석하면 특정 기간 동안 운영된 교육 테마, 이벤트 기획, 기관별 협업 현황을 파악할 수 있습니다.
