summary_user: 국가기술자격 종목별로 개요·변천과정·수행직무·진로 및 전망·취득방법 같은 안내 항목을 종목명·항목·내용의 세로형 텍스트로 담은 전국 단위 파일(CSV 약 2.2MB)이다. 수험생·진로지도 교사·자격정책 담당자가 "이 자격증은 어떤 일을 하고, 어디로 진출하며, 어떻게 따는가"를 종목별로 확인하거나 안내 콘텐츠를 만들 때 쓴다. 전역 조인 키가 없어서 시험 일정·합격률·자격 보유 같은 다른 국가자격 데이터와는 종목명 문자열을 맞추거나 같은 기관 코드로만 연결한다.
