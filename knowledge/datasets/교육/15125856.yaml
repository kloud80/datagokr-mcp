description_portal: '"전라남도교육청_사립학교 법인 현황" 데이터는 전라남도 내에서 운영되는 사립학교 법인의 현황을 종합적으로 제공하는 공공데이터입니다. 이 데이터에는 법인명, 소재 지역(시군구), 법인 설립일, 설립자, 현재 이사장, 법인 유형, 해당 법인이 운영 중인 학교명, 데이터 기준일 등 사립학교 법인 관리와 관련된 주요 정보가 포함되어 있습니다. 단, 전라남도 내에 학교가 있더라도 타 시도 관할 법인은 제외됩니다.해당 정보는 전라남도교육청 정책기획과에서 각 법인 및 학교로부터 공식적으로 제출받은 자료를 바탕으로 수집하며, 「사립학교법」 및 「교육관련기관의 정보공개에 관한 특례법」 등 관련 법령에 근거해 보유·제공됩니다. 데이터는 연 1회 정기적으로 갱신되어, 법인 설립, 이사장 변경, 운영 학교 변동 등 주요 사항이 발생할 때마다 최신 정보가 반영됩니다.이 데이터는 행정기관의 사립학교 법인 관리, 정책 수립, 연구기관의 교육 인프라 분석, 언론 및 지역사회의 사립학교 현황 파악 등 다양한 분야에서 활용됩니다. 특히, 법인별 운영 학교 현황과 이사장, 설립일 등 상세 정보는 사립학교 운영의 투명성 확보, 법인별 특성 분석, 정책 개선의 기초자료로 중요하게 쓰입니다.이처럼 "전라남도교육청_사립학교 법인 현황" 데이터는 지역 내 사립학교 법인 운영의 투명성과 효율성을 높이고, 다양한 교육 주체의 의사결정과 정책 수립에 실질적인 도움을 주는 핵심 공공정보입니다'
