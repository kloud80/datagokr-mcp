summary_user: 경기도 내 학교의 학교용지 면적(교사대지·기타, 체육장, 부속토지, 합계)을 기준연도별 학교 단위로 담고, 공동사용 여부와 설립유형(단설·부설), 학교급, 시군·교육지원청 구분을 함께 싣는다. 교육 분석가나 지자체 담당자가 우리 시군 학교들의 학생 1인당 체육장 면적이 다른 지역보다 부족한지, 어느 학교가 부지를 공동으로 쓰는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 학생 수·학교 기본정보 같은 다른 데이터와는 학교명이나 학교코드(INFO_PBLNTF_SCHOOL_CD), 시군 코드를 매핑해 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 학교용지 현황을 제공합니다. 지적법상 ‘학교용지’는 학교 교사(校舍)와 이에 접속된 부속시설물의 부지 및 체육장 등을 포함하는 토지를 의미합니다. 데이터에는 교사대지 및 기타면적, 체육장 면적, 소계 면적, 부속토지 면적, 합계 면적 등의 정보가 포함되어 있으며, 각 학교별로 공동사용 여부(O, X)와 설립유형(단설, 부설)도 확인할 수 있습니다. 이를 통해 특정 학교가 충분한 체육·교육 공간을 확보하고 있는지, 또는 여러 학교가 동일 부지를 공동 활용하는지 분석할 수 있습니다. 이 데이터는 학교 교육환경 분석, 지역별 교육 인프라 불균형 진단, 체육 및 교사 공간 확보 정책 수립에 활용할 수 있으며, 학생 수 데이터, 체력 증진 데이터 등과 연계하면 교육 환경과 학생 성장 간의 상관관계 연구에도 유용합니다.
