summary_user: 외국인 고용과 관련해 한국산업인력공단이 관리하는 자격증 종류·자격증명과 국가 이름·번호를 담은 코드성 목록 파일입니다(zip 1,569바이트의 소규모 파일, 전국·비공간 범위). 외국인 근로자를 채용하려는 사업자나 고용허가제 담당자가 '이 외국인이 보유한 자격증이 어떤 종류로 분류되고 어느 나라 것인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 자격증 종류코드나 국가 번호·국가 이름을 같은 기관의 다른 외국인 고용 데이터와 이름·코드 매핑으로 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와는 이름이나 코드를 직접 맞춰야만 연결된다. 파일 크기가 매우 작은 코드성 목록이므로 개별 외국인의 경력·자격 보유 내역이나 건별 통계로 해석하지 않는다.
