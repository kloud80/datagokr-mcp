description_portal: 'OECD 교육지표 및 사이버대학 학교현황과 관련된 통계, 한국의 교육지표, 그리고 교육정보화 백서 등 다양한 교육통계와 정보화 내용을 포함하고 있습니다. 이를 통해 교육 현황과 발전 방향을 종합적으로 파악할 수 있으며, 교육 정책 수립과 연구에 유용한 자료로 활용됩니다. 교육분야의 다양한 통계와 지표를 체계적으로 제공하여 교육의 질 향상과 정보화 진전에 기여하고 있습니다.제공데이터 : OECD 교육지표, 사이버대학 학교현황 및 관련 통계, 한국의 교육지표, 교육정보화 백서 등 교육부 교육 통계 및 정보화 내용을 확인할 수 있습니다.'
