summary_user: 강원특별자치도교육청 소속 유치원·초·중·고·특수학교·각종학교의 기본현황을 학교 한 곳당 한 행으로 담은 파일로, 관할 교육지원청·학교이름·주소·전화번호·홈페이지를 도내 18개 시군 범위로 담는다. 학부모나 주민이 '우리 동네 시군에 어떤 학교가 있고 연락처·홈페이지는 무엇인가'를 찾거나, 분석가가 도내 학교 명부를 만들 때 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 교원·학생·학급 통계나 다른 시도 학교 데이터와는 학교이름·주소 매핑으로만 이어 쓴다.
description_portal: 2026학년도 (2026년 4월 1일 기준) 강원특별자치도교육청 소속 유치원, 초등학교, 중학교, 고등학교, 특수학교, 각종학교 등의 학교기본현황 자료(관할교육지원청, 학교이름, 학교주소, 학교전화번호, 학교홈페이지 주소 등)로 강원특별자치도내의 18개 시군의 학교현황 정보를 확인하실 수 있습니다.강원특별자치도교육청 각급학교 현황은 매년 4월 1일 기준으로 작성되며, 작성된 자료는 교육기본통계로 교육정책의 자료 사용되며 학교알리미를 통하여 대국민서비스를 제공하고 있습니다.
