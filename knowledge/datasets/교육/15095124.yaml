description_portal: 국가교육과정정보센터에서는 초‧중‧고등학교 총론/교과/교과 외 교육과정 및 관련 정보를 제공하고 있습니다. 개방 데이터는 국가 수준의 교육과정 총론과 교과/교과 외 교육과정, 성취기준 및 연구보고서, 시도교육청이 마련한 지역 교육과정, 해외 교육과정 문서 정보를 제공하고 있습니다. 학계·연구기관에서는 현행 교육과정의 분석, 우리나라 교육과정 변천사 분석, 지역 교육과정 사례 분석, 외국 교육과정 관련 정보 확보 등에 활용할 수 있고, 학교 현장에서는 국가 및 지역 교육과정의 이해와, 학교 교육과정의 설계·운영, 교수·학습 및 평가 계획 수립을 위한 기초 자료로 활용할 수 있습니다. 특히 우리나라 교육과정은 구한말부터 최근의 교육과정 문서를 한 곳에서 찾을 수 있어, 교육과정에 대한 접근성과 이해도를 높일 수 있습니다.
