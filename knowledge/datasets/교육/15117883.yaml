description_portal: '- 인근 광주광역시부터 서울, 경기, 인천 등 수도권에서의 각 지역별 등록자 현황에 대한 자료를 조회하실 수 있습니다.- 전남도립대학교는 전라남도 담양군 담양읍 죽녹원로 152에 위치한 공립 전문대학입니다. 1998년 담양대학교로 설립되었으며, 2004년 전남도립대학교로 교명을 변경하였습니다. 현재는 국립목포대학교와의 통합을 추진 중에 있습니다.- 전남도립대학교는 약 220,000㎡ 규모의 캠퍼스를 보유하고 있으며, 캠퍼스는 자연과 조화를 이루는 설계로, 학습과 휴식을 동시에 제공합니다.- 전남도립대학교는 실무 중심의 교육과 다양한 비교과 프로그램을 통해 학생들의 취업과 창업을 지원하고 있습니다.'
