description_portal: '- 한국장학재단은 중장기 제도개선, 사업기획, 정책수립 지원 등 심층적인 전문연구가 필요한 경우, 외부연구자와 협업하여 정책연구를 진행하고 있음.- 정책연구는 한 가지 사업에 국한되지 않고 국가장학, 대출, 직업계고 학생 지원 등 다양한 방면의 사업에 대한 개선점 도출을 위해 한국장학재단에서 실시하고 있음.- 해당 데이터는 수행이 완료된 정책연구의 연구명, 주요 연구내용, 연구책임자, 연구기간의 내용을 담고 있음.- 해당 데이터는 2021년부터 5개년치 정책연구에 대하여 누적 관리하고있음.- 한국장학재단은 공개가능한 정책연구 보고서를 2023년도부터 공공데이터 포털을 통해 개방하고 있습니다. 공공데이터 포털 검색창에 연구명으로 검색하시면 개방중인 연구보고서 이용이 가능합니다.※ 정책연구 현황 목록에는 있으나 연구보고서 조회가 되지 않는 경우는 비공개이거나 개방전으로 상단의 관리부서로 문의바랍니다.'
