description_portal: ‘한국학중앙연구원_장서각 장용영고사’ 데이터는 1785년 조선 정조가 왕권 강화를 위해 설치한 국왕 친위 군영인 장용영(壯勇營)의 운영 관련 기록을 담은 본문형 고문서 데이터입니다.해당 자료는 장서각에 소장된 『장용영고사』의 원문 텍스트를 XML 형태로 디지털화한 것으로, 각 문서는 일자, 본문 내용, 지시사항, 인용 문구, 책임 주체, 군사 행정 정보 등을 구조화된 태그로 포함하고 있습니다.본문에는 정조의 명령을 포함한 병력 운영, 군사 훈련, 무기·식량 지급, 비상 대응, 보고 체계 등의 내용이 포함되어 있으며, 고사(考事)의 성격상 실무 행정문서 형식의 기록물이 다수 포함되어 있어 정조 시기 왕실 중심 군영 운영 체계와 군사권 통제 방식을 파악하는 데 핵심 사료로 기능합니다.이 데이터는 조선 후기 군제 연구, 친위군 운용 방식 고증, 정조의 정치 전략 분석, 고문서 디지털 인문학 분야에서 활용 가치가 높으며, 특히 XML 기반 구조로 구성되어 있어 데이터 색인 구축, 학술 검색 시스템 등에도 활용될 수 있는 공공 기록 데이터입니다.
