description_portal: 충청북도 충주시 시립도서관에 비치된 장서의 주제별·자료유형별 현황을 제공하는 데이터입니다.자료유형(도서, 비도서 등), 주제분류(총류·문학 등), 열람대상(일반·아동 등), 수량 등의 항목으로 구성되어 있으며, 도서관 장서 구성 분석, 주제 편중도 검토, 자료 수집 계획 수립 등에 활용됩니다.행제목은 한국십진분류법(KDC)을 기준으로 분류된 주제 범주이며, 예시로 ‘총류’, ‘문학’, ‘사회과학’ 등이 포함됩니다.열제목은 자료 이용대상 또는 유형별 구분으로, ‘일반’등의 형태로 세분화될 수 있습니다.수량은 각 주제 및 대상별 소장 자료 수를 의미하며, 정기적으로 갱신되는 장서 점검 결과를 기준으로 작성됩니다.본 데이터는 공공도서관 자료 정책 수립, 주제·연령대별 수요 대응, 장서 균형성 평가, 지표 기반 자료구입 계획 등에 활용 가능합니다.※ 일부 자료는 중복 비치 또는 폐기 등으로 실제 열람 가능 수량과 차이가 있을 수 있으며, 최신 정보는 시립도서관 장서관리 시스템을 기준으로 확인해야 합니다.
