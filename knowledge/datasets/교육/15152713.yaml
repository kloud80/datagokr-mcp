summary_user: 수원교육지원청 관내 초등학교 통학구역을 도로명·지번 주소와 건물명 단위로 학교명에 대응시킨 건별 원천 목록으로, 2024년 10월 8일 등록된 2025학년도 입학용 자료이며 CSV 파일 약 3.6MB 규모다. 수원에서 집이나 아파트를 고르는 학부모가 '이 주소·이 아파트는 어느 초등학교에 배정되나'를 확인하는 데 쓴다. 전역 조인 키가 없어 주소(지번·상세주소)나 학교명 문자열을 매칭해 학교 기본정보·주소 데이터와 이어 써야 한다.
description_portal: 경기도교육청 경기도수원교육지원청 통합 홈페이지 시스템의 통학구역 정보를 제공합니다.2024년 10월 8일에 등록한 초등학교 통학구역 정보입니다.  해당 통학구역 정보는 2025학년도 초등학교 입학을 위한 통학구역 자료로 활용됩니다. 본 자료는 수원 관내 초등학교 통학구역 찾기 검색을 통해 도로명, 지번, 학교명, 건물명을 기준으로 검색어를 입력하면 해당하는 통학구역이 나옵니다. 경기도수원교육지원청 홈페이지(goesw.kr) > 알림마당 > 입학/전학 안내 > 초등학교 통학구역 찾기 메뉴에서 확인 가능합니다.
