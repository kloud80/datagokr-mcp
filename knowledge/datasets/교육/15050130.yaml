summary_user: 평생교육법에 근거해 설치된 전국 평생교육시설을 기관 한 곳당 한 행으로 담은 목록으로, 조사연도·시도·지역·기관명·기관유형 대분류·우편번호·주소·대표 전화번호를 포함하며 2024년 12월 31일 기준 평생교육통계조사 결과다(CSV 약 885KB). 학습자나 정책 담당자가 '우리 시·군·구에 어떤 유형의 평생교육시설이 몇 곳 있고 연락처는 무엇인가'를 확인하거나 지역별 시설 분포를 비교하는 데 쓴다. 기관 코드 같은 전역 조인 키가 없어 다른 데이터와는 시도·지역 이름이나 주소·우편번호를 맞춰 지역 단위로 잇거나 기관명 매칭으로 연결한다.
description_portal: '평생교육통계조사는 평생교육법 제18조에 의거하여 실시하는 국가통계조사로, 우리나라 평생교육기관의 기본저인 현황파악을 통해 합리적이고 체계적인 평생교육정책 입안 및 지원, 평생교육 활성화에 기여하는 데 목적이 있습니다.  평생교육통계조사 주요 조사 항목으로는 기관개황, 프로그램 및 학습자, 강사, 사무직원 등이 있으며, 본 자료는 2025년 5월에 실시한 평생교육통계 조사 결과(조사기준일 : 2024년 12월 31일) 로서 평생교육법에 의해 근거하여 설치된 평생교육시설의  기관분류, 기관명, 기관주소, 전화번호등을 제공합니다.'
