description_portal: 광양시 독서마라톤 신청 도서 데이터는 시민이 참여하는 독서문화 진흥 프로그램의 핵심 자료로, 독서마라톤에 신청된 다양한 도서의 현황을 담고 있다. 데이터는 시행연도, 신청 도서명, 출판사명, 작가명 항목으로 구성되어 있으며, 연도별 참가자가 선택한 책의 주제와 출판 경향을 확인할 수 있다. 예를 들어 문학, 철학, 역사, 자기계발, 아동도서 등 폭넓은 분야가 포함되어 있으며, 위즈덤하우스, 한스미디어, 다락원, 아울북 등 다양한 출판사의 자료가 망라된다. 이를 통해 독서 트렌드 분석, 연령별 독서 선호도 연구, 도서관 장서 확충 계획 수립 등에 활용할 수 있으며, 독서마라톤 참여자들의 독서 활동 증진과 지역 독서문화 확산에도 기여할 수 있다. 또한 공공데이터로 제공될 경우, 교육기관과 연구자는 프로그램 효과성을 평가하고 시민 독서 습관을 장기적으로 지원하는 데 활용할 수 있다.
