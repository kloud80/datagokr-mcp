summary_user: 서울시 관내 학원·교습소를 시설별로 담은 인허가·운영 원천 데이터로, 학원지정번호·학원명·행정구역명과 개설·등록일자, 등록상태, 휴원 시작·종료일, 정원 합계, 교습계열·과정, 1인당 수강료와 공개 여부, 도로명주소를 담는다. 학부모나 분석가가 '우리 구에 입시·예체능 학원이 얼마나 몰려 있고 수강료는 어느 수준인가'를 확인하거나, 학원가 밀집도를 상권·주택 수요 신호로 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정구역명·주소 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 서울시 학원 교습소 정보 데이터는 서울시 관내 학원 및 교습소의 인허가와 운영 현황을 행정구역 단위로 파악할 수 있는 공공 행정 데이터입니다. 행정구역명, 학원교습소명, 학원지정번호, 학원명 등을 통해 각 시설을 고유하게 식별할 수 있으며, 개설일자와 등록일자, 등록상태명, 휴원 시작·종료일자 항목으로 개원·휴원·폐원 등 운영 이력을 체계적으로 추적할 수 있습니다. 또한 정원합계와 일시수용능력인원합계를 통해 시설의 수용규모를 확인할 수 있고, 분야명, 교습계열명, 교습과정명 정보를 통해 보습, 입시, 예체능, 어학 등 어떤 영역에서 어떤 과정을 운영하는지 분석할 수 있습니다. 인당수강료내용과 수강료공개여부를 활용하면 학원비 수준과 정보공개 실태를 파악할 수 있으며, 도로명주소와 우편번호는 공간 분포 분석과 접근성 평가에 활용할 수 있는 중요한 위치 정보입니다. 마지막으로 적재일시를 통해 데이터의 최신성을 검증할 수 있어, 교육 정책 수립과 학원 관리 행정에 유용한 기초 자료로 활용될 수 있는 데이터입니다.
