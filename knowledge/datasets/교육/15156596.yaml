description_portal: 양평미래교육협력지구는 함께 그린(Green) 양평미래교육을 비전으로 자율(교육자치 활성화), 균형(지역사회 연계교육), 미래(지역의 특색에 기반한 글로컬 융합인재를 양성) 세 가지 목표를 추진합니다. 이 목표를 실현하기 위한 8대 추진 과제로는 학교와 지역 연계 교육협의체 활성화, 학교와 지역 연계 지역 교육자치 지원, 지역맞춤 공유 학교 플랫폼 구축 운영, 지역 연계 조화로운 학생 성장 지원 프로그램 운영, 지속 가능한 지역 사회 교육 인프라 확대, 지역 특색 미래교육 프로그램 운영, 학생역량 중심 지역 연계 창의 융합교육 지원, 지역기반 미래교육 자원 활용을 통한 미래역량 계발이 있습니다.   이 과제를 해결하기 위해 18개 세부 사업을 시행하고 있고 이 중 공모사업은 5개가 있습니다. 이 데이터는 2025 양평미래교육협력지구 공모사업 공고 현황을 파악할 수 있습니다.
