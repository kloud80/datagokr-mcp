description_portal: 이 데이터는 2016년도 학생 건강검사 중 신체 키 측정에 대한 원시 데이터를 포함하고 있습니다. 전국 초·중·고등학생을 대상으로 표본조사를 통해 수집된 이 자료는 총 82,883건의 키 측정 결과를 제공합니다. 데이터는 교육부에서 수집하여 공개한 것으로, 학생들의 건강 상태를 파악하고 교육 정책 수립에 활용될 수 있습니다. 또한, 연구자나 정책 입안자들이 학생들의 신체 발달 추이를 분석하는 데 유용한 자료로 활용될 수 있습니다. 데이터는 무료로 제공되며, 공공데이터포털에서 로그인 없이 다운로드할 수 있습니다.(제공데이터)초등학교 학생표본 신체(키) 측정 검사, (학년별 신체키 축정값, 성별 신체키 측정 값) rawdata
