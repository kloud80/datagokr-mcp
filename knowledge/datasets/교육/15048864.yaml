description_portal: 대구2·28기념학생도서관에서 소장하고 있는 신착자료(도서,DVD)의 등록번호, 자료실명,  서명, 저자명, 출판사, 발행연도 등 정보 제공. 1년에 4회 즉 매 분기별로 데이터를 갱신하여 제공하고 있다. 즉 해당 분기의 신착자료 정보를 제공한다. 자료실 정보 중 불로작은도서관은 물리적으로 떨어진 곳에 위치하고 있다. 대구2·28기념학생도서관의 주소는 대구 동구 아양로41길 56 이며, 불로작은도서관의 주소는 대구광역시 동구 도평로30 이다. 어린이자료실은 1층에 위치하며, 일반자료실은 2층에 위치하고 있다.
