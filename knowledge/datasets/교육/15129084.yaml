summary_user: 경기도 인재개발원에 등록된 강사 분류별로 1~3회 강의 주제, 기본 강의 시간, 시간당 강의금액·추가 강의금액, 강사 등급(일반 외 정보화교육·퍼실리테이터 등), 작성·수정일을 담은 기준표 성격의 현황 데이터다. 공무원 교육 담당자나 분석가가 "강사 등급과 강의 분야에 따라 시간당 강사료가 얼마로 책정되는가"를 확인하거나 다른 기관 강사료 기준과 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 강사 등급명(instrctr_ratg_nm)이나 강의 분야 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 인재개발원에서 등록된 강사의 강의 분야 분류 및 강의 수당 정보를 나타낸 현황입니다. 주요 항목에는 1~3회 강의 주제(예: 직무전문성, 핵심리더, 환경 등), 기본 강의 시간, 시간당 강의금액 및 추가 강의금액, 강사 등급, 작성일·수정일 정보가 포함됩니다. 강의 분야는 다양한 역량 개발 영역(행정, 회계, 갈등관리, 인문학, 소양, 자기계발 등)으로 분류되며, 일반 강사 외 ‘정보화교육’, ‘퍼실리테이터’ 등 별도 등급도 존재합니다. 해당 데이터는 강사 인력풀 관리, 강사료 책정 기준 분석, 교육 프로그램 설계 시 유용하게 활용될 수 있습니다.'
