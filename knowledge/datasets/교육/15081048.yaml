description_portal: 서울시 유치원 직위 자격별 교직원 현황 데이터는 서울시 관내 유치원별 교직원 구성과 자격 보유 현황을 한눈에 파악할 수 있도록 제공되는 공공교육 통계입니다. 교육청명과 교육지원청명, 유치원명, 설립유형, 주소를 통해 기관의 기본 정보를 확인할 수 있으며, 원장수, 원감수, 수석교사수, 보직교사수, 일반교사수, 특수교사수, 보건교사수, 영양교사수, 기간제교사수, 강사수, 사무직원수 등 직위별 인원 현황을 상세히 제공합니다. 또한 수석교사자격수, 정교사 1급·2급 자격수, 준교사 자격수 등 자격별 통계를 포함하고 있어, 유치원 교원 전문성 수준과 인력 구조를 다각도로 분석하는 데 유용한 자료입니다. 이를 통해 교육 행정기관은 교원 수급 및 배치 정책 수립에 활용할 수 있고, 연구자와 시민은 유치원 교육 환경과 인력 여건을 객관적으로 이해하는 데 참고 자료로 활용할 수 있습니다.
