summary_user: 경상북도영주교육지원청이 관리하는 영주 지역 학원을 학원 한 곳당 한 행으로 담은 파일로, 학원명·학원 종류·분야·교습계열·교습과정·교습과목(반)·일시수용능력인원을 담는다(포털 설명상 2025년 11월 26일 기준, CSV 약 93KB). 학부모가 영주에서 특정 과목을 가르치는 학원을 찾거나, 분석가가 지역 학원가 밀집도와 교습 분야 분포를 학원 상권·주택 수요 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 교육지원청 학원현황 파일과는 학원명·분야 같은 이름 매칭이나 같은 기관 단위로만 이어 쓴다.
description_portal: 2025년 11월 26일 기준으로 영주 지역 내에서 운영 중인 학원의 현황을 상세하게 안내하는 자료입니다. 이 데이터에는 학원의 명칭, 교습 과목, 정원 등 학원 운영에 필요한 다양한 정보가 포함되어 있습니다. 해당 정보는 학원의 설립, 변경, 폐지 신고와 정기 지도점검, 행정처분 등 교육지원청의 공식 행정 절차를 통해 수집되며, 「학원의 설립·운영 및 과외교습에 관한 법률」 및 관련 시행령에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 해당 기준일을 기준으로 작성되어, 당시 영주 지역 내 학원의 운영 실태를 정확하게 반영합니다.이 자료는 지역 내 학원 분포 현황 파악, 지도·감독, 교육정책 수립, 학부모 및 학생의 학원 정보 제공, 지역사회 교육환경 분석 등 다양한 분야에서 활용됩니다. 특히 정책 담당자, 연구자, 언론 등에서 과거 교육 인프라 현황 분석, 교육 서비스 개선, 민원 대응, 시계열 변화 분석 등에도 중요한 참고자료로 사용할 수 있는 공공데이터입니다.
