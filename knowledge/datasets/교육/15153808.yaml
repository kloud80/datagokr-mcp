description_portal: 천안시교육청의 연혁은 지역 교육자치의 변화와 발전 과정을 보여주는 중요한 기록입니다. 1952년 교육자치제가 시행되며 천안군 교육구가 설치되었고, 이후 청사 준공과 교육자치제 폐지 및 부활, 천안시 승격 등 행정적 변화가 이어졌습니다. 1964년부터는 교육장 제도가 도입되어 제1대부터 제10대까지 교육장이 취임하며 조직의 안정성과 연속성을 확보했습니다. 1972년에는 중학교 감독권이 지방 교육청으로 이관되었고, 1973년 천안군교육청이 천안시교육청에 통합되며 교육 행정의 효율성이 강화되었습니다. 청사 신축, 하부조직 개편 등도 이루어져 교육청의 기능과 역할이 점차 확대되었습니다. 이 연혁은 천안 지역 교육행정의 흐름을 이해하는 데 중요한 자료입니다.
