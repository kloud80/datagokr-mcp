description_portal: '본 데이터는 한국방송통신전파진흥원이 관리하는 국가기술자격검정 시험종목 정보를 수록한 자료입니다. 데이터에는 방송통신, 전파, 전자, 정보통신 등 관련 분야의 자격종목명과 종목명(영문), 각 종목의 필기·실기시험 응시료 정보가 제공됩니다. 이 데이터는 방송통신 분야 전문기술 인력 양성 및 자격제도의 효율적 운영을 지원하기 위해 구축되었습니다. 본 자료로 응시자와 교육기관, 정책연구자는 시험종목별 특성을 파악하고 자격검정 준비나 행정업무 등에 활용할 수 있습니다. 또한 국가기술자격제도의 운영현황을 관리하고, 응시료 산정 및 제도 개선 등을 위한 기초자료로 활용될 수 있습니다. 데이터는 정기적으로 갱신됩니다.※기준일 : 2023.07.25.'
