legal_basis_portal: 「평생교육법」제4조(국가 및 지방자치단체의 책무)국가 및 지자체는 국민이 평생교육에 참여할 수 있도록 다양한 정보를 제공하고 기회를 확대해야 함.제21조(평생교육에 관한 정보 제공)국가 및 지자체는 평생교육기관, 교육프로그램, 교육기회 등에 관한 정보를 국민에게 제공해야 한다.이에 따라 추천 가능한 평생학습 사이트 목록을 관리·공개하는 것은 법적 책무입니다.
