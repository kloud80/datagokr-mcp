summary_user: 대학생 청소년교육지원장학금(대학생이 초중고생을 멘토링하고 장학금을 받는 사업)의 집행액을 연도·학기·대학·근로내역 대·소분류별로 나눠 출근부 건수, 대상 인원 수, 집행금액을 담은 집계 파일로, 범위는 전국이다. 교육 분석가나 대학 담당자가 '어느 대학에서 어떤 멘토링 활동에 장학금이 얼마나 집행됐는가'를 학기별로 비교하는 데 쓴다. 전역 조인 키나 표준 대학 코드는 없어서 다른 대학 데이터(대학 공시 등)와는 대학명 문자열을 맞춰야 이어 쓸 수 있다.
