description_portal: 대한민국학술원은 국내 학술 발전에 현저한 공적이 있는 학자를 우대하고, 평생에 걸친 연구와 학술 활동을 지원함으로써 국가 학문 발전에 이바지하기 위해 「대한민국학술원법」에 따라 설립된 국가 학술기관입니다. 회원은 학술원이 지정한 분야별 학술단체의 장 또는 학술원 회원의 추천을 받아 회원심사위원회의 엄정한 심사와 해당 분과 부회의 의결, 총회의 승인을 거쳐 선출되며, 임기는 평생입니다. 회원 정원은 총 150명으로, 대한민국 학문을 대표하는 석학으로 구성되어 지속적인 연구 활동과 함께 국가 학술정책 제언, 국제 학술 교류, 학계의 지도적 역할 등을 수행합니다.대한민국학술원 회명 명단은 매년 업데이트 되며, 자세한 회원정보는 홈페이지 확인해 주시기 바랍니다.
