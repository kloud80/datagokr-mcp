description_portal: ‘한국학중앙연구원_한국향토문화전자대전 공간정보’ 데이터는 한국향토문화전자대전의 텍스트 항목들과 연계된 문화자원의 위치 정보를 구조화한 자료입니다. 이 데이터는 각 항목별로 소재지 주소, 행정구역(시·도, 시·군·구), 경도, 위도 좌표 등을 포함하며, 지도 기반 서비스 및 위치 기반 검색 기능에 활용됩니다.해당 공간정보는 전자대전의 다양한 지역문화 콘텐츠(사찰, 서원, 민속마을, 유적지, 기념비 등)과 연결되어 있어 지역별 향토문화유산 분포 현황을 시각적으로 분석하는 데 유용합니다. 이를 기반으로 GIS(지리정보시스템) 분석, 지역학 연구, 교육용 디지털 지도 서비스 등에 다양하게 활용될 수 있습니다.
