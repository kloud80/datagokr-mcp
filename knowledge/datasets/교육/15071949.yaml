summary_user: RISS 종합목록에 참여한 대학·연구기관별로 조사년도마다 구축한 MARC 서지 데이터 건수를 국내 자료와 국외 자료로 나눠 담은 집계 통계 파일(CSV)이다. 대학도서관 담당자나 학술정보 정책 분석가가 "어느 기관이 해마다 국내외 학술자료 서지를 얼마나 구축해 공유하고 있나"를 살피는 데 쓴다. 전역 조인 키는 없고, 기관코드(기관코드)를 같은 체계를 쓰는 RISS 관련 데이터와 맞추거나 기관명 매핑을 따로 만들어야 다른 데이터와 이을 수 있다.
description_portal: 제공하는 데이터는 국내외 대학 및 연구기관이 보유한 학술자료의 서지 정보를 통합 관리하는 RISS(학술연구정보서비스) 종합목록의 현황을 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 기관코드, 조사년도, MARC 데이터 국내 구축건수, MARC 데이터 국외 구축건수 등 각 기관별로 구축된 서지 데이터의 통계가 포함되어 있습니다. 데이터는 각 기관에서 제출한 서지 정보를 기반으로 하며, 국가 학술정보 공유 및 협력 정책에 따라 수집·관리됩니다. 업데이트 주기는 수시(1회성 데이터)로, 기관별 서지 데이터의 변동 사항이 발생할 때마다 최신 정보로 반영됩니다. 이 데이터는 대학도서관 및 연구기관의 학술자료 현황 분석, 서지정보 구축 실태 파악, 학술정보 공동 활용 정책 수립, 연구 및 통계, 도서관 간 협력체계 구축 등 다양한 분야에서 활용됩니다
