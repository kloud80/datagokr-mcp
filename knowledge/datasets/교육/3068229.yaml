summary_user: 대전광역시 내 학교법인별로 법인명, 법인설립일, 설립자, 이사장, 설치학교명을 한 행씩 담은 소규모 명부 파일(csv 약 2.3KB)이다. 대전 지역 사립학교가 어느 학교법인 소속이고 그 법인의 이사장·설립자가 누구인지 확인하려는 학부모·연구자·행정 담당자가 쓴다. 전역 조인 키가 없어 학교알리미 공시 등 학교 단위 자료와는 설치학교명을 이름으로 맞춰 연결해야 한다.
description_portal: 제공하는 데이터는 대전광역시 내 학교법인의 현황을 상세하게 수집한 자료로, 각 학교법인의 명칭, 설립일, 설립자 정보, 운영 중인 학교 현황 등 주요 정보를 포함하고 있습니다. 이 데이터는 교육 행정 시스템과 법인 신고 자료를 기반으로 정기적으로 갱신되며, 학교법인의 투명한 운영과 관리 현황 파악을 목적으로 수집됩니다. 해당 데이터는 교육청의 정책 수립, 학교법인 관리 및 지원, 법인과 관련된 각종 행정 절차 진행에 중요한 기초 자료로 활용할 수 있으며, 교육 환경 개선과 법인의 건전한 발전을 지원하는 데 기여할 수 있습니다. 또한, 교육 관련 연구와 지역 교육 네트워크 구축에도 활용되어 다양한 이해관계자의 의사결정에 도움을 줄 수 있는 교육 공공데이터입니다.
