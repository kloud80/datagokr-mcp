summary_user: 대구광역시교육청 소속 초·중·고·특수학교를 학교 한 곳당 한 행으로 담은 일람표 파일로, 학교명·관할 구군·주소·우편번호·전화·팩스를 담는다(CSV 약 52KB). 학부모나 분석가가 "대구 특정 구군에 어떤 학교가 있고 연락처·주소는 무엇인가"를 확인하거나 구군별 학교 분포를 파악하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명 매칭이나 주소·관할 구군(관할구군청) 기준으로만 이어 쓴다.
description_portal: 대구시교육청 소속 초등학교, 중학교, 고등학교, 특수학교 현황(일람표)에 대한 정보로 학교명, 관할구군청, 학교주소, 우편번호, 연락처, 팩스번호를 연간주기로 현행화하여 제공하고 있습니다.해당 데이터 컬럼은 대구시교육청 소속 초등학교, 중학교, 고등학교, 특수학교의 학교명, 관할구군청, 주소, 우편번호, 전화번호, 팩스번호 등 항목으로 구성되어있습니다.해당 정보는 초등학교, 중학교, 고등학교, 특수학교의 학교 유형이 관할구군으로 구분되어 있어 교육기관의 분포를 체계적으로 파악할 수 있으며, 이를 통해 지역 기반 분석이 가능하며, 교육 정책 수립 및 지원 대상 파악 등에 활용될 수 있습니다.또한, 교육학 관련 전공자나 교육기관에서 학술연구(논문‧과제 등) 및 지역별 학교 통계 및 분석을 위해 참고하거나 교육정책 수립과 연구 등의 기초자료로도 활용될 수 있습니다.
