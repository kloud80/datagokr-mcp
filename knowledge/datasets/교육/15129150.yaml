description_portal: 여주시 대신도서관은 총 32,000여 권 이상의 장서를 보유한 지역 공공도서관으로, 어린이부터 성인까지 폭넓은 독자층을 아우르는 다양한 자료실을 운영 중입니다. 주요 공간으로는 청소년성인실,  어린이자료실, 디지털자료실 ,일반 등이 있으며, 특히 어린이 도서와 장편소설, 그림책 비중이 높습니다. 주요 출판사로는 창비, 시공주니어, 비룡소, 문학동네 등이 있으며, 과학, 이야기, 역사와 같은 주제의 도서가 풍부하게 비치되어 있습니다. 본 도서관은 교과 연계 자료코너도 갖추고 있어 학습 보조자료로도 활용 가치가 큽니다. 지역 주민의 지식 향유와 정보 접근성을 높이기 위한 대신도서관의 체계적인 도서 구성은 여주시민의 독서문화 증진에 기여하고 있습니다.
