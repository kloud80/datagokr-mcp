description_portal: 상기 데이터는 2025년 한국농어촌공사에서 임직원을 대상으로 진행하는 온라인 교육과정의 설문조사 및 문항 별 임직원의 답변을 공개합니다. 교육과정별로 동일한 설문항목으로 설문조사를 진행중입니다. 설문결과를 통하여 과정별 만족도 및 과목별 보완할 점을 도출하고 2026년 인재육성 기본계획에 반영하여 교육과정을 개선합니다. 모든 온라인 교육과정을 교육을 수강 종료한 후 설문조사를 무조건 실시해야 교육을 수료할 수 있습니다. 매년 만족도 점수를 집계하여 만족도를 향상시킬 수 있도록 노력중입니다.
