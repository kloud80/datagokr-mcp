description_portal: 한국해양수산연수원이 운영 중인 각 교육캠퍼스 및 연수시설의 주차장 현황을 정리한 자료입니다. 총 10개의 주차장이 포함되어 있으며, 주차장명, 위치, 총 주차면수, 장애인 주차면수, 임산부 전용 주차공간, 전기차 충전기 등의 세부 항목이 CSV 형식으로 제공됩니다. 본 자료는 교육생 및 방문객의 편의 증진을 위한 주차 인프라 관리와 함께, 공공시설의 접근성 개선, 전기차 충전 인프라 확충 등의 행정적 기초자료로 활용될 수 있습니다. 공공기관의 공간 자산 활용 및 교통 편의 분석에도 유용한 자료입니다.> 데이터 공란은 없음을 의미
