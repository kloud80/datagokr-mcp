summary_user: 경상북도교육청 관내 22개 시군 교육지원청 소속 초·중·고·특수학교(포털 설명 기준 943개교)별로 학교 안전사고·학교폭력 예방과 시설물 관리용 CCTV 설치 대수를 학교 단위로 담은 파일이며, 지역·설립(공립·사립)·학교급·학교명과 총 기기 수를 함께 싣는다. 학부모나 지역 분석가가 "우리 지역 학교 중 CCTV가 적게 설치된 곳은 어디인가", "공립과 사립, 학교급별로 설치 대수에 차이가 있는가"를 확인하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교 기본정보나 학생·학급 통계와는 학교명과 지역 이름을 맞춰 연결해야 한다.
