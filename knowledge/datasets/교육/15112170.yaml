summary_user: 기준일까지 폐교된 전국 고등교육기관(대학·전문대학·대학원대학·각종학교)을 학교 한 곳당 한 줄로 정리한 현황 파일로, 학교명과 법인명, 폐교년도, 본교 기준 폐교지역, 법인의 해산·파산·존속 상태를 담는다(CSV 약 1.3KB의 소규모 목록). 폐교대학의 이력관리나 잔여 자산 활용을 검토하는 분석가·행정 담당자, 또는 졸업한 학교의 폐교 시점과 법인 존속 여부를 확인하려는 국민이 '어느 대학이 언제 문을 닫았고 그 법인은 지금 어떤 상태인가'를 묻는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대학 공시 등 다른 고등교육 데이터와는 학교명·법인명 문자열 매핑으로만 이어 붙인다.
description_portal: 해당 데이터는 대학구분(대학,전문대학,대학원대학,각종학교), 학교명과 법인명, 폐교년도, 법인의 해산·파산 여부 및 존속 상태, 폐교지역(본교 기준) 등의 정보를 기반으로, 기준일까지 폐교된 고등교육기관과 해당 학교법인의 해산, 존속, 청산 현황을 종합적으로 포함하고 있습니다. 이 데이터는 한국사학진흥재단이 추진하는 폐교대학종합관리사업과 연계되어, 폐교 된 대학의 이력관리, 남은 자산의 공익적 활용, 관련 행정 처리, 사후관리 체계 구축 등 정책 수립과 실행을 위한 핵심 기초자료로 활용됩니다.
