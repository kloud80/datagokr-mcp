summary_user: 경기도 학교의 교원 수를 기준년도·학교별로 교장·교감·수석교사·정교사(1·2급)·특수교사(1·2급)·준교사·실기교사·전문상담교사·사서교사 등 자격종별로 나누고, 각각 남성·여성·합계로 집계해 담는다. 교육정책 분석가가 "어느 시군·교육지원청 학교에 특수교사나 전문상담교사가 적게 배치됐는지, 직위별 성비는 어떤지"를 따질 때 쓴다. 전역 조인 키는 없어서 학교명·시군명이나 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)로 학교 기본정보와 학생·학급 통계에 이름·코드 매핑해 붙인다.
description_portal: 이 데이터는 경기도 내 학교 교원의 자격종별 현황을 연도별·학교별로 정리한 자료로, 교원의 직위와 자격, 성별 인원 구성을 포함합니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명 등이 있으며, 교원 직종별 세부 인원은 남성·여성·합계 단위로 제공됩니다. 이를 통해 특정 학교·지역의 교원 자격별 분포와 성비를 분석할 수 있으며, 합계 교원 수를 기준으로 학교별 인력 규모도 확인할 수 있습니다. 이 데이터는 교원 자격별 수급 현황 분석, 성별 불균형 연구, 특수교사 및 전문 인력 배치 파악, 지역 간 교원 분포 격차 검토, 교육 인력 정책 수립의 기초자료로 활용될 수 있습니다.
