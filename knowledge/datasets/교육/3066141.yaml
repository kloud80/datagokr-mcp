description_portal: '학교총개황은 경상남도 교육과정별(유치원~고등학교) 학교에 대한 기본정보(학교수, 학생수, 교원수, 사무직원수)로 구성된 데이터입니다.- 데이터 제공 대상 기간 : 2010년 ~ 2024년(매년 12월 말일 기준으로 작성)- 데이터 제공 대상 기관 구분 : 유치원, 초등학교, 중학교, 일반고등학교, 전문계고등학교, 특성화고등학교, 특수목적고등학교, 자율고등학교, 기타학교(특수학교, 고등기술학교, 각종학교 포함)- 데이터 제공 정보 : 학교수, 학생수, 교원수, 사무직원수* 2011년부터 전문계고등학교가 특성화고등학교로 명칭 변경되어 2010년 특성화고등학교 및 2011년 이후 전문계고등학교 데이터 공란 발생자세한 사항은 경상남도교육청 교육통계(https://www.gne.go.kr/statistics/index.do) 경남교육통계연보 또는경상남도 빅데이터 허브 플랫폼(https://bigdata.gyeongnam.go.kr/index.gn) 경상남도 통계연보에서 확인하시기 바랍니다.'
