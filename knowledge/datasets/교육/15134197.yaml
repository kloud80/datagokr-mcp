description_portal: 세종도시교통공사는 대중교통전문기관으로서의 사회적 책임을 이행하고자, 공사 고유 교통운송사업을 활용하여 관내 어린이들의 교통안전 의식 강화와 교통사고 예방을 위해 어린이 교통안전 체험교육을 실시하고 있습니다. 세종도시교통공사 어린이 교통안전 체험교육과 관련한 교육실적 데이터이며, 2025년 6월 30일 기준입니다. 첨단BRT 전기굴절 버스 차고지를 개방하여 어린이 안전교육장으로 활용하고 있으며, 전담부서의 사내강사를 활용하여 관내 유치원, 어린이집, 초등학교등의 어린이를 대상으로 신호등 횡단보도 건너기, 도로 안전표지판 설명, 안전한 대중교통 이용방법, 차량 갇힘 사고 예방 및 대응방법 등의 교통안전 교육과 심폐소생술 교육 등을 실시하여 어린이 교통안전의식 제고, 올바른 대중교통문화 정착, 관내 안전문화를 조성하는 등 지역의 어린이 교통사고 예방과 안전보건 체계를 강화하고 있습니다. 자료는 교육차수, 교육추진일시, 교육대상기관, 교육대상 어린이의 연령, 교육인원으로 정리하였습니다.
