description_portal: '"대전광역시교육청_다문화교육 선도학교 및 연구학교 현황" 데이터는 대전광역시 내 유치원 및 초·중·고등학교 중 다문화교육을 중점적으로 운영하는 학교들의 정보를 제공합니다. 이 데이터에는 학교의 구분(다문화교육 선도학교 또는 한국어학급, 연구학교), 학교명, 연락처, 주소 등의 항목이 포함되어 있습니다. 이를 통해 다문화학생에게 특화된 교육 환경을 제공하는 학교들을 파악할 수 있습니다.본 데이터는 대전광역시교육청 중등교육과에서 관리하며, 교육행정정보시스템(NEIS)과 각 학교의 보고 자료를 통해 수집됩니다. 데이터는 연간 1회 이상 정기적으로 업데이트되며, 다문화교육 정책학교의 지정 현황이나 한국어학급의 운영 상황 등이 반영됩니다.이 데이터는 다문화학생의 교육 환경을 이해하고, 다문화교육 정책의 효과를 분석하는 데 유용합니다. 또한, 다문화교육 프로그램의 개선 방향을 설정하거나, 다문화학생의 학습 지원을 위한 정책 수립에 중요한 기초 자료로 활용됩니다.'
