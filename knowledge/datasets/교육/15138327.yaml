description_portal: 광주광역시에서 시민들의 정보 격차 해소와 디지털 활용능력 향상을 위해 추진한 디지털 역량강화 교육현황 정보입니다.등록된 링크로 들어가면 광주광역시 홈페이지에 게시되어있습니다.현황데이터 파일에는 교육실적(과정수, 교육인원, 수료인원), 교육방법별(상설배움터, 파견교육, 온라인), 교육수준별(기초,생활,심화,특별)으로 구분되어있습니다. 2013~2021 시트에는 2021까지 추진 했었던 광주광역시 시민정보화교육 현황이 있습니다.2022년 부터 기존 시민정보화교육은 2022년부터 디지털역량강화 교육으로 통합 운영되고있습니다.
