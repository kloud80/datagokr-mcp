summary_user: 육군3사관학교가 전공(학과)별로 개설한 교과목의 이름과 교육 목적을 포함한 과목 소개를 과목 한 건씩 담은 CSV 파일(약 32KB)이다. 3사관학교 생도나 지원자가 "내가 갈 학과에서는 어떤 전공 과목을 듣게 되나"를 확인하고 학년별 학습 계획을 세울 때 쓴다. 학과 필드가 조인 키(ka3_dept)로 확인돼 같은 학교의 다른 학과 단위 자료와 학과명으로 이어 쓰며, 별도 코드표는 없다.
