summary_user: 전국 개교예정학교를 학교 단위로 한 줄씩 담은 파일 데이터로, 지역·교육청·시군구·학교급·개교예정일·주소를 싣고 검증 시 152행이 수신됐다. 신도시 등 신설 학교 수요나 개교 일정을 알아보려는 학부모·분석가가 어느 지역에 어떤 학교급이 언제 문을 여는지 확인하는 질문에 쓴다. 주소(address)가 조인 키라서 주소 기반 데이터와 이어 쓰며, 학교 코드 같은 별도 키는 확인되지 않는다.
description_portal: '학교 전반의 주요정보를 객관적이고 투명하게 공개하는 제도로 국민의 알권리를 보장하는 한편 학교 교육 실태를 정확하게 파악하여 학교 교육의 경쟁력을 높이기 위하여 도입된 2008년부터 초·중등학교 정보공시제를 기반으로 하여 교육부에서 정한 공시 기준에 따라 매년 1회 이상 학교알리미에 공시하고 있으며, 개교예정학교에 관련된 학교의 주요 정보들을 쉽게 확인하실 수 있습니다.공시기관: 초·중등교육법에 따라 설립된 각급 학교, 그 밖에 다른 법률에 따라 설치된 각급 학교공시횟수: 공시항목 별로 매 년 1회 이상공시대상: 초·중·고등학교 약 12,000개교'
