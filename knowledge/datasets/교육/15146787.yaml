description_portal: "'서울시 은평구 유치원 방과후 과정 편성운영' 데이터는 은평구 소재 국·공·사립 유치원이 「유아교육법 시행령」 제19조의2에 따라 정규 교육과정(오전 9시~오후 1시) 이후 오후 7시까지 운영하는 연장보육 및 특별활동 프로그램 현황을 유치원알리미에서 수집·가공한 공공데이터셋입니다. CSV·JSON 파일과 REST API 형태로 제공되며 학년도 종료 후 매년 자동 갱신됩니다. 각 레코드에는 교육지원청, 유치원명, 설립유형, 독립편성학급수, 오후재편성학급수, 운영시간, 참여유아수 등이 포함되어 있어 맞벌이 가정의 돌봄 공백 해소를 위한 정책 수립, 예산 편성, 지역별 운영 격차 분석에 활용됩니다. 학부모는 유치원별 방과후 과정 운영 여부와 시간을 확인해 자녀 돌봄 계획을 세울 수 있고, 교육청은 수요 대비 공급 부족 지역을 파악해 확대 정책을 추진할 수 있으며, 지자체는 국공립과 사립 간 운영 격차를 분석해 지원 우선순위를 설정하는 근거 자료로 활용할 수 있습니다."
