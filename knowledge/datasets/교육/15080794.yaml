summary_user: 서울특별시 내 유·초·중·고 및 각종학교의 기본 현황을 학교별로 담은 데이터로, 표준학교코드·학교명·학교종류·설립구분·도로명주소·전화번호·홈페이지와 고등학교 계열·학과·주야과정·설립일자 같은 속성을 포함한다. 학부모나 분석가가 "우리 동네 공립 남녀공학 고등학교는 어디이고 어떤 계열을 운영하는가"를 확인하거나, 교육 인프라 분석에서 학교 목록 마스터로 쓴다. 표준학교코드(SD_SCHUL_CODE, NEIS 학교코드)가 조인 키라서 교원·학생·학급 통계나 교육청·학교 재정처럼 같은 학교코드를 가진 데이터를 붙여 쓴다.
description_portal: 서울시 학교 기본정보 데이터는 서울특별시 내 유·초·중·고 및 각종학교 전반에 대한 기본 현황을 통합해 제공하는 공공데이터입니다. 시도교육청코드, 표준학교코드, 학교명, 영문학교명 등을 통해 각 학교를 고유하게 식별할 수 있으며, 학교종류명, 소재지명, 관할조직명을 통해 학교 유형과 행정 관할 체계를 함께 파악할 수 있습니다. 도로명우편번호, 도로명주소, 상세주소는 학교의 위치를 정확히 제시해 통학, 지도 서비스, 교육 인프라 분석에 활용될 수 있습니다. 또한 설립구분, 남녀공학구분명, 고등학교구분명, 주야구분명, 주야과정, 계열명, 학과명 등은 학교의 설립 형태, 교육과정 운영 방식, 계열·학과 구조를 세부적으로 보여 줍니다. 산업체특별학급존재여부, 고등학교일반실업구분명, 특수목적고등학교계열명, 입시전후기구분명 등의 항목을 통해 고등학교 단계의 다양한 교육 특성과 진학 체계를 분석할 수 있습니다. 설립일자와 개교기념일은 학교의 역사와 연혁을, 적재일시는 데이터 최신성을 확인하는 기준을 제공하여, 학부모·학생·연구자·행정기관이 학교 정보를 비교·분석하고 정책 수립 및 진학·진로 안내 등에 활용하기에 적합한 구조화된 기초 데이터입니다.
