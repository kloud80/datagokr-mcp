summary_user: 전북특별자치도 내 어린이집을 한 곳당 한 행으로 담은 시설 현황 파일로, 이름·유형(국공립·민간·가정 등)·도로명 주소와 정원·보육교직원 수·보육실·놀이터·CCTV 수, 통학차량 운영 여부를 담는다. 학부모가 우리 시군구에 정원이 넉넉하고 CCTV·놀이터를 갖춘 어린이집이 어디인지 찾거나, 분석가가 시군구별 보육 시설 분포와 교직원 1인당 정원을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·어린이집명·도로명 주소를 맞춰 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내에 위치한 어린이집들의 시설 현황을 상세하게 보여주는 자료입니다. 각 어린이집의 명칭, 유형(국공립, 민간, 가정 등)과 같은 기본 정보부터, 보육 아동의 최대 수용 인원인 '정원', 실제 근무하는 '보육교직원 수' 등 인력 정보를 포함합니다. 또한, '보육실 수', '놀이터 수', 그리고 안전을 위한 'CCTV 설치 수'와 같은 물리적 시설에 대한 구체적인 수치를 담고 있습니다. 이 자료는 지역 내 보육 시설의 분포와 규모, 교육 환경 및 안전 관리 수준을 종합적으로 파악하고 분석하는 데 필수적인 기초 정보를 제공합니다
