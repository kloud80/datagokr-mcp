summary_user: 서울 동작구에 개설된 학원과 교습소를 한 곳씩 담은 목록으로, 학원명·지정번호·등록상태·등록일자·휴원 기간·정원·분야와 교습계열·과정·도로명주소와 공개 시 수강료를 담는다. 학부모나 분석가가 동작구 안에서 특정 과목 학원이 어느 동에 몰려 있는지, 학원가 밀집도를 학원 상권이나 주택 수요의 신호로 보는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정구역명(ADMDST_NM)·도로명주소 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
description_portal: 서울시 동작구 학원 교습소정보 (https://data.seoul.go.kr/dataList/OA-20549/S/1/datasetView.do)입니다.동작구의 개설되어있는 학원 및 교습소의 학원명, 휴원일자, 등록상태, 정원, 분야, 계열 및 과정등을 확인할 수 있으며 수강료 공개여부에 따라 수강료 내용을 확인할 수 있습니다.행정구역명, 학원/교습소, 학원지정번호, 학원명, 도로명주소, 도로명상세주소, 분야명, 교습계열명, 교습과정목록명, 교습과정명, 정원합계, 일시수용능력인원합계, 기숙사학원여부, 도로명우편번호, 등록상태명, 등록일자 등을 제공하고 있습니다.
