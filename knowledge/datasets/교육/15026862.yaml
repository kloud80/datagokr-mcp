description_portal: '○ 우리대학은 3년제 전문대학으로 영국 등 유럽에서 발달한 직업전문교육제도인 샌드위치 시스템을 적용하여 1학년과 3학년은 학교에서 학습을      하고, 2학년은 국내외 선진 농·어장에서 현장실습을 통한 학습을 이수하도록 하고 있음  1학년 : 학교에서 기본교육(기초 소양 및 기본 농어업교과목 교육)  2학년 : 국내외 선진농장·어장 파견 현장실습(영농어 현장 체험)  3학년 : 학교에서 종합 응용교육(창업설계, 전문기술 및 경영 교육)○ 교과목 운영방향  - 전공 및 현장실무 교육 강화를 위해 전공 및 현장실무 교육과정 확대  - 교양선택으로 분류되었던 식품가공, 농기계, 마케팅, 농업인문학 등의 교과를 공통기초 교과목으로 재분류하여 전문교과 강화  - 6차 산업 관련 교육 강화  - 교양 및 전문교과의 선택과목 최소 이수기준을 적용하여 학점이수 기준 강화'
