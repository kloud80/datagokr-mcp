summary_user: 대구경북과학기술원(DGIST) 대학원 입시전형 게시판의 공지·안내 글을 글 한 건 단위로 담으며, 제목·작성자·본문 정보·바로가기 링크·등록일자·조회수·첨부파일 링크를 제공한다. 대학원 진학을 준비하는 수험생이나 입시 정보를 모으는 분석가가 'DGIST 대학원의 최근 모집요강·전형 공고가 언제 올라왔고 첨부 서류는 무엇인가'를 확인하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키는 없어, 다른 대학의 입시 공고와는 제목·등록일자 같은 이름 기반 대조나 같은 기관 데이터끼리로만 연결한다.
limits: 게시판 글 형태의 공고라 모집인원·경쟁률 같은 정형 수치는 별도 컬럼으로 없고 본문·첨부파일에서 직접 읽어야 한다. 전역 조인 키가 없어 대학 간 비교는 이름 매핑에 의존한다.
