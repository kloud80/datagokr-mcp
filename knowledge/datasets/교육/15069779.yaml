description_portal: 이 문서는 정부초청외국인장학생을 대상으로 하는 직원 채용 시 희망채용조건 등록 메뉴에 관한 내용을 담고 있으며, 기업전용서비스를 통해 제공되는 국외인적자원관리시스템의 일부 기능으로, 현재는 서비스가 미오픈 상태입니다. 미리보기 데이터를 통해 다양한 1차, 2차, 3차 업종 분류와 근무국가, 고용형태(정규직, 아르바이트, 계약직 등), 급여수준, 기업규모 등의 상세 정보가 확인되며, 제조업, 미디어, 연구, 금융 등 여러 산업군에 걸친 채용 조건 관리에 활용될 수 있음을 알 수 있습니다. 여러 국가에서의 근무 가능성과 기업 유형에 따른 조건 설정을 포함해 지원자 맞춤형 채용정보 등록이 가능한 체계적 시스템임을 보여줍니다.국외인적자원관리시스템 기업전용서비스로 정부초청장학생을 대상으로 하는 직원 채용 시 희망채용조건을 등록하는 메뉴
