description_portal: 한국사데이터베이스에서 제공하는 일제감시대상인물카드는 고대부터 현대까지 한국 역사의 주요 사료 중 하나로, 일제 경찰이 작성한 감시 대상 인물들의 카드를 데이터로 제공한다. 이 자료는 2019년과 2020년, 그리고 2021년에 걸쳐 주기적으로 업데이트되어 과거 데이터를 관리하고 있으며, 한국역사 연구에 중요한 참고자료로 활용된다. 일제감시대상인물 데이터는 시대별 감시 실태를 이해하는 데 필수적인 역사자료이며, 이 데이터베이스를 통해 체계적이고 효율적으로 접근할 수 있다.
