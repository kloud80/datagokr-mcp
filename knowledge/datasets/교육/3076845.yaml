summary_user: 경기도 군포시 관내 초·중·고등학교를 학교 한 곳당 한 행으로 담은 파일로, 학교명·설립연도·소재지 주소·학교장·교무실/행정실 전화번호와 교직원 수, 일반·특수 학급 수와 학생 수를 포함한다. 학부모나 지역 분석가가 '군포시에서 특수학급을 운영하는 학교는 어디이며 학급당 학생 수는 얼마인가' 같은 질문에 쓴다. 표준 학교코드 같은 전역 조인 키가 없어, 다른 학교 통계·재정 데이터와는 학교명이나 소재지 주소를 맞춰서만 이어 쓴다.
