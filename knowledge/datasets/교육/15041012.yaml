description_portal: '경상남도 거창군의 평생교육기관 현황에 대한 데이터로 기관명, 유형, 지역, 기관설립일, 우편번호, 도로명주소, 지번주소, 전화번호, 홈페이지, 위도, 경도 정보를 제공합니다.○ 데이터 기준일 : 2025. 12. 01.○ 평생교육기관이란 전 생애에 걸쳐 학습 기회를 제공하는 교육기관으로, 학교 밖에서 이루어지는 다양한 형태의 교육을 담당합니다. 이들 기관은 성인, 고령자, 청소년 등 다양한 계층을 대상으로 문해교육, 직업능력개발, 인문교양, 시민교육 등 폭넓은 프로그램을 운영하며, 지역사회 발전과 개인의 삶의 질 향상을 목표로 합니다. 평생교육법에 따라 지정된 평생교육시설, 학점은행제 기관, 시민대학, 직업훈련기관 등이 이에 포함됩니다.'
