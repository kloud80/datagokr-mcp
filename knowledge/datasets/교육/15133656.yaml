summary_user: 모두의한국어 서비스의 다문화학생용 한국어 단어장을 단어 한 개당 한 행으로 담은 원천 목록으로, 단어명·품사·발음·뜻·예문과 등록·수정일시, 사용여부를 포함하며 포털에서 CSV 파일(약 870KB)로 받는다. 한국어 교육 콘텐츠 개발자나 학습 앱 개발자가 '다문화학생 대상 어휘 학습에 어떤 단어를 어떤 뜻과 예문으로 제시할까'를 정할 때나 어휘 분석 연구에 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 단어명 문자열로 다른 어휘 자료와 맞추는 방식으로만 연결한다.
description_portal: 제공하는 데이터는 다문화학생을 대상으로 한 한국어 학습 지원 서비스의 일환으로, 한국어 단어 학습에 필요한 단어장 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 단어장 고유번호, 단어명, 단어등록일시, 수정일시, 사용여부, 예문, 품사, 발음, 뜻 등 단어 학습에 필요한 다양한 정보가 포함되어 있습니다. 데이터는 모두의한국어 서비스 운영 과정에서 수집되며, 단어장에 신규 단어가 추가되거나 수정사항이 발생할 때마다 수시(1회성 데이터)로 갱신됩니다. 데이터의 보유 및 제공 근거는 다문화학생의 한국어교육 지원과 관련된 정책 및 사업 운영에 있습니다. 이 데이터는 다문화학생의 한국어 어휘력 향상, 한국어 교육 콘텐츠 개발, 교육 연구, 어휘 분석, 학습 앱 개발 등 다양한 분야에서 활용될 수 있습니다. 일부 항목은 문장 자체가 단어명으로 등록된 경우 예문이나 뜻이 공란일 수 있습니다
