summary_user: 2024년 기준 국·공·사립대학(전문대학 포함) 499개교의 교지(교육용 토지)·교사(교육용 건물) 확보율을 학교·캠퍼스 단위로 담은 공시 집계 파일로, 입학정원 기준과 재학생 기준 각각의 기준면적·보유면적·확보율이 들어 있다. 수험생·학부모나 정책 분석가가 '이 대학은 재학생 수 대비 교육용 건물을 법정 기준만큼 갖추고 있는가'를 확인하거나 대학 간 시설 여건을 비교하는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 다른 대학알리미·대학재정 데이터와는 학교명·캠퍼스명 문자열 매칭으로 이어 쓴다.
limits: 학교 표준 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 학교명·캠퍼스명 표기 차이를 직접 맞춰야 한다. 전국 범위의 비공간 자료라 좌표가 없고, 위치 분석에는 별도 학교 위치 데이터가 필요하다.
