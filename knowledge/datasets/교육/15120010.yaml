description_portal: '이 공공데이터는 2024년 기준 국·공·사립대학(전문대학 포함) 499개교의 교지·교사 확보율 현황을 제공하는 자료입니다. 대학별 기준면적 대비 교육용 토지 및 교육용 건물의 실제 보유면적 비율을 제시하여, 교육시설 확보 수준을 수치로 확인할 수 있습니다. 본 데이터는 고등교육정보공시 업무에 기반하여 구축된 것으로, 대학의 교육 인프라 현황을 객관적이고 체계적으로 공개하는 데 목적이 있습니다. 이를 통해 대학의 시설 여건을 종합적으로 파악할 수 있으며, 교육 정책 수립과 시설 개선의 근거 자료로 활용됩니다. 나아가 국민과 대학 구성원이 손쉽게 접근할 수 있는 신뢰성 있는 공공데이터로 제공됩니다.(단위 : 명, m2, %)'
