description_portal: '이 문서는 특수교육아동에 대한 통계자료로서 설립별 및 장애유형별 학교 수와 장애영아 학급 수, 그리고 학교급별 학생 수 현황을 상세히 제공한다. 국립, 공립, 사립 학교를 기준으로 시각장애, 청각장애, 지적장애, 지체장애, 정서장애 등의 장애 유형별로 분포를 분석하며, 유치원부터 고등학교에 이르기까지 각 급별 학생 현황과 전공과 학생 수도 포함하고 있다. 예를 들어, 공립 지적장애 학교는 63개 학교에 2822명의 학생이 재학 중이며, 사립 청각장애 학교에는 254명의 학생이 있다. 이 통계는 특수교육학급의 현황을 다양한 각도에서 파악할 수 있게 해주며, 특수교육 현장의 실태 이해에 유용하다.제공데이터 : 설립별,장애별,학교 수,장애영아 학급 수,유치원 장애영아 학급 수,초등학교 장애영아 학급 수,중학교 장애영아 학급 수,고등학교 장애영아 학급 수,전공과 장애영아 학급 수,장애영아 학생 수,유치원 학생 수,초등학교 학생 수,중학교 학생 수,고등학교 학생 수,전공과 학생 수'
