summary_user: 전국 특수학교를 설립별(국립·공립·사립)과 장애유형별(시각·청각·지적·지체·정서 등)로 묶어 학교 수, 장애영아 학급 수, 유치원부터 고등학교·전공과까지 학교급별 학생 수를 담은 집계 통계 파일(csv, 약 1.5KB)이다. 교육 정책 분석가나 학부모가 "공립 지적장애 특수학교는 몇 곳이고 학생은 몇 명인가"처럼 설립·장애유형별 특수학교 분포와 규모를 확인하는 데 쓴다. 학교코드 같은 전역 조인 키가 없어 개별 학교 기본정보와 직접 연결되지 않고, 설립 구분·장애유형 이름을 맞춰 다른 특수교육 통계와 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 단위 집계라 시도·시군구별이나 개별 학교 단위 현황은 알 수 없다. 학교코드 등 조인 키가 없어 학교 기본정보·재정 데이터와 키로 결합할 수 없고, 이름 매핑으로만 연결된다.
