summary_user: 대구광역시교육청이 관리하는 폐교 재산을 폐교 한 곳당 한 행으로 정리한 파일로, 포털 설명상 폐교명·건축물 및 토지 면적·활용 현황·폐교 일자를 담는다. 대구 지역 유휴 학교 부지를 공공시설이나 임대 용도로 쓰려는 지자체·사업자·분석가가 "어느 폐교가 아직 미활용 상태이고 땅과 건물 면적은 얼마인가"를 확인하는 데 쓰며, 구도심 쇠퇴를 살피는 보조 지표로도 쓴다. 실측 컬럼에서 학교코드 같은 전역 조인 키가 발견되지 않아, 다른 학교·부동산 데이터와는 폐교명이나 주소를 직접 맞춰 붙여야 한다.
limits: 내려받은 xlsx의 컬럼명이 모두 'Unnamed'로 읽히므로, 실제 머리글 행 위치를 확인한 뒤 파싱해야 한다. 표준 조인 키가 없어 학교 기본정보 등과 자동으로 연결되지 않는다.
