description_portal: 경기도교육청 혁신학교 혁신교육지구에 관한 정보입니다. 혁신교육지구란 경기도 교육청과지방자치단체가 협약을 통하여 경기혁신교육 정책을 추진함으로써 모두에게 신뢰받는 공교육 혁신을 이루기 위하여 지정한 지역을 의미합니다. 본 데이터파일에는 경기도교육청에서 규정한 31개 혁신학교 혁신교육지구의  목록을 확인할 수 있습니다.※ 혁신학교란?학교 운영과 교육과정 운영에서 자율성을 가지며 예산이 지원되는 형태의 학교로, 대부분 학급 인원이 25명 이하인 소규모 학교로 운영되고, 민주적 공동체를 바탕으로 학생·교원·학부모·지역사회가 소통하며 자발적으로 학교를 운영하고, 입시와 경쟁보다 진로와 전인교육, 협력으로 함께 배우는 교육을 내세우는 학교입니다.
