description_portal: '2023년 6월 12일 기준 한국데이터산업진흥원에서 운영 중인 (빅)데이터 교육과정 정보(교육명, 교육장소, 교육일정 등)를 제공합니다. 본 데이터는 데이터 전문 교육을 필요로 하는 기관이나 개인이 활용할 수 있는 중요한 자료로, 다양한 데이터 분석 및 활용 기술을 습득할 수 있는 교육 프로그램의 세부 내용을 포괄적으로 담고 있습니다. 해당 데이터는 교육과정에 대한 상세 정보를 제공하여, 교육을 계획하거나 참여하려는 수요자에게 유용한 정보를 제공합니다. 이 데이터의 활용은 수강생의 교육 선택에 도움이 되며, 더 나아가 기업의 데이터 인재 양성에도 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.순번(숫자형) : 각 교육과정의 고유 번호교육구분(문자형) : 교육의 유형(예: 정기교육, 특강 등)교육명(문자형) : 교육과정의 제목교육장소(문자형) : 교육이 진행되는 장소유무료구분(문자형) : 교육의 비용 정보(무료 또는 유료)정원(숫자형) : 교육생의 최대 인원 수회차(숫자형) : 해당 과정의 몇 번째 회차인지교육시작일(날짜형) : 교육이 시작되는 날짜교육종료일(날짜형) : 교육이 종료되는 날짜교육시작시간(시간형) : 교육 시작 시간교육종료시간(시간형) : 교육 종료 시간'
