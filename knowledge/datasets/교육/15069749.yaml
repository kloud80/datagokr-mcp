summary_user: 국립국제교육원이 국외인적자원관리시스템에서 관리하는 정부초청외국인장학생의 토픽(한국어능력시험) 응시료 지원 현황을 회차별로 대학수와 응시인원수로 집계한 전국 단위 파일(csv, 279 bytes)입니다. 정부초청장학생 지원 정책을 살피는 분석가가 "토픽 회차마다 몇 개 대학, 몇 명의 장학생이 응시료를 지원받았나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고, 다른 토픽·장학생 자료와는 회차 값을 맞춰 이름으로만 연결한다.
description_portal: 이 문서는 국외인적자원관리시스템에서 정부초청외국인장학생의 토픽 회차별 응시료 지원 현황을 집계한 자료를 다루고 있다. 회차별 대학수와 응시인원수 데이터를 포함하여 다양한 회차의 토픽 응시료 지원 규모를 확인할 수 있으며, 과거 데이터와의 주기성 비교가 가능하다. 미리보기로는 회차별 대학 수와 응시인원 수 데이터가 상세히 일부 제공되고 있으며, 전체 데이터는 다운로드를 통해 접근할 수 있다. 이 자료는 정부초청장학생의 토픽 응시료 지원 현황을 체계적으로 모니터링하는 데 있어 중요한 근거자료로 활용된다.국립국제교육원이 선발관리하는 정부초청외국인장학생 정보를 국외인적자원관리시스템에서 누적관리중이며, 관리 항목 중 토픽회차별 응시료 지원 현황을 집계한 자료임
