summary_user: 대구광역시교육청 고등학교 전재편입학 시행 지침에 따른 추첨배정 일반고등학교의 입학정원을 학교별·기준연도별·학년별·성별로 담은 파일(csv, 약 14KB)이다. 대구로 이사하거나 학군을 옮기는 학부모가 전입학을 희망하는 학교의 학년·성별 정원 규모를 확인하거나, 분석가가 학교별 정원 구성을 비교할 때 쓴다. 전역 조인 키가 없어서 다른 학교 데이터와는 학교명 매핑이나 같은 기관 코드로만 연결한다.
description_portal: '대구광역시교육청 고등학교 전재편 입학 시행 지침에 따른 추첨배정 일반고등학교의 입학정원정보각각의 고등학교의 입학정원은 학년별, 남녀별, 중점과정반으로 구성정원 내의 경우 대구광역시 관내 기준, 정원 외의 경우 입학 정원의 5%로 구성정원 외 세부항목: 타 시도, 특례입학, 편입학, 재입학, 국가유공자, 기타 등으로 이루어짐동구 혁신도시의 경우: 혁신도시 조성 및 발전에 관한 특별법에 따라 혁신도시 인근학교(대구동부고, 정동고, 강동고)는 학교별 정원의 5%, 그 외 소재학교는 학교별 정원의 2% 이내를 전입학 정원으로 관리전입학 신청은 전 가족 거주지가 타 학군으로 이전했을 경우 신청이 가능하며, 전입학 신청 시 주소지 내 학군에 속한 고등학교 중 결원이 있는 학교로 전입학을 희망할 수 있음'
