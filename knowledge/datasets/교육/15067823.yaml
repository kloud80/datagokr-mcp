description_portal: '이 데이터는 박물관, 과학관 등에서 보유·전시 중인 다양한 과학학습 전시품의 상세 정보를 체계적으로 기록한 목록입니다. 각 전시품은 고유 식별번호와 함께, ▲국적(예: 한국, 일본, 미국, 프랑스 등), ▲재질(목제, 금속, 플라스틱, 유리, 기타 복합재료 등), ▲제조연대(예: 2008년, 17세기 등), ▲크기(실측 단위 표기), ▲학명(생물 표본에 한해 한글명/영문명/과명/목명 포함), ▲용도 및 기능(예: 천체관측, 자연현상 이해, 체험 학습, 관람용 등) 등을 포함하는 구조로 이루어져 있습니다. 이에 따라 전시품은 고대 천문기기, 첨단 해양로봇, 다양한 동식물 및 곤충 표본, 자연광물, 생활도구, 실험장치, 전통과학기구 등 매우 폭넓은 범위에 걸쳐 있습니다.'
