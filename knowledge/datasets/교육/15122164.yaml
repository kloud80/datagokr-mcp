summary_user: 경기주택도시공사 직원이 외부기관에서 받은 단기위탁교육을 과정 단위로 담은 건별 기록으로, 교육 형태(집합·재택), 과정명, 교육기관명, 장소, 인원, 시작·종료일, 기간, 시간을 담는다. 공공기관 인재개발 담당자나 연구자가 '이 공사 직원들은 어떤 분야의 외부교육을 어느 시기에 몇 명이 받았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육기관명 같은 이름 매핑이나 같은 기관 기준으로만 이을 수 있고, 학교코드로 학교 기본정보에 붙는 데이터는 아니다.
description_portal: 이 데이터는 경기주택도시공사 직원이 외부기관에서 받은 단기위탁교육 현황을 정리한 자료입니다. 집합교육과 재택교육을 포함하여, 교육 과정명·기관명·장소·기간·인원 등의 정보를 종합적으로 기록하고 있습니다. 이를 통해 직원들이 어떤 주제와 형태의 교육을 이수했는지, 특정 시기·분야별 교육 수요가 어떻게 나타나는지 파악할 수 있습니다. 데이터는 직무역량 강화, 전문성 개발, 교육 효과 분석에 활용될 수 있으며, 기관은 이를 토대로 교육 수요 맞춤형 과정 설계, 인력 재배치, 조직 내 역량 평가 체계 마련에 참고할 수 있습니다. 또한 연구나 정책 분야에서는 공공기관 인재 개발 전략, 직무 전문성 제고, 재택·집합교육의 효과성 비교를 위한 기초 자료로 활용될 수 있습니다.
