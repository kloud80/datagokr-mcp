description_portal: '서울특별시 마포구 관내 유치원 현황입니다. 이 데이터에는 각 유치원이 위치한 구체적인 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 도로명 주소가 포함되어 있어, 유치원의 정확한 위치를 확인할 수 있습니다.또한, 유치원명, 설립 유형(공립/사립), 연락처 등의 주요 정보가 제공됩니다.이 데이터를 통해 학부모는 가까운 유치원의 위치, 유형, 정원 등을 확인하여 자녀의 교육 기관을 선택하는 데 도움을 받을 수 있으며, 행정기관은 관내 유치원의 분포 및 운영 현황을 파악하여 유아 교육 정책 수립 및 시설 관리에 활용할 수 있습니다.'
