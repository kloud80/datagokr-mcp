summary_user: 경기도 귀농귀촌대학의 운영 현황을 사업연도·대학·교육과정별로 정리한 집계표로, 교육기간·교육시간·교육인원·수료인원·자부담 비율 같은 항목을 담는다(필드 명세상 의미는 비어 있어 컬럼명으로 추정한 내용임). 귀농·귀촌을 준비하는 도시민이 어떤 과정이 몇 시간 운영되고 본인 부담이 얼마인지 확인하거나, 분석가가 연도별 교육인원 대비 수료인원을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업연도(biz_yr)나 과정명 같은 이름 매핑, 또는 같은 기관 데이터끼리만 연결한다.
description_portal: '이 데이터는 경기도에서 도시민을 대상으로 운영하는 귀농귀촌대학의 운영 현황을 담고 있습니다. 귀농귀촌대학은 귀농이나 귀촌을 희망하는 이들에게 농촌생활 적응에 필요한 다양한 교육 서비스를 제공하여, 농촌 이주 초기의 시행착오를 줄이고 안정적인 정착을 돕기 위해 설계된 프로그램입니다. 교육은 이론뿐만 아니라 현장 실습, 선도농가 방문, 작물재배 교육 등 실용적인 내용으로 구성되며, 이를 통해 참여자들은 농촌 환경에 대한 이해와 실제 농업기술을 습득할 수 있습니다.※ 귀농귀촌관련 문의 : 경기도귀농귀촌지원센터(https://www.refarmgg.or.kr/index.do)'
