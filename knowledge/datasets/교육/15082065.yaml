description_portal: 부산광역시 인재개발원 일반 공무원, 교육청 및 소방재난본부 소속 공무원 대상 교육과정의 강사관련 정보입니다.(과목코드, 사용자번호, 지급금액, 지방세율, 지방소득세율, 강사비용정산일자, 강사비용정산여부, 강사비용정산자번호, 강사비용연계ID, 강사비용연계상태코드 정보 11,849 건  제공) 부산인재개발원은 미래변화에 능동적으로 대응하고, 글로벌 선도도시 부산을 견인할 역량 있는 공직인재를 양성하는 전문 교육기관으로서의 중추적인 역할을 수행하고 있습니다.앞으로도 「행복한 미래도시, 그린스마트 부산 견인 인재양성」 이라는 비전 아래, 4차 산업혁명 및 기후변화 시대의 급변하는 행정환경에 유연하게 대응하여, 시정현안과 업무성과에 기여하는 교육프로그램을 개발하여 전문역량을 보유한 창의적 인재를 육성하고 있습니다.
