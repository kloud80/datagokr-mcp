summary_user: 경기도 내 공공·일반·전문도서관을 도서관 한 곳당 한 행으로 담은 현황 자료로, 시군명·도서관 유형·운영기관과 운영방식(직영·위탁)·주소·개관일·자료실과 열람실의 운영시간과 휴관일·국내서/외국서/비도서/전자자료/연속간행물 보유량·위경도 좌표를 포함한다. 주민이 우리 시군에서 가까운 도서관과 운영시간을 찾거나, 분석가가 시군별 도서관 수와 장서 규모를 비교해 문화시설 접근성이 낮은 지역을 가려내는 데 쓴다. 전역 조인 키는 실측 컬럼에서 찾지 못했으므로 다른 데이터와는 시군명(sigun_nm)이나 도서관명·주소를 기준으로 맞추거나 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 경기도내 일반 도서관, 공공도서관, 전문도서관등의 도서관 현황 정보입니다.이 데이터는 경기도 내 공공도서관의 운영 현황을 정리한 자료입니다. 주요 항목으로는 도서관명, 주소, 개관연도, 장서 보유량, 열람석 수, 운영기관(직영·위탁) 등이 있으며, 도서관별로 위치와 규모, 제공 서비스의 범위를 확인할 수 있습니다. 특히, 도서관 장서수 및 열람좌석 수는 지역 문화 접근성과 독서환경 수준을 가늠할 수 있는 지표로 활용될 수 있으며, 도서관 정책 수립, 지역별 문화시설 배치 분석, 문화복지 증진 사업에 유용한 기초자료입니다. 해당 데이터는 경기도 내 도서관 분포와 접근성 비교, 신규 도서관 설립 타당성 조사 등에도 활용될 수 있습니다.
