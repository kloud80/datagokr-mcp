description_portal: '제주특별자치도 내 중고등학생의 학교 생활 만족도 정보 데이터를 제공합니다.항목: 연도, 시도, 계(비율), 매우 만족(비율), 약간 만족(비율), 보통(비율), 약간 불만족(비율) 등* 주특별자치도 내 중학생 및 고등학생을 대상으로 조사된 학교 생활 만족도 비율을 주기마다(2년 주기) 정리한 통계자료입니다. 학생들이 자신의 학교 생활(수업, 친구 관계, 학교 환경, 교사와의 관계 등 다양한 구성요소 포함)에 얼마나 만족하는지를 여러 만족도 등급(or 항목)으로 나누어, 각 만족도 수준에 해당하는 학생 비율이 어떻게 변화했는지를 보여줍니다.* 활용 분야 : 교육 환경 개선 및 정책 개입 효과 평가, 학생 정서·심리 복지 프로그램 설계, 교사 및 학교 운영 평가 및 역량 강화 등- 데이터 제공처: KOSIS 국가통계포털'
