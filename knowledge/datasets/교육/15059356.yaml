summary_user: 경기도 안의 가정폭력상담원 교육훈련시설을 시설 한 곳당 한 행으로 담은 건별 현황으로, 시군·사업장명·인허가일자·설치일자·영업상태·폐업일자·소재지면적과 도로명·지번 주소, WGS84 좌표를 포함한다. 가정폭력 상담 인력 양성 기반을 살피는 연구자나 공무원이 "우리 시군에 지금 운영 중인 상담원 교육시설이 있고, 어디에 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)로 같은 경기도 데이터와 묶거나, 좌표·주소로 다른 시설 위치 데이터와 공간 결합해 쓴다.
description_portal: 「가정폭력상담원교육훈련시설현황」 데이터는 경기도 내에서 가정폭력상담원의 교육과 훈련을 목적으로 설치된 시설 현황을 제공하는 자료입니다. 주요 항목에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지면적(LOCPLC_AR), 여성복지시설종류명(FEMALE_WELFACLT_KIND_NM), 설치일자(INSTL_DE), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), WGS84위도(REFINE_WGS84_LAT) 및 WGS84경도(REFINE_WGS84_LOGT)가 포함되어 있습니다. 이를 통해 각 상담원 교육시설의 위치, 설립 및 운영 상태, 인허가 내역 등을 확인할 수 있습니다. 데이터는 가정폭력 예방정책 수립, 지역별 상담 인프라 연구, 복지시설 자원 분포 분석 등에 활용할 수 있으며, Open API(https://openapi.gg.go.kr/Hmvlncnslredu)를 이용하면 시군 단위로 조건 검색이 가능합니다. 본 자료는 교육취업 분야 데이터로 상업적 활용과 가공이 허용되어, 행정기관 정책 지원뿐 아니라 민간 연구 및 사회복지 서비스 개선에도 유용하게 적용될 수 있습니다.
