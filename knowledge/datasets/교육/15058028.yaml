summary_user: 경기도 공공·지역도서관에서 기준년월(STD_YM)별로 많이 대출된 도서의 순위를 도서명·저자·출판사·출판년도·권수·표지 이미지 주소와 함께 담은 집계 데이터이며, 범위는 경기도 시도 단위이고 지도 좌표는 없다. 도서관 담당자나 출판·독서문화 분석가가 '이번 달 경기도 도서관에서 가장 많이 빌려간 책과 출판사는 무엇인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도서명·저자명 같은 이름 매칭이나 같은 기관(경기도) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 공공·지역도서관에서 특정 기간 동안 가장 많이 대출된 도서의 현황을 정리한 자료로, 독서 경향과 도서 선호도를 파악할 수 있습니다. 각 기록에는 기준년월, 대출 순위, 도서명, 저자명, 출판사, 출판년도, 도서 이미지 URL이 포함되어 있어 도서관 이용자의 선호 장르와 베스트셀러 흐름을 분석할 수 있습니다. 이를 통해 특정 시기별 독서 트렌드를 확인하거나 연령대와 독서 성향을 추정하는 데 활용할 수 있으며, 출판사별·저자별 인기 분석, 지역 독서문화 진흥 정책 수립, 도서관 자료 구비 전략 마련 등 다양한 문화행정 및 연구 목적으로 유용합니다.
