description_portal: 이 자료는 특수교육과 평생교육 분야에서 장애인평생교육기관들의 현황을 광범위하게 수록하여 지역별 장애인 교육시설들의 명칭, 주소, 연락처, 홈페이지 등의 정보를 체계적으로 제공합니다. 서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기 등 주요 광역시와 도 지역 내 다양한 장애인평생교육기관이 포함되어 있어 이용자들에게 장애인교육과 자립생활 지원을 위한 기관 선택에 실제적인 도움을 줍니다. 참고로 교육부 국립특수교육원의 장애인평생교육기관현황 데이터도 포함되어 있으며, 최신 기관 정보가 반영되어 있습니다. 따라서 장애인 교육과 복지 향상을 위한 체계적 관리와 정보 접근성을 높이는 데 중요한 자료라고 할 수 있습니다.장애인평생교육기관현황으로 기관명, 기관종류, 우편번호,지역,상세주소, 전화번호,팩스번호, 홈페이지 현황 등을 제공합니다.
