description_portal: 본 문서는 원어민중국어보조교사 CPIK 홈페이지의 사업 담당자 조직도에 관한 데이터로, 2023년 2월 8일 기준의 정보를 포함하고 있다. 주요 부서는 국제교류협력부와 교육교류협력팀으로 구성되어 있으며, 각 부서별 부장, 팀장, 교사, 실무관 등 다양한 직위의 담당자들이 명시되어 있다. 또한, 본 문서에는 과거 2020년 10월 19일의 조직도 데이터가 주기적으로 관리됨을 나타내어 한중교류와 교육교류활동의 지속적인 협력을 엿볼 수 있다. 이를 통해 원활한 국제교류와 효율적인 사업 추진이 이루어짐을 알 수 있다.국립국제교육원 원어민중국어보조교사 CPIK 홈페이지 에 대한 데이터로 사업담당자 조직도 정보를 포함
