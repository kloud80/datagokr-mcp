description_portal: 경기도 고양시 도서관센터에서는 시립도서관 19개관과 지역 내 작은도서관을 대상으로 한 컨텐츠 이용정보 현황을 정기적으로 수집하고 심층 분석하고 있습니다. 주요 항목에는 상품코드, 컨텐츠 한글명, 대출권수 등이 포함되며, 이를 통해 자료별 이용 빈도와 시민 독서 수요를 종합적으로 파악할 수 있습니다. 이러한 분석 결과는 향후 장서 확충 및 전자자료 구입 계획, 서비스 품질 개선, 독서문화 진흥 정책 수립 등 여러 분야에서 중요한 기초 자료로 활용됩니다. 또한 이용자의 선호와 트렌드를 반영하여 맞춤형 프로그램을 기획하고, 도서관 운영 전략을 고도화하는 데에도 적극적으로 사용됨으로써 시민 중심의 도서관 서비스 구현에 기여하고 있습니다.
