summary_user: 인천광역시 남동구가 운영하는 마을학교별로 학교명, 교육과정명, 교육대상, 교육장소를 한 행씩 담은 소규모 목록 파일(csv, 957 bytes)이다. 남동구 주민이 "우리 동네 마을학교에서 아동·청소년·성인 대상으로 어떤 과정을 어디서 하는가"를 찾거나, 행정 담당자가 마을교육 프로그램 분포를 파악하는 데 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어, 다른 데이터와는 마을학교명·교육장소 이름 매칭이나 같은 기관(남동구) 기준으로만 이어 쓴다.
description_portal: '해당 데이터는 인천광역시 남동구에서 운영 중인 마을학교의 현황에 대한 정보를 제공하는 자료로, 지역 주민들이 참여할 수 있는 다양한 교육 프로그램을 이해하고 활용하는 데 도움을 줍니다. 데이터에는 각 마을학교를 식별할 수 있는 연번을 비롯하여 마을학교명, 운영 중인 교육과정명, 교육 대상(예: 아동, 청소년, 성인 등), 교육 인원, 교육이 이루어지는 장소, 담당자 정보 등의 항목이 포함되어 있습니다. 이 정보를 통해 주민들은 관심 있는 교육과정을 찾아 참여할 수 있으며, 행정기관이나 교육 관련 기관에서도 마을교육 활성화 정책 수립 및 운영에 활용할 수 있습니다. 데이터는 정기적으로 갱신됩니다.'
