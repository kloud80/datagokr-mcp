summary_user: 경상남도에 소재한 전문대학·대학교를 학교 한 곳당 한 행으로 담은 목록으로, 학교명(시설명)·학교구분·공사립 구분·소재 시군과 도로명·지번 주소·우편번호를 담는다. 경남 시군별로 어떤 대학이 어디에 있는지 확인하려는 주민·수험생이나, 대학가 주변 원룸 수요·상권을 살피려는 사업자·분석가가 학교 위치를 잡는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 대학알리미 공시 자료 등 다른 데이터와는 학교명이나 주소·시군명을 맞춰 이어 쓴다.
description_portal: <데이터 구성 및 세부항목> 경상남도 전문 및 대학교 현황 데이터는 경상남도에 소재한 대학에 대한 정보를 제공합니다. 해당 데이터는 2025년 1월 기준 경상남도에 소재한 대학교명과  공사립구분, 시설구분, 소재 시군명, 도로명 주소, 소재지 지번 주소, 소재지 우편번호 등의 항목으로 구성되어 있습니다. 해당 엑셀 파일을 다운로드 하시면 데이터를 조회 및 확인하실 수 있습니다.<데이터 현행화 시기> 해당 데이터는 자료 발생 또는 변동 시 수시로 현행화되는 데이터입니다. 차기 업데이트 예정일은 미정으로, 자료 발생 시  업데이트 될 예정입니다.
