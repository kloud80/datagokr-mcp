description_portal: 경기도 양평군 미래교육협력지구는 양평군과 양평교육지원청이 협약을 통해 학교교육과정을 지원하는 사업입니다. 지역연계 학교교육과정 운영을 통해 학생의 조화로운 성장을 지원하고 교육청과 기초지자체가 적극적으로 소통하고 협력하는 지역교육공동체를 실현합니다. 추진 근거로는 경기도 교육청의 미래교육협력지구 추진 기본 계획(안)과 양평군 교육협력센터 설치 및 운영 조례 그리고 경기도 교육감과 양평군수 간 미래교육협력지구 업무협약입니다.  양평군 미래교육협력지구  사업운영 현황을 기준 년도 구분 학교 명 사업 대분류, 사업 소분류, 교부액으로 구분하여 데이터를 제공합니다.
