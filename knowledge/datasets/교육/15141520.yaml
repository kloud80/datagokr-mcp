description_portal: 본 데이터는 서울특별시 종로구 관내 유치원의 방과후 과정 편성 및 운영에 관한 정보를 담고 있습니다. 항목에는 교육청명, 교육지원청명, 유치원코드, 유치원명, 설립유형, 독립편성학급수, 오후재편성학급수, 운영시간 등이 포함되어 있으며, 유치원별로 방과후 과정이 어떻게 운영되고 있는지를 종합적으로 확인할 수 있도록 구성되어 있습니다. 본 자료는 유아의 전인적 성장 지원과 부모의 양육 부담 경감을 위한 정책 수립, 예산 편성, 지역별 운영 격차 분석 등에 활용될 수 있습니다. 또한 국공립 및 사립 유치원의 설립유형에 따라 운영 형태의 차이를 비교할 수 있는 기반 정보를 제공합니다. 이 데이터는 「유아교육법 시행령」 제19조의2에 따라 운영되고 있으며, 교육행정기관에서 주기적으로 수집 및 갱신하여 제공하고 있습니다.
