description_portal: 본 데이터는 기관의 경영정보시스템(MIS) 내에서 이루어지는 수입·지출 거래, 예산 집행, 회계 결산 처리의 표준화를 위해 분류·관리되는 계정과목 체계 정보입니다.주요 수록 항목으로는 계정과목 코드, 계정과목명, 대·중·소분류 상위 계정 구조, 계정 성격(자산, 부채, 자본, 수익, 비용 등), 사용 여부, 관리 항목 설정 정보 등이 포함되어 있습니다.본 데이터를 활용하면 기관 내 모든 재정·회계 거래를 일관된 기준에 따라 정확하게 분류하여 재무제표 작성 및 재정 분석의 정확성을 극대화할 수 있습니다. 또한 공공 및 교육기관의 회계 표준화 실태 비교, 경영정보시스템 간 회계 데이터 연계, 예산 및 결산 통계 분석 등 다양한 경영 및 행정 연구 분야에서 유용하게 활용할 수 있습니다.
