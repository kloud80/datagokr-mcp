summary_user: 학교알리미 공시 기준에 따라 전국 초·중·고등학교(포털 설명상 약 12,000개교)가 공시한 기본정보를 학교·공시연도·공시차수 단위로 담은 CSV 파일(약 5.8MB)로, 전년도와 공시연도의 전체·야간 학생 수, 총교사·수업교사·특수교사 수를 포함한다. 학부모나 교육 분석가가 특정 학교의 학생 수 변화나 교사 1인당 학생 수를 확인하고 학교 간에 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 학교 데이터와는 학교명 매핑이나 같은 기관(한국교육학술정보원) 데이터의 코드로만 연결한다.
description_portal: '학교 전반의 주요정보를 객관적이고 투명하게 공개하는 제도로 국민의 알권리를 보장하는 한편 학교 교육 실태를 정확하게 파악하여 학교 교육의 경쟁력을 높이기 위하여 도입된 2008년부터 초·중등학교 정보공시제를 기반으로 하여 교육부에서 정한 공시 기준에 따라 매년 1회 이상 학교알리미에 공시하고 있으며, 학교의 주요 정보들을 쉽게 확인하실 수 있습니다.공시기관: 초·중등교육법에 따라 설립된 각급 학교, 그 밖에 다른 법률에 따라 설치된 각급 학교공시횟수: 공시항목 별로 매 년 1회 이상공시대상: 초·중·고등학교 약 12,000개교'
