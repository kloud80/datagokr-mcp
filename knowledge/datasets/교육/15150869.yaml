summary_user: 경기도 인재개발원이 개설한 교육과정별 월간 통계로, 통계년월·교육구분·과정명 단위로 신청자·취소자·수료자 수, 수료율, 총수료시간, 신청 시군 수, 인기과정 순위, 만족도 조사 참여인원을 담은 집계 자료다. 교육행정 담당자나 분석가가 "이번 달 어떤 과정의 신청 대비 수료율이 낮고, 어느 과정에 수요가 몰리는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과정명·교육구분 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
description_portal: 이 데이터는 경기도 인재개발원에서 개설한 교육 과정별 월간 통계 정보를 제공하는 자료입니다. 주요 항목으로는 ‘통계년월’, ‘교육구분’, ‘과정명’, ‘현재사용여부’, ‘월전체과정수’, ‘월별교육구분별수료자통계’, ‘실시간인기5개과정여부’, ‘과정별월별신청자수’, ‘과정별월별취소자수’, ‘과정별월별수료자수’, ‘과정별월별수료율’, ‘과정별월별총수료시간’, ‘과정별신청시군수’, ‘인기과정순위’, ‘과정별월별만족도참여인원’ 등이 있으며, 각 교육 과정의 신청부터 수료까지의 학습 흐름과 참여도, 교육의 만족도 및 지역별 수요 분포를 파악할 수 있도록 구성되어 있습니다. 이 데이터는 수강률, 수료율, 만족도 등의 지표를 기반으로 교육성과 분석, 인기 강좌 파악, 교육 콘텐츠 개선, 시군별 교육 수요 예측 등에 활용될 수 있습니다. 특히 사이버교육 형태의 수요가 높고, 각 과정별 수료율과 만족도 분석이 가능하여 교육행정 기획 및 맞춤형 콘텐츠 개발에 유익한 자료입니다.
