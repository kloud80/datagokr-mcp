description_portal: 서울시 관내 유치원 안전교육 실시현황입니다.유치원 정보공시 자료이며 매년 4월 1일 기준으로 조사한 데이터입니다.교육청명,교육지원청명,유치원명,설립유형,소재구,공시연도,학기별생활안전교육,교통안전교육,폭력예방및신변보호교육,약물중독예방교육,사이버중독예방교육,재난안전교육,직업안전교육,응급처치교육의 실시횟수를 제공합니다.매년 연간 1회 업데이트될 예정입니다.교육관련기관의 정보공개에 관한 특례법 시행령제3조의2(유치원 공시정보의 범위, 공시횟수 및 그 시기 등) 의 근거로 실시되는 유치원 정보공시의 항목중 안전교육 관련 자료입니다.
