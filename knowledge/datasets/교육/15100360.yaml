summary_user: 전국 표본 학교 학생의 건강검사 결과를 학생 한 명당 한 행으로 담은 원시자료(rawdata)로, 키·몸무게·체질량지수·시력·청력·혈액·소변검사·혈압·충치 등의 검사 항목을 학년도·시도·학교급·학년·성별과 함께 기록한다. 연구자나 보건 분석가가 '학년·성별·도시규모에 따라 비만도나 근시 비율이 어떻게 다른가' 같은 학생 건강 실태 질문에 쓴다. 학교ID(school_cd)가 있어 학교알리미 공시 등 학교 단위 원장 자료와 학교별로 이어 쓴다.
limits: 전수가 아닌 표본조사라 개별 학교나 지역의 전체 학생 건강 상태를 대표하지 않는다. 포털 설명에 따르면 '검사안함'은 미실시, '해당없음'은 검사했으나 이상없음(정상), 빈칸은 미입력이므로 세 경우를 구분해 해석해야 한다. 파일은 활용신청 없이 zip으로 받는다.
