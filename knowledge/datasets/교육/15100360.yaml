legal_basis_portal: 교육부에서는 「학교보건법」 및 「학교건강검사규칙」에 근거하여 학생건강실태를 파악하고자 매년 초등학교 4학년, 중학교 1학년,고등학교 1학년을 대상으로 ‘학생건강검사’를 실시하고 있습니다.‘학생건강검사통계’는 체계적이고 신뢰성 있는 학생건강지표를 생성하고자 표본학교를 대상으로 분석된 통계입니다.생성된 통계는 ‘통계법』제17조에 근거한 정부 지정통계(승인번호 112002호)입니다.
