summary_user: 서울 동작구·관악구에 있는 유치원과 초·중·고·특수학교를 한 행씩 담은 기관별 원천 목록으로, 학교급·소재구·설립구분(공립·사립)·학교명·주소를 담는다(폐원교 제외, 포털 설명상 2026년 4월 1일 교육통계 기준). 학부모나 분석가가 '관악구에 있는 공립 초등학교와 사립 유치원은 어디인가'처럼 지역·학교급별 학교 분포와 위치를 확인하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 주소 매칭으로만 이어 붙인다.
description_portal: '서울특별시동작관악교육지원청 관내(동작구, 관악구) 유치원 및 학교 현황 목록입니다.2026년 4월 1일 기준으로 유·초·중등 교육통계 조사 결과에 따른 자료입니다.유치원/학교명, 소재구, 설립구분, 전화번호, 유치원/학교 주소를 제공합니다.폐원교(원)는 제외입니다.나이스(NEIS) 유·초·중등 교육통계에 입력된 자료로 각 기관에서 입력한 자료입니다.제공데이터항목 세부내용1. 순번2. 학교급: 유치원, 초등학교, 중학교, 고등학교, 특수학교3. 소재구: 서울 동작구, 관악구4. 설립: 공립, 사립5. 학교명6. 기관주소'
