description_portal: 2025년도 학교무상급식 지원현황에 대한 자료입니다. 기관별 지원대상, 개소수, 소요예산의 항목을 제공합니다.(유치원 운영비 및 인건비는 교육청 자체예산으로 지원) 광주광역시는 2011년 광주광역시 친환경 무상 학교급식지원 조례를 제정하고 시행되면서 전국 최초로 초등학교 전학년 무상급식을 시행하였다.  2020년부터는 유·초·중·고·특수학교 전체 학생을 대상으로  무상급식을 확대하면서 차별없는 보편적 교육복지 실현 및 학부모의 경제적 부담을 경감하였다. 또한 성장기 학생의 건전한 심신의 발달을 도모하였고 식품·운영비 단가를 지속적으로 인상하여 학교급식 만족도를 높이기 위해 노력하고 있다
