summary_user: 경기도 내 특수학교의 수업일수와 수업시수를 기준연도·학교 단위로 담으며, 초·중·고 과정별 학년 수업일수, 주당 수업시수, 수업교원 수, 교원 1인당 주당 평균 수업시수가 한 행에 들어 있다. 교육행정 담당자나 분석가가 '경기도 특수학교 가운데 학년별 수업일수가 다른 학교보다 적거나 교원 1인당 주당 수업시수가 유난히 많은 곳은 어디인가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서 시군명·학교명 매칭이나 같은 기관 코드(정보공시 학교코드 필드 등)로만 다른 학교·교원 통계와 잇는다.
description_portal: 이 데이터는 경기도 내 특수학교의 연도별 수업일수 및 수업시수 현황을 보여주는 자료로, 초등학교·중학교·고등학교 과정별 학년 단위 수업일수와 주당 수업시수, 교원 수 등을 포함합니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분(공립/사립/국립), 학년별 수업일수, 주당 수업시수, 교원 수 등이 있습니다. 이를 통해 학년별·학교급별 교육과정 운영 현황, 교사의 수업 부담 정도, 지역별 차이를 분석할 수 있습니다. 본 데이터는 특수학교 교육과정 운영 실태 파악, 수업일수 준수 여부 점검, 교원 배치 및 업무량 분석, 특수교육 지원정책 수립 등에 활용될 수 있습니다.
