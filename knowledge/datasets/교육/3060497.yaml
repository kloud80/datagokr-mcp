summary_user: 한국장학재단의 학자금대출과 상환 현황을 연도별 대출 금액·건수(인원) 등으로 집계한 통계연보 파일로, 전국 단위 집계이며 건별 원천 자료가 아니다. 정책 분석가나 연구자가 '최근 몇 년간 학자금대출 규모와 상환·연체 현황이 어떻게 변했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·시도명 같은 이름 매핑이나 같은 기관의 장학금 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '한국장학재단의 학자금대출 및 상환 통계 정보로, 매년 전년도 현황 기준으로 연도별 학자금 대출규모(금액, 건수(인원))를 제공하는 통계연보 자료임<일러두기>1. 통계전반에 걸쳐서 사용된 기호 ‘-’의 뜻은 ‘해당사항 없음’이거나 ‘0’을 의미함2. 연도 내 합계는 각 학기 수치의 단순 산술 합계이므로 중복 인원이 발생할 수 있음3. 자료 수치는 반올림 처리로 인하여 세목의 합계와 전체 합계가 일치하지 않을 수 있음4. 1인당, 1건당 금액은 단순 계산값으로 실제로 수혜한 1인당, 1건당 금액과 다를 수 있음5. "소득구간", "소득분위" 용어가 2020년부터 "학자금 지원구간"(약칭: 지원구간)으로 변경됨6. 학자금대출, 상환, 잔액, 연체 등 각 주제별(성별, 연령별, 시도별 등) 현황은 대출 당시 기준임7. 학점은행제 학습자 학자금대출(2023년 최초 시행)은 일반상환 학자금대출에 포함됨'
