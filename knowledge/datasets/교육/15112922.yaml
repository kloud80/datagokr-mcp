description_portal: 본 데이터는 서울특별시 종로구에서 운영하는 전자도서관에 소장된 도서 자료의 목록을 정리한 공공데이터입니다. 수록 항목에는 전자책의 대분류, 서명, 저자, 출판사, 보유권수 등 정보가 포함되어 있으며, 종로구민의 디지털 독서 접근성과 자료 이용 편의성 향상을 위한 서비스 현황을 파악하는 데 활용됩니다. 본 자료는 전자도서관 이용 수요에 대응한 콘텐츠 구성의 다양성 확보, 주제별 장서 분포 분석, 디지털 정보격차 해소를 위한 맞춤형 독서 지원 정책 수립 등에 기초 자료로 제공됩니다. 또한 공공도서관의 미래지향적 전환을 위한 기반 자료로서, 비대면 독서환경 조성 및 온라인 지식문화 확산에도 기여할 수 있습니다.http://elib.jongno.go.kr/ebook/  에서도 전자책 목록을 검색하실 수 있습니다.
