summary_user: 대전광역시 서구에 있는 중학교를 학교 한 곳당 한 행으로 담은 위치 원장 파일로, 학교명·정보공시 학교코드·설립구분·남녀공학 여부와 도로명·지번 주소, 위도·경도, 전화번호를 담는다(CSV 약 9.7KB). 학부모나 분석가가 '서구 안 특정 동에서 가까운 중학교는 어디이고 공립·사립, 남녀공학 여부는 어떤가'를 지도 위에서 확인하거나 교육시설 접근성을 분석하는 데 쓴다. 법정동코드(bjd_cd)로 법정동 단위 인구·주소 데이터와 잇고, 정보공시 학교코드로 학교알리미 공시(학생·학급·교원 수 등)와 학교 단위로 연결해 쓴다.
limits: 대전 서구 한 개 시군구의 개별 학교 목록이라 다른 구나 시 전체 비교, 지역별 통계에는 그대로 쓸 수 없다. 학생·교원 수 같은 공시 수치는 담지 않으므로 학교 코드로 공시 데이터를 따로 붙여야 한다.
