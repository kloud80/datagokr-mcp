description_portal: 광양시립도서관 관심도서 목록 데이터는 시민들의 독서 수요와 도서관 장서 운영 현황을 반영한 자료로, 이용자 맞춤형 정보 제공을 위해 구축되었다. 데이터에는 관심 등록 연월, 관심 도서명, 책 코드, 지은이, 출판사, 자료 위치  항목이 포함되며, 이를 통해 특정 시점에 시민들이 주목한 도서와 자료 분포를 확인할 수 있다.  광양중마도서관, 광양중앙도서관, 광양금호도서관 등 도서관별 위치 정보가 함께 제공된다. 이를 활용하면 독서 트렌드 분석, 장서 관리 계획 수립, 도서 구매 및 추천 서비스 개발 등에 기여할 수 있다. 또한 시민의 독서 관심도를 반영한 데이터 공개를 통해 도서관 이용 활성화와 지역 독서문화 확산에도 도움이 된다.
