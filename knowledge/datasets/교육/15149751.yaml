summary_user: 경기도부천교육지원청 관할 학교를 학교 한 곳당 한 행으로 담은 명부 파일로, 학교구분·설립구분·학교명·홈페이지·주소·위경도·전화번호·학급수를 담는다(CSV 약 38KB). 학부모나 지역 서비스 개발자가 '부천 지역 어느 학교가 우리 집 근처에 있고 학급 규모는 어느 정도인가'를 지도에 표시하거나 연락처를 찾는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명·주소를 매핑하거나 위경도로 공간 결합해 이어 쓴다.
description_portal: '학교 현황에 관련된 데이터는 학교에 대한 기본적인 정보와 연락처 정보를 포함하고 있습니다. 이 데이터를 활용하면 각 학교의 위치, 연락처, 학교의 규모 등 다양한 측면에서 정보를 제공합니다. 이를 바탕으로, 학교의 현황을 관리하거나, 사용자가 특정 학교에 대한 정보를 빠르게 찾을 수 있게 할 수 있습니다.다음은 통합 홈페이지 학교 현황에서 제공되는 주요 정보 항목입니다:학교명: 해당 학교의 공식 명칭학교 홈페이지 주소: 학교의 공식 웹사이트 URL학교 주소: 학교의 물리적 주소위경도 정보: 학교의 지리적 위치 (위도, 경도) 정보전화번호: 학교와 연락을 위한 전화번호학급수: 해당 학교에서 운영되는 학급 수 (학교 규모를 나타내는 정보)이 데이터를 기반으로 다양한 용도로 활용할 수 있습니다. 예를 들어,학교 지도 표시: 위경도 정보를 사용하여 학교들의 위치를 지도에 표시학교 정보 검색: 학교명을 입력하면 관련된 모든 정보를 출력하는 검색 시스템학급 규모 비교: 학급 수를 통해 각 학교의 규모를 비교할 수 있음학교 위치 및 연락처 안내: 학교에 대한 빠른 정보 제공 (위치 및 연락처)'
