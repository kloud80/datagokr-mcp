description_portal: 서울특별시 성북구에 소재한 유치원의 연간 수업일수 현황을 정리한 자료입니다. 각 유치원의 학사일정, 실제 수업일수, 휴업일, 보충수업 현황 등 세부 정보를 포함하며 유치원알리미에서 제공됩니다. 이 데이터는 교육 일정 관리, 정책 수립, 행정 분석, 학사 운영 평가, 연구 및 통계 작성 등 다양한 목적으로 활용할 수 있으며 최신 기준으로 정기 갱신됩니다.데이터로는  교육청명, 교육지원청명, 유치원코드, 유치원명, 설립유형, 3세 수업일수, 4세 수업일수, 5세 수업일수,  혼합연령수업일수, 특수학급수업일수 등을 포함하고 있습니다.
