summary_user: 6차 교육과정에 따라 개발·사용된 고등학교 교과서를 한 권씩 행으로 담은 전국 단위 목록으로, 교과·서명·연도·출판사·발행구분을 담는다(CSV 약 110KB). 연구자나 출판사가 '6차 교육과정 시기 고등학교 국어 교과서는 어느 출판사들이 냈고 발행 형태는 어땠나' 같은 과거 교재 이력 질문에 쓴다. 전역 조인 키가 없어 다른 교육과정별 교과서 목록과는 교과명·서명·출판사 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 6차 교육과정에 따라 개발·사용된 고등학교 교과서 목록을 수록한 자료로, 교과서의 과목명, 출판사, 저자, 발행년도, 적용 교육과정 정보 등을 포함한 구조화된 CSV 형식입니다. 교육부가 관리한 데이터를 기반으로 2020년 9월 최초 등록되었으며, 학교 현장에서 사용된 고등학교 교과서 이력 분석, 출판 현황 조사, 교육과정별 교재 분포 현황 파악, 교육정책 변화에 따른 교과서 유형 비교 등의 목적으로 활용됩니다. 교육행정기관, 출판사, 연구기관 등이 과거 교육과정의 교재 정보 아카이빙 및 정책 분석에 참고할 수 있는 기초 자료로, 정확도 높은 공공 교육 데이터셋입니다.
