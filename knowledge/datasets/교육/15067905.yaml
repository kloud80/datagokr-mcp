summary_user: 국외인적자원관리시스템에 등록된 정부초청외국인장학생 수를 국가(구분)별 행으로, 2018년까지 누계와 2019~2023년 연도별 열로 정리한 전국 단위 집계 파일(CSV, 약 3.8KB)이다. 유학생 정책 담당자나 분석가가 '어느 국가 출신 정부초청장학생이 최근 몇 년간 늘거나 줄었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 유학생·국가 통계와는 국가명을 직접 맞춰 이어 써야 한다.
