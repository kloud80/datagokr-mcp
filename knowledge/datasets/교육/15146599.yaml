summary_user: 서울특별시 마포구에 있는 학원과 교습소를 한 곳씩 담은 현황 데이터로, 학원지정번호·학원명·도로명주소·분야와 교습계열·교습과정·정원·일시수용능력·인당 수강료·등록상태·등록일자·휴원 기간 등을 담는다. 학부모·학생이 마포구 안에서 특정 과목 학원의 위치와 수강료를 비교하거나, 분석가가 동네별 학원가 밀집도를 학원 상권이나 주택 수요 신호로 살펴보는 데 쓴다. 전역 조인 키는 없어서 행정구역명이나 도로명주소·우편번호를 기준으로 이름을 맞추거나 주소를 매핑해 다른 구 학원 데이터나 상권·부동산 데이터와 이어 쓴다.
description_portal: 서울특별시 마포구에 소재하고 있는 학원 및 교습소 현황에 대한 데이터입니다.이 데이터에는 행정구역명, 학원/교습소, 학원지정번호, 학원명, 도로명주소, 도로명상세주소, 분야명, 교습계열명, 교습과정목록명, 교습과정명, 정원합계, 일시수용능력인원합계, 인당수강료내용, 수강료공개여부, 기숙사학원여부, 도로명우편번호, 등록상태명, 등록일자, 휴원종료일자, 개설일자, 적재일시 등의 정보가 포함되어 있습니다.이 데이터를 통해 학부모와 학생은 학원·교습소 정보를 투명하게 확인하여 합리적인 선택을 할 수 있고, 공정하고 안전한 교육 환경 조성에도 기여할 수 있습니다.
