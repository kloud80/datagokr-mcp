summary_user: 경기도 초·중·고·특수학교별로 기준연도마다 교과교실제 운영, 자율학교 지정, 수준별 이동수업, 정규 교과 외 영어교육프로그램 운영 여부를 학교 한 곳당 한 행으로 담는다. 학부모나 교육 분석가가 '우리 시군에서 교과교실제나 수준별 이동수업을 운영하는 중·고등학교는 어디인가'를 확인하는 데 쓴다. 표준 학교코드 같은 전역 조인 키는 없어서 다른 학교 기본정보·통계와는 학교명·시군명·교육지원청명을 맞춰 이름으로 연결해야 한다.
description_portal: "경기도 초,중,고,특수학교 교육운영 특색사업 계획 현황입니다. 시군명, 학교명, 교과교실운영여부, 영어프로그램교육여부 등의 정보를 제공합니다.교과교실제(지정,운영) : 교과목에 맞게 특성화된 교실을 구축하고, 학생들이 해당 교과교실로 이동하여 수업을 듣는 방식으로, 교육부 및 시도교육청이 교과교실제 운영학교로 지정한 중,고등학교자율학교(지정,운영) : 초,중등교육법 제61조 및 동법 시행령 제105조에 의하여 학교 또는 교육과정을 자율적으로 운영하는 학교수준별이동수업(운영) : 학생의 능력과 적성, 진로를 고려하여 교육 내용과 방법을 다양화하여 운영하는 수업으로, 특히 수학, 영어, 국어, 사회, 과학 교과에서는 수준별 수업을 권장함영어교육프로그램(운영) : 교육청에서 지정하여 단위 학교별로 추진 중인 '정규 교과 외' 영어 교육 프로그램(방학 중 영어 캠프 등)"
