summary_user: 경기도 인재개발원이 교육을 제공한 대상 기관별로 월마다 학습자 수와 전체 학습시간, 그리고 사이버학습·마이크로러닝·집합교육·전자책 학습시간을 나눠 담은 월별 기관 단위 집계 통계입니다. 도 산하 공공기관의 학습 운영을 맡은 담당자나 분석가가 "어느 기관이 집합교육보다 사이버학습 비중이 높은가, 기관별 학습 참여가 월별로 어떻게 변하나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(inst_nm)과 통계년월을 이름으로 맞춰 이어 써야 하며, 학교코드 같은 표준 키로는 붙지 않는다.
description_portal: 이 데이터는 각 월별로 경기도 인재개발원이 교육을 제공한 대상 기관들의 학습 통계를 수록한 자료입니다. 기관별로 학습자 수와 전체 학습시간을 포함해 사이버학습, 마이크러닝, 집합교육, 전자책 학습 등 다양한 학습 방식별 시간을 구분하여 제공합니다. 주요 항목에는 ‘통계년월’, ‘기관명’, ‘월별기관학습자수’, ‘월별기관별전체학습시간’, ‘월별기관별사이버학습시간’, ‘월별기관별마이크러닝학습시간’, ‘월별기관별집합교육학습시간’, ‘월별기관별전자책학습시간’이 포함되며, 이를 통해 공공기관의 학습 운영 현황을 파악하고 교육 정책 수립 및 학습 환경 개선에 활용할 수 있습니다. 본 데이터는 학습 유형별 시간 분석이나 기관별 학습 참여도 비교 분석, 연도별 학습 트렌드 파악 등 다양한 목적의 연구와 행정적 의사결정에 활용이 가능합니다.
