summary_user: 경기도 내 각 학교의 기준연도(STD_YY)별 학년별 남녀 학생수와 특수학급·순회학급 남녀 학생수, 전체 총계를 학교 단위로 담는다. 교육행정 담당자나 연구자가 특정 시군·지역교육청 안에서 학교급·학년별 남녀 학생 규모가 어떻게 분포하고 변하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(표준 학교코드 등)가 없어, 다른 학교 기본정보·교원·학급 통계와는 학교명·시군명·교육청명 같은 이름 매핑으로만 이어 붙인다.
description_portal: '성별 학생수(초/중/고/그외) 현황 데이터는 경기도 내 각급 학교의 학생 규모와 분포를 보여주는 교육 통계자료입니다. 시군명, 지역교육청명, 지역명, 학교명, 학교급명 등 학교 기본정보와 함께 학년별 남녀 학생수(예: 1학년남자학생수, 2학년여자학생수 등) 항목이 제공됩니다. 또한 특수학급 및 순회학급의 남녀 학생수, 전체 학생수 총계 항목이 포함되어 있습니다. 본 데이터는 성별·학교급별·학년별 학생수 변화를 파악할 수 있어 교육자원 배분, 학령인구 분석, 지역 간 교육 격차 연구에 활용될 수 있습니다. 특히 교육정책 수립, 학급편성 계획, 학교시설 확충과 같은 행정적 의사결정에 중요한 기초자료로 쓰일 수 있습니다. 데이터는 학교알리미 시스템을 기반으로 하며, 교육행정 및 연구기관이 학생 규모 변화를 장기적으로 추적하고 분석하는 데 유용합니다.'
