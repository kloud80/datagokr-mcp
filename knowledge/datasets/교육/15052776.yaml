description_portal: 본 통계 자료는 교원해외파견사업에 관한 데이터로, 개발도상국에 수학, 과학, ICT 분야의 교원들을 장기 파견하여 기초교육의 향상을 지원하고 양질의 교육기회를 제공하는 내용을 담고 있다. 스와질랜드, 에티오피아, 카자흐스탄, 말레이시아 등의 국가별 연도별 파견 현황도 상세히 제시되어 있으며, 과거에도 유사한 주기성 데이터가 존재함을 확인할 수 있다. 이는 전반적인 교육 지원 방향과 파견 현황을 이해하는 데 중요한 자료이다.교원해외파견사업에 관한 데이터로 개발도상국에 수학, 과학, ICT 분야 등의 교원들을 보내 기초교육향상 지원을 통한 양질의 교육기회를 제공함
