description_portal: '본 데이터는 경상북도 김천시립도서관에서 운영 중인 인문학 및 문화 프로그램의 현황 정보를 포함한 자료입니다. 도서관은 단순한 책 열람 공간을 넘어, 시민의 평생학습과 문화 향유를 위한 복합문화공간으로서 다양한 맞춤형 프로그램을 지속적으로 운영하고 있습니다.주요 운영 프로그램은 다음과 같습니다:- 도서관 인문학 쉼터: 인문학 아카데미, 초청 강연회, 부모교육 등으로 구성되며, 시민의 지적 교양과 사고 확장을 지원합니다.- 아름다운 신중년 컬리지: 중·장년층을 위한 2학기제 문화교육 프로그램으로, 제2의 삶을 준비하는 인생 후반기 맞춤형 교육을 제공합니다.- 생애주기별 힐링 프로젝트: 청소년 대상의 ‘토닥토닥 성장캠프’ 등 연령별 심리·정서 지원 프로그램으로, 사회적 치유 및 공감 능력 함양을 목적으로 합니다.- 꿈과 희망이 자라는 문화 놀이터: 어린이 대상 인형극, 인문학 놀이터 등 다양한 문화 공연·체험을 통해 창의성과 감성을 키우는 장입니다.- 맞춤형 독서 프로그램: 유아부터 성인까지 독서 습관 형성 및 독서의 생활화를 위한 독서 연계 활동을 포함합니다.각 프로그램은 대상 연령, 운영 기간, 운영 주체, 장소, 강의 또는 활동 내용 등이 체계적으로 구성되어 있으며, 교육격차 해소, 문화 소외 완화, 시민 공동체 강화에 기여합니다.'
