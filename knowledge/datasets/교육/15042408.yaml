summary_user: 한국방송통신전파진흥원이 주관하는 정보통신 분야 국가기술자격(무선설비기능사·정보통신산업기사·방송통신기능사 등)의 국방부(군인) 필기시험 결과를 종목·연도·성별(전체/여성)별 접수자·응시자·합격자 수와 합격률로 담은 2016~2020년 집계표로, 약 2KB의 작은 CSV 파일이다. 군 장병 자격취득 지원정책 담당자나 분석가가 '군 복무 중 정보통신 자격 필기 합격률이 종목별·연도별로 어떻게 변했고 여성 장병 비중은 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 자격 통계와는 종목명·연도를 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 한국방송통신전파진흥원이 주관하는 국가기술자격검정의 국방부(군인) 필기시험 합격 통계 입니다(2016~2020년). 데이터는 무선설비기능사, 정보통신산업기사, 방송통신기능사 등 정보통신 분야에 대해 연도별, 성별, 필기 접수자, 필기 응시자, 필기 합격자 수와 필기합격률(%)로 구성됩니다. 성별은 전체/여성으로 구분되어 있으며, 연도별 자격종목별 응시 경향과 합격률 변화를 비교할 수 있도록 구성되어 있습니다. 본 데이터는 군 복무 중인 장병의 기술역량 향상과 자격취득 지원정책의 성과를 분석하는 기초자료로 활용될 수 있습니다. 또한 정보통신 분야 인력양성 현황을 파악하고, 군과 민간의 기술자격 연계정책 수립에 참고할 수 있습니다. 데이터는 국가기술자격 필기시험 결과를 기반으로 매년 관리 중입니다.※실기시험은 국방부에서 개별 진행
