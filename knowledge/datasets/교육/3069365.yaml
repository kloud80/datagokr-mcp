summary_user: 청송교육지원청 관내에 등록된 학원과 교습소를 한 곳당 한 행으로 담은 원천 목록으로, 이름·위치·전화번호·교습계열·교습과정·정원(교습소는 일시수용능력인원)을 담으며 포털 설명상 12건 규모의 작은 파일이다. 청송군에 사는 학부모가 자녀가 다닐 수 있는 학원·교습소와 그 과목·연락처를 찾거나, 분석가가 지역 학원 밀집도를 상권·주택 수요 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 교육지원청의 같은 형식 파일과는 시설명·위치 문자열을 맞춰 붙이거나 행을 이어 붙이는 방식으로만 연결한다.
