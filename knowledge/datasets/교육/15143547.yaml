summary_user: 부산광역시가 운영하는 어린이복합문화공간 '들락날락'의 시설별 운영 정보를 한 행에 한 시설씩 담은 파일로, 시설명·운영 시작·종료 시각·연락처·주소·정기휴관일·위도·경도를 담는다. 아이와 갈 만한 가까운 들락날락이 어디이고 몇 시까지 여는지, 무슨 요일에 쉬는지를 찾는 부산 시민이나, 생활권별 아동 문화시설 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 위도·경도를 기준으로 공간 매칭하거나 시설명으로 이어 쓴다.
description_portal: '부산광역시에서 운영하는 부산어린이복합문화공간 들락날락의 운영 정보입니다. 들락날락은 15분 생활권 내 아동친화적 도서관, 실감형 체험, 미디어아트 전시 등 아날로그와 디지털 콘텐츠를 융합한 새로운 개념의 놀이형 학습공간입니다. 제공데이터 항목으로는 들락날락명, 운영시작시간, 운영시작분, 운영종료시간, 운영종료분, 연락처, 주소, 정기휴관일 데이터를 제공합니다. 들락날락 시설은 2025년 7월 현재, 80개 시설을 운영하고 있습니다. 제공 콘텐츠: 넓고 어두운 공간에서 펼쳐지는 청각과 시각, 공간이란 재료를 활용하여 몰입도를 높이거나, 작품 속에서 함께 즐기고 느낄 수 있도록 고화질의 대형 디스플레이를 활용하여 다양한 테마로 예술적 감각에 디지털 기술을 입힌 융복합 실감 콘텐츠 (미디어 아트), 재난안전체험(4D, 지진, 화재), 색칠한 그림(도안)을 스캔하여 대형 스크린에 전시하는 라이브스케치, 디스플레이 멀티터치 센서칩 기술 기반의 터치하면서 협동심을 기르거나 학습할 수 있는 미디어 터치 테이블, 모션인식과 AR 실감 기술을 활용한 스포츠, 댄스, 학습, 놀이 콘텐츠를 온몸으로 즐기는 인터렉티브 놀이공간, 가상현실을 통해 직접 동화 속 주인공이 되어 참여하는 독서프로그램인 체험형 동화구연, 컴퓨터로 만들어 놓은 가상의 세계에서 플레이 장비를 착용하고 실제와 같은 체험을 할 수 있는 VR'
