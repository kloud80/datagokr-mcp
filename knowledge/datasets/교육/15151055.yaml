description_portal: 본 데이터는 「보육교사 특성별 보육자격 취득기관 현황」을 주제로 CTGAN 기법을 활용해 생성된 합성데이터로, 실제 교사의 개인정보를 포함하지 않고 성별·연령대·학력·근무지역·기관유형 등의 특성과 최초 자격취득 기관 간의 관계를 통계적으로 재현하였다. CTGAN은 원본 데이터의 분포와 속성 간 상호관계를 학습하여 현실적 구조를 유지하되 개인 식별 가능성을 제거함으로써 안전성과 활용성을 동시에 확보하였다. 본 데이터는 지역별 보육인력 양성 현황 분석, 학력·연령대별 자격 취득 경향 연구, 교육기관별 인력 공급 구조 분석 등 정책기획 및 인력개발 연구에 활용할 수 있도록 설계되었다.
