description_portal: '충청남도 당진시 교육시설 현황 안내(데이터 기준일자: 2026년 7월 1일)충청남도 당진시는 지역 내 다양한 교육 수요를 충족하고, 학습 환경을 체계적으로 관리하기 위하여 유형별 교육시설 현황을 관리하고 있습니다. 본 자료는 당진시 관내에 설치·운영 중인 교육시설의 기본 정보를 정리한 것으로, 다음과 같은 항목들을 포함하고 있습니다:연번: 시설별 일련번호구분: 교육시설의 일반 분류 (예: 학교, 학원 등)설립별: 국공립 / 사립 등 설립 주체 구분유형: 시설의 세부 유형 (예: 초등학교, 유치원, 독서실 등)시설명: 해당 교육시설의 공식 명칭도로명주소 / 지번주소: 시설의 위치를 나타내는 주소 정보위도 / 경도: 공간정보 및 위치기반 서비스(GIS) 활용을 위한 좌표값전화번호: 교육시설의 대표 연락처데이터 기준일자: 자료의 작성 기준일본 자료는 지역 교육자원 파악, 시설 운영현황 관리, GIS 기반 정책 설계, 대시민 정보 제공, 민원 대응 자료 등 다양한 용도로 활용될 수 있도록 구성되어 있습니다.'
