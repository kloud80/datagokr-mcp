summary_user: 경기도 초·중·고·특수학교별로 교장·교감·수석교사·보직교사·일반교사·특수교사·전문상담교사·사서교사·실기교사 등 직위별 교원의 남녀 수, 휴직자 수, 합계를 기준연도 단위로 담은 학교별 집계 자료다. 교육 분석가나 행정 담당자가 특정 시군이나 지역교육청 안에서 학교급별로 보건·사서·상담교사가 배치되지 않은 학교가 얼마나 되는지 확인하는 데 쓴다. 전역 조인 키는 없어서 학교알리미 공시 학교코드(INFO_PBLNTF_SCHOOL_CD)나 학교명·시군명을 이름·코드로 맞춰 다른 학교 통계나 학교 기본정보와 붙인다.
description_portal: 본 데이터는 경기도 내 초·중·고 및 특수학교의 교원들을 직위별로 구분하여 현황을 제공하는 자료입니다. 항목에는 교장, 교감, 수석교사, 보직교사, 일반교사, 특수교사, 전문상담교사, 사서교사, 실기교사, 보건교사, 영양교사, 기간제교사, 강사, 원어민교사 등 다양한 직위별 교원의 남녀 성비, 휴직자 수 및 총계가 포함되어 있습니다. 해당 데이터는 학교명, 시군명, 지역교육청명, 학교급명, 설립구분명 등의 정보와 함께 제공되며, 각 직위별 교육 인력의 분포 및 성별 구성, 휴직 현황 등을 분석하는 데 활용됩니다. 이는 교원 인사 관리, 직위별 수요 분석, 성별 균형 정책 수립, 교육 행정 효율성 제고 등에 기초자료로 활용될 수 있으며, 학교알리미 시스템을 기반으로 경기도 AI데이터행정과에서 연 1회 제공하며 Open API를 통해 활용 가능합니다.
