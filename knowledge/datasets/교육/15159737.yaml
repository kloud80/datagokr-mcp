description_portal: 고양특례시가 관내 초·중·고등학교를 대상으로 운영하는 교육지원사업 정보입니다. 고양시 관내 교육기관 및 단체가 참여하여 AI코딩, 드론, 진로, 정서 등 미래역량 및 학년별 특색 분야의 다양한 교육프로그램을 제공합니다.학교 교육과정과 연계한 학년별 맞춤형 특색 프로그램을 발굴 운영하며 학교 수요조사 및 신청을 통해 교육단체의 프로그램과 학교를 매칭하여 체험 활동 중심의 교육을 지원합니다.프로그램 운영을 위한 교육단체는 고양시 관내 지역단체로 매년 공모를 통해 선정합니다.사업은 매년 학기 중 운영되며, 프로그램 정보 , 운영기간, 운영장소, 체험기관 등의 정보를 제공합니다.본 사업은 관내 초·중·고 학교를 대상으로만 신청 및 운영되며 일반 시민은 이용 대상이 아닙니다.
