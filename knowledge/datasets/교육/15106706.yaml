summary_user: 강원특별자치도 내 교육지원청과 산하기관이 운영하는 영재교육원을 기관·영역·급별 행 단위로 담은 현황 파일(CSV, 약 6KB)로, 학급수·운영기간·연간 운영시간·학급당 학생수·선발기간·선발방법과 도로명주소·전화번호·홈페이지를 포함한다. 학부모나 학생이 '우리 지역 영재교육원은 어디서 어떤 영역을 가르치고 언제 어떻게 선발하나'를 확인하거나, 분석가가 시군별 영재교육 학급 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 운영기관명·영재교육기관 이름을 맞추거나 소재지 주소를 행정구역·좌표로 바꿔 연결해야 한다.
description_portal: 강원특별자치도교육청에서 제공하는 "강원특별자치도교육청_영재교육원현황" 파일데이터는 강원특별자치도 내 각 교육지원청 및 산하기관에서 운영 중인 영재교육원의 현황 정보를 체계적으로 수집·정리하여 제공합니다. 구체적으로는 각 영재교육원의 명칭, 위치(주소), 연락처, 운영 학급 수, 교육과정, 운영기간, 선발기간 등 기관별 주요 현황 정보가 포함되어 있습니다. 이 데이터는 「영재교육진흥법」 등 관련 법령에 따라 영재교육의 체계적 지원과 관리, 정책 수립을 위해 수집·관리되고 있습니다. 데이터는 각 영재교육원에서 정기적으로 현황을 취합해 교육청에 보고하는 방식으로 수집되며, 연 1회 이상 정기적으로 업데이트됩니다. 본 데이터는 강원특별자치도 내 영재교육 정책 수립, 지역별 영재교육 자원 현황 분석, 학부모 및 학생의 영재교육기관 정보 탐색, 연구 및 통계 분석 등 다양한 분야에서 활용될 수 있습니다. 또한, 영재교육원의 교육과정, 정원, 수업 일정, 특화 프로그램 등 세부 현황을 파악할 수 있어, 교육행정기관, 연구자, 일반 국민 모두에게 유용한 기초자료로 활용됩니다.
