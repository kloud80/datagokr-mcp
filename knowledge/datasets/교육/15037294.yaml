summary_user: 전국 학원·교습소를 한 곳씩 담은 건별 현황 데이터로, 시도교육청·행정구역, 학원명과 지정번호, 설립·등록일, 등록상태와 휴원 기간, 정원, 분야·계열·과정, 수강료 공개 여부와 내용, 도로명주소·전화번호를 담는다. 학부모가 우리 동네에서 어떤 과목 학원이 등록 상태로 운영 중이고 수강료가 얼마인지 확인하거나, 분석가가 지역별 학원 밀집도를 학원 상권·주택 수요 신호로 살펴보는 데 쓴다. 전역 조인 키는 없어서 시도교육청 코드(ATPT_OFCDC_SC_CODE)로 같은 기관의 다른 나이스 데이터와 잇거나 주소·학원명으로 매칭해 쓰며, 학원·교습소 표준데이터(15096277)와 함께 본다.
limits: 포털 활용신청과 별개로 나이스 교육정보 개방포털(open.neis.go.kr)의 인증키를 받아 호출해야 한다. 다른 데이터와 바로 붙일 공통 키가 없어 이름·주소 매핑이나 교육청 코드로만 연결된다. 좌표가 없는 비공간 데이터이므로 지도 분석에는 주소 지오코딩이 따로 필요하다.
