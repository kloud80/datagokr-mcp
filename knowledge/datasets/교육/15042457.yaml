description_portal: 이 데이터는 한국방송통신전파진흥원 지방본부에서 실시한 국가(기술) 자격증 내/외부 강의 횟수, 시간 등 실적 통계를 제공합니다. 전국 14개 본부와 사업소에서 내부강사, 외부강사, 전문강사에 관한 내용을 포함합니다. 데이터는 내부강사, 외부강사, 전문강사에 대한 강사 수, 강의 횟수 그리고 강의 시간 구성되어 있으며, 서울본부, 경인본부, 부산본부, 진주사업소, 전남본부 등 지역 단위별 운영 현황을 비교할 수 있습니다. 이를 통해 본부별 교육활동의 규모와 강사 활용도를 파악할 수 있으며, 향후 교육자원 배분과 운영 정책 수립의 참고자료로 활용될 수 있습니다. 본 데이터는 2022년 기준으로 작성되었으며, 공공기관의 교육운영 현황을 파악 등의 목적을 위해 제공됩니다.
