summary_user: 서울특별시교육청이 학생 수 감소·통폐합 등으로 폐지된 서울 공립학교의 재산을 폐교 한 곳당 한 행으로 담은 파일로, 폐교년도·소재지·교지와 건물 면적·현재 이용 상태가 들어 있으며 파일 크기는 353바이트에 불과한 소규모 목록입니다. 지역 주민이나 도시재생·부지 활용을 검토하는 분석가가 '서울 어느 동네 폐교가 얼마나 넓고 지금 무엇으로 쓰이는가'를 확인하는 데 쓰고, 구도심 쇠퇴의 신호로 읽는 데도 쓴다. 학교코드 같은 공통 조인 키가 없어 학교 기본정보나 다른 시설 데이터와는 폐교명이나 소재지 주소를 이름·주소 매칭해 이어 붙여야 한다.
limits: 전역 조인 키가 없어 다른 데이터와 자동으로 연결되지 않고, 폐교명·주소 문자열 매칭에 의존해야 한다. 범위는 서울시 한 곳이며 2022년 1회성 업로드 자료라 이후 폐교나 이용 상태 변화가 반영됐는지는 이 파일만으로 확인되지 않는다.
