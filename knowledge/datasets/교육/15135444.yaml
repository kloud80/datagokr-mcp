summary_user: 경남대입정보센터가 관할하는 경상남도 내 학교를 한 행씩 담은 학교 목록 파일로, 고유번호·시도·지구·학교코드·학교명을 담는다(시도 단위 범위, CSV 약 10KB). 진학 상담 교사나 분석가가 '경남의 어느 지구에 어떤 학교가 있는가'를 확인하거나 지구별 학교 분포를 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 학교 통계·재정 데이터와는 학교명이나 학교코드를 대조해 매핑하는 방식으로만 이어 쓴다.
description_portal: 경상남도교육청에서 제공하는 "경상남도교육청_경남대입정보센터_학교정보" 데이터는 경남대입정보센터가 관할하는 각급 학교의 기본 정보를 체계적으로 정리한 데이터입니다. 이 데이터에는 학교명, 학교코드, 시도명, 지구명, 고유번호 등 학교를 식별하고 분류하는 데 필요한 주요 항목이 포함되어 있습니다.정보는 경상남도교육청 진로교육과 경남대입정보센터에서 각 학교의 공식 자료와 교육행정시스템을 바탕으로 연 1회 정기적으로 수집·갱신합니다. 데이터의 보유 및 제공 근거는 「공공데이터의 제공 및 이용 활성화에 관한 법률」에 따라, 교육청이 보유한 공공데이터를 민간과 교육 현장에 개방하도록 규정된 사항에 기반합니다.이 데이터는 경남 지역 내 학교 현황 파악, 진로·진학 지도, 교육정책 수립, 학교별 통계 분석 등 다양한 분야에서 활용될 수 있습니다. 특히 진학 상담, 교육행정, 연구, 정책 개발 등에서 학교 정보를 신속하게 파악하고, 지역별 학교 분포나 특성을 분석하는 데 유용합니다. 학교 정보의 표준화된 제공을 통해 교육현장과 민간에서 데이터 기반의 의사결정과 서비스 개발을 지원합니다.
