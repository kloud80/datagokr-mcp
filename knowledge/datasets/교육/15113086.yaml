description_portal: '이 CSV 데이터는 대전광역시 서구에서 운영하는 ‘움직이는 맘껏놀이터’ 프로그램의 운영 현황을 상세하게 정리한 지역 공공서비스·아동친화 정책 데이터입니다. 아이들이 시간·장소 제약 없이 자유롭게 놀 수 있도록 조성된 이동형 놀이공간의 운영 일정을 객관적으로 제공하는 것이 목적입니다.‘순번’은 각 운영 사례의 식별 번호이며,‘1차·2차 운영시작일자 / 운영종료일자’는 연중 놀이공간이 운영되는 기간을 1·2차로 나누어 구체적으로 기록한 항목입니다.‘운영요일명’은 프로그램 운영 요일을 나타내고, ‘운영시작시각·운영종료시각’은 하루 기준 운영 시간을 제공합니다.‘공원명’은 놀이공간이 설치된 공원의 명칭이며, ‘지번주소’와 ‘도로명주소’는 정확한 위치 정보를 제공합니다.‘행정동코드·행정동명’과 ‘법정동코드·법정동명’은 행정구역 기준의 구체적 위치 식별을 가능하게 합니다.‘대상명’은 프로그램 이용 대상(예: 유아, 아동 등)을 의미하며, ‘운영방법’은 정해진 방식(상주형, 이동형 등)을 설명합니다.‘놀이종류명’은 제공되는 놀이 콘텐츠 종류를 나타내고, ‘문의처명’은 관련 문의가 가능한 기관 또는 담당부서를 나타냅니다.‘링크주소’는 프로그램 상세정보를 제공하는 웹페이지 주소이며, ‘위도·경도’는 GIS 기반 공간분석에 활용 가능한 좌표 정보입니다.‘데이터기준일자’는 자료 갱신 시점을 명확히 하여 최신성·신뢰성을 확보합니다.이 데이터는 아동친화적 도시 조성 정책 평가, 놀이공간 접근성 분석, 운영시간·지역별 참여 수요 분석, 공간정보 기반 지도 서비스 구축 등 다양한 행정·정책 분야에서 활용할 수 있는 실용적인 기초자료입니다.'
