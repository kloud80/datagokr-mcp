description_portal: 우리 사회는 급변하는 시대적 요구에 따라 개인의 지속적인 역량 개발과 삶의 질 향상을 위한 평생학습의 중요성이 점차 증대되고 있습니다. 이에 부산광역시교육청은 시민 여러분이 언제 어디서든 양질의 평생교육을 경험하고, 학습 기회를 효과적으로 탐색할 수 있도록 지역 내 평생교육 시설에 대한 정확하고 신뢰성 있는 정보를 체계적으로 수집하고 관리하고 있습니다.  이는 "평생교육법"에 의거하여 신고 및 등록된 평생교육시설의 현황을 파악하고, 부산 시민의 학습권 보장 및 평생학습 활성화를 위한 정책 수립의 기초 자료로 활용하는 것을 목적으로 합니다. 평생교육 시설로부터 정기적으로 제출되는 자료를 바탕으로 데이터를 구축하고 있으며, 최신 정보를 반영하여 제공하고 있습니다.개방되는 데이터는 부산 지역 내 학력인정 평생교육시설을 포함한 다양한 평생교육시설의 정보를 포함하고 있습니다.  주요 항목으로는 각 평생교육시설의 명칭, 제공하는 평생교육의 종류, 시설의 정확한 주소를 제공하고 있어, 이용자가 필요로 하는 정보를 손쉽게 파악할 수 있도록 구성되어 있습니다.본 데이터를 통해 부산 지역 평생교육 생태계가 더욱 활성화되고, 시민 모두가 언제든 학습의 기회를 누릴 수 있는 지속 가능한 학습 도시를 구현하는 데 크게 기여할 것입니다.
