summary_user: 장애학생 통합형 직업교육 거점학교로 지정된 고등학교를 학교 한 곳당 한 행으로 담은 전국 단위 목록 파일(csv, 약 2.9KB)로, 지정연도·학교명·관할 교육청·설립별(공립·사립)·지정유형을 담는다. 특수교육 담당자나 학부모가 "우리 지역 교육청 관내에서 장애학생 직업교육 거점학교로 지정된 고등학교는 어디이고 언제 지정됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 학교 데이터와는 학교명·교육청 이름을 맞춰 연결해야 한다.
description_portal: 이 문서는 장애학생 통합형 직업교육 거점학교의 지정 운영 현황을 자세히 다루고 있으며 다양한 공립 및 사립 고등학교가 포함되어 있습니다. 매년 갱신되는 자료는 지정년도, 학교명, 교육청, 설립별, 지정유형을 포괄하여 직업교육과 진로직업 분야의 현황을 체계적으로 보여줍니다. 특히 공립과 시도 지정 학교들이 다수 포함되어 있으며, 생명과학과 기술과학 관련 고등학교들의 역할도 강조됩니다. 과거 연도별 거점학교 지정 운영 기록과 함께, 이 문서는 특수교육 현장의 중요한 기반 자료로 기능합니다.장애학생 통합형 직업교육 거점학교 지정 운영 현황(연도별 거점학교 지정운영 현황)으로써 지정년도, 학교명, 교육청, 설립별, 지정유형을 포함하고 있습니다.자료는 매년 갱신됩니다.
