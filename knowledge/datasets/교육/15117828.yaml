description_portal: 일반대학의 온라인 학위과정은 대면 수업 없이 온라인 수업만으로 학사 또는 석사학위를 취득할 수 있는 제도이며, 다양한 대학 및 대학원의 여러 전공 분야에서 승인이 이루어지고 있다. 주요 전공으로는 인공지능융합영어교육, 컴퓨터교육, 평화학, 미래형모빌리티 ICT융합공학, 문화콘텐츠기획 및 마케팅, 디지털 마케팅과 디지털 인문예술 등이 포함된다. 특히, AI응용전공, 풀스택 융합코딩, AI학습플랫폼, AI빅데이터, 스마트헬스케어 등의 혁신적 융합 및 디지털 관련 학과들이 온라인 학위과정 승인 현황에 반영되어 있으며, 경영학 분야도 여러 대학원에서 활발하게 운영 중임을 확인할 수 있다. 온라인 학위과정 승인 대학 명단은 다수 대학의 대학원 학과와 전공별 차수 정보를 포함하여 제공되고 있다.
