summary_user: 일반대학이 교육부 승인을 받아 대면 수업 없이 온라인만으로 학사·석사학위를 주는 과정의 승인 명단을 대학명·학과(전공)·승인 차수 단위로 담은 전국 단위 소규모 CSV 파일(약 2.3KB)이다. 직장인·학습자가 'AI나 경영학 분야에서 온라인만으로 학위를 딸 수 있는 대학원이 어디인가'를 찾거나, 분석가가 차수별로 어떤 전공이 승인됐는지 살펴볼 때 쓴다. 대학 코드 같은 공통 조인 키가 없어 대학알리미 공시 자료 등 다른 대학 데이터와는 대학명 문자열 매칭으로만 이어 쓴다.
