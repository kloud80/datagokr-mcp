description_portal: 이 문서는 고등학교 교육 과정에 따른 다양한 교과서와 지도서의 인정도서 목록을 상세히 제공하며, 각 교과서는 1~3학년까지 사용 가능한 과목별로 구성되어 있습니다. 도서명, 저자, 출판사, 인정 시도 등의 정보를 포함하여 가구 디자인, 가정 과학, 간호의 기초, 건축, 공업, 공중 보건, 관광, 교육학, 국제 경제 등 다양한 과목이 수록되어 있습니다. 이 리스트는 교과서 정보 서비스에서 활용되는 중요한 자료로, 학생과 교사에게 교과서 선택과 교육과정 이해에 도움을 줍니다. 미리보기 내용에는 학교급, 교과서 발행 지역, 사용학년 등의 세부 정보가 포함되어 있어 실질적인 교육 현장에 적용 가능성을 높입니다.
