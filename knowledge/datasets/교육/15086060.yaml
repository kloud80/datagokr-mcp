description_portal: 경기도 고양시 도서관센터는 시립도서관 19개관과 지역 내 작은도서관의 자료 예약 이용현황을 통합 제공합니다. 본 데이터셋은 서명(표제)과 실제예약횟수로 구성되며, 실제예약횟수는 이용자가 예약을 완료하고 시스템에 유효하게 기록된 건수를 의미합니다(예약 취소·만료·동일건 중복요청 제외). 동일 서명의 다권본·다관 소장 자료는 통합 합산하며, 정기 수집 주기에 따라 갱신됩니다. 개인식별정보는 포함하지 않으며, 인기 자료 분석, 수요 기반 장서 확충, 예약 정책 개선, 대기열 관리, 서비스 품질 지표 산출 등 행정·운영 의사결정에 활용됩니다.
