description_portal: '○ 통계개요* 통계명 : 특성화고등학교(사립)(2011년 이후)* 통계종류 : 사립 특성화고등학교 현황을 제공하는 지정·보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적·종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획·시행·평가·연구 등에 주요 정보를제공, 국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 학교 → 구 교육청 → 서울특별시 교육청 → 한국교육개발원* 공표주기 : 정기(매년, 4월 기준)* 공표범위 : 지역 - 서울시 및 자치구,내용 - 특성화고등학교(사립)의 학교수, 학생수, 교원수 현황 등○ 용어설명* 교원수 : 재직, 휴직, 파견 포함. 기간제는 4.1 현재 재직 중 교원 모두 포함* 사무직원 : 보직을 받은 자에 한해 조사함(예: 서무부장, 행정실장, 서무과장,행정과장 등) 단, 직위가 없을 경우는 조사하지 않음* 교지면적 : 교사용 대지와 체육장의 면적을 합한 용지* 건물면적 : 보통 및 특별교실(과학실험실· 미술실·음악실 등), 관리실(서무실·교무실·교장실 등), 기타의 합계* 교실수 : 2014년 이전 : 정규교실(수준별교실 포함) + 가·대용교실2015년부터 교실구분 기준에 의한 일반교실, 교과교실, 특별교실,수준별교실의 합* 진학자수의 대학에는 산업대학, 기술대학, 방송통신대학이 포함됨'
