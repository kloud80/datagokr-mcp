description_portal: '금천구 관내 관내 유치원 급식 운영 현황을 데이터로 공개하고 있습니다.이 자료에는 관할 교육청, 유치원명, 유치원 유형(공립·사립, 법인·사인·단설·병설), 급식 운영 방식, (위탁 시)위탁 업체명, 전체 유아 수 및 급식을 먹는 유아 수, 영양교사 배치 여부, 단독·공동 배치 영양교사 수, 조리사 및 조리 인력 수, 집단급식소 신고 여부, 유치원 주소와 같은 정보가 담겨 있습니다.이 데이터를 통해 우리 동네 유치원의 급식 운영 형태와 인력 구성, 급식 참여 현황을 확인하실 수 있습니다. 또 이를 바탕으로 유치원의 급식 안전성, 영양 관리 수준, 위탁 여부 등을 비교·검토할 수 있으며, 어린이 급식 정책 개선이나 연구 자료로도 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
