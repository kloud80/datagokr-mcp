description_portal: '2019년 이후 실시한 부산광역시 수영구 도서관 강좌정보 데이터로, 이용자들이 도서관을 통해 제공받을 수 있는 다양한 교육 프로그램의 상세 내용을 제공하여, 이용자들이 관심 있는 강좌를 쉽게 찾고 등록할 수 있도록 돕습니다. 파일 내에는 개설된 강좌의 강좌명, 교육이 시작되고 종료되는 날짜, 해당 강좌를 들을 수 있는 대상 (예: 어린이, 성인), 강좌를 수강하는 데 필요한 수강료, 그리고 실습 등에 필요한 재료비 정보가 포함되어 있습니다. 또한, 실제 교육이 이루어지는 교육 장소도 명시되어 있습니다. 이 데이터는 도서관의 교육 프로그램 활용도를 높이고, 지역 주민들의 평생학습 기회를 확대하는 데 유용하게 활용될 수 있습니다.'
