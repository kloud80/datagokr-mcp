description_portal: 서울특별시 광진구 유치원 직원 근속연수 현황 데이터는 서울열린데이터광장(data.seoul.go.kr)을 통해 제공되며, 갱신 주기는 월간입니다. 이 데이터는 광진구 관내 유치원에서 근무 중인 교직원의 평균 근속연수를 확인할 수 있는 자료로, 유치원별 인력 안정성과 교육 환경의 지속성을 파악하는 데 활용됩니다. 정보는 유치원알리미(e-childschoolinfo.moe.go.kr) 시스템을 기반으로 하며, 해당 플랫폼에서는 유치원 운영 전반에 대한 다양한 정보를 열람할 수 있습니다. 관련 문의는 성동광진교육지원청(02-2286-3741)으로 하시면 됩니다. 이 데이터는 유치원 인사 정책 수립과 교직원 근속환경 분석에 활용할 수 있습니다.
