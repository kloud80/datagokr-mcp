description_portal: 경기도 하남시립도서관에서 운영하는 다양한 교육 프로그램의 구조를 체계적으로 기록한 도서관 교육강좌 운영현황 자료입니다. 강좌번호는 각 프로그램을 고유하게 식별하는 기준값으로 활용되며, 교육강좌명은 독서교실, 만들기 특강, 영어스토리텔링 등 대상별 강좌체계를 명확히 보여줍니다. 교육장소는 강의실·자모실 등 도서관 내 공간 활용 현황을 확인할 수 있어, 공간배정 및 시설 운영계획의 핵심 자료가 된다. 모집인원과 예비인원은 정원 관리와 수강 수요 파악의 중요 지표로, 시민들의 인기 강좌 여부와 프로그램 확장 필요성을 판단하는 데 유용합니다. 또한 최초등록일자는 강좌가 언제부터 운영되었는지 보여주는 프로그램 등록이력으로, 도서관 교육서비스의 발전 과정과 운영 패턴 분석에 활용할 수 있습니다.
