description_portal: 해당 데이터는 한국사학진흥재단에서 국, 공, 사립대학을 대상으로 집계받은 각 연도별, 학교별 교지의 기준면적과 보유면적을 제시하며 이에 따른 교지 확보율을 보여주는 데이터입니다.대학의 캠퍼스별로 각 조사연도의 입학정원 및 재학생 기준 기준면적과 교지 보유면적 및 교지 확보율(입학정원, 재학생기준)을 제공합니다.교지 확보율은 대학이 교육용 시설을 운영하는 데 필요한 토지를 얼마나 충분히 확보하고 있는지를 평가하는 지표로 활용됩니다.공공데이터 형태로 제공되므로, 대학 재정 관리 연구, 고등교육 관련 정책 결정, 민간 분석 및 시각화 등 다양한 목적에 활용될 수 있습니다.
