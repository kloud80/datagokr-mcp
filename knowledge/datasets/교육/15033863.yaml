description_portal: 이 데이터는 한국사학진흥재단이 추진하는 행복기숙사지원사업과 관련된 핵심 정보를 담고 있습니다. 연도별로 건설된 행복기숙사의 사업장별 수용인원, 총사업비, 연면적, 그리고 재원투입 현황(공공자금관리기금, 주택도시기금, 국고보조금) 등을 포함하고 있으며, 이는 각 대학 기숙사 인프라 확충을 위한 투자 규모와 사업 효율성을 분석하는 데 유용한 자료입니다. 행복기숙사지원사업은 학생들의 주거환경을 개선하고 등록 외 비용 부담을 완화하기 위한 공공지원 사업입니다. 본 데이터는 정책성과 분석, 재정투입의 적절성 검토, 향후 사업 방향성 설정 등 다양한 행정·정책 목적에 활용될 수 있습니다
