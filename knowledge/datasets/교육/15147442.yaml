summary_user: 강서구 소재 유치원별로 교육청·교육지원청, 유치원 코드와 이름, 설립 유형, 실내공기질 점검일과 결과, 정기 소독 대상 여부와 점검 결과, 저수조·수질검사, 미세먼지·조도 점검 결과, 주소를 한 행씩 담은 기관 단위 현황이다. 학부모가 "우리 아이 유치원은 실내공기질 점검에서 적합 판정을 받았고 정기 소독을 하고 있나"를 확인하거나, 행정기관이 점검 미이행 유치원을 가려내는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 유치원 코드(KINDERCODE)·유치원명·주소의 이름 매핑으로 이어 쓰며 유치원 위치·원아 수 자료나 어린이집 자료와 짝지어 본다.
description_portal: 이 데이터는 강서구 소재 유치원들의 환경위생 관리 현황을 기록한 자료입니다. 각 유치원의 설립 유형(사립·공립), 실내공기질 점검일, 점검 결과, 정기 소독 여부 등의 항목이 포함되어 있어 교육시설의 위생 및 안전 수준을 종합적으로 파악할 수 있습니다. 실내공기질 적합 여부와 정기 소독 실시 여부는 유아들의 건강과 직결되는 중요한 요인으로, 학부모는 본 데이터를 통해 자녀가 다니는 유치원의 위생 관리 수준을 객관적으로 확인할 수 있습니다. 교육청과 행정기관은 이를 활용하여 위생 점검 미이행 기관을 관리·감독하고, 지역 내 유아 교육시설의 환경위생 개선 정책을 수립할 수 있습니다. 또한 해당 데이터는 유치원 시설 환경의 질적 수준을 평가하고, 건강 취약 계층 아동의 안전한 보육 환경을 조성하기 위한 기초자료로서 활용 가치가 큽니다.
