description_portal: 국가자격 CBT(Computer Based Test) 시험과 관련하여 수험자들이 시험 준비에 참고할 수 있도록, 시험 일정에 따른 시험 장소 정보를 비롯해 세부적인 시험장 구성 정보를 조회할 수 있습니다. 제공되는 정보에는 각 시험일자별로 지정된 시험장소의 명칭과 위치는 물론, 시험장 내 부(區)별 좌석 수와 좌석 배열 방향 등 수험 환경에 대한 구체적인 사항이 포함되어 있어, 응시자는 자신이 배정된 시험장의 구조를 미리 파악하고 시험 당일 원활하게 시험에 응시할 수 있도록 도움을 받을 수 있습니다.
