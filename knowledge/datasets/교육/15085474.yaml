description_portal: '○ 통계개요* 통계명 : 평생교육기관 학습자(수요대상별/유형별)* 통계종류 : 평생교육기관 수요대상별 학습자 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「평생교육법」제18조* 작성목적 : 우리나라 평생교육기관에 대한 체계적이고 합리적인 평생교육통계조사를실시하여 정부 및 연구자, 일반 국민들의 정보 수요를 충족시키는자료를 제공하는 것을 목적으로 함* 조사체계 : 지역교육청 및 해당기관 → 평생교육진흥원* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 평생교육기관의 어린이, 청소년, 성인, 노인, 통합 등의 수요대상별, 성별 학습자수'
