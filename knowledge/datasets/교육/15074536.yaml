description_portal: '대구광역시립남부도서관은 지역 주민들에게 다양한 독서 자료를 제공하고자 지속적으로 새로운 도서를 소장하고 있습니다. 신착 도서 목록에는 다음과 같은 상세한 정보가 포함되어 있습니다.1. 서명: 도서의 제목으로, 이용자가 관심 있는 주제나 내용을 쉽게 파악할 수 있도록 합니다. 2. 저자: 도서를 집필한 사람으로, 저자의 이름을 통해 이용자는 선호하는 작가의 작품을 찾을 수 있습니다.3. 발행자: 도서를 출판한 출판사로, 출판사의 명성을 통해 도서의 신뢰도를 판단할 수 있습니다. 4. 발행년: 도서가 출판된 연도로, 최신 정보를 반영한 도서를 선택하는 데 도움이 됩니다.5. 청구기호: 도서관에서 도서를 분류하고 배치하기 위한 코드로, 도서의 주제나 분야를 나타내며, 이용자가 원하는 도서를 서가에서 쉽게 찾을 수 있도록 도와줍니다.이러한 정보를 통해 이용자들은 도서의 내용을 미리 파악하고, 도서관 내에서 원하는 도서를 효율적으로 찾을 수 있습니다. 또한, 신착 도서 목록은 독서 트렌드를 반영하여 다양한 분야의 최신 도서를 소개함으로써, 이용자들의 독서 선택에 폭넓은 도움을 제공합니다.'
