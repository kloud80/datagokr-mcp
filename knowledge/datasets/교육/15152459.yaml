description_portal: 이 데이터는 충청남도 내 교육기관 중 위험물질을 취급하거나 보관하는 학교의 등록 현황을 관리하기 위한 자료입니다. 각 항목은 학교구분 번호, 학교명, 주소, 등록일, 활성화 여부(Y)로 구성되어 있으며, 유치원부터 특수학교까지 다양한 교육기관이 포함되어 있습니다. 이 데이터는 학교 내 실험실, 과학실, 창고 등에서 사용되는 화학약품, 실험기구, 위험물질의 안전관리 대상 기관을 식별하고, 관련 시설의 안전점검 및 관리체계를 구축하는 데 활용됩니다. 활성화 여부는 해당 학교가 현재 위험물질 관리 대상 기관으로 운영 중임을 나타내며, 등록일은 관리 체계에 편입된 시점을 의미합니다. 이 자료는 교육청의 위험물질 안전관리 정책 수립, 학교별 안전점검 계획 수립, 위해물질 대응 매뉴얼 작성, 시설 개선 예산 편성 등에 중요한 기초 자료로 활용되며, 학생과 교직원의 안전 확보를 위한 핵심 관리 도구입니다.
