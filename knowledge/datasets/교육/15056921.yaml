summary_user: 경기도 소재 대학원·대학원대학의 중도탈락 현황을 연도(STD_YY)·학교·학과(전공) 단위로 담은 집계 통계로, 석사·박사·석박사통합 과정별 재적학생수와 미등록·미복학·자퇴·학사경고·유급제적·수업연한초과 등 사유별 인원, 총계와 중도탈락학생비율을 포함한다. 교육 정책 담당자나 분석가가 '경기도 대학원 중 어느 학교·전공의 박사과정 중도탈락률이 높고, 주된 사유가 자퇴인지 미등록인지'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 학교 통계나 재정 데이터와는 학교명·학과명을 이름으로 맞추거나 같은 기관(경기도) 자료끼리만 연결한다.
description_portal: 중도탈락 학생 현황(대학원, 대학원대학) 데이터는 경기도에 소재한 대학원 및 대학원대학의 학생 유지·탈락 현황을 제공하는 교육 통계자료입니다. 학교종류명, 설립구분명, 학교명, 학과명(전공), 학과특성명, 학과상태명 등의 기본 정보와 함께 석사·박사·석박사통합 과정별로 재적학생수, 미등록수, 미복학수, 자퇴수, 학사경고수, 유급제적수, 수업연한초과수, 기타 현황 등이 포함됩니다. 또한 총계와 중도탈락학생비율(%) 지표가 제공되어, 대학원생의 학업 유지율 및 중도탈락 요인을 분석할 수 있습니다. 이 데이터는 대학 운영 현황을 객관적으로 파악하고, 고등교육 정책 수립, 학사 관리 체계 개선, 학생 지원정책 마련 등 다양한 분야에 활용될 수 있습니다. 특히 대학알리미 시스템과 연계되어 교육부 및 지방정부가 학사 관리 현황을 점검하고 중도탈락 예방 정책을 설계하는 데 중요한 자료로 사용됩니다.
