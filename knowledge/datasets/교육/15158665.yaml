summary_user: 전국 대학과 전문대학을 학교 한 곳씩 담은 기본 현황 데이터로, 학교명·영문명, 대학구분·학교구분, 설립형태, 본분교 여부, 설립일자, 시도와 도로명주소, 대표 전화·팩스, 홈페이지, 조사연도를 담는다. 어느 시도에 어떤 설립형태의 대학·전문대학이 몇 곳 있는지 보거나, 학교 소재지를 지도에 올려 대학가 상권·원룸 수요를 분석할 때 기준 목록으로 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 학교ID(schlId)나 학교명으로 같은 기관의 대학 공시 데이터와 맞추고, 시도코드·시도명이나 주소로 지역 데이터와 잇는다.
description_portal: 표준데이터셋으로 제공하는 '한국대학교육협의회_대학 및 전문대학정보'를 API로 제공,대학 및 전문대학의 학교구분, 설립형태, 소재지 등의 정보를 포함하여 학제 구분, 운영 형태, 설립 주체, 지역별 분포, 학교 유형별 특성, 규모 및 기본 현황 등 다양한 세부 정보를 함께 제공하며, 교육기관 현황을 체계적으로 파악하고 분석·활용할 수 있도록 지원하고, 관련 서비스 개발 및 정책 수립, 연구·통계 분석 등에 활용 가능한 기반 데이터로 제공하며, 공공데이터 활용도를 높이고 다양한 분야에서의 연계 활용을 지원
