description_portal: 경기도교육청미래과학교육원 전시관은 수원, 의정부 2곳에 위치하여 운영하고 있습니다.수원 전시관은 과학전시실, 유아과학전시실, 바다마루, 천체 투영실로 의정부 전시관은 과학전시실, 과학놀이방, 3D입체영상실로 구성되어 있습니다.10인 이상의 단체 관람 및 천체투영실(개인포함)은 사전 예약을 통해 가능하며, 그 외 전시실은 현장 관람 가능합니다. 유아 10인당 인솔자 1명 이상 동반을 권장드립니다. 경기도교육청미래과학교육원 전시관 이용을 위한 정보를 제공하오니, 이용에 참고해 주시기 바랍니다. 단, 운영 일정은 본원의 행사 및 사정에 의하여 변동될 수 있습니다.
