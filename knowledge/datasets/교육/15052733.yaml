summary_user: 전국 유초중등 학교를 학교 단위 한 행으로 담은 주소록 파일로, 학교명·도로명주소·연락처·팩스·홈페이지와 학제·설립·남녀공학 구분을 싣고 검증 수신 21,178행이다. 학교에 연락하거나 위치를 확인하려는 국민, 지역 학교 목록을 만드는 분석가가 쓴다. 도로명주소(address)를 조인 키로 삼아 주소·좌표 기반 다른 데이터와 이어 쓰며, 학교 코드 같은 별도 식별 키는 필드에 없다.
limits: 포털 설명은 2018년 서울 고등학교만 다룬다고 적었으나 실측은 전국 21,178행이므로 연도·범위를 내려받아 직접 확인해야 한다. 지역별 통계 용도는 배제되어 있어 학교·기관 단위 조회에만 맞고, 키는 주소 하나뿐이라 주소 표기 차이에 따라 연결이 어긋날 수 있다.
