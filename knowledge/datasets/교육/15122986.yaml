summary_user: 경기도 내 문해교육기관을 기관 한 곳당 한 행으로 정리한 목록으로, 지역명·기관명·초등과정 학력인정 여부(acdmcr_recogn_nm)·전화번호·주소·홈페이지를 담는다. 비문해 성인이나 그 가족이 "우리 시군에서 초등 학력을 인정받을 수 있는 문해교육기관은 어디인가"를 찾거나, 분석가가 시군별 문해교육 기관 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·주소 같은 이름 매칭이나 같은 기관 코드로만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 내 문해교육기관의 현황을 정리한 자료로, 각 기관의 지역명, 기관명, 학력인정 여부, 전화번호, 주소, 홈페이지 정보 등으로 구성되어 있습니다. 문해교육기관은 주로 평생학습관, 주민자치센터, 초등학력 인정기관 등으로 구성되며, 비문해 성인을 위한 기초 문자해득 교육과 초등과정 학력 취득 지원 등의 기능을 수행합니다. 데이터 항목 중 '학력인정'은 해당 기관이 초등과정 학력인정 기능을 수행하는지를 나타내며, 주소 및 홈페이지는 이용자 접근성과 정보 탐색에 활용됩니다. 이 데이터는 문해교육 정책 수립, 지역별 교육 자원 배분, 평생학습 체계 분석, 기관 홍보 자료 제작 등에 유용하게 사용될 수 있습니다.※ 평생교육진흥원에서 향후 문해교육 기관조사 계획이 없어 갱신이 중단되었습니다.
