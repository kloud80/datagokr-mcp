description_portal: 광양시 미디어창작실 현황 데이터는 시민과 청년을 대상으로 한 창작 지원 공간의 이용 정보를 체계적으로 제공하기 위해 구축된 자료이다. 이 데이터에는 건물명, 공간명, 도로명주소, 이용대상, 신청 가능 기간, 이용 가능 시간, 최대 이용 시간, 대여 단위, 비치 장비, 기타 사항 등이 포함된다. 예를 들어 광양중앙도서관 미디어창작실은 중학생 이상 광양시립도서관 정회원이 이용 가능하며, 영상믹서, 캠코더, 마이크, 조명, 컴퓨터 등 다양한 장비를 갖추고 있다. 또한 광양청년꿈터 셀프촬영실은 광양시 거주 청년을 대상으로 DSLR 카메라, 캠코더, 웹캠, 조명 등 촬영 장비를 지원한다. 본 데이터는 이용자의 신청·운영 편의를 높이고, 문화·창작 활동을 지원하여 지역 사회의 창의적 활동 기반을 강화하는 데 활용될 수 있다.
