description_portal: 이 파일은 경상북도 안동시에서 운영하는 정보화교육 현황을 수록한 데이터로, 시민의 디지털 역량 강화를 위한 각종 교육과정을 확인할 수 있습니다. 주요 항목은 교육이 진행되는 장소인 교육장, 과정의 내용을 나타내는 교육과정명, 실제 교육 기간을 알 수 있는 교육시작일과 종료일, 교육이 진행되는 총 일수 또는 횟수를 표시한 교육일자(횟수), 수강이 가능한 대상(시민, 어르신 등)을 나타내는 대상, 교육 참여 가능 인원을 의미하는 정원, 신청·문의용 접수 전화번호, 교육장이 위치한 도로명주소로 구성되어 있습니다. 이를 통해 시민·연구자·행정기관은 안동시 정보화교육의 운영 현황과 공간적 분포, 대상별 교육기회를 분석하고, 교육 참여 및 정책 수립에 활용할 수 있습니다.
