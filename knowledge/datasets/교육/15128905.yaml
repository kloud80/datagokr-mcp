description_portal: 한국장학재단 일반 상환 학자금대출 채무자 중 장기연체자의 연령대별 상환한 금액과 인원의 합계 데이터입니다.연령대는 10년을 기준으로 구분하며 금액은 원 단위로 기재되어 있습니다.일반 상환 학자금대출이란 학부생 및 대학원생에게 학자금대출(등록금 및 생활비)을 지원하고, 대출기간 동안(거치기간 및 상환기간) 원리금을 분할하여 상환하는 제도입니다.장기연체 시 신용도판단정보(연체정보 등) 등록 및 일시상환(전액)의무 등 불이익이 발생할 수 있으므로, 연체하지 않도록 학자금대출 상환에 유의바랍니다.보다 자세한 제도소개는 한국장학재단 누리집(www.kosaf.go.kr)을 참고해주시기 바랍니다.
