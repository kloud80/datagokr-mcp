summary_user: 경기도 초·중·고등학교별로 기준연도의 학년별 연간 수업일수, 주당 수업시수 합계와 교사 1인당 주당 평균 수업시수, 수업교원 수를 담은 학교 단위 현황 자료로, 범위는 시도 단위이며 공간 정보는 없다. 학부모나 교육 분석가가 '우리 시군 학교들의 수업일수와 교사 1인당 수업 부담이 학교급·공립/사립별로 어떻게 다른가'를 비교하는 데 쓴다. 학교알리미 공시 학교코드(INFO_PBLNTF_SCHOOL_CD)와 시군코드·학교명 필드가 있으나 실측에서 전역 조인 키로 확인되지 않아, 다른 교원·학생·학급 통계나 학교 기본정보와는 학교명·코드 매핑이나 같은 기관 코드로 이어 붙인다.
description_portal: 이 데이터는 경기도 내 초등학교, 중학교, 고등학교의 연간 수업일수 및 수업시수에 대한 현황을 제공하는 통계 자료입니다. 각 학교별로 학년별 수업일수를 일 단위로 기록하고 있으며, 수업시수는 한 주간 시간표 기준으로 전 학년 전체 반의 수업시간을 합산한 총합입니다. 이 외에도 주당 평균 수업시수(교사 1인당), 수업에 참여한 교원 수 등도 함께 포함되어 있어 학교의 실제 교육 운영 현황을 파악할 수 있습니다.데이터는 시군명, 학교명, 학교급(초/중/고), 설립 구분(공립/사립) 등 메타 정보를 포함하고 있으며, 이를 통해 지역별, 학교유형별 비교 분석이 가능합니다. 특히 연도별 수업일수 추이를 통해 교육 일정 운영의 변화를 확인할 수 있으며, 수업시수 정보를 기반으로 학교 교육의 밀도나 강도를 파악할 수 있습니다. 수업교원수 항목은 학급 규모나 수업 시 인력 배치에 대한 판단 자료로 활용될 수 있습니다.이 자료는 학교알리미를 원천으로 하며, 경기도 AI데이터행정과에서 연 1회 갱신하여 제공하고 있습니다
