description_portal: 제공하는 데이터는 경상남도 지역의 고유 방언인 ‘토박이말’에 대한 정보를 체계적으로 수집·정리하여 제공하는 데이터입니다. 해당 데이터는 경상남도에서 사용되는 다양한 토박이말과 그 의미를 포함하고 있으며, 각 항목에는 등록일련번호, 토박이말, 토박이말의 의미 등이 포함되어 있습니다. 이 데이터는 경상남도교육청 창의인재과에서 매년 정기적으로 수집·갱신하며, 「공공데이터의 제공 및 이용활성화에 관한 법률」에 근거하여 보유 및 관리되고 있습니다.이 데이터는 경상남도 지역 방언의 보존과 전승, 지역 정체성 강화, 교육과정 연계, 지역문화 연구 및 콘텐츠 개발 등 다양한 분야에서 활용될 수 있습니다. 특히 초·중·고등학교 교육현장, 지역문화 연구, 모바일 사전 개발, 지역사회 홍보 등에서 폭넓게 쓰일 수 있습니다. 경상남도교육청은 토박이말의 소멸을 막고, 지역민과 학생들에게 우리말의 소중함을 알리기 위해 토박이말 정보를 지속적으로 수집·정비하고 있습니다. 이를 통해 지역 언어유산의 가치를 높이고, 교육·문화적 활용도를 높이고자 노력하고 있습니다.
