description_portal: 경상남도 창원시의 2023년 상반기 시민 정보화 교육의 교육 일정입니다. 항목은 구, 교육시설, 교육명, 기수, 접수일자, 교육일자 입니다.지자체 또는 공공기관이 주관하는 주민 대상 정보화 능력 향상 교육의 일정, 교육 주제, 장소 및 참여 방법 등을 정리한 자료입니다. 본 데이터는 연간 또는 분기별 교육 과정, 일정별 강좌 정보, 대상자(일반·시니어·청년 등) 구성 등을 포함하며, 디지털 역량 강화, 주민 공공서비스 접근성 개선, 민원 안내 및 지원, 참여율 분석 등에 활용될 수 있습니다.강좌 수와 일정이 많아 일반 뷰어(엑셀, 메모장 등)에서는 일부만 표시될 수 있으므로 R, Python, 일정 관리 시스템, GIS 등의 도구 사용을 권장합니다.교육 주관 기관, 신청 방식, 정원·접수 상태, 교육 방식(온라인·오프라인) 등 세부 정의는 제공기관의 메타데이터 또는 기술문서를 참고해 주세요.
