summary_user: 2024년 한 해(발급일 기준) 평생교육사 자격증을 신청한 양성기관의 이름과 기관유형을 기관 단위로 담은 전국 범위 CSV 파일(약 22KB)이다. 평생교육사 자격을 따려는 사람이나 분석가가 '어떤 대학·기관을 통해 평생교육사 자격증 신청이 이뤄졌는가', '기관유형별로 어떻게 나뉘는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 양성기관명(기관명) 문자열을 맞춰서만 이을 수 있다.
