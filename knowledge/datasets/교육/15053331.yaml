summary_user: 경상북도 성주군 내 폐교된 학교를 한 행에 한 곳씩 담은 원장 파일로, 폐교명·폐교연도·학교급, 대지와 건축연면적, 활용현황(임대·매각 등), 도로명·지번 주소를 담는다. 지자체·민간기업·연구자가 '성주군에서 아직 활용되지 않은 폐교 부지가 어디이고 면적은 얼마인가'를 확인해 임대·매입이나 지역 개발 후보지를 검토하는 데 쓴다. 전역 조인 키는 없어 시도·시군구 코드나 교육지원청 코드, 소재지 주소, 폐교명을 기준으로 다른 교육지원청의 폐교재산 파일이나 주소 기반 공간자료와 맞춰 이어 쓴다.
description_portal: '"성주군 내 폐교된 학교의 재산 현황을 종합적으로 안내하는 자료입니다. 이 데이터에는 폐교된 학교의 명칭, 위치, 폐교 일자, 부지 및 건물의 면적, 현재의 임대 또는 매각 현황 등 폐교 재산과 관련된 구체적인 정보가 포함되어 있습니다. 해당 정보는 행정지원과 등 관련 부서에서 폐교의 설립·폐지 및 자산 변동 사항을 공식 행정 절차와 현장 조사, 재산 관리 기록 등을 통해 수집하며, 「공유재산 및 물품 관리법」 등 관련 법령에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 연 1회 이상 정기적으로 갱신되어, 성주군 내 폐교재산의 최신 현황을 반영합니다.이 자료는 지역 내 폐교 재산의 효율적 관리와 활용, 임대 및 매각 정책 수립, 공공자산의 투명한 운영, 지역사회 개발 및 활용방안 모색 등 다양한 분야에서 활용됩니다. 또한, 정책 담당자와 연구자, 지방자치단체, 민간기업 등에서 폐교 재산의 활용 가능성 분석, 지역 개발계획 수립, 공공시설 확충 등에도 중요한 참고자료로 사용할 수 있는 공공데이터입니다."'
