description_portal: 국외인적자원관리시스템의 정부초청외국인장학생은 다양한 국가별로 학사, 석사, 박사, 연구, 연수 과정에 걸쳐 분포되어 있다. 가나, 가봉, 네팔, 러시아, 미국 등 여러 국가에서 장학생이 지원받고 있으며, 과정별로는 석사 과정의 수가 상대적으로 많다. 데이터는 시스템에 등록된 정보로 실제 사업부서 자료와 차이가 있을 수 있고, 이전에 2019년과 2022년에도 유사한 기록이 있다. 이를 통해 정부초청장학생의 국가 및 과정별 현황을 체계적으로 파악할 수 있다.국외인적자원관리시스템 내 정부초청외국인장학생의 국가별, 과정별 현황※ 시스템에 등록된 데이터 기준으로 실제 사업부서의 보유자료와 일부 차이가 있을 수 있음
