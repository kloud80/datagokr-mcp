description_portal: LX국토정보박물관은 85년의 지적 역사를 통하여 지적정보를 구축하고 공간정보를 더하여 국토정보 역사를 재조명하고 가치를 높이는 역사공간인 동시에 국민의 이해를 돕는 문화공간입니다. 박물관 소장유물은 지적공부, 측량장비, 제도장비 등 대한민국 국가유산인 국토정보에 관한 소중한 자산입니다. 공간정보 분야와 관련된 역사적 가치가 있는 자료들을 체계적으로 정리하여 문화재 관리, 학술 연구, 전시 기획 등에 활용할 수 있도록 제공하고 있습니다. 유물의 보존과 활용을 위한 기초자료로 활용됩니다.
