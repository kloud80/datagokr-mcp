description_portal: 제공하는 데이터는 광주광역시 관내에서 폐지된 학교의 현황을 체계적으로 정리한 자료입니다. 이 데이터에는 폐지학교의 학교명, 소재지 주소, 폐지일자, 학교급(초등학교, 중학교, 고등학교 등), 설립구분(공립/사립), 폐지 사유, 폐지 후 활용 현황 등 구체적인 정보가 포함되어 있습니다. 2025년 기준 총 30건 내외의 데이터가 수록되어 있습니다.해당 데이터는 교육청이 학교 설립 및 폐지 관련 행정업무를 처리하는 과정에서 수집되며, 「초·중등교육법」 및 관련 교육 법령에 근거하여 보유·관리되고 있습니다. 데이터는 학교 폐지 결정 및 행정처리 이후 정기적으로 갱신되며, 학교의 폐지 및 활용 현황 변동 시 신속하게 반영됩니다.이 데이터는 지역 내 교육자원 변화 분석, 학교 통폐합 정책 수립, 폐교 부지의 효율적 활용 방안 마련, 연구기관의 교육환경 변화 연구, 지역사회 및 지자체의 도시계획 수립 등 다양한 분야에서 활용될 수 있습니다.
