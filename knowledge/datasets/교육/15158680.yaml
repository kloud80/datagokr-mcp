summary_user: 대학알리미 공시를 바탕으로 국내 대학별 등록금, 장학금 수혜, 학자금 대출 학생 수, 학생 1인당 교육비 같은 재정 지표를 지표 아이디(indctId)와 항목의미·지표값 쌍으로 담은 전국 단위 API이며, 6개 오퍼레이션 모두 실호출에 성공했다. 수험생·학부모가 "이 대학의 등록금과 장학금 수혜 수준은 다른 대학보다 어떤가"를 비교하거나, 분석가가 대학별 학생 지원·교육 투자 수준을 견주는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대학명 매핑이나 같은 기관(대학알리미)의 학교구분·학교 ID 코드로만 잇고, 이 두 코드는 호출 전에 다른 대학알리미 데이터에서 먼저 받아와야 한다.
description_portal: 본 데이터는 한국대학교육협의회에서 운영하는 대학알리미를 기반으로 수집된 것으로, 국내 대학의 등록금 및 학생 재정 지원 현황을 종합적으로 제공.주요 항목으로는 등록금 수준과 학생 재정 지원 및 교육 투자 규모를 파악할 수 있는 지표들이 포함되어 있으며, 구체적으로 등록금 현황, 장학금 수혜 현황, 학자금 대출 학생 수, 학생 1인당 교육(투자)비 등이 제공.등록금 현황은 대학별 등록금 수준과 변동 추이를 통해 학비 부담 정도를 파악할 수 있도록 하며, 장학금 수혜 현황은 학생들이 실제로 받는 재정 지원 규모와 수혜 비율을 보여준다. 학자금 대출 학생 수는 등록금 부담을 보완하기 위한 금융 지원 이용 실태를 나타내는 지표로 활용. 또한 학생 1인당 교육(투자)비는 대학이 학생 교육을 위해 투입하는 비용 수준을 나타내며, 교육의 질적 수준과 투자 정도를 간접적으로 판단할 수 있는 지표.본 데이터는 대학의 재정 구조 및 학생 지원 수준을 비교·분석하고, 고등교육 정책 수립 및 대국민 정보 제공을 위한 기초 자료로 활용.
