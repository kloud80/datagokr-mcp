summary_user: 서울시 소재 유치원별로 교육청·교육지원청, 설립유형, 주소와 함께 실내공기질·정기소독·미세먼지·조도 점검일자와 결과, 음용수 종류, 지하수 수질검사 이행 여부를 담은 유치원 단위 원천 자료다. 학부모가 우리 동네 유치원의 실내공기질·소독 점검 결과를 비교하거나, 분석가가 교육지원청별 환경위생 점검 이행 수준을 진단하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 유치원 데이터(알리미 공시, 어린이집 자료 등)와는 유치원명·주소 매핑이나 같은 기관의 유치원코드(KINDERCODE)로만 연결한다.
description_portal: 서울시 유치원 환경위생관리 현황 데이터는 서울시 소재 유치원을 대상으로 교육청 및 교육지원청 단위까지 구분하여 시설별 환경위생 관리 수준을 파악할 수 있도록 구성된 자료입니다. 이 데이터는 유치원별 설립유형과 주소 정보를 바탕으로 실내공기질, 정기소독, 음용수 종류, 지하수 사용 시 수질검사 이행 여부, 미세먼지 및 조도관리 등 다양한 환경 관련 점검 내역과 그 결과를 포함하고 있습니다. 이를 통해 유치원 실내 환경의 안전성과 쾌적성을 객관적으로 비교·분석할 수 있으며, 정기소독 의무대상 여부, 점검일자, 각 항목별 검사결과를 함께 제공함으로써 법정 관리 기준 준수 여부와 관리 수준을 종합적으로 진단할 수 있는 근거 자료로 활용할 수 있습니다.
