summary_user: 전국 외국인학교의 학교별 기본현황을 학교 한 곳당 한 행으로 담은 파일로, 학교코드·학교명·학제·설립구분·인가일자·설치과정과 학급 수·학생 수·교직원 수·교원 수를 담는다(CSV 약 3.4KB 규모). 학부모·연구자·정책 담당자가 "전국에 인가된 외국인학교는 어디이고 학교별 학생·교원 규모는 어느 정도인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 학교 기본정보·교원·학생 통계와는 학교코드나 학교명을 매핑해 붙인다.
description_portal: 제공하는 데이터는 전국 외국인학교의 운영 현황을 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 학교코드, 인가일자, 학급 수, 학생 수, 교직원 수, 교원 수 등 각 외국인학교의 주요 현황 정보가 포함되어 있습니다. 데이터는 외국인학교가 설립·운영될 때마다 나이스(NEIS) 등 교육행정시스템을 통해 학교에서 직접 입력·관리된 정보를 기반으로 수집되며, 학교의 인가, 학급·학생·교직원 변동 등 행정상 변화가 발생할 때마다 수시로 갱신되는 1회성 데이터입니다. 데이터의 보유 및 제공 근거는 「초·중등교육법」과 외국인학교 및 외국인유치원의 설립·운영에 관한 규정 등 관련 법령에 따라 국가 교육정보화와 학교 행정 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 기반합니다. 이 데이터는 외국인학교 현황 분석, 교육정책 수립, 국제교육 인프라 연구, 외국인 학생 및 교직원 지원 정책 개발, 지역별 국제학교 분포 조사 등 다양한 분야에서 활용될 수 있습니다
