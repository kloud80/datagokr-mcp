summary_user: 충청남도교육청 관할 학원과 교습소를 한 곳씩 담은 xlsx 파일로, 학원명·운영자·주소·전화번호·교습과정과 과목·정원·교습기간·교습비가 들어 있습니다(포털 설명 기준 학원 3,306개, 교습소 953개, 천안·아산 등 시군 단위 교육지원청별 구분). 학부모가 우리 지역 학원의 교습비와 정원을 비교하거나, 분석가가 시군별 학원가 밀집도를 학원 상권·주택 수요 신호로 살피는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학원명·주소 문자열이나 시군 이름을 맞춰 연결해야 합니다.
description_portal: 충청남도교육청 학원 및 교습소 현황 자료입니다.학원현황은 시군구별로 천안, 공주, 보령, 아산, 서산, 논산계룡, 당진 금산, 부여, 서천, 청양, 홍성, 예산, 태안으로 구분되어있고, 전체 학원 총합계는 3,306개입니다.간호조무사, 건축, 검정, 경미, 경매 등 69개의 다양한 과정의 학원이 존재합니다.교습소 현황은 시군구별로 14개 지역에 전체 953개의 교습소가 있습니다.공예, 꽃꽃이, 무용, 실용외국어, 정보교과 등 21개의 다른 과정의 교습소가 있습니다.학원 및 교습소에 대한 학원명, 운영자명, 학원주소, 전화번호, 교습과정, 교습과목, 정원, 교습기간, 교습비 등의 자료를 포함하였습니다.
