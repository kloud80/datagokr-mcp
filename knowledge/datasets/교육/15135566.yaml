summary_user: 사립대학 부속병원회계 손익계산서를 학교(병원)별 한 행으로 집계한 파일로, 입원·외래·기타 의료수익과 인건비(일반급여·임상교원급여 등)·재료비(약품비·진료재료비 등)·관리운영비 세부 항목, 의료이익과 당기순손익까지 담는다. 분석가나 정책 담당자가 '어느 사립대 부속병원이 의료이익 적자이고 인건비·약품비 비중이 얼마인가'를 학교별·지역(대·중·소지역)별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 대학 공시·재정 자료와는 학교명·법인명을 맞추거나 같은 기관(한국사학진흥재단) 자료끼리 이름 매핑으로만 연결한다.
description_portal: 한국사학진흥재단_사립대학 부속병원회계 손익계산서은 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 부속병원회계 손익계산서 자료를 통해 사립대학 부속병원의 입원수익, 외래수익, 기타수익 등의 수익과 인건비, 약품비, 재료비 등의 비용 세부내역을  학교별, 지역별로 확인할 수 있습니다.해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.
