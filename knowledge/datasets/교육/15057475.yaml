summary_user: 경기도 중·고등학교의 교원 수를 기준년도·학교·상위교과·교과(표시과목)별로 남성·여성·합계로 담은 학교 단위 집계 자료이며, 정규 교과 담당 교사를 대상으로 하고 휴직·장기휴가로 대체 교원이 채용된 경우는 빠진다. 교육 행정 담당자나 분석가가 "우리 시군 고등학교에 과학·수학 교사가 몇 명이고 성비는 어떤가" 같은 교과별 교원 수급·지역 격차 질문에 쓴다. 실측상 전역 조인 키는 확인되지 않아, 학교명·시군명 매핑이나 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD) 같은 같은 기관 코드로 학교 기본정보·학생·학급 통계와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 중·고등학교의 표시과목별 교원 현황을 정리한 자료로, 정규 교과 수업을 담당하는 교사를 대상으로 조사되었습니다. 조사에는 단순 휴가자가 포함되며, 휴직 교사나 장기 휴가로 인해 대체 교원이 채용된 경우는 제외됩니다. 주요 항목으로는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분, 상위교과명, 교과명, 남성·여성·합계 교원 수가 있으며, 국어·영어·수학·사회·과학·예술·체육 등 다양한 교과 영역에서 교원 배치와 성별 분포를 확인할 수 있습니다. 이 데이터는 교과별 교원 수급 현황, 성별 불균형 분석, 학교급별 교원 자원 분포, 지역 간 교원 격차 검토 등 교육 행정과 정책 수립의 기초 자료로 활용될 수 있습니다.
