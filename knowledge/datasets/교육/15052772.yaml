summary_user: 국립국제교육원이 선발·관리하는 정부초청외국인장학생 수를 선발연도(2018~2025)와 학위 과정(학사·석사·박사, 한국어연수·교환학생 등)별로 집계한 전국 단위 소규모 표(약 300바이트 CSV)이다. 연구자나 대학 관계자가 "최근 몇 년간 정부초청장학생이 어느 학위 과정에서 얼마나 늘었는가"처럼 학위별 선발 규모 추이를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 유학생·대학 자료와는 연도와 학위 과정 이름을 맞춰 붙여야 한다.
description_portal: 본 문서는 정부초청외국인장학생 선발 현황을 연도별 및 학위별로 집계한 자료로, 2018년부터 학사, 석사, 박사 학위별 장학생 수를 상세히 다루고 있습니다. 석사 과정 장학생 수가 가장 큰 폭으로 증가했으며, 한국어연수 및 교환학생 프로그램 참여자 수 또한 확인됩니다. 이 자료는 정부초청외국인장학생의 변화 추이를 이해하는 데 유용하며, 선발 현황의 체계적 관리 현황을 보여줍니다.국립국제교육원이 선발관리하는 정부초청외국인장학생의 선발연도 기준 해당연도별, 학위별 장학생 현황
