description_portal: 이 문서는 다양한 대상군을 위한 글로벌 역량강화 연수 정보를 상세히 제공합니다. 지역주민 대상으로는 상반기와 하반기 글로벌연수가 오프라인에서 유료로 진행되며, 학생과 학교 밖 청소년을 위한 다채로운 영어 원격 연수가 무료로 실시간 온라인 수업 형태로 여러 차수에 걸쳐 반복됩니다. 또한 공무원 대상의 원격 연수도 함께 제공되어 글로벌 소통 능력과 영어 활용 능력을 강화하도록 기획되었습니다. 주요 교육 프로그램에는 Phonics, Sentence Level, Speaking, Travel English, Movie English, 검정고시 준비, Online Debate 등이 포함되어 원활한 학습과 참여를 지원합니다. 이는 지역사회 구성원과 공무원의 글로벌 역량 증진 및 교육 접근성을 높이기 위한 통합 교육 체계임을 알 수 있습니다. 또한 교육 일정, 모집 기간, 교육 장소, 비용 등 세부 사항을 확인할 수 있어 체계적 연수 계획 수립에 도움이 됩니다.
