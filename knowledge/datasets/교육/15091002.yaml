description_portal: 한국기술교육대학교 온라인평생교육원 스마트 직업훈련 플랫폼 (STEP) 학습관리시스템에서 각 교육 콘텐츠를 관리할 때 사용하는 강의 과정의 내용 중 과정 정보의 아이템 분류 및 종류 관련 목록을 제공합니다.각 콘텐츠의 고유 ID, 과정 연결, 유형 코드, 표시 순서, 제목, 선행 과목 수, 등록 국가 및 등록 일시를 담은 교육 콘텐츠 메타정보입니다.이 항목들은 교육 과정이나 콘텐츠 정보를 체계적으로 관리하고 공유하기 위함이며, 각 필드는 데이터의 의미와 활용 목적에 따라 신중하게 사용되어야 합니다.
