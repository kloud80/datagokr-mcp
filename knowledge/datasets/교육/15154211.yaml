description_portal: 이 데이터는 국립해양생물자원관에서 운영하는 교육 프로그램의 운영 현황과 참여 정보를 국민에게 제공하기 위해 수집·정리된 교육 서비스 기반 데이터입니다. 각 항목은 개별 프로그램 단위로 구성되어 있으며, 교육과정명, 교육 일정(교육시작일·종료일·교육일시), 식별번호(교육번호), 교육장소, 교육대상 등 프로그램의 기본 정보를 포함합니다. 또한 유무료 여부, 교육운영방법(대면·온라인 등), 출력여부 등 운영 형태를 확인할 수 있는 정보와 함께 최초등록일, 예약방법, 문의처 등의 사용자 편의를 위한 항목도 포함되어 있습니다.이를 통해 해양교육의 체계적 운영 기반 마련에 기여할 수 있을 것으로 기대됩니다.
