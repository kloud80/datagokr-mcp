summary_user: 광주 광산구에 있는 특수학교를 학교 한 곳당 한 행으로 담은 소규모 파일(csv 448바이트)로, 학교명·학급수·학생수·교원수와 교무실·당직실 전화, 팩스, 주소·우편번호·위도·경도를 포함한다. 학부모나 특수교육 담당자가 '광산구 안 특수학교는 어디에 있고 학급·학생·교원 규모는 얼마인가'를 확인하거나, 분석가가 특수학교 위치를 지도에 표시할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·교원·학생 통계와는 학교명 매칭으로만 연결하고, 위도·경도로 학구도나 시설 위치 데이터와 공간적으로 겹쳐 본다.
description_portal: 광주광역시 광산구에 위치한 특수학교 현황에 대한 상세한 정보를 제공합니다. 이 데이터는 각 학교의 명칭과 학교 번호, 학급 수, 학생 수, 그리고 교원 수 등 교육 현황을 파악할 수 있는 다양한 항목을 포함하고 있습니다. 또한, 각 학교의 연락을 위한 전화번호와 팩스 번호, 주소, 우편번호뿐만 아니라 위치를 정확히 확인할 수 있는 위도와 경도 정보도 함께 제공되어 학교의 위치와 규모를 한눈에 이해할 수 있습니다. 이러한 자료는 교육 관련 정책 수립, 특수교육 환경 개선, 학생 및 학부모 상담 지원 등에 중요한 기초 자료로 활용됩니다. 광산구 내 특수학교의 전반적인 현황을 체계적으로 관리하고 분석하는 데 도움이 됩니다.
