description_portal: '대학생 청소년교육지원장학금 관련 국고 이자수익 관리 정보: 상품명, 연도, 학기, 대학명, 이자발생일자, 이자수익금액 등의 정보를 제공함데이터 제공항목은 사업 상품명, 사업연도, 사업학기, 예산 배정 대학명, 대학 계좌의 이자 발생일자, 이자 발생 금액이 있습니다.대학생 청소년교육지원장학금은 대학생(멘토) 초중고등학생(멘티)에게 기초학습 등 멘토링을 지원하고, 그 대가로 대학생에게는 장학금을 지원하는 것을 목적으로 합니다.※ 장학금 관련 상세 정보는 "한국장학재단 누리집(https://www.kosaf.go.kr) > 인재육성 > 대학생지식멘토링 > 대학생 청소년교육지원장학금"에서 확인 가능'
