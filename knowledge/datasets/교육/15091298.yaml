summary_user: 교육부와 한국과학창의재단이 지정한 전국 초·중·고 인공지능(AI) 교육 선도학교 목록을 학교 1곳당 1행으로 담은 파일로, 학교급·학교명·유형(교육활동 모델교/정보교육실 구축교)·소속 지역·지정 연도가 들어 있다. 연구자가 '우리 지역에는 어느 학교급의 AI 선도학교가 몇 곳이고 연도별로 어떻게 늘었나'를 보거나, 학부모·에듀테크 기업이 지역 내 AI 교육 특화 학교를 찾는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 학교알리미 공시 등 학교 단위 데이터와는 학교명과 소속 지역을 맞춰 이어야 한다.
description_portal: '데이터 소개: 4차 산업혁명 시대를 맞이하여 미래 사회의 핵심 역량인 인공지능(AI) 분야의 중요성이 증대됨에 따라, 교육 현장에서의 체계적인 AI 교육 기반을 마련하고 우수 인재를 양성하고자 교육부와 한국과학창의재단은 "인공지능(AI) 교육 선도학교"를 지정하여 지원하고 있습니다. 본 데이터는 AI 교육을 선도적으로 운영하는 학교의 현황을 제공합니다.개방 데이터 상세: 개방되는 데이터는 전국의 초·중·고등학교 중 AI 교육 선도학교로 지정된 1,291개교의 목록입니다. 각 학교의 ▲학교급(초/중/고) ▲학교명 ▲유형(교육활동 모델교/정보교육실 구축교) ▲소속 지역 ▲지정 연도 정보가 포함되어 있어, AI 교육 선도학교의 전국적인 분포와 연도별 지정 현황, 유형별 운영 현황을 상세히 파악할 수 있습니다.데이터 활용 방안:- 학계·연구기관: 지역별, 학교급별 AI 교육 선도학교 지정 현황을 분석하여 교육 정책의 효과를 연구하고, AI 교육 격차 해소 및 균형 발전을 위한 정책 연구의 기초 자료로 활용할 수 있습니다. 또한, 지정 연도별 추이를 통해 정책 변화와 현장 도입 양상을 연구할 수 있습니다.- 교육계·교원: 타 학교의 우수 운영 사례를 벤치마킹하고, 교사 연구회 및 전문적 학습 공동체 활동을 통해 AI 융합 교육 프로그램을 개발하거나 적용하는 데 활용할 수 있습니다. 학생 및 학부모는 진학 및 진로 설계 시 해당 지역의 AI 교육 특화 학교를 탐색하는 데 도움을 받을 수 있습니다.- 산업계·민간기관: AI 교육 콘텐츠, 에듀테크 솔루션 등을 개발하는 기업은 선도학교를 대상으로 실증 사업을 추진하거나, 맞춤형 교육 프로그램을 제안하는 등 협력 모델을 발굴할 수 있습니다. 이를 통해 공교육과 연계한 AI 교육 생태계 확장에 기여할 수 있습니다.'
