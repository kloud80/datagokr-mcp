description_portal: 한국과학창의재단은 학부모가 자녀의 수학 학습을 효과적으로 지도하는 데 도움을 주고자 'AskMath' 플랫폼을 통해 학부모용 가이드북 콘텐츠를 제공하고 있습니다. 이는 수학 교육과 관련된 학부모의 궁금증을 해소하고, 가정 내 수학 교육을 지원하여 수학에 대한 학생들의 흥미와 자신감을 높이는 것을 목표로 합니다.개방 데이터는 초등학교 수학 교과과정에 기반한 학부모용 가이드북 63건의 목록입니다. 각 데이터는 대상 학교(초등학교), 학기, 가이드 제목(교과 단원 연계), 등록자, 등록일자 정보로 구성되어, 학부모가 자녀의 학년과 학습 진도에 맞는 지도 자료를 쉽게 찾아볼 수 있도록 합니다.학부모 및 교사는 자녀 또는 학생의 수학 학습 지도에 직접적으로 활용하여 학습 효과를 높일 수 있습니다. 교육 콘텐츠 개발자는 학부모와 학생의 눈높이에 맞는 수학 교육 자료를 기획하고 개발하는 데 아이디어를 얻을 수 있으며, 교육 정책 담당자는 가정 연계 수학 교육 지원 정책 수립을 위한 기초 자료로 활용할 수 있습니다.
