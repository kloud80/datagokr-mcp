description_portal: 한국장학재단에서 제공하는 "5백만원 이상 발주계획 내역" 공공데이터는, 당해 연도에 500만원 이상의 규모로 예정된 물품, 용역, 공사에 대한 발주 정보를 구조화된 형태로 공개하고 있습니다. 본 공공데이터에는 발주예정월, 조달방식(중앙조달, 자체조달, 수의계약 등), 계약방법(일반경쟁, 제한경쟁, 직접계약 등), 품명(사업 또는 물품의 명칭), 예산금액(해당 발주 계획의 예산 금액), 발주부서(사업발주부서) 등을 항목으로 포함하고 있습니다. 본 데이터는로 월별, 부서별 예산 규모 및 조달 추이를 파악할 수 있으며, 수의계약과 경쟁입찰 현황 등의 분석이 가능합니다
