description_portal: '평택시 직업교육훈련 정보 데이터는 지역 내 구직자와 재직자의 직무역량을 강화하고, 산업 변화에 대응하는 인력을 양성하기 위해 운영되는 다양한 교육 프로그램의 현황을 체계적으로 파악하여 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 훈련 과정의 내용, 일정, 대상, 자격요건, 신청 방법 등을 손쉽게 확인할 수 있으며, 민간·연구기관은 고용동향 분석, 지역 산업수요 기반 교육과정 개발, 취업지원 서비스 구축 등 다양한 목적에 활용할 수 있습니다. 본 데이터에는 교육 과정명, 교육기간, 모집 인원, 참여대상 등의 항목이 포함되어 있어 지역 직업교육 체계를 종합적으로 이해하는 데 도움이 됩니다. 이러한 자료는 지역 일자리 정책 수립, 평생직업교육 강화, 산업 인력 공급 안정화, 민간 취업플랫폼과의 연계 등 공공·민간 영역에서 활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
