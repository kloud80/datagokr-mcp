description_portal: 이 데이터는 해양수산부 해양환경 온라인 플랫폼 서비스그룹 내 과정목록의 세부사항 제공을 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 플랫폼에 등록된 각 온라인 교육 과정의 과정명, 수강비용, 정원, 학습 시작일자, 학습 종료일자 등으로 구성되어 있습니다.   본 데이터는 해양 환경 교육과정 운영 현황을 파악하거나, 온라인 교육 과정별로 제공되는 일정 및 비용 등의 정보를 비교 분석하여 해양 환경 분야의 교육 정책 마련, 신규 교육 과정 개발, 혹은 기존 과정의 추후 개선 방향 모색 등에 활용될 수 있습니다.
