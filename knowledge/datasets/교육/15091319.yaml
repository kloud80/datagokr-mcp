description_portal: 미래 사회의 핵심 역량인 소프트웨어(SW) 및 인공지능(AI) 교육을 선도하기 위해, 한국과학창의재단은 학생들이 창의적이고 융합적인 아이디어를 마음껏 구현할 수 있는 미래형 교육 환경을 구축하고자 '창의융합형 정보교육실 모델학교' 사업을 추진하고 관련 데이터를 제공합니다.개방 데이터는 해당 사업에 선정된 전국의 모델학교 19개교의 운영 정보 목록입니다. 각 학교의 명칭과 소속 지역, 사업 수행 기간, 지원된 사업 예산, 그리고 신규 구축 또는 활용·고도화 등 사업 유형에 대한 정보를 포함하고 있습니다.교육 정책 입안자나 연구 기관은 지역별, 학교급별 미래 교육 환경 구축 현황을 파악하고 예산 투입의 효과성을 분석하는 데 데이터를 활용할 수 있습니다. 일선 학교에서는 모델학교의 사례를 벤치마킹하여 학교 공간 혁신 및 정보 교육실 구축을 위한 계획 수립 시 참고 자료로 활용할 수 있으며, 이를 통해 SW·AI 교육 인프라의 전국적 확산에 기여할 수 있습니다.
