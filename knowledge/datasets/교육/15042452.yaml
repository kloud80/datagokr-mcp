description_portal: 울산광역시 북구에 소재한 평생 교육기관에 대한 데이터 입니다.기관명, 지역, 소재분류, 소재지도로명 주소 등이 포함되어있습니다.울산광역시 북구는 주민 모두가 차별없는 교육을 받을 수 있고, 끊임없는 자기계발을 할 수 있도록 지원하기 위해 평생학습기관을 운영하고 있습니다. 이로인해 가정, 학교, 일터, 지역사회가 학습으로 이어지길 바라며 북구에서 살아가는 주민들이 맞춤형 인재로 성장할 기회를 제공하고자 합니다.제공되는 데이터를 통해 주요 생활지와 밀접한 곳에서 자유롭게 교육받을 수 있도록 도움을 주고자 개방한 데이터입니다.데이터와 관련하여 추가로 궁금하신 사항은 교육청소년과(평생교육기관 담당), 미디어정보과(공공데이터 담당)에 문의주시길 바랍니다.
