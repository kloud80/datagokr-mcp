summary_user: 대학생 청소년교육지원장학금(초중고생 멘토링을 하는 대학생에게 장학금을 주는 사업)의 교부금 운영계획을 대학별·배정연도·학기 단위로 담은 계획 집계 파일(CSV, 약 18KB)로, 참여 예상 인원·예상 근로시간·예상 국고금액·예상 대응투자금액을 전국 범위로 담는다. 교육 분석가나 대학 담당자가 '어느 대학에 이 장학사업 예산이 얼마나, 몇 명 규모로 배정 계획되었나'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학 데이터(대학 공시 등)와는 대학명 문자열을 매핑해 이어 써야 한다.
description_portal: '대학생 청소년교육지원장학금 관련 교부금 운영 계획: 상품명, 배정년도, 배정구분, 배정학기, 대학명, 근로인원수, 근로예상시간수, 예상국고금액 등의 정보를 제공데이터 제공 항목은 사업 상품명, 예산 배정 연도, 예산 배정 형태, 예산 배정학기, 대학명, 참여 예상 인원, 참여 예상 시간, 예산 신청금액, 예상 대응투자 금액이 있습니다.대학생 청소년교육지원장학금은 초중고등학생 대상으로  멘토링을 지원하고, 대학생에게는 장학금을 지원하는 것을 목적으로 합니다. 대학생 청소년교육지원장학금 관련 정보는 "한국장학재단 누리집(https://www.kosaf.go.kr) > 인재육성 > 대학생지식멘토링 > 대학생 청소년교육지원장학금"에서 확인 가능'
