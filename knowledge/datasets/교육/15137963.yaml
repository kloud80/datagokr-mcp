description_portal: '한국산업인력공단에서 제공하는 “국가기술자격시험 관련 시험재료 정보(시험재료 종목별 유형, 종목유형별 목록 등)” 공공데이터는, 자격시험 준비 및 운영에 필요한 시험재료 항목들을 종목별로 유형화하고 종류별 목록을 정리하여 시험운영의 투명성과 준비의 효율성을 높이기 위해 제공되는 자료입니다. 이 데이터에는 시험종목별로 어떤 시험재료가 요구되는지, 각 재료의 세부 유형(예: 도구, 기계장비, 소모품 등), 재료마다 필요한 규격 및 조건, 종목별 재료 목록과 사양 비교, 재료 비치 및 조달 절차, 대체 가능 재료 여부, 시험실 배치 기준이나 보관 조건, 시험 준비 시 재료 확인 체크리스트, 재료 관련 문서 및 증빙요구사항, 관리 책임 부서 및 연락처, 데이터 제공 형식(CSV/JSON 등의 기계판독 가능 형식), 데이터 갱신 주기, 이용 허락 및 라이선스 정보 등이 포함되어 있습니다. 이 정보는 응시자, 교육훈련기관, 시험감독자, 정책 입안자 등이 시험재료의 종류 및 요구사항을 숙지하여 시험 준비 및 운영을 정확히 할 수 있게 도우며, 자격시험 제도의 신뢰성과 일관성을 확보하는 데 중요한 근거자료로 활용됩니다.'
