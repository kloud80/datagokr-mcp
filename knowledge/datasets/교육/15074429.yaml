summary_user: 제주특별자치도교육청 산하 교육행정기관과 초·중·고등학교 184곳을 한 곳당 한 행으로, 일반교실·체육관·수영장·운동장 등 시설별 개방 여부와 담당자 연락처를 담은 파일 데이터다. 지역 주민이나 단체가 '우리 동네 학교 중 체육관이나 운동장을 개방하는 곳이 어디인가'를 찾을 때 쓴다. 조인 키는 주소(address)뿐이라 같은 주소 표기를 가진 학교 기본정보나 지역 시설 데이터와 주소 기준으로 이어 쓴다.
description_portal: 제주특별자치도교육청 산하 교육행정기관 및 학교(초등학교, 중학교, 고등학교)의 시설 개방 현황 정보를 제공하는 데이터입니다.데이터에서 제공하고 있는 정보는 총 15가지로 시설을 개방학교 있는 학교이름, 학교/기관 구분, 시도명, 시설을 개방하고 있는 학교 또는 기관의 주소, 담당자 연락처, 각 시설(일반교실, 시청각실, 특별교실, 체험학습장, 체육관_강당, 수영장, 운동장, 실내씨름장, 골프연습장, 기타시설)의 개방여부 입니다. 학교(기관)명에서는 시설을 개방하고 있는 학교(기관)명을 확인할 수 있으며, 학교는 학교 또는 기관으로 구분되어 있습니다. 시도명은 제주특별자치도의 행정구역에 따라 제주시와 서귀포시로 구분되어 제공됩니다. 주소에서는 각 학교(기관)의 소재지 주소를 확인할 수 있습니다.  연락처는 시설 담당자의 연락처를 확인할 수 있습니다. 그 외 각 시설의 개방여부가 표기되어 있습니다.
