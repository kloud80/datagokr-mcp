description_portal: 본 데이터는 전국 대학의 재정 및 회계 정보의 투명성과 표준화를 위해 구축된 대학재정정보시스템에서 관리하는 재정 명세서상의 계정과목 코드로, 대학의 수입·지출 및 자산·부채 분류 기준을 정립하기 위한 공공데이터입니다.주요 수록 항목으로는 계정과목 코드, 계정과목명, 관·항·목 체계 분류 정보, 계정 성격(수입/지출/자산/부채 등), 사용 여부, 적용 연도 및 계정 정의 등이 포함되어 있습니다.본 데이터를 활용하면 대학별 재정 수지 및 결산 구조를 일관된 기준으로 분석하고 투명성을 높일 수 있습니다. 또한 고등교육 재정 통계 구축, 대학 간 회계 데이터 비교 연구, 대학 재정 투명성 모니터링 시스템 구축, 교육 행정 및 정책 수립을 위한 기초 자원 등 다양한 분석 및 연구 분야에서 유용하게 활용할 수 있습니다.
