description_portal: 제주특별자치도교육청 학교통합누리집에 등록된 교외체험학습 관련 자료를 제공하는 데이터입니다. 2023~2026년 등록된 교외체험학습 데이터로 총  7개 항목으로 구성되어 있습니다. 각각 학년명, 체험목표, 체험시작일자, 체험종료일자, 장소명, 승인상태명, 등록일시로 되어 있으며 학년은 해당 체험학습을 신청한 신청자의 학년정보가, 체험목표는 체험학습 목적을 확인할 수 있습니다. 체험시작일자와 체험종료일자는 각각 교외체험활동의 시작일과 종료일을 의미합니다. 장소는 실제 교외체험활동을 하는 장소(지역)을 나타냅니다.
