summary_user: 국가자격 CBT(컴퓨터 기반 시험) 시험에 포함된 종목별로 종목명·영문명·자격 등급·사용 여부·등록일·시행 여부를 담은 전국 단위 종목 목록 파일(csv, 약 28만 바이트)이다. 수험자나 상담·분석 담당자가 '이 자격 종목의 어느 등급이 현재 CBT로 시행되고 있는가'를 확인하거나 종목명의 영문 표기를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시험 일정·합격률 등 다른 국가자격 데이터와는 종목명(및 등급) 이름 매핑으로만 이어 쓴다.
limits: 종목 코드 같은 공통 키가 없어 다른 자격 데이터와 연결할 때 종목명 표기 차이를 직접 맞춰야 한다. 시험 일정·합격률·응시자 수는 담지 않으며, 범위는 국가자격 CBT 종목에 한정된 비공간 자료다.
