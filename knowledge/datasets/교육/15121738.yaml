description_portal: 한국해양수산연수원의 선원교육과 교육예약시스템 관련 회원가입 통계를 월별로 정리한 자료로, 2012년 3월부터 2025년 7월까지의 데이터를 포함하고 있습니다. 회원유형은 일반회원과 선사회원으로 구분되며, 각각의 가입자 수가 연월 단위로 제공됩니다. 특히 최근 가입자 수를 보면 2024년 7월과 8월에는 일반회원이 각각 611명, 185명 가입했으며, 선사회원도 꾸준히 유지되고 있습니다. 본 자료는 연수원의 온라인 교육관리 플랫폼 이용 추이를 파악하는 데 유용하며, 사용자 유형별 수요 분석과 교육서비스 개선에 필요한 기초 지표로 활용될 수 있습니다.
