description_portal: 한국기술교육대학교 온라인평생교육원이 운영하는 스마트 직업훈련 플랫폼(STEP)은 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공하는 국가 직업능력 개발 플랫폼입니다. 이 플랫폼은 고용노동부의 정책 방향에 따라 직업훈련의 품질 향상과 교육 효과의 극대화를 목표로 설계되었으며, 특히 다양한 교육 과정을 체계적으로 관리하고 운영하기 위해 과목 그룹(Group of Subjects)이라는 개념을 도입하여, 교육 콘텐츠의 구조화와 역할 기반 운영을 지원하고 있습니다.과목 그룹 테이블은 STEP LMS 내에서 개설된 온라인 교육 과정들이 어떤 기관에 의해 운영되고 있으며, 해당 과정이 어떤 시스템 모듈에 속하고, 어떤 역할을 수행하는지를 명확히 기록한 데이터 구조입니다. 이 테이블은 교육 콘텐츠의 분류, 기관 간 협력 구조, 시스템 기능별 책임 분장 등을 정의하며, 플랫폼 운영의 효율성과 정책 연계성을 높이는 데 필수적인 역할을 합니다.
