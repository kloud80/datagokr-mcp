description_portal: 한국기술교육대학교 온라인평생교육원이 운영하는 스마트 직업훈련 플랫폼(STEP)은 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공하는 국가 직업능력 개발 플랫폼입니다. STEP은 고용노동부의 정책 방향에 따라 직업훈련의 품질 향상과 교육 효과의 극대화를 목표로 설계되었으며, 특히 교육 과정의 평가 체계를 정교하게 설계하여 학습자의 성취도와 역량을 다각도로 측정하고 있습니다.이러한 평가 체계의 핵심은 과목별 평가 점수 제도 카테고리 항목으로, 각 교육 과목에 대해 어떤 방식으로 학습자의 성과를 측정할 것인지에 대한 기준을 정의합니다. 평가 항목은 단순한 점수 부여를 넘어, 학습자의 이해도, 실무 적용 능력, 참여도, 협업 역량 등을 종합적으로 반영하며, 교육의 질적 수준을 확보하는 데 필수적인 요소입니다.
