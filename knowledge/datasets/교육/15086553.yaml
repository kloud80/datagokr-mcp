description_portal: 시청자미디어재단이 추진하는 다양한 지원사업 가운데, 이음 미디어교육 단체지원 사업의 수행 현황을 체계적으로 정리하여 데이터 형태로 구축한 자료입니다. 해당 사업은 미디어 취약계층을 대상으로 창의적이고 다양한 미디어교육을 제공할 수 있는 단체를 공모를 통해 선정하고 지원하는 것을 목적으로 하며, 이를 통해 미디어 접근성과 활용 역량을 높이고 격차 해소에 기여하고자 합니다. 또한 단체별 교육 운영 실적을 기록함으로써 사업의 추진 성과를 객관적으로 확인하고, 향후 정책 개선 및 사업 고도화를 위한 기초자료로 활용될 수 있도록 구성되어 있습니다.공개되는 데이터에는 단체명, 지원연도, 교육대상, 교육형태, 교육일 등 교육 운영과 관련된 주요 항목들이 포함되어 있어, 각 단체가 어떤 대상에게 어떤 방식으로 교육을 수행했는지를 구체적으로 파악할 수 있습니다. 이를 통해 연도별·대상별·프로그램별 분석이 가능하며, 종합적으로 이해하는 데에도 도움이 됩니다.해당 자료는 매년 정기적으로 공개되고 있으나, 사업이 종료될 경우에는 더 이상 현황이 갱신되거나 공개되지 않을 수 있습니다. 따라서 이용 시에는 자료의 최신성 여부를 함께 확인하는 것이 필요하며, 이러한 특성을 고려하여 데이터를 활용하는 것이 바람직합니다.
