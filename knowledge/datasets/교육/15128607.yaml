summary_user: 취업 후 상환 학자금대출을 만 45세까지 예외적으로 받을 수 있는 전문대 계약학과(채용조건형) 목록을 대출년도·대출학기·대학명·학과명·사용여부 단위로 담은 전국 범위 파일(csv)이다. 전문대 계약학과 재학생이나 진학 희망자가 '내가 다니는(지원할) 학과가 이번 학기 취업 후 상환 대출 연령 특례 대상인가'를 확인하는 데 쓴다. 대학명(univ_school_cd)이 조인 키여서 대학 공시나 다른 학자금·장학 데이터와 대학 단위로 이어 쓰며, 학과 코드는 없어 학과 단위 연결은 학과명 문자열 대조에 의존한다.
description_portal: 취업 후 상환 학자금대출은 학자금지원구간에 따라 대학(원)생에게 학자금(등록금, 생활비)을 대출해주고 취업 등 소득이 발생한 시점부터 소득수준에 따라 원리금을 상환하는 대출이며, 교육부 또는 한국장학재단과 "취업 후 상환 학자금대출에 관한 협약"을 체결한 국내 고등교육기관의 만 35세 이하 학부생 및 만 40세 이하 대학원생이 이용가능합니다. 다만, 예외적으로 학부생 중 전문대 계약학과(채용조건형)에 재학 중인 자에게 취업 후 상환 학자금대출을 만 45세까지 지원함에 따라, 해당 전문대 계약학과에 관한 정보를 제공하기 위한 데이터입니다.  취업 후 상환 학자금대출에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.
