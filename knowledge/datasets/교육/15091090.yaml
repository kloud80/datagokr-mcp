description_portal: 한국기술교육대학교 온라인평생교육원이 운영하는 스마트 직업훈련 플랫폼(STEP)은 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공하는 국가 직업능력 개발 플랫폼입니다. STEP은 고용노동부의 정책 방향에 따라 직업훈련의 품질 향상과 교육 효과의 극대화를 목표로 설계되었으며, 특히 위탁기관의 교육 운영 성과를 정량적으로 평가하기 위한 관련기관 점수 정책을 운영하고 있습니다.이 정책은 STEP 플랫폼을 활용하는 각 기관의 교육 운영 실적, 콘텐츠 활용도, 학습자 참여율 등을 다양한 기준에 따라 점수화하여, 기관별 성과를 비교·분석하고, 향후 교육 지원 정책 및 플랫폼 개선 방향을 설정하는 데 활용됩니다. 점수는 학습자의 활동 결과를 기반으로 산정되며, 각 항목은 교육의 질과 학습 몰입도를 반영할 수 있도록 설계되어 있습니다.
