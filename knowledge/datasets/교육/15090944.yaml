description_portal: STEP(Smart Training Education Platform)은 한국기술교육대학교 온라인평생교육원이 운영하는 국가 직업능력 개발 플랫폼으로, 고용노동부의 지원 아래 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공합니다. STEP은 이러닝 콘텐츠, 실시간 세미나, 학습자 관리, 평가 및 인증 기능을 통합한 스마트 학습관리시스템(LMS)을 기반으로 설계되었으며, 웹사이트를 통해 누구나 쉽게 접근하고 활용할 수 있습니다.공식 웹사이트 주소는 https://www.step.or.kr/main.do이며, 이곳에서 학습자, 기관 관리자, 콘텐츠 개발자 등 다양한 사용자가 각자의 역할에 맞는 서비스를 이용할 수 있습니다.
