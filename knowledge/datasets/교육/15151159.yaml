summary_user: 부산광역시교육청 등굣길안심e 시스템에 등록된 학교 303곳을 학교별 한 행으로 담은 건별 CSV 파일이다(학교명, 관할 교육지원청, 주소, 전화번호, 링크주소, 위도·경도, 픽토그램). 학생 안전 정책 담당자나 앱 개발자가 "우리 동네 등굣길 주변 학교는 어디에 있고 어느 교육지원청 관할인가"를 확인할 때 쓴다. 주소(address)와 위도·경도(coord)가 조인 키라서 주소나 좌표 기준으로 다른 지도·시설 데이터와 이어 쓴다.
description_portal: 데이터셋 개요부산광역시교육청에서 운영하는 등굣길안심e 시스템에 등록된 학교정보 데이터 입니다.주요 데이터 항목 설명교육지원청 정보 - 학교의 관할 교육지원청 정보를 나타냅니다.주소 - 학교의 주소 정보 입니다.전화번호 - 연락 가능한 학교 또는 담당 기관의 전화번호입니다.링크주소 - 학교 정보를 확인할 수 있는 웹사이트 URL입니다.위도 - 학교 지리적 위치를 나타내는 위도 좌표입니다.경도 - 학교 지리적 위치를 나타내는 경도 좌표입니다.픽토그램 - 지도상에서 시각적으로 표현되는 아이콘으로, 학교 등 서비스 시설의 종류를 구분하는 데 사용됩니다.활용 방안이 데이터는 학생 안전 정책 수립, 등교 경로 분석, 안심 서비스 시설 위치 파악, 모바일 앱 개발 등에 활용될 수 있습니다.
