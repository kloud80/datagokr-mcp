summary_user: 대구광역시 남구에 있는 초·중·고등학교와 전문대학·대학교 30곳을 학교 한 곳당 한 행으로 정리한 소규모 목록 파일로, 학교구분·학교명·소재지·공립/사립·전화번호·홈페이지 주소를 담는다. 남구 주민이나 이사를 앞둔 학부모가 '우리 동네 근처 공립 중학교는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 구 단위 교육시설 분포를 파악하는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 학교알리미 공시나 학구도 등 다른 데이터와는 학교명·소재지 주소로 맞춰 이어 쓴다.
