limits: 학교 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 학교명·주소를 수작업으로 맞춰야 한다. 범위는 칠곡 관할 폐교 소수로 한정되므로 경북 전체나 전국 폐교 현황은 다른 교육지원청 파일을 따로 모아야 한다.
