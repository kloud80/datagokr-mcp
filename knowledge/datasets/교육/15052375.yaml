summary_user: 서울특별시에 있는 초등학교를 학교 한 곳당 한 행으로 정리한 학교 기본정보 목록으로, 표준학교코드·학교명·영문명, 관할 교육청과 교육지원청, 도로명주소, 전화·팩스·홈페이지, 공립·사립 설립구분, 남녀공학 여부, 설립일·개교기념일을 담는다. 학부모나 분석가가 "우리 동네(자치구)에 있는 사립 초등학교는 어디이고 연락처와 주소는 무엇인가" 같은 질문에 답하거나 학교 목록 기준표를 만들 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 교원·학생·학급 통계나 학교 재정 데이터와는 표준학교코드(STD_SCHL_CD)나 학교명을 맞춰 보거나 같은 기관 코드로만 이어 붙인다.
description_portal: 서울시 초등학교 기본정보 데이터는 서울특별시에 위치한 초등학교들의 행정·위치·연락·설립 정보를 체계적으로 정리한 공공데이터입니다. 이 데이터는 각 학교를 고유하게 식별하기 위한 표준학교코드와 학교명, 영문학교명 등 기본 식별 정보를 포함하고 있습니다. 또한 시도교육청코드와 시도교육청명을 통해 해당 학교가 어느 시도교육청 관할인지 알 수 있으며, 관할조직명을 통해 더 세부적인 교육지원청 또는 행정 조직 정보를 확인할 수 있도록 구성되어 있습니다. 도로명우편번호, 도로명주소, 도로명상세주소 항목은 학교의 위치를 정확히 파악할 수 있게 해 주며, 전화번호와 팩스번호, 홈페이지주소는 학교와의 직접적인 소통 및 정보 확인을 위한 연락 수단을 제공합니다. 설립구분 항목은 공립, 사립 등 설립 유형을 구분하여 학교의 운영 주체 특성을 파악할 수 있게 합니다. 남녀공학구분명은 남학교, 여학교, 남녀공학 여부를 나타내며, 학교종류명과 소재지명은 학교의 유형과 위치한 행정구역 정보를 제공합니다.
