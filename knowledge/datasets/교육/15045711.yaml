description_portal: 본 자료는 광주광역시 관내의 자치구별 및 시설유형별 평생학습기관 운영 현황을 담은 통계 데이터입니다. 광주광역시 5개 자치구(동구, 서구, 남구, 북구, 광산구) 전역에 분포한 다양한 평생교육 시설의 현황을 한눈에 파악할 수 있도록 체계적으로 구성되었습니다. 이 자료는 지역 주민의 교육 접근성을 높이고, 자치구별 교육 인프라의 균형적인 발전 상태를 분석하여 시민 누구나 언제 어디서든 원하는 학습에 참여할 수 있는 지속 가능한 평생학습도시 환경을 조성하는 등 향후 맞춤형 교육 정책을 수립하는 데 유용한 기초 자료로 활용될 수 있습니다.
