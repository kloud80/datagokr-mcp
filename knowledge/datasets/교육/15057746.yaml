summary_user: 경기도 중학교 졸업생의 진로를 기준년도·학교별로 담은 자료로, 남녀 졸업자 수와 일반고·특성화고·과학고·외고/국제고·자율형고 등 고교 유형별 진학자 수·비율, 취업자와 미진학자 수·비율을 함께 담는다. 교육 분석가나 학부모가 '우리 시군 중학교 졸업생은 특성화고나 특목고로 얼마나 진학하고, 미진학 비율은 해마다 어떻게 바뀌는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 학교 기본정보나 교원·학생 통계와는 학교명·시군명 매핑이나 같은 기관(경기도) 코드로 이어 붙여야 하며, 정보공시 학교코드 필드(INFO_PBLNTF_SCHOOL_CD)의 표준 학교코드 대응 여부는 확인되지 않았다.
description_portal: 이 데이터는 경기도 내 중학교 졸업생의 진로 현황을 기록한 자료로, 졸업생들이 고등학교 유형별로 진학하거나 다른 경로를 선택한 결과를 보여줍니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 학교급명, 설립구분, 졸업자 수(남·여), 일반고·특성화고·특수목적고, 자율형고, 기타 진학 현황 및 진학 비율이 포함됩니다. 또한 진학 외 경로로는 취업자 수 및 비율, 미진학자 수와 비율이 포함되어 있어, 졸업생 전체의 진로 선택 분포를 확인할 수 있습니다. 이 데이터는 중학교 졸업생의 고등학교 진학 구조 분석, 지역별·학교별 진로 선택 차이 파악, 진학률 및 미진학률 변동 추이 분석, 교육 정책 및 학생 진로지도 자료로 활용될 수 있습니다.
