description_portal: '사회리더 대학생 멘토링은 대기업 CEO와 석학, 사회 각 분야의 리더 등 다양한 성공경험과 전문지식을 겸비한 사회지도층 멘토의 지혜를 대학생 멘티에게 전달하여리더십과 섬김 정신을 함양한"미래 대한민국을 이끄는 배움과 나눔의 인재" 육성하는 한국장학재단 인재육성프로그램으로, 사회리더 대학생 멘토링의 멘티, 성별, 전문분과, 활동지역, 현황정보를 제공하고 있습니다.<한국장학재단 사회리더멘토링 사업 주요내용>  ㅇ 멘티: 전국 대학(원)생 재학생, 휴학생 ㅇ 성별: 남여 모두 참여가능 ㅇ 전문분과  -  공통: 인성, 리더십 자기개발,진로탐색, 취업창업  -  전문: 경영관리, 과학기술/IT/연구, 사회행정서비스, 금융, 창업/사회혁신, 보건의로, 영업/마케팅, 문화예술콘텐츠,교육 ㅇ 활동지역: 전국 ㅇ 주요내용 -  멘토 모집은(12월 중), 멘티 모집은(1월 말~2월 중순)  - 멘토링: 멘토의 기획에 따른 자율적 운영  - 특별활동: 팀별 야외활동, 문화체험, 기업탐방 등 특별활동 수행  - 봉사활동: 연간 8시간 이상 봉사활동 수행 ※ 상세 정보는 한국장학재단 홈페이지 참고(메뉴: 인재육성>사회리더 대학생 멘토링)'
