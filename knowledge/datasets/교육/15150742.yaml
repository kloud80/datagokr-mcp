description_portal: 세종특별자치시교육청 학교통합 누리집에서는 시설 이용에 따른 요금 체계(공통요금표)를 등록·관리하고 있으며, 구성항목은 다음과 같습니다.- 시설 공통요금 일련번호(FEE_CMMN_SN)- 시설 유형(FCLT_TY)- 예약 유형(RSVT_TY)- 시간블록별 요금/2번째(TM_BLCK2)- 시간블록별 요금/4번째(TM_BLCK4)- 추가/연장/예외 시간 요금(TM_BLCK_EX)- 장기 예약 블록 요금(LONG_TM_BLCK1)- 등록일자(INST_DT)- 수정일자(UPDT_DT)누리집 시설 공통요금 관리는 학교·기관이 보유한 시설(강당(체육관), 강의실, 운동장 등)의 이용 요금을 표준화하여 관리하는 모듈로, “공통요금”이라는 이름처럼 개별 예약 건마다 요금을 따로 입력하지 않고, 시설별/시간대별/대상별로 미리 정해진 요금표를 관리함으로써 다음과 같은 기능을 하고 있습니다.① 시설 사용료 체계화 → 사용자가 요금을 쉽게 확인 가능② 투명성 확보 → 기관 규정에 따른 요금이 누리집에 공지됨③ 예약·대관 관리 연계 → 예약관리 모듈에서 자동으로 요금 불러오기 가능④ 효율적 운영 → 요금 변경 시 공통요금표만 수정하면 전체 적용예약 유형은 A와 B로 나누며, 예약 유형 A는 지역주민의 복지증진·생활체육활동에 사용할 때이고, 예약 유형 B는 공인기관의 어학시험, 자격시험 등 고사장 제공 및 기업체 등의 체육행사, 직능단체 활동에 사용할 때에 해당합니다.
