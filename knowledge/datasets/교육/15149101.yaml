description_portal: 한국언론진흥재단에서 운영하는 eNIE 시스템에서 2020년도 까지 사용한 교안의 주제 입니다.이 교안들은 초등학교, 중학교, 고등학교 각 교육과정별로 학생들의 발달 단계와 학습 능력을 고려하여 체계적으로 개발되었으며, 실제 교육 현장에서 전문 강사들이 직접 활용했던 검증된 실무 교육 자료들입니다.각 교안은 미디어리터러시 교육의 핵심 목표인 비판적 사고력 향상, 정보 분석 능력 개발, 그리고 창의적 표현력 증진을 위해 다양한 교육 방법론과 실습 활동을 포함하고 있습니다.현재는 사용 중이지 않지만 그 당시 어떤 주제를 활용한 eNIE 교육이 있었는지 판단할 수 있는 근거가 될 수 있습니다.
