summary_user: 사립대학별·조사연도별로 교비회계 교육비(보수·관리운영비·도서구입비·기계기구매입비·연구학생경비)와 산학협력단회계 교육비, 등록금수입, 그리고 등록금 대비 교육비 비율인 교육비 환원율을 담은 전국 단위 집계 파일(xlsx)이다. 수험생·학부모나 고등교육 정책 분석가가 "이 대학은 학생이 낸 등록금보다 교육에 얼마나 더 쓰는가"를 대학 간·연도 간으로 비교할 때 쓴다. 전역 조인 키가 없어 대학알리미·대학재정 공시의 다른 자료와는 학교명과 조사연도를 맞춰 이어 쓴다.
description_portal: 사립대학 교육비 환원율 재정정보 테이블입니다. 교육비 환원율이란 학생이 납부한 납입금이 학생 교육을 위하여 투자되는 비율을 의미합니다.교비회계 교육비는 보수, 관리운영비, 도서구입비, 기계기구매입비, 연구학생경비(입시관리비 제외)의 합계로 이루어지며, 산학협력단 교육비는 산학협력비, 지원금사업비, 간접비사업비, 일반관리비, 기계기구취득비의 합계로 이루어져있습니다.교비회계 교육비와 산학협력단 교육비를 합산한 값이 최종 교육비로 산출되며, 등록금수입 대비 교육비를 통해 교육비 환원율이 산출됩니다.공공데이터 형태로 제공되므로, 대학 재정 관리 연구, 고등교육 관련 정책 결정, 민간 분석 및 시각화 등 다양한 목적에 활용될 수 있습니다.
