description_portal: 전라남도교육청 홈페이지는 전남교육의 최신정보를 제공하고 이용자들에게 다양한 교육 콘텐츠를 제공하기 위하여 구축되어 운영 중에 있습니다. 해당 데이터 정보는 전라남도교육청 홈페이지 시스템의 동영상자막 정보입니다. 동영상자막은 전라남도교육청 홈페이지에 업로드되어 있는 동영상을 간단하게 설명하거나 삽입되어 있는 자막 내용입니다. 해당 정보는 홈페이지 관리 운영자가 원활하게 홈페이지 운영을 위하여 관리하는 누적되어 있는 정보입니다. 동영상에 따라 자막이 없는 경우가 다수 있기 때문에 정확한 설명이 없을 수 있습니다. 해당 정보는  동영상 시리얼넘버, 자막내용, 생성일자, 수정일자 등이 포함되어 있습니다.
