description_portal: 중소벤처기업진흥공단에서 운영하는 중소기업 계약학과 사업은, 대학과의 협약을 통해 기업이 필요로 하는 학위과정(전문학사부터 박사까지)를 개설하여 중소, 중견기업 근로자(취업예정자) 학위취득을 지원하는 사업입니다. 학교는 기업에 현장 맞춤형 직무교육을 제공하고 기업은 필요한 직무교육 프로그램(학과)를 선택하여 교육을 받음으로써 재직자 지원을 통해 현장기술 인력의 장기재직을 유도합니다.이와 같이 중소기업 계약학과 사업에 참여하는 중소, 중견기업의 기업명, 참여대학, 학과, 학위 등의 정보입니다.
