summary_user: 전국 어린이 교통안전 체험시설(어린이교통공원)을 공원 한 곳당 한 행으로 담은 소규모 CSV 목록(약 2KB)이며, 관할지역·공원명·주소·공원면적·운영주체·전화번호를 담는다. 학부모나 교사가 우리 지역에서 가까운 어린이교통공원이 어디이고 누가 운영하는지 찾거나, 분석가가 시도별 시설 분포 격차를 볼 때 쓴다. 전역 조인 키나 코드표는 없어 주소를 지오코딩해 지도·사고 통계와 겹치거나 관할지역 이름으로 다른 지역 자료와 맞춰 써야 한다.
description_portal: 본 데이터는 한국도로교통공단이 제공하는 어린이 교통안전 체험시설의 위치 현황을 집계한 자료이다. 시설명, 소재지 주소, 운영주체, 연락처, 면적 등 핵심 항목을 포함한 CSV이다. 지역(시도·시군구)별 분포 파악과 지도 연계를 전제로 구성되어 시설 접근성 비교와 인프라 격차 진단에 유용하다. 행정 분야에서는 거점 관리, 안내 고도화, 점검·유지보수 계획, 민원 응대의 근거로 활용한다. 교육·연구 분야에서는 체험학습 경로 설계, 교육 수요 예측, 주변 교통사고 위험도와의 연계 분석에 적용할 수 있다. 또한 메타데이터를 통해 제공 항목과 기준일을 확인할 수 있어 품질 검증과 재활용이 용이하다. 공공데이터포털을 통해 내려받을 수 있다.
