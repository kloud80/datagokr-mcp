description_portal: 세종특별자치시교육청교육원 조직도정보로, 구성항목은 다음과 같습니다.- 조직 고유 식별번호(CMS_ORG_NO)- 부서명(CMS_ORG_DEPT)- 팀/하위조직명(CMS_ORG_TEAM)- 최상위 조직/기관(CMS_ORG_ROOT)- 조직도 계층(CMS_ORG_DEPTH)- 조직 구분(CMS_ORG_STEP)- 조직도 공개여부(CMS_ORG_VISIBLE)- 직위/직책명(CMS_ORG_POSITION)- 직급(CMS_ORG_GRADE)- 연락처(CMS_ORG_TEL)- 업무/역할(CMS_ORG_CONTENT)- 등록일자(CMS_ORG_REGDATE)조직도정보는 CMS(콘텐츠 관리 시스템)에서 기관의 조직 체계를 계층구조로 관리하고, 홈페이지 화면에서 트리 형태로 보여주기 위한 데이터를 의미하며, "최상위조직(Root) → 부서(Dept) → 팀(Team) → 담당자(User)" 구조로 이루어집니다.1) 루트 조직(CMS_ORG_ROOT)최상위 기관/조직으로, 조직도의 출발점 (세종특별자치시교육청)2) 부서 정보(CMS_ORG_DEPT)본부/처/부 같은 중간 조직으로, 상위 조직과 연결하여 트리 구조 표현 (세종특별자치시교육청교육원)3) 팀 정보(CMS_ORG_TEAM)부서 하위의 세부 단위(팀, 파트 등)으로, 부서와 1:N 관계 (행정지원부, 교육연수부, 유아교육부 등)4) 담당자 정보(CMS_ORG_USER)이름, 직위, 직급, 연락처, 업무(역할) 등 소속 부서/팀에 연결부서/팀 클릭 시 소개 페이지에서 ORG_CONTENT(업무, 역할 등), 담당자 정보(직위+직급+연락처)를 함께 제공하며, ORG_VISIBLE 값을 활용해 내부적으로만 관리할 수도 있습니다.이러한 조직도정보는 세종특별자치시교육청교육원의 부서 체계, 역할, 담당자 정보를 시각적으로 표현하여 이용자가 신속하고 정확하게 원하는 부서나 담당자를 찾을 수 있도록 돕고, 기관 차원에서는 대국민서비스 품질 향상 및 투명성 강화, 구성원에게는 부서 간 협력과
