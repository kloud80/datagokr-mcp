summary_user: 경기도 내 학교별로 기준년도마다 장학금 수혜 학생 수와 금액, 학비 지원 인원·금액, 그 합계를 담은 학교 단위 집계 자료로, 시군·지역교육청·학교급·설립구분 정보가 함께 붙는다. 교육복지 분석가나 정책 담당자가 "경기도 어느 시군·학교급에서 학생 1인당 장학금 지원이 적은가" 같은 지역·학교 간 격차 질문에 쓴다. 실측에서 전역 조인 키는 확인되지 않아 학교명·시군명 매핑이나 같은 기관(경기도) 코드로만 다른 학교 기본정보·재정 자료와 연결하며, 학교 단위로 붙일 때는 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)를 이 매핑의 후보로 검토한다.
description_portal: 이 데이터는 경기도 내 학교에서 지급된 장학금 수혜 현황을 기록한 자료로, 학생들의 학자금 지원 및 교육 복지 수준을 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 학교급명, 설립구분명, 장학금 수혜 학생 수 및 비율, 장학금 금액 등이 포함됩니다. 학생 수혜 규모 및 지원 비율을 통해 지역·학교 간 격차를 확인할 수 있습니다. 이 데이터는 교육재정의 형평성 분석, 저소득층 학생 지원정책 수립, 장학금 제도 개선, 교육복지 향상 정책 마련 등 다양한 연구와 행정적 활용에 적합합니다.
