description_portal: 제주특별자치도 내 국제학교 정보를 제공하는 데이터입니다.  제공항목은 총 11가지로 학교명, 학교명(영어), 학교유형, 학교주소, 학교운영법인, 개교일, 개설과정, 교수언어, 학교홈페이지주소, 대표전화번호, 전자우편 입니다. 학교명, 학교명(영어), 학교유형, 학교주소에서는 국제학교의 기본정보를 제공하고 있으며, 그 외 학교운영법인과 개교일, 학교홈페이지 주소, 전화번호, 전자우편주소를 확인할 수 있습니다. 개설과정은 유치원, 초등학교, 중학교, 고등학교 과정을 나타냅니다.자세한 내용은 제주특별자치도교육청 누리집(www.jje.go.kr)의 학교교육 내 학교교육 > 제주국제학교에서 확인할 수 있습니다.
