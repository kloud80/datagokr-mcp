summary_user: 제주특별자치도 내 국제학교를 학교 한 곳당 한 행으로 담은 소규모 목록 파일(CSV 약 1.4KB)로, 학교명(국문·외국어), 학교유형, 주소, 운영법인, 개교일, 개설과정(유치원~고등학교), 교수언어, 홈페이지·전화·전자우편을 담는다. 제주 국제학교 진학을 알아보는 학부모나 교육 분석가가 '제주에 어떤 국제학교가 있고 각 학교가 어느 과정까지 어떤 언어로 가르치는가'를 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·통계와는 학교명이나 주소를 맞춰 붙여야 한다.
limits: 학교코드 등 공통 키가 없어 교원·학생 통계나 재정 데이터와 자동으로 연결되지 않고 학교명·주소 매칭이 필요하다. 범위는 제주특별자치도 한 곳뿐이라 다른 시도의 국제학교·외국교육기관은 담지 않는다.
