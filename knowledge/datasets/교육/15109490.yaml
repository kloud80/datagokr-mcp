summary_user: 대전광역시 유치원 268곳을 한 곳당 한 행으로 담은 건별 원천 목록으로, 유치원명·시군구·소재지 주소·우편번호·전화·팩스 번호를 담는다. 학부모가 "우리 동네(구)에 있는 유치원은 어디이고 연락처는 무엇인가"를 확인하거나, 분석가가 유치원 분포를 젊은 가구 주거 수요의 선행 지표로 보는 데 쓴다. 전역 조인 키가 없어 유치원알리미 등 다른 유치원 데이터와는 유치원명·주소 매칭으로 잇고, 어린이집 정보와 짝지어 영유아 시설 분포를 함께 본다.
limits: 실측 컬럼에 공통 기관 코드가 없어 다른 데이터와 붙이려면 이름·주소 매핑이 필요하다. 실측 필드는 이름·주소·연락처 중심이라 포털 설명에 적힌 인가정원·원아수·학급수 같은 규모 정보는 이 API에서 확인되지 않는다. 개발계정은 하루 10,000회로 호출이 제한된다.
