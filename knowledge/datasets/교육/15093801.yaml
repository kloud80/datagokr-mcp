description_portal: 미래 사회가 요구하는 창의·융합형 인재 양성을 위해 학교 밖 다양한 체험 활동의 중요성이 강조되고 있습니다. 이에 한국과학창의재단은 창의체험자원 온라인 플랫폼 '크레존(Crezone)'을 통해 전국의 다양한 체험 자원을 발굴하고 정보를 제공함으로써, 학생들의 창의적인 체험활동을 지원하고 있습니다.개방 데이터는 '크레존'에 등록된 전국의 창의체험자원 182개소의 목록입니다. 데이터는 '지역', '분류', '시설명', '주소', '연락처' 등의 항목으로 구성되어 있습니다. 특히 자원의 속성에 따라 '체험시설', '전시/공연시설', '문화재/역사', '관공서', '연구시설' 등 7개의 카테고리로 분류되어 있어 사용자가 원하는 조건의 체험자원을 쉽게 검색하고 찾아볼 수 있습니다.일선 학교의 교사 및 학부모는 본 데이터를 활용하여 지역 및 시설 유형에 따른 현장 체험학습 계획을 수립하는 데 도움을 받을 수 있습니다. 또한, 교육 분야 연구자들은 지역별·분야별 체험자원의 분포 현황을 분석하여 교육 인프라의 균형적 발전을 위한 정책 연구의 기초 자료로 활용할 수 있습니다.
