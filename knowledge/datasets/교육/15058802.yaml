summary_user: 경기도 내 중학교를 학교 한 곳씩 담은 목록으로, 시군명·시군코드, 설립구분(국립·공립·사립), 학교명, 전화번호, 도로명·지번 주소, 우편번호, WGS84 위경도를 담는다. 학부모나 분석가가 "우리 시군에 공립·사립 중학교가 몇 곳이고 어디에 있나"를 확인하거나, 생활권별 교육시설 배치를 지도로 볼 때 쓴다. 전역 조인 키(표준 학교코드 등)는 없어 다른 학교 통계·재정 데이터와는 학교명·주소 매칭이나 시군코드(SIGUN_CD)로만 잇고, 좌표로 학구도·인구 등 공간 데이터와 겹쳐 쓴다.
description_portal: 「중학교현황」 데이터는 경기도 내 시군별 중학교에 대한 현황을 제공하는 자료입니다. 주요 항목에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 학교구분명(SCHOOL_DIV_NM), 설립구분명(FOUND_DIV_NM), 시설명(FACLT_NM), 전화번호(TELNO), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), WGS84위도(REFINE_WGS84_LAT) 및 WGS84경도(REFINE_WGS84_LOGT)가 포함되어 있습니다. 이를 통해 각 중학교의 위치 정보, 설립 형태(국립·공립·사립), 행정구역별 분포와 기본 연락처를 확인할 수 있습니다. 데이터는 교육행정 기초자료, 학령인구 분석, 교육정책 수립, 생활권 기반 교육시설 배치 연구 등에 활용 가치가 높으며, Open API(https://openapi.gg.go.kr/MskulM)를 통해 특정 시군코드를 조건으로 검색할 수 있습니다. 해당 자료는 교육취업 분야 데이터로 상업적 활용과 가공이 허용되어, 공공정책 연구뿐 아니라 민간 서비스 개발에도 폭넓게 적용될 수 있습니다.
