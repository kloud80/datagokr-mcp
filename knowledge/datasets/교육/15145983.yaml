description_portal: '금천구 관내 유치원 수업일수 현황을 데이터로 공개하고 있습니다.이 자료에는 관할 교육청, 유치원명, 유치원 유형(공립·사립, 법인·사인·단설·병설 등), 아동 연령별(3세, 4세, 5세, 혼합연령) 수업일수, 특수학급 수업일수, 방과후과정 수업일수, 유치원 주소와 같은 정보가 담겨 있습니다.이 데이터를 통해 유치원별 학년·연령별 수업일수와 프로그램 운영 현황을 확인하실 수 있습니다. 아울러 이를 바탕으로 자녀의 학습 계획을 세우거나, 방과후과정 운영 여부 및 기간을 비교하실 수 있으며, 교육 과정 연구와 정책 수립에도 유용하게 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술연구원)'
