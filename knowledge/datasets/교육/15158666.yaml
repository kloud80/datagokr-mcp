summary_user: 전국 대학의 개설 학과를 한 행씩 담은 건별 데이터로, 학교·단과대학·학과명과 학위과정, 주야 구분, 수업연한, 학과 상태, 입학정원·졸업자 수, 계열 분류, 관련 직업, 소재 시도·시군구를 연도별로 제공한다. 수험생·학부모가 "이 지역에서 특정 계열 학과를 개설한 대학과 입학정원은?"을 확인하거나, 분석가가 시군구별 학과 개설·정원 분포를 비교하는 데 쓴다. 전역 공통 조인 키는 없어 학교명이나 시도·시군구 코드, 표준분류계열코드·학과코드(7대계열)로 다른 대학 공시·지역 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 표준데이터셋으로 제공하는 ‘한국대학교육협의회_대학별 학과정보’를 API로 제공하며, 대학별 개설 학과에 대한 기본 정보와 함께 학과특성, 수업연한, 학위과정(학사·석사·박사 등), 교육목표, 개설 여부, 계열 및 전공 구분, 입학정원 등 다양한 세부 항목을 포함하여 조회할 수 있도록 구성. 또한 최신 데이터를 기반으로 지속적인 업데이트를 지원하여 정보의 정확성과 신뢰성을 확보하고, 진로 탐색, 대학 및 학과 비교 분석, 교육 관련 서비스 개발, 정책 수립을 위한 기초자료 활용, 통계 분석 등 다양한 목적에 활용이 가능하도록 제공하며, 사용자 친화적인 구조로 설계되어 누구나 손쉽게 접근하고 활용할 수 있도록 지원.
team:
