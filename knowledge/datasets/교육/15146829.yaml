summary_user: 전북특별자치도 내 학교 체육시설의 개방 여부, 미개방 사유, 예금주, 지도상 이름과 위도·경도를 시설 단위로 담은 파일 데이터이며, 검증 시 771행 전체가 수신됐다. 지역주민이나 학교 구성원이 우리 동네 학교 체육시설이 개방되어 있는지, 안 열린다면 이유가 무엇인지 확인하는 질문에 쓴다. 지도위도·지도경도 좌표를 키로 다른 좌표 기반 학교·교육시설 데이터와 이어 쓰며, 학교 코드 같은 별도 식별 키는 필드에 없다.
description_portal: '"전북특별자치도교육청_교수학습도움센터_학교체육시설 예약기본정보" 데이터는 전북특별자치도 내 각급 학교에서 운영하는 시설(체육시설 포함)의 예약 현황과 관련 정보를 제공하는 공공데이터입니다. 이 데이터에는 시설 개방여부, 예금주, 지도위치명, 지도위도, 지도경도 등의 예약과 관련된 기본 정보가 포함되어 있습니다.데이터는 학기별 또는 월별로 정기적으로 갱신되며, 예약 현황에 변동이 있을 경우 수시로 업데이트됩니다.이 데이터는 학교 구성원과 지역주민이 체육시설 이용 가능 여부를 쉽게 파악하고, 시설 예약 및 활용 계획을 효율적으로 세우는 데 활용됩니다. 또한, 교육청과 학교는 체육시설의 이용률 분석, 시설 운영 개선, 지역사회와의 협력 프로그램 기획 등 다양한 행정 및 정책 수립에 참고자료로 활용할 수 있습니다. 나아가, 체육행사나 지역 커뮤니티 활동 등에서 시설 활용도를 높이는 데에도 중요한 역할을 합니다.이 데이터는 학교 체육시설의 개방성과 효율적 운영, 지역사회와의 연계를 지원하는 핵심 공공정보입니다.'
