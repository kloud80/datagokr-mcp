description_portal: '2023년도 범정부 온종일 돌봄 수요조사에 따르면 학생들은 초등돌봄교실, 다함께돌봄센터, 지역아동센터 등 다양한 돌봄 서비스 유형을 희망하는 것으로 나타났습니다. 신입생은 초등돌봄교실에 94%가 희망을 나타냈으며, 학년에 따라 희망 비율은 점차 감소하는 경향을 보였습니다. 재학생의 경우에도 초등돌봄교실을 포함한 여러 돌봄 서비스 이용 희망 비율이 집계되었으며, 학년별로는 1학년 91.6%, 2학년 87.7%, 3학년 77%, 4학년 64.4%, 5학년 52.7%의 희망 응답률을 보였습니다. 이 조사는 중복 응답이 가능하며 학교돌봄터와 청소년방과후아카데미 등 다양한 돌봄기관에 대한 선호도도 함께 조사되어 학생 돌봄 수요를 파악하는데 중요한 자료로 활용될 전망입니다.‘2023년도 범정부 온종일 돌봄 수요조사’를 실시한 결과 <학년별 희망하는 돌봄서비스 유형>에 대한 응답 비율- 학년별, 학생별 초등돌봄교실, 다함께돌봄센터, 청소년방과후아카데미, 지역아동센터, 기타에 희망하는 돌봄서비스에 대한 응답 비율- 중복응답-2023년도 범정부 온종일 돌봄 수요조사 기간 : 2022.9.13.~10.31.'
