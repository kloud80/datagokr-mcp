description_portal: 한국장학재단의 재무상태표는 매 회계연도 종료일인 12월 31일을 기준으로 작성됩니다. 이 재무제표는 당해연도의 데이터를 기준으로 한 ‘당기’와 전년도 데이터를 기준으로 한 ‘전기’의 수치를 함께 제시함으로써, 재무 상태의 변동과 추이를 비교하고 분석할 수 있도록 정보를 제공합니다. 자산은 재단이 소유한 모든 경제적 자원을 의미하며, 부채는 타인에게 상환해야 할 채무를, 자본은 자산에서 부채를 차감한 순자산을 나타냅니다. 재무상태표는 재단의 건전성과 지속 가능성을 판단하는 자료로 활용할 수 있습니다.
