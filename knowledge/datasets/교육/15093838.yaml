description_portal: '중소벤처기업진흥공단(KOSME)에서 제공하는 연수원홈페이지 지역별 기업고객 현황입니다.해당 데이터가 보유한 컬럼은 아래와 같습니다.컬럼명 : 구분, 등록건수2020년 기준 연수원 홈페이지에 등록된 지역별 기업고객 현황입니다.경기도, 경상남도, 경상북도, 전라남도, 전라북도, 충청북도, 서울특별시, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 세종특별시에 위치한 기업고객 현황입니다.본 데이터를 통해 지역별 기업고객 분포와 이용현황을 파악하는데 활용할 수 있습니다.또한, 지역균형발전 관점에서 연수원 이용 격차를 진단할 수 있습니다.'
