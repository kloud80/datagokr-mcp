summary_user: 학자금대출 제한대학으로 선정된 대학별로 대출년도와 상품 유형(취업 후 상환·일반 상환의 등록금·생활비·어학연수비 등)마다 대출 가능 비율을 담은 전국 범위의 소규모 CSV 파일(약 3KB)이다. 신입생·편입생이나 학부모가 '지원하려는 대학이 대출 제한 대상인지, 등록금 대출을 몇 퍼센트까지 받을 수 있는지'를 확인하거나, 분석가가 연도별 제한대학 현황을 살펴보는 데 쓴다. 전역 조인 키가 없어 대학 공시 등 다른 대학 데이터와는 대학명 문자열 매칭으로만 이어 쓴다.
description_portal: 한국장학재단 설립 등에 관한 법률 제49조의3 제2항 및 같은 법 시행령 제21조의5 제2항에 따라 매년 학자금대출 제한 적용을 받는 대학이 선정됩니다. 해당 데이터는 학자금대출 제한대학의 상품 유형별* 대출 가능 비율에 대한 자료입니다.* 취업 후 상환 학자금대출(등록금, 생활비), 일반 상환 학자금대출(등록금, 생활비, WEST어학연수비) ※ 학자금대출 제한은 신(편)입생 입학연도와 학생이 신청한 대출상품 등에 따라 달리 적용될 수 있음학자금대출 상품에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.
