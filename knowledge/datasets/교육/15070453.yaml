summary_user: 학자금 지원구간별로 해당 연도의 소득인정액 하한(최소소득인정금액)과 상한(최대소득인정금액)을 원 단위로 담은 전국 단위 집계 경곗값 표이며, 파일 크기는 약 1.9KB(csv)로 작다. 학생·학부모가 우리 가구의 월 소득인정액이 올해 몇 구간에 해당해 국가장학금·학자금대출 지원 대상이 되는지 가늠하거나, 분석가가 연도별 구간 경곗값 변화를 비교하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없고, 연도와 지원구간 번호를 기준으로 같은 기관의 장학금·학자금대출 자료와 맞대어 쓴다.
description_portal: '학자금 지원구간 소득인정액 경곗값 정보입니다.학자금지원구간에 대해 자세한 정보는 "한국장학재단 누리집(www.kosaf.go.kr) > 장학금 > 학자금지원구간"을 확인해주시기 바랍니다.(기존 "소득분위", "소득구간" 등의 용어가 "학자금 지원구간"으로 변경되었습니다.)* 학자금 지원구간: 매년 보건복지부에서 발표하는 기준중위소득과 연계하여 산정된 학자금 지원구간 경곗값에 따라 지원구간을 결정함* 경곗값: 보건복지부 장관이 국토교통부, 교육부, 기획재정부 등 관계부처와 민간위원들로 구성된 중앙생활보장위원회 심의 , 의결을 거쳐 고시하는 국민 가구소득의 중위값* 학자금지원구간 경곗값은 연단위로 산정하고, 가족수에 영향을 받지 않아 기 제공했던 "학기" 및 "가족수" 항목(컬럼)은 제공 정보에서 제외함'
