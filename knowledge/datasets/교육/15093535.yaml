description_portal: 한국과학창의재단은 '수학, 다함께 즐겁게 이야기하자'는 취지의 '수다학(수다學)' 콘텐츠를 통해 학생들이 수학 학습과정에서 겪는 다양한 고민에 대한 맞춤형 해결책을 영상으로 제공하고 있습니다. 이는 수학에 대한 부정적인 인식을 개선하고, 자기주도적 학습 능력을 신장시키기 위한 노력의 일환입니다.개방 데이터는 2015년부터 2021년까지 제작된 '수다학' 영상 콘텐츠 219건의 목록입니다. '쓰면서 공부하기 싫어하는 아이', '어려운 문제는 풀기 싫은 아이' 등 구체적인 수학 고민 사례를 주제로, 각 영상의 제목, 내용 요약, 유튜브 링크(출처), 조회수, 작성일 정보를 포함하고 있습니다.학부모와 교사는 자녀 및 학생이 겪는 수학 학습의 어려움에 대한 구체적인 해결 방안과 지도 조언을 얻을 수 있습니다. 학생들은 자신의 고민과 비슷한 사례를 찾아보며 학습 동기를 부여받고 올바른 공부 습관을 형성하는 데 도움을 받을 수 있으며, 교육 연구자들은 시대별, 학년별 주요 수학 고민 유형을 분석하는 자료로 활용할 수 있습니다.
