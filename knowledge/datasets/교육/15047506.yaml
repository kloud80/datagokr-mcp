description_portal: 특수학교의 학교기업 운영 현황 자료에서는 학교별 개관연도, 공립 및 사립 구분, 장애유형, 그리고 다양한 사업 직종이 상세히 제공된다. 특히 커피바리스타, 도자기, 천연비누, 세탁, 제과제빵 등 다양한 진로직업 체험이 중점적으로 운영되고 있다. 이는 장애 학생들의 사회 진출과 직업 역량 강화를 지원하기 위한 특수학교의 중요한 교육 프로그램으로, 매년 갱신되는 자료를 통해 전국 학교들의 운영 실태를 파악할 수 있다. 해당 자료는 부분적으로 미리보기가 제공되며, 자세한 내용은 별도로 다운로드 받아 확인할 수 있다.특수학교 기업 현황으로 학교명, 개관연도, 장애유형, 사업직종,소속교육청,지정유형 등을 포함합니다. 매년 자료를 갱신합니다.
