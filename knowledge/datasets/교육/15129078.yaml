description_portal: 한국장학재단의 연간 수입과 지출에 대한 예산(안)(연도별 개방 데이터이며 당초 예산을 기준으로 작성함). 정부출연금, 정부보조금, 차입금, 융자원리금회수, 기타사업수입, 전기이월 등을 통해 연간 예산을 마련하고 있으며, 예산의 재원에 따라 수입 및 지출 내역(사업비, 재단운영비, 예비비, 차기이월 등)을 구분하여 관리하고 있음. 일반회계는 정부출연금 등을 수입으로 하는 학자금대출, 장학업무 수행에 해당하며, 특별회계는 기부금 등의 재원으로 수행하는 사업 회계에 해당함. 수탁회계의 경우 정부,지자체 등으로 위탁받은 사업을 운영하는 데에 해당함. 연중 정부정책의 변화, 신규사업 유치 등에 따라 예산 변동 가능.
