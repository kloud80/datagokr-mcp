description_portal: 광주광역시 관내 각 구청, 주민센터, 행정복지센터 등에서 운영 중인 시민정보화 교육장의 위치, 좌석 수, 연락처를 수록한 현황 자료입니다. 교육장 명칭, 주소, 수용 가능한 좌석 수, 교육 운영 담당자의 연락처 등의 정보를 포함하며, 시민들의 정보 활용 능력 향상과 디지털 접근성 제고를 위한 공공 교육 인프라로 활용됩니다. 본 자료는 지역별 교육장 배치 현황을 파악하고, 시민 수요에 맞춘 정보화 교육 기획 및 운영, 교육 환경 개선 등의 정책 수립에 기초자료로 활용할 수 있습니다. 또한, 디지털 격차 해소와 시민 대상 공공서비스 접근성 강화를 위한 행정적 의사결정 지원자료로도 제공될 수 있습니다.
