description_portal: 이 데이터는 세종특별자치시 내 각 학교와 유치원의 급식 운영 현황을 국민에게 투명하게 안내하기 위해 제공되는 ‘학교 식단 안내 정보’입니다. 학교별 급식 안내 메시지, 알레르기 유발 식품 표기, 원산지 정보, 단가 및 식품비 구성, 급식 시간, 급식 담당 연락처 등 학생과 학부모에게 중요한 정보가 포함되어 있습니다. 특히 알레르기 식품은 번호로 표기하여 알레르기 관리가 필요한 학생들이 안전하게 급식을 이용할 수 있도록 돕고 있으며, 식재료 원산지 표기 등을 통해 식단 안전성과 신뢰성을 확보하고 있습니다. 또한 급식실 운영 안내, 코로나19 대응 지침, 식단 변경 가능성 안내 등 안전하고 바른 급식 환경을 위한 주의사항도 함께 제공됩니다. 이 데이터는 학부모의 급식 정보 접근성을 높이고 학생 건강권을 지원하며, 학교 급식 행정의 투명성과 공공성을 강화하는 데 기초자료로 활용될 수 있습니다.
