summary_user: 서울시에 등록된 학원·교습소를 시설 한 곳씩(학원지정번호 기준) 담은 건별 현황 데이터로, 개설·등록일자와 등록상태, 휴원 기간, 정원·일시수용인원, 분야·교습계열·교습과정, 1인당 수강료와 공개 여부, 기숙사 여부, 도로명주소를 포함한다. 학부모가 "우리 구에 수학 교습과정을 운영하는 학원이 어디이고 수강료는 얼마인가"를 확인하거나, 분석가가 행정구역별 학원 밀집도를 학원가 상권·주택 수요 신호로 보는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 행정구역명이나 도로명주소·우편번호로 이름·주소를 맞춰 붙이거나 같은 서울시 데이터와만 연결한다.
description_portal: 서울시 학원 교습소 정보 데이터는 서울시 내에서 운영 중이거나 등록된 학원 및 교습소의 기본 현황을 제공하는 공공데이터입니다. 행정구역명, 학원·교습소명, 학원지정번호 등을 통해 각 시설을 고유하게 식별할 수 있으며, 개설일자·등록일자·등록상태명, 휴원 시작·종료일자 등을 통해 운영 및 행정 상태를 확인할 수 있습니다. 정원합계와 일시수용능력인원합계는 수용 규모를 파악하는 지표로 활용됩니다. 또한 분야명, 교습계열명, 교습과정명·목록명을 통해 어떤 분야와 과정의 교육이 이루어지는지 알 수 있으며, 인당수강료내용과 수강료공개여부는 비용 정보를 투명하게 파악하는 데 도움이 됩니다. 기숙사학원여부, 도로명주소·상세주소, 우편번호는 생활·입지 정보를 제공하여 학부모와 학생이 교육시설을 선택하고 비교하는 데 유용하며, 적재일시는 데이터 최신성을 판단하는 기준이 됩니다.
