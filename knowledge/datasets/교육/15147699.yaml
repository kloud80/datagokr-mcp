description_portal: 경기도 남양주시 진접읍 장현천로 197에 위치한 산림교육원에서 운영하고 있는 생활관(해오름관)의  현황을 안내해주는 공공데이터이며, 생활관 현황이 변동될 시 수시 업데이트 하겠습니다.- 제공하는 내용은 생활관(해오름관) 층별 생활관 수와 생활관의 구성(사용인원)을 공개하고 있습니다.구성은 생활관 1층~3층으로 돼 있으며, 1층에는 생활관이 10개실(2인실), 2층에는 19개실(2인실), 3층은 11개실(2인실) 구성으로 총 40개실로 구성돼있으며, 인원은 80명까지 사용이 가능합니다.각 생활관 내에는 기본적으로 TV, 냉장고, 책상, 의자 등이 비치되어 있어 생활관 사용간 쾌적하게 사용할 수 있습니다.
