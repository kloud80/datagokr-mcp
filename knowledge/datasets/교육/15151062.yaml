description_portal: 본 데이터는 「보육교사 특성별 주당 근로시간 현황」을 주제로 CTGAN(Conditional Tabular GAN) 기법을 활용하여 생성한 합성데이터로, 실제 교사의 개인정보를 포함하지 않으면서도 성별, 연령대, 학력, 근무지역, 기관유형 등 주요 특성과 주당 총 근로시간 간의 통계적 상관관계를 정밀하게 모사하였다. CTGAN은 원본 데이터의 분포와 변수 간 상호작용을 학습해 현실과 유사한 구조를 재현하되, 개인 식별 위험을 완전히 제거하여 데이터 활용의 안전성과 품질을 동시에 확보하였다.이 데이터는 공공부문에서는 보육교사의 근무환경 분석, 노동시간 적정성 검토, 근무시간 단축 정책 효과 분석 등 정책 수립에 활용할 수 있으며, 민간부문에서는 HR·노무관리 시스템 개발, 인력운영 효율화, 피로도 예측모델 구축, 인사·복지컨설팅 등 다양한 분야에서 활용 가치가 높다. 특히 기관유형·지역별 근로시간 패턴을 기반으로 인력 수요 예측, 교사 근속률 향상 전략 수립, 근무환경 개선 프로그램 설계 등 데이터 기반의 인적자원 관리 혁신을 지원할 수 있다.
