description_portal: 이 자료는 6차 교육과정에 따라 발행된 전국 중학교 교과서 정보를 체계적으로 수록한 데이터입니다. 총 910종에 달하는 교과서의 과목명, 출판사, 발행일, 적용 여부 등 핵심 항목을 포함하고 있으며, 2020년 9월 28일 최초 등록되고 그 이후 잦은 수시 갱신을 통해 최신 정보를 유지하고 있습니다. 교육행정 기관, 연구자, 출판업계 관계자들은 교과서 발행 추이 분석, 출판사별 시장 점유율 조사, 교육과정 개정 전후 교재 비교 등 다양한 분석에 활용할 수 있으며, 표준화된 CSV 형식으로 되어 있어 교재 정책 평가, 교육자료 아카이브, 디지털 교육 인프라 구축 등에도 유용한 고정밀·구조화된 공공 교육 데이터입니다
