summary_user: 사립대학별 교비회계 운영계산서 결산 내역을 학교 단위로 담은 집계 파일로, 등록금수입(입학금·수업료·계절학기 등)과 법인 전입금·법정부담전입금·기부금, 관리운영비 등의 세부 금액(천원)을 학교급·학종·지역 구분과 함께 전국 범위로 제공한다. 분석가나 학부모·연구자가 "어느 사립대학이 등록금 의존도가 높고 법인이 법정부담금을 얼마나 내는가"를 학교별·지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 대학알리미 공시나 다른 대학 재정 자료와는 학교명·법인명을 이름으로 맞춰 이어 써야 한다.
description_portal: '한국사학진흥재단_사립대학 교비회계 운영계산서은 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 교비회계 운영계산서 자료를 통해 사립대학 결산내용 중  등록금수입, 전입금수입, 기부금수입, 관리운영비 등의 세부내역을 학교별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(결산 미제출교 제외, 단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
