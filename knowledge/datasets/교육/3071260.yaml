summary_user: 포항교육지원청 관내 폐교 학교를 한 행에 한 곳씩 담은 작은 파일(csv 약 2KB)로, 학교명·소재지·폐교연도·폐교상태·토지와 건물 면적·활용계획을 담는다. 폐교 부지를 임대·매입하거나 지역 활용을 검토하는 사업자·지자체가 '포항에 어떤 폐교가 남아 있고 면적과 활용계획은 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 학교명이나 소재지 주소를 매칭해 학교 기본정보·주소 기반 자료와 이어 쓴다.
description_portal: 포항시 관내에서 폐교된 학교의 재산 현황을 종합적으로 안내하는 자료입니다. 이 데이터에는 폐교된 학교의 명칭, 위치(소재지), 폐교 일자, 부지 및 건물의 면적, 활용 용도 등 폐교 재산과 관련된 구체적인 정보가 포함되어 있습니다. 이러한 정보는 행정지원과 등 관련 부서에서 폐교의 설립·폐지 및 자산 변동 사항을 공식 행정 절차와 현장 조사, 재산 관리 기록 등을 통해 수집하며, 「공유재산 및 물품 관리법」 등 관련 법령에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 연 1회 이상 정기적으로 갱신되어, 포항시 내 폐교재산의 최신 현황을 반영합니다.이 자료는 지역 내 폐교 재산의 효율적 관리와 활용, 임대 및 매각 정책 수립, 공공자산의 투명한 운영, 지역사회 개발 및 활용방안 모색 등 다양한 분야에서 활용됩니다. 또한 정책 담당자, 연구자, 지방자치단체, 민간기업 등에서 폐교 재산의 활용 가능성 분석, 지역 개발계획 수립, 공공시설 확충 등에도 중요한 참고자료로 사용할 수 있는 공공데이터입니다.
