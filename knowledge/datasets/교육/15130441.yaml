summary_user: 직업계고 3학년 산업체 채용형 현장실습생에게 지급한 현장실습 지원금 수혜 현황을 연도·학기·관할교육청·고등학교유형·고등학교명별 수혜금액으로 담은 전국 단위 파일(CSV)이다. 교육청이나 직업계고 관계자, 분석가가 "어느 교육청·어느 학교에서 현장실습 지원금이 얼마나 지급됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 학교 기본정보 등 다른 데이터와는 고등학교명·교육청 이름을 맞춰 연결해야 한다.
description_portal: 한국장학재단은 국내 직업계고등학교 3학년 학생 중 산업체 채용형 현장실습에 참여하고, "현장실습 표준협약서"를 작성한 현장실습생을 대상으로 현장실습 지원금을 지원하고 있습니다. 이러한 현장실습 지원금 수혜 학생에 대한 정보는 체계적으로 관리되고 있으며, 다음의 공공 데이터는 고등학교명, 고등학교 유형, 관할교육청, 수혜금액 등 현장실습 지원금 수혜 현황 정보를 포함하고 있습니다. 지원대상, 지원내용, 지원절차, 지급 및 사후관리 등 관련 상세 정보는 한국장학재단 누리집(www.kosaf.go.kr) > 장학금 > 국가근로 및 취업연계 장학금 > 현장실습 지원금에서 확인하실 수 있습니다.
