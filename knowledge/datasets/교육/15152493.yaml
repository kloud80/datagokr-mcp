description_portal: 전라남도교육청 홈페이지는 전남교육의 최신정보를 제공하고 이용자들에게 다양한 교육 콘텐츠를 제공하기 위하여 구축되어 운영 중에 있습니다. 해당 데이터 정보는 전라남도교육청 홈페이지 시스템을 이용한 사용자들의 접속 통계 정보이며, 홈페이지 관리 운영자가 원활하게 홈페이지 운영을 위하여 관리하는 누적되어 있는 정보입니다. 사용자 접속 통계에서는 로그인 방법 및 사용 접속날짜 기준으로 정렬되어 있습니다. 해당 데이터는 누가 접속했는지에 대한 정보는 포함되어 있지 않습니다. 해당 정보는 접속타입, 접속날짜, 접속주소, 접속사이트명, 접속브라우저, 접속단말기, OS버전 정보 등이 포함되어 있습니다. 해당 파일은 샘플파일이므로, 원하시는 기간의 데이터가 필요하실 경우 별도로 요청하시기 바랍니다.
