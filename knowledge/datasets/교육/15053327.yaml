summary_user: 경상북도울진교육지원청 관할 울진군 내 폐교 학교를 한 행에 하나씩 담은 원장으로, 폐교명·폐교연도·학교급, 대지와 건물연면적, 활용현황(임대·매각·자체활용 등 구분), 도로명·지번 주소와 담당 부서 연락처를 담는다(CSV 약 3KB). 지자체·민간기업·주민이 '울진에서 임대나 매각으로 활용할 수 있는 폐교가 어디에 있고 규모는 얼마인가'를 확인하거나 지역 개발계획에서 폐교 재산 활용 가능성을 검토할 때 쓴다. 전역 조인 키는 없으므로 시군구코드·교육지원청코드나 소재지 주소로 다른 시군 교육지원청 폐교현황 및 주소 기반 공간 데이터와 이어 쓴다.
description_portal: 울진군 내 폐교된 학교의 재산 현황을 종합적으로 안내하는 자료입니다. 이 데이터에는 폐교된 학교의 명칭, 위치(소재지), 부지 및 건물의 면적, 활용 용도 등 폐교 재산과 관련된 구체적인 정보가 포함되어 있습니다. 이러한 정보는 행정지원과 등 관련 부서에서 폐교의 설립·폐지 및 자산 변동 사항을 공식 행정 절차와 현장 조사, 재산 관리 기록 등을 통해 수집하며, 「공유재산 및 물품 관리법」 등 관련 법령에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 연 1회 이상 정기적으로 갱신되어, 울진군 내 폐교재산의 최신 현황을 반영합니다.이 자료는 지역 내 폐교 재산의 효율적 관리와 활용, 임대 및 매각 정책 수립, 공공자산의 투명한 운영, 지역사회 개발 및 활용방안 모색 등 다양한 분야에서 활용됩니다. 또한 정책 담당자, 연구자, 지방자치단체, 민간기업 등에서 폐교 재산의 활용 가능성 분석, 지역 개발계획 수립, 공공시설 확충 등에도 중요한 참고자료로 사용할 수 있는 공공데이터입니다.
