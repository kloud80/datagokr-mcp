description_portal: 제주특별자치도교육청 학교통합 누리집의 돌봄신청강좌 정보를 제공하는 데이터 입니다. 총 11개의 항목을 제공하고 있으며, 각각 강의일련번호, 강의명, 총인원수, 신청시작일시, 신청종료일시, 시작일자, 종료일자, 교육시작시각, 교육종료시각, 정렬번호 및 추첨여부 정보를 제공하고 있습니다. 강의일련번호는 해당 돌봄교실강의의 일련번호를 나타내고, 강의명은 해당 동봄강좌의 강의명을 확인할 수 있습니다. 총인원수는 해당 강좌의 신청 인원을 나타냅니다. 신청시작일시와 신청종료일시는 신청시간을 나타냅니다. 시작일자와 종료일자는 해당 강좌의 시작과 종료일자를 의미합니다. 교육시작시각과 교육종료시각은 해당 강좌의 시작과 종료시각을 나태내고 추첨여부는 해당강좌의 선발 추첨여부를 확인할 수 있습니다.
