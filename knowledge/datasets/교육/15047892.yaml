summary_user: 시청자미디어재단 12개 지역 센터가 전국 중학교에 지원한 자유학기제 미디어교육 프로그램을 학교·프로그램 건별로 담은 원천 파일로, 학교명·관할센터·지역·학교주소·진행학기·주제·프로그램명·시작/종료일자를 담는다. 교사·학부모나 교육 분석가가 '우리 지역 어느 중학교가 어떤 주제의 미디어교육을 언제 받았나', '센터별로 지원 학교가 어떻게 분포하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 학교알리미 등 학교 단위 데이터와는 학교명이나 학교주소를 이름·주소 매칭으로 이어 써야 한다.
limits: 공통 학교 코드 같은 조인 키가 없어 다른 학교 데이터와의 연결은 학교명·주소 매칭에 의존하므로 동명 학교 등 오매칭에 주의해야 한다. 포털 설명상 사업이 학교 미디어교육 지원 사업으로 바뀌며 이 데이터 제공이 중단되어 이후 연도 실적은 담기지 않는다.
