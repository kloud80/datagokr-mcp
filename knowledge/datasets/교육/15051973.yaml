description_portal: 한국잡월드에서 운영 중인 다양한 체험관의 월별 전체이용자수에 대한 자료 입니다.개인, 단체 등의 합산자료이며 2013년1월부터 2026년 5월까지의 이용객 합산 추이를 알 수 있습니다.청소년체험관, 어린이체험관, 전시관, 메카이브, 숙련기술체험관,진로설계관, 미래직업관 의 월별 이용객 합계와 월별 전체 합계입니다.코로나로 인하여 2020년도에 휴관을 진행하였습니다. 2020년 3월부터 8월까지 임시휴관하였으며, 5월20일 임시 운영재개 하였으나, 재휴관하였습니다. 체험관 개편에 따른 과거 체험실에 대한 이용 정보도 전시관 정보에 같이 포함되어 있습니다.
