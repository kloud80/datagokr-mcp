description_portal: ‘한국학중앙연구원_장서각 총융청등록’ 데이터는 조선 후기 중앙군 중 하나였던 총융청(摠戎廳)의 운영과 관련된 기록을 정리한 본문 텍스트형 고문서 메타데이터입니다.총융청은 서울과 경기 지역의 방위를 위해 설치된 오군영(五軍營) 중 하나로, 이 데이터는 그 총융청의 행정·군사 운영 기록을 XML 형식으로 수록한 자료입니다.본문은 연월일별로 정리된 행정 사항, 명령, 군사적 조치, 인사 발령, 군영 간 통신문 등을 포함하고 있으며, 각 항목은 식별번호(ID), 일자, 제목(title), 본문(body), 쪽 정보(page), 지리정보(geo), 책임자/기안자(name), 주석(note) 등의 구조로 체계화되어 있습니다. 이 데이터는 조선 후기 국가 군사체계, 지역 방어전략, 군영 행정조직의 실무 흐름을 분석하는 데 중요한 1차 사료로 활용될 수 있으며, 군사사 연구, 행정사 연구, 디지털 인문학 기반 고문서 분석, 역사 교육 콘텐츠 제작 등 다양한 분야에서 핵심 기반자료로 가치가 높습니다.
