description_portal: 한국사회보장정보원에서 제공하는 2017년부터 2024년까지 전국 시군구별 어린이집의 연장보육반 운영 여부 정보입니다.데이터 구성은 연도, 시도, 시군구, 어린이집유형, 어린이집명, 정원, 현원, 연장보육반운영여부 항목으로 구성되어 있습니다. 이 데이터를 활용하여 연장보육 서비스의 도입 이후 지역별 확산 추이 및 지역·유형별 운영 실태, 미운영 지역의 보육 공백 위험 파악 측면의 분석이 가능합니다.해당 데이터는 2017~2024년 전국 시군구별 어린이집 별 운영 중인 어린이집 공공데이터입니다.※ 참고로 연장보육(16:00~19:30 제공되는 보육 서비스)은 2020년부터 시행되었습니다.
