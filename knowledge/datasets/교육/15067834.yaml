description_portal: 이 데이터셋은 최초 카메라 옵스큐라부터 최신 미러리스까지 50여 종 촬영 기기를 시대별로 정리했다. 각 행은 고유 아이디를 기준으로 연결 가능하며 대·중분류 코드를 활용해 콘텐츠 유형별 집계를 지원한다. 컨텐츠명, 생산 연대, 제조사(국가), 상세 타입(박스·폴딩·SLR·TLR·RF·즉석·토이·필드·스테레오·컴팩트·디지털)을 모두 포함한다. 필름·저장매체 종류와 화면 크기(필름 사이즈 또는 센서 치수) 정보로 장비별 기술 특성을 비교할 수 있다. 추가설명에는 상세 모델 명칭, 기술 사양, 감수자의 전문 의견이 기록되며 공개 여부로 활용 범위를 관리한다. 사진 기술 발전사 연구와 수집품 비교 분석 자료로 활용하기에 적합하다.(사이트 정보) https://www.science.go.kr/mps/scienceSubject/camera/list.do
