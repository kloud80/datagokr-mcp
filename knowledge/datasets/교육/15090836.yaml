description_portal: 한국기술교육대학교 온라인평생교육원은 고용노동부와 협력하여 스마트 직업훈련 플랫폼(STEP)을 운영하고 있으며, 이 플랫폼은 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공합니다. STEP은 온라인 콘텐츠 중심의 학습뿐만 아니라, 실시간 상호작용을 통해 학습자 몰입도를 높이고 교육 효과를 극대화하기 위해 라이브세미나(Live Seminar) 기능을 적극적으로 활용하고 있습니다.라이브세미나는 전문가 강연, 실시간 질의응답, 사례 공유, 현장 경험 전달 등을 목적으로 개설되며, 학습자와 강사 간의 쌍방향 소통을 통해 직무 역량을 심화시키는 데 중점을 둡니다. 특히, K-디지털 트레이닝, 혼합훈련, 원격+집체 연계 교육 등 다양한 형태의 직업훈련 프로그램에 라이브세미나가 통합되어 운영되고 있습니다.
