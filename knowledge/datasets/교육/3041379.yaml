summary_user: 부산광역시서부교육지원청 관내 유치원·초등학교·중학교 등 교육기관을 기관 한 곳당 한 행으로 담은 명부 파일로, 학교급 구분, 공립·사립 설립구분, 기관명, 주소, 전화번호, 홈페이지를 담는다. 학부모나 주민이 '우리 동네 서부교육지원청 관할 학교의 연락처와 홈페이지는 어디인가'를 찾을 때, 분석가가 관내 학교 목록을 주소 단위로 정리할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 기관명이나 주소를 맞춰 붙여야 한다.
limits: 학교코드 등 공통 키가 없어 교원·학생 통계나 재정 데이터와 연결하려면 기관명·주소 매칭이 필요하다. 범위는 서부교육지원청 관내에 한정되므로 부산 전체 학교 정보는 이 파일로 볼 수 없다.
