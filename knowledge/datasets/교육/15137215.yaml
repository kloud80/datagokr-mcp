summary_user: 우정인재개발원 학사행정시스템에서 쓰는 교육과정 분류 정보를 담은 파일로, 자체·위탁·전문·기본·공통전문교육 같은 교육 유형을 계층으로 나누고 사용 여부를 표시하며 이름이 바뀌거나 폐지된 과정도 포함한다. 우정사업본부 교육 운영을 분석하는 사람이 어떤 교육 유형이 있었고 지금 무엇이 쓰이는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 같은 기관의 학사행정 데이터와 과정 ID나 소속기관 코드, 이름 매핑으로만 이어 쓴다.
description_portal: 우정인재개발원 내부 행정 프로그램인 학사행정시스템에서 자체교육, 기본교육, 전문교육 등 교육 과정에 대한 분류 정보가 담겨있는 테이블입니다.학사행정 초창기부터 사용되었던 교육과정에 대한 분류이며, 각 교육 과정의 유형을 명확히 구분하여 교육 운영의 효율성을 높이기 위해 사용됩니다.'자체교육', '위탁교육', '전문교육', '기본교육', '공통전문교육' 등 다양한 교육 유형을 계층적으로 나누고, 각 분류의 사용 여부를 함께 표시하여교육 체계의 구조와 운영 상태를 효율적으로 관리할 수 있도록 구성된 데이터입니다.현재는 이름이 변경되거나 폐지된 교육방식이 모두 포함되어 있습니다.
