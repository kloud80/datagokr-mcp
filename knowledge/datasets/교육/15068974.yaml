summary_user: 2024학년도 전문대학 신입생 모집결과를 대학·모집단위(학과)별로 담은 전국 단위 파일로, 지역·설립·계열·중분류·학제·주야 구분과 함께 입학정원, 일반전형과 특별전형 유형별(일반고·특성화고 졸업자, 협약 연계교, 고른기회, 특기자, 추천자, 대학자체기준) 모집·지원·등록 인원, 정원내 전체 합계를 담는다. 수험생·학부모가 '어느 전문대학 어느 학과의 전형별 경쟁률과 등록률이 어땠나'를 비교하거나, 분석가가 계열·지역별 전문대학 충원 현황을 살펴보는 데 쓴다. 전역 조인 키(대학 코드 등)가 없어 다른 대학 공시·학자금 데이터와는 대학명·모집단위명 같은 이름 매칭으로만 연결한다.
limits: 대학·학과 코드가 없어 다른 데이터와 붙일 때 대학명 표기 차이를 직접 맞춰야 한다. 포털 설명상 2024학년도 한 해 결과이므로 연도별 추이를 보려면 다른 학년도 자료가 따로 필요하다.
