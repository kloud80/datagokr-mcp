summary_user: 전국 초등학교의 학년도·학기·학년·학급·교시별 시간표와 수업내용을 건별로 담으며, 검증 호출에서 31,738행을 받았다. 학부모나 앱 개발자가 '우리 아이 반의 이번 주 요일별 교시 수업이 무엇인가'를 확인하는 데 쓴다. 학교코드(SD_SCHUL_CODE)가 조인 키이므로 나이스 학교기본정보(schoolInfo)로 교육청·학교코드를 먼저 찾은 뒤 호출하고, 같은 코드로 급식·학사일정·학급 정보와 잇는다.
description_portal: 나이스 교육정보 개방 포털은 시도교육청과 교육정보 활용을 지원하는 기관이 협력하여 초등학교의 학년도, 학교, 학기, 학년, 학급, 교시별 시간표와 수업내용을 제공합니다. 해당 조직의 정책에 따라 트래픽은 달라질 수 있으며, 인증키 발급 후 웹 또는 모바일 어플리케이션 개발이 가능한 서비스를 지원하여 교육정보를 효과적으로 활용할 수 있습니다.(제공데이터)초등학교 학년도, 학교, 학기, 학년, 학급, 교시별 시간표 수업내용을 제공
