description_portal: 초중등교육법 및 관련 규정에 따른 전국 외국인학교와 외국인유치원의 현황을 상세히 제공하고 있습니다. 미리보기 내용에서는 서울, 부산, 대구, 인천, 경기 등 주요 지역에 위치한 다양한 외국인학교들이 나열되어 있으며, 각 학교명과 학급 구성이 포함되어 있습니다. 특히 프란치스코외국인유치원, 덜위치칼리지서울영국학교, 서울독일학교, 부산국제외국인학교, 경기수원외국인학교 등 여러 유형의 국제학교 및 각종학교가 포함되어 국내 거주 외국인과 국제 교육에 관심 있는 이들에게 중요한 참조자료를 제공합니다. 전체 목록은 추가 다운로드를 통해 확인할 수 있음을 안내합니다.초중등교육법 제 60조의 2 , 외국인학교 및 외국인유치원의 설립 운영에 관한 규정에 따른 전국 외국인학교 현황을 제공합니다.
