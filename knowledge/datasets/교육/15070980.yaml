summary_user: 한국유학종합시스템으로 국내 대학에 온라인 입학 지원한 외국인 지원자 수를 국가별로 집계해, 학사·석사·박사·석박사·전문학사·어학연수·교환학생 등 과정별 인원과 남녀·합계를 담은 작은 CSV 파일(약 3.9KB)이다. 유학생 유치 담당자나 분석가가 어느 나라에서 어떤 학위 과정으로 지원이 많이 들어오는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 유학생 통계와는 국가명(국가명)을 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 외국인의 국내 대학 유학을 위한 온라인 입학 지원자 수를 국적별, 지원 대학별, 학위 과정별로 세분화해 보여주고 있다. 중국, 베트남, 카자흐스탄 등 다양한 국가의 학사, 석사, 박사 과정 지원 현황을 상세히 제공하며, 남녀 수와 전공 유형별 분포까지 포함하고 있어 한국유학종합시스템을 통한 국제 학생 유치 현황 분석에 유용하다. 과거 데이터와 함께 유학 트렌드 파악에 기여하며, 한국유학박람회와 STUDY IN KOREA 같은 프로그램 연계 정보 활용도 가능하다.외국인의 국내대학 유학을 위한 온라인 입학 지원자수를 국적별, 지원대학별, 학위과정별의 주제별 현황데이터를 제공
