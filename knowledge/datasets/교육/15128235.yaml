description_portal: 한국발명진흥회에서 운영하는 발명교육과 관련한 연도/지자체별 발명특성화고(발명특허고) 학교 수, 발명교육센터 수, 발명교사인증 취득 수, 발명교육관련 연수 이수자 수에 대한 데이터 입니다.발명특허특성화고는 2024년 발명특허고등학교로 명칭이 변경되어 2개 명칭이 병기되어 있으니 공공데이터 이용에 참고 바랍니다.각 데이터는 서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주의 순으로 광역지자체별 현황을 확인할 수 있습니다.또한 각 데이터 별로 학교 종류(초등학교, 중학교, 고등학교, 기타/직속기관 등) 구분을 두어 본 공공데이터를 통해 전국에서 운영하는 발명교육과 관련한 현황 정보를 지자체, 학교 유형, 연도별로 한 눈에 확인할 수 있습니다.한국발명진흥회에서 운영하는 발명교육과 관련하여 지자체별 발명특허고등학교 분포 수, 지자체별 발명교사인증 취득 수 등 지자체의 발명교육과 관련한 현황 정보로 활용할 수 있습니다.
