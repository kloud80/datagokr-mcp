summary_user: 국가기술자격시험이 치러지는 전국 시험장소별로 갖춘 시설을 시험장소코드·시험장소명·시설명칭·시설구분 단위로 한 줄씩 담은 파일(CSV, 약 650KB) 데이터다. 응시자가 원서 접수 전에 "내가 갈 시험장에 CBT 시험실 같은 시설이 있는가"를 확인하거나, 시험운영자·분석가가 지역별 시험장 시설 구성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시험장소코드나 시험장소명을 기준으로 같은 한국산업인력공단의 시험장소·시험일정 데이터와 이름·코드 매핑으로만 이어 쓴다.
description_portal: '한국산업인력공단에서 제공하는 “국가기술자격시험 관련 시험장소정보(시험시설, 시설, CBT시험장 등)” 공공데이터는 국가기술자격시험이 치러지는 시험장소의 다양한 설비 및 환경 조건을 체계적으로 정리한 자료입니다. 이 데이터에는 각 시험장이 갖추고 있는 필수 및 선택 시설 항목, 시험실 크기 및 수용 인원, 조명·환기·소음 등의 시험 환경 요건, 장애인 접근성 여부, 보안설비 및 응시자 관리 공간, 필기시험용 CBT(Computer Based Test) 시험실 위치 및 좌석 수, 컴퓨터 및 네트워크 설비의 사양, 시험장 유지관리 정보, 시험실 배치도 및 설비 배치 기준, 응시자의 편의시설(화장실, 대기실 등), 안전 대책 및 비상 설비, 시험응시 환경 점검 기준, 시험장소 지정 절차 및 변경 이력, 데이터 제공 형식(예: CSV), 관리 주체 및 관리 부서, 업데이트 주기 등이 포함되어 있으며, 응시자·시험운영자·정책수립자 등이 시험장소의 시설 수준 및 이용 가능성을 미리 확인하고 시험 준비 및 운영의 투명성 · 신뢰성 확보에 활용할 수 있도록 설계되어 있습니다.'
