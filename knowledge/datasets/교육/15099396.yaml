description_portal: 교육부 산하 준정부기관인 한국장학재단에서 실시한 임직원 교육연수와 관련된 정보를 종합하여 연도별로 누적된 교육 현황 자료를 데이터 형태로 제공합니다.직원 교육연수는 직원의 업무수행에 필요한 지식과 능력을 향상함으로써 개인의 역량을 강화하고 회사의 성장에 이바지 하기 위함이며,주요 항목으로는 교육과정 실시연도, 교육과정 구분, 교육과정명, 교육시작일, 교육종료일, 교육연수 이수직원 수, 교육 이수시간 등의 내용이 포함되어 있습니다.이를 통해 재단 임직원 교육연수 실시 현황을 한눈에 파악할 수 있으며, 재단의 교육연수 정책에 대해 이해도를 높이는 데 유용한 자료로 활용될 수 있습니다.
