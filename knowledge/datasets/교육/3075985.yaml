description_portal: 부산글로벌빌리지는 2009년 7월 부산 최초의 통학형 영어 학습공간으로 개원한 이래 다양한 체험 교육을 통해 적극적인 참여 중심의 영어 학습 활동의 기회를 제공하고 있습니다.부산글로벌빌리지 프로그램 운영현황 파일로 정규과정, 일반과정, 특별과정 프로그램의 이용대상, 수업일정  및 이용료 등에 대한 데이터 등의 항목을 제공합니다.정규과정, 방학캠프, 글로벌 부산 영 리더과정, 토요체험스쿨, 방과후 교실, 키즈체험, 영어읽기 클리닉, 성인회화, 주니어통번역사, k-tesol 등 다양한 과정이 있습니다.
