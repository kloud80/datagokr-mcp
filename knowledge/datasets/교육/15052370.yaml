description_portal: 서울시 대학 및 전문대학 DB 정보(영어)는 서울시에 위치한 대학 및 전문대학의 기본 정보를 영문 기준으로 정리한 데이터입니다. 각 학교별로 고유 키값과 연도 정보, 영문 학교명이 포함되어 있어 학교 식별과 시기별 현황 파악이 가능합니다. 또한 우편번호와 행정시·구·동의 영문 표기 주소 정보가 제공되어 국제 비교 연구나 외국인 유학생, 해외 기관에서 활용하기에 적합한 구조입니다. 더불어 전화번호, 팩스번호, 홈페이지 정보가 함께 제공되어 국내외 이용자가 해당 대학에 직접 문의하거나 웹사이트를 통해 상세 정보를 확인할 수 있으며, 서울시 고등교육 기관의 국제 홍보, 유학생 유치, 글로벌 협력 네트워크 구축 등에 기초 자료로 활용할 수 있는 데이터입니다.
