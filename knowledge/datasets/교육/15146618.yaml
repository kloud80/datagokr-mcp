summary_user: '서울 마포구 소재 유치원별로 실내공기질·정기소독·미세먼지·조도 점검일자와 결과, 음용수 종류, 공시차수, 주소를 담은 유치원 단위 공시 자료로, 유치원알리미에서 제공된다. 학부모가 "우리 동네 유치원은 실내공기질과 미세먼지 점검을 언제 받았고 결과가 적합했나"를 확인하거나, 분석가가 구 안 유치원의 환경위생 관리 상태를 비교할 때 쓴다. 전역 조인 키는 없어 유치원코드(KINDERCODE)나 유치원명·주소로 같은 유치원알리미 계열 자료(예: 유치원 기본현황)나 어린이집 자료와 맞춰 잇는다.'
description_portal: 서울특별시 마포구에 소재하고 있는 유치원의 실내공기질, 미세먼지 등 환경 위생 점검 현황입니다.이 데이터에는 교육청명, 교육지원청명, 유치원코드, 유치원명, 설립유형, 실내공기질점검일자, 실내공기질 점검결과, 정기소독 의무대상시설여부, 정기소독 점검일자, 정기소독 점검결과, 음용수종류, 미세먼지 검사일자, 미세먼지 검사결과, 조도관리 검사일자,조도관리 검사결과, 공시차수, 주소등에 대한 정보를 포함하고 있습니다.유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
