summary_user: NCS 능력단위별로 연결된 국가자격 종목과 그 훈련 기준시간(최소훈련시간, 필수·선택 능력단위 기준시간, 직무기초능력 기준시간)을 시험기관명·기준버전과 함께 담은 전국 단위 비공간 파일(csv, 약 1MB)이다. 직업훈련기관이나 교육과정 설계자가 "특정 자격종목을 준비하는 과정에 어떤 능력단위를 몇 시간 이상 편성해야 하는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 자격종목코드·자격종목명이나 능력단위코드를 같은 기관의 자격종목·시험일정·합격률 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 본 데이터는 NCS 능력단위코드, 자격종목코드, 자격종목명, 능력단위유형명, 최소훈련시간, 훈련시간합계, 필수·선택 능력단위 기준시간, 직무기초능력 기준시간, 시험기관명, 능력단위명, 기준버전코드 등 국가직무능력표준에서 제공하는 공식 코드를 기반으로 파일 형태로 구성된 자료이다. 해당 데이터는 기계·제조 분야 인력 양성과 직무 분석에 활용 가능하며, 스마트제조 환경에서의 품질경영 체계 구축과 신뢰성 설계를 지원한다. 또한 디지털 전환(DX)에 따른 CAD·설계 데이터 활용, 제조 데이터 표준화 및 공정 연계 분석에 기초 자료로 활용될 수 있다. 더불어 ESG 기반 자원 효율성 향상, 친환경 설계, 산업안전 강화 및 중대재해 예방 관점에서도 교육과 정책 수립을 위한 참고 데이터로 활용 가치가 있다.
