description_portal: 경상남도교육청에 소속된 도서관의 2026년 월별 행사 목록입니다.이 자료는 경상남도교육청 산하 각 도서관의 개별 누리집에 등록된 행사 정보를 한데 모아, 이용자들이 보다 쉽게 행사 흐름과 특성을 파악할 수 있도록 구성된 종합 목록입니다.각 기록에는 행사 주제, 행사를 주관하는 도서관명, 등록일자가 포함되어 있습니다. 이를 통해 월별로 어떤 유형의 프로그램이 활발히 운영되는 지를 한눈에 확인할 수 있습니다.예를 들어, 김해도서관·거제도서관·마산도서관 등 주요 도서관에서 진행되는 ‘코미디 마술 마임극’, ‘자기만의 집’, ‘지구 지킴 독서단’, ‘토요인문특강’, ‘청소년 문화공감 존’과 같은 다양한 주제의 프로그램 정보를 제공하고 있습니다.또한 행사 등록일자가 월별로 배치되어 있어 도서관별 홍보 시기, 계절별 행사 경향, 특정 월에 집중된 프로그램 유형 등을 분석하는 데에도 활용할 수 있습니다. 예컨대 4~5월에는 독서의 달, 가정의 달을 맞아 가족과 함께 즐길 수 있는 다양한 독서 프로그램과 체험형 활동이 증가하는 모습을 확인할 수 있습니다.이처럼 본 목록은 경상남도 내 지역 공공도서관이 제공하는 다양한 문화·독서 프로그램을 월별로 비교하고 확인할 수 있는 데이터로서, 도서관 이용자뿐 아니라 프로그램 기획자, 교육 관계자에게도 유용한 참고 자료가 됩니다.
