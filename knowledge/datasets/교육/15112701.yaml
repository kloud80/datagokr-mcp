description_portal: '서울특별시 마포구에 위치한 마포중앙도서관에서 제공하는 전자책(e-book) 보유 현황을 담고 있습니다. 각 전자책에는 제목, 저자, 출판사, 바코드, ISBN 정보뿐 아니라, 보유수와 카테고리(예: 소설, 역사/문화, 시/에세이, 무협, 아동, IT/프로그래밍, 여행/취미, 경제경영, 과학/공학 등)의 세부 정보가 포함되어 있습니다. 또한, 해당 전자책의 스마트폰사용여부와 태블릿사용여부도 함께 제공됩니다. 이 데이터를 통해 이용자들은 원하는 주제의 전자책을 빠르게 찾을 수 있으며, 도서관은 이용 수요에 기반한 자료 확충과 콘텐츠 관리에 효율적으로 활용할 수 있습니다.더 나아가, 디지털 독서 환경 확대에 따라 온라인 기반 독서 서비스 제공과 전자자료 접근성을 향상시키는 데에도 기여합니다.'
