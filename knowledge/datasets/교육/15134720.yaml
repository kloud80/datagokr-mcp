summary_user: 대구광역시교육청 관내 유치원·초·중·고등학교·특수학교·각종학교 등을 학교 한 곳당 한 행으로 담은 목록 파일로, 학교명·우편번호·전화번호·주소·홈페이지 주소를 담는다. 학부모나 주민이 대구 지역 특정 학교의 연락처·주소·홈페이지를 찾거나, 분석가가 대구 학교 위치 목록을 만들 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 주소를 맞춰 붙여야 한다.
