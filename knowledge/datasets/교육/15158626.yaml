summary_user: 대학알리미에 공시된 대학별 산학협력 현황을 담으며, 현장실습·캡스톤디자인·계약학과·교원과 학생의 창업·기술이전·산학공동연구·창업보육센터 등 항목을 전국 대학 단위로 제공한다. 진학을 고민하는 학생이나 산학협력 파트너를 찾는 기업, 정책 분석가가 '이 대학은 현장실습과 기술이전 실적이 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 대학알리미 데이터와는 학교명 매핑이나 같은 기관의 학교 코드로만 잇는다. 필수 파라미터인 학교 코드(schlId)도 다른 대학알리미 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 대학공시정보에서 사용되는 산학협력 공시정보(저작권에 위배되지 않는 정보), 현장실습운영현황, 캡스톤디자인운영현황, 계약학과설치운영현황, 주문식교육과정설치운영현황, 교원의창업및창업지원현황, 학생의창업및창업지원현황, 창업교육지원현황, 산학공동연구실적현황, 기술이전및사업화성과현황, 산학협력단운영현황, 산업체참여교과목운영현황, 취업연계프로그램운영현황, 창업보육센터운영현황, 창업동아리운영현황, 산학협력협약체결현황, 산업체인사특강운영현황, 현장전문가활용교육현황
