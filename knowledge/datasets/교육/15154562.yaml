description_portal: "중장기 개방계획에 따른 강원특별자치도 강릉시 관내 평생교육 및 학습 기회를 제공하는 기관의 현황과 운영 프로그램 정보 데이터입니다.본 데이터는 RN, 번호, 기관명, 기관분류, 기관소개, 운영프로그램소개, 등록일, 위도, 경도 항목으로 구성되며, 각 항목의 설명은 다음과 같습니다.번호: 데이터 정렬을 위한 일련번호기관명: '강릉종합사회복지관', '한국폴리텍대학' 등 평생학습 기관의 이름기관분류: '복지관', '직업훈련', '문화예술' 등 기관의 성격 분류기관소개: 기관의 설립 목적 및 주요 활동 소개운영프로그램소개: '바리스타 양성', '드론 교육' 등 실제 운영 중인 강좌 정보등록일: 데이터가 등록된 날짜위도 / 경도: 기관의 위치 좌표 정보이 자료는 시민들이 자신의 관심사나 거주지(위도, 경도)에 맞는 평생학습 기관을 찾고, 개설된 운영프로그램 정보를 파악하여 교육 참여 기회를 확대하는 데 활용됩니다."
