description_portal: 한국광해광업공단에서 제공하는 인력양성 교육 일정 정보를 정리한 자료입니다. 화약취급기능사, 광산보안기능사 등 광업 관련 자격 취득을 지원하는 교육과정과 광물자원개발 생산인력 양성을 위한 정기 교육 일정이 포함되어 있습니다. 2024~2025년의 과정명, 교육기간, 접수시간, 교육형태, 교육목적,교육대상, 모집인원의 정보를 제공하며, 이를 통해 광업 관련 자격 취득을 준비하거나 직업 역량을 강화하고자 하는 개인 및 기관에서 교육 계획 수립과 참여 결정에 활용할 수 있습니다.본 데이터는 정기 데이터가 아니며 수시 데이터로 분류됩니다.
