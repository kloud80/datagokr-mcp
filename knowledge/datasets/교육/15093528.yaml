description_portal: 학생들이 수학을 추상적이고 어려운 학문이 아닌, 놀이처럼 즐겁게 탐구하고 체험하는 대상으로 인식하도록 돕기 위해 한국과학창의재단에서 제공하는 'AskMath 체험콘텐츠' 데이터입니다. 구체적인 만들기 활동과 놀이를 통해 수학적 원리를 자연스럽게 체득하는 것을 목적으로 합니다.개방 데이터는 '쌓기나무 놀이', 'LED 정다면체 만들기', '테셀레이션', '스키테일 암호 만들기' 등 초등학생 눈높이에 맞춘 28종의 수학 체험 활동 영상 콘텐츠 목록으로 구성되어 있습니다. 각 콘텐츠는 '제목', '이용방법(유튜브 영상 링크)', '조회수' 등의 정보를 포함하고 있어, 누구나 쉽게 영상으로 체험 방법을 배우고 따라 할 수 있습니다.초등학교 교사나 학부모는 이 영상 자료를 수학 수업의 도입 자료나 창의적 체험활동, 방과 후 활동, 가정 학습 자료 등으로 다양하게 활용하여 학생들의 학습 흥미와 참여를 유도할 수 있습니다. 교육용 콘텐츠 개발자는 이 데이터를 통해 학생들에게 인기 있는 체험 활동의 유형을 파악하고 새로운 수학 교구나 체험 프로그램을 개발하는 데 아이디어를 얻을 수 있습니다.
