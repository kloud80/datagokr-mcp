description_portal: 어린이에게 경제 기초지식을 쉽게 전달하기 위해 재정경제부가 운영하는 어린이 경제교실 홈페이지에 제공되는 콘텐츠입니다. 최근 사회 경제 이슈와 관련된 다양한 경제 용어를 중심으로 구성되어 있으며, 어린이의 이해수준에 맞춘 설명을 통해 일상생활속 접근하기 쉬운 경제개념을 알기 쉽게 전달하는 내용입니다. 경제소식, 경제정보, 경제교육, 어린이통계, 시사이해, 아동학습자료, 기초경제용어, 경제문해력 등 경제관련 키워드를 바탕으로 제작된 본 자료는 학교수업 가정학습, 특별활동 등 어린이들에게 경제개념을 이해할 수 있는 다양한 환경에서 활용이 가능합니다. 아동의 경제문해력을 높이고 시사감각을 함양하는데 그 목적이 있으며, 교사나 보호자가 함께 활용할 수 있는 교육자료로도 적합합니다. 친숙한 사례를 통해 경제 개념을 설명하여 정보 접근성과 교육효과를 동시에 높일 수 있습니다.
