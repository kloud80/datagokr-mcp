description_portal: <데이터 수집목적 및 과정> 경남도립거창대학 학사행정 등록금 데이터는 경남도립거창대학에 재학 중인 학생들의 등록금 관련 정보를 체계적으로 정리한 자료로, 학사 행정 업무 및 정책 수립, 예산 책정 등에 활용될 수 있는 데이터입니다. <데이터 구성 및 세부항목> 이 데이터에는 학년 및 학기별로 구분된 입학금, 수업료, 기성회비, 학생회비, 기숙사비 등 학생들이 실제로 부담하게 되는 각종 등록금 항목이 포함되어 있으며, 이를 통해 학기별 또는 연도별 등록금 추이를 파악할 수 있습니다. 데이터는 CSV 파일 형식으로 제공되어 다양한 통계 분석 및 시각화 작업에 용이하게 활용될 수 있습니다. 이 데이터는 대학의 재정 운영뿐만 아니라 학생 및 학부모들이 합리적인 등록금 정보를 확인하는 데에도 유용하게 사용됩니다.또한, 해당 데이터는 연 1회 주기로 갱신하여 제공함으로써 등록금 변동 사항을 반영하고 있으며 차기 업데이트 예정일은 2025년 12월입니다.
