summary_user: 평택시 학교 현황을 교육과정(학교급)별로 묶어 학교수·학급 및 학과수·교실수·학생수(남녀)·교원수(남녀)를 담은 시군구 단위 집계 파일이며, 파일 크기가 728바이트로 몇 줄 안 되는 요약표다. 평택시의 초·중·고 등 학교급별 학생 수와 교원 1인당 학생 규모가 어느 정도인지 보려는 시민·분석가가 쓴다. 학교코드 같은 전역 조인 키가 없어 개별 학교 정보와는 바로 붙지 않고, 교육과정 이름이나 평택시라는 지역명으로 맞춰 다른 시군의 같은 현황표나 지역 통계와 나란히 비교하는 데 쓴다.
