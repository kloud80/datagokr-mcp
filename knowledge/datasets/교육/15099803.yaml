description_portal: '이 데이터는 서울 강서구에 위치한 여러  구립 도서관(예: 강서도서관, 곰달래도서관, 가양도서관 등)의 분관별 소장 도서 목록을 나타내며, 다음과 같은 항목으로 구성되어 있습니다.도서관명: 해당 도서가 속한 분관 이름도서명: 책 제목저자명: 책을 쓴 저자 또는 책임자출판사: 도서를 발행한 출판사 이름출판년도: 해당 도서의 발행 연도 이 데이터는 도서관별로 어떤 책이 소장되어 있는지를 파악할 수 있게 해주며, 분관별 장서 성격, 주제별 분포, 출판 연도별 비율 등을 분석할 수 있어 도서관 운영자, 독서교육 담당자, 지역 주민 모두에게 유용합니다.다만, 본 자료는 정기적으로 갱신되는 온라인 실시간 열람 시스템과 다를 수 있으며, 실제 소장 여부, 대출 가능 여부 등은 강서구 통합도서관 홈페이지에서 직접 확인해야 합니다.정확하고 실시간 정보 확인을 원하신다면 아래 사이트를 이용하세요 -강서구통합도서관 홈페이지 https://lib.gangseo.seoul.kr'
