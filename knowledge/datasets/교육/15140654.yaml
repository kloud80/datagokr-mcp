summary_user: 서울 종로구 관내 유치원별로 실내공기질 점검일자·결과, 정기 소독 대상 여부와 점검 결과, 수질검사·진드기·조도 점검 일자와 결과를 한 행씩 담은 건별 현황이다. 학부모가 '우리 동네 유치원 중 실내공기질·소독 점검을 최근에 받고 적합 판정을 받은 곳은 어디인가'를 확인하거나, 구청·교육 관계자가 점검 누락 유치원을 찾는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 유치원 코드(KINDERCODE)나 유치원명·주소를 매핑해 유치원 알리미 정보나 어린이집 자료와 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 유치원의 환경위생 관리 현황을 제공하는 자료입니다. 유치원은 「유아교육법」에 따라 아동의 안전과 건강을 최우선으로 하여 운영되어야 하며, 실내공기질 관리 및 정기 점검은 교육환경의 질을 유지하는 핵심 요소입니다. 데이터에는 교육청명, 교육지원청명, 유치원 코드, 유치원명, 설립유형과 함께 실내공기질 점검일자, 점검결과 등이 포함되어 있어 각 유치원의 환경관리 상태를 체계적으로 확인할 수 있습니다. 이를 통해 학부모는 자녀가 안전한 환경에서 학습할 수 있는 유치원을 선택할 수 있으며, 행정기관은 점검 결과를 분석하여 환경 개선과 정책 수립에 활용할 수 있습니다. 또한 연구자와 교육 관계자는 유치원 환경위생 현황을 기초자료로 삼아 아동 건강 보호와 학습환경 개선 방안을 모색할 수 있습니다. 본 자료는 종로구 유치원의 안전하고 쾌적한 교육환경 조성을 지원하기 위해 공개됩니다.
