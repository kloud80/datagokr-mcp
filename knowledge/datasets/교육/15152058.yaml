summary_user: 충청남도 15개 시군의 2024년도 어린이집 연장형 보육 이용 인원을 시군구와 어린이집 유형(국공립·민간·가정·직장 등)별로 묶어 야간연장·휴일보육 아동 수로 담은 집계 파일이다. 보육 정책 담당자나 분석가가 '어느 시군에서 어떤 유형의 어린이집이 야간·휴일 보육 수요를 많이 받고 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군구 이름이나 어린이집 유형 이름을 맞춰서 이어 쓴다.
