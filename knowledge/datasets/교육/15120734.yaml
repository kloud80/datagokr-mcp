description_portal: 해당 데이터는 전라남도 강진군청이 관리하는 교육장 현황을 정리한 자료로, 정보화교육장과 평생학습센터 3‧5강의실의 기본 정보를 포함한다. 각 교육장의 장소명, 도로명주소와 지번주소, 보유 시설(PC 대수 또는 테이블 수), 수용 가능 인원, 관리 주체 등이 체계적으로 기록되어 있다. 모든 교육장은 강진읍 영랑로1길 10 소재 강진복지타운 3층에 위치하며, 교육 목적 및 규모에 따라 서로 다른 시설과 수용 인원을 갖추고 있어 강진군의 평생교육 및 정보화 교육 운영 기반을 보여주는 데이터라 할 수 있다.
