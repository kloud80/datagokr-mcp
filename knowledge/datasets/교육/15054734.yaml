description_portal: 본 자료는 부산광역시 해운대구 관내 중학교에 대한 정보를 제공합니다.포함된 데이터는 해운대구 관내 중학교의 학교명, 각 학교가 속한 관할 교육청, 설립 구분(공립·사립), 각 학교별 주소, 대표 연락처, 홈페이지입니다.[데이터 안내 및 변경]매년 1회 해운대구 관내 중학교에 대한 데이터를 업데이트합니다.본 데이터는 교육청 및 교육지원청의 자료를 기반으로합니다.본 데이터는 해운대구 관내 학교에 대한 일반 데이터이며 보다 자세한 데이터는 각 학교별 대표 홈페이지 등을 통해 확인하실 수 있습니다.
