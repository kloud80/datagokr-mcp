summary_user: 부산 해운대구 관내 중학교를 학교 한 곳당 한 행으로 담은 목록 파일로, 학교명·관할 교육청·설립 구분(공립·사립)·주소·대표 전화·홈페이지를 담는다(CSV 약 2.3KB 규모). 학부모나 이사를 앞둔 주민이 '해운대구에 어떤 공립·사립 중학교가 있고 연락처와 위치는 어디인가'를 확인하거나, 분석가가 구 단위 학교 분포를 지도에 올릴 때 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어 학교명이나 주소를 기준으로 맞춰 학교 기본정보 마스터나 교원·학생 통계와 이어 써야 한다.
limits: 학교코드가 없어 다른 교육 데이터와 붙일 때는 학교명·주소 매칭에 기대야 하며, 이름 표기 차이로 어긋날 수 있다. 범위는 해운대구 한 곳뿐이라 다른 구나 부산 전체 비교에는 다른 자료가 필요하다.
