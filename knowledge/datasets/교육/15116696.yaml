summary_user: 경상남도 김해시 안의 고등학교를 학교 한 곳당 한 행으로 담은 원장 파일로, 설립 구분·고교유형·개교일자와 도로명주소·위도·경도·전화번호·홈페이지를 담는다(데이터 기준일 2025년 4월 1일). 김해시 주민이나 학부모가 집 근처 고등학교의 유형과 위치·연락처를 확인하거나, 분석가가 시내 고등학교 분포를 지도에 올릴 때 쓴다. 전역 조인 키가 없어 다른 학교 데이터와는 학교명으로 이름을 맞추거나 좌표·주소로 공간 결합해 이어 쓰며, 학교알리미 공시(학생·학급·교원 수 등)와 함께 쓰면 학교별 규모를 보탤 수 있다.
