description_portal: '○ 진주시 시민정보화교육은 진주시민을 대상으로 수강료 전액 무료로 실시하고 있으며, 디지털 전환 시대에 시민 누구나 정보기술을 쉽고 편리하게 활용할 수 있도록 정보화 역량을 강화하여 디지털 격차를 해소하고 시민의 삶의 질을 향상하고자 함. ○  시민정보화교육     - 교육대상 : 일반시민                                    - 교육장소 : 진주시청 정보화교육장 10층     - 교육기간 : 연중(공휴일 제외)     - 교육시간 : 오전반(10:00~12:00)/오후반(13:00~15:00)/야간반(월~수 ,18:30~20:30)     - 교육강사 : 전문강사 2명     - 교육과목 : 초급과정(컴퓨터기초, 인터넷활용, 문서작성기초, 엑셀기초, 스마트폰 등)/중고급과정(문서작성, 엑셀, 파워포인트, 이미지 편집, 컴퓨터활용 및 ITQ, 동영상제작 및 인터넷 활용 등     - 수장신청 : 진주시 통합예약시스템으로 인터넷 접수 ○ 취약계층 정보화지원     - 시니어 정보1센터 및 시니어 정보2센터 운영 지원     - 교육대상 : 진주시민 만55세 이상                              - 교육장소 : (시니어정보1센터) 상대동행정복지센터 3층, (시니어정보2센터) 연암공과대학 인화관 1층     - 교육기간 : 연중(공휴일 제외)     - 교육시간 : 오전반 09:30~11:30 / 오후반  13:30~ 15:30     - 교육과목 : 컴퓨터 기초, 스마트폰 기초, 한글 2020 활용, 문서작성, 영상제작, 영상편집 등      - 수강신청 : 방문접수 ○ 시민의 디지털 활용 역량 향상으로 일상생활 및 경제, 사회활동의 편의성을 증대하고, 디지털 취약계층의 정보 접근성 향상 및 디지털 격차 완화에 기여함.'
