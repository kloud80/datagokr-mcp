description_portal: '국립중앙과학관이 제공하는 야생화 콘텐츠 공공데이터는 총 57종의 꽃 정보의 조회가 가능합니다. 각 기록은 고유 아이디로 구분되고 대분류·중분류 코드를 통해 주제별로 체계화됩니다. 컨텐츠명과 과학명으로 식물 특징을 명시하고, 꽃이 피는 시기와 색깔을 상세히 기록했습니다. 추가설명에는 문화적 의미나 전통적 용도를 담았고, 감수자 정보를 통해 정확성을 확보합니다. 공개유무 필드를 통해 이용 가능 여부를 확인할 수 있어 교육, 연구, 전시 기획 등 다양한 분야에서 기초 자료로 활용할 수 있습니다데이터 항목명: 고유 아이디, 대분류코드, 중분류코드, 컨텐츠명, 분류, 학명, 꽃피는시기, 꽃의색깔, 추가설명, 감수자, 공개유무(사이트 정보) https://www.science.go.kr/mps/scienceSubject/flower/list.do※ 대전광역시 유성구 대덕대로 481(국립중앙과학관)'
