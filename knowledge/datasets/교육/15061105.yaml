description_portal: 성남시 내 운영중인 스마트도서관 현황에 대한 데이터이며, 설치장소, 운영시간, 도서적재수량, 관리부서 등의 항목을 포함하고 있습니다. 성남시는 시민의 독서 접근성을 높이고 생활권 내 책 읽는 문화를 확산하기 위해 스마트도서관, 즉 무인 자동화 도서 대출·반납기를 설치·운영하고 있다. 이 시설은 주로 지하철역, 주민센터, 복지관, 공공청사 등 유동인구가 많은 곳에 배치되어 있으며, 시민들은 성남시 도서관 회원증만 있으면 별도의 대면 절차 없이 365일 24시간 자유롭게 이용할 수 있다. 이러한 스마트도서관은 특히 직장인, 청소년, 고령자 등 도서관 이용 시간이 제한된 시민들에게 큰 호응을 얻고 있습니다.
