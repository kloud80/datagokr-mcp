summary_user: 고교 취업연계 장려금을 받은 지원 건을 지원 학년도·지원 연도·지역·학교 형태·성별·지원 금액(원) 항목으로 담은 전국 범위 파일 데이터로, 약 10MB 분량의 CSV입니다. 교육 정책 분석가나 직업계고 관계자가 연도별·지역별·학교 형태별로 장려금이 얼마나, 어떤 학생에게 지급됐는지 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·학교 형태 같은 이름 매핑이나 연도 기준으로만 이어 붙인다.
description_portal: 고교 취업연계 장려금은 중소 중견기업에 취업(재직)하는 직업계고 3학년, 일반고 3학년 직업교육 6개월(180일) 이상 위탁과정 참여 학생을 대상으로 장려금을 지급하는 고졸 취업 지원 제도 입니다.이 자료는 고교 취업연계 장려금을 지원받은 지원 학년도, 지원 연도, 지역, 학교 형태, 성별, 지원 금액을 확인할 수 있는 데이터입니다.고교 취업연계 장려금 관련 상세 정보는 한국장학재단 누리집(www.kosaf.go.kr) > 장학금 > 국가근로 및 취업연계 장학금 > 고교 취업연계 장려금에서 확인 가능합니다.
