description_portal: '이 데이터는 과학기술정보통신부와 국립중앙과학관이 관리하는 과학학습 콘텐츠 게재물 목록으로, 초등부터 성인까지 활용 가능한 다양한 과학주제를 폭넓게 다룹니다. 대표적으로 공룡 영역에서는 트리케라톱스·티라노사우루스 등 구체적 종 정보, 주제별 궁금증(“공룡은 왜 멸종했나요?” 등), 식별·특징·멸종 이론, 국내외 발견 사례 등 유용한 학습콘텐츠가 포함되어 있습니다.금속활자와 인쇄술 분야는 고려~조선~서양까지 시대별로 주요 활자의 명칭, 제작 연대, 실제 유물 이미지, 금속활자와 목판본의 비교, 제작 주조법, 그리고 인쇄술의 의의와 역사를 설명합니다.데이터 항목명: 내용, 아이디, 데이터관리방법, 대분류코드, 중분류코드, 좌표 (X), 좌표 (Y), 아이콘코드, 연대구분, 연대, 직접입력체크, 출현시기, 제목_한글명, 타이틀_영문명, 메인이미지, 서브이미지1, 서브이미지2, 서브이미지3, 요약설명, 조회우선, 조회수, 공개유무※ 대전광역시 유성구 대덕대로 481(국립중앙과학관)'
