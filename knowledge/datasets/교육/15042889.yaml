description_portal: '강원특별자치도 강릉시에서 운영하는 시민정보화교육 과정 정보를 제공하는 데이터로, 과정별 일정, 대상, 운영방법, 정원, 수강료, 접수 기간 등을 한 번에 확인할 수 있도록 구성된 자료입니다.교육과정명: 시민정보화교육 과정의 이름(예: 컴퓨터 기초, 스마트폰 활용 등)교육시작일자: 교육이 시작되는 일자(YYYY-MM-DD)교육종료일자: 교육이 종료되는 일자(YYYY-MM-DD)교육시작시각: 교육 시작 시각(h:mm, 예: 9:00)교육종료시각: 교육 종료 시각(h:mm, 예: 12:00)교육주기: 교육 진행 기간 및 주기(예: 주 3회, 2주 과정 등)교육대상구분: 수강 가능 대상(예: 일반시민, 어르신, 장애인 등)교육방법구분: 교육 방식(집합교육, 온라인교육, 혼합형 등)교육인원: 과정별 수강 정원수강료: 수강 시 납부해야 하는 비용(무료 과정 포함)운영기관전화번호: 교육 운영 기관의 대표 연락처접수시작일자: 수강 신청이 시작되는 일자(YYYY-MM-DD)접수종료일자: 수강 신청이 마감되는 일자(YYYY-MM-DD)접수방법구분: 신청 방법(방문, 전화, 인터넷 등)데이터기준일자: 교육 정보가 최종 갱신된 기준 일자(YYYY-MM-DD)이 데이터는 강릉시 시민정보화교육 과정을 체계적으로 관리하고 시민이 교육 일정·대상·운영방식·수강료·접수기간을 손쉽게 확인할 수 있도록 지원하기 위한 것으로, 디지털 격차 해소 정책 수립, 교육 수요 분석, 대상별 맞춤 과정 기획, 온·오프라인 교육 안내 서비스 구축 등에 활용할 수 있는 공공데이터입니다.'
