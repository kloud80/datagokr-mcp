summary_user: 경기도 초·중·고·특수학교별로 학교도서관이 보유한 도서자료 수, 비도서자료 수, 전체 자료 수, 전교 학생 수와 1인당 장서 수를 기준연도별로 담은 학교 단위 현황 데이터다. 학부모나 교육 정책 분석가가 "우리 시군이나 지역교육청 관내 학교 가운데 학생 1인당 장서 수가 낮은 곳은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 학교알리미 공시용 학교코드(INFO_PBLNTF_SCHOOL_CD)나 학교명·시군 코드를 매핑해 학교 기본정보, 교원·학생 통계와 연결해야 한다.
description_portal: 본 데이터는 경기도 내 초등학교, 중학교, 고등학교 및 특수학교의 학교도서관 자료 보유 현황을 나타내는 정보로, 각 학교가 보유하고 있는 도서자료수(일반도서, 연속간행물, e-book 등), 비도서자료수(DVD, CD, 비디오 등), 전체 자료수합계 및 학생 수 대비 장서 비율(1인당 장서수)을 제공합니다. 데이터 항목에는 학교명, 시군명, 지역교육청명, 학교급명, 설립구분명 등의 기본 정보가 포함되며, 도서관 자원 확보의 현황과 분포를 파악하고 교육시설의 균형 발전, 독서환경 개선, 도서관 자원 정책 수립 등의 활용 가능성이 있습니다. 해당 자료는 학교알리미 시스템을 기반으로 하며, 경기도 AI데이터행정과에서 연간 단위로 제공 및 갱신됩니다. 또한 Open API를 통해 실시간 연계가 가능하여 분석 및 시스템 개발 등 다양한 용도로 사용할 수 있습니다.
