description_portal: 지방공기업평가원 인재개발센터에서 운영하는 2026년 교육과정에 관한 정보로 과정명, 교육일수, 교육시간, 기수에 관한 데이터를 제공합니다. 지방공기업, 출자출연기관, 공무원  대상으로 대면 교육과 온라인 교육을 진행하고 있습니다. 기관 공통, 공사공단, 출자출연, 공무원 교육으로 구분되며, 교육 시작일과 종료일, 시간에 대한 정보를 제공합니다. 해당 교육과정 개설을 위해 예산 지원을 받았는지, 해당 교육과정 수강 후 노동부 환급을 받을 수 있는지 여부를 제공합니다. 실무자 중심의 실용적인 교육과 경영자 역량 강화를 위한 교육 등 다양한 교육 과정을 제공합니다. 실습중심의 교육과 이론 위주의 교육 등 다양한 교육 과정을 제공합니다.
