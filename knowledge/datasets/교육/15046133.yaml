summary_user: 경상북도영양교육지원청이 관리하는 영양군 내 학원·교습소를 교습과정(반) 단위로 담은 건별 현황 파일(CSV 약 20KB)로, 명칭·설립자·위치·강사수·교습계열·교습과목·교습기간·총교습시간·교습비·기타경비·총교습비를 포함한다. 학부모가 영양군에서 특정 과목 학원의 교습비와 교습시간을 비교하거나, 분석가가 지역 학원 분포와 교육 인프라 수준을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 교육지원청 학원·교습소 파일과는 같은 컬럼 구조로 이어 붙이고, 주소(위치)나 명칭을 문자열로 매핑해야 다른 데이터와 연결된다.
description_portal: 영양군 내에서 운영 중인 학원과 교습소의 현황을 상세히 안내하는 자료입니다. 이 데이터에는 각 학원 및 교습소의 명칭, 소재지 주소, 설립자, 교습 과목 등 학원 및 교습소 운영에 필요한 다양한 정보가 포함되어 있습니다. 해당 정보는 학원 및 교습소의 설립, 변경, 폐지 신고와 정기 지도점검, 행정처분 등 교육지원청의 공식 행정 절차를 통해 수집되며, 「학원의 설립·운영 및 과외교습에 관한 법률」 및 관련 시행령에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 해당 기준일을 기준으로 작성되어, 영양군 내 학원 및 교습소의 최신 운영 현황을 반영합니다.이 자료는 지역 내 학원 및 교습소 분포 현황 파악, 지도·감독, 교육정책 수립, 학부모 및 학생의 학원 정보 제공, 지역사회 교육환경 분석 등 다양한 분야에서 활용됩니다. 또한, 정책 담당자, 연구자, 언론 등에서 지역 교육 인프라 현황 분석, 교육 서비스 개선, 민원 대응, 시계열 변화 분석 등에도 중요한 참고자료로 사용할 수 있는 공공데이터입니다.
