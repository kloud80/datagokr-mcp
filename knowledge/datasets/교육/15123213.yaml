summary_user: 경기도청소년수련원과 산하 야영장에서 활동하는 청소년지도사의 자격 보유 현황을 시설 구분(수련원·야영장)과 연·월 단위로 집계한 자료로, 총 인원과 1급·2급·3급 자격별 인원, 기준일자를 담는다. 수련시설 운영 담당자나 분석가가 특정 시점에 수련원과 야영장의 지도사 자격 구성 비율이 어떻게 되는지, 자격급수 향상 교육 수요가 얼마인지를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명이나 같은 기관 기준으로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도청소년수련원 및 산하 야영장에서 활동 중인 청소년지도사의 자격 보유 현황을 월별로 기록한 자료입니다. 데이터는 각 시점의 시설 구분(수련원, 야영장), 총 인원수, 연도 및 월 구분, 자격급수별(1급, 2급, 3급) 인원 수로 구성되어 있으며, 해당 기준일자도 포함되어 있습니다. 이를 통해 특정 시점의 지도사 자격 구성 비율과 인력 분포를 확인할 수 있어 수련활동 품질 관리, 지도사 배치 기준 검토, 자격 수준 향상 계획 수립 등에 활용될 수 있습니다. 또한 자격등급별 인원 현황은 청소년지도사의 전문성 분석 자료로도 활용 가능하며, 각급 자격취득을 위한 교육과정 수요 예측 등에도 유용합니다.
