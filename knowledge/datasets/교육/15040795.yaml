summary_user: 인천어린이과학관이 운영하는 교육프로그램을 강좌 단위로 담은 파일로, 강좌명·정원·신청 기간·교육 기간과 시간·장소·대상·금액을 한 행에 정리한다. 학부모가 아이 나이에 맞는 과학 강좌가 언제 신청을 받고 비용이 얼마인지 확인하거나, 운영 담당자가 강좌별 정원과 금액으로 수요·예산을 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 강좌명이나 기관명 기준으로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 인천어린이과학관에서 운영하는 다양한 교육프로그램의 정보를 체계적으로 정리한 자료로, 강좌명, 정원, 신청 기간, 교육 시작·종료일, 교육 시간, 교육 장소, 교육 대상, 금액 등 프로그램 운영에 필요한 핵심 요소들을 모두 포함하고 있습니다. 이를 통해 각 강좌의 신청 가능 시기와 실제 교육 일정, 오프라인·온라인 여부, 대상 연령층까지 한눈에 파악할 수 있어 프로그램 운영 효율화와 수요 분석에 활용할 수 있습니다. 또한 금액과 정원 정보를 기반으로 예산 계획이나 참여율 평가 등 행정적 의사결정에도 기초 자료로 활용될 수 있는 유용한 데이터입니다.
