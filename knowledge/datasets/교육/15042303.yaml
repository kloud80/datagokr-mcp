description_portal: 본 데이터는 한국사학진흥재단이 수행하는 「사립학교 교육환경개선 자금 융자사업」과 관련하여 발생하는 융자 원리금 수납 실적을 체계적으로 정리한 통계 자료입니다. 해당 자료는 사립학교에 지원된 융자금의 회수 현황을 기반으로 하며, 분기별 변동금리 적용에 따라 산정된 원금 및 이자의 수납 내역을 포함하고 있습니다.수납 원금은 정상적인 상환 일정에 따른 정상상환과 차입기관의 자발적 조기상환으로 구분하여 제공되며, 수납 이자는 정상상환 이자, 조기상환 이자, 그리고 미수금 이월에 따른 이월이자를 모두 포함하여 구성됩니다. 이를 통해 자금 회수 구조와 상환 패턴을 다각도로 분석할 수 있습니다.본 통계는 융자사업의 재원 회수 안정성 및 운용 효율성을 점검하고, 향후 금리 정책 및 사업 운영 개선을 위한 기초자료로 활용될 수 있으며, 재정 건전성 관리 및 투명한 기금 운용을 위한 중요한 참고자료로서의 활용 가치가 있습니다.
