summary_user: 경기도 소재 대학·전문대학의 중도탈락 학생 수를 기준연도와 학교 단위로 집계한 자료로, 재적학생수, 중도탈락 합계, 미등록·미복학·자퇴·학사경고·유급제적·수업연한 초과 등 사유별 인원과 중도탈락 비율을 담는다. 교육 행정 담당자나 연구자가 '경기도 어느 대학에서 자퇴나 미등록으로 인한 탈락 비율이 높은가'를 확인하고 학사관리·학생지원 대책을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키나 표준 학교코드가 없어, 다른 학교 통계·재정 자료와는 학교명(SCHOOL_NM)과 기준연도를 맞춰 이름으로 연결해야 한다.
description_portal: 이 데이터는 대학 및 전문대학에서의 중도탈락 학생 현황을 정리한 자료로, 각 학교 및 학과별로 학생들의 탈락 사유와 규모를 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 기준년도, 학교종류명, 설립구분, 학과명, 재적학생수, 중도탈락학생 합계, 탈락 사유별 학생 수, 그리고 중도탈락 비율(%)이 포함되어 있습니다. 이를 통해 특정 대학·학과의 학생 유지율을 파악하고, 탈락 원인을 세부적으로 분석할 수 있습니다. 해당 데이터는 고등교육 정책 수립, 대학 학사관리 개선, 학생지원제도 마련, 중도탈락 예방 프로그램 개발 등 다양한 교육 행정 및 연구에 활용될 수 있습니다.
