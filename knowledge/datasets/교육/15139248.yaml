summary_user: 중소벤처기업연수원이 발급한 연수 수료증을 한 건씩 담은 파일로, 수료번호·과정명·연수 시작일과 종료일·수료일자·연수종류(직무역량향상, 이러닝, 정책목적, KOSME-LIVE 등)를 담고 포털 설명상 2024년에 진행된 연수가 대상이다. 연수원 운영 담당자나 분석가가 어떤 과정(CEO 아카데미, 수출 초보기업 과정 등)과 연수 형태에서 수료자가 많았는지, 월별 수료 추이가 어떤지를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과정명이나 연수종류 이름을 맞추는 방식, 또는 같은 기관(중소벤처기업진흥공단) 자료끼리만 이어 쓴다.
description_portal: '중소벤처기업진흥공단의 연수사업 수료증 정보입니다. 수료번호, 과정명, 연수시작일과 종료일, 수료일자, 연수장소, 연수종류 데이터를 확인할 수 있습니다.데이터를 통해 중소벤처기업연수원에서 운영하는 과정별 수료현황을 확인하실 수 있습니다.과정명: CEO 아카데미, 웨비나, 플립러닝, 수출 초보기업, 특성화고 인력양성사업, 맞춤연수, 마음챙김 등연수종류: 직무역량향상연수, 이러닝연수, 정책목적 연수, KOSME-LIVE연수시작일: 24년 1월~12월연수종료일: 24년 1월~12월등록일자: 23년 11월~ 24년 5월'
