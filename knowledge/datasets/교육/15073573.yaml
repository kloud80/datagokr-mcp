summary_user: 전국 대학별로 전년도 학자금 대출 실행 실적을 학기 단위로 담은 대학정보공시 집계 파일로, 일반 상환 학자금 대출과 취업 후 상환 학자금 대출 각각의 전체·등록금 대출 학생 수(명)와 금액(원)을 학교명·본분교 구분과 함께 담는다. 학자금 대출 이용이 많은 대학이 어디인지, 특정 대학에서 취업 후 상환 대출 비중이 얼마나 되는지를 따지는 교육 분석가나 진학을 고민하는 학생·학부모가 쓴다. 전역 조인 키가 없어 대학알리미 재적 학생 현황 등 다른 대학 공시 자료와는 학교명·본분교 구분을 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국장학재단의 학자금대출현황정보 데이터임(전년도 기준 대출 실행 금액(단위: 명, 원)) ※ 일반학자금대출은 "일반 상환 학자금 대출"을, 취업학자금대출은 "취업 후 상환 학자금대출"을 의미함 ※ 한국장학재단의 학자금대출 상품에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바람 ※ 대학별 재학생 수는 대학교육협의회 대학알리미 홈페이지(academyinfo.go.kr) 공시정보 4-마. 재적 학생 현황을 참고하기 바람'
