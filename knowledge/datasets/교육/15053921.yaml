summary_user: 서울특별시성동광진교육지원청 관내인 성동구·광진구 유치원을 한 곳당 한 행으로 담은 목록 파일로, 학교명·설립 구분(공립/사립)·행정구·대표 전화번호·도로명주소를 담는다. 학부모가 '광진구에 있는 공립 유치원은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 유치원 위치를 젊은 가구의 공간 분포와 주거 수요의 선행 지표로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 학교명이나 도로명주소를 매핑해 잇고, 어린이집 현황 데이터와 짝지어 영유아 시설 분포를 함께 본다.
description_portal: '서울특별시성동광진교육지원청 관내(성동구, 광진구) 유치원의 현황을 제공합니다. 제공되는 정보는 기관명(학교급), 학교명, 설립 구분(공립/사립), 행정구(성동구/광진구), 대표 전화번호, 도로명주소입니다.제공된 데이터는 현행화 시점에 따라 상이할 수 있으므로 참고 바랍니다.제공된 데이터 및 자세한 학교 위치는 성동광진교육지원청 홈페이지에서 확인하실 수 있습니다.※ 학교위치도 확인 경로: 성동광진교육지원청 홈페이지 [교육지원청소개]-[교육기관안내]-[관내학교(유·초·중·고), 학교위치도(유·초·중·고)]'
