summary_user: KOCW(대학 공개강의 공동활용 체계)에 국내 대학이 등록한 인문과학 분야 강의를 강의 한 건당 한 행으로 담은 목록 파일(csv, 약 437KB)로, 강의명·대학·교수·대분류·중분류·학년학기·학습자원 언어·라이선스·등록일시·강의 바로가기 주소를 담는다. 학습자나 교수학습자료 개발자가 '어느 대학에서 어떤 인문학 공개강의를 누가 열었고 어디서 바로 볼 수 있나'를 찾거나, 분석가가 대학별·세부 전공별 공개강의 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대학명 같은 이름 매핑으로만 이어 쓰며, KOCW의 다른 분야 강의 목록과는 같은 컬럼 구조로 합쳐 쓴다.
limits: 대학·강의를 식별하는 표준 코드가 없어 대학 공시 등 다른 데이터와 연결하려면 대학명 표기를 직접 맞춰야 한다. 포털 설명상 강의 형태에 따라 학년·학기가 공란일 수 있다.
