description_portal: 강사 수당 지급기준은 2025년 산림청 산림교육원 초빙 강사 수당 지급기준에 대한 데이터로 강사구분, 지급기준, 시간당 지급액 등 을 제공합니다. 외부강사와 내부강사로 구분되며 산림청 등 교육요청 부서의 고유 업무 수행을 위하여 업무관련자를 교육하는 시책교육과정은 내부강사 수당 지급기준으로 별도 운영합니다. 세부 운영 규정에 따라 지급 대상이 적용되며 지급 기준이 불명확한 경우 내부결재를 받아 지급액을 결정합니다. 각 항목명에 대한 항목 설명은 데이터 항목(컬럼) 정보를 참고하여 주시기 바랍니다. 해당 내용은 2026년 1월 12일 이후 교육 과정부터 적용됩니다. *특별강사 가급 지급액은 고정금액이 아닌 금액 이내입니다.
