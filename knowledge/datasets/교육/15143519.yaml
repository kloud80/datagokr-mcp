description_portal: 제주특별자치도교육청의 2026 회계년도 계약체결 현황을 제공하는 데이터입니다. 총 9가지 항목을 제공하고 있으며 회계년도, 계약기관, 계약명, 계약 시작일, 계약 종료일, 계약금액, 계약상대자, 계약방법, 목적물구분으로 구성되어 있습니다. 계약기관은 도교육청, 교육지원청 등 기관명과 학교명으로 등록되어 있고, 계약명을 체결한 계약명을 나타냅니다. 계약 시작일과 계약 종료일에서는 해당 계약건의 시작일과 종료일을 확인할 수 있습니다. 계약금액은 원단위로 계약체결 금액을 나타냅니다. 계약상대자는 계약을 체결한 상대방을 확인할 수 있습니다. 계약방법은 4가지로 구분되어 있으며 각각 1인수의, 2인이상수의, 입찰, 조달구매로 구성되어 있습니다.
