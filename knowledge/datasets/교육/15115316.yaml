description_portal: 본 데이터는 산림복지 전문 인력 양성을 위한 한국산림복지진흥원의 교육·연수과정 운영 실적을 정리한 자료입니다. 산림복지전문가는 「산림복지 진흥에 관한 법률」에 따라 산림복지서비스를 기획·운영·제공할 수 있는 자격을 갖춘 인력으로, 국민 삶의 질 향상과 산림복지서비스 품질 제고를 위해 필수적인 역할을 수행합니다. 교육연수 과정이 운영된 연도는 2024~2025년 이며, 운영된 교육 과정의 명칭은 산림정책, 산림생태계 이론, 산림교육프로그램 개발과정 등 입니다. 교육 과정명과 교육 시작일과 종료일, 교육대상과 참여인원, 교육장소를 알 수 있습니다. 산림복지서비스 품질 확보 및 전문인력 수급현황 분석에 활용 가능하며, 산림복지 관련 자격 취득자 및 인력 관리 체계화를 지원할 수 있습니다.
