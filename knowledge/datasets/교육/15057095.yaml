summary_user: 경기도 내 요양보호사 교육기관을 기관별로 한 건씩 담은 원천 목록으로, 기관명, 인허가일자, 영업상태와 폐업일자, 전화번호, 지번·도로명 주소, WGS84 좌표, 교육기관 유형을 담는다. 요양보호사 자격을 준비하는 사람이 우리 시군에 지금 운영 중인 교육기관이 어디인지 찾거나, 분석가가 시군별 교육기관 개설·폐업 추이와 접근성을 볼 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·좌표, 기관명을 매핑해 다른 복지시설·인구 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 요양보호사 교육기관의 설치 및 운영 현황을 담고 있으며, 각 기관의 명칭, 인허가일자, 영업상태, 폐업일자, 전화번호, 소재지 주소, 우편번호, 위치정보(WGS84 좌표), 교육기관 유형 등의 항목으로 구성되어 있습니다. 현재 운영 중인 기관뿐만 아니라 폐지된 기관도 포함되어 있어 요양보호사 양성 체계의 변화를 시간적으로 분석하는 데 유용합니다. 본 데이터는 고령사회 대응을 위한 인력 양성 기반 분석, 사회복지 서비스 공급 인프라 평가, 지역 간 교육 접근성 검토, 복지정책 수립 및 인력수급계획 수립 등에 활용될 수 있습니다.
