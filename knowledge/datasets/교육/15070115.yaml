description_portal: 본 데이터는 인천광역시 미추홀구립도서관 교육 프로그램에 대한 데이터로 프로그램 제목, 운영 시기, 대상, 참여인원수 등을 제공합니다. 작성대상 도서관은 용비도서관, 학나래도서관, 독정골어린이도서관, 석바위어린이도서관, 관교어린이도서관, 쑥골어린이도서관, 한우리어린이도서관, 소금꽃어린이도서관, 장사래어린이도서관, 이랑어린이도서관, 제물포어린이도서관이며, 각 도서관에서는 연중 정규 프로그램(방학특강, 독서교실, 정기프로그램), 구립도서관 특화 프로그램, 북스타트 프로그램 외 다양한 프로그램을 운영하고 있습니다. 영유아부터 성인까지 전 연령을 대상으로, 미추홀구립도서관은 평생학습의 거점으로서 독서학습 및 다양한 교양예술 등 다양한 분야를 아우르는 프로그램을 운영합니다.
