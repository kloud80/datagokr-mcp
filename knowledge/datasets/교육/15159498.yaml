description_portal: 충남 청양군 목면에 위치한 면암최익현기념관에서 실시한 교육체험프로그램에 관한 데이터를 제공합니다.2026년 주요 교육체험프로그램은 모덕이와 함께 배우는 면암 최익현, 면암투, 기념관 컬러링 색칠하기, 선비의 하루, 임금님의 비밀편지를 해독하라!, 면암의 정원, 면암의 등불 등 7종이 있습니다.교육체험프로그램은 상설 자유형 프로그램 3종과 대상별 예약형 프로그램 4종으로 나뉘어 운영됩니다. 상설 자유형 프로그램 3종은 관람객과 숙박객을 대상으로 상시 운영됩니다.대상별 예약형 프로그램 4종은  유아, 학교, 성인, 가족을 대상으로 회차별 홈페이지 사전예약으로 진행됩니다.
