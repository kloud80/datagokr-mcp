description_portal: '경기도 하남시립도서관에서 운영하는 메이커스페이스 수업의 전반적인 구조를 기록한 메이커스페이스 프로그램정보로, 각 수업을 고유 번호와 수업명으로 식별하고, 접수시작일자, 접수마감일자를 통해 접수 운영 기간관리를 체계적으로 할 수 있도록 구성되어 있습니다. 메이커스페이스시작일자, 종료일자는 실제 수업 일정 관리의 기준이 되며, 장소와 참여대상 정보는 어떤 연령대의 이용자가 어떤 공간에서 활동하는지를 보여줍니다. 수용인원수와 대기인원수는 프로그램별 정원 정책과 수요 수준을 판단하는 핵심 지표이며, 수업내용은 코딩·3D펜·3D모델링 등 창작·코딩 교육콘텐츠의 성격을 구체적으로 설명합니다. 전체적으로 이 데이터는 도서관 메이커스페이스의 프로그램 구성, 대상·정원 설계, 향후 운영계획 수립 등 도서관 창의활동 지원데이터로서 활용 가치가 높습니다. ※ 메이커스페이스 관련 사이트링크: https://www.hanamlib.go.kr/mslib/selectWebMakerSpaceList.do?key=1124&proType=PRO'
