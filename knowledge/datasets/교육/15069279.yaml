summary_user: 한국장학재단 학자금대출 금리를 대출년도·학기(1·2학기), 상품(취업 후 상환·일반상환 등), 금리변동구분(고정·변동)별로 정리한 전국 단위 기준 금리표로, 약 9KB 분량의 CSV 파일이다. 학생·학부모나 분석가가 "올해 2학기 취업 후 상환 학자금대출 금리는 얼마이고 과거 학기와 비교해 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 학자금 데이터와는 상품명·대출년도·학기를 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 한국장학재단은 경제적 여건에 관계없이 능력과 의지가 있는 학생이면 누구나 균등한 고등교육 기회를 가질 수 있도록 시중은행 보다 낮은 금리로 학자금대출을 지원하고 있습니다. 해당 자료는 학자금대출 금리에 대한 데이터로, 학기별(1학기, 2학기), 상품별(취업 후 상환 학자금대출, 일반상환 학자금대출 등), 금리변동구분별(고정금리, 변동금리) 학자금대출 금리를 제공합니다.(현재 학자금대출부에서 운영하지 않는 대출상품은 제외)학자금대출 상품에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.
