description_portal: '하남시 스마트도서관은 무인대출시스템 기반의 생활밀착형문화시설로 위례·미사·신장·미사역 등에 고르게 설치되었으며, 상시이용가능한 운영체계로 시민 독서 접근성을 높이고 있습니다. 스마트도서관은 지역균형배치로 교통 및 생활 중심지에 설치되어 누구나 편리하게 이용 가능하며, 시간 제약 없이 정보 접근권을 보장합니다. 무인대출시스템을 기반으로 이용 효율성과 관리 편의성도 확보되고 있어 공공문화서비스의 지속 가능성과 자율성을 강화하는 대표적 스마트 행정 인프라입니다.  ※ 하남시 스마트도서관 관련사이트: https://www.hanamlib.go.kr/eulib/contents.do?key=1263'
