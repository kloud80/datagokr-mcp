summary_user: 전국 초·중·고등학교의 회계연도별 세입·세출 결산을 학교(층화추출학교ID)·학교급·시도·시군구 단위로, 세입 장·관·항·목과 세출 목·세목, 정책·단위·세부사업, 원가통계비목별로 나눠 결산액·예산현액·불용액·이월액을 담은 건별 원장 파일(CSV 약 26MB)이다. 교육재정 분석가나 연구자가 '시군구·학교급별로 학교가 어떤 사업에 얼마를 쓰고 얼마를 불용·이월했는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 이름 매핑이나 같은 기관(학교알리미) 자료의 코드로만 연결한다.
description_portal: 제공하는 데이터는 전국 초·중·고등학교의 회계연도별 세입과 세출 결산 현황을 체계적으로 제공하는 공공데이터입니다. 주요 제공 항목에는 회계연도, 학교별 고유 식별자, 시도 및 시군구 명칭, 각 학교의 세입 및 세출 결산액 등 학교 단위의 재정 운영 실적이 포함되어 있습니다. 데이터는 「교육관련기관의 정보공개에 관한 특례법」 및 지방교육재정 관련 법령에 따라 수집·관리되며, 업데이트 주기는 수시(1회성 데이터)로 이루어집니다. 이 데이터는 학교별 재정 건전성 평가, 교육재정의 투명성 제고, 예산 편성 및 집행의 효율성 분석, 정책 수립, 연구 및 통계 등 다양한 분야에서 활용됩니다.
