summary_user: 서울 강남·서초 지역 학원을 한 곳씩 적은 건별 원천 파일로, 학원명·학원종류·분야구분·주소·전화번호·교습과정을 담고 총 3,772건이다. 학원가 밀집도를 보고 학원 상권이나 주택 수요 신호를 가늠하려는 분석가가 '이 동네에 어떤 학원이 얼마나 몰려 있나'를 볼 때 쓴다. 학원주소(address)를 조인 키로 삼아 주소 기준의 다른 데이터와 이어 쓰며, 다른 코드 키는 명세에 없다.
description_portal: 서울특별시강남서초교육지원청에서 관리하는 학원 현황에 대한 자료항목은 학원 종류(평생직업교육학원, 학교교과교습학원), 분야구분(국제화, 직업기술, 입시.검정 및 보습, 종합, 예능, 기예, 정보, 독서실, 기타 등), 학원주소, 전화번호, 교습과정(간호조무, 무용, 어학, 진학지도, 음악, 식음료품, 보습, 서예, 컴퓨터 등)으로 표기하며, 강남서초내에 있는 학원에 대한 정보를 쳬계화하여 관리강남서초교육지원청의 학원 업무 관련 안내는 홈페이지 학원 길-마중(학원업무 안내)에서 정보 확인 가능https://gnscedu.sen.go.kr/CMS/civilapp/civilapp0a/civilapp0a03/civilapp0a0301/index.html
