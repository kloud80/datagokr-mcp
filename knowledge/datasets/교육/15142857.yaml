summary_user: 경상남도 관내 학교별·학년별로 늘봄학교 운영 여부(아침·저녁돌봄 등)와 학생 수, 학급 수, 맞춤형·선택형 교육·돌봄 유형별 참여 인원, 유상·무상 구분, 하교 시간대별 참여 인원, 아침·저녁돌봄 참여 인원을 담은 파일(CSV 약 606KB)이다. 학부모나 정책 담당자가 '우리 시군구 초등학교 1학년 중 오후늘봄에 참여하는 학생은 몇 명이고 몇 시까지 남는가'를 확인하거나, 저녁돌봄 수요가 큰 학교를 찾는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 학교명이나 시도·시군구 이름을 맞춰 다른 학교 정보나 지역 통계와 연결해야 한다.
description_portal: 제공하는 데이터는 관내 초·중학교를 중심으로 운영되고 있는 늘봄학교 프로그램에 참여하는 학생들의 현황을 체계적으로 수집·정리한 데이터입니다. 이 데이터는 학생들의 방과후 활동 참여 실태를 파악하고 교육복지 및 지역사회와 연계된 프로그램의 효과성을 검증하기 위해 수집 및 관리하는 데이터입니다. 구체적으로는 학교별, 학년별, 성별 참여 인원 및 참여 비율 등의 정보를 포함하고 있어, 특정 프로그램의 수요 수준이나 학생들의 관심 분야를 파악하는 데 유용합니다.해당 데이터는 각 학교에서 자체적으로 운영 결과를 보고한 자료를 기반으로 경상남도교육청이 취합하여 정제·관리하는 방식으로 수집됩니다. 보유 근거는 「초·중등교육법」과 「지방교육자치에 관한 법률」 등 관련 법령 및 교육청 지침에 따라 학생의 방과후 교육 기회 확대와 학부모 부담 경감을 위한 정책 추진을 위해 마련된 것입니다.해당 데이터는 정기적으로 업데이트되며, 학기별 혹은 연도별 운영 결과를 반영하여 최신성이 유지되도록 관리됩니다. 이를 통해 교육청은 학생들의 참여 추이를 지속적으로 분석할 수 있으며, 학교 현장에서도 프로그램 기획과 운영 개선을 위한 자료로 활용할 수 있습니다.활용 분야로는 교육정책 연구, 지역별·학교별 수요 맞춤형 프로그램 기획, 교육 격차 해소 방안 마련, 지자체와의 협력 사업 개발 등이 있습니다. 또한 학부모와 지역사회는 이를 통해 교육 서비스 제공 현황을 간접적으로 확인할 수 있으며, 공공기관과 연구기관은 데이터를 분석하여 늘봄학교 운영 성과를 객관적으로 평가하고 향후 정책 개선 자료로 삼을 수 있습니다.
