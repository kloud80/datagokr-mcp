summary_user: 경기도청소년야영장이 운영한 청소년·가족 대상 프로그램별 이용인원을 사업연도·월 단위로 정리한 집계 자료로, 포털 설명상 2020년 한 해 운영분을 담는다. 청소년 수련시설 담당자나 분석가가 어떤 프로그램에 어느 교급·대상 유형이 많이 참여했는지, 경기남부와 경기북부 참가 인원이 어떻게 다른지 비교하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 데이터와는 사업명·연월 같은 이름 매칭이나 같은 기관(경기도) 자료로만 연결한다.
description_portal: 이 데이터는 경기도청소년야영장에서 2020년 한 해 동안 실시한 다양한 청소년 및 가족 대상 프로그램의 이용자 현황을 정리한 자료입니다. ‘사업년도’와 ‘사업월’은 각 프로그램이 운영된 시점을 나타내며, ‘사업명’과 ‘소분류’, ‘사업유형’은 프로그램의 명칭과 성격을 분류합니다. ‘대상유형’은 참가자의 범주(일반, 가족 등), ‘대상교급’은 참가자의 교육 수준을 구분하며, ‘참가인원수’는 전체 참여 인원을 나타냅니다. ‘경기남부참가수’와 ‘경기북부참가수’는 지역별 참가 현황을 구체적으로 제공하여 지역 간 참여도 비교가 가능합니다.
