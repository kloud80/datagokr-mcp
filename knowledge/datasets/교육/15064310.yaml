description_portal: 삼일운동데이터베이스는 삼일운동과 관련된 다양한 시위와 사건 정보를 지리정보체계와 연동하여 제공하며, 시위 참가자 수와 사망자 수 등 구체적 자료를 포함한다. 여러 지역에서 만세시위와 산상 화톳불 시위 등이 일어났으며, 일제 군경 진압과 그 과정에서 발생한 사망자 및 체포된 인원 등이 상세히 기록되어 있다. 특히 평양, 개성, 수원, 강계 등지의 시위가 대표적이며, 일제의 강력한 탄압과 이에 따른 희생이 확인된다. 이 데이터베이스는 삼일운동의 전개와 탄압 양상을 종합적으로 이해하는 데 중요한 자료임을 보여준다.
