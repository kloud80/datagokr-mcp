summary_user: 합천군에서 운영 중인 국공립·사립 보육시설(어린이집)을 시설 한 곳당 한 행으로 담은 원장 파일로, 유형·시설명·도로명주소·전화번호·대표자·원장·정원·시설인가일을 담는다(CSV 약 1KB 규모). 합천군 주민이 집 근처 어린이집의 유형과 정원, 연락처를 확인하거나 분석가가 군내 보육 정원 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 도로명주소(위치)를 기준으로 맞춰 이어 쓴다.
description_portal: '본 데이터는 합천군에서 운영 중인 국공립 또는 사립 보육시설에 대한 유형, 시설명, 위치(도로명주소), 전화번호, 대표자, 원장, 정원, 시설인가일에 대한 정보를 제공하고 있습니다.보육시설 : 영유아가 보호자의 돌봄을 받기 어려운 시간 동안 안전하게 보호받고, 발달 수준에 맞는 교육과 돌봄을 제공받는 공간입니다. 특히 맞벌이 가정, 한부모 가정, 취약계층 아동 등 양육지원이 필요한 가정에 필수적인 사회적 기반시설로, 보육은 단순한 돌봄을 넘어 아동의 인지·사회성·정서 발달을 지원하는 중요한 기능을 수행'
