summary_user: 경기도일자리재단이 운영하는 온라인경력개발센터 '꿈날개'의 교육과정을 과정 단위로 담은 목록으로, 과정명·게시판 종류(정규과정·열린과정 등)·카테고리·교육분야·교육목표와 내용·차시 목록·학습시간·상세URL이 들어 있다. 경력단절 여성이나 구직자·직업전환자가 "자격증 준비에 쓸 무료 온라인 강좌가 어떤 분야에 몇 시간짜리로 있는가"를 찾을 때, 또는 상담·안내 서비스에서 과정을 추천할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육분야·과정명 같은 이름 매핑으로만 느슨하게 이을 수 있고, 국가자격 종목·시험 일정 데이터와 연결하려면 과정명에서 자격 종목명을 직접 맞춰야 한다.
description_portal: 경기도와 여성가족부가 함께하는 온라인경력개발센터 ‘꿈날개’ 플랫폼을 통해 제공되는 다양한 교육과정 정보를 포함하고 있습니다. 과정명, 게시판 종류(정규과정, 열린과정 등), 카테고리, 교육분야, 교육목표 및 교육내용, 학습시간, 상세URL 등이 제공되며, 일부 과정은 자격증 취득 준비를 위한 커리큘럼으로 구성되어 있습니다. 이 자료는 사용자 맞춤형 경력개발과 직무 능력 향상을 위한 디지털 학습 콘텐츠 탐색에 유용하며, 개인의 자기주도 학습, 취업 준비, 직업전환 등 다양한 목적에 활용될 수 있습니다.※ 온라인경력개발센터는 경기도일자리재단에서 운영 중인 경력개발 및 취업지원 센터입니다.
