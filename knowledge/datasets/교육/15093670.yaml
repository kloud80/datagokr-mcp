description_portal: 여수시립도서관 도서대출 회원이면 누구나 도서관을 직접 방문하지 않고도 365일 기기에 비치된 도서를 이용자가 스스로 대출 반납할 수 있는 무인자동화 장비가  설치된 스마트도서관을 운영 중입니다.2017. 11월에 여수시 국포1로 36 국동 롯데몰 1층 캠핑존 앞에 구축하여 운영 중인 국동 365열린도서관에 비치된 도서 정보를 상세히 안내합니다.도서등록번호, 도서명, 비치상태, 국제표준도서번호(ISBN), 저자명, 출판사명, 발행년도, 스마트도서관 비치일, 분류 카테고리명 등의 9개 항목의 도서 정보를 제공합니다.
