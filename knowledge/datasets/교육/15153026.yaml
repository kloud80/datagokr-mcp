summary_user: 한국기술교육대학교 학부가 교과목 운영에 쓰는 NCS(국가직무능력표준) 분류 코드표로, 분류 항목마다 식별번호·분류명·상위 분류 식별번호·분류 레벨(4단계)·등록 출처(표준·센터·학부·교수)를 한 행씩 담은 CSV 파일(약 90KB)이다. 직업교육 교과목을 NCS 직무와 연결하려는 분석가나 교육 담당자가 '이 학과 교과목은 어떤 NCS 대·중·소분류 직무에 해당하는가'를 확인하는 데 쓴다. NCS 식별번호(job_code)를 키로 다른 NCS 기반 교과목·훈련과정·자격 데이터와 이어 쓰고, 상위 식별번호로 같은 표 안에서 분류 계층을 위로 따라간다.
description_portal: '해당 자료는 한국기술교육대학교 학부에서 사용하는 NCS 분류 표준정보 코드입니다.주 사용 대상은 한기대 내 학부(과)이며 교과목 운영에 사용하는 정보입니다. 한국기술교육대학교 NCS 분류 표준정보는 아래와 같은 데이터 항목을 제공합니다.- 제공항목 : 기관코드,NCS식별번호,NCS분류명,상위NCS식별번호,NCS고유번호,NCS분류레벨구분,출처구분,등록일자,수정일자  * NCS 고유번호 : 순번값, NCS분류레벨구분 : 10,20,30,40 (숫자가 작을수록 더 상위레벨)    출처구분(등록 출처) : 10 - 표준, 20 - 센터, 30 - 학부 , 40 - 교수* 해당 자료는 당해 학사 교과목 운영 정책에 따라 변동될 수 있으며,연간 갱신 예정입니다.'
