summary_user: 사립대학과 학교법인의 법인일반·교비 회계 자금계산서를 학교·법인·회계 구분별로 담은 집계 파일로, 등록금·입학금·수업료 수입과 전입금·기부금 수입 등을 계정 단계별 열(단위 천원)로 담는다. 대학 재정 분석가나 진학·정책 담당자가 '이 사립대학은 운영수입 중 등록금 의존도가 얼마이고 법인이 법정부담전입금을 얼마나 내는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대학 공시·재정 자료와는 학교명·법인명 이름 매칭이나 학교급·학종·지역 구분으로만 연결한다.
description_portal: '한국사학진흥재단_사립대학 법인일반 및 교비 자금계산서는 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 법인일반 및 교비 자금계산서 자료를 통해 학교법인 및 사립대학의 전입금수입, 기부금수입, 인건비, 관리운영비 등의 내역을 학교별, 법인별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
