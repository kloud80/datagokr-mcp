summary_user: 경기도 인재개발원이 운영한 사이버교육·집합교육 과정의 교육생 설문을 통계년월·설문지 단위로 담은 자료로, 설문문항수·답변수·페이지수·강사설문 여부·설문참여교육생수 같은 설문지 운영 현황을 기록한다. 공무원 교육 담당자나 분석가가 '어떤 교육 과정 설문에 교육생이 얼마나 참여했고 설문지는 어떻게 구성됐는가'를 살피고 교육 만족도 조사 운영을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 학교코드 등 다른 교육 데이터와 바로 붙지 않으며, 설문지명 같은 이름으로 맞추거나 같은 기관(경기도) 자료와만 연결된다.
description_portal: 이 데이터는 경기도 인재개발원에서 운영한 각종 교육 과정에 대해 교육생을 대상으로 실시한 설문 현황을 기록한 자료입니다. 설문은 주로 만족도 측정을 위한 것으로, 사이버교육 및 집합교육을 포함한 다양한 형태의 교육 과정에 대한 피드백을 수집합니다. 주요 항목으로는 ‘통계년월’, ‘설문지명’, ‘설문지구분’, ‘설문지사용매핑수’, ‘강사설문여부’, ‘이미지사용여부’, ‘설문문항수’, ‘설문문항답변수’, ‘설문지페이지수’, ‘설문지분기사용여부’, ‘설문참여교육생수’ 등이 있으며, 이를 통해 각 교육과정의 질을 평가하고 향후 교육 개선의 기초자료로 활용할 수 있습니다. 이 데이터는 교육 프로그램 만족도 평가, 강의 콘텐츠 개선, 수요자 중심 교육 설계 등에 유용하게 활용될 수 있습니다.
