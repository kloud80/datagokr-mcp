summary_user: 강원특별자치도교육청 관내 학교별 통학차량(에듀버스) 한 대씩을 행으로, 지역, 운영 구분(강원에듀버스/특수학교 통학편의), 소속기관, 운용 학교급·학교명, 차고지, 차량번호, 차명·차종·차형, 인승을 담은 CSV 파일이다. 학부모나 교육행정 분석가가 특정 지역·학교에 어떤 통학차량이 몇 인승으로 배치돼 있는지, 지역별 통학 지원 차량 규모가 어떤지 확인하는 데 쓴다. 전역 조인 키(표준 학교코드 등)가 없어서 학교 기본정보 등 다른 데이터와는 학교명·지역명을 이름으로 맞춰 이어야 한다.
description_portal: 강원특별자치도교육청 지역 학교별 에듀버스(통학차량) 운영 현황입니다.지역별 통학차량 운영 구분(강원에듀버스/특수학교 통학편의), 통학차량 소속기관, 통학차량 운용기관(급별), 통학차량 운용기관(학교)명, 차고지, 차량번호, 차명, 차종, 차형, 인승 정보를 제공합니다.참고로 학교안전지원시스템(www.schooolsafe24.or.kr)을 통해서전국의 어린이 통학버스 등록현황(운영자, 운전자, 동승자 안전교육 이수 여부 등), 통학버스 통계 현황을 해당 누리집에 접속하여 확인할 수 있습니다.
