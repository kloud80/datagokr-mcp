description_portal: 이 데이터는 서울특별시교육청 성북강북교육지원청 관할 지역에 위치한 유치원을 대상으로, 각 기관별 교직원의 직위(원장, 원감, 교사 등) 및 자격(정교사·수석교사·준교사 등) 보유 현황을 정리한 것입니다.총 53개 유치원에 대한 정보를 포함하며, 설립 유형(사립 법인/사립 사인), 교원 직위별 인원수(원장수, 원감수, 보직교사수, 일반교사수 등), 기간제 여부, 강사 및 사무직원 수, 교원 자격별 인원수(정교사1급·2급, 수석교사 자격 등), 공시 차수 및 주소 정보가 함께 제공됩니다.이 데이터는 성북구 유치원 인력 구성의 분포를 비교하거나 교사 수급 정책 검토, 유치원별 인력 규모 분석, 유아교육 기관 운영 현황 파악 등 다양한 행정·연구 목적에 활용될 수 있습니다.데이터는 표준화된 구조로 제공되며, 각 유치원의 고유 코드와 함께 직위·자격별 교직원 수가 정량적으로 기록되어 있어 기관별 인력 규모 파악, 교원 자격 현황 분석, 지역 간 인력 편차 비교 등 데이터 기반 의사결정에 유용합니다.
