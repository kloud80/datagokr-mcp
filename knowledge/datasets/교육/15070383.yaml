description_portal: '한국학중앙연구원의 한국학 디지털아카이브 음성자료 목록으로, 한국 구술문화를 체계적으로 수집·정리한 메타데이터 형식의 디지털 자료입니다. 데이터는 아카이브에 수록된 음성 기반 자료들을 목록화한 것으로, 자료 유형에 따라 포함된 항목이 상이합니다.⊙한국학방안자료: 각 음성 테이프의 제목(테잎명), 채록자(자료 수집자), 구술자(이야기 주체) 등의 정보가 포함되어 있어, 채록 환경과 발화자의 맥락을 확인할 수 있습니다.⊙한국민요대관: 수록된 민요의 제목(노래명), 구연자, 그리고 민요가 수집된 조사지 정보가 포함되며, 지역적 전승 양상과 구술자의 특성을 함께 분석할 수 있습니다.⊙한국구비문학대계: 이 항목에는 서명(작품명), 구연자, 채록지(수집 장소), 그리고 자료의 장르 유형(예: 민요, 설화, 무가, 수수께끼 등)과 같은 텍스트 기반 분류 정보가 함께 수록되어 있어 문학적·민속학적 활용도가 높습니다.이 데이터는 구술문화, 민속학, 한국어 방언 연구, 민요 및 무속 음악 분석 등 디지털 인문학 및 지역 문화연구에 매우 유용한 1차 자료로 활용됩니다.'
