description_portal: '"전북대학교 중앙도서관 소장 과학기술자료 목록" 데이터는 전북대학교 중앙도서관에서 소장하고 있는 과학기술분야 국내외 단행본, 연속간행물(저널), 보고서 등의 서지정보를 제공합니다. 각 도서의 서명, 저자, 출판사, 출판년, 청구기호, 권호사항, 소장처와 자료실 정보를 제공하고 있어 전북대학교 도서관의 과학기술자료를 이용하고자 하는 이들에게 도움이 됩니다.전북대학교는 지역거점국립대학교로 도서관에서는 방대한 자료를 갖고 있으며 해당 데이터는 320,000여 과학기술분야 자료의 정보를 제공하므로, 해당 분야 연구자들 및 학습자들이 학술 연구 활동에 활용하는 데 도움이 됩니다. 특히 전북대학교 도서관은 지역 개방을 하고 있습니다. 이 데이터 공개를 통해 지역 내 연구자와 시민의 정보접근성을 높이고, 지식확산과 데이터 기반 연구 생태계 조성에 기여하고자 합니다.'
