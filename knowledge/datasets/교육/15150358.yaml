summary_user: 과정평가형 국가기술자격의 종목별 시험기준을 종목(종목코드·종목명) 단위로 담는다. 평가비율, 합격기준점, 응시료 적용비율, 계좌이체·카드결제·가상계좌 사용 여부를 포함한다. 과정평가형으로 자격을 따려는 수험생이나 훈련기관이 '이 종목은 내부·외부평가를 어떤 비율로 반영하고 몇 점 이상이면 합격인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 종목코드(jmCd)나 종목명으로 같은 기관의 능력단위별 내부평가방법·직업기초능력, 시험 일정, 합격률 데이터와 맞춰 쓴다.
description_portal: 과정평가형 종목별 시험기준 조회 API 서비스는 종목명, 종목코드, 평가비율, 합격기준점, 계좌이체 여부 등을 제공하며, 조회된 종목코드를 기반으로 능력단위별 내부평가방법과 직업기초능력 정보를 제공하는 API입니다
