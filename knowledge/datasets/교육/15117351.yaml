description_portal: 한국장학재단은 한국장학재단 설립 등에 관한 법률에 따라 설립된 준정부기관입니다.대표사업으로는 국가장학금, 학자금대출, 우수장학금, 국가근로장학금, 복권기금 꿈사다리 장학금, 교육급여 바우처 사업 등과 인재육성사업, 기숙사 사업 등이 있습니다.재단은 정보공개법에 따라 국민 생활에 영향을 미치는 중요한 정보를 사전에 선정하여 재단 홈페이지에 공개 하고 있습니다.재단 홈페이지에 접속하여 정보공개 -사전정보공표에서 조회하시면 사전정보내용을 확인 하실 수 있습니다.한편 재단은 비공개 세부기준을 공개하고 있으며 정보공개 청구전에 사전정보공표와 비공개 세부기준을 확인 하신후에 정보공개 청구절차를 진행하시길 바랍니다.재단의 정보는 공개가 원칙이나 정보공개법 제9조 비공개 정보에 해당되는 경우에는 정보가 비공개 됩니다.한편 재단은 국민이 원하는 정보를 제공하기 위하여 정보공개 고객의 소리를 운영하고 있습니다. 국민이 원하는 신규 사전정보를 발굴하기 위하여 소중한 고객의견을 청취하고 수집하고 있으며 정보공개 고객의 소리에 다양한 의견의 제시하여 주시길 바랍니다.제시된 의견은 검토과정을 거쳐 신규 사전공표항목으로 반영될 예정입니다.
