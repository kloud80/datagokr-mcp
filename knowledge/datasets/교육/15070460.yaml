summary_user: 한국장학재단 대학생 청소년교육지원장학금(대학생이 초중고생을 멘토링하고 장학금을 받는 사업)의 참여대학 목록으로, 대학별·장학년도별로 상품명, 설립구분, 지역, 사업 참여 여부를 한 행씩 담은 약 14KB 분량의 전국 범위 CSV 파일이다. 학생·학부모가 "우리 대학이 올해 이 멘토링 장학사업에 참여하는가"를 확인하거나, 분석가가 지역·설립구분별 참여대학 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 대학 데이터(대학 공시, 다른 장학 사업 등)와는 대학명 문자열을 맞춰서만 연결한다.
description_portal: '대학생 청소년교육지원장학금 멘토링 참여대학 관리 정보: 사업 상품명, 참여 대학명, 설립구분, 지역, 사업 참여 여부에 관한 정보를 제공함데이터 제공항목은 사업 상품명, 참여 대학명, 설립구분, 지역, 사업 연도, 사업 참여 여부가 있습니다. 대학생 청소년교육지원장학금은 대학생이 초중고등학생 대상으로  멘토링을 지원하고, 대학생에게는 장학금을 지원하는 것을 목적으로 합니다. 대학생 청소년교육지원장학금 관련 정보는 "한국장학재단 누리집(https://www.kosaf.go.kr) > 인재육성 > 대학생지식멘토링 > 대학생 청소년교육지원장학금"에서 확인 가능'
