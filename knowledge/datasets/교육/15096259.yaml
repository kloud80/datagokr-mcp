description_portal: 충남도립대학교 해외 복수학위제 프로그램은 해외 교류대학과의 연계를 통해, 학생들의 해외 학위 취득을 기반으로 전공 전문성과 진로 확장을 지원하여 국제적 경쟁력을 갖춘 인재를 양성하기 위해 운영하는 프로그램입니다.본 데이터에서 제공되는 내용은 2013년부터 2025년까지 충남도립대학교의 복수학위제 운영 현황(장학금, 참여인원, 유학국가, 현지취업 등) 입니다.복수학위제 장학금은 충남도립대학교 복수학위제 운영 규정에 따라 교류대학의 등록금 기준에 준하여 지급됩니다.참여자는 지원자격을 갖춘 자를 대상으로 별도의 선발시험(어학시험 및 면접심사)을 통해 선발합니다.프로그램은 주로 캐나다를 대상국가로 운영하고 있습니다.운영국가의 교류대학을 발굴하여 업무협약을 체결, 본교에서 선발된 학생을 파견하여 교류대학의 정규 교육과정에 참여합니다.현지취업자는 데이터 기준일 기준 해외에 취업, 거주 중인 자로 조사된 자의 수 입니다.비고에 명시된 내용은 참고 사항 입니다.2021학년도는 코로나19로 인하여 해외 파견이 불가하여 복수학위제 프로그램을 미운영 하였습니다.[변경사항]기존 데이터에서 2024학년도, 2025학년도 데이터를 추가하였습니다.[주요내용]- 2013년부터 2025년까지 총 61명을 파견하였음- 장학금은 누적 1,271,480천원을 지급하였음- 유학국가는 2013년부터 계속해서 캐나다로 운영하였음- 현지취업자는 2025년 9월 기준 20명으로 파악됨
