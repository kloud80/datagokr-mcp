summary_user: 과정평가형·일학습병행자격의 종목별(버전별) NCS 능력단위와 최소교육훈련시간 등 세부정보를 종목코드(jmCd)·종목명·등급·NCS 대분류·시행/관리기관 단위로 담은 전국 범위 API입니다. 일학습병행 훈련을 설계하는 기업·훈련기관 담당자가 '이 자격 종목을 취득하려면 어떤 NCS 능력단위를 몇 시간 이상 교육해야 하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 자격·훈련 데이터와는 종목코드·종목명·NCS 대분류코드 같은 이름·코드 매핑이나 같은 기관(한국산업인력공단) 코드로만 연결한다.
limits: 학교코드 같은 표준 키가 없어 학교 기본정보·교육 통계와 직접 붙이지 못하고, 종목명·코드 매핑으로만 연결된다. 비공간 데이터라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 1,000회 호출로 제한된다.
