description_portal: 창원시 성산구 충혼로72번길 16 중앙동에 위치한 창원 과학 체험관은 어린이와 청소년들에게 미래의 꿈과 희망을 심어줄 과학의 터전이자 요람이 되고자 다양한 체험과 교육을 마련한 시설입니다.해당 데이터는  2026년 기준으로 구성된 교육 목록이며 자세한 세부 교육은 데이터 연결 링크로 접속하여 확인 및 신청이 가능합니다.모든 프로그램은 프로그램별로 모집인원, 교육비가 상이하며 선착순 신청으로 조기에 마감이 될 수 있습니다.신청완료 후 마감 시 대기자 등록은 전화로 문의해주시기 바랍니다.공휴일이나 행사가 있을 시에는 프로그램 일정이 변경 될 수 있으니 이 점 유의하여 데이터 활용해주시기 바랍니다.자세한 사항은 과학체험관 홈페이지(https://www.cwsc.go.kr/sub03/sub01_01.php)를 통해 확인가능하십니다.
