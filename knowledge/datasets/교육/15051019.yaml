description_portal: '이 문서는 2016년 4월 기준 특수교육 주요 현황을 담고 있으며, 특수학교와 일반학교 내 특수학급 및 특수교육 지원센터에 속한 총 87,950명의 특수교육대상자 수를 포함합니다. 시각장애, 청각장애, 지적장애 등 다양한 장애유형별 학생 수와 학급 수, 교원수 및 특수교육 보조인력 수 등 교육통계가 상세히 제시되어 있습니다. 이를 통해 특수교육 기관의 분포와 학생 현황, 교원 및 지원 인력의 규모를 종합적으로 파악할 수 있어 교육 정책과 지원체계 개선에 유용한 자료임을 알 수 있습니다.제공데이터 : 영역별학교급별 특수교육대상자 수, 특수학교 수, 특수학급 수, 특수교육지원센터 수 등, 2016년 4월 기준으로 데이터 작성.'
