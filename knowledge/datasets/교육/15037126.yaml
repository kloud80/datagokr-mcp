description_portal: 성남시 공공도서관에서 운영하고 있는 강좌(컴퓨터교육, 문화교실, 문화강좌, 독서회) 정보입니다.(도서관명,강좌명,대상,장소,강좌시작-종료시간,접수 시작-종료일 등)※ 해당 데이터는 OpenAPI로도 개방하고 있습니다. 성남시 도서관 강좌정보는 성남시 공공도서관에서 운영하는 다양한 교육 및 문화 프로그램 정보를 담은 자료입니다. 이 자료는 시민 대상 강좌의 정보로 기관명(도서관명), 강좌명, 강좌 시작 및 종료일, 접수인원, 온라인 접수 인원, 수강인원(여성, 남성), 강좌대상, 결제금액, 운영형태(온라인, 오프라인), 강좌장소, 접수링크, 전화번호 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.
