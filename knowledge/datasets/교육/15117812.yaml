description_portal: 군산시민들이 평생교육을 위해 결성한 동아리에 대한 알림입니다. 노래교실을 비롯한 각 동아리의 회원 및 현재 상태, 또한 동아리 활동에 대한 내용입니다시민들의 자발적인 참여로 결성되어 우리시의 평생학습 문화를 풍요롭게 가꾸어 가고 있는 다양한 동아리의 현황을 안내하며, 각 동아리의 현재 회원 구성과 활동 현황은 물론 활동계획, 활동 내용까지 상세하게 확인 가능합니다. 문학, 미술, 음악, 사진 등 각양각색 분야에서 시민들의 삶에 새로운 활력을 더하고, 이웃과 함께 관심사를 나누며 성장하는 평생 교육 동아리의  활동을 나타냅니다.
