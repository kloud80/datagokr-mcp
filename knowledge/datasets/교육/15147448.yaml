description_portal: 「서울도시연구」는 서울을 비롯한 도시 관련 연구 중심의 전문학술지로 1993년부터 발간해 오던「서울市政硏究(서울시정연구)」를 개편해 2000년에 창간되었습니다. 2010년 한국연구재단 KCI 등재지로 등록된 이후에도 오랫동안 우수한 평가를 유지하였지만, 게재논문(2019년 6월호) 연구윤리에 미흡하게 대응하여 2022년 11월 등급이 하락하였습니다. 이에 「서울도시연구」는 재도약을 위해 2024년 2월 현재 연구윤리 관리체계와 절차를 정비하였고, 투고자 중심으로 저널 서비스를 개선해 등급 재심사를 준비하고 있습니다.
