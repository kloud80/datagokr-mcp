summary_user: 대학알리미 공시를 바탕으로 국내 대학별 교육여건 지표(교지·교사 확보율, 기숙사 수용 현황, 수익용 기본재산 확보율, 학생 1인당 자료 구입비)를 담은 전국 범위 API로, 6개 오퍼레이션이 실호출로 확인됐다. 수험생·학부모가 지원 대학의 기숙사 수용 여건을 비교하거나, 분석가가 재학생 수 대비 기숙사 수용 인원으로 대학가 원룸 수요를 추정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대학명 매핑이나 같은 기관 코드로만 다른 데이터와 잇고, 필수 파라미터인 학교 코드(schlId)는 다른 대학알리미 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 본 데이터는 한국대학교육협의회에서 운영하는 대학알리미를 기반으로 수집된 것으로, 국내 대학의 교육여건 현황을 종합적으로 제공..주요 항목으로는 대학의 물리적 및 재정적 교육 인프라 수준을 파악할 수 있는 지표들이 포함되어 있으며, 구체적으로 교지 및 교사 확보율, 기숙사 수용 현황, 수익용 기본재산 확보율, 학생 1인당 자료 구입비 등이 제공.교지·교사 확보율은 대학이 교육 및 연구 활동을 수행하기 위해 확보한 토지와 건물의 적정 수준을 나타내며, 기숙사 수용 현황은 재학생 대비 기숙사 수용 가능 비율을 통해 학생 주거 지원 여건 제공. 또한 수익용 기본재산 확보율은 대학의 재정 안정성과 자립도를 판단할 수 있는 지표이며, 학생 1인당 자료 구입비는 도서 및 학술자료 투자 수준을 통해 교육·연구 지원 환경을 평가하는 데 활용.본 데이터는 대학 간 교육환경 비교, 고등교육 정책 수립, 연구 분석 및 대국민 정보 제공을 목적으로 활용.
