summary_user: 대구광역시교육청 에듀나비교육포털(대구교육아카이브)에 올라온 교수학습용 영상자료의 목록을 영상 한 건당 한 행으로 담으며, 실측 컬럼은 채널명·콘텐츠 제목·등록일시 세 가지이고 파일은 약 62KB 크기의 CSV다. 교사나 교육 콘텐츠 개발자가 "수업에 쓸 만한 대구교육청 제작 영상이 어떤 채널에 언제 올라왔나"를 찾아보거나 영상 목록을 서비스에 연계할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 채널명이나 콘텐츠 제목 같은 이름을 맞추는 방식으로만 이어 쓸 수 있다.
description_portal: 에듀나비교육포털(대구교육아카이브)은 대구광역시교육청이 운영하는 디지털 교육자원 플랫폼으로, 지역 내 초·중·고등학교 교원을 위한 교수학습 자료를 체계적으로 수집·관리하고 있습니다. 본 데이터는 해당 포털에서 제공되는 교수학습용 영상자료에 대한 메타정보를 포함하고 있으며, 자료명(제목), 등록일시, 대상 학년 및 교과, 제작기관 등 주요 속성 정보를 제공합니다. 이는 교사들이 수업 자료를 효과적으로 활용할 수 있도록 돕고, 학습자 중심의 수업을 설계하는 데 기여하기 위한 기반 자료로 활용됩니다. 영상자료는 교육과정에 부합하는 다양한 주제와 형식으로 구성되어 있으며, 수업 보조 자료로서의 활용도 외에도 자율학습, 보충학습, 원격수업 등 다양한 교육현장에서 활용이 가능합니다. 공공데이터로서의 개방을 통해 민간에서도 교육 콘텐츠 연구, 애플리케이션 개발, 콘텐츠 연계 서비스 등 다양한 방식으로 재활용할 수 있는 가능성을 제공합니다.자세한 자료는 대구미래교육연구원 교수학습지원부 미디어교육센터(053-231-1397)로 연락바랍니다.
