summary_user: 경기도 내 초등학교·중학교·고등학교를 학교 한 곳당 한 행으로 담은 목록으로, 학교급·공사립 구분, 학교명, 전화번호, 홈페이지, 도로명·지번 주소, 우편번호, 위경도 좌표를 포함한다. 학부모나 분석가가 '우리 동네 반경 안에 어떤 공립·사립 학교가 있는가', '시군별 학교 분포와 통학권은 어떤가'를 확인할 때 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없으므로 다른 학교 통계·재정 데이터와는 학교명·주소로 매핑하거나 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 「초중고등학교 현황」 데이터는 경기도 내 시군별 초등학교, 중학교, 고등학교에 대한 정보를 제공하는 자료입니다. 주요 항목에는 학교구분명(SCHOOL_DIV_NM), 공사립구분명(PLVTINST_DIV_NM), 시설명(FACLT_NM), 전화번호(TELNO), 홈페이지주소(HMPG_ADDR), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), 위도(REFINE_WGS84_LAT) 및 경도(REFINE_WGS84_LOGT)가 포함되어 있습니다. 이 데이터는 각급 학교의 분포 현황, 위치 정보, 공·사립 구분을 분석할 수 있어 교육자원 배분, 통학권 분석, 교육정책 수립 등에 활용도가 높습니다. 또한, Open API(https://openapi.gg.go.kr/GgSchoolM)를 통해 특정 학교명이나 주소를 조건으로 검색할 수 있어, 연구·행정·민간 서비스 개발 등 다양한 영역에서 활용이 가능합니다. 해당 데이터는 교육취업 분야에 속하며, 상업적 이용 및 콘텐츠 가공이 허용되어 공공성과 민간 활용성이 동시에 보장됩니다.
