description_portal: 문화체육관광부 국립국어원에서 운영하는 한국어교수학습샘터는 전 세계 한국어 교육자, 학습자, 연구자들을 대상으로 한국어 교수 학습 자료를 제공하고 있습니다. 국립국어원 개발 한국어교재와 국립국어원에서 연구한 한국어 문법 어휘 등 기초 연구 자료 등 다양한 정보를 제공하고 있는 한국어교수학습샘터의 자료는 한국어교육, 한국어 연구, 한국어학습에 활용할 수 있습니다. 본 데이터는 한국어교수학습샘터에서 제공하는 과정 콘텐츠 정보(콘텐츠 차시 등 콘텐츠 관리를 위한 정보 포함)를 종합적으로 수록하고 있습니다. 콘텐츠명, 제공사, 차시명 등의 정보를 포함하고 있어 교수자와 연구자가 효과적으로 자료를 탐색하고 활용할 수 있도록 지원합니다.
