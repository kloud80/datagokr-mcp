summary_user: 서울특별시교육청 소관 학교법인(포털 설명 기준 133개)과 사립학교를 운영하는 재단법인(6개)을 법인 한 건씩 담고, 법인명·설립자·설립일·사무실 소재지와 그 법인이 설치·경영하는 유치원·초·중·고등학교 이름과 학교 수(총 276개교)를 함께 적은 명부다. 학부모나 분석가가 서울의 특정 사립학교가 어느 학교법인 소속인지, 한 법인이 몇 개 학교를 운영하는지 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교 기본정보·통계와는 학교명이나 법인명을 맞춰 이어 붙여야 한다.
limits: 학교코드 등 공통 키가 없으므로 다른 학교 데이터와는 이름 매칭으로만 연결되며 동명 학교에 주의해야 한다. 대학을 운영하는 대학법인은 포함하지 않고, 서울 내 고등학교 이하 학교를 운영하는 법인만 다룬다.
