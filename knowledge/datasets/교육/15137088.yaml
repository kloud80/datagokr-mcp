summary_user: 전국 초·중등 학교의 학사일정을 학교·날짜별 행사 단위로 담은 나이스 외부 API이다. 학부모나 앱 개발자가 '우리 아이 학교의 다음 달 행사일과 수업공제일이 언제인가' 같은 질문에 쓴다. 학교 식별 키 neis_school_cd(SD_SCHUL_CODE)로 같은 나이스 일상 정보의 급식·시간표·학급 데이터와 이어 쓴다.
description_portal: 시도교육청이 제공하는 나이스 교육정보와 관련하여 교육정보 개방 포털에서 학사일정을 포함한 다양한 데이터를 서비스하는 내용을 담고 있습니다. 사용자는 인증키 발급 후 이를 활용 가이드에 따라 웹 또는 모바일 어플리케이션 개발에 활용할 수 있으며, 제공되는 데이터에는 학교명, 학년도, 수업일자 등 여러 항목이 포함되어 있습니다. 파일 다운로드 기능도 가능하며, 해당 기관의 정책에 따라 트래픽 수는 상이할 수 있음을 안내합니다.(제공데이터)시도교육청명, 행정표준코드, 학교명, 학년도, 주야과정명, 학교과정명, 수업공제일명, 학사일자, 행사명, 행사내용, 학년별 행사여부, 수정일자 항목을 제공파일 다운로드 가능
