description_portal: '사학분쟁조정위원회는 관할청의 요청에 따라 임시이사의 선임과 해임, 학교법인의 정상화 추진 등 다양한 사립학교 관련 심의사항을 다룹니다. 위원회는 회의결과를 투명하게 공개하며, 안건 및 심의결과, 참석위원 정보와 다음 회의 일정도 제공합니다. 이를 통해 사학분쟁에 대한 조정과 학교법인 운영의 정상화를 지원합니다.사학분쟁조정위원회는 관할청(교육부장관 또는 시·도교육감)의 요청에 따라 ① 임시이사의 선임, ② 임시이사의 해임, ③ 임시이사가 선임된 학교법인의 정상화 추진에 관한 사항, ④ 기타 관할청이 심의를 요청한 사항 등에 관하여 심의한 결과를 개방합니다.다운로드 데이터 항목 : 사학분쟁조정위원회 회의결과 회차, 일시 및 장소, 참석위원, 안건 및 심의결과, 차기 회의 일정, 회의결과 게시물의 URL'
