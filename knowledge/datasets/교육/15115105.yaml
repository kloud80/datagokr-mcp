summary_user: 한국장학재단과 협력해 학자금대출 이자지원 사업을 하는 시·도·군 지자체별로 협약일시, 지원연도·학기, 지원상품명, 지원방식을 한 행씩 담은 전국 범위 목록 파일(csv, 약 39KB)입니다. 대학생·청년이 '내가 사는 지자체가 학자금대출 이자를 지원하는지, 어떤 상품으로 어느 학기에 지원하는지' 확인하거나, 분석가가 지역별 이자지원 운영 현황을 비교하는 데 쓴다. 전역 조인 키는 없고, 지자체명이나 시도명(지자체주소)을 행정구역 이름으로 맞춰 다른 지역 통계와 잇는 방식으로만 연결한다.
description_portal: 학자금대출 이자지원 사업을 한국장학재단과 협력하여 수행하는 지방자치단체(시,도,군) 목록 및 지원상품 정보를 제공합니다.지자체 이자지원 사업은 학자금대출자의 원리금 상환부담을 경감하여 청년의 학업 전념 및 지역사회 진출을 지원합니다.각 지자체별로 지원조건이 상이하므로 상세한 요건은 각 지자체의 홈페이지를 참고해주시기 바랍니다.※ 일부 지자체의 경우 원금과 이자를 함께 지원함.※ 지원학기가 0학기인 경우 학기구분 없는 연간 운영을 의미함.※ 상세 정보는 한국장학재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition07)를 참고바랍니다.
