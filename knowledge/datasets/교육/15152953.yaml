summary_user: 경기도 사이버도서관에서 도서관별·예약일별로 집계한 도서 예약 건수(예약일, 도서관코드, 도서관명, 예약건수)를 담는 일별 집계 데이터입니다. 도서관 운영자나 정책 분석가가 특정 도서관이나 날짜에 예약 수요가 몰리는지, 도서관별 이용 활성화 수준이 어떤지를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도서관명·도서관코드(librry_cd)를 이름이나 같은 기관 코드로 맞춰서만 연결된다.
description_portal: 이 데이터는 경기도 사이버도서관에서 수집된 도서관별 예약 현황 정보를 포함하고 있으며, 각 도서관에서 특정 날짜에 발생한 도서 예약 건수를 보여줍니다. 데이터 항목은 예약일, 도서관코드, 도서관명, 예약건수로 구성되어 있으며, '예약일'을 기준으로 각 도서관별 예약 활동량을 확인할 수 있습니다. ‘예약건수’는 해당 도서관에서 해당 일자에 이루어진 전체 예약 요청의 수를 나타내며, 이용자 수요의 집중도나 자료 접근성 등을 분석하는 데 활용할 수 있습니다. 이 데이터를 통해 지역별 자료 예약 트렌드, 도서관 이용 활성화 수준, 예약 집중 시간대 분석 등 다양한 정책 수립과 운영 전략 설계에 기초자료로 사용할 수 있습니다.
