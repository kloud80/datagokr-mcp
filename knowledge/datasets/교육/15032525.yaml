description_portal: 경기도 성남시 문화의집, 서현문화의집에 강좌목록정보에 대한 데이터로, 강좌명,인원,수강기간,강의실,요일,수강시간 등의 항목을 제공합니다. 성남시 문화의집에서 운영하는 시민들의 문화예술 향유와 평생학습을 위한 다양한 강좌 현황 자료입니다. 이 자료에는 센터명(성남문화의집, 서현문화의집) 강좌명, 인원, 수강기간, 강의실, 요일, 수강시간 등의 항목이 포함되어 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.강좌목록에는 한지공예, 동양화, 서양화, 노래교실 등 다양한 분야가 포함되어 있으며, 자세한 정보는 성남시 문화의집 홈페이지에서 확인할 수 있습니다.
