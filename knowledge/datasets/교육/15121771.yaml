description_portal: '이 데이터는 경상북도 봉화군이 추진한 정보화교육 프로그램의 운영 현황을 정리한 자료입니다. 각 교육 강좌의 명칭, 강사, 교육 일정, 시간, 교육 방식, 대상자, 수강료, 장소 등 다양한 항목으로 구성되어 있으며, 주민 대상 정보격차 해소 및 디지털 역량 강화를 위한 교육 사업의 실행 실태를 파악하는 데 활용할 수 있습니다.컬럼별 항목 설명-강좌명: 개설된 정보화교육 프로그램의 명칭입니다. 포토샵, 컴퓨터 기초 등 다양한 주제로 구성되어 있습니다.-강사명: 해당 교육을 진행하는 강사의 이름입니다.-교육시작일자 / 교육종료일자: 교육이 실제로 시작되고 종료되는 날짜입니다.-교육시작시각 / 교육종료시각: 하루 교육이 시작되는 시간과 종료되는 시간입니다.-강좌내용: 해당 강좌에서 다루는 주요 교육 내용입니다.-교육대상구분: 수강 대상자의 구분으로, 대부분 ‘봉화군민’으로 설정되어 있습니다.-교육방법구분: 교육이 진행되는 방식으로, 오프라인 또는 온라인 여부를 나타냅니다.-운영요일: 교육이 운영되는 요일 정보로, ‘월+화+수+목+금’ 등으로 표기됩니다.-수강료: 수강에 필요한 비용이며, 대부분 무료로 제공됩니다.-교육장도로명주소: 교육이 실제로 이루어지는 장소의 도로명 주소입니다.-운영기관명: 해당 교육 프로그램을 운영하는 기관의 명칭입니다.-운영기관전화번호: 운영기관의 대표 전화번호입니다.-접수시작일자 / 접수종료일자: 교육 수강 신청을 할 수 있는 시작일과 마감일입니다.-접수방법구분: 접수를 받는 방식으로, ‘인터넷+전화’ 등 복수 방식으로 진행됩니다.-선정방법구분: 수강 인원을 선정하는 방식으로, 대부분 ‘선착순’입니다.-홈페이지주소: 교육 프로그램 정보가 게시된 공식 홈페이지 주소입니다.-데이터기준일자: 이 데이터가 집계된 기준일'
