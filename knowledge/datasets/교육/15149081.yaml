description_portal: 한국언론진흥재단 eNIE 시스템에서 교육활용 중인 각 매체사 정보는 전국 초중고 뉴스활용 교육의 핵심 기반이 되는 중요한 데이터베이스입니다.초중고 뉴스활용 교육은 국내외 다양한 매체사에서 제공해주는 신뢰할 수 있는 뉴스 콘텐츠와 기사 데이터를 기반으로 체계적으로 진행되고 있으며, 이를 통해 학생들이 다양한 관점과 시각을 접할 수 있는 교육 환경을 조성하고 있습니다.참여 매체사들은 중앙지, 지방지, 전문지, 인터넷 매체 등 다양한 유형으로 구성되어 있어 학생들에게 폭넓은 미디어 스펙트럼을 경험할 수 있는 기회를 제공합니다. 각 매체사의 정보에는 매체명, 발행 형태, 전문 분야, 제공 콘텐츠 유형 등의 상세한 메타데이터가 포함되어 있어, 교육 목적과 학습 단계에 따라 적절한 매체사의 자료를 선별적으로 활용할 수 있도록 지원하고 있습니다.
