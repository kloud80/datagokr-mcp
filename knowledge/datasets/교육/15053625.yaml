description_portal: 한국사데이터베이스는 고대부터 현대까지의 한국 역사 주요 자료를 제공하는 사이트로, 이 중 1921~1942년 조선은행회사조합 자료와 1949~1959년 경제연감 회사 자료를 디지털 데이터로 서비스합니다. 주기성 과거 데이터를 포함하여 2021년, 2020년, 그리고 2019년에 등록된 한국근현대회사조합자료 3건이 제공되고 있어 역사 자료 연구에 유용합니다.웹 사이트인 한국사데이터베이스(http://db.history.go.kr)에서 서비스중인 1921~1942 시기 회사 조합 정보(조선은행회사조합요록 각연도판)와 1949~1959 회사 자료(경제연감 등)의 디지털데이터
