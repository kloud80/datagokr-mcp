description_portal: 연도별로 시행된 대학수학능력시험 6월, 9월 모의평가의 표준점수별 도수분포에 대한 통계 정보를 제공합니다. 파일은 연도 및 시험(6월 모의평가, 9월 모의평가)별로 구분되어 있으며, 이전 시험 데이터는 하단의 주기성 과거 데이터 목록에서 확인 바랍니다. 데이터는 영역 및 과목별 표준점수의 남녀 도수분포로 구성되어 있습니다. 대학수학능력시험에 관한 자세한 사항은 한국교육과정평가원 수능 홈페이지(https://www.suneung.re.kr/)를 참조해주시기 바라겠습니다.(참고) 표준점수는 원점수를 기반으로 상대적 서열을 확인할 수 있도록 변환한 점수입니다.학년도는 해당 시험 성적을 활용하여 대학에 입학하는 해(즉, 시험 시행의 다음해)를 기준으로 표기합니다. 수능은 1994학년도(1993년 시행)에 2회 시행되었으며, 그 이후로는 연 1회 시행되고 있습니다.
