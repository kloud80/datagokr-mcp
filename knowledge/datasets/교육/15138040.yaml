description_portal: '한국서부발전의 동영상 지식공유 플랫폼 조회수 내림차순 통계정보 입니다. 반가워, 고마워, 한국서부발전, (개그맨 안상태와 함께하는) 서부발전 청렴콘서트 1부, (존중+배려=즐거운일터) 모든 구성원이 함께 만들어가겠습니다., RE100, 탄소국경세는 무엇일까?, 의무적으로 수소발전을 해야 한다고?, [어벤젼기: 소통게임] 포스터, 웹 예능 토크쇼 『갑상선(갑질상황선별)클리닉』 , 『탁대리의 슬기로운 회사생활』, ★ 존중 + 배려 = 사랑 & 안전 ★ 함께 만들어요 안전하고 사랑스런 우리 일터 !!, 꼬인 팔짱은 풀고, 손 잡고 같이 가요~!, 동그랗게 모여 앉아 발맞대고 함께해요~!, 발전소내 환경미화원 분들의 휴식, 배려가 아름다운 사람들 서부인사이드, 벽이라는 난관에 부딪혔을 때 존중과 배려로 한 계단 한 계단씩 이끌겠습니다., 사내벤처 제도의 이해 및 신규사업 공모 계획, 세남노이 수력사업 및 신규 사업개발 현황, 스포츠정신으로 나아가는 WP가 됩시다., 위피의 인터뷰 등의 콘텐츠별 조회수를 기재하였습니다.'
