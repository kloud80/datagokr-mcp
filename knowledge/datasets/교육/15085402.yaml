description_portal: '○ 통계개요* 통계명 : 영재교육 현황* 통계종류 : 서울시 영재교육 현황을 제공하는 일반ㆍ조사통계* 작성목적 : 영재교육 관련 교육정책 등의 기초자료 제공 및 대국민 정보수요 충족 등* 조사체계 : 영재교육기관 → 시·도교육청 및 지역교육지원청 → 한국교육개발원* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 영재학교 기관수, 학급수, 대상자수○ 용어설명* 유형별 영재교육기관- 영재학교 : 영재교육진흥법 제6조에 의하여 설치된 전일제 영재교육 기관(과학고는 영재교육진흥법에 근거한 학교가 아니지만 2008년부터 영재교육통계에 관례적으로 포함하고 있음)- 영재교육원 : 영재교육진흥법 제8조에 의하여 시·도 교육청, 대학, 국공립 연구소,정부출연기관, 공익법인에 설치된 비 전일제 영재교육 기관- 영재학급 : 영재교육진흥법 제8조에 의하여 고등학교 과정 이하의 각급 학교에서 설치·운영하는 학급* 영재교육 기관 : 영재교육진흥법 시행령 제19조, 제20조, 제21조에 의거 법정 심사를 거쳐영재교육 기관으로 지정을 받은 공공기관* 영재교육 학급 : 영재교육기관에서 운영하는 세부 교육단위로서「반」의 개념. 영재교육진흥법 시행령 제32조는 학급당 정원을 20명 이내로 규정하고 있으며,운영반수와 세부운영에 관한 사항은 각 영재교육기관의 학칙에서 규정함* 영재교육 대상자 : 영재교육진흥법 시행령 제11조, 제12조, 제14조, 제15조에 의거하여영재교육 기관에서 실시하는 영재교육 대상자 선발과정과 입학절차를거쳐 소정의 교육을 받고 있는 학생'
