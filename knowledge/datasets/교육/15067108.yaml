summary_user: 에듀넷 티-클리어의 초·중등 기술·가정·실과 교과 학습자료를 자료 한 건당 한 행으로 정리한 목록으로, 과목·주제·부제·제목·키워드와 바로가기 URL을 담은 약 18KB 크기의 전국 범위 CSV 파일이다. 교사가 '중학교 기술 수업에서 쓸 생활 속 전기·전자 관련 에듀넷 자료가 무엇이 있나'처럼 주제별 수업자료를 찾거나, 콘텐츠 개발자가 교과 주제별 자료 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 과목명·주제명 같은 이름 매칭이나 같은 기관(한국교육학술정보원)의 다른 교과별 학습자료 목록과 나란히 놓는 방식으로만 이어 쓴다.
limits: 학교·지역 단위 정보가 없는 비공간 자료 목록이라 학교알리미 공시처럼 학교별 학생·교원·시설 분석에는 쓸 수 없다. 코드 체계 없이 이름으로만 연결되므로 다른 데이터와 결합할 때 과목·주제 표기 차이를 직접 맞춰야 한다.
