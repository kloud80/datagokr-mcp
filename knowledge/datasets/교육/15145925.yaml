summary_user: 서울 은평구 내 학원·교습소를 기관(과정)별로 담은 원천 목록으로, 기관명·지정번호(PEI_DSGN_NO)·등록일과 등록상태·휴원 기간·정원·교육분야와 계열·과정·교습비 공개 여부와 금액·도로명주소를 담는다. 학부모가 동네 학원의 교습비와 교습 과정을 비교하거나, 분석가가 은평구 안에서 학원이 어느 동에 몰려 있는지(학원가 밀집도)를 살펴 상권·주택 수요 신호로 읽는 데 쓴다. 전역 조인 키가 없으므로 다른 자치구·교육청 학원 데이터와는 행정동명(ADMDST_NM)이나 도로명주소로 이름·주소를 맞춰 붙여야 한다.
description_portal: 해당 데이터는 서울특별시 은평구 내 사설교육기관의 운영 현황을 담고 있습니다.사설교육기관이란 「학원의 설립·운영 및 과외교습에 관한 법률」에 따라 설립된 학습자 대상 교육서비스 제공기관을 의미합니다. 각 기관의 명칭, 휴원일자, 등록상태, 정원, 교육분야, 계열 및 과정 등이 상세히 기록되어 있으며, 수강료 공개 여부에 따라 교습비 내용까지 확인할 수 있습니다.서울특별시교육청 서부교육지원청이 은평구, 서대문구, 마포구를 관할하여 해당 지역 사설교육기관을 체계적으로 관리하고 있습니다. 2025년 1월 1일 기준으로 교습비 등 정보공개가 의무화되어 있어 학부모들이 투명하게 교육비를 비교 검토할 수 있습니다.교육 유형별 분류가 핵심 특징입니다. 입시·검정 및 보습 계열이 전체의 65.7%를 차지하며, 예체능, 직업기술, 평생직업교육 등 다양한 분야로 구성되어 있습니다. 각 기관의 정확한 소재지와 연락처가 포함되어 있어 지역별 사교육 접근성을 파악할 수 있습니다.고액·불법 교습행위 단속과도 연계되어 있습니다. 서울시교육청은 **서부교육지원청(☎3905-561~6)**을 통해 허위·과장 광고나 불법 교습행위를 신고받고 있어, 건전한 사교육 환경 조성을 위한 감시체계가 구축되어 있습니다.평생교육시설과의 연계도 특징적입니다. 서부교육지원청 관내 평생교육시설 234개소와 함께 관리되어 지역 내 종합적인 교육 생태계를 구성하고 있습니다. 이는 학령기 학생뿐만 아니라 성인 학습자까지 포괄하는 교육인프라 현황을 보여줍니다.이 데이터는 지역 내 사교육 시장 현황 파악, 교육비 부담 분석, 교육 사각지대 발굴, 불법 교습행위 단속에 기초 자료로 활용되며, 학부모들은 자녀 교육기관 선택 시 비교 검토 자료로 활용할 수 있습니다.
