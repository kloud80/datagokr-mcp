description_portal: 시청자미디어재단이 운영하는 전국 12개 지역 센터(부산, 광주, 강원, 대전, 인천, 서울, 울산, 경기, 충북, 세종, 경남, 대구)에서 개설된 미디어교육 강좌의 이력을 정리한 자료로, 2006년 3월부터 현재까지 장기간에 걸쳐 축적된 강좌 운영 현황을 확인할 수 있습니다.자료는 강좌명, 강좌 기간, 접수 기간, 운영일, 강좌 횟수, 최대 인원, 수료증 발급 여부, 지역 등으로 구성되어 있어 개별 강좌의 세부 운영 정보를 구체적으로 확인할 수 있습니다. 이를 통해 이용자는 각 강좌의 운영과 규모, 참여 등을 비교·분석할 수 있으며, 교육 프로그램 기획이나 정책 수립 시 기초자료로 활용할 수 있습니다. 또한 장기간 누적된 데이터를 기반으로 미디어교육의 확산 추이와 지역별 특성을 종합적으로 이해하는 데에도 유용한 자료입니다.
