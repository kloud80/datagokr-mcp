summary_user: 경기도 사이버도서관 종합목록에서 도서 예약이 실제로 이루어진 내역을 예약 건별로 담는다. 각 건에는 등록번호, 서명·저자·출판사·출판연도·ISBN 같은 도서 정보와 예약시작일·예약만료일, 예약을 받은 도서관이 들어 있다. 도서관 운영자나 분석가가 "어느 도서관에서 어떤 책에 예약이 몰리는가", "예약 수요가 시기별로 어떻게 달라지는가"를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, ISBN(isbn_no)으로 다른 도서 목록과 맞추거나 도서관부호·도서관명(librry_no, librry_nm)으로 같은 기관의 도서관 자료와 이어 쓰는 정도에 그친다.
description_portal: 이 데이터는 경기도 사이버도서관의 종합목록 내에서 특정 도서에 대해 실제 예약이 이루어진 상세 내역을 기록한 자료입니다. 각 예약 건에 대해 등록번호, 도서명(본표제), 저자, 출판사, 출판연도, ISBN 등 도서의 기본 정보와 함께, 예약이 시작된 일시(예약시작일)와 예약이 종료되는 일시(예약만료일), 그리고 예약이 접수된 도서관(도서관부호, 도서관명)이 포함되어 있습니다. 동일 도서에 대해 여러 건의 예약이 발생할 수 있으며, 이 데이터를 통해 특정 도서의 수요 집중 현황, 도서관별 인기 도서 파악, 예약 처리 흐름, 예약 서비스 운영 실태 분석 등이 가능합니다. 예약일시 정보는 시간 단위로 제공되어 예약 추이 분석에도 유용하게 활용됩니다.
