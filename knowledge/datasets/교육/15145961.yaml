description_portal: '서울특별시 금천구에서는 관내 유치원 직원들의 근속연수 현황을 데이터로 공개하고 있습니다.이 자료에는 관할 교육청, 유치원명, 유치원 유형(공립·사립, 법인·사인·단설·병설), 근무연수별(1년 미만, 1~2년, 2~4년, 4~6년, 6년 이상) 교사 수, 유치원 주소와 같은 정보가 담겨 있습니다.구민 여러분께서는 이 데이터를 통해 우리 동네 유치원의 교사들이 얼마나 오래 근무하고 있는지를 한눈에 확인하실 수 있습니다. 이를 바탕으로 유치원의 교사 안정성, 교육 경험 정도 등을 참고하셔서 자녀의 유치원 선택이나 교육 환경 비교에 활용하실 수 있고, 교육 관련 연구나 정책 제안 자료로도 쓰실 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
