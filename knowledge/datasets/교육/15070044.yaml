summary_user: 한국장학재단 대학생 청소년교육지원장학금 사업에 참여한 대학별로 사업연도·학기·수업구분마다 학업시간표 입력 시작일자와 종료일자, 입력기간 사용 여부를 담은 파일(CSV, 약 96KB)이다. 장학금 담당 대학 직원이나 참여 대학생이 "우리 대학은 이번 학기 학업시간표를 언제까지 입력해야 하나"를 확인하거나, 분석가가 연도·학기별 참여 대학 규모와 입력기간 운영 현황을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 대학명을 이름으로 맞춰 대학 공시 등 대학 단위 자료와 붙이는 방식으로만 연결한다.
description_portal: '대학생 청소년교육지원장학금 관련 대학별 학업 시간표 입력 기본 정보: 연도, 학기, 대학명, 수업구분, 사용여부 등에 관한 정보를 제공함데이터 제공항목은 사업연도, 사업 참여 학기, 참여 대학명, 학업시간표 구분, 학업시간표 입력 시작일자, 학업시간표 입력 종료일자, 학업시간표 입력기간 사용 여부가 있습니다.대학생 청소년교육지원장학금은 대학생이 초중고등학생 대상으로  멘토링을 지원하고, 대학생에게는 장학금을 지원하는 것을 목적으로 합니다. 대학생 청소년교육지원장학금 관련 정보는 "한국장학재단 누리집(https://www.kosaf.go.kr) > 인재육성 > 대학생지식멘토링 > 대학생 청소년교육지원장학금"에서 확인 가능'
