summary_user: 중앙행정기관 소관 인력양성사업을 사업 단위로 조사한 실태조사 결과로, 연도별로 부처·담당부서·사업명·사업내용·훈련기관·훈련대상을 담은 전국 단위 CSV 파일(약 1.7MB)이다. 정책 분석가나 훈련 수요자가 '어느 부처가 어떤 대상에게 어떤 기관을 통해 직업훈련사업을 운영하는가'를 파악하거나 부처 간 훈련사업 중복을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 부처명·사업명 같은 이름 매칭으로만 이어 쓴다.
