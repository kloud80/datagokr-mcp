summary_user: 경기도 안의 전문대학과 대학교를 학교 한 곳씩 담은 목록으로, 시군·학교구분·국공립/사립 구분·시설명과 도로명·지번 주소, 우편번호, 위경도 좌표를 함께 담는다. 연구자나 정책 담당자가 '우리 시군에는 어떤 대학이 있고 국립·사립이 어떻게 나뉘는가', '고등교육 시설이 경기도 어디에 몰려 있는가'를 따질 때 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 행정구역 통계에 붙이거나, 학교명·주소를 매핑해 학교코드 기반의 교원·학생 통계나 재정 자료와 잇는다.
description_portal: 「전문 및 대학교 현황」 데이터는 경기도 내 시군별 전문대학과 대학교의 현황을 제공하는 자료입니다. 주요 항목으로는 학교구분명(SCHOOL_DIV_NM), 공사립구분명(PLVTINST_DIV_NM), 시설명(FACLT_NM), 시설구분명(FACLT_DIV_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), 위도(REFINE_WGS84_LAT) 및 경도(REFINE_WGS84_LOGT)가 포함되어 있습니다. 이 데이터는 각 대학의 설립 주체(국립·사립), 위치 정보, 행정구역 단위별 현황을 분석하는 데 활용할 수 있으며, 교육정책 수립, 지역별 고등교육 인프라 연구, 대학 입지 분석 및 교육행정 서비스 개선 등에 기초 자료로 유용합니다. 또한, Open API(https://openapi.gg.go.kr/Jnclluniv)를 통해 시군명이나 시군코드를 기준으로 조건 검색이 가능하여, 특정 지역의 대학 현황을 실시간으로 조회할 수 있습니다. 해당 데이터는 교육취업 분야에 속하며, 상업적 이용 및 2차 가공이 허용되므로 연구, 정책, 민간 서비스 개발 등 다양한 목적으로 활용 가능합니다.
