summary_user: 대구광역시교육청 관내 학원과 교습소를 한 곳씩 담은 개별 현황 파일로, 학원명·종류·주소·설립자·전화번호와 교습과정·과목(반)별 정원, 총교습시간, 교습비와 차량비·급식비 같은 기타경비를 함께 담는다. 학부모가 우리 동네에서 특정 과목을 가르치는 학원의 교습비와 교습시간을 비교하거나, 분석가가 구·동별 학원가 밀집도를 학원 상권이나 주택 수요의 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 학원명이나 주소 문자열을 맞추거나 주소를 행정구역으로 바꿔서 이어 써야 한다.
