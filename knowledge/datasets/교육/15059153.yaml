summary_user: 경기도 내 대학교별·연도별로 신입생 총입학생 수와 출신 고등학교 유형(일반고, 과학고, 외고/국제고, 예술/체육고, 산업수요맞춤형고, 특성화고, 자율고, 영재학교, 검정고시, 기타)별 인원수와 비율을 담은 집계 자료다. 분석가나 입시 정책 담당자가 "경기도 대학 중 특성화고나 검정고시 출신 신입생 비율이 높은 학교는 어디이고 해마다 어떻게 바뀌는가" 같은 질문에 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어, 다른 학교 기본정보·통계와는 학교명(SCHOOL_NM)과 연도로 이름을 맞춰 붙여야 한다.
description_portal: 신입생의 출신고등학교 유형별 현황 데이터는 경기도 내 대학교 신입생들의 고교 출신 배경을 유형별로 분류해 제공하는 교육 통계자료입니다. 주요 항목에는 연도, 학교종류명, 설립구분명, 학교명, 총입학학생수와 함께 일반고, 과학고, 외고/국제고, 예술/체육고, 산업수요맞춤형고, 특성화고, 자율고, 영재학교, 검정고시, 기타 출신 인원수와 각 유형별 비율이 포함됩니다. 이 데이터는 대학 입학생의 학력 자원 구성을 파악하고, 고등학교 유형별 대학 진학 경향을 분석하는 데 유용합니다. 또한 지역 간 교육 기회 불균형 해소, 특수목적고 및 자율고 학생의 대학 진학 성과 분석, 대학 입학 정책 수립, 입학사정관제 평가 등 다양한 활용 방안이 있습니다. 특히 대학알리미 시스템과 연계된 자료로, 대학의 신입생 구성 변화를 장기적으로 추적하고 교육정책 연구에 활용할 수 있는 기반을 제공합니다.
