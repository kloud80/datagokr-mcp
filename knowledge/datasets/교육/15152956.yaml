description_portal: 본 데이터는 전북특별자치도교육청미래교육연구원에서 통합관리하고 있는 학교 및 기관 홈페이지 중 완주교육지원청에서 운영하는 완주교육협력지구 홈페이지에 대한 데이터입니다.완주교육협력지구는 학교와 마을 사람들이 힘을 모아 유,무형의 마을의 모든 자원을 활용하여 진로 진학에 대한 걱정, 도시 아이들에 비해 뒤쳐질 것이라는 불안감 없이 아이가 성장할 때까지는 안심하고 가르칠 수 있는 학교-마을교육공동체 홈페이지입니다.컬럼정보는 공모사업명, (공모사업 신청)접수시작날짜, (공모사업 신청)접수종료날짜, (결과보고서/정산서 제출기간)마감시작날짜, (결과보고서/정산서 제출기간)마감종료날짜 로 구성되어 있습니다.본 데이터는 매년 공모사업이 새로 추가될때 마다 갱신되는 자료입니다.
