summary_user: 한국장학재단 대학생 청소년교육지원장학금(대학생이 초중고생을 멘토링하고 장학금을 받는 사업)의 예산이 배정된 대학을 상품명·배정연도·배정구분·대학명 단위로 나열한 전국 범위 파일(CSV 약 50KB)이다. 대학생이나 진학 예정자가 '우리 학교가 올해 청소년교육지원장학금 멘토링 예산을 배정받았는가'를 확인하거나, 분석가가 연도별 배정 대학 변화를 살피는 데 쓴다. 전역 조인 키가 없어 대학알리미 등 다른 대학 데이터와는 대학명 문자열을 맞춰서 연결해야 한다.
description_portal: '대학생 청소년교육지원장학금 멘토링 배정을 위한 대학 정보 관리: 상품명, 배정년도, 배정구분, 배정일련번호, 대학명 등의 정보를 제공함데이터 제공항목은 사업 상품명, 예산 배정연도, 예산 배정 형태, 예산 배정 대학명이 있습니다. 대학생 청소년교육지원장학금은 대학생이 초중고등학생 대상으로  멘토링을 지원하고, 대학생에게는 장학금을 지원하는 것을 목적으로 합니다. 대학생 청소년교육지원장학금 관련 정보는 "한국장학재단 누리집(https://www.kosaf.go.kr) > 인재육성 > 대학생지식멘토링 > 대학생 청소년교육지원장학금"에서 확인 가능'
