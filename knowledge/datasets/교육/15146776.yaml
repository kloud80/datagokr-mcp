description_portal: 서울시 은평구 유치원 직원 근속연수 현황’ 데이터는 유치원알리미 원시 자료를 기반으로 은평구 소재 국 · 공 · 사립 유치원 교직원의 근속 기간 분포를 집계 · 제공하고 있습니다. CSV·JSON 파일과 REST API 형태로 제공되며, 학년도 종료 후 교육부가 공시한 값을 서울열린데이터광장이 수집 · 가공해 매년 자동 갱신합니다.학부모와 교사는 장기 근속 교사의 비율을 통해 기관별 교직원 안정성을 확인할 수 있고, 교육청은 근속 1년 미만 비중이 높은 사립 유치원을 선별해 교원 처우 개선이나 인력 지원 정책을 설계할 수 있습니다. 연구자는 교사 근속과 교육 품질, 이직률 간 상관관계를 분석할 수 있으며, 지자체는 야간 · 방학 돌봄 운영에 필요한 숙련 인력 풀을 파악하는 데 활용할 수 있습니다.
