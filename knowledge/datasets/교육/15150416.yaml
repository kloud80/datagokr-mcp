description_portal: 이 데이터는 경상남도 거제시의 취학 대상 아동 현황을 성별과 유형별로 구분하여 제공하는 자료입니다. 취학 대상자는 적령아동, 입학 유예된 과령아동, 조기입학 신청 아동으로 나뉘며, 남녀별로 세부 집계되어 있습니다. 또한, 교육청에서 발송한 취학통지(취학광고)를 받은 아동 수 역시 같은 기준으로 분류되어 있습니다. 이를 통해 실제 취학 대상자와 취학 안내 대상자의 차이를 비교하고 분석할 수 있습니다.조기입학, 유예 신청 등 다양한 입학 형태를 고려하여 아동 개별 상황에 맞는 지원 정책 수립에 활용될 수 있습니다. 데이터에는 전체 광고 대상 중 실제 취학한 아동의 비율을 나타내는 ‘광고취학률합계’도 포함되어 있습니다. 거제시의 학령인구 변화와 교육 수요를 예측하는 데 유용한 기초자료로 활용이 가능합니다.
