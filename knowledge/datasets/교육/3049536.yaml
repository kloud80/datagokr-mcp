description_portal: '대구광역시립북부도서관은 지식·문화·배움으로 미래를 준비하는 대구광역시교육청 설립 공공도서관입니다. 책으로 삶을 가꾸는 독서문화 확산을 위해 다양한 독서 자료를 제공하고자 지속적으로 새로운 도서를 소장하고 있습니다. 분기별 신착 도서 목록에는 다음과 같은 정보가 포함되어 있습니다.1. 등록번호: 순서대로 등록된 도서의 번호2. 청구기호: 도서관 소장자료의 배가 위치를 표시하는 일련의 기호3. 서명: 도서의 제목4. 저자: 도서를 집필한 사람의 이름5. 발행자: 출판사6. 발행년: 출판된 연도7. 가격: 도서의 금액8. 자료실: 도서가 소장되어 있는 자료실이러한 정보를 통해 이용자들은 원하는 도서를 효율적으로 찾을 수 있습니다.'
