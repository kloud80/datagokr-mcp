description_portal: ▶ 훈련기관 및 기타 NCS를 활용하는 기관에서 국가직무능력표준(NCS) 활용을 돕고자 공개하는 훈련기준(1,100직종)의 능력단위를 정리한 파일입니다. - 해당 자료는 "분류번호", "명칭", "수준", "훈련시간"의 4종 13343건으로 이루어져 있습니다.  - "분류번호"는 능력단위코드를 의미하여, "명칭"은 능력단위코드명을 의미합니다. "수준"은 해당 능력단위가 가진 수준을 표시하고 있으며, "훈련시간"은 능력단위별 적정 훈련시간을 제시하고 있습니다. - 위 자료를 활용함으로써 훈련기관 및 NCS 활용 기관에서는 훈련개발, 능력단위코드 및 수준 확인 등에 활용할 수 있습니다. ※ 제공되는 데이터는 사업의 추진 계획 등에 따라 NCS 홈페이지에서 제공하는 데이터와는 차이가 있을 수 있습니다.
