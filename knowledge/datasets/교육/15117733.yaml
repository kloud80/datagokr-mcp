description_portal: '한국양성평등교육진흥원이 운영하는 디지털 성범죄 교육 플랫폼 디클에서 제공하는 교육 콘텐츠 영상과 교육에 활용할 수 있는 자료 콘텐츠에 대한 정보입니다. 각 콘텐츠는 고유 번호, 콘텐츠 제목, 대상 연령 분류, 형식(예: 영상, 게임), 그리고 콘텐츠 분량 정보를 포함하고 있습니다. 이 데이터는 디클 플랫폼에서 제공하는 다양한 디지털 교육자료의 범위와 특성을 파악하는 데 유용한 정보를 제공합니다.콘텐츠는 주로 7~12세 초등학생 연령대를 대상으로 구성되어 있으며, 형식은 영상과 게임으로 나뉘어 있습니다. 콘텐츠 제목을 살펴보면, "디지털 성범죄 인식", "SNS 이용법", "동의의 중요성" 등 디지털 윤리와 안전한 온라인 행동을 주제로 한 교육적 목적의 콘텐츠가 다수를 차지하고 있음을 알 수 있습니다. 각 콘텐츠는 몇 분 분량인지도 명시되어 있어, 교육 시간 계획 수립이나 학습자 수준에 맞는 콘텐츠 선정을 쉽게 할 수 있습니다.이 데이터를 활용할 수 있는 방안은 다양합니다. 먼저, 연령대별 또는 주제별 콘텐츠 분포 분석을 통해 교육 콘텐츠의 편중 여부나 보완이 필요한 영역을 진단할 수 있습니다. 또한, 콘텐츠 형식별(영상 vs 게임) 선호도나 활용도에 대한 비교 분석을 통해 교육 방식 개선에도 활용이 가능합니다. 더불어, 콘텐츠 분량을 기준으로 짧은 학습용 자료와 장시간 학습용 자료를 구분하여 학습자의 집중도와 학습 상황에 따라 콘텐츠를 유연하게 배치할 수도 있습니다.교육기관이나 담당자는 이 자료를 바탕으로 수업 계획을 세우거나, 특정 주제에 대한 집중 교육과정을 구성할 수 있으며, 디지털 시민 교육의 콘텐츠 다양성, 형식 다양성, 접근성 개선 여부를 평가하는 기준자료로도 유용하게 활용될 수 있습니다. 특히 게임 콘텐츠는 몰입도와 흥미를 유도할 수 있는 점에서 참여형 교육 자료로의 확대 가능성을 검토할 수 있습니다.'
