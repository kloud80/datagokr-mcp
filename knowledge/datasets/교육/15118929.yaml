description_portal: 광주광역시 인재교육원은 공무원의 직무 전문성과 역량 강화를 위해 매년 집합 교육을 운영하고 있습니다.  광주광역시 인재교육원은 공무원 대상 기본(기본 역량, 리더십), 직무역량(공통, 전문, 정보 기술), 인문 소양 등 다양한 교육 과정을 운영하고 있습니다. 본 데이터는 광주광역시 인재교육원에서 매월 운영하는 집합 교육 운영 일정 및 집합교육 실시 결과 안내  데이터입니다. 교육 과정별 자세한 교육 일정 및 집합교육 실시 결과는 붙임 파일을 참고해주시기 바랍니다. 향후 사정에 따라 교육 일정이 변경될 수 있음을 유의하여 주시기 바랍니다.
