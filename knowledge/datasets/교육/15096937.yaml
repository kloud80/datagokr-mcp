summary_user: 제주특별자치도에 있는 전문대학의 수와 학교별 개설 학과 수를 기준 연도·대학교명·구분별로 집계한 통계로, 포털 설명상 2016~2020년을 다룬다. 지역 정책 담당자나 연구자가 '제주의 전문대학과 학과 수가 해마다 어떻게 달라졌나'처럼 지역 직업교육 인프라의 규모와 증감을 볼 때 쓴다. 전역 조인 키는 없어서, 다른 학교 기본정보·학생·교원 통계와는 대학교명을 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터셋은 2016년부터 2020년까지 기간 동안 제주특별자치도 내에 소재한 전문대학들의 수와 학과 수 현황을 정리한 공공 통계자료이다. 해당 자료는 전문대학의 수, 각 학교가 개설한 학과 수를 연도별로 집계하여 지역 고등교육 인프라 규모와 변동 양상을 보여준다. 이를 통해 지역 내 직업 교육 시설이 얼마나 분포되어 있는지, 학과 다양성은 어느 정도인지 파악할 수 있어 교육 정책 수립, 인력 양성 전략, 지역 산업 연계 교육 체계 설계 등에 기초 자료로 활용할 수 있다. 또한 이 데이터는 전문대학의 증감 추세, 학과 구성을 통한 산업수요 반영 정도, 교육 인프라의 안정성 여부 등을 분석하는 기초자료로서 공공기관, 지방자치단체, 연구기관 등에서 신뢰성 있는 참고자료로 활용 가능하다. 자료는 CSV 형식으로 제공되며, 공개 데이터로 누구나 접근할 수 있다.
