description_portal: 산하 기초지방자치단체를 제외한 대구광역시에서 실시된 고령층 대상의 정보화 교육 통계를 제공하는 데이터입니다. 교육과정별, 성별, 연령별, 직업별 고령층의 정보화 집합교육에 대한 월별 통계자료를 포함하고 있습니다. 고령층의 디지털 역량 강화를 위한 교육 현황을 분석하여 고령층의 디지털 격차 해소를 위한 정책 수립, 교육 프로그램 개선, 지역별 교육 수요 분석 등에 유용하게 활용될 수 있습니다. 또한, 연구 및 정책 수립에도 기여할 수 있으며, 교육 기관 및 복지 기관에서 고령층의 정보화교육 수요 예측에 활용할 수 있습니다.
