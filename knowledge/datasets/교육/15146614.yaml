description_portal: 서울특별시 마포구에 소재하고 있는 유치원 현황입니다.이 데이터에는 교육청명, 교육지원청명, 유치원코드, 유치원명, 설립유형, 대표자명, 원장명, 설립일, 개원일, 주소, 전화번호, 홈페이지, 운영시간, 나이별학급수, 공시차수 등의 정보를 포함하고 있습니다.또한 이를 통해 학부모는 유치원의 규모, 시설, 교사 구성 등 일반현황을 한눈에 파악할 수 있어 합리적인 선택이 가능하며, 투명한 정보 공개로 신뢰할 수 있는 보육 환경이 조성됩니다.유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
