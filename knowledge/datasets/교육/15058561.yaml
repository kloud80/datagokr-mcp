summary_user: 경기도 내 시군별 전문도서관을 한 곳당 한 행으로 담은 목록으로, 도서관명·도서관 유형과 도로명·지번 주소, 우편번호, 위도·경도 좌표를 포함한다. 연구자나 정책 분석가가 "우리 시군에 의학·과학 같은 특정 분야 전문도서관이 어디에 몇 곳 있나"를 확인하거나 지역별 전문자료 인프라 분포를 지도에 그릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 맞춰 붙여야 하며, 학교코드 같은 표준 키로는 연결되지 않는다.
description_portal: 이 데이터는 경기도 내 시군별 전문도서관의 현황을 제공하는 자료로, 도서관명, 도서관 유형, 주소 정보(도로명 및 지번), 위도·경도 좌표 등을 포함합니다. 전문도서관은 일반 도서관과 달리 인문, 철학, 과학, 의학 등 특정 분야의 자료를 전문적으로 수집·보관하는 도서관으로, 연구기관, 학계, 전문 인력 등에 특화된 지식정보 서비스를 제공합니다. 해당 데이터는 지역별 전문자료 인프라 분포 분석, 연구 기반 시설 현황 파악, 분야별 지식 접근성 강화 등의 목적에 활용될 수 있으며, 교육·문화·과학기술 정책 수립 및 공간 기반 정보 연계에도 유용합니다. 데이터는 공공데이터포털 및 Open API를 통해 수시로 갱신되며, 경기도 전체 또는 특정 시군 단위로 조회 가능합니다.
