description_portal: 이 데이터는 국립중앙과학관 등 주요 과학관에서 전시 중이거나 보유한 과학학습 전시품과 체험시설 정보를 체계적으로 정리한 목록입니다. 주요 전시품은 크게 자연사표본(동물, 곤충, 식물, 해양생물, 화석 등), 역사/과학적 모형(거북선, 망원경, 고대 천문기구, 선박, 각종 공학도구 등), 실험 및 체험전시(중력체험, 우주걷기, 롤러코스터, 4D영상관, 로봇팔체험 등) 그리고 공학·기계 분야(발전기, 엔진, 용접, 계측장비 등)로 구분됩니다.각 전시품마다 고유 아이디, 명칭, 그룹 및 세부 분류 코드, 전시/체험 타입, 공개여부, 조회수, 등록자 등 관리용 속성이 기록되어 있어 기관 내부의 데이터베이스 관리뿐만 아니라, 대중 정보공개와 학습 자료화에 모두 적합하도록 설계되어 있습니다.
