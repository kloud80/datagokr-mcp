summary_user: 경기도 시군의 도서관·주민자치시설·복지시설·문화예술공간 등이 유휴시간에 공간을 기부해 '지역커뮤니티 학습공간'으로 지정된 현황을 시설 한 곳당 한 행으로 담으며, 시군명·시설명·시설유형·도로명/지번주소·지정년도·위경도 좌표를 포함한다. 평생학습 담당자나 주민이 '우리 시군 생활권 안에 주민이 모여 공부할 수 있는 지정 학습공간이 어디에 얼마나 있나'를 확인하거나 학습공간 지도를 그리는 데 쓴다. 전역 조인 키는 없어 시군명이나 주소 문자열 매핑, 또는 위경도 좌표를 이용한 공간 결합으로만 다른 시설·인구 데이터와 잇는다.
description_portal: 우리동네의 다양한 학습장소의 유휴시간을 활용, 시설주의 공간기부를 통해 지역주민들이 학습활동으로 함께 배우고 나눔을 실천하는 ‘지역커뮤니티 학습공간’ 지정현황입니다.주요 항목으로는 시군명, 시설명, 시설유형(도서관, 주민자치시설, 복지시설, 문화예술공간, 기타), 도로명주소, 지번주소, 지정년도, 위도 및 경도 좌표 등이 포함되어 있으며, 주민이 접근 가능한 다양한 공간이 학습장소로 활용되도록 등록된 사례를 보여줍니다. 해당 정보는 지역별 학습공간 분포 파악, 생활권 내 학습접근성 분석, 평생학습 정책 수립, 주민 참여형 교육 인프라 확충 전략 수립 등에 활용될 수 있습니다. 위치 좌표는 학습공간 지도 제작, 시군별 문화·교육 자원 분포 시각화 등에도 적합합니다.
