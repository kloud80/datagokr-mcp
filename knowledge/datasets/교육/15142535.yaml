description_portal: 세종시 관내 초등학교에서 운영되는 늘봄교실(기존 초등돌봄교실)의 연도별 운영 교실 수와 참여 학생 수를 집계한 자료입니다. 이 데이터는 각 학교별로 돌봄교실 및 늘봄교실 운영 현황을 학교 현장 보고 및 행정 시스템을 통해 수집하며, 「초·중등교육법」 및 관련 시행령에 따라 교육청이 공식적으로 보유·관리합니다. 해당 데이터는 매년 또는  필요 시 수시로 갱신하여 최신 현황을 반영하고 있습니다.늘봄교실은 정규수업 외 시간에 학교와 지역사회가 연계하여 학생의 성장과 발달을 지원하는 교육·돌봄 통합 프로그램으로, 맞벌이 가정 등 돌봄이 필요한 학생들의 방과후 돌봄 공백 해소와 교육복지 실현을 목적으로 운영됩니다. 해당 데이터에는 연도별로 학교 수, 교실 수, 참여 학생 수 등 주요 지표가 포함되어 있어, 세종시 내 초등돌봄 정책의 실태 파악, 정책 효과 분석, 방과후 돌봄 수요 예측, 교육복지 정책 수립 등 다양한 분야에서 활용될 수 있습니다. 또한 지역사회, 학부모, 연구자, 정책 담당자 등이 초등 돌봄 환경을 객관적으로 이해하고, 관련 정책 및 서비스 개선에 참고자료로 활용할 수 있는 교육 공공 데이터입니다.
