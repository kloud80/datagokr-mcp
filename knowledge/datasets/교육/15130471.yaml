summary_user: 한국사회보장정보원 교육홈페이지에 개설된 교육과정의 최상위(대분류) 과정을 한 행씩 담은 파일로, 과정 제목·소개·목표, 운영유형, 오프라인·온라인 교육 형태, 활용수, 등록·수정 일시를 포함하며 범위는 전국·비공간이다. 복지시설 종사자나 공무원이 행복이음·희망이음·전자바우처 같은 사회보장 정보시스템 교육이나 개인정보보호교육에 어떤 대분류 과정이 있는지 확인하는 데 쓴다. 마스터과정 일련번호(ssis_master_course_sn)로 같은 기관의 하위 과정·차수 데이터와 잇고, 과정분류 일련번호·정보시스템번호로 분류와 시스템별 과정을 묶어 볼 수 있다.
