description_portal: 이 문서는 한국교육개발원이 제공하는 국내 전문대학과 대학의 문헌정보학과 취업률 및 진학률 현황을 다룹니다. 전문대학과 대학의 주간과 야간 일반과정, 학사학위 전공심화 과정 등의 다양한 학제에서 졸업한 학생들의 취업률과 진학률을 상세히 분석하였으며, 건보가입 취업자, 교내 취업자, 해외 취업자, 농림어업 종사자 등의 세부 분류를 포함합니다. 특히, 다양한 학교의 문헌정보학과와 아동문헌정보학, 보건의료문헌정보학과 등 세부 전공별 데이터도 포함되어 고등교육기관 졸업자들의 취업과 진학 현황을 종합적으로 이해할 수 있도록 합니다. 이 자료는 문헌정보학과를 중심으로 취업률 통계와 진학률 데이터를 제공하여 교육 및 취업 정책 수립에 중요한 기초 자료가 됩니다.(제공데이터)한국교육개발원이 보유하고 있는 국내 전문대학, 대학, 교육대학, 산업대학, 각종학교, 기능대학, 일반대학원 각 학제별 취업현황(취업률, 진학률 등) 정보
