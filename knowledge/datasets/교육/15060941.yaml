summary_user: 대전광역시 관내 대학을 한 행에 한 곳씩 담은 목록 파일로, 기관명·설립구분(국립·사립 등)·주소·홈페이지를 담는다(포털 설명 기준 19개 대학, CSV 약 1.4KB). 시민이나 교육·지역 분석가가 '대전에 있는 대학은 어디이고 국립·사립은 각각 몇 곳인가'를 확인하거나 대학 위치를 지도에 표시할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 고등교육 통계·재정 자료와는 대학명 매칭이나 주소 기반으로만 이어 쓴다.
description_portal: 대전광역시 관내 19개 대학에 대한 상세 현황 자료로, 각 대학의 명칭, 설립 구분(국립, 사립 등), 소재지 주소, 연락처, 홈페이지 주소 등의 정보를 포함하고 있습니다. 이 데이터는 지역 내 고등교육 기관의 기본 정보를 체계적으로 제공하여 교육 관계자 및 시민들이 대학별 특징과 위치를 쉽게 파악할 수 있도록 구성되었습니다. 또한 대학 분포 현황과 설립 유형별 분류가 가능하며, 이를 통해 교육 정책 수립이나 지역사회 교육 인프라 분석에 필요한 기초 자료로 활용될 수 있습니다. 표준화된 형식으로 정리되어 데이터 관리와 분석에 용이합니다.
