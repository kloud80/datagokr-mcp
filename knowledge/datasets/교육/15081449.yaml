summary_user: 서울특별시 서대문구 관내 유치원별로 실내공기질·정기소독·미세먼지·조도 점검일자와 결과, 음용수 종류, 수질검사 여부를 담은 유치원 단위 현황 자료이며, 범위는 시군구(서대문구) 한 곳이다. 학부모나 분석가가 '우리 동네 유치원이 실내공기질과 정기소독 점검을 언제 받았고 결과가 어땠는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 유치원명(KINDERNAME)·유치원코드·주소를 이름이나 코드 매핑으로 맞춰 유치원 알리미 계열 데이터나 같은 지역 어린이집 자료와 이어 쓴다.
description_portal: 서울특별시 서대문구 관내에 위치한 유치원 환경위생관리정보(실내공기질, 정기소독, 음용수종류, 미세먼지 등)에 대한 데이터를 제공합니다.서울시 서대문구 유치원 환경위생관리 현황 데이터는 서대문구 내 유치원들의 위생 상태와 환경 관리 실태를 기록한 자료입니다. 주요 항목으로는 유치원명, 주소, 연락처, 실내공기질 점검일자 등이 포함됩니다. 이 데이터는 유치원의 청결 상태와 위생 관리 수준을 평가하여 아동들의 안전한 교육 환경 조성에 기여합니다. 또한, 보건 당국이 위생 점검 및 관리 계획 수립에 활용됩니다.
