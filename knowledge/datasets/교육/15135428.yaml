description_portal: '대구광역시교육청 고등학교 전재편 입학 시행 지침에 따른 추첨배정 일반고등학교의 학군별 학교정보학군: 1학군(동구, 북구, 중구, 수성구)과 2학군(서구, 남구, 달서구, 달성군)으로 구분해당 학군에 속한 추첩배정 일반고등학교는 1학군은 34개교, 2학군은 31개교로 구성각각의 고등학교의 입학정원은 학년별, 남녀별, 중점과정반으로 구성정원 내의 경우 대구광역시 관내 기준, 정원 외의 경우 입학 정원의 5%로 구성정원 외 세부항목: 타 시도, 특례입학, 편입학, 재입학, 국가유공자, 기타 등으로 이루어짐동구 혁신도시의 경우: 혁신도시 조성 및 발전에 관한 특별법에 따라 혁신도시 인근학교(대구동부고, 정동고, 강동고)는 학교별 정원의 5%, 그 외 소재학교는 학교별 정원의 2% 이내를 전입학 정원으로 관리전입학 신청은 전 가족 거주지가 타 학군으로 이전했을 경우 신청이 가능하며, 전입학 신청 시 주소지 내 학군에 속한 고등학교 중 결원이 있는 학교로 전입학을 희망할 수 있음'
