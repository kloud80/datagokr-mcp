summary_user: "대구광역시교육청 고등학교 입학 지침에 따른 추첨배정 일반고등학교를 학교 한 곳당 한 행으로 담고, 학군(1학군: 동구·북구·중구·수성구, 2학군: 서구·남구·달서구·달성군), 학교 성별, 정원 외 비율, 혁신도시 정원 외 비율을 함께 적은 작은 파일(약 2KB CSV)이다. 학부모나 이사를 고민하는 가구가 '이 지역에 살면 어느 학군의 어떤 일반고에 추첨배정되며, 전입학 정원 여유는 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(학교코드 등)가 없어, 다른 학교 기본정보나 학구도 데이터와는 학교명(기관명)을 맞추는 방식으로만 이어 쓴다."
limits: 학교명 외에 공통 코드가 없어 다른 데이터와 붙일 때 이름 표기 차이를 직접 맞춰야 한다. 주소·좌표나 학구 경계 폴리곤이 포함됐는지는 확인되지 않아, 특정 아파트·주소의 배정 학교를 바로 판정하는 데에는 쓰기 어렵다.
