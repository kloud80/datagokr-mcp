description_portal: 1994학년도부터 연도별로 시행된 대학수학능력시험(본수능)의 접수현황 정보를 제공합니다. 파일은 연도별 정보를 누적하여 포함하고 있습니다. 데이터는 학년도, 접수기간(일자 및 기간), 접수 인원 수(총계, 성별, 계열별, 자격별) 및 접수 영역 개수별 응시수수료로 구성되어 있습니다. (참고) 학년도는 해당 시험 성적을 활용하여 대학에 입학하는 해(즉, 시험 시행의 다음해)를 기준으로 표기합니다. 수능은 1994학년도(1993년 시행)에 2회 시행되었으며, 그 이후로는 연 1회 시행되고 있습니다.
