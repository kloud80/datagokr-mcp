summary_user: 전국 초중등 학교의 기본정보를 학교 한 곳 단위로 담는 나이스(NEIS) 외부 API로, 학교명·주소·전화번호·홈페이지·남녀공학 여부·주야 구분·개교기념일 등을 제공한다. 국민이나 분석가가 특정 학교의 소재지와 설립 구분, 연락처를 확인하는 질문에 쓴다. 학교코드(SD_SCHUL_CODE, neis_school_cd)가 조인 키라서 이 코드를 가진 교원·학생·학급 통계나 학교 재정 데이터와 이어 쓰며, 학교 표준코드 마스터 역할을 한다.
description_portal: 시도교육청이 제공하는 나이스 교육정보는 인증키 발급 후 활용 가이드에 따라 웹 또는 모바일 어플리케이션 개발에 활용할 수 있는 서비스로, 학교명, 소재지, 주소, 전화번호, 홈페이지 주소, 남녀공학 여부, 주야 구분, 개교기념일 등의 학교 기본정보를 제공한다. 해당 기관의 정책에 따라 트래픽 수는 달라질 수 있다.(제공데이터)학교 기본정보에 대한 학교명, 소재지, 주소, 전화번호, 홈페이지주소, 남녀공학여부, 주야구분, 개교기념일 등을 제공
