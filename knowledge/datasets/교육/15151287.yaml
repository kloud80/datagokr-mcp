description_portal: 교육청 업무분장정보 데이터는 부산광역시교육청의 조직 구조와 각 부서·팀별 담당자의 업무 분장 현황을 체계적으로 관리하는 자료입니다. 교육청의 조직 체계, 인사 구성, 업무 담당 현황을 명확히 하여 시민 민원 처리, 업무 협력, 정보 공개 요청 등에 필요한 담당자 정보를 제공합니다.주요 데이터 항목 설명부서명 - 교육청 내 상위 조직 단위의 명칭입니다.팀명 - 부서 내 세부 업무 조직 단위의 명칭입니다. 직위명 - 담당자의 직책 또는 직급을 나타냅니다. 업무전화번호 - 업무 연락처 정보를 나타냅니다.업무내용 - 해당 부서·팀·직위에서 담당하는 구체적인 업무 분야와 역할을 설명합니다. 수정일자 - 업무분장 정보가 마지막으로 수정되거나 업데이트된 연월일과 시간입니다. 제공되는 데이터는 실시간 제공하지 않아 실제와 다를 수 있습니다.현재의 정확한 업무분장은 부산광역시교육청 홈페이지(www.pen.go.kr)에서 직접 확인하시기 바랍니다.
