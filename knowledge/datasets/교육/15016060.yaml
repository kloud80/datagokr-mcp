description_portal: 부산광역시 사하구의 노인여가복지시설(노인교실) 의 현황자료입니다. 시설명, 도로명 주소, 전화번호, 팩스번호,  주요 프로그램, 이용인원(회원수), 면적, 운영시간 등을 제공합니다.노인교실은 노인들의 사회활동 참여욕구를 충족시키기 위해 건전한 취미생활, 건강유지, 소득보장 기타 일상생활과 관련한 학습프로그램을 주1회 이상 제공하는 시설로 노인복지법에 설치근거를 두고 있으며 이용대상자는 60세 이상 어르신이 해당됩니다.교육 프로그램은 크게 취미 및 여가, 건강, 교양, 사회참여로 구분할 수 있으며,  각 노인교실에서 운영하는 프로그램을 참고하시기 바랍니다.
