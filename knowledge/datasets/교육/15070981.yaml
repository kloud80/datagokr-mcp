description_portal: 이 데이터는 한국유학종합시스템을 통해 수집된 외국인 유학생의 대학별 온라인 입학 신청 현황을 정리한 자료입니다. 국내 대학을 대상으로 외국인 학생들이 어떤 과정을 중심으로 지원하고 있는지를 파악할 수 있도록 구성되어 있습니다. 데이터에는 각 대학별로 학위 과정(학사, 석사, 박사, 석박사, 전문학사)과 비학위 과정(어학연수, 교환학생, 기타)에 대한 지원 건수가 포함되어 있습니다. 이를 통해 대학별 유학생 유치 현황을 한눈에 살펴볼 수 있으며, 특정 대학이 어떤 교육과정에 강점을 가지고 있는지 비교하는 데 도움이 됩니다. 예를 들어 일부 대학은 어학연수 프로그램 중심으로 많은 지원이 이루어지는 반면, 다른 대학은 학사나 대학원 과정 지원이 두드러지게 나타납니다. 이러한 데이터는 대학의 국제화 정책 수립이나 유학생 지원 제도 개선, 국가 차원의 교육 교류 확대 전략 마련 등 다양한 분야에서 활용될 수 있습니다. 더 나아가 국민들에게는 한국 고등교육이 글로벌 차원에서 어떤 수요를 받고 있는지를 보여주는 기초 통계자료로서 의미가 있습니다. 본 데이터는 누구나 쉽게 이해하고 활용할 수 있도록 공개되어 있으며, 대학·연구기관·정책 담당자뿐 아니라 일반 국민도 참고할 수 있습니다.
