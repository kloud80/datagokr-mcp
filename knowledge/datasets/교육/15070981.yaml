summary_user: 한국유학종합시스템으로 접수된 외국인 유학생의 온라인 입학 신청 건수를 대학별로 집계한 파일로, 학위 과정(학사·석사·박사·석박사·전문학사)과 비학위 과정(어학연수·교환학생·기타)별 지원 건수를 한 행에 담는다. 대학 국제화 담당자나 정책 분석가가 "어느 대학에 외국인 지원이 몰리고, 그 대학은 어학연수 중심인지 대학원 중심인지"를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학 데이터(대학 공시·유학생 현황 등)와는 대학명(대학교) 문자열을 맞춰 이어 써야 한다.
