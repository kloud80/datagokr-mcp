description_portal: KCI인용지수정보 데이터는 한국학술지인용색인(KCI) 시스템을 기반으로 국내 학술지의 인용지수 및 영향력 지표를 제공합니다. ISSN, 학술지명, 발행기관, 대분류 및 중분류, 등재 정보, 영향력지수, 자기인용 비율, 논문 수, 피인용 횟수, 웹오브사이언스 통합 영향력지수 등의 다양한 세부 항목이 포함되어 있습니다. 이 자료는 학술지 영향력 평가, 연구 성과 분석, 분야별 학술지 비교, 연구자 및 기관의 학술 활동 평가 등 다양한 목적으로 활용용할 수 있습니다. 연간 주기로 업데이트되어, 수정일을 기준으로 최근 정보를 확인할 수 있습니다.
