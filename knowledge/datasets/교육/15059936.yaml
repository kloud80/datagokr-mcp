summary_user: 부산광역시북부교육지원청 관내 공·사립 유치원, 초등학교, 중학교를 기관 한 곳당 한 행으로 담은 명부로, 기관명·공립/사립 구분·전화번호·홈페이지·주소가 들어 있다(CSV 약 18KB). 학부모나 교육 서비스 사업자가 '북부교육지원청 관할 지역의 사립 유치원 연락처와 위치는 어디인가'처럼 관내 학교 목록과 연락처, 위치를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 학교 데이터(학교알리미 공시, 학구도 등)와는 기관명이나 주소를 맞춰 대조하는 방식으로만 연결된다.
description_portal: 부산광역시북부교육지원청 관내의 공·사립 유치원, 초등학교, 중학교에 대한 각 기관의 명칭, 구분(공립 또는 사립), 전화번호, 홈페이지, 주소의 항목으로 구성되어 있습니다.해당 정보는  「초·중등교육법」, 「교육관련기관의 정보공개에 관한 특례법」 등 관련 법령에 근거해 보유·제공되며, 연간 주기로 현행화하여 제공하고 있으며 지역별 학교 통계, 분포 현황 시각화, 위치 기반 서비스 분석, 민간의 교육 관련 서비스 개발, 교육 정책 수립의 기초 자료 등 다양한 분야에서 활용이 가능합니다. 부산광역시북부교육지원청 관할 개별 학교에 대한 구체적인 사항에 대해서는, 해당 학교 또는 관할 교육지원청(부산광역시북부교육지원청)으로 문의해 주시기 바랍니다.
