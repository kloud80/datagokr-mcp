description_portal: '대구광역시 군위군에 위치한 학교현황에 대한 데이터로 구분(단체, 학교, 학원, 교습소), 명칭, 도로명주소, 전화번호의 항목을 제공합니다. 교육행정, 지역사회 인프라 분석, 학군조정, 민원 대응 등에 활용되는 데이터입니다. 구분은 교육기관의 성격을 구분하는 항목이며, 단체는 교육청, 교육지원청, 교육행정기관 등, 학교는 정규 교육과정 운영기관(예: 초등학교, 중학교, 고등학교 등), 학원은 민간 교육기관, 교습소는 소규모 1인 또는 가족 단위 교육시설로 이루어집니다. 명칭은 기관 식별 및 홍보, 민원 처리, 현장 점검 등에, 도로명주소는 통학 거리 분석, 안전망 구축, 주변 인프라 파악에, 전화번호는 민원 대응, 행정 연락, 지도 정보 포털에서 사용자 접근성 제공에 활용됩니다.'
