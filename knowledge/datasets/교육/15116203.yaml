summary_user: 서울 중구 유치원별로 공기질·정기소독 점검일과 결과, 음용수 종류와 수질검사 여부, 미세먼지·조도 검사일과 결과, 주소를 한 행씩 담은 유치원 단위 현황이다. 학부모나 교육 관계자가 '우리 동네 유치원은 정기소독과 미세먼지 검사를 언제 했고 결과는 어땠나'를 확인하거나 유치원 간 위생관리 수준을 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 유치원 코드(KINDERCODE)나 유치원명·주소로 유치원알리미의 다른 공시 자료나 어린이집 자료와 맞춰 이어 쓴다.
description_portal: 서울특별시 중구 내 유치원에서 실시하는 환경위생관리의 실태를 보여주는 자료입니다. 이 데이터는 유치원 내 청소 및 소독 점검일자, 음용수종류, 미세먼지 검사일자, 조도관리 검사일자 등 다양한 관리 항목을 포함하고 있습니다. 이를 통해 유아의 건강과 안전을 위한 관리 수준을 확인할 수 있으며, 유치원 환경의 위생적 수준을 평가하고 개선 방향을 모색하는 데 활용할 수 있습니다. 자료는 각 유치원의 관리 실태를 비교하거나 정책 수립 시 참고자료로 사용될 수 있으며, 학부모와 교육 관계자에게도 유용한 정보를 제공합니다. 환경위생관리의 중요성이 강조되는 가운데, 본 데이터는 유아의 건강 보호와 쾌적한 교육 환경 조성을 위한 기초 자료로서 의미가 있습니다.※ 유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
