  - 자폐성장애 입학
  - 특수교육대상자 신입생
  - 경기데이터드림 특수학교
summary_user: 경기도 내 특수학교별로 기준연도마다 입학생 수를 시각·청각·지체·정서행동·자폐성·의사소통·학습·건강장애 등 장애유형과 성별로 나눈 인원과 비율을 담은 학교 단위 집계 자료다. 교육행정 담당자나 분석가가 '올해 경기도 어느 시군·교육지원청 특수학교에 자폐성장애 입학생이 몰렸는가'처럼 지역·장애유형별 입학 분포와 학급·교원 수요를 따질 때 쓴다. 실측 컬럼에 전국 공통 학교코드 같은 전역 조인 키가 없어, 학교명·시군명(시군코드 SIGUN_CD)·교육지원청명을 이름이나 코드로 맞춰 학교 기본정보나 다른 경기도 교육 통계와 붙여야 한다.
description_portal: 이 데이터는 경기도 내 특수학교의 입학생 현황을 기록한 자료로, 각 연도별 입학생 수와 학교 단위의 통계를 포함합니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명,  설립구분(공립/사립), 성별 및 장애유형별 입학생 수 와 비율 등이 포함되어 있습니다. 이를 통해 특정 연도의 특수학교 입학 추세, 지역 간 학생 분포, 성별 입학 비율 등을 확인할 수 있습니다. 또한 이 데이터는 특수교육 정책 수립, 교육자원 배분, 학급 및 교원 수요 예측, 장애학생 지원 체계 강화 등 다양한 교육 행정 목적에 활용될 수 있습니다.
team:
  dept: AI미래행정과
