description_portal: 한국언론진흥재단에서 운영하는 eNIE(신문활용교육) 시스템의 자료실 검색을 위한 키워드 정보 입니다.eNIE 자료실에는 초등학교, 중학교, 고등학교 각 교육과정에 맞춘 다양한 수준의 미디어리터러시 교육 자료들이 포함되어 있으며, 학생들의 연령과 학습 단계를 고려한 맞춤형 콘텐츠 검색이 가능하도록 구성되어 있습니다.특히 자료실에 제공되는 각각의 교육 자료 검색에 필요한 키워드 메타데이터 정보가 있어, 교사와 학생들이 원하는 주제와 난이도에 맞는 자료를 효율적으로 검색할 수 있습니다.더불어 각각의 자료에는 해당 콘텐츠의 핵심 내용과 교육 목표, 활용 방법 등을 간결하게 정리한 요약내용이 추가되어 있어, 검색 단계에서부터 자료의 적합성을 사전에 판단할 수 있도록 지원하고 있습니다.
