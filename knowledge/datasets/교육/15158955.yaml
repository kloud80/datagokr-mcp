summary_user: 전국 대학의 학과 정보를 학교별·지역별로 담은 API로, 조사년도와 표준분류 대계열·계열 대·중·소분류 코드 단위로 학과를 조회한다. 수험생·학부모나 정책 분석가가 "특정 대학이나 시군구 지역에 어떤 계열의 학과가 개설돼 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 학교 코드나 계열 분류 코드, 학교명 매핑으로만 다른 대학 공시 데이터와 잇는다.
description_portal: 교육관련기관의 정보공개에 관한 특례법 및 동법 시행령을 근거로, 한국대학교육협의회에서 대학 학과 정보를 체계적으로 수집·정리. 대학 학과 정보에는 학과 명칭, 전공 분야, 모집 단위, 입학 정원, 교육과정 특성 등의 세부 내용이 포함. 학교별 학과정보는 각 대학이 보유한 학과의 구성, 운영 현황, 특성을 파악하고 상호 비교할 수 있도록 제공. 지역별 학과정보는 특정 지역 내 대학들의 학과 분포, 전공 분야의 다양성, 지역 산업과의 연계성을 확인할 수 있도록 구성.해당 정보는 수험생의 진로 탐색 및 대학 선택에 활용. 학부모 및 교육 관계자의 의사결정 지원 자료로 활용. 국가 및 지자체의 교육 정책 수립과 인재 양성 계획 수립에도 기초 자료로 활용. 정보는 공공성을 기반으로 제공. 신뢰성과 객관성을 유지하도록 관리. 정기적으로 갱신 및 보완. 이용자가 쉽게 접근하고 활용할 수 있도록 체계적으로 제공.
