description_portal: 양평군에 있는 공공도서관 이용현황에 대한 1년치 (1월~11월 기준) 데이터입니다.양평군의 5개 공공도서관은 연간 이용자와 대출자, 대출권수 전반에서 안정적인 이용 추세를 보이며 지역 독서문화의 중심 역할을 하고 있습니다.도서관별로 이용자, 대출자, 대출권수를 조사하여 일평균수와 월평균수로 구성되었습니다.반기별로 조사된 데이터는 경기도 공공도서관 통계에서 확인할 수 있습니다. 이와 같은 이용현황은 양평군 공공도서관이 주민의 지식·문화 활동 기반을 강화하며 지역사회에 중요한 공공문화 서비스를 제공하고 있음을 나타냅니다.
