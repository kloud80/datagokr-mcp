description_portal: 은평구 집단 급식소 현황입니다. 업종명, 업소명, 소재지(도로명), 소재지(지번), 소재지전화, 급식소종류, 평균급식인원으로 구성되어 있습니다.해당 데이터는 서울특별시 은평구 관내에서 특정 다수에게 지속적으로 식사를 제공하는 집단급식소의 현황을 담고 있습니다. 데이터에는 학교, 병원, 산업체, 사회복지시설, 공공기관, 기숙사 등에 설치된 각 급식소의 명칭, 주소, 연락처, 급식소 종류, 평균 급식 인원 등 위생 관리의 핵심적인 정보가 포함되어 있습니다.집단급식소는 「식품위생법」에 따라 1회 50명 이상에게 식사를 제공하는 비영리 시설로 규정되며, 철저한 위생 및 영양 관리가 필수적입니다. 특히, 어린이, 노인, 환자 등 건강 취약계층이 이용하는 경우가 많아 식중독 등 식품 안전사고 발생 시 대규모 피해로 이어질 수 있어 관리가 매우 중요합니다. 지자체는 이 데이터를 기반으로 정기적인 위생 점검을 실시하고, "어린이·사회복지급식관리지원센터"를 통해 영양 및 위생 교육을 지원하는 등 구민의 건강과 안전을 지키기 위한 핵심 기초 자료로 활용합니다.
