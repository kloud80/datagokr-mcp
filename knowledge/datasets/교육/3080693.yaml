summary_user: 전북특별자치도 특성화고 명장육성사업에 참여하는 학교를 시군별로 정리한 파일로, 학교명과 중점 육성 분야(회계·금융, 기계, 조리 등), 교육 참여 학생 수(교육인원)를 학교·분야 단위로 담는다(530바이트 규모의 소형 CSV). 지역 기업이 특정 기술 분야의 산학협력 파트너 학교를 찾거나, 교육 분석가가 시군별 직업교육 분야와 규모의 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 학교 단위 데이터(학교알리미 공시 등)와는 학교명이나 시군 이름을 맞춰 연결해야 한다.
