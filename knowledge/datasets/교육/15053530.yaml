summary_user: 대구광역시 군위교육지원청이 관할하는 교습소를 한 곳씩 교습소명·주소·전화번호로 담은 건별 현황 파일로, 실측 파일 크기가 571바이트에 불과해 수록 건수가 매우 적다. 군위 지역에서 아이를 보낼 교습소를 찾는 학부모나, 학원·교습소 밀집도를 학원 상권·주택 수요 신호로 보려는 분석가가 '군위에 어떤 교습소가 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 교육지원청 교습소·학원 현황 파일과는 같은 기관 단위로 묶거나 주소를 행정구역·좌표로 매핑해 이어 쓴다.
