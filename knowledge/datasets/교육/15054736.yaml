summary_user: 부산광역시 해운대구 관내 대학교를 학교 한 곳당 한 행으로 담은 목록으로, 학교명·설립구분·학제·주소·대표 전화번호·홈페이지 주소를 담는다(CSV 376바이트의 소규모 파일). 해운대구에 어떤 대학이 있고 국립·사립 중 어디에 속하며 연락처와 위치가 어떻게 되는지 확인하려는 주민·수험생·지역 분석가가 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서 다른 학교 기본정보나 교원·학생 통계와는 학교명 또는 주소를 맞춰서만 이어 쓴다.
description_portal: 본 자료는 부산광역시 해운대구 관내 대학교에 대한 정보를 제공합니다.포함된 데이터는 해운대구 관내 대학교의 학교명, 각 학교가 속한 관할 교육청, 설립 구분(공립·사립), 각 학교별 주소, 대표 연락처, 홈페이지입니다.[데이터 안내 및 변경]매년 1회 해운대구 관내 대학교에 대한 데이터를 업데이트합니다.본 데이터는 교육청 및 교육지원청의 자료를 기반으로합니다.본 데이터는 해운대구 관내 학교에 대한 일반 데이터이며 보다 자세한 데이터는 각 학교별 대표 홈페이지 등을 통해 확인하실 수 있습니다.
