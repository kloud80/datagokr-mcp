description_portal: 이 자료는 국내에서 발행된 6차 교육과정에 따른 초등학교 교과서 정보를 담은 CSV 파일로, 총 138개 항목의 교과서 명칭, 출판사, 발행일, 교육과정 적용 여부 등을 포함합니다. 2020년 9월 28일 최초 등록되었으며, 이후 수시 갱신 체계를 통해 최신 발행 정보를 반영합니다. 교과서 연구자,출판업계 종사자,학교 행정 담당자에게 교과목별 출판사 분포 분석, 발행 시기 추이, 교육 정책 변화 추적 등에 유용하며, 교육과정 조정 및 교재 개발, 정책 평가,연구, 학교 현장의 도서 관리 자료로 활용하기 적합한 정밀,구조화된 기초 데이터셋입니다
