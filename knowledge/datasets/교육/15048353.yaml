summary_user: 경상북도 내 교습소를 건별로 담은 원천 파일로, 교습소명·교습과목·정원·총교습비·기타경비 항목을 포함하며 검증 시 전체 8,724행이 수신되었다. 학부모는 동네 교습소의 교습 과목과 교습비 수준을 비교하고, 분석가는 학원가 밀집도로 상권과 주택 수요 신호를 보는 질문에 쓴다. 교습소주소(address)를 조인 키로 삼아 같은 주소 기준의 다른 학원·교육시설 데이터나 지역 데이터와 이어 쓴다.
limits: 범위는 경상북도 시도 단위이며 행정단위별 개별 데이터(주소·좌표)로, 다른 교육청 자료는 별도 파일이므로 타 지역 비교에는 각 교육청 자료를 따로 받아야 한다. 갱신 주기는 claim에 확인되지 않아 최신성은 단정할 수 없다.
