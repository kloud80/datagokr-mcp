summary_user: 사립대학별·회계연도별로 교비회계 자금계산서에서 뽑은 등록금 수입(단기수강료 제외)과 고정비(보수, 관리운영비) 지출액을 담은 집계 파일로, 전국 사립대학을 대상으로 한다. 연구자·정책 담당자·학부모가 '이 대학은 등록금 수입만으로 교직원 보수와 관리운영비를 감당할 수 있는가'를 대학별·연도별로 비교하는 데 쓴다. 전역 조인 키나 학교 코드가 없어 다른 대학알리미·대학재정 자료와는 학교명·법인명을 이름으로 맞추거나 회계연도를 기준으로 이어 써야 한다.
description_portal: '한국사학진흥재단에서 사립대학을 대상으로 집계한 매 회계연도별 교비회계 재무제표 중 자금계산서 데이터를 기반으로 작성되었습니다.해당 자료는 사립대학별로 등록금 수입액 대비 고정비(보수, 관리운영비) 지출액을 확인할 수 있는 기초 자료입니다.등록금 수입은 수강료 수입을 제외한 자료이며, 고정비는 지출 항목 중 직원 및 교원의 보수와 관리 운영비 데이터를 기반으로 합니다.해당 자료를 통해 사립대학이 등록금 수입 재원만으로 고정비 지출 부담 가능 여부를 확인할 수 있습니다. - 등록금수입 : 단기수강료 제외 / 고정비 : 보수 + 관리비(시설관리비+일반관리비)공공데이터 형태로 제공되므로, 대학 재정 관리 연구, 고등교육 관련 정책 결정, 민간 분석 및 시각화 등 다양한 목적에 활용될 수 있습니다.'
