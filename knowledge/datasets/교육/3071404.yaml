summary_user: 제주특별자치도교육청 산하 폐교 학교별로 폐교일, 소재지, 토지·건물 대부면적, 대부용도, 대부기간, 대부료(천원), 대부받은 자, 통합학교를 한 행씩 담은 파일(csv, 약 2.7KB)이다. 제주에서 폐교 부지를 빌려 쓰려는 사업자나 지역 분석가가 어느 폐교가 어떤 용도로 언제까지 누구에게 얼마에 대부되어 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 학교명이나 통합학교 이름, 소재지 주소로 학교 기본정보·통폐합 자료와 맞춰 이어 쓴다.
description_portal: 제주특별자치도교육청 산하 폐교학교의 재산대부현황 제공자료입니다. 제공정보는 총 12가지로 연번, 학교명, 폐교연월일, 소재지, 토지대부면적(제곱미터), 건물대부면적(제곱미터), 대부용도, 대부시작일, 대부종료일, 대부료(천원), 대부받은 자, 통합학교 입니다. 학교명은 폐교학교명, 폐교년월일은 폐교일을 나타내며, 소재지는 폐교학교의 소재지를 의미합니다. 토지대부면적 및 건물대부면적은 각각의 대부면적을 의미하고 대부용도는 폐교재산의 대부용도를 의미합니다. 대부받은 자는 폐교재산을 대부받아 사용하는 자 입니다.
