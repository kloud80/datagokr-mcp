summary_user: 울산광역시교육청 관할 학원·교습소가 운영하는 과정·과목(반)별로 학원명, 대표주소, 교습계열, 정원, 학습일수·시간, 교습비와 차량비·급식비 등 기타경비, 총교습비, 강사수를 담은 건별 원천 파일이며, 포털 설명상 학원 24,209건과 교습소 5,099건을 포함한다. 학부모가 동네 학원의 과목별 교습비와 정원을 비교하거나, 분석가가 울산 안 학원가 밀집도를 상권·주택 수요 신호로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대표주소를 지오코딩하거나 학원명으로 맞춰 연결해야 한다.
description_portal: 울산광역시교육청의 학원 및 교습소 현황입니다나이스 대국민서비스의  학원서비스에서 대국민에게 공개된 울산광역시교육청의 학원 및 교습소의 학원명, 교습정보, 정원,  교습비 등 종합정보를 제공합니다.제공 내역은 학원명, 교습소명, 주소, 과목명, 교습자 성명, 교습자, 강사수, 총교습비, 정원 등 해당 학원 및 교습소에 에서 운영하고 있는 과정 및 과목을 확인할 수 있습니다.학원 및 교습소 현황은 헉원24,209건 교습소 5,099건의 데이터를 포함하고 있습니다.학원 및 교습소에 대한 자세한 내용은 해당 강남교육지원청, 강북교육지원청 학원 담당자에게 문의하시기 바랍니다.
