description_portal: 이 자료는 성교육, 보건교육, 인성교육, 청소년 문화, 장애 이해 교육 등 학교 현장에서 활용되는 다양한 시청각 교육자료의 목록을 정리한 데이터입니다. 각 자료는 교육 목적에 따라 세분화되어 있으며, 성교육 인형과 같은 체험형 교구부터 EBS·KBS에서 제작한 전문 영상 콘텐츠까지 폭넓게 포함되어 있습니다. 특히 ‘성교육용 인형 임신출산’, ‘해피 탄생’ 등 실물 교구는 체험 중심 교육에 적합하며, ‘구성애의 눈높이 성교육’, ‘청소년이 꼭 알아야 할 성 이야기’ 등 영상 자료는 학생들의 이해도를 높이는 데 효과적입니다. 또한 ‘장애이해 영상 collection’, ‘따뜻한 기술 희망이 되다’는 인권·배려·공감 교육에 활용할 수 있는 중요한 자료로, 학교 인성 및 공동체 교육 프로그램에 연계하기 좋습니다. 이 목록은 학교 상담실, 보건실, 학생안전부, Wee클래스, 학부모 교육, 특수교육 지원 등 다양한 교육 현장에서 활용도가 매우 높으며, 자료 수량 정보가 포함되어 있어 실제 교육 운영 시 대여·관리에도 용이한 실무형 데이터입니다.
