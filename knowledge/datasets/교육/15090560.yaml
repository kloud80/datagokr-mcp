description_portal: 등록연도~전년도까지의 민간자격취득현황 데이터입니다. 취득현황은 민간자격정보서비스(www.pqi.or.kr)를 통하여 자격운영기관이 입력 및 관리하며, 취득현황 데이터의 입력 시점에 따라 실제 수치와 차이가 있을 수 있습니다. 또한 등록자격이더라도 미입력된 데이터가 존재할 수 있으므로 정확한 데이터는 해당 기관에 문의하시기 바랍니다. ※ 공식적인 통계자료가 아니며, 별도의 검증이 이루어지지 않은 데이터이므로 민간자격취득 시 동향 분석 등 참고 데이터 용도로만 활용하시기 바랍니다.※ 취득현황 데이터의 경우 1년 운영 후 그 다음년도에 전년도 취득현황을 입력하는 방식입니다.(예-2024년 취득현황은 2025년에 입력)
