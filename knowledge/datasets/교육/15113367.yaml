summary_user: 한국장학재단의 다자녀 국가장학금 지원 금액을 기준년도·학기(1·2학기)·학제(일반대·전문대)·설립형태(국공립·사립)·대학소재지(광역지자체)별로 묶어 총수혜금액으로 담은 집계 데이터이며, 약 7.5KB 분량의 CSV 파일로 활용신청 없이 받는다. 정책 분석가나 지자체·대학 관계자가 "어느 시도 소재 사립대에 다자녀 장학금이 얼마나 지원됐고 학기별로 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 국가장학금 유형별 지원금액 자료와는 연도·학기·학제·설립형태·소재지 명칭을 맞춰 이어 쓴다.
limits: 대학 개별·학생 개별 수혜 내역이 아닌 지역·학제·설립형태 단위 합계 금액이라 대학별 비교나 수혜 인원 산출에는 쓸 수 없다. 조인 키가 없어 다른 데이터와는 명칭 매핑으로만 연결되며, 2025년 1학기부터 지원 대상이 8구간에서 9구간으로 넓어져 연도 간 금액 비교 시 대상 범위 변화를 감안해야 한다.
