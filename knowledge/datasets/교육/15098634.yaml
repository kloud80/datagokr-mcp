summary_user: 2021년 위(Wee) 프로젝트 현황 조사(기준일 2021년 4월 1일)에서 발췌한 가정형·병원형 위(Wee)센터와 위(Wee)스쿨의 지역별 기관명 목록을 hwpx 파일 한 건(약 41KB)에 담는다. 학부모나 상담·교육 관계자가 "우리 지역에 가정형 위센터나 위스쿨이 어디 있는가"를 확인하거나, 분석가가 지역별 위기학생 지원기관 분포를 살피는 데 쓴다. 전역 조인 키가 없어 학교알리미 등 다른 자료와는 기관명·지역명을 직접 맞춰야만 이어 쓸 수 있다.
limits: 실측 컬럼에 전역 조인 키가 없어 기관 코드 기반 자동 연결이 되지 않고, 이름 매칭에 의존해야 한다. 포털 설명상 2021년 4월 1일 기준으로 발췌·재편집한 표라 이후 개설·폐지 변동은 이 파일만으로 확인하지 않는다.
