summary_user: 인천광역시 남동구에 있는 특수학교와 대안학교를 학교 한 곳당 한 행으로 담은 소규모 목록(CSV 약 649바이트)으로, 학교명·설립구분·주소·연락처·홈페이지·위도·경도·데이터기준일자를 담는다. 학부모나 교육 관계자가 "남동구에서 집 가까운 특수학교나 대안학교는 어디이고 국공립인가 사립인가"를 확인하는 데 쓴다. 전역 조인 키(표준 학교코드 등)가 없어 다른 학교 기본정보·교원·학생 통계와는 학교명으로 맞춰 붙이고, 위도·경도로 지도나 학구도 같은 공간 데이터와 겹쳐 쓴다.
limits: 표준 학교코드 같은 공통 키가 없어 교육청 학교 마스터나 통계와 정확히 연결하려면 학교명 매칭이 필요하다. 범위는 남동구 한 곳뿐이라 인천시 전체나 다른 시군구 비교에는 이 파일만으로 부족하다.
