summary_user: 한국자산관리공사가 2018~2022년에 운영한 공무원직무전문교육·정보화교육·직무공통교육 등의 교육과정을 과정·차수 단위로 담은 CSV 파일(약 53KB)로, 과정명·교육형태(온라인/오프라인)·교육대상·기간·교육시간·수료인원·강사수·만족도를 담는다. 국유재산 관리실무나 온비드 이용기관 교육 같은 과정이 연도별로 몇 차례 열렸고 수료인원과 만족도가 어땠는지 확인하려는 공무원·교육 담당자·분석가가 쓴다. 공사 내부 과정번호(kamco_course_no)로 같은 과정의 차수끼리 묶을 수 있지만, 학교코드나 행정구역 코드처럼 다른 교육 데이터와 이어 쓸 공통 키는 없다.
description_portal: '한국자산관리공사 교육운영 부서에서 2018년부터 2022년까지 진행하였던 교육(공무원직무전문교육, 정보화교육, 직무공통교육 등)에 대한 교육 과정명(예: 국유재산 관리실무, 공유재산 용도폐지, 온비드 이용기관 교육, 국가채권 관리실무, 직무공통, 조세정리, 채권관리, 업무분석 전문가 과정 등), 과정번호, 교육 차수, 교육 형태(온라인/오프라인), 과정에 대한 상세 내용, 교육대상(맞춤형/공개모집), 일시(시작일~종료일), 교육 진행 시간, 수료인원, 강사수, 만족도(강사평균만족도 포함) 등에 대한 데이터'
