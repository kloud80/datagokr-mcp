summary_user: 경기도 내 초·중·고·기타 학교별로 기준연도마다 1~6학년 평균 학생 수, 특수학급·순회학급 수, 학급당 평균 학생 수, 교사 수, 교사 1인당 평균 학생 수를 담은 학교 단위 집계 자료다. 교육청·학부모·연구자가 '우리 시군에서 학급당 학생 수가 많거나 교사 1인당 학생 부담이 큰 학교는 어디인가'를 따지거나 소규모 학교 현황을 볼 때 쓴다. 전역 조인 키는 확인되지 않았으며, 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)·학교명·시군 코드를 매핑해 학교 기본정보나 다른 교원·학생 통계와 이어 쓴다.
description_portal: '이 데이터는 경기도 내 초·중·고·기타 학교의 학년별 및 학급별 학생 수 현황을 제공합니다.학교별로 1~6학년 평균 학생 수, 특수학급 및 순회학급 평균 학생 수, 학급당 평균 학생 수, 교사 수, 교사 1인당 평균 학생 수 등의 지표가 포함됩니다.교육청, 학부모, 연구자들은 이 데이터를 통해 학급당 적정 학생 수 판단, 교사 인력 배치 계획, 학령인구 변화 분석 등에 활용할 수 있습니다.또한 학급 수와 학생 수 비교를 통해 교육 자원의 효율성 진단이나 소규모 학교 정책 수립에도 유용하게 사용될 수 있습니다.용어해설순회학급: 특수교사 또는 서비스 인력이 복지시설이나 병원 등을 방문해 제공하는 학급 형태학급학생수평균값: 전체 학생 수를 학급 수로 나눈 평균값교사1인당학생평균값: 교사 수 대비 학생 수의 평균값 (교육 부담 측정 지표)'
