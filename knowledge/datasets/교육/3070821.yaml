summary_user: 칠곡군에서 운영 중인 학원과 교습소를 한 곳당 한 행으로 담은 목록 파일(csv, 약 21KB)로, 구분(학원·교습소), 이름, 교습 분야, 주소, 전화번호가 들어 있다. 학부모가 '우리 동네에 어떤 분야 학원이 있나'를 찾거나, 분석가가 칠곡군 안의 학원 밀집도를 상권·주택 수요 신호로 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 지오코딩하거나 학원명을 매칭하는 방식으로만 잇고, 다른 교육지원청의 같은 제목 파일과 쌓아 지역별로 비교한다.
limits: 학원 등록번호 같은 공통 식별 키가 없어서 학원 인허가나 다른 기관 데이터와 정확히 1:1로 연결하기 어렵다. 범위는 칠곡군 한 곳뿐이고 좌표가 아닌 주소 문자열만 있어서, 지도에 올리려면 따로 지오코딩해야 한다.
