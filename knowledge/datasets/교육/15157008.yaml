description_portal: '본 KOMIPO기술연구원 수탁교육 운영 현황 데이터는 한국중부발전이 추진한 글로벌 역량 강화를 위한 국내외 교육 위탁 사례를 담고 있습니다. 항목으로 구분(국내 또는 해외), 교육시작일자, 교육종료일자, 과정명, 교육대상, 인원(단위: 명),계약금액(단위: 원), 비고 총 8개로 구성되어 있으며 지역(국내/해외) 및 교육 분야별(기술, 리더십 등) 투자 현황을 투명하게 공개하여, 교육 효과를 객관적으로 평가하고 최적의 교육 파트너 선정 기준을 마련하는 데 기여합니다. 조직의 지속 가능한 성장을 위한 교육 투자의 방향성을 제시합니다.'
