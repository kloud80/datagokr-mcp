summary_user: 한국장학재단 학자금대출의 상품별·연도별·학기별·학생소속군별 대출 신청기간과 실행기간(시작·종료일자)을 담은 일정 관리 파일로, 건별 대출 실적이 아닌 일정표이며 전국 단위의 작은 CSV(약 4KB)입니다. 대학생·학부모가 "이번 학기 학자금대출은 언제까지 신청하고 언제 실행되나"를 확인하거나, 분석가가 상품·학기별 일정 변화를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 학자금대출 통계와는 상품명·대출년도·대출학기를 이름 그대로 맞춰 연결해야 한다.
description_portal: 한국장학재단은 경제적 여건에 관계없이 능력과 의지가 있는 학생이면 누구나 균등한 고등교육 기회를 가질 수 있도록 다양한 학자금대출 제도를 운영하고 있습니다. 해당 데이터는 학기별 학자금대출 일정관리 기준으로, 상품별로 대출신청시작일자, 대출신청종료일자, 대출실행시작일자, 대출실행종료일자에 관한 정보를 제공합니다.학자금대출 상품에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.
