description_portal: 이 데이터는 한국방송통신전파진흥원에서 시행하는 국가기술자격검정 시험 응시자의 연도별 적합/부적합 통계 자료입니다. 2015년부터 2019년까지 기사, 산업기사, 기능사 등 자격종목별 응시자격 적합, 부적합, 미제출 인원 현황을 포함합니다. 데이터는 응시 자격 코드 별 설명, 성별, 2015~2019년까지의 적합/부적합/미제출/합계로 구성됩니다. 성별은 전체/여성으로 구분됩니다. 이를 통해 국가기술자격 응시자의 학력, 경력 등 자격 충족 여부를 파악할 수 있고, 응시자격 판정의 적합률과 행정 효율성을 분석하는 기초자료로 활용될 수 있습니다. 또한 자격종목별 응시 경향과 여성 응시자 비율을 비교함으로써 자격검정 운영의 성평등 정책 수립에 참고할 수 있습니다. 데이터는 매년 응시자격 검토 결과를 기반으로 관리 중입니다.
