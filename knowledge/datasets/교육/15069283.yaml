summary_user: 한국장학재단이 현재 운영하는 학자금대출 상품 가운데 거치기간(이자만 내는 기간)이 있는 상품(일반상환학자금대출, 학점은행제 학습자 학자금대출 등)별로 최대 대출기간과 최대 거치기간을 개월 수로 담은 소규모 기준표(CSV 약 405바이트)입니다. 학생·학부모가 '일반상환 학자금대출을 받으면 최대 몇 년 동안 이자만 내고 언제부터 원금을 갚아야 하나'를 확인하거나, 상담·안내 서비스가 상품별 상환 일정 기준을 설정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 학자금대출·장학 데이터와는 상품명을 기준으로 이름 매핑해 이어 써야 한다.
description_portal: 한국장학재단에서는 경제적 여건에 관계없이 능력과 의지가 있는 학생이면 누구나 균등한 고등교육 기회를 가질 수 있도록 다양한 대출제도를 운영하고 있습니다. 해당 데이터는 한국장학재단에서 운영하는 대출상품 중 거치기간(학생이 이자만 납부하는 기간)이 존재하는 상품(일반상환학자금대출, 학점은행제 학습자 학자금대출 등)의 최대 대출기간 및 거치기간에 관한 데이터입니다.  -현재 한국장학재단에서 운영하지 않는 대출상품은 제외학자금대출 상품에 관한 자세한 정보는 재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.
