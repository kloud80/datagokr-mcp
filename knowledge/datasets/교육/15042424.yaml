description_portal: 이 데이터는 한국방송통신전파진흥원이 시행한 국가기술자격검정의 일부 종목별 합격 통계 현황을 정리한 것입니다. 해당 종목은 육상무선통신사, 항공무선통신사, 해상무선통신사, 제1급아마추어무선기사, 제2급아마추어무선기사, 제3급아마추어무선기사입니다. 데이터는 종목별, 성별, 필기/실기에 대한 접수/응시/합격/합격률로 구성됩니다. 성별은 전체/여성으로 구분되어 있으며, 필기와 실기의 통계가 제공됩니다. 본 데이터는 자격시험 응시 및 합격 현황을 분석하여 무선통신 분야 자격제도의 운영 추이를 파악하고, 참여율과 합격률을 통해 기술인력 양성의 균형적 발전을 진단하는 데 활용될 수 있습니다. 또한 자격종목별 수요와 합격률을 파악할 수 있습니다. 데이터는 국가기술자격검정 결과를 기반으로 매년 관리 중입니다.
