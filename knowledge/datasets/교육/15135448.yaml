summary_user: 경남대입정보센터가 연도별로 관리하는 대학 목록으로, 대학 한 곳(캠퍼스)·연도마다 한 행에 대학명(한글·영어), 대학 구분, 지역, 설립 구분, 주소·연락처·홈페이지와 대입전형 기본계획, 수시·정시 모집요강, 입시결과 항목을 담는다. 경남 지역 고등학생·학부모·진학 교사가 특정 대학의 연도별 수시·정시 모집요강과 입시결과 자료를 찾거나 지역·설립 구분별로 대학을 골라 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 대학 데이터와는 대학명·주소로 맞추거나 같은 기관이 제공하는 데이터의 고유번호(대학 고유번호)로만 이어 쓴다.
description_portal: '경상남도교육청에서 제공하는 "경상남도교육청_경남대입정보센터_연도별대학정보" 데이터는 경남대입정보센터가 연도별로 관리하는 대학 관련 주요 정보를 체계적으로 정리한 데이터입니다. 이 데이터는 각 대학의 고유번호, 연도, 대학명(한글 및 영어), 색인, 대학 구분(예: 4년제, 전문대 등), 지역, 캠퍼스 구분, 상태(운영 여부), 설립 구분(국공립/사립), 우편번호, 주소, 전화번호, 팩스번호, 홈페이지, 사용 여부, 로고, 간단 대학 구분, 표시명, 대입전형 기본계획, 수시·정시 모집요강, 입시결과, 대학 고유번호 등 다양한 항목을 포함하고 있습니다.이 데이터는 경상남도 내 대학 입시 정보 제공 및 진로·진학 상담 지원을 목적으로, 각 대학 및 관계기관에서 공식적으로 발표한 정보를 수집하여 관리합니다. 수집은 각 대학에서 공개하는 공식 자료(모집요강, 입시결과 등)와 교육청 내 진로교육과에서 확보한 정보를 바탕으로 이루어집니다. 데이터의 보유 및 제공 근거는 「공공데이터의 제공 및 이용 활성화에 관한 법률」과 교육청의 진로·진학 정보 제공 의무에 기반합니다. 데이터는 매년 1회 정기적으로 업데이트되며, 최신 대학 입시 정책과 결과를 반영하여 신뢰도를 높이고 있습니다.이 데이터는 고등학생, 학부모, 교사, 진로상담사 등에게 대학 정보 탐색, 진학 전략 수립, 진로지도, 교육정책 연구 등 다양한 분야에서 활용될 수 있습니다. 특히 경남 지역 학생과 학부모가 대학별 입시 정보를 쉽게 비교·분석하고, 진로결정에 필요한 객관적 자료로 활용할 수 있도록 설계되어 있습니다'
