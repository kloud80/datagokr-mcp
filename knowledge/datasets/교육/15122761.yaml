summary_user: 경기도인재개발원 교육관리시스템에 등록된 기관을 한 행씩 담은 원천 자료로, 기관 소재 시군명·시군구명, 도로명·지번 주소, 우편번호를 개별 주소 단위로 담는다. 교육 담당자나 분석가가 '인재원 교육에 등록된 기관이 경기도 어느 시군에 몰려 있는가'처럼 기관 분포를 지도나 시군별 집계로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)·주소 문자열 매칭으로만 붙일 수 있고, 학교코드 같은 표준 코드로는 연결되지 않는다.
description_portal: 이 데이터는 경기도인재개발원의 교육관리시스템을 통해 수집된 기관 등록 정보를 포함하며, 기관 소재 시군명, 도로명주소, 지번주소 등의 항목으로 구성되어 있습니다. 경기도 전역의 다양한 시군에 위치한 교육시설 또는 관련 기관의 공간 정보를 담고 있으며, 등록된 주소들은 인재개발원의 운영, 지원, 또는 관리와 연계된 시설일 가능성이 있습니다. 이 자료는 교육시설 분포 분석, 공공기관 위치 기반 서비스 구축, 경기도 교육행정 체계 개선, 지역 간 교육자원 격차 해소 등의 정책 설계에 활용될 수 있으며, GIS 기반 공공데이터 시각화 및 타 기관 데이터와의 연계 분석에도 유용합니다.
