description_portal: 이 데이터는 광주광역시 서구에서 운영 중인 공공도서관의 전자책 보유 현황을 체계적으로 정리한 자료입니다. 전자책의 순번, 제목, 저자, 출판사, 보유 수량, 카테고리, 장르, 국제표준도서번호(ISBN), 입고일자, 모바일 서비스 제공 여부 등의 항목을 포함하고 있으며, 총 5,673건의 데이터를 제공합니다.해당 데이터는 지역 공공도서관의 디지털 자료 보유 현황을 분석하는 데 활용될 수 있으며, 장르별/출판사별 전자자료 분포 현황 파악, 디지털 독서 환경 개선, 수요 기반 전자책 확충 정책 수립 등에 필요한 기초자료로 유용합니다.특히 모바일 서비스 제공 여부 데이터가 포함되어 있어 주민의 비대면 정보접근 편의성 분석에도 활용할 수 있으며, 국제표준도서번호(ISBN)와 연계하여 국가 단위의 도서유통 정보와도 연결 가능합니다. 연간 단위로 정기 업데이트되며, 교육정책, 평생학습 지원, 독서문화 활성화 등의 분야에 다양하게 활용될 수 있는 공공데이터입니다.
