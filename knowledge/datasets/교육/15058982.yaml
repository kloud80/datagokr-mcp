summary_user: 경기도 소재 특수대학원의 졸업생 진로 현황을 졸업연도·대학원·단과대학·학과(전공) 단위로 집계해, 석사학위 취득자 수와 그중 취업·진학·입대·외국인 유학생·취업불가능·기타·미상 인원을 담는다. 고등교육 연구자나 정책 담당자가 "경기도 특수대학원에서 어떤 전공 졸업생의 취업자 비중이 높은가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 학교 기본정보나 다른 교육 통계와는 대학원명·학과명 같은 이름 매핑으로만 이어 붙인다.
description_portal: 졸업생의 취업현황(특수대학원) 데이터는 경기도에 위치한 특수대학원의 졸업생 학위 취득 및 취업 결과를 제공하는 교육 통계자료입니다. 주요 항목으로는 학교종류명, 설립구분명, 대학원명, 졸업연도시기, 단과대학명, 학과명(전공), 학과특성명 등이 있으며, 석사학위취득자합계, 석사학위취업자수, 석사학위진학자수, 석사학위입대자수, 석사학위외국인유학생수, 석사학위취업불가능자수, 석사학위기타인원수, 석사학위미상인원수 등 세부 취업 및 진로 현황을 포함합니다. 이 데이터는 건강보험 DB 연계를 통한 취업통계 방식으로, 학교별 취업률은 직접 산출되지 않지만 전체 졸업생의 진로 흐름을 파악할 수 있습니다. 이를 통해 대학원 교육 성과 평가, 학과별 취업지원 정책 수립, 고등교육 정책 연구, 특수대학원 졸업생의 사회 진출 경향 분석에 활용될 수 있습니다. 또한 외국인 유학생 현황을 포함하고 있어 국제 교육 협력 및 유학생 정책 연구에도 유용한 기초자료가 됩니다.
