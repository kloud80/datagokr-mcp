summary_user: 마이스터넷을 통해 기능경기 신청에 필요한 직종별 경기 일정(시작·종료일), 경기 장소, 신청 인원을 전국 범위로 제공하는 API로, 실측 필드 목록에는 결과코드·페이지 정보만 확인된다. 기능경기에 참가하려는 학생·기능인이나 지역 담당자가 '우리 지역에서 언제 어떤 직종 경기가 열리고 몇 명이 신청하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가자격 종목·시험 일정 데이터와는 직종명·지역명 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
limits: 공통 조인 키가 없어 다른 데이터와 자동 결합이 어렵고 이름 매핑이 필요하다. 비공간 데이터라 좌표 기반 분석에는 경기장 주소를 따로 변환해야 하며, 개발계정은 일 5,000회 호출 제한이 있다.
