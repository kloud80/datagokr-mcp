description_portal: 한국산업인력공단에서 제공하는 마이스터넷을 통해 기능경기 신청을 위한 직종별 경기 일정 및 장소, 인원 수를 제공하여 편의성을 높인다.신청 정보를 활용하여 지역 및 일정 정보를 제공하고 지역 발전에 도움을 준다.지역 경쟁력을 확보하고, 신청 인원을 예측하여 지역 홍보 발판을 마련할 수 있다.경기시작일자, 경기종료일자를 활용하여 인구 유입량을 확인하고, 경기장 근처 인명사고 방지를 사전에 예방할 수 있다해당 지역에 열리는 직종을 확인하여 기술 경쟁력을 높일 수 있다대회가 열리는 경기장을 파악하여 사전 준비 및 주변 관광 안내를 할 수 있다
