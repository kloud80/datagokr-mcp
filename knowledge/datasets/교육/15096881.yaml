description_portal: '"제주특별자치도 내 영재 교육 교사 강사 현황 데이터를 제공합니다.항목: 연도, 시도, 영재학교및과학고, 교육청영재교육원, 대학영재교육원, 영재학급 등* 제주특별자치도 내의 영재 교육 기관별로 교사 및 강사 수를 연도별로 기록한 공식 통계자료입니다. 여기서 영재 교육 기관은 영재학교, 과학고, 교육청 영재원 등 다양한 형태를 포함하며, 교사와 강사의 인력 규모가 어떻게 변화해 왔는지를 보여줍니다. 이 정보는 교육 자원의 분포와 변화 패턴을 이해하는 데 중요한 역할을 하며, 교육정책 수립, 인재 양성, 학생 지원체제 구축 등에 기초자료로 활용될 수 있습니다.* 활용 분야 : 인력 확보 및 배치 정책, 학생-교사 비율 개선 및 교육 품질 평가, 교육 정책 변화와 인력 변화 연계 분석 등"'
