description_portal: 충청북도 진천군에서 운영하는 지역주민의 디지털 문해력 증진을 목표로 운영한 정보화교육 프로그램 운영 데이터입니다. 교육내용, 교육장소, 교육인원 신청자수 등 디지털 소외계층의 정보접근성 개선 효과를 분석할 수 있습니다. 컴퓨터기초, 엑셀기초, 스마트폰 활용, 인터넷 기초, SNS 사용법 등 다양한 커리큘럼별 운영현황을 담고 있어 향후 교육계획 수립 및 예산배정에 활용 가능합니다. 월별, 분기별 교육성과 추이 분석을 통해 차년도 교육수요 예측, 강좌 개편, 강사배치, 예산편성 등 효율적인 정보화교육 정책 수립의 기초자료로 활용됩니다.
