description_portal: 이 자료는 2024년 12월 31일 기준 광주광역시 여성새로일하기센터 5곳(광산구, 북구, 광주본센터, 서구, 송원대)의 취업지원 실적을 종합한 통계입니다. 구인업체 수, 구인자 수, 구직자 수, 취업자 수 등을 포함해 총 91개 항목으로 구성되어 있으며, 연령대별(20대 미만부터 60세 이상), 학력별(무학부터 박사), 직종별(사무, 제조, 사회복지 등), 고용형태별(정규직, 시간제, 창업 등)로 세부 분류되어 있습니다. 또한 결혼이민자, 북한이탈주민, 장애인, 고령자, 여성가장 등 취약계층의 취업 실적도 따로 집계되어 있어 사회적 약자에 대한 지원 실태를 파악할 수 있습니다. 이 자료는 지역 고용 정책 수립 및 맞춤형 취업 지원 대책 마련에 매우 중요한 기초 데이터를 제공합니다.
