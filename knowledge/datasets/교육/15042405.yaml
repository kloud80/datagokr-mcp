description_portal: 이 데이터는 한국방송통신전파진흥원이 시행한 국가자격검정 취득교육의 지역별 통계 현황을 정리한 것입니다(2015~2019년). 데이터는 육상무선통신사, 제한무선통신사, 항공무선통신사 등 주요 무선통신 분야에 대해 연도별, 자격종목별, 성별, 지역(서울, 부산, 전남, 충청, 경북, 전북, 강원, 제주, 경인)별 그리고 전체의 취득 교육 횟수로 구성됩니다. 성별은 전체와 여성으로 구분됩니다. 본 데이터는 자격 취득 교육의 지역별 참여 분포와 성별 비율을 파악할 수 있도록 구성되어 있으며, 전파·통신 분야 기술인력 양성의 균형적 발전을 위한 정책 수립과 교육 운영 효율성 분석에 활용될 수 있습니다. 또한 연도별 변화를 통해 지역 간 교육 수요 차이와 여성 참여 추세를 확인할 수 있습니다. 데이터는 국가기술자격 취득교육 운영 결과를 기반으로 매년 관리 중입니다.
