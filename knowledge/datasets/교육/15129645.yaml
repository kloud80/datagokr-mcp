description_portal: 이 데이터는 해양수산부에서 온라인 플랫폼 강사를 대상으로 한 해양환경교육 실적을 집계하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양환경 협력사업의 일환으로 민간단체에서 해양환경교육을 실시한 내역 중 강사 이름을 제외한 교육사명, 시작일시, 활동상세 등으로 구성되어 있습니다.  본 데이터는 해양환경교육의 운영 실태를 파악하거나 민간단체의 해양환경교육 활동 현황을 분석하는 데 활용될 수 있으며, 이를 통해 특정 교육 유형의 참여도 및 실적 추이 분석, 해양환경교육 활성화를 위한 활동 기획, 정책 지원 자료로 사용될 수 있습니다.
