summary_user: 부산 지역에서 운영 중인 학원의 교습과목(반)별 정보를 한 행씩 담은 원천 목록 파일로, 관할 교육지원청·학원명·전화번호·위치와 학원종류·분야·교습계열·과정, 강사 수·정원·총교습시간, 교습비·교재비·모의고사비·차량비 등 경비 항목과 총교습비를 담는다. 학부모가 "우리 동네 입시·보습 학원의 과목별 교습비와 부대 경비는 얼마인가"를 비교하거나, 분석가가 구·지역별 학원 밀집도를 학원 상권과 주택 수요의 신호로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학원명·주소(위치) 문자열이나 관할 교육지원청 이름으로 맞춰 이어야 하고, 다른 교육청의 학원·교습소 현황 파일과는 같은 항목끼리 나란히 붙여 쓴다.
description_portal: 부산에서 2026.6.15.현재 운영하고 있는 학원의  학원명, 연락처, 주소, 종류, 분야, 계열, 과정, 시간, 강사, 정원, 교습비, 교재비, 모의고사비, 재료비, 급식비, 기숙사비, 차량비, 피복비, 경비합계, 수강료에 대한 정보를 제공함. 데이터 추출 기준일 이후 설립, 휴원, 폐원하는 곳이 있으므로 실시간 정보를 제공하기는 어려우며 1년에 2번 정기적으로 학원정보를 제공함. 데이터를 조회하는 현재일 기준으로 정보를 조회하고자 하는경우 인터넷 포털사이트에서 학원민원서비스 검색 -> "부산" 지역선택 -> 학원이 있는 행정구역 선택 후, 명칭을 조회, 가장 최신으로 등록된 학원의 정보 조회가 가능함.
