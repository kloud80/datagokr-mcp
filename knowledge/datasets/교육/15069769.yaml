description_portal: 국외인적자원관리시스템은 재외동포, 국비유학생, 외국인 장학생 등 다양한 국제 교육 교류·장학 프로그램 참가자들의 증명서 발급을 지원하는 통합 관리 서비스입니다. 본 시스템을 통해 수료증명서, 성적증명서, 국비유학 사실 증명서, 장학증명서 등 주요 증명서를 온라인과 오프라인 방식으로 신청할 수 있으며, 발급 장소는 국립국제교육원 국제교류센터와 국제장학센터를 비롯한 지정 기관 또는 소속 대학을 통해 이루어집니다. 신청 방법은 전화, 이메일, 방문 상담 등 오프라인 절차와 국외인적자원관리시스템을 통한 온라인 절차가 병행되며, 일부 증명서는 대학 담당자의 승인 후 온라인으로 즉시 발급이 가능합니다. 이용 대상은 재외동포교육 수료생, 정부초청 외국인 장학생, 한일공동이공계학부유학생, GKS 우수교환학생 등으로 구체적으로 구분되어 있으며, 발급 시간은 평일 근무시간 내에 운영되고 주말에는 발급되지 않습니다. 발급 소요시간은 즉시 또는 1시간 이내로 신속히 처리되며, 증명 수수료는 별도로 부과되지 않습니다. 발송 방식은 직접 수령을 기본으로 하되, 우편, 팩스, 이메일 송부 등 다양한 채널을 제공하며, 일부 증명서는 온라인 발급만 가능합니다. 또한 졸업생 신청 제한, 수료 후 발급 가능, 신청자의 추가 인적사항 확인 등 세부 유의사항이 존재합니다. 본 데이터는 증명서 발급 구분, 신청 방법, 발급 기관, 이용 대상, 발급 시간, 발급 소요시간, 발송 방식, 유의사항 등 세부 정보를 통합하여 제공함으로써, 국제 교육 교류 및 장학사업 관련 참여자들이 신속하고 체계적으로 증명서를 발급받을 수 있도록 지원하는 공공 서비스의 현황을 보여줍니다.
