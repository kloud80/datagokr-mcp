description_portal: 한국과학창의재단은 일반고 학생들의 역량 강화 및 긍정적 성장 경험을 발굴하고 공유함으로써, 고교 교육에 대한 국민적 관심을 높이고 바람직한 학교 문화를 확산시키고자 '나의 고등학교 성장 이야기' 공모전을 개최하였습니다. 본 데이터는 공모전의 수상작 목록으로, 학생, 교사, 학부모가 겪은 생생한 교육 현장의 이야기를 담고 있습니다.개방 데이터는 학생 및 교사, 학부모 부문의 수상작 17편의 목록입니다. 데이터는 수상 구분(최우수상, 우수상, 장려상), 수상작 제목, 소속 학교, 수상자 구분(학생/교사/학부모) 정보로 구성되어 있어, 고등학교 교육과 관련된 다양한 주체들의 성공적인 교육 경험과 성장 사례를 확인할 수 있습니다.전국의 중·고등학교 학생 및 교사, 학부모는 수상작들의 사례를 통해 학교생활에 대한 동기를 부여받고, 교육 활동에 대한 아이디어를 얻을 수 있습니다. 교육 정책 입안자 및 연구자들은 현장의 긍정적 변화 사례를 분석하여 일반고 역량 강화 정책 수립 및 지원 방안 마련을 위한 기초 자료로 활용할 수 있습니다.
