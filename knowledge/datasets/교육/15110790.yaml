summary_user: 경기도 읍면동 단위로 설치·운영 중인 평생학습센터를 센터 한 곳씩 담은 목록으로, 시군명(brgh_nm), 센터명, 도로명·지번 주소, 우편번호, 전화번호, 위경도 좌표를 포함한다. 주민이나 정책 담당자가 '우리 동네에서 가장 가까운 평생학습센터는 어디인가', '시군별로 읍면동 학습센터가 고르게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군명·주소를 이름으로 맞추거나 위경도 좌표로 다른 시설 데이터와 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 읍면동 단위에서 설치·운영 중인 평생학습센터의 현황을 정리한 자료로, 도민 생활권에 밀접하게 연결된 지역기반 평생교육 인프라를 파악할 수 있는 정보입니다. 읍면동 평생학습센터는 일반적인 법령상 평생교육시설과는 달리, 지방자치단체 조례에 따라 설치되어 주민의 자치활동과 연계된 생활 밀착형 학습 공간으로 기능하고 있으며, 주민자치회, 주민센터, 복지관 등과 결합해 운영되기도 합니다. 이 데이터는 지역 간 평생학습 인프라 격차 분석, 학습 접근성 평가, 주민 참여형 학습 프로그램 확대 기획, 평생교육 기반 정책 수립 등에 활용될 수 있습니다.
