summary_user: 경기도 행정도서관이 구독 중인 정기간행물을 한 건씩 담은 목록으로, 간행물명·출판사명·간행주기·분야를 담는다. 공무원이나 행정 연구자가 '도서관에서 어떤 분야의 전문지를 어떤 주기로 받아보는가'를 확인하거나, 분야별 구독 구성을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 간행물명·출판사명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기도청 산하 행정도서관에서 구독 중인 정기간행물 목록을 정리한 자료로, 간행물명, 출판사명, 간행주기명, 분야명 등의 항목으로 구성되어 있습니다. 경기도 행정도서관은 1963년 개관한 행정 전문도서관으로, 공무원 및 행정 관련 연구자들을 위한 정책 자료, 보고서, 전문 간행물을 제공하고 있습니다. 본 데이터는 공공기관 도서관 운영 현황, 행정지식 기반 강화, 분야별 정보 접근성 분석, 공공정보 큐레이션 현황 분석 등의 목적으로 활용될 수 있습니다. 연간 갱신되며, 공공데이터 Open API를 통해 정기적 데이터 수집이 가능합니다.
