description_portal: 복권기금 꿈사다리 우수 장학사업은 복권기금을 재원으로 저소득층 우수 초·중·고생을 발굴하여(2025년부터 초등학생 선발 확대) 대학까지 연계 지원하는 국가 장학 제도로서 교육의 희망사다리 역할을 수행해오고 있습니다. 본 연구는 2019년 시작된 복권기금 꿈사다리 장학사업이 5년 차에 접어들면서 사업의 재점검을 위한 5년 간의 운영 현황 검토 및 운영 결과에 대한 성과 분석 필요성이 제기되어 실시하게 되었습니다. 본 연구에서는 복권기금 꿈사다리 우수 장학사업 지원근거 및 선행연구 분석, 국내외 초중등 장학금 제도 현황 연구, 복권기금 꿈사다리 우수 장학금 모형에 대한 연구, 복권기금 꿈사다리 우수 장학금 지원 기준에 대한 연구, 복권기금 꿈사다리 우수 장학금 운영 예산 추계 등의 연구를 수행하였습니다. 연구 분석은 지원대상, 선발시기, 지원자격, 성적기준, 지원규모, 선발인원 등의 측면에서 분석하였습니다. 연구 방법은 문헌연구, 전문가 자문 및 이해관계자 의견수렴 등을 통해 이루어졌습니다. 본 연구를 통해 복권기금 꿈사다리 우수 장학사업의 성과를 분석하고 향후 개선 방향을 도출하였습니다.
