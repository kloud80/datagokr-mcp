description_portal: '이주 북한배경가정 자녀와 대학(원)생 간 멘토링 시, 대학(원)생의 학업 시간표와 중복된 시간에는 멘토링 활동이 불가능합니다. 이에, 대학(원)생의 학업 시간표가 어떤 시간대에 주로 있는지 데이터를 공개하오니 멘토링 계획 수립 시 참고하시길 바랍니다.데이터 제공 항목은 멘토의 학적 정보, 성별 정보, 멘토링 사업 참여대학의 소재지, 수업구분명, 요일구분명, 학업시작시간, 학업종료시간이 있습니다. 다문화·탈북(이주 북한배경)학생 멘토링장학금은 이주 북한배경 학생과 대학(원)생 간 매칭을 통해 이주 북한배경학생의 학교생활 적응 및 기초학습을 지원하고, 대학(원)생에게는 멘토링장학금을 지원하는 것을 목적으로 합니다.※ 장학금 관련 상세 정보는 한국장학재단 홈페이지 참고(경로: 한국장학재단 홈페이지(https://www.kosaf.go.kr) > 인재육성 > 다문화·탈북학생 멘토링)'
