summary_user: 부산 해운대구 관내 초등학교를 학교 한 곳당 한 행으로 담은 소규모 목록(CSV 약 4KB)으로, 학교명·관할 교육청·설립 구분(공립·사립)·주소·대표 연락처·홈페이지를 담는다. 해운대구로 이사 오는 학부모가 동네 근처 초등학교가 어디 있고 공립인지 사립인지, 연락처와 홈페이지가 무엇인지 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교명이나 주소를 매칭해 교육청 학교 기본정보, 학생·교원 통계, 학구도 데이터와 이어 쓴다.
description_portal: 본 자료는 부산광역시 해운대구 관내 초등학교에 대한 정보를 제공합니다.포함된 데이터는 해운대구 관내 초등학교의 학교명, 각 학교가 속한 관할 교육청, 설립 구분(공립·사립), 각 학교별 주소, 대표 연락처, 홈페이지입니다.[데이터 안내 및 변경]매년 1회 해운대구 관내 초등학교에 대한 데이터를 업데이트합니다.본 데이터는 교육청 및 교육지원청의 자료를 기반으로합니다.본 데이터는 해운대구 관내 학교에 대한 일반 데이터이며 보다 자세한 데이터는 각 학교별 대표 홈페이지 등을 통해 확인하실 수 있습니다.
