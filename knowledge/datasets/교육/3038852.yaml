description_portal: 전국 교과서 목록표 정보를 체계적으로 정리한 데이터셋으로, 교과서 정보관 사이트를 통해 제공되는 교과서 관련 종합 정보입니다. 이 데이터는 교육과정별, 출판년도별, 국검인정 구분별로 분류된 교과서 정보를 포함하고 있으며, 자료형태, 학교급, 학교구분, 서명, 저자, 행처(출판사), 정가, 사용학년 등의 상세 정보를 담고 있습니다. 교과서정책과에서 관리하고 있습니다. 교육 관련 연구, 교과서 선택, 교육정책 수립 등에 활용할 수 있는 유용한 정보원으로, 자동 갱신 시스템을 통해 최신 정보를 유지하고 있습니다. 무료로 이용 가능하며 이용허락범위에 제한이 없어 다양한 목적으로 활용할 수 있습니다.
