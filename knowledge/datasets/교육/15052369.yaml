description_portal: 서울시 대학 및 전문대학 DB 정보(한국어)는 서울시에 위치한 대학 및 전문대학의 기본 현황을 한눈에 파악할 수 있도록 정리한 데이터입니다. 각 학교별로 연도, 학교종류, 학교명, 본교·분교 구분, 학교상태, 설립 유형 등의 일반 현황과 함께, 우편번호, 지번 및 도로명 주소, 행정시·구·동 정보가 포함되어 있어 행정구역 단위의 분석이 가능합니다. 또한 전화번호, 팩스번호, 홈페이지 정보가 제공되어 이용자가 해당 대학에 직접 문의하거나 온라인으로 상세 정보를 확인할 수 있습니다. 이 데이터는 진학·진로 탐색, 교육 인프라 분포 분석, 고등교육 정책 수립 및 연구 등 다양한 분야에서 기초 자료로 활용할 수 있는 공공 교육정보입니다.
