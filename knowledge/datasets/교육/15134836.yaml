summary_user: 한국농수산대학교 입시 결과를 수시 1차·2차 모집구분과 4개 전형(일반·농수산·사회통합·지역균형), 18개 전공 모집단위별로 집계해 모집인원·지원인원·경쟁률·등록포기인원·합격자 평균등급을 담은 CSV 파일이다. 수험생과 학부모가 '어느 전공·전형의 경쟁률과 합격자 평균등급이 어느 정도였나'를 확인하거나, 분석가가 전형별 지원 수요와 등록 포기 규모를 비교하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 학교 기본정보·통계와는 학교명이나 모집단위(전공) 이름을 직접 맞추는 방식으로만 이어 쓴다.
description_portal: ○ 데이터 개요  - (데이터 설명) 한국농수산대학교 모집구분, 모집전형, 모집단위, 모집인원, 지원인원, 경쟁률, 등록포기인원 및 합격자 평균등급을 포함한 입시 결과 데이터  - (데이터 구성) 각 데이터가 쉼표(,)로 구분된 csv 파일 형식으로, "구분", "전형", "모집단위", "모집인원", "지원인원", "경쟁률", "등록포기인원", "합격자평균등급" 8개 컬럼으로 구성○ 컬럼별 설명  - (구분) 수시 1차, 수시 2차로 구분  - (전형) 일반전형, 농수산전형, 사회통합전형, 지역균형전형 4개로 구분  - (모집단위) 모집단위가 되는 한국농수산대학교 18개 전공으로 구분  - (모집인원) 모집단위별 모집인원  - (지원인원) 모집단위별 지원자 수  - (경쟁률) 모집단위별 경쟁률(지원인원÷모집인원)       * 소수 셋째자리에서 반올림한 값  - (등록포기인원) 최종합격 후 등록 포기인원 수  - (합격자평균등급) 최종합격자 평균 등급
