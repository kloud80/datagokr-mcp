description_portal: 이 문서는 학교 건물들의 외벽 치장벽돌 설치 현황을 다룹니다. 제공된 표본 데이터는 다양한 지역의 공립 및 사립 학교 건물에 대한 정보로, 다목적강당, 체육관, 특별교실, 교사동, 급식소 등 다양한 유형의 건물이 포함되어 있습니다. 각 건물은 지상층수, 연면적, 건축면적 및 외벽 치장벽돌 실수 등의 상세한 건축정보가 나타나 있어 학교 건물의 외벽 마감 상태를 한눈에 파악할 수 있도록 구성되어 있습니다. 이 자료는 외벽마감과 관련한 실단위 현황을 중심으로 학교 시설 전반의 건축 특성을 이해하는 데 활용됩니다.(제공데이터) 학교 건물별 치장벽돌 설치현황※ 단, 치장벽돌 등 외벽마감현황은 실단위로만 표시됨
