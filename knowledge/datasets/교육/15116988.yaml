summary_user: 전국 지자체와 민간장학재단 등이 고등학생에게 지원하는 학자금 상품을 상품 1건 단위로 담은 목록으로, 1,199행에 운영기관·지원내역·소득·성적 기준·모집 기간 등이 들어 있다. 고등학생과 학부모가 우리 지역이나 조건에 맞는 장학금이 무엇이고 언제까지 신청하는지 찾는 질문에 쓴다. 필드에 공통 코드표는 없고 홈페이지주소(address)가 유일한 조인 키라서, 상품별 공식 안내 페이지를 연결하는 데 쓴다.
description_portal: 전국 지자체, 민간장학재단 등에서 고등학생을 대상으로 지원하는 학자금 정보(운영기관, 상품명, 상품구분, 학자금 지원 유형, 신청대상, 신청기간, 지원금액, 지원인원 등)입니다. 한국장학재단의 장학금 지원 정보는 재단 누리집(https://www.kosaf.go.kr)을 참고바라며 학자금 지원정보(고등학생)에 관한 자세한 정보는 재단 홈페이지(https://portal.kosaf.go.kr/CO/jspAction.do?forwardOnlyFlag=N&forwardPage=pt/sm/cstmdsgngoods/PTSMCstmDsgnGoods_11M&beanName=PTSMCstmDsgnHgscGoodsSVC&methodName=getItgnSrchCstmDsgnGoodsList&inputVOName=kr.go.kosaf.portal.pt.sm.cstmdsgnhgscgoods.svc.PTSMCstmDsgnHgscGoodsSVO&ignoreSession=Y&no=1&lgclMenuClssCd=ss02&smclMenuClssCd=ss0205&naviParam=MK,01,01,05)를 참고바랍니다.
