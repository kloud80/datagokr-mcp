summary_user: 전국 영재교육기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 시도·지역, 기관유형, 기관명, 주소, 대표전화, 홈페이지, 모집영역을 담는다. 학부모나 학생이 우리 지역에 어떤 영재교육기관이 있고 어느 분야(모집영역)를 뽑는지 찾거나, 분석가가 시도별 영재교육기관 분포를 볼 때 쓴다. 공통 학교코드 같은 전역 조인 키가 없어 학교 기본정보 등 다른 데이터와는 기관명·주소 매칭이나 시도 이름 단위로만 이어 쓴다.
