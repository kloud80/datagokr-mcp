summary_user: 경기도가 지역서점 인증제에 따라 인증한 '경기도 인증 지역서점'의 목록을 서점 한 곳당 한 행으로 담으며, 시군명·서점명·전화번호·지번/도로명 주소·우편번호·WGS84 위경도가 들어 있다. 우리 동네에서 경기도 인증을 받은 오프라인 서점이 어디 있는지 찾는 주민이나, 시군별 인증 서점 분포를 보려는 지자체·출판 분석가가 쓴다. 전역 조인 키가 없어 시군명(SIGUN_NM)이나 주소·좌표를 기준으로 다른 행정·공간 데이터와 이름 매핑해 이어 쓴다.
description_portal: "「경기도 지역서점 인증제」에 따른 '경기도 인증 지역서점' 현황입니다.※ 본 데이터셋은 지역서점 인증을 받은 서점들의 목록을 제공합니다. 서점 업종은 신고제로 운영되기 때문에 경기도 내 모든 서점들의 목록을 제공하지는 않습니다.※ 경기도 지역서점 인증제란?: 경기도 관내 서점으로 실제로 일정규모의 방문용(오프라인) 매장을 운영하고 사업자등록증상 도·소매, 서적업으로 등록되어 있고, 도서판매를 주종으로 하는 서점에 대하여 경기도가 정한 심사규정을 충족하면 ‘경기도 지역서점’임을 인증하고 인증서를 교부하는 제도"
