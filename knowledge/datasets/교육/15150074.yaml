description_portal: 해당 데이터는 금산군 평생학습 프로그램 수강현황을 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 합성데이터는 원천데이터와 통계적으로 유사한 패턴을 가진 가상데이터로, 익명화와 통계적 변형 기법을 통해 개인정보를 철저히 보호합니다. 합성 모델(CTGAN, GMM)에 따라 각각 9,999건, 9,955건의 데이터가 수록되어 있습니다. 해당 합성데이터를 활용하여 프로그램별 요일·시간·장소 대비 신청 패턴을 분석해 인기 강좌·시간대를 식별하고, 차기 분기 편성·강의실 배정을 최적화할 수 있습니다. 또한 읍면·성별 분포에 따른 참여 편차를 파악해 대상자 맞춤 홍보·찾아가는 강좌 기획에 반영할 수 있습니다.
