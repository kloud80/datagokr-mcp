summary_user: NCS 기준 직업기초능력의 영역명과 그 아래 하위영역명을 일련번호와 함께 정리한 전국 단위 분류표로, 건별 원천이 아닌 1KB 남짓(1165바이트)의 작은 CSV 코드표다. 교육훈련기관이나 기업 인사담당자가 '의사소통능력 같은 직업기초능력은 어떤 하위영역으로 나뉘는가'를 확인하거나 평가 항목을 짤 때 쓴다. 전역 조인 키가 없어 다른 국가기술자격 데이터와는 직업기초능력명·하위영역명 같은 이름 매핑이나 같은 기관(한국산업인력공단)의 코드로만 이어 쓴다.
description_portal: '한국산업인력공단에서 제공하는 “국가기술자격시험 관련 직업기초능력 정보(직업기초능력 및 공통 하위역량 등)” 공공데이터는, 자격시험과 연계하여 직무 수행에 필수적인 기초능력 요소들을 체계적으로 정리한 자료입니다. 이 데이터에는 NCS (국가직무능력표준)에 따라 정의된 직업기초능력의 영역별 명칭, 하위능력 요소, 능력단위 분류번호, 능력 요소별 설명 등이 포함되어 있으며, 직업기초능력이 어떤 기준과 체계로 구성되어 있는지 파악할 수 있도록 상세화 되어 있습니다. 또한 이 정보는 자격시험 설계자, 교육훈련 기관, 응시자, 기업 인사담당자 등이 직업능력 개발 및 평가기준 활용을 위해 참고 가능하며, 데이터 제공 형식(예: CSV, JSON 등), 관리 주체 및 업데이트 주기, 라이선스 정보 등이 함께 포함되어 있어 공공정보로서의 접근성과 신뢰성을 확보하고 있습니다.'
