description_portal: 성남시내 전문 및 대학교 현황(종류,학교명,영문명,본분교,학교상태,설립일자,주소,전화번호,팩스번호,홈페이지 등)입니다. 성남시는 수도권 남부의 중심 도시로, 다양한 산업·교육 인프라와 인접해 있음에도 불구하고 시 내 전문대학 및 대학교의 입지 수는 상대적으로 적은 편이다. 현재 성남시에는 정식 캠퍼스를 둔 고등교육기관으로 을지대학교 성남캠퍼스(의료보건 특화), 한국폴리텍대학 성남캠퍼스(기술·직업교육 중심), 신구대학교(전문대학) 등이 대표적이며, 모두 산업연계형·실무중심형 특화 학과를 운영하고 있다.
