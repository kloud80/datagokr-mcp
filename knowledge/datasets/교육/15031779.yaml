summary_user: 성남시 안에 있는 전문대학·대학교를 학교 한 곳당 한 행으로 담은 목록 파일로, 학교종류·학교명(영문명 포함)·본분교·학교상태·설립일자·주소·전화·팩스·홈페이지를 담는다(파일 크기 약 2.7KB의 소규모 자료). 성남시에 어떤 대학이 어디에 있고 운영 중인지, 연락처와 홈페이지가 무엇인지 확인하려는 시민·수험생이나 대학가 상권·원룸 수요를 살피는 분석가가 기초 위치 목록으로 쓴다. 전역 조인 키는 없어서 대학알리미 등 대학 공시 자료와는 학교명으로 맞춰 잇고, 주소로 좌표를 붙여 지도·상권 자료와 겹쳐 쓴다.
limits: 재학생 수·교원·기숙사·등록금·재정 같은 공시 수치는 없어 수요·충원율 분석에는 별도 대학 공시 자료가 필요하다. 표준 학교 코드가 없어 다른 데이터와 붙일 때 학교명 표기 차이를 직접 맞춰야 하며, 범위는 성남시 한 곳뿐이다.
