summary_user: 중소벤처기업연수원이 운영하는 연수 과정을 대분류(17개)·중분류(입문·심화·품질·특화 등)·소분류(85개) 체계로 나누어 과정명, 도입 연도, 연수 대상과 함께 과정 단위로 담은 전국 단위 목록 파일이다. 중소기업 인사·교육 담당자가 '우리 회사 신입사원이나 초급관리자, PLC·사출 분야 직원에게 맞는 연수 과정이 무엇인가'를 찾거나, 분석가가 분야별 과정 구성과 도입 시기를 살펴볼 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 다른 데이터와는 과정명·분류명을 문자열로 맞춰 대조하는 방식으로만 이어 쓴다.
