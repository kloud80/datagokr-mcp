summary_user: 부산광역시 연제구에 있는 학교를 한 행에 한 학교씩 담은 명부 파일로, 학교급, 국공립 구분, 소재지, 교장실·교무실·행정실 전화번호와 팩스번호를 담는다. 연제구 주민이나 구청·지역 단체가 '우리 구에 어떤 학교가 있고 연락처는 무엇인가'를 확인하거나, 학교급식비·환경개선 같은 교육경비 지원 대상 학교를 추릴 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 소재지 주소를 맞춰 이어 붙여야 한다.
description_portal: '부산광역시 연제구에 위차한 학교 현황 데이터입니다.연제구 내 학교는 총 33개교이며, 학교별 소재지, 국공립 구분, 전화번호 등을 제공하고 있습니다.학교와 지역이 배움공동체로서 유기적으로 협력할 수있도록 학교 현황을 관리하고 있으며친환경 학교급식비, 학교 환경개선 등을 위한 학교 교육 지원, 초등 생존수영 교육비 등 교육기관에 대한 교육경비 지원을 위한 기초자료로 활용하고 있습니다.- 학교현황: 총 33개교(초등학교 16개교, 중학교 8개교, 고등학교 4개교, 특수학교 2개교, 대학교 3개교)- 상세내용: 국.공립 구분, 소재지, 전화번호(교장실, 교무실, 행정실, 팩스번호)'
