description_portal: 이 데이터는 2023년 3월 7일 기준으로 공공도서관이 보유한 전자책 자료의 목록을 정리한 자료입니다. 각 전자책의 국제표준도서번호(ISBN), 제목, 저자, 출판사, 보유 권수, 카테고리, 콘텐츠 유형(전자책 여부), 스마트폰 및 태블릿 기기 이용 가능 여부 등의 정보를 포함하고 있습니다. 본 자료는 공공도서관의 전자자료 운영 현황을 파악하고, 도서관의 디지털 자료 서비스 개선 및 이용자 접근성 향상 정책을 수립하는 데 활용할 수 있습니다. 또한 전자책의 주제별 분포와 출판사별 보유 현황 분석을 통해 지역별 독서문화 활성화, 전자도서 서비스 품질 향상, 그리고 디지털 콘텐츠 확충을 위한 근거자료로 활용 가치가 높은 공공데이터입니다.
