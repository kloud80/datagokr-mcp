summary_user: 충청남도교육청 소속 초·중·고등학교가 보유한 신재생에너지설비를 학교별로 정리한 파일(CSV, 약 29KB)로, 학교명·급별·주소·연락처와 설비 구분·설치시기·용량을 담는다. 충남 지역에서 어느 학교에 태양광 등 신재생에너지설비가 언제 얼마만큼 설치됐는지 확인하거나, 미설치 학교를 찾아 보급 계획을 세우려는 교육행정 담당자·에너지 분석가가 쓴다. 전역 조인 키(학교 표준코드 등)가 없어 학교알리미 공시나 학구도 같은 다른 학교 단위 데이터와는 학교명·주소를 맞춰 연결해야 한다.
description_portal: '"충청남도교육청_초중고등학교 신재생에너지설비 보유현황" 데이터는 충청남도교육청 소속 초·중·고등학교에서 보유한 신재생에너지설비의 현황을 상세히 담고 있습니다. 이 데이터에는 각 학교별로 설치된 태양광, 지열, 연료전지 등의 신재생에너지설비의 설치 위치, 용량, 설치 연도 등이 포함되어 있습니다. 데이터는 충청남도교육청 시설과에서 관리하며, 교육행정정보시스템(NEIS)과 각 학교의 보고 자료를 통해 수집됩니다. 이 정보는 연간 주기로 정기적으로 업데이트되어 최신 상태를 유지합니다. 해당 데이터는 신재생에너지설비의 보급 현황을 파악하고, 에너지 효율성 향상 및 환경 친화적인 교육 환경 조성을 위한 정책 수립에 활용됩니다. 또한, 연구기관이나 교육 관련 기업들이 에너지 관련 프로그램 개발 및 평가에 참고할 수 있는 기초 자료로 활용됩니다.'
