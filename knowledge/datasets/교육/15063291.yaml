description_portal: 이 데이터는 교육부 중앙교육연수원이 2017년부터 2026년 6월까지 연도별로 실시한 연수의 이수인원 현황을 수록한 자료입니다. 연수형태는 집합교육, 혼합교육, 원격교육으로 구분되며, 각 연수형태별 이수인원 수치를 제공합니다. 총 438개의 행으로 구성되어 있으며, 공무원 교육훈련법 시행령 및 지방공무원 교육훈련법에 따라 수집된 데이터입니다. 이 자료는 공무원 교육 정책 수립, 연수 프로그램 평가, 교육 수요 분석 등에 활용될 수 있습니다. 데이터는 연간 단위로 업데이트되며, XLSX 형식으로 제공됩니다. 공공저작물로서 출처 표시를 조건으로 비상업적 용도로 이용 가능하며, 상업적 이용이나 내용 변경은 금지되어 있습니다.
