description_portal: '"국가별 재외국민 반영기준환율(주요국 통화의 대원화 환율) 데이터입니다. 기준 환율은 매 학기별 신청 최초 시작월의 전월 마지막 영업일 매매기준율로, 한국은행 고시 기준이며 재단 누리집에서 확인 가능합니다.※ 원화환산은 신고항목별 총 신고금액 기준으로 환산 적용되며, 환산 시 원 단위 미만 금액은 자동으로 절사※ 자세한 사항은 한국장학재단 누리집 > 장학금 > 학자금 지원구간 > 한눈에 보는 학자금 지원구간 > 국외 소득재산 신고제 안내>적용환율>주요국 통화의 대원화 환율(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition04_09_06&type=scholar)을 참고 바랍니다.'
