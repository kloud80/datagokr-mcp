summary_user: 국가기술자격 CBT 시험의 시험장소별 좌석 정보를 시행계획번호·지사·시험장소·시험일·부 단위로, 좌석 하나당 한 행(내부좌석번호·좌석번호·좌석상태)으로 담은 전국 범위의 건별 파일(CSV 약 10.9MB)이다. 수험자가 '내가 볼 시험장에 어느 날, 몇 부에 좌석이 몇 개 있고 비어 있는지'를 확인하거나, 분석가가 지사·시험장별 CBT 좌석 규모와 운영 현황을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 기관의 시험 일정·종목 데이터와는 시행계획번호나 지사명·시험장소 이름을 맞춰 연결해야 한다.
