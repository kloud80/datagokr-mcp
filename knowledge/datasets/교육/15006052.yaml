description_portal: 방송, 신문 등에서 자주 등장하는 시사경제용어를 국민이 쉽게 이해할 수 있도록 정리한 정보입니다. 생소하거나 헷갈리기 쉬운 경제개념에 대한 용어 정의와 쉬운 설명을 제공하며, 학교, 자기주도학습, 특별활동 등 경제교육자료로도 활용이 가능합니다.  사용자가 키워드로 용어를 검색하거나 전체 용어집을 내려받아 내용을 확인할 수 있어 학습과 정보 검색의 효율성이 높습니다. 해당 데이터는 시사경제와 관련된 기본 개념을 정리하고 경제소양을 높이는 데 도움을 주며, 교육과 정책 홍보에도 기여합니다. 이 자료는  경제교육, 시사정리, 경제용어, 정책정보, 용어정리, 금융상식 , 뉴스해설, 생활경제 등 다양한 키워드로 구성되어 있으며 실생활과 밀접한 경제이해를 지원하고 있습니다. 아동기부터 노년기까지 생애주기 단계별 필요한 경제지식을 함양할  수 있는 기초적 자료입니다.
