summary_user: 서울 남부교육지원청 관내(구로구·금천구·영등포구) 유치원·초·중·고등학교의 설립 구분, 학교급, 학교명, 연락처, 주소를 학교 한 곳당 한 행으로 담은 목록 파일이며, 정보공시 학교 명단을 기준으로 한다. 학부모나 분석가가 "영등포구에 있는 공립 초등학교와 연락처는 어디인가" 같은 질문에 답할 때나, 관내 학교 분포를 주소 단위로 파악할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어서, 교원·학생 통계나 다른 학교 정보와는 학교명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 학교코드가 없어 다른 데이터와 붙일 때는 학교명·주소 매핑에 의존해야 하며, 동명 학교나 표기 차이로 매칭 오류가 날 수 있다. 범위는 남부교육지원청 관할 3개 구로 한정되고, 폐교된 유치원은 빠져 있다.
