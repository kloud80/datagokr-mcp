summary_user: 경기도 내 초·중·고등학교와 특수학교별로 주 출입구 접근로, 장애인 전용 주차구역, 점자블록, 경보·피난설비, 복도, 계단·승강기, 장애인 화장실 등 편의시설의 설치 여부를 항목별로 담은 학교 단위 현황 자료이며, 기준연도·시군·지역교육청·학교급·설립구분이 함께 붙는다. 학부모나 교육청 담당자가 우리 지역 학교 중 승강기나 장애인 화장실이 없는 곳이 어디인지 확인하거나, 시설 개선 우선순위를 정할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다른 학교 데이터와는 학교명·시군명 같은 이름 매핑이나 같은 기관(경기도)의 코드로만 연결한다.
description_portal: 이 데이터는 경기도 내 초·중·고등학교 및 특수학교의 장애인 편의시설 설치 현황을 보여주는 자료로, 학교별로 주 출입구 접근로, 장애인 전용 주차구역, 점자블록, 경보 및 피난설비, 출입구, 복도, 계단 및 승강기 등 주요 이동 및 안전 관련 시설의 설치 여부를 항목별로 제공합니다. 각 항목은 학교명, 지역명, 지역교육청명, 학교급, 설립 구분 등 행정 구분 정보와 함께 제시되며, 각 항목은 ‘설치여부’로 구분되어 있습니다. 이 데이터는 학교 내 장애인의 이동권, 접근성, 안전 확보 여부를 진단하는 기초 자료로 활용되며, 교육현장의 장애인 편의 증진을 위한 정책 수립, 시설 개선 사업의 타당성 분석, 공간 환경 개선 시 우선순위 설정 등에 유용합니다.
