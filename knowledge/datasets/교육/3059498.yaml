description_portal: '‘한국학중앙연구원_한국민족문화대백과사전 멀티미디어 콘텐츠 메타데이터’는  한국민족문화대백과사전에 수록된 다양한 멀티미디어 자료의 제목, 설명, 키워드 정보를 포함한 메타데이터입니다.이 데이터는 인물, 사물, 유적, 자연물 등 백과사전에 수록된 콘텐츠에 대한 시청각 자료(예: 사진, 그림, 도면 등)의 콘텐츠 명칭(제목)과 함께, 간략한 설명, 주제별 키워드 항목으로 구성되어 있습니다.해당 데이터는 특히 검색 기능 강화, 콘텐츠 큐레이션, 키워드 분석 기반의 주제별 콘텐츠 분류 작업에 유용하며, 문화유산 디지털화 및 시청각 자원의 효율적인 관리에 기여하는 핵심 공공데이터입니다.'
