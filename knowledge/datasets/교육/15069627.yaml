summary_user: 국가자격 CBT 시험의 종목별 과목 구성을 과목 한 줄 단위로 담은 전국 범위 파일(csv, 약 69KB)로, 과목명·출제 순서·교시번호·문항 수·수험시간을 기록한다. 수험자가 '내가 응시하는 종목은 몇 과목을 몇 문항씩, 몇 분 동안 치르나'를 확인하거나, 분석가가 종목 간 시험 분량과 시간 배분을 비교하는 데 쓴다. 전역 조인 키가 없어 국가자격 시험 일정·합격률 같은 다른 데이터와는 종목명(종목명)을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 정보는 국가자격 CBT(Computer Based Test) 시험에 포함된 각 자격 종목별 과목 구성에 대한 상세한 내용을 제공합니다. 각 종목에 해당하는 과목들의 명칭, 과목이 출제되는 순서, 과목별 문항 수, 시험 시간 등의 세부 정보를 포함하고 있으며, 이는 시험 출제 및 운영에 있어 중요한 기준 자료로 활용됩니다. 수험자는 이 정보를 통해 자신의 응시 종목에 어떤 과목이 포함되어 있는지, 각 과목이 어떤 순서로 진행되는지, 각 과목마다 몇 개의 문항이 출제되며 얼마나 시간이 주어지는지를 명확히 이해할 수 있습니다. 또한, 시험 관리자는 종목별 시험 세팅, 시스템 구성, 문제지 출제 및 검수, 시간 배분 설정 등 다양한 운영 업무에 이 정보를 기반으로 활용할 수 있습니다. 해당 정보는 CBT 시험의 정확한 실행을 위한 핵심 요소로, 시험의 공정성과 체계성을 확보하는 데 기여합니다.
