summary_user: 경기도 내 시각장애인용 점자도서관을 기관 한 곳당 한 행으로 담은 목록으로, 시군·기관명·도로명/지번 주소·우편번호·전화·홈페이지·설치신고일·운영 법인명·위경도 좌표를 포함한다. 복지 담당자나 연구자가 '우리 시군에 점자도서관이 있는지, 어느 법인이 언제부터 운영하는지'를 확인하거나 지도 위에 분포를 그릴 때 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)·시군명이나 기관명·주소 매칭으로 다른 경기도 시군 단위 자료와 붙이고, 위경도로 공간 결합한다.
description_portal: 점자도서관 현황 데이터는 경기도 내 시각장애인을 위한 점자도서관 정보를 제공하며, 시군명, 기관명, 주소(도로명·지번), 우편번호, 전화번호, 홈페이지 URL, 설치신고일, 법인명, WGS84 좌표(위도·경도) 등의 항목으로 구성되어 있습니다. 본 데이터는 지역별 점자도서관 분포와 설치 현황을 파악하는 데 활용되며, 도서관별 법인 운영 주체와 설립 연혁 등을 비교·분석할 수 있습니다. 또한 위치 좌표가 제공되어 GIS 기반 시각화 분석이 가능하며, 시각장애인의 정보 접근성과 복지 인프라 수준을 평가하는 데 기초 자료로 쓰일 수 있습니다. 이 데이터는 장애인 복지정책 수립, 정보격차 해소 전략 마련, 지역별 특화 복지 서비스 연구 등 다양한 분야에 활용될 수 있습니다.
