summary_user: 경기도 25개 교육지원청 소관 중학교·고등학교를 학교 한 곳당 한 행으로 담은 명부 파일로, 학교명·학교급·지역과 평준화 지역 고등학교의 학군·구역 정보를 담는다. 학부모·학생이 '우리 동네 중학교를 졸업하면 어느 평준화학군·구역의 고등학교에 배정되는가'를 확인하거나, 분석가가 시군별 평준화학군 구성을 파악하는 데 쓴다. 전역 조인 키(학교 코드 등)가 없어 다른 학교 데이터와는 학교명·지역 이름 매칭으로만 이어 쓴다.
limits: 학교 고유 코드가 없어 다른 데이터와 붙일 때 학교명 동명이교나 표기 차이로 매칭 오류가 날 수 있다. 평준화학군이 아닌 학교는 학군·구역 값이 비어 있으며, 범위는 경기도 시도 단위에 한정된다.
