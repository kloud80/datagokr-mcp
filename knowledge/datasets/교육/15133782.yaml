description_portal: 경기도 내 25개 교육지원청 소관의 중학교와 고등학교에 대한 기본 정보를 담고 있습니다. 이 데이터는 고등학교 입학전학 포털사이트 운영을 위한 핵심 자료로 활용되며, 각 학교의 명칭, 소속 교육지원청, 그리고 평준화학군에 해당하는 고등학교의 경우 학군 및 구역 정보까지 포함하고 있습니다. 평준화학군이 아닌 학교는 학교명과 소속 교육지원청 정보만 제공됩니다. 활용 분야로는 학교 배정, 학군 분석, 교육정책 수립, 연구, 학부모 및 학생의 진학 정보 제공, 민간 서비스 개발 등 매우 다양합니다. 교육 관련 행정기관, 연구기관 등에서 학교 현황 파악에 활용 될 수 있습니다.
