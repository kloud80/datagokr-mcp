summary_user: 경기도 내 초·중·고 및 기타 학교의 학교별 학년별(1~6학년) 학생 수, 특수학급·순회학급 학생 수, 전체 합계를 기준연도(STD_YY) 단위로 담은 학교 단위 현황 자료이며, 범위는 경기도 한 시도입니다. 교육 분석가나 지자체 담당자가 "우리 시군의 학교별 학년 학생 수가 어떻게 분포하고, 학급·교사 배치를 어디에 늘려야 하나" 같은 질문에 쓴다. 실측 컬럼에 전역 학교코드 같은 공통 조인 키가 없어, 다른 교원·학급·재정 통계와는 학교명·시군명 매칭이나 시군코드(SIGUN_CD) 같은 같은 기관 코드로만 이어 쓴다.
description_portal: 본 데이터는 경기도 내 초등학교, 중학교, 고등학교 및 기타 학교의 학년별 학생 수 현황을 제공하는 자료입니다. 데이터는 각 학교별로 1학년부터 6학년까지의 학년별 학생 수, 특수학급과 순회학급에 재학 중인 학생 수, 그리고 전체 학생 수의 총합(합계사항)을 포함하고 있으며, 괄호 안 수치는 특수학급과 순회학급 학생 수를 의미합니다. 학교명, 시군명, 지역교육청명, 설립구분명, 주야간구분, 학교급명 등의 기본 항목을 포함하고 있어, 학급 배정, 교사 배치, 학령인구 분석, 교육 정책 수립에 필요한 기초자료로 활용됩니다. 데이터는 학교알리미 시스템을 기반으로 하며, 경기도 AI데이터행정과에서 연 1회 갱신하여 제공되며, Open API를 통해 다양한 행정·연구 시스템에 연계할 수 있습니다.
