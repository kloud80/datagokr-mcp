summary_user: 경기도 시군별로 지정된 아토피·천식 안심학교의 명칭과 재학 학생 수를 학교 한 곳당 한 행으로 담으며, 유치원·초등학교·어린이집 등이 함께 들어 있다. 학부모가 우리 시군에 알레르기질환 관리 학교가 어디 있는지 찾거나, 정책 담당자가 시군별 안심학교 지정 수와 대상 학생 규모를 비교하는 데 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교 기본정보·학생 통계와는 학교명 매칭으로 잇고, 시군명·시군코드(SIGUN_CD)로 경기도 시군 단위 통계와 묶는다.
description_portal: '경기도 내 아토피천식 안심학교 지정현황입니다. 아토피천식 안심학교는 아토피피부염, 천식, 알레르기비염 등 알레르기질환이 있는 학생이 학교에서 건강하게 생활하고 학습할 수 있도록 지원하는 학교 중심의 예방관리 프로그램을 운영하는 학교입니다.데이터는 아토피 및 천식으로부터 학생의 건강을 보호하고자 지정된 ‘아토피·천식 안심학교’의 현황을 수록하고 있습니다. 데이터는 각 시군별로 지정된 안심학교의 명칭과 해당 학교에 재학 중인 학생 수로 구성되어 있으며, 유치원, 초등학교, 어린이집 등 다양한 교육기관이 포함되어 있습니다. 주요 항목으로는 시군명, 안심학교명, 학생수가 있으며, 이를 통해 지역별 보건복지 정책의 적용 범위, 아동 대상 건강지원 프로그램의 확산 정도 등을 확인할 수 있습니다. 해당 데이터는 아동 건강관리에 초점을 맞춘 공공정책 수립, 안심학교 확대 정책 검토, 민감 질환 대응 인프라 분석 등의 활용에 적합합니다.안심학교 : 환경부 및 지자체가 지정한 학교로, 아토피·천식 등 알레르기 질환을 예방하고 응급상황 대응 체계를 갖춘 기관아토피 : 만성적인 염증성 피부질환으로, 알레르기 체질을 가진 아동에게 흔히 발병천식 : 기관지 염증로 인해 호흡이 어려워지는 질환으로, 미세먼지나 특정 환경에 민감한 아동에게 자주 발생함'
