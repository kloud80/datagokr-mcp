description_portal: 전라남도 나주시 내 유치원 목록에 대한 데이터입니다. 유치원은 단설, 공립, 사립유치원의 형태로 운영되고 있습니다. 데이터는 유치원 명칭과 유치원 주소와 유치원 관련 전화번호에 대한 데이터가 포함되어 있습니다. 나주시 단설유치원은 나주이화, 한아름, 빛누리, 라온, 다야, 도담, 빛그린유치원 등 6곳이 있으며, 사립유치원은 까리따스성모, 동산, 한빛유치원 3곳이 있습니다. 공립유치원은 나주북초등학교병설유치원을 포함하여 총  18곳이며, 이중 반남초등학교병설유치원의 경우 휴원 중입니다.
