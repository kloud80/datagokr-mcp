summary_user: 군복무 기간 중 학자금대출 이자를 면제받은 고객의 대출금액·대출잔액·이자면제금액을 기준년월, 대출년도·학기, 대출상품(일반 상환·취업 후 상환 등), 대학별로 묶은 집계 파일로, 전국 대학을 대상으로 한다. 대학·지역별로 군복무 이자면제 지원액이 얼마나 되는지, 어느 대출상품에 면제가 몰리는지를 보려는 분석가나 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 대학 데이터와는 대학명이나 설립구분·학교형태·소재지 같은 이름 값을 맞춰서만 이어 쓴다.
description_portal: '학자금대출 실행년도(학기)별, 상품(일반 상환 학자금대출, 취업 후 상환 학자금대출 등)별, 대학별 군복무 이자면제를 받은 고객의 학자금대출내역(대출금액, 대출잔액) 및 이자면제금액을 제공합니다. 상세 정보는 한국장학재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pf=tuition05_05)를 참고바랍니다.군복무 이자면제 사업은 군 복무기간 중 발생한 학자금대출 이자를 면제하여 학자금대출 상환부담을 경감하고, 국방의 의무를 성실히 수행할 수 있도록 지원하는 사업입니다.※ 이자면제금액: 학자금대출 실행일부터 기준년월 군복무 기간 동안 고객이 지원받은 총 이자면제 금액※ 단위: 대출금액(원), 이자면제금액(원), 대출잔액(원)※ 대출학기 3학기: 특정 학교의 3학기제'
