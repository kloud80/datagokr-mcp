description_portal: 이 문서는 역사 관련 사이트 메타데이터 기반 통합 검색을 목적으로 하며, 한국역사정보통합시스템이 제공하는 한국 역사 연구 자료의 메타데이터 정보를 다룹니다. 연구자료, 역사정보 메타데이터, 역사정보 연계 키워드와 함께 통합 검색과 한국 역사에 관한 내용이 포함되어 있습니다. 또한 과거 등록된 연구자료 메타데이터 3건의 주기성 데이터가 함께 소개되어 지속적인 데이터 업데이트와 관리를 확인할 수 있습니다.역사관련 사이트 한국역사정보통합시스템이 제공 중인  역사 자료 메타데이터 중 한국 역사 연구 자료
