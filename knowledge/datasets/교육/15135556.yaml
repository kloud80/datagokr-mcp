summary_user: 사립대학 학교법인의 수익사업회계 결산 손익계산서를 학교·법인별 한 행으로 담은 집계 파일로, 매출액·수익용기본재산수입·기부금수익·유가증권 처분이익 등 수익 항목과 인건비·감가상각비·법인일반회계전출금 등 비용 항목을 천원 단위로 전국 범위에서 제공한다. 분석가나 정책 담당자가 '어느 사립대 법인이 수익용 기본재산에서 얼마를 벌어 학교 쪽(법인일반회계)으로 얼마를 넘기는가'를 학종·지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 학교명·법인명 이름 매칭으로만 대학알리미·대학재정알리미의 다른 재정·공시 자료와 잇는다.
description_portal: '한국사학진흥재단_사립대학 법인수익회계 손익계산서은 한국사학진흥재단의 회계연도별 사립학교 예결산 집계를 통해 산출된 자료입니다.사립대학 법인수익회계 손익계산서를 통해 사립대학 법인수익회계 결산내용 중 수익용 기본재산 수입, 유가증권및투자유가증권 처분이익 등의 세부내역을 법인별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
