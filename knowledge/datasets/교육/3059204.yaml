description_portal: 한국사능력검정시험은 연도별, 회차별, 급수별로 응시자수, 합격자수, 합격률을 체계적으로 기록하여 제공하는 시험입니다. 자료에서는 고급, 중급, 초급 급수뿐만 아니라 심화와 기본 급수에 대한 정보도 포함되어 있으며, 합격률은 급수와 회차에 따라 다르게 나타납니다. 예를 들어, 고급 급수의 경우 합격률이 39에서 74 사이로 변동하며 초급은 64에서 83 사이를 기록하는 등 급수별 합격률 차이가 있습니다. 이 정보는 한국사능력검정시험의 변천과 난이도, 응시자 경향을 파악하는 데 유용하며, 시험 준비 및 분석에 중요한 참고자료로 활용됩니다.
