description_portal: 울산광역시 북구 정보화교육 현황입니다.포함된 정보는 구분(난이도), 프로그램명, 대상 및 인원, 접수기간, 교육기간, 교육장소입니다.해당 데이터를 활용하여 행정 및 공공기관에서는 지역의 디지털 격차해소 정책 수립에 참고하실 수 있으며, 민간에서는 관련한 사회공헌 프로그램, IT교육 사업 전략 구축 등에 활용하실 수 있습니다.교육을 이수하실 분들께서는 교육의 전체적인 계획을 참고하시어 본인의 수준에 적합한 교육을 선택하는데 활용하실 수도 있습니다.추가적으로 더 필요하신 내용은 교육청소년과(정보화교육 담당), 미디어정보과(공공데이터 담당)에 문의하시기 바랍니다.
