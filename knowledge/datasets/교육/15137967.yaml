description_portal: '한국산업인력공단에서 제공하는 “국가기술자격시험 관련 지사자격조회집계 정보(기관지사, 자격조회집계 등)”는 전국의 한국산업인력공단 각 본부 및 지사의 업무내역 가운데, 자격조회(응시 자격 및 자격취득 관련 데이터)의 집계 현황을 기관 및 지사별로 정리한 공공데이터입니다. 이 데이터에는 각 지사의 자격조회 건수 및 조회 대상 자격종목, 조회 시점 및 기간, 지사별·기관별 조회 빈도 및 비교, 조회 요청자 유형(일반인, 기업, 기관 등)의 비율, 조회 사유 및 처리 상태, 지사 코드 및 지사명, 기관 본부 소속 여부, 데이터 제공 형식(예: CSV, JSON) 및 메타정보, 업데이트 주기, 관리 부서, 이용 조건 등이 포함되어 있어, 정책 수립자, 응시자, 연구자 및 관련 기관들이 지사별 자격조회 수요 및 행정처리 현황을 파악하고 행정서비스 개선 및 자원 배분의 효율화를 도모할 수 있는 자료입니다.'
