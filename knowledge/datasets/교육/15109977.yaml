description_portal: 4대 폭력 예방교육 수료 현황은 한국남부발전 임직원들의 4대 폭력(성희롱, 성매매, 성폭력, 가정폭력) 예방교육 수료 현황을 연도별로 정리한 자료입니다. 각 연도별로 네 가지 교육 항목의 수료 인원과 교육 방법(온라인 또는 온라인+오프라인 병행)이 함께 제공되어 교육의 참여도와 실행 형태를 명확히 파악할 수 있습니다. 이를 통해 공공기관이 조직 내 인권 의식 제고와 건전한 직장문화 조성을 위해 얼마나 체계적이고 전사적인 노력을 기울이고 있는지 알 수 있습니다. 국민 누구나 공공기관의 인권 보호와 예방 중심의 교육 제도를 어떻게 운영하고 있는지 투명하게 확인할 수 있으며, 공공부문 인권경영 정책의 실제 이행 사례로 활용할 수 있습니다. 해당 데이터는 인권교육 연구, 공공기관 평가, 윤리경영 모니터링 등 다양한 목적에 적합하며, 남녀노소 모두가 기관의 책임 있는 경영 실천을 쉽게 이해할 수 있는 공공자료입니다. 시계열 분석 및 참여도 추이 시각화를 통해 교육 강화 효과를 더 명확히 전달할 수 있습니다.
