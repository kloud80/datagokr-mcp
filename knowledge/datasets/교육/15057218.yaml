summary_user: 대학과 전문대학의 기회균형선발 결과를 기준년도·학교별로 집계한 데이터로, 학교종류·설립구분과 함께 총 입학생 수, 기회균형선발 학생 수와 비율을 담는다. 교육정책 분석가가 특정 연도에 어느 대학이 사회적 배려 대상자를 얼마나, 어떤 비율로 선발했는지 비교할 때 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어서, 학교 기본정보나 교원·학생 통계와는 학교명(SCHOOL_NM)과 연도를 이름 매핑해 붙여야 한다.
description_portal: 이 데이터는 대학 및 전문대학에서 운영되는 기회균형선발제도를 통해 입학한 학생들의 현황을 기록한 자료로, 교육격차 해소와 사회적 배려 대상자의 고등교육 기회를 분석하는 데 활용됩니다. 주요 항목에는 기준년도, 학교종류명, 설립구분, 학교명, 총 입학생 수, 기회균형선발 학생 수, 기회균형선발 학생 비율(%)이 포함됩니다. 이를 통해 대학별 기회균형선발 참여 규모와 비율을 비교할 수 있으며, 특정 연도의 사회통합전형 운영 성과를 파악할 수 있습니다. 이 데이터는 교육 취약계층 지원 정책 평가, 대학별 선발 구조 분석, 사회적 형평성 제고 방안 마련, 기회균형선발제 확대 필요성 검토 등 교육정책 연구와 행정 관리에 중요한 기초자료로 활용될 수 있습니다.
