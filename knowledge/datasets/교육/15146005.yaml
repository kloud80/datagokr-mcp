description_portal: '금천구 관내 학교 기본정보를 데이터로 공개하고 있습니다.이 자료에는 학교 종류, 설립 구분(공립/사립), 학교명(한글/영문), 주소, 관할 교육청, 전화번호, 홈페이지, 팩스번호, 남녀공학 구분(남녀공학, 남학교, 여학교), 고등학교 일반계·실업계 구분, 설립일자, 학과 등의 정보가 담겨 있습니다.이 데이터를 통해 관내 학교의 기본적인 설립 정보와 학과·교육 체계를 확인하고, 이를 바탕으로 자녀가 진학할 학교를 비교·검토하실 수 있으며, 필요하다면 데이터에 기재된 연락처 및 홈페이지를 통해 학교에 연락하실 수 있습니다. 아울러 관련 기관에서는 교육 정책 연구, 교육 관련 자료 분석에도 활용하실 수 있습니다.(데이터 담당기관 : 한국교육학술정보원)'
