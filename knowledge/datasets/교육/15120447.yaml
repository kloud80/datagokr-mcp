summary_user: 중앙정부와 지방자치단체(교육청 포함)가 대학에 지원하는 고등교육재정지원 사업을 부문·정책사업·단위사업·세부사업·내역사업 단위로 나누고 사업별 지원대상 기관을 정리한 전국 범위의 엑셀 파일로, 첫 행 제목상 2024년 기준 자료다. 연구자나 정책 분석가가 특정 대학이 어떤 정부 재정지원 사업의 대상인지, 사업별로 어느 대학이 참여하는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대학 공시·학자금 등 다른 자료와는 대학명이나 사업명을 매핑해 연결해야 한다.
description_portal: 이 데이터는 중앙 정부와 지방자치단체(교육청 포함)에서 대학에 지원하는 각종 사업 현황을 정리한 자료입니다. 데이터에는 각 사업의 부문, 정책사업명, 단위사업명, 세부사업명, 내역사업명과 함께 지원대상 기관 정보가 포함되어 있습니다. 이를 통해 대학이 어떤 사업에 지원을 받을 수 있는지, 사업의 구체적인 구성과 범위를 한눈에 확인할 수 있습니다. 공공기관이나 연구자가 교육 정책 분석, 재정 지원 현황 파악, 사업별 참여 대학 분석 등 다양한 목적에 활용할 수 있습니다. 제공된 데이터는 민간 분석, 시각화, 정책 개선 연구 등에도 활용 가능하며, 공공데이터 형태로 개방되어 접근성과 활용성을 높였습니다.
