summary_user: 청소년상담사 등 국가자격 시험에서 경력 증빙 기관으로 인정된 기관의 목록을 기관 단위로 담으며, 기관명(compnm)과 인정기관 구분 코드·코드명을 함께 제공하는 전국 범위의 비공간 데이터다. 국가자격 응시자가 자신의 근무 기관이 응시 자격 경력으로 인정되는지 확인하거나, 분석가가 자격별 경력 인정 기관 구성을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명 매핑이나 인정기관코드(rcoginsticd) 같은 기관 내부 코드로만 연결하며, 채용·창업 요건이나 면허제한 업종 같은 국가자격 관련 데이터와 이어 보는 보조 자료로 쓴다.
description_portal: “국가자격 경력정보 제공기관 현황” API는 한국산업인력공단이 제공하는 REST 기반 공공데이터 서비스로, 청소년상담사 등 국가자격 시험에서 경력 증빙 기관으로 인정된 기관의 목록을 XML 형식으로 제공합니다. 요청 시 ServiceKey(공공데이터포털 발급), pageNo, numOfRows 등의 파라미터를 통해 페이지 단위로 결과를 조회할 수 있으며, 반환 항목에는 기관명(compnm), 인정기관코드(rcoginsticd), 코드명(rcoginstinm), 페이지 정보(numOfRows, pageNo, totalCount)가 포함됩니다
