description_portal: 농식품공무원교육원에서는  농식품, 자기계발, 장편소설, 단편소설, 에세이, 동화, 미스터리, 전기, 시, 애니메이션, 논픽션, 각본,  웹툰, 전집 등 다양한 분야의 12,140권의 도서를  소장하고 있는 도서사랑방을 운영하여 농식품공무원교육원에 입교한 교육생을 대상으로 도서를 대여하고 있습니다. 농식품공무원교육원 도서사랑방에서  제공하고 있는 정보는  연번, 도서명, 저자명, 출판사, 출판년도입니다.   농식품공무원교육원 도서사랑방에 소장하고 있는 도서유형은 총류, 철학, 종교, 사회과학, 기술과학, 예술, 언어, 문학, 역사 입니다.
