summary_user: 대전광역시 내 중학교·고등학교를 학교 한 곳당 한 행으로 담은 학교 기본정보로, API 전체 150건이며 자치구(signgu), 설립 구분, 학교명, 소재지와 학급 수·학생 수 등 현황 수치를 포함한다. 학부모나 분석가가 대전 어느 구에 중고등학교가 몇 곳 있고 학교별 학급·학생 규모가 어떤지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키(표준 학교코드 등)가 없어서, 다른 교원·학생 통계나 재정 데이터와는 학교명·주소 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 대전광역시 범위의 150개 학교만 담아 다른 시도와 바로 비교할 수 없다. 공통 학교코드가 없어 다른 데이터와 붙일 때 학교명 표기 차이로 매칭이 어긋날 수 있다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
