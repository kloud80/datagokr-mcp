description_portal: 서울특별시 영등포구 관내 지역아동센터 현황에 대한 파일입니다.지역아동센터는 18세 미만 아동에게 방과후 돌봄을 제공하는 아동복지시설입니다. 19개 시설별 행정동, 시설명, 소재지 주소, 운영주체, 시설장, 전화번호, 정원과 면적을 확인할 수 있습니다. 지역아동센터에서 방과 후 돌봄이 필요한 경우, 시설 목록에서 이용을 원하는 센터를 선택하여 입소 가능 및 대기 여부를 확인하고 돌봄신청서와 증빙서류를 제출하면, 구청에서 돌봄 결정내역을 보호자와 지역아동센터에 통보합니다. 저소득, 한부모, 다문화, 장애인, 다자녀 가정 등 더 돌봄이 필요하다고 인정되는 경우 우선적으로 돌봄을 받을 수 있습니다.
