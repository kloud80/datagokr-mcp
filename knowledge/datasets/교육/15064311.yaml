description_portal: 삼일운동데이터베이스는 삼일운동 관련 조선 소요사건, 일본 외무성 기록, 판결문, 재한 선교사 자료 등 다양한 자료를 종합하여 지역별, 유형별 정보를 제공한다. 3월 중순부터 진행된 전국 각지의 시위운동 상황을 기록하였으며, 특히 간도 지역에서 조선인과 일본 헌병 간의 충돌, 군중 집회와 시위가 빈번했다. 헌병 및 군대의 파견으로 시위를 진압하는 모습, 그리고 독립운동가들의 조직적 활동이 포착된다. 또한, 간도의 일본인 자위대 조직과 외교적 갈등 우려도 함께 나타난다. 이 자료는 한국역사와 독립운동 연구에 중요한 기초 사료를 제공한다.
