summary_user: 경기도 내 초·중·고등학교별로 기준년도마다 창의적체험활동 동아리와 학생자율동아리의 동아리 수, 참여 학생 수, 지도교사·외부강사 수, 활동 예산지원금을 담은 학교 단위 현황 자료다. 교육청 담당자나 연구자가 "시군·지역교육청별로 학교당 동아리 참여 학생과 예산 지원에 격차가 있는가"를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)나 학교명·시군코드를 매핑해 학교 기본정보·교원·학생 통계 등 학교 키로 붙는 자료와 연결해야 한다.
description_portal: 이 데이터는 경기도 내 초·중·고등학교의 동아리 활동 현황을 정리한 자료로, 학생들의 창의적체험활동과 자율동아리 운영 실태를 보여줍니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분(공립·사립), 창의적체험활동 동아리 수 및 참여 학생 수, 지도교사 수, 외부강사 수, 활동 예산지원금, 학생자율동아리 운영 규모 등이 포함됩니다. 이를 통해 학교급별, 지역별 동아리 활동의 참여도와 지원 현황을 비교할 수 있으며, 교육 예산이 동아리 활동에 어떻게 배분되는지도 파악할 수 있습니다. 본 데이터는 학생의 자율적 활동 참여 실태 분석, 교육과정 외 활동 지원 정책 수립, 학교별 비교 연구, 지역 간 활동 격차 분석 등 다양한 교육 정책 및 연구 목적으로 활용될 수 있습니다.
