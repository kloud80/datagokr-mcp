summary_user: 기준년월 시점의 학자금대출을 대출년도·학기, 상품(일반 상환·취업 후 상환 등), 실거주지 시도별로 묶어 대출잔액·등록금 연체잔액·생활비 연체잔액·대출금리를 담은 전국 범위 파일(CSV 약 124KB)이다. 연구자나 정책 담당자가 '어느 시도에서 취업 후 상환 학자금대출의 연체잔액이 많은가'처럼 지역·상품별 학자금 부채와 연체 수준을 비교하는 데 쓴다. 전역 조인 키는 없어 시도명을 이름으로 맞춰 지역별 인구·소득 등 다른 시도 통계와 잇는다.
description_portal: '기준 시점 학자금대출 실행년도(학기)별, 상품(일반 상환 학자금대출, 취업 후 상환 학자금대출 등)별, 시도별 연체 1개월 미만인 정상계좌와 연체 1개월 ~ 연체 6개월 미만인 계좌의 학자금대출 내역(대출금액, 대출금리, 대출잔액, 연체잔액 등) 관련 내용을 제공합니다.※ 단위: 대출금액(원), 대출잔액(원), 등록금잔액(원), 생활비용잔액(원), 대출금리(%)※ 대출학기 3학기: 특정 학교의 3학기제※ 주소 빈 값: 실 거주지 주소의 값이 없는 경우※ 생활비용 잔액(연체 잔액)의 0 또는 빈 값: 생활비용 잔액이 없을 때, 등록금 잔액(연체 잔액)이 있으면 0이고 등록금 잔액(연체 잔액)이 없으면 빈 값※ 상세 정보는 한국장학재단 홈페이지(https://www.kosaf.go.kr/ko/tuition.do?pg=tuition_main)를 참고바랍니다.'
