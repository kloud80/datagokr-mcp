description_portal: 이 데이터는 전국 시·도 교육청 및 교육연구원 웹사이트 현황을 정리한 목록입니다. 각 항목은 사이트 ID, URL, 기관명, 마지막 업데이트 일시로 구성되어 있으며, 인천광역시교육청 AI융합교육원, 경기도교육청 미래과학교육원, 경상남도교육청 교육정보원, 광주광역시교육청, 울산광역시교육연구정보원 등 주요 기관들이 포함되어 있습니다. 또한 서울특별시교육청교육연구정보원, 제주특별자치도교육청, 충청남도·충청북도교육청, 전라남도·전북특별자치도교육청 등 전국 각 지역의 교육청과 연구기관이 고르게 나타나 있어 교육 행정기관의 디지털 플랫폼 운영 현황을 한눈에 확인할 수 있습니다. 마지막 업데이트 일시는 2025로 기록되어 있어, 각 기관의 최신 정보 반영 시점을 비교·분석할 수 있습니다. 이 데이터는 교육청 웹사이트 관리, 정보화 현황, 행정 투명성, 기관별 디지털 접근성을 연구하는 데 중요한 기초 자료로 활용될 수 있습니다.
