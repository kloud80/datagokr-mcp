summary_user: 서울 성동구·광진구에 있는 학원과 교습소를 한 곳당 한 행으로 담은 목록 파일로, 학원·교습소 구분과 명칭, 분야(입시·보습, 예능, 국제화, 독서실 등), 위치, 유선 전화번호를 담는다. 학부모나 학원 창업 예정자가 성동·광진 지역에서 특정 분야 학원이 어디에 얼마나 몰려 있는지를 확인하는 데 쓰고, 학원가 밀집도를 상권이나 주택 수요의 신호로 보는 분석에도 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 교육지원청의 학원 목록이나 주소 기반 데이터와는 학원명·위치 같은 이름 매칭으로만 이어 쓴다.
limits: 학원 고유번호나 행정구역 코드 같은 공통 키가 없어서 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 범위는 성동광진교육지원청 관내로 한정되므로 서울 전체를 보려면 다른 교육지원청 파일을 합쳐야 한다.
