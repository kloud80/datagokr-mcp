summary_user: 올림픽공원 안 평생교육원의 교육 강좌(통기타·드럼·색소폰·탭댄스 등)를 강좌 한 건 단위로 담으며, 강좌명·교육내용·교육기간·담당 등 항목(title, description, temporalCoverage 등)으로 제공한다. 시민이 올림픽공원에서 어떤 악기·댄스 강좌가 어느 난이도와 일정으로 열리는지 찾거나, 분석가가 공공 평생교육 강좌 구성을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 강좌명·기관명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 올림픽공원내에 위치하고있는 평생교육원 교육 강좌에 관한 정보데이터를 제공합니다.(강좌명, 교육일정, 교육내용 , 교육시간 등)2025년 6월 기준 63건 데이터가 제공중입니다.통키타, 드럼, 색소폰, 하모니카, 칼림바, 탭댄스, 훌라댄스 등 교육 강좌가 있으며, 초급 중급 고급 등 난이도 별로 강좌가 개설되어있습니다.음악실 예약도 가능하도록 되어있습니다.현재는 평생교육원에서는 음악연습실만 제공하고 있으며, 강습관련 등자세한 정보는 평생교육원 음악연습실로 연락을 주시기 바랍니다.
