description_portal: '이 데이터는 경기도 양평군 교육경비지원 사업의 예산 현황을 제공하는 자료로 “사업명”, “예산액”,“기준년도”의 정보를 포함하고 있습니다.양평군 교육경비지원사업은 관내  유·초·중·고·특수학교 69개교를 대상으로 각급 학교의 교육에 필요한 경비의 일부를 보조하는 사업이며 교육과정 연계, 교육환경 개선을 위한 다양한 지원사업을 추진하고 있습니다. - 양평군 교육경비지원사업: 총13개 사업 / 3,978,127천원(본예산 기준) - 관계법령: 양평군 교육경비 보조에 관한 조례     제1조(목적) 이 조례는 「지방교육재정교부금법」 제11조제8항, 「유아교육법」 및 「지방자치단체의 교육경비 보조에 관한 규정」에 따라 양평군 관할구역 안에 있는 고등학교 이하 각급 학교의 교육에 필요한 경비의 일부를 보조함에 있어 공정하고 효율적인 예산지원 등에 필요한 사항을 규정함을 목적으로 한다.[전문개정 2017. 9. 29.]제2조(보조사업의 범위) 양평군(이하 “군”이라 한다) 관할구역 안에 있는 각급 학교(유치원을 포함한다. 이하 같다)의 교육에 필요한 경비 중 보조할 수 있는 사업(이하 “보조사업”이라 한다)은 다음 각 호와 같다. <개정 2017. 9. 29., 2018. 8. 10.>1. 학교의 급식시설 및 설비사업2. 학교의 교육 정보화 사업 2의2. 학교의 교육시설개선사업 및 환경개선사업 <신설 2018. 8. 10.>3. 학교교육과정 운영의 지원에 관한 사업4. 지역주민을 위한 교육과정 개발 및 운영에 관한 사업5. 학교 교육과 연계하여 학교에 설치되는 지역주민 및 청소년이 활용할 수 있는 체육·문화 공간 설치 사업6. 기숙사가 있는 학교의 저소득층 학생이 부담하는 기숙사 운영비지원(신설 2014. 5. 7)7. 고등학교 기숙사 프로그램 관련 운영비 지원 (신설 2014. 5. 7) [전문개정 2020. 5. 13.]8. 그 밖에 양평군수(이하 "군수"라 한다)가 필요하다고 인정하는 학교 교육 여건 개선사업(제6호에서'
