description_portal: 전라남도교육청 홈페이지는 전남교육의 최신정보를 제공하고 이용자들에게 다양한 교육 콘텐츠를 제공하기 위하여 구축되어 운영 중에 있습니다. 해당 데이터 정보는 전라남도교육청 홈페이지 시스템의 전남농산어촌유학에서 학교현황에 대하여 서술되어 있는 정보입니다. 전남농산어촌유학 유학 유형 관리 테이블에서는 각 지역별 학교현황에서 유학운영학교에 대한 정보들입니다. 해당 데이터는 이미지, 동영상은 제외하고 텍스트형식만 있으므로 참고하시기 바랍니다. 홈페이지 관리 운영자가 원활하게 홈페이지 운영을 위하여 관리하는 누적되어 있는 정보입니다. 해당 정보는 시리얼넘버, 수정일자, 구분, 사용여부, 본문내용 등이 포함되어 있습니다.
