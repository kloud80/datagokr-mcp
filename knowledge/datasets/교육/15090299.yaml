summary_user: 국가자격 가운데 국가전문자격을 자격명 단위로 정리한 목록 파일로, 각 자격의 등급·관련 법률·소관부처·시행기관과 각 홈페이지 주소를 담는다(전국 범위, 비공간 데이터). 취업준비생이나 사업자가 '이 전문자격은 어느 부처 소관이고 어느 기관이 시험을 시행하며 근거 법은 무엇인가'를 확인하거나, 분석가가 부처별 국가전문자격 분포를 파악하는 데 쓴다. 전역 조인 키나 코드 컬럼이 없으므로 국가기술자격 목록, 시험 일정·합격률 데이터, 업종 인허가 요건 데이터와는 자격명 텍스트를 맞춰 이어 쓴다.
description_portal: 국가자격 중 국가전문자격 정보 데이터입니다. 한국직업능력에서 시행하는 자격정책 실태조사를 통해 국가자격에 대한 기초 정보를 수집하고 있으며, 이를 바탕으로 2024년에 발간한 '2024년 국가자격 정보집'(민간자격정보서비스-정보마당-자료및 발간물 게시판에서 다운로드 가능)의 내용을 기준으로 작성된 데이터입니다. 데이터의 경우 국가자격명칭, 등급, 관련 법률, 소관부처, 시행기관 정보를 제공하고 있습니다. 단, 해당 데이터 역시 상시 변경될 수 있으며, 개별법에 따라 운영함에 따라 운영 주체가 다양하기 때문에 위 자료는 참고용으로 활용하시기 바라며, 자세한 세부 사항은 반드시 해당 국가전문자격의 시행기관에 문의하여 주시기 바랍니다.
