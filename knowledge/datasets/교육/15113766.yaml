description_portal: 고교 취업연계 장려금 사업의 효과성  및 성과 분석으로 정책 실효성 및  향후 발전 방향을 모색하기 위한 정책연구입니다. 고교 취업연계 장려금의 효과성 분석을 통해 지원 목적, 지원 규모, 지원 방식을재정립하여 고교 취업 장려금 정책의 정착과 고교 취업 증대를 위한 방향을 제시합니다.고교 취업연계 장려금은 중소 중견기업에 취업(재직)하는 직업계고 3학년, 일반고 3학년 중 직업교육 6개월(180일) 이상 위탁과정 참여 학생을 대상으로 장려금을 지급하는 고졸 취업 지원 제도 입니다.관련 상세 정보는 한국장학재단 누리집(www.kosaf.go.kr) > 장학금 > 국가근로 및 취업연계 장학금 > 고교 취업연계 장려금에서 확인 가능합니다.
