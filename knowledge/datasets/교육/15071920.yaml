description_portal: 대학도서관 인적 자원에 관한 데이터 항목(대학도서관 직원 관련 인적 정보(겸직 등)) 등에 관한 내용을 제공합니다.제공하는 데이터는 전국 대학도서관의 직원 관련 인적 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 각 도서관별 정규직·비정규직 직원 현황,  겸직 여부 등 인적 자원 구성에 관한 세부 항목이 포함되어 있습니다. 데이터는 대학도서관이 매년 실시하는 실태조사 자료를 기반으로 하며, 「교육관련기관의 정보공개에 관한 특례법」 및 대학도서관진흥법 등 관련 법령에 따라 수집·관리됩니다. 업데이트 주기는 수시(1회성 데이터)로, 인적 자원 현황에 변동이 있을 때마다 최신 정보로 반영됩니다. 이 자료는 대학도서관의 인력 운영 실태 분석, 사서 인력 배치 및 자격 현황 파악, 도서관 인적 자원 정책 수립, 인력 수급 계획, 연구 및 통계 등 다양한 분야에서 활용됩니다
