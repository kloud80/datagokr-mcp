description_portal: '평택시 학습동아리 정보 데이터는 평택시 대표 홈페이지 DB 데이터로서  지역 주민들이 자발적으로 형성한 학습공동체의 구성, 활동 현황 등을 체계적으로 파악하여 평생교육 정책을 지원하고 지역 학습문화 활성화를 촉진하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 관심 분야의 학습동아리를 찾고 참여할 수 있으며, 민간·연구기관은 지역 학습수요 분석, 커뮤니티 기반 교육 프로그램 개발, 주민 역량 강화 정책 연구 등에 활용할 수 있습니다. 본 데이터에는 동아리명, 활동 분야, 구성원 수, 활동 장소 등이 포함되어 있어 지역 학습생태계의 구조를 이해하는 데 도움이 됩니다. 이러한 자료는 평생교육 인프라 확충, 주민 역량 강화, 학습 커뮤니티 활성화, 민간 교육 플랫폼과의 연계 등 공공·민간 영역 모두에서 높은 활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
