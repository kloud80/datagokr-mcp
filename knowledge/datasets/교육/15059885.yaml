summary_user: 전북특별자치도에 설치된 직장어린이집을 시설 한 곳당 한 행으로 담은 파일로, 시군구·어린이집명·주소·전화번호와 평가인증 여부, 정원·현원을 담는다(csv 1,665바이트 규모의 소량 자료). 전북에서 일하는 부모가 직장 근처 직장어린이집의 위치와 정원 대비 현원 여유를 확인하거나, 분석가가 시군구별 직장보육 공급 현황을 살피는 데 쓴다. 전역 조인 키는 없어 시군구명이나 주소·어린이집 이름을 기준으로 다른 보육시설 목록이나 지역 자료와 맞춰 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 내에 설치된 직장어린이집의 운영 현황을 담고 있는 자료입니다. 각 어린이집의 명칭, 주소, 연락처 등 기본 정보와 함께, 정부의 평가인증 획득 여부, 총 정원 및 현재 등원 아동 수를 상세히 제공하고 있습니다. 이 자료는 근로자들이 직장 근처에서 안정적인 보육 서비스를 찾는 데 도움을 주는 실용적인 정보입니다. 또한, 일과 가정의 양립을 지원하는 기업 복지 정책의 현황을 파악하고, 직장 내 보육 시설의 공급 및 수요를 분석하여 관련 정책을 수립하고 지원하는 데 중요한 기초 데이터로 활용됩니다.
