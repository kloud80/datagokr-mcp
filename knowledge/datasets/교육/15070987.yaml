summary_user: 한국유학종합시스템(스터디인코리아)을 통한 외국인 유학생의 온라인 입학신청 인원을 대학별로 집계한 파일로, 학사·석사·박사·석박사·전문학사·어학연수·교환학생·기타 과정별 신청 수와 남녀·합계를 담는다(포털 설명상 2022년 말 기준, 약 1.5KB 규모의 작은 CSV). 유학생 유치 담당자나 분석가가 '어느 대학에 어떤 과정으로 온라인 입학신청이 많이 들어왔는가'를 비교할 때 쓴다. 대학 코드 같은 전역 조인 키가 없어 다른 대학 공시·유학생 통계와는 대학명(대학교)을 맞춰 이어 써야 한다.
description_portal: 이 데이터는 한국유학종합시스템의 온라인 입학신청 현황을 대학별로 집계한 것으로, 유학생들이 학사, 석사, 박사, 전문학사 과정뿐 아니라 어학연수와 교환학생 프로그램에 신청한 현황을 담고 있습니다. 강원대학교부터 한양여자대학교까지 다양한 대학에서 남녀 유학생들의 신청 인원이 구분되어 있으며, 2022년 말 기준 정보임을 알 수 있습니다. 이 통계는 유학생 입학신청과 한국유학박람회, STUDY IN KOREA와 관련된 온라인 서비스 현황을 보여 줍니다.교육부 국립국제교육원 한국유학종합시스템(스터디인코리아) 온라인 입학신청 서비스 데이터 통계(학교별 신청 현황)
