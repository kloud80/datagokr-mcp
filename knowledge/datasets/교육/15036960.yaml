description_portal: '"대전광역시교육청_공익법인 현황"은 대전광역시교육청 산하에서 운영되는 공익법인의 설립 목적, 법인구분, 법인성격,법인명, 설립일 등을 종합적으로 정리한 공공데이터입니다. 이 데이터는 공익법인의 투명한 운영과 사회적 책임 이행 여부를 점검하고, 교육청의 공공사업 수행에 있어 법적 근거와 재정적 투명성을 확보하기 위해 제공됩니다.데이터에는 각 공익법인의 명칭, 설립 연도, 설립 근거 법령, 주요 사업 분야 등의 정보가 포함되어 있습니다. 이를 통해 시민들은 교육청 산하 공익법인의 현황을 파악할 수 있으며, 교육청은 정책 수립 및 사업 운영의 투명성을 높일 수 있습니다.이 자료는 대전광역시교육청의 공식 웹사이트를 통해 공개되며, 누구나 열람할 수 있도록 제공됩니다. 이를 통해 대전 지역 교육의 공공성과 투명성을 높이고, 시민들의 신뢰를 구축하는 데 기여하고 있습니다.'
