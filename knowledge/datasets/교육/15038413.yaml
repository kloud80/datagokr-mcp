summary_user: ‘아름다운 인터넷 세상’ 포털에 올라온 사이버윤리·디지털 시민교육 자료를 한 건당 한 행으로 담은 목록으로, 자료명, 대상(유아·초등·중등·학부모 등), 제작연도, 분량, 자료 URL, 등록일이 들어 있습니다(CSV 파일, 43,200바이트). 교사나 학부모, 공공기관 실무자가 ‘초등학생에게 쓸 최근 제작 사이버폭력 예방 영상이 있는가’ 같은 자료를 찾거나 수업 계획을 세울 때 씁니다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 다른 교육자료 목록과는 자료명이나 대상 이름을 맞춰 보는 식으로만 연결합니다.
description_portal: '‘아름다운 인터넷 세상’ 포털 콘텐츠 정보는 디지털 시민의식 함양과 사이버윤리 교육을 위한 각종 교육자료에 대한 정보를 담은 데이터입니다. ‘교육자료명’에는 동영상, 리플릿, 포스터 등 다양한 콘텐츠의 제목이 기록되며, ‘대상’ 필드에는 유아·초등·중등·청소년·학부모 등 콘텐츠의 주 수요층이 명시됩니다. 제작연도 및 분량 정보를 통해 자료의 최신성과 활용 부담도를 파악할 수 있으며, ‘내용’에는 교육자료의 주요 주제(예: 사이버폭력 예방, 개인정보 보호 등) 및 전달 방식이 간략히 설명됩니다. 자료에 대한 직접 접근을 위한 URL이 ‘주소’ 필드에 포함되며, 등록일 기준으로 자료 제공의 시점을 확인할 수 있습니다. 이 데이터는 디지털 시민 교육 콘텐츠를 활용하려는 교사, 학부모, 공공기관 실무자에게 유용하며, 콘텐츠 현황 파악, 교육 계획 수립, 정책 연구 등 다양한 용도로 활용될 수 있습니다.'
