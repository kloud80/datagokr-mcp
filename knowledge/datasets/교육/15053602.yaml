summary_user: 서울시서부교육지원청 관내(은평구·서대문구·마포구)에서 운영 중인 평생교육시설을 시설 한 곳당 한 행으로 담은 원장 파일로, 시설 구분(학교부설·원격평생교육시설·사업장부설 등)과 시설명·주소·전화번호를 담는다. 주민이나 분석가가 "마포구에 있는 학교형태 평생교육시설은 어디이고 연락처는 무엇인가" 같은 질문에 답할 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 시설명이나 주소를 맞춰 붙이거나, 주소를 지오코딩해 좌표 기반으로 연결해야 한다.
description_portal: 서울특별시서부교육지원청 관내 평생교육시설 정보현재 운영중인 서부교육지원청 관내(은평구, 서대문구, 마포구) 평생교육시설 데이터를 제공합니다.(구분, 시설명칭, 주소, 전화번호)* 평생교육시설 구분은 [학교부설, 학교형태, 사내대학형태, 원격대학형태, 사업장부설, 시민사회단체부설, 언론기관부설, 지식인력개발형태, 원격평생교육시설, 장애인]으로 분류되어 있습니다.* 본 데이터는 2026년 6월 기준 자료이므로 조회시점 기준 데이터와는 차이가 있을 수 있습니다.
