summary_user: 전국 초·중등학교를 학교 한 곳당 한 행으로, 학교코드·학교명·설립년도·남녀공학 구분·주야 구분·학교종류·설립구분(국공사립)·소재 시도를 담은 학교 기본정보 목록 파일이다. 학부모나 연구자가 특정 지역에 어떤 종류의 학교가 몇 곳 있는지, 남녀공학·사립 비중이 어떤지 같은 학교 현황을 파악하는 데 쓴다. 학교코드는 교원·학생·학급 통계나 교육청·학교 재정을 학교 단위로 붙이는 기준으로 기대되지만, 실측에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않아 학교명 매칭이나 같은 기관(교육학술정보원·나이스) 학교코드끼리만 연결된다.
description_portal: 제공하는 데이터는 전국 초·중등학교를 대상으로 학교코드, 학교명, 설립년도, 남녀공학구분 등 학교의 기본 현황 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터는 각 학교에서 나이스(NEIS) 시스템을 통해 입력·관리된 정보를 기반으로 하며, 학교의 설립, 폐교, 명칭 변경 등 행정 변동이 있을 때마다 수시로 갱신되는 1회성 데이터입니다. 데이터의 보유 및 제공 근거는 「초·중등교육법」에 따라 국가 교육정보화와 학교 행정 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 기반합니다. 주요 제공 정보에는 학교코드, 학교명, 설립년도, 남녀공학 여부 등 학교 식별 및 현황 파악에 필수적인 항목이 포함되어 있습니다. 이 데이터는 학교 현황 분석, 교육정책 수립, 학교 찾기 서비스, 지역별 교육 인프라 연구, 교육 통계 작성 등 다양한 분야에서 활용될 수 있습니다
