summary_user: 경기도 사이버도서관의 도서 대출·반납 건수를 날짜별·도서관별로 집계한 통계로, 한 행은 특정 일자에 한 도서관에서 발생한 대출 또는 반납 횟수(loan_rtn_noc)입니다. 도서관 운영자나 분석가가 "어느 도서관에서 어느 시기에 전자책 대출이 늘었나" 같은 이용 추이를 볼 때 쓴다. 전역 조인 키는 없고, 도서관코드·도서관명을 기준으로 같은 기관의 다른 도서관 자료와 이름·코드를 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 사이버도서관에서 발생한 도서 대출 및 반납 건수를 날짜별로 집계한 통계 자료입니다. 각 데이터는 대출/반납일, 도서관코드, 도서관명, 해당일의 대출 및 반납 건수로 구성되어 있으며, 동일 날짜에 복수 도서관의 대출/반납 내역이 포함되어 있습니다. ‘도서관코드’는 각 도서관을 식별하는 고유 번호이며, ‘대출/반납건수’는 특정 날짜에 해당 도서관에서 발생한 전체 대출 또는 반납의 횟수를 의미합니다. 이 데이터를 활용하면 도서관별 이용자 활동량 분석, 일자별 대출 추이 파악, 특정 시기의 독서 활동 변화 관찰 등이 가능하며, 정책 수립 및 도서관 서비스 운영에 참고 자료로 유용하게 쓰일 수 있습니다.
