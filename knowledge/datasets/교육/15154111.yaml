description_portal: 전북특별자치도교육청 통합도서관의 단행본 개별 자료 정보입니다. 해당 데이터는 도서관이 소장하고 있는 단행본 자료 한 권 한 권의 개별 등록 정보를 포함하며, 서지 종 정보(종서지)와는 별도로 각 실물 자료의 고유 데이터와 관리 정보를 제공하는 테이블입니다. 단행책정보에는 등록번호, 청구기호, 도서관명, 입수일자 등 도서관의 장서 관리·대출 운영에 필요한 실물 단위의 핵심 정보가 저장됩니다. 이 데이터는 장서현황 파악, 대출·반납 처리, 분실·훼손 관리, 서가 배치, 장서점검 등 도서관 운영 업무 전반에서 활용되며, 관리시스템을 통해 지속적으로 업데이트됩니다.추가로, bo_book_tbl에는 제목 정보가 포함되어 있지 않아 서지 정보의 완전성을 확보하기 위하여 idx_bo_tbl(색인 서지 테이블)의 제목(TITLE) 값을 연계하여 함께 제공하도록 데이터를 구성하였습니다.이는 공공데이터 제공 기준 충족을 위한 보완 조치입니다.
