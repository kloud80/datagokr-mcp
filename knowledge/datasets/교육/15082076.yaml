description_portal: 부산 인재개발원에서 운영하는 교육운영시스템의 지역코드 정보입니다.(예, 과정id, 과정분류년도, 과정분류명, 사용여부 등)부산인재개발원은 미래변화에 능동적으로 대응하고, 글로벌 선도도시 부산을 견인할 역량 있는 공직인재를 양성하는 전문 교육기관으로서의 중추적인 역할을 수행하고 있습니다.앞으로도 「행복한 미래도시, 그린스마트 부산 견인 인재양성」 이라는 비전 아래, 4차 산업혁명 및 기후변화 시대의 급변하는 행정환경에 유연하게 대응하여, 시정현안과 업무성과에 기여하는 교육프로그램을 개발하여 전문역량을 보유한 창의적 인재를 육성하고 있습니다.
