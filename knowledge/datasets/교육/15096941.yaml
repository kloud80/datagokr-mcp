summary_user: 제주 지역 유치원의 수·학급 수·원아 수·교원 수·직원 수·신입·재취·졸업 원아 수·교실 수를 기준 연도와 설립 주체(국공립·사립 등)별로 묶은 집계 통계로, 포털 설명상 2015~2020년을 다루며 개별 유치원 단위 행은 없다. 교육·보육 정책 담당자나 연구자가 '제주에서 설립 주체별 원아 수와 교원 1인당 원아 수가 연도별로 어떻게 달라졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키나 학교코드가 없어 학교 기본정보 마스터와 직접 붙일 수 없고, 다른 제주 교육·인구 통계와는 기준 연도와 설립 주체 이름을 맞춰 이어 쓴다.
description_portal: 제주특별자치도 유치원 현황 데이터는 2015년부터 2020년까지 제주 지역 내 유치원의 수, 학급 수, 원아 수, 교원 수 등 기본 운영 정보를 연도별로 정리한 공공 통계자료이다. 이 자료는 유치원 설립 및 운영 현황을 한 눈에 파악할 수 있게 구성되어 있어, 교육 수요 분석, 보육 정책 기획, 지역별 유아 교육 인프라 분포 평가 등에 유용하다. 지방자치단체나 교육 당국은 이 데이터를 기반으로 유치원 수요 예측, 정원 배정 조정, 보육 자원 재배치, 교육 복지 정책 수립 등의 행정적 결정을 할 수 있으며, 연구자나 시민은 지역 유아교육 환경 변화, 원아 대비 교원 비율, 학급 규모 분석 등을 수행할 수 있는 신뢰성 있는 기초 자료로 활용할 수 있다. 제공기관은 제주특별자치도이며, CSV 형식으로 공개되어 누구나 접근 및 다운로드 가능하다.
