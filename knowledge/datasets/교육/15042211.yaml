summary_user: 고등교육기관 졸업자 취업통계조사 결과를 조사회차·단과대학·학과 단위로 집계해 졸업자 수와 졸업 후 상황(취업·진학·입대·취업불가능·제외인정·기타·미상)을 남녀별로 담은 전국 범위 파일(CSV 약 1.7MB)이다. 진학을 고민하는 학생·학부모나 분석가가 "어느 학과 졸업자가 조사기준일(12월 31일)에 건강보험 직장가입·프리랜서·창업 등으로 얼마나 취업했고, 국내외 대학원에는 얼마나 진학했는가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대학 공시·현황 자료와는 단과대학명·학과명 같은 이름 매칭이나 같은 기관의 코드로만 이어 쓴다.
description_portal: '고등교육기관 졸업자 취업통계조사 결과 중 학과별 졸업 후 상황 데이터를 제공합니다.- 제공되는 데이터 항목명 : 졸업후 상황(취업자, 진학자, 입대자, 취업불가능자, 제외인정자, 기타, 미상)- 항목별 정의  * 취업자 : 조사기준일(12월 31일) 당시 건강보험 직장가입자(교외취업자/교내취업자), 해외취업자, 농림어업종사자, 개인창작활동종사자, 1인 창(사)업자, 프리랜서  * 진학자 : 조사기준일(12월 31일) 당시 고등교육법(제2조)에서 인정하는 교육기관이나 그 밖에 다른 법률에서 인정하는 교육기관(국내 전문대학, 대학, 대학원) 또는 학위 취득을 목적으로 외국의 정규 교육기관(국외 전문대학, 대학, 대학원)에 진학한 자  * 입대자 : 조사기준일(12월 31일) 당시 군 입대자  * 취업불가능자 : 조사기준일(12월 31일) 당시 수형자, 사망자, 해외이민자, 6개월 이상 장기입원자  * 제외인정자 : 조사기준일(12월 31일) 당시 여자군인 중 임관 전 훈련생, 항공종사자 전문 교육기관 교육대상자, 종교지도자 양성 관련학과 졸업자, WFK 사업 참여자  * 기타 : 조사기준일(12월 31일) 당시 취업, 진학, 입대, 취업불가능, 제외인정, 미상에 해당하지 않는 자  * 미상 : 조사기준일(12월 31일) 당시 졸업 후 상황을 파악할 수 없는 자'
