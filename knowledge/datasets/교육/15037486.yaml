summary_user: 전국 유치원의 급식 운영 현황을 유치원 한 곳당 한 행으로 담고, 교육청·교육지원청·설립유형과 함께 급식 운영 방식, 위탁업체, 전체·급식 유아 수, 영양교사 배치, 조리 인력, 집단급식소 신고 여부를 기록한다(포털 설명상 2019년 공시 기준). 학부모나 연구자가 '우리 지역 유치원은 직영 급식인지, 영양교사가 배치돼 있는지'를 확인하거나, 시도·설립유형별 급식 여건 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 유치원 데이터와는 유치원명·교육청명 같은 이름으로 맞춰 연결해야 한다.
limits: 유치원 코드 같은 공통 키가 없어 이름 매칭에 기대야 하므로, 동명 유치원이나 명칭 변경이 있으면 잘못 연결될 수 있다. 포털 설명은 통학차량 정보도 담는다고 하지만, 실제 필드 목록에는 급식 항목만 있어 통학차량 운영 여부는 이 파일만으로 확인되지 않는다.
