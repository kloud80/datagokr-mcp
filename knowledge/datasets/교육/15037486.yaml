description_portal: 이 데이터는 2019년 공시 기준으로 전국 유치원의 급식 및 통학차량 운영 현황을 시도별, 설립유형별로 제공하는 통계 자료입니다. 각 유치원의 급식 실시 여부와 통학차량 운영 여부에 대한 정보를 포함하고 있으며, CSV 형식으로 제공됩니다. 이 자료는 유치원 급식 및 통학차량 운영 실태를 파악하고, 관련 정책 수립 및 연구에 활용될 수 있습니다. 또한 급식과 통학차량의 상황을 파악함으로써 유치원 운영 상태를 종합적으로 이해할 수 있도록 구성되었습니다. 이를 통해 지역별 차이와 유형별 특징을 분석하는 데 도움을 줍니다.(제공데이터) 시도별, 설립유형별  유치원 급식, 통학차량 정보
