description_portal: '○ 통계개요* 통계명 : 학교생활 만족도* 통계종류 : 통계청 사회조사의 교육부문에 대한 지정ㆍ조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상 → 지방통계청 → 통계청* 공표주기 : 정기(2년)* 공표범위 : 지역 - 서울시내용 - 학생의 학교생활만족도에 대한 응답을 백분율로 제공○ 기 타* 조사대상 : 13세 이상(2010년이전 15세 이상) 재학생을 대상으로 함* 전공 : 중학생 및 인문계 고등학생은 제외(예체능, 특성화고, 대학 이상)* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 귀하는 학교생활에서 다음과 같은 사항에 대해 어느정도 만족하고 있습니까?'
