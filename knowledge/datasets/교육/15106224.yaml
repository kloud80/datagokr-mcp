description_portal: '자동차종합검사원 교육 및 고전원 전기장치 취급자 교육 현황 관련 데이터입니다.(교육목표).- 지속적인 교육을 통한 기술인력 직무 역량강화- 현장 의견 수렴을 통한 자동차검사기준 · 방법 등 표준화 도출, 부실 · 불법검사 예방 및 교육 만족도 제고- 자동차 검사제도의 투명성 제고(관련근거)- 자동차종합검사의 시행 등에 관한 규칙 제18조(기술인력의 교육)에 따라 자동차종합검사원으로 선임되기 위해서는 법정교육을 받아야 합니다.- 자동차종합검사 시행 등에 관한 규칙 [별표22]에 따라 고전원전기장치의 검사를 시행하기위해서는 법정교육을 받아야 합니다.(교육과정)- 종합검사 신규교육 : 종합검사 기술인력으로 선임될 때 받아야 하는 교육(자격 : 자동차정비산업기사 이상, 운전면허 1종보통 이상)- 종합검사 정기교육 : 신규교육 후 3년마다 받아야 하는 교육- 고전원 전기장치 취급자 신규교육 : 고전원전기장치를 검사하고자 할 때 받아야 하는 교육- 고전원전기장치 취급자 보수교육 : 고전원전기장치 신규교육 후 3년이 경과한 자(활용기대효과) - 자동차 종합검사, 고전원전기장치 안전교육에 대한 지역별 교육인원 현황 데이터입니다.- 행정 및 교육 자료로 활용가능합니다.'
