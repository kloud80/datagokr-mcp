description_portal: 광주광역시 소방학교의 소방종합훈련장 활용 데이터를 제공하며, 이와 관련하여 간단하게 설명드립니다.소방종합훈련장을 운용하는 과정은 총 13과정이며 각각 신임교육 1과정, 전문교육 10과정, 특수교육 1과정, 수탁교육 1과정입니다.(2024.12.31. 기준)앞서 밝힌 기준일자로 세부적으로 설명드리자면 신임교육은 소방사반으로 이루어져있으며 전문교육은 화재대응능력1급, 인명구조사1급, 유해화학물질사고대응 교관양성과정, 화학사고대응능력1급, 생활안전과정, 실물화재과정, 전문차량운용능력, 고층건축물 진압훈련, 소방위기본교육, 인명구조사2급 자격취득 과정으로 이루어져있으며, 특수교육은 소방기술경연대회 훈련, 수탁교육은 학교안전담당자과정으로 이루어져있습니다. 자세한 사항은 데이터 현황[붙임 파일]을 참고하여 주시길 바랍니다.
