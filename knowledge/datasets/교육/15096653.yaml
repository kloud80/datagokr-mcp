description_portal: '"제주특별자치도 내 학생 1인당 월평균 사교육비 정보 데이터를 제공합니다.항목: 연도, 학교명, 학교구분, 사교육비(만원) 등* 제주특별자치도 내 초·중·고 학교별 학생 1인당 월평균 사교육비(사교육을 받지 않은 학생 포함)를 2019년과 2020년에 걸쳐 조사한 통계자료입니다. 여기에는 학교급별로 어느 정도의 사교육비가 지출되는지 학교 단위로 구분되어 있으며, 모든 학생을 기준으로 한 평균치라 사교육 참여율이나, 참여 학생의 사교육비와는 구분됩니다.* 활용 분야 : 학교구분별 사교육비 비교, 사교육비 격차 탐색 등"'
