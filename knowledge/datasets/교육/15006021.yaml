summary_user: 대구광역시 중구에 있는 교육시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 분류·구분, 시설명, 소재지 주소, 행정동, 위도·경도, 전화번호, 홈페이지, 기준일자를 담는다. 주민이나 학부모가 '중구 어느 행정동에 어떤 학교·교육시설이 있고 연락처는 무엇인가'를 확인하거나, 분석가가 중구 교육시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 시설명·주소 이름 매칭이나 행정동, 위도·경도 좌표로 학교알리미 공시나 학구도 같은 다른 데이터와 이어 쓴다.
limits: 학교 코드 같은 공통 식별자가 없어 다른 학교 데이터와 붙이려면 이름이나 주소를 맞춰야 한다. 범위는 대구 중구 한 개 시군구뿐이라 다른 지역과 비교하려면 지역별로 따로 모아야 한다. 학생 수·교원 수 같은 학교별 공시 수치는 담지 않는다.
