description_portal: '한국학중앙연구원이 제공하는 조선시대의 기술관(技術官) 선발을 위한 잡과(雜科)의 급제자 명단 및 인적 정보를 정리한 자료입니다.각 항목은 응시 과목, 급제 연도, 인물 이름, 본관, 생년·사망년, 시험 등수, 직위, 직렬(예: 식년시, 증광시, 정기시 등) 등의 정보로 구성되어 있습니다. 특히 각 급제자에게 부여된 고유 식별번호(EXM_코드)와 시험 종류, 시험 시기, 합격 유형(미상, 병과, 등수 등), 신상 정보가 병기되어 있습니다.해당 데이터는 조선시대 중·후기 잡과 출신 기술관의 구조적 특성을 분석하거나, 시대별 응시자 분포, 본관별 분포, 관직 이동 경로 등의 디지털 인문학 및 역사 통계 분석에 활용할 수 있습니다.'
