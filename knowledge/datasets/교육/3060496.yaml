description_portal: '한국장학재단 장학금 사업현황 통계(장학금 지원 금액 및 건수(인원))자료로, 매년 전년도 현황 기준으로 발간하는 통계연보 자료임<일러두기>1. 통계전반에 걸쳐서 사용된 기호 ‘-’의 뜻은 ‘해당사항 없음’이거나 ‘0’을 의미함2. 연도 내 합계는 각 학기 수치의 단순 산술 합계이므로 중복 인원이 발생할 수 있음3. 자료 수치는 반올림 처리로 인하여 세목의 합계와 전체 합계가 일치하지 않을 수 있음4. 1인당, 1건당 금액은 단순 계산값으로 실제로 수혜 한 1인당, 1건당 금액과 다를 수 있음5. 소득구간", "소득분위" 용어가 2020년부터 "학자금 지원구간(약칭: 지원구간)으로 변경됨6. 2023년 통계연보까지는 국가장학금Ⅱ유형에 지역인재 장학금을 포함하여 제공, 2024년 통계연보부터는 국가장학금Ⅱ유형 및 지역인재 장학금을 분리하여 제공'
