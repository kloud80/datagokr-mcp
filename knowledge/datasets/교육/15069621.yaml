description_portal: 한국산업인력공단의 "국가자격 CBT 교시과목 정보" 데이터는 국가기술자격 및 국가전문자격 시험의 각 종목별 과목 정보를 제공합니다. 각 시험 종목에 대한 과목명, 과목 순서, 문항 수, 시험 시간 등의 세부 정보를 포함하고 있어 수험자들이 시험 준비에 활용할 수 있습니다. 이 데이터는 공공데이터포털에서 CSV 형식으로 제공되며, 로그인 없이 무료로 다운로드할 수 있습니다. 또한, 오픈 API(JSON/XML) 형태로도 제공되어 다양한 응용 프로그램에서 활용 가능합니다. 데이터는 연 1회 갱신되며, 최신 버전은 2025년 3월 28일에 등록되었습니다. 이 자료는 국가기술자격법에 근거하여 수집되었으며, 자격시험 준비나 분석에 유용하게 활용될 수 있습니다 .
