description_portal: 이 공공데이터는 2024년도 국·공·사립대학(전문 및 원격대학 포함)의 교사(교육용 건물) 확보율 현황을 제공합니다. 교사 기준면적 대비 보유면적의 비율로 산출된 확보율을 제시하며, 학종, 학교명, 캠퍼스명, 지역, 시설정원, 입학정원 기준 확보율, 재학생 기준 확보율 등 세부 항목이 포함되어 대학별 교육시설 확보 수준을 객관적으로 확인할 수 있습니다.  본 데이터는 대학의 교사 확보 현황을 체계적으로 정리하여 비교·분석할 수 있도록 제공되며, 고등교육기관의 시설 현황 파악을 위한 기초자료로 활용됩니다. 또한 국가 및 대학 차원의 교육시설 관련 정책 수립과 개선 방안을 마련하는 데 참고 자료로 쓰일 수 있습니다.
