summary_user: 경기도 사이버도서관 종합목록에서 도서관별로 한 달 동안 대출이 많은 상위 200권을 연월·도서관 단위로 집계한 자료로, 서명·저자·발행자·발행연도·ISBN·지역명·도서관명·수량을 담는다. 도서관 운영자나 정책 담당자가 '우리 지역 도서관에서 이번 달 가장 많이 빌려간 책은 무엇이고 어떤 장르가 인기인가'를 확인해 장서 구입 우선순위나 독서 정책을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 ISBN(isbn_no)이나 도서관명·지역명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 사이버도서관에서 각 도서관별로 한 달 동안 대출 횟수가 많은 상위 200권의 도서를 집계한 자료입니다. 항목은 연월, 서명(도서 제목), 저자, 발행자, 발행연도, ISBN, 지역명, 도서관명, 그리고 대출 수량으로 구성되어 있으며, 각 도서가 어떤 도서관에서 얼마나 자주 대출되었는지를 보여줍니다. 이를 통해 도서관별 인기 도서 목록 파악, 이용자 수요 분석, 도서 구매 우선순위 설정 등에 활용할 수 있으며, 아동 도서, 학습만화, 문학 작품 등 특정 장르에 대한 지역별 선호도 분석도 가능합니다. ‘수량’은 도서관이 보유한 도서 권수로, 도서관별 운영 전략 수립 및 독서 활성화 정책 기획의 기초자료로 유용합니다.
