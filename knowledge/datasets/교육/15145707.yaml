description_portal: 서울특별시 중랑구 방정환 교육지원센터의 컨설팅정보를 제공합니다. 방정환교육지원센터에서는 컨설팅 신청 기능을 지원합니다. 중랑구 진로, 진학컨설팅은 학생의 성적과 활동을 분석하여 개인에게 딱 맞는 합격 전략을 제시합니다. 전문적인 분석과 진정성이 있는 상담을 통해 목표 대학에 합격할 수 있도록 지원하는 서비스입니다. 컨설팅 장소는 방정환교육지원센터 [02087] 서울 중랑구 망우로 325 3층 상담실입니다. 단, 컨설팅 장소는 상황에 따라 변경될 수 있음을 안내드립니다. 자세한 사항은 고객센터 번호로 문의 02-2094-1885 또는 컨설팅 신청하기 메뉴(진학/학습지원)를 통해 확인하여 주시기 바랍니다. 감사합니다.
