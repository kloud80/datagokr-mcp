summary_user: 경기도청소년수련원이 운영한 수련활동을 활동별·사업연월별로 기록한 자료로, 활동명, 숙박형 같은 사업유형, 참가 대상 유형과 교급, 총 참가 인원, 성별 인원, 경기 남부·북부·기타 지역별 인원을 담는다. 청소년단체나 지자체 담당자가 '어느 교급·사업유형의 수련활동에 참가자가 많고 성별·지역 분포는 어떤가'를 확인해 프로그램 기획과 참여도 분석에 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어서, 다른 데이터와는 사업연도·월이나 교급 같은 이름 값을 맞춰 붙여야 한다.
description_portal: 이 데이터는 청소년의 건전한 활동을 지원하기 위한 경기도청소년수련원의 수련활동 프로그램 운영 현황과 참가자 정보를 기록한 자료입니다. 각 행은 특정 시점의 수련활동을 나타내며, 주요 항목으로는 수련활동명, 사업유형(숙박형 등), 사업년도 및 사업월, 참가 대상의 유형 및 교급, 총 참가 인원 수, 성별 참가자 수가 포함되어 있습니다. 이 데이터는 청소년 활동 정책 수립, 지역 맞춤형 프로그램 기획, 참여도 분석 및 성평등 정책 지원 등의 목적에 유용하며, 교육기관, 청소년단체, 지방자치단체 등 다양한 기관에서 활용이 가능합니다.
