summary_user: 서울특별시교육청 소관 각급 학교(유치원부터 학력인정 평생학교까지)의 위도·경도, 주소, 우편번호, 학교급, 설립구분, 자치구를 연도별·학교별 행으로 담은 원천 목록 파일(CSV 약 3MB)이다. 분석가나 학부모가 '특정 자치구에 어떤 학교가 어디에 있고 해마다 어떻게 바뀌었나'를 지도에 표시하거나 학교 접근성을 따질 때 쓴다. 전역 학교코드 같은 조인 키가 없어서 다른 학교 통계·재정 자료와는 학교명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 서울특별시교육청 각급 학교의 경도,위도, 주소, 우편번호,학교명, 설립구분,학교급, 자치구, 시도명, 연도별 정보를 보유하며 서울특별시교육청 정책기획관에서 관리하고 있습니다.업데이트 주기는 연 1회 업데이트 예정입니다. 해당 자료는 정보공시에 포함되는 학교 기본정보 자료로 2014년부터 각급 학교별 자료(유치원,초등학교,중학교,고등학교,특수학교,각종학교,방송통신중학교,방송통신고등학교,고등기술학교,학력인정 평생학교)를 보유하고 있으며현재 까지의 자료를 탑재하고 있습니다. 이용에 많은 참고 부탁드립니다.
