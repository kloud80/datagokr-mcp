description_portal: 제공하는 데이터는 교육 현장에서 실질적으로 활용할 수 있도록 다양한 교육 주제와 최신 교육 트렌드를 반영한 가이드북, 매뉴얼, 지침서 등 실무 중심 자료를 제공하는 공공데이터입니다. 대표적으로 디지털 시민교육, AI 디지털교과서 개발, 에듀테크 수업 활용, AI·SW교육 창의적 체험활동 운영, 원격교육 콘텐츠 심사 기준 등 교육 혁신과 디지털 전환에 대응하는 다양한 주제의 가이드 자료가 포함되어 있습니다. 이 자료들은 한국교육학술정보원이 자체적으로 기획하거나 교육 현장 전문가와 협력해 개발하며, 관련 교육정책 및 법령에 근거해 수집·관리됩니다. 업데이트는 새로운 교육정책 발표, 신기술 도입, 현장 수요 변화 등에 따라 수시로 이루어집니다. 본 자료는 교사, 교육행정가, 정책입안자 등 교육 관계자가 현장 수업 설계, 교수학습 혁신, 디지털 교육환경 구축, 정책 수립, 교육자료 개발 등 다양한 분야에서 활용할 수 있습니다.
