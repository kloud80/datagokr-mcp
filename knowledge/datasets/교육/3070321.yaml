summary_user: 경주 지역에서 폐교된 학교 한 곳당 한 행으로 학교명, 폐교연도, 소재지 주소, 토지·건물 면적, 활용 여부를 담은 소규모 CSV 파일(약 2KB)입니다. 지자체 담당자나 민간 사업자가 '경주에서 아직 활용되지 않은 폐교 부지는 어디이고 면적은 얼마인가'를 확인해 임대·매입이나 재활용을 검토할 때 쓰고, 분석가는 구도심 쇠퇴 신호로 참고합니다. 전역 조인 키가 없어 다른 데이터와는 학교명이나 소재지 주소를 이름 매핑하거나 지오코딩해서 이어 써야 합니다.
description_portal: '"경주 지역 내 폐교된 학교의 재산 현황을 체계적으로 안내하는 자료입니다. 이 데이터에는 폐교된 학교의 명칭, 소재지 주소, 토지면적, 건물면적, 활용여부 등 구체적인 정보가 포함되어 있습니다. 해당 정보는 「공유재산 및 물품 관리법」, 「초·중등교육법」 등 관련 법령에 근거하여, 폐교 발생 시 현장 조사 및 행정자료를 통해 수집·관리되고 있습니다. 데이터는 연 1회 이상 정기적으로 갱신되어 최신의 폐교재산 현황을 반영합니다.이 데이터는 지역사회에서 폐교 재산의 활용 방안 모색, 공공자산의 효율적 관리, 지방자치단체 및 민간의 임대·매입 검토, 교육시설 재활용 정책 수립 등 다양한 분야에서 활용됩니다. 또한, 연구자, 정책 담당자, 일반 시민이 경주 지역 내 폐교재산의 현황과 활용 실태를 객관적으로 파악하고, 지역 발전 및 공공자산 활용 정책 수립에 참고자료로 사용할 수 있는 중요한 공공데이터입니다."'
