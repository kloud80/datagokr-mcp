summary_user: 경기도가 조례에 따라 지원한 대학생·대학원생·미취업 졸업생 학자금 대출이자 지원 실적을 기준년도·반기별로 집계해 담는다. 지원금액(원)과 지원 건수의 합계를 일반상환과 취업후상환으로 나눠 보여주며, 연도·반기별 경기도 학자금 이자지원 규모가 어떻게 변했는지 살피는 분석가나 정책 담당자가 쓴다. 학교코드 같은 전역 조인 키가 없어 다른 데이터와는 기준년도·반기를 맞춰 이어 붙이는 방식으로만 연계한다.
description_portal: 경기도 내 대학생, 대학원생, 미취업 졸업·수료생의 경제적 부담을 경감하고자 「경기도 대학생 학자금 대출이자 및 신용회복 지원에 관한 조례」에 따라 진행한 경기도 대학생 학자금 대출이자 현황입니다.주요 항목으로는 기준년도, 기준반기, 지원금액합계, 지원수합계, 일반상환지원금액 및 그 수, 취업후상환지원금액 및 그 수 등이 포함되어 있습니다.지원수 합계는 대출건수를 의미합니다.지원금액은 (원)단위 입니다.합계는 한국장학재단 대출지원수와 금액을 포함한 총합계입니다.(한국장학재단 대출건수와 금액은 경기도 사전정보공표를 참고해주시기바랍니다.-)
