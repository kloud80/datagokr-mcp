description_portal: '부산광역시 사하구에서 운영 중인 정보화 교육 강좌 현황에 대한 데이터를 제공합니다. 본 데이터는 정보격차 해소 및 디지털 역량 강화를 목적으로 지역 주민을 대상으로 개설된 교육 강좌 정보를 포함하고 있습니다. * 주요 데이터 컬럼별 상세설명○ 교육명→ 운영 중인 정보화 교육 강좌의 명칭 (예: ITQ 한글, 스마트폰 활용 등)○ 교육 시작/종료 일자 → 해당 강좌의 교육 시작 일자 및 종료 일자○ 교육 시작 시각/종료 시각 → 해당 정보화교육 강좌 시작 및 종료 시각○ 교육장소 → 강좌가 운영되는 장소의 명칭(예: 사하구청 정보화교육장)○ 대상인원수 → 강좌별 수용 가능한 수강 인원 수○ 도로명주소 / 지번주소 → 교육장소의 위치 정보○ 위도 / 경도 → 공간 분석을 위한 교육장소의 위치 좌표○ 교육 월 → 강좌가 개설되는 월 또는 상시 개설 여부 ○ 교육 대상 → 교육 수강 대상자(예: 사하구민)○ 교육 접수 시작 일자/종료 일자 → 수강 신청이 가능한 시작 일자 및 종료 일자○ 기관 대표 전화번호 → 교육 관련 문의가 가능한 대표 전화번호(지역번호 포함)○ 교육일수 → 강좌별 실제 교육이 이루어지는 일수○ 데이터기준일자 → 본 데이터의 작성 및 갱신 기준이 된 날짜'
