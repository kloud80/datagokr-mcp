description_portal: '제주특별자치도 내 대학원 학교 수 정보 데이터를 제공합니다.항목: 연도, 시도, 학교 구분, 학교 수 등* 014년부터 2020년까지 제주특별자치도 내 대학원 학교 수를 연도별 및 학교 구분별로 집계한 통계자료이다. 자료에는 대학원의 설립 및 운영 현황이 반영되어 있으며, 이를 통해 제주 지역의 고등교육 인프라가 어떤 추세로 변화해왔는지를 확인할 수 있다. 특히 연도별 증감 현황은 대학원 교육 수요, 학생 유치 노력, 학문 연구 기반 확대와 밀접하게 연관되어 있어 향후 교육정책 방향성을 설정하는 데 기초 자료가 된다.* 활용 분야 : 대학원 설립 및 학과 개편 계획, 고등교육 인프라 정책 수립 등데이터 제공처: KOSIS 국가통계포털'
