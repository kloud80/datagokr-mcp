summary_user: 다문화·탈북(이주 북한배경)학생 멘토링장학금 사업에 참여하는 대학(원)생 멘토의 소속 대학, 멘토링 사업명, 멘토링 가능 언어권을 대학·사업·언어권 단위로 담은 전국 범위 파일(CSV, 약 16.7KB)이다. 다문화 가정 학생이나 학부모, 지원기관이 '어느 대학에 베트남어·중국어 등 특정 언어권 멘토가 있는가'를 확인하거나, 분석가가 대학별 언어권 멘토 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 대학 데이터와는 대학명(대학명)을 이름으로 맞춰야만 이어 쓸 수 있다.
description_portal: '다문화·탈북(이주 북한배경)학생 멘토링장학금 사업에 참여하고 있는 대학(원)생 멘토의 소속 학교와 등록된 언어권(멘토링 가능 언어권)을 보여주는 데이터입니다.데이터 항목은 다문화·탈북(이주 북한배경)학생 멘토링장학금의 사업 참여 대학(원), 멘토링 사업명, 멘토링 사업 언어권이 있습니다. 다문화·탈북(이주 북한배경)학생 멘토링장학금은 이주 북한배경 학생과 대학(원)생 간 매칭을 통해 이주 북한배경학생의 학교생활 적응 및 기초학습을 지원하고, 대학(원)생에게는 멘토링장학금을 지원하는 것을 목적으로 합니다.※ 장학금 관련 상세 정보는 한국장학재단 홈페이지 참고(경로: 한국장학재단 홈페이지(https://www.kosaf.go.kr) > 인재육성 > 다문화·탈북학생 멘토링)'
