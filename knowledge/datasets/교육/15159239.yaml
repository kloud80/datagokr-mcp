description_portal: 해당 데이터는 경상남도 창원시에서 매년 선정하는 창원의  책에 대한 데이터입니다."창원의 책" 선정의 가장 큰 의의는 지역사회를 하나로 아우르는 독서운동이 될 수 있다는 것이며, 선정절차는 후보도서 시민추천 공모-후보도서 선정-시민선호도 조사-최종선정 순입니다.자세한 목록은 창원시 도서관사업소 홈페이지에서 확인 가능합니다.(https://lib.changwon.go.kr/cl/libcw/select.html)2019년~2026년 기준의 자료가있으며, 2026년 기준 일반/청소년/어린이/그림책/창원문학 부문에서 매년 상반기 각 1권의 책을 선정하고있습니다.해당 데이터는 분야별 추천도서 등 도서관련 정부에 활용가능합니다.
