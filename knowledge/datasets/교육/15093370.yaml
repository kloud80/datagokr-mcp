description_portal: 이 데이터는 충북도립대학에서 운영하는 NCS(국가직무능력표준) 프로그램의 강의계획서 목록을 CSV 파일 형태로 제공하는 자료입니다. 주요 항목으로는 강의가 개설된 연도, 계열코드 및 계열명, 학과명, 과목코드와 과목명, 해당 과목이 속한 학년과 학기, 분반 정보, 그리고 과목의 구분 코드와 과목구분명이 포함되어 있습니다. 이 데이터를 통해 학사 행정 담당자 및 학생들은 NCS 프로그램 강의의 체계적 운영 현황을 파악하고, 강의 계획서의 구성과 분류 체계를 쉽게 이해할 수 있습니다. 또한, 교육과정 관리, 강의 계획서 작성 및 검토, 학사 일정 조정 등 다양한 교육 행정 업무에 필수적인 기초 자료로 활용됩니다.
