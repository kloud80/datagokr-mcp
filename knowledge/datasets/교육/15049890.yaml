summary_user: 서귀포시 관내 소규모 학교 육성지원 사업으로 지은 공동주택을 단지별로 담은 원천 목록으로, 읍면동·마을명·주소·위도·경도와 세대 규모, 면적, 신축년도, 리사무소 전화번호가 들어 있다(csv 약 1.3KB의 작은 파일). 소규모 학교가 있는 마을로 이주를 고려하는 가구가 '이 마을에 지원 공동주택이 몇 세대 있고 언제 지어졌나'를 확인하거나, 분석가가 지원 주택 위치와 학교 분포를 비교하는 데 쓴다. 전역 조인 키는 없으므로 위도·경도 좌표나 읍면동·마을명을 이름으로 맞춰 학교 기본정보·학구도 데이터와 공간 또는 행정구역 단위로 잇는다.
limits: 학교코드 같은 공통 키가 없어 특정 학교와 직접 연결되지 않고, 이름 매핑이나 좌표 기반 공간 결합으로만 연계된다. 범위는 서귀포시 한 곳뿐이라 다른 시군구와 비교할 수 없다.
