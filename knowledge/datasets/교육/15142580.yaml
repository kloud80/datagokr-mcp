summary_user: 전국 자치단체 공공도서관을 도서관 한 곳 단위로 담는 실시간 API로, 위치·연락처·운영시간·휴관일·장서 수·총좌석수 같은 기본정보와 운영상태·금일 방문자수·좌석사용률 같은 현황, 열람실별 이용 가능 좌석 정보를 오퍼레이션별로 제공한다. 지금 문을 연 근처 도서관이 어디이고 열람실에 빈 좌석이 남았는지 알고 싶은 이용자나, 지역별 도서관 운영시간·좌석 규모를 비교하려는 분석가가 쓴다. 세 오퍼레이션은 공공도서관아이디(pblibId)로 서로 이어 붙이고, 지자체 코드(stdgCd)·시도·시군구명과 위도·경도로 지역 단위 자료나 지도와 맞춘다. 다만 다른 데이터셋과 공유하는 전역 조인 키는 실측에서 확인되지 않았다.
description_portal: 자치단체에서 운영하고 있는 공공 도서관 열람실 이용자의 편의제공을 목적으로 공공 도서관 통합정보를 비롯해 공공도서관 상태정보, 공공도서관 열람실의 실시간 좌석이용 현황 정보를 제공 합니다. 제공되는 정보는 공공 도서관의 지리적 위치 및 연락처, 운영시간, 휴관일 정보 등 공공 도서관의 기본 정보인 "공공도서관 통합정보"와 공공도서관의 운영 상태 및 방문자수, 좌석사용율 등의 공공도서관 운영상태 정보인 "공공도서관 현황정보", 공공도서관의 열람실 정보 및 열람실 실시간 이용가능한 좌석 정보인 "공공도서관 열람실 실시간정보"를 제공합니다.
