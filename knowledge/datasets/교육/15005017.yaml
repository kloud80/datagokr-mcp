description_portal: '상주도서관에서 개설·운영하는 평생교육강좌의 상세 현황을 체계적으로 안내하는 공공데이터입니다. 이 데이터에는 강좌명, 운영 기간, 강의 요일 및 시간, 강사명, 모집 인원, 대상(예: 성인, 청소년, 어린이 등) 등 강좌별로 필요한 주요 정보가 포함되어 있습니다. 해당 정보는 도서관의 연간 교육 운영 계획, 강좌별 신청·접수 자료, 강사 이력서 등 다양한 행정자료를 바탕으로 수집되며, 「평생교육법」 및 도서관 운영 내규에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 매년 강좌 개설 시점에 맞춰 정기적으로 갱신되어 최신의 강좌 현황을 반영합니다. 본 데이터는 지역 주민이 평생학습 기회를 쉽게 확인하고 참여할 수 있도록 지원하며, 도서관의 교육 프로그램 기획, 교육 수요 분석, 평생교육 정책 수립, 지역사회 평생학습 활성화 등 다양한 분야에서 활용되고 있습니다. 또한, 교육기관, 연구자, 정책 담당자 등이 평생교육 현황을 분석하고, 교육복지 및 평생학습 진흥 정책 마련에 참고자료로 사용할 수 있는 중요한 공공데이터입니다.'
