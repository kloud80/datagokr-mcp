summary_user: 한국방송통신전파진흥원 자격검정 홈페이지(cq.or.kr)에 올라온 전파·무선설비·방송·통신 분야 국가기술자격 공지사항을 게시물 한 건 단위로 담으며, 제목·본문·등록일·첨부파일 정보가 들어 있다. 무선설비기사·방송통신기사 같은 시험을 준비하는 응시자나 교육자가 '이번 회차 시험 일정과 변경 공지가 무엇인가'를 확인해 수험 준비나 커리큘럼 구성에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자격·채용 데이터와는 종목명 같은 이름 매핑으로만 이어 쓸 수 있다.
limits: 공지 게시물 원문이라 시험 일정·종목이 구조화된 필드로 나뉘어 있지 않아 본문(bbscttCn)을 직접 읽거나 파싱해야 하고, 다른 데이터와 붙일 공통 코드가 없다. 범위는 전국·비공간이어서 지역별 분석에는 맞지 않으며, 개발계정은 하루 10,000회로 호출이 제한된다.
