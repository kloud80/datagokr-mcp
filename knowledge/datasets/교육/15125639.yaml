description_portal: 본 데이터를 통해 한국방송통신전파진흥원 자격검정 홈페이지(cq.or.kr) 에서 제공하는 전파/무선설비/방송/통신분야 국가기술자격검정 시험일정 및 주요 공지사항 정보를 제공받을 수 있습니다. 해당 데이터는 공공데이터포털에서 받은 인증키, 게시물 시작 페이지수, 한 페이지에 표출될 게시물 수를 입력하면 결과값을 얻을 수 있습니다. 결과물은 게시물 등록일, 게시물 제목, 게시물 내용, 게시물 번호, 첨부파일 이름, 첨부파일 ID, 첨부파일 개수 입니다. 이를통해 전파 전자 관련 국가기술자격검정 시험의 공지사항을 한 눈에 파악할 수 있습니다. 시험 응시자 또는 교육자는 국가기술자격검정에 대한 내용을 확인하여 수험 준비 또는 커리큘럼 구성에 참고할 수 있습니다. ※에러유형별 메세지를 확인하세요
