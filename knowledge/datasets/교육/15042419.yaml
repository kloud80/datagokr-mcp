description_portal: 본 데이터는 한국방송통신전파진흥원이 관리하는 ‘전파·통신분야 자격증 종목별 통신보안교육 통계’ 자료입니다. 국가기술자격 종목별로 연도, 성별, 교육유형별(현장·수시·출장·온라인) 교육 실적을 집계한 통계 데이터로, 통신보안교육의 운영 현황과 참여 추이를 분석할 수 있도록 구성되어 있습니다. 주요 항목은 종목명, 교육연도, 성별, 교육유형별 교육 인원수 및 합계이며, 연도별·성별·유형별 비교를 통해 교육 수요와 성과를 파악할 수 있습니다. 본 데이터는 전파통신 분야 전문인력의 보안역량 강화를 위한 정책기초자료로서 사용될 수 있으며, 교육기관과 정책수립기관이 효율적인 교육운영계획을 수립하는 데 참고할 수 있습니다. 데이터 형식은 CSV이며, 매년 교육 실적을 누적 갱신합니다.
