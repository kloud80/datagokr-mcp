summary_user: 문경 지역 폐교 한 곳을 한 행으로 담은 원장 파일로, 폐교명·폐교연도·소재지 주소·활용유형(자체 활용, 임대 등)·건물 연면적·대지 면적을 담으며 파일 크기는 618바이트로 소수 학교만 들어 있다. 지역 주민이나 사업자가 문경에서 임대하거나 활용할 수 있는 폐교가 어디에 있고 얼마나 넓은지 확인할 때 쓴다. 전역 조인 키가 없어 폐교명이나 소재지 주소를 기준으로 학교 기본정보·주소 좌표 데이터와 이름·주소 매칭으로 이어 쓴다.
limits: 학교 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 폐교명이나 주소를 직접 맞춰야 한다. 범위가 문경교육지원청 관할로 한정되어 시도 전체 폐교 현황은 다른 교육지원청 파일과 합쳐야 한다.
