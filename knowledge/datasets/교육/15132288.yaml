summary_user: 광주광역시교육청 소속 초·중·고등학교, 특수학교, 유치원, 각종학교, 고등기술학교 338곳을 학교 한 곳당 한 행으로 담은 목록으로, 학교명·급별·우편번호·주소·전화번호와 학교알리미·학교 누리집 주소를 담는다. 학부모나 민원인이 '광주에 있는 특정 중학교의 연락처와 학교알리미 공시 페이지가 어디인가'를 찾거나, 분석가가 광주 지역 학교를 급별로 주소와 함께 정리할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 학교명이나 주소를 맞춰 붙여야 한다.
