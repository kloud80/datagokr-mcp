description_portal: 안심수학여행서비스 체험시설 신청현황 입니다.체험시설명, 체험시설주소, 신청학교, 학교주소, 인솔자수, 학생수, 여행기간에 대한 데이터를 제공합니다.*안심수학여행서비스는 제주도가 학생들의 안전한 여행을 보장하고자 전국 최초로 도입한 수학여행 사전 안전점검 제도다.*관련 부서와 전문기관이 참여하는 다층적 협업체계를 기반으로 운영된다. 소방안전본부를 포함해 4개 소방서와 행정시가 현장 점검과 행정지원을 수행했다.*한국전기안전공사, 한국가스안전공사, 한국해양교통안전공단 등 전문기관이 전기·가스·해양 분야를 담당해 전 시설을 대상으로 전문성과 실효성을 갖춘 점검체계를 구축했다.
