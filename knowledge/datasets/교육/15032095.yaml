description_portal: 한국폴리텍대학에서 운영하는 소규모사업장 훈련과정에 대한 정보를 제공합니다. 이 데이터는 중소규모 기업의 재직자 직무능력 향상과 현장 맞춤형 기술 인력 양성을 지원하기 위해 수집된 것으로, 대학 및 캠퍼스별 실사업명, 과정명과 차수, 대표업체명, 훈련직종명, 직종대분류 및 중분류, 훈련시간, 훈련기간, 주야구분, 수료인원 등의 세부 항목을 포함합니다. 본 데이터를 통해 지역 산업 수요에 기반한 맞춤형 훈련 현황을 분석하거나, 기업·직종별 훈련성과를 파악하여 정책 수립 및 인력양성 전략 수립에 활용할 수 있습니다.
