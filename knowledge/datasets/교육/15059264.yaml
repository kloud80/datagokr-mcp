summary_user: 경기도 내 마이스터고·특성화학교 졸업생의 진로를 학교별·기준연도별로 집계해 졸업자, 진학자, 취업자, 진학·취업 병행자, 입대자, 제외인정자, 기타·미상 인원을 남녀·합계 수와 진학률·취업률로 담는다. 교육행정 담당자나 분석가가 "경기도 마이스터고 중 취업률이 높은 학교는 어디이고 남녀 차이는 어떤가" 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 학교명이나 학교알리미 공시용 학교코드(INFO_PBLNTF_SCHOOL_CD)·시군 코드로 학교 기본정보·학생 통계와 이름·코드 매핑해 잇는다.
description_portal: 본 데이터는 경기도 내 마이스터고 및 특성학교 졸업생의 진로 현황을 파악할 수 있는 자료로, 졸업자 수, 진학자 수, 취업자 수, 입대자 수, 진학·취업 병행자 수, 기타 및 미상 처리 인원 등 세부 진로 분포를 성별 및 총합 기준으로 제공합니다. 항목에는 학교명, 시군명, 지역교육청명, 학교급명, 설립구분명 등의 기본 정보와 함께 각 진로 항목별 남녀 구분 수치 및 비율이 포함되어 있어 졸업생의 진로 경향을 다각도로 분석할 수 있습니다. 진학자 수는 1학생 1학교 등록 원칙에 따라 집계되며, 취업자 수는 주당 60시간 이상 근로하고 일정 소득이 있는 자로 정의됩니다. 본 데이터는 교육정책 수립, 취업 지원 정책 기획, 진로지도 방향 설정 등 다양한 교육행정 및 진로지원 서비스 개선에 활용될 수 있으며, 학교알리미를 원천 시스템으로 경기도 AI데이터행정과에서 제공되었으나, 교육부 방침에 따라 현재는 갱신이 중단된 상태입니다.
