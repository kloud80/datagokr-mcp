description_portal: '한국사학진흥재단_사립대학 교비 등록금 및 비등록금 회계 예산은 한국사학진흥재단의 회계연도별 사립대학 예결산 집계를 통해 산출된 자료입니다.사립대학 교비 등록금 및 비등록금 회계 예산 자료를 통해 교비 등록금회계 및 비등록금회계 예산서상 전입금수입, 기부금수입, 인건비, 관리운영비 등의 내역을 학교별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(단위 : 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
