summary_user: 한국사학진흥재단이 회계연도별 사립대학 예결산 집계로 산출한 자료로, 학교·회계(등록금/비등록금)·회계연도 단위로 등록금·입학금·수업료·전입금·기부금 등 교비 예산 계정별 금액(천원)을 담는다. 분석가나 학부모가 특정 사립대학이 예산상 등록금 수입에 얼마나 의존하고 법인 전입금은 얼마나 편성하는지를 학교·학종·지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학공시·재정 자료와는 학교명·법인명과 회계연도로 맞춰 이어야 한다.
limits: 학교 코드 같은 전역 조인 키가 없어 학교명 표기 차이에 따라 연결이 어긋날 수 있다. 예산서 기준 자료이므로 실제 집행액(결산)과는 다르며 금액 단위는 천원이다.
