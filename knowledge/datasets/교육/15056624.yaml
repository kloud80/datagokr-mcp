summary_user: 경기도 내 특수학교별로 유치원·초등·중학·고등 과정의 학년별 학급 수, 과정별 순회학급 수, 전공과 학급 수와 전체 합계를 학교 한 곳당 한 행으로 담는다. 교육청 담당자나 특수교육 분석가가 '어느 시군·지역교육청에 특수학교 학급과 순회학급이 얼마나 배치돼 있나'를 확인해 학급 인가나 특수교원 배치를 검토할 때 쓴다. 실측 컬럼에서 전역 조인 키(표준 학교코드 등)는 확인되지 않아, 다른 학교 기본정보·교원·학생 통계와는 학교명·시군코드(SIGUN_CD) 같은 이름·코드 매핑으로만 이어 붙인다.
description_portal: 본 데이터는 경기도 내 특수학교의 학년별 학급 수 현황을 제공하는 자료로, 유초등부터 고등과정 및 전공과까지의 학년별 학급 수와 함께 순회학급 현황 및 전체 합계 정보를 포함합니다. 각 항목은 학교명, 시군명, 지역교육청명, 설립구분명, 학교급명 등의 기본 정보와 유치원~고등학교 학년별 학급 수, 유초등·중등·고등의 순회학급 수, 전공과 학급 수 등을 구체적으로 제시합니다. ‘순회학급’은 병원, 가정, 복지시설 등 학교 외 공간에서 특수교사가 순회하며 교육을 제공하는 학급을 의미하며, 총계사항에는 괄호 안에 순회학급 수가 별도로 기재됩니다. 이 데이터는 특수학교 학급 배치 및 운영 현황을 파악하는 데 활용되며, 교육청의 학급 인가 현황 분석, 특수교원 배치, 특수교육 정책 수립 등 행정적 활용이 가능합니다. 학교알리미 시스템 기반으로 경기도 AI데이터행정과에서 연간 제공되며, Open API를 통해 연계 활용이 가능합니다.
