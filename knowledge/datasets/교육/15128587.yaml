description_portal: 한국장학재단 고객 상담 센터 전화번호 입니다. 전화 상담 서비스는 365일 운영되며, 상담원 연결 가능 시간은 09시부터 18시까지 입니다.한국장학재단 고객상담센터는 다양한 고객 상담채널을 운영하고 있습니다. 전화상담 이외에  챗봇과 채팅상담이 가능하며 온라인 상담으로 문의하시면 이메일로 궁금한 사항을 답변 받으실 수 있습니다.국가장학금 또는 학자금 대출 신청은 홈페이지와 모바일에서 가능하며 관련 서류제출 또한 모바일로 제출이 가능합니다. 자세한 사항은 고객상담센터 대표번호(1599-2000)로 문의하시기 바랍니다.한국장학재단 고객상담센터 전화번호 안내 1599-2000
