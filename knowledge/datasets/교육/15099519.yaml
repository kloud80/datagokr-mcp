description_portal: 본 데이터는 (재)한국지방교육행정연구재단에서 관리하는 교육행정구역 공간정보(SHP) 파일입니다. 초중등학교위치는 전국 17개 시도교육청의 관할지역을 공간정보로 제공하고 있습니다. 해당 파일(SHP)은 GIS(지리정보시스템) 관련 소프트웨어에서 파일을 열어 확인하실수 있습니다.초중등학교명칭 및 코드정보로 구성되어 있으며 이는 (재)한국지방교육행정연구재단에서 관리하는 학구도 공공데이터 관련 파일과 함께 연계하여 활용 할 수 있습니다.※ 학구도 공공데이터 7종은 매년 3월, 9월에 배포되고 있습니다. 데이터 활용에 참고하시기 바랍니다.
