description_portal: 본 자료는 광주광역시에 위치한 정보화 교육기관 중 장애인 등 디지털 접근이 어려운 취약계층을 대상으로 운영되는 기관의 현황을 정리한 것입니다. 교육기관의 명칭, 주소, 전화번호 등 기본적인 정보와 함께, 해당 기관이 제공하는 주요 교육 내용이나 지원 서비스에 대한 간단한 설명도 포함될 수 있습니다. 이 자료는 디지털 정보 접근성 향상, 지역 간·계층 간 정보격차 해소, 그리고 디지털 포용 사회 실현을 위한 정책 수립의 기초 자료로 활용됩니다. 또한, 광주시 및 관련 기관이 추진하는 취약계층 맞춤형 정보화 교육사업의 기획, 집행, 성과 평가 등에 있어 참고자료로 제공될 수 있습니다.
