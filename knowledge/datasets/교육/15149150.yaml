summary_user: 경기도 고등학교별로 지역, 계열, 평준화 대상 여부와 1~3학년 학년별 정원을 담은 학교 단위 현황 파일이다(2026년 기준, CSV 약 25KB). 평준화 학군 지역으로 전학·편입학을 고민하는 학부모나 학생이 '이 지역에서 전편입학이 가능한 평준화 고등학교는 어디이고 학년별 정원은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 학교 기본정보 등 다른 데이터와는 학교명·지역 이름을 매핑해 이어 쓴다.
limits: 학교 코드 같은 공통 조인 키가 없어 다른 학교 데이터와 연결하려면 학교명·지역명 매칭이 필요하다. 학교 위치나 학군 경계(폴리곤·주소 범위) 정보는 담고 있지 않아 특정 주소가 어느 학교에 배정되는지는 알 수 없다.
