summary_user: 경상남도 시군구별 사설학원 수(2010~2024년)와 독서실 수(2010~2019년)를 개소 단위로 담은 연도별 집계 표로, 연도가 열로 펼쳐진 형태의 작은 CSV 파일(2,113바이트)이다. 학원 입지를 검토하는 사업자나 지역 분석가가 '경남에서 최근 10여 년간 학원 수가 늘어난 시군은 어디인가'처럼 학원가 밀집도와 그 변화를 비교하는 데 쓴다. 전역 조인 키는 없어 시군구 이름을 행정구역 코드에 매핑해야 인구·주택 등 다른 시군구 통계와 이어 쓸 수 있다.
