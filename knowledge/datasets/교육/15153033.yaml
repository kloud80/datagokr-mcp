summary_user: 한국기술교육대학교 학부(과)가 교과목 운영에 쓰는 NCS 능력단위요소를 요소 한 건당 한 행으로 담은 원천 목록으로, 요소명·수준·사용여부·등록 출처(표준·센터·학부·교수)·등록/수정일자를 포함한다(CSV 약 5MB). 교육과정 설계자나 분석가가 "이 학과 교과목이 어떤 NCS 능력단위요소를 어떤 수준으로 다루는가"를 확인하는 데 쓴다. 능력단위식별번호(ncs_unit_cd)를 키로 NCS 능력단위 정보나 같은 기관의 교과목·능력단위 매핑 자료와 이어 쓴다.
description_portal: '해당 자료는 한국기술교육대학교 학부에서 사용하는 NCS능력단위요소정보입니다.주 사용 대상은 한기대 내 학부(과)이며 교과목 운영에 사용하는 정보입니다. 한국기술교육대학교 NCS 능력단위 요소정보는 아래와 같은 데이터 항목을 제공합니다.- 제공항목 : 기관코드,능력단위요소식별번호,능력단위전체식별번호,능력단위식별번호,능력단위요소고유번호,능력단위요소명,능력단위요소수준,사용여부,출처구분,등록일자,수정일자  * 출처구분(등록 출처) : 10 - 표준, 20 - 센터, 30 - 학부 , 40 - 교수* 해당 자료는 당해 학사 교과목 운영 정책에 따라 변동될 수 있으며,연간 갱신 예정입니다.'
