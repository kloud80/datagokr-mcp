summary_user: 국내 9개 국립대 등(강원대·경북대·서울대·부산대 등, 2022년 기준 시범 수집)의 강의계획서를 과목 단위로 담은 파일 데이터로, 연도·대학·단과대학·학과·과목명과 학년·학기·학점·이론/실습시간·과목구분, 학습목표·주교재·부교재·참고자료·선행학습자료가 들어 있다. 수험생·학생이 '이 학과에서는 몇 학년에 어떤 과목을 어떤 교재로 배우나'를 확인하거나, 분석가가 대학 간 같은 전공의 교육과정 구성과 교재를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학·학과 데이터와는 대학교명·학과명 같은 이름 매칭으로만 이어 쓴다.
limits: 대학·학과 코드 같은 공통 식별자가 없어 대학알리미 공시 등과 연결하려면 이름 표기를 맞추는 작업이 필요하다. 포털 설명상 일부 대학만 시범 수집한 자료라 전국 대학 전체의 교육과정을 대표하지 않는다.
