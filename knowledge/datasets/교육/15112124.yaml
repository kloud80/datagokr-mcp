description_portal: 제공하는 데이터는 국내 주요 대학의 연도별 강의계획서 정보를 체계적으로 제공하는 교육 공공데이터입니다. 이 데이터는 강원대학교, 경북대학교, 경상국립대학교, 부산대학교, 서울대학교, 전북대학교, 제주대학교, 충남대학교, 충북대학교 등 2022년 기준 9개 대학의 학과별 강의계획서 내용을 시범적으로 수집하여 제공합니다. 해당 데이터에는 연도, 대학교명, 단과대학교명, 학부 과명, 과목명, 학년, 학기, 학점, 이론시간, 실습시간, 과목구분, 학습목표, 주교재, 부교재, 참고자료, 선행학습자료 등 강의 운영과 관련된 구체적인 정보가 포함되어 있습니다. 수집은 각 대학의 공식 시스템 및 행정 자료를 기반으로 하며, 대학별 강의계획서가 갱신될 때마다 수시로 업데이트되는 1회성 데이터입니다. 데이터의 보유 및 제공 근거는 「고등교육법」과 국가 교육정보화 정책에 따라 한국교육학술정보원이 고등교육 혁신과 학사행정 지원을 위해 수행하는 법적·행정적 역할에 기반합니다. 이 데이터는 대학의 교육과정 분석, 강의계획 비교, 학사행정 지원, 교육정책 수립, 진로 및 전공 선택 지원, 학술연구, 교육콘텐츠 개발 등 다양한 분야에서 활용될 수 있습니다.
