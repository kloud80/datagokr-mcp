summary_user: 인천광역시 중구 안에 있는 키즈카페를 업소 한 곳당 한 행으로 담은 목록 파일로, 업종·업소명·도로명 소재지·전화번호·데이터기준일자를 담는다(파일 크기 467바이트로 소규모). 아이와 갈 만한 동네 키즈카페의 위치와 연락처를 찾는 가족이나, 중구 안 키즈카페 분포를 살피려는 사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
