summary_user: 전국 특수학교 196곳을 학교 한 곳당 한 행으로 담은 현황 파일로, 시도·설립별·장애영역·교장명·연락처·주소·누리집을 포함한다. 학부모나 지자체 담당자가 우리 지역에 어떤 장애영역의 특수학교가 있고 어디로 연락해야 하는지 찾을 때 쓴다. 조인 키는 주소(address)뿐이라 같은 주소 표기를 가진 다른 학교 기본정보나 시설 데이터와 주소 기준으로 이어 쓴다.
description_portal: 이 문서는 국내 특수교육기관 현황을 상세히 다루고 있으며, 시도 및 설립 형태별로 분류된 특수학교들의 장애영역과 관련된 정보를 포함합니다. 시각, 청각, 지적, 지체, 정서 장애 등 다양한 장애 유형을 고려하고 있으며 각 학교의 교장명, 연락처, 주소 및 누리집 정보 등이 체계적으로 정리되어 있어 특수교육 현장의 실태를 이해하는 데 매우 유용합니다. 미리보기에서는 서울과 부산, 대구 등 주요 도시의 특수학교 정보를 일부 확인할 수 있으며, 주기적으로 업데이트되는 데이터와 과거 자료와의 비교도 가능합니다. 이를 통해 특수교육 관련 정책 수립 및 연구에 중요한 기초 자료로 활용될 수 있습니다.특수교육 기관의 현황으로 시도, 설립별, 장애영역, 교장명, 인가년월일, 개교년월일, 교장실 전화번호, 행정실 전화번호, 교무실 전화번호, 팩스, 우편번호, 주소, 누리집 주소를 포함
