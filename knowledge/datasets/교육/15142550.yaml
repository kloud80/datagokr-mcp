description_portal: '"인천광역시교육청_시군구별 늘봄학교 운영 현황" 데이터는 인천광역시 내 각 시군구별로 초등학교 1학년부터 6학년까지의 늘봄학교(초등돌봄교실) 수용 현황을 연도별로 정리한 자료입니다. 주요 제공 정보는 2020년부터 2026년까지의 시군구별, 학년별 초등돌봄교실 수용 인원, 운영 학교 수, 돌봄 프로그램 운영 형태 등이며, 지역별 돌봄 수요와 공급 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 이 데이터는 인천광역시교육청이 각 학교 및 교육지원청에서 제출받은 내부 자료를 바탕으로 수집·정리하며, 「초·중등교육법」 및 관련 교육청 지침에 근거해 보유 및 관리됩니다. 데이터는 연 1회 정기적으로 업데이트되며, 학교 신설·폐지, 돌봄교실 운영 변화 등 주요 변동사항이 발생할 때마다 최신화됩니다.이 자료는 지역별 돌봄 정책 수립, 돌봄교실 확충 계획, 학부모와 학생의 돌봄 서비스 이용 안내, 행정구역별 교육자원 배분, 지역사회 복지정책 연계 등 다양한 분야에서 활용됩니다. 특히 방과후 돌봄 수요가 높은 지역의 정책적 지원 근거 자료로 매우 중요하게 쓰입니다.'
