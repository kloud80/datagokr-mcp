description_portal: 동작구 소재 유치원의 각종 보험 가입 현황 정보를 제공합니다.해당 정보는 유치원알리미(https://e-childschoolinfo.moe.go.kr) 및 한국교육학술정보원에서 제공되는 자료입니다.데이터에는 각 주소, 설립유형 및 유치원의 명칭이 포함되어 있어 기관별 비교가 가능합니다.가입보험 항목은 유치원에서 제공하는 보험 종류를 보여줍니다. 이를 통해, 화재보험 등 다양한 보험 유형을 확인할 수 있습니다.가입한 보험 업체명은 실제 계약을 체결한 보험사의 정보를 제공합니다.
