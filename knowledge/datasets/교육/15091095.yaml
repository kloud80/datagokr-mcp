description_portal: 한국기술교육대학교 온라인평생교육원이 운영하는 스마트 직업훈련 플랫폼(STEP)은 전국의 직업훈련기관, 산업체, 공공기관, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공하는 국가 직업능력 개발 플랫폼입니다. 이 플랫폼은 고용노동부의 정책 방향에 따라 직업훈련의 품질 향상과 교육 효과의 극대화를 목표로 설계되었으며, 특히 다양한 교육 과정을 체계적으로 관리하고 운영하기 위해 과목과 운영 부서 간의 매핑 정보를 정리한 테이블을 관리하고 있습니다.과목-부서 매핑 테이블은 STEP LMS 내에서 개설된 각 온라인 교육 과정이 어떤 부서에 의해 운영되고 있는지를 명확히 기록한 데이터 구조입니다. 이 테이블은 교육 콘텐츠의 등록, 유지보수, 학습자 지원, 평가 관리 등 다양한 기능을 담당하는 부서와 교육 과정 간의 관계를 정의하며, 시스템 운영의 효율성과 책임 소재의 명확화를 위해 필수적으로 관리됩니다.
