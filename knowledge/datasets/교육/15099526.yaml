description_portal: '2026년 한국해양수산연수원 부산에서 실시하는 안전 교육, 자격취득 교육, 직무교육, 수탁교육, 기타직무교육 일정 정보에 관한 데이터입니다.연수생의 교육 신청과 일정 조율, 교육기관의 운영계획 수립, 기업의 인재교육 계획 등 다양한 활용이 가능합니다.또한 시기별·과정별 교육 수요 분석, 과정 운영 최적화, 직무 역량 강화 및 산업 수요 대응형 교육 설계 등에도 기초자료로 활용되며, 해양인력 양성과 해기직 직업훈련 정책 수립에 기여할 수 있는 핵심 데이터입니다.※ 부산본원- 우편번호 : 49111- 주소 : 부산광역시 영도구 해양로 367(동삼동)- 콜센터 번호 : 1899-3600※ 부산용당캠퍼스- 우편번호 : 48562- 주소 : 부산광역시 남구 신선로 356번길 93(용당동)- 콜센터 번호 : 1899-3600* 교육일정에 대한 자세한 사항은 한국해양수산연수원 교육예약시스템 - 공지사항 에서 확인하시면 됩니다. 일정 차이가 있을경우 교육예약시스템 - 공지사항 일정을 우선시 합니다.(https://edu.seaman.or.kr/eduRsv/cmm/cmmBbs/bbsNoticeView.do)'
