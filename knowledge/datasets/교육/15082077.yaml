description_portal: 부산 인재개발원의 교육과정평가정보입니다. 과정명, 시험지명, 시험시작일, 시험종료일, 평가에 대한 비율, 정답확인유형,  시험응시가능횟수 등을 제공합니다.부산인재개발원은 미래변화에 능동적으로 대응하고, 글로벌 선도도시 부산을 견인할 역량 있는 공직인재를 양성하는 전문 교육기관으로서의 중추적인 역할을 수행하고 있습니다.앞으로도 「행복한 미래도시, 그린스마트 부산 견인 인재양성」 이라는 비전 아래, 4차 산업혁명 및 기후변화 시대의 급변하는 행정환경에 유연하게 대응하여, 시정현안과 업무성과에 기여하는 교육프로그램을 개발하여 전문역량을 보유한 창의적 인재를 육성하고 있습니다.
