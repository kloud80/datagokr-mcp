description_portal: ‘서울시 은평구 유치원 건물현황’ 데이터는 은평구 관내 국·공·사립 유치원의 물리적 시설 정보를 유치원알리미에서 수집 · 가공해 공개하고 있는 공공데이터입니다. CSV·JSON 파일과 REST API 형태로 제공되며 학년도 종료 후 매년 자동 갱신되어 신축·증축·용도 변경 등의 변동 사항이 반영됩니다. 각 유치원별로 교육청명, 교육지원청명, 유치원 코드, 유치원명, 설립 유형(공립·사립), 건축년도, 건물 층수, 건물 전용면적, 대지 총면적, 공시 차수, 주소 등의 정보를 포함합니다.이를 통해 은평구 유치원의 위치, 설립 주체별 분포, 건축연도에 따른 시설 현황 및 교육환경 규모 등을 확인할 수 있으며, 교육 정책 수립, 시설 안전 관리, 지역별 교육환경 분석에 활용할 수 있습니다. 지자체는 지역별 건축연도 분포와 대지면적 데이터를 GIS로 시각화해 보육 수요 증가 지역의 신규 부지 확보나 재난 취약 시설 관리 계획을 세우는 데 활용합니다. 연구자는 건물 노후도와 교육 품질·학생 안전 사고 발생률 간 상관관계를 분석할 수 있어 학제 간 정책 연구에도 유용합니다.
