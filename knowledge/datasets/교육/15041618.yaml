description_portal: "한국콘텐츠진흥원에서 운영하는 에듀코카의 열린강좌 정보에 관하여 제공하고 있습니다. 이 데이터는 다양한 콘텐츠 교육 과정 진행에 대한 정보를 포함하고 있으며, 일반 대중과 학습자들이 보다 쉽고 효율적으로 교육 프로그램에 참여할 수 있도록 돕기 위하여 개방되었습니다. 열린강좌 정보는 강의명, 강의시간, 장르, 제작 정보 및 조회수 등의 세부 정보를 포함하고 있어, 교육 기회를 찾는 이들에게 유용합니다. 또한, 본 데이터는 콘텐츠 산업 분야의 교육 및 연구에 활용될 수 있으며, 관련 콘텐츠의 발전에도 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: '일련번호'(숫자형), '영상이미지'(문자형), '영상 홈페이지(VODURL)'(문자형), '강좌명'(문자형), '강의시간'(문자형), '장르'(문자형), '제작'(문자형), '최초등록일'(날짜형), '조회수'(숫자형), '제작년도'(숫자형), '과정소속분야'(문자형) 등 다수의 열로 구성되어 있습니다."
