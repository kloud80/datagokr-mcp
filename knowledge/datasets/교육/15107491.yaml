description_portal: 복권기금 꿈사다리 우수 장학사업은 복권기금을 재원으로 저소득층 우수 초·중·고생을 발굴(2025년부터 초등학생 선발 확대), 대학까지 연계지원하는 국가장학제도로서, 꿈 장학금과 SOS 장학금의 2가지 유형이 있습니다.SOS장학금은 「긴급복지지원법」 제2조에 해당하거나 이에 준하는 긴급 위기 상황의 발생으로 학업 지속이 곤란한 학생을 선발하여 10개월 간 한시적으로 장학금을 지원합니다.※ 상세 정보는 한국장학재단 홈페이지(https://www.kosaf.go.kr/ko/scholar.do?pg=scholarship05_17_01)를 참고바랍니다.
