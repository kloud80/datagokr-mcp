description_portal: 경기도 내 초등학교, 중학교, 고등학교의  2025년 학사일정을 수록한 데이터입니다. 이 데이터는 각급 학교에서 수집된 학사 일정을 경기도교육청에서 연 1회 취합하여 관리하며, 공공데이터포털을 통해 XLSX 파일 형태로 무료로 제공합니다. 데이터는 경기도교육청 소속 학교의 졸업식 일정이 포함되어 있어, 학교별, 지역별 졸업예정일을 한눈에 파악할 수 있습니다. "경기도교육청_경기도 학사 일정" 데이터는 교육행정, 정책 연구, 학부모 및 학생의 일정 관리, 언론 보도, 지역사회 행사 기획 등 다양한 분야에서 활용될 수 있습니다. 학교별 전체 학사일정은 나이스 교육정보개방포털(https://open.neis.go.kr/) 내 "학사일정"에서 확인할 수 있습니다.
