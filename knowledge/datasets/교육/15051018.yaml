description_portal: 이 데이터는 교육부에서 제공하는 특수교육 통계 자료로, 전국 시도교육청별 특수교육 대상자 수, 특수학교 및 특수학급 수 등의 정보를 포함하고 있습니다. 자료는 자동으로 갱신됩니다. 이 통계는 특수교육 정책 수립 및 연구에 활용될 수 있으며, 특수교육 대상 학생들의 교육 환경 개선을 위한 기초 자료로 사용될 수 있습니다. 또한, 교육 관계자 및 연구자들이 특수교육 현황을 파악하고 분석하는 데 유용한 자료입니다.(제공데이터)년도별 특수교육 대상자 수, 특수학교 및 특수학급 수 등 특수교육 관련 시도교육청별 현황 등 특수교육 관련 통계자료현황 자료 다운로드 가능.
