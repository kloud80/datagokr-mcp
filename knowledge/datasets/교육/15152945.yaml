summary_user: 경기도 사이버도서관에서 도서가 대출된 기록을 대출 건별로 담은 원천 데이터로, 도서관명·대출일시·반납일시·등록번호·서명·저자·출판사·출판연도를 포함하며 범위는 경기도 단위의 비공간 자료다. 도서관 운영자나 독서정책 분석가가 "특정 시기에 어떤 책과 작가가 많이 대출됐고, 도서관별 자료 활용도는 어떻게 다른가"를 따질 때 쓴다. 전역 조인 키는 없어서 도서관부호(librry_no)나 도서관명, 서명·저자 같은 이름 매핑으로만 다른 도서관·도서 자료와 잇는다.
description_portal: 이 데이터는 경기도 내 사이버도서관을 통해 도서가 대출된 기록을 모은 자료로, 각 대출 건에 대해 도서관명, 대출일시, 반납일시, 등록번호, 도서명(서명), 저자, 출판사, 출판연도 등의 정보를 포함합니다. 해당 데이터는 경기도에 속한 여러 시·군 도서관의 실제 대출 내역을 기반으로 하며, 자료를 통해 특정 도서의 인기 여부, 작가별 대출 빈도, 출판 연도별 수요 변화 등을 분석할 수 있습니다. 또한 도서관별 자료 활용도나 특정 시기의 대출 경향 파악 등 독서문화 확산 정책 수립에도 활용 가능합니다. 도서관부호는 각 도서관의 고유 식별자로서 시스템 상에서의 분류에 사용됩니다.
