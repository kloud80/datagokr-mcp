description_portal: 자료제공일 현재 제주특별자치도교육청 관내 비영리 및 공익 법인 현황 데이터입니다. 제공정보는 총 5가지로 법인명, 소재지, 구분, 설립목적, 설립허가일입니다. 법인명은 해당 법인을 의미하고, 소재지는 제주특별자치도 내 행정구역 구분에 따른 제주시와 서귀포시를 나타냅니다. 구분항목은 재단법인, 사단법인, 비영리법인의 구분을 뜻하고, 설립목적은 장학, 학술, 기타로 구분되어 있습니다. 설립허가일은 법인의 설립허가일자를 나타냅니다. 자세한 내용은 제주특별자치도교육청 누리집(www.jje.go.kr) 정보공개 > 평생교육 > 비영리(공익)법인/학원/평생교육시설 메뉴에서 확인할 수 있습니다.
