summary_user: 1980~2025년 4년제 일반대학의 학교수·학생수를 연도별로 시도(서울~제주 17개 시도와 합계) 열에 나눠 담은 전국 단위 집계 파일이며, 포털 설명상 설립별 교원수·학교수·학생수 표도 함께 있다. 교육 분석가나 지역 정책 담당자가 "지난 40여 년간 우리 시도의 4년제 대학 수와 재학생 수가 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어서 다른 데이터와는 연도와 시도 이름을 맞춰 붙여야 하며, 개별 학교 단위로는 연결되지 않는다.
description_portal: 1980-2025 4년제 일반대학의 설립별(교원수, 학교수, 학생수), 시도별(학교수, 학생수) 자료를 제공합니다.
