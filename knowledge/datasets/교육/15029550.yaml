description_portal: 강원특별자치도교육청 관내 교습소 관련 현황 자료입니다.본 자료는 교습소명, 교습소주소, 정원합계, 교습과정, 교습과목,교습비 등교습소 관련한 공개자료를 제공하고 있으며,기준은 2025년 4월 1일자 현황을 게시한 자료입니다.매년 조사 후 취합한 자료를 근거로 현황을 업데이트하고있으며 이를 통해 최신 자료를 제공하고자합니다.본 자료는 강원특별자치도교육청 홈페이지에서도 확인할 수 있으며, 나이스 학원서비스에서도 교습소, 교습비등 관련한 정보를 확인 가능한 동일자료입니다.
