description_portal: '서울특별시 마포구 마포중앙도서관 장서 중 상위 500개 대출도서 목록에 대한 정보입니다. 이 데이터에는 대출횟수가 많은 순서대로 도서명, 저자명(글, 그림), 발행자 및  출판사, 등록번호 및 청구기호 등의 세부 정보 등도 함께 제공됩니다. 이 데이터를 통해 도서관은 이용자들의 독서 트렌드를 파악하고 인기 도서 목록을 효율적으로 관리할 수 있으며, 시민들은 관심 있는 분야의 추천 도서를 쉽게 찾고 대출할 수 있습니다. 또한, 지역 사회의 독서 문화 활성화와 맞춤형 독서 프로그램 개발에 기여하여, 전 세대가 풍부한 독서 경험을 누릴 수 있도록 지원합니다.※데이터의 시간적 범위 : 2024. 8. 1. ~ 2025. 7. 30.'
