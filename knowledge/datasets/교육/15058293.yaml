summary_user: 경기도 내 각급 학교별로 체육관·강당·수영장·진로상담실 수와 기숙사 재실 인원을 기준연도 단위로 담은 학교 단위 시설 현황 데이터이며, 지역교육청·시군·학교급·설립유형 구분이 함께 들어 있다. 교육청이나 분석가가 '어느 시군·교육지원청에 체육관이나 진로상담실이 없는 학교가 몰려 있는가'처럼 지역별·학교 유형별 시설 격차를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)나 학교명·시군코드를 이름·코드 매핑해 학교 기본정보나 교원·학생 통계에 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 초·중·고등학교를 포함한 각급 학교의 교육활동 지원을 위한 시설 현황을 제공하며, 학교별 체육관 수, 강당 수, 기숙사 재실 인원 수, 수영장 수, 진로상담실 수 등의 항목으로 구성됩니다. 지역교육청명, 시군명, 설립유형명, 학교급명 등 교육 행정 구분 정보도 함께 포함되어 있어 지역별, 학교 유형별 분석이 가능합니다. 체육관은 전용 체육관 또는 강당 겸용 체육관을 포함하며, 강당은 집회 목적의 공간으로 분류됩니다. 기숙사 재실 인원은 실제 수용된 학생 수를 기준으로 하며, 각 학교의 교육 인프라 수준과 학생 복지 지원 환경을 평가하는 데 활용될 수 있습니다. 해당 데이터는 학교 시설 자원의 분포 현황을 파악하거나 교육 정책 수립, 학교 기반 시설 확충 계획 수립에 활용도가 높습니다.
