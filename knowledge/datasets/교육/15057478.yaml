summary_user: 경기도 내 무료직업소개소를 사업장 한 곳당 한 행으로 담은 인허가 현황 자료로, 사업장명·인허가일·영업상태·폐업일·전화번호·지번/도로명 주소·위경도 좌표를 포함한다. 구직자나 복지 담당자가 '우리 시군에서 지금 영업 중인 무료직업소개소는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 시군별 고용알선 기관 분포와 접근성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시군 코드(SIGUN_CD)나 주소·사업장명을 매핑해 다른 경기도 인허가 데이터와 잇거나, 위경도 좌표로 지도·공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 무료직업소개소의 인허가 현황을 정리한 자료로, 구직자와 구인자를 연결하는 고용 알선 기관의 행정 및 공간 정보를 포함합니다. 무료직업소개소는 공공기관, 자활기관, 고령자고용기관 등이 운영 주체인 경우가 많으며, 구직자와 구인자 간의 고용계약이 성립되도록 무료로 알선하는 비영리 기반의 직업중개 서비스입니다. 이 데이터는 지역별 고용 서비스 접근성 분석, 취약계층 고용지원 인프라 파악, 고용 복지 정책 수립 등 다양한 공공정책 및 사회서비스 개발에 유용하게 활용될 수 있습니다.
