summary_user: 전북특별자치도의 유치원·초·중·고등학교·특수학교를 학교급별(구분)로 나누어 국립·공립·사립별 학교 수, 학생 수, 교원 수를 담은 집계표로, 개별 학교 단위가 아닌 소규모 CSV 파일(303 bytes)입니다. 교육 정책 담당자나 연구자가 '전북에서 사립 비중이 높은 학교급은 어디이고 교원 1인당 학생 수는 설립유형별로 어떻게 다른가'를 확인하는 데 쓴다. 전역 조인 키가 없어 학교코드로 다른 데이터에 붙일 수 없고, 학교급 이름을 맞추거나 같은 기관(전북) 자료와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 내 유치원부터 초·중·고등학교 및 특수학교까지 전체 교육 기관의 총괄 현황을 정리한 통계 데이터입니다. 이 자료는 각 학교급별로 국립, 공립, 사립 유형에 따라 학교 수, 총 학생 수, 그리고 교원 수를 상세히 구분하여 보여줍니다. 이 데이터는 지역 교육 시스템의 전체적인 규모와 구조를 한눈에 파악할 수 있는 핵심적인 지표입니다. 교육 정책 입안자나 연구자들은 이를 통해 학생 수 변동에 따른 교원 수급 계획을 수립하거나, 공교육과 사교육의 비중을 분석하는 등 장기적인 교육 발전 계획을 위한 기초 자료로 활용할 수 있습니다.
