summary_user: 서울 성동구에 개설된 학원과 교습소를 업소 단위로 담으며, 학원지정번호·학원명·학원/교습소 구분, 설립·등록일과 등록상태, 휴원 기간, 정원, 분야(보습·외국어·예체능 등)와 교습과정, 수강료, 도로명주소를 포함한다. 학부모가 성동구에서 특정 분야 학원이 어디에 몰려 있고 수강료가 얼마인지 찾거나, 분석가가 동네별 학원 밀집도를 학원 상권과 주택 수요 신호로 볼 때 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 찾지 못했으므로, 행정구역명이나 도로명주소를 매핑하거나 같은 기관 코드로 다른 데이터와 잇는다.
description_portal: 본 데이터는 서울특별시 성동구 내에 개설되어 운영 중인 학원 및 교습소의 현황 정보를 체계적으로 제공하기 위해 구축되었습니다. 학원 및 교습소는 지역사회의 학력 신장, 진로지도, 예체능 교육, 자기개발 등 다양한 교육 수요를 충족시키는 핵심 기관이며, 업소별 위치 및 행정 이력 관리의 투명성이 중요합니다. 데이터에는 행정구역명(소재지), 학원/교습소 구분, 학원지정번호(고유 식별 번호), 학원명, 도로명주소, 도로명상세주소, 분야명(보습, 외국어, 예체능, 정보, 입시 등) 등 주요 항목이 포함되어, 각 교육기관의 소속, 위치, 행정정보, 운영 분야를 구체적으로 파악할 수 있습니다. 성동구청과 관할 교육청이 정기적으로 현황 점검 및 자료 갱신을 통해 데이터의 신뢰성과 최신성을 확보하고 있습니다. 본 데이터는 학원 및 교습소 현황 분석, 교육 정책 수립, 학습자용 기관 탐색, 상권 및 분야별 통계분석 등 각종 교육 및 정책 연구에 실질적으로 활용됩니다. 데이터는 정기적으로 최신화됩니다.
