summary_user: KCI(한국학술지인용색인)에 등록된 국내 학술지를 한 행에 한 종씩 담은 목록 파일로, 전자·종이 ISSN, 국문·외국어 학술지명, 등재 구분, 연구분야, 창간년도, 발행간기, 사용언어, 발행기관, 부설연구소 소속 대학, 기관 구분을 포함한다(전국 범위, CSV 약 54만 바이트). 연구자나 대학 연구지원 담당자가 "특정 연구분야의 등재 학술지는 어떤 것이 있고 어느 기관이 발행하나"를 확인하거나, 투고할 학술지를 고를 때 쓴다. 전자식·종이식 ISSN을 키로 논문·인용 데이터 등 ISSN을 가진 다른 학술 자료와 잇는다. 학교코드 같은 표준 기관 키는 없어서 대학 통계와는 소속 대학명으로만 맞춰 볼 수 있다.
description_portal: KCI학술지정보 데이터는 한국학술지인용색인(KCI) 시스템에 등록된 국내 학술지의 주요 정보를 제공합니다. 전자 및 종이 국제표준연속간행물번호(ISSN), 학술지명, 등재 구분, 연구 분야, 창간년도, 발행 간기, 사용 언어, 발행기관, 부설연구소, 소속 대학, 기관 구분 등의 다양한 세부 항목이 포함되어 있습니다. 이 자료는 학술지 현황 파악, 연구 분야별 학술지 비교, 연구자 및 기관의 학술 활동 분석, 학술지 선정 등 다양한 연구 및 실무에 활용할 수 있습니다. 연간 주기로 업데이트되어, 수정일을 기준으로 최근 정보를 확인할 수 있습니다.
