summary_user: 한국산업인력공단이 원격훈련 모니터링을 위해 수집한 데이터 중 운영 중인 원격훈련 과정을 과정 단위로 담으며, 과정ID·훈련과정명·총 교육시간·유효 여부·등록일시가 들어 있고 범위는 전국이다. 직업훈련 분석가나 훈련기관 담당자가 '현재 운영 중인 원격훈련 과정은 무엇이고 과정별 교육시간은 얼마인가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 과정ID나 과정명을 같은 기관의 다른 원격훈련 데이터와 맞추는 방식으로만 연결한다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 직접 결합하기 어렵고, 이름이나 코드를 직접 매핑해야 한다. 지역 단위 구분이 없는 전국·비공간 데이터라서 지역별 분석에는 쓰지 못한다. 호출하려면 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하며, 개발계정은 하루 5,000회까지 호출할 수 있다.
