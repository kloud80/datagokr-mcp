summary_user: 제주특별자치도 내 유치원·초등학교·중학교·고등학교·특수학교를 학교 한 곳당 한 행으로 담은 학교 기본정보 파일로, 학교급·설립구분(국립·공립·사립)·제주시/서귀포시 구분·남녀공학 여부·개교일자·주소·연락처·홈페이지를 담는다. 학부모나 분석가가 "서귀포시에 있는 공립 중학교는 어디이고 연락처는 무엇인가" 같은 질문에 답하거나 제주 지역 학교 목록을 만들 때 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어, 교원·학생·학급 통계나 다른 학교 데이터와는 학교명·주소를 맞춰 붙여야 한다.
description_portal: 제주특별자치도내에 위치한 유치원, 초등학교, 중학교, 고등학교, 특수학교 등 학교현황을 제공하는 데이터입니다. 제공항목은 11개로 학교급, 설립구분, 학교명, 자치구, 남녀공학여부, 개교일자, 우편번호, 학교주소, 학교 전화번호, 학교 팩스번호, 학교 홈페이지 입니다. 학교급은 유치원, 초등학교, 중학교, 고등학교, 특수학교 구분을 의미하고 설립구분은 국립, 공립, 사립 구분을 뜻합니다. 자치구는 제주특별자치도 내 학교소재지를 제주시, 서귀포시의 행정구역으로 나누어 확인할 수 있습니다.자세한 사항은 제주특별자치도교육청 교육통계포털(www.jje.go.kr/statistics)에서 확인할 수 있습니다.
