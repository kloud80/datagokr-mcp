summary_user: 전국 국공사립 대학의 교육용 토지 면적, 그중 미사용 토지 면적, 미사용 토지 비율을 학교·캠퍼스 단위로 조사연도별로 담은 집계 파일(csv, 약 38KB)이다. 대학 정책 분석가나 지역 개발 담당자가 "어느 대학 캠퍼스에 교육용으로 쓰지 않는 토지가 얼마나 남아 있나"를 설립구분·지역·학급(대학·전문대학·원격대학)별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키(학교코드 등)가 없어 다른 대학알리미·대학재정 자료와는 학교명·캠퍼스명 문자열을 맞춰 이어 써야 한다.
description_portal: 한국사학진흥재단_대학재정알리미 교육용 토지 추가 활용 가능 비율은 한국사학진흥재단의 국공사립대학 교육용 시설 현황 집계를 통해 산출된 자료입니다.교육용 토지 추가 활용 가능 비율 데이터를 통해 대학의 교육용 토지 면적과 미사용 토지 면적, 교육용 토지 중 미사용 토지 비율을 학교별, 캠퍼스별, 설립구분별(국립, 공립, 사립), 지역별, 학급별(대학, 전문대학, 원격대학), 학종별로 확인 가능합니다.해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.
