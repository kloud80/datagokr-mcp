description_portal: '○ 통계개요* 통계명 : 외국인학교 현황* 통계종류 : "교육기본통계조사규정"에 의거 외국인학교 현황을 제공하는 지정·보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적ㆍ종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획ㆍ시행ㆍ평가ㆍ연구 등에 주요 정보를제공, 국내교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 교육청 → 서울특별시 교육청 → 한국교육개발원* 공표주기 : 정기(매년, 4월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 외국인학교의 학급ㆍ학생ㆍ교원수 현황 등○ 용어설명* 외국인학교 : 국내에 거주하는 외국인의 자제들에게 본국의 교육을 실시하기 위하여설치된 학교로 서울소재 외국인 학교를 총칭○ 기 타* 2007년부터 학교별 공표 안됨(통계법 제33조 및 시행령 50조에 의한 "비밀의 보호")'
