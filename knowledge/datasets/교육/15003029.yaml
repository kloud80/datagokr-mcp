summary_user: 국가기술자격 종목·등급별로 회차마다 필기시험 접수 기간·시험일·합격 발표일, 응시자격 서류 제출 기간, 실기시험 접수·시행 기간·합격 발표일을 담은 전국 단위 시험 일정 정보다. 수험생이 "올해 이 자격증 필기 접수는 언제 열리고 실기 합격 발표는 언제인가"를 확인하거나, 교육기관이 강좌 일정을 시험 일정에 맞출 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자격 데이터(합격률·자격 보유 현황, 채용·인허가 요건)와는 종목명 매핑이나 같은 기관의 코드로만 연결한다.
limits: 종목·회차를 다른 데이터와 바로 묶을 공통 코드가 없어 이름 매핑이 필요하다. 국가기술자격 시험 일정만 다루며, 국가자격이 아닌 민간·평생교육 자격은 범위 밖이다. 개발계정은 하루 1,000회로 호출이 제한된다.
