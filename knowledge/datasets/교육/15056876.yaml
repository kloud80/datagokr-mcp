summary_user: 한국산업인력공단 CQ-Net의 과정평가형·일학습병행자격 종목 목록과 상세정보, 시험일정을 전국 범위로 담는 조회 API이며, 종목 단위로 종목코드·종목명(영문명 포함)·등급·직무분야·시행기관·관리기관을 제공한다. 직업훈련 과정을 거쳐 자격을 따려는 수험생이나 훈련기관이 '어떤 종목이 과정평가형으로 운영되고 시험일이 언제인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 종목코드(jmCd)·종목명이나 등급명으로 국가기술자격 종목 정보 등 같은 기관의 다른 자격 데이터와 이름·코드 매핑으로만 잇는다.
limits: 학교코드 같은 전역 조인 키가 없어 학교 기본정보·교육 통계와 직접 결합되지 않고, 같은 기관 코드나 이름 매핑으로만 연결된다. 비공간 데이터라 지역별 분석에는 쓰지 못하며, 개발계정은 하루 1,000회로 호출이 제한된다.
