summary_user: 경기도 학교별로 연도마다 동복·하복 각각의 교복 구매 방식(학교주관구매·공동구매·개별구매·해당없음 여부)과 교복 1벌 평균 계약 가격을 담은 학교 단위 현황 데이터다. 학부모나 교육 분석가가 '우리 지역 학교들의 교복 구매 방식과 1벌 단가가 학교별로 어떻게 다른가'를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군 코드·학교명·정보공시용 학교코드(INFO_PBLNTF_SCHOOL_CD)를 이름·코드 매핑하거나 같은 기관(경기도) 데이터의 코드로만 학교 기본정보·통계와 이어 붙인다.
description_portal: '경기도 교복 구매 유형 및 단가 현황입니다. 지역명, 학교명, 학교주관구매여부, 공동구매여부 등의 정보를 제공합니다.학교주관구매 : 학교가 주관하여 입찰 방식 등에 의해 업체를 선정하고 학생의 교복구매비를 수납하여 학교회계로 처리·집행하는 교복구매·제공방식공동구매 : 교복구매추진위원회가 입찰 방식에 의해 업체를 선정하여 신입생이 교복을 구매할 수 있도록 안내하되, 개별적인 구매권도 인정하는 방식개별구매 : 신입생들이 각기 다른 생산업체의 교복을 자율적으로 구매하는 방식해당없음 : 학교에서 동복과 하복 중 한가지만 착용하는 경우, 선택가능교복(평균)가격 : 학교주관구매나 공동구매의 경우 교복 1벌에 대한 계약 금액, 개별구매시에는 가격 없음'
