description_portal: '대구광역시 동구 관내 도서관의 문화강좌에 대한 데이터로 강좌명, 강사명, 대상, 운영요일, 장소, 수강료, 도서관명을 제공합니다. 이는 동구 관내 공공도서관에서 진행중인  문화·교육 프로그램 정보를 담고 있으며  모바일·웹 기반 문화강좌 안내, 공공 교육 통계 분석 및 프로그램 기획, 타 지역 비교 활용 등 다양한 목적으로 활용 가능합니다.데이터 주요 항목강좌명: 예를 들어 ‘영어독서능력향상’, ‘체험형 동화구연’, ‘휴먼라이브러리’ 등 다양한 독서문화 프로그램이 포함됨 강사명: 각 강좌마다 분야별 전문가가 담당하도록 구성됨 대상: 어린이, 청소년, 일반성인 등 참여자 연령층 또는 수요자 그룹별로 구분됨 .운영요일: 주로 상·하반기(3–6월, 9–11월), 방학특강(7–8월, 1–2월)에 걸쳐 매주 일정하게 운영됨 장소: 문화강좌는 각 도서관 내 어린이실, 강의실, 프로그램실 등에서 진행됩니다 수강료: 기본적으로 무료이며, 교재나 재료비는 별도로 부담하게 됩니다 도서관명: 안심도서관, 신천도서관 동구 관내 도서관이 포함됩니다.'
