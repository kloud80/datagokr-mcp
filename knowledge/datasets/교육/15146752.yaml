description_portal: 본 데이터는 서울특별시 중구 관내 유치원에서 운영하는 방과후 교육 프로그램의 편성 및 운영 현황을 수록한 자료입니다. 주요 항목으로는 프로그램 운영 여부, 운영 시간, 참여 아동 수, 담당 교사 수, 프로그램 종류 및 교육 내용 등이 포함됩니다. 해당 정보는 유치원별로 연도 단위로 수집되며, 공립 및 사립 유치원 구분, 도시 및 농촌 지역 분류, 자체 운영 또는 외부 위탁 여부 등 다양한 변수와 함께 제공됩니다. 이 데이터는 교육 행정기관이 방과후 과정의 효과성과 지역 간 격차를 분석하고 정책 수립에 활용할 수 있도록 지원합니다. 또한 학부모와 교육 관계자가 유치원의 운영 실태를 파악하고 자녀 교육에 참고할 수 있는 기초 자료로 활용되며, 방과후 과정의 다양성과 접근성을 평가함으로써 교육 기회의 형평성을 제고하는 데 기여합니다.※ 본 저작물은 유치원알리미(https://e-childschoolinfo.moe.go.kr)에서 제공되는 자료입니다.
