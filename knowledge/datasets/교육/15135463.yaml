summary_user: 전국 국공사립대학 산학협력단의 운영계산서를 학교·회계연도 단위로 담은 결산 집계 파일로, 산학협력수익(연구·교육운영·기술이전·설비사용료 등), 지원금수익, 간접비수익, 전입및기부금수익 등을 계정 단계별로 나눠 천원 단위로 싣는다. 대학 재정 분석가나 지역 산학협력 담당자가 '어느 대학 산학협력단이 정부·산업체 연구수익과 기술이전수익을 얼마나 거두는가'를 학교별·설립구분별·지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대학 공시 자료와는 학교명·법인명과 회계연도를 맞춰 이름 매핑으로 이어 써야 한다.
description_portal: '한국사학진흥재단_산학협력단 운영계산서는 한국사학진흥재단의 회계연도별 국공사립대학 산학협력단 예결산 집계를 통해 산출된 자료입니다.산학협력단 운영계산서 자료를 통해 산학협력단별 산학협력수익, 지원금수익, 간접비수익, 관리운영비 등의 세부내역을 학교별, 설립구분별, 학급별, 학종별, 지역별로 확인할 수 있습니다.(결산 미제출교 제외, 단위: 천원)해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.'
