description_portal: '국외인적자원관리시스템은 인재정보를 체계적으로 관리하고 제공하는 플랫폼으로, 국가 인재 개발 정책 수립과 인재 활용에 중요한 역할을 합니다. 이 시스템을 통해 재외동포교육, 한국정부국비유학생, 우수교환학생지원, 외국정부초청장학생 등 다양한 장학생증명서를 발급하며, 사용자는 증명서 오른쪽 상단의 문서확인번호를 입력하여 진위확인서비스를 이용할 수 있습니다. 이는 한일교류사업 등 다채로운 교육사업의 투명성과 신뢰성을 높이는 데 기여합니다.- 증명서 발급 대상: 재외동포교육, 한국정부국비유학생, 한일공동이공계획부유학생, 정부초청외국인장학생, 우수교환학생지원, 우수자비유학지원, 외국정부초청장학생, 한일교류사업- 방법: 증명서의 오른쪽 상단 문서확인번호 (저NIIED) 를 입력하여 진위확인'
