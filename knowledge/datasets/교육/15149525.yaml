description_portal: 푸른등대 기부장학금은 정부 학자금지원의  사각지대를 보완하여 균등한 교육기회를 제공하기 위해, 기부를 받아 미래인재로 성장할 수 있도록 생활비 장학금을 지원하는 사업으로매년 홈페이지에서(1학기, 2학기 등) 신청을 받아 선발하고 있습니다. 본 자료는 대학생 및 대학원생의 푸른등대 기부장학금 지원현황(수혜연도, 수혜학기, 학교명, 계열,  시도별, 설립구분, 본분교구분, 학제, 학년 , 지원금액)에 대한 데이터이며,푸른등대 기부장학금 관련 상세 정보는 재단홈페이지(https://www.kosaf.go.kr/ko/scholar.do?pg=scholarship05_11_01&naviParam=JH,05,01,00)를 참고바랍니다.
