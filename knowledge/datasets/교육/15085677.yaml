description_portal: '○ 통계개요* 통계명 : 전문대학* 통계종류 : "교육기본통계조사규정"에 근거한 전문대학 현황을 제공하는 지정ㆍ보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적ㆍ종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획·시행·평가·연구 등에 주요 정보를 제공,국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 학교 → 한국교육개발원* 공표주기 : 정기(매년, 4월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 전문대학의 학생수, 교원수, 졸업/입학자수 등○ 용어설명* 교원수 : 초급대 및 전문대, 대학 및 대학원 교원수는 조교를 제외한 수치임* 졸업자현황- 취업자 : 취업한 학생수. 단, 직업군인으로서 장기 복무 하사관으로 입대한 자도취업자로 조사함- 입대자 : 병역 의무 복무를 위하여 사병으로 입대한 학생수○ 기 타* 2008년부터 전문대학에서 학사학위 전공심화과정이 개설운영됨(학과수 : 전문학사 학위과정 + 학사학위 전공심화과정)* 2010년이전 : 해당연도 2월(전년도 8월 포함) 졸업자의 6월1일 기준 취업현황임* 2011년이후 : 졸업자현황은 12월31일 기준으로 수행하는「고등교육기관 졸업자건강보험 및 국세DB연계 취업통계연보」자료임○ 출 처 : 교육부, 한국교육개발원「교육통계연보」'
