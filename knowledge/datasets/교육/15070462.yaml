description_portal: '대학생 청소년교육지원장학금 관련 대학별 신청기간 관리 정보: 대학명, 상품명, 장학상품유형, 장학년도, 장학학기, 장학업무절차, 기관모집유형 등의 정보를 제공데이터 제공항목은 사업 참여대학명, 사업 상품명, 사업연도, 사업참여학기, 사업참여 신청 회차, 사업 업무 절차 유형, 선발유형(대학발굴형), 선발유형(멘토발굴형)이 있습니다. 대학생 청소년교육지원장학금은 대학생이 초중고등학생 대상으로  멘토링을 지원하고, 대학생에게는 장학금을 지원하는 것을 목적으로 합니다. 대학생 청소년교육지원장학금 관련 정보는 "한국장학재단 누리집(https://www.kosaf.go.kr) > 인재육성 > 대학생지식멘토링 > 대학생 청소년교육지원장학금"에서 확인 가능'
