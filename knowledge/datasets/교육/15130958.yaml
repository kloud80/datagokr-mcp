description_portal: 대구광역시 북구 홈페이지시스템에 저장된 데이터로 평생교육기관 정보를 제공합니다.기관명, 소재지주소, 전화번호, 팩스번호, 홈페이지주소 항목을 제공합니다.평생교육법 제5조1.  “평생교육”이란 학교의 정규교육과정을 제외한 학력보완교육, 성인 문해교육, 직업능력 향상교육, 성인 진로개발역량 향상교육, 인문교양교육, 문화예술교육, 시민참여교육 등을 포함하는 모든 형태의 조직적인 교육활동을 말한다.2.  “평생교육기관”이란 다음 각 목의 어느 하나에 해당하는 시설ㆍ법인 또는 단체를 말한다.가. 이 법에 따라 인가ㆍ등록ㆍ신고된 시설ㆍ법인 또는 단체나. 「학원의 설립ㆍ운영 및 과외교습에 관한 법률」에 따른 학원 중 학교교과교습학원을 제외한 평생직업교육을 실시하는 학원다. 그 밖에 다른 법령에 따라 평생교육을 주된 목적으로 하는 시설 ㆍ법인 또는 단체
