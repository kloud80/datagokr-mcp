summary_user: STEP(스마트 직업훈련 플랫폼) LMS의 운영 부서 목록을 부서별 한 행으로 담은 코드성 기준 테이블로, 부서 아이디·코드·이름·등록 국가·등록 일시를 담으며 파일 크기는 318바이트에 불과하다. STEP 학습 이력이나 운영 데이터를 분석하는 사람이 어떤 부서 코드가 어떤 부서를 뜻하는지 확인할 때 쓴다. 부서 아이디(ole_dept_id)와 관련기관 아이디(ole_org_id)를 키로, 같은 기관이 공개한 STEP 기관 테이블이나 부서를 참조하는 다른 LMS 테이블과 이어 쓴다.
description_portal: 한국기술교육대학교 온라인평생교육원이 운영하는 스마트 직업훈련 플랫폼(STEP)은 고용노동부와 협력하여 전국의 직업훈련기관, 기업, 일반 국민을 대상으로 디지털 기반의 직무 교육을 제공하는 국가 직업능력 개발 플랫폼입니다. 이 플랫폼의 핵심 기능 중 하나인 LMS(Learning Management System)는 교육 콘텐츠 등록, 학습자 관리, 평가, 인증, 학습 이력 추적 등 다양한 기능을 포함하고 있으며, 이러한 시스템의 안정적인 운영을 위해 여러 부서가 역할을 분담하고 있습니다.운영 부서 테이블은 STEP LMS의 기능별 운영 책임 부서를 명확히 구분하고, 각 부서의 역할과 담당 영역을 체계적으로 기록한 데이터 구조입니다. 이 테이블은 시스템 운영의 효율성과 책임 소재의 명확화를 위해 필수적으로 관리되며, 조직 개편, 기능 고도화, 정책 변경 등에 따라 주기적으로 갱신됩니다.
