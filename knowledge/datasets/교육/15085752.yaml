description_portal: '○ 통계개요* 통계명 : 대학원* 통계종류 : "교육기본통계조사규정"에 의거 대학원 현황을 제공하는 지정ㆍ보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적ㆍ종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획·시행·평가·연구 등에 주요 정보를 제공,국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 학교 → 한국교육개발원* 공표주기 : 정기(매년, 4월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 대학원의 학생수(석사ㆍ박사과정), 교원수, 졸업/입학자 현황(석사ㆍ박사과정) 등○ 용어설명* 교원수 : 초급대 및 전문대, 대학 및 대학원 교원수는 조교를 제외한 수치임'
