description_portal: '○ 통계개요* 통계명 : 유치원* 통계종류 : "교육기본통계조사규정"에 의거 유치원 현황을 제공하는 지정ㆍ보고통계* 근거법령 :「교육기본통계조사규정」제 48호* 작성목적 : 우리나라 교육현황 전반에 대한 과학적ㆍ종합적 진단을 가능케 하고, 관련정책 수립을 비롯한 제반 교육 기획ㆍ시행ㆍ평가ㆍ연구 등에 주요 정보를제공, 국내 교육 현황의 해외소개 및 교육정책의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 학교 → 구 교육청 → 서울특별시 교육청 → 한국교육개발원* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 유치원의 원수, 원아수, 교원수 현황 등○ 용어설명* 사무직원 : 유치원에 근무하고 있는 사무직원을 조사함(일반직, 기능직, 보조직)* 교원수 : 재직, 휴직, 파견 포함. 기간제는 4. 1현재 재직 중 교원 모두 포함'
