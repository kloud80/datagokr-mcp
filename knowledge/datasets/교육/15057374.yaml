summary_user: 경기도 초·중·고·특수학교별로 방과후학교 교과·특기적성 프로그램 수와 수강학생 수, 초등돌봄교실(오후·저녁·연계)과 특수학교 종일반 운영 현황, 수익자 부담액과 지원금액을 학교 단위로 담는다. 교육 분석가나 학부모가 우리 지역 학교들의 방과후 프로그램 수와 돌봄교실 참여 규모, 지원금 수준을 학교·시군별로 비교하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로, 학교명·시군 이름이나 학교정보공시용 학교코드(INFO_PBLNTF_SCHOOL_CD)를 같은 체계의 학교 기본정보와 매핑해 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 초·중·고 및 특수학교의 방과후학교 운영 계획과 운영·지원 현황을 포함합니다. 주요 항목으로는 교과 및 특기적성 프로그램 수와 수강학생 수, 초등돌봄교실(오후/저녁/연계), 특수학교 종일반 운영 현황, 그리고 수익자 부담 및 지원금액 등의 재정 관련 정보가 포함됩니다.활용처는 교육 정책 수립, 지역 교육자원 분석, 방과후 프로그램 수요 예측, 돌봄 서비스 개선, 교육 불균형 분석 등입니다.특히 각 항목이 학교 단위로 제공되기 때문에, 미시적 분석 및 지역 간 비교 분석에도 적합합니다.
