summary_user: 전국 대학도서관을 한 행에 하나씩 담은 기본정보 파일(CSV, 약 56KB)로, 도서관명(국문·영문), 개관년도, 모기관 성격, 국내서·국외서 목록규칙과 저자기호, 홈페이지 주소를 담는다. 분석가나 도서관 담당자가 '어느 대학도서관이 언제 개관했고 어떤 목록규칙을 쓰는가'처럼 기관별 기본 현황을 비교하거나 학술정보 통계의 기준 명단을 만들 때 쓴다. 도서관코드(riss_lib_cd)를 키로 RISS 등 같은 코드를 쓰는 대학도서관 통계·학술정보 데이터와 이어 쓴다.
description_portal: 제공하는 데이터는 전국 대학도서관의 운영 현황을 파악하기 위한 기초 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 각 도서관의 개관년도, 도서관명(국문·영문), 도서관코드, 목록규칙(국내서·국외서), 홈페이지 주소 등 대학도서관 식별과 기본 현황 파악에 필요한 항목이 포함되어 있습니다. 데이터는 대학도서관이 매년 실시하는 실태조사에서 직접 입력한 내용을 기반으로 하며, 「대학도서관진흥법」 제15조(실태조사) 및 관련 시행령에 따라 수집·관리됩니다. 업데이트 주기는 수시(1회성 데이터)로, 도서관 정보에 변동이 있을 때마다 최신 정보로 반영됩니다. 이 데이터는 대학도서관의 기본 현황 분석, 학술정보 통계 구축, 도서관 정책 수립, 기관별 비교 연구, 공시자료 작성 등 다양한 분야에서 활용됩니다.
