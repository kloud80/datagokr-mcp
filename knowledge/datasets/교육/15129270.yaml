description_portal: 한국장학재단의 안전경영 추진을 위해 사용된 연간 안전 예산 집행 현황 관련 데이터입니다. 시설안전, 재난안전, 안전관리 등 다양한 안전경영 활동을 위해 사용된 예산 내역에 대한 데이터입니다. 안전관련 행사 추진 비용, 안전경영시스템 인증 및 운영관련 평가 비용, 안전관련 정보시스템 구축 운영 및 유지보수 비용, 안전진단 및 점검, 안전검사, 각종 측정 등에 소요되는 비용, 시설물의 안전 확보를 위한 대책사업비 등 연간 안전 예산 집행 현황과 전년도 예산 및 금년도 예산의 증감 현황을 확인하실 수 있습니다. (2026년도 안전경영책임계획 가이드라인에 따라 작성되었으며, 2026년 부터는 세부현황 변동에 따라 청관사 등 업무시설 유지관리비 항목 배제)
