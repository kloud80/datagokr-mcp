summary_user: 에듀넷·티-클리어의 초·중등 과학 교수학습자료를 자료 한 건당 한 행으로 과목·주제·부제·제목·키워드·바로가기 URL로 정리한 전국 단위 목록 파일(CSV 약 132KB)이다. 교사가 '특정 과학 단원·주제에 맞는 수업자료가 에듀넷에 있는가'를 찾거나, 교육 콘텐츠 개발자가 주제별 자료 분포를 살피는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키나 코드표가 없어, 다른 교과의 학습자료 목록과는 과목·주제 이름을 맞춰 붙이는 정도로만 연결된다.
description_portal: 제공되는 데이터는 에듀넷에서 초·중등 교육과정에 따라 과학 교과의 다양한 주제를 체계적으로 정리하여 제공하는 공공데이터입니다. 이 데이터는 각 교과과정별로 흥미로운 주제를 중심으로 구성되어 있으며, 각 자료에는 과목, 주제, 부제, 제목, 키워드, 바로가기 URL 등 구체적인 정보를 포함하고 있습니다. 자료는 에듀넷 및 티-클리어에서 개발·운영 중인 교수학습자료를 기반으로 하며, 교육 현장과 교과과정의 변화에 따라 신규 자료가 추가되거나 기존 자료가 갱신되는 방식으로 수집됩니다. 데이터의 보유근거는 「초·중등교육법」에 따라 국가 교육정보화 및 교수학습 지원을 담당하는 한국교육학술정보원의 법적·행정적 역할에 기반합니다. 업데이트 주기는 수시(1회성 데이터)로, 교육과정 개정이나 신규 자료 개발 시마다 최신 자료로 반영됩니다. 이 데이터는 교사들의 수업자료 준비, 학생들의 자기주도 학습, 교육 콘텐츠 개발, 교육 연구 등 다양한 교육 현장에서 폭넓게 활용될 수 있습니다.
