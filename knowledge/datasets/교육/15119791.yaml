description_portal: 경기도 하남시 학령인구 데이터(행정동 14개, 2008~2025년생)는 지역별·연령대별 교육수요를 “숫자”로 확인해 학교와 돌봄 인프라를 적기에 배치하는 데 핵심 자료가 됩니다. 이번 자료 기준 총 54,799명이며, 초등(2014~2019년생) 21,076명, 중등(2011~2013년생) 10,487명, 고등(2008~2010년생) 9,321명, 미취학(2020~2025년생) 13,915명으로 구간별 규모가 뚜렷합니다. 코호트(출생연도)로 보면 2016년생(초4) 3,849명이 가장 크고, 최근 2024~2025년생은 각 2,104명·2,117명 수준이라 향후 초등 입학생 감소 가능성도 시사합니다. 또한 미사2동·감일동·위례동·미사1동 4개 동이 전체의 **약 63%**를 차지해(학급 증설, 통학 안전, 돌봄교실·방과후, 교원·시설 배치)를 생활권 단위로 집중 검토할 필요가 있습니다. 이처럼 “어느 동의 어느 학년대가 언제 늘고/줄지”를 근거로 학교 신설·증축, 통학로 개선, 학원가·버스 노선 연계, 장기 재정투자 우선순위를 정하면 정책의 실행력과 주민 체감도를 동시에 높일 수 있습니다.
