description_portal: 부산광역시교육청에서 운영하는 [부산교육 다모아 2.0] 앱에 등록된 학교정보 입니다.데이터 구성은 [학교급], [관할구분], [전화번호], [홈페이지 주소], [학교명] 로 되어 있습니다.학교급은 유치원, 초등학교, 중학교, 고등학교, 특수학교, 학력인정평생교육시설 로 구분 되어 있습니다.관할구분은 부산광역시교육청, 서부교육지원청, 남부교육지원청, 북부교육지원청, 동래교육지원청, 해운대교육지원청 으로 구분 되어 있습니다.다모아 앱에서 학교 등록 시 검색 할 수 있는 학교(유치원 포함) 데이터로실시간 연계 데이터가 아니므로 실제 앱에서 불러오는 학교 정보와는 차이가 있을 수 있는점 양해 바랍니다.본 데이터는 다모아 앱에 한정된 정보로 정확한 학교 정보는 학교 알리미 사이트(https://www.schoolinfo.go.kr/Main.do)를 통해 확인 바랍니다.
