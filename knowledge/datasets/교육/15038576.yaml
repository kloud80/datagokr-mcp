summary_user: 대학정보공시 항목인 전년도 장학금 수혜현황을 대학별 한 행으로 집계한 전국 범위 파일로, 교외장학금은 재원별(국가·지방자치단체·사설 및 기타), 교내장학금은 성격별(성적우수·저소득층·근로·재난·교직원·기타) 연간 수혜금액(원)을 담는다. 진학을 앞둔 학생·학부모나 교육 분석가가 '이 대학은 저소득층 장학금이나 외부 장학금을 얼마나 주는가', '설립별·지역별로 교내장학금 규모가 어떻게 다른가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키(학교 코드 등)가 없어 다른 대학 공시 데이터와는 학교명·설립별·지역별을 맞추는 이름 매핑으로만 잇는다.
description_portal: '- 전년도 장학금 수혜현황(대학정보공시 항목) 조사를 통해, 대학별 재원구분에 따른 교외장학금 수혜 금액 및 성격유형에 따른 교내장학금 연간 수혜금액 제공- 2020 회계연도부터 재난을 사유로 지급한 교내장학금 추가 조사- 2023 회계연도부터 조사연도 및 기준연도 추가- 교내장학금: 각 학교의 대학관계규정에 공식적으로 명시된 장학금으로 대학 내의 등록금 및 기금 등의 자체 예산에서 지급한 교내 장학금이면서, 사립대학은 교비회계 자금결산서에, 국공립대학은 일반회계, 기성회계, 대학회계, 발전기금회계의 세출결산서에 반영된 장학금. 단, 관련 규정에 명시되었더라도 장학목적 외로 지급된 경우 장학금으로 인정하지 않음- 교외장학금: 외부재원으로 학생에게 지급된 장학금으로 사립대학은 자금결산서에, 국공립대학은 세출결산서에 반영된 장학금. 단, 장학목적 외로 지급된 경우 장학금으로 인정하지 않음'
