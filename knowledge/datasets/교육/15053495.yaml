summary_user: 서울 강동송파교육지원청 관할 평생교육시설을 시설 한 곳당 한 행으로 담은 파일로, 원격·사업장부설·시민사회단체부설·언론기관부설·학력미인정 학교형태 등 시설 유형과 소재지 도로명주소, 설립자, 전화번호, 등록일자, 등록상태, 학력인정 여부를 담는다. 강동·송파 주민이 집 근처에서 학력인정을 받을 수 있는 평생교육시설이 어디이고 현재 등록이 유지되고 있는지 확인할 때 쓰고, 분석가가 유형별 시설 분포를 살필 때도 쓴다. 전역 조인 키는 없어서 시도교육청·교육지원청 코드, 시도·시군구 코드와 이름, 주소를 기준으로 다른 교육지원청의 평생교육시설 파일이나 행정구역 자료와 맞춰 쓴다.
description_portal: 2026. 6. 26. 기준 서울 강동송파교육지원청의 평생교육시설에 관한 데이터입니다.시설 유형별(원격, 사업장부설, 시민사회단체부설, 언론기관부설, 지식인력개발사업관련, 학력미인정 학교형태, 장애인 등)로 평생교육시설을 분류해 놓은 자료입니다.각 시설 유형별로 소재지, 설립자, 전화번호, 등록일자, 등록상태, 학력인정 여부 등을 표시해 두었습니다.1년에 한번씩 공공데이터에 평생교육시설 현황을 게시하지만, 강동송파교육지원청 홈페이지에 매달 평생교육시설 현황을 게시해 놓습니다.공공데이터와 강동송파교육지원청 홈페이지 자료를 같이 활용하신다면 최신의 자료를 활용하실 수 있을 것으로 생각됩니다.
