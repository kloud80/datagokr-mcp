description_portal: 경기도교육청 초.중.고등학교의 방과후학교 운영 현황을 알 수 있는 자료입니다.경기도교육청의 방과후학교 학생참여현황, 방과후 학교 유형별 프로그램현황을 분기별로 확인할 수 있습니다. 학생참여 현황은 총학생수대비 참여학생수 비율로 확인할 수 있으며, 방과후학교 프로그램은 교과프로그램과 특기적성 프로그램으로 구분되어있습니다. 이 데이터는 교육정책 수립, 방과후학교 프로그램 개선, 연구기관의 교육 연구 등 다양한 분야에서 활용 될 수 있습니다. 또한, 데이터는 방과후학교 운영의 투명성과 효율성 제고, 사회적 관심 증대에도 기여할 수 있습니다.
