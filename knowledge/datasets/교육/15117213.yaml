summary_user: 강원특별자치도 내 학교별 기숙사 운영 현황을 학교 단위로 정리한 파일로, 지역·학교명·설립별·급별·유형별과 남·여·계 인원을 담는다(약 4KB 규모의 소형 CSV). 학부모·학생이 도내 어느 학교에 기숙사가 있고 남녀별로 몇 명을 수용·운영하는지 확인하거나, 교육행정 분석가가 지역·학교급별 기숙사 분포를 파악하는 데 쓴다. 학교 코드 같은 전역 조인 키가 없어 다른 학교 공시 데이터와는 학교명·지역 이름을 맞춰 연결해야 한다.
description_portal: 강원특별자치도교육청에서 제공하는 "강원특별자치도교육청_학교 기숙사 운영 현황" 데이터는 도내 초·중·고등학교 및 특수학교의 기숙사 운영 실태를 종합적으로 담고 있습니다. 주요 제공 정보에는 학교명, 기숙사명, 기숙사 유형(남·여 구분), 수용 가능 인원, 실제 입사 인원, 기숙사 시설 규모,  등 세부 항목이 포함되어 있습니다. 이 데이터는 각 학교에서 연 1회 이상 자체 조사 및 행정 보고를 통해 수집되며, 「초·중등교육법」 및 관련 교육부·교육청 지침에 따라 보유·관리됩니다. 연간 단위로 정기적으로 업데이트되어 최신의 기숙사 운영 현황을 반영합니다. 본 데이터는 학교별 기숙사 분포 및 운영 현황 파악, 교육정책 및 예산 수립, 학생 생활환경 개선, 학부모 및 학생의 기숙사 선택 참고, 지역사회와의 협력사업 기획 등 다양한 분야에서 활용될 수 있습니다. 학생들의 안전하고 쾌적한 생활환경 조성과 교육복지 향상에 기여하는 것이 주요 목적입니다.
