description_portal: 이 문서는 한국정부초청외국인장학생의 대학별 누적관리인원 현황을 담고 있다. 다양한 대학에서 정부초청 외국인 장학생들이 누적되어 관리되며, 서울대학교, 고려대학교, 경희대학교 등 주요 대학의 장학생 수가 특히 많다. 미리보기 섹션에는 특정 대학마다 누적된 외국인 장학생 수가 상세히 나타나 있으며, 과거 누적관리현황 데이터도 함께 제공된다. 이를 통해 정부초청 외국인 장학생들의 현황을 종합적으로 파악할 수 있다.국립국제교육원이 선발한 한국정부초청외국인장학생(KGSP) 정보를 국외인적자원관리시스템을 통해 누적 관리 중이며, 등록된 정부초청외국인장학생 대학별 누적관리인원 현황임
