description_portal: 경상남도교육청 e-나누미 서비스는 지역사회가 보유한 다양한 교육적 재능과 전문성을 공공 교육에 기여할 수 있도록 기부 정보를 관리·제공하는 서비스입니다. 이 서비스에서는 기부자 소속정보, 기부가능 영역, 기부 강좌명, 세부 가능 지역, 기부정보 등록일자 등 기부와 관련된 모든 주요 항목을 체계적으로 안내하고 있습니다. 공개된 데이터는 일부 자료만 제공하고 있으며, 기부자의 소속 정보, 기부자 제공 가능 강좌명, 강좌의 개설 가능 지역과 기부자 개설 강좌의 세부 지역, 강좌 등록일자을 알 수 있습니다. 해당 정보 수요 기관은 교육기관 · 학교 대상일 것으로 예상되며, 세부적인 내용은 경상남도교육청 e-나누미 사이트를 이용하여 주시기 바랍니다.
