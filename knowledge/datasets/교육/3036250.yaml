description_portal: '경기도 평택시 정보화교육 현황에 대한 데이터로 교육과정명, 교육내용, 모집인원, 교육기간, 교육시간, 접수일, 연락처 등의 정보를 제공합니다.시민들의 정보화능력을 함양하고 시민들에게 정보화교육의 기회를 제공함으로써 지역정보화의 기반을 마련하여 생활의 편리성을 도모하고자 정보화교육을 실시합니다. 또한, 지역·계층간 정보격차 해소 및 시민의 정보 활용능력 배양을 위해 누구나 수강할 수 있는 정보화교육입니다.매년 다양한 강좌를 통해 디지털 역량 강화 및 활용 교육을 받을 수 있습니다. 1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 송탄출장소 총무과(031-8024-6061)'
