description_portal: 전북대학교 교양교육과정 교양과목 목록입 니다. 교양교육과정은 크게 기초교양과 균형교양과 진로 영역으로구분됩니다. 기초교양은 대학교육에 필요한 기본지식과 지적능력을 함양하는 영역입니다. 균형교양은  여러 학문 분야에 대한 깊은 이해를 제공하여 각 분야에서 발생될 수 있는 다양한 문제점과 현상을 이해하고, 이에 대한 판단할 수 있는 종합적인 능력을 개발하는 영역으로 다음 각 호와 같이 편성한다.진로영역은 신입생의 진로설계 및 자기 주도적 진로개발 역량을 배양하기 위한 교과목을 편성한다.
