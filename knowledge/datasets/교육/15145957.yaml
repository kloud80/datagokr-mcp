description_portal: '유치원 방과후 과정 편성운영 현황 데이터는 유치원의 방과후 과정 운영에 관한 다양한 정보를 담고 있는 자료입니다. 이 데이터는 주로 각 유치원의 방과후 과정이 어떻게 편성되고 운영되는지에 대한 구체적인 사항들을 포함하고 있습니다. 데이터에는 유치원이 속한 교육청 정보, 각 유치원의 이름, 유치원 유형(공립인지 사립인지, 그리고 법인 또는 개인이 운영하는지, 초등학교 병설유치원인지), 독립편성 학급 수, 오후 재편성 학급 수, 운영시간, 교사 수, 유치원 주소가 포함되어 있습니다.이 데이터를 통해 부모님들은 자녀가 다니는 유치원의 방과후 과정 운영 상황을 확인할 수 있고, 유치원의 교육환경을 파악하여 선택에 참고할 수 있습니다. 또한, 특정 지역 내 여러 유치원의 방과후 과정 운영 방식이나 시간을 비교하여 자녀에게 더 적합한 유치원을 찾을 수 있습니다.교육 관련 기관에서는 이 데이터를 분석하여 유치원 방과후 교육의 전반적인 운영 효율성이나 문제점 등을 파악할 수 있을 것입니다. 이렇게 다양한 데이터가 공개됨으로써, 교육의 질을 높이고, 부모님과 지역사회가 보다 투명하고 정보에 기반한 결정을 할 수 있게 됩니다.(데이터 담당기관 : 한국교육학술정보원)'
