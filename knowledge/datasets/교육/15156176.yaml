description_portal: '농업생태원 농가체험 프로그램 정보 데이터는 평택시 대표 홈페이지 DB 데이터로서 시민에게 다양한 농촌체험 기회를 제공하고, 지역 농가의 소득 창출과 농업·환경 교육 활성화를 지원하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 체험 프로그램의 내용, 일정, 참여 농가, 비용, 대상 등을 쉽게 확인할 수 있으며, 민간·연구기관은 농촌관광 서비스 개발, 지역경제 활성화 연구, 생태·환경 교육 프로그램 기획 등 다양한 분야에서 활용할 수 있습니다. 본 데이터에는 체험명, 운영 농가, 프로그램 일정, 예약 여부 등 주요 항목이 포함되어 있어 농업생태체험의 구성과 운영 현황을 이해하는 데 도움이 됩니다. 이러한 자료는 농촌체험 활성화, 농가 소득 다각화, 지역 문화·생태 교육의 확산 등 공공·민간 영역의 다양한 가치 창출 등에 활용할 수 있는 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
