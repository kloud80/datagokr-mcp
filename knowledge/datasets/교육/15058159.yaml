summary_user: 경기도 내 특수학교별로 기준년도마다 초등 1~6학년, 중학교 1~3학년, 고등학교 학년별 전입·전출 학생 수와 전체 학생 수를 담은 학교 단위 집계 자료다. 교육청 담당자나 연구자가 '어느 시군·지역교육청 소속 특수학교에서 학년별 전출이 많이 일어나는가'처럼 특수학교 학생 이동 추세를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 학교명·시군명을 맞추거나 같은 기관의 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)로 경기도 다른 학교 통계와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 특수학교의 전입·전출 학생 수와 학업중단 현황을 기록한 자료로, 학년별 및 학교급별 학생 이동 상황을 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 기준년도, 시군명, 지역교육청명, 학교명, 설립구분(공립·사립·국립), 초등학교 1~6학년, 중학교 1~3학년, 고등학교 1~3학년별 전입학생수, 전출학생수, 전체학생수, 그리고 학교 전체 전입·전출 합계와 전체 학생 수가 포함됩니다. 또한 이 데이터는 특수학교 학생의 이동 추세, 학업중단 관련 요인 분석, 지역 간 학생 분포 변화, 교육정책 지원 근거 마련 등에 활용될 수 있습니다.
