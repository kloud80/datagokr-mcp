description_portal: '"서울시 은평구 유치원 교실면적 현황’ 데이터는 은평구 소재 국 · 공 · 사립 유치원의 물리적 학습 환경을 한눈에 파악할 수 있도록 유치원알리미 자료를 수집 · 가공해 제공하고 있습니다. 파일 형식은 CSV·JSON이며 REST API로도 호출할 수 있고, 학년도 종료 후 매년 자동 갱신됩니다.주요 필드에는 교육지원청, 유치원명, 설립유형, 보유 교실 수, 교실 총면적(㎡), 1인당 면적(㎡/명), 교사 연구실·체육장·놀이터·유희실 면적, 통계 기준 학년도 등이 포함돼 있습니다. 학부모는 교실당 · 아동당 면적을 비교해 학습 · 안전 환경을 확인할 수 있으며, 교육청은 1인당 최소 면적 기준 미달 유치원을 신속히 파악해 시설 확충 지원이나 학급 조정 지도를 할 수 있습니다. 연구자는 교실 면적과 학생 만족도, 학습 효과 간 상관관계를 분석할 수 있고, 지자체는 보육 수요 증가 지역의 신규 유치원 부지 확보 및 지원 우선순위를 설정하는 데 활용할 수 있습니다. 주소 정보를 지오코딩하면 GIS 기반의 교육 격차 지도 작성도 가능해 정책 수립과 서비스 개발 전반에 유용한 데이터입니다.'
