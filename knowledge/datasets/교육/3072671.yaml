description_portal: 본 자료는 국가기술자격 중 전문사무(서비스) 분야의 자격시험 통계를 직무분야별로 정리한 데이터로, 디자인, 기계, 건설 등 다양한 분야에 대한 연도별 자격 통계를 포함합니다. 주요 항목은 종목명, 연도, 성별, 필기시험 및 실기시험의 접수·응시·합격 인원과 합격률, 최종 자격취득자 수 등으로 구성되어 있으며, 2021년부터의 변동 추이를 확인할 수 있습니다. 해당 데이터는 전문사무(서비스) 분야 자격시험의 응시경향, 성별 특성, 자격취득률 등을 분석하여 산업별 인력 수급계획 수립, 직업능력개발정책 평가, 자격시험 운영 제도 개선 등에 활용될 수 있습니다. 자격통계의 정량적 근거자료로서 학계·정부·공공기관의 정책연구에 참고 가능합니다.
