summary_user: 경기도 초·중·고·특수학교의 도서관 운영 현황을 기준연도·학교 단위로 담으며, 도서관 수, 직원 수, 좌석 수, 사서자격증 보유·미보유 인원, 자료구입비와 운영비 예산이 들어 있다. 교육청 담당자나 분석가가 '시군·학교급별로 사서 자격자가 없는 학교도서관이 어디에 몰려 있는가'를 확인하거나, 학생 수 대비 좌석·자료구입비를 비교하는 데 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키는 실측 컬럼에서 확인되지 않아, 학교명·시군명이나 학교알리미 공시 학교코드(INFO_PBLNTF_SCHOOL_CD)를 이름·코드 매핑으로 학교 기본정보나 교원·학생 통계에 붙여 쓴다.
description_portal: 본 데이터는 경기도 내 초등학교, 중학교, 고등학교, 특수학교의 도서관 운영 현황을 종합적으로 제공하는 자료로, 학교별 도서관 수, 도서관 직원 수, 총 좌석 수, 사서자격증 보유 현황, 자료구입비 및 운영비 예산 등 도서관 운영 관련 세부 정보를 포함하고 있습니다. 해당 데이터는 학교명, 시군명, 지역교육청명, 학교급명, 설립구분명 등의 기본 항목과 함께, 학습·교수 활동을 지원하는 교육 인프라로서 도서관의 운영 실태를 파악하는 데 활용됩니다. 특히 도서관 운영 예산은 자료 구입비와 일반 운영비로 구분되며, 인건비는 제외됩니다. 데이터는 학교알리미 시스템을 기반으로 하며, 경기도 AI데이터행정과가 연간 단위로 갱신하여 제공하며, Open API를 통해 다양한 시스템과 연계해 활용할 수 있습니다. 교육환경 개선, 학교도서관 운영 정책 수립, 사서 인력 배치 분석 등에 유용합니다.
