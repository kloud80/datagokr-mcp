summary_user: 경기도 시군에 있는 보육교사교육원을 기관 한 곳당 한 행으로 담은 목록으로, 교육기관명·기관장명·전화번호·지번/도로명 주소·우편번호·WGS84 좌표를 포함한다. 보육교사 자격 과정을 알아보는 사람이 우리 시군 근처 교육원의 위치와 연락처를 찾거나, 분석가가 시군별 교육원 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)로 다른 경기도 시군 자료와 묶거나, 좌표와 주소로 지도·GIS 자료에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군에 위치한 보육교사교육원의 현황을 기록한 자료로교육기관명, 전화번호, 기관장명, 소재지 주소, 위도 및 경도 정보 등을 포함하고 있습니다. 주요 항목으로는 ‘교육기관명’, ‘전화번호정보’, ‘소재지도로명주소’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며교육기관의 위치와 연락처를 기반으로 기관 접근성 분석 등 교육 인프라 파악, 행정업무 지원 등의 목적으로 활용될 수 있습니다. ‘소재지지번주소’와 ‘소재지도로명주소’는 행정구역 기반 및 도로명 기반의 위치정보를 모두 제공하며, WGS84 좌표계는 GIS 시스템과 연계해 활용 가능합니다. 기관명은 대학 부설 평생교육원, 민간 교육원 등 다양한 유형을 포함하고 있어 구분 분석 시 유의해야 합니다.
