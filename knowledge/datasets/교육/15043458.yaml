summary_user: 학교온(On)에 등록된 온라인 학습 콘텐츠를 콘텐츠 한 건씩 학교급(초·중·고)·학년·과목·출처·링크와 함께 담은 전국 단위 목록 파일이다. 교사나 학생이 '중학교 2학년 과학 수업에 쓸 온라인 콘텐츠가 어디 있나'를 찾거나, 분석가가 학교급·과목별 콘텐츠 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학교급·학년·과목 같은 이름 값을 맞춰서만 이어 쓴다.
limits: 학교 코드나 지역 코드가 없어 개별 학교·지역 단위 분석이나 학교알리미 공시 자료와의 직접 결합은 하지 못한다. 포털 파일(csv) 다운로드로만 받으며 범위는 전국·비공간이다.
