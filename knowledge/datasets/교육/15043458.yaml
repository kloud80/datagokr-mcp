description_portal: 제공하는 데이터는 온라인 학습 통합 지원 사이트인 ‘학교온(On)’에서 제공되는 다양한 온라인 학습 콘텐츠의 현황을 체계적으로 제공하는 공공데이터입니다. 주요 제공 항목에는 학교급(초·중·고), 학년, 학과목, 콘텐츠 출처, 콘텐츠별 링크 등이 포함되어 있어, 교육 현장에서 필요한 맞춤형 학습 자료를 쉽게 찾고 활용할 수 있습니다. 이 데이터는 학교온 플랫폼에 등록된 콘텐츠 정보를 기반으로 하며, 각 교육기관과 시도교육청에서 직접 입력한 자료를 수집합니다. 보유 및 제공 근거는 「교육관련기관의 정보공개에 관한 특례법」 등 관련 법령에 따라 마련되어 있습니다. 데이터는 수시(1회성 데이터)로 갱신되어, 새로운 콘텐츠가 등록되거나 기존 자료에 변동이 있을 때마다 최신 정보가 반영됩니다. 본 자료는 교사와 학생의 온라인 수업 설계, 교육콘텐츠 개발, 학습자료 추천 시스템, 디지털 교육환경 구축, 정책 연구 및 통계 등 다양한 분야에서 활용될 수 있습니다
