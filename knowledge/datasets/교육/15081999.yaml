summary_user: 2024년도 국가기술자격 CBT 필기시험을 시행일·회차·지사·종목별로 묶어 응시자수·결시자수·중도포기자수·부정행위자수·합격자수와 응시자 전체 시험시간·총점을 담은 집계 파일(CSV, 약 12MB)이며 범위는 전국입니다. 수험생이나 분석가가 '어느 종목·지사의 CBT 필기시험 결시율과 합격률이 높은가', '종목별 평균 응시 시간과 평균 점수는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 종목명·지사명·시행년도를 이름으로 맞춰 같은 기관의 국가자격 종목·시험일정·합격률 데이터와 이어 쓰며, 채용·창업 요건이나 업종 인허가 자료와 연결할 때도 종목명 매핑이 필요합니다.
limits: 수험자 개인 단위 점수가 아니라 회차·지사·종목별 집계이므로 개별 점수 분포는 응시자 전체 총점·시험시간에서 평균 정도만 계산된다. 공통 코드 키가 없어 다른 데이터와는 종목명·지사명 같은 이름 문자열로만 연결된다.
