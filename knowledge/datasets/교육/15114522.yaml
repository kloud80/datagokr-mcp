description_portal: 경상남도 거제시에 위치하고 있는 도서관(수양, 아주, 옥포, 장승포, 장평, 하청)의 신간도서에 대한 정보(저자, 출판사, 입수일자, 관리구분, 코드변경일, 데이터기준일자)를 CSV형태로 매년 1회 갱신됩니다. 본 데이터는 시민의 지식 접근성과 문화복지 증진에 기여할 수 있으며, 지역 도서관의 신간도서 현황을 기반으로 정보 접근성 향상과 공공데이터 활용 촉진을 목적으로 제공합니다. 도서 정보는 도서관별 입수 시기에 따라 상이할 수 있으며, 실제 보유 여부는 도서관 시스템과 일치하지 않을 수 있습니다. 데이터 오류 발생 시 도서관에 문의 바랍니다.
