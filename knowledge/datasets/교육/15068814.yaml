summary_user: 육군3사관학교의 학과별·학년별·학기별 필수 과목과 선택 과목을 정리한 교육과정 표로, 약 4KB 크기의 CSV 파일 한 건이다. 생도나 지원 희망자가 "무기공학과 2학년 2학기에 들어야 하는 전공 필수 과목은 무엇인가" 같은 질문에 답하고 학기별 학습 계획을 세우는 데 쓴다. 학과명(ka3_dept)이 조인 키로 확인되어 같은 학교의 학과별 다른 자료와 학과 단위로 이어 쓸 수 있으며, 그 밖의 공통 코드표는 없다.
description_portal: 육군3사관학교 교육 과정에 대한 데이터입니다. 학과명(영어학과, 군사사학과, 무기공학과 등), 학년, 학기, 필수 과목, 선택 과목을 상세하게 설명하고 있습니다. 해당 데이터를 통해 개개인의 전공에 따른 전공 필수 과목 및 전공 선택 과목을 파악하여 원활하게 학습 계획을 세울 수 있으며, 미리 계획을 세울 수 있기에 시기에 맞는 준비를 할 수 있어 학습의 효율성을 높이는 것이 가능합니다.교육과정 변경에 따라 수정된 내용이 포함되어 있으며, 추후 교육과정 변경 시 수시로 변경된 내용을 반영해 업로드 하겠습니다.
