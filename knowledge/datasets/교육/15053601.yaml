description_portal: '서울특별시 동작관악교육지원청 관내, 즉 동작구와 관악구 지역에 위치한 평생교육시설(학원, 교습소, 평생교육기관 등)에 대한 현황 자료입니다. 이 자료에는 해당 지역 내에서 운영되고 있는 다양한 평생교육기관들의 기본적인 정보를 비롯하여, 학원과 교습소, 평생교육시설의 명칭, 정확한 주소, 연락 가능한 전화번호 등이 포함되어 있습니다. 또한 각 기관에서 제공하고 있는 교습과정(예: 수학, 영어, 음악, 미술 등) 및 프로그램에 대한 정보와 함께, 현재 해당 기관이 정식으로 개원하여 운영 중인지, 혹은 일시적으로 휴원 중인 상태인지 여부 등 운영 현황에 대한 내용도 확인할 수 있습니다.'
