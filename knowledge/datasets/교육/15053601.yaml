summary_user: 서울 동작구·관악구 관내 학원·교습소·평생교육시설을 기관 한 곳당 한 행으로 담은 건별 현황 파일로, 학원명·주소·전화번호·교습과정·등록상태(개원·휴원 여부)를 싣고 검증 시 1,804행을 받았다. 동네 학원 분포나 특정 과목 교습소 위치, 운영 중인지 확인하려는 주민·사업자·분석가가 쓰며, 학원가 밀집도를 주택 수요 신호로 보는 분석에도 쓴다. 조인 키는 주소(address)뿐이라 같은 주소 체계를 쓰는 다른 교육청 학원 파일이나 지역 시설 데이터와 주소 매칭으로 이어 쓴다.
limits: 범위는 동작·관악 관내이며 서울 전체나 다른 교육청 관할은 담지 않는다. 키가 주소 문자열뿐이어서 표기가 다르면 매칭이 어긋날 수 있고, 갱신 주기는 근거 자료에 없어 최신 여부는 확인되지 않는다.
