description_portal: 경기학생스포츠센터 내 시설에 있는 시설기자재 정보입니다. 기자재고유번호, 시설고유번호, 기자재 명으로 구성되어있고 기자재 고유번호는 각 기자재에 부여된 고유번호(ID)이고, 시설고유번호는 각 시설에 부여된 고유번호이며, 기자재 명은 각 시설에 위치한 기자재를 나타냅니다. 학교 밖과 안을 연계한 스포츠와 관련된 프로젝트 활동, 스포츠(체육교육) 관련 연구(연수), 체험 분야와 함께 전문스포츠 교육 활동을 포함한 체육 진로교육 프로그램 운영 등이 있습니다. 학급체험은 경기도 관내 초·중·고 학급 대상이고, 개인체험은 경기도 관내 초(4,5,6학년)/중학생(1,2학년), 교사, 학부모 등이며 학생의 경우 법정 보호자 동반해야 합니다.
