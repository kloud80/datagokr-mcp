summary_user: 한국산업인력공단이 시행하는 국가기술자격·국가전문자격의 종목별 목록에 자격구분과 담당 주무부처를 붙인 전국 단위 파일(CSV 약 52KB)로, 한 행이 자격 종목 하나다. 구직자나 사업자가 '이 자격증은 어느 부처 소관인가'를 확인하거나, 분석가가 주무부처별 자격 종목 분포를 볼 때 쓴다. 전역 조인 키나 종목 코드가 없어 시험 일정·합격률·자격 보유 현황 같은 다른 국가자격 데이터와는 종목명 문자열 매핑으로만 연결한다.
description_portal: 본 자료는 한국산업인력공단에서 시행하는 국가기술자격 및 국가전문자격의 종목별 목록과 해당 자격을 담당하는 주무부처 정보를 포함한 데이터입니다. 자격 종목명, 자격구분(기술자격·전문자격 등), 주무부처 항목으로 구성되어 있으며, 각 자격의 운영 주체를 명확히 구분할 수 있도록 체계화되어 있습니다. 본 자료는 산업계 및 공공부문에서 자격 활용 현황을 파악하고 자격 관리 및 정책 주체 간 협업 구조를 설계하는 데 활용될 수 있으며, 자격 관련 행정절차 안내, 자격연계 시스템 구축, 주무부처별 자격정책 수립 등을 위한 기초자료로 활용될 수 있습니다. 단, 타 기관에서 시행하는 자격은 본 자료에 포함되지 않으며, 한국산업인력공단 주관 자격에 한정됩니다.
