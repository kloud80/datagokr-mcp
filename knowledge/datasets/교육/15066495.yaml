description_portal: 제공하는 데이터는 온라인 학습 통합 지원 플랫폼인 학교온(On)에서 각 시도교육청이 제공한 온라인 학습 콘텐츠의 현황을 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 콘텐츠의 제목, 내용, 출처 등 구체적인 정보가 제공됩니다. 데이터는 각 시도교육청에서 학교온 플랫폼에 직접 등록한 자료를 기반으로 하며, 온라인 학습 활성화 및 교육격차 해소를 위한 국가 교육정책에 따라 수집·관리됩니다. 업데이트 주기는 수시(1회성 데이터)로, 새로운 콘텐츠가 등록될 때마다 최신 정보로 갱신됩니다. 이 데이터는 교사와 학생의 온라인 수업자료 활용, 원격수업 콘텐츠 개발, 교육정책 수립, 학습자료 추천 시스템 구축, 연구 및 통계 등 다양한 분야에서 활용됩니다
