summary_user: 학교온(On) 플랫폼에 각 시도교육청이 등록한 온라인 학습 콘텐츠를 건별로 담은 전국 단위 파일로, 콘텐츠마다 제목·내용·출처·링크를 기록한다. 교사나 학습자료 추천 서비스 개발자가 '우리 교육청 또는 다른 교육청이 원격수업용으로 어떤 콘텐츠를 공개했는가'를 찾고 목록화하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 출처(교육청 이름) 문자열을 매핑하는 방식으로만 이어 쓴다.
