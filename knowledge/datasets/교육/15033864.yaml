summary_user: 한국사학진흥재단이 운영하는 행복기숙사별로 기숙사명, 수용인원, 1인실·2인실·3인실·4인실 이상 인실 유형별 기숙사비(천원 단위)를 담은 전국 단위 소규모 집계 파일(csv 약 2.6KB)이다. 대학생·학부모가 "이 지역 행복기숙사 2인실 비용은 얼마이고 몇 명을 받는가"를 확인하거나, 분석가가 기숙사 간 비용 격차와 인실 구성을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기숙사명이나 소재 대학·지역 이름을 맞춰 연결해야 한다.
description_portal: 한국사학진흥재단의 행복기숙사 건립 및 운영사업과 관련된 자료로, 각 기숙사의 기숙사명, 사업장별 수용인원, 그리고 1인실, 2인실, 3인실 등 인실 유형별 기숙사비 현황을 포함하고 있습니다. 이 데이터는 학생들의 주거 선택권과 비용 부담 수준을 파악하는 데 활용 가능한 자료로, 기숙사별 가격 정책 비교, 입주 수요 분석, 지역 간 기숙사비 격차 해소를 위한 정책 수립에 활용될 수 있습니다. 특히, 수용 인원과 인실 구성에 따라 산정된 기숙사비 정보를 통해 행복기숙사 사업의 운영성과 분석과 정책 개선 방향 제시에 필요한 기초 자료로 매우 유의미한 데이터를 제공합니다.※ 숫자 "0" 표기 된 데이터의 경우 해당 유형 호실 미운영
