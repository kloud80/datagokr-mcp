description_portal: '○ 통계개요* 통계명 : 학업중단율* 통계종류 : 일반·보고통계* 작성목적 : 학업중단율의 실태를 알아보고 학생들의 변동상항을 파악하여 학교교육정책의 기초자료로 활용하기 위함* 조사체계 : 서울특별시교육청* 공표주기 : 정기(매년, 4월1일 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 초등학교, 중학교, 고등학교의 학업중단율 등○ 용어설명* 학업중단율 : (학업중단자수/학생수)*100* 학업중단자 : 질병, 학교부적응, 가사, 기타 등의 사유로 인한 휴학, 자퇴, 제적, 퇴학등에 의해 학업을 중단한 자* 초등학교와 중학교는 유예 및 면제자를 학업중단자로 봄* 고등학교의 학업중단사유는 자퇴(질병, 가사, 부적응, 해외출국, 기타), 퇴학(품행)임* 학업중단자에 사망자는 포함되지 않음* 구분 연도는 학년도임(전년도 3월1일부터 당해년도 2월말까지를 한 학년도로 봄)* 2010학년도부터 인정유학, 해외이주, 파견동행이 학업중단자에 포함됨○ 기 타* 조사기준일 : 매년 4월 1일 기준○ 자 료 : 서울특별시교육청「서울교육통계연보」'
