description_portal: 정부광고법의 원활한 시행을 위해 한국언론진흥재단에서 정부광고 통합지원시스템을 운영하고 있습니다. 광고 의뢰부터 청구까지 정부광고 집행의 일련의 업무과정을 시스템화하였으며, 해당 시스템을 통해 정부광고 관련 다양한 정보를 제공하고 있습니다. 해당 데이터는 그 중 광고주 대상으로 진행되는 정부광고 교육에 대한 데이터입니다. 기관 브랜딩, 소통 컨설팅, 홍보 PR 과정, 보도자료 작성 등 각 기관의 홍보 담당자들에게 도움이 되는 교육을 추진하고 있습니다. 이에 대한 교육안내/신청 등이 시스템을 통해 이루어지며 이 정보를 공개했습니다.
