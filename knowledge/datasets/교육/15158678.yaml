summary_user: 대학알리미 공시 지표 가운데 전임교원 확보율, 전임교원 1인당 학생수·연구비·저역서 수, 전임·비전임교원 강의 담당 비율, 외국인 전임교원 현황 같은 교원·연구 지표를 학교구분·지역별로 공시연도마다 묶어 담고, 전국을 범위로 하며 6개 오퍼레이션이 실호출로 확인됐다. 수험생이나 분석가가 '이 대학의 전임교원 1인당 학생수와 확보율이 지역·같은 유형 대학 평균보다 높은가, 최근 공시연도 사이에 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키는 없어 학교명이나 같은 기관(대학알리미)의 학교구분 코드(schlDivCd)·학교 ID(schlId)로만 다른 대학 공시 데이터(학생·등록금·기숙사·재정)와 연결한다.
description_portal: 전임교원 확보율, 전임교원 1인당 학생수, 전임교원 1인당 연구비, 전임교원 1인당 저·역서 수, 전임교원 강의 담당 비율, 비전임교원 강의 담당 비율, 외국인 전임교원 현황 등 대학의 교육 및 연구 역량을 종합적으로 파악할 수 있는 다양한 지표를 포함하며, 이를 통해 교원 구성의 질적 수준과 강의 운영 구조, 연구 성과, 교육의 안정성 및 효율성, 그리고 국제화 수준 등을 다각도로 분석할 수 있는 정보를 제공. 이러한 지표들은 대학의 전반적인 경쟁력과 교육 환경의 수준을 객관적으로 평가하는 데 활용되며, 수험생의 대학 선택뿐만 아니라 대학의 중장기 발전 전략 수립과 정책적 의사결정에도 중요한 기초 자료로 기능.
