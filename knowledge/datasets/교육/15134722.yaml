description_portal: 문화체육관광부 국립국어원에서 운영하는 한국어교수학습샘터는 전 세계 한국어 교육자, 학습자, 연구자들을 대상으로 한국어 교수 학습 자료를 제공하고 있습니다. 국립국어원 개발 한국어교재와 국립국어원에서 연구한 한국어 문법 어휘 등 기초 연구 자료 등 다양한 정보를 제공하고 있는 한국어교수학습샘터의 자료는 한국어교육, 한국어 연구, 한국어학습에 활용할 수 있습니다. 본 데이터는 국립국어원 개발 최신 한국어 교육 자료를 기반으로 한국어 교육 현장에서 활용할 수 있는 교수 자료 정보를 체계적으로 제공하는 데이터입니다. 교재명, 단원명, 수준, 주제, 목표 문법, 목표 어휘, 대상, 활동, 발음 현상, 담화 유형, 문화 등 다양한 항목을 포함하고 있습니다. 이를 통해 한국어교원은 수업 준비, 커리큘럼 작성 등에 활용할 수 있으며, 한국어연구자들은 교재 연구, 자료 개발 연구 등에 활용할 수 있으며, 한국어 학습자의 한국어 학습 기반 자료로도 활용할 수 있습니다.
