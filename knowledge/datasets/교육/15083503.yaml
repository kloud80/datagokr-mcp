description_portal: 삼일운동데이터베이스는 삼일운동 기초 정보를 종합하고 GIS(지리정보체계)와 연동한 데이터베이스로 조선 소요사건 관계 서류, 일본 외무성 기록, 삼일운동 관련 판결문, 재한 선교사 자료 등 삼일운동과 관련한 자료에서 추출한 지역별, 유형별 정보를 제공합니다.주요 탄압기구인 헌병의 조직과 활동 내역을 상세히 담고 있다. 자료에는 조선총독부의 헌병대사령부를 비롯해 여러 헌병분대와 헌병주재소가 설치된 위치와 관할구역, 그리고 경찰사무 수행 범위가 포함되어 있어 일제강점기의 치안체계와 탄압기구 운영 실태를 파악할 수 있다. 특히 경기도 일대의 헌병 관할구역과 여러 분대별 관할 경찰업무 영역이 명확히 기술되어 있으며, 통합과 조직 변경 사항도 기록되어 있어 당시 헌병의 행정적 역할과 조직체계를 입체적으로 이해할 수 있도록 구성되었다. 이 데이터는 삼일운동 기록과 연계하여 헌병의 탄압 활동 연구에 중요한 기초자료가 된다.
