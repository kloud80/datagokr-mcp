summary_user: 대학정보공시 항목 '등록금 납부 제도 현황'으로, 조사년도·차수별로 학교(캠퍼스)마다 카드납부·분할납부 같은 납부방법의 실시 여부와 최초 시행년도, 이용 학생 수·이용 금액, 분납 횟수·개월 수, 학교 부담 카드수수료율을 담은 전국 단위 학교별 공시 자료입니다. 수험생·학부모가 지원하려는 대학이 등록금 카드 결제나 분할 납부를 허용하는지 확인할 때 쓰고, 분석가가 대학별 분납제도 도입 현황과 이용 규모를 비교할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 대학 공시·학자금 자료와는 학교명·본캠퍼스 구분을 이름으로 맞춰 연결해야 합니다.
limits: 학교 코드 같은 공통 식별자가 없어 다른 데이터와 붙일 때 학교명 표기 차이로 매칭이 어긋날 수 있습니다. 학생 개인별 납부 내역이 아니라 학교 단위 제도 현황이므로 개인 납부 여부나 학생 특성별 분석은 할 수 없습니다.
