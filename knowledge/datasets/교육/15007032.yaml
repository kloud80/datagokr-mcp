summary_user: 대구광역시동부교육지원청 관내 초중등학교를 학교 한 곳당 한 행으로 담은 명부로, 2024년 4월 1일 기준 학교명과 주소만 들어 있다(CSV 약 8KB). 학부모나 분석가가 동부교육지원청 관할에 어떤 학교가 있고 각 학교가 어디에 있는지 확인할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 학교 기본정보나 교원·학생 통계와는 학교명 매칭이나 주소 기반으로만 이어 쓴다.
description_portal: 해당 파일은 대구광역시교육청 산하 대구광역시동부교육지원청 초중등학교 현황 데이터입니다.2024. 4.1. 기준으로 한 대구광역시동부교육지원청 관내 초중등학교 현황에 관한 데이터로,  초중등학교의 학교명 및 학교 주소를 비롯한 기본 정보에 관한 데이터를 제공합니다.*대구광역시동부교육지원청 관할 개별 학교에 대한 구체적인 사항에 대해서는, 해당 학교 또는 관할 교육지원청(대구광역시동부교육지원청)으로 문의해 주시기 바랍니다.-동부교육지원청 행정지원과 (053-232-0153)
