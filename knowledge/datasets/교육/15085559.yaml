description_portal: '○ 통계개요* 통계명 : 특수학교* 통계종류 : 보고통계* 작성목적 : 장애학생을 포함하여 특별한 교육적 지원을 필요로 하는 모든 학생들에게적절한 교육 관련 지원, 즉 인적.물적 지원을 제공하기 위한 특수 교육정책의 기초자료로 활용하기 위함* 조사체계 : 각 학교 → 구 교육청 → 서울특별시교육청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 특수학교(급)수, 학생수 및 교원수 등○ 용어설명* 특수학교 : 시각장애자, 청각장애자, 지적장애자, 지체장애자, 정서장애자 등 특수교육대상자에게유치원, 초등학교, 중학교, 고등학교, 전공과 과정을 교육하는 학교임(전공과 과정은 특수학교에 설치된 전문직업 교육과정임)* 교실수 : 정규교실(수준별교실 포함) +가·대용교실(2014년 이전)일반교실, 교과교실, 특별교실, 수준별교실의 합(2015년 이후)○ 기 타* 조사기준일 : 매년 4월 1일 기준* 특수학교는 유치원, 초등학교, 중학교, 고등학교, 전공과과정 모두 포함* 진학자수에 전공과 진학자 포함* 교원수에 휴직교원수는 포함, 시간강사수는 불포함* 교지면적: 대지와 체육장의 합계* 건물면적: 보통 및 특별교실, 관리실, 기타의 합계'
