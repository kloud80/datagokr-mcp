description_portal: 수학에 대한 학생들의 흥미와 친밀감을 높이고, 학교 현장의 우수한 수학 교육 활동 사례를 발굴하여 공유하기 위해 한국과학창의재단에서 진행한 'AskMath 공모전' 관련 자료입니다. 특히 '파이데이(3월 14일)'와 같은 특정일을 기념하는 수학 행사에 대한 아이디어와 운영 사례를 공유하는 것을 목적으로 합니다.개방 데이터는 전국의 초·중·고등학교 교사 및 학생들이 참여한 공모전 출품작 약 150건의 목록으로 구성되어 있습니다. 데이터는 각 출품작의 '제목', '내용', '조회수', '작성자', '등록일자' 정보를 포함하고 있으며, '파이데이' 행사 운영 계획, 활동 결과 보고, 행사 사진 등 현장에서 바로 참고할 수 있는 구체적이고 창의적인 수학 행사 사례들을 담고 있습니다.수학 교사들은 이 데이터를 통해 다른 학교의 우수 사례를 벤치마킹하여 자체적인 수학 행사를 기획하거나 수업 아이디어를 얻는 데 활용할 수 있습니다. 교육 연구자 및 정책 입안자들은 현장의 다양한 수학 문화 활동 사례를 분석하여, 학생들의 수학에 대한 긍정적 태도 형성 및 수학 대중화를 위한 정책을 수립하는 데 기초 자료로 활용할 수 있습니다.
