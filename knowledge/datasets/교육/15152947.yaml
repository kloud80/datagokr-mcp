summary_user: 경기도 사이버도서관에 등록된 도서의 서지 정보를 도서 한 권당 한 행으로 담은 목록이며, 서지ID(th_id), 본표제, 부표제, 저자, 출판연도, 소장 도서관 번호 묶음을 포함한다. 도서관 담당자나 분석가가 '어떤 도서를 여러 도서관이 함께 소장하고 있는지', '저자별·출판연도별로 소장 자료가 어떻게 분포하는지'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 도서명·저자 같은 이름 매핑이나 같은 기관(경기도) 자료와의 코드 대조로만 연결한다.
description_portal: 이 데이터는 경기도 사이버도서관에 등록된 도서의 서지 정보 목록을 정리한 자료입니다. 각 도서는 고유의 서지ID를 가지며, 본표제(도서 제목), 부표제, 저자, 출판연도, 그리고 해당 도서를 소장한 도서관 번호(GROUP)로 구성되어 있습니다. 특히 GROUP 항목은 여러 도서관이 동일 도서를 소장하고 있는 경우를 나타내며, 각 도서관은 고유 번호로 식별됩니다. 이 데이터를 통해 도서의 메타데이터 분석, 도서관별 보유자료 비교, 저자별 혹은 출판연도별 출판 트렌드 파악 등 다양한 정보 분석이 가능합니다. 또한 도서관 서비스 개선 및 이용자 맞춤형 자료 제공 전략 수립에도 활용할 수 있습니다. 도서명이 영문과 한글이 혼용되어 있어 다양한 언어권 자료에 대한 포괄적 정보를 제공합니다.
