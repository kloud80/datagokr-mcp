description_portal: 이 데이터는 국립해양생물자원관에서 운영된 교육 및 문화행사에 대한 통계 정보를 체계적으로 제공하기 위해 구성된 공공데이터입니다. 이 데이터는 연도별 프로그램 운영 현황과 참여 특성을 분석할 수 있도록 설계되었으며, 기관 내부 운영 개선뿐 아니라 외부 연구, 정책 수립, 교육 서비스 비교·평가 등에 활용될 수 있습니다. 제공 항목에는 통계 식별 정보인 통계번호, 행사명을 의미하는 교육행사명, 프로그램 유형을 구분하는 신청프로그램구분, 분석 기준이 되는 기준연도, 그리고 행사 운영 기간을 확인할 수 있는 프로그램시작기간 및 프로그램종료기간이 포함됩니다. 또한 프로그램 명칭인 교육과정명, 비용 여부를 나타내는 무료여부, 참여대상을 나타내는 참여대상, 데이터 최초 입력 시점을 확인할 수 있는 최초등록일 정보를 제공합니다.
