description_portal: 한국장학재단 국제학자금포럼(국제 유관기관과 네트워크 구축, 협력 사업 확장 및 학자금 정책 성과 공유) 개최 현황으로 포럼의 기본정보인 주제, 일자, 장소, 방식, 내용, 행사 영상 정보를 제공합니다.국제학자금포럼 영상은 재단 누리집(https://www.kosaf.go.kr/ko/media.do?pg=media05_03)에서 확인가능합니다.한국장학재단의 사업 내용 및 홍보요청 등 보도자료 배포시 홍보대상 분류현황에 따라서  통지 관리가 되고 있으므로  홍보대상의 분류를 보다 세분화 및 구체화시켜  지속적인 관리를 수행하고 있습니다. 한국장학재단은  "한국장학재단 설립 등에 관한 법률 제정"으로 2009년 5월 설립되어, 경제적 여건에 관계없이 누구나 의지와 능력에 따라 고등교육의 기회를 가질 수 있도록 전문적이고 종합적인 학자금 지원을 수행하기 위해  현재까지 운영되고 있습니다. 한국장학재단은 청년들의 꿈을 지원하기 위해 국가장학금 및 학자금대출을 지원하고 있고, 국가우수장학금, 기부장학금, 멘토링 등으로 다양한 영역에서 지원을 요청하는 학생들을 위해서 애쓰고 있습니다. 대학생 뿐만 아니라 꿈과 재능을 가진 저소득층 초중고생의 교육활동 기회를  보장하고, 고졸 청년들의  사회적 기반 마련을 위한 고졸 취업 활성화 지원에 앞장서는 등 지원 대상과 범위를 넓혀가고 있습니다. 이렇듯 앞으로도 국가와 사회를 위해 일한다는 사명감과 의무감을 가지고 학생 및 학부모와 대학의 실질적인 부담을 줄일수 있도록, 한국장학재단의 다양한 사업을 효율적으로 홍보하고 알리기 위한 방안으로 국제학자금 포럼 개최 등 대외협력을 위한 노력도 최선을 다하고 있습니다.
