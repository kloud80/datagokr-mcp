description_portal: 대구광역시 서구의 비산도서관 자료 현황입니다. 도서 총류, 철학, 종교, 사회,순수, 기술, 예술, 언어, 문학, 역사별 자료 현황입니다.2016년 6월 개관한 비산도서관은 대구광역시 서구 달서로 14길 13에 위치하고 있다.지상 1층에서 4층까지 구성되어 있으며, 1층에는 어린이자료실, 유아자료실이 있고, 2층에는 종합자료실이 있으며, 3층에는 문화강좌실, 보존서고, 4층에는 옥상정원이 있다.총 31,705권의 서적을 보유하고 있다. 유아 3,956권, 어린이 9,823권, 일반 17,926권이 있다.
