description_portal: 평생학습 사회 구현과 지역 주민의 독서 문화 확산에 대한 요구가 증가하면서, 접근성이 높은 생활 밀착형 도서관 서비스에 대한 수요가 지속적으로 커지고 있으며, 대형 공공도서관과 차별화된 소규모 특화 서비스를 제공하는 작은도서관의 역할이 중요해지고 있습니다. 지역 공동체 활성화와 주민 간 소통 증진을 위한 문화 공간으로서 작은도서관의 기능이 확대되고 있으며, 어린이와 청소년을 위한 특화된 독서 교육 프로그램과 가족 단위 문화 활동 공간에 대한 필요성이 증가하고 있습니다. 민간 부문의 자발적 참여와 창의적 운영을 통한 다양한 도서관 서비스 모델 개발이 활발해지고 있으며, 지역 특성을 반영한 맞춤형 독서 문화 프로그램 제공과 주민 자치적 도서관 운영이 확산되고 있습니다. 또한 작은도서관 네트워크 구축과 공공도서관과의 연계 서비스 강화를 통한 지역 도서관 생태계 조성의 중요성이 증대되고 있으며, 작은도서관 운영 지원과 서비스 품질 향상을 위한 체계적인 현황 파악이 필요하게 되어, 충청남도 보령시는 관내 34개소 사립작은도서관의 운영 현황, 장서 보유량, 시설 규모 등 지역 독서 문화 발전과 작은도서관 지원 정책 수립에 필요한 종합적인 사립작은도서관 현황 정보를 제공하고 있습니다.
