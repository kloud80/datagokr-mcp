description_portal: 본 자료는 한국유학종합시스템을 통한 외국인 유학생의 온라인 입학신청 현황을 국적별, 학위과정별로 상세히 분석한 통계 자료입니다. 주요 국가별 학사, 석사, 박사 등 다양한 학위 지원자 수와 어학연수, 교환학생 현황이 포함되어 있으며, 남녀 결제자 수에 대한 통계도 제공됩니다. 미리보기 데이터를 통해 우즈베키스탄, 중국, 파키스탄, 인도 등 다수 국가 지원자의 입학 신청 내역을 확인할 수 있습니다. 이 데이터는 유학생 유치 및 정책 수립에 중요한 기준을 제공하며, 과거 입학 지원자 현황과 온라인 접속 통계 등 13건의 주기적 자료와 함께 동향 파악에 활용됩니다.외국인의 국내대학 유학을 위한 "Study in Korea"(한국유학종합시스템)을 통한 온라인 지원서 제출 등 입학 지원자의 주제별(국적별) 현황
