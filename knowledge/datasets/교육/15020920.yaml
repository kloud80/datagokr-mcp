description_portal: 공간정보아카데미는 국가인적자원개발컨소시엄 공동훈련센터로 7년 연속 최우수훈련기관으로 선정되었습니다. 공간정보아카데미는 국가 차원의 4차 산업 성장을 위해 공간정보, 인공지능, 오픈소스GIS, 파이썬 등 전문적인 교육을 실시하고 있습니다. 교육과정은 근로자들을 위한 "재직자 향상 교육과정"과 취업준비생들을 위한 "공간정보 응용 S/W 전문가 양성 과정"으로 구분됩니다. 공간정보아카데미 홈페이지는 교육구분, 과정명, 교육과정 시작일 및 종료일, 교육정원을 다루고 있습니다.
