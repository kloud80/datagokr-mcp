description_portal: '해당 데이터는 한국학중앙연구원 장서각이 소장한 『금위영등록(禁衛營謄錄)』의 원문 텍스트를 이미지 기반으로 디지털화한 자료입니다. 문서 내에는 고유 날짜 표시(예: ○○년 ○○월 ○○일)와 함께 각종 사건, 명령, 군사 배치, 인사 발령 등이 상세히 기록되어 있으며, 조선 후기 중앙 군영인 금위영의 일상적 행정 및 군사 운영 내용을 담고 있습니다. 또한 다수의 군사 단위(예: 병, 군관, 군사 수, 보급량 등)와 조치 사항, 명령어구가 반복적으로 나타나 있어 당시의 군정 체계와 대응 방식을 파악하는 데 유용한 정보를 제공합니다. 이 데이터는 고전 문헌의 정밀한 디지털 분석, 고유명사 추출, 자연어처리 기반 모델 훈련 등 다양한 디지털 인문학 연구에 활용될 수 있습니다.'
