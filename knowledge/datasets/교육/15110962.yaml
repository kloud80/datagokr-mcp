summary_user: 교육과정별로 발행된 교과서를 한 권씩 담은 전국 단위 목록 파일(CSV 약 6.9MB)로, 교육과정·출판연도·국정/검정/인정 구분·학교급·서명·저자·발행처·정가·사용학년·저시력 확대교과서 여부를 기록한다. 연구자나 교사가 '1966년 교육과정 때 중학교 작문·문법 교과서는 어느 출판사·저자가 냈고 값은 얼마였나'처럼 시기별 교과서 발행 현황과 출판사 변화를 살피는 데 쓴다. 실측 컬럼에 학교코드 같은 전역 조인 키가 없어 다른 학교·통계 데이터와는 교육과정명·학교급·출판사명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 학교 일반학교 보통교과용 교과서 목록으로 1966년 교육과정에 따른 인정 교과서들이 포함되어 있습니다. 주요 교과서 출판사는 정음사, 민중서관, 을유문화사, 동아출판사 등이며 이를 통해 국검인정 교과서 현황과 교육 내용을 파악할 수 있습니다. 다양한 저자들의 중학작문, 중학문법, 중학한자교본 등 서명이 상세히 기록되어 있어 중학교 교육과정과 교과서 출판사의 정보, 저자 및 서명 내용을 종합적으로 이해하는 데 유용한 자료임을 알 수 있습니다. 파일 데이터 일부가 미리보기로 제공되며 전체 내용은 파일 다운로드를 통해 확인 가능합니다.교과서목록표교과서 정보관 사이트 https://kotry.kr 접속 -> 공공데이터 메뉴 -> 교과서 목록받기 -> 다운로드교육과정, 출판년도, 국/검/인정, 자료형태, 학교급, 학교구분, 서명, 저자, 행처(출판사), 정가, 사용학년
