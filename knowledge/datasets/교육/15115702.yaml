description_portal: 서울특별시 중랑구 소재 유치원의 각종 보험 가입 현황입니다. 주요 제공 항목으로는 유치원명, 설립유형, 가입보험명, 대상여부, 가입여부, 업체명, 공시차수, 주소 등의 정보를 포함합니다. 데이터의 원본시스템은 유치원 알리미입니다. 교육청명과 교육지원청명은 서울특별시교육청, 동부교육지원청입니다. 설립유형으로는 공립(병설), 사립(사인)이 있습니다. 가입보험명은 가스배상책임보험, 통학버스 책임보험 등이 있습니다. 자세한 사항은 서울특별시 열린데이터 광장에 접속하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
