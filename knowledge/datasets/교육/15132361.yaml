description_portal: 이 데이터는 한국사능력검정시험의 회차별 통계 정보를 제공합니다. 각 시험의 연도, 회차, 시험일, 정기 및 추가 접수 시작·종료일, 급수, 평균 점수, 표준편차, 합격자 수 등의 항목이 포함되어 있습니다. 이러한 정보는 시험 일정 관리, 수험자 분석, 교육 정책 수립 등에 활용될 수 있습니다. 예를 들어, 2017년부터 2021년까지 다수의 회차별 시험에서 각 급수별 점수와 합격자 수 변화가 기록되어 있어 시험의 난이도와 응시자 분포를 분석할 수 있습니다. 이 데이터는 한국사시험 준비와 연구에 중요한 기초 정보로 활용됩니다.
