description_portal: 교육부 학생건강정책과가 작성한 연도별 학생 법정 감염병 현황으로, 나이스시스템을 통해 보고된 학생 신고 기반 데이터를 활용했습니다. 감염병예방법에 근거한 국가감염병 감시체계와 차이가 있을 수 있지만, 학생건강과 감염병 통계 파악에 중요한 자료로 활용됩니다. 학교와 교육청 간의 신고 체계를 바탕으로 학생들의 건강 상태를 체계적으로 관리하는 데 기여하는 의미 있는 현황 자료입니다.※ 본 자료는 나이스시스템(NEIS)를 통해 보고된 자료를 바탕으로 작성된 자료로, 학생측의 신고를 받아 학교가 교육청에 보고한 현황입니다.   "감염병예방법"에 근거한 국가감염병 감시체계를 통해 집계한 현황과 차이가 있을 수 있습니다.
