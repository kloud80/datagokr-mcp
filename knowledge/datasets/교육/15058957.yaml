summary_user: 경기도 소재 대학·전문대학의 신입생 충원 현황을 학교별로 담은 집계 데이터로, 기준연도(STD_YY)와 학교종류·설립구분별로 입학정원, 모집인원·지원자·입학자 수(정원내·정원외, 성별), 정원내 신입생 충원율과 경쟁률을 제공한다. 진학을 고민하는 학생·학부모나 교육 분석가가 "경기도 안에서 정원내 충원율이 낮아 충원이 불안정한 대학은 어디인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키나 표준 학교코드가 없어, 다른 학교 기본정보·통계와는 학교명 매핑으로만 이어 붙인다.
description_portal: 이 데이터는 대학 및 전문대학의 신입생 충원 현황을 보여주며, 각 모집 단위별 입학정원과 실제 지원자 및 입학자 규모를 비교할 수 있도록 구성되어 있습니다. 정원내·정원외 구분, 성별 입학자 수, 주야간 과정 정보 등이 함께 제공되어 대학별 충원 구조와 전공별 학생 선호도를 다각도로 분석할 수 있습니다. 특히 정원내 신입생 충원율과 경쟁률 지표는 대학의 충원 안정성과 학과의 경쟁력을 나타내는 핵심 자료로, 지역 간 교육 수급 격차를 확인하거나 특정 학문 분야에 대한 수요 변화를 파악하는 데 활용할 수 있습니다.
