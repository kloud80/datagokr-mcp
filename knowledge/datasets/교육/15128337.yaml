summary_user: 서울 광진구 안의 학원·교습소를 시설(교습 과정)별로 한 행씩 담은 원천 목록으로, 학원명·지정번호·등록상태·설립/등록일·휴원 시작·종료일·정원과 일시 수용 인원·교육분야·계열·과정·수강료·기숙사 여부·도로명주소를 포함한다. 학부모가 광진구 특정 동에서 지금 운영 중인 입시·예체능 학원과 수강료를 찾거나, 분석가가 동별 학원 밀집도를 보고 학원 상권·주택 수요를 가늠하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 학원명·주소(도로명주소·우편번호)나 행정동명 매칭으로 잇고, 다른 교육청·자치구의 학원·교습소 파일과 같은 컬럼 기준으로 합쳐 쓴다.
description_portal: '서울특별시 광진구_학원교습소정보 데이터는 광진구 내에서 운영 중인 학원 및 교습소의 현황을 담고 있으며, 학원명, 휴원일자, 등록상태, 정원, 교육분야, 계열 및 세부과정 등의 정보를 포함합니다. 학원명은 각 교육기관의 공식 명칭을 나타내며, 휴원일자는 임시 휴업 중인 기관의 휴업 시작일이나 예정일을 제공합니다. 등록상태 항목을 통해 해당 시설이 현재 정상 운영 중인지, 폐원 또는 휴원 중인지 여부를 확인할 수 있습니다. 정원 항목은 교육 수강이 가능한 최대 인원 수를 나타내며, 분야 및 계열 정보는 해당 기관이 제공하는 교육내용의 일반적인 주제와 전문 분야를 구분하는 기준을 제시합니다. 과정 항목은 구체적인 교육 프로그램의 성격이나 수준(예: 초등보충, 예체능, 입시전문 등)을 나타냅니다. 본 데이터는 지역 내 사교육 현황 파악, 학부모의 학원 선택, 행정기관의 교육정책 수립 등에 활용됩니다.'
