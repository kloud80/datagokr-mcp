description_portal: 본 데이터는 서울시 구로구 유치원 직위 자격별 교직원 현황과 관련된 정보를 제공하는 공공자료이다. 자료에는 교육청명, 교육지원청명, 유치원코드, 유치원명, 설립유형, 원장수, 원감수, 수석교사수, 보직교사수, 일반교사수, 특수교사수, 보건교사수, 영양교사수, 기간제교사수, 강사수, 사무직원수, 수석교사자격수, 공정교사1급자격수, 정교사2급자격수, 준교사자격수, 공시차수, 주소 등의 항목이 포함된다. 본 자료는 유치원 인적자원의 구성과 자격 현황을 분석하고 교육정책 수립, 연구 활용, 행정 지원, 민원 처리 등 다양한 분야에서 활용된다. 데이터는 표준화된 구조로 제공되어 통계 작성과 비교 분석에 유용하다.
