summary_user: 경기도 내 초·중·고등학교와 특수학교별로 소속 직원 수를 기준연도(STD_YY)마다 일반직·별정직·기타직(무기계약 근로자) 직종과 남녀로 나눠 담은 학교 단위 집계 데이터다. 교육 분석가나 학부모가 특정 시군·교육지원청 관할 학교의 행정·지원 인력 배치 규모와 직종 구성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 학교 기본정보·교원·학생 통계와는 학교명이나 정보공시 학교코드(INFO_PBLNTF_SCHOOL_CD)·시군 코드 같은 이름·코드 매핑으로 이어 쓴다.
description_portal: '경기도 내 초등학교, 중학교, 고등학교 및 특수학교에 소속된 직원들의 근무 현황을 정리한 데이터로, 각 학교별로 재직 중인 다양한 유형의 직원 수를 세분화하여 제공합니다. 주요 항목으로는 학교명, 일반직 남자 수, 일반직 여자 수, 별정직 남자 수, 별정직 여자 수, 그리고 기타직 인원 등으로 구성되어 있으며, 이를 통해 학교별 직종별 인력 배치 현황을 확인할 수 있습니다.일반직 : 기술, 연구 또는 행정 일반에 대한 업무를 담당하는 공무원입니다.별정직 : 비서관, 비서 등 보좌 업무 등을 수행하거나 특정한 업무 수행을 위하여 법령에서 별정직으로 지정하는 공무원입니다.기타직 : 각급 학교에서 교육 및 행정업무 등을 지원 또는 보좌하기 위하여 기간의 정함이 없는 계약을 교육청 또는 학교장과 체결한 무기계약 근로자입니다.(계약 주체와 관계없이 근무지에서 입력)'
