description_portal: 고용노동부에서 관리하는 배우리 교육시스템의 콘텐츠강의정보에 대한 데이터(등록연도, 콘텐츠명, 교육시간 등) 입니다.＊이러닝(사이버)교육 과정이란, 인터넷 등 다양한 정보통신기술에 의한 사이버공간을 활용하여 학습자가 시간과 공간의 제약없이 원하는 교육시스템에 편리하게 접근하여 학습자와 강사간 또는 핛습자간 상호작용을 통해 학습자 중심의 자기 주도적인 학습이 가능한 교육방법을 의미합니다.＊ 우리 부에서는 사이버교육과정을 운영하고 있으며, 역량(인공지능, 빅데이터, 디지털) 분야, 직무(고용, 노동)분야 등으로 구성되어 있습니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않을 수 있으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.
