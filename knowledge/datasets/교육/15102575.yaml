description_portal: 경남지역 작은도서관에 대한 데이터 항목 자료를 제공합니다. 해당 데이터는 광역시도, 시군명, 도서관명, 주소, 전화번호, 개관년도, 도서관구분, 설립주체 등의 정보를 포함하고 있습니다. 도내에 분포한 작은도서관의 운영 실태와 기본 정보를 체계적으로 수록한 자료로 지역 주민의 정보 접근성 향상과 독서문화 증진을 목표로 합니다.  이를 통해 경상남도 내 작은도서관의 지역별 분포, 시설 규모, 운영 형태 등을 파악할 수 있어, 공공문화 인프라의 현황 진단과 정책 수립 등의 행정적 의사결정에 활용될 수 있습니다.
