summary_user: 경상북도영양교육지원청이 관리하는 영양군 내 폐교 재산을 학교별로 한 행씩 담은 파일 데이터로, 폐교명·폐교일자·소재지와 지목·구조·면적·임대 현황·임대 만료일을 담는다(파일 크기 약 1.6KB). 지자체·민간기업·연구자가 '영양군에서 임대가 곧 끝나거나 활용되지 않는 폐교 부지가 어디이고 면적은 얼마인가'를 확인해 임대·매각이나 지역 개발 검토에 쓴다. 전역 조인 키가 없어 폐교명이나 소재지 주소를 기준으로 학교 기본정보·다른 교육지원청 폐교현황과 이름 매칭으로 이어 쓴다.
limits: 학교 코드 같은 공통 키가 없어 다른 데이터와는 학교명·주소 문자열 매칭으로만 연결된다. 영양군 한 지역의 개별 폐교 목록이라 경상북도 전체나 전국 폐교 현황은 다른 교육지원청 자료를 따로 모아야 한다.
