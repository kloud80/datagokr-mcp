summary_user: 학교알리미 공시 중 공통내역을 담은 파일로, 학교별 공시연도·공시차수에 따른 전년도·공시연도 전체 학생 수(야간 포함), 총교사 수, 수업교사 수, 특수교사 수를 전국 범위로 담는다. 교육 분석가가 학교별로 교사 1인당 학생 수가 어떻게 달라졌는지, 전년도 대비 학생 수가 얼마나 줄었는지를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 학교 기본정보 등 다른 학교 데이터와는 학교명 같은 이름·코드 매핑이나 같은 기관(한국교육학술정보원) 코드로만 이어 쓴다.
description_portal: '- 학교알리미 공시공통내역은 전국 모든 초·중·고등학교가 매년 의무적으로 공개하는 기본 데이터입니다.- 공시 항목:- 학교 일반현황 (학교명, 설립유형, 위치, 설립일)- 학생·교원 현황 (학급 수, 학생 수, 교원 수)- 교육여건 (교지·교사 면적, 시설 현황)- 재정 현황 (학교회계 예·결산, 교육비 부담)- 공시 시기: 매년 4월, 9월 정기 공시 + 필요 시 수시 공시'
