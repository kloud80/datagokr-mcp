summary_user: 국가자격 취득자 수를 취득연도·월, 지역, 연령대, 성별, 자격구분·계열·종목별로 집계한 전국 단위 파일(CSV 약 27MB)이다. 분석가나 정책 담당자가 '특정 종목의 자격 취득자가 연령대·지역별로 어떻게 늘거나 줄었나' 같은 인력 수급 질문에 쓴다. 전역 조인 키가 없어 종목명·지역명 같은 이름 매칭이나 같은 기관(한국산업인력공단)의 종목 코드로만 시험 일정·합격률 등 다른 자격 데이터와 이어 붙인다.
limits: 개인 단위가 아닌 집계 수치만 담아 개별 취득자나 자격 보유 여부 확인에는 쓰지 못한다. 공통 코드 키가 없어 다른 데이터와 연결할 때 종목명·지역명 표기 차이를 직접 맞춰야 한다.
