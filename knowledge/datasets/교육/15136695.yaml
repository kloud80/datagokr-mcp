summary_user: 우정인재개발원 학사행정시스템에서 쓰는 교육과정 분류표로, 자체교육·위탁교육·기본교육·전문교육·공통전문교육 등의 분류를 한 행씩 담고, 상위 분류 번호로 계층을 이루며 사용 여부를 표시한다(전국 단위·비공간, CSV 약 2KB의 작은 코드표). 우정 분야 교육 담당자나 분석가가 "우정인재개발원의 교육과정은 어떤 유형으로 나뉘고, 현재 쓰는 분류와 폐지된 분류는 무엇인가"를 확인할 때 쓴다. 다른 데이터와 공유하는 전역 조인 키는 없어서, 같은 기관의 교육과정·수강 데이터와 과정분류번호나 분류명을 맞춰 붙여 쓰는 것이 유일한 연결 방법이다.
description_portal: 우정인재개발원 내부 행정 프로그램인 학사행정시스템에서 자체교육, 기본교육, 전문교육 등 교육 과정에 대한 분류 정보가 담겨있는 테이블입니다.학사행정 초창기부터 사용되었던 교육과정에 대한 분류이며, 각 교육 과정의 유형을 명확히 구분하여 교육 운영의 효율성을 높이기 위해 사용됩니다.'자체교육', '위탁교육', '전문교육', '기본교육', '공통전문교육' 등 다양한 교육 유형을 계층적으로 나누고, 각 분류의 사용 여부를 함께 표시하여 교육 체계의 구조와 운영 상태를 효율적으로 관리할 수 있도록 구성된 데이터입니다.현재는 이름이 변경되거나 폐지된 교육방식이 모두 포함되어 있습니다.
