summary_user: 경기도 내 대학별로 기준년도마다 외국 대학에 파견한 학생 수(DISPTC_PSN_CNT)와 외국 대학에서 유치한 학생 수를 학교종류(대학교·교육대학 등)와 설립구분(국립·사립)과 함께 담은 대학 단위 집계 자료다. 교육 행정 담당자나 연구자가 "경기도 사립대학 중 교환학생 파견 대비 유치가 많은 곳은 어디인가" 같은 국제 교류 규모·균형 비교에 쓴다. 실측 컬럼에 표준 학교코드 같은 전역 조인 키가 없어, 다른 학교 기본정보·통계와는 학교명(SCHOOL_NM)과 기준년도로 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 경기도 내 대학이 외국 대학과 교류한 현황을 정리한 자료로, 학생 교환 규모와 국제화 수준을 보여줍니다. 각 대학별로 자교에서 외국 대학으로 파견한 학생 수와 외국 대학에서 유치한 학생 수가 기록되어 있으며, 기준년도, 학교종류명(대학교·교육대학 등), 설립구분(국립·사립) 정보가 포함됩니다. 이를 통해 대학별 국제 교류 규모, 파견과 유치 간 균형, 학교 유형별 교류 특성을 비교할 수 있습니다. 이 데이터는 대학의 국제화 전략 평가, 교환학생 프로그램 운영 성과 분석, 글로벌 교육 협력 정책 수립 등 교육 행정과 연구에 기초자료로 활용될 수 있습니다.
