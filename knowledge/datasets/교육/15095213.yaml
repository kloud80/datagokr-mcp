summary_user: 서울 종로구 관내 유치원별로 가입한 보험의 종류, 가입 여부, 보험사(최대 3곳)를 담은 유치원·보험 단위의 원천 목록으로, 유치원알리미 자료를 서울 열린데이터광장(data.seoul.go.kr)을 통해 제공한다. 학부모가 "우리 동네 유치원이 배상책임·화재 같은 보험에 가입했는가"를 확인하거나, 구청·교육청 담당자가 보험 미가입 유치원을 점검할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 유치원 코드(KINDERCODE)나 유치원명·주소로 같은 유치원알리미 계열 데이터나 어린이집 데이터와 매핑해 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 유치원의 보험별 가입현황을 제공하는 공공자료입니다.자료에는 각 유치원의 보험 가입 여부, 보험종류, 보장 범위 등 세부 항목이 포함되어 있으며, 유아의 안전 확보와 교육기관의 위험관리 강화를 위한 행정정책 수립에 활용됩니다.이 데이터는 지방자치단체와 교육청이 보험 가입률을 점검하고 취약 유치원을 지원하기 위한 근거자료로 제공되며, 보육환경 개선, 안전사고 예방 대책 마련, 재정 지원 계획 수립 등 다양한 정책 추진을 지원합니다.또한 연구기관과 민간에서는 유아교육 안전관리 체계 연구, 교육기관 리스크 분석, 보험제도 개선 검토 등에 활용할 수 있습니다.  종로구의 유아교육 환경 안전성과 행정업무 효율성을 높이는 중요한 행정자료입니다.  *유치원알리미(https://e-childschoolinfo.moe.go.kr) 에서 제공되는 자료입니다.
