summary_user: 한국산업인력공단 직업방송(jobplusTV)의 일자별 편성표와 프로그램 정보(방송 시간·회차·출연진·개요 등)를 담는 전국 단위 비공간 API로, 편성 목록(airList)과 프로그램 목록(programList) 두 오퍼레이션으로 나뉜다. 시청자나 직업교육 콘텐츠를 안내하는 서비스 운영자가 "특정 날짜에 직업방송에서 어떤 프로그램을 몇 시에 방영하는가"나 "관심 프로그램의 다음 방송 회차는 언제인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 프로그램 제목 같은 이름 매칭이나 같은 기관(한국산업인력공단) 데이터 수준으로만 연결한다.
limits: 다른 데이터와 직접 이을 공통 코드가 없어 연계는 제목 등 이름 매칭에 의존한다. 국가자격 부문으로 분류돼 있으나 담는 내용은 방송 편성 정보이며, 자격 종목·시험 일정·합격률 같은 자격 데이터는 들어 있지 않다. 개발계정은 일 10,000회 호출로 제한된다.
