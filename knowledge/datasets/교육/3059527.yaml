description_portal: 이 데이터는 내국인을 대상으로 한 외국정부초청장학생의 국가별 선발 인원 현황을 연도별로 자세히 제공하고 있습니다. 일본, 중국, 대만 등 다양한 국가에서 선발된 장학생 수가 포함되어 있는데, 이를 통해 국제 교육 교류의 추세와 유학 파견 현상을 파악할 수 있습니다. 미리보기에서는 1965년부터 최근까지의 데이터 일부가 제공되며, 전체 내용을 확인하려면 별도의 다운로드가 필요합니다. 또한 과거 데이터와 연속성을 가지고 있어 선발 현황의 변화를 종합적으로 분석하는 데 유용합니다.내국인을 대상으로 선발된 외국정부초청장학생에 대한 데이터로 국가, 연도에 따른 선발 인원 현황을 제공하고 있습니다.
