description_portal: '집합연수 관련 서비스 편의를 위해 제공되는 중소벤처기업연수원 홈페이지에 신규로 회원가입하신 분들 중 개인고객 현황입니다. 기준년월에 따라 신규가입자(개인고객) 건수를 공개하오니, 아래에 컬럼에 해당하는 데이터를 확인해 주십시오.- 컬럼명 : 기준년, 1~12월, 총 누적 건수데이터를 통해 중소벤처기업 연수원 홈페이지 연도별, 월별 개인고객 신규가입자 현황을 확인할 수 있습니다. 또한, 연도별 월별 개인고객 신규가입 분포를 확인할 수 있습니다.중소벤처기업연수원 홈페이지는 중소벤처기업-숲(ssup.kosmes.or.kr)으로 변경되었습니다.'
