description_portal: 디지털 전환 가속화와 정보격차 해소에 대한 사회적 요구 증가로 시민 대상 정보화교육의 중요성이 대두되고 있으며, 다양한 계층의 디지털 역량 강화 및 교육 프로그램 정보에 대한 수요가 증가함에 따라 보령시는 시민 정보화교육 운영 정보를 제공하고 있습니다.개방 데이터는 교육명, 교육기간(시작일, 종료일), 요일, 장소, 신청방법, 신청기간, 교육문의 등의 항목으로 구성되어 있습니다. 해당 데이터는 2026년 교육일정안을 토대로 작성되었으며, 추후 교육일정이 확정되면 내용이 수정될 수 있습니다.지자체·교육기관은 시민 정보화교육 운영 현황 분석, 수요 조사 및 맞춤형 교육 프로그램 개발에 활용하고, 연구기관·학계는 지역별 디지털 리터러시 교육 실태 분석, 정보격차 해소 정책 연구 및 교육 효과성 평가에 활용하며, 시민은 본인에게 적합한 정보화교육 프로그램을 검색하고 신청하여 디지털 역량을 향상시킬 수 있습니다. 또한 민간 교육기관은 지역 내 정보화교육 수요 파악 및 교육과정 기획에 참고할 수 있습니다.
