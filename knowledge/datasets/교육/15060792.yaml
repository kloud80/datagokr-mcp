summary_user: 인천광역시 미추홀구 관내 초·중·고등학교, 특수학교, 평생교육시설을 학교 한 곳당 한 행으로 담은 목록 파일로, 설립 형태(공립·사립), 유형, 학생수, 도로명주소, 전화번호, 위경도 좌표를 포함한다. 주민이나 분석가가 "미추홀구 안에 어떤 학교가 어디에 있고 학생 규모는 어느 정도인가"를 확인하거나 학교 배치를 지도로 분석할 때 쓴다. 표준 학교코드 같은 전역 조인 키가 없어 다른 학교 통계·재정 데이터와는 기관명(학교명) 매칭으로 잇고, 위경도·주소로 공간 데이터와 겹쳐 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구의 관내학교 현황 정보를 담고 있습니다. 연번, 구분, 설립별, 유형, 기관명, 학생수, 도로명주소, 우편번호, 교무실전화번호, 행정실전화번호, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 초등학교, 중학교, 고등학교, 특수학교, 평생교육시설의 위치와 현황을 파악할 수 있으며, 각 학교의 학생 수와 설립 형태를 확인할 수 있습니다. 공립과 사립으로 구분되며, 남·여·공학 학교가 모두 존재합니다. 각 학교의 위경도 좌표를 통해 정확한 위치를 확인할 수 있으며, 교무실과 행정실 전화번호를 통해 학교와 연락할 수 있습니다. 이 데이터는 지역 내 교육기관 현황 파악, 학교 배치 분석, 교육 인프라 연구 등에 활용될 수 있습니다.
