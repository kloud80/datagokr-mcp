summary_user: 경기도청소년수련원과 야영장 소속 인력의 적십자 응급처치 자격 보유 현황을 구분별로 연도·월 단위로 집계해 담으며, 현원과 응급처치 자격인원, 데이터 기준일자가 함께 들어 있다. 시설 안전관리 담당자나 분석가가 "수련원 직원 중 응급처치 자격을 가진 사람의 비율이 월별로 어떻게 바뀌었나"를 점검하거나 다음 응급처치 교육 계획을 세울 때 쓴다. 실측 컬럼에서 다른 데이터와 붙일 전역 조인 키는 찾지 못했으므로, 시설 이름을 맞추거나 같은 기관(경기도) 자료끼리 연도·월 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기도청소년수련원 및 야영장 소속 인력의 적십자 응급처치 자격 취득 현황을 연도와 월 단위로 기록한 자료입니다. 항목에는 구분, 현원, 연도, 월, 응급처치 자격인원, 데이터 기준일자가 포함되어 있으며, 응급상황 대응 능력 향상을 위한 교육 이수 상태를 체계적으로 파악할 수 있습니다. 특히 응급처치 교육은 직원들이 2년마다 주기적으로 수료해야 하는 법정교육으로, 자격보유 현황은 각 시설의 안전관리 실태를 반영하는 중요한 지표입니다. 본 자료는 자격보유율 분석, 안전관리 인력 확보 수준 점검, 향후 응급처치 교육 계획 수립 등에 활용 가능합니다.
