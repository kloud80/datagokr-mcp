summary_user: 한국인터넷진흥원 사이버보안인재센터가 운영하는 보안교육 과정의 계획을 과정·차수별로 담은 작은 파일(약 1.6KB CSV)로, 교육명, 교육시간, 수강료, 차수, 지역(교육유형), 교육 시작·종료일자를 담는다. 보안 분야 취업·이직을 준비하는 사람이나 기업 교육 담당자가 '올해 어떤 보안교육이 언제, 어디서, 얼마에 열리나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육명이나 같은 기관 자료를 이름으로 맞춰 연결해야 한다.
description_portal: '사이버보안인재센터에서 제공하는 교육계획 정보는 교육명, 교육시간, 수강료, 차수, 지역(교육유형), 교육기간 등 다양한 항목으로 구성되어 있어 교육 대상자가 필요로 하는 상세한 정보를 쉽게 확인할 수 있도록 체계적으로 정리되어 있습니다. 이 정보를 통해 교육 참여자는 각 교육 과정의 구체적인 내용과 일정, 비용 등을 한눈에 파악할 수 있으며, 자신에게 적합한 교육 프로그램을 선택하는 데 큰 도움을 받을 수 있습니다. 또한, 교육은 지역별로 나누어져 있어 교육 장소 및 유형에 따른 맞춤형 학습이 가능하며, 차수별로 세분화되어 교육 기회를 효율적으로 배분하고 있습니다. 사이버보안 분야의 전문 인재 양성을 목표로 하는 이 교육 프로그램들은 최신 보안 기술과 동향을 반영하여 구성되어 있으며, 수강생들의 역량 강화와 실무 적용 능력 향상을 위한 다양한 강의와 실습을 포함하고 있습니다. 이를 통해 사이버보안인재센터는 체계적이고 효과적인 보안 교육 운영으로 산업 전반의 보안 수준 향상에 기여하고 있습니다.- 컬럼명 : 교육명, 교육시간, 수강료, 차수, 지역(교육유형), 교육기간'
