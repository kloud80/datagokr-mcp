description_portal: 2013년부터 2025년까지 국가직공무원 인재개발 중추기관인 국가공무원인재개발원에서 실시한 역량진단 결과 관련 통계자료입니다. 다면진단은 고위공무원단후보자(중앙부처 과장급)과정과 과장후보자(서기관)과정을 대상으로 교육생 본인·상사·동료·부하가 참여하여 실시합니다.여기에서 데이터는 다면진단의 연도별 평가횟수와 참여자 인원수를 집계하여 체계적으로 제공합니다. 본 자료는 공무원 역량개발, 교육과정 개선 및 인사관리 정책 수립에 활용할 수 있는 기초 데이터를 포함하고 있습니다.
