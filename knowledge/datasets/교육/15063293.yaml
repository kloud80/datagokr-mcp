description_portal: 이 자료는 교육부 중앙교육연수원이 집합교육의 방법별 운영현황을 이수인원 기준으로 제공하는 데이터입니다. 이 데이터는 강의, 경험식, 참여식 교육 방법에 따라 최근 여러 해에 걸쳐 집합교육 운영 현황을 체계적으로 정리한 것으로서, 2020년, 2021년, 2022년도의 주기성 과거 자료도 포함되어 있어 장기간의 추세 분석이 가능합니다. 이로써 교육방법별 집합교육의 현황과 변화를 파악하는 데 중요한 자료로 활용됩니다.중앙교육연수원의 집합교육 방법별(강의, 경험, 참여식) 이수인원 데이터를 제공 합니다.
