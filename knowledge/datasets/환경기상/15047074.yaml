description_portal: '○ 통계개요* 통계명 : 가로녹시율(구별)* 통계종류 : 서울시 가로 녹시율을 도로기능별로 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 도로기능별 녹시율 현황을 파악하여 도시경관을 보호하고시민의 건강ㆍ휴양 및 정서생활 향상에 기여하기 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 조경과* 공표주기 : 정기(매년, 1월 1일기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 자치구별 가로녹시율 현황 등○ 용어설명* 녹시율(綠視率) : 일정 지점에 서 있는 사람의 시계내에서 식물의 잎이 점하고있는 비율을 말함* 간선도로 : 도시내 주요지역을 연결하거나 도시 상호간을 연결하여 대량통과교통을 처리하는 도로* 보조간선도로 : 주간선도로를 집산도로 또는 주요 교통발생원과 연결하여도시교통의 집산기능을 수행하는 도로로서 근린생활권의 외곽을 형성하는 도로* 집산도로 : 근린생활권의 교통을 보조간선도로에 연결하여 근린생활권내교통의 집산기능을 수행하는 도로로서 근린생활권의 골격을 형성하는 도로* 국지도로 : 가구(도로로 둘러싸인 일단의 지역)를 구획하는 도로* 특수도로 : 보행자전용도로ㆍ자전거전용도로 등 자동차 외의 교통에 전용되는 도로○ 기타* 대상지역내 가로 유형별로 표본 지역을 선정하여, 가로경관 사진촬영 후사진전체 면적 중 살아있는 식물 잎의 영상이 차지하는 면적비율을 산출함※산출방법: (식물 잎의 투영면적/가로경관 사진면적)*100* 2005년부터 특수도로 녹시율 제외○ 출 처 : 서울특별시 조경과'
