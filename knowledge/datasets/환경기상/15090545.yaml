summary_user: 국립공원공단 통합방재시스템에 설치된 AWS(자동기상관측장비)의 현황을 장비 한 대당 한 행으로 담은 목록 파일로, 관리번호·하위번호·관리지역번호·설치 위치명·장비 유형을 포함하며 전국 국립공원을 범위로 한다(CSV 약 6KB). 국립공원 탐방객 안전이나 산악기상을 분석하는 사람이 '어느 국립공원 어느 지점에 어떤 유형의 관측장비가 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 위치명(STN_NAME)이나 관리지역번호 같은 공단 자체 코드를 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 국립공원공단이 운영하는 **통합방재시스템 내 AWS(Automatic Weather System)**의 현황 정보를 수록한 자료로, 각 장비의 고유 관리번호, 설치 위치명, AWS 유형(종류), 설치 구분(고정형/이동형) 등의 주요 속성을 포함하고 있습니다. 국립공원 내 기후와 재해 특성을 실시간으로 감지하기 위해 전국 주요 국립공원 지역에 설치된 AWS는 기온, 강수, 풍속, 풍향, 습도 등 다양한 기상 요소를 측정하며, 이를 기반으로 재해예방, 탐방객 안전관리, 실시간 기상 정보 제공 등의 기능을 수행합니다. 해당 데이터는 기상관측 인프라의 공간 분포 현황을 분석하거나 재난대응 체계 수립, 등산객 안전예보 시스템 고도화, 산악기상 정보 플랫폼 구축 등에 활용될 수 있습니다. 또한, GIS 시스템과 연계한 시각화 및 다양한 공공서비스 기초자료로도 활용도가 높습니다.
