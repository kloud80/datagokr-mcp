summary_user: 국립공원공단이 전국 국립공원마다 부여한 고유 코드와 공원명, 정렬순서를 담은 기준 코드표로, 건별 원천이 아닌 462바이트 크기의 작은 CSV 파일이다. 국립공원 탐방·자원·통계 데이터를 다루는 분석가나 개발자가 '이 데이터의 공원 코드는 어느 국립공원인가'를 확인하고 공원명을 표준화하는 데 쓴다. 전역 조인 키는 없으므로 같은 기관이 낸 국립공원 데이터의 공원 코드나 공원명으로 매핑해 이어 쓴다.
description_portal: 본 데이터는 국립공원공단이 전국 21개 국립공원을 체계적으로 관리하고 시스템 간 연계를 효율화하기 위해 부여한 고유 식별 코드 정보를 포함한 자료입니다. 각 국립공원은 고유의 국립공원 코드, 공원명, 행정 구역명, 코드 유형(내부 식별용, 대외 시스템 연계용 등), 사용 여부 등의 항목으로 구성되어 있으며, 국립공원 관련 데이터베이스, 행정관리시스템, 공간정보 플랫폼, 통계 시스템 등 다양한 정보시스템 간의 데이터 통합과 연계를 위한 기준값으로 활용됩니다. 본 데이터는 공원별 자원 관리, 통계 분석, 예산 관리, 대국민 서비스 플랫폼 구축 등 행정 및 기술적 연계 업무에 활용되며, CSV 포맷으로 제공되어 공공 및 민간 시스템 간 호환성과 연동성을 높이는 데 기여합니다.
