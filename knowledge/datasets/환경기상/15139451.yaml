summary_user: 천리안위성 1호(COMS)가 5개 기본채널 관측으로 생산한 16종 기상산출물을 북반구·한반도·전구 영역별로 조회하는 외부 API이며, 보유기간은 2011년 4월부터 2020년 3월까지이고 범위는 전국·비공간이다. 분석가나 연구자가 과거 특정 시점의 한반도 구름·대기 상태 같은 위성 산출물을 찾아 기후 분석이나 사례 연구에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 관측 시각 등 이름·코드 매핑이나 같은 기상청 자료끼리만 이어 쓴다.
description_portal: '2010년에 발사된 천리안위성(COMS, Communication Ocean and Meteorological Satellite)은 지구적도상공 36,000km 고도, 동경 128.2°에 위치하여 기상관측, 해양관측, 통신서비스 등의 임무를 수행하는 우리나라 최초의 정지궤도 복합위성입니다.천리안 위성은 5개의 기본채널 관측을 통해 16종의 기상산출물을 생산하며, 생산된 기상산출물들은 기상예보, 수치예보 및 기후변화 예측 등에 활용합니다.생산주기: - 북반구: 매시 00, 15, 30, 45분              - 한반도: 매시 13, 28, 43, 58분              - 전구: 3시간마다 매시 15분보유기간:  2011년 4월 ∼ 2020년 3월'
