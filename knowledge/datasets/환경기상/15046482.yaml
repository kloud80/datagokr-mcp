description_portal: '○ 통계개요* 통계명 : 청소예산 재정자립도* 통계종류 : 서울시 청소예산 재정자립도를 자치구별로 제공하는 일반?보고통계* 작성목적 : 쓰레기 종량제 시행지침에 의거 매년 쓰레기 종량제를 실시하고그 운영현황을 파악하여 생활폐기물에 관한 정책수립의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 시군구 → 시도 → 한국환경공단(업무대행) → 환경부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 청소예산 재정자립도○ 용어설명* 청소예산 재정자립도 = 연간 쓰레기 총수입(봉투판매금액+재활용품 판매수입+대형 폐기물수수료 수입+ 기타수입(과태료 등)/연간 쓰레기 총 처리비용(생활폐기물, 음식물류 폐기물,재활용품, 대형폐기물, 공사장생활폐기물, 사업장생활계폐기물의 수집?운반?처리비용 및가로청소비용 등○ 기 타* 통계표에 수록된 숫자는 단위 미만에서 반올림되었을 경우 각 항목 값의 합이 총계와 일치하지 않을 수도 있음'
