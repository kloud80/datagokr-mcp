summary_user: 세종특별자치시 보건환경연구원이 읍면동 6개 측정소에서 잰 대기오염 측정결과를 측정지역·측정일자별로 담은 CSV 파일로, 미세먼지·초미세먼지·오존·아황산가스·일산화탄소·이산화질소 농도가 들어 있다. 세종시 주민이나 분석가가 "우리 동네 측정소의 미세먼지·오존 농도가 날짜별로 어떻게 달라졌나"를 확인하거나 지역 간 대기질을 비교할 때 쓴다. 전역 조인 키가 없어 다른 대기질 데이터(에어코리아 측정소 자료 등)와는 측정지역 이름을 맞춰 연결하거나 같은 기관 자료끼리 이어 써야 한다.
description_portal: 시민의 건강보호와 환경정책 수립을 위한 기초자료 등으로 활용을 위한  세종특별자치시 읍면동에 설치된 6개소의 대기오염 물질 측정결과를 제공합니다.데이터는 측정지역, 구분, 배출일자, 미세먼지(PM-10 마이크로그램_세제곱미터), 초미세먼지(PM-2.5 마이크로그램_세제곱미터), 오존(O3 ppm), 아황산가스(SO2 ppm), 일산화탄소(CO ppm), 이산화질소(NO2 ppm)로 구성되어 있습니다.이자료는 세종특별자치시 보건환경연구원에서 제공하는 자료이며, 6개월 주기로 업데이트 될 예정입니다.
