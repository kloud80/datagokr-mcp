description_portal: 본 데이터는 2026년 3월 10일 기준으로 국립호남권생물자원관 섬생물소재은행이 보유 중인 유전자원 DNA 소재 확보 리스트 정보입니다. 구성 항목은 은행자원번호, 분류군, 국명, 학명, 분양가능여부로 이루어져 있으며, 분류군은 무척추동물류(곤충제외), 세균류, 균류, 와편모조류 등으로 구성되어 있습니다. 국명은 한글 학명으로, 학명은 영문 표기로 작성되어 있어 국내외 학술 및 산업 연구에 모두 활용 가능합니다. 분양가능여부는 모든 항목이 ‘가능’으로 표기되어 있어 외부 분양이 가능한 상태입니다. 은행자원번호를 기준으로 체계적인 검색과 자원 관리가 가능하며, 본 데이터는 생물다양성 연구, 유전자원 보존, 바이오소재 개발, 유전체 분석 등 다양한 분야에서 활용될 수 있습니다. 유전자원의 확보 및 공유 활성화에 기여합니다.
