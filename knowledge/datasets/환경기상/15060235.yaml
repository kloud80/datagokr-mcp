description_portal: 1. 통영시 사업장폐기물배출자신고현황에 대한 사업장폐기물 처리구분,신고기준년도,상호명,사업장도로명주소,폐기물 종류,운반자,처리업소명,처리방법,데이터기준일자 대한 정보를 제공합니다.2. 불법폐기물이 발생하느것을 막기위해 올바로시스템과 연계하여 배출자의 배출시기 및 운반자 처리자의 투명하고 안전하게 폐기물이 처리되는 과정을 누구나 알고 있도록 처리테이터를 공유 할수있습니다.3 . 폐기물을 배출하는 사업장의 효률적인 처리를 위해 사업장폐기물 배출자 신고서를 테이터 함으로써 편리하고 간편하게 처리업체 및 운반업체를 연결하여 불필요한 행정낭비를 막고 원할한 폐기물 처리에 만전을 기할수 있도록 하고  있습니다.4. 폐기물이 최대한 재활용이 가능하도록 사업장폐기물 배출자 신고시 부터 검토하여 재활용 가능을 하게함으로써 불편로한 탄소가 발생하는 것을 촉소하여 통영시 환경정책의 탄소제로 목적에  이바지 할 목적입니다.
