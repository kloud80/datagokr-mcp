summary_user: 경상남도 통영시에 사업장폐기물 배출자로 신고한 사업장을 건별로 담은 파일로, 상호·도로명주소·신고기준년도·폐기물 구분과 종류·운반자·처리업소명·처리방법이 들어 있다(CSV 약 18만 바이트, 통영시 범위). 통영시 사업장 담당자나 분석가가 "우리 지역에서 이 종류의 폐기물은 어느 운반업체와 처리업체가 어떤 방법으로 처리하는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 처리업소명·운반자 이름이나 사업장 도로명주소를 기준으로 폐기물 처리업 허가 현황 같은 다른 데이터와 맞춰 이어 쓴다.
limits: 사업자번호 같은 공통 키가 실측 컬럼에 없어 다른 데이터와 정확히 연결하기 어렵고 이름·주소 매칭에 의존해야 한다. 통영시 한 곳의 배출자 신고 원장이므로 폐기물 발생량이나 처리 실적 통계로 쓰지 않는다.
