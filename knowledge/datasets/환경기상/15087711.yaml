summary_user: 한국환경산업기술원 녹색제품정보시스템에 등록된 녹색제품을 제품(모델) 단위로 담은 파일로, 업체명·제품용도명·모델명·인증번호·인증상태·환경표지 인증 시작일과 종료일·지역 등을 포함하며 범위는 전국입니다. 공공기관 구매 담당자나 사업자가 특정 용도의 제품 중 환경표지 인증이 유효한 제품과 업체를 확인하고, 인증 종료가 다가온 제품을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업체명이나 인증번호(EL번호) 같은 이름·코드를 맞춰 대조하는 방식으로만 이어 쓴다.
limits: 공통 조인 키가 없어 다른 업체·인증 데이터와 연결하려면 업체명 등을 직접 대조해야 하며, 표기가 다르면 매칭이 어긋날 수 있다. 지역 필드는 있지만 비공간 데이터라 좌표 기반의 위치 분석에는 쓸 수 없다.
