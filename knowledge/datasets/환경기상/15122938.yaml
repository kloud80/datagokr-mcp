summary_user: 경기도보건환경연구원이 운영하는 경기도 내 도시대기·도로변대기 측정소별로 아황산가스·이산화질소·일산화탄소·오존·미세먼지(PM-10)·초미세먼지(PM-2.5)의 월평균 농도를 담은 측정소 단위 집계 자료다. 분석가나 주민이 우리 시군 측정소의 미세먼지 월평균이 계절별로 어떻게 달라지고 다른 시군보다 높은지를 비교하는 데 쓴다. 전역 조인 키는 없어서, 시군 코드·이름(city_cd)이나 측정소 코드·이름(mesure_plc_cd), 측정망 구분을 기준으로 같은 기관 자료나 이름 매핑을 통해 다른 데이터와 잇는다.
description_portal: 경기도내 측정소별 대기질 측정자료입니다. 월별 아황산가스(SO2)농도, 일산화탄소(CO)농도, 오존(O3)농도, 이산화질소(NO2)농도, 미세먼지(PM-10), 초미세먼지(PM-2.5) 농도값을 제공합니다.해당 데이터는 특정 시기의 대기질 변화 추이, 지역 간 오염도 비교, 계절별 대기환경 분석, 환경정책 평가 등에 활용될 수 있습니다. 측정망구분은 도시대기 또는 도로변대기 등으로 나뉘며, 오염원의 특성과 위치에 따라 데이터를 분류해 활용 가능합니다.*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
