description_portal: 항공기상청에서는 공항 주변에서 발생한 다양한 기상 현상에 대해 종류, 강도, 시작 시각, 종료 시각 등의 정보를 체계적으로 기록한 공항기상 관측기사를 제공합니다.이 자료는 활주로 및 공항 운영에 영향을 줄 수 있는 강수, 안개, 눈, 천둥번개 등 주요 기상 현상의 발생 상황을 정리한 것으로, 항공 안전 확보 및 기상 통계 분석의 기초 자료로 활용됩니다.자료에는 기상 현상에 대한 코드(현상코드)가 포함되어 있으며, 이러한 코드의 해석 및 활용 방법에 대한 자세한 내용은 항공기상청 대표 누리집(amo.kma.go.kr)의 ‘알림자료 > 법령지침’ 게시판에 게시된 ‘항공기후 통계지침’에서 확인하실 수 있습니다.
