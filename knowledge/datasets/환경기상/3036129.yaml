summary_user: 전라남도 지역 폐기물 매립시설을 시설 한 곳당 한 행으로 담은 현황 파일(약 5.8KB CSV)로, 시군·사업장명·소재지·면적(제곱미터)·용량(세제곱미터)·침출수 처리 방식·사용 여부를 기록한다. 주민이나 환경 분석가가 "우리 시군에는 어떤 매립장이 있고, 남은 매립 규모와 침출수 처리 방식은 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 폐기물 처리시설·처리업 데이터와는 사업장명이나 소재지 주소, 시군 이름을 맞춰 이어 써야 한다.
description_portal: '- 전라남도 폐기물매립 시설현황(사업장명, 소재지, 면적, 용량, 처리방법 등)에 관한 데이터를 제공하고 있습니다.- 전라남도는 폐기물의 안정적 처리와 환경 보호를 위해 여러 매립시설을 운영하고 있습니다. 이러한 시설들은 주로 산업폐기물과 생활폐기물을 처리하며, 지역별로 분포하고 있습니다.- 전라남도는 폐기물의 재활용을 촉진하고, 매립을 최소화하기 위한 다양한 정책을 추진하고 있습니다. 예를 들어, 음식물 쓰레기 감량을 위한 분리배출 캠페인, 재활용 가능한 자원의 선별 수거 등이 있습니다.- 폐기물 처리와 관련된 자세한 정보나 특정 시설에 대한 문의는 전라남도청 환경산림국 환경정책과 또는 해당 시·군청 환경부서에 문의하시는 것이 좋습니다.'
