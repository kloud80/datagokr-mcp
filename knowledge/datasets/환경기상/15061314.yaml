summary_user: 전국 지자체별로 음식물쓰레기 RFID 종량제를 도입했는지를 광역·기초자치단체 단위로 정리한 현황 파일로, 기준 시점은 2020년 5월(152개 지자체는 2019년 12월)이다. 우리 시군구가 RFID 방식 음식물쓰레기 종량제를 도입했는지, 시도별로 도입 지자체가 얼마나 퍼져 있는지를 확인하려는 주민·행정 담당자·분석가가 쓴다. 필드는 연번과 광역·기초 지자체 이름뿐이고 전역 조인 키가 없어, 다른 지자체 단위 데이터와는 시도·시군구 이름을 행정구역 코드로 매핑해서 이어 쓴다.
description_portal: 본 데이터는 2020년 5월(152개 지자체는 2019년12월 기준임) 전국 지자체별 음식물쓰레기 RFID 종량제 도입 현황을 제공하며 광역자치단체와 기초자치단체 단위로 분류되어 있습니다. 각 지자체가 음식물쓰레기 RFID 종량제 시스템을 도입했는지를 확인할 수 있어 지역별 음식물쓰레기 감량 정책의 적용 범위와 확산 현황을 한눈에 파악할 수 있습니다. 행정기관이 종량제 보급률과 도입 성과를 관리하는 데 활용할 수 있습니다. 또한 국민과 기업에게는 자원순환 및 환경관리 서비스 현황을 확인할 수 있는 기초자료로 활용될 수 있습니다.
