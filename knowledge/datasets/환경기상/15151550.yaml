description_portal: 이 데이터는 재봉틀(미싱) 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 데이터는 총 200장의 이미지 파일과 같은 수의 라벨링 텍스트 파일로 구성되어 있으며, ‘images’ 폴더와 ‘labels’ 폴더에 각각 저장되어 있습니다. 이미지에는 다양한 형태, 크기, 모델의 재봉틀이 포함되며, 대부분 실내 환경에서 여러 각도와 거리에서 촬영되었습니다. 재봉틀 본체, 침판, 바늘대, 실걸이 등 주요 구성 요소가 식별 가능하게 포함되어 있습니다. 대응되는 라벨링 파일은 YOLO 형식으로 작성되었고, 각 객체의 위치 좌표와 클래스명 정보가 텍스트 형태로 기록되어 있습니다. 전체 데이터는 객체 탐지 및 분류 모델 학습을 위한 일관된 파일 구조와 명명 규칙을 따르고 있습니다.
