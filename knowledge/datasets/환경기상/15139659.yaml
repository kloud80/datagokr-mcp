summary_user: 경기도 양평군 안의 공공하수처리시설·소규모 공공하수처리시설·마을단위 오수처리시설·분뇨 및 가축분뇨 공공처리시설을 시설 한 곳당 한 행으로 담고, 시설용량(톤)·도로명/지번 주소·위도·경도·처리공법을 함께 적은 건별 현황 파일이다. 주민이나 분석가가 '우리 마을 오수는 어느 처리시설에서 어떤 공법으로 처리되며 용량은 얼마인가'를 확인하거나, 양평군 하수·분뇨 처리 인프라의 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 좌표로 공간 결합해 이어 쓰며, 시설 유형(구분)별로 묶어 비교할 수 있다.
description_portal: 양평군 내 환경기초시설 현황을 공공하수처리시설과 소규모 공공하수처리시설, 마을단위 오수처리 시설, 분뇨 공공처리시설, 가축분뇨 공공처리시설로 나누어 각각의 시설명, 시설용량, 소재지(도로명주소와 지번), 위도, 경도, 처리공법 등 세분화하여 데이터를 제공합니다.가장 용량이 큰 곳은 용량이 21400톤의 옥천면 경강로 1496에 위치한 양평 공공하수처리시설이며 가장 용량이 작은 곳은 용량이 10톤인 단월면 석산리214-8과 석산리692 에 위치한 마을단위 오수처리시설인 석산리 복지회관과 인이피입니다.
