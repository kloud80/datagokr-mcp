summary_user: 소음진동관리법상 소음발생건설기계(굴착기·로더·브레이커·발전기·공기압축기 등 9종)의 소음도검사 결과를 제작회사·승인번호·모델명·음향파워레벨(dBA) 단위로 담은 전국 단위 파일 데이터다. 건설기계 제작·수입 사업자나 공사현장 관리자가 특정 모델이 소음도검사를 받았는지, 음향파워레벨이 몇 dBA인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제작회사명·모델명 같은 이름 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터셋과 코드로 정확히 연결할 수 없고, 이름 매핑에 의존해야 한다. 지역 구분이 없는 전국·비공간 자료라 현장별·지역별 소음 분석에는 쓸 수 없다.
