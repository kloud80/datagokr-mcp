description_portal: 소음진동관리법에서 정하는 소음발생건설기계 9종(굴착기, 로더, 다짐기계, 브레이커, 콘크리트절단기, 천공기, 항타 및 항발기,발전기, 공기압축기 등 9종) 은  국내 제작 수입을하여 판매하기전에 소음도검사를 하고 소음도 표지를 기기에 부착하여야한다.소음도검사를 미시행 하고 판매를 하는 경우 벌금3천만원 혹은 징역3년소음도검사 표지를 부착하지 않는 경우 벌금 1천만원 혹은 징역 1년 등이 처분이 있음 .소음도검사 후 6종(굴착기,로더, 공기압축기,다짐기계,콘크리트 절단기,발전기등) 소음기준을 만족하여야하고, 천공기 , 항타 항발기, 브레이커는 소음시험후 표지만 부착하면됩니다.
