description_portal: '서울특별시 마포구에 있는 생활폐기물을 수집하고 운반하는 대행업체에 대한 정보입니다. 이 데이터에는 각 업체의 이름과 담당하는 구체적인 행정 구역 정보(예: 행정동명), 배출 요일, 대상 생활폐기물(예: 일반생활폐기물, 음식물류폐기물, 재활용품 및 폐스티로폼, 대형생활폐기물 등), 수거차량 주차지역 등의 정보가 포함되어 있습니다. 이 데이터를 통해 주민과 행정기관은 생활폐기물 처리 책임 주체를 명확히 파악하고, 효율적인 폐기물 수거 시스템을 이해할 수 있습니다. 또한 지역별 폐기물 수집·운반 업무의 분장 현황을 체계적으로 파악할 수 있으며, 수거 민원 대응, 서비스 품질 개선, 청소행정의 효율성 제고 등에 활용할 수 있습니다.'
