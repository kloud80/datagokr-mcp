summary_user: 대전시에서 석면 해체·제거 작업이 이뤄진 사업장별로 작업장 명칭·주소, 작업 내용, 석면 면적, 해체제거 시작·종료일, 석면 비산 측정값, 소관 지자체를 한 행씩 담은 파일(csv, 약 5KB)이며, 포털 설명상 2021년 한 해 측정분이다. 인근 주민이나 환경 분석가가 "우리 동네 석면 해체 현장에서 측정된 비산 농도는 얼마였고 작업은 언제 진행됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 작업장 주소나 소관 지자체(구) 이름을 맞춰 연결해야 한다.
limits: 공통 코드형 조인 키가 없어 다른 사업장·건축물 데이터와 바로 붙일 수 없고, 주소·이름 매칭에 의존해야 한다. 범위는 대전시 내 개별 사업장에 한정된다.
