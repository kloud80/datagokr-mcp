description_portal: 대전광역시 석면해체제거사업장 석면비산 측정 결과 현황은 2021년 한 해 동안 대전시 내에서 석면 해체·제거 작업이 이루어진 사업장에서 석면 비산농도를 측정한 결과를 정리한 데이터입니다. 이 자료는 사업장 별 위치, 작업 기간, 측정 일자, 석면 비산 수치(개수/ℓ), 측정 결과(기준 적합 여부) 등을 포함하고 있어, 해체 작업 현장에서 발생할 수 있는 대기 중 석면의 확산 수준을 파악하고 관리하기 위한 기초 자료로 활용됩니다. 비산 석면에 의한 인근 주민 및 작업자 건강 피해를 예방하고, 관련 법령 상 정해진 기준 준수 여부를 확인하며, 사업장 별 안전 조치 필요성과 대응 조치 여부를 점검하는 데 유용합니다. 본 자료는 2022년 공공데이터 기업매칭지원사업으로 수행되었습니다.
