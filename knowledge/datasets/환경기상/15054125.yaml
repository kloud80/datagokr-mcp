summary_user: 전남광주통합특별시 자치구에 허가·신고된 소음·진동 배출시설 현황을 2025년도 기준으로 소음 시설과 진동(소음 포함) 시설로 나눠 담은 집계 파일이며, 원본 CSV는 84바이트 규모로 매우 작다. 지역 환경 담당자나 분석가가 "우리 지역에 신고된 소음·진동 배출시설이 몇 곳인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명이나 같은 기관 코드로만 맞춰 이어 쓴다.
description_portal: 소음 · 진동 배출시설이란 소음·진동을 발생시키는 공장의 기계·기구·시설, 그 밖의 물체로서 기후에너지환경부령으로 정하는 것으로  - 소음배출시설 7.5kw 이상의 압축기, 송풍기, 단조기, 금속절단기, 프레스, 탈사기, 분쇄기 등, 진동배출시설 15kw 이상의 프레스, 22.5kw 이상의 단조기, 도정시설, 목재가공기계 등등록된 배출시설은 시행규칙 제8조에 따른 배출허용기준을 준수하여야 한다. 같은법 8조에 따라 배출시설을 설치하려는 자는 자치구에 허가 또는 신고를 하여야 하며, 본 데이터는 자구에 허가 신고된 배출시설의 현황 자료를 제공합니다.
