summary_user: 해양환경공단 해양수질자동측정망 중 새만금 해역 측정 정점별로 관측일자마다 수온·염분·전기전도도·수소이온농도(pH)·용존산소량·탁도·클로로필을 기록한 시계열 측정값을 담은 CSV 파일(약 5.8MB)이다. 연구자나 지자체 담당자가 새만금 방조제 주변 해역의 계절별 용존산소 저하나 탁도 변화를 확인하는 데 쓴다. 전역 조인 키는 없고 측정소는 정점코드·정점명으로만 식별되므로, 다른 해양수질 측정망 자료와는 정점 이름·코드를 직접 매핑해 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 새만금 해역에 설치된 측정소의 수질 자동측정 정보를 제공합니다. 본 데이터는 수온, 염분, 용존산소(DO), pH, 탁도, 클로로필-a 등 주요 항목을 실시간으로 측정한 결과를 포함하며, 새만금 방조제 내·외측 수질 변화, 오염원 감시, 조기경보 운영 등에 활용됩니다. 새만금 지역은 간척사업과 밀접한 관련이 있는 해역으로, 수질자료는 환경 영향 평가 및 개선 정책 수립의 기초자료로 사용됩니다. 데이터는 시계열 통계 형식으로 제공되며, 계절별 수질 변화 분석, 정책 효과 검토, 연구자료 등 다양한 분야에서 활용됩니다. 공공기관, 연구기관, 지자체 등에서 수질관리와 해양환경 정책 수립에 참고자료로 활용됩니다.
