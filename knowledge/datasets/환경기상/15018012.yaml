summary_user: 서울 영등포구에 설치된 가로쓰레기통을 한 개소씩 담은 원천 목록 파일로, 행정동·설치 위치·설치 장소 유형(버스정류장·도로변 등)·쓰레기통 형태·수거 쓰레기 종류(일반·재활용)·제작연월·최초설치 정보를 담는다. 주민이나 방문객이 '우리 동네 버스정류장 근처에 쓰레기통이 있나, 재활용 분리 배출이 되나'를 확인하거나, 분석가가 행정동별 쓰레기통 배치 밀도를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 같은 구의 다른 폐기물 배출 지점 파일과 이름 매칭으로만 잇는다.
description_portal: '가로쓰레기통 설치 현황 정보 서비스 입니다.이 정보는 서울특별시 영등포구에 있는 가로 쓰레기통 설치 현황에 대한 정보입니다. 가로 쓰레기통은 유동인구가 많은 도로변, 버스 정거장, 광장, 지하철 역 입구 등에 설치되어 있습니다. 길거리 무단투기 예방과 시민 편의 증대를 위해 설치하여 운영하고 있습니다. 가로 쓰레기통은 일반쓰레기통과 재활용 쓰레기통이 함께 설치되어 있습니다. 이 정보에는 설치 현황에 대한 정보가 포함되어 있습니다.* 담당부서: 서울특별시 영등포구청 청소과* 문의사항: 02-3670-3478'
