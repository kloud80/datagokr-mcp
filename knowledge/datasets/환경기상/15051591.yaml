summary_user: 부산광역시 연제구에 지정 등록된 쓰레기 종량제 규격봉투 판매소를 한 곳당 한 행으로 담은 목록으로, 판매소명·대표자·주소·관할 행정동·연락처가 들어 있고 포털 설명 기준 중간판매소 13개소와 최종판매소 276개소입니다. 연제구 주민이 '우리 동네에서 종량제봉투를 어디서 살 수 있나'를 찾거나, 분석가가 행정동별 판매소 분포를 볼 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소나 행정동 이름(동 구분)을 맞춰 연결해야 하며, 다른 지자체의 같은 종류 판매소 파일과 나란히 놓고 쓴다.
description_portal: '부산광역시 연제구 쓰레기 종량제 규격 봉투 판매소 현황(2026년 5월 14일 기준) 정보를 제공하고 있습니다.데이터 내용: 종량제봉투 판매소명, 대표자명, 판매소 주소, 판매소 동 구분, 판매소 연락처1. 종량제봉투 판매소명: 종량제봉투 판매소 상호2. 대표자명: 종량제봉투 판매소 대표자 성명3. 판매소 주소: 종량제봉투 판매소 주소4. 판매소 동 구분: 종량제봉투 판매소 관할 행정동5. 판매소 연락처: 종량제봉투 판매소 전화번호- 연제구 종량제봉투 판매소 개수: 중간판매소 13개소 / 최종판매소 276개소- 데이터 등록일 기준으로 부산광역시 연제구 종량제봉투 판매소(중간판매소 포함)로 지정 등록 되어 있는 판매소 관련 데이터입니다.- 현재 폐업하였으나, 종량제봉투 판매소 해지 신고하지 않은 일부 판매소의 내용이 포함되어 있습니다.- 판매소마다 판매하는 규격이 상이할 수 있습니다.- 각 판매소의 최신 현황은 연락 및 문의를 통해 확인하시기 바랍니다.'
