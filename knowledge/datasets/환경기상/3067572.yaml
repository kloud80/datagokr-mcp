summary_user: 경기도에서 발령된 미세먼지(PM10·PM2.5) 경보를 건별로 담으며, 권역명·경보 단계(주의보 등)·발령과 해제의 일자·시간·농도를 기록한다. 주민이나 보건 담당자가 '우리 권역에서 미세먼지 주의보가 얼마나 자주, 몇 시간 동안 이어졌나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 대기질 자료와는 권역명(distrct_nm)과 발령 일자·시간을 이름·시각 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 미세먼지 농도 상승으로 인해 발령된 경보 정보를 기록한 자료로, 경보의 권역, 항목명(PM10 또는 PM2.5), 경보 단계(주의보 등), 발령 및 해제 시각과 해당 시점의 미세먼지 농도를 포함하고 있습니다. 주요 항목으로는 기준일자, 권역명, 항목명, 경보단계명, 발령일자·시간·농도, 해제일자·시간·농도 등이 있으며, 특정 권역에서의 미세먼지 경보 발생 패턴을 파악할 수 있습니다. 이 데이터는 고농도 미세먼지 발생 시 대기질 상황 분석, 보건정책 수립, 민감군 보호를 위한 사전 조치 등에 활용될 수 있으며, 기상청 및 환경청의 예보 체계 보완에도 활용 가능합니다.
