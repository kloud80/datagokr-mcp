description_portal: 전라남도 함평군은 대기환경 개선과 에너지 사용 실태 관리를 위해 관내 중질유를 사용하는 업체에 대한 정보를 공공데이터로 제공하고 있습니다. 본 자료는 중질유(벙커C유 등)와 같은 고황연료를 사용하는 사업장의 현황을 담고 있으며, 업체명, 연료명, 소재지, 연락처 등의 항목으로 구성되어 있습니다. 해당 데이터는 에너지 사용 실태 파악, 대기오염물질 배출원 관리, 오염원별 행정지도 및 점검 등에 활용될 수 있으며, 저탄소 전환을 위한 연료전환 유도 정책 수립, 환경영향평가, 탄소중립 대응 전략 마련 등에도 실질적인 기초자료로 활용됩니다. 또한, 에너지 효율화 사업 발굴, 친환경 설비 보급 확대, 지역사회 환경정보 공개 등 다양한 환경·에너지 행정의 기반이 되는 공공자원입니다.
