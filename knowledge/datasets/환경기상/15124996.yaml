summary_user: 측정 연도와 행정구역별로 악취측정대행 대상 측정항목의 코드와 항목명을 담은 전국 단위 현황 목록이며, 위치 좌표 없이 행정구역 이름으로만 구분한다. 지자체 환경 담당자나 분석가가 특정 연도에 어느 지역에서 어떤 악취 물질을 측정 항목으로 삼았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정구역명이나 측정항목 코드·명을 이름으로 맞춰 붙이거나 한국환경공단의 다른 악취 데이터와 같은 기관 코드로만 연결한다.
limits: 측정값이나 농도는 없고 측정항목 목록만 담으므로 실제 악취 수준이나 시간별 변화는 이 데이터로 알 수 없다. 행정구역이 이름으로만 제공되고 표준 지역 코드가 없어 다른 데이터와 연결할 때 이름 매핑이 필요하다. 개발계정 호출은 하루 1,000회로 제한된다.
