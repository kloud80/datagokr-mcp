summary_user: 서울 금천구 안에서 「실내공기질 관리법」 관리 대상인 다중이용시설을 시설 한 곳당 한 행으로 담은 파일로, 상호·시설 구분(어린이집, 의료기관, 대규모점포 등)·도로명/지번 주소·위경도·관리 대상이 된 기준(연면적)·전화번호를 담는다. 구민이 자주 가는 어린이집이나 병원이 실내공기질 관리 대상인지 확인하거나, 담당 부서·분석가가 구 안의 관리 시설 분포를 지도에 올려 점검 계획을 세우는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·위경도로 공간 매칭하거나 상호·주소 이름 매칭으로 잇는다.
description_portal: 불특정 다수가 이용하는 시설의 쾌적하고 안전한 실내 환경을 보장하기 위해, 「실내공기질 관리법」에 따라 관리되는 서울특별시 금천구 내 다중이용시설의 현황 데이터입니다. 본 데이터는 구민의 건강을 보호하고, 시설 관리자의 자율적인 환경 개선을 유도하여 삶의 질을 높이는 데 기여하고자 구축되었습니다.데이터에는 각 시설의 상호명, 시설 구분(어린이집, 의료기관, 대규모점포 등), 소재지 주소, 관리 대상이 된 기준(연면적) 등 법적 관리 현황을 파악할 수 있는 핵심 정보를 포함하고 있습니다.시민들은 자주 이용하는 시설이 관리 대상인지 확인할 수 있으며, 환경 정책 담당 기관은 지역 내 관리 시설의 분포를 파악하여 효율적인 점검 및 지도 계획을 수립할 수 있습니다. 또한, 시설 관리자는 법적 의무를 명확히 인지하고, 실내 환경을 개선하는 데 참고 자료로 활용할 수 있어, 지역사회 전체의 건강 증진을 위한 중요한 기초자료가 될 것으로 기대됩니다.
