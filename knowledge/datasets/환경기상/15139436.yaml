summary_user: 기상청 관측지점의 적설(땅에 쌓인 눈의 깊이) 관측값을 시간 또는 일 단위로 담은 관측 원천 자료이며, 범위는 전국입니다. 기후·농업·보험 분석가가 특정 지점에 눈이 언제 얼마나 쌓였는지 확인하거나 폭설 피해·교통 대응을 분석할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 관측지점 이름·번호 매핑이나 같은 기상청 관측자료(ASOS·AWS 등)의 지점 코드로만 다른 데이터와 잇는다.
description_portal: '적설이란 고체상의 강수(눈, 싸락눈 등)가 지면에 내려 쌓여 있는 수직 깊이를 말합니다. 눈이 관측장소 또는 관측장소 주위의 지면에 반 이상을 덮었을 때를 적설이 있는 것으로 판단합니다. 목측관측을 비롯하여 레이저식, 초음파식, 영상식 등 적설계로 적설을 측정합니다.생산주기: 시간, 일(관측방법에 따라 상이함)보유기간: 1904년 4월(지점별 상이함) ~(참고) 적설관측은 지표면 위에 쌓인 눈의 깊이·면적·양 등을 측정하는 것으로, 기상·수문·재난 대응 및 농업·교통 분야에서 매우 중요합니다. 관측 방법적설계(눈자): 일정한 눈판 위에 자를 세워 눈의 깊이를 측정적설중량계: 눈의 무게를 측정하여 수분량(적설수량)으로 환산자동기상관측장비(AWS): 일부 관측소에 설치되어 자동 기록'
