summary_user: 전국 잔류성유기오염물질(POPs) 측정망 운영 결과를 지점별로 정리한 파일로, 다이옥신·퓨란, 헥사클로로벤젠, 디디티, 과불화화합물, 브로모다이페닐에터 등 물질별 연평균·겨울·여름 대기 농도를 담는다. 환경 연구자나 정책 담당자가 "우리 지역 측정지점의 다이옥신이나 과불화옥테인설폰산 농도가 계절에 따라 얼마나 다른가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지점명(지점명)을 이름으로 맞춰서만 이어 쓴다.
description_portal: '- 잔류성오염물질(POPs, Persistent Organic pollutants)은 독성.잔류성.생물농축성 및 장거리 이동성 등의 특성을 지니고 있어 사람과 생태계를 위태롭게 하는 물질로서 다이옥신 등 "잔류성오염물질에 관한 스톡홀름협약"에서 정하는 물질을 말합니다.- 전국 환경 매질(대기,토양,수질,퇴적물)에 대한 잔류성 오염물질의 오염 실태 및 추세를 종합적으로 파악하여 잔류성 오염물질 정책 수립 및 스톡홀름협약 국가 이행계획서 작성 등에 활용될 수 있도록 잔류성 오염물질 측정망 운영하고, 관련 데이터를 제공하고 있습니다.전국 환경매체(환경대기, 토양, 수질, 퇴적물)에 대한 잔류성유기오염물질측정망(17종, 171개지점)운영 결과1. 환경매체별 조사지점2. 연도별 측정결과3. 정도관리 결과'
applicable_legislation:
  - law: 잔류성오염물질관리법
    articles:
      - '11'
    source: portal_meta:보유근거
