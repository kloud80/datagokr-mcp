summary_user: 경기도 내 폐수배출사업장별로 운영하는 생산공정과 그 공정의 제품, 사용 원료를 한 줄씩 담은 건별 원천 자료로, 공정·제품·원료마다 월·연간 최대·평균 생산량과 사용량, 단위, 사용 상태와 상태 변경일이 들어 있다. 환경 담당자나 분석가가 '특정 업종이나 산업단지의 사업장이 어떤 원료를 얼마나 쓰고 있으며, 그 공정이 지금도 가동 중인가'를 확인해 폐수 발생 원인과 업종별 환경영향을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 다른 폐수배출시설 자료와는 사업장명·사업자등록번호(bizregno)·업종코드를 이름이나 코드로 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 폐수배출사업장에서 운영 중인 생산공정과 관련된 정보 및 각 공정에서 생산하는 제품과 사용 원료의 현황을 기록한 자료입니다. 항목에는 사업장명, 업종코드 및 업종명, 산업단지 위치, 관할관청, 생산공정명과 상태, 제품명, 제품생산량 상태, 원료명, 월별·연간 원료 사용량, 원료사용 단위 및 사용 상태 등이 포함됩니다. 특히 ‘생산공정명’은 업종 특성에 따라 화장품 제조, 의약품 제조, 금속가공 등으로 구분되며, 각 공정이 실제 운영 중인지(사용중 여부)를 나타냅니다. 이 데이터를 통해 폐수배출의 원인이 되는 생산활동을 추적하고, 제품별 폐수 발생 특성 분석, 업종별 환경영향 평가, 원료 사용량 기반 폐수량 예측 등의 활용이 가능합니다. 또한 환경규제 이행 및 산업공정 기반의 맞춤형 환경정책 수립에도 기초자료로 활용됩니다.
