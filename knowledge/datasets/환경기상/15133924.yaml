description_portal: 본 데이터는 국가환경교육 통합플랫폼 지도에서 제공되는 환경교육자원 정보를 기반으로 구축된 자료입니다. 환경교육자원은 지역 내에서 환경교육을 수행하거나 지원할 수 있는 기관, 시설, 프로그램 등을 포함하며, 시민·학생·교사 등 다양한 이용자가 환경교육 활동에 쉽게 접근할 수 있도록 돕는 중요한 기반 정보입니다.국가환경교육 통합플랫폼은 전국의 환경교육기관뿐만 아니라 탄소중립 실천 프로그램, 생태체험시설, 지역 환경단체 등 다양한 자원을 지도 기반으로 제공하여, 누구나 지역별·유형별 환경교육 자원을 탐색할 수 있도록 지원하고 있습니다.이를 공공데이터로 제공함으로써 환경교육 접근성을 강화하고, 지자체·학교·교육기관의 환경교육 추진에 필요한 정보를 개방·확산하는 데 목적이 있습니다.
