summary_user: 합천군에 신고된 사업장폐기물 배출자를 사업장 한 곳씩 담은 원장 파일로, 폐기물구분·상호명·폐기물 종류·처리방법(재활용·중간처분·매립 등)·사업장 주소·신고일을 담는다. 합천군 안에서 어떤 사업장이 어떤 종류의 폐기물을 내고 어떻게 처리하는지 확인하려는 주민·폐기물 처리업자·환경 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호명이나 사업장 주소를 맞춰 잇고, 주소를 좌표로 바꿔 처리시설 위치 자료와 함께 지도에 올리는 식으로 쓴다.
description_portal: '경상남도 합천군 사업장폐기물배출자현황 자료는 폐기물 관리법에 따라 사업장폐기물 배출자에 관한 정보를 제공하는 자료입니다.해당 자료는 폐기물구분, 상호명, 폐기물 종류, 연락처, 처리방법, 사업장 주소, 신고일, 데이터 기준일 등의 세부 데이터로 구성하고 있습니다.폐기물 종류에 따른 통계분석, 주소 기반 GIS 시각화, 시설 입지 및 환경 인프라 분석 등 다양한 자료로 활용할 수 있습니다. - 데이터 설명폐기물 종류 : 배출한 폐기물에 관한 분류처리방법 : 폐기물을 처리한 방법(재활용, 중간처분, 매립 등)'
