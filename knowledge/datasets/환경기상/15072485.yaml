summary_user: 세계공역예보시스템(WAFS)을 통해 받은 화산재 주의보 전문을 발표 건별로 담은 파일로, 화산이름·위치·정상고도, 분출정보, 구름관측과 6·12·18시간 후 확산 예측, 원문 전문본문을 함께 싣는다. 운항 관리자나 항공 분석가가 '특정 화산 분출 때 화산재가 어느 고도·방향으로 퍼질 것으로 예보됐는가'를 확인하거나 노선별 화산재 영향 이력을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 화산이름이나 화산재주의보센터(VAAC) 이름, 발표시각을 기준으로 직접 맞춰 이어야 한다.
limits: 공통 조인 키가 없어 예보구역·격자 기반의 다른 기상청 자료와 바로 결합되지 않고, 이름·시각 매핑으로만 연결된다. 범위는 지역 행정단위가 아닌 비공간 자료로 분류되어 있어 국내 시군구 단위 분석에는 맞지 않는다.
