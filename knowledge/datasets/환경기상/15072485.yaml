description_portal: 세계공역예보센터(WAFC)는 세계공역예보시스템(WAFS)을 통해 항공기 안전 운항에 영향을 줄 수 있는 화산재 관련 정보를 제공합니다. 화산재 정보에는 화산 이름, 위치 좌표(위도·경도), 화산 정상의 고도, 분출 여부, 분출 고도, 확산 방향 및 범위 등이 포함되어 있으며, 이는 항공 노선의 안전 확보와 항공교통 흐름관리(ATFM)에 필수적인 자료로 활용되며, 해당 정보는 주로 VAAC(Volcanic Ash Advisory Center)에서 수집된 자료를 바탕으로 정제됩니다. 이와 같은 정보는 조종사, 운항 관리자, 항공사 및 관제기관 등 항공 분야 전반에 걸쳐 실시간 위험 회피 및 비행 계획 조정에 사용됩니다.
