summary_user: 경기도 양평군에서 음식물류 폐기물을 다량으로 배출해 처리계획 신고 대상이 되는 사업장을 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·도로명주소·기준일자를 담는다. 양평군 안에서 급식소나 대형 음식점처럼 음식물쓰레기 다량배출 신고 대상인 업소가 어디에 몇 곳 있고 어떤 업종인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명주소를 맞춰 붙이거나, 같은 양평군의 다른 폐기물 배출·수거 지점 파일과 나란히 놓고 쓴다.
description_portal: 경기도 양평군의 음식물쓰레기 다량배출사업장 정보입니다.폐기물관리법  제15조에 의거  음식물류 폐기물을 다량으로 배출하는 자는 음식물류 폐기물의 밸생 억제 및 처리 계획은 신고하여야 합니다.1일 평균 총 급식인원이 100명이상 또는 식품접객업 중 사업장 규모가 200제곱미터 이상인 휴게음식점 영업 또는 일반음식점 영업을 하는자 등이 이에 해당한다.이 데이터를 통하여 음식물류 폐기물 발생량을 예측할 수 있고, 처리계획을 관리하는 데에도 도움이 될 것으로 예측된다.장기적으로는 음식물류 다량배출사업장의 배출량의 감축을 계도하고 지도하는데에도 활용될 수 있다.
