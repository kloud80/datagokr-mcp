summary_user: 해양환경공단 해양수질자동측정망 중 울산 온산 해역 정점에서 자동으로 연속 측정한 수온·염분·용존산소·수소이온농도·탁도·전기전도도·클로로필 값을 관측일자별 시계열로 담은 CSV 파일(약 4.3MB)이다. 산업단지·항만 인근인 온산 앞바다에서 특정 기간 용존산소가 떨어지거나 탁도가 튀었는지 확인하려는 연구자·지자체 담당자가 수질 변동과 오염원 추적에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해역 자동측정망 파일과는 정점명·정점코드(정점코드)와 관측일자를 맞춰 이름·코드 매핑으로만 이어 붙인다.
