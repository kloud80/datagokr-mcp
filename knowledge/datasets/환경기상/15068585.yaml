description_portal: '편집일기도는 일기변화에 중요한 변수로 작용하는 기상요소들을 한 장의 일기도에 표현해 대기 입체구조 에 대한 이해를 돕는데 활용되고 있습니다.편집일기도: 관측자료를 이용하여 기상 변수들에 대한 기호와 등치선 등으로 이루어진 일기도제공기간은 2004년 1월 1일부터 3시간 간격으로 제공되고 있으며, png 이미지 형태로 제공하고 있습니다. 동아시아 영역의 지표면에서 관측한 기상요소를 사용하여 등치선도를 나타내며, 고기압과 저기압 등 기압계와 공기의 흐름을 확인할 수 있습니다. 협정 세계시 UTC와 한국표준시 KST가 표시되어 기준시각 확인이 필요합니다.'
