description_portal: 레이더 합성장 한반도, 행정구역 및 지점별 QCD 한반도, 행정구역 정보를 조회하는 서비스(참고) 기상레이더는 전파를 대기 중에 발사하여 강수입자에 부딪혀 산란되어 되돌아오는 신호를 이용하여 강수지역, 강수세기, 이동속도 등을 탐지하는 원격관측장비입니다. 집중호우, 태풍, 우박 등 강수현상을 짧은 시간 동안 입체적으로 파악할 수 있어 위험기상의 조기 감시와 예측에 이용되고 있습니다. 기상청은 전국에 현업용 기상레이더관측소 10개소(백령도, 관악산, 광덕산, 강릉, 오성산, 진도, 면봉산, 구덕산, 고산, 성산), 기술개발용 레이더 테스트베드(용인) 1개소, 소형 기상레이더 3개소(수리산, 덕적도, 망일산) 및 인천공항 기상레이더 1개소를 설치하여 운영하고 있습니다.
