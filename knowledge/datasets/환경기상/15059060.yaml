summary_user: 기상레이더 합성장을 한반도·행정구역 단위의 격자 자료로 담으며, 관측시각별로 격자 크기·좌표 개수·기준점과 격자값(value)을 한 묶음으로 준다(검증 때 전체 1건·1행 수신, 범위 전국). 방재 담당자나 분석가가 특정 시각에 어느 지역에 얼마나 강한 강수 에코가 있었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관측시간이나 격자 좌표를 지도·행정구역 경계에 맞추는 방식, 또는 같은 기관 코드로만 이어 쓴다.
limits: 한 번 호출하면 한 시각의 격자 묶음 1건이 오므로, 지점별 시계열처럼 여러 행이 바로 나오지 않는다. 격자값을 쓰려면 기준점·격자크기·좌표 개수로 격자를 직접 복원해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
