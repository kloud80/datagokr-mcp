summary_user: 2009년 7월~2010년 7월 전국 330개 다중이용시설(지하시설·전시시설·의료시설·상업시설·대합실 5개 그룹)을 대상으로 봄·여름·가을·겨울 계절별 90일간 장기 측정한 실내 라돈 농도(Bq/㎥)를 시설 1건당 한 행으로 담은 조사 결과 파일이며, 시도·시군구 단위까지 표시한다. 연구자나 지자체 담당자가 '지하시설이나 대합실 같은 시설 유형별로, 또 계절별로 실내 라돈 농도가 어떻게 달라지는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시도·시군구 이름을 행정구역 코드표에 매핑하거나 시설 구분(구분)으로 묶어 다른 실내공기질·라돈 자료와 비교하는 식으로만 이어 쓴다.
description_portal: '본 자료는 환경부 "다중이용시설등의 실내 공기질 관리법"에 정의된 17개 시설군을 조사 대상(5개의 유사시설 그룹 재분류함 : 지하시설, 전시시설, 의료시설, 상업시설, 대합실)으로하여 2009년 - 2010년(2009년 7월 부터~2010년 7월 까지) 전국 330개 다중이용시설 대상으로 계절별 조사 4계절(봄, 여름, 가을, 겨울) 시도, 시군구별 다중이용시설 내 실내라돈농도 실태조사 결과. 측정 기간은 계절별 90일 간 [실내공기질공정시험기준] 알파비적검출법(수동형라돈검출기)를 이용하여 장기 측정함.* 본자료의 실내라돈농도 단위는 Bq/㎥ 입니다.'
