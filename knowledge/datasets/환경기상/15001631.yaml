summary_user: 인천광역시 서구(서해구) 관내 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 목록 파일로, 상호·소재지 주소·구분·데이터기준일자를 포함한다. 주민이나 사업자가 '우리 동네 어느 음식점·업소가 음식물류폐기물 다량배출사업장으로 관리되는가'를 확인하거나, 분석가가 관리 대상 사업장의 지역 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관의 다른 폐기물 배출·수거 지점 파일과 지역 단위로 나란히 놓고 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 음식물류폐기물을 다량 배출하는 사업장의 현황을 정리한 자료입니다. 본 데이터는 음식점 및 관련 업소의 상호, 사업장의 주소, 데이터 기준일자를 포함하고 있습니다.본 자료는 음식물류 폐기물의 배출 규모를 파악하는데 활용할 수 있을것으로 판단되며 관내 위생 및 폐기물 정책 수립, 환경오염 예방 대책 마련, 관리 대상 사업장 지정 등의 기초 자료로도 활용할수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
