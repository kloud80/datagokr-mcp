summary_user: 수도권매립지에 반입된 연탄재를 마감년월·지역(소재지)별로 묶어 반입대수와 반입량(kg)을 담은 월별 집계 파일이다. 지자체 담당자나 분석가가 "우리 지역에서 매달 연탄재가 몇 톤씩 매립지로 들어가는가, 겨울철에 얼마나 늘어나는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 반입정보나 지역 통계와는 지역명·년월을 이름으로 맞춰 이어 쓴다.
description_portal: '수도권매립지에 반입되는 연탄재 반입정보입니다. 개방항목은 마감년월, 지역명, 반입대수, 반입량(kg) 항목을 제공합니다.공사에서 제공하는 연탄재 반입정보는 폐기물 반입 데이터 중 하나로 개방항목을지정하여 운영하여 공개하고 있습니다. 수도권매립지관리공사는 2020년 7월부터 연탄재에 대한 반입수수료를 생활폐기물과 동일하게 부과하며, 그 연탄재 반입은 지정된 시간대(예: 평일 07:30~16:00, 겨울철에는 08:00~16:00 등)에 이루어지며, 반입량과 지역별 현황은 공공데이터포털 등에서 확인할 수 있습니다.'
