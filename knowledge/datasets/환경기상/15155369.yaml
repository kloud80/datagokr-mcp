summary_user: 경기도 내 환경전문공사업체가 수행한 자가점검 결과를 업체·신청 건별로 담으며, 신청연도·사업장명·사업자번호·업종·등록구분·처리상태와 점검사항 3개의 해당 여부(Y/N)·비고를 기록한다. 도 담당자나 분석가가 "어느 환경전문공사업체가 기술인력·장비 등 자격요건을 유지한다고 점검했는지, 처리상태는 어떤지"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 인허가 사업장 원장과는 사업자번호(bizregno)나 사업장명을 맞춰 보는 방식으로만 잇는다.
description_portal: 이 데이터는 경기도 내 환경전문공사업체가 자가점검을 수행하고 그 결과를 등록한 현황을 담고 있으며, 신청연도, 사업장명, 사업자번호, 업종코드 및 업종명, 등록구분, 신청일, 처리상태, 점검사항별 여부(Y/N), 각 점검사항의 비고내용, 등록일 등의 총 14개 항목으로 구성되어 있습니다. 점검사항은 일반적으로 기술인력 유지 여부, 장비 보유 상태, 규정 준수 여부 등으로 구성되며, 각 항목에 대해 자율적으로 점검한 결과를 기록합니다. 본 데이터는 자가점검제도의 운영 현황을 파악하고, 등록 사업장이 정기적으로 자격요건을 유지하고 있는지 검토하는 데 활용되며, 점검 결과에 따라 행정처분이나 경고 등 관리 조치가 가능해집니다.
