summary_user: 전국 자치단체가 관리하는 지하수정화업체의 인허가 정보를 업체 단위로 담으며, 187건이 2003-08-14부터 2026-09-24까지의 인허가일·영업상태·주소·좌표·시설장비·전문인력 수와 함께 들어 있다. 홍수 등으로 오염된 생활용·농업용·공업용 지하수를 정화할 업체가 우리 지역에 어디 있고 영업 중인지 찾는 국민·사업자나 지역별 업체 분포를 보는 분석가가 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 주소 키로 다른 주소 기반 데이터와 잇고, 호출에 필요한 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
description_portal: '자원환경_지하수정화업체 데이터는 생활용, 농업용, 공업용으로 사용하고 있는 지하수가 홍수 등의 사유로 오염 되었을 경우 이를 제거하기 위해 지하수 정화작업을 수행하는 업체(소) 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 지하수 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 토양지하수과 / 044-201-7187 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
