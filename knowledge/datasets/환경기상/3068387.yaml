summary_user: 국립공원 구역과 인근에서 발생한 야생동물 로드킬을 건별로 기록한 파일 데이터로, 2011-01-10부터 2023-11-20까지 전국 3,183행을 담는다. 분석가나 공원·도로 관리자가 로드킬이 잦은 구간이 어디인지, 생태통로를 어디에 먼저 둘지 가늠하는 질문에 쓴다. 경도·위도 좌표가 조인 키라서 지도 레이어나 다른 좌표 기반 자료와 공간적으로 이어 쓰며, 국립공원명 필드로 공원별 집계도 할 수 있다.
description_portal: 본 데이터는 국립공원 구역 및 인근 지역에서 발생한 야생동물 로드킬(교통사고로 인한 생물사고) 사례를 기록한 자료로, 생물 다양성 보전과 도로 안전관리, 생태통로 설계 등을 위한 기초 자료로 활용됩니다. 주요 항목은 사고 발생 국립공원명, 발생 위치(도로명 또는 지점명), 위도·경도 좌표, 발생 일시, 피해 생물종(국문/학명), 분류군(포유류, 조류 등), 개체 수, 사고 유형(치사/부상), 발견자 또는 보고자, 처리 방식(제거, 이관 등), 연계 기관(환경부, 지자체 등) 등이 포함되며, CSV 포맷으로 제공됩니다. 본 데이터는 로드킬 다발 구간 분석, 위험구간 표시, 생태통로 설치 우선순위 결정, 탐방객 안전 알림 서비스 개발, 멸종위기종 보호 대책 수립 등 다양한 행정·연구·민간 분야에서 활용됩니다. 공간정보(GIS) 기반 시각화 및 재난안전 플랫폼과 연계한 실시간 대응 체계 구축에도 적합합니다.
