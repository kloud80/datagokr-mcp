description_portal: '일별총이동거리는 2024년 하반기 동안 폐기물처리 현장정보 관리시스템을 통해 수집된 사업장폐기물 수집·운반차량(GPS 단말기를 장착한 차량에 한함)의 총 이동거리 정보를 제공하는 데이터입니다. 해당 데이터에는 일자별 총 이동거리 정보가 포함되어 있으며, 이를 통해 폐기물 운반 체계의 운영 현황과 운행 실적을 분석하는 데 활용할 수 있습니다(기준일자, 총이동거리)* 본 데이터는 폐기물처리 현장정보 관리시스템을 통해 수집된 GPS 위치정보를 기반으로 생성되었으며, GPS 단말기가 정상적으로 설치·운영된 차량의 위치정보만을 대상으로 집계됩니다.* 컬럼별 상세정보○ 기준일자 : 데이터 집계 기준이 되는 날짜 (YYYY-MM-DD)○ 총이동거리 : 기준일자 동안 발생한 전체 이동거리의 합계 (단위 : m)'
