description_portal: '본 데이터는 2019년 한 해 동안 설악산국립공원과 지리산국립공원에서 발생한 산악사고 현황을 지리정보 기반으로 구성한 자료입니다. 사고가 발생한 시점의 사고일시, 사고 발생 위치의 경도·위도 좌표, 사고유형(예: 낙상, 실족, 탈진 등), 사고자 상태(부상 또는 사망), 사고 원인 등의 항목으로 구성되어 있으며, 각 사고 사례별 정보가 개별 레코드로 표기됩니다. 데이터는 구조·구급 활동, 사고 예방 캠페인, 안전시설 보강 등 국립공원 내 안전관리 정책 수립의 기초자료로 활용될 수 있으며, GIS(지리정보시스템) 기반의 사고다발지 시각화, 시공간적 사고 유형 분석, 등산객 대상 위험지역 안내 콘텐츠 개발 등에도 유용하게 쓰입니다. 또한, 연도별 사고 변화 추이를 파악하거나 탐방로 등급 조정, 대피소 배치 등 공간계획 수립의 근거자료로도 활용 가능합니다.'
