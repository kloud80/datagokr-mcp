description_portal: '배출권거래제에 따라 할당대상으로 지정된 업체의 계획기간, 지정 연도, 업종, 업체명, 주소, 적용기준 등에 관한 주요 정보입니다.환경부 온실가스종합정보센터에서 운영 중인 국가온실가스종합관리시스템의 할당대상업체 현황에 관한 자료로, 업체의 계획기간, 지정 연도, 업종, 업체명, 주소, 적용기준 등으로 구성된 데이터입니다.온실가스 배출권의 할당 및 거래에 관한 법률에 따라, 연 평균 온실가스 배출량을 일정 기준 이상 배출하는 사업장 또는 업체를 보유한 경우 할당대상업체로 지정됩니다. * 계획기간 : 국가온실가스감축목표를 달성하기 위하여 5년 단위로 온실가스 배출업체에 배출권을 할당하고 그 이행실적을 관리하기 위하여 설정되는 기간'
