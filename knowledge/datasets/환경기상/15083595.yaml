summary_user: 당진시 관내 대기오염물질 배출시설(3종·4종·5종)을 사업장 한 곳당 한 행으로 정리한 파일로, 사업장명·소재지·전화번호와 시설 종 구분을 담는다(CSV 약 45KB). 주민이나 분석가가 "우리 동네 근처에 어떤 대기배출 사업장이 있고 몇 종 시설인가"를 확인하거나, 시 단위 배출시설 분포를 파악할 때 쓴다. 사업자번호 같은 전역 조인 키가 없어서, 다른 배출원·인허가 자료와는 사업장명이나 소재지 주소를 맞춰서만 연결할 수 있다.
description_portal: 본 자료는 **당진시 관내 대기오염물질 배출시설(3종·4종·5종)**의 설치 현황을 정리한 데이터입니다. 관내 사업장의 대기배출시설 현황을 파악하고 환경관리 정책 수립에 활용할 수 있도록 기본 정보 중심으로 구성되었습니다.데이터는 **연번, 사업자명, 소재지, 전화번호, 종(시설 구분)**으로 구성되어 있으며, 사업장의 위치 및 배출시설 종류를 확인할 수 있습니다.다만 소재지, 전화번호 항목은 개인정보 보호, 자료 미보유, 또는 기관 미제공 등의 사유로 일부 값이 존재하지 않아 공란으로 처리하였음을 함께 안내드립니다.본 자료는 당진시 환경관리 업무 및 공공데이터 활용을 위한 기초 행정자료로 제공되며, 법령 및 관리기준 개정에 따라 추후 변동될 수 있습니다.
