summary_user: 경기도 화성시 관내 쓰레기종량제봉투 지정판매소를 판매소 한 곳당 한 행으로 담은 건별 파일이며, 2,631건에 판매소명·도로명/지번 주소·영업상태·대형폐기물 스티커 판매 여부·관리기관명이 들어 있다. 시민이 가까운 봉투 판매소와 대형폐기물 스티커 취급 여부를 찾거나, 담당자가 영업 중인 판매소와 폐업한 판매소를 구분해 보는 데 쓴다. 소재지도로명주소·소재지지번주소(address)를 키로 다른 지점·주소 데이터와 이어 쓰며, 그 외 별도 코드표나 식별자 키는 없다.
description_portal: 데이터는 경기도 화성시 관내 쓰레기종량제봉투 지정판매소의 현황을 수록한 자료이다. 판매소명, 소재지 주소, 영업상태, 관리기관 등의 정보를 포함하고 있으며, 대형폐기물 스티커 판매 여부에 대한 항목도 함께 제공한다. 본 자료는 시민이 봉투를 구매할 수 있는 장소를 손쉽게 확인할 수 있도록 하며, 청소행정의 효율성과 주민 편의를 증진하는 데 활용된다. 판매소는 행정구역별로 구분되어 있으며, 운영 중인 지점과 폐업한 지점이 구분되어 제공된다. 또한, 관리기관명을 통해 담당 행정기관 정보를 확인할 수 있어 행정적 활용도 가능하다.
