summary_user: 태풍 사전단계이거나 태풍에서 약화된 뒤에도 우리나라에 영향을 줄 수 있는 열대저압부의 중심위치와 예상경로 등을 발표 건별로 담는 전국 단위 비공간 정보입니다. 재난 담당자나 주민이 지금 진행 중인 열대저압부가 어디에 있고 어느 쪽으로 움직일지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름 매핑이나 같은 기상청 코드로만 잇고, 열대저압부가 태풍으로 발달하면 태풍정보 서비스로 넘겨 이어 본다.
description_portal: '태풍정보(TD)는 태풍 사전단계 또는 태풍에서 약화된 뒤에도 우리나라에 영향을 줄 수 있는 열대저압부(Tropical Depression)를 대상으로 중심위치, 예상경로 등의 종합적인 정보를 제공합니다.※ 현재 진행 중인 열대저압부에 한하여 제공(태풍으로 발달 시 태풍정보로 제공)생산주기: 4, 10, 16, 22시 및 필요시 수시 발표보유기간: 2015년 ~ 현재<태풍의 정의>태양으로부터 오는 열에너지는 지구의 날씨를 변화시키는 주된 원인으로 작용합니다. 지구는 구형으로 되어 있어 저위도와 고위도 사이에는 열에너지 불균형이 나타납니다.태양의 고도각이 높아 많은 에너지를 축적한 적도부근의 바다에서는 대류구름들이 만들어지게 됩니다. 때때로 이러한 대류구름들이 모여 거대한 저기압 시스템으로 발달하게 되는데, 이를 태풍이라고 부릅니다. 태풍은 바다로부터 증발한 수증기를 공급받아 강도를 유지하면서 고위도로 이동하게 됩니다. 이러한 과정을 통해 태풍은 지구 남북 간의 에너지 불균형을 해소하는 역할을 합니다.'
