summary_user: '경상남도 양산시에 등록된 폐기물 처리 업체를 업체별 한 행으로 담은 원장 파일로, 업소명·소재지·연락처와 처리업 구분, 폐기물 종류, 처리대상 폐기물을 담는다. 양산시에서 특정 폐기물(예: 건설폐기물·지정폐기물)을 맡길 처리업체를 찾는 사업자나, 시 안의 처리업체 분포를 살피는 분석가가 쓴다. 전역 조인 키나 사업자번호 컬럼이 없어 다른 데이터와는 업소명·소재지 주소를 맞춰 잇거나, 같은 양산시의 다른 폐기물 데이터와 나란히 놓고 쓴다.'
