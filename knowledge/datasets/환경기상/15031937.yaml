description_portal: 성남시 폐기물 처리업체 현황 자료는 성남시 내에서 폐기물 처리 업무를 수행하는 업체들의 정보를 정리한 자료입니다. 이 자료는 생활폐기물, 건설폐기물, 지정폐기물 등 폐기물 종류에 따라 분류되어 업종, 업체명, 주소, 전화번호 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다. 해당자료는 폐기물 배출시설 관리, 재활용 정책수립 등의 기초 자료로 활용할 수 있습니다.
