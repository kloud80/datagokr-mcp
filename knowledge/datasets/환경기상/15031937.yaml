summary_user: 성남시 안에서 폐기물 처리 업무를 하는 업체를 한 행에 한 곳씩 담은 업체 목록 파일(CSV, 약 13KB)로, 업종·업체명·주소·전화번호와 데이터기준일자를 담는다. 성남시에서 건설폐기물이나 지정폐기물을 맡길 처리업체를 찾는 사업자, 또는 시 안의 처리업체가 업종별로 어떻게 분포하는지 보려는 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명·주소를 맞춰 붙이거나 같은 기관(성남시) 자료끼리만 이어 쓴다.
limits: 사업자번호나 허가번호 같은 공통 키가 없어 다른 기관의 처리업 허가·올바로 자료와 정확히 연결하기 어렵고, 업체명·주소 매칭에 기대야 한다. 폐기물 발생량·처리량 같은 통계는 담지 않는 업체 목록이며, 범위는 성남시 한 곳뿐이다.
