summary_user: 관광코스별 관광지의 동네예보·기상지수예보와 시군구별 관광기후지수를 조회하는 API로, 전국 시군구 단위의 예보 값(관광기후지수와 그 등급 등)을 담는다. 여행객이나 관광 사업자가 '이번 주말 특정 관광코스나 시군구의 관광 날씨가 괜찮은가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 시군구명·지역 ID(cityAreaId) 같은 이름·코드 매핑으로 다른 지역 데이터와 연결해야 한다.
description_portal: 관광코스별 관광지의 동네예보, 기상지수예보, 시군구별 관광기후지수 정보를 조회하는 서비스(참고-예시) 관광코스 -관광지남호고택에서의 하룻밤 - 봉화천년의 비밀을 지닌 고찰에서 캠핑을하다 - 영동밝고 청정한 영양의 산천을 찾아서 - 영양켜켜이 쌓인 세월의 아름다움을 찾아서 - 보은속리산이 그려낸 즐거운 나날 -- 괴산, 보은청주의 자연에서 배우면서 뒹굴자 - 청주캠핑을 즐기며 여유롭게 돌아보는 태안 - 태안캠핑에 문화와 예술을 더하다 - 계룡, 논산백제 땅에 캠핑하다 - 논산서해다바에 안기고 체험마을에 머물다 - 보령, 서천충청남도의 보물 같은 마을 풍경 - 예산충청남도의 자연에 풍덩 빠져 즐기다 - 서산
team:
  dept: 국가기후데이터센터
services:
  - op: /getTourStnVilageFcst1
    name: 동네예보조회
    endpoint: https://apis.data.go.kr/1360000/TourStnInfoService1/getTourStnVilageFcst1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: dataType
        required: false
        desc: 요청자료형식(XML/JSON)
      - name: CURRENT_DATE
        required: true
        desc: 2016-12-01 01시부터 조회
      - name: HOUR
        required: true
        desc: CURRENT_DATE부터 24시간 후까지의 자료 호출
      - name: COURSE_ID
        required: true
        desc: 관광 코스ID
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
  - op: /getCityTourClmIdx1
    name: 시군구별관광기후지수조회
    endpoint: https://apis.data.go.kr/1360000/TourStnInfoService1/getCityTourClmIdx1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: dataType
        required: false
        example: XML
        desc: 요청자료형식(XML/JSON)
      - name: CURRENT_DATE
        required: true
        example: '2018123110'
        desc: 2018-12-31 00시부터 조회
      - name: DAY
        required: true
        example: '3'
        desc: CURRENT_DATE부터 입력값까지의 자료 호출
      - name: CITY_AREA_ID
        required: false
        example: '5013000000'
        desc: 시군구 아이디
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
