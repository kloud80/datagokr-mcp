summary_user: 경기도 용인시 관내 폐수배출시설을 사업장 한 곳당 한 행으로 담은 파일 데이터로, 사업장명·소재지 주소·업종·종별·하루 폐수 발생량 또는 배출량(세제곱미터)이 들어 있다. 주민이나 분석가가 "우리 동네 주변에 하루 폐수를 많이 내는 사업장은 어디이고 어떤 업종인가"를 확인하거나, 업종·종별에 따른 배출 규모를 비교할 때 쓴다. 전역 조인 키는 없어서 다른 수질 오염원·수질 측정 데이터와는 사업장명이나 소재지 주소를 맞춰 붙이거나 같은 기관(용인시) 자료끼리만 이어 쓴다.
limits: 사업자번호 같은 공통 코드가 없어 다른 데이터와 연결하려면 사업장명·주소를 직접 대조해야 한다. 범위는 용인시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
