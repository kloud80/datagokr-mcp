description_portal: 본 데이터는 관내 중금속 측정 현황 정보이다. 측정 매체별 중금속 종류, 측정값, 환경 기준 초과 여부, 측정 지점 등의 세부 내용을 포함한다. 중금속 측정은 대기, 수질, 토양 등 환경 매체 내 중금속 농도를 파악하여 환경 오염 및 건강 위해를 평가하는 활동이다. 해당 자료는 환경 관리 정책 수립, 오염원 규제, 오염 토양 정화 사업에 활용된다. 중금속은 생물학적으로 축적되어 인체 건강에 심각한 영향을 미칠 수 있으므로 지속적인 모니터링이 필요하다. 측정 결과 분석을 통해 중금속 오염 실태를 파악하고 오염원 관리 대책을 마련할 수 있다. 또한 오염 기준 초과 지역에 대한 정밀 조사 및 정화 조치를 통해 환경 및 건강 피해를 예방한다. 본 정보는 정기적으로 갱신된다.
