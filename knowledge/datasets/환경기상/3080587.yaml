summary_user: 광주환경공단 광역위생매립장으로 들어온 폐기물을 구분·시설명별로 반입 차량 대수와 반입량(톤)으로 정리한 집계 파일이며, 포털 설명상 월별로 나뉘어 있고 CSV 한 개(약 118KB)로 제공된다. 지자체 담당자나 분석가가 "매립장 반입량이 월별로 어떻게 변해 왔고, 남은 매립 용량을 언제쯤 검토해야 하는가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명 같은 이름 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 광주환경공단 광역위생매립장 폐기물 반입현황에 대한 데이터로, 매립장으로 반입되는 폐기물의 규모와 반입 현황을 월별로 구분하여 제공합니다. 해당 데이터에는 월별 반입차량대수, 총 반입량, 반입일수, 일평균 반입량 등의 항목이 포함되어 있어, 폐기물 반입 추이를 체계적으로 분석할 수 있도록 구성되어 있습니다. 이 데이터는 매립장 운영 효율성 평가, 폐기물 처리계획 수립, 적정 반입관리 및 시설 용량 검토 등의 행정적 활용은 물론, 폐기물 발생량 모니터링과 환경정책 수립을 위한 기초자료로도 유용하게 활용될 수 있습니다.
