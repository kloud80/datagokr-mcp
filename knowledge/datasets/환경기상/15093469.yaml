summary_user: 경상북도 김천시 관내 종량제봉투·음식물쓰레기 납부필증·대형폐기물 스티커를 파는 지정 판매소를 한 곳씩 담은 파일로, 판매처명·도로명주소·우편번호·위도·경도와 품목별 취급 여부를 함께 싣는다. 김천시민이 집 근처에서 음식물 납부필증이나 대형폐기물 스티커를 파는 가게가 어디인지 찾을 때, 또는 지도·생활정보 서비스에 판매소 위치를 올릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표 기준의 위치 매칭, 또는 같은 김천시의 대형폐기물·수거함 파일과 나란히 놓는 방식으로 잇는다.
description_portal: 이 데이터는 경상북도 김천시 관내 종량제봉투 및 음식물쓰레기 납부필증, 대형폐기물 스티커 등을 취급하는 지정 판매소의 정보를 제공합니다. 판매처명, 도로명주소, 우편번호, 위도·경도 좌표 등 위치 정보와 함께 각 판매소별로 종량제봉투, 음식물납부필증(가정용 및 120L), 대형폐기물스티커, 특수규격봉투의 취급 여부를 포함하고 있습니다.이 데이터는 김천시민이 가까운 판매처를 쉽게 확인하고 폐기물 관련 용품을 편리하게 구매할 수 있도록 돕기 위해 구축되었으며, 시의 효율적인 폐기물 관리 행정과 자원순환 정책 수립에도 활용될 수 있습니다. 또한 민간 지도서비스나 생활정보 앱 등에서도 지역 생활 편의 서비스 개발의 기초자료로 활용될 수 있습니다.
