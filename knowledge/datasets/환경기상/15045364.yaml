summary_user: 제주특별자치도 재활용도움센터 182곳을 한 곳당 한 행으로 담은 건별 파일로, 읍면동·명칭·주소·운영 시작·종료 시간과 품목별 배출 가능 여부(소형폐가전, 폐의약품, 폐식용유, 빈병 환불, 폐농약 등)를 싣는다. 제주 주민이 폐의약품이나 폐식용유를 시간 제약 없이 버릴 수 있는 가까운 센터가 어디인지 찾는 질문에 쓴다. 조인 키는 주소(address)뿐이며, 같은 주소 기준으로 다른 배출·수거 지점 파일이나 지도 좌표 변환과 이어 쓴다.
description_portal: '제주특별자치도에서 운영하는 재활용 도움센터와 관련한 데이터를 제공합니다.항목: 읍면동, 주소, 시작시간, 종료시간, 배출정보 (폐가전 / 종이팩 / 빈병) 등*클린하우스 쓰레기 배출체계의 문제점을 보완하여, 시민들이 요일과 시간에 구애받지 않고 재활용품을 편리하게 배출할 수 있도록 마련된 건축물 형태의 공간으로 클린하우스에 배출이 어려운 유해폐기물(폐농약, 폐의약품 등)과 폐식용유, 폐옷걸이 등 다양한 품목의 수거가 가능함 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/nature/environment/recycle.htm'
