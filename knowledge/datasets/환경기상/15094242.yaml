summary_user: 서울특별시 서초구에 등록된 지하수정화업체(지하수 속 오염물질을 제거·분해·희석해 수질을 개선하는 업체)의 인허가 정보를 업체 1곳당 1건으로 담으며, 사업장명·주소·인허가일자·영업상태(영업/폐업)·휴폐업일자·좌표·자본금·시설장비 등이 들어 있다. 사업자나 분석가가 "서초구에서 현재 영업 중인 지하수정화업체는 어디이고 언제 인허가를 받았나"를 확인하거나, 토양정화·지질조사 등 인접 업종의 협력사 후보를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
