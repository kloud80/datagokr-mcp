description_portal: 2026년 7월 10일 기준, 부산광역시 남구 대연동에 설치된 폐형광등 및 폐건전지 분리수거함의 위치 정보를 행정동, 설치 대상지, 대상지 유형 등으로 정리한 자료입니다. 폐형광등과 폐건전지는 중금속 등 유해물질을 포함하고 있어 일반쓰레기와 혼합 배출 시 환경 오염의 원인이 될 수 있으므로, 반드시 전용 수거함에 분리배출해야 합니다. 올바른 분리배출은 자원 재활용과 환경 보호에 기여하는 첫걸음입니다. 수거 및 배출 관련 문의는 각 동 행정복지센터 또는 남구청 자원순환과(☎051-607-4454)로 연락해 주시기 바랍니다.
