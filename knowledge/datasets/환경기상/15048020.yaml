summary_user: 올바로시스템에 등록된 2024년 건설폐기물 실적보고 중 데이터 개방에 동의한 사업장의 건별 기록 245행을 전국 시군구 단위로 담는다. 공사명·업체명·폐기물명별 연 발생량(톤)을 보고 싶은 분석가나 지자체 담당자가 어느 지역 어떤 공사 현장에서 어떤 건설폐기물이 얼마나 나오는지 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시도·시군구 이름 매핑이나 업체명 대조, 또는 같은 기관 코드로만 이어 쓴다.
description_portal: 한국환경공단에서 운영하는 폐기물관리시스템(올바로시스템)에 등록된 건설폐기물에 대한 2024년 실적보고 데이터[연도, 시도, 시군구(관할관청), 공사명, 업체명, 폐기물명, 연간 발생량 등]를 제공합니다. 참고로 해당 데이터는 공공데이터포털에 데이터 개방을 동의한 사업장 실적보고 입력 정보에 한하여 추출된 데이터셋이며, 사업장에서 데이터 입력 시점에 따라 다소 데이터가 달라질 수 있습니다. 또한 데이터의 임의 변경 및 수정은 절대 불가하오니 이점 유의하여 활용 바랍니다. 감사합니다.
