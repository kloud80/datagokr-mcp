summary_user: 대구 동구 안의 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호·주소·행정동/법정동·위도·경도와 월배출량(kg)·배출(처리)방법을 담는다. 동네에서 음식물쓰레기를 많이 내는 급식소·대형 음식점·대규모 점포가 어디인지, 사업장별로 한 달에 얼마나 배출하는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·행정동명으로 맞추거나 위도·경도로 지도 위에 겹쳐 쓴다.
description_portal: '음식물류폐기물을 다량 배출하는 사업장(이하 “다량배출사업장”)은 주변의 위생 및 환경 문제를 줄이기 위해 별도 관리·신고·처리가 의무화된 사업장입니다. 다량배출사업장은 음식물쓰레기 발생량을 줄이고, 위생적 처리와 재활용 체계 확립이 법적으로 의무화되어 있어, 체계적인 자원관리 및 환경보전에 중요한 역할을 수행합니다. 다량배출사업장의 기준집단급식소: 1일 평균 급식인원이 100명 이상(사회복지시설 제외)일반·휴게음식점: 영업장 면적 200㎡ 이상대규모 점포(백화점·할인점), 농수산물 도매시장 및 공판장, 관광숙박업소 등도 포함해당 데이터에는 사업장명, 주소, 월 배출현황(kg단위), 배출방법 등의 정보가 포함되어 있습니다.'
