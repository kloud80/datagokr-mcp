description_portal: '본 데이터는 충청북도 소재 동물원의 운영 현황과 시설명,기초 운영현황 등에 대한 정보를 제공하는 데이터 입니다. ㅇ 데이터 구성항목   -  동물원 현황 : 업종, 시설명, 소재지, 최초 설립일에 대한 데이터 제공   - 사업장 구분 : 동물원의 운영 주체에 따른 사업장 구분에 대한 데이터 제공   - 보유동물 현황(요약) :  CITES, 가축, 일반종 등 동물원에서 보유중인 동물 분류에 대한 데이터 제공   - 실내형 여부 : 동물원의 실내 또는 실외 시설물 운영 여부에 대한 데이터 제공   - 사육사 수 : 동물원 별 동물 관리 인력 규모 현황에 대한 데이터 제공'
