summary_user: 환경영향평가 사업의 위생공중보건 분야 조사지점(지점명·주소·X/Y좌표·조사기간)별로 조사차수마다 측정한 유해대기물질 농도(시안화수소·암모니아·황화수소·벤젠·포름알데히드·중금속 등)를 담은 건별 조사 원천 파일로, 범위는 전국이다. 개발사업 예정지 주변 주민이나 분석가가 특정 사업 인근에서 평가 당시 벤젠·황화수소 같은 유해물질이 얼마나 측정됐는지 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 사업코드로 같은 기관의 다른 환경영향평가 항목별·협의 현황 데이터와 잇거나 좌표·주소로 사업구역·토지이용 데이터와 공간 대조해 쓴다.
