summary_user: 충청남도 대기오염측정망시스템에서 뽑은 측정항목 목록으로, 미세먼지·초미세먼지 등 대기오염 측정항목별 코드·이름·전체명·측정 단위·소수점 자릿수·사용 여부를 항목 1건당 1행으로 담은 작은 코드표 파일이다. 충남 측정망의 시간별 대기질 측정자료를 받아 쓰는 분석가가 항목코드가 어떤 오염물질이고 단위가 무엇인지 해석할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 같은 기관의 측정자료와는 항목코드(항목코드)나 항목명을 맞춰 연결한다.
