description_portal: '기상청에서 과거에 발표한 중기예보 자료를 제공합니다.중기예보란 예보일로부터 4일에서 10일까지의 기간에 대한 예보를 뜻합니다.4일에서 7일까지는 오전과 오후로 구분하여 예보하고, 8일에서 10일까지는 일 단위로 구분하여, 기상전망, 예보구역별 육상 및 해상 날씨, 지점별 기온, 파고 등을 예보합니다.중기예보 자료를 DB에서 조회하고, CSV파일로 다운로드 받을 수 있습니다.* 2019.5.1. 부터 중기예보에 강수확률(%)과 최저·최고기온 기온예보의 상·하한범위 제공(2019.4.30.18:00 발표부터 적용)※ 강수확률: 현재와 유사한 대기상태에서 예보기간 중 지정된 장소에서 강수가 내릴 가능성을 확률로 나타낸 것(예시. 강수확률 60%)※ 최저·최고기온 기온예보의 상·하한범위는 41개 지점만 해당'
