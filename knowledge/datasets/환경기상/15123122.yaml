summary_user: 항공기상청이 인천비행정보구역(인천 FIR)에 대해 발표한 공역기상특보(SIGMET)와 저고도 공역기상특보(AIRMET)를 전문 단위로 담은 파일(xlsx, 약 20KB)로, 전문시각·전문번호·전문상태·전문타입·일기현상과 전문 원문이 함께 들어 있다. 항공사 운항관리자나 항공기상 분석가가 '특정 시기에 인천 FIR에 어떤 위험기상(일기현상) 특보가 몇 번 발표·취소됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공항명이나 시각(전문시각·입력시각)을 이름·시간 기준으로 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 예보구역·격자(nx,ny) 기반의 다른 기상 예보·특보 데이터와 바로 붙지 않는다. 범위는 인천 FIR 공역 단위의 비공간 데이터라 행정구역별 분석에는 맞지 않으며, 전문 내용 해석은 항공기상청 '공역기상 예특보 지침'을 따로 참고해야 한다.
