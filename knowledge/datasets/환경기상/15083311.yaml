description_portal: '부산광역시 영도구 환경 인허가업소 현황에 대한 데이터로 대기,  폐수, 소음, 휘발성유기화합물, 기타 수질 배출 사업장에 대한 자료를 제공합니다. 업소명, 소재지, 업종, 대기, 수질, 소음, 휘발성유기화합물 등 허가/신고 여부 등의 내용을 포함하고 있습니다. 대기환경보전법, 물환경보전법, 소음진동관리법 규정에 의한 오염물질 배출시설의 설치허가, 설치신고 및 방지시설의 설치 등에 관한 구체적인 정보를 제공하고 있습니다. 업종별, 사업장별, 규모별, 인허가 날짜별 조회가 가능합니다. 배출시설의 허가(신고)는 배출시설별로 허가 받거나 신고하여야 하며 기존 인허가된 사업장에 신규 배출시설을 추가하는 경우에는 기존 인허가 사항에 배출시설을 추가하여 관리하고 있습니다. 관심 지역(예: 부산시 영도구) 또는 관심 업종(제조업, 폐수배출업 등)에 따라 사업장 목록을 필터링 하여 어떤 업체들이 인허가를 받았고, 어떤 오염물질을 배출하는지 파악 가능하며, 환경 개선 노력이나 오염 감시, 정책 필요성 분석 자료로 활용가능합니다. 기업 분석 또는 시장 조사 자료로 활용하여 환경 관련 사업체 수, 산업 추세, 새로운 인허가 동향 등을 파악해 환경산업 시장 규모나 잠재력 평가 가능합니다. 환경관련 사업체 수는 최근 증가해왔다는 통계가 있습니다. 환경정보공개 시스템에서는 연도별, 지역별, 산업유형별로 등록사업장 수, 용수 사용량, 에너지 사용량, 폐기물·배출물량 등 주요 환경지표를 집계해서 제공합니다. 이를 통해 어떤 산업, 지역이 환경적으로 어떤 압력을 받는지 모니터링 가능합니다.'
