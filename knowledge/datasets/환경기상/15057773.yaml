summary_user: 국립환경과학원 물환경정보도 가운데 도시 하천을 지나는 수질측정망(도시관류) 지점의 위치 도형과 속성을 담은 지점 단위 원천 목록으로, 범위는 전국입니다. 분석가가 '우리 도시를 흐르는 하천의 수질측정 지점은 어디에 있고 언제 설치·폐쇄됐나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 측정소 이름이나 측정소 코드(st_cd)를 같은 기관의 수질측정망 측정값 자료와 이름·코드로 맞춰 수질 시계열과 이어 쓰고 하천·댐 등 수자원 자료와 같은 물 맥락에서 함께 본다.
