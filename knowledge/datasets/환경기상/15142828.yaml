summary_user: 환경영향평가 대상 사업구역을 기준으로 조사된 인구·주거 속성(남녀별·전체 인구수, 총 가구수, 총 주택수, 주택보급률, 기준년도, 시군구읍면동 명칭)과 사업 후 상근·이용·주택계획 인구 등 예측 정보를 사업 단위로 담으며, 범위는 전국이고 행정단위는 읍면동입니다. 개발사업 예정지 주변의 인구·주거 규모가 어느 정도이고 사업 후 인구가 얼마나 늘 것으로 예측됐는지 확인하려는 분석가나 사업자가 쓴다. 필수 파라미터인 환경영향평가 사업관리번호(mgtNo)를 다른 환경영향평가 데이터(협의 현황·사업구역 등)에서 먼저 받아 넘겨야 하며, 전역 조인 키는 없어 그 외 데이터와는 읍면동 명칭 매핑으로만 연결한다.
limits: 사업관리번호(mgtNo) 없이는 조회할 수 없고, 사업 후 인구 예측 오퍼레이션(/getPredict)은 최소 파라미터 호출에서 응답이 없었다. 평가 시점에 한 번 생성된 뒤 바뀌지 않는 이벤트성 데이터라 현재 인구·주거 현황으로 쓰기 어렵다.
