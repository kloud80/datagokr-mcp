description_portal: 환경부 국립환경과학원에서 제공하는 환경영향평가 관련 API는 특정 사업구역을 중심으로 예측 및 조사된 인구와 주거 속성 정보를 통해 해당 지역의 인구·주거 특성을 파악할 수 있게 하며, 인근 지역의 개발 현황(건수), 사업코드, 사업 후 상근인구, 사업 후 이용인구, 사업 후 주택계획인구 등을 조회할 수 있고, 환경영향평가 대상 사업구역을 기준으로 조사된 주택보급률(%), 환경영향평가 사업코드, 년도, 남녀별 인구수 및 전체 인구수, 총 가구수(가구), 총 주택수(호), 데이터 기준년도 배열, 시군구읍면동 명칭 등의 세부 정보를 함께 제공하는 서비스 입니다.
