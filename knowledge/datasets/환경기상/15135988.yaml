description_portal: 본 데이터는 익산시 내 여러 지점에 설치된 무인악취 측정기를 통해 자동으로 수집된 악취 관련 정보를 모아 정리한 자료이다. 측정 내용에는 복합악취, 황화수소, 암모니아, TVOC 등이 포함되어 있으며 설치장소는 체리부로, 예술의전당, LG화학 익산공장,  국도화학 익산지점, 기안1차 아파트, 정다운 익산공장, 동아2차 아파트 등이다. 이 자료는 환경오염을 관리하고 악취 민원을 해결하는 데 필요한 과학적 근거를 제공하며 주요 악취 발생 지역의 패턴을 분석할 수 있도록 구성되어 있는 자료로, 익산시 대기오염 분석에 기초자료로 활용할 수 있다.
