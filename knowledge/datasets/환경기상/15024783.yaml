summary_user: 광주 소방학교 호흡보호장비정비실(산소통 충전 시설) 안에서 충전할 때마다 측정한 미세먼지 농도를 날짜별로 담은 단일 CSV 파일(약 8KB)이며, 포털 설명상 2023년 12월부터 2024년 12월까지의 측정값이 들어 있다. 소방 장비 관리 담당자나 실내공기질 분석가가 '충전 시설 실내 미세먼지가 월별로 어떻게 변했나'를 확인하는 데 쓴다. 필드는 날짜·미세먼지농도·데이터기준일자뿐이고 측정소코드 같은 전역 조인 키가 없어, 다른 대기질 데이터와는 날짜를 기준으로 맞대어 보는 정도로만 이어 쓴다.
