summary_user: 전국 자치단체가 관리하는 환경전문공사업(대기·소음진동·수질오염방지시설 설계·시공 업소) 인허가 정보를 업소 단위로 담으며, API 전체 5,903건이다. 사업자나 분석가가 특정 지역에 인허가를 받은 환경전문공사업체가 어디에 있고 영업·폐업·휴업 상태가 어떤지 확인하는 데 쓴다. 도로명주소·지번주소와 도로명주소 코드(시군구·읍면동·우편번호 등) 같은 주소 키로 다른 주소 기반 데이터와 이어 쓰며, 좌표(X·Y)는 Bessel 중부원점TM(EPSG:5174) 기준이다.
limits: 필수 파라미터인 기준일자(BASE_DATE)와 개방자치단체코드(OPN_ATMY_GRP_CD)는 다른 데이터의 코드라 먼저 받아서 넘겨야 하고, /history 오퍼레이션은 최소 파라미터로 응답이 없었다. 검증은 5,903건 중 1,000행만 받았으므로 전량 수집은 페이지를 6회 이상 반복해야 한다.
