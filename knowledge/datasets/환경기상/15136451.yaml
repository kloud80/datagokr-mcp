description_portal: 본 데이터는 전국 국립공원에 분포한 경관자원에 대한 정보를 체계적으로 정리한 자료로, 국립공원의 자연미와 경관 가치를 보존하고 활용하기 위한 기초 공간정보입니다. 각 자원은 자원명, 주소, 위도·경도 좌표, 백대경관 포함 여부, 경관유형(산악, 해안, 하천 등), 자원특성, 자원등급, 관리주체 등의 항목으로 구성되어 있으며, CSV 포맷으로 제공됩니다. 해당 데이터는 경관 보전 및 관리계획 수립, 자연경관 홍보 콘텐츠 개발, 탐방 해설자료 제작, 경관자원 가치 평가 연구, 지도 기반 경관정보 서비스 등에 활용될 수 있습니다. 백대경관은 경관 우수성과 대표성을 기준으로 선정된 항목으로, 시각적 가치가 높은 자원에 대한 구분 정보도 함께 포함됩니다. 데이터는 민간 지도 API(Naver, Daum 등)와 연계한 시각화 및 공간분석에 적합한 구조로 제공됩니다.
