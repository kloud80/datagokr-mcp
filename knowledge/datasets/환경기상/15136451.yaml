summary_user: 전국 국립공원의 경관자원을 한 건씩 담은 CSV 원천 데이터로, 자원명·소속 국립공원·백대경관 여부·주소·경도·위도를 갖추고 2,295행이 전국 범위로 수록되어 있다. 경관 보전 계획을 세우는 담당자나 탐방 해설·홍보 콘텐츠 제작자가 '어느 국립공원에 백대경관이 어디 있는가'를 확인할 때 쓴다. 주소(address)와 경도·위도(coord)가 조인 키이므로 지도 API 시각화나 다른 국립공원·자연환경 공간 레이어와 좌표·주소 기준으로 이어 쓴다.
