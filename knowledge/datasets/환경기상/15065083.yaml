summary_user: 수질오염사고 방제업체를 업체 한 곳당 한 행으로 담은 전국 단위 파일(csv, 약 10KB)로, 업체코드·업체명·주소와 도·시군구·수계 구분을 담는다. 사고 대응 기관이나 분석가가 '사고 지점 가까운 시군구나 같은 수계에 지원 가능한 방제업체가 있는가'를 확인하거나 지역별 방제업체 분포와 사각지대를 살피는 데 쓴다. 전역 조인 키는 실측되지 않아 도·시군구 코드나 수계(수계코드), 주소 문자열을 매핑해 같은 기관의 수질 측정·오염원 데이터와 이어 쓴다.
description_portal: '"수질오염사고 방제업체정보"는 방제업체별 보유한 방제물품의 종류, 수량, 장비 현황, 소재지, 연락처 등을 포함하고 있어 수질오염사고 발생 시 인근에서 지원 가능한 업체를 신속히 파악할 수 있게 하는 공공데이터이다. 해당 정보는 사고 대응 기관이 사고 위치와 방제 자원의 접근성을 고려하여 효율적으로 자원을 배치하고 협력체계를 구성하는 데 활용될 수 있다. 또한 지역별 방제 역량의 분포를 분석하고, 방제 사각지대나 취약지역을 사전에 파악하는 데도 중요한 기반 자료로 활용 가능하다. 이를 통해 수질오염사고 대응의 신속성과 효과성을 높이고, 전반적인 환경 재난 대응체계의 질적 향상에 기여할 수 있는 데이터이다.'
