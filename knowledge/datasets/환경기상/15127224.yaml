description_portal: 본 데이터는 충청남도 부여군 관내에서 발생한 유해 야생동물인 멧돼지의 포획 현황을 기록한 실무 데이터입니다. 주요 구성 항목으로는 포획된 야생동물의 종류, 구체적인 포획 일자, 포획 지점의 지번 주소와 정밀한 위치 파악을 위한 위·경도 좌표 값이 포함되어 있습니다.데이터의 시계열적 범위는 2020년부터 최근 2026년 3월까지의 기록을 포괄하고 있어, 연도별·계절별 포획 패턴을 분석하기에 용이합니다. 특히 상세 주소와 좌표 정보를 포함하고 있어 **GIS(지리정보시스템)**를 활용한 포획 다발 지역 맵핑이나 유해 야생동물 이동 경로 분석, 그리고 그에 따른 군민 안전 대책 수립 및 농가 피해 예방을 위한 기초 행정 자료로서 활용 가치가 매우 높습니다. 2026년 3월 17일을 기준으로 현행화된 최신 자료라는 점이 특징입니다.
