summary_user: 경기도 고양시 가로변에 설치된 공공 쓰레기통을 한 개씩 담은 건별 목록으로, 설치위치·설치지점·쓰레기통 종류·도로명/지번 주소·위도·경도·관리기관과 전화번호를 담는다. 시민이 "이 거리 근처에 쓰레기통이 어디 있나"를 찾거나, 분석가가 유동인구 많은 구간에 쓰레기통이 부족한 곳을 지도에서 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 시군구명으로 맞춰 이어 쓴다.
limits: 고양시 한 곳만 다루므로 다른 시군과 비교하려면 지자체별 파일을 따로 모아야 하고, 표준 코드 같은 전역 키가 없어 연계는 이름·주소·좌표 매칭에 의존한다. 설치 지점 현황일 뿐 쓰레기 발생량이나 수거·처리 실적 같은 통계는 담지 않는다.
