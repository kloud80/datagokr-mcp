summary_user: 경기도 내 공원·야외시설에 설치된 애완동물 배변봉투함을 한 곳씩 담은 시설 목록으로, 시설명·지번주소·주변 상세설명·관리부서·데이터기준일자를 담는다. 반려견 산책 중 가까운 배변봉투함 위치를 찾는 시민이나, 시군별 반려동물 친화 시설 분포를 비교하려는 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소(locplc_lotno_addr)나 관리부서 이름을 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 애완동물의 배변 관리 편의를 위해 설치된 배변봉투함의 위치 및 관리 정보를 제공하는 자료로, 경기도 내 다양한 공원 및 야외시설에 설치된 배변봉투함의 현황을 포함하고 있습니다. 주요 항목은 시설명, 소재지지번주소, 주변상세설명, 관리부서명, 데이터기준일자 등으로 구성되어 있습니다. 이 데이터를 활용하면 지자체별 반려동물 친화 인프라 현황을 파악하고, 도시환경 개선 및 반려동물 정책 수립에 필요한 기초 자료로 활용할 수 있습니다. 또한 시민 생활편의 증진 및 쾌적한 공공장소 환경 조성에도 기여할 수 있는 정보입니다.
