description_portal: 충청남도 대기오염정보관리시스템 시간별 평균자료는 도내 대기질 측정소에서 수집된 관측 데이터를 기반으로 시간 단위의 대기오염 현황을 체계적으로 제공하는 자료이다. 1시간 평균 수정내역과 1시간 평균 최종자료를 통해 측정값의 보정 과정과 확정된 농도를 함께 확인할 수 있으며, 5분 단위 자료 수정 내역을 포함하여 보다 세밀한 변화 추이를 분석할 수 있다. 또한 8시간 이동 평균 자료를 제공함으로써 단기 변동을 완화한 대기오염 수준 파악이 가능하며, 대기질 평가, 정책 수립, 환경 연구 및 도민 정보 제공을 위한 기초 자료로 활용된다.
