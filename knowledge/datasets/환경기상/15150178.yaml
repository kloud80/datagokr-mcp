description_portal: 2024년 1월부터 12월까지 한국환경공단 대표누리집에 등록된 보도자료 목록을 정리한 엑셀 파일입니다. 각 보도자료의 순번, 제목, 등록일이 포함되어 있어 연간 주요 소식과 성과를 한눈에 파악할 수 있습니다. 목록에는 공단이 추진한 환경보전 사업, ESG 경영 실천 활동, 탄소중립 및 자원순환 정책, 대국민 캠페인, 설 명절 등 계절별 특별 행사 등 다양한 주제의 보도자료가 포함되어 있습니다. 이를 통해 공단의 한 해 활동 흐름을 분석하고, 향후 홍보 목적 등 다양한 주제로 활용할 수 있습니다.※ 한국환경공단 대표누리집 내 열린공간 메뉴 통해서 공단의 소식, 뉴스 등을 확인 할 수 있습니다.
