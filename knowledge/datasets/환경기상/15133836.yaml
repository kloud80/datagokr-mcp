summary_user: 녹색기업으로 지정된 사업장별로 기업명·소재지·규모·업종·지정기간·관할청과 본사 기준 녹색채권 발행 여부, 2021~2024년 연도별 발행 횟수를 한 행씩 담은 전국 단위 파일(CSV 약 17KB)이다. 투자자나 정책담당자가 '녹색기업 가운데 실제로 녹색채권을 발행한 곳은 어디이고, 연도별로 몇 번 발행했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 녹색기업·환경 인증 데이터와는 기업명이나 소재지 문자열 매칭으로만 이어 쓴다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와 붙일 때 기업명 표기 차이로 매칭이 어긋날 수 있다. 발행 여부와 횟수만 담고 있어 발행 금액이나 채권 조건은 이 데이터로 알 수 없다.
