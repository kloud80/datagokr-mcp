description_portal: 본 데이터는 환경책임투자 대상 기업의 녹색채권 발행 현황을 연도별로 집계·제공하는 공공데이터입니다. 총 28개 필드("연번", "기업명", "기업 구분1", "소재지 1", "규모", "업종1", "신청연도", "녹색채권 발행 여부", "발행 횟수 세부(2021~2023년도)" 등)를 포함하며, 기업별 녹색채권  발행 이력을 상세히 확인할 수 있습니다. 투자자는 ESG 채권 시장 동향 분석 및 발행 기업 선정에 활용하고, 기업은 자본 조달 전략 수립과 CSR 보고서 작성, 정책담당자는 채권 발행 활성화 정책 설계 및 성과 평가 자료로 활용할 수 있습니다. 또한 녹색채권 발행 효과 분석, 리스크 관리 방안 수립, 국제 기후금융 비교 연구, 금융기관 신용평가 지표 개발에도 유용합니다.
