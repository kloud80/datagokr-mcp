summary_user: 환경영향평가 대상 개발사업의 사업구역을 공간좌표 기준의 개별 피처 단위로 담으며, 포털 설명상 사업코드, 사업지 구분, 사업지점명, 구역의 길이·면적 같은 속성과 사업구역 폴리곤 이미지(WMS)를 전국 범위로 제공한다. 분석가나 사업자가 특정 지역에서 어떤 개발사업이 환경영향평가를 거치고 있는지, 그 사업구역이 어디까지인지 지도로 확인하는 데 쓰며, 개발 선행 지표로 볼 수 있다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 기관의 환경영향평가 협의 현황·항목별 평가정보와는 사업코드나 사업명 매핑으로, 토지이용규제·개발사업 데이터와는 좌표·주소로 이어 쓴다.
description_portal: 환경부 국립환경과학원에서 제공하는 환경영향평가 관련 API는 특정 사업구역에 대한 정보를 공간좌표를 기준으로  피쳐 정보(피쳐의 공간 좌표 데이터, 공간데이트를 구성하는 인덱스값, 환경영향평가 사업코드, 사업지구분, 사업지점명, 해당 공간데이타 구축 방법, 해당 공간데이터 값의 유효여부, 해당 공간에 대한 길이, 해당 공간에 대한 면적)를 제공하며 촤표체계, 반환 이미지 타입, 반환 배경 이미지 유무, 반환 이미지 너비/높이, 크기 와 같이 해당 공간좌표 기준으로 사업구역의 폴리곤 이미지를 제공하는 서비스 입니다.
team:
  dept: 기후국토환경연구과
services:
  - op: /getInfoWMS
    name: 사업구역WMS조회
    endpoint: https://apis.data.go.kr/1480523/BsnsAreaService/getInfoWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: 좌표 체계를 나타냅니다. 현재 EPSG:5179 좌표계를 지원합니다.
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getInfoWFS
    name: 사업구역WFS조회
    endpoint: https://apis.data.go.kr/1480523/BsnsAreaService/getInfoWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        example: EPSG:5179
        desc: 반환되어야 할 피처의 기하에 사용되어야 할 WFS가 지원하는 SRS
      - name: maxFeatures
        required: true
        example: '10'
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: false
        example: results
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        example: 1121426.8305,1696106.0294,1131719.8740798137,1726390.3853996482
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름.
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
