summary_user: 안산시에 접수된 대형 생활폐기물 배출신고를 신고 건별로 담은 파일로, 결제 여부, 접수일자, 품목·규격, 수량, 단가, 합계 금액이 들어 있습니다. 안산시 청소행정 담당자나 분석가가 "어떤 시기에 소파·가전 같은 품목이 얼마나 배출되고 수수료는 얼마나 걷히는가"를 볼 때 씁니다. 실측 컬럼에 전역 조인 키가 없어, 다른 지자체 대형폐기물 신고 파일이나 수수료 기준표와는 품목명을 맞춰 대조하는 방식으로만 이어 씁니다.
description_portal: 이 데이터는 시민이 배출한 대형 생활폐기물에 대한 신고 접수 정보를 정리한 자료입니다. 결제 여부, 접수일자, 품목 및 규격, 수량, 단가, 총 합계 금액 등의 항목으로 구성되어 있으며, 소파, 청소기, 선풍기, 홈시어터 등 다양한 폐기물 유형이 포함되어 있습니다. 품목별로 규격이 표기되어 있어 수수료 산정 기준 확인이 가능하며, 일부 항목은 ‘미결제’ 상태로 처리되어 향후 정산 확인 또는 행정 조치 대상일 수 있습니다. 신고일자는 일자 단위로 기록되어 있어 기간별 배출량 통계 분석에도 유용하며, 가전제품과 가구류 위주로 배출 비중이 높습니다. 본 자료는 생활폐기물 처리 효율화, 폐기물 배출 유형 예측 분석, 청소행정 계획 수립 등 환경관리 및 도시행정에 폭넓게 활용하실 수 있습니다.
