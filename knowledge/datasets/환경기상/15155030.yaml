summary_user: 전국 자치단체가 관리하는 환경측정대행업(대기·실내공기·악취·수질·소음진동·빛공해 측정 대행) 업소의 인허가 정보를 업소 단위로 담으며, API 전체 4,371건이다. 사업자나 분석가가 특정 지역에 측정대행업소가 어디에 있고 영업 중인지, 폐업·휴업 여부는 어떤지 확인하는 데 쓴다. 도로명주소·지번주소 등 주소 필드(address 키)로 다른 주소 기반 데이터와 이어 쓰며, 호출할 때 필요한 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
limits: 필수 파라미터인 기준일자(BASE_DATE)와 개방자치단체코드(OPN_ATMY_GRP_CD)는 다른 데이터의 코드라 먼저 확보해야 하며, /history 오퍼레이션은 최소 파라미터로 응답이 없었다. 검증 때 받은 것은 1,000행이고 확인된 기간은 2024-09-12~2026-10-01이므로 전체 이력을 확인한 것은 아니다. 업소 인허가 정보만 담으므로 실제 측정 결과나 오염도 수치는 알 수 없다.
