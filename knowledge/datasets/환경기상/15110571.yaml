summary_user: 대구광역시 동구가 지정한 중점공회전 제한지역을 장소(업체)별로 한 행씩 담은 건별 목록 API로, 등록번호·업체명·주소·전화번호·비고를 담고 범위는 동구 한 시군구다. 주민이나 운전자가 '동구에서 공회전이 제한되는 곳이 어디이고 연락처는 무엇인가'를 확인하거나, 행정·분석가가 제한지역 분포를 지도에 올려 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 업체명을 매칭해서만 이어 쓴다.
limits: 조인 키가 없어 사업자번호나 행정코드로 다른 사업장·대기질 데이터와 바로 연결되지 않고, 주소·이름 매칭에 의존해야 한다. 범위가 대구 동구에 한정되므로 다른 시군구나 전국 현황은 담지 않는다. 호출에는 포털 활용신청 후 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
