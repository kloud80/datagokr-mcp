summary_user: 생태·자연도(1:25,000 축척) 도엽 하나를 한 행으로 하여 1·2·3등급과 별도관리지역의 면적(㎢)과 전체 면적을 담은 전국 단위 집계 파일이다. 개발 사업자나 환경 분석가가 특정 지역 도엽에 보전 가치가 높은 1등급 지역이 얼마나 되는지, 도엽별 등급 구성이 어떤지 비교하는 데 쓴다. 행정구역 코드 같은 전역 조인 키는 없고 도엽번호·도엽명으로만 식별하므로, 다른 데이터와는 같은 1:25,000 도엽 체계를 쓰는 자료나 이름 매핑을 거쳐 연결한다.
limits: 공간 경계가 없는 비공간 통계라서 필지나 특정 지점이 몇 등급인지는 이 파일로 판정할 수 없다. 시군구 같은 행정단위 코드가 없어 행정구역별 집계를 하려면 도엽과 행정구역을 따로 대응시켜야 한다.
