description_portal: 항공기상통계 일극값 자료는 일정 기간 동안 관측된 기상요소 중 가장 극단적인 값을 정리한 통계자료입니다. 주로 온도, 강수량, 풍속, 시정, 기압 등 주요 기상요소에 대해 일 최고값, 일 최저값, 일 최대 순간풍속 등 극값을 산출하여 기록합니다. 이 자료는 특정 지역이나 공항에서 기상 현상의 강도와 특성을 분석하고, 이상기후나 극한기상 발생 빈도를 파악하는 데 활용됩니다. 또한 항공 안전관리, 시설 설계 기준 검토, 장기 기상변화 연구 등 다양한 분야에서 기초 자료로 이용되며, 기상청의 품질검증 절차를 거쳐 신뢰성 있게 제공됩니다.
