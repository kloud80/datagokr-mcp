summary_user: 경상북도 예천군 관내에서 사업장폐기물 배출자로 신고한 사업장을 한 행에 하나씩 담은 건별 명부로, 상호·사업장 도로명주소·폐기물 종류·기준일자를 담는다. 예천군에서 특정 종류의 사업장폐기물을 내는 사업장이 어디에 있는지 확인하려는 환경행정 담당자나 폐기물 처리·수집운반 사업자가 쓴다. 공통 조인 키가 없어 다른 데이터와는 상호나 주소 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 경상북도 예천군 관내에서 사업장폐기물을 배출하는 사업장의 신고 현황을 수록한 공공데이터이다. 사업장폐기물은 사업장에서 발생하는 폐기물로서 일반폐기물과 달리 보다 엄격한 관리가 요구되며, 배출자는 폐기물관리법에 따라 관할 지자체에 신고해야 한다. 본 자료에는 배출자 상호, 사업장 주소, 업종, 폐기물 종류의 항목이 포함되어 있으며, 이를 통해 지역 내 폐기물 배출 및 처리 현황을 파악할 수 있다. 해당 데이터는 발생원 관리, 환경오염 예방, 자원순환 정책 수립, 청정 생산 유도 등 다양한 환경행정 목적에 활용된다. 데이터는 예천군의 환경기준 및 관련 법령에 따라 정기적으로 갱신되며 체계적으로 관리된다.
