summary_user: 신축·리모델링 건축물이 취득한 녹색건축 본인증·예비인증 라이센스를 건축물 한 건당 한 행으로 담은 전국 단위 파일(csv)이며, 라이센스 구분·등급·번호, 시작일·종료일, 소유사, 건축물명·위치·사용용도를 포함한다. 특정 건물이 녹색건축 인증을 받았는지, 어떤 등급이 언제까지 유효한지 확인하거나 학교·업무·숙박 같은 용도별 인증 현황을 살펴보는 분석가나 사업자가 쓴다. 다른 데이터와 공통으로 맞출 전역 조인 키는 없어서 건축물명이나 위치(주소) 문자열로 건축물대장 등과 맞춰 이어 쓴다.
description_portal: 해당 정보는 한국환경산업기술원 건축물 LCA DB가 보유하고 있는 정보입니다. 해당 정보는 연번, 건축물구분, 라이센스 구분, 군축물 타입, 라이센스 구분, 라이센스 번호, 라이센스 시작일, 라이센스 종료일, 건축물 수유주, 건축물 명, 건축물 위치, 건축물 사용용도 컬럼으로 구성되어 있습니다. 해당 정보는 신축 또는 리모델링 된 건축물의 본인증, 예비인증 취득한 녹색건축 인증 라이센스 정보를 제공합니다. 해당 정보를 통해 학교, 복합, 숙박, 업무 건축물 등의 라이센스 정보를 활용할 수 있습니다. 그외 관련한 정보는 에코스퀘어 및 건축물 LCA 홈페이지에서 활용 가능합니다.
