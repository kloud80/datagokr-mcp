summary_user: 환경영향평가·전략환경영향평가 초안 공람 사업을 건별로 담으며, 목록은 사업명·사업구분·공람 기간을, 상세는 사업시행자·승인기관·사업비·사업규모·공람장소·설명회 일시와 장소·의견제출기간을 담는다(범위 전국, 위치는 사업지 주소 단위). 주민이나 사업자가 '우리 동네에 어떤 개발사업 초안이 공람 중이고 언제까지 의견을 낼 수 있나'를 확인하거나, 분석가가 협의 단계 사업을 개발 선행 지표로 볼 때 쓴다. 전역 조인 키는 없어서 환경영향평가 코드(eiaCd)나 고유번호, 사업명으로 같은 기관의 환경영향평가 협의 현황·사업구역·항목별 평가정보와 잇고, 사업지 주소로 토지이용규제·개발사업 데이터와 맞춰 본다.
