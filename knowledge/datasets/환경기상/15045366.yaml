summary_user: 제주특별자치도가 지정·관리하는 쓰레기 매립시설을 시설 한 곳당 한 행으로 명칭·주소·비고·위도·경도와 함께 담은 건별 목록 파일(csv, 약 2KB)이다. 제주 주민이나 분석가가 '우리 지역 가까이에 어떤 매립시설이 어디에 있나'를 지도에 표시하거나 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·시설명 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: '제주특별자치도에서 지정 및 관리 운영하는 쓰레기 매립시설과 관련한 데이터를 제공합니다.항목: 명칭, 주소, 비고, 위도, 경도*「폐기물관리법」에 의거하여 관리됨- 폐기물: 쓰레기, 연소재(燃燒滓), 오니(汚泥), 폐유(廢油), 폐산(廢酸), 폐알칼리 및 동물의 사체(死體) 등으로서 사람의 생활이나 사업활동에 필요하지 아니하게 된 물질- 폐기물처리시설: 폐기물의 중간처분시설, 최종처분시설 및 재활용시설로서 대통령령으로 정하는 시설자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1022'
