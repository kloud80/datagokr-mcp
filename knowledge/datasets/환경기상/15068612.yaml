summary_user: 제주특별자치도 안의 상수원보호구역을 구역 하나당 한 행으로 담은 작은 CSV 파일(866바이트)로, 구역명·면적(천㎡)·지정일자·취수장·취수능력(톤/일)·행정구역·수계를 기록한다. 제주에서 토지를 개발하거나 건축하려는 사업자·주민이 계획 부지 근처에 상수원보호구역이 있는지, 어느 취수장·수계와 관련되는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정구역명·보호구역명 같은 이름을 맞춰 연결해야 하며, 좌표·경계가 없는 비공간 목록이라 필지 단위 규제 판단에는 별도의 공간 레이어가 필요하다.
description_portal: '제주특별자치도에서 관리하고 있는 상수원 보호구역과 관련한 데이터를 제공합니다.항목: 보호구역명,면적(천미터제곱),지정일자,취수장,취수능력(톤.일),행정구역,수계 등*수도법을 근거로 하여 상수원의 확보와 수질의 보전을 위하여 필요하다고 인정되는 지역을 환경부장관이 지정, 보호하는 제도*보호구역 수 : 12개소(제주 8, 서귀 4)*보호구역 면적 : 1,821천㎡(제주 1,551, 서귀 270)자세한 사항은 제주특별자치도 상하수도본부 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jejuwater/square/open-reference.htm'
