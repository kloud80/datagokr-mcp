description_portal: 본 데이터는 해양수산부에서 관리하는 독도 바다사자 잔존뼈 3D 형상자료입니다. 본 데이터는 울릉도 및 독도 일대에 서식하였던 독도 바다사자(강치)의 2020년 발굴된 바다사자 잔존뼈의 3D 형상 정보로 구성되어 있습니다. 이 데이터는 교육전시 콘텐츠제작활용, 연구참고 자료활용, 가상현실 콘텐츠개발, 메타버스 콘텐츠제작, 디지털아카이브 구축자료 등에 활용할 수 있습니다. 관련분야 연구자, 정책담당자, 업계종사자 등에서 업무수행과 연구목적으로 참고자료로 활용할 수 있습니다. 해양수산 분야의 현황파악과 정책수립에 유용한 기초자료로 활용되고 있습니다.
