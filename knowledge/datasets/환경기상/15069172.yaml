summary_user: 전라남도(전남광주통합특별시) 내 환경오염물질 배출사업장을 사업장 1곳당 1행으로 담은 파일로, 점검기관·업소명·소재지·업종과 대기·수질 규모 종별, 관리 등급, 폐기물·유독물·비산먼지 통합점검 대상 여부를 담는다. 주민이나 분석가가 '우리 시군에 대기 1~2종 대형 배출사업장이 어디에 몇 곳 있고 어떤 업종인가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호·표준 코드)가 없어 다른 사업장·인허가 데이터와는 업소명과 소재지 주소를 맞춰 이어 붙여야 한다.
description_portal: '- 전라남도 내 환경오염물질 배출사업장(산단명, 업체명, 소재지, 대기종별, 수질종별, 업종 등)에 관한 정보입니다.- 전라남도청의 환경 관련 부서에서는 도내 환경오염물질 배출 사업장에 대한 관리 및 감독을 수행하고 있습니다. 이들 부서에서는 사업장의 배출 허용 기준 준수 여부, 오염물질 배출량, 환경 개선 조치 등에 대한 정보를 관리하고 있습니다.- 각 시군청의 환경 관련 부서에서도 지역 내 환경오염물질 배출 사업장에 대한 정보를 관리하고 있습니다. 특히, 특정 지역의 사업장에 대한 상세한 정보나 민원 사항은 해당 시군청을 통해 확인하실 수 있습니다.- 환경오염물질 배출 사업장에 대한 정보는 개인정보 보호 및 산업 기밀 등의 이유로 일부 제한될 수 있습니다.'
