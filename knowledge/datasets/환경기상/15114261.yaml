description_portal: '빗물이용시설 데이터는 빗물 관리 및 재활용과 관련된 시설에 대한 정보를 담고 있습니다. 이 데이터는 빗물 침투 시설, 저류 시설, 이용 시설 등 다양한 유형의 빗물 관리 시설에 대한 정보를 제공하며, 시설의 위치, 용량, 설치 연도, 사용 용도 등을 포함합니다. 또한, 데이터는 공공 및 민간 시설, 지자체별 현황, 법적 기준 충족 여부 등 다양한 기준으로 분류되어 제공됩니다.위치: 빗물이용시설이 설치된 구체적인 주소 또는 좌표입니다.설치 연도: 빗물이용시설이 설치된 시기입니다.저류조 용량: 빗물 저류조의 저장 용량 (보통 세제곱미터 단위)입니다.이용 용도: 빗물이용시설에서 빗물을 활용하는 목적 (예: 조경용수, 화장실 용수 등)입니다.'
