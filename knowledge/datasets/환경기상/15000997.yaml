summary_user: 전국 토양측정망 조사지점별로 연도·지점번호·지번 주소·지목(토지용도)·담당기관과 토양 오염물질 항목별 분석값을 담은 건별 측정 결과 데이터다. 주민이나 분석가가 "우리 동네 공장용지·학교용지 토양의 중금속 농도가 해마다 어떻게 변했나"를 지점 단위로 확인할 때 쓴다. 전역 조인 키는 없으므로 조사지점 주소(ADDR)나 지목명으로 행정구역·토지이용 데이터와 이름 매핑해 잇거나, 같은 기관의 다른 토양 데이터와 지점번호로 맞춰 쓴다.
description_portal: 전국적인 토양오염도 모니터링을 위해 공간정보의 구축 및 관리 등에 관한 법률에 따른 28개 지목 중 임야, 전, 답, 과수원, 목장용지, 잡종지, 대지, 공장용지, 학교용지, 공원, 체육용지, 유원지, 도로, 철도용지, 하천부지, 종교용지 등 국민건강 및 생활환경과 밀접한 16개 지목을 대상으로 총 2,000개소 중 격년으로 1,000개소로 운영중인 토양측정망에 대한 지점정보와 오염물질 총 23항목에 대한 분석결과를 종합한 정보를 제공하여 전국적인 토양오염 추세를 파악하고 토양오염 예방 등 토양보전정책 수립의 기초자료로 활용한다.
