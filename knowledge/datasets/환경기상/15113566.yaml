description_portal: '대구공공시설관리공단 환경자원사업소에서 관리하는 폐기물 반입업체 현황에 대해 안내해 드립니다.본 데이터는 대구 지역의 쾌적한 환경 유지와 효율적인 폐기물 처리를 위해 운영되는 공공데이터로, 사업소로 폐기물을 반입할 수 있는 자격을 갖춘 업체들의 상세 정보를 담고 있습니다.📋 주요 제공 정보제공되는 데이터는 이용자의 편의를 위해 다음과 같은 5가지 핵심 항목으로 구성되어 있습니다.지역명: 해당 업체가 소속된 구·군 단위의 행정 구역 정보회사명: 폐기물 반입 및 처리를 담당하는 법인 또는 사업체 명칭우편번호: 정확한 물류 및 행정 처리를 위한 5자리 국가기초구역번호주소: 업체가 위치한 도로명 주소 또는 지번 주소전화번호: 반입 절차 문의 및 업무 협의를 위한 대표 연락처'
