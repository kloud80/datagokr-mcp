summary_user: 전국 1:25,000 도엽 단위로 중분류 토지피복 22개 항목(주거·공업·상업지역, 논·밭, 활엽수림·침엽수림, 습지, 내륙수·해양수 등)의 면적(㎡)을 집계한 통계 파일로, 2023년 제작분이며 기준년도·제작년도가 함께 들어 있다. 특정 지역의 시가화 면적이나 산림·농지 비율을 도엽별로 비교하거나 비점오염 부하량 산정·환경영향평가의 기초 토지이용 현황을 파악하려는 분석가가 쓴다. 조인 키는 도엽번호(map_sheet_no)뿐이라 같은 도엽 체계를 쓰는 토지피복지도 공간 레이어나 다른 도엽 단위 주제도와 이어 쓰며, 행정구역 코드는 없다.
description_portal: 토지피복지도 작성 지침 개정 후 환경공간정보서비스에서 제공 중인 세분류 토지피복지도의 일반화 기법을 적용하여 제작된 중분류 토지피복 면적 통계자료 입니다.(2023년 제작된 1:25,000 도엽별, 분류항목별 면적 통계)중분류 토지피복지도는 22개의 분류항목으로 분류되고 있으며, 도엽별 분류 항목의 면적 단위는 ㎡ 입니다.토지피복지도란 주제도(Thematic Map)의 일종으로, 지표면 지형지물의 형태를 일정한 과학적 기준에 따라 분류하여 동질의 특성을 지닌 구역을 Color Indexing 한 후 지도의 형태로 표현한 공간정보 DB를 말합니다.토지피복지도는 지표면의 현상을 가장 잘 반영하기 때문에 지표면의 투수율에 의한 비점오염원 부하량 산정, 비오톱 지도작성에 의한 도시계획, 댐 수문 방류 시 하류지역 수몰피해 시뮬레이션, 기후대기 예측 모델링, 환경영향평가 등에 폭넓게 활용되며, 중앙정부 및 지방정부의 환경정책수립의 과학적 근거로서 위상을 가지고 있고 관련 학계의 다양한 연구자료로 활용되고 있습니다.*EU에서 회원국들의 토지현황에 대한 방대한 정보를 종합적으로 수집 및 관리하기 위해 1985년 유럽환경청(EEA)에서 추진한 전 유럽 토지피복지도 구축사업인 CORINE (Coordination of Information on the Environment)프로젝트에서 개념 정립하였고 이를 기반으로 우리나라 실정에 맞는 분류기준을 확정하여 1998년 환경부에서 최초로 남한지역에 대한 대분류 토지피복지도를 구축하였습니다.
