description_portal: '이 데이터는 중국의 환경산업 분야별 영업수입을 기준으로 선정된 상위 기업들의 리스트를 담고 있습니다. 데이터는 총 31개의 기업 정보를 포함하며, 다음과 같은 8개의 컬럼으로 구성되어 있습니다:일련번호: 리스트의 순서를 나타내는 번호입니다.환경 분야: 기업이 속한 환경 분야(예: 수처리 등)를 나타냅니다.기업 칭: 기업의 간략한 중국어 명칭입니다.기업명칭: 기업의 정식 명칭(중국어 및 한자 포함)을 나타냅니다.추정 영업수입(억 원): 각 기업의 연간 추정 영업수입을 억 원 단위로 나타냅니다.추정 영업수입(억 위안): 기업의 연간 추정 영업수입을 억 위안 단위로 나타냅니다.추정 등기자본(억 원): 기업의 등기자본(자본금)을 억 원 단위로 나타냅니다.홈페이지: 기업의 공식 웹사이트 주소입니다.이 데이터는 중국 환경시장에 진출하거나 협력 사업을 추진하려는 국내 기업 및 기관에게 시장조사, 경쟁사 분석 및 전략적 의사결정에 유용한 자료로 활용될 수 있습니다.'
