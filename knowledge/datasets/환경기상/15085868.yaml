description_portal: 서울특별시 은평구 쓰레기 수거업체 정보를 제공하는 데이터로 업체명, 수거지역 및  집하장 도로명 주소  정보 등을 제공합니다.해당 데이터는 서울특별시 은평구 내 쓰레기 수거업체 5개소의 운영 정보를 담고 있습니다.쓰레기 수거업체란 생활폐기물과 대형폐기물을 수집·운반하는 전문 업체로, 지자체와 위탁계약을 체결하여 지역별로 배정된 구역의 폐기물을 처리합니다. 은평구는 동별로 수거업체가 배정되어 있으며, 각 업체의 명칭과 담당 수거지역, 집하장 위치 등의 상세 정보가 포함되어 있습니다.동별 수거업체 현황을 보면 정현환경(1544-5373)이 구산동, 대조동, 응암1·2·3동을 담당하고 있으며, 나머지 지역은 각각 별도 업체가 배정되어 있습니다. 수거 일정은 월/수/금요일에는 구산동, 녹번동, 대조동, 불광1동, 신사2동, 수색동, 증산동, 갈현1동이, 화/목/토요일에는 갈현2동, 불광2동, 역촌동, 응암1·2·3동, 신사1동, 진관동이 해당됩니다.대형폐기물 수거시간은 오전 9시부터 오후 3시까지이며, 배출일 이후 동별 수거일 4일 이내에 처리됩니다. 수거 상황에 따라 지연될 수 있어 구체적인 문의는 해당 동별 수거업체로 직접 연락하거나, 청소행정과 폐기물 담당자(02-351-7565)에게 문의할 수 있습니다.
