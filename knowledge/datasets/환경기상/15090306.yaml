description_portal: 이 데이터는 2021년 9월 28일 기준으로 서울특별시 성북구 관내에 설치된 가로 휴지통의 위치와 관리 정보를 정리한 자료입니다. 각 휴지통의 설치 장소, 관리기관, 관리기관 연락처, 데이터 기준일 등의 정보가 포함되어 있으며, 버스정류장, 도로변, 광장 등 생활밀착형 공공장소의 휴지통 배치 현황을 파악할 수 있습니다. 본 자료는 도시 청결 유지, 생활폐기물 관리, 공공환경 인프라 확충, 지역별 청소행정 효율화 등 다양한 행정·연구 목적으로 활용 가능하며, 휴지통의 설치 밀도나 공간적 분포를 분석해 공공편의시설 개선 방향을 도출하는 데에도 유용한 기초 자료입니다.
