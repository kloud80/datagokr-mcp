description_portal: 은평구 거리가게 현황 관련 정보입니다. 속성은 연번, 명칭 ,품목, 소재지 도로명 주소, 소재지 지번 주소 등 허가 거리 가게 현황 상세 정보를 포함하고 있습니다해당 데이터는 서울특별시 은평구 내 허가 거리가게 20개소의 현황을 담고 있습니다.거리가게 허가제란 기존 무허가 노점상을 제도권 내에서 관리하기 위해 서울시가 2019년부터 도입한 정책입니다. 도시미관을 해치지 않는 일정 요건을 갖춘 거리가게에 정식으로 도로점용 허가를 내주고, 운영자는 점용료 납부 등 관련 의무를 다하며 안정적으로 영업할 수 있도록 하는 제도입니다.20개소의 거리가게는 각각의 명칭과 판매 품목, 정확한 위치 정보가 기록되어 있습니다. 이는 과거 무허가로 운영되던 노점들이 합법적인 "거리가게"로 전환된 것으로, 보행권 확보와 도시미관 개선을 동시에 추구하는 정책의 결과입니다.은평구의 경우 연신내 연서시장 일대에서 거리가게 허가제 사업이 진행되고 있으며, 이 데이터는 해당 지역을 중심으로 한 허가 거리가게들의 분포 현황을 보여줍니다. 각 거리가게의 판매 품목과 위치가 명시되어 있어 주민들이 필요한 상품을 구매할 수 있는 곳을 쉽게 찾을 수 있습니다.이 데이터는 보행환경 개선과 상권 활성화라는 두 가지 목표를 동시에 달성하려는 서울시 거리가게 정책의 구체적인 성과를 보여주는 기록입니다.
