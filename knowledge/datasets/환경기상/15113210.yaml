summary_user: 포항시 관내 권역별로 공동주택(20세대 이상) 생활쓰레기를 수집·운반하는 대행업체 현황을 업체 한 곳당 한 행으로 담은 작은 파일(약 778바이트)이며, 업체명·도로명 소재지 주소·전화·팩스 번호를 싣는다. 포항 아파트 주민이나 관리사무소가 "우리 동네 쓰레기 수거가 안 되면 어느 업체에 연락해야 하나"를 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명이나 도로명 주소 문자열을 맞춰 연결하거나, 같은 포항시의 다른 폐기물 배출·수거 파일과 나란히 놓고 보는 정도로 쓴다.
description_portal: '포항 관내 권역별 공동주택(20세대 이상) 생활쓰레기 수집운반 대행업체 현황입니다. 상호명, 주소,전화번호, 팩스번호 등이 기재되어 있습니다.읍면동별 권역은 다음과 같습니다.1권역 :연일읍/대송면/청림동/제철동/송도동/상대동2권역 : 오천읍/동해면3권역 : 흥해읍/환여동/해도동4권역 : 효곡동/대이동/중앙동5권역 : 양학동/용흥동/죽도동6권역 : 우창동/두호동7권역 : 장량동철강공단 : 1~4단지(청림지구 제외)해당 권역의 생활폐기물 수집운반이 원활하지 않거나, 기타 민원이 있을 경우 직접 건의하실 수 있습니다.'
legal_basis_portal: 포항시 생활폐기물 수집운반 대행 용역 현황과 폐기물수집운반업 중 생활폐기물 수집운반업 현황 자료를 활용하였습니다.
