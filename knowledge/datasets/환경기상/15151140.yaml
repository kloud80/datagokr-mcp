description_portal: 무안군 관내 야생생물보호구역 및 야생생물특별보호구역의 지정 현황을 제공하는 파일데이터입니다. 데이터는 명칭, 구분, 소재지, 면적(ha), 지정사유, 지정일 컬럼으로 구성되며, 구역별 기본 속성과 행정 고시 정보를 한 곳에서 확인할 수 있습니다. 자연생태 보전, 서식지 관리, 각종 인·허가 검토, 환경·도시계획 수립, 연구·분석 및 대시보드 시각화에 활용 가능합니다. 면적은 지정 고시 기준으로 제공되며, 지적 정리나 재조정 등에 따라 실제 경계와 일부 차이가 발생할 수 있습니다. 법적 효력은 관련 고시와 공식 도면을 우선하며 본 데이터는 참고용입니다. 변경·해제 등 행정 조치가 이루어질 경우 이후 공개본에 반영됩니다.
