description_portal: 공유수면 점·사용 허가는 허가조건 및 관련법을 준수해야 하며, 위반 시 허가취소·원상회복·벌칙 등이 부과될 수 있다. 허가사항 변경·권리승계 신고 의무가 있으며, 전대는 금지된다. 인공구조물 설치 시 실시계획 승인·준공검사·도로복구를 이행해야 하고, 기간 종료·허가취소·무단점유 시 원상회복 의무가 발생한다. 또한 공공사업 시행 시 시설물 이설에 협조하여야 하며, 점용으로 인한 제3자 피해는 피허가자가 책임진다. 이외에 공유수면 허가 관련 문의사항은 공유수면 관리 및 매립에 관한 법률을 참고바랍니다.
