description_portal: 서울특별시 강동구 관내 공원 및 하천 등에 조성된 물놀이장과 수경시설(바닥분수, 인공폭포, 생태연못 등)의 현황을 제공하는 공공데이터입니다. 본 데이터는 도심 속 오아시스 역할을 하는 수경시설의 시설명, 주소(소재지), 규모(면적 등), 형태(시설의 종류 및 특징) 등의 정보를 담고 있습니다.물놀이 및 수경시설은 여름철 폭염을 완화해 주는 도시 기후 조절 기능뿐만 아니라, 영유아와 어린이들에게는 시원한 놀이 공간을, 구민들에게는 아름다운 야간 경관과 휴식처를 제공하는 매력적인 여가 인프라입니다.본 자료를 통해 지역 주민과 학부모들은 다가오는 여름철, 아이들과 함께 안전하고 시원하게 즐길 수 있는 내 주변 물놀이장이나 야간 분수 명소를 쉽게 검색하고 방문 할 수 있습니다.행정기관은 시설의 '형태'와 '규모' 데이터를 바탕으로 지역별 수경시설의 분포 현황을 파악하고, 체계적인 수질 검사 및 안전 점검 동선을 수립하는 데 활용할 수 있습니다.
