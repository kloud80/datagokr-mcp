summary_user: 인천 미추홀구 관내 특정토양오염관리대상 시설(주유소 등)을 시설 한 곳당 한 행으로 담은 파일로, 상호명·도로명주소·사업자등록번호·위도·경도를 수록한다. 구민이나 부동산·입지 분석가가 "이 필지 주변에 토양오염 위험시설이 있는가"를 확인하거나 구 안의 위험시설 분포를 지도로 그릴 때 쓴다. 사업자등록번호(bizno)로 사업자 정보·인허가 데이터와 잇고, 위도·경도로 필지·용도지역 같은 공간 규제 레이어와 겹쳐 본다.
description_portal: 본 데이터는 인천광역시 미추홀구 관내 특정토양오염관리대상 시설의 현황을 수록한 자료입니다. 「토양환경보전법」에 따라 관리되는 이들 시설은 토양오염의 잠재적 발생원이 될 수 있는 주유소와 같은 위험시설을 포함하고 있으며, 환경안전 확보와 오염 예방을 위해 체계적으로 관리됩니다. 데이터에는 상호명, 도로명주소, 사업자등록번호, 위도와 경도 좌표가 수록되어 있어 시설의 위치와 관리 주체를 명확히 확인할 수 있습니다. 이는 지역 내 토양오염 위험시설 분포 현황을 파악하는 데 활용됩니다. 해당 자료는 행정기관이 오염 관리 대상을 지정·점검하고 환경보호 대책을 수립하는 데 중요한 기초자료로 사용되며, 연구자와 구민들도 지역 환경안전 현황을 이해하는 데 참고할 수 있습니다. 본 데이터는 정기적으로 갱신되어 최신 현황을 반영하며, 미추홀구의 지속가능한 환경관리와 공공 안전 확보를 지원하는 기반 자료로 제공됩니다.
