description_portal: 이 데이터는 서울특별시에서 제공하는 ‘문화길’이라는 도보·레크리에이션 루트의 선형 공간정보입니다. 경로는 위도·경도(WGS 84) 좌표계로 제공되며, 각 구간이 이어진 선(Line) 형태로 구성되어 있어 지도상에서 전체 루트를 시각화하고 분석할 수 있도록 설계되어 있습니다. 서울 열린데이터광장 이를 통해 서울시 내 문화길의 위치, 방향, 연계된 관광코스 및 산책로 인프라를 GIS 또는 위치기반 분석에 활용할 수 있습니다. 제공된 파일 인코딩은 UTF-8이며 쉐이프파일 형식이 기본으로 지원됩니다. 서울 열린데이터광장 이용 시 도보경로 설계, 관광 및 레크리에이션 기획, 접근성 분석, 주변 기반시설(공원, 대중교통 등)과의 연계성 평가 등에 유용합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
