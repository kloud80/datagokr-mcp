description_portal: 서울특별시 은평구 어린이활동공간 안전대상시설 현황 정보로 시설유형, 설치장소, 실내외구분, 연면적, 놀이시설명 및 주소 데이터를 제공합니다.해당 데이터는 서울특별시 은평구 내 어린이활동공간안전대상시설 616개소의 운영 현황을 담고 있습니다.어린이활동공간안전대상시설이란 「환경보건법」에 따라 어린이들이 이용하는 공간 중 환경안전관리가 필요한 시설을 의미합니다. 여기에는 어린이놀이시설(그네, 미끄럼틀, 정글짐, 볼풀장 등이 설치된 실내외 놀이터), 어린이집 보육실, 유치원 교실, 초등학교 및 특수학교 교실, 놀이제공영업소 등이 포함됩니다.또한 시설유형별, 설치장소별, 실내외 구분별로 세분화되어 있으며, 각 시설의 연면적과 놀이시설명, 정확한 주소 정보까지 포함되어 있습니다.확인검사 제도와 연계되어 있어 매우 중요한 데이터입니다. 어린이활동공간을 신축하거나 연면적 33㎡ 이상 증축, 70㎡ 이상 수선할 때는 환경유해인자 시험·검사기관으로부터 환경안전관리기준 적합성 검사를 받아야 합니다. 한국환경산업기술원(은평구 진흥로 215 소재) 등 지정 검사기관에서 이러한 검사를 실시하고 있습니다.환경안전관리의 핵심은 실내 공기질 관리입니다. 도료, 마감재료, 합성수지·합성고무 재질의 바닥재 등에서 발생할 수 있는 유해물질로부터 어린이들을 보호하는 것이 주요 목적입니다. 각 시설은 포름알데히드, 벤젠, 톨루엔 등 환경유해인자 기준을 준수해야 합니다.이 데이터는 지역 내 어린이 환경보건 안전망 구축, 취약시설 발굴 및 개선, 확인검사 대상 시설 관리 등에 기초 자료로 활용되며, 학부모들은 자녀가 이용하는 시설의 환경안전 관리 현황을 확인하는 데 활용할 수 있습니다.
