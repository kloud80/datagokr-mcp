summary_user: 서울시 대기질 측정 시스템에서 쓰는 오염물질·기상 측정항목별 설정을 항목 한 건당 한 행으로 담은 코드성 메타데이터로, 측정값 자체가 아니라 명칭·단위·소수점·측정범위·범례 색상 기준값·이상값 판별 기준(동일값 시간, 변화폭 비율)·통합대기환경지수(CAI) 산정 여부 등을 담는다. 서울시 대기질 측정값을 받아 쓰는 분석가나 개발자가 '이 항목 코드는 어떤 오염물질이고 단위와 등급 색상 기준은 무엇인가', '어떤 값이 이상 데이터로 걸러지는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 서울시 대기질 측정 데이터와는 항목코드(ITEM_CD)나 항목 명칭을 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 서울시 대기오염 측정항목 정보 데이터는 서울시 대기질 측정 시스템에서 사용하는 각종 오염물질 및 기상 관련 항목의 세부 설정과 특성을 정리한 자료입니다. 측정항목의 줄임 명칭, 풀 명칭, 첨자부호, 통신기호 등을 통해 시스템 내 표기 방식과 데이터 전송 식별 체계를 확인할 수 있습니다. 측정단위, 소수점 자리 수, 측정범위 설정은 수집되는 대기오염 수치의 표현 방식과 품질 기준을 보여주며, 화면 정렬 순서, 메인화면 표시 여부, 사용여부 등은 대기정보 제공 화면과 통계 시스템에서 어떤 항목이 중심적으로 활용되는지를 나타냅니다. 범례 색상 정보는 파랑, 녹색, 노랑, 주황, 빨강 등 단계별 기준값을 통해 시민에게 제공되는 대기질 등급 시각화 기준을 이해하는 데 도움을 줍니다. 또한 동일값 시간, 변화폭 과대 비율, 측정범위 밖 값 처리 여부 등은 이상 데이터 판별 및 장비 동작불량 처리 로직을 정의하는 항목으로, 신뢰도 높은 대기질 정보를 생산하기 위한 품질관리 기준을 담고 있습니다. CAI 지수 전송 관련 항목과 항목그룹 정보는 통합 대기환경지수 산정과 그룹별 분석에 활용되며, 등록일시와 등록자 정보, 비고 항목을 통해 행정적 관리 이력까지 추적할 수 있는 체계적인 메타데이터입니다.
