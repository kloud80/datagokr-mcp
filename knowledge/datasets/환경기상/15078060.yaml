summary_user: 전북특별자치도 진안군의 대기배출시설 사업장을 한 행씩 담은 파일로, 사업장명·신고/허가 구분·등록일자·소재지·업종·종별등급·주생산품·배출시설과 방지시설 설치현황을 사업장 단위로 담는다(CSV 약 7KB, 진안군 한 개 시군구 범위). 주민이나 분석가가 '우리 동네 어느 사업장이 어떤 대기배출시설과 방지시설을 갖추고 있고 몇 종 사업장인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명·소재지 주소를 맞춰 보는 방식으로만 잇고, 다른 시군의 같은 이름 대기배출시설 현황 파일과는 컬럼을 맞춰 합쳐 쓴다.
description_portal: 전북특별자치도 진안군에서 대기를 배출하는 시설들 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 연번, 해당 사업장명, 신고 또는 허가 정보, 등록 일자 정보, 사업장 소재지, 사업장 업종, 각 사업장에서 주로 생산하는 품목들, 여러 업체에서 설치한 배출 시설 현황들과 방지 시설 현황들 등의 정보를 제공합니다. 제공하는 데이터 중에서 신고 하거나 허가를 받은 업체들이 어떤 업종을 가지고 있는지 뿐만 아니라 주로 생산하는 품목들을 확인할 수 있고, 각 업체들이 배출을 위해 설치한 시설 정보들과 방지 시설 설치 정보들도 확인할 수 있습니다.
