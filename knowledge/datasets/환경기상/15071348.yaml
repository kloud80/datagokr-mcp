summary_user: 서울시 관할 건설폐기물처리업 사업장의 인허가 원장을 사업장(관리번호) 단위로 담으며, 인허가일자·영업상태·휴폐업 일자·주소·좌표·처리구분·허용보관량 등을 포함한다. 서울에서 영업 중인 건설폐기물 수집·운반 또는 중간처분 업체가 어디에 있고 언제 휴·폐업했는지를 확인하려는 사업자·행정 담당자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
description_portal: 'ㅇ 데이터 개요: 「서울시 건설폐기물처리업 인허가 정보」는 서울시 관할 사업장의 인‧허가 현황을 표준 필드 체계로 정리한 자료입니다. 관리번호, 인허가일자, 영업상태, 사업장명, 소재지, 좌표 등 기본 식별·행정 정보를 포함합니다.ㅇ 시계열 및 구조: 여러 해에 걸친 인‧허가 이력이 축적되어 있어 추세 분석과 변동성 파악이 가능합니다. 동일 사업장에 대한 상태 변경, 휴·폐업 이력 등 행정적 변화를 데이터 레벨에서 추적할 수 있습니다.ㅇ 영업상태 구분: 정상영업, 휴업, 폐업, 취소·말소 등 행정상 상태가 코드화되어 제공되며, 점검·관리 대상 선정이나 정책 모니터링에 활용할 수 있습니다.ㅇ 업종 구분: 건설폐기물 수집·운반, 중간처분 등 업종 유형이 구분되어 있으며, 일부 항목은 미기재일 수 있으므로 분석 전 표준화·정제 절차가 필요합니다.ㅇ 공간정보: 좌표(X/Y) 및 주소 정보가 포함되어 사업장 분포 시각화, 위험도 매핑, 단속·점검 동선 설계 등 공간 분석에 적합합니다.ㅇ 연락·행정 연계: 도로명주소와 연락처 항목을 통해 현장 확인, 민원 처리, 타 시스템(예: 점검 시스템·GIS)과의 연계가 용이합니다.ㅇ 데이터 품질 유의사항: 처리구분, 업태구분, 면적, 휴업·재개업 관련 일자, 허용보관량 등은 결측 가능성이 있어 사전 결측치 처리, 값 범위 검증, 코드 일치성 점검이 요구됩니다.ㅇ 활용 예시: 인허가 변동 모니터링, 업종별 밀집 지역 파악, 민원·사고 이력과의 교차분석, 취약권역 선제 점검, 정책 효과성 평가 등 행정·현장 업무 전반에 활용 가능합니다.ㅇ 관리·사용 유의: 자료는 지속적으로 갱신되는 성격이 있으므로, 분석 시점의 스냅샷을 고정·보관하고 버전 관리 원칙(스키마 변경 기록, 전처리 로그)을 준수하시는 것을 권장드립니다.'
