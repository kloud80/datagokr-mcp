summary_user: 오산시에 등록된 대형폐기물(가구·가전 등) 수집운반 대행업체를 업체 한 곳당 한 행으로 담은 작은 목록 파일(CSV 647바이트)로, 업체명·주소·전화번호와 담당 수거구역을 행정동과 법정동 기준으로 함께 적는다. 오산시 주민이 "우리 동네 대형폐기물은 어느 업체에 연락해 수거를 맡기나"를 확인하거나, 담당자가 동별 수거 업체 배정 현황을 점검하는 데 쓴다. 전역 조인 키는 없어서 담당구역의 행정동·법정동 이름을 다른 오산시 폐기물 배출·수거 지점 데이터나 행정구역 자료의 동 이름과 맞춰 이어 쓴다.
description_portal: 본 데이터는 경기도 오산시에 등록되어 가구, 가전제품, 기타 대형 폐기물을 수거하는 생활폐기물 수집운반 대행업체의 현황으로서, 각 업체의 명칭, 주소, 연락처 등의 기본정보를 담고 있습니다.아울러, 생활폐기물의 효율적인 처리와 민원의 신속한 처리를 위하여 각 업체의 수거범위를  행정동과 법정동으로 나누어 표기하였습니다.이는, 급변하는 환경 분야 정책에 부합하는 오산시 폐기물 정책을 수립하기 위한 기초자료로 활용되며, 궁극적으로 시민의 만족도를 향상시키기 위한 수단입니다.한편 폐기물의 효율적인 활용이 가능하여 자원순환의 시작으로 작용합니다.
