summary_user: 전국 지자체가 관리하는 종량제봉투 판매소를 한 곳씩 담은 건별 표준데이터로, 판매소명·주소·좌표·사업자등록번호·영업상태·대형폐기물 스티커 판매 여부 등을 싣고 29,110행이 검증 수신됐다. 주민이 '우리 동네에서 종량제봉투나 대형폐기물 스티커를 파는 가까운 판매소가 어디인가'를 찾거나, 분석가가 지자체별 판매소 분포를 살피는 데 쓴다. 도로명·지번 주소(address)와 위도·경도(coord)로 다른 폐기물 배출·수거 지점 데이터나 지도와 잇고, 사업자등록번호(bizno)로 사업자 정보와 맞춰 볼 수 있다.
