summary_user: 국내 환경산업체의 제품·기술을 건별로 영문 소개한 파일로, 제목·제품명·모델명·회사명·홈페이지·등록일·상세 설명·카테고리·적용 기술 9개 항목을 담고 포털 설명상 1,794건이며 전국 범위의 비공간 자료다. 해외 바이어나 수출 지원 담당자가 '수처리 장비를 만드는 한국 기업과 영문 제품 설명은 무엇인가'를 찾거나, 분석가가 분야별 국내 환경기술 공급 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 환경 업체·인증 데이터(녹색기업·환경표지 등)와는 회사명을 이름 매칭해 이어 쓴다.
description_portal: '이 데이터는 국내 환경산업체에서 제공하는 다양한 제품과 기술에 대한 영문 정보를 담고 있습니다. 데이터는 총 1794개의 항목으로 구성되어 있으며, 다음과 같은 9개의 컬럼으로 구성되어 있습니다:제목 (Title): 해당 제품이나 기술의 특징을 간략히 나타낸 제목입니다.제품명 (Product Name): 환경산업체에서 제공하는 제품의 이름입니다.모델명 (Model Name): 해당 제품의 모델명을 나타냅니다.회사명 (Company Name): 제품 또는 기술을 제공하는 회사 이름입니다.홈페이지 (Website): 회사의 공식 웹사이트 주소입니다.등록일 (Registration Date): 제품 또는 기술의 등록 날짜입니다.내용 (Description): 제품이나 기술에 대한 자세한 설명이 포함되어 있습니다.카테고리 (Category): 제품 또는 기술이 속한 분야 또는 범주를 나타냅니다 (예: Equipment, Technology & Process 등).적용 기술 (Applied Technology): 제품 또는 기술이 적용되는 구체적인 기술 분야나 산업을 나타냅니다.이 데이터는 해외시장 진출 시 국내 환경산업체의 제품 및 기술 정보를 효과적으로 홍보하고, 글로벌 환경 시장에서 국내 기업의 경쟁력 강화를 위한 마케팅 자료로 활용될 수 있습니다.'
