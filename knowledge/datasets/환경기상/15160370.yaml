description_portal: 경상북도 경주시에서 관리하는 낚시금지·제한·통제구역 관련 데이터이다. 본 자료는 수질과 수생태계 보호를 위해 지정된 구역의 위치와 행위 제한 정보를 제공한다. 데이터는 자료구분, 구역유형, 시설명 또는 수계명, 소재지, 지정일, 시행일, 고시일, 적용기간, 고시번호, 관련 법령·조례, 금지 또는 제한 행위 내용으로 구성된다. 또한 낚시·야영·취사·출입 제한 여부와 기타 제한 내용, 위도·경도, 좌표계, GIS 정보 보유 여부를 확인할 수 있다. 시민과 방문객은 지정구역의 위치와 준수사항을 파악할 수 있으며, 행정기관은 수환경 보전, 현장 관리 및 정책 수립에 활용할 수 있다. 본 데이터는 경주시 수변구역 이용질서 안내와 환경보전 업무를 지원하는 기초자료이다.
