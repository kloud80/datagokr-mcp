description_portal: 대구광역시 전역에 설치된 대기측정소에서 2020년 1월부터 3월까지 측정된 주요 대기오염물질의 일별 농도 값을 수록한 자료입니다. 측정 대상 항목은 미세먼지(PM10), 초미세먼지(PM2.5), 오존(O₃), 이산화질소(NO₂), 일산화탄소(CO), 아황산가스(SO₂)로, 시민 건강과 직결되는 대기질의 주요 지표를 포함하고 있습니다. 각 항목은 하루 단위로 측정된 값을 바탕으로 정리되어 있으며, 특정 기간의 대기질 변화 추세를 분석하거나 시기별·지역별 대기오염 특성을 비교하는 데 활용될 수 있습니다.
