summary_user: 환경영향평가 대상 개발사업의 사업구역·조사지점별로 측정한 소음(dB(A))과 진동(dB(V)) 값을 조사차수·조사기간·주소·좌표와 함께 담고, 조사지점 위치를 공간정보(WFS 피처·WMS 지도 이미지)로도 제공하며 범위는 전국 개별 지점 단위이다. 개발사업 예정지 주변 주민이나 부동산·입지 분석가가 "이 사업지 인근 조사지점의 평가 당시 소음·진동 수준은 어느 정도였나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 환경영향평가 사업코드(mgtNo)를 다른 환경영향평가 데이터에서 먼저 받아 넘기거나, 주소·좌표로 토지이용규제·개발사업 정보와 공간적으로 맞춰 이어 쓴다.
description_portal: 환경부 국립환경과학원 환경영향평가 사업구역, 조사지점을 기준으로 조사된 소음진동에 대한 정보를 소음진동속성조회, 공간정보를 가진 데이터(조사지점WFS,조사지점WMS)제공하며속성(조사지점, 조사차수, 주소, 진동(dB(V)), 조사차수, 조사시작일, 조사종료일, 소음(dB(A)), Y좌표, X좌표, 조사지점명) 와 공간좌표를 기준으로 소음진동 조사지점의 피쳐 정보(피쳐의 공간 좌표 데이터, 공간데이트를 구성하는 인덱스값, 환경영향평가 사업코드, 사업지구분, 사업지점명, 해당 공간데이타 구축 방법, 해당 공간데이터 값의 유효여부, 해당 공간에 대한 길이, 해당 공간에 대한 면적)를 제공하며 촤표체계, 반환 이미지 타입, 반환 배경 이미지 유무, 반환 이미지 너비/높이, 크기 와 같이 해당 공간좌표를 기준으로 소음진동 조사지점의 포인트 이미지 조회를 통한 정보를 제공하는 서비스입니다
team:
  dept: 기후국토환경연구과
services:
  - op: /getInfo
    name: 소음진동속성조회
    endpoint: https://apis.data.go.kr/1480523/NoiseVibrationService/getInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
      - name: ivstgSpotNm
        required: false
        desc: 조사지점의 이름
      - name: type
        required: false
        desc: 응답받을 xml/json 타입
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getInfoWMS
    name: 조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/NoiseVibrationService/getInfoWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: 좌표 체계를 나타냅니다. 현재 EPSG:5179 좌표계를 지원합니다.
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getInfoWFS
    name: 조사지점WFS조회
    endpoint: https://apis.data.go.kr/1480523/NoiseVibrationService/getInfoWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        example: EPSG:32652
        desc: 좌표체계
      - name: maxFeatures
        required: false
        example: '10'
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: false
        example: results 또는 hits
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        example: 73297.40248257795,3506059.085416644,803828.180558938,4444265.837193642
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: true
