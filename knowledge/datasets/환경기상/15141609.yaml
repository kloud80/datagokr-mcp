services:
  - op: /getRtlSprtInfo
    name: 순환자원정보센터 유통지원 정보
    endpoint: https://apis.data.go.kr/B552584/kecoapi/rtlSprtService/getRtlSprtInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: returnType
        required: true
        example: json
        desc: 데이터타입
      - name: bzentyNm
        required: false
        example: (주)그린환경
        desc: 업체명
      - name: brno
        required: false
        example: '4038107889'
        desc: 사업자등록번호
      - name: addr
        required: false
        example: 전북 익산시 함열읍 정착길 69그린환경
        desc: 주소
      - name: cmdtyLclsfNm
        required: false
        example: 영농폐기물
        desc: 물품대분류명
      - name: cmdtyMclsfNm
        required: false
        example: 재생원료
        desc: 물품중분류명
      - name: cmdtySclsfNm
        required: false
        example: 기타
        desc: 물품소분류명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
