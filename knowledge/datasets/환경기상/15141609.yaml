summary_user: "순환자원정보센터에 등록된 폐기물·폐자원 유통 사업자와 신청 건별로 업체명, 사업자등록번호, 주소·연락처, 업종, 취급 품목·재질과 물품 분류, 성상, 처리방법, 월 발생량·배출 주기 등을 담은 건별 원천 데이터이며, 범위는 전국이고 개별 주소 단위로 제공된다. 폐기물을 내보내려는 사업장이나 재활용 사업자가 '특정 품목(예: 폐플라스틱)을 취급하는 유통 업체가 어디에 있고, 어떤 처리방법으로 얼마나 자주 배출하는가'를 찾는 데 쓴다. 전역 조인 키는 없고, 사업자등록번호(brNo)나 업체명·주소를 이름 매칭해 같은 기관의 폐기물 처리업·배출자 원장과 연결하는 방식으로만 이어 쓴다."
description_portal: 폐기물 및 폐자원의 유통 사업자 업체명, 사업자등록번호, 주소, 연락처, 취급품목, 처리방법 등의 정보를 조회하는 서비스입니다.
