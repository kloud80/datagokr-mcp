description_portal: 본 데이터는 충청남도 도시계획정보(UPIS) 시스템에서 관리·제공하는 개발행위허가필지도 현황 정보로, 개발행위가 허가된 필지의 공간적 범위와 행정 관리 이력을 체계적으로 관리하기 위한 자료입니다. 주요 항목으로는 현황 도형관리번호, 허가계획관리번호, 면적_도형 등의 정보가 포함되어 있습니다. 현황 도형관리번호는 지도상 필지 도형을 고유하게 식별하는 관리 번호로 공간정보 연계에 활용되며, 허가계획관리번호는 해당 개발행위허가 건의 행정 처리 이력을 추적하기 위한 핵심 식별 정보입니다. 면적_도형은 허가 대상 토지의 규모를 정량적으로 나타내어 개발 규모 분석, 개발 밀도 관리, 도시관리계획 검토 등에 활용됩니다. 본 데이터는 개발행위 관리의 투명성 확보, 무분별한 개발 방지, 도시계획 정책 수립 및 공간 기반 행정 의사결정 지원을 위한 기초 자료로 활용됩니다.
