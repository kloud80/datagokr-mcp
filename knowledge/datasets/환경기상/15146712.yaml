description_portal: '환경책임보험 미가입 사업장 통보 정보는 보험에 가입하지 않은 사업장에 대한 관리·감독 절차를 지원하기 위해 인허가기관에 제공되는 핵심 자료이다. 해당 정보는 사업장의 보험 미가입 이력과 행정처분 진행 상황을 추적할 수 있도록 구성되어 있으며, 통보의 적정성과 행정절차의 신뢰성을 확보하는 데 목적이 있다.먼저, 추출기준일자는 자료 산출의 기준 시점을 명확히 나타내어 통보 시점의 객관성을 보장한다. 여기에 더해 이전추출기준일자는 직전 추출 시점과 비교할 수 있도록 하여, 신규 미가입 사업장과 지속적인 미가입 사업장을 구분할 수 있도록 한다. 통보차수는 동일한 사업장에 대해 몇 번째로 통보되는지 기록하여 반복 관리 여부를 확인할 수 있게 하며, 통보유형은 통보의 성격(예: 최초 통보, 재통보, 최종 통보 등)을 구체적으로 구분하는 데 활용된다.또한 통보여부 항목은 실제로 인허가기관에 통보가 이루어졌는지를 명확히 표시하여 행정적 누락을 방지한다. 사업장상태코드는 해당 사업장의 현재 상태(예: 정상 운영, 휴·폐업 등)를 나타내어 행정처분의 필요성과 우선순위를 판단하는 근거가 된다. 행정처분일자는 법적·행정적 제재가 실행된 일자를 기록하며, 행정처분인허가기관코드는 처분을 담당한 기관을 식별할 수 있도록 한다.마지막으로, 삭제여부는 해당 정보가 현재 유효한지 여부를 구분하여 데이터 정합성을 관리하는 항목이며, 추출회차는 동일한 기준일자 내에서 자료가 몇 번째로 산출되었는지 표시하여 데이터 이력 추적을 가능하게 한다.따라서 이 통보 정보는 환경책임보험 미가입 사업장에 대한 행정적 대응을 체계적이고 효율적으로 수행하기 위한 핵심 자료로, 통보 절차의 투명성과 관리의 신뢰성을 높이는 역할을 한다.'
