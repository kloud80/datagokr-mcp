summary_user: 부산광역시 강서구 안의 대기·폐수·소음진동 등 환경오염 배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 업체명·도로명주소·업종·전화번호·위도·경도·데이터기준일자를 포함한다. 주민이나 분석가가 "우리 동네 주변에 어떤 업종의 배출시설이 어디에 있나"를 확인하거나, 배출시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 업체명 대조, 또는 같은 기관코드로만 연결한다.
description_portal: '부산광역시 강서구 내에 있는  대기 및 폐수, 소음진동 배출시설 등 환경오염 배출시설 현황에 대한 기본정보 데이터 공개입니다.데이터 파일에 기재된 공개 정보 리스트 : 구군명, 업체명, 도로명주소, 업종, 전화번호, 위도, 경도, 데이터기준일, 기관코드명 *사업자 등록번호 등 같은 주요 정보는 개인정보와 같은 취급하여 데이터 정보 제공 제외되어 있음을 알려드립니다.추가적으로 부족한 부분에 대하여 자세한 사항 안내는 강서구 환경위생과 051-970-4385로 연락주시면 안내드릴 수 있도록 하겠습니다.'
