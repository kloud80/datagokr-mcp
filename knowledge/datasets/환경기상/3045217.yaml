summary_user: 전국 17개 광역·229개 기초지자체를 기준으로 생활계·축산계·산업계·토지계·양식계·매립계·환경기초시설·기타 수질오염원을 조사해 만든 통계 파일(xlsx, 약 251MB)로, 실측 필드에는 법정구역코드와 시도·시군구·읍면동·리 단위의 하수처리지역 구분(분류식·합류식·정화조·수거식 등)별 가정용·영업용 물사용량(m3/일)이 들어 있다. 하천·호소 수질관리 분석가나 지자체 담당자가 '우리 시군구의 생활오수가 어떤 처리 경로로 얼마나 발생하는가'처럼 지역별 오염원 규모와 처리 형태를 파악하는 데 쓴다. 전역 조인 키는 확인되지 않아 법정구역코드나 시도·시군구 이름 매핑, 하수처리·분뇨처리 시설코드 및 시설명으로 행정구역 통계나 환경기초시설 자료와 연결한다.
description_portal: 전국 광역지자체(17개) 및 기초지자체(229개)를 기준으로 생활계(인구, 물사용량), 축산계(농가수, 사육두수, 가축분뇨발생량), 산업계(폐수배출업소 업소수, 폐수발생량, 폐수방류량, BOD, COD, SS, TN, TP 발생·배출부하량, 처리방법별(공공처리시설 연계, 직접 방류, 위탁 처리) 업소수 및 폐수발생·방류량, BOD, COD, SS, TN, TP 발생·배출부하량), 토지계(전, 답, 과수원, 목장용지 등 총 28개 지목별), 양식계(양식장 업소수, 시설면적, 사료사용량), 매립계(매립시설별 발생·방류 유량, 발생·방류 수질농도, 연계처리시설명, 이송방법, 처리유형 등), 환경기초시설(환경기초시설별 운영현황(소재지, 처리용량, 처리공법, 처리공정 등), 시설별 총유입량·관로이송량·직접이송량·방류량에 대한 유량과 농도), 기타수질오염원(골프장, 금은판매점의 세공시설, 농축수산물단순가공시설, 사진처리 또는 X-Ray시설, 안경점, 운수장비정비시설(폐차장포함), 복합물류터미널시설, 거점소독시설의 총 업소수)에 대한 자료를 조사하고 조사한 결과를 토대로 통계자료를 작성하여 제공
