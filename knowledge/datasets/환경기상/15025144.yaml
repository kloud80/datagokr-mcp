description_portal: 토양오염실태조사는 토양오염이 우려되는 지역에 대한 실태조사 및 오염토양 정화를 통한 토양환경 보전에 조사목적이 있으며, 토양오염실태조사는 토양오염실태조사지침에 따라 16개 조사지역에 대해서 토양오염 가능성이 큰 장소를 대상지역으로 선정하여 토양오염공정시험기준에 따라 조사하며, 토양오염이 우려되는 해당 지역(산업단지 및 공장지역, 공장폐수유입지역, 원광석 고철 등의 보관사용지역, 금속제련소지역 등)에 대한 토양오염도(카드뮴, 구리, 비소 및 유류, 유기용제류 등) 분석결과입니다.
