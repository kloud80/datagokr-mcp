description_portal: 이 데이터는 전기밥솥을 촬영한 이미지와 해당 이미지에 대한 객체 라벨링 정보로 구성된 AI 학습용 데이터셋입니다. 데이터는 총 200장의 이미지 파일과 200개의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에 저장되어 있습니다. 다양한 제조사 및 모델의 전기밥솥이 실내 환경에서 여러 각도와 거리에서 촬영된 상태로 포함되어 있으며, 제품의 외형, 버튼, 디스플레이 창, 손잡이 등 주요 구성 요소가 식별 가능합니다. 라벨링 텍스트 파일은 ‘labels’ 폴더에 동일한 파일명으로 존재하며, YOLO 형식으로 객체의 위치와 클래스 정보를 좌표값으로 기록하고 있습니다. 데이터는 객체 인식 및 분류 AI 모델 개발에 활용될 수 있도록 일관된 형식과 구조를 갖추고 있습니다.
