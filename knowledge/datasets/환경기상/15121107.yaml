description_portal: 특정수질유해물질 배출량 조사제도는 전년도말(12월31일) 까지 측정한 자료 등을 포함한 '배출량조사표'를 증빙서류와 함께 매년 3월 31일까지 시스템에 입력하는 제도로, 폐수배출시설 설치 허가를 받아 특정수질유해물질을 배출하는 사업장이 해당물질 배출량을 조사하여 제출하고, 환경부에서 이를 확인, 검증하여 일반에 공개하는 제도입니다.사업자가 자발적으로 배출량을 잘 관리하여 저감할 수 있도록 하는것을 목적으로 하며, 타 시스템 배출정보, 허가서, 시험성적서 등 첨부문서, 각종 지침을 비교하여 배출량 정보의 정확성을 평가하며, 본 데이터에서는 특정수질유해물질을 배출하는 사업장과 해당 관할기관, 폐수처리형태 등의 정보를 제공합니다.
