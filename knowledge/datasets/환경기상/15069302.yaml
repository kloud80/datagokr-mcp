description_portal: 해양환경공단이 제공하는 ‘해양쓰레기 모니터링 통계_1기조사방법_지역별’ 데이터에 대한 정보를 제공합니다. 본 데이터는 1기 조사방법론을 적용하여 실시한 해양쓰레기 모니터링 결과 중 지역별 통계 자료를 포함합니다. 주요 내용에는 조사 정점 위치, 조사 시기, 부유·침적·유입 쓰레기 등 발생 형태, 지역별 발생량과 재질별 특성, 계절별 분포 경향이 수록됩니다. 또한 지역별 오염원 분석, 주요 발생지 파악, 관리·감축 우선순위 설정에 필요한 기초자료를 제공합니다. 이를 통해 해양쓰레기의 지역적 특성과 발생 원인을 체계적으로 분석하고, 맞춤형 정책 수립과 관리 대책 마련이 가능합니다. 해당 자료는 공공기관, 연구기관, 지자체, 환경단체 등에서 해양보전 정책, 자원관리 계획, 연구 분석, 환경교육 등 다양한 목적으로 활용됩니다.
