summary_user: 경상남도 사천시의 특정토양오염관리대상 시설을 업소 한 건씩 담은 파일로, 상호·지번 소재지·완공일자를 담는다(시군구 범위, 개별 주소 단위, 약 7KB CSV). 사천시에서 토지를 사거나 개발하려는 사람이 해당 필지 주변에 토양오염 관리 대상 시설(주유소·유류저장시설 등으로 지정된 곳)이 있는지 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 지번 주소를 지오코딩하거나 상호·주소 문자열로 다른 환경 공간 규제 데이터나 사업장 목록과 맞춰 이어 쓴다.
