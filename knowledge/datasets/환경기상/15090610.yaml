description_portal: 본 데이터는 국립공원공단이 운영하는 통합방재시스템을 통해 수집·관리되는 산사태 발생 현황 자료로, 국립공원 구역 내에서 발생한 산사태 정보를 건별로 기록한 재난안전 공간정보 데이터입니다. 2022년 12월 기준, 최근 10년(약 2013~2022년) 간의 발생 이력을 포함하고 있으며, 각 건별 항목에는 산사태 발생 일자, 발생 지역(국립공원명 및 세부 위치), 발생 원인(집중호우, 사면 붕괴, 토사 유출 등), 위도·경도 좌표, 피해 규모(면적 또는 토사량), 피해 유형(시설 피해, 탐방로 차단 등), 조치 내용 및 복구 현황 등이 포함됩니다. 본 데이터는 산사태 위험구간 모니터링, 탐방로 통제 기준 설정, 재난안전 계획 수립, 국지적 기후변화 영향 분석, 경사면 안전진단 등 다양한 분야에서 활용됩니다. CSV 형식으로 제공되며, GIS 기반의 통합방재 플랫폼 및 민간 지도 API 연계 시각화에 활용하기 적합합니다.
