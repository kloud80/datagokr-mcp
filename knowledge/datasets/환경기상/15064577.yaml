description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 자동크린넷 집하장 설치 현황을 제공합니다. 생활권별로 설치된 처리구역, 수송관로 길이(미터), 사업 준공일자, 추진 상황(가동 여부)을 포함하고 있어, 행복도시 내 생활권 단위의 생활폐기물 수거 체계와 운영 현황을 한눈에 확인할 수 있습니다.자동크린넷은 지하 수송관로를 통해 생활폐기물을 집하장으로 자동 운송하는 친환경 스마트 폐기물 처리 시스템으로, 도시 위생 개선, 수거 효율성 향상, 환경오염 저감 효과가 있습니다.본 데이터는 도시 인프라 관리, 생활환경 정책, 친환경 도시 연구 및 스마트시티 구축 관련 분석에 활용될 수 있습니다.
