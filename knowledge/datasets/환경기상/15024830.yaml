description_portal: 서울교통공사에서 운영하는 지하역사의 실내 공기질 측정 정보를 제공하는 공공데이터입니다. 본 자료는 「실내공기질관리법」에 따른 유지기준 관리 항목을 대상으로 정기적으로 측정된 결과를 포함하고 있으며, 미세먼지(PM10), 초미세먼지(PM2.5), 이산화탄소, 일산화탄소, 폼알데하이드, 이산화질소, 라돈, 휘발성유기화합물 등 주요 오염물질의 연간 농도 정보를 제공합니다. 해당 데이터는 지하역사 이용객의 건강 보호와 쾌적한 환경 조성, 공기질 관리 정책 수립 및 연구·분석 자료로 활용될 수 있습니다.
