summary_user: 용인시에서 환경 법규를 위반한 사업장을 건별로 담은 데이터로, 사업장마다 주소·상호·대표자명, 위반 법규 내용, 행정처분 내용, 공개 등록일자를 담는다. 주민이나 거래를 앞둔 사업자가 '이 사업장이 환경법 위반으로 어떤 처분을 받았는가'를 확인하거나, 분석가가 용인시 위반 유형별 처분 현황을 살펴보는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 오염원·인허가 사업장 데이터와는 상호·주소 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 본 데이터는 용인시 환경위반 공개 정보 조회 API를 통해 제공되는 환경 법규 위반 사업장 현황을 확인하기 위한 자료이다. 결과코드, 결과메시지, 한 페이지 결과 수, 페이지 수, 데이터 총 개수는 서비스 호출의 처리 상태와 응답 구조를 검증하는 항목이다. 번호별로 주소, 상호, 대표자명 정보를 제공하여 위반 사업장의 기본 현황을 명확히 파악할 수 있도록 하였으며, 위반법규내용과 행정처분내용은 법령 위반 유형과 조치 결과를 구체적으로 제시하여 행정 절차의 투명성을 확보하는 데 활용된다. 등록일자는 해당 정보의 공개 기준 시점을 나타내어 자료의 최신성을 확인할 수 있는 근거가 된다. 본 데이터는 환경오염 예방 정책 수립, 위반 사업장 관리, 지역 환경안전 체계 강화 등 환경 행정 전반의 효율성을 높이는 데 중요한 기반 자료이다.
