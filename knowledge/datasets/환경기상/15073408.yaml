description_portal: '생태계교란 생물 가시박 전국 분포 현황 및 관련정보1. N과 E는 각각 분포지점의 위도(북위), 경도(동경)의 WGS84 좌표이며 문자 인코딩은 CP949임2. 가시박 관련 정보: 박과에 속하는 일년생 덩굴 초본식물. 북아메리카 원산으로 1980년대 후반 수박, 오이 등의 대목으로 국내에 확산된 것으로 추정됨. 줄기가 4~8m로 자라 주변 초본, 목본 등을 피압해 고사 시킴. 6~9월에 황백색의 수꽃이 위쪽에 피고, 암꽃은 담녹색으로 아래쪽에 핌. 확산 초기에는 안동, 대구, 포천 등에서 군락이 확인 되었으며, 현재는 제주도를 제외한 전국에 분포하고 있음. 주요 서식지는 하천, 습지로 물길을 따라 종자가 빠르게 확산'
