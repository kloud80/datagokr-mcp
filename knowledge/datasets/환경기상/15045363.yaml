summary_user: 제주특별자치도가 관리하는 광역 폐기물 소각시설의 운영 현황을 시설 단위로 담은 소량 파일(CSV 275바이트)로, 처리 규모·처리방식·연소실 온도·사용개시일·하루 반입량과 소각량·연간 가동일을 담는다. 제주 지역 가연성 폐기물을 소각시설이 하루 몇 톤 규모로 처리하고 실제 반입량 대비 소각량이 어느 수준인지 확인하려는 분석가나 주민의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 폐기물 처리시설 데이터와는 시설명이나 같은 기관(제주특별자치도) 기준으로만 맞춰 이어 쓴다.
