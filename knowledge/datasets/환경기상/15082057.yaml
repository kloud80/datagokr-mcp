summary_user: 충청남도 예산군이 「대기환경보전법」에 따라 허가하거나 신고받은 대기배출시설 설치 사업장을 한 행에 한 곳씩 담은 사업장 단위 원장 파일로, 사업장명·대표자·도로명 소재지·전화번호·대표업종·종(사업장 규모 구분)을 담는다(CSV 약 24KB, 예산군 범위). 주민이나 환경 담당자가 "우리 동네 근처에 대기오염물질을 내보내는 사업장이 어디에 있고 어떤 업종·규모인가"를 확인하거나 민원 대응·점검 대상을 추릴 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없으므로, 다른 데이터와는 사업장명·도로명 주소를 문자열로 맞추거나 같은 예산군 자료끼리만 이어 쓴다.
description_portal: 충청남도 예산군에 허가 또는 신고받은 대기배출시설 설치신고업체 현황 자료로 사업장명, 대표자, 도로명소재지, 전화번호, 대표업종, 종에 대한 정보를 제공이 데이터는  「대기환경보전법」에 따라 허가된 시설 정보를 기준으로 작성됩니다.대기오염 관리, 민원 대응, 환경정책 수립 등 다양한 분야에 활용됩니다.
