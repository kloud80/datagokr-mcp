summary_user: 해양수산부가 접수한 해역이용 영향평가 사업을 건별로 담은 API로, 사업명·사업시행자·소재지(주소·좌표)·사업기간·협의 상태·초안 공람 기간 등을 접수연도와 사업명으로 조회한다. 해역 개발사업이 어느 단계까지 협의됐는지, 우리 지역에 어떤 사업이 접수됐는지 알고 싶은 주민·사업자·분석가가 개발 선행 지표로 쓴다. 전역 조인 키는 없어 주소·좌표나 사업명 매핑, 같은 기관 코드로 토지이용규제·개발사업 데이터와 이어 쓴다.
