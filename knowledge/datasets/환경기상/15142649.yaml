description_portal: 환경부 국립환경과학원의 환경영향평가 사업 중 동식물상 녹지자연도, 조사, 조사자, 조사범위의 속성정보 제공 및 공간정보(조사지점)에 대해 정보를 제공하는 서비스입니다.조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 동식물상 정보(식물상/포유류/조류/양서파충류/곤충류/어류/저서생물(동물) 국명 목록, 식물상/포유류/조류/양서파충류/곤충류/어류/저서생물(동물) 학명 목록)를 포함하며, 조사범위속성은 조사에 대한 시물상조사유무, 포유류조사유무, 양서파충류조사유무, 곤충류조사유무, 어류조사유무, 저서생물(동물)유무정보를 제공합니다.녹지자연도에는 사업시행전 후의 녹지자연도(면적), 녹지자연도(비율) 등급을 제공하며 훼손수목량(주), 재활용 이식수목량(주) 등의 정보를 제공합니다.조사지점에 대한 공간정보는 WMS 및 WFS 형태로 제공되며, 사용자는 좌표체계, 반환 이미지 타입, 배경 이미지 포함 여부, 이미지 너비/높이 등의 설정을 통해 특정 좌표 기준의 동식물상 조사지점 포인트 이미지를 조회할 수 있습니다.
team:
