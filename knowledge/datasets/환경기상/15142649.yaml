  - op: /getIvstgWMS
    name: 조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/FlorafaunaService/getIvstgWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: 좌표 체계를 나타냅니다. 현재 EPSG:5179 좌표계를 지원합니다.
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getIvstgWFS
    name: 조사지점WFS조회
    endpoint: https://apis.data.go.kr/1480523/FlorafaunaService/getIvstgWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        desc: 좌표체계
      - name: maxFeatures
        required: true
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: false
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getIvstg
    name: 조사속성조회
    endpoint: https://apis.data.go.kr/1480523/FlorafaunaService/getIvstg
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
