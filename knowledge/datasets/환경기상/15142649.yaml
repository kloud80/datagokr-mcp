status: active
summary_user: 환경영향평가 사업별로 동식물상 조사 정보를 담는 API로, 조사차수·조사지점(주소·좌표)별 분류군(식물·포유류·조류·양서파충류·곤충·어류·저서동물) 국명·학명 목록, 분류군별 조사 여부, 사업 전후 녹지자연도와 훼손·이식 수목량, 조사지점 공간정보(WMS·WFS)를 제공한다. 개발사업 예정지 주변에 어떤 동식물이 조사됐는지, 사업으로 녹지자연도가 얼마나 바뀌는지 확인하려는 주민·사업자·환경 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 사업을 식별하는 관리번호(mgtNo)를 다른 환경영향평가 데이터에서 먼저 받아 넘기거나 주소·좌표로 토지이용규제·개발사업 정보와 공간 대조해 잇는다.
limits: 관리번호·좌표범위(bbox)·좌표계 같은 필수 파라미터가 있어야 하며, 최소 파라미터로 호출했을 때 조사범위·녹지자연도·WMS·WFS 오퍼레이션은 응답이 없었고 5개 중 1개만 호출에 성공했다. 사업 단위로 한 번 만들어진 뒤 바뀌지 않는 데이터라 생태 현황의 시계열 변화 추적에는 맞지 않는다.
