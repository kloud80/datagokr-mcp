summary_user: 송파구 관내 의류수거함을 한 개씩 기록한 위치대장으로, 설치장소·행정동·관리단체와 위도·경도 좌표를 담는다. 주민이 "우리 동네에서 가장 가까운 헌옷수거함은 어디이고 누가 관리하나"를 찾거나, 구청·분석가가 행정동별 수거함 분포를 살피는 데 쓴다. 전역 조인 키는 없어서 행정동 이름으로 다른 송파구 자료와 맞추거나 위도·경도로 지도·공간 데이터에 겹쳐 쓴다.
limits: 송파구 한 곳만 다루므로 다른 자치구 수거함은 각 지자체 파일을 따로 모아야 한다. 수거량 같은 발생·처리 통계는 담지 않는다. 행정동 코드가 없어 다른 데이터와는 이름 매칭이나 좌표로만 연결한다.
