summary_user: 특정수질유해물질을 배출하는 사업장별로 기준연도, 관할기관, 사업장명·주소, 폐수처리 형태(개별처리 후 직접방류, 공공하폐수처리시설 유입, 공동방지시설 유입, 위탁처리 등)를 담은 전국 단위 사업장 목록 파일이다. 우리 동네나 특정 하천 유역에 특정수질유해물질 배출 사업장이 어디 있고 폐수를 어떤 방식으로 처리하는지 확인하려는 주민·분석가가 쓴다. 전역 조인 키는 없어서 관할기관코드나 폐수처리장코드, 주소·사업장명 매칭으로 같은 기관의 다른 수질 오염원·측정망 데이터와 잇는다.
description_portal: 특정수질유해물질 배출량 조사제도는 폐수배출시설 설치 허가를 받아 특정수질유해물질을 배출하는 사업장이 해당물질 배출량을 조사하여 제출하고, 환경부에서 이를 확인, 검증하여 일반에 공개하는 제도로사업자가 자발적으로 배출량을 잘 관리하여 저감할 수 있도록 하는것을 목적으로 합니다. 본 데이터에서는 특정수질유해물질을 배출하는 사업장과 해당 관할기관, 폐수처리형태 등의 정보를 제공합니다.전년도말(12월31일) 까지 측정한 자료 등을 포함한 "배출량조사표"를 증빙서류와 함께 매년 3월 31일까지 시스템에 입력하는 제도입니다.
