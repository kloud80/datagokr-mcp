summary_user: 충청남도 계룡시에서 토양오염 우려로 중점 관리하는 특정토양오염관리대상 시설을 시설 한 곳당 한 건으로 담으며, 상호·도로명주소·대표 업종·전화번호를 제공한다(포털 설명상 2021년 9월 1일 기준). 사업자나 주민이 '내 땅이나 이웃 부지 근처에 주유소 같은 토양오염 관리 시설이 있는가'를 확인할 때 쓰고, 필지·공간 단위 환경 규제 레이어를 검토하는 보조 자료로도 쓴다. 전역 조인 키가 없으므로 도로명주소(RDNMADR)나 상호명을 문자열로 맞춰 주소·좌표 데이터, 다른 시군의 특정토양 데이터와 이어 쓴다.
description_portal: 충청남도 계룡시의 '특정토양 공공데이터 API'는 토양환경보전법에 따라 토양 오염의 우려가 있어 중점적으로 관리되는 특정토양오염관리대상 시설에 대한 현황 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 특정토양 정보를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 해당 시설의 공식 상호와 정확한 도로명주소, 시설의 주된 활동 분야인 대표 업종, 그리고 연락을 위한 전화번호가 포함됩니다.
