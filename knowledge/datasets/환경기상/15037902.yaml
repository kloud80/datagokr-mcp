description_portal: 이 데이터는 한국남부발전의 본사 및 각 사업소에서 연도별로 구매한 녹색제품 실적 현황을 정리한 자료입니다. 총구매액과 녹색제품 구매액, 구매 비율(%)이 포함되어 있으며 일부 연도는 정부 평가 목표치와 함께 제시됩니다. 예를 들어 2019년에는 전체 구매액 중 94% 이상이 녹색제품으로 채워져 친환경 조달 정책을 충실히 이행한 것을 확인할 수 있습니다. 이를 통해 본사와 남제주, 신인천, 영월 등 사업소별 친환경 구매 성과를 비교할 수 있으며, 공공기관의 환경경영 실천 수준을 평가하는 지표로 활용됩니다. 또한 친환경 조달 정책 연구, 정부 평가 대응, 기업 지속가능경영 분석, 녹색경제 활성화 전략 마련 등 다양한 분야에서 기초자료로 활용될 수 있습니다.
