summary_user: 부산광역시 동래구 관내 사업장폐기물 배출자를 업체 한 곳씩 담은 건별 목록으로, 배출자 구분·업체명·도로명주소·폐기물 종류가 들어 있다(CSV 약 4KB 규모의 소량 파일). 동래구에서 어떤 사업장이 어떤 종류의 사업장폐기물을 배출하는지, 특정 동네 주변의 배출 사업장 위치를 확인하려는 주민·환경 감시 담당자·분석가가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 업체명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
