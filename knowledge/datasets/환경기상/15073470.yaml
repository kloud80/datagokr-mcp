description_portal: 대전광역시 측정소별, 월별, 일별 (2026년06월) 대기오염도 현황 입니다.측정지점은 도시대기 측정소 11개소, 도로변 측정소 4개소 입니다.세부측정지점으로, 도시대기 측정소는 문창동, 읍내동, 구성동, 문평동, 성남동, 정림동, 둔산동, 노은동, 대성동, 상대동, 관평동 입니다.도로변 측정소는 대흥동, 월평동, 지족동, 비래동 입니다. 비래동은 신설 도로변측정소로 2026년 01월 23일 00:00 이후로 가동을 개시하였습니다.측정항목은 총 6가지 항목으로 PM10, PM2.5, SO2, NO2, O3, CO입니다.측정방법으로 PM10, PM2.5 는 베타선법, SO2 는 자외선형광법, NO2 는 화학발광법, O3 는 자외선광도법, CO 는 비분산적외선분석법 입니다.
legal_basis_portal: 대기환경측정망 설치 및 운영지침(2026)에 근거하여  측정 및 분석결과 입니다.
