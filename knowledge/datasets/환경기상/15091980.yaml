summary_user: 인천국제공항 공항기상레이더(TDWR)가 감지한 윈드시어 경보를 관측시각·활주로 방향·이착륙 구분·경보 발생 구역·경보 종류·경보 풍속 단위로 건별 기록한 파일 자료다. 항공 운항 분석가나 연구자가 '어느 활주로의 이륙·착륙 구간에서 어떤 종류의 윈드시어 경보가 언제 자주 났는가'를 따져 보는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 공항코드(인천공항 113)와 관측시각을 기준으로 같은 기관의 공항 기상관측 자료와 맞춰 이어 쓴다.
description_portal: '항공기상청에서 인천국제공항에 설치한 공항기상레이더(TDWR: Terminal Doppler Weather Radar)는 활주로 주변의 급격한 바람 변화로 인해 발생할 수 있는 윈드시어(wind shear) 현상을 실시간으로 감지하고, 이를 기반으로 윈드시어 경고 자료를 생산합니다.해당 자료는 관측시각(TM), 공항코드(STN_ID, 인천공항은 113), 활주로 방향(RWY_DIR), 이착륙 구분(RWY_AD), 경보 발생 영역(LOC), 경보 종류(ALERT), 경보 풍속(LG) 등의 항목으로 구성되어 있으며, 조종사와 항공사 운항 관리자가 기상 위험 요소를 사전에 파악하고 안전 운항을 위한 판단을 내리는 데 활용됩니다.'
