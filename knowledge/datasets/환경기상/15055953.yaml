summary_user: 광주 광산구 안의 건설폐기물 등 폐기물 중간처리업체를 업소별로 담은 원장 파일로, 업체마다 구분·사업장명·주소·등록일자·위도·경도를 담는다(약 1KB CSV라 업체 수는 적다). 주민이나 건설사업자가 '광산구에서 건설폐기물을 순환골재로 재활용하는 중간처리업체가 어디에 있나'를 찾거나, 분석가가 처리업체 위치를 지도에 올릴 때 쓴다. 사업자번호 같은 전역 조인 키는 없어 사업장명·주소 문자열이나 위도·경도 좌표로 다른 폐기물 처리업 허가 목록이나 다른 시군구 현황과 맞춰 쓴다.
description_portal: 광주광역시 광산구 내 폐기물 중간처리업 현황(업소명, 도로명주소, 등록일자, 위도, 경도 등)에 대한 정보를 제공합니다.건설폐기물중간처리업은 건설폐기물을 순환골재로 재활용하는 업체입니다건설폐기물의 재활용촉진에 관한 법률 제21조에 따라서 건설폐기물중간처리업을 하려는 자는 환경부령으로 정하는 바에 따라 건설폐기물 처리 사업계획서를 제출하여야 합니다입지관련은 타법저촉을 요함으로 관련부서에 문의하여 주시기 바랍니다.사업계획서 적합통보를 받은자는 환경부령으로 정하는 바에 따라 건설폐기물처리업 기준을 갖추어 허가를 받아야 합니다
