description_portal: 본 데이터는 국가환경교육 통합플랫폼에서 제공하는 다양한 환경교육 콘텐츠를 주제별로 분류하고, 각 분류에 포함된 콘텐츠의 등록 현황을 수치로 정리한 자료입니다.환경교육은 교육 현장, 시민사회, 공공기관 등 다양한 영역에서 활용되기 때문에, 콘텐츠의 종류와 규모를 체계적으로 파악하는 것은 효과적인 환경교육 제공을 위한 중요한 기반 정보입니다.본 데이터에서는 플랫폼 내 콘텐츠를 기후변화·탄소중립, 생태계, 지속가능발전 등 주요 환경 분야의 대분류 카테고리로 구분하고, 각 분류별 콘텐츠 등록 건수를 함께 제공함으로써 현장의 교육 수요 및 주제별 콘텐츠 집중도를 쉽게 확인할 수 있습니다.
