description_portal: '해당 데이터는 가스공사 삼척기지 내 풍향, 풍속 데이터를 csv 형식으로 업로드한 자료입니다.설비가 위치한 장소는 기지 설비지역내 6변전소입니다.csv 파일 내 데이터는 크게 각 1분 평균/최대, 10분 평균/최대 풍향 및 풍속을 다루고 있으며,풍향 : 범위는 0~360이며, 단위는 각도입니다.풍속 : m/s 단위입니다.금번 데이터는 2021.08.04. ~ 2023.07.31. 기간 내 데이터입니다.본 데이터를 활용하면 삼척기지의 풍향풍속 패턴 분석, 가스 확산 모델링 및 시뮬레이션, 신규 설비 설치 시 환경 조건 검토, 비상 대피 계획 수립, 기상재해 대비 계획 수립에 기초자료로 활용할 수 있어 LNG 생산기지 안전 운영과 재난 대응 역량 강화에 기여할 것으로 기대됩니다.'
