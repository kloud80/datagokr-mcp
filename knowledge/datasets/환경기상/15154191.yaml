summary_user: 경기도 시군에 설치된 물놀이형 수경시설(바닥분수·조합놀이대 등)을 시설 한 곳당 한 행으로 담는 신고현황 원장으로, 시설명·종류·주소·운영주체·운영기간·바닥면적·용수 종류·저류조 용량·용수 교체와 저류조 청소 주기·여과기 설치 여부와 종류·소독방법을 기록한다. 여름철 아이와 갈 만한 우리 동네 바닥분수가 어디 있고 여과기와 소독(염소·오존)을 갖췄는지 확인하려는 보호자, 또는 시군별 수경시설 위생관리 실태를 비교하는 담당 공무원과 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명(sigun_nm)이나 시설 주소를 이름 기준으로 맞춰 잇는다.
description_portal: 이 데이터는 경기도에 설치된 물놀이형 수경시설의 설치 및 운영 현황을 기록한 자료로, 수경시설의 이름과 종류, 설치 위치, 운영주체(지자체 또는 민간), 운영 기간, 시설 규모(바닥면적), 용수 종류, 저류조 용량, 용수 및 저류조 교체 주기, 여과기 설치여부 및 종류, 소독방법 등 다양한 항목을 포함하고 있습니다. ‘수경시설 종류’는 바닥분수, 조합놀이대 등으로 다양하며, ‘용수종류’는 대부분 수돗물이 사용됩니다. 여과기 설치와 청소 주기는 위생 관리에 중요하며, ‘소독방법’ 항목에서는 염소 또는 오존 소독 여부가 확인됩니다. 해당 자료는 시설의 위생 상태 및 안전성을 평가하고, 향후 시설 설치나 개선 시 정책적 판단 자료로 활용할 수 있으며, 여름철 어린이 물놀이 안전관리 등 실무 운영에 기여할 수 있는 기반 자료로 유용합니다.
