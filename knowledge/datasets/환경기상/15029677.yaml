summary_user: 대구광역시 북구 관내 음식물쓰레기 수거용기 판매소를 업소 한 곳당 한 행으로 담은 파일로, 동별 구분과 업소명·주소·전화번호·위도·경도가 들어 있다. 북구 주민이 우리 동에서 음식물쓰레기 수거용기를 어디서 살 수 있는지 찾거나, 판매소 위치를 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 동 이름이나 주소로 맞추거나 위도·경도로 다른 생활폐기물 배출·수거 지점 데이터와 지도 위에서 겹쳐 쓴다.
description_portal: 대구광역시 북구 관내 음식물쓰레기수거용기 판매소 운영현황(동별,업소명,주소,전화번호 등) 정보를 제공합니다.민원인들이 음식물쓰레기 수거용기 구입시 참고 할 수 있도록 자료를 제공 합니다.동별 판매처의 상호, 주소, 전화번호, 위도 경도 등 지도 상 위치 정보까지  등록하여 수거용기 판매처에 대한 민원인들에게 알기 쉬운 자료를 제공하여 편리하게 정보를 취득할 수 있도록 매년 자료를 현행화하여 업로드합니다.동별 판매소 현황은 매년 동별로 재취합하여 현행화 하며 최신 정보를 업로드하여 민원인들에게 자료를 제공합니다.
