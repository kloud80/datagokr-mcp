description_portal: '폭염이란 매우 심한 더위를 말하며, 폭염이 지속되면 온열질환 발생, 가축과 어패류의 집단 폐사, 야외근로자 사망 등 다양한 분야에서 피해가 발생합니다.폭염 데이터셋은 폭염과 연관된 체감온도, 습도, 폭염 영향예보, 열대야 등 다양한 데이터를 하나로 묶어서 제공합니다.* 제공요소별 보다 자세한 데이터는 기상자료개방포털의 다음 메뉴를 통해 확인하실 수 있습니다.- 기온, 습도: 데이터 → 기상관측 → 종관기상관측/방재기상관측- 특보: 데이터 → 기상예보 →기상특보- 영향예보: 데이터 → 기상예보 → 영향예보- 열대야: 기후통계분석 → 기상현상일수 → 열대야일수- 자외선지수: 데이터 → 응용기상 → 생활기상지수'
