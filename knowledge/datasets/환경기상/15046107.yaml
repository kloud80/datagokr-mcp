description_portal: 진주시 관내 특정오염도조사대상현황(업소명, 도로명주소, 위험물안전관리법 완공검사일, 차기토양오염도검사기간)을 제공합니다. 토양환경보전법 제12조에서 정하는 바에 따라 진주시 관내에 인허가를 득한 사업장이며, 같은 법에서 정하는 바에 따라 토양오염검사를 부과하고 있습니다. 토양환경보전법에서 정하는 특정토양오염관리대상시설은 석유류 저장용량이 20,000L가 넘을 경우 특정토양오염관리대상시설이라고 규정하고 있습니다. 토양오염검사는 위험물안전관리법 완공검사일을 기준으로 하며, 최초 완공검사일 이후 15년간은 5년에 한번 토양오염도검사를 부과하며, 15년 이후는 매2년마다 한번씩 부과하고 있습니다. 누출검사의 경우는 최초 검사는 완공검사일 이후 10년째 되는 해에 부과하며, 그 이후로는 매8년마다 부과하고 있습니다. 토양오염검사(토양오염도검사, 누출검사)는 토양관련전문기관에 의뢰하도록 규정하고 있으며, 토양관련전문기관은 그 성적서를 의뢰인 및 관할 지자체에 송부하도록 법에 규정하고 있습니다. 토양관련전문기관의 명단은 환경부 홈페이지에 환경정책란에 안내되어 있습니다.
