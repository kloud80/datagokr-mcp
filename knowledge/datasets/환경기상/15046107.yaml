summary_user: 진주시 관내 특정토양오염관리대상시설(석유류 저장용량 20,000L 초과 사업장)을 업소별로 담은 파일로, 업소명·도로명·지번주소·위험물 완공검사일·차기 토양오염검사 시기를 한 행씩 기록한 건별 목록이다(CSV 약 7KB). 주민이나 부동산·개발 검토자가 '이 동네 주유소·저유시설은 언제 토양오염도검사나 누출검사를 받아야 하는가'를 확인하거나, 시가 검사 부과 일정을 점검하는 데 쓴다. 전역 조인 키나 코드는 없어서 다른 데이터와는 주소(도로명·지번)를 지오코딩하거나 업소명으로 맞춰 이어 써야 한다.
