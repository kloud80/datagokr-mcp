description_portal: 본 데이터는 국립공원공단이 전국 국립공원에 설치·운영 중인 **기상관측시설(AWS, 강우계, 적설계 등)**에 대한 현황 정보를 수록한 자료로, 공원 내 기후환경 모니터링, 재난 예·경보 체계 구축, 생태변화 감시 등을 목적으로 활용됩니다. 주요 항목에는 시설명, 국립공원명, 설치 지점명, 위치 좌표(위도·경도), 해발 고도, 설치 연도, 관측 항목(기온, 강수량, 풍속, 습도, 기압 등), 운영 여부, 통신 방식, 전원 공급 방식, 관리 주체 및 점검 주기 등이 포함되며, CSV 포맷으로 제공됩니다. 본 데이터는 실시간 기상 정보 제공, 기후 기반 탐방로 통제, 위험기상 대응, 생태계 변화 분석, 재난안전 플랫폼 연계 경보 발령 등 다양한 분야에 활용되며, 탐방객의 안전 확보 및 기상 기반 서비스 개발을 위한 핵심 인프라 정보를 제공합니다. GIS 기반 시각화 및 국립공원 재난관리 시스템과 연계해 운용할 수 있습니다.
