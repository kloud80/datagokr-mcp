summary_user: 전국 국립공원에 설치된 기상관측시설(AWS 등) 151곳을 지점별 한 행으로 담은 CSV 현황 목록이다(지점명·주소·위도·경도·고도·장비구분). 국립공원 탐방로 통제나 위험기상 대응을 준비하는 담당자·분석가가 '어느 공원 어디에 어떤 관측 장비가 있나'를 확인하는 데 쓴다. 주소(address)와 위도·경도(coord)를 키로 다른 위치 데이터나 지도 시각화에 이어 쓰며, 관측지점번호 기준 시간·일 자료와는 표준지점번호를 대조해 볼 수 있다.
