summary_user: 부산광역시 사상구 관내에서 석유류·유해화학물질 저장시설 같은 특정토양오염관리대상시설을 시설(업소) 한 곳당 한 행으로 업소명·소재지·업종을 담은 현황 파일(csv, 약 3.3KB)입니다. 사상구 공장·토지를 사거나 개발하려는 사업자나 분석가가 '이 주소 근처에 토양오염 우려 시설(주유소·저장시설 등)이 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어, 소재지 주소를 지오코딩하거나 업소명으로 맞춰 필지·용도지역 등 다른 환경 공간 규제 레이어나 사업장 데이터와 이어 쓴다.
description_portal: 특정토양오염관리대상시설이란 토양을 현저하게 오염시킬 우려가 있는 토양오염관리대상시설로서 환경부령으로 정하는 것을 말합니다. 환경부령의 특정토양오염관리대상시설로는 석유류의 제조 및 저장시설, 유해화학물질의 제조 및 저장시설, 송유관시설, 기타 다른 관리대상시서로가 유사한 시설로서 특별히 관리할 필요가 있다고 인정되어 환경부장관이 관계중앙행정기관의 장과 협의하여 고시하는 시설을 말합니다.이 데이터는 부산광역시 사상구 관내 환경오염물질인 토양오염물질을 취급하는 특정토양오염관리대상시설에 대한 데이터로 업종, 상호, 소재지 등이 포함된 현황에 관한 데이터입니다.
