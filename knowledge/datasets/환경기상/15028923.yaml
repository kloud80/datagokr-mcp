limits: 사업장별 배출량이나 처리 현황 같은 수치는 담지 않는다. 공통 식별 코드가 없어 다른 데이터와 연결하려면 주소·이름 매칭이 필요하며, 범위는 부산 중구 한 곳뿐이다.
