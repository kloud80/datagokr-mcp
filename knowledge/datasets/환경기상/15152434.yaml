description_portal: 경기도 하남시 종량제물품 코드 현황으로, 종량제봉투의 품목·단가·판매가격·묶음수량 등 전자유통 관리체계의 전체 구조를 보여주는 핵심 데이터입니다.총 여러 종류의 봉투(5L·10L·20L·50L·100L 등)가 포함되어 있으며, 각 품목은 **상품코드(A002~A100)**로 식별됩니다.데이터는 일반단가·납품단가·판매가격을 모두 포함하고 있어, 지자체 내부 원가 → 공급업체 매입가 → 시민 판매가까지의 3단계 가격구조를 명확하게 파악할 수 있습니다. 예를 들어 일반용 50L(A005)의 경우 일반단가와 납품단가는 1,130원, 시민 판매가격은 1,240원으로 설정되어 있어 행정원가 대비 최종 판매가격의 구조적 차이가 잘 드러납니다.또한 상품상자개수·묶음개수·최소개수 정보가 포함되어 있어 물류단위 및 최소 판매 규격을 관리할 수 있으며, ‘상품사용여부(Y/N)’는 현행 사용품목과 폐지·중지 품목을 구분하는 중요한 행정관리 지표입니다.전체적으로 이 데이터는 하남시의 종량제봉투 유통관리, 가격정책, 발주·재고관리, 환경행정 투명성을 모두 뒷받침하는 구조적·운영적 데이터셋입니다.
