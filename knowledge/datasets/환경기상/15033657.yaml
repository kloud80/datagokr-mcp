summary_user: 강원특별자치도 도시대기측정소별로 아황산가스·이산화질소·오존·일산화탄소·미세먼지·초미세먼지의 월평균 농도를 시군·측정소·연도·월 단위로 담은 집계 파일이며, 범위는 강원 시도 내 시군구 수준이다. 주민이나 분석가가 '우리 시군 측정소의 초미세먼지 월평균이 해마다 어떻게 달라졌나'처럼 지역별 대기질 변화를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명이나 측정소 이름을 맞춰 연결해야 한다.
