description_portal: '본 데이터는 「대기환경보전법」 제3조 및 대기환경측정망 설치·운영지침(2024)에  따라, 강원특별자치도 도시대기측정소에서 수집된 월평균 대기오염물질 농도 정보입니다.측정자료는 강원특별자치도 보건환경연구원의 품질관리 절차를 거쳐 확정되며, 주요 항목은 아래와 같습니다.아황산가스 (SO₂)눈·코·기도를 자극하고, 천식 환자에게 악영향을 줄 수 있음이산화질소 (NO₂)폐 기능 저하, 기관지염 유발, 어린이 호흡기 질환 악화오존 (O₃)눈과 폐를 자극하고, 고농도 노출 시 기침·호흡곤란 초래일산화탄소 (CO)산소 운반 방해로 어지럼증, 두통, 심할 경우 의식 저하미세먼지 (PM10)호흡기 자극, 기관지염 등 만성 호흡기 질환 위험 증가초미세먼지 (PM2.5)폐 깊숙이 침투해 심혈관질환·호흡기질환 및 조기사망 위험 증가활용분야: 건강 취약계층 보호 및 실외활동 안내, 지역별 대기질 변화 모니터링, 환경·보건 정책 수립 및 평가'
