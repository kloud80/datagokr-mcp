description_portal: 환경공간정보서비스에서 제공하는 생태·자연도의 지역별 면적 통계 입니다.(생태·자연도 1~3등급, 별도관리지역, 이의신청지역)생태·자연도란 산, 하천, 내륙습지, 호소(湖沼), 농지, 도시 등에 대하여 자연 환경을 생태적 가치, 자연성, 경관적 가치 등에 따라 등급화하여 작성한 지도입니다.생태·자연도는 과거 녹지자연도에서 발전된 개념으로 전국자연환경조사 및 기타 생태조사정보를 기반으로 하여 자연환경을 생태적 가치, 자연성, 경관적 가치 등에 따라 등급화한 지도로 자연환경 보전 ㅋ 개발의 평가기준 등으로 활용되고 있습니다. 전국자연환경조사, 각종 생태계정밀조사 결과 등을 GIS-DB화(현존식생도, 지형현황도, 동·식물분포도)하여 전국을 생태적 가치에 따라 1~3등급 및 별도관리지역으로 구분한 1/25,000 축척의 생태·자연도(전국 800개 도엽)를 제작하여 일반에 공개해 오고 있습니다.
