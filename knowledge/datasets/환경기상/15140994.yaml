summary_user: 서울 마포구에서 대기오염물질 배출시설을 설치·운영하려고 인허가를 받은 사업장을 건별로 담는다. 사업장명·관리번호, 인허가일과 영업상태(영업·휴업·폐업 일자), 지번·도로명 주소와 좌표, 업종, 주생산품, 배출시설·방지시설의 조업시간과 연간가동일수가 들어 있다. 주민이나 분석가가 "우리 동네에 대기 배출시설을 가진 사업장이 어디 있고 지금도 영업 중인가"를 확인하는 데 쓰고, 전역 조인 키는 없어 다른 데이터와는 사업장명·주소나 같은 기관 코드(OGDP_INST_CD)로 맞춰 잇는다.
description_portal: 서울특별시 마포구 대기오염물질배출시설 설치사업장 인허가 정보에 대한 설명입니다. 이 데이터에는 사업장에서 대기오염물질을 배출하는 시설을 설치·운영하기 위해 받은 인허가 내역이 포함되어 있습니다. 주요 항목으로는 사업장명, 관리번호, 영업상태명(영업/정상), 실제 위치한 지번주소 및 도로명주소, 도로명우편번호, X좌표 및 Y좌표 등이 제공됩니다. 또한, 전화번호, 업종구분명(대형 종합 소매업, 부동산 임대업, 발전업, 주차장 운영업, 호텔업, 비주거용 건물 임대업 등), 배출시설조업시간, 배출시설연간가동일수, 방지시설조업시간, 방지시설연간가동일수 등도 함께 포함되어 있습니다.
