summary_user: 해양환경공단 해양환경측정망 중 항만 해역 조사정점에서 CTD 센서로 잰 수온·염분을 수심별로 담은 건별 관측 파일로, 생태구·정점명·관측년도·관측월 단위로 기록된다(CSV 약 21KB). 연구기관·지자체 분석가가 특정 항만에서 계절별로 수온·염분 성층이 어떻게 달라지는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양수질 측정 자료와는 정점명·관측년월을 이름 기준으로 맞추거나 같은 기관 자료끼리 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양환경측정망 중 항만 해역을 대상으로 수행된 CTD 조사자료를 제공합니다. 본 데이터는 수심, 수온, 염분 등 항만 내 수질의 수직분포 특성을 포함하고 있으며, 선박 출입, 정체수역 특성 등으로 인해 복잡한 수질 변화를 보이는 항만환경을 정밀하게 진단하는 데 활용됩니다. 조사는 항만별 조사정점에서 수심별로 CTD 센서를 이용해 수행되며, 수질의 시공간적 변화, 오염 특성, 외부 유입 영향 등을 분석할 수 있습니다. 데이터는 항만명, 조사정점, 항목별 측정값, 조사시기 등으로 구성되며, 공공기관, 연구기관, 지자체 등에서 항만 수질평가, 오염원 추적, 정책 수립 등의 기초자료로 활용됩니다.
