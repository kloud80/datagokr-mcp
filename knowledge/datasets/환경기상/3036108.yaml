description_portal: '- 전라남도 습지보호구역현황(지역명, 위치, 면적, 지정일자, 유형) 정보입니다.- 유형은 하천습지, 산지습지, 연안습지로 구분됩니다.- 전라남도는 생물다양성이 풍부하고 생태적 가치가 높은 갯벌 지역을 습지보호지역으로 지정하여 체계적으로 보전하고 있습니다. 이러한 지역들은 멸종위기종 서식지로서의 중요성과 함께 생태관광 자원으로서의 가치도 인정받고 있습니다.- 습지보호지역에서는 건축물 신축, 광물 채굴, 동식물의 인위적 도입 및 경작·포획·채취 등이 제한되며, 수산업을 영위하기 위한 행위나 지역 주민의 지속적인 동식물 경작·포획·채취 행위는 허용될 수 있습니다.'
