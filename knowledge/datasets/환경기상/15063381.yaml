summary_user: 성남시 안에서 사업장폐기물 배출신고를 한 사업장을 한 행씩 담은 원장으로, 상호명·도로명/지번 주소·인허가 관리번호·인허가 등록일자·배출 폐기물 종류를 사업장 단위로 담는다. 우리 동네나 특정 건물 주변에 어떤 사업장이 어떤 종류의 폐기물을 배출신고했는지 확인하려는 주민, 또는 성남시 배출 사업장 분포를 지도로 그려 보려는 분석가가 쓴다. 전역 조인 키는 없어서 소재지 주소나 상호명으로 다른 사업장·인허가 자료와 매칭하거나 같은 성남시 자료끼리 맞춰 쓴다.
