description_portal: 성남시 내 사업장에서 발생하는 폐기물의 배출신고 현황 자료입니다. 상호명, 소재지 주소, 인허가관리번호, 인허가일자, 배출폐기물 종류 등의 항목으로 구성되어 있습니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.* 해당 자료는 성남시의 환경관리 및 폐기물 처리 정책수립에 필요한 기초 정보를 확인 할 수 있으며,  환경영향 분석등에 참고자료로 활용할 수 있습니다.* 자료중 상호명은 폐기물을 배출한 사업장의 이름, 주소는 사업장의 위치, 배출폐기물 종류는 생활폐기물, 사업장폐기물, 음식물류 폐기물, 음식물쓰레기, 폐합성수지, 하수처리오니 등 다양한 유형을 포함합니다.
