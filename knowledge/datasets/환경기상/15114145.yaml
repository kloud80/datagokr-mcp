summary_user: 전국 지하철 역사별로 측정연도·호선·측정위치 단위의 실내 공기질 측정값(미세먼지·초미세먼지·이산화탄소·폼알데하이드·일산화탄소·이산화질소·라돈·휘발성유기화합물)을 담은 표준데이터로, 포털에서 약 39KB 크기의 CSV 파일 하나로 받는다. 지하철 이용자나 환경 분석가가 "내가 자주 타는 역의 승강장 미세먼지·라돈 수치는 다른 역보다 높은가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시도명·시군구명이나 호선명·역사명 같은 이름을 매핑해 역사 위치 정보나 대기질 데이터와 잇고, 같은 기관의 데이터는 제공기관코드로 묶는다.
limits: 측정 시기와 대상 역의 범위는 확인되지 않았고 행정단위는 시군구까지다. 역이나 지역을 가리키는 공통 코드가 없어서, 다른 데이터와 붙일 때는 역명·지역명 표기 차이를 직접 맞춰야 한다.
