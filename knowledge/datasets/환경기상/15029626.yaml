summary_user: 광주환경공단이 운영하는 음식물자원화시설별로 광주광역시 자치구(동구·서구·남구·북구·광산구)에서 반입된 음식물폐기물 양(톤)을 기준일자·처리장·자치구 단위로 담은 파일입니다. 분석가나 지자체 담당자가 '어느 자치구의 음식물폐기물이 어느 시설로 얼마나 들어오고 시기별로 어떻게 달라지는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 자치구명이나 처리장명을 이름으로 맞춰 다른 광주 폐기물·인구 자료와 붙여 쓴다.
