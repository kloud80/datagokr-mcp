summary_user: 빛공해환경영향평가 실태조사가 실제로 이루어진 조사 지점을 지점 한 곳당 한 행으로 담은 전국 단위 파일로, 시도·시군구, 대상 조명시설 소재지 주소, 조명환경관리구역 코드, 용도지역 코드가 들어 있다. 지자체 담당자나 분석가가 "우리 시군구에서 빛공해 실태조사를 받은 조명시설은 어디이고, 어느 조명환경관리구역·용도지역에 속하나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시도명·시군구명 같은 이름을 매핑하거나 소재지 주소를 지오코딩해 토지이용규제·개발사업 정보와 붙이고, 조명환경관리구역·용도지역 코드는 별도 코드표와 맞춰 해석해야 한다.
description_portal: 이 테이블은 빛공해환경영향평가 실태조사에 따라 수집된 조사 지점 정보를 정리한 자료입니다. 각 지점은 실제 조사가 수행된 장소를 기준으로 구성되며, 해당 위치의 행정 구역 정보(시도명, 시군구명), 구체적인 대상 조명 시설의 소재지, 해당 지점이 속한 조명환경관리구역 코드, 그리고 토지의 용도지역 코드로 구성되어 있습니다.‘시도명’과 ‘시군구명’은 행정구역 단위로 분류된 조사 위치를 의미하며, ‘대상조명소재지’는 실태조사 대상이 된 조명 시설의 정확한 위치 주소를 나타냅니다. 이는 거리 조명, 광고물 조명, 건축 외부조명 등 다양한 인공조명 설치 지점을 포함할 수 있으며, 실제 조명의 설치 밀도나 형태와 관계된 평가에 활용되는 기준입니다.
