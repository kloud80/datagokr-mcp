summary_user: 순천시에서 비산먼지 발생사업으로 신고된 공사장·사업장을 건별로 담은 원천 목록으로, 사업장명·공사장 소재지·발생사업 종류·공사기간·대상사업 규모를 기록한다. 주민이나 분석가가 "우리 동네 근처에서 지금 진행 중인 비산먼지 발생 공사가 어디이고 언제까지인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 공사장 주소를 기준으로 맞춰 이어 쓴다.
