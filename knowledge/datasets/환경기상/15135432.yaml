summary_user: 경기도 내 시군구를 북부·남부·중부·동부 권역으로 나누고 각 시군구의 지형 구분을 함께 정리한 시군구 단위 참조 목록이다. 연구자나 분석가가 경기도 대기질 측정값을 권역별·지형별로 묶어 비교할 때, 예컨대 북부 산간 지역과 남부 평야 지역의 미세먼지 차이를 볼 때 기준표로 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 대기질·통계 데이터와는 시군구명(signgu_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 경기도_대기환경_진단평가시스템_지역정보 데이터는 경기도 내 각 시군구를 북부, 남부, 중부, 동부로 구분하여 정리한 자료입니다. 주요 항목에는 지역, 시군구명, 지형이 포함되며, 의정부시·평택시·포천시 등 경기도 전역의 행정구역이 포함되어 있습니다. 이 데이터는 대기환경 예측 및 분석 과정에서 지역별 특성과 지형 조건을 반영하기 위해 활용됩니다. 이를 통해 연구자는 지역별 대기질 변화를 보다 정밀하게 분석할 수 있고, 행정기관은 권역별 환경 정책을 수립하는 등으로 데이터를 활용할 수 있습니다.
