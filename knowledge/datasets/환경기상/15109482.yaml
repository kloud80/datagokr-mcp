summary_user: 천안시의 유해야생동물 포획 기록을 건별로 담은 API로, 신고일자·포획일자, 개체 종류와 포획 유형, 포획지 시도·시군·상세주소와 위도·경도, 포획 개체 수를 제공한다. 농작물 피해 대응을 검토하는 주민·지자체 담당자나 분석가가 "천안시에서 어떤 동물이 어느 지역에서 언제 많이 포획되는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시도·시군 이름 매핑이나 포획지 위경도를 이용한 공간 결합으로 이어 쓴다.
limits: 실측 컬럼에 다른 데이터와 바로 맞출 공통 코드가 없어 연계는 이름 매핑이나 좌표에 의존해야 한다. 공공데이터포털 활용신청 후 serviceKey로 호출하며, 개발계정은 하루 5,000회로 제한된다.
