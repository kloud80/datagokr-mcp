summary_user: 한국남부발전 발전소의 사업소·호기 단위로 설비용량(MW)과 탈황·탈질설비, 전기집진기의 설계형식과 제거효율, 발전·탈황 폐수처리설비의 처리기술과 하루 처리용량을 담은 현황표이며, 약 1.4KB 크기의 작은 CSV 파일이다. 분석가나 연구자가 '남부발전 각 호기에는 어떤 방식의 탈황·탈질 설비가 있고 제거효율은 얼마인가'를 확인하거나 발전사별 환경설비 수준을 비교할 때 쓴다. 사업소(kospo_saupso_cd)와 호기(kospo_plant_unit)를 키로 같은 기관의 발전설비·배출량 등 호기 단위 자료와 이어 쓴다.
description_portal: 이 데이터는 한국남부발전 발전소별 환경설비 설치 현황을 정리한 자료입니다. 사업소와 호기, 설비용량(MW)을 비롯해 탈황설비, 탈질설비, 전기집진기, 폐수처리설비 등 주요 환경설비의 설계형식과 제거 효율, 처리 기술 및 처리 용량을 포함하고 있습니다. 예를 들어 하동 발전소의 경우 습식배연탈황, SCR 방식의 탈질설비, 전기집진기 등을 통해 높은 수준의 오염물질 저감 성능을 기록하고 있으며, 폐수처리설비를 통한 수질 관리 현황도 함께 제공됩니다. 이 자료는 발전소 운영에서의 환경보호 노력과 친환경 설비 구축 성과를 보여주며, 대기오염 저감, 수질 관리, 탄소중립 실현을 위한 정책 연구, 에너지 산업의 친환경 전환 평가 등 다양한 분석에 활용할 수 있는 기초자료입니다.
