summary_user: 기상청 고층기상관측(레윈존데·연직바람관측장비 등) 지점별로 지점번호, 지점명, 위도·경도, 해발고도, 관측 시작·종료일 같은 이력과 주변 환경 정보를 담는 전국 범위의 지점 메타데이터이다. 분석가가 특정 지역 상공의 고도별 기온·바람 자료를 쓰기 전에 "그 시기에 어느 고층관측 지점이 어디서 운영됐는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 고층기상 관측자료와는 지점번호·지점명 매핑이나 같은 기상청 코드로 연결한다.
