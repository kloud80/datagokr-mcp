summary_user: 대구광역시 동구에서 신고된 석면 해체·제거 작업을 사업장 건별로 담으며, 작업 신고 번호, 공사 현장명, 도로명 주소, 건물·설비명, 사업체명, 해체 시작·종료 일시, 석면 종류, 작업 면적(㎡)을 제공한다. 동구 주민이 우리 동네 근처에서 언제, 어느 건물에서 어떤 석면을 얼마나 넓게 철거하는지 확인하거나, 분석가가 시기별 석면 철거 현황을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명 주소나 사업체명을 맞춰 연결해야 하고, 같은 부문의 다른 오염원 사업장 데이터와도 이름·주소 매핑으로만 이어 쓴다.
description_portal: 석면해체제거 사업장 내역 조회서비스 API는 석면 해체 및 제거 작업이 이루어지는 사업장의 주요 정보를 제공하는 데이터 서비스입니다. 본 API는 해체 시작 일시를 기준으로 사업장의 작업 신고 번호, 공사 현장 명, 도로명 주소, 건물 및 설비 명, 사업체 명 등의 기본 정보를 확인할 수 있습니다. 또한 해체 시작 및 종료 일시, 석면 종류 명, 작업 면적(㎡) 등 작업 세부 정보를 함께 제공하여 사업장의 안전 관리와 행정 감독에 활용될 수 있습니다. 이 서비스는 석면 제거 과정의 투명성을 확보하고 주민의 건강 및 환경 안전을 지키기 위해 운영되며, 공공데이터 활용을 통해 정책 수립, 현장 관리, 모니터링 시스템 구축 등에 폭넓게 활용 가능합니다. 이를 통해 행정기관과 시민 모두 석면 관련 정보를 신속하게 파악할 수 있어 공공안전과 환경보호에 기여합니다.
