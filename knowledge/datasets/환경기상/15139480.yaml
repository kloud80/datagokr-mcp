description_portal: 공동주택의 전기안전관리자와 일반 국민들이 기상변화에 따른전력수요의 변화를 쉽게 예측하여 전력 수요가 급증할 수 있는 시기에 전력 수요관리를 통해 정전사고 예방에 활용할 수 있도록 공동주택의 전력 수요를예측하는 전력기상지수를 한국전력공사와 공동개발하였습니다.(참고) 전력기상지수(PWI)는 기상 상황이 전력 수요 및 전력설비 운용에 미치는 영향을 수치화한 지표입니다.기온, 습도, 바람, 적설 등 기상요소들이 전력수급에 미치는 영향을 고려하여 전력 수요 급증·감소 및 설비 이상 가능성을 사전에 예측·평가하기 위해 사용됩니다.
