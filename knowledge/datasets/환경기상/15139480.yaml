summary_user: 기상 상황이 공동주택 전력 수요와 전력설비 운용에 미치는 영향을 수치화한 전력기상지수(PWI)를 전국 범위로 조회하는 API이며, 기상청이 한국전력공사와 함께 개발한 예측 지수다. 공동주택 전기안전관리자나 일반 국민이 "며칠 뒤 기온·습도 변화로 우리 단지 전력 수요가 급증할 시기인가"를 미리 판단해 수요관리와 정전 예방에 쓴다. 실측 응답에서 다른 데이터와 바로 맞물리는 공통 조인 키는 확인되지 않아, 같은 기상청 단기예보 등과는 지역명·예보구역 코드 매핑으로 이어 써야 한다.
limits: 포털 활용신청과 별개로 기상청 API허브(apihub.kma.go.kr)의 인증키를 경로 파라미터로 넣어야 호출된다. 응답 필드에 전역 조인 키가 없어 행정구역·격자 단위 데이터와 자동으로 결합되지 않고, 비공간 데이터라 위치 좌표 분석에는 바로 쓰지 못한다.
