description_portal: 고해상도 기상기후정보 표출시스템에서 사용하고 있는 공지사항 및 제공하고 있는 풍력 미래기상자원지도 시계열 자료입니다.풍력 미래기상자원지도는  미래에 풍력자원이 어떻게 변화할 것인지에 대한 정보를 담은 지도라고 할 수 있습니다. 미래 기상자원지도는 IPCC 5차 평가보고서에서 새롭게 도입된 RCP(대표농도경로) 시나리오를 적용하여 생산한 기후변화 시나리오를 활용하여 제작되었습니다. 기상청 국립기상과학원의 지역기후모델(HadGEM3-RA)에서 생산된 RCP2.6, RCP4.5, RCP8.5 시나리오 3종을 채택하였고, 2014년부터 2040년까지 약 27년의 가까운 미래에 대한 연,월평균 풍속의 분포를 지도화 하였습니다. 기상자원지도에서 표현한 영역과 동일하게 육지의 해안선으로부터 약 35km 영역까지 나타내었으며, 풍력발전기 터빈고도가 높아지는 추세를 반영하여 80m, 100m, 120m 고도의 풍속 분포를 나타내었습니다.* 자료 활용 시 유의점미래 풍력 기상자원지도는 RCP 기후변화 시나리오의 평균풍속자료를 활용하여 제작된 자료입니다. 미래풍력 기상자원지도는 미래를 예측한 시나리오 자료이기 때문에 값 자체의 정확도보다 기상자원의 변동성과 변화 추이를 중심으로 분석해 주시기 바랍니다.
