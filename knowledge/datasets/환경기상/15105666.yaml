description_portal: 인천광역시의 물놀이형 수경시설 설치·운영 현황에 대한 공공데이터는 「물환경보전법」 제61조의2 및 시행규칙 제89조의2에 따라 수집된 정보로, 인천시 내 공공기관에 설치된 바닥분수, 물놀이터 등 수경시설의 운영 실태를 담고 있습니다. 이 데이터는 시설명, 위치, 운영자, 수경시설 종류, 연중 운영기간 등 다양한 항목으로 구성되어 있으며, 총 101개의 시설 정보가 CSV 형식으로 제공됩니다. 시민의 안전한 물놀이 환경 조성과 수질 관리 강화를 위해 활용되며, 공공데이터포털에서 누구나 무료로 다운로드할 수 있습니다. 또한 오픈 API를 통해 시스템 간 연계도 가능하여 행정기관이나 개발자들이 다양한 방식으로 활용할 수 있습니다. 이 데이터는 연 1회 갱신되며, 최신 등록일은 2025년 8월 31일입니다.
