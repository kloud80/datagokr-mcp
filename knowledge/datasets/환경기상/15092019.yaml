summary_user: 대구광역시 서구 관할 특정토양오염관리대상시설(주유소·화학 제조업체·염색공단 등)을 시설 한 곳당 한 행으로 상호와 도로명·지번 주소를 담은 시군구 단위 목록이다(CSV 약 10KB). 주민이나 부동산·개발 검토자가 '이 필지나 동네 주변에 토양오염 우려 시설이 있는가'를 확인하거나, 담당 부서가 점검 대상 위치를 파악하는 데 쓴다. 전역 조인 키나 코드가 없어서 다른 데이터와는 주소(도로명·지번)를 지오코딩하거나 이름을 맞춰 붙여야 하며, 같은 부문의 상수원보호구역·토지피복 같은 환경 규제 레이어와 함께 필지 단위 검토에 이어 쓴다.
description_portal: 대구광역시 서구 내에 있는 토양오염 관리대장 시설에 대한 현황입니다. 상호명, 소재지 지번 및 도로명주소를 포함하고 있습니다.본 데이터는 대구광역시 서구 관할 내 특정 토양오염관리대상시설 현황을 상세히 수록한 목록이다. 각 시설의 연번, 상호명, 소재지(도로명주소 및 지번주소)를 포함하여, 해당 지역 내 오염관리 대상 사업장의 정확한 위치 정보를 제공한다. 주요 시설로는 주유소, 화학 제조업체, 염색공단 등 환경오염 우려가 있는 산업시설이 포함되어 있다. 이 자료는 환경부문의 관리 및 점검 업무에 활용되며, 토양오염 예방과 관리 정책 수립에 기초자료로서 활용 가능하다. 또한, 주소 정보를 도로명과 지번으로 병기하여 이용자의 데이터 검색 및 현장 확인 편의를 도모하였다. 이를 통해 환경안전 확보와 지역 주민의 건강 보호에 기여함을 목적으로 한다.
