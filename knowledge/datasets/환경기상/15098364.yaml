summary_user: 세종특별자치시의 대형폐기물 수거 요일, 수거 위치(읍면동), 문의 전화번호를 읍면동 단위로 담은 조회 API입니다. 세종시 주민이 "우리 동네는 무슨 요일에 대형폐기물을 수거하고, 어디로 문의해야 하나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 읍면동 이름(emd)을 행정구역 이름과 맞춰 붙이는 방식으로만 이어 쓴다.
limits: 수거 일정·위치·연락처 안내 정보이며, 대형폐기물 발생량이나 처리 현황 같은 통계는 담지 않는다. 행정구역 코드가 없어 다른 지역 데이터와 묶을 때는 읍면동 이름을 직접 맞춰야 한다. 개발계정은 하루 5,000회까지 호출할 수 있다.
