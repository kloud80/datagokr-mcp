summary_user: 국립낙동강생물자원관이 확보한 담수 균계(균류) 생물자원을 자원 한 건마다 자원번호·학명·채집지·채집일·자원유형으로 담은 건별 원장 파일(CSV, 약 3.6MB)입니다. 연구자가 특정 균류 학명이 어느 지역에서 언제 채집됐는지 확인하거나, 지역별·시기별 담수 균류 자원 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 학명이나 채집지 이름을 맞춰 연결해야 하며, 같은 기관의 다른 담수생물자원 데이터와는 자원번호 체계로 이어 볼 수 있다.
description_portal: 국립낙동강생물자원관에서는 담수생물자원의 보존과 활용 촉진을 위해 담수생물자원 균계 정보를 공공데이터로 개방하고 있습니다.개방 데이터는 자원번호, 학명, 채집지, 채집일, 자원유형 등으로 구성되어 있습니다.학계·연구기관은 담수생물자원 균계의 채집지 특성, 자원유형, 발생 시기 등을 분석하여 생물다양성 연구, 생태 보전 전략 수립, 산업적 활용 소재 개발 등에 활용할 수 있습니다.교육·문화기관은 해당 데이터를 활용하여 미생물과 균류의 생태, 생물다양성, 생명과학 실험 콘텐츠 개발 및 체험활동 자료로 구성함으로써 흥미롭고 실질적인 생물자원 교육 프로그램 운영에 기여할 수 있습니다.지자체 및 관련 기관은 채집지 기반의 지역 생물다양성 정보를 바탕으로 지역 특화 균류 산업 육성, 균자원 기반 관광 콘텐츠 개발, 협력 네트워크 구축 등에 활용할 수 있습니다.
