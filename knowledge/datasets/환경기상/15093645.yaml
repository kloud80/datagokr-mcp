summary_user: 함평군 관내에서 접수된 대형폐기물 수거 건을 한 건씩 기록한 파일로, 수거일자·폐기물 구분과 품명·규격·개수·수거장소 도로명주소·행정동을 담으며 포털 설명상 2022년 1월 1일부터 2025년 4월 2일까지 2931건이다. 지자체 담당자나 분석가가 '함평군에서 어떤 가구·가전이 어느 읍면에서 언제 많이 버려지는가'를 보고 수거계획이나 민원 대응을 세울 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 행정동 이름이나 도로명주소 문자열 매칭, 또는 같은 기관(함평군) 단위로만 이어 쓴다.
description_portal: 1인 가구 증가, 생활양식 다양화 등으로 가전제품, 가구류 등 대형폐기물 배출이 꾸준히 증가하고 있으며, 이에 따라 지방자치단체의 수거계획 수립, 민원 대응, 자원순환 정책 마련을 위한 대형폐기물 정보의 체계적인 관리와 활용 수요가 증가하고 있습니다. 함평군은 2022년 1월 1일부터 2025년 4월 2일까지 관내에서 접수된 대형폐기물 수거 정보를 체계적으로 기록·관리하여 공공 데이터로 제공합니다. 개방 데이터는 다음과 같습니다. 제공 항목은 폐기물구분, 폐기물명, 규격, 개수, 수거장소, 행정동, 관리기관, 연락처 등이며  수록 건수는 2931건,  수집 기간은 2022년 1월 1일 ~ 2025년 4월 2일 입니다.
