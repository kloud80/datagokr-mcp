summary_user: 제주시 관내에서 운영 중이거나 과거에 운영된 폐기물 매립장을 시설 한 곳당 한 행으로 담고, 명칭·소재지와 매립면적·설계 매립용량·기매립량·잔여용량·사용 시작·종료 시기를 기록한 작은 파일(약 486바이트)이다. 제주시 매립장이 언제쯤 포화되는지, 남은 매립 용량이 얼마인지 확인하려는 주민·정책 담당자·환경 분석가가 쓴다. 전역 조인 키가 없어 다른 폐기물 처리시설·사업장 데이터와는 매립장 명칭이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: '본 데이터는 제주특별자치도 제주시 관내에서 운영 중이거나 과거에 운영되었던 폐기물 매립장에 대한 현황 정보를 수록한 자료입니다. 폐기물의 최종 처분을 담당하는 매립시설의 위치, 용량, 사용 이력 등을 종합적으로 제공하며, 자원순환 기반 조성과 환경영향 최소화를 위한 기초자료로 활용됩니다.주요 항목명칭: 매립장의 공식 명칭으로, 행정상 관리 대상 구분소재지: 매립장이 위치한 행정구역상의 주소매립면적: 매립장 전체의 부지 면적(㎡)매립용량: 설계상 매립이 가능한 전체 용량(㎥ 또는 톤 단위)기매립량: 현재까지 실제로 매립된 폐기물의 총량잔여용량: 향후 매립 가능한 남은 용량으로, 매립장 수명 예측에 활용사용시작기간 / 사용종료기간: 해당 매립장의 실제 사용 시작일과 종료 예정일 또는 종료일(해당 시)활용 목적이 데이터는 지역 내 폐기물 최종처리시설의 운영 현황을 파악하고, 향후 매립 가능 용량 분석, 처리계획 수립, 시설 포화 예측 및 대체 부지 검토 등 제주시의 폐기물 정책 수립에 필수적인 정보로 활용됩니다. 또한 환경영향 평가, 주민 알권리 보장, 지속 가능한 자원관리 체계 구축 등 다양한 공공 목적에도 활용됩니다. 본 자료는 제주시청에서 정기적으로 점검·관리하며, 최신 정보를 반영하여 공공데이터로 제공됩니다.'
