summary_user: 충청남도 전역에서 포획된 유해야생동물(주로 야생멧돼지)의 포획 기록을 격자 단위로 모아 격자별 좌표(카텍좌표), 발생연월, 대표 지목, 포획건수를 담은 파일 데이터다. 지자체 담당자나 분석가가 '충남에서 멧돼지 포획이 어느 지역·어떤 토지 유형(지목)에 몰리고 월별로 어떻게 변하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 격자 좌표를 공간 결합하거나 대표 지목 코드·이름 매핑으로만 다른 자료(토지이용·행정구역 경계 등)와 이어 쓴다.
limits: 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어, 다른 데이터와 붙이려면 카텍좌표를 변환해 공간 결합하거나 이름·코드 매핑을 직접 해야 한다. 범위는 충청남도 한 시도에 한정된다.
