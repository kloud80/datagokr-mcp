description_portal: 본 데이터는 대기 환경 보전을 위해 설정된 법적 환경 기준 정보이다. 미세먼지, 초미세먼지, 오존, 이산화질소, 이산화황 등 각 대기 오염 물질별 환경 기준 농도 및 적용 기간을 포함한다. 환경 기준은 국민 건강 보호와 쾌적한 환경 조성을 위해 유지되어야 할 대기질 목표 수준을 제시한다. 해당 자료는 대기 환경 정책 수립, 오염원 관리 목표 설정, 환경 영향 평가에 활용된다. 시민들이 대기 오염 물질의 위해성 및 환경 기준을 이해하고 대기질 측정 자료를 올바르게 해석하는 데 도움을 준다. 또한 사업장의 배출 허용 기준 준수 여부 판단 및 환경 관리 계획 수립에 필요한 기준 정보를 제공하며, 환경 정책 목표 달성도 평가에 활용된다.
