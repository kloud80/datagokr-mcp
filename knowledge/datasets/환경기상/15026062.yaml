summary_user: 부산광역시 수영구에 있는 대기·수질 등 환경오염 배출시설을 업체 한 곳당 한 행으로 담은 원장 파일로, 구군명·업체명·도로명주소·업종·전화번호·위도·경도를 포함한다. 주민이나 분석가가 '우리 동네 주변에 어떤 업종의 배출사업장이 어디에 모여 있는가'를 확인하거나, 좌표로 오염원 밀집 지역을 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명·도로명주소 같은 이름 매칭이나 위도·경도 기반 공간 결합으로 이어 쓴다.
limits: 수영구 한 곳의 시설만 담고 있어 부산 전체나 다른 구와 비교하려면 구별 파일을 따로 모아야 한다. 사업자번호 같은 공통 키가 없어 인허가·배출량 데이터와 붙일 때 업체명·주소 매칭 오류에 주의해야 한다. 배출량이나 오염물질 종류는 들어 있지 않다.
