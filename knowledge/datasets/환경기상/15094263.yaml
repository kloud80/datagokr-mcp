summary_user: 충청남도 예산군에서 음식물쓰레기를 다량으로 배출하는 사업장을 한 행에 한 곳씩 담은 파일(CSV 약 18KB)로, 상호·대표자·도로명주소·사업장 구분·규모와 월·연 배출 예상량을 담는다. 수거·운반 업체나 군 담당자가 예산군 안에서 음식물쓰레기를 많이 내는 곳이 어디이고 각각 얼마나 배출할 것으로 예상되는지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명주소를 맞추거나, 인허가관리번호로 같은 기관의 인허가 자료와 이어 써야 한다.
description_portal: 충청남도 예산군_음식물쓰레기 다량배출사업장” 데이터는 예산군  음식물쓰레기를 다량으로 배출하는 업체에 대한 현황을 제공하며, 환경 모니터링, 자원순환체계 구축에 활용되는 중요한 환경 행정 데이터입니다.이 데이터는 충청남도 예산군 내 음식물쓰레기를 다량 배출하는 사업장의 현황을 정리한 환경 행정 데이터입니다.이 데이터는 음식물쓰레기 감량 정책 수립, 수거·운반 대행업체 관리, 재활용 처리계획 수립, 자원순환 체계 설계, 환경영향평가 및 모니터링 등에 유용하게 활용됩니다.공공데이터포털을 통해 누구나 열람 및 재활용이 가능합니다.
