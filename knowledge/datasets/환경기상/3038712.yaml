summary_user: 경기도 구리시 안의 폐수·축산폐수 배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 허가·신고번호와 일자, 상호, 소재지와 위도·경도, 업종·종별, 하루 폐수 발생량·처리시설 용량·방류량을 기록한다. 구리시에 있는 폐수 배출 사업장의 위치와 규모를 확인하려는 주민이나 하천 수질 오염원 분포를 지도로 살펴보려는 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호·소재지 같은 이름이나 주소를 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 공공데이터로 제공되는 폐수 및 축산폐수 배출시설 현황 데이터는 수질 환경을 보호하기 위해 수질오염물질을 배출하는 사업장과 축산 농가의 시설 설치·운영 상태를 관리하는 자료입니다.대기 배출시설 데이터와는 관리 법규와 오염 물질의 특성이 다르므로, 그 차이점을 중심으로 상세히 설명해 드립니다.
