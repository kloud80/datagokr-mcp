summary_user: 김포시 안에서 실내공기질 관리법 적용을 받는 다중이용시설을 한 시설당 한 행으로 담은 목록이며, 시설구분·시설명·도로명주소·전화번호·연면적·데이터기준일자를 포함한다. 주민이나 분석가가 '우리 동네에 실내공기질 관리 대상인 어린이집·대규모점포 같은 시설이 어디에 몇 곳 있나'를 확인하거나 읍면동별 분포를 볼 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 시설명이나 도로명주소를 맞춰 붙이거나, 주소를 지오코딩해 실내공기질 측정 결과·주변 대기질 측정소 자료와 위치 기준으로 겹쳐 쓴다.
description_portal: 경기도 김포시의 실내공기질 관리법 적용대상 다중이용시설 현황에 대한 정보를 제공합니다. 제공 항목으로는 시군명, 시설구분, 시설명, 소재지도로명주소, 전화번호, 연면적으로 구성되어있습니다. 본 데이터를 통해 각 읍면동별 실내공기질 관리법 적용 대상 다중이용시설 분포 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 기후에너지과로 연락주시기 바랍니다.
