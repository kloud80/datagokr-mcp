description_portal: 인천광역시 인천데이터포털의 보호수 정보를 제공하고 있습니다.인천 시민들을 위한 보호수 공공데이터는 역사적, 학술적 가치가 높아 특별히 관리되는 나무들의 정보를 담고 있습니다.이 데이터는 소중한 자연유산을 보존하고, 시민들이 보호수를 쉽게 찾아보고 그 가치를 느낄 수 있도록 돕는 유용한 자료입니다.주요정보1. 지정번호2. 보호수지정일자3. 보호수 유형명(노목, 거목, 희귀목 등)4. 과명(느티나무, 소나무, 팽나무, 은행나무과,  느릅나무과 등)5. 나무종류명6. 연령, 높이, 등7. 지목명(임야, 대, 학교용지 등)8. 소유자 구분이 데이터는 체계적인 보호 저액을 수립하고, 나무의 건강상태를 추적하는 데에도 중요한 정보입니다.
