summary_user: 충청남도 청양군 관내 측정소별로 날짜마다 미세먼지(PM10)와 초미세먼지(PM2.5) 농도를 기록한 CSV 파일(약 62KB)이다. 청양군 주민이나 지역 분석가가 "청양 읍내 측정소의 초미세먼지가 특정 기간에 얼마나 높았나"처럼 지역 대기질 추이를 확인할 때 쓴다. 전역 조인 키가 없어 에어코리아 측정소 자료 등과는 측정소명이나 날짜를 이름 기준으로 맞춰 이어 쓴다.
