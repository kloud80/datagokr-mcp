summary_user: 부산광역시 북구 관내에 등록된 쓰레기 종량제봉투 판매소를 한 곳씩 담은 건별 목록으로, 판매소명·사업장 주소와 위도·경도를 제공한다. 북구 주민이 '집 근처에서 종량제봉투를 어디서 살 수 있나'를 찾거나, 분석가가 판매소 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 좌표로 맞춰 이어 쓰며, 다른 지자체의 판매소 파일과는 판매소명·주소 기준으로 합쳐 쓴다.
