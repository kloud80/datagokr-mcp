description_portal: '관악구 관내에 설치된 네프론 장비에서 수거한 캔 및 페트병 수거량 통계  - 네프론 설치위치 :  중앙동동주민센터(양녕로6다길 7), 신원동동주민센터(남부순환로 1540), 대학동동주민센터(신림로 111), 행운동동주민센터(행운1길 43), 신림동동주민센터(신림동길 14), 신사동동주민센터(조원로 142), 은천동동주민센터(봉천로33나길 30), 삼성동동자치회관(호암로 520), 인헌동밤골경로당(인헌3가길 8), 미성동미성경로당(난곡로58길 11), 관악청년청(남부순환로 1759)본 데이터는 서울특별시 관악구 네프론(순환자원 회수기) 수거량 현황을 정리한 자료입니다. ▲시군구 ▲시도 ▲통계월 ▲캔 ▲페트 ▲수거량 합계 ▲이용자수 ▲관리기관명 항목으로 구성되어 있으며, 월별로 관악구 내 재활용품 회수 규모와 이용 참여도를 파악할 수 있습니다. 특히 기간에 따라 캔·페트 수거량 변화 추세, 이용자 증가 여부 등을 확인할 수 있어 순환자원 회수 체계의 운영 상황을 이해하는 데 도움이 됩니다. 또한 행정적으로는 재활용 정책 추진 시 참고자료로 활용할 수 있는 기초 데이터를 제공합니다.'
