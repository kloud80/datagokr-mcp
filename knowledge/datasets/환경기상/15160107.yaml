description_portal: '○ 개요서울특별시 25개 자치구의 소규모 대기배출사업장(4종·5종)을 대상으로, 한국표준산업분류(KSIC 10차) 업종별 대기오염물질 배출량을 집계한 통계입니다. 2021년 국가대기오염물질배출량통계(CAPSS) 기반으로 산정되었으며, 배출량 단위는 kg/년입니다.○ 집계 단위공간: 자치구 (25개 자치구명)분류: 한국표준산업분류(KSIC) 10차 업종명 (47개 업종) 및 사업장 구분 (4종·5종)○ 수록 오염물질PM10, PM2.5, NOx, SOx, VOCs○ 대상 사업장 범위4종: 연간 대기오염물질 발생량 2톤 이상 ~ 10톤 미만5종: 연간 대기오염물질 발생량 2톤 미만※ 1~3종 대형 사업장은 포함되지 않습니다.○ 주요 한계- 대형 사업장(1~3종) 배출량을 포함하지 않았기 때문에 서울시 전체 대기오염물질 배출시설의 배출량으로 판단해서는 안됨- 자치구·업종 단위 집계값만 제공 (개별 사업장 정보 비식별화)- 국가 배출량을 기업 정보 기준으로 재분배한 추정치'
