summary_user: 서울특별시 안에서 식생이 양호한 산지의 개발을 제한하려고 지정한 도시자연공원구역의 경계를 구역 도형 단위로 담은 공간정보이며, 좌표계는 EPSG:5174(Bessel TM)이고 도형별 면적·길이와 지정 고시 관리코드를 함께 담는다. 토지 매입이나 건축을 검토하는 사업자·분석가가 '이 필지가 도시자연공원구역에 걸려 개발이 제한되는가'를 확인할 때 필지에 겹치는 규제 레이어로 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 시군구 코드(SGG_CD)나 이름·코드 매핑으로만 연결하고, 필지와는 공간 중첩으로 잇는다.
description_portal: 서울특별시 도시자연공원구역 공간정보.도시의 자연환경 및 경관을 보호하고 도시민에게 건전한 여가·휴식공간을 제공하기 위하여 도시지역 안에서 식생(植生)이 양호한 산지(山地)의 개발을 제한할 필요가 있는 경우 설정하는 「국토의 계획 및 이용에 관한 법률」에 의한 용도구역의 하나이다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
