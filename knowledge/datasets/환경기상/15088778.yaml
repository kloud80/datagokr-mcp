description_portal: 한국가스공사 평택기지본부 2부두에 설치된 접안보조설비에서 취득한 해상환경 데이터(풍향, 풍속, 파고, 파향 등) 입니다.LNG 운반선의 안전한 접안과 하역 작업을 위해서는 실시간 해상 기상 정보 파악이 필수적이며, 이 데이터는 해상 작업 안전 관리의 핵심 자료로 활용됩니다. 본 데이터는 LNG선 접안 안전성 확보 및 하역 작업 계획 수립을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 풍향, 풍속, 파고, 파향, 조류 속도 등 해상환경 측정값이 시간대별로 포함되어 있습니다. 본 데이터를 활용하면 LNG선 접안 가부 판단 기준 수립, 하역 작업 안전 관리 및 일정 계획, 해상환경과 LNG 생산량 상관관계 분석, 항만 운영 효율화 연구에 기초자료로 활용할 수 있어 LNG 인수기지 운영 안전성 향상과 해상 작업 효율화에 기여할 것으로 기대됩니다.
