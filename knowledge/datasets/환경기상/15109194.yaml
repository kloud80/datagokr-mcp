summary_user: 제주시 재활용도움센터의 위치와 운영 정보를 센터 한 곳당 한 건으로 담는 API로, 읍면동명·도로명주소·위도·경도 좌표·운영시간·설치일자를 제공한다. 제주시 주민이 집 근처 재활용도움센터가 어디 있고 몇 시에 여는지 찾거나, 분석가가 읍면동별 센터 배치를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 읍면동명(emdNm)·주소 문자열이나 좌표로 맞춰 이어야 하며, 다른 지자체의 재활용 정거장·수거함 파일과 함께 쓸 때도 이름·위치 매핑이 필요하다.
limits: 범위는 제주시 한 곳이며, 배출량·처리현황 같은 폐기물 통계는 담지 않는다. 공통 행정코드 등 조인 키가 없어 다른 데이터와의 연결은 이름·주소·좌표 매핑에 의존한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
