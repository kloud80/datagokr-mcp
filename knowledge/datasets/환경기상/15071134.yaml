summary_user: 한국지역난방공사 지사별 굴뚝에 설치된 배출가스 자동측정시설(TMS)의 현황을 굴뚝·측정항목 단위로 담은 설비 목록 파일로, 측정방법·제조업체·제조국가·설치년도·모델명을 함께 기록한다. 환경 분석가나 설비 담당자가 '어느 지사 굴뚝에서 질소산화물 같은 항목을 어떤 방식과 장비로 측정하고, 장비는 언제 설치됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지사명·굴뚝명 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
limits: 측정 농도값이나 시간별 배출량은 없고 설비 현황만 담으므로 실시간 대기질 분석에는 쓰지 못한다. 공용 코드가 없어 에어코리아 측정소 등 외부 자료와의 연결은 이름 대조에 의존해야 한다.
