description_portal: '서울특별시 마포구에 설치된 공공 태양열 시설 현황에 대한 정보입니다. 이 데이터에는 각 태양열 시설이 위치한 구체적인 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 도로명 주소, 시설명과 집열부유형(예: 진공관형 등), 집열기 면적(단위: m2), 축열조용량(단위: 톤), 설치연도에 대한 정보가 포함되어 있습니다. 이 데이터를 통해 주민과 행정기관은 공공시설 내 친환경 에너지 활용 현황을 쉽게 확인할 수 있습니다. 또한 공공 태양열 시설의 설치 분포와 에너지 생산 실적을 종합적으로 파악할 수 있습니다. 이를 바탕으로 친환경 에너지 보급 확대 정책 수립 및 효율적인 에너지 관리가 가능하며, 설치 용량 대비 생산량 분석을 통해 시설 성능 향상 및 유지보수 계획을 수립할 수 있습니다.'
