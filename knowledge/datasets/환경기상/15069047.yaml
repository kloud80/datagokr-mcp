summary_user: 해양환경측정망으로 조사한 전국 연안의 해수 수질을 조사년도·해역·연안별 평균값으로 정리한 집계 파일로, 수온·염분·수소이온농도·용존산소·화학적산소요구량·질소·인·규산규소·부유물질·클로로필을 표층과 저층으로 나눠 담고 투명도를 함께 담는다(CSV 약 10KB). 연구자나 해양환경 정책 담당자가 "특정 연안의 총질소·총인 평균이 해마다 어떻게 변했고 다른 연안과 비교해 어떤가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 연안명칭·해역 이름을 맞추거나 조사년도로만 이어 쓴다.
