description_portal: 해양환경공단이 운영하는 해양환경측정망을 통해 수집된 연안 해역의 평균 해수 수질 정보를 제공합니다. 본 데이터는 전국 주요 연안 지역의 해수에 대해 생물화학적 산소요구량(BOD), 화학적 산소요구량(COD), 총인(T-P), 총질소(T-N), 용존산소(DO), 수온, 염분 등의 항목을 포함하고 있으며, 계절별 또는 연도별로 정리되어 수질의 시계열 변화를 확인할 수 있습니다. 수질 항목별 평균값을 통해 연안 해역의 수질 특성을 비교·분석할 수 있도록 구성되어 있으며, 환경 변화 모니터링, 해양생태계 보전 정책 수립, 해양 오염 예측 모델 개발 등에 활용됩니다. 데이터는 표 형식으로 제공되며, 공공기관 및 연구기관의 해양환경 관리에 기초자료로 활용됩니다.
