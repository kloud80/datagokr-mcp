description_portal: 국립공원공단_다도해해상국립공원 서식환경 현황 데이터는 다도해해상국립공원 내 서식환경에 대한 공간적 분포와 현황 정보를 담고 있으며, 생성 연도 기준으로 관리됩니다. 본 데이터는 환경분류, 지점명, 지점위치, 지점주소, 경도·위도 좌표 등으로 구성되어 있으며, 서식환경 유형은 식생, 점오염원, 비점오염원, 로드킬 구간, 생태통로, 훼손지 등으로 세분화됩니다. 공간정보(GIS) 데이터도 별도로 제공되어 분석 및 시각화에 활용할 수 있습니다. 서식환경의 위치 정보를 담은 공간정보(SHP) 파일을 함께 제공하여 정밀한 분석과 지도 시각화에 활용 가능합니다.
