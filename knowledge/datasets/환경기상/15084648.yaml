summary_user: 서울 성동구가 대기오염 저감을 위해 지정한 공회전 제한구역을 장소 한 곳당 한 행으로 담은 작은 CSV 파일(약 4.6KB)이며, 구분·장소명·주소·비고 항목으로 구역의 성격과 위치를 적는다. 주민이나 운수 사업자가 "우리 동네 버스 차고지나 학교 주변이 공회전 제한구역인가"를 확인하거나, 행정·연구자가 구 내 공회전 제한 정책의 적용 범위를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소 문자열을 지오코딩하거나 장소명을 맞춰 대기질 측정소·버스 차고지 자료 등과 이어 써야 한다.
