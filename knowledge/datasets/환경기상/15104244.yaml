summary_user: 인천광역시 안에 있는 환경전문공사업체를 업체 한 곳당 한 행으로 담은 CSV 파일로, 업체명·분야(수질·대기 등)·전화번호·영업소 소재지를 담는다. 수질·대기 방지시설 공사를 맡길 지역 업체를 찾는 사업자나, 인천 지역 환경산업체의 분야별·지역별 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰서만 이을 수 있다.
description_portal: '1. 데이터명: 인천광역시 환경전문공사업 현황2. 구성항목: 상호, 분야, 전화번호, 영업소소재지 등3. 데이터 관리 부서: 인천광역시 환경안전과4. 데이터설명:인천광역시 환경전문공사업 현황 공공데이터는 지역 내 환경 관련 전문 공사업체의 정보를 제공합니다. 주요 항목으로는 상호명, 분야(수질, 대기 등), 전화번호, 영업소소재지 등으로 구성되어 있으며, 환경산업체의 분포와 특성을 파악하는 데 활용됩니다. 해당 데이터는 CSV 파일형식으로 제공되며, 공공데이터포털에서 무료로 다운로드할 수 있습니다.'
