summary_user: 광주 광산구 관내 약국·보건소·경로당·행정복지센터·복지관 등에 설치된 폐의약품 수거함을 설치장소 한 곳당 한 행으로 담은 파일로, 구분·설치장소명·주소·위도·경도·전화번호를 포함한다. 주민이 집 근처에서 남은 약을 어디에 버릴 수 있는지 찾거나, 보건행정 담당자가 수거함 분포를 지도에 올려 관리 공백 지역을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 결합하거나 시군구명으로 다른 지자체의 같은 종류 파일과 묶어 쓴다.
