description_portal: 대구광역시 남구청에서 관리하는 실내공기질관리대상시설에 관한 정보를 제공하는 자료입니다.데이터 항목은 실내공기질 관리대상시설의 시설군, 시설명, 소재지도로명주소, 위도, 경도로 구성되어 있습니다.해당 데이터는 실내 공기질 관리 대상 시설의 현황을 쉽게 확인하여, 실내 공기질 개선을 위한 정책 결정 및 관리에 도움이 될 수 있으며,이를 통해 환경개선에 필요한 조치를 신속하게 취할 수 있도록 지원합니다.또한, 시민들이 주변 공공시설의 실내환경 상태를 쉽게 확인할 수 있도록 지원합니다.
