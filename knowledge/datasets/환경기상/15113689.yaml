summary_user: 대전광역시 중구에 있는 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 목록 파일로, 상호·전화번호·도로명주소·업종 구분(일반음식점·집단급식소 등)·월/연 배출 예상량·위탁처리 방법(사료퇴비재생·축산농가활용·자가감량)을 담는다(csv 약 21KB). 중구 주민이나 음식물 처리·수거 사업자가 '우리 동네에서 음식물쓰레기를 많이 내는 음식점·급식소는 어디이고 어떻게 처리하나'를 확인하거나, 분석가가 업종별 배출 예상량을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 상호를 매칭하거나 같은 중구 기관의 다른 폐기물 파일과 나란히 놓고 쓴다.
description_portal: 대전광역시 중구 내에 위치한 사업장 중 음식물류폐기물 다량배출사업장 현황에 관한 자료이며, 연간 갱신되는 자료입니다.○ 음식물류폐기물 다량배출사업장 업종은 일반(휴게)음식점, 집단급식소 등이 있습니다.○ 음식물류폐기물 다량배출사업장은 상시로 신고 및 변경신고가 가능합니다.○ 사업장폐기물 배출자의 경우 다량배출사업장에서 제외됩니다.○ 음식물류폐기물 위탁처리 방법은 사료퇴비재생, 축산농가활용, 자가감량으로 구분됩니다.○ 개인정보가 기재된 항목의 경우 정보 미제공되며, 이외 데이터 요청 시 기후환경과로 정보공개청구 바랍니다.
legal_basis_portal: 음식물류 폐기물 다량배출사업장(일 식수인원이 200명 이상인 집단급식소, 영업장 면적이 200㎡ 이상인 일반음식점(휴게음식점의 경우 1,000㎡))의 경우, 기후환경과로 사업장 신고를 진행하여야합니다.
