description_portal: 경기도 군포시 관내의 석면조사 대상건축물 현황 데이터로 번호,구분, 건축물명(상호), 소재지, 데이터기준일자 항목을 제공합니다. 석면안전관리법 시행령 [별표 1의2]에 따라 공공기관이 소유 및 사용하는 건축물, 어린이집, 불특정 다수인이 이용하는 시설(지하역사, 지하도상가, 철도역사, 대합실,도서관, 박물관, 미술관, 의료기관, 산후조리원, 노인요양시설, 대규모점포, 장례식장,영화상영관, 학원, 전시시설, 인터넷컴퓨터게임시설제공업의 영업시설, 실내주차장, 목욕장 등)이 법정 대상 시설물에 포함됩니다. 불특정 다수인이 이용하는 시설의 경우 연면적 기준이 시설별로 상이합니다. 석면조사 결과 50제곱미터 이상의 석면이 있는 경우 석면건축물로 관리하게 됩니다.
