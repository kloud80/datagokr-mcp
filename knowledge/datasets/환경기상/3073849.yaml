summary_user: 경기도 군포시 관내에서 석면조사 대상이 되는 건축물을 한 건씩 담은 파일로, 시설 구분·건축물명(상호)·소재지주소·데이터기준일자를 개별 주소 단위로 제공한다. 주민이나 학부모가 '우리 동네 어린이집·학원·의료기관 같은 시설이 석면조사 대상인가'를 확인하거나, 분석가가 군포시 다중이용시설의 석면 관리 대상 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지주소나 건축물명을 맞춰 연결해야 하며, 주소를 좌표로 바꾸면 건축물대장이나 다른 시설 목록과 대조할 수 있다.
limits: 군포시 한 곳만 다루므로 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다. 사업자번호나 건물 고유번호 같은 공통 키가 없어 이름·주소 매칭에 의존하며, 이때 매칭 오류가 생길 수 있다.
