summary_user: 전국 지자체가 관리하는 대기오염물질 배출시설 설치 사업장의 인허가 정보를 사업장 단위 건별로 담으며, API 전체 140,104건이다. 사업자나 분석가가 특정 지역에 배출시설을 설치한 사업장이 어디에 있고 영업 중인지 폐업했는지 확인하는 질문에 쓴다. 사업자등록번호(bizno)로 기업 단위 데이터와, 지번·도로명 주소(address)로 주소 기반 데이터와 이어 쓴다.
description_portal: '자원환경_대기오염물질배출시설설치사업장 데이터는 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 지방자치단체에서 관리하는 대기오염물질배출시설설치사업장 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 대기관리과 / 044-201-6905 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
