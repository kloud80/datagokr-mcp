description_portal: 이 데이터는 양변기(변기) 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 총 200개의 이미지 파일과 이에 대응하는 200개의 라벨링 텍스트 파일로 구성되어 있으며, ‘images’ 폴더와 ‘labels’ 폴더에 각각 저장되어 있습니다. 이미지에는 다양한 형태, 크기의 양변기가 포함되어 있으며, 가정이나 상업 공간 등 실내 환경에서 다양한 각도와 거리에서 촬영되었습니다. 라벨링 텍스트 파일은 YOLO 형식으로 작성되었으며, 각 양변기 객체의 위치 정보와 클래스명이 좌표값 형태로 기록되어 있습니다. 전체 데이터는 객체 탐지 및 분류 모델 학습에 활용될 수 있도록 일관된 파일 구성과 명명 규칙을 따르고 있습니다.
