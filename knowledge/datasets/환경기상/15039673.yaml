summary_user: 평택시 안에서 실내공기질 관리법 적용을 받는 다중이용시설을 시설 한 곳당 한 행으로 담은 목록 파일(csv, 약 22KB)입니다. 시설구분·시설명·도로명주소·전화번호·연면적이 들어 있습니다. 시민이나 분석가가 "평택시에서 실내공기질 관리 대상인 지하역사·터미널 대합실 같은 시설이 어디에 몇 곳 있고 규모가 어떤가"를 확인할 때 쓰며, 다른 데이터와 맞출 공통 조인 키는 없어 도로명주소나 시설명을 매칭해 이어 씁니다.
description_portal: '경기도 평택시 실내공기질 관리법 적용 대상 다중이용시설 현황에 대한 정보로 시설구분, 시설명, 도로명주소, 전화번호, 연면적 등의 데이터를 제공합니다.실내공기질 관리법에 따른 다중이용시설은 지하역사, 지하도상가, 철도역 대합실, 여객자동차터미널 대합실, 항만 시설 대합실, 공항 여객터미널 등 다양한 시설을 포함합니다. 이 시설들은 연면적 기준 또는 시설의 종류에 따라 관리 대상이 되며, 쾌적한 실내 환경을 유지하기 위해 주기적인 측정, 관리, 개선 조치 등을 통해 실내 공기질을 유지합니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 환경정책과(031-8024-3738)'
