description_portal: 경상북도 구미시 읍면동별 물 관련 취약계층 인구수에 대한 자료입니다. 구미시의 상수도 보급률을 99.8%로 매우 높은 수준이며, 일부 읍면 지역에는 마을상수도나 소규모 급수시설을 통해 지하수 또한 공급하고 있습니다. 본 자료는 2025년 상수도 통계가 공표되지 않은 관계로 2024년 자료를 기준으로 작성되었으며, 상수도 관련 통계는 연 단위로 집계됨을 일려드립니다. 따라서 이번 통계는 구미시의 물 복지 현황을 진단하고 향후 정책 수립을 위한 기초자료로 활용될 수 있을 것입니다.(현재 구미시에서는 물 관련 취약계층을 대상으로 한 별도의 복지사업이나 지원활동을 시행되지 않고 있습니다,)
