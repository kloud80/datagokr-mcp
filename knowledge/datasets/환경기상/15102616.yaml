summary_user: 인천광역시 부평구에서 음식물류 폐기물을 수집·운반하는 업체의 이름, 도로명 소재지, 수거담당구역(행정동 단위 구역), 연락처를 업체 단위로 담은 594바이트 분량의 작은 CSV 파일이다. 부평구 주민이 우리 동 음식물 쓰레기가 수거되지 않았을 때 어느 업체에 연락해야 하는지 확인하거나, 구청 담당자가 구역별 책임 업체를 점검할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 수거담당구역의 동 이름을 행정동 명칭과 맞추는 식의 이름 매핑으로만 연결한다.
description_portal: '부평구 내 음식물류 폐기물 수집·운반을 수행하는 업체의 명칭, 소재지, 담당 구역, 연락처 정보를 수록한 자료생활폐기물 중 음식물류 폐기물의 구역별 수거체계 운영 현황을 파악하고, 수거 품질 향상 및 행정관리 기초자료로 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 수집운반업체의 지역별 구분 및 역할 관리– 음식물류 폐기물의 효율적인 수거 체계 유지– 민원 발생 시 책임구역 및 연락처 확인 기반 마련– 폐기물 관련 행정계획 수립 및 업체 운영 실태 점검주요 항목 설명● 업체명: 수거·운반을 수행하는 업체의 명칭● 소재지: 업체의 도로명 주소 기준 위치 정보● 수거담당구역: 해당 업체가 책임지는 행정구역 또는 동별 구역● 연락처: 업체 문의 및 민원 대응을 위한 연락 정보'
