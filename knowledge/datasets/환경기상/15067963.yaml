description_portal: 본 데이터는 토양 오염을 방지하기 위해 규제하는 물질의 허용기준과 대책기 준을 토양의 용도에 따라 3개 지역으로 구분하여 제공하며, 카드뮴(Cd), 구리(Cu), 비소(As), 수은(Hg), 납(Pb) 등 주요 중금속 오염물질별 우려기준 및 대책기준을 상세한 수치로 제시합니다. 특히  농업지(전·답·과수원 등), 임야 및 수도용지, 도로·철도용지 등 각 지역별로 오염 정도의 허용기준이 다르며, 이를 통해 지역별 맞춤형 토양 오염 예방 및 관리정책 수립, 토양정화 및 오염물질 관리 기술 개발과 환경영향평가 수행을 위한 과학적 근거자료로 폭넓게 활용할 수 있습니다.
