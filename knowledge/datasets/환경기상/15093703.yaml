summary_user: 유해화학물질 취급시설 검사에서 쓰는 검사항목을 대분류·중분류·검사문항 체계로 나누고, 각 항목에 검사방법·시설유형·버전·사용여부·순서를 붙인 코드성 분류표로, 약 14KB 크기의 CSV 파일 한 개에 전국 공통 기준으로 담겨 있다. 취급시설 사업자나 검사 담당자가 "우리 시설 유형에는 어떤 검사항목이 어떤 방법으로 적용되는가"를 확인하거나, 분석가가 검사 결과 데이터의 항목 코드를 이름으로 풀 때 쓴다. 다른 데이터셋과 공통으로 맞출 전역 조인 키는 없고, 같은 기관의 검사 관련 데이터와 검사항목 중분류 아이디·시설타입 아이디 같은 내부 코드나 항목명으로만 이어 쓴다.
description_portal: 유해화학물질 취급시설 관리시스템에서 검사항목은 대분류, 중분류, 그리고 구체적인 검사문항으로 체계적으로 분류됩니다.검사항목대분류는 전체 검사 항목을 큰 범주로 구분하여 나눈 것들입니다. 중분류는 대분류를 세분화한 카테고리입니다.검사문항은 실제 현장에서 점검하는 구체적인 항목들을 의미합니다.검사방법은 각각의 검사문항을 수행하는 절차나 기술을 지칭합니다.각각의 시설별로 적용되는 검사항목과 검사 방법 등에 대한 분류가 있으니 해당 내용을 참고하여 주시기 바랍니다.
