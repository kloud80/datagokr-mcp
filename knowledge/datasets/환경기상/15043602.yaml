description_portal: 천리안위성1호(COMS)는 한반도, 한반도지역, 아시아, 확장북반구, 전구영역의 적외1, 적외2, 수증기, 단파적외, 가시영상을 바이너리, 이미지, HDF 형식으로 제공합니다.천리안위성 1호 기상탑재체는 1개의 가시채널과 4개의 적외채널을 통해 24시간 기상관측을 수행하였습니다. 태양에 반사된 빛의 양을 측정하는 가시영상과 밤낮에 관계없이 지구표면이나 구름에서 방출되는 복사량으로 얻어지는 온도정보를 영상화한 적외영상을 통해 다양한 위성자료를 생산하였습니다.천리안위성 1호는 기상관측 임무는 종료하였으나 관측한 자료는 다운로드 받을 수 있습니다.
