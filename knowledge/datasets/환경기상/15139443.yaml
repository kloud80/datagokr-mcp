summary_user: 기상청이 레윈존데를 기구에 매달아 띄워 지상부터 30km 이상 상공까지 관측한 기압·기온·습도·풍향풍속 고층기상 자료를 관측 시각·지점별로 담는 원천 관측 데이터다. 예보·연구 분석가가 특정 날 태풍이나 집중호우 전후 상층 대기의 기온·습도·바람 연직 구조가 어땠는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 기상 관측 자료와는 지점 이름이나 기상청 관측지점번호 같은 같은 기관 코드로 맞춰 연결해야 한다.
