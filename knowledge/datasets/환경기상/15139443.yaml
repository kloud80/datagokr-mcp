description_portal: '레윈존데를 기구에 매달아 비양시켜 지상으로부터 30km이상 상공까지 일정한 시간 간격으로 대기상태를 직 · 간접적으로 관측합니다. 관측자료는 무선 송수신장치를 통해 지상으로 전송되고 지상 수신장치에서 처리됩니다.기상청은 일 2회~4회 정기 고층기상관측(3시, 9시 ,15시, 18시)을 수행합니다.생산주기: 6시간(일 4회, 기간에 따라 생산주기가 상이함)보유기간: 1957년 4월 ~ 현재(지점별 상이함)(참고) 포항, 백령도, 강릉, 흑산도, 국가태풍센터, 창원, 덕적도, 안마도에서 지상으로부터 30km이상 상공까지의 기압, 기온, 습도, 풍향풍속을 레윈존데로 하루 4회(오전3시, 오전9시, 오후3시, 오후9시) 관측하고 있습니다.'
