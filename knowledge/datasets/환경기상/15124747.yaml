description_portal: 대전광역시 5등급 운행차 단속카메라 설치 현황 자료는 고농도 미세먼지 저감을 위해 배출가스 5등급 자동차의 운행을 제한하고, 이를 상시 단속하기 위해 주요 도로에 설치된 무인 단속카메라의 위치와 운영 현황을 제공합니다. 대전시는 총 20개소에 40대의 단속카메라를 설치하여, 5등급 차량 운행 제한을 상시 모니터링하고 위반 시 과태료를 부과하고 있습니다. 시민들에게 단속카메라 설치 지점 현황을 공개하여, 미세먼지 저감 정책의 투명성을 높이고 대기 환경 개선에 기여하고 있습니다. 이 자료는 환경 정책 수립, 단속 효과 분석, 시민 안내 등 다양한 행정적·정책적 활용이 가능하며, 단속카메라의 설치 위치, 대수, 운영 방식 등 구체적인 정보를 포함하고 있습니다.
