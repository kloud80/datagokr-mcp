summary_user: 전국 기초지자체별로 설치된 RFID 기반 음식물쓰레기 종량기(개별계량장비) 대수와 이를 통해 관리되는 추정 세대수를 담은 집계 파일이다. 지자체 담당자나 연구자가 "우리 시군구는 다른 지역보다 RFID 종량기 보급이 얼마나 되어 있나"를 비교하거나 설치 확대 계획을 세울 때 쓴다. 전역 조인 키(행정코드)가 없어 광역·기초지자체 이름을 행정구역 코드표에 매핑해야 인구·세대 통계 등 다른 데이터와 이을 수 있다.
description_portal: 본 데이터는 음식물쓰레기 종량제 정책의 일환으로 시행 중인 RFID 기반 음식물쓰레기 종량기 설치 현황을 자치단체별로 제공하는 자료입니다. 각 기초지자체별 설치된 종량기 대수와 이를 통해 관리되는 추정 세대수를 포함하고 있어 지역별 음식물쓰레기 배출 관리 현황을 한눈에 파악할 수 있습니다. 이 데이터는 지방자치단체가 음식물쓰레기 감량 정책의 성과를 평가하거나 설치 확대 계획을 수립하는 데 활용할 수 있으며 연구자와 시민은 지역 간 음식물쓰레기 관리 수준 비교와 스마트 자원순환 정책 효과 분석에 활용할 수 있습니다. 또한 기업에게는 관련 기술 및 장비 수요를 예측하는 기초자료가 될 수 있습니다.
