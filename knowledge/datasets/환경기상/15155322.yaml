summary_user: 경기도 내 사업장이 대기배출시설을 설치한 뒤 낸 가동개시 신고를 건별로 담으며, 사업장명·업종·산업단지·관할관청·신청일·처리상태와 배출시설·방지시설별 가동개시 예정일과 시운전 시작·종료일을 포함한다. 지자체 환경 담당자나 분석가가 '어느 산업단지에서 최근 대기배출시설 가동개시 신고가 몰리고, 방지시설 시운전이 배출시설과 함께 진행됐는가'를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 사업자등록번호(bizregno)나 사업장명·업종코드·산업단지명을 이름·코드 매칭해 다른 배출시설·인허가 사업장 자료와 잇는다.
description_portal: 이 데이터는 사업장이 대기배출시설을 설치하고 제출한 가동개시신고 내역을 수록한 자료입니다. 주요 항목으로는 사업장명, 업종코드 및 업종명, 산업단지, 관할관청, 신청일, 처리상태(신청/승인), 접수번호, 배출시설 및 방지시설의 가동개시 예정일과 시운전 시작 및 종료일이 포함됩니다. "배출시설시운전시작일"과 "방지시설시운전시작일"은 설치된 시설의 정상 작동 여부를 확인하기 위한 시험운전 기간을 의미하며, 가동 전 반드시 이 절차를 거쳐야 합니다. 이 데이터는 대기오염 방지시설의 설치 이행 여부 확인, 행정처리 현황 분석, 산업단지별 배출시설 가동 동향 파악 등에 활용 가능하며, 환경사고 예방 및 규제 이행 감독에 있어 중요한 기초자료입니다.
