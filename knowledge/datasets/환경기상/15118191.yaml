description_portal: '- 전라남도 보건환경연구원 홈페이지에 개시된 검사항목(대기성분시험 및 소음진동 측정)에 대한 수수료를 정리한 파일입니다.- "가스성분시험"은 가스의 조성과 특성을 분석하여 안전성, 품질, 환경 기준 등을 평가하는 시험입니다. 산업, 환경, 에너지, 의료 등 다양한 분야에서 활용됩니다.- 입자상물질 성분시험은 대기 중 또는 특정 배출원에서 발생하는 **고체 또는 액체 상태의 미세한 입자상 오염물질(PM)**의 성분을 분석하여, 건강·환경 영향 및 오염원 특성을 평가하는 시험입니다.- "환경소음"은 일상생활 중 주변에서 발생하는 소리 중 사람의 건강이나 생활에 피해를 줄 수 있는 소음을 말하며, 도시계획, 산업시설, 교통 등과 밀접하게 관련된 환경영향 평가 항목입니다.'
