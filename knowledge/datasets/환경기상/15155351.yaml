summary_user: 경기도 내 환경측정대행업 등록·변경등록 신청을 건별로 담은 원천 데이터로, 사업장명·사업자번호·업종, 신청일·승인일·반려일과 처리상태, 사업장·실험실 주소, 대기·수질·소음진동·실내공기질·악취 측정항목 여부, 측정장비와 공정시험기준, 변경 내용·사유가 들어 있다. 환경 분야 사업자나 분석가가 '경기도에서 악취나 실내공기질 측정을 대행하도록 등록된 업체는 어디이며 어떤 장비를 갖췄는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업자번호(bizregno)·사업장명·주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 환경측정대행업 등록 또는 변경 신청에 대한 현황을 담고 있으며, 신청연도, 사업장명, 사업자번호, 업종코드 및 업종명, 등록구분(등록/변경등록), 신청일, 승인일, 반려일, 처리상태, 사업장 주소, 실험실 구분 및 주소, 측정항목, 측정장비명, 적용되는 공정시험기준 등 총 27개의 항목으로 구성되어 있습니다. 또한 변경 내용과 변경 사유도 포함되어 있어 등록사항의 변동 이력을 파악할 수 있습니다. 이 데이터는 대기오염물질 측정대행을 수행하는 기관의 자격 심사 및 등록 현황을 관리하거나, 측정장비 및 시험기준 정보 분석을 통한 환경 모니터링 체계 평가에 활용됩니다.
