description_portal: 본 데이터는 충청남도 부여군 지역에서 유해야생동물로 분류되는 멧돼지의 포획 현황을 기록한 자료입니다. 데이터에는 포획된 개체의 유해야생동물명, 포획일자, 포획이 이루어진 지번주소, 위치정보(위도·경도), 데이터기준일자가 포함되어 있습니다. 이를 통해 부여군 내 멧돼지 포획 발생 시기와 지역별 분포를 파악할 수 있으며, 야생동물 피해예방 정책 수립, 출몰 위험지역 분석, 공간정보 기반 모니터링, 농작물 피해 대응, 생태 및 환경관리 행정업무 등에 활용할 수 있습니다. 특히 포획 위치와 일자 정보를 기반으로 시계열 및 지도 분석이 가능하여 지역 단위의 유해야생동물 관리와 대응체계 마련에 유용한 기초자료로 활용될 수 있습니다.
