summary_user: 충청남도 공주시에서 유해야생동물을 포획한 기록을 건별로 담으며, 신고일자·포획일자, 개체 종류, 포획 방식, 포획지 시도·시군·상세주소와 위도·경도, 포획 개체 수를 제공한다. 공주시에서 어떤 동물이 언제 어디서 얼마나 포획되는지 알고 싶은 농가나 지역 분석가가, 피해가 잦은 지역과 시기를 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 데이터와는 시군명·주소 같은 이름 매핑이나 위경도 좌표로만 이어 쓴다.
limits: 전역 조인 키가 없어 행정코드 기반으로 다른 통계와 바로 결합할 수 없고, 이름이나 좌표로 맞춰야 한다. 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 5,000회로 호출이 제한된다.
