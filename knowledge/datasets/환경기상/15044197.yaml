description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 광양 망덕 해역의 수질 측정 정보를 제공합니다. 본 데이터는 실시간 자동측정 방식을 통해 수온, 염분, 용존산소(DO), 수소이온농도(pH), 탁도, 전기전도도 등 주요 수질 항목을 연속적으로 측정한 결과를 포함합니다. 광양 망덕 지역은 하천 유입과 산업단지 인접 등의 영향으로 수질 변동성이 높아 지속적인 수질 감시가 요구되는 해역입니다. 측정자료는 수질 변화 분석, 오염원 추적, 환경영향평가 등에 활용되며, 공공기관, 연구기관, 지자체 등에서 수질관리 정책 수립과 연구 기초자료로 사용됩니다. 데이터는 시계열 자료 형식으로 제공됩니다.
