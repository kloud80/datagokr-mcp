summary_user: 환경영향평가 대상 사업의 수리수문 정보를 사업구역 단위로 담는 API로, 하천사업은 연장·면적·부피·사업위치·사업구분을, 면적사업은 개발 전·중·후 홍수유출량과 영구저류지 설치 전후 첨두홍수량을 조회한다. 환경영향평가 검토자나 개발사업 분석가가 특정 개발사업이 홍수유출량을 얼마나 늘리고 저류지가 이를 얼마나 줄이는지 확인할 때 쓴다. 필수 파라미터인 환경영향평가 관리번호(mgtNo)를 다른 환경영향평가 데이터(협의 현황·사업구역)에서 먼저 받아 넘겨 연결해 쓰며, 실측 컬럼에는 전역 조인 키가 없어 그 외 데이터와는 이름·코드 매핑으로만 잇는다.
description_portal: 환경영향평가 사업의  수리수문에 대한  사업구역을 기준으로 하천사업의 속성(부피(m3), 연장(km), 면적(km2), 사업위치,  총연장(km), 사업구분) 조회와  사업구역을 기준으로 면적사업의 속성(산정빈도(년), 홍수유출량 개발전(m3/s), 홍수유출량 개발중(m3/s), 홍수유출량 개발후(m3/s), 홍수유출량 산정빈도(년),  영구저류지의 홍수량 저감효과 개발후 저류지 설치 전 첨두홍수량(m3/s), 영구저류지의 홍수량 저감효과 개발 후 저류지 설치 후 첨두홍수량(m3/s))을 조회 정보를 제공하는 서비스입니다.
team:
  dept: 기후국토환경연구과
services:
  - op: /getArea
    name: 면적사업속성조회
