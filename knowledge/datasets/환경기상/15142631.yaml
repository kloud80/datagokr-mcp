    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
      - name: type
        required: false
        desc: 응답받을 xml/json 타입
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
  - op: /getRiver
