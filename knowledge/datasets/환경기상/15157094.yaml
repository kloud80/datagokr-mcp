summary_user: 환경영향평가 대상 개발사업의 조사지점별 토양 조사 결과를 건별로 담으며, 조사차수·주소·좌표·토층 구분과 심도, 카드뮴·납·비소 같은 중금속과 벤젠·석유계총탄화수소·벤조피렌 등 유기오염물질 농도(mg/kg)를 포함하고 조사지점 위치는 SHP 파일로 함께 제공한다(전국 범위, zip 약 8.9MB). 개발사업 예정지 주변 토양이 어떤 물질로 얼마나 오염돼 있는지 확인하려는 주민·사업자·환경 분석가가 사업 단계의 토양 현황을 파악하는 데 쓴다. 전역 조인 키는 확인되지 않아, 같은 기관의 환경영향평가 협의 현황·사업구역 데이터와는 사업코드나 사업명을 맞춰서 잇고, 다른 데이터와는 좌표나 주소를 기준으로 공간 결합한다.
description_portal: '환경부 국립환경과학원의 환경영향평가 사업의 환경영향평가 사업구역, 조사지점을 기준으로 조사된 토양 조사 속성 및 공간정보(조사지점) 등에 대하여 정보를 제공하는 서비스입니다. 조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 토양정보 조사에 대한 벤조(a)피렌(mg/kg), 토층구분(예 : 표토, 중토, 심토 등), 토층별 심도(m), 준설토(mg/kg), 카드뮴(mg/kg), 구리(mg/kg)등의 다양한 정보를 제공합니다. 조사지점에 대한 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.'
