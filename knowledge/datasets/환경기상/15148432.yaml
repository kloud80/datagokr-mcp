description_portal: 국립낙동강생물자원관은 생물다양성 연구 성과의 확산과 과학 기반 정책 수립 지원을 위해 자체 확보한 담수생물 디지털이미지를 공공데이터로 개방하고 있습니다.개방 데이터는 자원번호, 학명, 국명, 등록일, 디지털이미지URL 등으로 구성되어 있습니다. 해당 데이터는 학계·연구기관에서 담수생물의 분류학적 연구, 종 다양성 분석, 생물상 분포 연구 등에 활용될 수 있습니다.정책기관이나 교육기관은 이를 기반으로 생물다양성 보전 정책 수립, 생태 교육 콘텐츠 구성, 교육용 시각 자료 제작 등에 활용할 수 있습니다.또한, 민간 활용자는 담수생물 이미지 데이터를 활용하여 생태 관련 전시·출판, 디지털 교육 서비스, 생물자원 산업의 시각자료 제작 등 다양한 분석 및 응용 기반 자료로 활용할 수 있습니다.
