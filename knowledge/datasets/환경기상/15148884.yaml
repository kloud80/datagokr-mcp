summary_user: 기후에너지환경부 내부 업무포털(이지샘터)이 쓰는 부서 코드표로, 부서 1개당 한 행에 부서코드·부서명·서열·삭제여부를 담는다(csv 약 18KB, 전국·비공간). 분석가나 담당자가 '이 데이터에 찍힌 부서코드는 어느 부서이고 지금도 있는 부서인가'를 확인하는 데 쓴다. 부서코드(moe_dept_cd)를 키로, 같은 부서코드를 쓰는 기후에너지환경부 데이터에 부서명을 붙이는 참조표로 이어 쓴다. 포털 설명에 따르면 이 코드는 행정표준코드시스템의 기관별 부서 코드를 기반으로 한다.
description_portal: 환경부 내부 업무포털에서 사용하는 부서 테이블은 부서코드, 부서명, 서열, 삭제여부 컬럼을 포함한다.부서코드와 부서명은 서열 순서에 따라 나열되며, 삭제여부 컬럼이 N인 데이터의 경우 조직개편으로 인해 현재 없는 부서이다.이는  행정표준코드시스템의 기관별 부서별 고유 코드를 기반으로 조직 체계와 업무 분장을 관리한다. 환경부 내부 업무포털인 이지샘터 시스템 조직도, 기관, 부서 정보는 해당 테이블을 기반으로한다. 이를 통해 환경부 내부직원들에게 조직 내 업무 정보의 통합과 직원 검색 기능을 제공해 업무 처리의 정확성과 신속성을 높인다.
