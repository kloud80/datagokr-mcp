summary_user: 서울특별시 중구에 등록된 환경전문공사업체(대기·소음진동·수질 오염방지시설 설계·시공 업소)를 업체 한 곳당 한 행으로 담은 인허가 원장이며, 관리번호, 인허가일, 영업상태(등록·폐업 등), 폐업·휴업 일자, 주소, 중부원점TM 좌표를 포함한다. 환경전문공사업 등록을 준비하는 예비 사업자가 '중구에서 현재 영업 중인 오염방지시설 시공업체는 몇 곳이고 어디에 몰려 있나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 붙인다.
description_portal: '서울특별시 중구의 대기오염방지시설, 소음·진동방지시설, 수질오염방지시설을 설계·시공하는 업소 정보입니다. 데이터는 각 환경전문공사업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 환경전문공사업 등록을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 오염방지 시공 기술능력 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
accrual_periodicity: 수시
team:
  dept: 디지털정책과
