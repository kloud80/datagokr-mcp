description_portal: '○ 통계개요* 통계명 : 공원* 통계종류 : 서울시 자치구별 공원조성현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도시공원 및 녹지에 관한 법률」에 의한 공원* 작성목적 : 공원의 각종 현황을 파악하여 공원 조성 및 관리의 효율적인 수행과시민의 건강ㆍ휴양 및 정서생활 향상에 기여하기 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 사업소 및 자치구 → 서울특별시 공원녹지정책과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 시도 및 자치구내용 - 서울시 자치구별 자연공원(국립) 및 도시공원, 기타공원의개소수 및 면적 현황○ 용어설명* 자연공원 : 자연자원과 유적ㆍ휴양자원 등 공원자원을 포함하고 있는 수려한 자연경관지를 원생태로 보존함과 동시에 합리적 이용을 도모함으로써 국민의 보건ㆍ휴양및 정서생활의 향상을 기하고, 이를 후손에 영구히 계승시키기 위하여 지정한일정구역으로서 국립공원, 도립공원, 군립공원으로 구분되어 있음* 도시공원 : 공원의 한 가지로, 도시계획구역 내에서 자연경관의 보호와 시민의건강ㆍ휴양 및 정서생활의 향상을 기하기 위해 도시공원법에 의하여 지정된 공원- 근린공원 : 도심지의 주택가 근처에 있는 시민들이 쉽게 드나들 수 있는 조그마한공원. 주로 인근 주민의 보건, 휴양, 정서생활의 향상을 목적으로 설치된 공원- 체육공원 : 도시공원법에 의한 도시공원의 세분 중 하나로 주로 운동경기나야외활동 등 체육활동을 통하여 건전한 신체와 정신을 배양함을 목적으로 설치된 공원○ 기타* 기타공원은 유원지, 한강시민공원, 마을마당을 포함* 조성기준이며, 중복된 공원수는 타구지역에 포함된 숫자임○ 출 처 : 서울특별시 공원녹지정책과'
