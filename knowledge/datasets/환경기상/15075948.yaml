description_portal: 천리안위성 2A호는 천리안위성 1호의 기상관측 역할을 승계하는 차세대 정지궤도 기상위성으로,2019.7.25. 정식 서비스를 시작하였습니다. 총 16개 채널을 통해 다양한 관측이 가능하며, 동아시아는 10분, 한반도 영역은 2분 간격으로 관측자료가 생산되고 있습니다.천리안위성 2A호 기상산출물 자료는 데이터(NetCDF)와 이미지(PNG) 형식으로 제공합니다.<자료다운로드 방법>1. 검색을 통해 조회된 결과 목록에서 다운로드 받을 자료 선택 후 담기 버튼 선택합니다.2. '마이페이지 > 대용량자료신청대기목록'에서 다운로드를 신청합니다.3. 제공받은 접속정보로 FTP에 접속하여 다운로드 받습니다.
