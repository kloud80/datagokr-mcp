summary_user: 제주특별자치도 보건환경연구원이 운영하는 대기오염 측정망의 운영 결과를 구분·행정시·지역(측정 지점)별로 해당연도의 1~12월 월별 값으로 정리한 집계 파일입니다(약 9KB 규모의 CSV). 제주 지역 대기질을 연구하는 분석가나 주민이 '제주시와 서귀포시 측정 지역의 월별 대기오염 측정 결과가 계절에 따라 어떻게 달라지나'를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어, 에어코리아 측정소 자료 등 다른 대기질 데이터와는 행정시·지역명 같은 이름 매핑으로만 연결합니다.
description_portal: '제주특별자치도 보건환경연구원에서 제공하는 대기보전에 따른 대기오염 측정망 운영과 관련한 데이터를 제공합니다.항목: 구분, 지역, 월별 운영 결과 현황*「대기환경보전법」에 의거하여 관리됨- 환경부장관은 대기오염 및 기후 생태계 변화 유발물질의 실태를 파악하기 위하여 환경부령이 정하는 바에 따라 측정망을 설치하고 대기 오염도를 상시 측정하여야 함- 대기오염 실태를 상시 파악하여 대기보전정책 수립의 근거자료로 활용함자세한 사항은 제주보건환경연구원 실시간 대기질 정보 홈페이지에서 확인하시기 바랍니다.https://air.jeju.go.kr/index.htm'
