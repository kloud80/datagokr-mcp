summary_user: 한국환경공단 에어코리아가 제공하는 측정소별 대기오염 정보 API로, 측정소 단위의 실시간 측정값과 대기질(미세먼지·오존) 예보 통보 내역을 담는다. 검증 호출에서 전국 824행이 수신되었고 기간은 2026-09-03부터 2026-10-02까지다. 오늘 우리 동네 미세먼지가 어느 정도이고 예보가 어떤지 확인하려는 국민이나 분석가가 쓴다. 필드에서 확인되는 것은 예보 구분(informCode)과 측정 시각(dataTime)뿐이며 전역 조인 키가 없어서 다른 데이터와는 측정소 이름·코드 매핑이나 같은 기관의 코드로만 잇는다.
description_portal: 각 측정소별 대기오염정보를 조회하기 위한 서비스로 기간별, 시도별 대기오염 정보와 통합대기환경지수 나쁨 이상 측정소 내역, 대기질(미세먼지/오존) 예보 통보 내역 등을 조회할 수 있다.api 별 상세기능으로는 측정소별 실시간 측정정보 조회, 통합대기환경지수 나쁨이상 측정소 목록조회, 시도별 실시간 측정정보조회, 대기질 예보통보 조회, 초미세먼지 주간예보 조회의 기능으로 이루어져 있습니다. ※ 운영계정으로 사용하고자 할 경우 "한국환경공단 에어코리아 OpenAPI 기술문서" 내 신청 가이드 참고
