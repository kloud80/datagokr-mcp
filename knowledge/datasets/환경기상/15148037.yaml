summary_user: 서울 구로구의 대기오염물질 배출시설 설치 사업장 인허가 원장을 사업장 한 곳당 한 행으로 담는다. 행에는 인허가일자, 영업상태(개설·휴업·폐업·재개업), 사업장명, 주소, 좌표가 들어 있고, 업종·주생산품, 배출시설과 방지시설의 가동시간·연간 가동일수도 함께 들어 있다. 주민이나 분석가가 "우리 동네에 영업 중인 대기 배출 사업장은 어디이고, 어떤 업종이며, 얼마나 가동하나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관 코드(OGDP_INST_CD)로 묶거나 좌표로 공간 결합해 잇는다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 대기오염물질배출시설설치사업장 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 대기오염물질배출시설설치사업장 시설의 면적, 건축물 연면적, 업태구분 등 주요 속성이 기록된다. 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 운영 현황을 파악하는 데 활용된다. 데이터는 정기적으로 갱신되어 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 또한 좌표정보는 지도 서비스와 공간 분석, 위치 기반 서비스 개발에 연계할 수 있어 지역사회 정보 접근성을 높이고 행정 투명성을 강화하는 기반 자료로 기능한다.
