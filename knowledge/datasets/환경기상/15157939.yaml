description_portal: 광주광역시 남구 무인회수기 현황 및 정보(설치장소 및 소재지, 위도, 경도, 배출량 등)를 제공합니다.해당 데이터는 광주광역시 남구청 환경관리과(☎062-607-3632)에서 제공하며, 배출량은 2025년도 수치를 기준으로 합니다.소재지도로명주소가 공백인 경우 소재지지번주소를 참고하시기 바랍니다. 또한 방림2동 행정복지센터에 설치된 무인회수기의 경우, 2026년 2월부터 운영을 시작하여 현재 배출량 데이터가 확보되지 않아 미표기하였으므로, 데이터 이용 시 참고하시기 바랍니다. 아울러, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 무인회수기는 건전한 분리배출 문화를 조성하고 구민의 지속 가능한 환경권을 보장하기 위한 목적으로 관리되고 있으며, 시민들이 자원 재활용에 참여하고자 할 때 신속하게 인근 회수기를 찾을 수 있도록 돕는 행정 서비스의 일환으로 본 정보를 개방하고자 합니다.
