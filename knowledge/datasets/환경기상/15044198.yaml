description_portal: 해양환경공단이 제공하는 ‘수질평가지수_오염의심해역’ 데이터에 대한 정보를 제공합니다. 본 데이터는 해양환경 측정망과 조사사업을 통해 수집된 자료를 기반으로, 오염이 의심되는 해역의 수질평가지수를 산출한 결과를 포함합니다. 주요 내용에는 조사 정점 위치, 수온, 염분, 용존산소, pH, 탁도, 영양염류 등 핵심 수질 지표와 이를 종합해 산출한 수질등급이 수록됩니다. 또한 해역별·계절별 수질 변화 추이, 주요 오염원 추정, 관리 필요 해역 선정 결과를 제공합니다. 이를 통해 해양오염 관리 우선순위 결정, 환경개선 효과 평가, 정책 수립 등에 활용할 수 있습니다. 해당 자료는 공공기관, 연구기관, 지자체, 환경단체 등에서 해양보전과 수질 관리 계획 수립의 기초자료로 폭넓게 이용됩니다.
