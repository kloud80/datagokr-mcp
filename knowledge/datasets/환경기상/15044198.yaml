summary_user: 오염이 의심되는 해역의 조사 정점별 수질평가지수 등급을 연도 단위로 담은 파일 데이터이며, 범위는 전국이고 정점 위치 좌표 없이 비공간 형태로 제공된다(CSV 약 15KB). 해양 수질 관리 담당자나 연구자가 "특정 오염의심 해역 정점의 수질등급이 해마다 나아졌는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 해양수질 측정 데이터와는 정점 이름을 맞추거나 같은 기관의 정점 코드로만 연결한다.
