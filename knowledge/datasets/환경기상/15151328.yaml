description_portal: 이 데이터는 안마의자 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200개의 이미지와 동일한 수의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에, 라벨링 파일은 ‘labels’ 폴더에 저장되어 있습니다. 데이터에는 다양한 형태, 색상, 기능을 가진 안마의자가 실내 환경에서 촬영된 이미지가 포함되어 있습니다. 이미지는 정면, 측면, 후면 등 여러 각도에서 촬영되었고, 제품의 외관, 버튼 조작부, 다리 및 등받이 구조 등의 요소가 식별 가능합니다. 라벨링 파일은 YOLO 형식으로 작성되어 있으며, 각 안마의자의 위치 좌표와 클래스명이 기록되어 있어 객체 탐지 및 분류 모델 학습에 활용 가능합니다. 데이터는 일관된 구조와 파일명 규칙을 통해 효율적인 데이터 처리 및 활용이 용이하도록 구성되었습니다.
