summary_user: 대구광역시 달성군 내 공공장소·생활권에 설치된 쓰레기통을 한 곳씩 담은 개별 시설 목록으로, 설치주소·설치지점·도로명, 쓰레기통 종류, 관리기관과 연락처, 위도·경도를 담는다. 주민이나 분석가가 '달성군 특정 도로나 지점 근처에 공공 쓰레기통이 어디에 있고 누가 관리하는가'를 확인하거나 쓰레기통의 공간 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군구명·도로명 같은 이름 매칭이나 위도·경도 좌표 기반 공간 결합으로 잇는다.
description_portal: 공공장소 및 생활권 내에 설치된 쓰레기통의 기본 현황 정보를 정리한 자료로, 설치 위치, 설치 유형 등 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 쓰레기통의 공간적 분포 현황과 관리 대상 시설의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 쓰레기통 설치 현황에 대한 체계적인 관리를 통해 생활폐기물 수거 환경을 분석하고, 쾌적한 도시 환경 조성과 청결 관리 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 쓰레기통 설치 및 유지 관리에 대한 행정 관리, 현장 점검, 민원 대응 업무 수행과 함께 관련 통계 산출 및 환경 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 공공환경 미관 개선과 주민 생활 불편 해소를 위한 관리 체계를 강화하고, 생활폐기물의 효율적인 수거·처리를 지원함으로써 지속 가능한 환경 관리 및 청결 행정 업무 수행을 위한 기초 행정자료로 활용된다.
