summary_user: 조류경보제 대상 하천·호소 지점별로 수온, pH, 투명도, 탁도, 클로로필-a, 유해 남조류 세포수, 우점종 같은 수질·조류 측정값을 지점 단위로 담는 API이며, 검증 호출에서 전국 범위 4행이 수신되었다. 하천·호소 가까이 사는 주민이나 수질 담당자, 분석가가 특정 지점의 녹조 발생 수준이 어떤지 확인하는 데 쓴다. 지점 상세주소(DETAIL_ADRES)를 주소 키로, 클로로필-a 항목(IEM_CHLA)을 좌표 키로 삼아 같은 물 맥락의 수자원(하천·댐) 데이터와 이어 쓴다.
limits: 검증 시 API 전체 건수가 4건, 수신 4행이어서 지점·기간별 장기 시계열 분석에는 맞는지 확인이 필요하다. 필드 명세에 의미와 코드표가 비어 있어 항목별 단위와 해석은 별도로 확인해야 한다. 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
