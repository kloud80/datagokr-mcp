summary_user: 경상남도가 지정한 상수원보호구역을 구역 한 건씩 담으며, 구역명·시군명·읍면동·면적·거주인구·취수장명 등을 시도 범위에서 읍면동 단위까지 제공한다. 토지 소유자나 사업자가 특정 시군·읍면동의 땅이 상수원보호구역에 걸려 건축·개발이 제한되는지 확인할 때, 또는 분석가가 시군별 보호구역 면적과 거주인구를 비교할 때 쓴다. 전역 조인 키가 없어 시군명(signguNm)·읍면동명(eupmyeundong) 같은 이름을 행정구역 코드에 매핑하거나 생태자연도·토지피복 등 다른 환경 규제 레이어와 지역명으로 맞춰 이어 쓴다.
limits: 실측 컬럼에 법정동코드 같은 공통 조인 키가 없어 다른 데이터와는 이름 매핑으로만 연결해야 하며, 필지 단위 경계나 좌표는 담지 않는다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 일 10,000회로 제한된다.
