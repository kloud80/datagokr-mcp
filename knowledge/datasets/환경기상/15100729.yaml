summary_user: 경기도 여주시 관내 사업장폐기물 배출 신고 사업장을 사업장 한 곳(인허가 건)마다 한 줄로 담은 원천 목록으로, 상호명·도로명/지번 주소·위도·경도·인허가관리번호·인허가등록일자·배출폐기물 종류를 담는다. 여주시에서 어떤 사업장이 어떤 종류의 폐기물을 배출한다고 신고했는지, 그 위치가 어디인지 확인하려는 주민·폐기물 처리업체·행정 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·주소나 좌표, 같은 기관의 인허가관리번호로만 맞춰 붙인다.
description_portal: 데이터는 경기도 여주시 관내에서 사업장폐기물의 수집·운반 및 최종 처리를 수행하는 처리업체의 현황을 수록한 자료이다. 각 업체의 처리업종, 업소명, 소재지 주소 등의 항목으로 구성되어 있으며, 폐기물의 업종에 따라 폐기물 수집 운반업,  폐기물종합재활용업  등으로 구분된다. 처리업체는 관련 법령에 따라 허가받은 기관으로, 사업장으로부터 발생하는 지정폐기물 및 일반폐기물을 안전하게 처리하는 기능을 수행한다. 본 자료는 환경 관리, 폐기물 추적, 행정 모니터링 및 관련 산업 분석에 활용될 수 있다
