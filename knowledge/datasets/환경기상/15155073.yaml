description_portal: '비산먼지발생사업정보 데이터는 비산먼지를 유발하는 사업신고 데이터로 사업자명, 공사장명, 발생사업명 등 사업 기본 정보와 함께 소재지 주소 정보 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 비산먼지발생사업정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 비산먼지 발생사업의 기본 현황과 관리 정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 대기관리과 / 044-201-6904 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
