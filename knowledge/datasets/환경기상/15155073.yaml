status: active
summary_user: 전국 자치단체가 관리하는 비산먼지 발생사업 신고를 건별로 모아 사업자명·공사장명·발생사업명, 설치(공사) 시작·종료일, 소재지 지번·도로명 주소와 좌표를 담는다. 주민이나 건설·환경 분석가가 '우리 동네 어느 공사장이 비산먼지 발생사업으로 신고돼 있고 공사 기간이 언제까지인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드·관리기관명으로 같은 지자체 단위로 묶거나 소재지 주소·사업자명 매칭으로 잇는다.
limits: 사업자번호 같은 전역 키가 없어 배출시설 사업장·TMS 등 다른 배출원 원장과 정확히 연결되지 않고, 이름·주소 매칭에 의존해야 한다. 좌표는 보정계수 없는 Bessel 중부원점TM(EPSG:5174)이므로 지도에 올릴 때 좌표 변환이 필요하다. 개발계정은 하루 10,000회로 호출이 제한된다.
