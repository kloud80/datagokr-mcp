summary_user: 울산광역시 관내에 지정된 야생생물보호구역을 구역별로 담은 소규모 원천 목록(CSV 463바이트)으로, 구분·고시내용·소재지·설정면적(제곱미터)·서식조수를 담는다. 개발 예정 부지나 필지가 야생생물보호구역에 걸리는지 확인하려는 사업자나, 철새 탐조·생태교육 장소를 고르려는 시민·교육 담당자가 쓴다. 전역 조인 키나 코드는 없어서 소재지 주소 문자열을 기준으로 지적·토지이용규제 정보나 다른 보호구역 레이어(습지·생태경관보전지역)와 맞춰 이어 쓴다.
