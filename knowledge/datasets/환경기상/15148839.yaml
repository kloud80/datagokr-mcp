description_portal: '기존에 제공 중인 오늘, 내일, 모레의 3일(단기) 예보와 이후 4일에 대한 주간(D+3~D+6) 예보에 더해 3개월 단위의 계절 전망(장기)을 예보 서비스에 추가로 제공합니다.계절 전망은 평년과 전년 대비 전국 "평균 농도"와 "나쁨(35 ㎍/㎥ 초과) 이상 일 수"에 대한 3분위*별 발생 확률을 제공합니다.전망 결과는 기후 여건을 비롯하여 초미세먼지와 상관성이 높은 인자와 초미세먼지 농도 변화 추세를 고려하는 다중회귀 및 인공지능 모델 결과를 종합적으로 고려하여 생산됩니다.제공되는 전망 자료는 초미세먼지에 민감한 취약계층 등 국민의 건강을 보호하고 고농도 시기에 산업활동 제약에 대한 사전예측성을 높여 경제활성화에 도움을 줄 수 있을 것입니다.*평균농도의 3분위: 높음/유사/낮음, 나쁨 이상 일수의 3분위: 많음/유사/적음'
