summary_user: 경기도 동두천시 관내 공장·가축분뇨 배출시설·폐수 무단배출 우려시설 등 기타 수질오염원을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명/지번 주소·위도·경도·특정시설 구분·관리기관 연락처를 개별 주소·좌표 단위로 제공한다. 하천 수질 관리 담당자나 환경 분석가가 '동두천시 어느 지역에 수질오염 우려시설이 몰려 있는가'를 지도로 확인하거나 점검 대상을 추릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 좌표 기반 공간 결합으로만 이을 수 있고, 수질 측정망·폐수배출시설 데이터와 위치를 겹쳐 보는 방식으로 함께 쓴다.
limits: 사업자번호나 시설 코드 같은 공통 식별자가 없어 다른 오염원·인허가 데이터와 정확히 연결하기 어렵고 이름·주소 매칭에 의존해야 한다. 범위가 동두천시 한 곳에 한정된 소규모 파일(약 6.7KB)이라 시군 간 비교에는 다른 지자체 자료가 따로 필요하다.
