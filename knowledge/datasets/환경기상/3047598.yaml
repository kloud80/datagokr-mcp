description_portal: 본 데이터는 경상북도 경주시 관내에서 수행된 석면 해체·제거 작업의 이력 정보를 담고 있으며, 링크 형식으로 제공된다. 수록 항목은 작업장 명칭, 소재지, 작업 시작일과 종료일, 석면 종류 및 면적, 시공업체, 감리인 정보 등으로 구성되어 있다. 해당 데이터는 시민 건강 보호와 환경 안전을 위한 기초자료로 활용되며, 유해 건축자재 관리 및 주거환경 개선을 위한 정책 수립에 기여한다. 특히 석면의 노출로 인한 건강 피해를 사전에 예방하고자 관련 정보를 공개함으로써, 지역 주민의 알권리 충족과 공공의 안전 확보에 기여한다. 경주시는 정기적으로 석면 해체 작업 내용을 점검하고 있으며, 이를 체계적으로 기록 및 관리하여 투명한 정보 제공을 실현하고 있다.
