description_portal: '○ 통계개요* 통계명 : 녹지현황(총괄)* 통계종류 : 서울시 녹지현황을 총괄적으로 제공하는 일반ㆍ보고통계* 근거법령 :「국토의 계획 및 이용에 관한 법률」에 의거 서울시가 관리하는 녹지시설* 작성목적 : 서울시 시설ㆍ일반 녹지 등의 현황을 파악하여 도시경관을 보호하고시민의 건강ㆍ휴양 및 정서생활 향상에 기여하기 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 조경과* 공표주기 : 정기(매년)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 녹지 총괄적(시설ㆍ일반ㆍ분리대 녹지 등) 현황 등○ 용어설명* 시설녹지 : 도시관리계획으로 지정된 녹지* 일반녹지 : 도로변이나 생활주변의 녹지* 하천변녹지 : 중랑천, 양재천 등 하천변의 녹지○ 기 타○ 출 처 : 서울특별시 조경과'
