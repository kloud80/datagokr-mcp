summary_user: 광산구 관내 가로 쓰레기통을 한 곳당 한 행으로 담은 건별 원천 파일로, 관리번호·도로명·행정동·설치주소·세부위치·위도·경도와 수거 쓰레기 종류, 쓰레기통 종류, 관리기관을 함께 싣는다. 주민이 '우리 동네 길가에 재활용 분리 쓰레기통이 어디 있나'를 찾거나, 구청·분석가가 행정동별 쓰레기통 배치 밀도를 점검하는 데 쓴다. 전역 조인 키는 없어서 위도·경도로 지도·공간 데이터에 겹치거나 행정동 이름으로 다른 광산구 생활폐기물 배출·수거 지점 파일과 이어 쓴다.
limits: 범위는 광산구 한 곳뿐이라 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 코드 키가 없어 행정동 이름 매칭에 의존하며, 쓰레기 발생량이나 처리 실적 같은 통계는 담지 않는다.
