summary_user: 경상북도 구미시 관내에서 대기오염물질을 배출하는 사업장을 업체 한 곳당 한 행으로 담은 등록 현황 파일(CSV)로, 업체명·사업장 주소·사업장 종별(종수)을 수록한다. 주민이나 환경 분석가가 '우리 동네 주변에 어떤 대기배출사업장이 있고 규모 종별은 어떤가'를 확인하거나, 지자체가 배출원 분포를 점검하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 배출시설·인허가 데이터와는 업체명이나 사업장 주소를 맞춰 연결해야 한다.
description_portal: 이 데이터는 대기환경보전법 제23조에 따라 관리되는 경상북도 구미시의 대기배출사업장 현황을 수록한 공공데이터입니다. 자료에는 업체명, 사업장주, 종수 항목이 포함되어 있으며, 구미시 관내 대기오염물질을 배출하는 사업장의 등록 현황을 파악할 수 있도록 구성되어 있습니다. 이 데이터는 환경오염 감시, 대기질 관리, 산업단지 환경평가, 환경행정 계획 수립, 민원 대응 등 다양한 행정 및 정책 목적에 활용될 수 있으며, 지역사회 내 대기오염 배출원 분석이나 환경위해요소 모니터링, 환경개선 사업 기획 등에도 중요한 기초 자료로 활용됩니다.
