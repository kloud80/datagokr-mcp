description_portal: 대전광역시 환경교육중심학교 운영 지원 자료는 학교 교육 과정과 연계하여 이뤄지는 체험 중심의 환경 교육 실천을 지원하기 위한 사업 현황을 담고 있습니다. 본 자료는 2023년부터 기존의 환경시범학교 명칭이 환경교육중심학교로 변경되며, 실천적 환경 교육 강화를 위해 운영 중인 학교 별 지원 내용과 프로그램 추진 현황 등을 포함합니다. 주요 내용에는 참여 학교 목록, 소재지 등 다양한 항목이 포함되며, 학생들의 생태적 감수성 향상, 지속 가능한 생활 습관 형성, 학교 생태 전환 교육 실현 등을 목적으로 하고 있습니다.
