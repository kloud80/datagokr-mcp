description_portal: APCC는 아시아지역의 여름철 계절내 진동 (BSISO, Boreal Summer Intraseasonal Oscillation) 지수의 감시 및 예측정보를 5월-10월의 기간 동안 매일 제공하고 있습니다.BSISO는 15-60일 주기로 적도 인도양에서 발생하여 점진적으로 동북진하며 아시아 지역의 여름 몬순과 대기 순환, 날씨에 영향을 주는 대규모 대류현상으로, 몬순 시스템 단기 변동의 근본적인 현상인 건기와 우기에 영향을 주는 요인 중 하나입니다.BSISO 지수는 30~60일 주기를 가지고 북진하는 모드 BSISO1과 10~30일의 주기를 가지고 북서진하는 모드 BSISO2로 표현되며, 주요 대류활동 위치에 따라 각각 8개의 위상으로 분리할 수 있습니다.보다 자세한 설명은 https://apcc21.org/ser/meth.do?lang=ko 를 참고하십시오.
