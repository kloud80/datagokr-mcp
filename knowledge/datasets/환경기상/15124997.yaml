summary_user: 전국 측정대행업체의 등록 현황을 업체 단위로 담아 사업자등록번호·업체명·측정분야·측정항목·사업장 주소와 전화번호, 악취측정 대행업 등록번호·등록일·악취측정 항목을 제공한다. 배출시설 사업자가 자가측정을 맡길 업체가 해당 측정분야나 악취 항목을 대행할 수 있는 등록업체인지 확인하는 데 쓴다. 사업자등록번호(brno)를 키로 다른 사업장 단위 배출원 원장이나 기업 정보와 이어 쓴다.
description_portal: 사업자등록번호, 측청 업체명을 통해 측정대행업체의 사업자등록번호, 측청 분야, 측정항목, 업체 주소, 악취측정 대행업 등록번호, 등록일, 대행 항목 등을 조회하는 측청 대행업체 등록 현황 조회 기능
team:
  dept: 사업장대기처 측정대행관리부
services:
  - op: /getMeasCmpyReg
    name: 측정대행업체 등록 현황
    endpoint: https://apis.data.go.kr/B552584/kecoapi/EmaMeasService/getMeasCmpyReg
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: returnType
        required: true
        example: json
        desc: 데이터 타입
      - name: brno
        required: false
        example: 112-81-13597
        desc: 사업자 등록번호
      - name: msrmtBzentyNm
        required: false
        example: (주)대명환경기술연구소
        desc: 측정업체명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
