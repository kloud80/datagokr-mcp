summary_user: 대구광역시 달성군에서 벙커C유를 연료로 쓰는 업체를 업체 한 곳당 한 행으로 담은 건별 현황 파일로, 상호·도로명주소·좌표·생산품·연간 연료 사용량(리터)·설립연도·종업원수를 포함하며 파일 크기가 478바이트에 불과한 소규모 자료다. 달성군 안에서 벙커C유를 많이 쓰는 사업장이 어디에 있는지, 친환경 연료 전환이나 대기 배출원 점검 대상을 고를 때 어느 업체를 먼저 볼지 확인하는 데 쓴다. 전역 조인 키(사업자번호 등)는 없어서 다른 배출시설·사업장 자료와는 상호·주소를 이름으로 맞추거나 위도·경도로 공간 결합해야 한다.
description_portal: 벙커C유를 연료로 사용하는 업체의 기본 현황 정보를 정리한 자료로, 업체 명칭, 위치, 업종 유형 등 에너지 사용 및 환경 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 벙커C유 사용업체의 분포 현황과 관리 대상 사업장의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 벙커C유 사용 현황에 대한 체계적인 관리를 통해 연료 사용 실태와 대기오염물질 배출 특성을 분석하고, 대기환경 관리 및 에너지 사용 관련 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 벙커C유 사용업체에 대한 행정 관리, 지도·점검 및 환경 관리 업무 수행과 함께 관련 통계 산출 및 에너지·환경 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 대기오염 예방과 환경 보호를 위한 관리 체계를 강화하고, 에너지 사용의 효율화와 친환경 연료 전환 정책 추진을 위한 기초자료로 활용되며, 지속적인 환경 관리 및 에너지 행정 업무 수행을 지원하는 행정자료로 활용된다.
