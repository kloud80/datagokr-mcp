description_portal: 바이오가스화시설의 효율성 제고 및 안전한 운전을 위한 지침서(국립환경과학원 환경자원연구부 폐자원에너지연구과 발간물)본 기술 지침서는 바이오가스화 시설의 효율성을 제고하고자 현행 운전되고 있는 시설들의 문제점들을 해결하여 안정적인 운전이 될 수 있도록 하는 것을 목적으로 하고 있다.본 기술지침서는 시설 설계 시에 설계자들이 참고할 수 있도록 하였으며, 또한 운전자에게 운전인자, 운전방법, 문제해결방안 등을 제시하여 사용하도록 하고있다.또한 운전자 또는 중앙, 지방정부 관리자들에게 시설의 운전 및 안전 관리를 위하여 운전 모니터링 및 체크리스트를 제공한다.
