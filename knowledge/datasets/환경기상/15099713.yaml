summary_user: 한국남부발전(주)의 발전소 사업장(하동·삼척·신인천·남제주·부산·영월·신세종 빛드림본부)별·호기별로 월별 총계 처리한 황산화물·질소산화물·총먼지 배출량(kg)을 담은 집계 파일로, 2010년 1월부터 2025년 12월까지를 포함한다(신규 사업장은 발전 시작 시점부터). 분석가나 지역 주민이 '우리 지역 남부발전 발전소의 질소산화물 배출량이 해마다 줄고 있는가'처럼 발전소별 배출 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 배출원·대기질 데이터와는 사업장명이나 년월을 이름·기간 기준으로 맞춰 이어 써야 한다.
limits: 사업자번호나 표준 시설코드 같은 공통 키가 없어 굴뚝 TMS나 배출시설 원장과 자동으로 결합하기 어렵고, 사업장명 매핑을 직접 해야 한다. 월별 총계라 일·시간 단위 배출 변동은 볼 수 없으며, 행정구역 좌표 없이 비공간 자료로 제공된다.
