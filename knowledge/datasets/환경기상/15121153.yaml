summary_user: 인천광역시 서구(서해구) 관내 폐기물처리업체를 업체 한 곳당 한 행으로 담은 사업자 목록 파일로, 업종·상호·전화번호·주소·처리 가능한 폐기물 종류가 들어 있다. 사업자가 특정 폐기물을 맡길 관내 처리업체를 찾거나, 분석가가 서구 안에서 어떤 업종의 처리업체가 어디에 몰려 있는지 파악할 때 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·표준 코드 등)가 없어 다른 데이터와는 상호명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 폐기물처리업체의 업종, 상호, 전화번호, 주소, 처리 가능한 폐기물 종류 등 기본 정보를 수록하고 있습니다. 본 자료를 통해 산업폐기물의 처리 현황을 파악할 수 있으며, 환경오염 예방과 자원 순환체계 구축을 위한 기초자료로 활용 가능할것으로 판단됩니다. 본 데이터는 환경정책 수립, 폐기물처리 민간업체 관리 등 다양한 공공행정 및 민간 수요에 대응하는 정보를 제공할 수 있을것으로 판단됩니다. 본 데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
