summary_user: 해양수질자동측정망 중 정기운항선박 관측 체계의 조사정점 정보를 정점 단위로 담는 API이며, 검증 시 전체 3건이 수신되었다. 정기 운항 항로에 어떤 관측 정점이 설정돼 있는지 확인하려는 분석가나 연구자가 쓴다. 정점 코드(stnpntCode)와 정점 한글명(stnpntKoreanNm)이 있으나 전역 조인 키는 없어, 이름·코드 매핑이나 같은 기관 코드로만 다른 해양수질 자료와 잇는다.
description_portal: 이 데이터는 해양환경공단이 운영하는 해양수질자동측정망 중 정기운항선박을 활용한 관측 체계의 정점 정보를 조회할 수 있도록 제공되는 공공데이터 API 서비스이다. 정기적으로 동일 항로를 운항하는 선박에 설정된 조사정점의 코드, 명칭, 경위도 위치 등 기본 공간 정보를 확인할 수 있으며, 운항 경로 상의 관측 지점 배치와 구간 특성을 체계적으로 파악할 수 있도록 구성하였다. 또한 각 정점에서 측정 가능한 수질 항목, 관측 주기, 장비 구성 등 운영 특성을 함께 제공하여 이용자가 향후 자료 분석 및 활용 계획을 수립하는 데 참고할 수 있도록 지원한다. 아울러 정점별 이력 정보와 표준화된 데이터 구조를 제시함으로써 연속 관측자료와의 연계성을 강화하고, 정기운항선박 기반 해양환경 모니터링 체계를 이해하는 데 필요한 기초 정보를 제공하는 서비스이다.
