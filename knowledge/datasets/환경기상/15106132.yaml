summary_user: 전국 영농폐기물 공동집하장 9,553곳을 건별로 담은 위치 원천 파일로, 시도·시군구·집하장명·소재지·면적·보관가능용량·형태를 싣는다. 지역별 집하장 분포와 부족 지역을 살피거나 수거 경로를 설계하려는 분석가·지자체 담당자가 쓴다. 소재지(address)를 조인 키로 주소 기반 데이터와 이어 쓰며, 별도의 코드표나 사업자번호 키는 없다.
description_portal: 이 데이터는 전국 각지의 영농폐기물 공동집하장 정보를 수록한 자료로, 농민들이 영농활동(농약 사용, 비닐하우스, 농자재 등) 이후 발생한 영농폐기물(농약빈병, 폐비닐, 폐농약 등)을 임시로 보관하는 시설의 위치 및 기본 정보를 담고 있습니다. 본 데이터는 한국환경공단이 수거를 담당하기 이전, 농민들이 마을 단위로 폐기물을 집하하는 중간 거점에 해당합니다.지역별 폐기물 관리 인프라 밀도, 집하장 부족 지역 파악, 정책 수립, 폐기물 수거 최적화 경로 설계, 수거 시스템 효율화 등의 정책연계 연구 등의 기초자료로 활용할 수 있습니다.
