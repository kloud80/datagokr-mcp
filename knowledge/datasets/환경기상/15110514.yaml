description_portal: 제주특별자치도 제주시 클린하우스 현황 데이터로 제주시 관내 클린하우스(생활폐기물 배출 거점)별로 행정구역(읍면동명)과 설치 위치(도로명주소, 단지명)를 확인할 수 있도록 정리한 자료입니다. 위도·경도 좌표를 함께 제공해 지도에서 위치를 표시하거나 주변 거점과의 접근성을 비교하는 데 활용할 수 있습니다. 시설별로는 종량제·재활용·유리병·스티로폼·폐건전지·폐형광등·음식물·음식물계량 등 수거함 종류별 설치 개수와 CCTV 설치 수가 포함되어, 거점별 수거 인프라 수준과 관리 여건을 파악할 수 있습니다. 이 데이터는 읍면동명, 도로명주소, 단지명, 위도좌표, 경도좌표, 종량제수거함수, 재활용수거함수, 유리병수거함수, 스티로폼수거함수, 폐기건전지수거함수, 폐기형광등수거함수, 음식물수거함수, 음식물계량수거함수, CCTV설치수, 등록일시로 구분됩니다.
