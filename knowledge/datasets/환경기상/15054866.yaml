summary_user: 경상남도 도내 음식물류폐기물 처리시설을 시설 한 곳당 한 행으로 담은 파일로, 업체명(시설명)·소재지 주소·하루 처리규모와 단위를 담는다(포털 설명상 공공 13개소, 민간 28개소). 주민이나 사업자가 '우리 시군 근처에서 음식물쓰레기를 처리하는 시설이 어디이고 하루에 몇 톤을 처리하나'를 확인하거나, 분석가가 도내 처리용량 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소의 시군명이나 시설명을 맞춰 이어 써야 한다.
description_portal: '경상남도 도내 음식물처리시설 설치 및 처리 현황입니다.- 공개 자료 : 음식물류폐기물 처리시설 업체명(시설명), 소재지(시설 위치 주소), 처리규모(톤/일)- 공공처리시설(13개소) 및 민간처리시설(28개소)- 공공처리시설의 경우 퇴비화, 사료화(습식,건식), 바이오가스화 등의 방법으로 재활용 처리 중- 민간처리시설의 경우 퇴비화, 자가사육(가축먹이), 사료화 등 다양한 방법으로 재활용 처리 중- 매년 작성하는 기후에너지환경부 "음식물류폐기물 처리시설 설치 운영 현황" 참고- 2025년 현황자료는 2026년 중순 작성 예정'
legal_basis_portal: '- 매년 작성하는 기후에너지환경부 "음식물류폐기물 처리시설 설치 운영 현황" 참고'
