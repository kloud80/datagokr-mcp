description_portal: '발달하는 적란운 구름 내부에 분리 축적된 음전하와 양전하 사이에서 번개현상이 발생하고 구름 하단과 지면 사이에 발생하는 방전 현상을 낙뢰라고 합니다. 기상청 낙뢰관측자료는 전국 21개소 낙뢰관측장비를 이용해서 탐지 - 분석된 낙뢰의 발생시각, 위치, 극성(+, -), 강도 등을 관측한 자료입니다.관측지점은 21지점으로 백령도, 파주, 인천, 서해기지, 보령, 춘천, 충주, 간성, 대관령, 울진, 울릉도, 추풍령, 포항, 고창, 거창, 흑산도, 완도, 여수, 부산, 제주, 서귀포입니다.생산주기: 분(5분 주기)보유기간: 1988년 ~ 현재(지점별 상이함)'
