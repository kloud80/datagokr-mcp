summary_user: 기상청 전국 21개소 낙뢰관측장비로 탐지·분석한 낙뢰 한 건 한 건의 발생시각, 위치, 극성(+, -), 강도를 담는 관측 자료로, 포털 설명상 5분 주기로 생산되며 1988년부터 보유하나 시작 시점은 지점별로 다르다. 특정 날짜·지역에 낙뢰가 실제로 떨어졌는지 확인하려는 보험·시설 관리 담당자나, 낙뢰 빈도를 기후·농업 피해 분석에 넣으려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 기상관측·피해 자료와는 위치·시각을 직접 맞추거나 같은 기관(기상청) 코드로만 연결한다.
limits: 포털 활용신청과 별개로 외부 사이트(apihub.kma.go.kr)의 인증키를 path 파라미터로 넣어야 호출된다. 공통 조인 키가 없어 행정구역 단위 통계나 다른 데이터와 바로 결합되지 않으며, 지점별 보유 시작 시점이 달라 장기 비교 때 주의한다.
