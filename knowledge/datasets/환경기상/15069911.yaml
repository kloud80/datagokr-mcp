description_portal: 한강유역환경청 토지매수정보에 대한 데이터로 (토지고유코드,소재지,데이터기준일)에 대한 정보를 제공합니다.* 참고사항(토지매수대상지역)1. 상수원보호구역으로 둘러싸인 지역 중 상수원보호구역으로 지정·공고되지 아니한 지역2. 수변구역으로 둘러싸인 지역 중 수변구역으로 지정·고시되지 아니한 지역3. 제1호 내지 제2호 외의 지역으로서 한강·북한강·경안천(이하“한강 등”이라 한다)과 인접한 지역 중 다음 각 목의 어느 하나에 해당되는 지역. 다만, 다음 각 목에 따른 지역에 속하는 토지 중 하나의 필지 일부가 그 지역 외의 지역에 남게 된 경우에는 그 필지의 나머지 부분도 다음 각 목에 해당하는 지역으로 본다.- 특별대책지역 Ⅰ권역 중 한강 등의 경계로부터 1킬로미터 이내의 지역- 특별대책지역 Ⅱ권역 중 한강 등의 경계로부터 1킬로미터 이내의 지역- 특별대책지역 외의 지역 중 한강 등의 경계로부터 1킬로미터 이내의 지역4. 그 밖에 위원회가 한강수계의 상수원을 적절하게 관리하기 위하여 필요하다고 인정하는 지역
