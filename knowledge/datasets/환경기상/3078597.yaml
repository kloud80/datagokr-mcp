summary_user: 경상남도 보건환경연구원이 운영하는 도시대기·도로변대기 측정소의 설치 현황을 측정소 한 곳당 한 행으로 담은 파일로, 측정소명·주소·최초설치일자·측정망 종류·시군·용도지역·위경도를 포함한다. 분석가나 주민이 '우리 동네에서 가장 가까운 대기오염 측정소는 어디이고 어떤 용도지역에 있는가'를 확인하거나 측정소 위치를 지도에 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 시간별 대기질 측정값과는 측정소명으로 이름을 맞추거나 위경도 좌표로 공간 결합해야 한다.
description_portal: 경상남도 보건환경연구원에서 운영중인 대기환경측정망 설치 현황 자료입니다. 도시대기측정소 및 도로변대기측정소의 측정소명, 주소, 설치일자, 측정망 종류, 시군, 용도지역, 위경도 좌표 자료를 포함하고 있습니다. 경상남도 보건환경연구원에서 운영중인 43개 측정소에 대해 시군별로 측정소를 구분하여 정보를 제공합니다. 측정소의 설치위치 정보를 제공합니다. 측정소의  설치위치는 주소 및 설치된 건물명으로 구체화하여 제공합니다. 해당 측정소의 측정망 구분 정보를 제공합니다. 운영중인 측정소의 용도지역 정보를 제공합니다.
