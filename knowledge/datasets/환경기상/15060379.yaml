summary_user: 충청남도 금산군에 신고된 사업장폐기물 배출자를 신고 건별로 담은 파일로, 상호명·폐기물 구분(사업장일반/지정)·폐기물 종류·운반자·처리업체·처리방법·도로명주소·신고기준년도를 기록한다. 금산군의 특정 사업장이 어떤 폐기물을 배출하고 어느 운반자와 처리업체를 거쳐 재활용·매립·소각 중 어떤 방법으로 처리하는지 확인하려는 환경 담당자나 분석가가 쓴다. 사업자등록번호(bizno)를 키로 다른 지자체의 폐기물 처리업 허가 원장이나 사업자 정보와 이어 쓴다.
description_portal: 본 데이터는 충청남도 금산군 사업장폐기물배출자 신고현황(사업장 상호, 폐기물종류, 사업자등록번호, 운반자명, 처리업체명, 처리방법, 사업장 도로명주소, 신고기준년도)에 대한 정보를 제공합니다. 해당 데이터는 「폐기물관리법」 제17조 및 동법 시행규칙 제18조에 따라 수집·공개되며, 2021년 11월 기준 814건의 신고 이력이 수록되어 있습니다. 폐기물 종류에는 폐유리, 건설폐토석, 폐콘크리트 등 다양한 산업폐기물이 포함되며, 처리방법은 재활용, 매립, 소각 등으로 구분됩니다. 해당 데이터는 환경정책 수립, 폐기물 관리계획 및 적정처리 여부 모니터링에 활용될 수 있습니다.
