summary_user: 충청남도 논산시에서 포획된 유해야생동물을 포획 건별로 담은 API로, 신고일자·포획일자, 동물 종류, 포획 방식, 포획지의 시도·시군·상세주소와 위도·경도, 포획 개체 수를 담는다. 농가 피해 대응 담당자나 분석가가 '논산시에서 어떤 동물이 언제 어디서 얼마나 포획되는가'를 지도나 시기별로 살펴보는 데 쓴다. 전역 조인 키는 없으므로 포획지 시군·주소 이름이나 위도·경도 좌표를 기준으로 다른 지역 통계나 공간 레이어와 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 좌표로만 연결할 수 있다. 필드의 명세상 의미와 코드표가 제공되지 않아 동물 종류(INDVL_KIND)나 포획 방식 같은 값은 실제 응답을 보고 해석해야 한다. 개발계정은 하루 5,000회까지 호출할 수 있다.
