description_portal: 우리나라는 전 세계적인 2050년 탄소중립 사회 전환 움직임에 발맞추어 2050 탄소중립을 선언하였습니다. 이 목표 달성을 위해 「기후위기 대응을 위한 탄소중립·녹색성장 기본법」이 2022년 3월 25일 제정되었으며, 이에 따라 지자체의 탄소중립·녹색성장 기본계획 수립이 의무화되었습니다. 이는 탄소중립 정책의 실질적 이행 주체로서 지자체의 역할이 한층 강화되었음을 의미합니다. 탄소중립 정책포털(https://www.gihoo.or.kr/netzero)에서는 광역지자체와 기초지자체에서 수립된 탄소중립 녹색성장 기본계획을 수집 및 게시하고 있으며(2025. 6. 기준) 이는 국가법령센터(https://law.go.kr/)에서도 확인 가능합니다. 본 데이터는 탄소중립 정책포털에 게시되어 있는 지자체별 탄소중립 녹색성장 기본계획의 다운로드 링크입니다.
