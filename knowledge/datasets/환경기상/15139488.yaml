summary_user: 인천비행정보구역의 저고도(300∼3,000m) 항공기상 예측 자료를 담는다. 운항에 영향을 주는 기상현상을 표시한 중요기상예보(SIGWX), 위경도 격자별 바람·기온 예측(WINTEM), 고도별 난류 예측값이 6시간 주기로 생산된다. 소형기·헬기·드론 운항자나 항공 분석가가 특정 시각에 저고도 경로의 바람·난류가 어떨지 확인할 때 쓰며, 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위경도나 발표 시각(UTC)을 기준으로 직접 맞춰 이어야 한다.
description_portal: '저고도 중요기상예보(SIGWX): 인천비행정보구역에서 항공기 운항에 영향을 줄 수 있는 기상현상에 대해 발표하는 항공기상예보입니다. 요소는 요소 종류, 요소 이름, 위칫값 등이 있고 생산주기는 6시간으로 5, 11, 17, 23UTC입니다.  보유기간은 2024년 2월 5일 11UTC부터 입니다.저고도 한반도 WINTEM(바람기온)는 300∼3,000m 고도에서 예상되는 바람(풍향, 풍속)과 기온을 예측한 수치모델 자료입니다. 요소는 위도, 경도, 풍향, 풍속, 바람 등이고, 생상주기는 6시간으로 0, 6, 12, 18UTC입니다. 보유기간은 2024년 1월 9일부터 입니다.저고도 난류예측자료는 수치모델자료와 난류 계산식을 활용하여 300∼3,000m 고도에서 예상되는 난류를 예측한 자료입니다. 요소는 고도, 난류값, 위도, 경도이고,  생산주기 6시간으로 0,6, 12, 18UTC입니다. 보유기간은 2024년 2월 1일부터 입니다.'
