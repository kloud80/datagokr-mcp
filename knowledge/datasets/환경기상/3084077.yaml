summary_user: 경상남도 안의 건설폐기물 처리업체를 업체 한 곳당 한 행으로 담은 명부로, 업종·시군구·업체명·소재지·대표자·전화번호·자체 수집운반차량·영업대상 폐기물을 적는다. 공사 현장 관계자나 건축주가 '우리 시군에서 이 종류의 건설폐기물을 받아 처리하는 업체가 어디인가'를 찾을 때나, 분석가가 시군별 처리업체 분포를 볼 때 쓴다. 공통 조인 키(사업자번호·업체 코드)가 없어서 다른 폐기물 처리업 원장과는 업체명·소재지 문자열이나 시군구 이름을 맞춰 연결해야 한다.
description_portal: '○ 통계개요* 통계명 : 건설폐기물 발생량 및 처리현황* 통계종류 : 건설폐기물의 발생량 및 처리현황을 제공하는 지정ㆍ조사통계* 근거법령 :「건설폐기물 재활용촉진에 관한 법률」에 의한 건설폐기물 발생 및 처리* 작성목적 : 폐기물의 발생 및 처리현황, 종류별 발생량, 폐기물 조성의 변화등을 파악하여 관련시설의 설치 및 관리 등 폐기물 정책 수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 시도 → 환경부* 공표주기 : 정기(매년, 12월 기준)○ 용어설명* 폐기물 : 쓰레기, 연소재, 오니, 폐유, 폐산, 폐알칼리 및 동물의 사체 등으로서 사람의 생활이나 사업활동에 필요하지 아니하게 된 물질○ 자료출처 :  환경부 「폐기물통계」'
