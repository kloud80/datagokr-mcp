description_portal: 이 데이터는 친환경차종합정보지원시스템 연구자료 게시판에 등록된 연구자료 및 보도자료 관련 정보입니다. 하이브리드차, 저공해차, 친환경차 등과 관련된 정책, 보조금 지원, 연구 보고서, 인증 현황 등의 자료들이 목록으로 정리되어 있으며 정부 기관 및 공공 연구기관에서 생산한 공식적인 정보들이 포함되어 있습니다. 하이브리드차 및 친환경차 관련 정부의 보조금 정책, 추진 방향, 보급 등 전체적인 현황을 이해하는 데 유용합니다. 온실가스 감축 효과나 정책 성과에 대한 연구자료는 학술적 또는 정책적 분석에 활용할 수 있습니다.
