summary_user: 부산 해운대구에 사업장폐기물 배출자로 신고한 사업장을 한 건씩 담은 명부로, 사업장명·주소·연락처를 기록한 파일(csv, 약 22KB)이다. 해운대구 안에서 하루 300kg 이상 폐기물을 내는 배출 사업장이 어디 있는지, 특정 업체가 신고 대상에 들어 있는지를 확인하려는 수집운반·처리업체나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소를 맞춰 보거나 같은 기관(해운대구) 자료끼리만 이어 쓴다.
description_portal: 2026년 2분기 기준 폐기물 관리법 제17조 근거 1일 300키로 이상 사업장폐기물배출자 신고 현황으로 소재지 업체명 연락처를 기록하였음.사업장폐기물배출자 신고는 신고 및 철회에 의해 현황이 변경되며, 지속적으로 사업장폐기물배출자가 증가하고 있음사업장폐기물배출자는 자가처리 및 위탁처리 방법이 있으며,  수집운반업체, 처리업체 관련 서류 준비하여 배출자 신고해야하며, 변경신고시도 관련 서류 첨부하여 배출자 신고해야함사업장폐기물 배출자는 사업개시일 및 폐기물 발생한 날로부터 1월 이내 신고해야함
