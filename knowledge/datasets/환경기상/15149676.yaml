summary_user: 해양환경공단이 해안 오염사고에 대비해 조사·점검한 해안방제 취약 구역을 구역별 1행으로 담은 파일 데이터로, 전국 427행에 구역명·행정구역·접근방법·민감 개소·해안선 길이·방제조치 우선순위와 좌표를 싣는다. 지자체나 방제 담당자, 분석가가 특정 해안에서 기름 유출 시 어느 구역을 먼저 방제할지, 어떻게 접근할지 확인하는 질문에 쓴다. 경도·위도 좌표(coord)로 다른 공간정보나 해양 오염사고·해양쓰레기 데이터와 겹쳐 볼 수 있으나, 그 밖의 코드표 키는 없다.
description_portal: 본 데이터는 해양환경공단이 해안 오염사고 대비를 위해 조사·점검한 해안방제 취약지역의 위치와 평가정보를 통합하여 제공하는 데이터입니다. 내용에는 조사지역의 위도, 경도와 같은 공간정보와, 조사구역 정보(구역명, 접근가능여부 및 방법, 행정구역명), 해양환경 민감 개소 및 특이사항, 해안선 길이, 방제조치 우선순위 정보 등을 제공합니다. 본 정보는 CSV 파일로 제공되며, GIS 분석에 활용 가능한 다양한 공간데이터 형태로 활용이 가능합니다. 본 자료는 해양환경공단에서 조사·점검한 참고 정보로서 지역 여건에 따라 실제 조치가 달라질 수 있습니다. 향후 해양오염 대응계획 수립, 방제자원 배치 최적화, 교육·훈련 및 지자체 업무 지원에 활용될 수 있습니다.
