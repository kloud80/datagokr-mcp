summary_user: 경상남도 함양군에서 대형폐기물을 버릴 때 내는 처리 수수료를 품목별로 정리한 파일 데이터로, 폐기물 구분·품목명·규격·유무료 여부·수수료 금액을 한 행씩 담는다(시군구 단위, CSV 약 11KB). 함양군 주민이 장롱이나 냉장고 같은 품목을 내놓기 전에 규격별로 수수료가 얼마인지, 무료인지를 미리 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 지자체의 대형폐기물 수수료 파일과는 시도명·시군구명과 품목명(대형폐기물명)을 맞춰 이어 붙이는 방식으로만 비교한다.
limits: 함양군 한 곳만 다루므로 다른 시군과 비교하려면 지자체별 파일을 따로 모아 품목명·규격 표기를 직접 맞춰야 한다. 수수료 기준표일 뿐 실제 배출 건수나 폐기물 발생량·처리현황 통계는 담지 않는다.
