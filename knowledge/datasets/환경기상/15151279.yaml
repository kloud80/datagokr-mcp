description_portal: 이 데이터는 다양한 형태의 테이블류(식탁, 작업대, 교실용 책상 등)를 촬영한 이미지와 해당 이미지에 대한 객체 라벨링 정보로 구성되어 있습니다. 총 200개의 이미지 파일과 200개의 라벨링 텍스트 파일이 포함되어 있으며, 이미지 파일은 ‘images’ 폴더에 저장되어 있습니다. 각 이미지는 실내 환경에서 다양한 각도와 거리에서 촬영된 테이블류를 포함하고 있으며, 외관, 다리 구조, 상판 형태 등을 명확히 구분할 수 있습니다. 라벨링 텍스트 파일은 ‘labels’ 폴더에 동일한 파일명으로 존재하며, YOLO 형식으로 각 테이블 객체의 위치와 클래스를 좌표값으로 기록하고 있습니다. 데이터는 AI 모델의 객체 인식 및 분류 학습에 적합하도록 일관된 형식으로 구성되어 있습니다.
