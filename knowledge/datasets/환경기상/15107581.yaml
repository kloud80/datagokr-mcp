description_portal: 이 데이터는 충청남도 금산군 내 대기오염물질을 배출하는 사업장 중 경질유(등유, 경유 등)와 중질유(B-C유 등 중유계 연료)를 사용하는 업체에 대한 정보를 제공합니다. 2022년 10월 기준 삼남제약, 금강코팅, 제일자동차공업사 등 총 14개 업체에 대해 제공기관, 업체명, 연락처, 사용연료, 사용량, 주소 정보가 수록되어 있으며, 사용연료에는 B-C유, 경유, 등유, 부생연료유 1호가 있습니다. 해당 데이터는  환경정책 수립, 유류 수요 분석, 온실가스 배출 통계 작성, 지역 유통관리 등에 유용하게 활용될 수 있습니다.
