summary_user: 광진구 내 건설폐기물을 수집·운반하거나 중간처리하는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소·처리업종 유형·허가 보관량 등이 들어 있습니다. 광진구 공사 현장의 시공사나 주민이 '이 지역에서 지금 영업 중인 건설폐기물 수집운반·중간처리 업체는 어디인가'를 확인하거나, 분석가가 처리업체 현황과 개·폐업 추이를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소로 매칭하거나, 같은 형식으로 나온 다른 자치구의 인허가 데이터와 기관 코드(OGDP_INST_CD) 기준으로 합쳐 쓴다.
description_portal: 서울특별시 광진구_건설폐기물처리업 인허가 정보는 광진구 내 건설현장에서 발생하는 폐콘크리트, 폐목재, 폐벽돌 등 건축공사 과정에서 발생하는 건설폐기물을 수집·운반하거나 중간처리하는 업소에 대한 인허가 정보를 담고 있습니다. 해당 데이터에는 사업장명, 인허가일자, 소재지, 영업상태, 처리업종 유형, 허가번호 등의 항목이 포함되며, 폐기물의 적정 처리와 재활용, 환경오염 방지에 기여하는 업체 현황을 확인할 수 있습니다. 업소의 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도 및 경도는 포함되지 않습니다. 본 데이터는 최신 시점 기준 3일 전 정보를 바탕으로 업데이트되며, 건설폐기물 처리업체의 관리 및 환경정책 수립에 활용됩니다.
