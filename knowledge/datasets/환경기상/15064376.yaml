summary_user: 수도권매립지에 들어온 폐기물 운반 차량 대수를 마감년월·소재지(광역지자체)·폐기물 종류별로 월 단위 집계한 파일 데이터입니다(건별 원천 아님, CSV 약 30만 바이트). 분석가나 지자체 담당자가 '서울·인천·경기 중 어느 지역에서 어떤 폐기물을 실은 차량이 매달 몇 대씩 매립지로 들어오는가'를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 지자체명(소재지)과 마감년월을 이름 기준으로 맞춰 붙여야 합니다.
description_portal: '수도권매립지에 폐기물 차량의 반입대수 정보입니다. 개방항목은 마감년월, 광역지자체명, 폐기물명, 반입대수 항목을 제공합니다.공사에서 제공하는 이 정보는 각 지자체(예: 서울시, 인천시, 경기도 등) 및 폐기물 종류별로 매립지에 집입하는 폐기물 운반 차량의 실적을 월 단위로 집계하여 폐기물 처리 현황 및 차량 운영 효율을 파악하는데 활용됩니다. 공공데이터 포털의 통합반입관리 데이터 개방을 통해 반입대수 현황 등을 확인할 수 잇으며, 이를 통해 공사의 폐기물 수용 및 관리 효율성을 평가할수 있습니다.'
