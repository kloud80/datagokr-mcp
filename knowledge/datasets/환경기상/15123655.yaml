description_portal: 국립낙동강생물자원관에서는 담수생물자원의 보존과 활용 촉진을 위해 국립낙동강생물자원관에서 발행한 전자책 정보를 개방하고 있습니다. 개방데이터는 제목, 발행자, 발행년, 구분, 형식, 저작권 보유여부, 공공누리유형, 전자책 접속 주소 등으로 구성되어 있으며, 다양한 수요자층이 생물자원 이해와 활용에 활용할 수 있도록 제작되었습니다. 학계·연구기관은 전자책에 수록된 생물 분포, 생태 특성, 조사·분석 결과 등을 바탕으로생물다양성 연구, 보전 정책 수립, 생물자원 기반 산업화에 필요한 기초자료로 활용할 수 있습니다. 교육·문화기관은 전자책 자료를 교재, 체험활동 자료, 전시 콘텐츠로 응용하여체감도 높은 생물자원 교육 프로그램 개발 및 운영에 활용할 수 있습니다. 지자체 및 관련 기관은 전자책에 수록된 지역 생물자원 정보를 바탕으로지역 특화 자원 발굴, 관광 콘텐츠 개발, 생물자원 기반 협력 네트워크 구축 등에 활용할 수 있습니다. 지속적으로 업데이트되는 전자책 정보는 국립낙동강생물자원관 담수생물다양성 정보포털에서 확인하실 수 있습니다.
