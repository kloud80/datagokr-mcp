summary_user: 충청남도 서산시에서 구조된 야생동물을 접수 건별로 담은 원천 자료로, 종명과 분류(강·목·과), 천연기념물·멸종위기 여부, 구조 일시, 발견 주소와 구조·방생 좌표, 발생 원인, 구조 결과와 최종 진단을 기록한다. 서산시에서 어떤 종이 어떤 원인(교통사고, 질병 등)으로 언제·어디서 많이 구조되는지, 그리고 방생과 폐사 비율이 어떤지 보려는 환경 정책 담당자나 분석가가 쓴다. 전역 조인 키는 없으므로 다른 시군의 야생동물 구조 데이터와는 종명·분류명을 기준으로 맞춰 결합하고, 위경도(구조위도·구조경도)를 써서 보호구역 같은 공간 레이어와 위치 기반으로 겹쳐 본다.
limits: 표준 코드나 전역 조인 키가 없어 다른 데이터와는 이름 매핑이나 좌표 중첩으로만 연결한다. 범위는 서산시 구조 건에 한정되므로 충청남도 전체나 전국 단위 경향은 다른 시군 자료를 합쳐야 볼 수 있다.
