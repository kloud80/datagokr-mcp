summary_user: 서울 강서구 관내 특정토양오염관리대상시설(유류 등 저장시설)을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·지번/도로명 주소·저장탱크 개수·저장용량과 단위·설치(완공검사)일자를 수록한다(CSV 약 6KB). 주유소 등 저장탱크 시설이 특정 필지나 동네 주변에 있는지, 언제 설치됐는지를 확인하려는 주민·부동산 개발 검토자·토양환경 담당자가 토지 이용이나 오염 위험을 판단할 때 쓴다. 전역 조인 키는 없어 소재지 주소를 지오코딩하거나 사업장명으로 다른 오염원·사업장 데이터나 필지 단위 환경 규제 레이어와 맞춰 이어 쓴다.
description_portal: 서울특별시 강서구 관내 특정토양 오염관리 대상 시설에 대한 정보를 수록하고 있습니다.환경오염 유발 가능성이 있는 저장시설 및 관련 시설의 위치, 구조, 설치 정보 등을 제공합니다. 주요 항목에는 사업장명, 주소(지번 및 도로명), 저장탱크 수와 저장용량, 설치일자 등이 포함되어 있어, 오염물질 유출 가능성에 대한 선제적 대응 및 토양 환경보호를 위한 행정관리 자료로 활용됩니다. 해당 자료는 토양환경관리법에 따른 오염 취약시설 모니터링, 환경영향 평가, 정화사업 우선순위 지정 등에 사용될 수 있으며, 도시계획 수립 시 오염 위험 요인 평가나 주변 지역의 개발 제한 검토에도 기초자료로 활용됩니다.
