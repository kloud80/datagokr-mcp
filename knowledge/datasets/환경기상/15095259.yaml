summary_user: 경기도 안의 온실가스 배출량을 연도(yr)와 산업구분(에너지·기계·제지·폐기물처리 등)별로 집계한 표로, 시도 단위의 비공간 데이터다. 경기도 기후정책 담당자나 분석가가 '어느 산업군의 배출량이 해마다 늘거나 줄었는가'를 보고 감축 대상 산업을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 연도나 산업구분 이름을 직접 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: '이 데이터는 경기도 내 산업분야별 연도별 온실가스 배출량 정보를 제공합니다. 주요 항목은 연도, 산업구분, 전체온실가스배출량으로 구성되어 있으며, 다양한 산업군(예: 에너지, 기계, 제지, 폐기물처리 등)에 따른 이산화탄소 등의 온실가스 배출량을 정량적으로 나타냅니다. 해당 데이터는 온실가스 감축정책 수립, 산업별 환경영향 분석, 기후변화 대응전략 수립, 환경지표 관리 등에서 활용될 수 있습니다. 또한 산업 특성에 따른 에너지 소비 및 환경 영향도를 평가하여 지속가능한 산업정책 수립에 기초자료로 제공됩니다.'
