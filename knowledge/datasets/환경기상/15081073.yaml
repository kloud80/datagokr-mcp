summary_user: 전국 수질측정망 측정소(ptNo·ptNm)별로 측정일자(wmcymd)와 측정값을 담는 측정소 단위 수질 시계열 데이터로, 물환경정보시스템을 통해 수집된다. 하천·호소 수질을 살피는 분석가나 주민이 '우리 지역 측정소의 수질이 최근 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소 이름·코드 매핑으로 하천·댐 등 수자원 데이터와 같은 물 맥락에서 이어 쓰고, 표준데이터(15017324)와 연결해 본다.
limits: 측정소 코드·이름 외에 다른 데이터와 바로 붙일 공통 키가 없어 연계하려면 이름·코드 매핑이 필요하다. 측정주기와 측정항목은 물환경측정망 운영계획·조류경보제 운영매뉴얼 기준으로 데이터마다 다르므로 항목·시점을 균일하게 비교할 수 없다. 개발계정은 하루 10,000회로 호출이 제한된다.
