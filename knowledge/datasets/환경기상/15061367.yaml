description_portal: 한국수력원자력㈜이 공개하는 온실가스 배출량 데이터는 한수원이 운영하는 사업소별 온실가스 배출 현황을 담고 있습니다. 해당 데이터에는 5개의 원전사업소(고리, 한빛, 월성, 한울, 새울)와 7개의 양수발전사업소(무주, 삼랑진, 예천, 청송, 청평, 산청, 양양), 그리고 수력본부와 기타사업소에 대한 배출 정보가 포함되어 있습니다. 사업소별로 구분된 온실가스 배출량은 직접배출량과 간접배출량으로 나누어 제공되며, 이를 통해 한수원이 운영하는 발전소의 온실가스 배출 특성과 차이를 확인할 수 있습니다. 이 데이터는 한국수력원자력㈜의 온실가스 관리 및 저감 노력을 객관적으로 보여주며, 에너지 공기업으로서의 환경적 책임성과 지속가능경영을 이해하는 데 활용될 수 있습니다. 데이터에 온실가스 배출량 해당 연도 항목을 포함하고 있음
