summary_user: 대구광역시 서구에 설치된 폐건전지·폐형광등 분리수거함의 위치를 수거함 한 곳당 한 행으로 담은 파일로, 동, 도로명주소, 건물명(행정복지센터·학교·아파트·복지관 등)을 담는다. 서구 주민이 '우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리면 되나'를 찾거나, 담당 부서가 동별 수거함 배치 현황을 점검하는 데 쓴다. 전역 조인 키는 없어 다른 지자체의 수거함·재활용 배출 지점 파일과는 동 이름이나 도로명주소 문자열을 맞춰 이어 쓴다.
description_portal: 형광등 분리수거함은 관내 행정복지센터나 공동주택내 재활용품 분리배출장소, 학교등에 설치되어 있습니다.폐건전지와 폐형광등은 재활용은 불가하나 환경훼손의 염려가 있는 폐기물이므로 분리배출 및 수거에 적극 협조하여 주시기 바랍니다.본 데이터는 대구광역시 서구 지역에 설치된 폐건전지 및 폐형광등 수거함의 위치 정보를 담고 있다. 제공 항목은 연번, 동 별, 도로명주소, 건물명으로 구성되어 있으며, 주민센터, 학교, 아파트, 복지관 등 다양한 시설에 설치된 수거함의 위치를 명시하고 있다. 해당 데이터는 유해 폐기물의 올바른 분리배출을 유도하고 환경 보호를 실현하는 데 목적이 있으며, 시민과 행정기관의 효율적인 활용을 돕기 위해 제공된다. 위치 기반 정보로서 대민 서비스, 환경정책 수립, 교육자료 등 다양한 분야에서 활용 가능하다.
