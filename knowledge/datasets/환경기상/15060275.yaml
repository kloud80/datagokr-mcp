summary_user: 광주광역시 북구에 사업장폐기물 배출자로 신고된 업체를 한 행씩 담은 건별 원장으로, 상호·폐기물 종류·사업장 도로명주소·데이터기준일자를 CSV 파일(약 79KB)로 제공한다. 주민이나 사업자가 '우리 동네 어느 업체가 어떤 종류의 사업장폐기물을 배출한다고 신고했나'를 확인하거나, 분석가가 북구 내 배출 사업장 분포를 주소 단위로 살펴보는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호명이나 주소(괄호 안 법정동명) 매칭으로만 이어 쓴다.
description_portal: 광주광역시 북구 사업장폐기물 배출자 신고현황 데이터입니다.광주광역시 북구에서 사업장폐기물 배출자로 신고된 업체의 상호, 폐기물종류, 사업장도로명주소, 데이터기준일자 항목에 대한 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 사업장도로명주소 컬럼의 각 셀마다 주소 끝부분에 추가로 별도 기재한 괄호 안의 동명은 모두 법정동으로 작성되었습니다. 또한, 법령이나 규정 등으로 인해 정확한 사업장도로명주소를 제공할 수 없는 일부 시설의 경우는 셀에 주소를 기재하지 않고 공란으로 두었습니다.
