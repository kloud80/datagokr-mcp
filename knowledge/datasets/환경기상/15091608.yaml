summary_user: 경상남도 의령군에 설치된 자동기상관측장비(AWS)의 목록을 장비 한 대당 한 행으로 담은 작은 파일(약 1.5KB CSV)로, 읍면·설치주소·설치연도·측정 항목·데이터기준일을 담는다. 의령군 지역 기상관측망을 분석하는 담당자나 연구자가 '어느 읍면에 관측장비가 있고 언제 설치됐으며 무엇을 재는가'를 확인하거나 장비 점검·교체 순서를 정하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 읍면명이나 설치주소를 이름·주소 기준으로 맞춰 연결해야 한다.
limits: 이 파일은 설치 현황 목록이라 실제 관측값(기온·강수 등 시간·일 자료)은 담지 않는다. 관측지점번호 같은 공통 키가 없어서 기상청 관측자료와 바로 붙일 수 없고, 범위도 의령군 한 곳에 그친다.
