description_portal: '계절관측 데이터는 계절의 빠르고 늦음의 지역적인 차이 등을 합리적으로 관특 및 통계 분석하여 기후변화의 추이를 통괄적으로 파악하기 위해 관측장소에서 관측차가 지정된 식물, 동물, 기후계절 등을 관측한 자료입니다.생산주기: 연보유기간: 1904년 ~ 현재(지점별, 요소별 상이함)(참고) 계절관측은 식물과 동물로 구분됩니다.식물계절관측:  벚나무, 개나리, 진달래, 목련, 은행나무, 단풍나무 등 주요 식물의 개화·만개·낙엽 시기,지역별·연도별로 관측하여 계절의 시작과 종료 시점 파악동물계절관측: 제비, 참새, 모시나비, 청개구리, 두꺼비 등 동물의 첫 출현·울음·산란 시기, 생태계 활동 개시 시점 변화 추적'
