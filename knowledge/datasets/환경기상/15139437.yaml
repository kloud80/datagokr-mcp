summary_user: 기상청 관측장소에서 지정된 식물(벚나무·개나리·진달래·단풍나무 등)의 개화·만개·낙엽 시기와 동물(제비·청개구리 등)의 첫 출현·울음 시기를 지점별·연도별로 기록한 전국 계절관측 자료이며, 포털 설명상 보유기간은 1904년부터이고 지점·요소마다 다릅니다. 연구자나 분석가가 "우리 지역 벚꽃 개화일이 수십 년 동안 얼마나 앞당겨졌나" 같은 기후변화에 따른 계절 변화 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 기상 관측 자료와는 관측지점 이름이나 기상청 지점 코드를 직접 맞춰 이어 써야 한다.
limits: 포털 활용신청과 별개로 외부 사이트(apihub.kma.go.kr)의 인증키를 발급받아 호출 경로에 넣어야 한다. 공간 좌표가 없는 비공간 자료여서 다른 데이터와는 이름·코드를 수작업으로 매핑해야 연결된다.
