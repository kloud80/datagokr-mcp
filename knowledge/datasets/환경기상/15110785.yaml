summary_user: 제주도 인근 해역 해양기상부이에서 관측한 풍속·기압·상대습도·기온·수온·파고·파주기 값을 측정 일자와 관측 정점(정점명·정점 코드, 위도·경도)별로 담은 CSV 파일이다. 해양 안전 관리자나 연구자가 특정 정점에서 높은 파고가 언제 관측됐고 그때 풍속·기압은 어땠는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 정점명·정점 코드를 이름으로 맞추거나 위도·경도 좌표로 다른 해양 관측·수질 데이터와 공간적으로 이어 쓴다.
description_portal: '제주특별자치도 내 해수면 기상환경관측 데이터를 제공합니다.항목: 측정 일자, 정점명, 정점 코드, 위도, 경도, 평균풍속, 평균기압, 평균상대습도 등* 제주특별자치도 해수면 기상환경관측 데이터는 제주도 인근 해역에서 측정된 해양기상부이 데이터를 제공합니다. 해양기상부이는 해수면 위에 설치된 부이에 다양한 기상 관측 장비를 장착하여 해양기상현상을 실시간으로 관측하는 장치로, 파고, 파주기, 풍속, 기압, 수온 등 해양 및 기상 요소를 동시에 측정할 수 있습니다.* 활용분야 : 해양 기상 모니터링, 해양 안전 관리, 해양 연구 및 교육, 해양 정책 수립 등"'
