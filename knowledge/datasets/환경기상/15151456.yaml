description_portal: 국립기상과학원 홈페이지의 간행물 메뉴는 기상·기후 분야 연구성과를 국민과 공유하기 위한 공간으로, 연구보고서, 기술자료, 정책정보지 등 다양한 형태의 간행물을 제공한다. 사용자는 해당 자료를 목록에서 확인하고, PDF 등 파일 형태로 열람하거나 다운로드하여 활용할 수 있다. 이를 통해 기상과학 연구의 투명한 공개와 사회·학문적 활용을 촉진하고, 기후 변화 대응과 예보기술 발전에 필요한 정보를 손쉽게 얻을 수 있다. 예시로 다음과 같은 보고서들이 게재되어있다.- 지구대기감시 보고서- 전지구통합온실가스정보시스템 도시 온실가스 가이드라인- 현업 해양예측시스템 개발(III)* [간행물 보기] 아래 저장 버튼을 클릭하면 PDF 형태로 다운로드 가능
