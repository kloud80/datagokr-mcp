summary_user: 기상청이 습도·일사·기온을 통합한 WBGT(습구흑구온도)를 바탕으로 노인·어린이·농업·비닐하우스·실외작업자 등 대상별 보정을 적용해 산출한 체감온도 예측값을, 지점(지점코드)과 지수 종류(지수코드)별로 예측 시점 43개 열(지수예측값1~43)에 담은 전국 범위 파일(zip, 약 188KB)이다. 실외작업장 안전관리자나 지자체 폭염 담당자가 '내일 우리 지역 실외작업자·노인의 체감온도가 관심·주의·경고·위험 중 어느 단계에 이르나'를 확인해 휴식·수분 섭취·작업 조정 권고를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 지점코드를 기상청 지점 목록 같은 같은 기관 코드나 이름 매핑으로 이어 써야 하며, 단기예보의 예보구역·격자(nx,ny)와 바로 맞물리지는 않는다.
description_portal: 세분화된 체감온도 데이터는 습도, 일사, 기온을 통합해 산출하는 WBGT(습구‑흑구 온도)를 기반으로 하며, 노인·어린이·농업·비닐하우스·실외작업자 등 다양한 대상과 환경에 따라 맞춤 보정치를 적용한 지수다. 이를 통해 폭염 특보와 연계한 관심·주의·경고·위험의 4단계 경고를 제공하고, 수분 섭취, 휴식, 활동 조절 등 온열질환(열사병, 열탈진 등) 예방을 위한 실질적인 대응 권고를 지원한다. 또한 이 지수는 기상, 보건, 산업안전 분야 전반에서 폭염 위험 관리와 정책 수립에 활용 가능한 핵심 정보로 제공된다.
accrual_periodicity: 수시
