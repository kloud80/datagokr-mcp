summary_user: 충청남도 부여군의 유해야생동물 포획을 건별로 담은 파일로, 보고일자·포획일자·개체 종류·포획유형·포획 개체수와 포획지의 시도·시군·상세주소·위경도 좌표를 기록한다. 부여군 농가나 지자체 담당자가 '어느 지역에서 어떤 종이 어느 계절에 많이 포획되는가'를 확인해 농작물 피해 예방 대책을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 시도·시군 이름 매핑이나 포획지 위경도 좌표로 다른 지역 포획 데이터·공간 레이어와 맞춰 쓴다.
description_portal: '이 데이터는 충청남도 부여군에서 2022년 6월 30일 기준으로 집계된 유해야생동물 포획 현황을 담고 있습니다. 주요 항목에는 포획일자, 동물 종명(예: 멧돼지, 고라니, 까치 등), 포획 장소, 포획 사유(농작물 피해, 인명 피해 우려, 서식지 확장 등), 포획 방법(덫, 총기, 포획틀 등), 처리 결과(폐사·방생·관리 이관 등), 담당 기관이 포함됩니다. 이를 통해 부여군에서 어떤 종이 자주 포획되는지, 포획의 주요 원인과 지역적·계절적 특성을 파악할 수 있습니다. 예를 들어 농경지 피해와 관련해 멧돼지나 고라니 포획이 집중될 수 있으며, 까치와 같은 조류는 생활 민원에 따라 포획 건수가 증가할 수 있습니다. 또한 포획 후 처리 결과를 분석하면 방생률과 폐사율을 비교할 수 있어 부여군의 야생동물 관리 정책의 성과와 한계를 확인할 수 있습니다. 이 자료는 부여군의 농작물 피해 예방, 인간-야생동물 갈등 관리, 생태계 보전 전략을 마련하는 데 기초자료로 활용될 수 있으며, 충청남도 전역의 유해야생동물 관리 데이터와 함께 비교 분석하면 지역별 특징을 더욱 명확히 파악할 수 있습니다.'
