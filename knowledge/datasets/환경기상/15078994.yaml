summary_user: 충청북도 보건환경연구원이 이동형 장비로 측정한 대기오염 결과를 시간(TIME)·측정항목(SE)·측정값(VALUE) 단위의 건별 기록으로 담는다. 고정식 측정소로는 잡기 어려운 특정 구간이나 시간대의 오염물질 농도 변화를 보려는 행정기관이나 연구자가 쓴다. 예를 들어 "이동측정 기간에 시간대별로 어떤 오염물질 농도가 높았나" 같은 질문에 답한다. 전역 조인 키가 없어 에어코리아 측정소 자료 등 다른 대기질 데이터와는 측정항목 이름이나 시간으로 맞춰 붙여야 한다.
description_portal: 충청북도 보건환경연구원이 수행하는 대기오염 이동측정 결과를 시간·측정항목·측정값 기준으로 조회할 수 있는 Open API로, 고정식 측정소만으로는 파악하기 어려운 환경의 미세한 변화를 이동형 장비를 통해 신속하게 확인할 수 있습니다. 이동측정 데이터는 특정 구간이나 이동 경로를 따라 나타나는 대기오염도 변화를 상세하게 관찰할 수 있어, 시간대별 오염물질 농도 변동을 보다 정교하게 분석하는 데 유용합니다. 행정기관은 이를 활용해 오염원 영향 진단, 환경 취약지점 모니터링, 대기질 관리 정책의 효과 검토 등 근거 기반의 의사결정을 수행할 수 있으며, 연구자·민간에서도 오염도 패턴 분석, 건강영향 연구, 환경데이터 기반 기술 개발 등에 다양하게 활용 가능합니다.
