description_portal: 이 데이터는 오르간 및 피아노 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지 파일과 동일한 수량의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더, 라벨링 파일은 ‘labels’ 폴더에 저장되어 있습니다. 데이터에는 다양한 형태와 크기의 오르간과 피아노가 실내 환경에서 촬영된 이미지가 포함되어 있고, 촬영 각도는 정면, 측면, 상단 등 다양하게 구성되어 있습니다. 악기의 본체, 건반, 페달 등 주요 구성 요소가 식별 가능하게 촬영되어 있습니다. 모든 라벨링 파일은 YOLO 형식으로 작성되었으며, 각 이미지 내 객체의 위치 좌표와 클래스명이 기록되어 있습니다. 데이터는 객체 탐지 및 분류 모델 개발에 활용할 수 있도록 일관성 있게 구성되어 있습니다.
