summary_user: 부산광역시 동부산권역(기장군 일원) 자연환경조사 중 종다양성조사 결과를 종 관찰 지점 단위로 담은 공간정보로, 종명·분류·보호종 여부·조사방법·조사일자와 경위도 좌표가 건별로 들어 있다. 기장군 일대에서 어떤 동식물이 어디서 관찰됐는지, 특히 보호종이 확인된 지점이 어디인지 알고 싶은 연구자·개발사업 검토자·환경단체가 쓴다. 전역 조인 키는 없어 다른 권역 조사나 전국자연환경조사 자료와는 종명·분류 이름 매핑 또는 위경도 좌표의 공간 중첩으로 이어 쓴다.
limits: 공통 코드 조인 키가 없어 다른 데이터와는 이름 매칭이나 좌표 기반으로만 연결된다. 범위는 부산 동부산권역에 한정되며 다른 권역은 별도 데이터셋을 찾아야 한다.
