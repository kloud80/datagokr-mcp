description_portal: ‘가로쓰레기통 현황’ 엑셀은 도심 내 설치된 가로 쓰레기통의 기본 정보를 체계적으로 관리하기 위한 데이터입니다. 주요 항목으로는 위치, 재활용/일반쓰레기 구분, 설치장소유형, 설치위치가 있습니다.‘위치’는 쓰레기통이 실제로 설치된 주소 또는 좌표를 나타내며, 관리·유지보수를 위한 공간 정보를 제공합니다. ‘재활용/일반쓰레기 여부’는 쓰레기통의 용도를 구분해 분리수거 관리 효율성을 높이기 위한 항목으로, 재활용품 전용인지, 일반쓰레기용인지 명시합니다. ‘설치장소유형’은 쓰레기통이 놓인 환경을 구분하는 항목으로, 예를 들어 도로변, 공원, 버스정류장, 보행로 등과 같이 설치 배경을 보여줍니다. 마지막으로 ‘설치위치’는 보다 세부적인 위치 정보를 나타내며, 예를 들어 ‘횡단보도 앞’, ‘지하철 출입구 옆’ 등과 같이 시민 이용 행태를 반영한 세밀한 위치를 기록합니다.이 데이터는 도시 미관 개선, 쓰레기 수거 효율화, 정책 수립 등 다양한 행정적 의사결정의 기초자료로 활용될 수 있습니다.
