description_portal: 본 데이터는 환경분야 기술개발성과(R&D)에 대한 대국민 및 정부 대상 홍보 실적  정보를 제공하는 공공데이터입니다. 홍보 유형, 제목/명칭, 매체명, 홍보 일자 등 ‘순번’, ‘사업명’, ‘연구과제명’, ‘연구기관’, ‘연구기관유형’, ‘과제시작일’, ‘과제종료일’,  ‘성과년도’, ‘홍보유형’, ‘제목/명칭’, ‘매체명’, ‘홍보 일자’ 등 다수 필드를 포함하며, 홍보 채널 및 시기별 성과 현황을 한눈에 파악할 수 있도록 정리되어 있습니다. 홍보 담당자와 연구 관리자, 정책 입안자 및 대국민 소통 관계자는 홍보 전략 수립, 성과 평가, 홍보 효과 분석, 대외 커뮤니케이션  자료 준비 등에 활용할 수 있습니다.
