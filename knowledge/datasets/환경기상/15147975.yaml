summary_user: 국가소음 측정망 중 도로소음 수동 측정지점별로 지점명·주소와 연도·반기 단위의 8시·16시·야간 등가소음, 소음통계레벨(L10), 소형·대형 차량 수, 평균차속을 담은 전국 범위 CSV 파일(약 13KB)이다. 우리 동네 도로변 소음이 시간대별로 얼마나 되고 대형차 통행·차속과 어떤 관계가 있는지 확인하려는 주민이나 교통·환경 분석가가 쓴다. 전역 조인 키가 없어 지점주소를 좌표·행정구역으로 바꾸거나 지역·지점명을 매핑해 다른 소음 측정망·교통량 자료와 이어 쓴다.
