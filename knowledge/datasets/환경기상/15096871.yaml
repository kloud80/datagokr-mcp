summary_user: 제주 주요 지역(제주시·서귀포시·성산·고산 등)의 기후 상태를 지역 구분과 기준 연월별로 정리한 집계 기상 자료로, 평균기온·강수량·평균상대습도·해면기압·이슬점온도·운량·일조시간·최심신적설·평균풍속을 담는다. 농업·관광 분석가가 '최근 몇 년 사이 고산과 성산의 강수량과 일조시간이 어떻게 달라졌나'처럼 제주 지역 간 기후를 비교하거나 추세를 살필 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 제주 통계와는 지역 구분 이름과 기준 연월을 맞추거나 같은 기관 코드로 연결한다.
description_portal: '이 데이터셋은 제주특별자치도 내 주요 지역(예: 제주시, 서귀포시, 성산, 고산 등)을 대상으로 최근 수년간의 기후 상태를 연 단위로 정리한 기상 개황 정보이다. 항목으로는 연평균 기온, 연평균 최고·최저기온, 평균 습도, 평균 해면기압, 이슬점 온도, 평균 풍속 등이 포함되며, 더불어 연간 최고기온, 최저기온, 최소 습도, 최대 풍속, 순간 풍속 등의 극값도 제공된다. 또한 강수량 자료는 2017년부터 최신 연도까지 포함되어 있어, 제주 지역의 강수 패턴 변화를 파악할 수 있다. 본 자료는 제주도의 기후 특성 분석, 기후 변화 추세 관찰, 농업·관광·도시계획 분야의 기후 조건 고려, 재난 대비 및 환경정책 수립, 생활환경 및 인프라 설계 등의 정책 결정 및 연구의 기초 자료로 활용될 수 있다. 제공기관은 제주특별자치도이며, 공개된 CSV 형식으로 누구나 다운로드하여 활용 가능하다.'
