description_portal: 환경부 국립환경과학원 환경영향평가 사업의 농약사후조사를  사업코드, 응답타입을 기준으로 조사된 농약조사정보의 속성(조사지점명, 좌표, 주소, 조사시작일, 조사종료일, 조사정보(아세페이트, 디클로플루나이드 등)을 조회하는 기능과  공간좌표(좌표체계, 응답 형태 및 검색범위)를 기준으로 수질 농약조사지점의 피쳐 정보(좌표데이터, 공간인덱스, 사업지점 명 등)를 조회하는 기능 및 공간좌표(좌표체계, 지도범위, 너비/높이)를 기준으로 수질 농약조사지점의 포인트 이미지를 조회하는 기능을 제공하는 서비스 입니다.
team:
  dept: 기후국토환경연구과
services:
  - op: /getWAIvstgWMS
    name: 농약조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/WaterqualityAgchmService/getWAIvstgWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: '좌표 체계를 나타냅니다. '
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getWAIvstg
    name: 농약조사속성조회
    endpoint: https://apis.data.go.kr/1480523/WaterqualityAgchmService/getWAIvstg
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: type
        required: false
        desc: 응답받을 xml/json 타입
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getWAIvstgWFS
    name: 농약조사지점WFS조회
    endpoint: https://apis.data.go.kr/1480523/WaterqualityAgchmService/getWAIvstgWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        example: EPSG:3857
        desc: 좌표체계
      - name: maxFeatures
        required: false
        example: '10'
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: false
        example: results
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        example: 14043762.385990309,4388248.448613541,14071298.825430045,4403134.55987208
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: true
