summary_user: 환경영향평가 사업의 농약 사후조사 결과를 조사지점 단위로 담으며, 조사지점명·좌표·주소·조사 기간과 농약 성분별 조사값(아세페이트 등)을 전국 범위에서 제공한다. 개발사업 주변 수질에 어떤 농약이 얼마나 검출됐는지 확인하려는 환경 분석가나 주민이 특정 사업의 사후조사 지점과 결과를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 사업코드(mgtNo)를 환경영향평가 협의 현황 등 같은 기관 데이터에서 먼저 받아 넘기고 지점 이름·좌표로 다른 데이터와 맞춰 쓴다.
limits: 조회에는 사업코드(mgtNo)와 지도 범위·좌표체계 등 다른 데이터에서 얻어야 하는 값이 필수이며, 최소 파라미터로는 공간 피처·이미지 오퍼레이션(/getWAIvstg, /getWAIvstgWMS)이 응답하지 않았다. 사업별 조사 시점에 생성된 뒤 바뀌지 않는 이벤트성 데이터라 정기적 수질 추이 관측용으로 보기 어렵다.
