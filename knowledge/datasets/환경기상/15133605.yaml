description_portal: 해당 데이터는 경상북도 영천시에 소재하는 사업장에 설치된 대기배출시설 설치 현황을 상세하게 나타낸 자료입니다. 영천시 내에 위치한 다양한 산업체들의 대기배출시설 등록 현황을 파악할 수 있으며, 사업장명, 소재지, 업종, 설치시설의 종류와 수량, 배출시설의 구체적 내용 등을 포함하고 있습니다. 이를 통해 지역 내 산업 활동의 환경 영향을 분석하거나, 환경 정책 수립 및 관리에 활용할 수 있는 중요한 자료입니다.대기환경보전법 제23조에 의거하여 배출시설별로 허가 또는 신고를 해야하며 기존 허가 또는 신고를 득한 사업장에 신규 대기배출시설을 추가할 경우 기존 허가(신고)증에 신규 배출시설을 추가하여 이를 관리하여야 합니다.해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 환경보호과로 연락주시기 바랍니다.
