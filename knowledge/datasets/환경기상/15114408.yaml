summary_user: 해양수산부가 지정한 해양보호생물을 종 단위로 한 건씩 담은 도감형 데이터로, 종명·영문 학명, 생물 종류, 문·강·목·과 분류체계(한글·영문), 분포, 형태·생태적 특징, 보호종 지정 사유, 특이사항, 참고문헌을 전국 범위의 비공간 정보로 제공한다. 교사·콘텐츠 제작자·연구자가 '이 생물이 해양보호생물인지, 왜 보호종으로 지정됐고 어디에 분포하는지'를 확인하거나 교육자료·보고서를 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 종명(mrpoSpcKornNm)이나 영문 학명 같은 이름 매칭으로만 연결하며, 해양보호구역 등 같은 기관의 해양공간 규제 데이터와 함께 참고하는 식으로 쓴다.
limits: 좌표나 행정구역 코드가 없는 비공간 데이터라 분포 내용은 서술형 텍스트로만 있고 지도 위 서식지나 관측 위치는 알 수 없다. 공통 코드가 없어 다른 생물·구역 데이터와 붙일 때는 종명 표기 차이를 직접 맞춰야 한다. 호출에는 포털 활용신청(자동승인) 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
