description_portal: 이 데이터는 해양수산부에서 해양보호생물의 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해양보호생물의 종 영문명, 종명, 생물 종류, 문 및 강·목·과의 영문명과 한글명, 해당 생물의 분포, 형태적 특징, 생태적 특징, 보호종 지정 사유, 특이사항, 참고문헌 등 정보로 구성되어 있습니다.  본 데이터는 관련 기관에서 해양생물의 서식 분포 연구, 보호종 지정 기준 분석, 생물 분류체계 확인, 교육자료 제작, 해양생태계 보전 정책 수립, 각종 보고서 및 해양생물 관련 콘텐츠 제작 등에 활용될 수 있습니다.
