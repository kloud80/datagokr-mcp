description_portal: 고양시에는 빗물을 모아 다시 활용할 수 있는 빗물이용시설이 설치되어 있습니다. 이 시설들은 학교, 공공청사, 아파트 등 다양한 장소에 설치되어 있으며, 빗물을 모아 저류조에 저장한 뒤 여과나 침전 과정을 거쳐 깨끗하게 활용합니다. 이렇게 모아진 빗물은 화장실 세정수, 조경 용수, 도로 청소, 하천 유지용수 등으로 사용되어 수돗물 사용을 줄이고, 환경을 지키는 데 도움을 줍니다.이번에 제공되는 자료에는 고양시 내 빗물이용시설의 이름, 위치(주소), 설치 시기, 여과 처리 방식, 저장 용량, 활용 용도 등이 정리되어 있습니다. 시민 여러분께서는 이 정보를 통해 우리 주변에서 빗물이 어떻게 활용되고 있는지 확인할 수 있으며, 물 절약과 친환경 생활에 대한 관심을 넓히는 데 도움이 될 것입니다.
