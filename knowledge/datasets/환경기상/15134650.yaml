description_portal: 환경책임보험 전산망에서는 보험 가입 및 대상 사업장의 환경 관련 시설 보유 현황을 통계적으로 관리하기 위해 다양한 항목을 기반으로 데이터를 수집 및 분석합니다. 통계기준일자는 해당 통계가 산정된 기준 날짜를 의미하며, 책임/보장계약구분은 계약 유형을 구분하여 책임보험 또는 보장성 보험 여부를 표시합니다. 사업장규모는 대규모·중소규모 등 사업장의 규모를 분류하며, 책임보험적용연월은 보험이 실제로 적용된 연월을 나타냅니다.환경영역별로는 각 시설의 보유 여부와 지역별 관할 구분, 그리고 시설의 세부 분류까지 포함되어 있습니다. 예를 들어, 대기시설 보유유무, 대기관할지역구분, 대기시설 종별, 수질시설 보유유무, 수질관할지역구분, 수질시설 종별, 폐기물시설 보유유무, 폐기물관할지역구분, 토양시설 보유유무, 토양관할지역구분, 화학시설 보유유무, 화학관할지역구분, 해양시설 보유유무, 해양관할지역구분 등은 각각의 환경오염 유발 가능성이 있는 시설의 존재 여부 및 관리 구역을 구체적으로 분류합니다.또한 의무가입대상구분은 법령에 따라 보험 가입이 필수적인 시설인지 여부를 구분하며, 보험가입여부는 실제 가입이 이루어졌는지를 확인하는 항목입니다. 마지막으로 사업장상태구분은 폐업, 휴업, 정상 운영 등 사업장의 현재 운영 상태를 표시하여 전체 통계의 정확성과 활용도를 높이는 데 기여합니다. 이처럼 통합적인 정보 수집을 통해 정책 수립, 감독 관리, 보험 제도 개선 등 다양한 행정적·통계적 활용이 가능합니다.
