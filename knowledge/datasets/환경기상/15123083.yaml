summary_user: 항공기상청이 생산하는 METAR(정시기상관측전문)·LOCAL 등 항공기상관측 전문을 관측시각·발표공항·전문상태와 함께 전문 원문(전문내용) 단위로 담은 xlsx 파일로, 활용신청 없이 내려받는다. 항공·공항 운영 분석가가 특정 공항의 특정 시각에 풍향·풍속, 시정, 기온, 운량이 어땠는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기상관측 자료와는 공항 이름이나 관측시각을 직접 맞춰서만 이어 쓴다.
limits: 풍향·풍속·시정 같은 요소가 별도 컬럼이 아니라 전문 원문 안에 들어 있으므로, 수치 분석에는 항공기상청 누리집의 항공기상 관측지침을 참고해 전문을 해독해야 한다. 관측지점번호 같은 공통 키가 없어 ASOS·AWS 자료와 바로 조인되지 않는다.
