description_portal: 항공기상청에서 METAR(정시기상관측전문)과 LOCAL(로컬 전문) 등 다양한 항공기상관측 전문을 실시간으로 생산·제공하고 있습니다. 이러한 자료는 항공기의 이착륙, 비행계획 수립, 공항 운영 등에 필수적으로 활용되는 중요한 기상정보로, 풍향·풍속, 시정, 기온, 운량 등 활주로 주변의 실제 기상 상태를 반영합니다.기상전문의 구성요소, 작성 기준, 용어 설명 등은 항공기상청 대표 누리집(amo.kma.go.kr)의 ‘알림자료 > 법령지침’ 게시판에 게시된 "항공기상 관측지침"을 참고하시기 바랍니다.
