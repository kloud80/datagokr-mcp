description_portal: 우리나라 기후의 표준값인 기후평년값(1981~2010년)을 근간으로 지역별 기후특성을 상세하게 보여줍니다.우리나라의 지역적 기후특성을 상세하고 가시적으로 보여주기 위하여 기후평년값을 비롯한 기후정보를 공간적으로 분석한 ‘한국기후도’입니다.본 한국기후도는 농업과 기후 분석 등 여러 분야에서 활용할 수 있도록 기후평년값과 식물성장 가능기간, 계절관측값, 기상현상 등 111종의 기후정보를 분포도 형태의 그래픽으로 표현하였습니다. 기온과 강수량의 연대별 변화 경향 등의 부가정보와 일사·일조, 풍향별 월간횟수의 백분율, 월 최대풍속에 대한 분포도도 함께 수록되어 있어 태양광·풍력과 같은 신재생에너지 정책 등의 인접 분야에 다양하게 활용될 것으로 기대됩니다.
