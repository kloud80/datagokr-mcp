summary_user: 경상남도 진주시 관내 사업장폐기물 배출자 신고 사업장을 한 행에 한 곳씩 담은 원장으로, 사업장명·사업장주소·배출 폐기물의 종류를 담는다(CSV 약 12KB). 진주시에서 어떤 사업장이 어떤 종류의 사업장폐기물을 배출한다고 신고했는지 확인하려는 주민·폐기물 처리 사업자·분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 사업장명·주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 폐기물관리법 제17조제2항 및 폐기물관리법 시행규칙 제18조제4항의 규정에 의해  사업장폐기물 배출자는 사업장폐기물의 종류와 발생량 등을 환경부령으로 정하는 바에 따라 특별자치시장, 특별자치도지사, 시장ㆍ군수ㆍ구청장에게 신고하여야 함에 따라, 경상남도 진주시  관내 폐기물 배출 사업장의 명칭, 폐기물배출 사업장의 주소, 해당 사업장에서 발생되는 폐기물의 종류 등의 정보를 제공합니다.(2026년 6월 1일 현행화)＊보유근거:폐기물관리법 제17조제2항 및 폐기물관리법 시행규칙 제18조제4항
