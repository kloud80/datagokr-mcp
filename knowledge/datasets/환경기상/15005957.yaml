summary_user: 부산광역시 북구 관내에서 폐기물처리업 허가를 받고 영업 중인 업체(지정폐기물 제외)의 상호·소재지·업종·영업대상·전화번호를 업체별로 담은 작은 CSV 파일(약 3KB)이며, 포털 설명에 따르면 현재 북구에는 수집운반업체만 있다. 북구 주민이나 사업장이 사업장폐기물이나 건설폐기물 수거를 맡길 관내 수집운반업체와 연락처를 찾을 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 시군구 폐기물처리업 현황이나 인허가 데이터와는 상호·주소를 맞춰 대조해야 한다.
description_portal: '[부산광역시 북구_폐기물처리업 현황]부산광역시 북구 관내 폐기물처리업(지정폐기물 제외) 현황에 관한 데이터로, 폐기물 처리업체의 업체명, 소재지 및 영업대상과 전화번호 등의 항목을 제공합니다.폐기물 처리업 현황 정보는 부산광역시 북구 관내에 폐기물처리업 허가를 받고 영업중인 업체입니다.부산광역시 북구에는 현재 폐기물처리업(지정폐기물 제외) 중 수집운반업체만 있으니 참고하시길 바랍니다.[데이터변경안내] 위 자료는 2025년 6월 16일 기준으로 자료 업데이트 되었습니다. 1년마다 업데이트 될 예정입니다.'
