description_portal: '본 데이터는 국립생물자원관이 수행한 생물종 유전정보 분석 연구 과정에서 확보·정리한 DNA 바코드 분석 및 계통유연관계 연구에 활용되는 프라이머 서열 정보를 제공합니다.프라이머(Primer)는 특정 유전자 영역(예: COI, ITS, rbcL 등)을 증폭하기 위해 사용되는 짧은 염기서열로, 유전정보 분석 및 분자생물학 실험의 핵심 도구입니다.이 데이터는 생물 분류군에 따라 사용된 프라이머 쌍(Forward/Reverse)의 염기서열 정보, 대상 유전자 영역, 적용 생물군, PCR 조건, 서열 길이, 참조 논문 또는 라이브러리 출처 등으로 구성되어 있으며, 국내 자생종 및 국가표준 바코드 구축 연구에 활용된 검증된 정보입니다.또한, 프라이머 서열의 활용 목적(예: 종 동정, 종간 비교, 계통 분석 등) 및 사용 시 주의사항도 함께 제공되어, 신규 표본 분석, 표준 바코드 생산, 생물자원 동정 및 분류학적 연구 등에서 유용하게 활용될 수 있습니다.'
