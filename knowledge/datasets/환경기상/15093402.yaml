summary_user: 실내공기질 관리 적용대상 다중이용시설의 시도·시군구, 시설명, 사업자등록번호, 시설군을 시설 한 곳당 한 행으로 담은 전국 목록 파일로, 검증 수신 기준 27,817행이다. 지역별로 어떤 시설이 실내공기질 관리 대상인지, 특정 사업장이 대상 시설군에 속하는지 확인하려는 분석가나 사업자가 쓴다. 사업자등록번호(bizno)를 조인 키로 삼아 같은 키를 가진 다른 사업자 단위 데이터와 이어 쓰고, 시도·시군구 값으로 지역별 집계에 연결한다.
description_portal: 실내공기질 관리법에 따라 한국환경공단에서 운영하는 실내공기질 관리 종합정보망(www.inair.or.kr)에 등록된 다중이용시설 정보를 제공합니다.실내공기질 관리 적용대상인 25개 시설군에 대한 시도, 시군구별, 시설명, 사업자등록번호, 시설군 목록 정보를 제공합니다.
