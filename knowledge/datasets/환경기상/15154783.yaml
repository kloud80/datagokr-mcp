description_portal: 본 데이터는 전국에서 운영 중인 광역환경교육센터 및 기초환경교육센터의 현황 정보를 체계적으로 제공하기 위해 구축된 자료입니다.환경교육센터는 지역사회 환경교육의 중추 역할을 수행하는 기관으로, 환경교육 기반 조성, 교육 프로그램 운영, 지역 환경 문제 대응 등 다양한 역할을 담당하고 있습니다.특히 광역환경교육센터는 각 광역지자체에서 지정·운영하며 지역 단위 환경교육의 허브 기능을 수행하고, 기초환경교육센터는 기초지자체를 중심으로 보다 생활권에 밀착된 환경교육 서비스를 제공합니다.본 데이터는 이러한 센터들의 정보를 통합적으로 제공하여 국민과 교육 관계자가 쉽게 활용할 수 있도록 구성되었습니다.
