status: active
summary_user: 한국남부발전 사업소별(구분) 연도별 온실가스 배출량을 직접배출(Scope1)과 간접배출(Scope2)로 나눠 만tCO2-eq 단위로 담은 집계 파일이며, 연도가 열로 펼쳐진 넓은 표 형태로 2015년부터 2025년까지의 열을 가진 약 2KB 크기의 CSV다. 분석가나 정책 담당자가 '남부발전의 어느 발전소에서 직접배출이 가장 많고, 최근 10년간 줄었는가'처럼 발전소별 배출 추세와 저감 효과를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 배출시설·TMS 데이터와는 사업소 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 표준 사업장 코드나 사업자번호 같은 조인 키가 없어 다른 배출원 데이터와 자동 결합이 어렵고, 사업소명을 직접 맞춰야 한다. 행정단위가 없는 전국·비공간 자료라 지역별 분석에는 바로 쓰기 어렵다.
