description_portal: 이 데이터는 한국남부발전 각 사업소의 연도별 온실가스 배출 현황을 정리한 자료로, 직접배출(Scope1)과 간접배출(Scope2) 배출량을 나누어 제공합니다. 배출량 단위는 만tCO2-eq로, 2015년부터 2024년까지의 장기 추세를 확인할 수 있습니다. 이를 통해 발전소별 온실가스 배출 특성을 비교하고, 배출 저감 정책의 효과와 친환경 설비 도입의 영향을 분석할 수 있습니다. 연구자와 정책 입안자에게는 탄소중립 전략 수립과 기후변화 대응 연구에 활용될 수 있으며, 일반 국민은 에너지 산업이 환경에 미치는 영향을 쉽게 이해할 수 있습니다. 또한 기업의 ESG 경영 성과를 검증하고, 지속가능한 발전 목표 달성 여부를 평가하는 데 중요한 기초 자료로 활용될 수 있습니다.
