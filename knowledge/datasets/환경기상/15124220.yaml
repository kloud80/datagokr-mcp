description_portal: 본 데이터는 속리산국립공원 구역 및 인근 도로에서 발생한 야생동물 로드킬(도로사고로 인한 생물사고) 사례를 기록한 자료로, 생물다양성 보전 및 국립공원 내 탐방로·도로 구간의 안전관리를 위한 기초 정보로 활용됩니다. 각 사고 건별로 발생 일자, 위치 정보(도로명, 위도·경도), 사고 발생 시각, 피해 생물종(국명 및 학명), 분류군(포유류, 조류 등), 개체 수, 발견자 또는 신고자, 처리 여부, 관련 기관, 사진자료 여부 등의 항목이 포함됩니다. 본 자료는 로드킬 다발 구간 분석, 생태통로 설치 타당성 검토, 야생동물 이동 경로 추적, 멸종위기종 보호 대책 수립, 탐방객 대상 도로안전 안내 서비스 개발 등에 활용되며, 국립공원 재난안전 플랫폼 및 생물자원통합관리시스템과 연계한 공간분석 및 통계관리에도 적합합니다. 데이터는 CSV 포맷으로 제공됩니다.
