summary_user: 기상청이 기상특보를 발표하는 육상·해상 특보구역의 코드 정보를 담은 기준 데이터로, 포털 설명에 따르면 한파·건조·안개·폭염·호우·대설·태풍·풍랑·강풍 등 기상현상별 주의보·경보가 178개 시·군과 44개 해역 단위로 나뉘어 발표된다. 특보 발표 내용에 나오는 구역코드가 어느 지역·해역을 가리키는지 확인하려는 분석가나 서비스 개발자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 기상청 특보 데이터와는 특보구역코드로 연결하고 다른 기관 데이터와는 구역 이름 매핑으로만 연결한다.
limits: 특보 발표 이력이나 현재 발효 중인 특보 내용이 아니라 구역 코드 기준 정보이며, 행정구역 코드 같은 전역 키가 없어 다른 데이터와 바로 붙지 않는다. 포털 활용신청과 별개로 기상청 API허브(apihub.kma.go.kr) 인증키를 경로 파라미터(KEY)로 넣어야 호출된다.
