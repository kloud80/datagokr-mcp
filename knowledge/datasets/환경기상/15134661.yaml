description_portal: 환경책임보험 전산망에서는 보험 가입 현황과 의무 가입 대상 구분을 체계적으로 관리하기 위해 다양한 통계 항목을 운영하고 있습니다. 통계기준일자는 해당 통계가 산출된 기준 날짜를 나타내며, 최신 데이터를 기반으로 현황 파악이 이루어집니다.책임/보장계약구분은 보험 계약의 유형을 구분하여 책임보험과 보장성 보험을 명확히 구별하며, 각각의 계약별 통계와 관리가 가능합니다. **시설구분1(시설별기준)**은 환경오염 관련 시설을 유형별로 구분하여, 대기, 수질, 폐기물, 토양, 화학, 해양 등 다양한 환경 시설별 현황을 분석하는 데 활용됩니다.마지막으로, 의무가입대상구분은 법적으로 보험 가입이 의무화된 대상인지 여부를 표시하여, 의무 가입 대상 사업장에 대한 통계와 관리가 체계적으로 이루어질 수 있도록 지원합니다. 이러한 통계 정보는 환경책임보험 제도의 적정 운영과 법적 준수 여부 점검, 정책 수립에 중요한 근거 자료로 활용됩니다.
