summary_user: 경기도에서 환경관리대행기관으로 지정 또는 지정변경을 신청한 사업장의 신청 이력을 건별로 담는다. 신청일·승인일·처리상태, 유독물·대기·수질 분야 여부, 실험실 구분(자가/대행계약)과 계약 업체 정보가 함께 들어 있다. 환경 규제 대상 사업자나 분석가가 "경기도에서 대기·수질 분야 대행기관으로 승인된 업체는 어디이고 실험실은 직접 운영하는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 사업자등록번호(bizregno)나 사업장명·주소를 매핑해 다른 인허가 사업장 자료와 연결한다.
description_portal: 이 데이터는 경기도 내 환경관리대행기관으로 지정 또는 변경을 신청한 사업장의 신청 이력을 기록한 자료로, 대행업체의 정보, 신청일 및 승인일, 신청 항목별 분야(유독물, 대기, 수질), 실험실 운영 형태 등을 포함하고 있습니다. 주요 항목은 사업장명, 사업자번호, 업종코드 및 업종명, 등록구분(지정/지정변경), 처리상태, 승인일, 실험실구분(자가 또는 대행계약), 실험실 주소 및 대행계약 업체명과 등록번호 등이 있습니다. ‘환경관리대행기관’은 대기 및 수질오염 등 환경 규제 대상 사업장을 대신하여 환경관리 업무를 수행하며, 환경부 또는 지자체의 지정을 받아야 활동이 가능합니다. 이 데이터는 대행기관 현황 파악, 지역별 환경관리 역량 분석, 대행업무의 법적 이행 여부 검토 등에 활용될 수 있습니다.
