summary_user: 전국 대기환경 측정소 688곳의 제원(측정망 구분, 시도·도시·군구, 측정소코드, 측정소명, 주소, 위도·경도)을 측정소 한 곳당 한 행으로 담은 CSV 파일이다. 내 동네 가까운 측정소가 어디에 있고 어떤 측정망(도시대기·도로변·교외·항만 등)에 속하는지 찾는 국민이나 분석가의 질문에 쓴다. 위도·경도 좌표와 주소를 키로 지도나 다른 지역 데이터와 잇고, 측정소코드로 측정소별 시간별 대기질 자료와 연결해 쓴다.
description_portal: 대기환경보전법 제3조(상시측정) 등 대기환경측정망은 목적에 따라 환경부 및 지방자치단체에서 12개 종류로 구분하여 측정망을 구성하고 있습니다.본 데이터는 도시대기측정망, 도로변대기측정망, 국가배경농도측정망, 교외대기측정망, 항만측정망의 측정소 제원(측정망, 시도, 도시, 측정소코드, 측정소명, 주소, 위도, 경도)에 대한 현황 정보입니다.도시대기측정망은 도시지역의 평균 대기질 농도를 파악하여 환경 기준 달성 여부를 판정하며, 도로변대기측정망은 자동차 통행량과 유동인구가 많은 도로변 대기질을 파악하기 위한 측정망입니다.국가배경농도측정망은 국가적인 배경 농도를 파악하고 외국으로부터의 오염물질 유입, 유출 상태 등을 파악하며, 교외대기측정망은 도시를 둘러싼 교외 지역의 배경 농도를 파악하기 위한 측정망입니다.항만측정망은 항만 지역의 대기질 현황 및 변화에 대한 실태 조사를 위한 측정망입니다.
