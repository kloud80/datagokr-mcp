summary_user: 항공기상청이 발표한 공항예보(TAF)를 공항별로 담으며, 발표 시각(tmFc)마다 풍향·풍속·기온·해면기압(QNH) 같은 예보 요소를 제공한다. 조종사·운항관리 담당자나 여행객이 '내일 아침 제주공항의 바람과 기온이 어떻게 예보되었나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 공항 코드(icaoCode)나 공항명으로 같은 기관의 공항 관측자료 등과 이름·코드 매핑해서 잇는다.
limits: 포털 활용신청과 별개로 apihub.kma.go.kr 인증키(경로 파라미터 KEY)를 따로 발급받아야 호출된다. 행정구역 단위가 아닌 비공간 공항 단위 자료여서 예보구역·격자 기반 일반 날씨 데이터와 바로 결합되지 않는다.
