summary_user: 기상특보를 발표하는 육상·해상 구역의 코드와 구역명을 목록으로 담은 파일 데이터로, 전국 413행 규모이다. 특보 통보문에 나온 지역이 어느 특보구역인지 확인하려는 분석가나 개발자가 구역코드를 찾는 질문에 쓴다. 전역 조인 키는 없어서 구역명 매핑이나 같은 기관의 구역 코드를 통해 특보·예보 자료와 이어 쓴다.
description_portal: 기상청에서 발표하는 육상 및 해상의 기상특보구역코드 정보입니다.한파, 건조, 안개, 폭염, 지진해일, 폭풍해일, 호우, 대설, 태풍, 풍랑, 강풍 , 열대야 기상현상에 대해 중대한 재해발생이 예상될 때 해당 지역에 대하여 기상특보의 발표 기준에 따라 주의보 및 경보로 구분하여  시 · 군 단위와 해역으로 세분화하여 발표합니다.특보 통보문 자료를 DB에서 조회하고, CSV파일로 다운로드 받을 수 있습니다.특보발표기준은 날씨누리(https://www.weather.go.kr/w/community/knowledge/standard.do)에서 확인가능합니다.
