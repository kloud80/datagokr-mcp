summary_user: 전라남도 보성군 관내 음식물 폐기물 다량배출 사업장을 한 곳씩 상호·전화번호·지번주소로 정리한 건별 목록 파일(CSV 약 5.8KB)이다. 군청 환경 담당자나 음식물 처리·수거 사업자가 '보성군에서 음식물을 다량으로 배출해 관리 대상이 되는 사업장은 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소(사업장지번주소)를 주소 정제·지오코딩해 행정구역이나 위치로 잇거나 상호 이름 매칭으로만 연결한다.
description_portal: 본 데이터는 전라남도 보성군 관내 음식물 폐기물을 다량 배출하는 사업장의 현황을 정리한 자료이다. 주요 항목으로 사업장명, 전화번호, 소재지 등이 포함되며, 해당 사업장들의 음식물 폐기물 발생량 관리를 위한 기초 정보를 제공한다. 이를 통해 관련 기관은 음식물 폐기물의 배출 특성을 분석하고, 위생 및 환경관리 정책 수립에 활용할 수 있다. 또한, 음식물 처리시설과의 연계를 통해 자원순환 및 폐기물 감축을 도모하는 데 기여한다. 본 데이터는 음식물 폐기물 관리 체계를 효율적으로 구축하고, 사업장의 환경영향을 최소화하기 위한 기초자료로서 의미를 가진다. 정기적으로 갱신되어 최신 정보를 제공하며, 음식물 폐기물 배출 현황을 정확하게 파악하는 데 도움을 준다.
