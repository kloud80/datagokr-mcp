summary_user: 인천환경공단 승기사업소 주변(연수구 동춘동, 송도 등) 악취 발생 구역에서 측정일자·측정지점별로 직접 측정한 복합악취 희석배수를 주소와 위도·경도 좌표와 함께 건별로 담은 CSV 파일(약 26KB)이다. 송도·동춘동 주민이나 환경 분석가가 "우리 동네 어느 지점에서 어느 달에 악취가 높게 측정됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어 측정 좌표(위도·경도)나 주소를 기준으로 지도·행정구역 데이터에 공간 매핑하거나, 같은 기관의 다른 사업소 악취 측정 데이터와 이름으로 맞춰 이어 쓴다.
description_portal: 인천환경공단 승기사업소 주변(연수구 동춘동, 송도 등) 악취 발생 구역에 대해 각 장소별로 직접 측정한 자료를 CSV형태의 파일로 개방중입니다.개방 자료에는 승기사업소의 매월 측정일자와 측정 장소명, 세부주소, 측정 좌표 자료(x, y축 위도 경도 좌표) 및 악취 측정 값을 개방하고 있습니다.해당 자료는 1년 주기로 개방하고 있으며, 연 1회 개방을 실시하고 있음을 알려드립니다.해당 자료에 대한 피드백 또는 수정사항이 필요하거나 문의사항이 있는 경우 공공데이터 포털을 통해 문의를 주시면 반영하도록 하겠습니다.
