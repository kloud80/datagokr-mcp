summary_user: 춘천시의 석면조사 대상 건축물을 건물(동) 단위로 한 줄씩 담은 원천 목록으로, 건축물명·주소·석면 건축물 여부·안전관리인 지정 여부·연면적·석면면적을 포함하며 범위는 춘천시 한 곳이다. 시민이나 부동산·리모델링 관련 사업자가 "우리 동네 또는 거래하려는 건물이 석면 건축물인지, 석면 면적은 얼마이고 안전관리인이 지정돼 있는지"를 확인할 때 쓴다. 전역 조인 키(건물관리번호·사업자번호 등)가 없어 다른 데이터와는 주소나 건축물명을 문자열로 맞춰 건축물대장·주소 데이터와 이어 쓰거나, 같은 기관(춘천시)의 다른 환경 데이터와 나란히 보는 정도로 연결한다.
description_portal: 2012년 4월 29일 공포된 「석면안전관리법」 제21조 및 동법 시행령 제29조, 시행규칙 부칙 제3조에 따라, 일정 규모 이상의 공공시설물은 2014년 4월 28일까지, 그 외 민간시설물은 2015년 4월 28일까지 석면조사를 의무적으로 완료해야 합니다. 이 법령은 건축물에 사용된 석면 함유 자재로 인한 시민의 건강 피해를 사전에 예방하기 위한 조치로, 석면조사 결과는 관리계획 수립 및 사후 조치의 기초 자료로 활용됩니다. 이에 따라 춘천시는 석면조사 대상 시설물 현황을 시민에게 투명하게 안내하고 있으며, 이를 통해 시민의 알 권리를 보장하고 석면 노출로 인한 건강 피해를 최소화하는 데 목적이 있습니다.
