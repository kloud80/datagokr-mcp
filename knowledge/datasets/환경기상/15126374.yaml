summary_user: 천안시 안에 설치된 폐의약품 수거함을 설치 장소 한 곳당 한 행으로 담은 위치 목록 파일(CSV 약 3.3KB)로, 수거 장소명·행정동·지번/도로명 주소·장소 안 수거함 위치를 담는다. 천안 시민이 '집에 남은 약을 우리 동네 어디에 버리면 되나'를 찾거나, 시·분석가가 행정동별 수거함 배치를 점검하는 데 쓴다. 전역 조인 키가 없어 행정동명이나 주소를 기준으로 행정동 코드표·주소 지오코딩 결과와 이름 매칭해 붙여 쓴다.
limits: 수거함 설치 지점 목록일 뿐 폐의약품 수거량이나 처리 현황 같은 통계는 담지 않는다. 표준 코드 키가 없어 다른 데이터와는 행정동명·주소 문자열 매칭으로만 연결해야 하며, 범위는 천안시 한 곳에 한정된다.
