description_portal: 충청남도 천안시 폐의약품 수거함 배부 위치 데이터는 시민이 가정에서 발생하는 폐의약품을 안전하고 편리하게 배출할 수 있도록 수거함 설치 현황을 제공하는 자료입니다. 본 데이터는 시군구명, 수거 장소명, 행정동명, 지번주소, 도로명주소, 수거함위치, 데이터기준일자 등의 항목으로 구성되어 있습니다. 지번주소와 도로명주소 등으로 수거함 위치를 파악하여 활용 바랍니다. 본 데이터는 폐의약품의 무단 폐기를 방지하고 환경오염을 예방하며, 공공보건 관리와 친환경 생활문화 확산을 지원하는 기초 자료로 활용될 수 있습니다.
