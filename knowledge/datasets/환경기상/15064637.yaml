description_portal: 한강수계관리위원회에서 한강수계 주민 및 학생을 대상으로 팔당호의 자연과 생태를 체험할 수 있는 프로그램입니다.팔당호는 경기도 광주시, 남양주시, 하남시, 양평군에 걸쳐 있는 총 저수량 2억 4,400만톤의 거대한 인공 호수로, 1973년 팔당댐이 완공되면서 만들어졌습니다.서울을 비롯한 수도권 2,600만 시민들의 소중한 상수원으로서 다양한 법률들에 의해 엄격히 관리되고 있으며, 덕분에 주변 자연환경이 맑고 청정하게 보전되고 있습니다.이런 팔당호를 선박에 승선하여 수질, 자연, 생태를 눈으로 보고 체험할 수 있는 생태학습선의 운영 기록을 제공합니다.
