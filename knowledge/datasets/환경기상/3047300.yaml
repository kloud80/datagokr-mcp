description_portal: 본 데이터는 경기도 하남시 관내의 석면 해체 및 제거 작업장 현황을 수록하고 있습니다. 단, 개인정보 보호를 위해 개인 식별이 가능한 정보는 공개 대상에서 제외되었습니다.주요 구성 항목은 신고 내역, 작업 내용, 건축물 소재지, 시공업체명, 작업 기간을 비롯하여 자재 종류(천장재, 지붕재 등)와 물량(면적 $m^2$, 부피 $m^3$, 길이 $m$) 정보를 포함합니다. 이 자료는 석면 안전관리, 건축물 철거 관리, 환경보건 정책 수립 및 지역별 석면지도 작성 등 시민 건강 보호를 위한 기초 자료로 활용될 수 있으며, 향후 공공 및 민간 분야의 석면 리스크 관리 기반 데이터로서 높은 가치를 지닙니다.
