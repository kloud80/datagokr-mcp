summary_user: 경기도 하남시 관내 석면 해체·제거 작업장을 작업 건별로 담은 파일로, 건물설비명·소재지 주소·시공 사업체명·공사현장명·해체작업 시작/종료일자·면적·석면 함유 자재 종류를 수록한다. 인근 주민이 우리 동네에서 언제 어느 건물의 석면 철거 공사가 진행되는지 확인하거나, 분석가가 하남시 석면 해체 물량과 자재 유형을 지역별로 파악하는 데 쓴다. 전역 조인 키가 없어 소재지 주소를 지오코딩하거나 사업체명을 이름으로 매칭해야 다른 사업장·건축물 데이터와 이을 수 있다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어 다른 데이터와는 주소·업체명 문자열 매칭으로만 연결된다. 범위는 하남시 한 곳뿐이라 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 하며, 개인 식별 정보는 공개 대상에서 빠져 있다.
