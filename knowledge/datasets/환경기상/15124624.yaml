description_portal: '광주광역시 남구에 설치되어 있는 맨홀 및 빗물받이 현황 및 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 건설과(☎062-607-4034)에서 제공하며, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 맨홀 : 도로나 인도, 건물 주변 등에 설치된 원형 혹은 사각형 모양의 뚜껑이 있는 구조물로, 지하에 있는 배수 시스템, 하수도, 전기 배선, 가스 배관 등 각종 시설에 접근할 수 있도록 만든 입구입니다. 주로 지하에 설치된 다양한 시스템의 점검, 수리, 유지보수를 위해 사용됩니다. ※ 빗물받이 : 비가 내렸을 때 생긴 빗물을 도로, 인도, 주차장 등에서 모아서 배수구나 하수도로 유도하는 시설입니다. 보통 도로나 길가에 설치되어, 빗물이 도로에 고이지 않도록 하며, 홍수를 예방하고 배수를 원활하게 하는 역할을 합니다.'
