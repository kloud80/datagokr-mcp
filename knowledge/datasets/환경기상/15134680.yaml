description_portal: '환경책임보험 시스템의 파일 관리 기능에서 첨부파일 일련번호는 각 첨부파일에 부여된 고유 식별자로, 파일 간 중복 없이 개별적으로 추적 및 관리할 수 있도록 합니다.첨부파일 구분 일련번호는 이 구분 코드에 연계된 데이터를 식별하는 데 사용됩니다.원본 첨부파일 명은 사용자가 업로드한 실제 파일명을 저장하고, 저장 첨부파일 명은 시스템 내에서 중복 방지 및 관리 편의를 위해 부여되는 이름입니다.첨부파일 용량은 업로드된 파일의 크기(바이트 단위)로, 저장소 관리 및 업로드 제한 조건에 활용됩니다.첨부파일 삭제 여부는 사용자가 삭제 요청을 했거나 시스템에서 삭제 처리가 되었는지를 ‘Y/N’ 등의 형식으로 나타내며,첨부파일 확장자 명은 파일의 형식(예: .pdf, .hwp, .jpg 등)을 구분하여 파일 처리 로직에 활용됩니다.등록자 아이디는 파일을 업로드한 사용자의 식별 정보로, 등록 이력 추적과 파일의 출처 확인에 사용됩니다.이러한 구조는 첨부파일의 무결성 확보, 분류 체계화, 삭제 이력 추적 등 파일 관리의 신뢰성과 효율성을 높이는 데 기여합니다.'
