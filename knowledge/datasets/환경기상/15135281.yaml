summary_user: 국립공원 안의 재난위험지구를 지구별로 정리한 CSV 파일(약 39KB)로, 지구명·위치·시설명·위험요인·표지판 설치 여부·일 최대 예상 탐방객·대피계획 인원·대피장소·구조대 편성과 구조장비·통제시설을 담는다. 국립공원 안전관리자나 탐방객이 특정 공원 구역에 어떤 위험요인이 있고, 사고가 나면 몇 명을 어디로 대피시키도록 계획돼 있는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 국립공원공단 데이터와는 지구명이나 위치 같은 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 국립공원 내 재난 발생 우려가 높은 재해취약지역을 체계적으로 관리하기 위해 구축된 자료로, 국립공원공단의 재난안전관리체계에 따라 지정·관리되는 재난위험지구 정보를 포함하고 있습니다. 주요 항목에는 위험지구 명칭, 국립공원명, 위험 유형(산사태, 낙석, 침수, 붕괴 등), 위험등급, 위치 좌표(위도·경도), 고도, 면적, 지정 사유, 관리 주체, 점검 주기 등이 포함되며, CSV 포맷으로 제공됩니다. 본 데이터는 국립공원 내 안전관리계획 수립, 탐방로 통제구간 설정, 응급대응 체계 구축, 시설물 보강 대상 도출, GIS 기반 재난위험도 분석 등에 활용됩니다. 또한 국립공원 재난안전 스마트플랫폼 및 민간 지도 API와 연계하여 실시간 모니터링 및 시각화가 가능하여, 탐방객과 관리자 모두에게 안전 정보를 효과적으로 제공할 수 있습니다.
