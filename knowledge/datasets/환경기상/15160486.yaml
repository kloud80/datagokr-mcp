description_portal: 강원특별자치도 내 주요 대기측정소에서 수집된 2025년 월별 대기 중 중금속 농도 측정 자료입니다.주요 측정 항목으로는 구리(Cu), 철(Fe), 망간(Mn), 크롬(Cr), 카드뮴(Cd), 납(Pb), 니켈(Ni), 칼슘(Ca), 마그네슘(Mg), 알루미늄(Al), 비소(As), 베릴륨(Be) 등 총 12개 성분입니다.각 측정소별 및 측정 항목별로 1월부터 12월까지의 월평균 농도 수치와 연간 평균값을 제공하며, 모든 측정 농도의 단위는 ug/m3 입니다. 강원특별자치도의 대기질 변화 추이 분석, 미세먼지 및 유해 중금속 오염원에 대한 학술 연구, 환경 정책 수립, 도민의 환경 정보 알권리 보장 등을 위한 기초 자료로 유용하게 활용할 수 있습니다.
