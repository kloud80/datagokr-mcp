summary_user: 서울특별시 마포구에 등록된 환경측정대행업체를 업체 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·좌표와 실험실 면적·소재지 정보가 들어 있다. 오염물질 측정을 맡길 업체를 찾는 사업자나 마포구 안에서 지금 영업 중인 측정대행업체가 어디에 있는지 확인하려는 행정·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: 서울특별시 마포구에 등록된 환경측정대행업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 환경측정대행업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 실험실 관련 정보, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 행정기관, 기업, 주민 등은 신뢰할 수 있는 환경측정대행업체의 위치와 자격 정보를 쉽게 확인할 수 있습니다.
accrual_periodicity: 수시
