description_portal: 광주광역시도시공사가 보유 중인 차량의 연료별 구성을 연도별로 정리한 데이터입니다. 본 데이터는 연도별 구분, 총 보유대수(합계), 하이브리드, 전기차, 수소차, 액화석유가스(LPG), 휘발유차, 경유차, 데이터기준일자 항목으로 구성되어 있습니다. 이를 통해 공사의 친환경 차량 도입 현황과 전통 내연기관 차량의 비중을 비교 분석할 수 있으며, 친환경 전환 정책 이행 수준을 객관적으로 파악하는 데 활용할 수 있습니다. 각 차량 유형별 수치를 구조화하여 제공하며, 정책 수립, 탄소중립 계획 수립, 환경경영 지표 평가 등 다양한 목적에 활용될 수 있습니다. 검색 편의성을 고려한 설명과 항목 구성을 통해 접근성과 활용도를 높였습니다.
