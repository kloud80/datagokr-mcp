summary_user: 대전광역시 대덕구 관내에서 대기오염물질을 배출하는 사업장을 업소별로 한 줄씩 담은 원천 목록으로, 상호명·도로명주소·종별·업종명과 데이터기준일자가 들어 있다(CSV 약 23KB). 주민이나 분석가가 '우리 동네 근처에 어떤 업종의 대기배출 사업장이 있고 규모 종별은 어떤가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호명·도로명주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 대전광역시 대덕구 관내 대기오염물질을 배출하는 사업장의 현황을 체계적으로 정리한 자료입니다. 해당 자료에는 각 사업장의 명칭, 주소, 업종, 배출시설의 종류 및 규모 등 주요 정보가 포함되어 있으며, 대기환경보전법에 따라 관리 대상이 되는 업소를 중심으로 구성되어 있습니다. 이를 통해 지역 내 대기오염의 발생 원인을 파악하고, 환경관리 정책 수립 및 행정적 대응에 활용할 수 있습니다. 또한, 산업 활동과 환경 영향 간의 상관관계를 분석하는 데 유용하며, 지역 주민 및 연구기관의 정보 접근성과 이해도를 높이는 데 기여합니다. 본 자료는 대덕구의 환경 행정 투명성을 제고하고, 지속가능한 도시 발전을 위한 기초자료로 활용됩니다.
