summary_user: 대전광역시 중구의 버스승강장·횡단보도·택시승강장 등 인근에 설치된 공공 쓰레기통을 한 곳씩 담은 건별 목록으로, 설치장소 설명·지번주소·설치지점 유형·분리수거 구분별 쓰레기통 종류를 포함한다. 주민이나 방문객이 '중구 이 정류장 근처에 분리수거 쓰레기통이 있나'를 확인하거나, 구청·분석가가 설치지점 유형별 쓰레기통 배치 현황을 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 지번주소를 주소 매칭하거나 다른 지자체의 같은 이름 파일과 나란히 놓고 비교하는 방식으로 이어 쓴다.
description_portal: 대전광역시 중구 쓰레기통 현황 ( 연번, 설치장소, 지번주소, 설치지점, 쓰레기통 종류, 데이터 기준일자) 정보를 제공합니다.(설치장소)는 쓰레기통이 설치된 장소에 대한 구체적인 설명을 담고 있으며, (지번주소)는  해당 쓰레기통이 위치한 곳의 지번주소를 표기하고 있습니다.(설치지점)은 쓰레기통이 위치한 곳의 특성을 분류한 것으로 버스승강장, 횡단보도, 택시승강장 등이 있으며, (쓰레기통종류)는 쓰레기통이 분리수거 구분에 따른 쓰레기통 개수를 나타냅니다.본 데이터는 매년 업데이트 되며, 대전광역시 중구에 위치한 버스승강장, 횡단보도, 택시승강장 등 인근에 설치되어 있는 쓰레기통 현황입니다. 데이터와 관련하여 문의 있으신 경우 연락 부탁드립니다.
