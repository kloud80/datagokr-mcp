summary_user: 환경영향평가 사업별 토양 조사지점마다 조사차수·토층·심도와 카드뮴·구리·비소·납 등 중금속, 벤젠·톨루엔·석유계총탄화수소·벤조(a)피렌 등 유기오염물질 측정값을 건별로 담은 파일로, 전국을 범위로 하며 지점 위치는 주소·좌표와 SHP 공간파일로 제공된다. 개발사업 예정지 주변 토양이 이미 오염돼 있는지, 특정 사업구역의 공사 전후 토양 중금속 농도가 어떻게 달라졌는지 확인하려는 분석가·사업자·주민이 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 환경영향평가 사업구역·협의 현황 데이터와는 사업코드(BSNS_CD)로 연결하고, 다른 데이터와는 좌표나 주소를 써서 공간 결합한다.
description_portal: '환경부 국립환경과학원의 환경영향평가 사업의 환경영향평가 사업구역, 조사지점을 기준으로 조사된 토양 조사 속성 및 공간정보(조사지점) 등에 대하여 정보를 제공하는 서비스입니다. 조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 토양정보 조사에 대한 벤조(a)피렌(mg/kg), 토층구분(예 : 표토, 중토, 심토 등), 토층별 심도(m), 준설토(mg/kg), 카드뮴(mg/kg), 구리(mg/kg)등의 다양한 정보를 제공합니다. 조사지점에 대한 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.'
