summary_user: 충주시 관내 사업장이 신고한 폐기물 배출 내역을 사업장·폐기물종류별 건으로 담으며, 폐기물구분(지정·일반), 운반자, 처리업소, 처리방법(소각·매립·재활용 등), 사업장 도로명주소, 신고기준년도를 포함한다. 지자체 점검 담당자나 분석가가 '충주의 어느 사업장이 어떤 폐기물을 어느 업체에 맡겨 어떻게 처리하는가'를 확인하거나 처리업체별 거래 분포를 볼 때 쓴다. 사업자등록번호(bizno)로 다른 사업자 원장·처리업 허가 데이터와 잇고, 도로명주소로 위치 기반 데이터와 맞춰 쓴다.
description_portal: 충청북도 충주시 관내 사업장에서 배출되는 폐기물에 대한 신고 현황을 정리한 데이터로, 사업장폐기물 관리와 운반·처리 이력 추적에 활용됨. 폐기물 배출자의 기본 정보와 폐기물 처리 방식 등을 체계적으로 확인할 수 있음.항목은 폐기물구분(지정폐기물, 일반폐기물 등), 상호명(배출 사업장명), 폐기물종류(지정 세부 품목 또는 폐기물 설명), 사업자등록번호, 운반자명(운반업체명), 처리업소명(처리업체명), 처리방법(소각, 매립, 재활용 등), 사업장 도로명주소, 신고기준년도, 데이터기준일자 등으로 구성됨.해당 데이터는 환경부 지침에 따라 폐기물 처리의 투명성을 높이고, 불법 폐기물 방지 및 행정 점검·지도 단속의 기반자료로 활용됨. 또한 지역별 폐기물 배출 경향 분석, 처리업체별 처리물량 분포 파악, 정책 수립을 위한 기초자료로도 중요함.※ 사업자등록번호 및 처리업소명 등 일부 항목은 개인정보 또는 기업정보 보호를 위해 공개범위에 제한이 있을 수 있음.
