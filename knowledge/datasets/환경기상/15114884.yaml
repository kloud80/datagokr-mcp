description_portal: 다음은 대구광역시 지방자치단체측정망 8개지역 40개지점에 대한 2026년  2분기 (4월) 환경소음 원천데이터로써, 측정지역, 측정지점주소, 용도, TM좌표, 측정값을 포함하고 있습니다. 환경소음 수동측정망 운영으로 지역 및 지점별 환경소음 실태를 체계적으로 파악하여 선제적 소음 피해 예방과 쾌적한 도시환경조성 정책 수립에 신뢰성 있는 자료 제공하고자 합니다.  조사기간은 분기별 1회  측정을 하며, 조사방법은  요일별로 소음변동 폭이 작은 평일(월요일~금요일)에 24시간 연속 측정하고  시간당 측정된 유효 5분 등가소음도로부터 1시간 등가소음도를 산출합니다.
