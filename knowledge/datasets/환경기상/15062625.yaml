summary_user: 충청남도 예산군 관내 사업장폐기물 배출 사업장을 한 행씩 담은 목록으로, 상호·배출하는 폐기물 종류·사업장 소재지를 담는다(CSV 약 63KB, 시군구 범위의 개별 사업장 단위). 지역 사업자나 분석가가 '예산군 어느 사업장이 어떤 종류의 폐기물을 배출하는가'를 확인하거나, 폐기물 수집운반·처리 영업 대상을 찾는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 상호명이나 사업장 주소를 맞춰 붙이거나, 같은 예산군 자료끼리만 연결한다.
