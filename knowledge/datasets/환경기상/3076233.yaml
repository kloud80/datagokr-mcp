summary_user: 울산광역시 남구에서 대형생활폐기물(가전·가구 등) 수거를 맡은 업체를 업체별로 담은 파일로, 업체명·도로명주소·전화번호·수거지역·주요사업내용·대행/직영 구분을 담고 있으며 파일 크기가 617바이트에 불과한 소규모 목록이다. 남구 주민이 "우리 동네 대형폐기물은 어느 업체에 전화해 수거를 신청하나"를 확인하거나, 담당 부서가 수거 위탁업체 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 수거지역(동 이름)이나 주소 문자열로 맞춰 붙여야 하며, 다른 지자체의 대형폐기물 수거업체·품목별 수수료 파일과 나란히 놓고 비교하는 식으로 쓴다.
limits: 남구 한 곳의 업체 연락처 목록일 뿐이라 대형폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다. 행정동 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 동 이름·주소를 직접 매핑해야 한다.
