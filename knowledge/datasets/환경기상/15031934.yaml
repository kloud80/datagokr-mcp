summary_user: 광주 광산구에서 음식물쓰레기 RFID 계량기기를 설치한 공동주택을 단지별로 한 행씩 담은 목록이며, 단지명·세대수·주소·설치 대수와 데이터 기준일자가 들어 있다. 주민이나 관리사무소가 우리 아파트에 RFID 음식물 수거기가 몇 대 설치됐는지 확인하거나, 분석가가 세대수 대비 설치 대수를 단지별로 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 공동주택명을 맞춰 연결해야 하며, 주소를 좌표로 바꾸면 공동주택 단지 정보나 다른 구의 수거 지점 파일과 함께 볼 수 있다.
limits: 광산구 한 곳의 설치 단지 목록일 뿐이며, 음식물쓰레기 배출량이나 수수료 부과 실적 같은 발생량·처리 통계는 담고 있지 않다. 표준 코드 키가 없어서 다른 데이터와 연결하려면 단지명·주소 표기를 직접 맞춰야 한다.
