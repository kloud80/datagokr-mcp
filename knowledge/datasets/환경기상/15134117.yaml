summary_user: 경상북도 관내 대기오염물질 배출시설 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 업체명·대표자·업종·도로명주소·배출시설 종별을 담는다(CSV 약 21KB, 범위는 경상북도). 지역 주민이나 분석가가 "우리 시군 안에 어떤 업종의 대기배출사업장이 몇 종 규모로 있는가"를 확인하거나 업종별·지역별 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 도로명주소를 지오코딩해 지역·좌표 단위로 묶거나, 업체명을 이름 매칭해 다른 사업장·인허가 자료와 잇는다.
description_portal: 경상북도의 「대기배출사업장현황」에 대한 자료입니다. 본 자료는 관내 사업장의 업체명, 업종, 주소, 배출시설의 종별 등 기본 정보를 포함하여 관리 현황을 종합적으로 제공하고 있습니다. 이를 통해 대기오염물질을 발생시키는 주요 사업장의 분포와 특성을 파악할 수 있으며, 환경정책 수립 및 행정적 관리에 필요한 기초자료로 활용됩니다. 특히 업종별·지역별 배출시설의 등록 현황을 체계적으로 확인할 수 있도록 구성되어 있어 행정기관과 연구자뿐 아니라 공공 데이터 이용자들의 이해도를 높일 수 있습니다. 본 자료는 환경 행정의 투명성을 제고하고, 지역 내 대기질 개선을 위한 정책적 의사결정에 기여합니다. 자료에 관한 문의는 054-880-3545로 하시기 바랍니다.
