summary_user: 환경영향평가 사업의 해양조사 결과를 조사지점(주소·좌표) 단위로 담은 건별 정보로, 해양수질(화학적산소요구량·총유기탄소·총질소), 잘피 서식 여부, 해수유동 적용모델, 부유사확산 면적, 출현 동식물 종명 등을 전국 범위로 제공한다. 해양 개발사업을 검토하는 사업자나 분석가가 "이 해역 사업의 환경영향평가에서 수질 등급과 부유사 확산 저감 효과는 어땠나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 사업 관리번호(mgtNo)를 다른 환경영향평가 데이터에서 먼저 받아 넘기거나 좌표·주소로 사업구역·토지이용규제 정보와 맞춰 쓴다.
description_portal: 환경부 국립환경과학원의 환경영향평가 사업의 해양조사시 적용모델, 조사, 동식물, 동식물명의 속성정보 제공 및 공간정보(조사지점) 등 에 대한 정보를 제공하는 서비스입니다.조회정보로는 조사속성조회, 동식물속성조회, 적용모델속성조회, 조사속성조회, 동식물명속성조회 정보를 제공햡니다.각서비스의 제공 정보에는 조사지점명, 주소, X/Y좌표정보,해양수질_화학적산소요구량(㎎/ℓ), 해양수질_총유기탄소(㎎/ℓ), 총질소(㎎/ℓ), 해초류(잘피) 서식여부, 해양수질 환경기준등급, 해수유동 적용모델, 부유사확산 면적(1㎎/ℓ) 저감대책 전(㎢), 부유사확산 면적(1㎎/ℓ) 저감대책 후(㎢), 조간대 저서동물 출현종 국문명, 해조류 출현종 국문명 등 다양한 조사정보를 제공합니다.조사지점에 대한 공간정보는 WMS 및 WFS 형태로 제공되며, 사용자는 좌표체계, 반환 이미지 타입, 배경 이미지 포함 여부, 이미지 너비/높이 등의 설정을 통해 특정 좌표 기준의  해양환경 조사지점 대한 포인트 이미지를 조회할 수 있습니다.
team:
  dept: 기후국토환경연구과
services:
  - op: /getIvstgWMS
    name: 조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/MaritimeService/getIvstgWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: 좌표 체계를 나타냅니다. 현재 EPSG:5179 좌표계를 지원합니다.
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getModel
    name: 적용모델속성조회
    endpoint: https://apis.data.go.kr/1480523/MaritimeService/getModel
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
      - name: type
        required: true
        desc: 응답타입
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getIvstgWFS
    name: 조사지점WFS조회
    endpoint: https://apis.data.go.kr/1480523/MaritimeService/getIvstgWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        desc: 좌표체계
      - name: maxFeatures
        required: false
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: false
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
