description_portal: 서울시 건축물 유출지하수 현황 데이터는 대형 건축물에서 발생하는 유출지하수의 규모와 활용 실태를 파악하기 위한 자료입니다. 건축물명, 위치, 층수, 연면적, 조사년도 정보를 통해 건축물의 기본 특성과 조사 시점을 알 수 있으며, 총발생량과 일평균발생량을 통해 지하수 발생 규모를 정량적으로 파악할 수 있습니다. 또한 하천방류, 도로청소, 공원용수, 화장실세척, 건물용수, 기타용수 등 일평균 이용현황과 미사용 하수도방류량 정보를 제공하여, 유출지하수가 실제로 얼마나 효율적으로 재이용되고 있는지, 어느 정도가 그대로 버려지고 있는지 분석할 수 있습니다. 이를 통해 상수도 대체, 물순환 개선, 환경정책 수립을 위한 기초자료로 활용할 수 있으며, 건물 단위의 물 자원 관리 효율성 평가와 지하수 재이용 확대 방안 마련에 중요한 근거가 되는 데이터입니다.
