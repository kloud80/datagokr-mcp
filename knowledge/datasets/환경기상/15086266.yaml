summary_user: 인천 영종구(포털 설명과 파일명에는 인천광역시 중구로 표기) 관내에서 실내공기질 관리대상에 해당하는 다중이용시설을 시설 한 곳당 한 행으로 담은 목록이다. 시설군 종류(대상), 시설명, 소재지 주소, 데이터기준일자가 들어 있으며, 범위는 시군구 하나이고 파일은 약 7KB CSV다. 주민이나 시설 운영자가 특정 시설이 연 1회 실내공기질 자가측정과 교육 의무 대상인지 확인하거나, 분석가가 관내 관리대상 시설의 유형별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 시설명을 매칭해 연결해야 한다.
description_portal: '실내공기질 관리법에 따라 다중이용시설의 소유자 등은 실내공기질 교육을 받아야 하며, 1년에 1회 실내공기질을 자가측정하여야 합니다.본 데이터는 인천광역시 중구 관내에 위치한 다중이용시설 중 실내공기질 관리법 제3조(적용대상), 실내공기질 관리법 시행령 제2조(적용대상)에 해당하여 실내공기질 관리대상이 되는 시설 현황에 관한 데이터입니다.대상 시설군의 종류 및 시설명, 해당 시설의 소재지 등이 기재되어 있습니다.파일명 : 인천광역시_중구_ 실내공기질 측정대상 다중이용시설항목 : 연번, 대상, 시설명, 소재지, 데이터기준일자'
