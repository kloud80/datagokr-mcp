summary_user: 전북특별자치도에서 토양오염 조사기관으로 지정된 업체의 목록으로, 업체마다 한 행씩 지정번호·업체명·소재지·연락처를 담은 소규모 파일(csv 834바이트)이다. 공장 부지나 개발 예정지의 토양 오염도 조사를 맡겨야 하는 토지 소유주나 사업자가 "도내에서 조사를 의뢰할 지정기관이 어디이며 연락처는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰서만 연결할 수 있고, 주소를 기준으로 특정토양오염 등 환경 공간 규제 자료와 함께 볼 수 있다.
description_portal: 전북특별자치도 내에 토양오염 조사를 수행할 수 있는 전문기관으로 공식 지정된 업체의 현황 데이터입니다. 이 자료는 토지 개발이나 공장 부지 등에서 토양 오염 우려가 있을 시, 관련 법규에 따라 정밀 조사를 실시할 자격을 갖춘 기관들의 목록입니다. 각 기관의 명칭과 소재지, 연락처 정보를 포함하고 있어, 토지 소유주나 사업자가 오염도 검사를 의뢰할 신뢰할 수 있는 업체를 찾는 데 도움을 줍니다. 이는 오염된 토양의 정화 및 복원 사업을 촉진하고, 깨끗한 국토 환경을 보전하는 데 기여하는 중요한 정보입니다.
