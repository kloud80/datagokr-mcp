description_portal: 항공기상청에서는 AFTN 및 WAFS 통신망을 통해 수집한 METAR, TAF, AIRMET, SIGMET 등 주요 항공기상 자료를 국민과 항공 관계자에게 제공하고 있습니다.각 자료는 항공기 운항 및 공항 운영에 직접적인 영향을 미치는 기상 관측 정보, 예보 정보 및 공역 기상 특보 정보로 구성되어 있으며, 정확한 해석과 활용을 위해 관련 지침에 따라 참고하실 것을 권장드립니다.자료 해석에 필요한 세부 지침은 항공기상청 대표 누리집(amo.kma.go.kr)의 ‘알림자료 > 법령지침’ 게시판에서 확인할 수 있으며, 아래와 같은 지침들이 제공됩니다.[METAR] 항공기상 관측지침[TAF] 항공기상 예보지침[SIGMET/AIRMET] 공역기상 예·특보 지침
