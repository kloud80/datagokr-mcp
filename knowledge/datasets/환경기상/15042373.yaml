summary_user: 화성시가 수거·처리하는 대형폐기물(가구·가전·침대 등)의 품목별 규격과 유무료 여부, 처리수수료를 품목 단위 행으로 담은 시군구 범위의 파일(csv 약 30KB)이다. 화성시 주민이 소파나 장롱을 내놓기 전에 '이 크기면 수수료가 얼마인가'를 확인하거나, 분석가가 지자체 간 대형폐기물 수수료 체계를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체의 같은 형식 파일과는 시도명·시군구명과 품목명(대형폐기물명)·규격을 이름으로 맞춰 이어 쓴다.
