description_portal: 경기도 의정부시 다중이용시설 실내공기질 관리대상 업체 현황 데이터는 시민의 건강과 안전을 위해 수집·제공되는 공공데이터로, 관내 다중이용시설 중 「실내공기질 관리법」에 따라 관리대상으로 지정된 시설들의 정보를 체계적으로 담고 있습니다. 데이터는 번호, 시군명, 시설구분, 시설명, 소재지도로명주소, 소재지지번주소, 연면적(㎡), 위도, 경도, 데이터기준일 등의 항목으로 구성되어 있습니다. ‘번호’는 개별 시설을 식별할 수 있는 고유한 관리 식별자이며, ‘시군명’은 해당 시설이 속한 행정구역을 나타내어 지역별 관리 현황을 구분할 수 있도록 합니다. ‘시설구분’ 항목은 대형마트, 의료기관, 도서관, 영화관, 체육시설 등과 같이 다중이용시설의 유형을 분류하여, 공기질 관리가 필요한 업종별 특성을 반영합니다. ‘시설명’은 관리대상 시설의 공식 명칭을 제공해 현장 확인과 행정 관리의 효율성을 높이며, ‘소재지도로명주소’와 ‘소재지지번주소’는 도로명과 지번 체계 모두를 포함하여 공간 정보의 정밀도를 높였습니다. 이를 통해 GIS 기반 위치 분석, 시설 분포 지도 작성, 생활권역별 접근성 평가 등이 가능합니다. ‘연면적(㎡)’ 항목은 시설의 전체 면적을 수치로 제공하며, 건축물 규모에 따른 관리 대상 여부 판단과 실내공기질 관리 필요 수준을 가늠하는 기준이 됩니다. 또한 ‘위도’와 ‘경도’ 항목을 통해 시설의 위치를 좌표 값으로 확인할 수 있어, 지도 시각화 및 공간 통계 분석이 가능하며, 주변 인구 밀집도나 교통 접근성과 연계한 활용이 가능합니다. 마지막으로 ‘데이터기준일’은 자료의 최신성과 시의성을 확인할 수 있도록 제공되어, 연구나 정책 활용 시 데이터의 유효성을 보장합니다. 본 데이터는 행정기관이 다중이용시설의 실내공기질 관리 체계를 수립하고 점검 일정을 계획하는 데 활용될 수 있으며, 연구기관이나 민간
