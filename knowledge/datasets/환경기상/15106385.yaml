summary_user: 전국 폐전기전자제품 수거함의 위치를 건별로 담은 파일 데이터로, 검증 시 12,830행이 수신됐고 상호명·수거종류·수거방법·주소·장소구분·수거비용 항목이 있다. 시민이 집 근처에서 전기밥솥이나 믹서기 같은 중소형 폐가전을 어디에 버릴 수 있는지, 비용이 드는지를 찾을 때 쓴다. 조인 키는 수거장소(주소)이며, 주소 문자열을 기준으로 다른 생활폐기물 배출·수거 지점 데이터나 지도 좌표 변환과 이어 쓴다.
description_portal: '국민들의 폐전기전자제품 배출 편의성을 높이기 위해 제공되는 폐전기전자제품 수거함 위치정보 데이터는, 생활 속에서 자주 사용되는 중소형 전기전자제품(예: 전기밥솥, 믹서기, 헤어드라이어, 에어프라이어 등)의 올바른 처리를 유도하고 자원 재활용을 활성화하기 위한 목적을 가지고 구축된 공공데이터입니다. 이 데이터는 폐기 가능한 전기전자제품의 종류, 수거함이 설치된 주소 및 상세 위치, 수거함의 유형,  수거 시 발생할 수 있는 비용 유무 등의 정보를 포함하고 있습니다. 이를 통해 일반 시민들이 자신의 거주지 인근에 설치된 폐가전 수거함의 위치를 손쉽게 파악할 수 있습니다.'
