summary_user: 제주도 연안과 주요 양식어장 주변 해역의 관측 정점별·수층별 측정 기록을 담은 건별 원천 파일(CSV, 약 38만 바이트)로, 수온·염분·pH·용존산소·COD 외에 질소·인·규산규소·부유물질·클로로필a 같은 영양염과 수질 지표를 위도·경도와 함께 기록한다. 양식업자나 해양환경 분석가가 특정 양식어장 주변 정점에서 수온·용존산소·영양염이 시기별로 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키는 없어 정점명이나 위도·경도 좌표로 다른 해양 관측·어장 데이터와 공간적으로 맞춰 이어 쓴다.
description_portal: '제주특별자치도 내 어장환경 모니터링 관측 데이터를 제공합니다.항목: 측정 일시, 정점명, 위도, 경도, 수온, 염분, 수소이온농도, 용존산소량 등* 이 데이터는 제주도 연안과 주요 양식어장 주변 해역에서 수집된 해양 환경 관측 자료입니다.국립수산과학원이 수온, 염분, pH, 용존산소량, 화학적산소요구량(COD) 등 해양 환경 지표를 측정하여 기록한 CSV 형식의 데이터입니다. 즉, 제주도 바다 환경이 어떤 상태인지 시계열적으로 관찰한 자료라고 보면 됩니다.* 활용 분야 : 해양 환경 분석, 양식업 환경 관리, 해양 생태계 연구 등'
