summary_user: 한국수자원공사가 광역지방 해수담수화 시설의 원수(해수)에 대해 실시한 법정 수질검사 결과를 채수 건별로 담은 파일로, 취수장·측정지점·정수장과 채수일자별로 카드뮴·비소·납·크롬·붕소·수은 같은 중금속 항목 측정값이 들어 있다. 담수화 시설 운영자나 수질 분석가가 '해수담수화 시설로 들어오는 원수의 중금속·붕소 농도가 어느 수준인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 정수장명·취수장명·측정지점 주소 같은 이름 매칭으로만 정수 수질검사나 같은 기관의 다른 수질 자료와 잇는다.
description_portal: 본 데이터는 한국수자원공사에서 광역지방 해수담수화 시설의 원수에 대해 실시한 법정 수질검사 결과를 제공되며, 해수의 수질 적합성을 확인하기 위한 목적입니다. 자료에는 시설명, 권역, 검사일자, 항목명, 측정지점, 정수장명, 측정값등이 포함됩니다. 본 자료는 2024년 동안의 결과를 포함하며, 수질 분석, 담수화 운영관리, 공공위생 점검 등에 활용됩니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData
