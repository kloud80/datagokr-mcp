description_portal: 한국환경공단 굴뚝자동측정기기 측정결과 공개 데이터는 미세먼지에 대한 국민적 관심과 우려가 높아지면서,미세먼지 배출사업장에 대한 감시 필요성에 따라 수행하게 되었습니다.2019년 12월 1일부터 정부의 미세먼지 계절관리제 시행으로사업장부분 관리 강화를 위해 자발적 협약을 맺은제철·제강, 민간발전, 석유화학 등 대형사업장 111개소를 대상으로실시간 측정값을 공개해왔습니다.2020년 4월 3일부터 TMS 부착 전체 사업장을 대상으로 확대하여국민들에게 실시간으로 제공하고 있습니다.실시간으로 굴뚝자동측정기기 측정값을 공개함으로써국민이 직접 감시에 참여하도록 하여사업장이 자발적으로 대기오염물질을 저감하도록 유도에 크게 기여하고 있습니다.대기오염물질 7개 항목(먼지, 황산화물, 질소산화물, 염화수소,불화수소, 암모니아, 일산화탄소)에 대한 측정값을 제공하고 있습니다
