summary_user: 전국 굴뚝자동측정기기(TMS) 부착 사업장의 배출구별 측정시간 단위 측정값을 담는다. 먼지·황산화물·질소산화물·염화수소·불화수소·암모니아·일산화탄소 7개 항목의 측정값과 허용기준이 함께 들어 있다. 주민이나 분석가가 '우리 지역 사업장 굴뚝의 질소산화물 배출이 허용기준 안에 있는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 사업장명(fact_manage_nm)·지역명 같은 이름 매핑이나 같은 기관의 배출구 코드로만 잇는다.
limits: 검증 호출에서 API 전체 건수가 1건, 수신 행도 1행이었으므로 한 번의 호출로 전국 전체 사업장이 내려온다고 보면 안 되고, 조회 조건을 따로 확인해야 한다. 사업자번호 같은 공통 키가 없어서 기업 정보나 인허가 원장과 정확히 연결되지 않고 이름 매칭에 기대야 한다. 개발계정은 하루 5,000회까지 호출할 수 있다.
