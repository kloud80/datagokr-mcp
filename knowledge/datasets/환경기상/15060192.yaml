summary_user: 대구 달서구 관내에서 하루 300kg 이상(대기 배출시설 사업장은 100kg 이상) 폐기물을 배출하는 사업장을 한 행씩 상호·주소·위도·경도·담당부서·기준일자로 담은 건별 명단 파일(CSV)이다. 지역 주민이나 분석가가 "우리 동네 근처에 사업장폐기물을 많이 내는 곳이 어디 있나"를 지도에서 확인하거나, 구청이 배출 사업장 관리 대상을 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 대구광역시 달서구 관내 1일 300kg 이상(대기 배출시설 설치·운영 사업장의 경우 1일 100kg 이상 포함) 폐기물을 배출하는 사업장의 폐기물 배출자 현황 데이터로 1년마다 주기에 따라 업데이트하여 제공합니다.아래 컬럼을 참고하시길 바랍니다.위도, 경도, 상호, 주소, 담당부서, 기준일자 등으로 구성되어있습니다.해당 현황을 파악하여 환경 보호 및 자원 순환 사회 구현을 위한 정책 수립에 기초 자료로 활용가능합니다. 또한 지역 주민들의 건강과 환경 보호를 위한 관리 체계를 강화하는 데 중요한 역할을 합니다.
