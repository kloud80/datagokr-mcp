summary_user: 충청북도가 환경오염물질 배출시설을 단속한 결과를 건별로 담은 파일로, 단속 연도·사업장(기업명)·단속기간·위반 및 행정처분 내역을 기록한다. 주민이나 분석가가 '우리 지역의 특정 업체가 언제 어떤 환경 위반으로 행정처분을 받았는가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호·좌표 등)는 없어서, 배출시설 인허가 사업장 원장 같은 다른 데이터와는 사업장명을 맞춰 보는 방식으로만 이어 쓴다.
limits: 사업자번호·주소 좌표 같은 표준 식별자가 없어 다른 사업장 데이터와 정확히 연결하기 어렵고, 이름 매칭에 의존해야 한다. 범위는 충청북도에 한정되며 위치 정보가 없는 비공간 자료다.
