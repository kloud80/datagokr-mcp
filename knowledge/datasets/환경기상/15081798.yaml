description_portal: 본 데이터는 강원특별자치도 속초시 관내 벙커C유 사용 사업장 현황 정보를 제공하는 자료이다. 벙커C유를 사용하는 사업장의 운영 현황을 시민과 관계기관이 쉽게 확인할 수 있도록 사업장명, 소재지, 사용 연료 등 관련 정보를 정리하여 개방한다. 대기환경 관리와 오염물질 배출 저감 정책 추진을 목적으로 구축된 자료이며, 대기오염 관리 정책 수립과 환경행정 업무 수행 시 참고자료로 활용할 수 있다. 또한 지역 내 연료 사용 사업장 현황을 파악하고 환경정보 접근성을 높이고자 한다. 데이터는 속초시 관내 벙커C유 사용 사업장 현황을 기준으로 관리하며 관련 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 사업장 운영 현황과 연료 사용 정보를 확인할 수 있다.
