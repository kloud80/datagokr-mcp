description_portal: 이 데이터는 코로나19 확산 기간(2020년~2022년 6월) 동안 전국 시군구별로 처리된 의료폐기물의 월별 처리량을 기록한 통계 자료입니다.처리량은 선별진료소, 생활치료센터, 코로나 전담 병원 등에서 발생한 코로나 관련 의료폐기물을 소각 또는 매립한 실제 처리 실적을 의미합니다. 전국적으로 약 230개 시군구에 대한 정보를 포함하고 있습니다.감염병 대응 인프라 평가, 위기 시 쓰레기 처리 용량 계획, 의료자원 집중도 파악, 지역 간 균형 있는 폐기물 정책 마련 등 다양한 환경정책 및 위기관리 전략 수립에 기초자료로 활용 가능합니다.
