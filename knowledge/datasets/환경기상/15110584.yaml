description_portal: 경기도 성남시 CCTV 위치별 조도, 휘도 데이터를 제공합니다. 날짜, 시간, 위도, 경도, 조도, 휘도 데이터를 제공하고 있습니다.CCTV 위치별 조도 및 휘도 데이터는 각 CCTV 설치 지점 주변의 밝기 환경을 수치로 나타낸 것으로, 야간 영상 품질, 범죄 예방 효과, 보행자 안전 확보 등과 밀접한 관계가 있습니다. 조도(照度, illuminance)는 단위 면적당 도달하는 빛의 양을 **lux(룩스)**로 측정하며, 휘도(輝度, luminance)는 물체가 반사하거나 방출하는 밝기를 **cd/㎡(칸델라/제곱미터)**로 표현합니다.
