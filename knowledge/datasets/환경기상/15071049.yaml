summary_user: 충청남도 도내 대기배출시설과 폐수배출시설을 사업장 한 곳씩 목록으로 담은 파일로, 업소명·주소·업종과 대기·수질 종별을 담는다(약 15KB csv). 주민이나 분석가가 "우리 동네 주변에 어떤 업종의 몇 종 배출시설 사업장이 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭이나 주소의 시군명으로만 이어 붙일 수 있다.
