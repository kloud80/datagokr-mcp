summary_user: 환경영향평가 사업의 조사지점별로 조사된 토양정보(조사차수, 주소·좌표, 토층 구분과 심도, 카드뮴·구리·벤조(a)피렌 등 농도)와 조사지점 공간정보(WMS·WFS)를 담는 건별 원천 데이터이며, 범위는 전국이고 위치는 행정단위가 아닌 개별 주소·좌표로 나온다. 개발사업 예정지 주변 토양의 중금속·유해물질 농도가 평가 당시 어느 수준이었는지 확인하려는 분석가나 주민, 사업자가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 환경영향평가 협의 현황·사업구역 데이터에서 사업 관리번호(mgtNo)를 먼저 받아 넘겨야 하고, 그 밖의 연결은 좌표를 이용한 공간 매칭이나 이름 매핑으로만 한다.
description_portal: '환경부 국립환경과학원의 환경영향평가 사업의 환경영향평가 사업구역, 조사지점을 기준으로 조사된 토양 조사 속성 및 공간정보(조사지점) 등에 대하여 정보를 제공하는 서비스입니다.조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 토양정보 조사에 대한 벤조(a)피렌(mg/kg), 토층구분(예 : 표토, 중토, 심토 등), 토층별 심도(m), 준설토(mg/kg), 카드뮴(mg/kg), 구리(mg/kg)등의 다양한 정보를 제공합니다.조사지점에 대한 공간정보는 WMS 및 WFS 형태로 제공되며, 사용자는 좌표체계, 반환 이미지 타입, 배경 이미지 포함 여부, 이미지 너비/높이 등의 설정을 통해 특정 좌표 기준의 토양정보 조사지점 포인트 이미지를 조회할 수 있습니다.'
team:
  dept: 기후국토환경연구과
services:
  - op: /getInfo
    name: 조사속성조회
    endpoint: https://apis.data.go.kr/1480523/SoilService/getInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
      - name: ivstgSpotNm
        required: false
        desc: 조사지점의 이름
      - name: type
        required: false
        desc: 응답받을 xml/json 타입
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getInfoWMS
    name: 조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/SoilService/getInfoWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: '좌표 체계를 나타냅니다. '
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getInfoWFS
    name: 조사지점WFS조회
    endpoint: https://apis.data.go.kr/1480523/SoilService/getInfoWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        example: EPSG:32652
        desc: 좌표체계
      - name: maxFeatures
        required: true
        example: '10'
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: false
        example: results
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        example: 73297.40248257795,3506059.085416644,803828.180558938,4444265.837193642
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: true
