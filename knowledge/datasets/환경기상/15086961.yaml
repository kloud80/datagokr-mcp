summary_user: 서울 강서구 관내 가로쓰레기통을 한 개씩 행으로 담은 위치 목록으로, 도로명·지번주소와 위도·경도, 설치 지점 유형(정류소·지하철역 입구·도로변 등), 수거 쓰레기 종류, 형태(일반 쓰레기통·담배꽁초 수거함), 담당자 연락처를 함께 담는다. 주민이 '내가 다니는 길이나 정류장 근처에 쓰레기통이 있는지'를 찾거나, 구청·분석가가 쓰레기통이 비어 있는 구간과 재활용 수거통 배치를 점검하는 데 쓴다. 전역 조인 키는 없어서 위도·경도나 주소를 기준으로 다른 자치구의 가로쓰레기통 파일, 정류소·지하철역 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 이 자료는 서울특별시 강서구 관내 가로쓰레기통 설치에 대한 정보를 포함하고 있습니다.각 쓰레기통의 설치된 위치 ( 도로명주소, 지번주소, 위도, 경도, 도로(가로)명, 설치위치), 설치 지점(정류소/지하철역 입구/도로변/상가지역 등), 수거 쓰레기 종류(일반쓰레기/재활용쓰레기), 쓰레기통의 형태(일반 사각 쓰레기통/담배꽁초 수거함), 그리고 해당 설치를 담당하는 담당자의 연락처 등의 정보가 포함되어있습니다.이 정보는 효율적인 청소행정 수행과 주민 민원 대응, 도시 미관관리 및 정책수립 등 활용할 수 있습니다.
