summary_user: 경상북도 울진군 관내에서 사업장폐기물 배출자로 신고한 업체를 한 행씩 담은 신고 원장으로, 상호·신고일자·생활계 구분·폐기물 종류·배출량(톤)·처리방법·도로명/지번 주소를 담는다. 울진군 안에서 어떤 업체가 어떤 종류의 폐기물을 얼마나 배출하겠다고 신고했고 어떤 방법으로 처리하는지 확인하려는 주민·폐기물 처리 사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 사업장 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: 경상북도 울진군 관내 사업장에서 발생하는 폐기물을  폐기물관리법  제17조, 같은 법 시행규칙 제18조제1항제1호에서 3호 규정에 의거하여 신고된사업장폐기물 배출자 신고현황으로써 사업장 폐기물 배출자 신고한 업체의 상호 및 주소, 신고년도,  생활계 구분, 폐기물의 종류, 폐기물 배출량, 폐기물 처리방법 등의 데이터가 포함되어 있습니다.사업장 폐기물 배출자 신고 내용은 예상되는 사업장 폐기물의 발생량을 신고 한것으로 실제로 발생되어 배출되는 사업장 폐기물 배출량과 다소 차이가 있을수 있습니다.
