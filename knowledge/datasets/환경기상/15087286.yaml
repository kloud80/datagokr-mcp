description_portal: 한국동서발전의 연도별 온실가스 배출현황 정보는 발전소 운영에 따른 온실가스 배출량을 Scope별로 구분하여 연도별로 집계한 데이터로, 공공기관의 기후변화 대응 및 탄소중립 이행 수준을 정량적으로 파악할 수 있는 자료입니다.해당 데이터는 연도, 단위, 직접배출(Scope 1), 간접배출(Scope 2), 총 배출량 등의 항목으로 구성되며, Scope 1은 연료 연소 및 설비 운영에 따른 직접 배출을, Scope 2는 전기나 열의 외부 사용에 따른 간접 배출을 의미합니다.이 데이터는 발전 부문에서 발생하는 온실가스의 유형별 배출 특성을 파악하고, 연도별 배출량 변화를 통해 감축 노력의 성과를 점검하는 데 활용됩니다.학계 및 연구기관에서는 이 데이터를 활용해 공기업의 탄소배출 추이 분석, Scope별 배출 기여도 평가, 온실가스 감축 정책의 실효성 검토, 에너지 믹스 변화에 따른 배출 영향 분석 등을 수행할 수 있습니다.또한 ESG(환경·사회·지배구조) 경영 평가, 국가 온실가스 감축 목표(NDC) 달성 수준 진단, 산업별 탄소중립 전략 수립에 필요한 기초자료로서도 유용하며,국내외 탄소배출 비교, 발전원별 배출 효율 분석, RE100 이행에 따른 감축 잠재력 평가 등 실증 기반 연구에도 폭넓게 활용될 수 있습니다.
