summary_user: 한국동서발전의 발전소 운영에 따른 온실가스 배출량을 연도별로 직접배출(Scope 1)·간접배출(Scope 2)·총 배출량으로 나눠 담은 전사 단위 집계 파일로, 344바이트 크기의 작은 CSV입니다. 분석가나 연구자가 '한국동서발전의 온실가스 배출량이 해마다 줄고 있는지, 직접배출과 간접배출 중 어느 쪽 비중이 큰지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전 공기업의 같은 형식 배출현황과는 연도와 기관명을 맞춰 나란히 비교하는 방식으로 이어 쓴다.
