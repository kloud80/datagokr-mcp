summary_user: 수도권매립지에 반입되는 서울시·경기도·인천시 폐기물의 반입수수료를 마감년월·광역지자체·폐기물 종류별 금액(원)으로 담은 집계 파일입니다. 지자체 폐기물 담당자나 분석가가 특정 지자체가 어떤 폐기물을 매립지에 반입하며 낸 수수료가 월별로 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 광역지자체명과 폐기물명 같은 이름 매칭으로만 같은 기관의 반입량 등 다른 통합반입관리 데이터와 이어 쓴다.
description_portal: '수도권매립지에 반입되는 서울시, 경기도, 인천시 폐기물 반입수수료 정보입니다.개방항목 : 마감년월, 광역지자체명, 폐기물명, 반입수수료(원) 항목을 제공합니다. 수도권매립지관리공사는 "수도권매립지관리공사의 설립 및 운영 등에 관한 법률" 및 관련 규정에 따라, 매립지에 반입되는 폐기물에 대해 종류별로 반입수수료를 산정하여 부과하고 있습니다. 반입수수료는 폐기물의 종류와 배출 지자체(서울, 경기, 인천 등)에 따라 차별화되어 적용되며, 공사 홈페이지에서 최신 단가표를 확인할 수 있습니다. 반입수수료는 폐기물 처리비용, 매립지 운영비, 환경개선 등 다양한 요소가 반영되어 결정되며, 각 폐기물별로 명확히 고시되어 운영되고 있습니다.'
