summary_user: 한국조폐공사 사업장에서 배출되는 BOD·COD·부유물질·총질소·총인 등 수질오염물질의 배출량을 기관·오염물질 구분별로 2014년부터 2025년까지 연도 열로 정리한 소규모 집계 파일(CSV, 약 1KB)이다. 환경 분석가나 시민이 공공기관 사업장의 수질오염물질 배출량이 해마다 줄고 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기관 배출량 자료나 수질측정망 자료와는 기관명·오염물질 이름을 맞춰 연결해야 한다.
description_portal: ‘한국조폐공사_수질오염물질 배출량 현황’ 데이터는 한국조폐공사에서 배출되는 주요 수질오염물질의 연도별 배출량 정보를 제공합니다. 이 데이터에는 생물학적 산소요구량(BOD), 화학적 산소요구량(COD), 부유물질(SS), 총질소(T-N), 총인(T-P) 등 수질에 직접적인 영향을 미치는 다양한 오염물질의 배출 현황이 체계적으로 기록되어 있습니다. 수질오염물질의 배출량 변화를 시계열로 파악할 수 있어 환경 관리, 오염 저감 대책 마련 등에 활용할 수 있습니다. 이 데이터는 수질 관리 및 환경 보호를 위한 자료로 활용될 수 있습니다.
