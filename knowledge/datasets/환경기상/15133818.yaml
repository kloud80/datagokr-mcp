summary_user: 환경종합보건 시스템에서 모은 대기·수질·토양 등 환경 측정값을 연도·측정 구분·하위 항목·권역별로 담은 파일 데이터로, 전국을 시군구 단위로 다룬다. 연구자나 지자체 담당자가 "우리 시군구의 특정 환경 항목 측정값이 연도별로 어느 수준이고 기준 범위(최소·최대값)와 비교해 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군구 이름(시군구_코드_명)이나 같은 기관의 측정 구분·권역 코드를 매핑해 이어 쓴다.
description_portal: 본 데이터는 환경종합보건 시스템에서 수집된 대기·수질·토양 등 환경 측정 값을 제공하는 공공데이터입니다. 총 11개 필드("측량_년도", "측량_구분_코드", "측량_하위_코드", "측량_권역_코드", "총_측량_값", "단위", "관측소 위치", "측정 방법" 등)을 포함하며, 측정 지점별·항목별 환경 오염 수준을  정밀하게 파악할 수 있습니다. 연구자는 환경유해요인 분석 및 건강 영향 평가, 지자체는 대기질 모니터링 및 오염관리 정책 수립, 산업체는 배출 기준 준수 여부 점검 및 개선 계획 수립에 활용할 수 있습니다. 또한 환경 기준 초과 지역 탐색, 공기질 수치 시각화, 위험지역 경보 시스템 개발 및 대국민 정보 제공에도 유용합니다.
