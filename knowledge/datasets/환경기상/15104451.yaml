summary_user: 지하수 영향조사 시설에 대해 영향조사보고서 번호·보고서명·원시자료기관·자료기준년도·발행월·보고서 분류코드를 보고서(시설) 단위로 담은 전국 범위 파일이다(CSV 약 943KB). 지하수 개발을 검토하는 사업자나 분석가가 특정 지역에서 언제, 어느 기관이 지하수 영향조사보고서를 냈는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지하수 관정·수질 데이터와는 보고서명·기관명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 지하수 영향 조사 시설에 대한 내용입니다.- 영향조사보고서번호, 영향조사보고서명, 원시자료기관, 자료기준년도, 발행월, 영향조사보고서분류코드, 연장일련번호 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다.** 다운로드 방법 **1. (페이지이동) 국가지하수정보센터 - 지하수정보지도 - 지하수시설 지도로 이동 (https://www.gims.go.kr/igis_infomap.do)2. (조건설정) 좌측 사이드바 메뉴에서, 지하수시설 - 조사시설 - 영향조사 체크박스를 클릭 (조사시설을 확인할 수 있는 맵 스케일로 변경됩니다.)3. (선택) 지도에 표시된 영향조사 시설 (초록색 십자가) 클릭4. (엑셀다운) 우측 사이드바에서 클릭한 조사시설의 상세 정보를 확인할 수 있고, ""엑셀다운"" 버튼을 통해 엑셀 형식의 파일로 다운로드 가능합니다."
