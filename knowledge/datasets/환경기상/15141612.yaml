summary_user: 생산자책임재활용제도(EPR)상 재활용의무대상이 아닌 포장재에 대해 제조·수입·판매업자가 자율적으로 분리배출표시를 하려고 한국환경공단에 지정승인을 신청한 내역을 신청 건별로 담으며, 규격명·포장재 중량·대상품목 구분·포장재 재질 분류와 세부 내용·포장 용도를 포함하고 범위는 전국이다. 포장재를 다루는 사업자나 분석가가 "어떤 재질·용도의 의무대상 외 포장재가 분리배출표시 지정승인을 신청했는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 재질 분류명·대상품목 구분명 같은 이름 매핑으로만 이어 쓴다.
limits: 사업자번호 등 공통 키가 없어 폐기물 처리업·배출자 원장과 직접 결합할 수 없고, 이름이나 코드 매핑으로만 연결된다. 행정구역 단위가 없는 전국·비공간 데이터라 지역별 분석에는 쓸 수 없다. 개발계정은 일 10,000회 호출 제한이 있다.
