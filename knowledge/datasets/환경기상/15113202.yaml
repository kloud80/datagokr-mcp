summary_user: 관악구 행정동별로 종량제봉투 판매소가 몇 곳인지(개소)를 집계한 소규모 파일(csv, 321 bytes)로, 봉투 크기·종류 구분 없이 판매를 등록한 업소 수를 2023년 4월 5일 기준으로 담는다. 주민이나 구 담당자가 '우리 동에는 종량제봉투 파는 곳이 다른 동보다 적은가'처럼 동별 판매 인프라 편차와 확충 필요 지역을 비교하는 데 쓴다. 전역 조인 키나 행정동 코드는 없어 행정동 이름을 다른 행정동 단위 자료(인구·면적 등)와 이름으로 맞춰 이어 써야 한다.
description_portal: 본데이터는 관악구 행정동별 종량제봉투 판매소 현황을 정리한 정보입니다. 본데이터는 각 행정동 명칭과 해당 동에서 운영 중인 판매소 개소 수 항목을 포함합니다. 이를 통해 동별 판매 인프라의 분포를 파악할 수 있으며, 향후 판매소 확충 계획 수립, 주민 접근성 분석, 지역 간 편차 개선 등 행정적 활용이 가능합니다. 또한 판매소 수가 많은 지역과 적은 지역을 비교하여 수요 대응 전략을 마련하는 데에도 참고 자료로 활용됩니다.(봉투 크기 및 종류의 구분없이 판매를 등록한 업소의 수)(2023년 4월 5일 기준입니다.)
