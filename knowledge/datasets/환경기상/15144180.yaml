summary_user: 자동차 제조·수입업체가 납·수은·카드뮴 등 유해물질 사용 제한 규정을 지켰다고 선언한 건을 준수선언번호 단위로 담은 전국 단위 파일(CSV, 약 845KB)로, 준수선언업체·제품명·제품중량·세부모델명·제조수입업체명·승인일자를 포함한다. 소비자나 분석가가 특정 차종·세부모델이 유해물질 준수선언을 했는지, 언제 승인됐는지 확인하거나, 업체별 준수선언 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·모델명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 본 데이터는 환경성보장제 전기전자제품 및 자동차의 재활용시스템 내에서 관리되는 자동차 유해물질 준수선언 정보를 포함하며, 주요 항목으로는 준수선언번호, 준수선언업체, 제품명, 제품중량, 세부모델명, 제조·수입업체명, 승인일자 가 포함됩니다.이 데이터는 「전기·전자제품 및 자동차의 자원순환에 관한 법률」과 관련한 자동차 내 유해물질 사용 제한 규정을 준수하였음을 선언한 내용을 담고 있습니다.특정 유해물질(납, 수은, 카드뮴 등)의 사용을 제한하여 환경오염을 줄이고, 소비자와 산업계에 친환경 제품 정보를 제공하는 데 중요한 근거 자료로 활용됩니다.해당 정보는 자동차 제조사 및 수입업체의 환경책임 이행 현황을 체계적으로 관리하고,환경부, 한국환경공단, 지자체 등 관련 기관에서 유해물질 규제 준수 여부 점검, 인증 검증, 정책 수립 및 평가 등에 폭넓게 활용할 수 있습니다.
