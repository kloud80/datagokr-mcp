summary_user: 진주시 관내 공급업체·판매소 등이 요청한 종량제봉투와 음식물류폐기물 납부필증 주문을 건별로 담은 원천 기록으로, 주문일자·주문업체·입금 및 마감 구분·배송일자·상품 등이 들어 있으며 CSV 파일 하나가 약 19.7MB입니다. 진주시 담당자나 분석가가 "어떤 봉투·필증 품목이 언제, 어느 업체에서 얼마나 자주 주문되는가"를 보고 재고·발주 일정과 예산을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명(주문업체·등록업체) 같은 이름 매칭이나 같은 진주시 자료끼리만 이어 쓰며, 종량제봉투 판매소 현황 파일과 업체명으로 맞춰 보는 정도가 현실적입니다.
description_portal: 경상남도 진주시 종량제봉투 및 음식물류폐기물납부필증 주문내역은 관내 지정된 공급업체 또는 각 행정·사용 기관에서 요청한 물품 주문 정보를 체계적으로 기록한 자료입니다. 주문일자, 주문업체, 등록업체, 등록자, 품목 및 규격 등 세부 항목이 포함되어 있어 실제 수요 발생 과정을 명확하게 확인할 수 있습니다. 이를 통해 품목별 주문 경향을 분석하고, 적정 재고 확보 여부 점검, 향후 발주·입고 일정 조정, 예산 계획 수립 등 운영 관리 전반의 효율성을 높이는 데 활용됩니다. 또한 주문 흐름을 기반으로 공급 지연이나 과다·과소 주문을 사전에 예방할 수 있는 핵심 관리 자료로 기능합니다.
