description_portal: '국내외 발생한 지진, 지진해일에 대한 정보(발생지점, 진앙 위치, 규모, 강도 등)을 제공합니다.규모: 규모(Magnitude)는 지진발생 시 지진이 가지고 있는 절대적인 에너지의 크기를 말하고, 진도(Intensity)는 어떤 장소에서의 상대적인 흔들림의 크기를 말합니다. 규모는 길이, 질량과 같은 물리적인 개념의 단위가 아니라 단순히 일종의 약속된 단위입니다. 다양한 방법을 이용해 지진 규모를 측정할 수 있으며, 이상적으로는 어떤 방법을 사용해도 한 지진의 규모가 동일한 값으로 측정되도록 경험적으로 조정되어 있습니다. 규모는 지진계에 기록된 지진파의 최대 진폭과 진앙 거리를 이용하여 계산하는데, 지진파 전파의 복잡한 특성으로 인해 지진관측소마다 관측한 지진파의 진폭이 서로 다릅니다. 그렇기 때문에 진폭이 측정되는 관측소마다, 측정 방법마다 계산된 지진 규모가 서로 차이가 있을 수 있습니다.'
