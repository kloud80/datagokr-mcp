summary_user: 해양환경측정망 정점별 수질평가지수(WQI) 등급(5단계)을 평가년도·평가월 단위로 담은 파일 데이터로, 전국 1,600행이 정점명·정점번호·위도·경도와 함께 들어 있다. 해양 수질 정책 담당자나 연구자가 특정 해역 정점의 수질 등급이 연도·월별로 어떻게 변했는지 확인하는 질문에 쓴다. 위도·경도 좌표가 조인 키이므로 같은 좌표 체계를 가진 다른 해양환경 데이터와 위치 기준으로 이어 쓰며, 정점번호는 조인 키로 확인된 바가 없다.
description_portal: 이 데이터는 해양수산부에서 해양환경공단의 해양환경측정망 자료를 바탕으로 국내 해역의 수질 상태 정보(5단계)를 종합적으로 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양지역별 정점명, 좌표정보, 정점번호, 평가년도, 평가월, 수질등급정보(WQI 등급) 등 정보로 구성되어 있습니다.  본 데이터는 해양 수질 관리 정책 수립에 필요한 기초 자료 제공, 해양 오염 현황 분석, 각 해양지역별 연도별 수질 변화 모니터링, 교육 및 학술 연구 수행을 위한 기반 데이터로써 활용될 수 있습니다.
