summary_user: 청주시 4개 구(상당구·서원구·흥덕구·청원구)에 설치된 쓰레기 분리수거함 100개를 한 행씩 담은 개별 지점 목록으로, 구·읍면동·설치 지번주소·데이터기준일을 담는다. 주민이 우리 동네 어디에 분리수거함이 있는지 찾거나, 분석가가 구·읍면동별 수거함 배치 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 읍면동 이름이나 지번주소를 기준으로 행정구역 코드·주소 좌표 변환 데이터, 같은 청주시의 종량제 판매소·재활용 정거장 파일과 이름 매칭으로 이어 쓴다.
description_portal: 충청북도 청주시에 설치된 쓰레기 분리수거함 현황 데이터로 구, 읍면동, 설치지번주소, 데이터기준일 등을 제공합니다.해당 데이터는 2022년 12월 기준 현재, 청주시 관내 100개의 쓰레기 분리수거함에 대한 정보를 4개 구(상당구, 서원구, 흥덕구, 청원구)별로 구분하여 텍스트형식의 데이터파일(CSV)형식으로 제공하며, 이용허락범위 제한이 없으므로 각종 통계 및 관련정보 수집 등에 활용하여 주시기 바랍니다.* 본 데이터는 공공데이터 제공 신청 건에 대하여 제공하는 공공데이터입니다.
