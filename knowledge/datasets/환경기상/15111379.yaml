summary_user: 대전광역시 스마트시티 챌린지 사업으로 설치된 미세먼지 측정소를 한 행에 하나씩 담은 현황 목록으로, 구명·법정동·행정동·주소·좌표(X·Y)와 관리번호·스테이션 아이디를 담는다. 시민이나 분석가가 '우리 동네 가까이에 어떤 미세먼지 측정소가 어디 있나'를 확인하거나, 측정망 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어 다른 대기질 데이터와는 스테이션 아이디·주소 같은 이름 매핑이나 좌표 기반 공간 매칭으로만 이어 쓴다.
description_portal: 대전광역시 미세먼지 측정소 현황 자료는 2022년 11월 말 기준 스마트시티 챌린지 사업의 일환으로 설치된 미세 먼지 측정소들의 위치, 운영 상태, 장비 설치 정보 등을 포함한 자료입니다. 해당 측정소는 대기 중 미세 먼지(PM10, PM2.5) 농도를 실시간으로 측정하여 지역 대기질 수준을 모니터링하고, 대전시의 대기 오염 관리 및 주민 건강 보호를 위한 대응 근거 자료로 활용됩니다. 측정 된 대기 정보는 행정기관의 대기질 개선 정책 수립, 미세 먼지 경보 발령 체계, 환경 위해도 예측 등에 활용되며, 스마트시티 기반 기술과 연계해 도시 내 환경 측정망 확장 및 통합 데이터 분석 시스템을 구성하는 데 기여합니다. 본 자료는 2022년 공공데이터 기업매칭지원사업으로 수행되었습니다.
