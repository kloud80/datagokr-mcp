summary_user: 국립공원공단 통합방재시스템에 등록된 국립공원 내 기상관측장비를 장비 1대당 1행으로 담은 목록으로, 소속 위치, 장비 아이디, 위도·경도, 해발 높이, 설치 주소를 수록한다(전국 범위, CSV 약 39KB). 산악 기상 분석가나 재해·탐방 안전 담당자가 '어느 국립공원 어디에 기상관측장비가 몇 m 고도에 설치돼 있는가'를 확인하거나 GIS 지도에 관측망을 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 장비 아이디(STN_ID)나 소속 위치 이름을 기준으로 직접 매핑하거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 국립공원공단에서 운영 중인 통합방재시스템에 등록된 기상관측장비 정보를 수록한 자료입니다. 국립공원 내에 설치된 각 장비의 설치 주소, 위도·경도 좌표, 해발 고도(높이값) 등 공간정보를 포함하고 있으며, 장비별 위치 식별과 기상 모니터링망 구성 현황을 확인할 수 있습니다. 해당 장비들은 강수량, 기온, 풍속, 습도 등 다양한 기상요소를 실시간으로 관측하며, 산악지형 특성을 반영한 국립공원 지역 기상 특이성 분석, 산사태·강풍 등 재해예방 정책 수립, 탐방객 안전관리 체계 구축 등에 활용됩니다. 또한, 공간정보 시스템(GIS)과 연계해 기상자료 시각화, 예·경보 서비스 고도화, 실시간 환경정보 서비스 개발 등에도 폭넓게 활용될 수 있는 기반 데이터입니다.
