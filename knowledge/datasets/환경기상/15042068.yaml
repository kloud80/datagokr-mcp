description_portal: 환경부 화학물질안전원에서 운영하는 온라인교육 및 집합교육 과정 정보 및  일정 정보입니다. 온라인 교육 과정은 유해화학물질 종사자 교육(2시간/년), 취급자 교육(16시간 중 8시간/2년), 외국인(19개 언어) 종사자 교육(2시간/년) 등에 대한 내용입니다.집합교육 과정은 화학사고 전문과정(예방·대응·수습 등), 유해화학물질 취급시설 기술인력 전문과정(기본/경력), 화학사고예방관리계획 전문교육에 대한 내용입니다. 특히, 화학사고 대응과정은 유관기관(군, 소방, 해경, 경찰 등) 맞춤형 과정을 포함하고, 화학사고 대응 훈련장을 활용하여 민간방재요원 양성교육(민간 대상 교육, 8시간)과 소방초동대응 특화훈련(소방 대상 훈련, 4시간)도 포함되어 있는 내용입니다.
