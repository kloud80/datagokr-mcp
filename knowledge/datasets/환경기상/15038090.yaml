summary_user: 서울 강남구에 설치된 폐형광등·폐건전지 분리수거함을 한 곳씩 담은 위치 목록으로, 동 이름·설치장소(도로명주소)·수거 가능 품목·관리기관(동주민센터·자원순환과)과 연락처를 행정동 단위로 기록한다. 강남구 주민이 '우리 동네에서 다 쓴 형광등이나 건전지를 어디에 버리면 되나'를 찾거나, 분석가가 동별 수거함 배치를 살펴보는 데 쓴다. 전역 조인 키는 없어 동명이나 도로명주소를 행정동 코드·주소 체계에 이름으로 맞춰 붙이거나, 다른 지자체의 같은 종류 수거함 파일과 나란히 놓고 쓴다.
limits: 강남구 한 곳만 다루므로 서울 전체나 다른 구의 수거함은 해당 지자체 파일을 따로 받아야 한다. 수거함 위치 목록일 뿐 폐기물 발생량이나 수거·처리 실적 통계는 담지 않는다.
