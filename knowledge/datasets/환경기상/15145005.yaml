description_portal: 대전도시공사에서 운영하는 매립장(환경자원사업소) 내에 위치한 대전바이오에너지센터의 음식물음폐수 반입량 및 바이오가스 발생량 현황 데이터 입니다.금고동 위생매립장은 대전광역시 전역에서 발생하는 생활폐기물 등을 안정적으로 처리할 수 있도록 조성된 대단위 위생매립장 입니다.자세한 소개는 홈페이지(https://www.dcco.kr/web/contents/view.do?mId=71)를 참고하시기 바랍니다.대전바이오에너지센터의 위치는 주소(대전광역시 유성구 불무로186 (금고동))와 지도(https://naver.me/Goi9imO5)를 참고하시기 바랍니다.시설용량은 400톤/일(음식물류폐기물 200톤/일, 음폐수 200톤/일) 입니다.
