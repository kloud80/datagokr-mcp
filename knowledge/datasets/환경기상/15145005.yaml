summary_user: 대전도시공사가 운영하는 금고동 대전바이오에너지센터 한 곳의 음식물류폐기물 반입량, 음폐수 반입량, 총반입량, 바이오가스 생산량을 운영일자별로 담은 CSV 파일(약 20KB)이다. 폐기물·에너지 분석가가 음식물쓰레기 반입량이 늘거나 줄 때 바이오가스 생산량이 어떻게 달라지는지를 날짜별로 살피는 데 쓴다. 전역 조인 키는 없고, 운영일자를 기준으로 같은 기간의 기상·폐기물 통계 등과 날짜로만 맞춰 쓴다.
limits: 실측 컬럼에 기관·시설 코드 같은 전역 조인 키가 없어 다른 데이터와는 날짜나 이름 매핑으로만 연결된다. 메타상 범위가 전국·비공간으로 표시되지만 내용은 대전의 단일 시설 실적이므로 지역 비교나 전국 집계로 해석하지 않는다.
