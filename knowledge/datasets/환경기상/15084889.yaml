description_portal: '○ 통계개요* 통계명 : 환경문제에 대한 인식* 통계종류 : 통계청 사회조사보고를 제공하는 지정·조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상→지방통계청→통계청* 공표주기 : 부정기(2년)* 공표범위 : 지역 - 서울시내용 - 환경문제 각 사항에 대한 불안정도를 백분율로 제공○ 용어설명* 지구온난화로 인한 기후변화 : 폭염, 홍수 등* 환경성 질환 : 아토피, 천식 등○ 기타* 조상대상 13세 이상 인구(2010년이전 15세 이상 인구)* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 귀하는 환경문제에 대하여 어느 정도 불안을 느끼십니까?○ 출 처 : 통계청 사회통계기획과 「사회조사」'
