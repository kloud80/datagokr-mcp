description_portal: 세계기상기구(WMO)의 기상통신망(GTS)를 통해 수집된 북한 27개 지점의 관측자료를 활용하여 분석한 연간 기후통계자료입니다.본 자료에 표시된 시각은 한국표준시(135°E 자오선 기준)에 따른 것입니다. 2011년 1월부터 1981-2010년 평년값을 사용하였습니다.일 평균값은 1일 8회(03, 06, 09, 12, 15, 18, 21, 24시) 관측값의 평균입니다. 임의의 10분간, 1시간 최다강수량과 매시자료의 6시간 최다강수량은 각각 해당시간에 나타난 강수량 중 최다값입니다.증발량은 당일 09시부터 다음날 09시까지의 관측값입니다. 운량은 관측지점의 하늘 전체를 10으로 하여 구름으로 덮여 있는 부분을 하늘 전체에 대한 10분수로 표시하였습니다. 풍향은 16방향으로 표시하고, 평균풍속은 풍정에서 구한 일평균풍속값을 월평균하여 구한 값입니다. 최대풍속은 임의의 10분간 평균풍속 중 최대값이며, 최대순간풍속은 어느 임의의 한순간에 나타난 풍속 중 최대값입니다.
