description_portal: 이 데이터는 해양수산부에서 권역별로 측정된 해양방사능 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 조사연/월, 권역명, 측정일자 및 시간, 방사성물질 종류(세슘137, 삼중수소(3H)) 및 측정수치값 정보 등으로 구성되어 있습니다.  본 데이터는 해양 방사능 오염 실태 분석, 권역별·시기별 방사성물질 분포 변화 모니터링, 국가 및 지방자치단체의 해양 환경 안전관리 정책 평가 등에 활용될 수 있습니다. 또한 환경 분야 연구기관에서 방사능 관련 정책 연구 및 장기적 방사능 데이터 축적 자료로 사용할 수 있습니다.
