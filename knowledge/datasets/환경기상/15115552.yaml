summary_user: 권역별 해양방사능 측정 결과를 방사성물질 종류(세슘137·삼중수소)와 조사연도·월, 권역명, 측정수치 단위로 담는 API이며, 검증 시 전국 18행이 수신됐다. 국민이나 분석가가 특정 권역 바다의 방사성물질 수치가 어느 수준인지, 시기별로 어떻게 달라지는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 권역명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
