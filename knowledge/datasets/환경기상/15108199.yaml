summary_user: 지리산국립공원에서 조사된 생물종을 건별로 담은 파일로, 생물분류(포유류·조류·양서류·곤충·식물 등), 국문·학명 종명, 조사 위치와 경위도 좌표, 조사일자, 개체수를 기록한다. 연구자나 공원 관리자가 '지리산에서 특정 종이 어디서 언제 몇 개체 관찰됐는가'를 확인하거나 종 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어서 학명·종명으로 다른 생물종 자료와 맞추거나 경도·위도 좌표로 국립공원 용도지구·보호구역 같은 공간 레이어에 겹쳐 쓴다.
description_portal: 지리산국립공원 내 생물자원 현황을 수록한 자료로, 해당 지역의 생물다양성 보전과 종 분포 현황 분석을 위한 기초 생태 데이터를 제공합니다. 주요 항목에는 국립공원명, 생물분류(포유류, 조류, 양서류, 곤충, 식물 등), 종명(영문), 학명(영문), 분류명(국문), 조사 위치 정보(경도·위도 좌표), 조사일자, 개체수 등이 포함됩니다. 이 자료는 오대산국립공원 내 주요 생물종의 출현 현황과 서식지 분포를 파악하고, 멸종위기종 보호, 생태계 건강성 진단, 자연자원관리계획 수립, 생태교육 콘텐츠 개발 등 다양한 분야에 활용될 수 있습니다. 데이터는 CSV 포맷으로 제공되며, 국립공원 생물자원통합관리시스템(NP-BIMS) 및 공간정보 기반 시스템과 연계하여 시각화 및 분석이 가능합니다.
