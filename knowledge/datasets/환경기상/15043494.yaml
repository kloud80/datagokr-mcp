description_portal: '단기예보는 예보기간과 구역을 시·공간적으로 세분화하여 발표하는 예보입니다. 지역별 시간별 차이로 인한 수요자의 불편을 최소화하기 위해 전국을 5km*5km 간격의 격자로 나누어 읍, 면, 동 단위의 행정구역 중심으로 상세한 날씨를 제공합니다.○ 2019.6.4.부터 하늘상태는 맑음(1), 구름많음(3), 흐림(4)으로 구분되어 제공됩니다. (기존 구름조금(2)은 맑음(1)으로 표기됨)○ 2021.6.29. 부터 단기예보 생산체계 개선에 따라, 예보 시간 상세화(기존 3시간→1시간, 강수량/신적설 포함) 및 예보 기간 확장(글피 추가)된 자료를 제공하고 있습니다.○ 2024.11.28. 14시 부터 단기예보 예보기간 확장에 따라, 02·05·08·11·14시 발표기준 글피 예보, 17·20·23시 발표기준 그글피 예보제공하고 있습니다.- 연장기간인 (02·05·08·11·14시 발표)글피, (17·20·23시 발표)그글피 예보는 3시간 간격의 자료를 제공하며, 강수량(PCP), 강설(SNO), 풍속(WSD) 요소는 정성정보(코드값)를 제공합니다.○ 시간 단위: 협정세계시(UTC, 한국표준시 -9) 사용'
