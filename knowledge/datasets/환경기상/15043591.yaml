description_portal: 해구별 예측정보는 지역 파랑모델(RWW3)의 예측자료를 활용하여 산출한 50km(0.5°)격자의 해구별 바다 날씨에 관한 정보입니다. 한반도 주변 연근해 1331개의 해구를 대상으로 하며, 현재 기상청에서는 해구별 예측정보를 TXT 형태로 생산하여 제공하고 있습니다. - 지역파랑예측모델의 예측값을 활용하여 수협중앙회에서 어업인 교육용으로 제작('10.12.)된 해구도를 기반으로 해구별로 파고, 풍속, 풍향 등 예측값을 산출자료는 1일 2회(00UTC, 12UTC), 3시간 간격으로 72시간까지 생산하고 있습니다.* 해구별 위·경도 정보는 기상자료개방포털의 [소통과 참여>자료실> 11번 게시물] 참고
