description_portal: 환경교육용어사전 데이터는 국가환경교육센터가 환경교육의 이해를 돕기 위해 정리한 주요 환경교육 개념 61개를 체계적으로 제공하는 자료입니다.본 데이터는 2017년 교육과정 개편에 대비하여 (사)한국환경교육학회가 편찬한 *「환경교육 용어사전」*을 기반으로 하며, 2020년 국가환경교육센터에서 탄소중립 시대의 교육적 필요성에 맞추어 내용을 수정·보완한 최신 용어 정의를 포함하고 있습니다.이 데이터는 환경교육에 활용되는 핵심 용어의 용어명, 영문명, 요약 설명을 CSV 형식으로 제공하여 누구나 손쉽게 검색·활용할 수 있도록 구성되었습니다. 특히 교육 현장의 교사, 연구자, 정책 담당자, 환경교육 콘텐츠 제작자 등 다양한 이용자가 환경교육 개념을 공통적으로 이해하고 사용할 수 있도록 돕는 데 목적이 있습니다.
