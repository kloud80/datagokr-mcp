description_portal: 본 데이터는 대구광역시 수성구 관내에 위치한 석면 함유 여부 및 석면 조사 대상 건축물의 현황을 체계적으로 정리한 자료로, 건축물명, 주소(도로명 기준) 등의 항목으로 구성된다. 해당 자료는 석면 유해물질이 포함됐을 가능성이 있는 노후 건축물의 분포와 조사 결과를 시각적으로 확인할 수 있도록 설계되어 있으며, 환경 안전 관리, 건축물 리모델링 및 철거 계획, 주민보건 정책 수립, 민원 대응 등에 활용 가능하다. 특히 학교나 복지시설 등 취약 계층 이용 공간의 석면 여부 확인이 가능해 공공보건 안전 대책, 안전 점검 계획, 행정 기관 대응 체계 강화 등에 중요한 기초 자료로 제공된다. 수성구청은 관련 법령에 따라 석면 조사 결과를 정기적으로 갱신하며, 본 데이터는 환경부·교육청·건축 인허가 부서·시민단체 등 다양한 주체에서 석면 위험 예측 및 예방을 위한 정책 기획 기초자료로 폭넓게 활용될 수 있다.
