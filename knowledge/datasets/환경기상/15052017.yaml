summary_user: 대구광역시 수성구 관내 석면조사 대상 건축물을 건물 한 곳씩 상호·구분·소재지 주소로 정리한 시군구 범위의 개별 목록 파일(csv, 약 5KB)이다. 주민이나 리모델링·철거를 계획하는 사업자가 '우리 동네 또는 이 건물이 석면조사 대상인가'를 확인하거나, 구 단위 보건·안전 점검 대상을 추릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호(건축물명)나 소재지 주소를 매칭하는 방식으로만 이어 쓴다.
