summary_user: 해양오염 방제에 쓰는 자재·약제(오일펜스, 유처리제, 유흡착재, 생물정화제제, 유겔화제)의 형식승인 현황을 제품별로 담은 전국 단위 파일로, 업체명·최초승인일·승인번호·제품 형식 같은 항목을 담는다. 방제자재를 사려는 업체나 공공기관이 '이 오일펜스·유처리제 제품이 형식승인을 받았는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 업체명·제품명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 해양오염발생 시 오염물질 제거를 위하여 사용하여 기름을 제거하거나 분산시켜 해양환경을 보호하기 위해 사용되는 자재의 형식승인관련 데이터입니다. 해양오염 방제자재약제 형식승인 현황에 관한 데이터로 자재약제의 종류,업체명,최초승인일,승인여부,승인번호,종류,제품의 형식 등의 항목을 제공합니다.자재약제의 종류는 오일펜스, 유처리제, 유흡착재, 생물정화제제, 유겔화제 입니다.자재를 구입하는 업체나 공공기관에서 구입하는 제품이 형식을 제대로 갖추었는지 데이터를 통해 확인이 가능합니다.
