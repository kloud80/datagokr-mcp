summary_user: 충청북도 단양군에 설치된 헌옷수거함을 한 곳당 한 행으로 담은 파일로, 설치장소·주소·위도·경도와 설치년도, 관리상태를 개별 지점 단위로 담는다. 단양군 주민이 집 근처 헌옷수거함 위치를 찾거나, 분석가가 수거함 배치와 노후 현황을 지도로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 같은 기관의 다른 생활폐기물 배출 지점 파일과 이름으로 맞춰 이어 쓴다.
description_portal: 충청북도 단양군의 헌옷수거함 목록 현황을 정리한 데이터입니다. 관리번호, 설치장소, 주소, 위도, 경도, 설치년도, 관리상태, 비고, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 지역 헌옷수거함 목록 현황을 파악, 분석 및 연구자료로 매우 유용하게 활용 될 수 있습니다. 데이터기준일자는 2025년 1월 9일입니다. 담당부서는 단양군청 농림환경국 환경과이며 문의주시면 최신의 충청북도 단양군 헌옷수거함 목록 현황 내역을 열람하실 수 있게 도와드립니다.
