description_portal: '경상남도 사천시 미세먼지 및 오존주의보 발령 현황 자료입니다.(구분년도, 미세먼지 주의보, 미세먼지 경보, 초미세먼지 주의보, 초미세먼지 경보, 오존 주의보)이 공공데이터는 경상남도 사천시지역의 대기 질 관리를 위해 연도별로 집계된 미세먼지, 초미세먼지, 오존관련 경보 발령 현황을 상세히 기록한 자료입니다. 이 데이터는 사천시의 대기오염 추이를 분석하고 환경 정책의 기초 자료로 활용되는 것을 목표로 합니다.제공되는 주요 항목은 다음과 같습니다.구분년도:데이터가 집계된 기준 연도를 명시하여 연간 변화 추이를 파악할 수 있게 합니다.미세먼지 주의보/경보: 미세먼지에 대한 주의보 발령 횟수와 경보 발령 횟수를 구분하여 제공합니다. 초미세먼지 주의보/경보: 인체에 더 유해한 초미세먼지에 대한 주의보 및 경보 발령 횟수를 제공합니다. 오존 주의보:주로 하절기에 발생하는 광화학 스모그의 주범인 오존에 대한 주의보 발령 횟수를 제공합니다. 이 정량적 자료는 사천시가 겪는 계절별/연도별 대기오염의 심각성을 객관적으로 보여주며, 대기오염 저감 대책의 효과 분석, 시민 건강 보호를 위한 행동 권고 지침 마련, 그리고 지역 환경 관리 계획 수립에 핵심적인 근거로 활용됩니다.'
