summary_user: 경상남도 의령군 관내 쓰레기분리수거장 한 곳을 한 행으로 하여 읍면, 마을명, 설치장소 지번주소, 세부위치를 담은 개별 시설 목록 파일(csv, 약 6KB)이다. 의령군 주민이 우리 마을의 분리수거장이 어디에 있는지 찾거나, 청소행정 담당자·분석가가 읍면별 수거장 분포를 점검하는 데 쓴다. 전역 조인 키나 행정코드는 없어서, 다른 데이터와는 읍면·마을명 이름 매칭이나 설치장소 주소를 지오코딩해 연결해야 한다.
description_portal: 본 데이터는 경상남도 의령군 관내에 설치된 쓰레기분리수거장의 위치 정보를 제공합니다. 본 데이터는 읍면별 쓰레기분리수거장이 설치된장소의 마을명과 설치장소의 지번주소, 세부위치명을 제공하고 있으며, 주민의 분리배출 참여를 유도하고 폐기물 감량 정책 추진을 위한 기초자료로 활용됩니다. 쓰레기 분리수거장은 생활폐기물의 효율적인 분리배출을 촉진하여 환경오염을 줄이고 자원순환 사회로의 전환을 지원하는 공공 인프라 시설입니다. 본 데이터는 환경정책 수립, 청소행정 계획, 분리배출 인식 제고 등에 활용되며, 정기적으로 갱신되어 공공기관과 국민에게 개방됩니다. 의령군은 주민 편의 증진과 쾌적한 생활환경 조성을 위해 분리수거장 확충과 체계적 관리에 힘쓰고 있습니다.
