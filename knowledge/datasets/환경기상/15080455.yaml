summary_user: 전북특별자치도 고창군 안에서 대기오염물질을 배출하는 사업장을 한 곳씩 기록한 목록으로, 사업장명·업종·도로명 주소·전화번호·인허가일자·대기종별을 담은 약 15KB 분량의 CSV 파일이다. 주민이나 분석가가 '우리 동네 근처에 어떤 대기 배출 사업장이 있고 몇 종 사업장인가'를 확인하거나, 군 단위 배출 사업장의 업종·종별 분포를 파악하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 사업장명이나 도로명 주소를 맞춰 잇거나, 주소를 좌표로 바꿔 인근 대기질 측정소 자료와 공간적으로 겹쳐 보는 방식으로 쓴다.
limits: 사업장 목록일 뿐 배출량이나 시간별 대기질 측정값은 담지 않으므로, 배출 허용 기준 준수 여부나 실제 오염도는 이 데이터만으로 판단할 수 없다. 공통 코드 키가 없어 다른 기관 자료와 연결할 때는 이름·주소 매칭에 기대야 한다.
