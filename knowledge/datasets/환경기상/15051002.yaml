summary_user: 경기도 구리시 안에 있는 소음·진동 배출업소를 사업장 한 곳당 한 행으로 담은 현황 파일이며, 사업장명·지번 소재지·소음진동 구분·관리기관을 기록한다. 주민이나 분석가가 "우리 동네 근처에 신고된 소음·진동 배출 사업장이 어디에 있는가"를 확인하거나 생활환경 민원 지역을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·지번 주소를 맞춰 붙이거나 같은 구리시 환경 데이터와 기관 단위로만 이어 쓴다.
description_portal: 경기도 구리시 지역내에 위치한 환경오염배출시설(소음진동배출업소)에 대한 현황정보를 제공합니다. (업소명, 소재지, 소음진동구분)소음·진동배출업소의 현황 및 관리 정보를 제공하는 공공데이터로, 지속가능한 도시환경 조성과 연계됩니다.사업장 위치, 업종, 배출 특성 및 신고·관리 상태 등 **환경·사회·지배구조(ESG)** 관련 정보를 포함하고 있습니다.데이터 기반의 **스마트 환경행정**과 생활환경 개선 및 소음·진동 저감을 위한 정책 수립에 활용됩니다.
