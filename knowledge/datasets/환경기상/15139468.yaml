description_portal: 수치분석일기도는 수치예보시스템에서 생산된 수치자료 및 관측자료를 이용하여 기상 변수들에 대한 기호와 등치선 등으로 이루어진 일기도를 뜻하며, 일기예보를 위하여 예보관 및 사용자들에게 제공됩니다. 프로그래밍을 통해 함께 제공한 배경지도, 경위도선과 중첩하여 원하는 일기도를 제작할 수 있습니다.(참고) 동아시아 영역의 지표면에서 관측한 기상요소를 사용하여 등치선도를 나타내며, 고기압과 저기압 등 기압계와 공기의 흐름을 확인할 수 있습니다. 협정 세계시 UTC와 한국표준시 KST가 표시되어 기준시각 확인이 필요합니다.
