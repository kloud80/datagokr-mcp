summary_user: 수치예보시스템의 수치자료와 관측자료로 만든 동아시아 영역 수치분석일기도(기압·등치선 등 기호로 표현한 일기도) 그래픽을 조회하는 외부 API로, 건별 관측 수치가 아니라 기준시각별 일기도 이미지·도형 자료를 담는다. 예보관이나 기상 분석가가 "지금 한반도 주변 고기압·저기압 배치와 공기 흐름이 어떤가"를 확인하거나, 함께 제공되는 배경지도·경위도선과 겹쳐 원하는 일기도를 직접 만드는 데 쓴다. 실측 필드에서 전역 조인 키를 찾지 못해 다른 데이터와는 기준시각을 맞추거나 같은 기상청 자료(단기예보 격자 nx·ny, 예보구역 등)와 이름·코드 매핑으로만 이어 쓴다.
limits: 포털 활용신청과 별도로 기상청 API허브(apihub.kma.go.kr) 인증키를 받아 경로 파라미터(KEY)로 넣어야 호출된다. 행정구역 단위로 쪼갠 수치가 아니라 전국·비공간 일기도 자료이므로 특정 지역의 값을 바로 뽑거나 다른 표와 키로 결합할 수 없고, UTC와 KST가 함께 표시되므로 기준시각을 확인해야 한다.
