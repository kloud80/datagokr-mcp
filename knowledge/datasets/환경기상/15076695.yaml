summary_user: 성남시에서 대기·폐수·소음진동 등 환경오염물질을 배출하는 사업장을 한 행에 한 곳씩 담은 사업장 목록으로, 사업장명·업종·종별·도로명주소·관리부서를 담는다(CSV 약 73KB). 주민이나 분석가가 '우리 동네 주변에 어떤 업종의 몇 종 배출사업장이 있는가'를 확인하거나 오염원 감시·지도점검 대상을 추릴 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 사업장명이나 도로명주소(주소→좌표 변환 후 공간 결합)로만 이어 쓴다.
description_portal: 성남시 환경오염물질 배출사업장 현황 자료는 대기환경보전법 및 물환경보전법에 따라 관리되는 사업장의 자료입니다. 이 자료는 대기, 폐수, 소음진동 등 환경오염물질을 배출사는 사업장을 대상으로 하며,사업장명, 업종, 종별, 주소, 관리부서등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 환경정책 수립, 오염원 감시, 지도점검등의 기초자료로 활용 할 수 있습니다.
