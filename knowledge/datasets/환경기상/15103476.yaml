description_portal: '서울특별시 마포구 용강동 상점가 담배꽁초 수거함 설치현황에 대한 정보입니다. 이 데이터에는 각 수거함이 설치된 구체적인 행정 구역 정보(예: 시도명, 시군구명)와 실제 위치를 나타내는 도로명 주소 및 세부위치(예: 가게앞, 창고, 재활용수집, 띠녹지앞, 가게맞은편 등)가 포함되어 있습니다. 또한, 상호명과 수거함의 수량 같은 세부 정보도 함께 제공됩니다.이 데이터를 통해 지자체와 상인회는 거리 미관 개선과 환경 정화를 동시에 추진할 수 있으며, 주민들과 상인들은 상점가 내에서 깔끔한 보행 환경을 유지할 수 있습니다.'
