description_portal: 본 데이터는 용인시 토양오염 실태조사 현황을 체계적으로 확인하기 위한 자료이다. 년도와 지점명칭을 통해 조사대상 지역의 기본 정보를 제시하며, 목적·지목·지역·주소는 조사 배경과 공간적 범위를 명확히 파악하는 근거가 된다. 면적과 시료깊이는 조사 표본의 특성을 규정하는 핵심 항목이다. 카드뮴, 구리, 비소, 수은, 납, 6가크롬, 아연, 니켈 등 중금속 농도와 불소, 유기인, PCBs, 시안, 페놀류, 벤젠, 톨루엔, 에틸벤젠, 크실렌, TPH, TCE, PCE, 벤조(a)피렌, 12디클로로에탄 등 유기오염물질 농도는 토양 오염도를 판단하는 주요 지표이다. 수소이온농도(pH)는 토양의 산성·알칼리성 환경을 파악하여 오염물질의 거동 특성을 해석하는 데 활용된다. 본 데이터는 토양환경 보전, 오염원 관리, 정화 정책 수립 등 환경 행정의 기초 자료로 기능한다.
