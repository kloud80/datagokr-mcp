summary_user: 구미시 공단동·원평동·형곡동·4공단·진미동 측정 지점별로 이산화황·이산화질소·일산화탄소·오존(1시간 기준)과 미세먼지·초미세먼지(24시간 기준) 농도를 연월 단위로 정리한 파일 데이터이며, 약 13KB 규모의 CSV다. 구미시 주민이나 환경 분석가가 "산업단지(4공단·공단동) 주변의 미세먼지·이산화질소 농도가 주거지역(형곡동 등)보다 높은가, 계절별로 어떻게 달라지는가"를 확인하는 데 쓴다. 전역 조인 키나 측정소 코드가 없어 에어코리아 측정소 자료 등 다른 대기질 데이터와는 위치(동 이름)와 연월을 기준으로 이름을 맞춰 연결해야 한다.
limits: 측정소코드나 행정코드 같은 공통 키가 없어 다른 데이터와 자동 조인되지 않고, 위치 이름 매핑이 필요하다. 연월 단위 파일이므로 세부 부문이 상정하는 시간별 실시간 대기질이나 경보·주의보 확인에는 쓰지 못한다. 초미세먼지 단위가 필드명에 ug-m2로 적혀 있어 해석할 때 단위 표기를 확인해야 한다.
