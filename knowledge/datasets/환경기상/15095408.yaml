summary_user: 한국남부발전이 전력 1MWh를 생산할 때 나오는 온실가스 배출량(tCO₂-eq/MWh)을 연도별로 1월~12월 월별 수치와 연평균으로 담은 집계 파일이며, 발전소별 건별 원천이 아니라 회사 단위의 작은 표(csv 약 1.3KB)다. 분석가나 연구자가 '남부발전의 발전량당 온실가스 배출 강도가 계절별·연도별로 어떻게 달라졌나'를 보거나 탄소중립·에너지 효율 분석의 기초값으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·월을 맞추거나 같은 기관(한국남부발전) 이름으로만 이어 쓴다.
description_portal: 이 데이터는 발전소 전력 생산 과정에서 발생하는 온실가스 배출량을 연도별·월별로 원단위 기준으로 제공한 자료입니다. 단위는 전력 1MWh 생산 시 발생하는 온실가스 배출량을 의미하는 tCO₂-eq/MWh이며, 각 연도의 1월부터 12월까지의 월별 수치와 연평균 값이 포함되어 있습니다. 이를 활용하면 시기별 배출 특성을 비교하거나 발전 효율 변화를 파악할 수 있으며, 에너지 효율성 분석, 탄소중립 정책 수립, 기후변화 대응 전략 마련, 환경 영향 평가 등 다양한 연구와 정책 개발에 활용 가능한 중요한 기초자료로 이용될 수 있습니다.
