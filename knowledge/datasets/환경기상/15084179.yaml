description_portal: 전라남도 광양시는 시민 중심의 행정서비스 실현과 행정 정보의 투명한 공개를 위해, 민원업무 및 공공시설 이용 등 다양한 공공서비스에 수반되는 수수료 항목별 정보를 객관적이고 체계적인 방식으로 정리한 현황 자료를 제공하고 있습니다.이는 단순한 수수료 금액 안내에 그치지 않고, 공공서비스 이용 과정에서 발생할 수 있는 경제적 부담을 시민들이 사전에 인지하고 계획할 수 있도록 돕는 것을 목표로 하고 있으며, 나아가 수요자 중심의 맞춤형 행정 구현을 위한 기초자료로도 활용됩니다.본 자료는 광양시 관내에서 실제 운영 중인 각종 행정 민원처리 서비스 및 공공시설 사용과 관련하여 부과되는 수수료 항목들을 대상으로 하며, 수수료가 적용되는 서비스의 분류(Category), 구체적인 품목명(Item), 요금 산정의 기준이 되는 규격(Specification), 해당 품목에 부과되는 수수료 금액(Fee), 그리고 데이터 기준일(Reference Date) 등 시민들이 실질적으로 참고할 수 있는 핵심 항목들을 일목요연하게 포함하고 있습니다.
