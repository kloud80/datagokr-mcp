description_portal: 본 데이터는 국립생태원 외래생물연구팀이 수행한 장기간의 정밀 현장조사와 연구사업을 기반으로 구축된 등검은말벌(Vespa velutina nigrithorax)의 국내 분포 좌표 데이터입니다. 해당 자료는 2010년대 중반부터 현재까지 전국 각지에서 수집된 개체 출현지의 위경도 좌표, 발생 시기, 탐지 방법 등의 정보를 포함하고 있으며, 등검은말벌이 생태계에 미치는 영향을 정량적으로 파악하고 침입 경로 및 확산 속도를 분석하는 데 활용됩니다. 주요 수집사업은 외래생물 정밀조사, 전국 외래생물 서식실태조사, 생태계교란 생물 지정종 모니터링 등이 있으며, 이를 통해 확보된 데이터는 꿀벌과 같은 토착종에 대한 피해 양상, 인간 생활권으로의 확산 정도, 계절별 이동패턴 등 다양한 생태학적 분석을 가능하게 합니다. 등검은말벌은 꿀벌 개체 수 감소, 생태계 교란, 농업 피해 등의 원인으로 주목받는 침입종이며, 이 데이터를 기반으로 조기경보 시스템, 방제 우선순위 지역 선정, 지역 맞춤형 생물보안 계획 수립이 가능합니다. 또한, 생물다양성 보전 및 이용에 관한 법률, 환경영향평가 지침, 국가 생물보안 전략 수립 등 다양한 정책적·학술적 목적에 활용되며, 국립생태원은 이를 정기적으로 갱신하여 과학적 근거에 기반한 생물위해종 대응 체계를 강화하고 있습니다.
