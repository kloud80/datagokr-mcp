description_portal: 본 데이터는 국립공원 구역 내에 존재하는 **530여 개 유무인도서(無人島 및 有人島)**에 대한 기본 정보를 수록한 자료로, 도서 생태계 보전, 해양국립공원 관리, 해양 경관 연구 등에 필요한 기초 공간정보를 제공합니다. 주요 항목에는 도서명, 소속 지구명(국립공원 내 구역 단위), 행정구역, 위치 좌표(위도·경도), 면적(㎢), 해안선 길이(km), 도서 유형(유인/무인), 관리 주체, 이용 가능성 여부 등이 포함되며, CSV 포맷으로 제공됩니다. 해당 데이터는 해양 생태자원 현황 분석, 무인도서 생물 조사 기반 구축, 도서 경관 보전 계획 수립, 국립공원 탐방 자원 기초조사, 해양 공간계획 수립 등 다양한 정책 및 연구 목적으로 활용됩니다. GIS 기반 도서 분포 시각화, 항공영상 매핑, 해양보호구역 설정 등과 연계하여 고도화된 해양국립공원 관리에도 기여할 수 있는 자료입니다.
