description_portal: 경기도 수원시 월별 탄소중립포인트 가입현황에 대한 데이터로 개별단독수, 개별아파트, 상업개인, 상업법인, 공공기관, 학교, 단지 등의 항목을 제공합니다.탄소중립포인트제는 국민들의 친환경 행동을 유도하고, 일상 속에서 온실가스를 줄이기 위한 자발적인 참여를 유도하기 위해 도입된 정책입니다. 이 제도는 탄소 저감에 기여하는 행동을 했을 떄 포인트를 지급합니다. 탄소중립은 거창한 실천이 아닌, 전기 한 번 아끼기, 자동차 천천히 운전하기, 다회용컵 사용하기 등 (친환경 운전, 에너지 절약, 녹색제품 구매, 일회용품 사용 줄이기 등) 작고 쉬운 행동에서 시작됩니다.여러분의 참여가 지구를 바꾸는 첫걸음이 되므로 탄소중립포인트제 가입을 독려합니다.
