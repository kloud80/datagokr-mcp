description_portal: 본 데이터는 충청남도 대기오염측정망시스템을 통해 수집된 대기오염 주의보·경보 발령 및 해제 정보를 개방한 자료이다. 권역명과 항목명을 기준으로 미세먼지, 초미세먼지, 오존 등 주요 대기오염물질에 대한 발령상태를 제공하며, 발령시간과 발령농도를 통해 경보가 발효된 시점과 당시의 오염 수준을 확인할 수 있다. 또한 해제시간과 해제농도, 해제측정소 정보를 포함하여 경보 해제 조건과 측정 근거를 명확히 파악할 수 있도록 구성되어 있다. 해당 데이터는 고농도 대기오염 발생 현황 분석, 권역별 경보 발령 특성 비교, 대기오염 대응 정책 수립과 도민 건강 보호를 위한 기초자료로 활용되며, 연구기관과 민간 분야에서도 대기질 위험 관리 및 분석에 활용 가능한 공공정보이다.
