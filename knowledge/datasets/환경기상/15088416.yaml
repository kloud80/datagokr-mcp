description_portal: 이 데이터는 소규모 사업장을 대상으로 한 대기오염 방지시설 설치 지원사업의 대상 업체 정보를 정리한 자료입니다. 설치 연도, 업체명, 도로명 주소 또는 지번 주소, 설치된 방지시설 종류, 시간당 방지 용량(m³/min) 등의 항목으로 구성되어 있으며, 주요 업종은 금속가공, 도장, 화학처리 관련 소규모 제조업체들입니다. 방지시설 유형은 흡착, 흡수, 여과 방식 등으로 구분되며, 각 시설의 처리능력을 시간당 단위로 수치화하여 정리하고 있습니다. 주소는 일부 누락된 항목을 포함하나 전체적으로 단원구 내 산업단지 중심의 공간 분포를 확인할 수 있으며, 본 자료는 소규모 사업장의 환경부담 완화 실태 분석에 활용하실 수 있습니다.
