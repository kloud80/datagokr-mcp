summary_user: 충주시에 인터넷으로 접수된 대형폐기물 배출신고를 신고 건별로 담은 민원 원천 파일로, 접수일자·배출일자와 시간·행정동·도로명 신청주소·위도/경도·품목·수수료 합계를 포함한다. 충주시 담당자나 분석가가 "어느 행정동에서 언제 어떤 대형폐기물(침대·책상 등) 배출신고가 많고 수수료는 얼마나 걷히는가"를 파악해 수거 동선과 예산을 짜는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 좌표 기반 공간 매칭으로만 이어 쓴다.
description_portal: 충청북도 충주시에서 인터넷으로 접수된 대형폐기물 배출신고 내역을 정리한 민원관리 데이터입니다.접수일자, 배출장소(행정동), 신청주소, 위도·경도 좌표, 배출일자 및 시간, 배출 품목, 수수료 합계, 업체 코드 등의 항목으로 구성되어 있습니다.배출신고는 대형폐기물 배출 시 필수적인 인터넷 접수 건에 한하며, 수수료는 품목별 기준에 따라 자동 산정됩니다.신청주소는 도로명 기준으로 제공되며, 위도·경도 정보는 위치 기반 행정서비스 및 지도 연계용으로 활용 가능합니다.품목 항목은 침대, 책상, 의자, 욕조 등 생활 속 주요 폐기물 항목이 포함되며, 배출시간은 신청자가 지정한 시간대 기준입니다.본 데이터는 환경미화 및 수거정책 수립, 민원처리 이력관리, 생활폐기물 분포 분석, 폐기물처리 예산 산정 등 행정 및 민간 분야에서 다양하게 활용될 수 있습니다.※ 실제 수거 여부 및 처리 결과는 별도 시스템 또는 현장 수거일지와 연계 확인이 필요하며, 위치정보 기반 시각화 시에는 좌표의 정밀도 차이를 고려해야 합니다.
