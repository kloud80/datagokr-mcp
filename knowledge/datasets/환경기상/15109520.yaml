summary_user: 충청남도에서 구조된 야생동물을 격자 단위로 정리해 동물 국문명, 발생 연월, 대표 지목, 구조 건수, 카텍 좌표(X·Y)를 담은 데이터로, 시도 범위의 개별 위치 단위 자료이다. 도내 어느 지역·토지 유형에서 어떤 야생동물 구조가 많이 일어나는지 알아보려는 지자체 담당자나 생태·로드킬 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 좌표를 이용한 공간 결합이나 동물명·지목명 이름 매핑으로만 이어 쓴다.
