summary_user: 전국 환경소음 수동측정망의 측정지점별·분기별 소음도를 담은 파일로, 측정연도·분기마다 주간 시각별(9·12·16·20시) 측정값과 주간평균, 야간 시각별(23·1시) 측정값과 야간평균을 도시·측정지점·지역 단위로 기록한다. 주민이나 분석가가 "우리 동네 측정지점의 야간 소음이 분기마다 어떻게 달라졌나", "도시별 주간평균 소음이 어느 지역에서 높은가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 도시·측정지점·지역 이름을 맞춰 연결하거나 같은 기관(한국환경공단)의 다른 측정망 자료와 이름 기준으로 이어 쓴다.
description_portal: '소음진동관리법에 따라 분기별 소음정보 수동측정망 정보를 공개하고있으며 분기별, 측정값, 측정지점 등 다양한 정보를 제공합니다.소음유형 중 환경소음자동측정망(수동) 통해 전송한 데이터를 도시, 측정지점, 지역  등의 형태로 일평균(LEQ) 데이터를 제공합니다.국가소음정보시스템을 통하여 환경소음 수동측정망 측정일자 추가 확인 가능합니다.메뉴경로: 소음진동측정망-측정자료누리집 주소: https://www.noiseinfo.or.kr/noise/data.do'
