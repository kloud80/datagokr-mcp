summary_user: 경상남도 진주시가 들여온 쓰레기 종량제봉투·마대와 음식물류폐기물 납부필증의 입고 내역을 입고 건별로 담은 파일(CSV, 약 42KB)로, 입고일자·입고상태·제작업체·입고확정일·상품 등을 기록한다. 진주시 종량제봉투 공급이 품목별로 언제 얼마나 들어왔는지 살펴 재고·구매계획이나 분기·연도별 소요량을 비교하려는 행정 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상품명·업체코드를 이름 매핑하거나 같은 기관(진주시) 기준으로만 이어 쓴다.
description_portal: 경상남도 진주시 쓰레기종량제봉투 및 마대·음식물류폐기물납부필증 입고내역은 각 품목별 입고일자, 입고상태, 제작업체, 입고확정일  등 주요 정보를 기록·관리하는 자료입니다. 해당 데이터는 시에서 사용되는 종량제봉투와 음식물류폐기물납부필증의 재고 현황을 파악하고 향후 수요 예측, 구매계획 수립, 예산 집행의 적정성을 검토하는 데 활용됩니다. 또한 품목별 입고 추세를 확인함으로써 공급 안정성 점검, 사용량 분석, 분기·연도별 소요량 비교 등 행정적 판단의 근거 자료로서 중요한 기능을 합니다.
