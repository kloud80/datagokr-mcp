summary_user: 세종특별자치시 안의 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호·도로명/지번 주소·사업장 구분과 규모·연간 배출 예상량·처리 방법(위탁·자가)을 담는다. 지자체 담당자나 분석가가 '세종시 어느 지역에 음식물 다량배출 급식소·식당이 몰려 있고, 자가처리와 위탁처리 비율은 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 주소(사업장도로명주소)를 지오코딩하거나 상호 이름으로 매칭해 다른 지자체 같은 종류의 파일이나 폐기물 처리업체 자료와 잇는다.
description_portal: 세종특별자치시 음식물류폐기물 다량배출사업장 현황입니다.사업장이름, 사업장 소재지, 사업장 연락처, 업종구분, 처리구분( 위탁, 자가), 1년 처리량으로 관리하고 있습니다.음식물류폐기물 다량배출사업장은 전체 512개소이며, 교육기관, 어린이집, 공장내 집단급식소, 규모가 있는 식당 등으로 홍익대학교, 대동초등학교, 삼주외식산업(주), 샤브홀리 세종점, 윤가네들깨수제비, 용손짜장 등이 있습니다.이자료는 세종특별자치시 자원순환과에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.
