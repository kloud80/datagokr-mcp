summary_user: 철도소음 수동측정망으로 잰 확정 소음 수치를 측정지점별·반기별로 담은 전국 단위 파일(csv, 약 9KB)로, 권역·대표노선·용도구분과 함께 지면 위와 최고소음 예상층의 낮(11시·18시·평균)·밤(22시) 값을 담는다. 철도 인근 주민이나 분석가가 "우리 지역 철도 노선 주변 소음이 반기별로 낮과 밤에 얼마나 되는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 권역·노선·측정지점 이름을 맞추거나 같은 기관(한국환경공단)의 다른 소음 자료와 이름 기준으로 이어 쓴다.
description_portal: 소음ㆍ진동관리법에 따라 한국환경공단에서 철도소음 정보를 관리하고있으며 철도소음 확정 수치에 대해 정보를 제공하고있습니다.소음유형 중 철도소음수동측정망을 통해 수집한 데이터를 권역, 대표노선, 지점, 용도구분 등의 형태로 반기별 데이터를 제공합니다.
