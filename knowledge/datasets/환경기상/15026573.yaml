description_portal: 부산광역시 북구 관내에 있는 수질검사 대상 지하수(관정)에 대한 데이터로 관리번호, 검사일자, 검사종류, 검사결과, 검사기관명, 용도, 세부용도, 음용여부, 관정위치를 반기별로 제공합니다.지하수 수질검사 근거 법령은 아래와 같으며, 부산광역시 북구청 홈페이지>분야별정보>청소/환경/위생>환경정보알리미 게시판에 연간 수질검사 검사 결과를 게시하고 있으니 참고해주시기 바랍니다.※ 관련법령  - 지하수법 제20조(수질검사 등) ① 제7조 또는 제13조에 따라 허가를 받거나 제8조에 따라 신고하고 지하수를 개발ㆍ이용하는 자로서 대통령령으로 정하는 자는 정기적으로 지하수 관련 검사전문기관의 수질검사를 받아야 한다. - 지하수법 시행령 제29조(수질검사 등) ① 법 제20조제1항에서 “대통령령으로 정하는 자”란 다음 각 호의 어느 하나에 해당되는 지하수를 개발ㆍ이용하는 자를 말한다. 다만, 공공급수용으로 지하수를 개발ㆍ이용하는 자로서 「수도법」 제19조에 따라 수질검사를 받은 자는 제외한다.1. 먹는물2. 환경부령으로 정하는 규모, 세부 용도 등에 해당되는 생활용수, 공업용수 및 농ㆍ어업용수② 제1항에 해당하는 자는 환경부령으로 정하는 기간마다 지하수 관련 검사전문기관(이하 “수질검사전문기관”이라 한다)으로부터 지하수의 수질검사를 받아야 한다. 이 경우 해당 지하수를 먹는물로 개발ㆍ이용할 때에는 제30조제1항제2호에 따른 검사기관에서 수질검사를 받아야 한다.
