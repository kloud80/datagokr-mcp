summary_user: 갯벌 서식 생물(명칭·서식 장소·특징)과 갯벌 체험마을(제목·마을명·지역명·위·경도)을 건별로 담은 해양수산부 API이며, 전체 건수는 103건이고 전국 범위다. 갯벌 체험 프로그램을 기획하는 지자체·사업자나 갯벌에 어떤 생물이 사는지 찾는 연구자·교사가 생물명이나 체험마을명으로 조회하는 데 쓴다. 위도(mdftLat) 좌표를 조인 키로 삼아 다른 해양 보호구역·해양공간 규제 레이어와 위치 기준으로 겹쳐 쓴다.
description_portal: 이 데이터는 해양수산부에서 갯벌의 생태정보 및 갯벌 체험 마을과 관련된 정보를 제공하기 위해 수집한 데이터입니다.  전체 데이터 조회 또는 특정 생물명, 체험마을명 등 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 갯벌에 서식하는 생물의 명칭, 해당 생물이 발견되는 갯벌 서식 위치 등 갯벌 생태 정보 및 갯벌 체험마을의 명칭, 지역명, 위치 등 정보로 구성되어 있습니다.  본 데이터는 국내 갯벌 환경 조사 연구, 생태계 보호 정책 수립, 각 지역 갯벌 체험 프로그램 개발, 관광 자원 관리 및 교육 자료 작성 등에 활용될 수 있습니다.
team:
  dept: 해양환경정책과
services:
  - op: /MudFlatEcoInfo
    name: 갯벌 생태정보 조회
    endpoint: https://apis.data.go.kr/1192000/MudFlatInfoService/MudFlatEcoInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mdft_lvb_nm
        required: false
        desc: 갯벌생물명
      - name: mdft_frmt_place_cn
        required: false
        desc: 갯벌서식장소내용
      - name: mdst_cn
        required: false
        desc: 갯벌이야기내용
      - name: _type
        required: true
        desc: 페이지 문서 형태
      - name: numOfRows
        required: true
        desc: 페이지 크기
      - name: pageNo
        required: true
        desc: 페이지 번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /MudFlatExprVllgInfo
    name: 갯벌 체험 마을 정보 조회
    endpoint: https://apis.data.go.kr/1192000/MudFlatInfoService/MudFlatExprVllgInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mdft_expr_subj_nm
        required: false
        example: 북고마을
        desc: 갯벌체험제목명
      - name: mdft_expr_ptcl_vllg_nm
        required: false
        example: 북고갯벌체험
        desc: 갯벌체험세부마을명
      - name: mdft_area_nm
        required: false
        example: 전라남도
        desc: 갯벌지역명
      - name: _type
        required: true
        example: xml
        desc: 페이지 문서 형태
      - name: numOfRows
        required: true
        example: '10'
        desc: 페이지 크기
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지 번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
