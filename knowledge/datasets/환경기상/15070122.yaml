summary_user: 비점오염원관리 정보시스템에서 쓰는 공통코드를 코드종류와 세부코드 단위로 담은 코드표 파일(csv, 약 209KB)로, 사업종류·강우형태·유지보수·업종·하천 수계 등의 코드와 코드명을 전국 범위로 담는다. 비점오염 저감사업이나 설치신고 자료를 분석하는 사람이 다른 비점오염 데이터에 찍힌 코드값이 어떤 사업종류나 수계를 뜻하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 같은 기관의 비점오염원 관련 데이터에 있는 코드값을 세부코드와 맞춰 이름으로 풀어 읽는 용도로 이어 쓴다.
limits: 코드와 코드명만 담고 있어 오염 배출량이나 시설 현황 같은 실제 값은 없다. 다른 데이터와는 전역 키가 아니라 같은 기관 코드나 이름 매핑으로만 연결되므로, 코드종류를 먼저 맞춘 뒤 세부코드를 대조해야 한다. 공간정보가 없는 전국 단위 비공간 자료다.
