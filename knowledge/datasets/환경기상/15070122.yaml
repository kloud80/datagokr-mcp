description_portal: 비점오염원은 도시, 도로, 농지, 산지, 공사장 등으로서 불특정장소에서 불특정하게 수질오염물질을 배출하는 배출원입니다.비점오염원 관련 설치신고, 측정망, 고랭지밭 지리정보 점검 등 효율적인 비점오염 저감 사업의 관리와 종합 비점오염 정보제공을 위해 통합관리 운영중인 비점오염원관리 정보시스템의 자료를 관리하기 위한 공통코드 데이터로서  코드종류, 코드종류명, 세부코드, 세부코드명 등을 개방하고 있습니다.개방하는 코드 종류에는 사업종류, 강우형태, 유지보수, 업종 및 하천  수계에 대한 세부 코드 정보를 제공합니다.
