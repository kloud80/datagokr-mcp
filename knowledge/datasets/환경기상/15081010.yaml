summary_user: 강릉시에 지정폐기물 배출자로 신고한 사업장별로 폐기물 종류, 운반자, 처리업소, 처리방법, 연간 신고 배출량(톤)을 담은 건별 신고 현황 파일이다. 지역 폐기물 처리업체나 분석가가 '강릉에서 폐석면이나 폐산을 내는 사업장은 어디이고, 어느 업체가 운반·처리하는가'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 원장이나 다른 폐기물 처리업 허가 데이터와 잇고, 사업장 도로명주소로 위치를 붙인다.
description_portal: "공공데이터 제공신청건으로, 강원특별자치도 강릉시 지정폐기물 배출자 신고 현황 데이터입니다.본 데이터는 11개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.업무구분: '지정폐기물배출자관리' 등 업무의 분류상호: '지우건설(주)', '국립강릉원주대학교' 등 폐기물 배출 사업장의 이름폐기물 종류: '흩날릴 우려가 없는 폐석면', '그 밖의 폐산' 등 지정 폐기물의 상세 분류사업자등록번호: 사업자 등록번호운반자: '주식회사 황소' 등 폐기물을 운반하는 업체의 이름처리업소명: '(주)에코비트그린포항' 등 폐기물을 최종 처리하는 업체의 이름처리방법: '매립(민간관리형매립시설)', '재활용(원료 제조)' 등 폐기물의 처리 방식사업장도로명주소: 배출 사업장의 도로명 주소배출량(톤): 연간 신고된 폐기물 배출량 (톤 단위)신고기준년도: 신고한 기준 연도 (예: 2024)데이터기준일자: 해당 현황을 조사한 기준 날짜이 11개 항목의 조합을 통해, 상호별 폐기물 종류, 처리방법, 배출량 및 운반/처리 업체 현황을 파악할 수 있습니다."
