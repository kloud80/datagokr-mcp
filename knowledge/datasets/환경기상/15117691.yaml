description_portal: 본 데이터는 국가공간정보체계시스템 내의 방재기상관측소와 지상기상관측소에 대한 정보를 담고있습니다. 2023년 8월 기준 총 2개의 관측소에 대해 구분(종관기상관측(ASOS), 계절관측), 관측소명, 주소, 관리기관, 운영기관, 관측개시일, 경도, 위도 정보가 수록되어 있습니다. 두 관측소 모두 금산기상관측소(금산읍 아인리)에 위치하고 있으며, 기상청에서 관리하고 대전지방기상청 관측과에서 운영하고 있습니다. 해당 데이터는 지역의 기상 관측 인프라 구축 실태를 파악하는 데 활용됩니다.
