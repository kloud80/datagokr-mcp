description_portal: 환경책임보험 폐기물시설 상세 정보는 폐기물 처리와 관련된 매체시설의 운영 현황, 처리 능력, 안전관리 및 보험 가입 여부를 종합적으로 관리하기 위해 구축된 데이터이다. 각 시설은 매체시설코드와 매체시설일련번호를 통해 고유하게 식별되며, 이를 기반으로 개별 시설의 세부 정보를 체계적으로 기록할 수 있다.시설의 성격과 처리 범위를 나타내는 지정폐기물처리시설여부와 처분업시설구분코드를 통해 해당 시설이 지정폐기물 처리 대상인지, 그리고 어떤 유형의 폐기물 처분업에 속하는지를 파악할 수 있다. 또한, 매립면적, 총매립용량, 전년도매립량, 소각시설용량, 년간재활용량 등은 시설의 물리적 규모와 연간 운영 실적을 보여주는 핵심 지표로 활용되며, 시설별 위험도 평가와 보험 적용 범위 판단에 중요한 근거가 된다.보험 관련 항목인 보험가입코드와 보험가입대상코드는 해당 시설이 환경책임보험에 가입했는지, 법적 의무 가입 대상인지 여부를 구분하며, 이를 통해 보험 관리와 행정적 대응을 체계적으로 수행할 수 있다. 시설의 세부 특성을 보완하는 세부시설코드와 폐기물소각능력텍스트값처리는 시설의 처리 능력과 운영 유형을 보다 구체적으로 기록한다.시설 운영 상태는 휴업시작일자, 휴업종료일자, 폐업일자, 인허가반납여부를 통해 관리되며, 시설상태코드, 위해성방지조치여부, 시설설치여부를 통해 현재 시설의 안전관리 조치와 설치 상태를 확인할 수 있다. 미가동시작일자, 미가동종료일자는 운영 중단 기간을 기록하여 행정 관리와 통계 산출에 반영된다. 마지막으로 삭제여부, 정보승인상태코드, 연도는 데이터의 유효성과 승인 상태, 기준 연도를 관리함으로써 정보의 신뢰성을 확보한다.이와 같이 폐기물시설 상세 정보는 환경책임보험 제도의 효과적인 운영을 위해 필수적인 자료로, 시설별 안전 관리, 보험 가입 현황 파악, 정책 수립 및 행정 조치의 근거 자료로 활용된다.
