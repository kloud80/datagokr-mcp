summary_user: 서울특별시 동작구에 설치된 폐형광등·폐건전지 분리수거함을 설치 장소 한 곳당 한 행으로 담은 원천 목록으로, 지번·도로명 주소, 건물명, 설치 개수를 포함한다. 주민이 집 근처 어느 건물에 폐형광등이나 폐건전지를 버릴 수 있는 수거함이 있는지 찾거나, 구청·분석가가 동네별 수거함 배치와 수량을 점검하는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 주소(지번·도로명)를 지오코딩하거나 이름을 맞춰 연결해야 하고, 다른 자치구의 같은 종류 파일과는 항목을 맞춰 이어 붙여 쓴다.
limits: 동작구 한 곳만 다루므로 서울 전체나 다른 시군구의 수거함 위치는 담지 않는다. 좌표나 표준 코드가 없어 지도 표시나 다른 데이터와의 결합은 주소 변환·이름 매칭을 거쳐야 한다. 폐기물 발생량이나 수거 실적 같은 처리 통계는 들어 있지 않다.
