description_portal: 서울특별시 동작구 폐형광등(폐건전지) 분리수거함 현황에 관한 데이터입니다.본 데이터는 폐형광등 및 폐건전지의 안전한 수거와 환경오염 예방을 위한 기초자료로 활용될 수 있습니다.이 데이터에는 분리수거함 위치(지번주소,도로명주소 등), 건물명, 개수 등이 포함되어 있습니다.지번주소 정보와 도로명주소가 함께 제공되어 행정주소 체계 기준으로 위치 확인이 가능합니다.건물명 정보는 수거함이 설치된 정확한 장소를 파악하는 데 도움을 줍니다.개수 항목을 통해 해당 위치에 설치된 분리수거함 수량을 확인할 수 있습니다. 수거함 수량 정보는 관리 물량 산정과 수거 주기 설정에 활용됩니다.
