summary_user: 인천광역시 남동구에서 대형폐기물을 버릴 때 내는 수수료를 품목(품명)·규격별 단가로 담은 표 형태의 파일로, 건별 배출 기록이 아니라 요금 기준표다. 남동구 주민이 소파·장롱 같은 큰 물건을 내놓기 전에 '이 크기의 이 품목은 얼마를 내야 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체의 대형폐기물 수수료 파일과는 품명·규격 이름을 맞춰 비교하는 방식으로만 이어 쓴다.
