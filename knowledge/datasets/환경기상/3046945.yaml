summary_user: 경상북도 영주시 안에서 석면조사 대상이 된 공공·다중이용 건축물의 구분, 건축물명, 소재지를 건물 한 곳당 한 행으로 담은 작은 CSV 파일(약 7KB)입니다. 영주시 주민이나 학부모·시설 이용자가 '내가 다니는 이 건물이 석면조사 대상인가'를 확인할 때, 그리고 행정 담당자나 분석가가 석면 관리 대상 시설의 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 건축물명이나 소재지 주소를 문자열로 맞추거나, 주소를 지오코딩해 건축물대장 같은 자료와 이어 써야 한다.
