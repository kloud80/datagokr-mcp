description_portal: 본 데이터는 지역 내 공공 및 다중 이용시설 등에 설치된 건축물 중 석면 함유 가능성이 있는 공간을 식별하고, 그 현황을 체계적으로 관리하기 위해 구축된 공공데이터 입니다.건축물의 구분, 명칭, 소재지 주소 드으이 항목으로 구성되어 있으며, 석면 사용 여부에 대한 실태 파악과 관리 이력을 기록하는 것에 목적이 있습니다.이를 통해 유해물질 노출 가능성이 있는 시설을 조기에 파악하고, 관련 시설에 대한 정비, 철거 또는 보완 조치를 수립하는 데 필요한 근거 자료로 활용될 수 있습니다.또한 환경보건정책 수립, 공기질 관리 등과 같은 다양한 행정 및 공공보건 영역에서 기능합니다.영주시 석면 관리 정보는 시 홈페이지(https://www.yeongju.go.kr/open_content/main/page.do?mnu_uid=3945&)를 통해 더 자세히 확인 가능합니다.
