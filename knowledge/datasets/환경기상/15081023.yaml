summary_user: 서울 동대문구 관내에서 사업장폐기물 배출자로 신고한 업체를 한 행씩 담은 신고 원장으로, 사업장일반폐기물과 지정폐기물 구분, 상호, 폐기물 종류, 처리방법, 신고기준년도를 담는다. 동대문구에서 어떤 업체가 지정폐기물을 배출하고 어떤 방법으로 처리하는지를 확인하려는 주민·사업자·환경 분석가가 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 상호 이름 매칭이나 같은 기관(동대문구) 자료끼리만 이어 쓴다.
limits: 사업자번호·주소 같은 공통 키가 없어 다른 기관의 처리업 허가·사업자 데이터와 정확히 조인하기 어렵고, 상호 문자열로 맞출 때는 오매칭에 주의해야 한다. 범위는 동대문구 한 곳의 신고 업체 목록이며 폐기물 발생량이나 처리량 통계는 담지 않는다.
