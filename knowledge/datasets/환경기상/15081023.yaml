description_portal: 본 데이터셋은 서울특별시 동대문구 관내에서 발생하는 사업장폐기물 배출자 신고 현황을 체계적으로 정리한 자료입니다. 폐기물관리법에 따라 일정 규모 이상의 폐기물을 배출하는 사업장은 의무적으로 신고를 마쳐야 하며, 본 자료에는 일상적인 산업 활동에서 발생하는 사업장일반폐기물과 환경오염이나 인체 위해성이 있어 엄격한 관리가 필요한 지정폐기물 배출 업체 정보가 포함되어 있습니다.주요 내용으로는 폐기물을 배출하는 업체의 명칭과 배출되는 폐기물의 종류 등을 상세히 제공합니다.
