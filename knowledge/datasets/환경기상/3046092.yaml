summary_user: 대구 남구 관내 석면조사 대상 건축물을 한 건물씩 담은 목록 파일로, 용도 분류·건축물명(상호)·건물명·주소·석면건축물 여부·석면조사식별번호를 담는다. 리모델링이나 해체를 앞둔 건물주·시공사, 그리고 주민이 '우리 동네 이 건물이 석면건축물로 확인됐는가'를 주소로 찾아보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 건물명을 맞춰 붙이거나 같은 남구 자료끼리 이어 써야 한다.
description_portal: 대구 남구 석면조사 대상 건축물 현황에 대한 데이터로 용도 분류, 건축물명(상호), 건물명, 주소 등의 항목을 제공합니다. 본 데이터는 남구 관내 석면 조사대상 건축물을 체계적으로 관리·공개하기 위하여 구축된 목록이다. 관련 법령과 지침에 따라 행정자료, 현장조사, 신고·검증 절차를 통해 조사대상 여부를 확인하고, 지정·해제 및 조사 완료 시점의 최신 상태를 반영하여 정비한다. 주요 항목은 용도분류, 건축물명/건물명, 주소, 석면건축물 여부, 석면조사식별번호 등으로 구성한다. 본 데이터는 석면 해체·리모델링 사전 검토, 공사 인허가 협의, 취약시설 관리, 주민 알권리 보장 및 안전한 생활환경 조성에 활용될 수 있다. 아울러 민간에서는 위험지도, 알림 서비스, 시설 유지관리 시스템 등 공공·산업 분야 서비스 개발의 기초자료로 활용 가능하다.
