description_portal: 본 데이터는 한국환경산업기술원이 추진하는 환경 R&D 사업 중 생명자원 정보 등록 현황을 제공하는 공공데이터입니다. 다부처 국가생명연구자원 선진화 사업, 생태모방 기반 환경오염관리 기술개발 등 주요 과제별로 연구기관, 연구책임자, 과제 시작·종료일, 성과년도, 성과구분, 등록(기탁)번호 및 기관 정보를 포함합니다. 이를 통해 사용자는 미세조류·균류·포유동물 표본 등 주요 생명자원 기탁 현황과 성과 데이터를 종합적으로 파악할 수 있습니다. 연구자는 자원 기탁 현황을 기반으로 균주·표본의 활용 경로를 분석하고, 생물다양성 보전 연구, 유용유전자 발굴, 생명정보 데이터베이스 구축 및 국제 협력 네트워크 강화, 등록 자원 분류체계 개선 등에 활용할 수 있습니다.
