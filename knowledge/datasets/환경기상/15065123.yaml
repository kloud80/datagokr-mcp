summary_user: 전북특별자치도 진안군 관내 사업장폐기물 배출신고 업체를 한 업체당 한 행으로 담은 원장 파일로, 상호·사업장 도로명주소·신고된 폐기물 종류·전화번호가 들어 있다(CSV 약 5.7KB, 진안군 단일 범위). 폐기물 수집운반·처리 사업자가 진안군에서 어떤 업체가 어떤 종류의 폐기물을 배출 신고했는지 찾아 영업 대상을 고르거나, 주민·분석가가 관내 배출 사업장 위치를 확인하는 데 쓴다. 전역 조인 키나 사업자번호 같은 코드가 없어 다른 데이터와는 상호명·도로명주소를 맞춰 붙여야 한다.
description_portal: 전북 특별자치도 진안군의 관내 사업장 폐기물 배출 신고자 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 연번, 신고 업체명, 사업장 도로명주소, 신고된 폐기물 종류와 전화번호 정보를 제공합니다. 여기서 업체명과 폐기물 종류를 통해 어떤 업체가 대략 어떤 업종을 가졌는지 확인할 수 있습니다. 또한 폐기물 종류 정보로 폐기물 관련 사업을 진행할 때 참고할 수 있습니다. 전화번호 자료 중 빈칸은 휴대전화 전화번호로 개인정보에 해당하여 제외 처리했습니다. 그리고 이 자료는 매년 12월 초에 현행화하여 제공합니다.
