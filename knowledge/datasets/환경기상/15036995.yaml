summary_user: 울산광역시 동구 관내 백화점·영화관·체육시설·종교시설·대형 음식점 등 다중이용시설을 시설 한 곳당 한 행으로 담은 목록 파일(csv, 약 1KB)로, 시설구분·시설명·주소·전화번호·관할기관·데이터 기준일을 담는다. 동구 주민이나 안전·환경 담당자가 '동구에 실내공기질 관리 대상이 될 만한 다중이용시설이 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 같은 기관(울산 동구) 기준으로만 이어 쓴다.
description_portal: 울산광역시 동구 관내의 다수 인원이 이용하는 시설에 대한 정보를 포함하며, 시설구분, 시설명, 주소, 전화번호 등의 항목으로 구성된다. 대상 시설은 백화점, 영화관, 체육시설, 종교시설, 대형 음식점 등 다양한 용도로 사용되는 공공 또는 민간 건축물이며, 재난 예방 및 안전관리, 도시계획 수립, 공공서비스 제공의 기초자료로 활용 가능하다. 이 데이터는 시민의 안전 확보와 효율적인 행정 대응을 위해 제공되며, 정기적인 점검과 관리 현황이 반영되어 있다. 각 시설의 특성과 규모에 따른 행정적 조치 계획 수립 시 참고할 수 있도록 설계되었다.
