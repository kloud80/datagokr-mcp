summary_user: 비점오염 저감시설을 종류·시도·관할기관·수계별로 집계해 시설 수, 규모 용량값(최소·평균·최대), 예상 부유물질·생물학적산소요구량 처리효율값을 담는 API로, 건별 원천이 아닌 집계 현황이며 전국 시도 단위이고 전체 100건이다. 지자체 담당자나 분석가가 우리 시도에 어떤 종류의 저감시설이 몇 개 있고 규모와 예상 처리효율이 어느 정도인지 비교하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 시도명·관할기관명·수계명 같은 이름 매핑이나 같은 기관 코드로만 다른 수질 오염원 데이터와 이어 쓴다.
description_portal: 비점오염원은 도시, 도로, 농지, 산지, 공사장 등으로서 불특정장소에서 불특정하게 수질오염물질을 배출하는 배출원으로 비점오염원으로부터 배출되는 수질오염물질을 제거하거나 감소시키는 시설이 비점오염 저감시설입니다.일정 규모 이상의 개발사업 및 비점오염물질 배출가능성이 큰 사업장에 대하여 비점오염원 설치를 신고하고, 비점오염저감시설을 설치하도록 규정하고 있습니다.비점오염원관리 정보시스템에 등록된 저감시설 종류 코드, 수계 번호, 관할 기관명 정보를 통해 저감시설 종류/시도/관할구역별을 기준으로 유형별 저감시설 현재 수 정보와 규모 용량 값, 예상 처리 부유물질 효율 값, 예상 처리 생물학적 산소요구량 효율 값 정보 등을 제공하는 비점오염원 저감시설 현황 서비스 입니다.
