summary_user: 성남시에서 가구·가전제품·주방용품 등 대형폐기물을 배출할 때 적용하는 품목별 기준을 분류·품명·규격·수수료 단위로 정리한 품목표이며, 개별 배출 건이 아닌 기준정보 파일(CSV 약 11KB)이다. 성남시 주민이 '서랍장이나 의자를 버릴 때 수수료가 얼마인가'를 확인하거나, 분석가가 지자체별 대형폐기물 수수료를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 지자체의 대형폐기물 파일과는 품명·분류 이름을 맞춰 연결해야 한다.
description_portal: 성남시 대형폐기물 수거 기준정보는 시민들이 가구, 가전제품, 악기, 주방용품 등 부피가 큰 폐기물 배출정보를 정리한 자료입니다. 이 자료에는 대형폐기물의 분류(가구류, 주방용품, 가전제품 등), 품명(서랍장, 의자, 장식장 등), 규격, 수수료 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 대형폐기물을 효율적으로 처리할 수 있도록 품목별로 세분화되어 있어 배출시 용이하게 활용할 수 있습니다.
