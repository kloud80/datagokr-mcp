summary_user: 경기도 31개 시군에서 인허가된 기타 수질오염원 설치시설을 사업장 한 곳당 한 행으로 담은 건별 현황으로, 사업장명·인허가일과 폐업일·영업상태·업종과 업태·주요 생산품·도로명과 지번 주소·위경도 좌표·배출시설과 방지시설의 연간 가동일수를 포함한다. 우리 동네 하천 주변에서 지금 영업 중인 기타 수질오염원 사업장이 어디에 몇 곳 있는지 확인하려는 주민이나, 오염원 지도를 만드는 환경 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 주소·사업장명 매칭, 또는 위경도 좌표를 이용한 공간 결합으로만 잇는다.
description_portal: 이 데이터는 경기도 내 수질오염물질을 배출하는 기타 시설의 현황을 수록한 자료로, 폐수배출시설, 하수발생시설, 축사 등 점오염원 및 비점오염원으로 분류되지 않는 기타 수질오염원을 대상으로 합니다. 사업장명, 인허가일자 및 취소일자, 영업상태, 업종 및 업태 정보, 소재지 주소(도로명 및 지번), 위경도 좌표(WGS84 기준), 주요 생산품, 배출시설 및 방지시설의 조업 시간과 연간 가동일수 등 다양한 항목으로 구성되어 있습니다. 본 데이터는 수질 환경 관리, 산업오염원 감시, 오염원 지도 작성, 지역 환경정책 수립 등에 활용될 수 있으며, 경기도 31개 시군의 인허가 정보를 포함하고 주간 단위로 갱신되며 Open API 형식으로 제공됩니다.
