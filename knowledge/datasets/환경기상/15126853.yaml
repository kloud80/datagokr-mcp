description_portal: 사전할당량은 배출권거래제 3차 계획기간("21~"25년 기준) 업체별 사전할당량에 대한 자료로 온실가스종합정보센터의 배출권등록부 시스템(ETRS)과 연계되어 공개하는 자료이며, 업종 정보(부문, 업종, 업체명 등), 사전할당량 등으로 구성된 데이터입니다.할당대상업체로 지정된 업체는 온실가스 배출권 할당 및 거래에 관한 법률에 따라 모든 사업장에 대하여 배출권 할당신청서를 제출해야하며, 주무관청은 할당량을 업체에 통보하고, 배출권등록부의 각 업체별 계정에 그 할당 내역을 등록하여야 합니다.
