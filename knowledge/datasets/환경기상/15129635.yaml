description_portal: 본 데이터는 충청남도 계룡시에 등록된 위탁급식영업 업소의 상세 정보를 담고 있습니다. 핵심 컬럼인 업종명은 ‘위탁급식영업’으로 고정되며, 각 업소를 식별하는 인허가번호와 업소명을 포함합니다. 영업 주체인 영업자 정보와 현재 소재지(도로명), 그리고 연락 가능한 소재지전화 번호가 제공됩니다. 특히, 업소의 규모를 파악할 수 있는 다양한 면적 데이터가 특징입니다. 전체 규모를 나타내는 영업장면적(내부 외부 포함)을 비롯하여, 이를 건물내부면적과 건물외부면적으로 세분화했습니다. 또한, 세부 시설 면적으로 영업장조리장면적, 영업장객실면적, 영업장기타면적, 영업장객석면적 등이 포함되어 있습니다. 위생 관련 시설로 업소내화장실면적, 타업소공동화장실면적, 영업장탈의실면적 등의 정보도 확인할 수 있습니다. 데이터는 영업 행태를 나타내는 업태명 컬럼도 포함하고 있어, 계룡시 내 위탁급식 시설의 분포와 특성을 분석하는 데 활용할 수 있습니다.
