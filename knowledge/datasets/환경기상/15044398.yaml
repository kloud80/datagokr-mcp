summary_user: 고양시 일산동구의 종량제봉투 지정판매소를 판매소 한 곳당 한 행으로 담은 목록 파일로, 행정동·판매소명·주소를 담는다(csv 약 26KB). 일산동구 주민이 '우리 동네 어느 가게에서 종량제봉투를 살 수 있나'를 찾거나, 생활정보 서비스가 판매소 위치를 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 행정동 이름이나 주소 문자열로 다른 데이터와 맞춰야 하며, 고양시 다른 구의 판매소 파일이나 같은 기관의 배출·수거 지점 자료와 이름 기준으로 이어 쓴다.
description_portal: 경기도 고양시 일산동구에서 판매되고 있는 종량제봉투판매처에 대한 현황자료로서 종량제봉투판매처 행정동, 판매소명, 주소 대한 데이터입니다.  고양시 종량제 봉투의 현황을 공개함으로써, 종량제봉투 지정판매소 정보를 알기쉽게 정보로 목록화하였습니다. 목록화한 정보는 지역주민 등 생활정보로 유용하게 쓰일뿐만 아니라 위치현황 공유를 통해 알고싶은 정보를 제공함으로써 공공기관의 책무를 이행하기 위함입니다. 고양시 행정구역별 판매정보를 제공하여 유익하고 알찬 정보를 추가 제공하기 위한 노력을 기울일 예정입니다.
