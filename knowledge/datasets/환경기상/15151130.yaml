description_portal: 불법투기 감시카메라 현황 데이터는 관내 쓰레기 불법투기 행위를 예방하고 신속한 단속을 지원하기 위해 설치된 감시카메라의 위치와 운영 현황을 체계적으로 관리하기 위한 자료이다. 이 데이터는 주로 행정기관의 생활폐기물 관리 정책 수립, 단속 효율성 분석, 환경 정화 활동의 우선순위 설정 등에 활용된다. 주요 항목으로는 설치장소, 도로명주소, 지번주소, 카메라대수, 단속시간, 설치연도, 데이터기준일자가 포함되어 있다.‘설치장소’는 감시카메라가 위치한 구체적인 지점이나 시설명을 의미하며, ‘도로명주소’와 ‘지번주소’는 해당 위치를 행정적으로 구분하기 위한 기본 주소 정보이다. ‘카메라대수’는 해당 지점에 설치된 카메라의 개수를 나타내며, 단속 밀도나 장비 운영 규모를 파악하는 데 활용된다. ‘단속시간’은 카메라가 작동하거나 단속이 이루어지는 시간대를 나타내어, 24시간 상시 감시 여부나 특정 시간대 집중 단속 현황을 분석할 수 있다. 또한 ‘설치연도’는 감시장비의 설치 시점을 나타내어 장비 노후도나 교체 주기 산정에 유용하며, ‘데이터기준일자’는 데이터가 최신화된 시점을 명시하여 행정의 시의성을 보장한다.이 데이터는 불법투기 근절을 위한 공간적·시간적 패턴 분석, CCTV 추가 설치 우선지역 도출, 환경개선 효과 평가 등 정책 의사결정의 근거 자료로 활용될 수 있다.
