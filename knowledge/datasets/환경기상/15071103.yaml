description_portal: '매년 전국 광역지자체(17개), 기초지자체(229개)의 시도별, 시군구별 및 4대강(한강, 낙동강, 금강, 영산강)의 인구수를 별도 산정하여 그 결과값을 제공산정방법은 법정구역 및 시가·비시가 지역 기준으로 처리경로별 인구수를 합산하여 산정- 제공 데이터 : 시도별, 시군구별 및 대권역, 중권역 별 시가지역의 인구수와 비시가지역으로 구분하여 인구수 총합을 제공* 시가지역과 비시가지역은 하수처리구역과 하수미처리구역으로 구분하며, 하수처리구역은 분류식과 합류식으로 구분, 하수미처리구역은 오수처리, 단독정화, 수거식으로 구분하여 제공'
