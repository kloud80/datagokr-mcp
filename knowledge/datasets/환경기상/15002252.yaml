description_portal: 해양환경공단이 수행한 해양부유쓰레기 수거 및 처리 실적 정보를 제공합니다. 본 데이터는 해양에 떠다니는 폐플라스틱, 스티로폼, 목재, 로프류 등 다양한 형태의 부유성 쓰레기에 대해 수거량, 수거 위치, 처리 방법 등을 정리한 자료입니다. 데이터는 연안, 항만, 도서지역 등 권역별로 구성되어 있으며, 연도별 수거 실적 및 처리 결과도 포함됩니다. 수거 방식은 청항선, 어업인 참여, 민간 위탁 등으로 구분되며, 각 방식에 따른 처리성과 분석이 가능합니다. 본 자료는 해양부유쓰레기 저감 정책 수립, 정화 우선지역 선정, 실무 적용 계획 수립 등에 활용되며, 공공기관 및 연구기관의 정책 기초자료로 제공됩니다. 데이터는 표 및 보고서 형태로 제공합니다.
