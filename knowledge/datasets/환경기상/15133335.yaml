summary_user: "경상북도 안동시에 설치된 대기 배출시설 사업장을 한 행씩 담은 파일 데이터로, 사업장명·도로명/지번주소·위도·경도·대표업종·사업장 종별(종)·기준일자를 사업장 단위로 수록한다. 주민이나 지역 환경 분석가가 '우리 동네 주변에 어떤 업종의 몇 종 대기 배출 사업장이 있는가'를 확인하거나 배출원 분포를 지도에 올려 볼 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합(예: 대기질 측정소 위치)으로만 이어 쓴다."
description_portal: 해당 공공데이터는 경상북도 안동시 지역 내에 설치된 대기 배출시설 사업장에 대한 정보를 수록하고 있습니다. 본 자료는 경상북도 안동시 내 대기 배출시설 설치사업장의 사업장명, 도로명주소, 지번주소, 위도, 경도, 대표업종, 종 등 정보를 포함하고 있습니다. 본 데이터를 통해 대기오염을 유발할 수 있는 시설들을 체계적으로 관리하기 위한 기초자료로 활용될 수 있으며, 환경 규제 및 점검 업무에 활용되며 대기질 개선과 지역 환경정책 수립 실행에 있어 과학적 근거를 제공하는 핵심 인프라 역할을 수행할 것으로 판단됩니다.
