summary_user: 기상청 기상관측선 기상1호가 서해·남해·근해를 항해하며 관측한 해상 기상(기압·기온·습도·바람·파고·수온 등)과 레윈존데 고층 기상 자료를 기상청 API허브에서 조회하는 서비스이며, 명세상 필드가 한 줄 텍스트(line)뿐이라 건별 관측값의 세부 구성은 응답을 직접 확인해야 한다. 해양·대기 연구자가 지상 관측소가 없는 바다 위에서 특정 항해 기간에 기온·파고·상층 바람이 어땠는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 지상 관측(ASOS·AWS 등) 같은 다른 기상청 자료와는 관측 시각·위치를 직접 맞춰 이어 쓴다.
limits: 포털 활용신청과 별개로 apihub.kma.go.kr 인증키(경로 파라미터 KEY)를 따로 받아야 호출된다. 행정단위로는 전국·비공간으로 분류되고 전역 조인 키가 없어, 행정구역 코드나 예보 격자로 바로 연결할 수 없다.
