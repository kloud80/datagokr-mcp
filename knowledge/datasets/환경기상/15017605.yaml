summary_user: 제주시 관내 환경오염물질 배출시설 가운데 자율점검업소로 지정된 사업장을 한 행에 한 곳씩, 지정 연도·사업장명·소재지·지정분야(대기·수질·폐기물 등)로 담은 시군구 단위 파일(CSV 약 6.7KB)이다. 주민이나 분석가가 '우리 동네의 어느 사업장이 어떤 환경 분야에서 자율점검 대상으로 지정됐나'를 확인할 때 쓴다. 실측 컬럼에 사업자등록번호나 좌표 같은 전역 조인 키가 없으므로, 다른 배출시설·인허가 사업장 원장과는 사업장명칭과 소재지 주소를 맞춰 이어 쓴다.
description_portal: '본 데이터는 제주특별자치도 제주시 관내 환경 오염물질 배출시설 중 자율점검 대상으로 지정된 사업장의 현황을 수록한 자료입니다.주요 항목해당연도: 자율점검업소로 지정된 기준 연도사업장명칭: 자율점검 대상에 해당하는 사업장의 명칭소재지: 사업장이 위치한 행정구역 또는 도로명 주소지정분야: 자율점검이 이루어지는 환경 분야(예: 대기, 수질, 폐기물 등)활용 목적이 데이터는 환경오염물질 배출사업장의 자율관리 실태를 파악하고, 제주시의 환경지도·감독 업무, 관련 정책 수립, 환경관리 수준 향상 및 지역주민의 환경 정보 접근성 확대 등에 활용됩니다. 제주시청에서 매년 관리 및 갱신하며, 환경오염을 예방하고 지속가능한 도시환경을 조성하기 위한 기초자료로 제공됩니다.'
