summary_user: 충청남도 대기오염측정망관리시스템에서 뽑은 측정소·오염물질 항목별 월평균 집계 자료로, 월평균값과 함께 1시간·일평균·8시간평균의 최고·최저값과 발생 시점, 국가기준·충남기준 초과 횟수, 월유효가동률을 담는다(CSV 파일 약 77만 바이트). 충남 주민이나 분석가가 "우리 지역 측정소의 미세먼지·오존 월평균이 국가기준이나 충남기준을 몇 번 넘었고 해마다 어떻게 변했나"를 확인할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로, 측정소코드와 항목코드는 같은 기관의 측정소 정보나 항목 코드표, 이름 매핑을 거쳐 다른 대기질 자료와 이어야 한다.
description_portal: 충청남도 대기오염측정망관리시스템에서 추출한 월평균자료로, 도내 대기질 측정소에서 수집된 관측값을 월 단위로 집계한 데이터이다. 측정월 정보를 기준으로 각 측정소별 대기오염 현황을 확인할 수 있으며, 측정소 정보와 시간단위 정보를 함께 제공하여 자료의 산출 기준과 범위를 명확히 파악할 수 있도록 구성되어 있다. 해당 자료는 미세먼지 등 주요 대기오염물질의 월별 평균 농도를 분석하고, 지역별·기간별 대기질 변화 추이를 파악하는 데 활용되며, 대기환경 관리 정책 수립과 성과 평가를 위한 기초 통계자료로 활용된다
