summary_user: 서울 중랑구에 설치된 가로 쓰레기통을 한 곳당 한 행으로 담은 건별 파일로, 도로명·지번 주소, 설치 위치와 지점, 수거하는 쓰레기 종류(일반·재활용), 통 형태(사각형·텀블러형 등), 관리기관 연락처를 담는다(포털 안내 기준 2025년 7월, 101건). 주민이나 방문자가 '중랑구 이 길 근처에 재활용을 버릴 수 있는 길거리 쓰레기통이 어디 있나'를 찾거나, 분석가가 구내 가로 쓰레기통 배치를 지도로 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 지오코딩하거나 자치구명으로 맞춰 이어야 하며, 다른 자치구의 가로 쓰레기통 파일과는 같은 항목끼리 이름을 맞춰 합쳐 쓴다.
limits: 중랑구 한 곳만 담은 파일이라 서울 전체나 다른 구의 현황은 각 구 파일을 따로 모아야 한다. 코드화된 조인 키나 좌표 없이 주소 문자열로만 위치를 알 수 있어 연계하려면 주소 매칭이나 지오코딩이 필요하다. 쓰레기 발생량이나 수거·처리 실적 같은 통계는 담지 않는다.
