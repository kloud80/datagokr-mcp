summary_user: 부산광역시 서구에 있는 음식물류폐기물 다량배출사업장을 업소 한 곳당 한 행으로 담은 CSV 목록(약 3KB)이며, 업태·업소명·소재지·전화번호를 담는다. 주민이나 사업자가 '서구에서 음식물쓰레기 다량배출사업장으로 관리되는 집단급식소·대형음식점·대규모 점포가 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소나 업소명을 맞춰 보는 방식으로만 이어 쓰며, 다른 지자체의 같은 이름 파일과 합칠 때도 같은 방식으로 맞춘다.
