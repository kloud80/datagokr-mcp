description_portal: '2020년 5월 21일 공공데이터포털을 통해 신청된 데이터 제공건(신청번호 : 60519)으로 배출권거래제 상쇄제도 사업신청과 관련하여 사업장폐기물배출자 조회를 목적으로 신청되어 처리(제공)하였습니다.  제공한 데이터는 장흥군 관내 사업장 폐기물에 대한 신고현황의 데이터로서  상호,  신고일,  처리업소명, 사업장 주소, 폐기물 종류  등의 내용을 포함한 데이터를 제공합니다. 폐기물관리법 제17조(사업자폐기물배출자의 의무), 폐기물관리법 시행규칙 제18조(사업장폐기물배출자의 신고)에 근거하며 자세한 내용은 보유근거 참고.'
