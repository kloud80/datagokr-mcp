summary_user: 장흥군 관내 사업장폐기물 배출자 신고를 사업장 한 곳씩 담은 건별 원장 파일로, 상호·신고일·처리업소명·사업장 주소·폐기물 종류가 들어 있다. 사업자나 분석가가 '장흥군의 특정 사업장이 어떤 폐기물을 배출자로 신고했고 어느 업체에 처리를 맡기는가'를 확인할 때 쓴다(포털 설명상 배출권거래제 상쇄사업 신청을 위한 배출자 조회 목적으로 제공됨). 전역 조인 키가 없어 다른 데이터와는 상호·처리업소명이나 사업장 주소를 기준으로 맞춰 이어야 하고, 처리업 허가 현황과는 처리업소명으로 대조한다.
limits: 사업자번호 같은 공통 키가 없어 다른 기관 데이터와 정확히 연결하기 어렵고, 범위가 장흥군 한 곳이라 다른 시군구와 비교하려면 별도 파일을 모아야 한다. 폐기물 발생량·처리량 같은 통계는 담지 않는다.
