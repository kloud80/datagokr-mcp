description_portal: '인천광역시 보건환경연구원에서 매년 4월부터 10월까지 수행하는 모기밀도조사 사업 결과입니다.  모기를 주1회 채집하여 종 분류 후 채집지점별 개체수 증가추이를 확인하는 데이터입니다.<활용 목적>-감염병 예방: 모기 활동 예측지수 알고리즘 등과 연계하여 모기 발생 경향을 파악하고, 말라리아 및 일본뇌염 유행 예방을 위한 근거 자료로 활용됩니다.-방제 대책: 생산된 실측값과 예측 정보는 보건소 등 방제 담당 기관에 제공되어 데이터 기반의 합리적인 모기 방제 시기 및 전략 수립에 기초 자료로 사용됩니다.-시민 건강 증진: 고밀도 발생 지역에 대한 선제적 방제를 통해 시민들의 모기 피해 및 감염병 위험을 사전에 예방하는 데 기여합니다.'
