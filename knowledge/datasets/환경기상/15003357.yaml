summary_user: 해양환경공단이 발급한 유조선 방제증서를 증서 한 건 단위로 담은 전국 범위 파일(CSV)로, 증서번호·증서유형·선명·호출부호·유조선 여부·총톤수·입항지·유효기간 시작일과 종료일이 들어 있다. 해운사나 방제 정책 분석가가 "특정 선박의 방제증서가 지금 유효한지, 어느 입항지에 증서 발급이 몰리는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선박·사고 데이터와는 선명이나 호출부호를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 해양환경공단이 제공하는 유조선 방제증서 발급 현황 데이터에 대한 정보를 제공합니다. 본 데이터는 해양환경관리법에 따라 유조선이 해양오염방제 계획을 수립하고 법적 요건을 충족했음을 증명하는 방제증서의 발급 내역을 포함하고 있습니다. 주요 항목에는 발급 일자, 선박명, IMO 번호, 총톤수, 선박 종류,  발급 유효기간 등이 있으며, 발급 건수 및 연도별 추이도 확인할 수 있습니다. 이를 통해 유조선의 해양오염방제 능력 확보 현황과 법규 준수 여부를 분석할 수 있습니다. 해당 정보는 해양안전 정책 수립, 유류오염사고 예방대책 마련, 방제자원 배치계획 수립 등 다양한 분야에서 공공기관, 지자체, 연구기관, 민간사업자가 폭넓게 활용합니다.
