summary_user: 춘천시에서 RFID 음식물쓰레기 종량제 장비를 설치해 운영하는 공동주택을 단지별로 한 행씩 담은 현황 파일로, 단지명·도로명주소·설치연도·장비 수량을 담는다. 주민이나 관리사무소, 정책 분석가가 "우리 아파트에 RFID 음식물 종량기가 있나, 춘천시에서 언제 몇 대씩 보급됐나"를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 단지명이나 도로명주소(소재지도로명주소)를 맞춰 공동주택 정보·다른 지자체의 같은 종류 파일과 이어 쓴다.
