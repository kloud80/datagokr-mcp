description_portal: '제공된 데이터는 ‘지열관 밀봉(밀폐형) 시설 현황’으로, 각 지점의 설치 위치, 관 직경과 깊이, 시공사 정보, 허가일, 복구일, 시공일 등을 기록하고 있습니다. 데이터 구조는 다음과 같이 구성됩니다:위치 정보: 위도·경도(도, 분, 초)와 주소(지번 및 도로명)시설 사양: 관 깊이(PIPE_DEP, m), 관 직경(PIPE_DIAM, mm), 관 종류(밀폐형·개방형 등)시공 정보: 시공사명, 시공사 연락처, 시공사 주소, 시공일행정 정보: 허가번호, 허가일, 복구일기타: 소유자 정보이 데이터는 지열 에너지 설비 관리, 환경 영향 평가, 유지보수 계획, 안전 점검 등에 활용될 수 있으며, 특히 위치 좌표와 관 사양을 통해 지하자원 이용 현황 분석이 가능합니다.'
