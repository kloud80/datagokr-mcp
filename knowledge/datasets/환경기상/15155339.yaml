summary_user: 경기도 대기배출시설 사업장의 생산공정을 공정·제품·원료 단위 행으로 담은 원장 성격의 데이터로, 사업장명·업종·산업단지·관할기관과 함께 제품별 월·연간 생산량, 원료별 월·연간 사용량, 공정·제품·원료의 사용 상태와 변경일을 담는다. 환경 분석가나 지자체 담당자가 '특정 산업단지나 업종의 배출 사업장이 어떤 원료를 얼마나 쓰고 무엇을 생산하는가'를 파악해 배출원 관리 대상을 추리는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나 사업자등록번호(bizregno)가 있어 기업 축으로 다른 배출시설·인허가 데이터와 맞춰 볼 여지가 있고, 그 밖에는 사업장명·업종코드 같은 이름·코드 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 내 제조업 사업장의 생산공정에 관한 정보를 담고 있으며, 사업장명, 업종코드 및 업종명, 산업단지 위치, 관할기관, 생산공정명과 상태, 제품명, 제품 생산 상태, 원료명 및 원료 사용량 등의 항목으로 구성되어 있습니다. 총 25개 컬럼을 통해 각 사업장의 세부 공정 단위에서 어떤 제품이 생산되며 어떤 원료가 사용되는지를 파악할 수 있고, 공정별 사용 여부나 삭제 여부 등의 상태정보도 확인 가능합니다. 본 데이터는 환경오염 저감, 산업별 공정 분석, 원료 소비량 통계 등의 분야에 활용될 수 있으며, 각 산업단지별 생산 구조 특성과 환경 관리 요소 파악에 유용한 자료입니다.
