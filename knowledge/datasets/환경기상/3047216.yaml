description_portal: 본 자료는 경상북도 김천시 관내에 위치한 건축물 가운데 「석면안전관리법」 등에 따라 석면조사 대상에 해당하는 건축물의 현황을 정리한 것입니다. 주요 내용은 각 건축물의 기관명, 소재지 주소, 건축물 용도 등을 중심으로 제공하며, 공공기관 청사, 교육시설, 복지시설, 다중이용시설 등 다양한 유형의 건축물이 포함되어 있습니다. 조사 대상 건축물은 연면적, 용도 등에 따라 선정되며, 관내 행정기관 청사, 학교 및 교육지원시설, 병원·요양시설, 문화체육시설, 공공건축물 등이 대표적인 사례입니다. 특히 석면조사는 건축물의 건축연도, 구조 및 사용 자재 등을 종합적으로 검토하여 실시되며, 조사 과정에서는 건축물 내외부의 석면 사용 여부와 분포 현황, 잠재적 위해성 여부 등이 면밀히 확인됩니다. 조사 결과는 해당 건축물의 안전관리와 향후 보수·철거 시 안전대책 수립에 직접적으로 활용되며, 시민의 건강과 생활환경 보호를 위한 기초 자료로 제공됩니다. 각 건축물별로 세부적인 조사 결과나 관리방안은 별도 자료에서 확인할 수 있습니다.
