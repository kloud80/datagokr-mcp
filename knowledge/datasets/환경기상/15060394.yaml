summary_user: 목포시 관할 사업장폐기물 배출자의 신고 내역을 사업장 건별로 담은 원천 목록으로, 상호·신고일·폐기물 종류·처리방법·도로명/지번 주소·업무구분을 포함한다(CSV 약 1MB). 배출 사업장 관리나 입지 분석을 하는 분석가·환경 분야 종사자가 '목포시 어느 지역에 어떤 종류의 사업장폐기물을 배출하는 사업장이 있고 어떻게 처리하는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없으므로, 다른 데이터와는 상호명이나 사업장 주소(주소 정제·지오코딩 후)로 맞춰 이어 쓴다.
description_portal: 본 데이터는 전라남도 목포시 관할 구역 내 사업장에서 발생하는 폐기물의 배출 및 신고 현황에 관한 정보를 포함하고 있습니다. 제공 항목은 배출 사업장의 상호, 폐기물 배출 신고일, 발생 폐기물의 종류, 처리방법, 사업장 소재지, 업무 구분 등으로 구성되어 있습니다. 이 자료는 사업장별 폐기물 관리 실태를 파악하고, 적정한 폐기물 처리 및 환경 관리 정책 수립에 활용될 수 있도록 작성되었습니다. 각 사업장의 배출 특성과 처리 형태를 명확히 나타내어, 행정기관의 지도·점검 자료로 사용 가능하며, 지역 내 폐기물 처리 체계의 투명성을 제고하는 데 기여합니다. 데이터는 체계적으로 정리된 표 형식으로 제공되며, 폐기물 관리에 관심 있는 시민, 연구자, 환경 분야 종사자 등이 쉽게 활용할 수 있도록 개방됩니다.
