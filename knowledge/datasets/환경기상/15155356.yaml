summary_user: 경기도 내 사업장이 폐수배출시설을 설치·운영하면서 낸 허가신청·신고를 건별로 담으며, 사업장명·업종·산업단지·신청일·처리상태와 배출시설·방지시설의 용량, 폐수배출량, 처리방법을 함께 수록한다. 분석가나 지자체 담당자가 "어느 업종·산업단지에서 폐수배출시설 신청이 많고, 주로 어떤 처리방법을 쓰는가"를 파악하는 데 쓴다. 전역 조인 키는 없어서 사업장명·사업자등록번호(bizregno)·업종코드를 이용한 이름·코드 매핑으로만 다른 사업장·업종 자료와 연결한다.
description_portal: 이 데이터는 경기도 내 사업장이 폐수배출시설을 설치하거나 운영함에 따라 제출하는 허가신청 및 신고 내역을 정리한 자료로, 사업장의 위치, 업종, 설치 예정인 배출시설의 세부 정보, 조업계획, 폐수 발생량과 처리 방법 등이 포함됩니다. 데이터에는 사업장명, 업종코드, 산업단지, 신청일, 신청구분, 처리상태 등의 행정정보뿐 아니라, 배출시설명, 일일 조업 시간, 연간 가동일, 폐수배출량, 처리용량, 처리방법(물리화학적, 생물학적 등) 등의 환경설비 관련 상세 정보가 포함됩니다. 이 데이터를 활용하면 업종별·지역별 폐수배출 특성 파악, 폐수처리 방식 분류, 시설 허가 절차 관리 및 정책 수립을 위한 기초자료 확보가 가능합니다.
