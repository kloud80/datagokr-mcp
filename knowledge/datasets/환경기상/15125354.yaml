description_portal: 에콥 음식물 처리기를 통해 자동 수집한 데이터를 기반으로, 담다 빅데이터 플랫폼에서 월별·지역별 가구 평균 음식물 쓰레기 배출량과 감량 효과를 분석한 데이터입니다.각 데이터 항목은 가구 기본정보(지역코드, 수집월 등)와 처리기별 월별 배출량(배출중량, 감량량, 감량률 등)으로 구성되어 있습니다.개인정보 보호를 위해 가구 식별이 가능한 상세주소 등은 포함되어 있지 않으며, 데이터 활용 시 "저작물 이용허락 동의서_포레" 확인 후 사용 부탁드립니다.데이터는 정책 수립, 연구·교육, 감량 캠페인 기획 등에 활용 가능하며, 상업적 목적의 무단 사용은 제한됩니다.
