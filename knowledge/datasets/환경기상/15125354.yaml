summary_user: 에콥 음식물 처리기로 자동 수집한 값을 바탕으로 기간·시도·시군구별 가구 평균 음식물쓰레기 배출량과 감량량·감량률을 담은 전국 시군구 단위 집계 파일(약 4KB의 작은 CSV)이다. 지자체 담당자나 연구자가 '우리 시군구 가구는 한 달에 음식물쓰레기를 얼마나 내고, 처리기로 얼마나 줄였나'를 확인하거나 감량 캠페인 대상 지역을 고를 때 쓴다. 전역 조인 키(행정코드)가 없어 시도·시군구 이름을 행정구역 코드표에 매핑해야 다른 통계와 이을 수 있다.
limits: 행정구역 코드 없이 이름만 있어 다른 데이터와 붙일 때 이름 매핑이 필요하다. 처리기 설치 가구 기준의 평균이므로 지역 전체 음식물쓰레기 발생량 통계로 해석하지 않는다.
