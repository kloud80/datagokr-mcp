description_portal: '이 데이터는 대기환경보전법에 따라 등록된 대기오염물질 배출시설 설치 사업장의 현황을 정리한 자료입니다. 사업장의 상호, 업종 구분, 배출시설 종류, 사업장 주소, 위도·경도 등 위치정보가 포함되어 있으며, 해당 시설이 위치한 지역 내 오염물질 배출 원천을 파악하고, 환경 모니터링 및 관리계획 수립에 활용할 수 있습니다. 업종에 따라 4종 또는 5종 시설로 구분되어 관리되며, 제조·수리·재활용 등의 다양한 산업군이 포함되어 있어 대기환경 영향분석이나 사업장 단속 등 환경행정 업무 전반에 유용한 정보를 제공합니다. 본 데이터는 총 8개 항목으로 구성되어 있으며, 기준일은 2025년 8월 18일입니다.연번: 데이터에 기록된 일련번호입니다.상호명: 등록된 사업장의 명칭 또는 업체명입니다.구분: 대기배출시설의 관리 등급(예: 4종, 5종 등)입니다.배출시설: 주된 업종 또는 대기오염물질을 배출하는 주요 시설입니다.소재지: 사업장이 위치한 도로명 주소 또는 지번 주소입니다.위도: 사업장의 위도 좌표입니다.경도: 사업장의 경도 좌표입니다.데이터기준일: 본 데이터가 수집된 기준일자입니다.'
