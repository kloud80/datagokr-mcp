summary_user: 환경책임보험에서 관리하는 환경오염사고를 사고 한 건당 한 행으로 담은 건별 원천 파일로, 사고일시·장소·원인·시설현황·인명/재산피해·사후 조치와 수습현황·보존이 필요한 중요사항을 기록하며 범위는 전국입니다. 분석가나 사업자가 '환경오염사고는 주로 어떤 원인으로 일어났고 피해와 수습은 어땠는가'를 사례별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사고장소 이름을 매핑하거나 같은 기관 자료와 맞춰 보는 방식으로만 잇는다.
description_portal: 환경책임보험에서 관리하는 환경오염사고정보는 사고별로 고유한 일련번호를 부여하여 기록한다. 각 사고는 발생한 날짜와 시간을 명확히 기재하며, 사고가 일어난 장소를 구체적으로 기록한다. 사고의 원인은 시설 결함, 관리 소홀, 자연재해 등 다양한 요인으로 구분하여 명시하며, 사고 당시 시설의 현황도 함께 작성한다. 또한 사고로 인해 발생한 인명피해와 재산피해의 규모를 상세히 기록하여 피해 정도를 파악한다.사고 발생 이후 취해진 긴급조치와 수습현황 역시 빠짐없이 기재하여 복구 과정과 대응 상황을 추적할 수 있도록 한다. 마지막으로, 해당 사고와 관련하여 행정적·법적 판단이나 추후 관리에 필요한 중요사항은 별도로 기록하고 장기간 보존한다. 이는 향후 분쟁 발생 시 증거 자료로 활용되며, 재발 방지를 위한 대책 수립에도 중요한 기초 자료로 활용된다.
