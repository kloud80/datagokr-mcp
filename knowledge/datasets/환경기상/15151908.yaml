description_portal: ASF(아프리카돼지열병)은 2019년경 대한민국에서 창궐한 전염병이며, 경기도를 비롯한 북부지방에서 창궐 후 남쪽으로 확산되는 양상을 띄었습니다.따라서 방역과 확산방지를 위해서 야생멧돼지 시료, 폐사체, 양성개체 등 각종 정보에 대한 지리적 정보가 필요했으며, 가장 기본적인 시도, 시군구, 이하 읍면동 정보를 포함한 "ASF 구역 정보"가 있습니다.ASF 검사건의 순번에 따라 각 지역정보가 시도, 시군구, 읍면동, 리까지 상세한 위치 정보가 작성되었으며, 작성자와 작성일까지 기록·관리되었습니다.다만 시군구 미만 지역정보는 경우에 따라 공란처리되어 공란인 데이터도 다수 존재합니다.
