summary_user: ASF(아프리카돼지열병) 검사 건별 순번(순번(ASF))에 맞춰 해당 야생멧돼지 시료·폐사체·양성개체가 나온 지역을 시도·시군구·읍면동·리까지 적고 작성자와 작성일을 함께 기록한 전국 범위의 건별 위치 대장이다. 방역 담당자나 분석가가 'ASF 검사 건이 어느 시군구·읍면동에 몰려 있고 남쪽으로 어떻게 번졌는가'를 행정구역별로 집계해 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구·읍면동 이름을 맞춰 붙이거나 같은 기관의 ASF 검사 순번으로만 이어 쓴다.
limits: 행정구역 코드나 좌표가 없어 지도·다른 통계와 붙이려면 지명 문자열을 직접 매핑해야 한다. 포털 설명에 따르면 시군구 미만(읍면동·리) 칸은 공란인 행이 많아 세부 지역 분석에는 빈 값 처리가 필요하다.
