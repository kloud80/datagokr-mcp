summary_user: 완주군에 신고된 사업장 폐기물 배출자 신고를 건별로 담은 파일(CSV, 약 42KB)로, 상호·신고일·공사명·폐기물 종류·배출량(톤)·운반자·처리업소·처리방법·현장 도로명주소를 기록한다. 완주군 안의 공사·사업장이 어떤 폐기물을 얼마나 배출해 어느 운반자와 처리업소에 맡겼는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·처리업소명 같은 이름이나 현장도로명주소를 맞춰 붙여야 하며, 폐기물 처리업 허가 현황 같은 같은 기관 자료와 이름으로 대조하는 방식으로 이어 쓴다.
