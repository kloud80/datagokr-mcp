summary_user: 시도별로 지하수 한 공(관정)당 평균 이용량을 연도별로 담은 집계 통계로, 지하수 이용량을 지하수 공수로 나눈 값이며 전국 범위의 작은 CSV 파일(643바이트)로 제공된다. 지역별 관정 하나가 평균 얼마나 지하수를 쓰는지 비교해 지하수 개발·관리 정책이나 연구의 기초자료를 찾는 분석가·공공기관이 쓴다. 공통 조인 키가 없어 행정구역 이름과 연도를 맞춰 지하수 이용량·공수 등 같은 기관의 다른 지하수 통계와 이어 쓴다.
description_portal: 시도별 지하수 한 공당 사용하는 평균 지하수량에 대한 통계 데이터로, 지하수 조사연보 통계작성을 통해 생산된 데이터입니다. 지하수 이용량을 지하수 공수로 나누어 구한 값입니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며, 민간 및 공공기관의 연구와 정책 수립에 활용할 수 있는 기초자료입니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
