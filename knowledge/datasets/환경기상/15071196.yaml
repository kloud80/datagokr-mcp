summary_user: 수질오염사고(실제·가상) 한 건마다 사고명·발생일시·수계, 사고지점 좌표와 격자 위치, 유출량과 오염물질, 최적 시나리오 구분을 담은 사고별 모의조건 파일이다(CSV 약 19KB, 전국 범위). 수질오염사고 대응 예측모델링에서 특정 수계에 어떤 물질이 얼마나 유출됐다고 가정했는지 확인하려는 분석가나 방제 담당자가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 수계명·오염물질명 같은 이름으로 맞추거나 같은 기관 자료와의 코드 대응으로만 하천 수질측정·댐 방류 자료와 이어 쓴다.
description_portal: 수질오염사고대응 예측모델링의 기초자료에 해당하는 댐방류량,다기능보 방류량 및 수위,지류유입 유량 데이터를 수집하여 입력자료를 구축한다.방제활동 지원을 위한 하천구조물 연계운영 조건을 파악하여 다양한 시나리오를 구성한다.4대강의 댐방류량 및 다기능보의 실시간 운영현황을 토대로 적절히 모의조건을 변형시켜 모델에 반영한다.오염물질의 유하시간 및 확산농도에 해당하는 모델링 결과는 하천의 수위와 유속에 따라 다양한 형태로 나타난다.이러한 시나리오 모델링 결과로부터 최적의 방제방안 마련하고 유관기관에 전파하여 방제활동을 지원하게 된다.
