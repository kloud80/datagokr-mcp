summary_user: 경상남도 안 동물원을 한 곳당 한 행으로 담은 소규모 현황 파일(약 570바이트 CSV)로, 관할 지자체·동물원명·소재지·등록일·보유 동물 요약·운영 상태·총면적·사육사와 수의사 수를 담는다. 도민이나 연구자가 '경남에 허가된 동물원은 어디에 있고 사육사·수의사를 몇 명 두고 있나'를 확인하거나, 동물원별 면적 대비 인력 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 관할 지자체 이름이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: '경상남도 동물원 현황 정보입니다.(동물원명, 동물원 소재지, 등록일, 보유 동물, 총면적, 사육사·수의사 수 등) ※ 동물원: 「동물원 및 수족관의 관리에 관한 법률」제2조에 따른 야생동물 등을 보전ㆍ증식하고 그 생태ㆍ습성을 조사ㆍ연구함으로써 생물다양성을 보전하며, 국민에게 전시ㆍ교육을 통해 야생동물에 대한 다양한 정보를 제공하는 시설로서,  「동물원 및 수족관의 관리에 관한 법률」제8조에 따라 보유동물 종별 서식환경 기준 및 동물원 또는 수족관의 규모별 전문인력 기준, 보유동물 질병관리계획, 동물원 또는 수족관 안전관리계획 등 요건을 갖추어 허가 받아야함.'
