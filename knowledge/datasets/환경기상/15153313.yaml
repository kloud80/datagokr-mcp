summary_user: 환경부가 제공하는 전국 시군구별 시간대별 대기 평균농도를 담는다. 측정일시와 시도·시군구 이름에 따라 아황산가스·일산화탄소·오존·이산화질소·미세먼지·초미세먼지 평균농도를 기록한 시군구 단위 집계로 보인다. 분석가나 주민이 '우리 시군구의 오늘 시간대별 오존·미세먼지 평균농도가 얼마인가'를 확인하거나 지역 간 대기질을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 시도명·시군구명(SGG_NM) 같은 이름 매핑으로만 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 시군구별 시간대별 일산화탄소, 오존 등 대기 평균농도 정보입니다.
