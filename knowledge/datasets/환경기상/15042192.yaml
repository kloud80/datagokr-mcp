description_portal: 이 데이터는 특정 지점(위도 37.3, 경도 126.8)에서 이동식 측정 장비를 통해 수집된 대기 환경 모니터링 자료입니다.  측정 일시별로 "온도", "습도"와 같은 기상 정보와 함께, "암모니아", "황화수소", "총휘발성유기화합물(TVOC)" 등 주요 대기 오염 물질의 농도를 상세히 기록하고 있습니다. 또한, 오염 물질의 확산 경로 파악에 필수적인 "풍향"과 "풍속" 정보도 포함되어 있습니다. 이 자료는 산업단지 주변이나 민원 발생 지역 등 국지적인 대기질 현황을 정밀하게 파악하고, 악취 발생 원인을 추적하거나 대기 오염 저감 대책을 수립하는 데 중요한 기초 데이터로 활용될 수 있습니다.
