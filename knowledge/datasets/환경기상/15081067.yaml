description_portal: 강원특별자치도 홍천군의 2021년 5월 4일 기준으로 작성된 사업장폐기물 및 지정폐기물 신고 현황 정보입니다. 데이터는 신고기준연도, 상호, 폐기물 종류(사업장폐기물) 항목으로 구성되며, 신고연도는 1994년부터 2021년까지 포함됩니다. 폐기물 종류에는 유기성오니, 폐수처리오니, 식물성잔재물, 임목폐목재, 폐합성수지류 등 다양한 유형이 있으며, 상호는 식품제조업, 건설업, 환경업체 등에서 발생한 사업장명으로 표기되어 있습니다. 폐기물 종류는 수집·운반 및 처리 방식에 따라 분류되어 있으며, 다수의 항목에서 유사 폐기물명이 반복적으로 등장합니다.
