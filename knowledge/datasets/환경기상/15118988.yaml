description_portal: 이 데이터는 2016년부터 2020년까지 전국에서 발생한 수산물가공잔재물과 폐패각에 대한 재활용 실적보고 정보를 담고 있으며, 시도별, 사업장별로 분류되어 있습니다. 보고된 폐기물은 모두 일반폐기물에 해당하며, 종류로는 주로 수산물 가공 과정에서 발생하는 고상 또는 액상 폐기물, 그리고 패류의 껍데기(폐패각) 등이 포함됩니다.각 데이터 항목에는 해당 폐기물이 발생한 사업장의 사업자등록번호와 명칭, 주소를 비롯하여, 폐기물의 형태(고상, 액상, 기타)와 코드, 재활용 방법, 발생량, 위탁량, 직접처리량, 최종 재활용량 등의 정보가 포함되어 있습니다. 재활용 유형은 ‘원료 제조’, ‘직접 제품제조’, ‘농업활용’, ‘중간가공폐기물 제조’ 등으로 분류되어 있어 폐기물의 최종 처리 방식과 자원화 과정을 파악할 수 있도록 구성되어 있습니다.
