description_portal: 지구온난화에 따라 온열질환자(부상 및 사망 등)가 증가하고 있어 최근 심화되는 도시열섬 현상을 이해하고 관측 결과에 따른 다양한 기후취약 계층(노인, 어린이, 작업자 등)별 활용 방안을 마련하기 위해 부산광역시역 내 기초지자체(중구, 서구, 동구, 영도구, 부산진구, 동래구, 남구, 북구, 해운대구, 사하구, 금정구, 연제구, 강서구, 수영구, 사상구 및 기장군 등 16개 구군)의 시민들이 주로 활동하는 도로변, 교차로, 정류장 및 건물 부근과 비교군으로 도심 하천변 및 건물의 영향이 적은 도시 외곽 등에 기상관측장비를 설치하여 온도, 습도, 풍향, 풍속 및 기압 등 5개 항목에 대하여 매시간 관측과 인간-환경 열교환 모델을 활용하여 야외활동권고시간, 불쾌지수, 체감온도 등 월별 자치구군별 데이터값
