summary_user: 전국 자치단체가 관리하는 지하수 시공업체의 인허가 정보를 업체 1곳 단위로 담은 원천 데이터이며, 전체 6,559건에 사업장명·인허가일자·영업상태·주소·좌표·자본금·전문인력 수를 싣는다. 지하수 관정을 시공할 업체를 찾는 사업자나 지역별 시공업체 현황과 영업상태를 확인하려는 분석가가 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)가 조인 키라 주소 기반의 다른 데이터와 이어 쓰고, 필수 조건인 기준일자와 개방자치단체코드는 다른 데이터에서 받은 코드를 넘겨야 한다.
description_portal: '자원환경_지하수시공업체 데이터는 지하수개발·이용을 위한 시설을 시공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 지하수시공업체 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 토양지하수과 / 044-201-7187 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
