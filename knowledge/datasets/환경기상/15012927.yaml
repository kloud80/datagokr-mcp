summary_user: 국내에 유입되었거나 정착한 외래생물을 종 단위로 정리한 목록이며, 분류군·일반명·학명·위해도 등급(I~Ⅲ)·IUCN 및 미국·EU·일본 등 타국가 지정 여부·등급 책정 사유·출처를 담는다(전국·비공간, CSV 약 289KB). 환경영향평가 담당자나 연구자가 조사지에서 확인된 종이 외래종인지, 위해도가 몇 등급이고 그 근거가 무엇인지 확인하는 데 쓴다. 전역 조인 키나 종 코드는 없어서, 다른 생물종·조사 데이터와는 학명 또는 일반명을 맞춰 연결해야 한다.
description_portal: 이 데이터는 한국에 유입되었거나 정착한 외래생물에 대한 목록과 생태적 특성 정보를 포함합니다. 분류군별로 외래생물의 일반명과 학명, 위해도 등급(I~Ⅲ등급), IUCN(세계자연보전연맹) 지정 여부 및 미국, EU, 일본 등 타국가의 위해생물 지정 여부를 수록하였으며, 각 생물종의 위해성 판단 기준과 등급 책정의 근거 및 출처도 명시되어 있습니다. 해당 정보는 외래생물의 생태계 교란 가능성과 인간 활동에 대한 영향을 파악하고, 국가 생물다양성 전략 및 위해생물 관리 정책 수립에 활용될 수 있도록 구성되어 있습니다. 또한 환경영향평가, 생물다양성 교육자료, 연구 기반 자료 등 다양한 분야에서 응용이 가능하며, 환경부의 ‘생물다양성 보전 및 이용에 관한 법률’에 따라 국립생태원이 지속적으로 갱신·관리하고 있습니다. 국내외 환경정책 대응을 위한 기초 생물종 정보로써, 생태계 서비스 유지 및 보전 전략 수립에도 중요한 자료입니다.
