legal_basis_portal: 「폐기물관리법」은 생활폐기물을 포함한 폐기물의 발생을 최대한 억제하고, 발생한 폐기물을 친환경적으로 처리하여 환경보전과 국민생활의 질적 향상에 이바지하는 것을 목적으로 하고 있습니다. 같은 법은 생활폐기물을 사업장폐기물 외의 폐기물로 정의하고 있으며, 지방자치단체가 관할 구역에서 발생하는 생활폐기물을 적정하게 처리하도록 규정하고 있습니다. 또한 생활폐기물은 원칙적으로 해당 폐기물이 발생한 지역에서 처리하도록 하고, 수집·운반·보관 및 처리 과정에서도 법령상 기준과 방법을 준수해야 합니다. 청주권광역소각시설 생활폐기물 반입현황 자료는 이러한 법령상 생활폐기물 처리 의무와 처리시설 운영 관리 필요에 따라, 생활폐기물의 반입 상황을 체계적으로 확인·관리하기 위하여 보유하는 자료입니다.
