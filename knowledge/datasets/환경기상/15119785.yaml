summary_user: 한국동서발전 사업소(발전소)별 폐기물 인계 기록을 건별로 담으며, 사업소명, 폐기물명, 운송업체명, 처리업체명, 카드번호, 진행단계, 계량일자로 구성된 전국 범위의 비공간 데이터입니다. 발전소에서 나온 폐기물을 어느 운송·처리업체가 언제 인계받았는지 확인하려는 분석가나 폐기물 처리 사업자가 쓴다. 전역 조인 키가 없으므로, 운송·처리업체명을 폐기물 처리업 허가 원장과 이름으로 맞춰 이어 쓴다.
limits: 실측 컬럼에 사업자번호 같은 공통 키가 없어, 다른 데이터와는 업체명·사업소명 매핑으로만 연결된다. 포털 설명은 발전량 데이터로 적혀 있으나 실제 필드는 폐기물 인계 내역이므로 필드 기준으로 해석해야 한다. 개발계정 호출 한도는 하루 10,000회다.
