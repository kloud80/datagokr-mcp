summary_user: 전국 지상기상관측 지점(종관기상관측 ASOS, 방재기상관측 AWS, 북한기상관측, 자외선관측)의 지점번호, 관측 시작·종료일, 위·경도 같은 지점 이력과 주변 환경 정보를 지점 단위로 담은 메타데이터이며, 위치는 행정구역이 아닌 개별 좌표로 표시된다. 기후·농업·보험 분석가가 "내 분석 대상지에서 가장 가까운 관측소는 어디이고 언제부터 관측했는가"를 확인해 시간·일 관측자료를 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 따라서 같은 기상청 관측자료와는 관측지점번호로 맞추고, 다른 기관 데이터와는 좌표나 지점명으로 연결한다.
description_portal: 지상기상관측 지점에 대한 지점번호, 관측 시작일과 종료일, 위 · 경도 등 이력정보와 주변 환경 등에 대한 정보를 조회할수 있습니다.지상관측에는 종관기상관측지점(ASOS), 방재기상관측지점(AWS), 북한기상관측지점, 자외선관측지점을 제공하고 있습니다.종관기상관측(ASOS)는 정확하고 표준화된 기상자료를 생산하는 관측망이고, 방재기상관측(AWS)는 재난 감시를 위해 빠르고 촘촘하게 기상을 관측하는 관측망입니다. 목적 자체가 다르기 때문에 운영 방식, 장비의 정밀도, 설치 위치가 다릅니다.
