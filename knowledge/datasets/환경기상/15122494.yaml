description_portal: 1. 데이터 개요 및 설명본 데이터는 2020년 전북특별자치도 남원시에서 발생한 산사태 발생일과 위치를 정리한 자료입니다. 집중호우와 같은 극단적 기상 현상으로 인해 발생하는 산사태의 정확한 위치와 시기를 기록함으로써, 지역 주민의 안전을 보장하고 재난에 효과적으로 대응하기 위한 기초 자료로 활용됩니다. 산림청과 협력하여 구축된 이 데이터는 산사태 위험 지역 관리, 대피소 배치 계획 수립, 인명 피해 예방을 위한 선제적 대응 체계 구축에 핵심적인 역할을 합니다. 자세한 정보는 산림청에 문의 바랍니다.2. 데이터 항목명- 시군- 발생시기- 산사태 발생위치3. 활용 효과본 데이터를 통해 산사태에 취약한 지역의 패턴을 심층 분석하여 선제적인 방재 대책을 수립할 수 있으며, 지역 주민을 대상으로 한 재난 예방 교육과 효율적인 대피 체계 구축에 크게 기여할 것입니다.
