summary_user: 대구광역시 북구에서 허가받은 건설폐기물처리업체(수집운반업 등)를 업소별로 한 건씩 담은 원장으로, 업소명·사업장 주소·신고일·상태·기준일자를 제공한다. 공사 중 5톤 이상 건설폐기물이 생길 때 북구 안에서 맡길 수 있는 허가 업체를 찾는 시공사나 주민, 그리고 지역 폐기물 처리업체 분포를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 사업장 주소를 매칭하거나 같은 기관의 다른 데이터와 묶는 방식으로만 연결한다.
description_portal: 입력 파라미터를 이용하여 대구광역시 북구에 허가받은 건설폐기물처리업(수집운반업,중간처리업)현황 데이터(연번, 유형, 명칭, 소재지, 면적, 허가 기간, 공시지가, 비용 )를 조회하는 서비스로 건설폐기물은 건설공사나 토목공사,건축물 철거공사중 5톤이상의 폐기물이 발생할 경우 건설폐기물처리업자를 통하여 폐기물을 처리하여야함.현재 북구에는  중간처리업은 없고 수집운반업만 허가 되있음. 공사중 5톤이상 폐기물 발생시 반드시 건설폐기물처리업허가를 받은 업체를 통하여 처리하여야함
