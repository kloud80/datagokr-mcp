summary_user: 대전도시공사가 운영하는 소각장(환경에너지사업소, 160톤 소각로 2기·하루 320톤 규모)의 생활쓰레기 반입량과 1·2호기별 소각량, 총소각량을 근무일자별로 담은 일별 집계 파일이다. 대전 지역 생활쓰레기가 하루에 얼마나 들어오고 소각로별로 얼마나 처리되는지, 반입량과 소각량의 차이나 시설 가동 부담을 살피려는 분석가나 주민이 쓴다. 전역 조인 키는 없고, 날짜(근무일자)를 기준으로 다른 일별 자료와 맞춰 보거나 같은 기관의 다른 자료와 함께 보는 정도로만 이어 쓴다.
description_portal: 대전도시공사에서 운영하는 소각장(환경에너지사업소)의 일자별 생활쓰레기 반입 및 소각 현황 데이터 입니다.소각장 소개는 홈페이지(https://www.dcco.kr/web/subcont/emsnGas/main.do?mId=288)를 참고하시기 바랍니다.소각장의 위치는 주소(대전광역시 대덕구 대덕대로 1284길 191)와 지도(https://naver.me/xS19JoVe)를 참고하시기 바랍니다.시설용량은 160톤을 처리할 수 있는 소각로 2기로 총 320톤/일 규모로 가동하고 있습니다.
