summary_user: 환경부가 지정한 전국 생태관광지역을 지역별로 한 행씩 담은 소규모 목록 파일(약 1.5KB)로, 지역명·지정연도와 습지보호지역·생태경관보전지역·기타 면적 및 면적 합계를 담는다. 생태관광지 방문을 계획하는 국민이나 지역 관광·보전 정책을 보는 분석가가 '어느 지역이 언제 생태관광지역으로 지정됐고 보호구역 면적은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 생태관광지역명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 환경부에서 지정된 생태관광지역 정보입니다.생태관광이란? 우수한 자연을 체험하는 과정에서 환경의 소중함을 느끼고 지역경제에도 활력을 주는 여행, 개발되지 않은 상태의 아름다운 자연경관을 즐기는 ‘자연관광’이나 일부 자본가에게만 이익이 돌아가지 않고 지역사회가 관광으로부터 정당한 이익을 얻도록 하는 ‘공정여행’에서 한 걸음 더 나아가, 지역의 자연과 문화를 보전하는데 기여하고, 지역주민의 삶의 질을 향상시키며, 생태교육과 해설을 통해 참여가자 환경의 소중함을 느끼는 여행을 의미합니다.생태관광지역 지정제란? 환경적으로 가치가 있고 생태계보전의 중요성을 체험할 수 있는 지역을 생태관광지역으로 지정하여 생태관광 활성화를 위한 지역주민 협의체 육성, 주민해설사 양성, 프로그램 개발·운영, 홍보 등을 지원하는 제도입니다.
