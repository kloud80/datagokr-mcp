description_portal: '지역별 연락처는 폐기물 현장정보 관리시스템의 지역별 담당자 연락처 정보를 제공합니다. 해당 데이터는 폐기물 현장정보 전송제도 및 폐기물처리 현장정보 관리시스템 관련 업무를 담당하는 한국환경공단 지역본부 담당자 연락처 정보를 포함하며, 사용자가 폐기물 처리와 관련된 민원 발생 시 관할 지역본부 연락처를 조회할 수 있도록 지원합니다.(소속, 연락처1, 연락처2, 관할지역)* 컬럼별 상세정보○ 소속: 지역본부(지사) 구분○ 연락처1: 담당자 연락처 (1)○ 연락처2: 담당자 연락처 (2)○ 관할지역: 해당 지역본부(지사) 관할 지역* 자세한 내용은 폐기물처리 현장정보 관리시스템 지역별 연락처를 확인해 주시기 바랍니다.https://www.allbaro.or.kr/siren/cc/li/idxInfContract.do'
