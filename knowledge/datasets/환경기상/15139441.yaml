description_portal: '등표기상관측장비는 등표나 관측탑 등의 해양 구조물에 기상관측장비를 설치하고 수중에는 해상상태를 측정할 수 있는 파고계 등을 설치하여 관측기기에서 측정한 값을 일정한 물리량으로 변환 · 처리한 후에 사용 가능한 통신장비를 이용하여 자료를 전송하는 장비입니다.관측요소는 풍향·풍속, 기압, 기온, 습도 등이며,  등표기상관측장비로 관측된 자료를 실시간으로 송신하기 위해 전용회선 또는 설치환경을 고려하여 무선이동통신, 위성통신을 이용하여 관측자료를 수신합니다.생산주기: 시간, 일보유기간: 2001년 12월~현재(지점별 상이함)'
