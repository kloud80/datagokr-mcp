summary_user: 해양 구조물(등표·관측탑)에 설치한 등표기상관측장비가 잰 풍향·풍속, 기압, 기온, 습도 등을 관측지점별 시간·일 단위 자료로 담는 건별 관측 원천 데이터이며, 범위는 전국 해역 지점입니다. 해상 기상 조건을 분석하는 연구자나 해양·보험 분석가가 특정 등표 지점의 과거 풍속·기압 변화를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 관측 자료(해양기상 부이·ASOS 등)와는 지점 이름이나 기상청 관측지점번호 매핑으로만 이어 쓴다.
