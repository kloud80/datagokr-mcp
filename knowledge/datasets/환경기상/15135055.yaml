summary_user: 수도권매립지 내 매립장별로 장비(장비관리번호)가 측정한 침출수 수위를 측정일자 단위로 담은 건별 측정 파일이며, 파일 크기는 약 1.4KB(1363 bytes)로 작다. 매립장 침출수 관리 상태를 살피려는 환경 분석가나 주민이 '특정 매립장의 침출수 수위가 측정일마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 매립장코드나 장비관리번호를 같은 기관(수도권매립지관리공사)의 다른 폐기물 3.0 데이터와 이름·코드로 맞춰 이어 쓴다.
description_portal: 수도권매립지관리공사는 매립 후 5시간 이내 복토 작업을 통해 폐기물의 흩날림, 해충서식, 냄새발생, 빗물침투 등을 방지합니다.폐기물 분해과정에서 발생하는 매립가스를 포집하여 전력생산 및 악취방지의 효과를 달성하고 있으며,매립시설 바닥에 차수시설을 설치하여 지하수 오염을 차단하고, 침출수를 모아 처리하고 있습니다.매립장 침출수는 폐기물 매립장에서 발생하는 오염된 물로, 수도권매립지 내 매립장의 침출수 측정 정보를 제공하고 있습니다.제공항목은 매립장코드, 장비관리번호, 측정일자, 침출수수위 정보 등을 제공합니다.
