description_portal: 서울특별시 마포구 관내에서 발생한 행정동별 쓰레기 배출량 상세 집계내역에 대한 정보입니다. 이 데이터에는 2021년 1월부터 2021년 12월까지의 시군구에 대한 정보와 각 행정동(공덕동, 도화동, 서교동, 상암동,서강동, 성산2동, 합정동, 대흥동, 신수동, 동교동, 연남동, 망원1동, 망원2동, 성산1동, 염리동, 아현동, 용강동) 단위로 배출된 쓰레기의 종류별(생활,사업장생활계, 음식물, 재활용품)  배출량이 톤 단위로 포함되어 있습니다. 이 데이터를 통해 주민과 지자체는 지역별 배출 특성과 문제점을 정확히 파악하고, 쓰레기 감량 및 자원화 정책 수립에 활용할 수 있습니다.
