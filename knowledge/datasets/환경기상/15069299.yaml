description_portal: 해양환경공단이 제공하는 ‘해양쓰레기 모니터링 통계_1기조사방법_유형별’ 데이터에 대한 정보를 제공합니다. 본 데이터는 1기 조사방법론을 적용하여 실시한 해양쓰레기 모니터링 결과 중 유형별 통계 자료를 포함합니다. 주요 내용에는 조사 정점 위치, 조사 시기, 부유·침적·유입 쓰레기 등 유형별 분류, 발생량, 재질별 특성, 계절별·지역별 분포 경향이 수록됩니다. 또한 발생 원인 분석, 오염원별 기여도 평가, 관리·감축 방안 마련을 위한 기초자료를 제공합니다. 이를 통해 해양쓰레기의 발생 특성과 유입 경로를 파악하고, 정책적 대응 전략 수립에 활용할 수 있습니다. 해당 자료는 공공기관, 연구기관, 지자체, 환경단체 등에서 해양보전 정책, 자원관리 계획, 환경교육, 연구 분석 등 다양한 목적으로 폭넓게 이용됩니다.
