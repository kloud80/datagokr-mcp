description_portal: 본 데이터는 전북특별자치도 익산시 관내 사업장에서 배출되는 사업장폐기물의 현황을 체계적으로 기록한 자료로, 해당 데이터는 상호명, 사업장 주소, 폐기물의 종류, 배출량, 처리구분, 처리방법 등의 정보를 제공한다. 사업장별로 발생하는 폐기물의 종류와 배출량을 구체적으로 수집하여 폐기물 배출 실태 파악 및 효율적 처리 방안을 마련하기 위한 기초자료로 사용될 수 있다. 또한, 환경영향 분석과 자원순환 정책 수립에도 활용될 수 있으며 폐기물통계 배출현황 자료를 정기적으로 갱신하여 최신의 정보를 제공하고 있다.
