description_portal: 이 데이터는 침대프레임 및 매트리스 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지 파일과 동일 수량의 라벨링 텍스트 파일이 포함되어 있으며, 각 파일은 ‘images’ 및 ‘labels’ 폴더에 저장되어 있습니다. 이미지에는 다양한 형태와 재질의 침대프레임과 매트리스가 실내 환경에서 여러 각도와 거리에서 촬영된 상태로 포함되어 있습니다. 라벨링 파일은 YOLO 형식으로 작성되어 있으며, 각 이미지 내 객체의 위치 정보와 클래스명이 좌표값으로 표시되어 있습니다. 데이터는 객체 탐지 및 분류 모델 개발에 활용할 수 있도록 일관된 파일 구조와 명명 규칙을 따르고 있습니다.
