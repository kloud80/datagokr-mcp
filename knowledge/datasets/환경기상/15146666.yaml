summary_user: 환경책임보험에 접수된 환경사고를 사고 한 건 단위로 담은 파일로, 사고 발생·종결 일자, 사고지역 우편번호, 진행 상황, 인적·물적 피해 여부, 대기·수질·폐기물·토양·화학·해양별 대상시설과 원인을 기록하며 전국 범위의 소규모 CSV(약 6.7KB)다. 환경안전 분석가나 보험 실무자가 '어떤 시설 유형에서 어떤 원인의 환경사고가 많고, 인적 피해로 이어진 비율은 얼마인가'를 살피는 데 쓴다. 보험사코드(eil_insurer_cd)를 키로 환경책임보험의 보험사·계약 관련 다른 데이터와 잇고, 사고지역 우편번호로 지역 단위 집계를 붙일 수 있다.
description_portal: 환경책임보험의 책임보험 사고입력 정보는 환경사고 발생과 진행 상황을 체계적으로 기록하고 관리하기 위해 구성됩니다. 각 사고는 보험사코드를 통해 해당 보험사와 연결되며, 사고발생일자와 사고종결일자를 통해 사고의 발생 시점과 종료 시점을 명확히 관리합니다. 사고가 발생한 지역은 사고지역우편번호로 기록되어 지리적 위치를 파악할 수 있습니다.사고 진행 상황은 사고진행상황 항목으로 구분되며, 사고로 인한 인적 피해 여부(인적사고여부)와 물적 피해 여부(물적사고여부)도 함께 기록됩니다. 사고가 영향을 미친 시설은 대기, 수질, 폐기물, 토양, 화학, 해양 등 시설별로 구분하여 기록되며, 각각 사고대상시설 항목으로 관리됩니다.사고 발생 원인은 시설별로 구체적으로 기록되며, 대기, 수질, 폐기물, 토양, 화학, 해양 등 사고원인 항목을 통해 사고의 원인 요인을 파악합니다. 이러한 정보를 바탕으로 환경책임보험은 사고 위험 평가, 보상 범위 결정, 재발 방지 대책 수립 등 보험 운영과 환경 안전 관리에 필요한 핵심 자료로 활용됩니다.
