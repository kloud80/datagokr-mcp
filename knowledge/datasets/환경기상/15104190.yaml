description_portal: 본 데이터는 한전KPS에서 구매한 제품 중 녹색제품에 대한 실적을 정리한 자료로 연도별 녹색구매 성과를 종합적으로 파악하고 분석할 수 있도록 구성된 자료입니다. 해당 데이터는 구매 제품의 분류명, 총 구매금액(원), 녹색제품 구매금액(원), 녹색제품 조달구매금액(원), 녹색제품 구매 비율(%) 등의 항목으로 구성되어 있습니다.녹색제품의 소비 활성화와 친환경 정책 평가를 위한 기초 자료로 활용될 수 있습니다. 특히, 정부에서는 탄소중립 로드맵 수립, 녹색조달 목표 관리에 활용할 수 있고, 학계에서는 녹색경제ㆍ친환경 소비 연구 자료로 활용될 수 있습니다.
