description_portal: 이 데이터는 서울특별시 광진구에서 환경 관련 지도·점검을 실시한 내역을 정리한 공공데이터입니다. 2010년부터 2017년까지의 자료를 포함하고 있으며, 환경관리 대상 업체 및 시설에 대한 지도·점검 결과가 반영되어 있습니다. 주요 제공 항목은 업체명(또는 시설명), 인허가번호, 업종명으로 점검 대상의 기본 정보를 확인할 수 있고, 지도점검일자, 점검기관명, 지도점검구분을 통해 점검이 실시된 시기와 형태(정기, 수시 등), 주관 기관 정보를 파악할 수 있습니다. 또한 처분대상여부 항목은 위반사항 발생 여부와 행정처분 필요성을 나타냅니다. 데이터는 행정업무나 환경 모니터링, 위반업체 추적 및 분석 등에 활용할 수 있으며, 메타데이터 개편으로 인해 최신 수정일자와 실제 조사 시점 간 차이가 존재할 수 있습니다. 환경행정의 투명성과 점검 이력의 공개성을 높이는 데 기여합니다.
