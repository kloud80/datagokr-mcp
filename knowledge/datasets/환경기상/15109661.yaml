description_portal: 세종특별자치시 자동크리넷 정보를 제공합니다.자동크리넷은 세종시에 현재 8개소가 운영되고 있으며 폐기물을 자동집하합니다.데이터는 명칭, 설치위치주소, 설치일자, 계획인구(천명), 투입구, 설계 용량(톤), 일일 평균 반출량, 처리구역으로 구성되어 있습니다.집하장 처리구역은 1집하장은 고운동, 2집하장은 아름동+종촌동_도담동, 3집하장은 어진동+다정동, 5집하장은 한솔동+새롬동+나성동, 6집하장은 대평동+보람동, 7집하장은 소담동+반곡동, 8집하장은 집현동, 12집하장은 해밀동+집현동 쓰레기 처리를 맡고 있습니다.이자료는 세종특별자치시 자원순환과에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.
