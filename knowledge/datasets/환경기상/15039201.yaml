summary_user: 서귀포시 관내 석면 해체·제거 업체를 업체 1곳당 한 행으로 정리한 목록 파일로, 사업자명·소재지·전화·팩스·위도·경도와 데이터기준일자를 담는다(csv 약 1.8KB 규모의 소량 원장). 석면이 든 건물을 철거·수리하려는 주민이나 건축주가 "서귀포에서 가까운 석면 해체·제거 업체가 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키(사업자등록번호 등)가 없어 다른 데이터와는 사업자명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로만 연결한다.
description_portal: 이 자료는 서귀포시 관내에서 석면 해체·제거를 수행하는 업체들의 기본 정보를 정리한 데이터입니다. 사업자명, 소재지(도로명 또는 지번 주소), 연락처(전화번호), 위도·경도 좌표 등 위치 및 연락 가능 정보가 포함되어 있어, 행정기관은 석면 안전관리 계획, 긴급 제거 작업 우선순위 선정, 주민 안전 공지, 밀집 지역 지도화 등에 활용할 수 있습니다. 시민에게는 해당 업체의 합법 등록 여부 확인, 안전한 해체업체 선택, 사고 예방 정보 제공 등에 유익하며, 연구기관이나 환경단체에서는 석면 노출 위험 평가, 해체 제거 정책의 공간적 취약성 분석 등에 쓰일 수 있는 기초 자료가 됩니다.
