summary_user: '부산광역시 남구 관내 먹는물 공동시설(약수터) 12개소의 수질검사 결과를 약수터별 한 행으로 담은 작은 파일(약 1KB)이며, 명칭·소재지와 살모넬라·세균성이질·일반세균·총대장균군·분원성대장균군 검사값, 적합 여부를 포함한다. 남구 주민이나 등산객이 "이기대·장산 같은 동네 약수터 물을 지금 마셔도 되는가"를 확인하거나, 분석가가 구 단위 약수터 미생물 수질 적합률을 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 약수터 명칭이나 소재지 주소를 문자열로 맞춰 이어 써야 한다(예: 다른 구·시의 약수터 수질검사 데이터, 주소 기반 위치 데이터).'
description_portal: '부산광역시 남구 관내에 위치한 먹는물 공동시설(약수터) 12개소의 수질검사 결과를 공개합니다.- 대상: 남구 먹는물 공동시설(약수터) 12개소 - 목록 : 장산, 장군묘, 이기대, 이기대 큰고개, 청수, 안창, 중앙늘샘, 체육공원, 용당 12통, 장자산, 대연샘, 문현약수터는 자연에서 유래된 지하수 또는 암반수를 정수하거나 여과하여 시민에게 제공하는 공공 식수 공급 시설로, 도심 속 시민 건강과 편의를 위한 중요한 생활 기반 시설 중 하나입니다. 대부분의 약수터는 산림공원, 등산로 입구, 도심 공원, 주택가 주변 등 시민의 접근성이 좋은 곳에 설치되어 있으며, 누구나 무료로 이용할 수 있는 공공재입니다.약수터의 물은 일반적으로 지하 암반층을 통해 천천히 스며든 자연수를 활용하며, 때로는 인공 관정을 통해 끌어올리는 경우도 있습니다. 이 물은 미네랄이 풍부하고 신선하다는 인식이 강해 많은 시민들이 등산, 산책, 운동 후에 수분을 보충하거나 생활 식수로 사용하기도 합니다.그러나 아무리 천연수라고 하더라도 수질 안전이 담보되지 않으면 음용에 적합하지 않을 수 있으므로, 약수터는 관할 지방자치단체 또는 위탁기관이 정기적으로 수질검사를 실시하고 있으며, 검사 결과를 현장 게시판, 구청 홈페이지, 또는 공공데이터 포털을 통해 시민들에게 공개하고 있습니다. 검사 항목에는 일반세균, 대장균, 중금속, 탁도, 색도, pH, 질산성 질소 등 먹는 물 수질기준을 따르는 항목들이 포함되어 있습니다. 검사 결과에 따라 ‘음용 가능’, ‘음용 자제’, ‘음용 금지’ 등의 안내 표지가 부착되며, 시민들은 이를 확인하고 안전하게 이용해야 합니다. 환경 약수터는 시민들이 자연 속에서 깨끗한 지하수를 마실 수 있도록 조성된 공공 식수 공급 시설입니다.'
