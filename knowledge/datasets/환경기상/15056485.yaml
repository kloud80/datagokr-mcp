description_portal: 전북특별자치도 내에 자생하는 것으로 확인된 희귀 및 특산식물의 목록 현황 데이터입니다. 이 자료는 각 식물의 국명, 학명, 과명 정보와 함께, 멸종위기(CR), 위기(EN) 등급이 포함된 '희귀식물' 또는 한반도 고유종인 '특산식물' 여부를 명시하고 있습니다. 이 목록은 지역의 생물다양성이 얼마나 풍부하고 보존 가치가 높은지를 보여주는 중요한 지표입니다. 생태 연구자나 환경 정책 담당자는 이 데이터를 활용하여 우선적으로 보호가 필요한 식물종과 서식지를 파악하고, 체계적인 보전 전략을 수립하는 데 필수적인 기초 자료로 사용할 수 있습니다.
