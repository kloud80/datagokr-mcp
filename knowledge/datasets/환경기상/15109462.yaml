summary_user: '충청남도 부여군에서 접수된 야생동물 구조를 건별로 담으며, 접수번호별로 동물 국명·분류(강·목·과·학명)·멸종위기 등급·CITES 여부, 발견·접수·구조 일시, 발견 주소와 구조·방사 좌표, 발생 원인, 구조 결과와 최종 진단을 기록한다. 부여군에서 어떤 종이 어떤 원인(예: 충돌·고립)으로 어디서 많이 구조되는지, 구조 후 방사 비율은 어떤지를 살피는 지역 환경 담당자나 생태 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 종 국명·학명 같은 이름 매핑이나 발견 주소·구조 좌표를 이용한 공간 결합으로 이어 쓴다.'
limits: 공통 코드로 묶이는 조인 키가 없어 다른 지역 구조 데이터나 종 분포 데이터와 붙이려면 이름이나 좌표를 직접 맞춰야 한다. 범위는 부여군 한 곳의 개별 구조 건(주소·좌표)이라 충남 전체나 전국 현황은 이 데이터만으로 알 수 없다. 포털 활용신청 후 serviceKey로 호출하며, 개발계정은 하루 5,000회까지 쓸 수 있다.
