description_portal: '연도별 폐기물 부담금 물질정보(수입) 정보입니다.부과요율 산출을 위한 품목(살충제, 유독물용기, 부동액, 껌, 1회용 기저귀, 담배, 플라스틱제품)에 대한 금액입니다.(계산방법) 폐기물부담금= 제품의 출고(수입)실적×부과요율(금액)×부담금산정지수부담금 산정지수 : 최초의 적용연도(2008년)를 1로 하고, 그 다음해부터는 매년 전년도 부담금 산정지수에 전년도 물가상승률 등을 감안하여 환경부장관이 고시하는 가격변동지수를 곱한 것(단, 종가세 방식으로 부담금 산출하는 껌은 1로 적용)* 폐기물부담금 제도란?폐기물의 발생을 억제하고 자원의 낭비를 막기 위하여 유해물질을 함유하고 있거나, 재활용이 어렵고 폐기물관리상 문제를 일으킬 수 있는 제품, 재료, 용기의 제조업자 또는 수입업자에게 그 폐기물의 처리에 드는 비용을 부담하도록 하는 제도로 유해물질 또는 유독물을 함유하고있거나, 재활용이 어렵고, 폐기물 관리상 문제를 일으킬 수 있는 제품, 재료, 용기에 대한 폐기물 처리비용을 해당 제품, 재료, 용기의 제조업자 또는 수입업자에게 부담하도록 하여 폐기물의 발생을 생산단계에서부터 억제하고 자원의 낭비를 막기 위합입니다.[근거:자원의 절약과 재활용 촉진에 관한 법률 제 12조 (폐기물부담금)]'
