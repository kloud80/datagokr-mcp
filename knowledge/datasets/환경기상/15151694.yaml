description_portal: 공항특보는 공항 주변에서 발생하는 기상 현상 중 항공기의 이착륙, 지상 이동, 관제 및 운항 안전에 중대한 영향을 미칠 수 있는 상황을 신속히 알리기 위해 발효되는 기상 정보입니다. 주로 짙은 안개, 강풍, 뇌우, 폭설, 적설, 활주로 결빙, 집중호우, 저시정 등 항공기 운항을 지연·취소시킬 수 있는 현상이 대상입니다. 공항특보는 관할 항공기상대가 실황과 예보를 바탕으로 발효·해제하며, 공항 운영기관, 항공사, 관제기관 등 관계 기관에 즉시 전달됩니다. 이를 통해 항공 관계자는 안전 운항을 위한 사전 대비와 조치를 취할 수 있으며, 공항 운영 효율성을 높이는 데 중요한 역할을 합니다.
