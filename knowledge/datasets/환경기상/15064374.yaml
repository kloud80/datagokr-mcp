summary_user: 수도권매립지에 반입되는 음식물류 폐기물 폐수(음폐수)의 반입량을 마감년월·소재지(광역지자체)·폐기물명별 실중량(kg)으로 집계한 파일 데이터입니다. 지자체 담당자나 분석가가 "어느 시·도에서 매달 음폐수를 얼마나 수도권매립지로 보내는가"를 확인하고, 바이오가스화 등 처리 수요를 가늠하는 데 씁니다. 전역 조인 키는 없어 소재지 이름과 마감년월을 기준으로 같은 공사의 다른 통합반입관리 데이터나 지자체별 통계와 이름 매핑으로 이어 씁니다.
description_portal: 수도권매립지에 반입되는  음폐수 반입량 정보입니다. 개방항목으로는 마감년월,  광역지자체명, 폐기물명, 실중량(kg) 항목을 제공합니다.공사에서 제공하는 음폐수 정보는 개방항목으로 제공하는 항목을 기준으로 공개되고 있습니다. 이 데이터는 공사로 반입되는 음폐수의 지역별, 월별 반입량을 체계적으로 관리하고, 음폐수 처리 및 바이오가스화 등 자우너화 사업의 기초 자료로 활용 됩니다. 또한, 음폐수는 사업장 폐기물 중 하나로, 수도권매립지에서 별도의 바이오가스화 시설 등에서 처리되어 에너지회수 및 환경 보전에도 기여하고 있습니다.
