summary_user: 경기도 내 측정소별·측정일시별로 통합대기환경지수의 대표 항목·지수·등급과 미세먼지(PM10)·초미세먼지(PM2.5)·오존·일산화탄소·이산화황·이산화질소 각각의 지수값과 등급을 담은 건별 측정 자료다. 경기도 주민이나 분석가가 특정 시간대에 우리 동네 측정소의 대기질 등급이 어땠는지, 어떤 오염물질이 대표 항목이었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대기질 데이터와는 측정소코드(mesurstn_cd)·측정소명 매핑과 측정일시를 맞춰 이어 써야 한다.
description_portal: 「경기도 대기환경정보 통합대기환경지수」 데이터는 경기도 내 개별 측정소 단위의 대기오염 상태를 제공하는 자료입니다.이 데이터는 각 측정일시와 측정소코드/측정소명을 기준으로 하여, 특정 시간대·측정소별 대기질 상태를 나타냅니다. 주요 항목으로는 **PM10(미세먼지), PM2.5(초미세먼지), 오존(O₃), 일산화탄소(CO), 이산화황(SO₂), 이산화질소(NO₂)**가 있으며, 각각의 지수값과 등급이 기록됩니다.해당 데이터는 대용량 데이터로 시트에는 2024년의 데이터만 확인하실 수 있습니다.온전한 데이터는 파일 탭에서 다운로드 받으실 수 있습니다.
