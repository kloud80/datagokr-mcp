summary_user: 용인도시공사 관내에서 운영 중인 종량제봉투 판매업소를 업소 한 곳당 한 행으로 담은 파일이며, 행정동명·거래처명·주소·데이터기준일자를 제공한다(CSV 약 101KB). 용인 주민이 '우리 동네 어디서 종량제봉투를 살 수 있나'를 찾거나, 분석가가 행정동별 판매소 분포를 살피는 데 쓴다. 전역 조인 키는 없어 행정동명이나 주소를 이름 매핑·지오코딩해 다른 지자체 판매소 파일이나 생활폐기물 배출 지점 데이터와 잇는다.
description_portal: 용인도시공사가 관리하는 "종량제 봉투 판매업소 현황"은 시민의 생활 편의를 위해 관내에서 운영 중인 종량제봉투 판매업소의 위치와 관련 정보를 체계적으로 제공하고 있습니다. 본 데이터는 반기 1회 정기적으로 갱신되며, 제공되는 항목은 행정동명, 거래처명, 거래처 주소, 데이터기준일자로 구성되어 있습니다.‘종량제 봉투 판매업소 현황’ 데이터의 개방과 공개는 종량제봉투 구매와 관련한 불편을 최소화할 수 있습니다. 보다 구체적인 내용이나 문의사항이 있는 경우에는 용인도시공사 환경사업팀(031-321-3670)으로 연락 주시면 상세한 안내를 받으실 수 있습니다.
