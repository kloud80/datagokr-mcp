description_portal: '○ 개요서울특별시 25개 자치구의 음식점(요식업)을 대상으로, 업종 소분류(한식·양식·일식 등, KSIC 연계)별 대기오염물질 배출량을 집계한 통계입니다. 2021년 기준 데이터이며, 생물성 연소 관련 "국가 대기오염물질 배출량 산정방법 편람" 방법론을 적용하였습니다.○ 집계 단위공간: 자치구 (25개)분류: 음식점 업종 소분류 (KSIC 연계)○ 수록 오염물질CO, NOx, SOx, TSP, PM10, PM2.5, VOC, NH3○ 배출원 분류대기환경보전법상 신고·허가 대상(1~5종)에 해당하지 않는 소규모 생활주변 배출원으로, 음식점 조리 과정(고기구이 등)에서 발생하는 생물성 연소가 해당됩니다.○ 주요 한계소상공인 중 요식업만 포함, 그 외 업종 배출량은 미제공생물성 연소 방법론 기반으로 다른 연소 유형은 미반영'
