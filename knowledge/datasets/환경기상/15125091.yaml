summary_user: 대구광역시 서구에 있는 재활용업체 가운데 재생플라스틱을 취급하는 업체를 업체 한 곳당 한 행으로 담은 소규모 목록 파일(csv 885바이트)이며, 폐기물재활용업 허가 구분·업체명·소재지·영업대상 폐기물(폐합성수지·폐가구·폐목재·폐전선 등)을 담는다. 주민이나 배출 사업자가 '서구에서 폐합성수지를 받아 재활용하는 업체는 어디인가'를 찾거나, 분석가가 구 단위 플라스틱 재활용 업체 분포를 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어서, 다른 업체 데이터와는 업체명·소재지 주소를 맞춰 보거나 같은 기관(대구 서구) 자료끼리만 이어 쓴다.
description_portal: 대구광역시 서구의 재생플라스틱 취급업체 현황 데이터입니다. 해당 데이터에 포함된 항목은 폐기물재활용업 허가구분, 업체명, 소재지, 영업대상폐기물입니다.본 데이터는 대구광역시 서구 지역에 위치한 재활용업체 중 재생플라스틱을 취급하는 업체의 현황을 수록한 자료이다. 업체명, 소재지, 영업 대상 폐기물 종류 등 주요 정보를 포함한다. 영업 대상 폐기물은 폐합성수지, 폐가구, 폐목재, 폐전선 등으로 다양하며, 각 업체의 재활용 허가 유형에 따라 처리 가능 품목이 상이하다. 본 자료는 지역 내 플라스틱 재활용 산업 현황을 파악하고 관련 사업자 정보 제공, 폐기물 처리 연계, 자원순환 정책 수립 등의 목적에 활용될 수 있다. 업체별로 상세한 소재지 및 재활용 품목 정보를 제공함으로써 이용자의 이해도를 높이고 실효성 있는 행정 지원이 가능하도록 구성되어 있다.
