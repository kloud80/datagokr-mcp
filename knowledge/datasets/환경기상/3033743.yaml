summary_user: 강원특별자치도 하천 수질측정망의 월별 운영결과를 측정소별로 담은 건별 파일로, 측정소명·위도·경도와 함께 수온, 용존산소, BOD, COD, 부유물질, 총질소, 총인, 총유기탄소, pH 값을 연·월 단위로 기록한다. 강원 지역 특정 하천 지점의 BOD나 총인이 해마다 어떻게 변해 왔는지, 어느 측정소의 수질이 나빠지고 있는지를 확인하려는 주민·환경 분석가가 쓴다. 전역 조인 키는 없으므로 측정소명이나 위도·경도 좌표로 수자원(하천·댐)·수질 오염원 같은 다른 물 관련 데이터와 이름 매칭이나 공간 결합으로 이어 쓴다.
description_portal: '- 하천 등 수질보전대상 공공수역에 대한 수질현황을 종합적으로 조사하여 수질변화 추세를 파악- 주요정책 사업의 효과를 분석하여 장래 수질보전정책수립을 위한 기초 자료를 확보하기 위하여 운영- 월별 하천 수질측정망 운영결과를 제공    (지점별 위치, 온도, 용존산소(DO), 생물화학적산소요구량(BOD), 화학적 산소요구량(COD), 부유물질(SS), 총질소(T-N), 총인(T-P), 총유기탄소(TOC), 수소이온농도(pH))     * 위도, 경도, 온도(℃),  DO(㎎/L), BOD(㎎/L),  COD(㎎/L), SS(㎎/L), TN(㎎/L), TP(㎎/L),  TOC(㎎/L),  수소이온농도(pH)'
