summary_user: '제천시 관내 보조지하수관측망 관측정별 지하수 수위를 월별(년월)로 기록한 파일로, 한 행이 한 달이고 관측정(01호기 모산~37호기 청풍, 약 36개)이 각각 열로 펼쳐진 넓은 표 형태다. 제천시의 특정 지역(예: 봉양·백운·금성)에서 지하수 수위가 계절이나 해에 따라 얼마나 오르내리는지 살펴보려는 주민·관정 개발 사업자·수자원 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지하수·수질 데이터와는 관측정 번호(1082 등)나 지명을 이름으로 맞추거나 같은 기관 데이터로만 연결한다.'
