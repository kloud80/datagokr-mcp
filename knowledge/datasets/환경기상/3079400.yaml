summary_user: 경기도 동두천시에 신고된 건설공사 등 비산먼지 발생 사업장을 한 행에 한 곳씩 담은 파일로, 사업장명·공사장 소재지·공사내역·공사기간·발생사업·공사규모(㎡)·관리기관 연락처를 담는다. 인근 주민이나 민원인이 '우리 동네에서 지금 비산먼지가 나는 공사가 어디서 언제까지 진행되는지'를 확인하거나, 분석가가 시 단위 비산먼지 발생원 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공사장 소재지 주소나 사업장명 매칭, 또는 같은 기관(동두천시) 단위로만 이어 쓴다.
limits: 사업자번호 같은 공통 키가 없어 배출시설 인허가·기업 데이터와 정확히 연결하기 어렵고, 주소·이름 매칭에 의존해야 한다. 범위는 동두천시 한 곳뿐이라 다른 시군 비교에는 별도 데이터가 필요하다.
