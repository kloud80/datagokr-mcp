summary_user: 전라남도 신안군에서 실내공기질 관리 대상으로 지정된 다중이용시설 목록을 시설 한 곳당 한 행으로 담은 작은 파일(약 2KB CSV)이다. 각 행에는 시설명, 도로명·지번 주소, 위도·경도, 연면적, 측정 대상 항목, 관련 법령이 들어 있다. 주민이나 담당 공무원이 "신안군에서 실내공기질 점검을 받아야 하는 시설은 어디이고 어떤 항목을 재는가"를 확인할 때 쓰며, 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위경도 기반 공간 결합으로만 잇는다.
description_portal: 이 데이터는 전라남도 신안군 내 다중이용시설 중 「실내공기질 관리법」에 따라 관리 대상으로 지정된 시설의 현황을 제공하는 자료입니다. 시설명, 도로명주소 및 지번주소, 위도·경도 등 위치정보, 전화번호, 연면적, 측정 대상 항목, 관련 법령, 기준일자 등의 항목으로 구성되어 있으며, 실내 환경의 질적 개선과 위생관리, 대기오염 예방을 위한 정책 수립에 활용됩니다. 특히 불특정 다수가 이용하는 공공시설의 공기질 상태를 체계적으로 파악하고, 건강 취약계층 보호, 환경보건 연구, 점검 계획 수립 등 다양한 행정·학술적 목적에 기초자료로 활용될 수 있습니다.
