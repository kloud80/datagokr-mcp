summary_user: 한국동서발전이 운영하는 발전소별 2023년 이산화탄소 배출량(톤)을 발전소명 한 줄씩 담은 집계 파일로, 메탄·아산화질소도 CO₂ 환산량으로 포함되고 발전설비 이외 기타시설 배출은 빠진다. 분석가가 '동서발전 발전소 중 어느 곳의 2023년 탄소 배출이 가장 많은가'를 비교하거나 발전부문 온실가스 배출 추정·배출권 거래제 대응 분석에 쓴다. 전역 조인 키가 없어 다른 발전사 배출량이나 발전소 설비 데이터와는 발전소명을 직접 맞춰 이어 써야 한다.
limits: 2023년 한 해 값만 있어 연도별 추이는 이 파일만으로 볼 수 없고, 발전소명 외에 위치·코드 같은 공간·식별 정보가 없어 지도화나 자동 조인이 어렵다. 포털 설명상 2024년 5월 확정 수치이지만 향후 조정될 수 있다.
