description_portal: 한국동서발전에서 운영 중인 발전소의 2023년 이산화탄소 배출량 정보를 제공합니다. 본 데이터는 2024년 3월 기준으로 제출된 배출량 명세서를 바탕으로 하며, 발전설비 이외 기타시설에서 발생한 배출량은 제외됩니다. 해당 수치는 환경부의 적합성 평가를 거쳐 2024년 5월에 최종 확정되었으며, 향후 조정 가능성이 있습니다. 또한 CH₄(메탄), N₂O(아산화질소) 배출량도 각각의 지구온난화지수(GWP)를 적용하여 CO₂ 환산량으로 포함됩니다. 데이터 항목은 발전소명, 2023년 이산화탄소 배출량(톤)으로 구성되어 있습니다.본 정보는 탄소중립 이행 전략, 발전부문 온실가스 배출량 추정, 발전원별 탄소 집약도 비교, 배출권 거래제 대응 분석, 그리고 발전소 환경성과 평가 등 다양한 연구 및 정책 개발에 활용될 수 있습니다. 특히 국가 온실가스 감축 시나리오 수립 및 기업의 ESG 평가 기준 마련에 중요한 기초자료가 됩니다.
