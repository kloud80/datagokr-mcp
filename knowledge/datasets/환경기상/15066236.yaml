description_portal: 「국립공원 용도지구」 데이터는 국립공원 구역 내에서 토지의 이용 목적과 보전 수준에 따라 설정된 용도지구의 공간정보를 제공하는 자료입니다. 자연보존지구, 자연환경지구, 자연취락지구, 공원마을지구, 문화유산지구 등으로 구분되며, 각 지구는 「자연공원법 시행령」에 근거하여 구체적인 행위제한 및 허용 기준이 달라집니다. 해당 데이터는 국립공원공단이 환경부 고시를 반영하여 주기적으로 갱신하며, 폴리곤(Polygon) 형태의 공간데이터로 제공되어 국립공원 내 각종 개발행위, 인허가 심의, 보전계획 수립, 환경영향평가 등에 활용됩니다. 또한 탐방객의 안전관리와 지속가능한 이용 정책 수립에도 기초자료로 활용됩니다.
