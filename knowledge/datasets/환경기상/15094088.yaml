description_portal: '이 데이터는 봉화군에서 대형폐기물 수거 업무를 수행하는 업체 현황을 정리한 행정 자료입니다. 각 업체가 담당하는 행정동과 법정동 구역, 소재지 주소, 연락처 등이 포함되어 있어, 주민들이 폐기물 수거 문의나 신청 시 참고할 수 있는 정보입니다. 또한 행정에서는 업체별 담당 구역과 연락처를 관리하고, 대형폐기물 처리 정책을 효율적으로 집행하는 기초 자료로 활용할 수 있습니다.  대형폐기물 수거와 관련된 담당업체 정보 및 행정 관리 현황을 제공하는 통계 자료라고 할 수 있습니다.[컬럼별 항목 설명]업체명 : 대형폐기물 수거를 담당하는 업체 명칭담당구역(행정동) : 해당 업체가 담당하는 행정동 단위 구역담당구역(법정동) : 해당 업체가 담당하는 법정동 단위 구역주소지 : 업체의 소재지 주소전화번호 : 업체 연락용 전화번호팩스번호 : 업체 연락용 팩스번호데이터기준일자 : 해당 데이터가 수집·제공된 기준일'
