summary_user: 봉화군에서 대형폐기물 수거를 맡은 업체별로 담당 구역(행정동·법정동), 소재지 주소, 전화·팩스번호를 담은 건별 현황 파일로, 1KB 남짓한 작은 CSV입니다. 봉화군 주민이 '우리 마을의 대형폐기물 수거는 어느 업체에 연락해야 하나'를 확인하거나, 지자체별 수거 담당 업체를 모으는 분석가가 참고하는 데 쓴다. 전역 조인 키는 없으므로 담당구역의 행정동·법정동 이름을 다른 행정구역 자료와 이름으로 맞추거나, 같은 봉화군의 대형폐기물 품목·수수료 등 다른 생활폐기물 파일과 기관 단위로 이어 쓴다.
