summary_user: 고양시 일산서구의 종량제봉투 지정판매소를 한 곳씩 행정동, 판매소명, 주소로 담은 판매소별 목록 파일(csv, 약 18KB)이다. 일산서구 주민이 '우리 동네 어디서 종량제봉투를 살 수 있나'를 찾거나, 분석가가 행정동별 판매소 분포를 살피는 데 쓴다. 전역 조인 키가 없어 행정동 이름을 행정구역 코드표와 맞추거나 주소를 좌표로 변환해 다른 생활폐기물 배출·수거 지점 데이터와 잇는다.
description_portal: 경기도 고양시 일산서구에서 판매되는 종량제봉투에 대한 현황자료로서 종량제봉투판매소의 행정동, 판매소명, 주소 관련 정보 안내. 고양시 종량제 봉투의 현황을 공개함으로써, 종량제봉투 지정판매소 정보를 알기쉽게 정보로 목록화하였습니다. 목록화한 정보는 지역주민 등 생활정보로 유용하게 쓰일뿐만 아니라 위치현황 공유를 통해 알고싶은 정보를 제공함으로써 공공기관의 책무를 이행하기 위함입니다. 고양시 행정구역별 판매정보를 제공하여 유익하고 알찬 정보를 추가 제공하기 위한 노력을 기울일 예정입니다. 종량제 정보
