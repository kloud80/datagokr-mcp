description_portal: '거제시 해양기상부이 관측 데이터는 바다 위에서 실시간으로 수집된 기상 및 해양 정보를 제공합니다. 풍속(m/s), 풍향(도), 순간 최대 풍속(GUST 풍속), 현지기압(hPa), 습도(%), 기온(°C), 수온(°C) 등 다양한 기상 항목과 함께, 최대파고, 유의파고, 평균파고(단위: m), 파주기(초), 파향(도) 등 파랑 정보도 포함되어 있습니다. 이 데이터는 해상 안전, 어업 활동, 해양 레저, 기후 연구 등 다양한 분야에서 활용할 수 있습니다. 사용자는 거제 인근 해역의 실시간 해양 및 기상 상태를 정확하게 파악할 수 있습니다. 또한 신속하고 정확한 정보 제공을 통해 해양 재난 예방과 안전 관리에 기여합니다.'
