summary_user: 남원시에 신고된 사업장폐기물 배출자를 신고 건별로 담은 원천 목록으로, 배출 사업장 상호명·폐기물 종류·운반자·처리업소·처리방법·사업장 도로명주소·신고기준년도를 시군구 범위에서 개별 사업장 단위로 기록한다. 남원시에서 어떤 사업장이 어떤 폐기물을 어느 운반·처리업체에 맡겨 어떤 방법으로 처리하는지 확인하려는 주민·사업자·환경 분석가가 쓴다. 전역 조인 키가 없어 처리업소명·운반자명을 폐기물 처리업 허가 목록과 이름으로 맞추거나 사업장 도로명주소로 다른 데이터와 연결해야 한다.
description_portal: 1. 데이터 설명전북특별자치도 남원시의 사업장폐기물 배출자 신고현황 데이터는 「폐기물관리법」에 근거하여 사업장폐기물 배출자가 제공한 정보를 담고 있습니다. 해당 데이터는 배출자의 상호명, 폐기물 종류, 운반자 및 처리업소명, 처리방법 등의 세부 정보를 포함하며, 폐기물의 발생부터 최종 처리에 이르는 전체 과정의 투명한 관리를 목표로 합니다. 이를 통해 사업장폐기물의 적절한 처리를 유도하고, 불법 투기와 부적절한 처리를 방지함으로써 환경오염 예방에 중요한 역할을 수행합니다. 더불어 폐기물 처리 과정의 매니페스트(전자 인계서) 정보와 연계하여 폐기물의 흐름을 명확히 추적하고, 배출자의 책임을 강화하는 데 활용될 수 있습니다.2. 항목명폐기물구분, 상호명, 폐기물종류, 운반자명, 처리업소명, 처리방법, 사업장도로명주소, 신고기준년도3. 기대효과이 데이터의 활용을 통해 사업장폐기물의 체계적 관리와 불법 폐기물 처리 근절을 위한 환경 개선 효과를 기대할 수 있습니다. 또한 관련 정책의 수립과 집행에 있어 투명성을 높임으로써 행정의 효율성 제고에도 상당한 기여를 할 것으로 전망됩니다.
