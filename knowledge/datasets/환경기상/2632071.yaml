summary_user: 해양경찰청에 등록된 해양오염방제업체와 유창청소업체의 현황을 업체 한 곳당 한 행으로 담은 전국 단위 목록이며, 관할 지방청·해양경찰서, 업체명, 소재지, 전화·팩스, 업종 구분(구분)을 포함한다. 선박 운영자나 항만 관계자가 "우리 관할 해경서 구역에서 폐유 수거나 유창청소를 맡길 수 있는 등록업체는 어디인가", 또는 사고 대응 담당자가 "가까운 방제업체 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 지방청·해경서 이름이나 소재지 주소를 매핑해 잇거나 같은 해양경찰청의 해양오염사고 데이터와 관할 이름으로 연결한다.
description_portal: '2026.5.31. 기준 해양오염방제 및 유창청소 업체 등록 현황에 관한 데이터로서 지방청, 해경서, 업체명, 소재지, 전화번호, 팩스, 구분 등의 항목을 제공합니다.- 유창청소업: 선박의 유창청소 및 폐유수거에 필요한 설비 및 장비를 갖추고 유창청소와 폐유수거를 하는 사업- 해양오염방제업: 오염물질의 방제에 필요한 설비 및 장비를 갖추고 해양에 배출되거나 배출될 우려가 있는 오염물질을 방제하는 사업- 등록절차 : 민원인 > 등록신청(해양경찰서) > 현지 확인 > 검토 > 등록증 교부 - 근거: 해양환경관리법 제70조, 시행령 제55조 및 시행규칙 제36조'
