summary_user: 에어코리아 대기질 측정소의 영문 정보를 측정소 한 곳당 한 건으로 담으며, 측정소명·도로명주소·설치연도·시설구분·측정항목·좌표를 전국 범위로 제공한다. 외국인 대상 대기질 앱이나 해외 서비스 개발자가 '이 위치에서 가장 가까운 측정소는 어디이고 영문으로 어떻게 표기하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 에어코리아 실시간 대기질 등 같은 기관 데이터와는 측정소명 매핑이나 좌표(xcrd·ycrd)로 맞춰 이어 쓴다.
description_portal: '측정소 영문 정보 조회 서비스 OPEN API기능은 대기질 측정소 정보를 조회하기 위한 서비스로 TM 좌표기반의 가까운 측정소 및 측정소 목록과 측정소의 정보를 조회할 수 있습니다. 측정소정보 조회 OpenAPI 내 상세 기능은 측정소 목록 조회, 근접측정소 목록 조회, TM 기준좌표 조회로 이루어져 있습니다. 해당 서비스는 아래에 유용하게 사용하실 수 있습니다.-외국인 대상 서비스 개발: 국내 거주 외국인이나 한국을 방문하는 관광객을 위한 날씨 또는 대기질 정보 앱/웹사이트를 만들 때 사용됩니다.-글로벌 서비스 연동: 국내 대기질 정보를 해외 서비스에 연동하여 보여주고자 할 때, 측정소의 위치를 영문으로 정확하게 표기하기 위해 필요합니다.각 기능별 정보와 요청변수, 응답메세지에 대한 설명은 OpenAPI 기술문서를 참고하셔서 이용하시길 바랍니다.※ 운영계정으로 사용하고자 할 경우 "한국환경공단 에어코리아 OpenAPI 기술문서" 내 신청 가이드 참고'
