summary_user: 인천 부평구에서 음식물류폐기물을 다량으로 배출하는 사업장을 한 곳당 한 행으로 담은 파일로, 업소 구분(음식점·급식소 등), 상호, 도로명 주소, 전화번호, 1일 배출량, 면적, 연간 예상 배출량을 수록한다. 구청 담당자나 분석가가 "부평구에서 하루 음식물쓰레기를 많이 내는 사업장은 어떤 업종이고, 면적과 배출량은 어떤 관계인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 매핑해서만 연결할 수 있고, 같은 형식의 다른 지자체 파일과는 시군구 단위로 나란히 놓고 비교한다.
description_portal: '음식물류폐기물을 다량으로 배출하는 사업장의 업소 구분, 상호, 주소, 전화번호, 배출량 및 면적 등을 수록한 데이터.음식물류폐기물의 발생 현황을 파악하고, 다량배출사업장 관리, 폐기물 감량 정책, 자원순환 체계 확립 및 환경 위생 관리 등에 활용 가능하다.활용 목적 및 특징– 업소 구분별 음식물류폐기물 다량배출사업장 현황 분석– 1일 배출량 및 연간 예상 배출량 기반 관리 체계 수립– 사업장 면적과 배출량의 상관관계 분석 자료 활용– 음식물류폐기물 감량 정책 및 자원순환 정책 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 업소구분: 배출사업장의 업종 또는 업소 구분(음식점, 급식소 등)● 상호: 사업장의 명칭● 전화번호: 사업장 연락처● 주소: 사업장의 도로명 주소● 1일 배출량: 해당 사업장의 하루 음식물류폐기물 배출량● 면적: 사업장 면적(㎡)● 연배출예상량: 연간 예상되는 음식물류폐기물 배출량'
