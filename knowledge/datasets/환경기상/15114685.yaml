summary_user: 안양시 안에서 사업장폐기물 배출 신고를 한 사업장을 한 행씩 담은 원장으로, 상호·전화번호·도로명/지번 주소·위도·경도·인허가관리번호·인허가 등록일자·배출 폐기물 종류를 함께 싣는다. 사업자나 분석가가 '우리 동네에서 어떤 사업장이 어떤 종류의 폐기물을 배출한다고 신고했는가'를 확인하거나, 배출 사업장 위치를 지도에 찍는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 상호명·주소를 맞추거나 좌표로 공간 결합하는 방식으로 이어 쓴다.
description_portal: 안양시사업장폐기물 배출신고 현황 설명입니다.이 데이터는 폐기물관리법 제17조에 따라 안양시 내 사업장에서 발생한 폐기물의 배출 신고 현황을 기록한 것으로, 다음과 같은 항목들을 포함합니다:- 시군명- 상호명- 소재지 도로명 주소- 소재지 지번 주소- 위도 / 경도- 인허가관리번호- 인허가 등록일자- 배출 폐기물 종류이 데이터는 공공데이터포털에서 CSV 파일로 다운로드하거나 오픈 API를 통해 활용할 수 있으며, 최신 데이터는 2025년 6월 25일 기준으로 등록되어 있습니다. 데이터는 연 1회 갱신됩니다.
