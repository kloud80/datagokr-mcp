summary_user: 대구광역시 달서구 안의 종량제봉투 지정판매소를 판매소 한 곳당 한 행으로 담은 파일로, 사업장 이름·지번주소·사업장번호로 구성되며 시군구 범위의 개별 주소 단위 자료다. 달서구 주민이 집 근처에서 종량제봉투를 살 수 있는 가게를 찾거나, 행정 담당자·분석가가 동네별 판매소 분포를 파악하는 데 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키가 없어, 지번주소를 기준으로 주소·좌표 데이터와 맞추거나 다른 지자체 판매소 파일과 이름·주소로 이어 붙여 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 주소나 이름 매칭으로만 연결된다. 범위가 달서구 한 곳에 한정되며, 생활폐기물 발생량·처리현황 같은 통계는 담지 않는다.
