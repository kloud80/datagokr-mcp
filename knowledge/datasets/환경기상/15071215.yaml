description_portal: 제주특별자치도 제주시 관내 대형 폐기물 배출 수수료 현황 데이터는 제주시에서 대형 폐기물을 배출할 때 적용되는 품목별 수수료 정보를 제공하는 공공데이터입니다. 종류, 품목, 규격, 수수료, 수집운반비, 처리비 등의 항목으로 구성되어 있으며, 품목과 규격에 따라 배출자가 부담해야 하는 비용과 수수료 산정 구조를 확인할 수 있습니다. 본 데이터는 시민의 대형 폐기물 배출 신고 및 비용 확인, 품목별 수수료 조회 서비스 구축, 행정기관의 민원 응대, 폐기물 처리비용 분석, 자원순환 정책 수립, 생활폐기물 관리 업무 등에 활용할 수 있습니다.
