summary_user: 제주시에서 대형폐기물을 버릴 때 내는 수수료를 종류·품목·규격별로 정리한 표로, 품목마다 수수료와 그 구성인 수집운반비·처리비를 담는다(csv 파일 약 18KB). 제주시 주민이 소파나 냉장고 같은 물건을 버리기 전에 '이 크기면 얼마를 내야 하나'를 확인하거나, 민원 응대·수수료 조회 서비스를 만들 때 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어서, 다른 지자체 대형폐기물 수수료 파일과 비교하려면 품목명·규격을 이름으로 맞춰야 한다.
