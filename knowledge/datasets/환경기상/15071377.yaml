summary_user: 한국환경산업기술원이 녹색제품 인증을 받은 제조·판매 기업의 사업자번호, 업체명, 대표자명, 주소, 연락처, 홈페이지를 기업 한 곳당 한 행으로 담은 전국 단위 CSV 파일(약 410KB)이다. 녹색제품을 납품받거나 협력하려는 구매 담당자·사업자가 '우리 지역에 녹색제품 인증 기업이 어디에 있고 어떻게 연락하나'를 확인하거나, 분석가가 인증기업의 지역별 분포를 볼 때 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 업체명·사업자번호 같은 이름·번호 매칭이나 같은 기관(환경표지 등) 자료와의 대조로 잇는다.
description_portal: 본 데이터는 한국환경산업기술원의 녹색제품인증기업 현황을 제공하는 통계형 공공데이터로, 사업자번호, 업체명, 대표자명, 주소, 상세주소, 대표전화, 팩스, 홈페이지 등의 필드를 포함합니다. 인증을 받은 녹색제품 제조·판매 기업의 기본 정보를 파악할 수 있으며, 기업 위치 분석, 연락처 관리, 인증기업 네트워크 구축, 시장 조사 자료 제공, 정책 효과 평가, 기업 지원 프로그램 기획, 홍보자료 제작, 데이터 기반 인증 시스템 관리, 대시보드 시각화 등에 활용할 수 있도록 설계되었습니다. 또한 인증기업의 지역별 분포 분석, 산업별 통계 작성, 후속 지원 프로그램  연계, 협력모델 개발, 기업 신뢰성 검증, ICT 시스템 통합, 모바일 앱 활용, 평가 보고서 작성, 감 사 및 모니터링 자료, 기업 DB 유지보수 등 다양한 활용 사례를 지원합니다.
