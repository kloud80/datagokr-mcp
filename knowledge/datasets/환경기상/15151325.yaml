description_portal: 이 데이터는 다리미(의류용 전기다리미) 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 데이터는 총 200장의 이미지 파일과 동일한 수의 라벨링 텍스트 파일로 구성되어 있으며, 각각 ‘images’ 폴더와 ‘labels’ 폴더에 저장되어 있습니다. 이미지에는 다양한 형태와 모델의 다리미가 포함되어 있으며, 실내 환경에서 다양한 각도와 거리에서 촬영되었습니다. 촬영된 이미지에는 다리미의 본체, 손잡이, 열판 등의 구성 요소가 식별 가능한 형태로 나타납니다. 라벨링 파일은 YOLO 형식으로 작성되어 있으며, 각 파일에는 다리미 객체의 위치 좌표와 클래스명이 기록되어 있습니다. 데이터는 객체 인식 및 분류 모델 학습에 활용 가능하도록 일관된 구조를 갖추고 있습니다.
