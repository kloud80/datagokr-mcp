description_portal: '대구광역시 북구 관내 음식물쓰레기 동별(관음동-관음중앙로 동편, 서편) 배출일 데이터입니다.구분(강남,강북), 동명(고성동 외 23개 동), 구역명, 배출일, 수거일 데이터를 제공합니다.명절(설,추석) 당일은 수거하지 않습니다.배출요령 : 품목별로 모아 투명/반투명 비닐봉투에 묶어서 배출 또는 전용수거함에 배출(종이류, 유리병류, 고철 캔류, 투명페트병, 플라스틱, 스티로품(EPS), 일반비닐류, 폐형광등, 폐건전지)자세한 배출방법은 북구청 홈페이지(https://www.buk.daegu.kr/index.do?menu_id=00001791) 참고'
