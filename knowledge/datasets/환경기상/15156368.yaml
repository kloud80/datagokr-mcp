description_portal: '평택시 대형 폐기물 품목 정보는 평택시 대표 홈페이지 DB 데이터로서 시민이 배출해야 하는 가구, 가전제품 등 대형 생활폐기물의 종류와 규격, 배출요금 등 명확히 안내하여 불편을 줄이고 효율적인 폐기물 관리를 지원하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 품목별 배출 기준과 비용을 쉽게 확인하고 온라인 배출신청 서비스를 편리하게 이용할 수 있으며, 민간·연구기관은 폐기물 발생량 분석, 재활용 품목 분류 연구, 자원순환 정책 수립 등에 활용할 수 있습니다. 본 데이터에는 품목명, 규격, 처리비용 등이 포함되어 있어 대형 폐기물 배출의 이해를 돕습니다. 이러한 자료는 생활폐기물 행정의 투명성 향상, 불법 투기 예방, 자원순환 체계 강화, 민간 서비스(앱·플랫폼) 개발 등 다양한 분야에서 활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
