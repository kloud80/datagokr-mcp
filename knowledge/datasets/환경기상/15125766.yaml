description_portal: 이 자료는 서울시 내에 설치된 “정방형 침투통” 시설의 공간(위치) 정보를 제공하는 데이터입니다. 좌표계는 EPSG:5186 (GRS80 타원체의 한국 중부원점 기준, Y축 +600,000m 이동)으로 설정되어 있습니다. 열린데이터광장+1 제공형식은 쉐이프파일(SHP) 형태로 다운로드 가능하며 인코딩은 windows-949입니다.  침투통이란 표면에 유입된 빗물 또는 지표수가 땅속으로 스며들게 하는 시설로, 도시의 빗물관리·저영향개발(LID) 인프라의 일환으로 활용됩니다. 따라서 이 공간정보는 지리정보시스템(GIS) 분석, 도시침수 대응, 빗물처리 인프라 맵핑, 자연친화형 도시 설계 등에 활용 가능성이 높습니다. 또한 설치 위치 및 밀도 분석을 통해 침투통이 부족한 지역을 파악하고, 자치구·유역별 관리 및 정책 지원이 필요한 영역을 탐색할 수 있습니다.[좌표계] EPSG:5186 (GRS80 타원체의 한국 중부원점이며 Y 축으로 600000미터만큼 이동시킨 좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.
