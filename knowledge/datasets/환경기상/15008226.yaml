summary_user: 서울특별시 강동구 관내에서 음식물류 폐기물을 다량으로 배출하는 사업장(집단급식소·대형 음식점 등)을 사업장 한 곳당 한 행으로 담은 등록 현황 파일로, 사업장명·구분·전화번호·도로명주소·데이터기준일자를 담는다. 강동구에서 음식물 폐기물 대형 배출원이 어디에 몰려 있는지, 우리 동네 집단급식소가 다량배출사업장으로 등록돼 있는지를 확인하거나 수거·처리 서비스 영업 대상을 찾는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 사업장명이나 도로명주소(소재지도로명주소)를 맞춰 잇거나, 다른 지자체의 같은 이름 파일과 나란히 붙여 쓴다.
description_portal: 서울특별시 강동구 관내에서 음식물류 폐기물을 다량으로 배출하는 사업장의 등록 현황을 제공하는 공공데이터입니다. 본 데이터는 집단급식소, 대형 음식점 등 음식물 쓰레기 발생량이 많아 별도의 적법한 처리 의무가 있는 시설들의 사업장구분, 사업장명, 도로명주소, 전화번호 등의  정보를 담고 있습니다.음식물류 폐기물 다량배출사업장 정보는 지역사회의 환경 오염을 예방하고 자원 순환 체계를 구축하기 위한 필수적인 행정 기반 자료입니다.행정기관은 본 자료를 바탕으로 대형 배출원의 분포를 파악하여, 음식물 폐기물 감량화 정책을 수립하거나 폐기물 수거 노선을 효율적으로 기획할 수 있습니다.  또한, 배출 규정 준수 여부를 확인하는 지도·점검 계획 수립에도 유용하게 활용됩니다.민간에서는 음식물류폐기물 처리 관련 서비스 제공, 자원순환 사업 기획, 지역 환경 분석 등 다양한 분야에 참고자료로 활용할 수 있습니다.아울러 연구기관에서는 지역 내 폐기물 발생 지점 분석 및 자원 재활용 인프라 확충 연구에 활용할 수 있습니다.
