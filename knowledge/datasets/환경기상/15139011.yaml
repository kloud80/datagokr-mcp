summary_user: 환경공간정보서비스 환경주제도의 하나로, 지역별 주유소용지 지목 면적과 토지피복상 주유소 면적을 나란히 놓고 그 비율을 계산한 지역 단위 집계표를 담는다(전국 범위, 비공간 CSV 약 11KB). 지적상 주유소용지와 실제 피복 면적이 지역마다 얼마나 어긋나는지 살펴보는 환경·토지 분석가나 연구자가 지역별 지목-피복 일치도를 비교할 때 쓴다. 전역 조인 키가 없어 지역 이름을 행정구역 코드표에 직접 맞춰 붙여야 하며, 같은 기관의 토지피복지도나 다른 환경주제도와도 이름 매핑으로만 연결된다.
limits: 필지나 좌표 단위 정보가 없는 지역별 집계여서 개별 주유소나 필지의 규제·오염 여부는 판단할 수 없다. 표준 행정코드 같은 조인 키가 없어 다른 데이터와 붙일 때는 지역 이름 매핑을 직접 해야 한다.
