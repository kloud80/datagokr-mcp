summary_user: 환경영향평가 대상 사업별로 수질 조사지점의 명칭·주소·좌표, 조사차수와 조사기간, 그리고 수온·pH·용존산소·BOD·COD·총질소·총인·클로로필-a 같은 일반항목과 카드뮴·납·수은·벤젠 등 유해물질 측정값을 조사지점·차수 단위 건별로 담은 전국 범위의 파일(zip 약 10.8MB)이다. 개발사업 예정지 주변 하천·호소의 사업 전 수질 상태를 확인하려는 주민, 사업자, 환경 분석가가 '이 사업 구역 인근 하천의 평가 당시 BOD·총인 수준은 어땠나' 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 기관의 환경영향평가 협의 현황·사업구역 데이터와는 사업코드(BSNS_CD)나 사업명 매핑으로 잇고, 조사지점 좌표로 토지이용규제·개발사업 공간정보와 겹쳐 본다.
description_portal: 환경부 국립환경과학원의 환경영향평가 사업의 수질조사 개요, 조사, 예측의 속성정보 제공 및 공간정보(조사지점) 등에 대한 정보를 제공하는 서비스입니다. 조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 클로로필-a(㎎/ℓ), 수온(˚C), 수소이온농도, 용존산소량(㎎/ℓ), 부유물질량(㎎/ℓ), 화학적산소요구량(㎎/ℓ)등 다양한 정보를 포함하며, 개요속성조회는 사업시행전 BOD 배출부하량(kg/일), 사업시행전 T-P 배출부하량(kg/일), 사업시행후 BOD 배출부하량(kg/일), 사업시행후 T-P 배출부하량(kg/일), 물재이용여부, 공공처리시설 연계 처리 여부등 다양한 정보를 제공합니다. 용수량속성조회에서는 시간최대급수(용수)량(m3/일), 계획급수(용수)인구, 단위급수(용수)량(L/인∙일), 일최대급수(용수)량(m3/일)의 정보를 제공합니다. 조사지점에 대한 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.
