summary_user: 광진구 관내 환경전문공사업(대기·수질·소음진동 방지시설 등을 설계·시공하는 업체) 인허가 사업장을 업소 한 곳당 한 행으로 담은 원장으로, 인허가일·영업상태·폐업일·소재지 주소·중부원점TM 좌표·실험실 면적과 주소 등을 포함한다. 광진구에 지금 영업 중인 환경 방지시설 시공업체가 어디에 몇 곳 있는지 찾는 사업자나, 구 단위 환경산업 현황을 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호 기준으로만 이어 쓰며, 같은 세부 부문의 다른 오염원 사업장 인허가 데이터와 주소·좌표로 묶어 보는 정도가 현실적이다.
description_portal: 서울특별시 광진구_환경전문공사업 인허가 정보는 광진구 관내에서 환경보전을 위한 각종 설비 및 시스템을 설계하고 시공하는 업소에 대한 인허가 현황 데이터를 제공합니다. 해당 업소들은 「환경기술 및 환경산업 지원법」에 따라 허가를 받은 업체로, 대기오염 방지시설, 수질오염 방지시설, 소음 및 진동 저감시설 등 환경오염을 예방하거나 저감하기 위한 시설을 전문적으로 설계 및 시공하는 기능을 수행합니다. 데이터는 업체명, 소재지, 업종 구분, 인허가일자, 영업상태 등으로 구성되어 있으며, 광진구 내 환경 관련 산업 현황 파악 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.※ 위치정보는 중부원점TM(EPSG:2097) 기준 좌표로 제공되며, 위경도 정보는 포함되어 있지 않습니다. 본 데이터는 수집일 기준 3일 전의 정보가 반영됩니다.
