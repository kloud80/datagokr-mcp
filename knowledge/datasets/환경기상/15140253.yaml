summary_user: 측정소별 실시간 통합대기환경지수(CAI)를 지수값·등급·주 오염물질과 측정망 구분(도시대기·도로변대기 등)까지 담은 조회 API로, 검증 시 전국 23행(2026-10-01~10-02)이 수신됐다. 시민이나 분석가가 '지금 우리 동네 측정소의 대기질 등급이 어떻고 어떤 오염물질이 원인인가'를 확인할 때 쓴다. 전역 조인 키는 없고 측정소코드(stationCode)나 측정소명으로 같은 기관(에어코리아) 측정소·대기질 데이터와 이어 쓴다.
description_portal: 각 측정소별 통합대기환경지수(CAI)를 조회하기 위한 서비스로 측정소별 통합대기환경지수(CAI) 정보를 조회할 수 있다.통합대기환경지수(CAI)는 총 6개 대기오염물질을 모두 고려하여 실시간 측정된 대기질을 지수화한 표현이다.통합대기환경지수(CAI) 조회 서비스의 상세기능은 측정소별 실시간 통합대기환경지수 (CAI) 조회로 이루어져 있으며 응답 메세지로는 측정일, 측정소 명, 측정소 코드, 측정망 정보, 통합대기환경수치, 지수, 주 오염물질의 데이터를 나타내고 있습니다. 상세 기능에 대한 설명은 OpenAPI의 기술문서를 이용해주시길 바랍니다. ※ 운영계정으로 사용하고자 할 경우 "한국환경공단 에어코리아 OpenAPI 기술문서" 내 신청 가이드 참고하시면 되겠습니다.
