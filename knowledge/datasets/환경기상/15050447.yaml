summary_user: 강원특별자치도 시·군별로 도시대기측정소 자료를 평균해 낸 월평균 대기오염물질 농도(아황산가스·일산화탄소·이산화질소·미세먼지·초미세먼지·오존)를 연도·월 단위로 담은 집계 파일이다. 분석가나 지자체 담당자가 "우리 시·군의 초미세먼지 월평균이 도내 다른 시·군보다 높은가, 계절별로 어떻게 달라지는가"를 비교할 때 쓴다. 전역 조인 키가 없어 시·군 이름과 연·월을 기준으로 인구·건강 통계 등 다른 시군구 단위 자료와 이름 매칭으로 이어 쓴다.
description_portal: '본 데이터는 「대기환경보전법」 제3조에 따라, 강원특별자치도 내 도시대기측정소에서 수집한 월평균 대기오염물질 농도 정보입니다.도시대기측정소에서는 환경부 고시 「대기환경측정망 설치·운영지침」에 따라, 연속자동 측정방법을 사용하여 대기오염물질 농도를 실시간으로 측정합니다.측정값은 5분 간격으로 수집된 원시 자료를 기반으로 시간평균을 산출하고, 이를 일평균 및 월평균으로 가공한 것입니다.모든 자료는 강원특별자치도 보건환경연구원의 품질관리 절차(검교정, 이상치 처리, 결측값 보완 등)를 거쳐 확정됩니다.<데이터 특성>통계 방법: 시·군별 1개 이상 측정소 자료의 평균 활용 예시: 지역별 대기질 비교, 기초지자체 건강 영향 연구, 행정구역 기반 환경정책 수립'
