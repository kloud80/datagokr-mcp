summary_user: 경기도 내 폐수배출사업장이 폐수배출시설 변경허가·변경신고를 위해 낸 신청을 건별로 담으며, 사업장명·업종·산업단지·관할관청, 신청·접수·승인일과 처리상태, 변경 전후 사항, 배출시설·방지시설 명칭과 용량, 폐수배출량, 방류구별 배출량, 수질오염물질명과 농도 등 44개 항목으로 구성된다. 환경 담당자나 분석가가 '특정 산업단지에서 어떤 업종 사업장이 폐수배출시설을 바꾸었고, 어떤 오염물질이 어느 농도로 신고됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 사업장명·사업자등록번호(bizregno)·업종코드 같은 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 경기도 내 폐수배출사업장에서 배출 및 폐수배출시설의 변경허가 또는 변경신고를 위해 제출한 신청 내역을 담고 있으며, 해당년도, 사업장명, 업종코드, 산업단지, 신청일, 처리상태, 배출시설분류명, 폐수배출량, 배출량 단위, 방류구 순번 및 배출량, 수질오염물질명, 오염물질 농도, 폐수처리방법 및 처리능력, 비고사항 등 총 44개의 세부 항목으로 구성되어 있습니다. 본 데이터는 폐수배출 시설의 변경 사항에 대한 행정 처리 및 오염물질 관리 현황을 파악하는 데 활용되며, 수질오염 방지 계획 수립, 오염원 추적 및 규제 준수 여부 확인 등에 유용합니다. 특히 수질오염물질별 농도 정보는 지역 수질 개선 정책 수립의 기초자료로 활용될 수 있습니다.
