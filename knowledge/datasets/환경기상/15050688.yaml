description_portal: 해관기상관측자료는 1883년(고종20년)부터 제물포, 부산에 있는 해관에서 정규적으로 관측한 시간, 부착온도, 기압, 온도, 강수량, 바람, 구름, 전운량, 하늘상태, 기사란 등의 연안 기상관측자료의 원부입니다. 이는 우리나라 근대기상 관측이 1904년 부산, 목포, 인천의 기상관측소에서 시작됐다고 알려진 것의 이전 자료입니다.해관(海關)은 관세를 징수하는 것이 주된 임무로 수로 안전을 위한 업무와 연안기상관측 업무를 수행하던 기관을 말합니다.부산 해관의 최초 기록은 1883년 8월 12일입니다.
