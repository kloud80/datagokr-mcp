summary_user: 환경영향평가 대상 사업의 위생공중보건 분야 조사지점(지점명·좌표·주소·조사기간)과 조사 차수별 유해대기물질 측정값(시안화수소·암모니아·황화수소·벤젠·포름알데히드·중금속 등)을 지점 단위로 담고, 범위는 전국이다. 개발사업 예정지 주변 주민이나 분석가가 특정 사업구역 인근의 악취·유해물질 농도가 평가 당시 어느 수준이었는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관의 다른 환경영향평가 항목 데이터와는 조사지점 코드(ivstgGb)나 사업명으로 맞추고, 행정구역·토지이용 자료와는 주소·좌표로 공간 매칭해 잇는다.
description_portal: 환경부 국립환경과학원 환경영향평가 사업의 위생공중보건분야에 조사지점(조사지점명, X좌표,Y좌표, 주소, 조사시작일, 조사종료일) 에 대한 정보 및 조사 속성정보(조사차수, 시안화수소(HCN)(ppm), 스타이렌(C8H8)(ppm),  염화수소(HCL) (ppm), 암모니아(NH₃) (ppm), 황화수소(H2S) (ppm), 벤젠(C6H6) (㎍ /㎥), 수은(Hg) (㎍ /㎥), 니켈(Ni) (㎍ /㎥), 6가크롬(Cr6+) (㎍ /㎥), 카드뮴(Cd) (㎍ /㎥), 비소(As) (㎍ /㎥), 포름알데히드(HCHO )(㎍ /㎥), 염화비닐(VC) (ppm)) 대한 측정한 환경영향평가 위생공중보건분야에 대한 조사 정보를 제공하는 서비스입니다.
