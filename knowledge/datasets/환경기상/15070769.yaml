summary_user: 환경교육사 교육과정을 운영하도록 지정된 전국 양성기관을 기관 한 곳씩 담은 원장 파일로, 기관명·과정급수(3급·2급 등)·지정일·홈페이지·전화·팩스·주소가 들어 있다(CSV 약 1.3KB의 작은 파일). 환경교육사 자격을 따려는 사람이 '내 지역에서 2급 과정을 여는 지정 양성기관은 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소 문자열을 맞춰서만 이을 수 있다.
description_portal: 환경부장관 또는 해양수산부장관은 제19조에 따른 환경교육사 양성기관에서 개설하는 환경교육사 교육과정을 이수한 사람 중 대통령령으로 정하는 자격요건을 갖춘 사람에게 환경교육사의 자격을 부여하고, 자격을 부여받은 사람에게는 환경교육사 자격증을 발급 (구 사회환경교육지도사)하며, 환경부장관은 대통령령으로 정하는 바에 따라 국공립 교육시설, 제15조제1항에 따른 사회환경교육기관 등 환경교육기관을 환경교육사 양성기관으로 지정할 수 있다. 다만, 해양환경 분야에 관하여는 해양수산부장관이 지정할 수 있다. 해당 데이터는 양성기관명, 과정급수(3급 과정, 2급 과정 등), 지정일자, 기관 홈페이지 주소 및 연락처 안내 등을 취급한다.
