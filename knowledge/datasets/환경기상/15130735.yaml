description_portal: '- 전라남도 환경방사선 안전정보시스템의 2024년 도내 주요 38개 측정소의 6월 선량률 현황(매 5분단위, 측정값은 나노시버트)에 대해 조회하실 수 있습니다.- 전라남도 보건환경연구원은 방사선 환경 감시 및 분석을 담당하는 주요 기관입니다. 이 기관은 도내 방사선 환경을 실시간으로 모니터링하고, 정기적인 방사선 수치를 공개하여 도민들의 건강과 안전을 지키고 있습니다.- 전라남도 원자력안전과는 원자력 시설의 안전 관리와 방사선 사고 예방을 담당하는 부서입니다. 이 부서는 원자력 관련 시설의 안전성 점검과 방사선 사고 대응 계획 등을 수립하여 도민들의 안전을 확보하고 있습니다. 이 부서의 홈페이지에서는 원자력 시설의 안전 관리와 관련된 정책 및 정보를 확인하실 수 있습니다.'
