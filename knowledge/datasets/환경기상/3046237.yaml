summary_user: 원주시 안의 석면조사 대상 건축물을 건물(동) 단위로 한 줄씩 담은 파일로, 공공건축물·어린이집 같은 건물 구분과 건물명, 동명, 도로명주소, 연면적을 담는다. 원주시 주민이나 리모델링·철거를 앞둔 건축주와 업체가 "우리 동네 어린이집이나 공공건물 중 석면조사 대상은 어디이고 규모는 얼마인가"를 확인할 때 쓴다. 전역 조인 키나 코드가 없어서 다른 데이터와는 도로명주소나 건물명을 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 강원특별자치도 원주시 내 석면조사 대상 건축물에 대한 현황정보를 제공하는 자료로, 건축물 내 유해물질 관리 및 시민 건강 보호를 위한 석면 안전관리 정책 수립을 목적으로 수집되었습니다.데이터는 건물 구분(공공건축물, 어린이집 등), 건물명, 동명, 도로명 주소, 연면적, 데이터 기준일자로 구성되어 있으며, 지역 내 석면 함유 건축물의 분포 및 규모를 체계적으로 파악할 수 있도록 구축되었습니다.본 자료는 환경부 및 지자체의 석면 안전관리 업무, 리모델링·철거 시 사전조사 대상 파악, 지역사회 건강 영향 평가 등에 활용될 수 있습니다. 특히 공공기관, 교육시설, 병원, 대형 유통시설 등 불특정 다수인이 이용하는 건축물 정보를 포함하고 있어, 지역 내 석면노출 위험도 평가 및 관리 계획 수립에 핵심적인 기초자료로 기능합니다.민간 분야에서는 건축물 관리 시스템 개발, 건설·환경영향 평가업무, 공공 데이터 기반 도시 환경 연구 등에서 폭넓게 활용될 수 있습니다.
