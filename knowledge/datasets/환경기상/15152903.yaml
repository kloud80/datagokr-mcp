description_portal: '유역단위 기후 면적강수량은 홍수 등 수문기상 재해 대응과 물관리 유관기관의 의사결정을 지원하기 위해 생산된 유역단위 면적강수량 자료입니다. 이 데이터는 표준유역, 중권역, 대권역의 면적강수량을 계절별, 연별, 월별, 일별로 각각 제공합니다. 단기 홍수 예·경보 업무까지 폭넓게 활용될 수 있으며 이를 통해 기관들은 유역의 물 공급 관리, 홍수기 대비 계획, 가뭄 위험 평가 등 다양한 분야에서 기초자료로 활용할 수 있습니다. 세부 사항은 기상청 수문기상 가뭄정보 시스템(https://hydro.kma.go.kr)을 참고하여 주시기 바랍니다.- 유역단위: 기후에너지환경부에서 관리하는 "수자원단위지도"에서 구분하는 중권역, 표준유역과 기상청의 KMA대권역이 해당됩니다.'
