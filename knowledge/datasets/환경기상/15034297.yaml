summary_user: 울산광역시 동구에서 음식물류 폐기물을 다량으로 배출하는 사업장을 한 곳씩 담은 건별 목록으로, 상호·사업자등록번호·신고일자·도로명/지번 주소·업소 구분과 급식인원·면적·객실수, 배출량·자가처리량·재활용 계획량을 포함한다. 지자체 담당자나 분석가가 "동구 안에서 음식물 쓰레기를 많이 내는 업소는 어디이고, 그중 자체 처리나 위탁 재활용 계획은 얼마나 되는가"를 확인하는 데 쓴다. 사업자등록번호(bizno)로 사업자 상태 조회나 다른 업소 인허가 데이터와 잇고, 주소로 지도·행정구역 데이터와 겹쳐 본다.
description_portal: 본 데이터는 울산광역시 동구 내에서 음식물류 폐기물을 다량으로 배출하는 사업장에 대한 현황을 정리한 자료이다. 상호명, 주소, 전화번호 등 주요 정보를 포함하고 있으며, 지역 내 폐기물 발생 구조를 파악하고 자원순환 정책 수립에 필요한 기초자료로 활용된다. 해당 데이터는 환경오염 예방과 폐기물 감량 정책의 효율성을 제고하기 위해 개방되며, 연 1회 정기적으로 갱신된다. 데이터는 엑셀 형식으로 제공되어 분석 및 활용이 용이하며, 개인정보는 포함되지 않는다. 공공기관, 연구기관, 시민 등이 자유롭게 열람 가능하며, 환경 행정의 투명성 확보와 지속가능한 지역 관리를 위한 기반 자료로 활용된다.
