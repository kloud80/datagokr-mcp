summary_user: 한국환경공단이 환경소음 자동측정망으로 수집한 일평균 소음도를 측정지점·측정일 단위로 담은 파일 데이터로, 2024-01-01~2024-12-31 전국 144,926행이다. 동네나 용도지역별 소음 수준이 어떤지, 법적 구분에 따라 소음도가 어떻게 다른지 보려는 분석가나 주민이 쓴다. 전역 조인 키가 없어 지역·도시 이름이나 같은 기관 코드를 매핑해 다른 환경 측정 자료와 이어 써야 한다.
description_portal: '소음ㆍ진동관리법에 따라 환경소음 자동측정망을 설치 운영하고있으며 확정된 수치 정보를 제공하고있습니다.소음유형 중 환경소음자동측정망을 통해 전송한 데이터를 지역, 법적구분, 용도구분, 측정일  등의 형태로 제공하는 일평균 데이터입니다.국가소음정보시스템을 통하여 환경소음 자동측정망 측정자료 및 위치정보 일괄 확인이 가능합니다.메뉴경로: 소음진동측정망-측정자료누리집 주소: https://www.noiseinfo.or.kr/noise/data.do'
