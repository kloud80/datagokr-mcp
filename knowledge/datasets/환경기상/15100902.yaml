summary_user: 천안시에서 벙커C유·벙커A유 같은 중질유를 연료로 쓰며 대기배출시설을 신고한 사업장을 한 행에 한 곳씩 담은 목록으로, 사업장명·지번/도로명 소재지·전화번호·대표업종·배출시설 종별·연료 종류를 담는다(CSV 1,446바이트의 소규모 파일). 지역 주민이나 환경 분석가가 '우리 동네 근처에 중질유를 때는 배출 사업장이 어디에 있고 어떤 업종인가'를 확인하거나 배출원 관리 대상을 추리는 데 쓴다. 전역 조인 키나 사업자번호가 없어, 다른 배출시설·대기질 데이터와는 사업장명이나 주소를 맞춰 붙여야 한다.
description_portal: 대기배출가스 시설 신고하는 중질유(벙커C,벙커A 유)를 사용하는 업체 현황(상호, 주소, 전화번호, 생산품, 연료사용량 등) 정보충청남도 천안시 대기배출시설 중질유사용 데이터는 중질유를 연료로 사용하는 사업장을 대상으로 대기오염 배출 현황을 공개한 데이터입니다. 사업자명, 소재지, 도로명소재지는 해당 업체의 위치와 실체를 확인할 수 있는 기본 정보를 제공합니다. 대표업종과 종(대기오염물질 배출시설의 종류)은 사업장의 산업특성과 배출 특성을 파악하는 정보이며, 본 데이터는 대기질 개선 정책 수립, 배출시설 관리 강화, 환경 영향 평가, 오염 저감 대책 마련 등 다양한 환경 행정 업무에 활용될 수 있는 기초 자료입니다.
