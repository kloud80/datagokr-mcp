description_portal: 본 데이터는 해양수산부에서 관리하는 해저퇴적물 방사성물질 분석결과 조사관측자료입니다. 주요 항목으로 전국의 가까운 바다(6km 이내) 해저퇴적물의 세슘134, 세슘137, 플루토늄239+240, 플루토늄240 / 플루토늄239 분석 결과 정보를 포함하고 있습니다. 이 데이터는 해양환경 방사능안전성 평가분석, 수산물 방사능안전관리 업무, 원전주변 해역모니터링 자료, 방사능오염 확산예측 연구, 수산물 안전성 홍보자료 등에 활용할 수 있습니다. 환경연구자, 수산물안전관리 담당자, 양식업종사자 등에서 환경모니터링과 안전관리 업무에 활용할 수 있습니다
