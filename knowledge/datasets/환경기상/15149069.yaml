summary_user: 서울 동작구에서 대기·실내공기·악취·수질·소음진동·빛 공해 측정업무를 대행하는 업소의 인허가 원장으로, 업소 한 곳이 한 행이며 영업상태, 인허가·폐업·휴업 일자, 도로명·지번 주소, 사업장명, 실험실 면적·주소, 중부원점TM 좌표를 담는다. 오염물질 측정을 맡길 업체를 찾는 사업자가 '동작구에서 현재 영업 중인 환경측정대행업체는 어디인가'를 확인하거나, 분석가가 측정대행 업소의 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 좌표(XCRD·YCRD)로 다른 오염원 사업장 위치와 공간적으로 겹쳐 볼 수 있다.
description_portal: '서울시 동작구 환경측정대행업 인허가 정보(https://data.seoul.go.kr/dataList/OA-19546/S/1/datasetView.do)입니다.동작구의 대기오염물질, 다중이용시설 등의 실내공간오염물질, 악취, 수질오염물질, 소음·진동 또는 인공조명에 의한 빛 공해의 측정업무를 대행하는 업소정보를 제공합니다.영업상태명, 도로명주소, 도로명우편번호, 사업장명, 좌표정보 등을 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
