description_portal: 안동시 석면조사대상건축물 데이터는 안동시 관내 석면 함유 가능성이 있는 건축물에 대한 조사 현황을 제공하는 자료입니다. 건축물 명, 소재지, 건축 연도, 건축 용도, 조사 결과, 석면 함유 여부, 관리 상태 등 주요 항목으로 구성되어 있으며, 석면으로 인한 환경 및 건강 피해를 예방하고 안전한 생활 환경을 조성하기 위해 공개됩니다. 본 데이터는 시민, 연구기관, 환경·보건 관련 기관, 건축·시설 관리 기관 등이 석면 관리, 건강 영향 평가, 정책 수립 및 안전 점검을 위한 기초 자료로 활용할 수 있으며, 공공 안전과 환경 관리의 투명성 제고에 기여합니다.
