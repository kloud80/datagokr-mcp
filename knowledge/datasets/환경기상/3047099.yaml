summary_user: 안동시 관내 석면조사 대상 건축물을 건물별로 담은 파일로, 소재지·건축물용도·관리주체·분류·건축연면적·석면건축물 여부·데이터기준일을 기록하며 범위는 안동시 한 곳이고 위치는 개별 주소 단위다. 시민이나 건축·시설 관리자가 '우리 동네 어느 건물이 석면건축물로 분류됐는가'를 확인하거나, 분석가가 용도별 석면건축물 분포를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 소재지 주소를 매칭하거나 같은 기관 자료끼리만 이어 쓴다.
limits: 사업자번호·건물관리번호 같은 공통 키가 없어 건축물대장 등과 붙이려면 주소 정제·매칭이 필요하다. 안동시 한 곳만 담고 있어 다른 시군구와 비교하려면 지역별 파일을 따로 모아야 한다.
