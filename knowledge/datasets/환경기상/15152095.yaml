summary_user: 전국 세분류 토지피복지도를 도엽(지도 한 장) 단위로 나눠, 도엽마다 주거·공업·도로 같은 시가화 지역과 논·밭·과수원, 활엽수림·침엽수림, 습지·갯벌, 하천·호소 등 세분류 항목별 면적을 집계한 통계 파일(csv 약 4.2MB)입니다. 분석가나 환경영향평가 실무자가 특정 도엽 안에 숲·농지·시가지가 각각 얼마나 되는지, 불투수 면적 비중이 어느 정도인지를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고 도엽번호가 유일한 위치 정보이므로, 행정구역이나 필지 데이터와 잇으려면 도엽번호를 도엽 경계(도엽 색인도)와 공간 매핑해야 한다.
description_portal: 환경공간정보서비스에서 제공하는 도엽별 세분류 토지피복 면적 통계자료 입니다.(2022년 제작된 도엽별, 분류항목별 면적 통계)토지피복지도란 주제도(Thematic Map)의 일종으로, 지표면 지형지물의 형태를 일정한 과학적 기준에 따라 분류하여 동질의 특성을 지닌 구역을 Color Indexing 한 후 지도의 형태로 표현한 공간정보 DB를 말합니다.토지피복지도는 지표면의 현상을 가장 잘 반영하기 때문에 지표면의 투수율에 의한 비점오염원 부하량 산정, 비오톱 지도작성에 의한 도시계획, 댐 수문 방류 시 하류지역 수몰피해 시뮬레이션, 기후대기 예측 모델링, 환경영향평가 등에 폭넓게 활용되며, 중앙정부 및 지방정부의 환경정책수립의 과학적 근거로서 위상을 가지고 있고 관련 학계의 다양한 연구자료로 활용되고 있습니다.*EU에서 회원국들의 토지현황에 대한 방대한 정보를 종합적으로 수집 및 관리하기 위해 1985년 유럽환경청(EEA)에서 추진한 전 유럽 토지피복지도 구축사업인 CORINE (Coordination of Information on the Environment)프로젝트에서 개념 정립하였고 이를 기반으로 우리나라 실정에 맞는 분류기준을 확정하여 1998년 환경부에서 최초로 남한지역에 대한 대분류 토지피복지도를 구축하였습니다.
