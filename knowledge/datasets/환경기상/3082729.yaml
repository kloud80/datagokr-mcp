summary_user: 제주특별자치도 안의 자연환경보호구역(습지보호지역·특정도서)을 구역 하나당 한 행으로 담은 소규모 파일(약 1.9KB CSV)이며, 구분·지역(도서명)·위치·면적·지정사유·지정일자·람사르 등록 여부·관련법령을 함께 싣는다. 제주에서 땅을 쓰거나 개발을 검토하는 사업자·분석가가 '이 일대가 습지보호지역이나 특정도서로 지정돼 있는가, 언제 어떤 이유로 지정됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 공간 규제 데이터(상수원보호구역·생태자연도 등)와는 지역명·위치 문자열을 맞춰서만 이어 쓴다.
