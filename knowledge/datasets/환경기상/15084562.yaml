summary_user: 대구광역시 서구에서 파는 쓰레기 종량제봉투, 음식물 쓰레기 배출 스티커, 대형폐기물 처리 스티커의 품목·용량별 판매소 공급가격과 소비자 판매가격을 담은 단가표 파일이다(csv 657바이트의 소규모 표). 서구 주민이 "20리터 종량제봉투나 대형폐기물 스티커를 얼마에 사야 하나"를 확인하거나, 분석가가 판매소 마진과 소비자가를 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 지자체 단가 파일과는 품목명(구분)과 용량을 이름으로 맞춰 비교하고, 같은 서구의 종량제 판매소·대형폐기물 품목 자료와는 기관 기준으로만 함께 본다.
