summary_user: 경기도 보건환경연구원 북부지원이 조사한 한탄강수계(포천시 포천천·금현천·송우천·고모천 등) 하천의 수질을 시료·조사지점 단위로 담으며, 총유기탄소·생물화학적산소요구량·부유물질·총질소·총인·색도 측정값이 들어 있다. 분석가나 주민이 '포천천 어느 지점에서 유기물 오염이나 부영양화 지표(총질소·총인)가 높게 나오는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천·댐 수자원 자료나 다른 수질측정망 자료와는 조사지점명(EXMN_SPOT_PLC)을 이름으로 맞춰 연결해야 한다.
description_portal: 경기도 보건환경연구원 북부지원에서 실시하는 경기북부지역 한탄강수계 수질조사로 건강한 물환경 조성 및 기초자료를 제공합니다.BOD(생물화학적산소요구량, mg/L), TOC(총유기탄소, mg/L), SS(부유물질, mg/L), T-N(총질소, mg/L), T-P(총인, mg/L), 색도(도)이 데이터는 한탄강 수계에 속한 포천시 지역 하천의 수질 상태를 조사한 결과를 담고 있으며, 환경 모니터링 및 수계 오염 관리를 목적으로 활용됩니다. 주요 항목은 기준년도, 기준월, 시료번호, 조사지점명, 전유기탄소(TOC), 생물학적산소요구량(BOD), 부유물질(SS), 총질소(T-N), 총인(T-P), 색도 등이며, 각 항목은 하천의 수질을 평가하는 데 필수적인 수치로 구성되어 있습니다. 측정 지점은 포천천, 금현천, 송우천, 고모천 등 포천시 내 주요 지류와 본류를 포함하며, 각각의 위치는 상세한 주소나 지리적 설명을 통해 명시되어 있습니다. 데이터는 수질 개선 정책 수립, 환경영향 평가, 생태계 보전 등 다양한 환경정책 수립과 평가를 위한 기초자료로 활용될 수 있습니다. 특히 TOC와 BOD는 하천 내 유기물 오염 수준을 평가하는 데 중점적으로 사용되며, T-N과 T-P는 부영양화 가능성을 진단하는 데 중요한 요소입니다.
