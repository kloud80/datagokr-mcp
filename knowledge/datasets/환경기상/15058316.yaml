status: active
summary_user: 공공하수처리시설·폐수처리시설·분뇨처리시설 같은 환경기초시설을 연도별·시설 단위로 한 건씩 담으며, 시설용량·처리공정·운영기관·가동율·재이용량과 읍면동·리까지의 소재지가 들어 있다(전국 12,353건, 실측 날짜 범위 1973-04-03~2013-04-21). 지자체 담당자나 수질 분석가가 '우리 시군구의 하수처리시설 용량과 가동율, 방류수 재이용량은 얼마인가'를 확인하는 데 쓴다. 명세에는 행정구역코드(ADIVICD)와 처리시설코드가 있지만 실측에서 전역 조인 키로 확인되지 않아, 다른 수질 오염원·측정망 데이터와는 시도·시군구·읍면동 이름을 맞추거나 같은 기관 코드로 연결한다.
limits: 검증 호출이 2012~2014년 조건이라 실측 최신 날짜가 2013-04-21로 나왔을 뿐이며, 데이터 자체가 오래됐다고 단정할 수 없다. 전체 12,353건 중 한 번에 1,000행만 받으므로 전량 수집에는 페이지를 13회 이상 반복해야 한다.
