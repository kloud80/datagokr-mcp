description_portal: 물환경보전법 제23조 및 동법 시행규칙 제32조에 의해 매년 시도지사는 관할구역의 오염원 종류, 수질오염원 발생량 등을 조사하며, 생활계, 축산계, 산업계, 양식계, 토지계, 매립계, 환경기초시설, 기타수질오염원 등 총 8개 오염원에 대해 자료를 조사한다. 환경기초시설은 공공하수처리시설, 소규모공공하수처리시설, 공공폐수처리시설, 분뇨처리시설, 가축분뇨공공처리시설, 기타 공공처리시설이 대상이며, 시설의 일반현황 및 총유입량, 관로이송량, 직접이송량, 방류량, 재이용수량 등을 조사한다.
