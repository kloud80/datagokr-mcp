description_portal: 광주광역시 보건환경연구원 토양오염실태조사 결과 정보에 대한 데이터입니다. 토양오염실태조사는 토양환경보전법 제5조 (토양오염도 측정 등), 동법 시행규칙 제3조(토양오염실태조사)에 따라 매년 마다 토양오염이 우려되는 지점을 선정하여 측정합니다.데이터에는 조사지역 종류, 조사지역 명, 주소, 지역구분, 토지지목, 면적, 시료깊이 및 분석 항목의 결과값을 제공합니다. 분석 항목으로는 금속류 8항목(카드뮴, 구리, 비소, 수은, 납, 6가크롬, 아연, 니켈), 일반항목 14항목(불소, 유기인, PCBs, 시안, 페놀류, 벤젠, 톨루엔, 에틸벤젠, 크실렌, 석유계총탄화수소, 트리클로로에틸렌, 테트라클로로에틸렌, 벤조(a)피렌, 1,2-디클로로에탄), 수소이온농도 총 23항목입니다.
