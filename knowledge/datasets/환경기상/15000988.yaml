summary_user: 자동차 배출가스 및 소음 인증서를 건별로 담은 원천 데이터로, 전국 76,145건이 2005-05-18부터 2022-02-11까지 인증일 기준으로 들어 있다. 차량 제작·수입사나 분석가가 특정 차명·자동차형식의 인증번호, 사용연료, 배출가스·소음 허용기준을 확인하는 데 쓴다. 필드에서 전역 조인 키는 확인되지 않아 다른 데이터와는 업체명·차명 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 환경부 국립환경과학원에서 자동차 배출가스 및 소음 인증에 대한 정보를 제공하며, 항목으로는 차종, 배출가스인증일, 배출가스인증번호, 소음인증일, 소음인증번호, 사용연료, 배출가스/소음 구분, 배출가스허용기준, 소음허용기준, 업체명, 차명, 자동차형식의 데이터를 제공합니다.1. 배출가스인증번호 OOO-OO-21-OO은 무공해차(전기차/수소차), OOO-OO-12/13-OO은 저공해차입니다.2. 인증완료 상태의 인증서만 조회가 가능합니다.(인증반납 및 인증취소 차량은 제외됨)3. 전산시스템으로 발급되지 않은 제작차 및 수입차 과거 인증서는 조회되지 않습니다.
