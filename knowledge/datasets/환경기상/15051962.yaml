summary_user: 토양오염이 우려되는 지점(산업단지·공장지역, 폐수유입지역, 금속제련소 주변 등)별로 연도, 지목, 지역, 면적, 시료깊이와 카드뮴·구리·비소·납 등 중금속, 벤젠·TPH·TCE 등 유기오염물질, 다이옥신, pH 측정값을 담은 지점 단위 조사결과 파일이다. 내 지역이나 공장 주변 토양의 중금속·유류 오염도가 어느 수준인지, 연도별로 어떻게 달라졌는지 확인하려는 주민·연구자·환경 분석가가 쓴다. 공통 조인 키(행정코드·좌표 등)가 없으므로 다른 데이터와는 지역명·지점명칭을 이름으로 매핑해 잇는다.
limits: 전역 조인 키가 없어 행정구역 코드나 좌표로 바로 결합할 수 없고, 지역명·지점명 문자열 매칭에 의존해야 한다. 범위는 전국이지만 공간 좌표가 없는 비공간 데이터라 지도 위 정확한 위치 분석에는 쓰기 어렵다.
