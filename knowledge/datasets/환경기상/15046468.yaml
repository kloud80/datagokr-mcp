description_portal: '○ 통계개요* 통계명 : 기상개황* 통계종류 : 기상청에서 제공하는 서울시 기상개황을 제공하는 일반ㆍ보고통계* 근거법령 :「기상법」에 의해 기상청에서 대기의 현상을 관측하여 제공* 작성목적 : 기온, 강수량, 황사 등 주요 지상기상현상의 요소별 연추이 현황을 제공하여효율적인 관리 및 재해예방을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 각 지역의 기상관서 → 기상청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 서울시 기온, 강수량, 일조, 습도, 바람 등의 기상개황○ 용어설명* 강수량 : 00시~24시 중 비 또는 눈이 내린 양* 최심신적설 : 00시~24시 중 새로 내려 쌓여 있는 눈의 최대 깊이* 평균풍속 : 당일의 0시부터 24시까지의, 1일간 풍정을 24시간으로 나눈 값* 최대풍속 : 일중 임의의 10분간 평균풍속 중 가장 센 바람의 풍속* 최대순간풍속 : 일중 순간적으로 가장 세게 불었던 풍속○ 기타* 구체적자료 : 기상청 홈페이지(www.kma.go.kr) > 날씨 > 기후자료 >국내기후자료 > 연월보자료* 평균기온 및 평균습도는 매일 3시, 6시, 9시, 12시, 15시, 18시, 21시, 24시의 8회관측치를 산술평균한 값* 운량(0.0~10.0)은 강수현상과 관계없는 구름의 양 : 맑음(0~2), 구름조금(3~5),구름많음(6~7), 흐림(8이상)○ 출 처 : 기상청 기상자원과'
