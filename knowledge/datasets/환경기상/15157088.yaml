summary_user: 환경영향평가 대상 사업별로 악취 조사지점(지점명·주소·좌표)과 조사차수·조사기간, 복합악취와 암모니아·황화수소·메틸메르캅탄 등 지정악취물질 측정값을 건별로 담고, 운영 시 예측 배출량과 조사지점 SHP 공간파일을 함께 제공하는 전국 범위 파일(zip 약 6MB)이다. 개발사업 인근 주민이나 분석가가 '이 사업 예정지 주변의 평가 당시 악취 수준은 어땠고 운영 후 배출은 얼마로 예측됐나'를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 사업코드(BSNS_CD)로 같은 기관의 다른 환경영향평가 항목별 정보와 묶거나 좌표·주소로 사업구역·토지이용 자료와 공간 매칭해 이어 쓴다.
description_portal: 환경부 국립환경과학원의 환경영향평가 사업 중 악취 분야에 대한 조사 및 예측 속성정보와 조사지점에 대한 공간정보를 제공하는 서비스입니다. 조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 악취 정보(복합악취, 암모니아, 메틸메르캅탄, 황화수소, 다이메틸설파이드, 다이메틸다이설파이드 등)를 포함하며, 예측속성은 운영 시 발생하는 복합악취, 암모니아, 메틸메르캅탄 등의 배출량 정보를 제공합니다. 조사지점에 대한 공간정보는 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.
