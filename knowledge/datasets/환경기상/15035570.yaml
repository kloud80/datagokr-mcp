summary_user: 광주 서구 관내에서 신고된 석면 해체·제거 작업을 작업 1건당 한 행으로 담은 건별 원천 파일로, 작업신고번호·공사현장명·공사위치(주소)·건물설비명·해체 시작/종료일·석면 종류·석면함유자재 면적(제곱미터)을 담는다. 주민이 우리 동네 근처에서 언제 어떤 석면 해체 공사가 진행되는지 확인하거나, 분석가가 연도별 해체 면적과 공사가 집중된 지역을 파악하는 데 쓴다. 전역 조인 키는 없어 공사위치 주소를 지오코딩하거나 다른 시군구의 같은 석면해체 현황 파일과 항목 이름을 맞춰 이어 쓴다.
description_portal: 이 데이터는 광주광역시 서구 관내에서 시행된 석면 해체·제거 작업에 대한 상세 현황을 제공하는 자료입니다. 각 작업에 대해 연번, 작업신고번호, 공사현장명, 공사위치, 건물설비명,  해체시작년월일, 해체종료년월일, 종류명, 석면함유자재면적 등의 항목이 포함되어 있습니다. 해당 정보는 석면 해체·제거 사업의 이력 관리, 위험 물질 관리, 환경안전 정책 수립, 건축물 해체 허가 심사 등 다양한 분야에서 참고 자료로 활용될 수 있습니다. 연도별 작업 누적 현황 분석이나 고위험 지역 파악 등에도 유의미한 기초 자료로 활용됩니다.
