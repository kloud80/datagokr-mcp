summary_user: 해역이용협의 평가를 대행하는 등록 업체를 한 건씩 담은 목록으로, 등록번호·등록일·업체명·대표자·사무실과 평가부서의 주소·전화번호·관할 지방해양수산청을 전국 범위로 담는다. 해역이용 개발사업을 준비하는 사업자나 담당자가 '우리 관할 지방청에 등록된 평가대행 업체는 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 환경영향평가·협의 데이터와는 업체명이나 관할 지방청명(instNm) 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 해양수산부에서 해역이용협의 평가대행자의 관련 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해역이용평가대행자 등록번호, 평가대행자 등록일, 평가대행업체명, 대표자명, 사무실주소, 평가부서주소, 사무실전화번호, 평가부서전화번호, 관할해양지방수산청명 등으로 구성되어 있습니다. 본 데이터는 해역이용협의 평가와 관련된 대행 업체 현황을 파악하거나, 신규 사업 추진 시 평가대행자 선정과 관련된 참고자료로 활용될 수 있습니다. 또한 사업 관계자는 사업 진행 과정에서 평가대행자와의 연락, 협의가 필요한 경우 신속한 정보 확인과 행정절차 지원 자료로도 활용할 수 있습니다.
