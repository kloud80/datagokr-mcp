summary_user: 대구광역시 관내에서 폐합성수지(플라스틱류)를 취급해 재활용하는 업체(중간재활용·종합재활용)를 업체 한 곳당 한 행으로 담은 원장 파일로, 구군·재활용업 허가 구분·업체명·소재지·영업대상폐기물을 기록한다. 플라스틱 폐기물을 맡길 재활용 업체를 찾는 배출 사업자나, 대구 구군별로 재생플라스틱 처리 업체가 어디에 몰려 있는지 보려는 분석가가 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어서, 다른 폐기물 처리업 허가 자료와는 업체명·소재지 주소를 맞춰 보거나 구군 이름으로 묶어 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되므로 업체명 표기 차이에 주의해야 한다. 업체 현황 원장일 뿐 플라스틱 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다.
