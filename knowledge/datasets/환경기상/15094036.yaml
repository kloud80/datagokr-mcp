summary_user: 경기도 가평군에서 신청된 대형 생활폐기물 수거 건을 신청 단위로 담은 파일로, 신청접수일자·구분·품목·규격·수량·진행상태·신청방법이 들어 있다(CSV 약 5MB). 주민이나 분석가가 가평군에서 어떤 가구·가전 품목이 언제 얼마나 배출 신청되고 수거가 어디까지 진행됐는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 지자체의 대형폐기물 파일과는 품목명·규격명 같은 이름을 맞춰 붙이거나 기관 단위로만 연결한다.
description_portal: 해당 데이터는 경기도 가평군 관내에서 발생한 대형 생활폐기물의 수거 현황을 정리한 데이터입니다. 항목에는 신청접수일자, 구분명, 품목명, 규격명, 수량, 진행내용, 신청방법내용, 관리기관명, 전화번호, 데이터기준일자가 포함됩니다. 폐가전제품이나 가구 등 일반 쓰레기로 배출이 어려운 품목의 처리 절차를 확인할 수 있으며, 수거 신청부터 처리까지의 과정을 기록하여 행정의 투명성과 효율성을 높이는 데 목적이 있습니다. 배출은 사전 신고 및 수수료 납부가 필요하며, 가평군 대형폐기물 배출신고 사이트(https://clean.gp.go.kr/bigWeb/main/viewMain.do)에서 신청할 수 있습니다. 본 자료는 자원 순환과 생활폐기물 관리, 주민 편의 향상을 위한 행정자료로 활용됩니다.
