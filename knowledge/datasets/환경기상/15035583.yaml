description_portal: 서울특별시 영등포구 내 건물 옥상 녹화사업이 추진되었거나 완료된 시설물의 상세 현황을 기록한 데이터셋입니다. 이 정보는 도시 열섬 현상 완화, 에너지 효율 개선, 대기질 정화 등 도시 환경 개선을 위한 녹색 인프라 구축 현황을 파악하는 데 중요한 자료로 활용됩니다.데이터셋의 핵심 속성은 녹화가 이루어진 연도와 해당 대상지의 명칭입니다. 또한, 시설물의 정확한 위치를 파악할 수 있는 주소(위치) 정보와 녹화 규모를 나타내는 면적($m^2$ 등) 정보가 포함되어 있습니다.특히, 녹화 사업의 주체를 구분하는 비고(민간, 공공) 속성이 기록되어 있어, 공공 부문과 민간 부문의 환경 개선 참여 현황을 비교 분석할 수 있습니다. 이 데이터는 영등포구의 친환경 도시 조성 정책 성과를 평가하고, 향후 도시 녹화 사업의 확대 및 예산 배분 계획을 수립하는 데 필수적인 근거 자료를 제공합니다.
