summary_user: 환경책임보험 대상 사업장을 한 행에 하나씩 담은 전국 단위 건별 원장(CSV 약 3.5MB)으로, 행정구역코드·지번/도로명 주소와 함께 보험가입·계약상태, 의무가입 대상 여부, 휴업·폐업·미가동 일자, 정보승인 상태를 기록한다. 지자체 담당자나 환경 분석가가 '우리 지역의 의무가입 대상 사업장 가운데 보험 미가입이거나 휴·폐업한 곳이 얼마나 되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 행정구역코드로 지역별로 집계하거나, 주소를 기준으로 같은 기관의 오염원·화학물질 사업장 데이터와 맞춰 이어 쓴다.
description_portal: 환경책임보험의 책임보험 사업장 정보는 보험 가입 사업장의 행정적, 운영적, 보험적 현황을 체계적으로 관리하기 위해 구성됩니다. 각 사업장은 행정구역코드를 통해 지역을 구분하고, 보험가입코드, 기업규모코드, 매체시설규모코드 등으로 사업장의 특성과 규모를 파악합니다. 사업장의 위치는 지번주소와 도로명주소로 기록됩니다.사업장의 운영 상태는 상태코드와 상태일자를 통해 관리되며, 더 이상 관리 대상이 아닌 경우 삭제여부로 표시됩니다. 보험과 관련해서는 책임보험적용일자, 책임임의구분코드, 보험계약상태코드, 의무가입대상여부, 책임계약보장계약구분코드 등 다양한 항목을 통해 사업장이 책임보험에 어떻게 적용되는지와 그 계약적 지위를 명확히 구분합니다.사업장의 운영 중단이나 종료와 관련해서는 휴업시작일자, 휴업종료일자, 폐업일자가 기록되며, 안전 관리 차원에서 위해성방지조치여부도 포함됩니다. 통계 관리 목적에 따라 통계미포함구분이 구분되며, 사업장이 가동되지 않는 경우는 미가동시작일자와 미가동종료일자로 관리됩니다. 또한 실제 사업장이 설치되었는지 여부는 사업장설치여부로 확인됩니다.정보의 신뢰성과 검증을 위해 정보승인상태코드와 정보승인일자가 기록되며 사실관계 검증을 위한 사실확인여부도 포함됩니다. 의무가입 대상이 아닌 사업장이나 미가입 사업장은 미가입사업장제외여부 및 미가입사업장제외종료일자를 통해 별도로 관리됩니다.
