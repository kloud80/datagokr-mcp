summary_user: 광주 서구 관내에서 사업장폐기물을 배출하는 사업체의 신고 내역을 사업장 한 곳씩 담은 원천 목록으로, 폐기물 구분·종류, 처리방법, 도로명 주소, 신고기준연도를 담는다. 사업자나 주민이 '우리 동네 어느 업체가 어떤 폐기물을 내고 어떻게 처리하는가'를 확인하거나, 분석가가 서구의 업종별 배출 사업장 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 광주광역시 서구 관내에서 사업장폐기물을 배출하는 사업체의 신고 현황을 정리한 자료로, 폐기물 구분, 업체명, 폐기물 종류, 연락처, 처리방법, 도로명 주소, 신고기준연도 등의 항목으로 구성되어 있습니다.해당 자료는 「폐기물관리법 제17조 및 시행규칙 제18조」에 따라 수집된 것으로, 지자체의 폐기물 행정 관리, 불법 투기 예방, 폐기물 처리 정책 수립, 환경영향 평가 기반 마련 등 다양한 환경정책 수립에 활용됩니다.또한 폐기물 종류 및 처리방식 등의 정보가 포함되어 있어 재활용률 분석, 산업별 배출 특성 연구, 지속가능한 자원 순환 전략 수립에도 유용한 기초자료입니다.데이터는 연 1회 정기적으로 갱신되며, 공공저작물로 자유롭게 활용할 수 있습니다.
