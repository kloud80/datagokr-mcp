summary_user: 경주국립공원 안에서 조사된 생물종 출현 기록을 담은 CSV 파일로, 한 행마다 생물분류(포유류·조류·곤충·식물 등), 종명·학명, 조사 위치와 경도·위도, 조사일자, 개체수를 담는다. 생태 분석가나 공원 관리자가 '경주국립공원 어디에서 어떤 종이 언제 몇 개체 관찰됐는가'를 확인하고 종 분포 지도나 보전 계획의 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학명·종명 같은 이름 매핑이나 경도·위도 좌표를 이용한 공간 중첩으로 잇는다.
