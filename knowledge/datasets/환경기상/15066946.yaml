summary_user: 유전자변형생물체(LMO) 제품별로 분류, 제품명, 신청자, 특성과 농업용·식품용·산업용·보건용 용도별 승인 여부를 한 행씩 담은 전국 단위 비공간 목록 파일(xlsx)이다. 소비자나 연구자가 특정 LMO 작물이 국내에서 식품용이나 농업용으로 승인됐는지, 누가 신청했는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 제품명·신청자 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: '이 데이터는 유전자변형생물체(LMO: Living Modified Organisms)의 환경 위해성 심사를 위해 제출된 정보를 바탕으로, 각 LMO의 특성과 환경 위해성 정보, 심사현황, 용도별 승인내역 등을 체계적으로 제공하는 자료입니다. 또한 국내외에서 보도된 LMO 관련 주요 뉴스, 정책 동향, 용어 해설 정보 등도 포함되어 있어 LMO에 대한 종합적인 이해를 도와줍니다. 이 데이터는 생물다양성 보전 및 생명공학기술의 안전한 활용을 위한 정책 수립, 학술 연구, 행정적 심사 대응에 활용되며, 국민의 알권리를 충족시키고 과학기술과 환경 사이의 균형을 도모하는 중요한 자료입니다. 특히 환경위해성 평가 기반의 정책 판단과 LMO의 수입·재배·이용 승인 절차의 투명성 확보에 기여할 수 있습니다.'
