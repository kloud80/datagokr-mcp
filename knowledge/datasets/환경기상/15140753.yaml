summary_user: 서울 은평구에서 쓰레기 종량제 봉투를 팔도록 지정된 업소를 한 곳당 한 행으로 담은 인허가 원천 목록으로, 상호명·지번/도로명 주소·지정일·영업상태·폐업일·중부원점TM 좌표(XCRD, YCRD)를 포함한다. 은평구 주민이 "우리 동네 어디서 종량제 봉투를 살 수 있나"를 찾거나, 분석가가 판매소의 지역별 분포와 신규 지정·폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·상호명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 다른 지자체의 종량제 판매소 파일과 나란히 놓아 비교한다.
description_portal: '은평구의 시군구의 조례에 따라 정의되는 쓰레기종량제봉투의 판매가능한 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 쓰레기 종량제 봉투를 판매하도록 지정된 업소들의 인허가 현황을 담고 있습니다. 데이터에는 각 판매소의 상호명, 소재지 주소, 최초 지정일, 현재 영업 상태(영업중, 폐업 등), 그리고 폐업일자와 같은 핵심 정보가 포함되어 있습니다 .이 데이터를 통해 은평구 주민들이 생활 필수품인 종량제 봉투를 어디서 구매할 수 있는지 구체적인 판매처 정보를 파악할 수 있습니다. 또한, 주소 정보를 기반으로 판매소들의 지리적 분포를 분석하여 특정 지역에 판매소가 부족하거나 과도하게 밀집된 곳은 없는지 등 주민 접근성과 편의성을 평가하는 데 활용할 수 있습니다. 시계열 분석을 통해 신규 지정 및 지정 취소 업소 현황을 파악하면, 지역 내 상권 변화나 인구 이동 같은 사회적 변동을 간접적으로 추론하는 것도 가능합니다. 이는 주민 편의 증진을 위한 판매소 재배치나 추가 지정 등 관련 정책을 수립하는 데 있어 중요한 기초 자료로 활용될 수 있는 높은 가치를 지닌 데이터입니다.'
