summary_user: 환경영향평가 사업별 대기질 조사지점의 지점명·주소·좌표·조사 차수와 기간, 미세먼지(PM-10·PM-2.5)·이산화질소·아황산가스·중금속·다이옥신 등 측정값, 공사시·운영시 예측 평균농도를 지점·조사차수 단위로 담은 전국 범위 파일(zip)이다. 개발사업 주변 주민이나 분석가가 "우리 동네 인근 개발사업의 공사 중 미세먼지 예측 농도는 어느 정도인가"를 확인하거나 사업별 대기 영향을 비교하는 데 쓴다. 전역 조인 키는 없어 사업코드로 같은 기관의 환경영향평가 협의 현황·사업구역 데이터와 맞추거나 주소·좌표로 토지이용규제·개발사업 정보와 공간적으로 이어 쓴다.
description_portal: 환경부 환경영향평가 사업의 조사지점을 기준으로 조사된 대기질 속성 조회정보(조사지점명, 주소, 좌표, 조사정보, 공사시/운영시 평군정보 등)와 사업구역 연돌을 기준으로 연돌에서 조사된 대기질 속성 정보(연돌명, 주소, 좌표, 연돌높이 등) 그리고 사업구역을 기준으로 예측된 대기질 속성 조회정보(공사시/운영시 미세먼지, 이산화질소 등의 배출(발생)량)를 제공하며 공간좌표를 기준으로 대기질 연돌위치의 피쳐 정보, 대기질 연돌위치의 포인트 이미지, 대기질 조사지점의 피쳐 정보 대기질 조사지점의 포인트 정보를 제공하는 서비스입니다.
