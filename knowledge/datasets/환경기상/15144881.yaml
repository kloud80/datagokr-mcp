description_portal: 본 데이터는 경기도 광주시청에서 관리하는 야생생물보호구역 현황 자료입니다. 주요 제공 항목은 명칭, 지정연도, 소재지주소, 면적(제곱미터), 데이터기준일자로 구성되어 있으며, 광주시 내에서 보호가 필요한 야생생물의 서식지 지정과 관련된 정보를 수록하고 있습니다. 해당 데이터는 「야생생물 보호 및 관리에 관한 법률」에 따라 지정된 야생생물 서식지의 공간적 분포 현황과 보호구역의 지정 연도 및 각 구역의 면적 자료를 투명하게 공개하여, 자연생태계 보호정책 수립과 환경보전업무의 신뢰성을 높이는 데 기여합니다.
