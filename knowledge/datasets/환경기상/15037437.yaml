description_portal: '경기도 평택시 내 유해 화학물질 취급 사업장 현황으로 업체명, 소재지도로명주소, 소재지지번주소, 업종명 등의 정보를 제공합니다.유해화학물질 취급 사업장은 유해화학물질을 제조, 수입, 판매, 보관ㆍ저장, 운반 또는 사용하는 모든 사업장을 말합니다. 특히, 법으로 정한 기준 이상의 유해화학물질을 취급하는 사업장 내 취급시설은 주요취급시설로 분류됩니다. 유해화학물질의 누출, 유출 등으로 인한 피해를 예방하기 위해 사고 예방 조치 수립 등에 활용될 수 있습니다. 1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 환경지도과(031-8024-3777)'
