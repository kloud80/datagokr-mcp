summary_user: 경상남도 함양군 관내 특정토양오염관리대상시설(석유류·유해화학물질 제조·저장시설, 송유관 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·도로명/지번 주소·전화번호·데이터기준일자를 담는다. 함양군에서 토지를 사거나 개발하려는 사람이나 환경 분석가가 대상 필지 주변에 주유소·유류 저장시설처럼 토양오염 우려 시설이 있는지 확인하는 데 쓴다. 전역 조인 키나 코드 필드는 없으므로, 다른 데이터와는 소재지 주소(지번·도로명)를 지오코딩하거나 주소 문자열로 맞춰 필지·공간 규제 레이어와 겹쳐 본다.
description_portal: 경상남도 함양군 관내 소재 특정 토양오염 관리대상 시설 현황으로 순번, 시설명, 소재지도로명주소, 소재지지번주소, 전화번호, 데이터기준일자로 구성되어 있습니다. 토양환경보전법 제2조의 4에서 정의하고 있는 특정토양오염관리대상시설은 토양을 현저하게 오염시킬 우려가 있는 토양오염관리대상시설로서 환경부령으로 정하는 것을 말하며, 1, 석유류의 제조 및 저장시설, 2. 유해화학물질의 제조 및 저장시설, 3. 송유관시설, 4. 기타 위 관리대상시설과 유사한 시설로서 특별히 관리할 필요가 있다고 인정되어 환경부장관이 관계중앙행정기관의 장과 협의하여 고시하는 시설로서 총 55개 시설을 제공합니다.
