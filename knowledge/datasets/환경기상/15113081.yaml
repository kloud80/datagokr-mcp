summary_user: 대전광역시 서구에 등록된 소음·진동 배출시설을 업소 한 곳당 한 행으로 담은 건별 목록으로, 업소명·지번/도로명 주소·행정동·법정동·업종명·위도·경도·데이터 기준일자를 포함한다(CSV 약 1KB 규모의 소량 파일). 주민이나 구청 담당자가 '우리 동네 주변에 어떤 업종의 소음·진동 배출시설이 어디에 있는가'를 확인하거나 민원 대응·지도점검 대상을 지도에 표시할 때 쓴다. 법정동코드(bjd_cd)로 법정동 단위 통계·경계 자료와 이어 쓰고, 위도·경도로 주거지·학교 등 다른 위치 자료와 거리 기반으로 결합한다.
description_portal: 대전광역시 서구 소음·진동 배출시설 등록현황 데이터는 지역 내 환경오염 관리와 생활환경 보전을 위해 관리되고 있는 배출시설의 기본 정보를 체계적으로 정리한 자료입니다.해당 데이터에는 업소명, 지번·도로명 주소, 행정동·법정동 정보, 업종 종류, 위도·경도 좌표, 데이터 기준일자 등이 포함되어 있어, 각 시설의 위치적 분포와 산업 유형을 한눈에 파악할 수 있습니다.이 자료는 소음·진동 민원 대응, 배출시설 지도·점검, 환경영향 분석, 특정 지역의 환경 취약성 평가 등 행정 및 연구 목적에서 활용도가 높습니다. 또한 도시계획 수립이나 인구·주거지와의 거리 검토 등 환경정책의 기반자료로도 의미가 큽니다.
