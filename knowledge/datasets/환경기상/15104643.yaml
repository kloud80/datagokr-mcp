summary_user: 전국의 지하수 개발·이용 관정을 한 건씩 담은 원장 파일로, 허가·신고 번호와 형태, 시도부터 번지까지의 소재지, 용도·세부용도, 공공·사설 구분, 음용 여부, 굴착 심도·직경, 펌프 마력, 양수능력, 토출관 직경을 담는다. 지자체 담당자나 분석가가 특정 시군구에 음용 관정이나 농업용 관정이 얼마나 있고 얼마나 깊게 굴착됐는지 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시도명·시군구명·읍면동 같은 주소 이름을 맞춰 행정구역 단위로 붙이거나, 같은 기관의 지하수 수위·수질 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 지하수 개발 이용시설의 정보를 제공합니다. 해당 자료는 허가신고형태코드, 주소, 지하수용도코드, 지하수세부용도코드, 지하수음용여부, 굴착심도, 굴착직경, 설치심도, 소요수량, 취수계획량, 양수능력, 동력장치마력, 토출관직경 등의 정보를 포함하고 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
