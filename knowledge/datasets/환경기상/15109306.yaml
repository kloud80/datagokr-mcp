summary_user: 충청남도 서산시에서 유해야생동물을 포획한 건별 기록으로, 포획일자·보고일자, 개체 종류, 포획유형, 포획지 시군·상세주소와 위도·경도, 포획개체수, 지역유형을 담은 CSV 파일(약 26KB)이다. 서산시 농업인이나 지자체 담당자, 분석가가 어느 읍면·계절에 멧돼지·고라니 같은 종의 포획이 몰리는지 파악할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 데이터와는 포획지 주소의 시군 이름을 맞추거나 위도·경도 좌표를 공간 결합해 잇는다.
description_portal: 이 데이터는 충청남도 서산시에서 집계된 유해야생동물 포획 현황을 담고 있는 행정자료입니다. 주요 항목에는 포획일자, 동물 종명(멧돼지·고라니·까치 등), 포획 장소, 포획 사유(농작물 피해, 인명 피해 우려, 서식지 확장 등), 포획 방법(총기·덫·포획틀 등), 처리 결과(폐사·방생·관리 이관 등), 담당 기관 등이 포함됩니다. 이를 통해 서산시에서 어떤 종의 유해야생동물이 많이 포획되는지, 주된 포획 이유와 계절별·지역별 발생 패턴을 분석할 수 있습니다. 예를 들어 농경지가 많은 지역에서는 멧돼지나 고라니의 포획 건수가 집중될 수 있으며, 도심과 가까운 지역에서는 까치와 같은 조류 포획 사례가 상대적으로 많을 수 있습니다. 또한 포획 후 처리 결과 데이터를 통해 방생률과 폐사율 비교가 가능해, 지역 내 유해야생동물 관리 정책의 성과와 보완점을 평가할 수 있습니다. 이 자료는 서산시와 충청남도의 농작물 피해 예방, 인명 피해 방지, 서식지 관리, 생태계 균형 유지 정책 수립에 중요한 기초자료로 활용됩니다.
