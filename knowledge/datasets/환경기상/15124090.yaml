summary_user: 경기도 광주시에 있는 아스콘(아스팔트 콘크리트) 제조업체를 업체별 한 행으로 담은 파일로, 업체명과 공장 소재지 주소를 담는다(파일 크기 164바이트의 소규모 목록). 도로 포장 공사를 발주하거나 시공하는 사업자가 광주시 안에서 아스콘을 받을 수 있는 공장이 어디에 있는지 확인하는 데 쓴다. 전역 조인 키나 코드값은 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시의 아스콘 제조업체 현황 정보를 제공합니다. 도로 포장에 사용되는 아스팔트 콘크리트(아스콘)를 생산하는 업체의 위치 정보를 담고 있습니다. 업체명은 아스콘 제조 사업체의 명칭이며, 소재지는 공장이 위치한 주소를 제공합니다. 본 데이터는 건설 자재 공급 관리, 도로 공사 계획, 아스콘 수급 조절, 건설 산업 지원, 환경 관리 감독 등에 활용되며 원활한 도로 건설 사업 추진과 건설 자재 수급 안정화를 지원합니다. 도로 포장 공사 발주 시 자재 공급처 확인과 운송 거리 최적화에도 활용됩니다.
