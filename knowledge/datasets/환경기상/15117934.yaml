description_portal: '<한국가스공사 녹색제품 구매실적>경부경영평가 "사회적 책임" 지표 중 친환경 탄소중립 부분에 해당하는 항목 중 녹색구매 관련 실적에 대한 데이터입니다.- 연간 실적은 2020년부터 2023년 8월까지 한국가스공사 녹색제품 구매 실적 입니다.- 연간 녹색제품 구매실적 및 총구매액 대비 녹색제품 구매액(~20년), 이행계획대비 증감분(21년~) 정보 입니다.- 녹색제품 : 환경표지인증제품, 저탄소제품, 우수재활용인증제품본 데이터를 활용하면 한국가스공사의 녹색제품 구매 동향과 목표 달성률을 종합적으로 파악할 수 있습니다. 이를 통해 녹색제품 제조기업의 공공조달 시장 진출 전략 수립, 환경친화적 제품 개발 방향 설정, 공공기관 녹색구매 정책 효과 분석에 참고자료로 활용할 수 있으며, ESG 경영 연구, 환경 정책 수립, 탄소중립 이행 현황 분석, 친환경 조달 정책 연구에도 유용한 기초자료가 됩니다.'
