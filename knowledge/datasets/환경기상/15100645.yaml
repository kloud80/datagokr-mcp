summary_user: 진주시 대기배출시설 사업장 가운데 중질유(벙커유)를 쓰는 업체를 업체 한 곳당 한 행으로 담은 소규모 원천 목록(CSV 약 1KB)으로, 업체명·주소·사용연료·시설용량 및 개수·전화번호·기준일을 담는다. 환경 담당자나 지역 주민이 '진주시에서 벙커유를 쓰는 대기배출 사업장이 어디에 몇 곳 있고 시설 규모는 어떤가'를 확인하거나 기름 유출·대기오염 관리 대상을 점검하는 데 쓴다. 전역 조인 키(사업자번호·코드)가 없어 다른 배출시설·인허가 데이터와는 업체명이나 주소를 맞춰 잇는 방식으로만 연결한다.
limits: 사업자번호나 표준 코드가 없어 다른 사업장 데이터와 정확히 조인하기 어렵고, 업체명·주소 매칭에 의존한다. 범위는 진주시 한 곳에 한정된다.
