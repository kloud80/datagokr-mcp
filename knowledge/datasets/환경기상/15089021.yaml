description_portal: 대구광역시 서구 자체의 대기정보시스템에서 수집한 오염원의 구역별/월별 데이터로,  서구 관내의 20개 측정지역의 데이터입니다.본 데이터는 대구광역시 서구 관내 주요 악취 민원 발생지역 및 산업단지 주변 지점에서 측정된 오염물질별 대기농도 자료를 정리한 것이다. 구역별로 암모니아, 황화수소, 총휘발성유기화합물(TVOC)의 농도를 ppm 단위로 측정하였으며, 지점별 측정값을 구분하여 기록하였다. 측정 항목은 각각 기준치와 함께 병기되어 있으며, 정기적인 대기질 관리와 환경 민원 대응을 위한 기초자료로 활용된다. 해당 자료는 대기질 평가, 환경정책 수립, 오염원 추적 등에 필요한 정보로 구성되어 있으며, 이용자가 이해하기 쉽도록 측정 지점, 항목, 수치를 체계적으로 배열하였다. 본 자료는 환경관리 및 도시정책 수립의 과학적 근거자료로 제공된다.
