summary_user: 경기도에서 보호수로 지정된 나무를 한 건씩 담은 원천 목록으로, 지정번호·지정일, 수종과 과명·학명, 수령·수고·흉고둘레·수관폭, 품격, 소유 구분, 소재지 주소와 위경도를 담는다. 토지 소유자나 개발 사업자가 '우리 필지나 사업 부지 근처에 보호수가 있는지, 몇 년생 어떤 나무인지'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시군 코드(SIGUN_CD)로 같은 경기도 데이터와 잇거나 지번·도로명 주소와 위경도로 필지·공간 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내에서 보호가 필요한 동식물 및 보호수로 지정된 개체들의 현황 정보를 제공합니다. 보호수 및 보호 동식물은 생태적 가치, 희귀성, 학술적 중요성 등을 이유로 지정되며, 천연기념물이나 멸종위기종 등으로 분류되기도 합니다. 데이터에는 지정된 종의 종류, 위치, 보호 사유 등 관련 정보가 포함됩니다. 이 자료는 환경 보전 정책 수립, 자연유산 보호, 생물다양성 연구, 환경영향평가 등에 활용될 수 있으며, 지역별 생태환경 관리와 보호 대책 마련에 기초자료로 활용됩니다. 데이터를 활용할 때는 보호대상 종의 변화와 지정 해제 여부 등을 함께 고려하는 것이 필요합니다.
