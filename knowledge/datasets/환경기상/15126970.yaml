summary_user: 대전광역시 서구에 설치된 폐건전지 수거함을 한 곳당 한 행으로 담은 위치 목록으로, 위치명·지번주소·도로명주소를 담는다(csv 약 2KB 규모). 서구 주민이 "집 근처 어느 행정복지센터나 도서관에 폐건전지 수거함이 있나"를 찾거나, 구 담당자가 수거함 배치 현황을 점검할 때 쓴다. 전역 조인 키나 좌표는 없어 다른 데이터와는 주소를 지오코딩하거나 위치명으로 맞춰 이어 쓰며, 다른 지자체의 수거함·재활용 정거장 파일과 나란히 놓아 비교한다.
description_portal: 대전광역시 서구 폐건전지 수거함 현황 데이터는 지역 내 생활폐기물 중 특히 유해성 물질을 포함한 폐건전지를 안전하게 회수·관리하기 위해 구축된 위치 기반 정보입니다.이 데이터에는 설치 위치명, 지번주소, 도로명주소가 포함되어 있어, 주민들이 가까운 수거함을 쉽게 찾을 수 있으며, 행정에서는 설치지점별 관리상태를 체계적으로 파악할 수 있습니다.위치명은 주로 행정복지센터, 주민자치센터, 도서관, 공공청사, 학교, 공동주택 관리사무소 등 주민 접근성이 높은 시설을 중심으로 구성되며, 지번주소와 도로명주소는 정확한 현장 확인 및 지도기반 위치 분석을 지원합니다.이 자료는 폐건전지의 회수율 향상, 환경오염 예방, 재활용 자원 관리체계 구축 등 다양한 정책적 활용이 가능하며, 향후 수거함 확충·관리 효율화에도 중요한 기반자료로 활용됩니다.
