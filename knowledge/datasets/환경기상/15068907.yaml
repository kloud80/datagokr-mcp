summary_user: 한국남동발전 영흥화력에서 2024년 1월부터 12월까지 반출된 폐기물(석탄재, 폐콘크리트, 폐합성수지류, 무기성 오니 등)의 인계 실적을 계량 건별로 담은 파일이며, 계량일자, 1·2차 계량시간과 중량, 실중량, 운송업체, 처리업체를 기록한다. 발전소 부산물이 어느 처리업체로 얼마나 넘어가 재활용·처리되는지 확인하려는 분석가나, 석탄재 등 발전 부산물의 수거·재활용 거래처를 찾는 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운송업체명·처리업체명 같은 이름 매칭으로만 폐기물 처리업 허가 원장 등에 연결한다.
description_portal: 한국남동발전의 폐기물 인계 실적 정보입니다.2024년 1월부터 12월까지 영흥화력의 폐기물 실적을 확인할 수 있으며, 연계업체, 배출업체 , 폐기물, 인계량, 운반업체, 처리업체, 인계일자, 처리장소의 정보를 포함하고 있습니다.주요 제품으로는 석탄재, 폐콘크리트(건설), 폐합성수지류(폐염화비닐수지류 제외), 무기성 오니 등이 존재하며, 처리업체 정보를 통해 발전소 부산물이 재활용되는 또는 처리되는 자원순환 과정을 파악할 수 있습니다. 이를 통해 발전소의 폐기물 관리 및 재활용 현황을 확인할 수 있습니다.
