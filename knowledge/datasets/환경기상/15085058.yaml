description_portal: '서울시민의 환경오염방지를 위한 노력 정도를 백분율로 제공합니다. 2010년도 이후 통계자료입니다.* 녹색제품에는 에너지·자원의 투입과 온실가스 및 오염물질의 발생을 최소화하는 친환경상품으로 환경표지(마크)제품, 우수재활용(GR)제품, 에너지 절약마크 인증제품 등이 포함* 환경 및 자연보호 운동(활동)에는 대국민 홍보 활동, 환경파괴 사업 저지 운동 등 적극적 참여만 포함되며, 산과 공원 등에 갔을 때 쓰레기를 함부로 버리지 않거나, 나무를 꺾지 않는 등의 소극적 참여는 포함되지 않음* 조사대상 13세이상 인구(2010년이전 15세 이상 인구)* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 귀하는 환경오염방지를 위해 얼마나 노력하고 계십니까?'
