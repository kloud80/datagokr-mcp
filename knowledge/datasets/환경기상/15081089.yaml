summary_user: 전라남도 해남군에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 원장으로, 상호·사업자등록번호·사업장주소와 함께 폐기물 구분·종류, 운반자, 처리업소, 처리방법을 기록한다. 지역 폐기물 처리업자나 분석가가 "해남군에서 건설폐기물이나 지정폐기물을 내는 사업장은 어디이고, 어느 업체가 운반·처리하는가"를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 사업자 원장·처리업 허가 데이터와 잇고, 사업장주소로 지도나 행정구역 단위 분석에 붙인다.
description_portal: 전라남도 해남군 사업장폐기물배출자 신고현황에 대한 공공데이터입니다.이 데이터에는 폐기물구분, 상호, 사업자등록번호, 전화번호, 신고기준년도, 폐기물 종류, 운반자, 처리업소명, 처리방법, 사업장주소, 데이터기준일 총11종 항목이 있습니다.2025년까지 사업장배출자 신고 사업장에 대한  데이터가 들어가 있습니다.사업장 폐기물 종류  - 대기환경보전법, 물환경보전법, 소음진동과리법의 규정에 의하여 배출시설을 설치운영하는 사업장에서 1일 100kg이상 배출하는 사업장  - 폐기물을 1일 300kg이상 배출하는 사업장(사업장비배출시설계)  - 일련의 공사작업 등으로 폐기물을 5톤이상 배출하는 사업장(건설폐기물)  - 지정폐기물을 배출하는 사업장에서 배출하는 폐기물(지정의료폐기물)
