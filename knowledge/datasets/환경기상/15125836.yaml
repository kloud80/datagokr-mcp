summary_user: 경기도 안에서 동물원·수족관으로 등록되지 않은 야생동물 전시·판매 시설을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명·상호명·전시 또는 판매 동물의 종 수와 개체 수·전시/판매 구분·지번과 도로명 주소·우편번호·위경도 좌표가 들어 있다. 지자체 담당자나 시민이 "우리 시군에 동물원 밖에서 야생동물을 전시하거나 파는 곳이 어디에 몇 곳 있고 어떤 동물을 몇 마리 두는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명이나 주소로 이름을 맞춰 붙이고, 위경도(refine_wgs84_lat 등)로 지도나 다른 공간 자료와 겹쳐 본다.
description_portal: 이 데이터는 「야생동물 보호 및 관리에 관한 법률(법률 제19088호, 2022. 12. 13.)」 부칙 제3조에 따라 동물원과 수족관에 해당하지 않는 야생동물 전시 또는 판매 시설에 대한 경기도 내 현황을 기록한 자료입니다. 주요 항목으로는 ‘시군명’을 통해 지역 단위를 식별할 수 있으며, ‘상호명’은 해당 전시시설의 명칭을 나타냅니다. ‘야생동물종류’는 전시 또는 판매되고 있는 동물의 종 수와 개체 수를 나타내며, ‘형태’ 항목은 전시시설 또는 판매시설 여부를 구분합니다. 이 데이터는 관련 법령에 따라 관리 대상이 되는 비동물원·비수족관 야생동물 시설을 파악 등의 목적으로 활용될 수 있습니다.
