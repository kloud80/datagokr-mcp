summary_user: 광양 적량 해역 자동측정 정점의 수온·염분·용존산소·수소이온농도·탁도·전기전도도·클로로필을 관측일자별로 기록한 시계열 측정값 파일(CSV, 약 2.3MB)로, 측정 건별 원천 자료를 담는다. 광양만 인근 산업시설·항만 주변 해역의 용존산소나 탁도가 특정 시기에 어떻게 변했는지 확인하려는 지자체·연구자·환경영향평가 담당자가 쓴다. 전역 조인 키는 없으며, 정점코드·정점명을 기준으로 같은 기관의 다른 해양수질자동측정망 정점 파일과 이어 붙여 비교한다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 광양 적량 해역의 수질 측정 정보를 제공합니다. 본 데이터는 실시간 자동측정 방식을 통해 수온, 염분, 용존산소(DO), 수소이온농도(pH), 탁도, 전기전도도 등 주요 수질 항목을 연속적으로 측정한 결과를 포함합니다. 광양만 인근의 적량 해역은 산업시설과 항만의 영향으로 인해 수질 변화가 민감하게 발생할 수 있는 지역으로, 상시적인 수질 모니터링이 필요합니다. 측정자료는 오염원 감시, 수질 특성 분석, 환경영향평가 등에 활용됩니다. 데이터는 시계열 형식으로 구성되며, 공공기관, 연구기관, 지자체 등에서 수질 관리와 정책 수립을 위한 기초자료로 사용됩니다.
