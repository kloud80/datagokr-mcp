description_portal: 이 데이터는 국립생태원이 운영 중인 국제생태정보종합은행(EcoBank) 시스템에서 제공하는 다양한 생태환경 관련 데이터셋에 대한 다운로드 통계 정보를 포함합니다. 데이터별 다운로드 횟수, 기간별 통계(월별, 연도별 등), 주요 사용자 기관 유형 등 다양한 지표를 통해 생태 데이터의 활용도 및 수요 추이를 파악할 수 있습니다. 본 통계자료는 데이터 개방성과 활용성을 점검하고, 향후 개방 확대 대상 데이터의 선정을 위한 기초자료로 활용됩니다. 또한 공공데이터의 정책 수립, 유통 전략 수립, 데이터 기반 행정 평가 대응 등에도 유용하게 사용될 수 있습니다. 에코뱅크 시스템은 국내외 생태정보를 통합 제공하는 대표 플랫폼으로, 데이터 기반 환경정책 수립의 핵심 기반 인프라입니다.
