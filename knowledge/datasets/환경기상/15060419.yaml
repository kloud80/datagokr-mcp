description_portal: 대구광역시 군위군에서 관리하고 있는 사업장폐기물배출자 신고현황입니다.(신고번호, 상호, 대표자, 폐기물 종류, 배출량(톤), 사업장도로명주소, 업무구분) 사업장 폐기물은 폐기물관리법에 따라 대기환경보전법, 물환경보전법 또는 소음·진동관리법에 따라 배출시설을 설치·운영하는 사업장이나 그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 의미합니다. 사업장에서 발생하는 모든 폐기물 중에서 생활폐기물에 해당하지 않는 폐기물을 말합니다. 사업장 폐기물은 생활 폐기물과 달리 보관, 운반, 처리 등에 있어 좀 더 엄격한 기준이 적용됩니다.
