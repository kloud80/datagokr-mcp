summary_user: 대구광역시 북구에서 허가를 받아 운영 중인 재활용폐기물처리업체를 업체별로 한 행씩 담은 원장으로, 업종구분·업체명·취급폐기물·허가내역·허가일자·연락처·도로명주소·위경도를 포함한다(CSV 약 1KB의 소규모 파일). 사업자나 주민이 북구에서 특정 폐기물을 재활용 처리할 수 있는 허가 업체가 어디이고 연락처가 무엇인지 찾을 때 쓴다. 전역 조인 키는 없어서 다른 지자체의 폐기물처리업 현황과는 업체명·주소로 맞춰 잇고, 위경도로 지도 위에 겹쳐 본다.
description_portal: 폐기물의 재활용이란 폐기물의 재사용 재생이용하거나 재사용 재생이용할 수 있는 상태로 만드는 활동 및 폐기물로부터 에너지법 제2조제1호에 따른 예너지를 회수하거나 회수할 수 있는 상태로 만들거나 폐기물을 연료로 사용하는 활동으로서 환경부령으로 정하는 활동을 말한다. 폐기물관리법 제25조(폐기물처리업) 및 같은법 시행규칙 제28조(폐기물처리업의 허가)에 따라 허가를 득하여 대구광역시 북구에서 운영 중인 재활용폐기물처리업 현황(업종구분, 업체명, 취급폐기물, 허가내역, 허가일자, 주소, 전화번호 등)에 대한 정보를 제공합니다.
