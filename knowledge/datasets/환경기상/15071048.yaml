summary_user: 스톡홀름협약 이행을 위한 다이옥신 국가 배출목록으로, 소각 12개·비소각 38개 등 50개 배출원 분류별 배출계수(ug-TEQ/ton)와 배출량(g-TEQ/yr)을 2011~2023년 연도별 열로 담은 전국 단위 집계 파일(csv, 약 8.7KB)이다. 분석가나 정책 담당자가 '생활폐기물 소각시설이나 철강산업 같은 배출원의 다이옥신 배출량이 연도별로 어떻게 변했는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 배출원·사업장 데이터와는 배출원 분류 이름을 맞춰서만 연결할 수 있다.
description_portal: 스톡홀름협약 발효 및 국가 비준에 따라 협약 제5조의 이행을 위해 협약 가입 당사국은 배출시설 운영 중 비의도적으로 발생하는 잔류성유기오염물질(POPs)의 배출목록을 작성 및 제출. 그 중 다이옥신의 국가 배출량 산정을 위한 소각 및 비소각 부문의 50개 배출원 분류별 배출시설에 대한 연도별 배출계수 및 배출량을 산정 및 공개 *활용자료(전국폐기물발생및처리현황 국가통계, SEMS 등) *소각 부문(소각 폐기물 종류 및 용량에 따라 생활, 사업장일반, 사업장지정, 의료 폐기물 소각시설 등 12개 부문)*비소각 부문(산업 형태에 따라 철강, 비철금속산업, 비금속광물제품제조업, 화학제품제조, 에너지산업, 기타 등 38개 부문)
