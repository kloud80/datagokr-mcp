description_portal: '제주특별자치도 내 양식장 수온 및 염분 데이터를 제공합니다.항목: 측정 일시, 정점 코드, 정점명, 위도, 경도, 전기전도도, 수온, 염분 등* 이 데이터는 제주특별자치도 내 6곳 양식장에서 체계적으로 수집된 수온과 염분 정보를 기록한 중요한 자료입니다.제주특별자치도 해양수산연구원이 양식장 주변에 설치한 전문 장비를 통해 정기적으로 또는 실시간으로 수집한 것으로, 이러한 정보는 양식장 환경의 변화와 해양 생태계의 전반적인 상태를 과학적으로 파악하는 데 유용하게 활용됩니다. 또한 향후 수산 자원 관리와 해양 환경 보존 정책을 수립하는 과정에서도 기초 자료로서 의미 있는 역할을 할 수 있습니다.* 활용 분야 : 양식업 환경 관리, 수질 모니터링, 해양 생태계 연구 등'
