summary_user: 전남 장성군 관내에 설치된 분리수거함과 영농폐기물 집하장을 시설 한 곳당 한 행으로 담은 목록 파일로, 연번·주소·비고 세 항목만 있는 4KB 남짓의 작은 CSV이다. 장성군 주민이나 농가가 "우리 마을 근처 영농폐기물 집하장이나 분리수거함이 어디 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소 문자열을 지오코딩하거나 행정동·읍면 이름으로 맞춰서만 이을 수 있다.
limits: 단위는 시군구(장성군) 한 곳의 개별 시설 주소뿐이고, 좌표·관리 주체·운영 시간 같은 항목은 실측 컬럼에 없다. 폐기물 발생량이나 처리 실적 통계는 담지 않는다. 다른 지자체의 수거함 파일과 합칠 때는 공통 코드가 없어 주소 기준으로 정리해야 한다.
