description_portal: 해양환경공단이 운영하는 해양수질 환경측정망의 공간정보 데이터를 제공합니다. 본 데이터는 연안 및 해역별로 지정된 수질 조사 지점의 위치 좌표, 정점 명칭, 조사 해역, 행정구역, 측정항목, 조사주기 등의 정보를 포함합니다. 수질측정망은 해양 환경오염 감시와 수질 변동 분석을 위해 구축되었으며, 정기적인 조사를 통해 수온, 염분, pH, 용존산소, 부유물질 등 주요 수질 요소를 파악합니다. 공간정보는 GIS 기반 자료로 구성되어 있으며, 해역별 수질평가, 오염원 추적, 수생태계 영향 분석 등의 목적으로 활용됩니다. 공공기관, 연구기관, 지자체 등에서 수질 관리정책 수립과 환경평가 기초자료로 사용됩니다.
