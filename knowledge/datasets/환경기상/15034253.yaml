summary_user: 통영시 관내 음식물류 폐기물 다량배출사업장(일정 면적 이상 음식점, 급식인원 기준 이상 집단급식소 등)을 사업장 한 곳당 한 행으로 담은 파일로, 업소명·주소·전화번호·예상 배출량(kg)·면적·급식인원을 싣는다. 사업자나 지자체 담당자가 통영시에서 어떤 업소가 다량배출사업장으로 관리되고 각 업소의 예상 배출량이 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(통영시) 단위로만 연결한다.
description_portal: '통영시 관내 음식물류 폐기물 다량 배출사업장(집단급식소, 음식점  등)에 대한 사업장의  정보를 제공합니다.주요 항목 구성으로는 상호(명칭), 사업장 주소, 전화번호, 음식물류 폐기물 배출 예상량, 사업장 면적, 1일 평균 총 급식인원에 대한 정보 제공합니다.□ 음식물류 폐기물 다량배출사업장 구분◦ 일반음식점 : 사업장 규모 200㎡이상◦ 휴게음식점 : 사업장 규모 200㎡이상◦ 집단급식소 : 1일 평균 총 급식인원 100명 이상   * 유아교육법에 따른 유치원의 집단급식소는 200인 이상◦ 대규모점포, 관광숙박업 등'
