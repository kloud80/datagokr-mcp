description_portal: 본 데이터는 환경성보장제 전기전자제품 및 자동차의 재활용시스템(EcoAS)에서 관리하는 자동차 재활용 처리 실적 정보로서, 주요 항목에는 실적년도, 실적분기, 해체대수, 해체 인수 중량, 액상폐기물 사후재활용량, 부동액 사후재활용량, 연료 회수 중량 등이 포함됩니다.이 정보는 자동차 재활용 과정에서의 분기별 실적을 체계적으로 제공하여, 자원 회수율 분석, 재활용 효율성 평가, 폐기물 처리 정책 수립, 제도 운영 성과 진단 등에 활용할 수 있습니다.특히 각 항목별 처리량을 정량적으로 확인함으로써, 자동차 해체 및 재활용 전반의 실적 흐름을 진단하고, 시기별 변화 추이를 비교 분석할 수 있습니다.또한 본 데이터는 환경부 및 산하 기관, 지자체, 자동차 해체·재활용 관련 사업자, 학계 및 연구기관 등에서 다음과 같은 목적으로 활용될 수 있습니다
