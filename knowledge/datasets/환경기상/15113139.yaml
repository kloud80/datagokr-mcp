description_portal: 서울특별시 용산구 종량제 봉투 판매소에 대한 현황 데이터로 행정동, 판매소명, 주소(도로명 주소, 지번 주소, 상세 위치)에 대한 항목을 제공합니다. 허가가 난 판매소에서는 생활 종량제봉투, 음식물 종량제봉투, 재사용 봉투, 특수마대를 소비자에게 판매합니다. 판매하는 봉투는 생활 종량제봉투 5ℓ,10ℓ, 20ℓ, 30ℓ, 50ℓ, 75ℓ / 음식물 종량제봉투 1ℓ, 2ℓ, 3ℓ, 5ℓ, 10ℓ /재사용 봉투 10ℓ, 20ℓ / 특수마대 10ℓ, 20ℓ로 크기가 나뉘어져 있습니다. 판매 가격은 2025년 8월 기준 생활 종량제봉투 5ℓ(130원) ,10ℓ(250원), 20ℓ(490원), 30ℓ(740원), 50ℓ(1250원), 75ℓ (1880원) / 음식물 종량제봉투 1ℓ(100원),  2ℓ(190원), 3ℓ(300원),  5ℓ(500원), 10ℓ(1000원) / 재사용 봉투 10ℓ(250원), 20ℓ(490원) /특수마대 10ℓ(1020원), 20ℓ(2040원)이며 현금과 카드가 동일합니다. 이사 등으로 인해 종량제봉투의 환불을 원하실 경우 영수증을 지참하시어 판매소에서 환불받으시길 바랍니다. 또한 해당 정보는 종량제봉투 판매소에 관한 정보이며 판매소의 종량제봉투의 품목별 재고가 얼마나 확보되어 있는지에 관한 사항은 아님을 안내드립니다.
