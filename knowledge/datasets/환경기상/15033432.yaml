summary_user: 경상남도 김해시에 등록된 폐기물 수집·운반업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 구분(생활·사업장 등), 업소명, 등록일자, 전화번호, 주소, 위도·경도, 영업구역을 담는다. 김해시 주민이나 사업자가 우리 동네를 맡는 생활폐기물 수거업체나 사업장폐기물을 맡길 수 있는 운반업체를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 위도·경도 기반 위치 결합으로만 이어 쓴다.
description_portal: 경상남도 김해시 폐기물 수집 운반업체 현황에 대한 데이터로 연번, 구분, 업소명, 등록일자, 전화번호, 주소, 영업구역의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 12월 31일로, 연간 주기로 관리하고 있습니다.* 데이터 미집계 또는 개인정보(휴대폰번호) 포함 등의 사유로 전화번호에 공란이 있습니다.* 구분이 생활폐기물인 경우에만 영업구역이 작성되어 있습니다.* 해당 데이터는 분석·연계하여 정책 수립 및 지역 사회 문제 해결 등 다양한 분야에 활용하실 수 있습니다.
