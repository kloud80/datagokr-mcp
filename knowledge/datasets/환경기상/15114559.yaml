summary_user: 세종특별자치시시설관리공단이 정한 대형폐기물의 품목별 배출 수수료를 품목 분류(그룹), 폐기물명, 규격(크기·조건), 수수료 금액 단위로 담은 소규모 CSV 파일(약 4.5KB)이다. 세종시 시민이 소파나 전자레인지를 버리기 전에 '이 크기면 스티커를 얼마짜리로 사야 하나'를 확인하거나, 민원 상담·생활정보 서비스에서 수수료를 안내할 때 쓴다. 전역 조인 키나 코드 컬럼이 없어서, 다른 지자체 대형폐기물 수수료 파일과는 폐기물명·규격 텍스트를 맞춰 비교해야 한다.
description_portal: '○ 대형폐기물 수수료 정보 안내세종특별자치시시설관리공단에서는 시민 여러분이 대형폐기물을 배출할 때 참고할 수 있도록 품목별 수수료 정보를 공공데이터로 제공하고 있습니다.이 데이터는 가구, 가전제품, 주방용품 등 일상생활에서 배출되는 대형폐기물의 종류, 규격, 수수료를 항목별로 정리한 자료로, 배출 전에 적정 수수료를 확인하고 스티커를 구매하실 때 유용하게 활용하실 수 있습니다.○ 데이터 항목 구성그룹: 품목의 분류 (예: 가전제품, 생활용품, 주방용품 등)폐기물명: 배출 대상 품목 이름 (예: 가방류, 가습기, 전자레인지 등)규격: 품목의 크기나 조건 (예: 소형 1m 미만, 대형 1m 이상 등)수수료: 해당 품목을 배출할 때 납부해야 하는 금액 (예: 1,000원~10,000원 등)○  활용 방법대형폐기물을 배출하기 전, 품목과 크기에 따라 수수료를 확인하세요.세종시 폐기물 배출 스티커 구매 시 정확한 금액을 기준으로 구매하시면 됩니다.타지역과 수수료를 비교하거나, 생활정보 서비스 및 민원 상담 시 참고자료로 활용할 수 있습니다.'
