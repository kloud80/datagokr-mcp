description_portal: 한국동서발전에서 운영 중인 각 발전소의 기상 정보 데이터는 발전소 인근의 기상 상태를 실시간 또는 일자별로 기록한 자료로, ‘환경감시 일기상 데이터’와 ‘환경감시 기상감시판 데이터’ 두 가지 유형으로 제공됩니다. ‘환경감시 일기상 데이터’는 발전소, 처리일자, 기온(℃), 습도(%), 기압(hPa), 풍향(방위각), 풍속(m/s), 강수량(mm), 일조 시간(h), 대기 안정도 수치(등급) 등의 항목으로 구성되며, 발전소별 일별 기상 관측 결과를 포함합니다. ‘환경감시 기상감시판’은 온도, 습도, 기압, 풍향, 풍속, 강수량, 일조 시간, 대기 안정도 등 유사 항목으로 구성되며, 주로 모니터링 목적의 시각적 표시 자료로 활용됩니다. 해당 데이터는 발전소 주변의 기상 변화와 환경 안정성 분석, 미세기후 영향 평가, 대기확산 모델 입력자료 등으로 활용이 가능하며, 학계 및 연구기관에서는 이를 기반으로 기상 조건에 따른 발전소 운영 영향 분석, 대기 안정도와 오염물질 확산 경로 연구, 기후환경 변화와 에너지 설비 운영의 상관관계 분석 등을 수행할 수 있습니다. 또한, 지역 기상 데이터와 비교함으로써 발전소 부지의 기후 특성을 규명하거나, 기상 데이터를 활용한 재난 대응 체계 구축, 환경 정책 수립의 기초 자료로도 유용하게 활용될 수 있습니다.
