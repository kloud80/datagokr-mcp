summary_user: 서울 광진구 관내에서 사업장폐기물을 배출한다고 신고한 사업장을 한 곳씩 담은 명단으로, 업체명·주소·배출품목·연락처를 수록한 작은 CSV 파일(약 2.7KB)이다. 지역 주민이나 폐기물 수집운반·재활용 사업자가 광진구 어느 사업장이 폐합성수지·폐목재 같은 어떤 폐기물을 내놓는지 확인할 때 쓴다. 사업자번호 같은 전역 조인 키가 없으므로 다른 폐기물 처리업 허가 목록 등과는 업체명이나 주소를 맞춰서만 연결할 수 있다.
description_portal: '서울특별시 광진구_사업장폐기물배출자 신고현황 데이터는 광진구 관내에서 폐기물을 배출하는 사업장의 신고정보를 수록한 자료로, 상호명, 사업장 주소, 배출품목, 연락처 등의 항목으로 구성되어 있습니다. 상호명은 폐기물을 배출하는 기업이나 업체의 명칭을 의미하며, 주소 항목은 사업장의 실제 위치를 도로명주소 또는 지번주소 형태로 제공합니다. 배출품목은 해당 사업장에서 배출하는 폐기물의 종류(예: 폐합성수지, 폐목재, 폐오일 등)를 구체적으로 나타냅니다. 연락처는 행정기관 및 관련 이해관계자들이 사업장에 직접 연락할 수 있는 전화번호 등 연락 수단을 포함합니다. 이 데이터는 환경관리 정책 수립, 불법 폐기물 방지, 자원순환 촉진, 지역 내 환경 위생 점검 등 다양한 행정적 목적에 활용됩니다. 정보는 최신 신고 기준으로 제공되며, 공공데이터 활용을 통해 사업장별 폐기물 관리 실태를 보다 효과적으로 파악할 수 있습니다.'
