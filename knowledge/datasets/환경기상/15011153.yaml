summary_user: 함안지방공사가 운영하는 함안군 폐기물 소각시설의 2025년 반입량을 생활폐기물·음식물류 폐기물·하수슬러지별로 월 단위(발생월)와 합계(톤)로 정리한 집계 파일이다. 함안군 폐기물 담당자나 분석가가 "함안에서 생기는 폐기물이 어느 달에 얼마나 소각시설로 들어오고 어떤 종류가 가장 많은가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지역 소각시설 현황이나 폐기물 통계와는 월·폐기물 종류 이름으로 맞춰 붙여야 한다.
description_portal: 함안지방공사에서 운영하는 함안군폐기물소각시설에서 발생한 폐기물 의 2025년 반입 현황으로  생활폐기물, 음식물류 폐기물, 하수슬러지의 월별 반입량과 연간 총계를 정리한 자료이다.  타지역에서 발생되는 폐기물을 반입되지 않은 순수하게 함안에서 발생된 폐기물의 반입량이며 폐기물 3종류 중 생활폐기물이 가장 큰 비중을 차지했다. 계절별로는 여름철과 가을철에 반입량이 증가하는 경향을 보이며, 함안 지역의 폐기물 처리 방안 및 운영계획 수립을 위한 기초자료로 활용될 수 있다.
