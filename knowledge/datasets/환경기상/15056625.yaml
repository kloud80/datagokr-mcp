summary_user: 경기도 내 수질오염물질 배출 사업장에 부과된 기본배출부과금을 사업장별·반기별(상반기·하반기)로 담은 건별 자료로, 집계년도·시군명·사업장명·부과금액(원)과 사업장 주소·좌표를 포함한다. 분석가나 지자체 담당자가 "우리 시군에서 기본배출부과금을 많이 낸 사업장은 어디이고 연도별로 어떻게 바뀌었나"를 확인하는 데 쓴다. 실측상 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)·시군명, 사업자등록번호, 주소·좌표를 써서 다른 사업장·지역 자료와 이름·코드 매핑 방식으로 잇는다.
description_portal: 이 데이터는 경기도 내 수질오염물질을 배출하는 사업장을 대상으로 부과되는 기본 배출부과금의 납부 현황을 정리한 자료로, 수질오염 유발자에게 오염원인자 부담원칙에 따라 비용을 부과하는 제도에 기반합니다. 주요 항목은 집계년도, 시군명, 사업장명, 반기구분(상반기·하반기), 부과금액(원) 등으로 구성되어 있으며, 사업장 단위로 부과 내역을 제공합니다. 이 자료는 지역별 오염원 분포 분석, 고오염 사업장 관리, 환경부담금 제도 개선 및 수질환경 정책 수립의 기초자료로 활용될 수 있는 데이터 입니다.
