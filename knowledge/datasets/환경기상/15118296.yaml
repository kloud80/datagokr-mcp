description_portal: '인천기지본부 부두 환경 Data(풍향, 풍속, 파고, 해수온도)이며, 기존 온도와 습도, 대기압 뿐만아니라 시정거리와 풍향풍속 등의 추가 데이터를 확인할 수 있습니다.인천 신항의 관련 항만시설 확대로 국제물류전초기지의 역할을 수행하는 지역으로 공사차량과 물류용 컨테이너, 항만시설관련 업무를 위한 관리인원이 급속히 늘어나고 있으며, 기존 송도스포츠파크와 오렌지듄스 골프장, 야구연습장 등을 이용하는 지역주민이 부족한 대중교통을 대신하여 자가차량을 이용하고 있습니다.따라서, 해무가 많이 발생하는 지역특성상 교통사고가 빈번히 발생할 뿐더러 대형차량으로 인한 사고로 인명손실도 자주 발생하므로 동 데이터를 활용하여 물류관리 및 레저시설 이용 시 활용 가능합니다.인천기지본부 부두 지역 환경 Data(풍향, 풍속, 파고, 해수온도) -위치 : 1,2부두 지역- Data 업데이트 : 1일- 조류속 단위 : cm/sec, 풍속 단위 : m/sec, 해수온도 : "c'
