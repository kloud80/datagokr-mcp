summary_user: 한국수자원공사가 지하수 기초 조사 과정에서 구축한 조사 시설을 시설 한 곳당 한 행으로 담은 전국 단위 원장 파일로, 시설 구분·관측소명·주소·원시자료명·자료 생성 기관명을 담는다. 연구자나 지자체 담당자가 특정 지역에 어떤 지하수 조사·관측 시설이 있고 그 원시 자료를 어느 기관이 만들었는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 지하수 수위·수질 데이터와는 관측소명이나 주소를 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 한국수자원공사에서 수행한 지하수 기초 조사 과정에서 구축된 조사 시설의 세부 정보를 제공한다. 제공 항목에는 시설의 구분, 관측소 명칭, 소재지 주소, 관련 원시 자료명 및 해당 자료를 생성한 기관명이 포함된다. 지하수 관측과 관련한 국가 수문정보 인프라의 기초 자료로 활용될 수 있으며, 공공기관, 학계, 민간 연구자 등이 지역 지하수 환경 분석 및 정책 수립을 위한 기초 자료로 활용 가능하다. 각 시설은 위치정보를 기반으로 식별되며, 연도별 조사 결과와 연계하여 다양한 분석에 활용될 수 있다. 본 데이터는 전국 단위로 수집된 정보를 바탕으로 구성되었으며, 지하수 자원의 체계적인 관리와 활용을 위한 기반 자료로 기능한다.
