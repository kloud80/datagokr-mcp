summary_user: 서울 강남구에서 가정의 불용의약품을 거둔 양을 연도별로 집계한 작은 파일(CSV 722바이트)로, 연도·수거량·처리방법·관리부서를 담는다. 강남구 주민이나 분석가가 '강남구에서 해마다 폐의약품이 얼마나 수거되고 어떻게 처리되는가'를 확인할 때 쓴다. 전역 조인 키가 없으므로 다른 지자체의 폐의약품 수거 파일과는 연도와 기관명을 기준으로 직접 맞춰 이어 붙인다.
description_portal: 서울특별시 강남구 연도별 가정불용의약품 수거현황으로 연도, 수거량, 처리방법, 관리기관명, 관리부서명, 관리부서 전화번호, 데이터 기준일자 정보를 제공하고 있습니다연도별 수거량에 대한 정보가 포함되어 있습니다.  수거된 의약품이 어떤 방식으로 처리되었는지 파악할 수 있는데, 주요 처리 방법으로는 소각이 사용되고 있습니다. 2012년도 부터 2021년도까지의 데이터이니 활용시 참고하시기 바랍니다.가정불용의약품의 담당부서는 의약과이며  데이터 활용 또는 추가적인 문의 사항이 있으시면 의약과로 문의하시기 바랍니다.
