summary_user: 그린리턴(고품질 재활용품 회수보상제) 수거거점을 거점 한 곳씩 담는 건별 목록으로, 거점명·도로명/지번주소·위경도와 요일별 운영시간·휴무·수집품목·연락처를 포함하며 범위는 전국이다. 시민이 "우리 동네에서 깨끗한 재활용품을 내고 보상받을 수 있는 거점이 어디이고 오늘 몇 시까지 여나"를 확인하거나, 지도 서비스 사업자가 거점 위치와 운영 정보를 보여주는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표 기반의 공간 매칭이나 지역명 같은 이름 매핑으로만 연결한다.
description_portal: '이 데이터는 그린리턴 수거거점에 관한 정보를 포함하고 있으며, 거점 명칭, 위치정보(위·경도, 행정구역, 도로명주소 등)와 운영정보(운영시간, 수거품목, 연락처 등)로 구성되어 있습니다.활용 예시) 해당 데이터를 지도앱에 연계하여 수거거점 정보(운영시간, 세부 주소 등)를 표출하여 서비스하면 국민의 그린리턴 사업에 도움이 됩니다.※ 그린리턴(고품질 재활용품 회수보상제) : 시민이 깨끗한 고품질 재활용품을 지자체 등에서 운영하는 수거거점에 제출하면 인센티브를 지급하여 생활 속에서 환경사랑을 실천할 수 있는 제도입니다.※※ 데이터 기준 : 2025년 하반기'
