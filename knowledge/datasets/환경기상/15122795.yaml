summary_user: 경기도 내 산사태를 연도·시군별로 묶어 발생면적(ha), 복구금액(백만원), 사망자 수를 담은 집계 자료이며 범위는 경기도 시도 단위이고 공간 좌표는 없다. 경기도 시군 가운데 어느 곳에서 산사태 피해가 크고 복구비가 많이 들었는지, 특정 연도에 피해가 몰렸는지를 따지는 방재·산지관리 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)과 연도를 이름으로 맞춰 잇는 방식만 가능하다.
description_portal: 이 데이터는 경기도 내에서 발생한 산사태 현황을 기록한 자료로, 산사태 피해의 규모와 복구 현황을 종합적으로 보여줍니다. 주요 항목으로는 산사태가 발생한 년도와 시군명, 피해를 입은 발생면적(ha), 복구에 소요된 금액(백만원), 인명피해(사망자 수)가 포함되어 있습니다. 이를 통해 지역별 산사태 발생 빈도와 피해 규모를 비교·분석할 수 있으며, 복구비용과 인명피해의 상관관계, 특정 연도의 집중 피해 여부 등을 파악할 수 있습니다. 해당 데이터는 산사태 예방정책 수립, 산지 관리, 재난 복구 예산 편성 등 다양한 행정적 의사결정에 활용될 수 있습니다.
