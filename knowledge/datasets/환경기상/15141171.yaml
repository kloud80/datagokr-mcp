description_portal: 본 데이터는 서울특별시 양천구에서 관내 건물위생관리업에 대한 인허가 현황을 체계적으로 정리하여 제공하기 위해 구축된 행정자료이다.해당 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 층수, 업태구분, 종사자수 등의 주요 항목이 포함된다. 이는 지역 내 건물위생 관리서비스의 운영 실태를 파악하고, 법령에 따른 관리기준 준수 여부를 확인하기 위한 행정업무의 근거자료로 활용된다. 또한 허가 변경 및 취소와 같은 변동사항을 지속적으로 반영하여 정보의 최신성을 유지하고 있으며, 관내 업체 분포와 서비스 유형을 종합적으로 이해할 수 있도록 표준화된 형식으로 제공된다. 본 데이터는 위생안전 수준 향상을 위한 정책 수립과 행정감독의 효율성 제고를 지원하기 위해 공공데이터로 공개되고 있다.* 건물위생관리업 - 공중이 이용하는 건축물·시설물등의 청결 유지와 실내 공기정화를 위한 청소 등을 대행하는 업소
