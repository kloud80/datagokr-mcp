summary_user: 대구광역시 북구에서 「실내공기질 관리법」 적용대상인 다중이용시설(지하역사, 의료기관, 어린이집, 대규모점포, 실내주차장 등)을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설군·시설명·도로명주소·위도·경도·데이터기준일자를 담는다. 북구 주민이나 분석가가 "우리 동네 어린이집·노인요양시설 가운데 실내공기질 관리대상은 어디이고 어디에 있나"를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소로 맞추거나 위도·경도로 주변 대기질 측정소와 공간 매칭해 이어 쓴다.
description_portal: 대구광역시 북구 「실내공기질 관리법」 제3조(적용대상)에 해당되는 다중이용시설에 대한 데이터로 시설군, 시설명, 소재지(도로명,지번), 위도, 경도 등의 정보를 제공합니다.- 「실내공기질 관리법」 시행령에 따른 규모 이상의 것으로 적용대상에는 지하역사, 지하도상가, 철도역사의 대합실, 여객자동차터미널의 대합실, 항만시설 중 대합실, 공항시설 중 여객터미널, 도서관, 박물관 및 미술관, 의료기관, 산후조리원, 노인요양시설, 어린이집, 실내 어린이놀이시설, 대규모점포, 장례식장, 영화상영관, 학원, 전시시설, 인터넷컴퓨터게임시설제공업의 영업시설, 실내주차장, 실내 공연장, 실내 체육시설, 목욕장업 등이 있습니다.
