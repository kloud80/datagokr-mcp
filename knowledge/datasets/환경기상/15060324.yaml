description_portal: 세종특별자치시 사업장폐기물 배출 사업장 내역에 관한 내용을 공개합니다.데이터는 사업장명과 사업장 주소, 구분(배출시설계, 비배출시설계)으로 구성되어 있습니다.세종특별자치시 사업장 폐기물 배출 사업장은 총 320개소로페더럴모굴세종 주식회사, (사)노장농공단지입주기업체협의회, 한화솔루션(주) COPV 사업장, 사)조치원일반산업단지 제3공구 입주기업체협의회, 세일콘크리트공업(주)세종지점,콘티넨탈 오토모티브 일렉트로닉스(유) 등이 장군면, 부강면, 전동면, 금남면, 전의면 등에 소재하고 있습니다.
