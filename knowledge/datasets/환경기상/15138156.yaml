description_portal: 경상북도 내 여러 지역을 대상으로 하여 대기질 및 기상현황을 종합적으로 진단한 결과를 담고 있는 자료입니다. 다양한 성분별 대기오염 농도와 기상 조건 정보를 포함하며,  대기성분 수치와 기상 변수들의 시간대별 변동을 상세히 기록하였습니다. 이를 통해 지역별 대기 상태를 평가함과 동시에, 예측모델 결과와 연동하여 환경 관리 및 정책 수립에 필요한 과학적 근거를 제공합니다.각종 국가 및 지역 환경모델(GFS, UM, FNL)에서 산출된 데이터와 기상 관측치가 포함되어 적절한 분석 기반을 구축하였으며, 데이터는 사용자 접근성을 높이기 위해 다양한 지표와 변수별 상세 항목을 체계적으로 정리하였습니다.  자료 관련 문의는 054-339-8174로 하시기 바랍니다.
