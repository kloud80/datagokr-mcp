summary_user: 충청북도 수질측정망 운영결과를 연도·하천·구분별 평균 측정값으로 묶은 집계 데이터로, 건별 원측정값이 아니라 수계별 수질 항목의 평균치를 담는다. 행정기관이나 연구자가 '충북의 특정 하천 수질 항목이 해마다 어떻게 변했나'처럼 수질 개선 추세나 정책 효과를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천명(RIVER)·연도(YEAR) 같은 이름 매핑으로만 하천·댐 수자원 데이터나 다른 수질측정망 자료와 이어 쓴다.
limits: 측정소 코드 같은 공통 조인 키가 없어 다른 데이터와는 하천명·연도 등 이름 대조로만 연결해야 한다. 필드(상태·설명·구분 등)의 명세상 의미가 비어 있어 값의 뜻은 실제 응답을 보고 확인해야 한다. 호출에는 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
