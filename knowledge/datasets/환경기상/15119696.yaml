summary_user: 한국동서발전 발전소별 사업소 단위로 사용하는 화학물질의 품명(한글·영문)과 연간사용량(톤)을 담은 전국 범위 비공간 데이터로, 포털 설명상 연도별 사용 현황을 제공한다. 연구자나 지역 주민이 특정 발전소에서 어떤 화학물질을 연간 몇 톤 쓰는지, 연도별로 사용량이 어떻게 바뀌는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 화학물질 취급·배출 데이터와는 사업소명이나 물질명을 이름으로 맞춰 연결해야 한다.
description_portal: 한국동서발전에서 오픈API 형태로 제공하는 화학물질 사용 현황 정보는 발전소별 사업소, 화학물질의 품명(한글·영문), 연간사용량(톤) 등 핵심 데이터를 포함해 발전 과정에서 활용되는 화학물질의 종류와 사용 규모를 체계적으로 파악할 수 있도록 구성됩니다. 이러한 표준화된 데이터는 발전소 내 화학물질 관리의 투명성을 높일 뿐 아니라 관련 시스템과 연계해 자동화된 관리·보고 체계 마련이 가능하게 하며, 사고 예방과 안전 관리를 더욱 효율적으로 지원할 수 있습니다. 학계 및 연구 기관에서는 발전소별 화학물질 사용 패턴과 연도별 변화 추이를 통해 화학물질의 환경·사회적 영향 분석, 안전사고 예방 정책 개발, 발전 설비 운용의 지속 가능성 평가 등 다양한 에너지·환경·산업 안전 분야의 학술연구 자료로 활용될 수 있습니다.
