summary_user: 울산광역시 중구에서 생활폐기물을 수거하는 업체의 이름, 담당구역, 전화번호를 업체별로 정리한 소규모 현황 파일(CSV 671바이트)이다. 중구 주민이 자기 동네 쓰레기 수거를 어느 업체가 맡는지, 수거가 누락됐을 때 어디로 연락하면 되는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 데이터와는 담당구역의 행정동 이름을 맞추거나 같은 중구의 다른 폐기물 파일과 함께 보는 방식으로만 잇는다.
limits: 수거 업체 목록일 뿐이어서 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다. 범위는 울산 중구 한 곳이고 좌표가 없는 비공간 자료여서, 다른 지자체와 비교하려면 지자체별 파일을 따로 모아야 한다.
