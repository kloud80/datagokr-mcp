description_portal: 한국수자원공사에서 제공하는 지하수 정기수질검사결과로, 이용실태자료를 근거로 하여 수질검사가 실시된 시설에 대한 수질검사 현황(총계, 적합, 부적합)을 시도 단위로 분석한 통계 데이터입니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며, 민간 및 공공기관의 연구와 정책 수립에 활용할 수 있는 기초자료입니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
