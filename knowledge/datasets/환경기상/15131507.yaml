description_portal: 한국남동발전에서 운영하는 발전소(삼천포, 분당, 영흥 등)의 발전소 인근 상세 기상 관측 데이터입니다.2020년 7월부터 최신 일자까지 각 발전소(삼천포, 분당, 영흥 등)의 일자별 기상 정보 측정 자료를 확인할 수 있습니다. 온도, 습도, 풍향, 풍속, 강수량, 기압 등 기본적인 기상 요소뿐만 아니라, 발전소 운영 및 환경 영향 분석에 중요한 대기안정도, 증발량, 일조시간 등의 정보가 포함된 시계열 데이터입니다. 60분 강수량, 금일 강수량 등 세분화된 강수량 정보는 집중호우 등 기상 이변에 대한 정밀 분석에 활용할 수 있습니다.
