description_portal: 이 데이터는 친환경 자동차 및 관련 기술, 배출기준, 오염물질 등에 대한 용어 정의를 수록한 용어집으로 친환경차종합정보지원시스템의 사용자들이 주요 개념을 쉽게 이해하고 활용할 수 있도록 구성된 자료입니다.용어는 자동차 기술, 환경기준, 오염물질, 정책사업 등의 다양한 주제를 포함하고 있습니다. 예를 들어, '그린카', '전기차(EV)', '수소차(FCEV)' 등 친환경차의 분류와 특성을 설명하고 '미세먼지(PM2.5)', '휘발성유기화합물(VOCs)', '증발가스' 등의 오염물질에 대한 정의도 제공합니다. 또한 'EURO-4,5,6', 'ULEV', 'ZEV' 등의 국제 및 국내 배출가스 허용기준에 대한 설명도 포함되어 있습니다.
