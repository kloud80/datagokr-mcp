description_portal: 전북특별자치도 부안군은 노후 차량의 운행으로 인한 안전사고 예방과 환경오염 저감을 위하여 1톤 트럭 폐차현황 데이터를 관리하고 있다. 본 데이터는 부안군 내 등록된 1톤 트럭 중 폐차된 차량의 정보를 제공하며, 차량등록번호, 차명, 주행거리, 최초등록일, 말소일자, 폐차사유 등의 항목으로 구성되어 있다. 데이터는 차량등록시스템을 통해 수집·정제되며, 행정기관의 차량관리 정책 수립, 노후차량 교체지원, 대기오염 저감사업 등의 근거자료로 활용된다. 또한 민간에서는 중고차량 유통현황 분석 및 자동차 관련 연구자료로 활용이 가능하다.
