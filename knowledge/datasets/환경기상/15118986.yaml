description_portal: '2008년부터 2021년까지의 전국 단위 순환골재 생산 및 유통 관련 통계로, 건설폐기물의 자원화 과정에서 생산된 순환골재의 생산량, 판매량, 재활용 용도, 보관량 등의 정보를 포함하고 있습니다.각 행에는 다음과 같은 주요 정보가 포함됩니다. 먼저 보고년도, 업체명, 업체의 행정구역(시·군·구)이 명시되어 있으며, 일부 업체명은 블라인드 처리되어 있습니다. 또한 생산된 순환골재의 규격(예: 5mm 등), 생산량(톤), 판매량(톤), 재활용 용도(예: 성토용/복토용), 보관량(톤)이 함께 제공됩니다.이 데이터를 통해 순환골재가 지속가능한 자원으로 얼마나 효과적으로 활용되고 있는지 파악할 수 있습니다.'
