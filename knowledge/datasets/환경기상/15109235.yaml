summary_user: 제주시 안의 공중화장실을 한 곳씩 담은 시설 원장으로, 화장실명·읍면동·도로명/지번 주소·위도·경도 좌표와 개방시간, 관리기관, 비상벨·입구 CCTV·기저귀교환대 설치 여부, 남녀·장애인·어린이용 변기 수를 담는다. 관광객이나 주민이 '지금 위치 근처에서 장애인 화장실이나 기저귀교환대가 있는 개방 화장실이 어디인가'를 찾거나, 분석가가 읍면동별 안전설비(비상벨·CCTV) 설치 현황을 점검하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 좌표(laCrdnt·loCrdnt)로 공간 결합하거나 주소·읍면동명을 이름으로 맞춰 잇는다.
limits: 범위는 제주시 한 시군구뿐이라 서귀포시나 다른 지역 화장실은 따로 찾아야 한다. 공통 코드 키가 없어서 다른 시설·행정 데이터와 붙일 때는 이름이나 좌표 매칭에 기대야 한다. 개발계정 호출 한도는 하루 10,000회다.
