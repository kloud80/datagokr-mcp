summary_user: 경상남도 창원시의 온실가스 배출량 현황을 에너지·산업공정·농축산 흡수·폐기물 부문별로 정리한 엑셀 파일(xlsx)로, 한국환경공단 인벤토리를 바탕으로 한 시군구 단위 집계 자료다. 창원시의 탄소중립 이행계획을 세우거나 감축 효과를 점검하는 공무원·분석가가 "창원시 배출량은 어느 부문에서 가장 많이 나오나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 지자체 배출량이나 사업장 배출원 데이터와는 지역명이나 부문명을 직접 맞춰야 이어 쓸 수 있다.
description_portal: 경상남도 창원시의 온실가스배출량 현황(에너지별배출량, 산업공정별배출량, 농축산흡수량, 폐기물별배출량)입니다.한국환경공단 제공 인벤토리 사용온실가스 배출량 데이터는 이산화탄소, 메탄, 아산화질소 등 온실효과를 유발하는 주요 기체의 배출량을 부문별(산업·수송·가정 등) 또는 지역별로 집계한 자료입니다. 이 데이터는 배출원 분석, 탄소중립 이행계획 수립, 감축 효과 모니터링, 기후변화 대응 정책 평가 등에 활용되며, 연도별 변화 추이 및 국제 기준 비교를 통한 통계 분석과 시각화 작업에 유용합니다. 분석 목적에 따라 단위 통일, 배출계수 기준, 부문별 구분 체계 등을 확인해 활용하는 것이 중요합니다.
