summary_user: 광주 동구에 있는 미세먼지쉼터를 쉼터 한 곳당 한 행으로 담은 시설 목록 파일이다(CSV 약 1.6KB). 각 행에는 도로명·지번 주소, 경도·위도, 시설유형, 면적, 이용가능인원, 평일과 주말·공휴일 운영시간이 들어 있다. 주민이 '미세먼지가 심한 날 우리 동네 근처에서 지금 열려 있는 쉼터는 어디인가'를 찾을 때 쓰고, 분석가는 쉼터 수용 인원이 지역별로 고르게 분포하는지 살필 때 쓴다. 다른 데이터와 바로 맞물리는 전역 조인 키는 없어서, 주소나 좌표를 기준으로 대기질 측정소 위치나 다른 시설 데이터와 공간적으로 맞춰 이어 쓴다.
description_portal: 광주광역시 동구 미세먼지쉼터 현황 데이터입니다.순번, 쉼터명칭, 시도, 도로명주소, 지번주소, 시설유형, 시설면적, 이용가능인원, 평일시작시간, 평일종료시간, 주말 공휴일 시작시간, 주말 공휴일 종료시간, 경도, 위도, 데이터기준일자로 구성되어있습니다.
