description_portal: 본 데이터는 한국중부발전이 연간 또는 분류별로 집행한 구매 예산 중 친환경제품에 해당하는 구매 비율을 정리한 자료입니다. 항목은 분류명, 총구매금액, 녹색구매금액, 비율로 구성되어 있으며, 금액 단위는 원, 비율은 퍼센트로 표기됩니다. 이 자료를 통해 중부발전이 환경친화적 소비를 실천한 정도와 녹색제품 우선구매 제도 이행 수준을 수치로 확인할 수 있습니다. 또한 공공기관의 녹색 구매 실적 평가, ESG 경영지표 모니터링, 녹색기술·제품 시장 수요 분석 등의 기초 자료로 활용 가능합니다. 이 데이터는 지속 가능한 발전 목표 달성을 위한 정책 개선에도 중요한 참고 자료가 될 수 있습니다.
