summary_user: 경기도 대기환경 진단평가시스템의 모델링에 쓰이는 시간축 기준 정보를 담는다. 시점 하나마다 서로 다른 형식의 날짜·시간 값(model_1_dt 등 3개 필드)이 함께 기록된 참조표이며, 측정값이나 농도는 들어 있지 않다. 분석가가 이 시스템의 모델 결과 자료를 다룰 때 "모델 시간 표기를 표준시간으로 어떻게 바꾸나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 같은 경기도 진단평가시스템 자료와는 날짜·시간 값을 맞춰 이어 쓴다.
description_portal: 경기도_대기환경_진단평가시스템_모델시간정보 데이터는 경기도 대기환경 진단평가시스템에서 활용되는 시간 단위별 모델링 기준 정보를 제공하는 자료입니다. 주요 항목으로는 번호, 날짜, 날짜00, 날짜(표준시간)이 있으며, 각각 특정 시점을 고유한 형식과 표준화된 날짜·시간으로 기록합니다. 이 데이터는 대기질 예측 및 분석 모델에서 시간축을 정의하는 기초 자료로 사용되며, 대기오염물질 농도 변화, 기상 조건 반영, 환경 정책 모의실험 등과 같은 연구·행정 활용의 기반을 형성하기 위해 활용될 수 있습니다.
