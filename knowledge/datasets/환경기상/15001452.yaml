description_portal: 본 데이터는 해양수산부에서 관리하는 해수수질 정보 목록정보입니다. 주요 항목으로 측정일시, 측정지점, 수온, 염분, pH, 용존산소, 화학적산소요구량, 총질소, 총인, 클로르필 등의 정보를 포함하고 있습니다. 이 데이터는 해역별 수질변화 추이분석연구, 오염원 추적조사 기초자료, 양식장 입지적합성 평가분석, 해수욕장 수질관리 모니터링, 연안환경 보전정책 수립 등에 활용할 수 있습니다. 환경연구자, 수산물안전관리 담당자, 양식업종사자 등에서 환경모니터링과 안전관리 업무에 활용할 수 있습니다.
