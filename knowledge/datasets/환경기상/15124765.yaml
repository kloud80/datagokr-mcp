summary_user: 문경시에 등록된 종량제봉투 지정판매소를 판매소 한 곳당 한 행으로 담은 파일(약 14.5KB CSV)로, 판매소명·주소·주소유형·위도·경도를 제공한다. 문경시 주민이 집 근처에서 종량제봉투를 살 수 있는 가게를 찾거나, 분석가가 판매소 분포를 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 주소 문자열이나 위도·경도 좌표로 다른 생활폐기물 배출 지점 데이터(대형폐기물 수거함, 재활용 정거장 등)와 위치 기준으로 겹쳐 본다.
