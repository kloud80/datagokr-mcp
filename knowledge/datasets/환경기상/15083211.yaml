description_portal: '본 데이터는 실내 공기질 관리 및 환경 개선을 목적으로 수집된 데이터로, 다양한 실내 공간에서 공기 중 유해 물질의 농도와 환경 요소를 포함하여 구성하였습니다.[제공항목 : 부산교통공사가 관리하는 지하철 역사, 전동차, 실내주차장 및 지하상가의 공기질 측정 정보(미세먼지, 초미세먼지, 이산화탄소, 포름알데히드, 일산화탄소 등)]해당 데이터는 공기질 현황을 체계적으로 파악하고, 환경 개선을 위한 기초 자료로 활용할 수 있으며,실내 공기질 모니터링, 공공시설 환경 개선 계획 수립, 승객 및 이용자 안전 확보를 위한 자료로 활용될 수 있습니다.'
