description_portal: 이 데이터는 해양수산부에서 국가해양환경 온라인 플랫폼을 통해 제공되는 이러닝 콘텐츠 수강생의 학습현황 기록을 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 2022년부터 2023년까지 온라인 플랫폼에 등록된 수강생별 이러닝 강의의 학습 시작일, 종료일, 이수 여부, 수료번호로 구성되어 있습니다.  본 데이터는 학습자별 학습 진행 상황을 체계적으로 파악하거나 교육 프로그램의 운영 관리에 활용될 수 있으며, 기관은 이를 통해 온라인 콘텐츠 운영 실적을 집계하고 다음 연도 교육 계획 수립의 기초 자료로 사용할 수 있습니다.
