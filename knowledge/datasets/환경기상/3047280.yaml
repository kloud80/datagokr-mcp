summary_user: 대구광역시 달서구가 석면조사를 실시한 다중이용시설·공공건물 등 건축물을 건물 한 곳당 한 행으로 담은 파일로, 건물명·도로명주소·행정동·위도·경도와 주관부서·기준일자를 포함합니다. 달서구 주민이나 시설 이용자가 '우리 동네 어느 건물이 석면조사 대상인가'를 확인하거나, 분석가가 석면 관리 대상 건축물의 동별 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없어 도로명주소나 위도·경도로 건축물대장·다른 공간 데이터와 맞추거나, 행정동 이름으로 동 단위 통계와 이어 쓴다.
description_portal: 대구광역시 달서구에서 다중이용시설, 공공건물 등의 건축물에 대한 석면조사를 실시하여 상태를 파악하고 안전하게 관리하여 석면으로 인한 피해를 사전에 예방하기 위해 수집한 자료를 데이터로 공공데이터포털을 통해 제공합니다.항목은 위도, 경도, 건물명, 동명, 도로명주소, 행정동, 주관부서, 기준일자로 구성되어 있으며 1년마다 주기에 따라 최신 정보를 반영하여 현행화합니다.건축물 내 유해물질 관리 및 시민 건강 보호를 위한 석면 안전관리 정책 수립, 도시 환경 연구 등에 참고자료로 활용 가능합니다.
