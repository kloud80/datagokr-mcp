description_portal: 입력 파라미터를 이용하여 대구광역시_북구청_폐형광등 분리수거함 현황 데이터(일련번호, 행정동 명, 상세 주소, 전화번호)을 조회하는 서비스입니다. 중금속에 의한 환경오염을 최소화하고 자연을 보호하고자 유해폐기물인 폐형광등 분리수거함을 설치하며, 가정에서 배출하는 폐형광등 안에 인체에 해로운 수은이 함유되어 있어 주민들의 신체이상 및 환경피해를 줄이기 위해 수거하여 전문처리업체에서 처리하고 있습니다. 일반 쓰레기와 혼합 배출되지 않도록 분리배출해야 하며, 파손되지 않도록 배출합니다. 꺠진 형광등은 종량제봉투에 배출합니다.
