summary_user: 대구광역시 북구에 설치된 폐형광등 분리수거함을 한 곳씩 행정동 이름, 상세 주소, 전화번호와 함께 담은 건별 지점 목록으로, 범위는 북구 한 개 시군구입니다. 북구 주민이 집에서 나온 폐형광등을 우리 동네 어디에 버려야 하는지 찾거나, 분석가가 행정동별 수거함 분포를 살필 때 쓴다. 전역 조인 키가 없어 행정동 이름(ADSTRD_NM)이나 주소 문자열로 다른 북구 생활폐기물 배출 지점 데이터나 행정구역 자료와 맞춰 이어 쓴다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위가 대구 북구로 한정되므로 다른 지역 수거함은 지자체별 데이터를 따로 찾아야 하고, 폐형광등 발생량이나 처리 실적 통계는 담지 않는다.
