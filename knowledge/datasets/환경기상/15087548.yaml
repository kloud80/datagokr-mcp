summary_user: 인천광역시 남동구 안에서 비산먼지가 발생하는 사업장을 한 행에 한 곳씩 사업장명·현장 소재지·발생사업 유형·대상사업 구분으로 담은 시군구 단위 목록 파일이다(CSV 약 6KB 규모). 주민이나 환경 담당자가 '우리 동네 근처에서 비산먼지를 내는 공사·사업장이 어디이고 어떤 유형인가'를 확인하거나 민원 대응·관리 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어 다른 오염원 사업장 원장이나 대기 측정 자료와는 사업장명·현장 소재지 주소를 매칭해서만 이을 수 있다.
description_portal: 해당 데이터는 인천광역시 남동구 내 비산먼지 발생 사업장의 현황을 담고 있으며, 연번, 사업장명, 현장 소재지, 발생 사업 유형, 대상 사업 구분, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이 자료는 대기오염의 주요 원인 중 하나인 비산먼지의 발생지를 체계적으로 관리하고, 환경 민원 예방 및 공공 건강 보호를 위한 기반 자료로 활용됩니다. 앞으로 이 데이터를 통해 비산먼지 관리 대상 지역의 우선순위를 설정하고, 실시간 모니터링 및 규제 정책 강화, 친환경 사업 유도 등 지역 환경정책 수립과 지속 가능한 도시 관리에 중요한 역할을 할 것으로 기대됩니다.
