summary_user: 충청남도 금산군에서 음식물쓰레기를 많이 배출하는 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호명·연락처·도로명/지번 주소·월·일 배출량(kg)·처리방법을 싣는다. 금산군 환경 담당자나 음식물 처리업체가 군내 어느 사업장이 얼마나 배출하고 어떻게 처리하는지 파악하는 데 쓴다. 전역 조인 키는 없고, 다른 데이터와는 소재지 주소나 상호명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 충청남도 금산군의 음식물쓰레기 다량배출사업장현황(상호명, 연락처, 소재지 도로명주소, 소재지 지번주소, 월배출량, 일배출량, 처리방법)에 대한 데이터를 제공합니다. 금산군에 위치한 총 49개의 사업장 정보가 수록되어 있습니다. 이 데이터는 금산군 내 음식물 쓰레기 발생량 추정, 처리시설 운영계획 수립, 환경정책 설계에 활용될 수 있으며, 환경부 및 지자체의 자원순환정책 실현에도 중요한 기초자료입니다. 해당 데이터는 매년 갱신되며, 환경정보 공개의 일환으로 매우 유용한 자료입니다.
