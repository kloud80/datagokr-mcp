description_portal: '본 데이터는 국립호남권생물자원관에서 2024년 12월 19일 기준으로 운영된 전시프로그램 정보를 정리한 자료입니다. 생물자원과 생물다양성에 대한 국민 인식 제고와 흥미 유발을 위한 다양한 전시 활동이 포함되어 있습니다. 데이터는 연번, 프로그램명, 위치, 설명, 게시시작일자, 게시종료일자 항목으로 구성되어 있으며, 연번은 1번부터 30번까지의 번호로 오름차순 정렬되어 있습니다. 위치 항목에는 국립호남권생물자원관 본관, 바이오스튜디오, 연구자의 방, 상설전시실 등 실제 전시가 이루어진 장소가 기재되어 있습니다. 설명 항목은 각 전시의 주제와 내용, 전시 목적 등을 간략히 소개하고 있으며, 게시시작일자 및 게시종료일자는 날짜 형식(예: 2024-01-01)으로 작성되어 있어 운영 기간을 명확하게 확인할 수 있습니다. 본 데이터는 전시 운영 이력 관리, 콘텐츠 기획, 교육 프로그램 연계, 관람객 대상 정보 제공 등 다양한 목적으로 활용될 수 있습니다. 전시성과 분석 및 홍보 자료로도 활용 가능성이 높습니다.'
