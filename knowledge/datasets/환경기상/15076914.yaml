summary_user: 경상북도 청도군 관내에서 벙커C유(중질유)를 연료·원료로 쓰는 사업장을 업소 한 곳씩 담은 목록으로, 업소명·도로명/지번 주소·위도·경도·생산품·연간 사용량(톤/년)·기준일자를 포함하며 파일 크기는 241바이트로 매우 작다. 청도군의 중질유 다소비 사업장이 어디에 있고 무엇을 만들며 한 해 얼마나 쓰는지를 확인하려는 환경 담당자나 지역 대기오염·탄소배출 분석가가 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 배출시설·사업장 데이터와는 업소명·주소를 맞추거나 위도·경도로 공간 결합해야 한다.
description_portal: 경상북도 청도군 지역 내에서 벙커C유를 사용하는 사업장에 대한 현황 정보를 제공합니다.이 자료는 청도군 관내에 위치한 산업체 중 연료 또는 원료로 벙커C유(중질유)를 사용하는 업체의 기본 정보를 정리한 것으로,지역 내 에너지 사용 현황을 파악하고, 환경관리나 행정 점검, 연료 유형별 사업장 분포 분석 등에 활용할 수 있는 기초자료입니다.제공되는 항목에는 업소명, 소재지 주소, 전화번호, 주요 생산품, 연간 벙커C유 사용량, 데이터 기준일자가 포함되어 있으며,이를 통해 어떤 업종의 사업장이 중질유를 사용하는지, 연료 사용량이 얼마나 되는지, 어떤 지역에 밀집되어 있는지 등을 파악할 수 있습니다.벙커C유는 주로 대형 보일러, 건조기, 열처리 장비 등 고열을 필요로 하는 공정에서 사용되는 연료로,해당 자료는 청도군이 에너지 다소비 업종 현황을 파악하거나, 연료 사용 효율성 진단, 유해물질 저감 정책, 지역 내 탄소배출량 관리 등의 행정계획을 수립하는 데 도움이 됩니다.
