description_portal: 기상청에서는 기상기후 빅데이터와 타분야 빅데이터 간 융합분석을 통해 날씨의 영향을 고려한 과학적 의사결정과 문제해결을 지원하는 기상융합서비스를 제공하고 있습니다. 본 데이터는 농업과 관광업 분야의 기상융합서비스와 관련된 테이블입니다. 농작물 생산성 예측정보는 5대 농작물(양파, 마늘, 건고추, 배추, 무)의 생산성에 대한 예측 정보이며, 관광기후지수는 다양한 기상정보 및 관광정보를 활용하여 관광하기 적합한 날씨를 지수화한 정보입니다. 해당 정보는 기상청 날씨마루(bd.kma.go.kr)를 통해서도 웹 서비스 되고 있습니다.
