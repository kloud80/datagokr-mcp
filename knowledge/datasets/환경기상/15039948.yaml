summary_user: 부산 연제구에서 쓰는 종량제 쓰레기봉투를 제작업체·용도·규격(L)·재질·판매가·도매가별로 정리한 시군구 단위 소규모 파일(csv 약 1KB)이다. 연제구 주민이나 판매소 운영자가 '일반 쓰레기봉투 20L 소매가가 얼마이고 어느 업체가 만드나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 지자체 종량제봉투 가격 파일과는 시도·시군구 이름으로만 맞춰 비교한다.
