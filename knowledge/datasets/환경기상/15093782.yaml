summary_user: 속초시 관내 종량제봉투 판매처를 업소 한 곳당 한 행으로 담은 파일로, 판매처명·도로명/지번 주소·우편번호·위도·경도와 함께 종량제봉투, 가정용·120리터 음식물 납부필증, 대형폐기물 스티커, 특수규격봉투를 취급하는지 여부를 기록한다. 속초 시민이 "우리 집 근처에서 대형폐기물 스티커나 음식물 납부필증까지 파는 곳이 어디인가"를 찾을 때나, 분석가가 시내 판매소 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없으며, 위도·경도와 주소를 기준으로 다른 시군의 같은 종류 판매소 파일이나 수거함·재활용 정거장 위치 데이터와 공간·주소 단위로 겹쳐 쓴다.
description_portal: 본 데이터는 강원특별자치도 속초시 관내 종량제봉투 판매 정보 현황을 제공하는 자료이다. 시민이 생활폐기물 배출을 위해 필요한 종량제봉투 판매처 정보를 쉽게 확인할 수 있도록 판매업소명, 소재지, 연락처 등 정보를 정리하여 개방한다. 생활폐기물의 적정 배출과 시민 편의 향상을 목적으로 구축된 자료이며, 종량제봉투 구매 시 참고자료로 활용할 수 있다. 또한 지역 내 판매업소 현황과 판매처 정보를 제공하여 생활환경 관리와 공공서비스 이용 편의를 높이고자 한다. 데이터는 속초시 관내 종량제봉투 판매업소 현황을 기준으로 관리하며 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 지역 내 종량제봉투 판매업소 현황과 정보를 확인할 수 있다.
