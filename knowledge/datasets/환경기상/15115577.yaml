summary_user: 서울특별시 중랑구에서 대기오염물질 배출시설을 설치한 사업장의 인허가 정보를 사업장 단위로 담으며, 관리번호·인허가일자·영업상태와 폐업·휴업 일자, 주소, 업종·종별, 주요 생산품, 배출·방지시설 가동시간 등을 포함한다. 주민이나 분석가가 '우리 동네 주변에 영업 중인 대기 배출시설 사업장이 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 좌표(XCRD·YCRD)는 중부원점TM(EPSG:5174) 기준이라 지도 데이터와 겹칠 때 좌표 변환이 필요하다.
description_portal: '서울특별시 중랑구의 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
