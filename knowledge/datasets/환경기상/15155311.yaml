summary_user: 경기도 배출시설관리시스템에서 쓰는 공통코드를 코드분류(수질·대기·업종·산업단지 등)와 코드그룹 아래 코드·코드명·코드설명 단위로 담은 코드표이며, 건별 사업장 원천이 아니다. 경기도 배출시설 인허가 사업장 자료를 분석하는 사람이 업종이나 수질·대기 방지시설 코드값이 무엇을 뜻하는지 풀어 읽을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관 배출시설 데이터의 코드값(cd)이나 코드명 문자열로 맞춰 이어 쓴다.
description_portal: 이 데이터는 배출시설관리시스템에서 활용되는 공통코드 정보를 정리한 자료로, 배출시설 관리시스템에서 사용되는 코드 분류 및 세부 항목별 코드명을 제공합니다. 코드분류명에는 수질, 대기, 업종, 산업단지 등 다양한 환경관리 영역이 포함되며, 코드그룹명은 각 항목의 세부 주제를 명시하고, 코드와 코드명은 실제 시스템에서 사용되는 식별자 및 명칭 정보를 담고 있습니다. 예를 들어 "업종" 항목에서는 사업장의 산업코드가 제공되며, "수질"과 "대기" 항목에서는 환경 측정 및 오염 방지 관련 장치에 대한 코드가 포함됩니다. 이 데이터는 환경 관련 시스템 통합, 대기 및 수질 관리 체계 수립, 오염원 분석 등에 활용될 수 있으며, 항목 간 일관된 코드 체계를 기반으로 행정 업무의 표준화 및 데이터 연계가 가능합니다. 또한 "코드설명" 항목을 통해 지역 정보나 용도에 대한 부가적인 설명도 확인할 수 있습니다.
