summary_user: 전북특별자치도 내 녹색제품(환경표지) 인증을 받은 생산업체를 업체·인증 건별로 정리한 작은 파일(csv 약 2.8KB)로, 재활용 분야·인증 기준번호·규격명, 유효인증번호와 인증일자·만료일자, 업체명·대표자·소재지를 담는다. 전북에서 폐지·폐유리 같은 재활용 원료로 인증 제품을 만드는 업체가 어디에 있고 인증이 언제 끝나는지 확인하려는 구매 담당자나 환경정책 분석가가 쓴다. 전역 조인 키가 없어 업체명이나 소재지 주소를 기준으로 다른 환경 인증·업체 목록과 맞춰 이어 써야 한다.
