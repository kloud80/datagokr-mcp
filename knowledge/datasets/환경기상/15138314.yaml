summary_user: 국립생태원이 2018년 보고서 『한국산 최신 식물구계학적 특정종』 부록으로 낸 목록으로, 전국 식물 중 구계학적으로 중요한 종을 한 줄에 한 종씩 과명·국명·학명·등급으로 담은 비공간 종 목록이다. 환경영향평가나 보호구역 검토를 하는 분석가가 "조사지에서 확인된 이 식물이 식물구계학적 특정종이며 몇 등급인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 전국자연환경조사 종 분포 자료 같은 다른 종 목록과는 학명이나 국명을 맞춰 이어 쓴다.
limits: 지점·지역 정보가 없는 전국 단위 종 목록이라 종이 어디에 분포하는지는 이 데이터만으로 알 수 없다. 공통 코드 키가 없어서 다른 데이터와 연결하려면 학명·국명 표기를 직접 맞춰야 한다.
