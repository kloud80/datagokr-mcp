description_portal: '이 데이터는 국립생태원이 2018년 발간한 『한국산 최신 식물구계학적 특정종』 보고서의 부록으로 제공되는 목록으로, 전국 식물자원 중 식물구계학적으로 중요한 종을 선별하여 정리한 것입니다. 식물구계학적 특정종(Floristic Target Species, FT species)은 특정 지역의 식물상을 구성하는 데 있어 구분학적·지리적 중요성이 높은 종으로, 생물지리학적 경계 판단, 식물 분포 변화 탐지, 희귀·특산식물 관리 등의 기초자료로 활용됩니다. 목록에는 학명, 국명, 속명, 종별 등급(예: I~V등급) 등이 포함되어 있으며, 식물다양성 보전정책 수립, 생물지리 연구, 보호구역 설정, 환경영향평가에서의 활용도가 높습니다. 특히 이 목록은 국가식물다양성 DB 구축 및 갱신의 기초자료로도 활용되고 있습니다.'
