description_portal: 이 데이터는 2024년 4월 17일 기준으로 서울특별시 성북구 관내에 설치된 의류수거함의 위치 정보를 정리한 자료로, 각 수거함의 도로명주소, 지번주소, 위도·경도 좌표를 포함하고 있습니다. 연번과 설치 위치를 중심으로 구성되어 있으며, 성북구 전역에서 운영 중인 의류수거함의 분포와 접근성을 파악하는 데 활용될 수 있습니다. 이 자료는 폐의류 재활용 정책 수립, 생활자원 관리, 도시 환경 개선, 위치 기반 공공서비스 개발 등 다양한 행정·연구·민간 분야에서 활용 가치가 높은 기초 데이터로, 지역 내 재활용 인프라 현황을 확인하는 데 중요한 역할을 합니다.
