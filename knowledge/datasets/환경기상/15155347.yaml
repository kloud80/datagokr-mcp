summary_user: 경기도 내 사업장이 배출시설 자율점검제도에 참여하려고 낸 신청 내역을 사업장 한 건씩 담는다. 사업장명, 업종, 산업단지, 관할관청, 신청·승인일, 대기·폐수 등 신청분야, 지정요건, 지정기간, 처리상태 등 24개 항목으로 구성된다. 환경 행정 담당자나 분석가가 '어느 업종·산업단지 사업장이 대기·폐수 분야 자율점검을 많이 신청했고 승인까지 얼마나 걸렸나'를 볼 때 쓴다. 실측상 전역 조인 키는 없으므로, 사업자등록번호(bizregno)·사업장명·업종코드로 배출시설 인허가 사업장 원장 같은 오염원 사업장 데이터와 매핑해 잇는다.
description_portal: '이 데이터는 사업장이 자율점검제도에 참여하기 위해 신청한 내역을 기록한 자료로, 사업장명, 업종코드 및 업종명, 산업단지 여부, 관할관청, 자율점검 신청일, 승인일, 신청분야(대기, 폐수 등), 각 분야별 신청 대상 수(예: 대기 시설 수), 지정요건, 지정기간, 처리상태 및 등록일 등의 총 24개 항목으로 구성되어 있습니다. 자율점검은 사업장이 스스로 환경관리 기준을 점검하는 제도로, 이 데이터는 환경 행정의 효율성과 기업의 자율적 환경관리 수준을 파악하는 데 유용합니다. 이를 통해 분야별 자율점검 참여현황, 승인 진행 상태, 사업장 유형별 신청 추세 분석이 가능합니다.'
