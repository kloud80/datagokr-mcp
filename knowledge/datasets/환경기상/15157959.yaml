description_portal: 광주광역시 광산구에 위치한 무인회수기 관련 자료입니다.자료에는 시도명, 시군구명, 법정동, 도로명주소, 배출량이 기재되어 있습니다.무인회수기는 투명페트병 당 10포인트를 적립해주며, 1일 30개까지 투입이 가능합니다.포인트는 어플과 교통카드를 통해 적립이 가능하며, 계좌를 등록 시, 2,000포인트 이상 적립 시, 현금화가 가능합니다.탄소중립과 재활용 활성화를 위해 광산구에는 "23년 12월에 설치를 시작했으며, 현재  11개의 무인회수기가 설치되어 있습니다.25년 기준 457,782개의 투명페트병이 무인회수기를 통해 회수가 됐습니다.
