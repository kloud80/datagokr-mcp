summary_user: 울산광역시에서 관측된 철새의 종 정보(학명·영문·중문·일문명, 서식지·번식지·먹이·습성, 사진)와 관측지점별 위치(주소·위경도), 관측 연도·월, 관측 개체수를 담는 API로, 개별 관측지점 단위로 제공된다. 탐조객이나 생태 분석가가 '울산 어느 관측지점에서 어떤 철새가 몇 마리 관측됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 종 이름·학명(science_name)이나 위경도로 다른 생물종·보호구역 데이터와 이어 써야 하며, 종 조회 오퍼레이션에 필요한 종명 값은 먼저 다른 오퍼레이션에서 받아 넘긴다.
limits: 필수 파라미터인 종명(species_name)은 다른 응답에서 받은 값을 넘겨야 하고, 출현일·월별·연도별 관측 오퍼레이션 3개는 최소 파라미터 호출로 응답이 없어 6개 중 3개만 실호출이 확인됐다. 울산 한 시도만 다루며 전국 단위 비교에는 쓸 수 없다.
