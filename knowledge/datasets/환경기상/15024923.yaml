summary_user: 광주환경공단 광역위생매립장에서 발생한 침출수의 발생량과 처리량을 연·월 단위로 집계한 파일로, 월 합계와 일평균 값(세제곱미터)을 함께 담으며 파일 크기는 444바이트로 작다. 매립장 운영 분석가나 지역 환경 관심 주민이 '계절·연도에 따라 침출수 발생량이 어떻게 변하고 처리량이 발생량을 따라가는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 년도·월 기준으로 강수량 같은 월별 시계열과 맞대어 보거나 같은 기관(광주환경공단) 자료와 이름으로만 연결한다.
limits: 단일 매립장의 월별 집계라 건별·일자별 원천 기록이나 다른 매립장 비교에는 쓰지 못하며, 포털의 범위 표기는 '전국'이지만 실제 내용은 광주 광역위생매립장 한 곳이다. 폐기물 사업자·배출 사업장 원장이 아닌 처리현황 통계라 사업자번호 등으로 사업장 정보와 잇는 용도에는 맞지 않는다.
