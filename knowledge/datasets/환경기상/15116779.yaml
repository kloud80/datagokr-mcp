description_portal: 미세먼지로 인한 주민 건강피해를 최소하 하고자 무더위 쉼터 중 시설수준을 충족하는 일부시설에 대하여 미세먼지 쉼터로 지정·운영부산광역시 동래구 관내 미세먼지쉼터 현황에 대한 데이터입니다.미세먼지 쉼터는 미세먼지로 인한 시민 건강 피해 저감을 위해 공기청정기 구비 및 환기설비 설치 등 시설수준을 고려하여 지정·운영하고 있습니다.동래구 내에 설치되어 있는 미세먼지 쉼터의  구군명, 시설유형, 쉼터명, 도로명주소, 위도, 경도, 지정공간, 수용규모(명), 운영시간, 공기청정 설비 유무,  환기시설 설비 유무, 데이터기준일자 등의 항목을 제공합니다. 미세먼지 쉼터 운영기간  ○ 미세먼지 고농도 계절관리기간(12월~3월)  ※ 위 기간 외에도 미세먼지 고농도 발생시 추가 운영동래구 지정사항  ○ 무더위 쉼터 61개소(붙임1) 중  동래구노인복지관  1개소 및 경로당 60개소.
