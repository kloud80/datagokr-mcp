summary_user: 광산구에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 목록으로, 사업장명·주소·전화번호·폐기물구분·폐기물종류·데이터기준일자를 개별 주소 단위로 제공한다. 사업자나 주민이 "우리 동네에서 어떤 사업장이 어떤 종류의 폐기물을 배출 신고했는가"를 확인하거나, 분석가가 광산구 배출 사업장 분포를 파악하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 같은 기관(광산구) 자료끼리로만 연결한다.
limits: 광산구 한 개 시군구만 다루며, 배출량·처리 실적 같은 발생량·처리현황 통계는 담지 않는다. 사업자번호 등 공통 키가 없어 다른 기관 원장과의 정확한 결합은 이름·주소 매칭에 의존한다.
