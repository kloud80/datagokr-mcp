description_portal: 한국물기술인증원에서 운영중인 위생안전기준인증제도에 대한 기본정보 관련데이터를 제공합니다.(기업명, 대표자명, 도로명 주소, 지번 주소, 우편번호)해당 데이터는 기존의 위생안전기준인증제도의 정보시스템(인증원 설립 이후 통합인증정보망구축 이전 정보망, kctap)에서 추출한 데이터 입니다.현재 한국물기술인증원에서 신규 정보시스템을 구축하여 위생안전기준인증제도를 운영중이며, 향후 신규 포맷으로 데이터 제공 예정입니다.(기존의 위생안전기준인증제도 시스템 폐기)자세한 사항은 한국물기술인증원 통합인증정보망에서 확인하시기 바랍니다.https://portal.kwtc.or.kr
