summary_user: 제주특별자치도 서귀포시 관내 클린하우스(쓰레기 배출·분리수거 장소) 388곳을 지점별 1행으로 담은 원천 파일이며, 읍면동·위치·인근주소·데이터기준일자 필드로 구성된다. 주민이나 분석가가 우리 동네 클린하우스가 어디에 몇 곳 있는지, 읍면동별 분포가 어떤지 확인하는 데 쓴다. 인근주소(address)를 조인 키로 다른 주소 기반 자료와 이어 쓰고, 읍면동 단위로 묶어 집계할 수 있다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘클린하우스 현황’ 데이터는 관내에 설치된 쓰레기 배출·분리 수거 장소인 클린하우스의 위치 및 시설 정보를 정리한 공공데이터입니다.본 데이터는 읍면동, 단지명(설치 장소명), 클린하우스 형태, 도로명·지번 주소, 위도·경도 좌표 등의 필드를 포함하고 있어 쓰레기 배출 편의성, 재활용 접근성, 주민 환경 인프라 분포 파악에 유용합니다.이 자료는 자원 순환 정책 수립, 쓰레기 수거 네트워크 분석, CCTV 설치 기반 안전성 평가, GIS 기반 환경 인프라 지도 제작 등에 활용할 수 있으며 도시 환경 개선, 행정 효율화, 주민 환경 안내 시스템 구축 등의 다양한 공공 및 민간 현장에도 적용될 수 있는 핵심 데이터입니다.
