summary_user: 경기도 대기환경 관리·분석에 쓰는 권역 구분표로, 권역마다 권역코드(distrct_cd)·권역명·권역포함지역 세 항목을 담은 비공간 기준 자료다. 분석가나 담당자가 "경기 북부·남부 같은 생활권 단위로 미세먼지 평균을 내려면 어떤 시군을 묶어야 하나" 같은 질문에 시군별 측정값을 권역으로 묶는 기준표로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 대기질 측정 데이터와는 권역포함지역에 적힌 시군 이름을 매핑하거나 같은 기관 코드로만 연결한다.
description_portal: 「경기도 대기환경정보 권역관리」 데이터는 경기도 대기환경 관리·분석을 위한 행정적 권역 구분 체계를 제공합니다.각 권역은 권역코드, 권역명, 권역포함지역으로 구성되어 있으며, 이는 대기질 측정과 통계 산출 시 행정 단위보다 넓은 생활권 중심의 기준을 제시합니다이 권역 구분은 **도시별 데이터(세밀)**와 전체 경기도 데이터(광역) 사이에서, 권역별 대기환경 패턴을 분석할 수 있는 중간 단위의 지리적 기준을 마련합니다.따라서 이 데이터는 권역별 평균 대기질 현황, 오염물질 발생 특성, 정책 우선순위 결정에 활용될 수 있습니다.
