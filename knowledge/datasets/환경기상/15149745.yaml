summary_user: 오존(O3)·미세먼지(PM-10)·초미세먼지(PM-2.5) 같은 대기오염물질 항목별로 주의보·경보·중대경보의 발령 기준값과 해제 기준값을 담은 기준표이며, 측정값 원천이 아니라 항목당 한 행의 참조 데이터다. 경기도 주민이나 대기질 서비스 개발자가 '지금 측정된 초미세먼지 농도가 주의보 발령 기준을 넘었는가'를 판정할 때 기준값으로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 측정소별 시간 대기질 데이터와는 측정항목 코드·이름(item_cd, item_nm)을 맞춰 연결해야 한다.
description_portal: 이 데이터는 대기오염물질에 대한 주의보 및 경보 발령·해제 기준을 포함하고 있으며, 대기환경의 실시간 모니터링과 대응체계 구축을 위해 활용 할 수 있습니다. 오존(O3), 미세먼지(PM-10), 초미세먼지(PM-2.5)에 대한 주의보·경보에 대한 발령 및 해제 기준 정보를 제공합니다.*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
