summary_user: 「대기환경보전법」에 따라 관리되는 비산배출사업장의 이름과 도로명 주소를 사업장 한 곳당 한 행으로 담은 전국 단위 파일(csv, 약 78KB)이다. 환경감시 인력이 점검 대상 사업장의 위치를 확인하거나, 주민이 '우리 동네 근처에 비산배출사업장이 있는가'를 알아볼 때 쓴다. 공통 조인 키가 없어 다른 배출시설·사업장 데이터와는 사업장명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 환경부가 `대기환경보전법`에 근거하여 관리하는 비산배출사업장의 표준화된 위치 정보를 제공한다. 주요 데이터 필드로는 사업장명, 주소지 등이 포함되어 있으며 통일된 형식의 도로명 주소로 제공하여 데이터의 활용도와 정확성을 높이고자 하였다. 환경감시 인력의 현장 점검 경로 최적화, 오염확산 모델링의 설정, 지역별 환경 영향 평가의 기초 자료로 광범위하게 사용이 가능하다.  시민들에게는 주변 환경에 대한 알 권리를 충족시키고 정확한 위치 정보를 제공하는 기반 자료로 사용이 가능하다.
