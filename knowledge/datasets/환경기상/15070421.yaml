summary_user: '순환자원·자원순환·폐기물 재활용 분야에서 활동하는 협회·조합·센터 등 유관단체를 단체 1곳당 1행으로 담은 전국 목록 파일(csv, 약 8KB)로, 단체명·취급자원·키워드·주소·전화번호·홈페이지·등록/수정일시를 담는다. 재활용 사업자나 연구자가 "특정 폐자원(예: 폐플라스틱)을 다루는 협회나 조합이 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어서 다른 폐기물 처리업·배출자 데이터와는 단체명이나 주소를 직접 맞춰 보는 방식으로만 이어 쓸 수 있다.'
description_portal: 본 데이터는 국내에서 순환자원, 자원순환, 폐기물 재활용 등과 관련된 활동을 수행하는 유관단체(협회, 조합, 센터 등)에 대한 정보를 수록한 목록입니다.순환자원정보센터의 자료로 각 단체가 담당하는 취급 자원, 키워드, 주소, 연락처, 홈페이지, 등록일시 및 수정일시 등의 항목을 포함하고 있습니다.해당 단체들은 폐기물 재활용, EPR제도(생산자책임재활용), 방치폐기물 관리, 자원순환 정책 협력, 폐자원 산업 지원 등의 역할을 수행하며 관련 기업, 기관, 연구자, 정책 입안자 등에게 실무적으로 유용한 참고 자료가 될 수 있습니다.
