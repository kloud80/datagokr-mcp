summary_user: 대구광역시 관내에 등록된 환경측정대행업체를 업체별로 한 행씩 담은 등록현황 목록으로, 상호·대표자·전화번호·사업장 소재지·종별(대행분야)을 담는다. 측정을 맡길 사업자나 분석가가 '대구에서 대기·수질·악취 등 특정 분야 측정을 대행하는 업체는 어디이고 연락처는 무엇인가'를 찾는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 상호명이나 사업장 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대구광역시 관내 등록되어있은 측정대행업 업체명, 대표자, 소재지, 전화번호, 대행분야 현황 자료입니다. 대구광역시는 환경 분야 전문성을 갖춘 측정대행업체를 운영ㆍ관리하며, 이들 업체는 대기, 수질, 소음·진동, 실내공기질, 악취 등 다양한 환경 항목에 대한 측정 서비스를 제공하며,  대기,수질,실내공기질,소음진동,악취 총 5개 측정대행 분야를 고루 대응하며, 국립환경과학원의 숙련도 평가에서 적합 판정을 받는 등 전문성과 신뢰성을 확보하고 있습니다.  문의전화는 대구시  환경정책과(803-3684)로 연락주시기 바랍니다.
