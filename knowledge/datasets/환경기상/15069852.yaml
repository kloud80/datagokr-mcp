summary_user: 해양환경공단 해양환경측정망 가운데 하천영향 및 반폐쇄성 해역의 정점별 CTD 조사자료로, 생태구·정점·관측년월·수심마다 수온과 염분 측정값을 담은 건별 관측 파일(CSV 약 191KB)이다. 연구자나 지자체 담당자가 "하천이 흘러드는 내만 정점에서 계절에 따라 수온·염분의 수직분포가 어떻게 달라지는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 해양수질 측정망 자료와는 정점명·생태구명과 관측년월을 이름으로 맞춰 이어 쓴다.
