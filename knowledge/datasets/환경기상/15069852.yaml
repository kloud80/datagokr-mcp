description_portal: 해양환경공단이 운영하는 해양환경측정망 중 하천영향 및 반폐쇄성 해역을 대상으로 한 CTD 조사자료를 제공합니다. 본 데이터는 수온, 염분, 수심 등 수질 수직분포 특성을 포함하며, 하천 유입 및 해수 순환이 제한된 해역의 해양환경 상태를 정밀하게 파악하기 위해 활용됩니다. 조사는 정점별로 수심에 따라 CTD 센서를 활용하여 수행되며, 수질 변화의 계절성, 공간적 차이, 오염 특성 등을 분석할 수 있습니다. 데이터는 조사해역, 조사정점, 항목별 측정값, 조사시기 등으로 구성되며, 공공기관, 연구기관, 지자체 등에서 해역 수질평가, 장기변화 분석, 환경영향검토 등의 기초자료로 활용됩니다.
