description_portal: '원전부지 반경 50km 이내에서 발생한 지진에 대한 발생 현황 정보를 공개합니다. 공개 정보는 번호, 규모, 발생년월일, 위도, 경도, 깊이(단위: km), 발생지역, 거리(단위: km), 해당부지, 원전인근가속도값(단위: g) 항목으로 구성되어 있습니다.데이터는 2019년 1월 발생현황부터 공개하며, 반기별로 신규 발생현황을 누적하여 공개하고 있습니다. 원전인근 가속도값 항목의 지진 가속도 g는 지진으로 인해 지반이 흔들리는 정도를 나타내는 단위로, 중력 가속도(9.8 m/s²)를 기준으로 표현됩니다. 보통 최대 지반 가속도(PGA, Peak Ground Acceleration)의 단위로 사용되며, 지진의 세기를 나타내는 지표 중 하나입니다.'
