summary_user: 인천광역시에 등록된 동물원을 한 곳당 한 행으로 담은 파일로, 동물원명·소재지 주소·등록일·보유동물 요약·운영 방식·실내형 여부·총면적·상근/촉탁 수의사 수·사육사 수가 들어 있습니다(CSV 816바이트의 소규모 목록). 시민이나 연구자가 '인천에 등록된 동물원은 어디이고, 규모와 수의사·사육사 인력은 어느 정도인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 동물원명이나 소재지 주소를 매칭해 연결해야 하며, 주소를 지오코딩하면 다른 시도 동물원 현황이나 야생동물 관련 공간 데이터와 겹쳐 볼 수 있다.
description_portal: '1. 목록명: 인천광역시 동물원 연보 자료2. 키워드: 동물원, 동물원 소재지, 보유 동물, 야생동물, 포유류, 조류, 파충류, 양서류3. 포함한 데이터: 동물원명, 동물원 소재지, 보유동물 수, 운영형태, 총면적, 수의사 수, 사육사 수)4. 데이터 설명: 인천광역시 내 등록된 동물원에 대한 데이터를 제공하고 있습니다. 이 데이터는 동물원 명, 동물원 소재지, 동물원 등록일자, 보유동물 수, 운영방법, 실내형 여부, 동물원 총 면적, 상근수의사 수, 촉탁수의사 수, 사육사 수 등의 항목이 포함되어 있습니다. 이를 통해 인천광역시 동물원 운영 형태와 등록 정보를 확인할 수 있으며, 데이터는 연간 업데이트되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드받을 수 있으며, CSV 형식으로 제공됩니다.'
