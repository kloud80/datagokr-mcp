description_portal: 이 데이터는 2020년부터 2022년 6월까지 전국 시군구별로 발생한 코로나19 관련 의료폐기물의 월별 발생량을 정리한 통계 자료입니다. 코로나19 유행에 따라 진료소, 선별진료소, 생활치료센터, 임시병상 등에서 배출된 폐기물의 양을 공공기록으로 관리한 자료로, 감염병 대응 및 폐기물 처리 인프라 확보에 참고 자료가 됩니다. 시간적·공간적 분석, 수거 계획 수립, 소각시설 수용능력 평가, 위기 대응 역량 분석 등 다양한 용도로 활용 가능하며 질병관리청, 환경부, 지자체, 폐기물 처리 기업, 환경 연구기관 등이 감염병 관련 위기 대응 역량 강화 및 시설 용량 계획 수립의 기초자료로 활용할 수 있습니다.
