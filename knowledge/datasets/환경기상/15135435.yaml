summary_user: 경기도 대기환경 진단평가시스템의 운영 상태와 메뉴별 접근 기록을 실행 시점(타임스탬프)과 메뉴 아이디 단위로 쌓은 건별 시스템 로그이며, 공간 단위가 없는 시도 범위 자료로 대기오염 측정값은 들어 있지 않다. 시스템 관리자나 분석가가 '특정 날짜에 어떤 메뉴가 언제 몇 번 실행됐나'를 보며 운영 모니터링, 오류 추적, 이용 패턴 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소 대기질 자료와 직접 이어지지 않으며, 날짜나 메뉴 이름 매핑, 같은 기관 코드로만 맞춰 볼 수 있다.
description_portal: 경기도_대기환경_진단평가시스템_시스템상태정보 데이터는 시스템의 **운영 상태와 메뉴별 접근 기록(로그)**을 시간 단위로 저장한 자료입니다. 주요 항목은 날짜(타임스탬프), 메뉴아이디, 날짜형식(연·월·일), 변환된 날짜코드 등으로 구성되어 있습니다. 메뉴 아이디는 시스템 내부 기능이나 화면을 나타내며, 각각의 실행·접속 시점이 밀리초 단위 시간으로 기록됩니다.이 데이터는 시스템이 언제 어떤 메뉴가 실행되었는지, 특정 일자에 어떤 로그가 쌓였는지를 추적할 수 있어, 관리자가 운영 모니터링, 오류 추적, 사용 패턴 분석에 활용할 수 있습니다.
