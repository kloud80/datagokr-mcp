summary_user: 인천광역시 서구(서해구) 안에서 벙커C유를 쓰는 사업장을 한 곳씩 담은 건별 목록으로, 사업장명·지번/도로명 주소·전화번호·생산품·연간 사용량(킬로리터/년)을 포함하며 받은 CSV 파일은 212바이트로 몇 건 되지 않는 작은 규모입니다. 지역 대기환경 담당자나 분석가가 '우리 구에서 벙커C유를 많이 태우는 사업장이 어디이고, 어떤 제품을 만들며 연간 얼마나 쓰는가'를 확인할 때 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 배출원 원장과는 사업장명이나 주소를 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 벙커C유를 사용하는 사업장의 현황을 정리한 데이터입니다. 본 공공데이터는 업체명, 주소, 전화번호, 연간 사용량 등으로 구성되어 있습니다.본 데이터는 지역 내 벙커C유 소비 실태를 파악하고, 대기오염 저감 정책 수립, 에너지 효율향상 방안 도출등에 활용될것으로 판단됩니다.또한 산업용 연료별 소비 추이와 환경적 영향을 분석해 지역 환경정책 수립의 기초자료로 제공될것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
