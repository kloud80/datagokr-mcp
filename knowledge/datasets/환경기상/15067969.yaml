description_portal: 본 데이터는 지하수 오염을 예방하기 위해 법적으로 규제되는 물질과 이용 목적별 허용 기준을 상세히 정리한 자료입니다. 일반오염물질과 특정유해물질 등 지하수 오염물질을  수소이온농도(pH), 총대장균군, 질산성질소(NO3-N), 염소이온(Cl-), 카드뮴(Cd) 등으로 구체적으로 나누어 생활용수, 농어업용수, 공업용수로 구분한 용도별 허용기준값을 정확한 수치로 제시하고 있 습니다. 이를 통해 지하수 수질 관리 및 보호 정책 수립, 지하수 위해성 평가, 수질 오염 정화기술 개발 및 환경영향평가 보고서 작성 등에 유용하게 활용할 수 있는 기초자료로서의 가치가 높습니다.
