summary_user: 광주광역시 남구 양과동 가연성폐기물 연료화시설(일일 처리용량 800톤) 한 곳의 운영 현황을 대·중·소분류 항목별로 연도(2017·2018·2022~2024년) 열에 담은 집계표로, 폐기물 반입량·고형연료 생산량·처리 잔재물량 등을 다룬다. 지역 환경 분석가나 시민이 '광주 연료화시설에 들어온 폐기물 대비 고형연료가 얼마나 생산되고 잔재물은 얼마나 나왔나'를 연도별로 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 폐기물 처리시설 자료와는 시설명·기관명으로만 맞춰 이어 쓴다.
description_portal: 광주광역시 폐기물 처리시설(가연성폐기물 연료화시설) 운형 현황에 대한 데이터입니다. 광주광역시 가연성 폐기물 연료화시설은 광주광역시 남구 양과동에 위치하고 있으며 일일 처리요량 800톤입니다. 가연성폐기물 연료화시설 운영사는 청정빛고을(주)에서 운영하고 있으며 2017 ~ 2031년 까지 운영계약이 체결되어 있습니다. 가연성폐기물 연료화 시설 에 과한 데이터는 가연성폐기물 연료화시설에 반입외는 폐기물 반입량, 시설에서 생산하는 고형연료량, 처리과정에서 발생하는 잔재물량 등의 항목을 제공합니다.
