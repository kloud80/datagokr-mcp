description_portal: 해양환경공단이 제공하는 ‘해양쓰레기 모니터링 통계_1기조사방법_시기별’ 데이터에 대한 정보를 제공합니다. 본 데이터는 1기 조사방법론을 적용하여 실시한 해양쓰레기 모니터링 결과를 시기별로 집계한 통계 자료를 포함합니다. 주요 내용에는 조사 정점 위치, 조사 시기, 부유·침적·유입 쓰레기 등 발생 형태, 시기별 발생량과 재질별 특성, 계절적 분포 경향이 수록됩니다. 또한 시기별 오염원 분석, 발생량 변동 원인, 관리·감축 대책 수립에 필요한 기초자료를 제공합니다. 이를 통해 해양쓰레기의 시기적 특성과 발생 패턴을 파악하고, 효과적인 관리 시기와 정책 우선순위를 설정할 수 있습니다. 해당 자료는 공공기관, 연구기관, 지자체, 환경단체 등에서 해양보전 정책, 자원관리 계획, 연구 분석, 환경교육 등 다양한 목적으로 폭넓게 활용됩니다.
