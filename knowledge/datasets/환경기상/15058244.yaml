summary_user: 경기도 내 대기총량 관리사업장의 수를 집계일자·시군·관리대장 구분·업종별로 묶어 담은 집계 자료로, 개별 사업장 단위 원장이 아니다. 지자체 담당자나 환경 분석가가 '우리 시군에 대기총량 관리 대상 사업장이 어떤 업종에 몇 곳 있는가'를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)를 기준으로 경기도의 다른 시군별 통계와 이름·코드를 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 대기총량 관리사업장의 현황을 집계한 자료로, 지역별 및 업종별로 사업장 수를 확인할 수 있습니다. 주요 항목으로는 집계일자(SUM_DE), 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 관리대장구분명(MANAGE_REGSTR_DIV_NM), 업종명(INDUTYPE_NM), 사업장수(BIZPLC_CNT)가 포함되어 있습니다. 이 데이터는 대기오염 저감 및 관리 정책 수립을 위한 기초자료로 활용될 수 있으며, 미세먼지·대기오염 배출 특성을 파악하거나 산업별 배출규제 정책의 효과성을 평가하는 데 유용합니다. 또한 환경 연구기관, 지자체, 산업계에서 대기환경 개선 계획 수립 및 지속가능한 산업 활동 모니터링 자료로도 활용될 수 있습니다. 데이터는 Open API 형식으로 제공되어 다양한 시스템 및 분석 도구에서 연계 활용이 가능합니다.
