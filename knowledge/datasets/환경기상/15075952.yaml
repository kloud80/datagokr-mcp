description_portal: '폭염 영향예보는 폭염 현상으로 인해 예상되는 분야별 영향도를 고려하여 발표하는 예보를 말합니다.폭염의 위험수준을 알려주고, 폭염 피해에 대비할수 있도록 보건(일반인) 분야 관심단계 이상이 예상될 때, 전일 오전 11시 30분에 발표하고 있습니다.< 위험단계 구분 >- 관심: 일상적인 활동이 조금 불편한 수준, 취약한 대상에서는 일부 피해가 예상되는 수준- 주의: 해당 지역 일부에서 다소 피해가 예상되는 수준- 경고: 해당 지역 곳곳에서 현저한 피해가 나타나 영향이 단기간 지속될 것으로 예상되는 수준- 위험: 해당 지역 대부분에 피해가 있고, 곳곳에 극심한 피해가 나타나 영향이 장기간 지속될 것으로 예상되는 수준'
