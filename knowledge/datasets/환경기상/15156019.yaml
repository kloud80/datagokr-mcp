description_portal: 해당 데이터는 경기도 양평군에서 2025년 1월 1일부터 12월 08일까지 포획된 유해야생동물에 대한 현황을 담고 있으며, 주요 대상은 멧돼지와 고라니입니다. 수록 항목은 포획 날짜, 포획종류, 개체수, 포획 장소 주소 및 좌표(위도,경도), 무게, 성별(암수)입니다. 이 데이터는 야생동물로 인한 농작물 피해를 줄이기 위한 포획 실적을 기록하고 분석하는 데 활용되며, 생태계 보전 정책 수립의 기초자료로 쓰일 수 있습니다. 또한 지역 주민의 안전관리 및 환경정보 공개 목적에도 활용됩니다. 야생생물 보호 및 관리에 관한 법률 제23조(유해야생동물의 포획허가 등), 야생생물 보호 및 관리에 관한 법률 시행규칙 제30조(유해야생동물의 포획허가)
