summary_user: 대구광역시 북구에 설치된 클린지킴이(무단투기 감시 장비)를 장비 한 대씩 담은 API로, 관리 번호·행정동·설치 위치·규격·영상 기록 여부·관리 책임·최초 설치일·최근 이전일을 제공하며 범위는 북구 한 개 시군구, 위치 단위는 읍면동입니다. 북구 주민이나 담당 공무원이 '우리 동네 어디에 무단투기 감시 장비가 있고 영상 기록이 되는가', '최근에 옮겨진 장비는 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 설치 위치 주소를 매핑해 다른 생활폐기물 배출·수거 지점 데이터와 붙여 쓴다.
description_portal: 입력 파라미터를 이용하여 대구광역시_북구청_클린지킴이 데이터의 관리 번호, 행정동, 관리 책임 여부, 영상 기록 여부, 규격, 설치 위치, 최초 설치 일, 최근 이전 일 항목을 조회하는 서비스고정식 클린지킴이는 전신주에 연결되거나 태양열 전지판을 통해 전력을 공급받고 이동식 클린지킴이는 배터리나 태양열 전지판을 통해 전력을 공급받음이동식 클린지킴이는 바퀴가 달려있어 이동이 간편하여 민원에 신속한 대응이 가능하나 지지대에 고정을해야 넘어지지 않으므로 지지대가 없는 지역에는 설치가 불가능함고정식 클린지킴이는 이동시에 행정예고 및 이동비용이 발생하여 고정식은 추가도입은 지양하고있음
