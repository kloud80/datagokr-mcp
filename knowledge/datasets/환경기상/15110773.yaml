summary_user: 제주특별자치도 해양수산연구원이 마을어장 주변 연안 정점을 현장 조사해 측정 연도·월, 정점명, 수층별로 수온·염분 등 수질 값을 기록한 건별 측정 자료로, 각 정점의 위도·경도 좌표가 함께 들어 있다. 어업인·양식 사업자나 연구자가 '특정 마을어장 연안의 수온과 염분이 계절·연도에 따라 어떻게 변했나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서 정점명 이름 매칭이나 위도·경도 좌표 기반 공간 결합으로 다른 해양·어장 자료와 이어 쓴다.
description_portal: '"제주특별자치도 내 연안 해양환경 모니터링 데이터를 제공합니다.항목: 측정 연도, 측정 차수, 정점명, 정점 유형, 위도, 경도, 수층, 수심, 수온, 염분 등* 제주특별자치도 내 마을어장의 해양 환경과 수질 상태를 체계적으로 조사한 자료입니다.제주특별자치도 해양수산연구원이 계절별·해역별로 현장을 방문하여 수집한 것으로, 마을어장과 주변 연안 생태계의 환경 변화를 장기적으로 관찰하고 기록한 것이 특징입니다. 데이터는 제주도 연안 해역의 환경 관리와 어장 관리, 생태계 연구에 활용될 수 있으며, 이를 통해 해양 환경의 변화를 이해하고 지속 가능한 수산업 및 어장 운영 전략을 수립하는 데 중요한 기초 자료로 사용됩니다.* 활용 분야 : 해양 환경 분석, 양식업 환경 관리, 해양 생태계 연구, 정책 및 행정 지원 등"'
