summary_user: 부산광역시 서구에 설치된 폐건전지·폐형광등 수거함을 한 곳당 한 행으로 담은 원천 목록 파일(CSV 약 1KB)로, 시군구명·주소·전화번호·데이터기준일자를 담는다. 서구 주민이 집 근처에서 다 쓴 건전지나 형광등을 어디에 버릴 수 있는지 찾을 때, 또는 분석가가 구별 수거함 분포를 비교할 때 쓴다. 전역 조인 키나 좌표가 없어 다른 데이터와는 주소 문자열이나 시군구명으로만 맞춰 이어야 하며, 다른 지자체의 같은 종류 수거함 파일과 합쳐 쓰는 방식이 현실적이다.
limits: 공통 코드나 좌표 같은 조인 키가 없어 지도 표시나 다른 데이터 연계에는 주소를 따로 지오코딩·정제해야 한다. 범위가 서구 한 곳에 그치므로 부산 전체나 전국 현황은 지자체별 파일을 모아야 한다. 수거량이나 처리 실적 같은 통계는 담지 않는다.
