summary_user: 서울 금천구에서 쓰레기 종량제봉투를 파는 판매소를 한 곳씩 상호명·동·도로명/지번주소·위도·경도로 담은 개별 지점 목록이다(파일 약 62KB, 금천구 범위). 주민이 우리 동네에서 종량제봉투를 살 수 있는 가까운 가게가 어디인지 찾거나, 분석가가 동별 판매소 분포를 보고 판매소가 부족한 지역을 가늠하는 데 쓴다. 전역 조인 키는 없어 동 이름이나 주소로 행정구역 자료와 맞추거나, 위도·경도로 지도 위에서 다른 생활폐기물 배출·수거 지점 자료와 겹쳐 쓴다.
description_portal: '이 자료는 서울특별시 금천구의 운영 중인 쓰레기 종량제 봉투 판매소 수를 동별로 정리한 내용입니다.주민 여러분께서는 이 현황을 통해 우리 구 내에서 종량제 봉투를 구매할 수 있는 판매소가 어느 정도 분포되어 있는지 확인하실 수 있습니다. 이를 바탕으로 가까운 동네에 판매소가 얼마나 있는지 파악하거나, 판매소 확대가 필요한 지역을 함께 살펴보는 데 활용할 수 있습니다.우리 구는 앞으로도 쓰레기 종량제 봉투 구매가 더욱 편리하도록 최선을 다할 것이며, 관련 정보도 투명하게 공개하여 주민 여러분과의 소통을 강화하겠습니다. (담당부서 : 금천구 청소행정과)※ 본 파일데이터는 2025년 10월까지의 자료만 취급합니다. 이후의 최신 데이터는 "서울특별시_금천구_종량제봉투판매소" 표준데이터셋을 활용하시기 바랍니다.'
