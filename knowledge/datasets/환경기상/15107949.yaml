summary_user: 국립공원별 조망점·계곡·암릉·전통마을 등 자연·인문 경관자원을 한 건씩 담은 파일로, 자원분류·자원명·100대경관 여부·주소·경도·위도를 담는다(전국 범위, zip 약 194KB). 탐방객이나 관광 콘텐츠 기획자가 '특정 국립공원 안에서 100대 경관으로 꼽힌 조망점은 어디이고 좌표는 무엇인가'를 찾을 때, 분석가가 공원 경관 관리계획의 기초 자료를 정리할 때 쓴다. 전역 조인 키는 없어서 국립공원 이름으로 다른 국립공원 탐방·용도지구 자료와 맞추거나, 경도·위도로 공간 레이어와 겹쳐 본다.
description_portal: 「국립공원 경관자원」 데이터는 국립공원 내 자연경관 및 인문·문화경관 등 다양한 경관 요소에 대한 위치 및 속성 정보를 수록한 자료입니다. 주요 항목에는 조망점, 계곡, 암릉, 호수, 숲길, 일출·일몰 명소, 전통마을, 문화유산 경관 등 공원별 경관적 가치가 높은 요소들이 포함됩니다. 해당 자원은 경관의 아름다움, 희귀성, 상징성, 접근성 등을 종합적으로 평가하여 지정되며, 국립공원공단의 현장조사와 전문가 자문을 바탕으로 구축됩니다. 공원경관 관리계획 수립, 탐방로 안내, 환경영향평가, 관광 콘텐츠 개발, 자연자원 해설 등에 활용됩니다. 특히 국립공원의 경관우수 구간 및 보호 대상 지정 시 핵심 근거자료로 사용되며, 지속가능한 경관보전과 이용을 위한 정책 설계에도 기여합니다.
