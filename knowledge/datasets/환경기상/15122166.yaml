description_portal: 본 데이터는 부산환경공단 수영사업단에서 반입되는 음식물쓰레기 처리 과정의 계근정보를 기록한 자료이다. 거래업체별로 차량번호, 품명, 입·출고 여부, 계근시간(입고·출고 시각), 1차·2차 계량값, 실중량(kg), 리터환산 값 등이 포함되어 있으며, 사업소 단위로 거래 현황을 관리할 수 있도록 구성되어 있다. 이를 통해 음식물쓰레기 반입량의 정확한 측정, 업체별 반입 패턴 분석, 처리량 통계 산출이 가능하다. 또한 계근정보는 투명한 자원 순환 관리와 더불어 처리 효율성을 높이기 위한 정책자료로 활용될 수 있다.
