status: active
summary_user: 부산환경공단 수영사업단에 반입되는 음식물쓰레기의 계근 기록을 전표(ser_no) 한 건 단위로 담으며, 거래업체·차량번호·품명·입출고 구분과 1차·2차 계량값, 계근 시각, 실중량(kg)·환산중량을 포함한다. 음식물쓰레기 처리 행정 담당자나 분석가가 특정 거래업체나 차량이 날짜별로 얼마나 반입했는지, 반입이 몰리는 시간대가 언제인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 거래업체명·차량번호 같은 이름 매핑이나 같은 기관의 사업단/소 코드(ac_unit)로만 이어 쓴다.
limits: 사업자등록번호 같은 전역 키가 없어서 폐기물 처리업 허가·배출자 원장과 바로 조인할 수 없고, 업체명 매칭에 기대야 한다. 포털 설명상 부산 수영사업단의 반입 기록이므로, 메타데이터에 범위가 '전국'으로 표기돼 있어도 전국 반입량으로 해석하지 않는다.
