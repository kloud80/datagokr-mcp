summary_user: 서울 동대문구에 있는 음식물류 폐기물 다량배출사업장을 업소 한 곳당 한 행으로 담은 파일이며, 업소명·사업장구분(일반음식점·집단급식소·대규모점포 등)·소재지·전화번호가 들어 있다. 구청 담당자나 분석가가 동대문구에서 음식물 쓰레기를 많이 내는 사업장이 어디에 몇 곳 있는지, 업종별로 어떻게 나뉘는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '서울특별시 동대문구에 위치한 음식물류다량배출사업장정보에 대한 데이터로 업소명, 사업장구분, 주소 등이 포함되어 있습니다.  □ 음식물류 폐기물 다량배출사업장 구분    ◦ 일반음식점 : 신고 영업장 면적 200㎡이상    ◦ 휴게음식점 : 신고 영업장 면적 200㎡이상         ※ 휴게음식점중 다류, 아이스크림 매장 300㎡까지 제외 ➝ 카페 제외    ◦ 집단급식소 : 1일 평균 총 급식인원 100인 이상                     유치원 200인 이상 (개정 2016.6.30.)    ◦ 농수산도매시장, 농수산물공판장, 농수산물종합유통센터    ◦ 대규모점포 : 매장면적 합계 3,000㎡ 이상    ◦ 관광숙박업소(관광진흥법 제3조제1항제2호)   ※ 제외: 폐기물관리법 제17조제2항에 따른 사업장폐기물배출자(개정2016.6.30.)'
