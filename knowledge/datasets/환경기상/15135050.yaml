description_portal: '수도권매립지관리공사는 매립 후 5시간 이내 복토 작업을 통해 폐기물의 흩날림, 해충서식, 냄새발생, 빗물침투 등을 방지합니다.폐기물 분해과정에서 발생하는 매립가스를 포집하여 전력생산 및 악취방지의 효과를 달성하고 있으며,매립시설 바닥에 차수시설을 설치하여 지하수 오염을 차단하고, 침출수를 모아 처리하고 있습니다.매립장 메탄농도정보는 매립장 관리와 환경 모니터링에 중요한 역할을 합니다. 주요 제공정보는 다음과 같습니다.개방항목 : 측정일자, 매립장메탄가중평균농도, 1매립장메탄평균농도, 2매립장메탄평균농도, 1매립장메탄가중평균농도, 2매립장메탄가중평균농도 등의 항목을 제공합니다.'
