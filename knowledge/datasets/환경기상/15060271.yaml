summary_user: 서울 동대문구에서 사업장폐기물 배출자 신고를 마친 업체별로 업체명·소재지·전화번호와 배출하는 폐기물 항목을 담은 건별 목록 파일(csv, 약 2KB 소규모)이다. 관내 사업장 폐기물 관리 담당자나 환경 분석가가 '동대문구에서 어떤 업체가 어떤 종류의 사업장폐기물을 배출 신고했는가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호 컬럼이 없어, 다른 데이터와는 업체명·소재지 주소를 맞춰 보거나 같은 구의 폐기물 처리업 현황과 이름으로 대조해 잇는다.
