summary_user: 대구광역시 달서구의 실내공기질 관리대상시설(도서관·의료기관·노인요양시설·PC방 등 다중이용시설)을 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·주소·행정동·위도·경도·자료 기준일자를 담는다. 주민이나 분석가가 '우리 동네 어느 시설이 실내공기질 관리대상인가'를 확인하거나, 달서구 안 관리대상시설의 행정동별 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 주소·위경도 좌표로 다른 시설·대기질 자료와 맞춰 이어 쓴다.
description_portal: 다중이용시설, 신축되는 공동주택 및 대중교통차량의 실내공기질을 알맞게 유지하고 관리함으로써 그 시설을 이용하는 국민의 건강을 보호하고 환경상의 위해를 예방함을 목적으로 대구광역시 달서구에서 실내공기질 관리대상시설에 대해 정리한 자료를  파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.시설구분, 시설명, 주소, 행정동, 경도, 위도, 자료 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다. 실내공기질 관리법에 인한 적용대상에는 도서관, 박물관, 의료기관, PC영업시설, 노인요양시설 등이 있습니다.
