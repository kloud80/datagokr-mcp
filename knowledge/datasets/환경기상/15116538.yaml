summary_user: 인천광역시 미추홀구 관내 황색봉투(종량제 규격봉투)와 PP마대를 파는 판매소를 한 곳씩 판매소명·주소·위도·경도로 담은 개별 지점 목록이다(CSV 약 10KB). 주민이 우리 동네에서 종량제봉투나 대형폐기물용 마대를 어디서 살 수 있는지 찾거나, 구청·분석가가 판매소 분포를 지도에 올려 공백 지역을 점검하는 데 쓴다. 전역 조인 키나 코드 필드는 없어서, 다른 데이터와는 주소 문자열이나 위도·경도 좌표 기준의 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 관내 황색봉투 및 PP마대 판매소 현황을 수록한 자료입니다. 황색봉투와 PP마대는 생활폐기물 및 대형폐기물을 적정하게 처리하기 위해 필요한 규격봉투로, 주민들이 가까운 판매소에서 손쉽게 구입할 수 있도록 지정된 장소에서 공급됩니다. 데이터에는 판매소명, 주소, 위도, 경도 항목이 포함되어 있으며, 이를 통해 판매소의 위치를 정확히 확인할 수 있습니다. 판매소는 씨유(CU) 편의점, 웰빙DC마트, 인광슈퍼, 공원식품 등 다양한 슈퍼마켓 및 편의점에서 운영되고 있어 주민들이 생활권 내에서 쉽게 접근할 수 있습니다. 본 자료는 주민들에게 폐기물 처리 절차의 편의성을 제공하고, 행정기관에는 판매소 관리와 공급망 점검을 위한 기초자료로 활용됩니다. 또한 위도·경도 좌표를 포함하여 위치 기반 서비스를 통해 지도로 시각화할 수 있어 판매소 분포를 직관적으로 파악할 수 있습니다. 데이터는 정기적으로 갱신되어 최신 판매소 현황을 반영하며, 주민 생활 편의 증진과 올바른 폐기물 처리 문화를 정착시키는 데 기여합니다.
