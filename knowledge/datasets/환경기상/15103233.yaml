summary_user: 경기도 내 등록 동물원을 동물원 한 곳당 한 행으로 담으며, 시군명·동물원명·소재지 주소·운영구분·운영 형태(전시관람형, 테마파크형 등)·면적·보유 동물종 수와 개체 수·데이터 수집일자를 포함한다. 동물복지 담당자나 연구자가 '경기도 시군별로 민간 동물원이 몇 곳이고, 면적 대비 동물 개체 수가 얼마나 되는가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)이나 주소 문자열을 매핑해 붙여야 한다.
description_portal: '이 데이터는 경기도 내 동물원들의 운영 현황을 정리한 자료로, 시군명, 동물원명, 소재지 주소, 운영구분(예: 민간), 운영 형태(전시관람형, 테마파크형 등), 동물원 면적(㎡), 보유 동물종 수, 보유 동물 개체 수, 데이터 수집일자 등의 항목으로 구성되어 있습니다. 민간이 운영하는 다양한 형태의 동물원에 대한 정보를 제공하며, 공간 규모와 보유 동물 현황을 통해 시설의 규모와 운영 특성을 파악할 수 있습니다. 해당 데이터는 동물복지 정책 수립, 지역 문화시설 분석, 민간동물원 등록 관리, 공간 활용도 분석 등 다양한 공공 및 연구 목적으로 활용될 수 있으며, 동물종 다양성과 관리 실태 분석을 위한 기초자료로도 적합합니다.'
