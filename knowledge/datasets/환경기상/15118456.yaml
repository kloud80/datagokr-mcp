description_portal: '자료 설명 : 본 자료는 국내 표준유역(총 850개)에 대해 위성영상 및 수치모델을 활용하여 추정한 토양수분량 자료입니다. 토양 내 수분량을 m³/m³ 단위로 환산하여, 일 단위로 유역별 평균값을 제공합니다.항목명 : 일별 표준유역 단위 토양수분량자료정의 : 토양수분량은 토양 내 단위부피당 포함된 물의 부피의 비율구축목적 : 전국 단위 토양수분 현황 파악 및 물순환 분석, 가뭄 예측 등에 활용 가능한 기초자료 제공주요 활용분야 : 가뭄 및 홍수 예측, 물수지 분석, 수문모델 입력자료, 기후변화 영향 평가 등유의사항 : 울릉도 미제공 사유 : 위성영상자료의 픽셀데이터 해상도 영향으로 소유역에 대한 모의 불가'
