summary_user: 부산광역시 동래구 관내 약수터별로 시설명, 지번주소와 1~4분기 수질검사 결과를 한 행씩 담은 작은 파일(약 723바이트)이다. 동래구 주민이 집 근처 약수터 물이 이번 분기 수질검사에서 적합했는지 확인하거나, 분석가가 구 단위 약수터 수질 관리 현황을 살펴볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명이나 지번주소를 맞춰 붙이거나, 같은 기관의 다른 약수터·지하수 자료와 이름 기준으로 연결해야 한다.
limits: 동래구 한 곳만 다루므로 부산 전체나 다른 구 약수터와 비교하려면 각 구 자료를 따로 모아야 한다. 공통 코드가 없어 주소 문자열 매칭에 의존하며, 기관 안내대로 항목이 바뀌거나 삭제될 수 있다.
