summary_user: 인천광역시 남동구 관내에서 환경오염 자율점검업소로 지정된 사업장을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 주소·업종·배출시설 종류·주요 관리분야·지정요건·지정일과 만료일을 수록한다(csv 약 3KB 규모의 소량 목록). 주민이나 환경 분석가가 '우리 동네 어느 배출업소가 자율점검 대상으로 지정돼 있고 지정이 언제 만료되는가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 배출시설·인허가 사업장 데이터와는 업소명·도로명 주소를 맞춰 붙여야 한다.
limits: 사업자등록번호·인허가번호 같은 공통 키가 없어 다른 데이터와 정확히 연결되지 않고, 업소명·주소 매칭에 의존해야 한다. 범위는 남동구 한 곳의 지정 현황뿐이라 다른 시군구와 비교하거나 점검 결과·배출량을 알 수는 없다.
