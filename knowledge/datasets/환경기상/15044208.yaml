summary_user: 함평만 환경보전해역의 수질 측정값을 년월 단위로 담은 작은 CSV 파일(4,410바이트)로, 수온·염분·pH·용존산소·화학적산소요구량·질소·인·규산규소 등 영양염류, 부유물, 클로로필, 투명도를 기록한다. 연구자나 지자체·어업인이 '함평만의 용존산소나 총질소·총인 농도가 계절·연도에 따라 어떻게 변했나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 해역의 환경보전해역 파일이나 해양 수질 자료와는 년월과 해역 이름을 기준으로 맞춰 이어 쓴다.
description_portal: 해양환경공단이 제공하는 ‘환경보전해역_함평만’ 데이터에 대한 정보를 제공합니다. 본 데이터는 전라남도 함평군과 무안군에 걸친 함평만 해역의 환경보전 상태를 평가하기 위해 수집된 해양환경 측정 자료를 포함합니다. 주요 내용에는 조사 정점 위치, 수온, 염분, 용존산소, pH, 탁도, 영양염류 농도 등 주요 수질 지표와 생태계 건강성 평가 결과가 수록됩니다. 또한 계절별·연도별 수질 변화 추이, 오염원 영향 분석, 해양생태계 보호를 위한 관리·개선 방안이 포함됩니다. 이를 통해 함평만 해역의 환경보전 수준을 종합적으로 파악하고, 정책 수립, 수질 관리, 환경영향평가, 연구 분석 등 다양한 분야에 활용할 수 있습니다. 해당 자료는 공공기관, 연구기관, 지자체, 어업인, 환경단체 등에서 지속가능한 해양 이용과 보전을 위한 기초자료로 폭넓게 이용됩니다.
