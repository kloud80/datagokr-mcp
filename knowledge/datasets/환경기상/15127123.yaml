summary_user: 남원시에 설치된 폐의류(헌옷)수거함을 한 개씩 담은 원천 목록으로, 수거함마다 관리단체·관리번호·행정동·주소·위도·경도를 담는다. 시민이 "우리 동네에서 가장 가까운 헌옷수거함은 어디인가"를 찾거나, 시청·분석가가 행정동별 수거함 배치가 고른지 점검하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 행정동 이름이나 주소·좌표 기반 공간 결합으로 잇고, 다른 시군의 같은 종류 파일과는 항목 이름을 맞춰 합쳐 쓴다.
