description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시에 배치된 폐의류수거함의 위치와 관리 상황을 체계적으로 정리한 공간정보 데이터입니다. 이 데이터는 시민들이 더 이상 입지 않는 의류를 환경친화적으로 처리할 수 있도록 설치된 헌옷수거함의 정확한 위치 정보와 관리 책임을 명확히 함으로써, 의류 재활용 활성화와 폐기물 감소를 통한 지속가능한 환경 정책 추진을 목적으로 합니다. 수거된 의류는 개발도상국 지원, 리폼 소재 제공 등 다양한 방식으로 재활용되어 자원순환 경제 구축에 기여하고 있습니다.2. 데이터 항목명관리단체, 관리번호, 행정동, 주소, 위도, 경도3. 활용 효과이 데이터는 시민들의 폐의류 배출 편의성을 높여 의류 재활용률 증대와 생활폐기물 감량에 기여할 수 있습니다. 또한 정확한 위치 정보 제공을 통해 수거함의 효율적인 관리와 시민 접근성 개선을 도모할 수 있습니다.
