description_portal: 이 데이터는 공기청정기, 가습기, 에어컨을 포함한 가전제품 이미지 200장과 해당 이미지에 대한 라벨링 정보 200개로 구성되어 있습니다. 모든 이미지는 제품이 폐기 전 상태 또는 사용 중 노출된 상태로 촬영되었고, 실내 또는 외부 공간에서 다양한 각도와 거리에서 촬영되었습니다. 파일은 ‘images’ 폴더에 이미지가, ‘labels’ 폴더에 라벨링 텍스트 파일이 각각 저장되어 있으며, 라벨링 정보는 각 기기의 위치와 유형을 YOLO 형식으로 기록하고 있어 AI 객체 인식 모델 훈련에 적합합니다. 데이터셋은 공기청정기, 가습기, 에어컨의 외형, 제어부, 통풍구 등 주요 구성 요소를 식별 가능하게 제공하여 공공 데이터 활용성과 현장 적용성을 고려한 구성을 갖춥니다.
