summary_user: 해수욕장 백사장의 중금속(카드뮴·비소·수은·납·6가크롬, mg/Kg) 조사 결과와 적합 여부를 시도·구군·정점별로 담은 API이며, 검증 호출에서는 전국 범위의 개별 정점(주소·좌표) 단위 1행이 수신되었다. 해수욕장을 찾는 국민이나 지자체 담당자, 분석가가 특정 시도의 해수욕장 백사장이 조사년도에 적합 판정을 받았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 잇고, 위도·경도 필드는 위치 대조에 참고할 수 있다.
limits: 전역 조인 키가 없어 다른 데이터와 자동 결합이 어렵고, 해수욕장 일반정보나 국가해양생태계종합조사는 이 범위에서 제외된다. 검증 호출에서 받은 것은 1행뿐이라 전체 건수와 갱신 주기는 확인되지 않았다. 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
