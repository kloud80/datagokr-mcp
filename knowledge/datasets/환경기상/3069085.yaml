summary_user: 전주시 안의 폐기물처리시설을 시설 한 곳당 한 행으로 담은 파일입니다. 시설명, 도로명·지번주소, 위도·경도, 운영기간, 면적(제곱미터), 매립 및 처리 용량이 들어 있고, 파일 크기는 약 1.7KB로 작습니다. 시민이나 연구자가 "우리 동네 가까이에 어떤 매립·처리시설이 있고 처리용량은 얼마인가"를 확인하거나, 자원순환 담당자가 시내 처리 인프라 현황을 정리할 때 씁니다. 전역 조인 키는 없으므로 다른 데이터와는 시설명·주소로 맞추거나 위도·경도로 지도 위에 겹쳐 쓰는 방식으로 잇습니다.
description_portal: '전북특별자치도 전주시의 폐기물처리시설을 제공하며, 시설명, 도로명주소, 지번주소, 위도, 경도, 운영기간, 면적, 매립 및 처리용량 등을 제공합니다.제공부서 : 자원순환과전주시 내 폐기물 처리 인프라 현황을 파악 가능, 시설유형별 처리능력을 통해 자원순환 정책 수립에 활용 , 정책 담당자는 환경 관리 및 폐기물 처리 효율성 개선에 참고연구자나 시민은 시설 위치 및 처리능력 정보를 통해 생활환경 개선에 기여이 데이터는 전주시의 환경 관리 체계와 자원순환 정책 성과를 확인할 수 있는 중요한 기초자료입니다.'
