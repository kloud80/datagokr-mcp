description_portal: 서울시 야생동식물 출현 및 참고문헌 정보 데이터는 서울시 내에서 특정 야생 동식물이 언제, 어디에서 관찰되었는지와 해당 기록의 참고문헌 정보를 함께 제공하는 자료입니다. 종코드와 국명, 학명을 통해 개별 종을 정확하게 식별할 수 있으며, 서식지코드와 서식지명, 세부통계용명칭을 통해 관찰 지점의 유형과 세부 위치를 체계적으로 구분할 수 있습니다. 출현년도는 각 종이 해당 지역에서 관찰된 시점을 보여 주어 장기적인 분포 변화나 출현 경향을 분석하는 데 유용합니다. 원전 항목은 관찰 기록이 근거한 문헌이나 보고서를 나타내어 데이터의 신뢰성과 출처를 확인할 수 있게 합니다. X좌표와 Y좌표는 공간 정보를 제공해 지도 기반 분포 분석과 서식지 보전 계획 수립에 활용할 수 있으며, 서식지비고정보는 현장 특이사항이나 추가 설명을 담아 생태·환경 연구에 참고할 수 있는 보조 정보를 제공합니다.
