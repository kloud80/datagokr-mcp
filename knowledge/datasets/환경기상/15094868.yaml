summary_user: 서울 서대문구에서 음식물류폐기물을 많이 내는 사업장(일정 규모 이상 음식점·집단급식소·대규모점포 등)을 업소 한 곳당 한 행으로 업종·업소명·도로명주소와 함께 담은 시군구 단위 파일(csv)이다. 사업자가 자기 업소가 다량배출사업장 관리 대상인지 확인하거나, 분석가가 서대문구 안에서 다량배출 업소가 어느 업종·어느 동네에 몰려 있는지 살필 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 잇고, 다른 지자체의 같은 이름 파일과는 컬럼을 맞춰 이어 붙여 쓴다.
description_portal: '서대문구 음식물류 폐기물 다량 배출 사업장에 대한 현황(구분, 업종, 업소명, 도로명주소)에 대한 공공데이터 자료입니다.음식물류폐기물 다량 배출 사업장은 음식물쓰레기를 다량으로 배출하는 사업장으로 음식물류 폐기물의 발생 억제 및 적정 처리를 위하여 법으로 정하는 사항을 준수하여야한다.음식물류폐기물 다량 배출 사업장 범위 : 사업장 규모가 200㎡ 이상인 휴게음식점 및 일반음식점, 1일 평균 총 급식인원 100명 이상인 집단급식소, 대규모점포, 농수산물도매시장·농수산물공판장·농수산물종합유통센터, 관광숙박업관련근거 : 폐기물관리법 제15조의 2'
