summary_user: 세계기상통신망(GTS)으로 기상청에 들어온 지상기상관측전문(WMO 규정의 문자·숫자 부호로 된 관측 전문)을 한 줄 단위(line)로 담은 원천 자료이며, 포털 설명상 1996년 1월부터 일·시간 단위로 보유한다(요소별 상이). 해외 지점의 관측값을 받아 기후·농업·보험 분석에 쓰려는 분석가가 '특정 국가 관측소의 시간별 기온·기압은 어땠나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 전문 안의 관측지점번호를 해석해 이름·코드 매핑으로 다른 관측 자료와 이어야 한다.
limits: 포털 활용신청과 별개로 외부 사이트 apihub.kma.go.kr의 인증키(KEY)가 필요하다. 응답이 해독 전 기상전문 문자열이라 값을 쓰려면 WMO 전문 형식 해석이 필요하고, 공통 조인 키가 없어 지점 코드 매핑을 직접 해야 한다.
