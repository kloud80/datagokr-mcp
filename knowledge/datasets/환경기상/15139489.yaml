description_portal: '세계기상관측망(GTS)으로 전송되어 기상청에 입전된 지상기상관측전문입니다.기상전문이란 기상관측자료의 국제적 교환을 위해 세계기상기구(WMO)에 의해 명시된 규정에 따라 송수신에 적합하게 만든 자료를 말하며, 세계기상통신망인 GTS(Global Telecommunication System)을 통해 자료를 유통합니다.기상전문은 기상요소를 표시하는 문자와 숫자로 구성되어 있으며, 이러한 문 · 숫자는 관측한 기상요소의 값, 또는 상태를 나타냅니다.생산주기: 일, 시간 자료(요소별 상이함)보유기간: 1996년 1월 ∼ 현재(요소별 상이함)'
