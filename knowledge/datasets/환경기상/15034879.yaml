summary_user: 김포시가 대형폐기물(가구류·생활용품류 등)을 품목 구분·품명·규격별로 나눠 규격에 따른 배출 수수료(부과금액)를 담은 건별 목록 파일로, csv 약 4KB 분량의 작은 표다. 김포시 주민이 장롱·소파 같은 대형폐기물을 버리기 전에 해당 품목과 크기에 얼마의 수수료를 내야 하는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품명 이름 매칭이나 같은 김포시 기관의 수거·배출 관련 파일과 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 경기도 김포시의 대형폐기물수수료정보에 대한 정보를 제공합니다. 제공 항목으로는 기물의 구분, 품명, 규격, 규격에 따른 부과금액, 데이터 기준일자로 구성되어있습니다. 본 데이터를 통해  대형폐기물의 종류와 각 구분별 규격, 규격에 따른 수수료 등을 알 수 있습니다. 대형폐기물엔 가구류, 생활용품류 등이 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 자원순환과로 연락주시기 바랍니다.
