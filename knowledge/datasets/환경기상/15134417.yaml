summary_user: 전국 지하수 오염측정망 지점별로 연도·회차마다 측정한 수질 결과를 담으며, 수소이온농도·질산성질소·염소이온 같은 일반 항목과 비소·카드뮴·납·수은 등 중금속, 테트라클로로에틸렌·트리클로로에틸렌·벤젠·톨루엔 등 유기오염물질, 다이아지논·파라티온 같은 농약 성분 농도를 지점 단위로 제공한다. 지역 간 지하수 수질을 비교하는 분석가나, 우리 동네 지하수 관정 주변에서 질산성질소나 휘발성 유기화합물이 검출되는지 알아보려는 주민·사업자가 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어서 다른 데이터와는 지점명(jiguname)과 연도·회차를 기준으로 이름을 맞춰 붙여야 하고, 같은 기관의 다른 지하수 데이터와 지점명으로 대조해 쓴다.
limits: 표준 지점코드나 행정구역코드, 좌표가 없어 지도 표시나 다른 기관 데이터와의 자동 조인이 어렵고, 지점명 문자열 매핑에 의존해야 한다. 공간 정보가 없는 전국 단위 자료다. 개발계정은 하루 10,000회로 호출이 제한된다.
