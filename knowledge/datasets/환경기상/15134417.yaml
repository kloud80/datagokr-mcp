description_portal: 한국수자원공사의 지하수 오염측정망 수질정보로 년도, 지점명, 회차, 구분, 수소이온농도, 염소이온, PCE, TCE, 다이아지논, 톨루엔 등의 수질 정보 항목을 제공합니다. 해당 자료는 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어, 이용자의 편익 증진과 신산업 창출에 기여합니다.제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
