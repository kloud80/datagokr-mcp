summary_user: 부산광역시 영도구에서 실내공기질 관리대상인 다중이용시설을 시설 한 곳당 한 행으로 담은 목록으로, 대상시설구분·시설명·소재지·관리기관명을 담는다(CSV 약 3.3KB의 소규모 파일). 주민이나 보호자가 '영도구에서 실내공기질 관리를 받는 어린이집·의료기관·노인요양시설은 어디인가'를 확인하거나, 분석가가 구 단위 관리대상 시설 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소 문자열 매칭이나 구군명으로만 이어 쓴다.
description_portal: 부산광역시 영도구 다중이용시설 실내 공기질 관리대상에 대한 데이터로 관리대상 명, 업종구분, 소재지 등을 공개합니다.다중이용시설, 신축되는 공동주택 및 대중교통차량의 실내공기질을 알맞게 유지하고 관리함으로써 그 시설을 이용하는 국민의 건강을 보호하고 환경상의 위해를 예방함을 목적으로 합니다. “다중이용시설”이라 함은 불특정다수인이 이용하는 시설로 어린이집, 의료기관, 노인요양시설, 여객터미널 대합실, 도서관, 박물관 등이 있습니다.“오염물질”이라 함은 실내공간의 공기오염의 원인이 되는 가스와 떠다니는 입자상물질 등으로서 기후에너지환경부령으로 정하는 것을 말합니다.
