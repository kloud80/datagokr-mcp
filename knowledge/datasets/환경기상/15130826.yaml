summary_user: 충청북도 충주시 관내에서 허가·신고된 환경오염물질 배출사업장을 업소 한 곳당 한 행으로 담은 파일(csv, 약 65KB)로, 업소명·소재지 주소·배출항목(대기·수질·폐기물·악취 등)·업종·데이터기준일을 담는다. 주민이나 분석가가 "우리 동네 근처에 대기나 수질 오염물질을 배출하는 사업장이 어디에 있는가"를 확인하거나, 지도·점검 대상 사업장 목록을 뽑는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 소재지 주소를 맞춰 붙이는 방식으로만 이을 수 있고, 같은 기관(충주시)의 다른 사업장 데이터와 함께 보는 것이 현실적이다.
description_portal: '충청북도 충주시 관내 환경오염물질을 배출하는 사업장의 현황을 제공하는 데이터입니다.업소명, 소재지, 배출항목(예: 대기, 수질, 폐기물 등), 업종, 데이터 기준일 등의 항목으로 구성되어 있으며, 환경오염물질 관리 및 감시 행정의 기초자료로 활용됩니다.본 데이터는 「환경오염시설의 통합관리에 관한 법률」 및 관련 고시에 따라 허가 또는 신고된 배출사업장을 기준으로 수록됩니다.배출항목은 대기오염물질, 수질오염물질, 폐기물, 악취 등으로 구분되며, 업종은 한국표준산업분류 기준으로 기재됩니다.주소는 사업장 운영 등록 당시 기준이며, 실제 배출지와의 위치 차이가 있을 수 있어 활용 시 유의해야 합니다.본 데이터는 오염물질 배출사업장 현황 파악, 배출량 산정, 지도·점검 계획 수립, 환경위해예방, 환경영향평가 등에 활용됩니다.※ 일부 항목은 환경정보공개 대상에서 제외될 수 있으며, 구체적인 배출량이나 점검결과는 환경부 화학물질정보공개시스템 또는 지방자치단체 환경부서와 연계해 확인이 필요합니다.'
