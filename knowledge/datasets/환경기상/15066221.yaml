description_portal: 경기도 양주시_돼지열병(ASF) 처리 현황 데이터는 아프리카돼지열병(ASF) 발생 시 신고부터 처리까지의 전 과정을 기록한 데이터이다. 주요 항목으로는 신고일, 신고 시간, 발견장소 주소, 위도·경도 좌표, 확인 방법(포획틀, 수면, 폐사체 등), 확인두수, 비고 등이 포함되어 있다. 이를 통해 특정 시기와 장소에서 발생한 ASF 의심 사례 및 확정 사례를 시간순으로 추적할 수 있으며, 방역당국의 대응 현황을 객관적으로 살펴볼 수 있다. 특히 좌표값이 포함되어 있어 GIS 기반 공간 분석이 가능하며, 확산 경로 파악, 위험지역 지정, 신속한 차단 방역 조치에 중요한 근거자료로 활용될 수 있다. 또한 축산업 및 지역 방역 정책 수립, 학술 연구, 공공 안전 강화 등 다양한 분야에서 재사용 가치가 크다. 이 데이터는 공공 방역 체계의 투명성을 높이고, 지역사회 차원의 감염병 대응력을 강화하는 데 기여할 수 있다.
