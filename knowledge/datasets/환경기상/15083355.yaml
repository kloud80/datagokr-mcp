summary_user: 부산광역시 구·군별 먹는물 공동시설(약수터)마다 검사 여부·미검사 사유·검사일자·적합 여부와 일반세균·총대장균군·질산성 질소 같은 수질 항목 측정값을 시설 단위 건별로 담은 파일(CSV 약 9.6KB)이다. 약수터를 이용하는 시민이 '우리 동네 약수터 물이 최근 검사에서 대장균군이나 질산성 질소로 부적합 판정을 받았나'를 확인하거나, 분석가가 구·군별 부적합 시설 비율을 비교하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 지역 약수터 수질 데이터나 시설 위치 정보와는 공동시설명 같은 이름 매칭으로만 연결한다.
