description_portal: '이 데이터는 한국환경산업기술원이 관리하는 GR마크(우수 재활용 제품 인증제도)의 인증 현황 통계를 연도별로 나타낸 자료입니다. 데이터는 연도별 인증 통계를 포함하며, 다음과 같은 3개의 컬럼으로 구성되어 있습니다:구분: 데이터가 집계된 기준 연도를 나타냅니다.인증제품수(개): 해당 연도에 GR마크 인증을 받은 제품의 수를 나타냅니다.인증업체수(개): 해당 연도에 GR마크 인증을 받은 업체의 수를 나타냅니다.이 데이터는 재활용 우수제품의 인증 현황과 동향을 파악하고, 재활용 제품 활성화 정책의 효과를 평가하는 데 사용될 수 있습니다. 또한 친환경적인 제품 생산 및 소비를 촉진하고, 환경보호를 위한 정책 수립의 근거로 활용될 수 있습니다.'
