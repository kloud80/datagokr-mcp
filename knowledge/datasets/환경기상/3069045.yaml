summary_user: 울산광역시 남구가 환경 자율점검업소로 지정한 사업장을 한 업소당 한 행으로 담은 파일(csv, 약 6.7KB)로, 지정번호·최초지정일·지정일·지정종료·재지정 여부와 업종·대표자·도로명주소, 대기·수질·기타수질·폐기물 배출 분야를 함께 담는다. 행정 담당자나 환경 분석가가 '남구에서 자율점검업소로 지정된 사업장은 어디이고, 언제 지정돼 언제 끝나며 어떤 배출 분야에 해당하는가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어서 다른 배출시설·인허가 사업장 데이터와는 사업장명칭이나 도로명주소(소재지도로명주소)를 맞춰 이어 써야 한다.
limits: 울산 남구 한 시군구만 담고 있어 다른 지역과 비교하려면 별도 데이터가 필요하다. 사업자번호 같은 공통 식별자가 없어서 다른 데이터와 연결할 때 이름·주소 매칭 오류가 생길 수 있다.
