description_portal: 이 데이터는 우리나라 인근 해역에서 방사성물질의 분포 현황을 파악하기 위해 정기적으로 수행한 해양 방사능 조사의 측정결과 원본자료를 수집한 데이터입니다.  본 데이터의 주요 내용은 해수, 퇴적물 등 구분, 채취 생태구명, 채취 정점명, 채취일시 및 핵종별 분석결과 등으로 구성되어 있습니다.   본 데이터는 해양 환경오염 감시체계 구축, 방사성물질 이동 경로 및 농도 변화 분석, 해양수산 정책 수립, 인근 해양 환경 및 수산물 안전성 평가, 방사능 누출사고 시 과학적 대응자료 확보 등에 활용될 수 있습니다.
