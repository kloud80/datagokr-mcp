summary_user: 한국중부발전 각 사업소가 사용한 화학물질의 종류와 사용량(킬로그램)을 사업소·화학물질별로 정리한 집계 파일로, 데이터 기준일·사업소·화학물질명·사용량 네 항목으로 구성된 소규모 CSV(약 2.7KB)입니다. 환경 분석가나 지역 주민이 '보령·서천 등 특정 발전소에서 어떤 화학물질을 얼마나 쓰는가'를 확인하거나 발전사의 유해물질 관리·저감 이행을 점검할 때 쓴다. 전역 조인 키가 없어 다른 화학물질 취급·배출 자료와는 사업소명이나 화학물질명을 이름으로 맞춰 연결해야 한다.
description_portal: 본 화학물질 사용 정보는 한국중부발전 각 사업소에서 사용한 화학물질의 종류와 사용량을 정리한 자료입니다. 항목은 사업소, 화학물질명, 사용량으로 구성되어 있으며, 사용량의 단위는 킬로그램입니다. 이 자료를 통해 발전소별 어떤 화학물질이 얼마나 사용되는지를 확인할 수 있으며, 화학물질의 관리 수준, 환경 안전 대응 체계, 유해물질 저감 활동의 이행 현황을 점검하는 데 연계하여 활용가능합니다. 또한 유해화학물질 취급 이력 관리, 환경 법령 준수 여부 확인 등에도 참고자료로 활용 가능합니다.
