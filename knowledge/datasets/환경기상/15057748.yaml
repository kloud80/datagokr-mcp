summary_user: 경기도 내에서 오염된 지하수를 정화하는 업체의 인허가 정보를 업체(사업장) 한 건씩 담은 원장으로, 인허가·취소 일자, 영업상태, 주소와 좌표, 전문인력 수, 자본금, 시설장비를 포함한다. 홍수 등으로 지하수가 오염됐을 때 우리 시군 근처에 영업 중인 정화업체가 어디 있고 인력·장비를 얼마나 갖췄는지 확인하려는 지자체 담당자나 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 사업장명·주소 매칭, 또는 좌표를 이용한 위치 결합으로만 이어 쓴다.
description_portal: 「정화업체 현황」 데이터는 경기도 내 생활용·농업용·공업용 지하수가 홍수 등 외부 요인으로 오염되었을 때 이를 정화하는 업체의 인허가 정보를 제공하는 자료입니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태명(BSN_STATE_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 전문인력총수(SPCMNPW_TOT_CNT), 자본금(CAPTL_AMT), 시설장비(FACLT_EQUP_INFO), 타기관이전여부(OTRINST_BF_YN) 등입니다. 이 데이터는 31개 시군 단위로 구성되어 있어 지역별 정화업체 분포와 역량을 확인할 수 있으며, 지하수 오염 대응 정책 수립, 환경 안전 관리, 전문 인력 배치 및 장비 현황 분석 등에 활용할 수 있습니다. 또한 업체의 자본금과 장비 보유 현황까지 포함되어 있어 정화업체의 수행 능력을 평가하는 데 유용합니다.
