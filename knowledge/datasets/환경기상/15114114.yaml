description_portal: 경기도 포천시 빗물이용시설 현황 데이터는 「물의 재이용 촉진 및 지원에 관한 법률」 제8조 및 같은 법 시행규칙 제3조 제2항에 따라 제공되는 공공데이터로, 지역 내 빗물이용시설의 설치 및 운영 현황을 체계적으로 관리하고 국민에게 투명하게 공개하기 위해 구축된 자료이다. 이 데이터는 포천시 관내에 설치된 빗물이용시설의 시설명, 시설 위치(주소), 저류조 용량(세제곱미터), 이용 용도, 데이터 기준일자 등의 항목으로 구성되어 있으며, 각 시설에서 수집된 빗물을 조경용수, 청소용수 등 다양한 용도로 활용하고 있는 정보를 포함하고 있다.
