summary_user: 대구광역시 서구 대기정보시스템이 측정하는 암모니아·황화수소·총휘발성유기화합물·미세먼지(PM10) 등 항목별 센서 설정과 단계별 기준값(주시·주의·경고·법적 기준의 시작값·끝값)을 담은 기초 설정표로, 실제 시간별 측정값이 아니라 2216바이트 크기의 작은 CSV 한 개다. 서구 측정망 수치를 해석하는 분석가나 주민이 '이 측정소의 황화수소 수치가 주의 단계에 해당하는가'처럼 측정값을 단계로 판정할 때 기준표로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 같은 기관의 측정 자료와 서비스번호·지역번호·센서고유번호를 이름·코드 매핑으로 맞춰 연결해야 한다.
description_portal: 대구광역시 서구의 대기정보시스템 기초자료입니다. 시스템에서 수집하는 데이터 의 기초 정보인 암보니아/황화수소, 총휘발성유기화합물, 미세먼지 등의 데이터를 포함합니다.본 데이터는 대구광역시 서구 관내 대기질 측정을 위한 주요 오염물질의 관측정보를 정리한 자료이다. 측정 항목은 암모니아(NH₃), 황화수소(H₂S), 총휘발성유기화합물(TVOC), 미세먼지(PM10) 등으로 구성되어 있으며, 각각의 항목에 대하여 서비스번호, 지역번호, 센서번호, 단위, 사용여부, 기준값 구간(주시, 주의, 경고, 법적 기준) 등이 포함되어 있다. 대기오염물질별로 시작값과 끝값을 기준으로 한 단계별 수치가 설정되어 있어 오염도 판단과 기준 준수 여부 확인에 활용된다. 해당 데이터는 환경 모니터링, 대기질 개선 정책 수립, 환경영향평가 등에 기초자료로 제공될 수 있다. 또한 시민 건강 보호와 지역 내 대기질 변화 분석에도 활용도가 높다.
