summary_user: 충청남도 보령시 관내 측정 지점(설치장소·주소)별로 검사일자마다 미세먼지·초미세먼지·오존·이산화질소·일산화탄소·아황산가스 농도를 기록한 측정 결과 파일로, 범위는 보령시 한 개 시군구이고 위치는 개별 주소 단위다. 보령 주민이 '우리 동네 측정 지점의 미세먼지·오존 농도가 날짜별로 어땠는가'를 확인하거나, 연구자·지자체가 지점별 대기오염 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 에어코리아 측정소 자료 등 다른 대기질 데이터와는 설치장소 이름이나 주소를 맞춰 연결해야 한다.
description_portal: 미세먼지 등 대기오염 문제에 대한 사회적 관심과 우려가 급증하고, 시민의 건강권 보장 및 환경정보 공개 요구가 높아지며, 과학적 근거에 기반한 대기환경 정책 수립과 오염원 관리 강화를 위한 체계적인 대기질 모니터링 필요성이 증대됨에 따라 충청남도 보령시는 관내 주요 지점에서 측정한 이산화황, 이산화질소, 오존, 일산화탄소, 미세먼지 등 5개 주요 대기오염물질의 농도 측정 결과와 측정소 위치 정보를 종합적으로 제공하고 있습니다.개방 데이터는 대기오염도 측정장소, 주소, 오염도항목별(이산화황, 이산화질소, 오존, 일산화탄소, 미세먼지) 측정결과 등 총 7개 항목 15건의 상세 정보를 포함하고 있습니다.시민·지역주민은 거주지역 대기질 현황 확인을 통해 건강관리 및 야외활동 계획 수립에 활용하고, 환경단체·연구기관은 지역별 대기오염 현황 분석 및 환경정책 제안, 대기질 개선 효과 연구에 활용하며, 지방자치단체·환경관리기관은 대기환경 정책 수립 및 오염원 관리 계획 수립, 환경보건 대책 마련에 활용할 수 있습니다.
