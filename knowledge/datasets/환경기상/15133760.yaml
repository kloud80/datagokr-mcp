summary_user: 인천광역시 영종구 관내 쓰레기 종량제봉투 지정판매소를 판매소 한 곳당 한 행으로 담은 건별 목록 파일(CSV 약 37KB)로, 판매소 코드·판매소명·사업장 주소·영업 상태·데이터기준일을 담는다. 주민이 '우리 동네 어디에서 종량제봉투를 살 수 있나'를 찾거나, 구청 담당자가 판매소 분포와 운영 상태를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장 주소나 판매소명으로만 이을 수 있으며, 주소를 좌표로 바꿔 다른 시군구의 판매소 파일이나 대형폐기물·재활용 수거 지점 데이터와 지도에서 겹쳐 본다.
