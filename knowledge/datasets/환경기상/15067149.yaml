description_portal: '- 본 데이터는 한국전력기술(주)에서 구매한 제품 중 녹색제품에 대한 실적을 정리한 자료입니다.- 해당 데이터는 공공기관의 친환경 제품 구매 실적을 파악하고, 환경경영 실천 수준 및 녹색소비 실현 현황을 분석하는 데 활용될 수 있습니다. 또한 기관별 녹색조달 정책 수립, 제품군별 녹색제품 구매 추세 분석, 정부의 녹색구매 목표 이행 모니터링 등의 목적으로 활용할 수 있습니다.- 해당 데이터는 구매 제품의 분류명, 총 구매금액(원), 녹색제품 구매금액(원), 구매 수량, 녹색제품 구매 비율(%) 등의 항목으로 구성되어 있습니다.- 개방된 데이터는 녹색제품 구매실적 현황 3건입니다.'
