description_portal: 태풍목록은 발생한 태풍의 태풍번호와 태풍명(영문명 포함), 진행여부, 영향도, 발생일과 소멸일에 대한 정보를 연도별로 보여줍니다.* 발생/소멸시각 단위는 KST입니다.<태풍의 정의>태양으로부터 오는 열에너지는 지구의 날씨를 변화시키는 주된 원인으로 작용합니다. 지구는 구형으로 되어 있어 저위도와 고위도 사이에는 열에너지 불균형이 나타납니다.태양의 고도각이 높아 많은 에너지를 축적한 적도부근의 바다에서는 대류구름들이 만들어지게 됩니다. 때때로 이러한 대류구름들이 모여 거대한 저기압 시스템으로 발달하게 되는데, 이를 태풍이라고 부릅니다. 태풍은 바다로부터 증발한 수증기를 공급받아 강도를 유지하면서 고위도로 이동하게 됩니다. 이러한 과정을 통해 태풍은 지구 남북 간의 에너지 불균형을 해소하는 역할을 합니다.
