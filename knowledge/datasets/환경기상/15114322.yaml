description_portal: 이 데이터는 해양수산부에서 해양방사성물질에 대한 조사 및 결과 정보를 제공하기 위해 수집한 데이터입니다.  조사정점명, 분석항목명 등 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 조사연도, 조사월, 조사일자, 조사정점의 위도 및 경도, 조사정점명, 생태구명, 분석항목명, 종명, 수심정보, 세슘134, 세슘137, 삼중수소(3H), 베타, 스트론튬90 등의 각 측정수치와 오차표현, 불확도 정보 등으로 구성되어 있습니다.   본 데이터는 해양 방사성물질의 시기별, 위치별 분포 현황을 확인하거나, 각 분석항목별 수치 자료를 활용하여 해양환경 오염도 모니터링, 방사성물질 이동경로 연구, 정책 수립을 위한 과학적 근거자료로 활용할 수 있습니다.
