status: active
summary_user: 해양수산부가 조사한 해양방사성물질 측정 결과를 조사정점·조사일자·분석항목별로 담은 API이며, 세슘134·세슘137·삼중수소·베타·스트론튬90의 측정수치와 오차·불확도를 포함한다. 해양환경 분석가나 연구자가 특정 정점의 방사성물질 수치가 시기별로 어떻게 달랐는지 확인하는 데 쓴다. 조사정점 위도(rdoslat)가 좌표 조인 키라서 같은 좌표를 가진 다른 해양환경 데이터와 위치 기준으로 이어 쓴다.
limits: API 전체 건수가 2건이고 검증 때 2행이 수신되어, 전국 단위의 시기별·위치별 분포를 분석하기에는 건수가 매우 적다. 조인 키는 좌표(위도)뿐이며 코드표가 있는 필드는 없다. 필드 rdosknfsinf는 명세에 의미 설명이 없어 해석에 주의해야 한다.
