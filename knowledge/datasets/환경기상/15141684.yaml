summary_user: 서울 용산구에서 대기오염물질 배출시설을 설치한 사업장의 인허가 정보를 사업장 단위로 담는 데이터로, 인허가일·영업상태·폐업일·휴업기간·주소·좌표·업종·주생산품·배출시설과 방지시설의 가동시간 등을 포함한다. 주민이 우리 동네에 어떤 대기 배출 사업장이 영업 중인지 확인하거나, 분석가가 배출 사업장 분포와 폐업 추이를 살펴보는 데 쓴다. 전역 조인 키는 없으므로 다른 자치구의 같은 인허가 데이터나 대기질 자료와는 사업장명·주소·좌표, 같은 기관 코드(OGDP_INST_CD)로 맞춰 이어 쓴다.
description_portal: 서울특별시 용산구_대기오염물질배출시설설치사업장 인허가 정보에 대해 인허가 일자, 영업상태, 폐업일자, 전화번호, 주소, 사업장명에 대한 정보를 제공합니다.본 데이터는 용산구 내에서 대기오염물질을 배출하는 사업장의 설치 및 운영 현황을 상세히 파악할 수 있도록 제공됩니다. 용산구는 쾌적한 생활환경 조성과 대기질 개선을 위해 관내 배출시설의 관리와 인허가 절차를 체계적으로 운영하고 있습니다. 이에 따라 사업장의 위치, 인허가 일자, 영업 상태, 폐업 여부 등 주요 정보를 포함하여 현황을 관리하고 있습니다.본 데이터를 활용하면 구민과 지역 주민은 주변 배출시설의 현황을 확인하고, 필요 시 안전 및 민원 관련 정보를 파악할 수 있습니다. 또한 기업과 연구기관은 이를 기반으로 환경 영향 분석, 정책 수립, 사업 계획 수립 등 다양한 목적으로 활용할 수 있습니다. 이 데이터는 용산구의 지속 가능한 환경 관리와 대기질 개선, 안전한 생활환경 조성을 위한 기초 자료로 중요한 역할을 수행합니다.
