description_portal: '태풍이 발생하여 우리나라로 접근이 예상되고, 태풍 특보가 육상에 발효되는 것이 예상될 때, 태풍위험상세정보를 생산하여 방재관계기관, 대국민에게 제공함. 1.tpif_typh_case: 태풍위험상세정보 내 다양한 컨텐츠 중, 과거에 발생하였던 유사한 태풍 사례를 조회, 정보를 제공함으로써, 과거 태풍으로 인한 피해 발생 현황을 파악하고 피해 발생 대비를 하고자 활용한 태풍 유사사례 정보를 데이터 베이스화 하여 관리중(태풍 사례, 중심최대풍속, 중심기압, 우리나라 영향 기간, 유사태풍사례의 이미지 파일 정보)2.tpif_stn_area: 태풍위험상세정보 내 다양한 컨텐츠 중, 해안가 특보구역 지점을 대상으로 폭풍해일로 인한 피해 발생에 대비하기 위하여, 관측소별 폭풍해일주의보 임계값을 데이터 베이스화 하여 관리중(특보구역 코드, 특보구역 지점명, 권역명, 폭풍해일주의보 기준 수위 임계값)'
