summary_user: 울산광역시 관내에 등록된 폐기물 처리업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 구분·업체명·대표자·사무실 소재지·전화번호·영업구역을 담는다(csv 약 3.4KB의 작은 파일). 폐기물을 위탁하려는 배출 사업자나 주민이 울산에서 특정 구역을 영업구역으로 둔 적법한 처리업체가 어디이고 연락처가 무엇인지 확인하는 데 쓴다. 전역 조인 키나 사업자번호 같은 코드는 없으므로, 다른 데이터와는 업체명·소재지 주소를 이름 매칭하거나 같은 기관(울산광역시) 자료끼리 맞춰 잇는다.
description_portal: 본 데이터는 관내에 등록된 폐기물 처리업체의 현황 정보이다. 업체별 명칭, 대표자, 소재지, 취급 폐기물 종류 등의 세부 내용을 포함한다. 폐기물 처리업체는 생활 폐기물, 사업장 폐기물, 건설 폐기물 등을 수집·운반·처리하는 환경 서비스 사업자이다. 해당 자료는 폐기물 관리 정책 수립, 업체 관리 감독, 불법 폐기물 처리 단속에 활용된다. 업체별 처리 능력 및 시설 현황 파악을 통해 지역 폐기물 처리 수요를 충족하는 인프라 확충 계획을 수립할 수 있다. 또한 적정 처리 기준 준수 여부 점검 및 부적정 처리 업체 단속을 통해 환경 오염을 예방한다. 폐기물 배출 사업자가 적법한 처리업체를 선정하여 위탁 처리하는 데 필요한 정보를 제공한다.
