summary_user: 녹색제품정보시스템에 등록된 인증 녹색제품을 제품(모델) 한 건씩 지역·업체명·인증번호(EL번호)·제품용도·인증상태·환경표지 인증 시작일과 종료일과 함께 담은 전국 단위 파일(CSV 약 25MB)이다. 지자체·조달 담당자나 분석가가 '우리 지역에 환경표지 인증이 유효한 제품을 가진 업체는 어디이고 어떤 용도 제품이 많은가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 환경표지·녹색기업 데이터와는 업체명이나 인증번호를 이름·코드 매핑해 잇고, 지역은 행정코드가 아닌 지역명으로만 묶는다.
description_portal: 본 데이터는 한국환경산업기술원의 녹색제품정보시스템에서 지역별로 인증된 녹색 제품 정보를 제공하는 공공데이터 입니다. ‘순번’, ‘지역’, ‘업체명’, ‘홈페이지’, ‘제품번호’, ‘인증번호(EL번호)’, ‘제품용도명’, ‘모델명’, ‘분류번호’, ‘식별번호’, ‘인증상태’, ‘환경표지여부’, ‘환경표지인증시작일(갱신 예정일 포함)’, ‘환경표지인증종료일’ 등 14개 필드를 포함하며, 2023년부터 2026년까지(갱신예정일 포함) 인증된 녹색제품의 지리적 분포를 업체별·제품별로 상세 조회할 수 있는 데이터 입니다. 이를 통해 지역별 인증 현황 분석, 제품용도별 통계 산출, 인증 기간 관리, 지속가능 제품 수요 예측, 정책  모니터링, 공급망 최적화 및 친환경 브랜드 홍보 전략 수립에 활용할 수 있는 데이터 입니다.
