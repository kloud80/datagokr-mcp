description_portal: 해당 데이터는 전국 지정폐기물 배출 사업장에 대한 정보를 담고 있는 통계 자료입니다. 각 사업장에서 발생한 지정폐기물의  발생량(톤)을 함께 확인할 수 있습니다. ‘지정폐기물’은 인체 건강이나 환경에 위해를 줄 수 있는 폐기물로, 법적 관리가 필요한 특수 폐기물을 의미합니다.데이터는 각 사업장의 소재지(시도 및 시군구), 업체명, 연락처, 그리고 해당 사업장에서 발생한 지정폐기물의 양으로 구성되어 있습니다. 본 자료는 지역별로 폐기물 발생량이 어떻게 분포되어 있는지 확인할 수 있으며 산업 활동, 공공처리시설, 폐차장, 환경에너지시설 등 다양한 유형의 사업장이 포함되어 있어 지정폐기물의 발생 원인을 파악하는 데 활용 가능합니다. 또한 환경 관리, 감시 체계, 폐기물 정책 수립 시 기초자료로 활용될 수 있습니다.
