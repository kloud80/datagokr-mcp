summary_user: 전국 지정폐기물 배출 사업장을 사업장 한 곳당 한 행으로 담고, 시도·시군구 소재지, 업체명, 연락처, 지정폐기물 발생량(톤)을 함께 싣는 파일(약 8.8KB CSV)이다. 지자체 환경 담당자나 분석가가 '우리 시군구에는 어떤 지정폐기물 배출 사업장이 있고 각각 몇 톤을 배출하는가'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 폐기물 처리업·배출자 데이터와는 업체명이나 시도·시군구 이름을 맞춰서만 연결한다.
limits: 공통 식별 코드가 없어 다른 데이터와 붙이려면 업체명·지역명을 일일이 맞춰야 하고, 이름 표기가 다르면 연결이 틀어질 수 있다. 범위는 전국이지만 행정단위는 시군구까지만 있어 정확한 주소나 좌표 분석에는 쓰지 못한다.
