summary_user: 공주시 관내 사업장폐기물 배출자 신고를 사업장 한 곳씩 담은 건별 원장으로, 상호·폐기물 종류·운반자·처리업소명·처리방법·도로명주소를 담는다(CSV 약 9.7KB). 사업자나 분석가가 "공주시의 어느 사업장이 어떤 폐기물을 내고, 누가 운반해 어느 업소에서 어떻게 처리하나"를 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 상호·처리업소명 같은 이름 매칭이나 도로명주소(사업장도로명주소) 기반 지오코딩으로 폐기물 처리업 허가 현황 등 다른 자료와 잇는다.
description_portal: 충청남도 공주시에서는 관내 사업장에서 발생하는 폐기물의 체계적인 관리를 위해 사업장폐기물 배출자 신고 현황을 관리하고 있습니다. 본 자료는 공주시 관내 사업장의 폐기물 배출자 신고 정보를 정리한 것으로,  (상호, 폐기물종류, 운반자, 처리업소명, 처리방법, 주소) 등의 항목들을 포함하고 있습니다:본 자료는 관내 사업장의 폐기물 배출 관련 정보를 한눈에 파악할 수 있도록 구성되어 있어, 행정업무, 환경관리 기초자료, 지역 기반 데이터 분석, 대시민 정보 제공 등의 다양한 목적으로 활용될 수 있습니다.
