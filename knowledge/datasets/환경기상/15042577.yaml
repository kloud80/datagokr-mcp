description_portal: '대구공공공단 슬러지 현황 데이터로 연도별, 신천 총하수슬러지 발생량, 서부 총슬러지 발생량, 달서천 총슬러지 발생량, 북부 총슬러지 발생량, 현풍 총슬러지 발생량 항목을 제공합니다.- 하수 슬러지 : 하수처리 과정에서 발생하는 고형물. 정화조, 침전조에서 분리된 유기물과 무기물 혼합물- 슬러지 처리방법1. 농축 (Thickening)슬러지의 수분 함량을 줄여 부피를 감소시킴.2. 소화 (Digestion)혐기성 또는 호기성 미생물을 이용해 유기물을 분해하여 부패 방지 및 안정화.3. 탈수 (Dewatering)원심분리기, 벨트프레스 등을 이용해 수분을 제거하여 고형물화.4.건조/소각/매립최종 처리를 위해 열처리하거나 위생적으로 매립.'
