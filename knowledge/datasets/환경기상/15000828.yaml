summary_user: 성남시에서 석면이 포함됐거나 포함 가능성이 있는 석면조사대상 건축물을 건물 한 곳당 한 행으로 담은 파일로, 시설명·세부소재지·연면적·착공신고일·시설구분 등을 기록한다(CSV 약 21KB, 성남시 범위의 개별 주소 단위). 시민이나 인근 주민, 환경·건축 분석가가 '우리 동네 어느 건물이 석면조사 대상이고 착공(철거·공사) 신고가 언제 났는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 시설명이나 주소(세부소재지)를 문자열로 맞추거나 주소를 좌표로 바꿔 지도·건축물대장 자료와 이어 쓴다.
description_portal: 성남시 석면조사대상건축물 현황 자료는 석면이 포함되었거나 포함 가능성이 있는 건축물에 대한 정보를 정리한 자료입니다. 시설명, 소재지, 연면적, 착공신고일, 전화번호, 시설구분 등의 항목을 포함하고 있습니다. 해당 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다. 해당 자료는 환경 안전과 공공시설 개선 등 다양한 정책 수립에 활용되며, 시민들이 직접 확인하고 의견을 제시할 수 있는 투명 행정의 기반이 됩니다.
