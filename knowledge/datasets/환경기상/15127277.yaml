description_portal: '인천광역시 부평구 특정토양오염 관리대상시설 현황에 대한 데이터 목록입니다.업종으로는 주유소와 산업시설이 있습니다.활용 목적 및 특징○ 환경 오염원 집중 관리: 오염 유발 가능성이 높은 시설(주유소, 산업시설 등)의 위치 및 분포 파악○ 정기 점검 및 검사 관리: 시설별 토양오염도 검사 주기 관리 및 미이행 시설 모니터링○ 토양 보전 정책 수립: 지역별 오염 관리 대상 시설 밀집도를 분석하여 환경 보호 구역 설정 시 활용○ 사고 대응 체계 구축: 유출 사고 발생 시 인근 시설 정보 파악을 통한 신속한 방제 및 확산 방지주요 항목 설명○ 연번: 데이터의 고유 식별 번호○ 시설명: 토양오염관리대상으로 지정된 시설의 공식 명칭○ 주소: 해당 시설이 위치한 필지의 지번 또는 도로명 주소○ 업종: 시설의 운영 목적 및 분류 (예: 주유소, 산업시설 등)'
