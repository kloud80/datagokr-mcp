summary_user: 한국동서발전 각 사업소에서 나오는 석탄재·석탄회·매립제 등 발전 부산물을 계량일자별로 기록하고, 운송업체와 처리업체를 함께 담은 건별 처리 기록 파일(CSV, 약 8.9MB)이다. 분석가가 "어느 발전소의 석탄재가 어떤 운송·처리업체를 거쳐 처리되는가"처럼 발전소별 부산물 처리 흐름과 거래 업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 폐기물 처리업 데이터와는 운송업체명·처리업체명 같은 이름 매칭으로만 연결한다.
description_portal: 한국동서발전에서 운영 중인 각 사업소의 폐기물 현황 정보 데이터는 발전소에서 발생하는 주요 폐기물의 종류별 처리 현황을 기록한 자료입니다.해당 데이터는 사업소명, 계량일자, 제품(석탄재, 석탄회, 매립제), 운송업체명, 처리업체명 등의 항목으로 구성되어 있으며, 폐기물의 발생 및 운송·처리 과정을 일자별로 추적할 수 있도록 구조화되어 있습니다.학계 및 연구기관에서는 이 데이터를 활용하여 △발전소별 폐기물 배출 특성 및 처리 흐름 분석 △폐기물 유형별 발생량 및 처리 업체 분포 조사 △친환경 처리 방식 도입 가능성 평가 △에너지 산업에서의 자원순환 정책 기초자료 마련 △폐기물 처리업체의 지역별 분포 및 거래 네트워크 분석 등에 활용할 수 있습니다.특히 석탄재 및 석탄회 등의 산업부산물에 대한 자원화 가능성과 연계하여, 재활용 체계의 효율성을 평가하거나 산업폐기물 관리정책 수립을 위한 실증 데이터를 제공하는 데 유용합니다.
