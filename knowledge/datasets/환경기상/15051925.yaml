description_portal: '하천기본계획은 하천의 이용 및 관리에 필요한 기본적인 사항 등을 내용으로 하며 유역의 강우, 하천의 유량, 하도특성 및 이용현황 등을 조사 분석하여 하천의 종합적인 정비, 보전, 이용에 대한 계획을 수립합니다. 하천기본계획의 내용중 측량기준점에 대한 정보를 조회할 수 있습니다.*용어설명측량기준점은 모든 측량과 공간정보의 “좌표 기준”이 되는 물리적 표지입니다. 정확한 지도 작성, 공사 시공, 지적(토지) 경계, 하천·도로·철도 설계와 유지관리의 출발점※ 제공부서 : 서울특별시 물순환안전국 치수안전과(02-2133-3886)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
