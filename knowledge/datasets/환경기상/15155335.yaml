summary_user: 경기도 대기오염물질 배출 사업장이 낸 배출시설 허가 신청·신고 내역을 건별로 담으며, 사업장명·업종·산업단지·관할관청, 신청구분과 처리상태·승인일, 배출시설과 방지시설의 용량·조업시간·연간 가동일, 먼지·이산화황·이산화질소 발생량과 배출계수가 들어 있다. 환경 분석가나 지자체 담당자가 '특정 산업단지에서 어떤 업종 사업장이 먼지와 이산화황을 얼마나 발생시킨다고 신고했는가'를 따져 배출량 산정이나 규제 검토에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 사업장명·업종코드 매핑으로 다른 배출원 데이터와 잇고, 사업자등록번호(bizregno) 필드는 기업 단위로 묶는 후보로 쓴다.
description_portal: 이 데이터는 대기오염물질을 배출하는 사업장이 제출하는 허가신청 및 신고 내역을 정리한 자료로, 사업장의 기본정보와 배출시설의 특성, 조업계획, 오염물질 발생 및 배출 예측치를 포함합니다. 주요 항목은 업종코드와 업종명, 산업단지 위치, 관할관청, 허가신청 여부, 신청구분(신고/신청), 배출시설의 일일 조업시간과 연간 가동일, 먼지·이산화황(SO₂)·이산화질소(NO₂)의 발생량 및 배출계수, 시설 분류 등으로 구성됩니다. 특히 오염물질의 발생량과 배출계수 정보는 환경영향 예측과 규제 기준 검토에 있어 중요한 역할을 하며, 산업단지 내 업종별 환경 영향을 정량적으로 분석할 수 있는 기반 자료로 활용됩니다. 이 데이터는 환경영향평가, 배출량 산정, 환경규제 이행 확인 및 산업별 오염 저감정책 수립에 활용될 수 있습니다.
