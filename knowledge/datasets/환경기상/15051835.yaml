description_portal: 서울시 산과공원 생태관광 정보(영문) 데이터는 산과 공원 등 생태관광 자원의 기본 현황을 영어로 제공하는 자료입니다. 키 항목은 각 관광지를 식별하기 위한 고유값이며, 명칭은 대상지의 공식 영어 이름을 나타냅니다. 행정시는 서울특별시 내 상위 행정단위를, 행정구와 행정동은 해당 생태관광지가 위치한 구와 동을 영어로 표기한 것으로, 공간적 위치와 행정구역을 함께 파악할 수 있습니다. 대표전화는 방문 문의, 프로그램 예약, 이용 안내 등 관광객과 관리 주체 간 연락을 위한 기본 연락처 정보를 제공합니다. 면적은 해당 산 또는 공원의 규모를 나타내는 지표로, 생태관광 자원의 공간적 크기와 서식지 잠재력을 가늠하는 데 활용됩니다. 지정일 항목은 생태관광 자원으로 공식 지정된 날짜를 의미하며, 제도적 보호·관리의 시작 시점을 확인할 수 있습니다. 이 데이터는 서울의 산과 공원 생태관광 자원을 영어 기반으로 체계적으로 관리하고, 외국인 관광객 안내, 영문 홍보물 제작, 국제 생태관광 네트워크 구축 등 다양한 국내외 관광·환경 정책 수립과 서비스 제공에 활용될 수 있는 기초 자료입니다.
