description_portal: 경기도 부천시의 대형폐기물 품목별 통계 데이터는 시민들이 배출 신고 및 수거 요청을 한 대형폐기물에 대해 품목별로 접수된 건수와 처리 비용(금액)을 나타낸 자료입니다. 이 데이터는 가구류(책상, 의자, 장롱 등), 가전제품(냉장고, 세탁기, TV 등), 매트류(매트리스, 카펫 등), 욕실용품(세면대, 욕조 등), 유아용품(유아침대, 유모차 등), 주방물품(식탁, 찬장, 전자레인지 등), 취미생활용품(자전거, 운동기구, 악기 등) 등으로 분류되어 있으며, 각 품목별로 실제로 얼마나 자주 배출되는지(건수)와 해당 품목의 처리비용이 얼마나 되는지(금액)를 확인할 수 있습니다.
