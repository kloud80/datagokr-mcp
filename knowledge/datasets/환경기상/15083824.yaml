summary_user: 충청남도 보령시 관내 대기배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 업체명·도로명/지번 주소·위경도·업종·종별·전화번호를 포함합니다(포털 설명 기준 104건, CSV 약 17KB). 시민이나 환경단체가 '우리 동네 근처에 어떤 대기배출 사업장이 있고 몇 종 규모인가'를 확인하거나, 연구자가 보령시 대기오염원 분포를 지도로 그릴 때 씁니다. 전역 조인 키(사업자번호 등)는 없어서 다른 데이터와는 업체명·주소를 맞추거나 위경도로 공간 결합해 이어 씁니다.
description_portal: 미세먼지 등 대기오염 문제에 대한 사회적 관심 증대와 환경규제 강화로 대기배출시설에 대한 체계적인 관리 필요성이 높아지고, 지역 환경정책 수립 및 시민의 환경정보 접근권 보장에 대한 요구가 증가함에 따라 충청남도 보령시는 관내 대기배출시설의 위치, 업종, 규모 등 종합적인 현황 정보를 제공하고 있습니다.개방 데이터는 대기배출시설의 업체명, 소재지 주소, 업종, 종별, 전화번호 등 총 5개 항목 104건의 상세 정보를 포함하고 있으며, CSV 파일 형태로 공공저작물 이용허락범위에 제한 없이 제공됩니다.환경단체·시민은 지역 내 대기배출시설 현황 파악을 통해 환경 모니터링 및 정책 제안에 활용하고, 연구기관·학계는 지역별 대기오염원 분석 및 환경영향평가 연구에 활용하며, 지방자치단체·환경관리기관은 대기배출시설 관리 정책 수립 및 환경규제 집행 계획 수립에 활용할 수 있습니다.
