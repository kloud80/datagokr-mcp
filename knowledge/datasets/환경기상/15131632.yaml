description_portal: 서울시 제로식당 목록은 배달 주문 시 일회용 용기 대신 다회용기를 사용하여 음식을 제공하는 친환경 식당들을 모아둔 데이터입니다. 이 데이터에는 각 제로식당의 상호명과 실제 위치를 확인할 수 있는 주소 정보가 포함되어 있어, 시민들이 가까운 제로식당을 쉽게 찾아 이용할 수 있도록 돕습니다. 특히 배달 문화가 일상화된 상황에서, 다회용기 사용은 플라스틱 쓰레기와 일회용품 사용을 줄이는 데 중요한 역할을 합니다. 이 데이터는 서울시가 추진하는 자원순환 및 탄소중립 정책과도 맞물려 있으며, 환경 보호에 관심 있는 시민, 관련 업체, 연구자들에게 유용한 기초 자료로 활용될 수 있습니다. 이를 통해 제로식당 이용을 활성화하고, 지속 가능한 소비문화 조성에 기여하는 것을 목표로 합니다.
