summary_user: 부평구 대기오염측정소에서 측정한 미세먼지(PM10)·초미세먼지(PM2.5)·아황산가스·이산화질소·오존·일산화탄소 농도를 연월 단위로 정리한 월별 집계 파일이며, 활용신청 없이 받는 약 3.4KB 크기의 CSV입니다. 부평구 주민이나 환경 분석가가 "부평구 미세먼지는 계절별로 언제 높고, 국내·WHO 기준과 비교하면 어느 수준인가"를 확인하는 데 쓴다. 측정소 코드 같은 전역 조인 키는 없어서, 다른 데이터와는 연월 값을 맞추거나 같은 기관(부평구) 기준으로만 이어 쓴다.
description_portal: '대기오염측정소에서 월별로 측정된 미세먼지(PM10), 초미세먼지(PM2.5), 아황산가스(SO₂), 이산화질소(NO₂), 오존(O₃), 일산화탄소(CO) 농도 정보를 수록한 환경데이터.지역 대기질 수준을 정량적으로 진단하고, 건강영향 분석, 환경정책 수립, 고농도 대기오염 대응체계 마련에 활용됨.활용 목적 및 특징– 월별 오염물질 농도 변동 추이를 통한 계절별 대기질 분석– WHO, 국내기준 대비 농도 비교를 통한 위험도 평가– 기후변화 대응 및 미세먼지 저감정책의 효과 측정 기반자료– 지역주민 건강보호를 위한 환경행정 및 정보공개 자료로 활용주요 항목 설명● 연월: 해당 측정값이 기록된 연도 및 월● 미세먼지 / 초미세먼지: PM10 및 PM2.5 농도(㎍/㎥, 마이크로그램/세제곱미터)● 아황산가스 / 이산화질소 / 오존 / 일산화탄소: 각각 SO₂, NO₂, O₃, CO의 대기 중 농도(ppb)'
