description_portal: 본 데이터는 대전광역시 관내의 사물인터넷(IoT)을 기반으로 한 측정기기를 부착한 사업장의 현황자료를 포함하고 있습니다. 자료에는 각 사업장의 명칭, 소재지, 전화번호 등 기본적인 위치 및 연락가능한 정보가 포함되어 있습니다. 참고로 측정기기 부착 현황은 사업장의 설치 진행 상황에 따라 수시로 변동될 수 있으며, 대기환경보전법에 따른 4종 및 5종 사업장(배출량이 적은 소규모 사업장)을 중심으로 작성되었으나, 세부적으로 종별을 구분하여 제공하지는 않고 있습니다. 따라서 자료를 활용할 때에는 위의 사항을 참고하여 주시기 바랍니다.
