description_portal: 본 자료는 전라남도 광양시 전역에서 운영 중인 대기오염 측정소의 설치 및 운영 현황을 체계적으로 정리한 데이터입니다. 대기환경은 시민 건강과 직결되는 주요 생활환경 요소로, 본 자료는 측정소 명칭, 설치 위치, 측정 항목, 설치 시기 등을 포함하고 있어, 광양시의 대기질 관리 체계를 한눈에 파악할 수 있도록 구성되어 있습니다.측정항목에는 대기환경기준과 밀접하게 연관된 이산화질소(NO₂), 아황산가스(SO₂), 미세먼지(PM-10), 초미세먼지(PM-2.5), 오존(O₃), 일산화탄소(CO) 등의 주요 오염물질뿐만 아니라, 기상측정장비를 통한 풍향, 기온 등 보조 지표도 포함되어 있어 환경 데이터 분석과 예측 모델링, 환경영향평가, 행정 정책 수립 등에 다양하게 활용될 수 있습니다.이 자료는 시민의 알권리 보장과 환경정보의 투명한 공개를 위한 기반자료로, 환경오염 민원 대응, 고농도 미세먼지 대응정책 수립, 어린이·노약자 보호구역 선정, 환경교육 자료 제작 등 다방면에서 행정 및 공공적 활용 가능성이 높습니다. 또한, 측정소 설치연월은 장비 교체 및 유지보수 계획 수립 시 참고지표로 활용됩니다.
