summary_user: 경기도 안양시 관내에서 실내공기질 관리법상 유지기준을 지켜야 하는 다중이용시설을 시설 한 곳당 한 행으로 담은 파일(약 28KB CSV)이며, 시설구분(어린이집·노인요양시설·학원·영화관 등)·시설명·소재지주소·데이터기준일자를 수록한다. 시민이나 분석가가 '우리 동네 어린이집·요양시설 중 실내공기질 관리 대상은 어디인가'를 확인하거나, 지자체가 점검 대상 시설 목록을 정리하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·소재지주소를 문자열로 맞추거나 주소를 좌표로 바꿔 연결해야 하며, 시설구분 값으로 다른 시군의 같은 이름 데이터와 묶어 볼 수 있다.
description_portal: '안양시 실내공기질관리법 제3조 및 동법 시행령 제2조에 따른 적용대상 시설 현황(시군명, 시설구분, 시설명, 소재지주소, 데이터기준일자)입니다.데이터 설명: 안양시_실내공기질 관리법 적용대상 다중이용시설현황이 데이터는 「실내공기질 관리법」 제3조 및 동법 시행령 제2조에 따라 실내공기질 유지기준 적용 대상인 다중이용시설의 현황을 수록한 자료입니다. 안양시 관내의 공공 및 민간 다중이용시설 중 법적 기준에 따라 실내공기질을 관리해야 하는 시설들을 포함하고 있으며, 다음과 같은 정보를 제공합니다- 시군명: 경기도 안양시- 시설구분: 예) 어린이집, 노인요양시설, 학원, 영화관 등- 시설명: 각 시설의 고유 명칭- 소재지 주소: 시설의 위치- 데이터 기준일자: 정보가 수집된 기준 날짜이 데이터는 시민 건강 보호 및 쾌적한 실내 환경 조성을 위한 정책 수립, 환경 모니터링, 시설 관리 등에 활용될 수 있으며, 특히 어린이, 노약자, 임산부 등 건강취약계층이 주로 이용하는 시설의 공기질 관리 현황 파악에 유용합니다.'
