description_portal: '비점오염원은 도시, 도로, 농지, 산지, 공사장 등으로서 불특정장소에서 불특정하게 수질오염물질을 배출하는 배출원으로 비점오염원으로부터 배출되는 수질오염물질을 제거하거나 감소시키는 시설이 비점오염 저감시설입니다.비점오염 저감시설 구축사업 중 국가보조 사업으로 추진중인 비점오염저감 국고보조사업 시설의 모니터링 설계 기준에 대한 데이터로서 유입과 유출 설계 예시 자료를 개방 제공합니다.BOD : 생화학적 산소요구량COD : 화학적 산소요구량SS : 부유물질TN : 총질소TP : 총인'
