summary_user: 비점오염저감 국고보조사업 시설의 모니터링 설계 기준 예시 자료로, 사업번호·연도·모니터링 회차별로 유입과 유출의 시분·강우량·유량과 BOD·COD·SS·총질소·총인 농도를 담은 작은 CSV 파일(1,481바이트)이다. 비점오염 저감시설을 설계하거나 모니터링 계획을 세우는 사업자·지자체 담당자가 '강우 시 유입·유출 수질 측정값을 어떤 항목과 형식으로 기록해야 하는가'를 확인하는 견본으로 쓴다. 전역 조인 키는 없으며, 다른 비점오염 저감시설 자료와는 국고보조사업번호(국고보조사업번호)를 이름 대조하는 방식으로만 이어 쓸 수 있다.
limits: 설계 기준을 보여 주는 예시 자료이므로 실제 시설별 저감 효율이나 전국 현황 분석에는 쓰지 못한다. 범위는 전국이지만 지역 구분이 없는 비공간 자료여서 지도나 행정구역 단위로 묶을 수 없다.
