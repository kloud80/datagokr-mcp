summary_user: 충청남도 보령시 관내에 설치된 폐농약용기 수거함을 마을별로 한 행씩 담은 파일로, 읍면동·마을명·설치대수와 도로명·지번 주소, 위도·경도를 담는다. 농업인이 '우리 마을에서 다 쓴 농약병을 어디에 버리나'를 찾거나, 분석가가 읍면동별 수거함 배치 현황과 공백 지역을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 읍면동·마을명 같은 이름 매핑, 주소, 또는 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 친환경 농업 확산과 농촌 환경보전에 대한 사회적 관심이 증대되면서, 농약 사용으로 인한 환경오염 방지와 폐농약용기의 적정한 처리를 통한 농업환경 개선이 중요한 농업환경정책 과제로 대두되고 있습니다. 폐기물관리법과 농약관리법에 따른 체계적인 폐농약용기 관리와 농업인들의 환경보전 의무 이행 지원을 위한 수거·처리 인프라 구축이 요구되고 있으며, 농약용기 재활용 촉진과 자원순환 농업 실현을 통한 지속가능한 농업 발전이 필요합니다. 폐농약용기 불법투기 방지와 토양·수질 오염 예방을 위한 안전한 수거 시스템 운영과 농업인 참여 확대가 중요해지고 있으며, 농업인들의 폐농약용기 처리 편의성 향상과 처리 비용 절감을 위한 접근성 높은 수거함 배치가 요구되고 있습니다. 또한 농약 안전사용 교육과 폐농약용기 적정 처리 방법 홍보를 통한 농업인 인식 개선이 필요하며, 농업환경 정책 수립과 효과적인 농약 안전관리 체계 구축을 위한 체계적인 현황 관리의 중요성이 증대되고 있어, 충청남도 보령시는 관내에 설치된 폐농약용기 수거함의 위치 정보 등 농업환경 보전과 폐농약용기 적정 처리에 필요한 종합적인 폐농약용기 수거함 현황 정보를 제공하고 있습니다.
