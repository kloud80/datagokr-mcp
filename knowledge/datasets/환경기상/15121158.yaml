summary_user: 인천광역시 서구(서해구) 관내 폐기물 수집·운반업체를 업체 1곳당 1행으로 정리한 원장형 목록으로, 업종·상호·전화번호·주소·취급 폐기물종류를 담는다(CSV 약 66KB). 사업장 폐기물을 맡길 수집·운반업체를 찾는 사업자나, 구 안의 폐기물 종류별 수거업체 분포를 보려는 행정·분석가가 "우리 동네에서 이 폐기물을 수거하는 허가 업체는 어디인가"를 확인하는 데 쓴다. 전역 조인 키나 사업자번호 같은 공통 코드가 없어 다른 폐기물 처리업·배출자 데이터와는 상호명이나 주소 문자열 매칭으로만 잇는다.
description_portal: 본 공공데이터는 인천광역시 서구 관내에서 폐기물 수집 및 운반업을 수행하는 업체들의 현황을 정리한 자료입니다. 본 공공데이터는 업종, 상호, 전화번호, 폐기물종류 등의 항목으로 구성이 되어 있습니다. 본 공공데이터를 통해 다양한 폐기물의 수거,운번에 종사하는 업체의 분포를 파악할 수 있으며 또한 폐기물 관리 정책 수립, 생활폐기물 수집 및 처리 등 환경 관련 행정업무에도 활용될 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
