summary_user: 경기도 시군별 약수터 시설 현황을 분기 단위로 집계한 자료로, 집계년월·점검분기별로 이전 분기 시설 수, 사용중지·사용금지 수, 지정·폐쇄 수, 현재 시설 수를 담는다. 시민이나 환경보건 담당자가 '우리 시군 약수터 중 이번 분기에 수질 문제로 사용중지·금지된 곳이 몇 곳이고 시설이 줄고 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 시군명·시군코드(SIGUN_CD)를 이름·코드로 매핑해 같은 기관의 다른 시군 단위 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별 약수터 시설의 분기별 집계 현황을 나타낸 자료로, 약수터의 운영 여부 및 시설 수 변화, 점검 결과에 따른 사용중지·사용금지 조치 등을 포함하고 있습니다. 주요 항목은 집계년월, 점검분기, 시군명, 이전분기시설수, 사용중지수, 사용금지수, 지정수, 폐쇄수, 현재시설수로 구성되어 있으며, 이는 해당 지역 약수터의 수질 안전성 평가 및 관리 상태를 보여주는 지표로 활용됩니다. 본 데이터는 공공 음용수 공급시설로서 약수터의 위생 관리 실태 파악, 시설 정비 계획 수립, 시민 이용 편의 개선 및 환경보건 정책 수립 등에 활용될 수 있습니다.
