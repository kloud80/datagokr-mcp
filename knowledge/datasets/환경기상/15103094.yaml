summary_user: 경기도 파주시에 등록된 동물원을 시설 한 곳당 한 행으로 담은 파일로, 명칭·도로명/지번 주소·위도·경도, 등록일자, 운영 유형(개인/법인), 실내외 구분, 총면적·사육면적, 사육 종수·개체수, 상근·촉탁 수의사와 사육사 인원을 싣는다. 시민이나 동물복지 분석가가 '파주시 동물원은 면적과 사육 개체수에 비해 수의사·사육사를 얼마나 두고 있는가'를 시설별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지자체 동물원 등록현황과는 동물원명·주소로 맞추고, 지도 레이어와는 위도·경도로 겹쳐 쓴다.
limits: 파주시 한 개 시군구만 다루는 986바이트 규모의 작은 CSV라 전국·광역 단위 비교에는 다른 지자체 파일을 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 세부 부문은 생물종·야생동물로 분류돼 있지만 종 관찰 지점이 아니라 사육 시설 현황이라, 야생 종 분포 분석에는 맞지 않는다.
