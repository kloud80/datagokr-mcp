description_portal: ‘서울시 공원(공원율) 통계’는 서울시 각 자치구의 행정구역 면적과 공원 면적, 공원율 및 다양한 공원 관련 정보를 제공합니다. 이 데이터는 각 자치구의 전체 면적에 대한 공원 면적의 비율인 공원율을 보여주며, 공원 유형별 면적도 나누어 설명합니다. 주요 지표로는 자연공원(국립) 면적, 도시자연공원구역 면적, 도시계획시설(공원) 및 기타공원 면적 등이 포함됩니다. 또한, 공원 면적 중 조성된 면적과 미조성 면적을 구분하여 보여줍니다. 서울시 전반적으로 공원 면적이 확대되고 있지만, 각 자치구별로 공원 조성 상황과 공원율은 상이하여, 도시 계획 및 공원 개발 정책을 위한 중요한 기준 자료로 활용될 수 있습니다.
