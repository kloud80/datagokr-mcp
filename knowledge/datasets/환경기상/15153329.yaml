summary_user: 전국을 대상으로 행정안전부 재난안전데이터 공유플랫폼이 제공하는 동네예보 습도 값을 담으며, 위치 좌표(경도·위도로 보이는 LTC_XCRD·LTC_YCRD), 발표 시각, 예보 시간대별 습도 1~22번 칸이 한 행에 들어가는 형태입니다. 특정 지역의 앞으로 몇 시간 동안 습도가 어떻게 변하는지 알고 싶은 국민이나, 습도를 재난·안전 분석(산불·폭염 등)에 넣으려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 이 부문에서는 예보 격자(nx, ny)나 예보구역이 연결 기준이지만 이 데이터에서는 좌표 필드를 통한 위치 매칭으로만 다른 기상·재난 데이터와 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 동네예보습도에 대한 관련 정보입니다.\""
