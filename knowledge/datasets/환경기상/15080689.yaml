summary_user: 청주시 안에 있는 대기오염물질 배출시설 사업장을 한 행에 한 곳씩 담은 목록 파일(CSV, 약 64KB)로, 업체명·도로명 소재지·업종·종별(1~5종, 배출량과 시설 규모에 따른 구분)을 담는다. 주민이나 분석가가 '우리 동네 주변에 대형 배출사업장(1·2종)이 어디에 몰려 있고 어떤 업종인가'를 확인할 때 쓴다. 전역 조인 키나 사업자번호가 없으므로 다른 데이터와는 소재지 주소를 지오코딩하거나 업체명을 대조하는 방식으로만 이어 쓴다.
limits: 사업자번호 같은 공통 키가 없어 기업 정보·인허가·TMS 자료와 바로 연결되지 않고, 업체명·주소 매칭에 의존해야 한다. 범위는 청주시 한 곳뿐이며 배출량 수치나 측정값은 담지 않는다.
