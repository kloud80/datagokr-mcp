description_portal: 청주시 대기배출시설 데이터는 지역 내 대기오염원에 대한 체계적인 관리와 환경정책 수립을 위한 기초자료로 활용됩니다. 이 데이터는 연번, 업체명, 소재지(도로명), 업종명, 종별 정보를 포함하고 있으며, 이를 통해 특정 지역에 위치한 대기오염 배출 사업장의 분포와 업종별 특성을 파악할 수 있습니다. 특히 ‘종별’ 정보는 1종부터 5종까지로 구분되며, 이는 배출되는 오염물질의 양과 시설의 규모에 따라 분류됩니다. 관련된 상세한 내용은 대기환경보전법 시행규칙(환경부) 별표5,6번을 보면 자세하게 알수 있으며, 1종은 배출량이 매우 많은 대형시설(제철소, 발전소 등), 2종은 배출량이 많은 중대형 제조업체, 3종은 일반적인 제조업체, 4종은 소규모 배출사업장, 5종은 배출량이 극히 적은 소규모 시설로 구분이 됩니다.
