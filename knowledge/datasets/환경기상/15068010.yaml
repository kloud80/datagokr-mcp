description_portal: 이 데이터는 한국환경산업기술원에서 1999년부터 2019년까지 환경신기술 기술분야별 발급 건수에 대한 연도별 통계자료를 제공하는 공공데이터입니다. 수질, 폐기물, 대기, 기타 등 다양한 분야를 구분하여 연도별 발급 건수를 기록하는 총 10개의 필드를 포함합니다. 이를 통해 기술 분야별 성장 추세와 시장 수요 변화를 분석할 수 있으며, R&D 투자 전략 수립, 정책 방향 설 정 및 기술 상용화 타당성 평가 등에 활용이 가능합니다. 학계와 산업계는 분야별 통계를 토대로 협력 과제 기획 및 기술 역량 강화 방안을 마련할 수 있습니다.
