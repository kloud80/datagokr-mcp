description_portal: 해양환경공단이 제공하는 침몰선박 현황 데이터에 대한 정보를 제공합니다. 본 데이터는 국내 해역에서 침몰한 선박의 위치 좌표, 선박명, 침몰 일자, 수심, 총통수, 선종 등 다양한 세부 정보를 포함하고 있습니다. 이를 통해 침몰선박으로 인한 해양오염 가능성, 항행 안전 저해 요소, 해저 서식지 훼손 가능성 등을 종합적으로 파악할 수 있습니다. 해당 정보는 해양사고 대응계획 수립, 정화사업 우선순위 설정, 해양공간계획 수립, 환경영향평가와 연계되어 공공기관, 연구기관, 지자체, 민간사업자 등이 정책, 연구, 기술개발, 사업 추진에 폭넓게 활용합니다.
