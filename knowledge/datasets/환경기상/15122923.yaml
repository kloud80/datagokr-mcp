summary_user: 경기도 내 공공기관의 녹색제품 구매계획을 제품 분류(대분류·중분류·품목)별로 정리한 집계 자료로, 총구매수량·총구매금액, 친환경 제품 구매수량·금액, 전체 대비 수량·금액 비율을 담는다. 경기도 공공부문이 어떤 품목에서 녹색제품을 얼마나 사들이려 하는지, 품목별 녹색구매 비율이 낮은 곳은 어디인지 보려는 정책 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명 같은 이름 매핑이나 같은 기관(경기도) 자료로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 공공기관에서 추진한 녹색제품 구매계획에 대한 현황을 정리한 자료로, 각 제품별 총구매수량과 총구매금액, 전체 구매 대비 수량 및 금액 비율 등을 포함하고 있습니다. 녹색제품은 「탄소중립ㆍ녹색성장 기본법」 제66조에 따라 정의되며, 자원 절약과 온실가스·오염물질 배출 저감을 목적으로 하는 친환경 제품입니다. 이 데이터는 경기도가 기후위기 대응 및 지속가능한 소비 촉진을 위해 어떤 녹색제품을 얼마나 구매했는지를 구체적으로 보여주며, 향후 정책 수립이나 평가에 있어 중요한 지표로 활용될 수 있습니다.
