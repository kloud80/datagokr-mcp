summary_user: 전국 읍면동 단위로 기타수질오염원(골프장, 운수장비정비·폐차장, 농축수산물 단순가공시설, 사진처리·X-Ray 시설, 안경점, 거점소독시설 등)의 업종별 사업장 수를 연도별로 담은 집계 API이며, 전체 87,880건이다. 지자체 환경 담당자나 분석가가 우리 읍면동에 골프장·정비시설·안경점 등 소규모 수질오염원이 몇 곳 있는지 파악하는 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 찾지 못해 다른 데이터와는 시도·시군구·읍면동 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 물환경보전법 제23조 및 동법 시행규칙 제32조에 의해 매년 시도지사는 관할구역의 오염원 종류, 수질오염원 발생량 등을 조사하며, 생활계, 축산계, 산업계, 양식계, 토지계, 매립계, 환경기초시설, 기타수질오염원 등 총 8개 오염원에 대해 자료를 조사한다. 기타수질오염원은 물환경보전법 시행규칙 별표1에 따라 골프장, 운수장비정비 또는 폐차장 시설, 농축수산물 단순가공시설, 사진처리 또는 X-Ray 시설, 금은판매점의 세공시설, 안경점, 복합물류터미널시설, 거점소독시설에 대해 조사하고 있다.
