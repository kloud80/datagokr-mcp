summary_user: 나주시 안에서 벙커C유를 연료로 쓰는 사업장을 한 곳씩 담은 목록으로, 업체명·소재지·전화번호·데이터기준일자로 구성된 작은 파일(약 413바이트)이다. 지자체 환경 담당자나 분석가가 "나주에서 고황유를 쓰는 사업장이 어디에 있고 어떻게 연락하나"를 확인해 지도점검이나 연료 전환 대상을 추릴 때 쓴다. 공통 조인 키가 없으므로 다른 대기배출 사업장 자료와는 업체명이나 소재지 주소를 맞춰 이어 쓴다.
description_portal: 이 데이터는 지역 내 벙커C유 사용 사업장의 분포와 기본 정보를 체계적으로 관리하기 위한 환경·행정 기반 자료로 구성되어 있으며, 연번, 사업장명, 소재지 지번주소, 전화번호 등의 항목으로 구성된다. 고황유는 질소산화물(NOx), 황산화물(SOx), 먼지 등 대기오염물질 배출 가능성이 높기 때문에, 해당 연료를 사용하는 사업장은 환경관리 측면에서 지속적인 모니터링이 필요하다. 이 데이터는 사업장 소재지와 연락처를 명확히 파악하여 정기 지도점검, 연료 전환 지원, 환경기초시설 설치 검토, 배출원 관리계획 수립 등에 활용될 수 있습니다.
