summary_user: 경기도 포천시가 대형폐기물 품목별·규격별 수거수수료(원)를 한 줄씩 정리한 목록 파일로, 품목명·규격(부피·높이·종류 등)·수수료·데이터기준일자를 담는다. 포천시 주민이 장롱이나 소파 같은 대형폐기물을 내놓기 전에 "이 크기면 수수료가 얼마인가"를 확인하거나, 분석가가 시군 간 대형폐기물 수수료 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 지자체의 대형폐기물 수수료 파일과는 품목명·규격 이름을 맞춰 붙이거나 같은 기관 기준으로만 연결한다.
description_portal: 경기도 포천시 대형폐기물처리 수수료 현황 정보입니다. 번호, 폐기물품목, 대형폐기물규격, 수거수수료(원),데이터기준일자 항목들을 포함하고 있습니다. 폐기물품목 항목은 대형폐기물 종류는 나타냅니다. 대형폐기물규격 항목은 폐기물품목 종류에 따른 규격(부피, 높이, 종류 등)을 나타냅니다.  수거수수료는 품목별 규격에 따라 책정된 처리 비용을 원 단위로 나타내며, 데이터기준일자는 본 자료가 최종 갱신된 일자를 의미합니다. 이 데이터는 생활폐기물 행정 처리 기준 마련, 주민 안내용 수수료 고시자료 정비,대형폐기물 관련 예산 수립 등 다양한 행정업무에 활용될 수 있습니다.
