description_portal: 서울시 야생동식물 정보 데이터는 서울시 내에 서식하거나 관찰되는 야생 동식물의 분류학적 정보와 보호·관리 현황을 종합적으로 제공하는 자료입니다. 종코드와 국명, 학명을 통해 각 종을 정확히 식별할 수 있고, 계·문·강·목·과에 대한 국문 이름 정보를 통해 생물 분류 체계를 한눈에 파악할 수 있습니다. 형태특성과 생태특성 항목은 각 종의 외형적 특징과 서식 환경, 생활사 등을 이해하는 데 중요한 기초 정보를 제공합니다. 서울시보호종 여부, 고유종 여부, 멸종위기야생동식물 여부, 천연기념물 지정정보 등은 보전 우선순위를 판단하는 핵심 지표로 활용되며, 포획금지, 수렵동물, 생태계교란 야생동식물, 외래식물 여부 등은 관리·단속 및 생태계 보전 정책 수립에 필수적인 기준 정보를 담고 있습니다. 이 데이터는 도시 생물다양성 연구, 보호종 관리, 생태계 교란종 대응, 환경 교육 자료 제작 등 다양한 분야에서 활용 가능한 중요한 생태 정보입니다.
