description_portal: 본 데이터는 국립공원 내에 설치된 자동기상관측장비(AWS, Automatic Weather Station)를 통해 수집된 기상관측 정보를 포함한 자료로, 국립공원 내 실시간 기상 모니터링, 탐방객 안전관리, 생태환경 변화 감지 등을 목적으로 구축되었습니다. 주요 항목에는 관측 지점명, 위치 좌표(위도·경도), 해발 고도, 수집 일시, 기온(℃), 풍속(m/s), 풍향(°), 강수량(mm), 습도(%), 적설량(cm), 기압(hPa) 등의 측정값이 포함되며, 관측 간격은 일반적으로 10분 또는 1시간 단위로 설정되어 있습니다. 해당 데이터는 국립공원 재난안전 플랫폼, 기후변화 대응 연구, 기상 기반 탐방 통제 시스템, 기후생태 연계분석, 탐방객 실시간 기상안내 등 다양한 분야에서 활용됩니다. CSV 또는 실시간 연동 가능한 API 형식으로 제공되며, 공간정보 시스템(GIS) 및 모바일 탐방정보 앱과의 연계도 가능합니다.
