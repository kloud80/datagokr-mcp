summary_user: 충청북도 제천시에 신고된 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 목록으로, 사업장구분·사업장명·지번주소·전화번호가 들어 있는 약 6.7KB 크기의 CSV 파일이다. 제천시에서 음식점·집단급식소 등 어떤 사업장이 음식물쓰레기 다량배출자로 신고돼 있는지 확인하려는 주민·사업자, 그리고 지역별 다량배출사업장 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 사업장명이나 지번주소를 맞춰 잇고, 같은 제천시의 다른 생활폐기물 배출·수거 지점 파일과 나란히 놓고 본다.
description_portal: 해당 데이터는 충청북도 제천시의 음식물류을 정리한 데이터입니다. 연번, 지역, 시, 사업장구분, 사업장명, 사업장 지번주소, 사업장 전화번호, 데이터기준일 등의 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 충청북도 제천시의 음식물류폐기물다량배출사업장 신고현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 12월 29일입니다. 담당부서는 제천시 안전건설국 자원순환과이며 문의주시면 최신의 충청북도 제천시 음식물류폐기물다량배출사업장 신고현황을 열람하실 수 있게 도와드립니다.
