summary_user: 전국 지하수 수질측정망 관측정 6,850곳의 제원(주소, 관측소명, 관정구분, 지하수용도, 음용여부 등)을 관정 단위로 담은 원장 파일이다. 지역별 지하수 관측 현황을 비교하거나 어느 지역에 음용 관정이 있는지 파악하려는 분석가·연구자가 쓴다. 주소(address)를 조인 키로 삼아 주소 기반의 다른 지하수·수질 자료와 이어 쓰며, 코드표가 입력에 없어 코드값 해석은 별도 확인이 필요하다.
description_portal: 지하수 수질측정망 제원에 대한 정보를 제공합니다. 해당 자료는 지하수 수질측정망의 주소, 관측소명, 관정구분, 지하수용도코드, 음용여부, 구분 등의 정보를 포함하고 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며, 민간 및 공공기관의 연구와 정책 수립에 활용할 수 있는 기초자료입니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
