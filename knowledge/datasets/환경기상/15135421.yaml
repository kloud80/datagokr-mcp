summary_user: 경기도 대기환경 진단평가시스템에서 사용자가 요청해 수행한 대기질 역추적 분석 결과를 건별로 담는다(역추적코드, 수행일시, 위도·경도, 실측과 모델 예측의 차이, 역추적 결과 내용). 환경 연구자나 행정 담당자가 특정 시점·지점에 들어온 대기오염물질이 어느 경로로 유입됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 측정소 대기질 자료 등과는 위도·경도와 수행일시를 기준으로 근사 매칭해 이어 쓴다.
description_portal: 경기도_대기환경_진단평가시스템_사용자역추적결과 데이터는 경기도에서 운영하는 대기환경 진단평가시스템을 통해 수행된 사용자 요청 기반의 대기질 역추적 분석 결과를 기록한 자료입니다. 주요 항목으로는 번호, 역추적코드, 역추적수행날짜, 위도, 경도, 역추적차이, 역추적결과가 포함되어 있으며, 특정 시점과 좌표(위도·경도)를 기준으로 대기오염물질 이동 경로와 영향 요인을 분석하는 데 활용됩니다. 역추적차이 값은 실제 측정값과 모델 예측치 간의 차이를 의미하며, 환경 연구자와 행정기관은 이를 오염원의 유입 경로를 확인하는 등으로 활용할 수 있습니다.
