summary_user: 광주 서구 관내 종량제봉투 판매업소를 업소 한 곳당 한 행으로 담은 건별 목록으로, 판매소명·전화번호·도로명주소를 담는다(CSV 파일 약 55KB). 주민이 '우리 집 근처에서 종량제봉투를 어디서 살 수 있나'를 찾거나, 분석가가 구 안에서 판매소가 어떻게 분포하는지 볼 때 쓴다. 다른 데이터와 맞출 전역 조인 키나 코드는 없으므로, 도로명주소를 지오코딩해 지도에 올리거나 다른 지자체의 같은 종류 파일과 판매소명·주소 기준으로 이어 쓴다.
description_portal: 광주광역시 서구 관내 종량제봉투를 판매하는 업소에 대한 현황 정보로, 연번, 판매소명, 전화번호, 도로명주소 등의 세부 항목으로 구성되어 있습니다. 이 데이터는 생활폐기물 처리체계의 핵심 수단인 종량제 봉투의 유통망을 파악하고, 주민들이 가까운 판매소를 손쉽게 찾을 수 있도록 지원하기 위한 목적에서 수집되었습니다. 행정기관의 폐기물 감량 정책 수립, 수요 기반 재고 조정, 주민 편의 제고, 지역 내 유통분포 분석 등 다양한 행정 및 정책적 활용이 가능하며, 매년 정기적으로 갱신되어 최신 현황을 반영합니다. 특히 도로명주소 기반으로 구축되어 있어 GIS 및 행정지도와의 연계 활용도 우수하며, 환경정책의 실효성과 주민 접근성을 높이는 데 기여합니다.
