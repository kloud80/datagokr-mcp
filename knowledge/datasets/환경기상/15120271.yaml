summary_user: 인천환경공단 공촌사업소 주변(서구 아파트 단지, 공촌천 유수지, 학교 근처 등) 악취 발생 구역을 측정일자·측정지점별로 직접 측정한 건별 기록으로, 주소와 위도·경도 좌표, 복합악취 희석배수 측정값을 담은 CSV 파일(약 21KB)이다. 공촌사업소 인근 주민이나 환경 분석가가 "우리 동네 측정 지점의 악취 농도가 달마다 어떻게 달라졌나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 측정 좌표(위도·경도)나 주소로 공간 매칭하거나 같은 기관(인천환경공단)의 다른 사업소 악취 자료와 이름으로 맞춰 이어 쓴다.
