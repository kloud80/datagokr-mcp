summary_user: 서울특별시 송파구의 실내공기질 관리대상 다중이용시설을 시설 하나씩 한 행으로 담은 목록으로, 시설군·시설명·소재지도로명주소·데이터기준일자를 싣고 307건이다. 주민이나 분석가가 우리 동네에 실내공기질 관리 대상 시설이 어디에 있고 어떤 시설군인지 확인하는 질문에 쓴다. 소재지도로명주소(address)를 조인 키로 삼아 같은 주소 기준의 다른 시설·위치 데이터와 이어 쓰며, 이 파일에는 측정값이 없어 실내공기질 측정 결과는 별도 자료와 붙여야 한다.
