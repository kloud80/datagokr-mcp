summary_user: 제주특별자치도가 관리하는 보호수(역사적·학술적 가치가 있는 노목·거목·희귀목)의 수를 수종(구분)별로 제주시·서귀포시 두 행정시로 나눠 집계한 표로, 407바이트 크기의 작은 CSV 파일이다. 제주 지역 보호수가 어떤 수종에 몰려 있는지, 제주시와 서귀포시 중 어디에 더 많은지 같은 질문에 연구자나 지역 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수종명이나 행정시 이름을 맞춰서만 이을 수 있다.
description_portal: 제주특별자치도 내 각 행정시별로 관리중인 보호수 수종별 수치 데이터를 제공합니다. *표준데이터와 별도*보호수란 역사적·학술적 가치 등이 있는 노목(老木), 거목(巨木), 희귀목(稀貴木 )등으로서 특별히 보호할 필요가 있는 나무를 대상으로 함*소나무, 팽나무, 은행나무 등산림보호법 제13조 보호수의 지정·관리 및 산림보호구역의 지정·관리를 따름자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1547
