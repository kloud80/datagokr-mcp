summary_user: 해양환경측정망 근해 조사정점의 코드·명칭과 소속 해역·세부 해역, 경도·위도 좌표를 정점 단위로 담은 API로, 전체 2,640건이며 전국 범위다. 해양 수질을 분석하는 사람이 근해 조사정점이 어느 해역 어디에 있는지 확인하는 질문에 쓴다. 경도(lon)·위도(lat) 좌표 키로 다른 좌표 기반 해양 데이터와 공간적으로 이어 쓰며, 정점 코드(stnpntCode)는 같은 정점 자료를 찾는 연결 단서로 쓸 수 있으나 조인 키로 확인된 것은 좌표뿐이다.
description_portal: 이 데이터는 해양환경공단이 운영하는 해양환경측정망의 근해 정점 정보를 조회할 수 있도록 제공되는 공공데이터 API 서비스이다. 이용자는 근해에 설정된 조사정점의 코드, 명칭, 위치 정보 등 기본 공간 데이터를 확인할 수 있으며, 각 정점이 포함된 해역 구분과 관리 단위에 대한 구조화된 정보를 함께 조회할 수 있다. 또한 정점별 관측 가능 항목과 측정 장비 구성, 조사 주기 등 운영 특성을 파악할 수 있도록 관련 세부 정보를 제공하여 향후 자료 활용의 정확성을 높이도록 구성하였다. 아울러 해당 정점에서 수집되는 수질 및 환경 자료와의 연계성을 고려하여 분석이 용이하도록 표준화된 형식으로 데이터를 제공함으로써 이용자가 근해 해역의 특성과 조사체계를 이해하고 공간적 비교·검토를 수행할 수 있도록 지원하는 서비스이다.
