description_portal: 이 데이터는 해양수산부에서 제주연안 10개 정점의 해양방사성물질 중 삼중수소의 신속분석 결과를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 조사 수행일시, 조사 정점 명칭, 정점 북위 및 동경, 개략적 위치명, 증류법을 통해 측정한 삼중수소 농도와 농도 범위 정보로 구성되어 있습니다.  본 데이터는 해양 환경 내 방사성물질의 감시 체계 구축, 해양수질 관리방안 마련, 방사성물질 영향 평가 연구, 방재 계획의 근거자료, 지역사회의 환경 안전성 모니터링 등 목적에 활용될 수 있습니다.
