description_portal: '기상특보는 한파, 건조, 안개, 폭염, 지진해일, 폭풍해일, 호우, 대설, 태풍, 풍랑, 강풍 12개 기상현상에 대해 중대한 재해발생이 예상될 때 해당 지역에 대하여 기상특보의 발표 기준에 따라 주의보 및 경보로 구분하여 178개 시 · 군 단위와 44개 해역으로 세분화하여 발표합니다. 생산주기: 특보 발표시보유기간: 2004년 6월 30일 ~ 현재(참고) 기상정보는 주요 위험기상에 대해 현상별·단계별 정형화된 통보문을 제공하고 있으며, 기본 그래픽 제공, 내용 간결화 하여 가독성을 개선하여 제공하고 있습니다. 기상해설은 중점사항, 날씨전망, 유의사항, 기압계현황 및 전망, 예보 변동성 등 표준형식을 정하여 제공하고 있습니다. 초단기, 단기, 중기 예보기간별 날씨현황 또는 현상 등 3개 내외의 그룹으로 나누어 설명을 제공합니다.'
