description_portal: 매립장은 환경오염을 방지하면서 자원재활용과 순환활용을 위해 수도권매립지관리공사에서 해당 부지들을 만들고 관련 시설을 구축하는 등의 노력으로 조성하고 있습니다.이와 관련한 매립장 정보와 매립량, 매립상태 등의 정보를 제공하고 있으며 세부적으로 제공하는 정보는 매립장코드, 매립시작일, 매립완료일, 매립면적, 부지면적, 순수설계량, 순수매립량, 설계량, 매립량, 매립상태코드, 침하측정위치파일경로, 침출수측정위치파일경로, 지하수측정위치파일경로 등의 정보를 제공합니다.이 데이터는 매립장의 위치, 면적, 용량, 매립 상태 등 기본 현황부터 운영방식, 처리실적, 환경 안전 관리까지 투명하게 공개하여 환경오염 예방과 자원순환 정책 추진에 기여할수 있습니다. 또한, 매립장별 조성 목적과 운영현황, 사후 활용 계획 등 다양한 정보를 포함하고 있어 연구와 정책 수립, 시민의 알권리 확보에 중요한 역할을 하고 있습니다.매립장코드정보는 1구역은 1A~1D로 표기하였고 2구역은 2A~2D, 3구역은 3A~3D, 4구역은 4A~4D까지로 명시하고 있습니다. 데이터 구성중 매립상태 코드의 의미하는 바는 다음과 같습니다.C는 매립완료(Completed), P는 매립진행중(In progress), S는 매립예정(schedule) 으로 표기하여 데이터들을 관리하고 있습니다.
