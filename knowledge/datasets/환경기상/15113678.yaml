summary_user: 대전광역시 유성구 관내 음식물류 폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 건별 현황 파일로, 상호명·신고일자·도로명/지번 주소·업소구분(음식점, 집단급식소, 대규모점포 등)·배출량을 담는다. 구청 담당자나 분석가가 '유성구에서 음식물 쓰레기를 많이 내는 사업장은 어디이고 업종별로 어떻게 분포하는가'를 확인하거나 지도점검 대상을 고를 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호명 매칭으로만 잇고, 다른 지자체의 같은 이름 파일과는 같은 항목끼리 이어 붙여 비교한다.
description_portal: 해당 데이터는 대전광역시 유성구 관내 음식물류 폐기물을 다량 배출하는 사업장에 대한 현황 자료로, 상호명, 사업자등록번호, 신고일자, 소재지 도로명 및 지번주소, 전화번호, 업소구분(음식점, 집단급식소, 대규모점포 등), 음식물류 폐기물 배출량, 관리기관명, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이 자료는 관내 폐기물 처리 대상의 규모 및 업종별 분포를 파악할 수 있어, 음식물류 폐기물 관리정책 수립, 배출량 모니터링, 점검 대상 선정 등 행정적 활용에 유용합니다. 특히 배출량이 많은 사업장을 중심으로 지도점검, 감량 유도 및 민간 위탁처리 체계 개선 등 구체적인 실행계획 마련 시 기초자료로 활용할 수 있습니다.
