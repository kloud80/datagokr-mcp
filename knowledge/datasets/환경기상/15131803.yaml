description_portal: 나고야의정서는 생물유전자원과 관련 전통지식의 이용에서 발생하는 이익을 자원 제공국과 공정하게 공유하도록 규정한 국제협약입니다.유전자원 이용자는 자원 보유국의 사전 승인과 상호합의조건을 거쳐야 하며, 이익이 발생할 경우 제공국과 이익을 공유해야 합니다.각국은 이를 이행하기 위해 관련 법률 제정, 정보공유체계 구축 등 제도적 장치를 마련하고 있습니다. 생물다양성협약 나고야의정서 이행을 위해 유전자원의 접근 및 이익공유와 관련된 국가별 ABS 정보 중 주요 당사국의 나고야의정서 관련 기초 정보입니다.
