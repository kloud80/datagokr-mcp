description_portal: '도시 인구 밀집과 상업 활동 증가에 따라 생활쓰레기 발생량은 지속적으로 증가하고 있으며, 이에 따른 환경문제 대응과 자원순환 정책의 필요성이 커지고 있습니다. 강남구는 쓰레기 발생 현황을 체계적으로 관리하고, 주민 의식 제고 및 정책 수립의 기초자료로 활용하기 위해 생활쓰레기 배출량 데이터를 제공하고 있습니다.개방 데이터는 구분(연도, 월), 배출유형, 배출항목, 배출량(톤), 관리부서, 데이터기준일자 등으로 구성되어 있습니다.※ 데이터는 매월 또는 연 단위로 갱신되며, 환경부 표준통계 기준에 따라 집계됩니다.활용 기대효과로는▶ 환경정책 수립 및 평가: 쓰레기 감량 정책, 분리배출 캠페인, 재활용 확대 등 환경정책 수립 시 과학적 근거자료로 활용 가능▶ 지역 간 비교 및 트렌드 분석: 행정동별 생활폐기물 배출 현황을 비교함으로써 배출 특성 분석 및 맞춤형 대응 전략 수립에 활용▶ 주민 의식 제고: 1인당 쓰레기 배출량 추이 등을 공개하여 주민의 환경의식 함양 및 자발적 감량 유도▶ 학계·연구기관의 자료 활용: 폐기물 처리기술, 자원순환경제 관련 연구에서 기초 통계자료로 활용 가능등이 있습니다.'
