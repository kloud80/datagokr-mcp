summary_user: 서울 강북구에서 대기오염물질 배출시설을 설치한 사업장의 인허가 정보를 사업장 한 곳당 한 행으로 담는 원천 목록으로, 영업 중인 곳과 폐업한 곳을 모두 포함하며 인허가일·영업상태·주소·업종·주생산품·배출시설과 방지시설의 가동시간 등을 담는다. 주민이나 분석가가 "우리 동네 근처에 대기 배출시설을 둔 사업장이 어디에 있고, 지금 영업 중인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 위치는 중부원점TM 좌표(XCRD·YCRD)로 주어져 지도에 올리려면 좌표 변환이 필요하다.
description_portal: '서울특별시 강북구 대기오염물질배출시설설치사업장 인허가 정보 데이터는 강북구의 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
