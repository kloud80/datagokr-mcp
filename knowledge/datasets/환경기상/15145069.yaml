description_portal: 다중지점통계는 두 개 이상의 관측지점(종관관측지점 또는 방재관측지점) 기상요소별로 임의 기간 동안의 통계를 보여주는 것을 말합니다.기온, 강수량요소를 선택하여 조회하면 평균기온, 최고기온평균, 최저기온평균, 강수량 정보를 제공하고, 바람요소를 선택하면 평균풍속과 최대 풍속을, 상대습도 요소를 선택하면 평균상대습도와과 최소상대습도를, 기압은 현지기압과 해면기압을 평균, 최저, 최고로 제공합니다. 마지막으로 일사, 일조를 선택하면 합계일조시간과 합계전천일사량을 제공합니다.
