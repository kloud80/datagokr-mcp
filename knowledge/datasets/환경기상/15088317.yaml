summary_user: 한전KPS(주)가 보유·임차한 건물과 차량 등 감축 대상시설별로 연도별 기준 배출량, 해당연도 배출목표량과 실제 배출량(tCO2eq), 감축률, 이행 제외 여부와 사유를 담은 파일(csv, 약 3.9KB)이다. 공공기관 온실가스 관리 현황을 보는 분석가나 국민이 '한전KPS는 해마다 시설별로 감축 목표를 얼마나 달성했고 어떤 시설이 이행에서 빠졌는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 기관의 같은 형식 감축 이행결과와는 연도·시설명 같은 이름 매핑으로만 나란히 비교한다.
description_portal: 한전KPS(주)의 연도별 온실가스 감축 목표 이행 결과에 관한 정보를 제공합니다. 기관은 환경부 ‘공공부문 온실가스 목표관리 운영 등에 관한 지침’의 기준을 적용받아 매년 온실가스 감축 목표를 설정하고 그 이행 결과를 점검하고 있습니다. 배출량을 산정하기 위해 보유하거나 임차 중인 건물 및 차량에서 사용된 에너지 사용량을 집계하고 배출계수 등을 적용하여 수치를 확정합니다. 해당 데이터는 연도별 온실가스 감축 목표, 감축 목표 대상시설, 시설 분류, 기준 배출량, 해당연도 배출량, 감축률 등을 포함합니다.
