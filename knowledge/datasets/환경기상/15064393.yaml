description_portal: '수도권매립지관리공사는 폐기물관리법 등의 관계법과 수도권매립지 폐기물 반입 등에 관한 사무처리 규정에 따라 폐기물을 반입하고 있습니다.수도권매립지관리공사는 매립 후 5시간 이내 복토 작업을 통해 폐기물의 흩날림, 해충서식, 냄새발생, 빗물침투 등을 방지합니다.폐기물 분해과정에서 발생하는 매립가스를 포집하여 전력생산 및 악취방지의 효과를 달성하고 있으며,매립시설 바닥에 차수시설을 설치하여 지하수 오염을 차단하고, 침출수를 모아 처리하고 있습니다.수도권매립지에 반입되는 음식물 탈리액 반입정보입니다.개방항목 : 마감년월, 지역명, 폐기물명, 반입량(kg)의 항목을 제공합니다.'
