description_portal: 환경책임보험의 책임보험 사업장 이력은 사업장의 변동 사항과 보험 가입 관련 내역을 체계적으로 기록하여 관리하기 위한 정보입니다.각 이력은 고유한 사업장이력번호로 관리되며, 사업장이 위치한 지역은 행정구역코드와 함께 지번주소, 도로명주소로 명확히 식별됩니다. 또한 해당 사업장이 어떤 형태로 보험에 가입했는지를 나타내는 보험가입코드, 기업규모코드, 매체시설규모코드 등의 속성이 함께 관리됩니다.사업장의 상태 변화는 이력발생일시, 상태코드, 상태일자로 기록되며, 이력의 성격은 이력등록구분과 이력상태정보를 통해 구체적으로 구분됩니다. 필요 시 삭제여부로 유효성을 판단할 수 있습니다.보험과 관련해서는 책임보험적용일자, 책임임의구분코드, 보험계약상태코드, 의무가입대상여부 등이 기록되어 사업장의 책임보험 가입 여부 및 상태를 명확히 관리합니다. 또한 사업장 운영과 관련된 특수 상황으로 휴업시작일자·종료일자, 폐업일자, 미가동시작일자·종료일자, 사업장설치여부, 위해성방지조치여부 등이 포함되어 운영 상태 전반을 추적할 수 있습니다.추가로, 정보 관리의 신뢰성과 정확성을 위해 정보승인상태코드, 사실확인여부, 미가입사업장제외여부, 미가입사업장제외종료일자 등이 포함됩니다. 이를 통해 사업장이 실제 보험 의무 대상인지, 혹은 일시적으로 제외 대상인지 명확히 관리할 수 있습니다.
