description_portal: '세종특별자치시시설관리공단은 시민 여러분의 생활편의를 위해 종량제봉투 지정판매소 정보를 공공데이터로 제공합니다.이 데이터는 다음과 같은 정보를 포함하고 있어, 종량제봉투를 구매하려는 시민들께 유용합니다.제공 내용1. 행정동– 판매소가 위치한 지역의 행정동 이름 (예: 보람동, 도담동 등)2. 판매소명– 종량제봉투를 판매하는 편의점, 마트 등 사업장의 이름3. 사업장 도로명 주소– 해당 판매소의 위치를 나타내는 도로명 기반 주소4. 사업장 전화번호– 판매소에 직접 문의할 수 있는 연락처활용 예시우리 동네(행정동)에서 가까운 판매소를 찾고 싶을 때도로명 주소를 기반으로 내 주변 판매소를 지도 앱에 검색할 때전화로 판매 여부나 운영시간을 미리 확인하고 싶을 때시민 여러분이 편리하게 종량제봉투를 구매하고, 효율적인 생활폐기물 처리를 하실 수 있도록 제공하는 유용한 데이터입니다.누구나 자유롭게 이용할 수 있습니다.'
