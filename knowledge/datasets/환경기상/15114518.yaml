summary_user: 세종특별자치시 종량제봉투 지정판매소를 판매소 단위로 담은 건별 목록이며, 판매소명·행정동·법정동·전화번호·지번주소·도로명주소를 CSV 파일(약 72KB)로 제공한다. 세종시 주민이 '우리 동네에서 종량제봉투를 파는 편의점이나 마트가 어디인가'를 찾거나, 분석가가 행정동별 판매소 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 행정동·법정동 이름이나 주소 문자열로 다른 세종시 생활폐기물 배출·수거 지점 데이터와 맞추고, 지도에 올리려면 주소를 좌표로 바꿔서 쓴다.
