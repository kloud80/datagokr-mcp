description_portal: 이 데이터는 오락기(아케이드 게임기) 이미지 200장과 해당 이미지에 대한 라벨링 파일 200개로 구성되어 있습니다. 이미지들은 다양한 모델의 오락기를 실내 환경에서 촬영한 것으로, 정면, 측면, 근접 촬영 등의 다양한 각도에서 기록되었습니다. 이미지 파일은 ‘images’ 폴더에 저장되어 있으며, 각 파일은 오락기의 외형, 조작 버튼, 화면부 등 주요 특징을 명확히 식별할 수 있는 해상도를 갖습니다. 라벨링 정보는 'labels' 폴더 내 텍스트 파일로 제공되며, YOLO 형식으로 오락기의 위치 정보를 좌표와 클래스명으로 기록하고 있습니다.
