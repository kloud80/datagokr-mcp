description_portal: AMOS(Aeronautical Meteorological Observation System)는 항공기상 관측을 자동으로 수집·처리·제공하는 시스템으로, 공항 및 주요 지점에 설치된 관측 장비를 통해 기온, 기압, 풍향·풍속, 시정, 운량, 강수 등 다양한 기상 요소를 실시간으로 관측합니다. 수집된 자료는 항공기상청 통합 데이터베이스에 저장되어 METAR, SPECI, TAF와 같은 항공기상 전문 생산 및 품질 관리에 활용됩니다. 또한 관제기관과 항공사, 국제기구 등에 신속히 제공되어 항공기 운항 안전과 효율적 공역 관리에 기여하며, 기후통계 산출과 연구자료로도 폭넓게 활용되는 중요한 기반 시스템입니다.
