summary_user: 광주 북구에서 음식물 스티커(음식물류 납부필증)를 파는 업소의 사업장명과 주소를 업소 한 곳당 한 행으로 담은 CSV 파일(약 50KB)이며, 시군구 범위의 개별 위치 데이터다. 단독주택이나 소형음식점에서 음식물쓰레기를 내놓으려는 주민이 '우리 동네 어디서 음식물 스티커를 사나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 매칭하거나 같은 기관의 종량제 봉투 판매소·수거 지점 파일과 지역 단위로 나란히 놓고 쓴다.
description_portal: 광주광역시 북구에 소재한 음식물 스티커(음식물류 납부필증) 판매업소의 위치 현황 데이터입니다.단독주택·소형음식점 음식물류 폐기물 배출 시 배출용기에 부착해야하는 음식물 스티커를 판매하고 있는 업소의 사업장명과 주소 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 음식물 스티커 판매업소의 주소는 도로명주소를 기준으로 표기하였습니다. 단, 판매업소의 사업장 위치가 도로명주소가 부여되지 않은 장소이거나 사업장 위치의 정확한 도로명주소를 확인하지 못한 경우에는 부득이하게 지번 주소로 표기하였습니다.
