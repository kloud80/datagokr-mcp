summary_user: 경기도 양주시 미세먼지 포털의 측정소 관측값을 읍면동 단위 행정구역에 연결한 매칭 현황 파일로, 측정일시·측정소값·지역코드·읍면동명을 담으며 파일 크기는 약 1.4KB로 작다. 양주시 주민이나 분석가가 '우리 동네 읍면동에는 어느 측정소 값이 적용되고 그 값은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 읍면동명이나 지역코드를 행정구역 코드표와 이름·코드로 맞춰 다른 대기질·인구 자료와 잇는다.
limits: 범위가 양주시 한 곳의 읍면동 단위라 다른 시군구와 직접 비교할 수 없다. 실측 컬럼에 전역 조인 키가 없어 에어코리아 측정소 자료 등과는 이름·코드 매핑을 거쳐야 연결된다.
