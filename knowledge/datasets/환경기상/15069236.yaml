summary_user: 노후 경유차 배출가스 저감장치 부착 지원 사업과 관련해, 저감장치를 만드는 제작사 목록을 업체별 한 행으로 담은 파일입니다(업체명·주소·연락처, CSV 약 3KB, 전국 범위). 차량 소유자나 정비업체가 저감장치 부착을 알아볼 때 어떤 제작사가 있고 어디로 연락하면 되는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 직접 맞춰 이어 써야 한다.
description_portal: 본 자료는 대기환경보전법 제58조(저공해자동차의 운행 등) 및 제60조의2(배출가스 저감장치 등의 관리), 동법 시행규칙 제79조의2(배출가스 저감장치의 부착 등의 저공해 조치), 제79조의4(배출가스 저감장치 등의 관리) 등을 근거로 하여 시행하는 배출가스 저감장치 부착 지원 사업과 관련된 정보입니다.해당 자료는 노후 경유차에서 발생하는 대기오염물질을 줄이기 위한 저감장치를 제작하는 저감장치 제작사 현황에 관한 자료로, 저감장치 제작사의 연락처, 제작사의 주소 등의 정보가 포함되어 있습니다.
