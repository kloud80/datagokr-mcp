description_portal: 이 자료는 서울두드림길 중 ‘문화길’ 구간에 해당하는 **점형 위치정보(위경도 좌표, WGS84 좌표계)**를 담고 있는 공간 데이터입니다.  각 지점은 산책코스 내 주요 쉼터, 안내표지판, 경유지 등으로 구성될 수 있으며, 지리좌표(위도·경도)로 위치가 파악되도록 설계되어 있습니다. 제공형식은 CSV 및 쉐이프파일 형태이며, 쉐이프파일의 인코딩은 UTF-8로 설정되어 있습니다.  이를 통해 도보 관광 경로 분석, 둘레길 인프라 접근성 평가, 모바일 경로서비스 연계, GIS 기반 지도 시각화 등 다양한 활용이 가능합니다. 또한 전체 866개 행으로 구성돼 있으며, 비정기 갱신 방식으로 최신화됩니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
