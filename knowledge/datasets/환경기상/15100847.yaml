summary_user: 충청남도 서산시 관내에서 유류를 연료로 쓰는 대기오염물질 배출 사업장을 사업장 한 곳당 한 행으로 정리한 파일로, 사업자명·도로명소재지·주생산품·유류종류·연료사용량(총합)·기준일자를 담으며 파일 크기는 724바이트로 사업장 수가 적다. 환경 담당자나 분석가가 '서산시에서 어떤 유류를 얼마나 쓰는 제조업소가 어디에 있는가'를 확인하거나 지도점검 대상을 추릴 때 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 배출시설·인허가 데이터와는 사업자명이나 도로명주소를 맞춰 연결해야 한다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 관내 유류를 사용하는 대기오염물질 배출 사업장의 현황을 정리한 자료이다. 항목은 사업자명, 도로명소재지, 전화번호, 주생산품명, 연료사용량, 유류종류, 데이터 기준일자로 구성되며, 대기오염 관리 및 배출시설 현황 파악에 활용된다. 본 데이터는 특정 유류를 사용하는 제조업소를 중심으로 연료 사용량과 생산 품목 등 관련 정보를 포함하며, 유해물질 배출량 예측, 환경개선 대책 수립, 지도점검 계획 마련에 기초자료로 제공된다. 또한 에너지 사용 효율화, 저감기술 적용 검토, 행정 보고 및 민원 대응에도 도움이 된다. 본 데이터는 정기적으로 갱신되며, 환경행정과 정책 수립에 필요한 공공정보로 활용된다.
