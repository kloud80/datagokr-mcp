summary_user: 충청남도 보령시 관내 특정토양오염관리대상시설(주유소·유류저장시설 등)을 시설 한 곳당 한 행으로 담은 파일로, 상호명·도로명/지번주소·위도·경도·설치년도·오염도검사 대상 여부를 포함하며 포털 설명 기준 92건이다. 주민이나 환경단체가 '우리 동네 근처에 토양오염 우려시설이 어디에 있고 오염도검사 대상인가'를 확인하거나, 분석가가 노후 시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 주소나 위경도 좌표를 기준으로 다른 토양측정망·지하수 자료나 같은 기관의 시설 자료와 공간·이름 매칭으로 이어 쓴다.
description_portal: 산업화 과정에서 발생한 토양오염 문제와 환경보호에 대한 사회적 관심 증대로 체계적인 토양오염 관리 정책 필요성이 높아지고 있으며, 토양환경보전법에 따른 특정토양오염관리대상시설에 대한 철저한 관리와 감독이 중요해지고 있습니다. 유류저장시설, 주유소, 세탁소 등 토양오염 우려시설의 증가로 인한 토양 및 지하수 오염 방지를 위한 예방적 관리체계 구축이 필요하며, 토양오염도 정기검사와 오염 발생 시 신속한 대응을 위한 시설 현황 파악이 중요합니다. 지역 주민들의 환경 안전에 대한 알권리 보장과 토양오염 위험요소에 대한 투명한 정보 제공 요구가 증가하고 있으며, 환경 영향 평가와 토양보전 정책 수립을 위한 과학적 근거 자료 확보가 필요하게 되었습니다. 이에 따라 충청남도 보령시는 관내에 위치한 특정토양오염관리대상시설의 위치, 설치연도, 오염도검사 대상 여부 등 토양환경 보전과 오염 예방 관리에 필요한 종합적인 시설 현황 정보를 제공하고 있습니다.개방 데이터는 특정토양오염관리대상시설현황의 상호명, 소재지 도로명주소, 지번주소, 위도, 경도, 설치년도, 오염도검사대상 여부 등 총 9개 항목 92건의 상세 정보를 포함하고 있습니다.환경단체·시민은 토양오염 우려시설 현황 파악을 통해 환경 모니터링 및 오염 예방 활동에 활용하고, 환경관리기관·연구기관은 토양오염 관리 정책 수립 및 토양환경 연구에 활용하며, 지방자치단체·환경보전기관은 토양보전 정책 수립 및 특정시설 관리·감독, 환경안전 대책 마련에 활용할 수 있습니다.
