description_portal: '전라남도 여수시 사업장폐기물 배출자 신고현황 안내(데이터 기준일자: 2026년 2월 11일)전라남도 여수시에서는 관내 사업장에서 발생하는 폐기물의 체계적인 관리를 위해 사업장폐기물 배출자 신고 현황을 관리하고 있습니다. 본 자료는 여수시 관내  「폐기물관리법 시행규칙」 제18조제1항제1호 및 제3호에 해당하는 사업장의 폐기물 배출자 신고 정보를 정리한 것으로, 다음과 같은 항목들을 포함하고 있습니다:사업장명: 사업장의 명칭소재지도로명주소: 사업장이 위치한 도로명 주소소재지지번 주소: 지번 기반의 사업장 주소폐기물종류: 사업장에서 배출하는 폐기물 종류배출량: 사업장에서 배출하는 폐기물 배출량본 자료는 관내 사업장의 폐기물 배출 관련 정보를 한눈에 파악할 수 있도록 구성되어 있어, 행정업무, 환경관리 기초자료, 지역 기반 데이터 분석, 대시민 정보 제공 등의 다양한 목적으로 활용될 수 있습니다.'
