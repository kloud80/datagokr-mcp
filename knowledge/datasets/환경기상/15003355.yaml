description_portal: 해양환경공단이 수행한 선박폐유 수거 및 처리 실적 정보를 제공합니다. 본 데이터는 어선, 소형선박 등에서 배출된 선박폐유를 수거하여 적정하게 처리한 연도별 실적을 정리한 자료로, 수거량, 수거지역, 참여 선박 수, 처리 방식, 처리 결과 등의 항목이 포함되어 있습니다. 수거 방식은 수거선 운영, 민간위탁, 지정 장소 반입 방식 등으로 구분되며, 수거 후 처리 과정도 함께 제공됩니다. 본 자료는 선박 오염물질 저감, 항만 수질관리, 해양 유류오염 예방, 정책 수립, 예산 기획 등 다양한 분야에 활용됩니다. 데이터는 표 및 보고서 형태로 구성되며, 공공기관, 지자체, 연구기관 등에서 해양환경 보전 및 해양오염방지를 위한 정책 기초자료로 활용됩니다.
