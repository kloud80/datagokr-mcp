summary_user: 대전광역시 서구 관내 버스정류장마다 설치된 쓰레기통의 종류와 개수를 정류장 지번주소 단위로 한 줄씩 담은 파일(csv, 약 7KB)이다. 구민이나 구청 담당자가 '우리 동네 어느 정류장에 쓰레기통이 몇 개 있고 어디가 비어 있나'를 확인하거나 정비·추가 설치 구역을 고르는 데 쓴다. 공통 조인 키가 없어 버스정류장 위치 데이터 등과 이을 때는 지번주소를 주소 매칭(지오코딩)해 연결해야 한다.
description_portal: 본 자료는 대전광역시 서구 관내 버스정류장별로 설치된 쓰레기통 현황에 대한 정보를 수록한 공공데이터입니다.자료는 서구 지역 내에 위치한 각 버스정류장을 기준으로 정리되어 있으며, 해당 정류장에 설치된 일반쓰레기통의 수량과 **정확한 설치 위치(지번주소 기준)**를 포함하고 있습니다.위치 정보는 지번주소 체계를 기반으로 표기되어 있어 현장 식별이 가능하며, 각 정류장마다 설치된 일반쓰레기통의 개수가 함께 제공되어, 버스 이용객이 많이 이용하는 장소를 중심으로 생활폐기물 수거 기반시설의 설치 현황을 파악할 수 있도록 구성되어 있습니다.본 데이터는 대전광역시 서구가 관할하는 버스정류장의 환경관리 및 공공편의시설 운영 실태를 파악하기 위해 정리된 자료로, 쓰레기통의 배치 현황을 기반으로 정비·보완이 필요한 구역을 식별하거나, 공공시설 관리계획 수립에 필요한 기초자료로 활용될 수 있습니다.
