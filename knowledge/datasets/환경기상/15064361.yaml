description_portal: 이 데이터는 서귀포시 관내 양묘장의 운영상태를 정리한 자료입니다. 양묘장은 묘목을 키우는 곳으로, 조경, 공원녹지 및 도시숲 조성 등에 필요한 묘목을 생산·관리합니다. 항목으로는 양묘장 이름, 위치(주소), 관리 주체, 묘목종류, 생산 규모 등이 포함될 수 있습니다. 이러한 정보는 도시 녹지 정책, 조경·토양 회복 사업, 기후 변화 대응 나무 식재 사업 계획 시 중요한 기초 자료로 활용됩니다. 또한 GIS 기반 묘목 배치 계획, 묘목 생산 예측, 녹지 취약지역 보완, 주민 녹화 참여 프로그램 설계, 유지보수 관리 등을 지원할 수 있습니다.
