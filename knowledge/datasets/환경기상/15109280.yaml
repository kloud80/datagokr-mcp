summary_user: 천안시에서 구조된 야생동물을 접수 건별로 담은 원천 파일로, 종명과 분류(강·목·과), 천연기념물·멸종위기 등급, 발견·구조 일시, 발생원인, 구조 결과(방생·폐사 등), 구조·방생 위치 좌표를 함께 기록한다. 천안시에서 교통사고로 구조되는 종이 무엇이고 어느 지점에 몰리는지를 보고 생태통로나 저감시설 위치를 검토하려는 분석가·행정 담당자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 종명 매핑이나 구조 위·경도 좌표를 이용한 공간 결합으로 이어 쓴다.
