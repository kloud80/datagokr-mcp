summary_user: 경상남도 밀양시 관내 폐농약용기 수거함의 설치 지점을 한 곳씩 담은 목록으로, 배출품목·수거장소 명칭·소재지·관리주체·기준일자를 담는다(시군구 범위, 주소 단위 개별 지점). 농민이나 마을 관리자가 '우리 읍·면에서 다 쓴 농약병을 어디에 버리나'를 확인하거나, 분석가가 농촌 지역의 수거 거점 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 수거장소 이름을 맞추는 방식, 또는 같은 밀양시 자료끼리 이어 쓴다.
description_portal: 본 데이터는 경상남도 밀양시 관내에서 운영 중인 폐농약용기 수거함 설치 현황 자료로서,배출품목, 수거장소 명칭, 소재지, 관리주체, 데이터기준일자 항목으로 구성되어 있습니다.해당 자료는 삼랑진읍 및 부북면 등 농촌지역을 중심으로 운영 중인 폐농약용기 수거 장소의 위치와 관리주체 정보를 제공하여, 농약 사용 이후 발생하는 폐용기의 안전 수거 및 적정 처리,불법 투기 방지, 농촌 환경보전, 자원순환 정책 수립 등에 활용할 수 있는 기초자료로서의 가치를 갖습니다.
