summary_user: 경기 바다 해수의 방사능 검사 결과를 시료 채취일·결과 보고일별로 담는 데이터로, 화성·안산·시흥·도서 지역 지점의 요오드와 세슘 검사 결과·오차 범위가 지점별 열로 나뉘어 있다. 지역 주민이나 수산물 소비자가 경기 연안 해수에서 요오드 131·세슘 134·세슘 137이 검출됐는지, 최근 검사에서 수치가 어땠는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양 수질·방사능 데이터와는 채취일이나 지역 이름을 맞춰 연결해야 한다.
description_portal: '● 경기바다 해수 방사능 조사 결과에 대한 자료로 각 핵종은 반감기가 달라 장·단기적인 환경 영향 평가에 모두 활용되며, 데이터는 조사 시점과 위치별로 방사능 농도를 정량적으로 보여줍니다. 이 정보를 통해 지역 주민과 전문가들은 해양 수질 안전성을 확인하고, 식품 안전 및 해양 생태계 보전에 필요한 대응을 검토할 수 있습니다.● 최신 조사 결과는 해양수산자원연구소 홈페이지에서 확인할 수 있습니다.(주 1회 검사 결과 게시)● url : https://fish.gg.go.kr/data/4226● 반감기 - 요오드 131 : 반감기 8일 - 세슘 134 : 반감기 2년 - 세슘 137 : 반감기 30년'
