description_portal: '서울특별시 용산구 전기차 대수에 대한 데이터로 시도명, 자치구명, 연도별(2018,2019,2020, 2021, 2022,2023), 전기차 대수에 대한 데이터를 제공합니다. "전기자동차"란 환경친화적 자동차의 개발 및 보급 촉진에 관한 법률 ( 약칭: 친환경자동차법 ) 제2조제2호의 "친환경적 자동차" 중에서 3호(전기 공급원으로부터 충전받은 전기에너지를 동력원(動力源)으로 사용하는 자동차)를 말합니다. 차량 대수는 차세대자동차관리시스템을 통해서 조회합니다. 이외에도, 지자체별 전기차 등록 대수 정보는 한국전력공사 전기차충전서비스시스템에서 확인할 수 있습니다. 지역별 전기차 등록 현황 데이터를 제공하며, 연도별/지역별 등록 대수 정보를 확인할 수 있습니다. 한편, 서울 열린데이터광장에서는 서울시 자치구별 전기차 등록 현황(용도별) 데이터를 확인할 수 있습니다. 이 데이터는 국토교통부 산하 한국교통안전공단 자동차관리정보시스템에서 제공하며, 상업적 이용 및 변경이 가능합니다. 상기 자료들은 모두 공개 데이터입니다.'
