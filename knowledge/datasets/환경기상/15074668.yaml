summary_user: 서울특별시 용산구에 등록된 전기차 대수를 연도별로 담은 집계 파일로, 포털 설명상 2018~2023년 값이 시도명·자치구명·연도·전기차 대수 네 항목으로 들어 있다(파일 크기 233바이트, 시군구 단위). 용산구 전기차가 해마다 얼마나 늘었는지, 충전 인프라나 친환경차 보급 정책의 배경 수치를 확인하려는 주민·분석가가 쓴다. 전역 조인 키나 행정코드는 없어서, 다른 자치구 전기차 현황이나 충전소 데이터와는 시도명·자치구명과 연도를 이름으로 맞춰 이어 붙여야 한다.
