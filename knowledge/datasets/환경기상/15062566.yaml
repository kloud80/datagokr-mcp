summary_user: 서울 구로구 내 사업장폐기물 배출 사업장별로 사업장명·소재지와 폐합성수지류·음식물류폐기물·폐목재·오니류·혼합건설폐기물 등 30여 개 폐기물 종류 항목을 한 행에 담은 작은 CSV 파일(약 5KB)이다. 구로구에서 특정 종류의 폐기물을 배출하는 사업장이 어디에 있는지, 수거·재활용 영업 대상을 찾거나 지역 배출원을 파악하려는 사업자·분석가가 쓴다. 전역 조인 키나 사업자번호 필드가 없어 사업장명·소재지 주소를 매칭하거나 같은 구로구 자료와 이어 써야 한다.
