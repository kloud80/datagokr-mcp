description_portal: '경상남도 진주시 토양오염시정초지명령현황[업체명, 주소, 오염물질, 오염물량, 오염면적, 최고농도, 조치(시정)명령 기간(정밀조사 및 정화명령) 등]에 관한 데이터를 제공합니다.본 자료는 토양환경보전법에 따른 토양오염 시정명령 중, 현재 이행이 진행중인 건에 대한 정보를 수록한 데이터 입니다.즉, 명령이 내려져 조치가 시작되었으나, 이행 완료되지 않은 사례에 대해, 각 업체별 오염 현황과 명령 관련 주요 정보를 포함하고 있습니다.○데이터 설명  - 업체명: 시정명령 대상 업체명   - 주소 : 해당 업체 소재지  - 오염물량 : 토양 내 오염물질 총량 (㎥)  - 오염면적 : 오염된 토양 면적(㎡)  - 시정명령기간 : 시정명령이 유효한 기간 (~ 종료일)○유의사항  -본 데이터는 현재 이행중인 시정명령 건에 한정되어 있으며, 이행 완료 건은 포함되어  있지 않습니다.'
