summary_user: 전주시 관내 대기배출시설과 폐수배출시설을 사업장 한 곳당 한 행으로 담은 인허가 사업장 목록으로, 업무구분·인허가관리번호·사업장명·지번/도로명주소·대표업종·인허가등록일자 등을 담는다. 시민이나 분석가가 '우리 동네 주변에 어떤 대기·폐수 배출 사업장이 있고 언제 인허가를 받았나'를 확인하거나, 배출시설 분포를 지도에 올려 지도·점검 대상 지역을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업장명·주소 문자열 매칭이나 인허가관리번호를 같은 기관 자료와 맞춰 보는 방식으로만 잇는다.
description_portal: 전북특별자치도 전주시 대기배출시설 및 폐수배출시설 현황 데이터는 「대기환경보전법」 및 「물환경보전법」에 따라 관리되는 배출시설의 기본 정보를 시민에게 투명하게 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 사업장명, 도로명주소, 지번주소, 전화번호 등의 정보를 포함하여 관내 대기배출시설 및 폐수배출시설의 등록 현황과 기본 정보를 체계적으로 확인할 수 있도록 구성되었습니다.특히 사업장명과 주소 정보를 통해 지역 내 배출시설 분포 현황을 파악할 수 있으며, 환경관리 정책 수립, 지도·점검 계획 수립, 환경행정 통계 분석 및 연구 자료 등으로 활용할 수 있도록 설계되었습니다. 또한 시민과 연구자가 지역 환경관리 현황을 이해하고 공공환경정보 기반의 분석 자료로 활용하는 데 기초자료로 활용될 수 있습니다.전주시는 본 데이터를 통해 환경관리 행정의 투명성과 공공성을 강화하고 시민의 알권리 보장을 확대하는 것을 목표로 하며, 신규 등록, 변경 및 폐쇄 등 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 환경위생과에서 제공·관리합니다.
