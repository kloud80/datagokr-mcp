summary_user: 환경영향평가 대상 개발사업의 협의 현황을 사업 단위로 담는 API로, 사업 목록(사업명·협의기관·현재단계·단계변경일)과 사업별 진행 이력(접수일·검토의뢰일·통보일·반려일·취하일 등)을 전국 범위에서 조회한다. 개발사업 동향을 보는 분석가나 사업자가 '특정 지역 개발사업이 지금 환경영향평가 협의의 어느 단계에 있고 언제 통보됐는가'를 확인해 개발 선행 지표로 쓴다. 전역 조인 키는 없어 사업명·협의기관 이름으로 토지이용규제·개발사업 데이터와 맞춰야 하며, 상세 조회에는 목록에서 받은 환경영향평가 코드(eiaCd)를 넘겨야 한다.
description_portal: 환경영향평가 사업정보 협의현황 상세 진행현황 정보(취하일, 결과코드, 단계명, 접수일, 검토의뢰일, 검토결과접수일, 통보일, 반려일)를 조회하는 기능, 협의현황 상세 정보(환경영향평가 고유번호, 사업명, 사업구분, 협의기관, 담당자, 연락처)를 조회하는 기능, 협의현황 사업 목록 정보(단계변경일, 사업명, 협의기관, 환경영향평가 코드, 환경영향평가 고유번호, 현재단계 등)를 조회하는 기능, 협의현황 상세  변경협의진행 정보(접수일, 취하일, 단계명, 검토의뢰일, 검토결과접수일, 통보일, 반려일)를 조회하는 기능을  제공하는 서비스입니다.
