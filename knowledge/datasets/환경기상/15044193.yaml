summary_user: 해양환경공단 해양수질자동측정망 중 낙동강 하구 을숙도 정점에서 자동 측정한 수온·염분·용존산소·수소이온농도·탁도·전기전도도·클로로필 값을 관측일자별 시계열로 담은 CSV 파일(약 1.3MB)이다. 연구자나 지자체 담당자가 하천수가 유입되는 기수역에서 염분과 용존산소가 시기별로 어떻게 달라지는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 정점명·정점코드를 기준으로 같은 기관의 다른 해양수질자동측정망 정점 파일과 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 낙동강 을숙도 해역의 수질 측정 정보를 제공합니다. 본 데이터는 실시간 자동측정 시스템을 활용하여 수온, 염분, 용존산소(DO), 수소이온농도(pH), 탁도, 전기전도도 등 주요 수질 항목을 연속적으로 측정한 결과를 포함합니다. 낙동강 하구 인근의 을숙도 해역은 하천수 유입, 조류, 조석 간만의 차 등 다양한 물리적·환경적 요인의 영향을 받는 기수역으로, 수질 변화 모니터링이 중요한 지역입니다. 데이터는 시계열 형식으로 구성되어 있으며, 수질환경 변화 분석, 오염원 감시, 수생태계 평가 등의 목적에 활용됩니다. 공공기관, 연구기관, 지자체 등에서 수질관리 및 정책 수립을 위한 기초자료로 사용됩니다.
