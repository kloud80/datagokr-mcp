summary_user: 경상남도 김해시의 수질 폐수배출시설을 사업장 한 곳당 한 행으로 담은 원천 목록으로, 업체명·주소·업종·규모 등급(종수)·신고일자를 포함하며 범위는 김해시 한 곳이고 위치는 개별 주소 단위다. 주민이나 사업자, 분석가가 '우리 동네 근처에 어떤 규모의 폐수배출 사업장이 있는가'나 '김해시 폐수배출시설은 업종별·종별로 어떻게 분포하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 업체명·주소를 매칭하거나 같은 기관 코드로만 이어 쓰며, 시 자체 관리번호는 다른 기관 데이터와 공통으로 쓰는 키로 확인되지 않았다.
