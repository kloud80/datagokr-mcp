summary_user: 환경정보공개시스템에 등록된 업체와 사업장을 사업장 한 곳당 한 행으로 담은 전국 단위 기본정보 파일(CSV, 약 2.7MB)로, 업체유형·업체특성·대표사업장명·사업자등록번호·주소·업종·세부업종·주요업무·대표 연락처를 포함한다. 정책 연구자나 행정 담당자가 '우리 지역에 환경정보공개 대상인 사업장이 어느 업종에 몇 곳 있고 연락처는 무엇인가'를 확인하거나 현장점검 대상을 고를 때 쓴다. 사업자등록번호(bizno)를 키로 녹색기업·환경표지 인증, 오염원·화학물질 사업장 데이터나 사업자 정보와 이어 쓰고, 주소는 지역별 집계에 쓴다.
description_portal: 본 데이터는 환경정보공개시스템에 등록된 모든 업체와 사업장의 기본 정보를 제공하는 공공데이터입니다. ‘번호’, ‘업체유형’, ‘업체특성’, ‘대표사업장명’, ‘사업장 명’, ‘업체 대표명’, ‘사업자등록번호’, ‘대표팩스번호’, ‘주소’, ‘상세주소’, ‘업종’, ‘세부업종’, ‘주요업무’ 등 13개 필드를 포함하며, 각 사업장의 법적·행정적 속성과 연락처 정보를 한눈에 확인할 수 있습니다. 이를 통해 정책 연구자와 행정 담당자는 공개 대상 기관 분류  및 현황 분석을 수행할 수 있고, 데이터베이스 구축, 대시보드 연동, 현장점검 계획 수립, 네트워킹 대상 기관 선별, 기업 신용평가 및 리스크 분석 등의 목적으로 활용할 수 있습니다.
