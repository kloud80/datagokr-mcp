summary_user: 충청북도 진천군 내 대기배출시설 설치신고 대상 업소를 업소 1곳당 한 행으로 정리한 현황 파일로, 업소명·도로명주소·업종(업종코드)·연락처·대기오염물질 배출 종별을 담는다. 주민이나 분석가가 "우리 동네 근처에 어떤 업종의 대기배출 사업장이 있고 규모 종별은 어떤가"를 확인하거나, 지자체가 점검 대상 업소 목록을 정리할 때 쓴다. 전역 조인 키(사업자번호 등)는 없어서 다른 데이터와는 업소명·도로명주소를 맞추거나 업종코드 매핑으로만 연결한다.
limits: 실측 컬럼에 사업자번호 같은 공통 키가 없어 기업 정보나 TMS 측정값과 바로 결합하지 못하고, 이름·주소 매칭에 기대야 한다. 범위는 진천군 한 곳이며 좌표가 없는 비공간 자료라 지도화하려면 주소를 따로 지오코딩해야 한다.
