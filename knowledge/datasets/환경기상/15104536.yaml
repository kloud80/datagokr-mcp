summary_user: 대전광역시 서구 관내 휘발성유기화합물(VOC) 배출시설을 업소 한 곳당 한 행으로 담은 파일로, 업소명·지번/도로명 주소·행정동·법정동·업종·오염물질을 기록한다. 주민이나 환경 분석가가 '우리 동네 어느 업소가 어떤 업종으로 VOC 배출시설을 운영하는가'를 확인하거나 지도·점검 대상을 추릴 때 쓴다. 법정동코드(bjd_cd)를 키로 다른 시설·인구·대기측정 데이터와 동 단위로 이어 쓰고, 주소로는 좌표 변환 후 위치 기반 결합을 한다.
description_portal: 대전광역시 서구 관내 휘발성유기화합물 배출시설 현황 데이터는 지역 내 휘발성유기화합물(VOC) 배출 가능성이 있는 시설의 정보를 제공하는 공공데이터로서 순번, 업소명, 소재지, 지번주소, 도로명주소, 행정동명 및 코드, 법정동명 및 코드, 업종, 오염물질 등의 항목을 포함한다. 이 데이터는 대전광역시 서구청 기후환경과에서 관리하며 매년 정기적으로 갱신되어, VOC 배출시설을 행정적으로 체계적으로 파악하고 관리할 수 있도록 지원한다. 또한 자료는 공공데이터포털을 통해 로그인 없이 다운로드 가능하고, 환경정책 수립, 지도·점검, 주민환경정보 제공, 대기환경 보호 등의 공적 목적으로 활용된다. 서구 지역의 대기 질 관리와 환경안전성 향상을 위한 기초자료로서 중요한 가치를 지닌다.
