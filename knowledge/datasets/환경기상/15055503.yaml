summary_user: 경기도 고양시 관내 소음·진동배출시설을 설치한 사업장을 한 행에 하나씩 담은 파일로, 사업장명과 주소만 들어 있다(csv 약 8KB, 범위는 고양시 한 곳). 주민이나 분석가가 "우리 동네 근처에 소음·진동을 내는 시설로 신고된 사업장이 어디 있나"를 확인하거나, 지도·점검 대상 사업장의 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소(지오코딩 후 좌표)를 맞춰 붙여야 하며, 같은 영역의 오염원·화학물질 사업장 자료와 함께 볼 때도 이 방식으로 이어 쓴다.
limits: 사업장 코드나 사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 매칭하기 어렵고, 이름·주소 매칭에 의존해야 한다. 컬럼이 연번·사업장명·주소뿐이라 시설 종류, 규모, 실제 소음·진동 측정값은 알 수 없으며, 범위는 고양시에 한정된다.
