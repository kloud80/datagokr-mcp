summary_user: 충청남도 홍성군 안에서 대기오염물질 배출시설을 설치한 사업장을 한 행에 한 곳씩 담은 목록으로, 업체명·도로명주소·전화번호·업종·종별(연간 발생량 기준 1~5종)·데이터기준일자로 구성된 약 12KB 규모의 CSV 파일이다. 주민이나 분석가가 "우리 동네 근처에 어떤 업종의 몇 종 대기배출 사업장이 있는가"를 확인하거나, 홍성군 내 배출시설을 업종·종별로 나눠 세는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 업체명으로 맞춰 연결해야 하며, 사업자번호 같은 기업 식별자는 들어 있지 않다.
description_portal: '1. 충청남도 홍성군에서 제공하는 대기배출시설 사업장 현황으로, 업체명, 도로명주소, 전화번호, 업종, 종별, 데이터기준일자로 구성되어 있습니다.2. 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소정보 데이터입니다.[ 참고 ]1종 사업장: 대기오염물질발생량의 합계가 연간 80톤 이상인 사업장2종 사업장: 대기오염물질발생량의 합계가 연간 20톤 이상 80톤 미만인 사업장3종 사업장: 대기오염물질발생량의 합계가 연간 10톤 이상 20톤 미만인 사업장4종 사업장: 대기오염물질발생량의 합계가 연간 2톤 이상 10톤 미만인 사업장5종 사업장: 대기오염물질발생량의 합계가 연간 2톤 미만인 사업장'
