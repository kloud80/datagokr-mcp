description_portal: 용인도시공사가 관리하는 "생활폐기물 수거 현황"은 시민의 생활 편의를 위해 관내에서 운영 중인 고림동과 이동읍 재활용센터에서 수거된 생활폐기물의 월별 수거량 정보를 제공하고 있습니다. 본 데이터는 반기 1회 정기적으로 갱신되며, 제공되는 항목은 기준연월, 총수거량, 일반폐기물, 음식물, 필름류, 불연성, 단위명, 데이터기준일자로 구성되어 있습니다. ‘생활폐기물 수거 현황’ 데이터의 개방과 공개는 용인시에서 발생하는 생활폐기물 발생량과 처리 추이를 파악할 수 있도록 하여 환경정책 수립 및 환경보호와 지속가능한 도시 운영에 기여할 수 있습니다.
