summary_user: 용인도시공사가 운영하는 고림동·이동읍 재활용센터에서 수거한 생활폐기물의 월별 수거량을 일반폐기물·음식물·필름류·불연성으로 나눠 담은 월 단위 집계 파일(csv, 약 5KB)이다. 용인시 환경 담당자나 분석가가 "두 재활용센터의 월별 수거량과 품목 구성은 어떻게 변해 왔나"를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준연월이나 같은 기관(용인시) 기준으로만 맞춰 붙일 수 있다.
limits: 수거 지점의 위치나 행정동 코드가 없는 비공간 데이터라 지도 표시나 지역별 비교에는 쓰지 않는다. 두 재활용센터의 수거량 집계일 뿐이므로 용인시 전체 생활폐기물 발생량이나 처리현황 통계로 해석하지 않는다. 코드 기반 조인 키가 없어 다른 지자체 파일과 합칠 때는 이름·연월을 직접 맞춰야 한다.
