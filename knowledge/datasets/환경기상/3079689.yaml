summary_user: 경기도 광주시에서 일반폐기물을 배출하는 업소를 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 상호·전화번호·배출 폐기물 종류·사업장 도로명주소·데이터 기준일자를 담는다(CSV 약 236KB). 시 환경 담당자나 분석가가 "광주시 어느 동네에 어떤 종류의 폐기물을 내는 업소가 몰려 있나"를 확인하거나, 배출 사업장 점검·불법 투기 단속 대상을 추리는 데 쓴다. 전역 조인 키(사업자번호·표준 코드)가 없어서, 다른 데이터와는 도로명주소를 지오코딩하거나 상호 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시에서 일반폐기물을 배출하는 업소의 현황 정보를 제공합니다. 일반폐기물을 배출하는 사업장을 관리하고 환경 규제를 시행하기 위한 정보를 담고 있습니다. 상호는 배출 업소의 명칭이며, 전화번호는 업소 연락처를 제공합니다. 폐기물 종류는 해당 업소에서 배출하는 폐기물의 유형을 나타내고, 사업장 도로명주소는 업소의 정확한 위치를 표시합니다. 데이터 기준일자는 정보의 최신성을 확인할 수 있는 기준일입니다. 본 데이터는 폐기물 관리 정책, 배출 사업장 감시, 환경 오염 예방, 불법 투기 단속, 폐기물 처리 계획 수립 등에 활용됩니다.
