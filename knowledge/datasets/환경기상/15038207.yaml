summary_user: 서울 도봉구에 설치된 폐형광등·폐건전지 수거함을 설치 장소 한 곳당 한 행으로 담은 원천 목록 파일(CSV 약 17KB)로, 장소명·주소·행정동·수거함 종류·설치수량·위경도를 담는다. 도봉구 주민이 '집 근처에서 다 쓴 형광등이나 건전지를 버릴 수거함이 어디 있나'를 찾을 때나, 분석가가 행정동별 수거함 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 행정동 이름이나 주소 문자열로 다른 도봉구 생활폐기물 배출 지점 파일과 맞추고, 위경도로 지도·공간 데이터에 겹쳐 쓴다.
