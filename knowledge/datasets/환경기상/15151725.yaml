description_portal: 국립산림과학원에서 운영하고 있는 산림 미세먼지 측정넷(AICAN)의 홍릉숲(서울특별시 동대문구)지점에 설치된 타워의 숲내부(5m)와 숲외부(20m)에서 10분단위로 기상 정보를 자동 관측하고 있음. 본 데이터는 2021년부터 2023년까지의 관측된 10분 단위의 기상 자료를 일평균으로 변환한 값임. 산림 미세먼지 측정넷의 측정장비(EDM365, 독일 GRIMM社)에 의해 자동 관측되는 기상자료의 측정 항목은 온도(℃), 습도(%), 풍향(degree), 풍속(m/s)임. 따라서 본 데이터는 도시 내 산림이 주변 기후 및 미기상 환경에 미치는 영향을 분석하고 도시열섬 완화, 생물계절 변화, 탄소흡수 등 다양한 산림생태 연구에 기초자료로 활용 가능하며, 산림과학, 도시기상, 환경공학 등 다양한 학문 분야의 융복합 연구에 사용 될수 있다.
