summary_user: 경기도 시군에 설치된 대기환경 옥외전광판을 한 대씩 정리한 현황 자료로, 시군명·설치위치·설치 구분·설치 및 교체 연도·동영상 송출 여부·표출면적·표출방식(단면·양면)·표출시간·표출 내용을 담는다. 지자체 환경 담당자나 분석가가 "우리 시군에는 대기질 전광판이 몇 대 있고, 얼마나 오래됐고, 영상 송출이 되는가"를 확인하거나 시군 간 보급 수준을 비교하는 데 쓴다. 실측 컬럼에 측정소코드 같은 전역 조인 키가 없어서, 다른 데이터와는 시군명(sigun_nm)이나 설치위치 이름을 맞춰서만 이을 수 있다.
description_portal: 이 데이터는 경기도 내 각 시군에 설치된 대기환경 옥외전광판의 설치 현황을 정리한 자료로, 시군명, 설치위치, 설치 구분, 설치 및 교체 연도, 동영상 송출 여부, 표출면적(㎡), 표출방식(단면·양면), 표출시간, 전광판에 표출되는 내용 등의 항목으로 구성되어 있습니다. 전광판은 대기질 정보, 환경정책 홍보 등의 내용을 실시간으로 시민에게 제공하는 환경 커뮤니케이션 도구로, 표출시간과 영상 송출 여부 등을 통해 운영 효율성을 파악할 수 있습니다. 이 데이터는 지역별 환경정보 전달 수단의 보급 수준, 디지털 기반 공공홍보 수단 운영 실태 분석, 시민대상 환경 인식 개선 전략 수립 등에서 활용할 수 있습니다.
