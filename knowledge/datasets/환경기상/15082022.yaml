summary_user: 광주광역시 남구 관내 폐수배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·업종·종별·주소·데이터기준일자를 기록한 개별 사업장 목록이다(CSV 약 6.6KB). 주민이나 환경 분석가가 '우리 동네 근처에 어떤 업종의 폐수배출 사업장이 있고 몇 종 규모인가'를 확인하거나 점검 대상 목록을 만드는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소나 사업장명을 맞춰 보거나 같은 남구 자료끼리 연결해야 한다.
description_portal: 광주광역시 남구 관내에 위치한 폐수배출시설별 사업장명, 업종 구분 주소 등의 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 환경관리과(☎062-607-3643)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 폐수배출시설은 사업장에서 발생하는 오염된 물을 환경에 방류하기 전에 처리하는 장치나 설비를 갖춘 시설을 말합니다. 세차장, 제조업체, 식품가공업 등에서 설치·운영되며, 관련 법령에 따라 관리·점검을 받아야 합니다. 해당 데이터를 바탕으로 환경오염원 관리, 수질 개선 대책 수립, 점검 우선순위 결정, 환경 정책 평가 등에 활용할 수 있을 것으로 보입니다.
