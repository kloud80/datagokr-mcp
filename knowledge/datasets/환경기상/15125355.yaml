summary_user: 에콥 음식물 처리기가 자동 수집한 기록을 바탕으로 시군구 단위·분기별 가구 평균 음식물쓰레기 배출량, 감량량, 감량률을 정리한 집계 파일(csv 약 6KB)이다. 연구자나 지자체 담당자가 처리기를 쓰는 가구의 지역별 음식물쓰레기 배출 수준과 감량 효과를 비교하는 데 쓴다. 전역 조인 키는 없고 시도·시군·구 이름 열만 있으므로, 다른 지역 통계와는 행정구역 이름을 코드에 맞춰 이어 쓴다.
description_portal: 에콥 음식물 처리기를 통해 자동 수집한 데이터를 기반으로, 담다 빅데이터 플랫폼에서 분기별 ·지역별 가구 평균 음식물 쓰레기 배출량과 감량 효과를 분석한 데이터입니다.각 데이터 항목은 가구 기본정보(지역코드, 수집월 등)와 처리기별 월별 배출량(배출중량, 감량량, 감량률 등)으로 구성되어 있습니다.개인정보 보호를 위해 가구 식별이 가능한 상세주소 등은 포함되어 있지 않으며,데이터 활용 시 "저작물 이용허락 동의서_포레" 확인 후 사용 부탁드립니다.데이터는 정책 수립, 연구·교육, 감량 캠페인 기획 등에 활용 가능하며, 상업적 목적의 무단 사용은 제한됩니다.
