description_portal: 경기도 구리시 관내 빗물이용시설 설치 및 운영 현황 데이터입니다.시설명, 설치위치, 시설용량, 활용용도 등 시설별 상세 정보를 제공합니다.우천 시 집수 공간을 통해 빗물을 수집하고 정화시설을 거쳐 저류조에 저장하여 조경용수, 청소용수, 친수용수 등으로 재이용하고 있습니다.본 데이터는 물 재이용 정책, 탄소중립, 기후위기 대응, ESG 기반 친환경 행정, 도시 물순환 체계 구축 및 지속가능한 도시환경 정책 추진을 위한 기초자료로 활용될 수 있습니다.구리시는 빗물 재이용을 통한 수자원 절약 및 친환경 도시 조성을 위해 시설을 운영하고 있으며, 데이터 품질관리 및 운영 현황 점검을 포함하여 연 1회 이상 정기적으로 현행화하고 있습니다.
