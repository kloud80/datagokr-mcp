summary_user: 경기도 평화누리길 12개 코스별로 대표 동식물을 골라 수목(교목·관목), 지피식물·초본류, 조류의 종 이름을 예시로 적은 목록이며, 코스와 지역(김포·고양·파주·연천 등) 단위로 정리돼 있습니다. 평화누리길을 걷거나 생태교육·자연관찰 프로그램을 준비하는 사람이 "이 코스에서 어떤 나무와 새를 볼 수 있나"를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 코스명·지역명(region_nm)을 이름으로 맞춰서만 연결합니다.
description_portal: '본 데이터는 평화누리길을 따라 조성된 주요 코스별로 서식하는 대표 동식물 종을 선별하여 기록한 목록입니다. 각 코스는 해당 지역(예: 김포시, 고양시, 파주시, 연천시)별로 구분되어 있으며, 수목(교목 및 관목), 지피식물 및 초본류, 그리고 조류 종에 대한 정보를 포함하고 있습니다. 데이터는 총 12개 코스에 대해 제공되며, 생물종 정보는 생태자원 보호 및 자연관찰 활동, 환경 교육, 생태관광 등 다양한 분야에서 활용될 수 있습니다. 수록된 항목은 코스, 지역, 수목(교/관목), 지피/초본류, 조류로 구성되어 있으며, 각 항목은 해당 코스에서 확인된 주요 생물종의 예시를 제공합니다.'
