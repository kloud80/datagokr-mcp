summary_user: 김해시 안의 토양오염 관리대상시설(특정토양오염관리대상시설)을 사업장 한 곳씩 담은 목록으로, 신고번호·사업장명·업종·지번/도로명 주소·완공일자·누출검사와 오염도검사 해당 여부·오염물질 저장용량(리터)·위도와 경도를 제공한다. 주민이나 부동산·개발 사업자가 "이 필지나 주변에 유류·유독물 저장시설 같은 토양오염 관리대상시설이 있는가"를 확인하거나, 분석가가 검사 대상 시설의 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 주소나 위도·경도 좌표로 필지·공간 레이어와 겹쳐 보거나 사업장명으로 다른 사업장 목록과 맞춰 이어 쓴다.
limits: 범위는 김해시 한 곳이고, 다른 데이터와 코드로 바로 연결되는 키가 없어 주소·좌표·사업장명 매칭에 기대야 한다. 실제 토양오염 측정값은 담지 않고 검사 해당 여부만 담는다. 포털 설명에 따르면 미집계로 비어 있는 칸이 있다.
