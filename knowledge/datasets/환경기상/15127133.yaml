summary_user: 경기도 광명시 관내 공공의류수거함의 설치 위치를 수거함 단위로 행정동·대수·주소·위도·경도와 함께 담은 파일이며, 포털 설명상 2026년 1월 기준 18대입니다. 광명시 주민이 집 근처 의류수거함이 어디 있는지, 솜이불·신발류 등 배출 불가 품목이 무엇인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정동 이름이나 주소 매칭, 같은 광명시의 다른 수거 지점 파일과 나란히 놓는 방식으로만 이어 쓴다.
limits: 파일이 hwpx 문서 형식이라 표를 바로 기계 처리하기 어렵고, 실측 필드도 표 제목 한 줄로만 잡혀 위도·경도 등 컬럼을 별도로 추출해야 한다. 광명시 한 곳만 다루므로 다른 시군구의 의류수거함은 각 지자체 파일을 따로 찾아야 하며, 수거량 같은 처리 통계는 담지 않는다.
