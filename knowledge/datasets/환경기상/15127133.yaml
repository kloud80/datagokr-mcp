description_portal: '경기도 광명시 의류수거함 위치 정보 데이터 입니다. 의류수거함의 행정동, 대수, 주소, 데이터기준일자, 위도, 경도를 확인할 수 있습니다. 2026년 1월 기준으로 광명시 관내 공공의류수거함은 18대 입니다. 의류수거함 내 배출 불가 품목 : 솜이불, 베개, 방석 등 솜,쿠션류, 침구류, 카페트, 장판, 전기매트, 고무장화, 슬리퍼, 구두, 털신발 등 재사용,재활용이 곤란한 신발류, 바퀴가방, 골프가방 등 바퀴가 달린 이동용품, 인형, 반려견물품, 오염,훼손 심한 물품 등 배출불가 품목은 공공의류수거함 안에 넣지마세요.'
