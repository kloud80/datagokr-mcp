description_portal: 수도권매립지관리공사는 선진화된 위생매립시스템과 철저한 방역ㆍ탈취 등 체계적이고 위생적인 환경관리로 지속가능한 친환경 매립장을 운영하고 있습니다.매립 및 복토, 가스 포집, 침출수 차집, 위생 관리 순서로 매립이 진행되고 있으며, 음페수와 침출수의 병합처리에 성공함으로써 해양오염 방지에 기여하고, 최적의 침출수 처리기술을 개발해 전국 매립지에 확대 보급중입니다.본 공공데이터는 2015년부터 2024년까지 최근 10년 동안의 월별 페기물 반입량을 제공합니다.공사로 반입된 생활폐기물, 사업장 폐기물, 건설폐기물의 양을 확인하실 수 있습니다.
