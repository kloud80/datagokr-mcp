summary_user: 경상남도 사천시 관할 구역에서 벙커C유를 쓰는 사업장의 업소명·소재지·전화번호·생산품·연간 사용량(톤)을 업체 한 곳당 한 행으로 담은 시군구 범위의 파일(약 415바이트 CSV)이다. 지역 환경·에너지 담당자나 분석가가 사천시 안에서 벙커C유를 많이 쓰는 업체와 업종이 어디인지, 연료 전환이나 대기 배출 관리 대상을 어디부터 볼지 따지는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서 다른 배출시설·사업장 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 공공데이터는 경상남도 사천시관할 구역 내에서 벙커C유(Bunker C Oil)를 주된 에너지원으로 사용하고 있는 산업체 및 사업장의 현황을 종합적으로 제공합니다. 벙커C유는 높은 발열량을 가지지만 환경 규제가 엄격한 연료인 만큼, 이 데이터는 지역 에너지 소비 관리환경 영향 평가의 핵심 자료로 활용됩니다.데이터의 주요 항목으로는 해당 사업장을 식별할 수 있는 업소명과 정확한 위치를 알려주는 소재지(주소)정보가 포함되어 있습니다. 민원이나 행정적 협의를 위한 전화번호가 함께 제공되어 관련 기관 및 시민과의 소통 창구를 마련합니다.특히, 해당 업체가 생산하는 생산품(주요 품목)정보를 통해 사천시 내 벙커C유 소비가 집중되는 산업 분야를 파악할 수 있으며, 가장 중요한 연간 사용량데이터는 각 업체의 에너지 소비 규모를 정량적으로 보여줍니다. 이 수치는 지역의 총 대기오염 물질 배출량산정의 기초 자료가 되며, 친환경 연료 전환 정책 수립, 에너지 효율 개선 사업 추진, 그리고 미세먼지 저감 대책 마련등 사천시의 지속 가능한 도시 발전을 위한 중요한 근거 자료로 활용됩니다.
