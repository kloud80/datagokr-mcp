summary_user: 경상북도 봉화군에서 대기가스 배출을 신고한 중질유(벙커C유) 사용 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호·소재지주소·전화번호·생산품·연간사용량(톤/년)을 기록한다. 주민이나 환경 분석가가 봉화군 안에서 벙커C유를 쓰는 사업장이 어디에 있고 한 해에 얼마나 쓰는지 확인할 때 쓴다. 실측 컬럼에는 사업자번호 같은 전역 조인 키가 없어서, 다른 배출시설·사업장 데이터와는 상호나 주소를 직접 대조하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경상북도 봉화군의 중질유 사용 사업장 현황을 보여줍니다. 총 7개의 항목으로 구성되어 있습니다.데이터 제공 신청(87619)에 따라 등록된 데이터입니다. 주요 항목은 다음과 같습니다.‘유종’은 사업장에서 사용하는 연료 종류이며, 이 데이터에서는 벙커C유(중질유)가 사용됩니다.‘소재지주소’, ‘전화번호’는 각 사업장의 위치와 연락처를 나타냅니다.‘생산품’은 해당 사업장에서 연료를 사용해 생산하는 주요 품목입니다.‘연간사용량(톤_년)’은 중질유의 연간 사용량을 톤 단위로 표시한 수치입니다.‘데이터기준일자’는 이 정보가 수집된 기준 날짜를 의미합니다.이 자료의 데이터 기준일은 2026년 6월 12일입니다.
