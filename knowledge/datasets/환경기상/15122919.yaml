summary_user: 경기도가 생산·보급한 선인장(비모란, 산취, 게발선인장 등)과 다육식물(꽃기린, 에케베리아, 칼랑코에 등) 종묘를 연도·작목·품종별 보급 수량으로 정리한 집계 자료로, 범위는 경기도 한 시도이며 위치 정보는 없다. 화훼 농가나 지역 농업 분석가가 "최근 몇 년간 경기도에서 어떤 다육식물 품종이 얼마나 보급됐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도(supply_yr)나 작목·품종 이름 매핑으로만 붙일 수 있다.
description_portal: '이 데이터는 경기도 내에서 선인장 및 다육식물 종묘의 연도별 생산 및 보급 현황을 정리한 것입니다. 여기에는 다양한 작목과 각 작목별로 생산된 품종명 및 해당 품종의 보급 수량이 포함되어 있습니다. 이를 통해 연도별 주요 보급 품종과 보급 규모를 파악할 수 있으며, 선인장 및 다육식물 산업의 발전 동향과 보급 전략 수립에 유용한 기초자료로 활용될 수 있습니다. 특히, 품종명에는 세부적으로 생산량까지 병기되어 있어 특정 품종의 인기도나 우선순위 등을 간접적으로 추정하는 데에도 도움이 됩니다.*선인장 : 비모란, 산취, 게발선인장*다육식물 : 꽃기린, 에케베리아, 칼랑코에'
