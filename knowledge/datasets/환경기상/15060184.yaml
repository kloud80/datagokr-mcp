summary_user: 부여군 관내에서 사업장폐기물 배출을 신고한 사업장을 한 행씩 담은 원장 파일로, 상호·사업자등록번호·도로명주소와 폐기물 구분·종류, 운반자·처리업소·처리방법, 신고기준년도를 담는다. 군청 담당자나 분석가가 "우리 읍면에 어떤 사업장이 어떤 폐기물을 배출하고 누구에게 맡겨 어떻게 처리하는가"를 확인하거나 지도 점검 대상 목록을 뽑는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 지자체의 배출자·폐기물 처리업 허가 원장이나 사업자 정보와 이어 쓰고, 도로명주소로 지도에 올려 분포를 본다.
limits: 부여군 한 곳의 사업장 목록이라 다른 시군이나 전국 비교에는 다른 지자체 파일을 모아야 한다. 배출자 신고 원장이며 폐기물 발생량·처리량 같은 통계는 담지 않는다.
