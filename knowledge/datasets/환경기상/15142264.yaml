description_portal: 경기도 하남시 반려동물 배변봉투함 정보로 공원명, 소재지지번주소, 배변봉투함 주소, 관리부서명 항목을 제공합니다.총 78개 공원에 152개의 배변봉투함이 설치되어 있으며, 관리부서는 모두 하남시청 공원녹지과로 일원화되어 있습니다. 주요 설치 지역은 미사강변도시 일대(선동·망월동)로, ‘미사 한강1~10호 공원’에만 20개 이상의 봉투함이 집중 배치되어 있습니다. 평균적으로 공원당 2개 배변봉투함이 운영되고 있으며, 시민 밀집도가 높은 생활권 공원과 반려견 산책로 주변에 우선 배치된 점이 특징입니다. 이 데이터는 하남시의 반려동물 친화정책, 도시환경 위생 개선, 시민 만족형 공원관리 행정 실현을 뒷받침하는 근거 자료로 활용될 수 있습니다.
