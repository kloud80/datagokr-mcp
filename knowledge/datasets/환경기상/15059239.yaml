summary_user: 경기도 시·군이 취합한 실내공기질 관리법 적용 다중이용시설을 시설 한 곳당 한 행으로 담으며, 시군명, 시설구분(노인요양시설·도서관·목욕장업 등), 시설명, 도로명·지번 주소, 연면적, 객석·병상 수, 위경도 좌표, 데이터 기준일자를 포함한다. 환경보건 담당자나 분석가가 "우리 시·군에 실내공기질 관리 대상 시설이 어디에 얼마나 몰려 있나"를 확인하고 점검 우선순위를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 시군코드(SIGUN_CD)·시군명이나 주소 문자열, 위경도 좌표로 다른 경기도 시·군 단위 자료나 지도와 맞춰 이어 쓴다.
description_portal: 경기도 내의 실내공기질 관리법의 적용을 받는 다중이용시설들의 현황입니다. 시설구분, 시설명, 주소 등의 정보를 제공합니다.※ 경기도 산하 시·군들의 취합 데이터입니다.이 데이터는 경기도 내 「실내공기질관리법」에 따라 관리가 필요한 다중이용시설의 현황을 정리한 자료입니다. 주요 항목은 시군명, 시설구분(노인요양시설, 도서관, 목욕장업, 놀이시설 등), 시설명, 소재지 주소(도로명 및 지번), 전화번호, 연면적, 객석수 또는 병상 수, 위도 및 경도 좌표(WGS84), 데이터 기준일자 등으로 구성되어 있습니다. 해당 법 적용 대상 시설은 대중의 이용이 많고, 실내 공기질이 건강에 큰 영향을 줄 수 있는 장소로 분류되며, 각 시설은 공기질 측정, 환기시스템, 정기 점검 등의 관리 의무가 있습니다. 본 자료는 지역별 실내환경 관리 필요 시설 분포 분석, 공기질 개선 대상 우선순위 설정, 환경보건 정책 수립, 시설별 관리이력 기반 감시체계 구축 등에 활용될 수 있으며, 환경부 및 지방자치단체 환경부서에서 수집한 공공데이터입니다.
