summary_user: 충청남도 당진시에서 유해야생동물을 포획한 기록을 건별로 담은 파일(csv, 약 14KB)로, 포획일자·보고일자, 개체 종류, 포획유형, 포획지 시도·시군·상세주소와 위도·경도, 포획개체수, 지역유형을 기록한다. 농민이나 지자체 담당자가 '당진시에서 멧돼지·고라니 포획이 어느 지역, 어느 계절에 몰리는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군 이름이나 포획지 위경도 좌표를 기준으로 공간·지명 매칭해 이어 쓴다.
description_portal: 이 데이터는 충청남도 당진시에서 포획된 유해야생동물의 현황을 기록한 행정자료입니다. 주요 항목에는 포획일자, 동물 종명(멧돼지, 고라니, 까치 등), 포획 지역, 포획 사유(농작물 피해, 인명 피해 위험, 서식지 확장 등), 포획 방법(덫·총기·포획틀 등), 처리 결과(폐사·방생·관리 이관 등), 담당 기관 등이 포함됩니다. 이를 통해 당진시에서 어떤 동물이 주로 포획되는지, 계절별·지역별 포획 패턴이 어떻게 나타나는지를 확인할 수 있습니다. 예를 들어 농번기에는 멧돼지와 고라니로 인한 농작물 피해로 포획이 증가할 수 있으며, 까치·까마귀류는 생활환경 민원과 관련된 요인으로 포획 건수가 발생할 수 있습니다. 또한 포획 후 처리 결과를 보면 방생률과 폐사율을 비교할 수 있어, 해당 지역의 야생동물 관리정책의 성과와 한계를 평가할 수 있습니다. 이 자료는 당진시뿐 아니라 충청남도 전역의 농작물 피해 대응, 인간-야생동물 갈등 관리, 생태계 보전 및 관리 정책 수립에 기초자료로 활용될 수 있습니다.
