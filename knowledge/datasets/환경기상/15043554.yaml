summary_user: 기상청 표류부이가 해상에서 떠다니며 남긴 이동경로를 지점별 관측시각과 위도·경도로 담은 건별 위치 기록이며, 포털에서 CSV 파일(약 2.2MB)로 내려받는다. 연구자나 해양·기상 분석가가 태풍 접근이나 유류 유출 같은 상황에서 특정 표류부이가 언제 어느 해역으로 흘러갔는지 추적하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관의 해양기상 관측자료와는 부이 지점 이름·번호를 맞춰 잇거나 위경도·관측시간을 기준으로 겹쳐 본다.
description_portal: '기상청에서 관측하는 표류부이의 이동경로로서 지점(기상청 표류부이(해상의 기상 상황을 관측하는 장비)의 지점),관측시간(기상청 표류부이(해상의 기상 상황을 관측하는 장비)의 위치 관측시간),위도(기상청 표류부이(해상의 기상 상황을 관측하는 장비)의 관측 위도 수량_위도),경도(기상청 표류부이(해상의 기상 상황을 관측하는 장비)의 관측위치 경도) 등을 제공합니다.- 표류부이: 표류부이는 해상에서 표류하면서 해면 상태를 관측기기로 측정하고, 측정한 값을 일정한 물리량으로 변환·처리한 후에 사용 가능한 위성통신을 이용하여 관측자료를 전송하는 장비입니다. 표류부이는 해양기상부이를 설치·운용하기가 어려운 해상이나, 유류 유출·해양오염 발생과 같이 긴급히 기상 및 해상자료가 필요할 때, 태풍의 접근 시와 같이 많은 자료가 필요할 때 사용됩니다. 표류부이에서 관측되는 기본요소는 기압, 파고, 파주기, 수온 등 입니다.'
