summary_user: 안산시 안에서 토양오염 우려로 관리대상으로 지정된 주유소 등 특정토양오염 관리대상시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 18KB)로, 신고번호·상호명·대표자·시설 구분·소재지 주소를 담는다. 안산시에서 땅을 사거나 개발하려는 사람이 주변이나 해당 부지에 지하 유류탱크를 둔 주유소 같은 토양오염 관리시설이 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호명을 맞춰 연결해야 하며, 주소를 좌표로 바꾸면 필지 단위 환경 규제 레이어와 겹쳐 볼 수 있다.
description_portal: 이 데이터는 「토양환경보전법」에 따라 특정 토양오염 가능성이 있는 시설로 지정된 주유소 등 오염관리대상시설의 현황을 정리한 자료입니다. 신고번호, 상호명, 대표자, 시설 구분(주유소), 소재지 등의 항목으로 구성되어 있으며, 단원구 신길동, 선부동, 상록구 장상동, 성포동 등지에 다수의 시설이 위치하고 있습니다. 대부분의 시설은 지하 유류 저장탱크를 보유한 주유소이며, 토양 내 유류 성분 누출로 인한 오염 우려가 있어 지속적인 환경 관리가 요구됩니다. 각 시설은 고유의 신고번호를 통해 환경행정상 등록되어 있으며, ‘에이치디현대오일뱅크㈜’, ‘㈜서율주유소’, ‘성홍 안산터미널주유소’ 등 대형 브랜드 및 개인 운영 업체가 혼재되어 있습니다.
