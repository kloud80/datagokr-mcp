summary_user: 충청남도 계룡시 관내에서 종량제봉투를 판매하는 업소를 한 곳씩 담은 API로, 행정동·상호명·도로명주소와 음식물 쓰레기 스티커 판매 여부를 제공합니다. 계룡시 주민이 '우리 동네에서 종량제봉투나 음식물 스티커를 어디서 사나'를 찾거나, 분석가가 동별 판매소 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 도로명주소(RDNMADR)를 맞춰 잇거나, 주소를 좌표로 바꿔 지도·생활폐기물 배출 지점 데이터와 겹쳐 쓴다.
limits: 계룡시 한 곳만 다루므로 다른 시군구 판매소는 지자체별 별도 데이터를 찾아야 한다. 공통 코드 키가 없어 연계는 이름·주소 매칭에 의존한다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
