summary_user: 대구광역시 달서구 안의 재생 플라스틱 업체를 업체별로 정리한 파일로, 업체명·소재지·위도경도·연락처·영업대상 폐기물·담당부서·기준일자를 담으며 파일 크기는 786바이트로 소규모 목록이다. 주민이나 폐플라스틱을 내놓으려는 사업자가 '달서구에서 이 폐기물을 받는 재생 플라스틱 업체가 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어 다른 폐기물 처리업 데이터와는 업체명·주소 매칭이나 좌표 기반으로만 이어 쓴다.
description_portal: 대구광역시 달서구에서 운영하는 재생플라스틱 업체에 대한 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다..위도, 경도, 업체명, 소재지, 연락처, 영업대상 폐기물, 담당부서, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 재생플라스틱 업체를 파악하는데 유용하게 참고자료로 쓸수 있으며, 지역별 플라스틱 산업 분석, 환경영향평가, 오염관리 등의 행정업무에 쓰는데 기초자료로 활용가능합니다.
