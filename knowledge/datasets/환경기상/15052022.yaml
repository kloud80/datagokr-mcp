summary_user: 경상북도 내 폐수배출업소에 대한 지도·점검 적발과 행정처분 내역을 사업장 건별로 담은 파일 데이터로, 업소명·소재지·종별·업종과 점검일자·지적사항·위반법령·처분일자·처분 종류를 기록한다. 주민이나 분석가가 "우리 지역 어느 폐수 배출 사업장이 어떤 위반으로 어떤 처분을 받았나"를 확인하거나 업종별·위반 유형별 단속 실태를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·소재지 주소를 매칭해 폐수배출시설 인허가 현황 등과 이어 써야 한다.
