summary_user: 경기도 김포시에서 음식물류폐기물을 다량으로 배출하는 사업장을 한 곳씩 담은 목록으로, 상호·전화번호·도로명주소·사업장 구분을 개별 주소 단위로 제공한다. 김포시 자원순환 담당자나 분석가가 "우리 동네(읍면동·권역)에 음식물 다량 배출 사업장이 어디에 얼마나 몰려 있는가"를 파악하는 데 쓴다. 전역 조인 키가 없어, 다른 데이터와는 도로명주소나 상호를 매칭하거나 같은 기관(김포시)의 다른 폐기물 데이터와 이어 쓴다.
description_portal: 경기도 김포시의 음식물류폐기물다량배출사업장에 대한 정보를 제공합니다. 제공 항목으로는 시군명, 상호, 사업장전화번호, 사업장도로명주소, 사업장구분으로 구성되어있습니다. 본 공공데이터를 통해 김포시 내 읍면동 및 권역별 음식물 다량 배출 사업장 분포 등을 알 수 있습니다. 본 공공데이터는 매월마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시청 자원순환과로 연락주시기 바랍니다.
