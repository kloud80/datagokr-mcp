description_portal: 해당 데이터는 에코스퀘어 사이버환경실무교육 시스템이 보유한 강의 콘텐츠 및 개방 교육 과정 자료 입니다. 해당 자료는 연번, 과목명, 과목설립년도, 수강완료시간, 수강대상자, 제작기관 컬럼으로 구성되어 있으며 총998개 기업 정보를 보유하고 있습니다. 사이버환경실무교육은 기관 임직원, 일반 국민, 환경 기업, 일반 기업 대상으로 사이버 환경 교육을 제작하여 개방하고 있습니다. 관심있는 국민은 해당 자료를 활용하여 환경 관련 역량을 개발할 수 있으며, 기업은 해당 자료를 활용하여 사내 환경 교육 자료로 활용할 수 있습니다.
