description_portal: 경기도 고양시 석면조사대상 건축물정보에 대한 데이터로 건물명, 위치, 구분, 연면적 등의 항목을 제공합니다. 석면안전관리법 시행령(별표1의2)에 해당하는 건축물 소유자는 건축법에 따른 사용승인(용도변경 포함) 또는 해당 건축물을 사용하게 된 날부터 1년이내 석면조사기관으로부터 건축물석면조사를 받고 그 결과를 지자체에 제출하여야 합니다. 또한 건축물석면조사 결과 석면건축물인 경우 건축물소유자는 석면건축물 안전관리인을 지정하여 석면 건축자재 유지보수 등 관리기준에 따라 관리하도록 하여야 합니다.
