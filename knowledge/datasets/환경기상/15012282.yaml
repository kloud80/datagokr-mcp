summary_user: 경기도 고양시 안에서 석면조사 대상이 되는 건축물을 한 건물(동) 단위로 담은 원장 파일로, 건축물명(상호)·동명·주소·구분·연면적과 석면건축물 여부, 석면(자재) 면적을 담는다. 주민이나 임차 예정 사업자가 "우리 동네(또는 입주할) 건물이 석면건축물로 판정됐는지, 석면 자재 면적은 얼마인지"를 확인하거나, 분석가가 고양시 내 석면건축물 분포와 관리 대상 규모를 파악하는 데 쓴다. 전역 조인 키는 없어서 주소를 지오코딩하거나 건물명·주소 문자열로 건축물대장 등 다른 건물 데이터와 맞춰 이어 써야 한다.
limits: 건축물 고유번호나 표준 코드 같은 조인 키가 없어, 다른 데이터와 연결하려면 주소·건물명 매칭에 기대야 하고 매칭 오류가 날 수 있다. 범위는 고양시 한 곳뿐이라 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 한다.
