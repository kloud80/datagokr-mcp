summary_user: 전국 자치단체가 관리하는 배출가스전문정비사업자(확인검사대행자) 업소의 인허가 원장을 사업장 단위로 담으며, 영업상태·인허가일자·휴폐업일자·주소·좌표를 포함하고 전체 1,354건이 2006-04-25부터 2026-09-18까지 걸쳐 있다. 차량 소유자나 분석가가 우리 지역에 영업 중인 배출가스 정비·확인검사 대행 업소가 어디인지 찾는 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 키로 다른 주소 기반 데이터와 이어 쓰며, 사업자번호 필드는 없다.
description_portal: '자원환경_배출가스전문정비사업자(확인검사대행자) 데이터는 자동차의 배출가스와 관련된 부품 등의 정비ㆍ점검 및 자동차 소음관련 확인검사 업무를 하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 베출가스전문정비사업자 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 교통환경과 / 044-201-6927 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
