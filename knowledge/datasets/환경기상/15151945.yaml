description_portal: ASF(아프리카돼지열병)의 시료 및 검사건수는 연간 5만 회 이상인 경우가 많습니다.야생동물질병 확산을 방지하기 위해서 야생멧돼지 시료를 접수하여 검사 및 양성, 음성 여부를 구분하는 것이 매우 중요합니다. 그래서 ASF 관리부서는 멧돼지의 포획 및 폐사체 발견일과 광주에 있는국립야생동물질병관리원(검사기관)의 실제 시료 접수일의 기간 차가 중요한 데이터가 되며, 각각의 날짜를 기록·관리하여 시간차 또한 통계화 합니다.이를 위해 따로 테이블을 구성해 의뢰에 부여된 접수 번호에 따라 포획일(발견일)과 실제 시료 접수일을 관리합니다.
