summary_user: 울산광역시 북구의 생활폐기물(종량제봉투 쓰레기) 수집운반업체를 업체별로 담은 작은 원천 목록(CSV 594바이트)으로, 업체명·담당 행정동과 법정동·소재지 주소·전화번호를 담는다. 북구 주민이나 신규 사업체·주택지 조성 사업자가 '우리 동네 쓰레기는 어느 업체가 수거하고 연락처는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 행정동·법정동 이름이나 주소를 기준으로 맞춰 이어 쓴다.
description_portal: 울산광역시 북구 생활폐기물 수집운반업체에 대한 데이터입니다.생활폐기물은 일상생활에서 배출되는 쓰레기로, 시중에서 구입할 수 있는 자치구별 종량제봉투에 담아 정해진 위치에 모아두면 그 쓰레기를 수거해가는 업체정보를 포함한 데이터입니다.담당구역을 행정동, 법정동으로 구분하여 업체별로 어떤 동을 방문하는지와 업체의 소재지 주소, 연락처가 있습니다생활쓰레기 수거와 관련한 문의가 있으실 경우, 신규사업체 혹은 주택지 조성으로 쓰레기 수거와 관련한 부분에 문의가 있으실 경우 활용할 수 있으며 추가적으로 요청할 데이터가 있으실 경우 자원순환과(생활폐기물 담당부서), 미디어정보과(공공데이터 담당부서)에 문의하실 수 있습니다.
