description_portal: 부산광역시 금정구 관내의 쌈지공원 현황에 대한 자료 입니다. 쌈지공원 현황은 금정구 내 화단 및 공원 (주소, 수종, 면적 등)의 정보를 제공합니다.이 데이터는 2026년 3월 23일 기준, 부산광역시 금정구 내에 조성된 소규모 휴식 공간인 쌈지공원 및 쉼터의 목록과 상세 정보를 담고 있습니다.각 공원별로 명칭, 소재지 주소 및 상세 위치, 면적, 주요 수종 및 식재 수량, 그리고 설치된 벤치, 파고라 등의 시설물 종류와 개수까지 구체적으로 기록되어 있습니다.이 자료는 지역 주민의 녹지 공간 및 휴식 시설 접근성을 파악하는 데 필수적이며, 도시 계획 및 환경 정책 수립 시 주요 생활권 내 녹지 확충을 위한 기초 자료로 활용됩니다.
