summary_user: 광주광역시가 운영하는 13개 대기오염 측정소(도시대기 11곳, 도로변 2곳)별로 아황산가스·이산화질소·오존·일산화탄소·미세먼지·초미세먼지 6개 항목의 한 달 평균 농도를 담은 집계 파일입니다. 광주 시민이나 분석가가 "우리 동네 측정소의 지난달 평균 미세먼지·오존 농도가 다른 측정소보다 높았나"를 비교하는 데 쓴다. 측정소코드 같은 전역 조인 키가 없어서, 에어코리아 측정소 정보나 다른 대기질 자료와는 측정소 이름을 직접 맞춰 이어 써야 한다.
