description_portal: '센서수량 및 설치장소 : 서울 전역 1,170대(주거지역, 상업지역, 공업지역, 도로 및 공원)측정정보 : S-DoT에서 측정된 환경정보(온도, 습도 등) 데이터(1시간 단위 최소, 최대, 평균값)유의사항- S-DoT 환경정보는 “열린데이터광장”을 통해서만 제공하며 관리부서에서는 별도로 제공하지 않습니다.- 대학 및 연구소, 개인 등 누구나 환경정보(csv파일)를 다운로드 하여 사적 목적(논문 작성 등)으로 활용할 수 있으나 이는 개인 등의 연구 결과이므로 서울시의 공식 입장이 아님을 밝히시기 바랍니다.- 미세먼지 데이터는 미세먼지법 제24조 제7항 및 동법 시행규칙 제18조의2 제1항과 관련하여 비공개함을 알려드립니다.- 통신지연, 장애, 설치지점 공사로 인해 데이터가 지연 또는 수정 될 수 있습니다.분석 및 활용시 데이터 구분을 위해 DATA_NO 필드가 제공되며, 1: 실시간 자료 수집, 2: 지연(보정)된 자료 입니다. 따라서, DATA_NO 1, 2가 동시에 존재할수 있으며 동일 센서의 동일시간의 자료는 DATA_NO 2가 최종 측정값입니다.※ 기존 "스마트서울 도시데이터 센서(S-DoT)환경정보"는 2026년 1월까지 제공됩니다.※ 신규 "스마트서울 도시데이터 센서(S-DoT)환경정보(실시간)"은 1시간단위로 수집된 자료를 실시간 제공합니다.'
