summary_user: 경기도 내 사업장폐기물 배출 신고를 사업장별로 담은 원장으로, 신고 접수 시군, 상호, 도로명·지번 주소, 연락처, 인허가 관리번호와 등록일자, 배출 폐기물 코드와 종류, 위도·경도, 우편번호를 포함한다. 지역 주민이나 분석가가 "우리 시군에서 어떤 사업장이 어떤 종류의 폐기물을 배출 신고했는가"를 확인하거나, 폐기물 처리업체가 배출 사업장을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매칭, 폐기물 코드(폐기물관리법·건설폐기물법 시행규칙 분류) 매핑, 또는 좌표 기반으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 사업장에서 배출되는 산업폐기물의 배출 현황을 관리하기 위한 자료로, 각 사업장의 상호, 소재지(도로명 및 지번주소), 연락처, 인허가 관리번호 및 등록일자, 폐기물 종류와 코드, 위치정보(위도 및 경도), 우편번호 등의 항목을 포함하고 있습니다. * 신고를 접수한 시군명과 업체 주소의 시군이 일치하지 않는 경우는 해당 업체가 타 지역에서 사업 진행 중 발생한 폐기물들을 그 지역 관공서에 신고한 경우입니다.* 배출 폐기물 코드는 폐기물관리법 시행규칙 별표4 및 건설폐기물법 시행규칙 별표1을 참고해주시기 바랍니다.
