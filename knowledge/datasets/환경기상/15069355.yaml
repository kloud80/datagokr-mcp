summary_user: 광주환경공단이 운영하는 광역위생매립장의 시설명·소재지·면적·매립용량·매립방식·1일 매립처리량·반입시간·차량현황·침출수 처리방식·사용기간 등을 시설 단위로 정리한 소규모 현황 파일(약 294바이트 CSV)이다. 광주 지역 생활폐기물이 어디에 어떤 규모와 방식으로 매립되는지, 매립장의 남은 사용기간과 침출수 관리 방식이 무엇인지 확인하려는 분석가·정책 담당자·주민이 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 기준으로 맞추거나, 같은 기관(광주환경공단)의 다른 시설 데이터와 함께 읽는 방식으로 이어 쓴다.
description_portal: 광주환경공단 광역위생매립장 현황에 대한 데이터로, 공단이 관리·운영 중인 위생매립장의 주요 정보를 제공합니다. 데이터에는 각 매립장의 "시설명"과 "소재지"를 비롯하여, 전체 부지 "면적", "매립용량", "침출수 처리방법", "처리기간" 등의 항목이 포함되어 있습니다. 이를 통해 매립장의 물리적 규모와 처리 능력, 환경관리 방식 등을 종합적으로 파악할 수 있으며, 폐기물 처리정책 수립, 환경영향 분석, 유관 기관 간 정보 공유 등에 활용될 수 있습니다. 또한 지속가능한 매립장 운영과 자원순환 기반 조성을 위한 기초자료로도 유용하게 활용될 수 있습니다.
