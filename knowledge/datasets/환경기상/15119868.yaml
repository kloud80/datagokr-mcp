summary_user: 울산광역시 관내 대기질 측정소별로 미세먼지·초미세먼지·오존·이산화질소·일산화탄소·아황산가스의 연평균 농도를 연도 단위로 담은 집계 파일(CSV, 약 1KB)이다. 시민이나 분석가가 '울산의 측정소별 미세먼지 연평균 농도가 해마다 어떻게 바뀌었나'처럼 연도별 대기질 추이를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 측정소 이름이나 연도를 기준으로 맞춰 이어 써야 하며, 에어코리아 측정소 정보와도 이름 매핑으로만 연결된다.
description_portal: 본 데이터는 관내 대기질 측정망에서 수집한 연평균 대기 오염 물질 농도 정보이다. 미세먼지, 초미세먼지, 오존, 이산화질소, 이산화황 등 주요 대기 오염 물질의 연평균 농도 및 환경 기준 달성 여부를 포함한다. 대기질 자료는 환경 정책 수립 및 오염 저감 대책 효과 평가에 필수적인 기초 자료이다. 해당 정보는 대기 환경 개선 계획 수립, 고농도 미세먼지 대응 방안 마련, 배출원 관리 정책 개발에 활용된다. 연도별 대기질 변화 추이 분석을 통해 환경 정책의 효과를 검증하고 개선 방향을 설정할 수 있다. 시민들이 지역의 대기 환경 상태를 확인하여 건강 관리에 활용할 수 있도록 지원하며, 환경 개선 사업의 우선순위 결정에도 기여한다.
