description_portal: '기상청에서 발표한 보건기상지수 중 꽃가루농도위험지수 자료를 제공합니다.이중 꽃가루농도위험지수는 매우높음, 높음, 보통, 낮음 네단계로 구분하여 제공합니다.높음 이상은 대개 알레르기 환자에게서 증상이 나타납니다. 꽃가루 농도가 높은날에는 실내에서는 창문을 닫고 야외활동을 자제하는 것이 좋습니다. 외출을 해야 한다면 반드시 마스크나 모자, 선글라스 등으로 얼굴이나 피부, 눈 등을 가리고 꽃가루가 달라붙기 쉬운 니트나 털옷을 입지 않는 것이 좋습니다. 손과 얼굴, 눈 등은 물로 씻고 비염 등이 있는 사람은 외출 후 식염수나 옅은 소금물로 코 속을 깨끗이 씻는 것도 도움이 됩니다. 알레르기가 심한 사람은 가능한한 집안에 꽃나무나 화초를 기르지 않는 것이 좋구요, 꽃가루가 많은 날 낮에는 빨래를 밖에 널어 말리지 않도록 합니다.제공기간: 참나무(4~6월), 소나무(4~6월), 잡초류(8~10월)지수별 단계 구분: (낮음) 0, (보통) 1, (높음) 2, (매우높음) 3'
