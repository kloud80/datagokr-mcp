summary_user: 환경영향평가 대상 사업의 위생공중보건 분야 조사지점(지점명·주소·X/Y좌표·조사기간)과 조사차수별 유해물질 측정값(시안화수소·암모니아·황화수소·벤젠·수은·카드뮴·포름알데히드 등)을 건별로 담은 전국 범위 파일이다. 개발사업 예정지 주변 주민이나 분석가가 특정 사업 부지 인근에서 평가 당시 벤젠·중금속 같은 유해물질 농도가 어느 수준이었는지 확인하는 데 쓴다. 전역 조인 키는 없어 사업코드(BSNS_CD)로 같은 기관의 환경영향평가 협의 현황·사업구역 데이터와 맞추거나, 좌표·주소로 토지이용규제·개발사업 정보와 공간적으로 겹쳐 본다.
