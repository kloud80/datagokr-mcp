summary_user: 항공고정통신망(AFTN)으로 전달된 태풍 정보 전문을 발표 건별로 담은 파일로, 발표시간·태풍주의보센터·태풍이름·중심위치·이동방향과 속도·중심기압·최대지상풍속과 6·12·18·24시간 후 예상 중심위치·최대풍속, 전문 원문을 포함한다(zip 약 30KB). 항공사 운항 관리자나 분석가가 '특정 태풍의 예상 진로와 세력이 항로·공항 운영에 언제 영향을 주는가'를 판단하거나 과거 태풍 전문을 되짚어 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 태풍이름·발표시간을 맞추는 방식으로만 연결하며, 기상청 태풍·특보 데이터와 이름 매핑으로 함께 본다.
limits: 전역 조인 키가 없어 예보구역·격자(nx,ny) 기반 기상 예보 데이터와 바로 결합되지 않는다. 행정구역 단위가 아닌 비공간 전국 데이터라 지역별 영향 분석에는 위경도 문자열을 따로 해석해야 한다.
