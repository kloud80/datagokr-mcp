description_portal: 항공기상청에서는 항공고정통신망(AFTN)을 통해 항공 안전에 영향을 줄 수 있는 태풍 관련 정보를 실시간으로 제공합니다.이 정보는 기상청을 포함한 국내외 관련 기관에서 생산되며, 태풍 이름, 중심기압, 현재 중심 위치(위도·경도), 최대지상풍속 등의 주요 정보를 포함하고 있습니다.또한, 태풍의 이동 경로 예측을 위해 6시간, 12시간, 18시간 후의 예상 중심 위치와 최대지상풍 정보도 함께 제공되어, 항공기 운항 경로 설정 및 공항 운영 계획 수립에 활용됩니다.해당 정보는 항공사 운항 관리자, 조종사, 관제기관 등이 상황을 신속히 판단하고 비행 안전 대책을 마련하는 데 중요한 참고자료가 되며, 국제 기준에 따라 표준화된 형식으로 전달됩니다.
