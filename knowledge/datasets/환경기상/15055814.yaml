description_portal: 본 데이터는 전북특별자치도 내에서 발급된 GR마크(재활용 우수제품 인증) 관련 현황을 포함하고 있습니다. 각 인증 건별로 분야, 기준번호, 규격명, 종류, 유효인증번호, 유효기간, 인증일자, 만료기간, 업체명, 대표자명, 소재지 정보를 담고 있습니다. 데이터는 재활용 폐기물 및 자원 재활용 품질을 보증하는 제품들의 인증 현황을 나타내며, 주로 폐지, 폐유리, 폐요업(재활용 골재, 아스팔트 혼합물 등), 유기성 폐기물 등 다양한 재활용 분야의 인증 제품이 포함되어 있습니다. 인증기간과 업체 소재지 정보가 함께 제공되어, 제품별 유효성 관리, 업체별 인증 분포 파악, 재활용 산업 현황 분석 등에 활용 가능합니다. 환경 정책, 재활용 인증 관리, 관련 산업 지원 및 품질관리 방안 수립에 유용한 데이터입니다.
