summary_user: 전주시 관내 사업장폐기물 배출 사업장을 한 곳씩 담은 목록으로, 상호·배출 폐기물 종류·도로명/지번 주소·위도·경도를 사업장 단위로 담는다(CSV 약 217KB, 시군구 범위). 환경 분야 분석가나 주민이 '우리 동네 주변에 어떤 폐기물을 배출하는 사업장이 어디에 있나'를 지도에서 확인하거나 폐기물 종류별 배출 사업장 분포를 파악하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 전북특별자치도 전주시 사업장폐기물배출자 현황 데이터는 전주시 관내 사업장폐기물 배출 사업장의 기본 정보를 시민에게 투명하게 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 상호, 폐기물종류, 사업장 도로명주소, 사업장 지번주소, 위도, 경도 등의 정보를 포함하여 사업장폐기물 배출 현황과 위치 정보를 체계적으로 확인할 수 있도록 구성되었습니다.특히 배출 폐기물 종류와 위치정보(위도·경도)를 함께 제공함으로써 지역 내 사업장폐기물 배출 분포를 파악하고, 환경관리 현황 분석, 정책 수립 기초자료, 지도 기반 정보서비스 구축 등에 활용할 수 있도록 설계되었습니다. 또한 시민, 연구자, 환경 관련 종사자 등이 지역 환경관리 실태를 이해하고 관련 통계·분석 자료로 활용할 수 있습니다.전주시는 본 데이터를 통해 사업장폐기물 관리 행정의 투명성을 제고하고 환경정보의 공공성을 강화하는 것을 목표로 하며, 신규 신고, 변경 및 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 청소지원과에서 제공·관리합니다.
