description_portal: 경기도 하남시 종량제봉투 판매정보로, 실제 판매 시점·주문정보·판매금액을 포함한 종량제봉투 유통의 최종 단계 데이터입니다.판매일자는 2000년부터 수천 건 이상 축적되어 있으며, 판매일자–주문일자–요청일자가 동일하게 기록된 경우가 많아 당일 처리율이 매우 높은 행정·판매 흐름을 보여줍니다.또한 고객아이디가 포함되어 있어, 기관·편의점·마트 등 판매처별 판매량 분석, 지역별 공급격차 분석 등이 가능하며, 판매금액은 소액부터 수십만 원까지 다양하게 분포해 대량 구매처와 소량 구매처가 혼재된 패턴을 확인할 수 있습니다. 이 데이터는 판매정보 → 주문정보 → 재고정보 → 물품코드 체계와 연결되는 핵심 지점으로, 종량제봉투의  공급망(SCM) 분석이 가능합니다.
