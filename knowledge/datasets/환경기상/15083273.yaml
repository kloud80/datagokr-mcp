summary_user: RFID 종량제를 시행하는 지자체의 음식물쓰레기 배출량과 배출횟수를 일별·요일별·시간대별로 묶은 종합 배출통계 파일이며, 실측 파일에는 2025년 1월 일별 종합배출내역이 담겨 있다. 지자체 담당자나 분석가가 'RFID 종량제 지역에서 어느 날·어느 시간대에 음식물쓰레기 배출이 몰리는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지자체 이름 매핑이나 같은 기관(한국환경공단) 자료끼리만 이어 쓸 수 있다.
limits: 파일의 실제 머리행이 '2025년 01월 일별 종합배출내역' 한 줄이고 나머지 열은 이름 없이 읽혀서 표 구조를 직접 확인해야 한다. 공통 행정코드 같은 조인 키가 없어 지역 단위 연계는 이름 맞추기에 기대야 한다. 집계 통계이므로 개별 배출 지점이나 세대별 배출 기록은 담지 않는다.
