summary_user: 광주광역시 서구 관내에서 폐기물 처리·수집·운반 허가를 받은 업체를 한 행에 한 곳씩 담은 소규모 목록 파일(csv 약 4KB)로, 상호·영업대상 폐기물·사무실 주소·전화번호·허가일자를 담는다. 서구에서 특정 폐기물을 맡길 허가 업체를 찾는 사업자나, 관내 폐기물 업체 분포와 허가 시기를 살피는 담당자·분석가가 쓴다. 전역 조인 키나 사업자번호는 없어 다른 데이터와는 상호나 사무실 주소로 맞춰 이어야 한다.
description_portal: 이 데이터는 광주광역시 서구 관내에서 폐기물 처리·수집·운반 등의 업무를 수행하는 폐기물 관련 업체에 대한 기본 정보를 담고 있으며, 상호, 영업대상폐기물, 사무실 주소, 전화번호, 허가일자 등의 항목으로 구성되어 있습니다.해당 자료는 지역 내 폐기물 처리 인프라 현황 파악, 업체 분포도 분석, 환경영향 관리, 자원순환체계 구축 등 다양한 환경행정 업무에 활용될 수 있습니다.또한, 업체별 허가일자 정보는 허가갱신 및 관리주기 분석, 행정지도 대상 도출, 폐기물 관련 민원 대응의 기초자료로도 활용 가능합니다.연 1회 갱신되며, 공공저작물로 자유롭게 활용할 수 있는 데이터입니다.
