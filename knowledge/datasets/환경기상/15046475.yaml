description_portal: '○ 통계개요* 통계명 : 환경오염물질 배출시설(대기)* 통계종류 : 서울시 대기오염물질 배출시설 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 환경오염물질 배출시설 실태를 파악하여 시설의 효율적인 관리ㆍ지도 및 환경보전대책 수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 환경부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 대기오염물질 배출시설(1종~5종) 개소 등○ 용어설명* 대기오염물질 : 대기오염의 원인이 되는 가스ㆍ입자상 물질 또는 악취물질로서환경부령이 정하는 것○ 기 타* 사업장에서 배출되는 오염물질배출량에 따라 1~5종으로 구분1종 : 연간 오염물질배출량이 80톤이상이거나 1일 평균 폐수배출량 2,000㎥이상2종 : 연간 오염물질배출량이 20톤이상 80톤미만이거나, 1일평균 폐수배출량700㎥이상 2,000㎥미만3종 : 연간 오염물질배출량이 10톤이상 20톤미만이거나 1일평균 폐수배출량200㎥이상 700㎥미만4종 : 연간 오염물질배출량이 2톤이상 10톤미만이거나 1일평균 폐수배출량50㎥이상 200㎥미만5종 : 그외 기타 배출시설 또는 소음진동 배출시설 사업장, 폐수배출량에는용수 상용량을 기준함'
