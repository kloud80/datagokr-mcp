summary_user: 경기도 군포시가 특정토양오염관리대상으로 지정한 시설(총용량 2만리터 이상 석유류·유해화학물질 제조·저장시설)을 시설 한 곳당 한 행으로 업체명과 소재지 주소, 데이터기준일자를 담은 시군구 단위 목록이며, 파일 크기는 1746바이트로 작다. 주민이나 부동산·개발 검토자가 "이 필지 주변에 토양오염 우려가 있는 주유소·유류·화학물질 저장시설이 있는가"를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 소재지 주소를 주소 정제·지오코딩하거나 업체명을 대조해서 이어 쓴다.
description_portal: 경기도 군포시 관내의 특정토양오염관리대상으로 지정한 시설에 대한 데이터로 업체명(특정토양오염관리대상시설의 명칭), 소재지 주소(특정토양오염관리대상시설의 도로명주소, 도로명주소가 없는 경우 지번주소 기재), 데이터기준일자 항목을 제공합니다. 특정토양오염관리대상은 토양환경보전법 시행규칙 [별표2]에 따른 총용량 2만리터 이상의 석유류의 제조 및 저장시설, 유해화학물질의 제조 및 저장시설이 포함됩니다. 군 부대에 대한 내용은 공공기관의 정보공개에 관한 법률 제9조에 따른 비공개 정보이므로 공개하지 않습니다.
