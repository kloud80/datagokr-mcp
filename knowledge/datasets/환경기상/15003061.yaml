summary_user: 한국동서발전 소속 발전소별로 연도마다 발전량(GWh), 일반·지정 폐기물 발생량(톤), 발전량 대비 원단위 발생량, 일반·지정 폐기물 재활용량과 재활용률을 정리한 집계 파일입니다(CSV 약 1.4KB의 작은 표). 연구자나 분석가가 "어느 발전소가 발전량 대비 폐기물을 적게 내고 재활용을 많이 하는가"를 비교할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 연도와 발전소 이름을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 한국동서발전의 발전소별 폐기물 처리 현황 정보는 각 발전소에서 발생한 폐기물의 발생량과 재활용 실적 등을 종합적으로 정리한 데이터입니다.해당 데이터는 연도, 발전소, 발전량(GWh), 일반 폐기물 발생량(톤), 지정 폐기물 발생량(톤), 원단위 발생량(톤/GWh), 일반 폐기물 재활용량(톤), 지정 폐기물 재활용량(톤), 재활용률(%)의 항목으로 구성되어 있습니다.본 자료를 통해 발전소 운영 시 발생하는 폐기물의 규모와 유형별 특성, 발전량 대비 폐기물 배출 효율성, 재활용 실적 등을 정량적으로 파악할 수 있습니다.학계 및 연구기관에서는 이 데이터를 활용하여 △발전소별 폐기물 관리 효율 비교 △에너지 생산과 환경부하 간 상관관계 분석 △지속가능한 발전소 운영 전략 수립 △재활용률 향상 방안 도출 △환경영향평가 모델 개발 등 다양한 환경 및 에너지 융합 연구에 활용할 수 있습니다.또한 환경규제 기준과의 비교분석을 통해 정책 대응 능력을 평가하거나, 국제 기준에 부합하는 폐기물 감축 및 자원순환 방안 연구에도 유용한 기초자료로 활용될 수 있습니다.
