summary_user: 경기도 업사이클플라자 메이커 스페이스가 보유한 장비를 장비 한 종류당 한 행으로 담은 목록이며, 장비 구분, 장비명, 수량, 배치 장소(창작의 광장·순환창작소), 데이터기준일자로 구성된다. 3D프린터, 레이저커팅기, CNC라우터, 미싱기 같은 제작 장비를 빌려 쓰려는 도민이나 창작자가 '어떤 장비가 몇 대, 어느 공간에 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장비명이나 장소 이름을 맞추거나 같은 기관 데이터끼리만 이어 쓸 수 있다.
description_portal: '경기도 업사이클플라자 내 메이커 스페이즈에서 보유하고 있는 장비 목록으로 장비 상세 위치는 pdf 파일 참고해주시기 바랍니다.항목은 장비 구분, 장비명, 수량, 위치, 데이터기준일자로 구성되어 있으며, 장비는 창작의 광장과 순환창작소 두 곳에 분산 배치되어 있습니다. FDM 및 DLP 방식의 3D프린터, CNC라우터, 레이저커팅기, 다양한 미싱기와 밀링선반, 플로터 등 디지털 제작 장비와 수작업 장비가 혼합되어 있어 업사이클링 디자인 및 제작 활동을 지원하는 인프라로 활용됩니다[장비 신청방법]1. 경기도업사이클플라자 홈페이지 → 장비대여접속 및 신청* 경로 : https://www.ggupcycle.or.kr/frt/biz/eqmnt/listEq.do2. 전화문의(031-299-7919)3. 장비 사용 가능 시간 : 10:00~17:30 (장비당 최대 3시간), 매주 월요일, 구정, 추석 명절 당일 제외'
