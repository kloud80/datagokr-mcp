description_portal: 'APCC 계절예측은 11개국 16개 APEC 회원국 기상청 및 연구 기관으로부터 수집된 전지구 예측 모델의 300개 이상의 앙상블 자료를 종합한 것입니다.다중모델 단정예측(DMME: Deterministic MME), 다중모델 확률예측(PMME: Probabilistic MME) 결과를 제공하고 있습니다.단정예측 예측값은 편차로 제공되며 편차란 기후값 혹은 평년값과의 차이입니다.확률예측 확률값은 3분위의 범주로 나누어 제공되며 기온(강수)의 경우 평년보다 높을(많을) 확률, 평년과 비슷할 확률, 평년보다 낮을(적을) 확률로 표현됩니다.제공하고 있는 변수 강수, 기온, 지위고도, 해수면온도, 바람 등입니다.이 데이터는 아시아태평양경제협력체기후센터에 계절예측자료를 제공하는 기관의 목록을 제공합니다.자세한 내용은 아래의 url을 참고하십시오.https://apcc21.org/ser/global/modelDescription.do?lang=ko'
