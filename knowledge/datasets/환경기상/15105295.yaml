summary_user: 화학제품관리시스템에 신고된 안전확인대상 생활화학제품의 신고증명서 발급 기록을 담은 전국 단위 파일(CSV 약 27.6MB)로, 상호명·제품명·신고번호·발급일·제형·신규/변경 구분·제조/수입 구분·수입 제품의 제조국가와 제조회사가 제품별 발급 건마다 들어 있다. 소비자나 유통 사업자가 '이 세정제나 방향제가 신고증명서를 받은 제품인지, 수입품이라면 어느 나라 어느 회사가 만들었는지'를 확인할 때 쓰고, 분석가는 제형별·연도별 발급 추이나 수입 비중을 집계할 때 쓴다. 신고번호(chem_product_report_no)를 키로 같은 시스템의 다른 생활화학제품 데이터와 이어 쓰며, 지역 코드나 좌표는 없어 공간 데이터와는 바로 연결되지 않는다.
description_portal: 본 데이터는 화학제품관리시스템에서 관리하는 안전확인대상 생활화학제품의 신고 증명서 발급 현황을 집계한 공공데이터입니다. ‘신고번호’, ‘발급일자’, ‘제형’, ‘신고유형(신규 ·변경)’, ‘제조수입구분’, ‘제조국가’ 등의 필드를 포함하며, 제품별·제형별·신고유형별 발급 기록을 제공합니다. 발급 절차 이행 모니터링, 제형별 발급 통계 분석, 변경 신고 이력 관리, 수입 제품 안전성 추적, 정책 성과 평가, 신고 시스템 개선 방안 도출, 내부 감사 및 보고서 작성, API 자동화 연동, 산업별 발급 패턴 분석, 글로벌 제도 비교 연구 등에 활용할 수 있습니다.
