description_portal: '경상남도 사천시에서 발생하는 음식물류 폐기물 다량배출사업장에 대한 핵심 정보를 공공데이터로 제공하고 있습니다. 이 데이터는 각 사업장의 상호명을 비롯하여, 폐기물 발생지인 읍면동 소재지를 명확히 포함합니다.특히, 해당 사업장의 구분 정보(예: 집단급식소, 일반음식점, 대규모 점포 등)와 함께, 사업장 규모를 면적 또는 이용 인원(명) 단위로 상세히 명시합니다. 또한, 환경 관리 및 정책 수립의 기초 자료가 되는 예상 배출량 정보로서, 사업장별 연간 예상 배출량과 월간 예상 배출량을 모두 제공하여 폐기물 관리의 효율성을 높이고, 자원 순환을 촉진하는 데 기여하고 있습니다. 제공 데이터 는 상호명, 읍면동, 소재지, 사업장구분, 사업장규모, 년배출량예상, 월배출량 예상이다.'
