summary_user: 충청남도 태안군에서 포획한 유해야생동물을 포획 건별로 담은 원천 데이터로, 신고일자·포획일자, 동물 종류, 포획 방식, 포획지 시도·시군·상세주소와 위도·경도, 포획 개체 수를 담는다. 태안군 안에서 멧돼지·고라니 같은 유해야생동물이 언제 어디서 얼마나 잡혔는지 확인해 농작물 피해 대응이나 포획 지점 분포를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군 이름이나 위도·경도 좌표를 기준으로 맞춰 이어 쓴다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와 연결하려면 이름 매핑이나 좌표 대조가 필요하다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 하루 5,000회로 제한된다.
