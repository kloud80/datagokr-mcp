summary_user: 19개 예보 권역별 초미세먼지 예측 등급을 발표일시·예측일 단위로 담은 파일 데이터로, 단기예보(좋음~매우나쁨)와 주간예보(높음/낮음)를 포함하며 2025-09-01~2026-09-02 전국 3,650행이다. 국민이나 분석가가 내일·모레 우리 지역 초미세먼지가 나쁠지, 주말 야외활동이 가능한지 확인하는 질문에 쓴다. 권역명이 컬럼으로 되어 있고 전역 조인 키는 없어서, 다른 데이터와는 권역 이름 매핑이나 같은 기관 코드로 연결하고, 같은 부문의 에어코리아 실시간 대기질·기상청 예보와 함께 본다.
description_portal: '○단기예보 : 19개 예보 권역*에 대한 오늘/내일/모레(D+0~D+2)의 초미세먼지 예측 등급 정보(좋음/보통/나쁨/매우나쁨)를 매일 4회(05시/11시/17시/23시) 제공합니다.○주간예보 : 19개 예보 권역에 대한 글피(D+3)부터 6일 뒤(D+6)까지의 초미세먼지 예측 등급 정보(높음/낮음)를 매일 1회(17시30분) 제공합니다.※본 자료는 에어코리아(https://www.airkorea.or.kr)에서 제공하는 예보 자료와 일치합니다. 당일의 예보 정보는 에어코리아 웹사이트**를 확인하시기 바랍니다.*19개 예보 권역 : 서울, 인천, 경기북부, 경기남부, 강원영동, 강원영서, 대전, 세종, 충북, 충남, 광주, 전북, 전남, 부산, 대구, 울산, 경북, 경남, 제주**(단기예보)오늘/내일/모레 대기정보, (주간예보)초미세먼지 주간예보'
