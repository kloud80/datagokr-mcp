description_portal: '○ 통계개요* 통계명 : 배출부담금 부과 및 징수현황* 근거법령 : 수질및수생태계보전에관한법률 제41조, 대기환경보전법 제35조* 작성목적 : 대기오염물질 배출시설 및 폐수배출시설에 대하여 배출 허용기준을 초과하여오염물질을 배출하는 사업자에 대하여 초과 배출한 오염물질의 처리에소요되는 비용에 상당하는 경제적 부담을 주어 배출허용기준의 준수(개선명령 등의 실효성)를 확보할 목적* 조사체계 : 환경부 → 자치구* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 수질 및 대기의 배출부담금 부과 및 징수금액 등○ 용어설명○ 기 타* 대기는 대기환경보전법, 수질은 수질및수생태계 보전에 관한 법률에 근거하여 부과 징수* 숫자의 단위미만은 반올림하였으므로, 내용의 계가 일치하지 않을 수 있음○ 출 처 : 물재생시설과'
