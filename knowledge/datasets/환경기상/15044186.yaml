summary_user: 해양환경공단 해양수질자동측정망 중 영산강 하구·목포 해역 측정소(정점)별로 관측일자에 따른 수온, 염분, 전기전도도, 수소이온농도(pH), 용존산소량, 탁도, 클로로필 측정값을 담은 시계열 파일(CSV)이다. 연구자나 지자체 담당자가 영산강 하구 일대에서 특정 기간 용존산소가 얼마나 떨어졌는지, 계절에 따라 수온·염분이 어떻게 변했는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해역의 해양수질자동측정망 파일과는 정점명·정점코드와 관측일자를 맞춰 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 영산강 하구와 목포 해역에 설치된 측정소의 수질 자동측정 정보를 제공합니다. 본 데이터는 수온, 염분, 용존산소(DO), pH, 탁도, 클로로필-a 등 주요 항목을 실시간으로 측정한 결과를 포함하며, 자료는 수질 모니터링, 오염 감시, 조기경보 체계 운영 등에 활용됩니다. 측정망은 해양환경 변화에 대한 신속한 대응과 지속적인 수질 관리를 위한 과학적 기초자료를 제공합니다. 또한 계절별 수질 변화, 주요 오염원 분석, 정책 효과 평가 등에 유용하게 활용됩니다. 데이터는 시계열 통계 형식으로 제공되며, 공공기관, 지자체, 연구기관 등에서 해양환경 관리와 정책 수립에 참고자료로 사용됩니다.
