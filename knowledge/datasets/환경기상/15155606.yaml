description_portal: 탄소중립 실천포털에 게시된 주요 팝업창 목록을 정리한 데이터로, 포털에서 이용자에게 즉시 안내가 필요한 핵심 공지사항을 한눈에 확인할 수 있도록 구성된 것입니다. 각 팝업창은 행사 일정 변경, 공모전 운영 안내, 정보 제출 기한 연장, 정책 논의 등 시의성이 높은 정보를 전달하기 위해 생성되며, 제목·내용·연결 URL을 함께 제공하여 사용자가 곧바로 상세 페이지로 이동할 수 있도록 돕습니다.특히 홈페이지 개편 안내, 공모전 기간 연장, 챌린지 당첨자 정보 수집 기간 연장, NDC 대국민 공개 논의 안내 등은 포털 운영 및 대국민 참여 활동에서 중요한 변화 사항을 담고 있어, 사용자 행동과 참여 유도를 위해 필수적으로 공지되는 항목들입니다. 이 데이터는 이러한 팝업 공지가 어떤 주제와 목적을 가지고 게시되었는지 파악할 수 있게 해주며, 향후 팝업 게시 기준이나 사용자 안내 체계 개선을 위한 기초 자료로 활용할 수 있습니다.
