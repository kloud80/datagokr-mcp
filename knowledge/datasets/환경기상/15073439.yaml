summary_user: 인천광역시의 온실가스 배출량을 배출원·부문별로 나눠 2010~2023년 연도별 열로 담은 집계 통계로, 온실가스종합정보센터 인벤토리 기준 광역(연료) 직접·간접 배출량을 Gg CO2eq 단위로 싣는다. 인천시 기후정책 담당자나 분석가가 "인천의 산업·수송 등 부문별 배출량이 2018년 이후 얼마나 줄었는가" 같은 탄소중립 이행 점검 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도 배출량이나 인구·에너지 통계와는 광역·기초 지역명과 연도를 직접 맞춰 이어 써야 한다.
description_portal: '인천광역시가 제공하는 온실가스 배출량 현황 공공데이터는 시의 연도별 총 온실가스 배출량을 배출원 및 부문별로 상세하게 집계한 통계 자료입니다. 이 데이터는 지역의 기후 변화 대응 전략, 탄소 중립 이행 목표 달성 여부, 배출량 감축 정책 수립의 기초 자료로 활용됩니다.*해당 자료는 온실가스종합정보센터 온실가스 인벤토리 통계 자료 입니다. 인천_광역(연료)기준 자료 입니다.(직접배출량, 간접배출량) / 단위: Gg CO2eq이 자료는 인천광역시의 기후 위기 대응 목표와 감축 계획을 수립하는 데 필수적인 과학적 근거를 제공합니다.'
