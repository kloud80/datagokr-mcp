description_portal: 해당 데이터는 제천시의 낚시통제구역지정 현황으로  구분, 지정일자, 관리주체, 상세주소, 먼적, 데이터기준일자로 이루어져 있습니다.* 통상적으로 낚시통제구역은 통제구역 하천의 '길이'에 해당하는 내용이 있지만, 제공해드리는 데이터의 경우는 저수지, 호수에 해당함으로 면적에 대한 내용만 있습니다. 지정된 지역은 2006년 4월에 지정된 국가 유산  '명승'중 20호로 지정된 국가명승으로써 의림지는 「자연유산 보존 및 활용에 관한 법률」 제17조 제1항 제2호에 따라 우리 시에서는 명승지에서 동물, 식물, 광물을 포획·채취하거나 이를 그 구역밖으로  반출하는 행위에 대해서 관리하고 있음을 알려드립니다. 그 외에 낚시통제구역으로 지정된 지역이 없음을 안내해 드립니다.
