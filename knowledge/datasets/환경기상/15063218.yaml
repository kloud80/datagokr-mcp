description_portal: '□ 정의 - 해당 배출량 통계는 2023년 1월부터 12월까지 전국에서 발생한 배출량에 대한 통계자료로, 기초자료 수집 및 검증에 약 2년 소요 - 국내에서 배출되는 대기오염물질을 시군구별, 배출원별, 연료별로 배출량 산정 및 제공(배출량 단위 : kg)□ 법적 근거 - 대기환경보전법 제17조 (대기오염물질의 배출원 및 배출량 조사) - 미세먼지 저감 및 관리에 관한 특별법 제17조 (국가미세먼지정보센터의 설치 및 운영)□ 작성목적 - 국내에서 발생하는 배출원별 대기오염물질 배출량 현황을 파악하여 대기환경정책(대기환경개선 종합계획, 미세먼지 종합대책, 미세먼지 종합계획 등) 수립·이행·평가 등을 위한 근거자료, 대기질예보 모델링 수행을 위한 입력자료 등 활용□ 작성대상 - 대깅염물질이 발생하는 배출원 중 배출량 산정 방법론이 구축되어 있는 배출원을 대상으로 배출량을 산정하며, 이를 위하여 약 150개 유관기관으로부터 약 260개 자료를 수집하여 배출량 산정에 활용□ 작성범위  - 인위적으로 발생되는 대기오염물질을 배출원별로 구분하여 각 배출원에 적합한 방법론을 구축하고 전국, 광역시도, 시군구 수준으로 배출량 산정□ 용어설명 - CAPSS(대기정책지원시스템, Clean Air Policy Support System) : 대기오염물질 배출량 산정 시스템 - 배출계수 : 각 배출원이 오염물질을 배출하는 정도를 원단위로 나타낸 값으로써, 대기오염물질 배출량 산정시 배출원별.연료별 배출계수를 적용□ 작성주기 및 결과 공표 - 공표주기 : 1년 - 공표방법 : 국가미세먼지정보센터(https://www.air.go.kr) - 배출량 연보 및 배출량 통계 파일 게재, 대기오염물질 배출량 연보 배포 - 공포시점 : 익익년 12월 - 간행물명: 대기오염물질 배출량'
