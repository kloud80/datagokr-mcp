description_portal: 물환경보전법 제 16조의 3  「수질오염방제센터의 운영」에 따라 공공수역의 수질오염사고 발생 시 신속하고 효과적으로 대응하여야 함.수질오염사고 발생 시 보다 신속한 초동대응 이 가능하도록 재난관리자원 방제비축센터 내 방제 물품 및 장비의 정보와 재고 수량을  시스템에 제공하고 있음.수질오염방제센터는 각 수계별 수질오염사고 위험 지역 인근 및 사각지대에 설치되어있는 수질오염 방제비축센터를 운영하고 있으며, 방제비축센터 내 물품 및 보유 장비 현황을 월주기 데이터로 제공하여 수질오염사고 발생 시 가용한 장비 및 물품의 현황 파악 가능함.
