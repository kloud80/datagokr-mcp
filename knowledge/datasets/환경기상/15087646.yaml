summary_user: 환경정책자금지원시스템에 등록된 융자사업의 지원 실적을 기업구분·업종·자금구분·지원사업·지원분야별 대여액(원)과 연도로 정리한 전국 단위 비공간 CSV 파일(약 280KB)이다. 정책 담당자나 분석가가 '연도별로 어떤 업종·기업 유형에 환경 융자가 얼마나 나갔나'를 보고 예산 집행 추이를 평가하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 통계와는 업종명·연도 같은 이름 매핑으로만 잇는다.
description_portal: 본 데이터는 환경정책자금지원시스템에 등록된 융자사업의 지원 상세 실적 정보를 집계 ·제공하는 공공데이터입니다. 총 8개 필드("순번", "기업구분", "업종", "자금구분", "지원사업", "지원금액(대여액_원)", "연도" 등)를 포함하며, 기업 유형별·업종별로 지원된 자금 규모와 연도별 지원 현황을 한눈에 파악할 수 있습니다. 정책 담당자는 예산 집행 추이를 분석하여 지원사업의 효율성을 평가하고, 연구자 및 금 융기관은 시장 동향 분석, 투자 우선순위 설정 및 리스크 관리 자료로 활용할 수 있습니다. 또한 중소기업 맞 춤형 지원 성과 분석, 정책 개선안 도출, 성과 보고서 작성 및 대국민 정보 제공에도 유용한 자료입니다. 다양한 시각의 데이터 시각화와 리포팅에도 활용 가능합니다.
