description_portal: '이 공공데이터는 경질유(등유, 경유 등) 및 중질유(벙커C유 등)를 연료로 사용하는 산업체 및 사업장의 상세 현황을 집계한 자료입니다. 에너지 소비 구조와 환경 관리 실태를 파악하는 데 필수적인 정보를 제공하는 것이 주요 목적입니다.제공되는 핵심 정보에는 해당 업체를 명확하게 식별하는 상호명과 업체의 지리적 위치를 나타내는 주소가 포함되어 있습니다. 특히, 각 업체가 실제로 사용하고 있는 사용 연료의 구체적인 종류(예: 경유, 벙커C유, 등유 등)를 명시하여 에너지원 파악을 용이하게 합니다. 또한, 해당 업체에서 주로 생산하는 생산품(주요 제품) 정보를 통해 해당 산업 분야의 특성을 간접적으로 유추할 수 있습니다.가장 중요한 항목은 연간 사용량 데이터입니다. 이 정량적 정보는 해당 업체의 에너지 소비 규모를 정확히 파악하게 하며, 에너지 효율 개선 정책 수립, 탄소 배출량 관리 및 환경 규제 적용의 기초 자료로 활용됩니다. 이 데이터는 지역별 에너지 소비 패턴 분석, 미세먼지 등 대기 오염 물질 배출원 관리, 그리고 관련 산업의 정책적 지원 방안 마련에 중요한 근거 자료로 사용됩니다.'
