summary_user: 전국 국가지하수 관리측정망 측정소별로 채수일마다 pH, 염소이온, 질산성질소, 비소·카드뮴·수은·납 같은 중금속, 총대장균군, 벤젠·톨루엔 등 휘발성유기화합물, 다이아지논·파라티온 농약 성분의 수질검사 결과를 건별로 담은 CSV 파일(약 54만 바이트)이다. 연구자나 지하수 개발을 검토하는 사업자가 '우리 지역 측정소 지하수의 질산성질소나 비소 농도가 어느 수준이고 다른 지역과 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없으므로, 다른 지하수 수위·관정 데이터와는 측정소 이름을 맞춰 연결해야 한다.
description_portal: 전국의 국가지하수 관리측정망 수질정보에 대한 데이터로 측정소,구분,채수일,pH,염소이온,질산성질소,시안,비소,카드뮴,수은,납,크롬,총대장균군,페놀,벤젠,톨루엔,에틸벤젠,크실렌,1_1_1-트리클로로에탄,테트라클로로에틸렌,트리클로로에틸렌,다이아지논,파라티온,전기전도도 등 수질검사 결과를 제공합니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
