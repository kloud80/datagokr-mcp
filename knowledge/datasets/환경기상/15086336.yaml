summary_user: 경주시 관내 다중이용시설 가운데 실내공기질 관리대상에 해당하는 시설을 시설별 한 행으로 정리한 명단으로, 연번·시설명·주소만 담은 작은 CSV 파일(약 3.7KB)이다. 경주 시민이나 환경위생 담당자가 '우리 동네 어떤 시설이 실내공기질 관리대상인가'를 확인하거나 점검 대상 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 시설명 매칭으로만 이어 쓸 수 있다.
description_portal: 본 데이터는 경상북도 경주시 관내 다중이용시설 중 「실내공기질 관리법」에 따라 관리 대상에 해당하는 시설들의 현황을 정리한 파일 형태의 공공데이터이다. 실내공기질 관리대상 시설은 불특정 다수가 이용하는 장소로서, 일정 규모 이상의 면적이나 이용객 수를 기준으로 지정되며, 공기질 유지 기준 준수 의무가 부과된다. 데이터에는 연번, 주소, 시설명의 정보가 포함되어 있으며, 공기질 관리정책 수립, 실태 점검, 환경위생 관련 업무 등에 활용할 수 있다. 또한 환경보건 자료 구축, 주민 건강권 보장, 쾌적한 실내환경 조성을 위한 기초자료로도 유용하다. 경주시는 해당 데이터를 정기적으로 점검 및 갱신하여 정확성과 신뢰성을 확보하고 있으며, 관련 정보를 투명하게 공개하고 있다.
