description_portal: 본 데이터는 전라남도 목포시에 등록된 친환경 수소차량에 대한 현황을 제공합니다. 주요 제공 항목으로는 승용차, 승합차, 화물차, 특수차 등 차량 종류별 등록 대수이며, 수소 연료를 사용하는 차량만을 대상으로 합니다. 해당 정보는 친환경 차량 보급 현황을 파악하고, 지역 내 환경 정책 수립과 교통 관련 계획 수립에 활용됩니다. 또한 수소차 보급 확대 현황 분석과 지속 가능한 교통체계 구축을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 목포시민과 행정기관에 투명하고 신뢰성 있는 정보를 제공하고자 공공데이터 형태로 개방됩니다.
