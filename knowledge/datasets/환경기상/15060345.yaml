summary_user: 충청북도 단양군에 사업장폐기물 배출을 신고한 사업장을 건별로 담은 원장 파일로, 상호·사업자등록번호·신고일·폐기물 종류·운반자·처리업소·처리방법·도로명주소를 한 행씩 기록한다. 단양군의 어느 사업장이 어떤 폐기물을 어느 운반자·처리업체를 거쳐 어떤 방법으로 처리하는지 확인하려는 환경 담당자·분석가·처리업체가 쓴다. 사업자등록번호(bizno)를 키로 사업자 상태 조회나 폐기물 처리업 허가 현황 등 다른 사업자 단위 데이터와 잇고, 도로명주소로 위치 기반 자료와 맞춰 본다.
description_portal: 충청북도 단양군의 사업장폐기물배출자 신고현황을 정리한 데이터입니다. 폐기물구분, 상호, 사업자등록번호, 전화번호, 신고일, 폐기물 종류, 운반자, 처리업소명, 처리방법, 사업장도로명주소, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 사업장폐기물배출자 신고현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 17일입니다. 담당부서는 단양군청 농림환경국 환경과이며 문의주시면 최신의 충청북도 단양군 사업장폐기물배출자 신고현황을 열람하실 수 있게 도와드립니다.
