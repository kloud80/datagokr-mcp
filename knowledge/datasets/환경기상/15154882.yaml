description_portal: 본 데이터는 유아 기후환경교육관의 연도별 운영 현황과 지역별 교육 인원을 정리하여 제공하는 자료입니다.유아 기후환경교육관은 수준별·유형별로 전문화된 환경교육 서비스를 제공하는 유아 전용 환경교육 체험학습장으로, 현재 수도권·충북·전북 지역에서 운영되고 있습니다. 각 교육관은 유아 발달단계에 적합한 실내·외 체험형 시설을 갖추고 있으며, 누리과정과 연계한 다양한 체험 프로그램과 공통 프로그램을 제공하여 유아들의 환경 감수성과 기후·환경 인식을 높이는 데 중요한 역할을 하고 있습니다.본 데이터는 2010년부터 최근까지의 연도별 전체 교육인원, 그리고 수도권·충남권·충북권·전북권 등 지역별 교육인원을 함께 수록하여, 지역별 교육관 운영 규모와 환경교육 참여 현황을 종합적으로 파악할 수 있도록 구성되었습니다.
