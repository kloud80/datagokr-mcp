summary_user: 윈드프로파일러(연직바람관측장비)가 10분 주기로 관측한 고도별 바람 자료를 담으며, 저고도 모드(약 5km까지)와 고고도 모드(약 12km까지)로 나뉘고 범위는 전국이다. 기상 분석가나 항공·대기 연구자가 특정 시각 특정 지점 상공의 고도별 풍향·풍속이 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관측 자료(ASOS·고층 관측 등)와는 지점 이름이나 기상청 지점 코드를 맞춰 연결해야 한다.
description_portal: '연직바람관측장비(Wind Profiler Radar)는 초단파, 극초단파(UHF, 300~3000 ㎒) 전파빔을 상층대기로 송신하여 바람과 함께 이동하는 난류에서 산란되어 오는 전파신호를 수신해 바람을 관측합니다. 관측자료는 최대빔 송신거리값 차이에 따라 ULC와 UHC로 구분하고, 10분주기로 생성됩니다.※ ULC: lowmode(~약 5km), UHC: high mode(~약 12km)(참고) 연직바람관측은 극초단파(UHF)와 초단파(VHF)를 고층 대기로 발사하고 대기 난류에 의해 산란되어 되돌아오는 전파 신호를 분석하여 고도별 바람을 관측합니다. 연직방향과 15도만큼 기울어진 동서남북쪽 방향으로 발사된 빔은 각방향의 대기운동에 다라 도플러 편이가 된 전파신호로 수신됩니다.생산주기: 분(10분 주기)보유기간: 2004년 1월 ~ 현재(지점별 상이함)'
