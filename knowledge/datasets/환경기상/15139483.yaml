summary_user: 공항 6개소에서 항공기상관측지침에 따라 측정한 바람(풍향·풍속), 하늘상태, 시정, 강수량 등 공항 기상 관측 보고를 공항별 전문(METAR 메시지) 형태로 담는다. 항공 운항 관계자나 분석가가 특정 공항의 현재 바람·시정 상태가 이착륙에 영향을 줄 수준인지 확인하는 데 쓴다. 공항은 ICAO 공항 코드(icaoCode)와 공항명으로 식별되며 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 공항 코드·이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 외부 사이트 apihub.kma.go.kr의 별도 인증키(KEY 파라미터)가 필요하며 포털 활용신청과는 별개다. 공항 지점 단위 비공간 자료로 행정구역과 바로 연결되는 키가 없고, 관측값이 METAR 전문 문자열로 제공되어 요소별 값은 직접 해석해야 한다.
