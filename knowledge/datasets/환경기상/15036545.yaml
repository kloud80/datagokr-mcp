summary_user: 경기도 안산시 관내에서 실내공기질 관리 대상인 다중이용시설(의료기관, 보육시설, 노인요양시설, 대규모 점포, 실내주차장, 도서관, 영화상영관, 목욕장업 등)을 시설 한 곳당 한 행으로 담은 목록이며, 시설구분·시설명·도로명주소·데이터기준일자를 포함한다. 시민이나 분석가가 "우리 동네 어떤 도서관·병원·마트가 실내공기질 관리 대상인가"를 확인하거나, 시설유형별 관리 대상 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시설명이나 도로명주소(소재지도로명주소)를 맞춰 붙이거나 주소를 좌표로 바꿔 연결해야 한다.
limits: 이 자료는 관리 대상 시설 목록이라 실내 미세먼지·이산화탄소 같은 측정값이나 시간별 대기질은 담고 있지 않다. 다른 데이터와 붙일 공통 코드가 없어서 이름이나 주소로 매칭해야 하고, 표기가 다르면 연결이 어긋날 수 있다.
