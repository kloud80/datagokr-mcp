description_portal: 환경부 국립환경과학원의 환경영향평가 사업 중 악취 분야에 대한 조사 및 예측 속성정보와 조사지점에 대한 공간정보를 제공하는 서비스입니다.조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 악취 정보(복합악취, 암모니아, 메틸메르캅탄, 황화수소, 다이메틸설파이드, 다이메틸다이설파이드 등)를 포함하며, 예측속성은 운영 시 발생하는 복합악취, 암모니아, 메틸메르캅탄 등의 배출량 정보를 제공합니다.조사지점에 대한 공간정보는 WMS 및 WFS 형태로 제공되며, 사용자는 좌표체계, 반환 이미지 타입, 배경 이미지 포함 여부, 이미지 너비/높이 등의 설정을 통해 특정 좌표 기준의 악취 조사지점 포인트 이미지를 조회할 수 있습니다.
team:
  dept: 기후국토환경연구과
services:
  - op: /getPredict
    name: 예측속성조회
    endpoint: https://apis.data.go.kr/1480523/FoulsmellService/getPredict
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
      - name: type
        required: true
        desc: 응답받을 xml/json 타입
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getIvstgWMS
    name: 조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/FoulsmellService/getIvstgWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        desc: 좌표 체계를 나타냅니다. 현재 EPSG:5179 좌표계를 지원합니다.
      - name: format
        required: true
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        desc: 반환 이미지의 너비(픽셀)
      - name: height
        required: true
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getIvstg
    name: 조사속성조회
    endpoint: https://apis.data.go.kr/1480523/FoulsmellService/getIvstg
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: mgtNo
        required: true
        desc: 환경영향평가 사업코드
      - name: ivstgSpotNm
        required: true
        desc: 조사지점의 이름
      - name: type
        required: true
        desc: 응답받을 xml/json 타입
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getIvstgWFS
    name: 조사지점WFS조회
    endpoint: https://apis.data.go.kr/1480523/FoulsmellService/getIvstgWFS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srsName
        required: true
        example: EPSG:5179
        desc: 반환되어야 할 피처의 기하에 사용되어야 할 WFS가 지원하는 SRS
      - name: maxFeatures
        required: true
        example: '10'
        desc: 요청에 대한 응답으로 WFS가 반환해야하는 피처의 최대 값
      - name: resultType
        required: true
        example: results
        desc: 요청에 대하여 WFS가 어떻게 응답할 것인지 정의. results 값은 요청된 모든 피처를 포함하는 완전한 응답이 생성되어야 함을 나타내며, hits 값은 피처의 개수만이 반환되어야 함을 의미
      - name: bbox
        required: false
        example: 1121426.8305,1696106.0294,1131719.8740798137,1726390.3853996482
        desc: 좌표로 이루어진 사각형 안에 담겨 있는 (또는 부분적으로 걸쳐 있는) 피처를 검색. 좌표 순서는 사용되는 좌표 시스템을 따름.
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: true
