summary_user: 환경영향평가 사업 가운데 악취 분야의 조사지점별 측정값(복합악취·암모니아·황화수소 등)과 운영 시 예측 배출량, 조사지점의 공간정보(WMS·WFS)를 사업 단위로 담는 원천 데이터로, 범위는 전국이며 위치는 개별 주소·좌표로 나온다. 개발사업 주변 주민이나 분석가가 '이 사업 예정지 주변의 악취 현황은 어떻고, 운영하면 악취가 얼마나 늘어나는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업 관리번호(mgtNo)·조사지점명 같은 같은 기관의 코드나 이름·좌표 매칭으로만 잇고, 같은 환경영향평가 계열의 협의 현황·사업구역 데이터와 함께 쓴다.
limits: 필수 파라미터인 사업 관리번호·조사지점명·좌표범위 등은 다른 데이터에서 먼저 받아 넘겨야 하며, 최소 파라미터로 호출한 예측·조사·WMS 오퍼레이션 3개는 응답이 없었다. 평가 시점에 한 번 만들어진 뒤 바뀌지 않는 이벤트성 자료라 현재의 실시간 악취 측정값으로 쓰지 않는다.
