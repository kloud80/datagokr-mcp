summary_user: 성동구 안의 폐형광등·폐건전지 분리수거함 266곳을 관할주민센터, 도로명주소, 상세위치, 개수, 비고 항목으로 담은 지점별 목록 파일이다. 주민이 집 근처에서 폐형광등이나 폐건전지를 버릴 수거함이 어디인지 찾을 때, 또는 분석가가 동네별 수거함 분포를 볼 때 쓴다. 도로명주소(address)를 조인 키로 삼아 같은 주소 체계의 다른 생활폐기물 배출·수거 지점 파일과 이어 쓰며, 좌표 필드는 없다.
description_portal: 서울특별시 성동구 폐형광등·폐건전지 분리수거함 현황 데이터는 생활 속에서 발생하는 유해 폐기물의 안전한 수거와 재활용을 위해 설치된 분리수거함의 위치와 운영 정보를 제공하는 공공데이터입니다. 데이터에는 관할주민센터, 도로명주소, 상세위치, 개수, 비고 항목이 포함되어 있어 각 수거함의 관리 주체와 정확한 위치, 설치 규모를 확인할 수 있습니다. 이를 통해 주민들은 가까운 수거함 위치를 쉽게 파악하여 생활폐기물을 올바르게 배출할 수 있고, 행정기관은 설치 현황을 기반으로 수거 효율성을 높이고 환경오염 방지 정책을 추진할 수 있습니다. 또한 연구자와 환경 관련 기관은 데이터 분석을 통해 자원 재활용률 제고, 수거 인프라 최적화, 환경 정책 개선 등에 활용할 수 있습니다. 본 데이터는 성동구 내 환경 안전 관리와 지속 가능한 자원순환 체계를 지원하는 중요한 기초 자료입니다.
