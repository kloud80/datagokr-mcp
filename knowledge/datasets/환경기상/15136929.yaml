description_portal: 해양환경공단이 수행한 해양수질 환경평가 결과와 조사정점의 공간정보를 제공합니다. 본 데이터는 전국 연안 및 주요 해역의 수질조사 결과를 기반으로 환경평가 등급(우수, 양호, 보통, 나쁨 등)을 산정하고, 이에 해당하는 조사정점의 좌표, 명칭, 위치정보를 포함합니다. 수질 항목은 용존산소(DO), 영양염류, 부유물질(SS), 클로로필-a 등이며, 정점별 수질 특성과 등급 결과를 시각적 공간정보와 함께 제공합니다. 데이터는 해양환경 변화 모니터링, 오염원 추적, 수질 등급 비교분석, 정책 수립 등에 활용됩니다. 자료는 속성정보와 공간좌표를 포함한 통계 및 GIS 데이터 형식으로 제공되며, 공공기관, 연구기관, 지자체 등에서 폭넓게 사용됩니다.
