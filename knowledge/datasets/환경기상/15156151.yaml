description_portal: 해당 데이터는 서울시 자치구별 유해야생동물 신고 현황 데이터입니다. 데이터를 통해 지역별 유해야생동물 출현 빈도와 계절적·환경적 요인을 파악할 수 있으며, 도시 안전 관리, 피해 예방 정책 수립, 생태 환경 변화 모니터링에 활용할 수 있습니다.※ 야생생물법 시행규칙 [별표3]의 유해야생동물 목록 중 서울 도심환경에 해당되는 유해야생동물종은 4. 멧돼지, 7. 집비둘기에 한함.※ 집비둘기 민원신고 현황의 2022년 동대문구는 자료 없음※ 멧돼지 민원신고 현황에 언급되지 않은 자치구는 멧돼지 출현이 없음(단, 강북구의 경우 멧돼지 출현이 매년 있으나 2024년은 서울시에 데이터 부정확하여 데이터 불포함)
