description_portal: '은평구의 공중이 이용하는 건축물·시설물등의 청결유지와 실내공기정화를 위한 청소 등을 대행하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 건축물의 청소, 소독 등 위생적인 유지·관리를 전문적으로 대행하는 건물위생관리업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등), 그리고 법적 기준에 따른 장비 및 인력 보유 현황 등 공중보건 및 위생 관리를 위한 핵심 정보가 포함되어 있습니다 .이 데이터를 통해 다중이용시설이나 대형 빌딩의 관리 주체는 법적 요건을 갖춘 신뢰할 수 있는 위생관리업체를 확인하고 선정할 수 있습니다. 또한, 지자체는 이를 기반으로 관내 업체를 체계적으로 관리·감독하여 공중이용시설의 청결과 위생 수준을 유지하고, 감염병 예방 등 쾌적하고 안전한 도시 환경을 조성하는 정책을 수립하는 데 필수적인 기초 자료로 활용합니다.'
