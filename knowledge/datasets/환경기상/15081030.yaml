summary_user: 인천광역시 제물포구(옛 동구) 안 사업장폐기물 배출업소 신고 내역을 업소 한 곳당 한 행으로 담은 파일 데이터로, 폐기물 구분·상호·폐기물 종류·연락처·도로명 주소·신고 기준연도를 기록하며 포털 설명상 2021.04.30 기준이다. 구청 환경 담당자나 지역 분석가가 '우리 구에서 어떤 종류의 사업장폐기물을 어느 업소가 어디서 신고했나'를 확인하거나 점검 대상을 추릴 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 상호명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 동구 내 사업장에서 배출되는 사업장폐기물의 신고 현황(2021.04.30 기준)을 기록한 자료이다. 각 신고 건에 대해 순번, 폐기물 구분, 업소 상호, 배출된 폐기물의 종류, 연락처, 사업장 주소, 신고 기준 연도, 데이터 기준일자 등의 항목으로 구성되어 있다. 이를 통해 지역 내 폐기물 발생 업소의 분포와 신고 현황을 파악할 수 있으며, 적정한 폐기물 관리 및 행정 조치의 기초자료로 활용된다. 특히 폐기물 종류 및 업소 소재지 정보를 통해 업종별 또는 지역별 폐기물 특성을 분석할 수 있고, 환경관리 강화 및 민원 대응의 기반 정보로도 유용하다. 본 자료는 환경정책 수립, 위반 업소 점검, 자원순환 체계 구축 등 다양한 행정목적에 활용된다. 또한 폐기물 배출의 투명성과 관리체계 강화를 위한 기초정보로 기능할 수 있다.
