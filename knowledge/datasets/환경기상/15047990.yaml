summary_user: 부산광역시 금정구 관내에 신고된 석면해체·제거 작업을 현장 한 건씩 담은 파일로, 공사현장명·소재지·해체작업 시작일과 종료일·석면함유 자재 면적(제곱미터)·해체제거업체명을 담는다. 금정구 주민이 우리 동네 근처에서 언제 석면 철거 공사가 진행되는지, 어느 업체가 맡았는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소를 지오코딩하거나 업체명을 이름으로 맞춰 다른 시군구 석면해체 신고내역이나 석면해체제거업체 현황과 이어 쓴다.
description_portal: 부산광역시 금정구 관내 석면해체제거작업 신고내역 현황에 대한 데이터입니다. 관내 신고된 석면해체제거작업장 작업장명, 소재지, 작업기간, 해체제거업체 등의 정보를  제공합니다.석면은 과거 건축자재 등에 널리 사용되었으나 현재는 사용이 금지되었으며 폐로 흡입될 경우 폐암 등 심각한 건강 피해를 유발하는 물질입니다.최근 석면에 대한 관심과 우려가 높아지는 만큼 석면해체제거작업에 대한 정보를 투명하게 공개함으로써 주민 건강 보호와 환경오염 방지에 중요한 기여하고자 합니다.
