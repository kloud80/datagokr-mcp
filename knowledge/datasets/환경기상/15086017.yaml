summary_user: 인천 미추홀구에서 생활폐기물 수집·운반을 대행하는 업체를 한 업체당 한 행으로 담은 원천 목록으로, 업체명·도로명주소·허가일자·청소구역·전화번호가 들어 있고 파일 크기는 658바이트에 불과한 소규모 자료다. 미추홀구 주민이 우리 동네 쓰레기 수거를 어느 업체가 맡는지 확인하고 연락처를 찾을 때나, 분석가가 구 내 청소구역 배분을 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명주소, 청소구역(동 이름) 같은 이름 매칭으로만 잇는다.
limits: 미추홀구 한 곳만 다루므로 다른 시군구와 비교하려면 각 지자체 자료를 따로 모아야 한다. 사업자번호 같은 공통 키가 없어 폐기물 처리업 허가 원장 등과 정확히 연결되지 않는다. 생활폐기물 발생량·처리 실적 같은 통계는 담지 않는다.
