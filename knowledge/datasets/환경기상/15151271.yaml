description_portal: 이 데이터셋은 오디오 및 비디오 플레이어 기기의 이미지를 대상으로 한 AI 학습용 데이터입니다. 총 200장의 이미지와 동일 개수인 200개의 라벨링 텍스트 파일로 구성되어 있습니다. 각 이미지는 다양한 모델의 오디오/비디오 플레이어를 실내 환경에서 촬영한 것이며, 전면, 측면, 조작부, 출력부 등 기기의 주요 구성 요소가 명확하게 식별됩니다. 이미지 파일은 ‘images’ 폴더에, 라벨링 파일은 ‘labels’ 폴더에 저장되어 있으며, 라벨링은 YOLO 형식으로 기기의 위치와 클래스명이 기록되어 있습니다. 데이터는 객체 인식 및 분류를 위한 학습 모델 개발에 적합하도록 구성되었습니다.
