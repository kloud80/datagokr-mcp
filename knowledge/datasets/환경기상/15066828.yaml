description_portal: 청주시 건물위생관리업소 현황 데이터는 연번, 업소명, 영업소 주소(도로), 영업소 주소(지번), 영업소 전화, 데이터 기준일 총 5개항목(연번 제외)을 제공하고 있습니다. 건물위생관리업소는 공공 건물이나 시설의 청결 유지 및 실내 공기 정화를 위한 청소대행 서비스를 제공하는 곳을 말합니다. 이러한 업소는 공중위생관리법의 적용을 받으며, 시장,군,구청장에게 영업신고를 해야됩니다. 건물위생관리업은 위생관리업에서 명칭이 변경된 것으로 2017년부터 건물위생관리업으로 통칭됩니다. 청주시의 경우는 건물위생관리업 영업신고는 구청 환경위생과에 관련서류를 구비하여 제출하시면 됩니다.
