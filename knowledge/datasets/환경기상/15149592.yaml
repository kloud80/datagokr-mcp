description_portal: 본 데이터는 국립생태원이 수행한 연구활동의 결과로 발간된 전문서적(단행본, 전문해설서, 보고서 등)의 정보를 수록한 것입니다. 생태계, 생물다양성, 환경보전, 기후변화 등 다양한 분야의 전문 지식을 체계화하여 출판한 서적 정보를 포함하며, 서명, 발간연도, ISBN 등 주요 메타데이터를 관리합니다.이 데이터는 연구성과 기반 지식자료(전문서적) 체계적 관리, 정책·행정·교육 분야의 생태자료 활용 지원 및 기반 마련, 기관 연구성과의 정량적 성과관리 및 대외 홍보, 대국민 정보공개 및 자료 서비스 기반 제공을 위한 핵심 자료로 활용됩니다.
