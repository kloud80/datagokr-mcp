summary_user: 서울 시내에 설치된 대기오염 안내 전광판을 한 대씩 담은 위치 목록으로, 자치구(GU_NM)·설치위치·표출내용과 위도·경도 좌표를 담는다. 시민이나 분석가가 '우리 동네 어디에 대기오염 전광판이 있고 무엇을 보여주는가', '전광판이 없는 자치구나 지역은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 자치구 이름으로 다른 서울시 자치구별 자료와 맞추거나, 좌표로 지도·대기측정소 위치와 공간 결합해 쓴다.
description_portal: 서울시 대기오염전광판 위치정보 데이터는 서울 전역에 설치된 대기오염 안내 전광판의 공간적 분포와 특성을 파악할 수 있도록 정리한 자료입니다. 구별 항목을 통해 각 전광판이 어느 자치구에 설치되어 있는지 확인할 수 있으며, 설치위치는 도로변, 광장, 주요 교차로 등 구체적인 위치 정보를 제공해 현장 중심의 대기질 안내 체계를 이해하는 데 도움을 줍니다. 표출내용 항목은 전광판에 표시되는 대기오염 관련 정보의 종류와 성격을 나타내어, 시민에게 어떤 형태로 환경 정보가 제공되는지를 알 수 있습니다. 위치좌표는 위도와 경도 값으로 제공되어 지도 서비스, 내비게이션, 공간분석 시스템 등과 연계 활용이 가능하며, 전광판 배치의 적정성 평가나 미설치 지역 도출 등 정책적 분석에도 유용합니다. 이 데이터는 대기환경 정보 전달 체계의 공간적 형평성과 접근성을 검토하고, 환경정보 인프라 확충 계획을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다.
