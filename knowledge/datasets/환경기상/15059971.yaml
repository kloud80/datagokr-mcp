summary_user: 해양수질자동측정망 중 하구 및 만 지역의 조사정점을 정점 코드·한글 명칭·해역 코드와 명칭·경위도 좌표로 담은 정점 목록 API로, 전체 7건이 전국 범위로 제공된다. 분석가나 연구자가 하구·만 수질 자료를 볼 때 어느 위치에 어떤 정점이 있는지 확인하는 데 쓴다. 경위도(lon, lat) 좌표 키로 다른 좌표 기반 데이터와 이어 쓰며, 해역 코드(oceanCode)로 해역별로 묶어 볼 수 있다.
description_portal: 이 데이터는 해양환경공단이 운영하는 해양수질자동측정망 중 하구 및 만 지역에 설정된 조사정점 정보를 조회할 수 있도록 제공되는 공공데이터 API 서비스이다. 이용자는 각 정점의 코드, 명칭, 경위도 좌표 등 기본 공간 정보를 확인할 수 있으며, 해당 정점이 속한 해역 구분과 관리 단위에 대한 구조화된 정보를 함께 조회할 수 있다. 하구 및 만 지역은 담수 유입, 조석 영향, 오염물질 농도 변화 등 환경 특성이 복합적으로 작용하는 구간으로, 정점 정보는 이후 수질자료 분석과 지역별 비교 평가에 필수적인 기초 자료로 활용된다. 또한 정점별 측정 가능 항목, 장비 설치 현황, 운영 주기 등 관측 특성을 제공하여 이용자가 자료 해석과 활용 계획을 체계적으로 수립할 수 있도록 지원하는 서비스이다.
