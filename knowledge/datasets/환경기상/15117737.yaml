description_portal: 이 테이블은 한국환경공단의 층간소음 이웃사이서비스 상담관리 센터에 접수된 현장진단 요청 건에 대한 연도별·지역별 접수 현황을 정리한 자료입니다. 민원인이 접수한 층간소음 상담 중 현장진단이 필요한 것으로 판단된 사례에 대해 실제로 접수된 건수를 기준으로 구성되어 있으며, 각 건은 신청자의 주소지를 기준으로 ‘지역’ 및 ‘시군구’ 단위로 구분됩니다.표는 접수 연도에 따라 데이터를 나누고 있으며, 2020년, 2021년, 그리고 2022년의 경우 10월 6일 기준까지의 접수 현황이 수록되어 있습니다. 이는 매년 누적 접수 건수를 기준으로 하되, 2022년 데이터는 해당 시점까지의 중간 집계 결과를 반영하고 있습니다.
