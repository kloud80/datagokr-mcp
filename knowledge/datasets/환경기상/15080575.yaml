summary_user: 충청남도 금산군에 대기배출시설을 설치·신고한 사업장을 한 행에 한 곳씩 담은 사업장 단위 목록으로, 사업장명·대표자·소재지·대표업종·사업장 종별(종)과 데이터 기준일자를 담는다. 군 환경 담당자나 분석가가 금산군 안 어느 지역에 어떤 업종·종별의 대기오염물질 배출사업장이 모여 있는지 파악하고 점검·관리 계획을 세우는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명·소재지 주소를 맞추거나 같은 기관(금산군) 자료끼리 이어 쓴다.
limits: 사업장 목록(인허가 원장 성격)이라 배출량·굴뚝 TMS 측정값 같은 실제 배출 수치는 담지 않는다. 공통 조인 키가 없어 다른 기관 데이터와 연결할 때 사업장명·주소 문자열 매칭에 의존해야 하며, 범위는 금산군 한 시군구로 한정된다.
