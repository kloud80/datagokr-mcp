summary_user: 경기도 내 기초환경교육센터를 센터 한 곳당 한 행으로 담은 현황 목록으로, 시군명·구분·지정기간·운영기관명·홈페이지와 도로명·지번 주소, 우편번호, 위도·경도 좌표를 포함한다. 주민이나 교육 담당자가 '우리 시군에 지정된 환경교육센터는 어디이고 운영기관과 지정기간은 언제까지인가'를 확인하거나, 분석가가 센터의 공간 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어서 시군명·기관명 같은 이름을 맞추거나 좌표(refine_wgs84_lat·logt)로 다른 시설 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 기초환경교육센터의 현황을 담고 있으며, 각 센터의 시군명, 구분, 지정기간, 지역명, 기관명, 홈페이지, 도로명 및 지번주소, 우편번호, 위도/경도 좌표 등의 정보를 포함하고 있습니다. 환경교육센터는 지역 단위의 환경교육 거점으로서 시민 환경의식 제고와 지속가능한 사회 형성을 위한 교육 프로그램을 운영합니다. 본 데이터는 센터별 운영주체와 지정기간을 확인할 수 있어 환경교육 정책의 실행 현황을 파악하는 데 활용되며, 위치정보는 지역별 접근성과 공간 분포 분석에 유리합니다. 또한 기관별 홈페이지 주소가 제공되어 정보 탐색이 용이하며, 환경 관련 네트워크 구축 및 지역 교육 자원 활용에도 활용될 수 있는 기초자료입니다.
