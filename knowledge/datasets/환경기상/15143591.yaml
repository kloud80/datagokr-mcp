description_portal: 해양침적폐기물 실시설계는 연근해 주요 해역에 침전된 쓰레기 및 오염 퇴적물의 분포, 종류, 양, 해양환경에 미치는 영향을 파악하는 사업입니다. 실시설계를 통해 해양침적폐기물의 정화 작업이 필요한 항만, 해역 등을 선별하고 정화 사업을 수행하게 됩니다. 해양침적폐기물 실시설계 서비스는 사업대상지역명, 실시설계사업구분명, 실시설계사업명, 사업시작일자, 사업종료일자를 검색 조건으로 사용하여 사업대상지역명, 실시설계사업명, 실시설계사업구분명, 사업시작일자, 사업종료일자, 설계량, 설계면적 데이터를 조회합니다.
