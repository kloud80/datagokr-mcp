summary_user: 연근해 항만·해역에서 추진된 해양침적폐기물 실시설계 사업을 사업별로 담으며, 사업대상지역명·사업명·사업구분·사업 시작·종료일자와 설계량·설계면적을 제공한다. 지자체 담당자나 해양환경 분석가가 '특정 항만에서 침적폐기물 정화 설계가 언제, 어느 규모로 이뤄졌나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양쓰레기·정화사업 데이터와는 사업대상지역명이나 사업명 같은 이름을 맞춰서만 이어 쓸 수 있다.
limits: 좌표 없이 지역명만 있는 비공간 데이터라 지도 위 정확한 위치나 폐기물 종류별 분포는 알 수 없다. 사업이 생길 때 만들어진 뒤 바뀌지 않는 이벤트성 기록이라 정기 갱신을 기대하기 어렵다. 다른 데이터와 연결할 때는 지역명 표기를 직접 맞춰야 한다.
