description_portal: 본 데이터는 경상북도 경주시 관내에서 벙커C유를 연료로 사용하는 사업장의 현황을 정리한 파일 형태의 공공데이터이다. 벙커C유는 주로 산업용 보일러, 발전기 등에 사용되는 중질유로, 연소 시 대기오염물질이 다량 발생할 수 있어 환경 관리 차원에서의 지속적인 점검이 필요하다. 본 데이터에는 사업장명, 대표자 성명, 소재지, 사용 용도, 허가 여부, 관리번호, 연료 사용량 등의 항목이 포함되어 있으며, 에너지 사용 현황과 오염물질 배출 감시, 환경 행정 대응 기반 자료로 활용될 수 있다. 또한 온실가스 저감 대책 수립, 에너지 소비 구조 분석, 환경 영향 평가, 지역 내 유해물질 관리 등 행정과 연구 목적에 유용하게 적용 가능하다. 본 자료는 경주시에서 정기적으로 갱신하며, 지역의 환경 개선과 에너지 정책 수립을 위한 참고자료로 제공된다.
