summary_user: 부산시 구·군별로 실내 공기질 관리 대상인 다중이용시설을 시설 한 곳씩 담은 목록으로, 구군명·시설 구분·시설명·관리기관·소재지 주소와 위경도 좌표를 포함한다. 시민이나 분석가가 '우리 구에서 실내 공기질 관리 대상인 시설은 어디이고 어떤 유형인가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 구군명·시설명 같은 이름 매칭이나 주소·좌표 기반 공간 결합으로 다른 데이터와 잇는다.
description_portal: 부산시에 위치한 다중이용시설 실내 공기질 관리 대상 데이터를 개방합니다.실내 공기질은 건물 내부 공간에서 사람이 호흡하게 되는 공기의 청정도 및 오염 정도를 의미합니다. 실내 공기질은 우리의 건강, 집중력, 수면, 전반적인 삶의 질에 직접적인 영향을 미치며, 특히 실내에서 많은 시간을 보내는 현대인에게 매우 중요한 환경 요소입니다.실내 공기의 오염원인은 외부유입(자동차 배기가스, 미세먼지 등), 건축자재 및 가구, 생활활동에 따른 오염 등이 있습니다.개방되는 데이터에는 구군명, 대상시설 구분, 시설명, 소재지 등의 데이터 있습니다.
