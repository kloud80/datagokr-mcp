description_portal: '물환경보전법 제61조, 시행령 제78조, 시행규칙 제89조에 따라 골프장의 맹독성, 고독성 농약 사용여부를 확인하기 위해 반기별로 농약 잔류량을 조사한 분석결과입니다.골프장 농약사용량 조사 및 농약잔류량 검사방법 등에 관한 규정(환경부고시)에 따라 골프장 농약 잔류량을 조사하여 농약 안전사용을 유도하기 위하여 년2회 잔류량 검사를 시행합니다.*골프장 토양(그린, 페어웨이)과 수질(유출구, 연못)의 농약 항목별(27개) 검출농도를 제공합니다.-그린 ,페어웨이 : mg/kg, 유출구, 연못 : mg/L-토양시료 채취 지점수: 홀수에 따라 골프장별 4지점~18지점 이상-수질시료 채취 지점수: 골프장별 3지점 이상'
