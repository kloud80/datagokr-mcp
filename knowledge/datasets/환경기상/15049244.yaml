description_portal: 대기환경보전법에서 대기오염물질은 아황산가스, 일산화탄소, 이산화질소, 오존 등 가스상물질과 미세먼지와 같은 먼지 등 입자상물질을 포함한 총 64종으로 정하고 있다. 국립환경과학원 대기환경연구부 대기환경연구과에서는 대기환경보전법에 따라 대기환경측정망의 도시대기측정망, 도로변대기측정망, 교외대기측정망, 국가배경측정망 등을 운영하며 이산화황 (SO2), 이산화질소 (NO2), 오존 (O3), 일산화탄소 (CO), 미세먼지 (PM-10), 초미세먼지 (PM-25) 를 측정하여 지역별, 항목별, 시간대별 데이터를 공개하고 있다.대기환경측정망 데이터는 측정소별 시간별 데이터로 공개되며, 도시대기 기준으로 17개 시도에 약 500개 이상의 측정소가 설치되어있다.
