summary_user: 순천시에서 특정토양오염관리대상 시설의 정기 토양오염도 검사 결과 우려기준 등을 넘겨 부적합 판정을 받은 업체를 사업장별로 담은 원천 목록이며, 소재지·사업장명·초과항목·오염도·최고농도·오염면적·오염량·조치명령일·정화명령기한 등을 담는다(파일 크기 465바이트의 소규모 CSV). 순천 주민이나 부동산·환경 분석가가 "우리 동네 어느 사업장(주유소 등)이 토양오염 기준을 초과했고 정화명령 기한은 언제인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 사업장명을 맞춰 연결하거나 같은 기관(순천시) 단위로만 묶어 쓴다.
description_portal: '전라남도 순천시 특정토양오염도 부적합업체 현황에 대한 데이터로 소재지, 사업장명, 초과항목, 오염도 등의 항목을 제공합니다.이 데이터는 전라남도 순천시 특정토양오염도 부적합업체 현황 데이터입니다. 토양환경보전법 제10조의4에 따라 특정토양오염관리대상 시설의 소유자 또는 점유자가 정기적으로 토양오염도를 검사하고 그 결과를 시장·군수·구청장에게 제출해야 합니다. 본 데이터셋은 이 검사 결과, 토양오염 우려 기준 또는 대책 기준을 초과하여 부적합 판정을 받은 순천시 내의 업체 정보를 담고 있습니다. 주요 내용은 해당 업체의 명칭, 주소, 토양오염 부적합 항목(예: 벤젠, 톨루엔, 총석유계탄화수소 등) 등을 제공합니다. 이 정보는 순천시의 토양 환경 관리 및 시민들의 환경 안전을 위한 중요한 자료로 활용될 수 있습니다.'
