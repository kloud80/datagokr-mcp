summary_user: "충청남도 논산시에서 구조된 야생동물을 접수 건별로 기록한 원천 자료로, 동물 종명과 분류(강·목·과), 천연기념물·멸종위기 등급, 구조 일시와 위치 좌표, 발생 원인, 구조 결과와 방생 위치, 최종 진단을 담는다. 분석가나 지자체 담당자가 '논산시에서 어떤 종이 어떤 원인(예: 교통사고)으로 언제 어디서 많이 구조되고, 그중 방생·폐사 비율은 얼마인가'를 따지는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 종명 매핑이나 구조·방생 위경도 좌표를 이용한 공간 결합으로 잇는다."
limits: 표준 행정코드나 종 코드 같은 전역 조인 키가 없어 다른 시군 구조 데이터나 종 분포 자료와 바로 결합되지 않고, 종명·좌표 기준으로 맞춰야 한다. 범위는 논산시 한 곳의 개별 구조 건이므로 충청남도 전체나 다른 지역 현황은 이 파일만으로 알 수 없다.
