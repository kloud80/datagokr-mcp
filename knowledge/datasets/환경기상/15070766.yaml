summary_user: 환경교육사 양성과정의 과정명(3급·2급 등), 운영기관, 접수·교육 기간, 선발인원, 차수를 과정 단위로 담은 전국 범위의 작은 CSV 파일(약 5.4KB)이다. 환경교육사 자격을 준비하는 사람이 '이번 차수 2급 과정은 어느 기관에서 언제 접수하고 몇 명을 뽑는가'를 확인하거나, 분석가가 기관별 양성 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운영기관 이름 매핑으로만 이어 쓴다.
description_portal: 환경교육사 양성기관을 통해 상·하반기로 양성과정을 운영하며,  수강생은 양성과정을 수강한 후, 필기 및 실기 평가에 합격하면 자격증(2급 또는 3급)을 취득할 수 있다.보수교육은 학교, 사회환경교육기관, 환경교육사 양성기관, 국가 및 지역 환경교육센터 등에서 종사하는 환경교육사가 3년마다 7시간을 의무 이수해야 하는 과정으로, 환경교육사 양성기관에서 수강이 가능하다.해당 데이터는 환경교육사 양성과정명(3급 과정, 2급 과정 등), 운영기관명, 접수 및 교육기간, 선발인원, 보수교육 등에 대한 데이터를 취급한다.
