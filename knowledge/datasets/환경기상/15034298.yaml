summary_user: 경상남도 진주시 관내에서 일정 기준 이상의 음식물쓰레기를 배출하는 다량배출사업장을 업소 한 곳당 한 행으로 담은 목록 파일로, 업종명·업소명·도로명 소재지·우편번호·행정동명이 들어 있다. 시청 담당자나 분석가가 "진주시 어느 동에 어떤 업종의 음식물쓰레기 다량배출사업장이 몰려 있는가"를 파악해 지도·점검 대상을 고르거나 감량 정책 대상을 정할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 업소명·도로명 주소나 행정동명을 맞춰 붙이거나 같은 진주시의 다른 폐기물 파일과 나란히 놓고 써야 한다.
limits: 사업장별 배출량이나 처리 실적 같은 발생량·처리 통계는 들어 있지 않고, 범위가 진주시 한 곳뿐이라 다른 시군과 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 코드 키가 없으므로 다른 데이터와 붙일 때 주소·업소명 표기 차이 때문에 매칭이 어긋날 수 있다.
