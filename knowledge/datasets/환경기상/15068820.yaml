description_portal: 본 데이터는 「대기환경보전법」 제17조에 따라 매년 실시되는 대기배출원조사 결과를 바탕으로, 전국 대기오염물질 배출사업장의 현황 정보를 제공합니다.이 조사는 시도 및 시군구 단위의 사업장 별로 수행되며, 대기오염물질(먼지, 질소산화물, 황산화물)의 연간 발생량을 기준으로 사업장을 1종, 2종, 3종으로 구분하여 조사합니다.매년 조사된 데이터는 검증과정을 거치며, 2023년도의 대기배출원조사 결과를 바탕으로 작성된 자료 입니다.＊1종 사업장은 대규모 배출사업장으로, 대기오염물질 발생량이 80톤 이상인 사업장＊2종 사업장은 연간 대기오염물질 배출량이 20톤 이상 80톤 미만인 사업장＊3종 사업장은 연간 대기오염물질 발생량이 10톤 이상 20톤 미만인 사업장
