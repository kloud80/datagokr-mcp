summary_user: 환경표지인증이 해지되거나 취소된 제품을 제품 단위로 담은 전국 범위의 건별 목록으로, 인증번호·인증기업명·제품명·용도·대상제품군과 인증 시작·종료일, 해지/취소일을 담는다. 공공구매 담당자나 소비자가 특정 제품이나 업체의 환경표지가 아직 유효한지, 언제 해지·취소됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 환경표지 인증제품 목록 등과는 환경표지인증번호(prodRsid)나 인증기업명·제품명 같은 이름 매핑으로만 연결한다.
description_portal: 환경표지인증 관련 인증제품명, 인증기간, 인증제품 용도, 인증번호, 인증기업명, 인증해지 또는 취소일, 해지제품조회, 취소제품조회 등 인증제품에 대한 정보를 제공합니다. (환경표지인증이란? 환경표지제도는 「환경기술 및 환경산업 지원법」 제17조(환경표지의 인증)에 근거해 국가(기후에너지환경부)가 시행하는 인증제도로서 1992년 4월 첫 출범 이래 제품 전과정에서의 종합적 환경성뿐만 아니라 품질․성능이 우수한 친환경 제품(서비스 포함)을 선별하여 환경표지를 인증하고 있습니다. 환경표지제도는 동일 용도의 제품·서비스 가운데 전과정 각 단계에 걸쳐 에너지 및 자원의 소비를 줄이고 오염물질의 발생을 최소화 할 수 있는 친환경 제품을 선별해 정해진 형태의 로고(환경표지)와 간단한 설명을 표시토록 하는 자발적 인증제도입니다.)
