description_portal: 해양환경공단이 수행한 제2기 해양쓰레기 모니터링 조사사업의 지역별 통계 정보를 제공합니다. 본 데이터는 전국 연안 및 도서지역을 대상으로 동일한 기준과 방법론으로 실시된 해양쓰레기 분포 조사 결과를 담고 있으며, 조사지점별 쓰레기 발생량, 유형, 면적당 밀도 등을 포함합니다. 제2기 조사는 국제기준과 국내 실정을 반영한 표준화된 절차에 따라 수행되었으며, 지역 간 비교와 시계열 분석이 가능합니다. 주요 쓰레기 유형은 플라스틱, 폐어구, 생활쓰레기 등으로 분류되며, 자료는 정책 수립, 정화 우선순위 설정, 연구 분석 등에 활용됩니다. 데이터는 통계표 형태로 제공되며, 해양쓰레기 관리정책의 과학적 기초자료로 제공됩니다.
