summary_user: 광주광역시가 설치·운영하다 사용을 끝내거나 폐쇄한 비위생 사용종료매립지를 매립장 한 곳당 한 행으로 담은 파일(약 4.7KB의 소규모 csv)로, 지번주소·매립 시작·종료 시기·면적(천㎡)·매립량(천톤)·현재 토지이용실태를 담는다. 주민이나 개발·부동산 분석가가 '이 땅 아래에 옛 쓰레기 매립지가 있었는가, 지금은 어떤 용도로 쓰이는가'를 확인하거나, 환경 담당자가 안정화·사후관리 대상지를 파악하는 데 쓴다. 전역 조인 키는 없으므로 소재지지번주소(현지번은 비고 칸)를 주소 매칭하거나 지오코딩해 지적·토지이용·토양오염 자료와 공간적으로 겹쳐 쓴다.
description_portal: 광주광역시에서 설치 운영한 후 사용종료 또는 폐쇄된 비위생 사용종료매립지 현황입니다. 위치(소재지지번주소), 매립기간, 면적, 매립량, 토지이용실태 등의 내용을 제공합니다.사용종료매립지란 폐기물관리법의 적용을 받지 아니하고 설치되어 사용이 종료되거나 폐쇄된 매립지를 말한다.매립지 안정화란 매립된 폐기물이 장기간에 걸쳐 물리,화학적,생물학적 분해 작용을 받아 유기물은 분해되어 가스화되거나 침출수로 배출되고, 무기물과 중금속류는 용탈되어 최종적으로 침출수로 배출되면서 매립지반이 침하되고 최정적으로 토양과 같은 상태로 환원되는 것을 말한다.
