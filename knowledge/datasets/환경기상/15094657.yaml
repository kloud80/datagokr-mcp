description_portal: '다량배출사업장 정의: 음식물쓰레기를 다량으로 배출하는 사업장으로서 음식물류 폐기물의 발생 억제와 적정한 처리를 위하여 노력하고 법적 준수사항을 지켜야 하는 사업장다량배출사업장의 범위-1일 평균 총 급식인원 100명 이상인 집단급식소 (사회복지시설의 집단급식소 제외)-사업장 규모가 200㎡ 이상인 휴게음식점 및 일반음식점 (단, 음식물류의 조리·판매를 하지 아니하는 다류(茶類), 아이스크림류 등의 영업의 경우 제외)-대규모점포, 농수산물도매시장·농수산물공판장·농수산물종합유통센터, 관광숙박업충청남도 아산시 내 음식물쓰레기 다량배출사업장 정보로 업종, 상호, 전화번호, 주소를 포함하며 오픈데이터 파일포맷(CSV.)형태로 제공합니다.'
