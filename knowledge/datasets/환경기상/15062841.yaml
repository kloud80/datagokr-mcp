summary_user: 전라남도 시군별 폐기물 소각시설의 소재지, 설치년도, 1일 처리규모(톤), 가동방식, 운영 주체를 시설 1건당 한 행으로 담은 소규모 현황 파일(csv 약 2.7KB)이다. 지역 주민이나 분석가가 '우리 시군에 소각시설이 있는지, 하루 몇 톤 규모이고 언제 지어졌는지'를 확인할 때 쓴다. 전역 조인 키가 없어 시군 이름이나 소재지 주소를 기준으로 다른 시군구 단위 폐기물·환경 데이터와 매핑해 잇는다.
description_portal: '- 전라남도 폐기물 소각 시설현황(소재지, 설치년도, 운영, 규모, 가동방식  등)에 관한 데이터를 제공하고 있습니다.- 전라남도에는 폐기물 소각시설이 여러 곳에 위치해 있으며, 각 시설은 지역별로 폐기물 처리와 환경 보호를 담당하고 있습니다.- 전라남도의 폐기물 소각시설은 지역 주민들의 생활 환경 보호와 폐기물 자원화를 위해 중요한 역할을 하고 있습니다.- "소각시설"은 폐기물 처리 방식 중 하나로, 가연성 폐기물을 고온에서 연소시켜 부피를 줄이고, 감염이나 악취 등을 방지하는 설비입니다. - 목적 : 생활폐기물, 의료폐기물, 산업폐기물 등을 위생적으로 처리하여 2차 오염을 방지하고 에너지를 회수함'
