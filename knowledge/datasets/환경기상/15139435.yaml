summary_user: 기상청 황사관측 지점(강화·고산·관악산·백령도 등)의 부유분진측정기로 잰 직경 10㎛ 이하 입자(PM10) 농도를 5분·시간 단위로 담은 관측 원천 데이터로, 범위는 전국 지점이며 지점별로 2003년 4월부터 보유한다. 황사가 올 때 서해 도서·내륙 지점의 PM10 농도가 시간대별로 얼마나 올랐는지 확인하려는 분석가나 기상·환경 담당자가 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 에어코리아 측정소 자료나 기상 관측 자료와는 지점명 매핑이나 기상청 지점 코드로만 이어 쓴다.
limits: 포털 활용신청과 별개로 기상청 API허브(apihub.kma.go.kr) 인증키를 받아 경로 파라미터로 넣어야 호출된다. 전역 조인 키가 없어 다른 대기질 데이터와 결합하려면 지점 이름·코드를 직접 맞춰야 하며, 관측 지점이 일부에 한정되고 지점별 보유 기간이 다르다.
