description_portal: '대기 중에 부유하는 에어로졸 중 직경이 10㎛ 이하인 입자의 농도를 관측하여 제공합니다.황사를 관측하는 장비인 부유분진측정기(PM10)는 대기 중에 부유하는 에어로졸 중 직경이 10㎛ 이하인 입자의 농도를 연속 측정합니다. 먼지(황사 포함)가 필터에 침적되고, 동위원소 C-14에서 방출되는 베타선을 필터 여지에 쏘아 감쇄된 베타선을 검출기로 측정하여 황사의 농도를 산출합니다.관측지점은 강화, 고산, 관악산, 구덕산, 군산, 대관령, 대구, 문경, 백령도, 북격렬비열도, 영덕, 영월, 울산, 울진, 전주 등이 있습니다.생산주기: 분(5분), 시간보유기간: 2003년 4월~현재(지점별 상이함)'
