summary_user: 고병원성 조류인플루엔자(HPAI)가 검출된 야생조류 예찰과 시료를 예찰 번호 단위로 한 건씩 담은 파일로, 시료채취일과 조사기관이 함께 기록된다. 방역 담당자나 분석가가 언제 어느 기관 예찰에서 야생조류 HPAI 양성이 나왔는지 시기별로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 예찰 번호나 조사기관 이름, 날짜를 맞춰 같은 기관의 예찰 자료와만 연결한다.
limits: 범위는 전국이지만 공간 좌표나 행정구역 필드가 없어 지역별 지도화나 시군구 집계에는 쓰지 못한다. 고병원성이 검출된 건만 담고 있어 전체 예찰 건수나 음성 결과 대비 검출률은 이 파일만으로 계산할 수 없다.
