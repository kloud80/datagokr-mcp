description_portal: AI(야생조류 인플루엔자)는 병원성 양성 결과가 고병원성, 저병원성으로 나뉘며 그 중에서도 유전자형에 따라 H형과 N형 등 세부 분류가 있습니다.이 중 고병원성 조류인플루엔자(HPAI)가 흔히 말하는 조류인플루엔자라 볼 수 있으며, 치명적이기 때문에 주요 관리 대상에 해당합니다.실제로 조류 인플루엔자 질병관리 및 방역 등은 고병원성 조류인플루엔자를 기준으로 운영됩니다.따라서 고병원성 조류인플루엔자(HPAI)가 검출된 야생조류 시료 및 해당 시료를 수집한 예찰에 대한 정보는 특별히 주시해야 할 데이터라 할 수 있습니다."HPAI 예찰정보"는 예찰 번호를 기준으로 고병원성이 검출된 예찰과 시료에 대한 정보입니다.
