summary_user: 사업자등록번호로 조회하면 해당 업체의 비점오염 저감시설 업체 정보(사업자등록번호와 상호명)를 건별로 돌려주는 전국 범위 확인 API다. 발주처나 사업자가 특정 업체가 비점오염 저감시설 업체로 확인되는지, 그 상호가 무엇인지 확인할 때 쓴다. 사업자등록번호(brno)가 조인 키라서 사업자등록 상태 조회나 다른 기관의 업체·인허가 데이터와 사업자번호로 이어 쓴다.
limits: 응답 항목이 사업자등록번호와 상호명뿐이라 시설 위치·용량·설치 현황 같은 세부 정보는 알 수 없다. 공간 정보가 없는 전국 단위 데이터라 지역별 분석에는 쓰기 어렵다. 개발계정은 하루 1,000회로 호출이 제한된다.
