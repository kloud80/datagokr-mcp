description_portal: 본 데이터는 2025년 12월 17일 기준으로 국립호남권생물자원관 섬생물소재은행이 보유 중인 배양체 확보 현황을 정리한 자료입니다. 구성 항목은 은행자원번호, 분류군, 국명, 학명, 분양가능여부로 이루어져 있으며, 분류군은 녹조류, 관속식물류 등으로 구성되어 있습니다. 국명은 우리말 학명이, 학명은 영문으로 작성되어 있어 국내외 생물자원 연구에 모두 활용 가능합니다. 분양가능여부는 모든 항목이 ‘가능’으로 기재되어 있어 연구자 활용에 적합한 상태입니다. 은행자원번호를 기준으로 정렬되어 체계적인 관리가 가능합니다. 본 데이터는 생물다양성 연구, 교육, 산업적 활용 등 다양한 분야에서 활용될 수 있으며, 생물자원 공유 기반 마련에 기여할 수 있는 자료입니다. 공동 연구 활용 기반으로도 유의미합니다.
