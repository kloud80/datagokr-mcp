summary_user: 창원시설공단이 관리하는 창원시 적현 매립장에 폐기물을 처리·운송하는 업체의 명단을 업체 한 곳당 한 행으로 담은 작은 파일(약 1.9KB CSV)이며, 업체명·대표자명·사업자등록번호·사업장 종류가 들어 있습니다. 적현 매립장에 반입하는 수집운반·처리 업체가 어디인지, 특정 업체가 이 매립장 거래 업체 명단에 있는지 확인하려는 사업자나 분석가가 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 다른 폐기물 처리업 허가·사업장 원장과 이어 쓴다.
limits: 업체 명단만 담고 있어 반입량·처리 실적 같은 발생량·처리현황 통계는 알 수 없다. 범위가 전국·비공간으로 분류돼 있지만 실제 내용은 창원 적현 매립장 관련 업체에 한정되고, 사업장 종류는 별도 코드표 없이 텍스트로 되어 있다.
