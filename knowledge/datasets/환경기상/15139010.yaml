summary_user: 환경공간정보서비스 환경주제도의 하나로, 지역별 공장용지 지목 면적과 토지피복상 면적을 나란히 두고 지목 대비 피복 면적 비율을 산출한 전국 단위 집계 파일(CSV 약 12KB)이다. 지역 정책 담당자나 분석가가 '우리 지역에서 공장용지로 지정된 땅 중 실제로 공장 등으로 덮여 쓰이는 비율이 얼마인가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름을 맞춰 매핑해야 이어 쓸 수 있다.
