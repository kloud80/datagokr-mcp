description_portal: 배수설비는 건축물과 하수관로를 연결하여 공공하수도를 통해 하수종말처리장으로 오수를 보내는 설비를 의미합니다.양평군에 등록되어 있는 배수설비 업체 현황을 업체명, 대표자, 소재지(도로명주소 및 지번주소), 위치, 전화번호(사무실) 등 세분화하여 데이터를 제공합니다.양평군에 등록되어 있는 배수설비 업체는 16개의 업체가 있으며 양평읍에 9개,용문면에 4개,강상면에 3개가 위치하고 있습니다.2025년과 비교하여 대표자 변경 3건, 소재지 변경 6건, 전화번호 변경 6건이 있습니다.
