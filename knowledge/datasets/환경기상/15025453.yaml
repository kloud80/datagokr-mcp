summary_user: 전국 야생동물구조센터 58곳을 센터 한 곳당 한 행으로 담은 표준데이터로, 주소·좌표, 운영시각·휴무일, 지정일자, 수의사 수, 진료·수술·재활·격리실 수, 구조차량·장비 현황, 전화번호를 포함한다. 다친 야생동물을 발견한 국민이 가장 가까운 구조센터와 연락처·운영시간을 찾거나, 분석가가 지역별 구조센터 시설·인력 분포를 비교하는 데 쓴다. 도로명·지번 주소와 위도·경도로 다른 공간 데이터(전국자연환경조사 종 분포 점, 보호구역 레이어 등)와 위치 기준으로 잇고, 제공기관코드(행정표준 기관코드)로 제공 지자체 단위로 묶는다.
