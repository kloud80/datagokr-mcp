summary_user: 유독물관리자·대기환경기술인·수질환경기술인 업무를 수탁하는 환경관리대행기관의 인허가 정보를 업소 단위 건별로 담으며, 전국 2,499건 규모로 사업장명·영업상태·인허가일자·소재지 주소·좌표를 싣는다. 지역에서 영업 중인 환경관리대행기관이 어디인지, 언제 인허가를 받았고 휴·폐업했는지 찾는 사업자나 분석가가 쓴다. 도로명주소·지번주소 필드(address 키)로 다른 주소 기반 데이터와 이어 쓰며, 필수 파라미터인 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
description_portal: '자원환경_환경관리대행기관 데이터는 유독물관리자, 대기환경기술인, 수질환경기술인의 업무를 수탁하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 환경관리대행기관 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 환경정책기술담당관 / 044-201-6672 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
