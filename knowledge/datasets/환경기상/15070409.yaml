summary_user: 수질오염총량관리 양식계 오염원의 발생부하량 산정에 쓰는 양식장 유형별(가두리·지수식·유수식) 월별 발생부하원단위로, 생물화학적산소요구량·총질소·총인의 일평균 값을 시설면적당(g/㎡/일) 담은 전국 단위 기준표(약 1.8KB CSV)입니다. 사료투여량 자료가 없는 양식장의 월별 부하량을 시설면적에 이 원단위를 곱해 추정하려는 오염총량 담당자나 수질 분석가가 쓴다. 전역 조인 키는 없으며, 양식장 구분 명칭과 월을 기준으로 양식장 시설면적 등 별도 오염원 자료에 이름 매칭으로 붙여 쓴다.
description_portal: '양식계 발생부하량 산정시 사료투여량 자료가 확보된 경우 양식장의 월별 사료투여량에 발생부하비를 곱하여 월별로 산정하나,  사료투여량 자료를 미확보한 경우  양시장의 시설면적에 시설면적기준 발생부하 원단위를 곱하여 산정합니다.수질오염총량관리  양식계 오염원  발생부하량 산정을 위한 양식장별 발생부하원단위(양식장 구분(가두리(이스라엘잉어), 지수식(미꾸라지), 유수식(송어, 대하)), 월별 생물화학적산소요구량(일평균), 총질소량(일평균), 총인량(일평균))를 제공합니다. 출처 : 수질오염총량관리기술지침(2019), 국립환경과학원 단위 : g_제곱미터_일'
