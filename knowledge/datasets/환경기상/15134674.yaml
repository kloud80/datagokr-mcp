description_portal: 환경책임보험 전산망에서는 미가입 현황을 체계적으로 관리하기 위해 다양한 기준과 구분 정보를 포함한 데이터를 정기적으로 추출하고 있습니다. 미가입추출기준일자는 해당 미가입 현황이 산출된 기준 날짜를 의미하며, 추출회차는 정기적으로 이루어지는 데이터 추출의 횟수를 나타내어 추출 이력을 관리합니다.시설구분은 사업장에서 보유한 환경 관련 시설의 종류를 구분하며, 인허가구분코드와 인허가기관대구분은 해당 시설의 인허가 유형과 관할 기관을 코드화하여 명확하게 분류합니다. 또한, 사업장 행정구역코드는 사업장이 위치한 행정구역을 식별하는 코드로, 지역별 미가입 현황 분석에 활용됩니다.건수는 해당 조건에 부합하는 미가입 사업장의 수를 나타내며, 미가입통보대상여부는 미가입 상태로 인해 통보가 필요한 대상인지 여부를 표시합니다. 마지막으로, 삭제여부는 해당 데이터가 현재 유효한지, 혹은 삭제(비활성화) 처리되었는지를 나타내어 데이터의 정확성과 최신성을 유지하는 데 기여합니다.이와 같은 세부 항목들은 환경책임보험 미가입 관리의 정확성과 신뢰성을 높이고, 효과적인 행정처분 및 정책 수립을 위한 기반 자료로 활용됩니다.
