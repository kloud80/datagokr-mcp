summary_user: 경상북도 구미시 관내 소형 폐가전 수거함을 설치 지점별로 담은 파일로, 공동주택명·도로명 주소·세부 설치 위치·설치 대수·관리기관 전화번호가 한 행에 들어 있다(시군구 범위, 개별 주소 단위). 구미시 주민이 '우리 아파트 단지 어디에 소형 폐가전 수거함이 있나'를 찾거나, 분석가가 단지·지역별 수거함 보급 수준과 부족 지역을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 공동주택명을 이름으로 맞춰 잇거나, 다른 지자체의 수거함·재활용 정거장 파일과 같은 형식으로 나란히 비교하는 방식으로 쓴다.
