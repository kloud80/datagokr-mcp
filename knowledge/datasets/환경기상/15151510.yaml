summary_user: 광주 북구가 설치한 대기질 신호등 8곳에서 2024년부터 쌓인 시간별 측정값(미세먼지·초미세먼지·오존·이산화질소·일산화탄소·아황산가스·온도·습도)을 신호등별 건별로 담은 약 57MB 규모의 CSV 파일이다. 북구 주민이나 분석가가 "우리 동네 신호등 지점의 초미세먼지가 어느 시간대에 높아지는가"처럼 생활권 단위의 대기질 변화를 살피는 데 쓴다. 전역 조인 키는 없어서 설치장소 위도·경도로 기상 관측·교통량 같은 좌표 기반 데이터와 붙이거나, 측정소 이름을 에어코리아 측정소 자료와 이름으로 맞춰 이어 쓴다.
description_portal: '광주광역시 북구가 보유한 8개의 대기질 신호등의 2024년부터 축적된 데이터입니다. 다양한 주기의 대기질 변화 데이터를 제공하여 공공정책 수립, 도시환경 모니터링, 실시간 공기질 분석 등 여러 분야에서 활용 가능하며, 기상, 교통량 등과 융합하여 정확한 예측모델 개발과 정책 효과 분석에 기여할 수 있습니다.제공 데이터로는 신호등명,일자,시간,미세먼지,초미세먼지,오존,이산화질소,일산화탄소,아황산가스,온도,습도, 설치장소,위도(설치장소),경도(설치장소),측정소,측정장소를 제공하고 있습니다. ※ 측정단위 : 미세먼지(㎍/㎥),초미세먼지(㎍/㎥),오존(ppm),이산화질소(ppm),일산화탄소(ppm),아황산가스(ppm),온도(℃),습도(%)'
