description_portal: 전북특별자치도 내 주요 도로변에 설치된 대기측정망에서 관측한 월별 오염도 현황 데이터입니다. 이 자료는 차량 통행량이 많은 도로 인근의 대기질을 집중적으로 파악하기 위한 것으로, 자동차 배출가스의 직접적인 영향을 받는 이산화질소(NO₂)와 일산화탄소(CO), 미세먼지(PM10, PM2.5) 등의 월평균 농도를 제공합니다. 이 데이터는 교통량과 대기오염의 상관관계를 분석하고, 도로변에 거주하거나 통행하는 시민들의 건강에 미치는 영향을 평가하는 데 중요한 기초 자료입니다. 또한, 친환경 교통 정책의 효과를 검증하는 데에도 활용될 수 있습니다.* 대기환경 정보에 대해 더 자세한 사항은 전북자치도 실시간대기정보시스템 https://air.jeonbuk.go.kr/state/realtime.do을 참고해 주시기 바랍니다.* (부서 연락처) 063-290-5323
