status: active
summary_user: 기상청 해양기상관측선 기상1호가 항해하며 시각별로 관측한 위치(위도·경도)와 풍향·풍속, 기온, 습도, 기압, 수온, 파고·파주기·파향, 일조·일사, 현천을 담은 선박 관측 원천 파일이다. 해양·기상 분석가가 특정 시점에 서해·남해 해상에서 바람과 파고, 수온이 어땠는지 확인하거나 해상 관측값을 육상·부이 관측과 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 관측 자료와는 시간과 위도·경도를 기준으로 맞춰 붙이거나 같은 기관 자료끼리 이름으로 연결해 쓴다.
limits: 표준 지점번호나 예보 격자(nx, ny) 같은 공통 키가 없어 기상청 관측·예보 자료와 바로 조인되지 않는다. 범위는 전국·비공간으로 분류돼 있어 행정구역 단위 분석에는 맞지 않는다.
