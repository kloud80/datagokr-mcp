description_portal: 해양에서 능동적이고 입체적인 기상관측을 위해 기상청은 2011년에 498톤 규모의 기상관측 전용 선박인 기상1호를 건조하여 운영하고 있다.기상1호는 해양기상, 고층기상, 해양물리현상을 관측하기 위해 자동기상관측장비, 고층기상관측장비, 웨이브 라이더 부이, 초음파해류 관측장비 등을 탑재하고 있다.연간 160일 이상 운항하며, 관측 범위는 수평으로는 서해, 남해 및 근해구역으로(11°S ­ 63°N, 94°E ­ 175°E) 항행하며 연직으로 수중 3km에서 고층 20km까지 관측하고 있다.
