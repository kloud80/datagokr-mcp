summary_user: 안산시 관내에서 대형폐기물과 생활폐기물을 수거·운반하는 민간위탁 업체를 업체 한 곳당 한 행으로 정리한 작은 목록(CSV 약 809바이트)으로, 업체명·수집운반구역·전화번호·데이터기준일자를 담는다. 안산시 주민이 '우리 동네 폐가구나 생활쓰레기 수거는 어느 업체 담당이고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 수집운반구역의 동 이름을 행정동 이름과 맞추거나 같은 안산시 폐기물 관련 파일과 기관 단위로 묶어 쓴다.
description_portal: 이 데이터는 지역 내 대형 및 생활 폐기물의 수거·처리를 담당하는 민간위탁 수거업체의 현황을 정리한 자료입니다. 업체명, 수거구역, 전화번호 등의 항목으로 구성되어 있습니다. 대표적인 업체로는 성호산업㈜, 호성개발㈜, 서진산업㈜, 경안, 경진산업㈜ 등이 있으며, 관내 아파트단지, 상가, 일반주택 등에서 발생하는 폐가구, 가전제품을 비롯한 대형폐기물 및 생활쓰레기류를 수거하여 중간처리장 또는 재활용센터로 이송하는 역할을 수행합니다. 해당 업체들은 환경부나 자치단체의 인허가를 거쳐 위탁 운영되며, 주기적으로 생활폐기물 수거하고 댸형폐기물 신고 접수 시 각 업체가 구역별로 출동하여 처리합니다.
