summary_user: 기상청이 발표한 예보·특보를 요약·정리한 통보문(기상예보, 특보, 날씨해설, 기상정보)을 문서 단위로 담는 전국 범위 데이터이며, 특·정보 통보문은 최근 발표분만 제공된다. 국민이나 분석가가 '지금 발효 중인 특보와 기상청의 오늘 날씨 해설은 무엇인가'처럼 모델이 알 수 없는 실시간 기상 상황을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 예보구역 이름 매핑이나 같은 기상청 코드로만 이어 쓰며, 예보·특보 계열 데이터와는 예보구역·격자(nx, ny)를 기준으로 맞춘다.
description_portal: 발표된 예보나 특보 등의 통보를 위해 일부 또는 전체 내용을 요약하거나 정리하여 작성한 문서를 말합니다.기상예보, 특보, 날씨해설, 기상정보 등 매일 생산되는 예보를 담은 정보 통보문입니다. 기상 특·정보 통보문은 최근에 발표한 자료만 제공됩니다.기상정보는 주요 위험기상에 대해 현상별·단계별 정형화된 통보문을 제공하고 있으며, 기본 그래픽 제공, 내용 간결화 하여 가독성을 개선하여 제공하고 있습니다.기상해설은 중점사항, 날씨전망, 유의사항, 기압계현황 및 전망, 예보 변동성 등 표준형식을 정하여 제공하고 있습니다. 초단기, 단기, 중기 예보기간별 날씨현황 또는 현상 등 3개 내외의 그룹으로 나누어 설명을 제공합니다.
