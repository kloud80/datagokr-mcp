summary_user: 경기도 하남시가 신고·관리하는 대기오염물질 배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·업종·종별·주소·데이터기준일자를 시군구 범위에서 개별 주소 단위로 제공한다. 하남시 주민이나 분석가가 '우리 동네 근처에 어떤 업종의 대기 배출 사업장이 몇 종으로 신고돼 있나'를 확인하거나 대기오염 민원의 원인 사업장을 추적하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 같은 기관 자료끼리만 이어 쓸 수 있다.
description_portal: 대기환경보전법 제23조 배출시설의 설치 허가 및 신고에 따라 3종, 4종, 5종의 경우 신고 및 관리를 진행하고 있습니다. 1종과 2종의 경우는 경기도에 신고를 받고 관리를 하고 있습니다.경기도 하남시의 대기오염물질 배출시설은 자동차 수리업, 주조업, 택시운송업 등 다양한 업종에서 운영되고 있으며, 환경안전 확보를 위해 지속적인 관리가 필요합니다. 본 데이터는 사업장명, 업종, 종별, 소재지 및 기준일자를 포함하고 있어, 지역 내 주요 오염원 파악 및 저감 정책 수립에 활용될 수 있습니다. 특히 업종별 오염원 분류와 위치정보가 포함되어 있어, 대기오염 관련 민원 발생 시 원인 추적과 사전 예방 정책 설계에 도움을 줍니다. 나아가, 도시계획, 공장입지 규제, 그린뉴딜 사업 등의 행정 판단 기준자료로도 적절히 활용 가능합니다.
