summary_user: 부산광역시 남구의 지하수 관정별 수질검사 결과를 검사 건 단위로 담은 파일로, 검사일자·검사종류·적합 여부 등 검사결과·검사기관명·관정위치를 기록한다(CSV 약 5KB의 소규모 자료). 주민이나 분석가가 남구 내 특정 관정의 지하수가 언제 어떤 검사를 받았고 결과가 어땠는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관정위치(주소) 이름 매칭이나 같은 기관 자료끼리로만 이어 쓴다.
limits: 남구 한 시군구만 다루므로 부산 전역이나 다른 자치구와 비교하려면 각 구의 자료를 따로 모아야 한다. 관정 식별 코드나 표준 행정코드가 없어 지하수 관정 원장 등과 기계적으로 결합하기 어렵다.
