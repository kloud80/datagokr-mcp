summary_user: 대구광역시 서구 관내 대형폐기물 납부필증 스티커를 파는 지정업소를 한 곳씩 담은 목록으로, 업소명·소재지(동)·도로명주소·전화번호가 들어 있다(CSV 약 9KB). 서구 주민이 소파나 장롱 같은 대형폐기물을 내놓기 전에 집 근처 어디서 스티커를 살 수 있는지, 미리 전화로 확인할 곳이 어디인지 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 업소명을 맞춰 붙여야 하며, 다른 지자체의 대형폐기물 판매소·종량제 판매소 파일과는 같은 항목을 기준으로 이어 붙여 쓴다.
description_portal: 대구광역시 서구 괸내의 대형폐기물 납부필증 스티커 판매소에 대한 정보로써 판매지정업소명, 전화번호, 주소에 대한 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 내 대형폐기물 스티커 판매 지정업소 현황을 상세히 수록하고 있다. 각 판매소의 명칭, 소재지, 도로명 주소, 연락처 정보를 포함하여 시민이 쉽게 위치 확인과 문의가 가능하도록 구성하였다. 대형폐기물 배출 시 필요한 스티커를 구매할 수 있는 공식 판매처를 안내함으로써 편리한 민원서비스 제공 및 쾌적한 환경 조성에 기여한다. 또한, 서구 관내 다양한 동별 판매업소 정보를 포괄하여 지역 맞춤형 행정지원에 활용될 수 있다.
