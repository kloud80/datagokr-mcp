summary_user: 중소형폐가전·폐휴대폰·폐자동차 등 재활용 폐기물을 수거·회수하는 업체의 상호, 종류, 수거방법, 지역, 주소, 전화번호, 수거비용을 업체 단위로 담는 API이며, 범위는 전국이고 검증 호출에서는 전체 1건이 수신됐다. 선풍기나 전기밥솥 같은 소형 폐가전을 버리려는 주민이 어디에 연락하고 비용이 얼마인지 찾는 질문에 쓴다. 주소(addr)가 조인 키라서 지자체별 수거함·배출 지점 파일이나 주소 기반 지오코딩 자료와 주소 문자열로 이어 쓰며, 그 밖의 코드표 키는 없다.
limits: 검증 시 API 전체 건수가 1건, 수신 1행이어서 전국 수거처를 충분히 담는지는 확인되지 않았다. 폐기물 발생량·처리현황 통계는 다루지 않으며, 조인 키가 주소 문자열뿐이라 표기가 다르면 매칭이 어긋날 수 있다. 호출에는 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
