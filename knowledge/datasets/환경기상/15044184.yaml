summary_user: 해양환경공단이 운영하는 전국 연안 해양수질자동측정소의 해역, 측정소 이름, 설치 위치를 측정소 한 곳당 한 행으로 담은 소규모 목록 파일이다(CSV 약 1.4KB). 연구자나 지자체 담당자가 "우리 해역에는 어느 자동측정소가 있고 어디에 설치돼 있나"를 확인하거나, 실시간 수질 측정값을 볼 지점을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양수질 측정 데이터와는 측정소 이름이나 해역명으로 맞춰 이어 써야 한다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정소의 위치 및 운영 현황 정보를 제공합니다. 본 데이터는 전국 연안 및 주요 해역에 설치된 자동측정소의 명칭, 설치 위치 등 기본 정보를 포함합니다. 측정소는 실시간 수질 모니터링을 통해 수온, 염분, 용존산소, 수소이온농도, 탁도, 전기전도도 등 주요 항목을 연속적으로 측정하며, 해양수질의 변화를 정밀하게 감시하기 위한 기반 시설로 활용됩니다. 본 데이터는 해역별 수질관리 전략 수립, 오염원 분석, 환경영향평가 등 다양한 분야에서 기초자료로 활용되며, 공공기관, 연구기관, 지자체 등에서 참고자료로 사용됩니다.
