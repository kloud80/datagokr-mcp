description_portal: 이 데이터는 우주선 중성자(Cosmic-Ray Neutron Probe) 센서를 활용하여 반경 약 300m 범위 내 토양의 평균 체적 수분량을 계측한 자료입니다. 측정은 주로 강원도 홍천군 지역에서 진행되었으며, 발생일자별로 토양수분량(cm³/cm³), 측정 위치(위도, 경도), 해발고도 정보가 포함되어 있습니다. 이는 토양 상태 변화에 따라 수분 함량이 어떻게 달라지는지를 분석하는 데 유용합니다. 토양 내 수분의 정량적 정보를 기반으로 하천 유역의 유출 해석, 수문 모델링, 농업 수분 관리 등 다양한 환경 및 수자원 분야의 기초자료로 활용할 수 있습니다.
