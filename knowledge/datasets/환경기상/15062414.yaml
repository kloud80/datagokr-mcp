description_portal: 사립학교교직원연금공단 소유 회관 전체의 온실가스 배출량 데이터로, 총 온실가스 배출량, 직접배출량(SCOPE 1), 간접배출량(SCOPE 2) 항목에 대한 데이터를 제공합니다. 해당 데이터는 소숫점 이하 자릿수는 반올림하며, 2016년 이후 데이터를 포함하고 있습니다. 온실가스 배출량은 에너지원별 사용량에 기준 산식을 적용하여 산출합니다. 배출량 데이터의 단위는 ‘tCO2eq’ 입니다.이 데이터를 통해 공단의 환경 책임 이행을 투명하게 공개하고, 탄소 중립 사회로의 전환 노력에 동참함을 보여주고자 합니다. 또한, 기후 변화 대응을 위한 연구 및 정책 수립의 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 지속 가능한 경영을 입증하고, 이해관계자들이 공단의 환경 영향을 명확히 파악할 수 있도록 지원합니다.
