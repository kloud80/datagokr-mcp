summary_user: 사립학교교직원연금공단이 소유한 회관 전체의 온실가스 배출량을 연도별로 합산한 집계 데이터로, 총배출량·직접배출량(SCOPE 1)·간접배출량(SCOPE 2)을 tCO2eq 단위로 담고 포털 설명상 2016년 이후 연도를 포함한다. 분석가나 이해관계자가 '공단 회관의 온실가스 배출이 해마다 줄고 있는가, 직접·간접 배출 비중은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공공기관 배출량 자료와는 연도(연도)를 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
