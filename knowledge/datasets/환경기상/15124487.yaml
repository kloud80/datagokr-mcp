description_portal: 광주광역시는 도시 침수 피해의 원인과 대응 방안을 연구하고자, 광산구 행정동별 맨홀 및 빗물받이 개수에 대한 공공데이터를 제공합니다. 이 자료는 침수 취약지역의 구조적 문제를 파악하고 개선 방향을 마련하기 위한 기초 자료로 사용할 수 있습니다.도시의 배수 인프라 현황을 분석하고, 빗물 유입 시설의 분포 및 밀집도를 파악함으로써, 향후 침수 예방과 도시 재해 대응 능력 강화를 위한 정책 수립을 위한 자료로 활용할 수 있습니다.기후 변화로 인해 집중호우 빈도와 강도가 증가하는 상황에서 해당 데이터는 지역 맞춤형 치수 정책을 마련하고, 우수관 시설 정비 및 확충이 필요한 지역을 우선적으로 선정하는 데 유용할 수 있습니다.
