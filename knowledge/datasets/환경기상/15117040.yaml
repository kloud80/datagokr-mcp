summary_user: 경기도 시군별로 시행된 배출가스 저감사업(노후 경유차·건설기계 조기폐차, 매연저감장치 부착, 성능검사, 전기차 보급 등)의 추진 현황을 기준년도·시군·사업별 지원대상, 지원금액, 차량대수로 집계한 자료다. 분석가나 지자체 담당자가 '우리 시군에 노후 경유차 조기폐차 보조금이 연도별로 얼마나, 몇 대에 지원됐나'처럼 예산 배분과 사업 효과를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군명(sigun_nm)과 기준년도를 이름으로 맞춰 대기질·자동차 등록 통계 등과 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 시군별로 시행된 배출가스 저감 관련 사업의 연도별 추진 현황을 정리한 자료입니다. 배출가스 저감사업은 대기환경보전법 제 58조(저공해자동차의 운행 등)에 의거 오염물질을 다량 배출하는 노후 경유차와 노후 건설기계를 대상으로 조기 폐차, 매연저감장치 부착 등에 소요되는 비용을 지원하는 사업입니다.주요 항목으로는 기준년도, 시군명, 사업명, 보조금지원대상, 지원금액, 차량대수 등이 있으며, 각 지역의 노후 경유차, 건설기계, 전기차 등 다양한 유형의 차량을 대상으로 한 저감 정책의 적용 현황을 파악할 수 있습니다. 지원유형에는 저감장치 부착, 성능검사, 조기폐차, 전기차 보급 등이 포함되어 있으며, 해당 데이터는 대기질 개선 정책 수립, 예산 배분, 사업 효과 평가 등의 기초자료로 활용 가능합니다.
