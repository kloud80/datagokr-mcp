description_portal: 주유소의 위치, 상호, 운영 여부 등 기본 현황 정보를 포함한 자료로, 주유소의 설치 현황과 운영 실태를 종합적으로 파악할 수 있다. 본 자료는 주유소의 공간적 분포와 업종별 현황을 분석하여 석유판매업 관리 대상 사업장의 현황을 체계적으로 관리하기 위한 기초자료로 활용된다.또한 주유소 운영 현황을 바탕으로 석유류 유통 구조와 공급 여건을 파악하고, 관련 행정 정책 수립 및 개선 방향 검토를 위한 참고 자료로 활용된다. 본 자료는 석유판매업에 대한 행정 관리, 지도·점검 업무 수행과 함께 관련 통계 산출, 에너지 유통 관리 및 안전 관리 행정 업무 수행을 지원한다.
