summary_user: 충청북도 진천군 관내 음식물폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 목록 파일로, 상호명·업소구분·소재지 주소·신고일자·배출량을 담는다. 군청 폐기물 담당자나 수거·처리 업체가 '진천군에서 음식물폐기물을 많이 내는 음식점·집단급식소가 어디에 몰려 있고 배출량이 얼마인가'를 확인해 수거 동선과 처리 계약 대상을 정하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 상태조회나 다른 인허가 목록과 붙이고, 도로명·지번 주소로 지도나 다른 시군의 같은 목록과 이어 쓴다.
description_portal: 이 데이터는 충청북도 진천군 관내 음식물폐기물을 다량으로 배출하는 사업장에 대한 현황 자료입니다. 포함된 항목은 지역, 시군읍 단위, 사업장 구분, 상호명, 사업장 주소, 배출량 등 입니다. 본 데이터는 음식물폐기물의 발생량과 처리실태를 파악하여 자원순환 및 폐기물 감량 정책 수립에 활용될 수 있습니다. 특히 다량배출사업장을 대상으로 효율적인 수거 및 처리 인프라 구축, 민간 처리시설 연계 등의 행정적 조치가 필요한 경우 활용 가치가 높습니다. 일일 배출량은 비보유 정보로 제외되었습니다.
