summary_user: 서울 광진구에 설치된 폐형광등·폐건전지 수거함을 설치 장소 한 곳당 한 행으로 담은 파일로, 구분·시설명·관할동·소재지 주소·전화번호를 담는다. 광진구 주민이 집 근처 동주민센터나 아파트 관리사무소 중 어디에 폐건전지를 버릴 수 있는지 찾거나, 분석가가 동별 수거함 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관할동 이름이나 소재지 주소를 맞춰 잇고, 다른 지자체의 같은 종류 수거함 파일과는 항목을 맞춰 나란히 쓴다.
description_portal: '서울특별시 광진구_폐형광등 폐건전지 수거함 현황은 광진구 내에서 시민들이 폐형광등과 폐건전지를 안전하게 분리배출할 수 있도록 설치된 수거함의 위치 및 관련 정보를 제공합니다. 본 데이터는 수거함이 설치된 장소의 주소와 구체적인 위치(예: 아파트 단지 내 관리사무소, 동주민센터, 공공기관 건물 등)를 포함하며, 수거 대상 품목은 수은이 포함되어 환경오염 우려가 있는 폐형광등과 중금속 성분이 포함된 폐건전지입니다. 이 데이터는 광진구민의 재활용 참여를 유도하고, 올바른 폐기물 배출을 통해 환경 보호 및 자원 순환에 기여할 수 있도록 정보를 투명하게 제공하는 목적을 가지고 있습니다. 환경정책 수립, 지역 환경 모니터링, 수거함 설치의 효율성 분석 등에도 활용할 수 있으며, 공공기관, 민간단체 및 일반 시민 모두가 접근 가능한 형식으로 제공됩니다.'
