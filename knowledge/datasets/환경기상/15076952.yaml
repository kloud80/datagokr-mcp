summary_user: 강릉시 관내 벙커C유 사용 업체를 업소 단위로 담은 소규모 파일(CSV, 약 1KB)로, 업소명·도로명 소재지·전화번호·업종(생산품)·연간 연료사용량(리터)·위도·경도·기준일자를 담는다. 환경 담당자나 분석가가 '강릉시에서 벙커C유를 쓰는 목욕탕·숙박업·제조업체가 어디에 있고 연간 얼마나 쓰는가'를 지도 위에 확인하거나 대기 배출원 현황을 보조적으로 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어서, 다른 배출시설·사업장 데이터와는 업소명·주소를 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: "공공데이터 제공 신청건으로, 강원특별자치도 강릉시 벙커C유 사용업체 현황 데이터입니다.본 데이터는 10개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.시도: 광역자치단체 (예: 강원특별자치도)시군구: 기초자치단체 (예: 강릉시)업소명: '중앙목욕탕', '(주)우남케미칼' 등 벙커C유 사용 업체의 이름소재지: 업체의 도로명 주소전화번호: 업체의 연락처생산품: '목욕장업', '스티로폼제조', '숙박업' 등 해당 업체의 업종 또는 생산품연료사용량(리터_년): 연간 벙커C유 사용량 (리터 단위)위도: 위치 식별을 위한 위도 값 (좌표)경도: 위치 식별을 위한 경도 값 (좌표)기준일자: 해당 현황을 조사한 기준 날짜이 10개 항목의 조합을 통해, 강릉시 관내 업소명별 소재지, 생산품, 연료사용량 및 정확한 위치(위도, 경도)를 파악할 수 있습니다."
