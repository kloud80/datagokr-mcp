summary_user: 인천환경공단 송도사업소 주변(연수구 송도 일대·신항대로 근처 등) 악취 발생 구역에서 지점별로 직접 측정한 결과를 측정일자·지점명·주소·위경도 좌표·복합악취 희석배수 값 단위의 건별 원천 기록으로 담은 CSV 파일(약 21KB)이다. 송도 주민이나 지역 환경 분석가가 '우리 동네 어느 지점에서 어느 달에 악취 수치가 높았나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위경도 좌표로 공간 매칭하거나, 측정일자를 기준으로 기상·민원 자료와 이어 쓴다.
description_portal: 인천환경공단 송도사업소 주변(연수구 송도 일대 및 신항대로 근처 등) 악취 발생 구역에 대해 각 장소별로 직접 측정한 자료를 CSV형태의 파일로 개방중입니다.개방 자료에는 송도사업소의 매월 측정일자와 측정 장소명, 세부주소, 측정 좌표 자료(x, y축 위도 경도 좌표) 및 악취 측정 값을 개방하고 있습니다.해당 자료는 1년 주기로 개방하고 있으며, 연 1회 개방을 실시하고 있음을 알려드립니다.해당 자료에 대한 피드백 또는 수정사항이 필요하거나 문의사항이 있는 경우 공공데이터 포털을 통해 문의를 주시면 반영하도록 하겠습니다.
