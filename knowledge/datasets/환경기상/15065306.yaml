description_portal: 이 데이터는 폐기물부담금 제도에 따라 연도별로 제조업체, 수입업체, 그리고 자발적협약 참여업체에게 부과된 부담금 현황을 보여주는 자료입니다. 각 연도마다 제조 및 수입 실적에 따라 대상 업체 수와 부과금액이 상이하며, 일부 연도에는 자발적 협약에 따라 참여 업체에게 별도로 부과된 금액도 포함되어 있습니다.이러한 데이터는 정부가 정책 평가 및 제도 개선, 업종별 부담비율 분석, 환경부담의 공정한 분배를 위한 기초자료로 활용할 수 있으며 기업 입장에서도 책임 이행 현황을 점검하는 데 도움이 됩니다.
