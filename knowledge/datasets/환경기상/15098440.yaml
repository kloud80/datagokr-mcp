summary_user: 경기도 화성시에 등록된 폐기물 처리업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 상호·사업장 소재지·연락처·처리업종 분류가 들어 있다(CSV 약 85KB, 화성시 범위). 폐기물을 내보내야 하는 사업장이나 민원인이 '화성시에서 사업장폐기물을 맡길 수 있는 처리·수집운반 업체가 어디인가'를 찾을 때 쓰고, 행정 담당자가 지역 내 처리업체 분포를 파악할 때도 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 소재지 주소를 맞춰 이어 쓰고, 같은 화성시의 다른 폐기물 자료와는 기관 단위로만 묶을 수 있다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어 다른 기관의 처리업 허가·배출자 데이터와 정확히 연결하기 어렵고, 상호·주소 문자열 매칭에 기대야 한다. 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다.
