summary_user: 사업장폐기물을 처리하는 업체를 한 곳씩 담은 건별 원장으로, 업체명·업종·전문분야·처리폐기물·업체상태·관할관청과 주소·좌표를 전국 13,566건 규모로 담는다. 배출 사업장 담당자나 분석가가 '우리 지역에서 이 폐기물을 받아 처리하는 영업 중인 업체가 어디 있나'를 찾을 때 쓴다. 사업자등록번호(brNo)로 다른 사업자·허가 데이터와, 주소(addr)와 위경도로 행정구역·지도 데이터와 이어 쓴다.
limits: 폐기물 발생량이나 처리실적 같은 통계는 담지 않는다. 검증 호출에서는 1,000행만 받았으므로 전량을 모으려면 페이지를 14회 이상 반복 호출해야 하고, 개발계정은 하루 10,000회로 제한된다.
