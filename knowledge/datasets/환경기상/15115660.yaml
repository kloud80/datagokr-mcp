summary_user: 서울특별시 중랑구에서 대기·소음진동·수질 오염방지시설을 설계·시공하는 환경전문공사업 업소를 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태(영업/정상, 폐업)·폐업일자·주소·좌표를 담는다. 중랑구에서 지금 영업 중인 방지시설 시공업체가 어디에 있는지, 언제 인허가를 받고 폐업했는지를 확인하려는 사업자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 좌표(XCRD, YCRD) 기반 공간 결합으로만 이어 쓴다.
description_portal: 서울특별시 중랑구의 대기오염방지시설, 소음·진동방지시설, 수질오염방지시설을 설계·시공하는 업소정보입니다. 이 데이터에서 제공하는 주요 항목으로는 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세 영업상태코드, 상세영업상태명, 폐업일자, 주소, 좌표정보 등이 있습니다. 영업상태명은 영업/정상, 폐업이 있습니다. 사업장구분명은 환경전문공사업입니다. 데이터의 자세한 사항은 서울특별시 열린데이터 광장에 접속하여 데이터를 확인하여 주시기 바랍니다. 감사합니다.
