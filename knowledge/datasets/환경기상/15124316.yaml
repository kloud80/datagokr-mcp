description_portal: 본 데이터는 경상북도 경주시에서 폐차 처리된 1톤 화물차량에 대한 현황을 정리한 파일 형식의 공공데이터이다. 해당 자료는 자동차관리법령에 의거하여 폐차가 완료된 1톤 트럭에 대한 정보를 담고 있으며, 환경관리, 노후차량 감축, 교통안전 등 행정적 목적의 기초 자료로 활용된다. 데이터에는 차량번호, 차종, 차대번호, 제조사, 연식, 폐차일자, 폐차 사유 등의 항목이 포함되어 있으며, 지역 내 차량 노후화 현황 파악, 저공해차 전환 정책 수립, 폐차 유도 정책 운영 등에 참고할 수 있다. 또한 자동차 정비 업계 및 관련 산업의 수요 예측, 중고차 시장 분석 등에도 활용 가능하다. 경주시는 본 데이터를 정기적으로 갱신하며, 시민의 알권리 보장과 효율적인 교통·환경 정책 추진을 위해 해당 정보를 공개하고 있다.
