description_portal: 해양환경공단이 수행한 해양생태 유해종(해파리) 조사 정점의 공간정보 데이터를 제공합니다. 본 데이터는 유해 해파리의 출현 분포를 파악하기 위한 조사 정점의 위치 좌표, 정점 명칭, 해역명, 조사 시작 시점, 행정구역 등의 정보를 포함합니다. 유해 해파리의 발생 및 이동 경로를 체계적으로 감시하기 위해 설정된 정점 정보는, 해양생태계 교란 방지와 피해 예방 정책 수립에 활용됩니다. 공간정보는 GIS 기반으로 구성되어 있으며, 데이터는 정점유형, 조사주기, 출현빈도 등의 항목으로 구성됩니다. 공공기관, 연구기관, 지자체 등에서 해파리 관리 및 생태보전정책 수립의 기초자료로 사용됩니다.
