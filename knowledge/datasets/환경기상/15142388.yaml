summary_user: 서울 마포구에서 건설폐기물 수집·운반 및 중간처리 인허가를 받은 업소를 한 업소당 한 건씩 담은 인허가 원장이며, 인허가일자·영업상태·폐업일자·주소·좌표·처리구분·허가보관량 같은 항목을 포함한다. 주민이나 사업자가 '마포구에서 지금 영업 중인 건설폐기물 처리업체는 어디이고 어떤 처리를 하나'를 확인하거나, 분석가가 관내 처리업체의 개업·폐업 현황을 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OGDP_INST_CD) 같은 기관 코드로만 잇는다.
description_portal: '서울특별시 마포구의 건설현장에서 나오는 건축폐기물을 수집·운반 및 중간처리하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 건설폐기물처리업체의 위치, 취급 품목과 운영 현황을 파악하고, 환경 안전 강화 및 폐기물 처리 현황의 투명한 관리를 지원할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
