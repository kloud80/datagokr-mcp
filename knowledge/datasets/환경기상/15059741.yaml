summary_user: 전북특별자치도 내에서 재활용제품 품질인증인 GR 마크를 받은 녹색제품의 인증 현황을 인증 건별로 담은 소규모 CSV 파일(약 2.6KB)로, GR 기준번호·규격명·종류·인증번호·인증일자·만료기간·업체명·대표자·소재지를 포함한다. 재활용 산업 분석가나 조달 담당자가 '전북에서 현재 유효한 GR 인증을 가진 업체와 제품은 무엇이고 인증이 언제 만료되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 인증·업체 데이터와는 업체명이나 인증번호 같은 이름·코드 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내에서 ‘GR 마크’ 인증을 받은 녹색제품에 대한 인증 현황을 정리한 자료입니다. GR 마크는 재활용제품의 품질과 안전성을 보장하는 국가 인증으로, 폐지, 폐유리, 폐요업, 유기성폐기물 등을 원료로 만든 제품이 주요 대상입니다. 데이터에는 제품의 GR 기준번호, 제품 규격, 종류, 인증번호, 인증일자, 인증 만료일, 업체명, 대표자, 소재지 등이 포함되어 있습니다. 기업별로 어떤 제품이 어떤 기준을 충족하여 인증을 받았는지를 확인할 수 있어, 친환경 정책 수립, 재활용 산업 현황 파악, ESG 경영 지원 등에 활용될 수 있습니다. 또한 해당 인증이 유효한 기간이 명시되어 있어 인증 관리와 갱신을 위한 기초자료로도 유용합니다. 전라북도 지역 내 친환경 산업 기반 조성과 지속가능한 생산체계 분석에도 도움을 줄 수 있는 중요한 공공 데이터입니다.
