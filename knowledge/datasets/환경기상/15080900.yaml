description_portal: 폐기물은 폐기물관리법에 따라 "생활폐기물"과 "사업장폐기물"로 분류됩니다.사업장 폐기물이란 사업장의 산업 활동으로 생긴 폐기물. 대기 환경 보전법, 수질 환경 보건법, 소음 진동 규제법의 규정에 의하여 배출 시설을 설치하고 운영하는 사업장, 그 외에 지정 폐기물을 배출하는 사업장, 폐기물을 하루 평균 300kg 이상 배출하는 사업장에서 발생하는 폐기물을 가리킵니다.강서구 관내 사업장폐기물 배출자 현황 자료입니다.연번, 구분(사업장일반,지정)업체명, 소재지, 배출폐기물종류, 폐기물처리위탁업체(운반자,처리자)으로 구성된 데이터 입니다.일시적 배출은 제외하고 수시 배출만 제공합니다.
