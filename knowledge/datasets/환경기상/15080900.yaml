summary_user: 부산 강서구 관내에서 사업장폐기물을 수시로 배출하는 사업장을 한 곳씩 담은 원장 파일로, 사업장일반·지정 구분, 상호, 소재지, 배출 폐기물 종류, 위탁 운반자·처리자를 기록한다. 사업자나 분석가가 "강서구에서 지정폐기물을 내는 업체는 어디이고, 어느 업체에 운반·처리를 맡기는가"를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 배출자·처리업 허가 데이터와는 상호·소재지 같은 이름·주소 매칭으로만 이어 쓴다.
limits: 사업자번호나 공통 코드가 없어 다른 데이터와 정확히 조인할 수 없고, 상호·주소 문자열로 매칭해야 한다. 범위는 강서구 한 곳뿐이며, 폐기물 발생량이나 처리 실적 통계는 담지 않는다.
