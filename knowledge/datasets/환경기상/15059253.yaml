summary_user: 경기도에서 환경오염물질 자율점검업소로 지정된 사업장을 한 행씩 담은 목록으로, 시군명, 사업장명, 대기·폐수 종별 구분, 지번·도로명 주소, WGS84 위도·경도를 포함한다. 지자체 환경 담당자나 분석가가 '우리 시군의 자율점검 지정 사업장은 어디에 몰려 있고 대기·폐수 몇 종 사업장이 많은가'를 확인하거나, 지도점검 우선순위를 정하는 데 쓴다. 전역 조인 키는 실측되지 않았다. 다른 데이터와는 시군 코드(SIGUN_CD), 사업자등록번호, 사업장명, 주소·좌표를 이름·코드 매핑해 배출시설 인허가 원장 같은 오염원 사업장 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 자율점검업소로 지정된 사업장의 현황을 정리한 자료로, 환경오염물질 배출이 우려되는 사업장을 대상으로 일정 조건을 충족하면 자율점검 대상으로 지정되는 제도에 기반합니다. 주요 항목은 시군명, 사업장명, 대기종별구분명, 폐수종별구분명, 소재지 주소(도로명/지번), WGS84 좌표(위도/경도) 등이며, 사업장별 환경오염물질 관리 형태와 공간적 위치를 확인할 수 있도록 구성되어 있습니다. 이 데이터는 대기 및 수질 오염관리 정책의 민간 협력 기반 분석, 지역별 자율점검 대상 분포 현황 파악, 오염배출시설의 지도점검 우선순위 설정 등에 활용될 수 있습니다.
