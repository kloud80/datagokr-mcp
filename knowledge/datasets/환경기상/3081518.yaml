summary_user: '부산광역시 남구에서 허가받은 폐기물처리업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 처리업 종류·영업대상 폐기물·상호·소재지·허가일시·영업구역·전화번호를 담는다(파일 크기 약 2.4KB의 소규모 목록). 주민이나 사업자가 남구에서 특정 폐기물(예: 사업장폐기물)을 수집·운반하거나 처리할 수 있는 허가 업체가 어디인지, 연락처가 무엇인지 찾을 때 쓴다. 전역 조인 키(사업자번호·업체 코드 등)가 없어 다른 데이터와는 상호명·소재지 주소를 맞춰 보거나 같은 기관의 자료끼리만 연결해 쓴다.'
description_portal: '부산광역시 남구의 폐기물처리업체 현황 데이터는 해당 지역에서 폐기물의 수집, 운반, 처리, 재활용 등을 담당하는 업체들의 정보를 담은 공공 데이터입니다.업체명 :폐기물처리업체의 공식 명칭입니다. 법인이나 개인 사업자일 수 있으며, 행정 등록명으로 표기됩니다 사업장 주소 : 업체가 실제로 폐기물 처리 업무를 수행하는 사업장의 위치입니다. 도로명 주소 또는 지번 주소로 기재됩니다대표자명폐기물처리업체를 대표하는 사람의 이름입니다. 허가 및 관리 책임자가 누구인지 알 수 있어요.업종 분류처리 가능한 폐기물의 종류에 따라 구분됩니다. 예: 수집·운반업, 중간처리업, 재활용업 등으로 분류되허가 종류 : 지방자치단체로부터 받은 허가의 유형을 나타냅니다. 생활폐기물, 사업장폐기물, 지정폐기물 등 다양한 폐기물에 따라 허가허가 일자 : 해당 업체가 폐기물처리업 허가를 받은 날짜입니다. 사업 시작일이나 갱신일 기준으로 등록처리 가능 폐기물 종류: 업체가 법적으로 취급 가능한 폐기물의 목록입니다. 연락처 : 해당 업체의 전화번호 등 문의 가능한 연락처가 기재'
