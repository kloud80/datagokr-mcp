summary_user: 인천광역시 서구 관내 실내공기질 관리대상 다중이용시설을 시설 한 곳당 한 행으로 담은 파일로, 시설 유형·시설명·주소·연면적과 데이터 기준일자가 들어 있다. 구민이나 환경보건 담당자가 우리 동네 어떤 시설이 실내공기질 관리대상인지, 유형별로 몇 곳이고 규모가 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 주소 지오코딩으로 이어야 하며, 근처 대기측정소의 실외 대기질 자료와도 위치 기준으로만 연결된다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 다중이용시설의 실내 공기질과 관련된 정보를 제공하고 있습니다. 본 데이터는 시설 유형별 연면적과 주소 등 시설 개요 및 데이터 기준일자를 포함하고 있습니다. 이 자료는 공공시설 내 실내환경 현황 파악, 환경 위생 평가 등 관련 자료로 활용 될 수 있는것으로 판단 됩니다.또한 지역 실내공기질 개선 정책 수립, 환경보건 행정 등 행정적 실무 및 정책 수립의 기반 자료로 기능할것으로 판단 됩니다. 본 데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
