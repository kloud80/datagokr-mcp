description_portal: 대구광역시 중금속 측정망 5개 지점에서 일정 기간 동안 채취한 대기 시료를 유도결합플라즈마 분광분석기(ICP, Inductively Coupled Plasma)로 분석한 결과를 정리한 자료입니다. 분석 대상 항목은 납(Pb), 카드뮴(Cd), 크롬(Cr), 구리(Cu), 망간(Mn), 철(Fe), 니켈(Ni), 알루미늄(Al), 칼슘(Ca), 마그네슘(Mg), 비소(As), 베릴륨(Be) 등 총 12종의 중금속으로, 각 항목별 대기 중 농도 값이 포함되어 있습니다. 이 데이터는 지역 내 대기질 수준을 정밀하게 평가하고, 중금속 오염에 따른 환경보건 영향을 예측하거나 건강 영향 연구, 오염 저감 정책 수립 등에 기초 자료로 활용될 수 있습니다.
