summary_user: 경상북도 구미시 관내 폐건전지·폐형광등 수거함을 설치 지점별로 담은 파일로, 읍면동·도로명/지번 주소·세부위치·수거품목·함별 보유수량·관리기관 연락처가 들어 있다(csv 약 36KB). 주민이 "우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리나"를 찾거나, 시청 담당자·분석가가 읍면동별 수거함 분포의 균형과 추가 설치 필요성을 따지는 데 쓴다. 전역 조인 키는 없어 주소(도로명·지번)나 읍면동 이름으로 다른 생활폐기물 배출 지점·행정구역 자료와 맞춰 이어 쓴다.
description_portal: 경상북도 구미시 관내의 폐건전지 및 폐형광등 수거함 현황 자료입니다. 이 자료에는 읍면동별 설치 위치를 비롯해 지번 주소와 도로명 주소가 함께 제공되어 구체적인 위치 확인이 가능합니다. 또한 수거함의 세부 설치 장소와 관리되는 수거품목(폐형광등, 폐건전지), 보유수량 등에 대한 정보도 포함되어 있어 생활폐기물 재활용 정책을 진단하는 데 활용할 수 있습니다. 해당 데이터는 주민들이 생활권 내에서 가까운 수거함을 쉽게 찾도록 지원하고, 동시에 지자체의 자원순환 행정 현황을 파악할 수 있는 근거자료가 됩니다. 나아가 지역별 수거함 분포의 균형성을 검토하거나 추가 설치 필요성을 판단하는 데에도 중요한 기초자료로 활용될 수 있습니다.
