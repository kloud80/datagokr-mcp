summary_user: 서귀포시 안의 잠재오염원을 지점 한 곳당 한 행으로 담은 파일로, 오염원 구분·오염원명·소재지 주소·위도·경도를 개별 지점 단위로 담는다(CSV 약 4KB의 소규모 목록). 지자체 담당자나 연구자·주민이 '우리 동네 지하수·토양에 영향을 줄 수 있는 오염원이 어디에 몰려 있나'를 지도로 확인하고 우선 감시 대상을 고르는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표를 기준으로 공간 매칭하거나 오염원명으로 대조해 잇는다.
description_portal: 이 데이터는 서귀포시 지역 내 환경 영향을 미칠 가능성이 있는 잠재오염원들의 위치 및 기본 정보를 제공하는 자료입니다. 항목으로는 오염원 구분, 오염원명, 소재지 주소, 위도 및 경도 등이 포함되어 있어, 해당 지점들이 지하수․토양․생활환경 등에 미치는 잠재적 영향 범위를 평가하는 데 유용합니다. 지자체 및 환경관리 기관은 이 데이터를 활용해 오염원 분포 파악, 우선 감시 대상 지정, 주민 안내 및 민원 대응, 오염 예방 전략 수립 등에 활용할 수 있으며, 연구자나 시민단체는 공간 시각화나 영향 분석을 통해 환경 안전성 증진 방안을 탐색할 수 있습니다.
