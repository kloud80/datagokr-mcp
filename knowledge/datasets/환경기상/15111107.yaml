description_portal: 대전광역시 2021년 전국 폐기물 발생 및 처리 현황 등 폐기물 통계_생활 폐기물 발생량 자료는 해당 연도 동안 대전 지역 내에서 생활 폐기물로 분류된 폐기물의 발생 규모를 계량적으로 정리한 자료입니다. 본 자료는 생활 폐기물 발생량을 자치구 별 구분하였고, 일반 생활계 폐기물과 음식 물류 폐기물, 재활용 가능 자원, 대형 폐기물 등의 세부 항목으로 구분하여 제공됩니다. 이를 통해 폐기물 발생의 추이 변화 특성 등을 정확하게 파악할 수 있어 폐기물 감량 정책 수립, 수거 시스템 개선, 예산 배분의 효율화, 재활용률 제고, 폐기물 관련 인프라 계획 수립 등에 폭넓게 활용될 수 있습니다. 본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
