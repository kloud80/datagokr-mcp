description_portal: 환경책임보험 이용자 통계는 시스템을 이용하는 사용자 현황을 관리하고, 인허가기관별 담당자 분포를 파악하기 위해 집계되는 자료입니다.이 통계는 통계기준일자를 기준으로 산출되며, 각 사용자에 대해 인허가행정지역을 통해 소속 기관 및 지역 단위로 구분할 수 있습니다. 또한, 사용자의 계정상태를 함께 기록하여 활성 계정, 비활성 계정, 휴면 계정 등 계정 운영 현황을 확인할 수 있습니다.특히, 인허가기관 내 담당 업무별 사용자 분포를 파악하기 위해 대기 인허가 담당 여부, 수질 인허가 담당 여부, 폐기물 인허가 담당 여부, 토양 인허가 담당 여부, 화학 인허가 담당 여부, 해양 인허가 담당 여부 항목을 구분하여 관리합니다. 이를 통해 특정 환경 분야별 담당자가 실제로 어느 정도 배치되어 있는지를 확인할 수 있습니다.각 조건에 해당하는 이용자수를 집계하여 기관 및 지역별 사용자 규모를 파악합니다. 이러한 통계는 환경책임보험 제도의 운영 효율성을 높이고, 인허가 행정 지원 체계를 강화하기 위한 기초자료로 활용됩니다.
