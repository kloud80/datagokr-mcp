summary_user: 한국수력원자력 원자력발전소 안에서 쓰는 화학물질의 사용신청을 신청 건별로 담은 파일(csv, 약 31만 바이트)로, 발전소·사용처(부서)·작업명·사용기간 시작일·신청 진행상태를 기록한다. 원전 안전·환경 분석가나 지역 주민이 특정 발전소에서 어떤 작업에 화학물질 사용신청이 언제 얼마나 이뤄졌고 승인 등 진행상태가 어떤지 확인하는 데 쓴다. 실측 컬럼에 사업자번호·좌표 같은 전역 조인 키가 없어 다른 데이터와는 발전소명을 이름으로 맞추거나 같은 기관(한국수력원자력) 자료끼리만 이어 쓴다.
