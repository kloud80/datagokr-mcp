description_portal: 이 데이터는 한국남부발전이 출자한 복합발전 회사들의 화학대기 배출물 실적을 연도별로 정리한 자료입니다. 각 출자회사의 위치, 지분율, 사업내용, 설비용량, 사용 연료와 함께 2019년부터 2025년까지의 연도별 배출량(톤 단위)을 확인할 수 있습니다. 주요 사업장은 울산, 대구, 경기, 충남 지역에 위치하고 있으며, LNG를 주 연료로 사용하는 복합발전소 운영에 따른 배출 현황을 담고 있습니다. 본 자료는 발전소 운영이 환경에 미치는 영향을 파악하고, 온실가스 및 대기오염 저감을 위한 관리 정책 수립에 활용할 수 있는 기초자료로서 의미가 있습니다. 또한 기업의 친환경 경영 성과를 평가하고 지속가능한 에너지 전환 방향을 분석하는 데 유용한 정보입니다.
