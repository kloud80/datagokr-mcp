summary_user: 경기도에서 건축물 에너지효율등급 인증을 받은 건물을 한 건씩 담은 목록으로, 예비인증·본인증 구분, 건축물명, 건물 용도와 주용도, 신청지역, 등급(1++등급~7등급), 인증업체, 인증서 발행일, 인증년도, 인증기관을 담는다. 정책 분석가나 건축 설계자가 '경기도에서 최근 몇 년 사이 공동주택의 고등급 본인증이 얼마나 늘었나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 건축물명·신청지역(aply_region) 같은 이름을 맞춰 연결하거나 인증기관명으로 묶어 비교해야 한다.
description_portal: 데이터는 에너지 절약과 친환경 건축을 장려하기 위한 건축물 에너지효율등급 인증제도에 따라 인증받은 건축물 목록으로, 인증구분(예비인증/본인증), 건축물명, 건물용도 및 주용도, 신청지역, 에너지효율등급(1++등급~7등급), 인증업체명, 인증서 발행일, 인증년도, 인증기관명, 데이터 기준일자 등으로 구성되어 있습니다. 본 데이터는 공동주택, 단독주택, 교육연구시설 등 다양한 용도의 건축물에 대해 에너지 성능을 사전 또는 사용승인 시점에 평가한 결과를 포함하고 있어, 에너지 효율 설계 참고, 친환경 건축물 기준 마련, 에너지 정책 수립, 녹색건축 인증 연계 등에 유용하게 활용될 수 있습니다.
