description_portal: 본 자료는 인천광역시 미추홀구 내 쓰레기봉투 판매소에서 판매된 종량제 봉투 및 스티커의 판매·반품 현황을 정리한 통계 자료입니다. 데이터에는 품목별 판매수량, 판매금액, 반품수량, 반품금액이 포함되어 있으며, 일반용(가정용), 사업장용, 음식물 처리용 봉투, 재사용 봉투 및 스티커 구매 현황까지 구분되어 있습니다. 이를 기반으로 지역 내 소비 규모, 판매 패턴, 품목별 수요를 파악할 수 있습니다. 일반가정용 봉투는 5L부터 75L까지 다양하게 제공되며, 특히 10L·20L 단위 판매가 많은 비중을 차지합니다. 음식물 쓰레기 봉투는 1L~20L 사이 다양한 규격으로 판매되고 있으며, 스티커류는 쓰레기량에 따른 추가 비용 정산 및 규격 외 폐기물 처리 목적에 활용됩니다.
