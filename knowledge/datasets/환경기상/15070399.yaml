summary_user: 국가 온실가스 인벤토리 중 아산화질소(N2O) 배출량을 에너지·산업공정·농업·LULUCF·폐기물 분야별로 나눠 1990년부터 2023년까지 연도별 열에 담은 전국 단위 집계표이다(단위 백만톤 CO2 eq.). 연구자나 정책 분석가가 "농업 분야 N2O 배출이 1990년 이후 어떻게 변했고 전체 배출에서 어느 분야 비중이 큰가"를 따질 때 쓴다. 전역 조인 키는 없으며, 같은 센터의 다른 가스별(CO2·CH4 등) 인벤토리 파일과 분야명·연도를 기준으로 맞춰 붙여 쓴다.
description_portal: '* 국가 온실가스 통계는 MPGs 제50항의 규정에 따라 에너지, 산업공정 및 제품 사용, 농업, 토지이용･토지이용 변화 및 임업(Land Use, Land-Use Change and Forestry, 이하 LULUCF), 폐기물, 총 5개 분야로 구분하여 산정하고 있다.* ETF의 이행을 위한 투명성체계 방식･절차･지침(Modalities, Procedures and Guidelines, 이하 MPGs) 제48항･제49항의 규정에 따라 국내에서 배출한 7개의 온실가스(이산화탄소(CO2), 메탄(CH4), 아산화질소(N2O), 수소불화탄소(HFCs), 과불화탄소(PFCs), 육불화황(SF6), 삼불화질소(NF3))에 대한 배출･흡수량 정보를 보고한다.* 온실가스종합정보센터에서 작성한 국가 온실가스 통계는 관리위원회의 심의를 통해 최종적으로 확정되며 온실가스종합정보센터와 통계청의 공식 누리집(홈페이지)을 통해 대외적으로 공표된다.국가 온실가스 배출원 중 농업분야에서 주로 배출된다* 단위: 백만톤 CO2 eq., NO = 배출활동 및 공정이 없는 경우, NE = 산정하지 아니하는 경우, NA = 자연적, 이론적으로 발생하지 않는 활동 및 공정의 경우, IE = 다른 항목에 포함하여 보고하는 경우, C = 기밀정보인 경우'
