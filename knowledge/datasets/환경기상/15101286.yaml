description_portal: 충청북도 제천시의 벙커C유사업장현황입니다.연번 사업장명, 소재지, 전화번호, 연료, 사용량(톤), 주생산품, 데이터기준일의 자료로 구성되어 있습니다.중유(벙커C유)는 대체로 선박 및 화력 발전, 화장장에 널리 사용되고 있으며, 디젤 엔진, 증기터빈 보일러 및 가스터빈 등의 기관의 연료로 쓰인다. 증기 기관차가 상업운전되던 시대에는 같이 딸리는 탄수차에 중유탱크를 탑재하여 화력보충의 용도로 중유를 공급하거나 아예 중유만 쓰는 경우도 있다.해당 데이터에 대해 담당하는 부서는 자연환경과이고, 담당자번호는 043-641-6393 입니다. 해당데이터에 대해 문의가 있다면 담당자에게 연락해주시기 바랍니다.
