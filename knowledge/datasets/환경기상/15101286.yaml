summary_user: 충청북도 제천시에서 벙커C유(중유)를 연료로 쓰는 사업장을 한 행씩 담은 목록으로, 사업장명·소재지·연락처·연료 종류·연간 사용량(톤)·주생산품·데이터기준일을 담는다. 제천시 안에서 어느 사업장이 벙커C유를 얼마나 쓰는지 확인하려는 지역 대기 배출원 분석가나 주민이 쓴다. 전역 조인 키(사업자번호·코드)는 없어서 다른 배출시설·사업장 데이터와는 사업장명이나 소재지 주소를 맞춰 이어 붙인다.
