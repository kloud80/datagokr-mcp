summary_user: 인천광역시 서해구 관내에서 준공된 지하수개발이용시설을 시설 한 건씩 담은 원장으로, 소재지 주소, 굴착깊이(m), 하루 취수계획량(㎥/일), 준공일자를 포함한다(CSV 약 3.5KB 규모). 구 안 어느 동네에 관정이 몰려 있고 얼마나 깊게 파서 하루 얼마를 뽑아 쓰도록 허가·준공됐는지 확인하려는 주민·환경 담당자·수자원 분석가가 쓴다. 전역 조인 키는 없어서 소재지 주소를 행정구역 이름이나 좌표로 바꿔 지하수 수질검사·오염원 자료와 맞춰 쓴다.
description_portal: 본 공공데이터는 인천광역시 서해구 관내의 지하수개발이용시설 중 준공된 시설의 현황을 정리한 데이터입니다. 본 공공데이터는 인천광역시 서해구 내 지하수개발이용시설의  각 소재지, 굴착깊이, 일일 취수계획량, 준공일자 등의 정보를 포함하고 있습니다. 본 데이터를 통해 행정구역별 지하수 개발 완료 현황 파악, 수자원 개발 계획 수립, 환경 영향 분석 등의  환경관련 정책이나 관련 기초자료로도 활용될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적으로 최신정보를 반영하고 있습니다.
