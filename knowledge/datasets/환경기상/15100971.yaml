summary_user: 충청북도 진천군에서 벙커C유·정제유 같은 중질유를 연료로 쓰는 사업장을 한 행에 한 곳씩 담은 목록으로, 사업장명·소재지·연락처·생산품·연료 종류와 월·연간 사용량을 담는다(파일 크기 약 1.3KB의 소규모 CSV). 지자체 환경 담당자나 분석가가 '진천군에서 중질유를 많이 쓰는 대기오염 관리 대상 사업장은 어디이고 연료전환 대상은 누구인가'를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·소재지 주소를 맞춰 대기배출사업장 목록 등 같은 지역 자료와 이어 쓴다.
