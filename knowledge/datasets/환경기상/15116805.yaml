summary_user: 한국중부발전(주) 발전 사업소의 방류수 수질오염물질 배출 농도(화학적산소요구량·총유기탄소·부유물질량·총질소·총인·수소이온농도)를 사업소·측정지점·측정기간별로 허용기준과 나란히 담은 소규모 CSV 파일(약 2.6KB)이다. 지역 주민이나 환경 분석가가 발전소 방류수가 항목별 허용기준 안에서 관리되고 있는지, 기간에 따라 농도가 어떻게 변했는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명·측정지점 이름을 맞추거나 같은 기관 자료끼리만 이어 쓰며, 하천·댐 등 수자원 수질 측정 자료와는 같은 물 맥락에서 참고로 함께 본다.
