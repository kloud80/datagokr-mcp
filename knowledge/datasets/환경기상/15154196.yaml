summary_user: 경기도 시군별 산책로를 한 줄씩 담은 목록으로, 산책로 이름과 시군명, 시작 지점(시점)과 끝 지점(종점)의 주소를 담는다. 주민이나 지자체 담당자가 '우리 시군에 하천·저수지·해안을 따라 난 산책로가 어디서 시작해 어디서 끝나는지' 확인하거나 여가·관광 동선을 짜는 데 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)이나 시종점 주소를 이름 매핑해 다른 경기도 시설 데이터와 이어야 한다.
description_portal: 이 데이터는 경기도의 산책로 현황을 나타낸 자료로, 산책로가 시작되는 지점(시점)과 끝나는 지점(종점)의 주소, 산책로 이름, 그리고 해당 산책로가 위치한 시군명을 포함하고 있습니다. 산책로는 하천, 저수지, 해안 등을 따라 조성된 경우가 많으며, ‘산책로명’에는 ‘제비꼬리길’, ‘황금해안길’, ‘오성강변 자전거도로’ 등 지역 특성을 반영한 명칭이 사용됩니다. 이 자료는 도시민의 여가 및 건강 활동 지원, 관광자원 개발, 지역 특화형 자연경관 조성 등의 목적으로 활용될 수 있습니다. 또한, 산책로 관리 및 보완이 필요한 구간을 파악하고, 자연환경과 조화를 이루는 생활 인프라 개선에 참고 자료로 활용됩니다.
