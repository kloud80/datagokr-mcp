summary_user: 덕유산국립공원에서 조사된 생물종의 출현 기록을 건별로 담은 파일로, 생물분류(포유류·조류·양서류·곤충·식물 등), 종명·학명·국문 분류명, 조사위치·주소, 경도·위도 좌표, 조사일자, 개체수를 함께 싣는다. 연구자나 공원 관리자가 '덕유산 안에서 특정 종이 어디서, 언제, 몇 개체 관찰됐는가'를 확인하거나 종 분포 지도를 그릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 학명·종명 같은 이름으로 맞추거나 경도·위도 좌표로 공간 중첩해 이어 쓴다.
limits: 표준 종 코드나 행정코드 같은 공통 키가 없어 다른 생물종·보호구역 데이터와 연결하려면 이름 매핑이나 좌표 처리를 따로 해야 한다. 포털 설명에 '오대산국립공원'이 섞여 있으나 제목과 컬럼 기준으로는 덕유산국립공원 자료로 보고 국립공원 컬럼을 확인해 쓴다.
