description_portal: 덕유산국립공원 내 생물자원 현황을 수록한 자료로, 해당 지역의 생물다양성 보전과 종 분포 현황 분석을 위한 기초 생태 데이터를 제공합니다. 주요 항목에는 국립공원명, 생물분류(포유류, 조류, 양서류, 곤충, 식물 등), 종명(영문), 학명(영문), 분류명(국문), 조사 위치 정보(경도·위도 좌표), 조사일자, 개체수 등이 포함됩니다. 이 자료는 오대산국립공원 내 주요 생물종의 출현 현황과 서식지 분포를 파악하고, 멸종위기종 보호, 생태계 건강성 진단, 자연자원관리계획 수립, 생태교육 콘텐츠 개발 등 다양한 분야에 활용될 수 있습니다. 데이터는 CSV 포맷으로 제공되며, 국립공원 생물자원통합관리시스템(NP-BIMS) 및 공간정보 기반 시스템과 연계하여 시각화 및 분석이 가능합니다.
