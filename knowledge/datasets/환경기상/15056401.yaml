summary_user: '2025년 광주광역시(현 전남광주통합특별시) 폐기물재활용업체를 업체 한 곳당 한 행으로 담은 원장형 파일로, 재활용업 구분(중간·최종·종합), 업체명, 대표자, 소재지, 영업대상 폐기물을 담는다. 특정 폐기물(예: 폐합성수지, 건설폐기물)을 재활용 처리할 수 있는 업체가 우리 구 근처에 어디 있는지 찾는 배출 사업자나, 자치구별 재활용업 분포를 보려는 분석가가 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 주소를 맞추는 방식으로만 이어 쓴다.'
description_portal: 2025년 광주광역시 폐기물재활용업 현황입니다. 업체명, 대표자명, 소재지, 영업대상폐기물을 포함합니다. 폐기물재활용업은 중간재활용업, 최종재활용업, 종합재활용업으로 구분됩니다. 중간재활용업은 재활용시설을 갖추고 중간가공 폐기물을 만드는 영업이고 최종재활용업은 재활용시설을 갖추고 중간가공 폐기물을 재활용하는 영업이고, 종합재활용업은 재활용시설을 갖추고 중간재활용업과 최종재활용업을 함께 하는 영업입니다. 폐기물관리법에 따라 폐기물을 재활용하기 위해 시설을 설치하고 운영하려는 사업자가 관할 구청에 사업계획서를 접수하고 이를 승인받은 뒤 재활용업을 시작합니다. 각 자치구에서 인허가 및 지도점검 업무를 수행하고 있으며, 관할 자치구별 담당 부서는 동구 자원순환과(062-608-2506), 서구 자원순환과(062-360-7971), 남구 환경관리과(062-607-3651), 북구 청소행정과(062-410-6518), 광산구 청소행정과(062-960-8481) 입니다. 사업장별 영업 여부 등 자세한 사항은 관할 자치구에 문의하시면 안내받으실 수 있습니다.
