description_portal: '"생활폐기물소각시설"은 일상생활에서 발생하는 폐기물(쓰레기)을 고온에서 태워서 처리하는 시설을 의미합니다. 이 시설은 도시의 폐기물 처리 시스템에서 중요한 역할을 하며, 폐기물의 부피를 줄이고, 일부 에너지를 회수하며, 위생적인 처리를 가능하게 합니다.주요 기능1. 폐기물 감량: 부피와 중량을 약 90% 이상 줄일 수 있음2. 위생적 처리: 병균이나 해충 등을 제거3. 에너지 회수: 소각 시 발생하는 열을 이용하여 증기, 온수, 전기 생산 가능4. 환경 보호: 적절한 배기 가스 처리를 통해 환경오염 최소화창녕군시설관리공단 생활폐기물 소각시설 염화수소, 질소산화물, 일산화탄소, 먼지 등 대기오염 물질 현황에 대한 데이터를 제공합니다.'
