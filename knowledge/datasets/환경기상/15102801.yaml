description_portal: 부산광역시 동물원 현황 정보입니다. 동물원 정보는 2024년 동물원 연보 기준으로 작성되었으며, 공개되는 정보는동물원명, 동물원 소재지, 동물원 등록일, 보유 동물, 운영, 실내 형 여부, 총 면적, 사무 연구실, 전시 사육 시설, 진료 격리 시설 면적입니다. 동물원에 대한 현황은 "동물원 및 수족관의 관리에 관한 법률"에 따라 매년 부산시에 제출되는 동물원 연간보고에서 추출하였으며,보유동물에 대핸 현황은 공공기관의 정보공개에 관한 법률에 따른 비공개 대상 정보임을 알려드립니다.데이타에 관한 추가적인 문의는 부산시 환경정책과(051-888-3634)로 연락주시면, 성심껏 안내해 드리겠습니다.
