summary_user: 환경공간정보서비스 환경주제도의 하나로, 지역별 대지(지목) 원단위 면적과 토지피복 면적을 나란히 두고 그 비율을 계산한 집계 파일(csv, 약 12KB)이다. 지자체·환경 분석가가 "우리 지역은 지적상 대지 면적에 비해 실제로 시가화된 피복 면적이 얼마나 되는가"를 비교할 때 쓴다. 전역 조인 키가 없어 지역 이름을 행정구역 코드표나 다른 지역별 통계에 직접 맞춰 연결해야 한다.
limits: 지역 이름 외에 표준 행정코드 같은 조인 키가 없어 다른 데이터와 붙일 때 이름 매핑이 필요하다. 필지나 건물 단위의 개별 판단(특정 토지에 무엇을 지을 수 있는지)에는 쓰지 않고 지역 단위 비교용으로만 본다.
