description_portal: 환경공간정보서비스에서 제공하는 지역별 대지 원단위 지목과 토지피복 면적을 비교하여, 대지 원단위 대비 토지피복 면적을 비율로 산출한 데이터 입니다.환경주제도란 주제별로 맞춤 정보 제공을 위해 환경분야 데이터를 지도화하여 시각화된 공간정보를 제공하고 설명을 추가하여 “주제도 + 콘텐츠”형태로 제작된 지도입니다.콘텐츠는 제작 근거, 배경, 사용 데이터베이스, 통계 등으로 구성되어 업무 담당자, 전문가, 연구자, 대국민 등 다양한 사용자들이 쉽게 주제도를 이해할 수 있도록 제공하고 있습니다.환경주제도의 주제 선정은 환경분야로 분류하여 크게 자연, 물, 기후·대기, 생활, 토양지하수, 기초지리의 6개 분야로 구분하고 각 분야별로 환경부에서 수행하고 있는 업무를 중심으로 구축가능성, 활용 데이터 여부, 업무 활용성을 고려하여 주제를 선정하였습니다.
