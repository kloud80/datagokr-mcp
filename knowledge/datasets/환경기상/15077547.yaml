summary_user: "서울 금천구 생활폐기물 수거차량의 동선을 22시부터 다음날 07시까지 30분 단위 행으로, 수거업체 4곳(한일환경·한일크린·금천환경·삼정환경서비스)의 차량별 열로 담은 작은 파일(약 5KB)입니다. 주민이 '우리 동네(예: 독산동) 쓰레기 수거차는 몇 시쯤 오는가'를 확인하거나, 분석가가 차량별 담당 동과 야간 운행 시간대를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 열 이름에 적힌 행정동 이름(가산·독산·시흥동 등)으로 매핑하거나 같은 기관의 다른 폐기물 파일과 나란히 보는 식으로만 연결한다."
