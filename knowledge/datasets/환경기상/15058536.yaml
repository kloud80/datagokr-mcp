summary_user: 경기도 약수터의 수질검사 결과를 연도·시군·지점별 건별 기록으로 담으며, 채수일, 주요 용도, 음용 여부, 수질 적합 여부, 기준 초과 항목과 결과를 포함한다. 주민이나 지자체 담당자가 '우리 동네 약수터 물을 마셔도 되는가, 어떤 항목이 기준을 넘었는가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 시군 이름·시군 코드(SIGUN_CD)나 지번·도로명 주소, 위경도 좌표로 매핑해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 약수터의 수질 상태를 개별 지점 단위로 측정한 결과를 바탕으로 구성된 자료로, 연도별·지점별 채수일과 음용 가능 여부, 수질 적합 여부 및 초과 항목 등이 포함됩니다. 약수터를 직접 음용수로 사용하는 이용자들의 건강을 보호하기 위해 실시된 검사 결과로, 각 지점의 수질 기준 충족 여부를 확인할 수 있으며, 위생관리 필요 지점이나 미검사 사유 등도 확인 가능합니다. 이 데이터는 음용수 안전성 평가, 환경위생 정책 수립, 지역별 약수터 관리 강화, 주민 건강 보호 방안 마련 등 다양한 공공 보건 및 환경 정책 수립에 활용될 수 있습니다.
