description_portal: 사업장폐기물배출자 의무에 따른 사업장폐기물배출자 신고현황 데이터로 사업장, 소재지, 폐기물 종류, 처리업소, 처리방법  등의 항목을 제공합니다.또한 사업장폐기물의 종류는○ 배출시설을 설치ㆍ운영하는 사업장에서 발생되는 모든 폐기물○ 「물환경보전법」에 따른 공공폐수처리시설, 「하수도법」에 따른 공공하수처리시설, 분뇨처리시설, 「가축분뇨의 관리 및 이용에 관한 법률」에 따른 공공처리시설을 설치ㆍ운영하는 사업장에서 발생되는 모든 폐기물○ 폐기물처리시설을 설치ㆍ운영하는 사업장에서 발생되는 모든 폐기물○ 지정폐기물을 배출하는 사업장에서 발생되는 폐기물○ 폐기물을 1일 평균 300킬로그램 이상 배출하는 사업장에서 발생되는 폐기물○ 「건설산업기본법」 제2조제4호에 따른 건설공사로 인하여 폐기물을 5톤 이상 배출하는 사업장에서 발생되는 폐기물 ○ 일련의 공사 또는 작업으로 인하여 폐기물을 5톤 이상 배출하는 사업장에서 발생하는 폐기물 등으로 구분됩니다.
