summary_user: 울산광역시 울주군에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 원장 파일로, 폐기물 구분·상호명·폐기물 종류·연락처·사업장 주소·데이터기준일자를 담는다. 울주군 안에서 어떤 사업장이 어떤 종류의 사업장폐기물을 배출한다고 신고했는지 확인하려는 주민·처리업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 사업장 주소를 맞춰 연결하고, 같은 기관의 폐기물 처리업 현황 등과 묶어 쓴다.
limits: 사업자번호 같은 공통 식별 키가 없어 다른 기관 데이터와 정확히 매칭하기 어렵고, 범위가 울주군 한 시군구에 그친다. 배출 사업장 원장이라 폐기물 발생량이나 처리 실적 통계는 담지 않는다.
