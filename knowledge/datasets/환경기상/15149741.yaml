summary_user: 아황산가스·일산화탄소·오존·이산화질소·미세먼지·초미세먼지 등 대기오염 항목별로 국가 환경기준과 경기도 기준을 1시간·8시간·일·연 평균 단위로 정리한 기준값 표이며, 측정 결과가 아니라 항목별 기준 수치(시행일자·사용여부 포함)를 담는다. 경기도 측정소에서 나온 농도가 국가기준이나 경기도기준을 넘었는지 판단하려는 분석가나 주민이 '이 오존 농도가 8시간 기준을 초과했나' 같은 질문에 쓴다. 전역 조인 키는 없어 같은 기관의 대기 측정 데이터와 항목코드(item_cd)나 항목명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 대기환경 측정을 위한 기준 수치를 담은 자료로, 아황산가스(SO2), 일산화탄소(CO), 오존(O3), 이산화질소(NO2), 미세먼지(PM-10), 초미세먼지(PM-2.5)에 대한 국내기준 및 경기도기준 정보를 제공합니다. 이 데이터는 대기오염의 장기적 경향 분석, 법적 기준 마련, 환경영향평가 기준 설정, 공공 건강기준 수립 등에 활용될 수 있습니다.*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
