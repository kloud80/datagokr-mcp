description_portal: 수원도시공사 주차관리부는 시민의 건강과 안전한 주차 환경 조성을 위해 관내 주차장을 대상으로 실내 공기질 측정을 체계적으로 실시하고 있습니다. 해당 데이터에는 주차장명을 비롯해 주차장의 규모와 구조적 특성 등 기본 정보가 포함되며, 미세먼지(PM), 이산화탄소(CO₂), 포름알데히드(HCHO), 일산화탄소(CO) 등 주요 오염물질의 측정 수치를 상세히 제공합니다. 또한 각 항목별 기준 충족 여부를 종합한 측정결과를 함께 제시하여 공기질 관리 현황 파악과 개선 대책 수립을 위한 기초 자료로 활용하고 있습니다.
