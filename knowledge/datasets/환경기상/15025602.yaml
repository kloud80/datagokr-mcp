summary_user: 수원도시공사가 관리하는 주차장별 실내공기질 측정 결과를 주차장 한 곳당 한 행으로 담은 파일로, 주차장명·주소·면적과 미세먼지·이산화탄소·포름알데히드·일산화탄소·이산화질소·라돈·총휘발성유기화합물 측정값, 기준 충족 여부(측정결과), 데이터기준일을 함께 담는다(csv 약 1KB). 시민이나 분석가가 "수원 공영주차장 실내 공기가 기준을 충족하는지, 어느 주차장의 라돈·이산화탄소 농도가 높은지" 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주차장명이나 주소를 문자열로 맞춰 잇는 방식으로만 연결한다.
limits: 공통 코드 없이 주차장명·주소로만 다른 주차장·대기질 데이터와 연결되므로 이름 표기 차이에 주의해야 한다. 파일 크기가 약 1KB로 수록 주차장 수가 적고, 측정소 기준 시간별 대기질이 아니라 주차장 단위 측정 결과이므로 실시간 대기 상태 판단에는 맞지 않는다.
