summary_user: 서귀포시 관내 환경오염물질 배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·소재지·위도·경도와 업종, 대기·수질 오염물질 종별과 등급을 포함한다(4KB 남짓의 작은 CSV). 지역 주민이나 분석가가 "우리 동네 주변에 대기·수질 배출 사업장이 어디 있고 몇 종인가"를 확인하거나 GIS 지도에 배출원을 표시하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 위도·경도 좌표를 이용한 공간 결합으로만 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘공통환경오염물질배출사업장현황’ 데이터는 서귀포시 관내 환경오염물질을 배출하는 사업장의 위치 및 오염 유형 정보를 종합적으로 담고 있는 공공데이터입니다.데이터는 사업장명, 도로명·지번 주소, 위도·경도, 업종, 대기・수질 오염 종류 및 등급, 데이터 기준일자 등의 항목으로 구성되어 환경부 및 지방자치단체의 오염 배출 영향평가, 환경 규제 관리, 오염 저감 정책 수립, GIS 기반 환경모니터링, 연구·학술 분석 등에 유용하게 활용될 수 있습니다.CSV 파일을 통해 접근 가능하며 연간 단위로 갱신됩니다.
