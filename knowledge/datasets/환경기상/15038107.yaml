description_portal: 서울특별시 강서구 내 설치된 폐형광등 및 폐건전지 분리수거함의 위치 정보입니다.생활폐기물 중 유해성 물질이 포함된 전구류 및 건전지류의 안전한 수거와 재활용을 유도하기 위한 목적에서 구축된 자료입니다. 주요 항목으로는 설치된 행정동, 정확한 주소지, 관리부서 정보 등이 포함되며, 지역 주민들이 가까운 수거함 위치를 쉽게 확인할 수 있도록 제공됩니다. 폐형광등은 수은 등의 중금속을 포함하고 있으며, 폐건전지는 니켈, 카드뮴, 리튬 등의 유해물질이 함유되어 있어 일반 쓰레기와 함께 폐기 시 토양 및 수질 오염 등 환경에 심각한 영향을 끼칠 수 있습니다.이에 따라 공공기관에서는 안전한 회수를 통해 환경오염을 예방하고, 자원 재활용률을 높이기 위해 수거함을 다양한 생활권 공간에 설치하고 있습니다. 본 데이터는 향후 스마트 분리배출 시스템 연계, 환경교육 자료, 폐기물 발생량 분석, 수거 효율성 개선 등 다양한 정책적 활용이 가능합니다.
