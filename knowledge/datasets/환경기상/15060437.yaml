summary_user: 경상북도 영양군에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 원장으로, 신고번호·상호·생활계/사업계 구분·폐기물 종류·배출량(톤)·사업장 주소·업무구분·기준일자가 들어 있다. 영양군 안에서 어떤 사업장이 어떤 폐기물을 얼마나 배출한다고 신고했는지 확인하려는 환경관리 담당자나 분석가가 관리대상 사업장 목록을 뽑는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·사업장 주소를 이름 매칭하거나 같은 영양군 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 일정 규모 이상의 폐기물을 배출하는 사업장이 「폐기물관리법」에 따라 관할 행정기관에 신고한 사업장폐기물 배출자 현황을 정리한 자료입니다.각 사업장별로 신고번호, 상호(업체명), 생활계/사업계 구분, 폐기물의 종류, 배출량(톤), 사업장 주소, 업무구분, 그리고 데이터 기준일자 정보가 포함되어 있습니다.이 자료는 사업장의 폐기물 처리 책임을 명확히 하고, 지역 내 폐기물 발생 및 관리 실태를 분석하여 자원순환 정책 및 환경관리 전략 수립에 활용됩니다. 특히, 환경오염 예방, 불법 투기 방지, 폐기물 감축을 위한 관리대상 사업장 모니터링의 기초자료로 사용됩니다.
