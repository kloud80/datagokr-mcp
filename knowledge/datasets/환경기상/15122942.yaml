summary_user: 경기도 내 대기환경측정망(도시·도로변) 측정소별로 아황산가스·일산화탄소·오존·이산화질소·미세먼지·초미세먼지의 8시간 평균 농도를 측정일자 단위로 담은 측정소별 원시 측정자료다. 경기도 주민이나 환경 분석가가 "우리 시군 측정소의 여름철 오존 8시간 평균이 얼마나 높았나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 이름·측정소명(mesure_plc_nm)이나 경기도 자체 측정소 코드로 맞춰 이어 쓴다.
description_portal: 경기도내 측정소별 대기질 측정자료입니다. 월별 아황산가스(SO2)농도, 일산화탄소(CO)농도, 오존(O3)농도, 이산화질소(NO2)농도, 미세먼지(PM-10), 초미세먼지(PM-2.5) 농도값을 제공합니다. 특히 오존은 여름철 강한 일사와 관련된 광화학 반응으로 농도가 증가할 수 있어, 8시간 단위 농도 관리는 매우 중요합니다*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
