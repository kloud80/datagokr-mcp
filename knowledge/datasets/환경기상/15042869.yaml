summary_user: 제천시 관내 수해상습지를 지구별로 정리한 파일 데이터로, 지구명·하천등급·하천명·사업량·사업비·데이터기준일자를 담는다(csv 328바이트의 소규모 목록). 주민이나 하천·방재 담당자가 "제천 어느 하천 구간이 상습 침수지로 정비 대상이며 사업비는 얼마인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 하천·재해 데이터와는 하천명이나 지구명을 이름으로 맞춰 잇는다.
description_portal: 충청북도 제천시 수해상습지 현황에 대한 공공데이터로, 제천시 관내에 위치한 수해상습지를 대상으로 구축된 자료입니다. 본 데이터는 지구명, 하천등급, 하천명, 사업량, 사업비 등 수해상습지와 관련된 기본적인 항목을 포함하고 있으며, 각 수해상습지의 특성과 정비 규모를 파악할 수 있도록 구성되어 있습니다. 해당 항목들은 제천시 수해상습지 정비 사업과 관련된 전반적인 현황을 확인하기 위한 목적으로 제공되며, 사업 추진 여부와 정비 계획을 이해하는 데 활용할 수 있습니다. 본 자료는 제천시 수해상습지 현황을 체계적으로 정리한 자료로서, 수해상습지 정비 사업의 추진 현황과 관리 현황을 종합적으로 파악할 수 있도록 작성되었습니다. 또한 제천시 관내 수해상습지와 관련된 기본적인 정보를 제공함으로써, 재해 예방 및 하천 관리 정책 수립을 위한 기초자료로 활용될 수 있도록 구축된 데이터입니다.
