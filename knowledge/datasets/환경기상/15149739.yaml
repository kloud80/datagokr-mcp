summary_user: 경기도 대기환경 측정항목(아황산가스·일산화탄소·오존·이산화질소·미세먼지·초미세먼지)별로 좋음·보통·나쁨·매우나쁨 등급을 나누는 기준값을 항목 한 행씩 담은 기준표다. 경기도 측정소의 시간별 농도를 받은 분석가나 앱 개발자가 "이 측정값이 어느 등급에 해당하나"를 판정하는 데 쓴다. 전역 조인 키는 없으며, 같은 기관(경기도) 대기 측정자료와 항목코드(item_cd)나 항목명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 다양한 대기오염물질에 대한 환경지표(측정항목)별 지수등급 기준값을 제공하는 자료입니다. 시간대별 아황산가스(SO2), 일산화탄소(CO), 오존(O3), 이산화질소(NO2), 미세먼지(PM-10), 초미세먼지(PM-2.5)에 대한 항목별 좋음, 보통, 나쁨, 매우나쁨에 대한 등급 정보를 제공합니다.*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
