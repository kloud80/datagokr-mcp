summary_user: 전주시 관내에 설치된 쓰레기 불법투기 단속용 CCTV를 설치 지점별로 담은 건별 현황 파일로, 지점마다 도로명·지번주소, 위도·경도, 설치년도, 수량, 담당부서와 연락처가 있습니다. 시민이 우리 동네 무단투기 단속 카메라가 어디에 있는지 확인하거나, 분석가가 단속 CCTV가 부족한 취약지역을 찾을 때 씁니다. 전역 조인 키는 없어서 다른 데이터와는 주소나 좌표를 기준으로 공간 결합하거나, 같은 전주시가 낸 생활폐기물 배출·수거 지점 파일과 지역명으로 맞춰 이어 씁니다.
description_portal: 전북특별자치도 전주시 쓰레기 불법투기 단속 CCTV 설치 현황 데이터는 생활폐기물 불법투기 예방과 쾌적한 도시환경 조성을 위해 전주시 관내에 설치된 단속용 CCTV 현황 정보를 시민에게 투명하게 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 구분, 도로명주소, 지번주소, 위도, 경도, 설치년도, 수량, 담당부서, 연락처 등의 항목으로 구성되어 CCTV 설치 위치 및 관리 현황을 종합적으로 확인할 수 있도록 하였습니다.특히 위치정보(위도·경도)와 설치년도, 수량 정보를 함께 제공함으로써 지역별 단속 인프라 분포를 파악하고 환경관리 정책 수립, 단속 취약지역 분석, 도시환경 개선 연구 등에 활용할 수 있도록 설계되었습니다. 또한 시민이 불법투기 단속 체계에 대한 정보를 확인하고 관련 문의를 할 수 있도록 담당부서 및 연락처 정보를 포함하였습니다.전주시는 본 데이터를 통해 환경관리 행정의 투명성과 책임성을 강화하고 시민 참여 기반의 도시환경 개선을 도모하는 것을 목표로 하며, 신규 설치, 이전 및 철거 등 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 구청 청소위생과에서 제공·관리합니다.
