summary_user: 해양환경측정망과 해양생물조사의 조사정점을 정점 1곳당 한 행으로 담은 전국 단위 목록으로, 측정망 이름, 정점 분류, 생태구역, 해역명, 정점명, 위도·경도 좌표, 개략 위치 설명을 포함한다. 해양 수질 측정값이 어느 바다의 어느 지점에서 나온 것인지 지도에 표시하거나, 특정 해역에 어떤 조사정점이 있는지 확인하려는 분석가·연구자가 쓴다. 전역 조인 키가 없어 측정 결과 데이터와는 정점명·해역명 같은 이름을 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 해양환경측정망의 각 조사정점과 해양생물조사정점의 정보를 관리, 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 측정망의 명칭, 조사정점 분류정보, 생태구역명, 정점의 명칭과 북위, 동경 좌표 정보 및 개략적인 위치 설명 등 정보로 구성되어 있습니다.  본 데이터는 해양환경 변화 모니터링, 조사 지역의 환경관리 계획 수립, 특정 해역 생태계 현황 분석, 조사정점 기반의 추가 현장 연구 설계, 해양 환경 관련 정책 수립 등 활동을 위한 기초 자료로 활용될 수 있습니다.
