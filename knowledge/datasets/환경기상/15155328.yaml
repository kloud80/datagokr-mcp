summary_user: 경기도 내 대기배출시설 사업장이 상반기·하반기마다 실시한 자가측정 결과를 사업장·배출구·측정항목별로 담은 건별 원천 자료로, 먼지·벤젠·니켈 화합물 등 항목의 측정농도와 일일유량, 측정대행업체, 분석방법을 포함한다. 주민·분석가가 "우리 동네 산업단지의 어느 사업장이 어떤 오염물질을 얼마나 배출했는가"를 확인하거나 업종별 배출 특성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·사업자등록번호(bizregno)·업종코드·산업단지명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 대기배출시설을 운영하는 사업장이 반기별로 실시한 자가측정 결과를 기록한 자료로, 사업장의 배출가스 성분을 측정하고 그 결과를 환경당국에 보고하기 위해 사용됩니다. 주요 항목은 사업장명, 업종코드, 업종명, 산업단지, 관할관청, 측정형태, 측정대행업체, 배출구정보, 측정항목 및 측정농도, 일일유량, 측정분석방법 등을 포함합니다. 반기구분(상반기/하반기)을 기준으로 보고되며, 측정항목에는 먼지, 벤젠, 니켈 화합물 등 유해 대기오염물질이 포함되어 있고, 분석 방법은 유도결합플라즈마분광법, 원자흡수분광광도법, 이온크로마토그래피법 등 다양한 정량 측정 기술이 적용됩니다. 이 데이터는 배출농도 초과 여부 판단, 업종별 오염특성 분석, 대기환경 개선 정책 수립, 사업장 관리 우선순위 설정 등에 활용될 수 있습니다.
