summary_user: 인천광역시 제물포구(포털 설명상 옛 동구 관내)에서 음식물쓰레기를 월 1톤 이상 배출하는 사업장을 업소 한 곳당 한 행으로 담은 소규모 파일(csv, 약 2.6KB)로, 업소명·업종·주소·전화번호·수거형태·월 예상배출량을 수록한다. 구청 담당자나 수거업체가 '관내 어느 음식점·급식시설·대형매장이 다량배출 관리 대상이고, 민간 위탁·직접 처리 중 어떤 방식으로 수거되는가'를 확인해 수거 차량 운영이나 점검 대상을 정할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 업소명을 맞춰 연결하거나 같은 기관의 다른 폐기물 파일과 나란히 비교하는 방식으로 쓴다.
description_portal: 본 데이터는 인천광역시 동구 관내에서 다량의 음식물쓰레기를 배출(월1ton이상)하는 사업장의 현황을 수록한 자료이다. 항목은 연번, 업소명, 업종, 주소, 전화번호, 수거형태, 예상 배출량(월 단위) 등으로 구성되어 있으며, 해당 사업장이 어떤 방식으로 음식물쓰레기를 배출하고 있는지를 파악할 수 있도록 정보를 제공한다. 음식점, 급식시설, 대형매장 등 다량배출 업소를 중심으로 관리되며, 수거형태 항목을 통해 민간 위탁, 직접 처리, 공동 수거 여부도 확인할 수 있다. 이 데이터는 폐기물 감량 정책 수립, 수거 효율 개선, 지역별 관리 대상 파악 등에 활용되며, 예측 배출량 정보를 기반으로 수거 차량 운영 계획 수립 및 처리시설 운영 최적화에도 기여할 수 있다. 본 자료는 환경정책 수립과 민원 대응, 공공 청결 관리 강화를 위한 기초자료로 활용가능하다.
