description_portal: 이 데이터는 주파수 영역 반사 기법(Frequency Domain Reflectometry, FDR)을 활용하여 파주시 적성면에 설치된 토양수분 관측소 부지 내에서 측정한 체적 토양수분량 자료입니다. 센서는 깊이 10cm, 30cm, 60cm 지점에서 각각의 수분량(cm³/cm³)을 측정하며, 각 측정 시점의 위도, 경도 및 해발 고도 정보도 함께 포함되어 있어 시계열 분석 및 토양 수분 동향 파악에 유용합니다. 이를 통해 하천 유역의 수문 분석, 농업용수 관리, 기상 및 환경 연구 등에서 토양 수분의 공간적·시간적 변화를 파악하는 데 기초자료로 활용할 수 있습니다.
