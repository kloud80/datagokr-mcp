description_portal: 국립기상과학원의 연구자료제공목록 데이터는 국립기상과학원에서 관측하는 기상 및 대기 과학 관측자료들입니다. 예컨대 기상관측탑 데이터, 온실가스 측정자료, 자외선 및 에어로졸 관측자료, 성층권 오존 관측자료 등이 포함되어 있다. 이 목록은 이용자가 어떤 자료가 제공되고 있는지 확인할 수 있도록 항목별로 공개되어 있으며, 연구 및 정책 목적 활용을 위해 자료 신청이나 다운로드 안내가 함께 제공되어 있다.- 기상관측 데이터, 온실가스 측정 데이터, 자외선 관측 데이터, 반응가스 관측 데이터, 에어로졸 관측 데이터, 성층권오존 관측 데이터, 강수 화학 분석 데이터, 대기복사 관측 데이터, 기후예측시스템 데이터, 수층별 수온, 염분 데이터, 기후변화시나리오(지역), 기후변화시나리오(전지구), 풍력기상자원지도, 태양광기상자원지도(월/연)의 데이터가 있다.- 데이터별로 형식과 형태가 다양합니다. 분단위로 관측되는 데이터도 있는 반면, 관측되는 데이터의 종류 따라 일별, 월별, 계절별, 연별로 제공되는 것들도 있습니다. 또한 평균 값을 제공하는 데이터와 같은 경우는, 관측 기간을 어떻게 산정하느냐에 따라 값이 달라지므로, 수요자의 요구에 맞추어 제공하고 있습니다. 관측 데이터 뿐만 아니라 기후변화 시나리오를 제공하기도 합니다. 이에 제공 목록과 이에 대한 설명을 확인하시고, 사용자께서는 원하는 자료를 원하는 기간에 맞추어 해당 부서로 연락하면, 자료를 받아볼 수 있습니다.
