summary_user: 부산 연제구 관내 폐기물 배출사업장에 대한 지도점검 결과를 연도·분기별로 집계한 파일로, 점검대상 수와 폐기물수집운반업체·사업장생활계·병의원·세탁업 및 정비업 등 업종 구분별 점검 수, 점검결과를 담는다(파일 크기 320바이트의 소규모 집계표). 구민이나 환경 분석가가 "연제구는 분기마다 어떤 업종의 사업장을 몇 곳 점검했고 결과는 어땠나"를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 시군구의 같은 점검 결과 파일과는 점검년도·분기를 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 부산광역시 연제구 관내 폐기물 배출사업장에 대해 환경오염물질배출시설 등에 관한 통합지도·점검 규정에 따라 정기적으로 실시하는 지도점검 결과에 관한 상세한 내용입니다. 점검은 매년 분기별로 체계적이고 엄격하게 이루어지며, 점검대상 사업장 수와 실제 점검 결과 등 다양한 정보가 포함되어 있습니다. 이를 통해 사업장의 폐기물 배출 현황과 환경오염 방지 여부를 정확하게 확인하고, 관련 법적 기준에 맞는 적절한 환경 관리가 잘 이루어지고 있는지를 철저히 점검하는 매우 중요한 자료입니다.
