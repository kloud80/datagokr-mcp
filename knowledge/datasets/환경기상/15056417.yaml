summary_user: 제주특별자치도 내 환경표지 인증제품을 제품 한 건씩 담은 파일 목록으로, 대상제품군·업체명·제품명(상표명)·용도·인증사유와 인증시작일·종료일을 담는다(csv 약 159KB). 사업자나 구매 담당자가 '제주 업체가 만든 이 제품이 환경표지 인증을 받았고 인증이 언제까지 유효한가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·제품명 같은 이름 매칭으로만 잇는다.
description_portal: '"제주특별자치도 내 환경표지 인증제품 현황 데이터를 제공합니다.항목: 대상제품군, 업체명, 제품명(상표명), 인증사유 등*「환경기술 및 환경산업 지원법」 제17조 제1항에 따라 같은 용도의 다른 제품에 비하여 제품의 환경성을 개선하여 환경표지 인증 받은 제품 또는 동 기준에 적합한 제품*인증기관: 환경부/한국환경산업기술원자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1363"'
