description_portal: '서울특별시 마포구에 소재하고 있는 음식물류폐기물 다량배출사업장들의 전체 배출량 데이터를 제공합니다. 도시화의 진전과 외식·유통 산업의 확대에 따라 음식물류폐기물 발생량이 증가하고 있으며, 폐기물 감량 정책 수립, 자원순환 촉진, 처리시설 운영의 효율화, 환경오염 예방 및 탄소중립 실현 등 다양한 목적에서 다량배출사업장에 대한 정보 수요가 꾸준히 증가하고 있습니다.이에 따라, 음식물류폐기물 다량배출사업장의 전체 배출량을 2020년도부터 2025년도까지 5년치 배출량을 1년치 배출량(단위: kg)과 1개월 평균(단위: kg)으로 데이터를 제공합니다.'
