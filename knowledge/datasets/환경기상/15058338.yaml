summary_user: 경기도 내 대기오염물질 배출 사업장에 부과된 기본 배출부과금을 집계년도·반기(상반기/하반기)별로 사업장 단위로 담은 자료로, 시군명·사업장명·부과금액과 함께 주소와 위경도 좌표가 들어 있다. 환경 분석가나 지자체 담당자가 "우리 시군에서 기본 배출부과금을 가장 많이 낸 사업장은 어디이고, 반기별로 얼마나 달라졌나"를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않아 시군코드(SIGUN_CD)·시군명, 사업장명, 사업자등록번호(BIZREGNO)나 주소·좌표를 매칭해 경기도의 다른 오염원·사업장 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 대기오염물질을 배출하는 사업장을 대상으로 기본 배출부과금이 부과된 현황을 기록한 자료로, 환경보전 부담금 제도에 따라 오염물질을 배출한 주체에게 경제적 책임을 부과하는 정보를 담고 있습니다. 주요 항목으로는 집계년도, 반기구분(상반기/하반기), 시군명, 사업장명, 부과금액 등이 포함되어 있으며, 개별 사업장의 오염부과금 규모를 파악할 수 있습니다. 해당 데이터는 대기환경 개선 정책 수립, 고배출 사업장 모니터링, 환경부담금 운영 평가, 지역별 환경부과금 분석, 배출량 감축 시뮬레이션 등 환경행정 및 정책 분석에 활용될 수 있습니다.
