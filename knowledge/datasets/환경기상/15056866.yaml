summary_user: 경기도 시군별·집계년월별로 설치된 도시대기측정소 수와 도로변대기측정소 수를 담은 집계 현황이며, 대기오염 측정값 자체가 아니라 측정소 개수를 담는다. 분석가나 지자체 담당자가 '우리 시군에는 도로변 측정소가 몇 곳이고 다른 시군과 비교해 측정망이 충분한가'를 따질 때 쓴다. 측정소 코드 같은 전역 조인 키는 없으므로, 시군명(SIGUN_NM)이나 시군코드를 이름·코드 매핑해 경기도 시군 단위 인구·면적·대기질 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 대기환경 측정을 위한 측정소 수를 도시대기측정소와 도로변대기측정소로 구분하여 집계한 현황입니다. 각 행은 특정 시군과 특정 집계년월 기준으로 설치된 대기측정소 수를 나타내며, 도시대기측정소는 일반 주거지역 및 상업지역 등에서의 대기질 측정을 목적으로 하고, 도로변대기측정소는 주요 도로변에서 차량 배출가스에 의한 대기 오염도를 측정하기 위해 설치된 설비입니다. 데이터 항목은 집계년월, 시군명, 도시대기측정소수, 도로변대기측정소수로 구성되어 있으며, 지역별 대기질 관리 수준을 평가하거나 환경 정책 수립, 대기환경 모니터링 기반 마련 등의 활용이 가능합니다.
