description_portal: 한국서부발전에서 제공하는 대기 환경 관련 API는 발전소 운영과 운영 시 발생한 배출 정보를 포함합니다. 발전소 코드, 통신회선 상태 코드, 처리 일자를 비롯하여 CO, 먼지, 유량, 질소산화물, 산소, 황산화물, 유속, 온도 등의 로거 상태 코드와 계측기 상태 코드가 제공됩니다. 측정값으로는 일산화탄소, 먼지, 질소산화물, 산소, 황산화물 농도와 배출량, 유량, 유속, 온도, 발전출력이 포함됩니다. 자료 유형 코드, 표준 코드, 서브 구분, TMS 도어 상태 정보가 제공됩니다. 한국서부발전 대기 환경 데이터 조회 서비스를 통해 발전소 운영 기록 확인, 배출저감 장치 운영 효율 평가, 환경 규제 대응 및 ESG 관리 지표 산출 등에 API 데이터를 활용할 수 있습니다.
