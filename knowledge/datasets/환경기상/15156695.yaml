status: active
summary_user: 한국서부발전 발전소 굴뚝 자동측정(TMS) 기록을 발전소 코드(pwst_cd)와 처리일자별로 담은 API로, 먼지·황산화물·질소산화물·일산화탄소 농도와 배출량, 산소 농도, 유량·유속·온도, 발전출력, 계측기·로거·통신회선 상태를 함께 제공한다. 분석가나 지역 주민이 '이 발전소가 특정 날짜에 출력 대비 질소산화물을 얼마나 배출했고, 그때 계측기는 정상이었나'를 확인하거나 배출저감 설비 운영을 평가할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 발전소 이름·코드 매핑이나 같은 기관의 발전소 코드로만 이어 쓴다.
limits: 에어코리아 측정소처럼 주변 대기질을 측정한 자료가 아니라 발전소 배출구 측정값이다. 비공간 데이터라 좌표로 지역 대기질과 바로 겹쳐 볼 수 없다. 개발계정은 하루 10,000회까지 호출할 수 있다.
