summary_user: 서울 강서구에서 배출할 수 있는 대형폐기물 품목(가구·가전 등)을 품목별로 한 행씩 담고, 각 품목의 구분, 수수료 합계금액, 등록·수정일자를 함께 기록한 강서구 단위 파일(CSV 약 17KB)이다. 강서구 주민이 냉장고나 책장 같은 물건을 버릴 때 "이 품목은 대형폐기물 수수료가 얼마인가"를 확인하거나, 분석가가 자치구별 대형폐기물 수수료를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자치구의 대형폐기물 품목 파일과는 품목 이름을 맞춰 대응시켜야 연결된다.
description_portal: 이 데이터는 서울 강서구 주민들이 배출할 수 있는 대형 폐기물 품목 목록과 관련 정보를 제공하며, 품목일련번호, 구분코드, 품목코드(환풍기, 가스레인지 등), 합계금액, 등록일자, 수정일자, 데이터기준일자 정보 책장, 냉장고, 가전제품, 가구류 등 처리 대상 품목이 세분화되어 있어, 주민이 불필요한 물건을 정리할 때 참고하기 좋습니다. 이 데이터는 폐기물 수거 시스템의 효율성을 높이고, 무단투기 예방, 자원 재활용률 향상, 환경 정책 수립에도 중요한 기반자료로 활용됩니다.강서구 대형폐기물 신청은 강서구청 홈페이지에서 확인 가능합니다.
