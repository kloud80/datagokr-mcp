description_portal: '대기환경 개선을 위해 시행한 차량 매연단속 결과를 정리한 자료이다.단속일자와 장소, 단속된 차량 대수를 포함하며, 도심 내 대기질 관리, 오염원 추적, 환경정책 수립에 활용 가능하다.특히 대로변, 혼잡지역, 공업지역 주변을 중심으로 고농도 매연 발생 여부를 파악할 수 있다.활용 목적 및 특징– 도심 대기오염 주요 원인 중 하나인 자동차 배출가스 단속 데이터– 계절별, 지역별 매연 발생량 분포 분석 가능– 친환경 교통 정책 기초자료 및 전기차 전환 정책 근거 제공– 단속지점 및 시간대 기반 효율적 단속계획 수립 가능주요 항목 설명● 연번: 각 단속 건의 고유 번호● 단속일시: 단속이 실시된 날짜 및 시간 정보● 단속장소: 단속이 이루어진 도로 또는 지역 명칭● 단속대수: 해당 일시에 매연 단속 대상이 된 차량 수'
