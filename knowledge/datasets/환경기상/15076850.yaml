summary_user: 경상남도 거창군에서 2020년 기준 벙커C유를 쓰는 업체를 한 곳씩 업소명·도로명/지번 주소·전화번호·생산품·연간사용량(톤/년)으로 담은 건별 목록이며, 파일 크기가 321바이트에 불과한 소규모 일회성 자료다. 지역 대기환경 담당자나 분석가가 '거창군에서 고황 중질유를 쓰는 사업장은 어디이고 얼마나 쓰는가'를 확인하거나 연료 전환 대상 업체를 추리는 데 쓴다. 전역 조인 키나 사업자등록번호는 없으므로, 다른 대기 배출시설 사업장 데이터와는 업소명이나 주소를 맞춰 붙여야 한다.
description_portal: '경상남도 거창군의 2020년 벙커C유를 사용하고 있는 업체 현황에 대한 데이터이며,업체명, 소재지, 전화번호, 생산품, 연간사용량 정보를 제공합니다○ 데이터 기준일 : 2020. 12. 31. (일회성 데이터)○ 벙커C유는 원유 정제 과정에서 나오는 잔사유로, 점도가 높고 불순물이 많아 가열 후 사용해야 하는 중질유입니다. 주로 선박 연료나 산업용 보일러 연료로 사용되며, 에너지 밀도가 높아 대형 운송수단에 적합합니다. 하지만 황 함량이 높아 대기오염의 원인이 되기 때문에, 국제적으로는 IMO 2020 규제 등으로 저유황 연료로의 전환이 요구되고 있습니다. 경제성은 뛰어나지만 환경적 부담이 커 관리와 규제가 중요한 연료입니다.'
