summary_user: 대구광역시 서구의 대형폐기물 처리 내역을 행정동별·품목별로 집계한 파일로, 가전·가구 등 종류와 품목, 규격별 부과금액, 처리 건수, 총금액을 담는다(csv 약 6KB). 주민이나 분석가가 "서구에서 어느 동에서 어떤 대형폐기물이 많이 배출되고 수수료가 얼마나 부과되나"를 확인하는 데 쓴다. 전역 조인 키는 없어 동명(행정동 이름)을 기준으로 다른 서구·대구 읍면동 단위 자료와 이름 매핑해 이어 쓴다.
description_portal: 대구광역시 서구에서 처리하는 대형폐기물의 처리 품목의 목록입니다. 이 파일에는 행정동과 대형폐기물 품목의 종류, 수수료 금액의  정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 관할 지역 내 대형폐기물 처리 현황을 체계적으로 기록한 자료이다. 동별로 구분하여 가전제품, 가구류, 기타 폐기물 등 품목별 처리 건수와 규격별 부과금액, 총금액을 상세히 포함하고 있다. 이를 통해 대형폐기물 수거 현황과 부과금액 집계 현황을 한눈에 파악할 수 있으며, 행정기관 및 주민에게 폐기물 관리 현황을 투명하게 제공한다. 해당 자료는 폐기물 처리 정책 수립 및 환경 관리, 주민 서비스 개선에 기초 자료로 활용 가능하다. 각 품목별 특성과 규격을 반영하여 정확한 비용분석과 통계적 검토가 가능하며, 공공데이터로서 활용도가 높다.
