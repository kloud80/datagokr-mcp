description_portal: 동해안 너울성 파도 발생 현황에 관한 해상 기상 데이터 입니다. 너울성 파도는 먼 바다의 폭풍이나 저기압에 의해 발생한 파도가 해안에 도달하여 갑작스럽게 높은 파도를 형성하는 현상으로, 연안 시설과 인명 안전에 위협이 됩니다. 본 데이터는 기상청 날씨누리 바다예보 정보를 웹크롤링 방식으로 시간별 수집하여 구축되었습니다. 데이터의 세부 항목으로는 유의파고와 파주기 측정값, 이를 바탕으로 분석한 너울성 파도 발생 판정, 월별 및 주별 발생 빈도 통계가 포함되어 있습니다. 본 데이터를 활용하면 해안 시설 안전 관리 및 운영 계획 수립, 너울성 파도 예측 모델 개발, 기상재해 조기경보 시스템 구축, 자연재해 선제적 대응 체계 마련에 기초자료로 활용할 수 있어 연안 재난 예방과 해안 시설 안전 관리에 기여할 것으로 기대됩니다.
