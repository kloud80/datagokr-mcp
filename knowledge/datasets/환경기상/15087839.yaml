summary_user: 인천 영종구(포털 설명상 옛 중구) 관내 대기오염물질 배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 업소명·구분·도로명 주소·데이터 기준일자를 담는다. 주민이나 분석가가 "우리 동네 주변에 어떤 대기 배출 사업장이 있는가"를 확인하거나 배출원 분포를 지도로 보는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 배출원·대기질 데이터와는 업소명이나 도로명 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
