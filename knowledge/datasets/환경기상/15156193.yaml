description_portal: 본 데이터셋은 대기 환경에 직접적인 영향을 미치는 주요 오염물질 5종(미세먼지, 초미세먼지, 오존, 이산화질소, 일산화탄소)의 상세 관측 수치와 이를 토대로 산출된 통합대기환경지수(KHAI) 정보를 제공합니다. 입자상 물질(PM10, PM2.5)과 가스상 물질(NO2, O3, CO)의 농도 데이터를 통해 호흡기 및 심혈관 질환에 영향을 주는 대기질 상태를 정밀하게 분석할 수 있습니다.특히 '통합대기환경지수(KHAI)' 컬럼은 서로 다른 단위를 가진 오염물질들의 위해성을 단일 지수로 환산하여 제공하므로, 전문적인 지식 없이도 현재의 대기질이 '좋음'인지 '매우 나쁨'인지 즉각적으로 판별할 수 있게 해줍니다. 이 데이터는 시민들의 야외 활동 지침 마련, 취약 계층(어린이, 노약자)을 위한 보건 알림 서비스, 그리고 도시별·계절별 대기오염 추이 분석을 통한 환경 정책 수립 등 국민 건강권 보호를 위한 다양한 서비스의 핵심 원천 데이터로 활용됩니다.
