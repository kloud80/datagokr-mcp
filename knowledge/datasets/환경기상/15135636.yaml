description_portal: '이 데이터는 광주광역시 서구의 대표 지점에서 수집된 월별 평균기온 정보로, 연도 및 월 단위로 정리된 최고기온, 최저기온, 기온편차(일교차) 등의 항목으로 구성되어 있습니다. 해당 자료는 기후변화 추이 분석, 이상기후 모니터링, 계절별 온도 패턴 비교, 폭염·한파 등 기상 재해 대응계획 수립 등에 활용될 수 있습니다. 특히 농업, 보건, 에너지 수요예측, 지역 환경정책 수립, 시민 체감기온 대응형 행정서비스 개발 등 민간 및 공공분야 전반에 걸쳐 참고자료로 활용 가치가 높습니다. CSV 형식으로 제공되며, 연 1회 이상 최신 정보로 갱신됩니다. 각 행은 특정 연·월에 해당하는 대표 기온 정보를 나타내며, 데이터는 서구 홈페이지 시스템(DB: seogu2021)을 기반으로 생성됩니다.'
