description_portal: 본 데이터는 한국수자원공사가 제공하는 전국 단위의 지역별·용도별 지하수 이용 현황 자료입니다. 시도 및 시군구 단위로 구분된 지역 정보를 기반으로, 생활용, 공업용, 농어업용, 기타 용도 등으로 세분화된 지하수 사용량을 연도별로 수록하였습니다. 해당 자료는 지하수의 효율적 이용과 수자원 관리 정책 수립, 지역별 용수 수급계획 및 개발·보전 전략 마련에 기초자료로 활용될 수 있습니다. 데이터는 수요 특성과 공간적 분포를 파악할 수 있도록 구성되었습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다."
