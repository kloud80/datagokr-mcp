summary_user: 공공기관별 연간 녹색제품 구매실적을 기관 단위로 집계한 파일 데이터로, 국가기관·지방자치단체·교육자치단체 등 소관 구분과 기관명, 총구매액, 녹색구매액, 녹색구매 비율을 담으며 범위는 전국이다. 정책 담당자나 분석가가 "어느 기관이 총구매 대비 녹색제품 구매 비율이 낮은가"를 확인하거나 녹색제품 납품 업체가 구매 실적이 큰 기관을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명 매칭으로만 이을 수 있다.
description_portal: 본 데이터는 한국환경산업기술원이 공공기관에서 실제로 구매한 녹색제품의 비율을 제공하는 데이터입니다. 해당 csv 데이터 내에는 국가기관, 지방자치단체, 교육자치단체 등 구분으로 분류가 진행되어 있고 순번,구분,기관명,총구매(원),녹색구매(원),비율 등의 필드를 보유하고 있습니다. 이 데이터는 2026년도 7월 기준 녹색제품정보시스템(녹색구매정보시스템)에서 집계한 연간 공공기관 기관별 녹색제품 구매실적 현황(소관구분, 기관명, 구매액 등)입니다. 녹색제품 시장 동향 분석, 공급망 관리, 예산 효율성 검토, 정책 이행 평가 및 신규 구매 대상 발굴 등에 활용할 수 있도록 구성되었습니다.
