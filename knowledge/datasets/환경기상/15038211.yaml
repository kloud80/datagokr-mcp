summary_user: 경기도 이천시에 있는 환경오염물질 배출사업장을 한 곳씩 담은 사업장 목록으로, 사업장명·업종·대표자·관할기관, 폐수와 대기의 관리등급·종별 구분, 주소와 WGS84 좌표를 포함한다. 이천시 안에서 어떤 대기·폐수 배출사업장이 어디에 몰려 있는지, 관리등급이 높은 곳이 어디인지 확인하려는 주민, 민원 담당자, 환경 분석가가 지도 분석이나 점검 대상 선정에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
