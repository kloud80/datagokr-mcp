summary_user: 생산자책임재활용제도(EPR) 대상 포장재에 대해 재활용의무생산자(제조·수입·판매업자)의 사업자명·주소, 이행연도별 품목 대·중분류, 연간 출고·수입량, 의무량, 회수실적, 최종실적량, 재활용의무율을 담는 전국 범위의 업체·품목 단위 데이터다. 재활용 정책 분석가나 포장재 사업자가 특정 연도에 어떤 품목에서 의무량 대비 회수·재활용 실적이 얼마였는지, 어느 업체가 의무생산자로 등록돼 있는지 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업자명·주소 같은 이름 매칭이나 품목 분류명으로만 연결된다.
description_portal: 생산자책임재활용제도(EPR)가 적용되는 포장재에 대해서 연도별/업체별/품목별 재활용의무이행 계획을 제출한 재활용의무생산자(제조·수입·판매업자) 정보와 재활용의무이행 실적 정보를 조회하는 서비스입니다. 재활용의무이행은 환경보호와 자원순환을 위해 제조업체나 유통업체가 재활용 대상인 제품·포장재에 대해 재활용 책임을 준수하는 것을 의미하며, 생산자책임재활용제도(EPR)을 통해 대상 품목과 이행 방식, 재활용 의무율 등이 관리됩니다.
