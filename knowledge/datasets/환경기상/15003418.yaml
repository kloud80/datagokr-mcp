description_portal: '해당 데이터는 서울시설공단에서 관리하는 지하도상가의 권역이 상이함에 따라 실내 공기질 측정 지점을 세분화하여 지하도상가 내의 공기질 측정 수치를 제공하고 있습니다.데이터의 세부 내역은 다음과 같습니다.- 제공 데이터 :  실내공기질 측정 지점 세분화, 실내 공기질 수치(미세먼지 pm-10, 미세먼지 pm-2.5, 이산화탄소, 포름알데히드, 일산화탄소, 이산화질소, 라돈, 휘발성 유기화합물)해당 데이터를 통해 각 지하도상가의 실내 공기질을 항목별로 파악하는데 유용합니다.실내공기질 측정 데이터를 투명하게 공개함으로써 지하도상가 이용 시민의 안전한 이용을 점검하는데 목적이 있습니다.'
