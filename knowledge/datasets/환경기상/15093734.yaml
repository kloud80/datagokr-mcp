summary_user: 경기도 이천시에서 대형폐기물 수거를 맡은 업체를 한 줄씩 정리한 목록으로, 업체명·담당구역(행정동)·지번·도로명주소·전화번호를 담은 작은 CSV 파일(731바이트)이다. 이천시 주민이 가구나 가전을 버릴 때 "우리 동네는 어느 업체가 수거하고 연락처가 무엇인가"를 확인하는 데 쓰고, 지자체는 담당구역별 수거 책임을 점검하는 데 쓴다. 전역 조인 키가 없어 담당구역(행정동) 이름을 행정동 목록과 맞추거나 다른 지자체의 대형폐기물 수거·배출 지점 파일과 이름 기준으로 이어 쓴다.
description_portal: 본 데이터는 경기도 이천시 내 대형폐기물 수거를 담당하는 업체 정보를 정리한 자료로, 업체명, 담당구역(행정동), 지번, 도로명주소, 전화번호 항목으로 구성되어 있습니다. 대형폐기물은 가구, 가전제품 등 일반 쓰레기와 구분되는 생활폐기물로, 수거 전 신고 및 스티커 부착이 필요한 품목입니다. 이 데이터는 각 업체가 담당하는 행정구역별 수거 책임 정보를 제공하여, 시민 민원 대응, 폐기물 배출 지도 제작, 수거 요청 연계 시스템 구축 등에 활용됩니다. 특히 주소 및 전화번호 정보는 시민이 직접 수거를 신청하거나 담당 업체와 연락할 수 있도록 하는 데 실질적인 도움을 줍니다. 또한, 지자체는 본 데이터를 기반으로 지역별 수거 인프라 점검, 업체별 담당구역 조정, 위탁계약 검토 등 행정 효율성 향상을 위한 기초자료로 사용할 수 있습니다.
