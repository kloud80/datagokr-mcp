description_portal: '수도권매립지 토사반입정보에 대한 정보입니다. 개방항목 : 반입일자, 발주처, 공사명, 반입량(t), 반입대수의 항목을 제공합니다.반입되는 토사의 종류와 양은 매립지의 환경 부하를 예측하고 관리하는데 중요한 기초 자료가 됩니다. 예를 들어 특정 성분이나 오염물질이 포함된 토사의 반입을 감시하고, 그에 따른 환경영향(악취, 침출수 등)을 최소화하기 위한선제적인 조치를 취할 수 있습니다. 또한 토사 반입정보는 매립지 복토 등 폐기물 처리 과정에서 필요한 토사 수급 계획을 효율적으로 수립하는데 활용될수 있습니다.'
