summary_user: 원주시 측정소별 미세먼지(PM-10) 측정 결과를 담은 파일로, 측정소명과 함께 유효자료 획득률·유효 측정일수·측정시간, 월평균 농도(㎍/㎥), 24시간치 등 측정소 단위 집계값이 들어 있다(xlsx 약 14KB). 원주 시민이나 분석가가 "우리 동네 측정소의 월평균 미세먼지 농도가 어느 수준이고 측정이 얼마나 빠짐없이 이뤄졌나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 대기질 데이터와는 측정소명·시도명·도시명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 강원도 원주시의 미세먼지(PM-10) 농도 측정 결과를 투명하게 공개하여, 지역 대기 질 현황을 시민들에게 실시간으로 알리고 환경 보건 관리를 강화하기 위해 구축되었습니다. 해당 기관에서 관측소를 통해 측정된 PM-10 농도, 측정 일시, 측정소 위치 등의 핵심 환경 정보를 공적 자료를 통해 수집하고 정제했습니다. 이 정보는 대기 오염 수준을 객관적으로 파악하는 데 필수적이며, 시민들이 미세먼지로부터 건강을 보호하고 지역의 대기 환경 개선 정책 수립에 중요한 기초 자료로 활용됩니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있습니다.
