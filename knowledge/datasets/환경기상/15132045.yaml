description_portal: 환경측정기기를 유통 판매하기 위해서는 환경분야 시험 검사 등에 관한 법률 제9조(측정기기의 형식승인 수입신고 등)에 관련하여 환경측정기기의 형식승인 정도검사 등에 관한 고시 [별표1], [별표 2]의 성능시험을 받아서 적합 판정을 받고 형식승인 받은 이후에 유통, 판매하고 사용할 수 있습니다.자동차 분야의 운행차 분야의 성능시험 대상은 차대동력계(소형, 대형), 차대동력계용 배출가스(일산화탄소, 탄화수소, 질소산화물, 이산화탄소 및 산소만 해당한다)측정장치, 공기과잉률 측정기와 그 부속기기, 자동차 배출가스(일산화탄소 및 탄화수소만 해당한다)분석기, 공기과잉률 측정기와 그 부속기기, 매연측정기와 그 부속기기 이며,시험항목과 기준 정보를 활용하여 해당 측정기기 개발 제작에 활용 할 수 있습니다.
