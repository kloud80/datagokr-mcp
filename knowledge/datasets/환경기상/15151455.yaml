description_portal: 국립기상과학원 홈페이지의 논문 메뉴는 국립기상과학원에서 수행한 학술 연구 결과를 공개하는 공간으로, 국립기상과학원에서 개제한 논문 정보를 제공한다. 논문 제목, 저자, 게재 학술지명, 발행연도 등의 메타데이터가 정리되어 있으며, 일부 논문은 원문 또는 요약본을 열람하거나 다운로드할 수 있다. 이를 통해 최신 기상과학 연구 동향을 한눈에 파악하고, 연구성과의 투명한 공개와 학문적 교류를 촉진하는 데 기여한다.- 게시물 오른쪽의 돋보기 버튼을 클릭하시면 해당 논문이 게재된 곳으로 연결됩니다. 우측의 'PDF download'을 누르시면 PDF 형태로 다운로드가 가능합니다.
