summary_user: 경상북도 영덕군 환경위생과가 관리하는 사업장폐기물 배출자 신고 현황을 사업장 한 곳씩 담은 원천 목록입니다. 상호, 연락처, 지번주소, 신고일, 폐기물 종류가 들어 있고 범위는 영덕군 한 곳입니다(CSV 약 11KB). 영덕군에서 어떤 사업장이 어떤 종류의 폐기물 배출을 신고했는지 확인하려는 주민, 폐기물 처리업자, 환경 분석가가 씁니다. 전역 조인 키는 없으므로 다른 폐기물 처리업 목록이나 사업장 데이터와는 상호나 지번주소를 맞춰 대조하는 방식으로만 이을 수 있습니다.
limits: 사업자번호나 표준 코드 같은 조인 키가 없어 다른 데이터와 정확히 매칭하기 어렵고, 상호·주소 문자열로 대조해야 합니다. 신고 때 연락처가 빠졌거나 휴대폰번호가 들어간 건은 공개에서 제외됐으므로 전체 배출자 명단으로 보기는 어렵습니다. 폐기물 발생량이나 처리량 통계는 담고 있지 않습니다.
