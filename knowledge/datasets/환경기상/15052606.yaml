description_portal: 저층바람시어경보장비로부터 산출된 데이터입니다. 저층바람시어경보장비(LLWAS)는 활주로와 활주로 주변에 설치된 풍향 풍속계로부터 관측자료를 수신하고, 계산, 처리하여 활주로와 이착률에 관계된 지역의 위험한 윈드시어와 마이크로버스트를 감지하는 장비입니다.저층바람시어경보장비의 관측 요소로는 경보시각, 윈드시어, 경보종류(WSA, MBA), 활주로방향, 이착륙 구분이 있습니다.지점으로는 인천공항, 제주공항, 양양공항이 있으며 지점별로 관측을 시작한 시기가 다릅니다.
