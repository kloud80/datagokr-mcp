summary_user: 고양시에서 신청·수거된 대형폐기물을 건별로 기록한 원천 파일로, 신청날짜·수거장소 행정동·폐기물 종류·규격·개수·접수경로를 담으며 범위는 고양시 한 시군구, 위치 단위는 읍면동(행정동)이다. 고양시 담당 부서나 분석가가 "어느 행정동에서 어떤 대형폐기물 품목이 언제 많이 배출되는가"를 보고 수거 인력·경로를 조정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름을 매핑하거나 같은 고양시 기관 자료끼리 이어 써야 한다.
description_portal: 본 데이터는 고양시에서 발생하는 대형폐기물의 수거 현황을 체계적으로 관리하기 위해 구축된 자료이다. 수거일자를 기준으로 폐기물의 구분, 품목명, 규격, 개수 등을 세부적으로 기록하여 품목별 배출 추세와 처리 단계를 명확히 파악할 수 있도록 구성하였다. 또한 수거장소의 도로명주소와 행정동 정보를 함께 제공하여 지역별 배출 특성을 분석하고 효율적인 수거 경로를 설계하는 데 활용 가능하다. 더불어 관리기관과 담당 전화번호를 포함하여 민원 대응과 문의 처리를 신속히 지원할 수 있는 행정운영 기반을 마련하였다. 이러한 정보는 대형폐기물 처리계획 수립, 수거용량 조정, 업무 효율성 제고 등 다양한 행정 분야에서 참고자료로 활용될 수 있도록 설계되었다.
