summary_user: 국립공원공단이 관리하는 국가지질공원 안의 지질명소를 명소 한 곳당 한 행으로 담은 CSV 파일로, 지질공원명·구분·명소명·위도·경도·대표주소·총 면적(m2)을 전국 범위로 담는다. 탐방객·해설사·지질교육 기획자가 "특정 지질공원에 어떤 지질명소가 있고 정확히 어디에 있는가"를 확인하거나 답사·해설 경로를 짜는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 지질공원명·명소명 같은 이름 매칭이나 위도·경도 좌표를 이용한 공간 결합으로 잇는다.
description_portal: 본 데이터는 국립공원공단이 관리하는 지질공원 내 주요 지질명소에 대한 정보를 포함한 자료로, 해당 지역의 지질학적 가치와 교육·관광 자원으로서의 활용 가능성을 높이기 위한 기초 정보로 제공됩니다. 주요 항목은 지질명소 명칭, 위치 정보(위도·경도), 지질공원명, 지질유형(단층, 주상절리, 화산지형, 암석노두 등), 학술적 가치, 경관 특성, 보호등급, 설명문, 접근성, 관리 주체, 지정 연도 등이 포함되며, CSV 포맷으로 제공됩니다. 본 데이터는 지질교육 콘텐츠 개발, 생태·지질 해설 경로 설계, 탐방 프로그램 운영, 학술 연구, 유네스코 세계지질공원 네트워크 자료 연계 등 다양한 분야에서 활용될 수 있습니다. 또한 공간정보 시스템(GIS) 및 민간 지도 API와 연계하여 시각적 표출 및 해설 자료 제작에도 적합한 구조로 구성되어 있습니다.
