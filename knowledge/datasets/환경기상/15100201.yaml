description_portal: 인천광역시 보건환경연구원의 대기현황대기질변동추이항목별자료는 도시 대기환경을 종합적으로 파악하기 위해 구축된 공공데이터입니다. 인천 전역의 도시대기측정소 24개소에서 미세먼지(PM10), 초미세먼지(PM2.5), 오존(O₃), 이산화질소(NO₂), 일산화탄소(CO), 아황산가스(SO₂) 등 6개 주요 대기오염물질을 측정하여 시간 평균값과 일 평균값을 항목별로 제공합니다. 이를 통해 대기질의 단기·장기 변동 추이를 분석할 수 있으며, 시민 건강 보호와 환경정책 수립에 활용됩니다. 참고바랍니다.
