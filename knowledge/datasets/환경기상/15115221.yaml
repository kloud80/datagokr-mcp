summary_user: 서울 송파구의 대기오염물질 배출시설 설치 사업장 인허가 정보를 사업장 한 곳당 한 행으로 담는 원장이며, 인허가일·영업상태·폐업·휴업 일자, 주소·좌표, 업종·종별, 주생산품, 배출·방지시설 운영시간과 연간 가동일수를 포함한다. 주민이나 분석가가 "우리 동네에 현재 영업 중인 대기 배출시설 사업장이 어디에 있고 몇 종 사업장인가"를 확인하거나, 배출시설의 가동 규모를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 구의 같은 인허가 데이터나 대기질 자료와는 사업장명·주소 매칭, 좌표(XCRD·YCRD), 또는 같은 기관 코드로만 연결한다.
