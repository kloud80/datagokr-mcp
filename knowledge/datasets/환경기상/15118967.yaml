summary_user: 전기차 구매보조금의 2020~2023년 지급현황을 시도·지역(시군구)·차종·접수방법별로 묶어 공고대수, 우선순위·법인기관·택시·일반 부문별 접수대수, 출고대수를 담은 전국 단위 집계 파일이다. 전기차 구매 예정자나 분석가가 '우리 지역의 올해 보조금 공고 물량 대비 접수·출고가 얼마나 찼는가', '지자체별 보조금 소진 추이가 어떻게 달랐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 차종 이름을 맞춰서만 이어 쓸 수 있다.
