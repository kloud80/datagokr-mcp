summary_user: 경기도 내 생활폐기물 재활용(선별)시설을 시설 한 곳당 한 행으로 담은 집계 현황으로, 시군명, 설치년도, 운영방식, 선별방식, 처리용량, 전년도 반입량, 재활용품목 수, 도로명·지번 주소와 위경도를 포함한다. 지자체 담당자나 분석가가 '우리 시군 재활용시설의 처리용량이 전년도 반입량에 비해 부족한가'를 판단하거나, 시군 간 처리능력을 비교하는 데 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)나 시군명으로 같은 경기도 데이터와 묶고, 주소나 위경도로 지도·공간 데이터와 연결한다.
description_portal: 이 데이터는 경기도 내 생활 폐기물 재활용시설에 대한 집계 현황을 제공합니다. 주요 정보에는 시설의 설치년도, 운영방식(공공/민간 등), 선별방식(기계/수작업 등), 처리용량, 반입량, 재활용품목 수, 그리고 위치 정보(도로명/지번주소, 위도·경도) 등이 포함됩니다.이 데이터는 자원순환정책 수립, 폐기물 관리 인프라 분석, 시설 증설 필요성 평가, 환경정책 효과 측정, 지역 간 폐기물 처리능력 비교 등에 활용할 수 있습니다.특히 전년도 반입량 대비 처리 용량 분석을 통해 지역별 과부하 여부 판단이나 효율성 개선 전략 수립에도 유용합니다.
