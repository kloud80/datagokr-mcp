summary_user: 서울 영등포구에 신고된 음식물류 폐기물 다량배출사업장(집단급식소·일반음식점·휴게음식점 등)을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·소재지(도로명주소)·전화번호를 기록한다. 구청 담당자나 분석가가 '영등포구에서 음식물 폐기물을 다량 배출하는 사업장이 어디에 몰려 있는가'를 확인하거나, 수거·점검 대상 목록을 만드는 데 쓴다. 전역 조인 키나 코드는 없어 다른 데이터와는 사업장명이나 주소 문자열을 맞춰 붙여야 하며, 같은 기관의 다른 폐기물 파일이나 주소 기반 좌표 변환을 거쳐 연결한다.
description_portal: '폐기물관리법 시행령 제8조의 4에서 정한 음식물류 폐기물 배출자가 운영하는 사업장을 말한다.영등포구 음식물류 폐기물의 발생억제, 수집 운반 빛 재활용에 관한 조례 제8조, 제18조에 규정한 사항으로 집단급식소, 일반음식점 및 휴게음식점 등이 있다. 다량배출사업장은 신규신고시 사업개시일로부터 1개월 이내 구청장에게 신고하여야 하며, 상호 또는 사업장의 소재지 변경, 발생억제 방안을 변경한 경우에는 1개월 이내에 구청장에게 변경신고서를 제출해야 한다.등록된 데이터에는 영등포구 내 음식물류폐기물 다량배출사업장의 업장명, 유선번호, 도로명주소가 기록되어 있다음식물 폐기물 관련 문의: 02-2670-3484'
