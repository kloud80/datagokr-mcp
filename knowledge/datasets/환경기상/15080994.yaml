summary_user: 경상남도 사천시에 사업장폐기물 배출자로 신고한 사업장을 건별로 담은 원장 파일로, 폐기물 구분(일반·지정), 상호, 도로명주소, 사업자등록번호, 신고일, 폐기물 종류, 처리방법을 기록한다. 사천시 안에서 어떤 사업장이 어떤 폐기물을 배출하고 재활용·소각·위탁 등 어떤 방식으로 처리하는지 확인하려는 주민·사업자·환경 분석가가 쓴다. 사업자등록번호(bizno)를 키로 폐기물 처리업 허가 현황이나 다른 사업자 원장과 잇고, 도로명주소로 지도·행정구역 자료와 결합한다.
description_portal: '경상남도 사천시에서 발생되는 사업장 폐기물에 대한 배출자 신고 현황 자료는 폐기물의 투명하고 적법한 관리를 위한 핵심적인 정보를 제공합니다. 이 자료는 각 사업장별 폐기물 관리 실태를 파악하는 데 중점을 둡니다.주요 항목으로는 해당 폐기물이 일반 또는 지정 폐기물인지 구분하는 폐기물 구분, 폐기물을 배출하는 주체의 명칭인 사업장명, 그리고 구체적인 폐기물의 성상과 종류를 명시하는 폐기물 종류가 포함됩니다.또한, 환경 오염을 방지하고 자원의 효율적 이용을 위한 처리 방법(예: 재활용, 소각, 매립, 위탁처리 등)이 명확히 기재되어 있으며, 사업장의 위치를 정확히 나타내는 도로명주소가 기록됩니다. 특히, 자료의 기준 시점을 나타내는 신고기준 년도는 정책의 변화와 연도별 배출량 및 처리 현황의 추이 분석을 가능하게 합니다. 이 모든 정보는 사천시가 지역 환경 보호와 폐기물 관리 정책을 전략적으로 수립하고 환경 감독을 수행하는 데 있어 필수적인 기초 자료로 활용됩니다.'
