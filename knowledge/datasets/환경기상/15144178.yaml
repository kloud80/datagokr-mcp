summary_user: 전기전자제품 제조·수입 때 납·수은·카드뮴·6가 크롬·PBB·PBDE 같은 유해물질을 기준 이하로 관리했다고 확인한 준수선언을 건별로 담은 파일(CSV, 약 3.9MB)로, 준수선언번호·업체·제품명·세부제품명·제품중량·승인일을 담는다. 특정 업체나 제품이 유해물질 준수선언을 했는지 확인하거나, 제품군·기업별 준수선언 실적을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·제품명 같은 이름 매칭으로만 연결한다.
description_portal: 본 데이터는 환경성보장제 전기전자제품 및 자동차의 재활용시스템에서 관리되는 전기전자제품 유해물질 준수선언 정보를 포함하고 있으며, 주요 항목으로는 준수선언번호, 준수선언업체, 제품명, 세부 제품명, 제품 중량, 승인일이 포함됩니다.해당 정보는 전기전자제품 제조·수입 시 「유해물질 사용제한 기준」에 따라 제품 내 납(Pb), 수은(Hg), 카드뮴(Cd), 6가 크롬(Cr6+), PBB, PBDE 등 특정 유해물질이 기준 이하로 관리되었음을 확인하는 ‘준수선언’ 기록으로, 환경유해물질 저감, 제품의 친환경성 확보, 제도 이행 실적 관리 등을 위해 활용됩니다.기업의 환경책임 이행 여부를 확인하고, 친환경 인증 절차, 통관 및 유통과정에서의 적합성 판단 등의 행정절차에 기초자료로 제공됩니다.또한, 제품명과 세부 품목, 중량 등의 세부 정보를 통해 제품별 규제 적용 현황 분석, 기업별 이행 수준 비교, 제품군별 환경영향도 평가 등에 활용될 수 있으며,환경부, 한국환경공단, 관련 제조업체 및 연구기관에서 정책 수립, 기술개선 방향 도출, 환경경영 평가 등 다양한 분야에 실무적으로 적용할 수 있습니다.나아가, 유해물질 규제를 준수한 제품 정보를 투명하게 공개함으로써 소비자의 친환경 제품 선택을 유도하고, 녹색소비 활성화 및 산업계의 자발적 환경책임 강화에도 기여할 수 있는 핵심 데이터입니다.
