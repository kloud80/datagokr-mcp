summary_user: 전주시의 음식물쓰레기 수수료 부과 기준을 부과구분별로 정리한 소규모 파일로, 구분마다 수수료와 부과 방식 설명, 데이터 기준일자를 담는다(csv 약 1.8KB). 전주 시민이 자기 거주 형태나 배출 방식에 따라 음식물쓰레기 처리 비용이 얼마인지 확인하거나, 분석가가 지자체별 음식물쓰레기 요금 체계를 비교할 때 쓴다. 전역 조인 키가 없어 다른 지자체의 같은 종류 파일과는 부과구분 이름을 맞추거나 기관 단위로 묶어서만 이어 쓴다.
description_portal: '본 데이터는 전북특별자치도 전주시의 음식물쓰레기 수수료 부과 기준을 정리한 자료입니다. 부과구분별로 적용되는 수수료, 부과 방식 설명, 그리고 데이터 기준일자 정보를 제공합니다. 전주시에서 운영하는 음식물쓰레기 처리 방식에 따른 요금 체계를 한눈에 확인할 수 있도록 구성되어 시민은 자신의 거주 형태 또는 배출 방식에 따른 정확한 수수료를 확인할 수 있습니다. 기관이나 기업이 음식물쓰레기 처리 정책 분석 및 서비스 개발을 위한 참고 자료로 활용을 위해 전주시의 음식물쓰레기 요금 체계를 효율적으로 파악할 수 있도록 구성된 기본 정보 데이터셋입니다.항목 : 부과구분, 부과설명, 수수료, 데이터기준일자제공부서 : 전주시청 청소지원과'
