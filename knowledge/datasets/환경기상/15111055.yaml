description_portal: 대전광역시 공원관리 사업소 공원 건물 및 화장실 전등 설치 현황 자료는 2021년 기준으로 대전시가 관리 중인 도시 공원 내 건축물과 공중 화장실에 설치된 전등 수량을 정리한 데이터입니다. 이 자료는 공원 야간 이용자의 안전과 편의를 확보하고, 각 시설물의 조명 인프라 상태를 파악하기 위해 수집 되었으며, 공원 별 전등 수량 정보를 통해 시설물 별 조명 여건 분석, 조도 확보 현황 진단, 노후 전등 교체 및 유지·보수 계획 수립 등에 활용됩니다. 또한 전등이 미설치 된 화장실이나 공원 건물에 대한 개선 필요성을 진단하고, 시 예산 반영과 설계 기준 정비, 생활 불편 해소 등 시민 생활환경 개선 정책 수립에 기초 자료로 사용될 수 있습니다. 본 자료는 2022년 공공데이터 기업매칭지원사업으로 수행되었습니다.
