description_portal: 이 데이터는 해양수산부에서 해양수질자동측정망 기반 실시간 측정자료를 제공하기 위해 제작되었습니다.  전체 데이터 조회 또는 관측정점코드, 관측시작/종료일시 등 특정 파라미터 입력을 통해 데이터를 조회할 수 있습니다. 본 데이터의 주요 내용은 관측소 코드, 실시간 수온, 수소이온농도(pH), 염분, 전기전도도, 탁도, 용존산소 등 해양수질과 관련된 항목별 실시간 측정값 및 측정일시로 구성되어 있습니다.  본 데이터는 해양환경 변화 분석, 해양수질 상태 점검, 수질오염 예측 및 대응, 연구기관의 해양생태 연구, 해양 방재 계획 수립, 정책 분석 등 다양한 해양 및 환경 관련 연구와 관리 업무에 활용될 수 있습니다.
