summary_user: 해양수질자동측정망 관측정점별로 측정일시마다 수온·염분·전기전도도·pH·용존산소·탁도·클로로필·남조류량을 담은 실시간 건별 측정자료이며, 범위는 전국 해역이다. 연구자나 연안 관리 담당자가 특정 정점의 최근 용존산소·수온 변화를 보고 저산소나 적조 징후를 점검하는 데 쓴다. 전역 조인 키는 없고 관측정점코드(rtmWqWtchStaCd)를 같은 기관의 관측소 정보와 코드·이름 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 행정구역·다른 기관 데이터와 직접 결합할 수 없고, 정점 위치는 별도 관측소 정보로 매핑해야 한다. 행정단위가 비공간이라 좌표·지역 단위 집계는 이 데이터만으로 하지 않는다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
