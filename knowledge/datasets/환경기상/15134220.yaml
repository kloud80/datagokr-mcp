summary_user: 경주시 관내 대기배출시설 설치 사업장을 사업장 한 곳당 한 행으로 담은 원장형 파일(csv 약 99KB)로, 사업장명·종별·허가/신고 구분과 일자·업종·소재지(도로명·지번)를 포함한다. 주민이나 분석가가 '우리 동네 근처에 어떤 업종의 몇 종 대기배출 사업장이 언제 허가·신고됐는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 사업장명·소재지 주소를 맞춰 보거나 같은 기관(경주시) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 경상북도 경주시 관내 대기배출시설 설치 현황을 정리한 자료로, 파일 형식으로 제공된다. 주요 항목은 연번, 사업장명, 종별, 허가(신고), 허가일자(신고일자), 업종, 소재지 등으로 구성되어 있으며, 경주시 내 대기배출시설의 설치 규모와 등록 현황을 종합적으로 확인할 수 있다. 본 자료는 대기오염 관리, 환경정책 수립, 행정업무 지원 등에 활용 가능하며, 업종별 시설 분포와 지역적 특성을 이해하는 데 유용하다. 또한 허가 현황을 통해 환경 규제 준수 여부를 점검하고, 지역 환경 개선 및 지속가능한 발전을 위한 기초자료로 활용된다. 데이터는 정기적으로 갱신되어 최신 정보를 반영하며, 시민, 연구자, 행정기관이 폭넓게 활용할 수 있도록 공개된다.
