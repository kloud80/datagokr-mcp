summary_user: "충청남도 태안군에서 구조된 야생동물을 구조 건별(접수번호)로 담은 행정 원천자료로, 종명과 분류(강·목·과), 천연기념물·멸종위기 등급, 구조 일시와 위경도 좌표, 발생원인, 진단, 구조결과(방생·폐사 등)와 방생 위치를 기록한다. 지자체 담당자나 연구자가 '태안군에서 어떤 종이 어떤 원인(예: 차량 충돌)으로 주로 구조되고, 그중 얼마나 방생되는가'를 따져 생태통로 설치나 보전 정책을 검토하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 종 국문명으로 이름 매칭하거나 구조·방생 좌표와 발견주소로 공간 결합해 도로·보호구역 레이어나 충청남도 다른 시군의 구조데이터와 이어 쓴다."
limits: 전역 조인 키가 없어 다른 데이터와는 종명·주소 같은 이름 매칭이나 좌표 기반 공간 결합으로만 연결된다. 범위는 태안군 한 곳의 개별 구조 건이므로, 도 전체나 전국 단위 경향은 다른 시군 데이터를 따로 모아야 볼 수 있다.
