description_portal: 경기도 성남시 배출가스 저감사업의 현황에 관한 데이터로, 사업명, 보조금 지원 대상, 보조금 지원 금액, 차량 대수 의 데이터를 제공합니다. 성남시는 대기환경 개선과 탄소중립 실현을 위한 정책의 일환으로, 매년 다양한 배출가스 저감사업을 시행하고 있습니다. 대표적인 사업으로는 노후경유차 조기폐차 지원, 매연저감장치(DPF) 부착 지원 등이 있으며, 이는 주로 환경부의 국비 보조사업과 연계되어 추진됩니다.성남시는 특히 미세먼지 계절관리제 기간 동안 저공해 미조치 차량의 운행 제한을 병행하며, 배출가스 저감사업을 유도하고 있습니다. 이러한 정책은 성남시 도시 대기질 개선 및 시민 건강 보호 측면에서 매우 중요한 역할을 하고 있습니다.
