description_portal: 서울시 학교공원화사업 대상학교 위치정보입니다.서울시 학교공원화사업은 2001년부터 초중고교를 대상으로 학생들이 자연과 접할 수 있는 기회를 확대하고 옥외 교육환경 개선은 물론 생활권내 부족한 녹지량 확충을 위하여 시행한 사업으로 사업의 주요내용은 운동장 주변 녹화, 옥상녹화, 벽면녹화, 생태연못, 담장개방, 쉼터 조성입니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2842)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
