summary_user: 서울 금천구의 건설폐기물처리업 인허가 사업장을 사업장 단위로 담은 원장으로, 인허가일·영업상태·휴폐업일·주소·좌표·폐기물처리업 구분·허용 보관량 등을 포함한다. 금천구에서 현재 영업 중인 건설폐기물 처리업체가 어디에 있고 얼마나 보관할 수 있는지, 언제 휴업·폐업했는지를 확인하려는 주민·사업자·환경 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 좌표(XCRD·YCRD)로 지도 위 분포를 볼 수 있다.
description_portal: 건설폐기물처리업의 인허가 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호, 소재지 면적, 폐기물처리업 구분, 허용 보관량, 좌표 정보 등 다양한 항목을 포함하고 있습니다. 이를 통해 건설폐기물의 적정 처리와 관련 업체의 설립, 운영, 휴업, 폐업 등 행정적 변동 사항을 파악할 수 있습니다. 해당 데이터는 환경 관리, 정책 수립, 연구, 민원 대응, 지역별 업체 분포 분석 등에 활용되며, 건설폐기물 재활용 촉진, 불법 투기 방지, 처리 시설 확충 계획 등 환경 보호와 자원 순환을 위한 기초 자료로도 유용하게 쓰입니다.
