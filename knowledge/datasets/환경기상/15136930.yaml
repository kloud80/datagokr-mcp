description_portal: 해양환경공단이 구축한 해양생태 관련 공간정보 데이터를 제공합니다. 본 데이터는 주요 연안 및 도서 지역을 대상으로 조사된 해양생태계 현황, 주요 생물서식지, 보호대상종 출현지, 서식환경 특성 등과 관련된 정보를 포함합니다. 공간정보는 좌표 기반으로 구성되어 있으며, GIS를 활용한 생태지도 제작, 서식지 보전계획 수립, 생태영향평가 등의 목적으로 활용됩니다. 데이터는 조사연도, 해역구분, 생태유형, 생물종 분포 등의 항목으로 구성되며, 공공기관, 연구기관, 지자체 등에서 해양생태계 보전정책 수립과 환경관리 기초자료로 활용됩니다.
