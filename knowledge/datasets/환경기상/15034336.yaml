summary_user: 서울 강북구 안 음식물 다량배출사업장(일반음식점·휴게음식점·집단급식소·관광숙박시설·대규모점포)을 사업장 한 곳당 한 행으로 담은 목록으로, 구분·상호·소재지·전화번호·기준일자를 싣는다. 구청 담당자나 음식물 수집·운반·재활용 업체가 '강북구에서 음식물쓰레기를 직접 처리하거나 위탁해야 하는 의무 사업장은 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와 붙일 때는 소재지 주소나 상호를 맞춰 보거나, 다른 자치구의 같은 이름 파일과 나란히 놓고 비교한다.
description_portal: 음식물 다량배출사업장은 폐기물관리법에 의해 영업장 면적이 200㎡ 이상인 일반음식점 및 휴게음식점, 「유통산업발전법」에 따른 대규모점포, 1일 평균 총 급식인원이 100명 이상인 집단급식소,  농수산물 도매시장‧공판장‧종합유통센터, 「관광진흥법」에 따른 관광숙박업소로 음식물쓰레기를 스스로 수집·운반 또는 재활용하거나 폐기물처리시설 설치·운영하는 자, 폐기물 수집·운반업의 허가를 받은 자, 폐기물 재활용업의 허가를 받은 자, 폐기물처리신고자에게 위탁하여 수집·운반 또는 재활용하여야 합니다서울특별시 강북구의 음식물 다량배출사업장 현황 데이터는 연번, 구분(일반음식점, 휴게음식점, 집단급식소, 관광숙박시설, 대규모점포), 상호, 소재지, 전화번호, 기준일자로 구성되어 있습니다.
