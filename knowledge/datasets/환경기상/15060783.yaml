summary_user: 충청남도 당진시 관내 사업장폐기물 배출자 신고 현황을 사업장 한 곳씩 담은 파일로, 상호·사업장 주소·배출 폐기물 종류를 기록한다. 지역 주민이나 환경 분석가가 '우리 동네 어느 사업장이 어떤 종류의 폐기물을 배출한다고 신고했는가'를 확인하는 데 쓴다. 사업자등록번호나 표준 코드 같은 공통 조인 키가 없으므로, 다른 데이터와는 상호명 또는 사업장 주소 매칭(주소를 좌표로 바꾼 뒤 공간 결합 포함)으로만 이어 쓴다.
description_portal: '충청남도 당진시 사업장폐기물 배출자 신고현황 안내(데이터 기준일자: 2026년 7월 1일)충청남도 당진시에서는 관내 사업장에서 발생하는 폐기물의 체계적인 관리를 위해 사업장폐기물 배출자 신고 현황을 관리하고 있습니다. 본 자료는 당진시 관내 사업장의 폐기물 배출자 신고 정보를 정리한 것으로, 다음과 같은 항목들을 포함하고 있습니다:상호: 사업장의 명칭사업장 주소: 사업장이 위치한 주소폐기물 종류: 사업장의 배출되는 폐기물 종류본 자료는 관내 사업장의 폐기물 배출 관련 정보를 한눈에 파악할 수 있도록 구성되어 있어, 행정업무, 환경관리 기초자료, 지역 기반 데이터 분석, 대시민 정보 제공 등의 다양한 목적으로 활용될 수 있습니다.'
