description_portal: '제주특별자치도 내 마을어장 생태환경 수질 일반 데이터를 제공합니다.항목: 측정 연도, 측정 차수, 정점명, 정점 유형, 위도, 경도, 수층, 수심, 수온 등* 이 데이터는 제주도 내 마을어장에서 계절별·해역별로 조사한 수질 지표를 기록한 자료입니다.제주특별자치도 해양수산연구원이 수집했으며, 어장의 환경 상태와 해양 생태계를 평가하는 기초 자료로 활용됩니다.측정 항목에는 수온, 염분, pH, 용존산소량, 포화도, 클로로필 A, 투명도, 수심, 위치(위도·경도) 등이 포함됩니다.즉, 제주도 마을어장의 수질 상태와 해양 환경을 모니터링하고 양식업 및 환경 관리에 활용할 수 있는 데이터입니다.* 활용 분야 : 해양 환경 분석, 양식업 환경 관리, 해양 생태계 연구 등'
