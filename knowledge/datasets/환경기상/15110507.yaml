summary_user: 대구광역시 서구에 신고된 비산먼지 발생 사업을 공사장 한 건씩 담은 원천 목록으로, 등록번호·사업장명·공사장 소재지와 명칭·발생 사업 종류·공사 시작·종료일·대상 사업·규모와 단위를 담는다. 서구 주민이나 분석가가 "우리 동네 근처에서 지금 진행 중인 철거·건축 공사가 어디이고 언제 끝나는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공사장 소재지 주소나 사업장명을 맞춰 연결해야 한다.
limits: 범위가 대구 서구 한 곳뿐이라 다른 시군구나 전국 현황은 이 데이터로 볼 수 없다. 사업자번호 같은 공통 키가 없어 다른 사업장·인허가 데이터와 정확히 연결되지 않으며, 주소·이름 매칭에 의존해야 한다. 개발계정은 하루 10,000회 호출 한도가 있다.
