description_portal: 대구광역시 서구_비산먼지발생사업 신고 현황 데이터의 등록번호, 사업장 명, 공사장 소재지, 공사장 명, 발생 사업, 공사 시작 일자, 공사 종료 일자, 대상 사업, 규모, 단위 항목을 제공하는 서비스본 데이터는 대구광역시 서구 내 비산먼지 발생 사업에 대한 신고 현황을 수록한 자료이다. 해당 데이터는 공사장 단위로 등록번호, 사업장 명칭, 공사장 소재지 및 명칭, 발생 사업의 종류, 공사 시작 및 종료 일자, 대상 사업, 공사 규모와 단위를 포함하고 있다. 건축물 축조, 철거, 지반 정지, 도로 정비 등 다양한 건설 및 토목공사가 비산먼지 발생 사업으로 분류되며, 각 사업의 위치, 일정, 규모를 명확히 파악할 수 있도록 구성되어 있다. 본 자료는 비산먼지 발생 사업에 대한 공공의 이해를 돕고, 환경영향 사전 평가 및 저감대책 수립, 규제 정책 수립 등에 활용할 수 있다. 정보는 표 형식으로 제공되어 행정기관, 연구자, 시민 등 다양한 주체가 용이하게 활용할 수 있다.
