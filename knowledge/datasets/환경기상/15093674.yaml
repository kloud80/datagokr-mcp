summary_user: 대구광역시 달성군의 종량제봉투 판매처를 한 곳당 한 행으로 담은 파일로, 판매처명, 도로명·지번 주소, 위도·경도, 그리고 종량제봉투·음식물 납부필증·대형폐기물 스티커·특수규격봉투를 취급하는지 여부를 담는다. 달성군 주민이 집 근처에서 대형폐기물 스티커나 음식물 납부필증을 파는 곳을 찾을 때 쓰고, 분석가는 판매처가 어디에 분포하는지 지도로 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 좌표로 위치를 맞추거나, 같은 군의 다른 폐기물 배출·수거 지점 파일과 지역 단위로 함께 본다.
description_portal: 생활폐기물 처리를 위해 판매되는 종량제봉투의 판매 현황 정보를 정리한 자료로, 판매 유형, 판매 수량, 판매 시기 등 종량제봉투 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 종량제봉투 판매 현황과 이용 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 종량제봉투 판매 정보에 대한 체계적인 관리를 통해 생활폐기물 배출량 추이와 주민 이용 행태를 분석하고, 효율적인 폐기물 관리 정책 수립 및 청소 행정 운영을 위한 행정적 의사결정을 지원한다. 본 자료는 종량제봉투 판매 및 유통 관리에 대한 행정 관리, 관련 민원 대응과 함께 폐기물 관리 통계 산출 및 환경 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 생활폐기물 감량과 자원순환 촉진을 위한 관리 체계를 강화하고, 공정하고 효율적인 종량제 운영을 통해 쾌적한 생활환경 조성과 지속 가능한 환경 관리 정책 추진을 위한 기초 행정자료로 활용된다.
