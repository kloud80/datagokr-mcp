description_portal: '○ 용어개요* 통계명 : 대기오염(구별)* 통계종류 : 서울시 대기오염물질별 오염도를 측정하여 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 대기오염물질별 오염도 등을 측정하여 적정한 정책의 수립ㆍ시행을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 서울시보건환경연구원 → 시도 → 환경부* 공표주기 : 정기(매년)* 공표범위 : 지역- 서울시 및 자치구내용 - 평균 SO2, PM-10, PM-2.5, NO2, O3, CO의 대기오염도○ 기 타* 초미세먼지 환경기준(국가 및 서울시 기준)은 2015년 부터 적용(환경정책기본법 시행령 제2조)* "－"는 장비 교체 및 점검, 수치 이상 등의 원인으로 유효측정처리 비율(75%) 미만(통계자료의 신뢰성 제고를 위해 75% 이상의 측정치가 확보된 경우에만 유효한 통계자료로 활용)* PM2.5 연평균 환경기준은 2018년 3월 27일 15㎍/㎥으로 변경되었음'
