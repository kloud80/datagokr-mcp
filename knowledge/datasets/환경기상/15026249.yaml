summary_user: 부산광역시 동래구 관내 환경오염배출시설을 사업장 한 곳당 한 행으로 담은 파일 데이터로, 업체명·도로명주소·업종·전화번호와 위도·경도 좌표가 들어 있다. 주민이나 분석가가 "우리 동네 주변에 어떤 배출시설 사업장이 어디에 있고 업종은 무엇인가"를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키(사업자번호 등)는 없어서, 다른 데이터와는 업체명·주소를 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 부산광역시 동래구 환경오염배출시설 현황에 대한 데이터로 구군명업체명도로명주소업종전화번호위도경도데이터기준일자의 항목을 제공합니다.제공항목명1.구군명2.업체명3.도로명주소4.업종5.전화번호6.위도7.경도8.데이터기준일자해당 데이터는 부산광역시 동래구 관내의 환경오염배출시설 현황을 나타내는 데이터 이며 사정에 따라 달라질 수 있습니다변동사항이나 자세한 문의가 필요하시면 부산광역시 동래구 환경위생과 담당자 051-550-4392에게 문의 하시길 바랍니다.
