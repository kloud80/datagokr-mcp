description_portal: 비점오염원은 도시, 도로, 농지, 산지, 공사장 등으로서 불특정장소에서 불특정하게 수질오염물질을 배출하는 배출원입니다. 도시화 및 기후변화로 인한 강우패턴의 변화로 다양한 오염물질이 하천으로 유입됨과 강우시 발생하는 비점오염물질의 정확한 부하량과 주요 오염원의 파악 필요로 설치된 비점오염물질 측정망 운영을 통한 강우시 발생하는 오염물질의 관리 및 대책수립을 위한 기초자료 확보, 실효성 있는 정책수립에 이바지하는 목적으로 비점오염물질 측정망을 운영관리하고 있습니다.현재 운영하고 있는 국가 비점오염물질 측정망의 측정소 별 원격제어 수행 명령 이력 정보데이터를 제공합니다. 상세 코드 정보는 "한국환경공단_비점오염원_시스템 기본정보"에서 확인하실 수 있습니다.
