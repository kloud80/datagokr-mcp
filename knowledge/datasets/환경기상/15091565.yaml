summary_user: 인천광역시 산업단지 배출수를 감시하는 하천감시측정소의 1시간 단위 측정자료로, 측정소별·항목별(화학적산소요구량, 수소이온농도, 용존산소, 수온, 전기전도도) 측정값과 기준치 초과 여부, 측정기 상태, 위경도를 건별로 담으며 기간은 2021년 1월 1일~9월 16일이다. 환경 분석가나 인근 주민이 특정 측정소에서 2021년 중 화학적산소요구량이 기준치를 넘은 시점과 빈도를 확인하는 데 쓴다. 전역 조인 키가 없어 측정소명·군구명 같은 이름 매핑이나 위도·경도 좌표로만 다른 수질·산업단지 자료와 연결한다.
