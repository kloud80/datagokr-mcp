description_portal: 「환경오염시설의 통합관리에 관한 법률」제6조에 따른 허가 또는 변경허가의 신청 및 결정에 관한 정보가 들어있는 통합허가사업장에 대한 통합허가검토결과서 와 통합허가 이후 허가 조건 이행 결과를 요약한 연간 보고서 파일이 들어있다.(환경오염시설의 통합관리에 관한 법률 제33조>사업자는 배출시설등 및 방지시설의 운영ㆍ관리에 관한 연간 보고서를 작성하여 환경부장관에게 제출하여야 한다.(환경오염시설의 통합관리에 관한 시행규칙 제33조) 연간 보고서 작성 및 제출 사업자는 법 제33조제1항에 따라 매년 7월 31일까지 지난 연도의 배출시설등 및 방지시설의 운영ㆍ관리에 관한 연간 보고서를 작성한 후 통합환경허가시스템을 통하여 제출해야 한다.연간 보고서에는 다음 각 호의 사항이 포함되어야 한다.1. 허가조건 및 허가배출기준의 이행에 관한 사항2. 법 제6조제4항제1호에 따른 배출시설등 및 방지시설의 설치 및 운영에 관한 사항3. 법 제6조제4항제3호에 따른 사후 모니터링 및 유지관리에 관한 사항4. 환경오염사고 예방 및 사후조치 등에 관한 사항
