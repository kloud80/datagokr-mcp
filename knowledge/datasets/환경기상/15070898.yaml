summary_user: 전국 대기오염 측정소별 시간 단위 확정 농도(아황산가스·미세먼지·오존·이산화질소·일산화탄소·초미세먼지)를 담은 건별 원천 파일로, 2024-01-01~2025-01-01 약 464만 행이다. 분석가나 지역 주민이 특정 시도·측정소의 시간대별 미세먼지·오존 농도가 어땠는지 확인하는 데 쓴다. 측정소코드와 측정일시로 같은 기관의 측정소 정보나 대기질 실시간 자료와 이어 쓰며, 다른 기관 데이터와 잇는 전역 조인 키는 없다.
description_portal: '대기환경보전법에서 정의하는 대기오염물질이란 대기에 존재하는 물질 중 대기오염의 원인으로 인정된  물질을 의미하며 독성, 생태계, 배출량, 환경기준에 대비한 오염도 등의 기준에 따라 심사 평가위원회를 두어 정한다. 지정된 물질은 아황산가스(SO2), 일산화탄소(CO), 이산화질소(NO2), 오존(O3), 미세먼지(PM-10), 초미세먼지(PM-2.5)을 포함한 64종으로 정하고 있으며, 이 중 카드뮴을 포함한 35종 물질은 특정대기유해물질로 정하여 관리하고 있다. 대기환경기준 항목은 환경정책기본법 시행령 제2조 별표 1과 같으며, 세부적인 측정방법은 대기오염공정시험방법을 따른다. SO2는 자외선형광법(ES 01601.1), CO는 비분산적외선분석법(ES 01602.1), NO2는 화학발광법(ES 01603.1), O3은 자외선광도법(ES 01607.1a), PM-10은 베타선법(ES 01605.1b), PM-2.5는 베타선법(ES 01606.2b)을 사용하여 측정한다. 측정소란 설치목적에 따라 대기오염물질을 측정하기 위해 필요한 시설, 장비를 갖춘 한 개의 단위를 의미하며, 대기환경측정망은 동일한 설치목적을 가진 측정소의 모임을 의미한다. 본 자료는 환경부에서 운영 중인 국가배경농도측정망, 교외대기측정망과 17개 지방자치단체에서 운영 중인 도시대기측정망, 도로변대기측정망의 최종 확정자료이며, 통계자료의 신뢰성 제고를 위하여, 유효 자료비율이 75% 이상의 자료가 확보된 경우만 공개한다. 통계자료  작성 시 기본이 되는 각 측정소별 시간 단위의 SO2, NO2, O3, CO, PM-10, PM-2.5 농도 자료이며, 가스상태 대기오염물질의 단위는 ppm, 입자상태 대기오염물질은 ug/m3을 사용한다.※ 항목별 단위 : SO2(ppm), O3(ppm), NO2(ppm), CO(ppm), PM-10(㎍/㎥), PM-2.5(㎍/㎥)'
