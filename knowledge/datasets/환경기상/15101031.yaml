summary_user: 전북특별자치도 고창군에 있는 대기오염 배출시설 사업장을 한 행에 하나씩 담은 목록이며, 상호·주소·생산품·사용연료·연간 최대 연료사용량·전화번호가 들어 있다(CSV 파일 510바이트 규모의 소량 데이터). 지역 주민이나 환경 분석가가 "고창군 안에서 벙커C유 같은 연료를 쓰는 배출시설이 어디에 있고, 연료를 얼마나 쓰는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 배출원 원장이나 사업장 데이터와는 상호·주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 고창군 대기배출가스시설 공공데이터는 대기오염 배출시설의 명칭과 위치, 사용 연료, 배출량 등의 정보를 제공합니다. 해당 시설은 벙커C유, 중질유, 경질유 등의 연료를 사용하며, 배출되는 오염물질과 배출허용 기준 준수 여부를 포함합니다. 또한, 점검 및 관리 이력도 포함되어 있어 환경 정책 수립과 연구에 활용될 수 있습니다. 데이터는 공공데이터포털에서 CSV 파일로 다운로드하거나 오픈 API를 통해 JSON/XML 형식으로 접근할 수 있습니다. 보다 자세한 내용은 공공데이터포털에서 확인할 수 있습니다.
