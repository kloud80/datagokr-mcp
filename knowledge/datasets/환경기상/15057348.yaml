summary_user: "부산광역시가 측정소(부곡동·학장동·덕천동·광안동·연산동·전포동)별로 조사한 대기 중 중금속 농도(납·카드뮴·크롬·구리·망간·철·니켈·비소 등, 단위 ㎍/㎥)를 측정 시기(inspecYm)와 측정 지점 단위로 담은 측정 기록이며, 포털 설명상 2020년 4월까지 측정된 값이다. 환경 분석가나 주민이 '우리 동네 측정소 주변 대기의 납·카드뮴 농도가 과거에 어느 수준이었고 어떻게 변해 왔나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 측정소 지점코드(예: 221251)나 측정소 이름을 수작업으로 맞춰 부산시 대기질 측정망 자료 등과 이어 쓴다."
description_portal: 부산광역시 대기 중 중금속 조사 데이터로(2020.4월까지 측정) 측정날짜, 측정소지점코드, 납, 카드뮴, 크롬,구리 ,망간,철,니켈,비소,베릴륨,알루미늄,칼슘,마그네슘 등의 정보를 제공 합니다.측정소 지점코드 및 설치위치는 다음과 같습니다.부곡동측정소(221251)- 부곡2동 주민센터, 학장동측정소(221181)-학장초등학교 옥상, 덕천동측정소(221182)-부산하수관로운영사무소 옥상, 광안동측정소(221271)-한바다중학교 옥상, 연산동측정소(221221)-시청 등대광장, 전포동측정소(221252)- 경남공고 옥상(2019.5월말 폐쇄)이며, 중금속 농도 단위는 ㎍/㎥ 입니다.
