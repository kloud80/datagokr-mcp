summary_user: "경기도 31개 시군의 쓰레기종량제봉투 판매지정업소를 업소 한 건씩 담은 인·허가 원천 데이터로, 사업장명·인허가일자·영업상태·폐업일자·지번/도로명 주소·위도경도·취급 항목(예: 관급봉투)을 포함한다. 주민이 '우리 동네에서 종량제봉투를 지금 살 수 있는 가게가 어디인가'를 찾거나, 분석가가 시군별 판매소 분포와 영업 중인 업소 비율을 살피는 데 쓴다. 실측상 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 지자체 생활폐기물 배출·수거 지점 자료와 이름·위치 기준으로 맞춰 쓴다."
description_portal: '경기도 내 쓰레기종량제봉투 판매업체 현황입니다. 시군구의 조례에 따라 정의되는 쓰레기종량제봉투의 판매지정업소의 정보를 제공합니다.※ 경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내에서 쓰레기 종량제봉투를 판매하는 업체들의 현황을 정리한 자료입니다. 항목은 시군명, 사업장명, 인허가일자, 영업상태, 소재지 정보(지번 및 도로명 주소), 도로명우편번호, 위도·경도 및 X,Y좌표값, 업소구분명정보, 신청일자, 항목값정보(예: 관급봉투) 등으로 구성되어 있습니다. 해당 데이터는 각 업체가 관급봉투를 취급하는지 여부와 위치정보를 통해 종량제봉투 구매 가능 지점을 확인할 수 있어, 주민 생활 편의 증진 및 폐기물 관리 정책 수립에 활용될 수 있습니다. 또한 영업상태 및 인허가 정보를 통해 유효 업체 여부를 판단할 수 있습니다.'
