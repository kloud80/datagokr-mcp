description_portal: '서울시 보전산지지역 공간정보 입니다.용어설명 : 보전산지는 「산지관리법」에서 정한 개념으로, 산림을 보호하고 산지의 공익적 기능(수원 함양, 재해 방지, 자연환경 보전 등)을 유지하기 위해 개발이나 전용이 엄격히 제한되는 산지를 말합니다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
