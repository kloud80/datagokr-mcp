summary_user: 경기도 내 유독물관리자·대기환경기술인·수질환경기술인 업무를 위탁받아 수행하는 환경관리 대행기관의 인허가 현황을 사업장 단위로 담고, 인허가일자·영업상태·폐업일자·주소·위경도·실험실 정보를 포함한다. 환경기술인 업무를 맡길 대행업체를 찾는 사업자나 시군별 환경관리 대행 자원을 파악하려는 분석가가 '우리 시군에서 영업 중인 대행기관은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·사업장명·주소로 맞추거나 위경도 좌표로 지도·공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 유독물관리자, 대기환경기술인, 수질환경기술인의 업무를 위탁받아 수행하는 환경관리 대행기관의 인허가 현황을 제공합니다. 항목에는 사업장명, 인허가일자, 영업상태, 소재지 주소, 전화번호, 실험실 정보, 위탁업체명, 위경도 좌표 등 다양한 정보가 포함되어 있으며, 경기도 31개 시군에 걸쳐 환경관리 업무를 대행하는 기관들을 체계적으로 확인할 수 있습니다. 본 데이터는 주간 단위로 갱신되며, XML 또는 JSON 형식의 Open API로 제공되어 활용 편의성이 높습니다. 활용 분야로는 환경관리 자원 파악, 유해물질 관리 체계 점검, 정책 수립용 현황 데이터 분석 등 공공 및 민간 환경관리 분야의 효율적 운영 기반 마련이 있습니다.
