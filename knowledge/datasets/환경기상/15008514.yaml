summary_user: 부산 사상구 환경통합 관제센터가 설치한 대기·악취 관측장비의 지점명, 소재지, 설치 장소, 위도·경도, 설치장비를 관측장소 한 곳당 한 행으로 담은 설치현황 목록이며(2KB 남짓 CSV), 측정값이 아니라 시설 정보다. 사상공단 인근 주민이나 분석가가 '우리 동네 가까이에 악취·미세먼지 관측장비가 어디 있고 무엇을 재는가'를 확인할 때 쓴다. 전역 조인 키가 없으므로 위도·경도로 지도나 다른 측정소 좌표와 겹쳐 보거나, 지점명·소재지 주소를 이름으로 맞춰 같은 기관의 측정자료와 연결한다.
description_portal: '주거지ㆍ노후 사상공단 인접하여 환경오염물질에 주민들이 쉽게 노출, 분지형 위치로 환경오염물질의 정체 등이 발생되어 악취ㆍ미세먼지 등 환경민원이 발생, 주물ㆍ폐수수탁처리업 등 다양한 업종의 노후 공장 밀집으로 환경사고 발생되고 있어,전국  기초자치단체  최초로  I o T(사물인터넷) 기반의 AoT(Analytic of Things)로 구현되어 미세먼지ㆍ악취 등  환경을  과학적으로 관리하는  『사상구 환경통합 관제센터』운영하여 주민 맞춤형 환경정보를 제공하고 주민건강 보호 및 실제적 환경개선 도모부산광역시 사상구 환경통합 관제센터 관측장비 설치현황.- 제공되는 측정자료에 따른 측정 시설 명칭.- 제공되는 측정 시설의 세부 설치위치(좌표값)- 제공되는 측정 시설의 관측항목 목록 : 복합악취, 풍향, 풍속, 온도, 습도, 기압 등.'
