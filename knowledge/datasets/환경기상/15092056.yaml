summary_user: 부산 해운대구가 관리하는 실내공기질 관리 대상 다중이용시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·도로명 소재지·주용도·연면적(제곱미터)을 담는다. 구민이나 시설 운영자, 분석가가 해운대구에서 실내공기질 관리 대상인 시설이 어디에 몇 곳 있고 어떤 용도인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 시설명이나 도로명 주소를 맞춰서만 연결한다.
description_portal: 2026년 4월 1일 기준으로 부산광역시 해운대구에서 관리 중인 ⌈실내공기질 관리법⌋ 적용 대상 다중이용시설 현황으로 시설명, 소재지, 용도, 연면적에 대한 자료를 제공합니다.다중이용시설 소재지는 해당 사업장이 실제로 위치한 장소를 의미하며, 본 데이터에서는 도로명 주소를 기본으로 제공하여 보다 명확하고 표준화된 위치 정보를 전달하고자 하였습니다. 다중이용시설 주용도는 ⌈실내공기질 관리법⌋  제3조(적용대상)에 따라 분류된 항목입니다.현재 데이터는 신규 추가, 폐업, 휴업, 소재지 변경 등 다양한 사유로 인해 지속적으로 변동될 수 있음을 알려드립니다.
