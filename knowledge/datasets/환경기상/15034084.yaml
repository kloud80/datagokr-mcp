summary_user: 부산광역시가 산업단지·공장지역 등 토양오염 우려지역 약 100개 지점에서 조사한 결과를 조사 건별로 담으며, 조사연도·구분·지역·구군·깊이와 토양오염물질 22개 항목 측정값(soil01~soil22)으로 구성된다. 우리 동네 공장 부지 토양에서 중금속 등 오염물질이 기준을 넘었는지, 어느 구·군에서 정화 명령 대상이 나왔는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 구·군 이름(inspec_gu)이나 조사지역 이름을 매핑해 잇는다.
description_portal: '토양환경보전법 제5조(토양오염도 측정 등) 및 토양오염실태조사지침(환경부 예규)를 근거로  부산지역 토양오염 우려지역의 토양 조사로 오염 토양 정화 및 복원을 위한 기초자료를 제공합니다조사대상 : 부산지역 산업단지 및 공장지역 등 100개 지점조사항목 : 토양오염물질 22개 항목 및 수소이온농도사업내용 :  계획수립(부산광역시 맑은물정책과), 시료채취 의뢰(구,군), 시험분석 및 결과정리 보고(부산광역시 보건환경연구원)기대효과 : 토양오염실태조사 결과 기준초과 지점에 대해서는 해당 구군에서 정화책임자에게 정밀조사(6개월 이내) 및 오염토양 정화(2년 이내) 명령 조치'
