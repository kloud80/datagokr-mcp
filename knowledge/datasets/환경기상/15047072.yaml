description_portal: '○ 통계개요* 통계명 : 가로녹시율(생활권역별)* 통계종류 : 서울시 가로 녹시율을 도로기능별로 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 도로기능별 녹시율 현황을 파악하여 도시경관을 보호하고 시민의건강·휴양 및 정서생활 향상에 기여하기 위한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 자치구 → 서울특별시 조경과* 공표주기 : 정기(매년, 1월 1일기준)* 공표범위 : 지역 - 서울시내용 - 서울시 권역별 가로녹시율 현황 등○ 용어설명* 녹시율(綠視率) : 일정 지점에 서 있는 사람의 시계내에서 식물의 잎이점하고 있는 비율을 말함* 간선도로 : 도시내 주요지역을 연결하거나 도시 상호간을 연결하여 대량통과교통을 처리하는 도로* 보조간선도로 : 주간선도로를 집산도로 또는 주요 교통발생원과 연결하여도시교통의 집산기능을 수행하는 도로로서 근린생활권의 외곽을 형성하는 도로* 집산도로 : 근린생활권의 교통을 보조간선도로에 연결하여 근린생활권내교통의 집산기능을 수행하는 도로로서 근린생활권의 골격을 형성하는 도로* 국지도로 : 가구(도로로 둘러싸인 일단의 지역)를 구획하는 도로○ 기타* 대상지역내 가로 유형별로 표본 지역을 선정하여, 가로경관 사진촬영 후사진전체 면적 중 살아있는 식물 잎의 영상이 차지하는 면적비율을 산출함※산출방법: (식물 잎의 투영면적/가로경관 사진면적)*100* 생활권별도심생활권 : 종로구, 중구, 용산구동북생활권 : 성동구, 광진구, 동대문구, 중랑구, 성북구, 강북구, 도봉구, 노원구서북생활권 : 은평구, 서대문구, 마포구서남생활권 : 양천구, 강서구, 구로구, 금천구, 영등포구, 동작구, 관악구동남생활권 : 서초구, 강남구, 송파구, 강동구○ 출 처 : 서울특별시 조경과'
