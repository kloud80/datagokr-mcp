summary_user: 대구광역시 서구 관내 공공 쓰레기통을 설치지점별로 한 행씩 담은 파일로, 도로명 주소 기준 설치위치·지점명·설치개수와 일반쓰레기용·분리수거용 종류를 기록한다(CSV 약 1.5KB의 소규모 원천 목록). 주민이나 구청 담당자가 '우리 동네 버스정류장 근처에 분리수거 쓰레기통이 있는가'를 확인하거나, 거리 청결관리를 위해 쓰레기통 분포를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구명이나 설치위치 주소 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 대구광역시 서구 관내에 설치된 쓰레기통의 위치, 설치지점, 개수 및 종류에 관한 정보를 수록한 자료이다. 생활환경 개선과 거리 청결 유지, 시민 편의를 위해 설치된 공공 쓰레기통의 분포를 파악할 수 있도록 작성되었다. 데이터는 시도명, 시군구명, 구체적인 설치위치, 설치지점명, 설치개수, 쓰레기통 종류 등의 항목으로 구성되어 있으며, 일반쓰레기 수거용과 분리수거용으로 구분된다. 주요 설치 장소로는 버스정류장, 은행 앞, 약국 앞, 공공시설 주변 등이 포함되어 있으며, 위치 정보는 도로명 주소로 상세히 표기되어 있다. 본 자료는 청결관리 및 폐기물 정책 수립, 도시 미관 개선 등 행정 및 연구 목적으로 활용이 가능하다.
