description_portal: 온실가스는 대부분의 태양복사를 투과시키고 지표면에서 방출되는 장파복사를 흡수하거나 재방출하여 온실효과를 유발하는 물질을 말합니다.이들은 긴 체류기간으로 한번 배출되면 대기에 지속적으로 누적되어 지구온난화를 가속시키는 역할을 합니다.대기 중 온실가스 농도는 지구온난화를 직접적으로 추산하고, 배출원과 소멸원의 변화를 유추할 수 있는 좋은 근거자료입니다.기상청은 세계기상기구(WMO) 지구대기감시(GAW) 프로그램의 일환으로 안면도 기후변화감시소에서 이산화탄소를 비롯한 7종의 온실가스를 관측하고 있습니다.
