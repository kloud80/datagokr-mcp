summary_user: 제주특별자치도에서 발생한 폐기물을 기준 연도·시군구·폐기물 구분별로 묶어 하루 평균 발생량과 재활용량(톤/일)을 담은 집계 통계이며, 건별 사업장·처리업체 원장은 아니다. 제주 지역 환경 분석가나 행정 담당자가 "제주시와 서귀포시의 폐기물 유형별 재활용 비율이 연도에 따라 어떻게 달라졌나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 시군구 이름을 맞춰서만 이어 쓴다.
description_portal: 이 데이터셋은 2011년부터 2019년까지 제주특별자치도 내에서 발생한 폐기물의 분류별 발생량과 그에 따른 재활용량 현황을 집계한 공공 통계자료이다. 생활폐기물, 사업장폐기물, 건설폐기물 등 폐기물 유형별로 얼마나 배출되었고 그중 얼마가 재활용되었는지를 연도별로 확인할 수 있어, 지역 자원순환 체계의 실태, 재활용 성과 및 흐름을 객관적으로 파악할 수 있다. 이 자료는 순환자원 정책 수립, 폐기물 처리 방식 평가, 자원 재활용률 개선 방안 모색, 환경영향 분석, 지역 환경관리 계획 수립 등 다양한 행정·환경 분야의 기초 자료로 활용되며, CSV 형식으로 공개되어 누구나 다운로드해 분석할 수 있다.
