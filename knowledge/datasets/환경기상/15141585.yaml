description_portal: 전라남도 함평군은 자원 재활용과 생활폐기물 감축을 위한 정책의 일환으로 관내 의류수거함 설치 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군 전역에 설치된 의류수거함에 대한 위치 정보를 포함하고 있으며, 행정동, 지번주소, 상세위치, 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 해당 데이터는 수거함 설치 분포 분석, 접근성 평가, 재활용 인프라 확충 계획 수립, 환경정비 사업 추진 등 다양한 행정적 활용이 가능하며, 위치기반 지도 서비스, 주민 안내용 환경정보 플랫폼, 자원순환 정책의 효율화에도 실질적으로 활용될 수 있는 공공자원입니다.
