summary_user: 기상청이 관측한 자외선A(320~400nm)와 인체에 홍반을 일으키는 홍반자외선B(280~320nm) 값을 일·월·연 단위로 담으며, 포털 설명상 1994년 1월부터 현재까지 전국 범위를 다룬다. 피부과·보건 연구자나 야외활동 정보 서비스 사업자가 '특정 지역의 여름철 홍반자외선B가 해마다 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기상 관측 자료와는 관측지점 이름이나 같은 기상청 지점 코드를 맞춰서만 이을 수 있다.
description_portal: '자외선 복사는 일반적으로 자외선A(315~400nm), 자외선B(280~315nm), 자외선C(100~280nm)로 나뉘며, 이 중 자외선A와 자외선B는 오존층에 일부가 흡수되고 그 나머지가 지표에 도달합니다. 지표에 도달하는 자외선은 적은 양이지만 인간과 동 · 식물에게 큰 피해를 줄 뿐만 아니라 광화학 반응에도 영향을 미치면서 대기 환경을 변화시킵니다.기상청은 자외선 복사 중 자외선A(320~400nm)와 자외선B 영역 중 인체에 홍반을 발생시키는 홍반자외선B(280~320nm)를 관측합니다.생산주기: 일, 월, 연보유기간: 1994년 1월 ~ 현재'
