summary_user: 충청북도 보은군에서 음식물류 쓰레기를 많이 내는 사업장을 업체 한 곳당 한 행으로 담은 목록으로, 업체명·사업장 주소·사업장 구분·면적 규모(m2)·데이터 기준일자를 담는다. 보은군 안에서 어떤 음식점·집단급식소 등이 음식물 쓰레기 다량 배출사업장으로 관리되는지, 특정 업체가 대상에 들어 있는지 확인하려는 주민·사업자·폐기물 관리 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업장 주소나 업체명을 맞춰 보거나 같은 보은군의 다른 생활폐기물 파일과 나란히 두는 방식으로만 이어 쓴다.
limits: 사업장 목록일 뿐이어서 음식물 쓰레기 발생량이나 처리 현황 통계는 이 데이터로 알 수 없다. 공통 코드 키가 없어서 다른 기관 데이터와 연결하려면 업체명·주소를 직접 맞춰 봐야 하고, 범위는 보은군 한 곳에 그친다.
