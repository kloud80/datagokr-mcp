summary_user: 부산 영도구 공공건축물별 석면조사 결과를 건물 한 건씩 담은 파일로, 건물명·용도·연면적·석면면적과 데이터 기준일이 들어 있으며 파일 크기는 744바이트로 소규모입니다. 주민이나 학부모가 '우리 동네 구청·주민센터 같은 공공건물에 석면 자재가 얼마나 남아 있나'를 확인하거나, 분석가가 연면적 대비 석면면적 비율을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 건물명으로 매칭하거나 같은 기관(영도구) 자료끼리만 연결한다.
description_portal: 석면안전관리법 제21조에 따른 건축물 석면조사에 따른 정보로 공공건축물의 건물명, 용도, 건축면적, 석면함유량 등을 포함합니다.석면은 직경의 0.02~0.03㎛ 정도로 유연성과 열에 대한 저항력이 매우 강하고 약산성을 띄고 있어 건축자재, 자동차 , 가정용품 다양한 분야에서 이용되었습니다.특히 건축물 내에서는 마감재, 단열 및 보온재, 바닥타일, 천장타일, 지붕용 슬레이트 등으로 사용되었습니다.그러나 석면은 호흡기로 인체에 흡입될 경우 치명적인 폐질환을 유발하여 1급 발암물질로 지정되어 석면 사용 금지하고 있습니다.
