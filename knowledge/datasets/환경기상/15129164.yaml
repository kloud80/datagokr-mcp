description_portal: 본 데이터는 전라남도 광양시 관할 지역 내 대기배출시설 운영 사업장 중 IoT 기반 대기오염 측정장치를 부착한 사업장의 현황을 체계적으로 관리하고, 배출시설의 실시간 관리 및 환경오염 방지 정책 수립을 위한 기초자료로 제공하기 위해 구축된 자료입니다. 주요 항목으로는 사업장명, 소재지, 배출시설의 구분을 나타내는 종 정보, IoT 장치 부착 여부, 데이터 기준일 등이 포함되어 있으며, 시도명과 시군구명 항목을 통해 행정구역별 분류가 가능합니다. 본 자료는 대기오염물질 배출원에 대한 관리 강화를 위해 IoT를 활용한 상시 모니터링 체계를 구축하고, 주요 배출시설의 위치 및 관리 현황을 파악함으로써 미세먼지 등 대기질 개선 정책 수립, 환경감시 효율성 제고, 사업장별 오염방지시설 설치 및 개선 계획 수립 등의 목적으로 활용될 수 있습니다. 민간 영역에서는 환경컨설팅, 환경리스크 분석, 오염원 밀집도 평가, 대기오염 관련 연구, ESG 경영 보고서 작성 등 다양한 용도로 연계 활용 가능하며, 해당 자료는 정기적인 현장 점검과 관리기관 보고를 통해 주기적으로 갱신되며 공공데이터포털을 통해 국민 누구나 자유롭게 열람 및 활용할 수 있도록 개방되고 있습니다.
