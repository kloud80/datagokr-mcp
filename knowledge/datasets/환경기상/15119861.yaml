description_portal: 서울특별시 은평구_관용차량 전기차 대수 데이터 입니다. 속성은 보유자치구, 기준년, 기준월, 대수로 구성되어있습니다.이 데이터는 은평구에서 사용하는 공식 차량(관용차) 중 전기차의 월별 보유대수를 집계하며, 보유 자치구, 기준연·월, 대수 등으로 정보가 구성되어 있습니다. CSV 파일로 제공되어, 전기차 관용차량 교체·확충 정책 현황이나 친환경 교통정책 연구에 누구나 활용이 용이합니다. 전기차 도입은 탄소중립, 대기개선, 친환경 공공행정 등 사회적 요구 증가와 맞물려 급속히 확산되고 있으며, 은평구 역시 관용차량 전기차 비율 확대, 충전 인프라 확장, 그린뉴딜 행정실현 등의 방침을 실천하고 있습니다. 최신 기준 전기 관용차 대수는 공식 데이터 다운로드를 통해 확인 가능합니다
