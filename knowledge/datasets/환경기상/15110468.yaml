description_portal: '입력 파라미터를 이용하여 대구광역시 서구_지하수시설현황의  데이터를 조회하는 서비스로 데이터는 용도, 지번 주소, 도로명주소,  데이터 기준 일자 항목로 구성되어 있습니다.[관계법령] 지하수법 시행령[데이터 상세설명]용도: 생활/일반, 공업, 농업 3가지로 구분됩니다.* 생활용수: 가정용 등 일상생활에 사용되는 지하수. 다만, 공업용수와 농ㆍ어업용수에 해당되는 지하수는 제외한다.* 공업용수: 공장이나 그 밖의 생산업체 등에서 제품의 생산 및 설비의 가동에 사용되는 지하수* 농ㆍ어업용수: 농업ㆍ임업ㆍ축산업ㆍ수산업에 사용되는 지하수'
