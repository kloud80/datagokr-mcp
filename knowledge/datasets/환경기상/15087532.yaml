summary_user: 한국산업기술시험원 진주본원(경남 진주시 충무공동) 측정소 한 곳에서 2020년 1월부터 2024년 12월까지 중량농도법(여과지 채취 전후 무게 차이)으로 잰 미세먼지(PM10) 농도를 담은 xlsx 파일(약 36KB)입니다. 진주 혁신도시 일대의 연도·계절별 미세먼지 변화를 보거나, 에어코리아 자동측정값과 중량법 측정값의 차이를 비교하려는 연구자·환경 분석가가 쓴다. 실측 컬럼에 측정소코드 같은 전역 조인 키가 없어서, 다른 대기질 자료와는 측정 날짜와 지역명(진주시 충무공동)을 기준으로 직접 맞춰 이어 쓴다.
limits: 측정 지점이 한 곳뿐이고 시간별 실시간 자료가 아니어서 다른 지역 비교나 경보 판단에는 쓰지 못한다. 파일 머리글이 표 형태로 읽히지 않아 열 이름이 비어 있으므로(Unnamed 0~28), 시트 구조를 직접 확인하고 해석해야 한다. 포털 설명에 따르면 원천 데이터 생산이 중단되어 연간 갱신 대신 수시 갱신으로 바뀌었다.
