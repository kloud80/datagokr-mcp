description_portal: 한국산업기술시험원이 측정한 경상남도 진주시 충무공동 지역의 미세먼지(PM10) 농도 자료입니다. 본 자료는 한국산업기술시험원 진주본원에 설치된 대기질 측정소에서 2020년 1월부터 2024년 12월까지 5년간 정기적으로 수집한 데이터이며, 중량농도법을 활용하여 측정되었습니다. 중량농도법은 실내 또는 외부 공기 중의 미세먼지를 여과지에 일정 유량(1~10L/min)으로 채취한 뒤, 채취 전후 여과지의 중량 차이를 비교하여 공기 중 미세먼지(PM10)의 농도를 산정하는 방식입니다. 본 데이터는 지역 대기질 변화 모니터링, 실내외 공기질 비교 분석, 환경 정책 수립, 대기환경 개선 연구, 시민 건강영향 평가 등 다양한 목적으로 활용될 수 있습니다. 특히 공공기관, 연구기관, 환경 관련 기업 등에서 신뢰도 높은 정량적 분석 자료로 활용 가능성이 높습니다.* 원천 데이터 생산이 중단됨에 따라 기존 연간 단위로 수행되던 데이터 업데이트가 수시 업데이트 체계로 전환되었습니다.
