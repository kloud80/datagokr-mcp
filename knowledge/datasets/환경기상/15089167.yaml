description_portal: 본 데이터는 한국환경산업기술원이 수집·관리하는 석면피해자 및 특별유족의 인정 현황을 연령대와 성별별로 제공하는 공공데이터입니다. ‘연령’, ‘성별’을 기준으로 악성중피종, 폐 암, 석면폐증(1급~3급), 미만성 흉막비후 등 질환별 인정 건수와 특별유족 인정 건수를 집계하여 피해자 분포를 파악할 수 있도록 구성하였습니다. 사용자들은 연령대별·성별별 피해자 비율 분석, 의료 지원 자원 배분, 예방 교육 대상 선정, 보상 프로그램 설계, 정책 효과 검증 등에 활용할 수 있으며, 다른 의료 ·복지 통계와 연계한 통합 분석, 시계열 추이 파악, 인구학적 특성에 따른 위험 노출 연구, 피해 지원  정책 개선 및 중장기 계획 수립에 기초 자료로 활용 가능합니다.
