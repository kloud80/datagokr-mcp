summary_user: 서울 용산구가 지정한 보호수를 한 그루씩 담은 목록 파일(csv 약 2.3KB)로, 지정번호·지정일·수종·수령·나무 크기(수고·흉고·수관)·위치·토지소유자·관리자를 기록한다. 주민이나 연구자가 '용산구에 어떤 오래된 보호수가 어디에 있고 누가 관리하나'를 확인하거나, 필지 주변에 보호수가 있는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 위치(주소) 문자열이나 지정번호로 다른 구의 보호수 현황이나 주소·지도 데이터와 수작업으로 맞춰 써야 한다.
description_portal: '"서울특별시 용산구 지정보호수현황(연번 지정번호 지정년월일 수종명 유형 수령 수고 흉고둘레 흉고직경 수관직경 위치 토지소유자 관리자)에 대한 데이터를 제공합니다<참고 사항>보호수는 노목, 거목, 희귀목 중 역사적인 의미가 높고, 학술적으로 가치가 있다고 판단되어 특별히 보호할 필요가 있는 나무의 경우 산림보호법에 따라 지정됨에 따라 보호수로 지정된 장소는 지역의 상징이자 보존가치가 높은 명소로 여겨짐."지정 보호수 현황" 공공데이터는 각 지방자치단체에서 보호 가치가 있다고 지정한 보호수의 위치, 수종, 수령, 크기, 지정 사유, 관리 기관 등의 정보를 담고 있는 데이터입니다. 보호수란 역사적, 학술적, 경관적 가치가 있거나 지역 주민의 생활과 전통에 깊이 연관된 나무로서 산림자원의 조성 및 관리에 관한 법률 등에 근거하여 지정됩니다. 해당 공공데이터를 통해 시민과 연구자는 지역 내 보호수의 분포 현황을 쉽게 파악할 수 있으며, 환경 보전과 문화재적 가치 연구, 생태관광 자원 활용에 이바지할 수 있습니다. 또한 행정기관은 데이터 기반으로 체계적인 관리, 보존 대책을 수립할 수 있고 일반 국민은 생활 주변의 보호수를 찾아가 자연과 문화유산을 함께 체험할수 있음.'
