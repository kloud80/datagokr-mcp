summary_user: 인천환경공단 가좌사업소 주변 악취 발생 구역에서 측정일자별·측정지점별로 직접 잰 복합악취 희석배수를 지점 주소·위도·경도와 함께 담은 건별 측정 CSV 파일(약 35KB)이다. 인천 서구·동구 공업단지 인근 주민이나 환경 분석가가 "우리 동네 주변 지점의 악취 측정값이 언제, 얼마나 높았나"를 확인하는 데 쓴다. 전역 조인 키는 없어 주소·좌표(위도·경도)로 지도나 다른 공간 데이터와 위치 기준으로 겹쳐 보거나, 같은 기관의 다른 측정 자료와 사업소명·지점명으로 맞춰 쓴다.
description_portal: 인천환경공단 가좌사업소 주변(서구 남쪽 밑 동구 북쪽 공업단지 근처 등) 악취 발생 구역에 대해 각 장소별로 직접 측정한 자료를 CSV형태의 파일로 개방중입니다.개방 자료에는 가좌사업소의 매월 측정일자와 측정 장소명, 세부주소, 측정 좌표 자료(x, y축 위도 경도 좌표) 및 악취 측정 값을 개방하고 있습니다.해당 자료는 1년 주기로 개방하고 있으며, 연 1회 개방을 실시하고 있음을 알려드립니다.해당 자료에 대한 피드백 또는 수정사항이 필요하거나 문의사항이 있는 경우 공공데이터 포털을 통해 문의를 주시면 반영하도록 하겠습니다.
