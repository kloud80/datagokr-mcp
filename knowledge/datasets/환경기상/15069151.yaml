summary_user: 전라남도 안에서 생태계 보전을 위해 특정도서로 지정된 섬을 한 섬당 한 행으로 담은 파일(csv, 약 10KB)이며, 지정번호·도서명·면적(제곱미터)·지번·지정년도·위도·경도가 들어 있다. 섬 방문이나 해안 개발을 검토하는 사람이 '이 섬이 특정도서로 지정돼 출입이나 행위가 제한되는가'를 확인하거나, 필지에 겹치는 환경 규제 레이어를 점검할 때 쓴다. 전역 조인 키는 없어 지번 주소나 위도·경도로 필지·지도 레이어에 공간 매칭하거나 도서명으로 다른 무인도서·보호구역 자료와 이어 쓴다.
description_portal: '- 전라남도 내 특정 도서(도서명, 주소, 면적(제곱미터), 지정년도,  섬, 섬 위치 등) 지정에 관한 데이터입니다.- 전라남도에는 생태계 보호와 자연환경 보전을 위해 특정도서로 지정된 섬들이 다수 있습니다. 이들 섬은 **‘독도 등 도서지역의 생태계 보전에 관한 특별법’**에 따라 환경부 장관이 지정하며, 생태적 가치가 높고 지형·지질적으로 우수한 무인도서가 중심입니다.- 특정도서는 생태학적 가치가 높아 일반인의 출입이 제한될 수 있으므로, 방문을 원하실 경우 사전에 해당 기관에 문의하시어 허가 절차를 확인하시기 바랍니다.- 특정도서는 다음과 같은 기준을 충족하는 섬으로 지정됩니다. - 자연경관이 뛰어난 도서: 화산, 해안, 연안 등, 희귀 동식물 서식지: 멸종위기종 포함, 해양생물 다양성 풍부한 도서, 지형·지질적 가치가 높은 도서, 생태학적으로 중요한 자연림 지역'
