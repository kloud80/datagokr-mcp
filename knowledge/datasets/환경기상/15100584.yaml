description_portal: '경상남도 거창군의 2021년 기준 중질유(벙커CU, 벙커A유) 사용 시설 현황에 대한 데이터 이며 유종, 업체명, 전화번호, 생산품, 사용량 정보를 제공합니다.○ 데이터 기준일 : 2021.01.29○  중질유는 원유를 정제하는 과정에서 얻어지는 점도가 높은 기름으로, 경질유보다 끓는점이 높고 무겁습니다. 주로 벙커C유, 중유 등으로 분류되며, 선박 연료, 산업용 보일러 연료, 발전소 연료 등으로 사용됩니다. 중질유는 에너지 밀도가 높아 대형 설비에 적합하지만, 황 함량과 불순물이 많아 연소 시 대기오염 물질을 배출할 수 있어 환경 규제가 적용됩니다. 최근에는 저유황 중질유나 대체 연료로의 전환이 활발히 이루어지고 있습니다.'
