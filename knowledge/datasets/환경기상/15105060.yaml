summary_user: 김해시 대기환경측정망 6개 측정소(도시대기 5곳·도로변대기 1곳)별로 오존, 미세먼지(PM10), 초미세먼지(PM2.5) 농도를 연도·월 단위로 정리한 월별 집계 파일(CSV, 약 7KB)이다. 김해 시민이나 분석가가 '우리 동네 측정소의 초미세먼지 월평균이 해마다 어떻게 변했나'처럼 측정소별·월별 추이를 비교하는 데 쓴다. 전역 조인 키나 측정소 코드가 없어 다른 대기질 데이터와는 측정소명을 이름으로 맞춰 잇거나 연도·월 기준으로만 붙여 쓴다.
limits: 월 단위 집계라 시간별 실시간 농도나 경보·주의보 판단에는 쓰지 못한다. 측정소 코드가 없어 에어코리아 측정소 데이터와 연결하려면 측정소명을 직접 매핑해야 한다.
