summary_user: 부산광역시 중구 관내에서 허가받은 폐기물 처리업체를 업체 한 곳당 한 행으로 담은 소규모 원장 파일(약 676바이트 CSV)로, 처리업종·업체명·소재지·허가일·전화번호를 담는다. 중구 주민이나 사업자가 생활폐기물·사업장폐기물·건설폐기물 수집운반을 맡길 업체가 어디이고 연락처가 무엇인지 확인할 때 쓴다. 전역 조인 키는 없어 다른 지역의 폐기물 처리업 현황과는 업체명·주소를 기준으로 맞춰 이어 써야 한다.
description_portal: 부산광역시 중구 관내의 폐기물 관련 현황에 대한 데이터로 폐기물 대행 업체명, 소재지, 허가일, 전화번호 등의 항목을 제공합니다. 중구 관내 현재 허가받은 폐기물 처리업체는 총 6개 업체로, 생활폐기물 수집운반업체 (주)영진, (주)신아환경 2개소, 사업장배출시설계 폐기물 수집운업체 신세기기업(주), 국양로지텍(주), 지성이삿짐센터  3개소, 건설폐기물 수집운반업체 (주)태성환경산업 1개소입니다. (주)영진은 동광, 보수, 부평, 영주1, 영주2동 6개 공동주택에서 배출되는 폐기물을 수집운반하고 있으며, (주)신아환경은 중앙, 대청, 광복, 남포, 영주2동에서 배출되는 폐기물을 수집운반하고 있습니다.
