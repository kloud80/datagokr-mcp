summary_user: 전국에 등록된 운행자동차 전문정비업체 670곳을 업체 한 건씩 담은 목록으로, 시도·시군구, 상호명, 사업장소재지, 정비업무범위를 포함한다. 정밀검사에서 2회 이상 부적합 판정을 받은 차량의 소유자가 정비·점검을 받을 가까운 전문정비업체를 찾을 때 쓴다. 사업장소재지(address)를 키로 다른 주소 기반 데이터와 이어 쓰며, 사업자번호 같은 별도 키는 필드에 없다.
description_portal: 환경부에서는 대기환경보전법에 따라 정밀검사 결과 2회 이상 부적합 판정을 받은 자동차의 소유자는 전문정비사업자에게 정비, 점검을 받은 후 전문정비사업자가 발급한 정비, 점검 결과표를 지정받은 종합검사대행자 또는 종합검사지정정비사업자에게 제출하고 재검사를 받도록 하고 있습니다.이에, 한국환경공단에서는 자동차 배출가스 종합전산시스템을 통해 해당 자료를 관리하고 있습니다.자동차 배출가스 종합전산시스템에서 관리하는 자료 중, 2026년 기준 전국에 등록되어 있는 전문정비업체의 자료를 공개하오니 참고하여 주시기 바랍니다.(각 지역별 전문정비업체의 상호면, 주소, 연락처 등)
