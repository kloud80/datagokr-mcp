summary_user: 인천 부평구의 생활폐기물 처리업체를 업체 한 곳씩 담은 원천 목록 파일(csv, 약 1.2KB)로, 처리하는 폐기물 종류(생활쓰레기·대형폐기물·별도처리폐기물·가정사업계마대 등), 업체명, 소재지, 수거 담당 구역, 연락처를 담는다. 부평구 주민이 "우리 동네 대형폐기물이나 생활쓰레기는 어느 업체가 수거하고 연락처는 무엇인가"를 확인하거나, 행정 담당자가 구역별 수거 업체 배치를 점검하는 데 쓴다. 전역 조인 키가 없어 수거담당구역의 행정동 이름이나 업체명·소재지 주소를 기준으로 다른 폐기물 처리업 허가 목록이나 수거 지점 데이터와 이름 매칭으로 잇는다.
description_portal: '생활폐기물 처리업체의 명칭, 소재지, 수거 담당 구역, 연락처, 처리 폐기물 종류 등을 수록한 데이터.생활쓰레기, 대형폐기물, 별도처리폐기물, 가정사업계마대 등 처리 항목별 업체 현황을 파악하고, 효율적인 폐기물 수거·처리 관리, 환경 정책 수립 및 주민 편의 증진에 활용 가능하다.활용 목적 및 특징– 처리폐기물종류별 생활폐기물 처리업체 현황 분석– 업체별 담당 구역 및 소재지 기반 운영 특성 파악– 생활폐기물 수거 체계 및 행정 관리 자료 활용– 환경 위생 관리 및 주민 생활편의 증진 정책 근거 제공주요 항목 설명● 처리폐기물종류: 업체가 처리하는 폐기물 종류(생활쓰레기, 대형폐기물 등)● 업체명: 등록된 폐기물 처리업체의 명칭● 소재지: 업체가 위치한 주소● 수거담당구역: 업체가 관리·수거를 담당하는 행정 구역● 연락처: 업체 문의 및 민원 대응을 위한 전화번호'
