summary_user: 서울 구로구의 건설폐기물처리업 인허가 사업장을 한 곳씩 담은 원장으로, 인허가일자·영업상태(영업·휴업·폐업 등)·폐업·휴업 기간·사업장명·지번/도로명 주소·좌표와 처리 구분·허용 보관량 같은 속성을 사업장 단위로 기록한다. 구로구에서 지금 영업 중인 건설폐기물 처리업체가 어디에 있고 언제 허가받았는지, 최근 폐업·휴업한 곳은 어디인지 확인하려는 주민·사업자·환경 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로 잇고, 좌표(XCRD·YCRD)는 지도·공간 분석에 겹쳐 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 건설폐기물처리업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 건설폐기물처리업 시설의 면적, 건축물 연면적, 업태구분 등 주요 속성이 기록된다. 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 운영 현황을 파악하는 데 활용된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 정책 수립, 연구 분석, 민원 처리, 환경 관리 등 여러 분야에 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 행정 서비스 개발 등에 연계하여 활용할 수 있어, 지역사회 정보 접근성을 높이고 행정 투명성을 강화하는 기반 자료로 기능한다.
