description_portal: '한국소비자원에서 직접 및 간접적으로 배출하는 연간 온실가스 배출량으로 이산화탄소 상당량(tCO2eq)으로 환산한 값입니다. 온실가스·에너지 목표관리제란 「기후위기 대응을 위한 탄소중립ㆍ녹색성장 기본법」에 따른 국가 온실가스 감축 목표(2030년까지 2018년 대비 40% 감축)를 달성할 수 있도록 온실가스 배출량이 (50,000tCO2eq 이상 업체, 15,000tCO2eq 이상 사업장) 지정 기준 이상인 업체 및 사업장을 관리업체로 지정하여 온실가스 감축목표를 설정하고 관리하는 제도입니다. 데이터 컬럼은 연도, 총 온실가스 배출량, 직접배출량, 간접배출량입니다.이 데이터를 통해 한국소비자원의 환경 책임 이행을 투명하게 공개하고, 탄소 중립 사회로의 전환 노력에 동참하고자 합니다.* CO2eq(이산화탄소 상당량) : 이산화탄소에 대한 온실가스의 복사 강제력을 비교하는 단위로서 해당 온실가스의 양에 지구 온난화지수를 곱하여 산출한 값을 말함.'
