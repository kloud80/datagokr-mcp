summary_user: 전국 중소형 폐가전 수거함 거점을 한 곳씩 담은 건별 정보로, 설치위치명·도로명/지번 주소·건물 좌표, 요일별 운영시간·휴무, 전화번호, 처리업체, 취급품목을 담는다. 집에서 나온 소형 가전을 무료로 버리려는 주민이 '우리 동네에서 가장 가까운 수거함이 어디이고 언제 이용할 수 있는가'를 찾을 때 쓴다. 전역 조인 키는 없으므로 지역명·주소 문자열이나 위경도 좌표로 행정구역 경계나 다른 배출 지점 데이터(대형폐기물·종량제 판매소 등)와 맞춰 이어 쓴다.
limits: 검증 호출에서 0행이 수신되어 실제 거점 수와 내용 채움 정도는 확인되지 않았다. 폐가전 발생량·회수량 같은 통계는 담지 않는다. 다른 데이터와 묶는 공통 코드가 없어 주소·이름 매칭이나 좌표로만 연결된다.
