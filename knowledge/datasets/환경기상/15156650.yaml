description_portal: 「전기‧전자제품 및 자동차의 자원순환에 관한 법률」에 따라 폐전기‧전자제품의 회수‧재활용 촉진을 위하여 무료로 폐가전을 분리배출 할 수 있도록 전국에 “중소형 폐가전 수거함”이 설치‧운영되고 있습니다. 2026년부터 모든 전기‧전자제품이 무료 배출 대상이 되어 국민들은 폐기물 수수료를 내지 않고 모든 폐가전을 무료로 수거함에 배출할 수 있게 되었습니다.해당 서비스는 중소형 폐가전을 분리배출하는 가정에 전국 수거함 거점 기본정보(거점명, 주소)와 운영정보(전화번호 등)를 제공하여, 국민의 접근성과 편의성을 높이고 폐전기‧전자제품의 안정적인 회수‧재활용을 지원합니다.
