summary_user: 서울 금천구 안의 특정 토양오염 관리대상시설(주유소·산업시설 등)을 시설 한 곳당 한 행으로 담은 파일로, 상호명·도로명/지번 주소·위도·경도·시설 구분·완공(검사)일·저장 물질 종류와 용량을 포함한다. 주민이나 부동산·개발 검토자가 "이 필지 주변에 유류를 저장하는 토양오염 위험 시설이 있는가"를 확인하거나, 행정·연구자가 구 안의 오염원 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어 주소나 좌표(위도·경도)로 다른 공간 레이어나 사업장 데이터와 맞대어 쓴다.
description_portal: 토양의 건강성을 지키기 위해, 서울특별시 금천구 내 특정 토양오염 관리대상시설의 현황을 투명하게 공개하는 데이터입니다. 본 데이터는 토양오염을 유발할 수 있는 위험 시설의 현황과 분포를 체계적으로 관리하고, 오염 사고를 사전에 예방하여 쾌적하고 안전한 생활환경을 조성하는 데 기여하고자 합니다.데이터에는 각 시설의 상호명, 소재지(주소), 시설 구분(주유소, 산업시설 등)과 같은 기본 정보와 함께, 완공(검사)일, 저장 물질의 종류 및 용량 등 오염원 관리에 필수적인 상세 정보를 포함하고 있습니다.환경 정책을 수립하는 행정기관, 관련 법규 준수 여부를 확인해야 하는 기업, 그리고 토양 환경을 연구하는 학계 및 연구기관에 신뢰도 높은 기초자료를 제공합니다. 이를 통해 지역 내 환경 위험 요소를 과학적으로 분석하고, 지속가능한 도시 환경을 위한 정책을 수립하는 데 유용하게 활용될 수 있습니다.
