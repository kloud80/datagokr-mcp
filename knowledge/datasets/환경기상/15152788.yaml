description_portal: 경기도 하남시 각 행정동 단위에서 수집된 대기오염도 실시간 측정 자료로, 시간대별로 주요 오염물질 농도를 정밀하게 기록하고 KHAI 통합대기환경지수까지 함께 제공하는 환경데이터입니다. SO₂·CO·O₃·NO₂와 같은 기체 오염물질뿐 아니라 PM10·PM2.5의 1시간 평균 농도와 등급을 포함하고 있어 시민 건강과 직결되는 미세먼지·초미세먼지 등급을 정확히 판단할 수 있습니다.각 오염물질별 등급과 관리 기준 충족 여부는 환경기준 초과 여부를 빠르게 식별할 수 있는 지표입ㄴㅣ다.이 자료는 스마트시티 관제, 기상·대기 예보 시스템, 환경정책 평가 등 다양한 행정 영역에서 핵심적으로 활용될 수 있습니다.
