description_portal: 경기도 고양시 수렵면허교부신청내역현황 데이터는 수렵면허 교부 신청 및 발급 현황 정보를 제공하는 공공데이터입니다.수렵면허는 「야생생물 보호 및 관리에 관한 법률」에 따라 수렵장에서 수렵동물을 포획하려는 경우 필요한 면허로, 총기를 사용하는 제1종과 총기 외 수렵도구를 사용하는 제2종으로 구분됩니다. 또한 면허 취득 후 5년마다 갱신이 필요합니다.수렵면허를 신청하려면 수렵면허시험 합격 및 수렵강습 이수 후 구비서류를 갖추어 관할 행정기관에 신청하여야 합니다.해당 데이터는 2012년 1월부터 2026년 5월까지의 수렵면허 신청 및 발급 현황을 포함하고 있으며, 주요 항목은 면허번호, 접수구분, 면허종별, 총기류, 수렵방법, 교부일자 등입니다.
