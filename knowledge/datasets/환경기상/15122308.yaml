description_portal: 이 데이터는 해양수산부에서 국가해양환경 온라인 플랫폼에서 운영중인 교육 과정 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 온라인 플랫폼에서 개설된 각 과정의 과정코드, 과정명, 과정에 대한 주요 교육 내용 및 과정 내에서 활용하는 학습도구 명칭 등으로 구성되어 있습니다.  본 데이터는 해양환경 및 해양수산 분야 교육 과정 개발, 참여 현황 분석, 교육 이수 내용 확인, 과정별 레슨 구성 분석 등에 활용될 수 있습니다. 교육 프로그램 개선, 해양환경 인식 제고 방안 연구, 과정 운영 실적 점검 등의 목적에도 사용할 수 있습니다.
