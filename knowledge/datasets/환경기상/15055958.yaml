summary_user: 광주 광산구에서 폐기물관리법에 따라 허가받은 폐기물 재활용 업체(중간·최종·종합재활용업)를 업체 한 곳당 한 행으로 담은 원장 파일로, 업종·사업장명·주소·등록일자·취급 폐기물종류와 위도·경도를 포함한다. 사업장 폐기물을 배출하는 사업자나 분석가가 "광산구에서 특정 폐기물을 재활용해 주는 업체는 어디에 있나"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 위도·경도 기반 위치 결합으로만 이어 쓴다.
limits: 광산구 한 시군구만 다루므로 광주 전체나 다른 지역 업체는 없다. 사업자번호 같은 공통 키가 없어 다른 처리업·배출자 원장과 정확히 연결하기 어렵다. 폐기물 발생량·처리실적 같은 통계는 담지 않는다.
