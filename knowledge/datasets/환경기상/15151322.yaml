description_portal: 이 데이터는 가스오븐렌지 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지와 200개의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에 저장되어 있습니다. 이미지는 다양한 형태와 디자인의 가스오븐렌지가 포함되어 있으며, 주로 주방 등 실내 환경에서 촬영되었습니다. 촬영 각도는 정면, 측면, 상단 등 다양하게 구성되어 있으며 외관, 조작부, 손잡이 등이 시각적으로 확인 가능합니다. ‘labels’ 폴더 내 라벨링 파일은 YOLO 형식으로 작성되어, 각 가스오븐렌지의 위치 정보와 클래스명이 좌표값으로 기록되어 있습니다. 데이터는 객체 탐지 및 분류 모델 학습에 활용될 수 있도록 일관된 구조와 명명 규칙을 따르고 있습니다.
