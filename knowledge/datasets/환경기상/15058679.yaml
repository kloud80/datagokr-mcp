summary_user: 경기도 내 대기측정 대행업체를 업체 단위로 담은 현황 목록으로, 감독기관·기관분류·대상기관명·분야·등록일자와 사업장·실험실의 주소·전화번호·위경도 좌표를 포함한다. 대기 배출시설을 운영하는 사업자가 우리 시군 근처에서 자가측정을 맡길 수 있는 등록 대행업체가 어디인지 찾거나, 연구자가 시군별 측정 대행 인프라 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 같은 경기도 데이터나 배출시설 사업장 자료와 이름·위치로 맞춰 이어 쓴다.
description_portal: 이 데이터는 지역 내 대기질 관리를 위한 대기측정대행업체의 현황을 나타내며, 환경오염 모니터링 및 관리를 위한 민간 측정 대행 인프라의 구축 실태를 제공합니다. 주요 항목에는 감독기관명(MNG_INST_NM), 기관분류명(INST_CLASS_NM), 사업장소재지도로명주소(REFINE_ROADNM_ADDR), 실험실전화번호(LABOTRY_TELNO), 사업장전화번호(BIZPLC_TELNO), 등록일자(REGIST_DE), 분야명(FIELD_NM), 지역명(REGION_NM) 등이 있으며, 실험실과 사업장의 위치정보(WGS84위도·경도)도 포함됩니다.이 데이터는 환경관리부서나 정책기관에서 미세먼지, 오존 등 대기오염물질의 측정 대행 업체를 체계적으로 관리하기 위한 용도로 활용됩니다. 또한 기업 입장에서는 외부 측정 대행을 의뢰할 수 있는 업체 탐색 자료로, 시민단체나 연구자에게는 지역별 대기 측정 인프라의 밀도나 품질을 분석하는 기반 자료로 사용됩니다. 정기적으로 제공되는 정보는 대기오염 규제 이행 점검이나 민간 측정 신뢰도 검증 자료로도 활용 가능합니다.
