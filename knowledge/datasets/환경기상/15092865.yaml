summary_user: 김해시에서 실내공기질관리법 적용을 받는 다중이용시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명주소·시설군·전화번호·연면적(제곱미터)을 담는다. 시민이나 분석가가 "우리 동네에서 실내공기질 관리 대상인 시설이 어디이고 어떤 유형인가"를 확인하거나, 담당 부서가 점검 대상 목록을 정리하는 데 쓴다. 공통 코드 같은 전역 조인 키는 없으므로 다른 데이터와는 도로명주소나 시설명을 맞춰 연결해야 한다.
description_portal: '경상남도 김해시 실내공기질관리법 적용대상 다중이용시설 현황에 대한 데이터로 시설명, 도로명주소, 시설군, 전화번호, 연면적(제곱미터)의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 11월 26일로, 연간 주기로 관리하고 있습니다.* 데이터 미집계 또는 개인정보(휴대폰번호) 포함의 사유로 전화번호에 공란이 많이 있습니다.* 해당 데이터는 분석·연계하여 정책 수립 및 지역 사회 문제 해결 등 다양한 분야에 활용하실 수 있습니다.데이터 담당부서 : 김해시 기후대응과(055-330-3354)[데이터 변동 안내]1. 데이터 현행화2. 데이터 설명 수정3. 데이터 키워드 추가4. 데이터 기준일 변경'
