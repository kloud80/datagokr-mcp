summary_user: 서울특별시의 자동차 평균 주행거리(한 대가 1년 동안 주행하는 평균 거리)를 기준연도별로 담은 집계 데이터로, 포털 설명상 2016년부터 2024년까지를 다룬다. 서울 차량이 해마다 얼마나 주행했는지, 주행거리 추이가 어떻게 변했는지를 보려는 분석가가 수송 부문 온실가스·배출가스 추정이나 교통 수요 변화 분석에 쓴다. 전역 조인 키는 없고 기준연도(CRTR_YR)를 맞춰 서울시 자동차 등록대수나 배출량 통계 같은 연도별 자료와 나란히 붙여 쓴다.
description_portal: '서울특별시 자동차 평균 주행거리를 년도별(2016년~2024년)로 검색할 수 있는 서비스 입니다.*용어설명- 자동차 평균 주행거리 :  보통 1년 동안 한 대의 차량이 주행하는 평균 거리 (예: 한국의 경우 약 12,000km/년, 국가·차종별로 다름).- 승용차 마일리지(연비) :  차량이 연료 1리터(또는 1갤런)로 주행할 수 있는 거리 (예: km/L 또는 mpg).※ 제공부서 : 서울특별시 기후환경본부 기후환경정책과(02-2133-3614)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
