summary_user: 기상청 방재기상관측(AWS) 지점별로 일최고·일최저기온 관측값과 3일 중기예보 기온을 날짜별로 나란히 담은 파일 데이터로, 시도·구군과 위도·경도가 함께 붙어 있으며 전국 범위다(csv 약 40KB). 도로위험 기상정보 서비스를 만드는 사업자나 분석가가 '중기예보 기온이 실제 관측 기온과 지점별로 얼마나 어긋났는가'를 확인하거나 노면 결빙 위험 판단 모델을 시험할 때 쓴다. 공통 조인 키는 없어서 시도·구군 이름이나 위도·경도 좌표로 기상청 관측·예보 자료 또는 도로 위치 데이터와 맞춰 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 이름 매핑이나 좌표 근접으로만 연결해야 한다. 기온 외의 기상요소는 없고 특정 솔루션용으로 정리된 자료이므로, 다른 요소나 최신 실시간 값이 필요하면 기상청 자료를 따로 써야 한다.
