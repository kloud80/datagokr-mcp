summary_user: 인천환경공단 청라사업소 주변(서구·청라 일대) 악취 발생 구역에서 지점별로 직접 측정한 복합악취 희석배수를 측정일자·측정지점·주소·위경도 좌표와 함께 건별로 담은 CSV 파일(약 22KB)이다. 청라 주민이나 지역 환경 분석가가 "우리 동네 어느 지점에서 악취가 얼마나 측정됐는가"를 확인하거나 지점별·월별 악취 수준을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 측정지점 이름을 맞춰 이어 써야 한다.
description_portal: 인천환경공단 청라사업소 주변(서구 및 청라 근처 등) 악취 발생 구역에 대해 각 장소별로 직접 측정한 자료를 CSV형태의 파일로 개방중입니다.개방 자료에는 청라사업소의 매월 측정일자와 측정 장소명, 세부주소, 측정 좌표 자료(x, y축 위도 경도 좌표) 및 악취 측정 값을 개방하고 있습니다.해당 자료는 1년 주기로 개방하고 있으며, 연 1회 개방을 실시하고 있음을 알려드립니다.해당 자료에 대한 피드백 또는 수정사항이 필요하거나 문의사항이 있는 경우 공공데이터 포털을 통해 문의를 주시면 반영하도록 하겠습니다.
