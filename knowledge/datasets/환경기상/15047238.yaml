description_portal: '○ 통계개요* 통계명 : 강수량* 통계종류 : 기상청에서 제공하는 서울시 강수량을 제공하는 일반ㆍ보고통계(승인통계 제14102호)* 작성목적 : 서울시 강수량 현황을 제공하여 효율적인 관리 및 재해예방을 위한기초자료를 제공하는 것을 목적으로 함* 작성체계 : 지역별 기상관서 → 기상청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 월별 강수량○ 용어설명* 강수량 : 비나 눈, 우박 등과 같이 구름으로부터 땅에 떨어져 내린 강수의 양을 말함.어느 기간 동안에 내린 강수가 땅 위를 흘러가거나 스며들지 않고, 땅 표면에 괴어있다는 가정 아래 그 괸 물의 깊이를 측정한다. 눈·싸락눈 등 강수가 얼음인 경우에는이것을 녹인 물의 깊이를 측정한다. 비의 경우에는 우량 또는 강우량이라고도 하며,단위는 ㎜로 표시'
