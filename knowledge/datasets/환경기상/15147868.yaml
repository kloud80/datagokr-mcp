description_portal: 청계천은 서울의 대표적 도심 하천으로, 서울시민이 애용하는 산책 및 여가의 공간입니다. 시민여러분의 쾌적한 청계천 이용을 위해 서울시 보건환경연구권과 7개 지점의 복합악취를 매월 측정하고 있습니다. 본 데이터는 2020년부터의 복합악취 결과이며 부지경계선 15배 이하 기준으로 관리하고 있습니다. 여기서 부지경계선은 토지의 끝부분을 뜻하나 본 측정에서는 부지경계선 내부 지점인 산책로와 복개구조물 개구부(수문) 중간지점에서 측정함을 안내드립니다.  민간 기업, 연구기관 등에서 활용 시 청계천 악취 저감 정책의 효과성 분석, 새로운 악취 저감 기술 발굴, 악취 예측 등에 활용 가능합니다.
