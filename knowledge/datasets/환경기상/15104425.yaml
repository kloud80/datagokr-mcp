summary_user: 서울 양천구 관내에 설치된 담배꽁초 쓰레기통을 설치 장소별로 한 행씩 담은 목록으로, 설치장소·설치개수·도로명주소·설치일자를 기록한 시군구 범위의 개별 위치 데이터다(CSV 약 1KB의 소규모 파일). 주민이 양천구에서 담배꽁초를 버릴 수 있는 곳이 어디인지 찾거나, 분석가가 흡연 폐기물 수거함이 어느 거리에 몰려 있는지 살펴볼 때 쓴다. 전역 조인 키는 없어 도로명주소를 지오코딩하거나 주소 문자열로 다른 지자체의 담배꽁초 수거함·생활폐기물 수거 지점 파일과 맞춰 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구 관내 설치된 담배꽁초 쓰레기통의 위치 및 관리 현황을 체계적으로 기록한 자료이다. 해당 쓰레기통은 공공장소에서 발생하는 흡연 폐기물의 적정 처리를 통해 거리 청결 유지와 환경오염 방지를 목적으로 설치되었다. 데이터는 설치 장소, 설치개수, 도로명주소, 설치일자 등의 세부 정보를 포함하며, 이를 바탕으로 효율적인 폐기물 수거 및 관리가 이루어지고 있다. 양천구청은 본 자료를 활용하여 공공시설의 청결과 시민 건강 증진을 도모하며, 시민 참여를 통한 쾌적한 생활 환경 조성에 기여하고자 한다. 해당 데이터는 정기적으로 갱신되어 최신 현황을 반영하며, 환경정책 수립의 기초 자료로 활용된다.
