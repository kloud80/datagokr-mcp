summary_user: 환경영향평가 대상 사업별(사업코드 단위)로 사업구역 주변 읍면동의 생활폐기물 발생량(공사 시·운영 시, kg/일)과 건설폐기물·사업장배출시설계 폐기물(ton/일), 지정폐기물(ton/년)의 매립·소각·재활용 처리 현황을 담은 전국 범위 파일 데이터입니다. 개발사업 검토자나 분석가가 특정 사업의 공사·운영 단계에서 생활폐기물이 하루 얼마나 생기고, 주변 지역 폐기물이 어떤 방식으로 처리되는지 확인하는 데 쓴다. 전역 조인 키는 없고, 사업코드(MGTNO)로 같은 기관의 다른 환경영향평가 항목별 데이터와 잇거나 시군구읍면동 명칭으로 이름 매핑해 토지이용규제·개발사업 정보와 연결한다.
limits: 공간 좌표가 없는 비공간 데이터이고 표준 행정코드 같은 전역 조인 키가 없어, 다른 데이터와 붙이려면 사업코드나 읍면동 명칭을 직접 맞춰야 한다. 평가 협의 때 한 번 만들어진 뒤 바뀌지 않는 이벤트성 자료라 지역 폐기물 현황을 주기적으로 추적하는 데에는 맞지 않는다.
