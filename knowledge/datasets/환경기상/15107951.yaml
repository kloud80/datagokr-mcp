summary_user: 국립공원 안의 서식환경 지점(식생, 점·비점오염원, 로드킬 구간, 생태통로, 훼손지 등)을 지점별로 담은 원천 목록으로, 공원명·환경분류·지점명·위치·주소와 경도·위도 좌표를 포함하며 zip 파일(SHP 공간정보 동봉)로 받는다. 국립공원 연구자나 환경 분석가가 '이 공원의 로드킬 구간과 생태통로는 어디에 있고 훼손지와 얼마나 가까운가' 같은 질문을 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없어서 공원명이나 주소 문자열로 다른 국립공원공단 데이터와 맞추거나, 경도·위도 좌표로 다른 공간 데이터와 공간 결합해 쓴다.
description_portal: 국립공원공단_서식환경 현황 데이터는 국립공원 내 서식환경에 대한 공간적 분포와 현황 정보를 담고 있으며, 생성 연도 기준으로 관리됩니다. 본 데이터는 환경분류, 지점명, 지점위치, 지점주소, 경도·위도 좌표 등으로 구성되어 있으며, 서식환경 유형은 식생, 점오염원, 비점오염원, 로드킬 구간, 생태통로, 훼손지 등으로 세분화됩니다. 공간정보(GIS) 데이터도 별도로 제공되어 분석 및 시각화에 활용할 수 있습니다. 서식환경의 위치 정보를 담은 공간정보(SHP) 파일을 함께 제공하여 정밀한 분석과 지도 시각화에 활용 가능합니다.
