summary_user: 공공기관이 구매한 제품을 대분류(사무·교육·영상·가전 등)와 소분류 품목별로 묶어 전체 구매액, 녹색제품 구매액, 녹색구매 비율을 담은 전국 단위 집계 파일이다. 정책 담당자나 분석가가 '어떤 품목에서 공공기관의 녹색제품 구매 비율이 낮은가'를 확인하고 녹색구매 확대 대상 품목을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품목명(소분류명)을 이름으로 맞추거나 같은 기관의 환경표지 인증 제품 자료와 품목명 매핑으로만 이어 쓴다.
description_portal: '이 데이터는 한국환경산업기술원에서 제공한 공공기관의 녹색제품 품목별 구매 정보를 담고 있습니다. 데이터는 총 124개의 항목으로 구성되어 있으며, 각 항목에 대한 정보는 다음과 같은 6개의 컬럼으로 구성되어 있습니다.순번: 데이터의 항목 순서를 나타내는 번호입니다.대분류명: 제품의 큰 범주를 나타냅니다 (예: 사무/교육/영상/가전 등).소분류명: 대분류 내의 세부 품목명을 나타냅니다 (예: OA칸막이, 보관용 가구 등).구매액: 각 품목에 대해 공공기관이 구매한 총 금액입니다.녹색구매액: 각 품목에 대해 공공기관이 녹색 제품으로 구매한 금액입니다.구매비율: 녹색 제품 구매액이 전체 구매액에서 차지하는 비율(%)입니다.이 데이터는 공공기관의 품목별 녹색제품 구매 성과를 평가하고, 친환경적인 소비 활성화 및 정책 결정에 활용될 수 있습니다. 데이터 내 일부 항목은 구매액과 녹색구매액 정보가 결측치로 나타나 있습니다.'
