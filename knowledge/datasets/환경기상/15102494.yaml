description_portal: '부평구 내 개방화장실의 명칭, 위치(도로명 및 지번 주소), 남녀별·유형별 대·소변기 수, 장애인·어린이용 시설 현황, 관리기관 정보, 연락처, 개방시간 등 상세 이용 정보를 포함한 자료주민과 방문객의 공중위생 편의 증진을 위한 기반 자료로 활용되며, 화장실 시설 접근성 및 취약계층 이용 가능 여부 분석에도 유용본 데이터는 다음과 같은 목적으로 활용 가능– 지역 내 공공편의시설 분포 파악 및 공간정보 연계– 장애인·어린이 등 교통약자 대상 화장실 접근성 개선 자료– 공중위생 환경 및 도시 서비스 품질 향상 정책 수립– 위생 취약시간대나 사각지대 해소를 위한 개방시간 분석주요 항목 설명● 화장실명: 개방 대상 시설의 명칭● 소재지도로명주소 / 지번주소: 화장실이 위치한 주소 정보● 남녀공용화장실여부: 남녀공용 여부(Y/N)● 남성용/여성용 대·소변기수: 성별 구분 및 일반·장애인·어린이용 기기 수량● 관리기관명 / 전화번호: 해당 화장실의 관리 주체 및 연락처● 개방시간: 시민 이용이 가능한 시간대'
