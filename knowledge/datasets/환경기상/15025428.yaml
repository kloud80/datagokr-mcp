summary_user: 경기도 내 자동기상관측장비(AWS) 지점별로 시간 단위(0~23시) 관측값을 담은 건별 원천 자료로, 지점번호·지점명·시군·법정동·위경도·고도와 함께 풍향·풍속·기온·습도·현지기압·해면기압·강수 감지 여부·시간/일 누적 강수량을 담는다. 농업·보험·기후 분석가가 "특정 날짜·시간에 우리 시군 관측지점의 강수량과 기온이 얼마였나" 같은 질문을 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 시군명·법정동명 같은 이름 매칭이나 관측지점번호(spot_no_info), 위경도 좌표로 이어 쓴다.
description_portal: '경기도 내의 자동기상관측장비(Automatic Weather Station, AWS)에서 생산되는 기상관측 자료입니다.* 주의사항 : 유인관측소와 달리 무인자동관측장비의 관측자료는 기계적인 오작동이나 통신 장애 등으로 잘못된 관측자료가 나올 수 있으므로, 여기서 제공되는 자료는 참조용으로만 사용 가능하며, 기상증명과 같은 증빙자료로 사용할 수 없습니다.측정값이 -99로시작되는 데이터는 오류값입니다.시간: 24시간 단위로 표기 (0-23)풍향 : 360도 방위각을 사용(북풍은 360도 방향 동풍 90도 방향 남풍은 180도 방향, 서풍 270도 방향)데이터 : 현재시점 기준으로 2개월전 까지의 데이터는 SHEET서비스에서 제공됩니다.(2003년~한달전까지 데이터는 FILE 탭에서 다운로드)데이터한계 : 원천시스템의 데이터 생성 오류로 인하여 7/23 (19시,22시,23시) , 7/24 (02시,04-07시) 데이터는 개방되지 않습니다.출처 : https://data.kma.go.kr/data/grnd/selectAwsRltmList.do?pgmNo=56'
