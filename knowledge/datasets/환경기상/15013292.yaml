summary_user: 경상남도 창녕군 안의 토양오염 관리 대상 업소를 업소별로 담은 원천 목록으로, 업소명·주소·전화번호·소방법 완공검사일과 2026년 토양오염도검사·누출검사 조사대상 여부를 담는다(CSV 약 7.5KB, 시군구 범위의 개별 주소 단위). 주민이나 부지 매입·개발을 검토하는 사업자가 특정 위치 주변에 토양오염도검사나 누출검사 대상 시설(주유소 등 저장시설)이 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열을 맞추거나 주소를 좌표로 바꿔 필지·공간 규제 레이어와 겹쳐 보는 방식으로만 잇는다.
