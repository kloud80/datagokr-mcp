summary_user: 광진구에 등록된 환경측정대행업체(대기·수질·소음·진동·악취·실내공기질 등 측정 업체)의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 사업장명·소재지·인허가일자·영업상태·폐업일자·실험실 정보·중부원점TM 좌표가 들어 있다. 사업자가 광진구 안에서 영업 중인 측정대행업체를 찾거나, 분석가가 환경측정대행업체의 개업·폐업 추이를 살펴볼 때 쓴다. 실측 컬럼에 다른 데이터와 바로 붙일 전역 조인 키가 없어서, 다른 구나 다른 업종의 인허가 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
description_portal: 서울특별시 광진구_환경측정대행업 인허가 정보는 광진구 내 대기, 수질, 소음, 진동, 악취, 실내공기질, 조명 등 환경오염과 관련된 항목을 전문적으로 측정하여 분석하는 환경측정대행업체에 대한 인허가 현황 데이터를 제공합니다. 본 정보는 환경 관련 법령에 따라 측정대행이 가능한 사업체의 등록 및 관리 현황을 포함하고 있으며, 사업장명, 소재지, 인허가일자, 영업상태 등의 항목이 포함됩니다. 해당 업소들은 대기오염물질 측정, 실내공간 공기질 측정, 소음·진동 및 악취 검출, 조명에 의한 빛공해 등 다양한 항목의 환경영향을 평가하는 업무를 수행합니다. 좌표는 중부원점TM(EPSG:2097) 기준의 위치정보를 제공하며, 위경도 좌표는 별도로 포함되어 있지 않습니다. 본 데이터는 기준일로부터 3일 전 시점의 정보를 반영하고 있습니다.
