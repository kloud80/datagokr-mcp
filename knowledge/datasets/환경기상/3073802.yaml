summary_user: 성남시 관내에서 생활폐기물과 사업장폐기물을 수집·운반하는 업체를 한 행에 한 곳씩 담은 업체 목록으로, 업종·업체명·전화번호·도로명주소·대행구역·허가일자를 포함한다(CSV 약 4.7KB 규모). 시민이나 배출 사업자가 '우리 동네를 맡은 수집운반 대행업체가 어디이고 연락처가 무엇인가'를 확인하거나, 분석가가 성남시 수집운반업 허가 현황을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명주소 매칭, 또는 같은 기관(성남시) 자료끼리 이어 쓴다.
description_portal: 성남시 폐기물수집운반업체현황 자료는 성남시 관내에서 생활폐기물 및 사업장폐기물을 수집·운반하는 업체들의 정보를 담고 있습니다. 이 자료는 업종, 업체명, 전화번호, 주소, 대행구역, 허가일자 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 각 업체의 운영범위와 연락처, 행정구역별 대행 여부 등을 확인할 수 있으며, 폐기물 관리 정책, 민원안내 등의 기초자료로 활용할 수 있습니다.
