summary_user: 기상청이 전국 주요 산악 153개 지점에 대해 발표일자·발표시각·산악코드별로 내는 단기예보(+5일)를 담으며, 하늘상태·기온·강수량·적설·강수확률·풍향·풍속·습도와 일출·일몰 시각을 지점·예보시각 단위로 제공한다. 등산객이나 탐방·구조 담당자가 '이번 주말 설악산 정상부의 기온과 바람, 비 올 확률이 어떤가'를 미리 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 산 이름·지역명 매핑이나 기상청 자체 코드(지역 ID 등)로만 잇는다.
description_portal: '대한민국의 주요산의 산악날씨 및 정보를 조회하기 위해 발표일자, 발표시각, 산악코드 조건으로 날씨, 기온, 체감온도, 강수량, 강수확률, 풍향, 풍속, 습도, 일출시간, 일몰시간 정보를 제공합니다.  우리나라 주요 산악 지역의 기상 정보를 제공하는 특화 서비스입니다. 산은 평지보다 기후 변화가 급격하고 지역 차이가 커서, 등산·탐방·구조 활동 등의 안전을 위해 이용됩니다.- 지점: 153개 지점- 예보: 단기예보(+5일)- 제공요소(코드): 하늘상태(SKY), 기온(TMP), 강수량(PCP), 눈의양(SNO), 강수확률(POP), 풍향(VEC), 풍속(WSD), 습도(REH)'
