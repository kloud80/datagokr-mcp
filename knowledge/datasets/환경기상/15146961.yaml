summary_user: 서울 강서구 관내 대기오염물질 배출시설 설치 사업장을 한 곳씩 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(휴업·폐업 일자 포함)·사업장명·주소·좌표·업종·주생산품·배출/방지시설 가동시간과 연간 가동일수를 수록한다. 주민이나 분석가가 '우리 동네 주변에 영업 중인 대기 배출시설 사업장이 어디에 몇 곳 있고 시설을 얼마나 가동하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 좌표(XCRD·YCRD)로 대기질 측정 자료와 위치를 맞춰 볼 수 있다.
description_portal: 서울시 강서구 관내 대기오염물질을 배출하는 사업장의 배출시설 설치 및 운영에 관한 인허가 현황을 담고 있습니다. 대기오염 방지법에 따라 특정 유해물질을 배출할 가능성이 있는 공장, 작업장 등에 대해 관리번호, 인허가일자, 영업상태 등의 정보를 수록하고 있으며, 환경규제 이행 여부 판단과 지역 내 대기환경 모니터링을 위한 기초자료로 활용됩니다. 행정기관에서는 환경영향평가 및 지도점검에 사용할 수 있고, 기업·시민단체·연구기관은 해당 데이터를 기반으로 환경 정책 개선, 산업단지 조성 계획, 대기질 분석 연구 등에도 활용이 가능합니다. 특히, 기후변화 대응 및 온실가스 감축 전략 수립의 지역적 실행 근거 자료로서도 중요합니다.
