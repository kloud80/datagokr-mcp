summary_user: 부산광역시 금정구 관내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담아 소재동, 시설명, 규모(톤), 소유주체, 용도와 분기별 수질검사 적합여부를 제공하는 작은 파일(약 2.8KB)이다. 금정구 주민이나 민방위 담당자가 '우리 동네 비상급수시설이 어디 있고 최근 분기 수질검사에서 적합 판정을 받았는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 동 이름이나 시설명 같은 이름 매칭으로만 이을 수 있다.
