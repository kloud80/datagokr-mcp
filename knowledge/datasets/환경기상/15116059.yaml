summary_user: 서울 중구에서 대기오염물질 배출시설을 설치한 사업장의 인허가 정보를 사업장 한 곳당 한 행으로 담은 시군구 범위의 원장으로, 관리번호·인허가일·영업상태(허가·폐업 등)·휴폐업 일자·주소·중부원점TM 좌표·업종 종별·주생산품·배출시설과 방지시설의 가동시간 등을 포함한다. 중구에 배출시설 사업장을 내려는 예비 사업자나 지역 분석가가 "중구에서 현재 허가 상태로 운영 중인 대기 배출 사업장은 어디에 몇 곳이며 어떤 종별인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 다른 자치구의 같은 형식 인허가 데이터와 행을 이어 붙여 쓰는 방식이 현실적이다.
description_portal: '서울특별시 중구의 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소 정보입니다. 데이터는 각 배출시설설치사업장에 부여된 관리번호, 현재의 운영 상태(허가, 폐업 등), 상세 소재지 등 주요 오염물질 배출부과금 부과 이력 등의 주요 항목들로 구성되어 있습니다. 이 자료는 배출시설설치사업장 설치를 희망하는 예비 사업자에게는 중구 지역의 대기환경보전법 환경기준 준수 요구 사항 및 방지시설 기술 관련 정보를 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
accrual_periodicity: 수시
