summary_user: 대구광역시 북구에 있는 대기배출시설 설치·운영 사업장을 사업장 한 곳당 한 행으로 담은 파일(csv 약 69KB)로, 사업장명·도로명/지번 주소·전화번호·대표업종·대기오염물질 발생량에 따른 종별(대기종별)·위도·경도를 포함한다. 주민이나 분석가가 "우리 동네 근처에 어떤 대기오염물질 배출 사업장이 있고 규모(종별)는 어떤가"를 확인하거나 북구 내 배출 사업장 분포를 지도로 그릴 때 쓴다. 전역 조인 키(사업자번호 등)는 없어서 다른 데이터와는 사업장명·주소로 매칭하거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: '대구광역시 북구 지역에 위치한 사업장 중, 대기오염물질을 배출하는 대기배출시설을 설치하여 운영 중인 사업장에 대한 상세 정보를 제공합니다. 제공되는 정보 항목에는 각 사업장의 사업장명(회사명), 도로명 주소를 포함한 정확한 소재지, 연락 가능한 전화번호,  대기오염물질 발생량 합계 따른 종별 현황,  사업장이 주로 영위하는 대표 업종(예: 제조업, 화학공업 등),  해당 데이터가 기준이 되는 날짜(데이터 기준일자)가 포함되어 있습니다. 이 정보는 대기환경 관리 및 정책 수립, 주민 알권리 보장 등을 위해 활용됩니다'
