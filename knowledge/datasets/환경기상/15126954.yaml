summary_user: "대전광역시 중구 관내 폐형광등·폐건전지 통합 분리수거함의 설치 위치를 수거함 지점별로 담은 원천 목록으로, 행정동·주소·도로명·위치 설명·개수 등을 기록한다. 주민이 '우리 동네에서 다 쓴 건전지나 형광등, 보조배터리를 어디에 버리나'를 찾거나, 분석가가 행정동별 수거함 배치 밀도를 비교하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 행정동 이름이나 주소 문자열을 맞춰 이어 쓴다(예: 같은 구의 다른 생활폐기물 배출 지점 파일)."
limits: 좌표나 법정동·행정동 코드 같은 표준 키가 없어 지도 표시나 다른 데이터 결합 전에 주소 정제·지오코딩이 필요하다. 대전광역시 중구 한 곳만 다루므로 다른 시군구는 해당 지자체 파일을 따로 찾아야 한다.
