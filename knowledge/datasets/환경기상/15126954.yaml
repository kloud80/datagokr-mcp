description_portal: 대전광역시 중구 내에 위치한 폐건전지 분리수거함 배치 현황입니다.○ 대전광역시 중구 관내에 위치한 수거함은 폐형광등과 폐건전지 통합배출이 가능한 분리수거함입니다.○ 매년 6월 폐형광등/폐건전지 수거함을 설치, 교체하며 7월 현행화된 위치 정보를 제공하고 있습니다.○ 다량의 폐형광등 및 사업장 발생 폐형광등 배출의 경우, 기후환경과로 사전 문의 바랍니다.○ LED의 경우 전구형과 직관형만 배출 가능합니다. 그 외 LED의 경우 대형폐기물로 배출 바랍니다.○ 보조배터리(리튬배터리 등) 배출 가능합니다. 폭발위험(팽창 등)이 있는 리튬배터리 배출의 경우 기후환경과에 문의바랍니다.
