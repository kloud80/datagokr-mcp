summary_user: 경상남도 거창군에 사업장폐기물 배출자로 신고한 사업장을 한 건씩 담은 원장 파일로, 사업장명·주소·신고한 폐기물 종류가 들어 있으며 데이터 기준일은 2020년 7월 24일이다. 거창군 안에서 어떤 사업장이 어떤 종류의 폐기물을 배출한다고 신고했는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
