description_portal: '경상남도 거창군_사업장폐기물 배출자신고 현황 및 상세내용에 대한 데이터이며 2020년 거창군 각사업장의 폐기물 상세내용 정보를 제공합니다.○ 데이터 기준일 : 2020. 07. 24.○  폐기물 배출자 신고는 사업장에서 폐기물을 발생시키는 자가 관련 법령에 따라 관할 행정기관에 폐기물의 종류, 발생량, 처리계획 등을 신고하는 제도입니다. 이는 폐기물의 적정한 관리와 환경오염 방지를 위해 필수적인 절차로, 「폐기물관리법」에 근거하여 시행됩니다. 배출자는 일반폐기물과 지정폐기물의 구분에 따라 신고 내용을 달리하며, 처리 위탁 시에도 적법한 처리업체와 계약을 맺고 이를 신고해야 합니다. 미신고 시 과태료 등 행정처분이 부과될 수 있습니다.'
