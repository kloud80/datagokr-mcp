summary_user: 대전광역시 서구에서 대형폐기물을 배출할 때 내는 처리 수수료를 품목(품명)과 규격별로 한 줄씩 정리한 표로, 활용신청 없이 받을 수 있는 작은 CSV 파일이다. 주민이 버리려는 냉장고·가구 같은 대형폐기물의 크기에 따라 수수료가 얼마인지 확인하거나, 분석가가 지자체 간 대형폐기물 수수료 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 지자체의 대형폐기물 수수료 파일과는 품명·규격 이름을 맞춰 연결해야 한다.
description_portal: '대전광역시 서구 대형 폐기물 처리 수수료 정보(대형 폐기물 품명, 대형 폐기물 규격, 대형 폐기물 수수료)를 제공합니다대전광역시 서구의 대형폐기물 수수료 정보는 공공데이터포털을 통해 제공되는 공식 데이터로, JSON/XML 기반의 오픈 API와 CSV 형식의 파일 데이터 모두 이용 가능합니다. 다음은 주요 특성과 활용 방법에 대한 설명입니다.데이터 내용에는 대전 서구에서 배출되는 대형폐기물별 품명, 규격, 수수료 정보를 포함합니다. 예를 들어, 냉장고(800ℓ 이상)는 15,000원, 800ℓ 미만은 12,000원 등 상세한 항목들이 정리되어 있습니다. 제공 형식은 오픈 API (Rest-API): JSON 또는 XML 형태로 제공, 자유롭게 활용 가능하며,  파일 데이터 (CSV)는 공공데이터포털에서 로그인 없이 다운로드 가능하며, 연간 단위로 업데이트됩니다. (예: 최신 파일은 2025년 9월 2일 기준)업데이트 주기는 연간 단위로 갱신되며, 차기 등록 예정일은 2026년 9월 2일로 예정되어 있습니다.관리 및 활용에서 제공 기관은 대전광역시 서구이며, 관리 부서는 ‘홍보담당관(오픈 API 기준)’ 및 ‘자원순환과(파일 데이터 기준)’입니다. 이용 허락 범위는 제한 없으며, 누구나 무료로 사용할 수 있습니다.'
