summary_user: 경기도 시군별 약수터마다 수질검사 일자·검사기관과 총대장균군·대장균·분원성대장균군·암모니아성질소·질산성질소·과망간산칼륨소비량 측정값, 최종 검사결과(적합 여부)를 약수터 단위로 담는다. 등산객·주민이 자주 가는 약수터 물이 최근 검사에서 기준에 맞았는지 확인하거나, 지자체·분석가가 부적합 약수터를 시군별로 가려내는 데 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)이나 약수터 소재지 주소를 이름·주소 매칭해 행정구역 통계나 다른 약수터·지하수 수질 자료와 잇는다.
description_portal: 이 데이터는 경기도 약수터의 수질 상태를 파악하기 위해 실시된 수질검사 결과를 정리한 자료로, 약수터별 위치 정보와 함께 검사일자, 검사기관명, 검사 항목별 측정값 및 최종 검사결과로 구성되어 있습니다. 주요 항목으로는 총대장균군, 대장균, 분원성대장균군, 암모니아성질소, 질산성질소, 과망간산칼륨소비량 등이 있으며, 각각의 항목은 약수터의 수질 적합 여부를 판단하는 데 활용됩니다. ‘검사결과’ 항목은 해당 약수터가 수질기준을 충족하는지 여부를 나타내며, ‘검출’ 또는 ‘불검출’ 등으로 표시됩니다. 본 자료는 지자체 또는 수질관리 기관이 수집한 최신 정보를 바탕으로 하며, 음용수로 적합한지 여부를 평가하고 부적합 약수터를 신속히 파악하여 이용자 안전 확보 및 위생관리에 활용될 수 있습니다.
