summary_user: 광주광역시 자치구별로 공동주택에 설치된 음식물쓰레기 종량제(RFID)의 전체 세대수, 실시 세대수, 실시율, 설치 대수를 담은 집계 파일이며, 378바이트 크기의 작은 CSV입니다. 주민이나 분석가가 "우리 구 공동주택의 RFID 음식물 종량제 실시율은 다른 구보다 높은가"처럼 자치구 간 보급 수준을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 자치구 이름(구분)을 직접 맞춰 연결해야 한다.
description_portal: '광주광역시 공동주택 음식물쓰레기 종량제 (RFID) 설치현황은 자치구별 공동주택에 설치된 음식물쓰레기 종량제(RFID) 세대수, 설치율, 대수 등의 정보로 구성된 데이터입니다.현재 데이터는 2024년 기준으로 설정된 데이터이며 세부현황은 붙임의 파일을 참고하시기 바랍니다.해당 데이터는 연간 현행화 되는 데이터임을 말씀드립니다.데이터에 대한 추가 문의사항이 있으면 광주광역시 각 자치구에 문의하면 감사하겠습니다ㅇ 광주광역시 동구 자원순환과 : 062-608-2526ㅇ 광주광역시 서구 자원순환과 : 062-360-7323ㅇ 광주광역시 남구 환경관리과 : 062-607-3632ㅇ 광주광역시 북구 청소행정과 : 062-410-6512ㅇ 광주광역시 광산구 청소행정과 : 062-960-8485'
