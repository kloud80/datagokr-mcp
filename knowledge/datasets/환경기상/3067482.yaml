description_portal: '탄소중립 녹색성장 기본법에서 규정하고 있는 부산광역시 소유 공공시설(건물,차량)에 대하여 온실가스 기준배출량(2018년 배출량) 대비 30년까지 37.4%이상 감축하는 것을 목표로 하는 제도임- 대상시설 : 시 본청, 직속기관, 사업소 66개 기관(부산시 소유 또는 임차 건물, 차량)- 시설별 월별 에너지 사용량 자료 관리- 신재생에너지 보급 확대, 건물 에너지관리시스템 도입으로 에너지 절감, 외부감축사업 및 탄소중립포인트제 감축 실적 인정 확대로 효율적 관리- 조직및 직원행태 개선(냉난방 온도준수, 직원 조기퇴근 유도, 사무실 조명 소등, 불필요한 대기 전력 차단, 개인용 난방기 사용금지 등)에 따른 관리 등'
legal_basis_portal: 공공부문 온실가스 목표관리제 운영 등에 관한 지침(환경부고시 제2024-23호, 2024.2.1.)이 개정되어 당해 규정 제18조의 온실가스 배출량 관련 자료 입력이 매월 에서 1월31일(전년도 자료), 및 7월 31일(상반기 자료)로 변경되어 배출량 자료 연계 기한 조정 필요하며,이행연도 배출실적을  다음연도 3월말까지 증빙자료 포함 제출함
