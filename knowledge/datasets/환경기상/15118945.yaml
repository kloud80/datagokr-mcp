description_portal: 본 데이터는 국립공원공단이 구축한 공간정보체계 내 LOD(Level of Detail) 기반 공간데이터의 테이블 구조 정보를 포함한 자료로, 공원 내 다양한 공간대상(시설물, 지형, 도로 등)에 대해 다중 해상도 또는 표현 수준별 데이터를 관리·활용하기 위한 데이터베이스 정의 정보입니다. 주요 항목에는 테이블명, 컬럼명, 컬럼 설명, 자료형(VARCHAR, NUMBER, GEOMETRY 등), 기본값, 제약조건(Null 여부 등), 참조 관계(외래키, 상위 테이블 등), 사용 목적(L0~L3 등급별 표현 범위) 등이 포함되며, 각 테이블은 공간객체의 속성 및 형상정보를 계층적 수준에 따라 구분하여 제공합니다. 이 데이터는 국립공원 3D 공간정보 구축, 탐방 시뮬레이션, 시설물 모델링, 재난안전 시나리오 시각화, 경관분석 등 다양한 고정밀 GIS 서비스와 연계되며, 공간정보 표준화 및 데이터 일관성 확보를 위한 메타데이터로 활용됩니다. CSV 또는 DB 내 정의서 형태로 제공됩니다.
