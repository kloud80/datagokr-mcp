summary_user: 전남 보성군 관내 사업장폐기물 배출자의 신고 내역을 사업장(신고)별 한 건씩 담은 원천 목록으로, 상호명·사업장주소·폐기물 구분과 종류·운반자·처리업소·처리방법·신고일자를 포함한다. 보성군에서 어떤 사업장이 어떤 폐기물을 배출해 어느 업체에 운반·처리를 맡기는지 확인하려는 지도·점검 담당자나 폐기물 처리 사업자, 지역 배출 특성을 보려는 분석가가 쓴다. 전역 조인 키는 없으므로 사업장주소나 상호명, 운반자·처리업소 이름을 매칭해 폐기물 처리업 허가 현황 같은 같은 지역 자료와 잇는다.
limits: 사업자번호 같은 공통 식별 키가 실측 컬럼에 없어 다른 데이터와는 이름·주소 매칭으로만 연결되며 오매칭에 주의해야 한다. 범위는 보성군 한 곳이고, 이 데이터는 배출자 원장일 뿐 폐기물 발생량·처리현황 통계를 대신하지 않는다.
