description_portal: 이 데이터는 지자체별로 RFID(무선인식) 기반으로 수집된 음식물쓰레기 배출량을 정리한 자료입니다. 2017년부터 2020년까지 전국 각 기초지자체의 월별 음식물쓰레기 배출량이 톤(㎏ 기준)을 기준으로 기록되어 있습니다.RFID 기반 데이터는 실측 기반이기 때문에 지자체별로 정확한 감량 실적 평가가 가능하며 연도·월별 데이터를 통해 계절별, 연도별 배출량 변화 패턴을 파악할 수 있습니다. 또한, 배출량이 유독 많은 지자체를 선별하여 맞춤형 정책 또는 집중 관리 대책 수립에 활용할 수 있습니다.
