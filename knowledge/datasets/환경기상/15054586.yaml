summary_user: 대구광역시에 등록된 환경컨설팅회사의 상호, 대표자명, 본사소재지, 전화번호를 업체 한 곳당 한 행으로 담은 등록 현황 파일이다(포털 설명상 2025년 6월 13일 기준 9개 업체). 환경 관련 자문이 필요한 사업자나 시민이 대구에서 등록된 환경컨설팅 업체가 어디이고 연락처가 무엇인지 확인할 때 쓴다. 사업자번호나 행정코드 같은 공통 조인 키가 없어 다른 데이터와는 상호명이나 주소 문자열을 맞춰 붙여야 한다.
description_portal: 대구광역시 관내에 등록되어있는 환경컨설팅회사 업소명, 대표자, 소재지, 전화번호 등록현황 자료입니다. 대구광역시는 환경컨설팅 업무를 수행할 수 있는 업체을 지정·등록하여 운영하고 있으며, 관련 정보는 공공데이터포털 및 대구시 D-데이터허브를 통해 수시로 확인할 수 있습니다. 이 등록 현황은 2025년 6월 13일 기준으로 9개 업체가 등록되어 있습니다. 등록 절차는 온라인으로 신청서를 제출하고, 대표자 정보·사업자등록증·기술인력 등의 서류를 종합하여 검토 후 등록이 완료됩니다. 문의사항이 있으시면 대구광역시 환경정책과 (053-803-3684)로  연락주시기 바랍니다.
