description_portal: 자외선지수란 태양이 가장 높이 떴을 때 지표에 도달하는 자외선 복사량을 지수화 한 것입니다.서비스는 연중 제공하고 있으며 (낮음) 3미만, (보통) 3 ~ 5, (높음) 6 ~ 7, (매우높음) 8 ~ 10, (위험) 11이상으로 5단계로 구분하여 제공하고 있습니다.- 자외선은 자외선A(UV-A), 자외선B(UV-B), 자외선C(UV-C)로 구성되어 있습니다. 실제로 우리에게 피해를 주는 자외선은 UV-A와 UV-B입니다.- 적당한 자외선 노출은 균을 죽이고 비타민D 합성을 도와주는 등 이로운 점이 있습니다. 하지만 장시간 노출이 될 경우 우리몸에 해로운 영향을 줍니다.
