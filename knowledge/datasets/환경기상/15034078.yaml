summary_user: 낙동강하구 염분 모니터링 시스템의 23개 측정소에서 측정 시각·수심별로 수온, 전기전도도(ED), 염분, pH, 용존산소(DO) 측정값과 각 항목의 상태값을 담은 실시간 측정 원천 데이터다. 낙동강하굿둑 개방 뒤 구포대교·물금취수장·대저수문 같은 지점까지 바닷물이 얼마나 올라왔는지 확인하려는 농업용수·취수 관리자나 기수생태계 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 측정소 코드(locCode)나 측정소명을 이름으로 맞춰 이어야 하며, 같은 기관 자료와만 코드로 연결된다.
limits: 측정소 코드·이름 외에 다른 데이터셋과 공통으로 쓰는 키가 없어 조인할 때 이름 매핑이 필요하다. 범위는 부산 낙동강하구 측정소에 한정되며 좌표가 없는 비공간 자료다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
