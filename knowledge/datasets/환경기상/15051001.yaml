summary_user: 구리시에서 허가·신고된 대기오염물질 배출업소를 업소별로 담은 파일로, 업소명·소재지·위도·경도와 업종, 배출·방지시설의 종류·용량·수량을 기록한다. 주민이나 분석가가 '우리 동네 근처에 어떤 대기배출 사업장이 있고 어떤 시설을 얼마나 갖췄나'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어 다른 데이터와는 업소명·주소 매칭이나 위도·경도 기반 공간 결합으로 잇는다.
description_portal: 이 데이터는 [대기환경보전법] 제23조에 따라 대기오염물질을 배출하는 시설을 설치하려는 사업자가 환경부 장관이나 시·도지사에게 허가를 받거나 신고한 내역을 기록한 행정 자산입니다.단순히 공장의 명단이 아니라, 대한민국 영토 내에서 대기 질에 영향을 줄 수 있는 모든 산업적 활동(연소, 비산먼지 발생, 화학 반응 등)을 국가가 ‘어떤 시설에서, 어떤 물질이, 얼마나 나오는지’를 데이터화하여 관리하는 것입니다.
