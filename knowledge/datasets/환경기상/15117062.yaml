summary_user: "경기도 민관 협력 생물다양성탐사 결과를 탐사년도·지역구분별로 집계해 전체 관찰종 수와 식물·곤충·포유류·조류·양서파충류·균류/지의류·선태류·거미류·연체동물·갑각류·저서생물 등 생물군별 관찰 종 수(단위: 종)를 담는 집계 데이터이다. 환경 분석가나 지자체 담당자가 '경기도 어느 지역에서 어떤 생물군이 많이 관찰됐고, 어느 생물군이 아직 탐사되지 않았나'를 확인하고 다음 탐사 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역구분(region_div) 이름을 시군명 등에 맞춰 매핑하거나 같은 기관 데이터끼리만 연결한다."
description_portal: '연도별 경기생물다양성 탐사현황으로 도 내 지속가능한 생물다양성 보전을 위한 민관 협력 생물다양성탐사를 통한 지역별 분야별 생물다양성 현황자료입니다.(단위: 종)주요 항목은 탐사년도, 지역구분, 계(전체 관찰종 수), 식물, 곤충, 포유류, 조류, 양서파충류, 균류/지의류, 선태류, 거미류, 연체동물, 갑각류, 저서생물, 기타로 구성되어 있으며, 다양한 생물군에 대한 관찰 종 수를 정량적으로 확인할 수 있습니다. 본 데이터는 지역별 생물다양성 수준 파악, 생태계 건강성 평가, 생물종 보존 전략 수립 등 환경 생태 분야에서 다양하게 활용될 수 있습니다. 또한, 생물군별 조사 누락 또는 미탐사 항목도 포함되어 있어, 향후 탐사 계획 수립 시 참고 자료로 활용 가능합니다.'
