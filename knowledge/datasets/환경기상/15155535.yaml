description_portal: 해당 데이터는 녹색경영기업 금융지원시스템이 보유한 기업 연계 자료 입니다. 해당 자료는 기업 연번, 회사명, 회사일련번호, 등록번호, 대상연도 컬럼으로 구성되어 있으며 총998개 기업 정보를 보유하고 있습니다. 녹색경영기업 금융지원시스템은  정부부처가 보유한 환경정보를 기반으로 기업의 환경경영성과를 평가하여 그 결과를 금융기관에 제공하는 시스템입니다. 환경경영 우수기업에 금융우대를 제공하고 금융권의 녹색금융활동을 촉진하기 위하여 환경과 금융을 융합한 성과평가시스템입니다.  따라서 보유한 DB는 평가를 위해 사용하는 환경정보로 기후에너지환경부 및 그 외 중앙부처와 공공기관에서 수집·관리하는 DB이므로 업무 활용에 참고하여 주시기 바랍니다.
