summary_user: 경상남도 거제시 관내에서 대기배출시설을 설치·운영하는 사업장을 한 행씩 담은 목록으로, 사업장명·도로명/지번 주소·위도·경도·대표업종·시설 종 구분·기준일자를 담는다(CSV 약 11.7KB, 시군구 범위의 개별 사업장 단위). 주민이 우리 동네 주변에 어떤 업종의 대기배출 사업장이 몇 종으로 분포하는지 확인하거나, 분석가가 거제시 배출시설의 업종·규모(종)별 분포를 지도로 살펴보는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 배출원·대기질 데이터와는 사업장명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 사업자등록번호나 시설 고유코드 같은 전역 키가 없어 인허가·굴뚝 TMS·기업 정보와 정확히 연결하기 어렵고 이름·주소 매칭에 의존해야 한다. 거제시 한 곳만 다루므로 다른 시군구와 비교하려면 별도 자료가 필요하며, 실제 배출량이 아닌 설치 현황만 담는다.
