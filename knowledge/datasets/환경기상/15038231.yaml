summary_user: 광진구 관내 가로쓰레기통을 한 개씩 행으로 담은 건별 원천 파일로, 도로명·지번 주소, 행정동, 세부 위치, 위도·경도와 함께 설치 장소 유형, 쓰레기통 형태, 수거 쓰레기 종류, 설치연도를 기록한다. 주민이 '우리 동네 어디에 쓰레기통이 있고 재활용 분리형인가'를 찾거나, 구청·분석가가 오래된 쓰레기통의 교체 대상과 동별 설치 공백을 따지는 데 쓴다. 전역 조인 키는 없으므로 행정동 이름이나 주소, 위도·경도를 기준으로 다른 자치구의 같은 종류 파일이나 종량제 판매소·재활용 정거장 위치 데이터와 공간·이름 매칭으로 이어 쓴다.
description_portal: 서울특별시 광진구_가로쓰레기통 설치현황 데이터는 광진구 관내 가로 환경 개선과 생활 폐기물 관리 효율화를 위해 설치된 가로쓰레기통의 현황을 제공합니다. 주요 항목에는 설치위치, 세부위치, 설치장소 유형, 쓰레기통 형태, 수거 쓰레기 종류, 설치연도 등이 포함됩니다. 설치위치는 쓰레기통이 설치된 기본 지점을 나타내며, 세부위치는 보다 정확한 위치 파악을 위한 상세 정보를 제공합니다. 설치장소 유형은 공원, 보도, 도로변 등 설치 환경을 구분하여 관리 효율성을 높이고, 쓰레기통 형태는 일반형, 재활용 분리형 등 디자인과 구조 정보를 제공합니다. 수거 쓰레기 종류는 일반 쓰레기, 재활용품, 음식물 등 분류 기준을 제시하며, 설치연도 항목은 해당 시설의 설치 시기를 기록하여 유지보수 계획 수립과 노후 시설 교체에 활용됩니다. 본 데이터는 도시 청결 관리, 환경 정책 수립, 공공시설 유지보수, 주민 편의 향상 등 다양한 행정 및 정책 분야에서 중요한 역할을 수행하는 공공데이터입니다.
