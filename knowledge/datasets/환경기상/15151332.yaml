description_portal: 이 데이터는 전자레인지 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 데이터는 총 200장의 이미지 파일과 200개의 라벨링 텍스트 파일로 구성되어 있으며, 각각 ‘images’ 폴더와 ‘labels’ 폴더에 저장되어 있습니다. 이미지에는 다양한 크기, 모델, 색상의 전자레인지가 포함되어 있으며, 대부분 실내 환경에서 촬영되었습니다. 전자레인지의 문, 디스플레이, 제어 패널 등 주요 구성 요소가 식별 가능하도록 다양한 각도에서 촬영되었습니다. 라벨링 파일은 YOLO 형식으로 작성되었으며, 각 전자레인지 객체의 위치 정보와 클래스명이 좌표값 형태로 기록되어 있습니다. 데이터는 객체 감지 및 분류 모델 학습에 활용될 수 있도록 일관된 구조로 구성되어 있습니다.
