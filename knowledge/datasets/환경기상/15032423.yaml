description_portal: 먹는물검사규칙 제4조 제2항에 따른 성남시 내 먹는물관리시설(약수터) 수질검사에 대한 결과로, 약수터명,주소,일자,판정,47개의 검사항목으로 항목이 구성되어 있습니다. "먹는물공동시설 수질검사"는 주민이 공동으로 이용하는 먹는물공동시설(공동수도, 간이급수시설 등)의 음용수 안전성 확보를 위한 필수 절차입니다. 이 수질검사는 「먹는물관리법」 및 관련 시행령·시행규칙에 따라 시행됩니다. 성남시는 시민의 건강을 보호하고 안전한 음용수 제공을 위해 관내 먹는물공동시설(약수터, 공동수도, 소규모 수도시설 등)을 대상으로 정기적인 수질검사를 실시하고 있다.  환경부에서 고시한 「먹는물 수질기준」에 따라 적합 여부를 판정한다.
