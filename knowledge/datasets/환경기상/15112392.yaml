summary_user: 춘천시 생활쓰레기 배출위치를 지점 한 곳당 한 건으로 담으며, 상세주소·위도·경도와 함께 일반쓰레기·음식물·재활용품별 배출 방법, 배출 요일·시각, 미수거일, 관리부서 연락처를 제공한다. 춘천 주민이나 이사 온 사람이 '우리 동네 쓰레기는 어디에, 무슨 요일 몇 시에 내놓아야 하나'를 확인하거나, 분석가가 배출 지점 분포를 지도에 올리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·읍면동명(emd_nm)·좌표를 기준으로 매칭하거나 다른 지자체의 같은 형식 파일과 이름을 맞춰 이어 쓴다.
