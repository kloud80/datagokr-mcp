summary_user: 광주 5개 자치구가 설치한 가로(거리) 쓰레기통을 설치장소별로 자치구명·설치개수와 함께 담은 목록 파일로, 시군구 단위 범위의 소규모 CSV(약 12KB)이며 활용신청 없이 내려받는다. 시민이 '우리 동네 어느 거리에 쓰레기통이 있나'를 찾거나, 분석가가 자치구별 가로쓰레기통 배치 개수를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명이나 설치장소 이름을 맞춰서만 이을 수 있다.
description_portal: 5개 자치구에서 설치한 가로 쓰레기통 현황을 공공데이터 목록에 등록합니다. 설치장소, 설치위치 등을 나타내었으며, 생활폐기물 소관기관인  자치구의 자료를 취합하여 등록하였음. 폐기물관리법 제14에 따라 자치구 고유사무인 생활폐기물 처리에 관한 사항으로 거리쓰레기를 청소하는데 있어서 쓰레기통이 필요한 지역을 선정하여 배치하였으며, 시민들이 쓰레기통을 이용할 수 있도록 하였음. 거리쓰레기통 설치는 현재 감소추세로 쓰레기통 신규설치보다는 거리환경미화원을 통해 불법투기나 청소취약지가 있는 경우 청소를 우선하고 있음
