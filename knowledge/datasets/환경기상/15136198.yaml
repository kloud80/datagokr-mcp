description_portal: 본 데이터는 국립공원공단이 관리하는 국립공원 내 시설 및 공간정보와 관련된 주소 정보를 표준화하여 제공하기 위한 코드성 자료로, 공공 행정구역 체계와의 정합성을 확보하고 위치기반 시스템 간 연계 활용을 지원합니다. 주요 항목에는 주소 코드, 시도명, 시군구명, 읍면동명, 리/통명, 도로명주소 여부, 법정동 코드, 행정동 코드, 도로명 코드 등이 포함되며, 행정구역 기반의 시설 분류, 통계 집계, 공간정보 정렬 등에 유용하게 활용됩니다. 이 데이터는 시설 위치의 행정적 분류 체계 유지, 공공데이터 간 매핑 정확도 향상, 지도 서비스 API 연동, 통계 시스템 및 행정정보시스템과의 연계 구축 등에 기초자료로 제공됩니다. CSV 포맷으로 제공되며, 국립공원 내 자산 및 시설 데이터를 주소 단위로 체계화하는 데 필수적인 기반자료입니다.
