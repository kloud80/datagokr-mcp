summary_user: 인천 부평구 안에서 개발이 끝난 지하수 시설을 한 건씩 담은 원장으로, 소재지 주소·굴착깊이(미터)·하루 취수계획량·준공일자를 시설 단위로 기록한다(csv 526바이트의 소규모 파일). 구민이나 담당 공무원이 "우리 동네에 언제 준공된 지하수 관정이 있고, 얼마나 깊이 파서 하루 몇 톤을 뽑을 계획인가"를 확인하거나 관내 지하수 이용시설 점검의 기초자료로 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 같은 부평구 기관 자료끼리 이름으로 맞춰 이어 쓴다.
description_portal: '부평구 내 지하수 개발이 완료된 시설의 위치, 굴착 깊이, 취수 계획량, 준공일자를 정리한 자료지하수 이용 현황 파악, 수자원 관리, 개발시설 모니터링 등에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 관내 지하수 개발 완료 시설 현황 파악– 굴착 깊이 및 취수량 기반의 수자원 관리– 지하수 이용시설 행정 점검 및 등록자료 활용– 환경영향 검토 및 수질보전 정책 수립 기초자료주요 항목 설명● 소재지: 지하수 시설이 설치된 주소● 굴착깊이: 지하수를 개발하기 위해 굴착한 깊이(미터 단위)● 취수계획량: 시설에서 계획된 하루 취수량(톤/일 등)● 준공일자: 지하수 개발공사가 완료된 날짜'
