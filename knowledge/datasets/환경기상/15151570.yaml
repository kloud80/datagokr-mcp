description_portal: 이 데이터는 싱크대 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지와 동일 수량의 라벨링 텍스트 파일로 구성되어 있으며, ‘images’ 폴더와 ‘labels’ 폴더에 각각 저장되어 있습니다. 이미지에는 다양한 크기, 형태, 소재의 싱크대가 포함되어 있으며, 주로 주방 환경에서 여러 각도와 거리에서 촬영되었습니다. 이미지에는 싱크볼, 수도꼭지, 상판, 주변 수납공간 등 구성 요소가 시각적으로 구분되게 나타납니다. 라벨링 파일은 YOLO 형식으로 작성되어 각 이미지 내 싱크대 객체의 위치 정보와 클래스명이 좌표값 형태로 기록되어 있습니다. 데이터는 객체 탐지 및 분류 모델 개발에 활용할 수 있도록 일관된 파일 구조와 명명 규칙을 따르고 있습니다.
