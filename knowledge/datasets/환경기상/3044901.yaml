description_portal: 남양주시 다중이용시설 측정대상에 대한 데이터로 구분(도서관,박물관, 의료시설 등)에 따른 업소명 규모(연면적), 소재지주소 등의 항목을 제공합니다.「실내공기질 관리법」 제3조 및 동법 시행령에서 정한 일정 규모 이상의 지하역사, 대규모 점포, 의료기관, 노인 및 어린이집 등 시설이 측정 대상이 됩니다. 해당 데이터는 「실내공기질 관리법」에 따라 불특정 다수가 이용하는 시설 중 실내 공기 질 관리 의무가 부여된 시설들의 현황을 담고 있는 공공데이터입니다. 이 자료는 시설의 위치, 종류, 관리 주체, 그리고 실내 공기질 측정 의무 관련 정보를 제공하여, 시설 이용자들의 건강 보호와 쾌적한 실내 환경 조성에 기여합니다
