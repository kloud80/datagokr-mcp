summary_user: 경기도 구리시에 있는 실내공기질 관리법 적용대상 다중이용시설(어린이집·학원·도서관·의료기관·노인복지시설·실내주차장·산후조리원 등)을 시설별 한 행으로 담은 목록 파일이며, 시설 구분·시설명·소재지와 위도·경도를 포함한다. 주민이나 분석가가 '우리 동네 어린이집·산후조리원 중 실내공기질 관리 대상은 어디인가'를 확인하거나, 관리 대상 시설의 분포를 지도에 표시할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시설명·주소를 맞추거나 위도·경도로 공간 결합해 이어 쓴다. 예를 들어 인근 대기질 측정소 자료와 위치로 연결한다.
description_portal: 어린이집, 영화관,학원, 도서관 , 의료기관, 노인복지시설,  집합건물, 실내주차장, 산후조리원, 지하역사, 영화관 등 경기도 구리시 지역 내에 위치한 실내공기질 관리법 적용대상 다중이용시설 현황(시설구분, 시설명, 소재지도로명주소, 전화번호 등)을 제공합니다.
