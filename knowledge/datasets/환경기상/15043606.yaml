summary_user: 극초단파 라디오미터로 관측한 지점·관측시각·고도별 기온, 습도, 구름 액체물량의 연직분포를 담은 건별 관측 파일(CSV, 약 6MB)입니다. 예보관·대기 연구자가 '특정 시각에 지상부터 상공까지 기온과 습도가 어떻게 바뀌었나'처럼 대기 연직 구조와 수증기 변화를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키는 없어, 지점번호를 기상청 관측지점 정보와 이름·코드로 맞추거나 같은 시각의 기상청 관측자료와 관측시각 기준으로 이어 씁니다.
description_portal: 라디오미터 관측은 대기 중의 기온과 습도를 연직으로 지상에서부터 10km 상공까지 측정할 수 있는 극초단파(micro-wave) 라디오미터로써 대기중의 밝기온도, 기온, 습도, 수증기량, 가강수량 등을 산출하는데 활용됩니다.대기 중의 수증기와 산소, 구름에 의해 방출되는 에너지를 14개의 마이크로웨이브 채널을 통해 흡수한 후, 플랑크법칙을 이용하여 24시간 연속적으로밝기온도(brightness temperature)로 변환합니다.변환된 밝기온도를 가지고 각고도별 산출 알고리즘에 의해 최종적으로 기온, 습도의 연직분포, 수증기량,구름의 액체물량 등의 자료를 생산한다. 이때 라디오존데의 통계 자료가 적용됩니다.
