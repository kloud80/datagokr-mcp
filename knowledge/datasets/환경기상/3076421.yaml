description_portal: 'ㅇ 작성목적 : - 국내·외 경제, 원자재 시장 및 재활용가능자원에 대한 시장동향과 전망을 조사 발표하여 재활용산업의 발전 및 업무 참고자료 제공ㅇ 조사대상 : 사업체 - 전국 재활용업체ㅇ 작성주기 : 매월ㅇ 조사기간 : 매월 10일경 조사(10일 가격기준 조사)ㅇ 조사대상 : 재활용가능자원에 대한 국내·외 경제동향, 원자재 시장동향 및 [통계표]가격현황ㅇ 조사권역 : 전국, 8개 권역(수도권, 강원, 충북, 충남, 전북, 전남, 경북, 경남)  - 수도권 : 서울,인천광역시 및 경기도 지역ㅇ 조사품목 : 26개 항목                  폐지 2(신문지, 골판지)                  폐플라스틱 17(PE, PP, PS, PET, ABS, PVC, EPS | 압축, 플레이크, 펠렛, 잉고트)                  폐유리병 3(컬렛 백색, 갈색, 청녹색)                  폐금속 3(철스크랩, 철캔, 알루미늄캔)                  폐타이어 1(고무분말)ㅇ 가격단위 : 원/kg* 조사가격 산정방법 : 각 권역내 품목별 조사업체 가격의 평균. 업체별 가격은 상이할수 있음.ㅇ 참고사항 : 빈칸으로 표시된 부분은 미공표된 자료로 통계에 대한 상세 내역은 자원순환마루에서 확인 바랍니다.- 자원순환마루 : www.recycling-info.or.kr카카오톡 채널 "재활용가능자원 가격조사(한국환경공단)"을 통해알림톡으로 매월 가격조사 결과를 받아보실 수 있습니다.'
