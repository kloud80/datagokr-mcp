summary_user: 경기도 시군이 화학사고 등 유해물질 누출에 대비해 지정한 실내 대피장소를 장소 한 곳당 한 행으로 담으며, 시군명·시설 구분·수용 면적과 인원·관리기관과 담당자 연락처·도로명/지번 주소·위경도 좌표를 포함한다. 주민이 우리 동네 화학사고 대피소가 어디이고 몇 명을 수용하는지 확인하거나, 분석가가 유해화학물질 취급 사업장 주변의 대피 수용 능력이 충분한지 따질 때 쓴다. 전역 조인 키가 없어 시군명이나 주소로 다른 데이터와 맞추고, 위경도 좌표로 화학물질 취급 사업장 위치 등과 공간적으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 각 시군이 화학사고 등 유해물질 누출 사고에 대비해 주민들이 긴급히 대피할 수 있도록 지정한 실내 대피장소의 정보를 포함하고 있습니다. 실내체육관, 학교 강당, 관공서 다목적실 등 일정 규모 이상의 실내공간을 활용한 장소들이 대부분이며, 공간의 면적과 수용 가능 인원, 관리기관 정보, 접근 가능한 주소 및 좌표 등이 함께 제공됩니다. 해당 장소들은 긴급 상황 발생 시 안전하게 실내로 대피할 수 있도록 계획된 곳으로, 화학물질 누출뿐 아니라 복합 재난 대응 체계에도 활용될 수 있습니다. 이 데이터는 재난 대응 계획 수립, 대피 인프라 분석, 주민 교육 및 훈련 자료 개발, 재난지도 작성 등 다양한 안전 정책과 실무에 활용될 수 있습니다.
