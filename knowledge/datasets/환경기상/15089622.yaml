description_portal: 환경부는 생물다양성 보전 및 이용에 관한 법률 제17조제2항에 따라 생물다양성의 체계적인 보전·관리 및 생물자원의 지속가능한 이용을 위하여 국가생물다양성센터 운영하고 있으며, 동법 시행령 제16조제3항에 따라 국립생물자원관에서 국가생물다양성센터의 역할을 수행하고 있습니다. 주요 역할 중 하나인 국가생물다양성 정보공유체계를 구축 및 운영하고자 국립생물자원관 국가생물다양성 정보공유체계(CBD-CHM KOREA) 시스템을 운영하며 타부처·타기관과 생물다양성정보를 연계하고 있습니다. 본 자료는 국립생물자원관이 연계하고 있는 기관 및 기관에서 운영중인 시스템의 목록을 제공하고 있습니다.
