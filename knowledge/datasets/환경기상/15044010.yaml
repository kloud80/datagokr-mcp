description_portal: 해양환경공단이 수행하는 해양쓰레기 조사사업 정보를 제공합니다. 본 데이터는 해양에 유입된 플라스틱, 폐어구, 생활쓰레기 등의 발생 유형, 분포 현황, 수거량 등을 조사한 결과를 포함합니다. 주요 연안, 도서지역, 항만 등에서 수거된 해양쓰레기를 유형별로 분류하고, 조사 지점별 통계자료로 구성되어 있습니다. 데이터는 정기적으로 갱신되며, 연도별 비교를 통해 해양쓰레기 발생 추세와 저감 성과를 파악할 수 있습니다. 또한 정책 수립, 연구 분석, 국제 보고 등에 활용 가능하며, 해양폐기물 관리를 위한 기초자료로 제공됩니다. 자료는 표 및 보고서 형태로 제공되며, 해양환경 개선을 위한 정책 수립과 실무 적용에 유용하게 활용됩니다.
