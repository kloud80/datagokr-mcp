description_portal: 이 데이터는 해양수산부에서 국가해양환경 온라인 교육센터를 통해 배포된 교육교재 보급 현황 기록을 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 2023년 접수된 교재 신청기관별 교재 신청 목록, 신청 부수, 교재 배포 후 잔여재고량 등으로 구성되어 있습니다.   본 데이터는 해양환경 교육 자원의 분포를 분석하거나, 교재 수급 계획과 교재 보급 정책 마련, 각 기관의 교재 활용 현황 파악 등에 활용될 수 있습니다. 또한, 교육프로그램의 운영관리, 다음 연도의 교재 출판 계획 수립 등 업무를 위한 기초 자료로 활용할 수 있습니다.
