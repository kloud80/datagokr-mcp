summary_user: 서울 관악구 안에서 음식물류폐기물을 많이 배출하는 사업장(음식점 등)의 상호·도로명주소·사업장 구분을 사업장 한 곳당 한 행으로 담은 목록 파일이며, 범위는 관악구 한 곳이고 위치는 개별 주소 단위다. 구청 담당자나 분석가가 '관악구 어느 동네에 다량배출 음식점이 몰려 있는가'를 확인하거나 지도·점검 대상 목록을 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소(사업장도로명주소)를 지오코딩하거나 상호 이름을 맞춰 연결해야 하며, 관악구의 다른 생활폐기물 배출·수거 지점 파일과 함께 보는 식으로 쓴다.
description_portal: 본 데이터는 서울특별시 관악구 내 음식점 등 사업장에서 발생하는 음식물류폐기물 관련 정보를 담고 있습니다. 본 데이터의 구성 항목으로는 ▲사업장명 ▲소재지 가 있습니다. 사업장별 위치와 명칭을 통해 음식물류폐기물 배출 사업장의 분포를 파악할 수 있으며, 지역 내 배출업소 관리, 지도·점검 대비 현황 확인, 기본적인 배출업소 목록 정비 등에 활용될 수 있습니다. 특히 소재지 기반 정보는 행정구역별 업소 파악이나 배출업소 리스트 관리에 참고자료로 사용할 수 있어 기초 데이터로서 의미가 있습니다.
