summary_user: 경기도 평화누리길 코스별로 관찰되는 조류를 종 단위로 정리한 설명자료로, 코스·지역과 함께 분류·학명, 도래현황, 관찰빈도, 서식지·번식지 유형, 크기, 생활방식, 먹이를 담고 일부 종은 천연기념물·멸종위기종 등 보호 등급 정보를 포함한다. 자연해설사나 환경교육 담당자가 '평화누리길 특정 코스를 걸을 때 어떤 철새·텃새를 볼 수 있고 그중 보호종은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 코스명·지역명 이름 매칭이나 학명(scncenm)을 기준으로 한 종 이름 매핑으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 평화누리길 각 코스별 조류 생태 정보를 수록한 자료로, 조류의 서식지 환경 및 보호 현황 파악을 위한 목적에서 활용될 수 있습니다. 항목은 코스, 지역, 분류, 학명, 도래현황, 관찰빈도, 서식지유형, 번식지유형, 주요종, 크기, 생활방식, 먹이로 구성되어 있으며, 각 조류의 생물학적 특성과 생태적 정보가 상세히 수록되어 있습니다. 이 자료는 조류 생태 연구, 자연해설 콘텐츠 제작, 환경교육자료 개발 및 생태관광 자원 관리에 활용될 수 있으며, 일부 조류는 천연기념물, 멸종위기종 등으로 보호종 정보를 포함하고 있습니다.*IUCN 등급: 국제자연보전연맹(IUCN)이 지정한 생물종 보전 상태 등급. LC는 관심필요, NT는 준위협, VU는 취약, EN은 위기종을 의미*CITES 등급: 멸종위기종의 국제거래를 규제하는 협약 등급.1급은 거래 금지, 2급은 제한적 거래가 가능한 종*멸종위기·천연기념물 등급: 환경부가 지정한 멸종위기 Ⅰ급·Ⅱ급과 문화재청이 지정한 보호 생물 번호'
