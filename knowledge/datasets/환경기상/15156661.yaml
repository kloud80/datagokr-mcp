summary_user: 폐기물처리 사업자별 행정처분 내역(업체명·업종구분·처분기관·처분일자·처분 시작/종료일·위반내역)을 담은 조회 API이며, 범위는 전국이다. 폐기물 처리업체와 거래하려는 배출사업자나 분석가가 특정 업체에 위반·행정처분 이력이 있는지 확인하는 질문에 쓴다. 사업자등록번호(brno, 조인 키 bizno)로 다른 폐기물 처리업·배출자 원장 데이터와 이어 쓴다.
description_portal: 사업장폐기물 행정처분 정보 조회서비스 각 지역의 폐기물처리 사업자에 대한 내역과 위반내역에 대한 정보를 제공합니다.업체명, 사업자등록번호, 업종구분명, 행정처분기관명, 행정처분일자, 시작일자 및 종료일자, 위반내역에 대한 정보를 조회할 수 있습니다.해당 정보는 폐기물처리 현장정보 관리시스템에 수집된 정보입니다.폐기물 처리와 관련된 모든 법적, 행정적 관리와 규제는 관할관청에 의해 이루어지며, 관할관청은 각 지역에서 처리, 운반, 재활용되는 폐기물을 감독합니다.해당 정보는 행정처분 일자도 있으므로, 참고하실 수 있습니다.
