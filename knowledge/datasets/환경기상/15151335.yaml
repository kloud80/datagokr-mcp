description_portal: 이 데이터는 냉장고 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지 파일과 동일한 수의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에, 라벨링 파일은 ‘labels’ 폴더에 저장되어 있습니다. 데이터에는 다양한 크기, 형태, 디자인의 냉장고가 포함되어 있으며, 실내 주거공간 또는 상업공간에서 촬영되었습니다. 이미지에는 정면, 측면, 상단 등 여러 각도에서 촬영된 냉장고 외형이 포함되어 있고, 문 손잡이, 냉동실·냉장실 도어 등 주요 구성요소가 명확히 식별됩니다. 라벨링 정보는 YOLO 형식으로 작성되었으며, 각 이미지 내 냉장고 객체의 위치 좌표와 클래스명이 텍스트 형식으로 기록되어 있습니다. 이 데이터는 객체 탐지 및 분류 모델 개발에 적합한 구조로 구성되어 있습니다.
