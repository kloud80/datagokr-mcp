description_portal: 일본에서 쏘아올린 정지궤도 기상위성인 히마와리로 관측한 위성자료로 기상관측자료와 산출물 자료를 제공하고 있습니다. 2014년 10월에 일본 가고시마, 타네가시마 우주센터에서 발사된 HIMAWARI-8 위성은 일본의 여덟 번째 정지궤도 기상위성으로 동경 140.68° 상공 35,800km에 위치하여 기상관측임무를 수행하고 있습니다.채널수는 16개(VIS3, NIR3, IR10)이며, 공간해상도는 (VIS) 0.5km, 1km/(IR) 2km이며 관측주기는 전구 10분 관측을 수행하고 있습니다.산출물로는 구름산출물, 대기운동벡터, 황사(Asian dust), 화산재 탐지(Volcanic Ash)가 있습니다.
