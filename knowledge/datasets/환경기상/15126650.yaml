summary_user: 일본 정지궤도 기상위성 히마와리(HIMAWARI-8)가 관측한 16개 채널 위성자료와 구름·대기운동벡터·황사·화산재 탐지 같은 산출물을 담는 외부 API이며, 지점별 표가 아닌 전국 범위의 비공간 위성 원천자료다. 기상 분석가나 연구자가 "특정 시각 한반도 주변 구름 분포와 황사 이동이 어땠는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관측 시각이나 같은 기관(기상청) 자료 기준으로만 맞춰 이어 쓴다.
