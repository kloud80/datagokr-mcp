summary_user: 광주광역시 자치구별로 신고된 비산먼지 발생사업장 수를 업종별(시멘트·석회 제품 제조, 비금속물질, 1차 금속, 건설업, 운송업, 저탄시설, 폐기물매립시설 등)로 집계한 표로, 593바이트 크기의 작은 CSV 파일이다. 주민이나 분석가가 "우리 구에 건설공사 현장 같은 비산먼지 발생사업장이 몇 곳이나 신고돼 있나"를 구별·업종별로 비교할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 구 이름(구분)을 맞춰 연결해야 하고, 개별 사업장 원장(사업자번호·좌표)과는 직접 이어지지 않는다.
description_portal: 「대기환경보전법」 제43조에 따라 광주광역시 각 구별로 신고된 비산먼지 발생사업장 현황입니다. 대상 업종은 시멘트 및 석회 등 제품, 비금속물질, 1차금속, 비료·사료제품, 유리 및 유리제품, 운송장비 등 제조업과 건설업(대규모 공사현장) 그리고 운송업 등이 해당됩니다. 관련 사업장은 각 자치구에서 점검 등을 통해 비산먼지 저감을 위한 조치가 이루어 졌는지 확인하고 있습니다. 특히 광주광역시 대분분의 비산먼지 발생 사업장은 대규모 토목·건설 공사 현장으로  생활과 밀접한 관련이 있어  해당 사업장을 관리하여 쾌적한 대기 환경을 조성하고 민원 발생을 예방하고자 하는데 목적이 있습니다.
