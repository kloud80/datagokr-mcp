description_portal: 경기도 남양주시의 야생생물(동물) 보호구역 지정현황입니다. 야생생물 보호 및 관리에 관한 법률에 따라 멸종위기 야생생물의 서식지, 번식지, 도래지를 특별히 보호하기 위해 야생생물 보호구역이 지정되어 있습니다. 멸종위기종 또는 생태적으로 중요한 야생생물의 서식지를 보호하기 위해  지정된 구역에 대한 데이터를 포함하고 있습니다. 남양주시에는 2007년에 지정된 총 2곳의 야생동물 보호구역이 있습니다. 야생생물 보호구역 지정현황 데이터는 생태보전활동, 생태교육, 멸종위기종 서식지 분석 등에 유용하게 쓰일 수 있습니다.
