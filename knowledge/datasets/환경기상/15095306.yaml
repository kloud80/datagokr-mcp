summary_user: 경상남도 창원시 안의 다중이용시설 가운데 실내공기질 측정·관리 대상인 시설을 사업장 한 곳당 한 행으로 정리한 목록으로, 지역(구청)·시설 구분·사업장명·주소를 담는다(2025.1.2. 기준, CSV 약 58KB). 시민이나 시설 관리자가 '우리 동네 영화관·대형마트·병원이 실내공기질 관리 대상인가'를 확인하거나, 분석가가 창원시 구별·시설 유형별 관리 대상 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 사업장명이나 주소를 문자열로 맞추거나 주소를 지오코딩해 다른 시설·대기질 자료와 이어 써야 한다.
description_portal: 실내공기질 관리법 제3조제1항 및 같은 법 시행령 제2조 제1항에 따른 경상남도 창원시 구청별, 시설별 실내공기질 측정 및 관리 대상에 대해 공공기관의 정보공개에 관한 법률 등에 따라 공개 목록(2025.1.2.기준)백화점, 대형마트, 영화관, 병원, 체육관 등 다수 이용자가 상시 이용하는 실내 공간의 공기질 측정 대상 시설 목록을 정리한 자료입니다. 본 데이터는 시설 유형별, 지역별 실내공기질 측정 여부와 인증 상태 등을 파악할 수 있어 생활환경 안전 점검, 민원 대응, 환경보건 정책 수립, 시설 관리 및 홍보 등에 활용될 수 있습니다.대상 시설이 다수 포함되어 있어 일반 뷰어(엑셀, 메모장 등)만으로는 일부 항목만 표시될 수 있으므로 R, Python, GIS 등의 전용 분석·시각화 도구 사용을 권장합니다.시설 분류 기준, 측정 주기, 측정 항목(미세먼지, CO₂ 등), 기준 초과 여부 등 상세 정의는 제공기관의 메타데이터나 기술문서를 참조해주세요.
