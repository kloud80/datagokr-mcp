description_portal: 울산광역시 내 공공음식물류폐기물 처리시설 현황임.다량배출사업장에서 배출하는 음식물류 폐기물 처리시설을 제외한  공공 음식물 폐기물 처리시설 현황 정보임.음식물류 폐기물을  5개 구군에서 수거하여 반입하고 있음. 해당 시설명, 위치, 처리용량, 처리방식, 가동일,  등의 정보를 제공하고 있음.용연 음식물자원화시설은 일처리용량 180톤이며, 혐기성소화방식으로 처리하고 있으며, 바이오가스를 생산하고 있음온산 바이오에너지센터는 일처리용량 150톤이며 , 혐기성소화방식으로 처리하고 있음.
