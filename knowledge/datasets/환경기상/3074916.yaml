summary_user: 전라남도 곡성군의 지하수 관정별 준공일자, 개발 위치 주소, 지하수 용도와 수질검사 종류·검사일자·검사결과를 관정 단위로 한 줄씩 담은 원장 파일(CSV, 약 79KB)이다. 군민이나 지하수 관리 담당자가 우리 동네 관정이 언제 준공됐고 최근 수질검사에서 적합 판정을 받았는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명이나 개발 위치 주소를 기준으로 맞추거나 같은 기관 자료끼리 이어 써야 한다.
