summary_user: 경기도 내 환경컨설팅회사가 신규 등록이나 변경등록을 위해 낸 신청 건을 한 행씩 담은 원천 목록으로, 신청연도·사업장명·사업자번호·업종·등록구분·신청일·처리상태·승인일·영업소 주소·등록증 분실사유를 기록한다. 사업자나 분석가가 '경기도에서 등록 승인된 환경컨설팅회사는 어디이고 신청부터 승인까지 얼마나 걸리나' 같은 질문을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업자번호(bizregno)·사업장명 같은 이름·코드 매핑으로만 붙인다.
description_portal: 이 데이터는 경기도 내 환경컨설팅회사가 신규 등록 또는 등록사항 변경을 위해 제출한 신청 현황을 기록한 자료입니다. 주요 항목으로는 신청연도, 사업장명, 사업자번호, 업종코드 및 업종명, 등록구분(등록/변경등록), 신청일, 처리상태(접수/신청/승인), 승인일, 영업소 주소 및 등록증 분실사유 등이 포함되어 있습니다. 업종명에는 ‘환경 관련 엔지니어링 서비스업’, ‘경영 컨설팅업’, ‘기타 엔지니어링 서비스업’ 등 다양한 업종이 등록되어 있으며, ‘등록구분’은 신규 또는 변경 여부를 구분합니다. 이 데이터는 경기도 내 환경컨설팅 시장의 규모와 현황, 기업의 활동 주체 및 등록 절차 파악, 환경기술 서비스 제공기관의 역량 분석 등에 활용될 수 있으며, 환경사업 대행 기관과의 협력 구조 및 행정처리 모니터링에도 활용됩니다.
