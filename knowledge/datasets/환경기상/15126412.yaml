description_portal: 서울특별시 마포구의 행정동별 연간 쓰레기 수거량과 관련된 데이터를 제공합니다. 이 데이터에는 2021년부터 2021년까지의 각 행정동(공덕동, 도화동, 구 서교동, 상암동, 서강동, 성산2동, 합정동, 대흥동, 신수동, 구 동교동, 연남동, 망원1동, 망원2동, 성산1동, 염리동, 아현동, 용강동) 단위로 배출된 또는 연도별 수거량과 년도별 총계가 톤 단위의 수치로 포함되어 있습니다. 이 데이터를 통해 지자체와 주민들은 지역별 쓰레기 배출 특성을 파악하고, 효율적인 자원 관리 및 청소 행정 개선에 활용할 수 있습니다.
