description_portal: 기상청에서 관측한 미세먼지 크기별 수농도, 광산란계수, 광학깊이 등 에어로졸 자료를 제공합니다. 기후변화감시자료는 매년 7월 업데이트됩니다.에어로졸은 공기 중에 떠 있는 고체 또는 액체 상태의 입자로 보통 0.001∼100 ㎛ 정도의 크기를 갖고 있으며 황사, 화산재, 해염 같은 자연적 요인과 도시·산업시설 배출, 소각, 자동차 등의 인위적 요인에 의해 발생됩니다.대기 중에 부유하여 지표면으로 들어오는 태양복사에너지를 차단 또는 흡수하거나, 구름 형성과 물리특성을 변화시키면서 기후변화에 영향을 미치고 있습니다.기상청은 세계기상기구(WMO) 지구대기감시(GAW) 프로그램의 일환으로 안면도 기후변화감시소에서 0.5∼20㎛ 까지의 입경별 에어로졸 수농도를 관측하고 있습니다.
