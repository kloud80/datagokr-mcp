description_portal: 본 데이터는 경상북도 예천군에 설치된 풍황계측기의 설치 위치 및 운영 현황을 수록한 공공데이터이다. 풍황계측기는 일정 지점에서 바람의 속도, 방향, 빈도 등을 측정하는 장비로, 풍력발전의 입지 분석과 발전량 예측에 활용된다. 본 자료에는 위경도와 허가일, 허가만료일 등의 정보가 포함되어 있으며, 지역 내 풍황 자원 조사 및 신재생에너지 기반 구축에 필요한 기초자료로 제공된다. 해당 데이터는 친환경 에너지 정책 수립, 기후변화 대응 전략 수립, 풍력발전 타당성 검토, 지역 에너지 자립도 향상 등 다양한 행정 및 기술적 목적에 활용된다. 예천군의 에너지 정책 기준에 따라 관리된다.
