summary_user: 경기도 과천시에서 청소를 대행하는 업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 670바이트)로, 업체명·전화번호·도로명/지번 소재지 주소와 함께 맡은 청소구역, 수거하는 폐기물 종류(생활·음식물류·대형·사업장폐기물), 수거 방식(문전수거 등)을 담는다. 과천 주민이나 사업장이 '우리 동네 쓰레기는 어느 업체가 어떤 방식으로 가져가고, 대형폐기물이나 음식물 쓰레기도 수거하는지, 연락처는 무엇인지'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업체명이나 소재지 주소를 문자열로 맞추거나, 청소구역 이름을 과천시 행정동과 대조하는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 경기도 과천시 내 청소대행업소 현황에 관한 자료로, 제공 항목은 청소대행업체명, 업체 전화번호, 소재지 도로명주소 및 지번주소, 청소구역, 대상 폐기물, 수거 방식 등으로 구성되어 있습니다. 대상 폐기물은 생활폐기물, 음식물류 폐기물, 대형 폐기물, 사업장폐기물로 구분되며, 수거 방식은 문전수거 등으로 제공됩니다. 해당 데이터를 통해 거주지나 관심 지역의 청소 대행 현황을 확인할 수 있으며, 폐기물 배출 전 해당 업체가 어떤 폐기물을 수거하고 어떤 방식으로 수거하는지 사전에 파악하는 데 유용하게 활용할 수 있습니다.
