description_portal: '- 전라남도 음식물 폐기물 처리시설 현황(전남 9개 시군, 12개소-목포 1, 여수 1, 순천 2, 광양 1, 담양 1, 보성 1, 해남 1,  완도 1, 신안 3)에 대한 자료를 제공합니다.- 음식물 폐기물은 조리 과정이나 섭취 후 남은 음식 찌꺼기로, 사료화·퇴비화 등이 가능한 유기성 폐기물을 말합니다. 음식물 폐기물 처리는 환경 보호와 자원 절약 측면에서 매우 중요한 문제입니다.- 사료화 : 건조 및 살균 후 가축 사료로 재활용, 자원 순환 가능, 위생·안전 기준 엄격- 퇴비화 : 미생물 발효로 퇴비 제조,  친환경, 농업 활용,  처리 시설 필요- 에너지화 : 음식물 쓰레기에서 바이오가스 생산,  에너지 자원 활용, 처리비용 큼- 소각/매립 : 재활용이 어려운 음식물 소각 또는 매립, 간단, 신속,  환경오염 우려'
