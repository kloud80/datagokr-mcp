summary_user: 전라남도 내 음식물 폐기물 처리시설을 시설 한 곳당 한 행으로 담은 파일로, 시군·시설명·소재지·설치연월·처리 방식·인허가·시설용량을 기록하며 포털 설명상 9개 시군 12개소가 대상이다. 지자체 담당자나 분석가가 "우리 시군 근처에 음식물 폐기물을 처리하는 시설이 어디 있고 용량은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 이름이나 소재지 주소를 맞춰 연결해야 한다.
limits: 실측 컬럼에 표준 행정코드 같은 공통 키가 없어 다른 데이터와 붙이려면 시군명·주소를 직접 매핑해야 한다. 시설 목록일 뿐 음식물 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다.
