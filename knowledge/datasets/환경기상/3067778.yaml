summary_user: "제주특별자치도개발공사가 제주 1~3취수원에 설치한 지하수 감시정 9곳의 지하수위를 감시정별 열(예: 1수원 감시정1)로 나란히 담은 관측 파일이다(포털 설명상 1시간 간격 측정, 약 6,700건). 연구기관이나 먹는샘물 업체가 '취수원 주변 지하수위가 시기별로 얼마나 오르내렸나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 지점 코드가 없어 다른 지하수·수질 데이터와는 감시정 이름이나 같은 기관 자료를 기준으로 수작업으로 맞춰 이어 써야 한다."
description_portal: '- 기후 변화로 인해 제주 지하수의 고갈에 대한 사회적 우려가 커져감에 따라, 제주특별자치도개발공사는 제주도 내 1~3취수원에 9개의 지하수 관측정을 설치하여 운영하고 있으며, 지하수의 지하수위, 수온, 수소 이온 농도, 전기전도도 등 정보를 제공하고 있습니다.- 지하수 관측정을 통해 1시간 간격으로 제주도 내 지하수의 전기전도도를 측정하고 있으며, 총 9종 약 6,700 건의 정보를 제공하고 있습니다.- 학계 및 연구기관은 제주도 내 지하수의 수질 변화에 대한 연구를 통해 제주도 지하수 보호를 위해 활용하고 있으며, 먹는샘물업체는 제품의 품질관리에 활용 가능합니다.'
