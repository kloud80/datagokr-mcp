summary_user: 대구광역시 달서구 안의 음식물폐기물 다량배출사업장을 업소 한 곳당 한 행으로 담은 파일로, 상호·신고일자·주소·업소구분·배출량·관리기관명·데이터기준일자를 담는다(CSV 약 47KB). 주민이나 수거·처리 사업자가 "우리 동네에 음식물폐기물을 많이 내는 업소가 어디이고 얼마나 배출하는가"를 확인하거나, 구청 담당자가 음식물폐기물 관리 대상 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 주소·상호 문자열 매칭이나 같은 관리기관 기준으로만 이어 쓴다.
limits: 달서구 한 개 시군구만 다루므로 대구 전체나 다른 지자체 현황은 지자체별 파일을 따로 모아야 한다. 사업장 목록이므로 지역 전체의 음식물폐기물 발생량·처리현황 통계로 쓰기에는 맞지 않는다. 사업자등록번호·행정코드 같은 공통 키가 없어 다른 데이터와 연결할 때 주소 정제가 필요하다.
