summary_user: 대구광역시 서구 관할 전통시장 안 공용화장실을 한 곳씩 담은 건별 시설 목록으로, 화장실 이름·도로명 주소·우편번호·행정동·지번·건물 용도·준공 연도·관리 부서를 제공한다. 시민이나 관광객은 "서구의 어느 전통시장에 공용화장실이 있나"를 확인할 때 쓰고, 행정 담당자는 준공 연도를 보고 노후 시설 개보수 대상을 고를 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 공중화장실 데이터나 시장 목록과는 주소·읍면동 이름이나 화장실·시장 이름을 맞춰서 연결한다.
limits: 범위가 대구 서구 한 시군구로 한정되어 다른 지역과 비교하려면 별도 데이터가 필요하다. 표준 코드나 공통 키가 없어 연계는 이름·주소 문자열 매칭에 의존한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회까지 호출할 수 있다.
