summary_user: 서울 양천구 관내 생활쓰레기 수거 대행업체별로 업체명, 맡은 대행구역, 집하장 위치, 주차구역을 담은 시군구 단위 소규모 목록 파일(CSV 약 609바이트)이다. 양천구 주민이 우리 동네 쓰레기를 어느 업체가 수거하는지, 수거 차량 집하장이 어디인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대행구역(동 이름) 같은 이름 매칭이나 같은 양천구 폐기물 파일끼리만 연결한다.
