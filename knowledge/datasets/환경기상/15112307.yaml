description_portal: 대기오염 예보정보를 제공하는 데이터로 고농도 초미세먼지(50초과) 예보 정보를 제공하는 서비스입니다.* 과거 서울, 인천, 경기 지역에 대하여 초미세먼지 50㎍/㎥초과여부를 제공하고 있었으나, 현재 전국적으로 초미세먼지 50㎍/㎥초과여부를 제공하고 있습니다. 미세먼지 예보는 오늘예보/ 내일예보/ 모레예보가 제공되며, 시시각각으로 변하는 대기질 상황을 전달하기 위해 매일 4회(오전 5시, 오전 11시,오후 5시 오후, 오후 11시에 발표되고 있습니다. )※ 운영계정으로 사용하고자 할 경우 "한국환경공단 에어코리아 OpenAPI 기술문서" 내 신청 가이드 참고
