summary_user: 에어코리아가 발표하는 초미세먼지 예보 1건마다 전국 권역별(서울·인천·경기남북부·강원영동/영서·시도 등) 예보등급과 50㎍/㎥ 초과 여부, 예보개황·발생원인, 예측모델 이미지 주소를 담는다. 시민이나 행사·야외작업 담당자가 '내일 우리 지역 초미세먼지가 50을 넘을 것으로 예보됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 권역 이름(서울·부산 등)을 매핑하거나 같은 기관의 에어코리아 대기질 실시간 데이터와 통보시간 기준으로 맞춰 이어 쓴다.
