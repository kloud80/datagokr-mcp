summary_user: 경기도청소년수련원과 청소년야영장 등에 있는 건축물을 한 동씩 담은 시설 현황 원장으로, 건물명·연면적·건축년도·지상/지하 층수·데이터기준일자를 담는다. 시설 관리자나 분석가가 "수련원 건물 중 지은 지 오래되어 안전점검이나 리모델링이 먼저 필요한 동은 어디인가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 건물명이나 같은 기관 기준으로만 맞춰 이어 쓴다.
description_portal: '이 데이터는 경기도청소년수련원 및 청소년야영장 등에서 운영 중인 각 건축물의 현황 정보를 포함합니다. 주요 항목은 건물명, 연면적, 건축년도, 건축층수, 데이터기준일자로 구성되어 있으며, 각 건물의 용도(예: 전망대, 예절관, 체험동, 샤워실 등)와 구조(지하/지상 층수), 면적 정보 등을 제공합니다. 해당 데이터는 공공수련시설의 유지관리, 건축 연한 분석, 안전 점검 및 리모델링 계획 수립, 시설 재배치 검토 등의 행정 및 정책 수립에 활용될 수 있습니다. 또한 청소년 활동 공간 확보, 시설 현대화 계획 등 공간 기반 복지정책 추진에도 기초자료로 활용 가능합니다.'
