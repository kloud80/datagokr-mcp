description_portal: 데이터는 경상남도 양산시 관내에서 환경 관련 법령(대기·수질 등)을 위반하여 행정처분을 받은 업소 현황을 정리한 자료입니다. 시민의 알 권리 보장과 환경오염 예방, 행정의 투명성 제고를 목적으로 제공되며, 위반업소의 기본 정보와 위반 사실 및 처분 내역을 확인할 수 있습니다. 주요 항목은 업소명, 소재지, 대기종별, 수질종별, 위반내용, 처분일자, 행정처분명 등으로 구성되어 위반 유형과 처분 결과를 함께 파악할 수 있습니다. 데이터 제공 부서는 경상남도 양산시 기후환경과이며, 제공주기는 연간 단위로 업데이트될 예정입니다.
