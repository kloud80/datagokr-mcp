description_portal: 본 데이터는 2015년부터 2019년까지 최근 5년간 국립공원 내 자연암벽에서 발생한 낙석사고에 대한 이력 정보를 수록한 자료로, 낙석 다발 산악지점의 사고 특성을 분석하고 탐방객 안전 확보 및 위험구간 정비를 위한 기초자료로 활용됩니다. 데이터에는 사고 발생 연도, 국립공원명, 산명 또는 구간명, 낙석 발생 위치(위도·경도), 발생 횟수, 낙석 유형(자연풍화, 집중호우 등 원인 구분), 인명피해 유무, 사고 원인 분석 결과, 낙석 발생 고도, 대응 조치(낙석 방지망 설치 등) 등의 항목이 포함됩니다. 주요 다발 발생지는 설악산, 치악산, 속리산 등 급경사지와 암릉지대가 집중된 구간으로 확인되며, 본 자료는 낙석위험구간 지정, 정비 우선순위 선정, GIS 기반 낙석위험도 지도 구축, 안전 표지 설치 및 실시간 경보체계 연계 등 다양한 안전관리 업무에 활용됩니다. CSV 또는 공간분석용 데이터로 제공되며, 국립공원 재난안전 통합시스템과의 연계도 가능합니다.
