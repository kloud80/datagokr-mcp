summary_user: 충청북도 내 수질오염물질 배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 업체명·소재지·업종·종수(배출시설 종별 구분)를 포함하며 포털 설명상 2025년 8월 기준 현황이다. 주민이나 분석가가 "우리 동네 하천 주변에 어떤 업종의 폐수배출 사업장이 얼마나 있는가"를 확인하거나 시군별·업종별 배출시설 분포를 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소를 행정구역으로 매핑하거나 업체명을 대조하는 방식으로만 이어 쓴다.
limits: 사업장 코드나 사업자번호 같은 공통 키가 없어 다른 배출시설·측정 데이터와 정확히 연결하기 어렵고, 주소·업체명 매칭에 의존해야 한다. 범위는 충청북도 한 곳뿐이며 실제 배출량이나 수질 측정값은 담지 않는다.
