description_portal: 본 데이터는 경상북도 경주시 관내 음식물쓰레기 다량배출사업장의 현황을 링크 형식으로 제공하는 공공데이터이다. 음식물류 폐기물의 효율적인 수거 및 처리를 위하여 음식점, 급식소, 대형마트 등 일정 규모 이상에서 배출되는 사업장을 별도로 관리하고 있다. 해당 데이터에는 사업장 명칭, 소재지, 업종, 등록일자, 배출량 기준 등 관련 정보가 포함되어 있으며, 음식물쓰레기 감량정책 수립, 배출원 모니터링, 민원 대응 및 정책홍보 등에 활용될 수 있다. 경주시는 폐기물의 체계적인 관리를 통해 자원순환률을 높이고 환경 부담을 줄이기 위해 본 데이터를 정기적으로 갱신하고 있으며, 누구나 쉽게 접근하여 확인할 수 있도록 링크데이터 형식으로 개방하고 있다.
