summary_user: "부산광역시 수영구에 신고된 특정토양오염관리대상시설을 시설 한 곳당 한 행으로 담은 파일(csv, 943 bytes)로, 상호·소재지·연락처만 들어 있다. 구민이나 부동산·사업자가 '우리 동네나 이 필지 근처에 토양오염 우려 시설(예: 주유소 등 유해물질 저장시설)이 있는가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 소재지 주소를 지오코딩하거나 상호 이름으로 맞춰 다른 사업장·환경 공간 규제 데이터와 이어 쓴다."
description_portal: 부산광역시 수영구는 구민의 건강과 안전한 환경 조성을 위해, 유해화학물질 배출로 인해 토양 오염의 우려가 있는 특정토양오염관리대상시설 중 신고 대상 시설의 현황을 투명하게 공개하고 있습니다. 이 정보는 각 시설의 상호명, 정확한 소재지, 그리고 연락 가능한 전화번호를 상세히 포함하여, 구민들이 잠재적인 환경 위험 요소를 인지하고 관련 정보를 쉽게 얻을 수 있도록 돕습니다. 이를 통해 수영구는 토양 오염으로부터 생활 환경을 보호하고, 지속적인 관리와 감시를 통해 유해물질의 확산을 방지하며, 궁극적으로 구민들의 삶의 질을 향상시키고 안전하고 쾌적한 주거 환경을 유지하는 데 적극적으로 기여하고 있습니다.
