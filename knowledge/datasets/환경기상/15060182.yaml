description_portal: 서울시 한강 및 주요지천 수질 측정 자료는 서울시가 한강과 주요 지천의 수질 상태를 정기적으로 관측한 결과를 정리한 환경 공공데이터입니다. 날짜와 시간, 측정소명을 통해 언제, 어느 지점에서 측정이 이루어졌는지 확인할 수 있으며, 수온과 수소이온농도는 수질의 기본적인 물리·화학적 상태를 보여주는 지표입니다. 용존산소는 수중 생태계의 건강도와 직결되는 항목으로, 어류와 수생생물이 서식하기 적합한지 판단하는 데 활용됩니다. 총질소와 총인은 부영양화와 조류 번성을 유발하는 주요 원인 물질로, 하천의 오염도와 생활·산업 배출수의 영향을 평가하는 데 중요합니다. 총유기탄소는 물 속에 존재하는 유기물의 총량을 나타내어 유기오염 수준을 종합적으로 파악하는 지표입니다. 페놀과 시안은 독성이 강한 유해물질로, 산업오염이나 사고 등으로 인한 수질 위해 여부를 감시하는 데 사용됩니다.
