summary_user: 화성시 안에서 대기오염물질을 배출하는 사업장을 한 행씩 담은 사업장 단위 목록으로, 사업장명·지번 및 도로명 소재지·관리기관·관리자 연락처를 담는다(CSV 파일 약 617KB). 주민이나 분석가가 '우리 동네 근처에 어떤 대기배출 사업장이 있고 어느 기관이 관리하나'를 확인하거나 시내 배출사업장 분포를 파악하는 데 쓴다. 사업자등록번호나 사업장 코드 같은 공통 조인 키가 없어, 다른 배출원·인허가 데이터와는 사업장명이나 주소를 맞춰 이어 써야 한다.
description_portal: 「경기도 화성시_대기배출사업자 현황」은 화성시 지역 내 대기오염물질을 배출하는 사업장의 정보를 수록한 공공데이터로, 각 사업장의 명칭, 소재지 지번 주소 및 도로명 주소, 소관 관리기관, 관리자 연락처 등의 항목을 포함하고 있습니다. 이 데이터는 환경오염 관리 및 규제, 민원 대응, 지역 환경 정책 수립 등을 위한 기초 자료로 활용될 수 있으며, 대기배출사업자의 분포 및 관리 현황을 체계적으로 파악하는 데 유용합니다. 또한 대기질 개선 대책 수립, 환경 영향평가, 관련 연구 등에서도 폭넓게 활용될 수 있는 환경기반 정보입니다.
