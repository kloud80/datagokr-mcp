summary_user: 제주특별자치도의 미세먼지(PM10) 대기오염도를 월 단위 평균 농도(μg/m³)로 정리한 집계 데이터로, 포털 설명상 2010년 1월부터 2020년 5월까지의 값을 기준 연도·측정 구분·시군구·읍면동별로 담는다. 연구자나 정책 담당자가 "제주 지역 미세먼지 농도가 10년간 어떻게 변했고 어느 읍면동이 높았나" 같은 장기 대기질 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대기질·인구·건강 데이터와는 시군구·읍면동 이름 매핑으로만 연결한다.
description_portal: '이 데이터셋은 제주특별자치도 지역의 월별 PM10 (미세먼지, 입자 지름 10 마이크로미터 이하) 대기오염도 정보를, 2010년 1월부터 2020년 5월까지의 측정값을 정리한 공공데이터입니다. 각 월에 대해 평균 미세먼지 농도가 기록되어 있으며, 일부 값은 측정소 자료 ­획득률이 낮은 경우 통계 처리된 값(*)으로 표기되어 있고, 측정소 비가동, 장비교체, 점검 등의 사유로 자료가 없는 경우는 결측값으로 남아 있습니다. 이 데이터는 제주 지역의 장기적 대기질 변화 분석, 공공 건강 정책, 환경 연구, 대기 관리 및 대응 전략 수립, 지역별 미세먼지 경향 파악 등에 활용 가능하며, CSV 형식으로 무료 제공됩니다데이터 제공처: KOSIS 국가통계포털'
