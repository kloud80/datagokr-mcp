summary_user: 경상남도 도내에 등록된 환경컨설팅회사를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업체명·등록번호·등록일·사업장 도로명/지번 주소·위도·경도·연락처를 담는다(csv 약 2.4KB의 소규모 목록). 경남에서 환경 인허가 대행이나 사업장 환경규제 진단을 맡길 컨설팅 업체를 찾는 사업자, 또는 도내 환경컨설팅 업체 분포를 보려는 분석가가 쓴다. 전역 공통 조인 키는 없어 다른 환경 업체·인증 목록과는 업체명이나 주소로 맞춰 연결하고, 위도·경도로 지도 위에 다른 사업장 데이터와 겹쳐 본다.
limits: 표준 사업자 코드 같은 전역 조인 키가 없어 다른 데이터와 연결하려면 업체명·주소 매칭에 기대야 한다. 범위는 경상남도 한 시도에 한정되며, 업체의 수행 실적이나 업무 분야별 상세는 담지 않는다.
