description_portal: 경상남도 도내 환경컨설팅업체 현황을 제공합니다.(업소명, 등록일, 영업소 소재지, 연락처 등)환경컨설팅회사는 「환경기술 및 환경산업 지원법」 제16조의4제1항에 따라 등록할 수 있으며, 다음과 같은 업무를 수행합니다. 1. 국내외 환경 관련 규제에 대한 조사, 분석, 상담 및 정보제공(이하 “조사등”이라 한다)2. 환경 관련 등록 및 인ㆍ허가 등 환경행정 절차에 대한 상담, 정보제공 및 대행3. 사업장과 각종 시설의 입지(立地) 및 건설, 운영관리 등과 관련된 환경규제에 대한 진단 및 조사등4. 환경오염의 예방과 최적 처리를 위한 진단ㆍ조사등 및 교육5. 환경산업체의 창업 및 운영에 대한 진단ㆍ조사등 및 교육6. 사업장의 환경성에 대한 진단ㆍ조사등 및 교육7. 환경기술의 개발 및 실용화에 대한 진단ㆍ조사등 및 교육 등데이터는 업소명, 등록일, 소재지, 전화번호 등으로 구성되며, 해당 링크를 통해 접속하면 경상남도 도내 환경컨설팅회사 등록업체 데이터를 조회 및 다운로드하실 수 있습니다.해당 데이터는 연간 현행화 데이터(12월말 기준)이며, 차기 업데이트 예정일은 2027년 1월입니다.
