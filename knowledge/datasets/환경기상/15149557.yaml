description_portal: '1. 도로  재비산먼지 및 배경먼지  측정 합성데이터는 특수제작한 이동측정차량으로 주행하는 차량의 타이어(휠)와 도로면의 마찰에 의해서 재비산되는 먼지(PM10)과 도로 주변 대기의 먼지(PM10)를 측정한 데이터를 기반으로  AI학습 테스트를 위해 생성한      합성데이터(가상데이터)입니다 2. 합성데이터 설명  - 원본데이터 이용기간 및 건수: 2015~2025, 약 10만건  - 원본데이터 특성 : 이동측정차량이 특정 도로 구간을 주행하면서 연속 측정한 미세먼지 데이터, 도로재비산먼지와 비교를 위해 배경먼지도 측정함. 차량 주행 방향 존재(예 : 인수봉로(북->남)), 초당 측정 데이터를 평균, 최대, 최소값으로 생성  - 합성데이터 특성 :  차량의 도로주행 방향에 따라 도로재비산먼지 농도 생성  - 합성데이터 활용 : 실제 측정 데이터의 구조와 통계적 특성을 반영하되 민감정보를 포함하지 않아  AI학습 테스트 데이터로 활용 가능'
