description_portal: 기후에너지환경부의 환경정책기본법시행령중 수질 및 수생태계의 사람의건강보호기준(하천) 및 생활환경 기준에 관한 데이터를 제공합니다.환경정책기본법 시행령을 기반으로 물환경측정망내 하천･호소 등 공공수역에 대한 수질현황 및 추세파악을 위한 수질측정망과오염총량관리 시행지역의 수질현황 및 수질오염총량제 이행사항 평가를 위한 총량측정망을 운영하며 주1회, 월1회 등 생산된 생물화학적산소요구량(BOD) 화학적산소요구량(COD), 총유기탄소량(TOC), 부유물질량(SS), 용존산소량(DO), 총인(tatal phosphorus), 총대장균군, 분원성대장균군, 카드뮴(Cd), 비소(As), 시안(CN), 수은(Hg), 유기인, 폴리클로리네이티드비페닐(PCB), 납(Pb), 6가 크롬(Cr6+), 음이온 계면활성제(ABS), 사염화탄소, 1,2-디클로로에탄, 테트라클로로에틸렌(PCE), 디클로로메탄, 벤젠, 클로로포름, 디에틸헥실프탈레이트(DEHP), 안티몬, 1,4-다이옥세인, 포름알데히드, 헥사클로로벤젠 항목에 대한 측정값의 수질에 해당하는 기준값 정보입니다.유의사항1. 총인, 총질소의 경우 총인에 대한 총질소의 농도비율이 7 미만일 경우에는 총인의 기준을 적용하지 않으며, 그 비율이 16 이상일 경우에는 총질소의 기준을 적용하지 않는다.유의사항2. 화학적 산소요구량(COD) 기준은 2015년 12월 31일까지 적용한다.
