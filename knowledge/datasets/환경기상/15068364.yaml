description_portal: 본 데이터는 녹색건축 인증 및 예비인증 수수료 산출 기준을 비목 및 세부항 목별로 정리한 통계형 공공데이터로, 총 18건 레코드에 비목(A·B·C 등), 세부항목(서류심사·현장심사), 인증 수수료 산출 내역, 예비인증 수수료 기준 필드를 포함합니다. 인증 수수료는 기술사· 특급기술자 노임단가, 심사 인원 및 기간, 표준 품목 단가를 근거로 산정하며, 예비인증 차등 요율 적용 방식을 담고 있습니다. 2020-01-01 기준 스냅샷이며, 비용 예측, 정책 지원금 산정, 인증 절차 안내 자료, 비용 비교 분석 등에 활용 가능합니다.
