description_portal: '환경통계활용사례 등록URL 복사목록 이동서울시 오존주의보 발령 현황 통계○ 통계개요* 통계명 : 오존주의보 발령 현황* 통계종류 : 서울시 오존주의보 발령 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 오존량이 환경기준보다 높을 시 시민에게 즉시 주의정보를 제공하고,지역별 발령횟수에 따른 적정한 정책의 수립ㆍ시행을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 서울보건환경연구원 → 시도 → 환경부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 오존주의보 발령일수 및 지역별 발령횟수○ 용어설명* 오존환경기준 : 연간 평균치 0.06ppm이하, 1시간 평균치 0.1ppm이하로「대기환경보존법시행령 제2조②」에 따라 대기오염경보대상 오염물질로 지정됨. 1시간평균농도 0.12ppm이상시 주의보, 0.3ppm이상시 경보, 0.5ppm이상시 중대경보'
