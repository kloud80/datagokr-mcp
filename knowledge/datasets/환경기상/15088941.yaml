summary_user: 부산광역시 내 환경오염물질 배출시설로 등록된 사업장을 한 곳씩 담은 목록으로, 구군명·업체명·도로명주소·업종·전화번호·위도·경도를 사업장 단위로 제공한다. 주민이 우리 동네 주변에 도금업·세차업·인쇄업 같은 배출시설이 어디 있는지 확인하거나, 분석가가 구군별·업종별 배출시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 구군명·업체명·주소 같은 이름 매칭이나 위도·경도 좌표 근접으로 이어 쓴다.
description_portal: 부산광역시 환경오염  배출 시설 현황 데이터를 개방합니다.환경오염물질 배출시설은 대기, 수질, 토양 등의 환경에 오염물질을 배출하는 시설로서, 법적으로 관리 대상이 되는 사업장이나 장비를 의미합니다. 환경오염을 예방하고, 체계적인 관리를 목적으로 환경오염 배출시설을 관리하고 있습니다.자동차세차업, 자동차 정비업, 병원, 식료품 제조, 절삭가공, 인쇄, 섬유제품 제조, 기계장비제조업, 도금업 등 다양한 업종이 등록 되어 있습니다개방되는 데이터에는 구군명, 업체 명, 도로명주소, 업종, 전화번호, 위도, 경도 등의 데이터가 포함됩니다.
