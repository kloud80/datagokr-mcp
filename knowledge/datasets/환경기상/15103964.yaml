summary_user: 충청남도 보령시 관내에 설치된 영농폐기물 공동집하장을 한 곳당 한 행으로 담은 파일로, 집하장명·주소·위도·경도·규모·설치연도·설치형태·관리자를 기록한다. 농업인이 폐비닐이나 농약용기를 가까운 집하장에 내놓을 곳을 찾거나, 분석가가 시 안의 집하장 분포와 설치 시기를 살펴보는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로, 주소나 위경도를 기준으로 지도·행정구역 자료와 공간적으로 맞춰 쓴다.
description_portal: 친환경 농업 확산과 농촌 환경보전에 대한 사회적 관심이 증대되면서, 농업용 비닐과 농약용기 등 영농폐기물의 적정한 처리와 재활용을 통한 농촌 환경 개선이 중요한 농업환경정책 과제로 대두되고 있습니다. 폐기물관리법과 농어업·농어촌 및 식품산업 기본법에 따른 체계적인 영농폐기물 관리와 농업인들의 환경보전 의무 이행 지원을 위한 수거·처리 인프라 구축이 요구되고 있으며, 농업용 플라스틱 폐기물 재활용 촉진과 자원순환 농업 실현을 통한 지속가능한 농업 발전이 필요합니다. 영농폐기물 불법투기 방지와 농촌 경관 보전을 위한 공동집하장 운영 활성화와 농업인 참여 확대가 중요해지고 있으며, 농업인들의 영농폐기물 처리 편의성 향상과 처리 비용 절감을 위한 효율적인 수거 시스템 구축이 요구되고 있습니다. 또한 영농폐기물 재활용 기술 개발과 처리 방법 개선을 통한 경제적·환경적 효과 창출이 필요하며, 농업환경 정책 수립과 효과적인 영농폐기물 관리 체계 구축을 위한 체계적인 현황 관리의 중요성이 증대되고 있어, 충청남도 보령시는 관내에 설치된 영농폐기물 공동집하장의 위치, 규모, 관리 현황 등 농업환경 보전과 영농폐기물 적정 처리에 필요한 종합적인 영농폐기물 공동집하장 현황 정보를 제공하고 있습니다.
