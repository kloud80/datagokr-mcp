summary_user: 국가 온실가스 배출·흡수량을 분야별(에너지, 산업공정 및 제품 사용, 농업, LULUCF, 폐기물) 행과 1990~2023년 연도별 열로 정리한 전국 단위 집계 통계 파일로, 단위는 백만톤 CO2 eq.이다. 정책 분석가나 연구자가 '1990년 이후 에너지 분야 배출량이 어떻게 변했고 전체 배출에서 차지하는 비중은 얼마인가' 같은 장기 추세·분야 비중 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 분야명이나 연도를 이름 기준으로 맞춰 이어 써야 하며, 사업장·기업 단위 배출 데이터와는 직접 연결되지 않는다.
description_portal: '* 국가 온실가스 통계는 MPGs 제50항의 규정에 따라 에너지, 산업공정 및 제품 사용, 농업, 토지이용･토지이용 변화 및 임업(Land Use, Land-Use Change and Forestry, 이하 LULUCF), 폐기물, 총 5개 분야로 구분하여 산정하고 있다.* ETF의 이행을 위한 투명성체계 방식･절차･지침(Modalities, Procedures and Guidelines, 이하 MPGs) 제48항･제49항의 규정에 따라 국내에서 배출한 7개의 온실가스(이산화탄소(CO2), 메탄(CH4), 아산화질소(N2O), 수소불화탄소(HFCs), 과불화탄소(PFCs), 육불화황(SF6), 삼불화질소(NF3))에 대한 배출･흡수량 정보를 보고한다.* 온실가스종합정보센터에서 작성한 국가 온실가스 통계는 관리위원회의 심의를 통해 최종적으로 확정되며 온실가스종합정보센터와 통계청의 공식 누리집(홈페이지)을 통해 대외적으로 공표된다.* 단위: 백만톤 CO2 eq., NO = 배출활동 및 공정이 없는 경우, NE = 산정하지 아니하는 경우, NA = 자연적, 이론적으로 발생하지 않는 활동 및 공정의 경우, IE = 다른 항목에 포함하여 보고하는 경우, C = 기밀정보인 경우'
