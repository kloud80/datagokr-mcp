summary_user: 국립공원공단이 국립공원 안에 설치한 재난 예·경보 시설을 시설 한 곳씩 담은 전국 원장으로, 시설명·세부유형·지구명·위치와 위도·경도·해발고도, 통신방식, 설치금액·설치업체, 표출 크기·색상 같은 항목을 CSV 한 파일(약 110KB)로 제공한다. 공원 안전 담당자나 분석가가 '이 탐방로 구간 근처에 경보 시설이 있는지, 어느 지구에 시설이 부족한지'를 확인하거나 재난지도에 시설 위치를 표시할 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 위도·경도 좌표로 공간 결합하거나 지구명 같은 이름을 맞춰 연결한다.
description_portal: 본 데이터는 국립공원공단이 자연재해로부터 탐방객과 공원 자산을 보호하고, 실시간 상황 대응을 위해 설치·운영 중인 재난 예·경보 시설의 현황 정보를 포함한 자료입니다. 주요 항목은 시설명, 국립공원명, 설치 위치(위도·경도), 시설 유형(산사태 경보, 기상 경보, 홍수 감지, 낙석 센서, 경고 방송 등), 설치 연도, 운영 여부, 통신 방식(유선/무선), 전원 유형, 관리 주체, 점검 주기 등의 정보로 구성되며, CSV 포맷으로 제공됩니다. 본 데이터는 국립공원 재난안전 스마트플랫폼과 연계되어 재해 발생 전 단계에서 실시간 감지 및 경고를 통해 대응 시간을 최소화하고 피해를 줄이는 데 활용됩니다. 또한 안전관리계획 수립, 시설 정비 예산 계획, 민간 경보 시스템과의 통합 운영, 재난지도 시각화 등 다양한 공공안전 분야에서 유용하게 활용됩니다.
