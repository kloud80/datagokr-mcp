summary_user: 경기도 파주시에서 대기환경보전법에 따라 신고된 대기배출시설 사업장을 한 곳씩 담은 목록으로, 사업장명·도로명/지번 주소·위도·경도·배출종류(1~5종)·사업허가일자·연락처를 포함한다. 주민이나 환경 분석가가 '우리 동네 주변에 어떤 종별 대기배출 사업장이 어디에 있는가'를 확인하거나, 배출원 위치를 지도에 올려 인구·기상·대기질 자료와 겹쳐 보는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 사업장명·주소를 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 경기도 파주시의 대기환경보전법에 따라 신고된 배출시설의 현황을 파악할 수 있는 대기배출시설신고사업장현황 데이터로 사업장의 위치정보(도로명주소, 지번주소, 위도·경도), 사업장별 오염 특성을 식별할 수는 배출종류(1~5종), 사업허가일자, 연락처 등으로 구성되어 있습니다. 이 데이터는 공공환경정책 수립, 환경영향평가, 연구 및 분석, GIS 기반 대기오염 확산 모델링, 환경통계 분석, 오염원 추적, 대기오염 배출원과 인근 인구, 건강영향, 기상자료 등의 통합 분석, 머신러닝 기반 오염예측 모델링, 시간·공간적 오염 확산 분석, 정책 효과 검증, 공간정보 기반 분석(GIS), 시계열 데이터 분석, 인과관계 연구 등에 활용될 수 있습니다.
