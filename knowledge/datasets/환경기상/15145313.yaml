description_portal: 환경부 국립생물자원관에서 운영중인 국가생물다양성 정보공유체계(kbr.go.kr) 홈페이지의 연도별, 월별 접속자 수 자료입니다.국가생물다양성 정보공유체계(CBD-CHM KOREA)란 생물다양성협약(CBD)의 일환으로 국가의 생물다양성 정보를 이해관계자(정부부처, 연구기관, 대학, NGO 등)와 공유하는 협력체계인 생물다양성 정보공유체계(Clearing-House Mechanism, CHM) 구축을 위한 웹사이트입니다. 홈페이지에서 당사국총회(COP), 글로벌 생물다양성 프레임워크(GBF), 생물다양성협약(CBD), 국가생물다양성전략(NBSAP), 지역생물다양성전략(LBSAP), 국가생물종목록, 법정관리종, 보호구역 등의 정보를 제공하고 있으며 자료를 이용하는 접속자 수를 월별로 기록하여 통계 낸 자료입니다.
