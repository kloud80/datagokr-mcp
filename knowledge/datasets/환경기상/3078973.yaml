summary_user: '고양시 관내에서 지정폐기물을 배출·처리하는 사업장별로 상호, 폐기물 종류, 업무구분, 도로명·지번 주소와 우편번호를 담은 건별 목록 파일(CSV, 약 16만 바이트)입니다. 고양시에서 특정 지정폐기물(예: 폐유·폐산)을 다루는 사업장이 어디에 있는지 확인하려는 주민, 인근 처리 거래처를 찾는 사업자, 지정폐기물 관리 사업장 분포를 보려는 분석가가 쓴다. 전역 조인 키나 사업자번호 같은 공통 코드는 없어, 다른 폐기물 처리업·배출자 데이터와는 상호명이나 사업장 주소(도로명·지번)를 맞춰 이어 쓴다.'
limits: 고양시 한 시군구 범위의 사업장 목록이라 다른 지역과 비교하려면 별도 데이터가 필요하다. 지정폐기물 발생량이나 처리량 같은 통계는 담지 않는다. 다른 데이터와 묶을 공통 키가 없어 상호·주소 문자열 매칭에 의존해야 한다.
