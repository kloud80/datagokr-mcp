summary_user: "인천광역시 계양구 관내 석면조사 대상 건축물을 한 건씩 담은 원천 목록 파일(csv, 약 37KB)로, 기관(상호)명·건축물 소재지 주소·건축물 유형 구분(다중이용시설, 공공건축물, 어린이집 등)을 담는다. 주민이나 학부모가 '우리 동네 어린이집이나 다중이용시설 중 석면조사 대상인 곳이 어디인가'를 확인하거나, 구청·분석가가 유형별 석면 관리 대상 현황을 파악하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 기관명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다(예: 주소를 지오코딩해 건축물대장·어린이집 정보와 대조)."
