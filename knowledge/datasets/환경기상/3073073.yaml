description_portal: '이 데이터파일은 인천광역시 계양구 관내 석면조사대상 건축물에 관한 정보를 체계적으로 정리한 자료입니다. 주요 항목으로는 조사를 수행하는 기관명, 석면조사 대상 건축물의 정확한 위치를 나타내는 건축물 소재지, 그리고 건축물의 유형을 구분한 구분(예: 다중이용시설, 공공건축물, 어린이집 등)이 포함되어 있습니다. 본 데이터는 석면 안전관리 및 환경보호를 위한 기초 자료로 활용되며, 석면 노출 위험이 있는 건축물의 현황 파악과 관리 대책 수립에 중요한 역할을 합니다. 주민 안전 확보와 관련 법규 준수를 위한 행정 지원에 기여합니다.추가 문의사항은 **인천광역시 계양구 환경과(032-450-5403)**로 연락해 주시기 바랍니다.'
