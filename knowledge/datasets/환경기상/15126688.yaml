description_portal: 기상청 수치예보모델을 통해 작성된 각종 예상일기도를 제공합니다.한국을 포함한 전세계에서 관측한 데이터를 전문형식으로 수집하여 해당 데이터를 수치모델에 대입하여 계산된 값(3차원 지구 대기의 현재값과 미래 변화의 값)을 2차원 평면 이미지로 생성하여 제공합니다.일기도에는 지상일기도와 고도별 등압면에 표출된 예상일기도를 제공하며, 요소로는 지상일기도에 강수나 기압 등 예상값을 표출하고 고도별 등압면 예상일기도에는 온도, 기압, 바람의 흐름, 와도(소용돌이)의 변화 등을 확인 할 수 있도록 제공하고 있습니다.
