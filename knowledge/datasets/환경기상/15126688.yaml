summary_user: 기상청 수치예보모델로 계산한 3차원 대기 예측값을 지상일기도와 고도별 등압면 예상일기도 같은 2차원 이미지로 담으며, 전국 범위의 비공간 이미지 자료다. 예보관·기상 분석가가 "며칠 뒤 상층 기압골과 와도가 한반도로 내려오는가, 지상에 강수 구역이 생기는가"처럼 예상 기압 배치와 바람 흐름을 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와 키로 바로 잇지 못하고, 예보구역·격자(nx,ny) 기반 단기·중기예보와는 시각·이름을 맞춰 나란히 보는 식으로만 연결한다.
limits: 결과가 일기도 이미지라 지점·격자별 수치값으로 바로 조회하거나 조인하는 용도로는 쓰지 못한다. 포털 활용신청과 별개로 외부 사이트 apihub.kma.go.kr의 인증키(KEY 파라미터)를 따로 받아야 호출된다.
