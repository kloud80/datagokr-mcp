summary_user: 수도권매립지에서 강우·강설 같은 기상 악화 때 폐기물 반입을 일시적으로 막는 기준을 구분, 기상기준, 대상 폐기물 항목으로 담은 524바이트짜리 작은 기준표 파일이다. 수도권매립지로 폐기물을 운반하는 수집운반업체나 배출 사업장이 오늘 비 예보 때문에 반입이 통제되는지, 어떤 폐기물이 대상인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 같은 기관(수도권매립지관리공사)의 반입관리 자료나 기상 정보와 이름·조건을 맞춰 연결해야 한다.
description_portal: '수도권매립지의 기상에 의한 일시반입통제기준 정보입니다. 개방항목은 구분, 기상기준, 대상 폐기물의 항목을 제공합니다.공사에서 제공하고 있는 일시반입통제 기준은 기상 악화(예: 강우, 강설 등)로 인해 폐기물 반입 및 하역 작업이 안전하지 못하거나 매립지 환경에 악영향을 줄수 있는 상황에 대비해 설정된 기준 입니다.이 기준은 누적 강우량 15mm/일 이상 또는 강우 예보가 25mm/일 이상 등 특정 조건이 충족되면 SRF(폐기물 고형연료) 및 직매립 폐기물 등 전체 폐기물에 대해 일시적으로 반입이 통제 됩니다. 이러한 통제는 폐기물 차량 운행 및 하역 작업시 안전사고 예방, 매립지 내 침출수 및 매립가스 발생 억제 등 환경 보호를위해 필수적 입니다.'
