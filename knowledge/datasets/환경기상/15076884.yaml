summary_user: 해남군에서 벙커C유를 쓰는 사업장별로 사업장명, 도로명 소재지, 연료사용량 합계를 담은 건별 목록이며, 포털 설명 기준 해남읍 1곳과 옥천면 1곳 등 2개소만 실려 있는 226바이트짜리 작은 CSV 파일이다. 지역 주민이나 환경 분석가가 '해남군에서 벙커C유를 태우는 사업장은 어디이고 얼마나 쓰는가'를 확인하고, 대기오염 배출원을 점검하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어서, 다른 대기 배출시설 사업장 자료와는 사업장명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전라남도 해남군 벙커C유 사용업체 현황에 관한 공공데이터입니다.이 데이터에는 연번, 사업장명, 도로명소재지, 연료사용량(총합) 총 4종의 항목으로 구성되어 있습니다.현재 기준으로 해남군에는 2개소의 사업장이 있으며 해남읍 1개소, 옥천면 1개소가 있습니다.해당 데이터는 지역 내 벙커C유 소비 실태를 파악하고, 대기오염 저감 정책 수립, 에너지 효율향상 방안 도출 등에 활용될 것으로 판단됩니다. * 벙커c유는 중유 중하나로 A중유, B중유, C중유로 구분되며 잔류유 90% 이상으로 가장 점도가 높음
