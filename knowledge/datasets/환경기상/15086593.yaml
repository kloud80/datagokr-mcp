description_portal: '본 데이터는 한국수자원공사에서 선정한 현장 적용성이 높은 등록 신기술의 보유 현황을 제공한다. 기술 분야, 지정번호, 기술명, 개발업체, 적용일, 보호기간 등으로 구성되어 있다. 수자원 관련 신기술의 활용 가능성을 파악할 수 있으며, 기술 검토, 연구개발, 공공사업 기획 등에 활용할 수 있다. 보호기간 정보는 기술 도입 시점과 연계 활용 계획 수립에 참고가 된다. 사용자는 물 분야에서 적용 가능한 기술을 확인하고, 기술 동향 분석이나 비교 검토 자료로 활용할 수 있다. 또한 민간 기술 발굴 및 기관의 기술 검토 업무에 기초자료로 제공된다. 데이터는 구조화되어 있어 정보 활용과 접근에 용이하다.등록 신기술 보유 현황 항목은 K-물산업지원포털 => 기술활용 => 등록 기술 => 등록 기술 보유 현황에서 제공 중이니 참고 부탁드립니다.(URL: https://www.kwater.or.kr/wis/wq/index.do?w2xPath=/wis/ui/index.xml)'
