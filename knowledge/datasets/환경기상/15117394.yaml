description_portal: 인천광역시 미세먼지(PM-10, PM-2.5), 및 오존(O3)에 대한 측정항목명, 사전주의보 발령 기준, 주의보 발령 기준, 주의보 해제 기준, 경보 발령 기준, 경보 해제 기준, 중대경보 발령 기준, 중대경보 해제 기준에 대한 데이터 입니다.  미세먼지(PM-10)는 대기 중 고체상태의 입자와 액적상태의 입자의 혼합물로 공기역학직경이 10마이크로미터 이하인 부분을 의미하고 초 미세먼지(PM-2.5)는 미세먼지의 1/4크기로 황산염, 질산염, 암모니아 등의 이온성분과 금속화합물, 탄소화합물 등으로 이루어져 있으며, 주로 자동차 배기가스나 화석연료 연소시에 발생하고, 오존(O3)은 광화학 옥시던트의 하나로 2차 오염물질에 속하며 오존에 대한 반복노출은 기도와 폐포의 신경수용체를 자극하여 기관지염, 심장질환, 폐기종 천식의 악화를 가져온다
