summary_user: 경상남도 김해시가 지정한 자동차 공회전 금지구역을 구역 하나당 한 행으로 담은 파일로, 구역유형·구역명칭·주소·위도·경도·기준일자를 제공한다. 운전자나 주민이 '내 주변 주차장이나 터미널이 공회전 금지구역인가'를 확인하거나, 분석가가 금지구역 분포를 지도에 올려 대기질·민원 현황과 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표를 기준으로 공간 결합하거나, 같은 김해시 자료와 이름으로 맞춰 이어 쓴다.
description_portal: '경상남도 김해시 공회전 금지구역 현황에 대한 데이터로 구역유형, 구역명칭, 주소, 위도, 경도, 데이터 기준일자(YYYY-MM-DD)의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 9월 26일로, 연간 주기로 관리하고 있습니다.* 해당 데이터를 분석·연계하여 정책 수립 및 지역사회 문제 해결 등에 활용하실 수 있습니다.데이터 담당부서 : 김해시 기후대응과(055-330-3357)[데이터 변동 안내]1. 데이터 현행화2. 데이터 설명 수정3. 데이터 키워드 추가4. 데이터 기준일 변경'
