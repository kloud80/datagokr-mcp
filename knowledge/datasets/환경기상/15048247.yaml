summary_user: 국내 주요 시멘트 제조사(한일현대·아세아·삼표·쌍용C&E·성신양회·한일·한라·유니온)와 일본 Sumitomo Osaka 제품을 대상으로 한 모니터링 결과를 담는다. 중금속 6종(육가크롬·비소·납·구리·카드뮴·수은, mg/kg)과 방사능물질 3종(세슘134·세슘137·요오드131, Bq/g)의 함량 분석결과를 담은 전국 단위·비공간 파일이며, 포털 설명상 모니터링은 매월 실시된다. 건축주나 소비자가 특정 제조사 시멘트의 육가크롬 함량이 어느 수준인지, 수입 일본산 시멘트에서 방사능물질이 검출되는지를 확인할 때 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 제조사 이름을 맞춰 연결해야 한다.
description_portal: 국립환경과학원은 국내에 유통되는 시멘트의 안전성을 확보하고 국민 건강을 보호하기 위해 매월 중금속 및 방사능물질 함량에 대한 모니터링을 실시하고 있습니다.모니터링 대상은 한일현대, 아세아, 삼표, 쌍용C&E, 성신양회, 한일, 한라, 유니온 등 국내 주요 시멘트 제조사와 일본의 Sumitomo Osaka 제품입니다.분석 항목은 중금속 6종(육가크롬, 비소, 납, 구리, 카드뮴, 수은)과 방사능물질 3종(세슘134, 세슘137, 요오드131)이며, 중금속 분석결과는 mg/kg, 방사능물질 분석결과는 bq/g 단위로 제공됩니다.해당 모니터링 결과 데이터는 누구나 열람가능하도록 국립환경과학원 홈페이지에 게재하고 있습니다.
