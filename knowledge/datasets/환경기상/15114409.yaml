summary_user: "우리나라 연안에 사는 사구생물·염생식물·저서생물·부유생물·유영생물·바닷새 등 해양생물을 종 단위로 담으며, 각 행에 생물종류 구분, 생물명, 서식지 설명이 들어 있는 전국 범위의 비공간 목록이다. 연구자나 생태교육 담당자가 '특정 생물종류(예: 염생식물)에 어떤 종이 있고 어디에 서식하는가'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 이을 전역 조인 키가 없어서, 해양보호생물 목록 같은 다른 데이터와는 생물명이나 생물종류코드(mrSpcKnd)를 이름·코드 매핑해서만 연결한다."
description_portal: 이 데이터는 해양수산부에서 우리나라 연안의 해양생물 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 연안에 서식하는 사구생물, 염생식물, 저서생물, 부유생물, 유영생물, 바닷새 등 해양생물의 생물종류코드, 생물종류의 한글명, 생물명과 서식지 정보로 구성되어 있습니다.  본 데이터는 지자체 및 관련 기관에서의 연안생태계 연구 지원, 해양생물 보전사업 지원, 해양생태교육 자료 개발, 연안지역 해양 자원관리 및 정책 수립 및 추진 등 활동을 위한 기초 자료로 활용될 수 있습니다.
