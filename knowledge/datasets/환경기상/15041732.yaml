summary_user: 대구광역시 중구에 설치된 폐형광등·폐건전지 분리수거함을 수거함 한 곳씩 담은 파일로, 설치 장소(주택명)·주소·위도·경도·설치년도·수거품목을 기록한다. 주민이 "우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리나"를 찾거나, 분석가가 행정동별 수거함 배치를 지도에 그려 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 행정동 이름이나 위도·경도 좌표로 맞춰 이어 쓰며, 다른 지자체의 같은 종류 수거함 파일과 합칠 때도 시도명·시군구명 이름으로 구분한다.
description_portal: 대구광역시 중구 폐형광등 및 폐건전지 분리수거함 현황으로 설치 위치, 주소지, 수거품목(연번,시도명,시군구명,행정동,설치위치(주택명),설치주소,위도,경도,설치년도,수거품목,데이터기준일) 등의 정보를 제공합니다- 폐건전지는 「폐기물관리법」 및 「자원의 절약과 재활용촉진에 관한 법률」에 따라 분리수거 및 재활용 대상 폐기물로 관리됩니다. - 폐건전지는 유해 폐기물에 해당하므로 일반 쓰레기와 함께 버리면 안 되며, 전용 수거함에 배출해야 합니다. - 폐건전지 수거함이 아닌 곳에 버리면 재활용이 어려워지므로 반드시 전용 수거함을 이용해야 합니다.
