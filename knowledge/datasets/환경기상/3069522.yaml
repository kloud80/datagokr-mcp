summary_user: 부산광역시 북구 관내 환경오염 배출시설을 업소 한 곳당 한 행으로 담은 소규모 파일(약 4.8KB CSV)로, 업소명·도로명주소·업종·비고를 제공한다. 북구 주민이나 분석가가 "우리 동네 근처에 어떤 업종의 배출시설이 있는가"를 확인하거나 구 단위 오염원 분포를 파악하는 데 쓴다. 사업자번호·좌표 같은 전역 조인 키가 없어 다른 사업장 데이터와는 업소명·주소를 맞춰 보거나 지오코딩해야 이어 쓸 수 있다.
