summary_user: 부산 관내 주요 하천(포털 설명상 8개 하천 13개소)의 자동측정소에서 잰 수온·수소이온농도·용존산소·탁도·전기전도도·염분·총용존고형물질 등을 측정소별 시간 단위로 담은 수질 시계열 API입니다. 시민이나 분석가가 "지금 우리 동네 하천 수질이 평소와 다른가", "물고기 폐사가 난 시점에 용존산소가 떨어졌나" 같은 질문을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소 코드(locCode)·측정소명으로 하천·댐 등 수자원 데이터나 같은 기관의 다른 수질 자료와 이름 매핑으로만 이어 쓴다.
limits: 표준 코드로 다른 기관 데이터와 바로 조인할 수 없고 측정소 이름·코드를 직접 매핑해야 한다. 범위는 부산광역시 관내 하천에 한정되며, 개발계정은 하루 10,000회 호출 제한이 있다.
