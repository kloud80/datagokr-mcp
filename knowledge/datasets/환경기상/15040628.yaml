description_portal: 부산광역시 보건환경연구원에서 운영하는 하천 수질 자동측정망 정보는 현재 부산 관내 주요 하천(8개하천 13개소)에 대하여 실시간 수질을 측정하여, 실시간 시민들에게 제공하고 있습니다.실시간 수질 측정항목으로 총 7개 항목(수온, 수소이온농도, 용존산소, 탁도, 전기전도도, 염분, 총용존고형물질)을 하고 있습니다.5분 데이터 및 1시간 데이터를 생산하며, 홈페이지를 통해 1시간 데이터를 제공하고 있습니다.하천 실시간 모니터링을 통해 변화하는 물환경 적극적으로 파악하고, 물고기 폐사 등 오염사고 사전 예방 및 원인분석에 활용하고 있습니다.
