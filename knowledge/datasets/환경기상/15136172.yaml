summary_user: 국립공원 안의 건축물을 한 동씩 담은 시설 원장으로, 시설물 명칭·부대기능·상대위치·주소·소유자·관리자·시공연도·건물구조와 X·Y 좌표를 전국 범위로 수록한 CSV 파일(약 35만 바이트)이다. 탐방객이나 분석가가 '이 국립공원 안에 화장실·탐방지원센터 같은 편의 건물이 어디에 있고 언제 지어졌는가'를 확인하거나, 공원 시설 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표로 공간 결합하거나 시설물 명칭·국립공원 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 국립공원공단 시설관리시스템(FMS)을 통해 관리되는 국립공원 내 건축물 정보를 포함한 자료로, 주요 관리대상 시설물의 현황을 체계적으로 파악하고 유지관리하기 위한 기초 정보를 제공합니다. 데이터는 건축물 명칭, 국립공원명, 주소, 건축물 용도(사무소, 탐방지원센터, 휴게소, 창고 등), 연면적, 구조, 층수, 준공연도, 소유구분, 관리부서, 사용 여부 등의 항목으로 구성되어 있으며, 시설 자산관리, 보수 계획 수립, 안전 점검, 공공시설 활용도 분석 등에 활용됩니다. 해당 데이터는 공간정보와 연계된 좌표 정보도 포함할 수 있어, 국립공원 내 시설 분포 현황을 지도 기반으로 시각화하거나, 민간 및 공공 시스템 간 연계에도 용이합니다. CSV 포맷으로 제공되어 다양한 행정·기술 시스템에서 활용 가능합니다.
