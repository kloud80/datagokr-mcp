description_portal: 본 데이터는 환경교육사 양성과정을 운영하는 기관의 현황 정보를 국민에게 투명하게 제공하기 위해 구축된 자료입니다.환경교육사 제도는 2015~2016년 시범사업을 거쳐 2017년부터 본격 시행된 국가 환경교육 전문인력 양성 제도로, 환경교육 현장에서 활동할 전문 인력을 체계적으로 양성하기 위해 마련되었습니다. 제도 시행 이후 양성과정 지정·운영 기관이 확대되며, 현재는 총 14개 기관이 전국에서 환경교육사 양성과정을 운영하고 있습니다.본 데이터는 이들 환경교육사 양성기관의 등급, 지정일, 기관 유형, 연락처, 위치 정보, 기관 홈페이지, 기관 소개 등 주요 현황을 한눈에 파악할 수 있도록 제공합니다.이를 통해 환경교육사 자격 취득 희망자뿐 아니라 관련 연구자, 교육기관, 정책 담당자 등이 기관별 특징과 운영 현황을 쉽게 확인할 수 있습니다.
