description_portal: '전라남도 순천시 약수터 현황 데이터는 지역 내에서 **먹는 물 공동시설(약수터)**로 운영되고 있는 지점을 대상으로 수집된 공공환경 데이터입니다. 이 데이터는 주민의 음용수 안전을 보장하고, 지하수의 수질 상태를 파악하기 위한 목적으로 정기적으로 수집 및 갱신됩니다. 데이터는 주로 표 형태의 정량적 자료로 제공되며, 각 약수터에 대한 다양한 항목들이 포함되어 있습니다. 일반적으로 포함되는 주요 항목은 다음과 같습니다:데이터 항목 설명- 약수터 명칭: 해당 시설의 이름이나 별칭- 주소: 행정구역 기준의 정확한 위치 정보 (예: 순천시 가곡동, 송광면 등)- 검사시기: 수질검사가 실시된 연도- 검사기관: 수질검사를 실시한 기관'
