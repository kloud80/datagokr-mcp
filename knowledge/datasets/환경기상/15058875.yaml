summary_user: 경기도 내 건설폐기물 처리업체(수집·운반업, 중간처리업)의 인허가 현황을 사업장 한 곳당 한 건으로 담으며, 사업장명, 처리업 구분, 허용보관량, 인허가일·폐업일, 영업상태, 도로명·지번 주소, 위경도 좌표를 포함한다. 건설사나 분석가가 "우리 시군에서 지금 영업 중인 건설폐기물 중간처리업체는 어디이고, 허용보관량은 얼마인가"를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 사업장명·주소를 이름 매칭하거나 위경도 좌표(REFINE_WGS84_LAT/LOGT)로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군의 건설폐기물 처리업체에 대한 인허가 현황을 포함하고 있으며, 폐기물처리사업계획에 따라 허가받은 사업장의 명칭, 처리업 구분, 환경업무 구분, 허용보관량, 인허가 일자 등 다양한 행정 정보를 제공합니다. 수집·운반업 및 중간처리업으로 분류된 폐기물처리업체의 영업상태, 소재지, 좌표정보(WGS84 위경도, X/Y좌표)까지 포함되어 있어 공간분석이 가능하며, 도로명주소 및 전화번호 등의 사업장 정보도 제공됩니다. 해당 데이터는 지방행정 데이터 개방시스템을 통해 주간 단위로 갱신되며, 건설업 관련 정책 수립, 환경 모니터링, 폐기물 운송 흐름 분석 등 다양한 행정 및 연구 분야에 활용될 수 있습니다. 또한 Open API를 통해 원하는 시군 단위로 데이터 조회가 가능하여 실시간 정보 활용에 유리합니다.
