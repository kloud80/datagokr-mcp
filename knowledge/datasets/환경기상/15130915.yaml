description_portal: 공공데이터 사업장배출시설계폐기물에 대한 내용으로 사업장배출시설계폐기물의 종류별(가연성, 불연성) 발생량 및 처리현황(재활용, 소각, 매립 등) 항목을 톤/년 단위로 제공합니다. 폐기물의 종류에 따른 발생량과 재활용, 소각, 매립 등 처리방법에 따른 처리현황  등에 대한 통계자료는  자원순환정보시스템(https://www.recycling-info.or.kr)에 공개된 생활폐기물 발생 및 처리현황 데이터를 기반으로 작성하였습니다. 해당 자료는  산업 활동에서 발생하는 폐기물의 양과 종류를 체계적으로 수집하고 분석하여 환경 관리 및 정책 수립에 활용되고 있으며 사업장 배출시설별 배출특성, 재활용량, 처리현황 등을 포함합니다.
