summary_user: 충청북도 제천시 관내 사업장폐기물 배출 신고 사업장을 사업장 한 곳씩 담은 원천 목록으로, 상호·지번주소·폐기물 종류(일반·지정·의료 등)·데이터기준일을 담은 CSV 파일(약 72KB)이다. 사업자나 주민이 '제천시 어느 사업장이 지정폐기물이나 의료폐기물 배출을 신고했는가'를 확인하거나, 분석가가 관내 배출 사업장의 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관(제천시) 기준으로만 이어 쓴다.
description_portal: 해당 데이터는 충청북도 제천시 관내 사업장에서 배출되는 폐기물의 종류 및 신고 현황을 정리한 자료입니다. 수록 항목은 상호, 사업장지번주소, 폐기물 종류, 데이터기준일 등이며, 일반폐기물, 지정폐기물, 의료폐기물 등의 배출 유형이 구분되어 포함되어 있습니다. 본 데이터는 폐기물의 효율적 처리와 관리, 행정기관의 인허가 및 환경감시 업무 수행을 위한 기초 자료로 활용되며, 폐기물 발생량 추이 분석, 오염원 분포 파악 및 지역별 폐기물 처리 정책 수립에 기여할 수 있습니다. 또한, 주민 및 관련 기업의 환경정보 접근성 확대와 투명한 행정정보 공개 목적을 함께 지니고 있습니다.해당 데이터의 담당주체는 자원순환과이며, 문의사항이 있으시다면 자원순환과로 문의 주시기 바랍니다.
