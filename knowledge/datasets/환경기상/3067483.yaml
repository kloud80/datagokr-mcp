description_portal: 본 자료는 부산환경공단에서 운영하는 소각처리시설(명지사업소, 해운대사업소)의 대기질 현황 데이터로, 법정기준에 따른 주요 오염물질 배출농도를 일자별로 조회할 수 있도록 구성되어 있습니다. 측정 항목에는 질소산화물(NOx), 황산화물(SOx), 염화수소(HCL), 일산화탄소(CO), 먼지 등이 포함되며, 각 항목은 법정 허용기준과 비교하여 관리됩니다. 또한 사용자는 특정 기간을 선택하여 데이터 조회가 가능하며, 결과를 CSV 파일로 다운로드하여 분석이나 보고서 작성에 활용할 수 있습니다. 이 데이터는 소각처리시설의 환경적 영향을 관리·감독하는 데 중요한 역할을 하며, 대기오염 저감 정책과 시설 운영 개선의 기초 자료로 활용될 수 있습니다.
