summary_user: 기상청 종관기상관측(ASOS) 지점에서 관측한 기온·강수량·기압·습도·일사·일조 같은 기상요소를 관측지점번호 기준의 시간·일 단위 자료로 담으며, 범위는 전국이다. 기후·농업·보험 분석가가 특정 지점의 과거 일별 기온·강수 추이를 확인해 피해 시기나 기후 변화를 따지는 질문에 원천 자료로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 관측지점 이름·번호를 매핑하거나 같은 기상청 관측 자료와 지점 코드로만 이어 쓴다.
description_portal: '지상기상관측(ASOS)이란 지면 부근 및 지상에서의 기상요소와 기상현상에 대한 관측으로 기온, 강수량, 기압, 습도, 일사, 일조 등을  관측합니다.생산주기: 시간, 일보유기간: 1904년 4월(지점별 상이함) ~(참고)ASOS와 AWS 차이구분         ASOS (종관기상관측)               AWS (자동기상관측)설치 위치           주로 주요 도시                         산간·도서 등 촘촘한 지역망운영 주체                 기상청                              기상청·지자체 등 혼합측정 요소 종관기상 전요소(정규 관측)      일부 기상요소(강수, 온도 등)주 목적         예보·기후 통계, 국제공유              국지성 재해 감시, 보조 관측'
