description_portal: 서울특별시 강남구 의류수거함 위치 데이터입니다. 도로명주소, 지번주소, 위도와 경도를 포함하고 있으며,  즉, 이 데이터에는 각 수거함이 설치된 도로명 주소 그와 함께 실제 대지의 지번 주소가 모두 기록되어 있습니다. 또한, 수거함의 구체적인 위치를 지도상에서 정확하게 찾을 수 있도록, 각 지점의 위도(latitude)와 경도(longitude) 값도 함께 제공됩니다.이 밖에도 의류수거함 위치 데이터와 관련된 기타 문의사항이나 자료 사용에 관한 구체적인 질문이 있을 경우, 강남구청 내에서 자원순환과라로(02-3423-5968 문의해주시면 보다 자세하고 친절한 안내를 받으실 수 있습니다.
