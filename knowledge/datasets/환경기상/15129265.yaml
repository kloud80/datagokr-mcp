description_portal: 이 데이터는 지역 내 토양환경의 안전성과 오염도를 확인하기 위해 수행된 토양오염 실태조사의 분석 결과를 정리한 자료입니다. 조사지역명, 주소, 토지지목, 면적, 시료번호, 채취 깊이, 중금속 및 유기화합물 오염도(mg/kg), 다이옥신(pg-TEQ/g), 수소이온농도(pH) 등의 항목으로 구성되어 있으며, 주유소·공업지역·공공부지 등 다양한 용도의 토지를 대상으로 조사하였습니다. 오염도 항목에는 카드뮴, 납, 구리, 아연, 니켈, 비소, 수은 등의 중금속과 TPH, 톨루엔, 벤조(a)피렌 등 휘발성 유기물질까지 포함되어 있어 환경 위해도 평가와 토양 정화 우선순위 설정에 활용이 가능합니다.
