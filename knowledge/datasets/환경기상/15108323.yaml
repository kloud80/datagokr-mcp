description_portal: '대구 상수도사업본부에서 관리하고 있는 상수도 이용자(수용가)의 고객번호 일부(생성연도 4자리)와 계량기 구분, 상수도 업종 및 구/동 코드와 건물 주용도를 포함하고 있는 수용가 기본정보 데이터(데이터 기준일 : 2022.09.01)※ 2022년 공공데이터 기업 매칭 지원사업 결과물(사업명 : 공간정보데이터 융·복합을 통한 대구 수용가 데이터 품질 개선)  참고로 대구광역시 상수도사업본부의 수용가정보시스템은 시민들에게 안정적이고 체계적인 수돗물 공급 서비스를 제공하기 위해 도입된 정보 관리 시스템입니다. 이 시스템은 상수도를 이용하는 모든 수용가의 기본정보를 전산화하여 관리하며, 이를 통해 요금 부과, 검침, 민원 처리, 통계 분석 등 다양한 업무가 효율적으로 이루어질 수 있도록 지원합니다.'
