summary_user: '부산광역시 음식물폐기물 처리시설을 시설 한 곳당 한 행으로 담으며, 시군구명·시설명·소재지·위도·경도·일별 시설용량(톤)·처리방법을 포함한 작은 CSV 파일(704바이트)입니다. 주민이나 분석가가 부산의 음식물쓰레기가 어느 시설에서 얼마의 용량으로, 어떤 방식(예: 혐기성소화)으로 처리되는지 확인할 때 쓴다. 전역 조인 키는 없어 시군구명이나 시설명으로 다른 자료와 맞추거나, 위도·경도로 지도·공간 데이터에 겹쳐 쓴다.'
description_portal: '부산광역시 생활계(공동주택, 단독주택, 소규모음식점)에서 배출되는 음식물폐기물처리시설 현황(시군구명, 시설명, 소재지, 시설량, 처리방법, 위도, 경도 등)을 제공합니다.1. 수영하수병합처리시설 : 동래구 안락동 소재 일 120톤 시설용량(습식 혐기성소화방식)2. 생곡음식물자원화시설 : 강서구 생곡동 소재 일 200톤 시설용량(건식 혐기성소화방식)3.유기성바이오가스화시설 : 강서구 생곡동 소재 일 250톤 시설용량(건설공사 진행중), 27년 가동 예정'
