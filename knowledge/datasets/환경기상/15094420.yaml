summary_user: 충청북도 단양군에서 음식물류폐기물을 많이 배출하는 사업장의 이름, 소재지 주소, 전화번호를 사업장 한 곳당 한 행으로 담은 명단이며, 범위는 단양군 한 곳이고 파일 크기는 1291바이트의 작은 CSV이다. 단양군 주민이나 분석가가 관내 어느 음식점·사업장이 음식물류폐기물 다량배출 관리 대상인지, 그 위치와 연락처가 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업장명이나 주소를 맞춰 보거나 같은 단양군 자료끼리만 연결할 수 있다.
description_portal: 충청북도 단양군의 음식물류폐기물 다량배출사업장 현황을 정리한 데이터입니다. 사업장명, 소재지주소, 전화번호, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 음식물류폐기물 다량배출사업장 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 17일입니다. 담당부서는 단양군청 농림환경국 환경과이며 문의주시면 최신의 충청북도 단양군 음식물류폐기물 다량배출사업장 현황을 열람하실 수 있게 도와드립니다.
