description_portal: 수도권매립지는 인천광역시 서구 오류동ㆍ왕길동ㆍ백석동ㆍ경서동 및 검암동, 경기도 김포시 양촌면에 위치한 광역폐기물처리시설입니다.수도권매립지관리공사는 선진화된 위생매립시스템과 철저한 방역ㆍ탈취 등 체계적이고 위생적인 환경관리로 지속가능한 친환경 매립장을 운영하고 있습니다.매립 및 복토, 가스 포집, 침출수 차집, 위생 관리 순서로 매립이 진행되고 있으며, 음페수와 침출수의 병합처리에 성공함으로써 해양오염 방지에 기여하고, 최적의 침출수 처리기술을 개발해 전국 매립지에 확대 보급중입니다.본 공공데이터는 매립장별 부지 면적과 (매립이 완료된 경우) 매립장의 매립량을 제공하고 있습니다.
