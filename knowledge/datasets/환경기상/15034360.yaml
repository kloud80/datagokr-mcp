summary_user: 서울 광진구에서 음식물류 폐기물을 다량으로 배출해 감량·재활용 의무가 있는 사업장(일반·휴게 음식점, 집단급식소, 관광숙박시설 등)의 명단을 업소 한 곳당 한 행으로 담은 파일이며, 업소명·구분·주소·연락처로 구성된다(2026년 4월 기준, 약 9.8KB CSV). 주민이나 사업자가 '우리 동네 어느 음식점·급식소가 음식물폐기물 다량배출사업장으로 관리되는가'를 확인하거나, 분석가가 구 안의 다량배출 업소 분포를 주소 기준으로 파악하는 데 쓴다. 전역 조인 키는 없어 주소를 지오코딩하거나 업소명으로 맞춰 다른 구의 같은 현황 파일이나 음식점 인허가 자료와 이어 쓴다.
description_portal: 서울특별시 광진구 다량배출 사업장 현황(2026년 4월 기준)입니다.다량배출사업장은 음식물류 폐기물이 다량으로 발생하는 업소로 지자체에 신고 계획 제출 후 자가처리 또는 위탁처리 등으로 감량 재활용이 의무화되는 사업장을 말합니다.다량배출사업장에 포함되는 일반 및 휴게 음식점, 집단급식소, 관광숙박시설 등의 명단이 포함된 자료입니다.현황은 사업장명, 사업장 구분, 사업장 주소, 연락처 등의 데이터로 구성되어 있으며 개인정보가 포함된 휴대폰 번호 등과 위탁처리 및 자가처리 여부 등은 포함되지 않았습니다.
