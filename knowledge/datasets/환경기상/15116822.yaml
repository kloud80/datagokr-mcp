description_portal: 인천광역시 공해차량 운행제한 단속시스템 단속정보 공공데이터는 대기질 개선을 위한 중요한 자료입니다. 이 시스템은 미세먼지 계절관리제 및 고농도 미세먼지 비상저감조치 발령 시, 수도권 지역 내 배출가스 5등급 차량의 운행을 제한하고 이를 단속합니다.제공되는 공공데이터는 단속 지점명, 단속 일시, 위반 차량 번호, 위반 내역(위반/면제), 면제 사유(저공해 조치, 긴급차량 등), 카메라 번호 등으로 구성되어 있습니다. 이 데이터는 인천시의 공해차량 단속 현황과 정책 효과를 객관적으로 분석하는 데 활용될 수 있습니다
