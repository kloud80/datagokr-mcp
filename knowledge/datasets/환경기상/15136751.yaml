description_portal: 해양환경공단이 수집·관리하는 해양쓰레기 월간 대응정보 데이터를 제공합니다. 본 데이터는 월 단위로 정리된 해양쓰레기 수거 및 처리 현황, 대응 인력 및 장비 투입 내역, 지역별 대응 실적, 기상 및 해양상황 등과 관련된 정보를 포함합니다. 수거량, 처리방식, 대응시기 등의 정보를 바탕으로 계절별 해양쓰레기 발생 특성 분석과 대응계획 수립에 활용됩니다. 데이터는 지역, 시기, 대응유형 등으로 구분되며, 공공기관, 지자체, 연구기관 등에서 정책 수립, 사업 성과관리, 해양환경 개선 평가 등의 목적으로 활용됩니다. 실무 대응력 향상과 현장 중심의 관리체계 마련에 기초자료로 제공됩니다.
