summary_user: 수도권매립지에 폐기물을 반입할 수 있는 시간을 광역지자체와 폐기물 종류별로 시작·종료 시간으로 정리한 소규모 파일(csv, 약 11KB)이다. 수집운반 사업자나 지자체 담당자가 '우리 시·도의 이 폐기물은 매립지에 몇 시부터 몇 시까지 반입할 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 광역지자체명이나 폐기물명을 이름으로 맞춰 잇는 방식으로만 연결한다.
description_portal: '수도권매립지 폐기물 반입허용시간 정보입니다.개방항목 : 광역지자체명, 폐기물명, 시작시간, 종료시간의 항목을 제공합니다. 수도권매립지관리공사는 폐기물 반입을 체계적으로 관리하기 위해 폐기물의 종류와 배출 지자체에 따라 반입허용 시간을 별도로 지정하고 있습니다. 각 광역지자체별로 폐기물명, 시작시간, 종료시간 등이 명확히 안내되고 있으며, 일반적으로 평일기준 오전 6시부터 오후4시까지가 대표적인 반입허용시간으로 운영되고 있습니다. 특별한 상황(공휴일 임시공휴일 등) 에도 폐기물 적체를 방지하기 위해 동일한 시간대에 특별 반입이 이루어질 수 있습니다. 반입 허용시간은 폐기물 종류에 따라 다를 수 있으므로, 실제 반입 전 사전 문의나 협의가 이루어져야 합니다.'
