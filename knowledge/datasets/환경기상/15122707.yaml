summary_user: 계절관리제·비상저감조치에 따른 노후차 운행제한의 단속지점·단속차선·단속지역·상시운행제한 관리지역 정보를 담은 파일 자료로, 차수년월과 관리 시도·시군구 단위로 정리돼 있고 범위는 전국입니다. 운전자나 물류 사업자가 '겨울철 계절관리제 기간에 내 지역 어디서 노후차 단속이 이뤄지는가'를 확인하거나, 분석가가 지역별 운행제한 관리 현황을 파악하는 데 쓴다. 전역 조인 키는 없어 관리시도명·관리시군구코드(명)를 행정구역 이름·코드로 맞춰 대기질 실시간 자료 등 다른 대기 데이터와 연결한다.
description_portal: 본 자료는 미세먼지 저감 및 관리에 관한 특별법 제18조(고농도 미세먼지 비상저감조치) 및 제21조(계절적 요인 등으로 인한 집중관리 등) 등을 근거로 하여 시행하는 노후차 운행제한에 관한 자료입니다.운행제한 제도는 크게 겨울철(12월 ~ 3월)에 시행하는 계절관리제 운행제한 단속과 미세먼지가 고농도로 발생하는 날에 시행되는 비상저감조치 운행제한이 있으며, 해당 제도에 대한 운행제한 단속지점 정보 및 단속차선정보, 단속지역, 상시운행제한 관리지역 등에 대한 데이터를 포함하고 있습니다.
