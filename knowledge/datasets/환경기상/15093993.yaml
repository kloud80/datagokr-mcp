summary_user: 광역·지방 상수도가 해수를 원수로 취수하는 지점의 법정 수질검사 결과를 검사년도·분기별, 취수장·측정지점 단위로 담은 파일이며, 수소이온농도·총유기탄소·총대장균군·분원성대장균군·노말헥산추출물질 등 항목을 기록한다(전국 범위, 측정지점 주소 단위, 파일 크기 910바이트의 소량 데이터). 해수 취수원을 쓰는 지역의 원수 위생 상태가 분기마다 어떠했는지, 대장균군이나 유지류가 검출된 취수장이 있는지 확인하려는 지자체 담당자·연구자·주민이 쓴다. 전역 조인 키가 없어 다른 수질측정망·정수장 데이터와는 취수장명·정수장명·측정지점주소 같은 이름과 주소를 맞춰 연결해야 한다.
description_portal: '본 데이터는 광역과 지방 상수도에서 사용하는 해수 원수의 수질 검사 결과가 분기별로 표기된 데이터입니다. 검사 항목은 상수도법 기준을 따르며 먹는 물 안전성을 위해 시행된 결과입니다. 이를 통해 위생 상태와 공급 안전성을 확인하고 대책을 마련할 수 있습니다. 본 자료는 해수 취수원을 사용하는 지역의 취약성을 보완하고 안전한 음용수 제공을 위한 정책 수립과 신뢰 확보에 활용됩니다.제공항목 : 검사년도,검사분기,지역,취수장명,측정지점주소,채수지점,수원,수소이온농도,총대장균군,대장균_분원성대장균군,노말헥산추출물질(동물성유지류)함유량'
