description_portal: 최근 유해 대기오염물질에 대한 시민들의 관심과 우려가 높아짐에 따라, 부천시 관내 대기배출사업장의 운영 현황을 공개합니다.이 자료는 「대기환경보전법」제23조에 따라 부천시에 신고 또는 허가된 대기환경 오염물질 배출사업장 현황에 대한 데이터로 사업장명, 대표 업종, 종별구분, 소재지 주소 등의 항목을 제공합니다. 이 자료를 통해 대기오염물질 배출의 주요 원인을 체계적으로 파악하고 지역 내 오염원 관리의 투명성을 높일 수 있습니다.앞으로도 부천시에서는 유해물질 배출 사업장에 대한 관리과 감독을 더욱 철저히 하겠습니다.
