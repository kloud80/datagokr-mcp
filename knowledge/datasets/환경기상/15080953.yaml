summary_user: 부천시에 신고 또는 허가된 대기오염물질 배출사업장을 한 행에 한 곳씩 담은 원장 파일로, 사업장명·지번 소재지·도로명 소재지·대표업종·종별 구분(종)을 담는다. 부천 시민이나 분석가가 "우리 동네 근처에 어떤 업종의 대기배출사업장이 몇 종 규모로 있는가"를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 좌표 같은 전역 조인 키가 없어서, 다른 데이터와는 사업장명이나 주소를 문자열로 맞추거나 주소를 지오코딩해 이어 쓴다.
limits: 부천시 관내 사업장만 담으며 사업자번호·좌표가 없어 다른 기관 데이터와 키로 바로 조인할 수 없다. 배출량이나 측정값이 아닌 사업장 현황 목록이므로 실제 오염 정도를 판단하는 데는 쓸 수 없다.
