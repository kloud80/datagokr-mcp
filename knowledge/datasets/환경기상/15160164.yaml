description_portal: 미세먼지 포털에서 운영하는 IoT 기반 대기환경 측정기의 실시간 측정 데이터를 제공하는 공공데이터입니다. 측정일시, 측정기 식별정보, 측정항목별 센서 측정값 등의 정보를 포함하고 있으며, 이산화탄소(CO₂), 습도, 미세먼지(PM10), 초미세먼지(PM2.5) 등 생활환경과 밀접한 대기환경 정보를 제공합니다. 본 데이터는 생활권 대기질 모니터링, 미세먼지 대응 정책 수립, 환경보건 증진, 취약계층 건강 보호 및 국민의 알 권리 보장을 위한 기초자료로 활용될 수 있습니다. 또한 연구·학술 분야 분석, 민간 환경정보 서비스 개발, 스마트시티 및 데이터 기반 행정 구현을 지원하는 공공데이터입니다.
