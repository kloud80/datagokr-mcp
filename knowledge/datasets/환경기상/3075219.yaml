description_portal: '- 국민환경보건 기초조사는 환경보건법 제14조에 근거하여 2009년부터 3년마다 추진되는 국가 단위 인체 바이오모니터링 사업으로 국민 체내 환경유해인자 노출수준과 영향요인을 파악하여 환경보건정책 수립을 위한 기초자료를 제공함으로써 국민건강 보호에 기여하고자 함- 국민환경보건 기초조사 결과는 국가승인통계(106027호)로 공표되고 있음- 표본 추출된 조사구 및 조사기관을 현지조사원이 직접 방문하여 참가에 동의한 응답자들 대상으로 생체시료(혈액, 소변) 수집과 조사표를 작성하는 면접 타계식 조사로 진행됨- 공개된 자료는 제1기(2009-2011), 제2기(2012-2014), 제3기(2015-2017) 국민환경보건 기초조사 결과로 연령대별 혈중 및 요중 환경유해물질(중금속, VOCs, PAHs 등) 농도를 나타냄'
