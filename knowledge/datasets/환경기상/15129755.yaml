summary_user: 광산구 도심 거리·공원·버스정류장 등에 설치된 가로 쓰레기통을 한 개씩 행으로 담은 건별 목록으로, 관리번호·도로명·행정동·설치주소·세부위치와 위도·경도, 수거하는 쓰레기 종류와 쓰레기통 종류, 관리기관 연락처가 들어 있다. 주민이나 방문객이 '이 근처 어디에 쓰레기통이 있고 재활용품도 버릴 수 있나'를 찾을 때, 구청·분석가가 행정동별 설치 밀도나 빈 구역을 점검할 때 쓴다. 전역 조인 키는 없어서 위도·경도로 지도에 올리거나 행정동 이름으로 다른 지자체·생활폐기물 배출 지점 파일과 맞춰 이어 쓴다.
description_portal: 광주광역시 광산구 가로 쓰레기통은 주민들과 방문객들이 쾌적하고 깨끗한 환경에서 생활할 수 있도록 도심 주요 지역에 설치된 공공시설물입니다. 주요 거리, 공원, 버스 정류장, 상가 밀집 지역 등 사람이 많이 모이는 장소에 전략적으로 배치되어 있어 시민들이 생활 속에서 발생하는 각종 쓰레기를 손쉽게 버릴 수 있도록 편리함을 제공합니다. 이 가로 쓰레기통은 청결한 도시미관 유지뿐만 아니라, 환경 보호와 자원 재활용 촉진에도 큰 역할을 하고 있습니다. 광산구에서는 정기적인 점검과 청소를 통해 쓰레기통 내부를 항상 깨끗하게 관리하며, 악취 발생과 주변 오염을 방지하기 위한 노력을 지속하고 있습니다. 또한 시민들의 환경 의식 고취와 쾌적한 거리 조성을 위해 다양한 캠페인과 함께 운영되고 있으며, 광산구를 방문하는 모든 이들에게 쾌적한 도시 환경을 제공하는 데 중요한 역할을 담당하고 있습니다.
