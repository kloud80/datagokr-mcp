summary_user: 한국수자원공사가 원수·소규모급수시설·해수를 대상으로 실시한 법정 수질검사 결과를 측정지점·채수일자별로 담은 건별 파일로, 검사년도·반기와 함께 수소이온농도, 총유기탄소, 총대장균군, 대장균(분원성대장균군), 노말헥산추출물질 측정값을 포함한다. 지자체·연구기관이 특정 취수장이나 측정지점의 원수가 법정 기준에 비춰 위생적으로 적합한지, 반기별로 수질이 어떻게 변하는지 확인하는 데 쓴다. 전역 조인 키는 없어서 취수장명·측정지점명·측정지점주소 같은 이름이나 주소를 매핑해 수질측정망·댐·하천 수자원 자료와 연결한다.
description_portal: 본 자료는 원수, 소규모급수시설, 해수의 수질 상태를 항목별로 분석하여 위생적 적합성을 평가한 결과를 포함하며, 항목은 법령에서 정한 기준에 따릅니다. 측정 결과는 수질기준 적합 여부 판단과 수질개선 대책 마련에 활용될 수 있으며, 지자체, 연구기관, 환경 관련 산업에서 기초 자료로 유용합니다. 데이터는 측정일자, 검사대상, 항목명, 단위, 측정값, 기준값 등의 정보로 구성되어 있어 수질변화 추세 분석, 환경영향 평가, 안전한 상수원 확보 계획 수립에 기여합니다. 이를 통해 국민이 안심하고 사용할 수 있는 먹는물 관리와 수자원 보호를 지원합니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData
