summary_user: 환경영향평가 대상 개발사업별로 공사 시 배출량(t CO₂eq)과 운영 시 연간 배출량(t CO₂eq/년)을 이산화탄소·메탄·아산화질소·기타 온실가스로 나눠 담은 사업 단위 파일이며, 범위는 전국이고 공간 좌표는 없다. 분석가나 지자체 담당자가 '이 개발사업이 공사 중과 운영 후 각각 온실가스를 얼마나 배출할 것으로 평가됐는가'를 확인하는 데 쓴다. 사업코드(BSNS_CD)가 있어 같은 기관의 환경영향평가 협의 현황·사업구역·다른 항목별 평가정보와 사업 단위로 맞춰 볼 수 있지만, 실측상 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다.
limits: 사업코드 외에 전역 조인 키가 없어 외부 데이터와 바로 결합되지 않으며, 행정구역·좌표 정보가 없어 지역별 집계나 지도 표시는 이 파일만으로 할 수 없다. 갱신은 명세상 수시이며, 평가가 이뤄질 때 생성된 뒤 바뀌지 않는 이벤트성 데이터로 다룬다.
