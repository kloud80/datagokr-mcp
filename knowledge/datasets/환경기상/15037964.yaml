summary_user: "부산광역시 부산진구 관내에서 실내공기질 관리 대상인 다중이용시설을 시설 한 곳당 한 행으로 담은 목록 파일(csv, 약 28KB)로, 대상시설 구분·시설명·소재지·위도·경도를 포함한다. 주민이 '우리 동네에서 실내공기질 관리 대상인 시설은 어디인가'를 확인하거나, 분석가가 부산진구 내 관리 대상 시설의 유형별 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없으므로 시설명·소재지 주소로 맞추거나 위도·경도 좌표로 다른 공간 데이터(예: 대기질 측정소 위치)와 겹쳐 본다."
description_portal: 부산광역시 부산진구 관내 실내공기질 관리 시설(불특정다수가 이용하는 시설)에대한 정보(대상시설 구분,시설명,위도, 경도)를 제공합니다.우리 구 관내의 실내공기질 관리 대상 시설에 대한 정보를 제공하는 데이터로, 불특정 다수가 이용하는 주요 시설의 환경 관리 현황을 체계적으로 파악할 수 있도록 구성된 자료입니다. 이 데이터에는 각 시설이 어떤 유형에 해당하는지를 나타내는 대상시설 구분, 시설을 식별할 수 있는 시설명, 그리고 시설의 정확한 위치를 지도 기반으로 확인할 수 있도록 제공되는 위도와 경도 좌표가 포함되어 있습니다. 이러한 정보는 실내공기질 관리가 필요한 시설의 분포와 규모를 파악하는 데 유용하며, 행정기관이 정기 점검 계획을 수립하거나 실내 환경 개선 정책을 추진할 때 중요한 기초자료로 활용됩니다. 또한 주민들은 이를 통해 주변에 위치한 공기질 관리 대상 시설을 확인함으로써 보다 안전한 실내 환경 이용에 도움이 되는 정보를 얻을 수 있습니다.
