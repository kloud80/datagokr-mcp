description_portal: '(전구) 전지구 예보모델(GDAPS)은 전지구 날씨 예측, 동네예보, 중기예보 등을 목적으로 영국 통합모델(UM)을 기반 구축된 수치예보시스템입니다.6시간 주기 순환예측에 필요한 각종 배경장을 생산하기 위한 일 4회의 15시간 예측을 수행하며, 일 1회 06UTC에는 해수면온도, 해빙자료 및 동서평균 오존량을 갱신하기 위한 배경장 갱신과정을 별도로 수행합니다. 현재 기상청에서는 GDAPS 예측자료를 GRIB2형식과 이미지형태로 생산, 제공하고 있습니다.(국지) 국지예보모델(LDAPS,)은 3시간 간격으로 전지구 예보모델로부터 경계장을 제공받아 1일 4회 예측을 수행하는 수치예보 시스템입니다.생산주기: 일 4회(00, 06, 12, 18UTC)보유기간: (전구) 2011년 5월 ~ 현재(지역) 2010년 3월 ~ 현재(국지) 2012년 5월 ~ 현재'
