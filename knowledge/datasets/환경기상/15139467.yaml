summary_user: 기상청 수치예보모델(전지구 GDAPS·지역·국지 LDAPS)의 예측 결과를 일 4회(00·06·12·18UTC) 생산 주기로 담는 외부 API로, 범위는 전국이며 행정구역 단위가 아닌 모델 격자 기반 비공간 자료다. 분석가나 사업자가 '특정 시각 모델이 예측한 기온·바람·강수 같은 기상장이 어떻게 나왔는가'를 확인하거나 자체 예측·분석의 입력 자료로 쓴다. 실측 필드에서 전역 조인 키는 확인되지 않아, 다른 기상 예보·관측 데이터와는 예보구역·격자 좌표나 같은 기관 코드 매핑으로만 연결한다.
