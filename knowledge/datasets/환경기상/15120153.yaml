summary_user: 수도권매립지 주변 대기환경통합모니터링 측정지점별로 권역·지점명, 황화수소·암모니아·휘발성유기화합물(VOC) 측정 여부와 항목별 농도 기준값, 사용·삭제 여부를 담은 기준 정보 파일입니다(CSV 약 1KB 규모의 소규모 목록). 매립지 인근 주민이나 분석가가 "이 측정지점은 어떤 악취·유해물질을 재고, 기준 농도는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 같은 기관의 대기환경통합모니터링 측정값 데이터와 측정지점명·권역지점명을 이름으로 맞춰 이어 쓴다.
description_portal: '수도권매립지관리공사는 환경관리 및 환경 개선 등을 위해 비산먼지 저감 및 살균, 방역 작업 등을 수행하고 있습니다.환경 관리 작업을 위해 대기환경정보를 관리하기 위해 운영 중인 대기환경통합모니터링시스템 관련 데이터입니다.해당 데이터는 수도권매립지 주변 측정지점별 휘발성유기화합물VOC, 암모니아 NH3, 황화수소 H2S 측정 기준 농도 기준 값 및 측정 여부 정보 제공를 제공합니다.* 제공항목 : 권역지점명, 측정지점명,H2S_측정여부,NH3_측정여부,VOC_측정여부,H2S_농도기준 NH3_농도기준,VOC_농도기준,사용여부, 삭제여부 에 대한 항목을 제공합니다.'
