summary_user: 경기도 내 음식물류 폐기물 다량배출사업장을 업소별로 담은 목록입니다. 업소명·주소·좌표·사업자등록번호·업종 구분·급식 인원·면적과 함께 배출량, 자체 처리량, 재활용 계획량(자체·위탁)을 담습니다. 지자체 담당자나 분석가가 "우리 시군에서 음식물 폐기물을 많이 내는 사업장은 어디이고, 배출량 중 얼마를 자체 처리하거나 위탁 재활용할 계획인가"를 확인하는 데 쓰고, 다른 데이터와는 실측상 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 업소명·주소 매칭으로 경기도의 다른 데이터와 잇습니다.
description_portal: 경기도 내 음식물류 폐기물 다량배출사업장 현황입니다.※ 음식물류 폐기물 다량배출사업장 관리 부서와 음식점 등에 대한 인허가 부서가 상이하여, 폐업 사업장이 일부 포함되어 있을 수 있습니다.이 데이터는 대한민국 내 음식물폐기물을 다량 배출하는 사업장(업소)의 현황을 담은 자료입니다. 주요 컬럼으로는 업소명, 주소, 사업자등록번호, 업종, 배출량(톤/월) 등이 포함되어 있으며, 전국의 다중이용시설 및 사업장에 대한 월별 음식물폐기물 배출 실태를 파악할 수 있습니다. 예를 들어 서울시 소재 특정 음식점이 매월 얼마나 많은 음식물 쓰레기를 배출하는지 확인할 수 있으며, 이를 바탕으로 폐기물 감량 정책 수립, 지역별 배출 패턴 분석, 환경 규제 이행 점검 등의 목적으로 활용할 수 있습니다. 배출량 수치는 계절·운영형태 등에 따라 변동할 수 있으므로, 분석 시에는 최신화 여부를 확인하는 것이 좋습니다. 법적 근거로는 ‘폐기물관리법’에 따른 음식물폐기물 관리 규정이 있으며, 관련 지자체의 환경부 또는 지방환경청이 수집·관리한 공공 자료입니다.
