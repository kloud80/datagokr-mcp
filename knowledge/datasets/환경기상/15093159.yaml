summary_user: 한국환경공단 층간소음 이웃사이센터에 접수된 민원 가운데 2차 현장진단 대상 건을 신청자 주거형태(아파트형·다세대·연립주택·주상복합·기타)별로 센 전국 단위 집계표로, 382바이트 크기의 작은 CSV 파일입니다. 층간소음 정책 담당자나 연구자가 "심화 진단까지 가는 층간소음 민원이 어떤 주거형태에서 많이 나오는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주거형태 이름이나 구분 항목을 직접 맞춰 붙여야 하며, 같은 기관의 층간소음 통계 파일과 나란히 비교하는 용도에 맞다.
limits: 전국 단위 집계만 있고 지역별 분포나 개별 민원 건은 담지 않는다. 표준 코드나 공통 키가 없어 다른 데이터와 자동 결합이 어렵다.
