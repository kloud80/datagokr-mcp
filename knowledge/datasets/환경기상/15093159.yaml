description_portal: 이 테이블은 한국환경공단 층간소음 이웃사이센터를 통해 접수된 민원 중, 2차 현장진단 대상 건에 대해 신청자의 주거형태를 기준으로 정리한 통계 자료입니다. 2차 현장진단은 초기 상담 및 1차 대응 이후에도 문제가 지속되거나 추가 조사가 필요한 경우 진행되는 절차로, 이 테이블은 그러한 심화 진단 요청 사례 중 실제로 각 주거 유형에서 얼마나 많은 접수가 이루어졌는지를 보여줍니다.분류된 주거형태는 ‘아파트형’, ‘다세대’, ‘연립주택’, ‘주상복합’, ‘기타’로 구성되어 있으며, 이는 신청자의 주거 공간의 구조적 특성이나 건축 방식 등을 기준으로 분류된 항목입니다. 각 항목은 실제 접수 시 신청자가 기재한 주택 유형을 바탕으로 수집되며, ‘기타’ 항목은 명확한 분류가 어려운 사례나 복합 유형, 혹은 선택 항목 외의 응답을 포함합니다.
