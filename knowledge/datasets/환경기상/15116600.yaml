description_portal: 해당 데이터는 경기도 가평군 관내 산사태 취약지역에 대한 현황을 수록한 자료로, 산림청 등 관련 기관에서 재해 예방을 위해 지정·관리하는 위험지역 정보를 포함하고 있습니다. 데이터 항목에는 연번, 시도명, 시군구명, 읍면동명, 리명, 상세주소, 위도, 경도, 편입면적, 취약지역유형(주거지, 도로변 등), 등급명, 지정여부, 지정일자, 데이터 기준일자 등이 포함되어 있습니다. 산사태 취약지역이란 집중호우, 태풍, 지반 약화 등으로 인해 산사태 발생 가능성이 높아 인명 및 재산 피해 우려가 있는 지역을 말하며, 법적 근거에 따라 정기적으로 조사 및 지정이 이뤄집니다. 본 자료는 재해 예방 대책 수립, 산림재해 통제, 주민 대피계획 마련 등 재난 관리 업무에 중요한 기초자료로 활용됩니다.
