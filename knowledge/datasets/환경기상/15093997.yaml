summary_user: 한국수자원공사가 소규모 표류수를 원수로 쓰는 정수장·취수장의 법정 수질검사 결과를 채수일자·측정지점별 건으로 담으며, 카드뮴·비소·시안·수은·납·크롬·유기인·PCB·음이온 계면활성제 등 항목 측정값이 들어 있고 포털 설명상 2024년 5월~2025년 6월 검사분이다. 지역 주민이나 정수장 운영 담당자가 '우리 지역 소규모 취수원의 원수에서 중금속이나 유해물질이 검출됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 측정지점주소나 취수장명·수도사업자 이름을 매칭해 하천 수질측정망·댐 수질 자료 같은 물 관련 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국수자원공사에서 소규모 표류수를 원수로 사용하는 정수장의 법정 수질검사 결과를 제공하며, 원수 수질의 적합성을 확인하기 위한 목적입니다. 자료에는 시설명, 권역, 검사일자, 수질 항목, 기준값, 측정값, 초과 여부 등이 포함됩니다. 본 자료는 2024년 5월부터 2025년 6월까지의 검사 결과를 포함하고 있으며, 수질 평가, 정수장 운영관리, 환경위생 점검 등에 활용할 수 있습니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData
