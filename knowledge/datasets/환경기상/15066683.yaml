summary_user: 구례군에 사업장폐기물 배출자로 신고한 사업장의 업체명·사업장 도로명주소와 폐기물 구분·종류, 위탁 처리업소명, 처리방법, 신고기준년도를 사업장 단위로 담은 시군구 범위의 파일 데이터입니다. 폐기물 처리업자나 분석가가 '구례군에서 어떤 사업장이 어떤 폐기물을 배출하고 어느 처리업소에 어떤 방법으로 맡기는가'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 지자체의 배출자·처리업 허가 원장이나 사업자 정보와 이어 쓰고, 도로명주소로 위치 기반 자료와 맞춘다.
description_portal: '"사업장폐기물배출자 신고현황" 공공데이터는 구례 지역 내에서 사업장이 폐기물을 배출하는 것에 관한 정보를 제공합니다. 이 데이터는 주로 사업장의 명칭, 업종, 위치, 폐기물 종류 및 양, 배출 일자 등을 포함합니다. 이를 통해 지역의 폐기물 관리 상태를 파악하고, 환경 보호 및 재활용 정책에 대한 효율적인 모니터링 및 관리가 가능합니다. 또한, 해당 데이터는 폐기물 관리에 관련된 규제 및 정책 수립에도 활용됩니다.'
