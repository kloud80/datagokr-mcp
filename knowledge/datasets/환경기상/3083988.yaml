summary_user: 광주광역시 1~3종 사업장의 대기오염 배출량을 업종별로 모은 집계표로, 업소수·기준연도·오염물질(먼지·질소산화물·황산화물 등)별 총가동시간과 연간 총배출량을 담으며 포털 설명상 2024년 기준입니다. 지역 환경 분석가나 주민이 '광주에서 어떤 업종의 사업장이 먼지나 질소산화물을 얼마나 배출하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 배출량·대기질 데이터와는 업종명이나 오염물질명을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
