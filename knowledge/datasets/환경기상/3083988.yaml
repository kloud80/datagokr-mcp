description_portal: 광주광역시 대기오염 배출량 현황을 업종별로 정리한 자료로, 연번, 업종, 업소수, 기준연도, 대상항목, 총가동시간, 총연배출량, 단위로 구성되어 있습니다. 1~3종 사업장을 대상으로 먼지, 질소산화물, 황산화물 등의 항목별 배출량이 제공되며, 각 오염물질에 대한 총가동시간과 연간 배출량 수치를 확인하실 수 있습니다. 예시로 먼지 배출량 79,062kg/년, 질소산화물 68,330kg/년, 황산화물 8,671kg/년 등이 포함되어 있으며, 2024년 기준 업종별 대기오염 물질 배출 현황을 표 형식으로 정리한 자료입니다.
