summary_user: 서울시 내 TMS(원격감시체계) 부착 사업장의 대기오염물질(질소산화물·황산화물·먼지) 배출량을 하루 단위로 담은 파일 자료다. 행은 날짜(년월일), 열은 자원회수시설·물재생센터·열병합발전소·대형병원 등 사업장 25곳이다. 분석가나 시민이 '마포자원회수시설이나 목동열병합발전소의 배출량이 겨울철에 얼마나 늘었나'처럼 시설별·계절별 배출 추세를 확인하는 데 쓰며, 전역 조인 키는 없어 날짜로 대기질 측정 자료와 맞추거나 사업장 이름을 매핑해 다른 배출원 자료와 잇는다.
limits: 실측 컬럼에서 사업장 코드 같은 전역 조인 키를 찾지 못해, 다른 데이터와는 이름 매핑이나 같은 기관 코드로만 연결된다. 사업장이 열 이름으로 들어 있는 가로형 구조이고 필드 목록에는 오염물질 구분 열이 보이지 않으므로, 수치가 어느 물질을 뜻하는지는 파일 안에서 확인한 뒤 해석해야 한다.
