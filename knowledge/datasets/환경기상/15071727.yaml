summary_user: 서울특별시 보건환경연구원 대기오염측정망에서 자치구 측정소별로 측정한 1시간 평균 대기오염 값을 측정일시·측정소·측정항목 단위로 담으며, 측정기 상태와 국가·지자체 기준 초과 여부를 함께 표시한다. 시민이나 분석가가 '지금 우리 자치구 측정소의 미세먼지·오존 농도가 기준을 넘었는가'처럼 서울 지역의 시간별 대기질과 기준 초과 여부를 확인하는 데 쓴다. 전역 조인 키가 없어 측정소코드(MSRSTN_CD)나 항목코드를 이름·코드 매핑으로 측정소 위치 정보 등 같은 기관 데이터와 연결해야 한다.
description_portal: '서울특별시 보건환경연구원 대기오염측정망시스템에서 제공하는 대기오염 측정정보입니다.1시간평균 측정값을 보정 후 매시 5분에 제공합니다.각 자치구의 측정소에서 측정된 결과를 바로 보정후 직접제공하여 보다 빠른 데이터를 제공합니다.측정기 상태 : "0" : 정상 “1” : 교정,“2”: 비정상,“4” : 전원단절 ,“8” : 보수중,“9” : 자료이상국가 기준초과 구분 : “0”: 정상, “1” : 초과지자체 기준초과 구분 : “0”: 정상, “1” : 초과※ 이 자료는 최종확정자료가 아닙니다. 최종확정자료는 환경부 대기환경정보 홈페이지(http://www.airkorea.or.kr) 통계정보에서 확인 하실수 있습니다.※ 원천부서의 요청으로 실시간 수신 구분 컬럼을 삭제하였습니다. (2019. 11. 8.)'
