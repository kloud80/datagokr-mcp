description_portal: 환경책임보험 보험미가입 사업장 추출 정보는 보험 의무 가입 대상임에도 불구하고 일정 기간 보험에 가입하지 않은 사업장을 관리하기 위해 구축된 데이터로, 사업장의 미가입 현황과 상태를 종합적으로 파악할 수 있도록 설계되어 있다. 추출기준일자는 데이터 산출 시점을 명확히 하여 시점별 미가입 현황을 비교하고 분석할 수 있도록 하며, 인허가기관코드를 통해 각 사업장을 관리·감독하는 관할 기관을 식별한다. 추출회차는 동일 기준일 내 여러 번 자료를 산출할 경우의 회차를 기록하여 데이터 이력 관리와 중복 통계를 방지한다.사업장의 보험 미가입 기간은 미가입시작일, 미가입종기일, 미가입기간으로 구체적으로 정의되며, 미가입상태코드를 통해 해당 기간 동안 사업장이 어떤 상태였는지를 구분한다. 대상 시설별 상태 정보로는 대기, 수질, 폐기물, 토양, 화학, 해양 시설 상태와 추가 시설별 상태가 포함되어, 사업장의 시설 운영 현황과 위험성을 종합적으로 평가할 수 있다.또한, 사업장상태코드, 사업장상태시작일자, 사업장상태종료일자는 사업장의 전체적인 운영 상태와 변경 이력을 기록하며, 통보대상여부, 의무가입대상여부는 행정적 조치 필요성과 보험 의무 준수 여부를 판단하는 근거가 된다. 계산된미가입구분, 계산된미가입시작일자, 계산된미가입종료일자, 계산된미가입기간은 시스템에서 자동 산출된 미가입 정보로, 정확한 기간 산정과 통계 분석에 활용된다.미가입사업장여부, 미가입제외여부, 미가입제외종료일자, 미가입제외사유, 삭제여부와 사업장코드일련번호는 데이터의 유효성과 신뢰성을 관리하며, 추출 정보의 행정적 활용과 보고, 정책 수립을 위한 근거 자료로서 핵심 역할을 수행한다.
