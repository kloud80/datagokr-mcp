summary_user: 경상북도 영천시에 사업장폐기물 배출자로 신고한 사업장을 건별로 담으며, 상호·배출구분·폐기물종류·처리업소명·도로명/지번 주소·위경도를 기록한다. 영천시 안에서 어떤 사업장이 어떤 종류의 폐기물을 내고 어느 처리업체에 맡기는지를 확인하려는 환경 담당자·분석가·처리업 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·처리업소명 같은 이름 매칭이나 주소·좌표 기반 공간 결합으로만 이어 쓴다.
limits: 사업자번호나 표준 코드 같은 조인 키가 없어 처리업 허가 원장 등과 정확히 연결하기 어렵고 이름·주소 매칭에 의존해야 한다. 범위는 영천시 한 곳의 개별 사업장이며, 폐기물 발생량·처리량 통계는 담지 않는다.
