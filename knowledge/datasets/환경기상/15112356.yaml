description_portal: 본 데이터는 강원특별자치도 속초시 관내 고물상 운영 현황 정보를 제공하는 자료이다. 시민과 관계기관이 재활용품 수집 및 처리 관련 사업장 정보를 쉽고 편리하게 확인할 수 있도록 업체명, 소재지, 연락처 등 관련 정보를 정리하여 개방한다. 자원순환 체계 강화와 재활용 활성화를 목적으로 구축된 자료이며, 재활용품 처리 및 환경행정 업무 수행 시 참고자료로 활용할 수 있다. 또한 지역 내 재활용 관련 사업장 분포와 운영 현황을 파악하여 환경정보 접근성과 공공서비스 활용성을 높이고자 한다. 데이터는 속초시 관내 고물상 등록 및 운영 현황을 기준으로 관리하며 관련 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 지역 내 고물상 운영 현황과 재활용 관련 정보를 확인할 수 있다.
