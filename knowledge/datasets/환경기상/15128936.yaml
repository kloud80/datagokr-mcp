description_portal: 이 데이터는 한국석유공사가 연도별로 실적을 집계한 온실가스 감축 통계 자료로, 이산화탄소 등 주요 온실가스의 감축량과 관련된 수치를 제공하고 있습니다. 해당 데이터는 에너지 산업 내 탄소중립 이행 성과를 점검하고, 감축 정책의 효과를 정량적으로 분석하는 데 활용됩니다. 또한 기업의 ESG 경영 평가, 정부의 환경 정책 수립, 국제협약 이행 성과 보고 등 다양한 분야에서 핵심 참고자료로 사용됩니다. 이 자료는 연도별로 구조화되어 있어 시계열 분석, 비교 평가, 시각화 등에 적합하며, 감축 목표 대비 실적 추이 분석을 통해 향후 감축 전략 수립에도 중요한 기초자료가 됩니다. 공공성과 정책 연계성이 높아 환경·에너지 분야 전반에서 폭넓게 활용될 수 있는 데이터입니다.
