summary_user: 경상남도가 실시한 해황조사 결과를 해역·조사지점·조사 종류 분류와 함께 담는 API 데이터로, 범위는 경상남도이며 조사지점은 주소·좌표 단위로 개별 관리된다. 경남 연안 어업인이나 해양환경 분석가가 특정 해역·지점의 해황 조사 결과가 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 해역 이름·코드(SA_CODE) 매핑이나 같은 기관 코드로만 다른 해양수질 데이터와 연결한다.
limits: 전역 조인 키가 없어 다른 기관의 해양수질 측정망 데이터와 바로 결합할 수 없고 이름·코드 매핑이 필요하다. 범위가 경상남도에 한정되며, 호출에는 활용신청 후 받은 서비스키가 필요하다(개발계정 일 10,000회).
