description_portal: '본 데이터는 관내 설치된 의류수거함의 위치 및 관리정보를 제공하는 자료로, 의류수거함을 관리하는 단체(기관)와 관리코드, 행정동, 도로명주소, 위·경도 좌표, 데이터 기준일자를 포함합니다. 시민의 의류 기부·재활용 편의 증진과 의류수거함 관리의 효율화를 위해 활용될 수 있습니다.제공 항목 상세(컬럼 설명)관리단체: 해당 의류수거함을 관리·운영하는 단체 또는 기관명의류수거함 관리코드: 의류수거함을 식별하기 위한 고유 관리번호(코드)행정동: 의류수거함 설치 지점의 행정동 명칭도로명주소: 의류수거함 설치 지점의 도로명주소위도: 설치 지점의 위도 좌표(소수점 포함)경도: 설치 지점의 경도 좌표(소수점 포함)데이터기준일자: 해당 데이터가 작성·갱신된 기준일(예: YYYY-MM-DD)데이터 활용 예시지도 기반 의류수거함 위치 안내 서비스 구축행정동별 설치 현황 분석 및 추가 설치·이전 검토관리단체별 점검·민원 대응 등 운영 관리 지원유의사항(품질/좌표 관련)주소 및 좌표는 현장 여건(이전·철거·신규 설치 등)에 따라 변동될 수 있습니다.위치정보(위·경도)는 제공 기준의 좌표체계(WGS84 사용 여부 등)와 소수점 자리수에 따라 실제 위치와 약간의 오차가 발생할 수 있습니다.최신 현황은 데이터기준일자를 확인하시기 바랍니다.'
