summary_user: 광주광역시 남구 관내에서 사업장폐기물 배출자로 신고한 업체를 한 행씩 담은 목록으로, 상호명·소재지·처리방법과 데이터 기준일자가 들어 있다(csv 약 5KB 규모의 소량 파일). 남구 안의 폐기물 배출 신고 사업장이 어디에 있고 폐기물을 어떤 방식으로 처리하는지 확인하려는 주민·재활용 사업자·환경 분석가가 쓴다. 전역 조인 키나 사업자번호는 없으므로 다른 폐기물 처리업 허가 목록이나 다른 시군구 배출자 현황과는 상호명·소재지 주소를 맞춰 이어 써야 한다.
