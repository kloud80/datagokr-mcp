summary_user: 서울특별시 강서구 안의 건설폐기물처리업체를 업체(관리번호) 단위로 한 줄씩 담은 인허가 원장으로, 인허가일·영업상태·휴폐업일·소재지 주소·좌표·처리 구분과 허용 보관량 등을 포함한다. 건설 현장이나 발주자가 폐기물 운반·처리를 맡기기 전에 상대 업체가 강서구에서 허가를 받고 현재 영업 중인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: 서울시 강서구 지역 내 건설폐기물처리업체에 대한 인허가 정보를 포함하며, 업체별 인허가 일자, 관리번호, 인허가 취소 여부, 영업상태 등의 항목으로 구성됩니다. 건설폐기물은 건축, 해체, 수리 등의 과정에서 발생하는 폐기물로, 이를 적법하게 처리하는 업체에 대한 정보는 도시환경 관리와 자원순환 정책 수립의 기초자료로 활용됩니다. 또한 폐기물 운반·처리 위탁 시 업체 검증, 불법 투기 방지, 환경 영향 분석, 폐기물 발생량 예측 및 처리 역량 분석 등 다양한 분야에서 정책적 활용이 가능합니다. 궁극적으로 건설폐기물의 안전하고 지속가능한 처리를 지원하는 기반정보입니다.
