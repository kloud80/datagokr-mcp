summary_user: 인천시설공단이 관리하는 지하도상가(포털 설명상 15개소)의 실내 공기질 측정값을 상가명·측정일시별로 담은 작은 CSV 파일(약 1.1KB)로, 미세먼지(PM10·PM2.5), 이산화탄소, 폼알데하이드, 일산화탄소 농도를 기록한다. 시민이나 상가 이용자, 시설 관리 분석가가 '내가 자주 가는 인천 지하도상가의 미세먼지·이산화탄소 농도는 어느 수준인가', '어느 상가의 환기 관리가 더 필요한가'를 확인하는 데 쓴다. 전역 조인 키는 없어 지하도상가명(지하도상가명)을 이름으로 맞추거나 측정일시 기준으로 외부 대기질(에어코리아 측정소) 자료와 시기를 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 인천시설공단에서 관리하는 지하도상가(15개소)의 실내 공기질을 정기적으로 측정하여 제공하는 자료입니다. 미세먼지(PM10, PM2.5), 이산화탄소(CO2), 폼알데하이드(HCHO), 일산화탄소(CO) 등의 항목으로 구성되며, 상업시설 밀집지역의 환기 상태, 유해물질 농도 수준, 이용자 체감 환경 개선 필요 구역을 파악하는 데 활용할 수 있습니다. 이를 통해 계절별 공기질 변화 분석, 환기설비 운영효율 진단, 취약구역 집중관리, 실내환경 안전성 평가 등 정책·운영 측면의 근거자료로 활용 가능하며, 시민 이용환경의 건강성과 쾌적성 향상을 위한 관리체계 수립에 참고할 수 있습니다.
