description_portal: 본 데이터는 해양수산부에서 관리하는 해양생물 3D 콘텐츠 자료입니다. 주요 항목으로 종명, 학명, 분류체계, 서식지, 분포지역, 특성정보, 보호등급 등의 정보를 포함하고 있습니다. 이 데이터는 해양생물 다양성연구자료, 신종발굴 기초연구자료, 해양생태계 모니터링연구, 생물자원 산업화연구, 해양생물 교육콘텐츠제작 등에 활용할 수 있습니다. 해양생태연구자, 환경영향평가 전문가, 수산자원관리자 등에서 생태연구와 자원관리 업무에 활용할 수 있습니다. 해양생태계보전과 생물다양성 확보를 위한 정책수립의 기초자료로 활용되고 있습니다.
