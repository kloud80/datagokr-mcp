summary_user: 충주시 대형폐기물 수거 실적을 수거 건별로 담은 원천 파일로, 수거일자·수거지역·투입 차량·수거품목·금액을 기록하며 CSV 크기는 약 10.8MB입니다. 충주시 청소행정 담당자나 분석가가 "어느 지역에서 어떤 품목의 대형폐기물이 언제 많이 나오고 처리 수수료는 얼마인가"를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 수거지역 이름(읍면동 명칭)을 매핑하거나 같은 기관(충주시) 단위로만 이어 쓴다.
limits: 표준 행정코드 같은 조인 키가 없어 다른 지자체·통계 자료와 자동 결합이 어렵고, 지역명 문자열 매핑이 필요하다. 충주시 한 곳의 수거 실적이므로 전국 비교나 폐기물 발생량 통계로 쓰려면 다른 지자체 파일을 따로 모아야 한다.
