description_portal: 북한의 기후평년값은 세계기상기구의 세계통신망(GTS)으로 수집된 27개 북한 관측지점의 기온, 기압, 강수량 등을 평균하여 제공합니다.* 기후평년값은 ‘0’으로 끝나는 해의 최근 30년간의 누년평균값으로 정의되며, 기상청은 세계기상기구(WMO)의 권고에 따라 매 10년 주기로 새로운 기후평년값을 산출하여 제공하고 있습니다.평균기온, 최고기온, 최저기온, 강수량 등 8개 주요요소는 그래프 메뉴에서 조회가 가능하며, 기간별(일, 주, 순, 월, 연) 전체 평년값은 파일셋 메뉴에서 다운로드 받을 수 있습니다.* 평년값 기간 중 1973~1994년은 일별 자료만 제공됩니다.
