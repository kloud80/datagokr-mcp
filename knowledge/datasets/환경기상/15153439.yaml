summary_user: 환경부가 제공하는 오존주의보 발령 정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 담으며, 한 행은 발령일·지역명·세부 권역·발령 시각과 농도·해제 시각과 농도·최고 농도·발령 단계를 가진 발령 한 건이다. 시민이나 지자체 담당자가 '우리 지역에 언제 오존주의보가 내려졌고 최고 농도가 얼마였나'를 확인하거나, 분석가가 지역별 발령 빈도와 지속 시간을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 대기질·기상 데이터와는 지역명(RGN_NM)과 세부 권역명 같은 이름을 맞춰 붙이거나 날짜로 이어 써야 한다.
