summary_user: 부산광역시 남구 안에 있는 휘발성유기화합물(VOCs) 배출시설을 사업장 한 곳당 한 줄로 담은 명단으로, 업종·사업장명·도로명 소재지·전화번호를 담는다(CSV 파일 약 1.7KB 규모의 작은 목록). 주민이나 환경 분석가가 '우리 동네 주변에 VOCs를 배출하는 사업장이 어디에 있고 어떤 업종인가'를 확인할 때 쓴다. 전역 조인 키(사업자번호·시설코드 등)는 없어서, 다른 배출시설·인허가 사업장 자료와는 사업장명과 도로명 주소를 맞춰 보거나 주소를 좌표로 바꿔 지도에 겹쳐 이어 쓴다.
