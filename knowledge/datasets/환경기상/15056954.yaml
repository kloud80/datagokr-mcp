summary_user: 부산시 관측소(siteCode·siteName)별로 관측시각 기준 1분·10분 평균 풍향·풍속과 순간최대풍(돌풍)의 풍향·풍속, 관측 상태를 실시간으로 담는 관측 원천 데이터이며, 범위는 부산광역시 시군구 단위이다. 시민이나 분석가가 "지금 부산 어느 지점에서 바람이 얼마나 세게, 어느 방향으로 부는가"를 확인하거나 강풍 대응·기후 분석의 원천 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관측소 이름·코드를 직접 맞추거나 같은 부산시 데이터의 관측소 코드로만 연결한다.
limits: 전역 조인 키가 없어 기상청 ASOS·AWS 등 다른 기관 관측자료와 바로 결합되지 않고, 지점 이름·코드를 수동으로 대응시켜야 한다. 포털 설명에 강우량이 언급되지만 필드 목록에는 풍향·풍속 항목만 있다.
