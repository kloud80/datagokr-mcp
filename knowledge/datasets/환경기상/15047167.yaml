description_portal: '○ 통계개요* 통계명 : 폐기물 재활용 현황* 통계종류 : 서울시 자치구별 폐기물 재활용량 현황을 제공하는 지정ㆍ조사통계* 근거법령 :「폐기물관리법」에 의한 생활폐기물 발생 및 처리* 작성목적 : 폐기물의 발생 및 처리현황, 종류별 발생량, 폐기물 조성의 변화등을파악하여 관련시설의 설치 및 관리 등 폐기물 정책 수립에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 시도 → 환경부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 해당시설 및 자치구내용 - 서울시 자치구별 폐기물(생활, 음식물, 사업장 배출시설 등)재활용량 현황○ 용어설명* 폐기물 : 쓰레기, 연소재, 오니, 폐유, 폐산, 폐알칼리 및 동물의 사체 등으로서사람의 생활이나 사업활동에 필요하지 아니하게 된 물질○ 기 타* 합계에 지정폐기물은 제외됨- 지정폐기물 : 사업장폐기물 중 주변환경을 오염시키거나 인체에 해를 끼칠 수있는 물질로서 대통령령이 정하는 폐기물○ 출 처 : 자원순환과, 환경부「폐기물통계」'
