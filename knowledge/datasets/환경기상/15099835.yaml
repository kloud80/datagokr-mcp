summary_user: 전북특별자치도 정읍시에 설치된 분리수거대를 한 곳씩 담은 건별 목록으로, 행정동·위치명(건물명이나 마을 이름)·설치 주소·상태(양호·보통·불량)·관리부서와 연락처를 담는다. 정읍시 주민이 우리 동네 분리수거대가 어디 있는지 찾거나, 담당 부서가 상태가 불량인 분리수거대를 골라 정비 대상을 정하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 설치 주소를 기준으로 다른 정읍시 생활폐기물 배출 지점 자료와 이름·주소로 맞춰 이어 쓴다.
limits: 범위는 정읍시 한 곳의 개별 지점이며 다른 시군구 자료는 별도 파일을 찾아야 한다. 공통 코드나 좌표 키가 없어 다른 데이터와는 행정동 이름이나 주소 문자열 매칭으로만 연결된다. 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다.
