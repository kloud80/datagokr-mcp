description_portal: 서울시 실내공기질 관리대상 시설정보는 실내 공기 환경 관리를 위해 법적으로 관리 대상이 되는 시설들의 현황을 체계적으로 정리한 공공데이터입니다. 연도, 지역구, 시설군, 건물명, 지번주소와 도로명주소, 연면적, 준공일자 등의 기본 정보와 함께 상주인원수, 일일사용자수, 침상수 등 이용 규모 관련 지표를 포함하고 있어 시설별 이용 특성을 파악할 수 있습니다. 또한 부서명, 최근교육이수일, 교육종류 정보가 제공되어 실내공기질 관리 담당자의 교육 이수 현황과 관리 체계를 점검하는 데 활용할 수 있습니다. 이 데이터는 자치구별 관리대상 시설 분포 분석, 고위험 시설 발굴, 점검·예산 우선순위 설정 등 실내 환경보건 정책 수립을 위한 기초 자료로 유용하게 쓰일 수 있습니다.
