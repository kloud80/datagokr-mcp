description_portal: 본 데이터는 2025년 12월 17일 기준으로 국립호남권생물자원관 섬생물소재은행이 보유 중인 배양체 균류 소재 확보 리스트 정보입니다. 구성 항목은 은행자원번호, 분류군, 국명, 학명, 분양가능여부로 이루어져 있으며, 분류군은 모두 균류로 구성되어 있습니다. 국명은 한글 학명으로, 학명은 영문으로 작성되어 있어 국내외 연구 활용이 가능합니다. 분양가능여부는 모든 항목이 ‘가능’으로 기재되어 있어 연구자 및 산업체 활용에 적합합니다. 은행자원번호는 "HNIBR-FC"로 시작하며, 그 뒤에 숫자가 붙는 형식으로 구성되어 있으며, 체계적인 자원 관리 및 검색이 용이합니다. 본 데이터는 균류 다양성 연구, 생물소재 활용, 바이오산업 적용 등 다양한 분야에서 활용될 수 있으며, 생물주권 확보와 자원 공유 기반 구축에도 기여할 수 있는 중요한 자료입니다. 산업화 및 공동연구 기반 자료로도 활용됩니다.
