summary_user: 해양환경 측정분석기관의 정도관리 인증 현황을 기관별 한 행으로 담은 파일(csv, 약 30KB)이며, 인증번호, 인증 유효기간(시작·만료일자), 대표자, 주소, 연락처와 인증 분야(해수 일반항목, 해수 미량금속, 해저퇴적물 미량금속)를 포함하고 범위는 전국이다. 해양 조사나 분석을 맡기려는 사업자와 발주기관이 '이 분석기관이 해저퇴적물 미량금속 분야 인증을 받았고 유효기간이 남아 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소를 맞춰서만 이어 쓸 수 있다.
description_portal: 해양환경공단이 제공하는 정도관리 정보에 대한 데이터를 제공합니다. 본 데이터는 해양환경 측정분야의 신뢰도 확보를 위한 품질관리 체계로, 시험·검사 결과의 정확성과 정밀도를 유지하기 위한 장비 교정, 내부 품질관리, 외부정도관리 프로그램 참여 등의 주요 활동을 포함하고 있습니다. 또한 분석기기 성능 검증, 시료관리 기준, 시험자 숙련도 평가 등 구체적인 이행사항도 포함되어 있습니다. 본 데이터는 해양환경조사의 신뢰성 확보, 분석 품질 향상, 관련 기관의 시험실 품질관리 체계 구축 등을 위한 기초자료로 활용됩니다.
