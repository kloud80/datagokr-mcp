summary_user: 올바로시스템에 등록된 사업장일반·지정폐기물 배출 사업장의 2025년 실적보고를 사업장·폐기물 종류별 행으로 담은 전국 시군구 단위 파일이다(기초시군구, 업체명, 폐기물구분, 폐기물명, 연간배출량(톤)). 지역 담당자나 폐기물 처리업자가 '우리 시군구에서 어떤 사업장이 지정폐기물을 연간 몇 톤 배출하는가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 기초시군구 이름이나 업체명 문자열을 맞춰 연결해야 한다.
description_portal: '한국환경공단에서 운영하는 폐기물관리시스템(올바로시스템)에 등록된 사업장일반과 지정폐기물에 대한 2025년 실적보고 데이터[기초시군구(관할관청), 사업장명, 폐기물종류, 폐기물구분, 연간 배출량 등]를 제공합니다. 참고로 해당 데이터는 공공데이터포털에 데이터 개방을 동의한 사업장에 한하여 추출된 데이터 셋이며, 사업장에서의 데이터 입력 시점에 따라 다소 데이터가 달라질 수 있습니다. 또한 데이터의 임의 변경 및 수정은 불가하오니 이점 유의하여 활용 바랍니다.- 목록명: 한국환경공단_사업장일반지정폐기물 배출 사업장 정보- 제공데이터: 기초시군구, 업체명, 폐기물구분, 폐기물명, 연간배출량(톤)'
