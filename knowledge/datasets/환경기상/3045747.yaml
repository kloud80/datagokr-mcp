summary_user: 부산광역시 서구의 환경오염 배출시설 사업장을 업체 단위(주소·좌표가 있는 개별 행)로 담은 파일 데이터로, 검증 시 160행을 받았다. 주민이나 분석가가 우리 동네·학교 근처에 어떤 업종의 배출 사업장이 있는지 확인하는 질문에 쓴다. 도로명주소(address)와 위도·경도(coord)를 키로 다른 공간 자료나 인허가 원장과 이어 쓴다.
description_portal: 본 데이터베이스는 부산광역시 서구 전역에서 환경오염물질을 배출하는 모든 허가·신고 사업장을 망라하여, ①업체명, ② 도로명주소 ③ 주요 업종(한국표준산업분류 기준), ④ 전화번호, ⑤ 위도·경도 좌표, 5여 개 항목을 표준화된 형식으로 수록한 환경 행정 자료입니다.데이터는 △ 부산시·서구청 허가대장, △ 사업장 자가측정 보고서, △ 현장 합동점검 결과를 교차 검증해 추출하며, GIS 좌표 정합성 검토 후 표준 EPSG:5173(UTM-K)와 WGS84 좌표계를 함께 제공합니다.자료 형식은 CSV, Excel, GeoJSON, 파일지오데이터베이스(gdb) 등 4종으로 배포해 행정·연구·민원 대응 시스템에 즉시 연계할 수 있고, 데이터 사전(data dictionary)과 샘플 시각화(열 지도, 업종별 분포도)도 포함돼 이용자가 손쉽게 가공·분석할 수 있습니다.주요 활용처로는 ▲ 행정기관의 무허가·방지시설 미가동 사업장 색출, ▲ 취약지역(학교·주거지 인접) 관리 강화, ▲ 환경영향평가 기초 자료, ▲ 주민 대상 오염원 공개 및 이동경로 안내, ▲ 연구기관의 대기·수질 모델링 입력값, ▲ 언론·시민단체의 데이터 저널리즘 등이 있으며, 데이터는 매년 3월과 9월 두 차례 정기 업데이트를 실시하되, 위반 사업장 행정처분 또는 신규 허가·폐업 등 중요한 변동이 발생하면 7일 이내에 수시 패치 버전이 배포됩니다. 또한, 개인정보 보호를 위해 대표자 이름 등 민감 정보는 비식별 처리하며, 이용자는 『공공데이터 제공 및 이용 활성화에 관한 법률』에 따라 자유롭게 활용하되, 출처 표시와 2차 가공 시 변경내역 공개를 권장하고 있습니다.이처럼 “부산광역시 서구
