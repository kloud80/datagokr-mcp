description_portal: 한국서부발전 평택발전소 호기별 운영에 따른 대기오염물질 배출량을 상세히 기록한 자료입니다. 발전소명, 연월, 호기별로 질소산화물, 질소산화물의 배출 기준과 실제 평균 농도를 비교하여 보여줍니다. 기준 대비 실제 배출량을 확인하여 오염물질 관리 현황을 파악할 수 있습니다.이는 발전소 운영이 대기 환경에 미치는 영향을 지속적으로 모니터링하고, 환경 관련을 위한 분석자료로 활용할 수 있습니다.제공 데이터는 발전소명, 연월, 호기, 질소산화물(Nox) 기준, 질소산화물(Nox) 평균농도, 단위(ppm) 입니다.
