summary_user: 경기도의 노후차량 저공해화 사업을 기준년도별로 집계해 목표량(goal_amnt)과 실제 조치대수를 담은 연도 단위 집계 자료이며, 포털 설명상 2018~2022년을 다룬다. 도민·정책 분석가가 "경기도가 해마다 노후 경유차 저공해 조치 목표를 얼마나 달성했나"처럼 연도별 목표 대비 실적을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도나 기관 이름으로만 맞춰 붙이며, 같은 대기 배출원·자동차 환경 부문의 다른 자료와 연도 기준으로 나란히 놓고 본다.
description_portal: 이 데이터는 경기도의 2018~2022년 노후차량 저공해화 사업 추진 현황을 나타낸 것으로, 기준년도별로 차량 저공해화 목표량과 실제 조치대수를 기록하고 있습니다. 노후차의 저공해 조치는 대기환경 개선을 위한 핵심 정책으로, 경유차의 매연저감장치 부착, 조기 폐차 유도, 친환경 차량 전환 지원 등의 방식으로 이뤄집니다. 본 자료를 통해 각 연도별 목표 대비 실적을 비교 분석할 수 있으며, 환경정책의 집행성과나 예산 투입의 효율성 평가, 향후 저공해화 정책 설계에 필요한 기초자료로 활용할 수 있습니다. 특히 조치대수는 실질적인 정책 이행성과를 정량적으로 보여주는 지표로, 공공의 친환경 교통체계 구축 노력의 성과를 분석하는 데 유용합니다.
