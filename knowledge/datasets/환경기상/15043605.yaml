description_portal: 라디오존데를 기구에 매달아 비양시켜 지상으로부터 30km이상 상공까지 일정한 시간 간격으로 대기상태를 직 · 간접적으로 관측합니다.관측자료는 무선 송수신장치를 통해 지상으로 전송되고 지상 수신장치에서 처리됩니다.기상청은 일 2회 정기 고층기상관측(오전 9시, 오후 9시)을 하고 우리나라에 태풍, 집중호우 등과 같은 위험기상 현상이 발생 또는 예측될 때는 정기관측시각 이외에 3시, 15시에 특별기상관측을 합니다.관측요소는 기압, 고도, 기온, 이슬점온도, 풍향, 풍속 등이 있습니다.
