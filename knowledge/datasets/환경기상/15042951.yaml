summary_user: 대전광역시 동구의 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호·전화·도로명주소·사업장구분과 일일·월 배출량, 연간처리량, 처리방법, 위탁 재활용방법을 기록한다(단위 kg). 동구 내 어떤 음식점·집단급식소가 음식물쓰레기를 많이 배출하며 직접 처리하는지 위탁하는지를 확인하려는 주민·수거업체·감량정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소(사업장도로명주소)나 상호 이름 매칭으로만 이어 쓰며, 다른 지자체의 같은 이름 파일과 합칠 때도 같은 방식이다.
description_portal: '이 데이터는 대전광역시 동구 음식물류폐기물 다량배출사업장 현황으로 세부 내용으로는 상호명, 사업장 전화번호, 도로명주소, 사업장구분, 음식물폐기물 일일/월 배출량, 연간처리량, 처리방법, 위탁 재활용방법의 정보를 제공하고 있습니다. 이를 통해 음식물쓰레기 배출의 연도별 변화 추이를 확인할 수 있고, 배출감량 정책 및 분석에도 기초자료로 활용될 수 잇습니다. / 단위: kg해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 7. 21.'
