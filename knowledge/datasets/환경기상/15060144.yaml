description_portal: 「폐기물관리법」 시행규칙 제18조 제1항 1호, 2호, 3호에  따라 사업장폐기물 신고1. 「대기환경보전법」, 「물환경보전법」 또는 「소음·진동관리법」에 따른 배출시설을 설치·운영하는 자로서  폐기물을 1일 평균 100킬로그램 이상 배출하는자, 2. 「폐기물관리법」 시행령 제2조 제1호부터 제5호까지의 시설을 설치·운영하는 자로서 폐기물을 1일 평균 100킬로그램 이상,3. 폐기물을 1일 평균 300킬로그램 이상 배출하는 자가 사업장폐기물 배출자 신고에 대한 현황 자료 입니다.법적근거「폐기물관리법」 제17조제1항,제2항 제5항, 제6힝, 제18조 제5항같은법 시행규칙 제16조의7, 제17조의2, 제18조, 및 제20조에 따라 지차체 청양군 사업장폐기물 신고한 현황 자료입니다.
