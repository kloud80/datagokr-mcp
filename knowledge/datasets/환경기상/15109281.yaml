summary_user: '충청남도 청양군에서 구조된 야생동물을 접수 건별로 담은 원천 자료로, 종명·분류(강·목·과)·천연기념물·멸종위기 등급, 구조일시와 구조 좌표·발견 주소, 발생 원인, 구조 결과·방생 위치, 체중·최종 진단을 기록한다. 청양군에서 어떤 종이 어떤 원인(예: 차량 충돌)으로 자주 구조되고 방생·폐사 비율이 어떤지 보려는 지자체 담당자나 생태 연구자가 쓴다. 전역 조인 키는 없어서 종명으로 다른 구조·종 분포 자료와 맞추거나 구조·방생 위경도 좌표로 도로·보호구역 같은 공간 레이어에 겹쳐 쓴다.'
description_portal: '이 데이터는 충청남도 청양군에서 구조된 야생동물의 구조 및 처리 현황을 담은 행정자료입니다. 주요 항목에는 구조일자, 동물 종명, 구조 장소, 구조 사유(예: 교통사고, 질병, 기아, 자연재해 등), 처리 결과(방생·치료·폐사 등) 등이 포함됩니다. 이를 통해 청양군에서 어떤 종의 야생동물이 자주 구조되는지, 구조가 주로 어떤 원인에서 비롯되는지를 파악할 수 있습니다. 예를 들어 교통량이 많은 도심 인근에서는 차량 충돌에 의한 조류·포유류 구조 사례가 많을 수 있으며, 농경지와 산지 인접 지역에서는 멧돼지·고라니 등 농작물 피해와 연관된 구조 사례가 발생할 수 있습니다. 또한 처리 결과 항목을 분석하면 방생률과 폐사율을 비교하여 청양군의 야생동물 구조·재활 체계의 성과와 한계를 평가할 수 있습니다. 이 자료는 천안시의 생태 보전 정책, 인간-야생동물 갈등 관리, 도로 생태통로 설치 검토, 환경 교육 자료 등 다양한 행정 및 연구 목적에 활용될 수 있으며, 충청남도 전체 데이터와 결합하면 지역별 야생동물 관리 전략을 수립하는 데에도 유용합니다.'
