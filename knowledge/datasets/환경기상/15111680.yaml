summary_user: 경상남도 의령군 관내 대기오염배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 지역·사업장명·대기 배출 종별·도로명주소·연락처·데이터 기준일을 제공한다(csv 약 7KB). 주민이나 사업자가 '우리 동네에 어떤 대기오염 배출 사업장이 있고 몇 종에 해당하는가'를 확인하거나, 분석가가 군 단위 배출원 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 사업장명을 맞춰 연결하거나, 같은 기관의 다른 데이터와 묶어 써야 한다.
description_portal: 본 데이터는 경상남도 의령군 관내 대기오염배출사업장의 정보를 나타내는 데이터입니다. 사업장이 소재한 지역, 사업장의 명칭과 사업장이 배출하는 대기오염배출 종별, 소재지의 도로명주소와 연락처, 데이터 기준일을 제공합니다. 전화번호 항목이 공란인 곳은 데이터의 미수집으로 향후, 데이터 확보 시 재수정해서 개방할 예정입니다. 본 데이터는 사업장의 오염물질 배출 실태를 파악하고 정책 수립 및 규제 등을 위한 기반 자료로 활용될 수 있습니다. 또한 대기환경 정보에 대한 국민들의 알 권리 충족과 함께 지역사회 환경의 투명한 관리와 지속 가능한 발전을 위한 공공 데이터로서의 가치를 가집니다.
