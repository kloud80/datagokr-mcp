description_portal: '논산시 낚시금지구역 및 제한구역 공공데이터를 제공합니다.(지정일자, 지정범위(대상지역), 지역면적, 지정사유  등)□ 낚시 금지·제한구역 위반행위 및 위반시 처벌규정 ○ 낚시금지구역 : 낚시행위 금지   ☞ 처벌규정 : 300만원 이하의 과태료 ○ 낚시제한구역 제한행위     가. 낚시바늘에 끼워서 사용하지 아니하고 물고기를 유인하기 위하여 떡밥·어분 등을 던지는 행위    나. 어선을 이용한 낚시행위 등 「낚시 관리 및 육성법」에 따른 낚시어선업을 영위하는 행위(「내수면어업법 시행령」 제14조제1항제1호에 따른 외줄낚시는 제외한다)    다. 1명당 4대 이상의 낚시대를 사용하는 행위    라. 1개의 낚시대에 5개 이상의 낚시바늘을 떡밥과 뭉쳐서 미끼로 던지는 행위    마. 쓰레기를 버리거나 취사행위를 하거나 화장실이 아닌 곳에서 대·소변을 보는 등 수질오염을 일으킬 우려가 있는 행위    바. 고기를 잡기 위하여 폭발물·배터리·어망 등을 이용하는 행위(「내수면어업법」 제6조·제9조 또는 제11조에 따라 면허 또는 허가를 받거나 신고를 하고 어망을 사용하는 경우는 제외한다)   ☞ 처벌규정 : 100만원 이하의 과태료'
