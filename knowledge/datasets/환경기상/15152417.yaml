summary_user: 행정안전부가 재난안전데이터 공유플랫폼을 통해 제공하는 전국 날씨 정보로, 필드명으로 보아 시군구 단위의 현재 기온·습도·하늘 상태·강수 형태·1시간 강수량·3시간 뒤 기온과 예보·실황 기준 시각을 담는다. 지자체 재난안전 담당자나 분석가가 '지금 우리 시군구의 기온과 강수 상황은 어떤가'를 확인하거나 재난·안전 데이터와 날씨를 함께 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구 코드(STDG_SGG_CD)와 시군구명을 행정구역 코드표나 이름으로 맞춰 다른 시군구 단위 데이터와 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 날씨 정보입니다. 전국 날씨에 대한 정보를 표출합니다
