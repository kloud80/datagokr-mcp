description_portal: 제주특별자치도개발공사는 페트병 배출사업장으로 사회적 책임 이행 및 지역사회 플라스틱 쓰레기 문제 해결을 위해 지역사회, 민간, 기관등 다양한 주체와 협력하여 제주특별자치도 내 투명페트병 수거-업사이클-지역사회 환원 운영체계를 갖추어 운영하고 있습니다. 이러한 투명페트병 수거 프로젝트의 산하 사업중 하나로 지역 내 주요 거점마다 자동수거보상기를 배치하여 운영하고 있으며, 이에 따른 자동수거보상기 운영 정보(거점명, 연월, 이용자 수, PET병 수거량)입니다.※ 실제와 페트병 자동수거보상기 자동측정 간 수치의 오차가 있어 데이터 하단에 월별 오차를 기재했습니다.
