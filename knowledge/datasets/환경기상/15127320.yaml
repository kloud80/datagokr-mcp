description_portal: 이 데이터는 해양수산부가 운영하는 온라인 플랫폼을 통해 해양환경 지식나눔 라이브 특강을 수강한 대상자들을 대상으로 실시된 설문조사 결과를 수집한 데이터입니다.  본 데이터의 주요 내용은 2023년 특강 수강생 총 270명을 대상으로 한 설문조사 항목과 그에 대한 응답 결과로 구성되어 있습니다. 주요 설문 내용에는 특강에 대한 만족도, 강의 내용의 이해도, 추후 특강 참여 의사 등의 항목이 포함되어 있습니다.  본 데이터는 해양환경 교육 프로그램의 운영 효과 분석, 온라인 플랫폼 기반 교육 콘텐츠 개선, 향후 해양환경 대국민 인식 제고 정책의 기초자료 마련에 활용될 수 있습니다.
