summary_user: 경상북도 대기중금속 측정망(포항 4곳·봉화 석포·구미 4공단·김천 대광동) 측정소별로 PM-10에서 분석한 납·카드뮴·비소·아연 등 중금속 농도를 지역·연월 단위로 정리한 집계 파일(csv, 약 11KB)이다. 공단이나 제련소 인근 주민·연구자가 "우리 지역 대기 중 납·카드뮴 농도가 달마다 어떻게 변했나" 같은 질문에 쓴다. 전역 조인 키가 없어서 다른 대기·환경 데이터와는 지역(측정소) 이름과 연월을 맞춰서만 이어 쓴다.
limits: 측정소 코드나 행정코드 같은 공통 키가 없어서 다른 데이터와 붙이려면 지역 이름을 직접 매핑해야 한다. 경상북도 일부 측정소만 담고 있어 도 전체나 전국의 중금속 오염 수준을 대표하지 않는다.
