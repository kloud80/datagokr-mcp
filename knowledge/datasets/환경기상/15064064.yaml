description_portal: '대기중금속 측정망 지역, 월, 년도, 중금속 항목 등 대기중금속 조회 정보를 제공하는 경상북도 대기중금속 측정자료 현황입니다.  ◦ 측정소 현황    - 포항지역 4개소(장흥, 장량, 대송, 3공단)    - 봉화지역 1개소(석포)    - 구미지역 1개소(4공단)    - 김천지역 1개소(대광동)도시지역 또는 공단 인근 지역에서의 중금속에 의한 오염 실태를 파악하기 위하여 매달 5일 연속(황사시 매일) 포항시에서 시료채취 후 보건환경연구원에서 분석, 보고하고 있습니다.환경대기 중 PM-10을 채취하여 중금속 13항목 (납, 카드뮴, 크롬, 구리, 망간, 철, 니켈, 비소, 베릴륨, 칼슘, 알루미늄, 마그네슘, 아연) 분석  ※ 아연 : 석포측정소 개소(’19년) 이후 자체 추가◦ 1 ~ 12월 : 시료 분석(매월 둘째 주 5일 연속 시료채취 후 분석)◦ 결과 통보 : 도, 해당 시·군 및 국립환경과학원 등※ 황사 발생 시(200 ㎍/㎥이상 관측) 중금속 성분분석 추가 운영방법(대기환경측정망의 설치 및 운영지침)  ◦ 측정망 운영현황 및 자료 보고    - 분석결과를 다음 달 말일까지 1차 확정 완료된 매월 측정값을 국립환경과학원장에게 제출하고 국가대기환경정보관리시스템(NAMIS)에 측정소 변동사항을 반영하여 측정결과를 입력     ※ 대기환경측정망 운영관리      · 시료분석 및 결과 1차 확정 : 보건환경연구원      · 측정소 설치 및 운영관리 : 시·군 환경과관계법령:대기환경보전법 제3조(상시측정), 대기환경보전법 시행규칙 제11조(측정결과 보고)'
