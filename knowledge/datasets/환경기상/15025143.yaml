description_portal: 기후변화로 인해 지표수의 가용성이 불확실 해지는 가운데 지하수의 역할과 중요성이 높아지고 있으며 지하수는 주변 환경에 큰 영향을 미치기 때문에 지하수 고갈, 지반 침하, 오염 등에 대한 정책 수립을 위해  모니터링이 필요 따라서 국가지하수수질측정망 외 지역지하수수질측정망을 지정하여 수질현황과 수질변화 추세를 정기적으로 파악·관리하여 지하수의 수질을 보전하고, 정책 수립을 위한 기초 자료로 활용하고 있음관내 수질측정망은 6개로 생활용수 20개 항목에 대해 연2회(반기별1회) 수질검사를 실시하고 이를 국가지하수정보센터에 등록하고 있음
