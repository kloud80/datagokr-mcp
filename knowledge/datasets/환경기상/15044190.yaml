summary_user: 해양환경공단이 마산 양덕 해역 자동측정소에서 잰 수온·염분·용존산소·수소이온농도·탁도·클로로필·전기전도도를 관측일자별로 담은 측정 원천 시계열 파일(CSV, 약 2.2MB)이다. 연구자나 지자체 담당자가 마산만 양덕 해역의 용존산소가 계절별로 얼마나 떨어지는지, 수질 개선 정책 전후로 수질이 달라졌는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 측정소 자료와는 정점명·정점코드 같은 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 마산 양덕지역 해역에 설치된 측정소의 수질 자동측정 정보를 제공합니다. 본 데이터는 수온, 염분, 용존산소(DO), pH, 탁도, 클로로필-a 등 주요 수질 항목을 실시간으로 측정한 결과를 포함하며, 폐쇄성 수역의 수질 모니터링, 오염 감시, 조기경보 체계 운영 등에 활용됩니다. 마산만은 수질 민감 해역으로 지정된 지역으로, 본 측정망은 해양오염 관리와 수질 개선 정책 수립에 중요한 역할을 합니다. 데이터는 시계열 통계 형식으로 제공되며, 계절별 수질 분석, 오염원 파악, 정책 효과 평가, 연구자료 등 다양한 분야의 기초자료로 활용됩니다. 공공기관, 연구기관, 지자체 등에서 해양환경 관리 및 행정 활용에 사용됩니다.
