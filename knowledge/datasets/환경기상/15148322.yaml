description_portal: 지역별 회수설비 설치 주유소 현황 데이터 입니다.대기환경보전법 제44조(휘발성유기화합물의 규제)대기환경보전법 시행령 제45조(휘발성유기화합물의 규제 등)환경부 고시 제2023-219호(주유소 유증기 회수설비의 검사방법 등에 관한 규정)에 근거하며 2025년 12월 말 기준자료입니다.대기관리권역 내 주유소에 유증기 회수설비의 부착 및 관리를 통해 휘발유 주유시 발생하는 휘발성유기화합물(VOCs)을 저감하여 주유소 운영자, 운전자, 주변 주민들의 건강 및 대기질을 보전하기 위함이며 제공데이터는 주유소명, 주유소시도구분, 도로명주소 입니다.
