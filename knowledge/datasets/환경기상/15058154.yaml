summary_user: 해양수산부가 협의하는 개발사업의 사전환경성 검토(환경영향평가 계열) 정보를 접수연도와 사업명으로 조회하는 API로, 전국 범위의 비공간 건별 목록을 담는다. 분석가나 사업자가 특정 연도에 접수된 해양·연안 개발사업이 어떤 것이 있었는지 확인해 개발 선행 지표로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 토지이용규제·개발사업 데이터와는 사업명 같은 이름 매핑으로만 이어 쓴다.
limits: 공통 코드나 조인 키가 없어 다른 데이터와 정확히 결합하기 어렵고, 사업구역 좌표 같은 공간 정보는 없다. 사업 접수 같은 이벤트가 생길 때 만들어진 뒤 바뀌지 않는 성격이라 정기 갱신 데이터로 보면 안 된다. 개발계정은 하루 10,000회까지 호출할 수 있다.
