summary_user: 파주시가 지정한 공회전 제한 구역을 한 행에 한 구역씩 담은 파일 데이터로, 구역유형·구역명칭·도로명/지번 주소·위도·경도·관리기관과 전화번호를 담는다(약 28KB CSV). 운전자나 물류·운수 사업자가 '파주에서 공회전이 금지된 곳이 어디인가'를 확인하거나, 분석가가 이 구역을 지도에 올려 대기질·교통 정책을 검토하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위경도를 기준으로 공간 결합하거나 구역명칭으로 맞춰 이어 쓴다.
description_portal: 경기도 파주시 차량의 불필요한 공회전을 제한하여 대기오염을 줄이고 에너지 절약 도모로 환경 보호 및 도시 공공질서 유지를 목적으로 설정된 공회전 제한 구역에 대한 공공데이터로 구역유형, 구역명칭, 소재지 도로명 주소, 소재지 지번 주소, 지도 API와 연계해 시각화가 가능한 위도, 경도 정보 등으로 구성되어 있습니다.이 데이터는 지속가능한 도시 환경 조성에 기여하는 공공자원으로서 GIS 기반 지도 서비스 또는 모바일 앱 개발, 위치 기반 서비스 개발, 도로교통, 대기환경, 도시계획, 환경 정책 분석, 교통 관련 연구, 친환경 정책 실효성 검토, 위치 기반 서비스(LBS) 제공 등에 활용될 수 있습니다.
