description_portal: '매년 전국오염원조사 실시 기간 중 시스템을 이용한 사용자를 대상으로 시스템 만족도 조사를 시행.세부 분야별로는 응답속도 영역, 안정성 영역, 편의성 영역, 업무지원 영역으로 질문이 구성되어 있으며, 척도 환산방법을 통하여 결과 값을 산출함. * 척도 환산방법 : 각 문항별로 5점 척도를 사용하고 이를 다시 100점 만점으로 환산함.     - 매우만족(5점), 만족(4점), 보통(3점), 불만족(2점), 매우불만족(1점)* 만족도 산출방법 : 만족도는 5점 척도를 100점으로 환산한 값의 합을 응답자 수로 나누어 산출해당 만족도조사 결과를 분석하여 향후 시스템 개선, 교육자료 개선 등에 활용함.'
