summary_user: 부산광역시 영도구에서 석면조사 대상이 된 건축물을 건물 한 동씩 담은 목록으로, 건물명·법정동·도로명 주소·건물용도·석면조사일을 담으며 범위는 영도구 한 개 시군구(읍면동 단위 위치)이고 파일 크기는 약 2.4KB의 소규모 CSV다. 영도구 주민이나 건물 매수·임차 예정자가 "우리 동네 어떤 건물이 석면조사 대상이었고 언제 조사했나"를 확인하는 데 쓴다. 전역 조인 키는 없어 법정동명이나 도로명 주소를 이름으로 맞춰 건축물대장·주소 데이터, 다른 지자체의 석면조사 대상 건축물 현황과 이어 쓴다.
description_portal: 석면안전관리법 제21조에 따른 석면조사 대상 건축물 현황으로 건축물명, 소재지, 건물용도, 석면조사일 등 데이터 공개합니다.석면은 직경의 0.02~0.03㎛ 정도로 유연성과 열에 대한 저항력이 매우 강하고 약산성을 띄고 있어 건축자재, 자동차 , 가정용품 다양한 분야에서 이용되었습니다.특히 건축물 내에서는 마감재, 단열 및 보온재, 바닥타일, 천장타일, 지붕용 슬레이트 등으로 사용되었습니다.그러나 석면은 호흡기로 인체에 흡입될 경우 치명적인 폐질환을 유발하여 1급 발암물질로 지정되어 석면 사용 금지하고 있습니다.
