description_portal: 본 데이터는 한국표준산업분류표에 따라 선정된 18개 업종의 폐기물 다량발생사업장을 대상으로, 원재료 사용량, 제품생산량, 매출액과 함께 폐기물 발생량, 재활용량, 최종폐기물량 등의 연도별 현황을 제공하는 자료입니다. 이를 통해 산업 현장에서 발생하는 폐기물의 규모와 감량 추이를 파악할 수 있으며, 재활용을 통한 자원순환 성과와 최종 폐기물 처리량을 비교·분석할 수 있습니다. 행정기관은 이 데이터를 활용하여 폐기물 감량 정책 효과를 평가하거나 산업별 맞춤형 관리 전략을 수립하는데 참고자료로 활용할 수 있고, 기업은 자사 배출 현황을 벤치마킹하여 친환경 경영 및 ESG 경영 전략에 반영할 수 있습니다. 연구자 및 일반 국민 또한 산업 폐기물 발생 및 처리 동향을 한눈에 이해하는 데 활용할 수 있습니다.
