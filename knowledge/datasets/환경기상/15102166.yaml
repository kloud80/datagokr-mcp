summary_user: 서울 동작구에 설치된 담배꽁초 전용 쓰레기통을 설치장소(상호명)·도로명주소·관리연합회·관리부서 단위로 한 건씩 담은 시설 목록 파일이다(CSV 약 2.4KB의 소규모 파일). 주민이나 흡연자가 '우리 동네 근처 어디에 꽁초 전용 수거함이 있나', 또는 구청·분석가가 '관리연합회별로 수거함이 어떻게 분포하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 주소·시설명을 맞춰 연결해야 하며, 다른 지자체의 유사 수거시설 파일과는 같은 항목 이름을 기준으로 수작업 매핑해 묶는다.
description_portal: 서울특별시 동작구 담배꽁초 전용 쓰레기통 현황 데이터에는 상호명(설치장소), 도로명주소, 관리연합회, 데이터 기준일자 등을 포함하고 있습니다.데이터에는 담배꽁초 전용 쓰레기통이 설치된 설치장소 정보가 포함되어 있습니다.이를 통해 이용 가능한 수거시설의 위치를 확인할 수 있습니다.도로명주소 항목을 통해 공식 주소 기준으로 시설 위치 검색이 가능합니다.시설별 위치 정보를 활용하여 지역 내 분포 현황을 파악할 수 있습니다.관리연합회 정보가 포함되어 시설 운영 및 관리 주체를 확인할 수 있습니다.
