description_portal: 한국동서발전에서 제공하는 연료정보지별 수입 유연탄 정보 데이터입니다. 본 데이터는 유연탄의 주요 수입항인 리차드베이(Richards Bay)와 뉴캐슬(Newcastle)의 항목을 기준으로, 연도 및 월별 단위로 수입량 정보를 제공합니다. 데이터 항목은 연월, 유연탄(Richard Bay), 유연탄(Newcastle)로 구성되어 있으며, 발전용 연료 수급 동향 파악에 활용될 수 있습니다.학계 및 연구기관에서는 이 데이터를 활용하여 유연탄 수입 흐름과 주요 수입처별 의존도를 분석하는 데 유용하며, 에너지 안보 연구, 화석연료 수입의 국제 가격 영향 분석, 발전원가 구조 분석 등에 활용될 수 있습니다. 또한 시간별 수입 데이터를 통해 계절별 수입 패턴이나 발전소 연료 운영계획에 대한 시사점을 도출하는 데에도 활용 가능합니다.
