description_portal: 대전광역시 중구 폐의약품 수거함 현황(구분, 주소지, 전화번호, 데이터 기준일자) 정보를 제공합니다.○ 수거함은 가까운 약국에도 설치가 되어 있으나, 수거함이 설치되어 있는 약국 정보를 보유하고 있지 않아 보유 자료만 제공하는 것을 양해 부탁드립니다.○ 일부 약국의 경우, 약국 운영 현황에 따라 폐의약품을 미수거할 수 있습니다.○ 공공기관의 경우, 운영시간 내(평일 09:00~18:00)에 배출 가능합니다.○ 의료기관에서 발생한 폐의약품은 배출 불가하며, 가정에서 배출된 폐의약품만 배출 가능합니다.○ 폐의약품은 포장재(종이, 플라스틱 등)을 제거하여 약품만 모아 배출 바랍니다.○ 대전광역시 중구 약국 현황은 중구청 홈페이지 사전정보공개란을 통해 정보제공됩니다.
