summary_user: 대전광역시 중구 안에 설치된 폐의약품 수거함의 위치를 수거함(설치 장소) 한 곳당 한 행으로 담은 파일로, 설치 장소 구분·주소·전화번호·데이터 기준일자로 구성된다. 중구 주민이 집에 남은 약을 가까운 행정복지센터 같은 공공기관 어디에 버릴 수 있는지 찾을 때, 또는 분석가가 구 단위 수거 거점 분포를 살필 때 쓴다. 공통 조인 키나 코드표가 없어 다른 데이터와는 주소를 지오코딩하거나 이름을 맞춰 붙여야 하며, 다른 지자체의 같은 종류 수거함 파일과는 같은 항목끼리 이어 붙여 쓴다.
limits: 중구 한 개 구의 수거함만 담고, 기관이 보유한 자료만 제공해 수거함이 설치된 약국 상당수는 빠져 있다. 좌표 필드가 없어 지도에 올리려면 주소를 변환해야 하며, 수거량이나 처리 현황 같은 통계는 담지 않는다.
