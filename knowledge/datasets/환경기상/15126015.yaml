description_portal: 내장산국립공원에서 수행된 공원자원조사 결과 중 **곤충류(Insecta)**에 해당하는 생물자원 정보를 수록한 자료로, 국립공원 내 곤충 분포 현황과 생물다양성 평가를 위한 기초 자료로 활용됩니다. 주요 항목에는 국립공원명, 분류군(곤충류), 종명(영문), 학명(영문), 분류명(국문), 조사 위치 정보(경도·위도 좌표), 조사일자, 개체수, 채집 또는 관찰 방식 등의 정보가 포함되며, 조사 기준년도에 따라 정기적으로 갱신됩니다. 본 데이터는 멸종위기 야생생물, 외래종, 고유종 등을 포함한 곤충 분포의 공간적·정량적 분석, 생태계 건강성 모니터링, 보전대상종 서식지 지정, 생태 교육자료 개발, 공원해설 콘텐츠 구성 등 다양한 목적에 활용됩니다. 데이터는 CSV 포맷으로 제공되며, 생물자원통합관리시스템(NP-BIMS) 및 GIS 기반 공간분석 플랫폼과 연계하여 활용 가능합니다.
