summary_user: 전국 생태하천복원사업을 사업 단위로 정리한 파일로, 사업 번호·사업 목적·사업 내용·주민만족도를 담는다(약 257KB CSV, 활용신청 없이 받음). 지자체 담당자나 환경 분석가가 "우리 지역 하천 복원사업은 무엇을 목적으로 했고, 주민 만족도는 어땠나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 하천·수질 데이터와는 사업명·하천명 같은 이름 매핑으로만 이어 쓴다.
