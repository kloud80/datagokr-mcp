description_portal: 생태하천복원사업이란, 우리나라 전국 각지의 하천들을 깨끗하고 건강한 본래의 하천으로 복원하는 사업입니다. 1987년 하천의 수질개선을 위한 ‘오염하천정화사업’으로 시작되었으며, 본 시스템에서는 ‘생태하천복원사업’ 개념이 도입된 2002년부터의 사업정보를 담고 있습니다.생태하천복원사업은 우리나라에서 1987년에 시작되어 현재에도 지속적으로 이루어지고 있으며 각 지자체에서 수집한 자료들을 기반으로, 생태하천복원사업 정보시스템에서는 생태·환경·하천 등 다양한 분야에 어우르는 컨텐츠 자료와 함께 정확하고 신뢰성 있는 데이터들을 선별하여 국민들이 보다 효율적으로 정보를 접할 수 있도록 제공하고 있습니다.국가 사업으로 추진중인 생태하천 복원사업의 기초 데이터로서 개별 사업 개요와 추진 내용, 만족도 조사 결과 등을 제공합니다.
