description_portal: 장마는 우리나라 6월 하순부터 7월 하순까지 계속해서 많이 내리는 비로 기상학적으로는 장마전선의 영향을 받아 비가 오는 경우를 의미합니다.통계값을 산출함에 있어 '지역/지점'의 '지역'은 전국 및 광역 단위의 평균 제공(1973년~)합니다.전국 및 광역별 평균 산출에 사용되는 지점은 62개 지점이며 제주도 4개 지점은 제주지역 산출에만 사용됩니다.단, 관측개시일 및 자료량을 고려하여 6개소(철원, 안동, 창원, 태백, 장수, 봉화)는 1990년 통계부터 반영되어 62개소이며, 1989년 이전에는 56개소로 산출합니다.
