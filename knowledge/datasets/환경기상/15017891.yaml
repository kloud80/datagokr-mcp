summary_user: 서울 관악구 안에 설치된 가로 휴지통의 위치를 한 지점당 한 행으로 담은 원천 목록으로, 설치동·설치주소·상세위치로 구성된다. 주민이 우리 동네 버스정류장이나 역 출입구 근처에 휴지통이 있는지 찾거나, 구청·분석가가 동별 휴지통 분포를 보고 추가 설치가 필요한 곳을 검토하는 데 쓴다. 전역 조인 키나 좌표는 없어서, 다른 데이터와는 설치동 이름이나 주소 문자열을 맞추거나 주소를 좌표로 바꿔서 이어 쓴다.
