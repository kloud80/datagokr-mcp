summary_user: 일반대기환경측정망 측정소별로 1시간 단위로 측정한 아황산가스·이산화질소·오존·일산화탄소·미세먼지·초미세먼지 확정 자료를 하루 단위로 평균한 농도를 담으며, 범위는 전국이고 시도·도시·군구로 위치를 구분한다. 분석가나 연구자가 '우리 지역 측정소의 초미세먼지 일평균 농도가 지난 기간 동안 어떻게 변했나'처럼 확정치 기반의 일별 대기질 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 측정소코드·측정소명이나 시도·군구 이름 매칭으로 에어코리아 측정소 정보, 실시간 대기질 자료, 기상 관측 자료와 이어 쓴다.
description_portal: '대기환경보전법에서 정의하는 대기오염물질이란 대기에 존재하는 물질 중 대기오염의 원인으로 인정된 물질을 의미하며 독성, 생태계, 배출량, 환경기준에 대비한 오염도 등의 기준에 따라 심사 평가위원회를 두어 정한다. 지정된 물질은 아황산가스(SO2), 이산화질소(NO2), 오존(O3), 일산화탄소(CO), 미세먼지(PM-10), 초미세먼지(PM-2.5)을 포함한 64종으로 정하고 있으며, 이 중 카드뮴을 포함한 35종 물질은 특정대기유해물질로 정하여 관리하고 있다. 대기환경기준 항목은 환경정책기본법 시행령 제2조 별표 1과 같으며, 세부적인 측정방법은 대기오염공정시험방법을 따른다. SO2는 자외선형광법(ES 01601.1), CO는 비분산적외선분석법(ES 01602.1), NO2는 화학발광법(ES 01603.1), O3은 자외선광도법(ES 01607.1a), PM-10은 베타선법(ES 01605.1b), PM-2.5는 베타선법(ES 01606.2b)을 사용하여 측정한다. 측정소란 설치목적에 따라 대기오염물질을 측정하기 위해 필요한 시설, 장비를 갖춘 한 개의 단위를 의미하며, 대기환경측정망은 동일한 설치목적을 가진 측정소의 모임을 의미한다.본 데이터는 일반대기환경측정망에서 1시간 단위로 측정된 가스상태 오염물질(아황산가스, 이산화질소, 오존, 일산화탄소)과 입자상태 오염물질(미세먼지, 초미세먼지)의 확정 자료를 측정소별 일 단위로 평균한 농도입니다.* -999는 유효 자료 획득률이 75% 미만인 농도를 의미함* 단위 : 아황산가스(ppm), 이산화질소(ppm), 오존(ppm), 일산화탄소(ppm), 미세먼지(ug/m3), 초미세먼지(ug/m3)'
