summary_user: 김해시 관내 음식물류폐기물 수거용기 판매소를 업소 한 곳당 한 행으로 담은 파일로, 지역명·업소명·도로명/지번 주소·연락처·40리터 용기 판매 여부·위도·경도를 포함한다. 김해시 주민이나 사업자가 "집 근처에서 음식물 수거용기, 특히 40리터 용기를 파는 곳이 어디인가"를 찾을 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 좌표(위도·경도)로 위치를 맞추거나, 같은 기관이 낸 종량제봉투 판매소·수거함 같은 다른 배출·수거 지점 파일과 지역명으로 이어 쓴다.
limits: 김해시 한 곳의 판매소 위치 목록일 뿐이며, 음식물류폐기물 발생량이나 처리 현황 통계는 담지 않는다. 행정 코드 같은 공통 키가 없어 다른 지자체 파일과 합칠 때는 이름·주소로 직접 맞춰야 한다.
