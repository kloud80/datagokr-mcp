summary_user: 국립낙동강생물자원관 담수생물자원은행이 분양 중인 원핵생물 배양체를 자원 한 건씩 담은 목록 파일로, 은행자원번호·학명·분리원·배양 배지·배양 온도·산소요구성으로 구성되며 범위는 전국·비공간입니다. 미생물 연구자나 교육기관이 특정 분리원에서 나온 균주나 호기·혐기 조건에 맞는 배양체를 찾아 분양 대상과 배양 조건을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학명 같은 이름 매핑이나 같은 기관의 자원번호 체계로만 이어 쓴다.
description_portal: 국립낙동강생물자원관에서는 담수생물자원의 보존과 활용 촉진을 위해 분양 중인 원핵생물 배양체 정보를 공공데이터로 개방하고 있습니다.개방 데이터는 은행자원번호, 학명, 분리원, 배지, 온도, 산소요구성 등으로 구성되어 있습니다. 학계·연구기관은 원핵생물 배양체의 분리원 특성, 생리적 생장 조건, 산소요구성 등을 분석하여 환경 미생물 연구, 생물 정화 기술, 산업용 미생물 소재 개발 등에 활용할 수 있습니다.교육·문화기관은 해당 데이터를 활용하여 미생물 생태, 생물다양성, 생명과학 실험 콘텐츠 개발 및 체험활동 자료로 구성함으로써 흥미롭고 실질적인 생물자원 교육 프로그램 운영에 기여할 수 있습니다. 지자체 및 관련 기관은 분리원 기반의 지역 생물다양성 정보를 바탕으로 지역 특화 미생물 산업 육성, 미생물자원 기반 관광 콘텐츠 개발, 협력 네트워크 구축 등에 활용할 수 있습니다. 자세한 정보는 국립낙동강생물자원관 담수생물자원은행 홈페이지(fbp.nnibr.re.kr/fbcc) 에서 확인하실 수 있습니다.
