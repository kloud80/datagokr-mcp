description_portal: '본 데이터는 부산교통공사의 연도별 온실가스 배출 현황 및 에너지 사용량 정보를 정리한 자료입니다.직접배출량(연료연소 등)과 간접배출량(전기 사용 등)으로 구분된 온실가스 배출 총량을 제공하며, 연료 사용량, 전기 사용량, 스팀 사용량 등 에너지원별 소비량도 함께 포함되어 있습니다. 또한 연간 온실가스 배출 총량과 사업장 분류(소량배출사업장 여부) 정보도 함께 수록되어 있어 온실가스 감축 정책 수립 및 지속가능경영 실현을 위한 기초자료로 활용할 수 있습니다. 해당 데이터는 에너지 효율 분석, 배출량 추세 파악, 탄소중립 이행 점검, 공공부문 환경정보 공개 등 다양한 행정·연구 목적에 활용될 수 있는 환경분야 핵심 공공데이터입니다.* 매년 온실가스 배출정보는 2년 후 확정* 데이터 단위 안내 - 온실가스 단위: tCO2-eq - 전기, 연료 에너지 단위: TJ'
