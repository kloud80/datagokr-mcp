description_portal: 국립공원공단_서식환경 데이터는 전국 국립공원 내의 다양한 생물종이 서식하는 환경에 대한 정보를 체계적으로 관리하는 자료입니다. 서식환경의 서식환경분류, 서식환경명, 위치명, 주소, 경도, 위도, 국립공원명 등의 항목으로 구성되어 있으며, 국립공원 내 생태계 보전과 생물다양성 관리, 환경영향평가, 학술 연구, 정책 수립 및 자연자원 모니터링 등의 기초자료로 활용됩니다. 서식환경 정보는 생물다양성 유지, 훼손지 복원, 멸종위기종 보호,  생태계 관리 등  생태계 보전 기초자료에 활용될 수 있습니다.
