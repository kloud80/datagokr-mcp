description_portal: 서울특별시 중랑구의 사업장폐기물 배출자 신고현황 자료(사업장,소재지)입니다. 데이터구성은 상호명,폐기물종류,사업장도로명주소,데이터기준일자입니다.상호명은 사업장폐기물 배출자 신고한 업체명입니다.폐기물종류는 사업장일반폐기물 가운데 배출자 신고된 폐기물입니다.사업장도로명주소는 사업장폐기물이 배출되는 사업장의 주소를 나타냅니다.약 1년 주기로 업데이트 하고 있으며, 신규 신고된 업체가 추가되거나 기존 업체가 변경신고하여 신고 내용이 바뀌는 경우 또는  폐업하여 없어지는 경우 명단에 변동이 생깁니다.참고해주십시오. 감사합니다.
