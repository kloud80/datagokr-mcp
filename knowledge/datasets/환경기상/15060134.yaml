summary_user: 서울 중랑구에 사업장폐기물 배출자로 신고한 업체를 사업장 한 곳당 한 행으로 담은 명단 파일로, 상호·신고된 사업장일반폐기물 종류·사업장 도로명주소·데이터기준일자가 들어 있다(약 10KB CSV). 주민이나 사업자가 '우리 동네 어느 업체가 어떤 사업장폐기물을 배출한다고 신고했나'를 확인하거나, 분석가가 구 단위 배출 사업장 분포를 지도에 올릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명주소를 맞춰 붙여야 하며, 주소를 지오코딩해 좌표 기반으로 다른 시설 데이터와 겹쳐 보는 방식이 현실적이다.
limits: 배출자 신고 명단일 뿐 폐기물 발생량이나 처리 실적 통계는 담지 않는다. 사업자번호 같은 공통 식별자가 없어 다른 기관 데이터와 정확히 연결하기 어렵다. 범위는 중랑구 한 곳이다.
