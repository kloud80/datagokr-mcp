description_portal: 해당 데이터는 서울시 빗물관리시설 통계 데이터입니다. 서울시 빗물관리시설의 투수성포장, 침투측구, 침투트렌치, 원형침투통 등 설시시설물의 유형에 대하여 자치구별로 개소 면적 연장 대책량 등 시설 재원값을 통계로 제공합니다. 데이터는 대장관리번호, 시설물 종류 코드, 코드명, 수량, 면적(㎡), 연장(m), 빗물 관리량, 저류 용량, 자치구코드, 자치구명, 준공일으로 구성되어 있습니다.※ 제공부서는 서울특별시 물순환정책과, 자치구 인허가부서(치수과 등)입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
