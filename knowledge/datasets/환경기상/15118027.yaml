summary_user: 경기도 평택시에서 토양환경보전법상 특정토양오염관리대상시설로 관리되는 주유소 등 시설을 한 곳씩 상호명·도로명/지번주소·위도·경도로 담은 개별 시설 목록 파일이다. 평택에서 토지나 건물을 알아보는 사람이나 분석가가 '이 필지 주변에 지하 유류탱크를 둔 토양오염 우려 시설이 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 주소 문자열 매칭이나 위도·경도 좌표로 다른 공간 레이어(필지·환경 규제 주제도)와 겹쳐 쓴다.
description_portal: '이 데이터는 「토양환경보전법」에 따라 특정 토양오염 가능성이 있는 시설로 지정된 주유소 등 경기도 평택시 내 오염관리대상시설의 현황을 정리한 자료입니다. 상호명, 주소, 위도, 경도 등의 항목으로 구성되어 있습니다. 대부분의 시설은 지하 유류 저장탱크를 보유한 주유소이며, 토양 내 유류 성분 누출로 인한 오염 우려가 있어 지속적인 환경 관리가 요구됩니다. 각 시설은 고유의 신고번호를 통해 환경행정상 등록되어 있으며, 대형 브랜드 및 개인 운영 업체가 혼재되어 있습니다.※ 문의 : 평택시 생태하천과(031-8024-5064)'
