summary_user: 충청북도 제천시 읍면동 환경담당자에게서 모은 쓰레기 상습 불법투기 지역을 지점 한 곳당 한 행으로 담은 파일(csv, 약 11KB)이며, 투기 위치 설명·지번주소·관할기관·관리기관 전화번호를 함께 싣는다. 주민이 '우리 동네 어디가 상습 투기 지역이고 신고는 어느 기관에 하나'를 확인하거나, 분석가가 제천시 안에서 불법투기 지점의 분포를 볼 때 쓴다. 전역 조인 키는 없어서 지번주소를 지오코딩하거나 시군구명·관할기관명(읍면동) 이름으로 수거함·종량제 판매소 같은 다른 폐기물 지점 데이터와 맞춰 이어 쓴다.
description_portal: 충청북도 제천시의 각 읍면동 쓰레기상습불법투기 지역에 대한 정보로 읍면동의 환경담당자들로부터 데이터를 취합하여 한번에 등록한 데이터입니다. 해당 데이터의 구성은 연번, 시군구명, 투기위치, 지번주소, 관할기관명, 관리기관전화번호, 데이터기준일자 등을 포함하고 있으며, 지속적인 환경개선과 행정관리를 위해 활용이 가능한 공공데이터입니다. 이 자료는 데이터 분석 및 정책수립 활용에 유용함으로써 많은 이용 바랍니다.(해당 내용에 맞지 않는 부분이 있으시다면 공공데이터 포털에서 오류신고를 해주시기 바랍니다.)다만 해당 데이터를 취합할 당시(2025~26년) 의림지동은 불법 투기지역이 존재하지 않는다고 회신이 왔으므로 데이터 목록에 의림지동의 불법투기지역에 대한 내용이 없는 것은 오류가 아닌 정확한 내용이니 데이터를 활용함에 있어 참고해주시기 바랍니다.
