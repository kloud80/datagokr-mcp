description_portal: '과거기간(1933~2006년) 지상 및 고층 일기도를 스캔한 자료입니다.종이일기도는 기상관측소에서 측정한 기압, 기온, 풍향, 풍속 등 기상요소를 그림으로 표시한 지도로써 고기압, 저기압, 바람의 방향 · 세기, 구름의 양 등의 기상정보가 있습니다.과거 일기도를 스캔한 자료를 조회하고 다운로드 받을 수 있습니다.* 지상일기도(ASAS) : 1933년~1985년* 극동아시아일기도(ASFE) : 2000년~2006년* 고층일기도(AUAS) : 1956년~2006년 (단, 시작년도는 고도별로 다름)* 북반구일기도(AUXN) : 1956년~2003년 (단, 시작/종료년도는 고도별로 다름)'
