description_portal: 월별 사행성 게임기 및 사행성PC 인수, 자원화량 데이터는 검찰 및 경찰이 압수한 물품을 한국환경공단이 인수한 양과 한국환경공단에서 자원화 목적으로 출고한 양을 나타내는 데이터입니다.압수물품은 사행성게임기 및 사행성PC로 구분됩니다.인수는 검찰 및 경찰이 압수한 물품을 한국환경공단 압수물 보관 창고에 입고하는 것을 말합니다.자원화는 검찰 및 경찰의 폐기 촉탁에 의해 한국환경공단이 E-순환거버넌스로 인계하여 폐기하는 것을 말합니다.데이터의 단위는 "대" 입니다.데이터 수집 단위 기간은 1년입니다.해당 데이터는 한국환경공단 압수물자원화관리시스템을 통해 수집된 데이터 입니다.
