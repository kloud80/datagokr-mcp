description_portal: 한전KDN 본사의 2024년 신재생에너지 생산 현황 자료는 월별 발전량(MWh), 발전시간(h), 이산화탄소(CO₂) 저감량(TCO₂)을 포함하고 있습니다. 이 데이터는 본사 내 태양광 발전 설비의 운영성과를 수치로 확인할 수 있게 하며, 전력 자립률과 에너지 효율성 제고 수준을 가늠하는 데 활용됩니다. 특히 CO₂ 저감 실적은 친환경 경영 및 탄소중립 목표 달성에 기여한 정도를 정량적으로 보여주며, ESG 경영 실천의 근거자료로도 중요합니다. 본 자료는 내부 정책 수립은 물론 외부 공시자료, 지속가능경영보고서, 정부 제출용 친환경 실적 보고서 등 다양한 분야에서 활용될 수 있습니다. 향후 설비 확대나 에너지 절감 전략 수립의 기초자료로도 기능하며, 기후변화 대응 및 사회적 책임 이행 측면에서도 가치를 갖습니다.
