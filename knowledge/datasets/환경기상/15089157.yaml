summary_user: 한국환경산업기술원이 발급한 환경성적표지 유효 인증 제품을 인증 건별로 담은 원천 목록으로, 기업명·제품군·인증번호·인증제품명과 함께 자원·탄소·물발자국, 오존층영향, 산성비, 부영양화, 광화학 스모그를 제조전·제조·사용·폐기 단계별 수치로 싣는다. 녹색 조달 담당자나 분석가가 "같은 제품군에서 탄소발자국이 가장 낮은 인증 제품은 무엇이며, 그 배출은 생애주기 어느 단계에 몰려 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 기업명·인증번호 같은 이름·코드 매핑이나 같은 기관의 인증 데이터로만 잇는다.
description_portal: 본 데이터는 한국환경산업기술원이 발급한 환경성적표지(EL) 인증 제품의 유효 인증 현 황을 제공하는 공공데이터입니다. ‘연번’, ‘기업명’, ‘영향범주’, ‘인증번호’, ‘제품군’, ‘인증제 품명’과 함께 자원발자국(총량·단위·제조전·제조·사용·폐기), 탄소발자국(총량·단위·제조전·제조·사용·폐기), 오존층영향, 산성비, 부영양화, 광화학 스모그, 물발자국 등 생애주기 전 과정별 환경영향 지표를 상세하게 계량화하여 수록하고 있으며, 인증 시작일과 종료일 정보도 포함되어 있습니다. 이를 통해 제품군별 인증 유효기간 관리, 기업별 환경영향 비교·분석, 생애주기 영향 평가, 친환경 제품 개발 가이드라인 수립,  녹색 조달 정책 설계, 공급망 환경 모니터링 등 다양한 환경 관리 및 정책 수립 업무에 폭넓게 활용할 수 있습니다.
