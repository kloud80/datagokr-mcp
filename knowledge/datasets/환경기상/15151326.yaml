description_portal: 이 데이터는 마네킹 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지 파일과 같은 이름의 라벨링 텍스트 파일 200개로 구성되어 있으며, ‘images’ 폴더와 ‘labels’ 폴더에 각각 저장되어 있습니다. 이미지에는 다양한 소재, 크기, 자세의 마네킹이 포함되어 있으며, 주로 실내 환경에서 촬영되었습니다. 이미지에는 마네킹의 상반신, 전신, 의류를 착용한 형태 등 다양한 구성이 포함되어 있고, 촬영 각도는 정면, 측면, 후면 등 다양하게 구성되어 있습니다. 라벨링 파일은 YOLO 형식으로 제공되며, 각 마네킹 객체의 위치 정보와 클래스값이 좌표 형태로 기록되어 있어 객체 인식 및 분류 모델 학습에 적합합니다.
