description_portal: '서울특별시 대기질 자료(초미세먼지, 미세먼지) 입니다.2008년 1월부터 2024년 12월 31일까지의 자료로 자치구별 시간 평균 자료(서울시 평균 자료 포함)입니다.본 측정자료는 확정 전 실시간 자료입니다. 참고용으로만 활용 가능하며, 행정 목적으로는 사용할 수 없습니다.자료 문의 : 대기정책과 02-2133-3665이 데이터는 서울시의 대기질 현황을 파악하기 위해 제공되는 시간 단위의 미세먼지(PM-10)와 초미세먼지(PM-2.5) 측정 자료입니다. 자치구별 측정값과 서울시 전체 평균값이 함께 제공되어 지역별 오염도 차이를 확인할 수 있으며, 장기간의 누적 데이터를 통해 계절별·연도별 변화를 분석하는 데 유용합니다. 해당 자료는 실시간 측정치를 기반으로 제공되지만 최종 확정 전 단계의 데이터이므로 참고용으로 활용하는 것이 적절합니다. 연구기관, 정책 담당자, 일반 시민 모두가 활용할 수 있으며, 대기질 개선 정책 수립, 환경 변화 모니터링, 건강 영향 연구 등 다양한 분야에 기초 자료로 쓰일 수 있는 중요한 공공 데이터입니다.'
