summary_user: 해양기상부이와 연안 파고부이가 해수면에서 관측한 파고·파주기 등 해양기상 자료를 관측 지점·시각 단위로 조회하는 전국 범위 API로, 포털 설명상 매시 정시와 30분에 생산된다. 어민·해운·레저 사업자나 분석가가 특정 해역·연안의 시간대별 파고가 얼마였는지 확인하거나 해양 기후·보험 분석의 원천으로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 관측지점 이름·번호를 같은 기상청 코드로 맞춰 연결해야 한다.
