description_portal: '해양기상부이는 해수면에서 해양기상현상을 다양한 기상장비로 측정하고, 그 값을 일정한 물리량으로 변환 · 처리한 후에 위성 등 원격통신을 이용하여 관측 자료를 전송합니다.파고부이는 해양기상부이보다 근해에 설치하여, 연안바다의 복잡한 지형에 의해 국지적으로 서로 달리 나타나는 파고를 관측하는 장비입니다.파고, 파주기 관측의 경우는 해양기상부이와 마찬가지로 해수면에서 파고부이 몸체가 움직이는 가속도를 측정하여 분석합니다.생산주기: 매시 30분 및 정시(00분), 일보유기간: (해양기상부이) 1996년 7월~현재(지점별 상이함) / (파고부이) 2009년 1월~현재(지점별 상이함)'
