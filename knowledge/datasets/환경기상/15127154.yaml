summary_user: 익산시 관내 의류수거함 997곳을 건별로 담은 위치 파일로, 설치장소(도로명주소)·행정동·관리단체·위도·경도를 포함한다. 시민이 집 근처 의류수거함이 어디 있는지 찾거나, 분석가가 동별 수거함 분포를 따질 때 쓴다. 도로명주소(address)와 위도·경도(coord)를 키로 다른 지자체의 수거함·종량제 판매소 같은 배출·수거 지점 파일이나 지도 데이터와 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 익산시 관내에 설치된 의류수거함의 위치 및 운영 현황을 상세히 수집하여 제공하는 자료이다. 의류수거함의 설치장소, 행정동, 관리단체, 위도, 경도 등의 정보를 포함하고 있어 시민들의 편리한 의류 재활용 참여를 지원한다. 해당 자료는 생활폐기물 감축과 지역 사회복지 증진에도 기여한다. 데이터는 정기적으로 업데이트 되어 최신 정보를 반영하며, 이용자의 이해도와 데이터 검색 편의를 높이기 위해 핵심 키워드를 포함한 설명을 제공한다. 이를 통해 익산시민이 보다 쉽게 의류 재활용에 동참할 수 있도록 지원한다.
