summary_user: 광주광역시 5개 자치구(동·서·남·북·광산구) 주택가 주변 의류수거함을 한 개씩 행으로 담은 위치 목록으로, 자치구·설치 동명·설치업체·설치 장소를 제공하며 포털 설명상 총 1,299개(2025년 12월 19일 기준)입니다. 주민이 '우리 동네 헌옷 수거함은 어디에 있나'를 찾거나, 분석가가 자치구·동별 수거함 분포와 설치업체 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 자치구명·동명을 이름으로 맞춰 행정구역 자료나 다른 생활폐기물 배출·수거 지점 파일과 이어 쓴다.
