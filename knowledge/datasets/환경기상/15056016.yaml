summary_user: 제주특별자치도 안에서 유해화학물질을 판매하거나 사용하는 사업장을 한 행에 한 곳씩 담은 원장 파일로, 업종·업체명·주소·취급물질명을 개별 주소 단위로 담는다(csv 약 9KB 규모). 주민이나 지역 안전 담당자가 '우리 동네 근처에서 벤젠·톨루엔 같은 유독물을 다루는 업체가 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 사업장·인허가 데이터와는 업체명·주소를 맞춰 붙이거나 주소를 지오코딩해 위치 기반으로 겹쳐 써야 한다.
description_portal: '제주특별자치도 내 유해화학물질을 다루는 사업장과 관련한 데이터를 제공합니다.항목: 업종, 업체명, 주소, 취급물질명 등*「화학물질관리법」에 의거하여 유해성(有害性)이 있는 화학물질을 제조, 보관ㆍ저장, 운반(항공기ㆍ선박ㆍ철도를 이용한 운반은 제외한다) 또는 사용하는 시설이나 설비*대상: 화학물질(벤젠, 염화에틸, 페놀, 톨루엔, 폼알데하이드 등)자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1174'
