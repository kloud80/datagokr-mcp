description_portal: '본 데이터는 2024년 12월 19일을 기준으로 국립호남권생물자원관 대표홈페이지에 게시된 연구보고서 정보를 정리한 자료입니다. 생물자원의 발굴, 규명, 활용 기반 마련을 위한 다양한 연구 성과를 포함하고 있으며, 연구 관리 및 활용을 위한 기초 자료로 구성되어 있습니다. 각 항목은 연번, 보고서제목, 연구시작일, 연구종료일로 이루어져 있으며, 연번은 1번부터 97번까지 오름차순으로 정렬되어 체계적인 목록 확인이 가능합니다. 보고서제목에는 ‘구축’, ‘조사·발굴 연구’, ‘규명 연구’ 등 다양한 유형의 연구명이 포함되어 있어 연구 성격을 쉽게 파악할 수 있습니다. 연구시작일과 연구종료일은 모두 날짜 형식(예: 2021-11-03)으로 구성되어 있어 기간 분석 및 연도별 연구 현황 파악이 용이합니다. 본 데이터는 연구성과 관리, 연차별 연구분석, 생물자원 정책수립 및 기관 간 정보공유 등에 유용하게 활용될 수 있습니다.'
