description_portal: '남지국민체육센터는 경상남도 창녕군에 위치한 공공 수영장으로, 지역 주민들의 건강 증진과 여가 활동을 위해 운영되고 있습니다. 이 수영장은 창녕군시설관리공단이 관리하며, 다양한 수영 프로그램과 시설을 제공합니다.수영장 시설 및 프로그램1. 수영장 시설: 실내 수영장, 유아용 풀, 다이빙풀 등 다양한 수영 시설을 갖추고 있습니다.2. 프로그램: 어린이부터 성인까지 참여할 수 있는 수영 교실, 다이빙 강습, 수중 운동 프로그램 등이 운영됩니다.3. 운영 시간: 계절과 상황에 따라 변동될 수 있으므로, 사전에 확인이 필요합니다.창녕군시설관리공단 군립수영장 대장균군, 과망간산칼륨소비량, 유리잔류염소, 수소이온농도, 탁도, 비소, 수은, 알루미늄, 결합잔류염소 등 오염도에 대한 데이터를 제공합니다.'
