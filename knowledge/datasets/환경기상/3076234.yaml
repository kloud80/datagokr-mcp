summary_user: 울산광역시 남구 안의 석면 건축물을 건물 한 동씩 담은 파일로, 건물명·세부 위치·도로명 소재지와 석면 건축자재 면적(제곱미터)을 기록한다. 주민이나 보건·환경 담당자가 '우리 동네 어느 건물에 석면 자재가 얼마나 쓰였는가'를 확인하고, 자재 면적이 큰 건물부터 우선 관리 대상을 고르는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 도로명 주소나 건물명을 맞춰 붙여야 한다.
description_portal: 해당 데이터는 지역 내 석면 건축물 현황을 체계적으로 파악할 수 있는 핵심 공공자료입니다. 제공 항목은 건물명, 세부 위치, 소재지(도로명 주소), 석면 건축 자재 면적(제곱미터) 등이 포함되어 있으며, 각 건축물의 위치와 석면 자재 사용 규모를 구체적으로 확인할 수 있습니다. 이를 통해 지자체는 석면 안전 진단, 철거 계획, 주민 건강 보호 대책 수립 등에 활용할 수 있으며, 환경 연구자와 보건 정책 담당자는 석면 노출 위험 분석과 예방 조치 마련에 참고할 수 있습니다. 건물의 석면 자재 면적 정보를 바탕으로 위험 수준을 평가하고 우선 관리 대상지를 정할 수 있으며, 정기적인 데이터 갱신을 통해 최신 건축물 상태를 반영하여 안전관리 체계를 강화합니다. 이 데이터는 도시 환경 안전성 확보와 주민 건강 보호를 위한 중요한 행정 자원입니다.
