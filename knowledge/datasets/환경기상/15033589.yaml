summary_user: 경상남도 함안군 안의 특정토양오염관리대상시설을 시설 한 곳당 한 행으로 상호·주소·연락처와 토양오염도검사 대상 여부를 담은 시군구 단위 파일이다. 주민이나 토지·부지 매입을 검토하는 사업자가 '이 동네에 토양오염 우려 시설이 있는지, 그 시설이 정기 토양오염도검사 대상인지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 상호 이름으로 맞춰 이어 쓰고, 필지·공간 환경 규제 레이어와 함께 볼 때는 주소를 좌표로 바꿔 겹쳐 본다.
limits: 함안군 한 곳만 다루므로 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다. 시설 코드나 사업자번호 같은 공통 키가 없어 다른 데이터와의 연결은 주소·상호 문자열 매칭에 기대야 하며, 오염 측정값 자체는 담지 않고 검사 대상 여부만 담는다.
