description_portal: '경상남도 함안군 특정토양오염관리대상시설 현황 데이터를 제공합니다.특정토양오염관리대상시설: 「토양 환경 보전법」에서, 토양 오염 물질을 생산ㆍ운반ㆍ저장ㆍ취급ㆍ가공 또는 처리함으로써 토양을 오염시킬 우려가 있는 시설ㆍ장치ㆍ건물ㆍ구축물 및 장소.토양오염도검사: 토양에 중금속, 유류, 유기용제, 농약 등 유해물질이 오염되어 있는지를 확인하고, 그 정도를 평가하기 위해 실시하는 조사[법적 근거]토양환경보전법 제8조(특정토양오염관리대상시설의 토양오염검사) ① 특정토양오염관리대상시설의 설치자는 다음 각 호의 구분에 따라 정기적으로 법 제13조제1항에 따른 토양오염검사를 받아야 한다.[데이터 변경 안내]1. 특정토양오염관리대상 시설 현행화(신규시설 및 폐업시설 반영, 현 105곳, 2025.6.13.기준)2. 특정토양오염관리대상 시설 토양오염도검사 대상 유무 현행화(토양오염도검사 면제승인 받은 시설 반영, 2025.6.13.기준)'
