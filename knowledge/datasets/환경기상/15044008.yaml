summary_user: 해양쓰레기 모니터링 2기 조사방법론으로 수집한 결과를 조사 관리번호·연도·지역·차수별로, 쓰레기 분류·재질·상세분류마다 개수를 기록한 전국 범위 파일(CSV)이다. 연구자나 지자체 담당자가 "어느 지역에서 어떤 재질의 해양쓰레기가 몇 개씩 나오는가"를 연도·차수별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름이나 같은 해양환경공단 자료의 관리번호를 맞춰서만 연결한다.
description_portal: 해양환경공단이 제공하는 ‘해양쓰레기모니터링 유형별 자료 2기방법론’ 데이터에 대한 정보를 제공합니다. 본 데이터는 해양쓰레기 발생 현황을 보다 정밀하게 파악하기 위해 2기 조사방법론을 적용한 유형별 모니터링 결과를 포함합니다. 주요 내용에는 조사 정점 위치, 조사 시기, 부유·침적·유입 쓰레기 등 유형별 분류, 발생량, 재질별 특성, 계절별·지역별 분포 경향이 수록됩니다. 또한 발생 원인 분석, 오염원별 기여도 평가, 관리·감축 방안에 대한 기초자료를 제공합니다. 이를 통해 해양쓰레기의 유입 경로 파악과 정책적 대응 전략 수립이 가능하며, 공공기관, 연구기관, 지자체, 환경단체 등에서 해양보전 정책, 자원관리 계획, 환경교육, 연구 분석 등에 폭넓게 활용됩니다.
