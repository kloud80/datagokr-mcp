summary_user: 제주특별자치도에 비점오염원으로 신고된 시설을 사업 한 건 단위로 정리한 목록으로, 사업명·소재지·설치 시설명(종류)·데이터 기준일을 담는다. 환경 담당자나 개발사업 검토자가 "제주 어느 지역에 어떤 비점오염 저감시설을 갖춘 신고 사업장이 있는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 소재지 주소 문자열을 맞추거나 같은 기관(제주특별자치도) 자료끼리만 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도 내에서 ‘비점오염원’으로 신고된 시설들의 현황을 정리한 공공자료로, 신고된 사업장 또는 시설의 명칭, 위치(주소 또는 행정구역), 신고일자, 오염원 유형, 설치된 저감시설 여부 및 형태 등 주요 정보를 포함하고 있다. 비점오염원은 도시, 도로, 농지, 산지, 공사장 등처럼 불특정 장소에서 비점(비지정) 형태로 오염물질이 배출될 가능성이 있는 배출원을 말하며, 해당 시설이 신고되어 있다는 것은 오염 발생 가능성을 사전 관리 대상으로 인식하고 있다는 의미이다. 이 데이터는 지역별 오염 취약 지역 파악, 수질·환경관리 정책 수립, 비점오염 저감시설 설치 현황 분석, 개발 사업의 환경 영향 평가, 주민 건강 및 생활환경 보호 대책 마련 등에 활용 가능한 기초 자료가 된다.
