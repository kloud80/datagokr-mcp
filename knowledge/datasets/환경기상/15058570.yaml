description_portal: 수질은 물이 가지고 있는 화학적, 물리적, 생물학적 성질을 종합적으로 평가한 것을 말합니다. 쉽게 말해, 그 물이 얼마나 깨끗하고 안전하게 사용할 수 있는지를 나타내는 지표입니다.수질의 등급은 먹는 물로 사용가능한 1급수, 생활용수인 2급수, 공업용수인 3급수, 수질오염이 심한 4급수, 심각한 오염의 5급수로 나눕니다.수질은 색깔, 탁도, 냄새, 맛, 온도 등 물리적인 특성와, 산성도, 용존산소, 염분농도, 질산성 질소, 중금속 등 인체에 큰 영향을 주는 화학적 특성, 그리고 대장균, 세균 수 등 미생물 존재여부를 파악하는 생물학적 특성으로 평가를 합니다.개방되는 데이터에는 검사지점, 정수장/배수지/블록 구분, 염도, 탁도, 잔류염소, 수온, 수질상태 등의 데이터가 제공됩니다.
