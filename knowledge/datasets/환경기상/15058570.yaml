summary_user: 부산광역시 상수도의 검사지점별 수질 측정값을 담은 API로, 정수장·배수지·블록 구분과 함께 수소이온농도, 탁도, 잔류염소, 전기전도도, 수온, 수질상태 판정 등을 제공하며 범위는 부산시 전역, 행정단위는 읍면동까지다. 부산 시민이 '우리 동네 수돗물의 탁도와 잔류염소가 지금 괜찮은가'를 확인하거나, 분석가가 구·군 및 행정동별 수돗물 수질 상태를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 구·군명(argGugun)과 행정동명(argHjd) 같은 이름 매핑으로만 행정구역 데이터나 하천·댐 수질 측정 데이터와 연결한다.
limits: 표준 행정코드나 측정소 코드 같은 전역 조인 키가 없어, 다른 데이터와 붙일 때는 구·군·동 이름 매칭에 의존해야 한다. 개발계정은 하루 10,000회 호출로 제한된다.
