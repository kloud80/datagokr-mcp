description_portal: 국립기상과학원의 대외협력 데이터는 기상·기후 정보 공유와 공동 연구 추진을 위한 기관 간 협력 내용을 정리한 자료이다. 여기에는 업무협약을 맺은 국내외 기관명, 협력 분야, 협약일자 내용이 포함되어 있다. 이러한 데이터는 기관이 어떤 파트너십을 통해 기상서비스 및 연구역량을 확장하고 있는지 한눈에 확인할 수 있게 해 주며, 기후 · 기상 분야 정책결정 및 기업활용 측면에서도 참고될 수 있다.- 서귀포시, 제주특별자치도 등 지방자치단체, 서울대학교, KAIST등의 학교, 해군 등 학군관 뿐만 아니라 미국, 독일 등 국외 기관과의 대외협력을 확인할 수 있습니다.- 협력이 종결된 데이터의 경우, 협약명 앞에 (종결)로 표시해 놓았고, 조직개편으로 바뀐 부서는 담당부서명 뒤에 (종)으로 표시했습니다.
