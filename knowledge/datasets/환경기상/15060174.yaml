summary_user: 경상북도 청송군에 신고된 사업장폐기물 배출업소를 업소별로 담은 원장 파일로, 상호·신고번호·대표자·사업자등록번호·신고일과 배출 폐기물 종류, 운반자, 처리업소명, 처리방법, 성상구분을 담는다. 청송군 안에서 어떤 사업장이 어떤 종류의 폐기물을 배출하고 누가 운반·처리하는지 확인하려는 사업자나 분석가가 쓴다. 사업자등록번호(bizno)를 키로 다른 폐기물 처리업 허가 현황이나 사업자 정보 데이터와 이어 쓴다.
description_portal: 경상북도 청송군 사업장폐기물 배출자업소의 상호명, 신고번호, 대표자, 사업자등록번호, 신고일, 폐기물종류, 운반자, 처리업소명, 처리방법, 성상구분 등 사업장폐기물배출자현황 자료입니다.폐기물 종류는 "폐합성수지류(폐염화비닐수지류는 제외한다), 폐흡착제, 음식물류폐기물, 폐콘크리트, 폐토사, 폐수처리오니, 석재ㆍ골재폐수처리오니(석재ㆍ골재 생산 시 발생한 폐수를 처리하는 과정에서 발생한 오니로 한정한다), 그 밖의 폐기물, 하수처리오니, 분뇨ㆍ가축분뇨처리오니, 왕겨 및 쌀겨(「사료관리법」에 따른 사료로 사용하는 경우는 제외한다), 폐합성수지류, 폐목재류 3등급, 폐전주(폐전주를 철거할 때 발생하는 폐애자_ 폐근가 및 폐합성수지제 커버류 등을 포함한다)" 등이 있습니다.
legal_basis_portal: 경상북도 청송군 사업장폐기물 배출자 현황(상호, 폐기물종류, 도로명주소 등)
