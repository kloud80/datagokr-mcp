summary_user: 한국환경공단 소규모 대기배출시설 관리시스템(그린링크)에 등록된 사업장, 사업장의 배출구, 배출구에 연결된 시설 정보를 시설 건별로 담은 전국 단위 파일 데이터입니다(실측 필드는 시설코드·시설명·등록일시). 분석가나 사업자가 IoT 방지시설 관리 체계에 어떤 소규모 대기배출시설이 언제 등록됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 배출원·사업장 데이터와는 시설명 같은 이름 매핑이나 같은 기관 내부 코드(시설코드)로만 연결한다.
