summary_user: "광주지역 지하수 보조측정망 관측정 25곳의 수질검사 결과를 담은 약 4KB 크기의 CSV 파일로, 행은 검사항목(일반오염물질·특정유해물질)과 수질기준이고 열은 측정지점이다. 주민이나 지자체 담당자가 '우리 동네 학교·공원 관측정 지하수가 질산성질소나 총대장균군 생활용수 기준을 넘는지' 확인하는 데 쓴다. 전역 조인 키는 없으므로, 열 이름에 붙은 관측정 코드(예: E-1-a-1-01)나 지점명을 이름으로 맞춰 국가 지하수측정망 등 다른 수질 자료와 대조해야 한다."
limits: 표준 조인 키와 좌표가 없는 비공간 자료여서 다른 데이터와는 지점명·기관 코드 매핑으로만 연결된다. 측정지점이 열로 펼쳐진 형태이고 측정 시점을 나타내는 필드가 없어, 시계열 추이 분석이나 지점별 정리에는 행 전환과 별도 확인이 필요하다.
