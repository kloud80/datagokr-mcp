description_portal: 보조측정망은 국가측정망을 보완하여 광주지역 내의 지하수의 수질 변동실태를 지속적으로 감시할 목적으로 설치 ‧ 운영하고 있습니다.지역 내의에서 지하수의 수질 변동 현황 및 변화 추이 등을 정기적으로 조사 분석한 자료로 지하수 보전 정책 수립을 위한 기초자료로 활용하고 있습니다.측정항목은 지하수 생활용수 검사항목으로 일반오염물질(수소이온농도, 총대장균군, 질산성질소, 염소이온)과 특정유해물질(카드뮴, 비소, 시안, 수은, 다이아지논, 파라티온, 페놀, 납, 크롬, 트리클로로에틸렌, 테트라클로로에틸렌, 1.1.1-트리클로로에탄, 벤젠, 톨루엔, 에틸벤젠, 크실렌)이 있습니다.
