summary_user: 대전광역시 동구에 있는 대기 배출시설 설치 사업장을 한 행에 한 곳씩 담은 파일로, 시설 종별 구분(종)·상호·소재지·업종과 데이터기준일자를 담는다. 주민이나 지역 환경 분석가가 "우리 동네 주변에 어떤 업종의 대기 배출 사업장이 어디에 있나"를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어서, 다른 데이터와는 상호명·주소 문자열을 맞추거나 같은 기관(동구) 자료끼리 이어 쓴다.
description_portal: '이 데이터는 대전광역시 동구에 위치한 대기 배출시설 설치 사업장 정보를 제공하고 있으며, 세부 내용으로는 대기 배출시설 설치 사업장의 상호명, 소재지, 업종 정보를 포함하고 있습니다.해당 데이터는 대기 배출시설 사업장 분포를 한눈에 파악할 수 있고, 지역 환경 관리 및 정책수립에 중요한 기초자료로 활용되며, 지역 주민들의 건강과 환경보호를 위한 대응 체계 구축에도 기여할 수 있습니다.해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 7. 16.'
