description_portal: 11개 한강공원 (각 센터별) 2022년~2023년 월별 쓰레기 처리량 (수거 처리량)광나루한강공원~망원한강공원 (11개 한강공원)서울시 한강공원 총 11개 센터의 쓰레기 처리량 데이터는 2022년부터 2023년까지 매월 수집된 자료로, 광나루, 잠실, 잠원, 반포, 여의도, 양화, 강서, 뚝섬, 이촌, 난지, 망원 등 주요 11개 한강공원 관리 센터에서 발생한 생활폐기물 처리량을 기록하고 있습니다. 각 센터별 월별 처리 실적을 수치로 제공하여 계절별, 공원별 쓰레기 발생 패턴을 비교·분석할 수 있으며, 이를 통해 시민 이용 행태, 환경관리 효율성, 청소 인력 및 장비 배치의 합리적 운영 근거를 마련할 수 있습니다. 또한 추가적으로 ‘기타’ 항목을 포함해 일부 특수 구역의 쓰레기 처리 현황도 함께 확인할 수 있습니다. 본 데이터는 서울시 환경정책 수립, 자원순환 대책 마련, 한강공원 이용객 증가에 따른 쓰레기 관리 개선 등에 활용될 수 있는 기초자료로서 중요한 의미를 갖습니다.
