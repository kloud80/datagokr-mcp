summary_user: 환경영향평가 대상 개발사업별로 지형지질조사 개요를 담은 파일 데이터로, 사업코드 단위로 절토량·성토량, 최대 깎기·쌓기 높이, 최대 옹벽 높이, 지형변화지수, 비옥토 발생량 같은 지형 변경 규모를 기록한다. 분석가나 지역 주민이 '이 개발사업은 땅을 얼마나 깎고 쌓으며, 옹벽은 얼마나 높게 세우는가'를 확인하거나, 사업 간 지형 훼손 규모를 비교할 때 쓴다. 전역 조인 키는 없어서 사업코드(BSNS_CD)를 같은 기관의 환경영향평가 협의 현황·사업구역 데이터와 맞춰 이어 쓰고, 이를 통해 토지이용규제·개발사업 정보와 연결한다.
limits: 실측 컬럼에서 다른 기관 데이터와 공통으로 쓰는 조인 키를 찾지 못했으므로, 연결은 사업코드나 이름 매핑에 의존한다. 갱신은 수시·이벤트 방식이어서 사업 평가 시점에 만들어진 뒤 바뀌지 않는 기록으로 보아야 한다. 확인된 범위는 전국 단위의 비공간 속성표이며, 위치 분석에는 별도 공간 파일이 필요하다.
