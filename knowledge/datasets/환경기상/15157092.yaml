description_portal: 환경부 국립환경과학원의 환경영향평가 사업의 지형지질조사 개요, 조사, 광산, 지질도, 능선축, 표고, 경사, 지층의 속성정보 제공 및 공간정보(조사지점, 광산위치) 제공하는 서비스입니다. 조회정보로는 능선축속성조회, 지층속성조회, 개요속성조회, 조사속성조회, 광산속성조회, 지질도속성조회, 표고속성조회,경사속성조회정보를 제공햡니다. 각서비스의 제공 정보에는 능선축 이격거리(m), 능선축명, 조사지점명, 시추공위치, X/Y좌표정보, 절토량(땅깎기), 최대옹벽 높이 등 다양한 조사정보를 제공합니다. 조사지점에 대한 공간정보는 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.
