description_portal: 수도권매립지 주변 대기오염 실시간 측정정보 자료제공 (2018-01-01 ~ 2018-10-18)이 데이터는 미세먼지(PM10, PM2.5), 황산화물(SO₂), 질소산화물(NOₓ), 일산화탄소(CO), 오존(O₃) 등 주요 대기오염물질에 대한 자동 측정 정보를 포함하고 있으며, 실시간 악취 농도 측정 데이터도 함께 제공합니다. 환경 안전과 주민 건강 보호를 위해 구축된 이 시스템은 대기질 변화에 대한 신속한 대응과 체계적인 환경관리를 가능하게 하며, 데이터는 공공데이터 포털을 통해 쉽게 접근할 수 있어 정책 수립, 연구, 시민 활용 등 다양한 분야에서 활용도가 높습니다. 다만, 현재는 운영되지 않고 있어 과거 데이터 활용 측면에서 이용이 바람직해 보이니 이점 참고해 주시기 바랍니다.
