summary_user: 수도권매립지 주변 측정소에서 2018-01-01~2018-10-18 기간에 자동 측정한 아황산가스·일산화탄소·오존·이산화질소·미세먼지·초미세먼지 농도와 통합대기환경지수·등급을 측정일시·측정소별 건으로 담은 CSV 파일(약 14MB)이다. 매립지 인근 주민이나 연구자가 2018년 당시 매립지 주변 대기질이 시간대별로 어땠는지, 미세먼지 등급이 나빴던 때가 언제인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대기질 자료와는 측정소명이나 측정일시로 직접 맞춰 이어 써야 한다.
limits: 측정소코드 같은 전역 조인 키가 없어 에어코리아 등 다른 측정망 자료와 연결하려면 측정소명 매핑이 필요하다. 포털 설명상 시스템이 현재 운영되지 않아 2018년 10월까지의 과거 자료로만 쓴다.
