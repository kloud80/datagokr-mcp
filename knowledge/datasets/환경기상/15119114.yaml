description_portal: 본 데이터는 한국중부발전 서울발전소에서 수집된 대기 상태 측정 결과를 정리한 자료입니다. 항목은 발전소명, 처리일, 측정항목, 광투과백분율, 최대·최소범위, 검정곡선기울기, 램프강도, 챔버온도, 시료기체유량·압력·온도, 스팬 및 제로기체의값, 교정계수 등으로 구성되어 있습니다. 본 자료는 굴뚝자동측정기기(TMS)를 통해 수집된 실시간 대기환경 데이터를 기반으로 하며, 발전소의 대기오염물질 배출 상태를 과학적으로 진단하는 데 활용 가능합니다. 또한 환경 기준 적합 여부 검토, 배출 설비 점검, 교정 이력 관리, 대기질 통계 보고 등에도 활용 가능합니다.
