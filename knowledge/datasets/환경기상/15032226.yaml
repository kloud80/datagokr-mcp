summary_user: 광주 광산구 관내 폐수배출시설 사업장을 한 업소당 한 행으로 담은 파일로, 업종·업체명·주소·등록일자와 하루 폐수배출량 규모에 따른 종별 구분(1종~5종, 배출량단위)을 담는다. 주민이나 사업자가 우리 동네 주변에 어떤 폐수배출 사업장이 있는지, 하루 배출량이 큰 1~3종 사업장은 어디인지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 수질 오염원·측정 데이터와는 주소나 업체명으로 맞춰 연결해야 한다.
description_portal: 광주광역시 광산구 관내에 위치한 폐수배출 관련 업소 현황(업종, 업체명, 주소, 배출량 단위(종), 등록일자, 데이터기준일자)을 제공합니다.배출량 단위는 폐수배출시설의 규모를 나타내는 것으로 하루 50세제곱미터의 폐수배출량 미만은 5종, 하루 50세제곱미터 이상 200세제곱미터 미만의 폐수배출량은 4종이 된다 하루 200세제곱미터 이상 700세제곱미터 미만의 폐수배출량은 3종, 하루 700세제곱미터 이상 2,000세제곱미터 미만의 페수배출량 사업장은 2종, 하루 2,000세제곱미터 이상 폐수배출량 발생 사업장은 1종이 된다
