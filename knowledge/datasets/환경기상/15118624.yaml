summary_user: 한국가스공사 천연가스 배관망에 수소를 부피 기준으로 섞을 때, 혼입농도별 연간 천연가스 사용량·수소 필요량·온실가스 배출감축량(톤 단위)을 담은 계산표로, 전국 단위·비공간의 790바이트 CSV 한 개입니다. 에너지 정책 담당자나 탄소중립 연구자가 '배관에 수소를 몇 % 섞으면 수소가 연간 얼마나 필요하고 온실가스는 얼마나 줄어드는가'를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 수소혼입농도 값이나 같은 기관(한국가스공사) 기준으로만 맞대어 쓴다.
description_portal: 본 데이터는 KOGAS 천연가스 고압 배관망에 수소를 부피 기준으로 혼입할 때의 수소 필요량 및 온실가스 배출감축량 계산 결과를 제공합니다. 수소경제 전환에 따른 기존 가스 인프라 활용 가능성 분석을 목적으로 작성되었습니다. 데이터의 세부 항목으로는 수소혼입률별 천연가스 감축량, 수소 필요량, 온실가스 배출감축량, 계산 가정조건, 열량환산 기준, 배관안전성 검토결과 등이 포함되어 있습니다. 본 데이터는 에너지 정책 담당자, 수소산업 연구기관, 배관운영사, 탄소중립 정책 연구자, 친환경에너지 기관, 수소융합얼라이언스가 수소-천연가스 혼합 활용 가능성 검토에 활용할 수 있으며, 탄소중립 달성과 수소 인프라 구축 전략 수립에 기여할 것으로 기대됩니다.
