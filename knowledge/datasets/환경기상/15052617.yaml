summary_user: 한국환경산업기술원이 인증·검증한 환경신기술을 기술 한 건당 한 행으로 담은 전국 단위 파일(CSV, 약 130KB)로, 구분·상태·분야 대·소분류·기술보유자·기술명·인증번호·검증번호를 기록한다. 환경설비 발주처나 기업 담당자가 특정 분야에 인증받은 신기술이 무엇이고 누가 보유하는지, 지금 유효한 상태인지 확인할 때 쓴다. 인증번호와 검증번호가 환경신기술 번호 키(env_new_tech_cert_no)로 잡혀 있어, 같은 번호 체계를 쓰는 다른 환경신기술·환경 인증 데이터와 이어 쓴다.
description_portal: 이 데이터는 한국환경산업기술원에서 환경신기술 인증 및 검증 관련 정보를 제공하는 공공데이터입니다. 보유기업, 기술명칭, 기술보유자명, 인증번호, 검증번호 등 총 9개의 필드를 포함 하여 기술별 인증·검증 현황을 기록합니다. 이를 통해 산업 현장에서 보유 기술 현황 파악, 인증 검증  절차 이력 관리 및 기술 포트폴리오 분석이 가능하며, 정책 입안자와 기업은 데이터를 활용하여 기술 경 쟁력 강화 및 협력 기회 발굴에 활용할 수 있습니다. 또한 인증 및 검증 이력은 연구 개발 성과 평가의  핵심 지표로 활용됩니다.
