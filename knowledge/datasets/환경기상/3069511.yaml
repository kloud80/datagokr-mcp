summary_user: 부산광역시 북구 안의 특정토양오염관리대상시설을 시설 한 곳당 한 행으로 담은 작은 CSV 파일(1,491바이트)로, 상호·소재지 주소·완공일자·사업장 전화번호가 들어 있다. 토지 매입이나 개발을 검토하는 사업자나 주민이 '이 동네에 토양오염 관리 대상 시설(주유소 등 저장시설)이 어디에 있고 언제 지어졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소를 지오코딩하거나 상호·주소 문자열로 맞춰 이어 쓰며, 필지 단위 환경 규제 레이어와 함께 볼 때도 같은 방법을 쓴다.
limits: 공통 식별 키가 없어서 다른 데이터와 연결하려면 주소나 상호를 직접 매칭해야 한다. 범위는 부산 북구 한 곳뿐이고 좌표 컬럼이 없어서, 지도에 올리려면 주소를 변환해야 한다. 오염도 측정값이나 점검 결과는 담고 있지 않다.
