description_portal: '전국오염원조사시스템  폐수배출업소의 배출시설별 기타오염물질인 생물학적산소요구량, 화학적산소요구량, 총부유물질, 총질소, 총인, 총유기탄소 항목에 대한 처리전 농도(발생원단위)를 작성한 자료이며, 배출허용기준지역에 따라 배출시설별 기타오염물질 항목의 발생원단위는 상이하다. 폐수배출업소 자료 작성 시 소재지에 따라 배출허용기준지역의 배출시설별 각 오염물질 발생 농도값을 선택 작성 할 수 있다. 해당 농도의 단위는 mg/l이다.* 배출허용기준지역 : 지정된 배출허용기준적용지역을 사업장이 위치하고 있는 기준으로 청정, 가, 나, 특례지역으로 구분(물환경보전법 제32조, 환경부고시 등)'
