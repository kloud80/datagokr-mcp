summary_user: 청주시 무인악취수집시스템의 IoT 센서가 자동 수집한 측정값을 센서명·수신일시별 건별 원천으로 담으며, 복합악취·황화수소·암모니아·휘발성유기물·트리메틸아민·메틸메르캅탄 등 악취물질과 미세먼지(PM2.5·PM10)·황산화물·질소산화물 농도를 포함한다(CSV 약 80MB). 악취 민원이 잦은 지점에서 어느 시간대에 어떤 물질 농도가 높아지는지 확인하려는 주민·지자체 담당자·환경 분석가가 쓴다. 전역 조인 키가 없어 센서명이나 수신일시를 기준으로 에어코리아 측정소 자료나 기상 관측 자료와 이름·시간을 맞춰 붙여 써야 한다.
description_portal: 청주시는 생활환경 개선과 악취 민원 대응을 위해 무인악취수집시스템을 운영하고 있으며, IoT 기반의 첨단 센서를 통해 다양한 대기오염 및 악취 관련 데이터를 자동으로 수집하고 있습니다. 이 시스템에서 제공하는 데이터는 센서유형, 센서명, 수신일시를 비롯해 복합악취, 황화수소, 암모니아, 휘발성유기화합물(VOCs), 에탄올, 트리메틸아민, 메틸메르캅탄, 염소 등 주요 악취 유발 물질의 농도 정보를 포함합니다. 또한 미세먼지(PM2.5, PM10), 황산화물, 질소산화물 등 대기질 관련 항목도 함께 제공되어, 악취 발생 원인 분석과 지역별 환경 모니터링, 정책 수립 등에 폭넓게 활용됩니다.
