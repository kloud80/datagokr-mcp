description_portal: 환경책임보험 전산망에서는 환경오염 관리 및 보험 가입 현황을 종합적으로 파악하기 위해 다양한 시설별 정보와 관할지역 구분을 포함한 통계 데이터를 관리합니다. 통계기준일자는 해당 통계가 산출된 기준 날짜로, 데이터의 최신성과 시점을 명확히 합니다. 책임/보장계약구분은 보험 계약의 유형을 구분하여 책임보험인지 보장성 보험인지를 구별합니다.환경 시설별로는 대기시설 보유유무, 대기관할지역구분, 대기시설 종별을 비롯하여, 수질시설 보유유무, 수질관할지역구분, 수질시설 종별, 폐기물시설 보유유무, 폐기물관할지역구분, 토양시설 보유유무, 토양관할지역구분, 화학시설 보유유무, 화학관할지역구분, 해양시설 보유유무, 해양관할지역구분 등이 포함되어 각 사업장의 환경오염 관련 시설 현황과 그에 따른 행정 관할 지역을 구분합니다.마지막으로, 건은 해당 조건에 부합하는 사업장이나 시설의 수를 의미하며, 이를 통해 시설별 분포 현황 및 보험 적용 범위를 통계적으로 분석할 수 있습니다. 이러한 종합적인 데이터 관리는 환경책임보험의 효과적인 운영과 정책 수립에 필수적인 기반 자료로 활용됩니다.
