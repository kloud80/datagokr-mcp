description_portal: 서울특별시 마포구 관내 의류수거함 수거량 현황에 대한 정보입니다.이 데이터는 2022년 1월 1일부터 2022년 12월 7일까지 마포구 내 설치된 의류수거함에서 수거된 폐의류의 총량(kg 단위)에 대해 집계한 자료입니다. 이를 통해 연간 의류 회수 실적을 기반으로 정책 효과를 정량 평가할 수 있으며, 주민의 참여도와 자원순환의 성과를 동시에 모니터링하는 시스템 구축이 가능합니다.이는 궁극적으로 의류 폐기물 감축과 재활용률 향상, 나아가 지속가능한 도시 환경 조성에 기여합니다.
