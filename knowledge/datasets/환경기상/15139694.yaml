description_portal: 한국동서발전에서 오픈API 형태로 제공하는 '발전소 주변 기상 및 대기질 정보 조회' 데이터입니다. 이 데이터는 연도, 기준항목, 미세먼지(㎍/㎥), 초미세먼지(㎍/㎥), 오존(ppm), 이산화질소(ppm), 아황산가스(ppm), 일산화탄소(ppm) 등의 항목으로 구성되며, 자동화된 수집과 시스템 연계를 통해 효율적인 환경 감시 및 분석이 가능합니다. 학계 및 연구기관에서는 발전소 인근의 대기오염 수준 분석, 기상조건과 대기질의 상관관계 연구, 오염물질 확산 모델링, 환경정책 수립 자료, 공공기관의 환경 모니터링 체계 사례 연구 등 다양한 환경공학 및 정책분야 연구에 활용될 수 있습니다.
