summary_user: 한국동서발전 발전소 주변의 대기질을 연도와 기준항목별로 담은 집계 데이터로, 미세먼지·초미세먼지(㎍/㎥)와 오존·이산화질소·아황산가스·일산화탄소(ppm) 농도를 제공한다. 지역 주민이나 환경 연구자가 '발전소 인근의 미세먼지와 아황산가스 농도가 해마다 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 항목 이름을 맞춰 연결해야 하며, 같은 기관의 다른 발전소 데이터와만 코드로 이어 쓸 수 있다.
limits: 실측 컬럼에 측정소코드나 행정구역 코드 같은 공통 키가 없다. 그래서 에어코리아 측정소 데이터나 지역별 통계와 바로 붙일 수 없고, 이름이나 연도를 맞춰 연결해야 한다. 범위가 전국·비공간으로 분류되어 있어 측정 위치별 공간 분석에는 맞지 않는다.
