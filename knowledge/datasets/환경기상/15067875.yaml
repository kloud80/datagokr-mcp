description_portal: 본 데이터는 한국환경산업기술원의 환경정보시스템에서 유형별·지역별로 등록된  기업 현황을 제공하는 공공데이터입니다. ‘유형별’(행정·서비스·산업 등)과 지역 구분 항목으로 공공행정, 교육서비스, 기타산업, 기타서비스, 보건, 제조 분야별 등록 기업 수 및 전체 합계를 집계하여 각 유형·지역의 기업 분포를 파악할 수 있도록 구성하였습니다. 사용자들은 업종별·지역별 환경산업 생태 계 분석, 투자유치 전략 수립, 지역 협업 네트워크 구축, 정책 지원 대상 선정, 지역 경제 활성화 방안  도출 등에 활용할 수 있으며, 등록 기업 현황을 기반으로 기술 수요 조사, 인프라 분석, 기업 지원 프로 그램 설계 등 다양한 연구·보고서 작성에 기초 자료로 활용 가능합니다.
