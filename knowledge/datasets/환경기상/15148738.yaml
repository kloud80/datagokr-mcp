summary_user: 수원시 대형폐기물 배출 스티커를 파는 판매소를 한 곳씩 담은 파일로, 상호명·전화번호·행정구·행정동·도로명주소·배출구분이 들어 있다. 대형 가구나 가전을 버리려는 주민이 '우리 동네에서 스티커를 어디서 살 수 있나'를 찾을 때나, 지도·앱 서비스에 판매소 위치를 올릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 도로명주소를 맞춰 잇거나, 같은 수원시의 대형폐기물 품목·수수료 파일과 지자체 단위로 함께 본다.
limits: 표준 코드나 좌표 컬럼이 없어 다른 데이터와는 이름·주소 매핑으로만 연결되고, 지도에 올리려면 주소를 좌표로 바꾸는 작업이 따로 필요하다. 범위는 수원시 한 곳이며 판매량이나 배출량 같은 통계는 담지 않는다.
