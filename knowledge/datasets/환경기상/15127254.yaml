description_portal: '이 데이터는 경상북도 봉화군에 설치된 의류수거함의 위치 및 관리 정보를 제공하는 공공데이터입니다. 의류수거함은 지역 주민들이 사용하지 않는 의류를 손쉽게 기부할 수 있도록 설치된 시설로, 재활용 활성화와 자원 순환 사회 구축에 기여하고 있습니다. 본 데이터에는 각 의류수거함의 관리번호, 설치된 읍·면 구분, 구체적인 주소, 위도와 경도 좌표가 포함되어 있어 정확한 위치를 파악하는데 도움을 주고 있습니다. 이를 통해 행정기관은 수거함 관리 및 점검을 체계적으로 수행할 수 있으며, 주민들은 가까운 수거함의 위치를 쉽게 확인할 수 있습니다. 또한 데이터 기준일이 포함되어 있어, 수거함 정보가 어느 시점을 기준으로 제공되는지 확인할 수 있습니다. 본 데이터는 자원 재활용 정책, 환경 관리, 주민 편의 서비스 개선 등 다양한 분야에서 활용 가치가 클 것으로 보고있습니다.[컬럼별 항목 설명]관리번호 : 각 의류수거함에 부여된 고유 관리번호.읍면구분 : 설치된 행정 구역 단위(읍, 면)설치장소 : 의류수거함의 실제 설치 주소.위도 : 설치 위치의 위도 좌표경도 : 설치 위치의 경도 좌표데이터기준일 : 해당 데이터가 수집·제공된 기준일'
