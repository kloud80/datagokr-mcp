summary_user: 제주 인근 해안의 조사 정점별로 측정 연도·차수에 따라 발견된 해양쓰레기를 대·중·소분류 유형별 개수와 무게로 담은 조사 결과 파일이며, 정점마다 위도·경도 좌표가 붙어 있다. 환경 분석가나 지자체 담당자가 '제주 해안 어느 정점에서 어떤 종류의 쓰레기가 많이 나오고 연도별로 어떻게 달라졌는가'를 파악해 오염수준과 발생원인을 따지는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 정점명이나 위도·경도 좌표를 기준으로 공간 매칭하거나 쓰레기 유형 분류명을 맞춰 연결해야 한다.
description_portal: '제주특별자치도 인근 해양에서 발견된 해안쓰레기에 대해 조사한 데이터를 제공합니다.항목: 측정연도, 정점명, 위도, 경도, 쓰레기 유형 대분류 / 중분류 / 소분류, 개수, 무게* 해양폐기물의 발생 및 이동현황에 대한 모니터링을 통해 오염수준 및 발생원인을 파악할 목적으로 조사되었습니다.- 자료 출처는 해양환경공단입니다. - 데이터 미집계로 인하여 일부 데이터값에 공란이 존재할 수 있습니다.*추가 정보: 플라스틱은 재질별 특성에 따른 개수와 무게를 산정하지 않아 해당 재질의 전체 무게를 표시하였습니다.※본 데이터는 제공신청에 의해서 등록되었습니다.'
