description_portal: 한국수력원자력주식회사에서 사용하는 별도공사 화학물질 정보의 1년간의 AI 친화 데이터를 공개합니다. 공개 정보의 제공항목은 발전소명, 공사명, 공사시작일, 공사업체명, 정비용 화학물질명 항목으로 구성되어 있습니다.별도공사는 원자력 발전소 건설 및 운영 과정에서 발생되는, 계약에 포함되지 않은 추가 공사 또는 변경된 공사를 의미합니다. 별도공사는 주로 정비, 유지보수, 안전성 강화 등을 위한 공사가 이에 해당합니다. 별도공사는 원자력 발전의 안전성을 확보하고, 위험에 대비하기 위해 필수적입니다.
