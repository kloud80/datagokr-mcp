description_portal: 해양환경공단이 추진하는 오염퇴적물 정화사업의 현황 정보를 제공합니다. 본 데이터는 해양오염의 주요 원인 중 하나인 퇴적오염물질 제거를 위한 사업별 위치, 정화면적, 정화량, 정화방식, 시행연도 등의 정보를 포함합니다. 정화대상 해역은 하천하구, 항만, 내만 등으로서 오염도 조사 결과에 따라 선정되며, 정화사업은 해양환경 개선과 수질 회복을 목적으로 시행됩니다. 데이터는 권역별 정화현황, 사업 추진 방식, 연도별 실적 등으로 구성되며, 해양환경 정책 수립, 사업평가, 환경영향검토, 정화기술 연구 등 다양한 분야에서 활용됩니다. 공공기관, 연구기관, 지자체 등에서 정화사업 계획 수립과 해양환경 개선 모니터링에 참고자료로 사용됩니다.
