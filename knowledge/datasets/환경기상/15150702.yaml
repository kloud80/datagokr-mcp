summary_user: 환경부가 제공하는 전국 대기오염 측정소별 일평균 농도를 측정일과 측정소 이름 단위로 담는다. 필드는 아황산가스·일산화탄소·오존·이산화질소·미세먼지·초미세먼지의 일평균 농도로 보인다. 분석가나 주민이 '우리 동네 측정소의 어제 미세먼지·오존 일평균이 얼마였나'를 확인하거나 일별 대기질 추이를 정리하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 대기질·기상 데이터와는 측정소 이름(MSRSTN_NM) 매핑과 측정일로만 이어 쓴다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 이에 따라 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 측정소별 대기 요소 일평균 정보입니다."
