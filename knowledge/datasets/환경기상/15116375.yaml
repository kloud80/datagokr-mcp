summary_user: 수원시에 설치된 미세먼지신호등 시설을 한 대씩 담은 현황 파일로, 시설명·표출항목(미세먼지·초미세먼지·오존 등)·설치년도·운영시간·표출부 개수와 주소·위경도를 시설 단위로 기록한다. 시민이나 학부모가 우리 동네 학교·공원 근처에 미세먼지신호등이 어디 있는지 찾거나, 시·구 담당자가 신호등 설치가 어느 지역에 부족한지 점검할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소나 위경도로 공간 매칭하거나 시설명으로 맞춰 이어야 한다.
limits: 이 파일은 설치 현황 목록이며, 신호등에 표출되는 실시간 농도 값은 들어 있지 않다. 측정소코드 같은 공통 키가 없어서 에어코리아 측정값 등과 연결하려면 좌표나 주소로 직접 매칭해야 한다. 범위는 수원시 한 곳에 한정된다.
