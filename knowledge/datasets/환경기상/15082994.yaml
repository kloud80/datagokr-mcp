summary_user: 한국지역난방공사의 화석연료 사용시설에서 나온 온실가스 배출량을 기준일(월) 단위로 고정·간접·공정·기타 배출 유형별(tCO2e)로 집계한 소용량 CSV 파일이다. 분석가가 "지역난방공사의 월별 온실가스 배출량은 어떻게 변해 왔고, 그중 고정연소 배출 비중은 얼마인가"를 살피거나 배출 추이 예측 모델을 만드는 데 쓴다. 실측 컬럼에 사업장코드나 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 기준일(연월)이나 기관명으로만 맞춰 이어 쓴다.
