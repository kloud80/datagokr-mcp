summary_user: 충청남도 서산시에서 포획된 유해야생동물을 포획 건별로 담은 원천 데이터로, 신고일자·포획일자, 개체 종류, 포획 유형, 포획지 시도·시군·상세주소와 위도·경도, 포획 개체 수, 지역 유형을 담는다. 서산시 농가나 지자체 담당자, 야생동물 피해 분석가가 '어느 마을·지점에서 어떤 종이 언제 많이 포획되는가'를 지도 위에 보고 피해 대응 시기와 장소를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·주소 같은 이름 매칭이나 위경도 좌표의 공간 중첩으로만 잇는다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 통계와 바로 결합하기 어렵고 이름·주소 매핑이 필요하다. 개발계정은 하루 5,000회 호출로 제한된다. 서산시 한 곳의 포획 기록이라 충남 전체나 전국 현황을 대표하지 않는다.
