description_portal: 이 데이터는 선풍기를 촬영한 이미지와 해당 이미지에 대한 라벨링 데이터로 구성된 AI 학습용 데이터셋입니다. 총 200장의 이미지 파일과 동일한 파일명으로 저장된 200개의 라벨링 텍스트 파일로 구성되어 있습니다. 이미지 파일은 ‘images’ 폴더에, 라벨링 텍스트 파일은 ‘labels’ 폴더에 각각 저장되어 있으며, 라벨링 정보는 YOLO 형식으로 선풍기 객체의 위치와 클래스명을 좌표값으로 기록하고 있습니다. 촬영된 선풍기는 탁상용, 스탠드형 등 다양한 형태를 포함하며, 실내 환경에서 다양한 각도와 거리에서 촬영되었습니다. 데이터는 일관된 파일 구조를 갖추고 있어, 객체 인식 및 분류 모델 학습에 적합하게 설계되어 있습니다.
