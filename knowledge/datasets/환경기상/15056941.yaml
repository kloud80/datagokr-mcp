summary_user: 경기도 내 법적·생태적 보호가 필요한 동식물 종을 한 종씩 담은 목록으로, 구분, 국명, 학명, 목명, 과명, 서식지 정보(시군 또는 DMZ 일대 등), 선정근거(개체수 감소·고유종·국외반출 규제 등)를 항목으로 가진다. 연구자나 환경영향평가 담당자가 '특정 시군이나 DMZ 일대에 어떤 보호종이 서식하며 왜 보호 대상인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 생물종·보호구역 데이터와는 학명이나 국명 같은 이름 매칭으로만 연결한다.
description_portal: 경기도 보호종 현황 데이터는 경기도 내에서 법적·생태적으로 보호가 필요한 동식물 종의 분포와 서식 현황을 담고 있으며, 구분명, 국명, 학명, 목명, 과명, 서식지 정보, 선정근거 등의 항목으로 구성되어 있습니다. 본 데이터는 멸종위기종, 희귀종, 개체수 감소 우려 종 등을 포함하여 지역별로 어떤 보호종이 서식하는지 확인할 수 있도록 제공됩니다. 특히 서식지 정보는 특정 시군 또는 DMZ 일대와 같이 생태적으로 중요한 지역을 나타내며, 선정근거는 개체수 감소, 고유종 여부, 국외반출 규제 등 종 보존의 필요성을 보여줍니다. 이 데이터는 경기도 내 생물다양성 보존 전략 수립, 환경영향평가, 서식지 관리계획 마련, 시민 환경교육 및 연구 자료 등 다양한 분야에서 활용될 수 있습니다.
