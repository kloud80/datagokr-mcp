summary_user: 기상청이 운영하는 현업용 기상레이더 10개 지점의 관측자료를 합성해 만든 전국 레이더 합성영상(강수) 자료를 10분 주기로 담으며, 포털 설명상 보유기간은 2016년부터 현재까지입니다. 기상 분석가나 방재 담당자가 "지금 비구름이 어디에 있고 어느 방향으로 이동하나"처럼 강수 범위와 이동 경향을 감시·분석할 때 쓴다. 실측 컬럼에서 다른 데이터와 잇는 공통 조인 키는 없어, 같은 기관(기상청)의 ASOS·AWS 관측자료와는 시각 기준으로 맞추거나 이름 매핑으로 이어 써야 한다.
description_portal: '레이더 강수량은 각각의 레이더 관측소에서 생산된 관측자료를 합성하여 우리나라 전역의 레이더 합성영상자료를 산출하고, 이를 활용하여 우리나라에 영향을 주는 강수의 범위와 이동경향감시 분석 등에 이용합니다.기상청에서 운영하고 있는 현업용 기상레이더 10개 지점의 자료를 이용하여 생산한 자료를 제공합니다. CM1, CM1B, CMI 자료는 2019년 이후로 생산 중단되고, QCD CPP, PPI, CMX로 대체하여 제공 중이니 이용에 참고하시기 바랍니다.생산주기: 분(10분 주기)보유기간: 2016년 ~ 현재'
