summary_user: 광역·지방상수도가 호소수를 원수로 쓰는 취수장의 법정 원수 수질검사 결과를 측정지점·월 단위로 담은 건별 파일로, 수소이온농도·총유기탄소·총인·클로로필·부유물질량·용존산소량·총대장균군·분원성대장균군 값을 수도사업자·취수장·정수장 정보와 함께 담고 범위는 전국이다. 수도사업자나 수질 분석가가 '우리 지역 정수장이 취수하는 호소 원수의 총인·클로로필·대장균군이 어느 달에 높아졌는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 취수장명·정수장명·측정지점주소 같은 이름·주소 매핑으로만 이어 쓰며, 같은 물 맥락의 하천·댐 수자원 자료나 수질측정망 시계열과 비교하는 데 쓴다.
