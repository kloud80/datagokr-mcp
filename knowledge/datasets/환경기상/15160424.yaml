description_portal: 경산시에서 관리하는 낚시금지·제한·통제구역 관련 데이터이다. 본 자료는 수질과 수생태계 보호를 위해 지정된 구역의 위치와 행위 제한 정보를 제공한다. 데이터는 자료구분, 시설명 또는 수계명, 소재지, 고시일, 적용기간, 고시번호, 관련 법령·조례, 금지 또는 제한 행위 내용으로 구성되어 있으며, 금지행위 내용을 확인할 수 있다. 시민과 방문객은 지정구역의 위치와 준수사항을 파악할 수 있으며, 행정기관은 수환경 보전, 현장 관리 및 정책 수립에 활용할 수 있다. 본 데이터는 경산시 수변구역 이용질서 안내와 환경보전 업무를 지원하는 기초자료이다.
