summary_user: 전국 자치단체가 관리하는 쓰레기종량제봉투 판매업소의 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 전체 91,193건이며 인허가일 2007-08-13부터 2026-10-01까지 걸친다. 주민이 우리 동네에서 종량제봉투를 살 수 있는 영업 중인 판매소가 어디인지 찾거나, 분석가가 지역별 판매소의 개폐업 현황을 볼 때 쓴다. 소재지(LCTN)·지번주소·도로명주소가 주소 키라서 같은 주소 키를 가진 다른 생활폐기물 배출·수거 지점 데이터와 이어 쓸 수 있고, 좌표(X, Y)는 Bessel 중부원점TM 좌표계다.
description_portal: '자원환경_쓰레기종량제봉투판매업 데이터는 시군구의 조례에 따라 정의되는 쓰레기종량제봉투의 판매가능한 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 쓰레기종량제봉투판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 지자체별 조례 / 해당 지자체에 문의 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
