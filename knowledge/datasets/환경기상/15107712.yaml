summary_user: 남해군 안에서 휘발유·경유 같은 경질유를 다루는 업체를 한 곳씩 담은 건별 목록(CSV 약 10KB)으로, 사업구분·업체명·주소·전화번호와 영업구분·공급상표·유종·주유기 수·저장 용량·저장시설 수를 담는다. 남해군 주민이나 운송사업자가 특정 상표 주유소가 어디 있는지, 지역 내 저장시설 규모가 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업체명을 맞춰 붙이거나 같은 기관(남해군) 자료끼리 이어 써야 한다.
description_portal: 데이터는 남해군 내 경질유(주로 자동차용 휘발유, 경유 등) 관련 사업을 운영하는 업체 현황을 담고 있습니다. 사업구분, 업체명, 주소, 전화번호 등 기본 정보는 물론이며, 영업 형태, 공급 브랜드, 취급하는 유종, 사용 연료 종류, 주유기 수, 저장 용량, 저장 시설 개수, 기타 사항 등 세부 내역까지 포함합니다. 데이터 기준일자가 명시되어 최신성을 확인할 수 있습니다. 이 데이터를 통해 시민은 가까운 주유소나 관련 업체를 쉽게 찾을 수 있고, 개발자는 위치 기반 지도, 연료 가격 정보 서비스, 물류·운송 경로 최적화 등 다양한 응용 서비스를 만들 수 있습니다. 또한, 행정기관에서는 지역 내 에너지 공급망 분석, 위험시설 관리, 민원 대응 자료로 활용할 수 있습니다. 다만, 업체 폐업, 영업변경 등으로 실제 정보와 차이가 있을 수 있으니, 최신 데이터임을 반드시 확인하고 활용해야 합니다
