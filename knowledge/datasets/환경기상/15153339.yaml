summary_user: 지역별 미세먼지 주의보의 발령·해제 일시와 지속시간, 측정항목, 발생 지역(권역 코드·이름, 시도 코드)과 좌표를 주의보 건별로 담은 전국 범위 데이터다. 시민이나 지자체 담당자가 "우리 지역에 미세먼지 주의보가 언제 발령돼 몇 시간 이어졌나"를 확인하거나, 분석가가 지역별 주의보 발령 빈도를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도 코드(STDG_CTPV_CD)나 권역 이름을 매핑해 에어코리아 측정소 대기질·기상 특보 데이터와 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지역별 미세먼지 주의보 관련 정보입니다.\""
