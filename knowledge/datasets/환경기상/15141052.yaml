summary_user: 서울특별시 마포구에 등록된 환경전문공사업체를 업체(관리번호) 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·좌표·실험실 소재지 정보가 들어 있다. 시민이나 발주 담당자가 마포구의 특정 환경전문공사업체가 지금도 영업 중인지, 언제 인허가를 받았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OGDP_INST_CD) 같은 기관 코드로만 잇고, 좌표(XCRD·YCRD)로 지도 위에 겹쳐 볼 수 있다.
description_portal: 서울특별시 마포구에 등록된 환경전문공사업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 환경전문공사업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 실험실 관련 정보, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 관계 기관과 시민들은 환경전문공사업체의 자격 및 운영 현황을 체계적으로 확인할 수 있습니다.
accrual_periodicity: 수시
