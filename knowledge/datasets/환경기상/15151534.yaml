description_portal: 이 데이터는 의자 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 데이터는 총 200장의 이미지와 동일한 수의 라벨링 텍스트 파일로 구성되어 있으며, ‘images’ 폴더와 ‘labels’ 폴더에 각각 저장되어 있습니다. 이미지에는 다양한 형태, 색상, 재질의 의자가 포함되어 있으며, 실내외 여러 환경에서 촬영되었습니다. 촬영 각도는 정면, 측면, 후면 등으로 다양하며, 의자의 등받이, 다리, 좌판 등의 구성 요소가 시각적으로 구분 가능합니다. 모든 라벨링 파일은 YOLO 형식으로 작성되어 있으며, 각 이미지 내 객체의 위치 좌표와 클래스명이 텍스트 형태로 기록되어 있습니다. 데이터는 객체 인식 및 분류 모델 학습에 활용할 수 있도록 일관된 구조와 파일명 규칙을 가지고 있습니다.
