description_portal: 이 데이터는 전북특별자치도의 주요 수자원인 용담호로 유입되는 하천의 수질을 항목별로 조사한 결과입니다. 구암교(정자천), 오봉교(계북천) 등 여러 측정 지점에서 시기별로 채수한 샘플을 분석한 자료로, 수온, 수소이온농도(pH), 용존산소량(DO)과 같은 기본적인 항목부터 BOD, COD, 총질소(T-N), 총인(T-P), 총대장균군에 이르기까지 매우 상세한 수질 지표를 포함하고 있습니다. 이 자료는 용담호 상류 오염원을 추적하고 수질 변화를 지속적으로 감시하여 깨끗한 수자원을 관리하기 위한 핵심적인 환경 데이터입니다.
