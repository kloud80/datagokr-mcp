description_portal: 광주 내에 위치한 무등산권세계지질공원센터(2개소) 방문객 통계 현황입니다. 무등산권지질공원은 등산객 등 유동인구가 많은 증심사지구(동구 증심사길 71)와 광주호호수생태원의  에코센터(북구 충효샘길 7)를 운영하고 있습니다.지질공원센터에서는 무등산권지질공원 해설사가 상주하여 안내책자와 전시물 등을 통해 방문객에서 다양한 정보를 전달하고 있으며, 지질공원센터 방문객 통계를 통해 지질공원인증 후 지역방문자의 증가추세를 알수 있어 지질공원의 본래 취지인 지역경제 활성화 성과를 측정하는 요소로 활용할 수 있습니다.
