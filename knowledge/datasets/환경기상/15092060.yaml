summary_user: 대구광역시 서구 관내에서 신고된 석면 포함 건축물·설비의 해체·제거작업을 신고 건별로 담은 파일(csv)로, 공사현장명, 도로명주소, 건물명, 해체제거업체, 작업 시작·종료일, 석면 자재 종류와 면적을 수록한다. 주민이 우리 동네 학교나 상가에서 언제 석면 철거 공사가 진행되는지 확인하거나, 분석가가 서구의 석면 해체 작업 시기와 규모를 파악하는 데 쓴다. 전역 조인 키나 코드표는 없으므로, 다른 데이터와는 도로명주소(소재지도로명주소)나 업체명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 대구광역시 서구 내에서 이뤄지는 석면건축물 해체 및 제거작업 신고 내역입니다. 작업 현장명, 위치, 해체제거업자, 번호, 작업시기 등의 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 관내 석면이 포함된 건축물 또는 설비의 해체 및 제거 작업 신고내역을 수록한 자료로, 공사현장명, 주소, 건물명, 시공업체, 작업기간, 자재종류 및 면적 등의 항목으로 구성되어 있다. 주요 대상은 초등학교, 상업시설, 공장, 은행 등의 건축물로서, 석면 해체·제거작업의 시기와 규모를 확인할 수 있도록 작성되었다. 본 자료는 환경보건 확보와 주민 안전 보호를 위한 정보로 활용되며, 석면 관리, 작업계획 수립, 인허가 검토 및 유해물질 통제정책 수립 등에 필요한 기초자료로 제공된다. 건축물 해체 시 석면 노출 위험을 최소화하고, 지역 내 안전한 작업환경 조성을 위한 관리 이력으로도 활용 가능하다.
