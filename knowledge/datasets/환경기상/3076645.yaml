summary_user: 경상남도 내 일반쓰레기 처리장(매립장)을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 5.6KB)로, 시설명·면적·용량과 주소·좌표·행정동·법정동을 함께 제공한다. 주민이나 지자체 담당자가 '우리 시군 근처에 있는 매립장은 어디이고 규모가 얼마인가'를 확인할 때 쓴다. 법정동코드(bjd_cd)를 키로 다른 법정동 단위 데이터와 잇고, 위도·경도로 지도 위 다른 시설 데이터와 겹쳐 본다.
limits: 경상남도 범위의 시설 목록이라 다른 시도나 전국 비교에는 쓰지 못한다. 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다.
