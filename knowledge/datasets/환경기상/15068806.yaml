summary_user: 인천광역시 서구 안에 있는 특정토양오염 관리대상시설을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·지번 주소·도로명 주소·업종·데이터기준일자를 담는다. 주민이나 부동산·개발 검토자가 "우리 동네나 이 필지 근처에 주유소·유류 저장시설처럼 토양오염 관리 대상 시설이 있는가"를 확인하거나, 담당 부서가 점검 대상 목록을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(지번·도로명)를 지오코딩하거나 사업장명으로 매칭해 이어 쓴다.
