description_portal: 본 데이터는 국립호남권생물자원관에서 2026년 2월 9일 기준으로 작성한 섬생물은행자원 현황 자료입니다. 해당 자료는 국립호남권생물자원관이 운영·관리하는 섬생물소재은행에서 보유하고 있는 다양한 생물소재의 분양 가능 현황을 체계적으로 기록한 것으로, 기관의 연구 지원과 자원 관리, 공공데이터 개방 및 활용 확대를 위해 중요한 기반 자료로 활용될 수 있습니다. 데이터는 크게 일련번호, 은행자원번호, 1차분류군, 2차분류군, 보존잔여수량이라는 다섯 가지 항목으로 구성되어 있습니다. 일련번호는 각 데이터 레코드를 구분하기 위한 기본 식별자로서, 오름차순으로 정렬되어 있어 연구자나 관리자들이 데이터 관리 및 검색을 보다 용이하게 수행할 수 있도록 설계되었습니다. 은행자원번호는 섬생물소재은행에서 개별 소재를 유일하게 식별할 수 있는 고유 번호로, 해당 자원의 추적, 보존 및 분양 관리에 있어 핵심적인 역할을 담당합니다. 1차분류군은 대분류 수준에서 해당 생물소재가 속한 분류체계를 나타내며, 예를 들어 식물, 동물, 균류 등과 같은 상위 분류군으로 구분할 수 있습니다. 2차분류군은 보다 세부적인 분류체계를 제공하여, 종 수준 또는 속(genus) 수준에서 해당 소재의 학술적 가치를 높이고, 연구자가 원하는 특정 분류군에 대한 검색 및 활용을 지원합니다. 보존잔여수량은 현재 섬생물소재은행에서 실제로 분양이 가능한 자원의 수량을 수치로 제시한 것으로, 향후 연구자 또는 관련 기관이 필요한 자원을 요청할 때 실질적인 참고 자료로 사용됩니다.
