description_portal: 4대강수계 토지매수정보시스템 토지매수정보에 대한 데이터로 (토지고유코드,소재지,데이터기준일)에 대한 항목정보를 제공합니다.1. 토지고유코드(PNU)- 각 토지를 식별하기 위해 부여되는 고유한 14자리 번호로, 토지대장이나 등기부등본 등에서 해당 토지를 특정할 때 사용됩니다. 이 코드는 토지의 소재지, 지번, 지목, 경계 등의 정보가 담긴 대장의 고유식별번호이며, 주민등록번호처럼 각 자리마다 의미가 부여되어 있어 토지 관련 정보를 해석하는 데 활용될 수 있습니다.- 토지고유코드(PNU)에 대한  해석은 소재지 컬럼을 참고하시면 됩니다.2. 참고(4대강수계 토지매수대상지역)1) 상수원보호구역2) 수변구역3) 상수원보호구역으로 둘러싸인 지역 중 상수원보호구역으로 지정 고시되지 아니한 지역4) 수변구역으로 둘러싸인 지역 중 수변구역으로 지정․고시되지 아니한 지역5) 그 밖에 「4대강수계법」에 의한 4대강수계관리위원회가 인정하는 지역- 한강수계 상수원수질개선 및 주민지원 등에 관한 법률- 낙동강수계 물관리 및 주민지원 등에 관한 법률- 금강수계 물관리 및 주민지원 등에 관한 법률- 영산강·섬진강수계 물관리 및 주민지원 등에 관한 법률
