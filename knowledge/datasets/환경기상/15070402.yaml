summary_user: 국가 온실가스 인벤토리 중 과불화탄소(PFCs) 배출량을 분야별 행, 1990~2023년 연도별 열로 정리한 전국 단위 집계 표(CSV)이며, 단위는 백만톤 CO2 eq.이고 포털 설명상 전량 산업공정 및 제품 사용 분야에서 배출된다. 분석가나 정책 담당자가 '우리나라 PFCs 배출량은 1990년 이후 어떻게 변해 왔는가'처럼 가스별 장기 추세를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 가스별 인벤토리(CO2·CH4·N2O·HFCs·SF6·NF3) 표와는 분야명과 연도를 맞춰 이어 쓴다.
limits: 전국 단위 비공간 집계라 지역별·사업장별 배출은 알 수 없고, 사업장 배출원 데이터와 직접 연결할 키가 없다. 값 자리에 NO·NE·NA·IE·C 같은 표기 코드가 섞여 있을 수 있어 숫자로 변환할 때 주의한다.
