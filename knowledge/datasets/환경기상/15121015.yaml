summary_user: 국립공원 탐방로·급경사지 등에 설치된 다목적위치표지판을 표지판 한 개당 한 행으로 담은 CSV 원천 파일로, 국립공원·관리사무소·위치명·구간명·해발고도·국가지점번호·통화 가능 여부를 함께 제공한다. 산악 구조 담당자나 탐방앱 개발자가 '조난 신고자가 말한 표지판 번호가 어느 공원 어느 구간의 어디인가', '통화가 안 되는 표지판 구간은 어디인가'를 확인하는 데 쓴다. 고유번호(npark_gis_obj_id)·국립공원코드(npark_cd)·사무소코드(npark_dept_cd)를 키로 국립공원공단의 탐방로·시설·사고 데이터와 이어 쓰고, 국가지점번호로 다른 구조·위치 체계와 맞춰 본다.
description_portal: 본 데이터는 국립공원공단의 급경사 유지관리시스템을 통해 관리되어 오던 다목적위치표지판의 공간정보를 국립공원 통합 재난안전 플랫폼에 연계하여 개방하는 자료입니다. 이 표지판은 주로 탐방로, 급경사지, 조난사고 다발 구간 등에 설치되어 탐방객의 현재 위치 식별과 응급 상황 시 구조 요청을 지원하는 용도로 활용됩니다. 주요 항목은 표지판 고유번호, 설치 국립공원명, 지점명 또는 구간명, 위도·경도 좌표, 고도, 설치 목적(조난안내, 탐방지원 등), 관리주체, 설치연도, 표지판 유형 등이 포함되며, CSV 포맷으로 제공됩니다. 해당 데이터는 긴급구조 대응 체계 구축, 재난안전 경보 시스템 연계, 모바일 탐방앱 위치표출, 구조자원 배치 계획 수립 등 다양한 분야에서 활용되며, GIS 기반 지도 시각화 시스템과도 통합 활용이 가능합니다.
