description_portal: '이 데이터는 생활폐기물의 안정적이고 체계적인 처리를 위하여 권역별로 지정된 수집운반 대행업체의 현황을 정리한 자료입니다. 각 업체는 담당 권역 내에서 생활폐기물의 수거 및 운반을 수행하며, 주소, 연락처, 팩스번호, 수거구역 등 주요 정보를 포함하고 있습니다. 이를 통해 행정기관, 위탁관리기관, 주민들이 담당 업체를 명확히 파악하고 문의할 수 있도록 제공되며, 폐기물 행정의 효율성과 투명성 확보에도 기여할 수 있습니다. 데이터는 총 6개 컬럼으로 구성되어 있으며, 기준일은 2025년 8월 18일입니다.권역: 수거구역이 설정된 구역 번호입니다.업체명: 생활폐기물 수집·운반을 대행하는 업체의 명칭입니다.소재지도로명주소: 업체가 소재한 사업장 주소입니다.전화번호: 업체의 대표 연락처입니다.팩스번호: 업체의 팩스번호입니다.수거구역: 해당 업체가 담당하는 면·읍·동 단위의 수거 지역입니다.'
