summary_user: 경상남도 시군이 설치해 운영하는 생활폐기물 공공매립시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·소재지·면적(제곱미터)·용량(세제곱미터)을 기록한다. 지역 주민이나 폐기물 정책 분석가가 "우리 시군에 공공매립시설이 어디 있고 매립 용량은 얼마나 되나"를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소의 시군 이름으로 맞춰 이어 쓴다.
description_portal: 생활폐기물 공공매립시설 현황입니다.폐기물관리법에 따라 시장군수가 설치한 시설로 경남도내 생활폐기물을 처리를 위해 운영하고 있는 공공매립시설은 총 23개소입니다.창원시 3개소, 진주시·통영시·사천시·김해시·밀양시·거제시·양산시·의령군·함안군·창녕군·고성군·남해군·하동군·산청군·함양군·거창군 각 1개소, 합천군 4개소가 운영되고 있습니다.공공매립시설은 공공의 이익을 위해 공공사업의 일환으로 운영되는 폐기물 처리시설로, 일반적으로 위생적 처리를 위해 설계·운영되며, 사용종료 후 사후관리를 실시하고 있습니다.데이터 내역은 시설명, 소재지, 면적, 용량입니다.
