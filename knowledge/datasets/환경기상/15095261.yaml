summary_user: 전국 광역시도별 온실가스 배출량을 연도·시도 단위로 집계한 자료로, 전체 배출량과 1인당·관리업체 1개당·사업장 1개당 배출량을 담는다. 정책 분석가나 지자체 기후 담당자가 '우리 시도의 1인당 또는 사업장당 배출량이 다른 시도보다 많은가'를 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 시도 단위 통계와는 연도와 시도명(metropl_sido_nm)을 이름으로 맞춰 잇는다.
description_portal: 이 데이터는 대한민국 각 광역시도별 온실가스 배출 현황을 연도별로 정리한 자료입니다. 주요 항목은 연도, 광역시도명, 전체온실가스배출량(tonCO2-eq), 1인당 인구배출량, 관리업체 1개당 온실가스배출량, 사업장 1개당 온실가스배출량 등이 포함되어 있습니다. 지역별 온실가스 배출 수준을 비교하고, 인구나 사업장 대비 배출량을 분석하여 지역 특성에 맞는 기후변화 대응 정책 수립에 활용할 수 있습니다. 해당 데이터는 에너지 소비 구조 분석, 지역환경 계획 수립, 탄소중립 전략 평가 등의 용도로도 활용 가능합니다.
