summary_user: 서울 동작구 안의 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 파일(CSV, 약 17KB)로, 관리기관명·사업장 유형(일반음식점·집단급식소 등)·상호·도로명주소·수거형태를 담는다. 구청 담당자나 분석가가 '동작구에서 음식물쓰레기를 다량 배출하는 업소는 어디이고 어떤 방식으로 수거되는가'를 확인하거나 사업장 위치를 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명주소를 매칭하거나 같은 기관의 데이터끼리만 연결한다.
description_portal: 서울특별시 동작구 음식물류폐기문 다량배출사업장에는 관리기관명, 상호, 사업장 도로명주소, 수거형태 등의 데이터가 포함되어 있습니다.데이터에는 해당 사업장을 관리하는 기관을 확인할 수 있는 관리기관명 항목이 포함되어 있습니다.사업장구분 항목을 통해 일반음식점, 집단급식소 등 사업장의 유형을 확인할 수 있습니다.상호 항목에는 해당 사업장의 명칭 정보가 포함되어 있습니다.사업장도로명주소 항목을 통해 사업장의 위치 정보를 확인할 수 있습니다.수거형태 항목을 통해 음식물폐기물의 처리 방식 및 수거 형태를 확인할 수 있습니다.
