summary_user: 경기도 성남시에 설치된 일반 쓰레기통과 스마트 쓰레기통을 한 개씩 기록한 건별 위치 목록으로, 구·동·상세주소·설치위치와 위도·경도 좌표, 쓰레기통 종류, 담당부서 전화번호를 담는다. 시민이 "우리 동네 공원이나 정류장 근처에 쓰레기통이 어디 있나"를 찾거나, 분석가가 보행량이 많은 곳에 쓰레기통이 부족한 구역을 지도에서 확인하는 데 쓴다. 전역 조인 키나 행정코드는 없어서, 다른 데이터와는 구·동 이름을 맞추거나 위도·경도 좌표를 공간 결합해 이어 쓴다.
description_portal: '경기도 성남시에 설치된 스마트쓰레기통 및 일반 쓰레기통 설치 현황으로 연번, 시도명, 시군구명, 해당구, 해당동, 상세주소, 설치위치, 쓰레기통 종류, 위도, 경도, 담당부서 전화번호, 데이터기준일자 등의 항목을 제공합니다. 1. 설치 위치: 거리, 공원, 정류장, 광장, 주거지 밀집 지역 등 2. 위경도 좌표 포함한 공간정보 형식 표시. 3. 쓰레기통 종류: 일반 쓰레기통, 스마트 쓰레기통 등. 4. 설치 수량 및 간격: 보행량, 쓰레기 발생량, 공간 특성에 따른 기준으로 배치. 또한 정책 수립 과정에서 현황 분석과 개선 방안을 마련하는 근거 자료로 기능하여 도시 환경 관리 수준을 높이는 데 기여합니다.'
