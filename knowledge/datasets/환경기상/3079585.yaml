summary_user: 광양시 안에서 대기오염물질 배출시설을 설치·운영하는 사업장을 한 곳씩 사업장명·위치·전화번호·업종·데이터기준일로 담은 시군구 단위 목록 파일(csv, 약 26KB)이다. 광양시 주민이나 분석가가 '우리 동네 주변에 어떤 업종의 대기 배출 사업장이 있나'를 확인하거나 공장 분포 지도를 그릴 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 배출원·대기질 데이터와는 사업장명이나 주소(위치)를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 본 자료는 전라남도 광양시 지역 내 대기오염물질 배출시설을 설치·운영 중인 사업장의 현황 정보를 국민 누구나 열람할 수 있도록 정리한 공공데이터입니다. 해당 데이터는 사업장명, 소재지 도로명 주소, 전화번호, 데이터 기준일 등의 항목으로 구성되어 있으며, 대기환경 보전과 환경관리의 투명성을 높이기 위한 목적으로 무료로 제공됩니다.광양시는 국가산업단지, 항만, 물류, 제조시설 등 다양한 산업 기반이 밀집해 있는 지역으로, 대기오염 저감을 위한 배출원 관리가 매우 중요한 지역 중 하나입니다. 이에 따라 지역 내 대기오염 배출사업장을 정확히 파악하고, 그 위치 및 기본 정보를 공개함으로써 시민들이 주변 대기환경 정보를 보다 쉽게 이해하고 대응할 수 있도록 하고 있습니다.또한 본 데이터는 환경부, 지자체, 관련 연구기관 등에서 대기오염 저감정책 수립, 환경영향평가, 환경민원 대응, 공장 지도 작성 등 다양한 분야에서 활용될 수 있으며, 지역주민의 알권리 보장, 환경감시 참여 유도, 지속가능한 도시계획 수립 등에도 기여하고 있습니다.
