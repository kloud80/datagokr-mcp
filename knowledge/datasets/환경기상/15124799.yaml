description_portal: 이 데이터는 광주광역시 서구 관내 행정동별로 설치·관리되고 있는 **맨홀 및 빗물받이(우수받이)**에 대한 현황을 정리한 자료입니다.각 항목은 연번, 행정동, 우수받이 개수, 하수맨홀 개수, 데이터 기준일 등으로 구성되어 있으며, 우수 인프라의 공간 분포와 행정구역별 시설 밀도를 파악할 수 있도록 합니다.본 자료는 도시 내 강우 시 신속한 배수 기능 확보와 침수 예방을 위한 기초자료로 활용되며,배수체계 개선 사업, 도시개발계획, 재해예방 설계, 유지보수 계획 수립 등 다양한 공공 및 민간 분야에서 실무적으로 활용될 수 있습니다.데이터는 csv 형식으로 제공되며, 매년 갱신되어 최신 정보를 반영하고, 공공저작물로 자유로운 활용이 가능합니다.
