summary_user: "울산광역시 관내에 서식하는 멸종위기 야생동식물을 종 단위로 나열한 목록으로, 분류 구분·종 명칭·멸종위기 등급 세 가지 항목을 담은 작은 CSV 파일(약 3.9KB)이다. 시민·교육 담당자·환경 분석가가 '울산에 사는 멸종위기종은 무엇이고 몇 급인가'를 확인하거나 서식지 보전 계획의 대상 종을 고를 때 쓴다. 전역 조인 키나 종 코드가 없어, 다른 데이터와는 종 명칭(국명) 문자열 매칭으로만 잇는다(예: 전국자연환경조사 종 분포 점, 야생동물 구조 기록)."
description_portal: 본 데이터는 관내에 서식하는 멸종위기 야생동식물 목록 정보이다. 구분, 명칭, 멸종등급 정보를 포함한다. 멸종위기 야생동식물은 생태계 보전의 핵심 지표 종으로서 법적 보호 및 관리가 필요한 종이다. 해당 자료는 생물 다양성 보전 정책 수립, 서식지 관리 계획, 복원 사업 추진에 활용된다. 멸종위기종 서식 현황 모니터링을 통해 개체수 변화 추이를 파악하고 보호 대책의 효과를 평가할 수 있다. 또한 서식지 보호 구역 지정 및 훼손 행위 제한을 통해 생물종의 안정적인 서식 환경을 조성한다. 시민들이 지역의 희귀 생물종을 인식하고 생태 보전 활동에 참여할 수 있도록 교육 자료로 활용된다. 불법 포획 및 채취 단속 강화를 통해 야생동식물을 보호한다.
