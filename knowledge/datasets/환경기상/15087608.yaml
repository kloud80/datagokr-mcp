description_portal: 본 데이터는 한국환경산업기술원이 수행한 환경 R&D 과제 성과 중 국내외 전문 학 술지에 게재된 논문 등록 현황을 제공하는 공공데이터입니다. 과제명, 연구기관, 연구책임자, 과제 기간, 성과년도와 함께 게재년월일, 학술지명, 논문명, 국제표준도서번호, 국내외 구분, 발행기관·국가, 권호, SCI 여부, DOI 등의 세부 정보를 포함합니다. 이를 통해 사용자는 과제별 논문 게재 실적과 학술지 영향력, 국제 공동연구 현황을 종합적으로 파악할 수 있습니다. 학술 성과 분석, 연구 성과 확산 전략 수립, 학술지별 출판 트렌드 모니터링, 연구 네트워크 분석, 연구비 지원 평가 지표 개발 및 R&D 정책 수립 등에 활용할 수 있습니다.
