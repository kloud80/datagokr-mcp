summary_user: 순환자원을 전자 수의계약으로 매각·거래하려는 업체가 등록한 수의견적 공고를 공고번호 단위로 담는 건별 원천 데이터로, 물품 분류·수량·공고기간·견적방법·자격제한·견적예정가격과 견적금액·선정/미선정 사유 같은 결과 정보를 2개 오퍼레이션으로 제공하며 범위는 전국이다. 순환자원 구매·처리 사업자가 "지금 어떤 폐자원 품목이 수의견적으로 나와 있고 마감일과 예정가격은 얼마인가"를 확인하거나, 분석가가 품목별 견적금액 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 공고자 이름이나 물품 분류명 같은 이름 매핑으로만 이을 수 있으며, 두 오퍼레이션 사이는 공고번호(pbancNo)로 묶어 공고와 견적 결과를 맞춰 본다.
description_portal: 순환자원을 전자 수의계약 방식으로 매각 및 거래하고자 하는 업체에서 등록한 입찰공고 관련 기본정보 및 낙찰정보를 조회하는 서비스입니다.
