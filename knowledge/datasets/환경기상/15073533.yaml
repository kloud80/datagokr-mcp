description_portal: '대구광역시 동구에서 제공하는 실내공기질 관리대상 현황 공공데이터는 지역 내 다중이용시설의 실내공기질 관리 현황을 파악할 수 있는 자료입니다. 해당 데이터에는  연번, 시설군, 시설명, 도로명주소, 전화번호, 기준일자가 등록되어 있습니다.  이러한 데이터는 실내공기질 관리 대상 시설의 현황을 파악하고, 지역 내 공기질 관리 정책 수립 및 실행에 활용될 수 있습니다. 또한, 시민들이 주변 시설의 공기질 관리 상태를 확인하는 데에도 유용하게 사용할 수 있습니다.시설군: 시설의 유형을 나타내며, 예를 들어 어린이집, 의료기관, 도서관 등이 포함시설명: 각 시설의 명칭주소: 시설의 도로명 주소전화번호: 시설의 연락처 정보데이터 기준일자: 데이터가 수집된 기준 날짜'
