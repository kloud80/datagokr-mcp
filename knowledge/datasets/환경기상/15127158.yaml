summary_user: 고양시가 설치한 공공 재활용 의류수거함을 한 곳씩 담은 지점 목록으로, 각 수거함의 행정구역·도로명·지번주소와 위도·경도, 관리기관과 연락처를 함께 싣는다. 고양시 주민이 집 근처 헌옷 수거함이 어디 있는지 찾거나, 분석가가 동네별 수거함 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·행정구역 이름을 맞추거나 위도·경도로 공간 결합해 이어 쓰며, 다른 지자체의 의류수거함 파일과는 같은 항목을 기준으로 이어 붙인다.
