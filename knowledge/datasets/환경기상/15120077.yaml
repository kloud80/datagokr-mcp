description_portal: 수도권매립지관리공사의 경영목표를 효과적으로 달성하기 위해 협약에 의해 수탁기관에게 시행하도록 한 위탁사업의 수행능력 및 성과에 대한 평가자료로 작성되었습니다.위탁사업 평가편람은 공공데이터 개방을 통해 투명하고 효율적인 위탁사업 평가와 정보공유를 지원합니다.해당 편람을 통해 공공데이터의 활용 가능성 부분을 살펴보면, 투명한 평가 기준 공개를 통해 공사 내부적으로 평가 기준과 절차가 누구에게나 공개되어 위탁사업의 공정성과 투명성을 높일수 있습니다. 성과관리 및 정책 개선에 편람이 활용될수 있습니다. 즉, 평가 결과 데이터가 축적되면, 사업별 성과 분석과 정책 개선에 활용할 수 있습니다.또한, 데이터 기반의 의사결정이 가능해져 사업 효율성을 높일수 있습니다. 대외적인 측면에서 살펴보면, 학계 및 연구기관, 민간기업등이 위탁사업 운영 및 성과 자료를 활용해 환경이나 행정, 경영 등 다양한 분야의 연구에 활용할 수도 있습니다.
