description_portal: 대구광역시 북구 관내에서 운영 중인 지하수 현황(용도, 소재지지번주소, 도로명주소,기준일자 ) 정보를 제공합니다.지하수시설  공공데이터는 대구광역시 북구 관내의 지하수 개발, 이용, 관리 현황을 체계적으로 제공하는 데이터로, 주로 대구광역시 북구에서 생산하여공공데이터포털에 개방하고 있습니다.지하수 관리 정책 수립과 시설 점검, 허가 인허가 업무 지원에 활용수자원 연구, 환경영향 평가, 토목 건설 분야 활용생활용수, 농업용수 등 지역별 지하수 이용 현황 파악에 활용데이터는 무료로 제공되며, 누구나 다운로드하여 사용할 수 있습니다.데이터는 최신화 주기가 다르므로, 활용 목적에 따라 최신 데이터 여부를 반드시 확인해야 합니다.
