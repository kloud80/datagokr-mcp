summary_user: 대구광역시 북구 관내 지하수 관정을 한 건씩 담은 시설 원장으로, 용도와 개발위치(주소), 도·분·초로 나눈 위도·경도 좌표를 담는다. 주민이나 분석가가 "북구 어느 동네에 생활용·농업용 지하수 관정이 몰려 있나"를 파악하거나 시설 점검·환경영향 검토 때 위치를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소 문자열이나 좌표(도·분·초를 십진 좌표로 바꾼 뒤)를 기준으로 공간 매칭해 잇는다.
limits: 지하수 수위나 수질 측정값은 없고 관정의 위치와 용도만 담는다. 관정 고유번호나 법정동 코드 같은 공통 키가 없어 다른 지하수·수질 데이터와는 주소·좌표 매칭으로만 연결된다. 범위는 대구 북구 한 시군구에 한정된다.
