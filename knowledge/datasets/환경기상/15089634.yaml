description_portal: 환경부는 생물다양성의 체계적인 보전·관리 및 생물자원의 지속가능한 이용을 위하여 국가생물다양성센터 운영하고 있으며, 국립생물자원관에서 국가생물다양성센터의 역할을 수행하고 있습니다. 본 자료는 국가생물다양성센터의 주요 업무 중 하나인 생물다양성 및 생물자원에 대한 정보를 수집·관리하고자 국립생물자원관에서 생산한 생물자원에 대한 목록을 정리한 자료입니다. 23개 분류군(포유류, 조류, 파충류, 양서류, 어류, 미삭동물류, 무척추동물류, 곤충류, 관속식물류, 선태류, 윤조류, 녹조류, 홍조류, 돌말류, 와편모조류, 대롱편모조류, 균류, 지의류, 원생동물류, 유글레나조류, 남조류, 세균류, 고세균류)에 대한 생물 자원을 8개 유형(표본, 조직, DNA, 배양체, 생체, 종자, 추출물, 건조시료)의 정보로 제공하고 있습니다.
