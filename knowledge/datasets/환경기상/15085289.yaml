summary_user: 참나무·소나무·잡초류 꽃가루농도위험지수를 지점(areaNo)과 발표시간별로 오늘·내일·모레 예측값으로 담는 기상청 보건기상지수 API이며, 범위는 전국이지만 검증 호출에서는 0행이 수신됐다. 알레르기 환자나 돌봄 기관이 "내일 우리 지역 소나무 꽃가루 위험이 높아 야외활동을 줄여야 하나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 지점코드(areaNo)를 지역명·행정구역 코드와 매핑하거나 같은 기상청 코드로만 다른 기상 데이터와 잇는다.
description_portal: "꽃가루농도위험지수(참나무/소나무/잡초류), 감기가능지수 등의 정보를 조회할 수 있는 기상청 보건기상지수 조회 서비스입니다. 봄·여름·가을철 주요 꽃가루 발생 시기와 연계하여 알레르기, 호흡기 질환, 기관지 천식 등 건강관리 정보를 사전에 확인할 수 있으며, 일상생활이나 야외활동 계획, 취약계층 돌봄 서비스에도 활용 가능합니다. 특히 어린이, 노약자, 알레르기 환자 등 건강 취약계층의 안전한 생활 지원에 기여합니다.목록명 변경 안내: 검색 및 활용 편의성을 높이기 위해 '보건기상지수 조회서비스'를 '꽃가루농도위험지수 조회서비스'로 수정하여 제공합니다. (2023.5.2.)"
