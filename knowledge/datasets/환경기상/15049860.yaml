description_portal: 충청남도 대기오염측정망 1시간 평균자료는 도내 대기질 측정소에서 수집된 관측값을 1시간 단위로 산출한 평균 데이터를 제공한다. 본 자료에는 측정일시와 측정소명을 기준으로 미세먼지 등 대기오염 항목의 줄임명과 전체명, 시간 평균값이 포함되어 있어 항목별 대기질 현황을 확인할 수 있다. 또한 상태값과 수신구분 정보를 통해 자료의 정상 수집 여부와 품질 상태를 함께 파악할 수 있으며, 저장일시 정보를 포함하여 데이터 관리 이력도 확인할 수 있도록 구성되어 있다. 해당 자료는 시간대별 대기질 변화 분석, 경보 운영 지원, 대기환경 관리 및 정책 수립을 위한 기초 자료로 활용된다.
