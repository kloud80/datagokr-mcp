summary_user: 경기도 내 수질자동측정소의 설치·운영 현황을 측정소 한 곳당 한 행으로 담으며, 측정소명·하천명·설치연월·측정항목과 도로명·지번 주소, WGS84 위경도 좌표를 포함한다. 분석가가 특정 하천이나 시군에 자동측정소가 어디에 있었고 어떤 항목을 측정했는지 확인할 때 쓰며, 측정값 시계열을 볼 때 측정소 위치를 찾는 참조표로 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 시군 코드(SIGUN_CD)나 측정소명·하천명을 이름으로 맞추거나 좌표를 공간 결합해 하천·수질 측정 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 수질자동측정소에 대한 설치 및 운영 현황 정보를 제공하며, 측정소명, 설치주소(도로명·지번), 하천명, 설치연월, 측정항목, 위경도 좌표(WGS84 기준) 등의 항목으로 구성되어 있습니다. 수질자동측정소는 수질 오염을 실시간으로 감시하고 주요 수질 항목을 자동으로 측정할 수 있는 설비를 갖춘 장소로, 환경오염의 조기 탐지와 대응에 활용됩니다. 해당 데이터는 수질 환경 분석, 수계별 수질 오염 감시체계 구축, 수자원 관리정책 수립 등에 유용하게 활용될 수 있으나, 현재는 운영이 중단되었으며 일부 측정소는 2020년 철거됨에 따라 데이터 갱신이 종료된 상태입니다. Open API를 통해 시군별 세부 정보 조회가 가능하나, 갱신은 더 이상 이루어지지 않습니다.
