description_portal: 이 데이터는 경남개발공사에서 관리하는 건물 및 차량의 에너지 사용량을 연도 및 월 단위로 집계한 자료로, 공사 전체의 에너지 소비 실태 및 온실가스 배출량 추정에 필요한 기초 데이터입니다.전력(kWh)은 주로 공사 사옥 등 건물의 전기 사용량을 나타내며, 휘발유·경유·가스/디젤(ℓ)은 공사에서 운용하는 차량의 월별 연료 소비량을 측정한 것입니다.데이터는 **연도, 월, 에너지 사용량(또는 배출량), 연료 종류, 단위, 시설 구분(건물/차량)**으로 구성되어 있으며, 전기 사용량은 건물로, 연료 사용량은 차량으로 시설구분됩니다.연료 구분은 전력, 휘발유, 경유, 가스/디젤 등으로 구체화되어 있으며, 각각의 항목은 kWh 또는 ℓ 단위로 표기되어 있습니다.특히, 지속가능발전목표(SDGs), 탄소중립 실현, 정부의 에너지효율화 정책 등과의 연계분석이 가능하며, 이 데이터를 활용하여 월별 사용 추이 분석, 연료별 배출량 계산, 에너지 절감 정책 효과 분석 등 다양한 활용이 가능합니다.공사 내부적으로는 에너지 사용 감축 계획 수립, 에너지 비용 관리, ESG경영 지표 작성 등에 직접적인 근거 자료로 활용될 수 있으며, 외부적으로는 지자체 및 국가 단위의 온실가스 인벤토리 구축, 탄소배출량 산정 보고 등에 기초 자료로 제공될 수 있습니다.또한, 차량 부문의 경우 연료 종류별 사용량이 별도로 집계되어 있어, 향후 친환경 차량 도입 효과, 연료별 비용 구조, 주행 효율 분석 등에도 응용 가능하며, 에너지 수급 및 관리체계 수립의 기초자료로도 활용도가 높습니다.
