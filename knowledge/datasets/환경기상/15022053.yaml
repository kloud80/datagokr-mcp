summary_user: 대구광역시 9개 구·군에 등록된 배출가스 전문정비사업자의 업소명·대표자·소재지·전화번호·측정항목을 업소 1곳당 한 행으로 담은 등록현황 파일로, 포털 설명 기준 2026년 3월 31일 현재 25개소를 담는다. 운행차 배출가스 허용기준 초과로 개선 명령을 받았거나 종합검사에 두 번 이상 불합격한 차량 소유자가 '우리 구 근처에서 배출가스 정비를 맡길 곳이 어디인가'를 찾을 때 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 업소명·소재지 주소를 이름·주소 매칭으로만 이어 쓰며, 지역 컬럼으로 구·군 단위 집계를 낸다.
description_portal: 대구광역시 9개구군(중구,동구,서구,남구,북구,수성구,달서구,달성군,군위군)에 인허가를 받은 배출가스 전문정비 사업자에 대한 데이터로서 2026.3.31기준 25개소에 대한 등록현황(상호, 대표자, 소재지, 전화번호, 측정항목)에 대한 데이터임. 배출가스 전문정비사업자는 운행차에 대한 점검 결과 배출되는 유해가스가 운행차 배출허용기준을 초과하는 경우 개선사항 확인업무 대행 또는 종합검사 2회 이상 불합격 차량의 배출가스 관련 정비점검을 통해 적법하게 개선할수 있도록 하며, 이는 차량 성능을 유지,보호하는 동시에 대기오염 저감 등 대기환경을 보호함.
