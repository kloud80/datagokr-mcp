summary_user: 경기도 내 환경컨설팅회사를 사업장 한 곳당 한 행으로 담고, 사업장명·인허가일자·영업상태·폐업일자·주소·위경도 좌표와 실험실 주소 정보를 함께 제공한다. 사업자나 분석가가 "우리 시군에서 지금 영업 중인 환경컨설팅회사는 어디이고 실험실은 어디에 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)·사업장명·주소 같은 이름·코드 매핑으로만 잇고, 위경도 좌표로 공간 데이터와 겹쳐 본다.
description_portal: 이 데이터는 경기도 내에서 환경행정 절차에 대한 상담, 정보 제공 및 대행 업무를 수행하는 환경컨설팅 회사의 정보를 제공합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 사업장 주소, 위도·경도 좌표, 업태 정보, 위탁업체명, 실험실 주소 및 면적 등이며, 경기도 31개 시군에 걸친 인허가 정보를 포함합니다. 본 데이터는 행정안전부에서 관리하며, 주간 단위로 갱신됩니다. 실험실 정보 항목은 도로명주소, 건물 층수, 실험실 특수주소 등까지 포함되어 있어 세밀한 위치 기반 분석 및 공간정보 시스템 연계에 유리합니다. 데이터는 환경 관련 인허가 제도 분석, 컨설팅 산업 분포 현황 파악, 지역별 환경기업 현황 관리, 행정 효율화 등에 활용될 수 있습니다. Open API 형태로 제공되어 실시간 데이터 활용이 가능하며, 다양한 활용 분야에서 정책 기반 자료로 활용도가 높습니다.
