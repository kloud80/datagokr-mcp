description_portal: 이 데이터는 국립생태원이 2014년 개원 이후 수행해온 전국 해안사구 생태계조사의 연도별 사업 정보를 정리한 자료입니다. 해안사구는 연안 생태계에서 매우 중요한 생물서식지이자 자연재해 방지 기능을 갖춘 지형으로, 본 데이터는 그러한 사구 생태계를 보전·관리하기 위해 실시된 정기조사의 대상지와 사업명을 포함합니다. 조사대상지는 동·서·남해안 및 섬 지역에 분포한 주요 사구이며, 연도별로 구분되어 조사된 지역 이름과 사업명이 명시되어 있어 생태계 변화의 시계열적 추적이 가능합니다. 해안사구 조사 항목은 주로 식생 구성, 토양 특성, 서식종 분포, 훼손 여부, 복원 필요성 등을 포함하며, 본 데이터는 이들 정보를 조사한 사구의 위치와 조사 연도, 조사 명칭 중심으로 제공됩니다. 해당 데이터는 해안사구 생태계 보전정책 수립, 지역별 모니터링 계획 수립, 연구기관의 자료 활용 등에 폭넓게 활용될 수 있는 기초자료입니다. 특히 해양과 연안 환경의 연계 생태보전 정책과의 정합성 확보를 위한 참고자료로도 중요합니다.
