description_portal: '[개요]국가물산업클러스터에서는 물산업 진흥과 물기업 지원을 위하여 대강당, 강의실 등 편의시설과 게스트하우스(숙박시설) 등을 관리·대여하고 있습니다. 물산업 종사자 및 업무 관련자들이 편리하게 이용할 수 있도록, 관리 중인 시설관리 정보를 개방합니다.[데이터 목록 및 주요내용]강의실 : 물산업 관련 교육을 위한 강의실 정보게스트하우스정보관리 : 물산업클러스터 시설이용 및 업무처리 등을 위하여 숙박이 필요한 경우 이용할 수 있는 게스트하우스 시설 명세대관시설정보관리 : 부지내 다목적실, 강의실, 대강당, 세미나실 등 대관이 가능한 시설의 명세도서관 도서목록 : 국가물산업클러스터 부지 내 운영중인 도서관에서 보유한 도서 목록입주정보 : 국가물산업클러스터 부지에 입주코자 하는 기관·기업들을 위한 입주시설 정보'
