summary_user: "서울 동작구에서 생활쓰레기를 대행 수거하는 업체별로 업체명, 담당 대행구역(예: 노량진1·2동), 수거차량 주차구역과 그 주소, 경유하는 쓰레기집하장, 처리 방식 비고를 한 행씩 담은 소규모 파일(CSV 735바이트)이다. 동작구 주민이 '우리 동네 쓰레기는 어느 업체가 수거하고, 민원은 어디에 문의해야 하나'를 확인하거나, 분석가가 동별 수거 담당 체계를 파악하는 데 쓴다. 전역 조인 키가 없어 대행구역의 동 이름이나 주차구역 주소 문자열로 다른 동작구 폐기물 배출·수거 지점 데이터나 행정동 자료와 맞춰 이어 쓴다."
description_portal: 서울특별시 동작구 쓰레기 수거업체 정보 데이터는 동작구에 위치한 쓰레기 수거업체명, 대행구역, 주차구역, 주소 등을 포함하고 있습니다.데이터에는 해당 업체가 속한 행정구역을 확인할 수 있는 시군구 항목이 포함되어 있습니다.쓰레기 수거업체명 항목을 통해 각 수거업체의 명칭을 확인할 수 있습니다.대행구역 항목에는 노량진 1, 2동 등 업체가 담당하는 수거 구역 정보가 포함됩니다.주차구역 항목에는 수거 차량이 주차되는 장소 정보가 포함됩니다.비고 항목에는 수거된 폐기물의 처리 방식 등 추가 정보가 포함됩니다.
