description_portal: '환경기준은 국민의 건강과 환경을 보호하기 위해 정부가 설정한 오염물질 허용 기준이며,법적·행정적 기준을 포함하고 있습니다. 환경기준은 환경오염 수준을 평가하고 정책을 수립하기 위한 기준값으로 활용되며, 전국의 환경측정망에서 생산되는 관측 자료와 비교하여 환경 상태를 판정하는 데 사용됩니다. 또한 정부와 지자체의 환경관리 정책, 오염 저감대책, 개선 목표 등을 수립하는 데 중요한 근거 자료가 됩니다.○ 데이터 제공 항목 - 국내 환경기준 : 오염물질 종류, 단위, 국가기준, 측정방법 - 국가별 환경기준 : 한국, 미국, 영국, 호주, 일본, 홍콩, WHO, EU'
