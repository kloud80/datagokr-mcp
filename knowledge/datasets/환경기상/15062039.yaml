summary_user: 대전광역시 서구에 있는 대기오염물질 배출시설 설치 사업장을 한 곳씩 담은 원천 목록으로, 업소명·지번/도로명 주소·종별·업종명·배출 오염물질·위도경도를 함께 싣는다(CSV 약 25KB). 주민이나 분석가가 '우리 동네 근처에 어떤 오염물질을 내는 사업장이 몇 곳 있고 어느 동에 몰려 있나'를 확인하거나, 구청이 지도·점검 대상을 고를 때 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·행정 데이터와 잇고, 행정동코드·좌표로 행정동별 집계나 대기질 측정소·민원 위치와 공간 결합한다.
