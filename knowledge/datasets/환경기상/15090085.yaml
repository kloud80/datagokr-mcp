summary_user: 경기도 화성시 관내 음식물쓰레기 다량배출 사업장을 한 곳씩 상호·소재지(지번)·도로명주소·위도·경도·기준일자로 담은 사업장 단위 목록 파일이다. 지자체 담당자나 자원순환 사업자가 '화성시에서 음식물쓰레기를 많이 내는 사업장은 어디에 몰려 있나'를 지도에 찍어 점검·수거 계획을 세우는 데 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 주소나 좌표로 공간 매칭하거나 상호명으로 맞춰 이어 쓴다.
description_portal: 데이터는 경기도 화성시 관내 음식물쓰레기를 다량으로 배출하는 사업장의 현황을 정리한 자료이다. 음식물쓰레기 감량 및 적정 처리를 위한 정책 수립과 행정업무에 활용하기 위해 구축되었으며, 다량배출업소의 관리 강화를 위한 기초자료로 제공된다. 주요 항목으로는 사업장의 상호명, 소재지 주소 등이 포함되며, 위생 및 환경관리 관련 부서에서 점검 및 관리에 활용된다. 해당 데이터는 민간 및 공공기관이 음식물쓰레기 관련 정책 또는 자원순환 사업에 참고자료로 활용할 수 있다. 본 데이터의 최신 정보가 필요한 경우 부서에 별도로 요청하여 최신 자료를 받을 수 있다.
