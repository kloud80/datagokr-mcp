summary_user: 국가환경산업정보시스템에 등록된 환경분야 설계·시공 사업 게시글을 건별로 나열한 파일로, 환경분야·시설유형·사업명(제목)·게시일·게시글 링크를 담으며 포털 설명상 2000년 3월부터 2026년 3월까지 등록분을 포함한다(전국·비공간). 환경산업 실무자나 연구자가 "수처리·대기 등 특정 환경분야에서 어떤 설계·시공 사업이 언제 올라왔는가"를 확인하거나 연도별 사업 등록 동향을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 환경분야·시설유형 이름 매칭이나 같은 기관 데이터와의 이름 기반 연결로만 이어 쓴다.
