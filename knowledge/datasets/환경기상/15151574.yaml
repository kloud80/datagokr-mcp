description_portal: 이 데이터는 스피커 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지와 동일한 수의 라벨링 텍스트 파일로 구성되어 있으며, 각각 'images' 폴더와 'labels' 폴더에 저장되어 있습니다. 이미지에는 다양한 형태, 크기, 색상의 스피커가 포함되어 있으며, 실내 환경을 중심으로 여러 각도와 거리에서 촬영되었습니다. 라벨링 파일은 YOLO 형식으로 작성되어 있으며, 각 이미지 내 스피커 객체의 위치 좌표와 클래스 정보가 텍스트 형태로 기록되어 있습니다. 전체 데이터는 객체 탐지 및 분류 모델 학습에 활용할 수 있도록 일관된 파일 구조와 명명 규칙을 유지하고 있습니다.
