description_portal: 한전KPS의 저공해 및 일반자동차 보유현황 자료입니다. 해당자료는 한국환경공단에서 운영하는 무공해차 통합누리집(www.ev.go.kr) "차량보유현황" 및 통합공시 알리오(www.alio.go.kr) "18-2번 저공해 자동차 현황"에서도 확인이 가능합니다. 한전KPS는 저공해 자동차 의무구매 및 임차 대상기관으로 공공부문 저공해 자동차 구매 임차 실적 비율 준수를 위해 노력하고 있습니다. 저공해차 1종은 전기차 및 수소 전기차, 2종은 하이브리드 자동차, 3종은 LPG, 가솔린 자동차 중 배출가스 조건을 만족하는 차량을 뜻합니다.
