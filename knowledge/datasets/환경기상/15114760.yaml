description_portal: 용인도시공사에서 운영하는 ‘장사시설(평온의 숲) 대기배출가스 측정 현황’은 장사시설에서 배출되는 대기배출가스량 정보를 공개하고 있습니다. 본 데이터는 2023년 기록부터 제공되며, 장사시설(평온의숲)에서 발생되는 대기배출가스(일산화탄소, 염화수소 등) 측정량 데이터를 제공를 반기 1회 정기적으로 갱신됩니다. 제공되는 항목은 측정일자, 측정시간, 측정소명(1호기~12호기), 일산화탄소, 염화수소, 황산화물, 질소산화물, 먼지 등으로 구성되어 있으며 단위는 ppm, 먼지는 mg/Sm³ 기준으로 표기됩니다.이러한 대기배출가스 측정 현황 공개는 장사시설 운영의 투명성을 확보하고, 대기환경 관리에 필요한 기초 자료 활용과 지역 환경보호와 공공의 신뢰도 향상에 기여하고 있습니다.
