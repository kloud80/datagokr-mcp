summary_user: 서울 구로구의 쓰레기종량제봉투 판매업 인허가를 판매소 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일자·영업상태(영업·폐업·휴업 등)·사업장명·지번/도로명 주소·좌표를 포함한다. 주민이 '우리 동네에서 종량제봉투를 파는 곳이 어디인가'를 찾거나, 분석가가 구로구 내 판매소 분포와 개설·폐업 변동을 지도로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 같은 기관 코드(OGDP_INST_CD) 기준으로만 맞춰 쓰며, 다른 자치구의 같은 종류 파일과 합쳐 서울 단위로 넓힐 수 있다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 쓰레기종량제봉투판매업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 쓰레기종량제봉투판매업 시설의 면적, 건축물 연면적, 업태구분 등 주요 속성이 기록된다. 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 운영 현황을 파악하는 데 활용된다. 데이터는 정기적으로 갱신되어 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계 가능하여 행정 투명성과 지역사회 정보 접근성을 높이는 기반 자료로 기능한다.
