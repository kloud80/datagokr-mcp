description_portal: 강원특별자치도 내 수질오염물질 배출업소 및 폐수배출사업장의 현황 정보를 제공합니다. 주요 제공 항목으로는 사업장명, 소재지 주소, 세부 업종, 규모,(1~5종) 지정일, 그리고 전화번호 등이 포함되어 있습니다. 강원특별자치도 18개 시·군의 지역별 수질오염원 분포 현황과 업종별 규모를 직관적으로 파악할 수 있는 자료로, 환경 정책 수립을 위한 기초 분석 연구는 물론 민간의 환경 모니터링 서비스 개발 등 다양한 분야에서 가치 있게 활용될 수 있도록 정기적으로 현행화하여 개방하는 데이터입니다.
