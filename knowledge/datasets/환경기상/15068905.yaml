description_portal: 한국남동발전의 폐기물 자가 처리량 정보입니다.2024년 1월부터 12월까지 영흥화력 및 삼천포의 폐기물 실적을 확인할 수 있으며, 연계업체, 배출업체 , 폐기물, 인계량, 운반업체, 처리업체, 인계일자, 처리장소의 정보를 포함하고 있습니다.주요 제품으로는 석탄재, 폐콘크리트(건설), 폐합성수지류(폐염화비닐수지류 제외), 무기성 오니 등이 존재하며, 처리업체 정보를 통해 발전소 부산물이 재활용되는 또는 처리되는 자원순환 과정을 파악할 수 있습니다. 이를 통해 발전소의 폐기물 관리 및 재활용 현황을 확인할 수 있습니다.
