description_portal: '본 데이터는 화성도시공사가 기후 위기 대응 및 친환경 이동 수단 확산을 위해 운용 중인 **"친환경 자동차(전기차, 수소차 등) 보유 및 관리 현황"**에 관한 통합 통계 데이터입니다.공사 업무용 차량 및 공영버스 등 공사에서 관리하는 전체 차량 중 친환경 저공해 자동차의 비중과 세부 사양을 담고 있으며, 화성시의 지속 가능한 교통 체계 구축 성과를 정량적으로 보여줍니다.1. 주요 제공 데이터 항목 및 상세 정의차량 종류 및 용도: 승용, 승합, 화물 등 차량의 형태와 행정 업무용, 공영 버스용 등 실제 운용 목적을 구분하여 제공합니다.유종 및 동력원: 전기(EV), 수소연료전지(FCEV), 하이브리드(HEV) 등 세부적인 친환경 동력원 정보를 포함합니다.차량 모델 및 연식: 구체적인 차량 모델명과 도입 시기를 제공하여 자산의 노후도 및 교체 주기를 파악할 수 있습니다.수량 및 운용 부서: 각 차종별 보유 대수와 이를 관리하는 공사 내 조직 정보를 제공합니다.2. 데이터의 전략적 가치 및 활용 분야탄소 중립 정책 모니터링: 정부의 "공공부문 저공해자동차 의무구매제" 준수 여부와 연도별 친환경차 전환율을 분석하는 핵심 지표로 활용됩니다.인프라 구축 기초 자료: 전기 및 수소 차량의 보유 수량과 주요 거점(사업소) 정보를 연계하여 충전소 설치 우선순위 결정 및 에너지 수요 예측에 기여합니다.ESG 경영 실적 증빙: 공공기관으로서 환경 보호 책임을 이행하는 과정을 데이터로 투명하게 공개함으로써 기관의 신뢰도를 높이고 경영평가 실적으로 활용합니다.'
