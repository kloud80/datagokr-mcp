summary_user: 광진구에서 대기오염물질 배출시설을 설치한 사업장을 한 건씩 담은 인허가 원장으로, 사업장명·주소·인허가일·영업상태·폐업일·업종·주요 생산품·배출시설과 방지시설의 운영시간과 연간 가동일수, 중부원점TM 좌표를 담는다. 주민이나 환경 분석가가 "우리 동네에 지금 운영 중인 대기 배출 사업장은 어디이고 어떤 업종인가"를 확인하거나 배출원 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 잇는다.
description_portal: 서울특별시 광진구_대기오염물질배출시설설치사업장 인허가 정보는 광진구 내 대기오염의 주요 원인이 되는 오염물질을 배출하는 시설을 설치한 사업장의 인허가 현황을 담고 있는 데이터입니다. 대기오염물질 배출시설이란 대기 중으로 먼지, 가스, 연기 등 유해물질을 배출할 가능성이 있는 공정 및 장비를 포함하며, 해당 시설을 신규로 설치하거나 변경·운영하기 위해 행정기관의 인허가가 필요합니다. 이 데이터는 사업장의 명칭, 소재지, 인허가 일자, 업종유형, 운영여부 등의 항목을 포함하고 있으며, 환경관리를 위한 기초자료로 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 하며, 위도와 경도 좌표는 별도로 제공되지 않습니다. 본 자료는 3일 전 기준으로 최신 인허가 내용을 반영하여 제공됩니다.
