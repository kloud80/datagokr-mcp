summary_user: 경기도 하남시 안의 환경오염물질 배출시설을 사업장 한 곳당 한 행으로 담은 원장형 파일로, 사업장명·업종·대표자와 대기·폐수 관리등급 및 종별 구분, 지번·도로명 주소와 위도·경도를 포함한다. 주민이나 분석가가 '우리 동네 근처에 대기·폐수 배출 사업장이 어디 있고 몇 종에 해당하는가'를 확인하거나, 지도에 배출시설 분포를 표시하는 데 쓴다. 전역 조인 키(사업자번호 등)는 없어서 다른 데이터와는 사업장명·주소 매칭이나 위도·경도 기반 공간 결합으로 잇는다.
