summary_user: 부산 시내 교통소음 자동측정망 6개 지점(좌동·광안동·화명동·하단동·연산동·학장동)별로 2023년 1~12월 월평균 소음측정값을 지점명·위경도·구군·지점용도·장치타입과 함께 한 행에 담은 지점별 월 집계 파일이다. 주민이나 분석가가 "우리 동네 측정소의 교통소음은 2023년에 어느 달에 가장 높았나", "지점 간 연평균 소음 차이는 얼마인가" 같은 질문에 쓴다. 전역 조인 키는 없어 구군명으로 같은 구군 단위 통계와 맞추거나 위도·경도로 도로·토지이용 등 공간 데이터와 겹쳐 쓴다.
description_portal: '○ 부산광역시 소음자동측정시스템의 평균 소음도 측정 정보 - 내용구성 : 지점고유식별코드, 지점명, 위도, 경도, 구군, 지점용도구분, 장치타입 등 - 측정기간 : 2023년1월,  2023년2월,  2023년 3월,  2023년 4월,  2023년 5월,  2023년 6월,  2023년 7월,  2023년 8월,  2023년 9월, 2023년 10월,  2023년 11월,  2023년 12월 평균 소음측정값 - 부산시 보건환경연구원에서 운영중인 부산시내 6개 지점 교통소음 자동측정망의 실시간데이터를 월간 취합하여 홈페이지 게시함 - 측정소 위치 : 좌동,  광안동, 화명동, 하단동, 연산동, 학장동'
