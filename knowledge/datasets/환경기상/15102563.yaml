description_portal: '공사 등으로 비산먼지가 발생하는 사업장의 명칭, 위치, 사업종류, 공사기간 및 규모 등을 정리한 자료.환경오염 예방 및 민원 대응을 위한 기초자료로 활용되며, 공사장 관리, 환경점검, 계절별 대기질 대응 정책 수립 등에 유용함.활용 목적 및 특징– 비산먼지 발생사업장 분포 및 공사기간 정보 파악– 공사규모 기준의 점검 대상 우선순위 설정 가능– 계절별·지역별 비산먼지 집중발생지 분석 기반 제공– 대기질 민원 대응 및 환경행정 모니터링 자료로 활용주요 항목 설명● 사업장명: 비산먼지 발생 공사를 시행하는 업체 또는 기관명● 공사장소재지: 해당 사업장이 위치한 주소 정보● 발생사업: 공사 또는 개발의 주요 유형 (예: 건축, 도로 등)● 공사기간: 비산먼지가 발생하는 공사의 시작일 및 종료일● 규모: 공사면적, 작업 범위 등 사업장의 물리적 규모 정보'
