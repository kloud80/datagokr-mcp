summary_user: 인천 부평구 안에서 공사 등으로 비산먼지가 발생하는 사업장을 사업장 한 곳당 한 행으로 정리한 파일(CSV 약 6.8KB)로, 사업장명·공사장 소재지·발생사업 유형·공사기간·대상사업 규모를 담는다. 구청 환경 담당자나 주민이 '우리 동네에서 지금 진행 중인 비산먼지 발생 공사장은 어디이고 언제 끝나는가'를 확인하거나, 규모가 큰 공사장부터 점검 순서를 정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공사장 소재지 주소나 사업장명 문자열로만 맞춰 붙이며, 주소를 좌표로 바꾸면 대기질 측정 자료와 위치 기준으로 겹쳐 볼 수 있다.
limits: 범위가 부평구 한 곳뿐이어서 인천시 전체나 다른 구와 비교하려면 각 기관 자료를 따로 모아야 한다. 사업자번호나 행정코드 같은 공통 키가 없어 배출시설 인허가·기업 정보와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다.
