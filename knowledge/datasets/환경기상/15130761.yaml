summary_user: 경기도 시군별·연도별로 천연가스를 연료로 쓰는 버스와 청소차의 보급 대수를 담은 집계 자료다. 지자체 환경·교통 담당자나 분석가가 "우리 시군의 천연가스 버스·청소차가 해마다 얼마나 늘었고 다른 시군과 비교하면 어떤가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)과 집계연도를 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도의 천연가스자동차 보급 현황을 집계한 자료로, 연도별·시군별로 천연가스 연료를 사용하는 버스와 청소차의 보급 대수를 제공합니다.주요 항목으로는 집계년도, 시군명, 버스수(대), 청소차수(대)가 있으며, 이를 통해 각 지방자치단체의 친환경 교통수단 보급 현황을 파악할 수 있습니다. 본 데이터는 대기환경 개선, 온실가스 감축, 교통부문 친환경 정책 수립, 천연가스 충전 인프라 확충 계획 등 다양한 정책 수립과 연구 목적으로 활용될 수 있습니다. 특히 도심 대기질 개선과 관련된 지표로서 환경정책 평가 및 성과분석 참고자료로 활용할 수 있습니다.
