summary_user: 경기도 양평군에서 대형폐기물(가구, 주방용품, 가전제품, 난방용품, 악기류 등)을 버릴 때 내는 수수료를 품목·규격별로 한 행씩 담은 시군구 단위 목록 파일이다. 양평군 주민이 장롱이나 냉장고 같은 물건을 내놓기 전에 크기에 따라 수수료가 얼마인지, 무료 대상인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지자체의 같은 형식 파일과는 시도명·시군구명이나 품목명(대형폐기물명)을 이름으로 맞춰 이어 쓴다.
limits: 양평군 한 곳만 다루므로 다른 시군구 수수료는 지자체별 파일을 따로 받아야 한다. 코드형 조인 키가 없어 품목명·규격 표기가 지자체마다 다르면 비교할 때 수작업으로 맞춰야 한다. 배출 신청 방법이나 수거 일정, 폐기물 발생량 통계는 담지 않는다.
