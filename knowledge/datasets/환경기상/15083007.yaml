summary_user: 한국서부발전 한 회사의 온실가스 배출량을 연도별로 집계한 작은 CSV 파일(487 bytes)로, 고정연소·이동연소·공정배출 같은 직접배출과 구입전력 간접배출, 발전량당 배출 원단위(tCO2eq/MWh)를 담는다. 분석가나 ESG 담당자가 '서부발전의 직접배출과 원단위가 해마다 줄고 있는가'처럼 회사 단위의 감축 추이를 확인할 때 쓴다. 전역 조인 키가 없어 다른 발전사 배출현황이나 사업장 배출원 자료와는 연도(년도)와 기관명을 맞춰 붙여 쓴다.
