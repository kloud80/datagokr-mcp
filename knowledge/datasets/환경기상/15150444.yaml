summary_user: 일반대기환경측정망 측정소마다 오존·미세먼지 경보제에서 어느 경보 권역에 속하는지를 담은 매핑 파일로, 물질별로 권역명과 그 권역 소속의 시작·종료 일시를 측정소 단위로 기록하며 전국 시도를 대상으로 한다. 분석가나 지자체 담당자가 '이 측정소에서 측정한 농도가 어느 권역의 미세먼지·오존 경보 발령 기준이 되는가'를 확인하고, 측정소별 시간 농도를 권역 단위 경보 판단으로 묶을 때 쓴다. 전역 조인 키는 확인되지 않았으므로, 에어코리아 측정소 정보·실시간 측정 자료와는 측정소코드나 측정소명을 같은 기관 코드 체계로 맞춰 연결하고, 행정구역 데이터와는 시도·군구 이름 매핑으로 잇는다.
description_portal: 본 데이터는 일반대기환경측정망에서 측정된 가스상태 오염물질(오존)과 입자상태 오염물질(미세먼지)에 대한 측정소별 대기 경보 권역 정보입니다.미세먼지 경보제는 각 지자체에서 고농도 미세먼지 발생 시 국민들에게 경계토록 알려 주고 오염수준별 국민 행동 요령 및 조치사항을 이행하도록 함으로써 피해를 저감케 하는 제도입니다.17개 시도의 시장(도지사) 등이 해당 시도의 미세먼지 경보제 발령 및 해제를 담당하고 있으며, 총 58개의 권역으로 구분되고 있습니다.오존 경보제는  고농도의 오존에 노출될 경우 피해를 입을 수 있는 호흡기 질환을 가지고 있는 환자나 노약자, 어린이들에게 농도가 높음을 알려 피해를 최소화하고, 오존 농도를 줄이는데 있어 시민들의 자발적인 협조를 구하기 위하여 도입된 제도입니다.
