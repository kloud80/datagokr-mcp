summary_user: 국가 비점오염물질 측정망의 측정소를 한 곳씩 담은 목록 데이터로, 측정소번호·측정소명·위경도·주소·사용여부를 제공하며 전체 26건이 전국 범위로 수신됐다. 분석가나 지자체 담당자가 강우 시 오염물질을 재는 측정소가 어디에 있는지 확인하는 질문에 쓴다. 위도(lat)의 좌표 키와 측정소주소·상세주소의 주소 키로 지도나 다른 지점 데이터와 이어 쓰며, 측정소번호로 같은 서비스의 측정자료와 연결하는 용도로 볼 수 있다.
limits: 검증 호출에서 오퍼레이션 하나(/getRawData)는 최소 파라미터로 응답이 없었으므로 측정자료 조회에는 추가 파라미터 확인이 필요하다. 확인된 최신 행 날짜는 2025-12-02이나 검증 호출 조건(rlvtYr=2025, msrmtYmd=2024) 기준이라 데이터 자체의 최신성과 다를 수 있다.
