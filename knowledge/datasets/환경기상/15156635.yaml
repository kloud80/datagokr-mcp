description_portal: 비점오염원은 도시, 도로, 농지, 산지, 공사장 등으로서 불특정장소에서 불특정하게 수질오염물질을 배출하는 배출원입니다. 도시화 및 기후변화로 인한 강우패턴의 변화로 다양한 오염물질이 하천으로 유입됨과 강우시 발생하는 비점오염물질의 정확한 부하량과 주요 오염원의 파악 필요로 설치된 비점오염물질 측정망 운영을 통한 강우시 발생하는 오염물질의 관리 및 대책수립을 위한 기초자료 확보, 실효성 있는 정책수립에 이바지하는 목적으로 비점오염물질 측정망을 운영관리하고 있습니다. 비점오염원관리지역 또는 관리필요지역에 설치 운영하고 있는 국가 비점오염물질 측정망의 측정소에 대한 데이터(측정소명, 위도, 경도, 상세주소 등)와 측정소 별 미확정 측정자료(수온, PH,전기전도도, 용존산소, 탁도, T-N, T-P, TOC, 한시간단위 자료 제공)를 개방하고 있습니다.
