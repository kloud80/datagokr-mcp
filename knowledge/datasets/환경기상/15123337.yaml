description_portal: 산사태취약지역 공공데이터는 집중호우, 태풍, 지반이완, 경사면 붕괴 등으로 인해 인명 및 재산피해가 발생할 우려가 높은 지역의 현황을 체계적으로 관리하고, 재난예방·대응 및 주민대피계획 수립에 활용하기 위하여 구축된 자료이다. 본 데이터는 산림재해 우려지역에 대한 사전점검과 위험도 평가 결과를 바탕으로 취약지역의 위치, 지정배경, 관리체계 및 대피여건 등을 종합적으로 제공함으로써 행정기관의 재해예방 정책 수립은 물론 주민 안내와 안전관리의 기초자료로 활용된다. 주요 항목으로는 취약지역 지정사유, 취약지역 주소, 대피소와의 거리, 소유별, 취약지역유형, 관리주체가 포함된다. 취약지역 지정사유는 해당 지역이 산사태취약지역으로 지정된 원인을 나타내는 항목으로서 급경사지 분포, 토사유출 우려, 과거 재해 발생이력, 인접 주거지 존재 여부 등 위험판단의 근거를 제공한다. 취약지역 주소는 대상지의 행정적 위치를 명확히 식별하기 위한 정보로 현장조사, 재난통보, 공간정보 연계 및 위치기반 행정처리에 활용된다. 대피소와의 거리는 재난 발생 시 주민이 안전한 장소로 신속히 이동할 수 있는지를 판단하는 대피동선 분석의 기초자료이며, 재난대응계획과 주민대피체계 정비에 중요한 기준이 된다. 소유별 항목은 국유지, 공유지, 사유지 등 토지의 권리관계를 구분하여 관리책임 범위와 정비사업 추진 시 협의대상 판단에 활용된다. 취약지역유형은 붕괴우려지, 토석류 우려지 등 재해형태에 따른 분류정보를 제공하여 유형별 예방대책 수립과 우선순위 결정에 도움을 준다. 관리주체는 해당 지역의 유지관리, 점검, 응급조치 및 복구를 담당하는 기관 또는 부서를 의미하며, 재난 발생 시 신속한 대응체계 구축에 필수적인 정보이다. 본 데이터는 산사태 예방 중심의 선제적 재난관리, 주민생명 보호, 위험지역 모니터링, 관련 시설 정비계획 수립 등에 폭넓게 활용될 수 있는 공공데이터이다.
