summary_user: 부산 장림동 악취자동측정소에서 1시간 단위로 측정한 악취물질과 휘발성유기화합물(VOCs) 농도를 시각별로 담는 측정 원천 자료다. 황화수소·암모니아·트라이메틸아민 같은 지정악취물질과 톨루엔·자일렌·스타이렌·벤젠 등 VOCs 농도가 들어 있어, 사하구 장림동 인근 주민이나 분석가가 특정 시간대 악취 민원이 어떤 물질 농도 상승과 겹치는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 측정 시각(hourTime)을 기준으로 기상·대기질 자료와 맞추거나 같은 기관 자료와 이름으로 연결해 쓴다.
description_portal: 장림동 악취자동측정소는 실시간으로 1시간 단위 데이터를 생성하며, 부산지역 내 악취 및 휘발성유기화합물류(VOCs)의 농도 변화를 정밀하게 분석할 수 있도록 운영되고 있습니다. 본 측정소는 인근 지역에서 발생하는 악취 민원에 신속하고 효율적으로 대응하기 위한 주요 기반으로 활용되며, 지속적인 데이터 축적과 분석을 통해 지역 주민의 쾌적한 생활환경 조성에 기여하고 있습니다. 실시간 자료는 악취 확산 경로 및 발생원 파악에도 활용됩니다.(톨루엔, 자일렌 , 스타이렌, 메틸에틸케톤, 메틸아이소뷰틸케톤, 뷰틸아세테이트 등 휘발성유기화합물 등)
