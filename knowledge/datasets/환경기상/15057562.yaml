summary_user: 경기도 내 재활용센터를 센터 한 곳당 한 행으로 담은 시설 목록으로, 센터명·운영구분(직영/위탁)·도로명/지번 주소·위경도·면적·설립연월·차량 보유대수·평일/공휴일 운영시간·휴무일·취급 품목·운영기관 연락처를 포함한다. 주민이 '집 근처 재활용센터는 어디이고 주말에도 문을 여는가, 중고 가구나 가전을 받아 주는가'를 확인하거나, 분석가가 시군별 재활용 인프라 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 센터명·주소 같은 이름 매핑이나 위경도(refine_wgs84_lat/logt)를 이용한 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도의 재활용센터의 운영 현황을 정리한 자료로, 센터별 명칭, 운영구분(직영/위탁), 소재지(도로명 및 지번주소), 설립연월, 운영시간, 주요 취급 품목 등 재활용 관련 인프라 정보를 포함합니다. 특히 재활용센터의 위치정보(위도, 경도)를 포함하고 있어 공간분석이 가능하며, 각 센터의 면적, 차량보유대수, 평일 및 공휴일 운영시간 등도 제공되어 현장 운영현황을 종합적으로 파악할 수 있습니다. 생활폐기물 분리배출 정책, 재활용 품목 확대 방안, 지역별 재활용 인프라 개선 등과 관련된 정책 수립 및 연구에 활용될 수 있는 공공데이터입니다.
