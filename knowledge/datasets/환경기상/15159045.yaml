summary_user: 기상청이 고속도로변에 설치한 도로기상 관측장비에서 수집한 관측자료로, 포털 설명상 12개 고속도로 노선의 366개 지점(기본·거점·안개·결빙 4종)에서 노면상태·노면온도·시정·기온·강수·적설·풍향풍속 등 14개 요소를 지점별로 담는다. 도로관리 기관이나 물류·운송 사업자가 '지금 특정 고속도로 구간 노면이 결빙됐거나 안개로 시정이 나쁜가'를 확인하고, 분석가가 기상과 교통사고·통행 지연의 관계를 따지는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 관측지점 이름·노선명(line) 매핑이나 기상청 내부 지점 코드로만 연결한다.
limits: 포털 활용신청과 별개로 외부 사이트 apihub.kma.go.kr의 인증키(경로 파라미터 KEY)를 따로 받아야 호출된다. 행정구역 코드 같은 공통 조인 키가 없어 교통·사고 데이터와 붙이려면 지점명·노선명 매핑을 직접 만들어야 한다.
