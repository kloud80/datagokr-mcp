description_portal: 도로 기상상황.노면상태를 파악하기 위해 기상청에서 설치한 관측장비에서 수집한 관측자료를 제공합니다.관측지점은 366개소로 중부내륙, 서해안, 경부선, 무안광주대구선, 호남선, 새만금포항선, 통영-대전중부선, 순천완주선, 영동선, 서산영덕선, 중앙선, 호남선의지선 12개 고속도로로 구분할 수 있고, 관측소 종류는 기본, 거점, 목표(안개), 목표(결빙) 4종류가 있습니다.관측요소는 노면상태, 노면온도, 시정, 습도, 일누적강수량, 적설, 기온, 1분풍향.풍속, 최대순간풍향.풍속, 해면기압, 운고, 운량 14개입니다.
