summary_user: 전국 비점오염저감시설을 설치신고 접수번호 단위로 하천·수계, 사업승인·관할 기관, 저감시설 종류, 예상 부유물질·BOD 처리효율 값과 함께 시도 단위로 담는다. 수계 관리 담당자나 환경 분석가가 '특정 수계나 시도에 설치된 저감시설은 어떤 종류이며 예상 처리효율은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도명·수계명·하천명 같은 이름 매칭이나 같은 기관(한국환경공단) 데이터의 설치신고 접수번호로만 다른 수질 오염원·측정 데이터와 이어 쓴다.
description_portal: 설치신고 접수번호, 수계 번호, 사업승인기관, 관할 기관, 저감시설 코드 정보를 통해 예상 처리 부유물질 효율 값, 예상 처리 생물학적 산소요구량 효율 값 규모 용량 값 정보를 유형별 기준으로 제공하는 비점오염 저감시설 수치 정보 서비스
