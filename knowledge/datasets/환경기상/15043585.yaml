description_portal: 초단기예보모델(KLAPS)은 한반도의 기상예측을 위해 수행하는 수치예보시스템을 의미하며, 주로 한반도 영역의 3차원 분석 · 예측에 이용됩니다.일24회 12시간 예측을 수행합니다.<자료다운로드 방법>1. 원하시는 조건에 맞춰 검색을 통해 조회된 결과 목록에서 다운로드 받을 자료 선택 후 담기 버튼 선택합니다.2. 기상자료개방포털의 '마이페이지 > 대용량자료신청대기목록'에서 다운로드를 신청합니다.3. 제공받은 접속정보로 FTP프로그램을 통해 SFTP로 접속하여 다운로드 받습니다.
