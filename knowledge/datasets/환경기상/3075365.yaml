description_portal: 이 데이터는 대구광역시 수성구 관내 특정토양오염관리대상시설에 대한 현황을 정리한 자료로, 시설의 상호명과 소재지(지번) 정보를 포함한다. 해당 시설은 「토양환경보전법」에 따라 지정된 오염 우려 시설로, 토양오염 유발 가능성이 높아 정기적인 관리와 점검이 필요하다. 본 자료를 통해 지역 내 오염 취약지역 및 시설의 위치를 파악할 수 있으며, 환경오염 예방 및 효과적인 환경관리정책 수립에 활용된다. 수성구청은 관련 법령에 따라 해당 시설을 등록·관리하고 있으며, 이 데이터는 토양오염 관리 실태 분석, 환경영향평가, 지역환경위험요소 파악 등의 행정 및 연구 목적으로 사용된다. 정기적인 갱신을 통해 최신 현황이 반영된다.
