summary_user: 부산 연안·근해역 측정 지점(포털 설명상 30개 지점, 해운대·광안리·감천항·다대포 등)별로 용존산소량, 용존무기질소·인, 총대장균, 수온, 염분, 납 등 해양 수질 측정값을 담는 API로, 필드상 조사연도(inspecYy)·조사분기(inspecQt)·지점(site) 단위로 항목값이 나뉜다. 시민이나 분석가가 "해운대나 광안리 앞바다 수질이 분기별로 어떻게 달라졌나", "특정 연안의 용존산소나 대장균 수치가 나빠졌나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양수질 데이터와는 지점 이름 매핑으로만 연결한다.
description_portal: 부산지역 연안 및 근해역 30개 지점의  해양 수질 측정 정보를 개방합니다.개방된 데이터는 5부두, 감천항, 광안리, 고리, 남항, 다대포, 녹산, 송도, 해운대, 이기대, 신호, 장림, 동천, 대변, 민락동 등 부산 연안 전 지역의 수질을 측정한 데이터입니다.용존산소량(DO), 용존무기질소농도(DIN), 용존무기인농도(DIP), 총대장균, 수온, 염분, 납 등 14개 항목에 대한 데이터를 포함하고 있습니다.수질 측정 정보를 통해 해양생태계를 모니터링하여 환경보호에 도움이 되고 해산물의 안전성과 해양산업 종사자들의 건강과 안전에 도움이 됩니다.
