summary_user: 대구광역시가 상시 운영하는 교통소음 자동측정소 8개소의 측정값을 측정소·날짜·시간별 1시간 등가소음도(dB(A))와 상태값으로 담은 CSV 파일(약 225KB)입니다. 시민이나 분석가가 대구의 특정 도로 주변 측정소에서 시간대별 교통소음이 얼마나 되는지, 야간 소음이 높은 곳이 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소명을 이름으로 매핑하거나 날짜·시간을 기준으로 대구의 대기질·교통량 자료와 맞춰 이어 쓴다.
description_portal: 대구광역시는 교통량 증가 및 도로 신설 등으로 인해 해마다 교통소음 피해 사례가 증가함에 따라, 지역별 교통소음 실태 현황을  파악하고 소음 저감대책 수립의 기초자료로 활용하기 위해  교통소음자동측정소 8개소를 상시 운영하고 있습니다. 측정자료는 측정기기의 정상가동 여부 및 주변 상황, 기상조건 등을 고려한 후 자료의 이상유무를 판단하여 이상 소음으로 판명 시 정상 자료에서 제외합니다. 1시간동안 측정한 12회의 5분 등가소음도 자료 중 유효한 5분 등가소음도가 9회 이상인 경우 1시간 등가소음도로 표시합니다.
