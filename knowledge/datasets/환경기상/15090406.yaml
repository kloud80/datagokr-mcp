description_portal: (기후통계분석 기상현상일수) 기상청 관측 이래 지역, 관측 지점별로 일강수량이 0.1mm 이상인 날의 수를 산출하여 제공합니다.강수현상에는 비, 이슬비, 얼음싸라기, 눈, 싸락눈, 진눈깨비, 싸락우박, 우박, 눈보라 등이 포함됩니다.통계값을 산출함에 있어 '지역/지점'의 '지역'은 전국 및 광역 단위의 평균 제공(1973년~)합니다.전국 및 광역별 평균 산출에 사용되는 지점은 62개 지점이며 제주도 4개 지점은 제주지역 산출에만 사용됩니다.단, 관측개시일 및 자료량을 고려하여 6개소(철원, 안동, 창원, 태백, 장수, 봉화)는 1990년 통계부터 반영되어 62개소이며, 1989년 이전에는 56개소로 산출합니다.
