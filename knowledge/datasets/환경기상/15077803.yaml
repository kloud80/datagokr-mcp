summary_user: 대전광역시 동구 관내 폐의약품 수거함 설치 장소와 폐의약품 수집에 참여하는 약국을 한 곳당 한 행으로 담은 지점 목록(CSV 약 17.8KB)으로, 구분·수거장소명·도로명/지번 주소·행정동·전화번호를 담는다. 동구 주민이 집에 남은 약을 가까운 어느 약국이나 수거함에 버릴 수 있는지 찾거나, 구청·분석가가 행정동별 수거 지점 분포를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 행정동명을 기준으로 맞춰 잇고, 다른 지자체의 폐의약품 수거함 파일과는 같은 항목끼리 합쳐 비교한다.
description_portal: '이 데이터는 대전광역시 동구 관내의 폐의약함 수거 현황으로, 세부 내용으로는 폐의약품 수거함이 설치된 위치 및 폐의약품 수집을 참여하는 약국의 현황, 주소, 전화번호 등을 포함하고 있습니다.해당 데이터는 동구 관내에서 폐의약품 분리배출을 위한 수거 인프라 현황을 나타내는 자료로, 환경보호, 주민안전, 위생행정 기초자료, 공공서비스 개선 등으로도 활용될 수 있습니다.해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 7. 21.'
