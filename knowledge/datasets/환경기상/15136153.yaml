description_portal: 서울시 토양오염우려지역 토양오염도 정보는 서울시 내 토양오염이 우려되는 지점을 대상으로 오염 수준을 정량적으로 파악하기 위해 구축된 환경 데이터입니다. 자료기준년도는 각 조사 결과가 어느 연도를 기준으로 생산되었는지를 나타내며, 이를 통해 연도별 토양오염도의 변화 추세를 분석할 수 있습니다. 조사항목명은 납, 카드뮴, 구리, 아연 등 중금속이나 석유계 탄화수소, 유기용제 등 구체적으로 어떤 오염 물질을 대상으로 측정했는지를 보여주는 항목입니다. 평균값은 각 조사항목별로 조사 대상 지역들에서 측정된 농도나 수치를 산술 평균한 값으로, 해당 연도와 항목에 대한 대표적인 오염 수준을 제시하는 지표입니다. 이 값은 토양환경보전법 등 관련 법령에서 정한 토양오염우려기준, 대책기준과 비교하여 오염도가 기준을 초과하는지 여부를 판정하는 데 활용될 수 있습니다. 또한, 특정 오염물질의 평균값 변화를 장기간 추적하면 정화사업의 효과나 신규 오염원 발생 여부를 간접적으로 파악할 수 있습니다. 이 데이터는 토양정화 우선순위 설정, 토양보전 정책 수립, 도시계획 시 환경영향 검토, 시민 대상 환경정보 제공 등 다양한 정책·연구 분야에서 기초 자료로 활용될 수 있는 중요한 환경통계입니다.
