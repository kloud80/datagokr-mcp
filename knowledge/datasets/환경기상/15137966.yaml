summary_user: 수질오염사고대응예측시스템에 입력된 수질오염사고를 사고 건별로 담은 파일로, 사고명·발생일시·수계·유출량과 단위·오염물질·모델링 좌표가 들어 있으며 범위는 전국이고 위치는 개별 좌표 단위다(csv 약 13.7KB). 분석가나 방제 담당자가 "어느 수계에서 어떤 물질이 얼마나 유출된 사고가 있었나"를 확인하거나, 과거 사고 유형을 모아 확산 예측 모의조건을 검토할 때 쓴다. 전역 조인 키가 없어서, 수계명이나 좌표를 기준으로 수질측정망 측정소 시계열이나 하천·댐 수자원 데이터와 이름·위치로 맞춰 이어 쓴다.
description_portal: 수질오염사고대응예측시스템은 수질오염사고 발생시 오염물질의 확산을 예측하여 방제활동에 도움을 주는 역활을 한다.수질예측 모델링의 모의조건에 필요한 데이터(발생일시, 수계명, 지점 좌표, 유출량, 단위, 물질명, 오염물질코드 등)를 수집하여 입력자료로 구축한다.모델링을 수행하고 사고지점으로부터 하천 하류에 위치한 취수장까지의 도달시간 및 확산농도를 유관기관에 전파한다. 대규모 수질오염 위기대응 매뉴얼에 따라 사고대응 유관기관에 신속하고 정확한 정보를 제공하여 방제활동에 도움을 주는 것이 이 시스템의 활용 목적이다.
