summary_user: 보령시에서 포획된 유해야생동물을 건별로 담으며, 신고일자·포획일자, 개체 종류, 포획 방식, 포획지 시도·시군·상세주소와 위도·경도, 포획 개체 수, 지역 유형을 기록한다. 지자체 담당자나 분석가가 보령시 안에서 어떤 유해야생동물이 언제 어디서 얼마나 포획되는지, 피해 다발 지점이 어디인지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군 이름이나 위경도 좌표로 맞춰 이어 써야 한다.
limits: 실측 컬럼에 표준 행정코드 같은 전역 조인 키가 없어 이름 매핑이나 좌표 기반 공간 결합으로만 연결된다. 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 5,000회로 호출이 제한된다.
