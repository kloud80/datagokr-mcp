description_portal: '항공기의 안전한 운항을 지원하기 위해 전국의 7개소 공항에서 공항기상관측을 실시합니다.공항기상관측장비(Aerodrome Meteorological Observation System)는 항공기의 안전한 이 · 착륙에 필요한 활주로 부근의 기상실황을 실시간으로 관측하여 제공하는 항공기상관측의 기본 장비입니다.- 요 소: 기온, 강수, 바람, 기압, 습도, 적설, 구름, 시정, 일기현상- 지 점: 7개소 공항- 보유기간: 2005년 2월 ∼ 현재(지점별 상이함)(참고) 정시관측은 고정된 시간간격을 두고 실시하는 관측, 항공기상청은 국제규정에 따라 매일 24시간 정시관측을 실시, 정시관측에는 지상풍, 시정, 활주로가시거리, 현재일기, 구름, 기온, 이슬점온도, 기압 등을 포함합니다.'
