summary_user: 전국 7개 공항의 활주로 부근에서 공항기상관측장비(AMOS)로 관측한 기온·강수·바람·기압·습도·적설·구름·시정·일기현상 실황을 관측지점 기준 시간 단위로 담는 관측 원천 자료입니다. 항공 운항 분석가나 연구자가 특정 공항의 시정·바람 같은 이착륙 관련 기상이 특정 시각에 어땠는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 기상 관측 자료(ASOS·AWS 등)와는 공항·지점 이름 매핑이나 기상청 지점 코드로만 연결한다.
limits: 호출에는 포털 활용신청과 별개로 기상청 API허브(apihub.kma.go.kr) 인증키가 필요하다. 전국 7개 공항 지점만 다루는 비공간 자료라 공항 밖 지역의 기상이나 행정구역 단위 분석에는 쓸 수 없다.
