summary_user: 울산광역시 남구에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 원장 파일로, 폐기물구분·사업장명·소재지·폐기물종류·전화번호·신고기준년도를 사업장 단위로 담는다. 남구에서 어떤 사업장이 어떤 종류의 폐기물을 배출한다고 신고했는지 찾으려는 폐기물 처리업자나 지역 환경 분석가가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 사업장명이나 소재지 주소를 맞춰 붙여야 한다.
description_portal: 울산광역시 남구 사업장폐기물 배출자 신고현황에 대한 데이터로폐기물구분, 사업장명, 소재지, 폐기물종류, 전화번호, 신고기준년도, 데이터기준일자 항목을 제공합니다.신고기준 연도는 1992년부터 ~ 2026년까지이며,  데이터 추출일은 2026년 5월 12일 입니다.대표 전화번호가 핸드폰번호인 경우에는 개인정보를 포함하기 때문에 제외하여 등록하였습니다.데이터 갱신주기는 연간이며, 다음 갱신일은 2027년 5월 31일입니다.데이터 관련 문의는 공공데이터 담당자(052-226-5363)으로 연락주시면 됩니다.
