description_portal: 이 데이터는 서울특별시 내에 설치된 빗물이용시설의 공간 위치 정보와 기본 속성을 제공하는 자료입니다. 좌표계는 EPSG:5186 (GRS80 타원체, 한국 중부원점 기준 Y축 +600,000m)로 제공되며, 인코딩 방식은 windows-949입니다.  데이터에는 각 시설의 위치(좌표), 시설명, 설치구역 등이 포함되어 있어 도시 내 저영향개발(LID) 인프라로서의 빗물이용시설 현황을 GIS 분석, 도시 침수 대응, 친환경 설계 등에 활용할 수 있습니다. 또한 설치 밀도 분석을 통해 빗물 재활용이 상대적으로 부족한 지역을 식별할 수 있고, 자치구별 또는 유역별 인프라 계획 및 정책 수립에 기반 자료로 활용할 수 있습니다.[좌표계] EPSG:5186 (GRS80 타원체의 한국 중부원점이며 Y 축으로 600000미터만큼 이동시킨 좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.
