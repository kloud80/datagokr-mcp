summary_user: 울산시설공단이 관리하는 야생동물 차량충돌(로드킬) 구조 기록을 한 건씩 담은 파일로, 동물의 분류(강)·동물명, 멸종위기종·CITES·천연기념물 해당 여부, 발견 주소와 위도·경도, 구조일자, 발생원인을 행 단위로 기록한다(CSV 약 38KB). 도로 관리자나 생태 분석가가 어느 도로 구간에서 어떤 종, 특히 보호종의 차량충돌이 잦은지 확인해 저감 시설 위치를 정하는 데 쓴다. 전역 조인 키는 없어서, 좌표나 주소를 기준으로 도로·보호구역 공간 레이어와 겹쳐 보거나 동물명으로 종 분포 자료와 이름을 맞춰 연결한다.
description_portal: 울산시설공단에서 관리하는 야생동물 로드킬 모니터링 현황 데이터는 다양한 항목으로 구성되어 있으며, 이를 통해 로드킬 사고에 대한 체계적인 모니터링이 가능합니다. 이 데이터에는 강, 동물명, 멸종위기종, 야생동물국제거래협약, 천연기념물, 발견된 주소, 위도, 경도, 구조 일자, 발생원인 등의 정보가 포함됩니다. 동물명은 피해를 입은 동물의 종류를 나타냅니다. 멸종위기종 항목은 해당 동물이 멸종위기종에 속하는지 여부를 기록하며, 야생동물국제거래협약과 천연기념물은 동물의 보호 상태를 표시합니다. 또한, 발견된 주소는 로드킬이 발생한 구체적인 위치를, 위도와 경도는 해당 위치의 정확한 좌표를 제공합니다. 구조 일자는 동물이 구조된 날짜를 기록하며, 발생원인은 사고가 발생한 원인에 대한 정보를 포함합니다.
