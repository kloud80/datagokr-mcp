summary_user: 해양환경공단이 수거한 해양쓰레기 실적을 지역(구분)별 행으로, 2008년부터 2022년까지 연도별 열로 정리한 집계표입니다(약 7KB CSV 파일). 연구자나 지자체 담당자가 '우리 권역의 해양쓰레기 수거량이 15년간 어떻게 변했나'처럼 지역별 수거 추이를 비교하는 데 씁니다. 표준 지역코드 같은 전역 조인 키가 없어 다른 데이터와는 지역 이름을 직접 맞춰서만 이어 쓸 수 있습니다.
description_portal: 해양환경공단이 수행한 해양쓰레기 수거 실적 중 지역별 집계 정보를 제공합니다. 본 데이터는 전국 연안, 항만, 도서지역 등에서 수거된 해양쓰레기의 총량을 지역 단위로 분류하여 정리한 것으로, 연도별 변화 추이와 권역별 특성도 포함되어 있습니다. 쓰레기 유형은 폐어구, 플라스틱, 생활쓰레기 등으로 구분되며, 수거 규모와 발생 밀도 분석에 활용할 수 있도록 구성되어 있습니다. 본 자료는 해양쓰레기 저감 정책 수립, 지자체별 환경관리 성과 평가, 지역 맞춤형 정화사업 기획 등에 유용하게 활용됩니다. 데이터는 표 및 통계자료 형태로 제공되며, 공공기관 및 연구기관의 해양환경 개선 정책 수립에 필요한 기초자료로 제공됩니다.
