description_portal: 본 데이터는 인천광역시 미추홀구 관내 미세먼지 쉼터 현황을 수록한 자료입니다. 미세먼지 쉼터는 대기질 악화 시 주민들이 안전하게 머무를 수 있도록 마련된 실내 휴식 공간으로, 주로 노인문화센터, 노인복지관, 경로당 등 노인시설을 활용하여 운영됩니다. 데이터에는 쉼터명칭, 도로명 주소, 지번 주소, 시설유형, 이용가능 인원, 평일 및 주말·공휴일 운영시간, 시설 연락처 항목이 포함되어 있습니다. 예를 들어 용현노인문화센터, 미추홀구노인복지관, 주안노인문화센터 등 주요 거점에 쉼터가 지정되어 있으며, 이용 인원은 수십 명에서 천여 명까지 다양합니다. 평일은 주로 오전 9시부터 오후 6시까지 운영되며, 일부 시설은 주말에도 제한적으로 개방됩니다. 본 자료는 주민들이 생활권 내 가까운 쉼터를 찾아 신속히 대피할 수 있도록 지원하고, 행정기관은 미세먼지 저감 대책 및 주민 건강 보호 정책을 수립하는 데 기초자료로 활용됩니다. 데이터는 정기적으로 갱신되어 최신 운영 현황을 반영하며, 대기질 악화 상황에서의 안전망 구축과 취약계층 건강 보호에 중요한 기반 자료로 제공됩니다.
