summary_user: 경기도 내 대기·수질·소음진동 방지시설을 설계·시공하는 환경전문공사업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록이며, 인허가일·영업상태·폐업일, 주소, 위경도 좌표, 실험실 위치·면적 등을 포함한다. 방지시설 공사를 맡길 업체를 찾는 사업자나 시군별 환경공사업체 분포와 영업 중·폐업 현황을 보려는 분석가가 "우리 시군에서 지금 영업 중인 환경전문공사업체는 어디인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 데이터와는 시군 코드(SIGUN_CD)나 사업장명·주소를 이름·코드로 맞추거나 위경도 좌표를 공간 결합해서 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 대기오염, 수질오염, 소음 및 진동 등의 환경오염물질을 줄이기 위한 방지시설을 설계 및 시공하는 환경 전문 공사업체에 대한 정보를 제공합니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 주소, 전화번호, 실험실 위치 및 면적, 위탁업체명, 위경도 좌표 등이 포함되어 있으며, 경기도 31개 시군에 걸친 광범위한 인허가 정보를 제공합니다. 해당 데이터는 Open API로 제공되며, 환경설비 관련 기업의 지역 분포 분석, 인허가 현황 파악, 환경공사 산업체의 특성 연구 등에 활용됩니다. 주간 단위로 갱신되며, 환경 인프라 구축 정책 수립 및 민간 투자 유도에도 기초자료로 활용될 수 있습니다.
