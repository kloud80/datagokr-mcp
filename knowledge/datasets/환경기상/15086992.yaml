summary_user: 광주 광산구에서 구조·치료된 야생동물을 한 마리(건)씩 기록한 원천 파일로, 구조일자·동물명·구조지역·주소·부상내용을 담고 있으며 파일 크기는 약 5KB(CSV)로 작다. 구 단위 야생동물 보호 담당자나 연구자가 '광산구에서 어떤 종이 어디서 어떤 부상으로 구조됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 주소를 지오코딩하거나 동물명을 종 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 광주광역시 광산구에서는 야생동물 구조치료 현황에 관한 상세한 정보를 제공하고 있습니다. 이 자료에는 구조된 야생동물의 구조 일자, 동물명, 구조 지역 및 위치, 부상 내용 등 다양한 항목이 포함되어 있어, 광산구 내 야생동물 보호 활동의 현황을 구체적으로 파악할 수 있도록 구성되어 있습니다. 다만, 이 데이터는 2015년부터 2016년까지 수집된 자료로, 2016년 이후에는 별도의 수집이 중단되어 최신 현황은 반영되어 있지 않습니다. 이 정보는 야생동물 보호 및 관리 정책 수립에 중요한 기초 자료로 활용되며, 부상 동물의 치료 및 보호를 위한 대책 마련에 대한 자료로 이용할 수 있습니다.
