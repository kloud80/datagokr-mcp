summary_user: 부산환경공단이 운영하는 소각시설(명지사업소 1·2호기, 해운대사업소 2호기)별로 일산화탄소·먼지·염화수소·질소산화물·황산화물 배출 농도와 일별 소각처리량을 하루 단위로 담은 데이터로, 포털 설명 기준 2025년 자료 78건(2025.5.19 기준)이다. 인근 주민이나 환경 분석가가 "우리 동네 소각장이 특정 날짜에 얼마나 태웠고 대기오염물질은 얼마나 나왔나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 사업소코드(shopCd)·사업소명이나 연·월·일 날짜로만 에어코리아 측정소 대기질 등 다른 자료와 맞춰 본다.
limits: 측정소코드 같은 공통 키가 없어 대기질 측정망 데이터와 바로 결합되지 않고, 이름·날짜 매핑이 필요하다. 시간별 실시간 대기질이 아닌 소각시설 배출 일별 자료라 생활권 대기질이나 경보 판단에는 쓰지 않는다. 호출에는 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
