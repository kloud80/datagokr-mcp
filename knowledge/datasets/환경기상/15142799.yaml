description_portal: 경상남도 통영시는 관내 풍력발전 개발과 관련된 풍황자원 조사를 위해 설치된 풍황계측기 현황을 공공데이터로 개방하고 있다. 이 데이터는 풍력발전의 입지 타당성 검토 및 해상풍력 발전단지 조성을 위한 기초자료로 활용될 수 있으며개방되는 항목은 허가일, 만료일, 해당 부지 위치, 설치 목적, 수허가자, 데이터 기준일자 등으로 구성되어 있다. 이를 통해 특정 계측기가 언제 설치 허가를 받아 언제까지 운영되었는지, 설치된 위치가 해상인지 육상인지, 설치 목적이 타당성 조사·풍황자원 측정·기상관측 등 무엇인지를 확인할 수 있다. 또한 수허가자 정보가 제공되어 사업을 추진한 기업이나 기관을 명확히 파악할 수 있으며, 최신 데이터 기준일자가 표시되어 자료의 신뢰성을 확보할 수 있다.해당 데이터에는 욕지도, 두미도, 사량도 등 통영시 해상 및 도서 지역에 설치된 풍황계측기 현황이 주를 이루며, 설치 목적은 대부분 풍력발전 사업 타당성 평가와 풍황자원 조사에 집중되어 있다. 설치 주체로는 한국남동발전㈜, ㈜대한그린에너지, ㈜해신에너지, 금오그린에너지, 통영풍력협동조합 등 다양한 공기업 및 민간 기업이 포함되어 있다.이 데이터는 통영시에서 추진되는 해상풍력 발전사업의 진행 현황을 확인할 수 있는 중요한 근거자료이며, 에너지 전환 정책, 재생에너지 개발 동향 분석, 입지 적합성 연구 등에 유용하게 활용될 수 있다.
