description_portal: 이 데이터는 석면조사 대상 건축물의 기본 현황을 제공합니다. 해당 건축물들은 석면 포함 여부 확인을 위해 조사를 받은 공공 또는 민간 시설로, 시설명, 소재지(도로명 주소), 조사 진행 상태 등의 정보를 포함합니다.자료는 영양군 조사 결과를 기반으로 하며, 건축물 내 석면 존재 가능성을 사전에 파악하고 관리하기 위한 목적에서 활용됩니다. 이는 석면에 노출될 가능성이 있는 국민의 건강 보호와 안전한 환경 조성을 위한 기초자료로 사용됩니다.데이터기준일자는 각 항목별 최신 갱신일자를 나타내며, 건축물의 현황은 변동 가능하므로 주기적으로 업데이트를 하고 있습니다.
