summary_user: 부산 시내 대기환경측정소별로 아황산가스·이산화질소·오존·일산화탄소·초미세먼지·미세먼지 농도와 각 항목의 통합대기환경지수, 대표 오염물질과 그 값을 담은 측정소 단위 실시간 대기질 데이터다. 부산 시민이 지금 우리 동네 측정소의 미세먼지·오존 수준을 확인하거나, 분석가가 측정소별 대기질을 비교하는 데 쓴다. 전역 조인 키는 없어 측정소 이름(site)이나 부산시 내부 측정소 번호(areaIndex)를 에어코리아 측정소 목록 등과 이름·코드로 직접 맞춰 이어 써야 한다.
description_portal: '부산광역시 보건환경연구원은 부산 전역에 설치된 33개의 대기환경측정소를 통해 미세먼지(PM10), 초미세먼지(PM2.5), 오존(O3), 이산화질소(NO2), 아황산가스(SO2) 등 다양한 대기오염물질의 농도를 1시간 단위로 정밀하게 측정하고 있습니다. 이렇게 수집된 데이터는 실시간으로 제공되어 시민들과 관련 기관들이 부산시의 대기질 상태를 신속하고 정확하게 파악할 수 있도록 지원하며, 대기환경 관리 및 정책 수립에도 중요한 기초자료로 활용되고 있습니다.(과거데이터 다운로드:  http://heis.busan.go.kr/environmental/air002_3.aspx?areaindex=221112&siteselect=0&sitename=%ea%b4%91%eb%b3%b5%eb%8f%99&yearselect=0&monthselect=9&year=2010&month=10)'
