summary_user: 경기도 내 상수원 보호구역을 보호구역 한 곳당 한 행으로 담으며, 집계연도·시군명·보호구역명·관련 하천명·지정일자·면적을 포함한다. 사업자나 주민이 특정 시군의 하천·저수지 주변 땅이 상수원 보호구역에 걸려 개발행위가 제한되는지 미리 확인하거나, 분석가가 시군별 보호구역 면적을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 보호구역명을 이름·코드로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 상수원 보호구역의 지정 및 관리 현황을 수록하고 있으며, 집계연도, 시군명, 보호구역명, 관련하천명, 지정일자, 보호구역 면적 등으로 구성되어 있습니다. 각 지역별로 주요 하천 및 저수지 인근에 지정된 보호구역에 대한 정보가 포함되어 있어, 상수원 보호를 위한 법적 조치와 환경보전 전략을 수립하는 데 기초자료로 활용될 수 있습니다. 본 데이터는 지역별 수질보전 정책 설계, 환경 규제 대상 지역 도출, 수자원관리 계획 수립, 개발행위 제한 검토, 상수원 오염 방지 대책 마련 등 다양한 환경행정 및 수자원 정책 분야에 활용 가능합니다.
