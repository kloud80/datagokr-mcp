description_portal: '1. 라돈은 자연 방사성 물질 중 하나로 암석이나 토양, 건축자재 등에 존재하는 우라늄이 몇 차례 붕괴를 거치는 과정에서 생성되는 무색·무취·무미의 방사성 기체이고,세계보건기구(WHO)에서 지정한 1급 발암 물질입니다.      라돈 무료 측정 및 저감 컨설팅 사업에서 측정한 실내 라돈 측정데이터를 기반으로  AI학습 테스트를 위해 생성한  합성데이터(가상데이터)입니다 2. 합성데이터 설명  - 원본데이터 이용기간 및 건수: 2024년 12월, 약 900건  - 원본데이터 특성 :  측정건별로 48~54시간 동안 실내에서 연속 측정  - 합성데이터 특성 :   48~54시간 동안 연속측정된 시간조건부 라돈데이터 생성  - 합성데이터 활용 :  실제 측정 데이터의 구조와 통계적 특성을 반영하되 민감정보를 포함하지 않아 AI학습 테스트 데이터로 활용 가능'
