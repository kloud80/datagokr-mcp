description_portal: 본 공공데이터는 2020년도 기준 대표사업장별 환경오염물질 배출량 정보를 제공합니다. 대표사업장코드, 대표사업장명, 유형, 용수사용량, 용수재활용량, 에너지총량, 대기·수 질오염물질총량, 폐기물발생총량, 폐기물재활용량, 화학물질배출량 등 주요 오염 물질 지표를 포함한 다수 필드를 수록하고 있습니다. 환경영향평가 전문가와 기술개발 담당자는 배출량 데이터를 활 용해 오염원별 배출 특성을 분석하고, 분야별 저감 기술 도입 효과를 평가할 수 있습니다. 정책 입안자는 이를 기반으로 배출 허용기준을 설정하고, 기업 경영진은 배출량 저감 전략과 친환경 경영  목표를 수립하는 데 활용할 수 있습니다.
