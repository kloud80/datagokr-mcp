summary_user: 제주특별자치도 도로의 중앙 분리대와 식수대에 심은 조경수를 노선·구간별로 수종과 식재 본수(본)로 집계한 통계표이며, 데이터 기준일 항목을 함께 담는다. 도로 녹지 담당자나 분석가가 "특정 노선 구간에 어떤 수종이 몇 그루 심겨 있고 수종 구성이 다양한가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 노선명·구간 이름 매칭으로 이어야 하며, 같은 기관(제주특별자치도) 데이터로만 연결할 수 있다.
description_portal: '제주특별자치도 내 중앙 분리대 및 식수대 조경수 현황 데이터를 제공합니다.항목: 노선명, 구간, 수종, 식재본수(본) 등* 제주특별자치도 내에서 노선 및 구간별 중앙 분리대 및 식수대 조경수의 종류(수종) 및 식재 본수를 집계한 통계자료이다. 본 자료는 도로를 비롯한 공공구역 경관 관리 및 녹지 조성 현황을 파악할 수 있게 하며, 조경수의 식재 수와 해당 수종 정보를 통해 생태적 다양성, 도시 미관, 환경 개선 효과 등을 평가하는 기초자료로 활용 가능하다.* 활용 분야 : 도로 중앙 분리대 및 식수대 녹지 조성 현황 조사, 조경수 수종 다양성 평가 및 개선 방안 마련 등데이터 제공처: 제주특별자치도청'
