description_portal: 대전광역시 빗물 이용 시설 현황 자료는 관내에 설치된 다양한 빗물 이용 시설의 위치, 용량, 설치 목적 등을 포괄적으로 제공합니다. 이 자료는 각 시설이 담당하는 집수 면적, 설치 효과, 유출수 저감, 비점 오염물질저감 등 환경 관리 측면에서의 성과와 함께 공공 하수도 등 관련 인프라와의 연계성도 보여줍니다. 빗물저금통 및 침투시설 등 각종 시설은 강수 유입량 변동에 따라 물자원 관리 최적화, 도시 홍수 예방, 도시 생태계 복원 등에 실질적 기여를 하며, 저영향개발(LID) 전략 실현에도 핵심 역할을 수행합니다. 자료를 통해 활용자는 빗물이용시설의 설치 현황 및 효과, 지원 정책, 물순환 정책과의 연동 현황을 총체적으로 이해할 수 있습니다.
