summary_user: 경상북도 고령군에 설치된 헌옷수거함을 한 개씩 담은 개별 지점 목록으로, 관리기관·설치시설명과 지번·도로명 소재지 주소가 들어 있다(CSV 약 6KB). 고령군 주민이 우리 동네에서 헌옷을 넣을 수거함이 어디 있는지, 또는 담당자가 수거함이 누구 관리로 어디에 분포하는지 확인하는 데 쓴다. 전역 조인 키나 좌표 컬럼은 없어서, 다른 데이터와는 시군구 이름이나 소재지 주소를 매칭하거나 다른 지자체의 같은 종류 수거함 파일과 행을 이어 붙이는 방식으로 연결한다.
description_portal: 경상북도 고령군 내에 설치된 헌옷수거함의 현황을 담고 있으며, 수거함의 순번, 관리단체, 소재지 도로명 주소 등 기본 정보를 포함합니다. 이를 통해 각 행정구역별 수거함의 설치 위치와 분포 현황, 운영 주체에 대한 정보를 파악할 수 있으며, 불법 수거함 설치 여부를 식별하고 신고 및 정비를 위한 행정 관리 체계를 구축하는 데 활용됩니다. 또한 헌옷수거와 의류수거함 운영 실태를 종합적으로 분석함으로써 주민의 자원 재활용 참여를 유도하고, 생활 주변의 무단 투기 예방과 더불어 지역 청결 유지 및 쾌적한 생활환경 조성에 기여합니다. 수거함의 적정 배치 여부, 관리 실태 개선, 수거량 분석 등의 자료로도 활용될 수 있으며, 향후 효율적인 수거 정책 수립과 환경 관련 예산 편성, 청소행정의 품질 향상을 위한 기초 행정자료로 기능합니다.
