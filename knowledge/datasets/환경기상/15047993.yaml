summary_user: 부산광역시 금정구 관내 대기오염물질 배출시설 등록 업소를 업소 한 곳당 한 행으로 담은 원장 파일로, 업소명·지번/도로명 주소·업종·배출시설 종별을 기록한다. 주민이나 분석가가 '우리 동네 주변에 어떤 대기배출 사업장이 있고 몇 종 시설인가'를 확인하거나, 구 단위 오염원 현황을 파악하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어, 다른 데이터와는 주소를 지오코딩하거나 업소명을 맞춰 연결해야 한다.
description_portal: 대기환경보전법 제23조 규정에 따른 부산광역시 금정구 관내에 존재하는 대기배출시설의 업소명, 소재지, 업종, 종에 대한 데이터입니다.이 데이터는 2026년 2월 10일 기준, 부산광역시 금정구 내에 소재한 대기오염물질 배출 시설 등록 업소의 현황을 총 83개 레코드로 기록하고 있습니다.주요 정보는 업소명, 지번/도로명 주소, 영위하는 업종으로 구성되어 있으며, 특히 해당 시설이 환경 기준에 따라 분류된 배출시설 종별(2종부터 5종까지) 정보를 포함합니다.이 자료는 주로 자동차 수리업, 택시 운송업, 각종 제조업체 등 대기오염 물질을 배출할 가능성이 있는 업체를 식별하여 환경 관리 및 규제 정책 수립, 그리고 주요 오염원 감시를 위한 기초 데이터로 활용됩니다.
