description_portal: 이 데이터는 연안습지기초조사를 기반으로 모니터링 정점의 위치 정보를 기록하고 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부가 관리하는 연안습지 모니터링 정점의 정점번호, 위도, 경도 등의 위치 정보로 구성되어 있습니다.  본 데이터는 연안습지의 생태변화 관찰, 모니터링 구역 설정, 현장 조사 계획 수립, 위치 기반 연안관리 정책 수립 등과 같은 영역에 활용될 수 있습니다. 이를 통해 향후 습지 보호지역 관리와 연안 생태계에 대한 과학적 모니터링 수행, 연구자료의 기초로 사용할 수 있습니다.
