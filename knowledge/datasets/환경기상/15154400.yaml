description_portal: 「부산환경공단_미세먼지 작업량」 데이터는 2021년 한 해 동안 부산 지역의 도로 미세먼지 저감을 위해 수행된 청소·제거 작업의 이력을 수집·정리한 자료입니다. 해당 자료는 미세먼지 제거를 직접 목적으로 한 도로 청소 작업 기록으로 구성되어 있습니다. 본 데이터에는 사업소명, 작업일자, 차량번호 등 작업 주체와 장비 정보뿐 아니라, 도로명, 작업코드, 작업량, 도로 라인수, 청소 길이, 비고 등의 상세 지표가 포함되어 도로별 작업 특성과 수행 규모를 정량적으로 파악할 수 있습니다.이 데이터는 지역별 미세먼지 발생 특성, 도로 환경 취약 구간 관리, 작업 효율성 분석, 장비 배치 최적화 등 미세먼지 저감 및 도시 환경관리 정책 수립을 위한 근거자료로 활용될 수 있습니다. 공공기관·연구기관·시민 누구나 활용할 수 있도록 개방하는 자료입니다.※ 해당데이터는 샘플데이터 입니다. 데이터가 필요 시 담당자에게 추가 연락을 부탁드립니다
