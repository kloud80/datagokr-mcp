summary_user: 전북특별자치도 남원시 안에서 대기오염물질 배출 허가를 받은 사업장을 한 행씩 담은 현황 파일로, 사업장명·업종·주소·종별·배출량(kg)·처리방법·신고·허가 일자를 담는다(csv 약 15KB). 주민이나 환경단체·연구자가 '우리 동네 주변에 어떤 대기 배출 사업장이 있고 배출량과 처리방식은 어떤가'를 확인하거나 지역 오염원을 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소를 매칭해 잇는다. 같은 기관(남원시)의 다른 자료와 함께 보는 방식으로 연결한다.
description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시 지역 내에서 대기오염물질을 배출하는 허가 사업장들의 종합 현황을 담고 있습니다. 미세먼지와 초미세먼지를 포함한 다양한 대기오염물질의 배출량과 처리 방식을 체계적으로 관리함으로써, 지역 대기질 개선과 환경보호 정책 수립을 위한 기초 자료로 활용됩니다. 환경 관련 연구기관, 시민단체, 학계에서 대기질 분석 및 오염원 추적 연구에 중요한 자료로 활용될 수 있으며, 주민들의 환경정보 접근권 보장과 투명한 환경행정 실현을 목적으로 공개됩니다.2. 데이터 항목명사업자명, 업종, 주소, 사업장 전화번호, 종별, 배출량(kg), 처리방법, 신고_허가일자3. 기대효과본 데이터 공개를 통해 지역 대기오염원에 대한 투명한 정보를 제공함으로써 시민의 알 권리를 보장하고, 과학적 근거를 바탕으로 환경정책 수립 및 대기질 개선 방안을 마련할 수 있습니다.
