summary_user: 충청북도 소음측정망의 측정지점을 지점 한 곳당 한 행으로 담은 목록으로, 시군·법적구분·용도구분·지역구분(가~라)·측정지점 이름과 TM 가로·세로좌표를 담는다. 주민이나 분석가가 "우리 동네 주거지역 근처에 소음측정 지점이 있는가, 어떤 지역구분 기준이 적용되는가"를 확인할 때 쓴다. 전역 조인 키는 없어서 시군·측정지점 이름으로 소음 측정결과 자료와 맞추거나, TM 좌표로 지도·용도지역 공간자료와 겹쳐 쓴다.
limits: 측정값(소음도)은 없고 지점 정보만 있어 소음 수준 판단에는 별도 측정결과가 필요하다. 다른 데이터와 공통 코드 키가 없어 이름 매핑이나 좌표 기반으로만 연결된다.
