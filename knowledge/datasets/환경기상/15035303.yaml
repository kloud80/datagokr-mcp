summary_user: 구미시에 있는 폐기물재활용업(최종·종합재활용업) 등록 사업장 중 합성수지를 주요 대상으로 하는 재생플라스틱 업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 업종·사업장명칭·도로명/지번 주소·전화번호를 담는다(약 6KB 규모의 CSV). 폐플라스틱을 맡기거나 거래할 재활용 업체를 구미 안에서 찾는 사업자, 또는 지역 플라스틱 재활용 업체의 분포를 살피는 담당자가 '구미에 합성수지 재활용 업체가 어디에 몇 곳 있나'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서, 다른 폐기물 처리업 허가 원장이나 사업장 데이터와는 사업장명칭이나 주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 이 파일은 경상북도 구미시에 소재한 재생 플라스틱 업체들의 현황을 담고 있으며, 폐기물재활용업 중 최종재활용업 또는 종합재활용업으로 등록된 사업장 중에서 합성수지를 주요 영업대상 폐기물로 포함한 업체들의 사업자명칭, 사업장 주소, 연락처 등의 정보를 포함한 데이터 파일입니다. 이 데이터는 지역 산업 구조 분석, 재활용 관련 정책 수립, 환경 관리 방안 마련, 공공기관의 업무 기초자료 등 다양한 용도로 활용될 수 있습니다. 특히, 환경부서, 산업 관련 부서, 연구기관 등이 재활용 산업의 동향을 파악하고 실질적인 지원책을 마련하는 데 있어 유용한 참고자료가 될 수 있습니다.
