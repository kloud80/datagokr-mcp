summary_user: '부산시 5개 권역 32개 하천의 71개 측정지점에서 검사한 수질측정 결과를 측정년월(inspec_ym)·지점별로 담으며, BOD·COD·TOC·DO·총인·총대장균과 페놀·시안·카드뮴·수은·납 같은 중금속, 암모니아성질소·질산성질소 등 항목 값을 포함한다. 시민이나 환경 분석가가 "우리 동네 하천(예: 온천천·학장천)의 BOD와 대장균 수치가 최근 몇 달 사이 어떻게 변했나"를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 권역·하천·지점 코드와 이름(area_CODE, river_NAME, loc_NAME)이나 지점 주소를 기준으로 이름 매칭해 연결한다.'
description_portal: 부산시내에 위치한 낙동강, 수영강, 동부산, 서낙동강, 중부산 등 5개 권역의 감전천, 괴정천, 남천, 대리천, 대천천, 동천, 삼락천, 석대천, 동백천, 송정천, 학장천, 신어천, 춘천, 부산천 등 32개 하천에 설치된  71개 지점에서 검사한 19개 항목의 수질측정정보를 개방합니다.개방된 데이터에는 하천에서 검출되는 총대장균, 총황산화물과 BOD, COD, TOC, DO, T-P 과 페놀, 시안 ,카드뮴, 비소, 수은, 납 등의 중금속 그리고 용존산소량, 암모니아성질소, 용존총인, 질산성질소,인산염인  등의 정보를 포함하고 있습니다.
