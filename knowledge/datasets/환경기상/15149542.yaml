summary_user: 자동차 배출가스 저감사업에 관련된 조기폐차 대행기관, 자동차·건설기계 제작사, 저감장치 부착 공업사의 업체명·주소 등 업체 목록을 담은 전국 범위 파일(zip)이다. 노후차 소유자나 사업자가 조기폐차를 맡길 대행기관이나 배출가스 저감장치를 달 수 있는 공업사가 어디 있는지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명(제작사명)이나 주소 문자열을 맞춰 이어야 한다.
description_portal: '본 자료는 대기환경보전법 제58조(저공해자동차의 운행 등)를 근거로 시행 중인 자동차 배출가스 저감사업에 관련된 자료입니다.배출가스 저감사업 중 하나인 조기폐차 업무를 대행하는 "조기폐차 대행기관", 자동차와 건설기계를 제작 및 수입하는 "자동차 및 건설기계 제작사", 배출가스 저감장치 부착 업무를 보는 "공업사" 정보가 포함되어 있으며, 상세 데이터 항목은 아래와 같습니다.○ 조기폐차 대행기관 : 업체명, 전화번호, 주소, 팩스번호 등○ 자동차 및 건설기계 제작사 : 업체명, 주소 등○ 공업사 : 업체명, 지역, 주소, 저공해조치 분류 등'
