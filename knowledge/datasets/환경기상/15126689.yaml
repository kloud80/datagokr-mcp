summary_user: 기상청이 해상에 띄운 표류부이가 관측한 자료를 관측시간별로 담는 건별 관측 원천으로, 부이의 이동 위경도와 해수온·기압 등을 포함하며 범위는 전국 해상(비공간 행정단위)이다. 유류 유출·해양오염이나 태풍 접근처럼 고정 해양기상부이가 없는 해역의 해면 상태를 알아야 할 때, 분석가가 특정 기간 부이 이동 경로와 수온·기압 변화를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 관측시간·위경도나 같은 기관(기상청 API허브)의 해양기상부이·파고부이 자료와 이름·코드 매핑으로만 이어 쓴다.
description_portal: '기상청에서 관측하는 표류부이의 관측시간, 이동 위경도,  해수온, 기압 관측자료를 제공합니다.기상청 API허브를 통해 표류부이 뿐만 아니라 해양기상부이, 파고부이 등 해양기상관측에 대한 종합적인 자료를 한눈에 확인할 수 있습니다.※ 표류부이는 수시로 운영하며, 관측종류의 결과값이 D인 자료만 해당함- 표류부이: 표류부이는 해상에서 표류하면서 해면 상태를 관측기기로 측정하고, 측정한 값을 일정한 물리량으로 변환·처리한 후에 사용 가능한 위성통신을 이용하여 관측자료를 전송하는 장비입니다. 표류부이는 해양기상부이를 설치·운용하기가 어려운 해상이나, 유류 유출·해양오염 발생과 같이 긴급히 기상 및 해상자료가 필요할 때, 태풍의 접근 시와 같이 많은 자료가 필요할 때 사용됩니다. 표류부이에서 관측되는 기본요소는 기압, 파고, 파주기, 수온 등 입니다.'
