summary_user: 대구 수성구 관내에 설치된 폐형광등·폐건전지 전용 분리수거함을 한 곳당 한 행으로 담은 지점 목록으로, 설치주소·세부위치·동명·위도·경도와 수거품목, 담당부서를 담는다(CSV 약 3.5KB). 주민이 '우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리나'를 찾거나, 분석가가 동별 수거함 분포와 설치가 부족한 지역을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 동명·주소 문자열이나 위도·경도 좌표로 맞춰 이어 쓰며, 다른 지자체의 같은 종류 수거함 파일과는 항목을 맞춰 합친다.
