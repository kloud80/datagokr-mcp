description_portal: 본 데이터는 전국 국립공원 내에 존재하는 경관자원에 대한 현장 조사 결과를 정리한 자료로, 자원의 실제 위치와 명칭, 공간좌표 정보를 포함하고 있습니다. 주요 항목은 경관자원명, 경관자원 위치 설명, 위도 및 경도 좌표로 구성되어 있으며, 국립공원의 시각적·생태적 가치가 높은 자원에 대한 기초 현황 파악을 목적으로 구축되었습니다. 해당 데이터는 경관자원의 위치 기반 분석, 탐방 해설 콘텐츠 설계, 경관 보호지역 설정, 공간 시뮬레이션 모델 구축 등에 활용될 수 있으며, 민간 지도 API(Naver, Daum 등)와 연계한 시각화 및 행정 시스템 통합에도 적합합니다. 데이터는 CSV 형식으로 제공되며, 향후 경관자원 등급평가, 변화 모니터링, 정책 수립 등과의 연계 활용이 가능합니다.
