summary_user: 충청북도 안 대기환경 측정소별로 측정망 종류(도시대기·도로변대기), 측정소명, 도로명 주소, 측정 장비, 측정 항목(아황산가스·이산화질소·미세먼지 등), 위도·경도를 한 행씩 담은 측정소 현황 파일이다. 충북 주민이나 분석가가 우리 동네와 가장 가까운 측정소가 어디이고 어떤 오염물질을 재는지 확인할 때 쓴다. 전역 조인 키는 없어서 시간별 대기질 측정값 같은 다른 데이터와는 측정소명을 맞추거나 위도·경도로 위치를 겹쳐 이어 쓴다.
description_portal: '충청북도_대기환경 측정소 현황본 데이터는 충청북도 내 대기환경 측정소별 위치 및 측정 장비, 측정 항목 등의 정보로 구성됩니다.본 대기환경 측정소에서는 대기오염실태, 변화추이 및 대기환경기준 달성여부 등을 파악하기 위하여 대기오염물질 측정장비를 설치·운영하고 있습니다.충북의 대기측정망에서 측정되는 아황산가스, 일산화탄소, 이산화질소, 오존, 미세먼지의 대기정보 자료를 수집합니다.[데이터 항목 설명]측정망종류: 해당 측정소가 속한 대기 측정망 구분(도시대기측정망, 도로변대기측정망)측정소명: 측정소의 고유 이름위치: 측정소의 도로명 주소측정기기: 측정에 사용되는 장비 이름 측정항목: 해당 측정소에서 측정하는 오염물질 항목 (예: SO₂, NO₂, PM-10 등)위도/경도: 측정소의 GPS 위치 좌표데이터기준일: 데이터 업데이트 날짜'
