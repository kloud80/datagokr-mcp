description_portal: '이 데이터셋은 서울특별시 내에서 폐수를 배출하는 시설의 지리적 위치(공간정보)를 포함하여, 각 배출지점의 식별정보를 담고 있습니다. 좌표계 EPSG:5181 (GRS80 타원체, Y축 500 000m 이동)로 표기되어 있으며, 각 시설이 어느 지점에 폐수를 배출하고 있는지 공간적으로 파악할 수 있도록 설계되어 있습니다. 또한, 행정시스템인 새올행정시스템 과 연계되어 구축된 정보로, 시설명·배출지점명·좌표 등 기본 속성들이 포함됩니다. 본 데이터를 활용하면 폐수 관리, 오염원 지도 작성, 환경 감시 및 대응 정책 수립에 활용 가능하며, GIS 분석이나 공간 클러스터링 등에도 적합합니다.문의 : 물순환안전국 물순환정책과 (02-2133-3774)'
