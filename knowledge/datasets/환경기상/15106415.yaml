summary_user: 미세먼지(PM-10) 주의보·경보의 발령과 해제 이력을 건별로 담은 파일 데이터로, 지역명·권역명과 발령·해제 일시와 농도를 포함하며 전국 189건(2022-01-08~2022-06-01)이다. 분석가나 지역 담당자가 특정 지역에서 미세먼지 경보가 언제 발령되고 해제됐는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 같은 기관(에어코리아)의 대기질 데이터와는 지역명 매핑이나 기관 코드로만 이어 쓴다.
description_portal: 해당 데이터는 미세먼지에 대한 주의보, 경보 발령 이력 을 조회하기 위한 데이터로, 발생_순번,발생_일시,항목_코드,경보 단계,지역명,권역명,발령일자,발령시간,발령농도,해제일자,해제시간,해제농도 정보를 제공합니다.미세먼지 경보 기준은 해당 지역의 대기 자동측정소 PM-10 시간 평균 농도가 300㎍/㎥ 이상 2시간 지속, 주의보 기준은 농도가 150㎍/㎥ 지속되었을 경우 발령이 나며 경보 해제 기준은 농도가 150㎍/㎥미만이며 100㎍/㎥ 미만일때는 주의보가 해제가 됩니다. 해당 자료들은 에어코리아 내 연보,월보 자료를 확인 가능합니다.
