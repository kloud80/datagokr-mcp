description_portal: '굴포천 모니터링결과는 부평구 관내 굴포천의 수질 상태를 정기적으로 측정한 결과를 수록한 데이터채수 지점은 굴포교, 삼산교 등 주요 다리 인근이며, 생화학적 산소요구량(BOD), 화학적 산소요구량(COD), 총 유기탄소(TOC) 등 주요 수질 지표를 포함하천 오염도 분석, 수질 변화 추이 모니터링, 환경 개선 정책 수립의 기초자료로 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 굴포천 주요 구간의 수질 오염도 비교 및 분석– 환경기초시설 운영 및 수질 정화사업의 사전·사후 평가– 도시개발 및 생태복원 사업 대상지 선정 근거자료– 시민 대상 수질 정보 공개 및 하천환경 교육 콘텐츠 활용주요 항목 설명● 일련번호: 데이터 항목의 고유 식별번호● 채수장소: 굴포교, 삼산교 등 하천 지점별 채수 위치● 의뢰일자: 수질검사를 의뢰한 날짜● 검사항목: 분석 대상 수질 항목 목록● 결과일자: 수질검사 결과가 확정된 날짜● 생화학적 산소요구량(BOD): 유기물 분해 시 소비되는 산소량● 화학적 산소요구량(COD): 화학 산화에 필요한 산소량● 총 유기탄소(TOC): 유기물의 총량을 나타내는 지표● 부유물질(SS): 물속에 떠 있는 고형물의 양● 총 질소(T-N): 하천 내 질소 계열 오염물질 총량● 총 인(T-P): 인 성분 오염도 측정값'
