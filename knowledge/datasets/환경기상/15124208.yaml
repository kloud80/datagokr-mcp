summary_user: 전국 시군구별로 중분류 토지피복지도의 분류항목별 면적(주거·공업·상업지역, 논·밭, 활엽수림·침엽수림, 습지, 내륙수·해양수 등 20여 개 항목과 합계)을 자료년도별로 집계한 파일 데이터입니다. 지자체 환경·도시계획 담당자나 연구자가 '우리 시군구의 산림이나 농지 면적이 연도별로 얼마나 줄고 시가화 면적은 얼마나 늘었나'를 확인할 때 쓴다. 전역 조인 키(행정구역 코드)가 없어서, 다른 시군구 통계와 붙이려면 시도·시군구 이름을 행정구역 코드로 매핑해서 연결해야 한다.
description_portal: 환경공간정보서비스에서 제공하는 중분류토지피복지도의 지역별 면젹 통계 입니다.(2007년부터 2023년까지 제작된 지역별,분류항목별 면적 통계)토지피복지도란 주제도(Thematic Map)의 일종으로, 지표면 지형지물의 형태를 일정한 과학적 기준에 따라 분류하여 동질의 특성을 지닌 구역을 Color Indexing 한 후 지도의 형태로 표현한 공간정보 DB를 말합니다.토지피복지도는 지표면의 현상을 가장 잘 반영하기 때문에 지표면의 투수율에 의한 비점오염원 부하량 산정, 비오톱 지도작성에 의한 도시계획, 댐 수문 방류 시 하류지역 수몰피해 시뮬레이션, 기후대기 예측 모델링, 환경영향평가 등에 폭넓게 활용되며, 중앙정부 및 지방정부의 환경정책수립의 과학적 근거로서 위상을 가지고 있고 관련 학계의 다양한 연구자료로 활용되고 있습니다.*EU에서 회원국들의 토지현황에 대한 방대한 정보를 종합적으로 수집 및 관리하기 위해 1985년 유럽환경청(EEA)에서 추진한 전 유럽 토지피복지도 구축사업인 CORINE (Coordination of Information on the Environment)프로젝트에서 개념 정립하였고 이를 기반으로 우리나라 실정에 맞는 분류기준을 확정하여 1998년 환경부에서 최초로 남한지역에 대한 대분류 토지피복지도를 구축하였습니다.
legal_basis_portal: 환경공간정보 보안관리규정 및 토지피복지도 작성 지침(환경부훈령 제1577호, 2022. 12. 19., 전부개정)
