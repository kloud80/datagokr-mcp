description_portal: '이 데이터는 한국환경산업기술원에서 제공한 공공기관의 연도별 녹색구매 및 등록상품에 대한 통계 정보를 담고 있습니다. 데이터는 총 25개의 연도별 항목으로 구성되어 있으며, 각 항목은 다음의 4개 컬럼으로 구성되어 있습니다:기준연도: 데이터가 집계된 연도를 나타냅니다.공공기관구매액(억원): 해당 연도의 공공기관에서 구매한 전체 녹색제품 금액입니다(단위: 억 원).조달청구매액(억원): 조달청을 통해 이루어진 녹색제품 구매 금액입니다(단위: 억 원). 일부 연도의 데이터가 누락되어 있습니다.등록상품건수(건): 해당 연도에 등록된 녹색제품의 총 건수입니다. 이 또한 일부 연도에서 결측치가 존재합니다.이 데이터는 연도별 녹색제품 구매 동향을 파악하고, 공공기관 및 조달청의 친환경 제품 구매 추이를 분석하는 데 유용하게 활용될 수 있습니다.'
