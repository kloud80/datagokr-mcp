description_portal: 아프리카돼지열병(ASF)는 멧돼지를 매개로 전파되기 때문에 확산을 막기 위해 멧돼지를 사살·포획하기도 합니다.야생멧돼지 폐사체 수색 및 포획을 위한 수색포획단이 있고, 해당 수색포획단이 시료를 수집(채취)하여 신고하는 경우 해당 신고 건을 신고 번호에 따라 분류합니다.야생멧돼지를 포획, 수색하는 것의 어려움과 운용 시기 등의 문제로 건수가 많지 않으며 데이터가 2년 이내에 한정되어 있습니다.향후 포획수색단의 활동량이 상승한다면 해당 테이블에서 수집·관리할 데이터가 증가할 수 있습니다.
