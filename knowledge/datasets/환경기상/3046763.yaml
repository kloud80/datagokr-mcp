summary_user: 인천광역시 군구별로 공공건축물·불특정다중이용시설·대학교·어린이집·지역아동센터·기타 유형마다 석면조사 대상 건축물 수와 석면건축물 수를 집계한 표로, 건별 건축물 목록이 아니라 시군구 단위 집계(약 700바이트 CSV 한 개)다. 학부모나 지역 주민이 '우리 구의 어린이집 가운데 석면건축물로 확인된 곳이 몇 곳인가'를 보거나, 분석가가 군구별 석면건축물 비율을 비교하는 데 쓴다. 전역 조인 키가 없어 시군구 이름을 행정구역 코드에 맞춰 다른 시군구 단위 통계(인구·건축물 현황 등)와 붙여 쓴다.
description_portal: 인천광역시 군구별 석면조사대상 건축물 현황 및 석면건축물 현황(공공기관(행정기관, 공공기관 특수법인, 지방공기업), 다중이용시설, 어린이집  등) 데이터를  제공합니다.석면조사란 건축물이나 설비에 석면이 함유되어 있는지 여부, 석면의 종류 및 함유량, 석면 함유제품의 위치 및 면적 등에 대해 조사하는 것을 의미합니다.철거, 멸실, 유지·보수, 리모델링, 인테리어 등의 목적으로 건축물이나 설비의 전체 또는 일부를 철거·해체하려는 경우에는 규모와 관계없이 모두 석면조사를 실시해야 합니다.건축물석면조사 대상(「석면안전관리법」)에 해당하거나, 건축물의 관리를 위해 층별 석면건축자재 사용 유무를 파악할 수 있는 석면지도와 사용된 자재의 상태평가(위해성평가) 등이 필요한 경우 석면조사를 실시해야 합니다.
