description_portal: 전라남도 해남군에 등록되어 있는 친환경차(수소차)에 대한 데이터입니다.이 데이터에는 차량 종류(하이브리드, 전기, 수소), 구분(승용, 승합, 화물),  등록 대수 현황이 제공됩니다.24년 6월 기준 친환경차 18,620대가 등록되어 있으며 하이브리드17,790대,  전기 828대, 수소차 2대가 등록되어 있습니다.해남군에서는  매년 친환경자동차 보급 정책과 해남형 ESG 미세먼지 저감을 위한 전기자동차 보급사업을 진행하고 있습니다.보조금 지원 차량은 환경부 무공해차 통합누리집에서 열람 가능하며 지원금액 및 지원신청 관련 정보는 해남군 대표 홈페이지에서 확인 가능합니다.
