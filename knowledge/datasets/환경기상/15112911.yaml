summary_user: 경상남도 의령군 관내에 설치된 미세먼지 신호등의 시설 현황을 한 대당 한 행으로 담은 파일(csv 871바이트)로, 관리번호·설치장소·설치연도·도로명주소·크기·표출부 개수·운영시간·표출내용·표출방식과 위도·경도를 포함한다. 주민이나 군 담당자가 '우리 동네 어디에 미세먼지 신호등이 있고 몇 시에 무엇을 보여주나'를 확인하거나, 신호등 추가 설치 위치를 검토할 때 쓴다. 전역 조인 키는 없어 도로명주소나 위도·경도 좌표를 기준으로 에어코리아 측정소 위치나 다른 의령군 공공시설 데이터와 공간·주소 매칭으로 이어 쓴다.
limits: 신호등 설치 현황 목록일 뿐 미세먼지 측정 농도값이나 시간별 대기질 수치는 담지 않으므로 실시간 대기질 조회에는 에어코리아 등 별도 데이터가 필요하다. 표준 코드 같은 조인 키가 없어 다른 데이터와는 주소·좌표·명칭 매핑으로만 연결된다.
