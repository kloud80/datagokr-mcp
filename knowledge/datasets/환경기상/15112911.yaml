description_portal: 본 데이터는 경상남도 의령군 관내에 설치된 미세먼지 신호등의 현황 정보를 제공합니다. 해당 신호등은 대기 중 미세먼지 농도를 실시간으로 측정하여 시각적으로 표출함으로써 주민들에게 대기오염 상태를 직관적으로 전달하는 역할을 수행합니다. 본 데이터는 신호등의 관리번호, 설치장소명, 신호등의 설치연도와 설치위치 도로명주소, 신호등의 크기, 표출부 개수, 신호등 운영시간과  신호등에 표출내용, 표출방식, 위도 경도 데이터로 구성되어 있으며, 대기질 개선 정책 수립, 환경 안전 관리, 공공시설 운영 계획 수립 등에 활용될 수 있으며, 정기적으로 갱신되어 공공기관 및 일반 국민에게 개방되어 있습니다. 의령군은 주민의 건강 보호와 환경 안전 강화를 위해 미세먼지 신호등 설치를 확대하고 있으며, 이를 통해 실시간 대기질 정보를 제공하고 있습니다.
