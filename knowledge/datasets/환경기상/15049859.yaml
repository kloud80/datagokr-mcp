summary_user: 충청남도 대기오염측정망시스템에서 추출한 일평균 대기질 자료로, 측정일·측정소·오염물질 항목(PM10·PM2.5·NO₂·O₃·SO₂ 등)별 일평균값과 그날의 1시간평균 최고·최저값 및 시각, 국가기준·충남기준 초과 여부를 한 행씩 담으며 CSV 파일(약 13MB)로 받는다. 연구자나 도민이 '우리 동네 측정소에서 지난 기간 초미세먼지 일평균이 대기환경기준을 며칠이나 넘었나'처럼 측정소별·기간별 농도 추이와 기준 초과 일수를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 측정소명이나 측정일을 이름·날짜 매핑으로 맞춰 이어 써야 한다.
limits: 측정소 코드나 좌표 같은 공통 키가 없어 에어코리아 측정소 정보 등과 붙이려면 측정소명을 직접 대조해야 한다. 일평균 집계 자료이므로 시간별 실시간 농도나 경보·주의보 발령 정보는 담지 않는다.
