summary_user: 전국에서 발생한 수질오염사고를 사고 건별로 기록한 원천 데이터로, 신고·접수 일시, 발생 수계(한강·낙동강·금강·영산강·기타), 방제 지원 여부, 발생지 주소, 시스템 등록·수정 일시와 삭제 여부를 담은 CSV 파일(약 91KB)이다. 지자체 환경 담당자나 분석가가 어느 수계와 지역에서 수질오염사고가 자주 나고 방제 지원이 얼마나 이뤄졌는지 파악하는 데 쓴다. 전역 조인 키는 없어서 수계 이름이나 주소를 행정구역·측정소 정보와 직접 매핑해야 하며, 수질측정망·조류경보 같은 같은 물 맥락의 수질 데이터와 나란히 본다.
description_portal: 전국에서 발생하는 수질오염사고 발생 현황 자료를 데이터화하여 사고발생가능성이 높은 지역 등에 대해 효과적으로 사고대응이 가능하도록 관리.사고 신고 일시, 사고 접수 일시, 사고 발생 수계(한강/낙동강/금강/영산강/기타 수계), 사고지원 여부, 사고발생지 주소, 사고발생지 상세주소, 시스템 내 사고상황 등록일시, 시스템 내 사고상황 수정일시,시스템 내 사고상황 삭제 여부, 첨부파일명, 사고 등록 기관 등의 데이터 항목으로 구성되어 있다.해당 공공데이터를 통해 사고 예방 및 대응력 향상(사고 발생 지역, 원인, 유형 등의 데이터를 활용해 사전 예방 대책 강화 및 신속한 대응 체계 구축) 및 공공 신뢰도 및 투명성 제고가 가능함.
