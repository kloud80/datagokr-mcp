description_portal: 국제공동 ARGO 프로그램에 참여하면서 지역자료센터 운영에 따른 홈페이지 서비스를 수행하고 있음. ARGO 플로트는 수심 2,000m까지 자동으로 관측하는 무인해양관측기기이며, 설정된 주기(10일)에 따라 수온과 염분 그리고 압력을 측정하여 위성을 통해 자료를 수집하고 있음. 우리나라는 270여기를 투하하여 방대한 해양관측자료를 생산하였으며, 홈페이지를 통해 개별 프로파일 제공 및 시계열 자료 등을 제공하고 있음. 또한 우리나라에서 투하한 ARGO 플로트의 관측 현황도 서비스하고 있음.
