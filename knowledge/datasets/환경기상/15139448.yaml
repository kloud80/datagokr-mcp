description_portal: '사이트별 레이더로부터 관측된 반사도, 시선속도, 스펙트럼폭 등을 제공합니다.생산주기: 분(5,10분 주기)보유기간: - 관악산, 오성산, 구덕산, 고산, 강릉: 1998년 ~ 현재- 백령도, 진도, 인천공항: 2001년 ~ 현재- 광덕산: 2003년 ~ 현재- 면봉산: 2005년 ~ 현재- 성산: 2006년 ~ 현재(참고) 기상청은 전국에 현업용 기상레이더관측소 10개소(백령도, 관악산, 광덕산, 강릉, 오성산, 진도, 면봉산, 구덕산, 고산, 성산), 기술개발용 레이더 테스트베드(용인) 1개소, 소형 기상레이더 3개소(수리산, 덕적도, 망일산) 및 인천공항 기상레이더 1개소를 설치하여 운영하고 있습니다. 기상청은 독자적인 기상레이더자료 품질관리, 강수량 추정, 강수실황 예측기술을 개발하여 고품질의 기상레이더 정보를 홈페이지와 모바일 앱을 통해 국민에게 제공하고 있습니다.'
