summary_user: 기상청 현업 레이더 사이트별로 관측한 반사도·시선속도·스펙트럼폭 등 레이더 원천 관측자료를 5~10분 주기로 담으며, 범위는 전국이고 사이트에 따라 1998년 이후 자료를 보유한다. 기상·방재 분석가가 '특정 시각에 어느 레이더 사이트에서 강수 에코가 얼마나 강하게 잡혔는가'를 확인하거나 강수 추정·사례 분석의 원천으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기상 관측자료(ASOS·AWS 등)와는 레이더 사이트 이름이나 같은 기관 코드 매핑으로만 이어 쓴다.
