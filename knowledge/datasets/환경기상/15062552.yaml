summary_user: 경주시에 접수된 대형폐기물 배출 신고를 건별로 담은 파일로, 배출 품목·규격·수량·결제금액·결제방법·등록일·수거요청일을 기록한다(CSV 약 2.4MB, 시군구 범위). 분석가가 "경주시에서 어떤 대형폐기물이 언제, 얼마의 수수료로 많이 신고되는가"를 살펴 수거 수요와 계절 변동을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체 대형폐기물 신고 파일과는 품목명 매핑으로, 경주시 다른 데이터와는 같은 기관 기준으로만 이어 쓴다.
description_portal: 본 데이터는 경상북도 경주시에서 수집한 대형폐기물 배출 관련 신고 현황을 파일 형식으로 제공하는 공공데이터이다.대형폐기물은 가전제품, 가구, 침구류 등 부피가 크고 일반 쓰레기와 함께 배출이 어려운 품목으로, 신고와 수수료 납부 후 배출이 가능하다.본 자료에는 배출폐기물, 배출규격, 수량, 결제금액, 결제방법, 등록일, 수거요청일 등의 정보가 포함되어 있다.이 데이터는 불법 배출 방지와 폐기물 처리 효율화에 기여하며, 행정기관의 자원관리 및 환경정책 수립에도 활용된다.또한 시민들이 합법적인 배출 절차를 숙지하고 이를 준수하도록 돕는 참고자료로 유용하다.경주시는 도시 환경 개선과 자원순환 촉진을 위해 해당 정보를 정기적으로 갱신하고 있다.
