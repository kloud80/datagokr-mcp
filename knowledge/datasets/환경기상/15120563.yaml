description_portal: 본 데이터는 한국환경산업기술원이 관리하는 주택 및 건설용 친환경자재 환경표지인증(EL) 심사를 위한 상세한 자재 분류 정보를 제공합니다. 대분류, 중분류, 소분류, 세분류의 코드 및 명칭, 인증코드 분류, 인증 사유, 적용 범위를 포함하며, 형광램프, 안정기 등 전기자재류를 중심으로 친환경 인증 대상 자재를 체계적으로 구분하여 수록하고 있습니다. 이를 통해 친환경 건설자재의 인증기준 마련, 자재선정 가이드라인 개발, 공공기관의 친환경 자재 조달 및 지속가능 건축물 설계 등 건설 분야에서 친환경성 평가와 관리에 폭넓게 활용할 수 있습니다.
