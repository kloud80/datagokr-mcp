description_portal: 대기환경보전법에서 정의하는 대기오염물질이란 대기에 존재하는 물질 중 대기오염의 원인으로 인정된 물질을 의미하며 독성, 생태계, 배출량, 환경기준에 대비한 오염도 등의 기준에 따라 심사 평가위원회를 두어 정한다. 본 데이터는 대기오염물질 64종 중 아황산가스(SO2), 일산화탄소(CO), 이산화질소(NO2), 오존(O3), 미세먼지(PM-10), 초미세먼지(PM-2.5) 농도를 공유하기 위한 게시판 자료이다. 또한 환경부 및 지방자치단체에서 운영 중인 대기환경측정망 중 도시대기측정망, 도로변대기측정망, 국가배경농도측정망, 교외대기측정망의 데이터이며, 통계자료 작성 시 기본이 되는 각 측정소별 시간 단위의 확정자료를 사용하였다.
