summary_user: 경기도 여주시 관내 특정토양오염관리대상시설 108건을 시설 단위로 담은 CSV 파일로, 상호·도로명주소·용도·설치일자와 정기검사·누출검사 대상 구분 및 당해연도 실시 여부를 항목별로 정리했다. 시민이나 분석가가 우리 동네에 토양오염 관리 대상 시설이 어디에 있고 올해 검사를 마쳤는지 확인하는 질문에 쓴다. 소재지도로명주소(address)가 조인 키이므로 주소 기반의 다른 환경 규제 레이어나 사업장 자료와 주소 매칭으로 이어 쓴다.
description_portal: '경기도 여주시 관내 특정토양오염관리대상시설의 현황을 체계적으로 파악·관리하기 위하여, 각 시설별 핵심 정보를 항목별로 정리해 제공하고자 합니다. 본 현황 자료에는 시설의 상호, 소재지도로명주소를 기본으로 포함하며, 해당 시설이 수행하는 용도(예: 저장시설, 취급시설 등) 및 설치일자를 함께 기재하여 시설 운영 이력과 관리 필요성을 확인할 수 있도록 구성합니다. 또한 법령 및 행정 관리 기준에 따라 정기검사 대상 구분을 명확히 표기하고, 당해연도 정기검사 실시 여부를 반영하여 연간 점검 이행 현황을 한눈에 확인할 수 있게 합니다. 아울러 시설 특성과 위험도에 따라 누출검사 대상 여부를 구분해 기록하고, 당해연도 누출검사 실시 여부까지 포함함으로써 토양오염 예방을 위한 사전 점검과 관리 이력을 종합적으로 관리할 수 있도록 합니다.'
