summary_user: 대구광역시 달성군의 실내공기질 관리대상 시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명주소·전화번호·시설군·관리기관명·위도·경도·데이터기준날짜를 담는다(CSV 약 9KB). 달성군 주민이나 분석가가 '우리 동네 어린이집·의료기관 같은 실내공기질 관리대상 시설이 어디에 몇 곳 있고, 어떤 시설군에 속하나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 위도·경도나 도로명주소를 바탕으로 지도·행정구역 자료와 공간으로 겹쳐 쓰거나, 시설명·시설군 이름을 맞춰 다른 시설 목록과 이어 쓴다.
description_portal: 실내공기질 관리가 필요한 시설의 기본 현황 정보를 정리한 자료로, 시설의 명칭, 위치, 시설 유형 등 실내공기질 관리 업무에 필요한 주요 정보를 포함하고 있다. 본 자료는 실내공기질관리대상시설의 분포 현황과 관리 대상 시설의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 실내공기질관리대상시설 현황에 대한 체계적인 관리를 통해 실내 환경의 쾌적성 및 건강 보호 수준을 분석하고, 실내공기질 개선 정책 수립과 환경 보건 관리 강화를 위한 행정적 의사결정을 지원한다. 본 자료는 실내공기질 관리 대상 시설에 대한 행정 관리, 지도·점검 및 개선 조치 업무 수행과 함께 관련 통계 산출 및 환경 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 실내공기질 오염 예방과 이용자 건강 보호를 위한 관리 체계를 강화하고, 쾌적하고 안전한 실내 환경 조성을 위한 정책 추진의 기초자료로 활용되며, 지속적인 환경 보건 및 환경 행정 업무 수행을 지원하는 행정자료로 활용된다.
