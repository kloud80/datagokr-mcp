summary_user: 인천광역시 미추홀구 관내에 설치된 미세먼지 신호등을 한 기기당 한 행으로 담은 설치 현황 파일로, 설치년도·설치위치·도로명/지번 주소·설치업체·표시항목(미세먼지·초미세먼지·온도·습도 등)을 포함한다(파일 크기 577바이트의 소규모 목록). 주민이 '우리 동네 공원이나 초등학교 앞에 미세먼지 신호등이 있는가'를 확인하거나, 구청·분석가가 신호등이 없는 생활권을 찾아 추가 설치 위치를 검토하는 데 쓴다. 전역 조인 키가 없어 측정소코드 기반 에어코리아 실시간 대기질 등과 직접 연결되지 않으며, 주소를 좌표로 변환해 근처 측정소나 다른 시설 데이터와 위치 기준으로 이어 쓴다.
limits: 신호등의 설치 위치·사양만 담고 신호등이 표시하는 실시간 농도 값은 들어 있지 않다. 표준 코드 같은 조인 키가 없어 다른 데이터와는 주소·이름 매칭이나 같은 기관 기준으로만 연결된다.
