summary_user: 전국을 5km×5km 격자 37,697개로 나눠 기상청이 하루 8회(02시부터 3시간 간격) 발표하는 단기예보를 격자·시간대별로 담으며, 포털 설명상 2008년 10월 30일부터 보유한다. 사업자나 일반 이용자가 '내일 오후 우리 동네(읍·면·동) 비 올 확률과 기온은 얼마인가'처럼 특정 지역·시각의 예보를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 예보 격자 좌표(nx, ny)나 지역 이름 매핑을 통해 같은 기상청의 관측·특보 데이터나 행정구역 자료와 이어 쓴다.
limits: 기상청 API허브(apihub.kma.go.kr)의 별도 인증키가 필요하며 포털 활용신청만으로는 호출되지 않는다. 행정구역 코드 같은 공통 키가 없어 다른 데이터와 붙이려면 격자 좌표나 지역 이름을 따로 매핑해야 한다.
