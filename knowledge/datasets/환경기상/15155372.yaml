summary_user: 경기도 내 환경컨설팅 전문업체가 수주한 사업을 계약 한 건씩 담은 원천 자료로, 해당년도, 컨설팅업체명·사업자번호·업종, 의뢰업체명·소재지·업종, 기업규모와 배출규모, 컨설팅 분야(대기·수질·통합허가 등), 세부 내역, 총계약금액, 등록일을 담는다. 분석가나 환경컨설팅 사업자가 '어떤 업종·규모의 사업장이 통합환경인허가나 대기·수질 인허가 컨설팅을 얼마의 계약금액으로 맡기는가'를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 컨설팅업체 사업자번호(bizregno)나 의뢰업체명·소재지 같은 이름 매칭, 또는 경기도 내 같은 기관 자료로만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 환경컨설팅 전문업체들이 수행한 사업 수주 내역을 기록한 자료로, 해당년도, 컨설팅업체 정보(사업장명, 사업자번호, 업종코드), 의뢰업체명 및 소재지, 의뢰업종, 기업규모 및 배출규모, 컨설팅분야(예: 대기, 수질, 통합허가), 구체적인 컨설팅 내역, 총계약금액, 등록일 등 총 17개 항목으로 구성되어 있습니다. 주요 컨설팅 유형으로는 통합환경인허가, 대기·수질 관련 인허가, 스마트 생태공장 구축 지원 등이 있으며, 대기업부터 중소기업, 대학교에 이르기까지 다양한 수요처에 맞춤형 환경 서비스를 제공하고 있습니다. 본 데이터는 환경컨설팅 시장의 수요동향, 업종별 컨설팅 집중분야, 계약규모 등을 분석하거나, 환경정책 대응 능력을 평가하는 기초 자료로 활용될 수 있습니다.'
