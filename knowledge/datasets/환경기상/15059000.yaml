summary_user: 경기도가 환경분야 성장 가능성과 기술력을 인정해 유망·우수환경기업으로 선정한 업체를 한 행에 한 기업씩 담은 목록으로, 시군명·시군코드, 기업명, 대표자명, 지정 구분, 제품(사업내용)을 포함한다. 환경산업 지원사업 담당자나 분석가가 "우리 시군에 어떤 친환경 기술 기업이 지정돼 있고 주력 제품은 무엇인가"를 확인하거나 협력·지원 대상 후보를 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)·시군명 같은 경기도 기관 코드나 기업명 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내에서 환경분야에 대한 성장 가능성과 기술력을 인정받아 유망환경기업으로 선정된 업체의 현황을 제공합니다. 주요 항목은 기업명, 제품(또는 사업내용), 대표자명, 시군명 및 코드 등으로 구성되어 있으며, 지역 기반의 친환경 기업군 파악 및 환경산업 육성 정책 자료로 활용될 수 있습니다. 특히, 이 데이터는 환경친화적인 기술을 보유하거나 환경오염 저감에 기여하는 기업에 대한 정보를 포함하고 있어, 환경 관련 기업 발굴 및 지원 대상 선별, 산업 구조 분석, 친환경 정책 수립 등에 효과적으로 사용될 수 있습니다. 데이터는 연간 갱신되며, XML 또는 JSON 형식의 Open API를 통해 제공되어 활용이 용이합니다.
