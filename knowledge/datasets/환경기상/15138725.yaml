description_portal: 의왕도시공사는 친환경 제품 구매 확대를 통한 사회적 책임을 이행하고 녹색소비문화 확산에 앞장서고 있습니다. 녹색제품 구매 실적 데이터는 공공기관의 환경보호와 지속가능한 소비 실천을 위한 녹색제품의 구매 현황을 보여주는 자료입니다. 해당 데이터는 조달구매한 녹색제품의 구매연도, 구매부서, 구매품목(사무용지, 에어컨디셔너 등) 구매금액 정보로 구성되어 있으며, 연도별 친환경 제품 구매 실적을 비교하여 정책 사례 연구, 점검 등에 활용이 용이하도록 오픈포맷 형태(CSV 확장자)로 제공하고 있습니다.
