summary_user: 유독물 물질별로 국문·영문 물질명, CAS번호, 물질유형·고유번호, 신호어, M계수(독성계수), UN번호, GHS 그림문자 코드와 유해성 분류(항목·등급·유해위험코드)를 담는 전국 범위 조회 API다. 사업장 안전담당자나 분석가가 "이 CAS번호 물질의 GHS 신호어와 그림문자, 유해성 분류 등급은 무엇인가"를 확인해 경고표지·물질안전 관리에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 화학물질 취급·배출 데이터와는 CAS번호나 물질명을 기준으로 이름·코드를 맞춰 잇는다.
description_portal: 영문 물질명, CAS번호, 고유번호 등을 기준으로 물질명(국문, 영문), 물질유형 및 고유번호, 신호어, M계수, UN번호, 그림문자코드, 유해성분류(항목명, 분류등급, 유해위험코드) 등을 제공하는 유독물GHS 정보 조회 서비스  부가설명 화학물질관리법에 따라 화학물질 통계 조사 및 배출량 조사 결과, 화학물질관리법 위반 사업장의 취급 정보를 국민에게 공개하여 국민의 알 권리를 충족시키고, 기업의 자발적인 안전 관리를 유도하며, 지방자치단체의 화학 사고 대비를 돕는 정보 시스템 입니다 GHS관련된 정보가 들어가있음
