description_portal: 본 데이터는 환경교육사 양성과정을 운영하는 기관의 현황 정보를 제공하기 위해 구축된 자료입니다.환경교육사 제도는 2015~2016년 시범운영을 거쳐 2017년부터 본격 도입된 국가 환경교육 전문인력 양성 제도로, 학교·기관·지역사회 등에서 환경교육을 수행할 수 있는 전문성을 갖춘 인력을 체계적으로 양성하기 위해 운영되고 있습니다.환경교육사 양성과정은 제도 시행 이후 지속적으로 확대되어 현재총 14개 기관이 전국에서 지정되어 운영 중입니다. 이들 기관은 교육청·공공기관·민간단체·대학연구소 등 다양한 유형으로 구성되어 있으며, 환경교육 전문역량 강화와 지역 기반의 환경교육 활성화를 목표로 교육 프로그램을 운영하고 있습니다.본 데이터는 이러한 환경교육사 양성기관의 등급, 지정일, 기관 유형, 연락처, 주소 정보, 기관 설명 등 상세한 특징을 제공하여, 환경교육사 자격 취득을 희망하는 국민과 관련 기관이 기관 정보를 쉽게 확인하고 활용할 수 있도록 구성되었습니다.
