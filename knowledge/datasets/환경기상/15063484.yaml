summary_user: 전북특별자치도에 적용되는 대기환경기준을 오염물질(항목)별로 한 행씩 담은 작은 기준표(csv 534바이트)로, 국가 기준과 지역 기준의 연간·24시간·8시간·1시간 평균 허용 농도와 지역 기준 적용 여부를 담는다. 도민이나 분석가가 '전북의 초미세먼지 24시간 기준은 국가 기준과 같은가, 더 엄격한가'를 확인하거나, 측정값이 기준을 넘었는지 판정할 때 기준값으로 쓴다. 전역 조인 키는 없으므로 에어코리아 측정소별 시간 대기질 같은 측정 데이터와는 오염물질 이름(항목)을 맞춰 연결한다.
description_portal: 전북특별자치도 지역에 적용되는 대기환경기준에 대한 상세 정보 데이터입니다. 이 자료는 도민의 건강을 보호하고 쾌적한 환경을 조성하기 위해 국가 및 지역에서 설정한 아황산가스(SO₂), 미세먼지(PM10), 초미세먼지(PM2.5), 오존(O₃) 등 주요 대기오염물질의 허용 농도 기준치를 담고 있습니다. 각 오염물질별로 연간, 24시간, 8시간, 1시간 등 시간 단위별 평균 기준치가 상세히 명시되어 있어, 대기질 측정 및 관리의 법적 근거로 활용됩니다. 이 데이터는 대기오염 예보 및 경보 발령의 기준이 되며, 환경 정책을 수립하고 그 효과를 평가하는 데 필수적인 정보입니다.
