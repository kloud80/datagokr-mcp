summary_user: 부산광역시 연제구 안에서 음식물류폐기물 전용용기를 파는 판매소를 한 곳씩 담은 목록으로, 소재동·상호·전화번호·도로명/지번 주소와 3·5·20리터 용기 취급 여부, 납부칩 판매 여부를 담는다. 연제구 주민이 '우리 동네 어디서 음식물 쓰레기 용기나 납부필증을 살 수 있나'를 찾을 때, 또는 생활폐기물 배출 편의시설 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(소재지)를 지오코딩하거나 동 이름으로 맞춰 이어 쓰며, 다른 지자체의 종량제·음식물 판매소 파일과는 같은 형식끼리 나란히 붙여 쓴다.
