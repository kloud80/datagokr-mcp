summary_user: 전국 17개 시도·226개 시군구의 주택을 대상으로 겨울철 실내 라돈 농도(Bq/m³)를 알파비적검출법 수동형 검출기로 90일 이상 장기 측정한 광역조사 결과를 시도·시군구·주택유형별로 담은 파일(csv)이다. 주민이나 지자체 담당자가 "우리 시군구의 단독주택·아파트 등 주택유형별 겨울철 실내 라돈 농도가 어느 수준인가"를 확인하거나 지역 간 비교에 쓴다. 실측 컬럼에 행정구역 코드 같은 공통 조인 키가 없어서, 다른 데이터와는 시/도·시/군/구 이름을 행정구역 코드표에 매핑해야 연결된다.
limits: 겨울철 조사 결과만 담고 있어 계절별 변화나 연중 평균 농도는 알 수 없고, 개별 주택 단위가 아닌 시군구·주택유형 단위 값이다. 행정코드가 없으므로 다른 데이터와 붙일 때 시군구 명칭 변경·표기 차이에 주의해야 한다.
