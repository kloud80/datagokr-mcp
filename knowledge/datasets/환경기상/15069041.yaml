description_portal: '본 자료는 전국의 주택을 대상으로  실내 라돈 농도를 파악하기 위하여 전국 17개 시도 및 226개 시군구를 대상으로 겨울철 주택 내  실내 라돈 농도 실태를 파악하고자 실시한 전국적 규모의 광역조사 결과이다.주택 실내 라돈 농도 측정은 90일 이상 장기간 측정에 사용되는 실내공기질 공정시험기준(국립환경과학원 고시)상의 실내 공기 중 라돈 측정 방법의 주 시험방법인 알파비적검출법의 수동형 검출기를 이용하였다. 제공데이터는 전국 시군, 시군구로 구별되어 있음* 전국 주택 겨울철 실내 라돈 농도(Bq/㎥) 결과 (사업명 : 전국주택라돈조사, 시도별, 시군구별, 주택유형별  자료)* 본 자료는 겨울철 실내라돈농도 조사 결과입니다.'
