description_portal: '이 데이터는 지역 내 공중화장실의 설치 위치 및 소유·관리 현황을 정리한 자료입니다. 공공기관, 민간, 상가, 관광지 등에 설치된 공중화장실의 명칭, 유형, 위치 정보(도로명주소 및 지번주소), 관리기관 등을 포함하고 있어 생활편의시설 관리 및 시민 이용 접근성 향상 정책 수립에 활용할 수 있습니다. 특히 간이화장실과 고정식 공중화장실을 구분하고, 행정기관별 관리책임을 명확히 하여 유지보수 계획 수립 및 공공위생 관리에 기여할 수 있는 데이터입니다. 본 데이터는 총 11개 항목으로 구성되어 있으며, 기준일은 2025년 8월 18일입니다.연번: 데이터에 기록된 공중화장실의 일련번호입니다.소유자명: 해당 화장실을 소유한 주체 또는 기관명입니다.유형: 설치된 시설의 성격을 나타내며, 공공기관·민간 등으로 구분됩니다.화장실명: 공중화장실의 명칭입니다.공중화장실 구분: 간이화장실 또는 고정식 공중화장실 등 유형 구분입니다.광역자치단체: 소속 광역 지자체 명칭입니다.기초자치단체: 해당 시설이 위치한 기초 지자체 명칭입니다.도로명주소: 도로명 기반의 주소입니다.지번주소: 지번 기반의 상세 주소입니다.관리기관명: 시설을 유지·관리하는 기관 또는 단체명입니다.데이터기준일: 해당 데이터가 집계된 기준일입니다.'
