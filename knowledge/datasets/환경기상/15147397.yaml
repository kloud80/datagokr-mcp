summary_user: 서울 강북구에서 자동차 배출가스 관련 부품 정비·점검과 소음 확인검사를 대행하는 배출가스전문정비사업자의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 영업 중인 곳과 폐업한 곳을 모두 포함한다. 차량 소유자가 강북구에서 배출가스 정비나 확인검사를 받을 수 있는 업소와 그 영업 상태를 찾거나, 분석가가 지역 내 자동차 환경 관련 업소의 인허가·폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어 사업장명·주소(도로명·지번)나 같은 기관 코드(OGDP_INST_CD)로 다른 구의 같은 인허가 데이터나 대기 배출원 자료와 맞춰 이어 쓴다.
description_portal: '서울특별시 강북구 배출가스전문정비사업자(확인검사대행자) 인허가 정보 데이터는 강북구의 자동차의 배출가스와 관련된 부품 등의 정비ㆍ점검 및 자동차 소음관련 확인검사 업무를 하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
