description_portal: '1. 생활폐기물 처리 (구·군 및 대행업체)가장 비중이 큰 생활폐기물 데이터는 구·군 직영과 대행업체 수거분으로 구분됩니다. 각 항목은 다음의 세 가지 지표를 제공합니다.반입 차량 대수: 시설로 들어온 폐기물 운반 차량의 총 횟수반입 중량: 실제 처리된 폐기물의 무게(톤 단위)부과 금액: 폐기물 처리에 따라 지자체나 업체에 청구되는 수수료2. 다량 오물 및 기타 공공 처리공공기관이나 유관 기관에서 발생하는 다량 오물에 대한 정보도 함께 제공됩니다.공공/유관기관 반입 차량 대수 및 중량: 일반 가정용 외에 대규모로 발생하는 오물의 반입 기록을 별도로 관리하여 폐기물 처리 시설의 운영 효율성을 분석하는 데 활용됩니다.'
