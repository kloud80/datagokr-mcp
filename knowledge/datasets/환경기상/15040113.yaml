summary_user: 대구광역시 남구 관내에서 음식물폐기물을 다량으로 배출하는 사업장을 한 곳당 한 행으로 담은 목록 파일로, 상호·전화번호·도로명주소·지번주소와 데이터기준일자를 담는다. 남구 주민이나 음식물 수거·처리 업체가 '우리 동네에서 음식물폐기물을 많이 내는 사업장이 어디이고 연락처는 무엇인가'를 확인할 때 쓰고, 행정의 지도·점검 대상 파악에도 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 상호나 주소 문자열을 맞춰 연결하거나, 주소를 지오코딩해 다른 구·군의 같은 종류 파일과 지도 위에서 합쳐 쓴다.
limits: 사업장 위치·연락처만 담고 배출량이나 처리 현황 같은 수치는 없어 발생량 분석에는 쓰지 못한다. 범위가 대구 남구 한 곳뿐이라 다른 지역은 지자체별 파일을 따로 받아야 하며, 사업자등록번호 같은 공통 키가 없어 이름·주소 매칭에 의존해야 한다.
