description_portal: 석면 조사가 필요한 건축물의 기본 현황 정보를 정리한 자료로, 건축물의 위치, 용도, 조사 대상 여부 등 석면 관리 업무에 필요한 주요 정보를 포함하고 있다. 본 자료는 석면조사대상 건축물의 분포 현황과 관리 대상 시설의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 석면조사대상 건축물 현황에 대한 체계적인 관리를 통해 석면 사용 건축물의 현황과 잠재적 유해 요인을 분석하고, 환경보건 관리 및 석면 안전 관리 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 석면 조사 및 관리 대상 건축물에 대한 행정 관리, 현장 조사, 지도·점검 및 민원 대응 업무 수행과 함께 관련 통계 산출 및 환경·건축 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 석면으로 인한 건강 피해 예방과 안전한 생활환경 조성을 위한 관리 체계를 강화하고, 석면 관리 및 저감 정책 추진을 위한 기초자료로 활용되며, 지속적인 환경보건 및 건축 행정 업무 수행을 지원하는 행정자료로 활용된다.
