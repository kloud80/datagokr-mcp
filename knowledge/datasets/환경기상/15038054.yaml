summary_user: 서울 강남구에 설치된 가로 쓰레기통을 한 곳씩 담은 건별 파일로, 도로(가로)명, 설치 장소명(건물·학교 등), 설치 환경(도로변·지하철역 입구·버스정류소 등), 쓰레기통 종류(일반·재활용)를 담는다. 주민이나 보행자가 "강남구 이 길이나 지하철역 근처에 재활용 쓰레기통이 있는가"를 확인할 때, 또는 지자체·분석가가 가로 쓰레기통 배치 현황을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어서, 다른 지자체 쓰레기통 파일이나 수거 지점 데이터와는 시군구명·도로명 같은 이름을 맞춰서만 연결한다.
limits: 좌표나 표준 코드가 없어 지도에 바로 올리거나 다른 데이터와 키로 결합하기 어렵고, 이름 매핑으로만 연결한다. 범위는 강남구 한 곳이며, 다른 구의 현황은 지자체별로 따로 나온 파일을 찾아야 한다.
