description_portal: 서울특별시 강남구에 설치된 쓰레기통 설치 현황으로 도로(가로)명, 설치위치, 설치지점, 쓰레기통 종류 등 자료 제공합니다.설치 위치 쓰레기통이 실제로 배치된 구체적인 장소명을 제공합니다. 예를 들어, 백화점인 ‘갤러리아’, 교육 시설인 ‘신사중학교’, 또는 공공시설 및 주요 건물명을 포함할 수 있습니다.설치 지점 쓰레기통이 설치되어 있는 환경이나 장소유형을 세분화하여 안내합니다. 예시로는 ‘도로변(횡단보도 포함)’, 즉 길가에 설치된 경우, ‘지하철역 입구’처럼 대중교통 접근로에 위치한 경우, 또는 ‘정류소’ 등 버스정류장 주변 등을 포함합니다. 심지어 횡단보도 근처처럼, 시민의 통행이 많은 지점에 설치된 현황도 구체적으로 확인 가능합니다.쓰레기통 종류 배치된 쓰레기통의 종류에 따라, ‘일반쓰레기’ 용 쓰레기통, 그리고 재활용을 위한 ‘재활용쓰레기’ 분리용 쓰레기통 등으로 구분됩니다
