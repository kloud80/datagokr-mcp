summary_user: 경기도 화성시 관내 사업장폐기물 처리업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 처리업종(수집운반·중간처리·최종처리 등), 업소명, 도로명 소재지, 전화번호를 수록한다. 화성시 사업장이 폐기물을 맡길 수집운반·처리업체를 찾거나, 분석가가 관내 처리업체의 업종 구성과 분포를 파악하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 폐기물 처리업 허가·배출자 자료와는 업소명이나 도로명주소를 맞춰 이어 써야 한다.
