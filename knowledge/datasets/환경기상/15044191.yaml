summary_user: 해양환경공단이 마산 삼귀 해역 측정소에서 자동 측정한 수온·염분·용존산소·수소이온농도·탁도·클로로필·전기전도도를 관측일자별로 담은 시계열 파일(CSV, 약 1.9MB)이다. 마산만 인근 폐쇄성 수역에서 여름철 용존산소가 언제 낮아지는지, 계절별로 수질이 어떻게 달라지는지를 보려는 연구자·지자체 담당자가 쓴다. 전역 조인 키는 없어서 다른 해양수질자동측정망 정점 파일과는 정점코드·정점명이나 관측일자를 맞춰 이어 붙여야 한다.
