summary_user: 광양시에 신고된 비산먼지 발생사업장(주로 공사장)을 한 건씩 담은 파일로, 사업장명·공사장 소재지·공사장명·발생사업 종류·공사 시작일과 종료일·대상사업 규모를 기록한다. 광양시 주민이 우리 동네 근처에서 먼지가 나는 공사가 어디서 언제까지 진행되는지 확인할 때 쓰고, 분석가는 지역별 비산먼지 발생 사업장 분포를 살필 때 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·법정동코드 등)가 없어 다른 데이터와는 사업장명이나 공사장 소재지 주소를 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
limits: 사업자번호나 행정코드가 없어 배출시설 인허가·기업 정보와 키로 바로 조인할 수 없고, 이름·주소 매칭에 의존해야 한다. 범위는 광양시 한 곳이며, 다른 시군구 현황은 담지 않는다.
