summary_user: 해양환경공단이 해양수산부 위탁으로 수행하는 해양침적폐기물 정화사업을 사업 단위로 담아 사업대상지역·사업구역·사업기간·정화량·정화면적을 제공하며, 검증 시 API 전체 건수는 1건(전국 범위, 비공간)이었다. 해양환경 분석가나 어민·지자체 담당자가 '어느 해역에서 언제 해저 폐기물을 얼마나 수거했는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양쓰레기·오염사고 데이터와는 사업대상지역명·사업구역명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 해양침적폐기물 정화사업은  해저에 쌓인 폐기물을 수거, 처리해 해양생태계를 보전하고 해양환경을 개선하는 한편, 항행 방해요소를 사전에 제거해 선박의 안전한 운항 여건을 조성하기 위한 사업으로, 해양수산부로부터 위탁받아 해양환경공단이 진행하고 있습니다. 해양침적폐기물 정화사업 서비스는 사업대상지역명, 정화사업구역명, 정화사업명, 사업시작일자, 사업종료일자를 검색 조건으로 사용하여 사업대상지역명, 정화사업명, 정화사업사업구역명, 사업시작일자, 사업종료일자, 정화량, 정화면적 데이터를 검색할 수 있습니다.
