description_portal: 쾌적한 생활환경 조성과 불법쓰레기 무단투기 근절을 위해 상습 투기지역을 대상으로 불법투기 단속용 CCTV를 설치하였습니다. 반복적으로 발생하는 생활쓰레기 무단투기로 인한 악취, 미관 저해 및 주민 불편을 해소하고 올바른 쓰레기 배출문화를 정착시키기 위해 추진되었습니다. 설치된 CCTV는 불법투기 행위 예방과 계도는 물론, 위반행위 발생 시 관련 법령에 따른 행정조치의 근거자료로 활용될 예정입니다. 또한 지속적인 현장점검과 주민홍보를 병행하여 깨끗하고 안전한 생활환경 조성에 목적으로도 활용될 예정입니다.
