description_portal: '- 주거환경 개선과 쾌적한 생활환경 조성을 위해 가정에서 발생하는 대형폐기물의 적정 처리가 중요해짐에 따라, 보령시는 폐기물 관리 조례 제10조 및 제16조에 근거하여 대형폐기물의 품목별 처리수수료 정보를 제공하고 있습니다.- 개방 데이터는 가전제품(TV, 냉장고, 세탁기, 에어컨, 다리미, 청소기, 컴퓨터, 탈수기, 전기밥솥, 정수기, 안마의자, 가습기, 러닝머신 등), 가구류(침대, 소파, 책상, 신발장, 서랍장, 식탁, 의자, 문짝, 장롱  등), 기타 품목(자전거, 카펫, 벽시계, 액자, 병풍, 욕조, 변기, 싱크대, 인형, 세면대, 항아리, 피아노, 솜이불, 거울, 수족관, 휠체어, 소화기, 배기 후드 등) 등 총 93건의 대형폐기물에 대한 품목명, 규격별 분류, 처리수수료, 관리책임부서 및 연락처 정보를 포함하고 있습니다.- 시민들은 이 데이터를 통해 대형폐기물 배출 전 적정 수수료를 미리 확인하여 편리하게 폐기물을 처리할 수 있고, 환경 관련 연구기관은 지역별 폐기물 처리 수수료 비교 분석 및 정책 수립에 활용할 수 있으며, 재활용 관련 기업은 품목별 처리 현황을 파악하여 자원 재활용 사업 확대에 기여할 수 있습니다.'
