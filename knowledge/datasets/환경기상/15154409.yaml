description_portal: 이 데이터는 보건환경연구원에서 수행하는 다양한 검사 항목별로 어떤 분석장비를 사용하는지 정리한 목록입니다. 각 항목은 일련번호, 검사 대상 물질 이름, 분석에 사용되는 장비 이름, 그리고 해당 장비를 운영하는 사용부서 정보로 구성되어 있습니다. 이 데이터를 활용하여 GC/MS, LC/MS/MS2 등 정밀 분석 장비를 활용한 농약류와 마이크로시스틴류를 검사와  ICP-OES, ICP-MS, 분광광도계, 기체크로마토그래피 등 다양한 장비를 이용해 중금속·유기용제·산소요구량(BOD) 등의 항목을 분석한다는 것을 파악할 수 있습니다.이 자료는 항목별 검사 수행 체계를 이해하고 장비 운영 현황을 파악하는 데 활용될 수 있는 기초 정보로서 공익적 의미가 있습니다.
