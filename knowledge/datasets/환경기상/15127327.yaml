description_portal: '인천광역시 강화군 관내에 설치된 의류수거함의 위치 현황을 행정동 단위로 정리한 자료로서, 생활폐기물 관리와 자원순환 행정업무 수행을 위해 작성되었습니다. 강화군에서는 재사용 가능 의류의 효율적 수거와 관리 체계 강화를 위해 의류수거함 설치 현황을 관리하고 있으며, 해당 자료는 주민 편의 증진과 수거시설 접근성 파악에 참고할 수 있습니다.강화군 관내 의류수거함의 연번, 행정동, 설치장소, 관리부서 등의 항목을 제공하고 있으며,공공데이터 제공신청(제공신청 번호 : 120432)을 통해 1회성으로 개방하는 데이터이므로 정기적 갱신이나 현행화를 진행하지 않습니다.○ 제공부서: 환경위생과'
