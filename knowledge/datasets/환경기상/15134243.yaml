summary_user: 서울시 개발사업 가운데 사업구역에 내린 빗물을 구역 안에서 처리하도록 빗물분담량을 정하는 저영향개발 사전협의 대상의 공간정보를 담는다(좌표계 EPSG:5186, 인코딩 windows-949). 도시계획·부동산 분석가가 서울 어느 지역에서 빗물관리 사전협의를 거친 개발사업이 늘고 있는지를 개발 선행 지표로 살펴보는 데 쓴다. 필드는 관리번호(RSLT_MNG_NO, PLAN_MNG_NO)뿐이고 전역 조인 키가 없어서, 토지이용규제·개발사업 데이터와는 사업명 매핑이나 같은 기관 코드, 공간 중첩으로 이어 쓴다.
