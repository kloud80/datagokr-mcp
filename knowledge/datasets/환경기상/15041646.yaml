summary_user: 대구광역시 달성군에 설치된 폐형광등·폐건전지 분리수거함을 한 곳씩 담은 파일로, 설치 위치·수거품목·설치연도·관리기관 연락처와 위도·경도를 개별 지점 단위로 제공한다. 달성군 주민이 집 근처에서 다 쓴 건전지나 형광등을 버릴 수거함이 어디 있는지 찾거나, 분석가가 군 안의 수거함 분포와 빈 지역을 지도로 확인하는 데 쓴다. 전역 조인 키는 없어 시도명·시군구명으로 다른 지자체 수거함·재활용 정거장 파일과 묶거나, 위도·경도로 행정구역·인구 자료와 공간 결합해 쓴다.
description_portal: 폐형광등 및 폐건전지 분리수거함의 설치 현황을 정리한 자료로, 분리수거함의 설치 위치, 설치 유형 등 분리수거 관리에 필요한 기본 정보를 포함하고 있다. 본 자료는 폐형광등 및 폐건전지 분리수거함의 분포 현황과 관리 대상 시설의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 폐형광등 및 폐건전지 분리수거함 현황에 대한 체계적인 관리를 통해 유해 폐기물의 적정 배출과 수거 실태를 분석하고, 중금속 등 유해물질로 인한 환경오염 예방과 자원순환 촉진을 위한 행정적 의사결정을 지원한다. 본 자료는 분리수거함 설치 및 유지 관리에 대한 행정 관리, 현장 점검, 주민 안내 및 민원 대응 업무 수행과 함께 관련 통계 산출 및 환경 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 폐형광등 및 폐건전지의 안전한 처리와 재활용 활성화를 위한 관리 체계를 강화하고, 토양·수질 오염을 예방함으로써 쾌적한 생활환경 조성과 지속 가능한 자원순환 사회 구현을 위한 정책 추진의 기초자료로 활용되며, 지속적인 환경 관리 및 청소 행정 업무 수행을 지원하는 행정자료로 활용된다.
