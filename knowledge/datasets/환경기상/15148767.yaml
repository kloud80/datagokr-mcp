description_portal: 일관측표의 비고란에 대한 데이터는 일일 관측 과정에서 기본 항목만으로는 표현하기 어려운 다양한 특이사항과 보충 설명을 담는 자료입니다. 예를 들어 특정 시간대에 발생한 기상현상의 특이 사례, 관측 장비의 점검이나 고장으로 인한 자료 누락 사유, 또는 기상현상 분류가 모호한 경우 이를 명확히 기록하는 보완 정보가 포함될 수 있습니다. 이러한 비고 데이터는 단순한 참고 수준을 넘어 통계 처리 및 자료 분석 시 관측값의 배경을 이해하는 데 도움을 주며, 향후 품질관리와 검증 과정에서 관측자료의 신뢰성을 확보하는 중요한 근거로 활용됩니다.
