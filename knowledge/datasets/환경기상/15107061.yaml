summary_user: 대전광역시 동구에서 폐수배출시설을 설치한 사업장을 한 곳씩 담은 파일로, 사업장 규모 종별(종), 상호, 소재지, 업종, 데이터기준일자를 담는다. 주민이나 분석가가 "우리 동네 근처에 폐수를 배출하는 사업장이 어디에 있고 어떤 업종인가"를 확인하거나 동구 내 수질 오염원 분포를 파악할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 상호·소재지 주소를 이름으로 맞추거나 같은 기관(대전 동구) 단위로만 잇는다.
