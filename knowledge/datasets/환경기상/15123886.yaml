description_portal: '- 대기오염정보관리시스템의 기간별 대기오염도 현황입니다.- 전라남도 내 측정소별, 날짜별 대기오염도 수치를 조회하실 수 있습니다.- 미세먼지, 오존, 이산화질소, 아황산가스 측정 수치에 대한 데이터를 제공합니다.- 미세먼지 농도가 높을 경우, 특히 어린이, 노인, 호흡기 질환자 등은 외출을 자제하고 실내에서 활동하는 것이 좋습니다.- 전라남도의 대기오염 문제는 단순한 환경 문제가 아니라 지역 주민들의 건강과 직결된 중요한 사안입니다. 따라서 정부, 산업계, 지역 사회가 함께 협력하여 실질적인 대기오염 저감 대책을 마련하는 것이 시급합니다.'
