description_portal: 부산진구의 대형폐기물과 생활폐기물을 처리하는 업체는 다르며, 같은 폐기물이라도 담당 구역별로 처리하는 업체도 다릅니다. 현재 대형폐기물 처리업체는 2개소, 생활폐기물 처리업체는 4개소가 있습니다. 이 데이터는 부산진구 관내 대형폐기물 처리업체 및 생활폐기물 대행업체 정보가 들어있습니다. 대형폐기물을 처리하는 업체명, 전화번호, 관리기관, 홈페이지, 담당하는 구역에 관한 설명이 있고, 생활폐기물을 처리하는 업체명, 전화번호, 관리기관, 담당하는 구역에 관한 정보가 포함되어 있습니다. 관리기관은 부산진구이므로 문의사항 있을 시 부산진구로 연락하실 수 있습니다. 대형폐기물 처리업체는 대형폐기물(일반 쓰레기(생활폐기물) 중 크기가 크거나 무게가 무거워서 일반 종량제 봉투에 들어가지 않는 가구 등 품목)을 수거하며 전화나 홈페이지를 통해 접수할 수 있습니다. 생활폐기물 업체는 가연성쓰레기, 불가연성쓰레기, 재활용품, 음식물 쓰레기, 소형폐가전, 스티로폼 등을 정해진 요일별로 수거합니다. 배출시간은 저녁 7시에서 9시까지이고, 대문(점포) 앞 또는 1층 출입구에 배출하면 됩니다.금요일과 토요일은 생활쓰레기 배출금지입니다. 대형폐기물은 품목별로 수수료가 발생하며, 부산진구 조례상에 대표적인 대형폐기물의 기본규격의 수수료가 정해져있습니다. 생활폐기물은 종량제봉투, 불연성 마대, 음식물쓰레기 납부필증 등을 구입하여 배출하실 수 있고, 배출 요일(시간) 및 배출방법 미준수시 미수거 및 과태료를 부과합니다. 과태료는 100만원 이하의 금액입니다. 대형폐기물과 생활폐기물에 관한 설명은 부산진구 홈페이지에서도 자세히 보실 수 있습니다. 각 지자체별로 수거 요일, 수거업체가 다르니 다른 지역에서 쓰레기를 배출하실 때는 해당 지자체의 정보를 확인하시기 바랍니다.  부산진구의 업체 정보가 바뀔 수 있으니 부산진구 홈페이지를 통해 가장 먼저 확인해주시기 바랍니다.
