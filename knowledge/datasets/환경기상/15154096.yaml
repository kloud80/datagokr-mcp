description_portal: 체감온도 실황데이터는 현재 시점의 기온, 습도, 일사, 풍속 등 주요 기상요소를 활용해 실제 체감되는 더위 수준을 즉시 산출하여 표출한 정보이다. 지역별 측정값을 기반으로 하여 고령자·어린이·실외작업자 등 폭염 취약계층의 위험도를 신속히 파악할 수 있으며, 폭염 특보와 연계하여 현재 관심·주의·경고·위험 단계 판단에 활용된다. 또한 현장의 열 스트레스 수준을 실시간으로 제공해 수분 섭취, 휴식 시간 확보, 야외활동 조절 등 온열질환 예방을 위한 즉각적인 대응에 도움이 되는 기초 자료로 제공된다.
