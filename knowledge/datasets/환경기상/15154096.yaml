status: active
summary_user: 기상청이 기온·습도·일사·풍속으로 산출한 체감온도를 발표시간·지점코드별로 담고, 한 행에 1~24번째 시간 값(예측시간1~24)이 이어지는 전국 범위 파일(zip)이다. 지자체 폭염 담당자나 실외작업 사업장이 '지금 우리 지역 체감 더위가 어느 수준이고 앞으로 몇 시간 동안 이어지는가'를 확인해 휴식·야외활동 조정을 판단하는 데 쓴다. 전역 조인 키는 없어 지점코드를 기상청 관측지점 정보와 이름·코드로 매핑해 이어 쓰며, 같은 부문의 예보·특보 데이터와는 예보구역·격자 기준으로 맞춰 연계한다.
limits: 실측 컬럼에 전역 조인 키가 없어 행정구역 코드로 바로 붙지 않고, 지점코드를 별도로 매핑해야 한다. 비공간 데이터라 좌표가 들어 있지 않다. 지수코드와 예측시간 칸의 정확한 뜻을 설명하는 명세가 없으므로, 해석하기 전에 기상청 생활기상지수 문서로 확인해야 한다.
