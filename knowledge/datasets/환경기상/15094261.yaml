summary_user: 증평군 관내에 등록된 대기오염물질 배출시설 보유 사업장을 한 행에 한 곳씩 담은 목록으로, 사업장명·도로명 소재지·전화번호·대표업종·사업장 종별(1~5종 등)을 담는다(csv 약 4KB 규모). 주민이나 분석가가 "우리 동네 근처에 어떤 대기배출 사업장이 있고 몇 종 규모인가"를 확인하거나 민원·점검 대상을 추릴 때 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 같은 기관(증평군) 자료끼리만 이어 쓴다.
description_portal: 충청북도 증평군_대기배출시설현황은 「대기환경보전법」에 따라 증평군 관내에서 등록·운영 중인대기오염물질 배출시설 보유 사업장의 현황 정보를 제공하는 데이터입니다.해당 자료에는 사업장명, 도로명주소 기준 소재지, 전화번호(연락처),그리고 사업장의 분류(1종~5종 또는 기타 분류) 등의 항목이 포함되어 있습니다.사업장분류는 대기오염물질 배출량, 배출유형, 산업 종류 등에 따라 등급화되어 있으며,이는 환경관리의 우선순위 설정, 배출량 허용기준 적용, 정기점검 대상 여부 판단,환경오염물질 저감정책 수립 등에 활용됩니다.해당 데이터는 환경부 및 지자체에서 운영하는 환경행정시스템과 연계되며,환경 지도 구축, 오염원 집중지역 분석, 주민민원 대응 기반자료, 환경영향평가 사전검토 등에 유용합니다.또한 위반 사업장 집중관리, 취약 지역의 공기질 모니터링,지역 맞춤형 대기환경 정책 수립의 기초자료로 기능합니다.
