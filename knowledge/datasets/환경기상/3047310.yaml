description_portal: 본 데이터는 경상북도 예천군 관내 석면조사 대상 건축물의 현황을 수록한 공공데이터이다. 석면은 인체에 유해한 1급 발암물질로, 사용된 건축물은 철거 또는 리모델링 시 석면조사를 시행해야 하며, 관련 법령에 따라 관리된다. 본 자료에는 번호, 건물명, 주소, 건축물구분, 데이터기준일자 등의 항목이 포함되어 있으며, 이를 통해 석면 노출 위험을 사전 파악하고 안전관리에 활용할 수 있다. 해당 데이터는 주민 건강 보호, 유해물질 관리, 건축물 안전 확보, 해체 작업 대응, 환경위해 예방 등 다양한 행정 목적에 활용된다. 데이터는 예천군의 건축 및 환경 행정 기준과 관련 법령에 따라 정기적으로 갱신되며 체계적으로 관리된다.
