summary_user: 군산시에서 대기오염물질 배출시설을 신고하거나 허가받은 사업장을 한 행에 한 곳씩 담은 건별 목록이며, 사업장명, 소재지, 인허가 등록일자, 인허가 구분(신고·허가)을 포함한다(CSV 약 19KB). 주민이나 분석가가 우리 동네 주변에 대기 배출 사업장이 어디 있고 언제 신고·허가를 받았는지 확인하는 데 쓴다. 전역 조인 키는 없어서 소재지 주소를 좌표로 바꾸거나 사업장명을 맞춰 다른 사업장·측정소 자료와 연결한다.
description_portal: 해당 데이터는 군산시 내 대기오염물질 배출 사업장들의 신고 및 허가 현황을 체계적으로 수집·정리한 자료로, 각 사업장의 연번, 사업장명, 지번주소, 도로명주소, 인허가일자, 인허가 구분 등의 상세 정보를 포함하고 있습니다. 이를 통해 환경 당국은 대기오염 배출 사업장의 위치, 허가 상태, 인허가 시기 등을 정확하게 파악할 수 있어, 대기환경 관리와 오염 저감 정책 수립에 효과적으로 활용됩니다. 또한, 사업장별 배출 규제 준수 여부 점검과 환경 보호 활동 강화, 산업 활동의 지속 가능성 확보에 중요한 기초 자료로 활용됩니다. 지역 주민의 건강 보호와 대기질 개선을 위한 행정적 의사결정과 지원에도 필수적인 역할을 합니다.
