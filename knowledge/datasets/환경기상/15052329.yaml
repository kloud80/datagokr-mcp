description_portal: 서울특별시 서초구에서 제공하는 공공건축물 정보(건축물 구분, 건물명, 석면건축물 여부, 주소)에 대한 데이터 자료입니다.석면안전관리법 제21조에 따른 건축물 석면조사에 따른 정보입니다.석면은 직경의 0.02~0.03㎛ 정도로 유연성과 열에 대한 저항력이 매우 강하고 약산성을 띄고 있어 건축자재, 자동차 , 가정용품 다양한 분야에서 이용되었습니다.특히 건축물 내에서는 마감재, 단열 및 보온재, 바닥타일, 천장타일, 지붕용 슬레이트 등으로 사용되었습니다.그러나 석면은 호흡기로 인체에 흡입될 경우 치명적인 폐질환을 유발하여 1급 발암물질로 지정되어 석면 사용 금지하고 있습니다.
