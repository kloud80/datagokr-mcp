summary_user: 대전 대덕구 버스승강장 등 공공장소에 놓인 쓰레기통을 한 개씩 기록한 건별 목록으로, 승강장 이름과 설치 방향, 구체적 설치지점, 쓰레기통 종류를 담은 작은 CSV 파일(약 6KB)이다. 주민이나 버스 이용객이 "이 정류장 근처에 쓰레기통이 있나"를 확인하거나, 구청 담당자가 승강장별 쓰레기통 배치 현황을 점검할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 버스승강장 이름을 정류소 목록의 이름과 맞춰 보는 방식으로만 이을 수 있다.
limits: 대덕구 한 곳만 다루고 좌표가 없어 지도에 바로 올릴 수 없으며, 정류소 ID 같은 공통 코드도 없어 이름 매칭에 의존해야 한다. 쓰레기 발생량이나 수거·처리 실적은 담지 않는다.
