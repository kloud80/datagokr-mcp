description_portal: 본 데이터는 국립공원공단이 관리하는 생물 종목록을 기반으로 작성된 기본 통계자료로, 국립공원별 또는 권역별로 분포하는 주요 생물종의 현황을 종합적으로 제공하는 자료입니다. 주요 항목은 국립공원명, 생물 분류군(포유류, 조류, 양서·파충류, 어류, 곤충류 등), 종 수 등으로 구성되어 있으며, 생물다양성 관리, 자원 보전 정책 수립, 연구 기반 자료 등으로 활용됩니다. 본 통계는 전국 단위의 종 다양성 현황을 파악하고, 종 출현 빈도 분석, 공원 간 비교 평가, 서식지 보호 전략 수립 등에 기초자료로 제공됩니다. 데이터는 표준화된 구조로 CSV 포맷으로 제공되며, 국립공원 생물종 DB, 서식환경 정보, 환경변화 모니터링 시스템 등과의 연계도 가능합니다.
