description_portal: '한국남동발전의 대기오염물질 배출 데이터입니다.2015년 1월부터 최신일자까지의 데이터를 조회할 수 있으며, 각 사업소별로 대기오염의 주요 원인인 황산화물(SOx), 질소산화물(NOx), 먼지의 배출농도 기준과 실제 평균 배출량을 해당월별로 비교하여 제공합니다. 이를 통해 각 발전소가 배출 기준을 얼마나 안정적으로 준수하고 있는지 객관적인 수치로 파악하고, 데이터를 활용하여 대기 환경 연구의 기초자료로 활용할 수 있습니다.* 데이터 단위 :  황산화물(ppm), 질소산화물(ppm), 먼지(㎎/S㎥)'
