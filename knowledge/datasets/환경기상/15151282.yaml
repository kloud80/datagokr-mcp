description_portal: 이 데이터는 항아리를 촬영한 이미지와 해당 이미지에 대한 라벨링 데이터를 포함한 AI 학습용 데이터셋입니다. 데이터는 총 200장의 이미지와 동일 개수의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에, 라벨링 파일은 ‘labels’ 폴더에 저장되어 있습니다. 이미지에는 다양한 형태와 크기의 항아리가 포함되어 있으며, 실내외 여러 환경에서 촬영되었습니다. 라벨링 파일은 YOLO 형식으로 제공되며, 항아리 객체의 위치와 클래스 정보를 좌표값으로 기록하여 객체 인식 및 분류 학습에 활용할 수 있도록 구성되었습니다. 데이터는 일관된 파일 구조와 명명 규칙을 따르고 있어 모델 개발 및 데이터 처리에 용이합니다.
