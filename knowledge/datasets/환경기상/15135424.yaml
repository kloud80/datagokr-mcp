summary_user: 경기도 대기환경 진단평가시스템이 산출한 일일 대기질 진단·예측을 평가일자별 한 건으로 담으며, 남부·중부·북부·동부 4개 권역의 초미세먼지·미세먼지·오존 등급과 실내·실외·교통 환경 등급을 좋음·보통·나쁨 같은 등급과 평가내용 글로 기록한다. 경기도민이나 분석가가 '오늘 우리 권역의 초미세먼지·오존 등급이 어떤지, 야외활동이나 실내 환기를 해도 되는지'를 확인하거나 권역별 등급 추이를 볼 때 쓴다. 전역 조인 키가 없어 측정소 자료 등과는 평가일자(evl_ymd)와 권역 이름을 기준으로 맞춰 이어 써야 한다.
description_portal: 경기도_대기환경_진단평가시스템_일일진단평가 데이터는 경기도 대기환경 진단평가시스템에서 산출된 권역별 일일 대기질 예측 및 평가 정보를 제공하는 자료입니다. 주요 항목으로는 실내·실외·교통 환경 등급(남부권, 중부권, 북부권, 동부권), PM2.5 등급, PM10 등급, 오존(O3) 등급, 평가내용, 계정ID, 작성일시, 평가일자, 작성일자 등이 포함됩니다. 데이터는 특정 일자별 대기질 상태를 ‘좋음·보통·나쁨’과 같은 등급으로 표시하며, 초미세먼지·미세먼지·오존의 권역별 예측 결과와 정보를 제공합니다.
