summary_user: 경상남도 밀양시 하남읍 관내 마을회관·아파트·어린이집 등에 설치된 폐형광등·폐건전지 같은 수은함유폐기물 수거함을 설치 장소별로 한 행씩 담은 목록으로, 배출품목·수거장소 명칭·소재지·수량·관리주체를 기록한다. 하남읍 주민이 집 근처 어디에 폐형광등이나 폐건전지를 버릴 수 있는지 찾거나, 담당자가 수거함이 부족한 마을을 골라 추가 설치를 검토할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 수거장소 명칭을 맞춰 연결하고, 다른 지자체의 수거함 파일과는 같은 항목끼리 이어 붙여 쓴다.
description_portal: 본 데이터는 경상남도 밀양시 하남읍 관내에 설치·운영 중인 수은함유폐기물 수거함 현황을 제공하는 자료입니다.데이터는 배출품목, 수거장소 명칭, 소재지, 수량, 관리주체, 데이터기준일자 항목으로 구성되어 있으며,폐형광등 및 폐건전지 등 수은 또는 중금속이 포함된 생활계 폐기물의 안전한 수거·처리를 위한 기초자료로 활용됩니다.해당 자료는 마을회관, 아파트, 어린이집 등 주민 이용이 잦은 생활 기반시설에 설치된 수거함의 위치와 수량을 체계적으로 제공함으로써지역 내 유해폐기물의 적정 배출 및 환경오염 방지를 위한 정책수립, 수거함 추가 설치 검토,주민편의 개선 등 환경행정 전반에서 활용도가 높습니다.
