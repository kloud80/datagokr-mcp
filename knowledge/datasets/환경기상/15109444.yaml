summary_user: '충청남도 아산시에서 접수된 야생동물 구조 건을 한 건씩 담으며, 접수번호별로 종명·분류(강·목·과)·멸종위기 등급·CITES 여부, 발견·접수·구조 일시, 발견 주소와 구조·방사 좌표, 발생 원인, 구조 결과, 성별·나이·체중을 기록한다. 아산 지역에서 어떤 종이 어떤 원인(예: 차량 충돌, 탈진)으로 어디서 많이 구조되는지, 구조 후 방사·폐사 비율은 어떤지 살피려는 지자체 담당자나 생태 분석가가 쓴다. 전역 조인 키는 없어 발견 주소나 구조 좌표로 행정구역·공간 레이어와 겹쳐 보거나, 국명(종 이름)으로 전국자연환경조사 종 분포 자료와 맞춰 쓴다.'
description_portal: 발견일시, 접수일시, 구조일시 등의 야생동물 구조 데이터 정보를 제공하는 충청남도 아산시 야생동물 구조 데이터 조회 서비스
