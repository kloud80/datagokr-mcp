summary_user: 해양수산부의 해양환경 영향평가 협의 사업을 사업 단위로 담은 API로, 접수연도·사업명으로 조회하며 검증 호출에서는 전국 범위의 개별 사업(주소·좌표 단위) 1행을 받았다. 개발사업의 사업구역과 협의 단계를 볼 수 있어, 분석가나 사업자가 특정 해역 인근에서 어떤 개발사업이 협의 중인지 파악하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 사업명·주소·좌표를 이름이나 위치로 매핑하거나 같은 기관 코드로만 토지이용규제·개발사업 데이터와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 검증 수신은 1행뿐이라 전체 규모와 필드별 코드표는 확인되지 않았고, 갱신은 이벤트 주기(생성 후 불변)로 표기돼 있다.
