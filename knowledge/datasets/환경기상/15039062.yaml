description_portal: 국립낙동강생물자원관에서는 담수생물자원의 보존과 활용 촉진을 위해 분양 중인 조류자원 정보를 공공데이터로 개방하고 있습니다.개방 데이터는 은행자원번호, 분류군, 학명, 조류개체 여부(unialgal/mixed), 무균여부(axenic/xenic), 채집환경, 배지, 온도, 광량, 광주기 등으로 구성되어 있습니다. 학계·연구기관은 조류자원의 분포 특성, 배양 조건, 순수성 및 혼합성 여부 등의 분석을 통해 수질 정화 연구, 생물에너지 개발, 기능성 물질 생산 등 다양한 생물소재 연구 및 산업적 응용 가능성을 모색할 수 있습니다. 교육·문화기관은 해당 데이터를 기반으로 조류의 분류학적 특징, 생태적 기능, 광합성 생물의 생존 조건을 체험할 수 있는 생물자원 교육 콘텐츠 및 실습 프로그램 자료로 활용할 수 있습니다. 지자체 및 관련 기관은 조류자원의 채집환경 정보 및 분포 현황을 활용하여 지역 수생태계의 생물다양성 보전, 생태관광 자원화, 지역 생물자원 기반 산업 육성 등에 기여할 수 있습니다. 자세한 정보는 국립낙동강생물자원관 담수생물자원은행 누리집(fbp.nnibr.re.kr/fbcc) 에서 확인하실 수 있습니다.
