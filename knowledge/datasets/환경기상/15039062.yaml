summary_user: 국립낙동강생물자원관 담수생물자원은행이 분양하는 조류(藻類) 자원을 자원 1건당 1행으로 담은 파일로, 은행자원번호·분류군·학명·단일조류 배양 여부·무균 여부·채집환경·배지·온도·광도·광주기를 담는다(csv 약 13KB, 전국·비공간). 연구자나 기업이 특정 미세조류 균주를 분양받기 전에 "이 종은 어떤 배지와 온도·광 조건에서 배양하며 무균 배양주인가"를 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어 학명을 기준으로 다른 생물종 목록과 이름 매칭해 이어 쓴다.
