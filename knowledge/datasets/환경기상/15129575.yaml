summary_user: 해양수산부가 지정한 국가 해안쓰레기 모니터링 조사 정점을 한 행에 한 정점씩 담은 파일 데이터로, 일련번호·정점 명칭·위도·경도로 구성되며 전국 60개 정점이 들어 있다. 해안쓰레기 현장 조사 구간을 고르거나 어느 해안이 모니터링 대상인지 확인하려는 분석가·정책 담당자가 쓴다. 위도·경도(coord) 좌표를 키로 다른 좌표 기반 데이터와 공간적으로 이어 쓸 수 있고, 정점 코드나 주소 같은 별도 조인 키는 없다.
description_portal: 이 데이터는 국가 해안쓰레기 모니터링 조사 정점의 현황을 파악하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부가 지정한 국가 해안쓰레기 모니터링 정점의 일련번호, 정점 명칭, 각 정점의 위도와 경도 좌표 정보로 구성되어 있습니다.  본 데이터는 해안쓰레기 발생 및 분포 경향을 체계적으로 살펴보고, 해양 환경 현장 조사의 기초 자료로 활용될 수 있습니다. 또한, 해양쓰레기 관련 정책의 수립이나 현장 모니터링 조사 구간 선정, 해안 관리방안 마련에도 사용할 수 있습니다.
