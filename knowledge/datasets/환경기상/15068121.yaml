summary_user: 해양수산부가 관리하는 개발사업별 환경영향평가 추진 현황을 건별로 담은 API로, 접수연도·사업명·진행단계·사업시행자·주소·좌표·사업비 등을 조회한다. 사업이 어느 지역에서 어떤 단계까지 협의가 진행됐는지 알고 싶은 국민·사업자·분석가가 쓴다. 전역 조인 키가 확인되지 않아 사업명·주소·좌표 매핑이나 같은 기관 코드로 토지이용규제·개발사업 데이터와 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 검증 호출에서 수신된 것은 1행이라 전체 건수와 범위는 확인되지 않았고, 개발계정은 일 10,000회로 제한된다. 갱신 주기는 이벤트 주기로 표기돼 있어 정기 갱신을 전제하면 안 된다.
