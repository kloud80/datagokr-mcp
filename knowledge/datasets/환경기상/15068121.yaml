description_portal: 이 데이터는 해양수산부에서 환경영향평가와 관련한 정보를 제공하기 위해 수집한 데이터입니다.  접수연도, 사업명 등을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 접수연도, 사업명, 사업번호, 접수일, 결과명, 진행단계명, 사업시행자, 사업유형명, 사업유형 기타, 주소(시도/구군/읍면동 및 상세주소), 사업 시작일과 종료일, 사업비, 사업규모, 사업목적, 처분기관, 비고, 협의 상태, 협의서 종류명, 위도, 경도 등으로 구성되어 있습니다.  본 데이터는 사업별 환경영향평가 추진 현황 파악, 지역별 환경 영향 사업의 분포 분석, 사업 유형별 환경정책 수립 지원, 진행 단계별 평가 관리, 환경영향 평가 관련 기관의 모니터링, 공공기관의 정책 자료, 학술 연구를 위한 기초 데이터 등으로 활용될 수 있습니다.
