summary_user: 충청북도 제천시에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 원장 파일로, 상호·사업자등록번호·폐기물 종류·운반자·처리업소명·처리방법·사업장 주소를 담는다. 사업자나 분석가가 제천시의 특정 사업장이 어떤 폐기물을 누구에게 맡겨 어떤 방법으로 처리하는지 확인할 때 쓴다. 사업자등록번호(bizno)를 키로 폐기물 처리업 허가 현황이나 다른 사업자 원장과 잇고, 도로명·지번 주소로 위치 기반 자료와 맞춰 쓴다.
description_portal: 해당 데이터는 충청북도 제천시의 사업장폐기물배출자신고현황을 정리한 데이터입니다. 상호, 사업자등록번호, 폐기물 종류, 운반자, 처리업소명, 처리방법, 사업자도로명주소, 사업자지번주소, 데이터기준일 등의 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 충청북도 제천시의 사업장폐기물배출자 신고현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 12월 29일입니다. 담당부서는 제천시 안전건설국 자원순환과이며 문의주시면 최신의 충청북도 제천시 사업장폐기물배출자 신고현황을 열람하실 수 있게 도와드립니다.
