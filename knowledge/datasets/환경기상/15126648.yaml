summary_user: 기상청 전지구예보시스템(GDAPS)의 한국형수치예보모델(KIM)과 영국 통합모델(UM)이 일 4회 수행한 전지구 수치예측 결과를 격자 데이터 형태의 문자·숫자로 담는다. 기상 분석가나 연구자가 특정 시점·지역의 모델 예측값을 받아 중장기 기상 흐름을 확인하거나 자체 분석에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 격자 좌표나 같은 기관(기상청)의 코드 매핑으로만 이어 쓴다.
