description_portal: 전지구 날씨 예측, 날씨예보 등 목적으로  한국형수치예보모델(KIM)과 영국 통합모델(UM)을 기반으로 구축된 수치예보시스템으로 일 4회 예측을 수행합니다.(※ 기상청 API허브에서는 한국형수치예보모델과 UM모델의 격자데이터를 문숫자로 제공합니다.)전지구예보시스템(GDAPS, Global Data Assimilation and Prediction System)으로 현업 운영 중인 한국형수치예보모델(KIM, Korean Integrated Model)은 육면체구 격자 기반의 전지구모델로 분광요소법 기반 수치계의 비정역학 코어와 고해상도 모델에 적합한 물리과정으로 구성되어 있습니다. 육면체구 격자는 위경도 격자의 극 특이점 문제를 해결하고 격자 거리가 비교적 균일하도록 고안된 구면 격자입니다.
