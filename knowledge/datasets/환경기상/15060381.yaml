summary_user: 충청북도 증평군에서 사업장폐기물 배출자로 신고한 사업장을 한 건씩 담은 파일로, 상호·폐기물 종류·운반자·처리업소명·처리방법·사업장 도로명주소·신고년도를 사업장(신고) 단위로 기록한다. 증평군 내 특정 업체가 어떤 폐기물을 어느 운반자와 처리업소에 위탁해 어떤 방법으로 처리하는지 확인하려는 지자체 담당자나 폐기물 처리 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·도로명주소를 맞춰 붙이거나, 처리업소명으로 폐기물 처리업 허가 현황과 이름 기준으로 연결해 쓴다.
