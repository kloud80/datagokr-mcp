summary_user: 부산시 정수장(범어사·덕산·공업·명장·화명)별 상수도 생산량과 합계를 날짜(argDate) 단위로 담고, 포털 설명상 공업용수·원수·정수의 오늘의 수질 검사항목(pH, 탁도, 전기전도도, 총유기탄소 등)도 함께 제공한다. 시민이나 분석가가 "오늘 부산 화명정수장의 정수 탁도와 생산량은 어떤가" 같은 정수장별 수질·생산 현황을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 정수장 이름이나 날짜로 직접 맞춰 이어야 한다.
description_portal: 부산시 정수장별 상수도수질정보 및 수질통계 자료를 개방합니다.개방하는 데이터에는 부산의 생활용수 및 공업용수 생산량 현황, 오늘의 수질(공업용수), 오늘의 원수 수질, 오늘의 정수수질, 오늘의 정수 상세 정보 등이 포함되어 있습니다.생산량은 범어사, 덕산, 공업, 명장, 화명 생산량과 생산량 합계를 제공하고, 공업용수 오늘의 수질은 전기전도도, pH, 탁도, 알칼리도, 염소이온, 경도, 등의 검사항목이 있고, 원수 수질과 정수수질은 pH, 탁도, 암모니아성질소, 총유기탄소 등이 범어사, 화명, 덕산, 명장의 검사결과를 제공합니다.
