summary_user: 경상북도 영주시에서 실내공기질 관리 대상인 다중이용시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설구분·시설명·소재지·전화번호·데이터기준일자가 들어 있습니다. 시민이나 환경보건 담당자가 "영주시에서 실내공기질 관리를 받는 다중이용시설은 어디이고 어떤 종류인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 같은 기관(영주시) 자료끼리만 연결하며, 실내공기질 측정 자료와 이으려면 시설명·소재지를 직접 맞춰야 한다.
description_portal: 경상북도 영주시 다중이용시설 현황은 일정 규모 이상의 공공적 성격을 지닌 시설을 대상으로 실내 공기질을 관리하기 위하여 수집된 공공데이터 입니다.본 데이터는 시설명, 주소, 건축물 용도, 면적 등의 항목으로 구성되어 있습니다. 이를 통해 공공시설의 실내 환경 위생 수준을 체계적으로 관리하고 시민의 건강권 보호 및 환경보건 행정의 기반자료로 활용될 수 있습니다.특히 실내 공기질 측정 및 정기점검 이력, 관리 주체 분류, 지역별 분포 분석 등을 위한 행정 지원 도구 또는 공공서비스 기획 용도로서의 활용도가 높습니다.
