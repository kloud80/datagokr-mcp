summary_user: 기상청이 도로기상관측·레이더·위성·시정계 CCTV 등 관측자료를 융합해 5분 간격으로 만든 도로살얼음·도로가시거리 위험정보를 노드링크 형태로 담으며, 범위는 전국입니다. 운전자·내비게이션 사업자·도로관리기관이 '지금 이 도로 구간에 살얼음이나 시정 저하 위험이 있는가'를 확인하거나 도로전광판 경고를 띄우는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 노드링크 구간 이름·코드 매핑이나 기상청 내부 코드로만 연결하며, 같은 부문의 예보는 예보구역·격자(nx, ny) 기준이라 직접 키로 붙지 않는다.
description_portal: '도로기상관측자료, 레이더, 위성, 시정계 CCTV 등 기상청의 각종 관측자료를 분석.융합하여 5분 간격으로 격자형태의 도로살얼음.도로가시거리 위험정보를 생산하여 제공합니다. 생산된 정보는 도로운영과 네비게이션 서비스 체계에 맞게 노드링크 형태로 변환하여 기상청 API허브에 5분 간격으로 제공하며, 효율적 도로관리 지원을 위해 도로전광판(VMS) 위험정보 표출을 지원합니다. 사용자 편의성을 고려하여 관심/주의/위험 4단계로 제공합니다.- 도로살얼음: 관심(강우영역 4도 초과), 주의(어는비 주의, 강우영역 0~4도), 위험(어는비 위험, 강우영역 0도 이하)'
