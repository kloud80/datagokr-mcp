summary_user: 환경영향평가 대상 개발사업별로 공사 시와 운영 시의 이산화탄소·메탄·아산화질소·기타 온실가스 배출량(t CO₂eq, 운영 시는 연간)을 사업코드 단위로 담은 전국 범위의 파일 데이터다. 개발사업을 검토하는 분석가나 주민이 '이 사업은 공사 중과 운영 중에 온실가스를 얼마나 배출한다고 평가됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관이 내는 환경영향평가 협의 현황·사업구역 등 다른 항목별 평가정보와는 사업코드를 매칭해 이어 쓴다.
description_portal: 환경부 국립환경과학원이 제공하는 환경영향평가 관련 데이터는 특정 사업구역을 중심으로 조사된 온실가스 속성 정보를 기반으로 해당 지역의 온실가스 특성을 정량적으로 파악할 수 있도록 지원하는 서비스로, 공사 시 이산화탄소(t CO₂eq), 메탄(t CO₂eq), 아산화질소(t CO₂eq), 기타 온실가스 배출량(t CO₂eq)과 함께 운영 시 이산화탄소(t CO₂eq/년), 메탄(t CO₂eq/년), 아산화질소(t CO₂eq/년), 기타 온실가스 배출량(t CO₂eq/년) 등의 상세정보를 제공하는 서비스를 제공합니다.
