description_portal: 본 데이터는 환경책임투자 관련 주요 보고서 및 백서를 분야별로 정리한 목록 정보를 제공하는 공공데이터입니다. 총 7개 필드("순번", "분야", "파일번호", "발행연도", "발행기관명", " 보고서 제목", "태그(보고서 관련 주요 키워드)")를 포함하며, 다양한 환경경영·투자 관련 보고서의 발 행 현황과 주요 키워드를 체계적으로 확인할 수 있습니다. 연구자는 최신 이슈와 동향 분석을 위한 자료 인덱싱에 활용하고, 투자자는 ESG 투자 전략 수립 및 보고서 참조, 정책담당자는 정책 근거 자료 탐색 및 대외 홍보 자료로 활용할 수 있습니다. 또한 보고서별 주요 내용 요약, 기관별 발행 추세 분석, 키워드 기반 문헌 검색 시스템 구축에도 유용합니다.
