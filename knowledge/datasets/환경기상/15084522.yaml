description_portal: 대전광역시시설관리공단에서 운영 중인 정수원의 화장로 10개에서 대기중으로 방출되는 물질의 오염정도를 측정한 데이터입니다. 측정항목 및 기준은 염화수소(10ppm이하), 먼지(15mg/㎥ 이하), 황산화물(20ppm 이하), 질소산화물(60ppm 이하), 일산화탄소(80ppm 이하), 매연(링겔만비탁표 2도 이하) 입니다. 정수원의 주소는 대전광역시 서구 계백로 1249번길 174-82 이며 체육, 환경, 복지, 기반 중 복지시설에 해당됩니다. 화장로 대기배출오염물질 측정농도 데이터 기준일은 2025년 7월 1일 입니다. 추가로 필요하신 사항이 있다면 공공데이터 담당자(042-610-2746)에게 문의하여 주시기 바랍니다.
