description_portal: 법정지정관리종목록은 국내 생물다양성 보전과 야생동식물의 보호를 위해 기후에너지환경부에서 지정 및 관리하는 종들의 목록입니다. 이는 멸종위기생물 보호, 생태계 유지, 자연자원의 지속가능한 이용을 목표로 합니다. 법정지정관리종목록은 여섯 가지 카테고리로 분류됩니다. 국제적멸종위기종은 CITES에 등재된 종들로 국제협약에 따라 거래가 규제됩니다. 멸종위기야생생물은 자연적 또는 인위적 위협요인으로 개체수가 크게 줄어들어 멸종위기에 처한 야생생물 또는 멸종위기에 처할 우려가 있는 야생생물로 정의될 수 있습니다. 생태계위해우려생물은 생태계에 유출될 경우 위해를 미칠 우려가 있어 관리가 필요한 생물을 의미하며, 유입주의생물은 국내에 유입될 경우 생태계에 위해를 미칠 우려가 있는 생물을 의미합니다. 생태계교란생물은 생태계에 미치는 위해가 큰 것으로 판단되어 지정고시된 생물을 의미하며, 국외반출승인대상종은 생물다양성의 보전을 위하여 보호할 가치가 높은 생물자원으로서 지정고시된 생물을 의미합니다. 법정지정관리종목록 데이터에는 등급, 학명, 분류군 정보 등이 포함됩니다.
