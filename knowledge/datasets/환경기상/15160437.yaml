description_portal: 본 데이터는 강원특별자치도 속초시 관내 낚시통제구역 지정 현황에 관한 자료이다. 제공 항목에는 통제구역명, 지정범위(대상지역), 지정일자, 관계법령, 데이터기준일자 등이 포함되어 있으며 낚시행위가 제한되는 구역 정보를 확인할 수 있다. 시민과 관광객은 안전한 낚시 활동과 관련 법규 준수를 위해 활용할 수 있으며, 행정기관은 수산자원 보호, 안전사고 예방 및 해양환경 보전을 위한 기초자료로 활용한다. 또한 통제구역의 지정 현황을 파악하여 해양 이용 질서 확립과 불법행위 예방에 활용할 수 있다. 본 데이터는 민원신청에 의한 1회성 데이터이다.
