summary_user: 변산반도국립공원 안에서 조사된 생물종 출현 기록을 담은 파일로, 한 행마다 생물분류(포유류·조류·곤충·식물 등), 국문 종명과 학명, 조사위치·주소, 경도·위도 좌표, 조사일자, 개체수가 들어 있는 건별 조사 자료이다. 연구자나 공원 관리자가 "변산반도국립공원의 어느 지점에서 어떤 멸종위기종이나 주요 종이 언제 몇 개체 관찰됐나"를 확인하고 종 분포 지도를 그리는 데 쓴다. 실측 컬럼에는 다른 데이터와 이어 붙일 전역 조인 키가 없다. 그래서 학명·종명을 다른 생물종 목록과 이름으로 맞추거나, 경도·위도를 다른 공간 레이어(국립공원 용도지구, 보호구역 등)와 위치로 겹쳐 연결한다.
limits: 공통 코드나 키가 없어 다른 데이터와는 종명·학명 문자열 매칭이나 좌표 중첩으로만 이을 수 있다. 범위 메타정보는 '전국·비공간'으로 표기돼 있지만, 실제 내용은 변산반도국립공원 한 곳의 조사 기록이다. 포털 설명에 '오대산국립공원'이라는 문구가 섞여 있으니 대상 공원을 혼동하지 않도록 주의한다.
