summary_user: 제주특별자치도 관측소별로 하루 단위 기상 값을 담는다. 평균·최저·최고기온과 그 발생 시각, 일강수량, 최대·평균풍속과 최대풍속의 풍향·시각이 들어 있다. 농가나 보험·관광 분석가가 '특정 날짜에 제주의 어느 관측소에서 비가 얼마나 왔고 바람이 얼마나 셌나'를 확인하는 데 쓰고, 기후·농업·보험 분석의 원천으로도 쓴다. 전역 조인 키가 없어서 다른 데이터와는 관측소명(observatoryName)을 이름으로 맞추거나 날짜(baseDate)를 기준으로 붙여 쓴다.
