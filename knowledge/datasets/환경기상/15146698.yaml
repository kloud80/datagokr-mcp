description_portal: 환경책임보험 해양시설 관련 정보 관리를 위해 설계된 데이터 구조로, 해양 오염사고 발생 가능성이 있는 주요 시설에 대한 관리와 보험가입 여부를 체계적으로 기록·추적하는 데 활용됩니다.매체시설코드는 개별 해양시설을 식별하는 기본 키 역할을 하며, 동일 사업장 내에서도 시설별로 구분 관리가 가능합니다.시설구분코드와 시설세부이용용도내용은 해당 시설이 항만, 저장소, 선박 관련 시설 등 어떤 유형이며 어떤 구체적 용도로 운영되는지 나타냅니다.저장물질내용 및 시설용량은 해당 시설에서 취급하거나 저장하는 물질과 그 규모를 기록하여, 해양오염 발생 시 피해 규모를 예측하는 근거 자료로 사용됩니다.오염비상계획서작성대상여부는 법령에 따라 해당 시설이 사전 대응계획서를 의무적으로 작성해야 하는지 여부를 구분하며, 기름 및 유해액체물질 저장용량과 오염비상계획서작성대상지정수량배수는 위험도 평가와 의무대상 판단 기준으로 활용됩니다.삭제여부, 폐업일자, 시설상태코드는 현재 시설의 운영 여부, 폐업 처리, 상태(정상/휴업/미가동 등)를 관리하는 항목입니다.보험가입대상코드는 해당 시설이 환경책임보험 의무가입 대상인지, 예외 대상인지 구분하는 핵심 정보입니다.정보승인상태코드는 입력된 시설 정보가 최종적으로 검증·승인되었는지 관리하는 컬럼이며, 연도는 해당 데이터가 적용되는 기준 시점을 나타냅니다.이 데이터는 해양 오염사고 발생 시 피해 확산을 최소화하기 위한 사전 관리와 보험제도 적용의 근거 자료로 활용되며, 행정기관은 이를 기반으로 위험시설 파악, 책임보험 가입 현황 점검, 정책 통계 산출 등을 수행합니다.
