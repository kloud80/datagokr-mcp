description_portal: '본 데이터는 ‘한반도의 생물다양성’ 시스템을 통해 제공되는 국가가 지정·관리하는 주요 생물종 정보로, 환경부 및 관계 부처가 관련 법령 및 정책에 따라 선정한 생물군에 대한 통합 정보를 담고 있습니다. 생물다양성 보전, 생물주권 보호, 기후변화 대응 등을 위한 정책적·생태학적 기준에 근거한 생물종 목록 및 현황을 제공합니다.국가 지정 관리 생물종은 다음과 같이 분류되며, 각 항목별 법령, 지정 기준, 관련 데이터 파일 및 참고 자료집이 함께 제공됩니다:🗂️ 주요 관리 대상 생물종 범주국가보호종환경부 지정 멸종위기 야생생물 I·II급해양수산부 지정 보호대상 해양생물관련 법령: 「야생생물 보호 및 관리에 관한 법률」, 「해양생태계의 보전 및 관리에 관한 법률」환경부 지정관리종국외반출 승인대상종, 수출입 허가대상종, 수렵 가능종 등CITES(국제 멸종위기종 거래협약)와 연계된 국내 지정종 포함관련 법령 및 고시별 종목록 제공기후변화 생물지표종기후변화에 민감하게 반응하는 종으로 구성지표종 선정 이유, 생태적 특성, 모니터링 결과 등 포함적색목록(Red List)생존 위협 수준에 따라 위기범주(EN, VU, CR 등)로 구분IUCN 기준을 적용한 국내 버전고유종대한민국에만 서식하는 특산 생물종생물주권 보전 및 산업적 가치 확보를 위한 관리 대상K-BON (Korean Biodiversity Observation Network)장기 생물다양성 관측을 위한 지정 생물군관측 지점 및 대상종 현황, 데이터 수집 프로토콜 등 포함이 정보는 교육·연구·정책수립·환경영향평가 등 다양한 분야에서 활용 가능하며, 종별 상세 정보와 관련 법령 자료집(PDF), 검색 기능, 고시문 요약 등이 ‘한반도의 생물다양성’ 웹사이트(https://species.nibr.go.kr)에서 제공됩니다.'
