summary_user: "경기도 이천시 관내에서 실내공기질 관리법 적용을 받는 다중이용시설을 시설 한 곳당 한 행으로 담은 파일(csv)로, 시설구분·시설명·도로명/지번주소·전화번호·연면적·객석·병상 수·위도·경도·데이터기준일자를 포함한다. 이천시 환경·보건 담당자나 분석가가 '관내 어떤 유형의 다중이용시설이 어디에 얼마나 큰 규모로 있어 실내공기질 점검 대상이 되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시설명·주소로 매칭하거나 위도·경도 좌표로 다른 위치 데이터(예: 대기질 측정소 위치)와 공간적으로 겹쳐 쓴다."
limits: 실내공기질 측정값 자체는 없고 관리 대상 시설의 목록·위치·규모만 담는다. 범위는 이천시 한 곳이며, 표준 코드 키가 없어 다른 데이터와는 이름·주소·좌표 매칭으로만 연결된다.
