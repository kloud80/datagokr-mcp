summary_user: 해양환경공단이 운영하는 해양수질자동측정망 중 낙동강 명지 해역 정점의 수온·염분·용존산소·수소이온농도·탁도·전기전도도·클로로필 자동측정값을 관측일자별 시계열로 담은 CSV 파일(약 0.9MB)이다. 연구기관·지자체 담당자가 낙동강 하구 명지 해역에서 염분이나 용존산소가 언제 급변했는지 확인하는 질문에 쓴다. 전역 조인 키는 없어서 정점코드·정점명을 다른 해양수질자동측정망 정점 파일과 맞추거나 관측일자로 기상·하천 유량 자료와 이어 쓴다.
