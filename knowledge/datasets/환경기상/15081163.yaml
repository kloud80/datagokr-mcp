summary_user: 경상남도 창녕군에 사업장폐기물 배출을 신고한 사업장을 건별로 담은 파일로, 신고기준연도·상호·폐기물 구분과 종류·운반자·처리업소명·처리방법이 한 줄에 들어 있다(CSV 약 6KB 규모). 창녕군에서 어떤 사업장이 어떤 폐기물을 배출해 누구에게 운반·처리를 맡기는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 상호나 처리업소명 같은 이름을 맞추거나 같은 기관 자료끼리 이어 쓴다.
limits: 사업자번호 같은 공통 식별 키가 없어서 다른 폐기물 처리업 허가 자료와 정확히 매칭하기 어렵고, 이름 대조에 의존해야 한다. 창녕군 한 시군구만 다루며 폐기물 발생량이나 처리량 같은 통계는 담지 않는다.
