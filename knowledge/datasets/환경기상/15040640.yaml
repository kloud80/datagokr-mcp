description_portal: 본 데이터는 경기도 수원시 관내에 설치된 빗물이용시설에 대한 상세 정보를 제공합니다. 주요 항목으로는 집수면적, 저장용량, 설치연도, 설치 구분(공공·민간 등), 사용 용도(조경, 청소, 화장실 용수 등) 등이 포함되어 있으며, 수원시의 물관리 인프라 현황을 종합적으로 파악할 수 있는 기초자료입니다.빗물이용시설은 최근 기후위기 심화, 물부족 및 도시홍수 문제, 지속가능한 물순환 체계 구축 등의 이슈와 밀접한 연관이 있으며, 특히 도시침수 예방 및 강우 유출 저감을 통한 기후변화 적응형 도시계획 수립에 중요한 역할을 하고 있습니다. 또한 탄소중립 실현, 녹색 인프라 확충, ESG(환경·사회·지배구조) 기반의 환경정책 수립 등 다양한 사회적 흐름에 따라 빗물 자원의 효율적 활용이 강조되고 있습니다.
