summary_user: 인천 서구(서해구) 관내에서 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 명부로, 상호·사업장주소·데이터기준일자만 들어 있다. 지역 환경 담당자나 분석가가 "우리 동네 어느 사업장이 폐기물 배출자로 신고돼 있나"를 확인하거나 배출 사업장의 분포를 지도에 올려 볼 때 쓴다. 사업자번호 같은 전역 조인 키는 없으므로, 다른 처리업·배출자 자료와는 상호와 주소를 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 사업장의 폐기물 배출자 신고현황을 정리한 자료입니다. 본 공공데이터는 각 사업장의 상호명과 사업장 주소, 데이터 기준일자가 포함되어 있습니다. 본 데이터는 폐기물 관리 및 배출 실태를 파악하고 환경정책 수립의 기초자료로 활용될 수 있을것으로 판단됩니다. 이를 통해 지역 내 폐기물 발생현황을 분석하고 적정한 처리 방안 마련하는 데 기여할 수 있을것으로 판단됩니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
