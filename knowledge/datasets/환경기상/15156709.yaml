summary_user: 한국서부발전 설비(태양광 발전 설비로 보이는 모듈 온도·경사면 일사량 포함)가 위치한 곳의 기상 관측값을 설비 아이디와 측정 시각 단위로 담은 건별 관측 API로, 환경 온도·모듈 온도·풍향·풍속·강수량·습도·경사면/수평면 일사량과 설비 상태·알람 정보를 제공한다. 발전량 분석가나 에너지 사업자가 '특정 설비 위치의 일사량과 모듈 온도가 시간대별로 어떻게 변했고 장비 이상은 없었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 기상청 관측지점 자료 등과는 설비 아이디(eqpm_id)·측정 시각을 기준으로 이름·위치 매핑을 거치거나 같은 기관 자료끼리만 연결한다.
description_portal: 한국서부발전에서 제공하는 기상관측 정보 조회 서비스는 설비 아이디, 측정시간, 설비상태코드, 알람상세, 환경온도, 모듈온도, 풍향, 풍속, 강수량, 습도, 경사면 일사량, 누적경사면 일사량, 수평면 일사량, 누적수평면 일사량, 로컬 시간으로 구성됩니다. 이 데이터는 설비가 위치한 환경의 기상 조건을 기록하며, 온도, 풍향, 풍속, 강수량, 습도, 일사량 등 기상 요소를 측정합니다. 설비상태코드와 알람상세는 관측 장비의 운전 상태와 이상 여부를 확인하는 데 사용됩니다. 측정시간과 로컬 시간 정보를 통해 각 관측 값의 시점을 파악할 수 있습니다.
