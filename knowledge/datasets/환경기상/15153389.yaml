summary_user: 환경부가 발령한 황사주의보 내역을 행정안전부 재난안전데이터 공유플랫폼을 거쳐 제공하는 건별 발령 정보로, 발령일(APNT_DAY)·발령 차수·발령 지역을 담고 범위는 전국이다. 주민이나 지자체 담당자가 특정 날짜에 어느 지역에 황사주의보가 내려졌는지, 한 해에 몇 차례 발령됐는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 대기질 데이터와는 지역명이나 날짜를 맞춰서만 이을 수 있다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하고 있는 황사주의보 발령 내역 관련 정보입니다.
