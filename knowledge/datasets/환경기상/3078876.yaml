summary_user: 고양시가 토양오염 우려가 있어 관리하는 특정토양오염관리시설(주유소·기름 저장시설·유해화학물질 저장시설 등)을 시설 한 곳당 한 행으로 담은 목록 파일로, 상호·대표업종·도로명/지번 주소·관리기관과 전화번호를 담는다. 토지를 사거나 개발하려는 사람, 환경 분석가가 '이 필지 주변에 토양오염 우려 시설이 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소를 지오코딩하거나 상호·주소 문자열을 맞춰 다른 환경 규제 레이어나 사업장 데이터와 연결한다.
description_portal: 경기도 고양시 특정토양오염 시설현황에 대한 데이터로 상호, 대표업종, 주소, 관리기관명, 관리기관 전화번호 등의 항목을 제공합니다. 이 자료는 「토양환경보전법」 제11조 및 관련 규정에 따라 관리되고 있는 특정토양오염관리시설의 목록을 국민에게 공개하기 위한 것입니다. 특정토양오염관리시설이란 기름 저장시설, 주유소, 유해화학물질 저장시설 등 토양에 오염을 유발할 수 있는 시설로, 일정 기준 이상 규모이거나 오염 가능성이 높은 시설을 말합니다. 이러한 시설을 지정·관리하며, 토양오염사고를 예방하고 사후 조치를 효과적으로 수행하기 위해 정기적인 점검과 관리가 이루어집니다.
