summary_user: 부산광역시 7개 지역 35개 지점에서 측정한 환경소음(dB)을 분기별로 담은 측정 결과 자료로, 측정연도·분기(inspecYy, inspecQt), 측정지역·지점, 주간·야간 평균 소음과 환경기준 초과 여부를 담는다. 시민이나 분석가가 '우리 동네 측정지점의 야간 소음이 환경기준을 넘었는지, 분기별로 어떻게 변했는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 측정지역·지점 이름을 매핑하거나 같은 기관(부산광역시) 자료끼리 이어 써야 한다.
limits: 행정구역 코드나 좌표 같은 전역 조인 키가 없어 다른 데이터와 자동으로 연결되지 않으며, 지역·지점 이름으로 직접 매핑해야 한다. 범위가 부산 한 시도이고 비공간 자료라 지도 분석에는 좌표를 따로 붙여야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
