description_portal: 1. 부산광역시 7개지역 35개지점의 분기별 환경소음(dB) 측정 결과 정보(분기별 제공)2. 부산광역시 환경소음 정보는 도시 내 다양한 생활환경에서 발생하는 소음을 체계적으로 관리하기 위해 구축된 자료로, 측정지역, 측정지점, 측정시간 및 환경기준 초과여부에 대한 데이터를 포함한다. - 측정지역은 인구수, 면적 등을 고려해 선정되며, 각 지역 내 주요 지점에 소음측정기를 설치하여 주간과 야간으로 나누어 지속적으로 소음을 측정한다.  - 이렇게 수집된 데이터는 환경기준을 초과하는지 여부를 판별한다.  - 궁극적으로는 시민의 건강과 삶의 질을 보호하고 쾌적한 생활환경을 조성하는 데 기여한다.
