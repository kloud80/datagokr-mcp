description_portal: '본 데이터는 전북특별자치도 순창군 생활폐기물(쓰레기) 중  음식물  쓰레기 연도별  배출량(2015년~2020년)을 집계한 데이터로,  연도별 음식물쓰레기 베출량(t)을 제공합니다. 음식물 쓰레기는 분리배출 대상 중 하나로 처리 과정에서 에너지 회수 또는 퇴비화 등 자원화가 가능하므로, 발생량의 지속적 모니터링은 환경보호와 직결됩니다. 데이터는 csv형식의 파일로 제공됩니다.활용 사례로는 환경정책 수립 : 쓰레기 발생량에 따라 분리수거 강화 등 지역별 대응 가능, 배출량 분석 : 연도별 배출량 분석, 행정업무 지원 : 청소 인력 배치, 시설 확충 등의 근거자료가 있습니다.'
