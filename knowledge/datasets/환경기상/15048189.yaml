description_portal: '제주특별자치도 내에 위치한 철새도래지 데이터를 제공합니다.항목: 장소, 공유수면 면적, 육상 면적, 도래철새*「자연환경보전법 시행령」 제27조 제1항 ""생태·자연도 작성지침""- ""철새도래지""란 계절에 따라 철새가 정기적으로 찾아와 서식하는 지역으로 겨울철조류동시센서스가 수행되는 지역 등을 말한다. - 겨울철조류도시센서트: 국립환경과학원에서 매년 겨울 전국적으로 실시하는 조류 동시 조사- 최근 5년간 철새가 5천 마리 이상 도래하면서 멸종위기야생생물인 조류가 평균 2종 이상 도래하는 철새도래지 내 습지를 생태·자연도 권역으로 지정하여 관리한다.'
