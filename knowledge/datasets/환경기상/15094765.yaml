summary_user: 충청북도 증평군 관내 음식물류폐기물 다량배출사업장(연면적 200㎡ 이상 일반음식점, 하루 급식인원 100명 이상 집단급식소 등)을 사업장 한 곳당 한 행으로 담은 파일로, 상호·신고일자·주소·업소구분·급식인원·면적·객실수·배출량이 들어 있다. 증평군에서 어떤 음식점·급식소가 음식물쓰레기 다량배출자로 신고돼 있고 어디에 있는지 확인하려는 주민, 수거·재활용 업체, 자원순환 정책 담당자가 쓴다. 사업자등록번호(bizno)로 사업자 상태 조회나 다른 인허가·영업 데이터와 잇고, 도로명·지번 주소로 지도나 다른 지자체의 같은 이름 파일과 붙여 쓴다.
limits: 증평군 한 곳만 담은 시군구 단위 파일이라 다른 지역과 비교하려면 지자체별 파일을 따로 모아야 한다. 사업장별 배출량 칸은 있지만 군 전체 발생량·처리현황 통계를 담은 자료가 아니다.
