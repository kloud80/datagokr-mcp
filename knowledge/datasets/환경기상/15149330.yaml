description_portal: 매년 전국오염원조사 실시 기간 중 시스템을 이용하여 제출한 지자체(시도 및 시군구)를 기준으로 제출현황을 조사함.제출현황은 제출완료, 제출중, 미제출 등으로 구분되며, 제출현황을 각 지자체 별로 조회가 가능함.전국 시도와 시군구의 전국오염원조사 대상인 시설들 중에서 축산계, 양식계, 매립계, 환경기초시설의 오염원은 모든 지역에 해당 시설이 존재하지 않아 조사 대상 제외이므로 해당 지역들은 시스템에서 제출현황 파악 시 제외시키기 위한 기능을 설정한 테이블로 해당 테이블 내에는 제외 지역인지 아닌지에 대한 여부가 작성되어 있으며 해당 오염원과 지역을 확인할 수 있는 정보가 포함된 데이터임.
