summary_user: 환경영향평가 대상 사업구역(사업코드)별로 주변 시군구·읍면동의 연도별 남녀 인구수, 총 가구수, 총 주택수, 주택보급률을 담은 전국 범위의 파일 데이터다. 개발사업을 검토하는 분석가나 주민이 '이 사업구역 주변 동네의 인구·가구 규모와 주택보급률은 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 사업코드로 같은 기관의 다른 환경영향평가 데이터(협의 현황·사업구역 등)와 잇고, 행정구역은 시군구읍면동 명칭을 이름으로 맞춰 연결한다.
description_portal: 환경부 국립환경과학원에서 제공하는 환경영향평가 관련 특정 사업구역을 중심으로 예측 및 조사된 인구와 주거 속성 정보를 통해 해당 지역의 인구·주거 특성을 파악할 수 있게 하며, 인근 지역의 개발 현황(건수), 사업코드, 사업 후 상근인구, 사업 후 이용인구, 사업 후 주택계획인구 등을 조회할 수 있고, 환경영향평가 대상 사업구역을 기준으로 조사된 주택보급률(%), 환경영향평가 사업코드, 년도, 남녀별 인구수 및 전체 인구수, 총 가구수(가구), 총 주택수(호), 데이터 기준년도 배열, 시군구읍면동 명칭 등의 세부 정보를 함께 데이터를 제공하는 서비스 입니다.
