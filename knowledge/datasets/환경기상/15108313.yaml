description_portal: '「월출산국립공원 서식환경 현황」 데이터는 월출산국립공원 내 주요 생태계의 서식지 분포와 환경특성을 종합적으로 나타낸 자료입니다. 주요 구성 항목은 식생 유형, 야생동식물 주요 서식지, 토양 특성, 수계 분포 등이며, 생물다양성 보전과 자연자원 관리계획 수립에 활용됩니다. 해당 데이터는 국립공원공단의 생태조사 결과를 기반으로 정기적으로 갱신되며, 공간정보(GIS) 형태로 제공되어 국립공원 관리 및 연구, 생태계 서비스 분석, 환경영향평가 등의 기초자료로 이용됩니다. 또한 보호종 서식현황 및 생태축 연결성 분석 등 생태적 의사결정에 필요한 핵심 정보를 포함하고 있어, 공원 내 주요 의사결정 지원에도 기여하고 있습니다.데이터 생성 년도 기준의 월출산국립공원 내 서식환경 현황에 대해 다음과 같은 정보를 제공합니다.- 국립공원, 환경분류, 서식환경, 경도, 위도* 서식환경 : 이용환경 및 자연환경으로 구분되는 서식지환경은 식생, 점오염원, 비점오염원, 로드킬구간, 생태통로 및 훼손지 등이 있음'
