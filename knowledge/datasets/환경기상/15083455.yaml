summary_user: 광주광역시 북구에 있는 폐수배출시설과 대기오염배출시설 업소를 사업장 한 곳씩 담은 목록 파일로, 사업장명·주소·업종·종구분(1~5종)과 데이터기준일을 담는다. 주민이나 분석가가 '우리 동네 주변에 대기오염·폐수 배출량 규모가 큰 1·2종 사업장이 어디 있는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소를 직접 맞춰 보거나 같은 기관 자료끼리만 연결한다.
description_portal: '광주광역시 북구의 폐수배출시설 및 대기오염배출시설 현황입니다. 사업장명, 주소, 업종, 종구분 데이터를 제공합니다.* 폐수 배출 시설 종 구분 - 1종: 1일 폐수배출량 2,000㎥ 이상 - 2종: 1일 폐수배출량 700㎥ 이상 2,000㎥ 미만 - 3종: 1일 폐수배출량 200㎥ 이상 700㎥ 미만 - 4종: 1일 폐수배출량 50㎥ 이상 200㎥ 미만 - 5종: 1~4종에 해당하지 않는 시설* 대기 오염물질 배출 시설 종 구분 - 1종: 연간 대기오염물질 배출량 합계 80톤 이상 - 2종: 연간 대기오염물질 배출량 합계 20톤 이상 80톤 미만 - 3종: 연간 대기오염물질 배출량 합계 10톤 이상 20톤 미만 - 4종: 연간 대기오염물질 배출량 합계 2톤 이상 10톤 미만 - 5종: 연간 대기오염물질 배출량 합계 2톤 미만'
