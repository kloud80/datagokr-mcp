summary_user: 서울 강서구에 등록된 환경전문공사업체를 사업장 한 곳당 한 행으로 담은 인허가 원장이다. 담는 항목은 관리번호, 인허가일, 영업상태와 상세 영업상태, 폐업일·휴업 기간, 소재지 주소, 좌표, 실험실 면적 등이며, 범위는 시군구 단위다. 강서구에서 지금 영업 중인 환경전문공사업체가 어디에 있는지, 언제 등록하거나 폐업했는지 확인하려는 사업자나 분석가가 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으므로, 다른 자료와 이으려면 사업장명·주소를 맞춰 보거나 같은 기관 코드(OGDP_INST_CD)와 관리번호로 다른 지자체 인허가 자료와 연결한다.
description_portal: 서울시 강서구 내 환경전문공사업체의 인허가 현황을 기록한 자료로, 관리번호, 인허가 일자, 취소 일자, 영업상태, 상세 영업상태 등의 항목을 포함합니다. 환경전문공사업은 대기오염방지시설, 수질오염방지시설, 소음·진동방지시설 등 환경 관련 설비를 설치·운영하는 업종으로, 지역 내 환경 관리와 공공 안전에 중요한 역할을 합니다. 본 자료를 통해 강서구 내 환경전문공사업체의 등록, 변경, 취소 현황을 체계적으로 파악할 수 있으며, 지역 환경산업의 발전 수준과 정책 효과성을 분석하는 데 활용될 수 있습니다. 또한 영업상태 변화를 기반으로 환경 관련 기업의 지속 가능성, 법규 준수 여부, 정책 지원 필요성 등을 평가할 수 있어 환경정책 수립과 산업 관리의 기초 자료로 의미가 있습니다.
accrual_periodicity: 수시
