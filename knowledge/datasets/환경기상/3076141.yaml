summary_user: 전남광주통합특별시 대기중금속측정망 6개 지점(건국동·노대동·농성동·두암동·서동·평동)에서 2026년 7월 6~10일 하루 24시간씩 5회 채취한 PM10 시료의 중금속 12종(납·카드뮴·크롬·비소 등) 분석 결과를 지점·일자별로 담은 소규모 CSV 파일(3,306바이트)입니다. 주민이나 환경 분석가가 "우리 동네 측정 지점의 공기 중 납·카드뮴 농도가 다른 지점보다 높은가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 지점명과 일자를 기준으로 같은 지역 측정소의 미세먼지 자료나 다른 시기 중금속 조사 파일과 이름을 맞춰 이어 쓴다.
description_portal: 본 자료는 전남광주통합특별시 대기중금속측정망 6개소에서(건국동, 노대동, 농성동, 두암동, 서동, 평동) 2026년 7월 6일부터 10일까지  24시간씩 5일간 5회 채취하여 분석한 결과입니다.시료채취는 고용량공기시료채취기를 이용하여 PM10 입자를 유리섬유 여과지에 포집하였습니다.전처리는 대기오염공정시험기준에 따라 여과지를  산처리하였으며, ICP-OES를 사용하여 대기중 중금속 12종(Pb, Cd, Cr, Cu, Mn, Fe, Ni, As, Be, Al, Ca, Mg)을  분석하였습니다.자세한 분석방법은 "환경분야 시험ㆍ검사 등에 관한 법률"  제6조(환경오염공정시험기준)를 참고하시기 바랍니다.
