summary_user: 대구광역시 북구 안에서 사업장폐기물을 배출하는 사업장을 한 행씩 담은 원장 파일로, 상호명·사업장 주소와 함께 폐기물 구분·종류·처리방법·신고기준년도를 개별 사업장 단위로 기록한다. 북구의 어느 사업장이 어떤 종류의 폐기물을 내고 어떻게 처리하는지 확인하려는 주민·처리업체·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 사업장 주소를 맞춰 잇거나 같은 기관 자료끼리 연결한다.
limits: 사업자번호 같은 공통 식별 키가 없어 다른 기관 데이터와 정확히 매칭하기 어렵고, 주소·상호명 매칭에 의존한다. 범위는 대구 북구 한 시군구이며, 폐기물 발생량이나 처리현황 통계를 담지 않는다.
