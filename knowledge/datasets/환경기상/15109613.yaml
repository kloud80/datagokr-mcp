summary_user: 경상북도 울진군 관내에서 대기배출시설 허가·신고를 한 업체 중 부생연료유 1호·2호를 쓰는 업체를 업체별로 담은 소규모 파일(CSV 445바이트)로, 업체명·주소·전화번호·사용연료·연간 사용량(리터)·기준일자를 담는다. 울진군에서 어느 업체가 부생연료유를 얼마나 쓰는지 확인하려는 대기 배출원 점검 담당자나 연료전환 현황을 보는 분석가가 쓴다. 사업자번호 같은 전역 조인 키가 없어서 다른 배출시설·사업장 데이터와는 업체명이나 주소를 맞춰 대조해야 한다.
description_portal: 경상북도 울진군 관내 대기배출시설허가 또는 신고한 업체 중 연료를 부생연료유1호 및 부생연료유2호(C9+, C9 Aromatic)를 사용하는 업체에 대한 정보(업체명, 주소, 전화번호, 사용연료, 연간사용량)로 구성된 데이터 입니다.대기환경보전법에 규정하는 대기배출시설 허가 및 신고 대상이 되는 업체에 대한 자료로 신고대상 미만의 시설에 대하여는 제외되었음을 알려드립니다.기후위기에 따른 탄소중립을 위한 연료전환에 따른 부생연료유 사용 시설이 감소하는 추세에 따라 울진군 관내 업체도 줄어들고 있는 실정입니다.
