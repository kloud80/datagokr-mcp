summary_user: 경기도 내 물놀이형 수경시설별로 점검일자·점검기관과 함께 pH·탁도·대장균·유리잔류염소 측정값, 기준 초과 시 원인과 조치사항을 담은 점검 건별 결과 자료다. 어린이공원이나 도심 물놀이터를 이용하는 보호자, 지자체 담당자가 "우리 동네 바닥분수의 최근 수질 점검이 기준에 맞았는지, 초과 시 어떤 조치를 했는지"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)이나 시설명·주소를 이름 매칭해 다른 경기도 시설·수질 자료와 연결한다.
description_portal: 이 데이터는 물놀이형 수경시설의 수질 및 위생 관리 실태를 점검한 결과를 정리한 자료로, 각 수경시설의 위치와 명칭, 점검일자, 점검기관, 수질 항목별 측정값(PH, 탁도, 대장균, 유리잔류염소) 및 점검결과(적합 여부)로 구성되어 있습니다. ‘PH(5.8~8.6)’, ‘탁도(4NTU 이하)’, ‘대장균(200개체수/100mL 미만)’, ‘유리잔류염소(0.4~4.0mg/L)’ 등은 관련 법적 수질 기준에 따른 항목이며, 수질 기준을 초과한 경우 ‘초과원인및조치사항’ 항목에 조치내용이 기록됩니다. 본 데이터는 어린이 공원이나 도심 내 물놀이 시설 이용자의 위생안전 확보를 위한 점검 목적의 자료로, 수질 안전성을 확보하고 적절한 관리 여부를 평가하는 데 활용됩니다.
