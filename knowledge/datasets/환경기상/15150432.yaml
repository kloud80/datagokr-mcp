description_portal: '본 데이터는 기상청 기상자료개방포털(https://data.kma.go.kr)에서 제공하는 정규기상대(ASOS)의 풍향, 풍속, 온도, 습도, 기압, 일조, 일사, 강수 등 종관규모 단위의 기상 측정 자료입니다.대기오염현상 분석 및 원인 규명을 위해 활용되는 기상자료이며, 기상대지점코드 컬럼의 S항목은 종관기상대(ASOS)를 의미합니다.종관규모는 보통의 고기압이나 저기압의 공간적 크기 및 수명을 의미하며, 주로 매일의 날씨 현상을 다룰 때 사용됩니다.* 종관기상관측이란 종관규모의 날씨를 파악하기 위하여 정해진 시각에 모든 관측소에서 같은 시각에 실시하는 지상 관측을 의미* 대기질 농도 데이터와 연계 분석을 위하여 일부 데이터 형식을 수정하였으며, 기상 자료에 대한 원시 자료는 기상청 기상자료개방포털에서  참고* 단위 : 풍향(degree), 풍속(m/s), 온도(C), 습도(%)'
