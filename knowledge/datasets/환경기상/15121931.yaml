description_portal: 본 자료는 한국수자원공사가 관리·분석한 소수력 잠재 발전 가능량 정보를 분석하기 위한 데이터입니다. 소수력발전은 하천, 용수로, 댐 방류 등 비교적 소규모 유량을 활용하여 전력을 생산하는 친환경 재생에너지 형태로, 탄소중립 시현과 분산형 전원 확대에 기여합니다. 이를 통해 소수력발전 신규 부지 발굴, 사업 타당성 검토, 발전량 예측, 전력계통 계획 수립 등에 활용이 가능합니다. 또한 데이터는 표준화된 형식으로 구축되어 있어 GIS 분석, 에너지 시나리오 작성, 환경영향 평가 등 다양한 연구 및 정책 수립에 적용할 수 있습니다. 해당 자료는 수자원과 에너지 자원의 효율적 활용을 촉진하고, 지속가능한 전력 공급 기반 마련을 위한 기초 정보를 제공합니다.*1차 방정식 형태의 소수력 에너지 잠재량 자료 (소수력발전량=중력가속도(9.8)*유량(fw) * 낙차(1.5) * 효율(0.7) * 24 * 30)*상세 내용은 아래의 URL을 참고 바랍니다.https://www.bigdata-environment.kr/user/data_market/detail.do?id=0f1438b0-4e7f-11ed-8fbf-2b74f5407fe4#!
