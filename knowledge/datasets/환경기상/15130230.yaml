description_portal: 한국가스공사 평택기지본부는 LNG 인수기지 및 관련 시설 운영과정에서 발생하는 질소산화물(NOx) 배출량을 매년 산정하여 공개하고 있습니다. 최근 지속가능경영보고서 및 환경정보 공개자료에 따르면, 평택, 인천, 통영 등 주요 기지 단위로 연간 배출량을 집계하고 있으며, 점진적으로 감소추세를 보이고 있습니다. 이는 연소효율 개선, 저녹스 버너 설치, 공정 최적화 등을 통해 배출저감 노력을 기울인 결과로, 이러한 데이터는 대기환경보전법상 자가측정 결과와 질소산화물(NOx) 배출허용총량 관리와 연계되어 공공데이터포털 과 지속가능경영보고서를 통해 일반 국민도 확인할 수 있습니다.
