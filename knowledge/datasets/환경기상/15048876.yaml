summary_user: 서울 서대문구 관내에서 「다중이용시설 등의 실내공기질 관리법」에 따라 실내공기질을 관리해야 하는 시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설군·시설명·주소·연면적(제곱미터)을 담는다(포털 기준일 2021.6.7.). 주민이나 분석가가 '우리 동네 어떤 시설이 실내공기질 관리대상인가', '시설군별로 몇 곳이 있고 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 시설명을 맞춰 연결하며, 다른 자치구의 같은 이름 데이터와는 자치구·시설군 컬럼 기준으로 이어 붙여 쓴다.
description_portal: '서울특별시 서대문구 관내에 위치한 다중이용시설 실내공기질 관리 대상 현황(시설명, 시설군, 주소, 연면적)에 대한 데이터를 제공합니다.다중이용시설 실내공기질 관리대상 현황 데이터는 「다중이용시설 등의 실내공기질 관리법」에 따라 실내 공기질을 의무적으로 관리해야 하는 시설들의 목록과 정보를 담고 있습니다. 이 데이터는 불특정 다수인이 이용하는 시설의 쾌적하고 안전한 환경을 보장하기 위해 사용할 수 있습니다..주요 포함 항목으로는 시설군, 시설명, 주소 등이 있습니다. 데이터기준일 : 2021.6.7.'
