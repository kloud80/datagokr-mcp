summary_user: 기상청 해양기상부이 관측 지점별로 지점번호, 관측 시작·종료일, 위·경도 같은 이력정보와 주변 환경 정보를 담은 지점 메타데이터이며, 범위는 전국 해역이다. 연구자나 해양 분석가가 특정 해역의 부이가 언제부터 어디에서 관측했는지 확인하고, 파고·수온 같은 관측자료를 해석할 지점을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 기관의 해양기상부이 관측자료와 지점번호나 지점명으로 맞춰 이어 쓴다.
description_portal: 해양기상부이 관측 지점에 대한 지점번호, 관측 시작일과 종료일, 위 · 경도 등 이력정보와 주변 환경 등에 대한 정보를 조회할 수 있습니다.해양기상부이는 해수면에서 해양기상현상을 각종 관측 장비로 관측하고, 위성 등 원격 통신을 이용하여 관측자료를 전송하는 장비로, 형태에 따라 선박형과 원반형 두가지가 있습니다.해양기상부이에서 관측되는 기본요소는 풍향, 풍속, 기압, 기온, 습도, 파고, 파주기, 파향, 수온, 시정(10m 해양기상부이)가 있으며, 파고와 파주기 관측의 경우에는 해수면에서 부이 몸체의 움직이는 가속도를 측정하여 변위 자료를 산출한 후, 스펙트럼 방법에 의해 유의파고와 파주기 등을 산출합니다.
