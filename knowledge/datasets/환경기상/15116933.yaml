description_portal: 부산광역시 수영구는 낚시로 인한 안전사고 예방과 환경 보호를 위해 특정 구역에 낚시를 통제(금지)하는 조치를 시행하고 있습니다. 낚시통제구역은 크게 세 가지로 구분됩니다. 첫째, 민락항 일원으로 면적 18,000㎡, 길이는 0.9km에 해당하며, 둘째, 민락동 푸르지오~롯데캐슬 아파트 앞 구역은 면적 7,000㎡, 길이 0.6km입니다. 셋째, 남천동 삼익비치아파트부터 광안대교까지의 구역은 면적 22,700㎡, 길이 1.9km로 지정되어 있습니다. 이 구역들은 모두 수영구청장이 지정한 구역으로, 낚시 행위를 금지하여 시민들의 안전을 보호하고, 수변 환경을 지속적으로 관리하려는 목적을 가지고 있습니다.
