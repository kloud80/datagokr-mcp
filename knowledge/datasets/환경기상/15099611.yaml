description_portal: '이 데이터셋은 서울특별시 관할의 빗물펌프장 위치 정보를 공간정보 형식으로 제공하는 자료입니다. 좌표계는 EPSG:5186(한국 중부원점, Y축 +600000 m)로 설정되어 있으며, 인코딩 방식은 windows-949입니다.  빗물펌프장이란 집중호우나 도시침수 상황에서 지하나 저지대에 쌓인 빗물을 배수하거나 저지대에서 상부로 물을 송출하는 설비로, 도심 안전 및 재난 대응 측면에서 중요한 시설입니다. 이 데이터는 해당 설비의 위치(지리좌표) 정보가 담겨 있어, 침수위험지역 분석, 배수능력 지도 작성, 펌프장 인프라 현황 파악, GIS 기반 재난예측모델 구축 등에 활용할 수 있습니다.문의 : 안전총괄실 안전총괄관 안전지원과 (02-2133-8521)'
