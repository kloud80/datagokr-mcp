description_portal: '환경부 국립환경과학원에서 운영하고있는 물환경측정망중 생물측정망의 수생생물(동물플랑크톤, 저서성무척추동물, 어류, 식물플랑크톤)의 출현정보에 관한 데이터를 제공합니다.물환경측정망 운영계획을 기반으로 생물측정망을 운영하며 생산된 수생생물 출현정보 데이터로 물환경측정망 운영계획에 따라 데이터를 생산하는 기관에서 연2회 생산하여 물환경정보시스템을 통해 데이터를 입력하고, 물환경정보시스템을 통해 데이터를 제공하고있습니다.(항후 대국민 데이터는 국가 통합물관리정보플랫폼(물모아)를 통해 제공될 예정입니다.)보구간 생물측정망 동물플랑크톤 출현생물, 보구간 생물측정망 저서성무척추동물 출현생물, 보구간 생물측정망 어류 츨현생물, 보구간 생물측정망 식물플랑크톤 출현생물의 정보를 제공합니다.세부적으로 구분,지점코드,년,월,종코드,출현종수,입력일자를 제공하며 코드는 구분,종코드,종구분 또는 종명,학명 을 제공합니다.(기타유의사항: 데이터값이 공란인 부분은 미집계 데이터 또는 개인정보가 포함되어 공란 처리하였습니다.)'
