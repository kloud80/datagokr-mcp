summary_user: 국립환경과학원 물환경측정망 중 생물측정망(보 구간)에서 조사한 동물플랑크톤, 저서성무척추동물, 어류, 식물플랑크톤의 출현 정보를 측정지점·연·월·종 단위로 담는 전국 범위의 파일 데이터다. 하천 보 구간에서 어느 시기에 어떤 수생생물이 몇 종 출현했는지 보려는 수질·생태 분석가나 연구자가 지점별 생물상 변화를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 측정지점 코드(지점코드)나 종코드·종명 매핑을 통해서만 수질측정망 등 다른 데이터와 연결한다.
limits: 다른 기관 데이터와 바로 붙일 공통 키가 없어 지점코드·종코드를 별도 코드표로 이름이나 좌표에 대응시켜야 한다. 비공간 데이터라 위치 분석에는 지점 정보가 따로 필요하다.
