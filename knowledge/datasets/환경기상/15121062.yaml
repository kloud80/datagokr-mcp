summary_user: 전국 시도·지역별, 차종·접수방법별로 2022년 전기차 구매보조금의 공고대수(우선순위·법인및기관·택시·일반 구분), 접수대수, 출고대수를 집계한 CSV 파일입니다. 전기차 구매 예정자나 분석가가 "우리 지역의 보조금 물량 대비 신청이 얼마나 몰렸고 실제 출고는 얼마나 됐나"를 확인하는 데 씁니다. 전역 조인 키가 없어 다른 데이터와는 시도·지역 이름을 매핑해서만 이어 쓸 수 있습니다.
description_portal: '전기차구매보조금 지급현황정보: 해당 데이터는 전국 전기차 구매보조금 지급현황(공고대수, 접수대수, 출고대수 등) 관련 정보입니다.항목: 시도,지역구분,차종,접수방법,2022년 공고대수(전체),2022년 공고대수(우선순위),2022년 공고대수(법인·기관),2022년 공고대수(택시),2022년 공고대수(일반),2022년 접수대수(우선순위),2022년 접수대수(법인·기관),2022년 접수대수(택시),2022년 접수대수(일반),2022년 출고대수업무체계분류: 환경, 대기중장기 개방 대상 여부: 해당없음개별포털 등록여부: 아니오전기차 이용자 및 구매 예정자 분들에 대한 유용한 공공데이터로 제공드리는 자료입니다.자료 관련 추가 문의사항이나 요청사항은 한국환경공단 친환경모빌리티처 자동차환경계획부로 문의부탁드립니다.감사합니다.'
