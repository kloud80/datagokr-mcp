description_portal: '서울특별시 마포구의 월별 음식물류폐기물 및 재활용폐기물 처리 현황에 대한 정보입니다.이 데이터에는 2019년 1월부터 2020년 9월까지의 각 폐기물(예: 음식물, 재활용 등)의 처리량이 톤 단위로 포함되어 있습니다.이 데이터를 통해 주민들과 관련 기관은 음식물류폐기물 및 재활용폐기물의 월별 발생량과 처리 현황을 파악하여 보다 효율적인 폐기물 관리와 환경 보호 정책 수립에 활용할 수 있습니다.음식물류폐기물의 처리량은 공동주택 뿐만 아니라 단독,소형음식점 발생량의 총합입니다.'
