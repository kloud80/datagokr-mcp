summary_user: 전라남도 내 측정소 측정값을 기준으로 미세먼지·오존의 주의보·경보 발령 현황을 연도별·항목별·단계별 발령횟수와 발령일수로 집계한 소규모 CSV 파일(1,448바이트)입니다. 도민이나 분석가가 '전남에서 해마다 미세먼지·오존 주의보나 경보가 몇 번, 며칠 내려졌고 늘었는가'를 확인할 때 쓴다. 측정소 코드나 지역 코드 같은 전역 조인 키가 없어서, 다른 대기질 자료와는 연도와 항목(오염물질) 이름을 맞춰 붙여 쓴다.
description_portal: '- 전라남도 내 측정소에서 측정된 값을 기준으로 연도별 미세먼지 경보발령 현황을 나타낸 자료입니다. - 연도별 미세먼지 및 오존 주의보, 경보 발령 현황을 조회하실 수 있습니다.- 전라남도는 미세먼지 농도가 높아질 경우, 도민의 건강 보호를 위해 다양한 조치를 취하고 있습니다. 미세먼지 경보 발령은 환경부의 "대기환경보전법"에 따라 이루어지며, 주로 초미세먼지(PM2.5)와 미세먼지(PM10)의 농도에 따라 발령됩니다.- 미세먼지 농도가 높을 경우, 특히 어린이, 노인, 호흡기 질환자 등은 외출을 자제하고 실내에서 활동하는 것이 좋습니다. 또한, 차량 운전 시에는 창문을 닫고, 공기청정기를 사용하여 실내 공기를 정화하는 것이 권장됩니다.'
