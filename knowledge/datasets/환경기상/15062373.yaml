description_portal: 한전KDN의 녹색제품 구매실적은 친환경 조달을 통한 지속가능경영 실천의 중요한 지표입니다. 본 데이터는 사무용품, 전산장비 등 녹색제품 분류별 조달구매 금액과 신규 구매 실적을 상세히 제공하여, 기관의 친환경 구매 현황을 명확히 보여줍니다. 이는 환경부 녹색제품 의무구매 정책과 연계되어 공공기관의 ESG 경영 평가에도 활용됩니다. 한전KDN은 이를 통해 탄소배출 저감과 자원순환 촉진에 기여하며, 녹색소비문화 확산에도 앞장서고 있습니다. 친환경 제품 구매 확대는 기업의 사회적 책임 강화와 환경 보호를 동시에 달성하는 중요한 역할을 수행합니다. 이 실적은 지속가능한 공급망 구축과 정부 탄소중립 정책 이행의 핵심 자료로도 활용될 수 있습니다.
