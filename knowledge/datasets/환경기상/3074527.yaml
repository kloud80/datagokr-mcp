summary_user: 영광군 관내 환경오염물질 배출사업장 수를 읍면별로 대기(1~5종), 수질(1~5종), 소음·진동 구분에 따라 집계한 437바이트 크기의 작은 통계표이다. 영광군의 어느 읍면에 대기·수질 배출사업장이 몰려 있는지 확인하려는 지자체 환경부서나 지역 분석가가 지도·점검 대상 지역을 가늠할 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 읍면 이름을 맞춰 연결하거나 같은 기관(영광군) 자료끼리 이어 쓴다.
description_portal: 전라남도 영광군 관내 환경오염물질 배출사업장에 대한 현황 정보를 제공하는 데이터입니다. 본 자료는 읍면별 대기오염, 수질오염, 소음및 진동 사업체의 위치에 따른 통계 자료로 구성되어 있습니다. 해당 데이터는 환경 관리 정책 수립, 환경영향평가, 오염원 관리계획 수립, 민원 대응 체계 마련 등에 활용되며, 지역 내 환경위해 요소의 사전 모니터링과 행정적 관리 강화를 위한 기반 자료로 활용도가 높습니다. 특히, 환경부서 및 지자체의 지도·점검 계획 수립과 환경민원 대응, 배출시설 관리대장 연계 등 실무 행정에도 폭넓게 응용될 수 있습니다.
