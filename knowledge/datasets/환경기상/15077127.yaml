summary_user: 세종특별자치시에 등록된 벙커C유(중유C) 사용 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·소재지·전화번호·연료·연간 사용량(톤)·주생산품이 들어 있다. 지역 대기 배출원을 파악하려는 분석가나 주민이 '세종시에서 벙커C유를 쓰는 공장은 어디이고 얼마나 쓰는가'를 확인할 때 쓴다. 전역 조인 키나 코드표가 없으므로 다른 배출시설·사업장 데이터와는 사업장명이나 소재지 주소를 맞춰서만 이어 쓴다.
limits: 사업자번호 같은 공통 키가 없어 기업·배출시설 원장과 자동으로 연결되지 않고, 이름·주소 매칭에 기대야 한다. 범위는 세종시 한 곳의 개별 사업장으로 한정된다.
