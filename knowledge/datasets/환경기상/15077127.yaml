description_portal: 세종특별자치시 벙커C유 사업장 현황입니다.데이터는 사업장명, 소재지, 전화번호, 연료, 사용량(톤),주생산품으로 구성되어 있습니다.데이터기준일로 현재 세종특별자치시에는 총 3개의 벙커C유 사업장이 등록되어 있습니다.(주)우림산업연기지점, (주)KCC세종공장, (주)대성아스콘이 연서면, 전의면, 평기리에 소재하고 있습니다.연료는 3개의 사업장 모두 중유C를 사용하고 있으며 사용량은 120톤, 14000톤, 1300톤입니다. 주 생산품으로는 비료, 유리섬유, 아스콘을 생산하고 있습니다.이 데이터는 세종특별자치시 환경녹지국 환경정책과에서 관리하고 있습니다.문의사항은 044-300-4222로 연락주시기 바랍니다.
