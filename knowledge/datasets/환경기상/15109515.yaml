status: active
summary_user: 충청남도 서천군에서 포획된 유해야생동물을 포획 건별로 담은 원천 데이터로, 신고일자·포획일자, 동물 종류(INDVL_KIND), 포획 방식, 포획지 시도·시군·상세주소와 위도·경도, 포획 개체 수를 담는다. 농작물 피해 대응을 검토하는 농민·지자체 담당자나 분석가가 "서천군에서 어느 지역·시기에 멧돼지 같은 유해동물 포획이 많았나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군 이름이나 위도·경도 좌표로 매핑해 이어 써야 한다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와 연결하려면 이름·좌표 매핑이 필요하다. 개발계정은 하루 5,000회 호출로 제한되며, 서천군 한 곳의 포획 기록이라 도·전국 단위 비교에는 다른 시군 자료를 따로 모아야 한다.
