description_portal: '환경부 온실가스종합정보센터에서 운영 중인 국가온실가스종합관리시스템의 할당대상업체 지정에 관한 자료로, 계획기간, 이행연도, 연도별 배출량, 평균배출량, 업체명, 주소지 등으로 구성된 데이터입니다.온실가스 배출권의 할당 및 거래에 관한 법률에 따라, 연 평균 온실가스 배출량을 일정 기준 이상 배출하는 사업장 또는 업체를 보유한 경우 할당대상업체로 지정됩니다. * 계획기간 : 국가온실가스감축목표를 달성하기 위하여 5년 단위로 온실가스 배출업체에 배출권을 할당하고 그 이행실적을 관리하기 위하여 설정되는 기간* 이행연도 : 계획기간별 국가온실가스감축목표를 달성하기 위하여 1년 단위로 온실가스 배출업체에 배출권을 할당하고 그 이핼실적을 관리하기 위하여 설정되는 계획기간 내의 각 연도'
