description_portal: 해당 데이터는 서울시 주행실적통계 현황 데이터입니다. 데이터는 기록 일, 대상년도, 관리 자치구, 관리 행정동, 주행 실적 수, 주행 거리, 온실가스, 마일리지, 대당 연평균 감축으로 구성되어 있습니다. 친환경 운행 관리와 온실가스 감축 정책 평가에 활용될 수 있으며, 마일리지 인센티브와 대당 연평균 감축 효과를 함께 제공하여 에너지 절약 및 저탄소 교통 정책 수립의 기초자료로 중요한 의미를 가집니다. 연구기관이나 정책 담당자는 해당 데이터를 기반으로 교통 수요 관리, 도시 환경 개선, 에너지 절약 효과 분석을 진행할 수 있어, 장기적으로는 서울시의 지속가능한 교통체계 구축과 기후변화 대응 전략 수립에 유용하게 쓰입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
