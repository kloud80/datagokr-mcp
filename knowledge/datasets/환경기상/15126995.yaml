summary_user: 서초구 관내 생활폐기물 수거·운반을 맡은 대행업체의 업체명과 전화번호, 일·화·목 배출 구역과 월·수·금 배출 구역을 업체별로 정리한 작은 현황표(CSV 612바이트)다. 서초구 주민이 우리 동네 쓰레기를 어느 업체가 무슨 요일에 수거하는지 확인하거나, 민원을 넣을 연락처를 찾을 때 쓴다. 실측 컬럼에 사업자번호나 행정코드 같은 전역 조인 키가 없어, 다른 데이터와는 업체명이나 동 이름을 맞춰 붙이거나 서초구의 다른 폐기물 데이터와 기관 단위로만 이어 쓴다.
