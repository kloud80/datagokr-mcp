summary_user: 서울특별시의 기타 수질오염물질 배출시설(점오염원·비점오염원으로 관리되지 않는 시설)을 사업장 단위로 담은 인허가 원천 목록으로, 인허가일·영업상태·폐업일·휴업기간·주소·좌표·업종·주생산품·배출/방지시설 가동시간 등을 포함한다. 분석가나 주민이 '우리 구에 영업 중인 기타 수질오염 설치시설은 어디이고 언제 인허가됐나'를 확인하거나, 영업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(개방자치단체코드·관리번호)로만 연결하며, 좌표(XCRD·YCRD)로 위치 기반 결합을 할 수 있다.
description_portal: '점오염원(폐수배출시설, 하수발생시설, 축사 등으로서 관거·수로 등을 통하여 일정한 지점으로 수질오염물질을 배출하는 배출원) 및 비점오염원(도시, 도로, 농지, 산지, 공사장 등으로서 불특정 장소에서 불특정하게 수질오염물질을 배출하는 배출원)으로 관리되지 아니하는 수질오염물질을 배출하는 시설정보입니다.문의  : 지방행정 인허가 시스템에 문의 바랍니다. ( https://www.localdata.go.kr/)제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4273) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
