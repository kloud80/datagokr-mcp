description_portal: 서울시 하구둑 정보 데이터는 서울시 내 하구둑 및 관련 수공시설의 구조적 특성과 수문·홍수 조절 기능을 종합적으로 파악하기 위한 자료입니다. 하천기본계획 코드, 사업명, 수립년도, 시행기관을 통해 해당 시설이 어떤 계획과 사업의 일환으로 조성·관리되는지 알 수 있으며, 시설물명, 하천명, 하천등급, 주소 항목을 통해 하구둑의 위치와 대상 하천의 기본 특성을 확인할 수 있습니다. 본류하천 유역면적, 홍수량, 계획빈도와 약최고만조위, 대조평균조위, 평균해면, 대조차 등은 홍수 및 조석 조건을 반영한 설계·관리 기준을 보여주는 핵심 수문 자료입니다. 만수면적, 총저수용량, 유효저수량, 홍수위, 만수위, 사수위는 하구둑과 저수구역의 저류 능력과 수위 운영 범위를 나타내어 홍수 조절과 수자원 확보 기능을 분석하는 데 활용됩니다. 또한 방조제 연장, 제방고, 상단·하단·경사폭, 경사외측 등 제방 제원과 배수갑문 연장, 문비 형식·규격·구조, 배제능력, Sill 표고, 조작방식 정보는 하구둑과 배수시설의 구조적 안정성, 배수 능력, 운영 방식 평가에 필수적인 기초 자료로서, 침수 피해 저감, 해수 역류 방지, 하천·연안 관리 정책 수립을 위한 중요한 기술 데이터입니다.
