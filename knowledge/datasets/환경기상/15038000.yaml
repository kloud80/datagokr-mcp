description_portal: 서울특별시 중랑구 폐건전지 및 폐형광등 분리수거함 위치현황입니다. 데이터의 주요 항목으로는 연번, 주소, 위도, 경도, 데이터기준일자 정보를 포함합니다.  폐건전지 및 폐형광등 분리수거함의 데이터 카테고리는 일반공공행정의 일반행정, 환경, 순환 등에 해당합니다. 관련 데이터를 활용하여  폐건전지 및 폐형광등 분리수거함 위치 파악,  폐건전지 및 폐형광등 분리수거함 현황 분석,  폐건전지 및 폐형광등 재활용 개선 방안, 자원순환 정책 수립 또는  폐건전지 및 폐형광등수거 관련 데이터 분석 등에 활용될 수 있습니다. 자세한 사항은 엑셀파일을 다운로드 받아서 내용을 확인하여 주시기 바랍니다. 감사합니다.
