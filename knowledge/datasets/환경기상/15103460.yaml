summary_user: 부산광역시 내 공공건축물을 건물(동) 단위로 한 행씩 담은 원천 목록으로, 소유자·건축물명·구군·주소·위경도와 함께 석면건축물 여부, 안전관리인 지정 여부, 연면적과 석면자재 면적을 담는다. 주민이나 학부모가 '우리 동네 공공건물 중 석면이 있는 곳은 어디이고 안전관리인이 지정돼 있는가'를 확인하거나, 분석가가 구군별 석면자재 면적을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 구군·동명·주소 같은 이름 매칭이나 위경도 좌표로 공간 결합해 쓴다.
description_portal: 부산광역시 공공건축물 석면 현황에 대한 데이터로  번호, 구분,  구군,  소유자, 건축물명(상호), 동명,  주소,  위도,  경도,  석면건축 여부,  안전관리인 지정여부,  연면적,  석면(자재)면적,  데이터기준일자 항목정보를 제공합니다.이 데이터는 부산광역시 내 공공건축물의 석면 포함 현황 및 안전관리 정보를 CSV형태로 제공합니다.공공건축물 중 석면존재여부  안전관리인 지정여부 등 건강 및 안전 관리측면의 주요정보를 포함하고 있습니다.소유자, 건축물명, 행정동명, 주소, 위경도, 석면건축여부, 안전요원 유무, 건축물연면적, 석면자재면적 등의 데이터를 제공합니다.
