summary_user: 충청남도 서산시에서 접수된 야생동물 구조 건을 접수번호 단위로 담은 건별 원천 데이터로, 종명·분류(강·목·과)·멸종위기 등급·CITES 여부와 발견·접수·구조 일시, 발견 주소와 구조·방사 좌표, 발생 원인, 구조 결과를 함께 담는다. 지역 환경단체나 연구자가 '서산에서 어떤 종이 어떤 원인(충돌·탈진 등)으로 주로 어디서 구조되는가'를 파악하거나 로드킬·유리창 충돌 다발 지점을 찾는 데 쓴다. 전역 조인 키는 없어 다른 지역 구조 데이터나 종 분포 자료와는 종 국명·학명(NTMNM) 같은 이름 매핑이나 구조·발견 좌표를 이용한 공간 결합으로만 이어 쓴다.
description_portal: 발견일시, 접수일시, 구조일시 등의 야생동물 구조 데이터 정보를 제공하는 충청남도 서산시 야생동물 구조 데이터 조회 서비스
