summary_user: 충청남도 계룡시 안에서 실내공기질 관리 대상인 다중이용시설을 시설별로 한 건씩 담은 목록이며, 시설 유형·시설명·주소·연락처·비고를 제공한다. 시민이나 사업자가 '계룡시에서 실내공기질 관리 대상인 시설이 어디이고 어떤 유형인가'를 확인할 때나, 점검·문의할 시설의 연락처를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열을 맞추거나 같은 기관 데이터로만 연결한다.
description_portal: 충청남도 계룡시의 '다중이용시설 실내공기질 관리대상 API' 데이터는 실내공기질 관리법에 따라 관내에서 정기적인 관리가 필요한 다중이용시설들의 현황 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 관리대상 시설 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 시설의 종류를 분류하는 시설 유형 정보와 공식 명칭인 시설 명, 시설의 정확한 주소, 그리고 문의나 점검 관련 연락을 위한 연락처가 포함됩니다. 또한, 참고할 만한 추가 정보를 담는 비고 항목도 제공합니다.
