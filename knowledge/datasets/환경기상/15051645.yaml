summary_user: "인천 부평구가 무인악취포집기로 채취한 시료의 검사 내역을 사업장별 건 단위로 담은 원천 파일로, 사업장명·소재지·채취일자·의뢰일자·검사항목·측정값(희석배수)·검사결과를 포함하며 범위는 부평구 한 시군구이다. 주민·환경 담당자·분석가가 '우리 동네 어느 사업장에서 언제 악취가 몇 배로 측정됐고 기준을 넘었는가'를 확인하거나, 채취일과 의뢰일 차이로 검사 소요기간을 따지는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·소재지 주소를 맞춰 잇는다(예: 악취 배출 사업장·오염원 사업장 목록, 악취 민원 자료)."
description_portal: '무인악취포집기를 통해 수집된 악취 데이터를 바탕으로, 악취 유발 사업장별 채취일자, 검사항목, 측정값, 검사결과 등을 제공하는 자료.악취 민원 대응, 환경오염원 추적, 생활환경 개선 등을 위한 환경관리 기반 자료로 활용됨.활용 목적 및 특징– 악취 발생 지역 및 사업장에 대한 주기적 모니터링 체계 구축– 채취·의뢰일자 기반으로 검사 소요기간 분석 가능– 측정값(배수)와 결과 기준을 통해 초과 여부 판단 가능– 환경 민원 예방 및 사후 대응 체계 고도화를 위한 행정지원 자료주요 항목 설명● 사업장명: 악취가 채취된 사업장의 명칭● 소재지: 사업장의 위치 주소● 채취일자 / 의뢰일자: 시료 채취 및 검사 의뢰가 이루어진 날짜● 검사항목: 측정 대상 악취 항목 (예: 암모니아, 황화수소 등)● 측정값(배): 무인 포집기를 통해 측정된 악취의 희석배수● 검사결과: 해당 항목에 대한 검사 여부'
