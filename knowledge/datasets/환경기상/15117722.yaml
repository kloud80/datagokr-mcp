summary_user: 진주시 관내 대기 측정소별로 오존·미세먼지(PM10)·초미세먼지(PM2.5) 농도를 연도·월 단위로 담은 파일 데이터이며, 측정소마다 주소와 위도·경도가 함께 들어 있다. 진주 시민이나 분석가가 '우리 동네 측정소의 월별 미세먼지·오존 농도는 어땠나'를 확인하거나 측정소 간 농도를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키나 측정소 코드가 없어, 다른 대기질 데이터와는 측정소명을 이름으로 맞추거나 위도·경도 좌표로 위치를 대응시켜 이어 쓴다.
description_portal: 미세먼지, 초미세먼지, 오존 농도를 ppm 단위로 나타낸 데이터이며 진주시 관내 다양한 장소에서 측정한 값입니다. 미세먼지, 초미세먼지, 오존 농도는 우리 건강과 일상에 영향을 주는 대표적인 환경문제입니다. 미세먼지의 발생 원인과 변화, 건강에 미치는 영향, 정부의 저감 정책 등을 이해하는 데 도움이 되며, 시민들이 환경 정보를 쉽게 확인하고 생활 속에서 미세먼지에 효과적으로 대응하는 데 활용할 수 있습니다.초미세먼지(PM2.5)지름 2.5㎛ 이하의 입자로 건강 위해성이 높은 대기오염 물질미세먼지(PM10)지름 10㎛ 이하의 입자로 대기질의 대표적인 지표오존(O₃)                       여름철 미세먼지와 함께 관리되는 주요 대기오염 물질
