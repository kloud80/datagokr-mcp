description_portal: 경기도 고양시에 위치한 환경에너지시설의 전반적인 현황 데이터를 정리하여 제공합니다. 해당 자료에는 각 시설의 시설명과 가동 개시일을 비롯해, 시설의 종류 및 주요 처리방식이 포함되어 있습니다. 또한 시설이 위치한 소재지의 지번 주소와 도로명 주소를 함께 제공하여 행정적·지리적 확인이 용이하도록 하였습니다.아울러, 각 시설의 규모와 성능을 보여주는 **시설용량(톤/일)과 실제 처리용량(톤/일)**을 명시하고, 시설이 차지하는 부지면적(㎡) 및 건축 연면적(㎡) 정보도 함께 담았습니다. 더불어, 시설 조성에 소요된 설치비(백만원) 자료를 수록하여 재정적 측면에서도 참고할 수 있도록 하였습니다.마지막으로, 시설의 운영 및 관리와 관련된 행정적 소통을 원활히 하기 위해 시설 담당 기관과 연락처 정보를 포함하였습니다. 이 자료는 고양시 환경에너지시설의 현황을 종합적으로 파악하고, 행정, 정책, 연구 및 시민 안내 등 다양한 목적으로 활용될 수 있습니다.
