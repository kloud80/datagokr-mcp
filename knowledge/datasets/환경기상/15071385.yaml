summary_user: 한국물기술인증원의 위생안전기준인증(수도용 자재·제품) 인증제품을 인증서 한 건마다 한 행으로 담은 원천 목록으로, 인증서 번호·인증일·기업명·제품명·용도·대표자명·본사와 공장 주소가 들어 있고 범위는 전국이다. 수도용 제품을 고르거나 납품받는 사업자·발주처가 특정 업체나 제품이 위생안전기준 인증을 받았는지, 언제 받았는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기업명·주소 같은 이름 매칭으로만 잇는다.
description_portal: 한국물기술인증원에서 운영중인 위생안전기준인증제도에 대한 인증제품정보 관련데이터를 제공합니다.(인증서 번호, 인증일, 기업명, 제품명)해당 데이터는 기존의 위생안전기준인증제도의 정보시스템(인증원 설립 이후 통합인증정보망구축 이전 정보망, kctap)에서 추출한 데이터 입니다.현재 한국물기술인증원에서 신규 정보시스템을 구축하여 위생안전기준인증제도를 운영중이며, 향후 신규 포맷으로 데이터 제공 예정입니다.(기존의 위생안전기준인증제도 시스템 폐기)자세한 사항은 한국물기술인증원 통합인증정보망에서 확인하시기 바랍니다.https://portal.kwtc.or.kr
