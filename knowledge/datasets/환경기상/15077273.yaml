summary_user: 광주환경공단이 관리하는 비점오염저감시설을 시설 한 곳당 한 행으로 담은 소규모 파일(CSV 634바이트)로, 시설유형·일 처리 시설규모·소재지 주소·사업기간·주요 오염원·연간 담수량을 담는다. 광주 지역 수질 관리 담당자나 분석가가 "공단이 운영하는 비점오염저감시설은 어디에 있고 어떤 오염원을 얼마 규모로 처리하나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 소재지 주소(지번·도로명)나 우편번호를 기준으로 맞추거나 같은 기관 자료와 이름으로 연결한다.
