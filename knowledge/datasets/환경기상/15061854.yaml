summary_user: 경기도 측정권역별 미세먼지(PM10)·초미세먼지(PM2.5) 경보·주의보 발령 이력을 건별로 담으며, 발령·해제 일시와 발령·해제 시점 농도가 함께 기록된다. 연구자나 지자체 담당자가 '어느 권역에서 언제 초미세먼지 주의보가 얼마나 자주, 얼마나 오래 이어졌나'를 따질 때 쓴다. 전역 조인 키는 없어서 권역명(distrct_nm)이나 날짜를 기준으로 이름을 맞춰 에어코리아 측정소 대기질이나 기상 관측 자료와 붙여 쓴다.
description_portal: '이 데이터는 미세먼지경보조회서비스를 통해 수집된 대기오염경보발령 이력을 포함하고 있습니다.데이터에는 경보 발령일시, 해제일시, 경보단계, 미세먼지발령농도 등의 세부 항목이 포함되어 있습니다. 측정권역 단위로 PM10(미세먼지) 및 PM2.5(초미세먼지) 농도가 기록되며, 경보단계는 경보, 주의보 등으로 구분됩니다. 이 데이터는 대기질 모니터링, 미세먼지 고농도 발생 원인 분석, 시민 건강 보호정책 수립, 실시간 대기오염 정보 제공 등 다양한 환경 정책 및 연구에 활용될 수 있습니다. 활용 시에는 관측소의 위치 특성, 측정 장비의 보정 상태, 실시간성의 한계 등을 고려해야 합니다.※ 관련법령 : 대기환경보전법 8조, 대기환경보전법 시행령 2조, 대기환경보전법 시행규칙 13조'
