description_portal: 본 데이터는 2025년 1월부터 6월까지 고현동과 아주동 측정소에서 수집한 시간별 대기오염 시계열 자료입니다. 초미세먼지(PM2.5), 미세먼지(PM10), 오존(O₃), 일산화탄소(CO), 아황산가스(SO₂), 이산화질소(NO₂) 등의 농도가 포함되어 있으며, 측정일자별로 정리되어 있습니다. 고현동, 아주동 대기질의 시간별 변화를 파악할 수 있어, 환경 모니터링과 오염 추세 분석에 활용 가능합니다. 해당 데이터는 정책 수립, 연구, 시민 건강 보호 등 다양한 공공 목적에 기여할 수 있습니다.또한 본 데이터는 대기오염 예측 모델 개발, 기계학습 기반 이상치 탐지, 시계열 분석 등 다양한 인공지능 및 데이터 과학 연구의 학습데이터로 활용될 수 있습니다. 정책적 활용뿐 아니라, 연구기관이나 교육 현장에서 환경 데이터 분석 교육 자료로도 적합합니다.
