summary_user: 경기도 양주시에서 「실내공기질 관리법」 적용을 받는 다중이용시설을 시설 한 곳당 한 행으로 담은 파일이며, 시설구분·시설명·도로명주소·전화번호·연면적·관리기관과 그 연락처·데이터기준일자를 포함한다. 양주시 안에서 실내공기질 관리 대상인 시설이 어디에 있고 규모(연면적)는 얼마인지, 점검 대상을 어떻게 고를지를 확인하려는 환경·보건 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·도로명주소를 맞추거나 같은 기관(양주시) 기준으로만 연결하며, 주소를 지오코딩하면 지도 분석에 쓸 수 있다.
limits: 측정소 코드나 시설 고유코드 같은 조인 키가 없어 대기질 측정값이나 실내공기질 측정 결과와 바로 연결되지 않고, 이름·주소 매칭에 기대야 한다. 범위는 양주시 한 곳의 시설 목록이며, 실내 오염물질 측정값은 들어 있지 않다.
