description_portal: 기도 양주시 실내공기질 관리법 적용대상 다중이용시설 현황 데이터입니다.본 데이터는 「실내공기질 관리법」에 따른 실내공기질 관리 대상 다중이용시설의 현황을 제공하며, 시설구분, 시설명, 소재지 도로명주소, 시설 전화번호, 연면적, 관리기관, 관리기관 연락처, 데이터기준일자 등의 정보를 포함하고 있습니다.해당 데이터는 다중이용시설의 위치 및 시설 정보를 체계적으로 확인할 수 있도록 제공되며, 실내공기질 관리 대상 시설의 현황 파악, 지도·점검 대상 관리, 환경 및 보건 행정업무 지원, 공기질 개선 정책 수립, 시설 안전관리, 공간정보(GIS) 분석 및 위치기반 서비스 구축 등에 활용할 수 있습니다.또한 시설별 연면적과 관리기관 정보를 함께 제공하여 관리 대상 시설의 규모를 확인하고 효율적인 점검계획을 수립할 수 있으며, 데이터는 기준일자를 기준으로 작성되어 최신 관리 현황을 확인하는 데 활용할 수 있습니다.
