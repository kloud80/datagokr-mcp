summary_user: 광주광역시 서구(현 전남광주통합특별시 서구)에 있는 대기배출시설을 사업장 한 곳당 한 행으로 담은 파일(CSV 약 5KB)로, 사업장명·도로명주소·종별을 기록한다. 주민이나 분석가가 "우리 동네 근처에 어떤 대기배출 사업장이 있고 규모 종별은 어떤가"를 확인하거나, 구 단위 배출원 점검 대상을 추릴 때 쓴다. 전역 조인 키나 사업자번호가 없어, 다른 배출원·대기질 데이터와는 사업장명이나 도로명주소를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 광주광역시 서구에 위치한 대기배출시설의 현황을 담고 있으며, 해당 시설의 연번, 사업장명, 도로명 주소 등의 항목으로 구성되어 있습니다.각 항목은 오염물질 발생원인에 따른 업종 분류와 관리시설 유형에 따라 분류되며, 사업장 단위의 대기오염물질 배출 실태를 파악하는 데 유용합니다.데이터는 매년 말 기준으로 갱신되며, 환경오염 저감 정책 수립, 지역 내 환경 관리 수준 분석, 대기환경 개선사업 추진 시 기초자료로 활용할 수 있습니다.특히 시설명, 주소, 업종, 배출종류 등 현장 단위 정보가 포함되어 있어, 지자체 및 유관기관의 환경 모니터링 및 점검에 필수적인 자료입니다.
