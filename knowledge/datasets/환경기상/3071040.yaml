summary_user: 환경부가 「야생생물 보호 및 관리에 관한 법률」에 따라 지정한 멸종위기 야생생물을 종 단위로 정리한 전국 범위의 비공간 목록으로, 종마다 분류군·국명·학명·지정 등급(I급/II급)과 고유종 여부, 국가적색목록·세계자연보전연맹(IUCN) 평가 범주를 담는다. 환경영향평가 담당자나 생태 조사자가 "조사 지역에서 확인된 이 종이 멸종위기 I급인지 II급인지, 국내외 적색목록 범주는 무엇인지"를 확인하는 데 쓴다. 전역 조인 키나 종 코드가 없어서, 전국자연환경조사 종 분포 점 같은 다른 생물종 데이터와는 국명이나 학명을 문자열로 맞춰 이어 쓴다.
description_portal: '본 데이터는 「야생생물 보호 및 관리에 관한 법률」에 따라 환경부가 보호 대상으로 지정한 멸종위기 야생생물의 현황을 정리한 자료입니다. 한국 고유의 생물다양성을 보전하고 인위적 위협으로부터 보호하기 위해 주기적으로 지정 및 고시되는 멸종위기종에 대한 기초정보를 제공합니다.이 데이터는 멸종위기 야생생물을 분류군(포유류, 조류, 양서류, 곤충류, 식물 등) 단위로 정리하고 있으며, 각 종별로 다음과 같은 정보를 포함하고 있습니다:분류군 (예: 포유류, 조류, 양서류 등)국명 (예: 반달가슴곰)학명 (Ursus thibetanus ussuricus)지정 등급 (멸종위기 야생생물 I급 / II급)지정일자 및 고시번호 (필요 시 포함 가능)법적 보호현황 및 기타 비고본 데이터는 국가 차원의 멸종위기종 보전정책 수립, 생물다양성 조사 및 평가, 생물종 정보시스템 구축, 환경영향평가 등의 업무에 활용될 수 있으며, ‘한반도의 생물다양성’ 시스템 및 환경부 고시 자료를 기반으로 갱신됩니다.'
