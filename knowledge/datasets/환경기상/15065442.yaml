description_portal: '- 대구공공시설관리공단 성서사업소 소각장 폐기물 반입 현황에 대한 데이터입니다. 성서 소각장 2024년 월 합계, 반입일수 등의 항목을 제공합니다.- 폐기물 반입량은 각 지자체 및 사업장에서 발생한 생활폐기물과 사업장폐기물을 소각장으로 운반하여 처리한 양을 의미- 소각 대상 폐기물은 주로 생활폐기물, 일부 사업장 일반폐기물, 지정폐기물 등이 포함- 생활폐기물:  「폐기물관리법」에 따르면, 생활폐기물은 일상생활에서 발생하는 폐기물로서, 사업장 외의 장소에서 발생하거나 사업장에서 발생하더라도 사업장폐기물로 분류되지 않는 폐기물을 말합니다.- 사업장폐기물「폐기물관리법」에 따르면, 사업장폐기물은 사업 활동 과정에서 발생하는 폐기물로, 다음과 같이 분류됩니다 a. 사업장 일반폐기물: 사업장에서 발생하지만 유해하지 않은 폐기물 (예: 종이, 플라스틱, 음식물 등) b. 사업장 지정폐기물: 유해물질을 포함하거나 특별한 관리가 필요한 폐기물 (예: 폐유, 폐산, 폐수처리오니 등)'
