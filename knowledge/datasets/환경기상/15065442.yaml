summary_user: 대구공공시설관리공단 성서사업소 소각장에 들어온 폐기물을 2024년 월 단위로 집계한 파일(csv, 303 bytes)로, 월별 합계 반입량, 2·3호기 반입량(톤), 반입일수를 담는다. 성서 소각장에 어느 달에 폐기물이 얼마나 반입됐고 며칠 가동됐는지 확인하려는 지역 주민이나 폐기물 처리 분석가가 월별 반입 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 월(기간)이나 시설명을 기준으로 직접 맞춰 이어 써야 한다.
limits: 단일 소각장의 월별 집계라 반입 주체(지자체·사업장)나 폐기물 종류별 내역, 사업자 단위 원장 정보는 담지 않는다. 범위는 전국·비공간으로 분류돼 있지만 내용은 성서 소각장 한 곳에 한정되며, 조인 키가 없어 기관 코드나 이름 매핑으로만 연결된다.
