description_portal: 서울시 년도별 평균 대기오염도 정보 데이터는 서울시 각 측정소에서 한 해 동안 관측된 주요 대기오염물질 농도의 평균값을 제공하는 자료입니다. 측정년도와 측정소명을 통해 언제, 어느 지역의 대기질 정보인지를 확인할 수 있으며, 이산화질소, 오존, 일산화탄소, 아황산가스 농도는 자동차 배출가스, 산업 활동, 연료 사용 등으로 인한 기체 오염물 수준을 보여줍니다. 미세먼지와 초미세먼지 항목은 시민 건강에 큰 영향을 미치는 입자상 물질의 연평균 농도를 나타내어, 장기적인 호흡기·심혈관계 위험 평가에 활용될 수 있습니다. 이 데이터는 지역·년도별 대기질 변화 추세를 비교하고, 대기오염 저감 정책의 효과를 분석하며, 건강 영향 연구와 환경 기준 설정 등에 필요한 과학적 근거 자료로 활용되는 중요한 대기환경 기초 정보입니다.
