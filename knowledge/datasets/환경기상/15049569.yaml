description_portal: 서울시 전력통신구 유출지하수 현황 자료는 전력·통신 관로 등에서 발생하는 유출지하수를 어떻게 관리·이용하고 있는지 파악하기 위한 데이터입니다. 관리기관과 관리부서, 시설물명, 집수정명 및 집수정위치, 자치구 정보를 통해 어느 기관이 어떤 시설에서 발생한 지하수를 관리하는지와 행정·공간적 위치를 확인할 수 있습니다. 총발생량과 일평균발생량은 유출지하수 규모를 보여주며, 하천방류, 도로청소, 공원용수, 화장실세척, 건물용수 등 항목은 일평균 이용량을 세부 용도별로 제시해 재이용 실태를 구체적으로 분석할 수 있습니다. 미사용 하수도방류, 방류하천명, 방류일, 하천관로길이 정보는 재이용되지 못하고 버려지는 물의 규모와 이동 경로를 파악하는 데 활용되며, 이를 통해 도시 내 물 순환 효율을 높이기 위한 정책 수립과 유출지하수의 추가 활용 방안 검토에 중요한 기초 자료로 활용될 수 있는 데이터입니다.
