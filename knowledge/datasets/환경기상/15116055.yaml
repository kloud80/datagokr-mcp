description_portal: '서울특별시 중구의 공중이 이용하는 건축물·시설물등의 청결유지와 실내공기정화를 위한 청소 등을 대행하는 업소 정보입니다. 데이터는 각 건물위생관리업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 건물위생관리업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 청소 장비 기술인력 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. * 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
