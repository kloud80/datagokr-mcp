summary_user: 광주광역시 동구 관내 폐수 및 대기오염물 배출시설을 시설 한 곳당 한 행으로 담은 소규모 파일(약 4.6KB CSV)로, 구분·시설명·사업장 종류·도로명주소·데이터기준일자를 제공한다. 주민이나 사업자가 '우리 동네 근처에 어떤 배출시설이 있고 어떤 종류의 사업장인가'를 확인하거나, 분석가가 동구 내 오염원 위치를 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 시설명 매칭, 또는 같은 기관(동구) 기준으로만 연결한다.
