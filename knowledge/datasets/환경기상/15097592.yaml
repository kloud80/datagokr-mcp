summary_user: 충청북도 내 토양 조사 지점별로 연도·지역명·주소·조사구분·토지용도·채취일자와 비소·카드뮴·구리·수은·니켈·아연·불소·벤젠·톨루엔·자일렌 등 오염물질 농도 실측값을 담은 건별 데이터로, 범위는 충청북도 한 시도이고 지점은 주소 단위로 구분된다. 지자체 담당자나 연구자가 '우리 지역 공장·주거지 부지의 중금속 농도가 해마다 어떻게 변했는가'를 확인해 오염우려부지 관리나 정화 필요성 검토에 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·지역명을 행정구역 이름으로 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: 충청북도 토양오염정보는 연도, 지역명, 주소, 조사구분, 토지용도, 채취일자와 더불어 다양한 오염물질 농도를 조회할 수 있는 환경기초 데이터입니다. 본 데이터는 토양 내 오염물질의 실제 농도값을 제공하여 지역별 토양 위해도 평가, 오염우려부지 사전관리, 토양정화사업 필요성 검토, 오염 경향 파악에 활용됩니다. 행정기관은 이를 기반으로 토양환경보전계획 수립, 오염유형별 관리대책 마련, 재개발·재건축 지역의 환경성 검토를 수행할 수 있으며, 연구자·민간에서는 위해성 분석, 토양오염 예측모델 개발 등 폭넓은 분석·정책 연구에 활용 가능합니다.
