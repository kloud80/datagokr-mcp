summary_user: 한국동서발전 소속 발전소별로 연도마다 발전량(GWh), 일반·지정폐기물 발생량과 재활용량(톤), 발전량당 원단위 발생량, 재활용률을 담은 집계 데이터다. 연구자나 환경 분석가가 "어느 발전소가 발전량 대비 폐기물을 많이 내고, 재활용률은 해마다 어떻게 변했나"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전소명(pwrSta)과 연도를 이름으로 맞춰 잇거나, 같은 기관(한국동서발전)의 발전량 등 다른 데이터와 묶어 쓴다.
limits: 사업자번호나 표준 코드가 없어 폐기물 처리업·배출 사업장 원장과 키로 직접 연결할 수 없고, 발전소명 문자열 매칭에 의존해야 한다. 한국동서발전 발전소만 다루는 집계 통계라 전국 발전사나 건별 처리 내역은 알 수 없다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
