description_portal: 한국동서발전에서 오픈API 형태로 제공하는 발전소별 폐기물 처리 현황 데이터입니다. 이 데이터는 원단위 발생량(발전량 GWh 기준), 일반 재활용량(톤), 지정 재활용량(톤), 재활용률(%), 연도, 발전소명, 발전량(GWh), 일반 발생량(톤), 지정 발생량(톤) 등 핵심 항목으로 구성되어 있으며, 표준화된 인터페이스를 통해 다른 시스템과 쉽게 연계하고 자동화된 데이터 활용이 가능하게 설계되어 있습니다. 이러한 데이터는 학계 및 연구 기관에서 발전소별 자원순환 실태를 정량적으로 분석하고, 폐기물 재활용 효율화 방안, 발전산업의 환경영향 최소화 정책 개발, 자원순환 경제 모델 설계 등 다양한 분야에서 기초 자료로 활용될 수 있습니다.
