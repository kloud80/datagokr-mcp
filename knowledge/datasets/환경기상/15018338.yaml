description_portal: 광주광역시 동구는 환경보호와 지역주민의 건강 증진을 위해 관내 음식물쓰레기 다량배출업소 현황 데이터를 체계적으로 관리하고 공개하고 있습니다. 이 데이터는 음식물쓰레기 발생량이 많은 업소를 투명하게 공개함으로써 환경관리 강화, 책임성 제고, 주민 알권리 충족, 자발적 감량 유도를 목적으로 활용됩니다.데이터에는 주로 상호명, 주소, 연락처 등이 포함되어 있으며, 항목별 역할은 다음과 같습니다.상호명은 해당 업소의 공식 명칭을 나타내며, 주민·행정기관·환경관리 담당 부서가 대상 업소를 명확히 식별하는 데 사용됩니다.주소는 업소의 위치 정보를 제공해 지도 기반 확인, 현장 점검, 배출 관리구역 설정 등 행정적 활용을 가능하게 합니다.연락처는 업소와의 직접 소통을 위한 정보로서, 음식물쓰레기 감량 지도, 현장 관리, 개선 요청 등 행정업무 수행에 필수적입니다.이 정보는 단순 공개를 넘어, 음식물쓰레기 감량 정책 추진, 환경오염 예방, 민원 대응, 지역 환경 개선 등 여러 분야에서 중요한 역할을 합니다. 이를 통해 동구는 지속가능한 생활환경 조성과 친환경 도시 구현을 목표로 효율적인 환경 행정을 수행하고 있습니다.
