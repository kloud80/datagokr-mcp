summary_user: 고양시 안에서 관리되는 폐수배출시설을 사업장 한 곳당 한 행으로 담은 건별 목록이며, 업소명·소재지·전화번호·업종을 포함한 CSV 파일(약 42KB)이다. 주민이나 환경 분석가가 "우리 동네 주변에 어떤 업종의 폐수배출 사업장이 있나"를 확인하거나, 지자체 수질오염원 분포를 파악하는 데 쓴다. 실측 컬럼에 사업자번호·법정동코드 같은 공통 조인 키가 없어서, 다른 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 본 데이터는  물환경보전법 제33조(배출시설의 설치 허가 및 신고) 및 동법 시행규칙 제36조(폐수배출시설 설치허가신청서 등의 서식) 에 따라 관리되는 고양시 폐수배출시설 현황자료입니다.업소명, 소재지, 전화번호등 기본정보를 포함하고 있으며, 수질오염 예방 및 환경관리 행정, 관련 연구 분석을 위한 기초자료로 활용이 가능합니다. (물환경보전법 시행규칙 별표4 에 해당하는 시설로 특정수질유해물질이 포함되지 않은 폐수를 1일 최대 0.1세제곱미터 이상 배출하거나 특정수질유해물질이 포함된 폐수를 1일 최대 0.01세제곱미터 이상 배출하는 사업장, 1일 최대 폐수량이 20㎥ 이하로서 특정수질유해물질 및 광유류(석유 등 광물성원료로부터 얻어진 기름)가 포함되지 아니한 폐수를 「하수도법」제2조제9호 및 제13호에 따른 공공하수처리시설 및 개인하수처리시설로 유입하는 경우는 제외됨.)
