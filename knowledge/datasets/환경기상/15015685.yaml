description_portal: '경상남도내 야생동물이 다쳤을 때 진료가 가능한 야생동물 진료소 운영 현황을 시군,  업체명, 전화번호, 소재지, 위도, 경도, 우편번호, 데이터기준일자 등의 항목으로 정보를 제공합니다.ㅇ구조대상 : ｢야생생물 보호 및 관리에 관한 법률｣ 제2조 제2호 및 같은 법 시행규칙 제2조 별표1의 멸종위기 야생동물, ｢야생생물 보호 및 관리에 관한 법률｣ 제2조 제1호의 야생동물   ※ 개, 고양이 등의 유기애완동물은 동물보호소 이송, 로드킬 등 동물사체는 도로부서에서 처리함.   ※ 야생동물구조관리센터는 「야생생물 보호 및 관리에 관한 법률」에 따른 기후부에서 지정한 센터임.'
