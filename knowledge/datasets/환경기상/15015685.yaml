summary_user: 경상남도 안에서 다친 야생동물을 진료할 수 있는 진료소를 한 곳당 한 행으로 담은 목록 파일로, 시군·업체명·전화번호·소재지·위도·경도·우편번호를 개별 주소·좌표 단위로 제공한다(CSV 약 2.9KB 규모의 소량 목록). 경남 주민이나 구조 담당자가 '다친 야생동물을 발견했는데 우리 시군에서 가장 가까운 진료소는 어디고 전화번호는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 이름으로 행정구역 자료와 맞추거나 위도·경도로 지도·다른 공간 자료와 겹쳐 쓴다.
limits: 표준 코드 같은 전역 조인 키가 없어 다른 데이터와는 시군명 매핑이나 좌표로만 연결된다. 범위는 경상남도 한 도에 한정되며, 진료 실적·구조 건수 같은 운영 통계는 담지 않는다.
