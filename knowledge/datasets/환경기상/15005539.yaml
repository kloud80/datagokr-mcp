summary_user: 의왕시에서 종량제봉투를 파는 지정 판매소를 한 곳당 한 행으로 담은 파일로, 지역(동), 주소, 상호를 담는다. 의왕시 주민이 우리 동네에서 종량제봉투를 어디서 살 수 있는지 확인하거나, 분석가가 동별 판매소 분포와 생활편의 접근성을 살피는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 주소를 지오코딩하거나 동 이름을 매핑해 붙이고, 다른 지자체의 판매소·수거함 파일과도 이름 기준으로 이어 쓴다.
description_portal: 의왕도시공사 종량제 봉투 판매소 현황 데이터는 의왕시 종량제봉투를 판매하는 지정 판매소의 위치 및 기본 정보를 제공하는 공공데이터입니다. 본 데이터는 판매소의 지역(고천동, 오전동 등), 주소, 상호정보를 포함하고 있어, 지역 내 종량제봉투 구매 가능 지점을 확인하고 주민 편의시설 접근성을 파악하는 데 활용할 수 있도록 구성되어 있습니다. 본 데이터는 연간 1회 현행화 되며, 특정 시점의 의왕시 종량제봉투 판매소 운영 현황을 파악할 수 있으며, 데이터를 누적 갱신하여 시계열적으로 판매소 변동 현황을 파악하는 데 활용 가능합니다.
