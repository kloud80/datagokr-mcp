summary_user: 고양시에 신고되어 운영 중인 기타수질오염원 사업장을 업소별로 한 행씩 담은 목록 파일로, 업소명·소재지 주소·전화번호·시설종류를 담는다(약 58KB CSV). 인근 주민이나 분석가가 "우리 동네에 어떤 기타수질오염원 시설이 어디에 있고 어떤 종류인가"를 확인하거나 시설종류별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 업소명으로 맞춰 이어 써야 하며, 다른 고양시 수질오염원·폐수배출시설 목록과 함께 보는 정도로 연계한다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어 업소명·주소 문자열 매칭에 의존해야 한다. 범위가 고양시 한 곳에 한정되며, 전화번호는 사업장에 전화가 없거나 개인정보 사유로 빈칸인 경우가 있다.
