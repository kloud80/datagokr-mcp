description_portal: 본 데이터는 국가환경교육 통합플랫폼에서 제공하는 우수환경도서 선정자료를 기반으로, 환경 분야 독서문화 확산을 위한 정보를 체계적으로 제공하기 위해 구축된 자료입니다.우수환경도서는 환경지식의 축적, 통합적 사고능력 향상, 환경문제 해결 역량 강화에 기여하는 효과적인 일상 환경교육 매체입니다. 1993년부터 매년 연령대별(유아~성인) 환경도서를 심사·선정해 왔으며, 2025년 기준 총 1,195권의 우수환경도서가 선정되었습니다. 이를 통해 국민이 양질의 환경교육 콘텐츠에 쉽게 접근하고, 환경 독서문화가 확산될 수 있도록 지원하고 있습니다.본 데이터는 선정된 우수환경도서 중 주요 정보를 제목, 주제, 작가, 교육대상 기준으로 정리하여 공공데이터로 제공함으로써, 교사·연구자·학부모·도서관·교육기관 등이 필요한 환경 관련 도서를 빠르게 탐색·활용할 수 있도록 돕습니다.
