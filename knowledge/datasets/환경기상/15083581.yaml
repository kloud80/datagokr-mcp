summary_user: 충청남도 계룡시 관내에서 대기오염물질 배출시설을 운영하는 사업장을 한 행에 하나씩 담은 시군구 단위 명부로, 사업장명·사업자등록번호·도로명 소재지·전화번호·대표업종·시설 규모 구분(종)을 담는다(CSV 약 2.4KB의 소규모 파일). 계룡시 주민이 우리 동네 주변에 어떤 대기배출 사업장이 있고 몇 종 시설인지 확인하거나, 분석가가 지역별 대기오염원 분포를 파악할 때 쓴다. 사업자등록번호(bizno)를 키로 다른 인허가 사업장 원장이나 사업자 상태 정보와 잇고, 도로명 소재지로 주소 기반 위치 매칭을 한다.
description_portal: 충청남도 계룡시의 '대기배출시설현황' 데이터는 지역 환경 보전을 위해 관내에서 대기오염물질을 배출하는 시설을 운영하는 사업장들의 정보를 체계적으로 정리한 자료입니다. 이 리스트는 환경 행정의 투명성을 높이고, 시민들이 거주 지역의 환경 안전과 관련된 정보를 쉽게 파악할 수 있도록 제공됩니다. 각 항목은 해당 시설을 관리하는 데 필요한 핵심 정보를 담고 있는데, 시설의 공식 명칭인 사업장명과 고유 식별자인 사업자등록번호를 포함합니다. 또한, 시설의 지리적 위치를 명확히 알 수 있는 도로명소재지와 직접적인 연락을 위한 전화번호가 기록되어 있습니다. 특히, 사업장의 주된 경제 활동을 나타내는 대표업종과 함께, 해당 대기배출시설의 규모나 특성을 구분하는 분류 항목인 종을 명시하여 시설의 성격과 환경적 중요도를 파악할 수 있게 합니다.
