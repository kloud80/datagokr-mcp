description_portal: 환경책임보험의 화학물질시설 상세정보는 해당 시설의 특성과 안전관리 현황을 종합적으로 기록한다. 먼저, 매체시설코드를 통해 시설의 구체적인 유형을 식별하며, 화학물질취급업종분류코드로 취급 업종을 구분한다. 시설에서 사고대비물질을 취급하는지 여부와 그 지정수량 대비 합계, 연간 취급량, 그리고 실제 화학물질 취급량을 함께 기록하여 위험 정도를 평가한다.또한, 장외영향평가 검토번호 및 위해관리계획서 검토번호를 명시하여 법적 검토 및 관리 이력을 추적할 수 있도록 한다. 영업허가대상 여부는 코드로 관리되며, 해당 시설의 삭제 여부, 위해관리계획서 작성대상 여부, 토양오염물질 해당 여부 역시 함께 기재된다. 시설 규모는 코드로 표시되며, 인허가 번호와 보험가입대상 여부가 기록된다.시설의 운영 상태와 관련해서는 시설 삭제 사유, 휴업 시작 및 종료일자, 폐업일자, 인허가 반납 여부 등이 포함되며, 현재 시설 상태는 시설상태코드로 나타낸다. 또한 위해성 방지 조치 여부, 시설 설치 여부를 기록하여 안전관리 현황을 확인한다. 정보의 승인 상태는 승인 코드와 승인 일자로 관리하며, 모든 데이터는 해당 연도를 기준으로 체계적으로 기록·보존된다.
