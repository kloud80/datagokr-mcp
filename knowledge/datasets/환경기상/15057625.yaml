summary_user: 경기도 시군별 물놀이형 수경시설(분수·바닥분수·물놀이터 등)의 설치·운영 신고를 시설 한 곳당 한 행으로 담으며, 시설명·종류·소재지·운영기관·운영기간과 함께 바닥면적, 용수 종류, 저수조 용량, 용수 교체·저수조 청소 주기, 여과기 설치 여부·종류·용량, 소독방법을 포함한다. 보호자나 지자체 위생 담당자가 "우리 동네 바닥분수는 여과기를 갖추고 어떤 방법으로 소독하며 물은 얼마나 자주 갈아주는가"를 확인하거나, 시군별 시설 분포와 위생관리 수준을 비교하는 데 쓴다. 전역 조인 키가 없으므로 시군명(SIGUN_NM)이나 소재지 주소를 이름 기준으로 맞춰 다른 시군 단위 통계나 주소 기반 데이터와 연결해야 한다.
description_portal: 경기도 물놀이형 수경시설 설치·운영 신고 현황 데이터는 분수, 물놀이터, 바닥분수, 조합놀이대 등 물놀이형 수경시설의 설치 및 운영 신고 정보를 담고 있으며, 시군명, 시설명, 수경시설 종류, 운영주체, 소재지 주소, 우편번호, 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 해당 데이터는 수경시설의 위생관리 및 안전 운영 현황을 파악하는 데 활용되며, 특히 여과기 설치 여부와 소독방법은 시설의 수질 안전성 평가에 중요한 지표가 됩니다. 또한 설치·운영 현황과 위치 좌표를 통해 지역별 시설 분포를 비교하거나, 도시공원 관리, 여름철 물놀이 안전정책 수립, 주민 편의시설 확충 계획 등 다양한 분야에서 활용될 수 있습니다.
