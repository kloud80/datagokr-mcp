description_portal: 경상남도 내 화력발전소에서 발생하는 석탄회를 매립·저장하기 위해 설치된 회처리장(석탄회 매립시설)에 대한 주요 정보를 제공하는 데이터입니다. 이 자료는 각 매립시설의 시설명, 위치(주소·지번), 면적(㎡), **매립용량(㎥ 등 원자료 기준)**을 포함하고 있으며, 화력발전소 운영 과정에서 발생하는 석탄회가 어떠한 공간에서 어떻게 처리·관리되는지를 파악할 수 있도록 구성되어 있습니다. 해당 데이터는 지역 내 환경관리, 발전소 운영 현황 분석, 행정기관의 인허가 및 지도·점검, 정책 수립을 위한 기초자료로 활용될 수 있으며, 석탄회 처리시설의 규모 비교, 지역적 분포 파악에도 유용합니다. 전체 자료는 경상남도 공공데이터를 기반으로 하며, 각 시설별 세부 속성을 표 형식으로 정리하여 제공하는 구조를 가지고 있습니다.
