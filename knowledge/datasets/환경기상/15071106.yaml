description_portal: '매년 전국 광역지자체(17개), 기초지자체(229개)의 시도별, 시군구별 및 4대강 수계별(한강, 낙동강, 금강, 영산강)로 양식장 종류에 따라 양식장 업소수와 사료사용량, 시설면적을 조사하여 통계자료로 제공- 제공데이터 : 양식장 종류는 가두리식, 유수식, 지수식, 도전양식 총 4가지로 구분되며, 시도별, 시군구별 및 대권역별, 중권역별로 각 양식장 종류에 따라 업소수와 사료사용량, 시설면적에 대한 자료를 제공* 조사항목의 단위는 업소수는 개소로 표시, 사료사용량은 연간 사용한 사료의 총량으로 킬로그램/년으로 표시하며, 시설면적은 양식장 내 양식시설의 총 면적으로 제곱미터로 표시하여 제공'
