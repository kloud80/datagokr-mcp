summary_user: 한국수자원공사가 소규모 해수담수화 시설의 원수(해수)에 대해 「먹는물 수질기준 및 검사 등에 관한 규칙」에 따라 실시한 법정 수질검사 결과를 채수 건별로 담은 파일이며, 검사년도·취수장·측정지점 주소·채수일자와 붕소·카드뮴·비소·수은·납·크롬 측정값이 들어 있다(다운로드 파일 780바이트의 소규모 자료). 해수담수화 시설 운영자나 수질 분석가가 '이 시설이 끌어오는 해수에서 붕소나 중금속이 얼마나 검출됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 수질 측정 자료와는 취수장명·정수장명·측정지점명 같은 이름이나 측정지점 주소로 맞춰 이어 쓴다.
description_portal: 본 데이터는 한국수자원공사에서 소규모 해수담수화 시설의 원수에 대해 실시한 법정 수질검사 결과를 제공합니다. 검사는 "먹는물 수질기준 및 검사 등에 관한 규칙"에 따라 수행되며, 해수의 수질 적합 여부를 판단하기 위한 목적입니다. 자료에는 시설명, 권역, 검사일자, 수질 항목, 기준값, 측정값 등이 포함됩니다. 본 자료는 해수담수화 운영관리, 수질평가, 수원지 모니터링 등에 활용됩니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/lawData2/?pMENUID=96&ATTR_1=3106
