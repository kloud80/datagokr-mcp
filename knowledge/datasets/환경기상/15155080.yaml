description_portal: '생활쓰레기배출정보 데이터는 자원의 절약과 재활용 촉진에 관한 법률에 따른 지역별 생활쓰레기, 음식물쓰레기, 재활용품 등의 배출에 대한 데이터로 시도·시군구 및 관리구역 정보와 함께 배출장소 유형, 배출방법(생활·음식물·재활용품·일시적 다량폐기물) 등 배출 기준, 배출 요일 및 시간대, 미수거일 정보와 관리부서명·연락처등 관리 정보 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 생활쓰레기배출정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 생활쓰레기배출정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 영상콘텐츠산업과 / 044-203-3240 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
