summary_user: 노후차 운행제한 제도(계절관리제·비상저감조치)의 지역별 단속제외 차량(장애인·국가유공자 차량 및 5등급 차량 수)을 작성일자 기준으로 담는 API이며, 검증 호출에서 전국 읍면동 단위 229행이 수신됐다. 노후차 운행제한 지역에서 장애인·국가유공자 차량이 단속에서 얼마나 제외되는지 알고 싶은 국민이나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역코드명(rgnCdNm)의 이름 매핑이나 같은 기관 코드로만 다른 자료와 잇는다.
description_portal: 본 자료는 미세먼지 저감 및 관리에 관한 특별법 제18조(고농도 미세먼지 비상저감조치), 제21조(계절적 요인 등으로 인한 집중관리 등) 등을 근거로 하여 시행중인 노후차 운행제한에 대한 자료입니다.겨울철(12월~3월)에 시행하는 계절관리제 운행제한과 고농도 미세먼지가 발생하는 날 발령되는 비상저감조치 운행제한 관련 데이터로,계절관리제, 비상저감조치 등 각 운행제한 제도의 발령정보와 지역별 운행제한 단속제외(차상위계층, 장애인 표지발급 차량 등) 정보, 관련기관 주소 등의 정보가 포함되어 있습니다.
