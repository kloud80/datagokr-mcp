description_portal: 폐기물 관리법 제14조에 따른 생활폐기물 처리는 자치구 고유사무로써, 생활폐기물 수집운반에 따른 청소인력 및 청소차량 현황 자료를  자치구별로 취합한 자료이며, 해당 데이터의 세부내용은 광주광역시 관내 자치구별로 환경미화원(가로환경미화원, 가정환경미화원)수과 청소장비 차량대수 및 수거차량 대수 현황자료를 등록한 것임. 가정환경미화원의 경우 종량제, 재활용, 음식물 수거하는 미화원을 말하며, 가로환경미화원은 가로청소를 담당하는 미화원을 말함. 환경미화원은 환경관리원이라고도 말하기도 함.
