description_portal: 지하수 측정망 제원에 대한 정보를 제공합니다. 해당 자료는 구분, 관측소명, 주소, 원시자료명, 원시자료 기관명 등을 제공하고 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있으며, 지하수측정망의 제원정보 및 수위측정 그래프, 수질검사 결과 등의 상세정보를 조회하실 수 있습니다.
