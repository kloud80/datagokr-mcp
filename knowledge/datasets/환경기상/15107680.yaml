description_portal: 본 데이터는 환경정보공개시스템에서 제공되는 연도별 환경정보 현황을 집계·제 공하는 공공데이터입니다. 총 13개 필드("대표사업장명", "사업장명", "업종", "년도", "에너지총량(TJ)", "직접배출량(scope1)", "간접배출량(scope2)", "간접배출량(scope3)", "온실가스배출총량" 등)를 포함하며, 주요 제조업 및 서비스업 사업장의 연도별 온실가스 배출량과 에너지 사용량을 한눈에 파악할  수 있도록 합니다. 이 데이터는 온실가스 배출량 분석, 기업 탄소배출 감축 이행 현황 모니터링, ESG 리포트 작성, 정책 성과 평가 및 연구, 지속가능경영 전략 수립 등에 활용할 수 있습니다. 또한 배출권 거래제 대상 기업의 배출량 비교 및 산업별 배출 특성 분석에도 유용합니다. (단, 업체 요청(정정신청)에 의해 데이터 변동 가능)
