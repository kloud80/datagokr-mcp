summary_user: 마산만 봉암 해역 자동측정소에서 관측일자별로 측정한 수온·염분·전기전도도·수소이온농도(pH)·용존산소량·탁도·클로로필 값을 정점 단위로 담은 시계열 파일(CSV 약 2.6MB)이다. 연구자·지자체 담당자가 "봉암 해역의 여름철 용존산소가 언제 얼마나 떨어지는가"처럼 폐쇄성 수역의 계절별 수질 변화나 정화사업 전후 변화를 확인하는 데 쓴다. 전역 조인 키는 없으며, 다른 해양수질자동측정망 정점 자료와는 정점명·정점코드로 맞추고 기상·하천 자료와는 관측일자를 기준으로 이어 쓴다.
