summary_user: 전국 국립공원에서 조사된 곤충류의 종 관찰 기록을 건별로 담은 파일 데이터로, 검증 시 129,395행을 받았고 생물분류·학명·분류명과 관찰 지점의 경도·위도가 있다. 분석가나 보전 담당자가 특정 곤충 분류군이 국립공원 어느 지점에서 관찰됐는지 파악하는 데 쓴다. 경도·위도 좌표 키로 다른 공간 레이어(보호구역 등 자연·환경 보전 공간 데이터)와 겹쳐 쓰며, 학명이나 분류명으로 다른 생물종 자료와 맞춰 볼 수 있다.
description_portal: '본 데이터는 전국 국립공원에서 조사된 **곤충류(Insecta)**에 대한 생물자원 정보를 수록한 자료로, 공원 내 생물다양성 보전 및 생태계 건강성 평가를 위한 기초 데이터로 활용됩니다. 주요 항목에는 국립공원명, 분류군(예: 나비목, 딱정벌레목 등), 종명(영문), 학명(영문), 국문 분류명, 조사 위치 정보(위도·경도), 조사일자, 개체수, 출현 빈도, 채집 또는 관찰 방식 등의 정보가 포함되어 있으며, 정기적인 공원자원 모니터링을 통해 갱신됩니다. 본 데이터는 멸종위기종 및 외래종의 분포 분석, 특정 서식지의 생태특성 평가, 생물자원 통계 작성, 자연환경 해설 자료 개발, 곤충 중심 생태학 연구 등 다양한 분야에 활용될 수 있습니다. CSV 포맷으로 제공되며, 국립공원 생물자원통합관리시스템(NP-BIMS) 및 GIS 기반 생물분포 시각화 플랫폼과 연계하여 활용 가능합니다.'
