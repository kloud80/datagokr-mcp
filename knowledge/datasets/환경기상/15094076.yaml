summary_user: 경기도 광명시가 정한 대형폐기물 품목별 처리 수수료를 폐기물 구분·품목명·규격·수수료 단위로 담은 CSV 목록 파일이다(약 10KB). 광명시 주민이 소파·장롱 같은 대형폐기물을 버리기 전에 스티커나 온라인 신고로 얼마를 내야 하는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 지자체의 대형폐기물 수수료 파일과는 품목명을 맞춰 비교하는 식으로만 이어 쓴다.
description_portal: "1. 경기도 광명시 대형폐기물 처리 수수료 정보입니다. 폐기물구분, 폐기물명, 폐기물규격, 수수료를 확인할 수 있습니다.2. 수수료 리스트에 없는 폐기물은 크기, 처리난이도 등을 고려하여 리스트의 비슷한 품목의 가격을 준용합니다. 3. 대형폐기물 수수료 납부방법 : 종량제봉투 판매소에서 대형폐기물 처리 스티커 구매 후 폐기물에 부착 또는 온라인(웹사이트 및 어플, '여기로')을 이용한 배출신고 및 결제4. 대형폐기물 수거 안내 : 매주 월요일 ~ 토요일 오전에 수거합니다.5. 대형폐기물 배출 안내 : 매주 일요일 ~ 금요일 저녁에 배출6. 폐가전제품은 무상수거 신청 후 배출가능합니다.(대형 폐가전의 경우 방문 수거 가능)7. 무상수거 신청방법은 관할구역 광명시 청소대행업체 대행 접수 또는 인터넷 사이트(15990909.or.kr)6. 소형폐가전은 광명시 각 동 행정복지센터 소형폐가전 수거함에 배출하시면 됩니다.(아파트의 경우 부지 내 소형폐가전 수거함 설치)"
