summary_user: 경기도 시군별로 설치된 비점오염 저감시설(장치형·저류형·인공습지·LID 등)을 시설 한 곳당 한 행으로 담으며, 시설유형·처리규모·주요 오염원·사업기간·인근 하천명과 국비·도비·시비 예산, 주소와 WGS84 좌표를 포함한다. 하천 수질관리 담당자나 분석가가 "우리 시군 하천 유역에는 어떤 유형의 저감시설이 얼마의 예산으로 들어섰나"를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군명·시군코드(SIGUN_CD)나 하천명으로 이름을 맞춰 다른 수질 측정·오염원 데이터와 연결하거나, 좌표로 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 지역의 비점오염원 저감을 위한 환경시설 현황을 정리한 자료로, 시군별로 설치된 저감시설의 위치, 시설유형, 사업기간, 주요 오염원, 처리용량, 예산(국비·도비·시비) 및 위치정보(WGS84 좌표) 등이 포함되어 있습니다. 데이터는 장치형, 저류형, 인공습지, LID 등 다양한 비점오염 저감시설 유형을 포괄하고 있으며, 수질개선 및 하천환경 보호를 위한 지역별 투자 및 실행 현황을 분석할 수 있습니다. 이 데이터는 도시개발에 따른 환경영향 평가, 하천 수질관리 정책 수립, 환경예산 배분의 정당성 검토, 친환경 인프라 구축 전략 마련 등에 유용하게 활용될 수 있습니다.
team:
