summary_user: 환경영향평가 대상 개발사업의 사업구역별 수리수문 평가 결과를 담은 파일로, 소유역 단위로 면적과 개발 전·중·후 홍수유출량, 산정빈도, 영구저류지 설치 전후 첨두홍수량을 기록한다. 개발사업이 하류 홍수량을 얼마나 늘리는지, 저류지가 첨두홍수량을 얼마나 줄이는지 확인하려는 분석가·지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 다른 환경영향평가 데이터(협의 현황·사업구역 등)와 사업코드를 이름·코드 매핑으로 맞춰 연결한다.
description_portal: 환경부 환경영향평가 사업의 수리수문에 대한 사업구역을 기준으로 하천사업의 속성(부피(m3), 연장(km), 면적(km2), 사업위치, 총연장(km), 사업구분) 정보와 사업구역을 기준으로 면적사업의 속성(산정빈도(년), 홍수유출량 개발전(m3/s), 홍수유출량 개발중(m3/s), 홍수유출량 개발후(m3/s), 홍수유출량 산정빈도(년), 영구저류지의 홍수량 저감효과 개발후 저류지 설치 전 첨두홍수량(m3/s), 영구저류지의 홍수량 저감효과 개발 후 저류지 설치 후 첨두홍수량(m3/s))을 정보를 제공하는 서비스입니다.
