summary_user: 부산 7개 해수욕장(광안리·다대포·송도·송정·일광·임랑·해운대)의 지점별 해수 채취 수질검사 결과를 측정 건별로 담는다. 측정연월·측정회차, 장구균·대장균 측정값과 적합/부적합 평가가 들어 있다. 해수욕객이나 관광 분석가가 '이번 여름 해운대 해수욕장 수질이 개장 중에 적합 판정을 받았나'를 확인할 때 쓰고, 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 해수욕장 이름이나 측정지점 이름을 매핑해야 이어 쓸 수 있다.
description_portal: 여름 휴가철 많은 관광객이 찾아와 휴가를 즐기는 부산의 대표 관광휴양지인 광안리, 다대포, 송도, 송정, 일광, 임랑, 해운대 등 7개 해수욕장의 해수를 채취하여 수질 검사한 데이터를 개방합니다.광안리 5, 다대포 3, 송도 3, 송정 5, 일광 3, 임랑 3, 해운대 5개 지점에서 해수를 채취하여 해수욕장 개장전, 개장중, 폐장 후 등의 수질 측정 데이터를 개방합니다.개방된 데이터는 측정연월일, 측정횟수, 측정지점, 장구균 측정값, 대장균 측정값, 수질평가 자료 등의 데이터가 포함되어 있습니니다.검사 결과 장구균, 대장균의 검출량에 따라 적합/부적합 여부를 판정하여 해수욕장 이용에 참고자료로 사용할 수 있습니다.
