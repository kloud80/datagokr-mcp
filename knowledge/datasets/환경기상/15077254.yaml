summary_user: 군포시가 소규모 사업장 대기오염방지시설 설치 비용을 지원한 업체를 업체 한 곳당 한 행으로 담은 파일로, 상호명·소재지주소·전화번호·방지시설 종류·데이터기준일자를 제공한다. 군포시 안에서 어떤 사업장이 어떤 종류의 방지시설을 지원받아 설치했는지 확인하려는 주민이나 지역 대기 배출원 관리 현황을 살피는 분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 소재지주소나 상호명을 맞춰 연결해야 한다.
description_portal: 군포시 소규모 사업장 대기오염방지시설 설치 지원사업 해당업체 현황으로 상호명, 소재지주소, 연락처, 방지시설종류, 데이터기준일자 항목을 제공합니다.2023년 이후 사물인터넷 설치지원사업으로 인해 방지시설 지원은 없었습니다. RE100정책에 따라 방지시설 설치지원사업이 시행되면 업데이트하여 제공합니다.소규모사업장 대기오염방지시설 지원사업은 중소기업 및 영세 사업장에 배출되는 대기오염물질을 줄이기 위해 군포시가 서맃비용읠 일부를 지원하는 환경정책 사업입니다.
legal_basis_portal: 사물인터넷 지원사업을 시행한 공문서, 대기배출시설 사업장 인허가 증명서 등
