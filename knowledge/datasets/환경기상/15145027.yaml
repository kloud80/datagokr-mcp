summary_user: 서울 광진구 홈페이지에 띄운 대형폐기물 관련 팝업 공지를 공지 한 건당 한 행으로 담은 파일(csv 약 2.4KB)로, 관리코드·제목·공지내용과 공지등록일·팝업 게시 시작일·종료일이 들어 있다. 광진구 주민이나 안내 서비스 개발자가 '대형폐기물 배출 절차나 수거 일정에 대해 구가 어떤 안내를 언제부터 언제까지 게시했나'를 확인하는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없으므로, 광진구 대형폐기물 품목·수수료 같은 같은 기관 파일과는 기관명이나 내용 텍스트를 기준으로 맞춰 함께 본다.
