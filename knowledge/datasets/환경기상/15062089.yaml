summary_user: 장성군 관내 사업장폐기물 배출자 신고를 사업장 건별로 담은 원장 파일로, 상호·사업자등록번호·신고일·폐기물 종류·운반자·처리업소명·처리방법·지번주소가 들어 있다. 지자체 점검 담당자나 환경 분석가가 장성군의 특정 사업장이 어떤 폐기물을 누구에게 맡겨 어떤 방법으로 처리하는지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태나 폐기물 처리업 허가 현황과 잇고, 사업장 지번주소로 지역 단위 위치 분석에 붙인다.
description_portal: '데이터 기준일자 : 2026. 03. 19.본 데이터는 관내 사업장에서 발생하는 폐기물에 대한 배출자 신고현황을 제공하는 환경 통계 데이터로 상호명, 사업자등록번호, 신고일, 생활계구분, 폐기물종류, 운반자, 처리업소명, 처리방법, 사업장 주소가 포함되어 있습니다.이 데이터는 지자체와 환경 당국이 관내 폐기물 발생원과 이동 경로를 추적·관리하고, 불법 투기를 예방하기 위한 환경 지도 점검의 기초 자료로 활용됩니다. 또한 학계 및 환경 연구 기관의 지역별 산업폐기물 발생 동향 분석, 재활용률 제고 방안 연구, 친환경 자원 순환 정책 수립에 필수적인 지표로 활용할 수 있습니다.'
