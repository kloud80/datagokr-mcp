summary_user: 광주 광산구 관내에서 생활폐기물 수집·운반을 대행하는 업체를 업체별로 한 줄씩 담은 원장으로, 사업장명·주소·등록일자·위도·경도·기준연도가 들어 있으며 파일 크기가 267바이트로 몇 건 안 되는 소규모 목록이다. 광산구 주민이나 사업자가 대량 생활폐기물 배출이나 수거 구역 문의 때 정식 대행업체가 어디인지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 위도·경도 좌표로 이어 쓰며, 광산구의 대형폐기물·수거함·종량제 판매소 같은 수거 지점 데이터와 지도에서 함께 보는 식이다.
description_portal: 광주광역시 광산구 내 생활폐기물 수집 및 운반 대행업체 현황에 대한 자세한 정보는 공공데이터포털을 통해 확인하실 수 있습니다. 해당 데이터셋은 광산구 관내에서 생활폐기물 수집·운반을 대행하는 업체들의 정보를 포함하고 있으며, 이 데이터를 통해 대량의 생활폐기물 배출이나 수거 구역 관련 문의가 필요할 때, 우리 동네를 담당하는 정식 대행업체가 어디인지 정확하게 확인하고 소통할 수 있는 창구가 됩니다. 주요 항목으로는 업소명, 도로명 주소, 등록일자 등이 포함되어 있습니다. 이 데이터는 2025년 5월 30일에 최신화되었으며, 연간 주기로 갱신됩니다.기타 궁금하신 사항은 광산구청 청소행정과로 문의바랍니다.
