summary_user: 경기도 시군별·연도별(crtr_yr)로 토지이용실태조사 대상 건수와 면적(천㎡), 이용목적 적합·부적합(미이용·타목적 이용) 현황, 불법임대·불법신탁 조사 결과를 건수와 면적으로 집계한 자료다. 지자체 담당자나 분석가가 "우리 시군에서 허가받은 목적과 다르게 쓰이거나 방치된 토지가 얼마나 되나"를 확인하고 사후 조치·정책 수립의 기초로 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(sigun_nm)과 연도를 이름으로 맞춰야 다른 시군 단위 통계와 이을 수 있다.
description_portal: 이 데이터는 경기도 내 각 시군을 대상으로 실시한 토지이용실태조사 및 이에 따른 사후처리 현황을 집계한 자료입니다. 조사대상건수와 면적을 기준으로, 해당 토지가 본래의 이용목적에 적합하게 사용되고 있는지 여부를 평가하며, 이용목적 적합 또는 부적합(미이용·타목적 이용) 여부에 따라 분류됩니다. 또한 불법임대 및 불법신탁에 대한 조사 결과도 포함되어 있습니다. 각 항목은 건수와 면적(천㎡) 단위로 구성되어 있으며, 토지이용 실태에 대한 관리와 불법 이용 실태 파악, 사후 조치 여부 판단, 정책 수립의 기초자료로 활용될 수 있습니다.
