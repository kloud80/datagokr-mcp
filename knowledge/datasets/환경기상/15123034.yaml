summary_user: 2022년 전기차 구매보조금의 공고대수·접수대수·출고대수를 시도와 지역구분, 차종, 접수방법별로 묶은 집계 파일로, 전국 시도 단위를 다룬다. 전기차 구매 예정자나 분석가가 '우리 지역은 보조금 공고 물량 대비 일반 접수가 얼마나 몰렸고 실제 출고는 몇 대였나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·지역 이름을 맞춰 붙여야 한다.
description_portal: '지역별 전기 자동차 등록 및 보조금 신청 현황: 해당 데이터는 전국 전기차 구매보조금 지급현황(공고대수, 접수대수, 출고대수 등) 관련 정보입니다.항목: 시도,지역구분,차종,접수방법,2022년 공고대수(전체)2022년 공고대수(우선순위)2022년 공고대수(법인_기관)2022년 공고대수(택시)2022년 공고대수(일반)2022년 접수대수(우선순위)2022년 접수대수(법인_기관)2022년 접수대수(택시)2022년 접수대수(일반)2022년 출고대수업무체계분류: 환경, 대기중장기 개방 대상 여부: 해당없음개별포털 등록여부: 아니오전기차 이용자 및 구매 예정자 분들에 대한 유용한 공공데이터로 제공드리는 자료입니다.자료 관련 추가 문의사항이나 요청사항은 한국환경공단 친환경모빌리티처 자동차환경계획부로 문의부탁드립니다.감사합니다.'
