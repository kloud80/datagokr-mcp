description_portal: 토양오염실태조사는 토양오염이 우려되는 지역(산업단지 및 공장지역, 공장폐수 유입지역 등)을 대상으로 매년 시행합니다.부산시에서 당해년도에 부산지역의 토양오염실태조사를 시행한 장소 중 토양오염우려기준을 초과한 지역의 현황입니다. 조사지역 종류, 조사지역명, 시도, 시군구, 읍면동, 지번, 토지지목, 지역구분, 면적, 조사일자, 시료깊이, 조사항목, 오염도 항목에 대한 정보를 제공합니다.토양오염우려기준은 지역구분에 따라 기준 수치가 다르며, 토양오염우려기준 물질 목록 및 지역구분에 대한 설명 등 자세한 내용은 토양환경보전법을 참고하여 주시기 바랍니다.
