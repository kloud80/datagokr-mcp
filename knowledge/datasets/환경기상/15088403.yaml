description_portal: 본 데이터셋은 한국수자원공사가 전국 지하수 이용 현황을 연도별로 집계·제공하는 통계자료이다. 허가, 신고, 기타로 구분된 지하수 시설 수와 연간 이용량을 포함하며, 시기별 이용 규모 변화와 유형별 특성을 파악할 수 있다. 데이터는 전국 단위에서 수집되어 지역 간 비교와 장기 추세 분석이 가능하며, 수자원 관리정책 수립과 이용 규제 개선의 근거자료로 활용된다. 또한 산업, 농업, 생활 등 다양한 부문의 수요 변화를 반영하여 지속가능한 물 이용 전략과 환경 보전 방안 마련에 기여한다. 이 자료는 연구기관, 정책 담당자, 지자체 등 다양한 주체가 지하수 이용 현황을 종합적으로 이해하고 합리적 의사결정을 내리는 데 참고할 수 있도록 구성되었다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있다.
