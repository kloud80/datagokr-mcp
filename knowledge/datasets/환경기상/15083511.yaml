summary_user: 광주광역시 서구(현 전남광주통합특별시 서구)에 등록된 폐수배출시설을 업소 한 곳당 한 행으로 담고, 업소명·도로명/지번 소재지·종별을 기록한 CSV 파일(약 13KB)이다. 지역 주민이나 환경 분석가가 '우리 동네 주변에 어떤 종별의 폐수배출업소가 어디에 있는가'를 확인하거나 서구 내 수질 오염원 분포를 지도로 그리는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 업소명을 매칭하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 광주광역시 서구에 등록된 폐수배출시설에 대한 정보를 담고 있으며, 해당 시설의 연번, 업소명, 소재지(도로명주소, 지번주소), 종별 등의 항목으로 구성되어 있습니다.각 사업장의 위치정보(도로명 및 지번), 시설의 종류별 구분, 등록 현황 등이 포함되어 있어, 지역 내 환경오염원 분포 파악, 수질 관리, 환경 감시 및 행정처리 업무에 활용됩니다.또한 관련 산업계에서는 환경영향평가, 배출업소 위치 모니터링, 환경 정책 수립 자료로도 활용할 수 있으며, 연 1회 주기로 갱신되어 최신성을 유지하고 있습니다.데이터는 CSV 형식으로 제공되며, 공공성과 활용성이 높은 환경 행정 기반자료입니다.
