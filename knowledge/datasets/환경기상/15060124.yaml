description_portal: 전북특별자치도 장수군 사업장폐기물 배출자 신고현황에 대한 데이터를 제공하고자 합니다.데이터의 구성은 상호, 신고일, 폐기물 종류, 운반자, 처리구분, 처리업소명, 처리방법, 사업장도로명주소, 성상구분, 제조공정, 데이터 기준일자로 구성되어 있습니다.신고일은 2003년부터 2025년까지로 구성되어 있으며, 폐기물 조유는 폐합성고무류, 하수처리오니, 폐활성탄, 폐콘크리트, 폐합성수지류, 폐석재류, 동물성잔재물, 무기성오니류, 동물털, 그 밖의 폐기물 등 여러 종류의 데이터로 구분되어 있으니 사용시 참고하시기 바랍니다.
