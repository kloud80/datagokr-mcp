summary_user: 춘천시가 운영하는 생활쓰레기 배출장소를 지점 한 곳당 한 행으로 담은 건별 파일로, 지번주소·법정동·권역과 위도·경도, 일반쓰레기·음식물·재활용품별 배출규칙과 수거일·수거 시간대, 미수거일을 함께 싣는다. 춘천 주민이 '우리 집 근처 배출장소는 어디이고 음식물쓰레기는 무슨 요일 몇 시에 수거하나'를 확인하거나, 생활 서비스 사업자가 지도 기반 배출 안내를 만들 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 법정동 이름이나 위도·경도 좌표로 공간 매칭해 이어 쓴다.
