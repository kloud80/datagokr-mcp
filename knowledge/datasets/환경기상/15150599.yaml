summary_user: 시도별로 지정된 황사 관측 지점(시도당 종관기상대 1곳)에서 황사가 관측된 날짜를 시도·관측일자 단위로 담은 전국 목록이며, 기상청 날씨누리 황사일자를 대기질 분석용으로 형식만 바꾼 파일입니다. 대기환경 분석가가 "황사 기간을 빼면 우리 시도의 미세먼지 평균 농도는 얼마인가"처럼 국외 유입 영향과 국내 자체 발생 영향을 구분할 때 씁니다. 전역 조인 키는 없어서, 시도명과 관측일자를 기준으로 에어코리아 측정소별 일·시간 대기질 농도 자료에 이름 매핑으로 붙여 씁니다.
limits: 시도명과 날짜 두 항목만 있어 황사 강도·지속시간·농도 값은 이 파일에 없습니다. 표준 행정코드 같은 공통 키가 없어 다른 데이터와는 시도 이름을 맞춰 연결해야 하며, 원시 황사일자는 기상청 날씨누리에서 확인해야 합니다.
