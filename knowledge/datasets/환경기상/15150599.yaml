description_portal: 본 자료는 기상청 날씨누리(https://www.weather.go.kr)에서 제공하는 시도별 황사가 발생한 일자 정보입니다.대기환경분야에서는 국외에서 유입되는 영향과 국내 자체에서 발생하는 영향을 구분하는데 주로 사용되며, 황사기간을 제외한 오염물질의 평균 농도는 대기환경측정망 설치운영지침을 기반으로 산출하고 있습니다.지정된 황사 관측 측정소는 시도 단위로 1개씩 존재하고 있으며, 특별시와 광역시를 제외한 도청 소재지 기준으로 종관기상대(ASOS) 사용을 원칙으로 하고 있습니다.* 서울(108), 부산(159), 대구(143), 인천(112), 광주(156), 대전(133), 울산(152), 세종(131), 경기(119), 강원(93), 충북(131), 충남(177), 전북(146), 전남(165), 경북(136), 경남(155), 제주(184)* 대기질 농도 데이터와 연계 분석을 위하여 일부 데이터 형식을 수정하였으며, 황사일자 원시 자료는 기상청 날씨누리에서 참고
