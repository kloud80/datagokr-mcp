description_portal: 한국동서발전에서 운영 중인 각 발전소의 대기오염물질 배출정보 데이터는 발전소에서 발생하는 주요 대기오염물질의 배출 특성과 배출량을 정량적으로 기록한 자료입니다. 해당 데이터는 ‘일대기 배출정보’와 ‘대기감시판’ 두 가지 형식으로 제공되며, 발전출력량(MW), 아황산가스 수치(ppm), 질소산화물 수치(ppm), 먼지 수치(mg/S㎥), 일산화탄소 수치(ppm), 산소 농도(%), 유량(S㎥), 온도(℃), 유속(m/s) 등 실시간 또는 일별 측정 항목과 함께, 아황산가스·질소산화물·먼지·일산화탄소의 배출량(kg) 정보가 포함되어 있습니다. 이 데이터는 각 발전소의 환경관리 수준을 평가하고, 대기오염 저감 설비의 효과성 검토 및 배출 추세 분석을 위한 핵심 자료로 활용될 수 있습니다. 학계 및 연구기관에서는 이를 통해 발전소별 대기오염물질 배출 경향 분석, 발전출력 대비 배출계수 산정, 계절별 또는 시간대별 배출량 패턴 분석, 대기오염 확산 모델링 연구 등을 수행할 수 있습니다.
