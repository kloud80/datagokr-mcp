summary_user: 경기도 관할에서 지정된 녹색기업을 업체 한 곳당 한 행으로 담는 원천 목록으로, 업체명·대표자·업종, 최초 지정일과 지정기간, 중소기업 여부, 지번·도로명 주소와 위경도 좌표를 포함한다. 환경정책 담당자나 분석가가 경기도 시군별로 녹색기업이 어디에 얼마나 분포하는지, 지정기간이 곧 끝나는 기업이 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 시군명·시군코드(SIGUN_CD)나 업체명 매칭, 또는 좌표를 이용한 공간 결합으로 다른 경기도 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 관할 내에서 환경관리 실적이 우수하고 자발적인 환경개선을 실천한 사업체를 대상으로 지정된 녹색기업의 현황을 제공하는 자료입니다. 데이터는 각 기업의 업체명, 대표자명, 업종명, 최초 지정일, 지정기간, 중소기업 여부, 소재지 주소(지번 및 도로명), 위경도 좌표(WGS84), 연락처 등의 정보를 포함하고 있으며, 환경경영 우수기업의 지역별 분포와 환경정책 반영 실태 등을 분석하는 데 활용될 수 있습니다. 또한 기업정보를 기반으로 한 정책지원 대상 기업 선별, 환경산업 발전 기초자료, 지역 환경 인프라 개발 참고자료 등으로의 응용이 가능합니다. 데이터는 연간 단위로 갱신되며, XML 또는 JSON 포맷으로 제공되는 Open API 형태로 제공되므로 실시간 연계 및 시스템 활용이 가능합니다.
