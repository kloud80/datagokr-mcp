description_portal: '이 데이터는 영양군 관할 구역 내의 다중이용시설물에 대한 정보를 제공합니다. 각 시설은 시설군(예: 노인요양시설, 어린이집, 의료기관 등)별로 구분되며, 시설명, 도로명주소, 연락처, 연면적 등의 주요 정보를 포함하고 있습니다. 본 자료는 재난·재해 시 대피, 안전관리, 시설자원 배치 등을 위한 기초자료로 활용될 수 있으며, 지역 사회의 인프라 현황과 안전관리 대상 시설을 한눈에 파악할 수 있도록 구성되어 있습니다. 데이터 기준일자는 최신화 주기를 나타내며, 행정기관 또는 관련 부서에서 관리합니다.'
