description_portal: '매년 전국 광역지자체(17개), 기초지자체(229개)중 축산농가가 있는 시도별, 시군구별 및 4대강 수계별(한강, 낙동강, 금강, 영산강)의 축산 농가에서 사육하고 있는 축종별(한우(소), 유우(젖소), 돼지, 마필(말), 산양(염소포함), 면양(육양포함), 사슴, 개, 닭, 오리, 타조, 가금기타 등 총 12종) 사육두수에 대해 조사한 결과를 통계로 작성하여 제공- 제공 데이터 : 시도별 축종별 사육두수, 시군구별 축종별 사육두수, 대권역(4대강 : 한강, 낙동강, 금강, 영산강)별 축종별 사육두수, 중권역별 축종별 사육두수 - 데이터 추가 설명 :  한우(소)는 한우와 육우 포함, 일반 가정집 애완견은 조사대상에서 제외, 유기견 보호센터는 조사대상 포함'
