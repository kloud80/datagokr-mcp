summary_user: 경기도에 등록된 환경컨설팅회사가 자사 실적을 자가점검해 낸 신청 건별 자료로, 사업장명·사업자번호·업종·등록구분·처리상태와 함께 최근 3개 실적연도의 분야별(대기·수질·소음진동·폐기물·환경경영·기타) 실적 건수와 금액을 담는다. 지자체 담당자나 분석가가 "어느 컨설팅회사가 대기·수질 분야에서 최근 3년간 실적이 꾸준히 늘었나"처럼 업체별 전문 분야와 성장 추이를 비교해 위탁 대상을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업자번호(bizregno)나 사업장명 매핑으로만 맞춰 볼 수 있다.
description_portal: 이 데이터는 경기도에 등록된 환경컨설팅회사들이 자사 실적을 환경 분야별로 자가점검하여 등록한 자료로, 각 업체가 수행한 환경영향평가, 수질, 대기, 폐기물, 환경경영 등의 분야별 실적 연도별 금액을 포함합니다. 주요 항목으로는 신청연도, 사업장명, 사업자번호, 업종코드, 업종명, 등록구분, 신청일, 처리상태, 등록일 외에도 실적년도와 분야별 실적금액(환경영향평가, 수질, 대기, 폐기물, 환경경영, 기타 등)이 3개 연도에 걸쳐 기록되어 있으며, 실적금액은 각 환경 분야에서 수행한 컨설팅 또는 기술지원의 결과를 수치로 표현한 것입니다. 이 데이터는 각 환경컨설팅회사의 전문영역, 연도별 성장 추이, 특정 분야 집중도 등을 분석하는 데 유용하며, 지방정부의 환경사업 위탁 선정 및 민간 전문기관 역량 평가 기준으로도 활용될 수 있습니다.
