description_portal: '본 데이터는 국립공원공단이 해양형 국립공원(예: 한려해상, 다도해해상 등)에 배치된 선박 및 관련 장비를 체계적으로 관리하기 위해 구축한 분류 코드 체계 정보입니다. 선박장비의 유형별 식별 및 분류 체계를 기반으로 하며, 분류명, 분류 코드, 분류 레벨(대분류, 중분류, 소분류 등), 상위 분류 코드 및 명칭, 분류 설명 등의 항목으로 구성되어 있습니다. 본 데이터는 장비의 특성별 자산관리, 정비이력 관리, 운용 통계 수집, 예산 편성 및 정책 기획 등에 활용되며, 선박(관리선, 순찰선, 구조선 등)과 부속 장비(구명장비, 통신장비, 항해장비 등)를 체계적으로 구분하여 관리할 수 있도록 설계되어 있습니다. 구조화된 분류체계를 통해 국립공원 내부 자산 시스템 및 연계 정보시스템 간 호환성을 확보할 수 있습니다.'
