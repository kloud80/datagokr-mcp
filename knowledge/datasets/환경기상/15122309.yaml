description_portal: 이 데이터는 해양수산부에서 국가해양환경교육센터 온라인 플랫폼 과정 세부내용에 대한 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 국가해양환경 온라인 플랫폼에서 개설된 교육과정의 과정명, 차수, 개설기간, 교육대상, 과정 목표, 과정별 교육 내용, 수료 기준 및 각 차수별 상세 일정, 교육 운영 관련 세부 정보로 구성되어 있습니다.  본 데이터는 해양환경 관련 교육 프로그램 현황 파악, 연도별·차수별 교육과정 비교, 교육운영 계획 수립, 정책자료의 기초 자료로 활용될 수 있습니다. 예를 들면 해양환경 교육 프로그램 개발 및 개선, 관련 정책 추진을 위한 참고자료, 과거 교육 이력 확인 등에 활용할 수 있습니다.
