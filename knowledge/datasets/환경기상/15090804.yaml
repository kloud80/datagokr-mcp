summary_user: 인천광역시 서구의 쓰레기 종량제봉투 종류별 도매·소매 단가와 사용 여부를 봉투 종류 단위로 담은 시군구 범위의 소규모 파일(csv 약 2KB)이다. 주민이 생활폐기물을 버릴 때 몇 리터 봉투를 얼마에 사야 하는지 확인하거나, 판매소·분석가가 봉투 가격과 도매·소매 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 종량제봉투 판매소·대형폐기물 파일이나 다른 지자체 단가 파일과는 지역코드나 봉투 종류 이름을 맞춰 붙여야 한다.
