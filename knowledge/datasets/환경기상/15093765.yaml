summary_user: 경상남도 함안군에서 가전제품·가구·침구류 같은 대형폐기물을 버릴 때 내는 처리 수수료를 품목(폐기물 구분·명·규격)별로 한 행씩 담은 작은 CSV 파일(약 3KB)이다. 함안군 주민이 장롱이나 냉장고를 버리기 전에 규격별로 수수료가 얼마인지 확인하는 데 쓰고, 목록에 없는 품목은 가장 비슷한 품목의 수수료를 기준으로 삼는다. 전역 조인 키가 없어 다른 지자체의 대형폐기물 수수료 파일과는 품목명·규격을 직접 맞춰 비교해야 하고, 함안군 다른 데이터와는 같은 기관 기준으로만 이어 쓴다.
description_portal: 경상남도 함안군에서 배출되는 대형폐기물(가전제품, 가구, 침구류 등)의 처리를 위해 지불해야하는 수수료 정보입니다.해당 수수료 정보는 함안군 폐기물관리에 관한 조례에 나와있으며해당 내역에 없는 품목의 경우 가장 유사한 품목의 수수료로 납부하게 되어있습니다.대형폐기물은 읍면사모소 방문, 인터넷으로 신청이 가능하며26년 이후에는 앱을 통해 신청 및 결제가 가능하게 됩니다.
