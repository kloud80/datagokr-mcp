summary_user: 대구광역시 서구에서 벙커C유를 쓰는 사업장을 업소별로 정리한 현황 파일로, 업소명·소재지·위도·경도·전화번호·생산품을 담으며 원본 CSV가 158바이트에 불과해 수록 업소는 몇 곳 안 된다. 서구 주민이나 분석가가 '우리 동네 어디에 중유를 때는 사업장이 있고 무엇을 생산하나'를 지도 위에서 확인할 때 쓴다. 사업자번호 같은 전역 조인 키는 없으므로 업소명·주소를 대기배출시설 인허가 목록 등과 이름 매칭하거나 위도·경도로 대기질 측정소 자료와 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 대구광역시 서구 내 사업장 중 벙커C유 사용 현황이며 업소명, 소재지, 위도, 경도, 전화번호, 생산품 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 내 벙커C유를 사용하는 사업체에 대한 정보를 수록한 현황 자료이다. 항목에는 업소명, 사업장 주소, 위도 및 경도 좌표, 전화번호, 주요 생산품 등이 포함되어 있으며, 해당 연료를 사용하는 업소의 위치 및 산업 유형을 파악할 수 있도록 구성되어 있다. 벙커C유는 산업용 보일러 등에 사용되는 중유로, 본 자료는 에너지 수요 및 환경 관련 정책 수립 시 기초자료로 활용 가능하다. 특히 사업장의 공간 정보가 함께 제공되어 위치 기반의 분석 및 관리를 가능하게 하며, 지역 내 에너지 소비 산업체의 분포를 이해하는 데 유용하다. 본 데이터는 행정 목적뿐만 아니라 관련 민간 분야의 정보 접근성 향상을 위해 공개된다.
