description_portal: '2018년 12월 5일에 발사된 천리안위성 2A호는 천리안위성 1호의 기상관측 역할을 승계하는 차세대 정지궤도 기상위성으로 기상 및 우주기상 관측임무를 수행합니다.천리안위성 2A호는 16개의 기본채널 관측을 통해 52종의 기상산출물을 생산하며, 국내에서 개발한 우주기상 탑재체로 우주기상 감시 및 위성 운영과 관련되는 현상을 관측합니다.이로써 우리나라의 기상관측, 수치예보, 기후감시, 우주기상감시의 역량을 강화했습니다.생산주기: - 전구/동아시아: 매시 정각부터 10분 간격                  - 한반도: 매시 정각부터 2분 간격보유기간: 2019년 7월 ~ 현재'
