summary_user: 천리안위성 2A호가 16개 기본채널 관측으로 만든 기상산출물을 조회하는 외부 API로, 포털 설명상 전구·동아시아는 10분, 한반도는 2분 간격으로 생산되고 2019년 7월부터 보유하며 범위는 전국·비공간 자료로 분류된다. 예보·기후 분석가가 특정 시각 한반도 상공의 구름·대기 상태를 위성 영상과 산출물로 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 확인되지 않아, 관측 시각이나 같은 기관(기상청) 자료의 이름·코드 매핑으로만 지상 관측(ASOS·AWS) 등과 연결한다.
