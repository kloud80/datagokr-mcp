description_portal: 폐기물부담금 자발적 협약제도에 따라 협약을 체결한 단체별 연도별 실적을 정리한 자료입니다.데이터에는 각 실적연도, 협약을 체결한 단체명, 그리고 해당 단체와 협약을 맺고 실적을 제출한 재활용 업체 수, 출고수입 업체 수, 두 가지 실적을 모두 제출한 복합 협약 업체 수가 포함되어 있습니다. 이를 통해 각 협약단체가 얼마나 많은 업체와 협약을 맺었는지, 재활용이나 수입·출고 실적을 관리하고 있는지 확인할 수 있습니다.이 데이터는 자발적 협약 이행 실태 파악, 단체별 참여도 분석, 제도 개선 방향 설정 등에 활용될 수 있습니다. 특히 재활용 의무 대상 품목에 대한 민간 차원의 참여와 실천 현황을 객관적으로 보여주는 자료로서 의미가 있습니다.
