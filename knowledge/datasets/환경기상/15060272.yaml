summary_user: 대구광역시 중구 관내 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 목록 파일로, 상호·도로명주소·배출 폐기물 종류(폐합성수지류, 음식물류폐기물 등)를 담고 포털 설명상 38건 규모다. 중구 안에서 어떤 사업장이 어떤 종류의 사업장폐기물을 배출한다고 신고했는지 확인하려는 주민·수집운반업체·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명주소를 이름 매칭하거나 주소를 지오코딩해 이어 쓴다.
description_portal: 대구광역시 중구 관내의 사업장폐기물 배출자 신고현황(연번, 상호,  사업장 도로명주소, 각종 취급 폐기물종류)의 정보를 제공합니다.- 데이터 기준일자 38건의 현황 데이터를 포함하고 있습니다.- 폐기물 종류는 폐합성수지류, 음식물류폐기물, 폐합성고무류 등으로 구성되어 있습니다.- 사업장폐기물 배출자 신고는 사업장에서 발생하는 폐기물의 종류와 양을 관할 행정기관에 신고하는 절차를 말합니다. 이는 폐기물의 적절한 관리와 처리를 위해 필요한 절차이며,  폐기물 관리 정책 수립과 환경 보호를 위한 기초 자료로 활용되기도 합니다.
