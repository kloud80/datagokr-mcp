description_portal: '본 데이터는 플라스틱 감축, 1회용품 저감, 자원순환 촉진 등 환경보호와 사회적 가치 실현을 위해 다양한 기업·단체가 참여한 ‘자발적 협약’의 체결 현황을 제공합니다. 최근 강조되는 ESG(환경·사회·지배구조) 경영, 탄소중립(Net Zero), 제로웨이스트(Zero-Waste), 녹색소비(Green Consumption), 필(必)환경 경영* 등 사회적 이슈를 적극 반영하고 있으며, 실제 데이터에는 식품, 유통, 프랜차이즈, 소상공인, 협회 등 다양한 민‧관 주체의 협력 사례와 대한민국 정부(환경부 등)와 연계된 친환경 실천 내용이 구체적으로 담겨 있습니다.주요 항목순번: 각 협약의 고유 번호(관리 및 정렬용)협약명: 자발적 협약의 공식 명칭(플라스틱 감축, 1회용품 저감, 장바구니 활성화 등)협약일자: 체결 날짜(YYYY-MM-DD)참여기업 목록: 개별 협약에 참여한 기업, 단체(실명 또는 ‘등’으로 구분)협약 내용(요약): 플라스틱 감소, 재생자원 활용, 친환경 제품 확대, 자원순환 캠페인, 녹색소비 실천, ESG·탄소중립 실천 등 구체적 행동 목표 및 활동 내용 서술※ 최근 사회적 이슈와 맞물린 데이터로, ESG 평가, 환경 정책 분석, 친환경 사회 구현, 기업의 사회적 책임(CSR) 관리 등 다양한 영역에서 활용이 가능합니다. ※ 데이터의 시의성·정확성 제고를 위해 업데이트 주기를 단축하거나, 정기 업데이트 체계로 전환하여 관리하는 것을 권장합니다.'
