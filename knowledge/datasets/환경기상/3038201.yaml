summary_user: 경기도 이천시의 수질오염총량관리제에 따른 유역별 개발량 할당 현황을 담은 소규모 집계 파일(csv 656바이트)로, 대상 유역별 생물학적 산소 요구량(BOD)과 총 인(T-P)의 목표수질, 배출부하량 관리목표, 개발부하량, 삭감량을 담는다. 이천시에서 개발사업을 검토하는 사업자나 환경 행정 담당자가 '이 유역에 남은 BOD·T-P 개발부하량이 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수질 측정·오염원 데이터와는 유역명(대상유역)이나 같은 기관 기준으로 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 이천시의 수질오염총량관리제 하에서 지역별 오염물질 배출 허용량과 개발 가능 부하량을 관리하기 위해 수립된 자료입니다. 항목은 유역별 생물학적 산소 요구량(BOD)과 총 인(T-P)의 목표수질, 배출부하량, 삭감량, 개발부하량, 할당량 등으로 구성되어 있으며, 오염원 관리 대상과 유역명, 기준일자 등의 정보도 포함됩니다. 본 데이터는 하천 수질 개선계획 수립, 개발사업 환경영향 사전검토, 환경기초시설 용량 계획, 유역별 오염부하 총량 한계 분석 등 환경행정 전반에 활용됩니다. 특히 단위별 kg/일 수치는 정량적 수질평가, 환경영향평가, 지속가능한 개발 유도 등에도 핵심 자료로 활용됩니다.
