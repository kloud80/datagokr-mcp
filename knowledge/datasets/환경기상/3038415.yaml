description_portal: 전국 공공건물, 관공서(읍면동사무소) 및 초등학교를 대상으로 총 1,100개 지점의 계절별 실내  라돈 농도 조사를 수행하였다. 측정 장소는 1층을 주 대상으로 하였으며, 검출기 설치 기간은 계절별 90일 이상(3개월씩) 총 1년(2008년 ~ 2009년) 조사한 결과이다.*전국 실내 라돈의 실태 조사를 목적으로 우선 전국 라돈 분포 지도 작성을 위하여, 전국을 1대 5만 지형도를 바탕으로 전국을 15'*15'로 격자화 했으며, 전국적으로 고르게 분포되어 있으며 건축물 스타일이 비슷하고 이사 등의 변동 요인이 적은 읍면동사무소와 초등학교를 대상으로 실내 라돈 농도를 조사하였다.*계절별 조사 4계절(봄, 여름, 가을, 겨울) 시도, 시군구별  공공건물 내 실내라돈농도 실태조사 결과이며,  실내공기질공정시험기준(국립환경과학원 고시) 실내라돈 장기측정 방법인 알파비적검출법(수동형라돈검출기)을 이용하여 90일 이상(3개월씩) 장기 측정하였다. * 본 자료의  실내 라돈 농도 단위는 Bq/㎥ 이다.* 2008년-2009년 전국을 격자로 나누어  1,100개  공공건물을 대상으로  사계절,  시도별, 시군구별 실내라돈 농도 실태조사 결과
