summary_user: 대구광역시 서구 관내 석면 해체·제거 공사장별로 공사명·소재지·작업내용, 측정 시작·종료일, 측정기관과 연락처, 측정지점별 비산석면 측정결과를 건별로 담은 파일(CSV 약 13KB)이다. 주민이나 분석가가 '우리 동네 석면 철거 공사장 주변에서 측정된 석면 농도가 얼마였고 어느 기관이 측정했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 공사명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 대구광역시 서구의 석면해체제거사업장 석면 비산정도 측정결과를 나타내는 데이터 입니다. 공사명과 위치, 작업내용, 측정지점과 측정결과 등에 대한 정보를 포함하고 있습니다.이 데이터는 대구광역시 서구 관내에서 시행된 석면 해체·제거 작업장의 비산석면 측정 결과를 수록한 정보로서, 석면 해체공사의 작업내용, 측정기간, 측정기관, 측정지점별 농도 수치를 포함한다. 각 사업장의 공사명, 소재지, 해체 면적(㎡), 측정 시작일 및 종료일, 측정지점별 비산 정도(개/cc)를 명시하고 있어, 석면 안전관리에 필요한 정보를 제공한다. 본 데이터는 공공시설 및 학교, 민간건물 등을 대상으로 하며, 작업장 주변에서 측정된 석면 농도를 확인할 수 있어 주민 건강 보호 및 정책 수립에 활용 가능하다. 또한, 측정기관과 연락처를 포함하여 현장 확인이나 민원 대응에도 참고자료로 활용된다. 해당 데이터는 석면관리 이력정보 구축 및 환경위해 저감 정책 추진의 기초자료로 유의미하다.
