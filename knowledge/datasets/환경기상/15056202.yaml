summary_user: 제주시 관내에서 음식물류 폐기물을 다량으로 배출하는 사업장(음식점·집단급식소·호텔 등)의 업종, 사업장명, 소재지를 사업장 한 곳씩 담은 건별 목록 파일(CSV, 약 134KB)이다. 수거 업체나 행정 담당자가 '제주시 어느 지역에 음식물 다량배출 업소가 몰려 있고 어떤 업종인가'를 확인해 수거 동선이나 지도·점검 대상을 정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·소재지 주소를 맞춰 보거나 같은 제주시 생활폐기물 배출·수거 지점 파일과 지역 단위로 나란히 놓고 쓴다.
description_portal: '본 데이터는 제주특별자치도 제주시 관내에서 음식물류 폐기물을 다량으로 배출하는 사업장의 현황을 수록한 자료입니다. 음식점, 집단급식소, 호텔, 식품 제조업소 등 음식물 쓰레기를 다량으로 발생시키는 업소를 대상으로 하며, 환경보호와 자원순환 촉진을 위한 폐기물 관리 정책 수립 및 수거 행정의 효율화를 목적으로 수집되었습니다.주요 항목업소명: 음식물류 폐기물을 일정 기준 이상 배출하는 사업체의 명칭주소: 해당 업소의 사업장 소재지 주소본 데이터는 수거 일정 조율, 폐기물 배출 지도·감독, 불법 배출 예방 등 환경 관리 행정에 활용되며, 공공 및 민간의 자원순환 서비스 개발, 지역별 배출 통계 분석 등에도 참고 자료로 사용될 수 있습니다.갱신주기 및 관리기관갱신주기: 연 1회 또는 수시관리부서: 제주특별자치도 제주시청 생활환경과'
