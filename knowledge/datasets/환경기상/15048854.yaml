summary_user: 전국 먹는샘물 제조업체의 원수·제품수와 시중 유통 먹는샘물을 수거해 검사한 결과(수질기준 적합·부적합)를 수거기관, 제품명, 수거일자, 검사일자, 검사기관 등과 함께 건별로 담으며, 범위는 전국이고 위치는 개별 주소·좌표 단위다. 소비자가 마시는 생수 제품이 수질검사에서 부적합 판정을 받은 적이 있는지, 분석가가 제조업체·검사시기별 부적합 사례를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 지하수·수질 데이터와는 제품명·업체명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
limits: 검증 호출에서 1행만 수신되어 전체 규모와 최신 수록 시점은 이 호출만으로 판단하지 않는다. 표준 조인 키가 없어 업체·제품 단위 연계는 이름 매칭에 의존하며, 개발계정은 하루 10,000회로 호출이 제한된다.
