summary_user: 충청북도 시군별 생활폐기물 공공매립시설 현황을 시설 1곳당 1행으로 담은 소규모 파일(csv, 727 bytes)로, 시군명·소재지·총 매립지면적(㎡)·총 매립용량(㎥)을 담는다. 지자체 담당자나 분석가가 "충북 각 시군의 공공매립장은 어디에 있고 매립용량은 얼마인가"를 확인하거나 시군 간 매립 기반시설 규모를 비교할 때 쓴다. 전역 조인 키가 없어 시군명이나 소재지 주소를 이름 매칭해 시군구 단위 인구·폐기물 통계나 소각시설 현황과 이어 쓴다.
description_portal: 충청북도에 있는 지방자치단체의 생활폐기물 공공매립시설에 대한 현황입니다. 대상 지방자치단체는 청주시, 충주시, 제천시, 보은군, 옥천군, 영동군(2개소), 증평군, 괴산군, 음성군, 단양군 입니다.음성군은 진천군과 광역폐기물처리시설(매립시설, 소각시설, 재활용 선별시설)을 공동으로 사용하기 때문에 진천군은 별도의 공공폐기물 매립시설이 존재하지 않으나,음성군에 위치한 시설을 관리하고 있습니다.붙임 자료는 연번, 시군명, 소재지, 총 매립지면적(제곱미터), 총 매립용량(세제곱미터) 등의 정보를 제공합니다.
legal_basis_portal: 중앙정부(환경부) 및 충청북도에서 지도·관리하는 지방자치단체 생활폐기물 공공매립시설 현황입니다.
