description_portal: 한국우편사업진흥원 청사 에너지관리 현황 공공데이터는 건물에너지관리시스템(BEMS)을 통해 수집된 전기(kWh), 가스(m3), 수도(t) 등 에너지원별 사용량을 제공하고 있습니다. 또한 이 데이터는 2017년부터 2024년까지의 연도별 에너지 관리 현황을 포함하고 있는데, 2024년 12월 31일에 게시된 최신 데이터는 파일 다운로드를 통해 이용할 수 있습니다. 해당 데이터는 공공데이터포털을 통해 파일 형태로 제공되며 오픈 API를 통해 자동 변환된 데이터 활용도 가능합니다. 또한, 에너지 사용 설비의 운전 상태와 실내외 환경 정보 내용도 담고 있어 에너지 절감 계획을 수립하고 실행할 수 있습니다.
