summary_user: 부산광역시 남구에서 실내공기질 관리법에 따라 실내공기질 관리대상이 되는 다중이용시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설 구분·시설명·소재지·관리기관명·데이터 기준일자를 싣는다. 남구 주민이나 시설 운영자가 "우리 동네 어떤 시설(어린이집·의료기관·대형점포 등)이 실내공기질 측정·관리 의무 대상인가"를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 소재지 주소나 시설명을 맞춰 붙이거나, 같은 기관(남구) 데이터끼리 구군명 기준으로 이어 쓴다.
limits: 시설 목록만 담고 실제 실내공기질 측정값이나 기준 준수 여부는 들어 있지 않다. 범위가 부산 남구 한 시군구에 한정되며, 시설을 식별하는 표준 코드가 없어 다른 데이터와 연결하려면 주소·시설명 매핑이 필요하다.
