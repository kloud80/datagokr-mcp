description_portal: 다중이용시설, 지하역사 등의 실내공기질을 알맞게  유지하고 관리함으로써 그 시설을 이용하는 국민의 건강을 보호하고 환경상의 위해를 예방함을 목적으로 하는 실내공기질 관리법에 따라 부산광역시 남구 다중이용시설 실내공기질 관리대상시설 현황에 대한 데이터로 대상시설명, 주소 등의 자료를 제공합니다.적용이 되는 다중이용시설들은 실내공기질을  유지기준(1회/년), 유지·권고기준(1회/2년)을  준수하여 측정하여야 하며, 실내공기질 관리자 교육을 이수하여 불특정다수인이 이용하는 시설의 실내공기질을 알맞게 유지하여 환경상의 위해를 예방해야할 의무가 있습니다.
