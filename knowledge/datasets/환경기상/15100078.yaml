summary_user: 대구광역시 동구의 대형폐기물 품목별·규격별 처리 수수료표로, 품명·규격(크기 cm 또는 kg 기준)·수수료(원)를 한 행씩 담은 기준표 파일(csv, 약 3KB)이다. 동구 주민이 의자·신발장·자전거 같은 대형폐기물을 내놓기 전에 "내 물건은 수수료가 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 대형폐기물 수수료 파일과는 품명 문자열을 맞춰 비교하는 방식으로만 이어 쓴다.
description_portal: 대구광역시 동구에서 보유중인 대형폐기물 수수료 공공데이터는  대형폐기물 품목과 각 규격별 처리 수수료 정보를 제공하고 있으며 품명, 규격, 수수료 등을 포함하고 있습니다.  해당 데이터는  의자, 신발장, 유모차, 자전거 등 다양한 가구·가전자품, 생활용품, 기타품목도 세부 규격에 따라 1,000원에서 수십만 원대까지 폭넓은 수수료가 책정되어 있습니다. ‘규격’ 항목에는 크기(cm) 또는 kg 기준이 표시되며, ‘수수료’는 원 단위로 명확하게 기재되어 있어, 주민들이 자기 품목에 맞는 비용을 쉽게 조회할 수 있습니다. 대구 동구의 대형폐기물 공공데이터는 품명, 규격, 수수료 기준을 포함하여 사용자의 품목별 처리비용을 수 월 단위로 상세히 제공하고 있어, 폐기물 배출 전에 정확한 비용 안내가 가능합니다
