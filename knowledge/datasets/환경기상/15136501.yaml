description_portal: 경상남도 대기 환경 측정망 일일 평균 자료입니다. 경남보건환경연구원에서 설치 및 운영 중인 측정소에서 미세먼지(PM-2.5, 10), 오존, 일산화탄소,  이산화황, 일산화질소, 이산화질소, 질소산화물  및  풍속, 습도, 온도 측정자료로서 일일 데이터 값을 제공합니다.조건설정에서 시간 및 기간을 설정하여 조회하거나 조회한 내역을 엑셀로 다운로드 할 수 있습니다.단, 상위기관 및 내부기관에서 확정된 자료가 아닌 기기의 실시간 연속자동측정값이므로, 확정값은 변동될 수 있습니다.미세먼지, 오존, 일산화탄소, 이산화황, 이산화질소, 풍속, 습도, 온도 정보를 개별 항목별로 확인할 있으며, 항목을 중복선택하여 동시에 확인할 수 있습니다.
