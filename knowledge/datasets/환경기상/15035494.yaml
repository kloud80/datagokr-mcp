summary_user: 경기도 광주시에서 「실내공기질관리법」 관리 대상인 다중이용시설(노인요양시설, 어린이집, 실내주차장 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설구분·시설명·도로명/지번 주소·연면적·위도·경도를 포함한다. 환경보건 담당자나 분석가가 "광주시 안에서 실내공기질 관리 대상 시설이 어느 지역에 몰려 있고 어떤 유형이 많은가"를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 광주시 내 「실내공기질관리법」에 따라 관리가 필요한 다중이용시설의 현황을 정리한 자료입니다. 주요 항목은 시군명, 시설구분(노인요양시설, 어린이집, 실내주차장 등), 시설명, 소재지 주소(도로명 및 지번), 연면적, 위도 및 경도 좌표, 데이터 기준일자 등으로 구성되어 있습니다. 해당 법 적용 대상 시설은 대중의 이용이 많고, 실내 공기질이 건강에 큰 영향을 줄 수 있는 장소로 분류되며, 각 시설은 공기질 측정, 환기시스템, 정기 점검 등의 관리 의무가 있습니다. 본 자료는 지역별 실내환경 관리 필요 시설 분포 분석, 공기질 개선 대상 우선순위 설정, 환경보건 정책 수립, 시설별 관리이력 기반 감시체계 구축 등에 활용될 수 있으며, 광주시 환경 담당 부서에서 수집한 공공데이터입니다.
