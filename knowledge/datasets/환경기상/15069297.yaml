description_portal: 해양환경공단이 제공하는 ‘해양쓰레기 모니터링 통계_1기조사방법_연도별’ 데이터에 대한 정보를 제공합니다. 본 데이터는 1기 조사방법론을 적용하여 실시한 해양쓰레기 모니터링 결과를 연도별로 집계한 통계 자료를 포함합니다. 주요 내용에는 조사 정점 위치, 조사 시기, 부유·침적·유입 쓰레기 등 발생 형태, 연도별 발생량과 재질별 특성, 계절별 변화 경향이 수록됩니다. 또한 연도별 오염원 분석, 발생량 증감 추이, 관리·감축 우선순위 설정에 필요한 기초자료를 제공합니다. 이를 통해 해양쓰레기의 장기적인 발생 추세와 원인 변화를 파악하고, 지속가능한 해양환경 보전을 위한 정책 수립과 평가에 활용할 수 있습니다. 해당 자료는 공공기관, 연구기관, 지자체, 환경단체 등에서 연구 분석, 환경교육, 정책 기획 등 다양한 목적으로 폭넓게 이용됩니다.
