summary_user: 경기도 포천시의 음식물류 폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호명·도로명/지번 주소·사업장구분·사업장규모·월배출예상량을 기록한다. 포천시에서 음식물 쓰레기를 많이 내는 음식점·집단급식소가 어디에 있고 한 달에 얼마나 배출할 것으로 보는지 확인하려는 주민·수거업체·분석가가 쓴다. 전역 조인 키는 없어서 주소나 상호명을 매칭하거나 같은 시군의 다른 폐기물 배출·수거 지점 파일과 이어 쓴다.
