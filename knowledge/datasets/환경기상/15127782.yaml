summary_user: 세계유산으로 지정된 한국의 갯벌을 갯벌별로 담은 API로, 갯벌명·좌표·유네스코 세계유산지역 및 완충지역 면적·서식 생물 내용과 관련 자료 파일 정보를 제공한다. 전체 건수는 23건이며 전국 범위이다. 갯벌 보전 정책 담당자나 연구자, 환경교육 자료를 만드는 사람이 '세계유산 갯벌의 면적과 서식 생물은 무엇인가'를 확인할 때 쓴다. 좌표 필드(la, lo)가 조인 키이므로 같은 해양 보호구역·생태 부문이나 해양공간 규제 레이어 데이터와 좌표로 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 세계유산으로 지정된 한국의 갯벌과 관련 생태 정보를 제공하기 위해 수집한 데이터입니다.  전체 데이터 조회 또는 갯벌명, 자료제목명 등 특정 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 세계유산으로 지정된 갯벌의 이름, 유네스코 세계유산 지역의 면적, 각 갯벌에서 서식하는 생물의 서식지 정보 등으로 구성되어 있습니다.  이 데이터는 갯벌 생태계와 유네스코 지정 지역별 특성을 연구하거나 정책 기초자료로 활용될 수 있으며, 갯벌 보전 정책 수립 및 세계유산 관리 현황 분석, 생태관광 및 환경교육 자료 개발 등에도 활용될 수 있습니다.
