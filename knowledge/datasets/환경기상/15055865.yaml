summary_user: 인천광역시 관내 환경오염 배출사업장에 대한 단속 실적을 기관별로 집계한 파일로, 배출업소·단속업소·위반업소 수(개소)와 개선명령·조업중지·폐쇄·측정명령·경고 등 행정처분 건수, 고발·과태료를 담는다(CSV 634바이트 규모의 소량 집계표). 분석가나 시민이 '인천시에서 단속한 사업장 중 위반 비율은 얼마이고 어떤 행정처분이 주로 내려졌는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 사업장 단위 배출원 원장과 직접 잇지 못하고, 기관 이름 매핑으로만 다른 지자체 단속 통계와 나란히 비교한다.
limits: 개별 사업장 단위가 아닌 기관별 집계라서 특정 업체의 위반·처분 이력은 알 수 없다. 전역 조인 키가 없어 인허가·TMS 등 사업장 원장과 연계하려면 이름·코드 매핑이 필요하다.
