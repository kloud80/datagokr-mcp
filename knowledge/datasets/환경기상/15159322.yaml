summary_user: 전국 지하역사에 설치된 실내공기질 자동측정기의 초미세먼지 측정값을 지점·호선·위치별 측정일시 단위로 담는 실시간 API 데이터로, 측정기 상태 구분도 함께 제공한다. 지하철 이용자가 '지금 내가 타는 역 승강장의 초미세먼지 농도는 얼마인가'를 확인하거나, 역사 운영기관이 실내공기질 관리에 실시간 측정결과를 참고하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운영기관명·호선명·지점명(역명) 같은 이름 매핑으로만 이어 쓴다.
description_portal: '- 전국 지하역사의 실내공기질 실시간 초미세먼지 정보 개방하고 있습니다.- 2021년 4월 1일부터 지하역사의 초미세먼지 농도를 측정하고 공개하도록 법이 시행되면서 시민들이 평소에 이용하는 지하역사의 초미세먼지 농도를 실시간으로 확인할 수 있는 정보를 제공하고 있습니다.- 지하역사 운영기관에도 실내공기질 관리에 실시간 측정결과 활용이 가능합니다.- 해당 자료는 각 철도운영기관에서 생산하여 확정한 자료이며, 데이터 검증을 위한 확정 과정에서 약 1시간의 시간차가 있습니다.'
