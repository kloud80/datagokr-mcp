summary_user: 여주시가 관리하는 실내공기질관리법 적용 대상 다중이용시설을 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·도로명/지번 주소·전화번호·연면적·위도·경도를 포함한다(약 6.6KB CSV, 여주시 단위). 시민이나 분석가가 '우리 동네에서 실내공기질 관리 대상인 시설은 어디이고 어떤 유형인가'를 확인하거나, 담당자가 관리 대상 목록을 지도에 올려 점검 대상을 파악하는 데 쓴다. 전역 조인 키는 없어 시설명·주소로 다른 시설 목록과 맞추거나, 위도·경도로 주변 대기질 측정소 자료와 공간적으로 이어 쓴다.
description_portal: 여주시에서 관리하는 실내공기질관리대상시설에 관한 정보를 제공하는 자료입니다.데이터 항목은 실내공기질 관리대상시설의 시설구분, 시설명, 소재지도로명주소,, 소재지지번주소, 전화번호, 연면적,  위도, 경도로 구성되어 있습니다.해당 데이터는 실내 공기질 관리 대상 시설의 현황을 쉽게 확인하여, 실내 공기질 개선을 위한 정책 결정 및 관리에 도움이 될 수 있으며,이를 통해 환경개선에 필요한 조치를 신속하게 취할 수 있도록 지원합니다.또한, 시민들이 주변 공공시설의 실내환경 상태를 쉽게 확인할 수 있도록 지원합니다.
