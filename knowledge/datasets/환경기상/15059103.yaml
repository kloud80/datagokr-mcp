summary_user: 경기도 안에 수질 정화용으로 조성한 인공습지를 습지 한 곳씩 담으며, 습지 구분·소재지·소재지 면적·습지 면적과 유입수·방류수의 BOD·총인(T-P) 측정값, 집계일자·측정일자를 함께 싣는다. 환경정책 담당자나 연구자가 "이 인공습지가 유입수 대비 방류수의 BOD·총인을 얼마나 낮추는가"를 습지별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수질측정망·하천 데이터와는 소재지 위치나 지역 구분 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 「수질 정화 인공습지 현황」 데이터는 경기도 내 수질 정화를 목적으로 조성된 인공습지의 현황을 제공하는 자료입니다. 주요 항목은 습지구분명(SWAMLND_DIV_NM), 소재지위치(LOCPLC_LOC), 소재지면적(LOCPLC_AR), 습지면적(SWAMLND_AR), 지역구분명(REGION_DIV_NM), 유입수 BOD 측정값(INFLWTR_BOD_MESURE_VL), 방류수 BOD 측정값(EFLUNC_BOD_MESURE_VL), 유입수 T-P 측정값(INFLWTR_TP_MESURE_VL), 방류수 T-P 측정값(EFLUNC_TP_MESURE_VL) 등입니다. 이 데이터는 인공습지가 하천 및 수계의 수질 개선에 기여하는 효과를 파악할 수 있도록 구성되어 있으며, 수질 모니터링, 환경정책 평가, 생태 복원 연구, 하수처리 연계 관리 및 지속 가능한 수자원 관리 전략 수립에 활용할 수 있습니다. 또한 집계일자와 측정일자를 제공하여 시간에 따른 수질 정화 효과 변화를 분석할 수 있습니다.
