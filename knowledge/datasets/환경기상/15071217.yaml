description_portal: '서울시 수치지도 건물데이터에 지붕의 월별, 분기별, 연별 태양광일사량정보를 예측하여 산출한 GIS데이터 입니다. 지붕의 월별, 분기별, 연별 평균 태양광일사량 정보는 서울시 햇빛알고리즘을 통해서 건물의 높이값에 산란광 직사광등을 종합하여 계산된 값 입니다. 건물높이 단위는 m, 건물면적단위는 ㎡, 에너지양단위는 kWh/㎡, 사용좌표계는 UTM-K입니다.※ 제공부서 : 서울특별시 기후환경본부 녹색에너지과(02-2133-3561)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
