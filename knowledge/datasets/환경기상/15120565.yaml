description_portal: 본 데이터는 한국환경산업기술원이 그린리모델링(GR) 사업의 일환으로 친환경건설자재의 분류 체계를 제공한 자료입니다. 대분류, 중분류, 소분류의 명확한 분류 코드를 포함하여, 재활 용 골재 콘크리트 중앙분리대, 재활용 골재 타일, 인공어초 등 재활용 골재를 활용한 건설 자재를 구체 적으로 분류하고 있습니다. 이 자료는 친환경 리모델링 사업 진행 시 자재의 친환경 인증 적합성 평가, 자재 선정 및 관리 업무, 지속 가능한 건축 계획 수립 등 다양한 분야에서 실무적인 참고자료로 폭넓게 활용할 수 있도록 구성되어 있습니다.
