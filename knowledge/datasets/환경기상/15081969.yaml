summary_user: 상주시 관내 대기오염물질 배출시설 설치 사업장을 사업장 한 곳당 한 행으로 담은 원장 파일(csv, 약 17.8KB)로, 사업장명·소재지·대표업종·배출시설 종별 구분·배출시설 수·인허가 일자·연료사용량·오염물질 발생량을 담는다. 주민이나 분석가가 "우리 동네 근처에 어떤 업종의 대기 배출 사업장이 몇 종 규모로 있는가"를 확인하거나, 시 담당자가 관내 오염원 분포를 파악하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명·주소(소재지, 도로명소재지) 매칭이나 같은 기관 자료와의 연결로만 이어 쓴다.
limits: 상주시 한 시군구 범위의 개별 사업장 자료라 다른 지역과 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 조인 키가 없어 굴뚝 TMS·인허가 등 다른 배출원 데이터와 붙일 때 이름·주소 매칭 오류에 주의해야 한다.
