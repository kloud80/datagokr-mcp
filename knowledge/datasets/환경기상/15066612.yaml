summary_user: 경기도 파주시에 설치된 미세먼지신호등을 한 대씩 담은 시설 목록 파일로, 도로명·지번 주소와 위도·경도, 설치연도, 표출부 크기·개수, 운영 시작·종료 시간, 표출 내용, 관리기관을 담는다. 시민이나 서비스 개발자가 '우리 동네 어디에 미세먼지신호등이 있고 몇 시부터 몇 시까지 켜지나'를 확인하거나, 지도 기반 대기정보 안내 서비스의 표출 지점을 정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소코드 기반 실시간 대기질 데이터와 직접 이을 수 없고, 위도·경도나 주소를 기준으로 가까운 측정소나 다른 시설 데이터와 공간적으로 맞춰 쓴다.
limits: 이 파일은 신호등의 위치와 물리·운영 정보만 담고, 신호등이 표출하는 미세먼지 농도나 등급 같은 실시간 대기질 값은 담지 않는다. 범위는 파주시 한 곳이며, 다른 데이터와는 주소·좌표나 기관명 매칭으로만 연결된다.
