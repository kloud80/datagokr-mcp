description_portal: 이 데이터는 해양수산부에서 운영하는 해양환경 온라인 플랫폼의 이용자 및 플랫폼 현황을 파악할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 국가해양환경 온라인 교육센터를 이용하는 사용자들의 전화·문자 수신 여부, 회원 등록 일시, 장기 미이용 시점, 탈퇴 일시, 본인 인증결과 등 회원 관리와 관련한 정보 등으로 구성되어 있습니다.  본 데이터는 해양환경 온라인 플랫폼의 이용자 서비스 개선, 이용 활성화 방안 도출, 회원 관리 정책 수립, 플랫폼 운영 효율화 및 교육 수요 추세 분석 등에 활용될 수 있습니다.
