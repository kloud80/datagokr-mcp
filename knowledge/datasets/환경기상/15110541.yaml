summary_user: 대구광역시 동구 안의 특정토양오염 관리대상 시설을 시설 한 곳당 한 건으로 담으며, 등록번호·시설 구분·업체명·주소를 포함한다. 주민이나 부동산·개발 검토자가 '이 필지 주변에 토양오염 관리대상 시설(주유소 등)이 있는가'를 확인하거나, 분석가가 동구 내 오염 위험 시설 분포를 지도로 그릴 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 주소를 지오코딩하거나 업체명을 매칭하는 방식으로 다른 환경 규제 레이어·사업장 데이터와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 주소·업체명 매칭으로만 연결된다. 범위는 대구 동구 한 시군구로 한정되므로 다른 지역 현황은 담기지 않는다.
