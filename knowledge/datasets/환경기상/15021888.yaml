summary_user: 이동측정차량이 주행하며 도로 위 타이어·도로면 마찰로 재비산되는 먼지(PM10)를 잰 측정 기록 파일로, 측정일시·지역·도로명·구간(시작점~종점)·기온·습도·평균농도·오염범례를 담는다. 검증 시점 기준 전국 1,074행, 2026-08-03부터 2026-08-28까지 수록되어 있다. 우리 동네 어느 도로에서 재비산먼지 농도가 높았는지 보려는 분석가나 지자체 담당자가 쓰며, 전역 조인 키가 없어 지역명·도로명 이름 매칭이나 같은 기관 코드로만 에어코리아 등 다른 대기질 데이터와 잇는다.
description_portal: 한국환경공단_도로 재비산먼지 측정 정보는 특수제작한 이동측정차량으로 주행하는 차량의 타이어(휠)와 도로면의 마찰에 의해서 재비산되는 먼지(PM10)를 측정한 월간 평균 자료입니다.  월간 평균 자료는 1. 측정일시, 측정지역, 측정도로명  2. 온도 및 습도 등 측정 기상조건  3. 도로 재비산먼지 측정평균농도, 오염범례 입니다. - 환경부 훈령 제718호 제13조(정보공개의 대상 및 방법) 참고* 미세먼지는 대기 중에 떠다니는 지름이 10㎛이하의 입자상 부유물질로서, 먼지 지름에 따라 PM10, PM2.5으로 구분됩니다.도로 재비산먼지는 자동차 배기가스, 타이어 마모, 브레이크 패드 마모 등에 의해 도로 위에 침적된 먼지가 차량의 이동에 의해 대기중으로 재비산되는 입자상 물질입니다.
legal_basis_portal: 도로 재비산먼지 이동측정 운영에 관한 규정(환경부훈령 제718호)
