summary_user: 환경영향평가 중 사전·전략·소규모 영향평가 협의사업을 사업 단위로 담아, 사업명·접수일·협의진행현황과 사업별 단계명·접수일·검토의뢰일·검토결과 접수일·통보일을 조회하며 범위는 전국이다. 개발사업을 검토하는 사업자나 분석가가 '이 개발사업의 환경영향평가 협의가 지금 어느 단계이고 언제 통보됐는가'를 확인하는 데 쓰며, 협의 단계는 개발 선행 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 사업명 매칭이나 같은 기관 데이터로만 이어 쓰며, 서비스 안에서는 사업 고유 번호(bizSeq)와 사전환경성검토코드(perCd)로 목록·상세·진행 정보를 연결하고, 토지이용규제·개발사업 데이터와 함께 본다.
limits: 상세 조회의 필수 파라미터인 사전환경성검토코드(perCd)는 다른 오퍼레이션에서 먼저 받아 넘겨야 한다. 사업구역 좌표 등 공간 정보가 없는 비공간 데이터라 지도 위 위치 분석에는 직접 쓰지 못하고, 다른 데이터와 붙일 공통 코드도 없다.
