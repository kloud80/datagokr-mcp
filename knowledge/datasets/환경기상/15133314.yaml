summary_user: 군산시 안의 폐기물 수거지를 지점 한 곳당 한 행으로 담은 파일로, 설치장소명·도로명/지번 주소·폐기물 종류·관리기관과 연락처를 담는다(약 56KB CSV). 군산시 주민이 '우리 동네에서 이 종류의 폐기물은 어디에 내놓고, 문의는 어디에 하나'를 확인하거나 분석가가 수거지 분포를 지도에 올릴 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 주소(지오코딩)나 시군구명·관리기관명 같은 이름 매칭으로만 잇는다.
description_portal: 전북특별자치도 군산시에 위치한 폐기물 수거지 목록은 설치장소, 시도명, 시군구명, 도로명주소, 지번주소, 폐기물종류, 관리기관명, 관리기관연락처 등 상세 정보를 포함합니다. 이 데이터는 군산시 내 폐기물 수거지의 위치와 종류, 관리 주체 및 연락처를 체계적으로 파악할 수 있도록 구성되어 있으며, 폐기물 관리와 관련된 행정 업무, 환경 보호, 시민의 편리한 폐기물 처리 지원에 중요한 역할을 합니다. 다양한 폐기물의 적절한 수거와 처리 체계 구축을 위해 활용되며, 지역 환경 개선과 지속 가능한 자원 관리를 목표로 합니다.
