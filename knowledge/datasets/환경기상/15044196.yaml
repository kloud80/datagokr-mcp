summary_user: 해양환경공단 해양수질자동측정망의 광양 초남 정점에서 자동 연속 측정한 수온·염분·용존산소량·수소이온농도·탁도·전기전도도·클로로필 값을 관측일자별 시계열로 담은 건별 원천 파일(CSV, 약 1.6MB)이다. 광양만 인근 연구자나 지자체 담당자가 특정 시기에 이 해역의 용존산소가 떨어지거나 탁도가 높아졌는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 해양수질자동측정망 정점 파일과는 정점명·정점코드로, 기상·하천 자료와는 관측일자를 맞춰 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 광양 초남 해역의 수질 측정 정보를 제공합니다. 본 데이터는 실시간 자동측정 방식을 통해 수온, 염분, 용존산소(DO), 수소이온농도(pH), 탁도, 전기전도도 등 주요 수질 항목을 연속적으로 측정한 결과를 포함합니다. 광양 초남 지역은 하천 유입, 산업시설, 항만 등의 복합적인 영향으로 수질 변동이 발생하기 쉬운 해역으로, 수질 변화 감시와 오염원 추적을 위해 지속적인 모니터링이 필요합니다. 데이터는 측정항목별 시계열 형식으로 제공되며, 공공기관, 연구기관, 지자체 등에서 수질환경 평가, 오염관리 정책 수립, 연구 기반자료로 활용됩니다.
