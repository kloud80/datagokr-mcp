summary_user: 전라남도 내 대기오염 측정소 한 곳당 한 행으로 시군, 측정소명, 소재지, 설치년월, 용도지역을 담은 설치 현황 파일이다(약 3.5KB CSV). 지역 주민이나 분석가가 '우리 시군에는 대기오염 측정소가 어디에 있고, 주거·공업 등 어떤 용도지역에 언제 설치됐나'를 확인하는 데 쓴다. 전역 조인 키나 측정소 코드가 없어 에어코리아 실시간 측정값 등 다른 데이터와는 측정소명·시군명을 이름으로 맞춰 이어 써야 한다.
