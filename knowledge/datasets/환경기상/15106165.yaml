description_portal: '- 전라남도 대기오염 측정을 위한 대기오염 측정망(시군명, 측정소명, 설치연월, 용도지역  등) 설치 현황 정보를 조회할 수 있습니다.- 목적: 전국 각 지역에서 NO₂, SO₂, CO, O₃, PM₁₀, PM₂.₅ 등 주요 대기오염물질과 기상정보를 실시간 또는 자동으로 측정해, 시민의 건강 보호와 환경 기준 준수 여부를 감시합니다.- 운영기관: 지역별 보건환경연구원 또는 시·도 환경 관련 부서가 설치하며, 에어코리아(Air Korea), 각 지자체 웹사이트 및 앱으로 데이터를 공개합니다.- 에어코리아(airkorea.or.kr): 전국 실시간 대기질 데이터 제공.- 각 시·도·시군 웹사이트/App: 상세한 위치별 대기오염도, 측정소 데이터, 경보 발령 정보를 확인할 수 있습니다.'
