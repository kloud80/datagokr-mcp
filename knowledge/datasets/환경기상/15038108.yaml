summary_user: 서울 동작구에 설치된 가로쓰레기통을 한 개씩 행으로 담은 원천 목록으로, 도로명·세부 위치, 설치 장소 유형(도로변·버스정류소 등), 형태(일반 사각형·광고판 일체형), 수거 쓰레기 종류(일반·재활용), 설치연도를 기록한다. 주민이 "우리 동네 버스정류장 근처에 재활용을 버릴 수 있는 쓰레기통이 있나"를 찾거나, 구청·분석가가 도로별 쓰레기통 배치와 노후 설치 현황을 점검하는 데 쓴다. 전역 조인 키나 좌표가 없어 다른 데이터와는 도로명·자치구명 같은 이름 매칭으로만 잇고, 다른 자치구의 가로쓰레기통 파일과 합칠 때도 자치구명을 기준으로 맞춘다.
limits: 범위가 동작구 한 곳뿐이라 서울 전체를 보려면 자치구별 파일을 따로 모아 합쳐야 한다. 실측 컬럼에 공통 조인 키가 없어 위치 연계는 도로명·세부 위치 문자열 매칭에 의존한다.
