description_portal: 이 데이터는 서울특별시 동작구에 있는 가로쓰레기통 현황에 대한 데이터입니다.이 데이터에는  쓰레기통의 위치, 설치장소유형, 수거 쓰레기 종류, 쓰레기통의 종류, 설치연도 등이 포함되어 있습니다.도로명과 세부위치 항목은 쓰레기통이 설치된 도로명 및 세부위치를 제공하여 위치 파악을 돕습니다.설치장소 항목은 도로변, 버스정류소 등 설치 환경의 유형을 구분합니다.형태 정보는 일반 사각형 쓰레기통인지 특수형태(광고판 일체형) 쓰레기통인지 여부를 나타냅니다.수거 쓰레기 항목은 일반쓰레기 전용인지 재활용 쓰레기 수거가 가능한지 구분합니다.
