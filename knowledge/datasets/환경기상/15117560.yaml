description_portal: '본 데이터는 한국수자원공사가 전국 주요 상수원에서 운영 중인 조류경보제와 관련하여 조류 대량 발생 시 정수처리 공정 중 실시한 냄새물질 분석 결과를 종합적으로 제공한다. 조류 번식 과정에서 생성되는 대표적인 냄새물질인 지오스민(Geosmin)과 2-메틸이소보르네올(2-MIB)의 농도를 정밀하게 측정하여, 정수처리 효율과 수돗물의 안전성 확보 여부를 과학적으로 평가한다. 취수장별 조류경보 발령 및 해제 이력, 채수일별 농도 변화 추이를 함께 제공하며 다양한 분야의 연구와 행정적 활용에 기초자료로 쓰인다.첨부파일은 2025/1 ~ 2025/7 까지의 데이터입니다.  2023년 이전 데이터는 아래 URL에서 확인 바랍니다.  - https://www.waternow.go.kr/web/lawData8/search?pMENUID=170&ATTR_1=4902* 필요시 조건검색을 통한 다운로드 방법 : 링크 접속 → 채수일(시작일~종료일) → "검색" 클릭 → 검색결과 오른쪽 위 "엑셀다운" 클릭'
