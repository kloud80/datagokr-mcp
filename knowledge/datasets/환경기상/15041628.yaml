summary_user: 포획야생동물 확인표지(Tag) 시스템에서 수렵장 운영에 쓰는 수렵 가능 종 목록을 연도별로 담은 소형 설정 파일(약 1KB CSV)로, 종마다 분류·확인표지 가격·태그 색상·1일 추가구매량·사용 여부·등록일을 담는다. 수렵인이나 지자체 수렵장 담당자가 '올해 멧돼지·고라니·수꿩 같은 수렵 대상종의 확인표지 가격과 태그 색상은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 생물종 데이터와는 종명(종명) 이름 매칭으로만 이어 쓰고, 범위는 전국 단위의 비공간 데이터다.
limits: 종ID는 이 시스템 내부 코드라 전국자연환경조사 등 다른 종 데이터와 바로 조인되지 않고 종명으로 맞춰야 한다. 행정구역·좌표가 없어 지자체별 수렵장 운영 현황이나 실제 포획량은 이 파일로 알 수 없다.
