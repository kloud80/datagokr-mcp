description_portal: 이 정보는 서울특별시 영등포구에 설치 된 담배꽁초 전용 쓰레기통 현황에 대한 정보입니다.담배꽁초 전용 쓰레기통은 금연 구역 이외의 장소 중 건물 관리실, 사업주 등의 신청으로 설치가 됩니다. 흡연자들이 많은 곳에 담배꽁초 무단투기를 예방하기 위해 설치되어 있습니다. 설치는 영등포구청 청소과에서 지원하며 관리 및 유지보수는 신청자(관리실, 사업주)가 하고 있습니다. 금연구역, 간접흡연 피해 등 민원이 있는 곳에는 설치할 수 없으며 이미 설치 된 쓰레기통이라고 할지라도 철거 대상이 될 수 있습니다.담배꽁초 전용 수거함에 대한 문의는 영등포구청 청소과(02-2670-3478)로 해주시기 바랍니다.
