description_portal: 이 데이터는 인천광역시 남동구 내 옥상녹화 조성 현황을 체계적으로 수집하여 제공하는 자료입니다. 각 조성 건물에는 연번이 부여되어 있으며, 건물명과 소재지 주소를 통해 정확한 위치 정보를 확인할 수 있습니다. 녹화조성면적 항목은 옥상녹화가 이루어진 면적을 구체적으로 나타내어 녹화 규모를 파악할 수 있게 돕습니다. 또한, 공공 및 민간 구분을 통해 조성 주체를 명확히 구분하며, 녹화조성연도와 조성목적 항목을 포함하여 조성 시기와 목표를 함께 제공합니다. 이 자료는 도시 내 녹지 공간 확대와 환경 개선을 위한 정책 수립에 중요한 기초자료로 활용되며, 지역 주민과 관계 기관들이 옥상녹화 현황을 쉽게 확인하고 관리할 수 있도록 지원합니다. 이를 통해 남동구의 지속 가능한 도시환경 조성에 기여하는 공공데이터입니다.
