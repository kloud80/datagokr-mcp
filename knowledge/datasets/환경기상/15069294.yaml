description_portal: 해양환경공단이 수행한 해양쓰레기 조사사업의 연도별 조사 결과를 제공합니다. 본 데이터는 전국 연안 및 도서지역에서 실시된 해양쓰레기 발생 현황, 분포 특성, 주요 유입 경로 등을 연도 단위로 정리한 통계 자료입니다. 쓰레기 유형은 플라스틱, 폐어구, 생활쓰레기 등으로 구분되며, 조사 방법과 대상 지역은 매년 동일 기준에 따라 수집되어 시계열 분석이 가능합니다. 본 자료는 해양쓰레기 저감정책 수립, 변화 추세 분석, 환경영향 평가 등에 활용되며, 공공기관, 지자체, 연구기관 등에서 정책 개발과 행정 참고자료로 활용됩니다. 데이터는 보고서 및 표 형식으로 제공되며, 해양환경 개선을 위한 과학적 근거자료로 활용됩니다.
