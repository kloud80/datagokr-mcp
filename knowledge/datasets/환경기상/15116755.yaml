summary_user: 경기도 화성시 관할에서 폐기물을 배출하는 사업장을 한 행씩 담은 원장 파일로, 사업장명·지번/도로명 주소·배출 폐기물 종류(지정·일반)·운반자와 처리업소·연락처·관리기관·기준일자를 기록한다. 화성시 안에서 특정 사업장이 어떤 폐기물을 내고 어느 업체가 운반·처리하는지 확인하려는 주민·환경 분석가·관련 사업자가 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 사업장명·주소 문자열 매칭이나 처리업소명으로 폐기물 처리업 허가 현황과 맞춰 이어 써야 한다.
description_portal: 데이터는 경기도 화성시 관할 내 폐기물을 배출하는 사업장의 현황을 정리한 자료로, 각 사업장의 명칭, 소재지 주소, 배출 폐기물의 종류, 운반자 및 처리업소 정보, 연락처, 관리기관 등의 항목으로 구성되어 있다. 사업장에서 발생하는 폐기물의 종류에는 지정폐기물 및 일반폐기물이 포함되며, 해당 폐기물을 운반·처리하는 주체에 대한 정보도 함께 제공된다. 본 자료는 폐기물의 안전하고 체계적인 관리 및 행정처리 지원을 위한 기초자료로 활용될 수 있으며, 관련 산업의 환경영향 분석, 정책 수립 및 감시체계 운영 등에 참고할 수 있다.
