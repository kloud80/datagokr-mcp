summary_user: 해양환경공단 해양수질자동측정망 중 시화조력발전소 인근 측정소에서 자동 측정한 수온·염분·용존산소·pH·탁도·클로로필·전기전도도 값을 정점과 관측일자별 시계열로 담은 CSV 파일(약 76만 바이트)이다. 연구자나 지자체 담당자가 시화호 주변 해역의 계절별 용존산소·염분 변화와 조력발전 운영 전후 수질 추이를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 해양수질자동측정망 정점 자료와는 정점명·정점코드 같은 기관 내부 코드나 이름 매핑으로만 잇는다.
