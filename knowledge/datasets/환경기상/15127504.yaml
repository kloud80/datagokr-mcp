description_portal: 서울교통공사에서 관리하는 지하역사 공기질 측정에 관한 상세 정보입니다. 이 자료는 주요 이용객이 많은 역사들을 대상으로 하여 시간 단위로 수집된 초미세먼지(PM-2.5) 측정값을 제공합니다. 측정 대상 역에는 잠실역(2호선), 강남역(2호선), 사당역(2·4호선), 홍대입구역(2호선), 고속터미널역(3호선), 서울역(1·4호선), 신림역(2호선), 건대입구역(7호선), 삼성역(2호선) 등이 포함되어 있습니다. 각 역사별로 측정된 데이터는 일정 주기마다 정리되어 있어 공기질 관리 현황을 세부적으로 확인할 수 있으며, 환경 개선이나 유지 관리 계획을 세우는 데에도 유용하게 활용할 수 있습니다. 본 자료는 2026년 2월을 기준으로 수집하고 체계적으로 정리한 최신 데이터입니다.
