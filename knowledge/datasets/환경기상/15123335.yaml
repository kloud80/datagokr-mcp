description_portal: 해양환경공단이 제공하는 선박 정계지 주소 및 좌표 정보에 대한 데이터를 제공합니다. 본 데이터는 공단이 관리하는 선박 정계지의 위치 좌표, 주소, 명칭, 관할 구역, 정박 가능 선박 규모, 시설 현황, 이용 빈도, 접근 경로 등을 포함하고 있습니다. 이를 통해 해양오염방제선, 청정호, 예인선 등 공단 보유 선박의 효율적인 배치와 체계적인 운영계획 수립이 가능하며, 정계지의 지리적 분포와 접근성을 분석할 수 있습니다. 해당 정보는 선박 운영관리, 항만시설 확충 계획, 긴급 대응 시 선박 이동경로 설정, 방제자원 배치전략 수립 등 다양한 해양안전 및 방제 정책 수립의 기초자료로 활용됩니다. 공공기관, 지자체, 연구기관, 민간사업자 등에서 폭넓게 이용됩니다.
