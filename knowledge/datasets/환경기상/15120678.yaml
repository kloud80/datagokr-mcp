summary_user: 한국환경산업기술원 환경정보공개 제도에 참여한 사업장의 연도별 공개 현황을 사업장 한 곳·한 해 단위 행으로 담은 전국 범위 CSV 파일(약 8MB)이다. 각 행에는 주요생산품과 연간 생산량, 국내외 종업원 수, 사업장 기준량·원단위, 녹색기업 여부가 들어 있다. 분석가가 업종·지역별로 어느 사업장이 몇 년째 환경정보를 공개하는지, 그중 녹색기업 비율이 얼마인지 비교할 때 쓴다. 비식별화된 사업장 ID(eid_workplace_id)를 키로 같은 기관의 다른 사업장 단위 환경정보 데이터와 연도별로 이어 붙이며, 업체 ID로 본사·지사를 묶어 볼 수 있다.
description_portal: 본 데이터는 한국환경산업기술원 연도별 사업장 단위 환경정보공개 현황을 제공합니다. 본 csv 데이터 내에는 ‘년도’, ‘ 사업장ID 비식별화’, ‘업체ID 비식별화’, ‘본사구분(1본사·2지사)’, ‘업종코드·업종명’, ‘시 도명·시군구명·주소’, ‘총종업원수(국내·국외)’, ‘연간사업장 기준량·단위’, ‘녹색기업여부(Y/N)’, ‘등록일시’ 등 필드를 포함합니다. 사업장별 환경정보공개 참여 현황 분석, 업종·지역별 공개 범위 비교, 녹색기업 지정 현황 점검, 정책 효과 모니터링, 내부 감사 및 보고서 작성, 대시보드 구축 을 위한 기초 통계 데이터입니다.
