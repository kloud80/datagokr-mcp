summary_user: 경기도 내 도시·도로변 대기측정소별로 아황산가스·이산화질소·일산화탄소·오존·미세먼지·초미세먼지 농도를 1시간 평균으로 담은 측정소 단위 원시 측정자료다. 분석가나 지자체 담당자가 "우리 동네 측정소에서 출퇴근 시간대에 미세먼지·오존이 얼마나 높아지는가" 같은 시간대별 대기오염 변화를 추적하는 데 쓴다. 전역 조인 키는 없어 시군명·측정소명(mesure_plc_nm)이나 측정소 코드를 이름으로 맞춰 에어코리아 측정소 정보, 기상 관측 자료와 연결한다.
description_portal: 경기도내 측정소별 대기질 측정자료입니다. 월별 아황산가스(SO2)농도, 일산화탄소(CO)농도, 오존(O3)농도, 이산화질소(NO2)농도, 미세먼지(PM-10), 초미세먼지(PM-2.5) 농도값을 제공합니다.  해당 데이터는 시간별 대기오염 변화 추적, 교통량 또는 기상변화에 따른 대기질 영향 분석, 환경경보 시스템 연계 등에 활용 가능하며, 고농도 오염시간대 예측 및 정책적 대응 수단 마련에도 유용합니다.*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
