summary_user: 전국 지자체가 관리하는 공중화장실을 한 곳씩 담은 건별 시설 원장으로, API 전체 53,587건에 화장실명·도로명/지번 주소·개방시간·남녀별 대소변기 수(장애인·어린이용 포함)·비상벨·입구 CCTV·기저귀교환대 유무를 담는다. 시민이 '우리 동네에서 늦게까지 열고 장애인용 변기와 비상벨이 있는 화장실이 어디인가'를 찾거나, 분석가가 지자체별 안전관리시설 설치 현황을 비교하는 데 쓴다. 개방자치단체코드(OPN_ATMY_GRP_CD, 행정표준 기관코드)로 지자체 단위 데이터와 잇고, 소재지 도로명·지번 주소로 주소·위치 데이터와 이어 쓰며, 필드 목록에 위경도 좌표는 없으므로 지도에 표시하려면 주소를 좌표로 바꿔야 한다.
description_portal: '공중화장실정보 데이터는 국민의 위생상의 편의와 복지증진을 위해 공중이 이용하도록 국가, 지방자치단체, 법인 또는 개인이 설치하는 화장실에 대한 데이터로 화장실명, 소재지 주소 정보와 함께 남녀·장애인·어린이용 위생시설 수, 개방시간 등 기본 이용 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 지자체에서 관리하는 공중화장실정보 화장실명, 주소, 개방시간 등을 제공- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 :  행정안전부 주소정보혁신과 / 044-205-3545 * 공중화장실정보 데이터의 원천데이터 정책 변경에 따라, 지방자치단체별로 소유하고 있는 원천데이터로부터 좌표정보가 제외되어(2025년 2월) 해당 항목의 제공이 중단됨을 안내해 드립니다.   [제외 항목] WGS84 위도,WGS84 경도'
team:
  dept: 지역디지털협력과
services:
  - op: /info_v2
    name: 공중화장실정보 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/public_restroom_info_v2/info_v2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[LCTN_ROAD_NM_ADDR::LIKE]
        required: false
        desc: 소재지도로명주소 을(를) 포함하는 값
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[DAT_CRTR_YMD::GTE]
        required: false
        desc: 데이터기준일자 이상의 값(YYYYMMDD)
      - name: cond[DAT_CRTR_YMD::LT]
        required: false
        desc: 데이터기준일자 미만의 값(YYYYMMDD)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
