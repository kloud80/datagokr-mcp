summary_user: 전라남도 고흥군에 있는 대기오염물질 배출시설 사업장을 한 행에 하나씩 담은 목록으로, 사업장명·소재지 전체주소·주생산품명을 담는다(csv 약 9KB, 시군구 범위의 개별 주소 단위). 주민이나 분석가가 '우리 동네 근처에 대기오염물질을 배출하는 사업장이 어디 있고 무엇을 생산하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소를 매핑해 이어야 하며, 주소를 좌표로 바꾸면 인근 대기질 측정소 자료와 공간적으로 겹쳐 볼 수 있다.
limits: 실제 배출량이나 시간별 대기질 수치는 없고 사업장 목록만 담는다. 사업자번호 같은 공통 코드가 없어 다른 사업장 데이터와 연결할 때 이름·주소 일치에 의존해야 한다.
