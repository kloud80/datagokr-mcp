description_portal: 서울두드림길의 지천길 점형 공간정보로 좌표(위경도)등의 정보를 제공하는 서비스 입니다.이 데이터는 서울시 내 ‘지천길’ 경로상의 주요 지점들을 점형 공간정보(위경도 좌표, WGS 84 좌표계) 형태로 제공한 자료입니다.  각 지점은 걷기길의 쉼터, 경유포인트, 안내표지판 등으로 추정되며, CSV 또는 쉐이프파일 형식으로 제공되며 쉐이프파일의 기본 인코딩은 UTF-8입니다.  좌표가 포함되어 있어 GIS(지리정보시스템) 분석, 모바일 애플리케이션의 경로 기능, 둘레길 접근성 평가, 지점별 밀도 분석 등에 활용 가능하며, 특히 걷기·레크리에이션 인프라 측면에서 자치구별 개선이 필요한 지점을 탐색할 수 있는 자료입니다. 또한 제공기관은 서울특별시 푸른도시여가국 자연생태과이며 갱신은 비정기 ‘자료변경 시’ 방식으로 이루어집니다※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
