summary_user: 환경부가 운영하는 다중이용시설 실내공기질 자동측정망의 실시간 측정정보를 API로 담은 데이터이며, 검증 호출에서 전국 범위 1,055행이 수신되었다. 지하역사나 대형 시설 등의 실내공기질 현황을 확인하려는 분석가나 정책 담당자가 실내공기질 저감 방안의 기초자료로 쓴다. 전역 조인 키는 확인되지 않아 다른 데이터와는 이름·코드 매핑이나 같은 기관(한국환경공단) 코드로만 이어 쓰며, 같은 환경기상 부문의 대기질 실시간(에어코리아)과 비교할 때도 이 방식이 필요하다.
