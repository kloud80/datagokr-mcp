summary_user: 서울 강북구에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 원장 파일로, 상호·도로명주소·폐기물 종류·처리구분·처리방법(재활용·소각 등)을 기록한다. 강북구 안에서 어떤 사업장이 어떤 폐기물을 내고 재활용·소각 중 어떤 방식으로 처리하는지 확인하려는 주민·폐기물 처리업자·환경 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명주소 매칭으로만 잇는다. 같은 강북구의 폐기물 처리업 허가 현황 등 같은 기관 데이터와 함께 보는 방식이 현실적이다.
description_portal: 사업장폐기물은 「대기환경보전법」, 「물환경보전법」, 「소음·진동관리법」 등 관련 법령에 따라 배출시설을 운영하거나 일정량 이상 폐기물을 배출하는 사업장에서 발생하는 폐기물을 의미합니다. 대기환경보전법 등 배출시설 운영으로 발생하는 폐기물 (1일 100kg 이상 배출 시)해당됩니다서울특별시 강북구 사업장폐기물 배출자 신고현황 데이터는 소재지와 폐기물 종류, 처리구분, 처리방법(재활용(연료·고형연료제품 제조), 재활용(중간가공폐기물 제조), 재활용(농업생산활동에 사용), 재활용(원료 제조), 재활용(파쇄.분쇄), 중간처분(일반소각))에 대한 자료입니다
