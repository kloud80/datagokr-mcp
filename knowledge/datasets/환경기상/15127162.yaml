description_portal: 경기도 이천시 내 토양오염 우려지역에 대한 실태조사 결과를 제공하는 데이터입니다. 항목은 조사지점 명칭, 도로명주소, 지번주소, 기준초과 여부 등으로 구성되며, 각 조사지점의 위치와 오염 기준 초과 여부를 확인할 수 있습니다. 본 데이터는 토양환경 보전계획 수립, 오염지점 관리대상 지정, 정화사업 추진, 토지이용제한 검토, 주민 건강보호 등의 환경 행정업무에 활용됩니다. 특히 위치 정보는 공간 기반 오염 분포 분석에 유용하며, 기준초과 여부는 오염심각도 판단 및 사후 조치 결정에 중요한 자료로 활용됩니다.
