description_portal: '서울특별시 서대문구 관내에 위치한 건설폐기물처리업현황(사업장, 주소, 전화번호, 좌표 등)에 대한 데이터를 제공합니다.서대문구의 건설현장에서 나오는 건축폐기물을 수집·운반 및 중간처리하는 업소정보 입니다.  서대문구내 건설폐기물업체 위치와 영업 상태 파악에 활용할 수 있습니다.서대문구 건설폐기물처리업 데이터의 주요항목은 사업장명, 주소, 영업상태, 좌표, 인허가일자 등이 포함되어있습니다.이 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.  좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보'
