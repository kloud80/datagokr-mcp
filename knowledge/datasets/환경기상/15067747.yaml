description_portal: 이 데이터는 '나무 병원' 서비스에 접수된 수목 진단 요청 현황을 기록한 자료입니다. 마을의 당산나무, 아파트 단지의 소나무, 학교 숲의 나무 등 시민들이 직접 겪는 생활권 주변 나무의 건강 문제에 대한 요청사항을 담고 있습니다. 각 요청은 '느티나무가 말라죽어가요', '소나무 가지가 노랗게 변해요' 와 같이 구체적인 증상을 설명하고 있으며, 접수일과 함께 진단을 위한 사진 파일명이 기록되어 있습니다. 이 자료는 지역 주민들이 관심을 가지는 수목의 종류와 주요 병해충 등 산림 건강 문제의 동향을 파악하는 데 유용한 생활 민원 데이터입니다.
