description_portal: '생태독성관리제도는 기존 개별물질에 의한 수질평가의 한계를 극복하기 위해 도입한 것으로 방류수에 포함된 미지의 유해물질을 살아있는 생물체로 독성 여부를 측정함으로써 산업폐수의 수질을 통합적으로 관리하기 위한 제도입니다. 생태독성은 시료에 물벼룩(Daphnia magna)을 투입하여 급성독성을 평가하는 것으로 물벼룩이 독성에 영향을 받게 되는 정도를 생태독성값(TU, Toxic Unit)으로 계산한 것입니다.1. 사어장 생태독성관리를 위해 2008년부터 기술지원하여  측정한 데이터를 기반으로 AI학습 테스트용 합성데이터(가상데이터)를 생성하였습니다.2. 합성데이터 설명- 원본데이터 이용기간 및 건수: 2008~2024년, 1~2회 생태독성 측정값- 원본데이터 특성 :  방류수 생태독성 측정값 1~2회 중 최대값이 생태독성 값임- 합성데이터 특성 :  범주형 및 수치형 데이터 혼재- 합성데이터 활용 : 실제 측정 데이터의 구조와 통계적 특성을 반영하되 민감정보를 포함하지 않아 AI학습 테스트 데이터로 활용 가능'
