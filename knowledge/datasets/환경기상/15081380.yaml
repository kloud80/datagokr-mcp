summary_user: 전국 공동주택 단지별로 RFID 음식물종량기 설치대수와 세대수, 주소, 기준일자를 한 행씩 담은 단지 단위 현황 파일이다(CSV, 약 1.26MB). 지자체 담당자나 연구자가 "우리 시군구 아파트 단지의 세대당 종량기 보급 수준은 다른 지역과 비교해 어떤가"를 따질 때 쓴다. 전역 조인 키가 없어 지자체명이나 주소를 행정구역 이름·코드에 맞춰 매핑해야 다른 데이터와 연결된다.
description_portal: 본 데이터는 전국 공동주택 단지별 RFID 기반 음식물종량기 설치 현황을 제공하며 지자체명, 공동주택명, 세대수, 설치대수, 기준일자 등의 정보를 포함하고 있습니다. 각 공동주택 단지별로 음식물쓰레기 종량제 시스템이 어느 정도 도입·운영되고 있는지를 확인할 수 있고 이를 통해 세대당 종량기 보급률을 분석하거나 지역 간 보급 수준을 비교할 수 있습니다. 지자체는 이 데이터를 활용해 음식물쓰레기 감량 정책의 효과를 평가하고 향후 설치 확대 계획을 세우는 데 참고할 수 있으며 연구자나 시민은 주거 형태별 음식물쓰레기 배출 관리 현황을 파악하는 자료로 활용할 수 있습니다. 또한, 민간기업에게는 RFID 종량기 제작·유지보수와 같은 관련 산업 수요를 예측하는 데 기초자료가 될 수 있습니다.
