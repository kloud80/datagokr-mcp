description_portal: 방재자원 입출고 이력 데이터는 국립공원공단 통합방재시스템에서 관리하는 방재 관련 자원의 입고·출고 내역에 대한 데이터입니다. 대상 자원은 산불진화차량, 등짐펌프 등 산불진화장비, 진화복·안전모 등 개인진화장비, 무전기 등 무선통신장비, 제설제·제설자재, 방제물품 등 국립공원 재난 예방·대응에 사용되는 물자 전반이며, 각 내역은 입출고일, 수량, 운영비용, 설명(입출고·폐기·수량정정 사유 등 특이사항), 시스템 등록일시의 5개 항목으로 구성되어 있습니다.데이터는 2002년부터 데이터 기준일까지의 이력을 포함하며, 전국 국립공원사무소 담당자가 통합방재시스템에 등록한 내역을 취합한 것입니다.* 개인정보 보호를 위해 등록자 성명 항목은 제공에서 제외되었습니다.* 운영비용은 원 단위이며, 값이 0인 경우 폐기·소모·수량정정 등 비용이 발생하지 않은 내역입니다.* 설명 항목이 공란인 경우 통상적인 구매·배부 등 일반 입출고에 해당하며, "오기입", "수량 수정" 등이 기재된 행은 기존 등록 내역의 정정 이력이므로 분석 목적에 따라 제외하고 활용하시기 바랍니다.본 데이터는 다음과 같이 활용할 수 있습니다.① (재난대응 물자 수급 분석 및 적정 비축량 산정) 봄·가을 산불조심기간과 겨울철 제설기간의 월별·계절별 출고량을 시계열 분석하여 진화장비, 제설제 등 재난대응 물자의 소요 주기를 도출하고, 수요예측 모형(이동평균, ARIMA 등)을 적용한 차년도 적정 비축량 산정 및 구매계획 수립에 활용할 수 있습니다.② (장비 생애주기 및 자산관리 분석) "내용연수 초과", "노후 폐기", "파손", "고장" 등 폐기 사유별 이력과 입고일-폐기일 간격을 분석하여 장비 유형별 실사용 수명을 산출하고, 조달청 내용연수 기준과의 비교 검증, 연차별 교체 물량·예산 추계, 취득원가 대비 운영비용 분석 등 공공자산 관리 연구에 활용할 수 있습니다.③ (재난 발생과 자원 소모 간 연계 분석) "산불진화에 따른 소모·훼손", "산불 발생 사용", "제설작업" 등 실제 재
