description_portal: '본 데이터는 한국수자원공사에서 조류경보제 발령 시 수행한 원수 내 독소검사 결과를 제공합니다. 조류경보제는 조류 증식에 따른 수질오염을 예방하고 수돗물 안전을 확보하기 위한 제도입니다. 자료에는 조류경보 단계, 관측지점, 검사일자, 미세조류 독소류(예: 마이크로시스틴) 측정값 등이 포함되며, 경보 발령 시 원수의 독성 변화, 정수처리 대응, 수질예측 분석, 조류 확산 경향 연구 등에 활용 가능한 기초자료입니다.추가 정보는 밑의 URL링크를 참고바랍니다.https://www.waternow.go.kr/web/tapWaterData'
