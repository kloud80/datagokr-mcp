summary_user: 성남시가 점검한 환경오염물질 배출시설을 시설별로 한 행씩 담은 원천 목록으로, 시설구분·시설명·점검일자를 담고 범위는 성남시(시군구) 한 곳이다. 시민이나 분석가가 '올해 성남시에서 어떤 배출시설이 언제 점검을 받았는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 사업장 인허가 원장과는 시설명 문자열 매칭이나 같은 기관 데이터끼리로만 이어 쓴다.
limits: 시설명 외에 공통 식별 키가 없어서 다른 배출시설 인허가·위반 데이터와 정확히 연결하기 어렵다. 범위가 성남시 한 곳뿐이라 시군 간 비교에는 다른 지자체 데이터를 따로 모아야 한다.
