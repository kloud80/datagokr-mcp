description_portal: 성남시 환경오염물질배출시설 점검 현황입니다.(시설구분,시설명,점검일자 등)※ 올해 점검 시설에 대한 데이터임대기환경보전법 및 물환경보전법에 따른 환경오염물질(대기,폐수,소음진동) 배출 사업장 현황입니다(사업장명, 업종, 종별, 주소, 관리부서)성남시 환경오염물질 배출시설 점검현황 데이터는 대기, 수질, 폐기물, 악취 등 환경오염물질을 배출하는 사업장 현황 행정 정보입니다. 이 데이터에는 점검 대상 사업장의 명칭, 시설구분, 점검 일자 등의 항목이 포함됩니다. 성남시는 해당 데이터를 기반으로 고위험 오염원 집중관리, 반복 위반 사업장 추적, 산업단지 환경 리스크 평가, 환경 민원 대응의 신속성 제고 등 다양한 행정적 대응을 수행하고 있습니다.
