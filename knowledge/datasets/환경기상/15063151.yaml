summary_user: 경상북도 시·군에서 운영하는 음식물류 폐기물 처리시설을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 2KB)로, 시·군 구분, 소재지 주소, 업체명, 시설종류, 하루 처리용량(톤)이 들어 있다. 지자체 담당자나 분석가가 '우리 시·군에는 음식물 처리시설이 어디에 있고 하루 몇 톤을 처리하나', '시·군 간 처리용량 차이는 얼마나 되나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어 다른 데이터와는 시·군 이름(구분)이나 주소 문자열로 맞춰 이어야 한다.
