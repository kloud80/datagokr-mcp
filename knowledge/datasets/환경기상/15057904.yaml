summary_user: 경기도 시군별 음식물류폐기물 발생량(톤), 인구수, 1인당 하루 평균 발생량(kg)을 담은 연간 집계 자료이며, 건별 배출 기록이나 수거 지점 정보는 아니다. 지자체 담당자나 분석가가 "우리 시의 1인당 음식물쓰레기 발생량이 도내 다른 시군보다 많은가"를 비교하거나 감량 목표를 정할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명이나 경기도 자체 시군 코드(SIGUN_CD)를 맞춰 이어 쓴다.
description_portal: '이 데이터는 경기도 각 시군별 음식물쓰레기 발생 현황을 집계한 자료로, 음식물류폐기물 발생량(톤), 인구수(명), 1인당 1일 평균 발생량(kg) 등의 정보를 제공합니다. 해당 데이터는 자원순환 및 폐기물 감량 정책 수립, 음식물쓰레기 감축 목표 설정, 환경 교육자료 작성 등에 활용될 수 있습니다. 데이터는 연간 기준으로 갱신되며, 경기도 자원순환과에서 관리합니다. 음식물쓰레기는 분리배출 대상 중 하나로 처리 과정에서 에너지 회수 또는 퇴비화 등 자원화가 가능하므로, 발생량의 지속적 모니터링은 환경보호와 직결됩니다. 데이터는 XML 및 JSON 형식의 API로 제공됩니다.- 음식물류폐기물: 일반적으로 가정이나 식당 등에서 발생하는 음식 찌꺼기, 식재료 폐기물 등을 포함하며, 퇴비화나 사료화 등 재활용이 가능한 폐기물입니다.- 1인1일발생량: 한 사람이 하루 동안 평균적으로 배출하는 음식물쓰레기의 양을 의미하며, 폐기물 관리 효율성 판단의 지표로 사용됩니다.'
