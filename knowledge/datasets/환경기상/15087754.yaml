summary_user: 유해화학물질 취급시설 검사 수수료를 산정하는 기준표로, 시설 유형(제조사용시설·실외저장시설 등)과 검사 방법(정기·수시·설치검사 등)별로 취급량 구간(시작용량~끝용량)에 따른 시설공량과 용량 보정계수를 담은 전국 단위 비공간 코드표 파일(csv)이다. 유해화학물질 취급 사업자나 검사 실무자가 우리 시설의 취급량과 검사 유형이면 기준 공량과 수수료가 얼마로 잡히는지를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 검사 데이터와는 시설타입·검사방법 코드나 이름을 맞춰 이어 써야 한다.
description_portal: 유해화학물질 취급시설 검사 수수료는 시작용량, 끝용량 ,시설용량보정계수 ,검사구분, 시설구분, 시설공량 기반으로 산정.   시작용량과 끝용량은 해당 시설이 취급하는 유해화학물질의 양을 기준으로 정해지는 구간. 용량 구간에 따라 기준 공량이 달라짐.   검사방법은 정기검사, 수시검사, 설치검사 등 검사 유형 구분하는 코드  시설타입은 제조사용시설, 실외저장시설 등 시설의 구분하는 코드시설별 기본공량,  시작용량~끝용량 구간 기준으로 보정계수, 검사 방법 등 종합 반영해 최종 공량 산정하고 이 공량이 검사 수수료 산정 기준이 됨.
