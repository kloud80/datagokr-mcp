summary_user: 경기도 환경관리대행기관의 사업장 자가점검 신청을 건별로 담은 자료로, 신청연도·사업장명·사업자번호·업종·신청일·처리상태·승인일과 유독물·대기·수질 대행 여부, 계약업체와 계약기간, 점검항목별 해당 여부와 비고를 행마다 기록한다. 지자체 담당자나 분석가가 경기도에서 어떤 업종의 사업장이 대기·수질 배출시설 관리를 대행기관에 맡기고 있고 신청이 승인됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 배출시설·인허가 사업장 원장과는 사업자번호(bizregno)나 사업장명·주소를 맞춰 보는 방식으로 연결한다.
description_portal: 이 데이터는 환경관리대행기관의 사업장 자가점검 신청내역을 정리한 자료로, 신청연도, 사업장명, 사업자번호, 업종코드 및 업종명, 등록구분, 신청일, 처리상태, 승인일, 유독물 취급 여부, 관리대행대상 항목별 대행 현황(대기/수질/유독물 각 1종~5종) 등 총 63개의 세부 항목으로 구성되어 있습니다. 환경관리대행기관은 대기·수질오염 배출시설을 위탁받아 관리하는 기관으로, 이 점검표는 기관의 관리범위, 역량, 자격 요건 충족 여부 등을 확인하는 데 활용됩니다. 각 항목별 관리시설 수를 통해 기관의 활동 범위와 전문성 정도를 파악할 수 있으며, 환경부와 지자체의 인증 및 사후관리 자료로도 활용됩니다.
accrual_periodicity: 수시
team:
  dept: AI미래행정과
