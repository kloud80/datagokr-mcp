summary_user: 환경영향평가 대상 사업의 대기질 조사지점별로 조사차수·조사기간, 미세먼지·이산화질소·아황산가스·중금속·다이옥신 등 측정값, 공사시·운영시 예측 평균농도를 건별로 담은 전국 범위 파일(zip, 약 11MB)이다. 개발사업 인근 주민이나 분석가가 특정 사업의 공사·운영 단계에서 미세먼지·이산화질소 농도가 얼마로 조사·예측되었는지 확인할 때 쓴다. 사업코드(BSNS_CD)로 같은 기관의 환경영향평가 협의 현황·사업구역 데이터와 묶고 조사지점 좌표로 지도에 올려 쓰며, 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·주소 매핑으로만 연결한다.
description_portal: 환경부 환경영향평가 사업의 조사지점을 기준으로 조사된 대기질 속성 조회정보(조사지점명, 주소, 좌표, 조사정보, 공사시/운영시 평군정보 등)와 사업구역 연돌을 기준으로 연돌에서 조사된 대기질 속성 정보(연돌명, 주소, 좌표, 연돌높이, 연돌직경 등) 그리고 사업구역을 기준으로 예측된 대기질 속성 조회정보(공사시/운영시 미세먼지, 이산화질소 등의 배출(발생)량)를 제공하며 공간좌표를 기준으로 대기질 연돌위치의 피쳐 정보, 대기질 연돌위치의 포인트 이미지, 대기질 조사지점의 피쳐 정보 대기질 조사지점의 포인트 정보를 제공하는 서비스입니다.
