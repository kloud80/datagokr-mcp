summary_user: 광산구 관내 공동주택에 설치된 폐의약품 수거함을 수거함(설치장소) 한 곳당 한 행으로 담은 개별 지점 목록으로, 설치장소명·주소·위도·경도·전화번호를 포함한다. 주민이 '우리 아파트 근처에서 남은 약을 어디에 버릴 수 있나'를 찾거나, 보건행정 담당자가 공동주택 수거함 배치 현황을 점검하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 위치를 맞추거나, 같은 광산구의 다른 폐의약품 수거함·생활폐기물 배출 지점 파일과 이름·주소 기준으로 이어 쓴다.
description_portal: 광주광역시 광산구 관내 공동주택 에 위치한 폐의약품 수거함 현황 정보(시도명, 시군구명, 구분, 설치장소명, 주소, 위도, 경도, 전화번호 등)를 제공합니다.지역 내 폐의약품 수거함 위치를 파악하고 관리하는 데 활용됩니다.설치명, 도로명 주소및 위도, 경도 전화번호를 포함하고 있어, 시민들이 폐의약품 수거함 위치를 쉽게 찾고 연락할 수 있도록 돕습니다.이 정보는 보건의료 관련 정책 수립, 지역 보건행정 업무 등 다양한 분야에서 활용될 수 있으며,광주광역시 광산구 보건소 보건행정과 의약팀에서 관리하고 있습니다.
