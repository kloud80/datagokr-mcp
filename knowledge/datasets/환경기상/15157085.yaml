summary_user: 환경영향평가 사업구역의 조사지점별 소음(dB(A))·진동(dB(V)) 측정값을 조사차수·조사기간·주소·좌표와 함께 담은 건별 원천 파일로, 조사지점 위치를 담은 SHP 공간파일을 포함한 약 10MB zip으로 전국 범위를 제공한다. 개발사업 예정지 인근 주민이나 분석가가 '이 사업 부지 주변의 공사 전 소음·진동 수준이 어느 정도였나'를 확인하는 데 쓴다. 전역 조인 키는 없고 환경영향평가 사업코드(사업코드)로 같은 기관의 사업구역·협의 현황 등 다른 항목별 평가정보와 잇거나, X·Y좌표로 토지이용규제·개발사업 공간정보와 겹쳐 쓴다.
description_portal: 환경부 국립환경과학원 환경영향평가 사업구역, 조사지점을 기준으로 조사된 소음진동에 대한 정보를 소음진동속성조회, 공간정보를 가진 데이터 제공하며 속성(조사지점, 조사차수, 주소, 진동(dB(V)), 조사차수, 조사시작일, 조사종료일, 소음(dB(A)), Y좌표, X좌표, 조사지점명) 와 공간좌표를 기준으로 소음진동 조사지점의 피쳐 정보(피쳐의 공간 좌표 데이터, 공간데이트를 구성하는 인덱스값, 환경영향평가 사업코드, 사업지구분, 사업지점명, 해당 공간데이타 구축 방법, 해당 공간데이터 값의 유효여부, 해당 공간에 대한 길이, 해당 공간에 대한 면적)를 공간좌표를 기준으로 소음진동 조사지점의 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.
