summary_user: 대구광역시 서구 관내 사업장폐기물 배출자 신고 현황을 사업장(상호) 단위로 담은 파일 데이터로, 폐기물 종류·운반자·처리업소·처리방법(재활용·중간처분·매립 등)·도로명주소·신고기준년도가 들어 있다. 사업자나 분석가가 서구의 어느 사업장이 어떤 폐기물을 배출해 어느 업체에 맡겨 어떻게 처리하는지 확인할 때 쓴다. 전역 조인 키는 없으므로 상호명·처리업소명으로 폐기물 처리업 허가 목록과 이름을 맞추거나, 사업장 도로명주소로 주소 기반 데이터와 이어 쓴다.
description_portal: '대구광역시 서구 관내에 위치한 사업장폐기물 배출자 신고현황 데이터 입니다. 연번, 상호명, 폐기물종류, 연락처, 운반자명, 처리업소명, 처리방법, 사업자도로명주소, 신고기준년도 자료를 포함하고 있습니다.[데이터 상세설명]폐기물종류: 배출한 폐기물의 분류(전자제품, 폐수, 폐섬유 포함 50종)처리방법: 폐기물을 처리한 방법(재활용, 중간처분, 매립 등)이에 대한 자세한 사항은 대구 서구청 대표홈페이지 > > 정보공개 > 사전정보공표 > 사전정보공표 목록 사업장(일반, 지정)폐기물 배출자 현황 내역을 확인하시면 됩니다.https://www.dgs.go.kr/portal/board/post/list.do?bcIdx=510&mid=0502020000&token=1747024613951'
