description_portal: '신재생에너지 등 신산업 지원을 위해 천리안2A호 데이터와 인공지능기법인 합성곱 인공신경망(CNN)을 활용하여 산출한 일사량 데이터입니다.생산주기:- 매정시 20분(1시간 간격)/2019. 7. 25. 00UTC ~ 2023. 6. 26. 05UTC- 매정시 20분, 50분(30분 간격)/2023. 6. 26. 06UTC ~보유기간: 2019. 7. 25. 00UTC ~(참고) 천리안위성 2A호(GEO-KOMPSAT-2A)는 기존의 단순 물리 기반 방정식뿐 아니라 인공지능(AI) 기법을 활용하여 지표면 일사량(태양복사량)을 산출하고 있습니다. 이는 태양광 발전 예측, 기상·기후 분석, 에너지 수급계획 등에 활용되는 핵심 자료입니다.'
