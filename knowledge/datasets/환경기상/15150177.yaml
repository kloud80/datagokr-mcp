description_portal: 이 데이터는 대전광역시 서구에서 습득한 PP마대(폴리프로필렌 마대) 이미지 200장과 해당 객체에 대한 라벨링 텍스트 파일 200장으로 구성되어 있습니다. 실제 생활환경에서 수거된 PP마대의 형태와 특징을 반영하여 제작되었으며, 인공지능 학습용 데이터로 활용할 수 있도록 개인정보 및 민감정보는 모두 제거하였습니다. 특히 대전 서구에서만 쓰이는 특유의 PP 마대 이미지를 포함하고 있어 (지역 특화형 PP마대 이미지를 포함) 자원재활용, 폐기물 관리, 이미지 인식 및 분류 모델 개발 등 다양한 연구·산업 분야에서 활용이 가능합니다.
