summary_user: 해양환경공단이 추진한 해양쓰레기 수거사업을 사업구분·세부사항별로 나누어 2020~2023년 연도별 실적을 가로로 펼친 전국 단위 집계표로, 987바이트 크기의 작은 CSV 파일이다. 정책 담당자나 분석가가 "연안정화·항만청소 같은 수거사업 가운데 어떤 사업의 실적이 해마다 늘거나 줄었는가"를 비교할 때 쓴다. 실측 컬럼에 지역코드나 사업코드 같은 공통 조인 키가 없으므로, 다른 해양쓰레기 통계와는 사업 이름을 맞춰 보거나 같은 기관(해양환경공단) 자료끼리만 이어 쓴다.
description_portal: 해양환경공단이 추진한 해양쓰레기 수거사업의 사업별 실적 정보를 제공합니다. 본 데이터는 연안정화사업, 항만청소, 민간참여 수거사업, 지자체 협력사업 등 다양한 형태의 수거사업별 집계 결과를 포함하고 있으며, 연도별 수거량, 참여인력, 수거지역, 수거방식 등의 항목이 정리되어 있습니다. 각 사업은 추진 목적, 대상 지역, 수행 주체, 참여 방식 등에 따라 구분되며, 사업별 효율성과 성과 비교가 가능하도록 구성되어 있습니다. 본 자료는 해양쓰레기 관리정책 수립, 사업 효과 분석, 지자체·기관별 평가, 예산 기획 등에 활용되며, 정책 의사결정 참고자료로 제공됩니다. 데이터는 통계표 및 보고서 형태로 제공되며, 해양환경 개선을 위한 실무자료로 활용됩니다.
