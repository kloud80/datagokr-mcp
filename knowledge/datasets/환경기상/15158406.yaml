description_portal: 본 데이터는 광주광역시 동구 관내에 설치된 무인회수기(인공지능 캔·페트병 자동수거기)를 통한 자원 재활용 배출 현황을 제공합니다. 주요 데이터 구성 항목으로는 무인회수기가 설치된 세부 위치(학운동 공영주차장, 산수동 문화마당, 동구 국민체육센터 등), 소재지 지번 주소, 기기별 누적 배출량(개수), 그리고 데이터의 정확성을 담보하는 데이터 기준일이 포함되어 있습니다.본 자료를 통해 동구 관내의 거점별 분리배출 이용률과 자원 순환 패턴을 분석할 수 있으며, 향후 쓰레기 감량 정책 수립이나 재활용 활성화 구역 선정, 무인회수기 추가 설치를 위한 기초 행정 자료로 활용이 가능합니다. 특히 시민들의 자발적인 재활용 참여도를 수치화된 데이터로 확인할 수 있어 탄소중립 실천 및 순환 경제 활성화 연구에 유용한 정보를 제공합니다.
