summary_user: 경기도 시흥시 오이도 인근 해역 자동측정망이 측정일시별로 기록한 수온·염분·용존산소·pH·탁도·클로로필 등 수질 항목과 총질소·총인 등 영양염, 기온·풍속·일사량 같은 기상 항목을 담은 CSV 파일(약 16.8MB)이다. 연구자나 지자체 담당자가 오이도 연안의 용존산소 저하나 영양염 증가가 언제, 어떤 기상 조건에서 나타났는지 시계열로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 정점의 해양수질자동측정망 파일과는 측정일시와 정점 이름을 기준으로 맞춰 이어 쓴다.
description_portal: 해양환경공단이 제공하는 ‘해양수질자동측정망 오이도’ 데이터에 대한 정보를 제공합니다. 본 데이터는 경기도 시흥시 오이도 인근 해역의 해양수질을 상시적으로 관측하기 위해 구축된 자동측정망의 측정 결과를 포함합니다. 주요 내용에는 조사 정점 위치, 수온, 염분, 용존산소, pH, 탁도, 전기전도도, 영양염류 농도 등 주요 수질 지표와 시간별·일별·월별 변화 추이가 수록됩니다. 이를 통해 오염원 영향 분석, 수질 변화 모니터링, 환경개선 효과 평가가 가능하며, 장기적인 해양환경 관리의 기초자료로 활용됩니다. 해당 정보는 해양보전 정책, 환경영향평가, 연구 분석, 수질 관리 계획 수립, 교육 자료 등 다양한 목적으로 공공기관, 연구기관, 지자체, 산업계 등에서 폭넓게 이용됩니다.
