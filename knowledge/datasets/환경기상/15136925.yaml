description_portal: 충청남도 당진시에서는 온실가스 감축 및 에너지 사용 효율화를 지원하기 위하여 「온실가스 감축모니터링_에너지 관리」 관련 데이터를 개방하고 있습니다. 본 데이터는 당진시에서 운영·관리하는 에너지 관리 정보시스템과 연계된 자료로, 공공시설 또는 관리 대상 시설의 에너지 사용 현황을 체계적으로 파악하고, 온실가스 배출 저감 정책 수립 및 에너지 절감 효과 분석에 활용될 수 있는 기초자료입니다.제공되는 데이터의 기준일은 2024년 9월 14일이며, 총 2개의 파일로 구성되어 있습니다. 각 파일은 에너지 관리 방식 및 정보시스템의 성격에 따라 구분되어 있으며, 당진시 온실가스 감축 모니터링 체계와 관련된 서로 다른 유형의 데이터를 제공합니다.
