summary_user: 고양시에 접수된 대형폐기물 배출 신고를 신고 건별로 담은 원천 파일로, 신청날짜·배출장소(행정동)·품명·규격·수량·수수료 금액·신청경로를 기록하며 범위는 고양시 한 곳, 지역 단위는 읍면동이다. 고양시 행정동별로 어떤 품목(가구·가전 등)이 언제 많이 배출되는지 보고 수거 인력·차량 배치나 수수료 수입 추이를 따지려는 지자체 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름을 행정구역 코드에 매핑하거나 품명을 다른 지자체 대형폐기물 품목·수수료표와 이름으로 맞춰 이어 쓴다.
limits: 표준 행정코드 같은 조인 키가 없어 다른 데이터와 붙이려면 행정동 이름 매핑이 필요하다. 고양시 한 시의 신고 내역만 담아 다른 지자체와 비교하려면 지자체별로 따로 올라온 파일을 모아야 한다.
