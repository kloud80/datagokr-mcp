summary_user: 광주광역시 안의 폐기물처리업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 시도·시군구, 업종 구분, 업체명, 소재지 주소, 데이터기준일자를 담는다(포털 설명상 2024년 12월 31일 기준이며 수집운반 업체가 중심이다). 사업자나 주민이 '우리 구에서 폐기물 수집운반을 맡길 수 있는 업체가 어디에 있나'를 찾거나, 분석가가 구별 처리업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소 문자열 매칭, 또는 시군구 이름으로만 이어 쓴다.
description_portal: 광주광역시 폐기물처리업체 현황을 제공하는 자료로, 시도·시군구별 구분과 업체명, 소재지, 데이터기준일자를 포함하고 있습니다. 폐기물 수집운반 분야의 업체 정보를 중심으로 정리되어 있으며, 동구·서구 등 각 행정구역별 사업장 소재지를 확인하실 수 있습니다. 업체명에는 (합)그리네이처, 무경지엔씨㈜, 조선환경㈜, 대한운수㈜, ㈜대명크린 등이 포함되어 있으며, 2024년 12월 31일 기준 자료로 구성되어 있습니다. 업종 구분과 업체별 위치 정보를 통해 광주시 폐기물 관련 사업장의 현황을 파악하실 수 있도록 제공된 데이터입니다.
