summary_user: 서울 금천구에 신고된 사업장폐기물 배출자를 사업장 건별로 담은 파일로, 상호명·폐기물 종류·신고배출량(톤)·도로명주소·신고연도가 들어 있습니다. 주민이나 분석가가 "우리 동네 어느 사업장이 어떤 폐기물을 몇 톤 배출한다고 신고했나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 상호명이나 도로명주소(사업장도로명주소)를 이름·주소 매칭해 폐기물 처리업 허가 목록 같은 다른 사업장 원장과 이어 쓴다.
description_portal: '폐기물관리법 시행규칙 제18조에 따른 사업장폐기물배출자 신고현황을 제공합니다. 데이터에는 배출자 상호명, 폐기물 종류, 신고배출량(톤), 사업장의 도로명주소, 신고연도가 포함되어 있습니다.이 데이터를 활용하면, 구민 여러분은 특정 사업장에서 배출되는 폐기물의 종류와 양을 확인하고, 지역 내 환경 보호에 대한 정보를 얻을 수 있습니다. 예를 들어, 많은 양의 폐기물을 배출하는 사업장이 있는 경우, 해당 지역의 환경 관리가 중요할 수 있음을 알 수 있습니다.또한, 사업장별 폐기물 배출 정보를 통해 지역 주민들이 친환경적인 사업장 선택이나 환경 보호 활동에 대한 관심을 가질 수 있습니다. 사업장에서는 이 데이터를 참고하여 폐기물 관리 방안을 개선하고, 더 나은 환경을 만들기 위한 노력을 기울일 수 있습니다.이 정보는 지역사회의 환경을 지키고, 폐기물 관리의 투명성을 높이는 데 중요한 역할을 합니다. 관심 있는 분들께서 적극적으로 활용하시면 좋겠습니다!(담당부서 : 금천구 청소행정과)'
