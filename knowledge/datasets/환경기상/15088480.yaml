description_portal: 부산광역시 연제구 미세먼지 쉼터 현황이며, 쉼터의 명칭, 상세주소, 면적, 이용가능인원, 위도, 경도 등의 정보를 제공합니다.미세먼지 쉼터는 미세먼지로 인한 시민 건강 피해 저감을 위해 공기청정기 구비 및 환기설비 설치 등 시설수준을 고려하여 지정·운영하고 있습니다.고농도 미세먼지, 황사가 발생하면 민감군은 실외활동을 자제해 주시고, 외출도중 기침, 목의 통증 등 증상이 나타나면 해당 데이터를 참고하여 관내 미세먼지 쉼터를 이용해주시기 바랍니다.특별한 자격 조건없이 누구나 이용 가능합니다.
