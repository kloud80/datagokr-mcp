summary_user: 전라남도 함평군 안의 종량제봉투 판매소를 업소 한 곳당 한 행으로 담은 파일로, 판매소명, 도로명·지번 주소, 위도·경도, 대형폐기물 스티커 판매 여부, 영업상태를 포함한다. 함평군 주민이 집 근처에서 종량제봉투나 대형폐기물 스티커를 살 수 있는 곳을 찾을 때, 또는 분석가가 읍면별 판매소 분포를 지도에 올려 볼 때 쓴다. 전국 공통 조인 키는 없어서 시도명·시군구명이나 주소·좌표로 다른 지자체의 판매소 파일이나 대형폐기물·수거함 위치 데이터와 이어 쓴다.
description_portal: 전라남도 함평군은 생활폐기물의 효율적인 처리와 주민 편의 증진을 위해 종량제봉투 판매 업소 현황에 대한 정보를 공공데이터로 제공하고 있습니다. 본 자료는 군민이 가까운 곳에서 종량제봉투 및 폐기물 처리 관련 용품을 구매할 수 있도록 판매처 정보를 체계적으로 정리한 것으로, 판매처명, 지번주소, 도로명주소, 우편번호, 위도·경도 좌표 등 위치 정보를 비롯해, 종량제봉투 취급 여부, 음식물납부필증 취급 여부, 대형폐기물 스티커 취급 여부, 특수규격봉투 취급 여부 등의 세부 항목으로 구성되어 있습니다. 해당 데이터는 폐기물 분리배출 정책 수립, 권역별 취급소 분포 분석, 환경민원 대응, 위치기반 안내 시스템 개발, 공공청소 서비스 효율화 등 다양한 행정 및 민간 서비스 개발에 활용될 수 있는 실용적인 공공자원입니다.
