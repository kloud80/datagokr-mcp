description_portal: '인천광역시 부평구 대기 환경오염물질 배출사업장 현황입니다.대기질 개선 정책 수립, 오염물질 배출 총량 관리, 미세먼지 저감 대책 및 환경 지도 점검 등을 위한 기초 자료로 활용됩니다.활용 목적 및 특징○ 배출원 정밀 관리: 지역별 대기오염 배출원의 분포를 파악하여 집중 관리 구역 설정○ 오염물질 저감 정책: 사업장 규모(종별)에 따른 맞춤형 방지시설 설치 지원 및 기술 지도○ 환경 행정 투명성: 대기환경보전법에 따른 인허가 및 정기 점검 이력 관리○ 기후 위기 대응: 온실가스 및 대기오염물질 배출 통계 산출을 통한 탄소중립 전략 수립주요 항목 설명○ 연번: 데이터의 고유 식별 번호○ 사업장명: 대기오염물질 배출시설을 운영하는 업체 또는 기관의 공식 명칭○ 소재지: 사업장이 위치한 건물의 도로명 주소 또는 지번 주소○ 사업장 업종: 해당 사업장에서 영위하는 주요 산업 분류 (예: 금속 가공, 도금업, 화학제품제조가공 등)○ 종별: 연간 대기오염물질 발생량에 따른 사업장 규모 구분'
