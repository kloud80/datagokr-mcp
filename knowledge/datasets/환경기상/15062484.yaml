summary_user: 경기도 광주시에 사업장폐기물 배출을 신고한 사업장별로 상호명, 도로명·지번 주소, 인허가관리번호, 배출하는 폐기물의 코드와 종류를 담은 건별 목록이다(CSV 약 43KB). 사업자나 분석가가 '광주시에서 특정 종류의 폐기물을 배출하는 사업장은 어디에 있는가'를 확인하거나 배출 사업장 원장을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소, 상호명, 배출폐기물코드 같은 이름·코드 매핑으로 이어 붙여야 한다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 사업장별 폐기물 배출 신고 현황 자료입니다. 주요 제공 항목은 상호명, 도로명주소, 지번주소, 인허가관리번호, 배출폐기물코드, 배출폐기물종류로 구성되어 있으며, 각 사업장에서 발생하는 폐기물의 종류와 배출 현황을 파악할 수 있습니다. 해당 데이터는 환경 관리의 투명성을 높이고, 폐기물 처리 과정의 효율성을 증진하는 데 활용될 수 있습니다. 또한, 인허가 정보와 배출내역을 연계하여 행정업무의 신뢰성을 강화하며, 관련 정책 수립과 환경 감시 활동의 기초자료로 제공됩니다.
