description_portal: 이 데이터는 한국석유공사의 사업장에서 사용된 연도별 용수 사용량을 기록한 통계 자료로, 각 연도에 해당하는 총 물 사용량을 수치로 제공합니다. 용수 사용량은 기업의 자원 효율성과 환경영향 수준을 평가하는 데 중요한 지표로 활용되며, 친환경 경영 실천 여부를 판단하는 기반 자료로 사용됩니다. 이 자료는 ESG 경영 평가, 환경부문 지속가능경영 보고, 자원 절약 정책 수립 등 다양한 분야에서 참고할 수 있으며, 산업별 용수 소비 구조나 변화 추이를 파악하는 데도 유용합니다. 데이터는 연도별로 구조화되어 있어 시계열 분석과 시각화 작업에도 적합하며, 공공기관, 기업, 연구기관 등에서 환경 관리 및 정책 수립에 활용 가능한 공공성과 신뢰성이 높은 ESG 자료입니다.
