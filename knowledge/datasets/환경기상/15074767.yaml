description_portal: '"제주 유동인구에 따른 음식물 쓰레기 배출량 예측으로 제주도 내 클린하우스 관리 시스템 최적화 매쉬업 결과 정보입니다.- 읍면동명, 거주인구, 총 유동인구, 배출량 등 정보 제공- 데이터 내 음식물 쓰레기 배출량 데이터의 경우 가정용 음식물 쓰레기 배출량 정보- 데이터 읍면동 구분은 원본데이터 내 장치 이름을 google 지도에 검색하여 API 형태로 호출하여 가공한 것- 거주인구, 근무인구, 방문인구 (명), 선불금액 (원), 배출량 (g)- 유동인구(거주인구, 근무인구, 방문인구)는 해당 유동인구 수의 일별 합계 ※ 유동인구는 01~24시 해당 시간 정각 측정 인구 (머문 시간(분)/60분)*제주빅데이터센터: 지역 데이터 활용 활성화를 통한 데이터 산업 생태계 조성을 목적으로 각종 데이터 확보 및 제공 외의 역할을 함- 경제, 기업, 교통, 통신, 환경 등에 대한 데이터 분석 환경 제공 (폐쇄적 제공)* 데이터 매쉬업(Data Mashup): 서로 다른 출처의 데이터를 결합(융합)하여 새로운 정보나 인사이트를 만드는 작업을 말함※ 출처: 제주데이터허브 https://www.jejudatahub.net/"**추가정보**1. 유동인구 데이터 소수점 의미: 유동인구의 경우 (거주, 인구, 방문) 인구의 평균으로 계산하였기에, 추정치 입니다.2. 유동인구 데이터 단위: 명 입니다.3. 음식물쓰레기 단위: g(그램) 입니다.'
