summary_user: 인천광역시 서해구에서 사용을 멈추고 폐공 처리한 지하수 개발이용시설을 시설 한 곳당 한 행으로 담은 파일로, 소재지·굴착깊이·폐공 종료신고일을 포함하며 내려받은 CSV는 483바이트의 작은 규모다. 신규 관정을 계획하는 사업자나 지하수 정책 담당자가 '개발하려는 위치 근처에 이미 폐공된 관정이 있는가'를 미리 확인할 때 쓴다. 전역 조인 키가 없어 다른 지하수 시설·수질 데이터와는 소재지 주소를 맞추거나 같은 기관 자료끼리 이름으로 맞춰 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서해구 내 지하수 개발이용시설 중 사용이 중단되어 폐공 처리된 시설에 대한 현황을 담고 있습니다. 본 공공데이터는 연번, 시설 소재지, 굴착 깊이, 폐공 종료신고일 등 포함되어 있습니다. 본 데이터를 통해 각 시설의 위치와 폐공 이력을 확인할 수 있습니다. 이를 통해 지하수 관련 정책 등 기초자료로 활용될 수 있으며 폐공된 위치를 사전 파악하여 신규 지하수 개발에 중복을 예방할 수 있습니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신 정보를 반영하고 있습니다.
