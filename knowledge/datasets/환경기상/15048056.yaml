summary_user: 부산광역시 연제구에서 폐기물처리업 허가를 받아 현재 영업 중인 업체를 한 행씩 담은 명부로, 업종(수집운반·처분·재활용 구분)·상호·대표자·소재지·전화번호·관할지역을 담으며 파일 크기는 706바이트의 소규모 CSV입니다. 연제구에서 폐기물 수집운반이나 처리를 맡길 허가 업체를 찾는 사업장, 또는 구 단위 폐기물 처리업 분포를 보려는 분석가가 쓴다. 전역 조인 키나 사업자번호 컬럼이 없어, 다른 데이터와는 상호·소재지 주소를 맞추거나 같은 기관(연제구) 기준으로만 이어 쓴다.
description_portal: 폐기물관리법 제25조에 따라 부산광역시 연제구 관내에서 폐기물처리업 허가를 받은 업체의 현황을 안내합니다.폐기물처리업은 관할 구청의 허가를 받고 수집운반 및 처리를 할 수 있으며, 매년 1월과 7월에(년 2회) 휴업, 폐업한 업체를 제외하고 현재 영업 중인 업체를 기준으로 데이터 현행화 합니다.* 폐기물처리업종의 구분은 다음과 같습니다.1. 폐기물 수집운반업2. 폐기물 중간처분업3. 폐기물 최종처분업4. 폐기물 종합처분업5. 폐기물 중간재활용업6. 폐기물 최종재활용업7. 폐기물 종합재활용업
