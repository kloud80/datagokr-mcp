description_portal: "본 데이터는 울릉도 지역에 자생하거나 분포하는 식물종의 국명, 학명, 국내·해외 분포, 서식지 특성, 생태 및 형태적 특성에 대한 상세 정보를 제공합니다. 울릉도는 고립된 섬 생태계로 독특한 생물지리학적 특성을 가지며, 다양한 고유종과 희귀식물이 서식하는 중요한 생물다양성 보전지역입니다.각 식물에 대해 다음과 같은 항목이 포함됩니다:국명 및 학명분류학적 정보 (과, 속, 종 등)국내 분포 (울릉도 외 타 지역 여부 포함)해외 분포 지역 (주요 대륙 및 기후대 기준)서식지(생육지): 숲 가장자리, 암석지대, 계곡, 고지대 등생태적 특성: 개화기, 번식 방법, 생장 형태, 환경 선호 조건 등형태적 특성: 잎, 줄기, 꽃, 열매 구조에 대한 묘사보호등급 및 자생 여부에 대한 정보도 포함 가능이 데이터는 식물분류학 연구자, 생태계 보전 전문가, 생물종 모니터링 기관 등에 유용하며, 교육·전시자료로도 활용 가능합니다.자세한 정보는 국립생물자원관의 '한반도의 생물다양성' 시스템(https://species.nibr.go.kr)을 통해 열람할 수 있습니다."
