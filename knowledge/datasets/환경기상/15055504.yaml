summary_user: 경기도 고양시 안의 휘발성유기화합물(VOCs) 배출시설을 사업장 한 곳당 한 행으로 담은 파일이며, 연번·사업장명칭·주소만 들어 있는 작은 CSV(약 11KB)다. 주민이나 분석가가 "우리 동네 근처에 VOCs 배출 사업장이 어디 있나"를 확인하거나, 환경 담당자가 지도·점검 대상 목록을 정리할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업장명이나 주소를 맞춰 보는 방식으로만 잇는다. 대기 배출시설 인허가 원장이나 다른 오염원 사업장 목록과 연결할 때도 마찬가지다.
description_portal: 경기도 고양시 내 휘발성유기화합물(VOCs) 배출시설 현황에 관한 데이터로 배출시설명, 사업장 소재지 등 관련 정보를 제공하며 지역 내 대기오염물질 배출시설 관리, 환경오염 예방, 대기환경 보전 및 관련 행정업무 수행을 위한 기초자료로 활용할 수 있는 공공데이터입니다. 또한 사업장의 배출시설 운영 현황 파악과 지도·점검 업무 지원, 환경 관련 민원 대응 및 정책 수립을 위한 참고자료로 활용 가능하며, 대기오염물질 저감 및 쾌적한 생활환경 조성을 위한 환경행정 업무 수행에 필요한 정보를 포함하고 있습니다. 아울러 관련 인·허가 검토, 배출시설 관리대장 현행화 및 환경정보 제공을 위한 자료로도 활용할 수 있습니다.
