description_portal: 해당 데이터는 서울시 전역에서 실시한 토양오염 실태조사 결과 중, 법적 기준인 우려기준 또는 대책기준을 초과한 사례를 정리한 환경 정보 자료입니다. 초과 내용 항목에는 어떤 오염물질이나 항목이 기준을 넘었는지가 기록되어 있어 오염 원인이나 특성을 파악하는 데 도움을 줍니다. 조사년도 항목은 기준 초과가 발생한 시점을 보여주어 연도별 변화 흐름과 관리 성과를 비교할 수 있게 합니다. 또한 초과 개수 항목은 해당 시기에 기준을 넘은 사례의 수를 나타내어 토양환경의 위험 수준을 정량적으로 이해할 수 있도록 합니다. 이 자료는 토양 환경정책 마련, 정화사업 추진, 지역별 환경 위험도 분석 등 다양한 행정적·연구적 활용에 중요한 기초자료로 사용될 수 있습니다.
