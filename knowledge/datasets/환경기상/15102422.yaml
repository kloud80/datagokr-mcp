description_portal: 본 공공데이터는 인천광역시 서구 관내 초,중학교 내 조성된 학교숲의 위치, 면적 도로명주소, 위도, 경도 정보를 제공하고 있습니다. 학교숲은 학생들의 정서함양과 자연친화적 조성을 위한 교정 녹지로서 도심 내 녹지 확충과 미세먼지 저감 등 환경개선의 효과도 기대 될것으로 판단됩니다. 본 자료를 통해 각 학교별 학교숲의 면적과 위치정보를 기반으로 하여 생활권 내 녹지 접근성 분석, 지역 녹화사업 기획 등 다양한 정책에 활용될수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
