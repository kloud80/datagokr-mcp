summary_user: 울진군 관내에서 대기배출시설 설치허가·신고를 한 업체 중 벙커C유·중유·부생연료유 같은 중질유를 연료로 쓰는 사업장을 건별로 담은 작은 파일(csv 693바이트)로, 사업장명·소재지·생산품·사용연료·연간 사용량(리터)을 담는다. 울진군에서 어느 사업장이 어떤 중질유를 얼마나 쓰는지 확인해 연료전환·탄소중립 대상 사업장을 추리려는 행정 담당자나 분석가가 쓴다. 전역 조인 키(사업자번호 등)는 없어 사업장명이나 소재지 주소를 매칭해 다른 배출시설 사업장 자료와 이어 쓴다.
description_portal: 경상북도 울진군 관내 대기배출시설 설치허가 및 신고한 업체 중 중질유(벙커C유, 중유A, 중유B, 중유C, 부생연료유 1호, 부생연료유 2호)를 연료로 사용하는 업체에 대한 사업장명, 전화번호, 소재지, 생산품, 사용연료, 연간 사용량 등의 항목으로 구성된 데이터 입니다. 대기환경보전법에 따른 대기배출시설 설치허가 및 신고한 업체에 대한 정보이며, 신고대상 미만인 업체는 제외되어 있습니다.기후위기에 따른 탄소중립을 위한 연료전환에 따른 중질유 사용이 감소하는 추세로 현재 울진군 관내에는 6개소에서 중질유를 사용하고 있습니다.
