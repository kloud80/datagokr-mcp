description_portal: 경기도 하남시 ITS 시스템에서 수집한 기상 예보 실시간 데이터로, 행정동 단위까지 세분화된 지역별 기상 상태를 정밀하게 파악할 수 있는 고해상도 자료입니다. 기온(celcius)·습도(%)·강수량(mm) 항목은 기본 기상 요소이며, 동서바람·남북바람 두 항목(m/s)은 실제 풍속과 풍향을 벡터로 분해한 값으로, 미세먼지 이동, 폭우·돌풍 분석 등 정교한 환경 분석에 활용 가능합니다. 강수형태와 낙뢰 정보는 단순한 강수량을 넘어 위험 기상요소를 정량적으로 나타내는 지표입니다.  공간 기반 분석 및 GIS 시각화에 필수적인 위치 정보로, 지역별 기상 패턴 비교가 가능합니다. 또한 수집일시는 예보의 최신성·신뢰도를 판단할 수 있는 기준값입니다. 전체적으로 본 데이터는 도로 교통 안전, 재난 예경보, 도시 환경관리 등 다양한 분야에서 활용 가능한 ITS 기반 고정밀 기상데이터입니다.
