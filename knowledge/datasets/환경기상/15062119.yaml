summary_user: 경상북도 칠곡군 관내 사업장폐기물 배출 신고를 건별로 담은 파일로, 사업장 상호·신고일·폐기물 종류·운반자·처리업소명·처리방법·도로명주소를 사업장 단위로 담는다. 지역 사업자나 분석가가 "칠곡군의 어느 사업장이 어떤 폐기물을 어느 업체에 맡겨 어떤 방법으로 처리하는가"를 확인할 때 쓴다. 전역 조인 키가 없어 상호·처리업소명 같은 이름이나 도로명주소로만 다른 폐기물 처리업 허가 목록·사업장 데이터와 맞춰 볼 수 있다.
limits: 사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 칠곡군 한 곳이며, 폐기물 발생량·처리량 통계를 내는 용도의 데이터가 아니다.
