summary_user: 창원시가 신고·관리하는 환경부 소관이 아닌 사업장폐기물·지정폐기물 배출사업장을 사업장 한 곳씩 담은 원장으로, 상호·신고일·폐기물 종류·처리방법·도로명주소가 들어 있다. 창원 시내에서 어떤 사업장이 어떤 폐기물을 배출하고 어떻게 처리하는지, 특정 지역 주변의 배출사업장이 어디인지 확인하려는 시민·점검 담당자·분석가가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호명이나 도로명주소(사업장도로명주소)를 맞춰 잇거나 주소를 지오코딩해 지도에 올려 쓴다.
description_portal: 경상남도 창원시_사업장폐기물 및 지정폐기물 배출사업장(환경부소관 제외) 현황(상호, 신고일, 폐기물종류, 처리방법, 사업장 주소, 데이터기준일)지자체 또는 지방 환경청이 관리하는 환경부 소관이 아닌 사업장들의 폐기물 및 지정폐기물 배출내역과 배출사업장 현황을 포함한 자료입니다. 이 데이터는 폐기물 배출 사업장의 지역 분포, 배출량 추이, 지정폐기물 유형, 행정처분 이력 등을 종합적으로 파악할 수 있어, 폐기물 관리, 지역 환경 정책 수립, 민원 응답 및 시설 점검 등에 폭넓게 활용될 수 있습니다.본 자료는 각 지자체 단위로 신고·관리되는 비환경부 소관 사업장의 배출정보를 기반으로 하며, 데이터가 방대할 경우 일반 뷰어에서는 일부만 확인될 수 있으므로 R, Python, GIS 등 분석 전문 도구를 활용하시는 것을 권장드립니다.데이터 집계 기준(신고기한, 배출량 단위 등), 지정폐기물 정의 및 행정처분 기준 등 세부 정보는 제공기관의 메타데이터나 기술문서를 참고해 주세요.
