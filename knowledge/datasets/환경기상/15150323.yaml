summary_user: 공항 활주로 주변 센서로 탐지한 저층 윈드시어(저고도 돌풍·바람 급변) 경보 정보를 담은 항공기상청 파일 데이터로, 포털에서 9,372바이트 zip 파일로 받습니다. 항공 운항·안전 분석가가 '어느 공항에서 저층 윈드시어 경보가 어떻게 발령됐나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 항공기상·공항 데이터와는 공항 이름 등의 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: LLWAS(Low Level Wind Shear Alert System, 저층급변풍경보시스템) 경보는 공항 주변 저고도에서 발생하는 돌풍이나 바람의 급격한 방향·세기 변화를 탐지하여 조종사와 관제사께 실시간으로 제공하는 경보입니다. 활주로 주변에 여러 개의 센서를 설치해 바람의 변화를 측정하고, 위험한 윈드시어 현상이 감지되면 즉시 경보를 발령합니다. 이를 통해 항공기는 착륙이나 이륙 시 갑작스러운 기류 변화로 인한 사고 위험을 예방할 수 있으며, 항공 안전 확보에 중요한 역할을 수행합니다.
