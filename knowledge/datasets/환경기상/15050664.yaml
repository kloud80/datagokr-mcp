description_portal: '총자외선지수는 WMO(세계기상기구)가 정의한 자외선 영역에 해당되는 자외선 A와 B 영역 (280~400nm 사이)의 파장별 자외선 복사량 값에 인체에 영향을 미치는 특정 파장에 대한 가중치를 곱하여 계산한 값입니다.<참고사항>자외선은 파장에 따라 3가지로 구분할 수 있습니다.자외선A(315-400nm), 자외선B (280-315nm), 자외선C (100-280nm)] 생명체에 매우 유해한 자외선C는 약 35km 고도까지 오존에 의해서 모두 흡수된다. 자외선B는 약 90%가 대기중에 흡수되어 일부만 지표에 도달하나, 자외선A는 흡수되지 않고 대부분 지표에 도달합니다.- 자외선의 부정적인 영향: 자외선 B는 표피‧상피까지 침투하여 색소침착, 홍반(화상), 백내장, 피부암 등을 유발하고, 자외선 A는 표피‧상피보다 더 깊게 침투하여 피부노화, 주름 등에 영향을 줍니다.- 자외선의 긍정적인 영향: 자외선은 인체 건강에 필수적인 비타민D이 주요한 자연적 생성원으로 알려져 있다. 비타민D는 뼈와 근골격계 건강에 중요할 뿐만 아니라, 암과 다른 질병발생의 가능성을 줄일 수 있습니다.'
