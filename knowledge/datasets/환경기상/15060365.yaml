summary_user: 경주시 관내 사업장의 폐기물 배출자 신고 내역을 사업장 단위로 담은 파일(csv, 약 35KB)로, 상호·폐기물 종류·처리방법(에너지 회수·중간가공·원료 제조 등)·도로명주소·신고기준년을 건별로 기록한다. 지역 환경 담당자나 분석가가 '경주시에서 사업장 일반폐기물을 신고한 업체는 어디이고 어떤 방식으로 처리하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호 등)가 없어, 다른 폐기물 처리업·배출자 데이터와는 상호명이나 도로명주소(사업장도로명주소)를 맞춰 연결해야 한다.
description_portal: 본 데이터는 경상북도 경주시 관내 사업장에서 발생한 폐기물의 신고 내역을 정리한 파일 데이터로 제공된다. 해당 자료는 배출 사업장의 명칭, 폐기물 종류, 처리 방법, 도로명 주소, 신고 기준 연도 등으로 구성되어 있으며, 주로 사업장 일반폐기물 관련 정보를 포함한다. 처리 방식은 에너지 회수, 중간가공, 원료 제조 등으로 구분되어 있어 환경 관리 및 자원 순환 분석에 활용 가능하다. 본 데이터는 행정 업무, 폐기물 처리 정책 수립, 민원 대응 등에 활용할 수 있으며, 환경 문제 대응 및 지역 내 폐기물 발생 현황을 파악하는 데 기초자료로 쓰인다. 공공데이터 포털을 통해 파일 형식으로 제공되어 시민, 연구자, 관련 기관 등 누구나 접근할 수 있도록 개방되어 있다.
