summary_user: 부산광역시 사상구에 신고된 사업장폐기물 배출자를 업소 한 곳당 한 행으로 담은 파일(약 17KB CSV)로, 업소명·배출지 소재지·전화번호·업종 구분과 배출 폐기물 종류(최대 2종)가 들어 있다. 사상구에서 특정 종류의 사업장폐기물을 내는 업소가 어디에 있는지 찾으려는 폐기물 수집운반·처리 사업자나 지역 환경 분석가가 쓴다. 공통 조인 키(사업자번호·법정동코드 등)가 없어서 다른 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 이을 수 있다.
