summary_user: 대구광역시 중구에 있는 음식물류폐기물 다량배출사업장을 한 곳씩 담은 명단 파일로, 사업장 구분·상호·주소·전화번호·데이터기준일이 들어 있다(약 7.8KB 규모의 CSV). 중구에서 음식물쓰레기를 많이 내는 사업장이 어디인지 확인하려는 주민이나, 관내 다량배출 업소 분포를 파악하려는 분석가·수거업체가 쓴다. 전역 조인 키는 없으며, 다른 데이터와 붙이려면 사업장 주소나 상호를 매칭하거나 같은 기관의 다른 파일과 이어야 한다.
description_portal: 대구광역시 중구 소재의 음식물류폐기물다량배출사업장 현황(업소명, 도로명주소, 전화번호 등) 정보를 제공합니다.- 연번,사업장구분,상호,사업장 주소,사업장 전화번호,데이터기준일 데이터가 포함되어 있습니다.- 음식물류 폐기물 다량 배출 사업장은 음식물 쓰레기를 대량으로 배출하는 사업장으로,  음식물류 폐기물의 감량과 적절한 처리를 위해 관리되고 있습니다.- 음식물 쓰레기의 환경적 영향을 최소화하고, 자원으로서의 재활용을 촉진하기 위해 각 사업장은 관련 법규를 준수하여 음식물류 폐기물을 적절히 관리해야 합니다.
