summary_user: 경기도 양주시에 신고된 음식물류 폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담은 목록 파일로, 상호명·도로명주소·전화번호·사업장 구분·월 배출 예상량·신고일자를 포함한다. 음식점·집단급식소 등을 운영하는 사업자가 자기 사업장이 다량배출 신고 대상과 비슷한 규모인지 가늠하거나, 분석가가 양주시 안에서 음식물 폐기물을 많이 내는 사업장이 어느 지역에 모여 있는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 상호명을 맞춰 보는 방식으로만 이을 수 있으며, 다른 시군의 같은 이름 파일과는 시군명을 기준으로 이어 붙인다.
