summary_user: 제주특별자치도에 있는 환경오염물질 배출시설 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 시설명·소재지·업종과 대기·수질 배출시설 종별을 기록한다. 주민이나 분석가가 "우리 동네 주변에 대기·폐수 배출시설로 신고된 사업장이 어디에 있고 어떤 종별인가"를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 사업장 데이터와 이으려면 시설명이나 소재지 주소로 맞춰야 한다.
description_portal: '제주특별자치도 내에 소재하고 있는 환경오염물질 배출시설사업장 데이터를 제공합니다.항목: 시설명, 소재지, 업종별, 배출내역 (대기, 수질, 소음 등) *환경오염시설의 통합관리에 관한 법률- 대기오염시설/폐수배출시설: 대기오염물질을 대기에 배출하거나 수질오염물질을 배출하는 시설물, 기계, 기구, 그 밖의 물체로서 환경부령으로 정하는 것- 소음·진동배출시설: 소음·진동을 발생시키는 공장의 기계·기구·시설, 그 밖의 물체로서 환경부령으로 정하는 것자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1041'
