summary_user: 원주시 관내 사업장폐기물 배출자를 사업장 단위로 담은 파일(csv, 약 214KB)로, 상호·사업자등록번호·도로명주소와 함께 폐기물 구분·종류, 운반자, 처리업소, 처리방법, 신고기준년도를 건별로 기록한다. 원주시에서 특정 업체가 어떤 폐기물을 배출해 어느 운반자·처리업소를 거쳐 어떤 방법으로 처리하는지 확인하려는 주민·거래처·환경 분석가가 쓴다. 사업자등록번호(bizno)로 다른 사업자 원장이나 폐기물 처리업 허가 데이터와 잇고, 운반자명·처리업소명은 처리업체 목록과 이름으로 대조하며, 도로명주소는 지도화에 쓴다.
description_portal: 이 데이터는 강원특별자치도 원주시 내 사업장에서 발생하는 폐기물 배출 및 처리 과정을 투명하게 공개하여 환경 관리의 효율성을 높이고, 시민들에게 산업 폐기물 처리 현황에 대한 정보를 제공하기 위해 구축되었습니다. 해당 기관에서 사업장의 폐기물 배출 신고 및 처리 관련 정보를 공적 자료를 통해 수집하고 정제했습니다. 이 정보를 통해 폐기물 처리 과정을 명확히 파악하고, 지역 환경 보호에 대한 신뢰도를 높일 수 있도록 데이터 신뢰성을 확보했습니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있으며, 지역 사회의 지속 가능한 환경 관리에 기여하는 것을 목표로 합니다.
