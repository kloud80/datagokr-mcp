description_portal: 청주시시설관리공단에서 운영하는 생활폐기물 소각시설의 일일 대기오염물질 배출 상태를 기록한 데이터입니다. 소각장 굴뚝에 설치된 자동측정기(TMS)를 통해 실시간으로 수집된 주요 오염물질인 먼지, 황산화물(SOx), 질소산화물(NOx), 일산화탄소(CO), 염화수소(HCl), 암모니아(NH₃) 등의 농도 정보가 포함되며, 각 항목별 측정값, 기준치 대비 비율, 측정 일시, 측정 지점, 운영 상태 등의 세부 항목으로 구성됩니다. 본 데이터는 환경관리 기준 준수 여부를 확인하고, 대기환경 개선 및 시민 건강 보호를 위한 자료로 활용됩니다.
