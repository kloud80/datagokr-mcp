summary_user: 인천광역시 제물포구(옛 동구) 관내에 설치된 의류수거함을 한 행에 한 개씩 담은 시설 목록 파일로, 관리번호·관리업체·설치 주소·재질·색상·행정동·데이터 기준일자를 수록한다. 주민이 '우리 동네 헌 옷 수거함이 어디 있나'를 찾거나, 담당 공무원·분석가가 행정동별 수거함 분포와 위탁 관리업체 현황을 파악하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 소재지 주소를 매핑해 같은 구의 다른 생활폐기물 배출 지점 자료나 주소 기반 지도와 잇는다.
description_portal: 본 데이터는 인천광역시 동구 관내에 설치된 의류수거함의 설치 및 관리 현황을 수록한 자료이다. 항목에는 연번, 관리번호, 관리업체명, 설치 주소, 재질, 색상, 행정동, 데이터 기준일자 등이 포함되어 있으며, 수거함의 물리적 특성과 위치 정보를 함께 제공한다. 의류수거함은 생활폐기물 중 재사용 가능한 의류를 분리배출하기 위해 설치된 공공시설물로, 해당 데이터는 수거함 위치 파악, 재활용 자원관리, 민원 응대, 시설 정비 등에 활용된다. 관리업체명과 관리번호를 통해 위탁 관리 체계를 명확히 할 수 있으며, 수거함의 색상과 재질 정보는 시각적 인식과 유지관리 기준 수립에도 도움이 된다. 본 자료는 환경미화, 자원순환 정책 수립, 공공시설물 현황조사, GIS 연계 서비스 구축 등 다양한 행정목적에 활용되며, 정기적으로 갱신된다.
