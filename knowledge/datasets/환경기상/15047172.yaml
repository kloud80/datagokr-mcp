description_portal: '○ 통계개요* 통계명 : 생활폐기물 발생량 및 처리현황* 통계종류 : 서울시 생활폐기물의 발생량 및 처리현황을 제공하는 지정ㆍ조사통계* 근거법령 :「폐기물관리법」에 의한 생활폐기물 발생 및 처리* 작성목적 : 폐기물의 발생 및 처리현황, 종류별 발생량, 폐기물 조성의 변화등을 파악하여 관련시설의설치 및 관리 등 폐기물 정책 수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 시도 → 환경부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 해당시설 및 자치구내용 - 서울시 생활폐기물 발생량 및 처리(재활용, 소각, 매립)현황○ 용어설명* 폐기물 : 쓰레기, 연소재, 오니, 폐유, 폐산, 폐알칼리 및 동물의 사체 등으로서 사람의 생활이나사업활동에 필요하지 아니하게 된 물질* 생활폐기물: 사업장폐기물 외 폐기물을 말하며, 가정에서 또는 사업장에서 발생되는 폐기물로서일상생활에서 나오는 폐기물* 가정생활폐기물: 사업장폐기물 이외의 폐기물로 가정 등에서 종량제봉투에 담아 배출하거나재활용품으로 분리배출 또는 남은 음식물로 배출하는 쓰레기* 사업장생활폐기물 : 폐기물관리법 시행령 제2조제7호 및 제9호 규정에 의한 사업장에서 발생되는 폐기물,폐기물관리법 제2조 제3호와 같은 법 시행령 제2조 제1호 내지 제5호 사업장에서배출시설 등의 운영에 관계되지 아니한 폐기물'
