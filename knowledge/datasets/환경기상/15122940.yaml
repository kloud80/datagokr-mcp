summary_user: 경기도 대기환경측정망 도시·도로변 측정소별로 아황산가스·이산화질소·일산화탄소·오존·미세먼지(PM-10)·초미세먼지(PM-2.5) 농도를 날짜별 일평균으로 담은 측정소 단위 자료이며, 경기도보건환경연구원이 제공하는 원시자료다. 경기도 주민이나 분석가가 "우리 시군 측정소의 초미세먼지 일평균이 언제 높았나"처럼 지역·기간별 대기질 추이를 확인하는 데 쓴다. 시군 코드·이름, 측정소 코드·이름, 측정망 구분 필드가 있으나 전역 조인 키는 확인되지 않아, 다른 대기질 자료와는 측정소명·시군명 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 경기도내 측정소별 대기질 측정자료입니다. 월별 아황산가스(SO2)농도, 일산화탄소(CO)농도, 오존(O3)농도, 이산화질소(NO2)농도, 미세먼지(PM-10), 초미세먼지(PM-2.5) 농도값을 제공합니다. 특히 미세먼지 및 초미세먼지의 농도는 대기환경에 대한 사회적 관심이 높아지는 가운데 중요한 지표로 작용합니다.*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
