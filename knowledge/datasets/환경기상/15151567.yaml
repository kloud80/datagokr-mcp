description_portal: 본 데이터는 대구광역시 군위군 관내 양돈농가의 현황을 체계적으로 관리하는 자료입니다. 주요 항목으로는 축종, 농장명, 농장 주소, 가축분뇨시설 보유여부, 데이터기준일자가 있습니다. 농가 분포 파악이 가능하며, 행정리·지번 단위까지 세부 주소가 기재되어 있어, 지도 기반의 관리체계 구축이 가능합니다. 대부분의 농장은 가축분뇨처리시설을 보유하고 있으며, 악취 민원 발생률이 상대적으로 낮고, 환경관리 수준이 양호한 편입니다. 이러한 현황자료는 환경관리 및 악취저감 정책 수립, 스마트축산 시스템 구축, 보조금 지원대상 선정 등 행정적 의사결정의 기초자료로 활용됩니다.
