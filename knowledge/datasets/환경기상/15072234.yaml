description_portal: '서울시 연도별 오존 경보발령 횟수, 일수, 최대농도 정보를 제공합니다.*용어설명- 오존경보 발령은 대기 중 오존(O₃) 농도가 일정 기준 이상 높아졌을 때, 국민 건강 피해를 줄이기 위해 지방자치단체가 공식적으로 알리고 행동 수칙을 권고하는 제도입니다.- 오존이란? 오존은 산소 원자 3개로 이루어진 기체(O₃). 성층권(하늘 위)에서는 자외선을 막아주는 오존층 역할을 하지만, 대기권(지표면 근처)에서는 자동차 배기가스, 공장 배출가스 등이 햇빛과 반응해 발생하는 광화학 스모그의 주범으로, 호흡기·눈·심혈관계에 해롭움- 오존경보 발령 기준 (대한민국 기준) : 대기 중 오존 농도(시간평균, ppm)에 따라 단계적으로 발령  주의보: 0.12ppm 이상  경보: 0.30ppm 이상  중대경보: 0.50ppm 이상'
