summary_user: 경기도의 야생동물 밀렵·밀거래 단속 실적을 월(집계연월, sum_ym) 단위로 모은 집계 자료로, 밀렵총기·엽구·독극물·동물 등 밀렵 유형별 적발 건수와 밀거래·엽구 제작판매·불법박제·포상금 미신고 등 위반 유형별 적발 건수, 단속횟수·합동단속횟수를 담는다. 환경 정책 담당자나 연구자가 "경기도에서 어느 시기에 어떤 유형의 밀렵·밀거래 적발이 늘었는가", "합동단속을 늘린 달에 적발이 많았는가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 집계연월이나 기관(경기도) 기준으로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 야생동물 관련 불법행위에 대한 단속 현황을 월별로 집계한 자료로, 밀렵총기·엽구·독극물·동물 등 밀렵 유형별 적발 건수, 밀거래·엽구제작·불법박제 등 관련 위반 유형별 적발 수, 단속횟수 및 합동단속횟수 등을 포함합니다. 이를 통해 특정 시기 또는 유형별로 불법행위 발생 경향을 파악할 수 있으며, 야생동물 보호 정책 수립 및 환경 범죄 예방 전략 설계에 활용할 수 있습니다. 또한 법적 근거 마련, 감시·감독 강화, 관련 기관 협업 단속 기획 등의 실무적 활용이 가능하며, 동물보호와 생물다양성 보존 관련 연구 자료로도 유의미합니다.
