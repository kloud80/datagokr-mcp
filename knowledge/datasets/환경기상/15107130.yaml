description_portal: '서울특별시 마포구에 소재하고 있는 행정동별 연간 쓰레기 배출량 데이터입니다.도시 인구 밀집과 생활패턴의 변화에 따라 생활폐기물 및 사업장 쓰레기 배출량이 지속적으로 증가하고 있으며, 지역 맞춤형 폐기물 감축 정책 수립, 자원순환 촉진, 청소 행정 효율화, 주민 인식 제고 등 다양한 목적에서 세부적인 배출량 정보에 대한 수요가 증가하고 있습니다.이에 따라 마포구 내 각 행정동(공덕동, 아현동, 도화동 등)별로 쓰레기 배출량(단위: 톤)의 연도별(2019년, 2020년, 2024년도) 정보를 제공합니다.'
