summary_user: 안산시 안에서 석면 조사 대상인 공공건축물·교육기관·다중이용시설 등을 건물의 동 단위로 한 행씩 담은 시설 목록 파일로, 시설 구분·건물명·동명·도로명주소·전화번호를 기록한다. 시민이나 학부모가 '우리 아이 어린이집이나 자주 가는 건물이 석면 조사 대상인가'를 확인하거나, 담당자가 석면 해체·제거 작업 대상을 시설 유형별로 추려 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 건물명을 맞춰 연결하거나 같은 기관(안산시) 자료끼리만 이어 쓴다.
description_portal: '이 데이터는 안산시 내 공공건축물, 교육기관, 다중이용시설 등 석면안전관리법에 따라 석면 조사가 의무화된 시설들의 상세 현황을 기록한 자료입니다. "한양학원", "월드코아", "호수공원어린이집", "안산시청", "안산유통상가" 등 다양한 시설의 "구분"(대학교, 어린이집, 불특정다수이용, 공공건축물 등), "건물명", "동명", "전화번호", 그리고 정확한 "소재지 주소"를 포함하고 있습니다. 특히, 각 시설별 세부 동(예: 영선실, 지하주차장, 학생회관 등) 정보까지 명시되어 있어 석면 관리의 범위를 구체적으로 파악할 수 있습니다. 이 자료는 시민들의 건강 보호를 위한 석면 안전 관리 현황을 모니터링하고, 향후 석면 해체 및 제거 작업을 계획하거나 환경 안전 정책을 수립하는 데 필수적인 기초 데이터로 활용될 수 있습니다.'
