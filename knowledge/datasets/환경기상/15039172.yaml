summary_user: 전국 시도·지역(시군)별로 전기차 구매보조금의 민간 공고대수, 접수·출고·출고잔여 대수, 승용·초소형·화물·버스 차종별 최대보조금(만원)과 집행 특이사항(비고)을 정리한 집계 표로, 약 20KB 분량의 CSV 파일 한 개다. 전기차 구매를 앞둔 국민이 '우리 지역의 승용 전기차 보조금이 최대 얼마이고 아직 남은 물량이 있는가'를 확인하거나, 분석가가 지역별 보급 목표 대비 출고 실적을 비교하는 데 쓴다. 전역 조인 키(행정코드 등)는 없어 다른 데이터와는 시도·지역 이름을 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 전국 17개 시도별 전기차 구매 보조금 지급 현황을 정리한 표입니다. 각 시·도 및 지역별로 전기차 보급 목표, 접수 및 출고 현황, 차종별 최대 보조금 금액, 그리고 보조금 집행 관련 특이사항(비고) 등을 포함하고 있습니다.승용 전기차, 초소형 전기차, 전기 화물차, 전기버스에 대한 정보를 다루며, 실제로 보조금이 얼마나 집행되었고 예산이 소진되었는지 등의 내용을 통해 전기차 정책의 실행 현황 및 성과를 파악할 수 있습니다.전기차 정책의 실행력을 지역별로 확인할 수 있는 자료이며 정부 및 지자체의 탄소중립 전략, 친환경차 보급 정책 평가 및 개선을 위한 기초 정보로 활용 가능합니다.
