summary_user: 전북특별자치도 순창군 관내 대기오염물질 배출시설 사업장을 한 행씩 담은 개별 사업장 목록으로, 사업장명·도로명 주소·전화번호·대표업종·종별(1~5종 규모 구분)을 담는다(CSV 약 4.7KB의 작은 파일). 순창군 안에 어떤 업종의 대기배출 사업장이 어디에 몇 종 규모로 있는지 확인하려는 주민·환경 분석가·인근 사업자가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 같은 순창군 기관 단위로만 이어 쓴다.
