summary_user: 경기도 대기환경 진단평가시스템의 웹 메뉴 구성을 메뉴 항목 하나당 한 행으로 담는 데이터로, 메뉴 식별자·상위 메뉴·메뉴 이름·정렬 순서·계층 레벨·표시 여부·연결 프로그램 주소를 포함하며 대기질 측정값 자체는 들어 있지 않다. 웹 인터페이스 설계자나 분석가가 '이 시스템에서 일평균 시계열 분석이나 연직단면 분석 화면은 어떤 메뉴 경로로 들어가는가'처럼 정보 구조와 접근 경로를 파악하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키는 없고, 메뉴 내부의 상하위 관계(상위 메뉴 아이디 → 메뉴 아이디)로 계층을 재구성하는 정도로 쓰며, 외부 연결은 메뉴 이름 매칭에 의존한다.
description_portal: 이 데이터는 대기환경 진단평가시스템의 메뉴 구성 정보를 제공하며, 각 메뉴 항목의 고유 식별자, 상위 메뉴 아이디, 메뉴 이름, 정렬 순서, 계층 레벨, 사용자 표시 여부, 연결된 프로그램 주소로 구성되어 있습니다. 메뉴 이름과 프로그램 주소를 기반으로 사용자 인터페이스 구조와 정보 접근 경로를 파악할 수 있으며, 대기질 정보, 일평균 시계열 분석, 연직단면 분석 등 다양한 대기 환경 관련 기능으로 구성된 메뉴를 포함합니다. 해당 정보는 대기환경 정보시스템의 사용자 접근성과 정보 구조 최적화를 위한 분석, 웹 인터페이스 설계 개선, 정보 제공 흐름 분석 등에 활용될 수 있습니다.
