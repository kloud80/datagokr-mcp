description_portal: 한국남동발전의 일자별 수질오염물질 배출 실적 데이터입니다.2020년 7월부터 2024년 5월까지의 수질오염물질 배출 데이터를 확인할 수 있으며, 각 발전소(여수, 영흥, 삼천포 등)의 일자별 pH(수소이온농도), COD(화학적 산소요구량), SS(부유물질), 총 질소(T-N), 총 인(T-P) 등의 법적 수질 기준 항목의 배출량과 순시, 적산  유량 데이터를 포함하고 있습니다.이 데이터를 활용하여 발전소의 폐수 처리 시스템이 얼마나 효과적으로 운영되고 있는지, 환경 기준을 잘 준수하고 있는지를 객관적인 수치로 파악하고 분석하는 데 기초자료로 활용할 수 있습니다.
