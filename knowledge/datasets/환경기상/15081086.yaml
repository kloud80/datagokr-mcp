description_portal: 부산광역시 사하구 관내에서 사업장폐기물 배출자로 신고된 사업장들의 현황에 대한 데이터를 제공합니다. 이 데이터는 각 사업장에서 발생하는 폐기물의 종류와 위치, 연락처 등의 정보를 포함하고 있어 폐기물 관리 및 관련 정책 수립 시 기초자료로 활용될 수 있습니다. 배출 폐기물의 유형에는 생활폐기물, 음식물류 폐기물, 폐합성수지, 수산물가공잔재물 등이 포함되어 있습니다.*주요 데이터 컬럼별 상세설명○ 사업장명 → 폐기물을 배출하는 사업장의 명칭○ 소재지(배출현장) → 폐기물을 배출하는 사업장 소재지의 도로명주소○ 폐기물종류 → 해당 사업장에서 발생 및 배출되는 폐기물의 종류○ 연락처 → 폐기물 배출 사업장의 연락 가능한 전화번호
