description_portal: '○ 통계개요* 통계명 : 쓰레기수거장비* 통계종류 : 서울시 쓰레기수거 관련 인원 및 장비 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 폐기물의 발생 및 처리현황, 종류별 발생량, 폐기물 조성의 변화등을파악하여 관련시설의 설치 및 관리 등 폐기물 정책 수립에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 서울특별시 생활환경과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당시설 및 자치구내용 - 서울시 쓰레기수거 관련 운영주체별 인원 및 장비 현황○ 용어설명* 폐기물 : 쓰레기, 연소재, 오니, 폐유, 폐산, 폐알칼리 및 동물의 사체 등으로서사람의 생활이나 사업활동에 필요하지 아니하게 된 물질○ 기 타○ 출 처 : 서울특별시 생활환경과'
