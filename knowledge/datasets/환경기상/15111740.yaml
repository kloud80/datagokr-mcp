summary_user: 전라남도 여수시의 종량제봉투 판매소를 업소 한 곳당 한 행으로 담은 파일로, 상호명·도로명/지번 주소·위경도와 함께 일반용·재사용·음식물용 종량제 봉투, 대형폐기물 스티커, 음식물 납부필증을 용량·권종별로 파는지 여부를 기록한다. 여수 주민이 '우리 집 근처에서 50리터 일반용 봉투나 대형폐기물 스티커를 파는 가게가 어디인가'를 찾을 때, 또는 분석가가 판매소의 지역 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 주소나 위경도를 기준으로 다른 지자체의 같은 종류 파일이나 대형폐기물·수거함 등 생활폐기물 배출 지점 데이터와 이어 붙인다.
limits: 시군구 단위(여수시) 개별 판매소 목록이라 다른 시군의 판매소는 담지 않고, 판매량·발생량·처리현황 같은 통계도 담지 않는다. 공통 코드가 없어 다른 데이터와는 이름·주소 매핑으로만 연결된다.
