summary_user: 광주광역시 광산구 관내 음식물 쓰레기 스티커 판매업소를 업소 단위로 담은 파일 데이터로, 698건에 사업장명·주소·데이터기준일자가 들어 있다. 주민이 가까운 음식물 스티커 판매처가 어디인지 찾거나, 담당 부서가 판매소 접근성을 살필 때 쓴다. 주소(address)를 조인 키로 지도·좌표 변환이나 다른 지자체의 종량제 판매소·수거함 파일과 이어 쓰며, 별도의 코드표는 없다.
description_portal: 광주광역시 광산구 관내 음식물 쓰레기 스티커 판매업소 현황(사업장명, 주소, 데이터기준일자 등) 정보를 제공합니다.광주광역시 광산구에는 음식물 쓰레기 처리 비용을 효율적으로 관리하기 위해 “음식물 쓰레기 스티커”를 판매하는 여러 사업장이 있습니다.주소 정보는 해당 판매업소가 광산구 내 어느 지역에 위치하는지 지도로 확인하거나 보행 동선을 계획할 때 유용합니다. 이 데이터는 주민들의 자가처리 비용 부담을 줄이고, 쓰레기 배출 편의를 높이는 데 기초가 되며, 환경 정책 담당자나 행정 부서에서는 스티커 보급률 분석, 접근성 평가, 홍보 전략 수립 및 재고 관리 체계 마련 등 다양한 정책적 판단에 중요한 참고 자료로 널리 활용될 수 있습니다.
