summary_user: 수원시가 운영하는 폐기물처리시설(자원회수시설·음식물자원화시설·자원순환센터) 3곳을 시설 1건씩 담은 소규모 원장 파일로, 주소·위경도, 면적, 가동일, 일 처리용량(톤), 처리기능, 위탁사, 관리기관 연락처를 포함한다. 수원 주민이나 분석가가 '생활쓰레기 소각이나 음식물쓰레기 처리는 어느 시설에서 하고, 하루 처리용량은 얼마이며 누가 위탁 운영하나'를 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소로 맞추거나 위경도로 지도·주변 데이터와 공간 결합해 이어 쓴다.
description_portal: 경기도 수원시 폐기물처리시설의 명칭, 위치, 규모(면적), 일 처리용량, 기능, 위탁사, 관리기관(명칭,연락처) 정보를 포함합니다. 수원시에는 자원회수시설, 음식물자원화시설, 자원순환센터 3곳이 있습니다. 각 시설의 처리 기능은 생활쓰레기 소각, 음식물쓰레기 처리, 재활용품선별, 대형폐기물 처리 등이 있습니다. 이러한 시설 정보를 개방함으로써 시설 안전성, 환경 규제 준수 여부를 확인하고, 지자체와 주민 간의 신뢰감을 강화하고자 합니다. 단순 폐기물 처리 시설을 넘어 교육, 신뢰, 참여, 재활용 촉진이라는 여러 사회적, 환경적으로 활용할 수 있습니다.
