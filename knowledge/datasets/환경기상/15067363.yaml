summary_user: 경기도 구리시에 신고된 사업장폐기물 배출자를 사업장 한 곳당 한 행으로 담은 원장 파일로, 시군명·상호명·지번주소·사업자등록번호를 담는다. 구리시 안에서 특정 업체가 사업장폐기물 배출자로 신고돼 있는지 확인하려는 사업자나, 지역 내 배출 사업장 분포를 파악하려는 분석가가 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 다른 폐기물 처리업 허가 목록과 이어 쓰고, 지번주소는 주소 정제를 거쳐 좌표·행정구역과 맞춘다.
limits: 배출 사업장 명단일 뿐 폐기물 발생량이나 처리 실적 같은 통계는 담지 않는다. 범위는 구리시 한 곳에 한정된다.
