summary_user: 환경부가 제공하는 통합대기환경지수가 '나쁨' 이상인 대기오염 측정소의 목록을 측정소 단위로 담으며, 측정소명과 측정소 주소가 들어 있고 범위는 전국이다. 지금 우리 동네 근처 측정소 중 대기질이 나쁨 이상인 곳이 있는지 확인하려는 국민이나, 대기질 악화 지역을 파악하려는 지자체·분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 에어코리아 측정소·대기질 데이터와는 측정소명이나 주소를 이름 매칭해 이어 쓴다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 통합대기환경지수 나쁨이상 측정소 목록 정보입니다."
