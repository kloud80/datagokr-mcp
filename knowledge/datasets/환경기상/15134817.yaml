description_portal: '이 데이터는 광주광역시 서구에서 매년 배출되는 생활폐기물에 대한 통계자료로, **연도별 총 배출량(단위: 톤)**과 **수거율(단위: %)**을 함께 제공합니다. 이를 통해 생활폐기물 발생의 증감 추세와 청소 행정의 효율성, 자원순환 체계의 운영 실태를 종합적으로 파악할 수 있습니다.특히 배출량은 지역의 인구 변화, 소비패턴, 분리배출 참여도 등 다양한 요인과 연계 분석이 가능하며, 수거율은 폐기물 처리 시스템의 효율성과 행정 대응력, 시민 참여 수준 등을 평가하는 지표로 활용됩니다.해당 데이터는 자원순환 기본계획 수립, 생활폐기물 감량 정책 설계, 청소 차량 운영계획, 재활용 기반시설 확충 등 다방면의 행정 업무에 직접적으로 활용될 수 있으며, 또한 탄소중립, 지속가능한 도시환경 구축 등 환경정책의 효과성 검토를 위한 기초자료로서 학술적 가치도 높습니다.데이터는 연도별로 정기 갱신되며, 공개 범위에 제한이 없는 형식(CSV 등)으로 제공되어 행정, 연구, 민간 분석 등 다양한 분야에서 폭넓게 활용이 가능합니다.'
