summary_user: 충청남도에서 「실내공기질 관리법」 적용을 받는 다중이용시설을 한 시설씩 담은 목록으로, 시군명·시설군(의료기관·노인요양시설·학원·지하역사 등)·시설명·주소가 들어 있다(CSV 약 63KB). 주민이 우리 시군에 실내공기질 관리 대상 요양시설이나 학원이 어디 있는지 확인하거나, 지자체·분석가가 시군별·시설군별 점검 대상 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명 이름 매칭이나 주소 지오코딩으로 이어 써야 한다.
description_portal: '충청남도 실내공기질 관리법 적용대상 다중이용시설 현황 데이터는 「실내공기질 관리법」 제3조에서 규정하는 공기질 관리 의무 대상 시설의 목록을 체계적으로 정리한 자료입니다. 이 데이터는 도민의 건강 보호와 쾌적한 실내환경 유지를 위해 관리해야 하는 시설들을 한눈에 확인할 수 있도록 구성되어 있습니다.자료에는 시설명, 시설군(예: 의료기관, 노인요양시설, 학원, 지하역사 등), 해당 시설 주소가 포함되어 있어 각 시설의 유형과 위치 정보를 명확히 파악할 수 있습니다. 시설군 정보는 시설의 용도와 공기질 관리 필요성을 판단하는 기준이 되며, 주소 정보는 지자체의 관리·점검 계획 수립과 지도 기반 확인에 활용할 수 있습니다.이 데이터는 행정기관이 실내공기질 측정·점검 대상 시설을 관리하고, 공기질 개선 정책을 수립하는 데 유용한 기반자료가 되며, 주민 역시 주변의 공기질 관리대상 시설을 확인해 생활환경 안전성을 판단하는 데 참고할 수 있습니다. 또한 환경보건 연구 및 공공위생 정책 분석에도 활용될 수 있는 중요한 공공데이터입니다.'
