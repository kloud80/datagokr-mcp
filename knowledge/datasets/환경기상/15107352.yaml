summary_user: 경기도 안의 저수지·하천 등에서 낚시가 금지되거나 제한된 구역을 구역별로 담은 지정 현황으로, 시군명·지정 구역명·지정일·지정권자 구분·지정 시작일과 종료일·지정 사유가 들어 있다. 낚시인이나 지역 주민이 '이 저수지에서 낚시해도 되는지, 언제까지 제한되는지'를 확인하거나, 수자원 보호 정책 담당자가 시군별 제한구역 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)이나 구역 이름을 맞춰 이어야 한다.
description_portal: 이 데이터는 물환경보전법에 따라 경기도 내 낚시가 금지되거나 제한된 구역에 대한 지정 정보를 담고 있으며, 각 지역의 지정 목적과 기간, 관할 권자에 대한 정보를 포함하고 있습니다. 지정된 지역은 저수지나 하천 등으로, 농업용수 보호나 하천 유지 관리 등의 사유로 낚시행위가 제한됩니다. 종료일이 2059년 12월 31일로 기재된 경우는 종료 시점을 별도로 정하지 않은 장기적인 지정 상태를 의미하며, 실질적으로 무기한에 가까운 효력을 지닌 것으로 볼 수 있습니다. 이 데이터는 수자원 보호 정책 수립이나 지역 주민 및 낚시인 대상 안내자료로 활용될 수 있습니다.
