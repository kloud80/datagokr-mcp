summary_user: 수돗물 공급 취약지역(중점관리지역)의 먹는물을 측정지점·채수일자별로 검사한 결과를 건별로 담으며, 카드뮴·비소·납·수은 등 중금속과 불소, 다이아지논 등 농약류, 음이온 계면활성제 항목의 측정값이 들어 있다. 취약지역 주민이나 지자체·분석가가 '우리 지역 측정지점의 먹는물에서 중금속·농약 성분이 어느 수준으로 검출됐는가'를 확인하거나 지점별 수질 추이를 보는 데 쓴다. 전역 조인 키는 없어 측정지점주소나 취수장명·수도사업자 이름을 매핑해 하천·댐 수질측정 자료나 다른 수질검사 데이터와 이어 쓴다.
description_portal: 본 데이터는 1개월에 2회 실시하는 수돗물 공급 취약지역의 먹는물 검사 결과 데이터입니다. 중점관리지역은 수질 오염 우려가 큰 구역을 지정해 검사를 시행하는 곳입니다. 본 자료는 취약 지역 주민의 먹는물 안전 확보와 생활 편익 증진에 기여합니다. 이를 통해 수질 분석, 해양 연구, 스마트 관리 기술 개발, 정책 수립에 활용할 수 있습니다.<제공항목>o 검사년도,수도사업자,취수장명,측정지점명,측정지점주소,수도규모,수원,채수일자,카드뮴,비소,시안,수은,납,크롬,불소,다이아지논,파라티온,페니트로티온,음이온 계면활성제
