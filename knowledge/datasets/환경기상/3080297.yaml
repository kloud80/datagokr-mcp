summary_user: 부천시에서 「실내공기질 관리법」 적용 대상으로 관리되는 다중이용시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 세부시설군·시설명·도로명/지번 주소·전화번호·연면적(의료기관 등은 병상수)을 포함한다. 부천시에서 어린이집·학원·의료기관 같은 시설 중 어느 곳이 실내공기질 법적 관리 대상인지 확인하려는 시민이나 점검 대상을 파악하려는 담당자·분석가가 쓴다. 전역 조인 키나 기관 코드는 없어서 다른 데이터와는 주소나 시설명을 맞춰서만 연결할 수 있다.
description_portal: '경기도 부천시 「실내공기질 관리법」 제3조(적용대상)에 속하는 법적으로 관리해야 하는  다중이용시설에 대한 데이터로 시설구분, 시설명, 소재지(도로명,지번), 전화번호, 연면적 등의 정보를 제공합니다.- 「실내공기질 관리법」 제3조(적용대상): 지하역사, 지하도상가, 철도역사의 대합실, 여객자동차터미널의 대합실, 항만시설 중 대합실, 공항시설 중 여객터미널, 도서관, 박물관 및 미술관, 의료기관, 산후조리원, 노인요양시설, 어린이집, 실내 어린이놀이시설, 대규모점포, 장례식장, 영화상영관, 학원, 전시시설, 인터넷컴퓨터게임시설제공업의 영업시설, 실내주차장, 실내 공연장, 실내 체육시설, 목욕장업 등(면적 또는 위치에 따라 법적 관리 여부가 달라짐)- 실내공기질 관리법 적용 대상 외의 다중이용시설인 법적 규모 미만 이용시설 및 해당되지 않는 업종의 정보는 제공되지 않음을 알려드립니다. - 전화번호가 존재하지 않는 경우는 핸드폰 번호등의 개인정보를 삭제 하였거나 해당 시설의 설치된 전화가 없는 경우임을 양해부탁드립니다.'
