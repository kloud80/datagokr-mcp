description_portal: 대기오염물질을 배출하는 사업장의 대기배출시설 현황을 정리한 자료로, 시설의 위치, 업종, 배출시설 종류 등 관리에 필요한 기본 정보를 포함하고 있다. 본 자료는 대기배출시설의 분포 현황과 관리 대상 사업장의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 대기배출시설에서 발생하는 오염물질의 배출 특성을 체계적으로 관리함으로써 대기오염 저감 정책 수립과 환경 개선 대책 마련을 위한 행정적 의사결정을 지원한다. 본 자료는 대기배출시설에 대한 행정 관리, 지도·점검 및 개선 조치 업무 수행과 함께 관련 통계 산출 및 환경 정책 추진을 위한 참고 자료로 활용된다.아울러 대기환경 보전과 쾌적한 생활환경 조성을 목표로 대기오염 예방 및 관리 체계를 강화하고, 지속 가능한 환경 정책 추진을 위한 환경 행정 업무 수행의 기초 행정자료로 활용된다.연번, 사업장명, 소재지, 업종, 종별(1종~5종)으로 구성되어 있습니다.
