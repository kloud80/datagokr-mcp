description_portal: 해양환경공단에서 수행하는 해양쓰레기 조사는 전국 연안 해역의 쓰레기 오염실태를 체계적으로 파악하고 관리 정책 수립을 위한 과학적 근거를 마련하는 사업이다. 본 데이터는 동서남해 주요 연안 지역별로 수집된 해양쓰레기의 분포 현황과 유형별 특성을 포함한다. 각 지역의 해안쓰레기, 침적폐기물, 부유쓰레기 등의 발생량과 종류를 분석하여 해양환경 보전 정책의 실효성을 높이고 효율적인 수거처리 방안을 도출하는 데 활용된다. 지역별 해양쓰레기 변화 양상을 장기간 추적 관찰함으로써 해양환경 개선 효과를 평가하고 맞춤형 관리전략을 수립할 수 있다. 해당 조사 정보는 지자체 및 관련 기관의 해양환경 보전 사업과 국민의 해양환경 인식 제고에 기여한다.
