description_portal: 본 통계는 지하수자원의 지속 가능한 이용과 형평성 있는 부담 분담을 목적으로 부과되는 지하수 이용 부담금에 관한 데이터를 제공합니다. 한국수자원공사가 수집·관리하는 본 자료는 전국을 대상으로 용도별(생활용, 공업용, 기타)로 구분된 부담금의 부과 및 징수 금액을 집계하고 있습니다. 사용자는 이를 통해 지역 간 부담금 수준, 용도별 징수 실적, 징수율 변동 등의 정보를 확인할 수 있습니다. 해당 데이터는 지하수 이용에 대한 경제적 부담 구조를 파악하고, 물 자원의 공공성 강화를 위한 정책 수립이나 연구 분석 자료로 활용 가능합니다. 또한 표준화된 형식으로 제공되어 2차활용이 용이합니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다."
