summary_user: 전국 지자체가 관리하는 폐기물 처리업소를 업소 한 곳당 한 행으로 담은 표준데이터로, 시설명·업종·처리 폐기물·영업구역·허가일자·주소·좌표 등을 포함하며 검증 시 9,593행을 받았다. 사업자나 분석가가 우리 지역에 어떤 업종의 폐기물 처리업소가 있고 어떤 폐기물을 처리하는지 확인하는 질문에 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)로 다른 주소·지도 기반 데이터와 이어 쓰며, 사업자번호 같은 별도 식별 키는 필드에 없다.
limits: 발생량·처리현황 통계는 담지 않으며 업소 원장 정보만 있다. 행정단위가 개별 주소·좌표 기준이고 범위는 미상이며, 기간 값이 1900-01-01부터 시작하므로 허가일자 해석에 주의해야 한다. 실측 최신 행 날짜는 2026-08-10이다.
