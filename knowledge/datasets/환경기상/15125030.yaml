summary_user: 냉매정보관리시스템(RIMS)에 등록된 냉매사용기기의 제작사, 유형(압축방식), 용도, 냉매종류, 1일 법정냉동능력(RT)을 기기 단위로 담는다. 포털 설명에는 냉매회수업체의 업체명·등록번호·주소도 개방한다고 적혀 있다. 전국 범위의 비공간 데이터이며, 분석가가 어떤 냉매종류가 어떤 용도·냉동능력 규모의 기기에 많이 쓰이는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제작사명·냉매종류명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 냉매는 냉동기 내부에서 순환을 통해 열을 흡수하고 온도를 낮추는 화학물질로써 지구온난화 등 기후·생태계 변화를 유발한다. 한국환경공단은 기후변화 대응을 위해 대기환경보전법에 따라 ‘냉매관리제도’를 시행하고 있으며, 냉매정보관리시스템(RIMS)에 등록된 데이터 중 냉매사용기기 정보의 제작사, 유형(압축방식), 용도, 냉매종류, 1일법정냉동능력(RT) 정보와 냉매회수업체의 업체명, 등록번호, 주소, 상세주소 정보를 개방합니다.
