summary_user: 유역(지방)환경청과 시도가 운영하는 지하수 수질측정망의 검사 결과를 연도·반기·행정구역별로 음용과 비음용으로 나눠 집계한 표로, 전국 범위의 작은 CSV 파일(약 1.4KB) 하나로 받는다. 분석가나 정책 담당자가 "어느 시도에서 음용 지하수 관정 검사 결과가 비음용보다 많은가" 같은 지역 간 지하수 수질 현황 비교에 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정구역 이름이나 연도·반기를 맞춰 붙여야 하며, 관정 단위 자세한 정보는 국가지하수정보센터 자료와 함께 본다.
description_portal: 유역(지방)환경청 및 시도에서 측정한 지하수 수질 측정망의 수질검사 자료입니다.전국 행정구역별 음용, 비음용을 기준으로 분석한 수질검사 데이터를 제공합니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며,민간 기업 및 공공기관의 연구와 정책 수립에 활용할 수 있는 기초자료입니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.* (참고사항) 국가지하수정보센터(www.gims.go.kr)에서 제공하는 통계정보는 데이터 검증 및 확정 절차로 인해 통상 2~3년이 소요됩니다.
