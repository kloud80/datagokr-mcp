description_portal: 해당 데이터는 국립산림치유원에서 측정한 피톤치드의 원천 데이터로, 매월 1일, 하루 3회 측정한 값을 기반으로 구성되어있습니다. 주요 항목으로는 위도, 경도, 임상코드, 측정일시, 벤즈알데하이드, 알파-피넨, 캄펜, 사비넨, 미르센, 베타-피넨 등이 포함되어 있습니다. 이 자료는 산림치유 효과 분석, 계절별 농도 변화에 따른 공기질 모니터링 등에 유용하게 활용될 수 있으며, 산림의 공기정화 기능과 치유 효과를 과학적으로 입증하고, 산림복지 정책 수립 및 환경보건 연구를 위한 기반 데이터로서 활용될 수 있습니다.
