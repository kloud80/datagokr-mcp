description_portal: '서울특별시 금천구 관내 가로변 쓰레기통 현황을 담은 데이터입니다. 이 데이터에는 각 쓰레기통의 설치 장소(주소), 구체적인 설치 위치 및 위·경도, 쓰레기통 유형(항아리형·/사각형), 수거 쓰레기 종류(일반쓰레기·재활용), 그리고 설치 연도가 포함되어 있습니다.이 데이터는 여러 가지 방법으로 국민들이 유용하게 활용할 수 있습니다. 예를 들어, 주민들은 자신이 자주 가는 길목에 설치된 쓰레기통의 위치나 유형을 미리 확인하고, 거기에 맞춰 올바르게 분리배출을 할 수 있습니다. 더 나아가, 구청의 쓰레기통 데이터는 주민들이 환경에 대해 더 신경 쓸 수 있는 기회를 제공합니다. 예를 들어, 가까운 재활용 쓰레기통의 위치를 확인하고 재활용을 적극적으로 실천하거나, 쓰레기통이 부족한 지역에 대한 개선 요청을 할 수 있는 등의 방식으로 참여할 수 있습니다.이 데이터를 공개함으로써 우리 구는 주민들이 쓰레기 배출을 더 효율적이고 올바르게 할 수 있도록 돕고, 환경 보호에 대한 시민들의 참여를 촉진하려고 합니다.(데이터 담당부서 : 금천구 청소행정과)'
