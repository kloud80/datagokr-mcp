description_portal: '방재기상관측은 태풍·홍수·가뭄 등 기상현상에 따른 자연재해를 막기 위해 실시하는 지상관측입니다. 관측 공백 해소 및 국지적인 기상 현상을 파악하기 위하여 전국 500여개 지점에 자동기상관측장비(AWS, Automatic Weather System)를 설치하여 자동으로 관측합니다.관측요소는 기온, 강수량, 습도, 기압, 풍향, 풍속 등이 있으며, 관측주기는 1분으로 매분자료와 함께 시간자료, 일자료를 제공하고 있습니다.- 동일한 지점번호라도 기간별 위치가 다를 수 있으니, 해당 지점의 위경도 변경 이력 확인 바랍니다.보유기간: 1997년(지점별, 요소별 상이함)~'
