summary_user: 전국 500여 개 지점의 자동기상관측장비(AWS)가 1분 주기로 관측한 기온·강수량·습도·기압·풍향·풍속을 관측지점번호 기준의 매분·시간·일 자료로 담는 건별 관측 원천 데이터다. 농업·보험·기후 분석가가 특정 지역에서 집중호우나 강풍이 있던 날 실제 관측값이 얼마였는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 관측지점번호·지점명 매핑이나 같은 기상청 관측 자료(ASOS 등)의 지점 코드로만 이어 쓴다.
