description_portal: '매립장 내 폐기물반입을 하기위한 반입협의신청 정보와 그에 따른 현장 실사 정보입니다.개방항목 : 협의년월, 지자체명, 폐기물명, 협의량,신청단위 항목을 제공합니다. 배출처(기업,지자체,사업장 등)가 해당 폐기물의 반입을 원할 경우, 관련 서류를 작성하여 관할 지자체(시,도 또는 시,군,구)에 반입협의를 요청하고 최종 해당 지자체에서 수도권매립지관리공사로 반입협의를 신청하여 허가를 받아야 합니다. 이에 관리기관은 내부적으로 처리계획을 수립하고 현장실사 등의 일정을 협의해야 합니다. 이후, 현장실시 후에는 필요시 폐기물 시료를 채취하여 분석하는 등의 관리적 요건도 수행하게 됩니다.'
