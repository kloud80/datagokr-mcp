summary_user: 경상남도 함양군 관내에서 벙커C유·A유 같은 중질유를 연료로 쓰는 업체를 업체별로 담은 파일로, 사용유종·상호명·도로명/지번 주소·전화번호·생산품·연료사용량·데이터기준일자를 담는다(파일 크기 482바이트로 소규모). 함양군 안에서 어떤 업체가 어떤 중질유를 얼마나 쓰는지, 대기오염 배출원 관리나 연료 전환 정책 대상이 어디인지 확인하려는 지자체 담당자·환경 분석가가 쓴다. 전역 조인 키나 사업자등록번호가 없어 다른 배출시설·사업장 데이터와는 상호명이나 주소로 맞춰 이어 써야 한다.
description_portal: 경상남도 함양군 관내 소재 중질유(벙커C유, A유 등) 사용업체 현황으로 사용유종, 상호명, 주소, 전화번호, 생산품, 연료사용량, 데이터 기준일자 등으로 구성되어 연간 단위로 제공됩니다.함양군 내에서 중질유를 산업용 연료로 사용하는 사업체의 현황을 체계적으로 수집·정리한 공공데이터입니다. 이 데이터를 통해 관내 중질유를 대량 소비하는 사업체들의 분포와 연료 사용 현황을 한눈에 파악할 수 있어 에너지 사용 실태 분석, 대기오염 관리, 환경정책 수립, 산업구조 연구에 폭넓게 활용될 수 있습니다.또한 산업 환경을 모니터링하고, 관련 규제나 지원정책 마련에 필요한 근거 자료로도 활용될 수 있을 것으로 기대합니다.
