summary_user: 서울 용산구에서 음식물류 폐기물을 다량으로 배출하는 사업장(일정 면적 이상 음식점, 집단급식소, 대규모점포, 관광숙박업 등)을 사업장별로 한 행씩 담은 목록으로, 사업장 구분·상호·전화번호·도로명주소가 들어 있다. 구청 담당자나 분석가가 '용산구에서 음식물류 폐기물 처리계획 신고 대상인 사업장은 어디이며 어떤 업종이 많은가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 도로명주소를 지오코딩하거나 상호·주소를 맞춰 다른 지자체의 같은 이름 파일이나 음식점 인허가 데이터와 이어 쓴다.
limits: 사업장 위치와 연락처 목록일 뿐이며 배출량이나 처리실적 같은 수치는 담지 않는다. 범위는 용산구 한 곳에 한정된다. 조인 키가 없어 다른 데이터와는 주소나 상호를 기준으로 맞춰야 한다.
