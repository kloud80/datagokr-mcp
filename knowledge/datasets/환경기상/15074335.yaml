description_portal: 서울특별시 용산구 음식물 다량배출사업장 현황(음식물다량배출 사업장 구분, 상호, 사업장 전화번호, 사업장도로명주소)에 대한 데이터를 제공합니다.다량배출사업장이란 생활폐기물 중 음식물류폐기물을 다량으로 배출하는 자로 폐기물관리법 시행령 제8조의4에서 정한 음식물류 폐기물 배출자가 운영하는 사업장이이다.서울특별시 용산구 음식물류 폐기물 발생억제, 수집운반 및 재활용에 관한 조례에 의하면, 다량배출사업장은 식품위생법 제36조제1항제3호에 따른 면적이 200㎡이상인 일반음식점, 휴게음식점, 식품위생법 제2조제12호에 따른 집단급식소 중 1일 평균 총급식인원이 100명이상인집단급식소를 운영하는자, 대규모점포를 개설한자, 관광진흥법 제3조제1항제2호에 따른 관광숙박업을 경영하는 자 등이다. 다량배출사업장은 사업개시일로부터 30일 이내에 음식물류 폐기물 발생 억제 및 처리 계획 신고서 제출해야하며,  음식물류 폐기물 관리대장 작성 및 보관해야하고, 연간처리실적을 다음해 2월말까지 제출하여야 합니다.
