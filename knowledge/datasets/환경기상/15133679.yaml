summary_user: 서울 종로구 관내 폐형광등·폐건전지 수거함의 설치 현황을 수거함 1곳당 1행으로 담은 파일(CSV 약 9KB)로, 행정동·설치 위치·설치장소명과 데이터기준일자를 포함한다. 주민이 '우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리나'를 찾거나, 구청·분석가가 행정동별 수거함 배치 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 위치 주소를 매핑해 연결해야 하며, 다른 지자체의 같은 종류 수거함 파일과 합쳐 쓸 때도 이름 기준으로 맞춘다.
description_portal: 본 데이터는 서울특별시 종로구 관내 폐형광등 및 폐건전지 수거함 설치 현황을 제공하는 공공자료입니다.자료에는 각 수거함의 행정동, 설치 위치, 설치장소명 등 세부 정보가 포함되어 있습니다.이 데이터는 주민이 폐형광등과 폐건전지를 안전하게 분리 배출하고 재활용할 수 있도록 안내하며, 행정기관에서는 수거함 위치 관리, 재활용 정책 수립, 환경정책 모니터링 등 행정서비스 향상에 활용 가능합니다.또한 민간과 연구기관에서는 폐자원 회수 분석, 환경교육 자료, 생활폐기물 관리 연구 등 다양한 분야에서 기초자료로 활용될 수 있습니다.종로구 관내 환경보호 및 재활용 촉진, 주민 편의 향상을 위해 제공되는 유용한 자료입니다.
