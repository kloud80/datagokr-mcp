summary_user: 전국 주요 항만 해역의 조사 정점별로 연도(년)와 수질평가지수 등급을 담은 소규모 파일(csv 약 14KB)이며, 측정망·조사사업 수질 자료로 산출한 평가 결과입니다. 지자체·항만 운영기관·연구자가 '특정 항만 정점의 수질 등급이 해마다 나아졌는가 나빠졌는가'를 확인하거나 관리가 필요한 항만 해역을 고를 때 쓴다. 전역 조인 키가 없어 다른 해양 수질 측정 자료와는 정점 이름을 맞추거나 같은 기관(해양환경공단) 코드로만 연결한다.
description_portal: 해양환경공단이 제공하는 ‘수질평가지수_항만’ 데이터에 대한 정보를 제공합니다. 본 데이터는 전국 주요 항만 해역의 환경 상태를 평가하기 위해 해양환경 측정망과 조사사업을 통해 수집된 수질 자료를 기반으로 산출된 수질평가지수를 포함합니다. 주요 내용에는 조사 정점 위치, 수온, 염분, 용존산소, pH, 탁도, 영양염류 등 핵심 수질 지표와 이를 종합한 수질등급이 수록됩니다. 또한 항만별·계절별 수질 변화 경향, 오염원 분석, 관리 우선 해역 선정 결과를 제공합니다. 이를 통해 항만 지역의 해양오염 관리, 환경개선 효과 검토, 수질 관리 정책 수립이 가능하며, 공공기관, 연구기관, 지자체, 항만 운영기관 등에서 해양보전과 항만 운영의 지속가능성을 확보하기 위한 기초자료로 폭넓게 활용됩니다.
