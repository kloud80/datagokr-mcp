summary_user: 경기도 사업장이 대기배출시설을 설치·운영하다 변경사항이 생겨 낸 변경신고·변경허가 신청을 건별로 담고, 사업장·업종·관할관청·처리상태·신청일·승인일과 방지시설·배출시설 변경 내용, 오염물질별 농도·배출량·가스량을 함께 수록한다. 환경 담당자나 분석가가 "어느 업종 사업장이 어떤 방지시설(여과·흡착 등)로 바꾸며 배출시설 변경을 신청했는가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 사업자등록번호(bizregno)나 사업장명·업종코드로 다른 배출시설 사업장 원장이나 기업 정보와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 지역 사업장에서 대기배출시설을 설치 또는 운영 중 변경사항이 발생했을 때 이를 신고하거나 허가를 신청한 내역을 수록한 자료입니다. 주요 항목에는 사업장명, 업종코드, 업종명, 산업단지 위치, 관할관청, 변경신청구분(변경신고 또는 변경허가), 대기오염물질의 종류 및 농도, 배출허용기준량, 가스량, 배출량, 처리방법 등이 포함되어 있습니다. "대기오염물질_처리방법" 항목을 통해 해당 물질을 제거하거나 저감하기 위해 사용된 기술(여과, 흡수, 흡착 등)을 확인할 수 있으며, "대기오염물질_농도단위"와 같은 측정지표를 통해 오염물질 관리 수준을 파악할 수 있습니다. 이 데이터는 환경 규제 이행 여부 확인, 오염저감 기술 적용 현황 분석, 업종별 배출 특성 파악 등 환경정책 및 산업오염 저감 정책 수립을 위한 기초자료로 활용될 수 있습니다.
