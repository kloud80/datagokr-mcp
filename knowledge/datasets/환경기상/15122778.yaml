summary_user: 에어코리아 측정소별로 날짜, 측정소코드·측정소명, 통합대기환경지수 값과 등급(0~50 좋음, 51~100 보통, 101~250 나쁨, 251 이상 매우나쁨), 주오염물질, 측정망을 담은 전국 단위 파일(xlsx, 약 128MB)이다. 시민이나 분석가가 '우리 동네 측정소의 대기 상태가 오늘 나쁨인지, 어떤 오염물질 때문인지'를 확인하거나 측정소별 지수 추이를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 에어코리아 측정소 정보·측정치 데이터와는 측정소코드나 측정소명으로 맞춰 이어 쓴다.
limits: 측정소코드 외에 행정구역 코드 같은 전역 조인 키가 없어 지역 단위 집계나 다른 기관 데이터 연결은 이름·코드 매핑을 따로 거쳐야 한다. 실시간 관측 기반이라 측정소 현지 사정이나 수신 상태에 따라 오차가 있을 수 있어 참고용으로 해석한다.
