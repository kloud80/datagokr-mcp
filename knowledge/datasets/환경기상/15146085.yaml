description_portal: '이 데이터는 서울시 지하수 통계 정보를 연도·행정동별로 기록한 자료로, 지하수 이용 현황과 용도별 관정(井) 운영 상황을 보여줍니다.보고 연도: 통계가 집계된 연도.행정동 코드: 해당 지역을 식별하는 고유 코드.생활용·농업용·산업용·기타: 용도별 관정 수와 이용량(㎥ 단위)을 구분하여 기록.관정수: 각 용도별 지하수 취수 시설 개수.이용량: 해당 관정에서 취수한 연간 지하수 사용량.이 자료를 통해 지역별 지하수 사용 규모, 용도별 분포, 지하수 자원 관리 현황 등을 분석할 수 있습니다. 특히, 물 자원 관리 정책, 지속가능한 지하수 이용 전략, 수자원 보호 대책 수립 등에 활용 가치가 높습니다.'
