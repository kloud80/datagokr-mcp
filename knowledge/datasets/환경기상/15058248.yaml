summary_user: 전국 지하수의 총수두(수위)가 같은 지점을 이은 등수위선 정보를 범례·지역코드·시군구명 단위로 담은 외부(vworld) 제공 데이터로, 관정별 원천 측정값이 아닌 선 형태로 정리한 주제도 성격이다. 지하수 개발이나 오염 확산을 검토하는 분석가가 어느 지역에서 지하수가 어느 방향으로 흐르는지, 수위가 대략 어느 수준인지 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 지역코드(regn_cd)나 시군구명(sig_nam)을 이름·코드 매핑으로 맞춰 관정·수질 측정 등 다른 지하수 자료와 연결해야 한다.
description_portal: '전국의 지하수 수량, 수질, 이용실태 등 모든 지하수 정보를 수집, 관리하는 지하수 정보를 제공◎ 단층 : 외부의 힘을 받은 지각이 두 개의 조각으로 끊어져 어긋난 지질구조-◎ 수문지질단위 : 충적층지하수와 암반지하수를 수문지질단위로 분류. 수문지질단위는 지질시대, 암석의 종류, 암상, 지형, 공극의 형태 및 세부수리지질특성(투수계수, 저류계수, 지하수 산출량 등)등을 대표적인 설정기준으로 함-◎ 수질다이어그램 : 수질의 화학분석결과를 나타내는 다이아그램-◎ 전기전도도 : 전기가 통하기 쉬운 정도를 나타내는 값. 전기 저항의 역수. 물의 도전율은 수중의 이온 농도와 밀접한 관계가 있으므로 전도도를 측정하면 용해성 물질의 대체적인 그 값을 추정가능-◎ 지질구조밀도 : 지질구조의 깊이밀도 및 교차점밀도의 범위(경계값)는 대상지역의 밀도분포특성을 고려하여 설정하며, 5단계를 원칙으로 함-◎ 지질구조선 : 지층이나, 좁게는 기반암석, 더 좁게는 독립된 암체 등에 나타나는 선구조로 주로 내적인 영력과 같은 지각운동에 의해서 형성되는 것으로 구조선이라고도 함-◎ 지하수등수심선 : 지하수의 수심이 같은 점을 연결한 선-◎ 지하수등수위선 : 차원 지하수 흐름장에서 총수두(total hydraulic head)가 같은 점을 연결한 선-◎ 지하수유동방향 : 지하수의 흐름방향을 말하며, 투수층의 경사와 투수성의 정도에 따라 영향을 받음-◎ 토양도 : 토양조사 결과를 알기 쉽게 분류하고 기호로 표시하연 토지이용자가 편리하게 이용할 수 있도록 한 지도. 토양도는 하천관리계획 유역 내에 분포하는 토양의 수문구분에 따라 A, B, C, D로 크게 재분류됨'
