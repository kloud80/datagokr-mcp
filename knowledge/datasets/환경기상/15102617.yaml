summary_user: 인천 부평구가 음식물류 폐기물 수거·운반·처리를 맡긴 위탁업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 420바이트)로, 위탁업무 유형·업체명·지번 및 도로명 주소·우편번호를 수록한다. 부평구 주민이나 사업자가 "우리 구 음식물쓰레기는 어느 업체가 수거하고 처리하나"를 확인하거나, 분석가가 위탁업체 분포와 업무 유형을 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 지자체 음식물류 폐기물 처리업체 파일과는 업체명·주소 문자열로만 맞춰 이어 쓰고, 주소를 지오코딩하면 지도 위에 올릴 수 있다.
description_portal: '부평구 내 음식물류 폐기물 처리업체의 위탁업무 유형, 업체명, 주소(지번·도로명), 우편번호 정보를 수록한 자료폐기물 수거·운반·처리 등의 위탁운영 체계 및 지정 업체 분포 현황을 파악하고, 환경관리 및 폐기물 처리계획 수립의 기초자료로 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 음식물류 폐기물 위탁처리 업체 현황 분석– 처리업체의 지역별 분포 및 업무 유형 관리– 폐기물 처리계획 수립 및 민원 대응 기반 마련– 청소행정 및 친환경 처리 체계 운영 실태 점검주요 항목 설명● 위탁업무: 수거, 운반, 처리 등 위탁된 업무의 유형● 위탁업체명: 계약된 음식물류 폐기물 처리 업체의 명칭● 지번 주소 / 도로명주소 / 우편번호: 업체의 위치 정보'
