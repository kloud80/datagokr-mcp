description_portal: '낚시 관련 규제 구역은 지정 목적과 근거 법령에 따라 낚시금지구역, 낚시제한구역, 낚시통제구역의 세 가지 형태로 구분되어 운영되고 있습니다. 각 구역은 수질 보전, 수산자원 보호, 그리고 안전사고 예방이라는 뚜렷한 목적 차이를 지니며 그 지정 현황 또한 다르게 나타납니다.1. 낚시금지구역 현황  지정 목적 및 근거: 주로 수질 오염 방지와 먹는 물 안전(상수원 보호)을 목적으로 하며, 「물환경보전법」과 「수도법」, 「하천법」 등을 근거로 지정됩니다.  현황 특징: 환경부 고시 기준 전국적으로 약 160여 개 이상의 주요 호소(저수지 및 댐)가 낚시금지구역으로 묶여 있습니다. 경기(기흥호, 백운호수 등), 전북(옥정호, 군산호수 등), 충북(원남호, 오창호 등) 지역에 많은 금지 수역이 집중되어 있으며, 도심 내 수변 공원(수성못, 보문호 등)과 식수원 공급 댐(용담댐, 주암댐 등) 역시 예외 없이 포함됩니다. 또한 전국의 국가·지방 하천 중 약 1,100km가 넘는 구간이 금지구역으로 지정되어 관리되고 있습니다. 이곳에서는 모든 형태의 낚시 행위가 원천 금지되며 위반 시 최대 300만 원의 과태료가 부과됩니다.  2. 낚시제한구역 현황  지정 목적 및 근거: 낚시 행위를 완전히 금지하기보다 수질 상태와 이용객 편의를 고려해 일정 수준의 타협점을 찾는 구역입니다. 「물환경보전법」에 근거합니다.  현황 특징: 전국적으로 지정된 곳이 금지구역에 비해 매우 적은 편입니다. 경기도 파주의 발랑지, 마지지 및 충남의 예당지, 탑정호 등 일부 저수지를 중심으로 제한구역이 형성되어 있습니다. 이 구역에서는 낚싯대 개수 제한(예: 1인당 1~2대), 미끼 종류 제한(떡밥 및 어분 사용 금지), 쓰레기 수거 및 종량제 봉투 사용 의무화 등의 구체적인 조건 하에 운영되고 있습니다.'
