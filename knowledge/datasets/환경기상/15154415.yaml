description_portal: 이 데이터는 보건환경연구원이 수행하는 다양한 검사 항목에 대해 사용되는 검사 방법과 상세 절차를 정리한 자료입니다. 각 항목은 검사 대상 물질명, 해당 검사를 담당하는 팀명, 적용되는 검사방법명, 그리고 그 방법의 세부 절차를 함께 제시하고 있어 실제 분석 과정의 기준을 명확히 확인할 수 있습니다. 예를 들어 일반세균, 여시니아, 6가크롬, 암모니아성질소, 금속류, 휘발성유기화합물 등 다양한 항목에 대해 이온크로마토그래피, 자외선·가시선분광법, ICP-OES, ICP-MS, GC/MS 등 여러 분석 기법이 사용됨을 확인할 수 있습니다. 이 자료는 검사 수행의 표준 절차를 문서화한 정보로서, 분석의 일관성과 정확성을 확보하기 위한 기초자료로 활용되며, 행정기관과 연구기관이 검사 기준을 이해하는 데 도움이 됩니다.
