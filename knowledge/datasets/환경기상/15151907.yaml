summary_user: 철새도래지·강변 등에서 채취한 야생조류 분변 시료 한 건마다 시료번호, 채취기관·채취일자, 선별검사 확인일자, 병원성 판정 결과(양성·음성 등)와 유전자형을 담은 건별 원천 파일이며, 범위는 전국이고 위치 좌표는 없는 비공간 자료입니다. 방역 담당자나 분석가가 "올겨울 어느 시기에 고병원성 조류인플루엔자 양성 시료가 늘었고 어떤 유전자형이었나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 채취기관 이름이나 채취일자 같은 날짜를 기준으로 맞춰 이어 써야 합니다.
description_portal: 야생동물질병관리시스템은 철새도래지, 강변 등을 중심으로 분변예찰을 수행합니다.  지방자치단체, 용역업체, 국립야생동물질병관리원 자체예찰 등으로 수집된 시료들을 야생동물질볃관리시스템을 통해 질병진단의뢰하며 이를 국립야생동물질병관리원이 검사하여 질병데이터를 수집합니다. "AI 예찰정보"는 각 시료에 부여된 번호에 따라 채취에 관한 정보(채취기관, 채취일자)와 질병검사에 관한 정보(선별검사확인일자, 양성·음성 등 병원성결과, 유전자형)와 같이 각종 정보가 제공됩니다.유전자형에 공란이 많은 이유는 고병원성·저병원성 양성결과에만 유전자형이 기록되며, 그 외 음성 등은 유전자형이 기록되지 않기 때문입니다.
