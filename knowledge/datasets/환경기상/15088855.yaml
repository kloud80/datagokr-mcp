summary_user: 경상남도 도내에 지정·등록된 토양관련전문기관(토양오염조사기관, 누출검사기관 등)과 토양정화업체를 업소 단위로 담은 현황 파일로, 구분·업소명·등록일·지정번호·도로명주소·전화번호를 담는다. 주유소나 공장 운영자가 경남에서 토양오염도검사나 누출검사를 맡길 기관, 오염토양 정화를 의뢰할 업체를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 업소명이나 도로명주소를 맞춰 붙이거나 같은 기관(경상남도) 자료끼리만 연결한다.
description_portal: '「토양환경보전법」제23조의2 및 제23조의7에 따라 지정된 경상남도 도내 토양관련전문기관(토양오염조사기관, 누출검사기관) 및 토양정화업체 현황을 제공합니다.(업소명, 영업소 소재지, 연락처 등)* 토양관련전문기관: 토양환경평가기관(토양환경평가를 하는 기관), 위해성평가기관(위해성평가를 하는 기관), 토양오염조사기관(토양정밀조사, 토양오염도검사, 토양정화의검증, 오염토양 개선사업의 지도·감독을 수행하는 기관), 누출검사기관(누출검사를 하는 기관)** 토양정화업은 오염토양 반입정화시설'
