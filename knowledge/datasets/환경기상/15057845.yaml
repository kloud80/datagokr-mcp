summary_user: 부산광역시의 오존·미세먼지(PM10)·초미세먼지(PM2.5) 예보와 주의보·경보 발령 상황을 오염물질별로 담은 API로, 서부·중부·남부·동부 권역별 경보 단계와 확인 시각(checkTime)을 함께 준다. 부산 시민이나 분석가가 "지금 우리 권역에 미세먼지·오존 주의보가 발령 중인가", "과거 어느 시기에 경보가 잦았나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대기질 데이터와는 오염물질 이름이나 권역명을 매핑해 연결해야 한다.
limits: 측정소 코드 같은 공통 키가 없어 에어코리아 측정소별 시간 농도와 바로 조인되지 않고, 이름 매핑이 필요하다. 권역은 부산 4개 권역 단위라 측정소 단위의 세밀한 위치 분석에는 맞지 않다. 개발계정은 하루 10,000회로 호출이 제한된다.
