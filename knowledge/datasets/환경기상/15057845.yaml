description_portal: 이 데이터는 부산광역시에서 발생한 오존, 미세먼지(PM10), 초미세먼지(PM2.5)에 대한 예보 및 예·경보 발령 현황을 종합적으로 수록한 자료입니다. 오염물질별로 예보 등급과 함께 주의보 및 경보의 발령 시각, 해제 시각, 발령 지역, 경보 단계, 발령 시점의 대기오염 측정 농도 등 상세한 정보가 포함되어 있습니다. 이를 통해 특정 시기와 지역에서의 대기질 악화 상황, 이에 따른 해제 경과 등을 한눈에 파악할 수 있습니다. 본 자료는 시민들에게 제공되는 예·경보 이력의 근거 자료로 활용되며, 지역 내 대기오염 특성을 분석하거나 과거 발령 사례를 검토하는 데에도 유용하게 사용될 수 있습니다.
