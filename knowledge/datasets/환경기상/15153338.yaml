summary_user: 환경부가 발령한 지역별 미세먼지 주의보·경보를 발령 건 단위로 담으며, 권역(RGN_NM)·세부 지역, 대상 항목, 경보 단계, 발령 일시와 당시 농도, 해제 일시와 해제 농도를 함께 싣는다(범위 전국). 주민이나 지자체 담당자가 '우리 지역에 언제 어떤 단계의 미세먼지 경보가 내려졌고 언제 풀렸는가'를 확인하거나 연간 발령 횟수와 지속 시간을 비교하는 데 쓴다. 측정소코드 같은 전역 조인 키가 없어서 에어코리아 측정소별 대기질 자료나 다른 행정 데이터와는 지역명을 매핑해서 붙여 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 지역별 미세먼지 주의보, 경보 관련 정보입니다.\""
