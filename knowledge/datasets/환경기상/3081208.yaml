summary_user: 부산광역시 동래구 관내에서 고용노동부에 신고된 석면해체·제거 작업장을 현장 한 건씩 담은 원천 목록으로, 작업신고번호·공사현장명·소재지·해체제거업체명·해체 시작/종료일·자재 종류(천장재·지붕재·벽재 등)·면적을 담는다(파일 약 6KB 규모의 CSV). 동래구 주민이 우리 동네 공사장에서 언제 석면 해체가 진행되는지, 어떤 업체가 맡았는지 확인하는 데 쓴다. 전역 조인 키는 없어서 소재지 주소를 지오코딩하거나 업체명·현장명을 문자열로 맞춰 다른 석면·비산먼지·건축 인허가 데이터와 이어 붙인다.
description_portal: 부산광역시 동래구 관내 석면해체· 제거작업장 현황[50㎡이상 석면건축물 고용노동부 석면해체 ·제거작업신고현황, (관련법령_1) 산업안전보건법 시행규칙 제181조 1항(석면해체·제거작업 신고 절차 등)석면해체·제거업자는 산업안전보건법 제122조제3항에 따라 석면해체·제거작업 시작 7일전까지 별지 77호 서식의 석면해체·제거업자 신고서에 다음 각 호의 서류를 첨부하여 해당 석면해체제거장소의 소재지를 관할하는 지방고용노동관서의 장에게 제출해야한다, (관련법령_2) 산업안전보건법 시행규칙 제181조 2항(석면해체·제거작업 신고 절차 등)석면해체ㆍ제거업자는 제1항에 따라 제출한 석면해체ㆍ제거작업 신고서의 내용이 변경된[신고한 석면함유자재(물질)의 종류가 감소하거나 석면함유자재(물질)의 종류별 석면해체ㆍ제거작업 면적이 축소된 경우는 제외한다] 경우에는 지체 없이 별지 제78호서식의 석면해체ㆍ제거작업 변경 신고서를 석면해체ㆍ제거작업 장소의 소재지를 관할하는 지방고용노동관서의 장에게 제출해야 한다 (관련법령_3) 석면해체제거업자는 작업 전 고용노동부령으로 정하는 바에 따라 고용노동부장관에게 신고하고 석면해체작업에 관한 서류를 보존해야한다] 에 대한 데이터로 고용노농부에 신고한 작업신고번호, 공사현장명, 위치, 해체 시작연월일, 해체 연월일, 종류명(천장재·지붕재·벽재·기타), 석면해체 면적 등의 항목을 제공합니다.
