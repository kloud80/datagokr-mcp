description_portal: 광주광역시 관내 빗물 재이용  시설현황 을 붙임과 같이 공개하고자 합니다.빗물이용시설 설치대상은 물재이용법을 참고하시면 됩니다.추진근거는 물재이용법 입니다.물 재이용시설(빗물) 재이용 목표량 설정으로 수자원의 효율적 활용 및 기후변화 대응 위함 입니다.“물의 재이용”이란 빗물, 오수(汚水), 하수처리수, 폐수처리수 및 발전소 온배수를 물 재이용시설을 이용하여 처리하고, 그 처리된 물(이하 “처리수”라 한다)을 생활, 공업, 농업, 조경, 하천 유지 등의 용도로 이용하는 것을 말한다.“물 재이용시설”이란 빗물이용시설, 중수도, 하ㆍ폐수처리수 재이용시설 및 온배수 재이용시설을 말한다.“빗물이용시설”이란 건축물의 지붕면 등에 내린 빗물을 모아 이용할 수 있도록 처리하는 시설을 말한다.빗물이용시설의 설치ㆍ관리는 종합운동장, 실내체육관, 공공청사, 공동주택, 학교, 골프장 및 「유통산업발전법」 제2조제3호에 따른 대규모점포를 신축(대통령령으로 정하는 규모 이상으로 증축ㆍ개축 또는 재축하는 경우를 포함한다. 이하 이 조에서 같다)하려는 자는 빗물이용시설을 설치ㆍ운영하여야 한다.
