summary_user: 국가 대기환경연구소 측정망에서 잰 납·니켈·망간·아연·칼슘·칼륨·황 7개 금속 성분 농도를 2시간·24시간 이동평균으로 담은 측정 기록이며, 전체 4,990,170건에 기간은 2011-06-16~2013-07-03이다. 대기 연구자가 권역별 미세먼지 속 중금속 성분 농도가 어떻게 달랐는지, 고농도 사례의 원인이 무엇인지 따져 볼 때 쓴다. 측정소코드(stationcode)와 항목코드(itemcode)가 있으나 전역 조인 키는 확인되지 않아, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 환경부 국립환경과학원에서 국가 배경 지역과 주요 권역별 대기질 현황 파악은 물론 황사 등 장거리 이동 대기오염물질의 고농도 오염 현상에 대한 원인을 규명하기 위하여 대기환경연구소를 운영한다. 전국 11개 대기환경연구소(수도권, 백령도, 호남권, 중부권, 제주도, 영남권, 경기권, 충청권, 전북권, 강원권, 충북권)에서 권역별 대기질을 상시 측정하며, 미세먼지 고농도 시 집중 관측 및 사례 분석을 수행한다. 본 자료는 대기 연구 분야에서 활용될 수 있는 7개의 중금속 물질(납, 니켈, 망간, 아연, 칼슘, 칼륨, 황)의 농도를 2시간 및 24시간 이동 평균 하여 제공한다.
