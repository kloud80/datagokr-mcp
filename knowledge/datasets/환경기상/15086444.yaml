summary_user: 경기도 안양시 관내 환경오염물질 배출사업장을 사업장 한 곳당 한 행으로 담은 목록 파일로, 사업장명·관할기관·도로명 소재지·구분을 담는다(약 29KB CSV). 시민이나 분석가가 '우리 동네 근처에 어떤 배출사업장이 있고 어느 기관이 관할하는가'를 확인하거나 지역 오염원 분포를 볼 때 쓴다. 전역 조인 키(사업자번호·표준 코드)가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 자료끼리만 이어 쓰며, 도로명 주소를 지오코딩하면 지도·공간 자료와 겹쳐 볼 수 있다.
description_portal: 안양시 환경오염물질 배출사업장(연번,사업장명,관활기관, 주소, 구분) 현황 자료입니다. 안양시 내의 배출사업장의 위치, 업종 및 배출물질 등을 확인 가능한 데이터입니다. 데이터 설명이 데이터는 경기도 안양시 관내 환경오염물질을 배출하는 사업장의 위치, 업종, 배출물질 종류, 배출량, 관리유형 등의 정보를 포함하고 있습니다.환경부 또는 지자체의 인허가를 받은 사업장을 대상으로 하며, 대기오염, 수질오염, 폐기물 배출 등 다양한 환경영향 요소를 종합적으로 제공합니다.본 데이터는 환경정책 수립, 지역 환경 모니터링, 시민의 알 권리 보장 및 환경영향평가 등에 활용될 수 있습니다.
