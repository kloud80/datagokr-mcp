description_portal: 본 데이터는 경기도 광주시에서 토양오염 가능성이 있어 특별 관리가 필요한 시설의 정보를 제공합니다. 특정토양오염관리 대상시설은 유류 저장시설, 주유소, 세탁소 등 토양오염 유발 가능성이 높은 업종으로, 정기적인 토양검사와 오염 방지 조치가 의무화된 시설입니다. 상호와 대표업종을 통해 각 시설의 명칭과 사업 유형을 확인할 수 있으며, 소재지는 도로명주소로 정확한 위치를 제공합니다. 사업장 전화번호는 시설 관련 문의 및 환경 관리 감독을 위한 연락 수단이며, 완공일자는 시설의 설치 시기를 나타냅니다. 용도지역 정보는 해당 토지의 도시계획상 용도를 보여주어 지역 환경 관리 계획 수립에 활용됩니다.
