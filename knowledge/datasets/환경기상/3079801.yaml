summary_user: 경기도 광주시에 있는 특정토양오염관리 대상시설(주유소·유류 저장시설 등)을 시설 한 곳당 한 행으로 담은 CSV 파일로, 상호·대표업종·도로명 소재지·전화번호·완공일자·용도지역이 들어 있다. 부동산 매수자나 개발 검토자가 "이 필지 주변에 토양오염 우려 시설이 있는가, 어느 용도지역에 몰려 있는가"를 확인하거나, 지역 환경 관리 대상을 파악하는 데 쓴다. 전역 조인 키가 없어 도로명주소를 지오코딩하거나 상호·업종 이름으로 다른 사업장 데이터와 맞춰 붙이고, 상수원보호구역·토지피복 같은 환경 공간 규제 레이어와 위치로 겹쳐 쓴다.
limits: 사업자번호나 시설코드 같은 공통 키가 없어 다른 데이터와는 주소·이름 매칭으로만 연결되며 매칭 오류를 감안해야 한다. 범위는 광주시 한 곳뿐이라 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 한다.
