description_portal: 국립공원 연구정보는 2014년에 지리산국립공원에서 시행된 자연자원조사 보고서로, 주로 저서성 무척추동물에 관한 다양한 정보를 담고 있습니다. 이 보고서는 해당 생물들의 분포와 서식 환경을 체계적으로 기록하였으며, 발견된 장소별로 촬영한 현장 사진을 함께 수록하여 시각적 이해를 돕고 있습니다. 특히, 저서성 무척추동물은 지리산 생태계의 건강성과 다양성을 평가하는 데 중요한 지표로 활용되기 때문에, 이 자료는 국립공원의 자연자원 보전과 관리에 있어 매우 중요한 기초 자료로 활용될 수 있습니다.
