summary_user: 대구광역시 동구에 비산먼지 발생 사업으로 신고된 사업장을 건별로 담으며, 사업체명·주소·공사현장명·사업 시작/종료일·사업내용·사업규모를 제공한다. 동구 주민이나 분석가가 '우리 동네 근처에서 지금 진행 중인 비산먼지 발생 공사가 어디이고 언제 끝나는가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호 등)는 없어서 다른 데이터와는 사업체명·주소 문자열 매칭으로만 잇는다.
description_portal: 비산먼지발생 사업신고 현황 조회서비스 API는 사업장에서 발생하는 비산먼지에 대한 관리와 환경 보호를 지원하기 위해 제공되는 데이터 서비스입니다. 이 API는 사업체 명을 기준으로 사업체 명, 주소, 공사 현장 명, 사업 시작·종료 일자, 사업 내용, 사업 규모 등 주요 정보를 조회할 수 있습니다. 이를 통해 행정기관은 비산먼지 발생 사업의 신고 현황을 체계적으로 관리하고, 환경 규제 준수 여부를 점검하며, 사업 규모와 특성을 고려한 관리 계획을 수립할 수 있습니다. 또한 연구자나 개발자는 데이터를 활용하여 대기오염 모니터링 시스템, 환경 지도, 산업 영향 분석 등 다양한 응용 프로그램을 구축할 수 있습니다. 비산먼지발생 사업신고 정보 공개는 공공 환경 관리 투명성을 높이고, 시민 건강 보호와 지속 가능한 산업 운영을 지원하는 데 기여합니다.
