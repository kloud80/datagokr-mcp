summary_user: 경기도 대기환경 진단평가시스템이 기상측정소별로 대기오염물질이 어떤 경로로 유입됐는지 시간대·고도별로 역산한 역추적 결과를 담으며, 한 행은 측정소·역추적 실행일시·추적 시점별 위치(위도·경도)·고도·기압 값입니다. 분석가나 지자체 담당자가 '특정 시점 경기도의 고농도 미세먼지가 국내에서 생긴 것인지, 국외에서 넘어온 것인지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기상측정소코드(wether_mesurstn_cd)의 이름·코드 매핑이나 날짜·시간으로만 이어 쓰며, 에어코리아 측정소별 시간 대기질 자료와 일시를 맞춰 비교하는 방식이 현실적입니다.
description_portal: 경기도_대기환경_진단평가시스템_실시간역추적결과는 특정 지역에서 관측된 대기오염물질이 과거 어느 경로를 통해 유입되었는지를 시간대별·고도별로 추적한 자료입니다. 기상측정소별로 위도, 경도, 고도, 기압 등의 기상 정보를 활용하여 오염물질의 이동 경로를 역산하며, 이를 통해 해당 오염이 국내에서 발생한 것인지, 국외에서 유입된 것인지 구분할 수 있습니다. 이러한 자료는 대기질 변화의 원인을 규명하고 오염 발생지를 파악하는 데 중요한 역할을 하며, 향후 경기도의 대기환경 관리와 예보의 정확도를 높이는 데 유용하게 활용될 수 있습니다.
