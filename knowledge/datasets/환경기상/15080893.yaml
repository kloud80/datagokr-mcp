description_portal: '본 데이터는 전라남도 광양시 관할 내 사업장에서 발생하는 폐기물의 배출 신고 및 처리 현황을 체계적으로 관리하고, 폐기물의 적정 처리와 재활용 촉진을 통한 환경오염 방지와 자원순환형 사회 실현을 위한 기초자료로 제공하기 위해 구축된 자료입니다. 주요 항목으로는 사업장명, 연락처, 신고 기준년도, 생활계 구분(배출시설계/비배출시설계), 배출되는 폐기물의 종류, 운반자명, 처리업소명과 처리방법, 사업장 소재지(도로명·지번 주소 포함) 정보, 업무구분(사업장폐기물 배출자 여부) 등이 있으며, 폐기물 자가처리 여부와 방법, 데이터 기준일자 등이 포함되어 있습니다. 본 자료는 배출 사업장의 위치 및 배출 특성별 현황을 파악할 수 있도록 구성되어 있어, 행정기관에서는 폐기물 발생량 추적, 불법 처리 방지 대책 마련, 지역별 폐기물 발생 및 처리 동향 분석, 재활용율 향상 정책 설계 등 다양한 환경행정 분야에서 활용할 수 있습니다. 민간에서는 환경경영 전략 수립, ESG 경영 보고서 작성, 폐기물 처리업 시장 분석, 지역별 폐기물 발생 패턴 연구 등의 목적으로도 활용 가능하며, 데이터는 현장 점검과 신고 자료를 기반으로 정기적으로 갱신되어 공공데이터포털을 통해 국민 누구나 자유롭게 열람 및 활용할 수 있도록 개방되고 있습니다.<공란사유>- 전화번호: 미집계 데이터 또는 개인휴대전화번호로 개인정보- 그 외: 미집계 데이터'
