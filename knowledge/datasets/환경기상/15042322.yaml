summary_user: 충청북도 음성군에서 음식물류 폐기물을 다량으로 배출하는 사업장을 한 곳씩 담은 건별 목록으로, 상호·도로명/지번 주소·전화번호와 사업장 구분, 월·연 배출 예상량, 위탁 재활용 방법과 위탁 처리 구분, 기준일자를 담는다. 군 담당자나 수거·재활용 업체가 '음성군에서 음식물 쓰레기를 많이 내는 사업장은 어디이고, 배출 예상량과 위탁 처리 방식은 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(도로명·지번)나 상호를 매칭하거나 같은 기관 자료끼리만 이어 쓴다.
limits: 사업장별 원천 목록이며 음식물 폐기물 발생량·처리 현황 통계로 쓰는 데이터가 아니고, 배출량은 실측이 아닌 예상치다. 범위는 음성군 한 곳이라 다른 시군 비교는 지자체별 파일을 따로 모아야 한다.
