summary_user: 안양시 관내 음식물 쓰레기 다량배출 사업장을 사업장 한 곳당 한 행으로 담은 파일(CSV 약 55KB)로, 상호명·신고일자·도로명/지번 주소·업소구분·급식인원수·면적·객실수·배출량·관리기관명을 포함한다. 시민이나 자원순환 담당자가 '우리 동네에서 음식물 쓰레기를 많이 내는 급식소·음식점은 어디이고 배출량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호명으로 맞춰 붙이거나, 다른 시군의 같은 이름 파일과 나란히 놓고 비교하는 식으로 이어 쓴다.
description_portal: 이 데이터는 안양시 관내에서 음식물 쓰레기를 다량으로 배출하는 사업장의 현황을 정리한 자료입니다. 음식점, 급식소, 식품 제조업체 등 음식물 쓰레기 발생량이 일정 기준 이상인 사업장을 대상으로 하며, 사업장명, 주소, 업종, 배출량, 관리 주체 등의 정보를 포함합니다. 본 데이터는 음식물 쓰레기 감량 정책 수립, 자원순환 행정 효율화, 민간 협력 유도 및 환경 교육 자료로 활용될 수 있습니다. 특히 지역 내 환경 문제에 관심 있는 시민, 연구자, 정책 담당자에게 유용한 기초 자료를 제공합니다.상호명, 사업자등록번호, 신고일자, 소재지 주소, 전화번호, 업소 구분, 급식가능 인원수, 업소 면적, 업소 객실수, 배출량, 관리기관명 등으로 구성되어 있습니다
