description_portal: 본 데이터는 한국수자원공사에서 관리하는 전국 지하수 시설의 현황을 토출관 직경별로 구분하여 제공하는 통계자료이다. 지하수 시설은 각 행정구역 단위로 정리되어 있으며, 토출관 직경을 32mm, 40mm, 50mm, 100mm, 미기재 등 다섯 항목으로 분류하고, 이에 따른 시설 수 및 이용량을 집계하였다. 해당 자료는 지역별 지하수 사용 특성과 설비 규모의 차이를 파악하는 데 유용하며, 지하수 자원의 관리 및 정책 수립에 필요한 기초 자료로 활용 가능하다. 또한 본 데이터는 지하수종합정보시스템을 통해 제공되며, 사용자는 시스템 내에서 연도별 통계와 시각화 자료를 함께 열람할 수 있다. 본 통계는 정기적으로 갱신되며, 지하수 개발 및 보전 관련 연구와 행정업무에 참고자료로 활용된다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.gims.go.kr/statistics.do?s_value=statistics_012
