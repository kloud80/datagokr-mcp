summary_user: 경기도 배출시설관리시스템 알림마당에 올라온 공지사항·자료실 게시물을 글 한 건 단위로 담으며, 게시판 구분·제목·본문·조회수·등록·수정일시와 답장·첨부 가능 여부를 함께 제공한다. 환경전문공사업자나 환경관리대행기관, 민원인이 "등록 신청에 어떤 구비서류가 필요하고 우리 지역 담당 부서 문의 전화는 무엇인가" 같은 질문의 답을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 게시판 아이디(board_id)나 제목·본문의 이름 매칭, 같은 기관 기준으로만 느슨하게 이어 쓴다.
description_portal: 이 데이터는 배출시설관리시스템에서 배출시설 관리와 관련한 공지사항, 자료실 게시물 등의 정보를 제공하는 알림마당 게시판 데이터를 포함하고 있습니다. 게시판 구분, 게시판아이디, 제목, 내용, 조회수, 등록일시, 수정일시, 답장 가능 여부, 파일 첨부 가능 여부 등 총 10개 항목으로 구성되어 있으며, 환경전문공사업 및 환경관리대행기관 등의 구비서류 정보, 업무 지역별 문의 전화번호, 공모전 참여 안내 등 다양한 행정 및 정책 정보를 포함합니다. 이 데이터는 환경 관련 기업이나 민원인이 행정절차에 필요한 서류를 준비하거나, 담당 부서에 정확히 문의할 수 있도록 지원하며, 관련 공지사항을 통합적으로 관리하는 데 활용됩니다.
