summary_user: 충청남도 서산시 관내 대기오염물질 배출사업장(3~5종)을 사업장 한 곳당 한 행으로 담은 파일로, 업무구분·사업장명·도로명 소재지·대표업종·종별·데이터기준일자를 담는다(약 24KB 분량의 CSV). 서산시 주민이나 분석가가 "우리 동네 주변에 어떤 업종의 배출시설 사업장이 몇 종으로 있나"를 확인하거나, 지도점검·업종별 배출원 분포를 살피는 데 쓴다. 전역 조인 키(사업자번호 등)는 없어 다른 배출원·대기질 데이터와는 사업장명이나 도로명 주소를 맞춰서만 이어 쓸 수 있다.
