description_portal: '금연구역으로 지정된 공동주택(아파트, 연립주택 등)에 대한 현황 자료로, 금연구역명과 범위, 위반 시 과태료 금액, 신고전화번호, 도로명 주소 정보를 포함한다.공공 건강 보호 및 간접흡연 방지를 위한 정책적 조치 이행 실태를 파악할 수 있다.활용 목적 및 특징– 공동주택 내 금연구역 지정 실태 파악 및 주민 건강권 보호정책 평가– 위반 신고 대응체계 및 행정단속 관련 정보 제공– 지역별 금연구역 분포 비교 및 흡연 민원 대응 기초자료– 금연 홍보 정책, 간접흡연 예방 교육, 건강도시 조성 계획 수립에 활용 가능주요 항목 설명● 금연구역명: 지정된 공동주택의 명칭● 금연구역범위상세: 금연구역의 적용 범위(계단, 복도, 엘리베이터 등)● 위반과태료: 흡연 위반 시 부과되는 과태료 금액● 위반신고전화번호: 위반 사항 신고를 위한 담당 부서 전화번호● 소재지도로명주소: 공동주택의 도로명 주소'
