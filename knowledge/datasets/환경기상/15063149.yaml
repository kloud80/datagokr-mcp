summary_user: 경상북도 관내에 신고·허가된 폐수배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 상호명·주소·업종 세 항목으로 구성되며 파일 크기는 약 16KB 규모다. 지역 주민이나 환경 분석가가 우리 동네에 어떤 업종의 폐수배출 사업장이 어디에 있는지, 시군별로 오염원이 어떻게 분포하는지 파악하는 데 쓴다. 실측 컬럼에 사업자등록번호나 행정코드 같은 공통 조인 키가 없어, 다른 데이터와는 주소를 지오코딩하거나 상호명·주소 문자열을 맞춰 연결해야 한다.
