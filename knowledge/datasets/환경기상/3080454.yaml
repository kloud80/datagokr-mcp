description_portal: '서울특별시 마포구 내의 음식물 쓰레기 다량 배출업소 현황입니다. 각 업소의 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 함께 실제 위치를 나타내는 도로명 주소가 제공됩니다.또한 업소의 명칭, 업종(예: 음식점, 집단급식소,호텔 등), 업소객실수, 음식물쓰레기 배출량, 관리기관명 등 세부적인 정보도 함께 포함되어 있습니다.이 데이터를 통해 행정기관은 음식물쓰레기 발생을 체계적으로 관리하고, 감량 정책 수립이나 지도·점검 등의 행정 업무에 효과적으로 활용할 수 있습니다.주민이나 연구자 또한 지역 내 음식물쓰레기 배출 현황을 파악하는 데 유용하게 사용할 수 있습니다.'
