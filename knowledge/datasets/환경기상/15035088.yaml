summary_user: 서울특별시 영등포구에 있는 실내공기질 관리대상 다중이용시설을 시설 한 곳당 한 행으로 담은 목록 파일(csv)로, 시설군·시설명·주소·전화번호·데이터기준일자를 담는다. 주민이나 분석가가 "영등포구에서 실내공기질 관리를 받는 어린이집·의료기관·대규모점포는 어디인가" 같은 질문에 시설군별로 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소를 맞춰 보거나 같은 기관 자료끼리로만 연결한다.
description_portal: 실내공기질 관리법 제2조에 의거하여 적용대상 서울특별시 영등포구에 소재한 다중이용시설 실내공기질 관리대상 시설 목록입니다.다중이용시설은 불특정다수인이 이용하는 시설을 말하며, 지하역사, 지하도상가, 철도역사의 대합실, 도서관, 박물관 및 미술관, 의료기관, 산후조리원, 노인요양시설, 어린이집, 실내 어린이놀이시설, 대규모점포, 장례식장, 영화상영관, 학원, 전시시설, 인터넷컴퓨터게임시설제공업의 영업시설, 실내주차장, 업무시설, 실내공연장, 실내 체육시설, 영업시설 등의 시설을 말합니다.
