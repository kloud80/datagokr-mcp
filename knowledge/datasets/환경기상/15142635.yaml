summary_user: 환경영향평가 사업의 사업구역 단위로 토지이용 개요(현재·계획 생태면적률, 공원면적, 국토환경성평가 등급별 면적 등), 지목별 면적(지목명·지목면적), 용도지역 변경 전후 면적을 담는 API이며 범위는 전국이다. 분석가나 사업자가 특정 개발사업 구역에 어떤 지목·용도지역이 얼마나 포함되고 개발로 용도지역이 어떻게 바뀌는지를 확인해 개발 선행 지표로 볼 때 쓴다. 전역 조인 키는 없고, 필수 파라미터인 사업 관리번호(mgtNo)를 환경영향평가 협의 현황 등 같은 기관 데이터에서 먼저 받아 넘겨 사업 단위로 이어 쓴다.
limits: 관리번호(mgtNo)를 다른 데이터에서 먼저 얻어야 호출되며, 개요(/getInfo)·용도지역(/getSpfc) 오퍼레이션은 최소 파라미터로 응답이 없어 실호출 성공은 3개 중 1개(지목)뿐이었다. 사업 건별로 생성 후 바뀌지 않는 이벤트성 자료라 시계열 변화 추적에는 맞지 않고, 필지·지번 코드 같은 전역 키가 없어 다른 토지 데이터와는 이름 매핑으로만 연결된다.
