description_portal: '○ 통계개요* 통계명 : 대기오염* 통계종류 : 서울시 대기오염물질별 오염도를 측정하여 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 대기오염물질별 오염도 등을 측정하여 적정한 정책의 수립ㆍ시행을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 서울시보건환경연구원 → 시도 → 환경부* 공표주기 : 정기* 공표범위 : 지역- 서울시내용 - 평균 SO2, PM10, PM2.5, NO2, O3, CO의 대기오염도○ 기 타* 환경기준은 고정된 값(기준치) 임, 초미세먼지 환경기준(국가 및 서울시 기준)은 2015년 부터 적용* 아황산가스 환경기준 : 연간평균치 0.02ppm이하, 24시간평균치 0.05ppm이하, 1시간 평균치 0.15ppm이하임* 오존 환경기준 : 연간 평균치 0.06ppm이하, 1시간 평균치 0.1ppm이하로「대기환경보존법 시행령 제2조②」에따라 대기오염경보대상 오염물질로 지정됨. 1시간평균농도 0.12ppm 이상시 주의보,0.3ppm이상시 경보, 0.5ppm이상시 중대경보* 구체적 자료 : 서울시 대기환경정보(cleanair.seoul.go.kr) > 정보마당> 자료실> 월별 대기질현황'
