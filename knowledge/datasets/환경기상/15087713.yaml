summary_user: 한국환경산업기술원 녹색제품정보시스템에 등록된 녹색제품을 장소별로 정리한 파일로, 제품마다 업체명·모델명·제품용도·인증번호(EL번호)·인증상태·환경표지 인증 시작일과 종료일·지역을 담으며 범위는 전국입니다. 공공기관 구매 담당자나 사업자가 특정 장소·지역에 놓인 녹색제품이 현재 환경표지 인증을 유지하고 있는지, 인증이 언제 끝나는지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 환경표지 인증 목록 같은 같은 기관 데이터와는 인증번호나 업체명·모델명 같은 이름으로 맞춰 이어 써야 합니다.
limits: 전역 조인 키가 없어 다른 데이터와의 연결은 이름이나 인증번호 대조에 의존하며, 범위는 전국이지만 좌표가 없는 비공간 데이터라 지도 분석에는 바로 쓰기 어렵습니다. 포털 설명에 적힌 '인증심사일' 대신 실제 파일에는 인증시작일 컬럼이 있으므로 필드 해석에 주의합니다.
