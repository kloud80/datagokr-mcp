description_portal: '공공부문 배출량 현황은 공공부문 온실가스 목표관리 운영 등에 관한 지침에 따른 공공부문 온실가스 목표관리 대상 기관(공공기관, 지방자치단체, 소속기관 등)에 대한 온실가스 관련 현황 정보(기관명, 기준배출량, 온실가스 배출량, 온실가스 감축량 등)로 구성된 데이터입니다.이때, 온실가스 목표관리란, 매년 온실가스 배출량 감축 목표를 세우고 목표 달성을 위해 지속적으로 온실가스 감축 활동을 하는 것을 말합니다.* 기준배출량 : 공공부문의 온실가스 감축 목표 등을 산정할 때 기준이 되는 온실가스 배출량'
