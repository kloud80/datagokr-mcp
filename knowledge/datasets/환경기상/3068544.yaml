summary_user: 창원시 관내 석면조사 의무대상 건축물 가운데 석면건축물로 분류된 건물을 건물·동 단위로 한 줄씩 담은 파일(csv, 약 34KB)로, 건축물 분류·건축물명·동명·주소·위해성 평가 결과를 포함한다. 주민이나 학부모, 부동산 거래 당사자가 '우리 동네 학교나 공공건물 중 석면이 쓰인 곳은 어디이고 위해성 등급은 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 건축물 주소(건축물 주소)나 건물명을 문자열로 맞춰 건축물대장·주소 좌표 데이터와 연결해야 한다.
limits: 건물 코드나 지번 코드 같은 공통 키가 없으므로, 다른 데이터와 붙일 때는 주소·이름 표기 차이 때문에 매칭이 틀리거나 빠질 수 있다. 범위는 창원시 한 곳뿐이라 다른 시군구와 비교하려면 해당 지자체 자료를 따로 모아야 한다.
