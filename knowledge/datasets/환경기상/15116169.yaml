summary_user: 서울특별시 중구에서 대기·실내공기·악취·수질·소음진동·빛 공해 측정을 대행하는 환경측정대행업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일·영업상태(등록·폐업 등)·폐업일·소재지 주소·중부원점TM 좌표·실험실 면적과 주소를 포함한다. 환경측정대행업 등록을 준비하는 예비 사업자가 '중구에 현재 영업 중인 측정대행업체는 몇 곳이고 어디에 몰려 있나'를 확인하거나, 분석가가 업체 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 다른 구의 같은 인허가 데이터와 합치거나 좌표(XCRD·YCRD)로 지도 위에 겹쳐 보는 방식이 현실적이다.
description_portal: '서울특별시 중구의 대기오염물질, 다중이용시설 등의 실내공간오염물질, 악취, 수질오염물질, 소음·진동 또는 인공조명에 의한 빛 공해의 측정업무를 대행하는 업소 정보입니다. 데이터는 각 환경측정대행업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 환경측정대행업 등록을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 측정장비 정도관리 시설기준 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
