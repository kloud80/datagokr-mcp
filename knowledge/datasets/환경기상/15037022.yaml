summary_user: 성남시 안에서 실내공기질관리법 적용을 받는 다중이용시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설구분(어린이집·의료기관·지하역사·학원 등)과 시설명, 도로명·지번 주소, 위경도 좌표가 들어 있다. 시민이나 분석가가 '우리 동네에서 실내공기질 관리 대상인 어린이집·산후조리원·노인요양시설은 어디인가'를 확인하거나, 지도에 표시해 유형별 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 위경도 좌표를 기준으로 공간 매칭하거나 시설명으로 맞춰 이어 쓴다.
description_portal: '성남시내 실내공기질관리법 적용대상 다중이용시설현황 자료입니다. 시설구분, 시설명, 도로명주소, 지번주소, 위경도 좌표값 등 항목으로 구성되어 있습니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.* 실내공기질관리법 적용대상 다중이용시설 유형(시설구분): 노인요양시설, 대규모점포, 도서관, 목욕장업, 미술관, 산후조리원, 실내어린이놀이시설, 실내주차장, 어린이집, 영화상영관, 의료기관, 인터넷컴퓨터게임시설제공업, 장례식장, 지하도상가, 지하역사, 학원'
