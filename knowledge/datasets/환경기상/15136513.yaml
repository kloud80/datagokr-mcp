summary_user: 국립공원공단이 국립공원에서 운영하는 선박 한 척마다 선박명, 선적항, 항해구역, 선박용도, 건조조선소, 진수일자를 담은 건별 현황 파일로, 전국 범위의 비공간 자료이며 파일 크기는 약 1KB로 작다. 해상 국립공원의 순찰·구조·관리용 선박이 어느 부서에 몇 척, 어떤 용도로 배치돼 있고 얼마나 오래됐는지 확인하려는 행정·안전관리 분석가가 쓴다. 선박번호(vessel_id)로 다른 선박 관련 자료와 잇고, 부서코드(npark_dept_cd)로 국립공원공단의 부서·공원 단위 자료와 이어 쓴다.
description_portal: '본 데이터는 전체 국립공원에서 운영·관리 중인 선박에 대한 기본 정보를 수록한 자료로, 국립공원공단의 해양형 국립공원(예: 한려해상, 다도해해상 등)에서 수행하는 순찰, 구조, 환경관리, 탐방 지원 등 다양한 임무에 사용되는 선박 현황을 제공합니다. 주요 항목에는 선박명, 선박용도(관리선, 구조선, 순찰선 등), 선적항, 등록번호, 배치 국립공원명, 소유 및 관리 주체, 탑승 정원, 건조연도, 사용 여부, 등록 구분 등의 정보가 포함되며, CSV 포맷으로 제공됩니다. 본 데이터는 해양 안전관리계획 수립, 선박 유지보수 및 예산관리, 운항 정보 통계화, 탐방객 수송체계 분석, 해양환경 보호활동 지원 등 다양한 공공·행정 목적으로 활용됩니다. 또한 자산관리시스템, 해양 모니터링 시스템과 연계하여 국립공원 해역 내 효율적 운용을 위한 기초 자료로 사용됩니다.'
