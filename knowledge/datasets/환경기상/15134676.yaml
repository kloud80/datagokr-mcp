description_portal: 환경책임보험 전산망에서는 보험 미가입 현황을 체계적으로 관리하여 의무 가입 이행 여부를 정확히 파악하고 있습니다. 미가입통보대상여부는 해당 사업장이 보험 미가입으로 인해 관련 기관으로부터 통보 대상인지 여부를 나타내며, 이를 통해 빠른 조치가 가능하도록 합니다. 미가입시기와 미가입종기는 보험 미가입 상태가 시작된 날짜와 종료된 날짜를 기록하여, 미가입 기간을 명확히 산정할 수 있게 합니다. 이와 함께 미가입일수는 실제로 보험에 가입하지 않은 총 일수를 계산하여 미가입 기간의 길이를 파악하는 데 활용됩니다.또한, 책임/보장계약구분은 해당 보험 계약이 책임보험인지 보장성 보험인지를 구분하며, 의무가입대상구분은 법적으로 보험 가입이 의무화된 대상인지 여부를 표시합니다. 이와 같은 정보는 보험 미가입 관리와 법적 준수 점검, 그리고 미가입에 따른 행정조치 및 지원 정책 수립에 중요한 근거 자료로 활용됩니다.
