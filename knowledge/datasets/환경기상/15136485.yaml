description_portal: 본 데이터는 국립공원 내에 분포한 문화자원의 주변 환경 정보를 체계적으로 수록한 자료로, 자원의 보존 상태 분석, 입지 적정성 평가, 활용 가능성 검토 등을 위한 기초 공간정보를 제공합니다. 주요 항목에는 문화자원명, 위치 좌표(위도·경도), 자원 유형(사찰, 유적, 전통시설 등), 주변 지형(산지, 해안, 하천 등), 인접 시설(도로, 탐방로, 야영장 등), 주변 식생, 경관 영향 요소, 인위적 훼손 여부, 접근성 평가, 경관 노출도 등의 정보가 포함되며, CSV 포맷으로 제공됩니다. 이 데이터는 문화자원 보호계획 수립, 경관 관리방안 설계, 자연·문화 복합 해설 콘텐츠 개발, 탐방 동선 구성, 문화경관 영향도 분석 등 다양한 분야에 활용됩니다. 또한 국립공원 문화자원 현황자료 및 경관자원 데이터와 연계하여 GIS 기반 시각화 및 분석에 최적화된 구조로 구성되어 있습니다.
