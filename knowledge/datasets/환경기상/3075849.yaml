description_portal: 2024년도 말 기준 부산시 생활(가정)폐기물 및 사업장비배출계폐기물의 발생 및 처리현황을 작성한 데이터입니다.이 데이터는 부산시의 16개 구·군에서 발생하는 생활폐기물의 배출특성(배출지역, 발생량, 폐기물종류),  처리방법(소각, 매립, 재활용 등)별 처리량, 폐기물발생에서 최종처리 과정까지 투입된 인력, 장비, 관리비용 등 에 관한 자료를  파악하여 작성한  데이터 입니다.전국 폐기물 발생 및 처리현황에 대핸 통계자료는 당해연도 말까지 전년도 자료를 토대로 통계를 작성합니다. 따라서 2024년 데이터는 2025년말까지 작성되어 승인된 자료이며, 2025년 데이터는 2026년 말까지 작성 승인될 예정입니다.
