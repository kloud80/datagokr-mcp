summary_user: 경상북도 영천시 소재 업체별로 사용하는 연료 종류(경질유·중질유)와 연간 사용량(리터)을 업체명·주소·전화번호와 함께 담은 건별 현황 자료로, 범위는 영천시 한 개 시군구이며 행정단위는 개별 주소입니다. 지역 환경·에너지 분석가가 영천시에서 중질유를 많이 쓰는 업체가 어디에 몰려 있는지, 연료 사용 규모가 큰 대기 배출원 후보가 어디인지 파악하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 배출시설 사업장 원장 등 다른 데이터와는 업체명·주소 문자열 매칭으로만 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시 소재 기업들의 경질유 및 중질유 사용 현황을 상세히 기록한 자료입니다. 영천시 내 다양한 업체들의 명칭, 연락처, 주소, 연료 종류, 연간 사용량(리터 단위), 제공기관, 그리고 데이터 기준일자를 포함하고 있으며, 기업별 에너지 소비 규모와 유형을 파악하는 데 유용하게 활용될 수 있습니다. 개인정보 보호와 관련하여 전화번호 데이터의 경우 공란이 있을 수 있습니다. 본 자료는 영천시의 산업별 연료 사용 현황을 체계적으로 보여줌으로써, 지역 산업의 에너지 소비 패턴과 환경 영향을 분석하는 데 중요한 참고 자료가 됩니다.해당 데이터와 관련하여 추가적으로 궁금하신 사항이 있으실 경우 영천시 환경보호과로 연락해주시면 감사드리겠습니다.
