summary_user: 소음·진동관리법에 따라 수동으로 측정한 환경소음 이동식 측정 결과를 측정지점별·연도·반기별로 담은 파일이며, 낮 8시·낮 16시·밤 23시 측정값과 평균값을 확정값으로 제공한다(전국 범위, 약 5.8KB의 작은 CSV). 주민이나 분석가가 "우리 도시의 주거·상업 등 용도지역 측정지점 소음이 반기별로 어떻게 변했나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 도시명·측정지점명 같은 이름 매칭으로만 연결한다.
limits: 측정지점 좌표나 표준 행정코드가 없어 지도화나 다른 데이터와의 직접 조인이 어렵고, 이름 기반 매칭이 필요하다. 수동 측정의 시간대별 값과 평균만 담아 실시간·연속 소음 추이는 볼 수 없다.
