summary_user: 오존주의보와 황사주의보의 발령 내역을 연도 단위로 조회하는 건별 원천 API로, 전체 5,243건이 전국을 범위로 2024-06-13부터 2026-09-21까지 담겨 있다. 국민이나 분석가가 올해 우리 지역에 오존주의보가 언제 발령되고 해제됐는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 지역명(districtName)의 이름 매핑이나 같은 기관(에어코리아)의 다른 대기질 데이터와 연결해 쓴다.
limits: 전체 5,243건 중 검증 호출은 1,000행만 받았으므로 전량 수집은 페이지를 6회 이상 반복해야 한다. 실측 최신 행 날짜는 2026-09-21로 관측일 기준 11일 전이며, 개발계정은 일 500회로 호출이 제한된다. 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이 필요하다.
