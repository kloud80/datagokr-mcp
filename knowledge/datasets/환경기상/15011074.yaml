summary_user: 경기도 시군별 대기 중 중금속 농도를 집계일자 단위로 집계한 자료로, 납·카드뮴·크롬·비소 등 12종의 측정값(μg/m³)을 시군 행정단위로 담는다. 주민이나 분석가가 '우리 시군의 대기 중 납·카드뮴 농도가 시기별로 어떻게 변했는가'를 확인하거나 지역별 환경위해도를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군명(SIGUN_NM)이나 경기도 자체 시군코드를 이름·코드 매핑해서 잇는다.
description_portal: '이 데이터는 경기도 내 각 시군에서 측정된 대기 중 중금속 농도 값을 집계한 자료로 집계일자별로 ‘납’, ‘카드뮴’, ‘크롬’, ‘구리’, ‘망간’, ‘철’, ‘니켈’, ‘비소’, ‘베릴륨’, ‘알루미늄’, ‘칼슘’, ‘마그네슘’ 등 12종의 중금속 측정값(단위: μg/m³)을 제공합니다. 주요 데이터 항목은 ‘집계일자’, ‘시군명’, 각 금속별 측정값으로 구성되어 있으며  지역별 환경위해도 분석, 환경정책 수립 및 공공보건 대응 등에 활용될 수 있습니다. 데이터는 미세 입자에 포함된 다양한 중금속의 농도 수준을 정량적으로 제공하며, 특정 금속은 값이 매우 낮거나 0.0으로 기록되어 있어 해석 시 검출한계 또는 미검출 상황을 고려해야 합니다. 각 항목의 수치는 실측 결과로 환경변화에 민감하게 반응할 수 있으므로 시간적 변화 추적에도 유용합니다.'
