summary_user: 광양항 중흥부두 1번 센서에서 시간 단위로 측정한 실외 대기 값으로, 시각·측정소별 초미세먼지(PM2.5)·미세먼지(PM10)·온도·습도를 담은 건별 측정 파일(CSV, 약 105KB)이다. 항만 인근 주민이나 분석가가 '중흥부두 주변 미세먼지가 어느 시간대에 높아지는가'처럼 항만 지역 공기질 변화를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시간과 측정소 이름을 맞춰 붙여야 하며, 같은 기관의 다른 센서 데이터나 인근 에어코리아 측정소 자료와 시각 기준으로 비교하는 방식으로 쓴다.
