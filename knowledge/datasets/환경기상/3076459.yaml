summary_user: 부산광역시 구·군별 먹는물 공동시설(약수터)마다 먹는물 수질기준 항목을 검사한 결과를 시설·검사 건별로 담으며, 검사 연도·분기·월, 지역, 시설 지점, 적합 여부(result)와 항목별 측정값이 들어 있다. 시민이 자주 가는 약수터의 최근 수질검사 적합 여부를 확인하거나, 분석가가 구·군별 부적합 약수터 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·지역명 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
