summary_user: 일반대기환경측정망에서 1시간 단위로 측정한 오존·일산화탄소 확정 자료를 측정소별 8시간 이동 평균한 농도(ppm)를 담은 파일로, 시도·도시·군구·측정소와 날짜·8시간 평균 시간대별로 한 행씩 전국 범위를 다룬다. 분석가나 연구자가 우리 지역 측정소의 오존 8시간 평균이 대기환경기준을 넘은 날이 언제였는지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 기관의 측정소코드나 측정소명·시도 이름을 매핑해 에어코리아 측정소 정보나 다른 측정망 자료와 잇는다.
