summary_user: 경상북도 울릉군 관내에 설치된 클린하우스(쓰레기 배출 장소)를 한 곳씩 담은 건별 목록으로, 읍면동·위치·인근주소와 데이터기준일자를 담는다(CSV 약 4KB, 활용신청 없이 내려받음). 울릉군 주민이나 방문객이 '우리 동네에서 쓰레기를 내놓을 클린하우스가 어디 있나'를 확인하거나, 분석가가 읍면동별 배출 지점 분포를 볼 때 쓴다. 전역 조인 키나 좌표 컬럼이 없어 읍면동 이름이나 인근주소를 기준으로 다른 울릉군 생활폐기물 배출·수거 지점 데이터나 주소 기반 자료와 이름 매칭으로 잇는다.
