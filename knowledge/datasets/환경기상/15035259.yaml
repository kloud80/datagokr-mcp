summary_user: 광양시 안의 소음·진동 배출시설을 사업장 한 곳당 한 행으로 담은 파일(CSV 약 14KB)로, 사업장명, 지번·도로명 소재지, 인허가일자, 소음·진동 구분이 들어 있다. 주민이나 분석가가 '우리 동네 근처에 소음·진동 배출시설로 신고된 사업장이 어디에 있고 언제 인허가를 받았는가'를 확인하거나, 지자체가 민원 대응·저감 대책의 기초 자료로 쓴다. 전역 조인 키나 사업자번호가 없어서 다른 데이터와는 사업장명이나 소재지 주소를 맞춰 이어야 하고, 대기 배출시설 사업장 원장 같은 데이터와도 이 방식으로만 연결된다.
