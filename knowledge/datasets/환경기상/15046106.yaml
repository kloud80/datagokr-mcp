summary_user: 진주시 관내에서 인허가를 받은 특정토양오염관리대상시설(석유류 저장용량 2만L 초과 시설 등)을 사업장 한 곳당 한 행으로 담은 목록 파일이다. 업소명과 도로명·지번 주소, 위험물안전관리법 완공검사일이 들어 있다. 주민이나 부동산·개발 검토자가 "이 필지 근처에 토양오염 관리 대상 저장시설이 있는가"를 확인할 때 쓰고, 완공검사일을 기준으로 토양오염도검사·누출검사 시기를 가늠하는 데에도 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소를 지오코딩하거나 업소명으로 맞춰서 연결해야 한다. 같은 진주시의 다른 환경 공간 규제 레이어와는 주소 기준으로 겹쳐 본다.
description_portal: 진주시 관내 특정토양오염관리대상시설 현황(업소명, 도로명주소, 위험물안전관리법 완공검사일)을 제공합니다. 토양환경보전법 제12조에서 정하는 바에 따라 진주시 관내에 인허가를 득한 사업장이며, 같은 법에서 정하는 바에 따라 토양오염검사를 부과하고 있습니다. 토양환경보전법에서 정하는 특정토양오염관리대상시설은 석유류 저장용량이 20,000L가 넘을 경우 특정토양오염관리대상시설이라고 규정하고 있습니다. 토양오염검사는 위험물안전관리법 완공검사일을 기준으로 하며, 최초 완공검사일 이후 15년간은 5년에 한번 토양오염도검사를 부과하며, 15년 이후는 매2년마다 한번씩 부과하고 있습니다. 누출검사의 경우는 최초 검사는 완공검사일 이후 10년째 되는 해에 부과하며, 그 이후로는 매8년마다 부과하고 있습니다. 토양오염검사(토양오염도검사, 누출검사)는 토양관련전문기관에 의뢰하도록 규정하고 있으며, 토양관련전문기관은 그 성적서를 의뢰인 및 관할 지자체에 송부하도록 법에 규정하고 있습니다. 토양관련전문기관의 명단은 환경부 홈페이지에 환경정책란에 안내되어 있습니다.
