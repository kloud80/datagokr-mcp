summary_user: 서울특별시 금천구의 대기오염물질 배출시설 설치 사업장을 사업장 1곳당 한 행으로 담은 인허가 원장으로, 인허가일·영업상태(휴업·폐업 포함)·사업장명·주소·업종·주생산품·배출시설과 방지시설의 운영시간·연간 가동일수·좌표를 포함한다. 주민이나 분석가가 "우리 동네 근처에서 현재 영업 중인 대기 배출 사업장은 어디이고 언제 인허가됐나"를 확인하거나, 행정기관이 지도·점검 대상을 추릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방기관코드), 관리번호로 연결하고, 좌표(XCRD·YCRD)로 지도 위 다른 오염원·측정 데이터와 공간적으로 겹쳐 본다.
description_portal: 대기오염물질배출시설설치사업장의 인허가 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호, 소재지 면적, 업종 구분, 환경업무 구분, 좌표 정보 등 다양한 항목을 포함하여 사업장의 운영 실태와 특성을 체계적으로 확인할 수 있습니다. 이를 통해 대기오염물질 배출시설의 설치와 운영 현황은 물론 휴업, 폐업 등 행정적 변동 사항도 파악할 수 있어 환경 관리와 정책 수립에 중요한 기초 자료로 활용할 수 있습니다. 또한 연구자는 지역별 대기오염물질 배출 특성을 분석하는 자료로 사용할 수 있으며, 행정기관은 민원 대응이나 규제 관리, 사업장 지도·감독에 참고할 수 있습니다. 나아가 지역별 사업장 분포 분석, 환경 안전망 구축, 대기질 개선 대책 마련 등에도 기여할 수 있는 실효성 높은 공공 데이터입니다.
