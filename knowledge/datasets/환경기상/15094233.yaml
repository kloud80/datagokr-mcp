summary_user: 서울 서초구에 인허가된 환경전문공사업 사업장을 한 곳씩 담은 원장으로, 사업장명·지번/도로명 주소·인허가일·영업상태(정상·폐업 등)·폐업일·좌표(XCRD/YCRD)·실험실 소재지 정보가 들어 있다. 발주처나 분석가가 '서초구에서 지금 영업 중인 환경전문공사업체는 어디이며 언제 등록했는가'를 확인하거나 폐업·휴업 추이를 볼 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: 서울특별시 서초구 환경전문공사업 인허가 정보에 대한 데이터로 사업장명, 지번주소, 도로명주소, 대표자, 등록분야 등에 대한 정보 확인이 가능합니다.서울특별시 서초구는 환경시설 설계·시공 분야에서 신속 대응이 가능한 중소 전문업체 풀(pool)을 확보하고 있으며, 관내 업체는 수시 등록·갱신을 통해 최신 사업 수요에 대응하고 있습니다. 이들 업체는 공공기관 발주 사업뿐 아니라 민간기업의 환경시설 수요에도 유연하게 대응할 수 있는 역량을 갖추고 있으며, 각종 폐수 처리, 대기오염 방지시설 설치 등의 전문 기술을 제공하고 있습니다. 그리고, 이 데이터는 업체가 어떤 환경공사를 법적으로 수행할 수 있는지를 확인·분석하는 데 쓰입니다.
