summary_user: 정선군시설관리공단이 운영하는 야영장·휴양림(정선 펫 캠핑장, 도사곡휴양림 펜션, 화암약수 야영장)의 음수대 수질검사 결과를 시설·채수일자별로 담은 작은 파일(csv 755바이트)로, 냄새·맛·탁도·불소·질산성질소·총대장균군 등 항목별 결과와 적합 여부 판정(판정)을 포함한다. 캠핑객이나 관광 안전정보 제공자가 '이 야영장 음수대 물을 마셔도 되는가, 최근 검사에서 적합 판정을 받았는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소를 기준으로 맞추거나 같은 기관의 시설 데이터와 이어 써야 한다.
description_portal: 정선군시설관리공단에서 운영중인 야영장 및 휴양림 시설(정선 펫 캠핑장, 도사곡휴양림 펜션, 화암약수 야영장)의 수질검사 결과를 제공하는 데이터입니다.본 데이터는 이용객의 안전하고 쾌적한 시설 이용을 지원하기 위해 정기적으로 실시한 수질검사 결과를 포함하고 있습니다. 주요 제공 항목은 시설명, 소재지, 전화번호, 채수일자와 함께 냄새, 맛, 색도, 불소, 탁도, 암모니아성질소, 유리잔류염소, 질산성질소, 총대장균군, 분원성대장균군 등 수질 관련 검사 결과입니다.해당 데이터는 시설별 위생 및 수질 관리 현황을 확인할 수 있는 자료로, 야영장 및 휴양림 이용객의 사전 정보 확인, 공공시설 위생 관리 참고자료, 지역관광시설 안전정보 제공 등에 활용될 수 있습니다.정선군시설관리공단에서는 매년 분기 1회 정기적으로 수질검사를 실시하고 있으며, 본 데이터는 그 결과를 바탕으로 갱신됩니다.
