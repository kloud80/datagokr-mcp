description_portal: '최근 5년간(2021~2025년) 해양오염 원인조사 등을 위해  해상, 해안 및 주변 오염원을 대상으로 시료 감식 및 분석 현황에 관한 데이터입니다.  - 오염사고시 유출유와 혐의오염원 시료를 감식, 분석하여 행위자 색출 지원 및 대형 해양오염사고 시 기름오염 확산지역 규명 등 과학적 증거자료 확보 - 원리: 사람마다 지문이 다르듯이 기름마다 다른 유지문을 활용 - 감식: 시료별 크로마토그램, 풍화도 그래프, 판별지수 등으로 유사판정 기준에 따라 매우유사, 유사, 상이, 판정불가로 판정 - 분석기능: (연구센터) 중부청, 동해청, 제주청 (서해청, 남해청) 소속서 의뢰시료 분석'
