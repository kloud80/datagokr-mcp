description_portal: 은평구의 음식물폐기물 다량배출 사업장 현황입니다. 구분, 업체명, 주소, 연락처, 처리방법 등의 정보를 제공합니다.서울특별시 은평구_음식물폐기물다량배출사업장현황 데이터는 은평구 관내에 위치한 음식물폐기물을 다량으로 배출하는 사업장들의 운영 현황을 종합적으로 다량배출사업장의 관리와 모니터링에 필요한 기초자료를 제공하고 있습니다.다량배출사업장의 법적 기준은 폐기물관리법에 의해 명확히 규정되어 있으며, 영업장 면적이 200㎡ 이상인 일반음식점 및 휴게음식점, 1일 평균 총 급식인원이 100명 이상인 집단급식소, 유통산업발전법에 따른 대규모점포, 농수산물 도매시장·공판장·종합유통센터, 관광숙박업 등이 해당됩니다. 이러한 사업장들은 음식물류 폐기물의 발생억제와 적정한 처리를 위하여 법적 의무사항을 준수해야 하며, 발생억제 및 처리계획 신고, 관리대장 작성 및 보존, 연간 처리실적 보고 등의 의무를 지고 있습니다
