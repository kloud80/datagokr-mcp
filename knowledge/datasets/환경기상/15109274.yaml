summary_user: 충청남도 서천군에서 구조된 야생동물을 접수 건별로 담은 원천 자료로, 종명과 분류(강·목·과), 천연기념물·멸종위기 등급, 구조 일시와 위치 좌표, 발생 원인, 구조 결과와 방생 위치를 기록한다. 서천군에서 어떤 종이 주로 어떤 원인(교통사고 등)으로 구조되고 방생·폐사로 이어지는 비율이 어떤지 살피려는 지자체 담당자나 연구자가 생태통로 설치나 인간-야생동물 갈등 대응을 검토할 때 쓴다. 전역 조인 키는 없으므로 종명(동물국문명)으로 종 정보와 맞추거나, 구조·방생 위도·경도로 도로·보호구역 같은 공간 레이어와 겹쳐 쓴다.
