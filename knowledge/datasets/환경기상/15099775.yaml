description_portal: 광주광역시 남구에 위치한 음식물류 폐기물 발생 사업장 중 「폐기물관리법」 제15조의2에 따라 의무적으로 음식물류폐기물의 발생 억제 및 처리 계획 신고를 해야하는 사업장 현황 및 정보를 제공합니다. 연락처가 공란인 사업장들의 경우 개인정보가 포함되어 있어 미표기 하였으며, 해당 데이터는 광주광역시 남구청 환경관리과(☎062-607-3632)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다.※ 음식물류폐기물 다량배출사업장은 음식점, 호텔, 급식소, 대형마트 등과 같이 일정 규모 이상으로 음식물 쓰레기가 많이 발생하는 시설을 의미합니다. 이들 사업장은 법령에 따라 자체 처리시설을 설치하거나, 전문 처리업체에 위탁해 폐기물을 관리해야 합니다. 해당 데이터는 사업장의 위치, 업종, 관리 현황 등을 제공하여 지자체가 지역 내 음식물 쓰레기 발생 규모를 파악하고, 불법 투기 예방 및 자원순환 정책 수립에 활용할 수 있습니다. 민간에서는 환경 컨설팅, 재활용 산업 개발, ESG 경영 자료 등으로 응용할 수 있으며, 학계에서는 폐기물 저감 대책과 지속가능한 도시 환경 연구 자료로 사용할 수 있습니다.
