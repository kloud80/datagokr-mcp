summary_user: 광주광역시 남구에서 음식물류폐기물 발생 억제·처리 계획을 신고해야 하는 다량배출사업장의 상호·주소·구분·배출량을 사업장 한 곳당 한 행으로 담은 건별 목록이다(시군구 범위, CSV 약 14KB). 환경 컨설팅·위탁처리 업체가 남구에서 음식물 쓰레기가 많이 나오는 음식점·급식소·대형마트가 어디에 있는지 찾거나, 연구자가 동네별 다량배출 사업장 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소를 맞춰 붙이거나, 같은 남구의 다른 폐기물 배출·수거 지점 파일과 나란히 놓고 쓴다.
