summary_user: 순환자원을 공개입찰로 매각·거래하려는 업체가 등록한 입찰공고를 공고 단위로 담는 건별 원천 데이터로, 물품 분류·수량, 입찰 일정, 예정가격·보증금, 공고 결과와 낙찰·유찰 사유를 포함한다(공동주택 제외, 전국 범위). 순환자원 매입을 검토하는 재활용 사업자가 "지금 입찰 중인 폐자원 공고는 무엇이고 예정가격과 마감일은 언제인가", 분석가가 "품목별로 낙찰·유찰은 어떻게 갈리는가"를 확인하는 데 쓴다. 전역 조인 키는 없고 공고번호(pbancNo)로 공고 상세와 결과를 서로 잇는 정도이며, 다른 데이터와는 공고자 업체명이나 물품 분류명을 이름으로 맞춰서만 연결된다.
description_portal: 순환자원을 공개입찰 방식으로 매각 및 거래하고자하는 업체에서 등록한 입찰공고 관련 상세정보를 조회하는 서비스입니다.(공동주택 제외)
