summary_user: 경기도 내 폐수배출시설 사업장별로 방류구, 배출시설, 방지시설, 수질오염물질 항목·배출량, 처리방법, 용수 공급원과 일일 평균·최대 사용량을 담은 시설 단위 현황 자료로, 범위는 경기도(시도) 단위다. 지역 주민이나 환경 분석가가 "우리 동네 산업단지 사업장들은 어떤 오염물질을 어떤 방식으로 처리하고 용수는 얼마나 쓰는가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 전역 조인 키는 없어, 사업장명·사업자등록번호(bizregno)·업종명·산업단지명 같은 이름과 코드를 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 경기도 내 폐수 배출시설의 배출 방지시설에 대한 운영 현황을 기록한 자료로, 사업장명, 업종코드, 산업단지, 관할기관, 방류구번호 및 상태, 배출시설명과 방지시설명, 오염물질 항목, 처리방법, 용수 공급원 및 사용목적, 일일 평균 및 최대 용수 사용량, 용수사용량 단위 등 총 42개 항목으로 구성되어 있습니다. 각 방지시설은 폐수의 물리적·화학적 정화 과정을 포함하며, 오염물질 종류 및 용수 사용 정보는 환경영향 분석에 중요한 자료입니다. 본 데이터는 배출 방지 설비의 운영 실태를 점검하고, 폐수 처리의 효율성과 적정성을 평가하는 데 활용할 수 있으며, 산업단지별 환경 관리 실태 파악에도 유용합니다.
accrual_periodicity: 수시
