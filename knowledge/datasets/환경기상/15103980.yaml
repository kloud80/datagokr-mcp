description_portal: 환경보호 의식 향상과 깨끗한 생활환경 조성에 대한 시민들의 요구가 증대되면서, 생활폐기물 불법투기 방지와 환경질서 확립을 위한 체계적인 감시 시스템 구축이 중요한 환경정책 과제로 대두되고 있습니다. 폐기물관리법에 따른 적정한 폐기물 처리 질서 확립과 불법투기 근절을 통한 쾌적한 도시환경 조성이 요구되고 있으며, 과학적이고 효율적인 감시 체계 구축을 통한 환경법규 위반 행위 단속 강화가 필요합니다. 불법투기 다발 지역에 대한 선제적 대응과 예방 중심의 환경관리 정책 추진을 통한 환경오염 방지 효과 창출이 중요해지고 있으며, CCTV 감시 시스템의 효과적 운영을 통한 환경 범죄 억제와 증거 수집 체계 강화가 요구되고 있습니다. 또한 시민들의 환경 보전 의식 함양과 자발적 환경질서 준수 문화 확산을 위한 홍보와 교육이 필요하며, 환경보전 정책 수립과 효과적인 불법투기 방지 대책 마련을 위한 체계적인 현황 관리의 중요성이 증대되고 있어, 충청남도 보령시는 관내 불법투기 감시를 위해 설치된 CCTV의 설치 장소, 위치, 설치 대수, 전원 공급 방식 등 환경보전과 불법투기 방지에 필요한 종합적인 불법투기감시 CCTV 현황 정보를 제공하고 있습니다.
