description_portal: '1. 조사목적: 재활용가능자원인 폐지, 폐유리용기, 철스크랩, 폐플라스틱재활용원료의 효율적인 이용과 재활용을 촉진하기 위하여 재활용지정사업자의 연간 이용목표율 대비 재활용실적을 파악하고 정책 수립을 위한 기초자료로 제공2. 조사대상: 재활용지정사업자의 재활용 지침 제2조에 따른 재활용지정사업자3. 주요 조사내용- 재활용계획: 제품생산에 투입되는 재활용 가능자원 이용계획- 재활용실적: 제품생산량 대비 재활용가능자원 사용실적4. 주요 용어 정리- 재활용지정사업자: 재활용가능자원을 효율적으로 이용하기 위하여 특히 필요한 업종으로서 대통령령으로 정하는 업종에 종사하는 사업자(종이제조업, 유리용기제조업, 제철 및 제강업, 합성수지나 그 밖의 플라스틱 물질 제조업)- 재활용 중점관리 대상사업자: 재활용지정사업자로서 연간 종이를 1만 톤 이상, 유리용기를 2만 톤 이상, 제철 및 제강업을 10만 톤 이상, 플라스틱 중 페트를 1만 톤 이상 생산하는 자- 이용목표율: 해당 품목별로 환경부가 고시하는 재활용 이용 목표율'
