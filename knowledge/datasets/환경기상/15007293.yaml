summary_user: 광주환경공단이 운영하는 생활폐기물 수집운반업체를 업체 한 곳당 한 행으로 정리한 소규모 현황 파일(CSV 약 903바이트)로, 폐기물 분류, 반입 폐기물 종류, 담당 지역, 업체명, 전화번호를 담는다. 시민이나 민원 담당자가 "우리 동네 생활폐기물은 어느 업체가 수거하고, 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 지역명이나 업체명을 이름으로 맞추어 연결해야 한다.
description_portal: 광주환경공단 생활폐기물 수집운반업체 현황에 대한 데이터로, 생활폐기물의 안정적인 수거 및 처리를 위해 운영 중인 수집운반업체의 주요 정보를 제공합니다. 해당 데이터에는 각 업체가 담당하는 반입 폐기물의 종류, 해당 지역(관할구역), 업체명, 업체 전화번호 등의 항목이 포함되어 있어, 지역별 생활폐기물 처리 체계와 담당 업체 현황을 명확히 파악할 수 있도록 구성되어 있습니다. 이 데이터는 폐기물 수거 행정의 투명성 제고, 민원 대응, 업체 관리, 위탁운영 실태 점검 등 다양한 행정적 용도로 활용될 수 있으며, 시민들에게도 관련 정보를 제공함으로써 생활환경 개선에 기여할 수 있습니다.
