description_portal: 이 데이터는 경상남도 남해군 내에서 중질유(벙커C유, 벙커A유 등)를 사용하는 사업장의 현황을 자세히 제공합니다. 사업장별 상호, 주소, 전화번호 같은 기본 정보는 물론, 생산 품목과 연료 사용량 등도 함께 제공되어 대기오염 배출량을 간접적으로 파악할 수 있습니다. 일반 시민과 환경단체는 해당 데이터를 활용해 지역 내 주요 대기오염 유발 시설 현황을 모니터링할 수 있고, 행정기관은 사업장 점검, 환경 정책 수립, 오염 저감 사업 추진시 근거 자료로 사용할 수 있습니다. 또한, 개발자들은 대기질 정보와 연계한 대기환경 모니터링 서비스, 위치 기반 환경 리포트 앱을 개발할 수 있습니다. 단, 연료 종류 및 사용량 등은 사업체 자가 신고 기준이므로 실제와 다를 수 있고, 민감 정보 보호를 위해 일부 개인정보는 제한될 수 있습니다.
