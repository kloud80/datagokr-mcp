summary_user: 인천 연수구 안에서 대기 배출시설을 설치한 사업장을 한 곳씩 담은 목록으로, 업소명·업종·도로명 주소·배출 물질을 담은 작은 CSV 파일(약 2.4KB)이다. 연수구 주민이나 환경 분석가가 '우리 동네 어느 사업장이 어떤 대기오염물질을 내보내는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 도로명 주소나 업소명을 맞춰 보는 방식으로만 이어 쓴다.
