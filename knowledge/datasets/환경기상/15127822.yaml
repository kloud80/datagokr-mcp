description_portal: 이 데이터는 해양수산부에서 괭생이모자반의 연도별 및 지역별 수거 현황을 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 괭생이모자반의 수거량을 연도별/월별로 구분하고, 수거지역별로 해안가, 해상 등 수거구분, 수거량(톤단위) 정보로 구성되어 있습니다.본 데이터는 정부기관에서 해양환경 관리 정책의 자료로 활용하거나, 해당 지역 수거 작업의 효율성 분석, 해양자원관리 및 연안 환경 연구, 괭생이모자반 처리 및 활용방안 마련, 수거사업 예산 산정 등을 위한 기초 정보로 사용될 수 있습니다.
