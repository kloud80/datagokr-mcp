summary_user: '충청남도 청양군에서 접수된 야생동물 구조 건을 한 건씩 담으며, 접수번호별로 종명·분류(강·목·과)·멸종위기 등급·CITES 여부, 발견·접수·구조 일시, 발견 주소와 구조·방사 좌표, 발생 원인, 구조 결과와 체중·임상 진단을 기록한다. 청양군 안에서 어떤 종이 어떤 원인(예: 차량 충돌)으로 어디서 자주 구조되고 방사·폐사 등 결과가 어떠한지를 묻는 지자체 담당자나 생태 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 종명(국명)이나 주소·좌표를 기준으로 공간·이름 매칭해 이어 쓴다.'
description_portal: 발견일시, 접수일시, 구조일시 등의 야생동물 구조 데이터 정보를 제공하는 충청남도 청양군 야생동물 구조 데이터 조회 서비스
