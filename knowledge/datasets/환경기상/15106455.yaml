description_portal: 울산광역시 북구 특수규격종량제봉투 판매처에 대한 데이터입니다.특수규격종량제 봉투는 내부 인테리어 공사, 보수공사 등으로 소량(5톤 미만)으로 배출되는 공사장 생활폐기물 등을 처리하기 위한 봉투로, 해당 데이터에는 판매처의 행정동, 업체명, 주소, 연락처 정보가 포함되어있습니다.인테리어 사업자, 공사 사업자 등 관련업종에 종사하는 분들께서 봉투 판매처 정보를 빠르게 확인할 수 있도록 공개한 정보입니다. 추가적인 문의사항이 있을 경우, 자원순환과(특수규격종량제봉투 담당) 혹은 미디어정보과(공공데이터 담당)에 문의 바랍니다.
