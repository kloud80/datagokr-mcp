description_portal: 경상북도 영덕군 야생생물 보호구역 지정·관리 현황에 대한 데이터(지적면적, 편입면적, 지목, 소유자 등)를 제공합니다.2025년 3월 25일 초대형산불로 인해 영덕군 산림이 약 27% 소실되었으며, 야생생물보호구역 전역이 피해를 입어 현재 벌목작업이 진행중에 있어, 보호종이 조류의 서식이 불가함에 따라 야생생물보호구역이 변경되었습니다. 29년전인 1997년에 지정된 야생생물보호구역에 대해 생태조사를 통해 생태보전의 가치와 복원의 기반을 마련함으로 보전가치가 훼손된 지역의 토지의 이용 가치를 높임과 동시에 신속한 산불 피해 복원 가능하게 되었습니다.
