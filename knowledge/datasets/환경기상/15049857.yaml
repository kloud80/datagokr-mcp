description_portal: 충청남도 대기오염측정망시스템에서 추출한 측정소정보 자료로, 도내 대기오염 측정망을 구성하는 각 측정소의 기본 현황을 체계적으로 제공하는 데이터이다. 본 자료에는 측정소를 고유하게 식별할 수 있는 측정소코드와 측정소명을 비롯하여 측정망 관리에 필요한 핵심 정보가 포함되어 있어 측정소별 운영 및 관리에 활용할 수 있다. 이를 통해 충청남도 전역에 분포한 대기오염 관측 지점의 위치와 구성 현황을 파악할 수 있으며, 측정소별 대기질 측정자료의 연계·분석이 가능하다. 또한 측정망 운영 현황 점검, 대기환경 관리 정책 수립, 환경 통계 작성 및 도민 대상 대외 정보 제공을 위한 기초 자료로 활용된다.
