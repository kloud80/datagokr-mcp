description_portal: 이 데이터는 서울특별시의 지열관정(개방형) 설치 현황을 나타낸 자료입니다. 각 행은 개별 지열관정의 위치, 규격, 소유 및 시공 정보, 허가 정보 등을 포함합니다. 주요 항목으로는 경도·위도(도·분·초), 굴착 깊이와 지름, 설치 주소, 소유자 및 시공사 정보, 양수 능력, 연번, 착공일자, 허가번호, 허가일자, 허가 시작·종료일 등이 있습니다. 이를 통해 특정 지역의 지열관정 분포를 확인하고, 설치 규모와 시공 이력, 허가 기간 등을 분석할 수 있습니다. 또한 좌표 정보를 이용하면 지도 시각화가 가능하며, 재생에너지 활용 현황과 관련 정책 평가, 환경 영향 분석에도 활용될 수 있습니다.
