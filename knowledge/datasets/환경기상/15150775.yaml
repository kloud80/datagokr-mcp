summary_user: 지역별 초미세먼지 주의보의 발령·해제 일시를 건별로 담는 데이터로, 범위는 전국이며 발령일·발령시각, 해제일·해제시각, 지속시간, 발령 권역 이름과 코드 같은 컬럼으로 구성된다. 시민이나 분석가가 '우리 지역에 초미세먼지 주의보가 언제 발령돼 몇 시간 이어졌는가'를 확인하거나 지역별 발령 빈도를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 권역명·시도 코드(STDG_CTPV_CD)로 이름·코드를 맞춰 연결해야 한다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지역 초미세먼지 주의보 일시 정보입니다."
