summary_user: 대구광역시 서구 관내 음식물류폐기물 다량배출사업장을 사업장 1곳당 1행으로 담은 파일로, 업종·업소명·도로명주소·전화번호·수거형태(감량기, 환경업체 위탁, 위탁급식업체 이용 등)·연 배출량(킬로그램)을 수록한다. 지자체 폐기물 담당자나 분석가가 '서구에서 음식물쓰레기를 많이 내는 업소는 어디이고, 어떤 방식으로 처리하며, 연간 얼마나 배출하는가'를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 도로명주소나 업소명을 매칭해 잇거나, 같은 서구·대구 지자체의 폐기물 파일과 나란히 놓고 비교한다.
description_portal: 대구광역시 서구 음식물류폐기물다량배출사업장 현황에 대한 데이터로 업종, 업소명, 소재지주소, 전화번호, 수거형태, 연배출량에 대한 정보를 제공합니다.본 데이터는 대구광역시 서구 관내 음식물류폐기물을 다량 배출하는 사업장 현황을 수록한 자료이다. 업종별, 업소명, 소재지(도로명 주소), 전화번호, 수거 형태, 연 배출량(킬로그램)을 포함하고 있어 음식물류폐기물 관리 현황 파악에 유용하다. 수거 형태는 감량기, 환경업체 위탁, 위탁급식업체 이용 등으로 구분되며, 배출량 정보는 폐기물 발생량 추적 및 환경 정책 수립에 활용된다. 해당 데이터는 폐기물 관리 및 행정 업무에 필요한 기본 정보로서, 공공 데이터 개방을 통해 관련 기관 및 시민의 투명한 정보 접근과 활용을 지원한다.
