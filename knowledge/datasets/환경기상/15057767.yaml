summary_user: 경기도 시군별 폐기물처리업체를 업체 한 곳당 한 행으로 담으며, 사업장명·처리업종 구분(수집운반·중간처분·최종처분·재활용)·처리대상 폐기물·전화번호·도로명/지번 주소·위경도를 포함한다. 사업자나 주민이 '우리 시군에서 건설폐기물을 수집운반하거나 재활용하는 업체는 어디인가'를 찾을 때, 분석가가 지역별 처리업체 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 시군명·시군코드(SIGUN_CD)로 같은 기관(경기도) 데이터와 잇거나, 주소·위경도로 다른 공간 데이터와 위치 기준으로 맞춰 쓴다.
description_portal: '이 데이터는 경기도 내 시군별 폐기물처리업체에 대한 현황 정보를 제공하며, 사업장명, 전화번호, 처리업종구분, 처리대상 폐기물, 주소(도로명, 지번), 우편번호, 위경도 좌표(WGS84 기준) 등의 세부 항목으로 구성되어 있습니다. 폐기물 처리업종은 수집운반, 중간처분, 최종처분, 재활용 등으로 세분화되어 있으며, 각각의 업종 유형은 번호와 기호(예: ①ⓐ, ②ⓕ 등)로 구분되어 처리 방식에 따라 식별할 수 있습니다. 폐기물의 유형에 따라 건축폐기물, 생활폐기물, 음식폐기물 등의 구분이 가능하며, 관련 법령에 따라 지정된 처리업체 정보를 통해 자원순환 정책 수립, 지역별 처리역량 분석, 폐기물 관리 체계 개선 등에 활용할 수 있습니다. 해당 데이터는 연간 주기로 갱신되며, Open API를 통해 접근할 수 있습니다.'
