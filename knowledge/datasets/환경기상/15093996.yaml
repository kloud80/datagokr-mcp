summary_user: 소규모수도시설에서 지하수를 원수로 쓰는 경우의 법정 원수 수질검사 결과를 시설·측정지점별로 담은 파일(csv, 약 556KB)로, 검사년도·지역·시설명·측정지점 주소·수도규모·수원과 카드뮴·비소·수은·납·불소·농약류 등 항목별 검사값을 담고 범위는 전국이다. 지자체 담당자나 분석가가 "우리 지역 소규모 지하수 상수원 원수에서 비소·불소 같은 유해물질이 어느 정도 검출되는가"를 시설별로 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 측정지점 주소(주소 매칭)로만 이어 쓰며, 같은 기관의 수질 데이터와는 이름 기준으로 연결한다.
limits: 표준 시설 코드나 행정코드 같은 전역 조인 키가 없어 다른 데이터와 붙일 때 시설명·주소 문자열 매칭에 의존해야 한다. 원수(처리 전 지하수) 검사 결과이므로 실제 수도꼭지 수돗물 수질로 해석하면 안 된다.
