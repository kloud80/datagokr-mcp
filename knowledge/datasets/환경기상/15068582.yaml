summary_user: 전국 유역을 대권역·중권역·표준유역 3단계로 나누고, 일자별로 표준유역마다 강수량(mm)을 담은 CSV 파일이다(약 48KB). 하천·댐 관리기관이나 분석가가 홍수·가뭄 대응을 위해 특정 유역에 그날 비가 얼마나 왔는지 확인할 때 쓴다. 표준유역·중권역·대권역 코드가 들어 있지만 실측 결과 전역 조인 키는 확인되지 않았으므로, 다른 수문·수자원 자료와는 유역 코드나 유역 이름을 맞춰 연결한다.
description_portal: '홍수 등 수문기상 재해 대응 및 물관리 유관기관 지원을 위한 유역별 맞춤형 강수량 예측정보를 생산합니다. 세부 사항은 기상청 수문기상 가뭄정보 시스템(https://hydro.kma.go.kr)을 참고하여 주시기 바랍니다.<용어설명>- 유역: 강수로 인한 물이 한 곳(하천, 호수 등)으로 모이는 지표면의 범위- 대권역(26개): 환경부 수자원단위지도에서 구분한 대권역(21개)을 기반으로 한강권, 낙동강권을 세분화한 기상청 대권역 단위- 중권역(117개): 대권역을 세분화한 유역 단위- 표준유역(850개): 중권역을 세분화한 유역 단위- 티센: 각 관측소에서 가장 가까운 영역을 다각형으로 구분하는 공간 분할법- 등우선: 강수량이 같은 지점을 연결하여 그린 선'
