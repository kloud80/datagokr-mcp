description_portal: 서울시 보호수 및 노거수 위치정보 데이터는 서울시 내 역사적·문화적·생태적 가치가 높은 보호수와 노거수의 분포와 현황을 체계적으로 관리하기 위한 자료입니다. 구명, 법정동명, 산지여부, 주지번·부지번, 새주소명, 지목한글 등을 통해 정확한 위치와 토지 정보를 확인할 수 있으며, 수목면적, 수종한글, 본수, 과명, 학명, 수령, 수고, 흉고둘레, 수관너비, 활력도 등 세부 생육 특성을 제공합니다. 또한 지정품목, 지정년월일, 수목구분내용, 가치등급, 소유자, 관리자, 품계등급 등을 통해 행정적·관리적 현황을 파악할 수 있습니다. 병해·충해 종류와 피해도, 관리상태, 관리방안, 기타 피해상태와 관리 내역 등 보전 상태 정보와 더불어 지정사유, 나무의 특징, 연혁 및 전설 등 문화·역사적 기록을 포함하고 있어, 도시 생태보전, 문화자원 관리, 경관계획 및 교육·관광 콘텐츠 개발에 유용한 공간정보 데이터입니다.
