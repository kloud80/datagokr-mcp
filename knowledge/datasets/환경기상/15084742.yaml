summary_user: 부안군 관내 대기오염물질 배출시설 사업장을 한 건씩 담은 원천 목록으로, 사업장명·주소·대표업종·배출시설 종별(종)·데이터 기준일을 수록한 약 10KB 규모의 CSV 파일이다. 주민이나 환경 분석가가 '우리 동네 주변에 몇 종 대기배출 사업장이 있고 어떤 업종인가'를 확인하거나, 군 단위 오염원 분포를 업종별로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 사업장명을 맞춰 붙여야 하며, 다른 시군의 같은 이름 배출시설 현황 파일과는 컬럼을 맞춰 이어 쓴다.
limits: 사업자번호 같은 공통 키가 없어 기업 정보·TMS 측정자료와 바로 연결되지 않고, 사업장명·주소 매칭에 기대야 한다. 부안군 한 곳만 담고 있어 광역 비교에는 다른 시군 자료를 따로 모아야 하며, 실제 배출량은 담지 않는다.
