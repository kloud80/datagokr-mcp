summary_user: 서울특별시 강남구의 실내공기질 관리대상 다중이용시설을 시설 단위로 담은 파일 데이터로, 시설군·시설명·소재지(도로명주소)·전화번호를 싣고 총 664행이다. 강남구 주민이나 분석가가 우리 동네에 어린이집·의료기관·학원 같은 관리대상 시설이 어느 군에 몇 곳 있는지 확인하는 질문에 쓴다. 소재지(address)를 조인 키로 삼아 주소 기반의 다른 실내공기질·시설 데이터와 이어 쓰며, 그 밖의 코드 키는 없다.
description_portal: 서울특별시 강남구 실내공기질 관리대상 다중이용시설  정보입니다.(시설군, 시설명, 소재지, 전화번호가 포함되어 있습니다.)시설군은 지하역사, 미술관, 도서관, 의료기관, 산후조리원, 어린이집, 대규모점포, 학원, 영화상영관, pc영업시설, 목용장, 실내주차장 등이 있으며, 해당군에 해당하는 시설을 기재했습니다. 각 시설군마다 해당되는 구체적인 시설명이 기재되어 있으며, 소재지는 모두 도로명주소 형식으로 정리되어 있습니다. 또한, 필요할 경우 문의를 하거나 정보를 확인할 수 있도록 각 시설의 전화번호도 함께 제공되어 있습니다
