summary_user: 경기도 구리시에서 수거된 대형폐기물을 배출일자별로 품목, 상태, 배출량(톤), 처리방법(소각·매립·재활용·재사용 등)과 함께 기록한 파일 데이터입니다. 포털 설명상 2022~2026년 추이를 담지만 실제 파일은 422바이트로 작아 행 수가 매우 적습니다. 구리시 주민이나 분석가가 대형폐기물 배출량이 해마다 늘고 있는지, 재활용 처리 비중은 어떤지를 대략 확인하는 데 쓰며, 전역 조인 키가 없어 다른 지자체 대형폐기물 파일과는 품목명·연도를 맞춰 이어 써야 합니다.
description_portal: '[연도별 대형폐기물 수거·처리 통계 데이터베이스 안내]본 데이터는 지역사회 내에서 발생하는 대형폐기물의 체계적인 관리와 효율적인 정책 수립을 위해 수집된 자료입니다. 대형폐기물로 지정되어 배출된 품목을 대상으로 하며, 수거된 실적량을 기준으로 폐기물의 종류, 보존 상태, 발생량 및 최종 처리 공정 등의 세부 정보를 연도별로 재구성하여 제공합니다.우리 지역 내에서 배출되는 대형폐기물의 흐름을 파악할 수 있는 통합 데이터 시트를 제공한 본 자료는 2022년부터 2026년까지 총 5년 동안의 추이를 담고 있어, 연도별 폐기물 증감 추세는 물론 지역 내 자원 순환 효율성을 검토하는 데 최적화되어 있습니다. 데이터 구축 목적: 연도별 대형폐기물 발생 패턴 분석 및 향후 처리 시설 용량 산정, 자원 순환 정책의 기초 자료 활용기대효과: 재활용 비중의 증감 추이를 통해 지역 내 자원 순환 정책의 실효성을 정량적으로 평가, 톤 단위 배출량 데이터를 바탕으로 탄소 배출권 관련 지표 산출 및 지역 탄소중립 로드맵 수립에 기여.제공 데이터 시계열: 2022년부터 2026년까지의 5개년 누적 데이터 (기준 일자: 2026년 현재)배출 및 수거 일자: 폐기물이 수거되어 데이터로 기록된 시점폐기물 종류: 품목폐기물 상태: 상태 정보배출량(톤): 수거된 폐기물의 실질적인 중량 단위 기록처리 방법: 소각, 매립, 재활용 분리, 재사용 등 최종 처리 공정'
