summary_user: 수질오염공정시험기준에 실린 시험항목을 분야(일반항목·금속류·이온류·유기물질·휘발성유기화합물·생물)별로 시험 번호·제목·분석 장비와 함께 정리한 기준 목록 파일로, 측정값이 아닌 시험방법 참조 자료이며 범위는 전국·비공간이다. 수질 분석기관이나 사업장 담당자가 "이 오염물질은 어떤 시험방법과 분석 장비로 측정해야 하나"를 확인할 때 쓴다. 실측 컬럼에 공통 조인 키가 없어 수질측정망 등 측정 데이터와는 물질명·항목명을 이름으로 맞춰 연결해야 한다.
description_portal: 수질오염공정시험기준 내 일반항목, 금속류, 이온류, 유기물질, 휘발성유기화합물, 생물에 대한 데이터로, 물질명, 물질별 분석법, 분석장비, 정도관리 등이 포함되어있습니다. 수질 오염 물질 측정의 정확성과 통일성 유지. 시료채취방법 및 유의사항, 시료 보존 방법, 분석 장비 및 정도관리에 관한 내용이다. 수질 오염 공정 시험 기준은 수질 오염 물질을 측정할 때 정확성과 통일성을 유지하기 위해 마련된 기준입니다. 이는 환경 분야 시험·검사 등에 관한 법률에 따라 제정되었으며, 시료 채취, 보존, 분석 방법 등 구체적인 사항을 규정합니다.
