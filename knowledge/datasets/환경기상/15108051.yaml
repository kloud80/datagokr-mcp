summary_user: 서울 25개 자치구별로 기준일마다 총 생활인구수와 아황산가스·일산화탄소·오존·이산화질소(ppm), 미세먼지 PM10·PM2.5(㎍/㎥) 농도를 나란히 담은 시군구 단위 집계 CSV 파일(약 2.8MB)이다. 분석가가 "생활인구가 많은 자치구일수록 미세먼지나 이산화질소 농도가 높은가"처럼 구별 인구 규모와 대기오염의 관계를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 시군구 단위 통계나 대기질 데이터와는 시군구코드·시군구명을 매핑해 잇는다.
description_portal: 본 데이터는 2022년 11월 9일 기준으로 서울특별시 25개 자치구의 시군구별 총 생활인구 수와 주요 대기오염 물질 농도를 제공합니다. ‘기준일’, ‘시군구코드’, ‘시군구명’, ‘총 생활인구수’, ‘아황산가스’, ‘일산화탄소’, ‘오존’, ‘이산화질소’, ‘PM10’, ‘PM2.5’ 등 10개 필드를 포함하며, 각 구별 인구 규모와 오염 농도를 공간 단위로 비교 분석할 수 있습니다. 이를 통 해 공간 분포 분석, 인구 이동과 대기질 상관성 연구, 환경 위험 평가 및 예측 모델 검증, 스마트 환경 플랫폼 구축에 활용할 수 있는 데이터 입니다.* 생활인구 :서울시와 KT가 공공빅데이터와 통신데이터를 이용하여 추계한 서울의 특정지역, 특정시점에 존재하는 모든 인구※ 단위 안내- 아황산가스(단위:ppm), 일산화탄소(단위:ppm), 오존(단위:ppm), 이산화질소(단위:ppm), PM10(단위:㎍/㎥), PM2.5(단위:㎍/㎥)
