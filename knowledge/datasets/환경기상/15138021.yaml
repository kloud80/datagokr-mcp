description_portal: 본 데이터는 북한산국립공원 내에 설치된 무선국(무선기지국)에 대한 시설 현황 정보를 포함한 자료로, 공원 내 재난 대응, 순찰 활동, 탐방객 안전관리 및 업무용 무선통신 체계를 지원하기 위해 구축되었습니다. 주요 항목에는 무선국 명칭, 설치 위치(위도·경도), 해발 고도, 주파수 대역, 운용 채널, 설치 연도, 사용 여부, 전원 방식(유선/태양광 등), 관리 주체, 관할 공원사무소, 유지관리 주기 등의 정보가 포함되며, CSV 포맷으로 제공됩니다. 해당 데이터는 재난 상황 발생 시 신속한 구조·구난 통신 확보, 탐방로 원거리 지역과의 실시간 연결 유지, 순찰 인력 간 업무 무선망 운영 등을 위한 핵심 기반시설로 활용됩니다. 또한 국립공원 재난안전 스마트플랫폼, 통합 통신망 구축 사업 등과 연계하여 다양한 공간정보 기반 시스템과의 통합 운영이 가능합니다.
