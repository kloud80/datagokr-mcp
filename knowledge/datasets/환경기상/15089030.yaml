summary_user: 대구광역시 서구 대기정보시스템에서 센서별로 원자료를 분석값으로 바꿀 때 쓰는 설정값(희석배수인수 A·B, 악취도인수 A·B)을 센서고유번호 단위로 담은 작은 파일(약 210바이트 CSV)이다. 서구 측정망의 센서 원자료를 직접 다루는 분석가가 '이 센서의 측정값을 어떤 보정계수로 환산해야 하나'를 확인할 때 쓴다. 전역 조인 키가 없어 같은 기관의 센서 측정 데이터와 센서고유번호를 이름·코드로 맞춰 이어 써야 한다.
limits: 측정값 자체나 시간별 대기질은 담지 않고 환산용 계수만 담는다. 에어코리아 측정소코드 같은 전국 공통 키가 없어 다른 기관 데이터와 바로 붙일 수 없고, 서구 내부 센서 데이터와만 센서고유번호로 맞춰 쓸 수 있다.
