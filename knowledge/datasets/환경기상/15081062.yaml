summary_user: 경상북도 영주시 관내에서 대기·수질·소음진동 배출시설을 운영하며 사업장폐기물을 신고한 배출자를 사업장·폐기물종류별 건별로 담은 원장 파일로, 상호명·폐기물종류·운반자·처리업소·처리방법·주소·신고기준년도를 담는다. 사업자나 분석가가 "영주시의 특정 사업장이 어떤 폐기물을 어느 운반자·처리업소에 맡겨 어떻게 처리하는가"를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 폐기물 처리업 허가 원장이나 사업자 정보와 이어 쓰고, 도로명·지번 주소로 위치 기반 결합도 한다.
description_portal: 폐기물관리법 제17조 제2항 규정에 따라  「대기환경보전법」ㆍ「물환경보전법」 또는 「소음ㆍ진동관리법」에 따른 배출시설(이하 “배출시설”이라 한다)을 설치ㆍ운영하는 자로서 폐기물을 1일 평균 100킬로그램 이상 배출하는 사업장폐기물 배출자 등은 사업장폐기물 종류와 발생량 등을 관할지자체에 신고하여야 합니다.경상북도 영주시 관내에 신고된 배출시설계 사업장폐기물배출자신고 현황에 대한 데이터입니다.데이터 내용은 폐기물구분, 상호명, 폐기물종류, 사업자등록번호, 연락처, 운반자명, 처리업소명, 처리방법, 사업장도로명주소, 사업장지번주소, 신고기준년도 등의 항목을 제공합니다.
