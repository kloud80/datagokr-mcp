summary_user: 서울 강남구에서 대기오염물질 배출시설을 설치해 인허가를 받은 사업장을 한 곳씩 담은 원장으로, 관리번호·인허가일자·영업상태(정상·휴업·폐업 등)·도로명/지번주소·좌표·업종·주생산품·배출시설과 방지시설의 가동시간 같은 항목을 담는다. 주민이나 분석가가 '우리 동네 근처에 대기배출시설을 갖춘 사업장이 어디 있고 지금도 영업 중인가'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙일 공통 조인 키가 없어, 사업장명·주소로 맞추거나 같은 기관 코드(OGDP_INST_CD)를 쓰는 다른 구의 같은 인허가 데이터와 이어 쓴다.
