summary_user: 경기도 안의 대기오염물질 총량관리 대상 사업장을 사업장 한 곳당 한 행으로 담은 현황 목록이며, 집계연도·시군·업체명·배출종 구분·황산화물/질소산화물 할당 대상 여부·허가일·주소·위경도를 포함한다. 지역 환경정책 담당자나 분석가가 '우리 시군에 질소산화물 총량 할당을 받는 사업장이 어디에 몇 곳 있는가'를 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)으로 경기도 다른 데이터와 맞추거나 위경도 좌표로 대기질 측정소 위치와 공간적으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 대기오염물질 총량관리 대상 사업장에 대한 현황을 정리한 자료로, 사업장별로 업체명, 대기오염 배출종 구분, 소재지,위치좌표 등이 포함되어 있습니다. ‘총량관리’란 특정 지역 내 대기오염물질의 배출 총량을 제한하여 관리하는 제도로, 이 데이터는 그 대상 사업장을 중심으로 구성되어 있습니다. 사업장의 환경적 특성과 공간적 분포를 함께 분석할 수 있습니다. 본 자료는 환경영향평가, 지역 환경정책 수립, 오염배출 사업장 관리 및 지도점검, 대기환경개선 전략 수립 등에서 중요한 기초자료로 활용될 수 있습니다.
