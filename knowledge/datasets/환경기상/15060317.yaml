summary_user: 인천광역시 연수구에 사업장폐기물 배출자로 신고한 사업장을 한 곳씩 담은 목록으로, 폐기물 구분·종류, 상호명, 연락처, 도로명 주소, 신고 기준 연도를 기록한 작은 CSV 파일(약 1.7KB)이다. 폐기물 수집·운반이나 처리 업체가 연수구 안에서 어떤 사업장이 어떤 종류의 폐기물을 내는지, 그리고 그 사업장에 어떻게 연락할지 확인하는 데 쓴다. 사업자번호 같은 공통 조인 키는 없어 다른 데이터와는 상호명이나 도로명 주소(사업장도로명주소)를 맞춰 붙이거나, 같은 연수구가 낸 데이터끼리 이어 쓴다.
