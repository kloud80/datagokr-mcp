description_portal: 김해시 석면조사대상건축물 현황(건물명, 동명, 주소, 구분(대분류), 구분(소분류) 등)에 대한 데이터를 제공합니다.석면안전관리법 제21조(석면건축물조사), 제22조(건축물석면조사 결과에 따른 조치), 제23조(석면건축물안전관리인의 지정 등), 제24조(석면건축물안전관리인의 교육)에 따라 관리되고 있는 석면건축물 현황입니다. 석면건축물은 석면건축자재가 사용된 면적의 합이 50㎥ 이상 이거나 분무재 또는 내화피복재를 사용한 건축물입니다. 석면건축물은  「석면관리종합정보망」을 통해 석면조사 결과, 석면지도 등을 관리하고 있습니다.  건축물소유자는 석면안전관리인을 지정하고, 소유자·안전관리인은 교육을 이수하고, 2년 마다 실내공기 중 석면농도 측정,  6개월 주기로 석면건축물의 손상상태 및 석면 비산 가능성 조사 실시하고 있습니다. 우리시의 석면조사대상 건축물 중 석면건축물은 80개소 입니다.
