summary_user: 환경부가 제공하는 전국 대기오염 측정소별 일반항목 측정정보를 행정안전부 재난안전데이터 공유플랫폼이 연계한 것으로, 측정일시별 아황산가스·일산화탄소·오존·이산화질소·미세먼지(PM10) 농도와 항목별 지수, 통합대기환경 수치·지수, PM10 24시간 값을 담는다. 시민이나 분석가가 "지금 우리 동네 측정소의 미세먼지와 오존 수준은 어떤가"처럼 측정소 단위의 시간별 대기질을 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 바로 붙일 공통 조인 키는 찾지 못해, 에어코리아 측정소 정보 등과는 측정소 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 이에 따라 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 측정소별 일반항목 측정정보입니다."
