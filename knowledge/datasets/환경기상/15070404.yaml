summary_user: 국가 온실가스 인벤토리 중 육불화황(SF6) 배출량을 분야별 행, 1990~2023년 연도별 열로 정리한 전국 단위 집계표이며(단위 백만톤 CO2 eq.), 포털 설명상 전량 산업공정 및 제품 사용 분야에서 배출된다. 정책 분석가나 연구자가 'SF6 배출량이 1990년 이후 어떻게 늘거나 줄었는가'처럼 국가 단위 장기 추세를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 가스별 인벤토리(CO2·CH4·HFCs 등) 파일과는 분야명과 연도 열을 맞춰 이어 붙여 쓴다.
limits: 전국·비공간 집계라 지역별·사업장별 SF6 배출은 알 수 없고, 사업장 배출원 데이터와 직접 연결할 키가 없다. 값에 NO·NE·NA·IE·C 같은 표기 코드가 섞여 있어 숫자로 변환할 때 별도 처리가 필요하다.
