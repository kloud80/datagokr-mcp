summary_user: 성남시 안에서 토양오염을 일으킬 수 있어 관리 대상으로 지정된 시설을 한 곳씩 담은 목록으로, 시설유형·상호명·도로명/지번 주소·오염물질 종류를 담는다(약 13KB CSV 파일, 시군구 범위의 개별 주소 단위). 주민이나 부지를 검토하는 사업자가 '이 땅이나 우리 동네 근처에 주유소·유독물 저장시설 같은 토양오염 관리대상시설이 있는가'를 확인하는 데 쓴다. 공통 조인 키는 없어서 소재지 도로명·지번 주소를 주소 매칭하거나 좌표로 변환해 필지·용도지역 같은 공간 규제 레이어와 겹쳐 쓴다.
