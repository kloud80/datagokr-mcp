summary_user: 의정부도시공사가 운영하는 대형폐기물 수거 사업의 수거업체를 업체 한 곳당 한 행으로 담은 소규모 CSV 파일(522바이트)로, 업체명·담당구역·도로명/지번 주소·전화번호·데이터기준일자를 담는다. 의정부시 주민이 '우리 동네 대형폐기물은 어느 업체가 맡고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 담당구역 이름이나 주소 문자열을 다른 지자체의 대형폐기물 수수료·수거업체 파일과 이름으로 맞춰 이어 쓴다.
description_portal: '의정부시에서는 대형폐기물을 버릴 때 품목별, 규격별 수수료가 책정 되어 있으며, 폐기물을 버리는 시민이 수수료를 부담해야만 수거서비스가 이루어 집니다.※ 폐기물 수거 전화번호 : 031-828-6871~2해당 정보는 의정부도시공사에서 운영하는 대형폐기물 사업 관련 수거업체에 관한 정보입니다.수거업체별 담당구역, 주소(도로명, 지번), 전화번호 등을 세부정보로 제공하고 있습니다.의정부도시공사 대표 홈페이지에 접속하시면 사업소개>환경사업>대형폐기물 소개에서도 해당 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/businessInfo/environmentPage/bigtrash/list.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.'
