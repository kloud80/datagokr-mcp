description_portal: 2010년부터 2024년까지 수집된 국내 온실가스 관측소별(안면도, 고산, 울릉도, 독도)의 온실가스 농도입니다. 온실가스는 태양복사를 투과시키고, 지표면에서 방출되는 장파복사를 흡수하거나 재방출하여 온실효과를 유발하는 물질을 뜻합니다. 대표적 온실가스로는 이산화탄소(CO₂), 메탄(CH₄), 아산화질소(N₂O) 등이 있습니다. 이는 배출되면 지구온난화를 가속시키는 역할을 하므로 대기 중 온실가스 농도를 측정하는 것은 지구온난화를 직접적으로 추산하고, 배출원과 소멸원의 변화를 유추할 수 있는 좋은 근거자료로 활용될 수 있습니다.
