description_portal: 이 데이터는 유모차 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지와 200개의 라벨링 텍스트 파일로 구성되어 있으며, 각각 'images' 폴더와 'labels' 폴더에 저장되어 있습니다. 이미지에는 다양한 형태, 색상, 구조의 유모차가 포함되어 있고, 실내외 환경에서 다양한 각도와 거리에서 촬영되었습니다. 유모차의 프레임, 손잡이, 바퀴, 캐노피 등 주요 구성 요소가 식별 가능한 형태로 촬영되어 있습니다. 라벨링 파일은 YOLO 형식으로 작성되어 있으며, 각 이미지 내 유모차 객체의 위치와 클래스 정보가 좌표값 형태로 기록되어 있습니다. 데이터는 객체 탐지 및 분류 모델 학습을 위한 구조와 명명 규칙을 일관되게 갖추고 있습니다.
