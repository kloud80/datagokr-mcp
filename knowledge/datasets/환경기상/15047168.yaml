description_portal: '○ 통계개요* 통계명 : 대형폐기물 발생 및 처리현황* 통계종류 : 서울시 대형폐기물 발생 및 처리현황을 자치구별로 제공하는 일반?보고통계* 작성목적 : 쓰레기 종량제 시행지침에 의거 매년 쓰레기 종량제를 실시하고그 운영현황을 파악하여 생활폐기물에 관한 정책수립의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 시군구 → 시도 → 한국환경공단(업무대행) → 환경부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 대형폐기물 발생량, 처리량, 수입?처리현황○ 용어설명* 대형폐기물 : 가정 또는 사업장 등에서 배출되는 가구, 가전제품, 생활용품, 사무용지자재, 냉난방기 등 개별개량과 품명식별이 가능한 폐기물과 종량제봉투에 담기 어려운 폐기물로서 자치단체의 장이 정하는 폐기물○ 기 타* 통계표에 수록된 숫자는 단위 미만에서 반올림되었을 경우 각 항목 값의 합이 총계와 일치하지 않을 수도 있음○ 출 처 : 환경부, 한국환경공단 「쓰레기 종량제 현황」'
