summary_user: 경기도 양주시의 생활폐기물 수집·운반 대행업체를 업체 한 곳당 한 행으로 정리한 목록으로, 업체명과 함께 구역·담당구역, 담당 면적(㎢), 연락처, 데이터기준일자를 담고 있습니다(CSV 813바이트의 소규모 파일). 양주시 주민이 '우리 동네 생활쓰레기는 어느 업체가 수거하고, 연락처는 무엇인가'를 확인할 때 쓰고, 분석가는 업체별 담당 면적을 비교할 때 씁니다. 전역 조인 키는 없으므로, 다른 자료와 이으려면 구역·담당구역 이름을 행정구역명과 맞추거나 같은 기관(관리기관명)의 다른 폐기물 자료와 이름으로 매칭해야 합니다.
description_portal: 경기도 양주시에서는 생활폐기물의 효율적 관리와 투명한 계약 이행을 위해 양주시 내 청소·청소대행업체와 생활폐기물 수집·운반 대행업체 현황을 정기적으로 수집·공개하고 있습니다. 이 데이터는 양주시가 직접 발주하거나 위탁한 폐기물 수집·운반 계약 업체의 기본 정보와 계약 내용, 서비스 지역 등을 한눈에 확인할 수 있도록 구성되었습니다.  데이터셋은 업체명, 사업자등록번호, 담당 구역, 계약 시작·종료일, 연간 계약 금액, 주요 서비스 종류(청소, 청소대행, 생활폐기물 수집·운반) 등 10여 개 항목으로 이루어져 있으며, CSV·XLSX 형식으로 제공됩니다. 매년 1월에 최신 정보를 반영해 업데이트되며, 행정안전부·공공데이터포털의 ‘폐기물·청소업체 현황’과 연계해 조회·비교가 가능합니다.  이 데이터를 활용하면 지역 주민은 자신이 거주하는 구역의 폐기물 처리 업체를 쉽게 확인하고, 기업·연구기관은 계약 구조와 비용 흐름을 분석해 효율적인 폐기물 관리 방안을 모색할 수 있습니다. 또한, 정책 입안자는 업체별 서비스 품질과 비용을 비교해 향후 계약 정책을 개선하는 근거 자료로 활용할 수 있습니다. 문의는 양주시청 환경과(전화 031‑889‑xxxx)로 부탁드립니다.
