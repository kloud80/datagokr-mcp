summary_user: 경상북도 김천시가 지정·관리하는 보호수를 한 그루(또는 무리) 단위로 담은 파일로, 수종·학명·과명, 그루수, 나무나이·높이·가슴높이둘레, 보호수 유형, 소재지 지번주소와 위도·경도를 시군구 범위에서 개별 위치로 제공한다. 주민이나 지역 연구자가 '우리 동네 노거수가 어디에 있고 수령이 얼마인지', '김천시 보호수 중 느티나무가 몇 그루인지' 같은 질문에 쓴다. 전역 조인 키는 없으므로 다른 시군 보호수 파일과는 시도명·시군구명 같은 이름으로 합치고, 위도·경도나 지번주소를 이용해 지도·공간 레이어 위에 겹쳐 쓴다.
description_portal: 경상북도 김천시 보호수의 체계적이고 합리적인 관리를 위한 현재 보호수 지정 현황으로 보호수 학명, 보호수유형명, 나무종류, 그루수, 나무나이, 가슴높이둘레, 소재지지번주소 등의 정보를 제공합니다.최근 생물다양성 보전과 산림생태계 보호에 대한 중요성이 대두되면서 보호수에 대한 국민적 관심이 크게 증가하고 보존할 가치가 있는 수목을 체계적으로 보호하고 관리하고자 산림자원의 조성 및 관리에 관한 법률 제47조에 의거하여 김천시 내 58개 소재지의 보호수가 관리되고 있습니다. 김천시 보호수는 매년 안전진단, 병해충방제, 외과수술, 주변정비 등을 통해 체계적으로 관리되고 있습니다. 김천시 보호수는 느릅나무과에 속하는 느티나무가 보호수로 가장 많이 지정되어 있으며, 그밖에 은행나무, 소나무, 팽나무, 왕버들 등의 수종이 있습니다.보호수의 지정요건으로는 역사적 및 학술적으로 가치가 있는  - 노목(생장 활동이 활발하지 못한 늙은 나무)  - 거목(굵고 큰 나무)  - 희귀목(매우 드물고 귀한 나무) 등특별히 보호가 필요한 나무를 선정하고 보호수 심의위원회를 거쳐 지정하고 있으며 대한민국에는 13,868그루(2022년 기준)가 보호수로 지정되어 있습니다.지정된 보호수를 훼손할 시 산림보호법에 의하여 3년 이하 징역 또는 3천만원 이하의 벌금에 처해질 수 있습니다.
