summary_user: 국가 온실가스 통계를 산정할 때 쓰는 배출·흡수 카테고리 체계를 순번·분야·카테고리로 정리한 전국 단위 비공간 코드성 파일(csv, 약 5KB)이다. 국가 온실가스 인벤토리를 분석하는 연구자나 분석가가 "에너지·산업공정 및 제품 사용·농업·LULUCF·폐기물 5개 분야 아래 어떤 세부 카테고리가 있는가"를 확인하고 배출량 통계의 항목 분류를 맞출 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 온실가스 배출량 통계와는 분야·카테고리 이름을 매핑하는 방식으로만 이어 쓴다.
description_portal: '* 국가 온실가스 통계는 MPGs 제50항의 규정에 따라 에너지, 산업공정 및 제품 사용, 농업, 토지이용･토지이용 변화 및 임업(Land Use, Land-Use Change and Forestry, 이하 LULUCF), 폐기물, 총 5개 분야로 구분하여 산정하고 있다.* ETF의 이행을 위한 투명성체계 방식･절차･지침(Modalities, Procedures and Guidelines, 이하 MPGs) 제48항･제49항의 규정에 따라 국내에서 배출한 7개의 온실가스(이산화탄소(CO2), 메탄(CH4), 아산화질소(N2O), 수소불화탄소(HFCs), 과불화탄소(PFCs), 육불화황(SF6), 삼불화질소(NF3))에 대한 배출･흡수량 정보를 보고한다.* 온실가스종합정보센터에서 작성한 국가 온실가스 통계는 관리위원회의 심의를 통해 최종적으로 확정되며 온실가스종합정보센터와 통계청의 공식 누리집(홈페이지)을 통해 대외적으로 공표된다.'
