summary_user: 경기도 여주시 안의 개방화장실과 공중화장실을 한 곳당 한 행으로 담은 파일(csv, 약 71KB)로, 주소·위도·경도와 남녀별 변기 수, 장애인·어린이용 설비, 개방시간, 비상벨·CCTV·기저귀교환대 설치 여부를 기록한다. 여주를 찾는 주민·관광객이나 분석가가 '이 근처에 지금 열려 있고 장애인용 칸이나 기저귀교환대가 있는 화장실이 어디인가'를 찾거나 안전설비 설치 현황을 점검하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 관리기관명으로 맞춰 잇는다. 같은 형식의 다른 시군 공중화장실 현황과는 행을 합쳐 쓴다.
