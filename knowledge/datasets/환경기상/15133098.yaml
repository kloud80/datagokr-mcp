description_portal: '관할관청 기준 정보는 각 지역의 폐기물 처리 및 관리 업무를 담당하는 기관에 대한 정보를 제공합니다. 폐기물 처리와 관련된 모든 법적, 행정적 관리와 규제는 관할관청에 의해 이루어지며, 관할관청은 각 지역에서 처리, 운반, 재활용되는 폐기물을 감독합니다. 이들 기관은 폐기물 관리의 법적 기준을 설정하고, 이를 준수할 수 있도록 지원하는 역할을 합니다. 또한, 폐기물 처리 업체는 이들 기관에서 발급하는 필증(허가증)을 통해 법적으로 처리 활동을 진행할 수 있습니다.(관할관청명, 관할관청하위그룹명, 필증발급관청명)* 컬럼별 상세정보○ 관할관청명: 폐기물 처리 및 관련 법적 규제를 담당하는 주요 관할 기관○ 관할관청하위그룹명: 관할관청 내 하위 기관○ 필증발급관청명: 폐기물 처리 관련 필증을 발급하는 행정기관'
