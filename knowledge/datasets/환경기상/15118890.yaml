description_portal: 한국수자원공사에서 제공중인 정보로, 연도별로 지자체별 지하수 이용부담금 징수계획, 지하수 이용부담금 징수실적, 전년도대비증감량, 전년도대비증가율에 대한 정보를 제공합니다. 각 지방자치단체가 설정한 계획 대비 실제 징수 금액을 비교할 수 있도록 구성되어 있으며, 전년도 대비 증감액과 증가율 항목도 함께 제공됩니다. 해당 정보는 지하수 자원 이용에 따른 공공 재정 수입의 실태를 파악하고, 부담금 징수의 효율성과 정책 효과를 평가하는 데 활용됩니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
