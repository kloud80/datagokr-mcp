summary_user: 충청남도 내 실내공기질 관리법 적용대상 다중이용시설을 시설(건물)별로 담고, 시설명·시설 구분·주소와 함께 유지기준 항목(미세먼지·초미세먼지·이산화탄소·폼알데하이드·총부유세균·일산화탄소)과 권고기준 항목(이산화질소·라돈·휘발성유기화합물·곰팡이 등)의 측정값을 시설 단위로 제공한다. 충남 주민이나 시설 이용자가 '우리 동네 어린이집·대규모점포 같은 다중이용시설의 실내 미세먼지·라돈 측정값이 어느 수준인가'를 확인하거나, 분석가가 시설 유형별 실내공기질 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소(INST_DADDR)를 이름·주소 매칭으로 잇거나 같은 충청남도 데이터끼리만 연결한다.
limits: 표준 시설코드 같은 공통 키가 없어 다른 시설 대장·측정 데이터와의 결합은 이름·주소 매칭에 의존한다. 실외 대기질(측정소 기준 시간별 농도·경보)이 아니라 시설별 실내 측정값이므로 실시간 대기오염 판단에는 쓰지 않는다.
