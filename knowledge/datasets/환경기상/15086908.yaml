summary_user: 경기도 내 대기질 측정소별로 시간대별 아황산가스·일산화탄소·오존·이산화질소·미세먼지(PM10)·초미세먼지(PM2.5) 농도를 담은 건별 원시 관측자료로, 시군명·측정소명·측정망 이름과 측정일시가 함께 붙는다. 경기도 주민이나 분석가가 "우리 동네 측정소의 지난달 시간별 초미세먼지 농도가 얼마였나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대기질·행정 데이터와는 시군명(sigun_nm)이나 측정소명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '경기도 내 측정소별 대기질 정보 관측자료입니다. 시간대별 아황산가스농도, 일산화탄소농도, 오존농도, 이산화질소 농도, 미세먼지 PM10, PM2.5 농도값을 제공합니다.*본 자료는 대기질 측정소에서 송신된 원시자료입니다.이 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 자료와 다를 수 있습니다.*측정오류로 인한 데이터는 NULL값 또는 빈칸으로 표시됩니다. 참고 부탁드립니다.데이터 : 현재시점 기준으로 2개월 전까지의 데이터는 SHEET서비스에서 제공됩니다. (1995년~한달전 까지 데이터는 FILE 탭에서 다운로드)※성남동,오전동,광명3동,하대원동은 현재 폐쇄된 측정소 입니다.'
