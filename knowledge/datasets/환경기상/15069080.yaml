summary_user: 경기도 남양주시에 허가·신고된 폐수 배출업소를 사업장 한 곳당 한 행으로 담은 파일로, 폐수종별(3~5종), 사업장명, 읍면동, 주소를 제공한다. 주민이나 분석가가 "우리 동네(읍면동)에 어떤 폐수 배출 사업장이 몇 곳 있고 규모 종별은 어떤가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 읍면동 이름으로만 이어 쓴다.
description_portal: 남양주시 폐수 배출업소 정보 데이터로 폐수종별(3종,4종,5종), 사업장명, 읍면동, 주소 등의 항목을 제공합니다.물환경보전법」 제33조에 따라 일정 규모 이상의 폐수를 배출하는 시설은 관할 지방환경청 또는 지방자치단체에 설치 허가 또는 신고를 해야 하며, 이 때 제출된 정보가 데이터화됩니다. 배출업소(폐수) 정보 데이터는「물환경보전법」에 따라 수질오염물질을 공공수역(하천, 호소, 바다 등)으로 배출하는 폐수배출시설(사업장)의 설치 및 운영 현황, 배출 규모, 오염물질 관리 등에 대한 정보를 담고 있는 공공데이터입니다. 이 자료는 수질 환경 관리, 수질 오염 예방 및 감독에 필수적인 기반 정보를 제공합니다.
