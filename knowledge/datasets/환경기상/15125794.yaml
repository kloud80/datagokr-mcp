description_portal: 이 데이터는 서울특별시 내 둘레길(도보·레크리에이션용 루트)의 폴리라인(선형) 형태 공간정보를 제공하는 자료입니다. 경로를 따라 이어지는 선(라인) 정보가 포함되어 있어, 각 구간의 시작·끝 지점, 중간 경로, 전체 길이 등을 GIS(지리정보시스템)에서 분석하거나 시각화하기 적합하도록 설계되어 있습니다. 위경도 또는 해당 좌표계로 제공되며, 둘레길의 네트워크 구조를 이해하고, 접근성 분석, 연결구간 평가, 레크리에이션 인프라 기획 등에 활용할 수 있습니다. 더불어 해당 경로 위의 주변시설(녹지·공원·벤치·이정표 등)과의 연계를 통해 관광경로 설계, 스마트 트레킹 앱 구축, 자치구별 코스 비교 분석 등에 응용하는 것이 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
