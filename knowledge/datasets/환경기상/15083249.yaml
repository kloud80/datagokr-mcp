summary_user: 대구광역시 측정소별로 아황산가스·미세먼지·초미세먼지·오존·이산화질소·일산화탄소 농도를 연·월·일·시 단위 시간평균으로 담은 파일 자료이며, 포털 설명상 2018~2022년 5년치를 담고 CSV 한 파일 크기는 약 32MB이다. 분석가·연구자가 '대구에서 초미세먼지가 하루 중 몇 시에 가장 높고 계절별로 어떻게 다른가' 같은 시간대·계절별 농도 패턴과 장기 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 측정소코드가 없어서 다른 대기질·기상 자료와는 측정소명과 연·월·일·시를 이름 매핑해 붙여 써야 한다.
limits: 측정소코드 같은 표준 키가 없어 에어코리아 등 다른 자료와 이으려면 측정소명을 직접 맞춰야 한다. 실시간 자료가 아니고 기간이 정해진 과거 시간평균 파일이므로 현재 대기질이나 경보 확인에는 쓰지 않는다.
