description_portal: 이 데이터는 한국환경산업기술원 환경정보공개시스템이 보유한 녹색금융 지원 대상 기업의 연도별 환경오염값 정보를 제공합니다. 연도, 사업자번호(비식별화), 법인사업자 여부, 녹색금융입력값(에너지총량, 총인 등 주요 오염 지표), 등록 일 등 기업별 환경 지표를 상세히 기록하고 있습니다. 금융기관과 투자자는 이 데이터를 통해 기업의 환경 리스크 프로필을 분석하고 지속가능 투자 전략을  수립할 수 있으며, 정책 담당자는 녹색금융 정책의 성과를 평가하여 제도 보완점과 확대 방안을 검토할  수 있습니다. 또한 기업 환경관리팀은 내부 모니터링 지표로 활용해 온실가스 배출 저감 및 에너지 효율 향상 노력을 강화할 수 있습니다.
