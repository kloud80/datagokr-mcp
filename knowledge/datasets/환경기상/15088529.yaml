summary_user: 전국 행정구역별로 지하수 허가·신고·기타 구분에 따른 관정 개소수와 이용량, 그리고 그 총계를 담은 집계표로, 1389바이트 크기의 CSV 파일 한 건이다. 지자체 담당자나 분석가가 "우리 지역 지하수 관정 중 허가 대상과 신고 대상이 각각 몇 곳이고 얼마나 퍼 쓰는가"를 다른 지역과 비교할 때 쓴다. 전역 조인 키는 없고 행정구역 이름(행정구역)뿐이므로, 다른 지역 통계와는 이름을 맞춰 붙이거나 같은 기관의 지하수 자료와 함께 본다.
description_portal: 지역별 허가신고현황에 대한 원천 데이터입니다.본 자료는 행정구역, 총계_개소수, 총계_이용량, 허가_개소수, 허가_이용량, 신고_개소수, 신고_이용량, 기타_개소수, 기타_이용량 으로 구분되어 세부 데이터를 제공하고 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있습니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
