description_portal: 환경책임보험의 책임보험 대기시설 상세정보는 대기오염 관련 시설의 관리와 보험 적용 현황을 종합적으로 파악하기 위해 구성됩니다. 각 시설은 매체시설코드와 종별코드를 통해 식별되며, 해당 시설에서 특정대기유해물질을 배출하는지 여부와 배출량이 기록됩니다. 관리 대상에서 제외된 시설은 삭제여부로 표시되며, 보험 관련 정보는 보험가입대상코드를 통해 확인할 수 있습니다.시설의 운영 상태와 관련해서는 휴업시작일자, 휴업종료일자, 폐업일자가 기록되고, 인허가 반납 여부는 인허가반납여부로 관리됩니다. 시설의 현재 운영 상태는 시설상태코드로 확인할 수 있으며, 안전 관리 차원에서 위해성방지조치여부와 시설설치여부가 포함됩니다.가동 여부를 보다 세부적으로 추적하기 위해 미가동시작일자와 미가동종료일자가 기록되며, 정보의 신뢰성을 위해 정보승인상태코드와 관리 연도(연도)도 함께 관리됩니다. 이러한 정보는 보험 적용 대상 시설의 안전성과 환경오염 관리 현황을 정확히 파악하고, 책임보험 운영과 행정 관리에 필요한 기초 자료로 활용됩니다.
