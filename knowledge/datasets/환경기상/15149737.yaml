description_portal: 환경오염시설의 통합관리에 관한 법률을 근거로, 통합허가 대상 사업장의 통합허가시 허가신청(신청서 작성 통합환경계획서 작성·제출 등), 과학원 및 환경전문심사원의 허가신청 서류 기술검토, 환경부(허가기관)의 허가처리(허가증 발급, 허가검토서), 허가 이후 사후관리 기관인 환경청의 업무지원, 정보공개 등의 허가 전 과정의 업무 처리를 지원하는 전자행정시스템1. 통합환경허가시스템을 통해 만족도 조사를 진행하고 결과 의견수렴 및 반영2. 통합허가 관련 민원과 질의는 ① 진행검색(기관별 업무처리 절차에 따라 허가신청, 통합허가, 통합검색 기능 제공), ②민원처리(사업장 Q&A), 유선전화, 홈페이지, 카카오톡 등을 통한 다채널 대응) 등을 이행
