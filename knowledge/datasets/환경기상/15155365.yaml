summary_user: 경기도 환경전문공사업체가 수주한 환경 공사 실적을 공사 건별로 담으며, 해당년도·수주 사업장명·사업자번호·업종, 배출업소의 업소명·소재지·기업규모·배출규모, 공사명·착공일·준공일·시설용량, 직접공사금액·하도급 금액과 상대 업체, 공사내용, 수출국을 포함한다. 분석가나 환경업체는 경기도 안에서 어떤 업체가 대기오염방지시설·폐수처리시설 공사를 얼마나 수주했는지, 어느 규모의 배출업소가 환경시설에 투자했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 수주업체 사업자번호(bizregno)나 업소명·소재지 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 경기도에서 환경전문공사업체들이 수주한 환경 관련 공사의 실적을 정리한 자료로, 공사의 기본 정보와 함께 발주 및 수주 주체, 공사금액, 공사내용 등을 포함하고 있습니다. 주요 항목은 해당년도, 사업장명, 사업자번호, 업종코드 및 업종명, 배출업소의 업소명·소재지·기업규모·배출규모, 직접공사금액, 하도급 관련 정보, 공사내용, 수출국, 등록일 등으로 구성되어 있습니다. ‘공사내용’ 항목에는 대기오염방지시설 설치, 폐수처리시설 개선, 재이용시설 구축 등 다양한 환경기술 공사가 명시되어 있으며, ‘배출업소-배출규모’는 대기/수질 기준에 따라 사업장의 환경관리 수준을 나타냅니다. 이 데이터는 환경전문업체의 사업 영역 분석, 지역별 환경 인프라 구축 현황 파악, 공공 및 민간의 환경시설 투자 동향 확인 등에 활용될 수 있습니다.
