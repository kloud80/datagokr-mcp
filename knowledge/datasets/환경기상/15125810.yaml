description_portal: 서울두드림길의 지천길 점형 공간정보로 좌표(X,Y)등의 정보를 제공하는 서비스 입니다.이 데이터는 서울시 내 ‘지천길’ 구간으로 지정된 보행/레크리에이션 루트의 점형 공간정보입니다. 각 지점의 좌표(X, Y)가 ITRF2000 좌표계로 제공됩니다.  파일 제공형식은 쉐이프파일 및 CSV이며, 쉐이프파일 인코딩은 UTF-8로 설정되어 있습니다.  이 데이터는 도보 루트 상의 주요 지점(이정표, 쉼터, 경유지 등)의 위치를 파악할 수 있게 설계돼 있어, GIS 기반 둘레길 네트워크 분석, 접근성 평가, 관광·레크리에이션 경로 설계 등 다양한 용도로 활용할 수 있습니다. 또한, 자치구별 지점 분포나 보행 인프라 밀도 분석에 유용한 자료입니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
