description_portal: 해양환경공단이 수행한 해양쓰레기 수거사업의 연도별 실적 정보를 제공합니다. 본 데이터는 전국 연안, 항만, 도서지역 등에서 해마다 수거된 해양쓰레기의 총량과 수거 유형, 지역별 실적 등을 연도 단위로 정리한 통계 자료입니다. 주요 쓰레기 유형은 폐어구, 플라스틱, 생활쓰레기 등으로 분류되며, 각 연도의 수거량 추이를 비교하고 정책 성과를 분석할 수 있도록 구성되어 있습니다. 자료는 해양쓰레기 저감사업의 효과 평가, 예산 기획, 환경정책 수립 등에 활용되며, 공공기관, 연구기관, 지자체 등에서 다양한 행정 및 연구 목적으로 사용할 수 있습니다. 데이터는 표 및 보고서 형식으로 제공되며, 해양환경 개선을 위한 기초자료로 활용됩니다.
