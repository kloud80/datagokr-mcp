summary_user: 제주특별자치도 관내 시설 녹지를 시군구·기준 연도·녹지 구분별로 묶어 개수와 면적(천m²)을 담은 집계 통계이며, 포털 설명상 2011년부터 2019년까지의 연도별 자료다. 도시계획·환경 분석가가 제주시와 서귀포시의 유형별 시설 녹지 면적이 연도마다 어떻게 늘거나 줄었는지 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 제주 통계와는 시군구 이름과 기준 연도를 직접 맞춰 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도가 집계·공개한 ‘시설 녹지 현황’ 통계로서, 2011년부터 2019년까지 제주특별자치도 관내에 조성된 시설 녹지의 유형별 개수 및 면적을 연도별로 정리한 자료이다. 제공기관은 제주특별자치도이며, 데이터 형식은 CSV로 공개되어 누구나 다운로드 가능하다. 이 자료는 도시 계획, 환경 관리, 공원 및 녹지 정책 수립, 녹지율 및 1인당 공원면적 산정, 녹지 공간 분포 분석 등에 필수적인 기초 통계로 기능한다. 특히 도시화와 관광 수요가 공존하는 제주 지역에서 녹지 시설의 연도별 변화와 유형별 분포를 파악할 수 있다는 점에서, 녹지 보전, 도시계획, 공원 조성, 주민 휴식 공간 확보, 경관 보전 및 환경 쾌적성 평가, 기후 대응 녹지 확충 전략 수립 등에 활용될 수 있다. 또한 연구자, 행정기관, 도시 디자이너, 관광 기획자, 시민단체 등 다양한 이해관계자가 녹지 공간의 변화 추세를 분석하고, 생태적 지속 가능성과 도시-자연 균형 확보를 위한 정책 및 계획을 설계할 때 신뢰할 만한 통계 기반으로 활용할 수 있다.
