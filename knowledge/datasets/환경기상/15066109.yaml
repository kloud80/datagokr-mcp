summary_user: 경기도 양주시 관내 대기오염 측정기별로 대기오염물질의 일평균 농도(㎍/㎥)를 측정기명·읍면동·위치·측정일시와 함께 담은 파일 데이터로, 내려받은 CSV는 약 20KB 규모다. 양주시 주민이나 분석가가 "우리 동네 측정기에서 미세먼지 일평균 농도가 어느 달에 높았나"처럼 측정지점별·월별 농도를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 측정소코드가 없어 에어코리아 측정소 자료 등과는 읍면동·위치 이름을 맞춰 이어 써야 한다.
description_portal: 경기도 양주시 관내 대기오염 측정기의 월별 측정 현황을 제공하는 데이터입니다. 측정기명, 읍면동, 위치, 대기오염물질명, 일평균 농도, 측정일시 항목으로 구성되어 있으며, 측정기별 대기오염물질의 일평균 농도를 확인할 수 있습니다.해당 데이터는 지역별·측정지점별 대기오염물질 농도 비교, 월별 농도 변화 분석, 고농도 발생지역 파악 및 대기환경 개선정책 수립 등에 활용할 수 있습니다. 일평균 농도의 단위는 마이크로그램/세제곱미터(㎍/㎥)이며, 측정값이 없는 경우에는 공란으로 제공합니다.
