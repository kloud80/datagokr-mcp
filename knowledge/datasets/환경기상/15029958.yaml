summary_user: 경기도 가평군 관내 환경오염물질 배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·업종·관할기관·관리항목(대기, 수질 등)·오염위험 등급과 도로명·지번 주소, 위도·경도를 포함한다. 주민이나 환경 담당자가 '우리 동네 근처에 어떤 업종의 배출시설이 있고 등급은 어떤가'를 확인하거나, 분석가가 배출시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 위도·경도 좌표 기반으로 이어 써야 한다.
description_portal: 해당 데이터는 경기도 가평군 관내 환경오염물질 배출시설의 현황을 정리한 자료로, 지역 내 환경관리 및 오염원 모니터링을 위한 기초 정보를 제공합니다. 주요 항목으로는 시군명, 사업장명, 업종명, 관할기관명, 관리항목명(대기, 수질 등), 등급명(오염위험 수준), 구분번호, 소재지 도로명 주소 및 지번 주소, 위도, 경도, 데이터 기준일자 등이 포함되어 있습니다. 환경오염 배출시설은 「환경오염시설의 통합관리에 관한 법률」 및 「대기환경보전법」, 「물환경보전법」 등의 관련 법령에 따라 등록·관리되며, 오염물질 배출 특성과 위험 수준에 따라 등급이 부여됩니다. 본 자료는 환경감시, 정책 수립, 지도·단속 및 지역 환경영향평가 등 다양한 행정 및 환경보전 업무에 활용될 수 있는 중요 데이터입니다.
