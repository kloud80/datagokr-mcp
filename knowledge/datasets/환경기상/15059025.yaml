summary_user: 경기도 내 대기오염 배출사업장에 설치된 굴뚝자동측정기기(TMS) 현황을 사업장 단위로 담으며, 집계연도·시군·업종 구분·사업장명·지번/도로명 주소·우편번호·WGS84 좌표·사업자등록번호 등이 들어 있다. 환경 분석가나 지자체 담당자가 '우리 시군에 TMS로 상시 감시되는 대기배출 사업장은 어디에 몇 곳 있나'를 확인하거나 정책 대상지·환경 리스크 평가 대상을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 사업자등록번호(BIZREGNO)·사업장명·주소 매칭이나 시군 코드(SIGUN_CD)로 다른 배출시설·인허가 사업장 자료와 잇는다.
description_portal: '이 데이터는 경기도 내 대기오염물질을 실시간으로 감시하기 위해 설치된 굴뚝자동측정기기(TMS: Tele-Monitoring System)의 설치 현황을 정리한 자료로, 사업장별로 설치된 굴뚝 수, 업종명, 위치 정보 등이 포함되어 있습니다. 해당 데이터는 대기오염 배출사업장에 대한 환경감시 체계 구축, 정책 대상지 선정, 민간 환경 리스크 평가 등 다양한 분야에서 활용될 수 있는 환경감시 데이터입니다.※「대기환경보전법」시행령 별표3, 「수도권 대기환경개선에 관한 특별법」별표 2의2굴뚝자동측정기기는 7개 항목(먼지, 질소산화물, 황산화물, 염화수소, 일산화탄소, 불화수소, 암모니아)의 오염물질을 측정합니다.※ 배출농도 및 배출량 산정을 위해 오염물질 이외의 온도, 산소, 유량도 별도로 측정'
