description_portal: 잔류성오염물질(POPs, Persistent Organic Pollutants)은 독성, 잔류성, 생물농축성 및 장거리 이동성 등의 특성을 지니고 있어 사람과 생태계를 위태롭게 물질로서 다이옥신 등 '잔류성오염물질에 관한 스톡홀름협약'에서 정하는 물질을 말합니다.- 전국 환경매질(환경대기·토양·수질·퇴적물)에 대한 잔류성오염물질의 오염실태 및 추세를 종합적으로 파악하여 잔류성오염물질 정책수립 및 스톡홀름협약 국가이행계획서 작성 등에 활용하고 있습니다.- 다이옥신은 염소를 함유한 유기화합물이 연소할 때 생성될 수 있으며, 주로 쓰레기를 소각할 때발생합니다. 극성이 없어 물에 잘 녹지 않으며, 지방에 잘 녹기 때문에 인체에 유입되면 배설되지 않고 축적되는 경향을 보입니다.
