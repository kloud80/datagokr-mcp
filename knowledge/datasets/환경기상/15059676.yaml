status: active
summary_user: 전국 잔류성유기오염물질 측정망 지점별로 다이옥신·퓨란(PCDD/Fs) 이성질체 17종과 코플라나 PCB 12종의 농도를 독성등가량(pg I-TEQ/g) 단위 원자료로 담고, 각 그룹 합계값도 함께 싣는다. 연구자나 정책 분석가가 "어느 지역·매질 구분의 측정지점에서 다이옥신 독성등가 농도가 높게 나타나는가"를 비교하는 데 쓴다. 전역 조인 키가 없어 지역·지점 이름을 직접 맞추거나 같은 기관의 다른 측정망 자료와 이름 매핑으로만 이어 쓴다.
limits: 표준 행정코드나 지점 코드 같은 공통 키가 없어 다른 데이터와 자동으로 결합하기 어렵다. 범위는 전국이지만 좌표가 없는 비공간 자료라 지도 분석에는 지점명을 따로 위치로 바꾸는 작업이 필요하다.
