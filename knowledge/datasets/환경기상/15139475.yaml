summary_user: 기상청이 발표하는 중기예보(예보일로부터 5~11일 뒤)를 TXT 형태로 담은 외부 API로, 범위는 전국이며 5~8일은 오전·오후, 9~11일은 일 단위로 예보한다. 다음 주 주말 날씨가 궂을지 미리 보려는 국민이나, 일주일 이상 앞선 기상을 보고 행사·작업 일정을 정하려는 사업자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 예보구역 이름·코드 매핑이나 같은 기상청 코드로만 연결하며, 단기예보 격자(nx, ny)와는 직접 맞물리지 않는다.
