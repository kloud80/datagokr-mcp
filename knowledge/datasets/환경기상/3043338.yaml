description_portal: 바람장미는 관측지점의 어느 기간에 대하여 각 방위별 풍향 출현 빈도를 방사 모양의 그래프에 나타낸 것으로, 출현빈도의 백분율(%)을 각각의 풍향에 대응하는 방위판 위에 방위선의 길이로 나타냅니다.단, 고요(Calm, 풍속 0.4m/s 이하)의 출현빈도는 그래프의 중심에 표시합니다.막대는 바람이 불어오는 방향을 나타내며, 각 풍향의 풍속 계급별 빈도도 함께 나타냅니다.* 매 정시 시간자료를 기준으로 생성* 계급의 구분 기준은 보퍼트 풍력계급표의 2단계(~3.3), 3-4단계(3.4~7.9), 5-6단계(8.0~13.8), 7단계(13.9~) 참고* 기상월보에서는 한달동안의 시간별 바람자료를 사용하여 표현
