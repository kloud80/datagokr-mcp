summary_user: 대전광역시 대덕구 관할에 설치된 폐형광등·폐건전지 분리수거함을 설치 지점 한 곳당 한 행으로 담은 파일로, 행정동·주소·설치 위치·시설 구분·보유 수량을 기록한다. 대덕구 주민이 "우리 동네에서 다 쓴 형광등이나 건전지를 어디에 버리면 되나"를 찾거나, 분석가가 행정동별 수거함 배치와 수량을 비교하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 주소 문자열로 다른 대덕구·대전시 생활폐기물 배출 지점 데이터(종량제 판매소, 재활용 정거장 등)와 맞춰 쓴다.
description_portal: 본 데이터는 대전광역시 대덕구 관할 지역 내에 설치된 폐형광등 및 폐건전지 분리수거함의 위치 및 현황을 체계적으로 기록한 공공데이터입니다. 주요 항목으로는 행정동 단위의 구분, 해당 시설의 정확한 주소, 수거함이 설치된 구체적 위치, 지역구분(시설구분), 그리고 보유하고 있는 수거함의 수량이 포함되어 있습니다. 이를 통해 주민들은 생활폐기물 중 유해성이 있는 폐형광등과 폐건전지를 안전하게 배출할 수 있으며, 행정기관은 수거함의 관리 및 운영 현황을 효율적으로 파악할 수 있습니다. 해당 데이터는 지역 내 자원순환 체계의 개선과 환경보호를 위한 기초 자료로 활용될 수 있습니다.
