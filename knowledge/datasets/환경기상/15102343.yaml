summary_user: 과천시에 설치된 미세먼지 신호등 시설을 한 기기당 한 행으로 담은 목록 파일로, 설치주소·위경도·설치연도·크기·표출부개수·운영시간·표출내용을 담는다(파일 크기 733바이트의 소규모 목록). 시민이나 분석가가 '우리 동네 근처 어디에 미세먼지 신호등이 있고 몇 시에 켜지는가'를 확인하거나 신호등 설치 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭해 이어 쓰며, 신호등이 참조하는 문원동·과천동 측정망의 실시간 미세먼지 농도 데이터와 측정소 이름으로 연결한다.
limits: 이 파일은 신호등 시설 현황이고 실시간 미세먼지·초미세먼지 농도 값은 들어 있지 않으므로 대기질 수치는 별도 측정망 데이터에서 받아야 한다. 측정소코드 같은 공통 키가 없어 이름·주소 매핑으로만 연결된다.
