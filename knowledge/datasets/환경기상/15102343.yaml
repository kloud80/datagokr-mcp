description_portal: 과천시에 설치된 미세먼지 신호등에 대한 데이터현황입니다. 미세먼지 농도를 실시간으로 알려주는 미세먼지 신호등의 설치주소, 설치연도, 표출부개수, 운영시간 등의 항목을 제공합니다.미세먼지 신호등은 대기환경 측정망(문원동, 과천동) 중 가까운 측정망의  미세먼지(PM10), 초미세먼지(PM2.5)의 정보를 실시간으로 전송하여 색상(파랑~빨강)으로 시각화한 정보를 제공합니다.이 데이터는 시민들이 대기질 상태를 직관적으로 이해하고, 마스크 착용이나 외출 자제 등 건강 보호 행동을 취할 수 있도록 돕습니다.
