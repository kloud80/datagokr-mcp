description_portal: 창원시 특정토양오염대상시설 현황로서 주유소,  산업시설, 기타시설, 유독물 등 특정토양오염관리대상시설의 현화을  나타냅니다토양오염우려기준 초과 가능성이 있거나 오염 방지·관리가 필요한 사업장 및 시설의 위치와 현황을 정리한 자료입니다. 이 자료는 오염물질 배출원, 시설별 관리 책임 주체, 오염도 조사 이력 등을 바탕으로 토양보전 정책, 환경 점검, 민원·규제 대응 등에 활용될 수 있습니다.본 데이터는 다수의 시설 정보를 포함하고 있어 일반 뷰어(엑셀, 문서 뷰어 등)로 전부 확인되지 않을 수 있으므로 GIS, R, Python 등 분석 전용 도구 사용을 권장합니다.시설 분류 기준, 조사 주기, 오염물질 항목, 기준 초과 여부 등 세부 정보는 제공기관의 메타데이터 또는 기술문서를 참고해 주세요.
