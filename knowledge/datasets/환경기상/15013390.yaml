summary_user: 창원시 안의 특정토양오염관리대상시설(주유소·산업시설·유독물 취급시설 등)을 시설 한 곳당 한 행으로 담은 목록 파일로, 구분·업소명·도로명 주소가 들어 있다. 사업자나 토지 매수 검토자가 특정 부지 주변에 토양오염 관리 대상 시설이 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소를 지오코딩하거나 업소명으로 맞춰 붙여 쓰고, 필지 단위 환경 규제 레이어(상수원보호구역·생태자연도 등)와 겹쳐 본다.
