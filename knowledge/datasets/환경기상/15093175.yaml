description_portal: 이 테이블은 한국환경공단의 층간소음 이웃사이센터를 통해 접수된 온라인 현장진단 신청 건수를 지역별로 집계한 통계 자료입니다. 각 건수는 신청자의 주소지를 기준으로 하여 전국 17개 광역시·도 단위로 분류되며, 표에는 서울, 인천, 경기, 부산, 대구, 울산, 대전, 광주, 그리고 그 외 지역을 포함하는 ‘기타’ 항목으로 구분되어 있습니다.테이블에는 연도별 데이터가 포함되어 있어, 특정 시기별로 각 지역에서 접수된 온라인 현장진단 신청 건수의 변화 추이를 확인할 수 있습니다. 온라인 신청 건수는 층간소음 문제를 직접 체감한 주민들이 이웃사이센터를 통해 요청한 진단 서비스의 수치를 의미하며, 실제 층간소음 민원 발생의 규모나 집중도를 간접적으로 반영합니다.
