summary_user: 부산 연제구 관내에 신고된 특정토양오염관리대상시설(석유류·유해화학물질 제조·저장시설 등)을 시설 한 곳당 한 행으로 담은 현황 파일로, 상호·도로명 소재지·대표자·연락처·설치일자를 기록한다. 주민이나 부동산·개발 사업자가 "이 동네나 필지 주변에 주유소 같은 토양오염 우려 시설이 있는가"를 확인하거나, 환경 공간 규제 레이어로 입지 검토에 참고하는 데 쓴다. 전역 조인 키가 없어 도로명 소재지를 주소·좌표로 변환하거나 상호 이름을 맞춰 다른 사업장·토지 데이터와 연결해야 한다.
description_portal: 토양환경보전법 제2조의 4에서 정의하고 있는 특정토양오염관리대상시설은 토양을 현저하게 오염시킬 우려가 있는 토양오염관리대상시설로서 환경부령으로 정하는 것을 말하며, 1. 석유류의 제조 및 저장시설, 2. 유해화학물질의 제조 및 저장시설, 3. 송유관시설, 4. 기타 위 관리대상시설과 유사한 시설로서 특별히 관리할 필요가 있다고 인정되어 환경부장관이 관계중앙행정기관의 장과 협의하여 고시하는 시설입니다.해당 데이터는 관내 신고된  특정토양오염관리대상시설 신고 현황입니다.
