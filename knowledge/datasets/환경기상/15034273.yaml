summary_user: 울산광역시 중구에서 음식물쓰레기를 다량으로 배출하는 사업장을 사업장 한 곳당 한 행으로 담은 건별 명부로, 구분·사업자명·주소·전화번호·데이터기준일을 제공하는 작은 CSV 파일(약 5.7KB)이다. 중구 구청 담당자나 음식물류 폐기물 수집·재활용 사업자가 '중구에서 음식물쓰레기 다량배출 신고 대상인 사업장은 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호 컬럼이 없어, 다른 데이터와는 사업자명·주소를 맞춰 보는 방식으로만 연결한다.
description_portal: '울산광역시 중구 다량배출사업장 현황입니다 이 데이터는 구분,다량배출사업자명,주소,전화번호,데이터기준일을 제공합니다다량배출사업장이란? 음식물쓰레기를 다량으로 배출하는 사업장으로서 음식물류 폐기물의 발생 억제와 적정한 처리를 위하여 노력하고 법적 준수사항을 지켜야 하는 사업장입니다.다량배출사업장 음식물쓰레기 처리방법으로는 - 자가 처리·재활용 : 음식물쓰레기를 사업장 스스로 가열·발효 등에 의한 건조에 의하여 사료·퇴비 등으로 재활용- 위탁 재활용 : 음식물쓰레기를 폐기물처리시설 설치·운영자, 폐기물 수집·운반업의 허가를 받은 자, 폐기물 재활용업의 허가를 받은 자, 음식물류 폐기물처리 신고자에게 위탁하여 재활용'
