summary_user: 충청북도 수질측정망에서 운영하는 조사지점의 현황을 지점 단위로 담으며, 수계(WRSSM), 지점 명칭, 지점 번호, 조사 지점 위치, 구분을 제공한다. 충북 지역 하천·호소 등의 수질이 어디에서 측정되는지, 특정 수계에 조사지점이 몇 곳 어떻게 배치돼 있는지를 확인하려는 분석가·행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소 단위 수질 측정값 등 다른 데이터와는 지점 명칭·지점 번호를 이름이나 코드로 직접 맞춰 연결해야 한다.
limits: 조사지점의 위치와 구분만 담고 수질 측정값 자체는 없으므로 수질 농도나 추이는 별도 측정 결과 데이터가 필요하다. 표준 행정코드나 공통 지점 코드가 없어 타 기관 데이터와의 연결은 이름 매핑에 의존한다. 호출에는 포털 활용신청(자동승인) 후 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
