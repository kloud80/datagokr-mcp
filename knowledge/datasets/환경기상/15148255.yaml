description_portal: 이 데이터는 경상남도 보건환경연구원이 수행한 대기 중 중금속 측정 결과입니다. (경상남도 거제시) 2025년 6월 9일 00시부터 6월 13일 24시까지, 5일간 24시간 간격으로 시료를 채취하였습니다. 측정 대상은 납(Pb), 카드뮴(Cd), 비소(As), 니켈(Ni) 등 주요 유해 중금속이며, 분석된 결과는 대기 중 중금속 오염 수준을 파악하기 위한 기초 자료로 활용됩니다.본 자료는 지역 대기질 평가와 환경 정책 수립에 필요한 과학적 근거를 제공할 수 있고, 환경 건강 보호를 위한 공공데이터로서 연구 및 행정적 활용이 가능합니다.
