description_portal: 본 데이터는 연천군 관내 종량제봉투 판매소에 대한 정보를 제공한다.(위치, 전화번호, 판매 종류 등) 연천군 주민이 종량제봉투를 구매할 수 있는 판매소의 위치 및 운영 여부를 포함하고 있으며, 연천군 관내 생활폐기물 배출을 위한 필수 정보를 제공한다. 해당 데이터는 연천군 관내 주민의 생활 편의 및 공공생활편의를 증진하고 생활폐기물 및 종량제 제도의 원활한 운영을 지원하는 것을 목적으로 한다. 또한 연천군 관내 주민의 환경 정책 이해를 돕고, 생활환경 개선을 위한 기초자료로 활용 및 사용 가능하다.
