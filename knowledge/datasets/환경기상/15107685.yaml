summary_user: 연천군 관내 종량제봉투 판매소를 한 곳씩 담은 목록으로, 판매소명·읍면·도로명·지번 주소·위도·경도와 관리기관 전화번호를 포함한다. 연천군 주민이 집 근처 어느 가게에서 종량제봉투를 살 수 있는지 찾거나, 분석가가 읍면별 판매소 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 시군구·읍면 이름으로 맞춰 이어 쓰며, 다른 지자체의 종량제 판매소 파일과 같은 항목끼리 합쳐 쓴다.
