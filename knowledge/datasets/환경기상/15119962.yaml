summary_user: 서울 성동구에서 대기·실내공기·악취·수질·소음진동·빛공해 측정을 대행하는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·휴폐업일·영업상태·소재지 주소·좌표·실험실 정보가 들어 있다. 사업자나 시민이 성동구에서 현재 영업 중인 환경측정대행업체를 찾거나, 분석가가 업체의 개업·폐업 이력을 볼 때 쓴다. 전역 조인 키는 없으므로 다른 자치구의 같은 업종 인허가 데이터와는 개방자치단체코드·관리번호 체계로, 다른 데이터와는 사업장명·주소·좌표 매칭으로 잇는다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 대기오염물질, 다중이용시설 등 실내공간의 오염물질, 악취, 수질오염물질, 소음·진동, 인공조명에 의한 빛 공해와 같은 다양한 환경오염 항목의 측정업무를 대행하는 업소 정보를 제공하기 위해 구축되었습니다. 현대 도시 환경에서 대기, 실내공기, 수질, 소음·진동, 빛 공해 등 환경오염의 측정과 정밀 평가의 중요성이 날로 높아지고 있으며, 본 데이터는 각종 오염물질 측정을 담당하는 전문업소의 행정 현황을 투명하게 관리하기 위해 수집됩니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어, 업소별 인허가 이력과 영업 상태, 행정적 변동사항을 체계적으로 파악할 수 있습니다. 데이터는 성동구청 등 관할 행정기관의 정기적 점검과 관리를 바탕으로 최신성과 신뢰성을 확보하고 있습니다. 환경오염 모니터링, 정책 수립, 업체 선정, 연구, 시민 정보제공 등 다양한 분야에 활용될 수 있습니다.
