description_portal: 본 데이터는 토양·지하수 오염 방지를 위한 기술개발사업의 과제 현황을 제 공하는 자료로, 사업명, 단위사업, 중분야, 과제명, 주관기관, 주관책임자 및 연구상태(종료 여부) 등 세부적인 정보를 담고 있습니다. DNAPL 오염부지 정화기술, 토양정화장치 개발기술, 오염물질 모니터링 기법, 유류 및 중금속 오염 위해성 평가기술 등 다양한 과제 내용을 제공하여 각 기술의 개 발 성과와 기술의 적용 가능성을 파악할 수 있습니다. 토양지하수 분야 기술적 현황 파악, 연구성과 분석, 신규기술 개발 방향 수립, 환경정화기술 연구 평가 및 환경기술정책 수립 등에 실질적인 참 고자료로 활용 가능합니다.
