summary_user: 창원시 5개 구(의창·성산·마산합포·마산회원·진해)의 음식물류폐기물 수거용기 판매소를 판매소 1곳당 1행으로 담은 목록 파일로, 구·읍면동·업체명·소재지·전화번호가 들어 있다. 창원 주민이 우리 동네에서 음식물 수거용기를 어디서 사는지 찾거나, 분석가가 구·읍면동별 판매소 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 구·읍면동 이름을 매핑하거나 소재지 주소를 지오코딩해 이어 써야 한다.
description_portal: 음식물류폐기물 수거 용기판매소 현황(의창구, 성산구, 마산합포구, 마산회원구, 진해구)을 제공합니다. 항목은 해당구, 업체명, 소재지, 전화번호입니다.음식물수거용기 판매소 현황 데이터는 공공장소 또는 지정된 상점에서 음식물 수거용기를 판매 또는 배포하는 판매소의 위치, 운영 주체, 판매용기 종류 및 수거 규격, 영업시간, 관리 상태 등을 종합적으로 정리한 자료입니다. 이 데이터는 지역 내 배출 인프라 분포와 접근성 분석, 주민 참여 기반 자원순환 정책 수립, 판매소 운영 효율 평가, 민원 대응 및 홍보 전략 설계, 공간 기반 수거 정책 강화 등에 활용되며 GIS 기반 시각화와 연계할 경우 정책 시범 구역 설정이나 운영 밀도 비교 등에 유용한 기초자료로 기능할 수 있습니다.
