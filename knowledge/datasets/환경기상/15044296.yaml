description_portal: 해양환경공단이 수행한 해양폐기물 정화사업의 추진 현황 정보를 제공합니다. 본 데이터는 연안, 항만, 도서지역 등에서 실시된 다양한 해양폐기물 정화사업의 연도별 추진 실적, 대상 지역, 수거량, 사업유형, 사업 주체 등을 종합적으로 정리한 자료입니다. 주요 정화사업에는 침적쓰레기 수거, 해양부유쓰레기 처리, 민간참여형 정화사업, 지자체 협력사업 등이 포함되며, 정화방식과 수행 결과도 함께 포함되어 있습니다. 본 자료는 해양폐기물 저감 정책 수립, 지자체별 환경관리 성과 평가, 예산 편성, 정화 우선지역 선정, 정책 성과보고 등에 활용됩니다. 데이터는 표 및 보고서 형태로 제공되며, 해양환경 개선을 위한 정책 수립과 행정 실무에 기초자료로 활용됩니다. ※ 해당 자료에 대한 물량에 대한 단위는 "ton"이고, 면적에 대한 단위는"ha"입니다.
