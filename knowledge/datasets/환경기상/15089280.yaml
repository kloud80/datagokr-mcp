description_portal: 경기도 양주시가 제공하는 ‘소규모 사업장 방지시설 설치 지원사업 현황’ 데이터는 소규모 사업장의 대기오염물질 배출을 줄이기 위해 방지시설을 설치·교체한 사업장 현황을 제공하는 자료입니다. 업체명, 사업장소재지, 업종, 종별, 배출 오염물질, 기존 방지시설 종류, 기존 방지시설 용량, 기존 방지시설 설치년도, 신규 방지시설 종류, 신규 방지시설 용량, 신규 방지시설 설치년도 등의 정보를 통해 사업장별 방지시설 설치 및 교체 현황을 확인할 수 있습니다.또한 교체전·교체후 총부유분진(TSP), 황산화물(SOx), 질소산화물(NOx), 총탄화수소(THC) 및 기타농도와 저감 효율 정보를 제공하여 방지시설 교체에 따른 대기오염물질 농도 변화를 확인할 수 있으며, 사물인터넷(IoT)설치현황, 신청일, 선정일, 관리기관, 데이터기준일자 등의 정보를 포함하고 있습니다.사업장별 대기오염물질 배출 및 방지시설 현황을 파악하고, 방지시설 설치·교체에 따른 오염물질 저감 효과를 확인하는 데 활용할 수 있습니다. 또한 대기환경 관리, 소규모 사업장 환경관리, 대기오염 저감, 환경오염 예방 및 지속가능한 지역 환경관리 등과 관련된 정책 및 연구 자료로 활용할 수 있습니다.
