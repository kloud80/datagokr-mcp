description_portal: 실제 기온보다 더 춥게 느끼는 이유는 풍속, 습도, 일사와 같은 기상 요인, 그리고 옷차림이나 환경, 개인차에 따라 달라지게 됩니다. 이렇듯 같은 온도라도 바람이 많이 불수록 노출이 많이 될수록 체감하는 온도는 낮아집니다.체감온도란 겨울철 외부의 바람과 한기에 노출된 피부가 열을 빼앗길 때 느끼는 추위 정도를 예측한 지수로, 5~9월 기간 제공됩니다.체감온도는 지수가 (위험) -15.4 미만, (경고) -15.4 이상 -10.5 미만, (주의) -10.5 이상 -3.2 미만, (관심) -3.2이상으로 4단계로 구분하여 제공하고 있습니다.
