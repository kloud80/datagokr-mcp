summary_user: 광진구에서 종량제봉투 판매 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 건별 인허가 원천 데이터로, 업소명·주소·인허가일자·영업상태(영업/폐업·휴업 등)·중부원점TM 좌표를 포함한다. 주민이 '우리 동네에서 종량제봉투를 파는 가게가 어디인가'를 찾거나, 구청·분석가가 판매소 분포와 폐업 현황을 점검하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소(지번·도로명)나 업소명 매칭, 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 다른 자치구의 같은 종류 파일과 합칠 때도 이 방식을 쓴다.
description_portal: 서울특별시 광진구_쓰레기종량제봉투판매업 인허가 정보는 광진구 내에서 폐기물 배출 시 사용하는 종량제봉투를 판매할 수 있도록 인허가를 받은 업소에 대한 정보를 제공하는 공공데이터입니다. 종량제봉투는 「폐기물관리법」 및 시군구 조례에 따라 규격과 판매처가 정해지며, 이를 취급하는 지정 업소에서만 구매가 가능합니다. 이 데이터에는 업소명, 소재지, 인허가일자 등 업소의 기본 정보와 함께 판매 허가 여부 및 현황이 포함됩니다. 해당 데이터는 중부원점TM(EPSG:2097) 기준의 좌표 정보를 포함하고 있으나, 위경도 좌표는 별도로 제공되지 않습니다. 데이터는 최신 기준으로부터 약 3일 전 시점을 반영하며, 광진구 지역 내 생활폐기물 처리, 환경 행정 및 판매망 관리 등 다양한 활용이 가능합니다.
