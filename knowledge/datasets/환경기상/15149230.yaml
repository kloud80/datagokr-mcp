description_portal: '이 데이터는 국립호남권생물자원관에서 확보한 생물종의 DNA 바코드 정보를 체계적으로 정리한 것입니다. 각 레코드는 연번, 유전자원번호, DNA 번호 등 고유 식별자를 통해 관리되며, 분석에 사용된 프라이머세트 명과 마커명, 국제표준화번호(KTSN) 등 실험적 메타데이터를 포함합니다. 또한 학명과 국명을 통해 생물학적 동정 정보를 제공하고, 염기서열 항목을 통해 실제 DNA 바코드 데이터가 공개됩니다. 데이터유형은 염기서열의 성격(예: 핵산, 미토콘드리아, 클로로플라스트 등)을 구분하여 명시합니다. 이를 통해 연구자와 산업계는 특정 종의 분류·동정, 생물다양성 연구, 환경 모니터링, 신품종 개발 등에 활용할 수 있습니다. 특히 DNA 바코드 기반 종 식별은 생물자원의 정확한 보존 및 관리뿐만 아니라, 공공데이터 개방을 통한 학술적·산업적 가치 창출에도 기여할 수 있습니다.'
