description_portal: '서울특별시 금천구 관내 가정내불용의약품 처리현황 데이터입니다. 연도별 수거장소, 수거량(kg), 폐기방법 등의 항목을 제공하고 있습니다.혹시 집에 사용하지 않는 의약품이 쌓여 있지는 않으신가요? 하지만 유효기간이 지난 약이나 맞지 않는 약들을 그냥 버리면 환경에 좋지 않기 때문에, 구청에서는 가정에서 사용하지 않는 의약품을 수거하여 안전하게 폐기하는 서비스를 제공하고 있습니다. 집에 불용 의약품이 있다면 구청이나 주민센터에 연락하여 수거를 요청하시면 됩니다. 수거된 의약품은 전문적인 절차를 통해 환경에 해가 가지 않도록 안전하게 처리됩니다.이 서비스는 모두 무료로 제공되므로, 집에 쌓여 있는 의약품을 걱정하지 마시고 구청 또는 주민센터에 문의하여 안전하게 처리하실 수 있습니다. 약을 안전하게 처리하고 환경도 지키는 방법, 지금 바로 확인해 보시기 바랍니다. (담당부서 : 금천구 청소행정과)'
