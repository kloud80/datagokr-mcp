summary_user: 아산시 관내 석면조사 대상 건축물을 건물 한 곳당 한 행으로 담은 파일로, 구분·건축물명(상호)·동명·주소·석면건축물 여부·안전관리인 지정 여부·연면적·석면 자재 면적·제외 현황을 담고 범위는 아산시 한 개 시군구다. 시민이 우리 동네나 자주 가는 건물이 석면건축물인지, 안전관리인이 지정돼 있는지 확인하거나, 분석가가 동별 석면건축물 분포와 석면 자재 면적 규모를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 건축물명을 문자열로 맞추거나 동명 단위로 묶어 이어 써야 한다.
description_portal: ‘충청남도 아산시 석면조사 대상건축물현황’ 데이터는 시민의 건강 보호와 안전한 생활환경 조성을 위해 아산시 관내 석면 사용 가능성이 있는 건축물을 공개하는 공공데이터이다. 본 자료에는 구분, 건축물명(상호), 동명, 주소, 석면건축물여부, 안전관리인지정여부, 연면적, 석면(자재)면적, 데이터 기준일자 등 주요 정보가 포함되어 있으며, 석면관리법에 따른 조사·관리 대상 건축물 현황을 체계적으로 제공한다. 아산시는 건축물의 노후화 및 석면 잔존 위험을 고려해 해당 자료를 정기적으로 점검·갱신하고 있으며, 시민은 공공데이터포털을 통해 안전 관련 정보를 신속하게 확인할 수 있다. 이 데이터는 지역 내 석면 위해요소 파악, 환경보건 정책 수립, 생활안전 강화에 중요한 기초자료로 활용된다.
