summary_user: 대구광역시 북구에 설치된 재활용품(투명페트병) 무인 회수기를 한 대·한 장소 단위로 담은 파일로, 장소명·주소·위도·경도와 운영개시일자·수거주기·운영시간·투입개수 제한·관리부서를 함께 싣는다. 북구 주민이 집 근처에서 페트병을 넣을 수 있는 회수기가 어디 있고 몇 시까지 몇 개까지 받는지 확인하거나, 분석가가 회수기 배치 현황을 지도에 올려 보는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나, 같은 기관의 다른 폐기물 배출 지점 파일과 이름으로 맞춰 이어 쓴다.
description_portal: 대구광역시 북구에 설치된 재활용품 무인 회수기에 대한 다음의 정보를 제공합니다. - 장소명 / 위치(주소) / 운영개시일자 / 수거주기 / 운영시간 / 투입개수 제한 / 관리부서 / 위도 / 경도 / 데이터기준일자이용편의를 위해 전용 애플리케이션(수퍼빈)에서도 위치, 기기상태 등 주요정보를 확인하실 수 있으며,유가보상 시스템을 활용하여 주민의 자발적 참여를 유도하기 위하여 2022년부터 2024년에 걸쳐 설치되었습니다.고품질 재활용 자원인 투명페트병 분리배출에 적극 참여하여 자원재활용에 협조해 주시기 바랍니다.
