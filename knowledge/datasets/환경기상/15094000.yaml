summary_user: 한국수자원공사가 소규모 수도시설의 호소수 원수를 대상으로 「먹는물 수질기준 및 검사 등에 관한 규칙」에 따라 실시한 법정 수질검사 결과를 측정지점·채수일자별 건별 행으로 담은 파일입니다(약 2KB 규모의 CSV, 포털 설명상 2024년 5월~2025년 3월 검사분). 우리 지역 소규모 수도의 호소 원수에서 카드뮴·비소·납·수은·시안 같은 유해물질이 기준 안에 있는지 확인하려는 주민이나 수원지 안전성을 점검하는 분석가가 쓴다. 전역 조인 키가 없어 측정지점주소나 취수장명·수도사업자 이름을 매핑해 행정구역 자료나 같은 기관의 다른 수질검사(정수·하천수 등) 자료와 이어 쓴다.
description_portal: 본 데이터는 한국수자원공사에서 소규모 수도시설의 원수에 대해 실시한 법정 수질검사 결과를 제공합니다. 검사는 "먹는물 수질기준 및 검사 등에 관한 규칙"에 따라 수행되며, 원수의 수질 적합 여부를 확인하기 위한 것입니다. 자료에는 정수장 유형, 권역, 검사일자, 항목명, 기준값, 측정값 등이 포함됩니다. 주요 항목은 일반세균, 탁도, 색도, 대장균군 등입니다. 본 자료는 2024년 5월부터 2025년 3월까지의 검사 결과를 포함하며, 수질 평가, 정수장 점검, 수원지 안전성 분석 등에 활용됩니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData
