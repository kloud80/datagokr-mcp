description_portal: 대전광역시 시군구 생활 폐기물 관리 예산 자료는 2021년을 기준으로 대전시 관내 각 자치구 별 생활 폐기물 발생량, 처리 방식, 그리고 해당 폐기물 관리에 소요된 예산 현황을 집계한 데이터입니다. 이 자료는 수거, 운반, 소각, 매립 등 폐기물 처리 전 과정에 투입된 예산 규모와 운영 실적을 분석할 수 있도록 구성되어 있으며, 시군구 간 발생량과 예산 투입의 상관 관계 분석, 자원 효율성 비교, 사업 운영의 투명성 확보 등에 활용됩니다. 또한 이 자료는 생활 폐기물 감축, 재활용 률 향상, 자원 순환 사회 전환을 위한 기초 자료로서, 예산 집행의 적정성 판단 및 중장기 폐기물 관리 사업 계획 수립에 유용합니다. 본 자료는 2022년 공공데이터 기업매칭지원사업으로 수행되었습니다.
