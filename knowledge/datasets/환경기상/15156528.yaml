description_portal: 강릉관광개발공사 온실가스 감축실적 데이터는 공사가 추진한 온실가스 감축 활동의 성과를 연도별로 정리한 자료로, 기준배출량 대비 실제 온실가스 배출량과 감축률을 체계적으로 제공합니다. 본 데이터는 연도, 기준배출량, 온실가스 배출량, 감축률, 기준일자 항목으로 구성되어 있으며, 공사의 환경경영 추진 현황과 감축 성과를 객관적으로 확인할 수 있습니다.이 데이터는 공공기관으로서의 기후변화 대응 노력과 환경경영 성과를 투명하게 공개하는 데 목적이 있으며, 온실가스 감축 정책 수립, 친환경 사업 추진 성과 분석, 지속가능경영 평가를 위한 기초자료로 활용될 수 있습니다. 또한 시민과 이해관계자가 강릉관광개발공사의 환경 보호 실천 수준을 쉽게 이해하고 비교할 수 있도록 지원합니다.
