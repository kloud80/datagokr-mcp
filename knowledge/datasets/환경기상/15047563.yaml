summary_user: 경기도 군포시 관내 종량제봉투·대형폐기물 스티커 판매소를 한 곳씩 담은 건별 목록으로, 행정동·상호명·전화번호·소재지주소를 제공한다. 군포시 주민이 '우리 동네에서 종량제봉투나 대형폐기물 스티커를 어디서 살 수 있나'를 찾거나, 분석가가 행정동별 판매소 분포를 살피는 데 쓴다. 전역 조인 키는 없어 행정동 이름이나 소재지주소를 매개로 다른 군포시 생활폐기물 배출·수거 지점 자료와 맞춰 쓴다.
description_portal: 경기도 군포시 관내 종량제봉투 및 대형폐기물 스티커 등 판매소 현황으로 소재지 행정동, 상호명, 전화번호, 소재지주소 항목을 제공합니다.종량제봉투는 일반용, 사업장용, 재사용, 음식물전용 총 4종류가 있습니다.일반용종량제봉투는 1리터, 3리터, 5리터, 10리터, 20리터, 50리터, 75리터 총 7종류가 있습니다.사업장용종량제봉투는 50리터와 75리터가 있습니다.재사용종량제봉투는 5리터, 10리터, 20리터 총 3종류가 있습니다.음식물전용종량제봉투는 1리터, 2리터, 5리터, 10리터, 20리터 총 5종류가 있습니다.대형폐기물 스티커는 2천원권, 3천원권, 5천원권, 만원권 총 4종류가 있습니다.불연성마대는 10리터와 20리터 2종류가 있습니다.
