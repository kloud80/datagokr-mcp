summary_user: 대구광역시가 제공하는 수질통계를 연도(YR)와 항목 구분(FLTPL_ARTCL)별로 묶고, 1월부터 12월까지의 값을 월별 열로 펼친 집계표를 담습니다. 대구 지역 수질 항목이 한 해 동안 월별로 어떻게 달라지는지, 전년과 비교해 어떤지 보려는 분석가나 시민이 쓰는 데이터입니다. 실측 컬럼에 전역 조인 키가 없어서 다른 수질 측정망이나 하천·댐 수자원 데이터와는 연도와 항목 이름을 직접 맞춰 붙여야 합니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 대구광역시(지자체)에서 제공하는 수질통계에 대한 관련 정보입니다.\""
