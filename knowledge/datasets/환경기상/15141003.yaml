summary_user: 서울특별시 양천구에 인허가된 환경측정대행업체(대기·실내공기·악취·수질·소음진동·빛공해 측정을 대행하는 업소)를 사업장 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업·휴업 일자·주소·좌표·실험실 소재지와 면적을 포함한다. 사업자나 주민이 '양천구에서 지금 영업 중인 환경측정대행업체는 어디이고 실험실은 어디에 있는가'를 확인하거나, 분석가가 지역 내 측정대행업 개·폐업 현황을 파악하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하고, 좌표(XCRD·YCRD)는 지도 위 다른 오염원 사업장 자료와 겹쳐 보는 데 쓴다.
description_portal: '서울특별시 양천구에서는 지역 내 환경오염 수준을 정확하게 파악하고 체계적인 환경관리 정책을 수립하기 위하여 환경측정 업무를 수행하는 대행업체의 인허가 정보를 관리하고 있다. 본 데이터에는 사업자명,  주소, 전화번호, 인허가일자, 영업상태, 업태명, 실험실 주소 등의 항목이 포함되어 있다. 이를 통해 공정하고 신뢰성 있는 환경측정 서비스가 제공될 수 있도록 행정적 감독을 강화하고, 지역 환경품질 개선을 위한 기반자료를 확보하고자 한다. 이용자는 본 데이터를 통해 각 업체의 기술 역량, 장비 운영 능력, 규정 준수 현황을 명확히 확인할 수 있으며, 측정기관 선정 시 객관적 판단 근거를 마련할 수 있다. 또한 이 정보는 대기 및 수질 등 환경기초자료의 신뢰도 제고, 행정 점검 계획 수립, 민원 대응 지원 등 다양한 업무에 활용될 수 있으며, 공공서비스의 투명성과 정확성을 높이는 데 기여한다. 아울러 본 데이터는 최신성을 유지하여 환경 측정 체계의 안정적 운영과 지역 환경정책 추진을 위한 핵심 자료로 활용될 수 있도록 지속적으로 관리된다.*환경측정대행업 :  대기오염물질, 다중이용시설 등의 실내공간오염물질, 악취, 수질오염물질, 소음·진동 또는 인공조명에 의한 빛 공해의 측정업무를 대행하는 업소정보'
