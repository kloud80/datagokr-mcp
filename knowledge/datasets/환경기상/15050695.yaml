description_portal: 세계 여러나라에서 관측한 고층 관측자료를 국제적 규정에 따라 교환한 기상 전문(GTS)을 해독한 자료입니다. 요소로는 기온, 풍향, 풍속, 기압, 고도, 이슬점온도 등이 있습니다.고층(레윈존데) 관측은 전 세계적으로 가장 널리 사용되는 고층기상관측 방법입니다. 라디오존데 관측과 같이 라디오존데를 기구에 매달아 비양시키고, 이 라디오존데는 상승하면서 일정한 시간 간격으로 기압(또는 고도), 기온, 상대습도(또는 이슬점온도)를 관측합니다. 이 관측 자료는 라디오존데의 무선송수신장치에 의해 지상으로 전송되고, 지상수신장치에서 수신 처리되어 고도별 기압(또는 고도), 기온, 상대습도(또는 이슬점온도) 등을 산출합니다.
