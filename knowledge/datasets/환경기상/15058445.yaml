summary_user: 경기도 내 음식물 폐기물 처리시설을 시설 한 곳당 한 행으로 담으며, 시군명·시설명·재활용 방법과 도로명·지번 주소, 우편번호, WGS84 위도·경도를 포함한다. 주민이나 분석가가 '우리 시군의 음식물 쓰레기는 어느 시설에서 어떤 방식(퇴비화·사료화 등)으로 처리되는가'를 확인하거나 시설의 지역 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 주소·좌표로 경기도의 다른 폐기물 시설·수거 지점 데이터와 이름 매칭이나 공간 결합으로 잇는다.
description_portal: 이 데이터는 경기도 내 음식물 폐기물 처리시설의 시군별 현황을 제공하며, 처리시설의 명칭, 소재지 주소(도로명 및 지번), 우편번호, 재활용 방법, 위치 좌표(WGS84 위도 및 경도) 등의 세부 정보를 포함하고 있습니다. 음식물 쓰레기의 적정한 처리와 자원 재활용을 위한 기반 자료로, 음식물 자원화 정책 수립, 처리시설 입지 분석, 환경영향평가 등의 목적으로 활용될 수 있습니다. 제공되는 위치정보는 공간정보 분석이 가능하게 하며, 행정구역별 폐기물 처리능력 파악 및 관련 설비의 지역적 분포를 분석하는 데에도 유용합니다. 연간 단위로 갱신되며, 공공데이터포털을 통해 Open API 방식으로 제공되어 실시간 접근이 가능합니다
