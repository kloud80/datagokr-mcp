description_portal: 해양경찰청 방제차량 현황도는 해양오염사고 현장 대응을 위해 운용 중인 방제차량의 연도별·기관별 보유 현황을 정리한 자료로, 차량 종류, 차종, 적재용량, 배치기관, 취득연도, 운용 상태 등의 기본 정보로 구성된 데이터입니다.일부 차량은 작전 및 보안 특성에 따라 세부 제원 또는 정확한 배치 위치 정보가 제한될 수 있으며, 노후도 및 운용 가능 여부는 해당 연도 기준으로 관리됩니다.파일 내 항목별 코드 및 분류 기준은 “방제차량 관리기준(내부지침)”을 참고해 주시기 바랍니다.데이터 건수가 많은 경우 엑셀에서 전체 표출이 제한될 수 있으므로, 분석 전용 소프트웨어를 활용한 조회를 권장합니다.
