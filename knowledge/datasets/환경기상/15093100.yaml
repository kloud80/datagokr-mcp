summary_user: 층간소음 이웃사이센터에 접수된 민원 중 2차 현장진단 대상 사례를, 신청자가 인지한 소음 발생 위치(위층·아래층·옆집·기타)별로 연도마다 접수 건수를 센 전국 단위 집계표입니다. 공동주택 관리자나 정책 분석가가 층간소음 민원이 주로 어느 방향의 이웃에서 비롯된다고 인식되는지, 그 비중이 해마다 어떻게 바뀌는지를 볼 때 쓴다. 전역 조인 키가 없어 다른 층간소음 통계와는 연도 기준으로만 나란히 놓고 비교한다.
limits: 지역 구분이 없는 전국·비공간 집계라 시도·단지별 분석에는 쓰지 못한다. 건별 원천이 아닌 연도별 건수표(약 319바이트 CSV)이고, 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 이름 매핑으로만 연결된다. 위치는 측정값이 아니라 신청자가 체감한 방향이며, 2차 현장진단 대상만 포함한다.
