description_portal: '이 테이블은 한국환경공단의 층간소음 이웃사이센터를 통해 접수된 민원 중, 2차 현장진단 대상으로 선정된 사례들을 기준으로 신청자가 인지한 소음 발생 위치에 따라 접수 건수를 분류한 자료입니다. 각 접수 건은 신청자가 생활 중 체감한 층간소음의 발생 위치(예: 위층, 아래층, 옆집 등)를 기준으로 분류되어 집계됩니다.표의 항목은 연도별로 구성되어 있으며, 각 연도에 따라 ‘위층’, ‘아래층’, ‘옆집’, ‘기타’로 구분된 소음 발생 위치별 접수 건수가 수록되어 있습니다. ‘위층’은 가장 대표적인 층간소음 발생 위치로서, 뛰거나 걷는 소리, 물건 끄는 소리 등 상부 구조체를 통해 전달되는 소음이 주로 해당됩니다. 반면, ‘아래층’은 천장 구조의 반사나 아래층의 진동이 상부로 전달되는 경우 등을 포함합니다.'
