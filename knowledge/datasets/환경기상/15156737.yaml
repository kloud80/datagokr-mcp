description_portal: 공사는 "배출권거래법"에 따라 매년 공사의 온실가가스 배출량을 산정하고 이것을 기후에너지환경부에 인증 받아야 할 의무가 있음. 이에 공사 내 온실가스 배출시설을 목록화하고, 각 배출시설별 에너지사용량(천연가스, 전기 등) 기반으로 온실가스 배출량을 산정하고 있음. 이렇게 산출된 배출량은 제3자 검증과 환경부 평가를 거쳐 최종 배출량이 확정됨. 이는 국가 온실가스 인벤토리에 포함되는 배출량이며, 국가 온실가스 감축목표(NDC) 달성을 위한 탄소중립 사업을 추진함에 있어, 공사의 온실가스 배출량에 대한 정보를 확인할 수 있음
