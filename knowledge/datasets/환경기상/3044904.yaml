summary_user: 남양주시 안의 기타수질오염원(점오염원·비점오염원으로 관리되지 않는 양식장, 병원 X선 시설, 사진 인화시설, 자동차공업사 등) 업소를 한 곳씩 담은 목록으로, 상호·소재지주소·데이터기준일만 담는다. 주민이나 분석가가 '우리 동네 어디에 기타수질오염원으로 신고된 업소가 있나'를 확인하거나 시 단위 오염원 분포를 주소로 대략 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지주소나 상호를 맞춰 붙이거나 같은 기관(남양주시) 단위로만 이어 쓴다.
description_portal: 남양주시 배출업소 중에서 기타 수질오염원에 대한 데이터로 상호, 주소, 데이터기준일의 항목을 제공합니다.물환경보전법 제1장 총칙 제2조(정의)“기타수질오염원”이란점오염원 및 비점오염원으로 관리되지 아니하는수질오염물질을 배출하는 시설 또는 장소로서환경부령으로 정하는 것을 말한다.기타수질오염원의 예로는 양식장, 병원(x-ray), 사진관(인화시설), 자동차공업사 등이 있습니다.  수질오염원은 3가지 종류가 있는데 점오염원, 비점오염원, 기타수질오염원으로 구분되며, 이중에서 기타수질오염원 정보를 제공합니다.
