description_portal: 본 데이터는 대구광역시 수성구 관내 석면조사를 실시하지 않은 건축물의 현황을 정리한 자료이다. 석면조사는 건축물 해체·철거 시 석면 유무를 사전 확인하여 주민 건강을 보호하는 법적 절차이다. 해당 데이터는 석면조사 대상임에도 불구하고 조사가 수행되지 않은 건축물을 수록한 것으로, 건축물명, 건축물주소 등이 포함되어 있다. 수성구의 석면 안전관리 실태 파악과 정책 수립의 기초자료로 활용되며, 행정기관의 실태 점검 및 법적 의무 이행 여부 확인에도 사용된다. 정기적 정보 갱신을 통해 데이터의 최신성과 신뢰도를 유지하고 있으며, 향후 건강 피해 예방 및 건축물 안전관리 강화를 위한 기반자료로 제공된다.
