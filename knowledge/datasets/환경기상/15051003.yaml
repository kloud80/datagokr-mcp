summary_user: '경기도 구리시 안에 있는 주유소·건설업 등 휘발성유기화합물(VOCs) 배출시설을 사업장 한 곳당 한 행으로 담은 현황 파일로, 상호·도로명/지번 소재지·업종·관리기관·인허가일자를 포함하며 CSV 크기는 약 3.5KB로 작다. 구리시 주민이나 분석가가 "우리 동네 근처에 VOCs 배출 신고 사업장이 어디에 있고 어떤 업종인가"를 확인하거나, 지자체 담당자가 오존·미세먼지 저감 점검 대상을 파악하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 소재지 주소를 지오코딩하거나 상호·업종 이름을 맞춰 붙여야 한다(예: 다른 배출시설·인허가 사업장 목록).'
description_portal: 주유소, 건설업 등 구리시 지역내에 위치한 환경오염물질배출시설(휘발성유기화합물)에 대한 현황정보를 제공합니다. (상호, 소재지(도로명), 소재지(지번) 등)휘발성유기화합물(VOCs) 배출업소의 현황 및 관리 정보를 제공하는 공공데이터로, 대기질 개선 정책과 연계됩니다.사업장 위치, 업종, 배출 특성 및 신고·관리 상태 등 **환경·사회·지배구조(ESG)** 관련 정보를 포함하고 있습니다.데이터 기반의 **스마트 환경행정**과 오존·미세먼지 저감을 위한 정책 수립 및 환경오염 관리에 활용됩니다.
