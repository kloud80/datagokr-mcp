description_portal: '광주광역시 동구 기타수질오염원설치신고현황입니다.※ 기타수질오염원 :점오염원 및 비점오염원으로 관리되지 아니하는 수질오염물질을 배출하는 시설 또는 장소로서 수산물 양식시설, 골프장, 운수장비ㆍ정비 또는 폐차장 시설, 농축수산물 단순 가공시설, 사진처리, X-Ray시설, 금은판매점의 세공시설 및 안경점 등을 말함※ 폐수배출시설 : 수질오염물질을 배출하는 시설물, 기계, 기구, 그 밖의 물체로서 환경부령으로 정하는 것을 말한다. 다만, 「해양환경관리법」 제2조제16호 및 제17호에 따른 선박 및 해양시설은 제외한다.'
