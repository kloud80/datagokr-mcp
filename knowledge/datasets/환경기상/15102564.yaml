summary_user: 인천광역시 부평구에 소재한 건설폐기물 처리업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·도로명 소재지주소·전화번호·처리대상 폐기물 종류·허가년도를 수록한다(파일 크기 약 5KB). 건설 현장 관계자나 사업자가 '부평구에서 특정 건설폐기물을 처리하는 업체는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 업체 입지와 허가연도별 운영 이력을 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업체명이나 소재지주소를 이름·주소 매칭하는 방식으로만 이어 쓴다.
limits: 처리업체 명단(원장)일 뿐 폐기물 발생량이나 처리 실적 통계는 담지 않는다. 범위가 부평구 한 곳에 한정되며, 사업자번호 같은 공통 식별 키가 없어 타 기관 데이터와 연결할 때 이름·주소 매칭 오류에 주의해야 한다.
