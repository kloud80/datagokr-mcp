description_portal: '건설폐기물 처리업체의 명칭, 소재지 주소, 전화번호, 처리 대상 폐기물, 허가연도 등을 수록한 데이터.건설 활동에서 발생하는 폐기물의 처리 현황을 파악하고, 재활용·안전 처리 관리, 환경 정책 수립, 건설 산업 관리 및 자원 순환 체계 마련 등에 활용 가능하다.활용 목적 및 특징– 건설폐기물 처리업 등록 현황 및 처리대상 폐기물 종류 분석– 업체 소재지 기반 입지 특성 및 관리 구역 파악– 허가연도를 통한 업체 운영 기간 및 관리 이력 확인– 환경 보호, 자원 순환, 건설 산업 관리 정책 자료 활용주요 항목 설명● 업체명: 등록된 건설폐기물 처리업체의 명칭● 소재지주소: 업체가 위치한 도로명 주소● 전화번호: 업체의 공식 연락처● 처리대상 폐기물: 업체가 처리하는 폐기물의 종류● 허가년도: 업체가 허가를 받아 영업을 시작한 연도'
