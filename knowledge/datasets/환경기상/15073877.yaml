summary_user: 에어코리아 대기질 측정소의 이름, 주소, 좌표, 측정망 종류, 측정항목, 설치년도를 측정소 한 곳당 한 행으로 담는 전국 목록이며, API 기준 전체 672건이다. 내 집이나 사업장에서 가장 가까운 대기질 측정소가 어디이고 어떤 오염물질을 재는지 알고 싶은 국민이나, 측정소별 대기질을 지역에 매핑하려는 분석가가 쓴다. 측정소 주소(addr)를 주소 키로 행정구역·주소 기반 데이터와 잇고, 측정소명(stationName)과 좌표로 에어코리아 시간별 대기질·경보 데이터에 연결해 쓴다.
description_portal: 해당 API기능은 대기질 측정소 정보를 조회하기 위한 서비스로 TM 좌표기반의 가까운 측정소 및 측정소 목록과 측정소의 정보를 조회할 수 있다. 측정소정보 조회 OpenAPI 내 상세 기능은 측정소 목록 조회, 근접측정소 목록 조회, TM 기준좌표 조회로 이루어져 있습니다. 각 기능별 정보와 요청변수, 응답메세지에 대한 설명은 OpenAPI 기술문서를 참고하셔서 이용하시길 바랍니다. ※ 운영계정으로 사용하고자 할 경우 "한국환경공단 에어코리아 OpenAPI 기술문서" 내 신청 가이드 참고
team:
  dept: 대기환경처 대기정책지원부
services:
  - op: /getMsrstnList
    name: 측정소 목록 조회
    endpoint: https://apis.data.go.kr/B552584/MsrstnInfoInqireSvc/getMsrstnList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: returnType
        required: false
        example: xml
        desc: 데이터표출방식
      - name: numOfRows
        required: false
        example: '100'
        desc: 한 페이지 결과 수
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지 번호
      - name: addr
        required: false
        example: 서울
        desc: 주소
      - name: stationName
        required: false
        example: 종로구
        desc: 측정소명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
