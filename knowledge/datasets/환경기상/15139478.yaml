summary_user: AWS·해양기상부이·등표 관측자료에 지형효과를 반영한 3차원 객관분석으로 만든 500m 해상도 전국 격자 기상 분석자료를 담으며, 포털 설명상 매정시 기준 5분 간격(적설은 30분 간격) 시각별 격자값으로 제공된다. 관측소가 없는 지점의 기온·적설 등 기상 상태를 격자 단위로 알고 싶은 분석가나 연구자가, 특정 지역의 시각별 기상 조건을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 격자 위치를 좌표나 지역명으로 직접 대응시키거나 같은 기관(기상청) 자료와 맞춰서만 이어 쓴다.
