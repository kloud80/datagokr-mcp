description_portal: 해양환경공단이 수행한 동물성플랑크톤 조사 및 분석 결과 정보를 제공합니다. 본 데이터는 전국 연안 및 주요 해역에서 수집된 시료를 기반으로 출현종, 개체수, 생물량, 군집 구조 등을 조사한 내용으로 구성되어 있으며, 계절별 및 지역별 분포 특성을 포함합니다. 자료는 해양생태계 건강성 평가, 생물다양성 모니터링, 수산자원 관리, 해양환경 변화 분석 및 예측 등에 활용됩니다. 주요 분류군에는 요각류, 극피동물 유생, 삿갓조개류, 갑각류 등이 포함되며, 시계열 분석이 가능하도록 정리되어 있습니다. 데이터는 표 및 보고서 형태로 제공되며, 해양환경 연구, 정책 기획, 교육자료 등 다양한 분야에서 기초자료로 적극 활용됩니다.
