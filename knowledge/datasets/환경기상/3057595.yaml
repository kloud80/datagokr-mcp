summary_user: 대구광역시 중구에서 대형폐기물 납부필증(스티커)을 파는 업소를 한 곳씩 행정동·상호·주소·전화번호로 담은 건별 목록 파일로, 범위는 중구 한 개 시군구다. 중구 주민이 가구나 가전제품을 버리기 전에 '우리 동네 어느 가게에서 대형폐기물 스티커를 살 수 있나'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 주소 문자열을 맞춰 연결해야 하며, 같은 중구의 종량제봉투 판매소·대형폐기물 품목 수수료 자료와 함께 보면 배출 준비를 한 번에 안내할 수 있다.
description_portal: 대구광역시 중구 대형 폐기물 배출을 위한 정보, 스티커 판매소, 쓰레기봉투 판매소, 쓰레기 수거장소 등 입니다.- 번호, 행정동, 상호, 주소, 전화번고, 비고 등의 정보를 제공합니다.- 대형폐기물 납부필증은 가구, 가전제품 등과 같은 대형 폐기물을 처리할 때 필요한 스티커로, 해당 폐기물의 수거 및 처리를 위해 지불한 수수료를 증명하는 역할을 합니다.- 신청안내, 신청 처리절차, 품목별 수수료 등의 상세한 정보는 별도 웹사이트에서 확인 할 수 있습니다. (https://www.jung.daegu.kr/waste)
