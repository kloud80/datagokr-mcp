description_portal: 서울특별시 강서구 관내에 지정된 쓰레기 수거거점의 위치 정보로, 해당 거점은 주민들이 일상생활에서 발생하는 쓰레기를 배출할 수 있도록 지정된 장소를 의미합니다. 본 데이터는 각 수거거점의 지번 주소와 함께, 위치를 지도상에서 확인할 수 있도록 위도와 경도 정보를 포함하고 있습니다. 이 데이터는 2021년 당시 쓰레기 수거거점의 위치 정보이며, 2023년부터 문전 수거로 변경되어 수거거점의 정보가 없습니다. 이 데이터는 청소행정, 환경정책 수립, 수거 효율화, 민원 대응 등의 다양한 행정적 활용은 물론, 공공지도 서비스 및 환경 관련 연구자료로도 활용될 수 있습니다.
