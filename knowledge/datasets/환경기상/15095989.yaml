description_portal: 입력 파라미터를 이용하여 대구광역시 북구 소음진동 배출시설 현황(시군구, 시도, 업소명, 행정동코드, 행정동명, 법정동코드, 법정동명, 지번주소, 도로명주소, 종별번호, 업종명, 허가신고여부, 관리기관명) 데이터를 조회하는 서비스 입니다.대구 북구 소음진동 배출시설은 37개소이며, 허가 12개소, 신고 25개소입니다.신고/허가 기준배출시설을 설치하려는 자는 대통령령으로 정하는 바에 따라 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 신고하여야 한다. 다만, 학교 또는 종합병원의 주변 등 대통령령으로 정하는 지역은 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장의 허가를 받아야 한다.
