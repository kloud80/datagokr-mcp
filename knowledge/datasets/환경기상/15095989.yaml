summary_user: 대구광역시 북구의 소음·진동 배출시설 사업장을 업소 한 곳씩 담은 건별 목록으로, 업소명·도로명주소·업종·허가/신고 구분 등을 시군구 범위에서 주소 단위로 제공한다. 주민이나 분석가가 '우리 동네 근처에 허가 대상 소음·진동 배출시설이 어디에 있나'를 확인하거나, 북구 내 허가·신고 사업장의 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소를 이름으로 맞추거나 같은 기관 코드로만 연결한다.
limits: 대구 북구 한 자치구만 다루므로 다른 지역 배출시설이나 실제 소음·진동 측정값은 이 데이터로 알 수 없다. 공통 조인 키가 없어 다른 사업장 데이터와 붙일 때는 업체명·주소 매칭에 기대야 한다.
