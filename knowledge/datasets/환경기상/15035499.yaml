description_portal: 서울특별시 성동구 내 옥상녹화 조성 현황 정보를 제공합니다. 본 데이터는 옥상녹화가 시행된 대상 건물, 해당 건물의 도로명주소, 각 건물의 옥상녹화 관련 업무를 관장하는 관리부서 등 총 3개의 주요 항목으로 구성되어 있습니다. 옥상녹화는 도시열섬 완화, 미세먼지 저감, 녹지 공간 확대 등 도심 환경개선에 효과적인 방안으로 주목받고 있습니다. 이 데이터는 성동구 내 옥상녹화 추진 현황을 한눈에 파악할 수 있도록 하여, 행정기관의 녹화정책 수립, 건축·환경 분야 연구, 지역별 녹화사업 지원 및 시민에게 옥상녹화 정보 제공 등 다양한 목적으로 활용할 수 있습니다. 특히 관리부서 정보를 통해 옥상녹화 관련 문의 및 사후관리가 용이하며, 녹색 도시 만들기를 위한 정책 수립 근거자료로 활용 가능합니다.
