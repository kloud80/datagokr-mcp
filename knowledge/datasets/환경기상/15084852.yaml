summary_user: 부안군 관내 토양오염관리대상시설(유류 저장시설 등)을 시설 한 곳당 한 행으로 담은 파일로, 상호·주소·인허가등록일자·총저장용량·데이터기준일자를 수록한다(csv 약 8KB). 주민이나 부동산·개발 검토자가 특정 부지 주변에 토양오염 관리 대상 저장시설이 있는지, 저장 규모가 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 상호 이름을 맞춰 연결해야 하며, 상수원보호구역·토지피복 같은 환경 공간 규제 레이어와 겹쳐 보는 보조 자료로 쓴다.
description_portal: 본 데이터는 전라북도 부안군 관내 토양오염관리대상시설의 현황 정보를 제공한다. 「토양환경보전법」 제10조 및 제11조에 따라 관리가 필요한 시설로 분류된 유류 저장시설, 금속 가공업체, 폐기물 처리시설 등의 정보를 포함한다. 데이터에는 시설명, 소재지, 업종, 관리유형, 등록일자 등이 수록되어 있으며, 토양오염 예방 및 지역 환경보전 정책 수립의 기초자료로 활용된다. 해당 정보는 정기적인 실태조사와 행정처리 결과를 바탕으로 갱신되며, 지역주민의 환경권 보호 및 행정의 투명성 제고를 위한 목적에서 개방된다. 공공데이터 포털을 통해 누구나 접근 가능하며, 환경 영향 분석, 오염 취약지역 파악, 관련 정책 연구 등에 유용하게 활용된다.
