summary_user: 대구광역시가 지정·등록한 환경관리대행기관을 업체 한 곳당 한 행으로 담은 파일(csv, 약 1.8KB)로, 상호·대표자·전화번호·영업소 소재지·대행 분야(종별)를 담는다. 대기·수질 등 환경관리 업무를 맡길 사업장이나 담당자가 대구 관내에 해당 분야를 대행하는 지정 업체가 어디 있는지 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 소재지 주소를 맞춰 잇거나, 같은 대구광역시의 다른 환경 업체·사업장 목록과 이름으로 대조하는 방식으로만 연결한다.
description_portal: 대구광역시 관내에 등록되어 있는 환경관리대행기관의 업체명, 대표자, 소재지, 전화번호, 환경관리대행분야 현황자료입니다. 대구광역시는 유독물, 대기환경, 수질환경 등 다방면의 환경관리 대행업무를 수행할 수 있는 기관을 지정·등록하고 있으며, 절차는 온라인 신청 → 부서 검토 → 승인 처리 → 지정증 발급 순으로 진행됩니다. 처리기간은 신규 지정 시 약 10일, 변경 신청은 약 5일 내에 완료되며, 수수료는 없습니다 . 문의사항이 있으시면 전화번호는 기후환경정책과(803-3684)으로 문의하여 주시기 바랍니다.
