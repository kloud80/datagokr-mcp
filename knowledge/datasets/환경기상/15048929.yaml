summary_user: 서울시에서 실내공기질 관리대상인 시설을 건물 한 곳당 한 행으로 담으며, 연도·자치구·시설군과 건물명·지번/도로명 주소·우편번호, 연면적·상주인원·일일사용자수·침상수, 준공일자, 담당 부서, 최근 교육이수일과 교육종류를 함께 싣는다. 구청 담당자나 분석가가 "우리 구의 어린이집·노인요양시설 같은 취약계층 이용시설 중 준공이 오래되고 이용자가 많은데 관리교육 이수가 오래된 곳은 어디인가"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명(RGN_GU)이나 주소·건물명을 문자열로 맞춰 잇는 방식으로만 연결한다.
description_portal: 서울시 실내공기질 관리대상 시설정보 데이터는 실내 공기질 관리가 필요한 주요 건축물의 현황을 체계적으로 정리한 자료입니다. 연도와 지역구, 시설군 정보를 통해 언제, 어떤 유형의 시설이 관리 대상인지 파악할 수 있으며, 건물명과 지번·도로명 주소, 우편번호로 시설의 정확한 위치를 확인할 수 있습니다. 연면적과 상주인원수, 일일사용자수, 침상수 등은 이용 규모와 특성을 보여 주어 취약계층 이용 시설이나 다중이용시설을 중점 관리하는 데 활용됩니다. 준공일자는 건물 노후도와 설비 상태를 가늠하는 기준이 되며, 담당 부서명은 행정적 책임과 관리 체계를 파악하는 데 도움을 줍니다. 또한 최근 교육이수일, 교육종류코드 및 명칭을 통해 실내공기질 관리 관련 교육 이력과 이행 상황을 관리할 수 있어, 서울시의 환경·보건 정책 수립과 시설별 맞춤형 관리 전략 마련에 중요한 기초 자료로 활용됩니다.
