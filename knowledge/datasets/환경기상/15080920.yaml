summary_user: 경기도 광주시에 있는 대기오염물질 배출사업장을 사업장 한 곳당 한 행으로 담은 목록 파일로, 업무구분·인허가구분·사업장명·지번/도로명 소재지·대표업종·배출시설 등급(종)을 담는다. 광주시 주민이나 분석가가 '우리 동네 근처에 어떤 업종의 대기 배출사업장이 몇 종 시설로 허가돼 있나'를 확인하거나 점검 대상을 추릴 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소 문자열 매칭으로만 연결한다.
description_portal: 본 데이터는 경기도 광주시에 위치한 대기환경 오염물질을 배출하는 사업장의 현황 정보를 제공합니다. 대기오염물질을 배출하는 제조업체, 공장 등의 사업장을 관리하고 환경 규제를 시행하기 위한 정보를 담고 있습니다. 업무구분과 인허가구분은 사업장의 관리 유형과 허가 상태를 나타내며, 사업장명과 소재지 정보를 통해 각 사업장을 확인할 수 있습니다. 대표업종은 사업장의 주요 산업 분야를 표시하고, 종은 배출시설의 등급을 나타냅니다. 본 데이터는 대기 환경 관리, 오염물질 배출 감시, 환경 규제 정책 수립, 사업장 점검 계획 등에 활용됩니다.
