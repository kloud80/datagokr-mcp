summary_user: 서울 용산구에서 쓰레기 무단투기가 자주 일어나 단속하는 지점을 한 행에 한 곳씩 도로명주소와 상세위치로 담은 목록 파일이며, 범위는 용산구 한 곳입니다. 주민이나 구 담당자가 '우리 동네 어느 골목이 상습 무단투기 지점인가'를 확인하거나 CCTV·경고문 설치 위치를 검토할 때 쓴다. 전역 조인 키가 없어 도로명주소를 지오코딩하거나 주소 문자열로 다른 용산구 생활폐기물 배출·수거 지점 파일과 맞춰 이어 쓴다.
description_portal: 서울특별시 용산구 쓰레기상습무단투기지역현황(연번, 도로명주소, 상세위치)에 대한 정보를 제공합니다. 해당지역은 경험적으로 자주 단속하는 지역이며 관리데이터가 아님을 안내드립니다.용산구는 언덕지형이 많고 주거지역과 상업지역이 혼재된 지역이 많습니다. 선정된 지역들은 언덕지형의 밀집 주거지, 대로변의 상가등이 많습니다. 선정된 지역들 중 후암동과 용산2가동은 언덕지역이 많습니다. 이 지역들은 세대들이 밀집해서 거주하고 있고, 내집앞의 경계가 불분명하여 거주민들 사이의 다툼이 많이 발생하고 있습니다. 용산구에서는 이 지역에 배너설치, 현수막 부착, 경고문 부착, 투기방지 그물망 설치, 고정식 cctv설치 등의 조치를 취해 개선효과를 보고 있습니다. 또한 남영동과 청파동의 경우 화단조성,골목청결지킴이 활동을 통해 주민만족도를 향상시켜왔습니다. 또한 한강로동의 대로변에는 이동식,고정식 cctv를 집중설치함으로서 스마트장비 위주의 행정을 펼치고 있습니다. 용산구는 이렇게 각 지역의 특성을 반영하여 인력과 스마트 장비를 적절히 배합하고, 계도와 단속을 병행한 활동을 수행하고 있습니다.
