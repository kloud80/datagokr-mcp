summary_user: 광주광역시 북구에 있는 음식물류폐기물 다량배출사업장을 업소 한 곳당 한 행으로 담은 CSV 파일로, 상호·전화번호·도로명주소·사업장구분·데이터기준일을 담는다. 북구 주민이나 사업자가 '우리 동네 어느 음식점·집단급식소가 음식물쓰레기 다량배출사업장으로 관리되는가'를 확인하거나, 분석가가 다량배출 업소의 동별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명주소를 매칭하거나 같은 기관의 다른 파일과 나란히 놓는 방식으로 이어 쓴다.
limits: 표준 코드 같은 조인 키가 없어 인허가·영업신고 데이터와 자동으로 연결하기 어렵고, 주소·상호 문자열 매칭에 기대야 한다. 범위가 북구 한 곳이라 다른 자치구나 광역 단위와 비교하려면 지자체별 파일을 따로 모아야 한다. 배출량이나 처리 실적 같은 통계는 담지 않는다.
