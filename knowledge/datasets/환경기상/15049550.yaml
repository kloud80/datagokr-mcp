summary_user: 경상남도에서 발령된 미세먼지·초미세먼지·오존 주의보와 경보를 한 건씩 담은 발령 내역 파일로, 물질명·지점(권역)·경보단계·발령 농도와 시간·해제 농도와 시간을 기록하며 포털 설명상 2023년부터 2025년 11월 18일까지를 담는다. 경남 지역에서 어느 권역에 어떤 오염물질 주의보가 얼마나 자주, 얼마 동안 발령됐는지를 확인하려는 주민이나 고농도 오염 사례를 분석하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대기질 데이터와는 지점(권역) 이름이나 물질명을 직접 맞추는 방식으로만 연결한다.
limits: 측정소 코드 같은 공통 조인 키가 없어 에어코리아 측정소별 시간 자료와 바로 결합하기 어렵다. 실시간 API가 아닌 연도별 파일(CSV, 약 28KB)이라 현재 발령 상황 확인에는 쓰지 못한다.
