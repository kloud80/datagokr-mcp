summary_user: 경기도 내 대기오염물질 배출 사업장의 배출구별 배출시설과 방지시설 현황을 담은 시도 단위 원장 데이터로, 사업장명·사업자번호·업종, 배출·방지시설의 용량과 상태·변경일, 처리효율, 오염물질별 발생·배출량, 사용 연료를 함께 담는다. 지자체 환경 담당자나 분석가가 "특정 산업단지의 어떤 사업장이 어떤 방지시설로 어떤 오염물질을 처리하고 있는가"를 확인하거나 산업단지별 오염관리 대상을 추리는 데 쓴다. 실측 컬럼에 전역 조인 키는 없지만, 사업자번호(bizregno)를 기업 축으로 삼아 다른 사업장·기업 데이터와 맞추거나 사업장명·업종코드 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 내 대기오염물질을 배출하는 배출시설과 해당 오염물질을 줄이기 위한 방지시설에 대한 현황을 담고 있으며, 사업장명, 사업자번호, 업종코드, 업종명, 산업단지 위치, 배출구번호 및 상태, 배출시설명, 방지시설명, 시설 사용상태 및 변경일, 처리방식, 주요 대기오염물질, 연료명 및 사용량 등 총 52개의 세부 항목으로 구성되어 있습니다. 각 항목은 배출시설의 운영현황 및 환경관리 상태를 점검하거나, 지역 산업단지별 오염관리 정책 수립에 활용할 수 있습니다. 또한 배출구별로 배출 및 방지시설의 상세 구성, 오염물질 처리방식, 연료 사용 현황 등을 통해 환경 영향을 분석하거나 정책 대응자료로 활용 가능합니다.
