summary_user: 해양환경공단이 보유한 방제기자재를 운용부서(지사·출장소) 단위로 분류·형식·세부 형식별 정상 용량과 합계 용량, 단위로 정리한 전국 범위의 현황 표(CSV 파일)이다. 해양오염 사고 대응을 준비하는 공공기관·지자체·연구자가 "우리 해역 관할 지사에 유회수기나 유흡착제가 얼마나 있나", "지역별 방제자원 격차는 어떤가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운용부서 이름을 지사·관할지역 이름에 맞춰 매핑하거나 같은 기관(해양환경공단) 자료끼리만 이어 쓴다.
description_portal: 해양환경공단이 보유·관리 중인 방제기자재의 관할지역별 보유 현황 정보를 제공합니다. 본 데이터는 전국 해양환경공단 지사 및 출장소 단위로 구분된 기자재의 종류, 수량, 보관 위치, 관리 부서 등의 정보를 포함하며, 방제 자원의 지역 분포와 활용 가능성 파악에 활용됩니다. 유흡착제, 방제포, 방제복, 방제기계류, 유회수기 등 주요 기자재가 포함되며, 해양오염 사고 발생 시 신속한 방제작업과 초기 대응 역량 확보를 위한 기초자료로 사용됩니다. 본 자료는 방제자원 격차 분석, 방제기능 평가, 장비 보급 계획 수립 등에 활용됩니다. 데이터는 표 형식으로 제공되며, 공공기관, 연구기관, 지자체 등에서 정책 수립과 대응 역량 강화에 참고자료로 활용됩니다.
