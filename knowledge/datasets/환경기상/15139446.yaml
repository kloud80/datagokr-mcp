summary_user: 전국을 대상으로 지형차폐 영향이 없는 가장 낮은 고도각 자료로 추정한 레이더 강수량(HSR)과 에코고도를 5분 주기로 담은 관측 원천 자료이며, 포털 설명상 2016년부터 보유한다. 분석가가 '특정 시각에 지상 관측소가 없는 지역에 비가 얼마나 왔는가'를 확인하거나, 기후·농업·보험 분석에서 강수 원천으로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 ASOS·AWS 같은 다른 기상청 관측 자료와는 시각과 이름·코드 매핑으로만 맞춰 쓴다.
limits: 포털 활용신청과 별개로 apihub.kma.go.kr 인증키(KEY 파라미터)가 필요하다. 응답이 텍스트 한 줄 단위(line)로 오므로 직접 파싱해야 한다. 행정구역 단위 구분이 없어 시군구별 강수량 집계에는 그대로 쓸 수 없다.
