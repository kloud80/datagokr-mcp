description_portal: '지형차폐의 영향이 없는 지상에 가장 가까운 고도각 자료로 추정한 레이더 강우량(HSR: Hybrid Surface Rainfall)으로, 지형에코와 비기상에코 등의 영향을 최소화하여 레이더 강우량의 정확도를 향상시켰고, 에코고도를 함께 제공하여 레이더양상 분석능력을 강화하였습니다.생산주기: 분(5분 주기)보유기간: 2016년 ~ 현재(참고) 기상레이더는 전파를 대기 중에 발사하여 강수입자에 부딪혀 산란되어 되돌아오는 신호를 이용하여 강수지역, 강수세기, 이동속도 등을 탐지하는 원격관측장비입니다.'
