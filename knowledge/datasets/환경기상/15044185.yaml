summary_user: 해양환경공단 해양수질자동측정망 중 영산강·영암호 주변 해역 측정소별(정점명·정점코드)로 관측일자마다 수온, 염분, 전기전도도, 수소이온농도, 용존산소량, 탁도, 클로로필을 담은 시계열 측정 파일이다. 지자체·연구자가 영산강 하구와 영암호 인근 바다의 용존산소나 클로로필이 계절에 따라 어떻게 변했는지, 이상 수질이 언제 나타났는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해역 자동측정망 파일과는 정점명·정점코드 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 영산강 및 영암호 주변 해역에 설치된 측정소의 수질 자동측정 정보를 제공합니다. 본 데이터는 수온, 염분, 용존산소(DO), pH, 탁도, 클로로필-a 등 주요 수질 항목을 실시간으로 측정한 결과를 포함하며, 수집된 자료는 해양환경 모니터링, 오염 감시, 수질 변화 추적, 이상 수질 조기경보 등에 활용됩니다. 측정망은 해양환경 관리와 정책 수립을 위한 과학적 근거자료를 제공하며, 실시간 데이터 제공을 통해 신속한 대응이 가능합니다. 또한 계절별 수질 변화, 오염원 분석, 정화사업 효과 평가 등에 활용됩니다. 데이터는 시계열 통계 형식으로 제공되며, 공공기관, 연구기관, 지자체의 수질관리 기초자료로 사용됩니다.
