description_portal: '본 데이터는 국립생물자원관이 확보한 자생 야생생물의 DNA 바코드 서열 정보를 기반으로 구성된 유전정보 현황 자료입니다.DNA 바코드 서열은 생물종을 유전적으로 신속하게 식별하기 위해 표준 유전자 영역(예: COI, rbcL 등)의 염기서열을 활용한 것으로, 생물 분류학, 종 동정, 생물다양성 모니터링 등에 널리 사용됩니다.이 목록은 국립생물자원관이 직접 수집하고 분석한 자생 야생생물에 대한 유전정보관리번호, 학명, 국명, 표본정보, 염기서열 길이, 유전자 영역, 염기서열 ID 등을 포함하며, 자원별 서열 확보 현황 및 생물군별 확보 종 수 등 현황 분석이 가능합니다.해당 데이터는 다음과 같은 항목으로 구성됩니다:📋 주요 항목 예시유전정보관리번호 (예: NIBRGR000012345)국명 (예: 무당거미)학명 (예: Argiope bruennichi)분류체계 (계, 문, 강, 목, 과, 속, 종)유전자영역 (예: COI, rbcL 등)염기서열 길이 (예: 658 bp)염기서열 ID (GenBank 등재 ID, 내부 코드 등)표본정보 (표본번호, 수집지, 수집일 등)데이터는 한반도의 생물다양성 시스템(https://species.nibr.go.kr)을 통해 확인 가능하며, FASTA 형식으로 서열이 제공됩니다.생물자원 관리, 종 다양성 분석, 생태계 보전 연구에 활용됩니다.'
