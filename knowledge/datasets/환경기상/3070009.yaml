summary_user: "국립생물자원관이 직접 수집·분석한 자생 야생생물의 DNA 바코드 서열 정보를 서열(유전정보) 1건 단위로 담은 전국 범위의 비공간 목록 파일로, 유전정보 아이디·학명·국명·유전자 영역(마커명)을 담는다. 분류학·생물다양성 연구자가 '특정 자생종(예: 무당거미)에 대해 어떤 유전자 영역의 바코드 서열이 확보돼 있는가', '생물군별로 서열이 확보된 종은 몇 종인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 종 분포·조사 데이터와는 학명이나 국명을 이름 매핑해 붙여 쓴다."
