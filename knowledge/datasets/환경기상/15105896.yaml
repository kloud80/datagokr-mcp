summary_user: 여수항 여수엑스포터미널 측정소에서 잰 초미세먼지(PM2.5)·미세먼지(PM10) 농도와 온도·습도를 시간 단위로 기록한 건별 측정 파일(CSV, 약 27만 바이트)이다. 엑스포터미널 인근 주민·항만 이용객·분석가가 "터미널 주변 미세먼지가 어느 시간대에 높아지는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소 이름이나 시간으로 에어코리아 등 다른 대기질 자료와 직접 맞춰 이어 써야 한다.
limits: 측정소 코드 같은 공통 키가 없어 다른 측정망 자료와 자동으로 결합되지 않고, 이름·시간 매핑이 필요하다. 범위는 전국·비공간으로 분류돼 있지만 실제 값은 여수엑스포터미널 한 곳의 측정치이고, 오존·경보 정보는 담지 않는다.
