summary_user: 환경영향평가 결정내용을 사업 건별로 담는 API로, 목록(사업명·협의기관·공람기간), 상세(승인기관·사업자·공고일·의견 제출기간·결정내용), 첨부파일 정보, 공통코드(협의기관·소분류·사업구분)를 전국 범위에서 조회한다. 개발사업 인근 주민이나 부동산·개발 분석가가 '이 사업의 환경영향평가 결정내용이 언제 공고됐고 의견 제출기간은 언제까지인가'를 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업명·협의기관명 같은 이름 매핑으로만 잇고, 서비스 안에서는 공통코드 조회로 받은 코드와 목록의 결정내용코드(resultCd)를 상세·파일 조회에 넘겨 연결한다.
description_portal: 환경부 국립환경과학원 환경영향평가 결정내용에 대한 결정내용목록 정보(사업명, 협의기관명, 공람기간,넘버링, 한 페이지 결과 수, 페이지 번호 ,전체 결과 수, 결정내용코드  )를 조회, 결정내용 상세 정보(사업명, 승인기관, 부서명, 공고일, 공람기간시작일, 공람기간종료일,  의견 시작일, 의견종료일, 결정내용,  사업자, 결정내용코드)를 조회, 결정내용 파일 정보(표출파일명, 파일명, 파일사이즈, 확장자, 다운로드경로 등)를 조회,  공통코드 정보(공통코드, 구분상태, 순서일련번호 등)를 조회에 대한 서비스를 제곰합니다.
team:
  dept: 기후국토환경연구과
services:
  - op: /getFileInfoInqire
    name: 파일 정보 조회
    endpoint: https://apis.data.go.kr/1480523/EnvrnAffcEvlDecsnCnInfoInqireService/getFileInfoInqire
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: type
        required: true
        desc: '1: 결정내용 파일정보 2: 초안공람 전략환경영향평가 초안파일 3: 초안공람 환경영향평가 초안파일'
      - name: resultCd
        required: true
        desc: 결정내용코드
      - name: perCd
        required: true
        desc: 초안전략환경파일일련번호
      - name: tbSeq
        required: true
        desc: 초안환경파일일련번호
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getDecsnCnListInfoInqire
    name: 결정내용목록 정보 조회
