    error_style: http200_body_code
    verified_ok: true
  - op: /getDecsnCnIngbtntOpinionDetailInfoInqire
    name: 결정내용 상세 정보 조회
    endpoint: https://apis.data.go.kr/1480523/EnvrnAffcEvlDecsnCnInfoInqireService/getDecsnCnIngbtntOpinionDetailInfoInqire
