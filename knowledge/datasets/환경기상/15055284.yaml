summary_user: 여수시 관내 폐기물 수집·운반업체를 업체 한 곳당 한 줄로 담은 원천 목록으로, 업종 구분(일반·건설폐기물 등), 업체명, 소재지, 전화번호가 들어 있다(CSV 약 5.6KB). 폐기물을 내보내야 하는 여수 지역 사업자나 주민이 '우리 동네에서 건설폐기물을 수거·운반해 줄 허가 업체는 어디이고 연락처는 무엇인가'를 찾는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 폐기물 처리업·배출자 데이터와는 업체명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전라남도 여수시 관내에서 폐기물 수집·운반업을 수행하는 업체들의 현황 정보를 제공하는 공공데이터입니다. 일반폐기물 및 건설폐기물 수집·운반업체를 대상으로 하며, 업체별 업종 구분, 업체명, 소재지주소, 전화번호 등의 정보를 포함하고 있습니다. 지역 내 폐기물 처리 관련 사업자 현황을 파악할 수 있으며, 폐기물 배출자와 관련 기관의 업체 검색, 행정업무 지원, 환경 관리 정책 수립 및 폐기물 처리 서비스 연계 등 다양한 목적으로 활용할 수 있습니다. 또한 여수시 폐기물 처리 인프라 현황 분석과 관련 산업 정보 제공에 유용한 기초자료로 활용 가능합니다.
