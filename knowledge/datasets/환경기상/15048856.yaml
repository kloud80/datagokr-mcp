summary_user: 시중에 유통 중인 먹는샘물(생수)을 수거해 검사한 결과를 제품 단위로 담은 전국 범위 파일로, 업체명·제품명·수거기관·수거일자·검사시기·검사기관과 함께 미생물(일반세균·총대장균군 등), 중금속(납·비소·수은 등), 농약, 휘발성유기화합물 항목별 검사값을 담는다. 소비자나 분석가가 '내가 마시는 특정 브랜드 생수가 수거검사에서 어떤 항목이 어떻게 나왔는가'를 확인하거나 업체별·연도별 검사 결과를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 먹는샘물·지하수 수질 데이터와는 업체명·제품명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 먹는샘물(생수) 수질검사결과 정보는 전국 먹는샘물 제조업체에서 취수·생산되는 원수·제품수 및 시중에 유통중인 먹는샘물을 수거하여 수질검사를 진행하고 그 결과(수질기준 적합, 부적합)를 수거기관, 제품명, 수거일자, 검사시기, 검사일자, 검사기관 등의 정보와 함께 제공하고 있습니다. 수질검사결과는 17개 시도 담당자들이 토양지하수정보시스템을 통해 입력 제출한 후, 데이터를 검증 및 가공을 통해 데이터를 개방하고 있습니다. 또한, 전국의 혼재되어 있는 (먹는)샘물 수질검사결과 데이터를 공공데이터포털에 대국민공개함으로써 국민의 알권리 뿐만 아니라 편의성을 충족시키고 있습니다.
