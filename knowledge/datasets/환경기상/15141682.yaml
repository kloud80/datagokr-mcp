summary_user: 서울 용산구 관내 건설폐기물 수집·운반·중간처리 업소를 업소별 한 건씩 담은 인허가 원장으로, 허가일·영업상태·폐업·휴업·재개업 일자, 사업장명, 지번·도로명 주소, 연락처, 좌표, 처리 구분·허용 보관량을 포함한다. 건설 현장을 운영하는 사업자가 용산구에서 지금 영업 중인 건설폐기물 처리업체가 어디인지 확인하거나, 분석가가 관내 처리업소의 개·폐업 추이를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 다른 자치구의 같은 인허가 데이터와 합쳐 서울 단위로 볼 때 이 방식을 쓴다.
description_portal: 서울특별시 용산구의 건설폐기물처리업 인허가 정보는 관내 건설폐기물 수집·운반·중간처리 업소의 허가일, 영업상태, 폐업·휴업·재개업 일자, 사업장명, 주소(지번·도로명), 연락처 등 주요 인허가 현황을 담고 있습니다. 이 데이터는 2020년 7월 24일 최초 공개 이후 2025년 8월 11일 기준 수시로 업데이트되고 있습니다. 이 데이터는 서울 열린데이터광장과 공공데이터포털을 통해 CSV, XLS, JSON, XML 형식 또는 Open API로 제공되며, 공공누리 제1유형(출처표시, 상업적 이용 및 변경 가능) 라이선스가 적용됩니다. 이를 활용하면 행정기관은 각 업체에 대한 실시간 모니터링과 지도 기반 관리가 가능하고, 시민과 기업은 영업 중인 업체 정보를 확인해 환경오염을 예방하고, 건설폐기물 처리업체 선택, 시장 분석 등에 활용할 수 있으며, 각 연구기관은 지역의 폐기물 처리 현황 분석 및 환경 정책 평가 자료로 쓸 수 있습니다. 이 데이터를 통해 투명한 행정과 지속가능한 환경관리 기반을 강화할 수 있습니다.
