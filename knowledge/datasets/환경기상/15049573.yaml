description_portal: 서울시 토양오염 우려(대책)기준 초과비율 데이터는 서울시에서 실시한 토양오염 조사 결과 중 법적 기준을 초과한 사례를 정리한 자료입니다. 조사년도 항목을 통해 언제 조사된 결과인지 알 수 있으며, 초과 내용은 어떤 토양오염 우려기준 또는 대책기준 항목이 기준을 넘었는지에 대한 정보를 제공합니다. 초과 개수는 해당 년도에 기준을 초과한 지점 또는 항목의 개수를 나타내어, 연도별 토양오염 발생 추세와 심각도를 파악하는 데 활용됩니다. 이 데이터는 토양오염 관리 대상 지역의 선정, 정화 대책 수립, 장기적인 환경위해도 평가 등 토양환경 정책 수립과 점검에 중요한 기초 자료로 활용될 수 있습니다.
