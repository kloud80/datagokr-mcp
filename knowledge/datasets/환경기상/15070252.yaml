summary_user: 한국수력원자력이 원전 운영·정비에 쓰는 화학물질을 물질별로 정리한 목록 파일로, 물질명·사용분류·주요 성분명·CAS번호를 담는다(약 126KB 크기의 CSV). 지역 주민이나 환경·안전 분석가가 "원전 정비에 어떤 성분의 화학물질이 쓰이는가"를 확인할 때 쓴다. 전역 조인 키는 없으며, CAS번호(화학물질식별코드)로 유해화학물질·배출량(PRTR) 등 다른 화학물질 정보와 물질 단위로 맞춰 보는 정도로만 이어 쓴다.
limits: 사업자번호·좌표 같은 사업장 식별 정보가 없어 발전소별·지역별 사용 현황이나 사용량은 알 수 없다. 납품업체 영업비밀 보호로 일부 물질은 CAS번호가 비어 있어 이 물질들은 성분 기준 매칭이 되지 않는다.
