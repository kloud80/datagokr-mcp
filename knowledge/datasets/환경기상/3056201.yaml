description_portal: 실내공기질 실시간 측정 자료는 부산광역시 도시철도 지하역사 내에 설치된 총 104개의 공기질 측정망에서 수집되는 실시간 데이터입니다. 측정망은 주로 지하철 승강장과 주요 대합실 등 이용객들이 많이 머무르는 장소에 설치되어 있으며, 도시철도를 이용하는 시민들에게 실시간으로 실내공기질 정보를 제공하는 역할을 합니다.지하역사 공기질 측정망을 통해 측정된 자료는 쾌적하고 안전한 실내 환경을 유지하기 위한 다양한 대응책을 마련하는데 이용되고 있으며, 도시철도를 이용하는 시민들의 건강 보호와 쾌적한 대중교통 환경조성을 위한 중요한 기반이 되고 있습니다.
