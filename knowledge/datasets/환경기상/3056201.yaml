summary_user: 부산 도시철도 지하역사 승강장·대합실에 설치된 측정망에서 수집한 실내공기질 실시간 측정값을 측정 지점(역사·위치)별로 담는다. 미세먼지(PM10·PM2.5), 이산화탄소, 일산화탄소, 질소산화물, 오존 등의 항목이 포함된다. 도시철도 이용객이나 분석가가 "지금 내가 이용하는 지하철역 승강장의 미세먼지·이산화탄소 농도가 어느 정도인가"를 확인하거나 역사별 공기질을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 역사명(site)·관리번호 같은 이름 매핑으로만 역사 위치·승하차 인원 등 다른 데이터와 잇고, 실외 대기질(에어코리아)과는 지역 단위로 나란히 비교하는 정도로 쓴다.
limits: 표준 행정·시설 코드가 없어 다른 데이터와 붙이려면 역사명 등 이름을 직접 맞춰야 한다. 범위는 부산 한 시도에 한정된다. 개발계정은 하루 10,000회 호출 제한이 있다.
