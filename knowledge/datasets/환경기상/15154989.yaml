summary_user: 전국 자치단체가 관리하는 수질오염원설치시설 중 점오염원·비점오염원으로 관리되지 않는 기타 시설의 인허가 정보를 사업장 단위 건별로 담으며, 전체 64,131건이다. 지역 환경 담당자나 분석가가 특정 지역에 어떤 기타 수질오염물질 배출시설이 허가돼 있고 영업 중인지 확인하는 데 쓴다. 사업자등록번호(bizno)와 지번·도로명 주소(address)를 키로 다른 사업장·시설 데이터와 이어 쓰며, 좌표(X·Y)는 Bessel 중부원점TM(EPSG:5174) 기준이다.
description_portal: '자원환경_수질오염원설치시설(기타) 데이터는 점오염원(폐수배출시설, 하수발생시설, 축사 등으로서 관거·수로 등을 통하여 일정한 지점으로 수질오염물질을 배출하는 배출원) 및 비점오염원(도시, 도로, 농지, 산지, 공사장 등으로서 불특정 장소에서 불특정하게 수질오염물질을 배출하는 배출원)으로 관리되지 아니하는 수질오염물질을 배출하는 시설 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소, 종업원 수 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 수질오염원설치시설 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 물환경정책과 / 044-201-7011 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
