description_portal: 서울두드림길의 한양도성길 선형 공간정보로 좌표(위경도)등의 정보를 제공하는 서비스 입니다.이 데이터는 한양도성길, 즉 서울시 내 역사·둘레길 구간 중 하나인 ‘한양도성길’의 선형(LINE) 공간정보를 위경도 좌표계(WGS 84)로 제공하는 자료입니다.  경로 전체 또는 일부 구간의 궤적이 포함되어 있으며, GIS(지리정보시스템)에서 시각화하거나 분석할 수 있도록 쉐이프파일 및 CSV 형식으로 제공됩니다. 좌표가 위도·경도로 명시돼 있어 모바일 앱 경로 안내, 관광·레크리에이션 길 설계, 보행 인프라 분석 등에 활용하기에 적합합니다. 제공기관은 서울특별시 푸른도시여가국 자연생태과이며, 데이터 인코딩은 UTF-8 기준으로 설정되어 있습니다. 이를 통해 자치구별 둘레길 네트워크 분포, 걷기코스 접근성, 관광경로 설계 등의 연구 및 정책기획에 활용할 수 있습니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
