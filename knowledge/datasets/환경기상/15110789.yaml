summary_user: 제주특별자치도 항만측정망 정점별로 CTD로 관측한 수온·염분·수심 값을 측정 연도·월 단위로 담은 관측 원천 파일이며, 정점마다 위도·경도 좌표가 붙어 있다. 제주 항만 수질을 관리하거나 연안 생태·수산을 연구하는 사람이 "특정 항만 정점의 수온과 염분이 월별로 어떻게 달라지나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 해양 수질 자료와는 정점명을 이름으로 맞추거나 위도·경도 좌표를 공간으로 맞춰 이어 쓴다.
description_portal: '제주특별자치도 내 해양환경 항만 측정 데이터를 제공합니다.항목: 측정일자, 정점명, 위도, 경도, 날씨, 수심, 수층, 투명도, 수질평가지수 등급 등* 제주특별자치도 해양환경 항만 측정 데이터는 제주도 항만측정망에서 관측된 해양환경 정보를 제공하는 자료로, 수온, 염분, 수소이온농도(pH), 용존산소량(DO), 총질소(TN), 총인(TP), 클로로필(a) 등 다양한 해양 환경 요소를 포함합니다.제주 연안의 해양 환경을 종합적으로 이해할 수 있는 기초 자료입니다.* 활용분야 : 항만 수질 관리 및 개선, 해양 생태계 모니터링, 수산업 관리 등"'
