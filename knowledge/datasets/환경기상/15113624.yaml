summary_user: 대전광역시 대덕구 관할 음식물쓰레기 다량배출사업장을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·도로명/지번 주소·연락처·업종과 위탁재활용방법·위탁처리구분, 월배출량과 연간처리량(kg)을 기록한다. 구청 담당자나 지역 분석가가 "대덕구에서 음식물쓰레기를 많이 내는 사업장은 어떤 업종이고, 어떤 방식으로 위탁 처리·재활용하는가"를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소를 매칭하거나 같은 기관(대덕구) 자료끼리만 연결할 수 있다.
limits: 사업장 코드나 사업자번호 같은 공통 키가 없어 인허가·사업자 데이터와 정확히 조인되지 않고, 이름·주소 매칭에 기대야 한다. 범위가 대덕구 한 곳이라 대전 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다. 포털 분류는 생물종·야생동물이지만 실제 내용은 폐기물(음식물쓰레기) 배출 현황이다.
