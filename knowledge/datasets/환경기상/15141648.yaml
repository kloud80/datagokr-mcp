summary_user: 순환자원 인정제도 대상 업체의 업체명·대표자·소재지, 대상 폐기물과 사용용도, 인정상태와 인정기간을 업체 단위로 담은 조회 API이며, 검증 시 전국 범위에서 전체 3건 중 3행을 받았다. 거래 상대나 신고 업체가 순환자원 인정업체로 유효한지 사업자등록번호와 기준일자로 진위를 확인하려는 사업자·담당자가 쓴다. 사업자등록번호(brNo)와 소재지주소(lctnAddr)를 조인 키로 삼아 폐기물 처리 사업자·배출 사업장 원장 같은 다른 사업자 데이터와 이어 쓰며, 필수 입력인 사업자번호는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 순환자원 인정제도의 적용을 받는 대상 업체 정보를 조회하는 서비스입니다. 사업자등록번호와 특정 기준일자를 입력받아 순환자원 인정업체의 유효성 여부를 통해 업체정보에 대한 진위확인이 가능합니다.
