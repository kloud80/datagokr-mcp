summary_user: 경기도 시군별 환경오염물질 배출업소를 사업장 한 곳당 한 행으로 담은 인허가 사업장 원장으로, 사업장명·업종·관할기관, 대기·폐수 종별과 관리등급, 도로명·지번 주소와 WGS84 좌표를 포함한다. 주민이나 분석가가 '우리 시군이나 동네 주변에 대기·폐수 관리등급이 높은 배출사업장이 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 다른 시군 단위 통계와 맞추고, 주소나 좌표로 지도·공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 환경오염물질 배출업소 현황을 제공하는 자료로, 각 사업장의 기본 정보와 관리 현황을 포함합니다. 주요 항목은 시군명, 사업장명, 업종명, 대표자명, 관할기관명, 폐수관리등급, 대기관리등급, 폐수종별구분명, 대기종별구분명, 소재지 주소(도로명·지번), 우편번호, WGS84 좌표(위도·경도) 등으로 구성됩니다. 데이터는 환경 관리와 관련된 오염물질 배출 업소의 분포 파악, 업종별 특성 분석, 환경 정책 수립 및 규제 근거 마련, 오염저감 시설 운영 현황 모니터링 등에 활용될 수 있습니다. 특히 폐수관리등급 및 대기관리등급은 사업장의 환경관리 수준을 나타내는 지표로, 행정기관의 관리 및 감독에 중요한 참고 자료가 됩니다. 다만, 제공되는 자료는 기준일 시점의 인허가 및 관리 현황을 반영하므로 실제 영업 활동이나 시설 가동 여부와 차이가 발생할 수 있습니다.
