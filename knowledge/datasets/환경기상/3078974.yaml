description_portal: 관리대상기기 정보는 「잔류성유기오염물질 관리법」에 따라 경기도 고양시에 신고된 PCB(폴리염화비페닐) 함유 가능 관리대상기기 현황을 제공하는 공공데이터입니다. 관리대상기기란 절연유 등을 사용하는 변압기, 콘덴서, 계기용변압변류기(MOF·PT·CT) 등 PCB가 포함되었거나 포함 가능성이 있는 전기설비를 말합니다. 해당 데이터는 신고 인허가관리번호, 상호, 대표자, 사업자등록번호, 사업장 주소 등의 항목으로 구성되어 있으며, 관리대상기기의 설치·사용·변경·폐기 현황 파악 및 체계적인 관리에 활용할 수 있습니다. 또한 PCB 함유 기기의 적정 보관 및 처리 여부 확인, 환경오염 예방, 지도·점검, 행정처분, 관련 민원 대응 등 환경행정 업무 수행을 위한 기초자료로 활용 가능합니다.
