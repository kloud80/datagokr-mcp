description_portal: 충청북도 증평군 고물상현황 데이터는 증평군 관내에서 재활용품 수집 및 처리 관련 업종으로 등록된 고물상 사업장의 위치, 운영자, 시설 현황 등을 정리한 자료입니다.고물상은 생활폐기물 및 재활용가능자원의 수집·선별·보관·판매 등의 역할을 수행하며, 지역 내 자원순환 체계 구축과 환경기초산업 기반으로 기능합니다.본 데이터는 증평군이 공개한 현황 자료(👉 공식 링크 바로가기:https://www.jp.go.kr/kor/cop/bbs/BBSMSTR_000000000294/selectBoardList.do)를 바탕으로 작성된 데이터로, 사업자 주소, 용도지역, 면적, 소유 형태 등 입지 정보가 포함되어 있습니다.
