description_portal: '대기환경보전법에서 정의하는 대기오염물질이란 대기에 존재하는 물질 중 대기오염의 원인으로 인정된 물질을 의미하며 독성, 생태계, 배출량, 환경기준에 대비한 오염도 등의 기준에 따라 심사 평가위원회를 두어 정하고 있습니다.지정된 물질은 아황산가스(SO2), 이산화질소(NO2), 오존(O3). 일산화탄소(CO), 미세먼지(PM-10), 초미세먼지(PM-2.5)을 포함한 64종이며, 이 중 카드뮴을 포함한 35종 물질은 특정대기유해물질로 정하여 관리하고 있습니다.대기환경기준 항목은 환경정책기본법 시행령 제2조 별표 1과 같으며, 세부적인 측정방법은 대기오염공정시험방법을 따르고 있습니다.SO2는 자외선형광법(ES 01601.1), CO는 비분산적외선분석법(ES 01602.1), NO2는 화학발광법(ES 01603.1), O3은 자외선광도법(ES 01607.1a), PM-10은 베타선법(ES 01605.1b), PM-2.5는 베타선법(ES 01606.2b)을 사용하여 측정하고 있습니다.본 자료는 대기환경측정망의 측정 물질(아황산가스, 이산화질소, 오존, 일산화탄소, 미세먼지, 초미세먼지, 벤젠, 납)의 1시간, 8시간, 24시간, 년 등 각 물질별 대기 환경 기준 농도 정보입니다.* 단위 : 아황산가스(ppm), 이산화질소(ppm), 오존(ppm), 일산화탄소(ppm), 미세먼지(ug/m3), 초미세먼지(ug/m3)'
