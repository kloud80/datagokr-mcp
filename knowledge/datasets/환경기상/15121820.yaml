summary_user: 인천광역시에 등록된 건설폐기물 수집·운반 및 처리업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 시군구·분야·업체명·소재지·영업대상 건설폐기물·보유차량대수·전화번호와 2024년 수집·운반량이 들어 있다. 건설 현장 담당자나 시공사가 '현장이 있는 구에서 이 종류의 건설폐기물을 받아 주는 업체가 어디이고 차량은 몇 대인가'를 찾을 때 쓰고, 분석가는 업체별 운반량 비교에 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서 다른 폐기물 처리업 허가 원장과는 업체명·소재지 주소를 맞춰 보거나 시군구 이름으로만 이어 쓴다.
limits: 공통 식별 키가 없어서 다른 데이터와 연결하려면 업체명·주소를 직접 대조해야 한다. 지역 폐기물 발생량이나 처리현황 통계는 담지 않고 업체 목록과 업체별 운반량만 담는다.
