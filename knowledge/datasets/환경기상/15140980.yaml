summary_user: 서울 양천구 관내 대기오염물질 배출시설을 설치한 사업장의 인허가 정보를 사업장 한 곳당 한 행으로 담는다(인허가일, 영업상태·휴폐업 일자, 소재지 주소·좌표, 업종·종별, 주생산품, 배출시설·방지시설 가동시간과 연간 가동일수 등). 주민이나 환경 분석가가 '우리 동네에 영업 중인 대기오염 배출사업장은 어디이고 몇 종인가'를 확인하거나, 행정 담당자가 사업장의 영업·폐업 현황을 점검하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 붙이며, 좌표(XCRD·YCRD)는 지도 위 위치 표시에 쓴다.
description_portal: 본 데이터는 서울특별시 양천구 관내 대기오염물질 배출시설 설치 사업장의 인허가 관련 행정 정보를 종합적으로 정리하여 제공하는 자료이다. 포함 항목에는 사 업체 기본 현황, 인허가 일자, 영업상태,  전문인력, 자본금, 시설장비 등이 포함된다.본 자료는 데이터가 자동 갱신됨으로써 가장 최근의 데이터를 제공하며지역 내 대기오염물질 배출사업장의 적법 운영 여부를 확인하고 행정업무의 투명성을 높이며, 정책 수립과 공공 서비스 품질 향상에 활용될 수 있도록 표준화된 형식으로 제공된다.*대기오염물질배출시설설치사업장 인허가 정보 - 양천구의 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소정보
