summary_user: 국내 공항의 정시·비정시 항공기상관측 전문(METAR/SPECI)을 ICAO 표준 교환모델(IWXXM) XML 형식으로 담은 전국 범위의 건별 관측 전문입니다. 항공사·운항관리자·조종사가 특정 공항의 현재 바람·시정·구름 상태를 확인해 운항계획을 세우는 데 쓰고, 분석가는 공항별 관측 이력을 모으는 데 씁니다. 공항 ICAO 코드(icaoCode)와 공항명 필드가 있지만 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 공항 코드·이름 매핑이나 같은 기관(기상청) 코드로만 연결합니다.
limits: 포털 활용신청과 별도로 기상청 API 허브(apihub.kma.go.kr)의 인증키를 받아 경로 파라미터로 넣어야 호출된다. 범위는 전국이지만 행정구역 단위가 아닌 비공간 자료여서 지역 통계와 바로 붙일 수 없다.
