status: active
summary_user: 해양수산부가 발주한 해양폐기물 수거사업을 사업 단위로 담아 수거 시작·종료일, 수거사업명과 상세명, 수거 폐기물 유형, 수거처리량(톤), 발주기관, 시도·시군구를 제공하며, 범위는 전국이고 지역은 시군구 단위로 나뉜다. 지자체 담당자나 해양환경 분석가가 "우리 시군구에서 어떤 유형의 해양폐기물을 몇 톤 수거했나"처럼 사업별·지역별·연도별 수거 실적을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 이름 매칭이나 발주기관명으로만 이어 쓴다.
limits: 표준 행정코드 등 전역 조인 키가 없어 다른 지역 통계와 붙일 때는 이름을 직접 맞춰야 한다. 포털 활용신청 후 serviceKey가 필요하고 개발계정은 하루 10,000회로 호출이 제한된다. 육상 생활폐기물 배출·수거 지점 정보가 아니라 해양폐기물 수거사업 실적이므로, 생활폐기물 수거 지점을 찾는 용도로는 맞지 않는다.
