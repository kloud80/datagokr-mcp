summary_user: 부산광역시 민방위 비상급수시설의 수질 검사 결과를 측정지점·구군별로 담으며, 암모니아·납·수은·불소·세균·대장균·망간·맛·냄새·철 등 46개 항목의 검출/불검출 여부와 검출 시 수치를 제공한다(포털 기준 16개 구군 총 3,851개소). 시민이 "우리 동네 비상급수시설 물을 마셔도 되는가"를 확인하거나, 행정기관이 구군별 시설 수질 관리 현황을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 측정지점 이름·구군명 매핑으로만 이어 쓴다.
description_portal: 부산시에서 운영하는 민방위 비상급수시설 수질데이터를 개방합니다. 민방위 비상 급수시설이란 전쟁, 풍수해, 수원지파괴 등 민방위사태 발생으로 상수도 공급 중단 시 최소한 음용수 및 생활용수를 안정적으로 공급하기 위한 시설을 말합니다.개방된 데이터에는 측정지점, 측정구군, 암모니아, 납, 수은, 크롭, 불소, 세균, 대장균, 망간, 맛, 냄새, 세제, 철 등 46 항목에 대한 수질 검사 결과 검출/불검출여부, 검출시 수치를 제공합니다.시민들은 비상급수시설의 수질을 확인하고 급수시설을 이용할 수 있으며 행정기관에서는 수질을 측정값을 확인하고 수질 관리를 할 수 있습니다.중구 28개소, 서구 85개소, 동구 47개소, 영도구 220개소, 부산진구 463개소, 동래구 345개소, 남구 162개소, 북구 376개소, 해운대구 508개소, 사하구 279개소, 금정구 549개소, 강서구 41개소, 연제구 303개소, 수영구 133개소, 사상구 221개소, 기장군 91개소 등 총 3,851개소가 있습니다.
