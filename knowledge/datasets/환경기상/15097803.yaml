summary_user: 경기도 오산시의 대형폐기물 처리 수수료를 품목별로 담은 파일로, 폐기물 구분·품목명·규격과 그에 따른 수수료를 한 행씩 정리한 기준표다(csv 약 9.6KB). 오산시 주민이 소파·장롱 같은 대형폐기물을 버리기 전에 "이 크기의 이 품목은 배출 스티커를 얼마에 사야 하나"를 확인할 때 쓰고, 민원 응대용 요금 기준표로도 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 시군구의 대형폐기물 수수료 파일과는 품목명·규격을 이름으로 맞춰 비교해야 한다.
limits: 오산시 한 곳의 수수료 기준표일 뿐이며, 수거 지점이나 배출량·처리현황 통계는 담지 않는다. 품목 코드가 없어 다른 지자체 자료와 연결하려면 품목명과 규격 표기를 직접 맞춰야 한다.
