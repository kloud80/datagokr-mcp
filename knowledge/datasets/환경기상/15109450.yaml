summary_user: "충청남도 계룡시에서 접수된 야생동물 구조 건을 한 건씩 담은 원천 데이터로, 접수번호별로 종명·분류(강·목·과)·멸종위기 등급·CITES 여부, 발견·접수·구조 일시, 발견 주소와 구조·방사 좌표, 발생 원인, 구조 결과와 체중·임상 진단을 기록한다. 지역 환경단체나 분석가가 '계룡시에서 어떤 종이 어떤 원인(예: 충돌·고립)으로 어디서 자주 구조되고, 그중 몇 마리가 방사되는가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 종 국명(ANML_KRLNG_NM)이나 주소·좌표 같은 이름·위치 매핑으로만 잇는다."
description_portal: 발견일시, 접수일시, 구조일시 등의 야생동물 구조 데이터 정보를 제공하는 충청남도 계룡시 야생동물 구조 데이터 조회 서비스
