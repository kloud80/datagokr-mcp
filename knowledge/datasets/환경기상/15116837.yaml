summary_user: 충청남도 서산시에 폐기물 배출을 신고한 사업장별로 상호명, 도로명주소, 폐기물 종류, 배출량(톤), 운반자, 처리업소, 처리방법을 담은 건별 원장 파일(CSV)이다. 서산시 안에서 어떤 사업장이 어떤 폐기물을 얼마나 내고, 누가 운반해 어느 업소에서 소각·매립·재활용하는지 확인하려는 사업자·환경 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호명·처리업소명 같은 이름이나 사업장 주소로 맞춰 이어야 한다.
description_portal: 본 데이터는 충청남도 서산시의 폐기물 배출신고 현황을 정리한 자료이다. 항목은 상호명, 전화번호, 사업장도로명주소, 폐기물 종류, 배출량(톤), 운반자, 처리업소명, 처리방법으로 구성된다. 상호명은 배출 사업장의 이름이며, 주소는 실제 위치를 나타낸다. 폐기물 종류는 신고된 항목의 유형이며, 배출량은 배출된 톤 수이다. 운반자는 수거 주체이며, 처리업소명은 처리 시설의 명칭이다. 처리방법은 소각, 매립, 재활용 등을 의미한다. 본 자료는 지역 내 폐기물 관리 실태를 파악하고, 환경 보호 정책 수립 및 행정 관리의 기초자료로 활용된다. 서산시청이 데이터를 수집·갱신하며, 공공기관과 시민에게 환경정보를 투명하게 제공하는 것을 목적으로 한다.
