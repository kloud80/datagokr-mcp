summary_user: 경기도 수원시 관내 특정토양오염관리대상시설을 사업장 한 곳당 한 행으로 담은 원천 목록으로, 신고번호·사업장명·업종·도로명/지번주소·위도·경도·완공(검사)일자·클린주유소 지정일을 포함한다(CSV 약 21KB). 시민이나 토지 이용을 검토하는 사업자가 '이 필지나 집 근처에 주유소 등 토양오염 우려 시설이 있는가'를 확인할 때 쓴다. 전역 조인 키는 없으므로 주소나 위도·경도 좌표로 필지·공간 레이어와 겹쳐 보거나 사업장명·주소를 다른 오염원 사업장 목록과 이름으로 맞춰 이어 쓴다.
description_portal: 경기도 수원시 특정토양오염 관리대상 현황에 대한 데이터로 연번, 토양오염 관리대상 상호명, 도로명주소, 좌표값 등의 항목을 제공합니다.  관내 토양오염 가능성이 있는 시설이 어디에 있는지 알 수 있어, 생활환경 안전에 대한 정보를 미리 확인할 수 있습니다. 오염 우려 지역을 사전에 파악하면 어린이 놀이공간, 주거지, 농지 등 이용 계획에 활용 할 수 있습니다. 시민 누구나 오염 관리 대상 시설 정보를 확인할 수 있어 행정 운영의 투명성이 높아지고 신뢰도 향상에 기여합니다. 오염이 우려되는 시설에 대한 시민 제보, 감시, 환경 개선 참여 등 적극적 시민 활동을 유도하는 등 다양한 분야에서 활용 할 수 있습니다.
