summary_user: 천수만 해역 자동측정소의 관측일자별 수온·염분·용존산소량·탁도·수소이온농도·전기전도도·클로로필 측정값을 정점(정점명·정점코드) 단위 건별 기록으로 담은 CSV 파일이다(약 5.9MB). 연구자나 지자체·양식업 관계자가 천수만에서 용존산소가 떨어지거나 클로로필이 치솟은 시기를 찾아 빈산소수괴·적조 징후를 살피는 데 쓴다. 전역 조인 키는 없어 다른 해역 자동측정망 파일과는 정점코드·정점명이나 같은 기관 코드 매핑으로만 잇고, 관측일자로 기상·수산 자료와 시점을 맞춰 쓴다.
description_portal: 해양환경공단이 제공하는 해양수질자동측정망 천수만 데이터에 대한 정보를 제공합니다. 본 데이터는 충남 보령과 서산에 걸친 천수만 해역의 해양수질을 실시간으로 측정·관리하기 위해 설치된 자동측정소의 위치, 좌표, 측정 항목, 측정 주기, 수질 변화 추이 등을 포함하고 있습니다. 주요 측정 항목에는 수온, 염분, 용존산소, 탁도, 클로로필-a 등이 있으며, 이를 통해 해역의 수질 상태와 환경 변화를 장기적·체계적으로 분석할 수 있습니다. 해당 정보는 적조, 빈산소수괴 등 해양생태 위해 요인의 조기 탐지, 해양환경 보전정책 수립, 수산자원 관리, 환경영향평가, 연구 및 교육 등 다양한 목적으로 공공기관, 연구기관, 지자체, 민간분야에서 폭넓게 활용됩니다.
