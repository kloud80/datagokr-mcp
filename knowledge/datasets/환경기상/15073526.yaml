summary_user: 대구광역시 수성구 관내에서 실내공기질 관리 대상인 시설을 한 행에 한 곳씩 시설군·시설명·소재지·데이터기준일자로 담은 시설 목록 파일(csv, 약 9KB)이다. 구민이나 보건·환경 담당자가 "우리 동네 어린이집·노인시설 등 다중이용시설 중 실내공기질 관리 대상은 어디이고 어떤 유형이 많은가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지(주소) 문자열을 맞추거나 같은 수성구 자료끼리만 연결한다.
description_portal: 본 데이터는 대구광역시 수성구 관내에서 「실내공기질관리법」에 따라 정기 점검이 의무화된 실내공기질 관리 대상 시설의 현황을 정리한 자료로, 시설명, 시설군, 소재지, 데이터 기준일자 등의 항목을 포함하고 있다. 이 자료를 활용하면 시설별 분포와 점검 시기, 시설 유형별 점검 이력을 파악할 수 있으며, 특히 어린이·노인 등 취약 계층이 주로 이용하는 실내공간의 공기질 관리 수준을 점검하는 데 도움이 된다. 본 데이터는 공공보건 정책 수립, 실내환경 안전 관리, 민원 대응, 공기질 개선사업 계획, 환경 점검 이력 분석 등에 활용될 수 있으며, 수성구는 관련 법령에 따라 해당 정보를 정기적으로 갱신하고 있다. 이로써 공공기관, 환경·보건 부서, 연구기관, 교육·의료시설 관리자 등에서 실내공기질 관리 체계 구축 및 시민 건강 증진을 위한 기초자료로 활용할 수 있다.
