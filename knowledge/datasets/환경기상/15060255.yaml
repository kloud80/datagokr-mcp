summary_user: 군산시 소재 사업장이 신고한 사업장폐기물 배출 내역을 사업장(상호)별 건 단위로 담은 CSV 파일(약 569KB)로, 신고기준년도·폐기물 종류·운반자·처리업소·처리방법·도로명주소가 들어 있다. 군산시 안에서 어떤 사업장이 어떤 폐기물을 내고, 누가 운반하며, 어느 업체가 어떤 방법으로 처리하는지 확인하려는 행정 담당자·분석가·인근 주민의 질문에 쓴다. 사업자번호나 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 상호·처리업소명 같은 이름이나 주소를 매칭해 이어야 한다.
description_portal: 이 데이터는 전북특별자치도 군산시에 위치한 각 사업장에서 발생한 사업장폐기물에 대한 배출자 신고 현황을 수록한 자료로, 상호, 신고기준년도, 폐기물 종류, 운반자, 처리업소명, 처리방법, 사업장소재지(도로명 및 지번 주소), 데이터 기준일자 등의 정보를 포함하고 있습니다. 본 자료는 폐기물의 발생에서 처리까지의 흐름을 추적할 수 있도록 구성되어 있으며, 사업장폐기물의 적정 관리 및 환경정책 수립, 행정 감독, 환경오염 예방 등을 위한 기초 데이터로 활용됩니다. 특히 지역 내 폐기물 처리 실태 분석 및 폐기물 배출 관리 체계 구축에 유용하며, 지속가능한 환경 관리와 자원순환 정책 수립에도 기여합니다.
