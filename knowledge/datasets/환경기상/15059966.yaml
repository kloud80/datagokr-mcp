summary_user: 해양환경측정망의 조사정점을 정점 단위로 담은 API로, 정점 코드·명칭·해역 구분·관측 항목과 경위도를 전국 425건 제공한다. 해양환경 조사체계를 살피는 분석가나 담당자가 특정 해역에 어떤 관측 정점이 어디에 있는지 확인하는 질문에 쓴다. 경위도(lon, lat) 좌표 키로 다른 좌표 기반 해양 수질 자료나 지도 데이터와 이어 쓰며, 그 외 명시된 조인 키나 코드표는 없다.
description_portal: 이 데이터는 해양환경공단이 운영하는 해양환경측정망의 조사정점 정보를 조회할 수 있도록 제공되는 공공데이터 API 서비스이다. 이용자는 관측 정점의 코드, 명칭, 경위도 위치 등 기본 공간 정보를 확인할 수 있으며, 정점이 포함된 해역 구분과 관리 단위에 대한 구조화된 정보를 함께 조회할 수 있다. 또한 정점에서 수행되는 관측 항목의 종류, 측정 장비 구성, 조사 주기 등 운영 특성을 종합적으로 파악할 수 있도록 관련 정보를 제공한다. 아울러 정점별 배치 현황과 표준화된 데이터 형식을 제시하여 각 정점에서 생산되는 해양환경자료와의 연계성을 높이고, 이용자가 해역별 조사체계와 공간적 분포를 이해하는 데 필요한 기초 정보를 제공하는 서비스이다.
