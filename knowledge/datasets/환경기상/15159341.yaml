description_portal: '광주광역시 남구 생활폐기물 배출량 데이터입니다.해당 데이터는 광주광역시 남구청 환경관리과(☎062-607-3651)에서 제공하고 있습니다.이 데이터는 2025년 광주광역시 남구에서 매달 배출된 생활폐기물의 양을 기록한 데이터입니다.월별로 배출된 생활폐기물은 톤 단위이며, 측정된 폐기물의 총량을 나타냅니다.생활폐기물은 종량제류, 음식물류, 재활용류, 대형폐기물 이렇게 4가지로 분류되어 있습니다.- 종량제류 : 재활용이나 음식물로 분리되지 않아 전용 종량제 봉투에 담아 배출하는 일반 쓰레기- 음식물류 : 음식물 쓰레기 전용 봉투나 용기, RFID 기기를 통해 배출되어 사료나 퇴비로 재활용되는 폐기물- 재활용류 : 종이, 플라스틱, 캔, 유리 등 자원 재순환을 위해 분리배출 요령에 따라 배출하는 폐기물- 대형폐기물 : 가구, 가전 등 규격 봉투에 담기 어려운 대형물품으로 별도 신고 후 수수료를 내고 배출하는 폐기물※ 공공데이터는 기준 시점에 따라 변동될 수 있으므로, 상세 사항은 소관 부서에 문의하시기 바랍니다.'
