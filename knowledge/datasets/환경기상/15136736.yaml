summary_user: 해양환경공단이 수행한 해양정화 사업을 정화 지역 단위로 한 행씩 담은 원천 파일로, 정화·사업 구분, 지역명, 사업명, 시작·종료일과 정화구역의 형태·공간정보(좌표)를 전국 범위로 포함한다. 지자체·연구기관 담당자나 분석가가 '어느 해역에서 언제 어떤 유형의 해양쓰레기 정화사업이 이뤄졌는가'를 지도로 확인하고 정화 이력이 없는 연안을 찾는 데 쓴다. 전역 조인 키는 없어서 다른 해양쓰레기·오염사고·보호구역 데이터와는 지역명 매칭이나 공간정보(좌표) 기반 공간 결합으로 잇는다.
description_portal: 해양환경공단이 수행하는 해양정화 사업의 공간정보 데이터를 제공합니다. 본 데이터는 연안 및 해역별 해양폐기물 수거 활동의 위치, 정화구역, 사업수행 기간, 사업유형, 참여기관 등의 정보를 포함하고 있으며, GIS 기반 해양폐기물 관리체계 구축 및 정책 수립을 위한 기초자료로 활용됩니다. 공간정보는 좌표 기반으로 제공되며, 정화작업이 수행된 해역의 범위와 특성을 시각화하거나 분석하는 데 사용할 수 있습니다. 데이터는 사업연도, 지역구분, 수행기관 등으로 분류되며, 공공기관, 지자체, 연구기관 등에서 해양정화사업의 성과관리 및 계획 수립에 참고자료로 활용됩니다.
