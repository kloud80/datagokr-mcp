description_portal: '자원환경_환경컨설팅회사 데이터는 환경 관련 등록 및 인·허가 등 환경행정 절차에 대한 상담, 정보제공 및 대행하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 환경컨설팅회사 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 :기후에너지환경부 탈탄소녹색산업혁신과 / 044-201-6710 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
