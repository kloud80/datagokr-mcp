summary_user: 토양오염 우려가 큰 특정토양오염관리대상시설의 신고업소 수를 17개 시도별로 모은 집계 파일로, 석유류 시설(주유소·산업시설·난방시설 등 기타)과 유독물 시설로 나눈 업소 수를 담는다. 환경 분석가나 지자체 담당자가 '어느 시도에 주유소 같은 토양오염 우려 시설이 많은가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도별 통계와는 시도명(구분_시도)을 이름으로 맞춰 이어 쓴다.
description_portal: 토양환경보전법 제2조의 4에서 정의하고 있는 특정토양오염관리대상시설은 토양을 현저하게 오염시킬 우려가 있는 토양오염관리대상시설로서 환경부령으로 정하는 것을 말하며, 1, 석유류의 제조 및 저장시설, 2. 유해화학물질의 제조 및 저장시설, 3. 송유관시설, 4. 기타 위 관리대상시설과 유사한 시설로서 특별히 관리할 필요가 있다고 인정되어 환경부장관이 관계중앙행정기관의 장과 협의하여 고시하는 시설로서 17개 시도별 특정토양오염관리대상시설(토양환경보전법 제2조제3호) 신고업소수 현황(주유소, 산업시설, 유독물 등)
