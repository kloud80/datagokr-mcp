summary_user: 전북특별자치도 남원시에서 벙커C유·정제유 등 중질유를 쓰는 사업체를 업체별로 한 줄씩 담은 소규모 파일(csv 약 1.2KB)로, 사용유종·상호명·도로명주소·전화번호·생산품·연료사용량(리터)을 포함한다. 남원시 안에서 어떤 업체가 어떤 중질유를 얼마나 쓰고 무엇을 생산하는지 확인하려는 지역 환경·에너지 정책 담당자나 분석가가 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 배출시설·사업장 데이터와는 상호명이나 도로명주소를 맞춰 연결해야 한다.
description_portal: 데이터 설명이 데이터는 전북특별자치도 남원시에서 중질유(벙커C유, 정제유, 부생유 등)를 사용하는 사업체의 현황을 파악하고 관련 정보를 제공하는 것을 목적으로 합니다. 주로 석유화학 및 아스팔트 관련 업종의 중질유 사용량과 생산품에 대한 핵심 정보를 포함하고 있어, 남원시의 산업 구조 분석과 환경 정책 수립을 위한 중요한 기초 자료로 활용될 수 있습니다. 또한, 중질유 사용 업체 현황을 파악함으로써 지역 경제 활동의 특성을 이해하고, 에너지 사용 효율성 향상을 위한 정책적 의사결정을 지원할 수 있습니다.데이터 항목명사용유종, 상호명, 도로명주소, 전화번호, 생산품, 연료사용량기대 효과이 데이터를 활용하여 남원시의 에너지 정책을 더욱 효율적으로 수립하고 환경 규제를 개선하는 데 기여할 수 있으며, 관련 산업의 투명한 정보 공개를 통해 시민들의 알 권리를 충족시킬 수 있습니다.
