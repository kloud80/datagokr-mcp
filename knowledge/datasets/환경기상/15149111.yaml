summary_user: 서울 동작구에서 건설폐기물 수집·운반·중간처리업 인허가를 받은 업소를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·영업상태·폐업일·주소·전화번호·중부원점TM 좌표(XCRD·YCRD)·폐기물처리업 구분·허가보관량 등을 포함한다. 동작구에서 현재 영업 중인 건설폐기물 처리업체가 어디에 있는지, 언제 허가받았고 휴·폐업했는지를 확인하려는 주민·건설사업자·환경 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: '서울시 동작구 건설폐기물처리업 인허가 정보 (https://data.seoul.go.kr/dataList/OA-19321/S/1/datasetView.do) 입니다.동작구의 건설현장에서 나오는 건축폐기물을 수집·운반 및 중간처리하는 업소정보를 제공합니다.인허가일자, 도로명주소, 도로명우편번호, 사업장명, 환경업무구분명, 좌표정보, 폐기물처리업구분명 등의 정보를 제공합니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
