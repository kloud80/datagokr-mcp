description_portal: '황사란 먼지연무의 일종으로, 주로 대륙의 황토지대에서 불려 올라간 다량의 황토먼지가 온 하늘을 덮고 떠다니며 서서히 하강하는 현상을 말합니다.황사 데이터셋은 기상청의 목측 관측소에서 관측자가 직접 관측한 황사관측일을 대상으로, 황사와 연관된 PM10농도, 시정, 기사 등 다양한 데이터를 하나로 묶어서 제공합니다.* 제공요소별 보다 자세한 데이터는 기상자료개방포털의 다음 메뉴를 통해 확인하실 수 있습니다.- PM10농도: 데이터 → 기상관측 → 황사관측- 풍향·풍속, 기사, 시정: 데이터 → 기상관측 → 종관기상관측- 대기확산지수: 데이터 → 응용기상 → 생활기상지수- 레윈존데, 연직바람관측: 데이터 → 기상관측 → (고층) 레윈존데/연직바람관측- 황사일기도: 데이터 → 수치모델 → 수치분석일기도 → 분석일기도(황사)- 위성영상(황사): 데이터 → 기상위성 → 천리안위성2A호(기본관측자료 > RGB 황사)'
