description_portal: 본 데이터는 2026년 2월 12일을 기준으로 국립호남권생물자원관 대표홈페이지에 게시된 연구기술 정보를 정리한 자료입니다. 해당 데이터는 생물자원을 기반으로 한 기술 개발 및 지식재산 확보 현황을 보여주며, 기술의 활용 가능성과 연구기관의 성과를 파악하는 데 유용합니다. 구성 항목은 연번, 기술명, 기술설명, 출원번호, 출원일, 출원인, 분야로 이루어져 있으며, 연번은 1번부터 26번까지 오름차순으로 정렬되어 있어 목록의 체계적인 열람이 가능합니다. 출원인 항목은 국립호남권생물자원관 및 ㈜바이나리로 구성되어 있으며, 이는 기술의 단독 또는 공동 출원 여부를 나타냅니다. 분야 항목에는 곤충 포집, 해충 포집·박멸, 건강기능식품, 의약품, 생활하수 및 축산폐수 처리 등 생물자원의 응용 분야가 다양하게 포함되어 있습니다. 본 데이터는 기술이전, 특허 관리, 연구개발 기획, 산업 연계 등 다양한 목적으로 활용될 수 있으며, 생물자원 기반 기술의 산업적 활용 가능성을 제시하는 기반 자료로도 유용합니다.
