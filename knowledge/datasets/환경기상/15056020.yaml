summary_user: 제주특별자치도가 「악취방지법」에 따라 관리하는 도내 악취배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 구분·사업장명·소재지·부지면적(제곱미터)·데이터기준일자를 제공한다. 주민이나 분석가가 '우리 동네 근처에 어떤 악취배출 사업장이 있고 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '제주특별자치도에서 관리하는 도내 악취배출시설과 관련한 데이터를 제공합니다.항목: 구분, 사업장명, 소재지, 부지면적 등*「악취방지법」에 의거하여 관리됨- 악취배출시설: 악취를 유발하는 시설, 기계, 기구, 그 밖의 것으로서 환경부장관이 관계 중앙행정기관의 장과 협의하여 환경부령으로 정하는 것- 악취배출시설에서 배출되는 악취의 배출허용기준은 환경부장관이 관계 중앙행정기관의 장과 협의하여 환경부령으로 정함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1361'
