summary_user: 충청남도 보령시에서 포획된 유해야생동물을 포획 건별로 기록한 행정 원천자료로, 보고·포획일자, 개체 종류, 포획유형, 포획지 주소와 위도·경도, 포획개체수, 지역유형을 담는다(CSV 파일 약 44KB). 농민이나 시 담당자가 '보령시에서 어떤 동물이 어느 시기·어느 지역에서 주로 포획되는가'를 확인하거나 포획 지점을 지도에 찍어 피해 다발 지역을 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 포획지 주소·좌표나 시도·시군 이름으로 공간·행정구역 매칭해 이어 쓰고, 종 이름으로 전국자연환경조사 종 분포 자료와 대조한다.
description_portal: 이 데이터는 충청남도 보령시에서 포획된 유해야생동물의 현황을 기록한 행정자료입니다. 주요 항목에는 포획일자, 개체 종류, 포획일자, 포획유형 등이 포함됩니다. 이를 통해 보령시에서 어떤 유해야생동물이 자주 포획되는지, 포획이 주로 어떤 이유로 발생하는지를 파악할 수 있습니다. 예를 들어 농번기에는 농작물 피해를 유발하는 멧돼지·고라니 포획이 많고, 생활환경 민원과 연관된 까치·까마귀류 포획 사례도 나타날 수 있습니다. 또한 처리 결과 데이터를 통해 방생률과 폐사율을 분석하면 해당 지역의 유해야생동물 관리 정책 효과를 평가할 수 있습니다. 이 자료는 보령시의 농업 보호, 인명 피해 예방, 생태계 균형 유지, 서식지 관리 및 인간-야생동물 갈등 해결에 중요한 기초자료로 활용될 수 있습니다.
