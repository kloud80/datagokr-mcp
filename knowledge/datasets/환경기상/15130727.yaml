description_portal: '경기도 평택시 내 골재채취업현황으로 등록업종, 등록번호, 업체명, 대표자, 소재지주소, 연락처 등 항목을 제공합니다.골재채취업은 건설 산업에서 필요한 골재를 채취, 선별, 세척 또는 파쇄하는 사업을 말하며, 골재의 원활한 수급과 재해 예방을 위해 효율적인 이용을 목적으로 합니다. 이 사업은 정부의 허가 및 등록 절차를 거쳐 운영되며, 골재의 종류와 채취 방식에 따라 다양한 유형이 존재합니다. 1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 생태하천과(031-8024-5035)'
