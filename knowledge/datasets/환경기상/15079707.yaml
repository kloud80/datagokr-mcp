description_portal: 본 데이터는 성주군 관내 대기배출시설 설치신고를 득한 사업장 중 벙커C유를 연료로 사용하는 업체의 현황을 체계적으로 관리하기 위해 구축된 자료이다. 각 사업장의 상호와 소재지 정보를 포함하여 위치 기반으로 업체를 확인할 수 있도록 하였으며, 연락처를 제공하여 민원 및 행정 대응을 신속히 수행할 수 있는 기반을 마련하였다. 또한 생산품 정보와 연료 사용 내역을 포함하여 벙커C유 사용량과 배출 특성을 파악할 수 있도록 구성하였다. 연간 연료 사용량을 기록하고 데이터 기준일을 명시함으로써 시점별 변동 사항을 추적하고 최신성을 확보하였으며, 이를 통해 환경관리, 대기배출량 분석, 정책 수립 및 산업 안전 관리 등 다양한 행정적 목적에 활용 가능한 기초자료로 활용될 수 있도록 설계되었다.
