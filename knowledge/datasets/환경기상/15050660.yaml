summary_user: 전남광주통합특별시 안의 유해화학물질 취급업소를 업소 한 곳(품목)별로 담은 파일로, 업종·등록번호·등록일자·업체명, 시도부터 읍면동까지의 소재지, 취급 품목, 사고대비물질 여부, 연간취급량(톤)을 기록한다. 주민이나 방재 담당자가 '우리 읍면동에 사고대비물질을 연간 많이 다루는 사업장이 어디인가'를 확인할 때 쓰고, 분석가는 화학사고 대비 계획을 세울 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 업체명이나 시군구·읍면동 이름을 맞춰 붙이거나 같은 기관의 등록번호로만 연결한다.
