description_portal: 해당 데이터는 환경책임보험 관련 통계 산출을 위한 기초 자료로 사용됩니다.통계기준일자를 기준으로, 인허가기관대구분을 통해 사업장의 관리·감독 주체를 식별하며, 책임보장계약구분과 책임보험적용연월로 보험 적용 여부와 시점을 관리합니다.사업장규모, 시설구분, 사업장행정구역코드를 통해 사업장의 특성과 위치 정보를 파악하고, 의무가입대상구분과 보험가입여부로 법적 의무 준수 현황을 확인합니다.또한 사업장상태구분과 보험가입대상코드를 통해 운영 상태와 보험 적용 범위를 분류하며, 건수 및 종별코드는 통계 집계와 분류 기준으로 활용됩니다. 마지막으로 등록일자는 데이터 입력 시점을 기록해 최신성 및 변동 내역 추적이 가능합니다.이러한 구조는 환경책임보험 정책 수립, 미가입 사업장 점검, 행정기관별 관리 실적 분석에 필수적인 근거 자료로 활용됩니다.
