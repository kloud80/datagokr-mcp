summary_user: "군산시 안의 석면조사 대상 건축물을 한 건물(동)당 한 행으로 건물명, 해당 동 이름, 도로명주소, 연면적을 담은 명단 파일이다(약 10KB 규모의 CSV). 주민이나 석면 관리 담당자가 '우리 동네의 어느 건물이 석면조사 대상인지, 규모는 얼마인지'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소나 건물명을 맞춰 붙여야 한다(예: 주소를 건축물대장이나 좌표 자료와 매칭)."
description_portal: 해당 데이터는 전북특별자치도 군산시에 위치한 석면조사대상 건축물의 현황을 체계적으로 기록한 자료입니다. 각 건축물의 명칭, 정확한 주소, 연면적(㎡) 등 주요 정보를 포함하여 석면 함유 여부 조사와 관리에 필요한 기초 자료로 활용됩니다. 이 데이터는 석면 노출로 인한 건강 위험을 예방하기 위해 군산시 내 건축물의 석면 포함 현황을 파악하고, 체계적인 석면 제거 및 관리 정책 수립에 중요한 역할을 합니다. 또한, 건축물의 안전성과 환경 보건 향상을 위한 지역사회 환경 관리와 주민 안전 보호에 필수적인 정보를 제공합니다. 이를 통해 군산시의 쾌적하고 안전한 주거 환경 조성에 기여하며, 관련 기관들의 효율적인 석면 관리 활동을 지원합니다.
