summary_user: 부산광역시 남구 관내에서 대기오염물질 배출시설을 둔 사업장을 사업장 한 곳당 한 행으로 담은 원천 목록입니다. 사업장명·대표자·소재지·전화번호·업종을 담으며, 파일 크기는 약 4.6KB(csv)입니다. 주민이나 분석가가 "우리 동네 근처에 대기배출시설 사업장이 어디에 있고 어떤 업종인가"를 확인하거나, 지도·점검 대상 목록을 만드는 데 씁니다. 사업자번호나 표준 코드 같은 전역 조인 키는 없어서, 다른 데이터와는 사업장명이나 소재지 주소를 매칭해서만 이어 쓸 수 있습니다. 예를 들면 인허가 사업장 원장이나 같은 남구의 다른 오염원 목록과 연결합니다.
description_portal: 「부산광역시 남구_대기배출시설현황」 데이터는 남구 관내 사업장 중 대기오염물질을 배출하는 시설의 설치 및 운영 현황을 체계적으로 관리하기 위해 구축된 환경기반 자료입니다. 본 데이터에는 사업장명, 소재지, 업종정보가 포함되어 있습니다. 이를 통해 지역 내 오염물질 배출 규모 파악, 환경위해도 분석, 대기질 개선정책 수립, 지도·점검 계획 마련 등 행정적·정책적 활용에 기초자료로 제공됩니다. 또한 배출시설의 적정 운영 여부 확인, 오염저감장치 설치·관리 점검, 생활환경 개선 등 남구의 지속가능한 환경관리 체계 구축에 필수적인 데이터입니다.
