description_portal: 환경부 국립환경과학원에서 운영하고 있는 물환경정보시스템의 수질오염총량 관리제도 중 지류총량 기초분석 결과에 관한 데이터를 제공합니다.이 데이터는 지류별 유량, 수위, 강우, 수질목표 등 주요 수문 인자를 종합적으로 분석하여 하천의 수질변화 경향과 안정성을 과학적으로 평가하기 위해 구축되었습니다.주요 항목에는 자료번호, 지류총량 코드, 분석항목명, 분석 시작일자 및 종료일자, 풍수위, 평수위, 저수위, 갈수위, 안전율, 수질목표, 분석년도와 월, 강우관측소 코드, 강우기준, 강우일수, 강우유량 구분 등이 포함됩니다.본 데이터는 지류별 수문학적 특성과 강우량의 변화를 정량적으로 파악할 수 있도록 구성되어 있으며, 하천별 유량 변동성 평가 및 지류총량 산정의 근거자료로 활용됩니다.또한 각 지류의 유량 특성과 수질목표 달성 현황을 비교·검증하여 수질개선의 자료로 사용할 수 있습니다.
