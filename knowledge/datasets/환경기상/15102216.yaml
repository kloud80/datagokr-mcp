summary_user: 울산광역시 동구 관할에서 실내공기질 관리법에 따라 공기질을 정기 측정해야 하는 시설(어린이집·의료기관·노인요양시설·대형건축물 등)을 시설 한 곳당 한 행으로 정리한 목록으로, 업소명·소재지·연락처·담당부서·기준일자를 담는다. 동구 주민이나 보육·요양 시설 이용자가 '우리 동네 어느 시설이 실내공기질 측정 대상인지', 환경보건 담당자가 '관할 관리 대상 시설이 어디에 있는지'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서 업소명·소재지 주소를 기준으로 다른 시설 목록(어린이집·의료기관 현황 등)과 이름·주소 매칭으로 연결하거나 같은 기관 자료끼리 묶어 쓴다.
limits: 측정 대상 시설의 현황 목록일 뿐 실제 실내공기질 측정값이나 시간별 대기질 수치는 담지 않는다. 범위는 울산 동구 한 시군구에 한정되고, 공통 조인 키가 없어 다른 데이터와 붙이려면 이름·주소 매칭이 필요하다.
