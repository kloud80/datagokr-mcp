summary_user: 전국 국가지하수오염측정망 관정의 지하수 수질 측정 결과를 측정망·회차·채수일·지점(관정)별로 담은 건별 측정 파일로, 수소이온농도·총대장균군·질산성질소·중금속·농약·휘발성유기화합물 등 20여 개 항목을 담는다(CSV 약 213KB). 분석가나 지하수 이용 사업자가 특정 관정이나 지역의 질산성질소·비소 같은 항목이 기준을 넘는지, 회차별로 어떻게 변하는지 확인하는 데 쓴다. 전역 조인 키는 없어 지점코드나 관정 이름을 매핑해 같은 기관(국가지하수정보센터)의 관정·관측정 정보와 연결해야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다. 지점의 위치 좌표나 행정구역이 들어 있지 않은 전국 단위 비공간 자료여서 지도화하려면 관정 위치 정보를 따로 구해야 한다.
