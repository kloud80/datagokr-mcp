summary_user: 제주시 클린하우스(생활폐기물 배출 거점)를 지점 한 곳당 한 건으로 담으며, 읍면동·단지명·유형, 도로명·지번 주소와 위도·경도 좌표, 종량제·재활용·유리병·스티로폼·폐건전지·폐형광등·음식물 수거함 수와 CCTV 설치 수를 함께 제공한다. 제주시 주민이 '우리 집 근처 클린하우스가 어디고 음식물 계량 수거함이 있는가'를 찾거나, 분석가가 읍면동별 수거함 배치와 CCTV 설치 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동명·주소 같은 이름 매핑이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 배출·수거 지점의 시설 현황만 담고 폐기물 발생량이나 처리 실적 통계는 담지 않는다. 범위는 제주시 한 곳이며, 다른 지자체 데이터와는 공통 코드가 없어 이름·주소로 맞춰야 한다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
