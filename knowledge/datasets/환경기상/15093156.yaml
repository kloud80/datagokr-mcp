summary_user: 한국환경공단 층간소음 이웃사이센터에 접수된 민원 중 2차 현장진단 대상 사례를 소음 원인별(뛰거나 걷는 소리, 망치질, 가구 끌기, 문 개폐, 가전제품, 악기, 기타)로 나눠 연도별 건수로 집계한 전국 단위 통계 파일이다. 층간소음 정책 담당자나 연구자가 '아이 뛰는 소리 같은 보행 소음이 해마다 민원 원인에서 얼마나 큰 비중을 차지하는가'를 확인하는 데 쓴다. 전역 조인 키는 없고 연도 컬럼만 있으므로, 다른 층간소음 민원 통계와는 연도를 기준으로 맞춰 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 이 테이블은 한국환경공단의 층간소음 이웃사이센터를 통해 접수된 민원 중, 2차 현장진단 대상 사례를 기준으로 소음 발생 원인을 분류하여 정리한 통계 자료입니다. 민원 신청자가 체감한 층간소음의 주요 원인을 유형별로 선택하여 접수한 내용을 바탕으로 집계된 건수를 제공하며, 연도별로 각 소음 유형이 얼마나 자주 문제로 지적되었는지를 보여줍니다.표에 포함된 소음 유형은 ‘뛰거나 걷는 소리’, ‘망치질’, ‘가구 이동’, ‘문 개폐’, ‘가전제품’, ‘악기’, ‘기타’로 구성되어 있으며, 이는 실생활 속에서 발생하는 대표적인 생활 소음을 중심으로 세분화된 분류입니다. 신청자는 민원 접수 시 소음을 유발하는 주요 행위를 직접 선택하거나 서술하고, 이 정보는 유형별로 정리되어 테이블에 반영됩니다.
