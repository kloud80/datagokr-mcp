summary_user: 해양수질자동측정망 정점(정점코드)별로 현장 센서가 실시간 관측한 COD·총질소·총인·암모니아성질소·질산성질소·인산성인·용존산소·수온·염분·pH·탁도·클로로필a 등 수질 항목과 기온·풍속·풍향·강수량·일사량 등 기상 항목을 관측 일시 단위의 건별 기록으로 담으며, 범위는 전국 해역이다. 연구자나 해양 관리 담당자가 '특정 정점 해역의 최근 용존산소나 총질소 농도가 어떻게 변하고 있는가'를 확인하거나 지역별 수질을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 해양수질센서정점코드(ocWqSnsrStaCd)를 같은 기관의 정점 정보와 코드·이름으로 매핑해 이어 써야 한다.
description_portal: 이 데이터는 해양수산부에서 해양수질자동측정망을 통해 실시간으로 측정되는 센서 정보를 제공하기 위해 제작되었습니다.  전체 데이터 조회 또는 정점코드, 측정시작/종료일시 등 특정 파라미터 입력을 통해 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 현장 센서가 실시간으로 측정한 해양 내 화학적 산소요구량(COD), 총질소량(T-N), 총인량(T-P) 등으로 구성되어 있습니다. 본 데이터는 해양환경 변화 모니터링, 해양 오염 관리정책 지원, 지역별 해양수질 비교분석, 연구 및 교육자료로 활용할 수 있습니다. 산업단지 인근 해역, 주요 어장관리, 해안 도시 계획 등 실시간 해양수질 데이터가 필요한 분야에서 해양 관리 기반 자료로 활용 가능합니다.
