summary_user: 충청남도 논산시에서 접수된 야생동물 구조 건을 한 건씩(접수번호 단위) 담으며, 종명과 분류(강·목·과·학명), 멸종위기·국제거래 등급, 발견·접수·구조 일시, 발생 원인, 구조 결과, 발견·방사 지점의 주소와 좌표를 포함한다. 지역 환경단체나 분석가가 '논산에서 어떤 종이 어떤 원인(충돌·고립 등)으로 주로 구조되고, 구조 후 방사까지 이어지는 비율은 얼마인가'를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 종명(국명·학명) 매칭이나 발견·방사 좌표를 이용한 공간 결합으로 잇는다.
limits: 논산시 한 지역의 구조 기록만 담으므로 충남 전체나 전국 비교에는 다른 시군·기관 자료를 따로 모아야 한다. 공통 코드 키가 없어 종 분포 조사 자료 등과 연결하려면 이름 표기를 직접 맞춰야 한다. 개발계정은 하루 5,000회까지 호출할 수 있다.
