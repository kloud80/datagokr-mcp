description_portal: 환경책임보험 전산망에서는 보험 미가입 상태를 체계적으로 관리하여 의무 가입 이행 여부를 정확히 파악하고 있습니다. 미가입통보대상여부는 해당 사업장이 보험 미가입으로 인해 통보 대상인지 여부를 나타내어 신속한 행정 조치를 가능하게 합니다. 미가입시기와 미가입종기는 보험 미가입 상태가 시작되고 종료된 날짜를 기록하여 미가입 기간을 명확히 산정할 수 있도록 돕습니다. 또한, 미가입일수는 실제로 보험에 가입하지 않은 총 일수를 산출하여 미가입 기간의 길이와 심각성을 파악하는 데 활용됩니다.책임/보장계약구분은 해당 보험 계약이 책임보험인지 보장성 보험인지를 구분하여 관리하며, 이를 통해 미가입 현황 분석과 정책 수립에 필요한 기초 자료를 제공합니다. 이러한 정보는 보험 미가입 관리와 법적 준수 점검, 행정 대응에 중요한 근거 자료로 활용됩니다.
