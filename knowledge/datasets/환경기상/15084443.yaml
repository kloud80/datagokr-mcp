summary_user: 대구광역시 달서구에 있는 폐수배출시설을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·대표업종·종별 규모 구분·도로명/지번 주소·위도·경도·관리부서·기준일자를 포함합니다. 주민이나 분석가가 '우리 동네 근처에 어떤 업종의 폐수배출 사업장이 몇 곳 있는가'를 확인하거나, 행정 담당자가 지역 내 배출시설 분포를 지도로 살펴볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓰며, 같은 달서구의 다른 환경 데이터와 기관 단위로 묶어 본다.
limits: 달서구 한 개 시군구만 다루므로 대구시 전체나 다른 지역과 비교하려면 각 기관 파일을 따로 모아야 한다. 사업장 고유번호 같은 공통 키가 없어 배출량·측정 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭 오류를 감안해야 한다.
