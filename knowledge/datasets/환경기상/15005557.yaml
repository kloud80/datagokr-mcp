summary_user: 의정부시 관내 다중이용시설 관리대상 업체를 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·도로명/지번 주소·연면적·위도·경도·데이터기준일을 담는다. 실내공기질 관리 대상이 어디에 얼마나 있는지, 예컨대 '우리 동네 근처에 연면적이 큰 대형마트·영화관 같은 관리대상 시설이 어디 있나'를 확인하거나 시설 분포 지도를 그리는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표로 공간 매칭하거나 시설명으로 맞춰 이어 쓴다.
description_portal: 경기도 의정부시 다중이용시설 관리대상 업체 현황 데이터는 시민 안전과 공공 편의를 보장하기 위해 수집·제공되는 자료로, 관내 다중이용시설의 기본 현황과 관리 정보를 종합적으로 담고 있습니다. 데이터는 번호, 시군명, 시설구분, 시설명, 소재지도로명주소, 소재지지번주소, 연면적(㎡), 위도, 경도, 데이터기준일 등의 항목으로 구성되어 있습니다. ‘번호’는 각 시설을 고유하게 식별할 수 있는 식별자 역할을 하며, ‘시군명’은 해당 시설이 위치한 행정구역 단위를 나타냅니다. ‘시설구분’은 대형마트, 영화관, 공연장, 체육시설 등 다중이용시설의 유형을 분류하여 관리·분석을 가능하게 합니다. ‘시설명’은 실제 운영 중인 업체 또는 시설의 명칭을 제공해 현장 확인 및 행정 관리에 활용됩니다. ‘소재지도로명주소’와 ‘소재지지번주소’는 시설의 위치를 도로명과 지번 체계로 모두 제공하여 공간적 정확성을 높였으며, 이를 기반으로 지도 시각화, 위치 기반 분석, 접근성 평가 등이 가능합니다. 또한 ‘위도’와 ‘경도’ 항목을 통해 GIS(지리정보시스템) 기반의 위치 분석이 가능하며, 시설 분포 지도 작성이나 인근 교통·인구 데이터와의 연계를 통해 다양한 연구 및 행정적 활용이 가능합니다. ‘데이터기준일’은 자료의 최신성과 유효성을 확인할 수 있도록 제공되어, 정책 수립이나 연구 활용 시 시의성을 보장합니다. 이 데이터는 다중이용시설의 안전관리, 재난 대비, 화재 예방, 인구 밀집도 분석, 상권 및 소비 패턴 연구 등 다양한 분야에서 활용될 수 있습니다. 특히 지방자치단체는 이를 통해 안전 점검 계획을 수립하거나, 특정 지역 내 시설 과밀 여부를 분석할 수 있으며, 민간 연구자나 기업은 도시계획, 상권 분석, 부
