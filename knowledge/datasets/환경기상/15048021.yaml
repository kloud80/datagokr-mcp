summary_user: 올바로시스템에 등록된 사업장일반폐기물의 2024년 실적보고를 사업장·폐기물 종류별 연간 배출량(톤)으로 담은 파일 데이터이며, 개방에 동의한 사업장만 포함하고 전국 9,692행이다. 지자체 담당자나 분석가가 우리 관할에서 어떤 사업장이 어떤 폐기물을 얼마나 배출하는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 관할관청·업체명 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 한국환경공단에서 운영하는 폐기물관리시스템(올바로시스템)에 등록된 사업장일반폐기물에 대한 2024년 실적보고 데이터[기초시군구(관할관청), 사업장명, 폐기물분류, 폐기물구분, 폐기물명, 연간 배출량 등]를 제공합니다. 참고로 해당 데이터는 공공데이터포털에 데이터 개방을 동의한 사업장에 한하여 추출된 데이터 셋이며, 사업장에서의 데이터 입력 시점에 따라 다소 데이터가 달라질 수 있습니다. 또한 데이터의 임의 변경 및 수정은 불가하오니 이점 유의하여 활용 바랍니다.
