summary_user: 서울 광진구에 등록된 자동차 대수를 연료별(휘발유·경유·LPG·CNG·전기·수소·하이브리드 유형별 등)로 나눠 데이터기준일마다 집계한 4KB 남짓의 작은 CSV 파일이다. 구청·분석가가 '광진구 등록차 가운데 전기·수소·하이브리드 같은 친환경차 비중이 얼마이고 경유차는 얼마나 남았나'를 확인해 탄소배출 저감이나 충전 인프라 계획의 근거를 잡는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 구의 같은 통계나 배출원 자료와는 기준일과 지역명(광진구)을 맞춰 이어 붙여야 한다.
description_portal: 서울특별시 광진구 연료별(유종별) 자동차 등록현황과 관련된 자료로 데이터 항목에는 압축천연가스(CNG), 경유, 수소, 엘피지, 전기, 하이브리드, 휘발유 등으로 나누어 데이터를 제공합니다. 하이브리드는 휘발유+전기, 경유_전기, LPG+전기 등으로 분류됩니다. 활용목적 및 특징- 차량에 따른 연료사용 특성을 파악하거나 연료별 자동차등록현황을 유형별로 분석, 교통,환경,에너지 수급 관리 정책 근거 제공에 활용될 수 있습니다. 아울러 행정기관의 교통 인프라조정 및 탄소배출 저감 계획 수립등 행정수요에 대응하기 위한 근거자료로 활용될 수 있습니다.
