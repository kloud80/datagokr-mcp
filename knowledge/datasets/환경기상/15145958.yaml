description_portal: '기상청  수치모델을 기반으로 예측한 전국 8개  해수욕장 지점에 대한 1시간 간격 이안류 예측지수입니다. 데이터는 8개 지점에 대한 명칭, 위치정보로 구성된 지점정보와 지점번호, 발표시각, 예측시각, 위험등급으로 구성된 예측자료입니다. 이안류는 해안에서 바다 방향으로 빠르게 흐르는 해류를 말하며, 폭이 좁고 유속이 빨라서 해수욕객이 휩쓸려 위험할 수 있습니다.이안류 예측지수는 관심/주의/경계/위험 4단계로 구분하여 제공하고 있습니다.- 관심(1) : 이안류 발생 가능성이 낮은 단계- 주의 (2): 이안류 발생 가능성이 있어 주의가 필요한 단계- 경계 (3): 이안류 발생 가능성이 높아 경계가 필요한 단계- 위험(4) : 이안류 발생 가능성이 매우 높아 위험한 단계'
