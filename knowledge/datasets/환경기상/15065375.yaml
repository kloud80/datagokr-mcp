summary_user: 한국환경공단 영농폐기물관리시스템에서 쓰는 품목코드 체계를 담은 코드표 파일로, 영농폐기물을 비닐류·농약용기류·종말품으로 나누고 세부 품목마다 코드·이름·상위품목·품목레벨을 부여한 계층 구조를 행 단위로 담는다(파일 크기 625바이트의 소규모 CSV). 지자체·농협·민간 수거업체 담당자나 분석가가 '하우스비닐이나 폐농약유리병이 어느 분류에 속하고 코드가 무엇인가'를 확인하거나 수거·재활용 기록의 품목명을 표준화할 때 쓴다. 전역 조인 키는 없어서, 같은 기관의 영농폐기물 관련 데이터에 품목코드나 품목명을 매핑해 붙여 쓰고, 상위품목코드로 자기 자신과 이어 계층을 펼친다.
description_portal: '이 데이터는 한국환경공단의 영농폐기물관리시스템에서 사용하는 품목코드 체계를 나타냅니다. 농업 현장에서 발생하는 폐기물을 비닐류, 농약용기류, 종말품(목재·플라스틱·고철 등)으로 구분하고, 각 세부 품목(예: 하우스비닐, 폐농약유리병, 폐플라스틱 등)에 고유한 코드와 계층 구조(상위·하위 품목코드)를 부여하여 관리합니다.이를 통해 영농폐기물의 수거·재활용·폐기 과정을 체계적으로 관리할 수 있습니다.또한, 해당 코드 체계를 활용하면 지자체, 농협, 민간 수거업체 등 다양한 이해관계자 간의 데이터 표준화를 이끌어냄으로써 농민들이 이해하기 쉽게 정보를 전달할 수 있습니다.'
