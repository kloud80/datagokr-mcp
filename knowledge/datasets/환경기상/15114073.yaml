description_portal: 부산광역시 보건환경연구원에서 설치한 미세먼지신호등으로 미세먼지, 초미세먼지, 오존 상태 등 표출 및 예보한다.   미세먼지 신호등은 대기 중 미세먼지 농도에 따라 색깔로 상태를 쉽게 알려주는 시각적 정보 시스템입니다. 보통 초록, 노랑, 빨강 세 가지 색으로 표현하며, 미세먼지 농도가 좋거나 나쁨을 한눈에 알 수 있도록 도와줍니다. 미세먼지 신호등은 주로 설치 목적과 기능에 따라 여러 종류로 나뉩니다. 크게는 기본형 신호등, 스마트 신호등, 통합 환경 신호등 등으로 분류할 수 있다.1. 기본형 미세먼지 신호등2. 스마트 미세먼지 신호등3. 통합 환경 신호등미세먼지 신호등 효과1. 대기질 인식 및 경각심 제고미세먼지 상태를 직관적인 색깔(초록, 노랑, 빨강)로 알려 시민들이 현재 대기 상황을 쉽게 이해할 수 있음대기오염에 대한 경각심을 높여 개인 건강 관리와 생활 습관 개선에 도움2. 건강 보호 및 예방미세먼지가 나쁠 때 외출 자제, 마스크 착용, 실내 활동 권장 등의 행동 변화를 유도어린이, 노약자 등 민감 계층의 건강 피해를 줄이는 데 기여3. 환경 개선 및 정책 지원실시간 대기질 모니터링을 통해 문제 지역 파악 및 대응이 가능지방자치단체 및 정부가 대기오염 저감 정책을 수립하고 실행하는 데 기초 데이터 제공
