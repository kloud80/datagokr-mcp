summary_user: 충청남도 논산시 안에서 대기오염물질을 배출하는 사업소를 한 곳씩 담은 파일 목록으로, 상호·주소·대기오염물질 종수·데이터 기준일자로 구성된다(포털 기준일 2021-04-07, CSV 약 14KB). 주민이나 분석가가 '우리 동네 근처에 어떤 대기배출 사업소가 있고 몇 종 사업장인가'를 확인할 때 쓰고, 지자체 환경 관리 현황 파악에도 쓴다. 전역 조인 키나 사업자번호가 없으므로 다른 데이터와는 상호명·주소를 맞춰 보거나 지오코딩해서 이어 붙여야 한다.
limits: 사업자번호·인허가번호 같은 공통 키가 없어 기업 정보나 굴뚝 TMS 측정자료와 바로 조인할 수 없고, 상호·주소 문자열 매칭에 의존해야 한다. 범위는 논산시 한 곳의 사업소 목록이며, 배출량이나 실시간 측정값은 담지 않는다.
