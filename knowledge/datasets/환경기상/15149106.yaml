summary_user: 서울 동작구에서 대기오염물질 배출시설을 설치한 사업장의 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일·주소·업종·주생산품·배출시설과 방지시설의 운영시간·연간 가동일수, 중부원점TM 좌표(XCRD·YCRD)를 포함한다. 주민이나 분석가가 "우리 동네에 대기 배출시설을 둔 사업장이 어디 있고 지금도 영업 중인가"를 확인하거나 배출 사업장 분포를 지도로 그릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호로 다른 구의 같은 형식 인허가 데이터와 이어 쓴다.
description_portal: '서울시 동작구 대기오염물질배출시설설치사업장 인허가 정보(https://data.seoul.go.kr/dataList/OA-19371/S/1/datasetView.do) 입니다.동작구의 대기중에 존재하는 물질중 대기오염의 원인이 되는 배출시설을 설치한 업소정보를 제공합니다.인허가일자, 영업상태명, 도로명주소, 도로명우편번호, 사업장명, 환경업무구분명 등의 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
