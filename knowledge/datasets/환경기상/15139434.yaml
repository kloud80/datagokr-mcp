summary_user: 북한이 세계기상기구 기상통신망(GTS)으로 보낸 27개 지점(평양·원산·신의주·청진 등)의 시간·일 단위 관측 자료로, 기온·강수량·풍향·풍속·기압·습도·운량·시정 등을 지점별 건별 원천으로 담는다. 북한 지역의 장기 기후 변화나 특정 시기 강수·기온 상황을 확인하려는 기후·농업·보험 분석가가 "평양의 지난 수십 년간 여름 강수량 추이는 어떤가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 국내 ASOS 등 다른 관측 자료와는 지점명 또는 같은 기관의 관측지점번호 매핑으로만 이어 쓴다.
