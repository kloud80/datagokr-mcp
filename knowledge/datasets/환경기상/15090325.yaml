summary_user: 대전광역시 중구에서 신청·배출된 대형폐기물을 신청 건별로 담은 파일로, 신청일, 행정동 기준 수거지역, 품목, 규격을 기록한다. 주민이나 분석가가 중구 어느 행정동에서 어떤 대형폐기물(가구·가전 등 품목)이 언제 많이 배출되는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 수거지역의 행정동 이름을 매핑하거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 관내에서 배출된 대형폐기물에 대한 연번, 신청일, 수거지역, 품목, 규격에 대한 데이터 입니다 (대전광역시 중구 환경과에서 제공하는 데이터입니다.)데이터 업데이트 주기는 반기 1회로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 신청일은 대형폐기물 신청일자입니다.데이터 컬럼 중 수거지역은 행정동 기준으로 작성되었습니다.데이터 컬럼 중 품목, 규격은 배출하는 대형폐기물의 상세정보를 담고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
