summary_user: 충청남도 논산시의 유해야생동물 포획을 건별로 기록한 파일 데이터로, 보고일자·포획일자, 개체 종류, 포획유형, 포획지 시도·시군·상세주소와 위도·경도, 포획개체수, 지역유형을 담는다(CSV 약 29KB). 논산시에서 어떤 종이 언제 어느 지역에서 많이 포획되는지 알고 싶은 농업인·지자체 담당자·분석가가 계절별·지역별 포획 패턴을 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시도·시군 이름이나 포획지 좌표를 기준으로 공간·이름 매칭해 이어 쓴다.
description_portal: '이 데이터는 충청남도 논산시에서 2022년 6월 30일 기준으로 집계된 유해야생동물 포획 현황을 기록한 자료입니다. 주요 항목에는 포획일자, 동물 종명(예: 멧돼지, 고라니, 까치 등), 포획 지역, 포획 사유(농작물 피해, 인명 피해 위험 등), 포획 방법(덫, 총기, 포획틀 등), 처리 결과(폐사·이동·관리), 담당 기관 및 관리 주체 등이 포함됩니다. 이를 통해 논산시에서 어떤 종의 유해야생동물이 주로 포획되는지, 포획 원인이 무엇인지, 계절별·지역별로 발생하는 패턴이 어떠한지를 분석할 수 있습니다. 예를 들어 농작물 피해가 잦은 멧돼지나 고라니는 농번기와 맞물려 포획 건수가 증가할 수 있으며, 까치·까마귀류는 생활환경과 관련된 민원에 따라 변동될 수 있습니다. 또한 처리 결과를 통해 포획된 동물이 어떻게 관리되는지를 파악할 수 있어, 인간-야생동물 갈등 관리, 농업 보호 정책, 생태계 보전 전략 수립에도 중요한 기초자료로 활용됩니다.'
