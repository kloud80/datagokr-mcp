summary_user: 진주시 관내 사업장폐기물·지정폐기물 배출자의 신고·처리계획 확인 현황을 사업장 단위로 담은 원장 파일로, 상호·도로명주소·사업자등록번호와 함께 발생 폐기물 종류, 처리구분·처리방법, 운반자, 처리업소명을 기록한다. 지역 폐기물 처리업자가 진주시에서 어떤 사업장이 어떤 폐기물을 내고 어느 업체에 운반·처리를 맡기는지 파악하거나, 분석가가 배출 사업장과 처리업체의 연결 관계를 살피는 데 쓴다. 사업자등록번호(bizno)를 조인 키로 다른 사업자 원장이나 폐기물 처리업 허가 목록과 이어 쓰고, 사업장주소로 위치 기반 분석에 연결한다.
description_portal: '폐기물관리법 제17조 제2항 및 폐기물관리법 제17조 제5항에 따른 진주시 관내 사업장폐기물 및 지정폐기물 배출자 현황 현행화 목록(2026년 6월 10일 기준 경상남도 진주시 내 사업장명, 도로명주소, 발생되는 폐기물종류, 폐기물 처리방법, 폐기물운반자, 폐기처리자 등 사업장, 지정폐기물 수시배출사업장에 대한 신고, 처리계획 확인 현황 목록)＊보유 근거 : 폐기물관리법 제17조 제2항 및 폐기물관리법 제17조 제5항에 따른 사업장폐기물 배출자 및 지정폐기물 배출자 신고 및 처리계획 확인'
