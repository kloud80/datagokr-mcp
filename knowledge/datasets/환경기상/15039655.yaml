description_portal: 경기도 포천시에서 제공하는 실내공기질 관리법 적용대상 다중이용시설 현황 데이터입니다. 본 데이터는 「실내공기질 관리법」에 따라 관리 대상에 해당하는 포천시 관내 다중이용시설의 정보를 담고 있으며, 시설명, 주소, 세부시설군 등의 항목으로 구성되어 있습니다.해당 데이터는 법적 관리 대상 시설의 위치와 유형을 파악하는 데 활용될 수 있습니다. 실내공기질 관리 및 점검 계획 수립, 쾌적한 실내환경 조성을 위한 개선사업, 다중이용시설 이용 시 환경정보 확인 등의 기초자료로 활용될 수 있습니다. 본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
