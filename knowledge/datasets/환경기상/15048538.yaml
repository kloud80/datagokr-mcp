description_portal: 충청남도 공립나무병원의 운영을 통해 수집된 산림병해충 발생 유형별 통계자료로, 도내 수목 피해 현황을 체계적으로 파악할 수 있도록 구성된 데이터이다. 본 자료는 충해, 병해를 비롯하여 기상, 생리적 요인, 인위적 요인, 물리적 요인, 관리 부적정 등 다양한 발생 원인별로 산림 피해 유형을 구분하여 제공한다. 이를 통해 산림병해충 발생 특성과 원인을 종합적으로 분석할 수 있으며, 예방 및 방제 대책 수립에 활용된다. 해당 통계자료는 공립나무병원의 운영 성과 관리, 산림 보호 정책 수립, 효율적인 수목 관리 및 산림환경 개선을 위한 기초 자료로 활용된다.
