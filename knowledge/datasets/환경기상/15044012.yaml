summary_user: 해양환경공단의 해양쓰레기 모니터링 조사 결과를 지역별로 쓰레기 개수와 무게로 정리한 집계 파일로, 내려받은 CSV는 1,218바이트 규모의 작은 표다. 연안·도서 지역 중 어디에 해양쓰레기가 많이 쌓이는지 비교하려는 지자체 담당자나 해양환경 분석가가 관리 우선순위를 정하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름을 맞춰 연결하거나 같은 기관의 해양오염 자료와 나란히 놓고 본다.
description_portal: 해양환경공단이 수행하는 해양쓰레기 모니터링 조사 결과 정보를 제공합니다. 본 데이터는 우리나라 주요 연안 및 도서 지역을 대상으로 조사된 해양쓰레기의 발생 현황, 밀도, 구성 비율, 유형별 분포 등과 관련된 정보를 포함합니다. 모니터링은 정해진 지점과 주기에 따라 반복 수행되며, 조사 방법, 조사 지역, 시기, 쓰레기 분류 기준 등의 세부 항목도 함께 제공됩니다. 해당 정보는 해양쓰레기 저감 정책 수립, 관리 우선순위 설정, 국제 보고자료 작성 등에 활용됩니다. 데이터는 지역별, 유형별, 시기별로 구성되어 있으며, 공공기관, 연구기관, 지자체 등에서 해양환경 개선 및 관리 계획 수립의 기초자료로 활용됩니다.
