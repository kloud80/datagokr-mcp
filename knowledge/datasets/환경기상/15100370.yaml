summary_user: 부산광역시 동구의 환경오염물질 배출시설 57곳을 사업장 한 곳당 한 행으로 담은 CSV 파일이다(업체명·도로명주소·업종·전화번호·좌표). 동구 안에 어떤 업종의 배출시설이 어디에 있는지 알고 싶은 주민이나 분석가가 위치·분포를 확인하는 데 쓴다. 도로명주소(address)와 위도·경도(coord)를 키로 삼아 다른 환경 공간 규제나 측정 데이터와 지도상에서 겹쳐 쓴다.
description_portal: 부산광역시 환경오염물질 배출시설 현황 데이터를 제공하는 본 자료는 지역 내 환경오염 관리에 필요한 핵심 정보를 체계적으로 정리한 공공데이터입니다. 업체명, 도로명 주소, 업종 등 배출시설의 기본 속성을 포함하여 시설의 위치적 특성, 산업 분야별 분포, 지역별 오염원 현황을 종합적으로 파악할 수 있도록 구성되어 있습니다. 이를 통해 지자체의 환경 정책 수립, 오염 저감 대책 마련, 환경영향 분석, 연구·학술 활동 등 다양한 분야에서 활용이 가능하며, 시민의 알권리 증진과 지역 환경 정보 접근성 향상에도 기여합니다.
