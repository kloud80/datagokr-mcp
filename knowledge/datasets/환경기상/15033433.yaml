summary_user: 경상남도 김해시에 등록된 폐기물 재활용업체를 업소 한 곳당 한 행으로 담은 파일로, 업종(종합·중간·최종재활용업), 업소명, 등록일자, 취급 폐기물 종류, 주소와 위도·경도를 포함한다. 김해시에서 특정 폐기물을 받아 재활용하는 업체가 어디에 있는지 찾는 배출 사업자나, 시 안의 재활용업체 분포를 지도로 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 좌표 기반 공간 결합으로 잇고, 후속 관리본인 전국폐기물처리업소표준데이터와 대조해 쓴다.
