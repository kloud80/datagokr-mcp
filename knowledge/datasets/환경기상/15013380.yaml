summary_user: 통영시 관내 특정토양오염관리대상시설(총 용량 2만리터 이상의 석유류 제조·저장시설)을 시설 한 곳당 한 행으로 담은 원천 목록입니다. 행마다 상호명, 지번 주소, 완공일자가 들어 있습니다. 토지 매입이나 개발을 검토하는 사람이 대상 필지 주변에 주유소나 유류 저장시설처럼 토양오염 우려가 있는 시설이 있는지 확인할 때 씁니다. 전역 조인 키는 없어서, 다른 데이터와는 지번 주소를 주소·좌표로 바꾸거나 상호명을 맞춰 연결합니다. 이렇게 하면 다른 환경 공간 규제 레이어와 겹쳐 볼 수 있습니다.
description_portal: 경상남도 통영시 관내 특정토양오염관리대상시설에 대한 기본정보(상호명, 소재지지번주소, 완공일자 등)로 구성된 테이터입니다.특정토양오염관리대상시설이란 위험물안전관리법 시행령 별 1의 제4류 위험물중 제1․제2․제3․제4석유류에 해당하는 인화성액체의 제조․저장 및 취급을 목적으로 설치한 저장시설로서 총 용량이 2만리터 이상인 시설(이동탱크저장시설을 제외한다)을 말합니다. 토양을 현저히 오염시킬 우려가 있는 토양오염관리대상시설로서 토양환경보전법 제12조 제1항에 따라 지자체 신고대상입니다. 통영시 관내 대상시설은 석유류의 제조 및 저장시설로, 산업시설, 주유소, 기타시설로 구분하여 관리되고 있습니다.각 지자체에 신고된 특정토양오염관리대상시설은 토양환경보전법 제13조에 따라 토양오염검사를 실시해야하며, 적법한 관리를 통해 토양오염으로 인한 국민건강 및 환경상의 위해를 예방하고, 시민이 건강하고 쾌적한 삶을 누릴 수 있도록 하겠습니다.
