summary_user: 성남시가 운영하는 폐기물 소각시설(에너지환경시설)을 시설 한 곳당 한 행으로 담은 소규모 원장 파일(CSV 약 1.3KB)로, 주소·건축면적·시설규모(톤)·소각형식·대기/수질 방지시설·굴뚝 높이를 담는다. 성남시 소각장의 위치와 처리용량, 어떤 오염방지 설비를 갖췄는지 알고 싶은 주민이나 지역 폐기물 처리능력을 비교하는 분석가가 쓴다. 전역 조인 키는 없어서 도로명·지번 주소나 시설명으로 다른 처리시설·환경 데이터와 맞춰 붙인다.
limits: 공통 조인 키가 없어 다른 데이터와는 주소·시설명 매칭으로만 연결된다. 범위가 성남시 한 곳의 시설에 한정되고, 소각량·발생량 같은 처리 실적 통계는 담지 않는다.
