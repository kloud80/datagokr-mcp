description_portal: 성남시 에너지환경시설 자료는 성남시에서 운영 중인 폐기물 소각시설에 대한 정보를 담고 있는 자료입니다. 이 자료는 시설의 위치, 소각용량, 소각방식(회전형, 고정형), 굴뚝 높이, 대기오염방지 시설, 수질오염방지 시설 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 성남시 폐기물 처리능력, 환경관리 수준, 에너지 회수 효율 등을 평가하는데 활용 할 수 있으며, 환경정책 등 다양한 분야의 기초자료로 활용 할 수 있습니다.
