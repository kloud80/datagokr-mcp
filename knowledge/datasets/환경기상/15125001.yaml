summary_user: 측정 연도, 행정구역명, 악취 측정 대행 항목명을 조건으로 해당 지역에서 그 악취 항목을 측정했는지 여부(측정유무)를 돌려주는 전국 범위의 비공간 조회 데이터이며, 측정 농도값이 아니라 항목별 측정 여부를 담는다. 지자체 환경 담당자나 분석가가 '우리 시군구에서 올해 특정 악취 항목을 측정했는가'를 확인할 때 쓴다. 응답에 전역 조인 키가 없어 다른 데이터와는 행정구역명·항목명 같은 이름 매핑이나 같은 기관(한국환경공단) 코드로만 이어 쓴다.
limits: 측정 여부만 확인되고, 실측 컬럼에 행정구역코드 같은 공통 키가 없어 다른 데이터와 직접 조인되지 않으므로 이름 매핑이 필요하다. 개발계정은 하루 1,000회로 호출이 제한된다.
