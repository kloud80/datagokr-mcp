summary_user: 경기도 시군별로 지정·운영 중인 기초환경교육센터를 기관 한 곳당 한 행으로 담은 현황 원장으로, 시군명·지정기간·운영기관명·홈페이지·도로명/지번주소·우편번호·WGS84 위경도를 포함한다. 주민이나 교사가 '우리 시군의 기초환경교육센터는 어디이고 어느 기관이 운영하나'를 찾거나, 분석가가 시군별 환경교육 거점 분포와 공백 지역을 볼 때 쓴다. 전역 조인 키는 없어서 시군명(sigun_nm)이나 주소 문자열로 다른 시군 단위 자료와 맞추고, 위경도로 다른 시설 좌표와 공간 결합한다.
description_portal: 이 데이터는 경기도 내 각 시군에서 운영 중인 기초환경교육센터의 현황을 정리한 자료로, 지역사회 환경교육을 위한 지정기관의 정보가 포함되어 있습니다. 주요 항목은 시군명, 지정기간, 지역명, 운영기관명, 기관 대표 홈페이지, 도로명주소 및 지번주소, 우편번호, 그리고 위치정보(WGS84 기준 위도·경도) 등으로 구성되어 있습니다. 이 데이터는 지역별 환경교육 인프라 분포 분석, 교육자원 연계망 구축, 정책 평가 및 신규센터 지정기준 설정 등에 활용되며, 지속가능한 환경 교육체계 마련을 위한 기초자료로도 중요하게 사용될 수 있습니다.
