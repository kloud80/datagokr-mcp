description_portal: '성남시에서 운영중인 미세먼지 쉼터 현황입니다(시설명,주소,운영시간,공기청정설비,환기시설설비,관리부서 등)※ 운영기간 : 매년 12월~3월(미세먼지고농도계절)성남시 미세먼지쉼터 현황 데이터는 고농도 미세먼지 발생 시 시민들이 일시적으로 대피하거나 휴식을 취할 수 있도록 마련된 공공 실내공간의 분포 및 운영 정보를 수록한 자료입니다.  미세먼지쉼터는 주로 노약자, 임산부, 어린이 등 건강 취약계층의 보호를 목적으로 설치되며, 평상시에는 일반 시민이 이용할 수 있는 공공휴게공간으로 운영됩니다. 성남시는 해당 데이터를 기반으로 쉼터의 지역별 분포와 수요를 분석하여 사각지대 해소 및 시설 확충 계획 수립에 활용하고 있습니다.'
