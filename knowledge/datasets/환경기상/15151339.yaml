description_portal: 이 데이터는 세탁기 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지와 이에 대응하는 200개의 라벨링 텍스트 파일로 구성되어 있으며, ‘images’ 폴더와 ‘labels’ 폴더에 각각 저장되어 있습니다. 이미지에는 다양한 모델과 형태의 세탁기가 포함되어 있으며, 실내 환경에서 정면, 측면 등 다양한 각도에서 촬영된 상태입니다. 세탁기의 도어, 제어 패널, 외관 등의 주요 구성 요소가 시각적으로 식별 가능합니다. 라벨링 데이터는 YOLO 형식으로 작성되었으며, 각 객체의 위치 좌표와 클래스 정보가 기록되어 있어 객체 탐지 및 분류 모델 학습에 활용할 수 있도록 구성되어 있습니다. 데이터는 일관된 파일 구조와 명명 규칙을 따르고 있어 효율적인 데이터 처리 및 학습에 적합합니다.
