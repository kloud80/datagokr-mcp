description_portal: 본 데이터는 경기도 용인시에서 수행한 토양오염 실태조사 현황을 제공한다. 주요 항목은 조사 연도, 조사 종류, 지점명, 조사지 지번주소로 구성되어 있으며, 토양오염도 측정 및 관리 대상 지점을 체계적으로 기록한다. 이를 통해 특정 지점의 토양오염 조사 결과를 연도별, 종류별로 구분하여 확인할 수 있으며, 오염 우려 지역, 산업시설 인근 지점, 민감 지역 등에서의 토양환경 상태를 종합적으로 파악할 수 있다. 자료는 토양환경 보전, 오염원 관리, 환경정책 수립, 학술 연구, 환경 영향평가 등 다양한 목적으로 활용된다. 시민과 행정기관, 정책 담당자, 연구자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 조사 현황이 반영되어 정기적으로 갱신된다. 공공데이터 개방을 통해 환경 정보의 신뢰성과 투명성을 강화하고, 지역 내 토양환경 개선과 지속 가능한 도시 발전에 기여하는 것을 목표로 한다.
