summary_user: 충청남도 대기환경측정소를 미세먼지 주의보·경보 발령 권역(북부·서부·동남부 3개)에 따라 분류한 측정소별 등록 목록으로, 측정소명·권역명·항목코드를 담은 소규모 CSV 파일(약 4.7KB)이다. 도민이나 분석가가 '우리 동네 측정소는 어느 경보 권역에 속하고, 권역 주의보가 나면 어떤 측정소가 해당되는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 에어코리아 측정소별 대기질·경보 자료와는 측정소명을 이름 매핑해 이어 써야 한다.
description_portal: 충청남도 내 대기환경측정소별 미세먼지 주의보·경보제 운영을 위해 측정소를 권역별로 분류한 자료이다. 도내 미세먼지 주의보 및 경보 권역은 북부, 서부, 동남부의 3개 권역으로 구분되며, 각 대기환경측정소는 해당 권역에 등록되어 관리된다. 이러한 권역 분류를 통해 지역별 대기질 특성을 반영한 미세먼지 경보 발령이 가능하며, 권역 단위로 주의보·경보 발령 및 해제 기준을 효율적으로 적용할 수 있다. 본 자료는 미세먼지 경보 체계의 체계적 운영, 신속한 상황 전파, 도민 건강 보호를 위한 대기환경 관리 정책 수립의 기초 자료로 활용된다.
