summary_user: 기상청이 태풍이 지나간 뒤 예보 당시 쓰지 못한 자료까지 모아 위치·강도·크기를 다시 분석한 사후 태풍정보(베스트트랙)를 담는 외부 API이며, 포털 설명상 보유기간은 2015년부터입니다. 연구자나 분석가가 특정 해 태풍의 실제 경로와 강도 변화를 확정치로 확인하거나, 예보 당시 발표값과 비교해 오차를 따질 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 묶을 전역 조인 키를 찾지 못해, 태풍 이름·번호나 같은 기상청 코드로 맞춰 연결해야 한다.
description_portal: '태풍예보 상황에서 실황분석 자료로 활용되지 못했던 자료들을 확보하여 보다 정밀하게 재분석된 사후 태풍정보생산주기: 연 1회 (매년 7월 전년도 자료 업데이트)보유기간: 2015~<참고사항>태풍 베스트트랙은 태풍예보 상황에서 실황분석 자료로 활용되지 못했던 자료들을확보하여 보다 정밀하게 재분석된 사후 태풍정보라고 할 수 있습니다. 이는 태풍예보 정확도 향상을 위해 태풍의 위치․강도․크기 등을 종합 재분석한 태풍 분석의 최종 결정체입니다. 즉, 안정적인 태풍예보시스템과 태풍 베스트트랙을 갖추어야만 태풍 분석·예보의 완전체를 형성한다고 할 수 있습니다.'
