summary_user: 충청남도 보령시 관내 실내공기질 관리대상 시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 구분·시설명·도로명/지번 주소·위도·경도·데이터기준일자를 포함한다(포털 설명상 24건). 시민이나 환경보건 담당자가 '보령시에서 실내공기질 관리 대상인 다중이용시설은 어디에 있나'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 좌표로만 이을 수 있다.
description_portal: 현대인들의 실내 생활 시간 증가와 실내공기질에 대한 관심 증대로 체계적인 실내환경 관리 필요성이 높아지고 있으며, 코로나19 팬데믹 이후 실내 공간의 환기와 공기질 관리에 대한 사회적 인식이 크게 향상되었습니다. 다중이용시설의 증가와 함께 이용자들의 건강 보호를 위한 실내공기질 관리법에 따른 체계적인 시설 관리와 감독이 중요해지고 있으며, 미세먼지, 이산화탄소, 포름알데히드 등 실내 오염물질로부터 시민들의 건강을 보호하기 위한 예방적 관리체계 구축이 필요합니다. 어린이, 노인 등 환경 취약계층이 이용하는 시설의 안전한 실내환경 조성에 대한 요구가 증가하고 있으며, 실내공기질 측정과 개선을 통한 쾌적한 실내환경 제공이 중요해지고 있습니다. 또한 시민들의 환경 건강권 보장과 실내공기질 정보에 대한 투명한 공개 요구가 높아지고 있어, 충청남도 보령시는 관내 실내공기질관리대상시설의 위치, 설치연도, 오염도검사 대상 여부 등 실내환경 보전과 시민 건강 보호에 필요한 종합적인 시설 현황 정보를 제공하고 있습니다.개방 데이터는 실내공기질관리대상시설현황의 상호명, 소재지 도로명주소, 지번주소, 위도, 경도, 설치년도, 오염도검사대상 여부 등 총 7개 항목 24건의 상세 정보를 포함하고 있습니다.시민·시설 이용자는 실내공기질 관리시설 현황 확인을 통해 안전한 다중이용시설 선택 및 건강관리에 활용하고, 환경보건 관련 기관·연구자는 실내환경 정책 수립 및 실내공기질 개선 연구에 활용하며, 지방자치단체·환경관리기관은 실내공기질 관리 정책 수립 및 시설 관리·감독, 환경보건 대책 마련에 활용할 수 있습니다.
