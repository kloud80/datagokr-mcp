summary_user: 경기도 내 환경전문공사업체의 신규 등록·변경등록 신청을 건별로 담은 원천 자료로, 신청연도·사업장명·사업자번호·업종·등록구분·신청일·승인일·처리상태·공사업 종류(대기/수질/소음진동)·영업소 주소·변경내용을 기록한다. 지자체 담당자나 발주처가 "이 업체가 수질 분야 환경전문공사업으로 등록돼 있고 최근 대표자나 기술인력을 바꾼 적이 있는가"를 확인하거나, 분석가가 연도별 신규 등록 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 사업자번호(bizregno)나 사업장명·주소를 맞춰 다른 인허가 사업장 원장이나 환경 업체 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 환경전문공사업체의 신규 등록 및 변경등록 신청 내역을 기록한 자료로, 신청연도, 사업장명, 사업자번호, 업종코드 및 업종명, 등록구분(등록/변경등록), 신청일, 승인일, 환경전문공사업종류(대기/수질/소음진동), 기술인력 변경사항, 영업소 주소 및 우편번호, 변경내용 등 총 19개의 항목으로 구성되어 있습니다. 환경전문공사업은 대기오염 및 수질오염 방지시설의 설계, 시공, 유지관리 등을 수행하는 전문 분야로, 이 데이터는 해당 업체의 법적 요건 충족 여부와 기술인력 현황, 등록 상태 등을 파악하는 데 활용됩니다. 특히 변경등록의 경우 대표자 및 기술인력 변동 내용이 포함되어 있어 행정적 신뢰성과 환경관리 역량 평가에 중요한 근거가 됩니다.
