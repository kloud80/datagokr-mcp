summary_user: 환경부 대기 측정자료를 바탕으로 측정일시(MSRMT_DT)별·조회항목별 시도 평균값을 서울·부산·대구 등 17개 시도 열로 나란히 담은 전국 단위 시도 집계 데이터로, 측정소 건별 원천값이 아니다. 시민이나 분석가가 "지금 우리 시도의 대기오염 평균 농도가 다른 시도보다 높은가"처럼 시도 간 대기질을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도 이름 매핑이나 측정일시를 맞춰서만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 대기 관련 정보(시도별 측정소목록에 대한 일반 항목의 시간 및 일평균 자료 및 지역 평균정보를 제공하는 시도별 실시간 평균정보 조회)입니다.
