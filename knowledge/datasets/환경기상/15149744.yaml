summary_user: 경기도 대기오염경보제에 따른 오존·미세먼지(PM-10)·초미세먼지(PM-2.5) 주의보·경보의 발령과 해제 이력을 건별로 담고, 북부·동부·중부·남부 권역별 발령·해제 시각과 농도, 발령·해제 측정소를 함께 기록한다. 주민이나 분석가가 "올해 경기 남부권에 오존 주의보가 언제 몇 번 내려졌고 얼마나 지속됐나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 측정소 이름이나 물질 코드(item_cd)·권역 코드(distrct_cd)를 이름 매핑하는 방식으로만 측정소별 시간별 대기질 자료 등과 이어 쓴다.
description_portal: 경기도 대기오염경보제 주의보·경보 발령 현황 자료로 대기오염물질에 대한 주의보 및 경보 발령과 해제 이력을 담고 있습니다. 오존(O3), 미세먼지(PM-10), 초미세먼지(PM-2.5) 권역별(북부권, 동부권, 중부권, 남부권) 발령 시간 및 농도 정보를 제공합니다.※오존(O3) 주의보의 경우 발령측정소와 해제측정소 정보 제공*본 자료는 경기도보건환경연구원에서 제공하는 측정데이터로 대기환경측정망 도시·도로변 대기측정소에서 송신된 원시자료입니다.제공되는 자료는 측정 기기의 오작동, 측정지점의 변화, 계절의 영향 등에 대한 보정을 거친 최종 확정자료와 다를 수 있습니다.
