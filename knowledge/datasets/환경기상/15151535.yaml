description_portal: 이 데이터는 행거 이미지를 기반으로 한 AI 학습용 데이터셋입니다. 총 200장의 이미지와 각 이미지에 대응하는 200개의 라벨링 텍스트 파일로 구성되어 있으며, 각각 ‘images’ 폴더와 ‘labels’ 폴더에 저장되어 있습니다. 이미지에는 다양한 형태, 재질, 크기의 행거들이 포함되어 있으며, 실내 환경에서 여러 각도와 거리에서 촬영된 구성을 보여줍니다. 행거의 기본 구조(지지대, 봉, 바퀴, 선반 등)가 명확히 드러나도록 촬영되었으며, 라벨링 데이터는 YOLO 형식으로 작성되어 각 이미지 내 객체의 위치 좌표와 클래스 정보가 텍스트로 기록되어 있습니다. 데이터는 객체 탐지 및 분류 모델 개발에 활용할 수 있도록 일관된 구조와 파일명 규칙을 따르고 있습니다.
