summary_user: 해양환경측정망 정점에서 조사한 해저 퇴적물의 강열감량, 산휘발성황화물, 화학적 산소요구량(COD), 입도, 함수율, 총유기탄소(TOC) 같은 환경지표를 조사일시·정점별 건 단위로 담은 전국 범위의 파일(CSV 약 27KB)이다. 연구기관·지자체 담당자가 "우리 연안 정점의 퇴적물 유기물 오염도가 해역·생태구별로 어떻게 다른가"를 확인하거나 퇴적물 환경평가의 기초자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 정점명·해역 이름이나 위경도(북위·동경) 좌표를 맞춰 해양수질 측정망 자료 등과 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양환경측정망 중 퇴적물 조사항목에 대한 데이터를 제공합니다. 본 데이터는 연안 및 특정 해역에 위치한 정점에서 조사된 해저 퇴적물의 중금속, 유기오염물질, 입도 분포, 총유기탄소(TOC) 등 환경지표에 대한 정보를 포함하고 있습니다. 퇴적물 분석 결과는 해양오염물질의 축적 상태를 평가하고, 해저 환경의 오염 특성과 장기 변화를 파악하는 데 활용됩니다. 데이터는 조사연도, 정점명, 조사항목 등으로 구성되며, 공공기관, 연구기관, 지자체 등에서 퇴적물 환경평가, 정책 수립, 오염원 추적 등의 기초자료로 사용됩니다.
