summary_user: 전북특별자치도 장수군에서 운영 중인 벙커C유 사용 사업장 목록으로, 사업장별로 소재지·전화번호·생산품(목욕업·아스팔트콘크리트)·연간 사용량(L)을 한 행씩 담은 작은 파일(약 451바이트)이다. 장수군 안에서 어떤 사업장이 중유(벙커C유)를 얼마나 쓰는지 확인하려는 주민·환경 분석가가 대기오염원이나 연료 사용 현황을 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·소재지 주소를 맞춰 보거나 같은 기관(장수군) 자료끼리만 연결한다.
description_portal: 전북특별자치도 장수군에 소재하고 운영중인 벙커C유 사용업체 현황을 데이터로 제공하고자 합니다.벙커C유는 원유를 정제해서 휘발유, 등유, 경유 등을 뽑아낸 후 남은 상압잔유에 경유유분을 혼합하고 점도, 인화점 등 성상을 조정하여 얻게 되는 중유중 하나입니다.데이터의 구성은 사업자명, 소재지, 전화번호, 생산품, 연간사용량, 담당부서, 담당부서 전화번호로 구성되어 있습니다.생산품은 목욕업과 아스팔트콘크리트로 분류 되어있습니다. 담당부서는 장수군청 환경과입니다.추가적인 데이터가 필요한 경우 공공데이터포털(data.go.kr) 누리집의 데이터 제공 신청을 통해 신청하여 주시기 바랍니다.
