summary_user: 수도권매립지에서 강우·풍속·가시거리 같은 기상 조건에 따라 폐기물 하역을 일시적으로 통제하는 기준을 기준일, 구분, 기상기준, 대상 폐기물 항목으로 담은 작은 기준표 파일(csv 약 1.2KB)이다. 매립지로 폐기물을 반입하는 수집운반 사업자나 배출 사업장이 '비나 강풍이 있는 날 어떤 폐기물의 하역이 멈추는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 대상 폐기물 이름을 맞추거나 같은 기관(수도권매립지관리공사)의 반입관리 데이터와 나란히 놓고 보는 방식으로만 이어 쓴다.
description_portal: '수도권매립지의 기상에 의한 일시하역통제기준 정보입니다. 개방항목으로는 기준일자, 구분, 기상기준, 대상 폐기물 의 항목을 제공합니다.일시하역통제기준은 기상 악화 등 현장 안전과 매립지 환경 보호를 위해 폐기물 하역(적재 및 하역)을 일시적으로 통제하는 기준입니다. 예를 들어 강우량(예: 5mm/시간 이상), 풍속(예: 10m/sec 이상), 가시거리(예: 50m 이하) 등이 기준에 포함됩니다. 이 기준은 폐기물 하역 시 발생할 수 있는 차량전도, 작업 지연, 안전사고 예방 및 매립지 환경 악화 방지를 위해 적용되며, 현장 상황과 기상 조건에 따라 탄력적으로 운용됩니다'
