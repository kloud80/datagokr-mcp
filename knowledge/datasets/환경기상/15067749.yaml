summary_user: 전북특별자치도 내 수목원 등에서 관리하는 목본식물(나무)을 수종별로 한 줄씩 담은 목록 파일로, 국명·학명·과(구분), 나무종류, 보유 수량, 보유연도, 수집경로, 원산지, 식재 위치를 담는다(CSV 약 109KB). 조경 실무자나 생태 연구자가 '이 수목원에 어떤 수종이 몇 그루 있고 자생종인지 도입종인지'를 확인하거나 지역 식물자원 목록을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학명이나 국명을 이름으로 맞춰 국가 생물종 목록 등과 연결해야 한다.
description_portal: 전북특별자치도 내 수목원 등에서 관리하는 목본식물(나무)의 상세 목록 데이터입니다. 이 자료는 각 식물의 국명과 학명, 소속된 과(科) 정보와 함께, 보유 수량, 원산지, 그리고 수집 또는 자생 여부 등 구체적인 정보를 포함하고 있습니다. 이 목록은 지역 내 식물자원의 다양성과 규모를 파악하는 데 중요한 기초 자료가 됩니다. 식물학자나 생태 연구자에게는 특정 수종의 분포와 특성을 연구하는 데 귀중한 정보를 제공하며, 조경 전문가나 관련 분야 학생들에게는 교육 및 학습 자료로서 높은 활용 가치를 지닙니다.
