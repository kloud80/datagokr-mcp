summary_user: 인천광역시 서구(서해구)에 있는 대기 배출시설 설치사업장을 사업장 한 곳당 한 행으로 담은 파일로, 사업장명·지번 및 도로명 소재지·업종이 들어 있다(CSV 약 91KB, 시군구 범위). 주민이나 분석가가 '우리 동네 근처에 어떤 업종의 대기 배출시설 사업장이 있는가'를 확인하거나, 지역 배출원 분포를 파악하는 데 쓴다. 전역 조인 키나 사업자번호가 없어서 다른 데이터와는 사업장명이나 주소(지번·도로명)를 맞춰 붙여야 하고, 이렇게 맞추면 주소 기반 지도화나 대기질 측정자료와 함께 볼 수 있다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없다. 그래서 굴뚝 TMS나 인허가 원장 등과는 이름·주소 매칭으로만 연결되고, 매칭 오류가 생길 수 있다. 범위는 서구 한 곳에 한정된다.
