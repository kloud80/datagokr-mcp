description_portal: 한국동서발전 각 사업소의 녹색제품 구매실적 정보는 지속가능한 소비를 위한 공공기관의 친환경 제품 구매 현황을 나타낸 데이터입니다.해당 데이터는 연도, 구분(각 사업소 및 본사), 총구매 금액(천 원), 녹색제품 구매 금액(천 원), 녹색제품 구매 비율(%) 항목으로 구성되어 있으며, 기관별·연도별 친환경 구매 실적을 비교하거나 정책 이행 현황을 점검하는 데 활용됩니다.학계 및 연구기관에서는 이 데이터를 통해 △공공기관의 친환경 구매 동향 분석 △기관 간 녹색제품 구매율 비교 △지속가능 소비·생산(SCP) 연구 △정부의 녹색조달 정책 효과 분석 △사업소별 환경경영 수준 평가 등에 활용이 가능합니다.또한 총구매액 대비 녹색제품 비중 추이를 통해 조직의 환경 책임성과 ESG 경영 실천 수준을 진단하거나, 유사 공공기관과의 구매 성과 비교에도 유용한 기초 자료로 활용할 수 있습니다.특히, 해당 데이터는 국가 녹색제품 조달 확대 정책과 연계된 연구나 행정기관의 성과관리 평가 기준 개발에도 참고할 수 있습니다.
