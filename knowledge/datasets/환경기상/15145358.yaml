description_portal: 기타수질오염원이란 「물환경보전법」 에 따라 특정수질유해물질 또는 페수배출시설에 해당하지 않지만 수질에 영향을 줄 수 있는 오염원을 의미합니다.대표적인 예로 폐수 배출량이 적은 소규모공장, 세차장, 음식점, 숙박업소, 목욕장, 정비업소 등이 있습니다.사업장 내에서 발생한  오염물질이 하수처리시설을 거치지 않고 하천이나 지하수로 유입될 수 있어 관리가 필요합니다.기타수질오염원은 폐수 배출시설로 분류되지는 않지만, 지자체에 설치 신고 후 관리되어야하며 일정 기준을 초과할 경우 정기적인 점검 및 개선 조치를 받아야 함니다.이 데이터는 업소명, 사업장위치, 특정시설구분 등의 항목으로 구성되어 있습니다. (특정시설 구분에 따라 시설별로 오염물질 배출 허용기준이나 정기 검사등이 다르게 적용됩니다.)
