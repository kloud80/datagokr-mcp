summary_user: 서울시가 관리하는 대기오염물질 배출시설 설치 사업장의 인허가 정보를 사업장 단위로 담으며, 인허가일자·영업상태(영업·폐업·휴업 등)·소재지 주소·업종·주생산품·배출시설과 방지시설 가동시간·연간 가동일수·좌표(XCRD, YCRD)를 포함한다. 환경관리 담당자나 분석가가 '우리 구에 현재 영업 중인 대기배출 사업장은 어디이고 어떤 업종인가'를 확인하거나 업종별·연도별 배출시설 현황을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
description_portal: ㅇ 이 데이터는 서울시에서 관리하는 대기오염물질 배출시설 설치 사업장의 인허가 현황을 제공합니다.ㅇ 주요 항목으로는 사업장명, 인허가일자, 영업상태(영업/폐업), 소재지 주소, 업종, 환경업무구분명, 주생산품명, 배출시설 및 방지시설 가동현황 등이 있습니다.ㅇ 인허가 상태별로 영업중인 사업장과 폐업·휴업·재개업한 사업장 정보를 모두 포함하며, 사업장별 좌표(X, Y)를 제공해 공간 기반 분석도 가능합니다.ㅇ 데이터는 **환경업무구분명(대기배출업소관리)**을 중심으로 구성되어 있으며, 업종별·연도별 대기오염물질 관리 정책 수립에 활용할 수 있습니다.ㅇ 최종수정일자 및 데이터갱신일자 정보가 포함되어 최신성을 관리할 수 있으며, 공공기관·연구기관에서 환경관리, 인허가 모니터링, 배출시설 통계 분석 등에 활용하기 적합합니다.
