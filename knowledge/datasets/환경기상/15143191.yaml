summary_user: 부산광역시가 낙동강하구에서 실시한 생태계모니터링 중 조류 조사 결과를 조사일자·권역별로 종명과 개체수, 조사면적, 공간좌표 단위로 담은 관찰 기록입니다. 낙동강하구에서 어떤 새가 어느 권역에 몇 마리 관찰됐는지, 철새 개체수가 시기별로 어떻게 달라지는지 알고 싶은 시민·연구자·환경분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 종명 이름 매칭이나 공간좌표(spceCrdntCn)를 통한 위치 대조로만 이어 쓴다.
description_portal: 부산광역시 낙동강하구 생태계모니터링 조류조사결과 데이터를 개방합니다.생태계 모니터링은 자연 환경과 생물다양성의 변화를 지속적이고 체계적으로 관찰·측정·기록하는 활동을 말합니다. 이를 통해 생태계의 건강성, 안정성, 회복력 등을 파악하고, 환경 변화나 인간 활동이 생태계에 미치는 영향을 평가할 수 있습니다. 그 목적은 기후변화, 개발, 오염 등 외부 요인에 따른 생태계 변화 확인, 멸종위기종이나 외래종의 분포 및 개체수 모니터링, 환경보전계획 수립 등을 위해 시행합니다.개방되는 데이터에는 모니터링 중 조류(새)에 대한 조사일자, 권역명, 종명, 개체수 등의 데이터를 제공합니다.
