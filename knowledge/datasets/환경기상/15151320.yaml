description_portal: 이 데이터는 소화기 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200개의 이미지와 200개의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에, 라벨링 파일은 ‘labels’ 폴더에 각각 저장되어 있습니다. 데이터에는 다양한 크기와 형태의 소화기가 실내 및 실외 환경에서 여러 각도와 거리에서 촬영된 모습이 포함되어 있습니다. 모든 라벨링은 YOLO 형식으로 제공되며, 각 소화기의 위치 정보와 클래스 값이 텍스트 파일 내 좌표값으로 기록되어 있습니다. 데이터는 객체 탐지 및 분류 모델 학습에 적합하며, 일관된 파일명과 폴더 구조를 가지고 있습니다.
