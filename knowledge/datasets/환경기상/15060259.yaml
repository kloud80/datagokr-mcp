summary_user: 인천광역시 옹진군에 사업장폐기물 배출을 신고한 사업장을 한 건씩 담은 원장으로, 상호·폐기물구분(사업장일반·지정)·폐기물 종류·운반자·처리업소·처리방법·도로명주소·신고기준년도를 담는다(CSV 약 33KB). 옹진군에서 어떤 사업장이 어떤 폐기물을 배출하고 누구에게 맡겨 어떻게 처리하는지 확인하려는 분석가나 위탁 관계를 살피는 사업자가 쓴다. 사업자등록번호(bizno)를 키로 사업자 등록 상태 정보나 다른 지자체의 폐기물 처리업 허가 목록과 이어 쓰고, 운반자명·처리업소명은 수집운반·처리업체 목록과 이름으로 맞춰 볼 수 있다.
