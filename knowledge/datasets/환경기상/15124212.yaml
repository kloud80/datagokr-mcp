summary_user: DMZ 일대 행정구역별로 1980년대말·1990년대말·2000년대말 대분류 토지피복지도를 비교해 시가지·농경지·산림·초지·습지·나지·수역의 변화량을 기간별로 집계한 파일(CSV 약 99KB)이다. 연구자나 정책 분석가가 '지난 20년간 DMZ 접경 지역에서 산림이나 농경지가 얼마나 줄고 시가지가 얼마나 늘었는가' 같은 질문에 쓴다. 행정구역코드와 행정구역명 컬럼이 있지만 전역 조인 키로는 확인되지 않아, 다른 데이터와는 행정구역 이름·코드를 직접 맞춰서 붙여야 한다.
limits: 실측상 전역 조인 키가 없어 다른 통계와 자동으로 결합되지 않고, 이름·코드 매핑을 거쳐야 한다. 공간 좌표가 없는 비공간 집계표라서 필지 단위 규제 판단이나 지도 중첩에는 바로 쓰기 어렵다. 포털 설명상 2010년말까지의 변화만 담는다.
