summary_user: 전국 공항 주변 항공기소음 자동측정망 지점별로 확정된 월별 평균 소음값(lden)을 공항·지점·주소·측정연월 단위로 담은 집계 파일이다. 공항 인근 주민이나 분석가가 "우리 동네 측정지점의 항공기소음이 월별로 어떻게 변했나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어 공항명·공항코드나 행정코드·주소를 이름·코드 매핑해 공항 운항 정보나 행정구역 통계와 잇는다.
description_portal: 소음ㆍ진동관리법에 따라 항공기소음 측정망을  전국적으로 설치, 운영  및 데이터를 확정 공개하고있습니다.항공기소음 자동측정망을 통해 전송한 데이터를 공항, 지점, 주소, 측정월, 값 등의 형태로 확정된 수치에 대하여 월별 평균값(lden)을 집계하여 제공합니다.
