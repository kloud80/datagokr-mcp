summary_user: 경상북도 청도군 관내에서 영업 중인 대기배출시설 설치 사업장을 사업장 한 곳당 한 행으로 담은 목록 파일(csv, 약 4.8KB)로, 사업장명·소재지·대표업종·종별(대기오염관리 등급)·전화번호·그린링크 등록 여부·데이터기준일자를 담는다. 주민이나 분석가가 '우리 동네 근처에 어떤 대기오염 배출 사업장이 있고 몇 종 사업장인가'를 확인하거나, 그린링크 등록 여부로 사업장 관리 현황을 살펴보는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 배출원·기업 데이터와는 사업장명이나 소재지 주소를 맞춰 붙이거나 같은 청도군 자료끼리만 연결한다.
description_portal: 경상북도 청도군 관내에서 현재 영업 중인 대기배출시설 설치 사업장에 대한 정보를 제공합니다.이 자료는 「대기환경보전법」에 따라 관리되고 있는 대기오염물질 배출시설을 설치·운영 중인 사업장에 대한 정보로, 청도군 지역 내 환경오염 감시 및 친환경 경영 현황 파악에 활용되는 행정 기초자료입니다.자료에는 사업장명, 소재지(도로명주소 및 지번주소 포함), 대표 업종, 종별 분류(시설의 종류 및 대기오염관리 등급), 그린링크 등록 여부, 그리고 데이터 기준일자 등의 항목이 포함되어 있습니다. ‘그린링크 등록 여부’는 사업장이 환경부의 통합환경관리 시스템인 그린링크(GreenLink) 에 등록되어 있는지를 나타내며, 환경정보의 공개 및 이행관리의 투명성 확보 측면에서 중요한 항목입니다.이 데이터는 청도군이 지역 내 대기오염 유발 사업장을 체계적으로 관리하고, 친환경 인증 유도, 정기점검 계획 수립, 환경 민원 대응, 환경 정책 수립 등을 추진하는 데 활용됩니다.
