description_portal: '울산광역시청이 제공하는 대기오염배출시설 관련 공공데이터는 울산시 전역에 설치된 대기오염배출시설의 종합적인 정보를 담고 있는 중요한 환경 데이터베이스입니다. 이 데이터는 울산광역시 직할 시설에 한정되어 있으며, 기초자치단체인 중구, 남구, 북구, 동구, 울주군이 관할하는 대기오염배출시설의 정보는 포함되지 앖습니다. 이 데이터셋은 다음과 같은 핵심 항목들을 포함하고 있습니다:1. 주소 정보: 모든 시설의 위치는 도로명주소를 기준으로 정확하게 기록되어 있어, 시설의 지리적 위치를 명확히 파악할 수 있습니다. 다.2. 연락처 정보: 각 시설의 일반전화번호와 인터넷전화번호를 포함한 종합적인 연락처 정보를 제공합니다. 3. 사업자 구분: 시설이 속한 사업자의 유형을 대기오염물질의 연간 배출량을 기준으로 "대기 4종" 또는 "대기 5종"으로 명확히 분류하고 있습니다. 이러한 분류체계는 「대기환경보전법」에 따른 법적 기준을 반영한 것으로, 각각의 특성은 다음과 같습니다:  가. 4종 사업장: 연간 대기오염물질 배출량이 2톤 이상 10톤 미만인 사업장으로, 중간 규모의 배출량을 가진 시설들이 해당됩니다. 이들 사업장은 상대적으로 엄격한 관리와 정기적인 모니터링이 요구됩니다.  나. 5종 사업장: 연간 대기오염물질 배출량이 2톤 미만인 소규모 배출 사업장으로, 비교적 낮은 환경 영향을 미치지만 누적적인 효과를 고려하여 지속적인 관찰이 필요합니다.'
