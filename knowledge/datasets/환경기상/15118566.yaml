description_portal: 광주시민의 숲 야영장은 광주광역시 영산강대상근린공원 내 시민의숲에 위치하고 있으며, 광주광역시 도시공원관리사무소에서 관리 운영하고 있습니다.캠핑 문화 확산에따라 자연속 힐링을 위한 광주시민의 숲 야영장은 2015년 운영을 시작으로 시설은 총 57면(자동차야영장 19면, 일반야영장 38면)으로 구성되어 있으며, 기타 편의시설로 취사장 2동, 샤워장, 화장실, 녹지공간 등을 갖추고 있습니다.본 데이터는 광주시민의 숲 야영장 이용객 현황 데이터로 이용기간, 이용면수, 이용금액, 이용객 수 등을 보유한 자료입니다.
