  - op: /getIvstgWMS
    name: 조사지점WMS조회
    endpoint: https://apis.data.go.kr/1480523/WaterqualityServices/getIvstgWMS
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: srs
        required: true
        example: EPSG:5179
        desc: 좌표 체계를 나타냅니다. 현재 EPSG:5179 좌표계를 지원합니다.
      - name: format
        required: true
        example: png
        desc: 반환 이미지 형식. png나 jpeg(jpg), gif 이미지 포맷을 지원
      - name: transparent
        required: true
        example: 'true'
        desc: 반환 이미지 배경의 투명 여부
      - name: width
        required: true
        example: '915'
        desc: '    반환 이미지의 너비(픽셀)'
      - name: height
        required: true
        example: '700'
        desc: 반환 이미지의 높이(픽셀)
      - name: bbox
        required: true
        example: 1119338.6628923914,1712725.515275519,1121719.8740798137,1716390.3853996482
        desc: 크기(extent)를 정의하는 범위(bounding box). 값은 srs 좌표체계 형식에 맞춰 minx,miny,maxx,maxy 를 입력
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
