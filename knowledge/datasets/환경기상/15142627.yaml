summary_user: 환경영향평가 대상 개발사업별로 수질 조사지점의 조사차수·주소·좌표와 클로로필-a·수온·pH·용존산소·부유물질·COD 같은 측정값, 사업 시행 전후 BOD·T-P 배출부하량 개요, 용수량 정보, 조사지점 공간정보(WMS·WFS)를 담는 사업 단위 원천 데이터로, 범위는 전국이고 위치는 개별 주소·좌표로 나온다. 분석가나 사업자가 "이 개발사업 주변 하천의 사업 전 수질은 어땠고, 사업 후 오염부하는 얼마로 예측됐나"를 확인하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못했다. 필수 파라미터인 사업 관리번호(mgtNo)를 다른 환경영향평가 데이터(협의 현황·사업구역)에서 먼저 받아 넘기는 방식으로 잇고, 좌표로 토지이용규제·개발사업 공간정보와 겹쳐 본다.
description_portal: 환경부 국립환경과학원의 환경영향평가 사업의 수질조사 개요, 조사, 예측의 속성정보 제공 및 공간정보(조사지점) 등에 대한 정보를 제공하는 서비스입니다.조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 클로로필-a(㎎/ℓ), 수온(˚C), 수소이온농도, 용존산소량(㎎/ℓ), 부유물질량(㎎/ℓ), 화학적산소요구량(㎎/ℓ)등 다양한 정보를 포함하며, 개요속성조회는 사업시행전 BOD 배출부하량(kg/일), 사업시행전 T-P 배출부하량(kg/일), 사업시행후 BOD 배출부하량(kg/일), 사업시행후 T-P 배출부하량(kg/일), 물재이용여부, 공공처리시설 연계 처리 여부등 다양한 정보를 제공합니다.용수량속성조회에서는 시간최대급수(용수)량(m3/일), 계획급수(용수)인구, 단위급수(용수)량(L/인∙일), 일최대급수(용수)량(m3/일)의 정보를 제공합니다.조사지점에 대한 공간정보는 WMS 및 WFS 형태로 제공되며, 사용자는 좌표체계, 반환 이미지 타입, 배경 이미지 포함 여부, 이미지 너비/높이 등의 설정을 통해 특정 좌표 기준의 수질 조사지점 포인트 이미지를 조회할 수 있습니다.
team:
