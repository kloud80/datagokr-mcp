summary_user: 경기도 시군의 정수장·취수장에서 채수한 상수원수를 대상으로 카드뮴·납·수은·비소 같은 중금속, 페놀·벤젠·트리클로로에틸렌 같은 유기물질, 암모니아성·질산성 질소 등 건강 관련 항목의 정기 검사 결과를 담는다. 행은 연도·분기, 시군, 정수장·취수장, 채수 지점과 채수일자 단위로 구성된다. 지역 주민이나 분석가가 "우리 시군 정수장 원수에서 특정 유해물질이 검출된 적이 있는가, 연도별로 달라졌는가"를 확인하는 데 쓴다. 전역 조인 키는 없고, 시군 코드·시군명(SIGUN_CD)이나 정수장·취수장 이름을 맞춰 경기도의 다른 데이터와 잇거나 하천·댐 수질 측정 자료와 같은 물 맥락에서 나란히 본다.
description_portal: 이 데이터는 상수원수의 수질 안전을 확보하기 위해 수행된 정기 수질검사 결과를 집계한 자료로, 경기도 시군의 정수장 및 취수장에서 채수된 원수를 대상으로 다양한 유해물질과 수질 항목을 측정한 결과를 제공합니다. 카드뮴, 납, 수은, 페놀류, 암모니아성질소, 질산성질소 등 건강에 영향을 미칠 수 있는 항목들이 포함되며, 수자원 오염 여부 및 음용 가능성을 과학적으로 판단하는 데 기여합니다. 이 데이터는 상수도 운영기관의 안전관리, 환경보건 정책 수립, 수질 이상 감지 및 대응체계 구축, 시민 건강 보호 등 다양한 공공정책 및 연구 분야에 활용될 수 있습니다.
