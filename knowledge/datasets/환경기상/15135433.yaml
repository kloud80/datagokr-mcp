summary_user: 경기도 대기환경 진단평가시스템이 연계하는 국내 정규 기상대(관측소)의 목록을 기상대 한 곳당 한 행으로 담는 기준정보로, 기상대코드·이름·측정 시작일·주소·위경도·격자 X/Y·사용여부가 들어 있다. 대기질 분석가나 연구자가 "경기도 측정소 주변 대기질을 모델링할 때 어느 기상대의 기상 자료를 붙일지"를 정하거나, 운영 중인 기상대 분포를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기상대코드(wether_lrge_cd)나 기상대명으로 같은 체계의 경기도 자료에 맞추거나, 위경도·격자 좌표로 측정소와 공간 매칭해 이어 쓴다.
description_portal: 경기도_대기환경_진단평가시스템_정규기상대정보 데이터는 국내 주요 기상대(관측소)의 위치와 운영 정보를 담고 있습니다. 주요 항목에는 기상대코드, 기상대명, 측정시작날짜, 주소, 위도·경도 좌표, 격자X/Y, 측정소순서, 사용여부가 포함됩니다. 이 데이터는 경기도 대기환경 진단평가시스템에서 기상 자료를 연계해 대기질 예측·분석에 활용됩니다. 연구자는 지역별 기상대의 분포와 운영 상태를 참고하여 모델링에 반영할 수 있고, 행정기관은 기상대 기반 데이터를 이용해 대기환경 관리와 정책 수립의 근거로 삼을 수 있습니다.
