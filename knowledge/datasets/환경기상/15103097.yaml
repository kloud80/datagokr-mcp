summary_user: 한국환경산업기술원이 관리하는 환경신기술 인증·검증 현황을 기술 1건당 1행으로 담은 전국 단위 CSV 파일이며, 포털 설명 기준 834건에 인증·검증 구분, 대분야·세부분야, 평가결과, 인증서·검증서 번호, 기술보유자, 기술명, 최초 유효기간 시작일과 최종 종료일이 들어 있다. 발주처나 사업자가 특정 업체가 보유한 폐기물·수질·대기 분야 신기술이 현재 유효한 인증인지, 언제 만료되는지 확인하는 데 쓴다. 인증서번호와 검증서번호가 같은 환경신기술 번호 키(env_new_tech_cert_no)로 잡혀 있어, 같은 번호 체계를 쓰는 다른 환경신기술·환경 업체 인증 자료와 번호로 이어 쓴다.
description_portal: 이 CSV 파일은 한국환경산업기술원에서 관리하는 환경신기술 인증 및 검증 현황을 정리한 자료입니다. 총 834건의 데이터가 수록되어 있으며, 기술별 기본 정보와 유효기간이 포함되어 있습니다. 주요 항목은 구분(기술검증·인증 여부), 대분야 및 세부분야, 평가결과, 인증서·검증서 번호, 기술보유자, 기술명, 최초 유효기간 시작일과 최종 종료일 등으로 구성됩니다. 예를 들어, 폐기물·수질·대기 등 다양한 환경 분야의 기술들이 기재되어 있고, 각 기술은 합격 여부와 함께 언제부터 언제까지 유효한지 명시되어 있습니다. 이 파일은 환경기술 관리 및 정책 수립 시 참고자료로 활용할 수 있으며, 기업별 기술 현황을 한눈에 확인할 수 있는 데이터베이스적 성격을 지닙니다.
