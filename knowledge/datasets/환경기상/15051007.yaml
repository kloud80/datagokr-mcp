summary_user: 경기도 구리시에 신고된 비산먼지 발생사업장(주로 공사장)을 한 곳씩 담은 건별 목록으로, 사업장명·공사장명·소재지(지번·도로명)·발생사업 종류·공사기간·대상사업 규모를 담으며 원본은 약 9KB 크기의 CSV 파일이다. 구리시 주민이나 분석가가 '우리 동네 근처에서 지금 먼지를 일으키는 공사가 언제까지 진행되나'를 확인하거나 시내 비산먼지 사업장 분포를 살피는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 소재지 주소를 지오코딩하거나 사업장명을 맞춰 보는 방식으로만 잇는다.
limits: 구리시 한 곳의 사업장만 담으므로 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다. 실측 컬럼에 전역 조인 키가 없어 대기 측정값이나 인허가 원장과 정확히 매칭되지 않으며, 주소·명칭 기준으로 연결하면 오매칭이 생길 수 있다.
