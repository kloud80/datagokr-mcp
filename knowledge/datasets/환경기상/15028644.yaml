summary_user: 부산광역시 동구에서 이루어진 석면 해체·제거 작업을 현장 건별로 담은 파일(csv, 약 7KB)로, 건물명·건축물 주소·공사현장명·해체제거업체명·작업기간·석면함유 자재 종류와 면적을 기록한다. 동구 주민이 우리 동네 어느 건물에서 언제 석면 철거 공사가 있었는지 확인하거나, 분석가가 구 단위 석면 자재 철거 규모와 업체별 작업 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 건축물 주소나 업체명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 본 데이터셋은 부산광역시 동구에서 수행된 석면 해체·제거 작업의 세부 현황을 종합적으로 제공합니다. 석면 해체·제거 작업이란 건축물이나 설비에 사용된 석면 자재를 안전하게 철거하고 폐기하는 과정을 의미하며, 이는 석면 비산으로 인한 환경오염을 방지하고 주민의 건강을 보호하기 위해 반드시 필요한 절차입니다. 본 데이터셋에는 건물명, 위치, 공사현장명, 석면 해체·제거 기간, 석면의 연면적 등 구체적인 항목이 포함되어 있어, 실제 현장의 작업 규모와 특성을 한눈에 확인할 수 있습니다. 또한 이 자료는 지자체와 관련 기관이 석면 관리정책을 수립·실행하는 데 중요한 참고 자료로 활용될 수 있으며, 안전한 생활환경 조성과 시민 건강 보호, 더 나아가 환경 위해 요소를 사전에 예방하는 데 기초 자료로서의 가치를 가집니다. 따라서 본 데이터는 행정적 활용뿐 아니라 연구, 교육, 정책 평가 등 다양한 영역에서도 유용하게 쓰일 수 있습니다.
