description_portal: 전라남도 영광군 디지털트윈 재난대응체계 시스템을 통해 구축된 도시침수정보 데이터입니다.도시침수정보는 극한 강우 시 발생 가능한 침수 상황을 정밀하게 예측·분석하고, 침수 취약 지역에 대한 선제적 대응을 위해 구축된 자료입니다.관측단위별 임계치 정보, 월별 및 일별 침수 이력, 침수 메모, 임계치 테이블 등으로 구성되어 있으며, 침수심, 강우량, 유역 특성, 배수계획 등을 종합적으로 반영합니다.재해 위험지역 사전 예측, 실시간 경보 시스템 연계, 대응 전략 수립, 침수위험지도 제작, 하수도 정비계획 및 도시방재 인프라 구축 등 재난예방 행정과 스마트 도시계획에 다양하게 활용됩니다.
