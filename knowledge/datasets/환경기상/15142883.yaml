summary_user: 환경영향평가 사업별 동식물상 조사 결과를 조사지점 단위로 담은 건별 원천 파일로, 조사차수·지점명·주소·좌표와 함께 출현종의 국명·학명·개체 수, 녹지자연도와 훼손·이식 수목량 정보, 조사지점 SHP 공간파일을 포함한다. 개발사업 예정지 주변에 어떤 동식물이 조사됐는지 확인하려는 주민·사업자, 또는 특정 종이 환경영향평가 조사에서 어디서 관찰됐는지 분석하려는 연구자가 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 사업코드(BSNS_CD)로 같은 기관의 환경영향평가 협의 현황·사업구역 자료와 맞추거나 좌표로 토지이용규제·생태자연도 같은 공간자료에 겹쳐 쓴다.
description_portal: 환경부 국립환경과학원의 환경영향평가 사업 중 동식물상 녹지자연도, 조사, 조사자, 조사범위의 속성정보 제공 및 공간정보(조사지점)에 대해 정보를 제공하는 서비스입니다. 조사속성에는 조사차수, 조사지점, 주소, 좌표와 함께 동식물상 정보(식물상/포유류/조류/양서파충류/곤충류/어류/저서생물(동물) 국명 목록, 식물상/포유류/조류/양서파충류/곤충류/어류/저서생물(동물) 학명 목록)를 포함하며, 조사범위속성은 조사에 대한 시물상조사유무, 포유류조사유무, 양서파충류조사유무, 곤충류조사유무, 어류조사유무, 저서생물(동물)유무정보를 제공합니다. 녹지자연도에는 사업시행전 후의 녹지자연도(면적), 녹지자연도(비율) 등급을 제공하며 훼손수목량(주), 재활용 이식수목량(주) 등의 정보를 제공합니다.조사지점에 대한 공간정보는 위치 정보를 가진 shp 파일을 제공하는 서비스입니다.공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다.
