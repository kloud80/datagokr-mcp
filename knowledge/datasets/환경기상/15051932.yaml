description_portal: '하천기본계획은 하천의 이용 및 관리에 필요한 기본적인 사항 등을 내용으로 하며 유역의 강우, 하천의 유량, 하도특성 및 이용현황 등을 조사 분석하여 하천의 종합적인 정비, 보전, 이용에 대한 계획을 수립합니다. 하천기본계획의 내용중 제방 및 호안 시설물대장의 정보를 조회할 수 있습니다.*용어설명제방(堤防, Levee/Dike)목적: 홍수 시 하천수가 범람하지 않도록 하천 외측을 따라 연속적으로 축조한 둑.위치: 하천의 양안 외측 경계선(하천구역 가장자리)을 따라 형성.기능: 통수 능력 확보, 배수체계 유지, 배후지(주거·농경지·산업단지) 침수 방지.호안(護岸, Bank protection/Revetment)목적: 흐름·파랑·선회류로 인한 하상·사면(하천 제방·둔치·제내지 측)의 침식과 붕괴를 방지.위치: 제방 비탈면, 둔치·수로 가장자리 등 유수에 직접 노출되는 사면.기능: 사면 안정, 국부 세굴 방지, 수로 형상 유지, 생태·경관 기능 부여 가능.※ 제공부서 : 서울특별시 물순환안전국 치수안전과(02-2133-3886)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
