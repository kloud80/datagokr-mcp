description_portal: 냉매는 냉동기 내부에서 순환을 통해 열을 흡수하고 온도를 낮추는 화학물질로써 오존층 파괴 및 지구온난화를 유발하는 물질입니다. 때문에 기후변화 대응과 오존층 보호를 위해서는 냉매의 통합적 관리가 필수 입니다.이를 위해 정부는 대기환경보전법 제5장의2에 따라 냉매관리제도를 시행하고 있으며, 세부내용은 환경부 고시 (냉매사용기기의 냉매관리기준 규정, 냉매회수기기 구조 및 성능기준에 관한 규정, 냉매회수 기술인력의 교육 등에 관한 규정, 냉매판매량 신고 및 특정물질 제조·수입·판매실적 보고 등에 관한 고시)를 통해 통합적 냉매관리에 앞장서고 있습니다.냉매정보관리시스템(RIMS)에 등록된 데이터로 냉매사용기기 정보 중 제작사, 유형(압축방식), 용도, 냉매종류, 1일법정냉동능력(RT)을 제공합니다.
