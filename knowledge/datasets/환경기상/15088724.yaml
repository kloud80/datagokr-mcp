summary_user: 냉매정보관리시스템(RIMS)에 등록된 냉매사용기기 정보를 기기 단위로 담은 전국 범위 CSV 파일(약 56만 바이트)로, 제작사·유형(압축방식)·용도·냉매종류·1일법정냉동능력(RT)을 담는다. 냉매 관리 정책 분석가나 냉동설비 업계가 '어떤 냉매종류가 어떤 용도·규모의 기기에 많이 쓰이는가'처럼 냉매 사용 현황과 기기 구성 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 사업장·주소 정보가 없어 다른 데이터와는 제작사명·냉매종류 같은 이름 매핑으로만 느슨하게 연결한다.
limits: 사업장·소재지 정보가 없는 비공간 데이터라 지역별 분석이나 사업자번호 기준 배출원 원장과의 직접 결합에는 쓸 수 없다. 냉매 실제 배출량·회수량이 아니라 기기 속성만 담는다.
