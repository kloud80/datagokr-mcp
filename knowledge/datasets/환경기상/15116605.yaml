summary_user: 울산시설공단이 관리하는 미세먼지 알리미(표출 기기)를 기기 한 대당 한 행으로 정리한 현황 파일이며, 관리번호·관리부서·설치장소·설치연도·표출부 면적·표출내용을 담고 있습니다(CSV 880바이트, 활용신청 없이 내려받음). 시민이나 지자체 담당자가 공단 시설 중 어디에 미세먼지 알리미가 있고 언제 설치됐는지 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와 이으려면 설치장소 이름을 에어코리아 측정소나 공단 시설 목록과 직접 맞춰 봐야 합니다.
description_portal: 울산시설공단에서 관리하는 미세먼지 알림이 정보 데이터는 다양한 항목으로 구성되어 있습니다. 이 데이터는 관리 번호, 관리부서, 설치 장소, 설치연도, 표출부 면적, 표출 내용 등으로 나뉘어 있습니다. 관리부서는 해당 기기를 관리하는 부서를 나타냅니다. 설치 장소는 기기가 설치된 위치를 상세히 기록하고, 설치 연도는 기기가 설치된 연도를 명시합니다. 또한, 표출부 면적은 미세먼지 알림이 표출되는 면적을 나타내며, 표출내용은 알리미에서 제공하는 구체적인 미세먼지 정보나 경고 내용을 포함합니다. 이러한 정보들은 미세먼지 알리미 시스템의 관리와 활용을 보다 체계적으로 지원하는 데 중요한 역할을 합니다.
