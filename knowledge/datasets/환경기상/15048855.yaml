summary_user: 전국 먹는샘물 제조업체의 원수를 업체·취수정(호정명)·검사시기별로 검사한 건별 결과로, 채수일자·검사일자와 일반세균·총대장균군·납·비소·질산성 질소·벤젠·1,4-다이옥산 등 미생물·중금속·농약·휘발성유기물 항목의 검사 결과를 담는다. 소비자나 분석가가 특정 생수 제조업체의 취수 원수가 분기·반기 검사에서 수질기준에 맞았는지, 어떤 항목에서 문제가 있었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제조업체명·관리기관 이름을 맞춰 연결해야 하며, 같은 기관의 먹는샘물 제품수·유통제품 수질검사 결과와 업체명 기준으로 함께 본다.
description_portal: 먹는샘물 제조업체원수 수질검사결과(업체명, 관리기관, 채수일자, 검사일자, 항목별 적합여부)정보를 제공합니다.먹는샘물(생수) 및 제조업체원수 수질검사결과 정보는 전국 먹는샘물 제조업체에서 취수·생산되는 원수·제품수 및 시중에 유통중인 먹는샘물을 수거하여 수질검사를 진행하고 그 결과(수질기준 적합, 부적합)를 수거기관, 제품명, 수거일자, 검사시기, 검사일자, 검사기관 등의 정보와 함께 제공하고 있습니다. 수질검사결과는 17개 시도 담당자들이 토양지하수정보시스템을 통해 입력 제출한 후, 데이터를 검증 및 가공을 통해 데이터를 개방하고 있습니다. 또한, 전국의 혼재되어 있는 (먹는)샘물 수질검사결과 데이터를 공공데이터포털에 대국민공개함으로써 국민의 알권리 뿐만 아니라 편의성을 충족시키고 있습니다.
