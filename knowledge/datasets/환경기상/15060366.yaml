summary_user: 강원특별자치도 동해시에 사업장폐기물 배출자로 신고한 사업장을 한 건씩 담은 원천 목록으로, 인허가관리번호·사업자명·도로명주소·업무구분·기준일자를 담고 있으며 범위는 동해시 한 곳입니다. 폐기물 처리업자나 환경 분석가가 '동해시에서 사업장폐기물 배출자로 신고된 사업장은 어디에 있고 어떤 업무구분인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 사업자명·도로명주소 매칭이나 같은 기관(동해시) 자료끼리만 이어 쓴다.
description_portal: 강원특별자치도 동해시의 사업장폐기물 배출자 신고정보는 폐기물관리법에 따라 사업장에서 발생하는 폐기물을 배출하는 주체가 동해시에 신고한 현황을 담고 있는 데이터로 인허가 관리번호, 사업장명, 사업장 주소, 업무구분을 포함하고 있습니다.공공데이터 목적은 사업장폐기물의 발생부터 최종 처리에 이르는 전 과정을 투명하게 관리하고, 불법 투기 및 부적절한 처리를 방지하여 환경오염을 예방하는 데 목적이 있습니다. 또한, 폐기물 관련 정책 수립 및 효율적인 처리를 위한 기초 자료로 활용됩니다. 공공데이터의 활용분야는 환경 정책 수립 및 평가, 폐기물 관리 및 처리 효율화, 폐기물 관련 연구 및 통계 분석, 지역 환경 문제 분석 및 개선 방안 마련 등이 있습니다.
