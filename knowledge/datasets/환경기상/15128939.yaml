description_portal: 이 데이터는 한국석유공사가 저공해 자동차를 구매하거나 임차한 실적을 연도별로 정리한 통계 자료로, 전기차, 하이브리드차, 수소차 등 친환경 차량의 보유 현황을 수치로 제공합니다. 저공해 차량의 보급 현황은 공공기관의 친환경 정책 이행 여부를 판단하는 핵심 지표로, 이 자료는 정부의 온실가스 감축 정책, 친환경 교통 수단 확대 전략, ESG 경영 실적 평가 등에 폭넓게 활용됩니다. 또한 기관의 연도별 친환경차 보유 비중 분석이나 차량 도입 계획 수립에도 유용하며, 관련 보고서나 인증 과정에서 실적 증빙 자료로 활용됩니다. 데이터는 연도별로 구성되어 있어 시계열 분석과 시각화 작업에도 적합하며, 친환경 정책 실행력의 투명성을 확보할 수 있는 공공성과 활용도가 높은 자료입니다.
