summary_user: 경기도 31개 시군의 대기 오염물질 배출시설 설치사업장을 사업장 한 곳당 한 행으로 담으며, 인허가·폐업일자, 영업상태, 업태·업종, 주요 생산품, 배출시설과 방지시설의 연간 가동일수·조업시간, 주소와 좌표(WGS84 위경도)를 포함한다. 시군 담당자나 분석가가 "우리 지역 어디에 가동 중인 대기 배출 사업장이 몰려 있고 얼마나 오래 가동되는가"를 파악해 점검 계획이나 지역 오염 분석에 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·사업장명·주소로 맞추거나 좌표로 대기질 측정소 등 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 31개 시군에 위치한 대기 오염물질 배출시설 설치사업장의 인허가 및 조업 정보 등을 포함하고 있습니다. 주요 항목으로는 시군명, 사업장명, 인허가일자 및 취소일자, 영업상태, 소재지 도로명주소 및 지번주소, 사업장 전화번호, 소재지면적, 업태구분, 업종구분, 주요 생산품, 배출시설 및 방지시설의 연간 가동일수 및 조업시간, 좌표정보(WGS84 위도 및 경도, X, Y좌표) 등이 있습니다. 이 데이터는 지역별 대기오염 유발 가능성을 분석하거나, 환경관리 정책 수립, 배출시설에 대한 감독·점검 계획 수립 등에 활용될 수 있습니다. 특히 배출 및 방지시설의 운영시간과 가동일수 정보는 환경영향평가, 지역 오염도 예측 모델링 등 정량적 환경 분석에 중요한 근거자료가 됩니다. 데이터는 행정안전부에서 매주 갱신되며, Open API를 통해 시스템 연동이 가능해 다양한 환경정보 서비스에 응용할 수 있습니다.
