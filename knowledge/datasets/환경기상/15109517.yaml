summary_user: 충청남도 홍성군에서 유해야생동물을 포획한 기록을 건별로 담으며, 신고일자·포획일자·개체 종류·포획 방식·포획지 시도·시군·상세주소·위도·경도·포획 개체 수를 함께 준다. 농가나 지역 분석가가 '홍성군에서 어느 시기, 어느 지점에 어떤 유해야생동물이 몇 마리 잡혔나'를 확인하거나 포획 지점을 지도에 찍어 피해 다발 지역을 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 시군·상세주소 같은 이름 매칭이나 위경도 좌표의 공간 결합으로만 잇는다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 기관 데이터와 바로 조인하지 못하며, 이름·주소 매핑이 필요하다. 포털 활용신청은 자동승인이고 개발계정은 하루 5,000회로 호출이 제한된다.
