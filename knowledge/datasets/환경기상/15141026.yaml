summary_user: 서울 마포구에 등록된 배출가스전문정비사업자(확인검사대행자)의 인허가 내역을 사업장 한 곳당 한 행으로 담으며, 관리번호·사업장명·인허가일자·영업상태·폐업일자·휴업기간·주소·좌표·환경업무구분을 포함한다. 주민이 집 근처에서 지금 영업 중인 배출가스 정비·확인검사 업체를 찾거나, 분석가가 마포구 정비사업자의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 자치구의 같은 인허가 데이터와는 개방기관코드(OGDP_INST_CD)나 업종명으로 묶어 쓰고, 다른 데이터와는 주소나 좌표를 매칭해 잇는다.
description_portal: 서울특별시 마포구 배출가스전문정비사업자(확인검사대행자) 인허가 정보에 대한 설명입니다. 이 데이터에는 마포구 내에서 자동차 배출가스 정비 및 확인검사를 수행하기 위해 등록된 사업자들의 인허가 내역이 포함되어 있습니다. 주요 정보로는 관리번호, 사업자명, 영업상태명(폐업, 영업/정상), 인허가일자, 폐업일자, 지번주소 및 도로명주소, 도로명우편번호, X좌표와 Y좌표가 제공됩니다. 또한, 전화번호, 환경업무구분명 정보도 포함되어 있습니다.이 데이터를 통해 주민들은 믿을 수 있는 정비업체를 선택할 수 있으며, 행정기관은 배출가스 저감 정책의 집행과 감독을 보다 효과적으로 수행할 수 있습니다.
