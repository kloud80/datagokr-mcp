summary_user: 사업장대기오염물질관리시스템의 여러 관리 테이블(측정항목·측정기기, 연도·업종·배출구별 배출 통계, 일·30분·5분 관리기록, 접속·방문 기록, 권역·시도·공통코드 등)을 전국 범위로 묶은 압축 파일(zip, 약 238KB)이다. 사업장 굴뚝 배출 관리 체계를 분석하는 사람이 '어떤 측정항목과 측정기기로 배출을 관리하며, 업종별 배출 통계는 어떻게 집계되는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관(한국환경공단)의 코드로만 이어 쓴다.
limits: 실측으로 확인된 필드는 접속일련번호·방문일자 같은 시스템 접속 기록 성격이어서, 포털 설명에 적힌 배출량·5분/30분 측정값이 실제로 얼마나 들어 있는지는 파일을 열어 확인해야 한다. 이 자료는 사업장 배출 관리 자료이며 측정소 기준 시간별 대기질이나 경보·주의보를 담지 않는다. 위치 정보가 없는 비공간 자료여서 지도 결합에는 쓰지 못한다.
