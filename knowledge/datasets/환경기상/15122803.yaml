description_portal: '사업장대기오염물질관리시스템에서 관리되고 있는 정보(5분/30분 관리 데이터, Datalogger, 통계자료, 측정기) 등을 제공합니다.1.측정 및 장비 관련 데이터(측정항목정보, 측정방법, 측정기기이름_수정): 오염물질 측정 시 사용되는 항목과 장비 정보를 나타냅니다. 측정 기준의 신뢰성과 정밀성을 확보하는 데 중요합니다.2. 통계 및 업종별 정보(연도별 사업장별 통계, 업종통계, 연도별 배출구별 통계): 연도, 업종, 배출구 단위로 대기오염물질의 배출량을 집계하여 추세를 파악하는 데 사용됩니다.3. 시설 및 관리 정보(일자관리, 5분관리, 30분관리): 사업장의 방지시설 및 배출시설의 운영을 시간 단위(일, 30분, 5분)로 기록한 자료입니다. 실시간 모니터링 및 비정상 가동 여부 파악이 가능합니다.4. 사용자수, 방문자수, 거래사연장, pki, otp정보: 점검 및 관리이력, 인증 또는 시스템 접근과 관련된 운영상 기록입니다.5. 시설 형태 및 위치 기반 분류(배출시설대기기본, 배출시설배출류표): 설치된 시설의 기본 정보 및 배출물질 종류에 대한 분류 자료입니다.6. 권역정보, 광역시도기본, 공통코드: 지역 및 행정구역 기반의 통계 처리를 위한 코드 테이블입니다.7. 게시판 및 알림 등 기타 기능: 사용자 간 정보 공유나 공지사항 운영을 위한 게시판 로그입니다.'
