description_portal: 환경부 국립환경과학원에서 운영하고 있는 물환경정보시스템의 수질오염총량 관리제도 중 지류총량 면적 비율 분석 결과에 관한 데이터를 제공합니다.이 자료는 본류와 지류의 유역 면적을 비교하여 각 지류가 본류 전체에서 차지하는 면적 비율을 산정하고, 유역별 부하량 산정 시 면적 가중치를 반영하기 위해 구축되었습니다.데이터에는 지류총량 코드, 지류총량명, 지류 면적, 면적비율 분자값, 본류 코드, 본류명, 본류 면적, 본류 면적비율 분모값, 면적비율 등이 포함되어 있습니다.이 데이터는 수계별 하천 구조를 면적 기반으로 비교함으로써, 총량관리 단계별 하천유역의 공간적 분포와 상대적 중요도를 분석하는 데 활용됩니다.또한 유역 단위의 부하량 배분, 수질개선 우선순위 설정, 상·하류 간 영향도 분석 등 다양한 수문·수질 해석의 참고자료로 이용됩니다.
