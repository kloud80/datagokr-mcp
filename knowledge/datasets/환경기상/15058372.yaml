summary_user: 경기도 내 무인 자동기상관측장비(AWS) 지점별로 기온·습도·풍향·풍속·현지/해면기압·강수 감지·1시간 및 일 누적 강우량을 관측 일자·시각 단위로 담은 건별 관측 자료로, 시군·지점번호·법정동·위경도·고도 등 위치 정보가 함께 붙는다. 우리 동네 지점에서 어제 오후 시간당 강우량이 얼마였는지, 특정 시군의 폭염 시간대 기온 변화가 어땠는지를 보려는 분석가·농업·보험·재난 대응 담당자가 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·법정동명 같은 이름·코드 매핑이나 관측지점번호, 위경도 좌표로 다른 지역 통계·재해 자료와 이어 쓴다.
description_portal: 경기도 자동기상관측장비(AWS, Automatic Weather Station) 시간별 관측현황 데이터는 경기도 내 설치된 무인 자동기상관측 장비에서 수집된 기상 요소를 시간 단위로 제공한다. AWS는 기온, 습도, 풍향, 풍속, 기압, 강수량 등 다양한 기상 요소를 자동으로 관측·전송하며, 본 데이터는 각 시군별 지점 단위로 수집된 관측 결과를 시간별로 기록한다. 이를 통해 특정 지역의 기상 변화를 실시간으로 파악할 수 있으며, 단기 기상 예측, 기후 연구, 재난 대응 등 다양한 분야에서 활용이 가능하다.데이터에는 관측 지점명과 번호, 위도·경도 좌표, 고도와 같은 위치 정보뿐 아니라 기온(℃), 습도(%), 현지 및 해면 기압(hPa), 풍향(360도 방위각), 풍속(m/s), 시간 및 일 누적 강우량(mm) 등 세부 기상 요소가 포함된다. 또한 강수 감지 여부, 중상·경상 구분된 사고 데이터와 달리 본 자료는 순수 기상 수치 데이터를 제공하므로, 환경 모니터링이나 날씨 기반 의사결정 지원 시스템 구축에 중요한 역할을 한다.다만 무인 장비 특성상 기계 오작동이나 통신 장애로 인해 오류값(-99 등)이 발생할 수 있으며, 이러한 데이터는 증빙 자료로 활용할 수 없고 연구 및 참고용으로만 사용해야 한다. 데이터는 최대 2개월 전까지의 자료를 SHEET 서비스에서 조회할 수 있으며, 장기 데이터는 파일 다운로드 방식으로 제공된다.이 데이터는 기상청 및 경기도가 제공하는 생활기상지수(체감온도, 열지수, 불쾌지수 등) 산출에 기초자료로 사용되며, 폭우·폭설·태풍 등 기상재해 대응 체계 강화, 농업·교통·보건 분야의 기상서비스 개발, 지역 맞춤형 환경정책 수립에도 유용하다. 특히 연구기관, 대학, 기상 스타트업, 공공기관 등에서 실시간 분석 및 예측 모델링에 활용할 수 있어 공공과 민간 모두에게 가치 있는 자료다.
