summary_user: 충청북도 내 대기오염물질 배출시설 사업장을 한 곳씩 상호·소재지·업종·종수(1~5종)로 담은 건별 원장 파일(csv, 약 82KB)이다. 충북 지역 주민이나 분석가가 '우리 동네 주변에 어떤 업종의 몇 종 대기배출 사업장이 있는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 상호 이름이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓰고, 업종은 한국표준산업분류 코드표를 참고해 해석한다.
description_portal: 대기환경보전법은 대기오염으로 인한 국민건강이나 환경에 관한 위해(危害)를 예방하고 대기환경을 적정하고 지속가능하게 관리보전하여 모든 국민이 건강하고 쾌적한 환경에서 생활할 수 있게 하는 것을 목적으로 합니다. 해당 법에 의거 충청북도 대기오염물질 배출시설 사업장 현황에 대한 정보를 공개합니다. (상호, 소재지, 업종, 종수(1-5)) 컬럼 정보를 제공합니다. 파일 내 코드 설명을 "한국산업분류코드"를 참고하여 주시기 바랍니다.(표준산업분류는 업종분류 정제에 따라 상권업종분류 연계표화 상이할 수 있음)
