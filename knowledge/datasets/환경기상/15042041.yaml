description_portal: 대기환경보전법과 온실가스 관련 고시에 따른 자동차 제작사별 연도별 판매 자동차의 온실가스 배출량 기준값과 실적값으로 정보를 제공합니다.국내에서 제작되거나 수입되어 국내에 판매되는 「자동차관리법」제3조 및 동법 시행규칙 제2조 별표 1의 규정에 의한 승용자동차 및 승합자동차로서 승차인원이 15인승 이하이고 총 중량이 3.5톤 미만인 자동차 및 화물자동차로 총 중량이 3.5톤 미만인 자동차에 한하여 적용하고, 치료 및 환자 수송 등 의료목적으로 제작된 자동차, 군용자동차, 방송/통신 등의 목적을 위하여 제작된 자동차, 2012년1월1일 이전에 단종되어 더 이상 제작되지 않는 자동차는 제외됩니다.제공되는 데이터는 실적 산정작업 및 확정이 완료된 업데이트 시점에서 5년전 데이터까지만 해당합니다.데이터 항목으로는 국가명, 국/내외 제작업체명, 판매년도, 온실가스/에너지소비효율 선택기준(비율별/연차별), 판매규모, 적용기준차종, 판매량확인, 진행상태, 실적확인상태, 기준(비율별) 온실가스/에너지소비효율, 기준(연차별) 온실가스/에너지소비효율, 실적(100%) 온실가스/에너지소비효율, 실적(비율) 온실가스/에너지소비효율, 판매량 비율, 전체 판매량, 평균 공차중량, 평균 점유면적, 경유차 비율, 초과달성분(비율별) 온실가스/에너지소비효율, 초과달성분(연차별) 온실가스/에너지소비효율의 데이터를 제공합니다.
