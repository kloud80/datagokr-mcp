summary_user: 경기도 대기환경 진단평가시스템이 대기질 예측에 쓰는 모델의 코드·이름·상세 설명을 모델 한 건당 한 행으로 담은 코드표 성격의 자료로, GFS·FNL 기상자료 기반의 WRF·MCIP·CMAQ·CAMx 등과 CAPSS 2015 배출통계 활용 여부가 설명에 포함된다. 연구자나 행정 담당자가 "경기도가 발표한 대기질 예측값은 어떤 기상·대기질 모델 조합으로 만든 것인가"를 확인하거나 모델별 구성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 시스템의 예측 결과 자료와 모델코드(model_cd)를 이름·코드 매핑으로 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 경기도_대기환경_진단평가시스템_모델정보 데이터는 대기질 예측에 사용되는 모델의 코드와 이름을 정리한 자료입니다. 항목에는 모델코드, 모델명, 모델상세가 있으며, GFS·FNL 기상자료를 기반으로 WRF, MCIP, CMAQ, CAMx와 같은 대기질 예측 모델이 포함됩니다. 일부 모델은 CAPSS 2015 배출통계를 활용해 정확도를 높입니다. 이 데이터는 경기도가 어떤 모델을 사용해 대기질을 예측했는지 확인할 수 있게 하며, 연구자는 모델별 특성을 비교 분석할 수 있고, 행정기관은 예측 근거를 투명하게 제시하는 데 활용할 수 있습니다.
