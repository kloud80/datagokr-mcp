summary_user: 경기도 내 대기 배출시설 사업장이 자가측정을 환경측정대행업소에 맡긴 계약을 건별로 담으며, 사업장명·사업자번호·업종, 계약연도, 측정 분야와 종별, 측정기관명, 계약 시작·종료일, 등록일이 들어 있다. 환경 행정 담당자나 분석가가 "어느 측정대행기관이 어떤 업종 사업장과 몇 건을 계약했고, 계약이 끊긴 사업장은 없는가"를 점검하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 사업자번호(bizregno)나 사업장명·업종코드를 맞춰 배출시설 인허가·TMS 같은 사업장 단위 배출원 자료와 기업 축으로 잇는다.
description_portal: '이 데이터는 경기도 지역 내 배출시설을 운영하는 사업장이 대기오염물질의 자가측정을 외부 전문기관(환경측정대행업소)에 위탁하여 수행하는 경우의 측정대행 계약 체결 현황을 기록한 자료입니다. 데이터에는 사업장명, 사업자번호, 업종코드 및 업종명, 계약연도, 계약대상자의 측정 분야와 종별(예: 5종), 계약대상자(측정기관)의 명칭, 계약 시작일과 종료일, 등록일 등의 정보가 포함됩니다. 측정대행 계약은 자가측정의 객관성과 정확성을 확보하기 위해 필수적으로 이행되며, 이를 통해 각 사업장은 법적 기준에 따라 대기오염물질 농도를 정기적으로 측정하게 됩니다. 이 자료는 대기오염 관리 체계 점검, 측정대행기관별 계약 건수 분석, 업종별 측정 특성 파악 등 다양한 행정적·분석적 활용이 가능하며, 환경위반 사전 예방 및 관리감독 효율화에 기여할 수 있는 기초 데이터입니다.'
