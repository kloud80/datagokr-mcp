description_portal: 경기도 파주 시민들의 건강 증진과 건전한 여가 활동 지원을 위해 조성된 맨발산책로에 대한 공공데이터로, 관리번호, 산책로명, 위치 정보인 읍면동명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 산책로의 미터 단위 길이, 제공 편의시설 등으로 구성되어 있습니다. 본 데이터셋은 주변 산책로 찾기, 경로 길찾기 연계 등 시민용 위치 기반 스마트 맵 서비스 , 산책로의 길이(m) 데이터를 활용해 소모 칼로리와 걸음 수를 자동 계산해 주는 기능을 구현한 운동량 측정 등의 헬스케어 및 운동 기록 애플리케이션, 초보자는 짧은 코스, 숙련자는 긴 코스를 선택할 수 있도록 필터링 기능을 제공하는 맞춤형 코스 추천, 읍면동별 산책로 분포 분석을 통한 신규 산책로 조성 계획 수립, 편의시설 현황 파악을 통한 유지보수 우선순위 선정, 주변 명소와 산책로를 잇는 '힐링 투어' 코스 개발 등의 테마별 관광 코스 개발, 홍보 콘텐츠 제작 등에 활용될 수 있습니다.
