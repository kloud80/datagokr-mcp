description_portal: 고창군 수위 변위통계 데이터(10분)는 하천·저수지 등 주요 수자원 시설의 수위 변화를 10분 주기로 측정해 제공하는 공공데이터이다. 각 관측 지점을 구분하기 위한 장비번호, 위치와 용도를 나타내는 장비명, 특정 시점의 수위 변화를 정량화한 측정값으로 구성되며, 시간 흐름에 따른 수위 상승·하강 추세를 분석할 수 있다. 이 데이터는 침수 위험 예측, 수자원 관리, 재해 대응 체계 구축 등 다양한 분야에서 활용될 수 있는 기초자료로서 공공의 안전과 효율적 환경 관리에 기여한다. 엑셀에서 지원하는 최대 행 갯수를 초과하여 대표로 2024년 데이터를 올려드립니다. 이전데이터를 원하시면 고창군청으로 문의주시기 바랍니다.
