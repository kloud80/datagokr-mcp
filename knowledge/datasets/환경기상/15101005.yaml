summary_user: 김제시 안의 대기배출 사업장 가운데 중질유를 연료로 쓰는 업체를 사업장 한 곳당 한 행으로 담은 목록이며, 사업장명·소재지·전화번호·사용 연료를 적었다(파일 크기 421바이트의 소규모 CSV). 김제시 주민이나 환경 분석가가 "우리 지역에서 중질유를 때는 배출 사업장은 어디이고 어떤 연료를 쓰나"를 확인할 때 쓴다. 전역 조인 키(사업자번호·사업장 코드 등)가 없어 다른 배출원 원장이나 대기질 자료와는 사업장명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 사업장을 식별하는 공통 코드가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 의존해야 하고, 오탈자나 표기 차이로 누락이 생길 수 있다. 범위는 김제시 한 곳에 한정되어 시군 간 비교나 전국 집계에는 쓸 수 없다.
