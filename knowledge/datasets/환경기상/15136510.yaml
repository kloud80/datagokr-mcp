description_portal: 본 데이터는 전국 국립공원에 존재하는 서식환경 내 오염원에 대한 정보를 수집·정리한 자료로, 자연 생태계의 건강성과 수질 보전 상태를 평가하고 관리하기 위한 기초 데이터입니다. 각 오염원에 대해 오염원 유형(생활계, 영농계 등), 오염원 시설 설치 여부, 오수 또는 폐수 발생량, 처리시설 설치 여부, 위치 정보(위도·경도), 국립공원명, 조사 연도 등으로 구성되어 있으며, 서식환경 데이터와 연계되어 특정 지역의 오염 영향도를 분석하거나 보전 우선지역 선정 등에 활용됩니다. 본 자료는 환경관리 계획 수립, 수질오염 모니터링, 오염 저감 대책 수립, 관련 연구 수행 등 공공 및 민간 영역에서 다양하게 활용될 수 있으며, CSV 포맷으로 제공되어 공간정보 기반 시스템(GIS) 및 지도 API와 연계한 시각화도 가능합니다.
