summary_user: 광주 동구 관내 사업장폐기물 배출자를 사업장 단위로 담은 파일로, 상호·주소와 함께 신고일, 폐기물 종류, 배출량(톤), 운반자와 운반량, 처리업소명·처리방법·연간 처리량을 건별로 담는다. 구청 환경 담당자나 분석가가 '동구의 어느 사업장이 어떤 폐기물을 얼마나 배출하고, 어느 업체가 어떤 방식으로 처리하는가'를 확인하거나 현장 점검 대상을 고를 때 쓴다. 전역 조인 키는 없어 사업장 주소(도로명·지번)나 상호, 처리업소명을 기준으로 폐기물 처리업 허가 현황 등 다른 자료와 이름·주소 매칭으로만 잇는다.
description_portal: 광주광역시 동구 관내 사업장에서 배출된 폐기물을 처리하는 업체 현황 데이터는 지역 내 환경관리 체계를 강화하고, 폐기물의 적정 처리 여부를 투명하게 관리하기 위해 정리된 자료입니다. 이 정보는 사업장에서 발생한 폐기물이 어떤 종류인지, 어떤 업체가 처리하는지, 처리 방식은 무엇인지 등을 체계적으로 파악할 수 있도록 구성되어 있으며, 환경오염 예방과 자원순환 행정에 중요한 기반이 됩니다.데이터에는 먼저 폐기물이 어떤 종류인지 구분하는 폐기물구분이 포함되어 있어 생활폐기물, 사업장폐기물, 지정폐기물 등 처리 대상의 성격을 정확히 알 수 있습니다. 상호명은 폐기물 처리를 담당하는 업체의 명칭이며, 폐기물종류는 실제로 처리되는 폐기물의 세부 유형을 나타냅니다.또한 업체와의 소통 및 확인 절차를 위해 전화번호 정보가 제공되며, 폐기물이 어떤 방식으로 처리되는지는 처리방법을 통해 확인할 수 있습니다. 예를 들어 재활용, 소각, 중간처리, 최종처분 등 다양한 방식이 포함될 수 있습니다. 업체의 위치를 알려 주는 사업장 도로명주소는 현장 점검이나 신고 내용 확인 시 활용도가 높습니다.폐기물 처리 현황의 기준이 되는 연도는 신고기준년도 항목에서 확인할 수 있으며, 제공 기간은 최초 2016년부터 2021년 5월 6일까지의 자료가 정리되어 있고 이후에는 매년 갱신된 내역이 제공됩니다.이 데이터는 동구의 환경행정 전반에서 폐기물 배출·처리 실태를 파악하고, 부적정 처리를 예방하며, 관련 민원 대응과 정책 수립에 핵심적인 자료로 활용됩니다.
