summary_user: 수도권매립지에 반입된 폐기물의 매립량을 반입일자별로 담은 파일 데이터로, 반입일자·매립량·등록일시·적재일시 네 항목으로 구성되며 포털 설명상 2004년부터 2020년까지를 다룬다. 환경 분석가나 연구자가 수도권매립지의 일별·연도별 매립량 추이가 어떻게 변해 왔는지 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 반입일자 같은 날짜 기준으로만 맞춰 볼 수 있고, 같은 기관(수도권매립지관리공사)의 다른 데이터와 나란히 보는 정도로 연결한다.
limits: 매립지 전체 합계 수준의 매립량만 있고, 배출 사업장·처리업자나 지역별 반입 내역과는 공통 키가 없어 연결되지 않는다. 범위는 전국·비공간으로 분류돼 있어 지도나 행정구역 단위 분석에는 쓰기 어렵다.
