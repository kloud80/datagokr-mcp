description_portal: 수도권매립지관리공사는 3개 시도 폐기물을 반입하여 매립 후 5시간 이내 복토 작업을 통해 폐기물의 흩날림, 해충서식, 냄새발생, 빗물침투 등을 방지합니다.폐기물 분해과정에서 발생하는 매립가스를 포집하여 전력생산 및 악취방지의 효과를 달성하고 있으며,매립시설 바닥에 차수시설을 설치하여 지하수 오염을 차단하고, 침출수를 모아 처리하고 있습니다.해당 데이터는 반입일자, 매립량, 등록일시, 적재일시에 대한 내용을 제공합니다.2004년에서 2020년까지의 데이터를 열람하실 수 있습니다.
