summary_user: 청주시가 관리하는 먹는물 공동시설(약수터 등)을 시설 1곳당 1행으로 담은 파일로, 시설명·도로명/지번 주소·위도·경도·일평균 이용인구, 최근 수질검사일과 적합·부적합 결과(부적합 항목 포함), 관리기관과 연락처를 담는다. 시민이 집 근처 약수터의 물이 최근 검사에서 마셔도 되는 판정을 받았는지 확인하거나, 분석가가 구별 약수터 수질 부적합 현황과 이용 규모를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도로 위치를 맞추거나 시설명으로 이어 붙여야 한다.
description_portal: '충청북도 청주시에서 먹는물 관리법 제8조, 같은법 시행규칙 제2조에  따라 관리하는 먹는물 공동시설(약수터 등)의 정보를 제공하여 먹는물공동시설을 이용하는 시민들의 편의제공- 먹는물공동시설 명 (청주시 총 16개소 : 상당구 4개소, 서원구 3개소, 흥덕구 3개소, 청원구 6개소- 소재지 주소- 수질검사일 및 수질검사 결과(적합 및 부적합 항목)- 관리기관(부서명) 및 관리기관 연락처 등- 관련근거 : 먹는물관리법, 먹는물공동시설 관리요령[환경부훈령 제1614호, 2023.9.12.]자세한 내용은 엑셀 파일을 확인하여 주시기 바랍니다.'
