description_portal: 대전광역시 공원관리사업소 공원등 정보 자료는 2021년을 기준으로 대전시가 관리하는 주요 도시 공원 내에 설치된 공원등의 위치, 수량, 운영 현황 등을 종합 정리한 데이터입니다. 해당 자료에는 공원 별 조명 시설의 배치 현황과 조명등 설치 수량, 유형 별 분류, 전력 사용 관련 항목이 포함되어 있으며, 야간 시간대 공원 이용자의 안전 확보와 심야 출입로 조도 확보를 위한 시설 운영의 기초 자료로 활용됩니다. 또한 공원 조명의 전력 소비량을 환경 친화적으로 관리하기 위한 에너지 효율 분석, 노후 조명 교체 계획 수립, 신재생 또는 스마트 조명 시스템 적용 가능성 검토 등의 행정적 의사 결정에 유용한 기반 정보가 됩니다. 해당 자료는 공원 시설 유지관리, 야간 범죄 예방, 도시 미관 개선 등과 연계된 시설 인프라 개선 판단에 기초자료로 제공될 수 있습니다. 본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
