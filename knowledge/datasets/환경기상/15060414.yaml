summary_user: 경상남도 창원시에 사업장폐기물 배출자로 신고된 사업장을 한 건씩 담은 파일로, 상호·신고년도·생활계 구분·폐기물 종류·사업장 도로명주소가 들어 있다. 창원시에서 어떤 폐기물을 배출한다고 신고한 사업장이 어디에 있는지 찾는 지역 주민이나 폐기물 수집·처리 사업자, 배출 사업장 분포를 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명주소를 맞춰 붙이는 방식으로만 이어 쓸 수 있다.
description_portal: 경상남도 창원시의 사업장폐기물배출자 신고현황입니다. 항목은 상호, 폐기물 종류, 사업장도로명주소, 신고기준년도 등입니다.폐기물 관리법에 따라 사업장별로 신고된 폐기물 배출 실적과 사업장 현황을 포함하는 자료입니다. 본 자료는 배출업체의 지역 분포, 배출량 추이, 폐기물 종류, 행정처분 이력 등의 정보를 기반으로 폐기물 관리, 환경정책 수립, 민원 대응 및 시설 점검 등에 활용될 수 있습니다.데이터 양이 많을 경우 일반 뷰어(엑셀, 메모장 등)에서 일부만 표시될 수 있으므로, R, Python, GIS 등 전문 분석 도구 사용을 권장합니다.구체적인 신고 기준, 집계주기, 배출량 단위 등 세부 정의는 제공기관의 메타데이터나 기술문서를 참고해 주시기 바랍니다.
