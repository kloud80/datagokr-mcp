description_portal: 이 데이터셋은 자동차 카시트에 대한 AI 학습용 이미지 데이터입니다. 총 200장의 이미지와 동일한 수량의 라벨링 텍스트 파일로 구성되어 있으며, 모든 이미지는 ‘images’ 폴더에, 라벨링 정보는 ‘labels’ 폴더에 저장되어 있습니다. 각 이미지는 다양한 디자인과 색상의 카시트를 실내 환경에서 촬영한 것으로, 전면 또는 측면에서 촬영되어 좌석 형태, 안전벨트 고정 장치, 쿠션 구조 등이 확인 가능합니다. 라벨링은 YOLO 형식으로 제공되며, 각 이미지 내 카시트 객체의 위치 정보를 좌표 데이터로 기록하고 있어 객체 인식 및 분류 모델 훈련에 활용할 수 있습니다.
