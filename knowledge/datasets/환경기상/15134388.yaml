summary_user: 환경책임보험 전산망에 등록된 사업장별로 인허가를 맡은 행정기관(인허가기관), 사업장번호, 등록자 아이디, 등록일시를 담은 전국 범위 건별 파일(CSV, 약 740KB)이다. 환경책임보험 가입 대상 사업장을 관리하는 담당자나 분석가가 '이 사업장의 인허가 관할 기관은 어디인가', '기관별로 몇 개 사업장이 등록돼 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 오염원·화학물질 사업장 데이터와는 기관명 매핑이나 같은 기관의 사업장번호 체계로만 이어 쓴다.
description_portal: 환경책임보험 전산망에서는 사업장 및 인허가기관 정보를 정확하게 관리하기 위해 다음과 같은 항목들을 기록합니다. 인허가기관은 사업장의 인허가를 담당하는 행정기관명으로, 해당 사업장이 소속된 관할 기관을 명확히 구분하는 데 사용됩니다. 사업장번호는 각 사업장을 고유하게 식별하는 번호로, 사업장별 데이터 관리와 연계에 필수적입니다.등록자 아이디는 해당 정보를 시스템에 등록한 담당자의 식별 정보이며, 이력 추적과 관리 책임 확인에 활용됩니다. 등록일시는 정보가 등록된 정확한 날짜와 시간을 기록하여 데이터의 최신성 및 변경 이력을 관리하는 데 중요한 기준이 됩니다. 이러한 체계적인 정보 관리는 사업장 관리와 인허가 행정의 효율성을 높이고, 환경책임보험 운영의 신뢰성 확보에 기여합니다.
