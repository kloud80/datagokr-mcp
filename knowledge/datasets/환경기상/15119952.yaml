summary_user: 서울 성동구에서 대기오염물질 배출시설을 설치·운영하는 사업장을 한 곳씩 담은 인허가 원장으로, 인허가일·영업상태·폐업일·휴업기간, 주소·좌표, 업종·종별·주생산품, 배출시설과 방지시설의 하루 가동시간·연간 가동일수를 포함한다. 주민이나 분석가가 "우리 동네에 지금 영업 중인 대기 배출시설 사업장은 어디이고 몇 종인가"를 확인하거나, 구청이 관할 배출 사업장 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭, 좌표(XCRD·YCRD)를 이용한 공간 결합, 또는 같은 개방자치단체코드를 쓰는 다른 인허가 데이터와의 연결로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 대기 중 존재하는 물질 중 대기오염의 원인이 되는 오염물질을 배출하는 시설을 설치·운영하는 업소의 정보를 체계적으로 제공하기 위해 마련되었습니다. 산업 및 생활환경 변화로 인해 대기질 관리의 중요성이 꾸준히 강조되고 있으며, 배출시설의 적정 관리와 체계적 감독은 지역 환경 보호 및 국민 건강 증진에 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 인허가사항과 영업 현황을 파악할 수 있는 핵심 항목이 포함되어 있습니다. 성동구청 등 관할 행정기관은 정기적인 점검과 자료 갱신으로 데이터의 신뢰성과 최신성을 확보하고 있습니다. 본 데이터는 대기오염원 관리, 환경 정책 수립, 업계 동향 분석, 시설 운영업체 모니터링 등 다양한 분야에서 효과적으로 활용될 수 있습니다. 또한 연구자와 정책입안자, 시민 등에게 투명하고 객관적인 정보를 제공하여 쾌적한 도시환경 조성과 지역사회 환경안전 확보에 기여합니다.
