summary_user: 경상남도에 등록된 환경전문공사업체를 업체 한 곳당 한 행으로 담은 파일로, 대기·수질·소음진동 같은 전문분야와 업체명, 등록일, 시군구·세부주소, 연락처를 싣는다. 사업장 담당자나 분석가가 "우리 시군에서 대기 방지시설을 설계·시공할 수 있는 등록업체는 어디인가"를 찾거나, 분야별·지역별 업체 분포를 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로, 다른 데이터와는 업체명과 시군구·주소를 맞춰 붙여야 한다.
description_portal: 경상남도 도내 환경전문공사업 등록업체의 대기, 수질, 소음진동 분류별 현황을 제공합니다.(업소명, 주소, 전문분야, 전화번호 등) * 미집계 데이터는 공란 처리하였습니다.환경전문공사란, 오염물질배출시설로부터 나오는 오염물질을 없애거나 줄이는 장비, 기계, 부품 및 기구 등 방지시설(「환경기술 및 환경산업지원법」 제2조제4항에 따른 방지시설) 전체 또는 일부를 설계·시공하는 공사를 말하며, 환경전문공사에 관한 영업을 위해 등록하는 업을 ‘환경전문공사업’이라고 합니다.방지시설의 설계·시공함으로써 오염염물질의 농도 및 성상 등과 주변 환경에 미치는 영향을 분석하여, 효과적으로 오염물질을 없애거나 줄일 수 있는 최적의 처리 방법과 용량을 선정할 수 있으며, 배출시설로부터 발생되는 오염물질을 없애거나 줄이는 기능을 충분히 발휘할 수 있도록 관련 장비, 기계, 부품 및 기구 등을 설치할 수 있다.데이터는 업소명, 전문분야, 주소, 등록일자, 전화번호 등으로 구성되며, 해당 링크를 통해 접속하면 경상남도 도내 환경전문공사 등록 업체 데이터를 조회 및 다운로드하실 수 있습니다.해당 데이터는 연간 현행화 데이터(12월말 기준)이며, 차기 업데이트 예정일은 2027년 3월입니다.
