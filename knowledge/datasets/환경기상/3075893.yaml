description_portal: 해당자료는 부산광역시 환경관련 산업체( 환경전문공사업, 측정대행업, 환경관리대행기관, 환경컨설팅회사) 현황입니다.산업체의 회사명, 위치, 연락처 등이 기재된 것으로 산업체의 종류 및 환경 분야 종류별로 그 회사 자격 취득 여부를 분류하여 요약한 자료입니다.해당자료는 부산광역시 환경정책과에서 등록 및 등록변경을 받고 있으며, 시간의 변화에 따라 등록현황은 변경이 발생할 수 있으니 등록 관리부서에 별도 문의하여 주시기 바랍니다.(각 회사별 자체 사정에 따라 등록의 변경 등이 발생하여 상이 할 수 있음)
