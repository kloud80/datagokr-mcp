summary_user: 부산광역시에 등록된 환경관련 산업체(환경전문공사업·측정대행업·환경관리대행기관·환경컨설팅회사)를 업체 한 곳당 한 행으로 담은 현황 파일로, 상호명·대표자·업종·소재지·전화번호와 함께 대기·수질·소음진동·실내공기질·악취 등 분야별 자격 보유 여부를 표시한다. 사업장 담당자나 발주처가 부산에서 대기 측정대행이나 수질 환경전문공사를 맡길 수 있는 업체가 어디인지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·소재지 주소를 이름 매칭하는 방식으로만 이어 쓴다.
limits: 업체 고유번호나 사업자번호 같은 공통 키가 없어 다른 환경 업체·인증 데이터와 정확히 연결하기 어렵다. 범위는 부산광역시에 한정되며, 업체별 등록 변경이 수시로 생길 수 있어 현재 등록 상태는 담당 부서(환경정책과)에 따로 확인해야 한다.
