description_portal: '○ 통계개요* 통계명 : 소음진동민원 현황* 통계종류 : 서울시 지역별 소음진동민원 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 소음진동민원 현황을 파악하여 , 지역별 소음진동민원에 따른소음진동 저감대책 등 적정한 정책의 수립ㆍ시행을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울시 생활환경과* 공표주기 : 정기(매년, 12월말)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 자치구별 환경관련 전체민원 및 소음진동 민원 현황○ 기 타* 환경관련민원은 소음진동을 포함한 환경분야(대기, 수질, 폐기물, 상하수도, 하수도,축산폐수, 소음진동, 기타 등) 전체 민원을 의미함* 교통분야는 도로, 철도, 항공기, 생활분야는 확성기, 사업장, 공사장, 이동소음,개 소음 등을 포함함'
