summary_user: 폐기물 수집·운반 차량에 설치하는 GPS 단말기의 공급업체 목록으로, 업체별로 사업자등록번호·연락처·단말기 제조사·모델명·통신사업자·홈페이지를 담은 전국 단위 파일(CSV 약 3.6KB)이다. 수집운반 사업자가 올바로 현장정보 전송에 쓸 GPS 단말기를 어느 업체에서 어떤 모델·통신사로 공급받을 수 있는지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 폐기물 처리업·수집운반 허가 사업자 원장 등 사업자번호를 가진 다른 데이터와 이어 쓴다.
description_portal: 'GPS 제조사 정보는 폐기물처리 현장정보 GPS 제조사 정보는 폐기물처리 현장정보의 전송방법 등에 관한 고시에 따라 폐기물 수집 및 운반 차량에 설치된 GPS 단말기의 정보를 포함하고 있습니다.(공급업체명, 사업자등록번호, 연락처, 단말기 제조사, 모델명, 통신사업자, 통신사이름, 홈페이지)* 컬럼별 상세정보○ 공급업체명: GPS 단말기를 공급하는 회사명○ 사업자등록번호: 공급업체의 사업자등록번호○ 연락처: 공급업체의 고객 서비스 전화번호○ 단말기 제조사: GPS 단말기의 제조사○ 모델명: GPS 단말기 모델명○ 통신사업자: GPS 단말기의 통신 서비스를 제공하는 통신사 이름○ 홈페이지: 공급업체 또는 제조사의 공식 홈페이지 URL* 자세한 내용은 폐기물처리 현장정보 관리시스템 정보마당을 확인해 주시기 바랍니다.https://www.allbaro.or.kr/siren/cc/li/idxAsContract.do'
