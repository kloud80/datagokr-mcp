description_portal: 환경책임보험 전산망에서는 환경 관련 매체시설에 대한 행정처분 내역을 체계적으로 관리하고 있습니다. 매체시설 코드는 대상 시설을 고유하게 식별하는 코드활용됩니다. 처분 차수는 동일 대상에 대해 여러 차례 이루어진 처분의 순서를 나타내며, 행정처분의 이력 관리에 중요한 역할을 합니다.처분 일자는 처분이 공식적으로 결정된 날짜를 기록하며, 처분 시작 일자와 처분 만료 일자는 처분의 효력이 발효되는 기간을 명확히 나타냅니다. 처분 내용에는 처분의 구체적인 사유와 조치 사항이 상세히 기술되어 있으며, 감경여부는 처분이 경감되었는지 여부를 표시합니다.또한, 고발 여부는 처분과 관련해 법적 조치가 진행되었는지의 여부를 나타내며, 삭제 여부는 해당 처분 기록이 현재 유효한지 또는 삭제(비활성화)되었는지를 관리합니다. 이러한 정보를 통해 환경책임보험 관련 행정처분의 투명한 관리와 신속한 대응이 가능하며, 법적 절차의 이행과 추적에 필수적인 역할을 합니다.
