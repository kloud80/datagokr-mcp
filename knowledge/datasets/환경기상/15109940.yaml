summary_user: 대전광역시 유성구의 생활쓰레기 배출장소를 지점 한 곳당 한 행으로 담은 파일로, 도로명·지번 주소와 위도·경도(EPSG 4326), 사용 여부, 카메라·공공쓰레기통·헌옷수거함 유무, 일반·음식물·재활용품 배출 요일과 시간을 포함한다. 유성구 주민이 '우리 집 근처 배출장소는 어디이고 음식물쓰레기는 무슨 요일 몇 시에 내놓아야 하나'를 확인하거나, 분석가가 배출장소 분포와 수거 인프라를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소·좌표 기반 공간 결합이나 동 이름 매칭으로 잇고, 다른 지자체의 배출장소·수거함 파일과는 항목명을 맞춰 붙여 쓴다.
description_portal: '대전광역시 유성구 내에 생활쓰레기 배출 장소에 대한 데이터를 제공합니다.해당 데이터는 연번, 고유번호, 위치번호, 시도, 시군, 동, 도로명주소, 지번주소, 위도, 경도, 사용자고유번호, 등록일, 사용유무, 공공쓰레기통 유무, 일반쓰레기배출요일 등의 항목을 포함하고 있습니다.해당 데이터는 지역별 폐기물 처리 인프라와 생활 편의 환경을 분석하는 데 활용할 수 있습니다.또한 폐기물 수거 효율화, 도시환경 개선, 주민편의 서비스 운영 등에 활용이 가능합니다.이 외에도, 지도기반 위치서비스 개발, 지역환경 분석 등 다양한 분야에 활용할 수 있습니다.사용좌표계: EPSG 4326'
