summary_user: 서울특별시 강남구에서 건설폐기물을 수집·운반하거나 중간처리하는 업소를 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태(영업/폐업)·휴폐업 일자·사업장명·도로명/지번 주소·좌표 등을 담는다. 건설 현장 담당자나 분석가가 강남구에서 현재 영업 중인 건설폐기물 처리업체가 어디인지, 언제 허가받고 폐업했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 다른 자치구의 같은 인허가 목록과 이어 붙여 서울 전역 현황을 만든다.
