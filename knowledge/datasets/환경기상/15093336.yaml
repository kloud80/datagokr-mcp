description_portal: '이 데이터는 전북특별자치도 전주시 내에서 생활폐기물(음식물쓰레기)을 수거·운반하는 업체에 대한 정보를 제공하는 데이터로, 일반 시민, 음식점, 공동주택, 기관 등이 음식물쓰레기 배출 및 수거에 참고할 수 있습니다.구역별 담당 업체 정보를 제공하여 지역 환경 관리의 투명성 강화 및 시민 신뢰 확보에 기여하며, 시민들이 자신의 거주 지역이나 사업장에 해당하는 수거업체를 쉽게 확인할 수 있어 생활 편의 증진 및 민원 대응 체계 개선에도 활용됩니다.데이터 항목 : 업체명, 수거구역, 연락처, 기준일데이터 제공부서 : 양 구청 청소위생과'
