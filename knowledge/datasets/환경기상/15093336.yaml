summary_user: 전주시에서 음식물쓰레기를 수거·운반하는 업체를 업체별로 한 줄씩 담은 소규모 목록 파일(약 695바이트 CSV)로, 업체명·담당 수거구역·연락처·데이터기준일을 담는다. 시민·음식점·공동주택 관리자가 "우리 동네(사업장) 음식물쓰레기는 어느 업체가 수거하고, 어디로 연락하나"를 확인하는 데 쓴다. 전역 조인 키가 없어, 다른 데이터와는 수거구역 이름(동 이름 등)을 직접 맞추거나 같은 전주시의 다른 생활폐기물 배출·수거 파일과 나란히 놓고 쓴다.
limits: 수거구역이 행정코드나 좌표가 아닌 이름 텍스트라서 지도나 행정구역 코드와 바로 연결되지 않는다. 담는 범위는 전주시 한 곳의 수거업체 목록뿐이며, 음식물쓰레기 발생량이나 처리 실적 같은 통계는 없다.
