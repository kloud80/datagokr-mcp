summary_user: 경기도 폐수배출사업장이 배출시설·방지시설 설치 후 가동을 시작하려고 낸 가동개시 신고를 건별로 담으며, 사업장명·사업자번호·업종·산업단지·관할관청·신청일·처리상태·가동개시예정일과 시운전 시작·종료일이 들어 있다. 환경 담당자나 분석가가 '어느 산업단지에서 어떤 업종의 폐수배출시설이 언제 가동을 시작하거나 시운전 중인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 배출시설·수질 데이터와는 사업자번호·사업장명 같은 이름·코드 매핑이나 업종코드(indutype_cd)로만 맞춰 잇는다.
description_portal: 이 데이터는 폐수배출사업장의 배출 및 방지시설 가동개시 신청 신고 내역을 담고 있으며, 사업장이 폐수배출시설을 설치한 후 가동을 시작하기 위해 제출한 신고 내역을 포함합니다. 데이터에는 사업장명, 사업자번호, 업종코드 및 업종명, 산업단지 위치 정보, 관할관청, 신청일, 처리상태, 가동개시예정일 등이 포함되며, 그 외에도 설치명세와 폐수 및 방지시설의 시운전 기간 정보가 포함됩니다. "처리상태"는 신청 또는 승인 여부를 나타내며, 가동 예정일과 시운전 시작·종료일은 실제 설비 운영 전 확인 과정에서 중요한 정보를 제공합니다. 이 데이터는 환경오염 방지를 위한 규제 이행 확인, 산업단지 내 오염원 관리, 폐수배출 시설의 설치 현황 파악 및 환경영향평가 자료로서 유용하게 활용될 수 있습니다.
