summary_user: 충청남도 금산군에서 벙커C유를 연료로 쓰는 업체를 업체별로 한 행씩 담은 현황 파일로, 업체명·주소·연락처·사용연료·사용량이 들어 있으며 파일 크기가 148바이트에 불과해 수록 업체는 극소수입니다. 금산군 안에서 중질유를 태우는 대기오염 배출원이 어디에 있고 얼마나 쓰는지 확인하려는 지역 주민이나 대기환경 분석가가 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 배출시설·대기질 데이터와는 업체명이나 주소를 직접 맞춰 이어야 하며, 주소를 지오코딩해 공간정보와 겹쳐 보는 방식이 현실적이다.
description_portal: 이 데이터는 충청남도 금산군 벙커C유 사용업체 현황에 대한 내용을 제공하며, 업체명, 소재지, 연락처, 사용연료, 샤용량에 대한 정보가 수록되어 있습니다. 벙커C유(bunker C oil)는 중질유(重質油)의 한 종류로, 선박 연료나 산업용 보일러 연료로 많이 사용되는 잔사유(residual fuel oil)입니다. 해당 데이터를 공간정보와 연계하여 대기오염원 분포 및 인근 고오염지역을 파악하는데 활용할 수 있습니다. 데이터 기준일은 2025년 12월이며, 매년 1회 정기적으로 업데이트 됩니다.
