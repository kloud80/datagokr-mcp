summary_user: 대구광역시 관내에 등록된 환경전문공사업체의 상호·주소·종별·전화번호를 업체 한 곳당 한 행으로 담은 등록 목록이며, 약 3.8KB 크기의 CSV 파일 하나로 제공된다. 폐수처리·대기오염 방지시설 공사를 맡길 업체를 찾는 사업자나 지역별 환경전문공사업체 분포를 보려는 분석가가 "대구에 등록된 대기 분야 환경전문공사업체는 어디인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 주소를 기준으로 이름을 맞추거나 주소를 지오코딩해서 이어야 한다.
description_portal: 대구광역시 관내에 등록되어있는 환경전문공사업체의 상호, 주소, 종별, 전화번호 현황 자료 입니다. 대구시는 환경시설 설계·시공 분야에서 신속 대응이 가능한 중소 전문업체 풀(pool)을 확보하고 있으며, 관내 업체는 수시 등록·갱신을 통해 최신 사업 수요에 대응하고 있습니다. 이들 업체는 공공기관 발주 사업뿐 아니라 민간기업의 환경시설 수요에도 유연하게 대응할 수 있는 역량을 갖추고 있으며, 각종 폐수 처리, 대기오염 방지시설 설치 등의 전문 기술을 제공하고 있습니다. 필요하다면, 대구광역시 기후환경정책과(053‑803‑3684)로 연락하여 더 자세한 개별 업체 정보를 확인할 수 있습니다.
