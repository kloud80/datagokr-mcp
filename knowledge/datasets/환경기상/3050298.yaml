description_portal: '"본 데이터는 우체국물류지원단 본사, 지사 및 사업소를 대상으로 건물과 차량의 에너지 사용량과 온실가스 배출량을 체계적으로 관리하기 위해 작성되었습니다.시설은 건물과 차량으로 구분되며, 각 시설에서 사용된 도시가스(LNG, ㎥), 전력(kWh), 휘발유(ℓ), 실내등유(ℓ), 가스/디젤 오일(경유,ℓ)의 월별(1~12월) 사용량과 연간 합계를 수집하였습니다.이를 정부 고시 배출계수를 적용해 연료별·시설별 온실가스 배출량 합계(tCO2e)를 산정하였습니다.데이터는 연료별·시설별 비교 및 분석이 가능하도록 구성되어 있으며, 연간 및 월별 에너지 사용 패턴과 온실가스 배출 특성을 정량적으로 파악할 수 있습니다.이를 통해 온실가스 감축 활동 우선순위 설정, 시설 운영 효율성 진단, 친환경·탄소중립 목표 수립 등 다양한 정책·연구·실무 영역에 활용할 수 있습니다.※ 대전주유사업소는 소유권 이전에 따라 "23년 12월부터 데이터 제공이 불가함을 알려드립니다.※ 서서울물류사업소는 기능정지에 따라 "24년 4월부터 데이터 제공이 불가함을 알려드립니다."데이터 기준년도가 2024년으로, 데이터의 기준일은 2024년 12월 31일입니다.'
