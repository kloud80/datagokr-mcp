summary_user: 우체국물류지원단 본사·지사·사업소의 건물과 차량별로 도시가스·전력·휘발유·실내등유·경유의 월별(1~12월) 사용량과 연간 합계를 시설·연료 단위 행으로 담은 파일(csv)로, 포털 설명상 2024년 기준이며 정부 고시 배출계수로 산정한 온실가스 배출량(tCO2e)을 함께 제공한다. 공공기관 탄소중립 담당자나 분석가가 "이 기관의 어느 사업소, 어떤 연료가 배출을 가장 많이 내고 어느 달에 사용이 몰리는가"를 따져 감축 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 소속기관명·대상시설명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
limits: 사업자번호·시설 코드 같은 표준 키가 없어 배출시설 원장 등 다른 배출원 데이터와 바로 결합할 수 없고, 이름 매칭에 의존한다. 위치 정보가 없는 비공간 데이터라 지역별 분석에는 쓰기 어렵다.
