summary_user: 가정용 보일러(1·2종)의 환경표지 인증 내역을 제품 한 건씩 담은 파일로, 기업명·제품명·인증종류·급배기방식·순환방식·사용연료·인증번호·인증시작일과 본사·공장 주소를 포함하며 범위는 전국입니다. 친환경 보일러를 고르려는 소비자나 업계를 분석하는 사람이 '어느 회사의 어떤 연료·방식 보일러가 언제 환경표지 인증을 받았나'를 확인하는 데 쓴다. 사업자등록번호(bizno)가 실측 조인 키라서 같은 번호를 가진 다른 환경표지·녹색기업 등 환경 업체·인증 데이터나 사업자 정보와 이어 쓴다.
description_portal: 이 데이터는 한국환경산업기술원에서 제공하는 가정용 보일러의 1·2종 인증 현황을 체계적으로 정리한 것으로, 총 1328건의 인증 내역이 담겨 있습니다. 주요 항목에는 기업명, 제품명, 인증종류, 급배기방식, 순환방식, 사용연료, 인증번호와 인증일자, 그리고 본사 및 공장 주소 등이 포함되어 있습니다. 이를 통해 특정 기업의 보일러 인증 추이를 연도별로 확인하거나, 연료별·방식별로 인증 제품의 분포를 분석할 수 있습니다. 또한 기업별 인증 건수를 비교해 업계 현황을 파악하는 데 활용 가능합니다.
