summary_user: 서귀포시에서 운영 중인 매립장을 시설별로 한 줄씩 담은 소규모 현황 파일(CSV 412바이트)로, 구분(시설명)·위치(주소)·매립용량(제곱미터)·사용기한·데이터기준일자를 담는다. 주민·환경단체·지자체 담당자가 '서귀포시 매립장은 어디에 있고 언제까지 쓸 수 있는가'를 확인하거나, 대체 매립장 검토와 폐기물 감량 계획의 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명이나 주소를 맞춰 보거나 같은 기관(서귀포시) 자료끼리만 이어 쓴다.
limits: 시설 코드나 사업자번호 같은 공통 키가 없어 폐기물 처리업·처리시설 원장과 자동으로 연결되지 않고, 이름·주소 매칭에 의존해야 한다. 서귀포시 범위의 시설 목록이므로 매립량 추이나 폐기물 발생·처리 통계는 이 데이터로 알 수 없다.
