summary_user: 인천광역시 연수구의 석면조사대상 건축물을 한 건물당 한 행으로 담은 파일(약 4KB csv)로, 구분·건축물명(상호)·주소와 석면건축물 여부, 안전관리인 지정 여부, 연면적과 석면자재 면적을 기록한다. 주민이나 구청 담당자가 '우리 동네 어느 건물에 석면 자재가 얼마나 쓰였고 안전관리인이 지정돼 있는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 주소(도로명주소)로 건축물대장이나 좌표 자료와 맞추거나 건물명으로 매칭해 이어 쓴다.
