summary_user: 대구광역시 중구의 실내공기질 관리대상시설을 시설 한 곳당 한 행으로 담은 파일로, 시설군(지하역사·의료기관·어린이집·실내주차장 등), 시설명, 도로명주소, 데이터기준일자를 담는다. 주민이나 분석가가 '중구에서 실내공기질 관리 대상인 어린이집·의료기관은 어디인가'처럼 시설 위치와 유형을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·도로명주소 매칭이나 같은 기관 자료로만 이어 쓰며, 주소를 좌표로 바꿔 지도나 주변 대기질 측정소 자료와 겹쳐 볼 수 있다.
description_portal: 대구광역시 중구 실내공기질 관리대상시설에 대한 정보를 제공합니다.(시설군, 시설명, 소재지도로명주소, 데이터기준일자)- 실내공기질 관리대상시설은 실내 공기질을 관리하여 쾌적하고 건강한 환경을 유지하기 위해 관리가 필요한 시설을 말합니다.- 다중이용시설, 교육시설 등의 시설이 대상이 될 수 있으며, 실내 환경의 질을 높이고, 이용자들의 건강을 보호하기 위해 관리가 필요합니다.- 96건의 시설물에 대한 정보를 확인 할수 있으며, 지하역서, 의료기관, 어린이집, 실내주차장 등의 시설군으로 구분되어 있습니다.
