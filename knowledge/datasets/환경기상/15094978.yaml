summary_user: 인천 부평구 안의 종량제봉투 판매처를 한 곳당 한 행으로 담은 파일로, 판매처명·도로명 주소·우편번호와 종량제봉투·음식물 납부필증·대형폐기물 스티커·특수규격봉투 취급 여부(Y/N)가 들어 있다. 부평구 주민이 "우리 동네에서 대형폐기물 스티커나 음식물 납부필증을 파는 가게가 어디인가"를 찾거나, 분석가가 판매처의 생활권별 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 우편번호를 이름 매칭하는 방식으로만 이어 쓰고, 같은 부문의 다른 지자체 판매소 파일과는 항목 이름을 맞춰 합친다.
description_portal: '종량제봉투 판매처의 명칭, 주소, 우편번호, 취급 품목 등을 수록한 데이터.종량제봉투, 음식물납부필증, 대형폐기물스티커, 특수규격봉투 등의 판매 여부를 파악하여 주민 생활편의 증진, 폐기물 관리 체계 운영, 환경 정책 수립 및 행정 관리에 활용 가능하다.활용 목적 및 특징– 종량제봉투 판매처 분포 현황 및 취급 품목 분석– 주소·우편번호 기반 접근성 및 생활권 편의성 평가– 생활폐기물 처리 관련 주민 서비스 개선 자료 활용– 환경 위생 관리 및 자원 순환 정책 근거 제공주요 항목 설명● 판매처명: 종량제봉투를 판매하는 업소의 명칭● 소재지 주소: 판매처의 도로명 주소● 우편번호: 판매처 소재지의 우편번호● 종량제봉투취급여부: 종량제봉투 취급 여부(Y/N)● 음식물납부필증: 음식물쓰레기 납부필증 취급 여부● 대형폐기물스티커취급여부: 대형폐기물 스티커 취급 여부● 특수규격봉투취급여부: 특수규격봉투 취급 여부'
