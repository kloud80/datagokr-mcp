summary_user: 해양환경공단이 근해 해역의 측정 정점별로 수온·염분·pH·용존산소·영양염류 등 수질 관측값을 관측일 단위로 제공하는 API이며, 검증 시 전체 640건을 모두 수신했다. 근해 수질이 해역·시기별로 어떻게 달라지는지 확인하려는 분석가나 해양환경 담당자가 쓴다. 필드 중 clrpla(좌표 키 coord)로 다른 좌표 기반 데이터와 이어 쓰고, 정점 코드(stnpntCode)와 해역 코드(oceanCode)로 정점·해역별로 묶어 본다.
limits: 검증된 조인 키는 좌표(clrpla) 하나뿐이며, 명세상 필드 의미와 코드표가 입력에 없어 항목 단위·코드 해석은 별도 확인이 필요하다. 해양 오염사고·쓰레기, 보호구역·생태, 국가해양생태계종합조사, 해수욕장 일반정보는 이 데이터의 범위가 아니다. 개발계정은 일 5,000회까지 호출할 수 있다.
