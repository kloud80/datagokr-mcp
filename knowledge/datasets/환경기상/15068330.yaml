summary_user: 환경책임보험 제도에서 적용대상 시설과 의무가입 대상 시설을 구분별로 정리한 전국 단위 목록으로, 개별 사업장 원천 기록이 아니라 968바이트 크기의 CSV 기준표 한 개다. 기업 담당자가 자기 시설 유형이 환경책임보험 의무가입 대상인지 확인하거나, 보험사·정책담당자가 적용 범위를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어서, 다른 사업장 데이터와는 시설 유형 이름을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: 본 데이터는 환경책임보험 제도에서 적용 대상이 되는 시설과 의무가입 대상 시설 목록을 제공하는 공공데이터입니다. 총 4개 필드('목록', '구분', '환경책임보험 적용대상 시설', '환경책임보험 의무가입 대상 시설')를 포함하며, 사업장별로 해당 보험 가입 필요 여부와 적 용 범위를 확인할 수 있습니다. 보험사는 환경사고 리스크 평가 및 보험상품 개발에 활용하고, 기업은 보험가입 준비와 리스크 관리 계획 수립, 정책담당자는 보험제도 이행 현황 모니터링 및 제도 개선 방향 설정에 활용할 수 있습니다. 또한 시설 유형별 사고 이력 분석, 보험료 산정 기준 검토 및 교육자료 제작에도 유용합니다. 특히 환경책임보험 적용 범위 확대 및 저감 조치 계획 수립, 대국민 홍보 자료 제작과 법령 검토에도 활용할 수 있습니다.
