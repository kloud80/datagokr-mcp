summary_user: 전국오염원조사 중 공공하수처리시설·공공폐수처리시설·분뇨처리시설·가축분뇨공공처리시설 등 환경기초시설의 기본 정보를 시설별로 담은 전국 범위의 파일 데이터로, 연도·행정구역·시설코드와 연계처리시설, 방류 하천 정보가 들어 있다. 지자체 수질 담당자나 수질 분석가가 어느 처리시설이 어떤 하천으로 방류하는지, 어떤 시설과 연계해 처리하는지 확인할 때 쓴다. 전역 조인 키는 없으며, 같은 기관의 전국오염원조사 다른 테이블과 시설코드·행정구역코드로 맞추거나 방류수 하천명·하천코드, 법정동코드를 이름·코드 매핑해 수질 측정 자료와 잇는다.
description_portal: 전국오염원조사 오염원 중 환경기초시설(공공하수처리시설, 소규모공공하수처리시설, 공공폐수처리시설, 분뇨처리시설, 가축분뇨공공처리시설, 기타공공처리시설)에 해당하는 기본 정보를 포함하는 시스템 내 테이블 데이터임. 시설의 일반현황(시설명, 소재지, 시설용량, 처리방법 등), 시설 운영현황(측정일자별 유량(총유입량, 관로이송량, 직접이송량, 방류량, 재이용수) 및 오염도(BOD, SS, TN, TP, TOC, 특정수질유해물질 등), 방류선에 대해 지자체에서 작성 및 제출 후 검증하여 확정된 자료 포함하고 있음.
