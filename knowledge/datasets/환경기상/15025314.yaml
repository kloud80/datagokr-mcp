summary_user: 나주시 안에 있는 폐기물 처리업체를 업체별로 한 행씩 정리한 원천 목록으로, 업체명·업종·소재지 주소·처리물질·전화번호를 담는다(csv 약 13.7KB). 사업장이나 주민이 특정 폐기물을 맡길 나주 지역 수집·운반·처리 업체와 그 연락처를 찾을 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 폐기물 처리업 허가·배출자 데이터와는 업체명이나 주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 이 데이터는 지역 내 폐기물 처리와 관련된 민간·전문 업체의 기본 정보를 체계적으로 정리한 자료로, 업체명, 업종, 소재지 주소, 처리물질, 전화번호 등이 포함된다. 이를 활용하면 각 업체가 담당하는 처리 공정(수집·운반, 중간처리, 재활용, 최종처리 등)과 담당 물질의 종류를 명확히 파악할 수 있어, 특정 폐기물의 위탁처 선정이나 긴급 대응 시 신속한 의사결정이 가능하다. 또한 환경오염 사고 예방을 위해 업체 주변 민감시설(학교·주거지·하천 등)과의 위치 관계를 분석하거나, 처리능력 및 업종별 분포를 검토해 과부하 위험 지역을 파악하는 데에도 유용하다. 더불어 신고·허가 기반의 규제 준수 여부를 모니터링하고, 폐기물 순환경제 구축을 위한 정책 수립(재활용 확대, 불법투기 감시 강화 등)의 기초자료로 활용할 수 있다.
