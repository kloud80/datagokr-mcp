summary_user: 수원도시공사 자원순환센터의 폐기물 반입·반출량을 월 단위(월구분)로 톤 단위로 집계한 작은 CSV 파일(414바이트)로, 재활용품·대형폐기물·가로모래 반입량과 재활용품·소각·매립지·기타 반출량을 담는다. 수원시 정책 담당자나 분석가가 '이 센터로 들어온 재활용품 중 얼마가 소각이나 매립으로 나갔는가'처럼 처리 경로별 물량과 월별 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역 코드도 없는 비공간 집계표라서, 다른 데이터와는 월 기준으로 나란히 놓거나 같은 기관 자료끼리 비교하는 방식으로만 이어 쓴다.
description_portal: 수원도시공사 자원순환센터에서는 재활용품, 대형 폐기물 등 다양한 폐기물에 대한 반입 및 반출 현황을 연간 단위로 체계적으로 집계하고 관리하고 있습니다. 이 통계 자료는 폐기물의 종류별 발생량과 처리 경로를 명확히 파악하는 데 활용되며, 자원순환과 관련된 정책의 수립 및 개선 방향을 설정하는 데 중요한 역할을 합니다. 또한, 폐기물 처리의 투명성과 효율성을 높이는 기반 자료로 활용되어 시민들에게 신뢰를 제공하고, 환경 보호와 지속가능한 자원관리 실현을 위한 근거 자료로도 쓰입니다. 이러한 연간 자료는 행정기관, 연구기관, 정책 입안자들에게도 유용하게 제공되어 지역사회 전반의 폐기물 감축 및 재활용 활성화에 기여하고 있습니다.
