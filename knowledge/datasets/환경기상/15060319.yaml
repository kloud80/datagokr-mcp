summary_user: 경상남도 거창군에 사업장폐기물 배출자로 신고한 사업장을 한 곳씩 담은 건별 목록으로, 폐기물 구분(일반·지정 등), 상호명, 연락처, 사업장 도로명주소, 데이터 기준일자를 담는다(CSV 약 19.8KB). 폐기물 처리업체나 행정 담당자가 '거창군 안에서 지정폐기물을 배출하는 사업장은 어디이고 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명주소를 맞춰 붙여야 하며, 처리업 허가 현황 등 같은 기관의 폐기물 데이터와 이렇게 엮어 쓴다.
description_portal: '경상남도 거창군의 사업장폐기물 배출자 신고 현황은 관내 사업장에서 발생하는 폐기물을 적법하게 관리하고 환경오염을 방지하기 위한 핵심 데이터입니다. 「폐기물관리법」에 따라 일정 규모 이상의 폐기물을 배출하는 사업장은 의무적으로 종류, 발생량, 처리 계획 등을 관할 지자체에 신고해야 합니다.거창군의 관련 공공데이터(2024~2025년 기준)는 다음과 같은 항목을 중심으로 체계적으로 관리되고 있습니다.주요 관리 항목: 폐기물 구분(일반·지정 등), 상호명, 연락처, 사업장 도로명 주소, 데이터 기준일자 등운영 목적: 배출자가 적법한 처리업체와 계약을 맺고 폐기물을 안전하게 위탁·처리하도록 유도하며, 미신고 시 과태료 등의 행정처분이 부과됩니다.이 현황은 거창군 내 산업 활동에 따른 폐기물 발생 흐름을 파악하고, 지역 사회의 쾌적한 환경 보전과 자원순환 정책을 수립하는 기초 자료로 유용하게 활용되고 있습니다.'
