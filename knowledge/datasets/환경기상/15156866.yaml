summary_user: 생활폐기물 품목명을 넣으면 그 품목의 대표 배출방법과 배출장소(배출함) 이름·주소를 돌려주는 조회 API로, 전국을 대상으로 장소를 개별 주소 단위로 담는다. 주민이 '폐건전지나 형광등은 어떻게 버리고 가까운 수거함은 어디 있나'를 확인하거나, 분리배출 안내 앱을 만드는 개발자가 품목별 배출 안내에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기본 주소(addrBase) 같은 주소 문자열이나 품목명 매칭으로만 이어 쓴다.
description_portal: 사용자가 생활폐기물 분리배출에 필요한 핵심 정보를 편리하게 조회할 수 있도록 돕습니다. 검색한 배출 품목명을 기준으로 해당 품목의 대표 배출방법과 배출장소의 주소를 제공합니다.
team:
  dept: 자원재활용과
services:
  - op: /getItem
    name: 배출품목 정보 조회
    endpoint: https://apis.data.go.kr/1482000/WasteRecyclingService/getItem
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: itemNm
        required: true
        desc: '품목명 검색어 (예: 생수병, 우유팩)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getSpot
    name: 분리배출 장소정보 조회
    endpoint: https://apis.data.go.kr/1482000/WasteRecyclingService/getSpot
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: addr
        required: true
        example: 문래동
        desc: '주소 검색어 (동/읍/면 단위) (예 : 문래동)'
      - name: latitude
        required: false
        example: '37.5182396969791'
        desc: 현재 위치 위도 (Y좌표) - 좌표 검색 시 longitude와 함께 필수
      - name: longitude
        required: false
        example: '126.895880210522'
        desc: 현재 위치 경도 (X좌표) - 좌표 검색 시 latitude와 함께 필수
      - name: radius
        required: false
        example: '500'
        desc: '검색 반경 (미터 단위) - 좌표 검색 시 유효. 기본값: 500m'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
