summary_user: 환경정보공개시스템에 등록된 대표 사업체 아래 개별 사업장별로 연도별 폐기물 발생량을 일반·지정·건설·생활·기타폐기물로 나누고 그 합계(총폐기물발생량)까지 담은 전국 단위 CSV 파일이며, 포털 설명 기준 4,355건이다. 분석가나 지역 주민이 '자동차·전자부품·화학 등 특정 업종의 대형 제조 사업장이 해마다 지정폐기물을 얼마나 내는가'를 확인할 때 쓴다. 대표사업장코드(eid_workplace_id)가 실측 조인 키라서 같은 코드를 쓰는 환경정보공개시스템의 다른 사업장 데이터와 이어 쓴다.
description_portal: 이 CSV 파일은 환경정보공개시스템에서 수집한 대표 사업체별 폐기물 발생량 상세 정보를 담고 있습니다. 총 4,355건의 데이터가 있으며, 각 사업장은 대표사업장코드, 대표사업장명, 개별 사업장명, 사업장 구분, 업종 및 세부 업종, 유형과 특성 등의 기본 정보와 함께 폐기물 발생 현황이 기록되어 있습니다.폐기물 항목은 일반폐기물, 지정폐기물, 건설폐기물, 생활폐기물, 기타폐기물로 구분되며, 이를 합산한 총폐기물발생량도 제공됩니다. 예를 들어, 한국지엠(주) 부평공장과 같은 대형 제조업체의 경우 수천 톤 단위의 폐기물이 발생하는 것으로 나타나며, 업종별로 자동차 제조, 전자부품, 화학제품 등 다양한 산업군이 포함되어 있습니다.
