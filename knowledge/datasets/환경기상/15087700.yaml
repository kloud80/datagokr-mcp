summary_user: 부산광역시 남구에 설치된 공공 쓰레기통을 위치별로 한 행씩 적고, 쓰레기통 종류(담배꽁초 휴지통 등)와 설치대수를 담은 작은 현황 파일(CSV 235바이트)이다. 주민이나 구 담당자가 '우리 동네 도로·공원·버스정류장 주변 어디에 공공 쓰레기통이 몇 개 있나'를 확인하거나 추가 설치 필요성을 검토할 때 쓴다. 전역 조인 키나 좌표·행정코드가 없어, 다른 데이터와는 위치 이름을 맞추거나 같은 기관(남구)의 다른 생활폐기물 배출·수거 지점 파일과 나란히 놓고 쓴다.
limits: 위치가 텍스트로만 적혀 있어 지도에 바로 올리거나 다른 데이터와 키로 결합할 수 없고, 남구 한 곳만 다룬다. 쓰레기 발생량이나 수거·처리 실적 같은 통계는 담지 않는다.
