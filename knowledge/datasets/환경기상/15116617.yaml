description_portal: 이 데이터는 해양수산부에서 해수욕장의 방사성물질 측정 정보를 제공하기 위해 수집한 데이터입니다.  측정연도/주차 값을 파라미터로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 세슘137과 삼중수소(3H)와 같은 방사성물질 종류, 해수욕장명, 측정된 수치 수준, 정보 갱신 날짜로 구성되어 있습니다.  본 데이터는 해수욕장별 해양방사능 측정 결과를 바탕으로 각 지자체 및 관계 기관에서 지역별 해양환경 감시, 방사능 안전성 평가, 해수욕장 관리 및 정책 수립 및 추이 분석 등 활동을 위한 기초 데이터로 활용될 수 있습니다.
