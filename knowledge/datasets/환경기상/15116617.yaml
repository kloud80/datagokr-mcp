summary_user: 해양수산부가 해수욕장별로 측정한 세슘137·삼중수소 같은 방사성물질의 측정 수치를 측정연도와 주차 단위로 조회하는 API로, 전국 해수욕장을 대상으로 한다. 지자체나 해수욕장 관리자, 피서객이 '이번 주 이 해수욕장의 방사능 수치는 어느 수준인가'를 확인하거나 해수욕장별 추이를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 해양수질·해수욕장 데이터와는 해수욕장명을 맞추는 방식으로만 연결된다.
limits: 공통 코드나 좌표 같은 조인 키가 없어 해수욕장명 매핑에 의존해야 하며, 이름 표기가 다르면 연결이 어긋날 수 있다. 조회 때 측정연도와 주차를 파라미터로 넣어야 하고, 개발계정은 하루 10,000회로 호출이 제한된다.
