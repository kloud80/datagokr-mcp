description_portal: '- 전국 지하역사의 실내공기질 자동측정망으로부터 수집된 초미세먼지 월별 확정 정보를 개방하고 있습니다.- 측정장비의 동작불량, 점검 등에 따른 이상 측정값을 선별하여 제외하고, 정상적으로 측정된 측정값을 확정한 자료입니다.- 2021년 4월 1일부터 지하역사의 초미세먼지 농도를 측정하고 공개하도록 법이 시행되면서 시민들이 평소에 이용하는 지하역사의 초미세먼지 측정 결과에 대한 보다 더 정확한 정보 제공을 위해 이상 자료를 선별하여 확정된 자료를 제공하고 있습니다.- 해당 자료는 각 철도운영기관에서 생산하여 확정한 자료이며, 데이터 검증을 위한 확정 과정에서 약 2개월의 시간차가 있습니다.'
