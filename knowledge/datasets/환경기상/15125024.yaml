summary_user: 전국 지하역사 실내공기질 자동측정망에서 수집한 초미세먼지 측정값을 역(지점)·운영기관·호선·측정 위치별로 월 단위 확정해 담으며, 장비 이상·점검 시 값을 걸러낸 확정 자료다. 시민이나 분석가가 '내가 타는 노선의 지하역사 초미세먼지 농도는 달마다 어땠나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 역명·호선명·운영기관명 같은 이름 매칭으로만 잇는다.
