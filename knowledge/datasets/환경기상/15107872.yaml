description_portal: 대구광역시 군위군의 중질유사용업체현황에 대한 데이터로 업체명, 전화번호, 주소, 사용연료, 사용량의 항목을 제공합니다. 산업시설 또는 상업시설에서 중질유를 연료로 사용하는 사업장을 파악하기 위해 중요한 행정·환경 기초 데이터입니다. 이 데이터는 온실가스 감축, 대기오염 관리, 에너지 전환 정책 수립 등 여러 분야에서 활용됩니다. 업체명은 기업 식별 기본정보로 환경관리 대상 업체 구분에, 전화번호는 환경청/지자체 지도점검 연락, 에너지진단 및 컨설팅 대상 접촉에 .주소는 지역별 연료 소비 분포 파악, 오염 취약 지역 분석, GIS 기반 대기질 모델링에 활용됩니다. 사용연료는 중질유 단독 사용 또는 혼합 사용 구분과 연료전환 대상 식별에, 사용량은 온실가스 배출량 추정, 에너지소비량 통계, 과다 사용 사업장 선정기준에 활용됩니다.
