summary_user: 환경표지 인증을 받은 친환경콘덴싱보일러(1종) 제품을 제품 한 건씩 담은 인증 목록으로, 업체명·제품명·인증번호·인증사유와 최초인증일·인증시작일·인증종료일, 본사·공장 지역 구분이 들어 있습니다(전국 범위, CSV 약 213KB). 구매 담당자나 소비자가 "이 보일러 모델이 지금 환경표지 인증 유효기간 안에 있는가"를 확인하거나, 정책 담당자가 업체·지역별 인증 보유 현황을 집계하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 사업자번호나 업체명·제품명 매칭, 또는 같은 기관의 다른 환경표지 제품군 인증현황과 같은 형식으로 이어 쓴다.
description_portal: 본 데이터는 한국환경산업기술원 환경표지인증시스템에서 제공하는 친환경콘덴싱보일러(1종) 제품에 대한 인증 현황을 상세히 담고 있는 공공데이터입니다. ‘대상제품군’, ‘업체명’,  ‘제품명’, ‘용도’, ‘인증사유’, ‘인증번호’, ‘최초인증일’, ‘인증시작일’, ‘인증종료일’, ‘사업자번호’, ‘본사지역구분’, ‘공장지역구분’, ‘공장구분’, ‘기본제품’ 등 총 14개 필드를  포함하며, 각 보일러 제품이 언제, 어떤 사유로 인증을 획득하였는지와 인증 유효 기간을 한눈에 확인할 수 있도록 설계되었습니다. 이를 통해 제조업체는 인증 갱신 일정을 관리하고, 판매·유통업체는 제품 라인업의 친환경 인증 상태를 파악할 수 있으며, 정책 담당자는 인증 데이터 기반으로 친환경 기기 보급 정책 효과를 분석하고, 연구자 및 마케팅 담당자는 시장 조사와 보고서 작성 시 활용할 수 있습니다.
