summary_user: 부산광역시 남구에서 신고된 석면 해체·제거 작업을 작업 건별로 담은 파일로, 작업신고번호·공사현장명·소재지·건물(설비)명·해체제거업체명·작업 시작일과 종료일·석면 종류·면적(부피·길이)이 들어 있다(CSV 약 5KB). 주민이나 지역 단체가 "우리 동네 근처에서 언제, 어느 건물에서 석면 철거 공사가 진행되는가"를 확인하거나, 분석가가 남구 내 석면 해체 작업의 업체별·기간별 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 업체명·현장명을 이름으로 맞춰 잇고, 같은 남구 또는 다른 시군구의 석면 해체 현황과는 같은 항목끼리 이어 붙여 쓴다.
description_portal: 부산광역시 남구 석면해체제거작업현황(시설명, 위치, 공사명, 종류명, 시작일, 종료일 등) 자료를 제공합니다.본 공개자료는 최근 사회적으로 주목받고 있는 석면 해체·제거 작업의 현황을 투명하게 공개하여, 작업자와 지역 주민의 건강 보호 및 환경오염 방지에 기여하고자 마련되었습니다. 석면은 여전히 건축물 해체 과정에서 노출 위험이 높아, 건강피해 예방과 작업자 안전 강화가 중요한 사회적 과제로 부각되고 있습니다.공개된 자료에는 작업 장소, 기간, 안전관리 현황, 환경오염 방지 조치 등 주요 정보가 포함되어 있으며, 관련 법령과 지침에 따라 체계적으로 수집·정리되었습니다. 이를 통해 정보 공개의 투명성을 확보하고, 석면으로 인한 잠재적 위험을 최소화하며, 피해자 지원 및 보상 체계 개선을 위한 사회적 논의에 기여하고자 합니다.자료는 참고용으로 제공되며, 구체적인 판단과 조치는 반드시 전문가와 법규를 바탕으로 하시길 바랍니다. 앞으로도 지속적인 자료 업데이트와 함께, 공공안전 강화와 사회적 책임 이행을 위한 노력을 지속할 계획입니다.
