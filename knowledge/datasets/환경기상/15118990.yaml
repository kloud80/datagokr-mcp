description_portal: '해당 공공데이터는 산림보호법을 적용하여 산림 내 불법행위에 대한 단속 현황을 연도별로 나타냅니다.불법행위 유형으로 불법 산림형질변경, 무허가 벌채, 도벌, 기타로 구분하며 유형 별 단속한 건수와 조치사항 과태료로 구분합니다.해당 공공데이터는 매년 현행화되어 제공됩니다.2024년 광주광역시 산림 내 불법행위 단속실적 데이터 입니다. o  기간: 2024년(4.1.~5.31./ 7.1.~8.31./9.15.~10.31.)5개 자치구별 불법행위 단속인원(명), 단속결과(건,천원), 조치사항(건), 과태료 부과(건,천원)'
