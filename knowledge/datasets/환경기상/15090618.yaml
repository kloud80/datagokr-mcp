description_portal: 본 데이터는 국립공원공단이 각 국립공원사무소별로 설치·운영 중인 **우량국(강우계측기)**에 대한 현황 자료로, 국지성 집중호우 등 기상재난 상황에 신속하게 대응하고 공원 내 재해취약구간을 관리하기 위한 기초 기상정보를 제공합니다. 각 우량국은 실시간으로 강우량을 측정하며, 주요 항목에는 국립공원명, 공원사무소명, 우량국 고유 식별번호, 설치 위치(위도·경도), 해발 고도, 설치 연도, 장비 유형, 계측 주기, 최근 데이터 호출 일시, 장비 작동 상태 등이 포함됩니다. 본 데이터는 탐방로 및 급경사지 안전관리, 산사태 예경보, 기상 기반 탐방통제 기준 수립, 기후 변화에 따른 강수 패턴 분석 등에 활용될 수 있으며, 국립공원 통합재난안전 플랫폼 및 실시간 모니터링 시스템과 연계되어 운영됩니다. 데이터는 CSV 또는 API 포맷으로 제공되며, 공간정보 기반 시각화에도 적합합니다.
