description_portal: 이 데이터는 한국석유공사가 보유한 저공해 자동차의 연도별 현황을 정리한 통계 자료로, 하이브리드차, 전기차, 수소차 등 친환경 차량의 실제 운용 규모를 수치로 제공합니다. 보유 현황은 공공기관의 친환경차 도입 성과를 객관적으로 나타내는 지표로, 정부의 저탄소 교통정책 이행, 기관의 ESG 경영 평가, 탄소중립 이행 수준 등을 분석하는 데 유용하게 활용됩니다. 또한 친환경 차량의 도입 추세나 차종별 분포 현황을 파악할 수 있어 향후 차량 교체 및 도입 계획 수립에 실질적인 참고자료로 쓰입니다. 데이터는 연도별로 구성되어 있어 시계열 분석 및 시각화에 적합하며, 정책 실적 관리와 환경보고서 작성 등에 신뢰도 높은 근거자료로 제공될 수 있습니다.
