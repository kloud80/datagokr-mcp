summary_user: 서울 서초구 관내 의류수거함을 한 개씩 행정동·설치장소명·도로명/지번 주소·위도경도로 담은 건별 위치 목록이다(CSV 약 30KB). 주민이 우리 동네에서 가장 가까운 헌옷수거함이 어디 있는지 찾거나, 구청·분석가가 행정동별 수거함 분포와 배치 공백을 점검하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 주소·좌표를 기준으로 다른 생활폐기물 배출·수거 지점 데이터나 행정동 경계와 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 서울특별시 서초구 관내에 있는 의류수거함 위치 데이터입니다. 이 데이터는 주로 연번, 행정동, 설치장소명, 소재지 도로명주소, 소재지 지번주소그리고 위도 및 경도와 같은 상세한 위치 정보를 포함합니다. 각 수거함의 위치를 행정동 단위로 제공하여 지역별 분포 현황을 쉽게 파악할 수 있습니다. 주소 정보가 포함되어 있어 현장 위치 확인 및 관리 업무에 활용 가능합니다. 위도와 경도 좌표를 함께 제공하여 자세한 위치를 확인 및 공간정보 분석에도 활용될 수 있습니다. 이 데이터는 시민들의 의류 재활용 편의성을 높이고, 도시 환경을 개선하는 데 활용됩니다. 또한 이 데이터를 통해 수거함의 효율적인 배치 계획을 수립하고, 관리 상태를 점검할 수 있습니다. 데이터기준일자는 해당 정보가 언제 기준으로 작성되었는지를 의미합니다.
