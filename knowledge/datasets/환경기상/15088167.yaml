summary_user: 대구공공시설관리공단이 운영하는 하수처리장(사업소)의 하루 단위 유입수·방류수 수질을 담은 파일로, 생활계·공단계 유입수와 방류수별 유량·온도·pH·BOD·TOC·SS·총질소·총인·대장균 측정값이 날짜별로 기록된다. 하수처리장이 들어온 오수를 얼마나 정화해 내보내는지, 예컨대 특정 기간 방류수 BOD·총인이 어떻게 변했는지 살펴보려는 분석가나 지역 수질에 관심 있는 시민이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 하천·수질측정망 데이터와는 날짜나 사업소 이름을 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 대구공공시설관리공단 하수처리현황 정보를 조회할 수 있다. 2013년 이후 신천사업소, 서부사업소, 달서천사업소, 북부사업소, 지산사업소, 안심사업소, 현풍사업소의 하수처리현황 정보를 조회할 수 있다.※ 하수처리 과정에서 유입수(Influent)는 하수처리장으로 들어오는 처리되지 않은 물을 의미합니다. 이는 도시의 가정, 상업 시설, 산업체 등에서 발생하는 오수와 빗물, 지하수가 하수관거를 통해 모여들어 하    수처리장으로 유입되는 물 전체를 포함합니다.    하수처리에서 방류수(Effluent)는 하수처리 과정을 거쳐 정화된 물을 의미합니다. 이 물은 다양한 물리적, 화학적, 생물학적 처리 단계를 거쳐 오염물질이 제거된 후, 최종적으로 하천, 강, 바다 등의 공공수역    으로 배출됩니다.
