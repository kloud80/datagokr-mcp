description_portal: 세계기후평년값은 기상관측자료의 국제적 교환을 위해, 세계기상통신망(GTS)을 통해 수집한 각 나라의 기상전문 중 기후평년값을 제공하고 있습니다.전세계 기상전문을 제공하는 나라의 월별평년값 데이터를 제공합니다. 제공되는 요소는 지점번호와 시작, 종료연도를 포함하여 평균기온, 최고기온, 최저기온, 강수량, 일조시간이며, 관측이 시작된 년도를 기준으로 30년 데이터가 없는 경우 시작년도가 다르게 제공되며 평년값이 제공되므로 반드시 시작년도와 종료년도 확인하시기 바랍니다.
