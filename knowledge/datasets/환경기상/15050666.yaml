description_portal: 자외선 복사 중 UV-A(320~400nm)와 UV-B 영역 중 인체에 홍반을 발생시키는 홍반자외선B(280~320nm)를 관측한 자료입니다. 일반적으로 UV-A, UV-B, UV-C로 나뉘며, 이 중 자외선A와 자외선B는 오존층에 일부가 흡수되고 그 나머지가 지표에 도달합니다. 지표에 도달하는 자외선은 적은 양이지만 인간과 동·식물에게 큰 피해를 줄 뿐만 아니라 광화학 반응에도 영향을 미치면서 대기 환경을 변화시킵니다. 기상청은 자외선 복사 중 자외선A(320~400nm)와 자외선B 영역 중 인체에 홍반을 발생시키는 홍반자외선B(280~320 nm)를 관측하고 있습니다.※ 안면도 1999~, 울릉도독도 2018~, 고산 2018~ 자료 제공합니다.※ 전년도 자료는 당해연도 7월(연 1회)에 업데이트 되며, 향후 새로운 품질관리 기준에 의해 변경될 수 있습니다.※ 공란은 이상값 또는 장비 수리, 점검 등에 의한 결측을 의미합니다.
