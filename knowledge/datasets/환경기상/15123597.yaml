description_portal: 「환경오염시설의 통합관리에 관한 법률」 제27조 및 동법 시행규칙 제29조제1항에 따라 아래의 사항에 대한 내용을 제공하는 데이터 입니다.<공개결정사항>가. 「환경오염시설의 통합관리에 관한 법률」제5조제1항에 따른 사전협의 신청 내용에 대하여 동법 제29조에 따라 지정된 환경전문심사원이 검토한 내용나. 「환경오염시설의 통합관리에 관한 법률」제5조제2항에 따른 사전협의 검토 결과다. 「환경오염시설의 통합관리에 관한 법률」제6조에 따른 허가 또는 변경허가의 신청 및 결정에 관한 정보 등 법 제27조에서 공개하도록 규정되어 있는 사항라. 「환경오염시설의 통합관리에 관한 법률」제33조에 따른 연간 보고서 ※ 허가 또는 변경허가의 신청에 관한 정보란 4대 필수정보(붙임3)이며, 결정에 관한 정보란 허가검토결과서(부록포함) 등을 말함.다만, 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 같은 항 각 호의 정보를 공개하지 않을 수 있습니다.가. 공개할 경우 국가안전보장 질서유지 또는 공공복리에 현저한 지장을 초래할 것으로 인정되는 경우나. 기업의 영업비밀과 관련되어 일부 정보를 공개하지 아니할 필요가 있다고 인정되는 경우
