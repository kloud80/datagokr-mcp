summary_user: 서울특별시 동작구에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 파일(csv, 약 12KB)로, 상호·사업장 또는 현장 주소·배출 폐기물 종류가 들어 있다. 동작구 안에서 어떤 사업장이 어떤 종류의 폐기물을 배출한다고 신고했는지, 동네별로 배출 사업장이 어디에 몰려 있는지 확인하려는 주민·수집운반 사업자·분석가가 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 폐기물 처리업·배출자 원장과는 상호와 주소를 맞춰 대조하는 방식으로만 연결한다.
description_portal: 폐기물관리법 제17조에 근거하여 사업장폐기물배출자 신고현황 및 내용에 관한 데이터입니다.이 데이터에는 사업장명, 사업장 주소지, 사업장폐기물 배출자 신고항목(폐기물 종류))이 있습니다.상호 항목은 폐기물을 배출하는 사업장을 식별하기 위한 기본 정보입니다.주소 정보는 각 사업장의 위치를 확인하고 지역별 폐기물 배출 분포를 분석하는 데 활용됩니다.폐기물 종류는 해당 사업장에서 어떤 형태의 폐기물이 발생하는지를 보여주는 항목입니다.이 데이터는 사업장별 폐기물 배출 특성을 분석하는 데 기초 자료로 사용됩니다.
