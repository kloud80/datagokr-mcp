description_portal: 이 데이터는 제주특별자치도 제주시 관내에서 특수용(불연성) 마대를 판매하는 업소 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 생활환경과로, 생활폐기물 관리 및 배출 체계 운영과 관련된 행정업무의 기초자료로 활용됩니다. 제주시 내 불연성 폐기물 배출을 위한 지정 판매처의 분포와 운영 현황을 파악할 수 있도록 구성되어 있습니다.데이터의 주요 항목은 구분, 상호명, 지역, 주소, 연락처로 이루어져 있습니다. 구분 항목을 통해 업소의 유형을 확인할 수 있으며, 상호명 항목에서는 개별 판매업소를 식별할 수 있습니다. 지역과 주소 항목을 통해 업소의 위치를 파악하여 이용 접근성을 검토할 수 있으며, 연락처 항목을 통해 해당 업소에 대한 문의 및 이용 정보를 확인할 수 있습니다.
