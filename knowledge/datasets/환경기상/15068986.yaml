summary_user: 해양환경공단 해양수질자동측정망 인천 송도 정점에서 자동 측정한 수온·염분·용존산소·수소이온농도·탁도·전기전도도·클로로필 값을 관측일자별 시계열로 담은 CSV 파일(약 1.8MB)이다. 연구자나 지자체 담당자가 송도 앞바다의 용존산소나 탁도가 시기별로 어떻게 변했는지, 이상 수치가 언제 나타났는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 다른 해양수질자동측정망 정점 자료와는 같은 기관의 정점코드·정점명과 관측일자를 맞춰 이어 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 인천 송도 해역의 수질 측정 정보를 제공합니다. 본 데이터는 실시간 자동측정 방식을 통해 수온, 염분, 용존산소(DO), 수소이온농도(pH), 탁도, 전기전도도 등 주요 수질 항목을 연속적으로 측정한 결과를 포함합니다. 인천 송도는 하천 유입과 해양개발, 연안활동 등이 복합적으로 영향을 미치는 지역으로, 수질 변화 감시에 대한 수요가 높은 해역입니다. 측정자료는 오염원 모니터링, 수질 특성 분석, 환경변화 대응 등에 활용됩니다. 데이터는 측정항목별 시계열 형식으로 구성되며, 공공기관, 연구기관, 지자체 등에서 수질관리 정책 수립 및 연구 기반자료로 활용됩니다.
