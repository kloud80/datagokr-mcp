summary_user: 대전도시철도 1호선 역사에 설치된 측정장비로 수집한 초미세먼지(PM-2.5)의 역별 측정값을 오픈API로 제공하는 데이터입니다. 호흡기 질환자나 지하철 이용자가 "지금 내가 탈 역의 지하 역사 초미세먼지 농도가 어느 정도인가"를 확인하거나, 분석가가 역사 실내공기질을 모니터링하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 역 이름 매핑이나 같은 기관(대전교통공사)의 다른 역사 데이터로만 이어 쓸 수 있습니다.
limits: 표준 역 코드 같은 공통 조인 키가 없어 에어코리아 실외 대기질 등과 결합하려면 역 이름을 직접 맞춰야 합니다. 범위는 전국·비공간으로 분류되어 있지만 실제 내용은 대전 1호선 역사에 한정되며 좌표 등 공간 정보는 확인되지 않았습니다. 개발계정은 하루 1,000회 호출 제한이 있습니다.
