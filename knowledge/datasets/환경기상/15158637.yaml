description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사에 설치된 미세먼지 측정장비를 통해 수집한 초미세먼지 측정 정보를 제공하는 데이터입니다.PM-2.5, 즉 입자 크기가 2.5µm 이하인 초미세먼지의 역별 실시간 측정값을 포함하며, 지하 역사 내 공기질 현황을 파악하는 데 활용할 수 있습니다.본 데이터를 활용하면 지하철 이용 시민을 위한 실내 공기질 안내 서비스, 환경 모니터링 앱, 대중교통 환경 개선 연구 등 다양한 분야에서 유용하게 사용할 수 있습니다.특히 호흡기 질환자나 건강 취약계층이 지하철 이용 전 역사 내 공기질을 미리 확인할 수 있어 시민 건강 보호에 기여할 수 있습니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
