summary_user: 전라남도 화순군에 신고된 사업장폐기물 배출자를 사업장 한 곳씩 담은 건별 원장 파일로, 상호·사업장주소·생활계구분·폐기물 종류·처리방법·업무구분을 담는다(CSV 약 55KB, 범위는 화순군 한 시군구). 지역 주민이나 분석가가 화순군에서 어떤 사업장이 어떤 폐기물을 어떤 방법으로 처리한다고 신고했는지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명이나 사업장주소를 맞추는 방식으로만 이어 쓰며, 주소를 좌표로 바꾸면 지도 위 배출 사업장 분포를 볼 수 있다.
limits: 사업장 단위 신고 원장이라 폐기물 발생량이나 처리 실적 통계는 이 데이터로 알 수 없다. 사업자번호 같은 공통 키가 실측 컬럼에 없어 다른 기관 데이터와 정확히 맞추려면 상호·주소 매칭을 거쳐야 한다.
