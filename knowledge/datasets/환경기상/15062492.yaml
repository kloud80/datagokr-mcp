summary_user: 대전광역시 중구에 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 목록 파일로, 상호·현장 도로명주소·배출하는 폐기물 종류·데이터 기준일자를 담는다(csv 약 5KB 규모). 중구에서 어떤 사업장이 어떤 종류의 사업장폐기물을 배출한다고 신고했는지 확인하려는 주민·수거·처리업체·분석가가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호명이나 도로명주소를 맞춰 붙이는 방식으로만 이어 쓴다.
limits: 사업자번호 등 공통 키가 없어 다른 폐기물·사업자 데이터와 정확히 매칭하기 어렵고 상호·주소 문자열 대조에 의존한다. 대전 중구 한 곳만 다루며, 배출량이나 처리 실적 같은 수치는 담지 않는다.
