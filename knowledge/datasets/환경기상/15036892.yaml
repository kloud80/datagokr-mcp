description_portal: 본 데이터는 경기도 광주시에 위치한 자동기상관측장비(AWS)의 바람 방향과 세기를 측정한 정보를 제공합니다. 관측 지점의 위치 정보를 통해 광주시 내 풍향풍속 측정소의 분포를 확인할 수 있으며, 측정일시는 데이터가 수집된 정확한 시점을 나타냅니다. 풍향은 각도(deg) 단위로 바람이 불어오는 방향을 표시하며, 풍속은 초속 미터(m/s) 단위로 바람의 세기를 수치화하여 제공합니다. 풍향풍속 정보는 강풍, 태풍 등 기상 재해 발생 시 피해 예측 및 대응을 위한 핵심 자료로 활용됩니다. 또한 대기오염물질 확산 경로 분석, 산불 진화 작업, 항공 및 해상 안전 관리 등 다양한 분야에서 중요한 의사결정 정보로 사용될 수 있습니다.
