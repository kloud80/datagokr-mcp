description_portal: 세계공역예보센터모델은 항공 안전을 위해국제민간항공기구(ICAO)가 운영하는 고고도 기상 정보를 전세계적으로 제공하는 국제 표준 예보 모델 자료입니다. 특히 고고도 항공운항을 지원하기 위한 자료가 중심을 이루며, 정기적으로 갱신되어 3시간 단위의 예측 모델 자료를 제공합니다. 다음의 자료는 세계 공역 지점, 예보 시간, 생산 시간, 대류권계면 높이에 대한 정보 데이터를 제공합니다. 대류권계면 높이는 항공기의 최적 비행고도를 선정하고 연료 효율적 항로를 계획 하는데 활용됩니다.
