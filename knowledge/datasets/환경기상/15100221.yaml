summary_user: 의정부시에서 대형폐기물을 버릴 때 내는 수수료를 품목(품명)과 규격(크기)별로 한 행씩 정리한 수수료표 파일로, 약 10KB 규모의 CSV입니다. 의정부 시민이 소파·장롱 같은 대형폐기물을 내놓기 전에 '이 크기의 이 품목은 수수료가 얼마인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 품명 문자열을 맞추거나 다른 지자체의 대형폐기물 수수료 파일과 품목명으로 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 의정부시에서는 시민이 대형폐기물을 버릴 경우 수수료를 부과해야 합니다.대형폐기물을 버릴 때 품목별, 규격별로 수수료가 책정되어 있습니다.버리는 시민이 수수료를 부담하는 경우에만 폐기물 수거서비스가 이루어집니다.해당 정보는 폐기물 품명(종류), 폐기물 규격(크기), 폐기물 수수료(가격)에 대한 항목을 제공합니다.데이터는 2026. 5. 31. 자를 기준으로 작성되었습니다.기타 문의 사항이 있으실 경우 환경관리처 생활환경팀 031-828-6871~2로 연락주시기 바랍니다. 감사합니다.
