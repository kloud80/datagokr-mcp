description_portal: 경상북도 영양군 관내 낚시금지구역 현황을 제공하는 공공데이터입니다. 본 데이터는 구분, 하천명, 구간 시작점 및 종료점 주소, 위도·경도 좌표, 좌안·우안 구분, 지정일 및 시행일, 시행기간, 관련 고시번호, 관련 법령·조례·고시, 금지 또는 제한되는 행위의 내용, 데이터 기준일자 등의 정보를 포함하고 있습니다. 낚시가 제한되는 하천 구간의 위치와 적용 범위를 공간정보와 함께 확인할 수 있으며, 상수원 보호 및 수질보전을 위한 행위 제한 사항을 안내하는 자료로 활용할 수 있습니다. 또한 지도 서비스 구축, 낚시인 대상 안내, 환경보전 및 하천관리 업무, 행정서비스 제공, 학술연구 및 정책 수립의 기초자료로 활용 가능하며, 「수도법」에 따른 상수원보호구역의 관리와 수질 보전을 지원하기 위한 공공정보입니다.
