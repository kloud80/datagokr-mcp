summary_user: 서울 강북구에 있는 청소업체 목록을 업체 한 곳당 한 행으로 담은 파일로, 업체명·소재지·전화번호·처리종류(종량제·음식물·재활용·대형폐기물 등)·작업구역·데이터기준일로 이뤄진 470바이트 규모의 작은 원장이다. 강북구 주민이 우리 동네 대형폐기물이나 음식물 쓰레기를 어느 업체가 수거하는지, 연락처가 무엇인지 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업체명·주소 문자열이나 작업구역(동 이름) 매칭으로만 이어 쓴다.
description_portal: 청소업체는 종량제·음식물·재활용·대형폐기물 전문 청소업체로 분류·수거·운반·처리까지 담당해 위생과 편의를 제공합니다.종량제봉투 수거·불법투기 관리, 음식물 수거·발효·퇴비화 처리, 재활용 선별·회수·재가공 연계, 대형폐기물 예약수거·분해·운반·적법처리까지 수행하여 주민 편의와 환경 보호를 동시에 지원합니다서울특별시 강북구 청소업체 현황 데이터는 강북구에 소재한 청소업체의 연번, 업체명, 소재지, 전화번호, 처리종류(종량제, 음식물, 재활용, 대형폐기물 등), 작업구역, 데이터기준일로 이뤄진 자료입니다.
