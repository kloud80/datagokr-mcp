summary_user: 수도권매립지에 가연성폐기물을 반입할 수 있는 시간대를 광역지자체(서울·경기·인천 등)와 폐기물 분류·종류, 오전·오후 구분별 시작·종료시간과 적용일자로 담은 작은 파일(약 5.8KB csv)이다. 수집운반업체나 지자체 담당자가 '우리 지역의 이 폐기물은 매립지에 몇 시부터 몇 시까지 들어갈 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 광역지자체명이나 폐기물명을 이름으로 맞춰 연결해야 한다.
description_portal: '수도권매립지의 가연성폐기물 재진입 시간정보 입니다. 현재 개방항목으로는 광역지자체명, 폐기물분류명, 폐기물명, 정오구분, 시작시간, 종료시간, 적용일자의 항목을 제공하고 있습니다.공사에서는 가연성 폐기물의 반입과 효율적이고 안전한 관리를 위해 각 광역지자체별(예: 서울시, 경기도, 인천시 등)로 가연성폐기물 진입 또는 반입시간을 명확하게 고시하여 운영하고 있습니다. 개방하여 공유중인 데이터와 같이 이러한 시간정보는 폐기물의 종류와 지역, 계절 및 운영 상황에 따라 변동될 수 있으므로 반드시 공사나 해당 부서를 통해 최신 정보를 확인해야 합니다. 폐기물의 종류와 지역, 날짜에 따라 다르게 적용되고 있으며, 실제 반입전에 진입시간 정보 협의는 필수로 진행해 주셔야 합니다.'
