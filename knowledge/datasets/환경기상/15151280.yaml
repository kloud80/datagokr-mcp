description_portal: 이 데이터는 식기건조기 및 식기세척기 이미지를 대상으로 한 AI 학습용 데이터입니다. 총 200장의 이미지와 동일한 수의 라벨링 텍스트 파일로 구성되어 있으며, 이미지 파일은 ‘images’ 폴더에, 라벨링 파일은 ‘labels’ 폴더에 각각 저장되어 있습니다. 모든 이미지는 다양한 모델의 식기건조기와 식기세척기를 주거 공간 또는 실내 환경에서 촬영한 것으로, 제품의 외형, 제어부, 내부 구조 등이 시각적으로 확인 가능합니다. 라벨링 파일은 YOLO 형식으로 제공되며, 각 기기의 위치 정보와 클래스명이 좌표값으로 기록되어 있어 객체 인식 및 분류 모델 학습에 적합합니다. 데이터는 일관된 파일 구조와 명명 규칙을 따르고 있습니다.
