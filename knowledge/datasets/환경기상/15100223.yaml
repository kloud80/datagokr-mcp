summary_user: 의정부시에서 건설폐기물 배출용 건설마대를 파는 지정 판매소를 한 곳당 한 행으로 담은 목록 파일로, 상호명·소재지·전화번호·데이터기준일을 담는다(약 830바이트 규모의 소량 csv). 의정부시에서 집수리·인테리어 잔재를 버리려는 시민이 "우리 동네 어디서 건설마대를 살 수 있나"를 찾을 때 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 소재지 주소나 상호명을 기준으로만 이어 쓰며, 다른 지자체의 종량제·마대 판매소 파일과는 같은 항목끼리 나란히 모아 쓰는 정도로 연결한다.
description_portal: 의정부시에서는 건설폐기물을 버리실 경우 지정된 마대 판매소에서 제공하는 건설마대에 담아 버려야 합니다.폐기물 배출을 희망하는 시민이 건설마대를 지정된 건설마대 판매소에서 구입하여 건설마대에 폐기물을 담아 버려야 수거서비스가 이루어 집니다.해당 정보는 건설마대 판매소 상호명, 주소, 판매물품, 판매소 전화번호 등을 제공합니다.데이터는 2026. 5. 31. 기준입니다.기타 문의가 필요하신 경우 환경관리처 생활환경팀 031-828-6874로 문의주시기 바랍니다. 감사합니다.
