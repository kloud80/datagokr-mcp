description_portal: 본 데이터는 한국중부발전이 각 사업장(본사 및 사업소)에서 연도별로 배출한 온실가스의 총량을 정리한 자료로, 단위는 이산화탄소환산톤(tCO₂-eq)입니다. tCO₂-eq는 「저탄소 녹색성장 기본법」에서 정의된 바와 같이 이산화탄소를 기준으로 기타 온실가스의 온난화 영향을 환산한 수치입니다. 데이터는 본사, 보령, 인천, 서울_원주, 서천, 제주, 세종, 신보령 등 각 사업소별로 나뉘어 있어 지역별 배출 수준과 연도별 추세를 파악할 수 있으며, 발전소 운영에 따른 온실가스 배출 특성, 감축 효과 분석, 탄소중립 목표 달성도 측정 등에 활용 가능합니다.
