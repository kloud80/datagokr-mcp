summary_user: 해양환경공단이 부산 수영 인근 해역 측정소에서 자동으로 잰 수온·염분·용존산소·수소이온농도·탁도·클로로필·전기전도도를 관측일자별로 담은 시계열 원천 파일(csv, 약 4.2MB)이다. 해수욕장·연안 이용자의 수질 상태 확인, 연구자의 계절별 수질 변화나 저산소·고탁도 시기 추적 같은 질문에 쓴다. 전역 조인 키는 없어 정점코드·정점명으로 같은 기관의 다른 해양수질자동측정망 정점 데이터와 이어 붙이고, 외부 데이터와는 관측일자와 지역 이름으로 맞춰 쓴다.
description_portal: 해양환경공단이 운영하는 해양수질자동측정망 중 부산 수영구 인근 해역에 설치된 측정소의 수질 자동측정 정보를 제공합니다. 본 데이터는 수온, 염분, 용존산소(DO), pH, 탁도, 클로로필-a 등 주요 수질 항목을 실시간으로 측정한 결과를 포함하며, 해수욕장 및 연안 이용 해역의 수질 모니터링, 오염 감시, 조기경보 체계 운영 등에 활용됩니다. 해당 지역은 관광 및 레저활동 수요가 높은 지역으로, 수질 정보는 시민 건강 보호와 안전한 해양 이용을 위한 핵심 자료로 사용됩니다. 데이터는 시계열 통계 형식으로 구성되며, 계절별 수질 분석, 오염원 추적, 정책 수립 및 연구자료로 폭넓게 활용됩니다. 공공기관, 지자체, 연구기관 등에서 수질관리 기초자료로 사용됩니다.
