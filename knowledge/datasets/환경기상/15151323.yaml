description_portal: 이 데이터는 히터(난방기기) 이미지를 대상으로 한 AI 학습용 데이터셋입니다. 총 200개의 이미지 파일과 200개의 라벨링 텍스트 파일로 구성되어 있으며, 각각 ‘images’ 폴더와 ‘labels’ 폴더에 저장되어 있습니다. 이미지에는 다양한 형태와 디자인의 히터가 실내 환경에서 촬영된 상태로 포함되어 있으며, 촬영 각도는 정면, 측면, 상단 등 다양합니다. 제품의 외관, 조작부, 통풍구 등 주요 구성 요소가 식별 가능하게 촬영되었습니다. 라벨링 파일은 YOLO 형식으로 작성되어, 각 히터 객체의 위치와 클래스명을 좌표값으로 기록하고 있습니다. 데이터는 객체 인식 및 분류 모델 개발에 적합하도록 일관된 명명 규칙과 구조를 갖추고 있습니다.
