description_portal: Journal of Species Research(JSR)는 환경부 국립생물자원관에서 발행하는 국제 학술지로, 생물다양성과 종 분류학 연구 성과를 다루는 전문 학술 자료이다. 주기적으로 발간되며, 새로운 종의 발견, 분류학적 개정, 생물자원 관리 및 보전 관련 연구 논문을 게재한다. 특히 국제적 연구자들이 참여해 신뢰성 높은 학술 교류의 장을 제공하며, 국립생물자원관이 보유한 연구 성과를 세계 학계와 공유하는 중요한 수단으로 활용된다. JSR은 생물종의 학문적 기록을 축적하고 정책 및 보전 전략 수립에 기초자료를 제공하는 역할을 한다.
