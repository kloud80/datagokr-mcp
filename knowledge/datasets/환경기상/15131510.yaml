description_portal: '한국남동발전의 대기오염물질 배출 실적 데이터입니다.2015년 1월부터 최신일자까지의 데이터를 조회할 수 있으며, 각 사업소별로 대기오염의 주요 원인인 황산화물(SOx), 질소산화물(NOx), 먼지의 일평균 배출량을 해당일자별로 비교하여 제공합니다. 또한 산소, 유량, 온도 정보도 확인할 수 있습니다.이를 통해 각 발전소가 배출 기준을 얼마나 안정적으로 준수하고 있는지 객관적인 수치로 파악하며, 대기환경 연구의 기초자료로 활용할 수 있습니다.* 데이터 단위: 황산화물(ppm), 질소산화물(ppm), 먼지(mg/Sm³)'
