summary_user: 환경책임보험 적용 대상 매체시설을 시설 단위로 기록한 원장 파일로, 매체시설코드별 규모 구분, 지번·도로명 주소, 기준 연도, 보험 가입 여부와 가입 대상 여부, 삭제 여부와 승인 상태를 담으며 범위는 전국이다. 환경 정책 분석가나 행정 담당자가 "우리 지역에서 법적으로 보험 가입 대상인데 실제로 가입하지 않은 시설은 몇 곳인가" 같은 의무 가입 준수 현황을 확인하는 데 쓴다. 매체시설코드(eil_media_facility_cd)를 키로 같은 환경책임보험 전산망의 다른 데이터와 잇고, 주소를 기준으로 오염원·화학물질 사업장 등 위치 기반 환경 데이터와 맞춰 본다.
description_portal: 환경책임보험 전산망에서 책임보험 매체시설 정보는 환경책임보험 제도의 적용 대상이 되는 각 시설의 기본 현황을 관리하기 위해 구축된 데이터로, 시설의 규모, 위치, 보험 가입 여부 등을 종합적으로 기록하고 있다. 각 시설은 먼저 매체시설코드를 통해 고유하게 식별되며, 매체시설규모코드를 통해 대형·중형·소형 등 규모별 구분이 이루어진다.시설의 위치는 지번주소와 도로명주소 두 가지 방식으로 관리된다. 지번주소는 법적·행정적 구분을 위한 주소 체계이고, 도로명주소는 실질적인 위치 확인 및 현장 관리에 용이하도록 제공된다. 또한 해당 정보가 적용되는 기준 연도를 함께 기록하여, 연도별로 시설의 변동이나 통계를 관리할 수 있도록 한다.보험 관련 항목으로는 보험가입코드와 보험가입대상코드가 있으며, 전자는 해당 시설이 실제로 보험에 가입했는지 여부를, 후자는 법적으로 보험 가입 대상인지 여부를 구분한다. 이를 통해 시설별 의무 가입 준수 여부와 보험 보장 현황을 체계적으로 관리할 수 있다.아울러, 데이터의 유효성 및 관리 상태를 나타내는 항목으로 삭제여부와 정보승인상태코드가 포함된다. 삭제여부는 해당 시설 정보가 현재 유효한지, 아니면 폐기된 정보인지를 구분하는 데 사용되며, 정보승인상태코드는 입력된 정보가 임시 저장 상태인지, 검토 중인지, 최종 승인되었는지를 관리한다.이와 같이 매체시설 정보는 환경책임보험 관리 체계에서 핵심적인 기반 자료로 활용되며, 시설별 보험 가입 현황 분석, 정책 수립, 행정 관리, 통계 작성 등 다양한 목적으로 중요한 역할을 한다.
