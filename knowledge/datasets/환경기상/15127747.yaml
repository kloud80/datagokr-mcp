summary_user: 광양시에 있는 대기배출시설 중 4종·5종 소규모 사업장을 사업장 한 곳당 한 행으로 정리한 CSV 파일로, 사업장명·소재지·종 구분을 담는다. 주민이나 분석가가 '우리 동네 생활권 안에 소규모 대기배출 사업장이 어디에 몇 곳 있는가'를 확인하거나, 시 담당자가 민원 대응·관리 대상을 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서, 다른 배출원 원장이나 대기질 데이터와는 사업장명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 자료는 전라남도 광양시에 위치한 대기배출시설 중 4종 및 5종 사업장에 해당하는 현황을 정리한 공공데이터입니다. 「대기환경보전법 시행령」에 따라 대기오염물질 배출시설은 규모와 영향도 등에 따라 1종부터 5종까지 분류되며, 4종과 5종은 상대적으로 배출량이 적지만 여전히 관리가 필요한 소규모 사업장에 해당합니다.자료는 연번, 사업장명, 소재지, 종(4종 또는 5종), 데이터 기준일 등의 항목으로 구성되어 있으며, 광양시의 환경 관리대상 사업장 분포 파악, 환경 민원 대응, 시설별 관리 등급 구분, 지역별 대기질 정책 수립 등에 활용될 수 있습니다.특히 광양시는 국가산단과 일반산단이 혼재된 지역으로, 다양한 소규모 대기배출시설이 생활권 내에 산재해 있어 저배출 사업장에 대한 체계적인 정보 관리와 공개가 필수적입니다. 본 데이터는 환경정보의 투명한 공개와 시민의 알권리 보장, 그리고 행정기관의 사전 관리 기반 마련에 기여하며, 정기적인 갱신을 통해 최신성을 유지하고 있습니다.
