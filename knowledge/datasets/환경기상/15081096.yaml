summary_user: 부산광역시 동구 관내에서 사업장폐기물 배출자로 신고한 사업장을 한 행씩 담은 파일로, 업소명·주소와 배출하는 폐기물 종류(음식물류, 폐합성수지류 등), 처리방법(재활용·소각·매립 등)이 들어 있다. 동구에서 어떤 사업장이 어떤 폐기물을 내고 어떻게 처리하는지 확인하려는 구청 담당자나 지역 폐기물 관리 실태를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 맞대어 연결해야 한다.
description_portal: '이 데이터는 부산광역시 동구 지역 내 사업장폐기물 배출자 신고 현황을 담고 있으며, 관내 사업장에서 발생하는 폐기물의 종류와 처리 방법을 파악하는 데 활용될 수 있습니다.주요 정보는 다음과 같습니다.업소명, 주소: 폐기물을 배출하는 사업장의 이름과 위치 정보폐기물 종류: 해당 사업장에서 주로 배출하는 폐기물의 종류(예: 음식물류, 폐합성수지류, 그 밖의 폐기물 등)처리방법: 배출된 폐기물을 처리하는 방식(예: 재활용, 소각, 매립 등)을 명시. 특히 음식물류 폐기물의 경우 "재활용(농업생산활동에 사용)"과 같이 상세한 처리 경로본 데이터는 지역 폐기물 관리 실태를 확인하고, 폐기물 처리 및 재활용 정책 수립을 위한 기초 자료로 활용될 수 있습니다.'
