summary_user: 지방자치단체가 관리하는 석면조사건축물을 건물 한 곳당 한 행으로 담은 표준데이터로, 건축물명·주소·좌표·총면적·석면면적·건축물유형·관리기관을 싣고 검증 시 1,137행을 받았다. 주민이나 사업자가 내 주변 건물이 석면 조사 대상인지, 석면 면적이 얼마나 되는지 확인하거나 분석가가 지역별 석면건축물 분포를 볼 때 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)를 키로 삼아 건축물대장이나 지도·행정구역 데이터와 이어 쓰며, 사업자번호 같은 키는 없다.
