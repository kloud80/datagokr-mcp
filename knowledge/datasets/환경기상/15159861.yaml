summary_user: 인천 제물포구(옛 동구)의 경로당·어린이집 등 실내 22개소와 실외 30개소에 설치된 측정기가 보낸 값을 센서 시리얼번호와 전송일시(분 단위) 단위로 담는 건별 측정 데이터이며, 범위는 한 시군구다. 주민이나 보호자가 '우리 동네 경로당·어린이집의 이산화탄소·초미세먼지 농도가 지금 어떤가', 분석가가 '구내 실외 센서별 미세먼지가 시간대에 따라 어떻게 다른가'를 볼 때 쓴다. 실측 컬럼에 측정소코드 같은 전역 조인 키가 없어 에어코리아 측정소 자료 등과는 시리얼번호·설치 장소 이름을 따로 매핑해야만 연결된다.
description_portal: 인천 동구 경로당 및 어린이집등 22개소의 실내 공기질 정보와 실외 30개소에 설치된 측정기를 통하여 주변의 대기질 정보를 제공합니다.실외 대기질 측정 센서에서 제공하는 오염물질:1. 미세먼지(PM10) - 단위는 ug/m³이며, 반환값의 범위는 0 ~ 50002. 초미세먼지(PM25) - 단위는 ug/m³이며, 반환값의 범위는 0 ~ 50003. 온도(℃) - 단위는 ℃이며, 반환값의 범위는 600 ~ 1800이다. 이 값을 ℃로 변환하기 위해서 (X / 10 + 100) 공식을 통해 변환해 주어야 한다.4. 습도(%) -  단위는 %이며, 반환값의 범위는 0 ~ 100실내 공기질 측정 센서에서 제공하는 오염물질:1. 이산화탄소(CO2) -  값의 범위는 0 ~ 100002. 일산화탄소(CO) -  값의 범위는 0 ~ 1000000이다. 실제 값으로 변환하기 위해 1000으로 나눠줘야 한다.3. 휘발성유기화합물(VOCs) - 단위는 ppb이며, 반환값의 범위는 0 ~ 200004. 미세먼지(PM10) 5. 초미세먼지(PM25)
