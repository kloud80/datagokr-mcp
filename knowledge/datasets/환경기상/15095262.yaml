summary_user: 경기도 시군별·연도별 온실가스 기준배출량, 실제 배출량, 감축량(감축사업 감축량·탄소 감축량 포함), 감축률을 담은 집계 자료이며, 범위는 경기도 내 시군 단위입니다. 지자체 담당자나 분석가가 '우리 시군의 온실가스 감축률이 기준배출량 대비 몇 %이고, 다른 시군과 비교하면 어느 수준인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)을 행정구역 이름·코드로 매핑하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군의 연도별 온실가스 배출 현황 및 감축성과를 정리한 자료입니다. 주요 항목은 연도, 시군명, 기준배출량, 온실가스배출량, 온실가스감축량, 온실가스감축률 등으로 구성되어 있으며, 각 지역의 온실가스 감축 실적을 수치로 확인할 수 있습니다. 이 자료는 지역 단위의 온실가스 저감 정책 수립, 탄소중립 전략 추진, 환경 지표 관리 및 정책 효과 평가 등에 활용될 수 있습니다. 감축량과 감축률은 정책 이행 성과를 가늠하는 주요 지표로 사용되며, 실효성 있는 지역 환경정책 수립에 기초자료로 활용 가능합니다.
