description_portal: 본 데이터는 「소음·진동관리법 시행규칙」에 근거하여 제작자동차의 종류, 연료, 유종, 적용기준명 및 시험 항목별 소음에 대한 법적 허용 한계를 규정한 자료입니다. 자동차의 차종 및 연료 유형에 따라 시험조건별 소음 허용 기준값을 제공하여, 자동차 소음 관리 및 관련 제도 운영에 활용할 수 있습니다. 제공하는 데이터 항목으로는 일련번호, 적용기준, 연료, 차종구분, 인증종류, 시험모드, 가속주행소음 허용기준, 배기소음 허용기준, 경적소음 허용기준 등으로 구성되어 있습니다. 소음허용기준의 기준은 2006년 1월, 2018년 1월 기준으로 구분되며, 차종구분은 경자동차, 승용, 화물, 배기량에 따른 이륜차 구분, 대형화물 원동기출력 마력에 따른 구분으로 제공됩니다.
