summary_user: 부산광역시 연제구에 주소를 둔 대기·폐수·소음진동 등 환경오염 배출시설 사업장을 한 행에 한 곳씩 담은 목록으로, 업체명·도로명주소·업종·전화번호와 위도·경도를 포함한 8.8KB 남짓의 작은 CSV 파일이다. 주민이나 분석가가 '우리 동네 근처에 어떤 배출시설 사업장이 있고 어떤 업종인가'를 확인하거나 지도에 배출 사업장을 표시하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소 문자열을 맞추거나 위도·경도로 공간 결합해 이어 쓰고, 다른 구군의 같은 형식 파일과는 구군명으로 합친다.
description_portal: 부산광역시 연제구에 주소지를 둔 환경오염 배출시설에 대한 내용으로 업체명, 사업장 도로명주소, 대표 업종, 전화번호 등의 정보가 제공되는 데이터입니다.시설의 종류로는 「대기환경보전법」, 「물환경보전법」,  「소음․진동관리법 시행규칙」 등에 따른 대기배출시설, 폐수배출시설, 소음진동배출시설 등이 있습니다.대기배출시설이란 대기오염물질을 대기에 배출하는 시설물, 기계, 기구, 그 밖의 물체로서 환경부령으로 정하는 것을 말합니다.폐수배출시설이란 수질오염물질을 배출하는 시설물·기계·기구 그 밖의 물체로서 환경부령이 정하는 것을 말합니다.소음진동배출시설이란 소음·진동을 발생하는 공장의 기계,기구,시설, 그 밖의 물체로서 환경부령으로 정하는 것을 말합니다.배출사업장은 배출시설에서 니오는 오염물질 발생량에 따라 1종부터 5종까지로 분류됩니다.
