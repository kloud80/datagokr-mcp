limits: 사업자번호나 좌표 같은 공통 키가 없어 배출시설 사업장 원장 등과 정확히 연결하기 어렵고, 이름 매핑 시 표기 차이에 주의해야 한다. 지역 구분이 없는 전국·비공간 자료라 지역별 분석에는 쓰지 못한다.
