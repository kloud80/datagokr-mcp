description_portal: CITES(멸종위기에 처한 야생동식물의 국제거래에 관한 협약)는 1973년에 채택된 국제협약으로, 야생동식물의 불법 거래로부터 보호하기 위해 설립되었습니다. CITES 종목록은 국제 거래가 규제되어야 하는 동물과 식물을 분류한 체계적인 목록입니다. 목록은 세 가지 부속서로 구성됩니다. 부속서 I에는 멸종위기에 처한 종들이 포함되며, 이들 종의 국제거래는 원칙적으로 금지되고 과학적 연구 목적 등 매우 제한된 경우에만 허가됩니다. 부속서 II에는 현재 멸종위기는 아니지만 과도한 거래로 인해 멸종위기에 처할 수 있는 종들이 포함되며, 이에 해당하는 종들은 수출국의 허가증이 있으면 거래가 가능합니다. 부속서 III에는 특정 국가가 자국 내 보호를 위해 등재를 요청한 종들이 포함되며, 부속서 III에 속한 종의 거래를 위해서는 해당 국가의 허가증이 필요합니다. CITES 종목록 데이터에는 학명, 영문명, 국가 등의 정보가 포함됩니다. 이 목록은 정기적으로 검토되고 업데이트되며, 국제 거래 규제, 밀렵 방지, 생물다양성 보호 등에 활용될 수 있습니다.
