description_portal: 이 데이터는 한국석유공사에서 발생한 폐기물의 종류, 발생지, 처리방법 및 처리량에 대한 정보를 포함하고 있으며, 각 연도별로 정리되어 있습니다. 폐기물은 일반폐기물과 지정폐기물로 구분되며, 소각, 위탁, 재활용 등의 다양한 처리방법에 따라 처리된 양이 기록되어 있습니다. 이를 통해 석유공사 내 폐기물 관리 현황을 파악하고, 자원순환 실태를 분석할 수 있으며, 환경정책 수립이나 ESG(환경·사회·지배구조) 경영 평가 등에도 유용하게 활용될 수 있습니다. 특히 환경관리 업무의 투명성 확보 및 지속가능한 폐기물 관리체계 구축을 위한 기초자료로 제공될 수 있습니다.
