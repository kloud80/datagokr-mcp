summary_user: 전국 송전탑에 설치된 관측 장비로 잰 풍속을 지역별 한 행에 1월~12월 월별 값으로 정리한 집계표로, 2,453바이트 크기의 작은 CSV 파일이다. 전력설비 담당자나 분석가가 '어느 지역 송전탑이 어느 달에 바람이 가장 센가'를 보고 강풍에 따른 설비 손상 위험이나 송전탑 보강 우선순위를 검토하는 데 쓴다. 실측 컬럼에 관측지점번호나 행정코드 같은 전역 조인 키가 없어, 기상청 관측 자료 등 다른 데이터와는 지역 이름을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: 한국전력공사에서 제공하는 송전탑위치별 풍속관측 정보 데이터는 전국에 분포한 송전탑에 설치된 관측 장비를 통해 수집된 풍속 자료입니다.지역, 월별(1월, 2월, 3월 등) 칼럼으로 구성되어 있어, 각 송전탑의 월별 풍속 값을 제공해 특정 지역에서 발생하는 바람의 세기와 패턴을 분석할 수 있습니다.이 데이터를 활용하여 강풍에 따른 설비 손상 위험을 사전에 평가할 수 있으며, 송전선과 송전탑에 가해지는 하중을 추정하여 전력설비 안정성에 미치는 영향을 분석할 수 있습니다.장기적으로 송전선 설계 기준을 검토하고, 송전탑 보강 계획을 수립하는 등 다양하게 황용할 수 있습니다.
