description_portal: '본 데이터는 국립생물자원관에서 수집·분석한 야생생물의 DNA 바코드(염기서열) 정보를 수록한 목록으로, 한반도 및 인근 생물자원을 대상으로 구축된 유전정보 데이터입니다. DNA 바코드는 생물종의 분자 동정을 위한 표준 유전자 영역(주로 미토콘드리아 COI 유전자)을 활용하여, 종 수준의 신속한 식별 및 분류학적 연구의 기초자료로 광범위하게 활용됩니다. 데이터에는 DNA 바코드 정보가 포함되어 있으며, 해당 정보는 포유류, 조류, 어류, 곤충, 식물 등 다양한 분류군에 대한 생물종명(국명 및 학명), 분류체계(계-문-강-목-과-속-종), 염기서열 정보, 수집지 및 수집일자, 표본 고유번호 등의 항목으로 구성되어 있습니다. 염기서열 데이터는 FASTA 형식으로 제공되어 생물정보학 분석에 적합하며, 연구자 및 정책 수립자들이 생물다양성 연구, 환경영향 평가, 신규 종 탐색 등에 활용할 수 있도록 설계되었습니다. 또한, 희귀종, 미동정 종 등 일부 민감한 생물자원에 대해서는 생물주권 보호 및 보안상의 이유로 종명 또는 세부 정보가 제한적으로 제공됩니다. 본 데이터는 국립생물자원관이 운영하는 ‘한반도의 생물다양성’ 웹사이트에서도 열람하실 수 있으며, 보다 상세한 항목별 설명 및 사용자 매뉴얼은 해당 시스템에서 제공됩니다.→ 접속 경로: https://species.nibr.go.kr데이터 용량이 크고 행 수가 많은 관계로, 엑셀 등 범용 문서 편집 프로그램보다는 전문 생물정보 분석 소프트웨어 또는 데이터베이스 처리 도구의 활용을 권장합니다.'
