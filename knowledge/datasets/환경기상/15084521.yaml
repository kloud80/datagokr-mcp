description_portal: 대전광역시시설관리공단에서 관리 운영 중인 역전지하도상가에서 측정한 공기질 정보를 제공하고 있습니다. 대전 역전지하도상가의 주소는 대전광역시 동구 중앙로 지하 200 이며 체육, 환경, 복지, 기반 중 기반시설에 해당됩니다. 공기질 현황은 추가 측정 등의 사유로 변경될 수 있음을 알려드립니다. 해당 파일에서 제공하는 정보는 년도, 월, 미세먼지(PM10), 미세먼지(PM2_5), 이산화탄소(CO2), 폼알데하이드(HCHO), 일산화탄소(CO), 이산화질소, 라돈, 총휘발성 유기화합물입니다. 역전지하도상가 공기질 데이터 기준일은 2025년 7월 1일 입니다. 추가로 필요하신 사항이 있다면 공공데이터 담당자(042-610-2746)에게 문의하여 주시기 바랍니다.
