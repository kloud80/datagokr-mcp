summary_user: 광주 남구 관내 대기배출시설 사업장을 한 행씩 담은 목록 파일로, 사업장명·업종·종별·주소·데이터기준일을 담는다(약 3KB 규모의 CSV). 주민이나 환경 분석가가 '우리 동네 주변에 어떤 대기오염 배출 사업장이 있고 몇 종 규모인가'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 배출원·인허가 데이터와는 사업장명이나 주소를 맞춰 이어 써야 한다.
limits: 사업자번호·시설 코드 등 공통 키가 없어 기업 단위로 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 남구 한 시군구로 한정되며, 배출량이나 측정값(TMS 등)은 담지 않는다.
