summary_user: 군포시 다중이용장소(산본로데오거리·버스 정류소 등)에 설치된 공공 쓰레기통을 한 곳당 한 행으로 담은 지점 목록으로, 설치위치·도로명주소·지번주소·데이터기준일자를 담는다(파일 약 1.9KB, 포털 설명상 20개소). 군포 시민이나 방문객이 '산본 시내에서 길거리 쓰레기통이 어디 있나'를 찾거나, 시 담당자·분석가가 유동인구 밀집지의 쓰레기통 배치 현황을 점검하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 주소 문자열(도로명주소·지번주소)을 지오코딩하거나 이름으로 맞춰 다른 군포시 폐기물 배출 지점 파일과 나란히 놓는 방식으로 이어 쓴다.
limits: 군포시 한 곳만 다루는 시군구 범위 파일이라 다른 지자체 비교에는 지자체별 파일을 따로 모아야 한다. 좌표나 표준 코드 같은 조인 키가 없어 지도 표시·결합 시 주소 매칭이 필요하며, 쓰레기 발생량·처리현황 같은 통계는 담지 않는다.
