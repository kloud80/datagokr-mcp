description_portal: 군포시 다중이용장소 쓰레기통 설치 현황에 대한 데이터로 설치위치, 도로명주소, 지번주소, 데이터기준일자 항목 등을 제공합니다.군포시에서는 2018년부터 유동인구가 많은 다중이용장소인 산본로데오거리 및 버스 정류소 등 20개소에 쓰레기통이 설치해왔습니다.쓰레기통 설치장소 대부분이 유동인구가 많은 산본로데오거리로 다중이용장소 쓰레기통 설치장소 20개소 중 3개소가 산본로데오거리에 집중 설치되어 있습니다.추후에도 쓰레기 배출 감량 및 재활용률 제고를 위한 종량제 제도 취지에 부합하도록, 유동인구가 극심하게 많은 지역 등 특수한 경우 인근주민 및 주변상가 등 협의를 통해 쓰레기통을 설치 운영할 예정입니다.
