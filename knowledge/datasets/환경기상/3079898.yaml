description_portal: 고양시 관내 대기환경 상태를 상시 측정하여 체계적인 대기환경 관리 기반을 마련하기 위해 개방하는 연간 대기오염물질 측정 결과 데이터입니다. 본 자료는 정확한 측정 월 그리고 지역별 측정소 정보를 바탕으로 아황산가스(SO2), 이산화질소(NO2), 오존(O3), 일산화탄소(CO), 미세먼지(PM-10), 초미세먼지(PM-2.5) 등 여섯 가지 대기 오염 항목의 상세한 수치를 종합적으로 제공합니다. 이를 적극 활용하여 변화 추이를 파악하고 시민 건강을 위한 실효성 있는 환경정책 수립 자료로 활용할 수 있습니다.
