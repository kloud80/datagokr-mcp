summary_user: 경기도가 환경기술인을 대상으로 운영한 배출시설 관련 교육의 이력을 기술인·교육기수별 건 단위로 담으며, 교육명(대기·수질, 일반·전문 과정), 교육해당연월, 기술인번호, 교육 시작·종료일, 수료번호, 수료여부를 포함한다. 환경 행정 담당자나 분석가가 특정 연도·분야별 교육 참여 인원과 수료율을 산출하거나 한 기술인의 교육 이수 이력을 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 기술인번호(tchn_sn)나 교육명 같은 이름·코드 매핑, 또는 같은 기관 자료 안에서만 연결할 수 있다.
description_portal: 이 데이터는 환경기술인을 대상으로 한 배출시설 관련 교육 이력을 담고 있는 자료로, 각 기술인의 교육 참여 및 수료 여부를 체계적으로 관리하기 위해 구축되었습니다. 주요 항목으로는 교육명, 교육해당연월, 기술인번호, 교육기수, 교육시작일과 종료일, 수료번호, 수료여부가 포함됩니다. "교육명" 항목은 대기 및 수질 분야로 구분되며 일반과 전문 과정으로 구성되어 교육 일수도 구분됩니다. "기술인번호"는 개별 기술인을 식별하는 고유 번호이며, "수료여부"는 교육 이수 상태를 1 또는 0으로 표시합니다. 이 데이터를 통해 특정 연도 및 분야별 교육 참여 현황, 기술인별 교육 이력 분석, 수료율 산출 등 다양한 행정 및 통계 목적의 활용이 가능하며, 환경 분야 인력관리 및 교육정책 수립에 유용한 기반자료로 활용됩니다.
