summary_user: 경기도 이천시 안의 사업장폐기물 배출자 신고 현황을 사업장별로 담은 원천 목록 파일로, 상호명·도로명/지번 주소·위경도·인허가관리번호와 배출하는 폐기물의 코드와 종류가 들어 있습니다. 주민이나 분석가가 '우리 동네 근처 어느 사업장이 어떤 종류의 폐기물을 배출 신고했는가'를 확인하거나, 단속·민원 대응 때 대상 사업장을 찾는 데 씁니다. 전역 조인 키가 없어 다른 데이터와는 주소·위경도로 공간 결합하거나 상호명·인허가관리번호·배출폐기물코드를 이름·코드 매핑으로 맞춰 이어 씁니다.
