summary_user: 전국에서 먹는물 수질검사기관으로 지정된 기관을 한 건씩 정리한 목록으로, 지정한 기관, 검사기관명, 소재지 주소, 연락처, 기준일자를 담는다(CSV 파일 약 8KB). 지하수나 약수터 물, 먹는샘물의 수질검사를 맡길 개인·사업자가 "우리 지역에서 수질검사를 의뢰할 수 있는 지정기관은 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 검사기관명이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
