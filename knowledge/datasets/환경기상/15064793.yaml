summary_user: 전라남도 강진군에서 사업장폐기물 배출을 신고한 사업장을 한 행씩 담은 원장으로, 상호·사업장 주소·폐기물 종류·데이터 기준일로 구성되며 파일 크기는 약 4KB(CSV)입니다. 강진군에서 특정 종류의 사업장폐기물을 내는 업체가 어디에 있는지 확인하려는 처리업자나 환경 감시 담당자, 지역 배출 실태를 살피는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 상호명·사업장 주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 전라남도 강진군 내 사업장들이 신고한 폐기물 배출 현황을 정리한 자료로, 상호(업체명), 사업장 주소, 폐기물 종류, 데이터 기준일 등으로 구성되어 있습니다. 각 사업장은 사업 활동 중 발생하는 폐기물을 종류별로 분류하여 신고하고 있으며, 해당 정보는 환경 관리 및 폐기물 처리 정책 수립에 필수적인 자료입니다.  이 자료는 폐기물 발생 원인과 유형을 파악해 보다 효율적인 폐기물 감축 및 자원순환 체계 구축을 지원하는 데 활용될 수 있습니다. 또한, 환경감시 및 기업의 배출 실태 분석에도 기초 자료로 사용됩니다.
