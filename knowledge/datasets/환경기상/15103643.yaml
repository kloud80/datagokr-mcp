summary_user: 인천광역시와 10개 군·구(강화군·옹진군·중구·동구·미추홀구·연수구·남동구·부평구·계양구·서구)별로 초미세먼지·미세먼지·황산화물·질소산화물·휘발성유기화합물·암모니아류·일산화탄소·총부유분진·블랙카본의 배출량을 항목별 행으로 정리한 집계표로, 567바이트 크기의 작은 CSV 파일입니다. 인천 시민이나 환경 분석가가 "인천에서 질소산화물이나 초미세먼지를 가장 많이 배출하는 군·구는 어디인가"를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 대기 측정·배출원 데이터와는 군·구 이름을 행정구역 코드에 직접 매핑해 이어 써야 한다.
description_portal: 인천광역시가 제공하는 대기오염물질 배출량 공공데이터는 지역 내에서 발생하는 주요 오염물질의 배출 현황을 수치로 정리한 자료입니다. 이 데이터에는 초미세먼지(PM2.5), 황산화물(SOx), 질소산화물(Nox), 휘발성 유기화합물(VOCs), 아민류(NH2), 일산화탄소( CO), 총부유분진(TSP), 미세먼지(PM-10), 블랙 카본(BC) 배출량 통계를 제공하고 있습니다.이러한 정보는 대기질 개선 정책 수립과 환경 관리의 기초 자료로 활용되며, 시민들에게는 생활 속 환경 위험을 이해하고 대응하는 데 도움을 줍니다.해당 데이터는 환경정보공개시스템의 대기질 평가보고서를 보고 참고하였습니다. 감사합니다.
