summary_user: 경상북도 청송군의 석면조사 대상 건축물을 한 동씩 담은 파일로, 건물명·동명·주소·연면적(제곱미터)·위해성등급이 들어 있으며 포털 설명상 약 50동 규모이다. 청송군 주민이나 학부모·건물 이용자가 "우리 동네 공공건물 중 석면 위해성등급이 높은 곳은 어디인가"를 확인하거나, 분석가가 지역 석면 관리 대상 건물의 규모와 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 건물명을 문자열로 맞추거나 다른 시군의 같은 형식 석면 현황 파일과 나란히 놓고 비교하는 방식으로 이어 쓴다.
