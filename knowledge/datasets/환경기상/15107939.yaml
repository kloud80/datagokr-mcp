summary_user: 전국 21개 국립공원(한라산 제외)에서 조사된 생물종 출현 기록을 담는 파일로, 공원명·분류군·종명·학명·조사 위치 좌표·조사일자·개체수가 조사 건별로 들어 있습니다. 연구자나 보전 정책 담당자가 '특정 국립공원 안에서 어떤 멸종위기종이 어디에 얼마나 출현했는가'를 확인하거나 종 출현지도를 만드는 데 쓴다. 전역 조인 키는 없으므로 국립공원명으로 공원 용도지구·탐방 데이터와 맞추거나, 위도·경도 좌표로 보호구역 등 공간 레이어와 겹쳐 쓰고, 학명으로 종 목록과 이름 매핑해 잇는다.
description_portal: 본 데이터는 데이터 기준 연도에 조사된 전국 21개 국립공원(※ 한라산국립공원 제외)의 생물자원 현황을 수록한 자료로, 국립공원 내 생물다양성 현황 파악과 보전·관리 정책 수립을 위한 기초 생태정보를 제공합니다. 주요 항목은 국립공원명, 생물 분류군(포유류, 조류, 양서·파충류, 곤충, 식물 등), 종명(영문), 학명(영문), 분류명(국문), 조사 위치 좌표(위도·경도), 조사일자, 개체수로 구성되어 있으며, 생물종 출현 특성과 서식 분포, 종별 개체수 밀도 등을 분석할 수 있습니다. 본 데이터는 멸종위기종 보호 전략 수립, 생태계 건강성 평가, 유전자원 연구, 국립공원 생태 모니터링, 생물종 출현지도 제작 등 다양한 분야에 활용됩니다. CSV 포맷으로 제공되며, 국립공원 생물자원통합관리시스템(NP-BIMS), 국가생물다양성정보시스템(NIBR) 등과의 연계도 가능합니다.
