description_portal: '공공데이터 포털 공공데이터 제공 신청건으로 공장보일러에 부생유2호를 사용하고 있는 지역의 업체 현황 정보를 제공합니다.1. 부생유(副生油)란? 석유 정제나 석유화학 공정 중 주제품 외에 부산물로 생성되는 액상 연료유, 원래 목적은 아니지만, 공정 중 부수적으로 발생하는 연료 성격의 유분    품질에 따라 1~3호 등급 구분2. 부생유 2호 : 연료유로 사용할 수 있을 만큼 품질은 유지되지만,1호보다는 황 함량이나 점도 등이 높아 일반 산업용 보일러, 소성로 등에 주로 사용3. C9의 의미: **탄소 수 9개 전후(C9)**의 방향족 탄화수소류 혼합물.'
