description_portal: '○ 통계개요* 통계명 : 주민 1인당 생활폐기물(쓰레기) 배출량* 통계종류 : 폐기물의 발생량을 제공하는 조사통계, 지정통계* 법적근거 : 폐기물관리법 제11조, 동법 시행규칙 제7조* 작성목적 : 생활폐기물 및 사업장폐기물에 대한 1년단위 발생 및 처리현황을 행정구역별로 조사하여 폐기물의 발생과 처리의 변화추이를 분석* 조사체계 : 사업체 → 지방자치단체 → 환경부(한국환경공단)* 공표주기 : 매년* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 생활폐기물 배출량 및 인구수 등○ 용어설명* 생활폐기물 : 사업장폐기물이외의 폐기물로 가정에서 발생되는 폐기물로 가정에서일련의 개보수 공사, 작업 등으로 인하여 5톤 미만으로 발생되는 폐기물* 사업장생활계폐기물 : 폐기물관리법 시행령 제2조제7호및제9호 규정에 의한 사업장에서발생하는 폐기물○ 기타* 생활폐기물 : 가정생활폐기물+사업장생활계폐기물* 주민수는 주민등록인구로 외국인 포함* 모든 수치는 반올림을 원칙으로 하여, 세부의 합계와 총계가 일치하지 않을수도 있음○ 출 처 : 환경부 「전국 폐기물발생 및 처리 현황」'
