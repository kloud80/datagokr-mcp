description_portal: '기상청 국가기상위성센터의 자료서비스 정보. 국가기상위성센터는 천리안위성 2A호(GK2A)라는 기상관측위성을 운영 중이며, 위성이 관측한 정보를 수신 및 처리하여 위성산출물과 영상을 서비스하고 있음.주요 약어 및 용어의 설명은 아래와 같음ㅇTB_PRODUCT_DETAIL 테이블 - 영역_정보_ID: FD(전구), EA(동아시아), ELA(한반도확장), KO(한반도), TP(태풍영역), SK(남한), NH(북반구) 등 - 해상도_UID: 10(1km), 20(2km), 40(4km) 등 - 도법_UID: GE(GEOS), LC(램버트), ME(메르카토르) 등ㅇ TB_PRODUCT_CONVERSION 테이블 - 확장자: NC(NetCDF), BIN(Binary), H5,HE5(원시) 등ㅇ TB_LOCAL_HARNESS_URN 테이블 - 로컬하네스_자료_위성: COMS(천리안위성 1호), GK2A(천리안위성 2A호), SW(우주기상) - 자료_요청_레벨: L1B 및 L2(기상산출물 레벨), OBS, MDL 및 LV1(우주기상산출물 레벨)'
