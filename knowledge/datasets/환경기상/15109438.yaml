summary_user: "충청남도 공주시에서 접수된 야생동물 구조 건을 접수번호 단위로 담은 건별 원천 데이터로, 종명과 분류(강·목·과), 멸종위기·국제거래 등급, 발견·접수·구조 일시, 발생 원인, 구조 결과, 발견·구조·방사 주소와 좌표, 체중·성별·나이를 포함한다. 분석가나 지자체 담당자가 '공주시에서 어떤 종이 어떤 원인(예: 충돌·고립)으로 어디서 많이 구조되고, 몇 마리가 방사되는가'를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표(RESC_LAT 등)로 공간 결합하거나 종명으로 전국자연환경조사 종 분포 점 같은 종 데이터와 이름 매핑해 이어 쓴다."
limits: 공주시 한 곳의 구조 기록이라 충남 전체나 전국 구조 현황을 대표하지 않는다. 전역 조인 키가 없어 다른 데이터와 연결하려면 종명·주소·좌표 매칭이 필요하다. 개발계정은 일 5,000회 호출 제한이 있다.
