summary_user: RFID 종량제 시스템을 채택한 지자체의 음식물쓰레기 배출 통계를 배출년·월·시 단위로 집계해 배출량·배출횟수와 각각의 비율로 담는다(검증 호출에서 10행 수신, 범위 전국). 지자체 담당자나 분석가가 "우리 지역 공동주택의 음식물쓰레기는 어느 시간대에 가장 많이 배출되나" 같은 배출 패턴 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지자체·아파트 이름 매핑이나 같은 기관(한국환경공단)의 코드로만 연결한다.
description_portal: 음식물쓰레기 종량제의 일환으로 시행중인 RFID기반 음식물쓰레기 종량제 시스템을 채택한 지자체의 음식물쓰레기 배출통계정보를 제공하는 서비스로 월단위 지자체의 음식물쓰레기 배출통계정보를 제공하는 서비스로 월단위 종합 배출내역, 지자체 배출내역, 아파트 배출내역 등 다양한 통계정보를 조회할 수 있으며, 음식물쓰레기 수거함의 상세한 상태정보를 제공
