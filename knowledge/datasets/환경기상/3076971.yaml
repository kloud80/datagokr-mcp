summary_user: 경기도 양주시에서 허가받은 폐기물 처리업체를 한 행씩 담은 업소 목록 파일로, 업종명·시설명·소재지·허가일자·처리대상 폐기물을 시군구 단위 개별 주소와 함께 제공한다(CSV 약 20KB). 사업장 폐기물을 맡길 업체를 찾는 사업자나 지역 폐기물 처리 인프라를 살피는 분석가가 '양주시에서 이 종류의 폐기물을 처리하는 허가 업체는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시군의 폐기물 처리업 현황과는 업소명·소재지 주소를 맞춰 붙이거나 관리기관명으로 묶어 이어 쓴다.
limits: 사업자번호 같은 공통 식별 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 처리업체 원장일 뿐이라 폐기물 발생량·처리량 같은 통계는 담지 않는다.
