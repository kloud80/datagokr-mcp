summary_user: 사업장폐기물의 인계 실적을 기준년월·시도·시군구·폐기물명별로 묶어 배출 위탁량, 운반량, 처리량, 재활용량(톤 단위)을 담은 월별 집계 데이터이며 범위는 전국입니다. 지자체나 환경 분석가가 '우리 시군구에서 특정 폐기물이 한 달에 얼마나 위탁·처리되고 그중 재활용은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시도·시군구 주소명이나 폐기물명을 이름 매핑으로 맞춰 다른 지역 통계나 같은 기관의 폐기물 데이터와 잇는다.
limits: 3개 오퍼레이션 중 실호출에 성공한 것은 1개이고, 관할청별·지역별 월간 조회(/getMngPlltnEmMont, /getAreaPlltnEmMont)는 최소 파라미터로 응답이 없었다. 사업자번호 같은 공통 코드가 없어 개별 배출 사업장이나 처리업체 단위로는 연결되지 않는다. 개발계정은 하루 1,000회로 호출이 제한된다.
