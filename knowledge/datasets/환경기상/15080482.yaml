description_portal: 광주광역시 동구에 등록된 전기차 누적 현황은 2015년부터 해마다 늘어난 전기자동차 등록 대수를 정리한 자료로, 지역 내 친환경 교통수단 보급 추세를 한눈에 파악할 수 있도록 구성되어 있습니다. 이 데이터는 전기차 전환 정책의 효과를 평가하고, 충전 인프라 확충이나 환경 정책 수립에 참고하기 위해 활용됩니다.연도별 누적 전기차 등록대수는 동구에서 전기차가 얼마나 빠르게 증가하고 있는지를 보여주는 지표로, 초기 보급기였던 2015년 이후 매년 꾸준한 증가 흐름을 확인할 수 있습니다. 특히 최근 들어 친환경 차량 지원 정책과 충전소 확충이 이루어지면서 등록 대수 증가 폭이 점차 커지는 경향을 보입니다.이 자료는 동구의 탄소저감 전략 수립, 전기차 인프라 계획, 주차·충전시설 배치 검토 등 행정계획에 직접적으로 활용될 뿐 아니라, 주민들이 지역의 친환경 교통 흐름을 이해하는 데에도 도움이 되는 중요한 기초 데이터입니다.
