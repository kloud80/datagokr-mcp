description_portal: 본 데이터는 푸름이 이동환경교실 사업의 운영 현황을 보여주는 연도별 교육인원 정보를 제공합니다.푸름이 이동환경교실은 2004년부터 시작된 환경교육 사업으로, 환경주제 콘텐츠가 탑재된 교육 차량이 학교·기관 등 학생이 있는 곳으로 직접 찾아가 교육을 제공하는 체험형 이동환경교육 프로그램입니다.이 사업은 학교 접근성이 낮은 지역 또는 환경교육 참여 기회가 부족한 학생들에게 교육 기회를 확대하기 위해 운영되고 있으며, 기후·에너지·자원순환 등 다양한 환경 주제를 현장에서 체험 중심으로 학습할 수 있도록 구성되어 있습니다.본 데이터는 2004년 사업 시작 이후 연도별 교육 참여 인원 수를 정리하여, 사업의 성장 추이와 환경교육 수요 변화를 한눈에 확인할 수 있도록 구성하였습니다.
