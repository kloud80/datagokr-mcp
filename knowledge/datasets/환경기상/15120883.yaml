description_portal: 이 데이터는 해양수산부에서 「해양생태계의 보전 및 관리에 관한 법률」 제17조제1항에 근거하여 서식지 외 보전생물을 보호하기 위하여 지정한 서식지 외 보전기관과 관련된 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부장관 또는 시·도지사가 지정한 서식지 외 보전기관의 명칭, 지정 일자, 기관 위치, 지정해양동물명 등으로 구성되어 있습니다.  본 데이터는 해양생물 보전 관련 연구기관의 서식지 외 보전기관 현황 분석, 정책입안자가 해양생물 보호 정책 수립 시 자료로 활용, 교육기관의 해양보호종 보전 교재 개발 및 해양생물 복원사업 기초자료로 활용될 수 있습니다.
