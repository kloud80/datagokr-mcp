summary_user: 경상남도 함안군에서 가전제품·가구·침구류 같은 대형폐기물을 수거하는 업체를 업체별로 정리한 작은 파일(csv, 472 bytes)로, 업체명·담당구역(행정동·법정동)·지번·도로명 주소·전화·팩스번호를 담는다. 함안군 주민이 "우리 읍·면의 대형폐기물은 어느 업체에 연락해 수거를 맡기나"를 확인하거나, 민원 담당자가 구역별 담당 업체 연락처를 찾는 데 쓴다. 전역 조인 키는 없어 담당구역의 읍·면 이름이나 주소로 다른 함안군 대형폐기물 품목·수수료 데이터나 주소 기반 자료와 이름 매칭으로 잇는다.
description_portal: '경상남도 함안군에서 배출되는 대형폐기물(가전제품, 가구, 침구류 등)을 수거하는 업체의 데이터  현황입니다.해당 데이터를 통해 함안군 내 수거업체명, 담당구역, 주소지, 전화번호 등을 알 수 있습니다.함안군 내 업체별 담당구역은삼칠산업 담당구역: 칠원읍, 칠서면, 칠북면연강산업 담당구역: 가야읍, 군북면, 법수면, 산인면, 대산면, 함안면, 여항면이러한 업체를 통해 대형폐기물의 수거 업무를 원활하게 진행하고 있으며, 민원 발생시 해당 업체 번호를 통해 조속하게 처리가 가능합니다.'
legal_basis_portal: 입찰을 통해 선정된 수거업체입니다.
