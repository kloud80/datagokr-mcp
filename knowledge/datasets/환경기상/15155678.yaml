summary_user: 지방자치단체가 관리하는 미세먼지쉼터를 한 곳씩 적은 건별 표준데이터로, 전체 450건에 쉼터명·주소·좌표·운영시간·이용가능인원·공기청정/환기설비 유무·시설면적·관리기관을 담는다. 미세먼지가 심한 날 가까운 쉼터가 어디 있고 몇 시까지 여는지, 공기청정설비가 있는지 찾는 국민이나 지자체 담당자, 분석가가 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)가 조인 키라서 지도 표시나 측정소 위치·대기질 데이터와 좌표·주소로 이어 쓰며, 측정소코드 같은 코드 키는 없다.
limits: 전국 범위가 어디까지인지는 확인되지 않았고 450건 수신이 전부라는 보장은 없다. 쉼터 위치와 시설 정보만 있어 실시간 대기질이나 쉼터 혼잡도는 알 수 없으며, 측정소와 연결하려면 주소·좌표로 직접 맞춰야 한다. 수록 기간은 2025-12-01~2026-08-28이고 최신 행이 35일 전이므로 갱신 주기를 단정하지 말고 기준일자를 확인해야 한다.
