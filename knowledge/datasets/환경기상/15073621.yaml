summary_user: 대구광역시 서구 관내 실내공기질 관리 대상 다중이용시설(어린이집, 의료기관, 노인요양시설, 지하역사, 대규모 점포, 실내주차장 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설군·시설명·도로명주소·위도·경도를 포함한 약 6KB 규모의 CSV 파일이다. 주민이나 행정 담당자가 "우리 동네에서 실내공기질 관리를 받아야 하는 시설은 어디이며 어떤 종류인가"를 확인하거나 지도 위에 시설 위치를 표시하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·도로명주소 문자열을 맞추거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
