description_portal: 실내공기질 관리법 제3조에 따른 대구광역시 서구 관내  대상시설 현황자료로 시설명과 소재지 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 관할 구역 내 실내공기질 관리 대상 시설의 현황을 수록한 자료이다. 대상 시설은 어린이집, 의료기관, 노인요양시설, 영화상영관, 지하역사, 대규모 점포, 도서관, 산후조리원, 실내주차장 등으로 구성되어 있으며, 시설군별 명칭, 도로명주소, 위도 및 경도 정보를 포함하고 있다. 본 자료는 실내공기질 관리법에 따라 관리가 요구되는 다중이용시설의 위치와 현황을 파악하는 데 활용될 수 있으며, 공공보건, 환경정책, 민원 대응 등 다양한 행정 분야에 기초자료로 제공된다. 데이터는 위치 기반 서비스 구축 및 시설별 환경 모니터링을 위한 정보 활용도를 고려하여 표준화된 형식으로 정리되었다.
