summary_user: 한국수자원공사가 운영하는 전국 지하수 관측정(암반층·충적층)별로 조사년도 단위의 평균수위(센티미터), 표고·심도(미터), 측정망번호를 담은 연도별 집계 자료다. 지역 간 지하수 수위를 비교하거나 지하수 개발 전 특정 관측소 일대의 수위·심도 수준을 확인하려는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관측소명(spotNm)이나 측정망번호를 이름·코드로 맞춰 연결해야 한다.
description_portal: 한국수자원공사의 지하수 수위 현황으로 년도별 암반층 관측정, 충적층 관측정의 정보를 제공합니다. 해당 자료는 년도, 관측소명, 관정구분, 평균수위, 표고, 심도 등의 정보를 포함하고 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며, 민간 기업 및 공공기관의 기술적 활용을 촉진하기 위해 제공합니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
