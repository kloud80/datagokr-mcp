summary_user: 성동구에서 건설폐기물 수집·운반·중간처리 인허가를 받은 업소를 한 업소씩 담은 인허가 원장으로, 인허가일·폐업일·휴업기간 같은 영업상태와 사업장명·주소·좌표, 처리 구분·유형과 허용보관량을 담는다. 구민이나 건설 사업자가 '성동구에서 지금 영업 중인 건설폐기물 처리업체는 어디이고 보관 허용량은 얼마인가'를 확인하거나, 분석가가 업체의 개업·폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드·관리번호(MNG_NO)로 같은 기관 데이터에 한해 잇고, 좌표(XCRD·YCRD)로 공간 결합을 한다.
description_portal: 본 데이터는 서울특별시 성동구 내 건설현장에서 발생하는 건축폐기물의 수집, 운반 및 중간처리 업무를 수행하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 도시개발과 건축활동의 증가로 인해 건축폐기물 관리의 중요성이 높아지고 있으며, 이를 효과적으로 처리하고 환경에 미치는 부정적 영향을 최소화하기 위한 목적으로 데이터가 수집되었습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 핵심적인 행정정보가 포함되어 각 업소의 인허가 과정, 영업 개시 및 종료, 운영 현황을 명확히 파악할 수 있습니다. 본 데이터는 성동구청 등 관할 행정기관에서 정기적으로 점검 및 갱신 절차를 거쳐 신뢰성과 최신성을 유지하고 있습니다. 건축폐기물의 체계적 관리와 환경 보호 정책 수립, 업계 동향 분석, 관련 기관 및 업계 종사자들의 실무 자료로 활용될 수 있으며, 궁극적으로 쾌적한 도시환경 조성과 자원순환 실현에 기여할 것으로 기대됩니다.
