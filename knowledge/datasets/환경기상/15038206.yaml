summary_user: 서울 송파구 안에 설치된 폐형광등·폐건전지 분리수거함을 한 곳씩 행 단위로 담은 파일로, 행정동, 주소, 건물명이나 상호로 적은 세부 위치, 수거함 구분과 수량을 기록한다. 주민이 '우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리면 되나'를 찾을 때나, 구 단위로 수거함 배치 현황을 살필 때 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 동명이나 주소 문자열을 맞춰 붙이거나, 같은 송파구의 다른 배출·수거 지점 파일과 나란히 놓고 쓴다.
