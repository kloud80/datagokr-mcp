description_portal: 한국남동발전의 연월별 발전소 주변농도 현황 데이터입니다.2013년 1월부터 2022년 4월까지의 데이터를 조회할 수 있으며, 발전소 운영이 주변 환경에 미치는 영향을 투명하게 공개하고 관리하기 위한 기초 자료입니다.삼천포 발전본부 변전소, 용산초등학교 인근 지역의 미세먼지(PM10), 아황산가스(SO₂), 이산화질소(NO₂)와 같이 국가에서 관리하는 주요 대기오염물질의 월평균 농도를 포함하고 있습니다.이를 통해 발전소 인근의 실제 대기질 상태를 객관적인 수치로 확인할 수 있습니다.
