summary_user: 국가 온실가스 인벤토리 중 수소불화탄소(HFCs) 배출량을 분야별 행, 1990~2023년 연도별 열로 담은 전국 단위 집계 파일(csv)이며, 단위는 백만톤 CO2 eq.입니다. 기후·냉매 정책 분석가나 연구자가 "냉매·발포제 등에서 나오는 HFCs 배출이 1990년 이후 어떻게 늘거나 줄었나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 가스별 인벤토리(CO2·CH4·PFCs 등) 파일과는 분야명과 연도 열을 맞춰 이어 쓴다.
limits: 전국 합계만 담고 지역·사업장 단위 배출량은 없으며, 공통 코드가 없어 다른 데이터와는 분야 이름 매칭으로만 연결된다. 값 자리에 NO·NE·NA·IE·C 같은 표기 코드가 섞여 있어 숫자로 읽기 전에 처리해야 한다.
