summary_user: 국가 온실가스 통계를 산정할 때 쓰는 산정식을 분야(에너지·산업공정 및 제품 사용·농업·LULUCF·폐기물)와 배출가스별로 산정식명·방법론·산정식으로 정리한 참조표이며, 6.7KB 정도의 작은 CSV 파일 하나로 제공된다. 분석가나 기업 담당자가 '특정 분야의 메탄·아산화질소 배출량은 어떤 방법론과 식으로 계산하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 국가 온실가스 배출량 통계와는 분야명·가스명을 이름으로 맞춰 연결해야 한다.
