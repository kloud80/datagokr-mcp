description_portal: 세종특별자치시에서 운영 중인 스마트 워터 그리드에 대한 관할 행정동, 설치위치, 업종, 계량기 종류, 구경, 원격검침 단말기 설치여부에 관한 정보 입니다.세종특별자치시에 설치된 스마트 워커 그리드는 전체 1,471개소로 가람동 16개소, 고운동 348개소, 나성동 93개소, 다정동 63개소, 대평동 50개소, 도담동 216개소, 보람동 127개소, 새롬동 73개소, 소담동 63개소 등이 있습니다.이자료는 세종특별자치시 상하수도사업소에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.o 스마트 워터 그리드는 기존의 물 공급망에 첨단 과학기술과 ICT를 융합하여물의 생산과 소비 정보를 실시간으로 조사하면서수자원과 상하수도를 효율적으로 관리하는 시스템입니다.o 스마트 워터 그리드 기술의 핵심은 ‘한정된 수자원’의 ‘연계 운영’을 통해 수자원 효율을 극대화 시키는 것이라 할 수 있는데요. 쉽게 얘기하자면 물 부족 지역에 있는 지하수, 우수(빗물), 해수 등의 수자원을 ICT 기술을 활용한 물 수요 분석·예측 시스템을 통해 효율적으로 사용하는 시스템이라고 할 수 있습니다.지표수, 하수처리 재이용수, 빗물 등 다양한 수자원을 효율적으로 생산, 저장, 배분, 관리할 수 있어 지능형 물관리 시스템이라고도 부르기도 해요.물관리의 관점을 물 흐름 전체 영역으로 확장하고 스마트 워터 그리드를 사용해 물의 안정성과 안전성, 효율성을 확보하는 전략으로써 미래의 주요 물관리 전략으로 불리고 있다고 합니다.
