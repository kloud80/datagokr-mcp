summary_user: 새만금 지역의 초단기 기상예보를 예보지점 좌표(X·Y)와 예측일자·시각별 예보 값으로 담은 건별 파일이며, 기준 기간은 2014년 5월 13일~14일 이틀이다. 새만금 일대의 과거 특정 시점 초단기 예보값을 확인하거나 예보 자료 구조를 연구·검증하려는 분석가가 '당시 이 지점의 시간별 예보가 어땠나'를 볼 때 쓴다. 전역 조인 키는 없고, 예보지점 X·Y 좌표를 기상청 예보 격자(nx, ny)와 대응시켜 기상청 동네예보·관측 자료와 맞춰 보는 방식으로 이어 쓴다.
limits: 2014년 5월 13~14일 이틀치 자료라 현재 날씨나 최신 예보 확인에는 쓰지 못하며, 실시간 예보는 기상청 API허브를 써야 한다. 자료구분코드의 코드표가 제공되지 않아 예보 값이 어떤 기상 요소인지 해석에 주의가 필요하다. 공통 조인 키가 없어 다른 데이터와는 좌표·격자 매핑으로만 연결된다.
