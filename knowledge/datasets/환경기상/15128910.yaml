summary_user: 전국 지자체가 지정한 화학사고 대피장소 1,849건을 장소별로 담은 건별 원천 파일이며, 대피장소명·수용인원·도로명주소·위도·경도·관리기관 등을 포함한다. 화학물질 누출로 주민 대피 명령이 내려졌을 때 우리 동네에서 어디로 몇 명까지 대피할 수 있는지 찾는 주민이나 지자체 담당자, 분석가가 쓴다. 도로명주소(address)와 위도·경도(coord)를 키로 화학물질 취급 사업장 위치 데이터나 지도 데이터와 이어 쓰며, 사업자번호 같은 사업장 키는 이 파일에 없다.
description_portal: 화학물질관리법 제23조의4(지역화학사고대응계획 수립 등)에 따라, 지방자치단체의  장은 관할 지역에서 화학사고가 발생하는 경우에 대비하기 위하여 화학사고 발생 시 주민대피에 관한 사항 등이 포함된 계획을 수립하여야 합니다. 화학사고 발생 시 주민대피계획에, 화학사고 대피장소 지정 및 관리 등에 관한 사항이 포함되야 합니다. 화학사고 대피장소란, 화학물질 유누출 사고로 인해 지방자치단체에서 주민대피 명령이 발령될 경우, 긴급하게 대피할 수 있는 장소로서 지역주민이 화학물질 노출 등의 위험으로부터 신체를 보호할 수 있는 대피장소를 말합니다. 해당 데이터는, 환경부 화학물질안전원에서 취합관리하는 전국 지자체에서 선정된 화학사고 대피장소 정보입니다. 대피장소 정보에는 대피장소명, 세부 위치, 수용인원수, 도로명주소, 위도, 경도, 관리기관 등의 정보가 포함되어 있습니다.
