summary_user: 경기도 안에서 대기·수질·소음진동·악취·실내공기질·빛공해 등 환경오염물질 측정을 대행하는 업체를 사업장 한 곳당 한 행으로 담는다. 각 행에는 시군, 사업장명, 인허가일자, 영업상태와 폐업일자, 주소와 위경도, 실험실 소재지와 면적이 들어 있다. 사업장 자가측정을 맡길 업체를 찾는 사업자나, 시군별로 측정대행업체가 얼마나 영업 중인지 보려는 분석가가 "우리 시군에서 영업 중인 측정대행업체는 어디인가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군코드(SIGUN_CD)·사업장명·주소를 맞추거나 위경도로 공간 결합해서 잇는다.
description_portal: 이 데이터는 경기도 내에서 환경오염물질의 측정 업무를 대행하는 업체에 대한 정보를 제공합니다. 해당 업체는 대기오염물질, 수질오염물질, 소음·진동, 악취, 다중이용시설 실내공간의 공기질, 인공조명에 의한 빛 공해 등 다양한 환경항목의 측정을 전문적으로 수행합니다. 데이터는 시군별 사업장명, 인허가일자, 소재지 주소, 전화번호, 영업상태, 실험실 위치 및 면적, 위탁업체명, 위경도 좌표 등 상세한 정보를 포함하며, 주간 단위로 갱신됩니다. 데이터는 Open API 형태로 제공되어 환경정책 수립, 오염물질 모니터링, 환경영향 평가, 대행업체 실적 분석 등 다양한 분야에서 활용될 수 있습니다.
team:
