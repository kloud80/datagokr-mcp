description_portal: 환경책임보험 전산망에서 해당 컬럼들은 환경 관련 사업장 시설 운영 및 보험 가입 관리를 위해 구축되는 데이터 항목으로, 사업장의 환경위해 요소 관리, 인허가 상태 추적, 보험 의무 여부 등을 종합적으로 관리하는 데 활용됩니다.매체시설코드, 종별코드는 시설의 종류와 분류를 식별하기 위한 기본 코드로, 통계나 관리 업무에서 시설 특성을 정확히 구분하는 역할을 합니다.특정수질오염물질배출여부 및 특정수질오염물질배출량은 해당 시설이 수질오염물질을 배출하는지 여부와 배출량을 기록하여 환경위해 관리와 법적 규제 준수 여부를 확인하는 근거가 됩니다.보험가입대상코드는 해당 사업장이 환경책임보험 의무가입 대상인지 여부를 판정하는 기준이 되며, 이를 통해 보험가입 관리와 미가입 사업장 점검이 이루어집니다.휴업시작일자, 휴업종료일자, 폐업일자, 인허가반납여부 등은 사업장의 운영 상태를 추적하여, 운영 중지·폐업·허가 반납 시 보험 및 규제 관리가 적절히 연계되도록 지원합니다.시설상태코드, 위해성방지조치여부, 시설설치여부는 시설의 안전관리 현황과 법적 준수 여부를 기록하여 리스크 관리 및 행정 점검 시 활용됩니다.미가동시작일자, 미가동종료일자는 실제 운영은 중단되었으나 휴업·폐업과는 구분되는 상태를 관리합니다.정보승인상태코드, 연도는 데이터의 유효성과 행정 절차상 승인 여부, 해당 관리 연도를 기록하여 보고서 및 통계 산출에 활용됩니다.즉, 이 컬럼들은 환경시설 운영·관리, 위험물질 배출 관리, 보험 의무 적용, 휴·폐업 추적, 데이터 승인 및 행정 보고까지 전 주기적 관리에 활용되는 핵심 데이터 항목입니다.
