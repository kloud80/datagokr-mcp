summary_user: 경상북도 김천시 관내에서 폐플라스틱(폐합성수지류)을 수집·분류·재활용하는 재생플라스틱 업체 29곳의 상호, 도로명 주소, 사업장 전화번호를 업체 한 곳당 한 행으로 담은 파일 목록이다. 김천에서 폐플라스틱을 넘기거나 재생원료를 구할 사업자, 지역 자원순환 업체 현황을 보려는 시민·기관이 '김천에 어떤 플라스틱 재생업체가 어디에 있는가'를 확인하는 데 쓴다. 사업자번호나 코드 같은 공통 조인 키는 없어서, 다른 폐기물 처리업 원장과는 업소명이나 주소를 직접 맞춰 이어야 한다.
description_portal: 이 자료는 경상북도 김천시 관내에 위치한 플라스틱 폐기물(폐합성수지류)을 전문적으로 수집, 분류, 재활용하여 새로운 자원으로 재생하는 업체들(29건)의 정보를 제공합니다.본 자료에는 각 업체의 상호와 사업장이 위치한 주소, 사업장 대표 전화번호(개인 휴대전화번호는 제외)가 포함되어 있습니다.해당 정보는 플라스틱 재활용 산업에 종사하는 기업이나 관련 기관 또는 환경 보호와 자원 순환에 관심있는 시민들이 지역의 플라스틱 폐기물 재생업체 현황을 쉽게 파악하고 활용할 수 있도록 제공됩니다.
