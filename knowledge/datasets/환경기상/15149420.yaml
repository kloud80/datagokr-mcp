summary_user: 화학물질 한 건마다 물질ID, CAS번호, KE번호(기존화학물질번호), 국문·영문 물질명과 유사명, 분자식, 분자량, 물질분류 유형과 고시 정보를 담은 전국 단위의 비공간 물질 원장을 조회하는 API입니다. 사업자나 분석가가 특정 CAS번호나 물질명으로 검색해 그 물질이 어떤 규제 분류에 들어 있고 언제 고시됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 화학물질 취급·배출량 데이터와는 CAS번호나 물질명 같은 이름·코드 매핑으로 연결해야 한다.
limits: 사업장, 좌표, 사업자번호는 담지 않는 물질 단위 정보라서 이 데이터만으로는 어느 사업장이 그 물질을 취급하거나 배출하는지 알 수 없다. 다른 데이터와 공식 조인 키로 결합되지 않아 CAS번호 등으로 매핑할 때 일치 여부를 따로 확인해야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
