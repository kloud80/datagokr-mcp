description_portal: 이 공공데이터는 국가중요과학기술자료 등록현황을 정리한 엑셀 파일로, 연번·자료명·소유관리기관·주요 특징·등록번호 5개 필드를 제공합니다. 등록번호를 통해 기초과학·응용과학·산업기술 등 분야, 순번 및 등록연도를 확인할 수 있습니다. 1956년 대한지질도부터 2023년 애니콜 TV폰까지 수십 건의 과학유산을 망라하며, 학술연구·전시기획·디지털아카이브 구축·교육자료 개발 등 다양한 활용 사례를 지원합니다. 분야별 통계와 소장처별 비교 분석에 용이하여 보존·관리 효율화를 돕습니다. 등록기준과 절차는 과학기술정보통신부와 국립중앙과학관이 유지·관리하며, 자세한 신청 정보는 기관 홈페이지에서 확인할 수 있습니다
