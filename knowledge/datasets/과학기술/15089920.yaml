description_portal: '본 데이터는 전국의 스마트쉼센터 운영과 관련된 지자체 및 위탁기관 정보를 수록한 자료입니다. 각 기관은 고유 코드값을 통해 구분되며, 지자체 단위의 정책 운영 및 상담 지원 인프라를 체계적으로 관리하는 데 활용됩니다.데이터는 다음과 같은 항목으로 구성됩니다:지자체코드 :시·도 또는 시·군·구 단위 지자체를 식별하기 위한 고유 코드입니다. (예: 11 = 서울특별시, 41 = 경기도 등)기관구분코드 : 해당 기관의 유형을 구분하는 코드값으로, 지자체 직접운영, 민간위탁, 공공기관 등으로 분류됩니다.기관명 : 스마트쉼센터 운영을 담당하는 기관의 명칭입니다. (예: 서울시청, 부산중독관리통합지원센터 등)이 데이터는 지역별 상담센터 배치 현황을 파악하거나, 사업 예산 배정 및 실적 분석, 기관별 성과관리 등에 활용할 수 있습니다. 또한 교육계획·상담정보 등 다른 스마트쉼센터 관련 데이터와 연계해 활용이 가능합니다.'
