description_portal: '□ 개요본 데이터셋은 국립과천과학관 과학기술자료실에 소장된 도서 중, 외부로부터 기증받은 도서에 대한 정보를 체계적으로 정리한 자료입니다. 기증 기관명, 기증 도서의 가격 등의 정보를 포함하고 있으며, 주된 활용 목적은 다음과 같습니다. 첫째, 기증자 및 기증 기관별 현황을 파악하여 기증 문화 활성화를 위한 정책 수립의 기초 자료로 활용할 수 있습니다. 둘째, 기증받은 도서의 가치(가격)를 산정하여 자료실 자산 관리의 투명성을 확보하는 데 기여합니다. 셋째, 기증 일자 및 수량 정보를 통해 시기별 도서 입수 현황을 분석하고 장서 구성 계획에 반영할 수 있습니다.□ 데이터 구조· 일련번호 : 기증 도서의 데이터 관리용 고유 식별 번호 (Integer)· 기증자명 : 도서를 기증한 개인 또는 기관의 명칭 (String)· 수입년도 : 도서가 입수되거나 등록된 연도 (Integer, YYYY)· 접수번호 : 기증 접수 시 부여된 관리 번호 (Integer)· 입력구분 : 데이터의 입력 상태 또는 유형 (String, 예: 입력)· 입력일자 : 데이터가 시스템에 입력된 날짜 (String, YYYY-MM-DD)· 화폐구분 : 도서 가격의 통화 단위 (String, 예: 원)· 가격 : 기증 도서의 정가 또는 평가액 (Float)· 총권수 : 기증된 도서의 전체 권수 (Integer)· 입수책수 : 실제 입수된 도서의 수량 (Integer)· 입수일자 : 도서가 실제로 입수된 날짜 (String, YYYY-MM-DD)'
