description_portal: 연구기관, 공공기관, 산업계 등 관련업계 종사자의 기초 데이터 공동활용을 통해 공동연구체제 기반 마련 및 연구자 간, 관련 기관 간 정보활용성 제고를 목적으로 해양수산 과학기술 분야의 국가연구개발 R&D 사업의 연구과제를 수행하는 중에 생산된 조사, 측정, 관측 기초 데이터(Raw Data)를 연구DB 공동활용 서비스에 등록한 현황 정보입니다. 해양기상분야(강수량, 기압, 기온, 풍속 등), 해양물리분야(파고, 염분, 유속, 유향 등), 해양생물분야(녹조류, 규조류, 루테인, 클로로필 등), 해양지질/지구물리분야(동위원소 비율, 금속 원소 비율, 퇴적물 유형 등), 해양화학분야(용존산소량, 질산염 농도, 이산화탄소 농도, 희토류 원소, 방사성 동위원소 등) 등 다양한 분야의 관측항목 및 기초 데이터에 대한 자료이며 해당 데이터는 사업명, 과제명, 주관연구기관, 관측항목 분류, 관측항목, 측정값 건수, 관측자료, 관측기간, 관측영역(관측 시작 좌표 및 관측 종료 좌표)으로 구성되어 있습니다.
