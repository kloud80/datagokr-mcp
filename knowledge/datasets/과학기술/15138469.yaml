description_portal: 한국나노기술원에서 제공하는 공정 정보 데이터는 나노기술 연구 및 산업 현장에서 활용되는 다양한 공정 기술에 대한 정보를 포함하고 있습니다. 반도체, 디스플레이, 센서, 나노소재 등 첨단 산업 분야에서 필수적으로 활용되는 나노 공정 기술의 개요, 적용 분야, 활용 목적뿐만 아니라 관련 장비 및 운영 조건에 대한 정보도 함께 제공합니다.본 데이터는 연구자와 기업이 나노기술 기반의 연구개발 및 시제품 제작에 필요한 공정을 손쉽게 파악할 수 있도록 지원하며, 공공기관 및 산업계에서 기술 개발 전략을 수립하는 데 기초 자료로 활용될 수 있습니다.활용 예시:연구자가 목적에 맞는 나노 공정을 탐색하고 실험 설계에 반영반도체, 디스플레이, 센서 산업 등 첨단 분야 연구개발 및 상용화 지원중소기업 및 스타트업이 첨단 나노 공정을 활용하여 신제품 개발공공기관 및 정책 수립 기관의 나노기술 현황 파악 및 전략 자료 활용나노 공정 기술 DB를 기반으로 한 교육·훈련 프로그램 개발
