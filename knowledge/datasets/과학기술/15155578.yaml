description_portal: '□ 개요본 데이터셋은 국립과천과학관에서 고객을 대상으로 제공하는 전시·교육·행사 등 유료 프로그램의 운영 현황을 정리한 자료입니다. 관람객이 이용 가능한 프로그램의 종류와 일정 정보를 제공하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 프로그램별 운영 기간(시작 및 종료 일자)을 확인하여 연간 행사 일정을 파악할 수 있습니다. 둘째, 상설전시, 체험코스, 천체투영관 등 프로그램 유형별 등록 현황을 분석하여 시기별 운영 트렌드를 확인할 수 있습니다. 셋째, 온라인 예약 및 결제 시스템 운영을 위한 기초 메타 데이터로 활용 가능합니다.□ 데이터 구조· 프로그램명 : 제공되는 전시, 교육, 행사 등의 공식 명칭 (String)· 제작국가 : 프로그램 또는 콘텐츠의 제작 국가 코드 (String, 예: KR)· 결제구분 : 결제 수단에 대한 유형 구분 (String, 예: 카드)· 시작일자 : 프로그램 운영 또는 예매 시작 날짜 (String, YYYY-MM-DD)· 종료일자 : 프로그램 운영 또는 예매 종료 날짜 (String, YYYY-MM-DD)· 등록일자 : 데이터가 시스템에 최초로 등록된 날짜 (String, YYYY-MM-DD)'
