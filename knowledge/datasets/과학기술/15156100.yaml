summary_user: '국내 인터넷주소자원 관리대행자(예: LG유플러스, 브로드밴드아이디씨)가 보유한 IPv4·IPv6 주소 블록을 블록 단위로 담은 목록 파일(CSV, 약 310KB)로, 블록마다 유형·기관명·영문서비스명·시작·끝 주소·주소범위(PREFIX)·/24 환산 개수·할당일을 담는다. 보안 분석가나 네트워크 운영자가 특정 IP 주소가 어느 관리대행자의 대역에 속하는지, 관리대행자별로 IP 대역을 얼마나 보유하는지 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시작·끝 주소 범위 비교나 기관명·영문서비스명 같은 이름 매칭으로 연결한다.'
description_portal: 국내 인터넷주소자원 관리대행자들이 보유·관리하는 IPv4 및 IPv6 주소 자원 중 주로 IPv4 대역에 관한 상세 목록이다. 에이비클(ABCLE), LG유플러스(BORANET), 브로드밴드아이디씨(BROADBANDIDC) 등이 관리 주체로 등장하며, 각 기관은 여러 개의 연속된 IPv4 주소 블록을 할당받아 기업·기관·인터넷 서비스 환경에 제공하고 있다. 각 관리대행자달의 주요 IP 대역을 통해  IDC·호스팅 기반 사업 영역에서 사용된다. 이처럼 관리대행자별 IPv4 대역은 서비스 범위와 고객 규모에 따라 차이가 있으며, 해당 목록은 국내 네트워크 자원 분포와 서비스 인프라 운영 실태를 파악하는 데 중요한 자료로 활용된다
