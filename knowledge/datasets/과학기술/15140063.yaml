description_portal: 본 데이터는 한국방송통신전파진흥원이 관리하는 ICT 기금 비R&D 사업의 계정별 사업수행기관 수행 현황을 정리한 자료로서,정부와 공공기관의 재정투명성 제고, 사업 효율성 분석, 기금운용 평가, 정책수립 지원 등 공공목적 활용을 위하여 제공됩니다. 자료의 구성은 민간경상보조와 사업출연금을 "계정" 항목으로 두고, 그 항목으로 방송통신발전기금과 정보통신진흥기금을 "기금구분" 항목으로 둡니다. 해당 항목들에 따라 ICT기금으로 수행되는 사업자들을 "기관명" 을 그 아래 항목으로 두고, 해당 사업의 "사업시작일"과 "사업종료일" 정보가 함께 제공됩니다. 본 자료를 통해 ICT기금의 집행 구조와 재정집중 분야를 파악할 수 있도록 구성되어 있습니다. ICT 기금은 정보통신·방송 분야의 연구개발, 인프라 구축, 인력양성, 산업진흥 등을 목적으로 하는 기관의 사업 수행 증진 · 지원 등이 주요 목적 중 하나입니다. 본 자료는 ICT산업 재정투자 흐름을 이해하는 데 참고할 수 있습니다.
