description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 지역본부에서 수집·접수된 교통정보 중 방송 준비 단계 건수를 정리한 자료이다. 지방본부별 시간대 접수 현황을 표준 필드로 제공하여 어느 시간에 수집이 집중되는지 정량 파악이 가능하다. 주요 항목은 지역본부명, 기준일자, 시간구간, 접수건수(수집건수)이며, 본 자료는 제보 채널 운영 점검, 편성 계획, 지역 간 업무량 비교, 혼잡 대응 인력 배치 검토 등 의사결정을 지원한다. 이용자는 지역 선택과 시간대별 추이를 비교해 대시보드를 구성한다.
