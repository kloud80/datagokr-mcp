description_portal: '1. 개요패턴데이터는 특허 데이터를 보다 세밀하게 분류하고, 기술 동향이나 산업 트렌드를 파악하는 데 중요한 정보를 제공합니다. 이를 통해 기술의 발전 추이, 경쟁 상황, 시장 동향, 기술 혁신 등을 분석하고, 기업이나 정부의 R&D 전략이나 정책 설계에 필요한 중요한 데이터를 파악할 수 있습니다. 상세정보는 아래와 같습니다.2. 상세정보1) 패턴대표명 : 특허의 기술적 속성이나 주요 특징을 요약하여 표현하며, 해당 패턴이 어떤 기술 영역을 나타내는지를 구체적으로 나타냅니다.2) 패턴유사명 : 동일 기술이지만 다른 방식으로 명명되었거나, 같은 기술 분야에서 비슷한 특허들이나 변형된 기술들을 나타냅니다.3) 패턴구분코드 : 해당 패턴이 어떤 유형의 특허나 기술에 속하는지를 구분하는 식별 코드입니다.4) 패턴등록일시 : 해당 기술 패턴이  등록된 날짜와 시간을 나타냅니다.코드정의 내 컬럼내용을 아래와 같이 제공합니다.코드값(43001): 상위코드(430)-코드명칭(법인분류명)-코드정의(법인분류명)코드값(43002)-상위코드(430)-코드명칭(시도명)-코드정의(시도명)코드값(43003)-상위코드(430)-코드명칭(국적명)-코드정의(국적명)코드값(43004)-상위코드(403)-코드명칭(주소명)-코드정의(주소명)총 행의 개수는 891개입니다.'
