description_portal: 학생들의 창의성, 인성, 사회성 함양을 위해 학교 교육과정에서 '창의적 체험활동'의 중요성이 강조됨에 따라, 한국과학창의재단은 전국의 다양한 체험활동 프로그램을 통합적으로 제공하여 학생, 학부모, 교사에게 맞춤형 교육 정보 탐색의 편의를 제공하고자 합니다.개방 데이터는 전국 각지의 공공기관, 대학교, 민간단체 등에서 운영하는 약 21,500여 개의 창의적 체험활동 프로그램 목록입니다. 각 프로그램별로 활동 제목, 모집 기간, 참여 대상(유치원, 초·중·고, 일반), 체험활동 장소 및 상세 주소 정보를 제공하여 사용자가 원하는 조건의 프로그램을 쉽게 찾을 수 있도록 구성되어 있습니다.학생 및 학부모는 거주 지역이나 관심 분야에 맞는 체험활동을 손쉽게 찾아 자기주도적 학습 및 진로 탐색의 기회로 활용할 수 있습니다. 교사 및 교육기관은 학교 밖 현장 교육 계획 수립 시 유용한 참고 자료로 활용할 수 있으며, 체험활동 운영 기관은 프로그램을 등록하고 홍보하는 플랫폼으로 사용하여 참여율을 높이는 데 기여할 수 있습니다.
