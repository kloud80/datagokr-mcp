summary_user: 한국학술지인용색인(KCI)에 실린 논문을 한 행에 한 편씩 담은 파일 데이터로, 국문·영문·외국어 논문명, 저자·공동저자, 학술지명, ISSN, 발행기관, 등재구분, 발행년, 권·호·페이지, 키워드, 주제분야를 담는다(CSV 약 87MB). 연구자나 정책 분석가가 "특정 주제분야에서 최근 몇 년간 국내 등재지 논문이 어떻게 늘었는가" 같은 국내 학술연구 동향과 학술지별 게재 현황을 볼 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키는 없으므로, ISSN(국제표준연속간행물)이나 학술지명·발행기관명을 이름으로 맞춰 학술지 단위 정보와 이어 쓴다.
description_portal: '한국학술지인용색인(KCI)에 등재된 논문 정보를 체계적으로 수록한 데이터입니다. 논문명, 저자, 학술지명, ISSN, 발행년도, 등재구분, 주제분야 등 다양한 세부 항목이 포함되어 있습니다. 이 데이터는 국문·영문·외국어 논문명과 학술지명, 발행기관 정보, 권·호·페이지 등 상세한 서지정보를 제공합니다. 또한 연구자, 학술기관, 정책입안자 등이 국내 학술연구 동향 분석, 인용 현황 파악, 연구성과 평가, 학술지 비교 등에 활용할 수 있습니다. 연간 주기로 업데이트되어, 수정일을 기준으로 최근 정보를 확인할 수 있습니다.참고: 빈칸은 수집되지 않은 데이터 입니다.'
