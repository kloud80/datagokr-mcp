description_portal: '- 한국방송광고진흥공사에서 운영하는 방송통신광고비조사 내용 중 2022년 이후 온라인분야 세부광고유형별 광고비 매출액 데이터를 제공합니다.- 개방 데이터는 년도, 온라인 유형, 세부 광고유형, 매출액, 구성비율 총 5가지 항목으로 이루어져 있습니다.(2025, 2026년 수치는 추정치이며 내년도 조사에서 변경될 수 있습니다.)- 학계 및 연구기관에서 국내 온라인분야 광고시장의 규모 파악, 광고유형별 광고시장의 변화추이를 살피고 광고산업 진흥과 경쟁력 강화를 위한 정책 입안 및 연구개발에 기초자료로 활용할 수 있으며, 기업은 사업전략 수립에 활용할 수 있습니다.'
