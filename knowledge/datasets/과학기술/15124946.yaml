summary_user: 특허·실용신안·디자인·상표의 등록원부를 등록번호 한 건씩 실시간으로 조회하며, 등록·출원·공고 번호와 일자, 명칭, 청구항 수, 존속기간 만료일, 등록상태, 출원인·권리자·대리인 정보를 담는다(검증 호출 수신 91행, 행 날짜 범위 1994-02-16~2025-10-14). 기업이나 분석가가 특정 등록권리의 현재 권리자와 등록상태, 존속기간 만료일을 기술이전·실시권 협상이나 경쟁사 권리 확인 전에 원부 기준으로 확인할 때 쓴다. 필수 입력인 등록번호(rgstNo)는 특허정보검색(KIPRIS) 등 다른 데이터에서 먼저 받아 넘겨야 하고, 출원번호·공고번호로 공보·출원 데이터와 잇고, 출원인의 법인등록번호·사업자등록번호로 기업 데이터와 연결한다.
limits: 등록번호를 모르면 조회할 수 없어 키워드·출원인 기준의 목록 검색에는 쓰지 못하며, 비공개건은 조회가 제한될 수 있다. 6개 오퍼레이션 중 실호출 성공은 1개이고 특허·실용신안·디자인·상표 이력 오퍼레이션은 최소 파라미터로 응답이 없었다. 실측 최신 날짜(2025-10-14)는 검증 호출 조건에 따른 결과이므로 데이터가 오래됐다고 단정하지 않는다.
