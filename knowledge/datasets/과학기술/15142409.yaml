summary_user: 우체국 방문소포 접수 건별로 접수일자·시각, 발송인·수취인 주소와 우편번호, 소포 중량·부피, 접수·발송집중국·도착·배달 우체국 구분과 배달일자를 담은 전국 단위 원천 데이터다. 물류 분석가나 택배 사업자가 지역 간 소포 이동 흐름과 접수부터 배달까지 걸린 기간을 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 발송인·수취인 우편번호(sndrZip, addrseZip)나 주소를 우편번호·주소 데이터와 이름·코드로 맞춰 잇거나 같은 기관의 우체국 구분코드로만 연결한다.
limits: 다른 기관 데이터와 바로 붙는 공통 키가 없어 우편번호·주소 문자열 매핑에 의존해야 한다. 서비스키 인증이 필요하고 개발계정은 하루 10,000회까지 호출할 수 있다.
