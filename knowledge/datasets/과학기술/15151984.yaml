description_portal: 누리꿈스퀘어는 서울특별시 마포구 상암동에 위치한 복합 비즈니스 공간으로 국제회의실부터 소회의실까지 다양한 규모의 회의실을 운영하고 있습니다. 누리꿈스퀘어가 운영하는 회의실의 기본 정보를 제공합니다.[데이터 설명]ㅇ장소명은 누리꿈스퀘어에서 제공하는 회의실 명칭입니다.ㅇ좌석수는 해당 시설의 표준 좌석배치 기준 최대 수용 인원을 의미합니다.ㅇ면적은 시설의 사용 가능 공간 규모(㎡)를 나타냅니다. 일부 시설은 부속공간 포함 여부에 따라 실제 사용 가능 면적이 상이할 수 있습니다.ㅇ시설 정보는 운영환경 변경 시 업데이트됩니다.ㅇ장소코드는 누리꿈스퀘어에서 운영하는 각 회의실 등을 식별하기 위한 고유코드입니다.ㅇ종일요금은 해당 장소를 1일 기준으로 대관할 경우 적용되는 기준요금입니다.(09~18시)ㅇ반일요금은 해당 장소를 반일(오전/오후) 기준으로 대관할 경우 적용되는 기준요금입니다.(오전 08~12시/오후 14~18시)ㅇ추가시간할증요율은 계약된 대관시간을 초과하여 이용하는 경우 적용되는 할증 비율로,추가요금 산식은 (종일요금/8) + ((종일요금 × 할증요율 ÷ 100) × 추가시간) 입니다.ㅇ실제 적용요금은 시설별 특성 및 부대시설 이용 여부에 따라 달라질 수 있습니다.ㅇ대관요금은 운영정책 변경에 따라 조정될 수 있으며, 요금 변동 시 관련 정보는 정기 업데이트를 통해 개방 데이터에 반영됩니다.자세한 사항은 누리꿈스퀘어 홈페이지에서 확인하시기 바랍니다.https://nuri.nipa.kr
