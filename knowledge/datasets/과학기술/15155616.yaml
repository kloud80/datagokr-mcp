description_portal: '□ 개요본 데이터셋은 국립과천과학관 과학기술자료실에서 사용하는 표준자료관리시스템의 운용자(이용자) 분류 정보를 정리한 자료입니다. 자료실 시스템을 이용하는 사용자 그룹별 권한 및 정책 설정을 파악하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 자원봉사자, 인턴, 직원 등 운용자 유형별로 분류된 목록을 통해 시스템 접근 권한 체계를 이해할 수 있습니다. 둘째, 각 운용자 등급에 따라 설정된 도서 대출 권수와 예약 가능 권수 정보를 확인하여 자료실 운영 정책을 파악하는 데 활용됩니다. 셋째, 시스템 사용자 그룹 관리 및 권한 부여 현황을 점검하고 효율적인 자료실 운영을 위한 기초 데이터로 활용 가능합니다.□ 데이터 구조· 설명 : 표준자료관리시스템에 등록된 운용자 또는 이용자 그룹의 명칭 (String, 예: 자원봉사, 인턴사원)· 대출책수 : 해당 운용자 그룹에게 허용된 최대 도서 대출 가능 권수 (Integer)· 예약책수 : 해당 운용자 그룹에게 허용된 최대 도서 예약 가능 권수 (Integer)'
