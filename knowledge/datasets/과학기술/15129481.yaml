description_portal: 본 데이터는 과학기술정보통신부, 한국지능정보사회진흥원(NIA)에서 추진하는 디지털 포용 정책의 일환으로 추진되는 디지털배움터 현황자료입니다. 본 데이터는 전국에 설치된 디지털배움터를 통해 디지털 역량강화(리터러시) 교육을 수료한 인원을 지역별(광역지자체, 기초 지자체)로 집계한 자료입니다. 본 데이터는 특히 정책 수립의 기초자료로 사용될 수 있습니다. 지역 간 디지털배움터 교육 수료자를 비교해, 디지털 교육 접근성의 차이를 도출할 수 있으며 각 지역의 디지털배움터 교육 수료자를 분석해 사업 성과를 정량적으로 측정이 가능합니다. 또한 본 데이터는 인구통계 등 지자체의 데이터와 연계, 분석하여 보다 유의미한 결과를 도출할 수 있습니다. 지역별 인구 데이터와 지역별 디지털배움터 교육 수료자를 비교 분석하며, 인구 대비 디지털 교육 수료생을 파악할 수 있으며, 이는 각 지역 간 디지털 소외 정도를 판단하는 자료로 사용될 수 있습니다.
