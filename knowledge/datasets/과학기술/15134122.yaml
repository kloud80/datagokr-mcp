description_portal: '- 한국방송광고진흥공사에서 운영하는 방송통신광고비조사 내용 중 2021년 이후 연간 광고 인력 채용 규모를 요약한 데이터를 제공합니다. * 국가승인통계로 해당연도 2년 경과 후 통계수치가 최종 확정됩니다.- 개방 데이터는 년도, 매체 유형, 신입(1년 이상 근무자), 신입(1년 미만 근무자), 경력(1년 이상 근무자), 경력(1년 미만 근무자), 계(총 채용 인원) 총 7개 항목으로 이루어져 있습니다.- 최근 취업 및 채용시장의 관심도가 높아짐에 따라 광고산업 채용 규모에 대해 조사 및 연구가 필요한 학계 및 연구기관에서 기초자료로 활용할 수 있으며, 이를 기반으로 일자리 정책 실효성을 높이는 데 기여할 수 있습니다.'
