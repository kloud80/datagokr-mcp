description_portal: 이 데이터는 한국방송통신전파진흥원이 수집/정리한 전자파 관련 주요 사회적 이슈와 보도 내용 등을 정리한 것입니다. 전자파 인체영향, 생활환경 노출, 전자파 측정 및 관리, 이동통신 기지국 전자파 논란 등 국민 생활과 밀접한 사안에 대한 보도 자료 및 공공 논의 내용을 포함합니다. 데이터는 전자파 이슈의 제목, 조회수, 첨부파일, 첨부파일 링크, 내용의 텍스트 수 그리고 간단한 내용 정보로 구성됩니다. 사회적 관심도가 높은 전자파 안전 문제를 중심으로 구성되었습니다. 또한 전자파 안전 정책 추진 과정에서 나타난 쟁점과 정부·학계의 대응 내용을 몇몇 수록하여, 이를 통해 전자파 관련 정책의 흐름과 사회적 인식 변화를 파악하는데 활용할 수 있습니다. 본 데이터는 국민이 전자파 안전정보를 객관적으로 이해하고 합리적으로 활용할 수 있도록 지원하기 위해 구축되었습니다.
