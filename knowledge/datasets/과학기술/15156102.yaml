description_portal: 국내 인터넷주소자원 확보 추이를 보면, 1996년 4개에 불과하던 ASN은 인터넷 산업 확대와 함께 꾸준히 증가해 2023년에는 1,105개를 넘어서며 대규모 네트워크 운영 주체가 크게 늘어난 흐름을 보여준다. IPv4 주소는 1991년 256개 확보에서 시작해 2000년대 중반까지 급격히 증가했다. 2011년 약 1억 1천만 개에서 사실상 포화 상태에 도달한 이후에는 소폭 증가하거나 정체되는 양상을 보이며, 글로벌 IPv4 고갈 현상과 동일한 흐름을 따른다. 한편 IPv6는 1999년 최초 1개 할당 이후 초기에 완만하게 증가하다가 2005년 대규모 확보(4000대 이상) 이후 지속적으로 확장되며 2020년대에도 안정적으로 증가하고 있다. 이 자료는 전체적으로 국내 인터넷 자원의 성장, IPv4 고갈 대응, IPv6 전환 기반 확충 등 네트워크 환경 변화의 장기적 추이를 제공한다.
