description_portal: '- 한국방송광고진흥공사에서 관리, 운영하는 한국광고박물관이 소장하고 있는 분야별 광고소재의 디지털 아카이브 데이터로 옥외광고 관련 항목들을 제공합니다.- 개방 데이터는 광고주, (업종)대분류, (업종)중분류, (업종)소분류, 제목, 내용, 매체 총 7개 항목으로 이루어져 있으며 총 1,508건입니다.- 최근 다양한 형태의 옥외광고가 발전하면서 이전 사례에 대한 조사 및 연구가 필요한 학계 및 연구기관에서 기초자료로 활용할 수 있으며,  광고 및 홍보 유관 기업에서는 한국광고박물관에서 보유하고 있는 광고주별, 업종별, 광고 형태별 과거 옥외광고 진행 내역 확인이 필요하신 경우 활용할 수 있습니다.'
