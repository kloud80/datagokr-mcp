description_portal: 경상남도 내 과학관 현황을 과학관명, 과학관 소재지, 주요전시분야, 개관일, 등록번호, 비고(공립, 사립)등의 항목으로 제공합니다.과학관은 과학기술의 원리와 최신 성과를 전시·체험을 통해 쉽게 이해하도록 하는 과학문화 시설입니다. 기초과학부터 공학·우주·환경 등 다양한 분야의 전시와 교육 프로그램을 제공하며, 학생과 시민의 과학적 소양을 높이는 역할을 합니다. 또한 지역 산업·연구기관과 연계해 과학문화 확산과 인재 양성에 기여합니다.전문과학관은 특정 분야의 과학·기술을 심층적으로 다루는 전문형 과학관으로, 일반 종합형 과학관과 구분되는 특징을 갖습니다. 주로 특정 산업·기술 분야의 전문 지식 확산, 산업 생태계 강화, 지역 전략산업과의 연계를 목적으로 설립됩니다.
