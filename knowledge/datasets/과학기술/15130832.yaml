description_portal: '한국데이터산업진흥원에서 제공하는 데이터안심구역 분석캠프 신청현황 데이터는 데이터안심구역에서 운영하는 안심구역 이용 지원 및 그 활용을 장려하기 위해 진행되는 분석캠프의 현황을 담고 있는 자료입니다. 데이터 분석 교육을 통해 데이터 산업이 더욱 활성화되고, 관련 분야 종사자들이 데이터 활용 능력을 배양할 수 있도록 지원하고 있습니다. 이 데이터는 분석캠프에 대한 교육 신청 및 수료 정보를 포함하고 있어, 분석을 통해 향후 교육 내용을 개선하거나, 상담 및 지원 서비스의 방향성을 정하는 데 활용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다."센터"(문자형): 데이터안심구역 관련 센터의 이름"분석캠프명"(문자형): 특정 분석캠프의 제목"차수"(숫자형): 해당 캠프의 차수"연도"(숫자형): 캠프가 시행된 연도"교육기간"(문자형): 교육이 진행된 기간"신청인원"(숫자형): 해당 캠프에 신청한 인원 수"수료인원"(숫자형): 해당 캠프를 수료한 인원 수'
