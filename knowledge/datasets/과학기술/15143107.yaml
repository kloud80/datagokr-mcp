description_portal: '휴대폰 등 일상생활에서 사용하는 전자제품에 대한 전자파흡수율 값을 확인할 수 있습니다.과학기술정보통신부 국립전파연구원이 공개한 자료로, 스마트폰, 스마트워치, 터치형 컴퓨터 등 다양한 전자기기의 전자파흡수율(SAR) 측정값과 등급을 포함한다. 제품타입, 제조사명, 제품명, 모델명을 함께 제공해 사용자가 기기별 전자파 방출량을 확인하고, 인체 안전 기준에 따른 등급 정보를 참고할 수 있다. 전자파 관리 현황과 기기별 특성을 비교 분석하는 데 활용된다.보유 컬럼 : 정렬일련번호, 제품타입, 제조사명, 제품명, 모델명, 전자파흡수율(SAR) 값, 전자파흡수율(SAR) 등급'
