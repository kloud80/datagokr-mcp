summary_user: KCI 등재 국내 학술지의 공동발행기관 정보를 기관별 건 단위로 담으며, 학술지와 발행기관의 연결(기관ID·학술지ID·공동발행기관 일련번호)이 핵심이고 전국 범위 전체 287건이다. 연구자나 학술정책 분석가가 특정 학술지를 어느 기관들이 함께 발행하는지, 한 기관이 몇 개 학술지에 공동발행기관으로 참여하는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, KCI 내부 기관ID(INSI_ID)·학술지ID를 같은 KCI 계열 서비스의 코드와 맞추거나 기관명 매핑으로만 이어 쓴다.
limits: 오퍼레이션 2개 중 기관 정보(insiInfo)는 최소 파라미터로 호출했을 때 응답이 없었고, 1개만 실호출에 성공했다. 검증 때는 287건 중 10행만 받았으므로 전량을 모으려면 페이지를 넘겨 반복 호출해야 한다. 개발계정은 하루 5,000회로 제한된다.
