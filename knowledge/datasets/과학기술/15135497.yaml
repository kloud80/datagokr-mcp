description_portal: '이 공공데이터는 기관 홈페이지 운영을 위한 메뉴 구성 정보를 체계화한 파일이다. 각 항목은 고유의 메뉴ID와 상위·하위 메뉴명을 비롯해 사용 여부, 화면 로딩 시 새 창 오픈 유무, 표시 순서를 나타내는 정렬순서, 메뉴 간 계층 단계를 포함한다. 시스템관리, 사이트관리(콘텐츠등록·배너·팝업창·설문·첨부파일 등), 통계 및 로그관리(변경이력·접속이력·발송현황), 예약관리, 연계시스템관리, 내부일정관리, 경진대회관리 등 주요 카테고리를 빠짐없이 정리해 유지보수와 신규 기능 개발 시 가이드로 활용할 수 있다. 이 파일을 통해 운영 메뉴를 표준화하고, 일관성 있는 사용자 환경을 구축하는 기반을 마련할 수 있다.- 제공목록 : 메뉴ID, 메뉴명1, 메뉴명2, 상태관리, 정렬순서, 새창유무, 단계'
