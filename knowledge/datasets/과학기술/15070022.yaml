description_portal: '과학기술정보통신부에서 제공하는 우리나라 총 연구개발비의 경제사회목적별 분류 통계 데이터입니다. 국가 R&D 투자가 어떤 사회경제적 목적을 위해 배분되고 있는지를 체계적으로 분석할 수 있는 정책 통계자료입니다. 데이터는 13개의 경제사회목적별 분류로 구성되어 있습니다: 산업생산및기술, 건강, 교통·전기통신등기반시설, 에너지, 국방, 지식의전반적진보, 환경, 농업, 문화·휴양·종교및매스미디어, 우주개발및탐사, 정치·사회시스템·조직및과정, 교육, 지구개발및탐사. 각 분야별로 연도별 연구개발비 투자 금액이 시계열 데이터로 제공되며, 이를 통해 국가 R&D 투자의 우선순위 변화와 정책 방향을 파악할 수 있습니다. 이 데이터는 국가 R&D 예산 배분 정책 수립, 경제사회 목적별 투자 효율성 분석, 분야별 R&D 투자 추이 분석, 국제 비교 연구 등에 활용될 수 있으며, 우리나라 과학기술 정책의 사회경제적 지향점을 이해하는 데 필수적인 기초자료입니다.'
