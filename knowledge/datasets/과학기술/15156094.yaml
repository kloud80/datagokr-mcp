summary_user: 한국인터넷진흥원 가명정보 지원 플랫폼에 등록된 가명정보 활용 우수사례를 사례 한 건씩 담은 파일(csv, 약 58KB)로, 사례 구분·분야 유형·제목·제안자·조회수·등록일시 등을 포함한다. 가명정보 결합을 검토하는 기관 담당자나 분석가가 "사회적 약자 지원이나 지역 상권 분석에 행정·민간 데이터를 가명결합한 선례가 있는가"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사례 제목·분야명 같은 이름으로만 맞춰 볼 수 있다.
description_portal: 본 자료는 KISA에서 제공하는 가명정보 우수사례 플랫폼 지원 서비스로 주요 현황 정보로는 다양한 사회·행정 분야에서 데이터 기반 문제 해결과 정책 개선 필요성을 제기한 사례들로 구성된다. 주요 주제는 ▲소방관·노년층·취약계층·국가유공자 등 사회적 약자 지원 ▲보이스피싱·질병·수돗물 사용량·지역 상권 분석 등 생활 안전 및 건강 문제 해결 ▲연안·어촌·관광·소매업 등 지역 경제 활성화 ▲디지털 격차 해소 및 노인 일자리 지원 ▲고교학점제 운영 효율화 ▲국민 노후 대비 현황 분석 등이다. 행정·민간 데이터를 가명결합해 사각지대를 파악하고, 정책 효과성 제고 및 맞춤형 서비스 제공을 위한 데이터 활용의 필요성이 공통적으로 강조된다.
