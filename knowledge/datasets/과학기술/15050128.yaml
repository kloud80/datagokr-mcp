description_portal: '긴급구조 목적으로 구축한 데이터로써, WiFi AP 정보수집을 위한 전국 890개 실내 지하철 역사 정보로 역사아이디, 수집 타입(inner,outer), 역사이름(경복궁역 등) 등에 대한 정보를 제공함.함께 개방중인 지하철역사정보, WiFi AP정보, 측위정보의 세가지 정보가 조합되어 지하철역사내의 위치정보를 활용하는 것이 가능함. 측위 시 사용자 주변의 AP 정보를 스캔 후 구축한 DB와 가장 유사한 패턴을 분석하여 측위하는 방식으로 동작하며, 측위 성능 신뢰도 80% 이내, 오차범위 30m 이내의 목표로 구축.(주의사항: 신규 설치 및 제거 등이 용이한 Wi-Fi AP의 특성상 시간이 경과되어 해당 역사의 설치된 AP 정보가 다수 변경될 경우,측위 정확성 및 신뢰도가 저하될 수 있음)'
