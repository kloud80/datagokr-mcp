description_portal: '한국데이터산업진흥원이 데이터바우처 사업을 통해 지정된 공급기업의 데이터 상품 정보를 제공하고 있습니다. 이 데이터는 다양한 분야의 데이터 상품에 대한 정보를 포함하고 있으며, 이는 기업과 연구자들이 데이터 기반의 의사결정을 할 수 있도록 지원하기 위해 제작되었습니다. 데이터를 활용하여 시장 분석, 연구, 비즈니스 기획 및 마케팅 전략 수립에 기여할 수 있습니다. 특히 데이터 상품의 이용은 산업 통계 뿐만 아니라 공공기관의 정책 수립 및 실효성 검토에 필수적인 자료가 됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.번호(숫자형) : 데이터 상품의 고유 번호카테고리(문자형) : 데이터 상품의 분류 카테고리상품유형(문자형) : 데이터의 사용 유형으로 파일 및 API 형태를 구분상품명(문자형) : 데이터 상품의 명칭공급기업명(문자형) : 해당 데이터 상품을 제공하는 기업의 이름상품설명(문자형) : 데이터 상품에 대한 요약 정보확장자정보(문자형) : 데이터 파일의 포맷 정보유_무료 여부(문자형) : 데이터 이용 비용의 유무 정보등록일(날짜형) : 데이터가 등록된 날짜링크(URL)(문자형) : 데이터 상품과 관련된 웹 링크 정보'
