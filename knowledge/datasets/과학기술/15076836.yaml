description_portal: '본 데이터는 한국방송통신전파진흥원에서 수행하는 무선국검사 관련 측정 장비 종류 및 보유수량 현황을 정리한 자료입니다. 각 장비의 분류와 명칭, 모델명, 보유개수 정보를 포함하며, 무선설비 검사와 전파환경 측정에 활용되는 핵심 장비 정보를 제공합니다. 해당 정보는 무선국의 기술기준 적합 여부를 판정하는 과정에서 사용되는 장비의 구체적 모델을 국민에게 공개함으로써 검사 절차의 투명성과 신뢰성을 높이는데 활용됩니다. 또한 장비보유 개수를 통해 장비의 정확도 유지와 품질관리를 지원하며, 전파 관련 연구자와 산업계가 검사방법을 이해하고 장비 운용정책을 수립하는 데 참고자료로 활용할 수 있습니다. 본 데이터는 공공의 정보 접근성과 행정 투명성 제고를 위해 주기적으로 갱신된다.기준일 : 2022년 07월 25일'
