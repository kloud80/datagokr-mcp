description_portal: '이 데이터는 2015년부터 2024년까지 매년 개최된 전국과학전람회의 개최요강 정보를 포함하고 있습니다. 각 연도별로 전람회 명칭, 작성일, 조회수, 요강 본문, 첨부파일명 등 주요 항목이 수록되어 있어, 과학전람회 개최 내역과 관련 자료를 체계적으로 제공합니다. 이를 통해 과학 행사 준비 및 연구에 필요한 정보를 손쉽게 확인할 수 있으며, 과학 교육 현장이나 정책 수립, 행사 운영 등 다양한 분야에서 활용도가 높습니다. 데이터는 한글명(제목)과 본문, 첨부파일 등 실제 전람회 운영에 필요한 실질적인 내용을 담고 있어, 관련 업무 종사자와 연구자에게 유용한 자료입니다.- 제공목록: 번호, 년도, 제목, 작성일, 조회수, 본문내용, 첨부파일명(사이트 정보) https://www.science.go.kr/mps/1078/bbs/157/moveBbsNttList.do'
