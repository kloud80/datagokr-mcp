summary_user: 인천광역시 제물포구(옛 동구) 관내에서 영업 중인 통신판매업·방문판매업 사업체를 업체별 한 행으로 담은 원장 파일로, 신고일자·상호·대표자·사업자번호·소재지 주소·취급품목·판매방식 등이 들어 있다(CSV 약 172KB). 주민이나 소비자보호 담당자가 "우리 구에 신고된 온라인·방문판매 업체가 어디에 있고 무엇을 파는가"를 확인하거나, 분석가가 판매방식·품목별 업체 분포를 볼 때 쓴다. 전역 조인 키는 없으며, 사업자번호나 소재지 주소를 매개로 상권·기업 데이터와 이어 쓴다.
description_portal: 인천광역시 동구 관내에서 영업중인 통신판매업 및 방문판매업 현황을 수록한 자료입니다. 각 사업체의 구분, 법인명 또는 상호 그리고 사업장 소재지 주소 등의 기본 정보가 포함되어 있습니다. 본 자료는 비대면 거래 및 직접 판매 형태의 사업체 분포를 파악하는데 유용하며, 지역 내 상거래 구조 분석, 소비자 보호 정책 수립, 불법 영업 예방, 유관 기관 간 정보 공유 등에 기초자료로 활용될 수 있습니다. 또한 온라인 및 오프라인 상거래 관련 민원 대응, 업종별 통계 분석, 상권 관리 등 다양한 행정 목적에도 효과적으로 활용될 수 있습니다.
