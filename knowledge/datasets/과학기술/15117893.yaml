summary_user: 외국교육기관과 외국인학교를 학교 한 곳당 한 행으로 담은 목록 파일로, 학교아이디·지역명·학교명만 있고 파일 크기는 약 2KB(2242바이트)로 작다. 국내에 어떤 외국교육기관·외국인학교가 어느 지역에 있는지 확인하려는 학부모나 행정 담당자가 쓴다. 학교아이디(foreign_school_id)가 실측 조인 키라서 같은 아이디를 쓰는 한국연구재단의 외국교육기관 관련 자료와 이어 쓰며, 지역명은 행정구역 코드가 아닌 명칭이라 다른 지역 통계와는 이름 기준으로 맞춰야 한다.
description_portal: 외국교육기관 및 외국인학교에 대한 학교검색 리스트를 제공하는 데이터입니다. 각 학교의 고유 식별번호, 지역명, 학교명 등의 기본 정보가 포함되어 있습니다. 이 자료는 국내외 교육기관의 위치와 명칭을 손쉽게 파악할 수 있어, 학교 현황 조사, 지역별 교육기관 분포 분석, 국제 교류 협력 대상 기관 탐색 등의 목적으로 활용할 수 있습니다. 또한 교육연구, 정책수립, 행정업무 등 다양한 분야에서 참고자료로 활용 가능합니다. 연간 기준으로 업데이트되어, 수정일을 기준으로 최근 정보를 확인할 수 있습니다.
