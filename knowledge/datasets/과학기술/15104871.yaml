summary_user: 전국에 구축된 융합보안리빙랩을 한 곳씩 나열한 목록 파일로, 리빙랩 이름·주소·운영요일과 운영시간·이용대상·연락처·협업기관을 담는다(약 1KB 규모의 작은 CSV). 보안 제품을 개발하는 사업자나 연구자가 "가까운 융합보안리빙랩은 어디이고 언제, 누가 이용할 수 있나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소를 기준으로 지역을 맞추거나 리빙랩 이름·협업기관 이름으로 직접 대조해 잇는다.
description_portal: 5대 핵심서비스인 디지털헬스케어, 자율주행차, 스마트공장, 실감콘텐츠, 스마트시티 분야를 중심으로 구축된 융합보안리빙랩의 목록 및 운영 현황을 상세히 제공합니다. 각 리빙랩별 설립 배경과 목적, 주요 기능과 역할, 운영 조직 및 참여 기관, 진행 중인 연구 및 실증 활동 내용을 포함하고 있으며, 최신 보안 기술의 적용 현황과 현장 테스트 결과, 관련 산업 및 학계와의 협력 체계에 대해서도 구체적으로 설명합니다. 또한, 융합보안리빙랩이 국내 보안 생태계 발전과 핵심 서비스의 안전성 확보에 기여하는 바를 종합적으로 다루어, 정책 수립 및 산업계 활용에 중요한 참고 자료가 됩니다. 이를 통해 관련 분야 연구자 및 실무자들이 융합보안리빙랩의 실제 운영 현황과 발전 방향을 명확히 이해할 수 있도록 지원합니다.
