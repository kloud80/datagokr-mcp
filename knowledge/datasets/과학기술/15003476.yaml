summary_user: 한국방송광고진흥공사에 대행 등록을 한 광고회사를 업체별 1행으로 담은 전국 원장 파일로, 검증 시 1,475행이 수신됐고 순번·광고회사·주소·전화번호 4개 항목으로 구성된다. 광고 제작·집행을 맡길 기관과 기업이 지역별로 등록 광고회사를 찾아 연락처를 확인하거나, 연구자가 지역별 광고회사 수를 세는 데 쓴다. 주소(address)를 조인 키로 삼아 상권·기업 데이터와 이어 쓰며, 사업자번호 필드는 없다.
description_portal: '- 한국방송광고진흥공사에 대행 등록을 한 광고회사 현황 데이터 정보를 제공합니다.- 개방 데이터는 순번, 광고회사, 주소, 전화번호 총 4가지 항목으로 구성되어 있습니다.- 광고제작 및 집행을 희망하는 기관 및 기업에서 지역별 광고회사 현황을 파악하고, 컨택하는데 활용할 수 있습니다. 학계 및 연구기관에서는 지역별 광고회사 갯수 등을 분석하거나 통계에 활용하는 기초자료로 사용할 수 있습니다.- 광고회사 유선전화가 없고 휴대전화(010-****-****)로 대표전화가 등록된 경우는 개인정보보호에 따라 전화번호 등록 제외했습니다.'
