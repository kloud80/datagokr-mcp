description_portal: 2022년도 말 기준으로 우체국 소포(택배) 상자 규격별(1호, 2호, 3호, 4호, 5호,) 우체국 판매 현황 데이터 입니다.본 자료는 2022년 한 해 동안 우체국을 통해 접수된 표준 소포상자 규격별 이용 물량을 집계한 통계이다. 가장 많이 사용된 규격은 1호 상자(220×190×90mm)로 총 4,418,576건이 접수되었으며, 그 외에도 3호(약 3,631천 건), 5호(약 3,586천 건) 등 중·대형 규격도 고르게 사용되었다. 이러한 데이터는 포장재 공급 계획, 물류자동화 설비 설계, 소형화 추세 대응 등 우정물류 시스템의 효율화 및 정책 기획에 중요한 근거자료로 활용된다.
