description_portal: 연도별(2012년~2024년) 우정사업본부의 우편물 운송차량데이터로 차량과 이륜차의 대수 항목을 제공합니다.우정사업본부의 2012년부터 2019년까지의 우체국 운송용 차량 보유 현황 데이터로 전체적인 차량 대수는 증가하는 추세를 보입니다. 자동차는 2012년 3,847대에서 2019년 5,503대로 매년 꾸준히 증가하여, 7년 동안 약 43%의 높은 증가율을 기록했습니다. 같은 기간 자동이륜차는 14,228대에서 14,967대로 소폭 증가했으나, 2018년 15,027대를 정점으로 소폭 감소하는 등 연도별로 증감을 반복하는 모습을 보였습니다.
