description_portal: '□ 개요본 데이터셋은 국립과천과학관에서 개최된 SF(Science Fiction) 관련 행사 게시판의 게시글 현황을 정리한 자료입니다. 과거에 진행된 SF 축제 및 이벤트와 관련된 정보를 체계적으로 제공하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 게시글 제목과 내용을 통해 역대 SF 행사의 주요 프로그램, 주제, 이슈 등을 파악할 수 있습니다. 둘째, 등록 및 수정 일시 정보를 바탕으로 행사의 홍보 시점과 정보 업데이트 주기를 분석할 수 있습니다. 셋째, 과거 행사 기록을 보존하고 향후 유사한 과학 문화 행사 기획 시 참고 자료(레퍼런스)로 활용 가능합니다.□ 데이터 구조· 제목 : 게시글의 제목 또는 행사 관련 주제명 (String)· 내용 : 행사에 대한 상세 설명, 보도자료, 현장 스케치 등 본문 내용 (String)· 등록일시 : 게시글이 최초로 등록된 날짜와 시간 (String, YYYY-MM-DD HH:MM:SS)· 수정일시 : 게시글 정보가 마지막으로 수정된 날짜와 시간 (String, YYYY-MM-DD HH:MM:SS)'
