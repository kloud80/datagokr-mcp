description_portal: 한국도로교통공단이 보유한 TBN 한국교통방송의 모바일 서비스 이용 현황을 정리한 통계 데이터이다. 2015년부터 2019년까지의 월별 이용자 수와 연간 합계를 제공하며, 교통정보 서비스의 수요 변동과 추세 파악에 활용할 수 있다. CSV 등 기계판독 가능한 형식으로 제공되며, 각 기록은 연도와 1월~12월 이용자 수, 연간 합계를 포함한다. 지역 기반 교통전문 라디오의 모바일 접근 규모를 비교할 수 있어 편성 기획, 서비스 품질 점검, 홍보 효과 측정, 정책 연구의 기초 자료로 유용하다. 조사 시점과 운영 환경 변화에 따라 수치 차이가 있을 수 있으므로, 분석·재가공 시 메타데이터를 확인하고 출처를 표기한다.
