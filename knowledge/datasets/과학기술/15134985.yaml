summary_user: 2단계 BK21 사업에 참여한 기관을 기관 단위로 담은 목록 파일로, 기관코드·기관명·데이터 갱신일자 세 항목으로 이뤄져 있고 범위는 전국이다. 대학 관계자나 정책 분석가가 "우리 대학이나 특정 기관이 2단계 BK21 사업에 참여했는가"를 확인할 때 쓴다. 실측 조인 키인 기관코드(bk21_inst_cd)로 같은 코드를 쓰는 BK21 관련 다른 데이터와 이어 쓴다.
description_portal: 2단계 BK21 사업에 참여한 기관의 정보를 제공하는 데이터로, 각 기관의 고유 코드를 비롯한 명칭, 데이터 갱신일자 등의 상세 항목으로 구성되어 있습니다. 이 자료는 연구자, 정책 입안자, 대학 관계자 등이 사업 참여 현황을 한눈에 파악하고 비교 분석하는 데 매우 유용합니다. 특히 기관별 연구와 교육 역량을 심층적으로 분석하고, 사업 참여 이력을 체계적으로 관리하며, 향후 정책을 수립하는 데 중요한 기반이 됩니다. 또한 기관별 참여 동향과 사업의 확산 현황을 파악하여 관련 분야의 발전 방향을 모색하는 데도 활용 가치가 높습니다.
