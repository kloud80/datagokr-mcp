summary_user: 전국 27개 지역지식재산센터의 센터명·운영기관·전화번호·우편번호·주소를 센터 1곳당 1행으로 담은 소규모 목록 파일(csv, 약 3KB)이다. 중소기업·스타트업·예비창업자가 출원비용이나 브랜드·디자인 개발 지원을 받으려 할 때 "우리 지역에서 가까운 지식재산센터는 어디이고 연락처는 무엇인가"를 찾는 데 쓴다. 공통 조인 키는 없어 다른 데이터와는 주소나 운영기관 이름을 맞춰 연결해야 하며, 주소를 좌표로 바꾸면 지역별 기업 분포 데이터와 겹쳐 볼 수 있다.
description_portal: 1. 개요출원지원사업, 브랜드 및 디자인 개발지원 사업, 출원비용 등을 지원하는 전국 지역지식재산센터 현황 정보를 제공합니다.특허청 지역지식재산센터는 특허청이 전국 단위로 운영하는 지역 기반 지식재산 지원 거점으로서,  중소기업, 스타트업, 예비창업자 등이 지식재산을 효과적으로 확보·활용할 수 있도록 지원하기 위해 특허청이 운영하고 있습니다.2. 세부 정보 내용전국적으로 분포되어 있는 27개 지역지식재산센터 위치, 연락처 정보3. 데이터 출처지역지식재산센터 홈페이지http://ripc.org
