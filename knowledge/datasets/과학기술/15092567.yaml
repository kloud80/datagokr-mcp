description_portal: '한국인터넷진흥원 대표홈페이지 데이터베이스에 저장된 설문조사페이지 정보는 설문조사의 구성과 관리에 필요한 다양한 항목들로 구성되어 있습니다. ‘설문조사번호’는 개별 설문조사를 식별하는 고유 번호이며, ‘파트번호’와 ‘파트명’은 설문 내 여러 구간(파트)을 구분하고 명명하는 데 사용됩니다. ‘최종문항번호’는 해당 파트 내 마지막 문항의 번호를 나타내어 설문 흐름을 관리하는 데 도움을 줍니다. ‘자바스크립트링크’, ‘HTML링크’, ‘점수로직링크’는 설문 페이지의 동작과 화면 구성, 점수 산출 로직을 연결하는 웹 리소스 경로를 의미합니다. ‘등록일’과 ‘수정일’은 각각 설문 페이지가 처음 등록된 날짜와 마지막으로 수정된 날짜를 기록하며, ‘삭제여부’는 해당 설문 페이지가 현재 활성화 상태인지 여부를 나타냅니다. 이 컬럼들을 통해 설문조사의 체계적인 구축과 유지 관리가 가능하며, 동적인 웹 설문 기능 구현에 필수적인 정보를 제공합니다.- 컬럼명 :  설문조사번호, 파트번호, 파트명, 최종문항번호, 자바스크립트링크, HTML링크 , 점수로직링크, 등록일, 수정일, 삭제여부'
