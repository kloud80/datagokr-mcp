summary_user: 산림청 산림과학기술정보서비스(FTIS)에 등록된 다년차 연구과제 중 외부 기관·연구진에 위탁된 과제를 건별로 담은 파일로, 과제명·연구책임자명·등록일·FTIS 과제번호를 담는다(csv 약 7KB 규모의 소량 자료). 산림 분야 연구자나 정책 담당자가 특정 산림 연구과제가 어떤 위탁과제로 나뉘어 누구에게 맡겨졌는지 확인하는 데 쓴다. FTIS 과제번호(ftis_task_no)를 키로 산림청의 다른 FTIS 연구과제·참여연구기관 협약정보와 이어 쓴다.
description_portal: 산림과학기술정보서비스(FTIS) 시스템의 위탁과제 데이터는 특정 기관이나 연구자가 주관하는 과제 수행 과정에서 외부 전문기관이나 연구진에게 위탁된 연구 성과를 체계적으로 관리하기 위해 제공되는 자료입니다. 이 데이터에는 위탁과제명, 연구책임자, 과제번호 등 기본적인 과제 정보가 포함되어 있으며, 연구의 추진 주체와 협력 구조를 명확히 파악할 수 있도록 지원합니다. 연구자는 이를 통해 위탁과제의 성격과 연구 범위를 확인할 수 있고, 기관 및 정책 담당자는 과제별 협력 현황을 분석하여 연구 지원과 관리에 활용할 수 있습니다. 또한 학계와 산업계에서는 관련 데이터를 기반으로 연구 동향과 협력 기회를 모색할 수 있어 산림과학기술의 발전과 연구 성과 확산에 중요한 역할을 합니다.
