description_portal: '한국지능정보사회진흥원(NIA)이 운영하는 스마트쉼센터에서 제공하는 예방교육 자료 목록으로, 디지털 과의존 예방 및 해소를 위한 교육 콘텐츠를 포함합니다. 각 자료는 교육 제목, 대상(예: 아동·청소년, 학부모, 일반인 등), 활용 용도(예: 강의, 상담, 자가학습 등), 조회수, 파일 형식(PDF, PPT 등), 자료 링크 등의 정보를 제공합니다. 이 데이터는 대상별 맞춤형 교육 자료를 효율적으로 찾고 활용할 수 있도록 구성되어 있으며, 디지털 역기능 대응을 위한 공공 교육 콘텐츠 아카이브로 활용 가치가 높습니다. 예방교육, 홍보자료, 상담안내 등 다양한 형식의 콘텐츠를 집약한 자료입니다.'
