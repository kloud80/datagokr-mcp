description_portal: '본 데이터는 한국방송통신전파진흥원에서 수행하는 전자파안전강도 측정시스템 내 영문 용어 모음 현황으로, 국민이 전자파와 관련된 과학적·기술적 개념을 이해할 수 있도록 주요 용어의 정의와 설명을 체계적으로 정리한 자료입니다. 전자파 안전과 관련된 주요 용어에 대한 정의와 설명을 수록하여, 일반 국민 및 연구자가 전자파 안전정보를 쉽게 이해하도록 구성하였습니다. 자료 구성은 각 용어별로 표준화된 정의, 간단한 설명, 출처 등이 포함됩니다. 본 데이터에는 전자파, 전자기장, 전자파 노출, 인체보호기준, 주파수, 전계강도 등 전자파 안전과 관련된 용어가 포함되어 있으며, 각 용어는 국내외 표준 및 관계 법령에 근거하여 정확한 의미를 제시합니다. 이용자는 이를 통해 전자파 안전관리의 기본 개념을 학습하고 연구 및 정책 수립 시 기초자료로 활용할 수 있습니다. 이를통해 현장 실무자, 연구기관, 일반 국민 모두가 동일한 기준으로 정보를 이해하고 소통할 수 있도록 구성되었습니다.본 데이터는 전자파 안전에 대한 국민 인식 제고와 정책 투명성 강화를 목적으로  제공됩니다.기준일 : 2023-07-25'
