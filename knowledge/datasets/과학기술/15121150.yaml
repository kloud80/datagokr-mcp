description_portal: 지능정보화 사회의 도래에 따라 수학, 과학 교육 분야에서도 첨단 과학기술을 활용한 탐구·체험 중심의 활동이 중요해지고 있습니다. 이에 각 지역 거점기관에 학생들이 첨단 장비와 다양한 프로그램을 통해 교과서 지식을 넘어 창의적 문제 해결 역량을 기를 수 있는 "스마트 수과학실"을 구축하고, 관련 정보를 제공하여 미래 과학기술 인재 양성의 기반을 마련하고자 합니다.개방 데이터는 전국 총 8개의 스마트 수과학실 현황을 포함하고 있습니다. 지역별로는 수도권 3개, 충청·강원권 2개, 경상권 2개, 전라·제주권 1개가 분포해 있으며, 운영기관은 **대학(5개)**이 주를 이루고 있습니다. 각 기관은 메타버스 스튜디오, 스마트랩 등의 특성화 공간과 VR 기기, 360도 카메라, 드론, 3D 모델링 장비 등 첨단 장비를 보유하고 있으며, 이를 활용한 AI 탐구, 코딩, 증강현실, 메타버스 구축 등 다채로운 융합 교육 프로그램을 운영하고 있습니다.학생 및 학부모는 거주 지역 인근의 스마트 수과학실을 찾아 첨단 과학·수학 프로그램을 체험하고 진로를 탐색하는 기회로 활용할 수 있습니다. 일선 교사 및 학교는 교과과정과 연계한 체험학습, 심화 탐구 활동의 장으로 활용하여 학생들에게 풍부한 교육 경험을 제공할 수 있습니다. 또한, 교육 정책 기관은 지역별 과학 교육 인프라 현황을 파악하고 균형 있는 교육 발전을 위한 정책 수립의 기초자료로 활용할 수 있습니다.
