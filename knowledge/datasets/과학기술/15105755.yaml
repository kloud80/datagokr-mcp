description_portal: 과학기술정보통신부가 실시하는 통신서비스 품질평가의 통신서비스 품질평가 결과보고서 내 권역별 5G 전송속도 측정 결과 데이터입니다. 전국 85개시 430개 지역을 대상으로 17개 시도별 5G 네트워크 품질을 종합적으로 평가한 통계자료를 제공합니다. 데이터는 구분(지역), 통신사, 다운로드(Mbps), 업로드(Mbps)의 4개 항목으로 구성되어 있으며, 서울특별시, 6개 광역시(부산, 대구, 인천, 광주, 대전, 울산), 세종자치시, 9개 도(경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)별로 SKT, KT, LGU+ 3개 이동통신사의 5G 전송속도를 상세하게 비교할 수 있습니다. 이 데이터는 지역별 5G 인프라 격차 분석, 통신사별 지역 서비스 품질 비교, 지역 통신 정책 수립, 기업의 지역별 네트워크 투자 전략, 소비자의 지역별 통신사 선택 참고자료 등에 활용될 수 있으며, 우리나라 전국 5G 네트워크 품질의 지역별 현황을 객관적으로 파악할 수 있는 자료입니다.
