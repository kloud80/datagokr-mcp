summary_user: 우체국 창구에서 접수된 국내 등기 소포를 건별로 담으며, 접수일자·접수시간, 발송인·수취인 주소와 우편번호, 우편물 내용·중량·부피, 송달속도 구분, 접수·배달 우체국 구분과 배달일자를 기록한다. 물류·상권 분석가가 "어느 지역에서 어느 지역으로 소포가 많이 오가고, 접수부터 배달까지 며칠 걸리는가"를 따질 때 쓴다. 전역 조인 키는 없고, 발송인·수취인 우편번호(sndrZip, addrseZip)나 주소 문자열을 통해 우편번호·행정구역 자료와 맞대어 쓰는 방식으로만 연결된다.
description_portal: 국내 등기 소포의 접수 및 배송 데이터를 제공하며 접수처 기준 접수시각, 소송인/발송인 주소 정보, 우편물내역, 우편물의 무게/부피 내용을 제공하며 배달결과 기준 집배국 정보 및 배달일자 정보를 제공
team:
