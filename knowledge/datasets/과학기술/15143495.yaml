description_portal: 여성과학기술인들에 대한 우리 사회의 긍정적인 인식과 대국민 지지를 확보하고, 많은 여학생들이 이공계에 대한 관심 고취와 해당 분야 진출을 유도하기 위하여 대한민국 여성과학기술인 롤모델을 발굴하여 우수 성과와 발자취를 소개하는 She Did it 캠페인 정보에 대한 데이터입니다. 해당 데이터에는 번호, 작성일시, 대상자 성명, 소속 및 직업, 과학기술분야 업적, 세부적인 스토리를 설명하는 연결 링크 등의 데이터가 포함되어 있습니다. 해당 데이터를 통하여 이공계에 진학하려는 여학생들에게 도움이 되고 더 나아가 국가 과학기술발전에 이바지하길 바라며, 세부적인 내용은 해당 데이터의 링크를 통해 확인하시기 바랍니다.
