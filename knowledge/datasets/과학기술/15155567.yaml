description_portal: '□ 개요본 데이터셋은 국립과천과학관이 국내·외 과학관과 교류 및 협력을 위해 전시물품을 반출·입한 현황을 체계적으로 정리한 자료입니다. 반출·입 요청 기관, 관련 근거 등의 정보를 포함하고 있어 국내·외 과학관과의 교류 및 협력 현황을 확인하는 데 활용될 수 있습니다. 주된 활용 목적은 다음과 같습니다. 첫째, 전시품의 이동 경로와 대여 현황을 파악하여 자산 관리의 투명성과 효율성을 높일 수 있습니다. 둘째, 타 기관과의 협력 전시 및 공동 사업 실적을 분석하고 향후 교류 전략 수립에 활용할 수 있습니다. 셋째, 전시품 공유를 통한 과학 문화 확산 활동의 성과를 측정하고 기관 간 네트워크 강화의 근거 자료로 활용 가능합니다.□ 데이터 구조· 반출번호 : 반출 건에 대한 고유 식별 번호 (Integer)· 반출명칭 : 반출되는 전시나 사업의 공식 명칭 (String)· 반출일자 : 물품이 반출된 날짜 (String, YYYY-MM-DD)· 반출장소 : 물품이 이동하는 대상 기관 또는 장소명 (String)· 반입예정일자 : 물품이 다시 반입될 예정인 날짜 (String, YYYY-MM-DD)· 자산번호 : 개별 물품의 자산 관리 번호 (Integer)· 반출문서번호 : 반출 승인 관련 행정 공문서 번호 (String)· 반출문서건명 : 반출 승인 공문서의 제목 (String)'
