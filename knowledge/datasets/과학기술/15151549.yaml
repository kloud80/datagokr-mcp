description_portal: 이 데이터는 기초과학연구원 내 각 부서와 연구단에서 비대면 회의, 교육, 세미나, 연구발표 등을 효율적으로 운영하기 위해 사용한 화상회의 및 방송장비의 대여 이력을 체계적으로 관리하기 위한 자료이다. 주요 항목은 사용일자, 사용위치, 대여수량, 장비코드, 등록일, 수정일로 구성되어 있으며, 이를 통해 장비별 이용 현황을 분석하거나 기간·장소별 수요 변동 추이를 파악할 수 있다. 또한 등록일과 수정일을 통해 데이터의 최신성을 유지함으로써 장비 관리의 효율성과 행정 운영의 투명성을 높인다. 본 데이터는 연구행정의 디지털 전환과 공공데이터 기반 서비스 개선에 기여하는 핵심 자료이다.
