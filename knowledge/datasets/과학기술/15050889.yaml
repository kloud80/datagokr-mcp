description_portal: '농림수산식품교육문화정보원_영농기반 정보는 농업과 관련된 다양한 영농기반 정보를 제공하는 데이터입니다. 특히, 농업은 국가의 기초 산업 중 하나로, 이를 위해 적절한 영농기반 정보는 농어민의 소득 증대와 생산성 향상에 큰 기여를 할 수 있습니다. 이 데이터는 농업에 종사하는 분들 및 관련 연구자들이 필요한 정보를 쉽게 접근할 수 있도록 지원하며, 정부의 영농 지원 정책과 관련된 내용을 포함하고 있습니다. 농어민 및 교육기관 등에서 이 데이터를 활용하여 정책 기초 자료로 또는 영농 기술 개발에 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 카테고리(문자형) : 농림일반 > 영농기반 범주에 속하는 정보의 분류명, 제목(문자형) : 각 데이터 항목의 제목, 요약글(문자형) : 데이터 항목에 대한 간략한 설명, 서브제목1~5(문자형) : 관련된 상세 내용을 구분하여 제시하는 항목들, 서브내용1~5(문자형) : 서브제목에 대한 구체적인 설명을 제공하는 내용, 등록일(날짜형) : 데이터가 등록된 날짜를 나타내는 항목으로 구성되어 있습니다.'
