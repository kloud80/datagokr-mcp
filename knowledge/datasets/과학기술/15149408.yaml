description_portal: 국토교통과학기술진흥원에서 제공하는 연도별 연구수행 실적 데이터는 연구자가 수행한 과제의 주요 정보를 체계적으로 기록한 자료다. 이 데이터는 성명, 시작년도, 종료년도, 연구수행실적 용도 항목으로 구성되어 있으며, 개인정보 보호를 위해 연구자의 성명은 비식별 처리되어 제공된다. 시작년도와 종료년도는 해당 연구과제가 진행된 기간을 나타내어 연구 활동의 시기적 흐름을 파악할 수 있게 하며, 연구수행실적 용도는 등록 신청의 목적이나 활용 분야를 보여준다. 이를 통해 특정 시점에 어떤 연구들이 수행되었는지, 연구 성과가 어떤 목적으로 활용되었는지를 확인할 수 있어 정책 수립, 연구 동향 분석, 연구 성과 평가 등에 활용 가능하다. 특히 비식별 처리된 데이터는 개인정보 노출 우려 없이 공익적 연구와 행정적 활용에 기여할 수 있다는 점에서 가치가 크다.
