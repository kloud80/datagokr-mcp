description_portal: 개도국 정보통신방송전문가 초청연수 정보시스템(klink.or.kr) 내 정보는 연수 신청자 및 연수 대상자, 과정 게시 공고, 교육자료, QnA, 연수 신청 국가 통계 등입니다. 해외에서 접근하는 사용자가 많은 상황을 고려하여 사용자 중심의 편이성을 제고하고, 웹 접근성 향상을 목표로 하고 있습니다. 또한 개인 정보를 기입하는 만큼 사업관련 정보의 체계적 관리 및 안정적 웹사이트 운영을 수행하고자 합니다.- 이 중 개방 데이터는 VOD 서비스이며, 이는 klink 접속자에게 정보통신 관련 전문 강의를 제공하여 사전 지식 습득 및 한국의 정보통신기술에 대한 이해를 돕습니다.- 또한 정보통신산업진흥원에서 진행되는 사업에 대한 개발도상국의 관심도를 향상시킬 수 있습니다.추후 사용자의 수요조사 및 사용 통계 정보를 취합하여 개방 데이터의 변경 혹은 목록 증가 등을 수행하고자 합니다.
