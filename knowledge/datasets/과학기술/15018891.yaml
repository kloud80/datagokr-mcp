description_portal: 한국전기연구원에서 보유하고 있는 연구시설장비의 주요 정보를 제공하는 데이터입니다. 본 데이터는 연구시설장비를 효율적으로 관리하고 공동활용을 촉진하기 위해 구축되었으며, 장비의 식별정보, 제조정보, 활용정보 등 장비 운영 전반에 대한 다양한 속성 정보를 포함하고 있습니다.데이터는 장비별 기본정보(한글장비명, 영문장비명, 모델명 등)와 함께 제작사 및 제작국가 등 제조 관련 정보, 활용범위 및 공동활용 허용범위 등 장비 활용성과 관련된 정보로 구성되어 있습니다. 또한 연구시설장비 표준분류체계코드를 통해 장비의 분야별 분류가 가능하며, 설치장소, 장비설명, 구성 및 성능 정보를 통해 장비의 물리적 위치 및 기술적 특성을 확인할 수 있습니다.본 데이터는 연구개발 활동 지원, 연구시설장비 공동활용, 기술 분석 및 정책 수립 등을 위한 기초자료로 활용될 수 있으며, 기관 내·외부 연구자, 산업체 및 관련 기관에서 장비 현황을 파악하고 활용하는 데 목적이 있습니다.※ 활용범위 및 공동활용 허용범위 정보는 일부 장비의 경우 내부 운영 정책에 따라 기본값으로 제공될 수 있습니다.  ※ 장비설명 및 구성·성능 정보에는 개행문자 또는 특수문자가 포함될 수 있어, 데이터 활용 시 전처리가 필요할 수 있습니다.  ※ 연구시설장비 표준분류체계코드는 별도의 분류 기준에 따라 관리되며, 세부 코드 체계는 관련 기준 문서를 참고하시기 바랍니다.  파일 내 항목별 상세 설명 및 코드 정의는 별도로 제공되는 데이터 설명서(또는 사용자 매뉴얼)를 참고하시기 바랍니다.  데이터 건수가 많을 수 있으므로 엑셀 등의 일반 프로그램에서는 일부 데이터가 정상적으로 표시되지 않을 수 있으며, 원활한 분석을 위해 데이터 분석 전용 도구의 사용을 권장합니다.
