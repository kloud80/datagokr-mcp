description_portal: '서울특별시민의 인스턴스 메신저 이용률 및 인스턴트메신저 이용기능에 대한 통계자료입니다.  * 문 : 인스턴드 메신저에 접속할때 이용하는 기기는 무엇입니까?(2016년이전) * 문 : 인스턴드 메신저 이용시 어떤 기능을 이용하고 계십니까? 이용해보신 기능을 모두 선택해 주십시오(2017년이후)  * 복수응답은 한 개 이상(1-3순위 또는 모두 선택)을 응답한 결과치를 집계한 결과임 * 2017년부터 조사문항에서 "인스턴트메신저 이용기기"가 제외되어 "인스턴트메신저 이용기능" 항목으로 대체 * 이용률 : 만6세이상 인터넷 이용자 중 최근 1년이내 인스턴트 메신저를 이용한자의 비율 * 인스턴트 메신저 : 컴퓨터, 스마트폰 등으로 온라인 상에서 개인 간 실시간으로 메시지, 사진 등의 데이터를 주고받을 수 있는 서비스로 카카오톡, 라인, 네이트온UC, 페이스북 메신저 등을 포함함 ○ 출 처 : 미래창조과학부, 한국인터넷진흥원 「인터넷이용실태조사」'
