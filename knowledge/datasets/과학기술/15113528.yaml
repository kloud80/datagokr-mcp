description_portal: 'ㅇ 공공데이터용 과학기술정보통신부 중앙전파관리소 월말 기준 아마추어무선국 관리관서별 허가현황  -  매월  말 기준 신규  및 폐지에 따른 아마추어 무선국수의 경감을 전파방송통신시스템(K-RABI) 통계자료를 추출 및 가공하여 업로드 * 관리관서 : 서울전파관리소, 부산전파관리소, 광주전파관리소, 강릉전파관리소, 대전전파관리소, 대구전파관리소, 전주전파관리소, 제주전파관리소, 청주전파관리소, 울산전파관리소ㅇ 아마추어 무선국 설명   - 아마추어 업무: 금전상의 이익을 목적으로 하지 아니하고 개인적인 무선기술의 흥미에 따라 하는 자기훈련과 기술연구 목적의 통신업무(전파법 시행령 제28조)   - 아마추어무선국 : 개인적인 무선기술에의 흥미에 따라 자기훈련과 기술연구에 전용하는 무선국(전파법 시행령 제29조)'
