summary_user: 중앙부처·광역·기초자치단체·공공기관과 관련기관의 누리집을 사이트 한 건 단위로 담은 전국 목록으로, 기관유형·기관분류·상세분류·사이트명·웹/모바일 구분·사이트 주소(URL)를 포함하며 CSV 파일(약 45KB)로 받는다. 국민이나 분석가가 '특정 기관의 공식 누리집 주소가 무엇인가', '기관 분류별로 운영 중인 웹·모바일 사이트가 몇 개인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명 문자열 매칭으로만 이어 쓰며, 사이트 주소(URL)는 연계 키로 쓰지 않는다.
description_portal: 공공기관의 웹 사이트 자료로 공공기관의 분류, 기관명, 사이트명, 웹/모바일구분, 사이트URL 등의 정보를 제공합니다.- 중앙부처, 광역자치단체, 기초자치단체, 공공기관의 관련기관의 누리집이 사이트 URL과 기본적인 기관의 소개를 포함하고 있습니다.- 누리집에 소개되는 자료는 행정안전부에서 각 기관에 매 분기별로 공문으로 자료 수정을 요청하여 제공 받은 자료를 수정하여 게시하고 있습니다.- 각 기관의 누리집 사이트 ULR을 매주 점검을 통하여 이상 유무를 확인하고 폐쇄된 사이트 URL을 정비하고 있습니다.
