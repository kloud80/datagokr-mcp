description_portal: '2015~2017년 만료예정인 물질특허를 대상으로 특허정보, 존속기간만료일, 제품정보 등을 분석, 중소기업을 위한 서비스 창출방안 연구정보 등 제공만료예정인 물질특허를 대상으로 함. 만료될 예정 특허들을 분석해서, 특허정보(출원자, 권리자, 특허기술 내용 등), 존속기간 만료일, 관련 제품 정보 등을 조사함. 목적: 중소기업 등 민간 수요자(사용자)들이 활용할 수 있는 “맞춤형 IP 서비스”를 창출하기 위한 기초자료 제공. 만료가 다가오는 특허는 기술 사용자에게 자유롭게 이용 가능해질 수 있으므로, 민간 수요자에게 기회가 됨.'
