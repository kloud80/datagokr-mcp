description_portal: '- 한국방송광고진흥공사에서 주관한 공익광고 콘텐츠가 국내외 광고제 등에서 수상한 실적 현황에 대한 데이터를 제공합니다. - 1991년도 이후 부터 최근 수상내역을 공개하고 있습니다.- 개방 데이터는 수상연도, 광고제명(시상주체), 작품명, 제작사, 수상내용 총 5개 항목으로 구성되어 있습니다.- 주요 광고제는 칸느광고제, 뉴욕페스티벌, 대한민국광고대상, 방송광고대상, 소비자가 뽑은 좋은 광고상, TVCF AWARD, 서울영상광고제 등이 있습니다.- 공익광고 관련 광고제 수상내역 및 작품, 제작사 내역 확인이 필요한 경우 활용할 수 있습니다.'
