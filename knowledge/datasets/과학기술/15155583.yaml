description_portal: '□ 개요본 데이터셋은 국립과천과학관 전시관에 전시된 전시물의 운영 현황을 집계한 통계 자료입니다. 전시 중인 전체 전시물 수량과 정상 작동 중인 전시물 수량 정보를 포함하고 있어, 과거의 일자별(월별) 전시물 가동률 및 고장 추이를 파악하기 위해 구축되었습니다. 주된 활용 목적은 다음과 같습니다. 첫째, 시기별 작동 전시물 비율(가동률)을 분석하여 전시 운영의 효율성과 안정성을 측정할 수 있습니다. 둘째, 특정 시기의 고장 증가 추이를 분석하여 선제적인 유지보수 계획을 수립하고 적정 관리 예산을 산출하는 근거 자료로 활용됩니다. 셋째, 장기적인 전시물 운영 데이터 관리를 통해 관람객에게 쾌적한 전시 환경을 제공하기 위한 성과 지표로 활용 가능합니다.□ 데이터 구조· 전시품수 : 과학관 내에 설치되어 전시 중인 전체 전시물의 총 개수 (Integer)· 작동전시품수 : 전체 전시물 중 고장 없이 정상적으로 작동하고 있는 전시물의 개수 (Integer)· 등록일 : 해당 통계 데이터가 시스템에 등록된 실제 날짜 (String, YYYY-MM-DD)· 기준일 : 통계 집계의 기준이 되는 날짜 (String, YYYY-MM-DD)'
