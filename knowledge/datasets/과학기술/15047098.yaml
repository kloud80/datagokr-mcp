description_portal: '○ 통계개요* 통계명 : SNS 이용 이유* 통계종류 : 지정통계, 승인번호(12005)* 근거법령 : 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제52조* 작성목적 : 급속히 변화하는 국내가구의 인터넷 이용환경 및 국민의 인터넷 이용현황과이용행태 등을 파악하여 관련 정책수립과 연구활동 등 다양한 영역에서 활용할 수 있도록 기초자료 및 정보 제공을 목적으로 함* 조사체계 : 조사원→전담조사기관→한국인터넷진흥원→미래창조과학부* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - SNS를 이용하는 이유의 비율○ 용어설명* 이용률 : 만6세 이상 인터넷 이용자 중 최근 1년 이내 SNS를 이용한 자의 비율* SNS(소셜 네트워킹 서비스)：인터넷상에서 친구, 동료 등 지인과의 인간관계를 강화하거나 새로운 인맥을 형성함으로써 폭넓은 인적 네트워크를 형성할 수 있게해주는 서비스로 미니홈피, 블로그, 마이크로블로그, 프로필 기반 서비스,커뮤니티 등 포함○ 기타* 문 : SNS(소셜 네트워크 서비스) 를 이용하는 이유는 무엇입니까?3가지를 선택하여 기재해 주십시오.* 복수응답은 한 개 이상(1-3순위 또는 모두 선택)을 응답한 결과치를 집계한 결과임○ 출 처 : 미래창조과학부, 한국인터넷진흥원 「인터넷이용실태조사」'
