description_portal: '국립과천과학관에서 실시된 공연에 대한 정보입니다. 해당 데이터가 포함하는 컬럼은 다음과 같습니다.컬럼명: 공연년도, 공연명, 대상, 공연 시작일, 공연 종료일, 공연내용국립과천과학관의 공연정보 데이터는 주로 어린이와 가족을 대상으로 어울림홀에서 개최되는 과학 교육 뮤지컬로 구성되어 있습니다. 공연은 에너지, 환경, 우주, 수사기법 등 다양한 과학 주제를 흥미로운 이야기와 체험 요소를 통해 전달합니다. 상상력을 자극하는 창의적 콘텐츠로 구성되어 있으며, 교육적 효과와 함께 즐거운 문화 경험을 제공합니다.'
