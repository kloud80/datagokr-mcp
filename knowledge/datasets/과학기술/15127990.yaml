description_portal: '한국데이터산업진흥원 데이터 바우처 지원사업 연도별 참여기업 수 현황자료입니다. 이 자료에는 공급기업과 수요기업으로 세분화된 참여기업의 수치가 포함되어 있습니다. 공급기업은 다시 가공기업과 판매기업으로 구분되며, 각각의 기업 유형에 따른 데이터를 제공합니다. 이 데이터는 정부의 데이터 기반 경제 활성화 정책의 일환으로, 기업들이 데이터를 활용하여 경쟁력을 높일 수 있도록 지원하기 위한 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.연도(숫자형): 데이터가 기록된 연도수요기업(숫자형): 데이터 바우처를 수혜받는 수요기업의 수공급기업-판매(숫자형): 데이터 서비스나 제품을 제공하는 판매기업의 수공급기업-가공(숫자형): 데이터 서비스를 가공하여 제공하는 가공기업의 수'
