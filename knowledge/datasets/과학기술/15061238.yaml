description_portal: 서울시 강북구 스마트보안등(IoT) 측정정보는 강북구 관내 스마트보안등의 운영 상태와 에너지 사용 현황, 고장 여부를 종합적으로 관리하기 위한 공공 데이터입니다. 기관 명, 송신 서버 번호, 데이터 번호를 통해 각 측정 정보를 구분하며, 모델명, 시리얼, 접속간격, 수동유지, 지역ID 등으로 장비 특성과 설치 위치를 체계적으로 관리할 수 있습니다. 점등편차, 소등편차, 심야소등 시작과 해제 시각, 심야소등 적용기간을 통해 시간대별 조명 제어 정책을 설계할 수 있으며, 디밍시, 디밍분, 디밍값과 현재디밍값, 현재전력값 정보는 에너지 절감과 조도 관리에 활용됩니다. 또한 램프고장, 이상점등, 누전발생, 안정기고장, 깜빡거림, 점소등상태, 수동·강제상태 등 고장 및 이상 여부를 수치로 제공해 실시간 모니터링과 신속한 유지보수를 지원하며, 등록일자를 통해 이력 관리와 장기적인 통계 분석이 가능합니다.
