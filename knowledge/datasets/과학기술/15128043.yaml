description_portal: '국내OTT 사업자의 성공적 해외 진출을 위하여 해외 진출 대상 국가의 현지 소비자를 대상으로 해외 OTT 이용행태를 조사, 분석한 설문조사 자료로 개인정보를 제외한 원시데이터(rawdata).해외 OTT 이용행태조사는 국내 OTT사업자의 진출이 가능할 것으로 보이는 국가를 선정하여 이용자들의 미디어 기기 및 K-콘텐츠 이용 빈도, 사용 요금제, K-OTT 플랫폼 이용 의향과 선호도 등 현지 이용자 특성을 조사함. 조사대상국의 성별/연령별 인구 분포를 OTT 이용자 특성에 따라 비례하여 배분하는 인구통계학적 조사기법을 사용하여 추출한 각국의 1600여명 이상이 설문조사에 참여함.(코드 추가설명 )1. m:복수응답(멀티선택)   : 예를 들어, SQ7은 "최근 1년 동안 이용한 콘텐츠를 모두 선택"하는 문항입니다.총 8개의 보기로 구성되며, 응답자는 1개부터 8개의 응답지를 선택할 수 있습니다. 2. n: 하위문항   : 예를 들어, C9는 6개의 하위 문항으로 구성되어 있습니다. 각각의 하위 문항에 대한 응답이 개별 변수로 입력되어야 하기 때문에, 구분을 위해 n2~n6을 추가한 것입니다. 3. r: 로테이션   : B2, B3, B4는 B1 응답 각각에 대해 로테이션으로 제시하며 질문합니다. 로테이션 방식의 질문은 "해당 문항에서 어떠한 대상에 대하여 질문했는지"와 "어떤 응답을 하였는지"를 매칭하여 입력하도록 되어 있습니다.'
