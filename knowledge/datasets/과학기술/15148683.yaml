description_portal: '한국데이터산업진흥원 데이터바우처 사업에 참여하는 수요 및 공급기업의 평가지표에 대한 자료를 제공하고 있습니다.이 데이터는 사업에 참여하는 다양한 수요 및 공급기업의 평가지표구분과 평가지표명에 대한 정보를 포함하고 있습니다.데이터바우처 사업은 데이터 상품·활용서비스 등 바우처 지원을 통해 데이터 수요·공급의 생태계를 조성하고 전 산업의 디지털 전환 및 데이터 활용 활성화 견인을 하는데 크게 기여하고 있습니다. 이러한 자료는 데이터 산업 생태계 조성에 필요한 기초 자료로 활용될 수 있습니다.데이터는 다음과 같은 구조로 이루어져 있습니다.평가지표구분코드(문자형) : 평가지표를 구분하는 코드평가지표명(문자형) : 평가지표명등록일시(날짜형) : 평가지표 등록일시수정일시(날짜형) : 평가지표 수정일시'
