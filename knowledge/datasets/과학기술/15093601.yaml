description_portal: "한국과학창의재단은 과학기술 분야 발전에 기여하고 있는 연구자, 기업인, 정책가 등 다양한 인물들의 이야기를 조명하는 '사이언스타임즈'의 과학기술인 기사 데이터를 제공합니다. 본 데이터는 과학기술인의 연구 성과와 생애, 철학 등을 소개하여 그들의 업적을 알리고, 차세대 과학기술 인재들에게 롤모델을 제시함으로써 과학기술계의 발전에 기여하고자 합니다.개방 데이터는 2020년 1월부터 2021년 10월까지 발행된 과학기술인 관련 인터뷰, 칼럼, 인물 동정 기사 112건으로 구성되어 있습니다. 각 기사의 제목, 작성자, 등록일자, 본문, 웹페이지 주소(URL) 등의 정보를 포함하고 있어, 특정 과학기술인의 활동이나 관련 분야의 전문가 정보를 심층적으로 파악할 수 있습니다.언론·미디어 분야에서는 과학기술계 인물 섭외 및 기사 작성을 위한 기초 자료로 활용하여 깊이 있는 콘텐츠를 제작할 수 있습니다. 청소년 및 대학생들은 본 데이터를 통해 다양한 과학기술 분야의 롤모델을 탐색하고 진로를 설계하는 데 도움을 받을 수 있으며, 연구기관 및 기업은 특정 분야 전문가를 발굴하고 협력 네트워크를 구축하는 데 기여할 수 있습니다.url : https://www.sciencetimes.co.kr/category/sci-people/"
