description_portal: '본 데이터셋은 국립광주과학관을 이용하는 온·오프라인 관람객의 디지털 이용 행태와 주요 관심 지표를 체계적으로 분석하여 제공하는 기초 통계 데이터입니다. 단순 방문 여부를 넘어, 과학관 공식 홈페이지 내 전시·교육·행사 등 세부 콘텐츠별 페이지 뷰(Page View) 데이터를 기반으로 관람객이 실제 필요로 하는 과학기술 정보와 선호 프로그램을 유형별로 분류하였습니다.또한 접속자의 지리적 위치 정보를 결합하여 지역별 수요 편차와 방문객의 유입 경로를 파악할 수 있는 통계치를 포함하고 있습니다. 이 데이터를 통해 공공 전시 서비스의 품질을 고도화하고, 데이터 기반의 맞춤형 과학 문화 콘텐츠 기획 및 지역별 홍보 전략 수립이 가능하도록 지원합니다.주요 내용: 홈페이지 세부 페이지별 PV(페이지 뷰), 접속 지역 정보활용 목적: 맞춤형 전시·교육 서비스 기획, 지역별 유입 패턴 분석, 과학 문화 확산 전략 수립기대 효과: 데이터 기반의 객관적인 과학관 운영 체계 구축 및 이용자 만족도 제고'
