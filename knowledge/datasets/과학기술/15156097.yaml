summary_user: 한국인터넷진흥원이 국내에 할당한 인터넷 AS(자율시스템) 번호별로 기관명과 할당일을 담은 건별 목록 파일(csv, 약 36KB)이다. 네트워크 운영자나 보안 분석가가 BGP 경로나 트래픽 로그에 찍힌 AS번호가 어느 국내 기관 것인지, 언제 할당됐는지 확인하는 데 쓴다. AS번호(as_no)를 키로 IP주소 할당 정보나 외부 BGP·라우팅 데이터와 이어 쓴다.
description_portal: '본 자료는 한국인터넷진흥원(KISA)제공하는 인터넷에서 국제표준방식에 의하여 일정한 통신규약에 따라 특정 정보시스템을 식별하여 접근할 수 있도록 하는 숫자ㆍ문자ㆍ부호 또는 이들의 조합으로 구성되는 정보체계를 말합니다.인터넷주소에는 인터넷 프로토콜 주소(IP주소)와 도메인 이름이 으로 인터넷 프로토콜(protocol) 주소 : 인터넷상에서 컴퓨터 및 정보통신설비가 인식하도록 만들어진 것과 도메인(domain)이름 : 인터넷상에서 인터넷 프로토콜 주소를 사람이 기억하기 쉽도록 하기 위하여 만들어진 것, 그 밖에 대통령령으로 정하는 것 나누어지고이같은 인터넷 주소를 AS 관리를 하기위한 기관명을 본 자료에서 제공하고 있습니다'
