description_portal: '농림수산식품교육문화정보원에서 제공하는 작물농업 병해충 및 잡초 정보는 작물 재배에 필수적인 데이터로, 농작물을 보호하고 생산 효율성을 높이기 위해 중요한 자료입니다. 이 데이터는 다양한 병해충과 잡초의 발생 특성과 방제 방법에 대한 정보를 담고 있으며, 농업 종사자, 연구자, 학생 등이 본 정보를 활용하여 적절한 대처 방법을 습득하고, 효과적인 농작물 관리를 할 수 있게 합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  - 카테고리(문자형): 병해충/잡초의 카테고리를 나타내는 값으로, 농업 분야 내에서 작물과 관련된 정보를 구분하는 데 사용됩니다.  - 제목(문자형): 각 병해충 또는 잡초의 이름을 나타냅니다.  - 요약글(문자형): 해당 병해충이나 잡초에 대한 간략한 설명을 담고 있습니다.  - 서브제목1~5(문자형): 추가 세부사항을 설명하는 제목입니다.  - 서브내용1~5(문자형): 각 서브제목에 대한 구체적인 내용으로, 생태, 피해사항, 방제 방법 등의 정보를 포함하고 있습니다.  - 등록일(날짜형): 데이터 등록 일자를 나타내는 값입니다. 이 정보를 바탕으로 농민들이나 연구자들은 특정 작물의 발생 시기와 관련된 정보를 손쉽게 얻을 수 있습니다.'
