description_portal: '본 데이터는 한국방송통신전파진흥원 전자파 안전 정보 홈페이지에서 제공하는 대국민 대상 전자파 관련 대한 설문 조사 정보입니다.설문은 전자파 안전정보 홈페이지에 대한 만족도 및 전자파 측정기 대여 서비스  수준 진단, 국민의 전자파에 대한 지식 수준, 건강 우려, 정보 접근성, 신뢰도, 정부 대응 평가 등을 포함하며, 정책 수립과 정보 제공에 활용된다. 데이터는 전자파 설문 문항에 대한 지표 정의, 새로운 진단 문항에 대한 설계 등에 활용될 수 있습니다. 또한 국민의 전자파 안전 인식을 다각도로 파악할 수 있는 기초자료로서의 가치가 있으며 본 통계는 전파환경에 대한 사회적 요구를 반영하며, 향후 전자파 정책 수립과 커뮤니케이션 전략 수립 시 활용 가능합니다.주요 설문내용 : 전자파 인식도, 전자파 정보습득, 전자파 정책, 전자파 홈페이지(emf.kca.kr) 만족도 등(고정적인 설문보다는 필요에 따라 설문 주제가 달라질 수 있습니다.)※ 최근 정보 및 자세한 내용은 전자파 안전 정보 홈페이지를 확인하시기 바랍니다.'
