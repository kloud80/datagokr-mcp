legal_basis_portal: 화천군이 부서별 팩스번호를 보유해야 하는 근거는 주로 공공행정의 효율성, 행정서비스 제공, 법적·행정적 요구사항에서 찾을 수 있습니다.전자문서 및 행정업무 처리의 일환 공공기관은 문서교환을 위해 팩스번호를 활용하며, 부서별로 정확한 연락처(팩스번호)를 보유하는 것은 행정문서 송수신의 효율성을 높이고, 신속한 업무처리를 위해 필요합니다. 정보공개 및 민원처리 관련 법적 요구사항 「공공기관의 정보공개에 관한 법률」 및 「행정절차법」 등에 따라 주민 및 민원인이 행정기관과 원활히 소통할 수 있도록 부서별 연락처를 공개할 의무가 있습니다. 팩스번호는 이러한 연락 수단 중 하나입니다.
