description_portal: 과학기술정보통신부, 정보통신산업진흥원, 벤처기업협회가 공동으로 실시한 ICT 중소기업 실태조사의 일환으로 수집된 본사 소재지별 분포 현황 데이터입니다. 국내 ICT 중소기업들의 지역별 분포를 파악하여 지역별 ICT 산업 발전 정도와 집중도를 분석할 수 있는 통계자료입니다. 데이터는 업종별(정보통신방송서비스, 정보통신방송기기, 소프트웨어), 세부업종별(통신서비스, 방송서비스, 정보서비스, 전자부품, 컴퓨터 및 주변기기, 게임소프트웨어, IT서비스 등), 매출액규모별(1억 미만부터 100억 이상까지 6개 구간), 종사자규모별(1~9명부터 300명 이상까지 6개 구간)로 분류되어 있으며, 각 범주별로 서울, 인천·경기, 대전·세종·충청·강원, 부산·울산·경남, 대구·경북, 광주·전라·제주 등 6개 권역별 비율을 제공합니다. 이 데이터는 ICT 중소기업 지원정책 수립, 지역별 ICT 산업 육성 전략 개발, 창업 지원센터 입지 선정, 지역 균형발전 정책 수립 등에 활용될 수 있으며, ICT 산업의 지역별 특성과 발전 가능성을 파악하는 데 중요한 기초자료가 될 수 있습니다.
