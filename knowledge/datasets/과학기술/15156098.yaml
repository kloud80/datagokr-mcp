description_portal: '본 자료는 한국인터넷진흥원(KISA) 인터넷주소자원 RIR 별 전 세계 인터넷주소자원 관리기관(RIR: Regional Internet Registry)별로 AS 번호(AS Number), IPv4, IPv6 주소의 누적 할당 규모를 보여준다. AFRINIC, APNIC, ARIN, LACNIC, RIPE NCC 등 5개 RIR이 각 지역의 인터넷 주소 자원을 관리하며, 지역별 인터넷 성장 수준과 네트워크 인프라 규모에 따라 자원 할당량이 뚜렷한 차이를 보인다. AS 번호는 네트워크 식별을 위한 고유 번호로, APNIC과 ARIN, RIPE NCC가 비교적 많은 AS 번호를 보유하고 있으며 이는 아시아·태평양, 북미, 유럽 지역의 ISP 및 기업 네트워크 수가 많다는 것을 의미한다. IPv4의 경우 전 세계적으로 고갈 상태이기 때문에 기존 할당량이 많은 ARIN과 APNIC, RIPE NCC가 가장 큰 규모를 차지한다. 반면 AFRINIC과 LACNIC은 상대적으로 적은 IPv4 주소를 보유하고 있다. IPv6는 주소 공간이 매우 넓어 RIR별 보유 격차가 IPv4만큼 크지 않지만, RIPE NCC·ARIN·APNIC이 주요 비중을 차지한다. 전체적으로 이 데이터는 지역별 인터넷 인프라 확장 규모와 주소 자원 수요의 차이를 잘 보여주는 지표'
