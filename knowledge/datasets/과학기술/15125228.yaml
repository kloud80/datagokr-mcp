description_portal: 공공데이터포털에 기 제공되고 있는 우주산업실태조사 내 위성활용 부문 매출 및 수입, 수출액 데이터(2013~2021)우리나라 우주산업 중 위성활용 부문의 경제적 성과를 보여주는 매출 및 수출입 현황 데이터입니다. 위성활용 산업의 성장 추이와 국제 경쟁력을 파악할 수 있는 경제 지표로, 우주산업실태조사의 일부로 수집된 공식 통계자료입니다. 데이터는 위성탐사, 위성통신방송, 위성항법으로 3개 주요 위성활용 분야별로 구분되어 있으며, 각 분야의 연도별 매출액, 수출액, 수입액을 제공합니다. 이를 통해 각 분야별 시장 규모, 성장률, 무역수지, 수출 경쟁력 등을 분석할 수 있으며, 우주산업의 경제적 가치와 발전 추이를 파악할 수 있습니다. 본 데이터는 우주산업 육성 정책 수립, 투자 전략 개발, 시장 분석, 국제 경쟁력 평가 등에 활용될 수 있으며, 특히 위성활용 분야별 맞춤형 지원 정책과 수출 확대 전략 수립의 근거자료로 활용됩니다.
