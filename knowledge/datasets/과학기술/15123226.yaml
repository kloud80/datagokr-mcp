summary_user: 판교제로시티 자율주행 도로에서 카메라가 감지한 이벤트와 상태를 발생 일시·감시 유형·상태값·카메라명 단위로 기록한 건별 도로감시 자료를 담는다. 자율주행 실증 연구자나 교통 분석가가 '특정 카메라 구간에서 어떤 감시 이벤트가 언제 얼마나 발생했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 카메라명(camera_nm)이나 일시 기준으로 같은 기관의 다른 자율주행 자료와 이름·시간 매칭으로만 이어 쓴다.
description_portal: '이 데이터는 서울대학교 산하 차세대융합기술연구원이 판교제로시티 내 자율주행 인프라 고도화를 목적으로 구축한 도로 감시 정보를 기록한 자료입니다. 해당 데이터는 자율주행 차량의 안전 운행과 도로 상황 인지를 위한 기반 정보로 활용되며, 자율주행 도로에서 발생한 다양한 이벤트와 상태를 시간 단위로 감지하여 수집한 결과를 포함합니다. 이러한 데이터는 자율주행 기술의 실증과 기술 상용화를 위한 중요한 기반 자료로, 미래 도시형 교통시스템 설계 및 지능형 교통 인프라 구축에 활용도가 매우 높습니다.*참고자료 및 데이터 다운로드 : FILE탭'
