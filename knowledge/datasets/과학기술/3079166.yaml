summary_user: 경상남도에 정보통신공사업으로 등록된 업체를 한 건씩 담은 업체 원장으로, 등록번호·상호·전화번호·우편번호·주소·등록일자로 구성된 시도 단위 개별 업체 목록(포털 설명상 514건)이다. 도내에서 정보통신공사를 맡길 등록 업체를 찾거나, 시군별로 공사업체가 어디에 몰려 있는지 파악하려는 발주자·분석가가 쓴다. 전역 조인 키는 없어 주소(우편번호 포함)를 기준으로 상권·기업 데이터와 이어 쓰고, 다른 데이터와는 상호 같은 이름 매칭으로만 연결된다.
description_portal: (데이터 수집목적 및 과정) 경상남도 정보통신공사업 현황 데이터는 경상남도 내 정보통신공사업으로 등록되어 관리하고 있는 업체 정보입니다. 이 데이터를 통해 도내 정보통신공사업의 전화번호와 소재지 등의 현황을 파악할 수 있습니다.(데이터 구성 및 세부항목) 정보통신공사업 데이터는 등록번호, 상호, 전화번호, 우편번호, 주소, 등록일자로 궁성됩니다. 총 514건입니다. 미집계 데이터 및 개인정보 관련 데이터는 공란처리 합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화 하지 않습니다.
