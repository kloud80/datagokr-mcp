description_portal: 서울시 우체국 정보(중국어_간체) 데이터는 서울시에 위치한 우체국의 기본 행정 정보와 연락처, 주소 정보를 중국어 간체로 제공하는 공공 데이터입니다. 키값과 기관코드는 각 우체국을 고유하게 식별하는 데 사용되며, 최하위기관명은 실제 우체국 지점의 이름을 중국어 간체로 표기한 항목입니다. 대표전화번호는 해당 우체국 지점에 직접 연락할 수 있는 기본 연락처를 제공하며, 새우편번호는 최신 우편번호 체계에 따른 코드로 우편·택배 서비스 이용 시 정확한 주소 표기에 활용됩니다. 행정시, 행정구, 행정동 항목은 각각 시, 구, 동 단위 행정구역 정보를 중국어 간체로 표기한 것으로, 지도 서비스 연계, 다국어 안내 시스템 구축, 중국어 이용자를 위한 민원 안내 등에 활용할 수 있는 기초 자료입니다.
