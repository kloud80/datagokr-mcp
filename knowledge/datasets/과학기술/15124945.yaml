summary_user: 특허로에서 발급된 특허·실용신안·디자인·상표 등록원부 한 건마다 발급번호와 등록번호를 기준으로 통지서 발송일자, 열람용도, 수령방법, 대표출원인, 발급 당시 원문을 담는 건별 조회 API로, 범위는 전국이다. 은행·공공기관 같은 수요기관이 제출받은 등록원부가 실제로 특허로에서 발급된 진본인지 확인할 때 쓴다. 전역 조인 키는 없고, 조회에 필요한 발급번호(mailNo)와 등록번호(rgstNo)를 제출 문서나 KIPRIS 등록 정보에서 먼저 받아 넘기는 방식으로 이어 쓴다.
limits: 발급번호와 등록번호를 미리 알아야 호출할 수 있어 목록 탐색이나 통계에는 쓰지 못한다. 오퍼레이션 2개 중 원문 조회(/getIssueRegisterVrifyContents)는 최소 파라미터로 응답이 없었고, 비공개 건은 조회가 제한될 수 있다.
