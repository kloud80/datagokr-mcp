description_portal: '□ 개요본 데이터셋은 국립과천과학관에서 운영하는 전시·교육·행사 등 대민 프로그램의 판매 경로와 결제 수단 정보를 유형별로 정리한 자료입니다. 프로그램 성격에 따른 결제 방식의 다양성을 파악하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 프로그램 유형(전시, 행사 등)별로 지원되는 결제 수단(신용카드, 가상계좌 등)을 확인하여 고객 편의성을 점검할 수 있습니다. 둘째, 판매 형태(모바일, 웹 등) 정보를 통해 비대면 예매 채널의 운영 현황을 분석할 수 있습니다. 셋째, 결제 수단별 이용 가능 여부를 파악하여 예약 시스템의 기능 개선 및 결제 모듈 고도화의 기초 자료로 활용 가능합니다.□ 데이터 구조· 등록일자 : 해당 결제 정책이나 정보가 등록된 날짜 (String, YYYY-MM-DD)· 프로그램유형 : 제공되는 프로그램의 카테고리 (String, 예: 단체관람, 행사, 체험)· 판매형태 : 프로그램이 판매되는 채널 또는 플랫폼 (String, 예: 모바일)· 결제형태 : 고객이 이용 가능한 지불 수단 (String, 예: 무통장, 신용카드, 가상계좌)'
