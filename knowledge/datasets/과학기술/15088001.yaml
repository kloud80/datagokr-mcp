description_portal: '- 한국방송광고진흥공사에서 주관한 대한민국 공익광고제 공모전 수상 작품들에 대한 연간 데이터를 제공합니다.- 개방 데이터는 연도, 구분, 수상내역, 부문, 제목 총 5가지 항목으로 이루어져 있습니다.- 2010년 이후 수상작품이 포함되어있으며, 구분은 대상/일반부/학생부/청소년부 등으로 나뉘고 부문은 TV, 인쇄, 옥외광고, 영상 등으로 구분됩니다.- 학계 및 연구기관, 공익광고 제작을 고려하는 기관 및 기업에서 공익광고제 공모전 키워드 변화를 살피고 주요 주제 파악 등을 위한 기초 자료로 활용할 수 있습니다.'
