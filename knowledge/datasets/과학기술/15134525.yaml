description_portal: 본 데이터는 AI허브에서 제공하는 인공지능 학습용 데이터 라벨링 관련 교육 콘텐츠에 대한 정보를 담고 있습니다. 각 콘텐츠는 교육명, 교육 구분(전문가/프로젝트관리자), 난이도 수준(기본/전문/심화 등), 유형(PM과정/비전기술/보안/품질관리 등), 교육 동영상 URL 및 조회수 항목으로 구성되어 있으며, 사용자 수요와 교육 효과성을 분석하는 데 활용됩니다. 본 자료는 인공지능 데이터 가공 인력의 역량 향상 및 표준화된 라벨링 교육 제공을 위한 기반자료로서 유용하며, 공공 AI 학습 데이터 구축 사업 참여자, 민간 데이터 라벨러, 교육 기획자들이 교육 콘텐츠 수립 및 개선 방향을 도출하는 데 활용될 수 있습니다.
