description_portal: 이 데이터는 과기정통부, 방통위, 전파연구원 등 전파, 전자파 안전과 관련한 법령 및 고시 현황입니다. 전파법, 시행규칙, 법령 등과 관련하여 국내 전자파 관련 규정 뿐만 아니라 독일, 미국, 뉴질랜드 등 해외의 전파 관련 규정 또한 포함합니다. 데이터는 전파 관련 규정의 제목, 조회수, 첨부파일명, 첨부파일 링크, 내용의 텍스트 수 그리고 간단한 내용으로 구성되어 있습니다. 본 데이터는 전자파 관리와 안전 확보를 위한 법적 근거를 제시하고, 전자파 적합성 인증 및 시험 절차 등 관련 규정의 이해를 돕기 위해 제공됩니다. 일정 주기의 업데이트를 통해 개정되는 내용을 반영하여 전파 제도의 변화를 확인할 수 있으며, 국민과 산업계가 전자파 규제를 효율적으로 파악하도록 지원합니다. 현 데이터는 2023년 기준 최신 법령 정보를 기반으로 구성되었습니다.
