summary_user: 제주특별자치도 공공와이파이 이용자 수(user_count)를 기준일·요일·성별·연령대별로 묶어 집계한 통계로, 포털 설명상 2019년 1월 1일부터 2020년 12월 4일까지를 담는다. 정책 담당자나 분석가가 '제주 공공와이파이는 주말과 평일 중 언제, 어떤 성별·연령대가 더 많이 쓰는가'를 볼 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 날짜·요일·성별·연령대 같은 항목을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터셋은 2019년 1월 1일부터 2020년 12월 4일까지 제주특별자치도 내 공공와이파이 이용자의 요일별, 성별, 연령대별 이용 현황을 집계한 통계자료이다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과이다. 자료는 CSV 형식으로 공개되어 있어 누구나 무료로 다운로드 및 활용이 가능하며, 요일별 이용자 분포, 성별·연령대별 접속 패턴 분석, 주말 및 평일 이용 집중도 파악 등에 활용될 수 있다. 이 정보는 공공 통신 인프라 이용 현황 조사, 디지털 접근성 평가, 관광객 및 도민의 인터넷 사용 행동 분석, 와이파이 설비 운영 및 확대 계획, 스마트 도시 및 관광 정책 수립 등에 유용하다. 다만 수집 기간이 2019~2020년까지이며, 이후 이용자 증가·감소나 설치 장소 변동, 인구 변화 등은 반영되어 있지 않을 수 있다는 한계가 있다.
