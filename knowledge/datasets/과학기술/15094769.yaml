summary_user: 제주빅데이터센터가 집계한 제주특별자치도 공공와이파이의 AP 그룹(설치 장소)별·날짜별 사용자 수를 담은 집계 데이터이며, 건별 접속 기록이 아니라 장소·날짜 단위 합계다. 관광·도시 인프라 담당자나 분석가가 '어느 와이파이 설치 장소의 이용자가 언제 늘거나 줄었는가'를 확인해 수요 예측이나 증설·품질 관리 대상을 고르는 데 쓴다. 필드는 날짜, AP 그룹명, 사용자 수뿐이고 전역 조인 키가 없어서 다른 데이터와는 AP 그룹명(장소 이름)을 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터셋은 제주빅데이터센터 가 집계한 제주특별자치도 내 공공 와이파이(AP 그룹, 장소별) 사용자 추이 정보를 담고 있다. 제공기관은 제주특별자치도청, 관리 부서는 디지털혁신과이며, 데이터는 CSV 형식으로 무료 제공된다. 해당 자료는 각 와이파이 설치 지점별로 시간 흐름에 따라 접속자 수 증감 현황을 확인할 수 있어, 공공 통신 인프라 이용 패턴 분석, 관광객·도민의 인터넷 접근성 평가, 특정 지역의 와이파이 수요 예측 및 서비스 품질 관리, 스마트 관광 및 도시 인프라 기획 등에 활용 가능하다. 다만 이 데이터는 ‘수시(1회성)’로 제공된 과거 시점 기준의 집계이며, 이후 와이파이 존 변화, 사용자 행동 변화 등은 반영되지 않을 수 있다는 한계를 가진다.
