description_portal: 본 데이터는 한국방송통신전파진흥원의 전파누리(https://spectrummap.kr/) 홈페이지에서 관리하는 산악지역에 위치한 이동통신서비스를 목적으로 개설된 무선국 정보입니다. 해당 데이터는 군립공원의 이름, 용도(3G, 4G, 5G), 군립공원 주소, 위도와 경도를 포함한다. 같은 군립공원명 안에 서로 다른 용도나 주소가 존재할 수 있다. 본 자료는 전파자원의 효율적 이용과 공공통신 인프라 관리체계 강화를 위한 기초자료로 활용될 수 있으며, 공공안전, 재난통신, 관광안내, 환경모니터링 등 공원 내 다양한 통신수단의 운용 실태 확인 등에 활용될 수 있다. 무선국의 설치밀도, 행정구역별 분포 현황을 분석하는 데 유용하게 사용될 수 있다.
