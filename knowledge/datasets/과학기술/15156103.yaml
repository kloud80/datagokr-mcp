summary_user: 국내에 확보된 인터넷주소자원(IP 대역)을 블록 단위로 한 행씩 담은 파일로, IPv4·IPv6 유형별 시작·끝 주소, 주소 개수, 프리픽스 길이, 할당일을 담는다(csv 약 97KB, 전국 범위). 네트워크 연구자나 정책 분석가가 "국내 IPv6 대역이 언제, 어떤 크기로 확보돼 왔는가"처럼 연도별·프리픽스별 확보 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 할당일 연도나 유형 같은 값으로만 맞춰 쓰며, 보유 기관명은 필드에 없다.
description_portal: 국내 인터넷주소자원 PREFIX 확보 현황은 주로 IPv4와 IPv6로 구분되며, IPv4는 상대적으로 작은 단위의 세분화된 대역을 지속적으로 확보해 온 특징이 있다. 기관·기업·통신사 등 다양한 수요처에서 요구하는 네트워크 규모에 따라 /24, /23, /22 등 비교적 작은 블록이 다수 배분되었고, 일부는 더 큰 단위의 블록도 포함된다. 반면 IPv6은 대규모 주소 체계를 기반으로 하여, 국가·기관 단위의 장기적 활용을 고려한 /32, /28, /22 등의 큰 블록 중심으로 확보가 이루어졌다. 이러한 구성은 IPv4 고갈로 인해 점차 IPv6 중심으로 전환하는 흐름과도 맞물려 있으며, 국내 인터넷 생태계에서 주소 자원의 효율적 분배와 장기적 확장성을 동시에 고려한 확보 전략이 반영된 결과 이다.
