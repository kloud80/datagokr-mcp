description_portal: 일상생활에서 휴대전화와 같은 휴대용 송신 무선설비를 이용할 때 우리 눈에는 보이지 않지만 전자파가 발생합니다. 이러한 전자파는 사람이나 동물의 몸에 흡수가 될 수 있는데 이를 숫자로 표현한 값을 전자파흡수율(SAR)이라 하며 이에 대한 국가별 전자파 흡수율 기준 입니다.이 데이터는 인체 부위별 전자파흡수율(SAR) 기준치를 국가 및 기관별로 정리한 표이다. SAR은 인체가 전자파를 흡수하는 비율을 의미하며, 일반인과 직업인으로 구분해 전신, 머리/몸통, 사지의 부위별 기준치를 제시한다. 한국, 일본, 미국, 유럽, 국제비전리복사방호위원회(ICNIRP), 미국전기전자기술자협회(IEEE) 기준이 포함되어 있으며, 이를 통해 각국과 국제기관의 전자파 안전 기준 차이를 비교할 수 있다. 데이터는 전자파 인체 보호 기준 설정 및 정책 수립에 유용하게 활용 가능하다.
