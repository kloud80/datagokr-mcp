summary_user: 「미생물 기탁기관의 등록 및 운영에 관한 고시」에 따라 등록된 기탁기관에 맡겨진 미생물을 기탁 건별로 담은 파일로, 기탁번호·기탁자·기탁기관·미생물명·기탁일자·국내 기탁 여부·미생물 종류를 포함한다(전국 범위, CSV 약 24KB). 생명공학 분야 특허 출원인이나 분석가가 특정 미생물이 어느 기탁기관에 언제 누구 이름으로 기탁됐는지 확인하는 데 쓴다. 미생물기탁번호(microbe_deposit_no)를 키로 특허 출원·공개 정보에 기재된 기탁번호와 이어 쓰고, 기탁자 이름으로 출원인·기업 정보와 대조한다.
description_portal: '"미생물 기탁기관의 등록 및 운영에 관한 고시"에 따른 기탁기관에 등록된 미생물 수탁정보입니다. 미생물기탁번호, 기탁자성명, 기탁기관명 등이 포함되어 있습니다.「미생물 기탁기관의 등록 및 운영에 관한 고시」는 특허청이 특허 출원 과정에서 필요한 미생물 기탁 제도를 원활히 운영하기 위해 제정한 고시로, 미생물을 보관하고 제공하는 기탁기관의 등록 요건, 시설·인력 기준, 운영 절차 및 관리 의무 등을 규정하고 있습니다. 이를 통해 기탁된 미생물이 장기간 안전하게 보존·관리되며, 출원인과 이해관계자가 합리적으로 이용할 수 있도록 제도적 기반을 제공합니다.'
