summary_user: 판교제로시티에서 운행하는 자율주행 제로셔틀의 이동 경로를 CCTV로 추적한 이미지 데이터의 목록으로, 이미지 한 장마다 녹화 시작·종료 일시, 날씨, CCTV 식별번호, 이미지 크기, 이미지 파일과 주석(annotation) JSON 파일의 이름·경로를 담는다. 자율주행·스마트시티 연구자가 "특정 CCTV에서 어떤 날씨와 시간대에 촬영된 셔틀 추적 이미지와 라벨 파일이 있는가"를 찾아 학습·검증용 데이터셋을 꾸릴 때 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 확인되지 않았고, CCTV 식별번호(cctv_idntfy_no)로 같은 판교제로시티 CCTV 계열 데이터와 이름·코드를 맞춰 잇는 정도만 가능하다.
description_portal: 서울대학교 연구소 차세대융합기술연구원 판교제로시티 자율주행 데이터 조회 서비스 중 판교제로시티에서 운행 중인 제로셔틀의 경로추적 정보를 제공하는 CCTV 기반의 교통분야 데이터입니다자율주행 서비스 개발의 기반 마련을 위해 판교제로시티에서 수집, 가공한 자율주행 인프라 및 실증 데이터를 조회 및 제공합니다.수집 항목으로는 녹화일시, 날씨정보, CCTV고유번호, 이미지 크기 등이 포함되어 있습니다. 데이터는 제로셔틀이 이동한 경로를 CCTV 기반으로 추적한 이미지 데이터를 확인할 수 있습니다. 교통 위치 정보를 바탕으로 자율주행 셔틀 운영 및 경로 최적화, 교통혼잡도 분석, 스마트시티 교통관리 시스템 연구 등에 활용될 수 있습니다.*참고자료 및 데이터 다운로드는 FILE탭을 활용해주시기 바랍니다.
