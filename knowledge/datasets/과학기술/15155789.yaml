description_portal: 본 자료는 한국인터넷진흥원(KISA) 보호나라 시스템 게시판에 저장되어 있는 게시판정보에 관한 상세 내역을 체계적으로 정리한 문서로 주로 1990~2000년대 UNIX 계열 OS와 Windows/브라우저의 다양한 취약점 및 대응 방법을 정리한 보안 공지 모음이며, 대부분은 버퍼 오버플로우·인증 취약점·네트워크 취약점으로 구성되고, 주요 게시내용으로는 **UNIX 계열 OS(Solaris, IRIX, HP-UX, AIX, SunOS 등)**의 버퍼 오버플로우 취약점, 인증/로그인 취약점, 시스템 유틸리티 프로그램 취약점,네트워크 서비스(rpc, rlogin, SMB 등) 보안 문제그리고 Windows NT/95, Internet Explorer, Netscape 등 구형 소프트웨어의 보안 취약점 대다수 항목은 취약점 설명 + 대책(패치/설정 변경 등) 형태 취약점과 대책을 제공한다.이외 보고서로는 RAS 시스템 사고경보,밀레니엄 인터넷 웜 주의보 정보가 있다.
