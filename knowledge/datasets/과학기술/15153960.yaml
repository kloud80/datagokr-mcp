summary_user: 한전KDN 사업장(전남 나주시 빛가람로 본사 지상주차장)에 설치된 전기차 충전기를 한 대씩 행으로 정리한 소규모 파일(csv 약 2KB)로, 주소·상세위치·충전기 형태·충전 종류·충전 속도·로밍가격·회원가격·개방시간·운영기관·설치년도를 담는다. 나주 혁신도시를 오가는 전기차 이용자가 '한전KDN 주차장에 급속충전기가 몇 kW급으로 있고 요금은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 충전소 데이터와는 주소(도로명·지번)나 운영기관 이름을 맞춰서만 이어 쓴다.
description_portal: 이 파일은 한전KDN 사업장에 설치된 전기차 충전소의 주요 정보를 정리한 자료로, 충전 인프라의 구성과 특징을 한눈에 파악할 수 있도록 정리되어 있습니다. 모든 충전기는 전남 나주시 빛가람로에 위치한 한전KDN 지상주차장 1층에 마련되어 있어 이용자가 편리하게 접근할 수 있습니다. 충전기 형태는 단독형과 양팔형 두 종류가 제공되며, 모두 DC 콤보 방식을 기반으로 한 급속 충전기로 구성되어 있습니다.충전 속도는 100kW와 200kW 두 가지로 나뉘어 있어 차량 특성과 이용 상황에 맞게 선택할 수 있습니다. 특히 200kW급 고출력 충전기는 짧은 시간 안에 충분한 에너지를 공급할 수 있어 충전 효율을 높이는 데 도움이 됩니다. 또한 로밍 가격과 회원 가격이 동일하게 설정되어 있어 요금 체계가 단순하고 이해하기 쉬운 점도 특징입니다.이 자료는 충전소의 위치, 충전기 사양, 요금, 속도 등 전기차 이용자에게 필요한 핵심 정보를 담고 있어, 안내 자료나 현황 파악 문서로 활용하기 적합합니다. 더 나아가 충전 인프라 운영 분석이나 향후 확충 계획을 세울 때 참고 자료로도 의미가 있습니다.
