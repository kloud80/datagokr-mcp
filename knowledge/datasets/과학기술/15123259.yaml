summary_user: 판교제로시티에서 운행한 제로셔틀 자율주행차량이 센서로 인식한 객체(장애물)의 위치정보를 수집일시·수집순번별로 담는 건별 원천 데이터로, 장애물 좌표(obstacle_xcrd)·크기·유형·상태와 라이더 위치·매칭 신뢰도 등을 포함한다. 자율주행 연구자나 개발자가 "셔틀이 주행 중 주변 장애물을 어떤 위치와 유형으로 인식했는가"를 확인해 객체 인식이나 장애물 회피 알고리즘을 검증하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 수집일시나 이름 매핑, 같은 기관 데이터로만 연결된다.
description_portal: 서울대학교 연구소 차세대융합기술연구원 판교제로시티 자율주행 데이터 조회 서비스 중 제로셔틀차량 객체 위치인식정보 조회입니다.자율주행 서비스 개발의 기반 마련을 위해 판교제로시티에서 수집, 가공한 자율주행 인프라 및 실증 데이터를 조회 및 제공합니다.수집일시, 센서위치내용, 장애물 좌표, 라이더 위치 등의 데이터를 제공합니다.본 데이터는 자율주행 차량의 실시간 객체 인식 성능 향상, 장애물 회피 알고리즘 개발, 교통안전 시뮬레이션, 스마트시티 교통 관리 시스템 연구 등에 활용할 수 있습니다. 참고자료 및 데이터 다운로드는 FILE탭을 이용해주시기 바랍니다.
