description_portal: '□ 개요본 데이터셋은 국립과천과학관에서 개최된 전시·교육·행사 관련 게시판의 게시글 현황에 대한 정보입니다. 게시글 제목, 등록 일자, 게시 내용 등 정보를 통해 과거에 개최된 전시·교육·행사 관련 정보를 확인할 수 있습니다. 주된 활용 목적은 다음과 같습니다. 첫째, 과거 행사 및 교육 프로그램의 상세 내용과 일정을 파악하여 과학관의 운영 이력을 분석할 수 있습니다. 둘째, 게시글 조회수(방문자수)를 통해 특정 행사나 주제에 대한 대중의 관심도를 가늠해 볼 수 있습니다. 셋째, 유사한 성격의 미래 행사 기획 시 홍보 문구 작성이나 프로그램 구성의 참고 자료로 활용 가능합니다.□ 데이터 구조· 제목 : 게시글의 제목 (String)· 컨텐츠 : 게시글의 본문 내용 (String)· 방문자수 : 게시글 조회수 (Integer)· 등록일자 : 게시글 등록 날짜 (String, YYYY-MM-DD)· 업데이트일자 : 게시글 수정 날짜 (String, YYYY-MM-DD)'
