description_portal: 본 데이터는 기초과학연구원에서 수행한 연구과제 중 지식재산권과 관련된 정보를 체계적으로 수록한 것이다. 해당 데이터는 특허 출원 또는 등록 여부, 과제명, 연구책임자, 과제 수행 기간, 연구 분야, 기술 요약, 권리 상태 등의 항목으로 구성되어 있으며, 연구 성과의 산업적 활용 가능성을 판단하는 데 유용하다. 이 정보는 지식재산 창출 현황을 파악하고, 기술이전 및 사업화 전략 수립에 참고할 수 있도록 제공된다. 또한 연구개발 결과의 보호 및 활용을 촉진하며, 연구기관의 혁신 역량 강화를 위한 기초자료로 활용된다. 데이터는 정기적으로 업데이트되며, 누구나 열람 가능하도록 개방되어 있어 공공의 연구성과 확산과 정책 수립에 기여한다.
