description_portal: 제9장 소방장비의 처분 제37조(소방장비의 반납) ① 소방기관의 장은 소방장비의 운용 필요성 및 가능성 등을 조사할 수 있다.  ② 소방기관의 장은 제1항에 따른 조사에 근거하여 소방장비운용자의 소방장비 반납에 필요한 조치를 할 수 있다.제38조(소방장비의 불용 결정 등) ① 소방기관의 장은 다음 각 호의 어느 하나에 해당하는 소방장비에 대하여는 불용 결정을 할 수 있다.  1. 내용연수를 경과한 소방장비  2. 사용할 수 없는 소방장비  3. 사용할 필요가 없는 소방장비  ② 소방기관의 장은 제1항 각 호의 어느 하나에 해당하는 소방장비에 대하여 대통령령으로 정하는 바에 따라 상태 및 내용연수 등을 종합적으로 검토하여 불용 여부 및 적정 교체시기를 결정하여야 한다.  ③ 소방기관의 장은 제2항에 따른 결정을 위하여 필요한 경우에는 대통령령으로 정하는 바에 따라 전문가 등의 자문을 받을 수 있다.제39조(소방장비의 폐기) ① 소방기관의 장은 불용 결정된 소방장비가 사용될 경우 안전사고 등의 위험이 있을 것으로 판단하는 경우에는 해체ㆍ절단 등의 방법으로 불용 결정된 소방장비를 폐기하여야 한다.  ② 소방기관의 장은 정보시스템 저장매체가 내장된 소방장비를 불용 결정 후 폐기하는 경우에는 저장자료의 삭제 여부를 확인하여야 한다.
