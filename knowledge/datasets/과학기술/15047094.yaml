description_portal: '○ 통계개요* 통계명 : 무선국 분포현황* 통계종류 : 전파법 제66조* 작성목적 : 전파를 이용할 수 있도록 올바른 환경을 조성하고 국민생활향상과국가경쟁력 강화를 위한 정책수립의 토대를 마련하기 위해* 조사체계 : 중앙전파관리소* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 방송국, 고정국 이동중계국, 간이무선국 등○ 용어설명* 무선국 : 전파를 보내거나 받는 무선설비와 운용하는 사람을 포함(방송수신만을 목적으로 하는 것은 제외)* 아마추어무선국 : 금전상의 이익을 목적으로 하지 않고 개인적인 취미로무선통신의 자기훈련과 기술연구를 위해서 운용하는 무선국* 선박국 : 선박에 개설하여 선박과 해안국간, 선박 상호간 해상이동업무를행하는 무선국* 간이무선국 : 경비용역, 건설현장, 운동경기진행, 가스배달 및 농장 등 일정한지역 안에서 사용주파수와 전력 등을 정해놓고 간단한 연락수단으로 사용되는있는 무선국* 방송국 : 방송프로그램을 기획, 편성 또는 제작하고 이를 공중에게 전기통신설비에 의하여 송신하는 것'
