description_portal: 우체국에서 국제특급 발송을 위한 발송조건 데이터자료는 2022년 8월 1일 기준으로 우정사업본부가 제공하는 국가별 국제특급(EMS 등) 발송조건을 정리한 것으로, 약 200여 개국을 대상으로 우편물 종류별(통상, 소포, EMSP, K-PACKET) 운송조건, 제한중량, 보험취급, 세관요건, 취급주의사항 등을 상세히 규정하고 있다. 예를 들어 안도라(AD)의 경우 EMSP 발송 시 최대중량은 70kg이며, 보험은 가능하나 속달과 취급주의 소포는 불가하다.기재 가능한 문자와 보관일수, 기록배달 여부 등 국제 규정에 따른 취급 세부조건이 구체적으로 명시되어 있어, 실무 담당자 및 국제물류 설계자에게 필수적인 참조 자료이다.
