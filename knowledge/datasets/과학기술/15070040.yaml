description_portal: '과학기술정보통신부에서 제공하는 전 세계 연구개발투자 상위 50개 기업의 순위 정보 데이터입니다. 글로벌 기업들의 R&D 투자 규모를 비교하여 세계 기술혁신의 주요 동향과 산업별 R&D 투자 패턴을 파악할 수 있는 통계자료입니다. 데이터는 매년 연구개발 투자액 기준으로 선정된 상위 50개 기업의 순위, 기업명, 소속 국가 정보를 포함하고 있습니다. IT(알파벳, 마이크로소프트, 애플, 삼성전자, 화웨이 등), 제약바이오(화이자, 로슈, 노바티스, 머크 등), 자동차(폭스바겐, 토요타, GM, 다임러 등), 전자통신(인텔, 노키아, 에릭슨 등) 등 다양한 산업 분야의 글로벌 선도 기업들이 포함되어 있으며, 미국, 독일, 일본, 한국, 중국, 스위스 등 주요 국가별 분포도 확인할 수 있습니다. ㅇ 연구개발투자 세계 TOP 50기업의 통계로 연구개발 투자를 많이한 기업의 순위 데이터를 확인할 수 있음. 상위 50개 순위의 기업명과  국가 정보를 확인- 컬럼명: 구분, 순위, 회사명, 국가'
