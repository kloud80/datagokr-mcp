summary_user: 우체국쇼핑 판매자별 신용등급·신용점수와 가격·배송·서비스 평가점수, 전체·최근 판매 건수와 금액, 상품 등록·낙찰 건수, 등급 적용 기간을 담은 파일로, 판매자 구분번호 단위의 전국·비공간 자료다. 우체국쇼핑 입점을 검토하는 사업자나 분석가가 판매 실적과 만족도 평가가 신용등급과 어떻게 연결되는지 살피는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 공통 조인 키는 찾지 못했다. 판매자 구분번호는 이 파일 안에서만 쓰는 식별자이고, 외부와는 같은 기관 자료의 이름·코드 매핑으로만 연결된다.
description_portal: 본 데이터는 우체국쇼핑 전자상거래 운영과 판매자 관리 전반을 지원하기 위한 통합 관리 자료로 구성되어 있다. 주요 항목에는 판매자 기본정보와 계약 관련 서류, 일별 판매 실적 및 통계, 정산 및 지급 내역이 포함되며, 거래 과정에서 발생하는 민원 상세와 처리 이력, 판매자의 신뢰도 등급 산정 기록, 계정 사용중지 사유 및 이력 등이 함께 관리된다. 이를 통해 기관은 판매자의 거래 활동 현황을 종합적으로 분석하고, 건전한 거래 환경을 조성하며, 정산 흐름을 투명하게 관리하고, 민원 및 리스크 요인을 사전에 파악하여 대응할 수 있다.
