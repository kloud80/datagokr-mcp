description_portal: '본 데이터는 전국 디지털배움터의 위치, 유형 및 수용 인원 등의 정보를 담고 있습니다. 디지털배움터는 디지털 소외계층의 역량 강화를 위해 운영되는 교육공간으로, 본 데이터는 정책 수립, 교육 운영 및 수요 예측에 활용될 수 있습니다.관리지역 : 해당 교육장을 관리하는 행정구역 또는 관할 권역시군구 : 교육장이 소재한 시·군·구 정보배움터명 : 디지털배움터의 공식 명칭배움터주소 : 배움터의 전체 도로명 또는 지번 주소배움터 유형 : 배움터의 운영 형태 (예: 상시교육장, 임시교육장 등)이용정원 : 해당 교육장에서 동시에 수용 가능한 교육 인원 수이 데이터는 디지털 포용 정책 성과 측정, 지역별 교육 인프라 분석, 교육장 분포 시각화 및 활용 수요 분석 등에 유용하게 활용될 수 있습니다.'
