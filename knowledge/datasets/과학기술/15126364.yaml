description_portal: 「연구산업진흥법」 제6조에 따라 과학기술정보통신부 장관에 신고된 전문연구사업자 정보입니다.해당 데이터는 ‘전문연구사업자 신고기업 현황’을 정리한 표로, 전국 각지의 전문연구사업자로 등록된 기업들의 주요 정보를 담고 있습니다. 각 기업의 고유 식별자인 사업자등록번호와 함께, 업체명, 대표자명, 소재지(시도 및 상세주소), 신고된 업종(연구관리, 주문연구 등), 승인일자 및 만료일자 등이 포함되어 있습니다. 이 데이터는 전문연구개발 서비스를 제공하는 기업들의 행정적 등록 현황을 파악하고, 정부 차원의 연구개발(R&D) 정책 수립 및 기업 지원의 기초자료로 활용될 수 있습니다. 정보제공 요청시 업무위탁기관인 한국연구산업협회에서 파일데이터(CSV)형태로 제공 중이며, 활용 용이성을 위해 CSV파일로 공공데이터 포털로도 개방합니다.
