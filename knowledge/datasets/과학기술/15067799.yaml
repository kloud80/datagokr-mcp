description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 지역국별 평일 편성 정보를 제공하는 목록이다. 항목은 지역국명, 방송권역, 프로그램명, 방송시간(시작·종료), 요일구분(월~금), 진행자·제작부서, 청취 채널 안내(주파수) 등으로 구성한다. 이용자는 권역별 시간대 편성을 비교하여 출퇴근 교통정보 제공 시간, 지역 특화 콘텐츠 배치, 진행자 교체 등 편성 변동의 영향을 분석할 수 있다. 방송국 주소가 포함된 경우 지도 시각화와 안내문 제작에 활용할 수 있으며, 주파수·지역 필터로 특정 권역의 청취 경로를 신속히 파악한다. 편성시간 표기는 24시간 기준이다.
