description_portal: 한국여성과학기술인육성재단(WISET)의 설립년도부터 최근까지의 국내외 다양한 기관과 체결한 양해각서(MOU)의 체결 현황을 제공합니다. 양해각서는 한국여성과학기술인의 차세대 인재 양성을 위해 다양한 교육, 협력, 세미나, 캠페인 지원 등 사업의 효과적인 추진을 위해 공공 및 민간 부문과의 전략적 파트너십을 구축하는 데 중요한 역할을 합니다. 동 데이터에는 체결 일시, 체결 명칭, 체결 기관의 명칭, 체결 장소, 협약기간, 체결 내용, 주관부서, 협약서 유무 등이 포함되어 있으며, 이를 통해 WISET의 협력 네트워크를 파악하고, 개발협력 사업의 기획 및 평가에 활용할 수 있습니다.
