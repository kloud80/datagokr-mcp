summary_user: 연구개발특구 유관기관이 등록한 행사·교육 일정을 행사 한 건씩 담은 파일로, 기관명·행사명·주관기관·지역·장소·기술 분류·해시태그·시작일·종료일로 구성되며 포털 설명상 2023년 1월~2025년 11월 사이 1,243건이다. 특구 입주기업이나 창업·사업화 담당자가 '이번 분기 우리 지역 특구에서 열리는 기술사업화 교육이나 설명회가 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 특구 데이터(입주기관·연구소기업 등)와는 기관명이나 지역명을 문자열로 맞춰 이어 써야 한다.
