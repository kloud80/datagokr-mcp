description_portal: '연구개발특구의 특구별 유관기관(업)의 행사 및 교육일정에 관한 데이터입니다.(2025년 11월 기준 )해당 데이터는 순번, 기관명, 행사명, 주관기관명 행사지역, 행사장소, 행사관련 기술 분류, 해시태그, 행사기간(시작일, 종료일)으로 구성되어 있습니다.해당 데이터는 매 분기별 등록 완료된 행사 일정을 기준으로 공공데이터 포털에 업데이트하여 제공하고 있으며,2023년 1월 ~ 2025년 11월 사이 데이터를 기준으로 구성되어 있습니다.해당 데이터는 연구개발특구진흥재단의 대표 홈페이지의 캘린더 서비스를 통해 제공되고 있습니다.(서비스 URL : https://www.innopolis.or.kr/innoSchedule?menuId=MENU01058&viewType=1)※ 총 1,243건의 행으로 구성되어 있으며, 데이터 미 집계 시 일부 컬럼에 공란이 존재할 수 있습니다.'
