summary_user: 도로명주소 체계의 도로명과 건물 위치·번호, 건물 도형과 속성을 전국 단위로 조회하는 OGC 표준 외부 API이며 행정단위는 개별 주소·좌표다. 주소 문자열을 도로명코드·건물관리번호·법정동코드·좌표로 정규화하려는 분석가나 개발자가 주소 컬럼이 있는 데이터를 정리할 때 쓴다. 주소 컬럼 데이터와 도로명코드·건물관리번호·법정동코드로 이어 쓰지만, 실측 컬럼에서 전역 조인 키는 확인되지 않아 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 도로명주소 체계의 새주소 도로명, 도로명주소 체계의 새주소 건물위치 및 건물번호새주소건물의 도형, 속성 정보를 조회 기능을 제공합니다.OGC(Open Geospatial Consortium) 표준 API는 공간 데이터의 공유와 상호운용성을 위해 개발된 국제 표준으로, 웹 기반에서 지도, 피처, 래스터 등 다양한 지리정보를 효율적으로 제공·활용할 수 있게 합니다. 최신 OGC API는 RESTful 구조를 채택해 개발 편의성과 확장성을 높였으며, WMS, WFS 등 기존 표준을 현대적으로 계승합니다
