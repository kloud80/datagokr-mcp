description_portal: '서울대학교 연구소 차세대융합기술연구원 판교제로시티 자율주행 데이터 조회 서비스 중 제로셔틀 차량제어정보 조회 입니다.자율주행 서비스 개발의 기반 마련을 위해 판교제로시티에서 수집, 가공한 자율주행 인프라 및 실증 데이터를 조회 및 제공합니다.주요 항목으로 수집일시, 속도, 멈춤여부, 기어수, 휠각도등급값 등이 포함되어 차량의 현재 속도, 주행 중인지 정지 상태인지, 변속기 상태 및 조향 각도 정보를 제공합니다. 이를 통해 자율주행 주행패턴 분석, 차량제어 알고리즘 개발, 실도로 주행 테스트, 주행 안전성 평가 및 교통흐름 시뮬레이션 등 다양한 연구와 개발에 활용할 수 있습니다.*참고자료 및 데이터 다운로드 : FILE탭'
