summary_user: 차세대융합기술연구원이 판교제로시티 자율주행 실증 환경에서 데이터취득차량의 라이다·전후방 카메라로 수집한 센서 원시 데이터를 담는다. 시각별로 라이다 포인트클라우드 파일, 카메라 이미지 파일, 2D 바운딩박스·정밀/중정밀 세그멘테이션 어노테이션 파일의 이름과 경로가 함께 들어 있다. 자율주행 인지 모델을 학습시키거나 검증하려는 연구자가 실제 도로 센서 데이터와 라벨을 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 센서 시각 정보나 파일명 같은 이름 매핑으로만 맞춰 볼 수 있다.
description_portal: '이 데이터는 차세대융합기술연구원이 판교제로시티 자율주행 실증 환경에서 수집한 "데이터취득차량 센서 데이터"로, 자율주행 기술 개발 및 검증을 위한 다차원적 센서 기반 원시 데이터를 제공합니다. 해당 데이터는 자율주행 차량에 탑재된 라이다, 전방 및 후방 카메라 등 복합 센서로부터 획득된 정보를 포함하며, 각 센서로부터 취득된 3D 포인트 클라우드, 이미지 파일, 어노테이션(2D 바운딩박스, 정밀·중정밀 세그멘테이션 등) 등의 메타데이터가 포함되어 있습니다.*참고자료 및 데이터 다운로드 : FILE탭'
