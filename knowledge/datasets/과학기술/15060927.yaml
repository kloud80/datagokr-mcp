summary_user: 과학기술정보통신부에 회선설비 보유 기간통신사업자로 등록된 사업자의 법인명과 법인등록번호를 사업자 1곳당 한 행으로 담은 전국 단위 원장 파일이며, 전체 102행이다. 통신 시장에 어떤 회선설비 보유 사업자가 등록돼 있는지, 특정 법인이 이에 해당하는지를 분석가나 사업자가 확인할 때 쓴다. 법인등록번호(corp_rgst_no)를 키로 다른 기업·사업자 데이터와 이어 쓰며, 이 파일에는 주소나 사업자등록번호가 없다.
