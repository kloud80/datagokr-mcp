description_portal: '과학기술정보통신부에서 제공하는 우리나라 총 연구개발비의 경제사회목적별 비중을 나타내는 통계 데이터입니다. 국가 R&D 투자가 각 경제사회적 목적에 어느 정도의 비율로 배분되고 있는지를 파악할 수 있는 중요한 정책 지표입니다. 데이터는 13개의 경제사회목적별 분류에 따른 연구개발비 비중(%)을 제공합니다: 산업생산및기술, 교통·전기통신등기반시설, 건강, 에너지, 국방, 지식의전반적진보, 환경, 농업, 문화·휴양·종교및매스미디어, 우주개발및탐사, 정치·사회시스템·조직및과정, 교육, 지구개발및탐사.각 분야별 비중의 시계열 변화를 통해 국가 R&D 정책의 우선순위 변화를 분석할 수 있습니다. 이 데이터는 R&D 예산 배분의 적정성 평가, 분야별 투자 비중 국제 비교, 정책 우선순위 설정, R&D 포트폴리오 최적화 등에 활용될 수 있으며, 우리나라 과학기술 정책의 방향성과 균형을 평가하는 지표로 활용될 수 있습니다.'
