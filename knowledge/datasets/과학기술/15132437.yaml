summary_user: 한국인터넷진흥원이 운영하는 개인정보포털의 교육콘텐츠를 콘텐츠 한 건씩 담은 목록 파일로, 제목·소속 코스·화면 크기(가로·세로 픽셀)·공개 및 사용 여부·등록일시·설명을 포함한다. 개인정보 보호 교육을 찾는 국민이나 교육 담당자가 어떤 코스에 어떤 교육 영상·자료가 있고 현재 공개 중인지 확인하는 데 쓴다. 콘텐츠식별자(privacy_content_id)와 코스식별자(privacy_course_id)가 키로 확인돼 같은 포털의 교육 코스 데이터와 코스 단위로 이어 쓰며, 별도 코드표나 지역 코드는 없다.
description_portal: 한국인터넷진흥원에서 운영중인 개인정보포털의 개인정보포털 교육컨텐츠 관련 데이터로, 콘텐츠식별자, 코스식별자, 교육콘텐츠제목, 콘텐츠가로픽셀, 콘텐츠세로픽셀, 콘텐츠유형구분코드, 제작일자, 업데이트일자, 접근권한 정보, 파일형식, 재생시간, 콘텐츠 설명, 관련 키워드 등을 포함하고 있습니다. 이 데이터는 각 교육콘텐츠의 고유 식별정보와 함께 어떤 교육 코스에 속하는지, 콘텐츠의 크기와 유형, 제작 및 최근 업데이트 일자, 접근 권한 설정 현황까지 상세히 파악할 수 있도록 구성되어 있습니다. 또한 파일 형식과 재생 시간, 콘텐츠에 대한 상세 설명 및 관련 키워드를 통해 사용자가 교육 자료를 효과적으로 탐색하고 활용할 수 있게 하며, 교육 운영자가 콘텐츠의 품질 관리 및 최신성 유지, 맞춤형 교육 제공을 원활하게 수행할 수 있도록 지원합니다. 이와 같이 다각적인 정보를 포함한 데이터 구성은 개인정보 보호 교육의 체계적 운영과 관리에 기여합니다.
