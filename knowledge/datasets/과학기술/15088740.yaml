description_portal: '한국나노기술원에서 제공하는 나노소자팹(Fab) 장비별 적용 가능한 기판 정보 데이터는 각 장비가 지원하는 기판의 종류와 규격을 포함하고 있습니다. 본 데이터에는 장비명, 기판 종류(실리콘, 유리, 사파이어 등), 기판 크기(직경, 두께 등), 적용 가능 여부 등이 기록되어 있으며, 연구자와 기업이 실험 및 공정 수행 시 적합한 장비를 선택하는 데 참고할 수 있습니다. 이를 통해 연구개발 효율성을 높이고, 기판별 장비 활용 가능성을 체계적으로 관리할 수 있습니다.* 장비 상세 정보 : 한국나노기술원_나노소자팹서비스 및 연구공정장비 정보(https://www.data.go.kr/data/15037530/fileData.do)에서 확인 가능합니다.* 공란 사유 : 오래된 데이터로 제조사 등 정보 확인 불가'
