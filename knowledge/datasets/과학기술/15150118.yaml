summary_user: TBN 한국교통방송 통합 제보접수시스템에서 지역을 식별하는 기준 목록으로, 방송국(지역) 한 곳당 한 행에 지역코드·방송국명·영문 구분자·2자리 지역이니셜·대표번호·도시명·공문 정렬 순서를 담는 작은 코드표(CSV 760바이트)이며 범위는 전국이다. 교통정보 분석가나 개발자가 제보·교통 데이터에 찍힌 지역코드나 이니셜이 어느 지역 방송국인지, 그 방송국 대표번호가 무엇인지 확인하는 데 쓴다. 지역코드(tbn_region_cd)를 키로 TBN 제보·교통정보 데이터와 매핑하고, 도시명으로 권역을 보조 파악한다.
description_portal: 이 데이터는 한국도로교통공단이 운영하는 TBN 교통방송 ‘통합 제보접수시스템’에서 지역 식별에 쓰는 기준 목록이다. 필드는 지역코드, 지역명(방송국), 지역별 영문 구분자, 제보자별 구분자(지역 이니셜), 지역방송국 대표번호, 도시명, 방송국별 정렬 순서로 구성되며, 지역코드는 방송국의 고유 식별자이고 영문 구분자·이니셜은 시스템 연계, 제보 분류·통계 집계의 참조값, 대표번호는 제보·문의 연결, 도시명은 권역 파악 보조값, 지역 제보자별 구분자(지역이니셜)는 제보 접수·분류 시 사용하는 2자리 영문 이니셜 코드, 방송국별 정렬 순서(공문 기준)는 공문서 표기 시 적용하는 방송국 정렬 우선순위 값이다. 이 목록을 사용하면 접수·처리 단계의 지역 기준을 통일해 오류를 줄이고 지역별 제보 분석과 시스템 연계를 지원하며, 외부 이용자는 지역코드·이니셜을 데이터와 매핑해 교통정보 가공, 대시보드 구축, 연구 분석에 활용할 수 있다.
