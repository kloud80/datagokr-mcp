summary_user: 경기연구원이 발간한 연구보고서를 보고서 한 건 단위로 정리한 목록으로, 보고서 식별번호·과제유형·보고서 구분·연구책임자·발간연도·연구기간·쪽수·ISBN·열람 URL을 담는다. 정책 담당자나 연구자가 '경기도 교통·주거 같은 특정 분야에 대해 경기연구원이 언제 어떤 보고서를 냈는가'를 찾거나 연도별 연구 동향을 살필 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 보고서명·연구자명 같은 이름 매칭이나 ISBN(ISBN_NO)으로 학술문헌 목록과 대조하는 방식으로만 연결한다.
description_portal: '경기도의 출자·출연기관인 경기연구원에서 발행한 연구보고서에 대한 목록 정보입니다. 보고서명, 보고서별 연구기간, 보고서 열람을 위한 URL 정보 등을 제공합니다.※주의사항 : 연구보고서 목록 정보는 제3자의 권리를 포함하고 있지 않습니다. 다만, 연구보고서 자체는 제3자의 권리를 포함하고 있으며, 연구보고서를 열람 이외 다른 목적으로 이용하고자 하는 경우 반드시 각각의 연구보고서에 대한 이용허락 조건을 확인하시기 바랍니다.이 데이터는 경기연구원에서 발간한 연구보고서 목록을 정리한 자료입니다. 주요 항목은 보고서명, 연구자명, 발간연도, 보고서번호, 소속부서 등으로 구성되어 있으며, 각 연구보고서의 고유번호와 주제별 분류를 통해 다양한 정책 및 지역개발 관련 연구성과를 체계적으로 파악할 수 있도록 구성되어 있습니다. 해당 자료는 경기연구원의 정책 개발 과정, 연구성과물 추적, 지역 현안 분석 등에 활용 가능하며, 과거부터 최근까지의 발간 이력을 연도별로 정리함으로써 연구 동향 분석이나 정책기획 자료 조사에 유용하게 사용될 수 있습니다. 각 보고서는 특정 이슈에 대한 정책 제언 및 분석 내용을 포함하고 있으며, 데이터는 학술자료 검색 시스템과의 연계를 통해 더욱 효과적으로 활용할 수 있습니다'
