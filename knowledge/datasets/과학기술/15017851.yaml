description_portal: 한국과학창의재단은 과학기술에 대한 국민의 이해를 높이고 과학문화 확산에 기여하기 위해 매년 우수과학도서를 선정하여 발표하고 있습니다. 과학적 지식과 인문학적 소양을 함께 함양할 수 있는 양질의 도서를 보급하여 독서 문화 활성화를 촉진하고자 합니다.개방 데이터는 2019년도 부터 선정된 우수과학도서 목록입니다. 데이터는 선정연도, 분야(아동, 초등, 중고등, 대학일반/창작, 번역), 도서명, 저자(역자), 출판사 정보를 포함하고 있어, 연령과 목적에 맞는 과학 분야 추천 도서를 쉽게 찾아볼 수 있습니다.전국의 학교 도서관 및 공공도서관은 우수과학도서 목록을 장서 구비 및 추천 도서 선정에 활용하여 양질의 과학 교양 콘텐츠를 제공할 수 있습니다. 학생 및 일반 독자는 신뢰할 수 있는 과학 추천 도서 정보를 바탕으로 폭넓은 과학 지식을 습득할 수 있으며, 출판 및 저작 분야에서는 과학 도서 출판의 동향을 파악하는 데 참고 자료로 활용할 수 있습니다.
