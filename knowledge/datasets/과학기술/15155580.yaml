description_portal: '□ 개요본 데이터셋은 국립과천과학관 상설전시관에 전시 중인 전시물의 수리 및 정비 이력을 체계적으로 정리한 자료입니다. 전시물별 고장 증상과 조치 내역을 기록하여 유지보수 업무를 효율화하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 과거의 고장 및 수리 내역을 분석하여 전시물별 내구성을 평가하고 자주 고장 나는 전시물을 식별할 수 있습니다. 둘째, 고장 유형(하드웨어 파손, 소프트웨어 오류 등)을 파악하여 예방 정비 계획을 수립하고 적정 수리 예산을 산출하는 근거 자료로 활용됩니다. 셋째, 전시관별 수리 빈도와 소요 시간을 분석하여 전시 운영의 안정성을 높이는 데 기여합니다.□ 데이터 구조· 자산번호 : 수리 대상이 된 전시물 또는 자산의 일련번호 (String)· 자산명 : 수리 대상이 된 전시물 또는 자산의 명칭 (String)· 전시관 : 해당 전시물이 위치한 전시관명 (String, 예: 미래상상SF관, 자연사관)· 고장내용 : 접수된 고장 증상 또는 문제점 상세 기술 (String)· 수리내용 : 고장 해결을 위해 수행한 구체적인 조치 사항 (String)· 수리시작일 : 수리 작업이 시작된 날짜 (String, YYYY-MM-DD)· 수리종료일 : 수리 작업이 완료된 날짜 (String, YYYY-MM-DD)'
