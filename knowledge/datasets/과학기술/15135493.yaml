description_portal: '국립중앙과학관 홈페이지 뉴스레터 관련 정보입니다.해당 데이터는 과학기술 관련 기관에서 운영하는 뉴스레터(웹진) 정보를 체계적으로 정리한 목록입니다. 각 뉴스레터는 고유의 발행호수와 제목, 그리고 발행일이 명확히 표기되어 주기적으로 업데이트되는 점이 특징입니다. 홈페이지에 등록된 날짜와 실제 발행일을 모두 기록해 뉴스레터의 공개 시점과 저장 시점을 명확히 구분할 수 있습니다.또한 각 호수별로 조회수 항목이 포함되어 있어, 독자들의 관심도와 뉴스레터의 파급력을 데이터로 확인할 수 있습니다. 뉴스레터 개별 페이지의 접근 가능 여부(공개여부)도 명시되어 있어 활용 및 관리가 용이합니다.- 제공목록 : 번호, 발행호수, 발행일, 등록일, 조회수, URL, 공개여부'
