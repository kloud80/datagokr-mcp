description_portal: '한국수자원공사 보유 지식재산권 목록입니다. - 제공내용 : K-water가 개발한 특허 등 지식재산권 등록 현황- 제공항목 : 특허명칭, 출원번호, 출원일자, 등록번호, 등록일자- 관리부서 : 한국수자원공사 본사 물산업혁신처본 데이터를 통해 이용자는 해당 기술의 법적 보호 상태와 권리 확보 시점을 확인할 수 있습니다. 공공기술의 민간 이전과 활용을 촉진하기 위한 목적으로 공개되며, 민간기업 및 공공기관 등이 필요한 기술 정보를 신속하게 파악하여 사업화 전략을 수립하는 데 활용할 수 있습니다. 또한, 국내 물산업 분야의 기술 혁신과 경쟁력 강화를 지원하고, 지식재산권 기반의 연구개발 및 협력 확대에 기여합니다.'
