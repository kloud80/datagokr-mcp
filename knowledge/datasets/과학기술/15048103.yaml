description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 광주교통방송의 라디오 서비스 수신 품질을 점검하기 위하여 현장에서 수행한 전계 강도 측정 결과를 경로 단위로 정리한 통계이다. 항목은 측정경로명, 지점 좌표(WGS84), 측정일시, 수신 주파수, 전계강도(dBμV/m), 수신등급, 환경메모 등으로 구성한다. 전계강도는 수신전계 세기를 로그 단위로 표기한 값으로, 전파 세기와 수신 난청의 상관을 파악하는 지표이다. 이용자는 경로별·지점별 값을 비교하여 커버리지의 우수 구간과 취약 구간을 식별하고, 도심 고층밀집·터널·산악 지형 등 장애 요인의 영향을 판단할 수 있다.
