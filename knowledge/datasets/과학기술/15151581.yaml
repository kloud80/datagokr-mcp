description_portal: '본 데이터는 국토교통과학기술진흥원에서 추진하는 국토교통 RnD(연구개발) 과제 정보를 개방한 것으로, 국토교통 분야의 연구개발 현황을 한눈에 파악할 수 있도록 구성된 공공 데이터입니다.각 항목은 연구사업의 기본 정보부터 연구 수행 주체, 연구개발 사업비 규모, 참여 인력수 등 주요 메타데이터를 포함합니다.사업연도: 과제가 속한 회계연도 또는 사업이 수행된 연도.세부사업명 / 내역사업명: 정부 RnD 예산 체계상 세부 또는 내역 단위의 사업 구분으로, 연구 과제가 포함된 상위 사업을 나타냄.연구개발과제번호: 각 과제를 식별하기 위한 고유 번호로, 행정관리 및 검색 시 활용됨.연구개발과제명(국문): 연구개발의 주제나 목적을 나타내는 공식 명칭.연구개발시작기간 / 연구개발종료기간: 과제의 수행 기간을 명시하며, 연구의 일정 및 진행 단계를 확인할 수 있음.주관기관명: 과제 수행을 총괄하는 기관(대학, 연구소, 기업 등)의 명칭.총연구개발비(억): 해당 과제에 투입된 총 예산 규모를 억 원 단위로 표시.연구기관역할: 기관이 주관, 참여, 위탁 등 어떤 역할로 참여하는지 구분.연구기관명: 실제 연구 수행에 참여한 기관명.참여연구원수: 과제 수행에 직접 참여한 연구 인력의 수를 나타냄.이 데이터는 국토교통 분야의 연구개발 투자 현황, 기관별 연구역량, 사업별 기술개발 방향 등을 분석하는 데 활용될 수 있으며, 정책 수립, 산학연 협력, 연구성과 확산 등에 유용한 기초 자료로 기능할것으로 예측됩니다.'
