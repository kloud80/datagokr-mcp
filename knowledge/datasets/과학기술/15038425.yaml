description_portal: 「스마트폰 과의존 실태조사」는 스마트폰 사용의 전반적인 현황과 과의존 경향을 파악하여 예방·개선 정책 수립에 활용되는 조사입니다. 주요 항목으로는 일상생활에서의 스마트폰 이용현황과 사용 목적, 빈도, 시간 등을 포함합니다. 또한 온라인 동영상 서비스 이용현황을 통해 OTT 등 플랫폼 콘텐츠 소비 실태를 함께 분석합니다. 아울러 과의존에 대한 대응 체계를 파악하기 위해 과의존 예방 및 상담 서비스 이용현황을 확인하며, 실제 상담기관이나 교육 콘텐츠 이용 여부를 조사합니다. 더불어 과의존을 하나의 사회문제로 인식하고 있는지를 측정하는 과의존 문제 해결에 관한 인식 수준도 포함됩니다. 이러한 정보는 청소년, 성인, 고령층 등 대상별 맞춤형 예방정책 및 교육 프로그램 기획에 필수적인 자료로 활용됩니다.
