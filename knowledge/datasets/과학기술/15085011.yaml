summary_user: 전북특별자치도 정읍시의 도로명주소를 건물·출입구 단위로 담은 파일로, 행정구역·법정동·행정동, 건물명, 건물용도, 도로명, 본번·부번, 도로위계 구분 등을 한 행씩 기록한다. 물류·배송·지도 서비스 사업자나 분석가가 정읍시 안 특정 건물의 도로명주소와 출입구 위치, 해당 도로의 위계를 확인하는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법정동·행정동 이름이나 도로명+본번·부번 같은 이름·주소 매핑으로만 이어 쓴다.
description_portal: 전북특별자치도 정읍시 도로명주소 정보(출입구, 건물일련번호, 건물명, 도로위계구분, 건물용도, 도로명, 본번, 부번)등에 대한 데이터입니다.도로명주소정보를 개방하면 국민은 정확한 위치 기반 서비스를 편리하게 이용할 수 있고, 정부와 지자체는 공간정보 행정의 효율성을 높일 수 있습니다. 또한 민간 기업은 물류·배송·지도 서비스의 정확도를 향상시켜 산업 전반의 경쟁력을 강화하는 효과가 기대됩니다.기타 궁금한 사항은 도로명주소 담당부서인 정읍시청 민원지적과로 문의하시기 바랍니다.
