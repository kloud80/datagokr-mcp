description_portal: 한국가스공사 가스연구원은 천연가스 산업 및 관련 활용분야 연구를 수행중입니다.연구과제 수행을 위해 구축한 연구장비 정보를 제공하고자 하며, 제공 장비데이터 중 일부는 정부 연구과제의 지원을 받아 구축한 장비로써 공동활용이 가능합니다.공동활용 가능여부 및 신청은 국가연구시설포털인 ZEUS를 통해 신청해야 하며, 담당자 승인 이후 공동활용가능 합니다.제공 데이터 상세정보는 다음과 같습니다.국문 연구기자재명, 영문 연구기자재명, 장비 제조국, 장비 제조사, 장비 취득일자, 연구장비의 주요 활용용도 데이터를 제공합니다.
