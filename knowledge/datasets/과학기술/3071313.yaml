description_portal: 과학기술에 대한 국민 이해도가 국가 지식사회의 판단 근거가 됨에 따라, 국민들의 과학기술에 대한 관심, 인식, 태도를 측정하여 과학기술정보통신부 정책 자료 및 과학기술 기초 통계자료로 활용하기 위해 2000년부터 격년 단위로 조사를 시행하고 있습니다. 본 조사는 2018년 12월 1일부터 28일까지 전국의 성인(만 19세~69세) 1,030명과 청소년(만 13~18세) 512명을 대상으로 한 일대일 개별 면접조사 결과입니다.  조사 내용은 과학기술에 대한 관심과 태도, 과학기술 및 과학자에 대한 인식, 4차 산업혁명 및 인공지능(AI) 등 관련 이슈에 대한 태도, 직업 및 진로에 대한 인식, 우리나라 과학기술 수준 평가 및 투자 우선순위, 과학기술 관련 경험 및 교육 관련 인식 등 총 53개 항목으로 구성되어 있습니다.조사 결과는 정부의 과학기술 정책 수립 및 평가, 과학교육 과정 개발을 위한 기초자료로 활용될 수 있습니다. 학계·연구기관은 국민들의 과학기술 인식 변화 추이를 분석하고 과학 대중화 전략을 수립하는 데 활용할 수 있습니다. 또한, 기업은 혁신 제품 및 서비스에 대한 국민의 관심 분야를 파악하여 기술 개발 및 마케팅 전략 수립에 참고할 수 있습니다.
