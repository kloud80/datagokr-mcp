summary_user: 3D 스마트 화재감시 시스템에서 쓰는 도로명코드와 지번주소의 매핑 정보를 주소 건별로 담으며, 시도명·시군구명·읍면동·리명, 지번 본번·부번, 건물 본번·부번, 지하 여부, 산 여부 등을 포함한다. 화재 감지 지점의 도로명주소와 지번을 서로 맞춰 소방서·행정기관에 위치를 전달하거나, 특정 도로명 건물이 어느 지번에 해당하는지 확인하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 도로명코드(roadnm_cd)·법정동코드 값이나 시도·시군구 이름을 매핑해 다른 주소 데이터와 연결해야 한다.
description_portal: 이 데이터는 3D 스마트 화재감시 시스템에서 활용되는 도로명코드와 지번정보 간의 매핑 정보를 제공합니다. 주요 항목으로는 도로명코드, 법정동번호, 시도명, 시군구명, 읍면동일련번호, 지번본번 및 지번부번 등이 포함되어 있으며, 각 주소 요소가 서로 매핑되도록 구성되어 있습니다. 특히 건물본번 및 부번, 리명, 삽번지여부와 같은 세부 정보는 정밀한 위치 식별이 가능하도록 돕습니다. 본 데이터는 화재감시 시스템에서 특정 위치를 주소 기반으로 명확히 지정해야 할 때 활용하고 있습니다. 예를 들어, 센서가 특정 지점에서 화재를 감지했을 때, 해당 위치의 지번과 도로명주소를 일치시켜 행정기관이나 소방서와의 빠른 연계를 가능하게 합니다. 데이터는 도시 공간계획, 소방 안전 전략 수립, 그리고 공공 데이터 기반 위치 분석 연구 등에 활용될 수 있습니다.
