description_portal: '2023년 6월 12일 기준으로 한국데이터산업진흥원에서 운영 중인 데이터 인증 현황에는 데이터품질인증, 데이터관리인증, 데이터보안인증 등의 인증을 획득한 기관 및 기업의 정보가 포함되어 있습니다. 이 데이터는 정부 및 민간기업에서 데이터를 생산하고 관리할 때 기준이 되는 인증 정보로, 데이터의 신뢰성과 안전성을 높이는 데 기여할 수 있습니다. 이 정보는 데이터 활용을 위한 기초 자료로 활용되며, 데이터를 관리하고자 하는 기관이나 기업이 인증을 획득하기 위한 절차와 제도를 이해하는 데 도움을 줄 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.일련번호(숫자형): 고유 식별 번호기관(기업)명(문자형): 인증을 받은 기관이나 기업의 이름인증부문(문자형): 획득한 인증의 종류(예: 데이터관리, 데이터보안 등)인증대상(문자형): 인증의 적용 대상(예: 전체 정보시스템 등)인증취득일자(날짜형): 인증이 취득된 날짜'
