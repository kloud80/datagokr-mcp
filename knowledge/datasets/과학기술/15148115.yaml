description_portal: 이 데이터는 한국데이터산업진흥원에서 운영하는 데이터자격검정 자격시험과 관련하여, 자격명, 과목, 백점, 합격자 수를 제공하는 공공데이터 입니다. 수험생들이 정보를 사전에 확인하고, 시험 준비에 참고할 수 있는 제공되는 자료로, 시험 주최 기관 및 수험생 모두에게 실질적인 편의를 제공합니다. 국가기술검정 (데이터분석, 데이터아키텍쳐, SQL) 및 국가기술자격(빅데이터분석기사) 시험 별 과목, 점수, 과락 점수가 포함된 정보들입니다.과목데이터는 자격명(문자형), 과목명1(문자형),과목명2(문자형), 과목명3(문자형) 과목명4(문자형) 과목명5(문자형), 과목명6(문자형), 과목 총점1(숫자형), 과목 총점2(숫자형), 과목 총점3(숫자형), 과목 총점4(숫자형), 과목 총점5(숫자형), 과목 총점6(숫자형), 과락점수(숫자형), 합격자수(숫자형)으로 구성되어 있으며, 이를 통해 응시생들은 시험 과목별 시험 준비를 할 수 있습니다.
