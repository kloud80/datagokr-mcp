description_portal: '과학기술정보통신부에서 제공하는 국내 기업의 용도별 연구개발비 투자 현황에 대한 시계열 통계 데이터입니다. 기업의 연구개발 활동을 투자 목적에 따라 체계적으로 분류하여 우리나라 민간 R&D 투자의 구조와 변화 추이를 파악할 수 있는 중요한 통계자료입니다. 데이터는 기업의 연구개발비를 4가지 용도로 구분하여 제공합니다: 신제품 개발, 기존제품 개선, 신공정 개발, 기존공정 개선. 각 용도별로 연도별 투자 금액이 억원 단위로 기록되어 있어, 기업들이 혁신활동의 어느 분야에 중점적으로 투자하고 있는지를 시계열적으로 분석할 수 있습니다. 이 데이터는 기업 R&D 투자 전략 수립, 정부의 민간 R&D 지원정책 개발, 산업별 혁신 패턴 분석, 제품혁신과 공정혁신의 균형 평가 등에 활용될 수 있습니다.'
