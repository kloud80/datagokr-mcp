description_portal: 과학기술정보통신부에서 제공하는 이공계 박사 인력의 근로소득 현황 통계 데이터입니다. (2010년) 국내 이공계 분야 박사학위 소지자들의 근로소득을 체계적으로 조사·분석한 자료로, 고급 과학기술 인력의 경제적 처우 실태를 파악할 수 있는 핵심 통계자료입니다.주요 데이터 항목으로는 이공계 박사의 연간 평균 근로소득을 직장유형별(공공연구기관, 기업, 대학, 기타), 성별(남성/여성), 연령별(30대, 40대, 50대, 60대 이상), 전공별(자연계, 공학계, 의약학계), 직종별(관리직, 전문직, 기능사무직, 기타)로 세분화하여 제공합니다. 각 분류별로 상세한 소득 수준을 비교·분석할 수 있도록 구성되어 있습니다. 이 데이터는 박사급 고급인력 정책 수립, 처우개선 방안 마련, 이공계 대학원 진학 유도 정책, 연구인력 경력개발 지원, 기관별 인력 확보 전략 수립 등에 활용될 수 있습니다.
