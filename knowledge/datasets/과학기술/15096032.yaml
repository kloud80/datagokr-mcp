summary_user: 충청남도 계룡시 관내 시설물·토지별로 전 주소(지번 등 기존 주소)와 새로 부여된 도로명주소, 도로명주소 고시일·도로명 고시일, 도로명 부여 사유를 건별로 담은 API이며, 포털 설명상 2021년 9월 1일 기준으로 수집된 시군구 단위 개별 주소 데이터다. 계룡시 안의 특정 옛 주소가 어떤 도로명주소로 바뀌었는지, 그 도로명주소가 언제 왜 부여됐는지 확인하려는 주민·사업자·주소 정비 담당자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 전 주소나 도로명주소 문자열을 맞추는 이름 매핑, 또는 계룡시라는 같은 기관 단위로만 연결한다.
limits: 법정동코드·도로명코드 같은 공통 조인 키가 없어 다른 주소·건물 데이터와 이으려면 주소 문자열 매칭에 의존해야 한다. 범위가 계룡시 한 곳에 한정되며, 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
