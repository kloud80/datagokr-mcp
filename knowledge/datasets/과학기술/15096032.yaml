description_portal: 충청남도 계룡시의 '도로명주소 정보 API' 데이터는 관내의 모든 시설물 및 토지에 대한 도로명 주소와 관련된 상세 정보 및 변동 이력을 실시간으로 제공하는 공간 정보 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 도로명주소 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 기존 주소였던 전 주소와 새로 부여된 도로명 주소 정보, 그리고 도로명 주소의 고시 일 및 도로명 자체의 고시 일이 포함됩니다. 또한, 주소를 변경하거나 부여하게 된 도로명 부여 사유까지 제공됩니다.
