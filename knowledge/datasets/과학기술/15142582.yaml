summary_user: 연구개발특구 입주기관 통계조사 대상기관을 기관 한 곳당 한 행으로 담은 건별 명부로, 특구지역·지구·조직형태·기관(기업)명·지번 주소를 포함하며 2023년 12월 31일 기준이다. 분석가나 사업자가 '대덕·광주 등 특정 특구 지구에 어떤 형태의 기관과 기업이 입주해 있는가'를 확인하거나 특구별 입주기관 분포를 지도로 그리는 데 쓴다. 실측에서 전역 조인 키는 없어서, 다른 특구 데이터(연구소기업·사업화 공개기술 등)와는 기관명이나 특구지역코드·조직코드 같은 재단 내부 코드를 맞춰 연결하고, 주소는 지오코딩해 행정구역 데이터와 잇는다.
limits: 2023년 말 한 시점의 조사 결과라서 이후 입주·퇴거 변동은 반영되지 않으며, 일부 컬럼에 공란이 있다. 사업자등록번호·법인번호 같은 공통 식별자가 없으므로 다른 기관 데이터와 붙일 때 기관명 매칭 오류에 주의한다.
