description_portal: 한국인터넷진흥원 대표홈페이지 데이터베이스에 저장된 게시글_NIDA 정보는 다양한 컬럼으로 구성되어 있으며, 이를 통해 게시물의 성격과 상태를 체계적으로 관리할 수 있습니다. ‘게시판코드’는 해당 게시물이 속한 게시판을 식별하는 코드이며, ‘자료번호’는 각 게시글의 고유 식별 번호입니다. ‘서브자료번호’는 하나의 게시글 내에서 추가 자료나 첨부 항목을 구분할 때 사용됩니다. ‘게시물분류’는 게시글의 내용을 유형별로 분류하는 정보이며, ‘제목’은 게시글의 주제를 나타냅니다. ‘HTML여부’는 게시글 내용이 HTML 형식으로 작성되었는지를 구분하며, ‘조회수’는 게시글의 열람 횟수를 기록합니다. ‘메인게시여부’는 해당 게시물이 홈페이지 메인 화면에 노출되는지를 나타내고, ‘지속여부’는 게시글을 장기적으로 유지할지를 지정하는 값입니다. ‘대표게시여부’는 특정 게시물을 대표 콘텐츠로 설정했는지를 구분하며, ‘공지일’은 게시글이 공지사항으로 지정된 날짜입니다. ‘등록일시’는 게시글이 최초 등록된 시간, ‘수정일시’는 수정된 마지막 시점을 의미하며, ‘사용여부’는 현재 해당 게시글이 노출되고 있는지를 표시합니다. 이러한 컬럼은 게시글의 등록, 분류, 노출, 유지 여부 등을 관리하는 데 필수적인 정보로 구성되어 있습니다.
