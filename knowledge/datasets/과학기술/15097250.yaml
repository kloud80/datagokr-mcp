summary_user: 구미시에 설치된 공공와이파이를 설치 지점별로 한 건씩 담은 원천 목록으로, 설치장소명·상세 설치장소·도로명주소와 위도·경도 좌표, 서비스 제공자, SSID 등을 담는다. 시민이나 방문객이 "내 주변 어디에서 무료 와이파이를 쓸 수 있나"를 찾거나, 분석가가 구미시 안에서 와이파이가 부족한 지역을 가려내는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소나 좌표로 위치를 맞추거나 같은 기관 데이터끼리 이름을 대조해 잇는다.
description_portal: 경상북도 구미시의 공공와이파이 현황에 대한 데이터로, 시민과 방문객들이 자유롭게 이용할 수 있는 공공 무선인터넷 서비스에 대한 정보를 제공합니다. 해당 데이터에는 서비스 제공자명, 와이파이 SSID, 설치장소명, 상세 설치장소, 도로명주소 등이 포함되어 있어, 공공와이파이가 설치된 위치를 쉽게 파악할 수 있으며, 정보 접근성과 통신 편의성을 높이는 데 활용될 수 있습니다. 이 데이터는 모바일 환경에서의 정보 이용을 활성화하고, 디지털 격차 해소에 기여할 수 있는 기반자료로 활용됩니다.
