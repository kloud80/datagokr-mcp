summary_user: 국내 학술지별·기준연도(STAN_YR)별로 연도별 피인용 횟수, 자기인용 제외 피인용, 게재 논문 수와 영향력지수·KOR FACTOR·ZIF·즉시성지수 같은 인용 지표를 담은 학술지 단위 집계 데이터다. 연구자나 학술지 운영자가 "이 학술지의 최근 몇 년간 영향력지수와 자기인용 비중은 어떻게 변했나"를 확인하거나 투고·평가 대상 학술지를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 학술문헌 데이터와는 학술지 ID(SERE_ID)·ISSN·학술지명 매핑으로만 연결한다.
description_portal: KCI 인용 정보 서비스는 국내 학술지의 인용 현황, 자기 인용, 논문 수, 영향력 지수 등의 다양한 인용 관련 데이터를 제공합니다. 학술지별로 연도별 피인용 횟수, 논문 수, 자기 인용 횟수, 임팩트 팩터, KOR FACTOR, ZIF, 즉시성 지수 등 주요 지표를 포함하고 있으므로, 학술지의 영향력과 연구 성과를 다각도로 분석할 수 있습니다. 이 서비스는 연구자, 평가기관, 학술지 운영자 등이 학술지의 인용 동향을 파악하거나 연구 성과를 평가하고, 학술지 선정 등에 활용할 수 있는 중요한 정보를 제공합니다.
