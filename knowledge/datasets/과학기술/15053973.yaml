description_portal: '과학기술정보통신부에서 실시하는 이공계인력 실태조사 중 업무분야별 비중에 관한 통계 데이터입니다.(2008년) 이공계 인력들이 현재 수행하고 있는 업무의 비중과 향후 희망하는 업무 비중을 비교 분석한 자료로, 이공계 인력의 업무 선호도와 경력개발 방향성을 파악할 수 있습니다. 데이터는 교육, 연구개발, 조직관리, 행정, 기타 등 5개 업무분야로 구분되어 있으며, 각 분야별로 현재 업무비중(A), 희망 업무비중(B), 증가율((B-A)/A)의 3개 항목으로 구성되어 있습니다.이 데이터는 이공계 인력정책 수립, 인재 육성 및 활용 전략 개발, 조직 내 업무 배분 최적화, 이공계 인력의 경력개발 지원 방안 마련 등에 활용될 수 있습니다.* 컬럼: 구분, 교육, 연구개발, 조직관리, 행정, 기타'
