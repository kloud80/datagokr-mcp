description_portal: '한국데이터산업진흥원 데이터바우처 사업을 통해 지정된 공급기업 중 데이터 가공기업 정보를 제공하고 있습니다. 본 데이터는 데이터바우처 지원사업에 참여하는 기업들의 정보를 포괄적으로 다룹니다. 특히, 수요기업이 필요로 하는 다양한 형태의 데이터 가공 서비스에 대한 정보를 제공함으로써, 데이터 활용의 범위를 넓히고, 기업의 데이터 기반 의사결정을 지원하는 역할을 합니다. 이 데이터가 보유한 컬럼은 다음과 같습니다.기업한글명(문자형) : 해당 기업의 한글 이름설립일자(날짜형) : 기업이 설립된 날짜기본주소(문자형) : 기업의 본사 주소상세주소(문자형) : 기업의 주소에 대한 추가 정보주요서비스 상세정보(문자형) : 데이터 가공기업이 제공하는 구체적인 서비스 내용보유솔루션(문자형) : 기업이 보유한 해결책 및 시스템에 관한 상세 정보품질확보전략(문자형) : 데이터 품질 확보를 위한 기업의 전략유지보수전략(문자형) : 데이터 가공 서비스 후속 지원 계획카테고리구분(문자형) : 제공하는 데이터 가공 서비스의 카테고리 분류등록일(날짜형) : 데이터가 등록된 날짜실적(문자형) : 기업의 성과와 실적기업개요 및 핵심역량(문자형) : 기업의 전반적인 설명과 주요 전문성활용사례(문자형) : 데이터 및 서비스를 활용한 실제 사례링크(URL) : 데이터에 대한 추가 정보 및 접근 링크'
