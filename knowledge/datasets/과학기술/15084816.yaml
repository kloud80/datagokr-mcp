description_portal: KCI 접속기록 조회 서비스는 학술지인용색인 시스템의 이용 현황을 분석할 수 있도록 접속 일시, 검색어, 서비스 구분, 사용자 세션 등 다양한 접속 기록 데이터를 제공합니다. 이 데이터는 검색 연월일, 시간, 요일, 사이트 구분, 회원 로그인 여부, 검색 분류 등의 정보를 포함하고 있어 이용자의 서비스 접근 패턴과 검색 행태를 파악하는 데 용이합니다. 학술지 운영자, 연구자, 시스템 관리자 등이 사용자 트래픽을 분석하거나 서비스를 개선하고, 이용자에게 최적화된 맞춤형 서비스를 기획하는 데 효과적으로 활용할 수 있습니다.
