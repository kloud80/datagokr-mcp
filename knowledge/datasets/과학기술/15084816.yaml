summary_user: KCI(학술지인용색인) 시스템의 접속·검색 기록을 건별로 담으며, 접속 연·월·일·시·요일, 사이트 구분, 사용자 세션, 검색 분류와 검색어(SEARCHKEYWORD) 등을 포함한다. 시스템 관리자나 학술 정보 분석가가 '어떤 시간대·요일에 KCI 검색이 몰리고 이용자들은 주로 어떤 검색어로 찾는가'처럼 이용 패턴과 검색 행태를 파악하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 다른 KCI 논문·학술지 데이터와는 검색어 같은 이름을 맞추는 방식으로만 느슨하게 연결한다.
limits: 전역 조인 키가 없어 논문·학술지·연구자 데이터와 직접 결합하기 어렵다. 공간 정보가 없는 전국 단위 기록이라 지역별 이용 분석에는 쓰지 못한다. 개발계정은 하루 5,000회 호출로 제한된다.
