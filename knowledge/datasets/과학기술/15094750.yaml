summary_user: 제주특별자치도 공공 와이파이 사용량을 기준년월·분기별로 성별, 연령대, 와이파이 유형(정류장·관광지·버스 등 장소·설치 형태)으로 나눠 집계한 통계로, 건별 접속 기록이 아니라 집계값이다. 정책 담당자나 분석가가 관광지와 버스 같은 와이파이 유형 중 어느 곳을 어떤 연령대·성별이 많이 쓰는지 비교해 설치·확대 우선순위를 정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년월이나 유형 이름을 맞추는 방식, 또는 같은 제주도 기관 데이터끼리만 이어 쓸 수 있다.
description_portal: '이 데이터셋은 2018-01-01부터 2020-12-31까지 제주특별자치도 내 공공 와이파이의 ‘유형별’ 사용량 현황을 성별, 연령대, 유형 구분(예: 장소 유형, 고정형/이동형 등) 기준으로 집계한 통계자료입니다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과 입니다. 형식은 CSV로 공개되어 있어 누구나 무료 다운로드 가능하며, 유형별로 어떤 와이파이(예: 정류장, 관광지, 버스·이동형 등)가 어느 연령대, 성별에서 얼마나 사용되었는지 분석할 수 있습니다. 이 자료는 공공통신 인프라 이용 패턴 분석, 관광객 vs. 도민의 인터넷 사용 유형 연구, 장소 유형별 데이터 수요 평가, 스마트관광·스마트시티 정책 수립, 지역별 디지털접근성 진단 등에 유용합니다. 다만 데이터는 2020년 말 기준까지이며 이후의 와이파이 설치 확대, 사용 행태 변화, 인구 이동 변화 등은 반영되어 있지 않을 수 있습니다.'
