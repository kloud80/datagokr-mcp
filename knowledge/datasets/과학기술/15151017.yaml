description_portal: 한전KDN CHA-ON 전기차 충전요금 데이터는 국내 전기차 충전소에서 발생한 실제 충전 이력을 기반으로 구축된 데이터로, 충전소 정보(충전소ID, 충전소명, 우편번호 등)와 충전기에 연결된 커넥터 식별값, 충전 시작 및 종료 시각, 총 충전 시간, 그리고 충전 과정에서 부과된 실제 요금(합계)을 포함하고 있습니다. 특히 본 데이터는 충전요금 산정 결과를 주요 항목으로 제공하며, 시간대·충전량·충전기 특성 등에 따른 요금 변동 분석, 요금제 정책 검토, 충전 인프라 운영 효율성 개선 등을 위한 기초자료로 활용할 수 있습니다.- 데이터 등록 시간 기준 충전 중인 차량의 경우 종료일시 및 충선시간 데이터가 공란으로 표시되며, 요금이 0원으로 표시됩니다.-  일부 위치 또는 운영 주체 식별정보는 개인정보 및 시설 보안정책에 따라 비식별화 또는 범주화되어 제공될 수 있습니다.
