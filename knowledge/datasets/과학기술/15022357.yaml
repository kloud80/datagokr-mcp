description_portal: '위치정보사업자  현황으로 개인위치정보사업자 및 위치기반서비스사업자 허가/ 신고 현황 자료.속성은 연번, 사업자명, 해당서비스명, 허가신고구분, 해당날짜로 구성.위치정보산업을 제도화하면서 위치정보 오남용 피해를 방지하고, 산업의 공정경쟁 확보와 시장 활성화 등을 위해, 제공하는 서비스의 유형과 수집하는 정보를 기준으로 차등 규제를 마련.-개인위치정보사업 : 사생활을 직접적으로 침해할 위험성이 높은 개인위치정보를 수집,제공하는 사업자는 기술적 능력과 위치정보 보호조치를 갖추는 것이 필요하며, 이를 위해 등록제로 운영.- 위치기반서비스업 : 위치정보사업자로부터 위치정보를 제공받아 사업을 운영하는 위치기반서비스사업자는 완화된 진입규제인 신고제로 운영.'
