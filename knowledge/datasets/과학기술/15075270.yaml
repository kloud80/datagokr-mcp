description_portal: 우정사업본부가 제공하는 오픈 API로, 인터넷우체국에서 판매 중인 알뜰폰 요금제 정보를 조회할 수 있는 서비스입니다. 개발자는 공공데이터포털에서 발급받은 인증키를 사용하여 REST(GET) 방식으로 API를 호출하고, 요금제 목록을 응답받습니다.이 API를 통해 통신망(KT, SKT, LGU+), 알뜰폰 업체명, 요금제명, 월 기본료뿐만 아니라, 기본으로 제공되는 음성(분), 문자(건), 요금제 초과데이터단가(원/MB)의 정보까지 상세하게 확인할 수 있습니다. getAlddIChargeList라는 오퍼레이션을 통해 데이터를 제공받습니다.
