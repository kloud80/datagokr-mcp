summary_user: 인터넷우체국에서 판매하는 알뜰폰 요금제를 요금제 한 건씩 담은 전국 단위 목록으로, 통신망·알뜰폰 업체명·요금제명·월 기본료와 기본 제공 음성·문자·데이터, 초과 사용 단가를 함께 제공한다. 소비자가 '월 사용량에 맞는 우체국 알뜰폰 요금제 중 가장 싼 것은 무엇인가'를 비교하거나, 분석가가 통신망·업체별 알뜰폰 요금 수준을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 통신사명·업체명 같은 이름 매칭으로만 연결된다.
limits: 다른 데이터와 직접 이을 공통 코드가 없어 업체명·통신망명을 맞춰야 한다. 개발계정은 하루 10,000회로 호출이 제한된다. 우정 부문 정리 방침에 따라 우편번호·배달·주소 외 데이터로 분류되어 전략 시스템의 주 활용 대상에서는 제외됐다.
