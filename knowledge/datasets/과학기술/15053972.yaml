description_portal: 과학기술정보통신부에서 실시하는 이공계인력 실태조사 중 국외에서 박사학위를 취득한 인력의 전공별, 대륙별 분포에 관한 통계 데이터입니다.(2007년)우리나라 이공계 고급인력의 해외 학위 취득 현황을 파악하여 국제적 인재 육성 및 활용 정책 수립에 기여하는 자료입니다. 데이터는 4개 전공 분야(공학, 이학, 농림수산학, 의약학)와 3개 대륙(북미, 아시아, 유럽)으로 구분되어 있으며, 각 전공별로 대륙별 인원수와 비중을 제시하고 있습니다. 이 데이터는 이공계 인력의 국제적 교육 동향 분석, 해외 우수인재 유치 전략 수립, 국제 공동연구 네트워크 구축, 과학기술 국제협력 정책 개발 등에 활용될 수 있습니다.
