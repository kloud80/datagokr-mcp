summary_user: 인공지능·웨어러블 로봇·유전자가위 분야 특허 출원을 건별로 담은 가공 파일(CSV 약 371MB)이다. 각 행에는 대분류(구분), 기술분야, 4차산업 해당 여부, CPC 분류코드, 출원번호, 제목, 핵심 기술 대표문단과 이들의 형태소 분석 결과가 들어 있다. 연구자나 기업 분석가가 '유전자가위 분야에서 어떤 기술 주제의 출원이 많은가'를 살피거나 특허 문서 분류·검색용 AI 모델을 학습시키는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다만 출원번호와 CPC 코드를 매개로 KIPRIS 등 다른 특허 서지 데이터와 이름·코드 매핑 방식으로 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않았다. 따라서 출원인 법인·사업자 정보와 바로 연결되지 않으며, 다른 데이터와는 출원번호·코드 매핑으로만 붙여야 한다. 범위는 전국·비공간이라 지역별 분석에는 쓸 수 없다.
