description_portal: 한국항공우주연구원에서 연구 개발한 한국의 로켓 개발 현황을 체계적으로 정리한 데이터입니다. 과학로켓부터 우주발사체까지 한국의 독자적인 로켓 기술 발전 과정을 담고 있으며, 각 로켓 프로그램의 상세 정보를 제공합니다. 데이터에는 1단형 과학로켓(KSR-I), 2단형 과학로켓(KSR-II), 액체추진 과학로켓(KSR-III), 나로호(KSLV-I), 누리호(KSLV-II) 등 주요 로켓의 개발기간, 제원(높이, 직경, 중량), 발사일자, 기술적 특징 등이 포함되어 있습니다. 각 로켓의 개발 목적과 달성 성과도 함께 기록되어 있습니다. 이 데이터의 최신자료는 우주항공청 소관의 한국항공우주연구원을 통해 새로운 목록으로 업데이트 될 수 있습니다.
