description_portal: 본 데이터 사용자의 이해도를 돕기위해 본 데이터에 대하여 간단하게 설명하면 충청북도에 영업소재지를 두고 있는  정보통신공사업체에 대하여 정보통신공사업법 및 시행령 제 23조(공사업자의 변경신고사항)에 따른  행정처분 현황을 순번, 등록번호, 상호, 대표자, 등록구분, 처분기준, 처분일자, 처분확정일자로 데이터를 구분하여 제공함으로써 처분현황의 중요성 및 이해도를  높일 수 있도록 쉽게 작성하였습니다. 정보통신공사업법 및 같은법 시행령에서는 대표자, 상호, 기술자, 영업소소재지, 자본금 등 변경신고사항이 발생했을 경우 해당일로부터 30일 이내에 변경신고를 하여야 하고, 30일 경과 후 3개월이내 신고한 경우와 3개월을 경과하여 지연신고를 한 경우를 구분하여 3개월 이내시 50만원의 과태료가, 3개월을 초과하여 신고한 경우 100만원의 과태료를 부과대상입니다. 또한, 대표자, 기술자, 자본금 등 정보통신공사업 등록기준에 미달할 경우 영업정지 및 과징금 등 행정처분 대상입니다.그러나 평소 정보통신공사업을 준수하고 일시적으로 지연신고를 한 경우 정보통신공사업법 시행령 제58조(과태료의 부과기준)에 의거 50%감면이 가능하며 사전납부하는 경우 추가로 20% 할인된 금액으로 과태료를 납부하게 됩니다. 우리도에서는 과태료 징수 등 업체의 행정처분을 줄이고자  상반기, 하반기 2회 신규등록 정보통신공사업체를 대상으로 실태조사를 실시하고  변경신고사항이 발생했을 경우 30일 이내에 변경사항을 신고토록 적극 홍보하여 불필요한 행정처분을 받지 않도록 안내하고 있습니다.
