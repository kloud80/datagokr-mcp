description_portal: 국토교통과학기술진흥원에서는 연구개발 과제를 국민과 산업계, 전문가가 함께 발굴하고 기획하는 참여형 연구개발 체계를 마련하기 위해 개방형기획을 추진하고 있습니다. 이는 기존 연구자가 주도하던 방식에서 벗어나 다양한 이해관계자의 의견을 수렴하여 실제 사회문제 해결과 산업 현장 수요를 반영하는 과제를 도출하는 것이 핵심입니다. 개방형기획은 정책 연계성, 산업 적용성, 국민 체감 효과를 강화함으로써 연구성과의 활용도를 높이고 국가 혁신성장에 기여합니다. 또한 협력적 연구 생태계를 구축하여 국토교통 분야의 지속가능한 미래 비전을 실현하는 기반을 마련합니다.
