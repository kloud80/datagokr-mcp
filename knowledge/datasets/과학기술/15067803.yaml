description_portal: 본 데이터는 한국도로교통공단이 운영하는 한국교통방송(TBN)의 교통정보 제공 및 활용 실적을 집계한 통계 목록이다. 필드는 제공기간, 지역국·권역, 제공채널, 제공유형, 제공건수, 조회수, 이용주체로 구성된다. 목록은 채널별 도달 성과와 이용 행태 파악의 근거가 되어 서비스 개선과 성과관리, 대외보고서 작성에 쓰인다. 데이터는 집계 단위로 제공되며 개인정보는 포함하지 않는다. 명칭·단위는 내부 기준에 따라 표준화되어 기계처리에 적합하다. 동일 스키마로 기간·지역·채널 기준 비교·검색·시각화가 용이하다. 요약하면 교통정보 제공의 양적 지표를 구조화해 채널 효율 분석과 KPI 산출을 지원한다.
