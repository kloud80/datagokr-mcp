summary_user: 연구개발특구에 입주한 기업·기관별로 주요 생산품을 한 행씩 담은 파일 데이터로, 입주기관명·생산품과 함께 광역 특구 구분(지역)과 세부 지구를 기록한다. 특구 입주기업을 찾는 사업자나 지역·지구별로 어떤 제품군 기업이 모여 있는지 보려는 분석가가 '대덕특구 어느 지구에 어떤 제품을 만드는 기업이 있나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 특구 입주기관·연구소기업 목록과는 입주기관명 같은 이름 매칭으로만 이어 쓴다.
description_portal: '본 데이터는 2025년 8월 25일 기준 연구개발특구진흥재단에 입주한 기업들의 생산품 현황을 정리한 자료입니다. 각 입주기업별, 지역별, 지구별로 생산품 정보를 포함하고 있어, 이를 통해 특구 내 지역 및 지구별 동향 분석에 활용할 수 있습니다.데이터 항목데이터는 다음 5개의 컬럼으로 구성되어 있습니다.번호: 개별 데이터 구분을 위한 일련번호입주기관명: 연구개발특구 내 입주 기업 또는 기관의 명칭생산품: 해당 기업이 생산하거나 제공하는 주요 제품지역: 기업이 위치한 광역 연구개발특구 구분지구: 해당 기업이 속한 세부 지구활용 유의사항일부 입주기업은 생산품 정보를 기재하지 않아 공란으로 표시될 수 있습니다.본 데이터는 특정 시점(2025년 8월 25일)을 기준으로 작성되었으며, 이후 변동 사항은 반영되지 않을 수 있습니다.'
