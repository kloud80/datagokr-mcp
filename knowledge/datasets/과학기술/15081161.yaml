description_portal: 한국지능정보사회진흥원(NIA)와 협약을 맺어 대전광역시 스마트쉼센터에서 진행하는 인터넷 및 스마트폰 과의존 예방해소사업의 운영 실적을 상세히 기록한 자료입니다. 2022년 기준 과의존 예방교육과 가정방문 상담 실적 등을 포함하며, 청소년과 성인을 대상으로 한 예방 활동의 효과성 평가와 정책 수립에 중요한 기초 자료로 활용됩니다. 관련 법규 및 개인정보 보호 기준을 준수하여 관리되며, 보건복지, 교육 등 다양한 분야의 데이터와 연계되어 종합적인 과의존 예방 전략 마련에 기여합니다. 또한, 체계적인 데이터 구조로 가공과 분석이 용이해 다양한 연구 및 행정 업무에 활용됩니다.
