description_portal: 한국과학창의재단은 학교 교육과정과 연계하여 학생들의 꿈과 끼를 키우는 창의적 체험활동을 지원하기 위해, 전국에 분포된 다양한 체험 자원 정보를 수집하여 제공합니다. 이를 통해 교사와 학생들이 손쉽게 지역 사회의 인적·물적 자원을 발굴하고 교육 활동에 활용할 수 있도록 돕고자 합니다.개방 데이터는 전국의 창의적 체험활동 자원 182개소의 목록입니다. 데이터는 각 자원의 소재 지역, 분류(관공서, 연구시설, 체험시설, 복지시설 등), 시설명, 주소, 연락처 정보를 포함하고 있어, 학교 밖 현장 체험 및 학습을 위한 장소를 물색하는 데 유용하게 활용될 수 있습니다.전국의 초·중·고등학교 교사들은 본 데이터를 활용하여 창의적 체험활동, 자유학기제, 동아리 활동, 봉사활동 등 다양한 현장 교육을 계획하고 추진할 수 있습니다. 지역 교육지원청 및 지자체는 관내 체험 자원 현황을 파악하고 학교와의 연계를 지원하는 정책을 수립하는 데 참고 자료로 활용할 수 있으며, 학생과 학부모는 학교 밖 학습 및 체험 활동 장소를 탐색하는 데 도움을 받을 수 있습니다.
