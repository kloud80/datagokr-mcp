description_portal: 국립낙동강생물자원관은 생물자원의 산업적 활용 확대와 기술경쟁력 강화를 위해 자체 연구를 기반으로 한 기술개발을 추진하고 있으며,이에 따라 확보된 보유기술에 대한 정보를 공공데이터로 개방하고 있습니다.개방 데이터는 분야, 기술명, 기술개요, 주발명자, 출원인, 상태, 출원일자, 출원번호, 등록일자, 등록번호 등으로 구성되어 있습니다. 해당 데이터는 학계·연구기관에서 생물자원 기반 기술의 연구 동향 분석, 기술 상용화 가능성 검토, 협력 기술개발 전략 수립 등에 활용될 수 있으며, 기업 및 창업 지원기관은 출원정보 기반의 특허동향 파악, 기술이전 타당성 검토, 사업화 가능 기술 발굴 등 실질적 산업 연계 분석 자료로 활용할 수 있습니다.
