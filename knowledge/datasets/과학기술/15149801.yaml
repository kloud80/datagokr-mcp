description_portal: '데이터 개요본 데이터는 「연구개발특구의 육성에 관한 특별법」에 근거해 지정된 전국 연구개발특구 내 각 지구별 입주기업 허용 업종 정보를 제공하고 있습니다. 연구개발특구는 광역특구 및 강소특구로 구분되며, 각 특구별 세부 지구로 구성되어 있으며, 각 지구별 입주 가능 업종은 국가 산업분류 기준에 따라 관리된다. 본 데이터는 지구별 허용 업종명을 표준화된 분류 코드와 함께 제시하고 있습니다.데이터 구성특구: 입주 허용 업종이 속한 광역 연구개발특구 명칭 (예: 대덕, 대구, 부산 등)지구: 각 특구 내 세부 지구 명칭 (예: 국제산업 물류도시(1단계), 연구단지 지구 등)허용업종명: 해당 지구에서 입주가 가능한 업종명 (표준산업분류 기준 업종)분류코드: 통계청 한국표준산업분류(KSIC) 코드(5자리)활용 방법창업 및 기업 입주 안내 : 입주 희망기업이 지구별 허용업종을 확인하여 입주 가능 여부를 판단할 수 있습니다.연구 및 분석 자료 : 학계 및 연구기관이 지역별 산업 분포 현황을 분석하는 데 활용할 수 있습니다.'
