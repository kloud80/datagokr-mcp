summary_user: 전국 연구개발특구(광역특구·강소특구)의 세부 지구별로 입주가 허용된 업종명과 한국표준산업분류(KSIC) 5자리 코드를 한 행씩 담은 목록형 파일(CSV, 약 2.1MB)이다. 입주를 검토하는 기업이 '우리 업종(KSIC 코드)이 대덕특구의 어느 지구에 들어갈 수 있나'를 확인하거나, 연구자가 특구별 허용 산업 구성을 비교하는 데 쓴다. 전역 조인 키는 없으므로 분류코드(KSIC)를 매개로 사업자·산업통계 데이터와 잇거나, 특구·지구 이름을 매핑해 같은 재단의 입주기관·연구소기업 데이터와 연결한다.
limits: 실측 컬럼에서 공통 조인 키가 확인되지 않아 다른 데이터와는 특구·지구 이름이나 업종코드 매핑으로만 연결된다. 비공간 데이터라 지구의 경계·위치 정보는 담지 않는다.
