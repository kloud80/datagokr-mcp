description_portal: 4차 산업혁명 시대를 맞이하여 소프트웨어(SW)와 인공지능(AI) 교육의 중요성이 강조됨에 따라, 체계적이고 다양한 교육 콘텐츠에 대한 필요가 증가하고 있습니다. 이에 초등학생부터 고등학생, 일반인까지 활용할 수 있는 SW·AI 관련 교재 및 교육 자료 목록을 제공하여 디지털 교육 기반을 강화하고 미래 인재 양성을 지원합니다.개방 데이터는 총 72건의 SW·AI 교육 자료 목록으로 구성되어 있습니다. 자료는 대상에 따라 초등교재 34건, 중등교재 14건, 고등교재 3건, 교사용/학습용 지도서 18건, 일반 3건으로 분류됩니다. 각 자료는 인공지능(AI), 코딩, 게임 개발, 사물인터넷(IoT), 가상현실(VR), 무인자동차 등 다양한 주제를 포함하고 있습니다.일선 학교의 교사들은 정규 교과과정, 동아리 활동, 진로 지도 등에서 학생들의 수준과 흥미에 맞는 교재를 선택하고 활용하는 데 도움을 받을 수 있습니다. 학생들은 자기주도적 학습 자료로 활용하여 SW·AI 분야의 역량을 키울 수 있으며, 교육 정책·연구 기관은 국내 SW·AI 교육 자료 현황을 파악하고 향후 교육 과정 개발 및 정책 수립을 위한 기초 자료로 활용할 수 있습니다.
