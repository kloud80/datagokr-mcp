description_portal: '본 데이터는 인공지능 학습용 데이터 구축사업에 참여한 기관들의 정보를 연도별, 과제별로 정리한 자료입니다. 공공·민간 협업 기반의 데이터 구축 사업에서 기관별 참여 현황을 확인하고, 협력 구조 및 과제별 역할을 파악할 수 있습니다.데이터는 다음과 같은 항목으로 구성됩니다:사업년도 : 데이터 구축 과제가 수행된 연도과제명 : 각 기관이 참여한 데이터 구축 과제의 명칭구분 : 기관의 참여 구분 (예: 주관기관, 참여기관 등)기관명 : 해당 과제에 참여한 기관의 명칭이 데이터는 과제별 참여기관 구성을 확인하고, 민관 협력 기반의 AI 학습용 데이터 생태계 구축 현황을 분석하는 데 활용할 수 있습니다. 정책 분석, 협력모델 도출, 향후 사업계획 수립 등에 유용한 기초자료로 사용됩니다.'
