description_portal: '○ 통계개요* 통계명 : 인터넷쇼핑 이용률 및 이용빈도* 통계종류 : 지정통계, 승인번호(12005)* 근거법령 : 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제52조* 작성목적 : 급속히 변화하는 국내가구의 인터넷 이용환경 및 국민의 인터넷 이용현황과이용행태 등을 파악하여 관련 정책수립과 연구활동 등 다양한 영역에서 활용할 수 있도록 기초자료 및 정보 제공을 목적으로 함* 조사체계 : 조사원→전담조사기관→한국인터넷진흥원→미래창조과학부* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 인터넷쇼핑 이용률 및 이용빈도율○ 용어설명* 이용률 : 만12세 이상 인터넷 이용자 중 최근 1년 이내 인터넷쇼핑을 이용한 자의 비율* 인터넷쇼핑(유료콘텐츠 포함) : 인터넷을 통해 상품 및 서비스를 구입하는 행위. 쇼핑몰,중고거래, 소셜커머스 등 웹사이트 이용 및 기프티콘, 스마트폰 웹 구매 등모바일 기반 구매 행위를 모두 포함'
