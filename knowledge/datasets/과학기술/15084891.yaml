summary_user: KCI(한국학술지인용색인) 시스템 안에서 공통으로 쓰는 국가·진행상태·메뉴 등 공용코드를 코드그룹(CDDIVCD)·언어별로 코드값, 코드명, 코드설명, 사용여부와 함께 한 행씩 담은 코드 사전이며, 범위는 전국·비공간이다. KCI 논문·학술지 API를 다루는 개발자나 분석가가 응답에 나온 코드값이 무슨 뜻인지, 현재도 쓰는 코드인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 기관(한국연구재단) KCI 데이터의 코드값을 코드그룹과 코드값으로 이름 매핑해 붙이는 방식으로만 연결한다.
description_portal: KCI 공용코드 조회 서비스는 국내 학술지 정보, 논문 정보 및 참고 문헌을 데이터베이스화하여 각 서지 정보, 인용 정보, 통계 자료, 논문 간 인용관계 분석 등을 제공하는 한국학술지인용색인 (KCI) 시스템의 시스템 내 공통으로 사용하는 공용코드 데이터에 대한 상세정보를 조회할 수 있는 서비스입니다. 제공하는 데이터는 코드구분 (코드그룹), 언어코드, 코드값, 코드명, 코드설명, 사용유무 등으로 구성되어 시스템 내에서 공통으로 사용되는 국가 코드, 진행상태 코드, 메뉴 코드 등 다양한 코드에 대한 상세정보를 제공합니다.
