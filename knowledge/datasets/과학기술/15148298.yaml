description_portal: 국토교통과학기술진흥원(KAIA)에서 추진중인 열린기획은 기술수요조사와 병행하여 추진하는 개방형 기획 활동입니다. 온라인 플랫폼을 통해 국민, 기업, 연구자 등 다양한 이해관계자로부터의 의견을 수렴하고, 이를 바탕으로 R&D 과제를 설계하고 기획하는 절차입니다. 개방형 기획에는 특정 주제에 대한 "기획연구명"과 "기획기간" 등이 ㅁ여시된 다양한 연구 기획이 포함됩니다. 열린기획은 기존 전문가 중심의 폐쇄적 기획방식을 넘어 현장의 다양한 수요와 사회적 요구를 직접 반영하는 것이 핵심입니다.
