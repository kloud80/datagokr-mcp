description_portal: '이 데이터는 AI허브에서 제공하는 인공지능 학습용 데이터셋의 전체 현황을 담고 있으며, 각 데이터의 구축년도, 명칭, 적용 분야(예: 농축수산, 한국어, 헬스케어 등), 데이터 유형(예: 이미지, 음성, 텍스트 등), 데이터셋 소개 및 실제 활용 가능한 다운로드 링크 정보를 포함합니다. AI 모델 개발자, 연구자, 기업 등이 특정 목적에 맞는 데이터를 빠르게 탐색하고 적합한 학습용 자료를 선택·활용할 수 있도록 지원하는 기초 인프라 데이터입니다. 특히 구축연도 정보는 데이터의 최신성과 신뢰도를 판단하는 데 유용하며, 분야별 구분은 도메인 특화 모델 개발을 위한 기초자료로 활용될 수 있습니다. AI산업 생태계 전반에서 데이터 접근성과 활용도를 제고하는 데 기여합니다.'
