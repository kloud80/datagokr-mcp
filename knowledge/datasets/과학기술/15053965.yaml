description_portal: 과학기술정보통신부에서 제공하는 이공계인력 근로소득 실태조사 통계 데이터입니다.(2011년) 국내 이공계 전문인력의 근로소득 현황을 체계적으로 조사한 자료로, 이공계 인력의 경제적 처우와 고용 현황을 파악할 수 있는 중요한 통계자료입니다. 주요 데이터 항목으로는 전체 평균 근로소득과 표준편차, 성별(남/여), 연령대별(20대부터 60대 이상), 전공별(자연계, 공학계, 의약학계), 직장유형별(기업, 공공연구소, 대학, 기타), 직종별(관리직, 전문직, 기능직/사무직, 기타), 최종학위별(박사) 등 다양한 분류 기준에 따른 근로소득 통계가 포함되어 있습니다. 각 항목별로 평균값과 표준편차를 제공하여 분포 현황을 상세히 파악할 수 있습니다. 이 데이터는 이공계 인력정책 수립, 처우개선 방안 마련, 진로지도 및 경력개발 지원, 인력수급 계획 수립 등에 활용될 수 있습니다.
