description_portal: 전국 도로명 변경 현황에 대한 자료(2013년~)이고, 도로명 변경 전 이름, 도로명 변경 후 이름, 위치, 시군구, 변경일자, 고시일, 변경사유 등의 내용을 텍스트파일로 제공합니다.도로명 변경 전후 이름 등을 함께 제공하여 도로명 명칭 변경내용 및 변경사유 등의 사항 확인이 용이합니다.도로명 변경 현황자료 "변경유형" 열의 1~4의 의미는 다음과 같습니다.1. 마을이름, 지역명칭 반영 변경2. 개발 및 구획정리에 따른 변경3. 부정적 어감 및 이미지 개선4. 기타주소정보누리집(juso.go.kr)에 접속하시면, 보다 자세한 정보를 확인하실 수 있습니다.
