summary_user: 인천 동구(현 제물포구) 관내 방송융합시스템 키오스크로 송출되는 관광정보를 장소 한 건씩 담은 원장으로, 제목·설명·주소·좌표·이용시간·휴무일·입장료·문의처·이미지파일명 등을 포함한다. 방문객이나 지역 관광 분석가가 '이 일대 관광지가 어디 있고 언제 문을 여는가'를 확인하거나 지도에 관광지 위치를 표시할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 관광지 이름 매칭으로만 잇는다.
description_portal: 본 데이터는 인천광역시 동구 관내에 설치된 방송융합시스템 KIOSK를 통해 송출되는 관광정보의 세부 내용을 수록한 자료이다. 방송장비별 설치 위치, 관광정보 제목 및 설명, 운영 시간, 이미지, 문의처 등 다양한 항목으로 구성되어 있으며, 좌표 정보를 통해 지도 기반의 위치 확인도 가능하다. 본 시스템은 실시간 관광 정보 제공을 통해 방문객의 편의를 높이고 지역 관광 활성화를 도모하기 위한 목적을 가진다. 데이터는 휴무일,  시설 규모 등 상세한 관리 정보도 포함하고 있어 정책 수립 및 운영 모니터링에 활용 가능하다. 특히 이미지 파일명, 등록 시간 등의 항목은 콘텐츠 관리 및 이력 추적에 유용하며, 민간 콘텐츠 플랫폼과의 연계 활용 가능성도 내포하고 있다. 본 자료는 관광 관련 데이터 분석, 정보 시각화, 스마트관광 기반 구축 등에 활용될 수 있다.
