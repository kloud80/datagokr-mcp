description_portal: '- 한국방송광고진흥공사에서 발생하는 지상파 방송광고에 대해 업종별 대분류, 중분류, 소분류 코드 데이터를 제공합니다. * 해당 업종 분류는 방송광고 업계에서 활용하고 있는 표준화 자료입니다.- 개방 데이터는 업종코드, 업종명, 시작일자, 종료일자, 입력자, 입력일자 등으로 구성되어 있으며, 중분류 및 소분류 데이터의 경우 상위 업종코드가 포함되어 있습니다.- 학계 및 연구기관에서 국내 방송분야 광고시장 분석에 앞서, 업종 구분에 대한 현황 파악이 필요한 경우 기초자료로 활용할 수 있으며, 정책 지원이 필요한 업종을 구체화할 수 있습니다.'
