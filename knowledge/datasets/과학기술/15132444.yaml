description_portal: 한국학술지인용색인(KCI)에 등재된 논문의 연도별 현황을 제공하는 데이터입니다. 학술지별 논문 수, 저자 수, 참고문헌 수 등의 주요 상세 지표가 포함되어 있습니다. 해당 데이터는 국내 학술연구의 성장 추이, 연구자 및 학술지의 활동 현황, 인용 동향 분석 등의 목적으로 활용할 수 있습니다. 또한 학술정책 수립, 연구성과 평가, 학문 분야별 발전 현황 파악 등의 다양한 연구 및 행정 목적의 활용에도 적합합니다. 연간 주기로 업데이트되며, 수정일자를 기준으로 최신 연구 동향을 반영하여 학술정보 분석 및 연구성과 관리에 유용한 기초 자료로 활용 가능합니다.
