description_portal: '- 한국방송광고진흥공사에서 1987년부터 2013년까지 발간한 광고총서신서의 목록을 제공합니다.  * 2014년 이후 광고총서신서의 발간이 중지되어 추가 업데이트 내역은 없습니다.- 개방 데이터는 도서명, 저자명, 발행년도 총 3개 항목으로 이루어져 있으며, 행은 총 48건입니다. - 최근 다변화된 광고시장과 비교하여 과거 네덜란드, 독일, 영국, 프랑스, 호주, 이탈리아, 중국, 미국, 일본 등 나라별 광고산업 및 방송광고, 공익광고, 광고전략에 대한 조사 및 연구가 필요한 학계 및 연구기관에서 기초자료로 활용할 수 있습니다.'
