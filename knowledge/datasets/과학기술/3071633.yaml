description_portal: 1. 개요특허가 포함된 국제표준이 증가함에 따라 중요성이 날로 부각되고 있는 표준특허와 관련하여 주제별/이슈별 동향분석 보고서를 제공합니다. 2. 세부 정보 내용LTE, 국제표준화기구, RFID, 유럽전기통신표준기구, NPEs, 퀄컴 등 동향분석 보고서본 보고서는 표준특허와 관련하여 주제,이슈별로 국내외 동향을 분석한 자료이며, 2019년판의 사례로는 아래와 같은 항목을 포함합니다.특허를 포함하여, 국제표준이 증가하는 추세인 배경을 설명보고서별로 표준화 기구의 역할 변화, 기업 및 기관의 SEP 확보 전략, 관련 정책환경의 변화, 동향 변홛 등의 정보를 제공합니다.
