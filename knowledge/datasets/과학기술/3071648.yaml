description_portal: 한국 특허청 및 관련 기관에서 제공하는, “표준특허(Standard Essential Patent, SEP 혹은 일반적으로 ‘표준을 포함하거나 표준 제정과 관련된 특허’)”과 관련된 정책, 전략, 분석, 길라잡이 등을 정리한 문헌 자료 외 기타 내용을 정리한 자료입니다.1. 개요특허가 포함된 국제표준이 증가함에 따라 중요성이 날로 부각되고 있는 표준특허와 관련한 설명 자료 및 통계 자료를 제공합니다. 2. 세부 정보 내용표준화기구,/표준특허의 용어의 정의, 기타 통계 자료 정보3. 데이터 출처표준특허센터 홈페이지http://www.epcenter.or.kr/
