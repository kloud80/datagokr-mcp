description_portal: '본 데이터는 한국데이터산업진흥원이 추진하는 데이터바우처 지원사업에서 선정된 데이터가공 공급기업 목록과 이들 기업이 제공하는 홈페이지 주소를 수록하고 있습니다. 데이터바우처 지원사업은 데이터 가공 및 활용이 가능한 기업을 발굴하고 이들에게 필요한 지원을 제공함으로써, 데이터 산업의 활성화를 도모하고자 하는 프로그램입니다. 이 데이터는 공공기관이나 연구기관, 개인 등이 데이터 가공 서비스의 제공자를 쉽게 찾을 수 있도록 도와주며, 데이터 생태계 조성을 위한 기초적인 자료로 활용될 수 있습니다. 또한 공공 및 민간 부문에서 데이터 가공 요구에 적합한 공급기업을 손쉽게 검색 및 조사할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.지정연도(숫자형): 데이터바우처가 적용된 연도기업명(문자형): 선정된 데이터가공 공급기업의 공식 명칭홈페이지(문자형): 해당 기업의 공식 웹사이트 주소'
