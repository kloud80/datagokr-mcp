description_portal: 한국과학창의재단은 비대면 시대에 맞춰 국민들이 시공간의 제약 없이 과학문화를 향유할 수 있도록 전국의 다양한 온라인 과학문화 프로그램 정보를 통합하여 제공합니다. 이를 통해 디지털 과학 활동을 활성화하고 과학문화 콘텐츠에 대한 국민의 접근성을 강화하고자 합니다.개방 데이터는 2020년부터 2021년까지 진행된 온라인 과학 교육, 캠프, 축제, 강연 등 88건의 프로그램 상세 정보입니다. 각 데이터는 프로그램의 제목, 분류, 대상, 운영 플랫폼, 정확한 행사 시작일과 종료일, 주최 기관 및 공식 홈페이지 링크 정보를 포함하여 사용자가 원하는 비대면 과학 활동을 편리하게 찾아 참여할 수 있도록 구성되어 있습니다.학생 및 일반 시민은 자신의 관심사에 맞는 온라인 과학 프로그램을 찾아 원격 학습 및 교양 활동으로 활용할 수 있습니다. 각급 학교 교사들은 온라인 수업이나 창의적 체험활동의 보조 자료로 활용하여 수업의 질을 높일 수 있으며, 과학문화 관련 기관은 비대면 프로그램의 기획 및 운영 동향을 파악하고 벤치마킹하는 데 기여할 수 있습니다.
