description_portal: 한국과학기술원 국내특허 정보는 한국과학기술원이 연구개발 활동을 통해 창출한 성과 중 국내에 출원 또는 등록된 특허에 대한 정보를 제공하는 데이터이다. 본 데이터는 특출원일자,출원번호,등록일자,등록번호,대표발명자,공동발명자,기술명,기술분야등 특허의 기본적인 관리 정보를 포함하고 있으며, 연구성과의 권리화 현황을 체계적으로 파악할 수 있도록 구성되어 있다.해당 정보는 연구성과 관리, 기술이전 및 사업화 분석, 연구 정책 수립 및 공공 연구성과 활용을 위한 기초 자료로 활용될 수 있다.특허 세부 항목의 정의 및 코드 설명은 관련 내부 관리 기준에 따라 제공되며, 데이터 활용 시 최신성 및 권리 상태를 반드시 확인할 필요가 있다. 데이터 특성상 일부 항목은 개인정보 및 권리 보호를 위해 제한될 수 있다.
