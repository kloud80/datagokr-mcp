description_portal: 국내 특허공보(특허, 실용신안, 디자인, 상표)의 등록 관련 사항을 링크 형식으로 제공하여 한 눈에 확인할 수 있는 데이터입니다.국내 특허공보에 대한 등록 기본사항 정보를 링크 형태(DOI_URL)로 제공하는 것을 특징으로 합니다.등록 기본사항이란 등록일자, 등록번호, 등록여부 등 특허가 등록된 상태인지와 관련된 기본 정보들을 말합니다.링크 형태로 제공되기 때문에 사용자가 해당 특허공보 문서(온라인) 중 등록 관련정보를 직접 확인할 수 있도록 연결됩니다.등록기본사항 링크, 특허 공보의 종류, 공보 공개일 또는 등록일자, 고유 식별정보 등이 제공됩니다.
