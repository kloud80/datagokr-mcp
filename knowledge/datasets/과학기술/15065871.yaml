summary_user: 2025년 기준 국가과학기술표준분류의 대·중·소분류 코드와 분류명을 계층 단위로 담은 코드표 파일(CSV, 약 150KB)이다. 국가R&D 과제나 연구 성과를 분석하는 연구자·기획자가 "이 과제의 분류코드가 어떤 연구분야를 뜻하는가"를 확인하거나 분야별로 묶어 집계할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, NTIS 과제·성과 데이터에 들어 있는 과학기술표준분류 코드나 분류명을 이 표의 소분류코드·분류명과 매핑하는 방식으로 이어 쓴다.
description_portal: 2025년 기준 국가과학기술표준분류에 대한 정보입니다.국가과학기술표준분류란 과학기술 관련 정보의 관리, 유통, 과학기술 인력 관리, 국가연구개발사업의 효율적 기획,관리를 위한 과학기술전분야의 분류 틀로, 국가연구개발사업의 연구기획평가 및 관리, 과학기술예측 및 기술수준평가, 과학기술 정보의 관리·유통 등에 활용되고 있는 데이터입니다. 연구분야와 적용분야 분류 등 2차원의 분류체계로 구성되어있으며, 해당 데이터가 보유한 컬럼은 다음과 같습니다.컬럼명:대분류코드, 대분류코드명, 중분류코드, 중분류코드명, 소분류코드, 소분류코드명
