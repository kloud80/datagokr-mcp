summary_user: KCI(한국학술지인용색인) 시스템의 DOI 발급 관련 정보를 조회하는 API로, DOI 기탁에 참여한 학회·저널, 논문과 참고문헌, 기탁 내역과 결과, DOI 패턴, 인용 링크 정보를 담는다(실측 응답은 기관 식별자·국문명·영문명·기탁 구분·기탁일자·기탁 파일명 등의 기탁 내역 형태). 학술지 담당자나 서지 분석가가 '특정 학회·저널이 언제 어떤 파일로 DOI를 기탁했고 결과가 어떤가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 학술·R&D 데이터와는 학회·저널 이름 매핑이나 같은 기관 코드(INSIID)로만 연결한다.
description_portal: KCI DOI 정보서비스는 국내 학술지 정보, 논문 정보 및 참고 문헌을 데이터베이스화하여 각 서지 정보, 인용 정보, 통계 자료, 논문 간 인용관계 분석 등을 제공하는 한국학술지인용색인 (KCI) 시스템의 디지털 객체 식별자 (DOI) 발급 관련 데이터에 대한 상세정보를 조회할 수 있는 서비스입니다. KCI DOI 정보서비스의 주요 기능으로 DOI 기탁에 참여한 학회 및 저널 정보 조회, 관련 논문 및 논문에 포함된 참고문헌 정보 조회, DOI 기탁 내역 및 기탁 결과 정보 조회, DOI 패턴 정보 조회, 인용 링크 정보 조회 등이 포함됩니다.* 디지털 객체 식별자(Digital Object Identifier)는 온라인 상에서 유통되는 디지털 콘텐츠의 지적 재산권 보호를 목적으로 각 콘텐츠에 부여되는 숫자+영문 결합 형태의 고유한 식별번호로 학술 자료의 정확한 식별과 관리를 통해 정보에 대한 접근성을 높이고 자료의 이용 및 인용을 용이하게 합니다.
