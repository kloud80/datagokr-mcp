description_portal: 본 데이터셋은 고령자의 일상 행동을 인식할 수 있는 휴먼케어 로봇을 위한 대용량 RGB-D 데이터셋입니다.고령자가 생활하는 실제의 가정환경을 모사한 테스트베드 환경을 실제 31평형 아파트에 구축하였으며 50명의 고령자와 50명의 일반 성인으로 구성된 총 100명의 대상자를 모집하였습니다.대상자가 행하는 일상행동 55종에 대하여 다양한 로봇 시점에서 Kinect v2 카메라를 이용하여 RGB 비디오, 깊이영상, 바디인덱스, 그리고 3차원 관절의 위치를 획득하였습니다. 최종적으로 112,620 셋의 3차원 데이터를 확보하였습니다.공공데이터포털에 있는 파일은 샘플데이터이며 전체 데이터는 nanum.etri.re.kr에서 다운받으실 수 있습니다.
