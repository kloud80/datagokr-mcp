description_portal: 우리나라와 시청각 공동제작협정을 체결한 뉴질랜드를 포함하여 한류 신흥 유망 국가인 남아프리카공화국, 멕시코, 필리핀의 4개 국가를 조사 대상으로 선정하고 각국의 방송규제 현황, 방송시장 현황, 주요 플랫폼별 사업자 현황 및 방송콘텐츠, 한국 방송프로그램 이용행태 및 만족도, 국제방송공동제작에 대한 인식 등을 조사하였다. 특히 업계 의견수렴을 활용한 현지 방영 방송콘텐츠 조사, 현지 온라인 설문 조사 등 다양한 조사방법을 활용하여 기존 해외 방송시장 관련 보고서와 차별화되는 동시에 신뢰도 높은 결과물을 도출하고자 노력하였다.본 조사결과는 국내 사업자의 해외 진출 전략 수립뿐만 아니라, 정부 차원의 공동제작협정 체결을 위한 기초 자료로 활용되어 한국 방송콘텐츠의 해외 진출활성화에 기여할 것으로 기대된다.
