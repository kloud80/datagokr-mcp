description_portal: 한국과학창의재단의 사이언스타임즈 메인뉴스 데이터는 특정 시점에 사이언스타임즈 홈페이지에 노출된 주요 기사 목록을 정리한 자료이다. 이 데이터는 총 8개의 기사 정보 목록으로 구성되어 있으며, 각 기사는 번호, 순위, 요약정보, ‘제목’이라는 네 가지 속성을 가진다. 번호는 각 기사에 부여된 고유 식별자로, 웹사이트 내부에서 해당 기사를 호출하거나 접속 경로를 구성할 때 사용되는 핵심 값이다. 순위는 기사가 메인 화면에서 어떤 우선순위로 노출되었는지를 나타내며, top1, top2, top3 같은 형태로 기록된다. 이는 사용자의 눈에 가장 먼저 띄는 대표 기사부터 상대적으로 우선순위가 낮은 메인 기사까지의 배열 순서를 의미한다.요약정보는 제목과 별도로 제공되는 짧은 설명 문구로, 기사의 핵심 주제나 배경을 간략하게 소개한다. 이를 통해 독자는 제목만으로 파악하기 어려운 기사 내용을 한 문장으로 빠르게 이해할 수 있다. 마지막으로 제목은 실제 기사 헤드라인으로, 독자의 관심을 끌기 위해 구성된 대표 문장이다.전체적으로 이 데이터는 메인 뉴스의 특성을 파악하고, 어떤 과학 주제가 해당 시점에 주목받았는지 분석하는 데 유용하다. 기사 요약 문구와 제목의 관계를 살펴보거나, 메인 뉴스 선정 기준 및 편집 방향을 이해하는 데도 활용할 수 있다. 데이터 규모는 작지만, 메인 페이지에 노출된 핵심 콘텐츠만을 담고 있다는 점에서 사이트의 편집 의도를 반영하는 의미 있는 자료라고 할 수 있다.
