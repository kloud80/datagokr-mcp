description_portal: '한국지능정보사회진흥원(NIA)에서 추진한 ‘스마트쉼 캠페인’의 세부 과제 수행 정보를 담은 데이터입니다. 각 캠페인의 프로그램명을 비롯하여 프로그램의 유형(예: 강연, 체험, 상담 등), 진행 기간(시작일~종료일), 개최 장소 및 지역, 주관 기관, 참여 인원 등을 포함합니다. 이 데이터는 디지털 과의존 해소와 바람직한 스마트기기 사용문화 조성을 위한 전국 단위 실천활동의 현황을 파악하는 데 유용합니다. 또한 지역별 추진 성과 비교, 기관별 참여 현황 분석, 향후 정책 수립 및 교육 프로그램 기획 시 기초자료로 활용될 수 있습니다. 디지털 포용사회 실현을 위한 공공 캠페인 운영 실적을 정량적으로 분석할 수 있는 기반 데이터입니다.'
