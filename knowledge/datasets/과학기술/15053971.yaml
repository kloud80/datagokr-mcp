description_portal: 과학기술정보통신부에서 제공하는 이공계 박사학위자의 전공별 학위 취득장소 분포 통계 데이터입니다.(2007년) 국내 이공계 박사인력의 교육 배경과 국제화 수준을 파악할 수 있는 중요한 통계자료로, 전공분야별 국내외 박사학위 취득 현황을 체계적으로 정리하였습니다. 주요 데이터 항목으로는 4개 전공분야인 공학, 이학, 농림수산학, 의약학별로 국내 취득 인원수와 비중(%), 국외 취득 인원수와 비중(%)을 제공합니다. 각 전공별로 국내외 박사학위 취득 비율의 차이를 명확하게 비교할 수 있도록 구성되어 있으며, 전공별 교육 국제화 수준과 해외 유학 선호도를 파악할 수 있습니다. 이 데이터는 이공계 인력의 글로벌 역량 평가, 교육 국제화 정책 수립, 해외 우수인력 유치 전략, 전공별 교육정책 차별화, 국내 대학원 경쟁력 강화 방안 마련 등에 활용될 수 있으며, 국가 과학기술 인력의 질적 수준 향상을 위한 정책 수립의 기초자료로 활용됩니다.
