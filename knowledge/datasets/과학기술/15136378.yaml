description_portal: 본 데이터는 기초과학연구원에서 운영하는 희망연구단 신청 관련 정보를 포함한다. 희망연구단은 연구자가 주도적으로 제안하는 창의적이고 도전적인 연구 주제를 중심으로 구성되며, 연구단 명칭, 제안자, 연구목표, 모집 시기, 심사 절차, 지원 요건 등의 정보를 제공한다. 해당 데이터는 연구기획 초기 단계의 정보공개를 통해 투명성과 참여 기회를 확대하는 데 목적이 있다. 이를 통해 연구자는 관심 분야의 공모 정보를 사전에 확인하고 제안 준비를 체계적으로 진행할 수 있으며, 기관은 우수한 연구제안 발굴과 연구역량 강화를 기대할 수 있다. 데이터는 정기적으로 갱신되며, 연구개발 정책 수립과 공공 과학기술 기획에 활용될 수 있는 기초 자료로 제공된다.
