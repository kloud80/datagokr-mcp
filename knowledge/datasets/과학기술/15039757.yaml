description_portal: '연제구_CCTV 심볼정보는 부산광역시 연제구청이 제공하는 GIS 기반 CCTV 위치 데이터셋으로, 각 CCTV의 위·경도 좌표와 지도 레이어별 심볼 정보를 포함합니다. 이 데이터는 도시 안전 관리와 교통 흐름 파악을 위해 시각화·분석에 활용될 수 있도록 설계되었습니다.데이터는 CSV와 GeoJSON 형식으로 제공되며, 주요 필드로는 CCTV 고유번호, 위도, 경도, 심볼 종류(예: 원형, 사각형), 레이어 구분(주요도로, 주거지역 등)이 포함됩니다. 최신 정보는 연 2회 정기 업데이트되며, 좌표계는 WGS84를 기준으로 합니다.활용 예로는 실시간 감시 지도 구축, 위험 지역 분석, 스마트 시티 플랫폼 연계, 학술 연구 등이 있습니다. 이용 시에는 개인정보 보호와 보안 정책을 준수하고, 데이터 출처를 명시해야 합니다.'
