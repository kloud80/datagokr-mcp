description_portal: 한국인터넷진흥원이 제공하는 ‘주요국가별 IPv4·IPv6 주소 및 AS번호 순위’ 데이터는 전 세계 국가들이 보유한 인터넷주소자원의 규모와 순위를 정량적으로 비교할 수 있도록 구성된 핵심 통계자료이다. 이 데이터는 국가별 IPv4 및 IPv6 주소 보유량과 자율시스템번호(AS번호)의 분포, 세계 순위, 대륙 순위, RIR별 순위를 함께 제공하여 글로벌 인터넷 인프라 수준을 종합적으로 파악할 수 있도록 지원한다. 또한 각 국가의 네트워크 자원 확대 추세, 인터넷주소 고갈 현상, 디지털 인프라 경쟁력 등과 관련된 연구와 정책 분석에 활용되며 국제 인터넷 자원 관리 전략 수립에도 유용한 기초 자료로 사용된다. 주요 컬럼은 유형, 대륙, 국가, 세계순위, 대륙순위, RIR순위, RIR, 국가코드, 개수로 구성된다.
