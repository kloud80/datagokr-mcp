description_portal: 기술개발자(개인 또는 법인)의 개발의욕을 고취시킴으로서 국내 건설기술의 발전을 도모하고 국가경쟁력을 제고하기 위해 "건설기술 진흥법"에 따라 국내에서 최초로 개발한 건설기술 또는 외국에서 도입하여 개량한 것으로 국내에서 신규성·진보성 및 현장적용성이 있다고 판단되는 건설기술에 대하여 신기술로 지정된 기술에 대한 목록입니다. 건설신기술은 건설공사의 품질 향상과 효율성을 높이기 위해 개발된 창의적이고 혁신적인 기술로, 국토교통부가 심사하여 지정합니다. 지정된 기술은 공공사업에 우선 적용될 수 있는 혜택을 받습니다.
