description_portal: 이 데이터는 국립중앙과학관이 제공하는 한반도 희귀생물 분야 3D프린팅 설계 정보를 담고 있으며 총 342건의 레코드를 구조화해 제공합니다. 각 항목에는 한글명·영문명·분류(식물·곤충·조류·어류·포유류 등)·주제·매체·제작일·출력방식·자료제공기관·자문위원 정보가 체계적으로 기록돼 있습니다. FDM·CJP·MJP·DLP·POLYJET 등 다중 출력방식을 지원하며 해당 표본은 국내 과학관·박물관이 소장한 희귀·고유 생물을 기반으로 3D 모델로 재구성된 설계 자료입니다. 모든 데이터는 국립중앙과학관 자체 창작 저작물로 출처표시·변경금지 조건의 공공저작물로 무료 제공됩니다. 연구용 3D 시각화, 교육 보조자료, 디지털 전시, 문화유산 보존 등 다양한 분야에서 활용할 수 있습니다.
