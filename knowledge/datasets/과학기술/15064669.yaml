description_portal: 2019년 10월  집중국간 차량운송데이터(발송집중국, 도착집중국, 운송거리 등)에 대한 정보입니다.2019년 10월 한 달간 우정사업본부의 우편집중국 간 차량운송 데이터이며, 전국적으로 총 27,757회의 차량 운송이 이루어졌으며, 이를 통해 이동한 거리는 총 6,174,891km에 달합니다. 이 기간 동안 처리된 우편물량은 등기소포 약 3,017만 건, 등기통상 약 588만 건, 국내특급 약 1,652만 건으로, 막대한 양의 물류의 흐름을 보여주는 데이터 입니다. 대전교환센터는 발송과 도착 양쪽 모두에서 가장 많은 운송 횟수를 기록하여, 전국 우편물류의 핵심 허브 역할을 수행하고 있음을 명확히 보여줍니다.
