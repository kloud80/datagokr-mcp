summary_user: 판교제로시티에 설치된 CCTV 영상의 이미지 단위 메타데이터를 담으며, 녹화 시작·종료 일시, 이벤트 유형, 날씨, CCTV·이미지 고유번호, 이미지 크기, 이미지 파일과 2D 바운딩박스 어노테이션 JSON 파일의 이름·경로가 한 행에 들어 있다. 자율주행·객체 인식 연구자가 "특정 날씨나 이벤트 상황의 교차로 CCTV 영상 학습 데이터를 어떻게 골라 받을까" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 CCTV 고유번호나 이미지 고유번호를 같은 기관(경기도) 판교제로시티 자율주행 데이터와 이름·번호로 맞춰 이어 쓴다.
description_portal: '서울대학교 연구소 차세대융합기술연구원 판교제로시티 자율주행 데이터 조회 서비스 중 판교제로시티 CCTV 데이터를 2D 바운딩박스 형식으로 구성한 자료입니다. 자율주행 서비스 개발의 기반 마련을 위해 판교제로시티에서 수집, 가공한 자율주행 인프라 및 실증 데이터를 조회 및 제공합니다.주요 항목으로 녹화시작일시, 녹화종료일시, 이벤트유형, 날씨정보, CCTV고유번호, 이미지고유번호, 이미지너비, 이미지높이 등이 있으며, 각 영상에 대한 어노테이션 데이터는 별도의 JSON 파일로 제공됩니다. *참고자료 및 데이터 다운로드 : FILE탭'
