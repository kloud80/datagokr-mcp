description_portal: '- 한국방송광고진흥공사 대표 홈페이지의 2019년 이후 국가별 접속 현황 데이터를 제공합니다.- 개방 데이터는 년, 월, 일, 접속국 한글명, 접속국 영문명, 접속국별 접속수, 사이트프리픽스 총 7가지 항목으로 이루어져 있습니다.- 접속국은 대한민국, 미국, 중국, 일본, 러시아, 베트남, 프랑스, 캐나다, 홍콩, 인도네시아, 영국, 호주, 태국, 독일 등 다양한 국가로 구성되어 있습니다.- 공공기관 대표 홈페이지의 구축 및 활용 현황 파악 및 연구를 위해 주요 접속국 현황 자료가 필요한 연구기관 및 학계, 기관에서 기초자료로 활용할 수 있습니다.'
