description_portal: 한국과학창의재단의 사업관리 공고정보는 재단이 매년 추진하는 다양한 사업에 참여할 기관이나 연구자를 모집하기 위해 게시하는 공식 안내 자료를 정리한 데이터이다. 이 공고정보에는 공고가 게시된 연도, 공고 제목, 공고 상태, 공고가 시작되고 종료되는 날짜, 그리고 홈페이지에 공개되었는지 여부 같은 기본 행정 정보가 포함된다. 예를 들어 생활과학교실 지역운영센터 운영기관 모집 공고, 디지털튜터양성센터 운영기관 모집 공고, 대학부설 과학영재교육원 공동 전략과제 등 여러 분야의 사업이 포함되어 있으며 교육, 과학문화, 디지털 역량 강화 등 폭넓은 사업 성격을 보여 준다.이러한 사업관리 공고정보는 어떤 사업을 언제 어떤 방식으로 추진하는지 한눈에 파악할 수 있는 자료로서 활용될 수 있으며, 연도별 사업 추세 분석, 분야별 사업 분류, 공고 기간 분석 등 다양한 형태의 정책 및 행정 분석의 기초 데이터로도 유용하게 활용된다.
