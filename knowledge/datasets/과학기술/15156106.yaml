description_portal: 한국인터넷진흥원이 제공하는 ‘월별 전세계 IPv4 및 IPv6 주소와 AS번호 할당 추이’ 데이터는 글로벌 인터넷자원의 증가 흐름을 월 단위로 분석할 수 있도록 구성된 핵심 통계자료이다. 이 데이터는 세계 각 지역에서 실제로 할당된 IP주소 및 AS번호의 변화를 지속적으로 기록하여 인터넷 인프라 성장 속도와 네트워크 확장 규모를 객관적으로 파악할 수 있게 한다. 특히 IPv4 주소 고갈 문제에 따른 IPv6 전환 상황, 국가 및 지역별 네트워크 수요 증가 패턴, 인터넷 자원 관리 정책의 효과 등을 분석하는 데 중요한 근거 자료로 활용된다. 주요 컬럼은 유형, 개수, 연월로 구성되며 연구기관, 공공기관, 통신사업자 등에서 글로벌 인터넷 환경 변화와 기술 정책 수립을 위한 기초 데이터로 널리 사용된다
