description_portal: 4차 산업혁명 시대를 맞이하여 소프트웨어(SW)와 인공지능(AI) 교육의 중요성이 날로 증대됨에 따라, 한국과학창의재단은 누구나 쉽고 재미있게 SW와 AI를 체험하고 학습할 수 있는 기회를 제공하기 위해 "온라인 코딩파티"를 매년 개최하고 관련 데이터를 제공하고 있습니다.개방 데이터는 2016년부터 2022년까지 매년 2회씩(시즌 1, 2) 진행된 "온라인 코딩파티"의 행사별 상세 정보를 포함하고 있습니다. 각 행사별로 행사명, 행사 기간, 참여 기업 수, 전체 참가자 수, 그리고 미션을 최종 완료한 이수자 수에 대한 데이터를 약 14개 행사에 걸쳐 제공합니다.해당 데이터는 교육계 및 연구 기관에서 시기별, 시즌별 온라인 코딩 교육에 대한 대중의 관심도 및 참여율 변화 추이를 분석하는 데 활용될 수 있습니다. 또한, 참가자 수 대비 이수자 수 데이터를 통해 프로그램의 난이도나 참여자들의 학습 성취도를 분석하여 보다 효과적인 코딩 교육 프로그램을 개발하고 관련 정책을 수립하는 데 기초 자료로 활용될 수 있습니다.
