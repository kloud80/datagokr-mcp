description_portal: '과학기술정보통신부가 상훈법 및 관련 법령에 근거하여 수여한 장관표창 및 상장 현황을 제공하는 데이터셋입니다. 과학기술·ICT 분야 발전에 기여한 개인과 단체의 공적을 인정하고 격려하는 정부 포상 제도의 운영 현황을 투명하게 공개하는 자료입니다. 데이터는 순번, 구분(표창/상장), 공적분야로 구성되어 있으며, 총 671건의 포상 현황이 포함되어 있습니다.표창은 정책기획 및 제도 개선, 연구개발 성과, 국제협력, 인재양성, 산업진흥, 정보보호, 우주개발, 원자력, 방송통신 등 과학기술정보통신부의 전 업무 분야에 걸쳐 탁월한 공적을 세운 개인과 단체에게 수여됩니다. 상장은 과학기술 관련 경진대회, 학술대회, 전시회, 페스티벌 등 다양한 행사를 후원하고 격려하기 위해 수여됩니다. 이 데이터는 정부의 과학기술 진흥 정책과 포상 제도의 운영 현황을 파악하는 데 활용됩니다. 또한 과학기술계의 주요 성과와 기여자를 확인할 수 있으며, 포상 제도의 공정성과 투명성을 제고하는 데 기여합니다. 상훈법, 상훈법시행령, 정부포상업무지침 등에 근거한 2024년도 과학기술정보통신부 장관표창 및 상장 현황 목록 (2025년 07월말 기준)-컬럼명: 순번, 구분, 공적분야'
