summary_user: KISA 암호이용활성화 누리집에 올린 게시물 목록을 게시물 한 건당 한 행으로 담은 파일(CSV, 약 156KB)로, 제목·본문·작성일·수정일·조회수·공지 여부 등을 포함한다. 보안 담당자나 연구자가 국산 블록암호(ARIA·LEA 등) 가이드, 암호모듈검증(KCMVP) 안내, 2019~2021년 랜섬웨어 동향·분석 보고서가 언제 게시됐고 얼마나 조회됐는지 찾아볼 때 쓴다. 다른 데이터와 이을 전역 조인 키는 없어서, 제목 같은 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 본자료는 KISA에서 제공하는 암호기술·보안 관련 자료, 가이드, 보고서, 그리고 랜섬웨어 동향/분석 보고서를 나열한 목록을 요약한 것으로 발행한 암호기술 활용 가이드, 암호정책 수립 기준, SEED·HIGHT·ARIA·LEA 등 국산 블록암호 관련 문서, 해시함수(SHA-256, SHA-3, LSH) 자료, IoT·HTML5·양자컴퓨팅 환경의 암호기술 이용 안내서 등을 포함한다. 또한 개인정보DB 암호화, 보조기억매체 관리, 패스워드 이용 가이드 등 보안 실무 지침이 다수 포함되어 있다. 암호모듈검증(KCMVP) 관련 파일과 양식, 시험평가 안내도 반복적으로 등장한다. 이와 더불어 2019~2021년까지 분기별·연간 랜섬웨어 동향 보고서, 그리고 Magniber·Ryuk·Dharma·Nemty 등 주요 랜섬웨어의 암호기능 분석 보고서 및 일부 복구도구가 포함된다. 대학 암호동아리 지원 사업 안내 등 행사·지원 공지들도 다수 포함되어, 암호기술 안내자료부터 보안 동향·행정자료까지 KISA의 핵심 암호안내 문서 전체를 포괄하고 있다.
