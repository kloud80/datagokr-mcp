summary_user: 국내 학술지(KCI) 논문을 논문별로 담는 건별 데이터로, 논문 식별값·XML 본문 파일·작업 상태·반입일자·누락 이미지 여부 같은 처리 정보를 제공한다. 연구자나 학술 DB 구축 담당자가 특정 논문이 언제 반입됐고 처리 상태나 이미지 누락은 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 논문명 등 이름 매핑이나 같은 기관 내부 코드로만 이어 쓸 수 있다.
description_portal: KCI 논문정보서비스는 국내 학술지 논문에 대한 본문, 저자, 그림 등 다양한 정보를 체계적으로 제공하여 연구자 및 기관이 논문 현황을 종합적으로 파악할 수 있도록 지원합니다. 논문별 반입일자, 작업 상태, 누락 이미지 등 상세 정보를 포함하고 있어 논문 데이터 관리, 연구 성과 분석, 학술지 품질 관리, 데이터베이스 구축 등에 활용할 수 있습니다. 학술연구, 논문 통계, 연구 동향 분석, 학술지 평가 등 다양한 목적에 맞춰 정기적으로 갱신되는 신뢰성 높은 데이터를 제공합니다. 또한 학술 생태계의 질적 향상을 위한 중요한 기반 자료로 활용 가능합니다.
