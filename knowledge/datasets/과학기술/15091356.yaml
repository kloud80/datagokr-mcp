description_portal: 한국과학창의재단은 4차 산업혁명 시대를 선도할 미래 인재 양성을 위해 소프트웨어(SW) 교육의 중요성을 강조하며, 현장의 우수한 SW 수업 사례를 발굴하고 공유하고자 공모전을 개최하고 있습니다. 이를 통해 교사들의 SW 교육 전문성을 강화하고, 창의적인 수업 모델을 전국적으로 확산시키고자 합니다.개방 데이터는 2020년 'SW 수업 우수사례 공모전' 수상작 6건의 목록입니다. 데이터는 수상 연도, 사례 제목, 공모 분야('SW교과 수업개선', 'SW융합 수업설계'), 그리고 실제 수업 내용을 확인할 수 있는 유튜브 영상 링크로 구성되어 있어, 생생한 우수 수업 사례를 직접 확인할 수 있습니다.초·중·고등학교 교사들은 수상작 사례를 통해 SW 수업 설계 및 교과 융합에 대한 아이디어를 얻고 자신의 수업에 적용해볼 수 있습니다. 교육 연구자 및 정책 입안자는 현장의 SW 교육 우수 사례를 분석하여 효과적인 SW 교육 정책을 수립하고 교사 연수 프로그램을 개발하는 데 활용할 수 있으며, 예비 교사들은 선배 교사들의 우수한 수업 노하우를 배우는 참고 자료로 활용할 수 있습니다.
