summary_user: 한국연구재단이 지원한 일부 연구개발 과제를 과제 한 건씩 담은 CSV 파일로, 사업년도·선정년도, 대·중·소·세부 사업명, 과제명, 연구책임자와 주관기관, 보안과제 여부를 담는다. 연구 관리자나 분석가가 "특정 세부사업에서 어느 기관·연구책임자가 몇 년도에 어떤 과제로 선정됐나"를 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못해, 주관기관명·과제명 같은 이름 매핑이나 연구자번호로만 다른 R&D 데이터와 맞춰 볼 수 있다.
description_portal: 본 데이터는 한국연구재단에서 지원하는 일부 연구개발 과제의 상세 정보를 제공합니다. 대사업명, 중사업명, 소사업명, 세부사업명, 과제명, 연구책임자, 주관기관, 선정년도 등의 다양한 세부 항목이 포함되어 있습니다. 이 데이터를 통해 과제별 연구 내용, 책임자, 기관 현황 등을 체계적으로 파악할 수 있으므로 연구과제 관리, 연구자 정보 확인, 사업 성과 분석, 정책 수립 등의 다양한 목적으로 활용할 수 있습니다. 연간 주기로 업데이트 되어, 수정일자를 기준으로 갱신된 최신 과제 정보를 파악할 수 있습니다.
