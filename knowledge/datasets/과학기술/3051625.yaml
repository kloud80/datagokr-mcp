description_portal: '과학기술정보통신부에서 제공하는 종합적인 정보화 통계 데이터베이스입니다. ITSTAT 통계 서비스를 통해 우리나라 ICT 산업과 정보화 현황을 다각도로 분석할 수 있는 체계적인 통계 정보를 제공합니다. 주요 데이터 구성은 ICT산업(산업현황, 수출입, 국제산업분류), ICT기업(기업경기, 중소기업실태, 연구개발), ICT인력(인력동향, 전문인력), 디지털/신산업(SW산업, VR/AR산업, 데이터산업, 블록체인산업, 사물인터넷산업), 정보서비스, 정보화/ICT활용, 통신/방송, 우편, 거시경제 등 광범위한 영역을 포괄하고 있습니다. 이 통계집은 정책 수립자, 연구기관, 기업, 학계에서 ICT 산업 동향 파악, 시장 분석, 투자 전략 수립, 학술 연구 등에 활용될 수 있습니다.- 분야: ICT산업, ICT기업경기/인력, ICT R&D, 정보서비스/신산업, 정보화/ ICT 활용, 통신/방송, 우편, 거시경제'
