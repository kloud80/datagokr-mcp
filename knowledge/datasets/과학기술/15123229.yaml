summary_user: 자율주행 셔틀버스 제로셔틀이 주행하는 동안 기록한 차량 상태를 수집 시각(초·나노초 단위) 단위 건별로 담으며, 기어단수·속도·휠각도와 각 목표값, 자동화·조종·속도 상태, 좌우회전 요청·정지·출발 여부를 포함한다. 자율주행 연구자나 분석가가 특정 주행 구간에서 셔틀이 목표 속도와 실제 속도를 어떻게 맞췄는지, 자동 모드와 수동 조종이 언제 바뀌었는지를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 없어서, 같은 기관(경기도)의 제로셔틀 관련 다른 데이터와 수집일시(clct_dt) 같은 시각 정보를 맞춰 보는 방식으로만 연결한다.
description_portal: 이 데이터는 자율주행 셔틀버스인 제로셔틀의 주행 중 차량 상태를 실시간으로 기록한 자료입니다. 각 데이터는 수집일시, 초수 및 나노초 단위의 정보를 포함하고 있으며, 주행 당시 차량의 기어단수, 속도, 휠각도 값, 자동화상태, 조종상태, 속도상태 등의 항목으로 구성되어 있습니다. 또한 차량의 주행 방향 요청 여부(좌회전, 우회전), 정지 여부 및 시작 여부 등의 정보도 포함되어 있어, 자율주행 시스템의 반응 및 주행패턴 분석에 활용될 수 있습니다. 이 데이터는 자율주행차량의 운행 안정성 분석, 시스템 로직 검증, 사고 예방을 위한 조건 분석, 자율주행 시나리오 학습 등에 활용이 가능하며, 미래형 교통수단 설계와 운영 전략 수립에 중요한 기초 자료입니다.* 데이터 크기 문제로 Sheet탭에는 일부 데이터만 제공합니다. 전체 데이터는 FILE 탭을 활용하여 주시기 바랍니다.
