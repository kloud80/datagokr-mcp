description_portal: 과학기술정보통신부 주관 정보격차 해소사업의 일환으로, 대전광역시 취약계층 대상 정보화교육 지원사업 운영실적을 체계적으로 제공합니다. 2023년 9월 30일 기준 정보화교육기관별 교육 인원과 교육 시간 실적을 포함하며, 디지털 소외계층의 정보 접근성 향상과 사회 통합에 기여합니다. 관련 법령과 정책을 준수하여 투명하게 관리되고 있으며, 복지, 교육 등 다양한 분야의 데이터와 연계되어 정책 평가 및 개선에 활용 가능합니다. 구조화된 데이터 형태로 제공되어 가공과 분석이 용이하며, 지역사회 정보격차 해소 및 디지털 역량 강화에 중요한 역할을 합니다.
