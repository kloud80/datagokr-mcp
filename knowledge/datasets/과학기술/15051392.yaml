description_portal: 한국철도기술연구원이 보유하고 있는 지식재산권에 대한 메타정보를 제공하는 데이터입니다. 본 데이터는 연구개발을 통해 창출된 특허, 실용신안 등 다양한 지식재산권의 기본 정보를 포함하고 있으며, 지식재산권명, 지식재산권 번호, 지식재산권 등록일자(또는 출원일자), 발명자 정보 등 주요 항목으로 구성되어 있습니다. 이를 통해 철도 기술 분야의 연구성과 및 기술개발 현황을 파악할 수 있으며, 관련 기술 정보의 활용, 연구개발 동향 분석 및 기술 정보 참고 자료 등 다양한 목적으로 활용될 수 있습니다. 또한 철도 기술 분야의 지식재산 현황을 이해하는 데에도 참고 자료로 활용 가능합니다.
