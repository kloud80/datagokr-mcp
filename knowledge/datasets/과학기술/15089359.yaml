description_portal: 본 데이터는 한국도로교통공단이 운영하는 교통 라디오 네트워크 게시판의 첨부파일 메타데이터 목록이다. 방송본부별 프로그램 게시글과 연계된 파일명, 저장경로, 크기, 파일유형을 제공하며, 게시판구분코드·게시글번호·시퀀스로 원문을 식별한다. 유형은 PDF·이미지(JPG)·오디오(MP3) 등이 포함된다. 필드는 ‘방송본부 구분’, ‘게시판구분코드’, ‘게시글번호’, ‘시퀀스’, ‘파일명’, ‘저장경로’, ‘크기’, ‘타입’으로 구성된다. 본 목록은 지역국 자료의 존재 여부와 접근 경로 파악을 돕고, 크기·유형 값으로 데이터 무결성 점검과 교차검색을 지원한다. 활용 예시는 지역국별 첨부현황 분석, 파일유형 통계, 캠페인 자료 일괄 수집 등이다.
