summary_user: 제주도 공공와이파이의 사용량을 설치 장소별로 집계한 통계로, 기준연월·분기, 성별·연령대, 방문 유형(도민·관광객 등 구분), 사용량을 담으며 포털 설명상 2018~2020년 자료다. 관광 정책 담당자나 분석가가 '어느 장소의 와이파이를 어떤 연령대·방문 유형이 분기별로 얼마나 쓰는가'를 파악할 때 쓴다. 전역 조인 키가 없어 장소명(wifi_place_name)을 다른 와이파이 설치 현황이나 관광지 목록과 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터셋은 2018년부터 2020년까지 제주도 내 공공 와이파이의 장소별 방문자(접속자) 단위 사용량을 집계한 통계자료이다. CSV 형식으로 제공되며, 각 기록은 와이파이가 설치된 장소명, 방문자 수, 사용량(트래픽 또는 데이터량) 등 장소-방문자 단위로 세분화된 정보를 포함하고 있다. 이 정보는 관광객 및 도민의 와이파이 사용 패턴 분석, 공공 인터넷 인프라 이용 현황 파악, 지역별 디지털 접근성 평가, 인구 유동과 관광 흐름에 따른 네트워크 수요 예측, 스마트 도시 및 관광 정책 수립 등에 활용 가능하다. 다만 수집 기간이 2020년까지만이며, 이후 설치 장소 증감이나 사용 행태 변화는 반영되지 않을 수 있다.
