description_portal: '본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 교통정보 안내 실적을 지역 단위로 집계한 통계이다. 부산·광주·대구·대전·경인·강원·전북·울산·경남·경북·제주 등 지역본부별 방송 안내 건수를 제공해 권역 간 활동 규모를 비교할 수 있다. 항목은 지역본부명, 기준일자, 방송실적 건수로 구성되며, CSV와 API 형식으로 제공돼 연계와 시각화에 적합하다. 본 자료는 안내 패턴 확인, 편성 개선 검토, 서비스 커버리지 점검 등 의사결정을 지원한다. 이용자는 지역 비교 분석, 보고서 작성, 대시보드 구축 등 실무에 참고한다. 요약: 지역본부 단위 교통정보 방송 건수 통계를 표준 필드로 정리해 권역별 활동 수준과 제공 패턴을 파악하도록 구성한 데이터이다.'
