description_portal: 서울시 동작구 스마트보안등(IoT) 측정정보는 동작구에 설치된 스마트 보안등의 작동 설정, 전력 사용량, 고장 여부 등을 통합적으로 관리하기 위한 데이터입니다. 기관 명, 송신 서버 번호, 데이터 번호, 모델명, 시리얼을 통해 각 보안등 장비와 수집된 데이터를 고유하게 식별할 수 있으며, 접속간격, 수동유지, 지역ID 정보는 통신 주기와 제어 방식, 설치 위치 관리를 가능하게 합니다. 점등편차·소등편차와 심야소등 시작·해제 시각 및 적용시간은 야간 시간대별 조명 운영 전략과 에너지 절감 정책 수립의 핵심 기준이 됩니다. 디밍시·디밍분·디밍값(1~3단계)과 현재 디밍값, 현재 전력값은 조도 조절 상태와 전력 사용 현황을 정량적으로 파악할 수 있는 지표입니다. 램프고장, 이상점등, 누전발생, 안정기고장, 깜빡거림, 점소등상태, 수동·강제상태는 정상·고장 여부를 수치로 표현하여 실시간 원격 모니터링과 신속한 유지보수를 지원합니다. 등록일자는 측정 데이터가 기록된 시점을 나타내며, 이력 관리와 추세 분석에 활용됩니다. 전체적으로 이 데이터는 동작구 야간 보행 안전 확보, 에너지 효율 향상, 스마트 조명 인프라의 운영 최적화를 위한 핵심 기초 자료로 활용될 수 있는 유용한 공공 데이터입니다.
