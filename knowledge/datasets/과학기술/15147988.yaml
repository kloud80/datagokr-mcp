summary_user: 경기도 양주시 관내에 신고된 통신판매업 사업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 시군명·업체명·사업자등록번호·주소를 포함한다. 소비자가 거래하려는 온라인 쇼핑몰이 양주시에 통신판매업으로 신고됐는지 확인하거나, 분석가가 양주시 안에서 온라인 판매 사업체가 어느 지역에 몰려 있는지 파악하는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 사업자 원장·기업 데이터와 잇고, 주소로 상권 데이터와 결합한다.
