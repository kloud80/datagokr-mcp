description_portal: ○  GBIF 설립 및 비전GBIF(Global Biodiversity Information Facility)는 인터넷을 통해 지구의 생물다양성데이터를 자유롭고 공개적으로 이용할 수 있도록 하기 위해 설립된 국제기구이다. 특히 GBIF는 과학, 사회 그리고 지속가능한 미래를 위해 생물다양성데이터의 공유에 중점을 두고 있다. GBIF의 회원은 국가, NGO 단체, 연구소, 또는 국제기구이다.GBIF는 1996년 OECD 거대과학 포럼 생물다양성정보학 실무 그룹의 과학자와 정부 관료들에 의해 태동되었다.○ GBIF 구성이사회(회원국별 대표 1인), 집행위원회(이사회 의장, 부의장, 상임위원회 의장 포함), 상임위원회(노드/예산/과학위원회), 사무국○ 본 데이터는 GBIF 네트워크에 참여하고 있는 노드(국가 및 단체)중에서 웹 사이트를 운영하고 있는 노드를 소개자료 입니다.
