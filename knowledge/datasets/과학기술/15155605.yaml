description_portal: '□ 개요본 데이터셋은 국립과천과학관 내 과학기술자료실(도서관)의 휴관일 정보를 연도별, 월별로 정리한 자료입니다. 자료실 이용객에게 정확한 운영 일정 정보를 제공하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 연도별·월별 휴관일 현황을 파악하여 자료실 방문 계획 수립 시 헛걸음을 방지할 수 있습니다. 둘째, 정기 휴관일(예: 매주 월요일)과 법정 공휴일 등 휴관 패턴을 분석하여 과학관 운영 정책 수립 및 근무 일정 편성에 활용 가능합니다. 셋째, 과거의 휴관 이력을 관리하여 연간 운영 일수 산정 등 통계 작성의 기초 자료로 활용됩니다.□ 데이터 구조· 년 : 휴관일 정보가 해당하는 연도 (Integer, YYYY)· 월 : 휴관일 정보가 해당하는 월 (Integer, MM)· 일 : 해당 월에 자료실이 휴관한 구체적인 날짜 목록 (String, 예: 5, 12, 19, 26)'
