description_portal: 본 데이터는 정보통신사업, 방송, 전파, 무선설비 등 한국방송통신전파진흥원 주파수 종합 사업 관련 법령 목록 현황을 정리한 자료입니다. 해당 자료는 전파법, 방송통신발전기본법, 정보통신기반 보호법 등 관련 법률을 비롯하여 시행령, 시행규칙, 고시, 기술기준, 행정지침 등 세부 규정에 대한 간단한 내용을 포함합니다. 자료는 법령 제목과 그에 해당하는 간단한 내용, 조회수, 출처(국가법령정보센터, 국립전파연구원) 그리고 법령의 첨부 파일과 링크 주소로 구성됩니다. 본 자료는 전파·통신 분야의 법제도 변화와 기술기준 동향을 신속히 파악하는데 사용될 수 있으며, 정책연구, 법규 검토, 산업계 기술적용 검증 등 실무 활용을 위한 기초자료 활용될 수 있습니다.
