description_portal: '□ 개요본 데이터셋은 국립과천과학관 과학기술자료실에서 표준자료관리시스템을 통해 설정한 설문조사의 세부 수집 항목 정보를 정리한 자료입니다. 설문조사 시 참여자로부터 수집하고자 했던 정보(이름, 학교, 학년 등)의 목록과 등록 현황을 파악하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 과거 설문조사에서 수집된 개인정보 및 인구통계학적 항목의 종류를 파악하여 개인정보 수집 최소화 원칙 준수 여부를 점검할 수 있습니다. 둘째, 설문조사별 구성 항목을 비교·분석하여 설문 설계의 적절성을 평가하고 향후 설문지 개선에 참고할 수 있습니다. 셋째, 수집 항목의 등록 일시 정보를 통해 설문조사 기획 및 시스템 반영 시점을 이력 관리하는 데 활용 가능합니다.□ 데이터 구조· 설문지 아이디 : 해당 항목이 포함된 설문조사의 고유 식별 번호 (Integer)· 설문지 제목 : 해당 항목이 포함된 설문조사의 제목 (String)· 수집항목 아이디 : 수집하려는 개별 항목의 고유 식별 번호 (Integer)· 수집항목 이름 : 설문조사를 통해 수집하려는 구체적인 정보의 명칭 (String, 예: 사는 곳, 학교, 학년)· 등록일시 : 해당 수집 항목이 시스템에 설정 및 등록된 날짜와 시간 (String, YYYY-MM-DD HH:MM:SS)'
