description_portal: '상기 국제우편 요금은 추가운송수수료 및 부가취급수수료가 제외된 것으로 수수료 등이 포함된 예상요금은 "요금계산기" 조회 결과를 참고바랍니다.EMS방문접수신청 시 EMS방문수수료가 추가 됩니다.  - EMS방문수수료 : 1회 방문 1통 당 3,000원, 추가 1통 당 1,000원, 최대 5,000원추가운송수수료  - 항공운임 및 선편운임의 증가에 따라 항공우편물 및 선편우편물 접수 요금에 부과하는 추가운송수수료  - 국가별, 우편물종별, 운송편별, 중량별 차등 금액 적용우편물의 실제 중량과 부피중량 중 더 높은 중량으로 우편요금이 적용됩니다.부피중량(Kg) : 가로(cm)X세로(cm)X높이(cm)/6,000적용된 중량이 국가별 제한중량 초과 시 발송 불가합니다.부피중량 적용 시 최대규격 이하로 제한될 수 있습니다.'
