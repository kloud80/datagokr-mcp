description_portal: 국립과학수사연구원은 국가연구개발을 수행하는 기관으로 연구개발 과정에서 개발된 지식재산권을 공무원 직무발명신고 및 국유특허 등록을 하고 있습니다. 연구개발사업을 통하여 여러 감정기법을 개발하면서 이 과정에서 창출된 지식재산권 입니다. 유전자, 화학, 독성 마약을 포함한 법과학, 안전, 디지털포렌식, 교통사고분석 관련된 법공학 및 법의학 분야의 다양한 국유특허를 출원 및 등록하고 있습니다. 뿐만 아니라 유무상 통상실시권을 시행하고 있습니다. 국유특허의 유무상 통상실시권은 발명진흥회 사이트를 통하여 검색활용 가능합니다.
