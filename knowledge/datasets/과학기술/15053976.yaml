description_portal: '과학기술정보통신부에서 제공하는 우리나라의 국가별 기술수출 현황을 보여주는 통계 데이터입니다. 기술무역은 기술의 국제적 이전을 의미하며, 본 데이터는 우리나라가 해외에 수출한 기술에 대한 대가 수입액을 국가별로 집계한 자료입니다.데이터는 미국, 일본, 독일, 영국, 프랑스, 네덜란드, 중국, 싱가포르 등 주요 8개국을 포함하여 전 세계 100여 개 국가로의 기술수출 금액을 연도별로 제공하고 있습니다. 각 국가별로 연도별 기술수출액이 상세히 기록되어 있어 우리나라 기술의 해외 진출 현황과 추이를 파악할 수 있습니다. 이 데이터는 국가 기술무역 정책 수립, 기술경쟁력 평가, 기술무역수지 분석, 해외 기술시장 진출 전략 개발 등에 활용될 수 있습니다.O 우리나라의 상대국가(미국 외 111개국)별 기술수출 통계정보(2001~2023년)를 제공합니다.  * 주요국: 미국, 일본, 독일, 영국, 프랑스, 네덜란드, 중국, 싱가포르'
