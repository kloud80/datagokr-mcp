description_portal: 2015년부터 2024년까지 해마다 스마트폰의 일일 이용시간(통화시간 제외)과 월 이용요금, 스마트폰 기능별 중요도(5점 척도 평가)를 조사하여 작성한 통계입니다.매년 6000~7000여명의 모집단을 대상으로 성별, 연령별, 지역별, 직업별, 가구소득별, 학력별, 주거형태별, 가족구성별, 지역유형별 등다양한 구분을 통해 해당 요소가 스마트폰 이용률과 이용행태에 어떤 영향을 주는지를 분석하고 이를 통해 우리 사회의 디지털 이용격차 연구 등에 활용될 수 있습니다.또한, 10년간  시행된 설문조사이므로 스마트폰 이용행태의 연간 변화에 대해서도 파악할 수 있습니다.
