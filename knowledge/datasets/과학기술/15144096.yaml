description_portal: 본 데이터는 경기도 용인시에서 각 행정 부서가 주민을 대상으로 발송한 안내 및 알림 메시지 현황을 제공한다. 주요 항목은 발송부서, 발송일, 메시지 내용으로 구성되어 있으며, 주민에게 전달된 다양한 행정 정보, 공지, 생활 안내 등 메시지 내역을 체계적으로 수록한다. 특히 본 데이터는 과학기술정보통신부에서 제공한 스팸문자 내역과 신청을 통해 제공받은 문자 내역을 AI로 학습하여, 시스템 이용자가 입력한 메시지의 일반/광고(스팸) 여부를 판단할 수 있도록 활용된다. 이를 통해 메시지 수신자가 불필요한 스팸성 안내를 받지 않도록 지원하는 시스템 개발과 테스트, 행정 메시지 품질 관리, 정보 전달 체계 개선, 메시지 유형 분석 등 다양한 목적으로 활용할 수 있다. 시민, 정책 담당자, 연구자 등 여러 이용자의 정보 접근성과 이해도를 높이고자 하며, 정기적으로 최신 메시지 내역이 반영된다. 공공데이터 개방을 통해 정보 신뢰성과 투명성을 높이고, 효율적인 행정 서비스 제공에 기여하는 것을 목표로 한다.
