description_portal: 국토교통과학기술진흥원은 연구개발 성과를 산업 현장에 확산하기 위해 "판매기술"을 추진하고 있습니다. 보유기관이 등록한  판매기술을 수요기업과 ㅇ녀결하고, 기술서렴ㅇ회, 중개, 알선 등을 통해 이전을 촉진합니다. 또한 기술금융 연계, 성과도서관 운영, 협의체 구성 등을 지원하여 기술의 사업화와 활용도를 높이고 있습니다. 이를 통해 공공 연구성과가 단순한 보고서에 머물지 않고 실제 시장에서 활용되도록 지원하고 있습니다. 특히 벤처, 중소기업이 필요로 하는 핵심 기술을 빠르게 공급하여 산업 경쟁력을 강화하며, 기술이전 과정에서 발생하는 위험을 줄이기 위해 금융,법률적 지원도 병행하고 있습니다.
