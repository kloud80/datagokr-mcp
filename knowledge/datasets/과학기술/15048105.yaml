description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 광주교통방송의 방송권역 내 고속도로 IC·국도 교차로 등 도로 지점에서 라디오 수신 품질을 측정한 자료이다. 각 지점의 위도·경도 좌표, FM 주파수, 수신 상태 등급을 포함하여 지역별 청취 환경을 정량 지표로 제시한다. 측정 지점 식별, 도로 종별, 행정구역 메타정보를 함께 제공하여 공간연계 분석에 적합하다. 결과는 교차로·분기부 등 실제 통행 지점에서의 청취 가능성을 보여 주며, ‘양호·잡음·불량’ 등 구분을 통해 취약 구간 탐지·보완 검토, 민원 응대 근거에 활용된다. 광주 지역 FM 97.3MHz 수신 환경 이해와 품질 진단의 기초자료로 쓰인다
