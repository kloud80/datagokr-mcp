summary_user: 경기도 도로에 설치된 노면 감시 센서가 발생일시별로 기록한 측정값을 건별로 담으며, 도로·대기 온도, 노면 상태 코드(평균·순시), 노면 마찰 수치, 표면 접지력 등급, 상대습도, 장비 온도 등이 들어 있다. 도로관리 담당자나 교통안전 분석가가 '기온이 떨어진 날 노면 마찰이 언제부터 낮아졌는가'처럼 결빙·미끄럼 위험 시점을 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 발생일시를 기준으로 기상 관측 자료와 시간대를 맞추거나 같은 기관 자료와 이름으로 대응시키는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 도로 위 노면 상태를 실시간으로 감시하고 기록한 자료로, 도로 안전 관리를 위한 감지 센서에서 수집된 다양한 물리적 지표가 포함되어 있습니다. 주요 항목으로는 발생일시, X전압·Y전압과 전압비율, 도로 및 대기 온도, 도로 상태 코드(평균 및 순시), 노면 마찰 수치, 표면 접지력 등급, 상대습도, 장비 온도 등이 있습니다. 이 데이터는 미끄럼 사고 예방을 위한 도로 유지보수 정책 수립, 노면 상태 기반 차량 제어 시스템 연구, 스마트시티 교통 안전 시스템 등에 활용할 수 있으며, 기상과 도로 환경 변화에 따른 교통사고 예측에도 활용 가능합니다.* 전체 데이터는 FILE 탭을 활용해주시기 바랍니다.
