description_portal: '우체국 쇼핑몰에서 판매되는 상품의 주문 데이터를 기반으로 하여 월별 카테고리별 판매량 데이터를 제공, 카테고리 분류 기준 상위 11개 카테고리별 시단위 기준 판매량 데이터 제공(2025년 5월 기준)이 데이터는 우체국쇼핑을 통해 거래된 상품의 시도별·품목별 판매 통계를 포함하고 있으며, 배송년월, 주문 접수 지역(접수시도명), 배송 대상 지역(배송시도명), 품목별 주문 건수(예: 곡물, 과일, 채소, 수산물, 건강식품, 유아용품, 공예품 등)로 구성된다.해당 자료는 국민 생활과 밀접한 우체국 유통망을 기반으로 실거래 데이터를 집계한 것으로, 특정 지역에서 어떤 물품이 많이 소비되었는지, 어느 시점에 주문이 집중되는지를 분석할 수 있는 기반 정보를 제공한다.정부와 공공기관은 이 데이터를 활용하여 지역 간 소비 트렌드, 지역특산물 유통 흐름, 물류 수요 등을 분석하고, 농어촌 경제 활성화, 물류 인프라 확대, 지역 기반 맞춤형 마케팅 정책 수립 등에 활용할 수 있다. 민간기업이나 학계에서도 지역별 소비 패턴 예측, 계절별 수요 분석, 품목 간 상관관계 탐색 등 다양한 용도로 확장 가능하다.또한 우체국의 공공유통 기능이 실제로 어떻게 지역경제에 기여하고 있는지를 정량적으로 보여주는 대표적 공공데이터로 활용 가치가 높다.'
