description_portal: 이 공공데이터는 과학기술정보통신부 중앙전파관리소에서 제공하는 전파 관리 통계로, 월별 및 연간별 허가신고 무선국 국수, 허가 신고 검사 무선국 건수 및 전파사용료, 전파감시 실적(불법 무선국, 허가신고 위반, 기술기준위반 건수), 정보통신사업자 및 건물(초고속건물, 홈네트워크건물) 인증건수 등 현황을 다룹니다. ‘구분’ 항목을 통해 통계를 세분화한 이 공공데이터는 주요 항목으로 허가신고 현황, 허가의제 현황, 신규 허가 건수, 전월·전년 대비 증감 수치 등을 포함하고 있으며, 이를 통해 국내 전파 이용 수요를 알 수 있고, 또한 전파 자원 관련 정책 수립 등을 위한 기초자료로 활용될 수 있으며 공공 행정 및 연구에 활용될 수 있습니다.
