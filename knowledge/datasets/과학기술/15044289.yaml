description_portal: '- 한국방송광고진흥공사에서 관리, 운영하는 한국광고박물관이 소장하고 있는 분야별 광고소재의 디지털 아카이브 데이터로 라디오광고 관련 항목들을 제공합니다.- 개방 데이터는 소장 라디오광고의 연도, (업종)대분류, (업종)중분류, (업종)소분류, 광고주, 제품, 대행사, 광고제목 총 3,176건입니다.- 이전 사례에 대한 조사가 필요한 학계 및 연구기관에서 기초자료로 활용할 수 있으며, 광고 및 홍보 유관 기업에서는 한국광고박물관이 보유하고 있는 연도별, 업종별, 광고주별, 대행사별 과거 라디오광고 진행 내역 확인이 필요하신 경우 활용할 수 있습니다.'
