description_portal: 기술개발자(개인 또는 법인)의 교통기술 개발의욕 고취와 개발된 교통기술의 보급 및 활용 촉진으로, 국내 교통기술의 발전을 도모하여 기술경쟁력 등을 제고하기 위하여 국내에서 최초로 개발 또는 외국에서 도입하여 소화· 개량한 교통기술로 국내에서 신규성, 진보성 등이 있다고 판단되고 그 기술을 보급· 활용하는 것이 필요하다고 인정되는 기술입니다. 교통신기술은 교통 분야의 안전성, 효율성, 편의성 향상을 위해 개발된 창의적이고 우수한 기술로, 국토교통부가 심사하여 지정하며 지정된 기술은 공공사업에 우선 적용되는 혜택이 부여 됩니다.
