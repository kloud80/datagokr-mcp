description_portal: '해당 데이터는 등록특허의 공고 전문, IPC 코드 등 특허 관련 정보를 LLM 기반 기관 특화 인공지능 모델이 종합적으로 분석하여, 개별 특허가 포함하고 있는 주요 기술 내용을 도출하고 해당 기술과 가장 밀접하게 연관된 국가과학기술표준분류체계를 매핑한 결과물입니다. 특히 특허 문헌의 기술적 표현과 문맥, IPC 분류 정보를 함께 반영함으로써 단순 키워드 매칭을 넘어 특허별 핵심 기술 분야를 보다 정교하고 일관성 있게 분류할 수 있습니다. 이를 통해 대규모 등록특허 데이터를 체계적으로 정리하고, 기술 동향 분석, 산업·연구개발 분야별 통계 작성, 기술평가, 정책 수립 및 지원사업 기획 등에 활용할 수 있는 기반 데이터를 제공합니다.*기준일: 2024년도까지 등록된 특허 대상*API 유의사항: 등록번호가 아닌 출원번호를 입력'
