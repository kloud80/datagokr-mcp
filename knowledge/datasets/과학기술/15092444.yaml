description_portal: 기초학문자료센터에서 체계적으로 관리하는 원문 목록 정보를 제공하는 데이터로, 원문목록명, 파일 확장자, 작성기관, 등록일자, 관련 주제어 등 다양한 주요 항목이 포함되어 있습니다. 이 데이터는 학술자료의 체계적인 보존과 연구성과의 효과적인 공유, 원문 접근성 향상에 폭넓게 활용될 수 있습니다. 특히 연구자, 대학 및 전문 도서관, 정보관리 담당자 등이 학술자료를 검색·분류하거나 장기적으로 보존하는 업무 수행 시 매우 유용하게 사용할 수 있습니다. 또한 학술정보 유통 체계의 정비와 연구자료 관리의 효율성을 높이는 데 기여하며, 정책 수립 및 기관 간 자료 연계 기반 마련에도 도움을 줍니다. 데이터는 1년 단위로 정기적으로 갱신되며, 이를 통해 최신 원문 목록 현황을 정확하게 반영하고 있습니다.
