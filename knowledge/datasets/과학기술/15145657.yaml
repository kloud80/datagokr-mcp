description_portal: 본 데이터는 부산교통공사에서 시행한 도시철도 건설 및 시설 개량공사에 사용된 신기술 및 특허 공법 현황을 제공하는 자료입니다.사용협약연도, 대상사업명, 인증구분, 신기술·특허 보유업체, 기술사용료 요율 항목으로 구성되며, 공사 현장에서 적용된 기술의 권리 관계와 사용 조건, 비용 산정 근거를 확인할 수 있습니다.이를 통해 건설 분야의 기술 활용 현황을 분석하고, 유사 사업 기획 시 참고 자료로 활용할 수 있습니다. 데이터는 표준화된 형식으로 작성되어 검색과 분석이 용이하며, 신기술 도입 효과와 특허권 사용 실태 파악에 유용합니다.건설 기술자, 연구자, 정책 담당자 등이 기술 트렌드 분석, 공법 선택, 비용 예측 등에 활용할 수 있는 공공 데이터입니다.
