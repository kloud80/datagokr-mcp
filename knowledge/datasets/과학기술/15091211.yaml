description_portal: 한국과학창의재단은 전국의 다양한 과학문화 프로그램을 국민들에게 널리 알리고 참여를 활성화하기 위해, 과학관, 박물관, 연구기관 등에서 개최하는 프로그램 정보를 통합하여 제공합니다. 이를 통해 과학문화 콘텐츠에 대한 국민의 접근성을 높이고, 생활 속 과학 실천 문화를 확산시키고자 합니다.개방 데이터는 2019년부터 2021년까지 전국에서 열린 과학 교육, 캠프, 전시, 공연 등 약 300여 건의 프로그램 상세 정보입니다. 각 데이터는 프로그램의 온·오프라인 구분, 분류, 대상, 지역, 장소, 주소, 정확한 행사 시작일과 종료일, 운영기관 및 주최 정보를 포함하여 사용자가 원하는 프로그램을 구체적으로 검색하고 계획하는 데 도움을 줍니다.학생, 학부모, 일반 시민은 자신의 관심사와 지역에 맞는 과학문화 활동 정보를 손쉽게 찾아 여가 및 학습 활동으로 활용할 수 있습니다. 교사 및 교육기관은 현장체험학습이나 창의적 체험활동 계획 수립을 위한 실질적인 자료로 활용할 수 있으며, 정책 연구기관은 지역별, 분야별 과학문화 프로그램 현황을 분석하여 관련 정책 개발에 기여할 수 있습니다.
