summary_user: 구리시 안에서 영업 중인 출판사, 인쇄사, 게임물제작·배급업, PC방(인터넷컴퓨터게임시설제공업), 일반·청소년·복합유통게임제공업 등 문화유통업체를 업체 한 곳당 한 행으로 담은 등록대장 기준 원장이며, 상호·업종명·소재지와 위경도를 함께 담는다. 구리시에서 특정 동네에 PC방이나 게임제공업소가 몇 곳 있는지, 인쇄사가 어디에 모여 있는지를 확인하려는 주민·창업자·분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 상호·소재지 주소를 문자열로 맞추거나 위경도로 공간 결합해서 잇는다.
description_portal: 게임제공업, 출판사, 인쇄사 등 구리시 지역내에 영업중인 모든 문화유통업체에 관한 전반적인 현황정보(상호, 업종명, 소재지, 위경도, 데이터기준일자) 등을 제공합니다.데이터 제공 항목은 상호, 업종명, 소재지, 소재지의 위도와 경도, 관리기관명, 데이터기준일자를 제공합니다. 데이터 제공 업종은 출판사, 인쇄사, 게임물제작업, 게임물배급업, 인터넷컴퓨터게임시설제공업, 복합유통게임제공업, 일반게임제공업, 청소년게임제공업을 제공합니다. 제공되는 데이터는 등록대장 상 데이터를 기준으로 합니다.
