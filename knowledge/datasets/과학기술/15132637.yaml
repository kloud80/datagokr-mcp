summary_user: 한국인터넷진흥원 개인정보포털에 접수된 단체교육 신청을 사업자 단위 건별로 담은 원천 파일로, 사업자번호·사업자명·개인정보 수집동의 여부·교육담당자 여부·등록 일시가 들어 있으며 범위는 전국이다. 개인정보보호 교육 담당자나 분석가가 어떤 기업이 언제 단체교육을 신청했는지, 업종이나 지역별로 교육 참여가 어떻게 분포하는지 확인할 때 쓴다. 사업자번호(bizno)가 조인 키이므로 국세청 사업자 상태 정보나 기업 기본정보 데이터와 이어 업종·규모별로 교육 참여를 볼 수 있다.
description_portal: 한국인터넷진흥원에서 운영 중인 개인정보포털의 단체교육 관련 데이터로, 각 사업자를 식별하는 고유한 사업자번호와 사업자명이 포함되어 있으며, 교육 참여를 위해 개인정보 수집 및 이용에 동의했는지를 나타내는 수집동의여부 항목도 포함되어 있습니다. 또한, 교육의 종류와 목적에 따라 구분되는 교육타입 정보가 기록되어 있고, 해당 교육 데이터가 시스템에 등록된 년월일시 정보도 상세히 관리되고 있습니다. 이러한 데이터는 단체교육 프로그램의 운영 현황을 체계적으로 파악하고, 참여 기업별 교육 이력을 관리하며, 개인정보보호법 준수를 위한 검증 자료로 활용됩니다. 더불어 교육 대상별 맞춤형 지원과 효과적인 교육 계획 수립을 가능하게 하여, 개인정보보호 역량 강화에 중요한 역할을 수행합니다.
