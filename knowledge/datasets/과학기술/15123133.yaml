summary_user: 경기도 안산시의 공공와이파이 설치 지점을 건별로 담은 원천 목록으로, 812행에 설치장소명·설치시설구분·설치연월과 주소·좌표가 들어 있고 설치 기간은 2015-11-01~2026-01-30이다. 시민이 가까운 공공와이파이 장소를 찾거나 행정기관·분석가가 지역별 통신복지 설치 분포를 살필 때 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)를 키로 지도, 다른 시설 위치 데이터와 이어 쓴다.
description_portal: 이 정보는 시민들이 자유롭게 이용할 수 있는 공공 와이파이 설치 현황을 담고 있습니다. 공원, 버스정류장, 공공청사 등 주요 공공장소를 중심으로 설치된 무선인터넷의 위치 정보가 포함되어 있으며, 설치장소명, 설치시설구분, 도로명주소 및 지번주소, 위도·경도 등의 정보로 구성되어 있습니다. 이를 통해 시민들은 가까운 공공 와이파이 이용 가능 장소를 쉽게 찾을 수 있으며, 행정기관은 디지털 접근성 향상 및 통신복지 정책 수립에 활용할 수 있습니다. 또한 위치 기반 서비스 제공, 관광객 편의 증진, 정보격차 해소 등 다양한 분야에 기초자료로 활용이 가능합니다.
