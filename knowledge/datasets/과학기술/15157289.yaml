description_portal: '외국방송사업자가 행하는 방송을 국내 방송 플랫폼(IPTV, 케이블TV 등)을 통해 송출(재송신)하려면, 「방송법」 제78조의2에 따라 방송미디어통신위원회의 승인을 받아야 합니다. 본 데이터는 2026년 7월 10일 기준으로 승인받은 외국방송의 국내 재송신 승인 현황 총 112건을 포함하고 있으며, 각 승인 건별로 승인일, 외국방송채널명, 외국방송사업자명, 국적, 방송분야, 방송 언어 등의 정보를 제공합니다. 이 데이터는 외국 방송채널의 국내 송출 현황을 파악하고, 방송정책 수립, 방송산업 분석, 공공 연구 등에 활용될 수 있습니다.※ 용어 해설- 외국방송 재송신: 해외에서 송출되는 방송 채널을 국내 방송 플랫폼(IPTV, 케이블TV 등)을 통해 다시 전송하는 것- 방송사업자: 방송을 송출하거나 이를 플랫폼을 통해 제공하는 국내 기업 또는 기관※ 항목 설명- 승인일: 재송신을 승인한 날짜 (YYYY-MM-DD 형식)- 외국방송채널명: 국내에서 송출되는 외국방송 채널의 이름- 외국방송사업자명: 해당 채널을 운영하는 외국 방송사업자 명칭- 국적: 외국방송사업자의 본사 소재 국가 (예: 미국, 일본 등)- 방송분야: 채널의 주요 콘텐츠 장르 (예: 뉴스, 스포츠, 드라마 등)- 언어: 방송에서 사용되는 주요 언어 (예: 영어, 중국어 등)'
