description_portal: '이 데이터는 인공지능 학습용 데이터 구축사업의 일환으로 모집된 크라우드소싱 형태의 일자리 정보를 담고 있습니다. 각 데이터는 프로젝트 수행 영역(예: 농축수산, 문화관광, 교통물류 등), 과제명(해당 데이터 구축 사업의 명칭), 데이터셋명(수집·가공되는 구체적인 데이터 종류), 수행기관(과제를 주관하는 기관 또는 업체명), 근무지역(작업이 이루어지는 지역 또는 원격 가능 여부 등)으로 구성됩니다. 해당 데이터는 AI 학습데이터 구축과정에서 발생하는 일자리 창출 현황을 파악하거나, 지역별·과제별 수요 분석 및 일자리 정책 수립에 활용될 수 있습니다. 정부의 데이터 일자리 사업 추진 현황을 가시화하는 데 유용한 정보로, AI 산업 내 인력 수급과 고용 흐름을 분석하는 데도 기여할 수 있습니다.'
