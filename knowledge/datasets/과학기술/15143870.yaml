description_portal: 국립중앙과학관의 특별기획전시 데이터는 2023년부터 2025년까지 개최된 다양한 전시의 현황을 담고 있습니다. 주요 전시로는 뱀의 생태와 움직임을 모사한 로봇, 인공지능, 첨단바이오 등 자연모사와 첨단기술이 결합된 『자연 in 과학관』 특별전, 산천어·독사·장수풍뎅이 등 자연에서 영감을 받은 기술 사례를 다룬 『모방하는 인간, 호모 미메티쿠스』, 멸종위기종 보호와 불법 거래 문제를 조명한 『나는 어디로 가는 거죠?』, 올림픽을 기념해 스포츠과학 원리를 체험하는 『승리공식 사이언스』, 에디슨의 발명품과 과학 원리를 방탈출 게임으로 체험하는 『에디슨 하우스의 비밀』 등이 있습니다. 또한, 발달장애 작가 23명의 예술 작품과 미디어아트, 빛의 굴절 실험을 접목한 『인생 Prism』 전시도 포함되어 있습니다. 각 전시는 전시명, 내용, 기간, 장소, 관람료, 관람인원 등의 정보를 포함하며, 과학기술과 예술, 사회적 이슈까지 아우르는 다양한 주제를 통해 과학문화 확산과 대중의 관심을 이끌고 있습니다.
