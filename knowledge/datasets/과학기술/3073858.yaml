summary_user: 양주시에서 시행된 정보통신공사 사용전검사를 건별로 담은 원장 파일로, 필증관리번호·처리일자·현장주소·공사의 종류·판정·재검사여부·시공자 상호와 등록번호 등을 현장 주소 단위로 기록한다. 시민이 입주하거나 임차할 건물의 통신설비가 사용전검사를 통과했는지 확인하거나, 분석가가 양주시 정보통신공사 시공자별·공사 종류별 검사 현황을 볼 때 쓴다. 전역 조인 키는 없어서 현장주소를 주소 정제해 건축물대장 등 주소 기반 자료와 맞추거나, 시공자등록번호·상호명으로 정보통신공사업 등록 자료와 이름·번호 매핑으로 이어 쓴다.
description_portal: 이 데이터는 양주시에서 시행된 정보통신공사 사용전 검사의 진행 현황을 제공합니다.해당 데이터는  처리일자, 현장주소 등의 내용을 포함하고 있으며건축물 내 통신설비가 안전하고 기준에 적합한지 확인한 결과를 담고 있습니다.시민들은 아파트, 상가 등 건축물의 통신 품질과 안전성을 확인하는 데 활용할 수 있습니다.공공데이터로 제공되어 투명한 정보 접근과 안전한 생활환경 조성에 기여합니다.
