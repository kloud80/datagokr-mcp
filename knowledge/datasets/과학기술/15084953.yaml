summary_user: KCI(한국학술지인용색인)에 등록된 국내 학술지와 관련된 언론 기사를 기사 한 건 단위로 담으며, 기사 일련번호·제목·URL·언론사명·작성 일시를 제공한다. 학술지 운영자나 미디어 분석가가 '우리 학술지 관련 기사가 어느 언론사에서 언제 보도됐나'를 확인하거나 보도 동향을 모니터링하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 KCI 데이터와는 기사 제목·언론사명 같은 이름 매칭으로만 연결한다.
limits: 학술지·논문 식별자가 컬럼에 없어 특정 학술지나 논문과 기사를 키로 직접 연결할 수 없다. 범위는 전국 단위의 비공간 데이터라 지역별 분석에는 쓸 수 없고, 개발계정 호출은 일 5,000회로 제한된다.
