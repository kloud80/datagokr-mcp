description_portal: 코로나19 팬데믹이라는 전 지구적 위기 상황 속에서 과학기술계의 대응과 역할을 기록하고, 관련 정보를 국민들에게 정확하게 전달하기 위해 한국과학창의재단에서 제공하는 '사이언스타임즈'의 코로나19 관련 기사 데이터입니다.개방 데이터는 2020년부터 2021년까지 '사이언스타임즈'에 게재된 코로나19 관련 기사 약 570여 건의 목록입니다. 각 기사는 '제목', '본문', '세부 구분', '태그', '등록일자', '조회수(뷰)' 등 11개 항목으로 구성되어 있으며, 바이러스 연구, 백신 및 치료제 개발, 방역 정책, 사회 변화 등 과학기술을 중심으로 한 다각적인 정보를 포함하고 있습니다.미디어 및 데이터 분석 연구자들은 이 데이터를 활용하여 팬데믹 기간 동안의 과학 저널리즘 보도 행태, 주요 과학적 쟁점의 변화, 정보 확산 패턴 등을 분석하는 연구를 수행할 수 있습니다. 또한, 교육 기관에서는 과학 글쓰기 자료나 과학기술과 사회의 상호작용에 대한 토론 자료로 활용하여 학생들이 과학적 소양을 기르고 비판적 사고 능력을 함양하도록 도울 수 있습니다.
