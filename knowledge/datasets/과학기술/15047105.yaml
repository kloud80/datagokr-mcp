description_portal: '○ 통계개요* 통계명 : 인터넷뱅킹 이용률과 이용기기* 통계종류 : 지정통계, 승인번호(12005)* 근거법령 : 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제52조* 작성목적 : 급속히 변화하는 국내가구의 인터넷 이용환경 및 국민의 인터넷 이용현황과이용행태 등을 파악하여 관련 정책수립과 연구활동 등 다양한 영역에서 활용할 수 있도록 기초자료 및 정보 제공을 목적으로 함* 조사체계 : 조사원→전담조사기관→한국인터넷진흥원→미래창조과학부* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 인터넷뱅킹 이용률 및 이용하는 이용기기 비율○ 용어설명* 이용률 : 만12세 이상 인터넷 이용자 중 최근 1년 이내 인터넷뱅킹을 이용한 자의 비율* 인터넷뱅킹：인터넷으로 계좌조회ㆍ이체, 지로조회ㆍ납부, 대출조회ㆍ납입 등의은행 업무를 처리할 수 있는 금융서비스로 모바일뱅킹도 포함○ 기타* 문 : 인터넷뱅킹(모바일뱅킹 포함) 서비스에 접속할 때 이용하는 기기는 무엇입니까?해당사항을 모두 선택해 주십시오.* 복수응답은 한 개 이상(1-3순위 또는 모두 선택)을 응답한 결과치를 집계한 결과임'
