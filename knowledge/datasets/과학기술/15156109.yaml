summary_user: 한국인터넷진흥원 본인확인 지원포털의 각 메뉴에 들어간 콘텐츠를 건별로 담은 파일(CSV, 약 279KB)로, 콘텐츠 제목·본문·상태·버전과 등록일시·마지막 수정일시, 사이트 구분(사이트 프리픽스)을 포함한다. 포털 운영 분석가가 어떤 메뉴 콘텐츠가 언제 등록되고 몇 번 개정됐는지 변경 이력을 추적할 때 쓴다. 다른 데이터와 잇는 전역 조인 키는 없으며, 같은 데이터 안에서 최초 콘텐츠 아이디로 한 콘텐츠의 버전들을 묶어 보는 정도로만 연결된다.
description_portal: 한국인터넷진흥원 본인확인 지원포털에서 제공하는 ‘메뉴 콘텐츠’ 데이터는 포털 내 각 메뉴에 포함된 콘텐츠의 생성·관리 이력을 체계적으로 확인할 수 있도록 구성된 서비스 운영 기반 공공데이터이다. 이 데이터에는 콘텐츠의 고유 식별자, 최초 등록된 콘텐츠 ID, 콘텐츠 제목과 상세 내용, 현재 상태, 버전 정보가 포함되어 있어 콘텐츠 변경 기록과 서비스 품질 관리에 활용될 수 있다. 또한 콘텐츠 최초 등록일과 마지막 수정일시, 사이트 프리픽스 정보까지 제공함으로써 페이지 구조 분석, 서비스 운영 이력 추적, 콘텐츠 개선 정책 마련에 필요한 기초자료 역할을 한다. 주요 항목은 내용ID, 최초콘텐츠ID, 콘텐츠타이틀, 콘텐츠내용, 콘텐츠상태, 콘텐츠버전, 등록일자, 수정일시, 사이트프리픽스로 구성된다.
