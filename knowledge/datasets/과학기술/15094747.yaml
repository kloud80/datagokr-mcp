summary_user: 2018년 1월부터 2020년 11월까지 제주특별자치도 공공 와이파이 이용자 수를 기준연월·설치 장소·성별·연령대별로 집계한 통계로, 건별 접속 기록이 아니라 집계값(user_count)을 담는다. 관광·교통 정책 담당자나 연구자가 "제주의 어느 장소에서 어떤 연령대가 공공 와이파이를 많이 썼는가"처럼 장소별 이용 패턴과 그 변화를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 와이파이 장소명(wifi_place_name)을 이름으로 맞추거나 같은 기관 자료끼리 이어 써야 한다.
description_portal: 이 데이터셋은 2018년 1월부터 2020년 11월까지 제주특별자치도 내 공공 와이파이 이용자를 장소별, 연령별, 성별로 구분하여 집계한 통계자료입니다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 공개되어 있으며, 누구나 별도 비용 없이 다운로드하여 활용할 수 있습니다. 이 자료는 공공 와이파이 이용 패턴 분석, 관광객 및 도민의 디지털 접근성 연구, 도시 인프라 및 통신망 정책 수립, 스마트 관광 및 교통 인프라 기획 등에 유용합니다. 다만 조사 시점이 2020년까지이며 이후의 와이파이 설치, 해제, 이용 행태 변화는 반영되어 있지 않을 수 있다는 한계가 있습니다
