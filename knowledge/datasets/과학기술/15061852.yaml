summary_user: 경기도 내 태양광발전소를 발전소 한 곳당 한 행으로 담은 건별 현황 자료로, 시설명·지번주소·위도경도·가동상태·설비용량·공급전압·설치연도·허가일자·자료등록기관 등을 포함한다. 분석가가 "경기도 어느 시군에 태양광 설비가 밀집해 있고, 가동 중인 설비용량은 얼마인가"를 따질 때나 발전소 위치를 지도에 시각화할 때 쓴다. 전역 조인 키는 없어 주소·위도경도로 행정구역 경계나 다른 공간 자료와 붙이거나, 시설명·기관명 매칭으로만 다른 데이터와 연결한다.
description_portal: '이 데이터는 경기도 내 태양광발전소에 대한 전기사업 허가 및 설치 현황을 정리한 자료로, 각 발전소의 시설 정보 및 가동상태를 파악할 수 있습니다. 주요 항목은 태양광발전시설명, 소재지 주소, 위도·경도, 가동상태구분명, 설비용량(KW), 공급전압, 설치연도, 허가일자, 허가기관 등으로 구성되어 있습니다. 이 데이터는 신재생에너지 보급 정책 수립, 전력생산 예측, 설치밀도 분석, 환경영향 평가, 발전소 위치기반 시각화 등에 활용될 수 있습니다. 일부 항목은 누락되어 있으나, 공급전압·설비용량 등 핵심 기술적 정보는 제공됩니다.※ 3,000KW 초과 : 산업통상자원부 허가 대상※ 500KW초과~3,000KW이하 : 경기도 허가 대상※ 500KW이하 : 시군'
