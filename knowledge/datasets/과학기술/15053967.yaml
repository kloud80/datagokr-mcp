description_portal: 과학기술정보통신부가 실시한 이공계인력 육성·활용과 처우 등에 관한 실태조사 중 이공계인력의 고용현황을 성별 및 학위유형별로 분석한 통계 데이터입니다. (2009년)전체 계열과 이공계를 비교하여 이공계 인력의 고용 특성을 파악할 수 있는 자료입니다. 데이터는 전계열과 이공계로 구분되며, 각각 총원, 대기업, 중소기업으로 세분화되어 있습니다. 성별로는 남성과 여성, 학위유형으로는 박사, 석사, 학사, 학사미만으로 구분하여 각 범주별 고용 인원수를 제시합니다.이 데이터는 이공계 인력의 성별 불균형 현황 파악, 학위별 고용 구조 분석, 대기업과 중소기업 간 인력 분포 비교, 전체 계열 대비 이공계의 특성 분석 등에 활용될 수 있습니다
