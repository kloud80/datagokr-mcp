description_portal: '이 데이터는 국내 공공 및 민간 웹사이트가 웹접근성 품질인증을 받은 내역을 정리한 자료입니다. 장애인·고령자 등 정보 취약계층도 웹사이트를 차별 없이 이용할 수 있도록 보장하기 위한 웹접근성 인증 현황을 나타냅니다.데이터는 다음과 같은 항목으로 구성됩니다.기관명 : 인증을 받은 기관 또는 기업의 명칭사이트명 : 인증 대상 웹사이트의 이름사이트 주소 : 해당 웹사이트의 URL인증시작 : 인증이 시작된 날짜 (YYYY-MM-DD 형식)인증종료 : 인증이 유효한 종료일상태  : 인증 상태 (예: 유효, 만료, 심사 중 등)인증기관 : 인증을 수행한 기관명 (예: 웹와치, 한국웹접근성인증평가원 등)신청구분 : 인증 신청 유형 (예: 신규, 갱신 등)이 데이터는 웹접근성 정책 수립, 공공기관 홈페이지 관리, 인증 현황 모니터링 등에 활용될 수 있으며, 인증 이력과 만료 현황을 기반으로 사후 점검이나 개선 요청 자료로도 유용하게 사용됩니다.'
