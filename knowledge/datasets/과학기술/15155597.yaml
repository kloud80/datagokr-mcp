description_portal: '□ 개요본 데이터셋은 국립과천과학관 과학기술사료관에 비치하기 위해 구입 및 등록한 도서들의 상세 정보를 정리한 자료입니다. 소장 도서의 서지 정보와 등록 현황을 체계적으로 관리하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 발행년도와 등록일자 정보를 분석하여 시기별 장서 확충 현황과 도서의 최신성을 파악하고 향후 수서 정책 수립에 반영할 수 있습니다. 둘째, 도서 가격 정보를 통해 예산 집행 규모를 모니터링하고 장서 구입의 경제성을 평가하는 기초 통계 자료로 활용 가능합니다. 셋째, 도서 제목과 저자 정보를 기반으로 소장 자료의 주제별 구성을 점검하여 균형 잡힌 장서 개발 계획을 수립하는 데 기여할 수 있습니다.□ 데이터 구조· 도서제목 : 국립과천과학관 과학기술사료관에 등록된 도서의 제목 (String)· 저자 : 해당 도서를 집필하거나 엮은 저자 및 편저자 정보 (String)· 발행년도 : 도서가 출판된 연도 (String, YYYY)· 페이지 : 도서의 본문 전체 페이지 수 (String, 예: 308p.)· 가격 : 도서의 구입 가격 (Float, 원 단위)· 등록일자 : 도서가 사료관 시스템에 등록된 날짜 (String, YYYY-MM-DD)'
