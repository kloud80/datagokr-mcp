description_portal: 이 데이터는 기초과학연구원 내 각 부서 및 연구단에서 회의, 교육, 세미나 등 비대면 행사를 효율적으로 운영하기 위해 보유 중인 화상회의 장비의 현황을 관리하기 위한 자료이다. 주요 항목은 장비명, 대여가능여부, 등록일, 수정일, 장비순번, 허용수량으로 구성되어 있으며, 장비별 보유 현황과 대여 가능 여부를 명확하게 파악할 수 있다. 이를 통해 사용자는 필요한 장비의 종류와 수량을 확인하고 효율적인 자원 운영계획을 수립할 수 있다. 또한 등록일과 수정일을 통해 데이터의 최신성을 유지함으로써 기관 내 장비 관리의 투명성과 행정업무의 신뢰성을 높인다. 본 데이터는 연구지원 환경의 디지털 전환과 공공데이터 기반 자원관리 혁신에 기여하는 핵심 자료이다.
