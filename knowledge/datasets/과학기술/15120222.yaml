description_portal: 과학기술정보통신부에서 제공하는 전국 17개 광역지방자치단체의 과학기술 거버넌스 및 전담조직 현황 데이터입니다. 각 지자체별로 과학기술 정책과 사업을 담당하는 행정조직 체계를 체계적으로 정리한 자료로, 지역 과학기술 행정의 현황을 한눈에 파악할 수 있는 데이터입니다.데이터는 연번, 기관명, 총괄체계, 전담부서(국), 전담부서(과), 전담부서(팀)의 6개 항목으로 구성되어 있습니다. 총괄체계는 주로 경제부시장 또는 행정부시장이 담당하며, 그 산하에 미래산업국, 혁신성장실, 과학산업국 등 다양한 명칭의 국 단위 조직과 과학기술과, 미래기술혁신과 등의 과 단위 조직, 그리고 실무 담당팀이 계층적으로 배치되어 있습니다. 일부 지자체는 과학관 운영 조직도 포함하고 있습니다.이 데이터는 중앙정부와 지방정부 간 과학기술 정책 협력, 지자체 간 벤치마킹, 과학기술 관련 네트워킹 구축, 지역별 과학기술 정책 수립 시 협력 대상 파악 등에 활용될 수 있습니다. 또한 지역 과학기술 혁신 생태계 구축과 거버넌스 개선을 위한 기초자료로서도 가치를 지닙니다.
