summary_user: 공인전자문서 중계자로 지정된 법인을 한 행씩 담은 목록 파일(CSV, 약 2.8KB)로, 법인명·지정일자·홈페이지·전화번호와 모바일·샵메일 플랫폼 사용 여부, 사용 여부, 등록·수정일시를 담는다. 공인전자문서(샵메일)를 보내거나 받으려는 국민·사업자가 어떤 법인이 공식 지정 중계자이고 언제 지정됐는지 확인하는 데 쓴다. 실측 조인 키는 파일 아이디(edoc_file_id) 하나이며, 이는 전자문서통합지원센터의 다른 파일과 맞출 때 쓰는 값이고 사업자등록번호나 지역 코드 같은 외부 연계 키는 없다.
description_portal: 한국인터넷진흥원에서 운영하는 전자문서통합지원센터의 공인전자문서 중계자 관리정보 데이터는 전자문서의 신뢰성과 안전한 유통을 지원하기 위해 체계적으로 관리되고 있습니다. 해당 데이터는 중계자별 고유 식별을 위한 시퀀스 번호를 포함하며, 모바일 플랫폼 및 샵메일 플랫폼 사용 여부를 통해 중계자의 서비스 환경과 접근 방식을 파악할 수 있습니다. 또한, 중계자를 대표하는 법인명과 지정일자 정보가 포함되어 있어 중계자의 공식 지정 현황을 명확히 알 수 있습니다. 이와 더불어 각 중계자의 공식 홈페이지 주소를 포함하여 관련 정보 접근성과 투명성을 높이고 있습니다. 이러한 데이터는 전자문서의 안전한 유통과 중계자 간 신뢰 구축에 필수적인 관리 정보를 제공함으로써, 공인전자문서 서비스의 품질 향상 및 신뢰성 확보에 기여하고 있습니다.
