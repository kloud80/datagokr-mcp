description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 교통통신원이 접수한 제보 건수를 지역·시간 단위로 집계한 통계이다. 항목은 지역방송본부, 집계시점, 제보유형(사고·정체·공사·기상), 제보채널(전화·앱·DMB), 건수, 비고로 구성한다. 제보유형은 내부 기준에 맞춘 표준 분류이며, 채널 필드는 참여 경로 비교에 활용된다. 이용자는 시간대별·지역별 제보량을 분석하여 혼잡 구간, 기상 영향, 출퇴근 피크 등 교통 현상의 변화를 파악할 수 있다. 또 제보 건수와 방송 반영 건, 검증 상태 등을 연계하면 제보 품질과 커버리지 평가가 가능하다.
