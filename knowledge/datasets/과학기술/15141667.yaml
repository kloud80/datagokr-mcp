description_portal: '이 자료는 속초시 관내에 설치된 태양광발전소들의 허가 내역과 기본 정보를 정리한 것입니다. 각 발전소별로 발전소명, 대표자, 소재지, 용도지목, 허가면적, 허가용량, 허가일자, 그리고 실제 설치일(사업 개시일)을 포함하고 있습니다. 총 몇 건인지는 자료 전체를 확인해야 정확하나, 첫 5건은 2015~2016년에 집중되어 있습니다.대부분의 발전소는 임야 또는 대지에 설치되었으며, 일부는 학교용지에 설치된 사례도 있습니다(예: 청호초 태양광발전소).허가용량은 50~100kW 이하가 많으며, 이는 소규모 분산형 태양광 발전의 특성을 반영합니다.설치일자는 허가일자보다 수개월~수년 뒤로 나타나며, 실제 시공 및 전력 판매 개시까지의 시간차가 존재함을 보여줍니다.'
