summary_user: SW산업정보종합시스템에 SW사업자로 신청해 수리가 끝난 업체의 회사명·대표이사·홈페이지·본사주소·재무현황연도를 업체 한 곳당 한 행으로 담은 원장 파일이며, 전국 61,448건이다. 소프트웨어 업체의 본사 위치나 대표자를 확인하려는 분석가나 발주 담당자가 쓴다. 사업자번호 필드는 없고 본사주소(address)가 유일한 조인 키라서, 주소를 기준으로 상권·기업 데이터와 이어 쓴다.
limits: 사업자번호 필드가 없어 연계는 본사주소 문자열 일치에 의존하며, 홈페이지 주소는 연계 키로 쓸 수 없다. 재무 수치는 없고 재무현황 연도만 있으며, 세부 정보는 SW산업정보종합시스템 사업자검색에서 따로 확인해야 한다.
