description_portal: 시청자미디어재단이 매년 선정하여 지원하는 특수학교 미디어교육 지원 사업의 추진 현황을 체계적으로 정리한 자료로, 지원 대상 학교와 교육 운영 내용을 파악할 수 있도록 구성되어 있습니다. 해당 사업은 특수학교 학생들을 대상으로 미디어 활용 능력을 향상시키고, 장애 유형과 교육 대상에 적합한 맞춤형 교육을 제공하기 위해 운영되며, 이를 통해 교육 기회의 형평성을 높이고 미디어 접근성을 확대하는 데 목적이 있습니다. 또한 각 학교별 교육 운영 실적을 기록함으로써 사업의 효과성과 추진 성과를 객관적으로 확인할 수 있도록 하고 있습니다.공개되는 데이터는 선정된 학교의 기본 정보와 함께, 해당 학교에서 운영된 미디어교육 프로그램의 내용, 학교유형, 교육대상, 장애유형, 교육형태, 교육일시, 담당센터, 지원연도, 학교명, 지역 등 항목을 포함하고 있습니다. 이를 통해 이용자는 교육 대상과 프로그램 특성, 운영 방식 등을 구체적으로 파악할 수 있습니다.본 자료는 선정 당시의 원천 데이터를 기반으로 공개되는 것으로, 사업의 투명성을 높이고 관련 정책 수립이나 연구, 유사 사업 기획 시 참고자료로 활용될 수 있도록 제공되고 있습니다.
