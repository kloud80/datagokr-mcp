description_portal: '1. 개요지식재산권 관련 출원인 공보 개제 정보현황 중 주소현황에 대해 제공합니다. 출원인코드, 공보주소게재 구분코드(공보 내 출원인의 주소가 전체주소인지, 일부 주소인지 여부), 공보정보의 최종변경일자에 대해 제공하고 있습니다. 본 데이터는 공보에 포함된 출원인의 주소 정보가 전체주소까지 공개되었는지 여부 및 이에 대한 집계 데이터를 제공할 수 있으며, 각 출원인이 어떤 유형에 속하는지도 집계할 수 있습니다.2. 세부 정보 내용지식재산권의 기본 정보인 출원인의 공보 게재 내용의 변경일자, 공보게재 구분코드, 출원인코드로 구분하여 csv로 제공합니다.1) 출원인 고유번호(출원인코드) : 지식재산처에서 특허 출원인(기업 또는 개인)을 고유하게 식별하기 위해 사용하는 코드로, 이 코드는 각 출원인에게 부여되며 출원인 이름을 정확히 구분하고, 특허 데이터를 보다 효율적으로 관리하고 검색할 수 있게 돕습니다.2) 출원인 구분 : 출원인의 성격을 확인할 수 있으며, 국내개인/국내법인/외국인/외국법인/국가기관/사단재단 여부 확인이 가능합니다. 공보 내 주소 변경 신청을 한 출원인의 성격구분을 확인 가능합니다.3) 공보주소게재 구분코드 : 지식재산처에서 특허 출원 공보를 게재할  때, 공보 내의 주소와 관련된 정보를 구분하기 위해 사용하는 코드입니다. 출원인의 개인정보 보호를 위해, 2025년10월부터 신청이 있는 경우에 한하여 일부주소(부분주소)를 게재할 수 있습니다. 기본적으로는 게재하는 것을 원칙으로 하되, 출원인의 신청이 있는 경우에 전체주소 중 상세주소를 제공하지 않고 일부주소(부분주소)를 게재합니다.  4) 공보 내 전체주소 게재 여부 : 출원인의 주소가 공보 상 전체가 다 기재되었는지, 상세주소는 비공개처리 되었는지 제공합니다.5) 공보의 최종변경일자 :  공보상 최종변경일자로, 코드 관련 변경 및 기타 변경을 포함하여 반영합니다.실제 데이터 행 수 : 197398개'
