summary_user: 전국 종합유선방송사업자(케이블TV SO)를 사업자 한 곳당 한 행으로 담은 원장 파일로, 소속 복수종합유선방송사업자(MSO)명·법인명·SO명·방송구역·사업자등록번호를 담는다. 특정 시군구에서 어느 케이블TV 사업자가 방송하는지, 한 MSO가 어느 지역의 SO를 거느리는지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 정보·상권·기업 데이터와 잇는다.
description_portal: '방송미디어통신위원회가 관리하는 전국 종합유선방송사업자(케이블TV) 현황 데이터입니다. 데이터는 복수종합유선방송사업자(MSO)명, 법인명, 종합유선방송사업자(SO)명, 방송구역, 사업자등록번호의 5개 항목으로 구성되어 있습니다. 각 사업자의 서비스 제공 지역이 시군구 단위로 명확히 구분되어 있어 지역별 방송 서비스 현황을 파악할 수 있습니다. 이 데이터는 방송통신 정책 입안, 지역별 방송 서비스 격차 분석, 케이블TV 시장 구조 연구, 방송 산업 투자 의사결정, 지역 미디어 환경 분석 등에 활용될 수 있으며, 디지털 방송 전환과 OTT 서비스 확산 시대에 전통 유선방송 시장의 현황을 이해하는 중요한 자료입니다.*컬럼명 : MSO명, 법인명, SO명, 방송구역'
