description_portal: 한국과학창의재단에서 제공하는 '사이언스타임즈'의 과학기술 정책 관련 기사 데이터입니다. 정부 부처의 과학기술 정책 발표, 법률 및 제도 변경, 연구개발(R&D) 투자 방향 등 국가 과학기술 정책 전반에 대한 정보를 제공하여 정책 투명성을 높이고 국민적 공감대 형성에 기여하고자 합니다.개방 데이터는 2003년 5월부터 2021년 10월까지 발행된 과학정책 관련 기사 약 4,200여 건입니다. 데이터는 기사 제목, 작성자, 등록일자, 본문, 웹페이지 주소(URL), 태그, 조회수 등으로 구성되어 있어 정책의 내용과 그에 대한 반응을 함께 살펴볼 수 있습니다.정부·공공기관은 정책 수립 및 평가를 위한 기초자료로 활용하여 보다 효과적인 과학기술 정책을 추진할 수 있습니다. 학계·연구기관은 과학기술 정책의 흐름과 변화를 연구하고, 미래 정책 방향을 제시하는 데 활용할 수 있으며, 기업 및 산업계는 정부 정책에 따른 사업 전략을 수립하고 새로운 기회를 모색하는 데 기여할 수 있습니다.
