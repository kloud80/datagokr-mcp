summary_user: 충청남도 청양군 관제센터에 연결된 CCTV 카메라를 한 대(설치 지점)씩 담은 건별 원장으로, 관리기관·설치장소·설치주소·설치목적·보관일수·촬영방향과 위도·경도를 담는다. 주민이나 분석가가 '우리 동네 어느 지점에 방범·교통 등 어떤 목적의 카메라가 있고 영상은 며칠 보관되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 설치주소나 위도·경도를 기준으로 다른 시설·주소 데이터와 공간적으로 맞춰 쓰거나 같은 기관명으로만 연결한다.
description_portal: 해당 데이터는 충청남도 청양군 관내에 소재하는 관제센터 카메라 정보 현황을 나타내는 자료로,관제센터 카메라 정보 현황 활용 수요 증가에 따라 주목받고 있는 관제센터 카메라 정보 현황의 상세 정보를 제공합니다.데이터 항목에는 관리기관명, 설치장소 등이 포함되어 있으며,이를 통해 각 관제센터 카메라 정보 현황의 상세 정보를 파악할 수 있고, 관련 자원 연계에도 활용할 수 있습니다.이 자료는 지역 활성화 정책 수립, 관제센터 카메라 정보 현황 개발 등의 기초 자료로 활용될 수 있으며,도시와 농촌 간의 교류를 확대하고 관제센터 카메라 정보 현황 이용 활성화를 도모하는 데 기여할 수 있습니다.청양군의 관제센터 카메라 정보 현황을 한눈에 파악할 수 있는 유용한 자료입니다.
