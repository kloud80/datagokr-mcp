summary_user: 한국도로교통공단 TBN 한국교통방송의 FM 라디오 중계소 현황을 담은 전국 범위의 작은 파일(CSV 411바이트)이다. 실측 파일은 광주·대구·대전·경인·강원·전북·경남·경북·제주 같은 방송국명이 열 머리로 가로 펼쳐진 형태이며, 중계소 열은 16개다. 운전자나 분석가가 'TBN을 우리 지역에서 어느 중계소, 어느 주파수로 듣는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 방송국명·지역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 한국도로교통공단 산하 TBN 한국교통방송의 FM 라디오 중계소 현황을 정리한 자료이다. 주요 항목은 방송국명, 중계소명, 주파수(MHz), 송출권역, 행정구역 또는 좌표, 송신소 주소, 송출출력(ERP), 개소일, 관할 방송국 등이며 개인정보는 포함하지 않는다. 이를 통해 지역별 수신 범위와 난시청 구간을 파악하고, 도로축·생활권 커버리지 검증, 중계망 보완 필요 구간 도출, 라디오·내비게이션 안내 고도화 등에 활용한다. 또한 재난·사고 발생 시 권역별 긴급정보 전파 경로를 사전 검토하고 대체 송출 계획 수립의 기초가 된다.
