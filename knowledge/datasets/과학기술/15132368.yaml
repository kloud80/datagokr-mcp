description_portal: 한국탄소산업진흥원이 수행한 연구개발 및 발명 활동을 통해 출원·등록한 특허 현황입니다. 2010년부터 2026년까지 등록된 특허 총 286건의 누적 자료를 포함하며, 각 특허의 등록일, 등록번호, 출원일, 출원번호, 발명의 명칭, 발명자, 출원인, 대리인, 등록 상태 등의 세부 정보를 상세히 제공합니다. 해당 데이터는 기관이 보유한 지식재산권 현황과 연구 성과를 체계적으로 파악할 수 있도록 구성되어 있으며, 최신 사회·산업 동향과의 연계 가능성을 검토할 수 있는 기초 자료로 활용할 수 있습니다.
