description_portal: '첨부된 ‘관람안내 추천코스’ 시트는 추천코스명, 연령, 예상시간, 점수, 정렬순서, 추천코스 사용여부 등 6개 컬럼으로 구성됐다. 유치원·초등·중고등·성인 대상의 1시간·2~3시간·하루 코스를 8개 전시관(꿈아띠체험관·자연사관/인류관·생물탐구관·어린이과학관·창의나래관·과학기술관·미래기술관·천체관)에 걸쳐 제시하며, 모든 코스에 동일한 점수(3.47)와 명확한 순서가 부여돼 있다. 사용여부(Y/N) 컬럼을 통해 활성화 상태를 구분하고, 특히 24번째 레코드는 모든 연령을 대상으로 하루 전체 코스를 구성한 복합 경로를 제공해 종합 관람 계획 수립에 유용하다. 엑셀 파일 형태로 제공돼 필요 시 CSV 변환 후 웹·앱 개발, 교육 콘텐츠 제작, 연구 분석, UI·UX 설계 등 다방면에 활용할 수 있으며, 직관적인 데이터 구조로 신속한 가공과 시각화 작업도 용이하다- 제공목록: 추천코스명, 연령, 예상시간,  만족도 점수, 추천코스 사용여부'
