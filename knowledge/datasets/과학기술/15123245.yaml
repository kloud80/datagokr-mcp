summary_user: 판교제로시티에서 운행한 제로셔틀 자율주행 차량의 GPS·INS 측정값을 수집 시각과 순번별 건으로 담는다. 위도·경도·고도, GPS 상태, 위치 공분산, 방향(쿼터니언), 3축 각속도·선형가속도가 들어 있다. 자율주행 연구자나 개발자가 실제 셔틀의 주행 궤적과 차량 거동을 재현하거나, 측위·센서융합 알고리즘을 검증할 때 쓴다. 실측 컬럼에서 다른 데이터와 잇는 공통 조인 키를 찾지 못했으므로, 같은 판교제로시티 자율주행 데이터 서비스의 다른 항목과 수집일시(clct_dt)·순번을 기준으로 맞춰 쓰는 정도로 연결한다.
description_portal: '서울대학교 연구소 차세대융합기술연구원 판교제로시티 자율주행 데이터 조회 서비스 중 제로셔틀차량 GPS/INS 데이터 정보 조회입니다.자율주행 서비스 개발의 기반 마련을 위해 판교제로시티에서 수집, 가공한 자율주행 인프라 및 실증 데이터를 조회 및 제공합니다.주요 항목으로 위도, 경도, 고도를 포함한 위치 정보와 X축각속도, Y축각속도, Z축각속도, X축선형가속도, Y축선형가속도, Z축선형가속도 등의 속도 및 가속도 정보가 포함됩니다. *INS (Inertial Navigation System): 가속도계와 자이로스코프를 이용하여 차량의 이동을 계산하는 장치*참고자료 및 데이터 다운로드 : FILE탭'
accrual_periodicity: 수시
