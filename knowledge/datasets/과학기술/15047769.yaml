description_portal: 본 데이터는 기초과학연구원이 운영하는 특허 관련 정보 통합 관리 시스템에 대한 자료이다. 해당 시스템은 연구 성과로부터 발생한 지식재산의 출원, 등록, 유지, 기술이전 등 일련의 과정을 전산화하여 관리하며, 과제명, 발명자, 출원일, 등록번호, 권리 상태, 이전 여부 등의 정보를 포함한다. 이용자는 이를 통해 기관의 지식재산 관리 현황을 확인하고, 기술사업화 가능성 및 연구 성과의 보호 상태를 분석할 수 있다. 본 데이터는 연구기관의 자산으로서의 특허 정보를 체계적으로 제공함으로써, 정책 수립, 연구 전략 수립, 외부 평가 대응 등 다양한 행정 및 전략적 활용이 가능하다. 데이터는 주기적으로 갱신되며, 지식재산 기반의 연구관리 강화를 위한 주요 자료로 제공된다.
