description_portal: 본 데이터는 전파누리(주파수 종합정보시스템)에서 제공하는 주간보고 자료, 연구보고 자료 등 기술연구자료 목록 현황 입니다. 해당 자료는 전파자원관리, 주파수 정책, 전자파 기술, 무선통신, 방송기술, 전파응용산업 등과 관련된 연구보고서, 논문, 정책분석자료 등의 연구자료들을 포함합니다. 자료는 기술연구의 제목, 간단한 연구 내용, 조회수, 출처 그리고 연구내용의 첨부파일과 링크로 구성됩니다. 본 자료는 기술개발 동향과 연구성과 파악에 활용될 수 있고, 전파산업 정책수립, 기술표준 검토, 연구개발 기획 및 학술연구 지원 등 다양한 분야에서 활용될 수 있습니다. 데이터는 전파 및 방송통신 분야의 연구성과 확산과 기술정보 접근성 향상을 목적으로 제공됩니다.
