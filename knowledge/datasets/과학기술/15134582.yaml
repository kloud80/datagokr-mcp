summary_user: 한국인터넷진흥원 전자문서통합지원센터가 관리하는 전자화 작업장 목록으로, 작업장 한 곳당 한 행에 운영 상태, 법인명, 지정년월, 홈페이지, 전화번호, 사용 여부를 담은 작은 CSV 파일(1,788바이트)이다. 종이문서를 전자화하려는 기업이나 기관이 지정된 전자화 작업장이 어디이고 지금 운영 중인지, 연락처가 무엇인지 확인하는 데 쓴다. 실측 조인 키는 파일 아이디(edoc_file_id) 하나이며, 사업자등록번호나 지역 코드 같은 다른 공용 키는 없어 다른 데이터와는 법인명 문자열로만 맞춰 볼 수 있다.
description_portal: 한국인터넷진흥원에서 운영 중인 전자문서통합지원센터의 전자화 작업장 관리 정보 데이터로, 각 작업장에 부여된 고유 시퀀스 번호와 현재 운영 상태, 소속 법인명, 지정일시, 공식 홈페이지 주소, 연락 가능한 전화번호, 그리고 작업장의 사용 여부 등 다양한 세부 항목을 포함하고 있습니다. 이 데이터는 전자문서화 작업장 현황을 체계적으로 관리하고 실시간으로 모니터링하는 데 활용되며, 전자문서 처리와 관리의 효율성 제고는 물론 관련 법적·행정적 요구사항을 충족하는 데 중요한 역할을 합니다. 또한, 작업장별 상세 정보를 통해 업무 연계성 및 지원 현황을 면밀히 파악할 수 있도록 구성되어 있어 전자문서 관련 행정 운영과 정책 수립에 필수적인 기초 자료로 활용됩니다. 이를 통해 전자문서통합지원센터는 전자문서의 안전하고 신뢰성 있는 관리 환경 조성에 기여하고 있습니다.
