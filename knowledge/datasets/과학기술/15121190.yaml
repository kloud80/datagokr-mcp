summary_user: 서울 종로구에 설치된 공중전화를 한 대(한 곳)씩 행정동·전화번호·설치장소·주소와 함께 담은 시군구 단위 개별 시설 목록이다. 주민·방문객이 가까운 공중전화를 찾거나, 행정·연구기관이 '종로구 어느 행정동에 공중전화가 부족한가'처럼 통신 인프라 접근성을 따질 때 쓴다. 전역 조인 키는 없어 행정동 이름이나 주소 문자열을 매핑해 다른 행정동 단위 자료·주소 기반 자료와 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구에 설치된 공중전화 시설의 현황을 제공하며, 행정동, 전화번호 및 상세주소 등의 정보를 포함하고 있습니다. KT 및 KT링커스로부터 제공받은 자료를 기반으로 작성된 본 데이터는 종로구 내 공중전화 위치를 체계적으로 파악할 수 있도록 구성되어 있습니다. 해당 정보는 행정기관과 연구기관이 통신 인프라 유지·관리 계획을 수립하고, 공공서비스 접근성 평가 및 생활편의 시설 보완에 활용할 수 있습니다. 주민과 방문객은 이를 통해 가까운 공중전화를 쉽게 찾을 수 있으며, 비상 상황 시 유용한 연락수단 확보에도 기여합니다.
