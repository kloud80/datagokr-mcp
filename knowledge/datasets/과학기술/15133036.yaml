summary_user: 도립공원 안팎 산악지역에 개설된 이동통신(3G·4G·5G)용 무선국을 공원명·용도·주소·경도·위도 단위로 건별 담은 파일 데이터로, 전국 4,350행이다. 분석가나 지자체 담당자가 특정 도립공원에 이동통신 무선국이 어디에 몇 곳 있는지, 행정구역별 설치 밀도는 어떤지 확인하는 질문에 쓴다. 주소(address)와 경도·위도(coord)를 키로 삼아 다른 위치·주소 기반 데이터와 이어 쓰며, 공원명과 용도는 별도 코드표가 없어 문자값 그대로 맞춰야 한다.
description_portal: 본 데이터는 한국방송통신전파진흥원의 전파누리(https://spectrummap.kr/)홈페이지에서 관리하는 산악지역에 위치한 이동통신서비스를 목적으로 개설된 무선국 정보입니다. 해당 데이터는 도립공원의 이름, 용도(3G, 4G, 5G), 도립공원 주소, 위도와 경도를 포함합니다. 하나의 도립공원명 아래에  서로 다른 용도나 주소 항목이 존재할 수 있습니다. 본 자료는 전파자원의 효율적 이용과 공공통신 인프라 관리체계 강화를 위한 기초자료로 활용될 수 있으며, 공공안전, 재난통신, 관광안내, 환경모니터링 등 공원 내 다양한 통신수단의 운용 실태 확인 등에 활용될 수 있다. 무선국의 설치밀도, 행정구역별 분포 현황을 분석하는 데 유용하게 사용될 수 있습니다.
