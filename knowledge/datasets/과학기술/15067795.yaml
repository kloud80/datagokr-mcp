summary_user: TBN 한국교통방송의 지역 방송국별 FM 송신 현황을 담은 전국 단위 목록 파일(csv, 265바이트)로, 실측 컬럼은 '방송국' 항목과 부산·광주·대구·대전·경인·강원·전북·울산·경남·경북·제주 11개 지역 TBN 방송국 열로 짜여 있다. 운전자나 청취자가 "이 지역에서 TBN 교통방송을 어느 주파수로 듣나"를 확인하거나, 분석가가 지역 방송국 구성을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 방송국명·지역명을 이름으로 맞추거나 같은 기관(한국도로교통공단) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 FM 송신소·중계소 현황을 정리한 목록이다. 항목은 방송국명, 관할본부, 송출권역, 주파수(MHz), 송신소/중계소명, 주소, 좌표(WGS84), 송신출력(또는 ERP), 안테나 형식, 설치유형, 비고로 구성한다. 주파수·권역 정보는 지역별 청취 채널 식별에, 좌표·주소는 지도 시각화와 현장 점검에 활용된다. 출력·안테나는 수신 품질과 커버리지 분석의 기초 지표이다. 본 현황은 공단 교통방송국 운영 체계와 각 지역 방송의 주파수 편성 자료를 근거로 하며, 방송시설 허가·변경 기록과 연계하여 송신망 관리, 재난정보 전달 경로 설계, 난청 구간 개선 과제 도출 등에 참고된다.
