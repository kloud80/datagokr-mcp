summary_user: 한전KDN이 보유한 특허를 건별로 정리한 파일로, 특허마다 발명명칭·등록번호·등록일을 담는다(CSV 약 58KB). 전력 IT 분야 협력이나 기술이전을 검토하는 사업자·분석가가 이 회사가 어떤 기술을 언제 특허로 등록했는지 확인할 때 쓴다. 등록번호(kipo_rgst_no)를 키로 특허청 특허 등록·공보 정보와 이어 권리 상태나 청구항 같은 상세 내용을 붙여 본다.
description_portal: 한전KDN의 2023년도 특허 보유현황 데이터는 회사의 기술 혁신과 연구개발 역량을 잘 보여줍니다. 이 데이터는 각 특허의 발명명칭, 등록번호, 그리고 등록일자를 포함하여 체계적으로 정리되어 있습니다. 이를 통해 한전KDN이 보유한 독자적 기술과 지식재산권의 범위와 시기를 한눈에 파악할 수 있습니다. 특허는 회사의 경쟁력 확보와 산업 내 기술 선도를 위한 중요한 자산으로서, 지속적인 연구개발 투자와 혁신 성과를 반영합니다. 또한, 특허 보유 현황은 대외 협력과 기술 라이선싱, 그리고 신사업 기회 발굴에도 핵심적인 역할을 수행합니다. 한전KDN은 특허관리를 통해 기술 보호와 함께 글로벌 시장 진출 기반을 강화하고 있습니다.
