description_portal: 과학기술정보통신부에서 제공하는 이공계 박사학위 취득장소별 분포 현황 통계 데이터입니다.(2010년) 국내 이공계 박사인력의 학위 취득 경로를 다각도로 분석한 자료로, 인력의 교육 배경과 국제화 수준을 종합적으로 파악할 수 있는 상세한 통계자료입니다. 주요 데이터 항목으로는 박사학위 취득장소를 국내와 국외로 구분하여 성별(남성/여성), 연령대별(20대부터 60대 이상까지), 전공별(자연계, 공학계, 의약학계), 현재 직장유형별(기업, 공공연구소, 대학, 기타)로 세분화한 인원수를 제공합니다. 각 분류 기준별로 국내외 박사학위 취득자의 분포와 특성을 상세하게 비교 분석할 수 있도록 구성되어 있습니다. 이 데이터는 이공계 박사인력의 교육 국제화 정책 수립, 해외 우수인력 유치 전략, 국내 대학원 경쟁력 강화, 인력 유동성 분석, 경력경로 연구, 성별·연령별 교육 정책 차별화 등에 활용될 수 있습니다.
