description_portal: 한국과학창의재단은 소프트웨어(SW)와 인공지능(AI) 교육에 대한 국민적 공감대를 형성하고 관련 문화를 확산시키기 위해 매년 'SW교육 페스티벌'을 개최하고 있습니다. 페스티벌에서 공유된 전문가 강연, 개발자 토크쇼, 우수 수업사례 등의 영상 콘텐츠를 제공하여 누구나 양질의 SW·AI 교육 자료에 접근할 수 있도록 지원합니다.개방 데이터는 2020년 SW교육 페스티벌에서 공개된 25건의 영상 콘텐츠 목록입니다. 데이터는 영상의 제목, 프로그램 구분('SW·AI 공감 스피치', '개발자 토크쇼', 'AI수업 엿보기' 등), 발표자 정보, 그리고 다시보기가 가능한 유튜브 링크로 구성되어 있어 SW·AI 분야의 최신 동향과 현장 이야기를 생생하게 접할 수 있습니다.학생 및 일반 시민은 SW·AI 분야의 명사 특강과 개발자들의 실제 경험담을 통해 진로를 탐색하고 최신 기술 트렌드를 파악할 수 있습니다. 교사들은 우수 AI 수업 사례 영상을 통해 수업 개선을 위한 아이디어를 얻을 수 있으며, SW·AI 교육 콘텐츠 개발자 및 관련 기업은 교육 현장의 수요와 미래 방향성을 파악하는 데 본 데이터를 활용할 수 있습니다.
