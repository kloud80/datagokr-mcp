description_portal: 자율주행차 보안 체크리스트는 자율주행차 보안 담당자가 보안 점검 시 직접 활용할 수 있도록 제작된 실무 중심의 자료로, 자율주행차의 안전한 운행과 정보보호를 위해 필수적으로 확인해야 하는 점검 항목들을 체계적으로 정리하고 있습니다. 점검대상은 차량 내 주요 구성요소인 통신 네트워크, 외부 인터페이스, 제어시스템, 센서 장비 등으로 구분되며, 각 대상에 대해 보안유형별로 인증, 접근통제, 암호화, 이상징후 대응 등 구체적인 보안 요구사항을 제시합니다. 체크리스트는 개발 단계에서의 보안 설계뿐만 아니라 운용 단계에서의 실시간 점검 및 보완 조치까지 폭넓게 반영하고 있으며, 각 항목은 산업 환경과 최신 보안 위협 동향을 고려하여 구성되었습니다. 이를 통해 자율주행차 개발자 및 운영자가 사전 예방 중심의 보안 관리를 수행할 수 있도록 지원하고, 실제 산업 현장에서의 활용도를 높이는 데 초점을 맞추고 있습니다.
