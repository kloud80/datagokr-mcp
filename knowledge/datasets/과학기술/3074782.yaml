description_portal: 본 데이터는 한국수자원공사가 보유한 기술과 관련된 지식재산권 현황을 제공한다. 총 500건 이상의 등록 정보가 포함되어 있으며, 특허, 실용신안, 디자인 등 다양한 형태의 지식재산권 정보를 항목별로 확인할 수 있다. 각 항목은 권리명, 출원번호, 등록번호, 출원일, 등록일, 권리구분 등으로 구성되어 있다. 해당 데이터는 K-water 연구원에서 관리하며, 수자원 분야의 기술 연구성과와 보호 현황을 이해하는 데 유용하다. 사용자에게 기술 보호 상태를 파악할 수 있는 기초 자료를 제공하며, 연구개발 및 기술이전, 정책 수립 등 다양한 분야에서 활용 가능하다. 공공기관, 민간기업, 연구자 등 기술 기반 활동을 수행하는 주체들에게 실질적인 참고자료로 활용 될 수 있다.
