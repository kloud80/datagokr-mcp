description_portal: "한국과학창의재단에서 제공하는 '사이언스타임즈'의 과학문화 섹션 기사 데이터입니다. 과학 행사, 전시, 강연 소식부터 생활 속 과학 이야기, 과학 관련 포토뉴스까지 대중들이 과학을 더 친근하고 재미있게 느낄 수 있도록 다양한 콘텐츠를 제공하여 사회 전반의 과학문화 확산에 기여하고자 합니다.개방 데이터는 2020년 1월부터 2021년 10월까지 발행된 과학문화 관련 기사 약 800여 건입니다. 데이터는 각 기사의 제목, 작성자, 등록일자, 본문, 웹페이지 주소(URL), 관련 태그, 조회수 정보로 구성되어 있어 과학문화 콘텐츠의 트렌드와 대중의 관심사를 파악하는 데 활용될 수 있습니다.교육기관 및 과학관은 과학 교육 프로그램 및 전시 기획을 위한 아이디어를 얻고 참고 자료로 활용할 수 있습니다. 언론 및 미디어는 흥미로운 과학 소재를 발굴하고 대중적인 과학 콘텐츠를 제작하는 데 활용할 수 있으며, 일반 국민들은 과학 관련 행사 정보를 얻고 교양 지식을 넓히는 데 기여할 수 있습니다.url : https://www.sciencetimes.co.kr/category/sci-culture/"
