summary_user: 경기도 보행자 Care 시스템의 적외선 센서가 보행자를 검지한 이력을 건별로 담으며, 발생일시·검지 유형·상태값·카메라명·이벤트 발생 시각·운영코드가 한 행에 기록된다. 교통안전 담당자나 분석가가 특정 카메라 지점에서 어느 시간대(특히 야간)에 보행자 검지가 몰리는지, 시스템이 제대로 작동하는지 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 카메라명(camera_nm) 같은 이름 매핑이나 같은 기관 코드로만 이어 붙일 수 있다.
description_portal: 이 데이터는 보행자의 움직임을 감지하기 위해 설치된 적외선 센서 기반 시스템의 검지 이력을 기록한 자료로, 보행자 Care 시스템의 작동 현황을 분석할 수 있도록 구성되어 있습니다. 주요 항목으로는 발생일시, 검지 유형(보행자적외선검지유형), 상태값, 카메라명, 이벤트 발생 시각, 운영코드 등이 포함되며, 이를 통해 특정 시간대에 보행자가 검지된 이력을 파악할 수 있습니다. 또한 카메라 식별 정보 및 이벤트의 발생시간이 기록되어 있어 스마트시티 기반 보행자 보호 시스템 성능 모니터링, 교통안전 개선, 야간 보행자 감지 시스템의 작동 분석 등 다양한 목적에 활용될 수 있습니다.* 전체데이터는 FILE 탭을 활용해 주시기 바랍니다.
