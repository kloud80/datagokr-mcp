description_portal: 과학기술정보통신부가 실시하는 통신서비스 품질평가의 결과 보고서 내 , 전국 85개시 430개 지역 대상의  세부유형별 5G전송속도(Mbps) 결과 데이터입니다.전국 85개시 430개 지역을 대상으로 다양한 장소 유형에서 측정한 5G 네트워크 품질 데이터를 제공합니다. 데이터는 구분(주요시설/교통노선), 상세구분(유동인구밀집지역, 교통시설, 대형점포, 대형병원, 문화시설, 공공시설, 지하철객차, KTX·SRT객차, 고속도로 등), 통신사(SKT, KT, LGU+), 다운로드 속도(Mbps), 업로드 속도(Mbps)의 5개 항목으로 구성되어 있습니다. 각 장소 유형별로 3개 이동통신사의 5G 다운로드 및 업로드 전송속도를 상세하게 비교할 수 있습니다. 이 데이터는 통신사별 5G 서비스 품질 비교, 지역별·장소별 통신 품질 분석, 5G 인프라 개선 정책 수립, 소비자의 통신사 선택 참고자료, 통신 서비스 품질 모니터링 등에 활용될 수 있으며, 우리나라 5G 네트워크 품질의 객관적인 평가 지표로 기능합니다.
