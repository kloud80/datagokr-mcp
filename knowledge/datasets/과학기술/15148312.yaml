description_portal: '한국데이터산업진흥원 데이터바우처 사업에 참여하는 수요·공급기업의 성과에 대한 자료를 제공하고 있습니다.이 데이터는 사업에 참여하는 다양한 수요·공급기업의 성과 및 우수사례 여부에 대한 정보를 담고 있습니다.데이터바우처 사업은 데이터 상품·활용서비스 등 바우처 지원을 통해 데이터 수요·공급의 생태계를 조성하고 전 산업의 디지털 전환 및 데이터 활용 활성화 견인을 하는데 크게 기여하고 있습니다.이러한 자료는 데이터 산업 생태계 조성에 필요한 기초 자료로 활용될 수 있으며, 특히 성과 측면 데이터로 중요한 역할을 합니다.데이터는 다음과 같은 구조로 이루어져 있습니다.순번(숫자형) : 순번수행연도(문자형) : 사업 수행연도성과연도(문자형) : 사업 성과 측정연도등록일시(날짜형) : 사업 성과 등록일시우수사례기업여부(문자형) : 우수사례로 등록된 기업인지 여부'
