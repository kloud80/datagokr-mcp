summary_user: 판교제로시티에 설치된 CCTV 영상 이미지마다 2D 세그멘테이션 라벨 정보를 담은 건별 데이터로, CCTV 고유번호, 녹화 시작·종료 일시, 이벤트 유형, 날씨, 이미지 크기, 이미지와 세그멘테이션 JSON 파일의 이름·경로가 들어 있다. 자율주행·영상인식 연구자가 "특정 날씨나 이벤트 조건에서 찍힌 교차로 CCTV 이미지와 분할 라벨 파일을 어디서 찾나"를 확인하고 AI 학습용 데이터셋을 구성할 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, CCTV 고유번호(cctv_idntfy_no)나 이미지 식별번호로 같은 판교제로시티 자율주행 데이터 조회 서비스의 다른 항목과 이름·번호를 맞춰 이어 쓴다.
description_portal: '서울대학교 연구소 차세대융합기술연구원 판교제로시티 자율주행 데이터 조회 서비스 중 판교제로시티 CCTV 데이터 2D세그멘테이션 조회입니다.자율주행 서비스 개발의 기반 마련을 위해 판교제로시티에서 수집, 가공한 자율주행 인프라 및 실증 데이터를 조회 및 제공합니다.CCTV고유번호, 이미지 크기, 이미지 파일 경로, 세그먼테이션 파일명 등이 포함되어있습니다. 해당 데이터는 AI 기반의 영상인식 모델 학습, 교통안전 및 시설물 감시, 스마트시티 인프라 구축 등의 용도로 활용될 수 있습니다*참고자료 및 데이터 다운로드 : FILE탭'
