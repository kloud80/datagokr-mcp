description_portal: 국토교통과학기술진흥원은 연구개발 사업의 효율성과 현장 적합성을 높이기 위해 열린기획을 추진하고 있습니다. 열린기획은 정부와 연구기관뿐만 아니라 산업계, 학계, 개인 등 다양한 이해관계자가 참여하여 의견을 제시하고 수요를 반영하는 개방형 연구기획 방식입니다. 이를 통해  현장의 실제요구와 미래 사회적 과제를 반영한 연구개발 과제를 도출하고, 정책적 활용성과 기술적 파급력을 높이게 됩니다. 또한 투명성과 공정성을 강화하여 국민이 체감할 수 있는 성과 중심의 연구개발 체계를 구축하고 있으며, 협력과 소통을 기반으로 한 혁신적 R&D 생태계 조성을 목표로 하고 있습니다.
