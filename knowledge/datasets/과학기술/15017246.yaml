description_portal: 장애인방송 의무제공 사업자를 대상으로 자막, 화면해설, 수어통역 등 장애인방송 서비스 제공 실적을 종합적으로 평가한 시행 결과를 기반으로, 각 사업자의 실적과 목표 대비 달성률을 명확하게 확인할 수 있도록 정리한 자료를 제공하고 있습니다. 이를 통해 방송사업자가 법적·제도적 기준에 따라 장애인방송 서비스를 얼마나 충실히 이행하고 있는지 객관적으로 파악할 수 있으며, 전반적인 이행 수준과 개선 필요 사항을 확인하는 데 활용될 수 있습니다.본 데이터는 방송사명을 비롯하여 의무제공 분야(자막, 화면해설, 수어통역)별 목표치와 실제 제공 실적, 그리고 이에 따른 달성 비율 등 세부 항목으로 구성된 공표 자료입니다. 또한 각 항목은 표준화된 기준에 따라 정리되어 있어 연도별 또는 사업자별 비교 분석이 가능하며, 장애인의 방송 접근권 보장 수준을 진단하고 정책 수립이나 제도 개선을 위한 기초자료로 활용될 수 있도록 구축되어 있습니다.
