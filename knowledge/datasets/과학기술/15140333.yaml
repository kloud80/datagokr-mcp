description_portal: 국내 기업 등 정보 보호를 위해 시시각각 변화하는 사이버 위협 상황에 능동적으로 대응하고 자율적인 보호 조치를 취할 수 있도록, 한국인터넷진흥원에서는 보안 이슈 발생 시 신속하게 관련 보안 권고문을 전파하여 기업이 적시에 대응할 수 있도록 지원합니다. 이를 통해 주요 정보 자산의 침해를 예방하고, 전반적인 보안 수준을 향상시키는 데 기여하고 있으며, 권고 사항은 위협의 성격에 따라 기술적‧관리적 조치로 구성되어 실제 현장에서 참고할 수 있도록 구체적인 방안을 제공합니다. 또한 전파된 보안 권고문은 중소기업, 공공기관 등 정보보호 대응 여력이 상대적으로 부족한 조직에서도 실효성 있게 활용할 수 있도록 쉽게 구성되어 있으며, 권고 전파 건수와 관련 통계는 사이버 위협 대응 현황을 파악하고 정책 개선의 기초자료로도 활용됩니다.
