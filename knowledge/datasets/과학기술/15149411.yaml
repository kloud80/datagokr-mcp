description_portal: 정보통신산업진흥원은 인공지능을 필두로 대한민국의 ICT 생태계를 활성화하고 미래 핵심 기술 확보와 글로벌 경쟁력을 갖춘 스타트업 및 혁신기업을 육성하는데 노력하고 있습니다. 이 데이터는 정보통신산업진흥원(NIPA)이 전담하는 정보통신 분야의 기업지원 지원사업 등의 일반적인 정보를 제공하는 자료 입니다. 인공지능, 소프트웨어, ICT 등 주요 디지털 기술 기반의 사업화, 해외진출, 인력양성을 지원하는 사업들의 정보를 제공합니다. 사업별로 사업명, 사업목적, 지원대상 등의 정보를 제공하며 세부정보는 정보통신산업진흥원 홈페이지(www.nipa.kr)를 접속하면 보다 상세하게 확인이 가능합니다.
