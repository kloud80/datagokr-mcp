description_portal: '국립과천과학관 홈페이지 관리자 메뉴에 대한 정보입니다. 해당 데이터가 포함하는 컬럼은 다음과 같습니다.컬럼명: 관라지페이지 구분, 1차 메뉴명, 2차 메뉴명, 3차 메뉴명, 4차 메뉴명, 5차 메뉴명, 6차 메뉴명, 7차 메뉴명, 메뉴 기능국립과천과학관 홈페이지의 관리자용 메뉴 데이터는 메인관리, 전시, 교육, 예약, 회원 등 다양한 기능별 구조로 구성되어 있습니다. 각 메뉴는 PC와 모바일 화면에 맞는 배너 이미지 관리, 전시와 교육 정보 편집, 해설자 정보 등록 등 다양한 운영 요소를 포함합니다. 이를 통해 사용자는 과학관 홈페이지 콘텐츠를 효율적으로 구성하고 최신 정보로 유지할 수 있습니다.'
