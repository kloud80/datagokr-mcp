description_portal: 본 데이터는 의무측정 무선국에 따른 전자파 노출지수 정보로, 지정한 위치 또는 자신의 위치 정보를 통해 해당 지역에 위치한 무선국들의 전자파 노출지수 정보를 확인할 수 있습니다. 입력값은 공공데이터포털에서 받은 인증키, 검색할 주소 또는 현재 자신의 현위치, 입력한 주소 반경 내 의무측정무선국입니다. 결과값은 무선국과의 거리, 측정접수번호, 호출명, 시설자, 측정기관, 게시물 번호, 측정일, 전자파 측정 등급, 전자파 기준값, 전자파 측정값, 전자파 노출지수, 시설자명, GIS 주소, 무선국거리값, 주파수 시작대역, 주파수 종료대역, GIS 주소 경도, GIS 주소 위도 입니다. 이를 통해 지리적 위치적 정보를 통한 무선국 노출지수를 확인할 수 있습니다. 지역별 무선국 현황, 무선국 사업 증진, 노출지수 개선 정책 시행 등의 분야에 활용될 수 있습니다.※에러유형별 메세지를 확인하세요
