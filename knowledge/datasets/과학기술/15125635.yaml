summary_user: 의무측정 무선국별 전자파 측정값·기준값·노출지수·측정등급을 측정일, 시설자, 주파수 대역, 주소와 위경도와 함께 무선국 한 곳씩 건별로 담으며, 검증 호출에서는 전국 범위 6행(측정일 2015-06-08~2024-08-24)이 수신됐다. 주민이나 부동산·옥상 임대 검토자가 "이 주소 반경 안에 있는 기지국의 전자파 노출지수는 기준 대비 얼마인가"를 확인하는 데 쓴다. GIS 주소(gisBassAdres)를 주소 키로, 위경도를 좌표로 삼아 다른 주소 기반 무선국·건물·입지 데이터와 잇는다.
limits: 검증 호출에서 받은 전체 건수가 6건에 그쳐 지역별 무선국 현황이나 통계 분석에 쓰기에는 표본이 적다. 실측 최신 측정일은 2024-08-24이지만, 이는 검증 호출 조건에서 받은 행 기준이라 데이터 전체가 오래됐다고 단정할 수 없다. 개발계정은 하루 10,000회로 호출이 제한된다.
