description_portal: 이 데이터는 한국남부발전이 보유한 특허와 산업재산권을 대상으로 진행한 기술사용 공모 현황을 정리한 자료입니다. 각 항목에는 산업재산권 명칭, 공모 일자, 출원 일자 및 출원 번호가 포함되어 있어, 기술의 개발 시기와 지식재산권 등록 현황을 확인할 수 있습니다. 공모 대상 기술에는 발전설비 운영, 환경 설비 개선, 신소재 활용 등 다양한 분야의 혁신적 기술이 포함되어 있으며, 이를 통해 공기업의 연구개발 성과가 민간 및 산업계에 활용될 수 있는 기회를 제공합니다. 본 자료는 공공기관의 지식재산권 활용 현황을 파악하고, 기술이전과 산업 발전에 기여하는 방향을 분석하는 데 유용한 기반 자료입니다.
