description_portal: 이 데이터는 전파 및 전자파 연구, 미연방통신위원회 전자통신 관리 정보 등 전자파 측정 측정 참고 사이트 현황입니다. 데이터는 국제기구, 정부기관, 연구기관 등 전자파 안전과 관련된 기관의 홈페이지 주소, 명칭, 간단한 내용 그리고 화면출력 여부로 구성됩니다. IEEE,  ICNIRP, IEC 등 해외 전문기관과 과학기술정보통신부, 국립전파연구원 등 국내 기관의 정책 및 연구 정보 링크를 함께 수록하였습니다. 이를 통해 전자파 안전정책, 기술표준, 연구동향, 국제협력 정보를 확인할 수 있습니다. 본 데이터는 국내외의 전자파 안전 관련 정책과 기술 정보를 신뢰성 있게 제공하기 위해 구축되었습니다.
