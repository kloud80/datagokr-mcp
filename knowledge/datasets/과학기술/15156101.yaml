description_portal: 본자료는 국가별로 할당된 IPv4 주소 범위를 시작주소, 끝주소, 그리고 CIDR 프리픽스 형태로 정리한 대규모 IP 할당 테이블이다. 중국(CN), 일본(JP), 한국(KR), 인도(IN), 홍콩(HK), 싱가포르(SG), 베트남(VN), 브라질(BR), 캐나다(CA), 영국(GB), 트리니다드토바고(TT) 등 아시아 외 국가도 일부 포함된다. 각 국가마다 /22, /21, /20, /17, /16, /15, /12 등 다양한 규모의 네트워크가 존재하며, 일부 국가는 한 구간뿐 아니라 여러 세분화된 Prefix 블록으로 나누어 할당되어 있다 전체적으로 국가 코드 기반 IP 주소 공간 분포를 파악하거나 국가별 IP 관리, 접근 제어, 네트워크 분석, 보안 정책 수립에 활용할 수 있는 구조화된 IP 자원 배분 정보이다.
