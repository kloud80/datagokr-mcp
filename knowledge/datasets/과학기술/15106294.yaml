description_portal: '데이터 개요본 데이터는 연구개발특구진흥재단이 보유한 2022년 유망 사업화 기술 목록입니다.특구 내 연구개발 성과 중 사업화 가능성이 높은 기술을 선별하여 정리한 자료로 기술명과 특허 정보를 함께 제공하고 있습니다.데이터 항목본 데이터가 보유한 주요 칼럼은 다음과 같습니다.순번 : 데이터 식별을 위한 일련번호기술명 : 유망 사업화 기술의 명칭특허출원번호 : 해당 기술의 특허 출원 고유번호활용 방법유망 기술의 현황 파악 및 기술 트렌드 분석 등에 활용 될 수 있습니다.유의 사항본 데이터는 2022년 기준으로 선별된 목록이며, 이후 변동사항은 반영되지 않았을 수 있습니다.'
