description_portal: '방송통신기자재등 시험기관의 시험분야 신청 민원 상세 내역입니다. 시험기관이 시험분야의 시험항목이 지정항목에 추가될 때 시험장비를 갖추고 정부에 그 시험을 하겠다고 요청하는 민원이며, 민원 접수된 시험 분야와 관련해 가장 많이 등장하는 키워드로 EMC(전자파적합성), 무선, SAR(인체전자파 흡수율), 유선 등의 기술 시험 항목이 포함되어 있다. 특히 베트남 EMC, 미국 무선 등 해외 인증과 국외 시험에 대한 수요도 눈에 띈다. 이를 통해 전자제품의 국내외 전자파 적합성 및 무선 시험이 주요 민원 대상임을 알 수 있다.○ 데이터 보유 컬럼 : 민원접수번호, 시험분야코드, 시험분야코드명, 시험분야확인여부, 민원수수료, 서류심사결과코드, 서류심사결과코드명, 현장심사결과코드, 현장심사결과코드명, 최종수정일자'
