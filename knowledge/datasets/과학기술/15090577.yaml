description_portal: 2021년 9월 기준 국내통상요금에 대한 정보입니다.이 자료는 우정사업본부가 제공하는 국내 통상우편 요금체계를 정리한 표로, 통상우편(규격/비규격), 등기우편, 익일특급 등의 다양한 우편물 유형에 따른 요금을 체계적으로 정리하고 있습니다. 기본적으로 우편물의 중량(5g, 25g, 50g, 100g 등)에 따라 요금이 차등 적용되며, 우편물의 규격 여부에 따라 요금이 크게 달라지는 구조입니다. 또한 등기취급 및 익일특급과 같은 부가서비스를 추가할 경우, 해당 수수료가 별도로 부과되어 합산요금이 결정됩니다. 이외에도 국가 유공자, 시각장애인, 비영리기관 등은 감면 요금 적용이 가능하며, 이와 관련한 기준도 함께 포함되어 있습니다. 본 요금표는 일반 국민부터 기업 사용자까지 다양한 수요자가 우편물 발송 시 정확한 비용을 예측하고 서비스를 선택할 수 있도록 돕는 실용적인 정보 자료입니다.
