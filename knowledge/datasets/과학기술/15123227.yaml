summary_user: 경기도 자율주행차가 운행 중 보낸 기본 안전 메시지를 건별로 담으며, 발생시각·차량 ID·위도·경도·고도·속도·가속도·차량 크기·자율주행 모드·수동/자동 비상정지·센서 이상·차량상태 플래그·차종을 기록한다. 분석가가 특정 자율주행차가 어느 위치와 속도에서 비상정지나 센서 이상을 일으켰는지 살펴 사고 예방 로직과 운행 안전을 점검하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 차량 ID(vehcle_id)로 같은 데이터 안에서 묶거나 위경도 좌표를 도로·지도 자료와 공간적으로 맞춰 쓴다.
description_portal: 이 데이터는 자율주행차량 운행 중 발생하는 기본 안전 메시지를 기록한 정보로, 차량의 실시간 위치, 상태, 작동 정보 등을 포함합니다. 주요 항목은 발생시각, 차량 ID, 위도 및 경도, 고도, 차량의 속도, 가속도, 차량 크기(너비, 길이), 자율주행 모드 여부, 수동 및 자동 비상정지 플래그, 센서 이상 여부, 차량상태 플래그, 자동차 유형 등을 포함하고 있습니다. 이 데이터를 통해 차량이 자율주행 중 발생하는 다양한 상황에 대한 실시간 반응과 상태를 분석할 수 있으며, 안전성과 운행 효율성을 점검하는 데 유용합니다. 해당 데이터는 자율주행 차량의 사고 예방 시스템 개발, 운행 로직 개선, 교통안전 정책 수립 등에 활용될 수 있습니다.*전체데이터는 FILE 탭을 활용해주시기 바랍니다.
