description_portal: "본 데이터는 이동통신 기지국에 대한 시설자별 전자파 측정 결과입니다. 무선국 전자파 강도 측정은 무선국이 전자파 인체보호기준에 적합한지 확인하는 제도를 통해 시행되고 있으며, 시설자의 자체 측정이 어려울 경우 전파법 제47조의2제4항에 따라 과학기술정보통신부에 측정요청 시 측정을 수행하고 있습니다. 전파법 시행령 (제65조 관련)에 따라  무선국 전자파 강도 보고대상 무선국 시설자에 한하여 측정 신청을 받아 해당 데이터를 국민에게 공개하고 있습니다. 해당 데이터는 측정일자에 따른 전자파 측정 결과로써 허가번호, 시설자, 측정일, 판정, 기준값(V/m), 측정값(V/m) 등의 정보를 확인할 수 있습니다. 본 자료를 통해 기간별, 시설자별 전국 이동통신 기지국에서 측정한 전자파 측정 결과를 한눈에 확인하여 전자파 노출 기준을 관리함으로써 인체 안전 기준 이행 여부를 관리하며 전자파에 대한 이해와 안전관리 등의 자료로써 활용될 수 있습니다. ※ 데이터는 '25.12월 기준으로 제공되고 있으며, 그 외 데이터 및 위치 정보 등의 추가적인 정보를 확인하기 위해서 URL 링크를 통해 확인바랍니다.URL : https://emf.kca.kr/web/info/basestation.do"
