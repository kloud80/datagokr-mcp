summary_user: KISA 가명정보 지원 플랫폼에 속한 지원센터별 현황을 센터 한 곳당 한 행으로 담은 파일(csv, 약 6KB)이다. 각 행에는 주소·연락처·담당자와 함께 제공하는 비식별 솔루션, 가명처리실 같은 인프라, 지원서비스 항목이 들어 있고, 범위는 전국이다. 가명처리나 결합을 하려는 기관·기업이 가까운 지원센터가 어디이며 어떤 솔루션과 서비스를 제공하는지 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 지역코드나 주소를 이용해 행정구역·위치 데이터와 이름 기준으로 맞춰 이어 쓴다.
description_portal: 본자료는 KISA에서 제공하는 가명정보 지원 플랫폼의 각 센터는 개인정보 가명·익명처리를 위한 **비식별 솔루션(1~3종)**과 **데이터 분석·시각화 도구(Python, R 등)**를 제공하며, 폐쇄망에서 안전하게 데이터를 처리하도록 가명처리실·교육실·회의실 등 인프라와 PC(6~20대 수준), CCTV·출입통제 등 보안설비를 지원한다. 금융·의료·통신 등 다양한 샘플데이터 제공, 기관이 보유한 개인정보 반입 후 가명처리·결합·EDA 수행도 가능하다. 또한 가명정보 컨설팅, 적정성 검토, 위험도 분석, 교육·세미나, 실습 지원, 심의위원회 운영 등 전 과정을 무료 지원한다. 지역별 특화 분야로는 충청권(바이오·공공데이터), 보건의료 특화, 동남권 데이터 경제 활성화, 인천·대구의 기업 개인정보보호 강화, 산업 맞춤형 원스톱 서비스 등이 포함되며, 전문인력 양성과 지역 데이터 활용 생태계 조성을 목표로 한다.
