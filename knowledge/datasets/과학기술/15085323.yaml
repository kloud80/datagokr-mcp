summary_user: KCI에 등재된 국내 학술논문 한 편이 인용한 참고문헌을 한 건씩 담은 원천 데이터로, 참고문헌별 제목·저자·출처 저널·권호·쪽·출판사·학회명·학위·특허·URL 같은 서지 정보를 제공한다. 연구자나 도서관이 특정 국내 논문이 어떤 문헌을 인용했는지 확인하거나, 최신 국내 논문의 인용 관계를 분석할 때 쓴다. 논문 식별자(ARTIID)와 피인용 문헌의 KCI 논문 식별자(REFARTIID)로 같은 KCI 계열 논문 서비스와는 이어 쓸 수 있으나, 실측 기준으로 다른 기관 데이터와 잇는 전역 조인 키는 없다.
description_portal: 한국학술지인용색인(KCI) 참고문헌 서비스는 국내 학술논문에 인용된 참고문헌 정보를 체계적으로 제공하여 연구자들이 논문의 인용 관계, 참고문헌의 출처, 인용 빈도 등을 쉽게 파악할 수 있도록 지원합니다. 논문별 참고문헌 목록, 저자, 저널명, 출판사, 컨퍼런스 정보, 인용일자 등 다양한 서지 정보를 포함하고 있어 학술연구, 인용분석, 연구동향 파악, 논문 작성 및 참고문헌 관리 등에 활용도가 높습니다. 연구자, 도서관, 학술기관 등에서 학술정보 서비스 및 연구성과 평가에 유용하게 사용할 수 있습니다.
