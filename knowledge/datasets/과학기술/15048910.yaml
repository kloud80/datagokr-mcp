summary_user: 인천광역시 소재 공공청사와 관할 지구대·119센터 등 기관별로 관할 군구, 기관명, 도로명주소, 대표 전화번호, 우편번호, 인터넷주소를 한 행씩 담은 개별 기관 목록 파일(CSV)이다. 시민이나 민원 담당자가 '우리 동네 지구대나 구청의 정확한 도로명주소와 우편번호, 전화번호가 무엇인가'를 확인하거나 우편 발송 주소록을 만드는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소·우편번호 문자열 매칭으로만 이을 수 있고, 주소 검증은 주소정보누리집 등 주소 서비스와 대조하는 방식으로 쓴다.
limits: 기관 코드나 표준 주소 코드 같은 공통 키가 없어 다른 기관 목록과 정확히 결합하기 어렵고, 이름·주소 문자열 매칭에 의존해야 한다. 좌표 정보는 별도 필드로 확인되지 않아 지도 표시에는 주소를 따로 변환해야 한다.
