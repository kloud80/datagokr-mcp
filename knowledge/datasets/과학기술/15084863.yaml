summary_user: KCI(한국학술지인용색인) 시스템의 학술지 전거데이터를 조회하는 API로, 학술지별 여러 명칭·약어·축약형 명칭과 학술지명에 쓰인 단어와 그 약어·순서를 학술지 식별번호(SEREID)와 전거 순번 단위로 담으며 범위는 전국·비공간이다. 연구자·도서관 담당자·서지 분석가가 "이 약어로 표기된 학술지가 KCI의 어느 학술지인가" 같은 학술지명 표기 정규화 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, KCI 논문·인용 데이터와는 학술지명이나 같은 기관(한국연구재단) 내부 학술지 식별번호를 맞춰 이어 쓴다.
description_portal: KCI 전거데이터 조회 서비스는 국내 학술지 정보, 논문 정보 및 참고 문헌을 데이터베이스화하여 각 서지 정보, 인용 정보, 통계 자료, 논문 간 인용관계 분석 등을 제공하는 한국학술지인용색인 (KCI) 시스템의 학술지 관련 전거 데이터에 대한 상세정보를 조회할 수 있는 서비스입니다. KCI 전거데이터 조회 서비스의 주요 기능으로 학술지별 다양한 명칭을 조회하는 학술지 전거 조회, 학술지에 사용된 단어와 단어의 약어를 조회하는 단어 전거 조회, 학술지별 명칭에 대한 여러 약어 및 축약형 명칭을 조회하는 학술지명 전거 조회, 학술지별 명칭에 사용된 단어와 단어의 순서를 조회하는 학술지 단어 전거 조회 등이 포함됩니다.
