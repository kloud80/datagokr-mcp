description_portal: 본자료는 KISA에서 제공하는 118민원 상담 시스템에 등록된 정보를 기준으로 피싱·파밍 사이트 탐지 및 Today News 공지, 개인정보·주민번호 관련 대응 안내, 인터넷침해대응센터 신규 취약점 포상제 운영, 체크프라이버시 개선, ISMS·PIMS 상담 매뉴얼 수정, 스팸팩스 장애 공지, 변작번호 차단, 온라인 학습장 접속·계정 문의, 해킹방어 훈련장 개관, 법령·가이드라인 개정 자료 등 다양한 보안‧민원 대응 공지사항을 포함하고, 이외피싱·파밍 의심 사이트(국민·농협·저축은행·대검·금융민원센터 등) 다수 발견되어 접속 주의 안내. KISA는 신규 취약점 신고 포상제를 운영하며고 있다. 그리고 주민번호 기술지원 사업은 종료되었으며 정책·기술 자문은 주민번호클린센터를 이용. 호전환 요청 시 절차 준수, 담당자 연락처 문의 시 업무 목적 탐색 후 안내하고 있다.
