description_portal: 2020년 1월~9월  군사우체국 우편물 접수 및 배달물량 정보입니다.자료는 과학기술정보통신부 우정사업본부가 관리하는 전국 군사우체국의 2022년 접수 및 배달 물량 현황을 정리한 것으로, 지방우정청별·우체국별 관할 군사출장소의 물류 실적이 포함되어 있다.전북지방우정청 임실우체국 산하 89군사우편출장소는 23,154건을 접수하고 배달은 0건으로, 일방향 접수 중심의 군부대 내 특수한 우편 흐름 구조를 보여준다. 반대로 부산강서우체국 산하 307군사우편출장소는 9,509건 접수, 14,036건 배달로 양방향 흐름이 비교적 균형적이다.
