description_portal: '○ 통계개요* 통계명 : 이메일 이용률* 통계종류 : 지정통계, 승인번호* 근거법령 : 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제52조* 작성목적 : 급속히 변화하는 국내가구의 인터넷 이용환경 및 국민의 인터넷 이용현황과이용행태 등을 파악하여 관련 정책수립과 연구활동 등 다양한 영역에서 활용할 수 있도록 기초자료 및 정보 제공을 목적으로 함* 조사체계 : 조사원→전담조사기관→한국인터넷진흥원→미래창조과학부* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 이메일 이용률과 최근 이메일 이용시기 비율○ 용어설명* 이용률 : 만6세 이상 이메일 이용자 중 최근 1년 이내 이용한 자의 비율* 이메일 : 컴퓨터, 스마트폰 등으로 인터넷 이용자간에 소식, 정보 등을주고 받는 전자우편 방식(개인/업무용 메일 확인 및 발송, 각종 이메일 청구서 확인 등)○ 기타* 문: 최근 언제 이메일을 이용하셨습니까?* 복수응답은 한 개 이상(1-3순위 또는 모두 선택)을 응답한 결과치를 집계한 결과임'
