description_portal: 본 데이터는 한국도로교통공단 산하 교통전문 라디오 네트워크의 공식 사이트 ‘직원마당’ 게시판에 게시된 첨부문서 메타데이터를 정리한 목록이다. 주요 항목은 게시글구분코드, 파일명, 파일경로, 원본파일명, 다운로드수 등이며, 첨부문서의 출처 게시글과 저장 위치 식별에 활용한다. 파일명·원본명 비교, 경로 기반 분류 기준 수립, 게시판별 문서 축적 양상 파악 등 내부 자료 관리와 검색 인덱스 구축에 유용하다. 개인정보는 포함하지 않으며 문서 본문이 아닌 메타 정보로 구성된다. 주요 파일 유형은 HWP 등 문서 형식이며, 파일 경로에는 게시일자가 반영되어 탐색 동선 설계에 참고된다. 목록은 특정 게시판 범위로 한정된다.
