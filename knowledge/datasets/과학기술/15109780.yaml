description_portal: 본 데이터는 한국인터넷진흥원(KISA)이 탐지 및 수집한 피싱 사이트의 URL 정보를 포괄적으로 포함하고 있으며, 피싱 공격으로부터 이용자들의 개인정보 및 금융정보를 효과적으로 보호하기 위한 목적으로 체계적으로 관리되고 있는 자료입니다. 이들 URL은 공격자가 문자메시지(SMS), 이메일, 메신저, 소셜미디어 등 다양한 통신 수단을 이용해 유포하는 악성 링크로 구성되어 있으며, 주로 사용자의 신뢰를 유도하여 가짜 로그인 페이지 접속 또는 악성코드 설치를 시도함으로써 민감한 개인정보와 금융 정보를 탈취하려는 위험한 행위를 포함하고 있습니다. 이러한 피싱 사이트들은 점점 정교해지고 다양한 형태로 진화하고 있기 때문에, 본 자료는 피싱 위협의 실태를 정확히 파악하고 예방 및 차단 시스템을 구축하는 데 필수적인 기초 데이터를 제공합니다. 또한, 보안 솔루션 개발 및 관련 정책 수립, 보안 교육 자료 제작 등 다양한 보안 활동에 폭넓게 활용되어 국민과 기업이 안전한 인터넷 환경에서 활동할 수 있도록 중요한 역할을 수행합니다. 이를 통해 사이버 공격에 대한 대응 역량을 강화하고, 지속 가능한 사이버 보안 체계를 확립하는 데 기여함으로써 전반적인 정보 보호 수준을 높이는 데 중요한 밑거름이 되고 있습니다.※ 개인정보, 금융정보 탈취 등을 목적으로 악성코드 설치를 위해 범죄자가 메시지, 이메일 등을 통해 송부한 악성 URL
