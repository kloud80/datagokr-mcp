description_portal: '국립전파연구원이 축적한 전파 관련 연구성과와 보고서를 모은 데이터로, 방송통신 서비스의 안정성과 신뢰성 확보, 전파에너지 전송 제도 동향, 드론을 활용한 방송국 안테나 패턴 검증 등 다양한 주제를 다룬다. 또한 전파자원 관리와 기술기준 마련, 전자파 인체노출 평가기술 연구, ICT 융복합 환경에서의 전자파 안전성 확보가 포함된다. 더불어 EMC, EMF, EMP 등 전자파 표준화 동향, 시험인증 산업 경쟁력 강화 방안, 생활 속 전자파 실태조사 등이 정리되어 있어 전파기술 발전과 정책 기반 마련을 위한 핵심 자료로 활용될 수 있다.○ 데이터 보유 컬럼 : 게시물일련번호, 제목, 원본첨부파일명, 등록일시'
