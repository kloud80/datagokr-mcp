description_portal: '□ 개요본 데이터셋은 국립과천과학관이 전시관 및 수장고에 보관 중인 전시물품 현황을 체계적으로 정리한 자료입니다. 전시물명, 전시물 유형(품명), 담당 부서 등의 세부 정보를 포함하고 있어 국립과천과학관 보유 전시물 자산 현황을 파악하는 데 활용될 수 있습니다. 주된 활용 목적은 다음과 같습니다. 첫째, 전시품의 종류와 수량, 관리 상태 등을 파악하여 효율적인 수장고 관리 및 전시 계획 수립에 기여할 수 있습니다. 둘째, 과거부터 현재까지 수집된 과학 기술 관련 물품의 목록을 정리하여 과학사 연구 및 교육 자료로 활용 가능합니다. 셋째, 기관 내 부서별 자산 보유 현황을 투명하게 관리하고, 향후 전시품의 활용 방안을 모색하는 데 기초 자료가 됩니다.□ 데이터 구조· 자산명 : 개별 전시물품의 등록 자산 명칭 (String)· 품명 : 전시물의 유형이나 물품 종류 (String, 예: 벽패널, 실물모형)· 식별명칭 : 제조사, 규격 등 물품을 식별하기 위한 상세 정보 (String)· 운영조직 : 해당 물품을 관리하는 상위 조직명 (String)· 운영부서 : 물품 관리를 담당하는 실무 부서명 (String)· 사업명 : 물품 취득과 관련된 예산 사업 또는 프로젝트 명칭 (String)· 대표전시품명 : 해당 자산이 속한 대표 전시물 또는 전시 주제명 (String)'
