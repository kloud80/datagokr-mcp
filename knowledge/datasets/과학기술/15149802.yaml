summary_user: 연구개발특구 관련 기관이 사업화 대상으로 공개한 기술을 한 건씩 담은 파일로, 기술명·특허 출원번호·제작연도·기술성숙도(TRL)와 기술 개요, 국내외 시장 전망, 사업화 중점사항을 서술형으로 담는다(전국·비공간, CSV 약 1.3MB). 기술이전이나 창업을 검토하는 기업·투자자가 '특정 분야에서 TRL이 높고 시장 전망이 제시된 특구 공개기술이 무엇인가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 특허 출원번호(출원 번호)를 특허 정보와 대조하거나 기술명·기관명으로 맞춰 이어 쓴다.
description_portal: '데이터셋명: 사업화 공개 기술 세부 현황데이터 개요:본 데이터는 국내 연구개발특구 및 관련 기관에서 공개한 사업화 가능한 기술 정보를 체계적으로 정리한 자료입니다. 각 기술별 기본 정보(출원번호, 제작연도, 기술명)와 함께, 기술 성숙도(TRL), 기술 개요(요약·상세), 국내·국외 시장 전망, 사업화 중점사항 등을 포함하고 있다. 이를 통해 연구자·기업·투자자·정책 담당자는 최신 기술 트렌드와 상용화 가능성을 종합적으로 파악할 수 있다.데이터 구성 항목:공개 기술 명 : 사업화 대상이 되는 기술명출원 번호 : 특허 출원번호제작 연도 : 기술이 제작·등록된 연도기술 성숙도 코드 : 기술성숙도(TRL, Technology Readiness Level)를 수치로 표시 (예: 3~9단계)기술 개요 요약 내용 : 해당 기술의 핵심 요약 설명기술 개요 상세 내용 : 기술 배경 및 동작원리 등 구체적 설명국내 전망 내용 : 국내 관련 산업 및 시장의 현황 및 성장 전망국외 전망 내용 : 해외 산업 동향과 시장 전망사업화 중점 내용 : 사업화 과정에서 중점적으로 고려해야 할 사항(정책, 수요, 응용분야 등)활용 방법:기업·창업자 활용 – 신기술 사업화를 준비하는 기업이 기술 성숙도와 시장 전망을 검토하여 R&D 및 투자 전략 수립에 활용연구기관·대학 활용 – 연구개발 결과물의 사업화 가능성을 사전 검토하고, 공동연구 또는 기술이전 기회를 발굴정부·지자체 정책 활용 – 산업 정책 및 지원사업 기획 시, 유망 분야·시장의 정량적 분석 자료로 활용특징 및 장점:시장 전망 포함: 단순 기술 정보 제공을 넘어, 국내외 시장 규모 및 성장률 예측이 포함되어 실질적 활용도가 높음기타사항: 기술통합관리시스템(https://tims.innopolis.or.kr/main)의 특구 기술정보, 사업화 공개기술(통합) 메뉴의 검색을 활용하여 기술의 자세한 정보(사업화 대상 공개기술 보고서)를 추가로 확인하실 수 있습니다.'
