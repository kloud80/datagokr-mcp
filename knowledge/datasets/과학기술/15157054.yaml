summary_user: 서울특별시 중구 안에서 정보통신설비 유지보수관리자를 선임해야 하는 건축물을 한 건물씩 담은 원천 목록으로, 건축물명·연면적·도로명주소·위도·경도를 담는다(CSV 약 54KB). 구청 담당자나 건물 관리업체가 '우리 지역에서 유지보수관리자 선임 대상인 건물이 어디에 얼마나 있는가'를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서, 도로명주소나 위도·경도를 기준으로 건축물대장·상권 같은 주소 기반 데이터와 매칭해 이어 쓴다.
description_portal: 본 데이터는 서울특별시 중구 내 정보통신설비 유지보수관리자 선임 대상 건축물에 대한 현황을 제공한다. 데이터에는 건축물(상호)명, 연면적, 도로명주소, 위도, 경도 등 건축물의 기본 정보가 포함되어 있다. 해당 데이터는 정보통신설비 관리 및 유지보수를 위한 대상 건축물에 대한 자료로 활용될 수 있으며, 건축물의 관리와 관련된 유지보수관리자 선임 여부 파악 및 향후 정보통신설비 관리 업무에 필요한 기초 자료로 사용될 수 있다. 또한, 해당 데이터는 서울특별시 중구 지역 내 건축물의 분포와 용도를 분석할 수 있는 중요한 정보를 제공하며, 도시 계획 및 건축물 관리에 있어서 중요한 참고자료로 활용될 수 있다.
