description_portal: 이 데이터는 과학관 홈페이지에서 제공되는 주요 서비스와 이들의 연간 이용 현황을 정리한 표입니다. 구체적으로 ‘전시관 가이드맵’, ‘온라인 전시관’, ‘추천 코스’, 각종 전시관별 ‘관람안내’ 등 방문객이 과학관을 더욱 효과적으로 이용할 수 있도록 돕는 메뉴들의 접속 횟수가 기록되어 있습니다. 사용자는 오프라인 시설 방문 전 ‘전시관 가이드맵’이나, 각 전시관별 ‘관람안내’를 참고해 동선을 미리 파악하고, ‘온라인 전시관’에서 비대면으로 전시를 체험할 수도 있습니다. 이 밖에도 과학체험 행사를 소개하는 ‘사이언스데이’, 학생들을 위한 ‘전국과학전람회’와 ‘학생과학발명품경진대회’ 통합검색, 그리고 과학관의 ‘공지사항’이나 ‘채용정보’ 등 다양한 소통 창구의 이용 현황도 확인할 수 있습니다. 이 데이터는 과학관이 제공하는 서비스가 얼마나 다양하며, 어떤 정보가 많이 활용되는지 한눈에 보여주어 기관 운영이나 향후 서비스 개선 방향을 파악하는 데 유용합니다. 과학관을 방문하려는 개인이나 가족, 교육기관 관계자, 또는 과학 행사 및 교육, 정보를 필요로 하는 누구나 참고하기 좋은 자료입니다.
