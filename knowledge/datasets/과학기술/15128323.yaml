summary_user: 국내 침해사고 사례 분석에서 확인된 침해지표(IoC)를 공격 IP 한 건씩 날짜, 공격 IP, 해당 IP의 국가, 행위 구분으로 담은 전국 범위 CSV 파일(약 24KB)이다. 보안 담당자나 분석가가 "우리 방화벽·접속 로그에 찍힌 이 IP가 국내 침해사고에 쓰인 적이 있는가, 어떤 행위를 했는가"를 확인하거나 공격 출처 국가 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공공데이터와 코드로 잇기는 어렵고, 자체 보유한 로그·차단 목록과 IP 문자열을 직접 대조하는 방식으로 쓴다.
description_portal: 국내에서 발생한 다양한 침해사고 사례를 분석하여 확인된 침해지표(IoC)에 관한 상세한 데이터입니다. 이 데이터는 침해사고와 관련된 핵심 정보를 체계적으로 수집 및 정리한 것으로, 침해 대응과 보안 관리를 위한 중요한 자원으로 활용됩니다. 특히, 공격에 사용된 IP 주소 정보를 포함하고 있어 어떤 IP가 침해 행위에 연루되었는지 명확히 파악할 수 있습니다. 또한, 해당 IP가 위치한 국가 정보도 함께 제공되어 공격의 출처를 지리적으로 분석할 수 있습니다. 더불어, 각 공격 IP가 수행한 구체적인 행위 내역—예를 들어 악성코드 배포, 권한 탈취 시도, 네트워크 스캔 등—을 상세히 기록하여 침해 사고의 유형과 특징을 깊이 있게 이해할 수 있도록 지원합니다. 이러한 정보를 바탕으로 보안 전문가들은 침해 사고의 원인을 신속히 분석하고, 효과적인 대응 방안을 마련할 수 있습니다. 아울러 이 데이터는 국내 사이버 보안 환경의 위협 동향을 파악하고, 장기적인 보안 정책 수립과 기술 개발에도 기여하는 중요한 자료입니다. 따라서 국내외 다양한 기관과 협력하여 침해사고 대응 역량을 강화하는 데 필수적인 역할을 수행합니다.
