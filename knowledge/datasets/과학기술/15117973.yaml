description_portal: '이 데이터는 지정시험기관의 변경 민원 상세 내역을 담고 있으며, 주요 항목으로는 민원접수번호, 변경구분코드, 처리일자, 최종수정일자가 포함되어 있다. 변경구분코드는 ‘시험설비’, ‘시험원’, ‘대표자 변경’ 등 다양한 사유로 구분되며, 이를 통해 민원의 유형을 파악할 수 있다. 데이터는 각 민원이 언제 접수되었고, 어떤 변경이 이루어졌으며, 최종 수정된 일자까지 기록해 지정시험기관 변경 이력을 체계적으로 관리하는 데 활용된다.○ 데이터 보유 컬럼 : 민원접수번호, 변경구분코드,  변경구분코드명, 최종수정일자'
