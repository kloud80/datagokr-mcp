description_portal: '한국과학창의재단은 전국 각지에서 열리는 다채로운 과학문화 프로그램을 국민들에게 알리고 참여를 독려하기 위해 관련 정보를 수집하여 제공하고 있습니다. 과학관, 연구기관, 교육청 등 다양한 기관에서 운영하는 프로그램을 통해 국민들이 생활 속에서 과학을 쉽게 접하고 즐길 수 있는 환경을 조성하고자 합니다.개방 데이터는 2020년 10월부터 2021년 10월까지 등록된 전국의 과학문화 프로그램 정보 약 420여 건입니다. 각 데이터는 프로그램명, 온·오프라인 구분, 분류(축제, 교육, 전시 등), 대상, 장소, 운영기관, 주최, 등록일자, 상세 정보 URL로 구성되어 있어 사용자가 원하는 조건의 프로그램을 쉽게 찾을 수 있습니다.학생 및 학부모는 자녀의 과학 교육 및 체험 활동 정보를 얻는 데 활용할 수 있으며, 교육기관 및 교사는 창의적 체험활동이나 방과 후 활동 프로그램을 기획하는 데 참고 자료로 활용할 수 있습니다. 또한, 과학문화 정책 연구자 및 기획자는 지역별·분야별 프로그램 현황을 파악하고 분석하여 과학문화 활성화 정책 수립에 기여할 수 있습니다.url : https://www.scienceall.com/sci-event-all-2020/'
