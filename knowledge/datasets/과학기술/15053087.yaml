summary_user: 충청북도에 주소지를 둔 정보통신공사업 등록업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 등록번호·상호·대표자·전화·팩스·우편번호·주소·등록일자를 담는다(CSV 약 50KB). 사업자나 발주 담당자가 도내 특정 시군에 등록된 정보통신공사업체를 찾거나 연락처를 확인할 때 쓰고, 분석가는 지역별 공사업체 분포를 볼 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 주소(시군 단위 매핑)나 상호 이름 맞추기로만 이어 쓴다.
