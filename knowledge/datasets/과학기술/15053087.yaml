description_portal: 정보통신공사업법 제14조 및 시행령 제16조에 따라 충청북도에 신규등록한 정보통신공사업체, 정보통신공사업법 제17조, 19조 및 시행령 제22조에 의거 양도양수한 충청북도에 주소지를 두고있는 정보통신공사업체 등 정보통신공사업 등록현황 정보를 제공합니다.(등록번호, 상호, 대표,  전화번호, 팩스번호, 주소, 우편번호 등)또한 정보통신공사업법 제23조제2항에 의거 폐업한 업체에 대해서는 삭제처리하고 있습니다.정보통신공사업법 제72조에 따라 신규등록, 양도양수, 폐업 등 변경 사항을 도보게재하고 있으니, 등록업체 현황을 빠르게 파악하고 싶으시면 참고하시기 바랍니다.수정사항이 있는 경우 담당자에게 문의바랍니다.
