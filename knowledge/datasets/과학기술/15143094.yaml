summary_user: 한국인터넷진흥원이 탐지한 피싱 사이트를 URL 한 건씩, 탐지 날짜와 함께 담은 건별 목록이며 포털에서 받은 CSV 파일은 약 4.4MB입니다. 보안 담당자나 서비스 운영자가 "이 링크가 이미 알려진 피싱 사이트인가"를 확인하거나 차단 목록을 만드는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 홈페이지주소(URL) 문자열을 맞춰 보는 방식으로만 잇는다.
description_portal: 한국인터넷진흥원이 탐지한 피싱 사이트 URL에 대한 정보로, 이는 주로 이용자의 개인정보 또는 금융정보를 탈취하기 위해 제작된 악성 사이트들입니다. 범죄자는 문자메시지(SMS), 이메일, 메신저 등 다양한 전송 수단을 활용하여 악성 URL을 사용자에게 송부하며, 이를 클릭하도록 유도해 악성코드를 설치하거나 가짜 로그인 페이지로 접속을 유도합니다. 이 URL은 정상적인 웹사이트를 위장하거나 금융기관, 공공기관 등 신뢰할 수 있는 기관의 이름을 사칭하는 방식으로 제작되며, 사용자로 하여금 경계심을 늦추게 만들어 공격 성공률을 높입니다. 한국인터넷진흥원은 이와 같은 악성 URL을 지속적으로 수집 및 분석하여, 탐지된 피싱 사이트 정보를 공유함으로써 유관기관의 대응을 지원하고 국민의 사이버 피해를 예방하고자 합니다. 이 데이터는 보안 필터링, URL 차단, 사용자 교육 등 다양한 사이버 위협 대응 활동에 활용됩니다.※ 개인정보, 금융정보 탈취 등을 목적으로 악성코드 설치를 위해 범죄자가 메시지, 이메일 등을 통해 송부한 악성 URL
