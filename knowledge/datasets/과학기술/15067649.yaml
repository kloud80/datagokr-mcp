description_portal: 본 데이터는 한국도로교통공단이 운영하는 한국교통방송(TBN) 지역국의 주말(토·일) 프로그램 편성 정보를 표준화해 제공한 목록이다. 필드는 방송권역, 지역명, 방송국명, 프로그램명, 요일, 시작·종료시각, 진행자, 방송형식, 코너요약, 청취채널(FM·모바일앱), 비고 등으로 구성된다. 본 목록은 지역국 간 시간대 비교, 편성표 시각화, 이용자 안내, 알림 서비스 설계 등 업무에 활용한다. 개인정보는 포함하지 않으며 명칭과 시간 표기를 통일하여 기계처리에 적합하다. 동일 스키마로 구축되어 지역·시간·형식 기준의 필터링과 검색, 주말 편성 특성 분석, 질의응답 시스템의 참조 테이블로 쓰기 용이하다.
