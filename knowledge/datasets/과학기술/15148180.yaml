description_portal: 국토교통과학기술진흥원은 국토교통분야의 혁신적 기술 개발과 정책 지원을 통해 다양한 연구성과를 창출해오고 있습니다. 대표적으로 스마트시티 기술 개발을 통한 도시문제 해결, 자율주행차, 드론 물류 등 미래 교통기술 상용화 기반 마련, 철도/도로 인프라의 안전성 향상 기술 개발 등이 있습니다. 또한 친환경 건축자재와 에너지 효율화 기술을 보급하여 탄소중립 정책 실현에 기여하고 있으며, 건설 자동화 및 BIM(Building Information Modeling) 활용 확산을 통해 생산성과 안전성을 동시에 높인바 있습니다. 매년 국토교통R&D 주요연구성과에 대한 목록을 확인 할 수 있습니다.
