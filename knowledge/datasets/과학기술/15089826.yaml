summary_user: 연구개발특구 안에 설립된 연구소기업을 기업 한 곳당 한 행으로 담은 파일로, 전국 1,452개 기업의 구분, 기업명, 등록연도, 현재 소속 특구, 강소특구 여부를 담는다. 기술사업화 분석가나 지역 정책 담당자가 특정 특구나 강소특구에 연구소기업이 해마다 몇 곳씩 등록됐는지를 따져 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 특구 입주기관이나 사업화 공개기술 같은 다른 특구 데이터와는 기업명과 특구명을 맞춰 보는 방식으로만 이어 쓴다.
