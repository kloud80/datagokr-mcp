summary_user: 국내 학술지별로 연구분야 코드, 등재·통합·분리 이력, 발간 현황, 등록·수정일시를 담은 학술지 단위 정보를 전국 범위로 제공하는 API입니다. 도서관·학술기관이나 분석가가 특정 학술지의 연구분야 분류와 등재 이력을 확인하거나, 분야별 학술지 발간 동향을 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 학술지 식별자(SEREID)나 연구분야 코드(STUDFIELCD)로 같은 기관(한국연구재단)의 KCI 논문·인용 데이터와 이름·코드 매핑으로만 이어 쓴다.
limits: 다른 기관 데이터와 바로 연결할 공통 조인 키가 없어 학술지명이나 코드 매핑이 필요하다. 개발계정은 하루 5,000회 호출로 제한되며, 이 데이터는 학술지 메타정보라서 최신 논문·인용·연구자 정보처럼 분석 가치가 큰 내용은 담지 않는다.
