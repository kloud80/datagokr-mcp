description_portal: '주소정보를 입력하면 해당 주소의 집배구번호, 좌표정보를 제공하는 OPEN API 서비스 입니다.ㅇ 출력하는 항목(사용자가 응답 받게 되는 데이터) : 우편번호, 주소, 집배구번호, X좌표, Y좌표이 문서는 우체국 배달점주소 조회 서비스를 공공데이터 OpenAPI로 활용하기 위한 기술 가이드입니다. API 서비스 개요, 상세 기능 목록, 각 기능별 요청·응답 메시지 명세, 필수·옵션 항목 구분, 복수건 처리 규칙, 요청·응답 예제, 에러 코드 목록 등을 포함합니다. 개발자가 배달점주소 데이터를 효율적으로 연동·활용할 수 있도록 구조와 규격을 제공하며, 주소 기반의 배송 서비스 구현 및 품질 향상에 필요한 표준화된 정보를 제시합니다.'
