description_portal: 과학기술정보통신부가 실시한 이공계인력 육성·활용과 처우 등에 관한 실태조사(2020년) 중 이공계 박사학위 소지자의 직장유형별, 직종유형별 분포를 나타내는 통계 데이터입니다.이공계 인력의 진로 현황과 고용 구조를 파악하기 위한 지표로 활용됩니다. 데이터는 직장유형 4개 범주(기업, 공공연구기관, 대학, 기타)와 직종유형 5개 범주(관리직, 연구직, 기술직, 사무직, 기타)의 교차표 형태로 구성되어 있으며, 각 셀은 해당 직장유형에서 특정 직종이 차지하는 비율(%)을 나타냅니다.  이 데이터는 이공계 박사 인력의 경력 경로 분석, 인력 수급 정책 수립, 대학원 교육과정 개선, 연구인력 처우 개선 정책 등에 중요한 기초자료로 활용될 수 있습니다. 특히 직장유형별로 직종 분포가 상이하게 나타나는 특성은 맞춤형 인력양성 전략 수립에 유용한 정보를 제공합니다.
