description_portal: '한국과학창의재단은 코로나19 이후 비대면 과학문화 활동에 대한 사회적 요구가 증가함에 따라, 국민들이 시공간 제약 없이 참여할 수 있는 다양한 온라인 과학문화 프로그램 정보를 제공하고 있습니다. 이를 통해 디지털 환경에 익숙한 청소년들의 참여를 유도하고, 원격교육 환경에서도 과학 학습과 체험이 지속될 수 있도록 지원하고자 합니다.개방 데이터는 2020년 10월부터 2021년 10월까지 등록된 온라인 과학 강연, 교육, 캠프, 공모전 등 110여 건의 프로그램 정보로 구성되어 있습니다. 각 데이터는 프로그램명, 분류, 대상, 운영 플랫폼(Zoom, 홈페이지 등), 운영기관, 주최, 등록일자, 상세 정보 URL을 포함하고 있어 비대면 과학 활동 정보를 손쉽게 얻을 수 있습니다.학교 및 교육기관은 원격수업이나 온라인 특별활동의 보조 자료로 활용하여 학생들의 과학적 흥미와 탐구심을 높일 수 있습니다. 개인 사용자는 자신의 관심 분야에 맞는 온라인 과학 프로그램에 참여하여 자기계발 및 여가선용의 기회로 삼을 수 있으며, 관련 기관들은 비대면 교육 및 행사 기획의 최신 동향을 파악하고 벤치마킹하는 데 기여할 수 있습니다.url : https://www.scienceall.com/sci-event-online/'
