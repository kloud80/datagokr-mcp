description_portal: 시청자미디어재단이 방송발전기금을 활용하여 공동체라디오방송사가 기획한 방송프로그램 제작(안)을 심사·선정하고, 이에 대한 제작비를 지원함으로써 프로그램의 품질을 향상시키고 콘텐츠 경쟁력을 강화하는 데 기여하고 있습니다. 또한 이러한 지원을 통해 지역 주민의 자발적인 참여를 유도하고, 공동체 중심의 다양한 목소리가 반영될 수 있는 방송 환경을 조성하여 지역사회 기반 미디어의 활성화와 지속 가능한 운영 기반을 마련하고 있습니다.본 데이터는 공동체라디오 제작지원 사업을 통해 실제로 제작된 방송 프로그램에 대한 정보를 체계적으로 정리한 자료로, 지원을 받아 제작된 프로그램명, 시리즈편수, 방송분량, 방송횟수 등 다양한 항목을 포함하고 있습니다. 이를 통해 사업의 추진 현황과 성과를 구체적으로 파악할 수 있으며, 연도별·유형별 분석을 통해 프로그램의 특성과 경향을 이해하는 데에도 활용할 수 있습니다.
