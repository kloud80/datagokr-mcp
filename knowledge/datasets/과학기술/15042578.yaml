description_portal: 본 데이터는 소형전자파 측정기를 통해 측정한 전자파 관련 정보입니다. (간이형/이동통신특화형)무선통신에서 발생하는 전자파 세기를 측정하는 소형 광대역 전자파 측정 시스템을 활용하여 측정하였습니다. 전자파 측정값은 원격으로 모니터링되며, QR코드를 이용해 실시간으로 확인할 수 있습니다. 전자파 세기가 궁금한 국민 누구나 대여서비스를 통해 이용해 볼 수 있습니다. 데이터는 원하는 기간을 설정하여 검색할 수 있습니다. 측정장소, 측정값(평균), 최근 측정일 그리고 내용으로 구성됩니다. 내용은 그래프 및 위치 정보를 제공합니다. 본 자료는 국민에게 전자파 정보를 투명하게 제공하고 전자파 산업 진흥에 기여하기 위하여 제공됩니다. 측정값은 100 kHz ~ 6 GHz(이동통신, Wifi 등) 주파수 대역 전반에 대한 전자파 환경 측정 결과로, 무선국 전자파 측정결과와 다소 차이가 있을 수 있습니다.※ URL링크(https://emf.kca.kr/web/info/monitoring/small.do)를 통해 전자파 측정에 대한 자세한 내용을 확인해보시기 바랍니다.
