description_portal: 국토교통과학기술진흥원은 연구성과의 경제적 가치와 기술적 우수성을 객관적인 지표로 측정하고 활용성을 높이기 위해 기술가치평가 사업을 추진하고 있습니다. 이를 통해 공공연구성과의 시장성과를 높이고 기업의 기술사업화와  투자유치 기반 마련하여, 기술이전 활성화 및 산업경쟁력 강화를 지원합니다. 더 나아가서 국가 차원의 혁신성장을 촉진하고 미래 핵심기술의 전략적 활용을 도모하는 체계를 구축하고 있습니다. (연도, 산업기술분류-대분류, 산업기술분류-중분류, 산업기술분류-소분류, 표준사업분류-대분류, 표준산업분류-중분류, 표준산업분류-소분류, 등록건수 등 제공)
