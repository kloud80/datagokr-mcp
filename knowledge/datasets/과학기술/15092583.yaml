description_portal: 한국인터넷진흥원 대표홈페이지 DB에 저장된 게시글 정보로서, 게시글의 구체적인 관리 및 분류를 위해 다양한 항목이 포함되어 있습니다. 주요 컬럼명으로는 게시판코드, 자료번호, 서브자료번호가 있으며 이는 게시글이 속한 게시판과 자료의 고유 식별자를 나타냅니다. 게시물분류를 통해 게시글의 종류를 구분하고 제목은 게시글의 내용을 한눈에 알 수 있도록 작성됩니다. HTML여부는 게시글이 HTML 형식인지 여부를 나타내며, 조회수는 게시글이 열람된 횟수를 기록합니다. 메인게시여부, 대표게시여부, 상위노출여부 등은 게시글이 홈페이지 내에서 어느 위치에 노출되는지를 설정하는 항목입니다. 게시지속여부는 게시글이 계속해서 게시될지 여부를 나타내며, 게시일과 등록일은 각각 게시글이 작성된 날짜와 DB에 등록된 날짜를 의미합니다. 사용여부는 게시글의 활성화 상태를, 노출여부는 외부에 공개되는지 여부를 나타내며, 과기부연동게시글 컬럼은 과학기술정보통신부와 연동된 게시글인지 여부를 확인하는 데 활용됩니다. 이와 같은 상세 정보들은 게시글 관리와 운영, 그리고 효율적인 정보 제공에 필수적인 요소로 활용됩니다.
