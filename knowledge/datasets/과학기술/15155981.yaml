description_portal: '1. 개요지식재산처에서 법인을 분류하고 관리하기 위해 시스템에서 사용되는 정보입니다. 이는 특허 출원이나 상표 등록, 디자인 등록 등의 지식재산 관련 업무에서 중요한 역할을 합니다. 법인분류정보는 주로 법인(기업, 기관 등)을 구체적인 범주나 유형으로 나누어, 해당 법인의 특허, 상표, 디자인 등의 출원 및 등록 정보를 효율적으로 관리하고 추적할 수 있도록 돕습니다.2. 상세설명1) 법인분류번호 : 지식재산처에서 법인(기업)이나 기타 출원인(기관, 단체 등)을 구분하기 위해 부여하는 고유한 번호입니다2) 법인분류명 : 지식재산처에서 법인(기업) 또는 기관을 분류하기 위한 명칭 또는 카테고리입니다.3) 법인분류유형코드 : 지식재산처에서 법인(기업이나 기관)을 분류하기 위해 사용하는 코드 중 법인이 속한 유형을 명확하게 구분하는 데 사용되며, 법인의 산업군, 기술 분야, 또는 조직의 성격에 따라 분류됩니다.'
