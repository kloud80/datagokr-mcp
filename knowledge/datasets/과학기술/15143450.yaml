description_portal: 여성과학기술인 담당관은 공공연구기관 및 국공립대학에서 기관 내 여성과학기술인의 지위향상과 채용 촉진을 위하여 다양한 활동을 수행하고 있습니다. 그리고, 일-생활균형 연구문화가 기관 전반에 확산되어서 구성원 모두가 혜택을 받을 수 있도록 제도 개선에 힘쓰고 있습니다. 동 데이터에는 번호, 기관구분, 상위기관 정보, 연구기관, 법정여부, 담당관 수가 포함되어 있으며, 이를 통해 공공연구기관 및 국공립대학에서 여성과학기술인 담당관으로 얼마나 노력하는 확인할 수 있습니다. 또한, 해당 통계를 여성과학기술인 관련 다른 분야에 접목하여 해당 기관의 노력을 확인할 수 있습니다.
