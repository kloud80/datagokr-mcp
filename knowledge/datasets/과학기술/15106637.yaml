description_portal: 경기도 양평군의 전산장비(데스크톱과 모니터) 구입내역입니다.2014년부터 2025년까지의 양평군 내 공공기관에서 사용하기 위해 신규 구입한 전산장비 개수와 구입금액이다.신규 사업을 시행하거나 부서의 확장 등의 동향을 짐작할 수 있으며 컴퓨터의 교체 주기를 유추가능하다.모니터의 경우 두 개를 한 번에 사용하는 경우까지 고려하면 데스크톱(본체)에 비해 교체 주기가 길고데스크톱은 시간이 지나면 성능이 저하되고 프래그램들의 요구치가 높아져 교체 주기가 짧다.그에 따라 구입 개수에 차이가 있으며 또한, 년도가 지날 수록 컴퓨터의 가격이 높아지는 추이를 비교할 수 있다.
