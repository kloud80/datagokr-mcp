description_portal: KISA 등에서 제공하는 암호이용·정책·기술 구현 자료와 암호알고리즘 관련 문서, 그리고 랜섬웨어 암호기능 분석 보고서, 암호모듈검증 서식, 대학 암호동아리 지원·공모전 안내 등으로 구성된다. 주요 내용은 SEED·HIGHT·ARIA·LEA·SHA-256·LSH 등 국가·표준 암호알고리즘 안내, 패스워드 및 키 관리 가이드, IoT·HTML5·양자환경 암호기술 적용 자료, 개인정보DB·보조기억매체 암호화 지침, 상용SW 암호기능 활용 안내 등이 포함된다. 또한 2019년 랜섬웨어 6종의 암호기능 분석 보고서가 제공되고, 암호모듈검증(KCMVP) 관련 FAQ·교육·컨설팅 공지, 암호이용 실태조사 및 산업 지원 사업 안내로 구성된다. 랜섬웨어 종류별 암호기능 분석과 분기별 동향 보고서가 포함되며, 암호기술및 암호동아리 지원 관련 정보도 제공된다.
