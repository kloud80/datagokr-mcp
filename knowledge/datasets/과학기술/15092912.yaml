summary_user: 한국연구재단이 관리하는 학술대회별 운영조직 정보를 조직 한 건 단위로 담은 전국·비공간 파일 데이터로, 기관명·기관ID·학술대회ID·운영조직ID·한글운영조직명이 들어 있다. 학술대회 기획자나 학회 연구 분석가가 어떤 기관의 학술대회에 어떤 운영조직이 꾸려졌는지 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터셋과 이어 쓸 전역 조인 키가 없다. 그래서 연결은 기관명·학술대회ID 같은 이름·코드 매핑이나 같은 기관 코드로만 한다.
description_portal: 학술대회 운영 조직의 구조와 관련된 상세 정보를 담고 있는 데이터로, 기관명, 기관ID, 학술대회ID, 운영조직ID, 한글운영조직명, 조직 유형, 소속 구분 등 다양한 항목이 포함되어 있습니다. 이 데이터는 학술대회 운영 체계를 체계적으로 분석하고, 조직별 역할 분담 및 기능을 명확히 파악하는 데 활용됩니다. 연구자뿐 아니라 학술대회 기획자, 운영 관리자, 정책 담당자 등도 해당 데이터를 바탕으로 조직 구성과 실제 운영 현황을 확인하고, 학술행사의 효율적인 기획과 관리를 위한 의사결정을 내리는 데 참고할 수 있습니다. 또한 학술대회 운영의 효율성을 높이고, 기관 간 협력 및 네트워크 강화를 위한 기반 자료로도 유용하게 사용됩니다. 이 데이터는 1년 단위로 주기적으로 갱신되어 최신 운영 조직 정보를 반영합니다.
