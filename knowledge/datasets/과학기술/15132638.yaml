summary_user: 한국인터넷진흥원이 운영하는 개인정보 포털의 온라인 사이버교육 과정을 과정 한 건당 한 행으로 담은 목록 파일(CSV)로, 교육명·강좌 개요·접수/종료 기간 일수·수강 제한 수·단체교육 여부·수강 시간(분)·교육종료 여부를 포함한다. 개인정보 보호 교육을 받으려는 국민이나 담당자가 '지금 수강 가능한 개인정보 온라인 교육은 무엇이고 몇 분짜리인가'를 확인하거나, 분석가가 교육 과정 구성을 파악하는 데 쓴다. 코스식별자(privacy_course_id)와 사이버교육식별자(privacy_cyber_edu_id)가 조인 키이므로 같은 포털의 코스·교육 관련 다른 데이터와 이 키로 이어 쓴다.
description_portal: 한국인터넷진흥원에서 운영 중인 개인정보포털의 사이버교육목록 관련 데이터는 국민의 개인정보 보호 역량 강화를 위한 온라인 교육 프로그램에 대한 정보로 구성되어 있으며, 각 교육 코스를 구분하기 위한 코스식별자와 교육 과정별로 부여된 사이버교육식별자를 포함합니다. 또한 사이버교육명 항목을 통해 교육의 주제나 내용을 식별할 수 있고, 교육접수일수 및 교육종료일수 항목을 통해 해당 교육의 수강 가능 기간을 확인할 수 있습니다. 교육수강제한수 항목은 하나의 교육과정에 대해 동시에 수강할 수 있는 인원수 또는 횟수 등을 제한하는 기준을 나타냅니다. 이 데이터는 교육 운영 현황을 파악하거나 교육 참여 기준을 수립하는 데 활용될 수 있으며, 개인정보 보호 교육 체계의 체계적인 관리와 서비스 개선에도 기여할 수 있습니다.
