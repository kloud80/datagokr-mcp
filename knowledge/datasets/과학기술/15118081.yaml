description_portal: '방송통신기자재 등을 지정시험기관에서 신청했던 시험분야의 시험항목들과 관련된 민원이력 입니다.시험분야에는 전자파적합성, 전자파흡수율, 전자파강도, 유선, 무선 등이 있으며,시험분야의 세부사항인 시험항목(기자재)으로는 국립전파연구원의 고시에서 지정한 기기, 장비, 설비 등이 있습니다.< 데이터 레이블 설명 > 1. 민원 접수한 번호 2. 5개 시험분야 구분의 영문자(R: 무선, T:유선, E: 전자파적합성, M: 복합기기 등) 3. 5개 시험분야의 세부 시험항목 코드 4. 최종수정일자 5. 코드 설명을 위한 뷰 테이블'
