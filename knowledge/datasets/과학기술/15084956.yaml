summary_user: KCI(한국학술지인용색인)에서 국내 학술지를 분류할 때 쓰는 연구분야 코드표로, 분야 코드(MAJOR_CODE)·국문 분야명·영문 분야명을 한 행씩 담은 참조용 목록이다. 연구자나 학술지 운영자, 평가기관이 특정 학술지나 논문이 어느 연구분야에 속하는지 코드로 확인하거나 분야별 학술지 현황을 정리할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않았으며, 같은 기관(한국연구재단) KCI 서비스의 분야 코드나 분야명과 맞춰 이어 쓰는 방식으로만 연결된다.
description_portal: KCI 연구분야 조회 서비스는 국내 학술지의 연구분야 관련 정보를 체계적으로 제공합니다. 주요 컬럼에는 분야 코드, 분야명, 영문 분야명 등이 포함되어 있어 학술지별 연구분야 분류와 특성을 쉽게 파악할 수 있습니다. 이를 통해 연구자, 학술지 운영자, 평가기관 등이 연구분야별 학술지 현황을 분석하거나 연구 동향을 파악하고, 분야별 논문 분류 등의 목적으로 활용할 수 있습니다. 또한, 이 데이터는 연구의 효율성과 정확성을 높이는 데 기여하며, 학문적 발전을 위한 중요한 기반 자료로 사용될 수 있습니다.
