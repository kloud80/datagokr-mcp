description_portal: K-water에서 과년도에 수탁받아 수행한 연구과제 정보를 제공합니다.해당자료는 연구과제명, 연구책임자, 연구기간, 발주기관을 포함합니다.제공되는 연구과제 정보는  K-water 관련 기술 개발 동향 파악, 정책수립 및 유사 연구기획에 활용 할 수 있으며, 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어, 이용자의 편익 증진과 신산업 창출에 기여합니다. 상세 연구보고서는 공공기관 경영정보 공개시스템 '알리오'(www.alio.go.kr)에서 확인하실 수 있으며, 구체적인 연구수행내용, 결과 등의 상세정보가 포함되어 있습니다.
