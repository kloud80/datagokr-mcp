description_portal: 국립과학수사연구원은 국내 유일한 법과학 연구기관으로서 감정기법개발을 위한 국가연구개발사업을 수행하고 있습니다.  중장기과학수사감정기법개발(R&D) 연구사업은 크게 유전자, 독성/마약, 화학, 안전(화재, 혈흔, 총기, 안전, 흔적), 디지털포렌식, 교통사고분석, 심리, 법의학 분야로 나누어 기관 고유사업으로 연구를 수행하고 있습니다. 수행되는 과제의 진행과정에 따라 연차, 종료보고서로 구분이되어  매년 보고서를 작성하여 공개하고 있습니다. 다만 혁신법에 근거하여 지식재산권 등의 사유가 있는 경우 보고서를 비공개 등록하고 있습니다.
