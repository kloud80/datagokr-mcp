description_portal: "4차 산업혁명 시대를 맞아 중요성이 커지고 있는 소프트웨어(SW)와 인공지능(AI) 분야의 교육을 지원하기 위해 한국과학창의재단에서 개발·보급하는 교육용 교재 목록 데이터입니다. 학교급별(초·중·고) 및 수준별 맞춤형 교재를 제공하여 체계적인 SW·AI 교육을 돕는 것을 목적으로 합니다.개방 데이터는 초·중·고등학교 학생 및 교사를 위한 SW·AI 교육용 교재 약 80여 종의 목록으로 구성되어 있습니다. 각 교재는 '제목', '내용', '분류명(초등교재, 중등교재, 교사용 지도서 등)', '교재보기경로' 등의 정보를 포함하고 있어, 이용자가 원하는 교재를 쉽게 찾아보고 활용할 수 있습니다.일선 학교의 교사들은 이 데이터를 활용하여 수업 수준과 목표에 맞는 교재를 선택하고, 수업 자료로 활용함으로써 교육의 질을 높일 수 있습니다. 교육 콘텐츠 개발 기업이나 연구 기관에서는 기존 교재의 현황을 분석하여 새로운 교육 프로그램을 개발하거나, SW·AI 교육 과정 연구를 위한 기초 자료로 활용할 수 있습니다.* 접속 URL : https://www.software.kr/home/kor/eduInfo/swedu/textbook/index.do?menuPos=131"
