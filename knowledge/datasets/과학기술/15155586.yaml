description_portal: '본 데이터셋은 국립과천과학관 사이버전시관에 게시된 전시물 관련 동영상 파일에 대한 정보를 정리한 자료입니다. 온라인 전시관에서 제공되는 멀티미디어 자료의 목록과 파일 속성을 관리하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 동영상 파일명과 크기 정보를 통해 사이버전시관의 콘텐츠 구성 현황을 파악하고 디지털 자산을 효율적으로 관리할 수 있습니다. 둘째, 파일 용량(크기) 정보를 분석하여 서버 스토리지 확보 및 네트워크 트래픽 최적화 계획 수립에 활용 가능합니다. 셋째, 전시물별 연결된 영상 자료의 유무를 확인하여 온라인 관람객에게 제공되는 서비스의 질을 점검하고 개선하는 데 참고할 수 있습니다.□ 데이터 구조· 일련번호 : 파일의 고유 식별 번호 (Integer)· 이름 : 전시 동영상의 명칭 (String, 예: .flv)· 크기 : 전시 동영상의 용량 (Integer, 단위: Byte)· 기준일자: 데이터 수집 기준 일자 (Integer)'
