description_portal: 과학기술정보통신부가 매년 선정하는 국가연구개발 우수성과 100선 데이터입니다. 국가 발전에 기여한 우수한 연구개발 성과를 발굴하여 과학기술의 중요성에 대한 국민의 이해를 높이고, 연구자들의 자긍심을 고취하기 위한 범부처 차원의 성과 선정 제도입니다. 선정된 우수성과는 기계·소재, 생명·해양, 에너지·환경, 정보·전자, 융합·기술, 순수기초·인프라의 6개 분야로 분류되며, 각 분야별로 최우수 성과와 우수 성과가 구분되어 총 100개의 대표적인 연구성과가 포함되어 있습니다. 데이터에는 성과명, 연구책임자, 소속기관 정보가 수록되어 있어 국내 연구개발의 현황과 수준을 파악할 수 있습니다. 이 데이터는 과학기술 정책 수립, 연구개발 투자 방향 설정, 우수 연구사례 벤치마킹, 산학연 협력 파트너 발굴 등에 활용될 수 있습니다.
