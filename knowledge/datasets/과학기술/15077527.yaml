description_portal: '- 한국방송광고진흥공사에서 공익광고 주제선정을 위한 국민여론조사 데이터를 제공합니다.- 공익광고가 다양한 사회적 가치를 포용하면서 동시대적 주요 의제와 국민의 니즈를 표현할 수 있도록 시의성 있는 주제선정을 위한 조사 데이터입니다.- 크게 사회 이슈 트렌드 모니터링, 국민 여론 트렌드 모니터링, 전문가 의견 세가지로 구성되어있습니다.- 사회 이슈 트렌드 모니터링은 12개 분야별 세부주제, 키워드의 빈도를 제공합니다. 국민 여론 트렌드 모니터링은 공익광고 제작이 필요한 주제, 시급한 분야 및 주제에 대한 연령대별 자료를 제공합니다. 전문가 의견은 12개 분야 및 주제별 빈도수를 제공합니다.'
