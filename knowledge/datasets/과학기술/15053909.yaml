summary_user: 대학·공공연구소가 보유한 미래 유망 특허기술을 기술 한 건당 한 행으로 정리한 파일로, 보유기관·기술명·미래유망신기술(6T) 분류를 담으며 전국·비공간 자료이고 CSV 파일 크기는 약 19KB입니다. 기술이전이나 산학협력을 찾는 기업·분석가가 "어느 대학·공공연구소가 바이오·나노 같은 6T 분야에서 어떤 유망 특허기술을 갖고 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 특허·기관 데이터와는 보유기관명이나 기술명을 이름으로 맞춰 연결해야 한다.
description_portal: 특허청_공공 유망 특허기술자료입니다.대학 및 공공연구소의 미래 유망 특허기술 관련 자료를 제공합니다 (2016년 5월 기준시점으로 정리됩니다)본 자료는 대학 및 공공연구소의 미래 유망 특허기술 관련 자료로서,  공공데이터포털을 통해 CSV+오픈API(JSON/XML) 형식으로 제공됩니다.공공유망 특허기술자료에 포함된 주요 컬럼 항목들은 아래와 같습니다.기술명/특허기술명칭대학 또는 공공연구소명(발주자 또는 보유자)특허번호 또는 출원번호기술요약 또는 개요예상적용 분야 또는 유망 활용 분야공개일 또는 등록일 등 날짜정보
