description_portal: 한국인터넷진흥원 본인확인 지원포털의 ‘브라우저별 접속통계’ 데이터는 이용자들이 어떤 웹 브라우저를 통해 포털에 접속했는지를 일 단위로 수집하여 제공하는 서비스 운영 통계 기반 공공데이터이다. 이 데이터는 특정 시점의 브라우저 사용 비중을 파악하고, 서비스 접근성 개선이나 브라우저 호환성 점검에 필요한 기초 자료로 활용된다. 주요 항목으로는 접속일자(년·월·일), 브라우저 종류, 사이트프리픽스, 접속수가 포함되며, 이를 통해 특정 브라우저에서의 오류 발생 추세, 사용자 환경 변화, 모바일·PC 비중 분석 등 다양한 운영·품질 관리 목적의 분석이 가능하다. 포털 이용 특성과 기술적 접근 환경의 변화를 체계적으로 이해하는 데 유용한 데이터이다.
