summary_user: 국내 웹 개발 분야 기업의 명칭과 간단한 기업 소개를 기업 한 곳당 한 행으로 정리한 목록으로, 2024년 12월 1일 기준 전국 범위의 CSV 파일(약 115KB)이다. 웹사이트 구축·유지보수를 맡길 업체를 찾는 발주 담당자나 국내 웹 개발 시장의 기업 분포를 살피는 분석가가 '어떤 웹 개발사들이 있고 각각 무엇을 하는가'를 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 개발사명(이름) 매칭으로만 이을 수 있다.
description_portal: 웹을 활용하여 다양한 재화나 서비스를 생산·제공하는 국내 웹 관련 기업들의 현황을 정리한 자료입니다. 이 자료는 특히 웹 산업 내에서 ‘웹 개발’ 분야에 해당하는 기업들을 대상으로 하며, 각 기업의 명칭과 함께 간단한 기업 소개 정보를 포함하고 있습니다. 이를 통해 사용자는 특정 웹 개발사의 기본 정보뿐 아니라, 해당 기업이 웹 생태계에서 어떤 역할을 수행하는지 파악할 수 있습니다. 이 데이터는 웹 사이트 구축, 운영, 유지보수, 커스터마이징 등 웹 기반 기술과 서비스를 제공하는 기업의 분포 및 특성을 이해하는 데 유용합니다. 또한 웹 관련 산업 동향 파악, 기업 간 비교, 발주 참고자료로도 활용될 수 있으며, 국내 웹 개발 시장의 구조와 역량 수준을 간접적으로 보여주는 기초 통계 자료로 기능합니다. 본 자료는 2024년 12월 1일 기준으로 조사된 최신 정보를 반영하고 있습니다.※ 24년 12월 1일 기준
