summary_user: 충청남도에 등록한 정보통신공사업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록번호·상호·대표자·전화번호·우편번호·주소를 담는다(포털 CSV 약 46.8KB). 사업자나 발주 담당자가 "우리 시군에 등록된 정보통신공사업체는 어디이고 연락처는 무엇인가"를 확인하거나, 분석가가 도내 업체 분포를 지역별로 집계하는 데 쓴다. 전역 조인 키는 없어서 주소(시군·우편번호)를 기준으로 지역 데이터와 맞추거나 상호·등록번호로 이름 매칭해 다른 사업자 데이터와 이어 쓴다.
limits: 사업자등록번호나 표준 기관코드 같은 전역 조인 키가 실측 컬럼에 없어, 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 충청남도 한 곳이며, 시공 실적·매출·기술인력 같은 산업 규모 정보는 필드에 없다.
