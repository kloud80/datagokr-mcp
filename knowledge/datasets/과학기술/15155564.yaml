description_portal: '□ 개요본 데이터셋은 국립과천과학관 사이버전시관에 게시된 전시물에 대한 세부 정보를 체계적으로 정리한 자료입니다. 온라인상에서 전시물 현황을 파악하고 관리하기 위해 구축되었으며, 주된 활용 목적은 다음과 같습니다. 첫째, 전시물명, 위치(관정보), 관련 미디어(사진, 동영상) 파일명 등을 통해 사이버전시관 내 전시물 구성을 한눈에 파악할 수 있습니다. 둘째, VR 콘텐츠 및 온라인 전시관 유지·보수 및 관리를 위한 기초 자료로 활용됩니다. 셋째, 전시물 정보를 활용한 교육용 콘텐츠 개발이나 메타버스 서비스 기획 등 다양한 분야에서 참고 자료로 활용 가능합니다.□ 데이터 구조· 등록_번호 : 전시물 고유 식별 번호 (Integer)· 전시물명 : 전시물의 공식 명칭 (String)· 관정보 : 전시물이 위치한 관 또는 장소 정보 (String, 예: indoor)· 각도 : VR 상에서의 전시물 시야각 또는 배치 각도 (Float)· 동영상명 : 전시물 관련 동영상 파일명 (String, 해당 시)· 사진01 ~ 사진04 : 전시물 관련 이미지 파일명 (String)'
