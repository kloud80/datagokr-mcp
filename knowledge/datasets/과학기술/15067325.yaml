description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 지역본부에서 접수·안내된 교통정보 방송실적을 정리한 자료이다. 지방본부별 시간대별 접수 현황을 제공하여 어느 시간대에 방송 안내가 집중되는지 정량비교가 가능하다. 항목은 지역본부명, 기준일자, 시간구간, 접수건수, 방송건수이며, 본 자료는 혼잡 피크 분석, 편성 개선 검토, 통신원·제보 채널 운영 점검 등 의사결정을 지원한다. 또한 지역 간 활동 규모를 파악하게 하여 이용자가 지역 선택, 시간대별 정보 탐색, 서비스 수준 비교에 활용한다.
