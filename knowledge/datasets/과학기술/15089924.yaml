description_portal: '본 데이터는 스마트쉼센터에서 운영하는 전문상담사 대상 교육과정의 계획 및 운영 일정을 정리한 자료입니다. 교육별 접수 일정, 운영 기간, 정원, 주관 장소 등의 항목을 포함하며, 상담사 양성과 역량 강화를 위한 정기 교육의 계획 수립 및 관리에 활용됩니다.데이터는 다음과 같은 항목으로 구성됩니다:교육코드 : 각 교육과정을 고유하게 식별할 수 있는 코드 값교육계획명  : 교육과정의 명칭 (예: 스마트폰 과의존 예방상담 기초과정 등)접수시작일 : 교육 신청 접수가 시작되는 날짜접수종료일 : 교육 신청 접수가 마감되는 날짜교육시작일 : 실제 교육이 시작되는 날짜교육종료일 : 실제 교육이 종료되는 날짜교육정원 : 해당 교육과정에 등록 가능한 최대 인원 수교육주관장소코드 : 교육을 주관하는 장소 또는 센터의 고유 코드 (지역별 구분 등)데이터기준일 : 해당 데이터가 기준이 되는 날짜 (예: 시스템 수집일 또는 공시일 기준)이 데이터는 교육 운영 계획 수립, 수강신청 시스템 연동, 교육 실적 분석 등 행정 및 정책적 목적 외에도, 교육 참가자에게 일정을 안내하거나 교육 효과를 분석하는 데 활용될 수 있습니다.'
