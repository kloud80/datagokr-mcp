summary_user: BK21 플러스 사업에 접수된 사업단을 한 건씩 담은 파일 데이터로, 사업단·사업분야·지원분야·참여기관과 지역, 수도권·국공립 여부, 사업년도를 함께 담는다(CSV 약 490KB, 전국 범위). 연구정책 분석가가 "BK21 플러스 사업단이 수도권과 지방, 국공립과 사립 대학 사이에 분야별로 어떻게 분포하는가"를 따질 때 쓴다. 사업단ID·사업분야코드·기관코드가 조인 키로 확인되어, 같은 코드를 쓰는 BK21 선정·평가 자료나 기관 목록과 이어 쓴다.
description_portal: BK21 플러스 사업의 접수 정보를 체계적으로 정리한 데이터로, 관리번호, 사업단ID, 사업단명, 사업분야코드, 지원분야, 기관코드, 전국지역단위, 수도권여부, 국공립여부, 사업년도, 등록일자 등 다양한 항목을 포함한다. 대학원 및 연구기관의 사업 참여 현황, 지역별·유형별 분포, 지원 분야별 특성 등을 분석하는 데 활용할 수 있다. 사업 접수 현황을 파악하여 정책 방향 설정, 연구인력 양성 전략 수립, 사업 평가 등에 유용한 데이터 입니다. 본 데이터는 2018년 01월 29일에 생산한 데이터로 활용에 참고하시기 바랍니다.
