summary_user: 국립전파연구원이 방송통신기자재 적합성 시험을 위해 지정한 시험기관을 기관 한 곳당 한 행으로 담은 전국 단위 원장 파일로, 지정번호·시험기관명·지정분야·기관주소·홈페이지 주소를 담는다. 전자파적합성(EMC)·무선 성능·인체전자파 흡수율(SAR) 시험을 맡길 곳을 찾는 제조·수입 사업자가 '이 분야 시험을 받을 수 있는 지정기관이 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 기관주소(주소 정규화 후)나 시험기관명으로 다른 기업·상권 데이터와 맞춰 이어 쓴다.
description_portal: '국립전파연구원이 지정하고 관리하고 있는 지정시험기관에 대한 지정정보를 확인할 수 있습니다.방송통신기자재의 적합성을 확인하기 위해 과학기술정보통신부 국립전파연구원은 지정시험기관 제도를 운영 중이다. EMC(전자파적합성), 무선 성능, SAR(인체전자파 흡수율) 시험 등을 수행하며, 미국·캐나다·베트남 등 해외 인증도 지원해 국내 기업의 수출을 돕는다. 삼성전자, 한국산업기술시험원, 한국기계전기전자시험연구원 등이 주요 기관으로 지정돼 있으며, 전국 각지에서 시험 서비스를 제공하고 있다.(보유 컬럼 : 지정번호, 시험기관명, 지정분야, 기관주소, URL 주소)'
