summary_user: 한국인터넷진흥원 전자문서유통허브에 등록된 전자문서 발송·확인, 본인확인, 금융·통신 플랫폼의 목록이다. 플랫폼 한 건마다 플랫폼ID, 등록일시, 플랫폼명, 사업자번호, 사업자명, 상태를 담으며, 파일 크기는 약 1.4KB의 작은 목록이다. 사업자나 분석가가 어떤 기업이 전자문서유통 플랫폼으로 등록돼 전자문서를 보내고 받는지 확인하는 데 쓴다. 사업자번호(bizno)를 키로 사업자등록 상태나 기업 정보 데이터와 이어 쓴다.
description_portal: 본 자료는 한국인터넷진흥원(KISA) 전자문서유통허브에서 제공하는 다양한 전자문서·본인확인·금융·통신 플랫폼의 플랫폼 ID, 등록일, 플랫폼명, 사업자번호, 사업자명을 정리한 목록이다. 2021년부터 2025년까지 등록된 서비스들이 포함되며, 카카오·네이버·토스·국민은행·카카오뱅크·SKT·KT·LG유플러스 등 주요 ICT·금융기관이 다수 참여하고 있다. 각 플랫폼은 고유한 플랫폼ID 체계를 사용하며, 전자문서 발송·확인, 모바일 인증, 금융 앱, 우정사업본부·KISA 등 공공기관 서비스까지 폭넓게 구성되어 있다. 또한 사업자번호와 공식 법인명까지 명시되어 있어 사업자 식별 및 관리 용도로 활용될 수 있다. 전반적으로 국내 주요 민간·공공 서비스 제공자가 참여하는 전자문서·인증 생태계의 현황을 보여주는 데이터이
