description_portal: 광주광역시 광산소방서 부서별 운용중인 무선 통신 장비 현황입니다. 부서별 휴대용무전기, 차량용 무전기의 보유 현황(수량)을 제공합니다.제8조(분류) ① 소방청장은 소방장비를 효율적이고 적정하게 관리하기 위하여 소방장비를 용도 및 기능 등에 따라 분류하여야 한다.  ② 소방장비의 분류에 관하여 필요한 사항은 대통령령으로 정한다.제9조(소방장비의 목록화) ① 소방기관의 장은 그 기관이 보유하고 있거나 취득하려는 소방장비가 「물품목록정보의 관리 및 이용에 관한 법률」 제2조제2호에 따른 물품목록에 포함되어 있지 아니한 경우에는 그 물품을 목록화하는 데 필요한 자료를 행정안전부령으로 정하는 바에 따라 조달청장에게 통보하여 목록화를 요청하여야 한다.  ② 소방기관의 장은 제1항의 요청에 따라 소방장비의 목록화가 완료되었을 때에는 그 결과를 소방청장에게 알려야 한다.제10조(소방장비의 표준화) ① 소방장비의 표준이 되는 규격은 「산업표준화법」에 따른 한국산업표준이 제정되어 있거나 소방청장이 지정하는 국내외 관련 기관 또는 단체에서 정한 표준이 있는 경우에는 그 표준에 따른다. 다만, 소방기관에서만 사용하거나 소방업무의 효율적인 수행을 위하여 특수한 성능이 요구되는 소방장비가 기본적으로 갖추어야 하는 규격(이하 “기본규격”이라 한다)은 소방청장이 정한다. <개정 2022. 11. 15.>  ② 제1항 단서에 따라 기본규격을 정하여야 하는 소방장비의 종류는 소방청장이 정하여 고시한다. <개정 2022. 11. 15.>  ③ 소방청장은 기본규격을 제정ㆍ개정하거나 폐지한 경우에는 지체 없이 그 규격서를 조달청장에게 제출하여야 하고, 시ㆍ도지사에게 알려야 한다. <개정 2022. 11. 15.>  ④ 소방청장은 소방장비의 규격에 관한 전문성과 효율성을 고려하여 기본규격의 제정 등에 관한 사항을 대행하는 기관을 지정할 수 있다. 이 경우 소방청장은 기본규격의 제정 등에 필요한 비용을 지원할 수 있다. <개정 2022. 11. 15.>
