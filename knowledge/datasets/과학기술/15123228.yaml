summary_user: 자율주행 셔틀 제로셔틀에 장착된 라이다 센서 수집 데이터의 메타 정보로, 각 행에 수집 시간, 채널, 센서 위치, 포인트클라우드(.pcd) 파일명·경로, 어노테이션(.json) 파일명·경로를 담는다. 자율주행 연구개발기관이나 인공지능 모델 개발자가 "객체 인식·정지 장애물 탐지 학습에 쓸 라벨링된 라이다 원본을 어디서 내려받나"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시간정보·파일명 같은 이름 매칭이나 같은 기관(경기도) 자료로만 연결한다.
description_portal: 이 데이터는 자율주행 셔틀인 제로셔틀에 장착된 라이다 센서에서 수집된 3D 공간 정보를 포함하는 센서 데이터에 대한 메타 정보를 제공합니다. 각 행은 수집된 라이다 센서의 시간정보, 채널정보, 센서 위치, 라이다 포인트클라우드(.pcd) 파일명과 해당 경로, 라벨링 작업이 적용된 어노테이션(.json) 파일명 및 그 경로로 구성되어 있습니다. 해당 데이터는 자율주행차량의 객체 인식, 주행 경로 판단, 정지 장애물 탐지 등의 인공지능 학습 및 시뮬레이션 테스트에 활용될 수 있으며, 각 파일의 링크가 포함되어 있어 실시간 다운로드 및 활용이 가능하도록 구성되어 있습니다. 자율주행 연구개발기관, 인공지능 학습모델 개발자 등이 활용할 수 있는 고정밀 라이다 기반 자료입니다.* 데이터 크기문제로 전체 데이터는 FILE 탭을 활용해주시기 바랍니다.
