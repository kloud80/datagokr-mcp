description_portal: 한국연구재단이 보유한 연구사업통합지원시스템(e-R&D)에서 관리하는 2023년 연구분야별 선정과제 현황을 제공하는 데이터 목록입니다. 과학기술표준명, 중심분야코드, 선정횟수 등의 주요 정보가 포함되어 있습니다. 이를 통해 각 연구분야의 지원 현황과 선정 빈도를 파악할 수 있습니다. 또한 연구기획, 정책 수립, 연구자 지원, 분야별 연구역량 분석 등에 활용 가능합니다. 연구사업의 효율적 운영과 분야별 연구성과 관리, 연구자 네트워크 분석 등에 기초 자료로 제공될 수 있습니다. 수정일자를 기준으로 최신 연구 동향을 반영합니다.
