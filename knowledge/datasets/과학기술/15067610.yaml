description_portal: 본 데이터는 한국도로교통공단이 운영하는 TBN 한국교통방송의 교통통신원 구성 현황을 수치로 제시한 통계이다. 지역방송본부 단위로 활동 인원을 집계하며, 항목은 본부명, 집계기준일, 통신원 총원 등으로 구성된다. 통신원은 도로 상황, 사고·정체, 공사, 기상 등 실시간 교통정보를 제보하는 자원봉사자로서 FM·DMB·앱 기반 방송의 핵심 정보원이다. 이용자는 권역별 인력 규모를 비교해 제보망 커버리지, 지역 편차, 인력 운영 수요를 파악할 수 있다. 경찰청 등 유관기관과의 협조 체계에서 접수·검증된 정보가 방송에 반영됨을 고려하여, 분석 시 지역본부 편성과 제보 채널 특성을 함께 참고하는 것이 타당하다.
