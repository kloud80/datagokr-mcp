description_portal: 한국핵융합에너지연구원은 미래 에너지원으로 세계가 주목하고 있는 핵융합에너지 개발을 선도하는 국내 유일의 핵융합 전문 연구기관입니다. 초전도핵융합연구장치인 KSTAR(케이스타)의 개발과 운영을 통해 세계적인 연구성과를 달성하고 있으며, 핵융합 상용화를 위한 핵심 기술 개발과 우수한 핵융합인력 양성에 힘쓰고 있습니다. 또한 세계 주요 선진 7개국이 공동으로 수행하고 있는 국제핵융합실험로(ITER_이터) 공동개발사업에 주도적으로 참여하여 21세기 중반 핵융합에너지 시대를 열기 위한 인류 공동의 노력의 중심에 있습니다. 향후 핵융합실증로 건설을 위한 요소기술 개발로 핵융합에너지 시대를 준비하고 있습니다.
