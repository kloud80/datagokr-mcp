description_portal: '- 전라남도 QR코드관리시스템(페이지 URL을 연결한 QR코드를 임의로 생성하여 등록 관리하는 시스템) 및  연결 에 등록된 QR코드 목록입니다.- 전라남도는 공공기관의 QR코드 관리와 활용을 효율적으로 지원하기 위해 QR코드 관리시스템을 구축하여 운영하고 있습니다. 이 시스템은 도내 공공기관이 웹페이지 URL을 연결한 QR코드를 생성하고 등록하여 관리할 수 있도록 돕습니다.- 목적 : 공공기관의 다양한 정보와 서비스를 QR코드를 통해 손쉽게 제공하고, 관리 효율성을 높이기 위함입니다.- 기능 : 웹페이지 URL을 연결한 QR코드 생성 및 등록, 등록된 QR코드의 목록 관리, QR코드와 연결된 페이지의 정보화 관리'
