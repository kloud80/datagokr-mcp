summary_user: 2023년 1월부터 12월까지 우체국 택배가 도착한 전국 배달지 우편번호마다 월별 택배물량을 집계한 파일로, 한 행이 우편번호 하나에 열두 달 물량이 열로 붙는 형태입니다. 분석가나 물류 사업자가 '어느 우편번호 구역에 택배 도착이 몰리고 어느 달에 늘어나는가'를 보고 배송 인력·거점 배치나 지역 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 우편번호(기초구역) 값을 따로 구한 주소·행정구역 매핑표와 맞춰야 시군구 단위 통계나 다른 지역 데이터와 이어 쓸 수 있습니다.
limits: 우체국 택배 배달지 기준 물량만 담아 민간 택배사 물량이나 발송지 정보는 알 수 없고, 우편번호 외 행정구역 코드가 없어 다른 데이터와 바로 조인되지 않습니다. 포털 설명상 2023년 한 해만 담고 있어 연도 간 추세 비교에는 다른 연도 파일이 필요합니다.
