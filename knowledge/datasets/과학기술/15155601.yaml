description_portal: '□ 개요본 데이터셋은 국립과천과학관 과학기술자료실에 보유 중인 연속간행물(저널, 잡지 등)의 접수 관리 정보를 정리한 자료입니다. 연도별 간행물 접수 현황과 등록 정보를 포함하고 있어, 연속간행물의 입수 이력을 확인하는 데 활용될 수 있습니다. 주된 활용 목적은 다음과 같습니다. 첫째, 연도별 간행물 접수 기록을 통해 정기 간행물의 입수 시기와 수량을 파악할 수 있습니다. 둘째, 접수 번호와 생성일 정보를 바탕으로 자료실의 행정 처리 현황을 점검하고 입수 업무의 효율성을 높이는 데 활용 가능합니다. 셋째, 연속간행물의 지속적인 관리 및 장서 확충 계획 수립을 위한 기초 통계 자료로 활용됩니다.□ 데이터 구조본 데이터셋의 실제 컬럼 구조는 다음과 같습니다. (요청하신 양식의 일부 컬럼이 데이터 파일에 존재하지 않아, 실제 파일의 컬럼 정보로 대체하여 작성하였습니다.)· 레코드키 : 간행물 관리를 위한 고유 식별 번호 (Integer, 예: 70002640)· 간행물명 : 연속간행물의 이름 (저널, 잡지 등) (String, 예: Newton)· 호수 : 해당 간행물의 권호 정보 (String, 예: 2008년 1월호)· 접수번호생성일 : 접수 번호가 시스템에 생성된 날짜 (String, YYYY-MM-DD, 예: 2008-02-01)'
