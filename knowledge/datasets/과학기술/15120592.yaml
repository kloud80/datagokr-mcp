description_portal: 데이터는 한국지능정보사회진흥원(NIA)이 제공하는 ‘전자정부지원사업 추진현황’ 자료로, 연도별로 수행된 전자정부지원사업의 주요 정보를 체계적으로 정리한 데이터입니다. 각각의 사업은 연도, 사업명, 주관기관, 사업수행업체(사업자), 그리고 투입된 예산 총액(총사업비)으로 구성되어 있어 전자정부 및 디지털 정부 구현을 위한 사업 추진 현황을 한눈에 파악할 수 있습니다. 이 자료는 정부 부처 및 공공기관의 디지털 인프라 구축 현황을 분석하고, 예산 규모 및 기관별 추진 실태를 비교하는 데 유용합니다. 또한 시계열 분석을 통해 전자정부지원사업의 성장 추세 및 정책 전환점을 분석하거나, 성과 평가 기반 구축을 위한 기초 데이터로 활용될 수 있습니다. 예컨대, 사업비 대비 성과 비교, 주관기관별 사업 집중도, 연도별 예산 분포 변화를 시각적으로 분석할 때 유용한 기반 자료가 됩니다.
