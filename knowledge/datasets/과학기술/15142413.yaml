summary_user: 전국 우체국을 한 건씩 담은 원천 목록으로, 지방청·총괄국·관내 우체국명과 주소·우편번호·전화번호·구분코드를 우체국 단위로 제공한다. 국민이 가까운 우체국의 주소와 연락처를 찾거나, 분석가가 지방청·총괄국별로 우체국이 어떻게 분포하는지 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 우체국명·주소·우편번호(pstofcZip) 같은 이름·코드 매핑으로만 잇는다.
limits: 표준 기관코드나 행정구역코드 같은 공통 키가 없어 다른 데이터와 붙이려면 이름이나 주소를 직접 맞춰야 한다. 우정 부문에서 우편번호·배달·주소 외 데이터를 제외하기로 한 검토 결정에 따라 이 데이터셋은 제외 대상으로 분류돼 있다. 개발계정 호출 한도는 하루 10,000회다.
