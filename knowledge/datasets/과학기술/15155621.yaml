description_portal: '□ 개요본 데이터셋은 국립과천과학관 포털 시스템 및 사이버전시관에 등록된 전시물의 콘텐츠 정보를 체계적으로 정리한 자료입니다. 전시물의 국문·영문 명칭과 상세 설명(비고), 대표 전시물 여부 등을 포함하고 있으며, 주된 활용 목적은 다음과 같습니다. 첫째, 온·오프라인 관람객에게 전시물에 대한 깊이 있는 해설 정보를 다국어(한/영)로 제공하는 데 활용됩니다. 둘째, 전시물의 특징과 원리를 설명하는 텍스트 데이터를 분석하여 전시 해설 프로그램이나 교육 자료 제작의 기초 자료로 활용할 수 있습니다. 셋째, 주요 전시물(대표전시)을 식별하여 사이버전시관의 추천 코스나 하이라이트 전시를 기획하는 데 참고 자료가 됩니다.□ 데이터 구조· 한글전시물이름 : 전시물의 공식 국문 명칭 (String)· 영문전시물이름 : 전시물의 공식 영문 명칭 (String)· 한글비고 : 전시물의 과학적 원리나 특징에 대한 국문 상세 설명 (String)· 영문비고 : 전시물의 과학적 원리나 특징에 대한 영문 상세 설명 (String)· 대표전시여부 : 해당 전시물이 주요 대표 전시물인지 여부를 나타내는 플래그 (Integer, 0 또는 1)'
