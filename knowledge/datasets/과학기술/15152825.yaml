description_portal: 한국남동발전에서 제공하는  ICT종합관리시스템의 사용자 만족도 정보입니다.서비스 구분의 경우 사용자가 서비스를 받은 분야 또는 종류를 나타내며 ICT장비, 시스템 변경, 정비신청, 기기대여 등 다양한 범주를 제공합니다.만족도의 경우 해당 서비스에 대한 사용자의 평가 점수를 의미합니다. 점수 척도는 매우만족, 만족, 보통, 불만족, 매우불만족 5개 입니다.요청일의 경우 서비스 관련 문의글을 등록한 일자이며 관리자가 처리할 때 참고 하여 신청일로 부터 +5일 이내 처리하고 있습니다.고객들이 어떤 부분에서의 서비스가 개선되어야 할지 파악하고 이를 통해 서비스의 질을 향상시키는 목적으로 활용 가능합니다. 또한 특정 기간 동안 수집된 데이터를 분석함으로써 트렌드 및 패턴 발견에도 도움이 될 수 있습니다. 이러한 분석을 토대로 나은 의사결정을 내릴 수도 있습니다.
