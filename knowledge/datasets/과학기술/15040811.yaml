description_portal: '"연구보고서 현황"은 한국가스공사에서 수행한 연구과제의 보고서 현황을 체계적으로 정리한 데이터 입니다. 가스공사의 연구개발 이력 관리 및 유사 연구과제 중복 방지, 연구성과 추적, 지식자산 축적 등을 목적으로 수집되었습니다.데이터 구성항목은 발행연월, 국문과제명, 영문과제명, 연구책임자, 연구 시작일 및 종료일 등의 속성 정보로 이루어져 있어 각 연구과제의 기본 정보를 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 연구과제별 수행기간 분석, 연구책임자별 과제 수행 현황 파악, 연구분야별 투자 동향 분석, 연구과제 완료율 산정 등이 가능합니다. 또한 신규 연구과제 기획 시 기존 연구현황을 참고하여 중복투자를 방지하고 연구의 연속성을 확보할 수 있습니다. 연구성과물의 체계적 관리를 통해 기관 차원의 지식자산 축적에 기여하며, 외부 연구협력 및 기술이전 검토 시에도 기초자료로 활용되어 운영 효율성과 연구 생산성 향상에 크게 기여합니다.'
