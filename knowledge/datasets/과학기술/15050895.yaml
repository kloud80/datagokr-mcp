description_portal: '농림수산식품교육문화정보원에서 제공하는 생물자원 균류 자원 정보는 다양한 균류 자원의 정보를 포괄하는 데이터입니다. 이 데이터는 버섯을 포함한 다양한 균류의 특징, 재배 방법 및 생태적 정보를 포함하고 있으며, 연구자와 농업 종사자들이 균류 연구 및 재배에 유용하게 활용할 수 있습니다. 예를 들어, 약용버섯이나 식용버섯에 대한 정확한 정보는 균류의 생산성 향상과 품질 개선에 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  - 카테고리(문자형) : 생물자원 > 균류자원의 세부 카테고리 정보  - 제목(문자형) : 특정 균류의 이름으로, 연구자들이 이를 통해 원하는 데이터에 접근할 수 있습니다.  - 요약글(문자형) : 균류의 명칭 및 기본 정보를 제공합니다.  - 서브제목1(문자형) : 추가 정보를 설명하는 서브 제목으로, 다양한 특정 정보를 담고 있습니다.  - 서브내용1(문자형) : 서브제목1에서 언급한 주제를 상세히 설명하는 내용이며, 균류의 특징 및 생태적 특성을 포함합니다.  이 정보는 공공의 이익을 위해 자유롭게 활용될 수 있으며, 균류 자원에 대한 연구와 교육의 기초 자료로도 활용될 수 있습니다.'
