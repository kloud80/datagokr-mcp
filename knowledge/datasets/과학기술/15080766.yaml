summary_user: 정보보호 최고책임자(CISO)를 지정해 과학기술정보통신부(중앙전파관리소)에 신고한 업체를 건별로 담은 원장으로, 상호명·사업자등록번호·신고일자로 구성되며 전국 28,153건(2014-12-05~2026-07-31)이다. 분석가나 정책 담당자가 특정 업체가 정보보호최고책임자 신고를 마쳤는지, 연도별로 신고 업체가 얼마나 늘었는지 확인하는 질문에 쓴다. 사업자등록번호(bizno)를 조인 키로 삼아 사업자 원장이나 기업 데이터와 이어 쓴다.
description_portal: 이 공공데이터는 정보통신망 이용촉진 및 정보보호 등에 관한 법률에 따라 과학기술정보통신부(중앙전파관리소)에 정보보호 최고책임자(CISO)를 지정하여 신고한 업체 현황입니다. 해당 공공데이터는 상호명, 사업자등록번호, 신고일자로 구성되어 있으며, 이를 통해 특정 시점에 정보보호최고책임자 신고를 완료한 업체를 파악할 수 있고, 전파관리 정책 수립이나 사업자 분석, 관련 업계의 시장 동향 파악, 정책 수립을 위한 기초자료로 활용할 수도 있으며, 공공 행정 및 연구에도 활용될 수 있습니다.
