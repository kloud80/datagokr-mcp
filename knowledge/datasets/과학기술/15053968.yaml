description_portal: 과학기술정보통신부에서 실시하는 이공계인력 실태조사 중 학위별, 성별, 기업규모별 이공계 인력 비중에 관한 통계 데이터입니다.(2009년) 기관을 대상으로 조사한 자료로, 이공계와 비이공계 인력의 분포 특성을 다각도로 비교 분석할 수 있는 종합적인 인력 현황 정보를 제공합니다. 데이터는 학위별(학사미만, 학사, 석사, 박사), 성별(남성, 여성), 기업규모별(대기업, 중소기업)로 세분화되어 있으며, 각 범주별로 이공계와 비이공계 인력의 비중을 백분율로 제시하고 있습니다. 이 데이터는 과학기술 인력정책 수립, 이공계 인력 양성 계획, 기업의 인력 채용 전략, 성별 균형 정책, 대기업과 중소기업 간 인력 분포 분석 등에 활용될 수 있습니다.
