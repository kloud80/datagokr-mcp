description_portal: 국도로교통공단이 운영하는 TBN 통합 제보접수 업무에서 사용하는 ‘지역 세부 식별자’ 참조표를 제공하는 데이터이다. 각 레코드는 방송권역, 상위지역 매핑, 세부구간 명칭, 내부 식별자, 사용여부, 유효상태 등으로 구성되며, 제보 위치의 표준화와 권역별 통계 집계, 외부 시스템 연계 시 일관된 지역 식별을 보장한다. CSV 형식으로 제공되며 헤더와 값 정의는 메타데이터에 수록되어 변환·검증에 적합하다. 활용기관은 접수화면 지역 선택 항목 구성, 자동 분류 규칙 설정, 지역단위 KPI 산출 등에 활용할 수 있다.위경도 값이 없는 데이터의 경우 좌표가 수집되지 않은 곳이다.
