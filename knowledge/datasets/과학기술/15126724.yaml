summary_user: 연구개발특구진흥재단이 사업화를 위해 공개한 기술을 한 건씩 담은 파일로, 기술마다 전략기술 분류·기술명·특허명·출원번호·등록번호·기술보유기관·키워드를 기록하며 범위는 전국이다. 기술이전이나 사업화할 기술을 찾는 기업·창업자가 특정 분야나 키워드로 공개된 특허 기술과 그 기술을 보유한 기관을 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 출원번호·등록번호나 기관명 같은 이름 매핑으로만 연결하며, 같은 세부 부문의 특구 입주기관·연구소기업·협약과제 목록과 함께 특구 단위 기업·기술 원장으로 쓴다.
