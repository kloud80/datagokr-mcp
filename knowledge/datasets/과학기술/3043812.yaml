description_portal: 본 데이터는 고정형 전자파 측정 결과를 제공합니다. 고정형 전자파는 일상생활에서 사용하고 있는 무선통신 전파에 대한 전자파 세기를 실시간 측정 및 확인 할 수 있는 측정시스템입니다. 태양열 전지판에 의해 충전되어 운영될 수 있도록 저전력 설계되어 AC 전원공급없이 상시 측정이 가능한 「광대역 전자파 모니터링 측정시스템」으로 ITU-T K.83(Monitoring of Electromagnetic Field Levels)의 광대역 측정방법 권고기준을 준용하여 구축·운영하고 있습니다. 해당 자료는 설비를 통해 측정된  전자파 측정결과를 측정 장소, 최근 측정일, RADIO, TV, 3G 등 분류별로 확인하실 수 있습니다. (측정기준 2025년) ※ 측정 결과의 자세한 위치정보 및 내용은 URL(https://emf.kca.kr/web/info/monitoring/fixed.do)을 통해 확인하실 수 있습니다.
