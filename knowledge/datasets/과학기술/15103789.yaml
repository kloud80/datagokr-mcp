summary_user: 인천광역시 관내 정보통신공사 현장의 감리원 배치신고를 신고 건별로 담은 원천 데이터로, 신고일자·발주자·신고인·공사업자·용역명·현장주소·공사 종류·총공사금액(천원)·공사기간·변경 전후 감리원 배치현황을 포함한다. 정보통신공사 업체나 발주 기관 담당자, 분석가가 "인천에서 특정 공사업자가 맡은 현장에 어떤 감리원이 배치됐고 공사 규모는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 현장주소를 주소 정제·좌표 변환해 지역 데이터와 붙이거나 공사업자·발주자 이름으로 정보통신공사업 사업자 원장과 이름 매칭해 연결한다.
limits: 사업자등록번호나 표준 코드가 없어 다른 데이터와는 이름·주소 매칭으로만 이을 수 있고, 동명 업체 구분에 주의가 필요하다. 범위는 인천광역시 한 곳의 신고분에 한정된다.
