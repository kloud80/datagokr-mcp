description_portal: 인천광역시 관내 정보통신공사 현장에 적합한 감리원(총 공사금액 기준)을 공사가 시작하기 이전에 배치하였음을 신고하는 제도로 적법한 배치 유도를 위하여 2019년 10월부터 시행된 정보통신공사업 감리원 배치신고 현황에 대한 데이터를 제공하고 있습니다. 이 데이터에는 신고일자, 발주자, 신고인, 공사업자, 용역명, 현장주소, 공사의 종류, 공사금액, 공사기간, 감리원 배치현황 등에 대한 항목정보를 제공합니다. 이를 통해 인천 지역 정보통신공사 현장에 배치된 감리원 현황과 정보를 확인할 수 있으며, 데이터는 연간 업데이트되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드 할 수 있으며,  CSV 형식으로 제공됩니다.
