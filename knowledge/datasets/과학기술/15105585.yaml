description_portal: 과학기술정보통신부, 정보통신산업진흥원, 벤처기업협회가 공동으로 실시한 ICT 중소기업 실태조사 결과 중 4차 산업혁명 관련 기술 활용 비율 데이터입니다. 국내 ICT 중소기업들이 4차 산업혁명 핵심 기술을 얼마나 도입하고 활용하고 있는지를 종합적으로 분석한 통계자료로, 디지털 전환 정책 수립의 중요한 기초자료가 됩니다. 데이터는 인공지능, 가상·증강현실, 모바일, 블록체인, 클라우드, 빅데이터, 사물인터넷(IoT), 3D프린팅, 로봇공학 등 10개 핵심 기술에 대한 활용 비율을 제공하며, 업종별(정보통신방송서비스, 정보통신방송기기, 소프트웨어 및 14개 세부업종), 매출액 규모별(1억 미만부터 100억 이상까지 6개 구간), 종사자 규모별(1-9명부터 300명 이상까지 6개 구간), 권역별(전국 6개 권역)로 세분화된 분석 결과를 포함하고 있습니다. 이 데이터는 ICT 중소기업의 디지털 전환 현황 파악, 4차 산업혁명 기술 도입 정책 수립, 지역별·규모별 맞춤형 지원 전략 개발, 산업별 기술 트렌드 분석 등에 활용될 수 있으며, 국내 ICT 산업의 기술 혁신 수준을 진단하는 핵심 지표로 활용됩니다.
