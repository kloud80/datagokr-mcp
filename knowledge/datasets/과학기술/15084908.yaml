summary_user: KCI(한국학술지인용색인) 시스템에 등록된 논문별 원문의 PDF 변환 작업 이력을 건별로 담으며, 논문ID(ARTIID)·원문파일ID·학술지ID·등록일·원문상태·변환대상구분·생성여부·오류코드와 메시지·작업일로 구성된다. 연구자나 서비스 운영·분석가가 특정 국내 논문의 원문 PDF가 생성됐는지, 변환 중 오류가 있었는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 KCI 논문·학술지 서비스와는 논문ID·학술지ID 같은 기관 내부 식별자로만 연결한다.
description_portal: KCI PDF 변환 조회 서비스는 국내 학술지 정보, 논문 정보 및 참고 문헌을 데이터베이스화하여 각 서지 정보, 인용 정보, 통계 자료, 논문 간 인용관계 분석 정보 등을 제공하는 한국학술지인용색인 (KCI) 시스템의 논문별 PDF 변환 관련 이력 데이터에 대한 상세정보를 조회할 수 있는 서비스입니다. 제공하는 데이터는 논문ID, 원문ID, 학술지ID, 등록일, 원문상태, 변환대상구분, 생성여부, 작업일 등으로 구성되어 있으며, 다양한 논문과 자료의 PDF 변환 이력에 대한 상세정보를 제공합니다.
