description_portal: '○ 통계개요* 통계명 : 인터넷 이용빈도 및 이용시간* 통계종류 : 지정통계, 승인번호(12005)* 근거법령 : 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제52조* 작성목적 : 급속히 변화하는 국내가구의 인터넷 이용환경 및 국민의 인터넷 이용현황과이용행태 등을 파악하여 관련 정책수립과 연구활동 등 다양한 영역에서 활용할 수 있도록 기초자료 및 정보 제공을 목적으로 함* 조사체계 : 조사원→전담조사기관→한국인터넷진흥원→미래창조과학부* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 인터넷 이용빈도율과 주 평균 인터넷 이용시간 비율○ 용어설명* 인터넷(무선인터넷 포함)이용은 용도(개인용, 업무용, 학업용 등)나 장소(가정, 학교,직장 등)에 관계없이 전체 인터넷 이용을 의미하며, 이동전화, 스마트폰, 스마트패드,IPTV, 인터넷전화 등을 이용한 인터넷접속을 모두 포함함○ 기타* 문 : 인터넷 평균 이용빈도와 이용시간은 얼마나 되십니까?○ 출 처 : 미래창조과학부, 한국인터넷진흥원 「인터넷이용실태조사」'
