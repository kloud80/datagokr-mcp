summary_user: 한국디자인분류의 분류코드와 그에 속하는 물품명, 분류 상세내용을 한 행씩 담은 코드표 파일로, 포털 설명 기준 총 5,006행이며 범위는 전국·비공간이다. 디자인 출원을 준비하는 사업자나 디자인권 동향을 보는 분석가가 '내 제품은 어느 디자인분류에 속하나', '이 분류코드는 어떤 물품을 뜻하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 디자인 출원·등록 데이터의 분류코드나 물품명과 이름·코드 매핑으로 이어 쓴다.
limits: 이 파일은 분류 체계(코드·물품명·설명)만 담고 개별 출원·등록 건이나 출원인 정보는 없어 단독으로 디자인 동향을 분석할 수 없다. 전역 조인 키가 없어 다른 데이터와는 분류코드·물품명 문자열 매칭으로만 연결된다.
