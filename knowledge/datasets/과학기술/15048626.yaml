description_portal: 광주광역시 광산소방서 청사방호cctv운영현황에 대한 내용으로 연번,부서명,설치목적,설치대수,설치위치 등의 내용을 담고 있습니다.        제4장  시설관리제41조(건축, 기계, 전기 및 청소) ① 국가인재원 및 고시센터의 시설관리는 시설관리 전문업체의 용역계약에 의한다.  ② 시설관리의 업무에 관하여는 별도 청사관리 도급역무시방서에 따른다.  ③ 시설관리에 필요한 각종 기록사항은 별도 승인양식에 의거 각 분야별로 작성 제출토록 한다.  ④ 각 분야별 담당자는 용역업체의 업무에 대하여 수시로 지도·감독한다.  ⑤ 냉·난방에 대하여는 에너지이용합리화법에 의하며 필요한 경우 교육지원과장의 승인을 얻어 조치한다.제42조(통신) 통신실 담당자는 통신망과 통신기기 및 통신회선, 통신보안 등 통신시설물 전반에 대하여 수시로 점검을 실시하여 사고를 미연에 방지하고 고장이 발견되거나 신고가 있는 경우에는 신속히 수리 조치한다.제43조(운용) 모든 시설의 운용은 담당자 또는 시설관리용역업체의 관련 기술 분야 종사자만이 관리하여야 한다. 단, 긴급을 요할시는 응급조치를 신속히 취하고 담당부서에 신고하여야 한다.제44조(위험표시) 수전실 기타 고압전기공작물이 설치된 장소로 위험하다고 인정되는 곳은 사람의 주의를 상기시킬 수 있도록 위험표지를 하여야 한다.
