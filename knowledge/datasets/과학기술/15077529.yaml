description_portal: '- 한국방송광고진흥공사가 1981년도부터 제작한 방송 공익광고 목록을 제공합니다.- 개방 데이터는 방송 공익광고에 대한 제작 연도, 고유번호, 작품명, 대분류, 소분류, 영상 링크, 핵심 키워드 정보를 제공합니다.*키워드 정보는 2020년부터 제공됩니다- 학계 및 연구기관, 공익광고 제작을 고려하는 기관 및 기업에서는 공익광고 주요 주제를 확인하고 연도별 공익광고 주제 키워드 변화를 분석하기 위한 기초 자료로 활용할 수 있습니다. 또한,  제작 현황을 바탕으로 제작 기획 단계에서 내용 및 컨셉, 이미지가 중복되는 사항을 사전에 확인할 수 있습니다.'
