description_portal: 본 데이터는 한국가스공사에서 정보보안 강화를 위해 차단 조치한 상용메일 사이트 내역을 공개하는 사이버보안 관리 자료입니다. 스팸메일, 피싱메일, 악성코드 배포, 랜섬웨어 감염 시도 등 각종 사이버공격 의심 메일을 사전에 차단하여 공사의 정보보안 수준을 높이기 위한 보안 조치 내역입니다. 데이터 항목으로는 차단일자, 차단근거 및 사유, 차단대상 사이트 URL, 차단방식, 위협 카테고리 등이 포함됩니다. 이 데이터를 통해 다른 공공기관 및 기업에서 유사한 사이버보안 위협에 대응하기 위한 참고자료로 활용할 수 있습니다. 또한 기관별 정보보안 정책 수립 및 개선 시 벤치마킹 자료로 활용되며, 사이버보안 위협 동향 분석, 보안 교육자료 개발, 침해사고 예방 활동에도 기여할 수 있습니다.
