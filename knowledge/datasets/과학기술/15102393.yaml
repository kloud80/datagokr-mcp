description_portal: 2022.01 현재, 한국가스공사의 전국적인 가스배관 5,027 km를 통해 전국적으로 가스를 공급하는데 가스배관의 1.5 m 이상 매설심도에서의 천연가스 온도에 대한 주요 도시의 일별 온도데이터를 제공합니다(2010년~2021년).본 데이터는 배관 운영 최적화 및 안전 관리를 위해 수집 관리되고 있습니다. 데이터의 세부항목으로 일자, 강원지역본부, 경기지역본부, 광주전남지역본부, 대구경북지역본부, 부산경남지역본부 등의 정보를 제공하고 있습니다.본 데이터를 활용하면 지역별 지중온도 변화 패턴 분석, 온도 변화에 따른 가스 물성 및 압력 영향 연구, 계량 보정 기준 마련, 배관 안전성 평가에 기초자료로 활용할 수 있어 가스 공급망 운영 효율화와 안전 관리 고도화에 기여할 것으로 기대됩니다.
