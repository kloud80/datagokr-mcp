description_portal: 본 데이터는 한국방송통신전파진흥원에서 관리하는 기금사업관리시스템(PMS)의 전담기관의 과제 현황정보 입니다. 2021년부터 2023년까지의 기금사업별 정보가 수록되어 있으며, 각 사업의 과제코드, 과제명, 전담기관, 사업비, 사업기간의 항목으로 구성됩니다. 본 자료는 정보통신·방송 분야의 연구개발, 산업진흥, 인력양성, 기반조성 등 여러 ICT 사업을 맡고있는 다양한 기관(한국방송통신전파진흥원, 한국인터넷진흥원, 한국전파진흥협회, 한국과학창의재단 등)의  사업추진현황을 종합적으로 확인할 수 있도록 작성되었습니다. 이를 통해 연도별 기금 사업의 흐름과 주요 투자 분야를 파악할 수 있으며, 해당 자료는 공공기관 및 민간기업의 정책분석, 재정집행 모니터링, 사업성과 평가 등에 활용이 가능합니다. 데이터는 ICT기금의 투명한 집행과 효율적 관리체계 구축을 위한 기초정보로 제공됩니다.
