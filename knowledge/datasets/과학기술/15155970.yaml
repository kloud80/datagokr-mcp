summary_user: 한국인터넷진흥원 분쟁조정위원회(전자거래 분쟁조정)의 조정위원 명단을 위원 한 명당 한 행으로 담은 파일로, 성별·위치·전문 분야·등록일자 등이 들어 있으며 파일 크기는 약 8KB로 작다. 전자거래 분쟁조정을 신청하려는 국민이나 분쟁조정 제도를 연구하는 분석가가 '조정위원은 어떤 분야 전문가로 구성되어 있고 성별 구성은 어떤가'를 확인하는 데 쓴다. 다른 데이터셋과 이을 전역 조인 키는 없으며, 같은 기관의 분쟁조정 처리 데이터와는 위원회 일련번호나 이름 매핑으로만 연결을 시도할 수 있다.
description_portal: 본 자료는 한국인터넷진흥원(KISA) 분쟁조정위원회의 조정위원정보로 분쟁조정을 위한 교수·변호사·정부·공공위원회 전문가들로, 법률·소비자·개인정보·AI·미디어·과학수사·공정경제 등 다양한 분야에 걸쳐 있다. 이밖에 각 인사는 전문 분야의 공공정책·규제·분쟁 해결·학문 활동을 동시에 수행하는 고급 전문가 집단으로 구성되어 있으며, 개인정보, AI 법제, 소비자정책, 상사·민사법, 디지털 규제 등 정책·산업·학계를 연결하는 역할을 수행하고 있다. 주요 구성은 대학 교수진, 대형·중견 로펌 변호사, 정부 부처 및 위원회(금융위·방통위·공정위·권익위·소비자원 등) 자문위원 및 심의위원, 학회 임원, 기업 법무·대외협력 전문가, 분쟁·중재·조정 기구 위원 등이다.
