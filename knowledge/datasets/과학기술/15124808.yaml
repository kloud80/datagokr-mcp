summary_user: 광주 광산구 안의 건물별 도로명주소를 한 줄에 한 건물로 담은 원천 목록으로, 도로명·건물 본번/부번, 지번(산 여부·본번·부번), 건물명, 건물 용도, 우편번호·기초구역번호, 고시일자를 함께 싣는다(시군구 범위, CSV 약 6.6MB). 광산구 안의 특정 지번이 어느 도로명주소에 해당하는지, 어떤 건물이 무슨 용도인지 확인하려는 주민·부동산 실무자·행정 분석가가 쓴다. 전국 공통 조인 키(도로명코드·건물관리번호·법정동코드)는 컬럼에 없어서, 다른 데이터와는 읍면동·도로명·건물번호나 지번 문자열을 맞춰 붙이거나 우편번호·기초구역번호로 묶는 방식으로만 이어 쓴다.
limits: 광산구 한 곳만 다루므로 광주 다른 구나 전국 주소는 이 파일로 알 수 없다. 표준 코드 키가 없어서 다른 주소 데이터와 정확히 매칭하려면 주소 문자열을 정규화해야 한다.
