description_portal: KCI연계정보 서비스는 국내 학술논문의 KCI, WOS, SCOPUS, NDSL 등 주요 학술 데이터베이스 간의 연계 정보를 제공합니다. 이를 통해 논문별 인용 현황, 관련 문헌, 연계 날짜 등 다양한 정보를 확인할 수 있습니다. 논문 간 인용관계, 데이터베이스별 피인용 횟수, 원문 URL 등의 상세 정보를 포함하고 있어 연구성과 분석, 인용 통계, 학술정보 연계, 연구동향 파악 등에 활용도가 높습니다. 또한 연구자, 기관, 평가기관 등에서 논문 영향력 분석과 연구성과 관리에 유용하게 사용할 수 있습니다.
