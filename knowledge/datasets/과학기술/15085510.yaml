summary_user: 국내 학술논문 한 편마다 KCI 논문 ID(ARTIID)를 기준으로 WOS·SCOPUS·NDSL(NOS) 등 외부 학술 데이터베이스의 식별자, 피인용 횟수, 원문·인용 URL, 연계 날짜를 담은 논문 단위 연계 정보입니다. 연구자나 평가기관이 특정 KCI 논문이 WOS·SCOPUS에도 등재돼 있는지, 각 데이터베이스에서 몇 번 인용됐는지 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 KCI·ScienceON 데이터와는 KCI 논문 ID 같은 식별자를 이름·코드 매핑으로 맞춰 이어 써야 합니다.
limits: 다른 데이터셋과 바로 붙는 공통 조인 키가 확인되지 않아 연결은 식별자 매핑에 의존합니다. 개발계정은 하루 5,000회로 호출이 제한됩니다. 지역 구분 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못합니다.
