description_portal: '전국과학전람회 및 전국학생과학발명품경진대회 등 2023년 수상장 정보 자료입니다.이 공공데이터는 제69회 전국과학전람회를 비롯한 여러 회차의 수상작 약 970건을 수록하고 있으며, 대회명, 주제, 소속기관, 작품 제목, 지도교사, 수상자, 수상명 등으로 구성되어 있습니다. 이를 통해 과학 교육 현장의 우수 연구 사례를 확인하고, 수상 경향 분석, 교육 정책 수립, 창의적 학습 콘텐츠 개발 등에 활용할 수 있습니다. 교사와 학생들의 연구 성과를 한눈에 파악할 수 있는 유용한 자료입니다.- 제공목록 : 대회명, 행사년도, 주제, 소속명, 제목, 지도교사, 수상자, 수상명'
