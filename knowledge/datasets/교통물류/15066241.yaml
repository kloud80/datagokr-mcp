summary_user: 우체국별로 접수일자·접수시각마다 등기통상 우편물 접수 건수를 집계한 CSV 파일(약 6.4MB)로, 포털 설명상 2020년 8월 강남구 내 우체국 접수분을 담는다. 우정 행정·물류 분석가가 '강남구 우체국에서 등기 접수가 몰리는 요일과 시간대는 언제인가' 같은 혼잡 시간대와 인력 배치 질문에 쓴다. 전역 조인 키가 없어서 총괄우체국명·우체국명(국명)을 이름으로 맞춰 같은 기관의 우체국 위치·시설 자료와 잇는다.
limits: 건수 집계 자료라서 개별 우편물의 송장 단위 종적은 추적하지 못하고, 포털 설명상 2020년 8월 한 달 스냅샷이라 추세나 최근 상황 분석에는 맞지 않는다. 메타 범위는 전국으로 표기돼 있지만 설명은 강남구 우체국만 담는다고 하니 실제 범위를 확인해야 하고, 다른 자료와는 우체국 이름 매칭으로만 연결된다.
