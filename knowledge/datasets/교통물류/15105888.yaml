summary_user: 2025년 자동차검사 결과를 등록용도(사업용·비사업용)·차종·규모별로 나누어, 휘발유·경유·LPG·전기·CNG·LNG·하이브리드·수소전기·기타 연료별 검사 대수와 부적합률을 담은 전국 단위 집계표(CSV 약 3KB)다. 정책 담당자나 연구자가 '경유 화물차와 전기 승용차 중 어느 쪽 검사 부적합률이 더 높은가'처럼 연료·차종별 부적합 경향을 비교할 때 쓴다. 전역 조인 키는 없어서, 다른 차량 등록·검사 통계와는 용도·차종·규모 구분 이름을 맞춰 연결한다.
description_portal: 본 자료는 2025년 실시된 자동차검사 결과를 바탕으로 연료 종류, 차량 용도(사업용/비사업용), 차종, 규모 등 다양한 분류 기준에 따라 검사 대수와 부적합률을 체계적으로 분석하고 정리한 데이터이다. 이를 통해 각 항목별로 차량의 검사 현황과 부적합 경향을 파악할 수 있으며, 향후 자동차 안전관리 정책 수립, 검사제도 개선, 차량 성능 향상 등의 다양한 분야에 기초자료로 활용될 수 있도록 구성하였다. 정책 수립자 및 관련 기관은 물론, 연구자와 산업 관계자들에게도 유용한 정보를 제공하는 자료이다.
