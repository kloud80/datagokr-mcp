summary_user: 순천시 안의 가스(LPG) 충전소를 한 곳당 한 행으로 담은 작은 현황 파일(CSV, 약 2KB)로, 상호·사업소 주소·대표자·전화번호·허가일자·가스 종류·총저장능력(kg)을 담는다. LPG 차량 운전자가 순천시에서 가까운 충전소와 연락처를 찾거나, 분석가·재난 담당자가 시내 충전소의 분포와 저장능력 규모를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명이나 주소를 맞춰 붙이거나 같은 순천시 자료끼리 이어 쓴다.
