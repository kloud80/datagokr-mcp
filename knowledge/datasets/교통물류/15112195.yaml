summary_user: 서울 서초구에 설치된 전동킥보드 전용 주차구역을 한 곳씩 주소, 세부위치, 설치년월로 담은 건별 목록 파일이며, 범위는 서초구 한 개 시군구다. 서초구 주민이나 공유킥보드 운영사가 '이 근처에 킥보드를 세울 지정 구역이 어디 있고 언제 생겼나'를 확인하거나, 분석가가 구역 설치 추이를 볼 때 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 주소 문자열을 지오코딩하거나 이름을 매칭해서 공공자전거 대여소·자전거도로 같은 개인형 이동장치 데이터와 겹쳐 본다.
limits: 좌표나 표준 코드 필드가 없어서 지도에 올리거나 다른 데이터와 붙이려면 주소를 따로 변환해야 한다. 서초구만 다루므로 다른 자치구나 서울 전체 현황은 이 파일로 알 수 없고, 파일 크기가 약 2KB로 작은 목록이다.
