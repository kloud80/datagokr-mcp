summary_user: 여수시가 관리하는 교량을 한 행에 한 개씩 담은 파일로, 교량명·위치·연장·폭·경간·상하행 차선 수·설계하중·준공년도·시설물 종별·내진설계 반영 여부·관리청을 담는다. 시민이나 분석가가 "여수시 안의 교량 가운데 내진설계가 반영되지 않은 오래된 교량은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 교량명·위치 문자열을 맞추거나 같은 관리청(기관) 기준으로만 연결하며, 교량 제공표준 형식이라 다른 지자체 교량 파일과 같은 틀로 합쳐 쓴다.
description_portal: '전라남도 여수시  교량표준데이터 : 교량명칭, 교량위치, 교량의 연장, 교량 폭, 교량 경간, 교량차선(상), 교량차선(하), 설계하중, 준공년도, 교량종별,  내진설계여부, 관리청, 기관담당자, 기관연락처, 작성기준일, 비고- 교량명칭 : 교량의 명칭- 교량위치 : 교량의 위치- 교량연장 : 교량의 길이- 교량 폭 : 교량의 폭- 교량 경간 : 교량의 경간- 교량 차선(상하행) : 교량내의 차량이 통행 할 수 있는 차로의 수- 설계하중 : 설계당시 교량의 설계활하중- 준공년도 : 교량을 설치한 준공 연도- 교량종별 : 시설물의 종별 등급 구분(1종, 2종, 3종, 기타)- 내진설계여부 : 내진설계기준에 따라 시설물이 지진에 견딜 수 있는 내진적용 여부- 관리청 : 교량에 대한 관리, 감독 기관명- 기관연락처 : 교량의 관리, 감독 기관 전화번호- 작성기준일 : 데이터 작성 기준일자'
