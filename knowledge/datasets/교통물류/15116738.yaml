summary_user: 궤도운송법상 궤도시설 중 삭도를 제외한 전국 궤도설비를 지역별로 묶어 설치 기수와 용도(관광용·스키장용·전용·화물용·기타)별 수를 담은 집계표이며, 파일은 348바이트 규모의 작은 CSV다. 궤도시설 설치를 검토하는 사업자나 분석가가 '어느 지역에 관광용 궤도설비가 몇 기 설치돼 있나' 같은 지역별·용도별 분포 질문에 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 지역 이름을 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 궤도운송법 제2조(정의)에 따른 궤도시설 중 삭도시설을 제외한 전국에 설치되어 있는 궤도설비들의 용도별 현황을 나타내는 데이터입니다. 해당 데이터에는 전국에 설치되어 있는 궤도시설 설비들의 설치 지역에 대한 내용, 전국에 설치되어 있는 궤도시설들의 설치 기수에 대한 내용, 전국에 설치되어 있는 궤도시설들의 용도(관광용 궤도설비, 스키장에 설치된 관광용 궤도설비, 전용 궤도설비, 화물용 궤도설비, 기타)에 대한 내용 등의 정보를 포함하며, 관련 내용들을 확인하여 궤도시설 설치에 활용할 수 있습니다.
