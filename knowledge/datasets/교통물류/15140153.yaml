status: active
summary_user: 인천국제공항의 항공편 단위 출도착 운항정보를 담은 API로, 편명·항공사·예정/변경 일시·게이트·터미널·운항상태(도착·결항·지연 등)를 편 단위로 제공한다. 여행객이나 마중 나가는 사람이 오늘 특정 편이 지연·결항됐는지, 어느 게이트·출구로 나오는지 확인하는 질문에 쓴다. 전역 조인 키는 없고 IATA 공항코드(airportCode)와 항공편명, 항공기 등록 기호로 같은 기관 데이터나 항공 관련 정보와 이름·코드 매핑해 잇는다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다. 오퍼레이션 중 /getFltDeparturesDeOdp는 최소 파라미터로 응답이 없었고, 최신 행 날짜는 검증 호출 조건(searchDate) 기준이라 데이터 최신성과 다를 수 있다. 개발계정은 일 500회로 제한된다.
