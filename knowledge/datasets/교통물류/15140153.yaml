description_portal: 인천국제공항공사에서 관리하는 인천공항 항공기 운항정보입니다. 여객기 및 항공기의 출발/도착 정보 현황에 대한 데이터로 조회일 기준 D-3~D+6일간의 운항현황 데이터를 확인할 수 있습니다. 예정시간 또는 변경시간 기준으로 조회시간 구분코드를 지정하여 조회일자와 시간별로 조회할 수 있습니다.편명UNIQ코드, 편명, 3자리 IATA 공항코드, 여객기/화물기 구분코드 기준으로 조회조건을 제공합니다. 편명UNIQ코드값, 항공기 운항타입, 항공사, 편명, 코드세웨어 구분, 마스터편명, 예정일시, 주기장위치, 변경일시, 출/도착 공항코드, 출/도착 공항명, 게이트번호, 체크인카운터, 터미널, 출구, 운항현황 정보,  항공기 서브 타입, 항공기 등록 기호 등을 제공합니다.개발계정 일 500트래픽, 운영계정(서비스 URL 및 상세 운영사례 기재 필요) 신청 시 일 100,000트래픽을 제공합니다.
team:
  dept: 인프라DX팀
services:
  - op: /getFltArrivalsDeOdp
    name: 항공기 운항편 조회 – 도착
    endpoint: https://apis.data.go.kr/B551177/statusOfAllFltDeOdp/getFltArrivalsDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: searchdtCode
        required: false
        desc: '항공기 스케줄 조회기준 S: 예정시간기준,  E: 변경시간기준 default=E'
      - name: searchDate
        required: false
        desc: 항공기 스케줄 조회일자 default=sysdate
      - name: searchFrom
        required: false
        desc: 항공기 스케줄  ~시부터
      - name: searchTo
        required: false
        desc: 항공기 스케줄  ~시까지
      - name: passengerOrCargo
        required: false
        desc: '여객기/화물기구분 P : 여객기 C : 화물기 default=P'
      - name: fid
        required: false
        desc: 각 스케줄에 따른 편명 별 유니크 코드 값(랜덤생성)
      - name: flightId
        required: false
        desc: 항공편명
      - name: airportCode
        required: false
        desc: 인천공항에 도착하는 출발지 공항 코드 (IATA 공식 홈페이지 참조)
      - name: tmp1
        required: false
        desc: 추가현황1
      - name: tmp2
        required: false
        desc: 추가현황2
      - name: type
        required: false
        desc: 응답유형 [xml, json] default=xml
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
