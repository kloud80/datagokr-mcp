description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구교통공사에서 운영하는 도시철도 1·2·3호선 각 역의 층별 면적 현황을 제공합니다. 주요 항목은 역사명, 층수 및 층별 면적(㎡)으로 구성되어 있으며, 역사별 공간 규모와 시설 배치 현황을 파악할 수 있도록 구성되어 있습니다. 본 자료는 역사 내 공간 구성과 층별 면적 비율, 시설 활용 현황 등을 분석하는 데 활용할 수 있으며, 역사 시설 운영, 공간 활용 계획, 유지관리, 리모델링 및 시설 개선 사업을 위한 기초자료로 활용될 수 있습니다. 또한 역사 시설의 운영 효율성 분석, 이용환경 개선, 편의시설 확충 계획 수립, 데이터 기반 시설관리 및 도시철도 운영계획 수립을 지원하는 자료로 활용할 수 있습니다. 본 데이터는 변경 시 갱신됩니다.'
