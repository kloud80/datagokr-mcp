summary_user: 경상남도(부산진해경제자유구역청 관할 제외)에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 등록번호·법인명·지자체·상세주소·우편번호·최초등록일·구분(영업상태)을 담는다. 수출입화물 운송을 맡기려는 화주나 사업자가 '이 업체가 경남에 정식 등록된 국제물류주선업자인가, 언제 처음 등록했나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 법인명·주소·지자체 이름을 맞춰 이어야 하며, 화물자동차 운송·주선 허가 여부는 전국화물자동차운송사업자표준데이터와 이름으로 대조한다.
description_portal: '경상남도 내(부산진해경제자유구역청 관할 제외) 국제물류주선업 등록 업체에 관한 현황자료로 법인명, 상세주소, 최초등록일, 영업상태에 관한 정보를 제공합니다. ❍ 국제물류주선업 : 타인의 수요에 따라 자기의 명의와 계산으로 타인의 물류시설․장비 등을 이용하여 수출입화물의 물류를 주선하는 사업 ❍ 관련근거 : 「물류정책기본법」제43조 ❍ 등록권자 : 시․도지사(국토교통부장관 권한 위임) ❍ 등록기준   - (법인) 3억 원 이상 자본금 보유, (개인) 6억 원 이상 자산평가액 보유   - 1억 원 이상의 보증보험 가입   - 그 밖에 필요한 서류는 경상남도홈페이지 참고'
