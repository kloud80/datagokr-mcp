summary_user: 서울교통공사가 보유한 청사와 차량기지 토지를 건별로 담은 소규모 파일(csv 약 1.7KB)로, 소재지·대표지번·토지면적(m2)·용도·비고를 기록한다. 지번이 여러 개인 토지는 대표지번 한 건으로 묶고 면적은 해당 토지 전체 합계로 적었기 때문에, 분석가나 시민이 '어느 차량기지가 어디에 얼마나 넓은 부지를 쓰는가'를 확인할 때 쓴다. 전역 조인 키는 없어서, 소재지·대표지번 주소를 기준으로 토지대장·공시지가 같은 지번 기반 데이터나 서울교통공사의 다른 시설 데이터와 이름 매칭으로 잇는다.
description_portal: 해당 토지정보는 서울교통공사의 청사, 차량기지 관련 토지 현황(소재지, 대표지번, 토지면적, 용도 등)으로 구성된 데이터입니다.청사와 차량기지가 놓인 토지에 관한 정보를 담고 있으며, 관련 법령에 따라 서울교통공사의 도시철도 운영에 필수적인  철도용지 등에 해당합니다.*각 항목에 대한 설명소재지는 서울특별시 등의 행정구역을 나타내며 관련 지번이 여러 개인 경우 대표지번을 기준으로 작성했습니다.토지면적은 대표지번을 포함한 모든 해당 토지의 합계로 작성하였습니다.추가 상세정보는 비고에 작성하였습니다.
legal_basis_portal: 도시철도 운영에 필수적인  철도용지에 해당합니다.
