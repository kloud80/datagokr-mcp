summary_user: 전국 지자체가 지정·관리하는 어린이·노인·장애인 보호구역을 구역 한 건씩 담고, 대상 시설명, 보호구역 유형, 지정 구분(우선지정대상/지정대상), 도로명·지번 주소와 구역 형상 지오메트리(fturGeomVl)를 함께 제공한다. 학부모나 운전자, 교통안전 분석가가 '우리 동네 학교·경로당 앞 보호구역이 어디까지 지정돼 있는가', '시군구별로 보호구역이 얼마나 분포하는가' 같은 질문에 쓴다. 시군구코드(sgg_cd)로 다른 시군구 단위 통계·단속카메라 자료와 잇고, 읍면동·법정동 코드와 주소로 행정구역·지도 데이터에 겹쳐 쓴다.
description_portal: 전국 어린이 보호구역, 노인 보호구역, 장애인 보호구역에 대한 정보를 제공합니다. 보호구역 정보는 전국 지자체에서 관리되는 정보로 지정된 보호구역의 geometry을 포함하는 서비스 입니다
