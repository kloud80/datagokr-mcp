description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 운영정보 데이터로, 대구도시철도 1·2·3호선의 월별 수송인원과 운수수입을 연도별로 정리한 통계자료를 제공합니다. 본 자료는 각 노선의 월별 수송인원과 운수수입을 함께 제공하여 이용 규모, 이용 추이 및 수익 변동을 체계적으로 비교·분석할 수 있도록 구성되어 있습니다. 이를 통해 계절적 요인이나 사회적 이슈에 따른 이용 패턴 변화, 노선별 수요 변화 및 수익 구조를 종합적으로 파악할 수 있으며, 요금 정책 검토, 수송계획 수립, 운영 효율성 분석, 재정 운영 평가 및 데이터 기반 정책 의사결정을 위한 기초자료로 활용될 수 있습니다. 또한 공공교통 운영정보의 투명한 공개를 통해 행정의 신뢰성과 책임성을 높이고, 공공교통 서비스 개선과 지속가능한 도시철도 운영을 지원하는 자료로 활용될 수 있습니다. 본 데이터는 반기마다 정기적으로 갱신됩니다.'
