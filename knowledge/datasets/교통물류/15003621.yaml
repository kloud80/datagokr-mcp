summary_user: 자동차 배출가스 검사에 적용되는 허용 기준치를 검사방법·연료·차종·제작기간·차량중량 구간별로 정리한 기준표 파일(CSV, 약 845KB)로, 일산화탄소·탄화수소·질소산화물·매연 기준치와 적용 법령·적용 기간을 담으며 범위는 전국입니다. 차량 소유자나 정비·검사 사업자가 '내 차의 연료·차종·제작 시기라면 배출가스 검사에서 어떤 기준치를 넘지 않아야 하나'를 확인할 때 쓰고, 분석가는 기준 강화 시점을 추적하는 데 씁니다. 전역 조인 키가 없어 다른 데이터와는 연료·차종 이름 매핑이나 제작·적용 일자 구간 대조로만 이어 쓰며, 같은 기관의 자동차 검사 결과 데이터와 차종·연료 기준으로 맞대어 쓰는 방식이 현실적입니다.
limits: 표준 코드나 공통 키가 없어 다른 데이터와 자동 결합되지 않고 이름 매핑이 필요합니다. 포털 설명은 지역별 제한지역 현황을 언급하지만 제공 필드에는 지역 항목이 보이지 않으므로 지역별 규제 여부 판단에 쓰기 전에 실제 내용을 확인해야 합니다.
