summary_user: 인천시설공단이 설치·운영하는 전기차 충전소를 충전소 한 곳당 한 행으로 담은 파일(csv, 약 20KB)로, 충전소명·도로명주소·이용가능시간·충전기 용량(kW)·충전방식·사용방법·관리업체와 담당부서 연락처를 포함한다. 공단 시설을 찾는 전기차 운전자가 "방문할 시설에 급속 충전기가 있고 지금 이용 가능한가"를 미리 확인하거나, 분석가가 공공기관 운영 충전 인프라를 정리할 때 쓴다. 전역 조인 키는 없어 다른 충전소 데이터와는 도로명주소(소재지도로명주소)나 충전소명으로 맞춰 연결해야 한다.
description_portal: 인천시설공단에서 설치하여 운영 중인 전기차 충전소의 현황 정보를 제공합니다. 충전소별 위치와 이용가능시간, 충전기 용량, 충전방식(급속, 완속, 커넥터 규격) 및 사용방법, 관리업체명과 담당부서 및 담당자 연락처 등을 포함하고 있으며 공단 시설을 이용하는 전기차 운전자가 충전 가능 여부를 사전에 확인할 수 있도록 하기 위한 목적으로 제공됩니다. 공단 시설을 방문하는 시민과 이용자들이 가까운 충전소를 손쉽게 찾고, 충전 가능 여부를 미리 확인할 수 있도록 돕기 위한 목적으로 제공됩니다. 또한 관리업체 연락처와 담당부서 정보도 함께 포함하여 문의나 이용 안내가 원활하게 이루어질 수 있도록 구성하였습니다. 전기차 이용 편의를 높이고 친환경 교통수단 활성화를 지원하기 위한 참고 자료로 활용하실 수 있습니다.
