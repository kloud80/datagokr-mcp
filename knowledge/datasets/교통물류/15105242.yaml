summary_user: 경기도 시군구별로 등록연도·연료 종류·용도에 따라 나눈 자동차 등록 대수를 승용·승합·특수·화물차 차종별로 담은 집계 통계입니다. 정책 분석가가 "우리 시군의 전기차·하이브리드 등록은 늘고 경유 화물차는 줄었는가"처럼 연료 전환과 친환경차 보급 추세를 지역별로 비교하는 데 쓴다. 전역 조인 키는 없고, 시군구명(signgu_nm)과 등록연도(reg_yr)를 이름 매핑해서 다른 시군구 단위 인구·대기질·충전소 통계와 잇는다.
description_portal: 이 데이터는 경기도 내 각 시군구별로 연료 유형과 용도별로 구분된 자동차 등록 현황을 제공하며, 등록연도, 시군구명, 연료별 구분(휘발유, 경유, 전기, LPG, 하이브리드 등), 용도(비사업용 등), 차량 종류(승용차, 승합차, 특수차, 화물차)별 등록 대수로 구성되어 있습니다. 연료 유형별 등록 차량 수를 통해 친환경 차량 보급 추세나 경유차 감축 현황 등의 분석이 가능하며, 용도별 및 차종별 통계를 통해 교통정책 수립, 대기환경 개선 전략 수립, 탄소중립 목표 설정 등에 필요한 기반자료로 활용할 수 있습니다. 특히, 시군구 단위의 세분화된 공간 데이터를 통해 지역별 자동차 보급 특성과 연료 다변화 현황을 파악하는 데 적합합니다.
