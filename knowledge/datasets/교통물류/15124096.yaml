summary_user: 경기도 버스운송관리시스템(BMS)에서 만들어진 레포트별로 레포트 이름, 버스회사 식별값(bus_co_id), 사용 횟수, 사용 여부, 삭제일자 같은 사용 정보를 담은 시도 단위 비공간 자료다. 교통 행정 담당자나 분석가가 'BMS의 어떤 레포트가 얼마나 자주 쓰이고 어떤 것이 사용 중단·삭제됐는가'를 확인해 시스템 운영과 정보 제공 방식을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 레포트 이름이나 버스회사 식별값을 같은 기관(경기도) 자료와 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS) 내에서 생성된 레포트의 사용 현황을 정리한 자료로, 각 보고서의 사용이력 및 생성정보를 확인할 수 있습니다. 주요 항목은 레포트ID, 사용자ID, 생성일자, 사용 목적, 접근 일시 등이 있으며, 이를 통해 시스템 이용자가 작성한 레포트의 활용 범위와 시점을 파악할 수 있습니다. 본 자료는 교통정책 수립 시 사용자의 데이터 접근 성향 분석, 레포트 생성 패턴의 통계적 분석, 시스템 사용량 모니터링, 정책자료의 참고 빈도 등 다양한 행정 및 연구 목적에 활용할 수 있습니다. 특히 레포트 사용빈도와 목적 분류는 효율적인 시스템 운영과 정보 제공 방안 마련에 있어 중요한 기준이 됩니다.
