summary_user: 경상남도 사천시의 불법주정차 단속을 건별로 기록한 파일 데이터로, 차종·단속일·단속 장소와 장소 구분·과태료 부과 여부를 담는다(csv 약 149KB, 시군구 범위). 사천시 공무원이나 분석가가 "사천시에서 불법주정차 단속이 자주 일어나는 장소는 어디이고, 그중 실제 과태료가 부과된 비율은 얼마인가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 장소 이름 매칭이나 같은 기관(사천시) 기준으로만 이어 쓴다.
description_portal: 경상남도 사천시 불법주정차 단속현황 데이터는 2025년 기준 단속 현황을 제공하며, 단속 건수, 과태료 부과 내역 등 다양한 정보를 포함하고 있어 도시 교통 질서 관리, 주정차 위반 예방 정책 수립, 자치구별 단속 실적 분석 등 행정적·정책적 목적에 활용될 수 있습니다. 또한 이 데이터는 지역 별 불법주정차가 빈번하게 발생하는 구역을 파악하고, 단속 강화를 위한 우선순위 설정, 계도 및 홍보 활동의 효과 분석, 과태료 부과 현황에 따른 재정 수입 추이 등 다양한 분석에 활용할 수 있습니다.  도로 또는 지정 구역 내 주정차 위반 사례를 단속 일시, 단속 위치, 위반 유형, 단속 방법 및 주체 등으로 구분하여 기록한 자료입니다.
