description_portal: 울산시설공단은 울산대공원 남문 주차장의 월별 주차 현황 데이터를 다양한 항목으로 제공하고 있습니다. 이 데이터에는 주차장명, 주차장구분, 주차장유형, 소재지도로명주소, 소재지지번주소, 주차구획수, 입차대수, 출차대수, 연월, 데이터기준일자 등의 정보가 포함됩니다. 주차장명은 주차장의 이름을 나타내며, 주차장구분은 해당 주차장이 공용인지, 민간인지 구분합니다. 주차장 유형은 주차장의 형태를 지정하고, 소재지 도로명주소와 소재지 지번 주소는 주차장의 정확한 위치를 알려줍니다. 주차구획 수는 주차장의 총 주차 공간 수를 기록하며, 입차 대수와 출차 대수는 월별로 주차장에 입출차된 차량 수를 제공합니다. 데이터기준일자는 데이터가 수집된 날짜를 기록합니다.
