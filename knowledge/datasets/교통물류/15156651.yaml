description_portal: 소규모공공시설은 마을주민들이 일상생활에서 사용하는 작은 공공시설을 말합니다.대표적인 예로는 농로, 마을도로, 배수로, 소교량, 세월교, 소하천 정비 시설 등이 있습니다.주로 농촌, 어촌, 산간 지역에 많고 생활에 꼭 필요하지만 규모가 크지 않은 시설을 말합니다.소교량에서 자주 발생하는 문제로는 콘크리트 균열, 교대 침하, 하천 바닥 세굴(물에 깎임), 난간,방호울타리 파손, 설계 하중 초과 사용 등이 있습니다.소교량은 마을과 마을을 이어주는 작지만 매우 중요한 공공 다리로, 안전관리와 유지보수가 꼭 필요한 시설입니다.그중 소교량은 하천, 도랑, 배수로 위를 건너기 위해 설치한 작은 다리입니다. 교량이긴 하지만 길이와 폭이 작고 주로 마을 안 도로, 농로, 진입로에 설치됩니다.주민 통행, 농기계 이동이 주 목적입니다.소교량은 작아 보여도 사고 위험이 높은 시설입니다. 오래설치된 경우가 많고, 설계 기준이 낮거나 기록이 없는 경우가 있습니다.집중호우 시 붕괴 위험과 농기계,화물차 통행 증가로 하중 증가 등의 이유로 정기 점검과 보수 및 보강이 매우 중요합니다.경기도 양평군 위치한 소교량 시설명, 위치, 공공시설 지정 여부, 지정 일자, 제원 연장, 제원 폭, 수혜구역 농경지, 건물수, 시설부속물등의 데이터를 제공합니다.
