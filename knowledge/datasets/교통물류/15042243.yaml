summary_user: 경기도 광주시 공간정보시스템에 등록된 교량 하부·터널·고가차도 등 통과 높이제한 시설을 시설 한 건씩 담은 원천 목록으로, 규격(가로·높이), 통행제한높이, 표지판 개수, 경위도·지번주소를 포함한다. 화물차·버스 운전자나 물류 사업자가 광주시 안에서 차량 높이 때문에 지나갈 수 없는 구간이 어디인지 확인하거나 경로를 짤 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 경위도 좌표나 지번주소로 공간 매칭하거나 관리기관 이름으로 연결해야 한다.
description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 통과 높이제한 시설의 정보를 제공합니다. 교량 하부, 터널, 고가차도 등에서 차량의 안전한 통행을 위해 높이를 제한하는 시설의 정보를 담고 있습니다. 지형지물부호와 관리번호는 시설을 식별하는 코드이며, 관리기관은 시설 관할 주체를 나타냅니다. 가로와 높이는 시설의 규격을 나타내고, 통행제한높이는 차량이 안전하게 통과할 수 있는 최대 높이를 표시합니다. 표지판 개수는 안내 표지판 설치 현황을 나타내며, 경도, 위도, 지번주소는 시설의 정확한 위치를 제공합니다.
