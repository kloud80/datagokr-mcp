summary_user: 날짜별로 전국·지방방향·서울방향 고속도로 교통량과 서울과 대전·대구·울산·부산·광주·목포·강릉 등 주요 도시 간 승용차·버스 방향별 소요시간을 한 행에 담은 일별 집계 파일이며, 포털에서 받는 파일은 705바이트 분량의 샘플이다. 명절·연휴 같은 특정 날짜에 서울에서 부산까지 고속버스가 실제로 얼마나 걸렸는지, 버스와 일반 차량의 소요시간 차이가 어떤지 확인하려는 이용자나 교통 분석가가 쓴다. 전역 조인 키는 없고 날짜 컬럼만 있어, 다른 데이터와는 날짜나 도시명 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 본 데이터는 한국도로공사에서 수집·제공하는 자료로, 서울 및 전국 주요 도시 간 고속도로를 이용한 버스의 실제 이동시간 정보를 포함하고 있다. 이 데이터는 주요 노선별 이동 소요시간을 기반으로 하여, 이용자에게 지역 간 교통 흐름과 혼잡도를 파악할 수 있도록 지원한다. 또한, 특정 시간대 또는 기간별 이동시간의 변화 추이를 분석할 수 있어, 교통 정책 수립 및 대중교통 운영 최적화에 활용될 수 있다. 데이터는 정기적으로 갱신되며, 수집 경로와 시간대에 따라 다양한 정보 항목이 포함되어 있다. 이와 같은 고속도로 기반 버스 이동시간 정보는 교통 수요 예측, 경로 계획 수립, 물류 효율화 등의 분야에서도 활용 가능하다.* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000123
