description_portal: 보행자우선도로는 보도와 차도가 혼용되는 도로에서 보행자 통행이 차량 통행보다 우선하도록 지정한 도로로 보행자의 안전권을 보장하는 만큼, 보행자는 도로의 전 부분으로 통행이 가능함. 보행자의 옆을 지날 때 안전거리를 두고 서행해야 하고 보행자의 통행에 방해가 될 때는 서행하거나 일시 정지해야 하며, 보행자우선도로 도입으로 보행자 안전이 확보됨과 동시에 보행자 중심의 교통안전 체계가 자리 잡히는데 도움이 되고 있음. 해당 파일은 보행자 중심의 교통체계를 조성·운영하기 위하여 「보행안전 및 편의증진에 관한 법률」 제17조의2 규정에 따라 지정된 대구광역시 보행자우선도로 현황임.
