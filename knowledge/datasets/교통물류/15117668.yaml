summary_user: 공유 퍼스널모빌리티(개인형 이동장치) 운영사·지역별 목록을 조회하는 API로, 장치 ID·배터리 잔량·현재 좌표 같은 장치 단위 운영 정보를 담는다. 근처에서 쓸 수 있는 공유 킥보드의 위치와 배터리 상태를 미리 확인하려는 이용자나 이동 수단 분석가가 쓴다. 필수 파라미터인 지역코드(citycode)와 운영사명(providername)은 다른 데이터에서 먼저 받아 넘겨야 하며, 전역 조인 키는 없어 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
description_portal: 공유 퍼스널모빌리티(개인형이동장치/PM)의 운영사명, 지역을 기반으로 퍼스널모빌리티 정보(운영사명, 장치ID, 베터리잔량,  좌표)를 조회하는 서비스. 공유 퍼스널모빌리티(개인형 이동장치, PM)의 운영사명과 지역 정보를 기반으로 퍼스널모빌리티 정보를 조회할 수 있는 서비스이다. 본 서비스는 이용자가 선택한 운영사 및 특정 지역을 기준으로 운영 중인 개인형 이동장치의 목록을 제공하며, 각 장치의 장치 ID, 배터리 잔량, 현재 위치 좌표 등 기본적인 운영 정보를 확인할 수 있도록 구성되어 있다. 이를 통해 이용자는 주변에서 이용 가능한 퍼스널모빌리티의 위치와 상태를 사전에 파악할 수 있으며, 보다 효율적인 이동 수단 선택과 이용 계획 수립에 활용할 수 있다.
team:
  dept: 모빌리티총괄과
services:
  - op: /GetPMProvider
