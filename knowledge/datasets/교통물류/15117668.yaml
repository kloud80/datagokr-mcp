    params:
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: _type
        required: false
        desc: 데이터 타입(xml, json)
      - name: providerName
        required: false
        desc: 운영사명
      - name: cityName
        required: false
        desc: 지역명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /GetPMListByProvider
    name: 지역별 운영사기반 공유전동킥보드 목록 조회
    endpoint: https://apis.data.go.kr/1613000/PersonalMobilityInfo/GetPMListByProvider
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: _type
        required: false
        desc: 데이터 타입(xml, json)
      - name: providerName
        required: true
        desc: 운영사명
      - name: cityCode
        required: true
        desc: 지역번호('지역별 공유전동킥보드 운영사 목록 조회' API 에서 지역명 기반 지역번호 확인)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
