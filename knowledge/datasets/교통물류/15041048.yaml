summary_user: 광주1호선 각 역을 한 행으로 두고 운영기관명·노선명·한글 역명과 영어·로마자·일본어·중국어 간체 표기, 환승역 여부(환승역여부)를 담은 xlsx 파일이다. 관광 안내나 교통 정보 서비스를 만드는 사업자·개발자가 '이 역을 외국인 안내판·앱에서 영어·일본어·중국어로 어떻게 표기하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 좌표·승하차 데이터와는 역명(한글)을 이름 매핑해 이어 쓴다.
limits: 역 코드 같은 공통 조인 키가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다. 역 좌표·출입구·승하차 수치는 담지 않는다. 포털 설명대로 중국어 간체 깨짐 때문에 xlsx로 제공되므로 CSV로 변환할 때 인코딩에 주의한다.
