summary_user: 코레일이 운영하는 수도권 전철 노선 역사의 역구조를 역·층 단위로 담은 파일로, 운영기관명·노선명·역명과 지상·지하 구분, 역층, 층별 면적을 담는다(약 33KB CSV). 역사가 지상역인지 지하역인지, 몇 개 층으로 이뤄지고 면적이 얼마인지 확인하려는 교통약자 이동 동선 분석이나 역사 시설 계획 검토에 쓴다. 전역 조인 키가 없어 다른 역 좌표·출입구·승하차 데이터와는 노선명·역명 같은 이름 매칭으로만 잇는다.
description_portal: 코레일에서 운영하는 지하철 노선 역사의 역구조에 대한 데이터로 철도운영기관명, 선명, 역명, 지상구분, 역층, 면적의 데이터가 있습니다.가장 일반적인 철도역의 형태. 맞이방도 선로도 지상에 위치하며, 보통 승강장은 지상 1층에 존재한다. 다른 플랫폼으로 넘어갈 때는 건널목, 육교 또는 지하도를 이용한다. 경의·중앙선 도농역, 서울 지하철 2호선 신답역, 수도권 전철 8호선 남위례역, 부산 도시철도 2호선의 부산대양산캠퍼스역, 두단식 승강장 구조의 경인선 인천역, 호남선 목포역, 전라선 여수엑스포역 등이 좋은 예. 건널목으로 다른 플랫폼으로 넘어갈 때 안전사고 위험이 있다는 단점이 있다. 그래서 밀양역, 김천역처럼 열차 운행이 빈번한 지상역의 경우 플랫폼으로 가는 육교나 지하도를 놓는다.
