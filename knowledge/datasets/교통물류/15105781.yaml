summary_user: 대구교통공사 도시철도의 역사별 전동휠체어 충전기 설치 현황을 충전기 설치 위치 단위로 담은 CSV 파일(약 8KB)로, 호선·설치역·지상/지하·층·상세위치·충전설비 수·동시 충전 대수·이용요금·역 주소와 전화번호가 들어 있다. 전동휠체어 이용자나 보호자가 '내가 갈 역에 충전기가 있고 몇 층 어디에 있으며 몇 대를 동시에 충전할 수 있는가'를 확인하거나, 분석가가 호선별 충전 인프라 공백을 살피는 데 쓴다. 전역 공통 조인 키는 없으므로 다른 역·편의시설 데이터와는 설치역 이름이나 역 주소를 맞춰 잇고, 같은 대구교통공사의 역 단위 데이터와 연결하는 방식으로 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 교통약자 이동권 운영정보 데이터로, 도시철도 호선별·역사별 전동휠체어 충전기 설치 및 운영 현황 정보를 제공합니다. 데이터에는 호선, 설치역, 충전기 설치 위치, 충전설비 수, 동시 충전 가능 대수, 설치역 주소, 설치역 전화번호 등의 주요 항목이 포함되어 있으며, 각 역사 내 전동휠체어 충전 시설의 위치와 운영 현황을 확인할 수 있는 자료입니다. 해당 데이터는 교통약자의 이동 편의 지원을 위한 시설 정보 제공, 충전 인프라 현황 파악, 이용 안내 및 편의시설 관리 계획 수립을 위한 기초자료로 활용할 수 있습니다. 또한 역사별 충전 시설 설치 현황을 분석하여 향후 시설 확충 및 접근성 개선 검토에 활용할 수 있습니다. 본 데이터는 충전기 설치 및 운영 현황 변경 등 변동 사항 발생 시 갱신됩니다.'
