summary_user: 한국교통안전공단이 수행하는 기계식주차장치 검사의 비용표를 설비 유형·방식·층수와 대수 구간(최소·최대 단위)별로 검사비와 재검사비로 담은 단일 CSV 파일(약 10KB)이며, 건별 검사 실적이 아닌 요금 기준표다. 기계식주차장을 설치·운영하는 사업자나 건물 관리자가 "우리 주차설비 형식과 대수로 검사를 받으면 비용이 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 설비 유형·방식 같은 이름 매핑으로만 연결하며, 개별 주차장 위치·면수는 전국주차장정보표준데이터 같은 별도 원장에서 찾아야 한다.
limits: 개별 주차장이나 설비 단위 정보가 없는 비공간 전국 기준표라서 특정 주차장의 검사 여부·결과는 알 수 없다. 포털 설명대로 제공 시점에 따라 검사 종류·설비 분류 방식·비용(물가 반영)이 바뀌었을 수 있어 현재 요금과 다를 수 있다.
