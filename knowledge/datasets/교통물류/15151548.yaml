summary_user: 대구도시철도 1·2·3호선 역사의 승강장별 연단간격(좁음·보통·넓음)과 연단높이(낮음·보통·높음)를 호선·역명·승강장·개소 단위로 담은 시설 현황 파일입니다. 휠체어 이용객이나 노약자가 '어느 역 승강장이 열차와 간격이 넓어 승하차가 위험한가'를 확인하거나, 공사·연구자가 역사별 시설 개선 우선순위를 검토하는 데 쓴다. 전역 조인 키가 없어 다른 역 좌표·승하차 데이터와는 역명·호선 이름 매칭으로만 연결합니다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구도시철도 1·2·3호선 전 역사의 승강장 연단간격 및 연단높이 현황을 제공합니다. 주요 항목은 역사별 연단간격과 연단높이로 구성되어 있으며, 열차 출입문과 승강장 사이의 간격은 ‘좁음·보통·넓음’, 높이차는 ‘낮음·보통·높음’으로 구분하여 제공함으로써 역별 승하차 환경의 상대적 수준을 쉽게 확인할 수 있도록 구성되어 있습니다. 본 자료는 휠체어 이용객, 노약자 등 교통약자의 안전한 승하차 환경 조성과 이동 편의성 향상을 지원하며, 교통약자 접근성 평가, 역사 시설 개선, 안전성 검토, 시설 유지관리 및 교통 인프라 연구를 위한 기초자료로 활용될 수 있습니다. 또한 승하차 안전성 분석, 역사별 시설 개선 우선순위 검토, 교통약자 이동권 보장 정책 수립 및 공공교통 서비스 품질 향상을 위한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 변경 시 갱신됩니다.'
