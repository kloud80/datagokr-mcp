summary_user: "인천 연수구 전역에서 접수된 불법주정차 신고를 건별로 담은 원천 파일로, 신고일·신고시각·위도·경도와 과태료 부과 여부를 기록한다. 구청 교통행정 담당자나 분석가가 '연수구에서 어느 시간대·어느 지점에 불법주정차 신고가 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가'를 따져 상습 구역 파악이나 단속 인력 배치에 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 위도·경도 좌표를 공간 결합하거나(예: 보호구역·단속카메라 위치) 날짜·시간대를 기준으로 맞춰 이어 쓴다."
description_portal: 이 자료는 연수구 전역에서 발생한 불법주정차 신고 내용을 체계적으로 관리하기 위해 구축된 데이터로, 신고일·신고시각·위도·경도·과태료 부과 여부 등 핵심 항목으로 구성되어 있습니다. 이를 통해 어느 시점‧어느 위치에서 신고가 빈발하는지 공간·시간적 패턴을 분석할 수 있으며, 실제로 과태료 부과로 이어졌는지 여부까지 확인할 수 있어 단순 신고 통계를 넘어 정책적 활용도가 매우 높습니다. 특히 불법주정차 상습 구역 파악, 단속 인력 재배치, 위험지역 교통안전대책 수립, 스마트 교통행정 기반 마련 등에 활용할 수 있는 기초자료로서 의미가 큽니다. 데이터 수요자는 이 자료를 활용해 지역별·시간대별 민원 특성을 분석하거나, GIS 기반 시각화를 통해 현장의 문제를 보다 직관적으로 파악할 수 있습니다.
