description_portal: 건설기계조종사 경력관리 시스템 기능구현 항목에 대한 설명이다. 상세 기능으로 QNA통합, 개선의견_자주하는질문, 공지사항, 공통코드, 공통코드세부, 그룹별메뉴권한, 도움말관리, 법정동코드, 사용자별메뉴, 시스템메뉴, 우편번호, 자료실로 구성되어 있으며, 건설기계조종사가 경력관리를 신청하면 해당 신청서의 정보를 시스템에 입력하는 기능 및 관리기능으로 구성된다. 상기 기능은 건설기계 조종사의 신청에 의해 경력을 관리하여야 하는 관리주체를 위해 설계된 기능이며, 주요 질문의 경우 공지사항을 통해 자주 발생하는 문의사항을 정리하여 일방향 정보를 전달하는 형태로 이루어져 있다. 주요 데이터는 건설기계조종사 이름, 생년월일, 업체정보, 주소 등 개인정보로 구성되어 있으며, 신청일 기준 경력일을 산정하고 있다.
