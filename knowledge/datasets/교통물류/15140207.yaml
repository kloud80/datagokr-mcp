description_portal: 면세점(보세판매장)의 매출현황을 내국인과 외국인으로 분류하여 집계한 데이터 및 내국인과 외국인의 이용객수를 집계한 데이터입니다.기간은 2018년 1월부터 2026년 4월까지이고, 금액단위는 백만불이며, 이용객수 단위는 천명입니다. 매출액은 온오프라인 모두 포함한 금액입니다. 다만, 온오프라인을 구분하여 데이터를 관리하고 있지 않아 온라인 매출액만 나눌 수 없음을 알려드립니다.관세청은 「관세법」 제174조부터 제182조까지, 제196조 및 그에 따른 「관세법 시행령」, 「관세법 시행규칙」에서 보세판매장 특허 및 운영과 관련하여 위임된 사항과 그 시행에 필요한 사항을 규정하고, 「관세법 시행령」 제192조의5제7항에 따라 보세판매장 특허 관련 업무를 수행하는 과정의 투명성과 공정성을 높이기 위한 청렴옴부즈만의 설치와 운영에 관하여 필요한 사항을 규정하고 있습니다.또한, 신고인의 수정, 정정 등으로 인해 통계 수치는 달라질 수 있으니 유의해 주시기 바랍니다.
