summary_user: 한국도로공사 통행료징수시스템(TCS) 기록을 바탕으로 출발·도착 영업소 쌍별, 일자별, 차종별 평균 통행속도(avgSpeed)를 담은 전국 단위 집계 데이터다. 운송사업자나 교통 분석가가 특정 고속도로 영업소 구간에서 화물차와 승용차의 평균 속도가 어떻게 다른지, 어느 구간이 상습적으로 느린지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 영업소코드와 차종코드를 같은 기관의 영업소·통행 데이터와 코드나 이름으로 맞춰 이어 쓰고, 이력을 쌓으면 정체 구간 분석에 활용한다.
description_portal: 본 데이터는 한국도로공사가 제공하는 영업소 간 총 통행속도 정보를 TCS(통행료징수시스템) 기준으로 수집·제공한 것이다.OpenAPI 형태로 제공되며 XML과 JSON 형식을 지원한다.제공 항목에는 일자, TCS 차종유형구분명 및 코드, TCS 차종구분명 및 코드, 평균속도, 출발영업소코드, 도착영업소코드가 포함된다.이를 통해 특정 차종별로 영업소 간 평균 주행속도를 파악할 수 있다.데이터는 도로 통행료 징수시스템에서 자동 수집된 정보를 기반으로 하며, 실제 교통 흐름 및 도로 운영 상태를 분석하는 데 활용된다.이용자는 본 데이터를 활용하여 차종별 속도 비교, 교통 혼잡 구간 분석, 도로 운영 효율성 평가 등에 참고할 수 있다.또한 장기적으로 속도 변화 추이를 분석함으로써 교통 정책 수립 및 도로 인프라 개선 방안 마련에 기여할 수 있다.
