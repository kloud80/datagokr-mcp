summary_user: 광주공항의 제주–광주 노선을 항공사별(아시아나항공·제주항공·진에어·대한항공·티웨이항공)로 나눠 운항 도착·출발 건수, 여객 도착·출발 인원, 화물 도착·출발 물량과 각 합계를 담은 집계 파일로, 크기는 750바이트 남짓이다. 지역 관광·출장 수요를 보는 분석가가 "제주–광주 노선에서 어느 항공사가 여객과 화물을 가장 많이 실어 나르나"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공항·항공 통계와는 항공사코드나 항공사명, 노선명을 맞춰 붙여야 한다.
limits: 전역 조인 키가 없어 다른 데이터와는 항공사 이름·코드를 직접 맞춰야만 연결된다. 집계 기간이나 갱신 시점은 근거로 확인되지 않아 시계열 비교에는 그대로 쓰기 어렵다.
