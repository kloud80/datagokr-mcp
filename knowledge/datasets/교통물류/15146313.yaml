description_portal: '○ 통계개요* 통계명 : 교통이용 만족도* 통계종류 : 서울서베이의 서울시민 교통수단 이용 만족도를 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축및분석을 실시함으로써 서울의 현재상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을 모니터링하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별ㆍ연령별ㆍ지역별ㆍ학력별 등)의 대중교통 이용 및수단별(버스, 지하철, 택시) 이용만족도 등○ 용어설명○ 기 타* 문항 : 귀하는 서울의 교통수단에 대해 어느정도 만족하십니까? 교통수단의 쾌적성,정시성, 친절성 등을 전반적으로 생각하여 다음 각 항목(버스,지하철,택시)에 대한귀하의 생각을 말씀해 주십시오.* 해당연도가 없는 것은 그해 조사항목에서 제외된 것임.'
