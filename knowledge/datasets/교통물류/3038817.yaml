summary_user: 지하철 7호선 부천구간 6개 역(까치울~상동)의 월별 일평균 승차·하차·합계 이용객수를 연월 한 행에 역별 열로 담은 집계 파일이다(약 1.6KB CSV). 부천시 교통 담당자나 분석가가 '7호선 부천구간에서 어느 역 이용이 가장 많고 월별로 어떻게 변하는가' 같은 질문에 쓴다. 역 코드 같은 전역 조인 키는 없어 다른 역별 승하차 자료와는 역 이름과 연월을 맞춰 연결해야 한다.
limits: 부천시 관내 6개 역만 담으며 서울·인천 구간 역 이용객수는 포함하지 않는다(각각 서울교통공사·인천교통공사 집계). 일평균 집계값이라 시간대별·일별 이용 패턴은 알 수 없고, 역이 행이 아닌 열로 펼쳐져 있어 역 단위로 쓰려면 형태 변환이 필요하다.
