summary_user: 서울 서초구의 주정차 단속 기록을 단속 건별로 담은 CSV 파일(약 45MB)로, 단속일시·단속 행정동·단속장소·위반내용을 담으며 포털 설명상 기간은 2023~2025년이다. 서초구 안에서 어느 동, 어느 장소, 어느 시간대에 불법 주정차 단속이 몰리는지 알고 싶은 주민·구청 교통 담당자·분석가가 쓴다. 전역 조인 키가 없어 단속동 이름을 행정동 코드에 맞춰 붙이거나, 같은 서초구 자료와 이름 기준으로만 이어 쓴다.
