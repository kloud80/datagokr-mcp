summary_user: 수원시에 등록된 특수여객자동차운송사업체를 업체 한 곳당 한 행으로 담은 건별 등록 목록으로, 대표자명·등록일자·업체 전화번호와 승합·승용·일반장의용·운구전용 차량 대수를 담는다(파일 크기 약 1.5KB의 소규모 CSV). 장례 운구차나 이송 차량이 필요한 시민이 수원시 안에서 연락할 수 있는 등록 업체와 보유 차량 종류를 찾을 때, 또는 분석가가 시 단위 특수여객 차량 공급 규모를 파악할 때 쓴다. 전역 조인 키가 없어 다른 시군의 같은 등록현황과는 시도명·시군명 같은 이름으로, 다른 데이터와는 업체명 매칭으로만 이어 쓴다.
limits: 범위가 수원시 한 시군구뿐이라 다른 지역과 비교하려면 각 시군의 파일을 따로 모아야 한다. 표준 코드 키가 없어 업체명·행정구역명 문자열 매칭에 의존하며, 업체 주소 컬럼이 없어 이 파일만으로 의료시설과의 거리 분석은 하기 어렵다.
