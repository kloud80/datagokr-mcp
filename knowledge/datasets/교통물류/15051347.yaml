description_portal: 이 데이터는 전북특별자치도 내 천연가스(CNG) 버스 운행 현황을 연도별로 정리한 통계자료입니다. 2016년부터 2019년까지의 기간 동안 시내버스, 시외버스, 마을버스 등에서 운행 중인 천연가스 버스의 대수와 그에 따른 사용연료량(천㎥)이 포함되어 있으며, 이를 통해 친환경 교통수단으로서 천연가스 버스의 확산 추이를 파악할 수 있습니다. 본 데이터는 대기환경 개선, 탄소중립 정책 수립, 친환경 대중교통 확대를 위한 기초자료로 활용될 수 있으며, 지자체의 교통정책이나 도시계획 수립 시에도 참고가 가능합니다. 또한 CNG 버스의 수요 변화와 연료 사용량 추이 분석을 통해 향후 에너지 수급 계획이나 친환경 인프라 구축에도 기여할 수 있습니다.
