summary_user: 횡성군 관내에서 안전신문고로 접수된 불법주정차 신고를 건별로 담은 파일로, 2024년 1~12월 신고마다 단속일시·단속장소·과태료 부과여부를 기록한다. 주민이나 분석가가 '횡성군에서 불법주정차 신고가 어느 장소·시간대에 몰리고, 그중 실제 과태료가 부과된 비율은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속장소 이름을 주소·지명으로 맞추거나 같은 기관(횡성군) 자료끼리만 연결한다.
limits: 표준 행정코드나 좌표 같은 조인 키가 없어 단속장소는 텍스트 매칭으로만 다른 데이터와 이을 수 있다. 범위가 횡성군 한 곳이라 다른 시군과 비교하려면 지자체별 자료를 따로 모아야 한다.
