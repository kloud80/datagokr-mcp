summary_user: 양주시 관내 도로관리시스템 기준의 도로점용허가 문서 현황을 건별로 정리한 파일로, 노선명·점용장소·점용목적을 담는다. 시민이나 사업자가 '우리 동네 어느 도로에서 어떤 진입로·버스 승강장 설치로 도로를 점용하고 있나'를 확인하거나, 분석가가 점용 허가를 공사 이벤트로 보고 지역 변화를 살피는 데 쓴다. 전역 조인 키가 없어 노선명·점용장소 같은 이름을 다른 도로·주소 자료와 텍스트로 맞추거나 같은 기관(양주시) 자료끼리만 이어 쓴다.
description_portal: 경기도 양주시 도로점용허가 문서관리 데이터는 관내 도로관리시스템을 기반으로 작성된 행정 문서 현황을 정리한 자료이다. 데이터에는 도로점용과 관련된 노선명, 점용장소, 점용 목적 등이 포함되어 있으며, 실제로 어떤 위치에서 어떤 사유로 도로가 사용되고 있는지를 명확히 파악할 수 있도록 구성되어 있다. 이를 통해 행정기관은 도로 점용 허가 현황을 체계적으로 관리할 수 있으며, 불법 점용이나 관리 사각지대를 최소화하는 데 중요한 자료로 활용된다. 특히 점용 목적에는 근린생활시설 진입로, 공장부지 진입로, 종교시설 진입로, 버스 승강장 설치 등 다양한 항목이 기록되어 있어, 도시계획과 교통행정 업무에 유용하다. 시민들에게는 공공도로 이용 현황을 투명하게 공개함으로써 행정 신뢰도를 높이고, 연구자 및 정책 입안자에게는 도시 인프라 활용과 관리에 관한 기초 자료로 활용될 수 있다.
