summary_user: 서산시 도시계획정보시스템에서 미관지구 정보를 담는 테이블의 구조를 설명한 메타데이터로, 시스템명·논리/물리 데이터베이스명·영문/한글 테이블명·영문/한글 컬럼명 7개 항목을 담은 2.5KB 남짓의 CSV 파일이다. 분석가나 개발자가 '서산시 미관지구 데이터는 어떤 테이블과 컬럼으로 관리되는가'를 확인하거나, 시스템 연계·자료 요청 전에 속성 구성을 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명 같은 이름 매핑이나 같은 기관(서산시) 기준으로만 이어 쓴다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 미관지구에 관한 메타데이터이다. 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 미관지구는 도시의 경관 보호와 조화로운 건축 환경을 위해 지정되는 지역이며, 건축물의 외형, 색상, 재료 등에 규제가 적용된다. 본 데이터는 지구별 규제 내용과 지정 목적을 이해하는 데 유용하며, 도시계획 수립, 인허가 심의, 디자인 기준 검토 등에 활용된다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 도움이 되며, 정책 수립, 민간 활용, 도시환경 관리 등 다양한 분야의 기초자료로 사용될 수 있다.
