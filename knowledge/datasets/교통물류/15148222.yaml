summary_user: 경기도 남양주시 관내에 등록된 물류창고업 사업자를 한 업체당 한 행으로 담은 명부로, 업체명·사업자등록번호·대표자·주소·연락처를 담은 작은 CSV 파일(약 3KB)이다. 물류 입지를 검토하는 사업자나 분석가가 "남양주시에 등록된 물류창고업체는 어디에 몇 곳 있는가"를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 기업 정보 데이터와 잇고, 주소로 다른 시군의 물류창고업 등록 현황이나 물류단지·물류센터 입지 데이터와 겹쳐 본다.
description_portal: 경기도 남양주시 관내에 위치한 물류창고업 등록 사업자 현황입니다. 물류창고업체명, 사업자 등록번호, 주소 등의 데이터 항목을 포함하고 있습니다."물류시설의 개발 및 운영에 관한 법률"이 개정됨에 따라 물류창고업 등록제가 시행되고 있으며, 해당 데이터는 물류 산업 및 유통 공급망 분석에 유용한 데이터로 다른 데이터와 융합하는 등 여러방법으로 활용될 수 있습니다. 해당 데이터는 물류사업 현황 파악 및 유통망 분석, 입지 분석 등 다양한 방면에서 연구분석 및 행정업무의 기초자료로 활용가능합니다.
