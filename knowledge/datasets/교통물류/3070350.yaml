summary_user: 국가철도공단이 진행하는 철도건설사업의 설계VE(가치공학) 검토 현황을 프로젝트·용역·설계건 단위로 담은 CSV 파일(약 45KB)로, 설계분야·설계대상·시행방법과 검토 시작·종료일을 포함한다. 철도 건설 분석가나 설계 용역 사업자가 특정 노선 사업에서 어떤 설계분야가 언제 VE 검토를 받았는지, 시행방법은 무엇이었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 프로젝트명·용역명 같은 이름 매칭이나 같은 기관(국가철도공단) 자료끼리만 이어 쓴다.
description_portal: 국가철도공단_설계 데이터는 철도, 건설, 가치공학 분야에서 활용되는 설계VE(Value Engineering) 현황 자료로, 국가철도공단이 진행 중인 철도건설사업에 대한 설계 관련 정보를 포함하고 있습니다. 해당 자료는 매년 최신 기준으로 정리되며, 각 철도건설 용역의 용역명, 설계건명, 설계분야별 구분, 설계대상별 시행방법 등 구체적인 설계 정보가 포함되어 있습니다. 본 데이터는 설계단계에서 경제성, 효율성, 기능성을 검토하기 위한 VE 활동의 일환으로 활용되며, 사업비 절감, 시공성 향상, 유지관리성 개선 등을 목표로 설계대안을 평가하고 도출하는 과정에 활용됩니다. 이를 통해 철도 인프라 사업의 품질을 높이고 예산의 효율적 집행을 유도하며, 설계단계에서부터 과학적이고 체계적인 판단이 가능하도록 지원하는 기초 자료로 활용됩니다.
