description_portal: 메타관리시스템 기반 중장기 개방계획의 2026년 조기 개방계획에 따라 개방한 광주광역시 북구 거주자 우선 주차장 통합 관리시스템에 등록된 거주자 우선 주차장 배정 기준입니다. 이 데이터를 통해 주차장 배정 가준에 대해 알 수 있으며 다른 거주자 우선 주차장 배정 기준과 비교할 수 있습니다. 주차배정고유번호,점수,주차거리,현주소지 거주기간,연령별,기배정횟수,가산점,등록일시,수정일시,삭제 플래그,데이터기준일자 항목에 대한 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.주차배정고유번호는 신청자에 분류에 따른 번호입니다.점수는 선청자의 총 점수를 말합니다.주차거리는 직선거리가 아닌 실 이동거리 또는 건물의 주출입구(중심)에서 주차구획 중심까지 거리이며 거리구분은 30m미만, 30m이상~50m미만, 50m이상~70m미만, 70m이상으로 구분되어 있습니다.자세한 점수제도에 관한 부분은 광주광역시 북구 거주자 우선 주차장 사이트를(https://bukgupark.gwangju.kr/kor/menu/sub.do?menuId=1_6) 참조해주시기 바랍니다.* 민감정보가 포함된 컬럼명은 제외하였습니다.
