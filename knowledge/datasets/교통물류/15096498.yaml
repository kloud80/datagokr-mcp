summary_user: 대구광역시 북구 관내 불법주정차 상습 발생지 142곳을 지점별로 담은 파일로, 지번주소와 2018~2021년 5월 연도별·누적 민원 발생건수, 현장정보, 경위도를 한 행에 담는다. 주민이나 분석가가 '북구에서 불법주정차 민원이 가장 많이 몰리는 곳은 어디이고 해마다 늘었나 줄었나'를 확인하거나 단속·주차시설 배치 우선순위를 검토할 때 쓴다. 전역 조인 키는 없어서 주소 문자열 매칭이나 경도·위도 좌표를 기준으로 단속카메라·주차장 위치 데이터와 공간적으로 겹쳐 본다.
description_portal: 먼저 해당 데이터는 2021년 공공데이터 기업매칭 사업 완료시 구축된 1회성 데이터이며, 더이상 업데이트가 진행되지않음을 말씀드립니다.대구광역시 북구 관내의 불법주정차 상습 발생지에 대한 142개의 데이터가 존재하며, 데이터 수집기간(2018년~2021년 5월)까지의 불법주정차 상습 발생지에 대한 데이터로 불법주정차 상습 발생 주소(지번주소), 주소별 총 민원발생 누적건수, 2018년 민원 발생건수, 2019년 민원 발생건수, 2020년 민원 발생건수, 2021년 민원 발생건수, 현장정보, 경도, 위도 등의 항목을 제공합니다.
