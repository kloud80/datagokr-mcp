description_portal: 데이터 개요국토교통부_연도별_국내_국제항공수송실적은 연도별로 집계된 항공운송 실적 데이터를 제공합니다. 국내선과 국제선의 운항편수, 여객 수송량, 화물 수송량을 항목별로 분류하여 통계화한 자료로, 항공산업 동향 분석 및 수요 예측, 정책 기초자료로 활용 가능합니다.데이터 제공 항목연도통계 수집 기준 연도국내운항실적(편)해당 연도에 국내선에서 집계된 총 운항 횟수국제운항실적(편)해당 연도에 국제선에서 집계된 총 운항 횟수국내여객수송실적(명)국내선 이용 여객 총 인원 수국제여객수송실적(명)국제선 이용 여객 총 인원 수국내화물수송실적(톤)국내선 화물 총 수송량 (톤 단위)국제화물수송실적(톤)국제선 화물 총 수송량 (톤 단위)활용 안내연도별 항공시장 성장 추이 분석포스트 코로나 항공 수요 회복세 진단국내외 항공정책 수립 시 참고자료항공운송 인프라 확충 또는 감축 타당성 검토데이터 해석 시 유의사항해당 데이터는 국토교통부 항공통계시스템 및 항공정보포털시스템(AirPortal) 기반의 집계값으로, 정기적으로 업데이트됩니다.수송실적은 실제 탑승/운송 기준이며, 스케줄 기준 항공편수와 차이가 있을 수 있습니다.데이터 구성 예시구분2023년2024년2025년국내운항실적(편)191064186784181873국제운항실적(편)411299519085548998국내여객수송실적(명)321896763113175030245051국제여객수송실적(명)683190158892662194548031국내화물수송실적(톤)212436203801196741국제화물수송실적(톤)374148241915054272011
