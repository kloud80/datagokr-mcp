summary_user: 광주 서구가 운영하는 불법주정차 단속 문자알림 서비스의 현황을 순번별로 단속시간, 단속 장소, 사용된 단속장비를 담은 CSV 파일(약 11KB)이다. 구청 교통 담당자나 분석가가 서구 안에서 단속이 자주 일어나는 장소와 시간대, 장비별 단속 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장소 이름 매칭이나 같은 기관(서구) 기준으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 광주광역시 서구에서 운영 중인 불법주정차 단속 문자알림 서비스에 대한 현황 정보를 담고 있으며, 알림 발송 순번, 단속 일시, 단속 장소, 사용된 단속 장비 정보 등을 항목별로 수록한 자료입니다. 해당 서비스는 차량 소유자가 단속 전후로 알림을 받을 수 있도록 하여 자발적인 이동을 유도하고, 민원 감소 및 교통 질서 유지를 목표로 운영됩니다.제공되는 정보는 불법주정차가 자주 발생하는 장소 및 시간대를 정량적으로 분석할 수 있도록 하며, 단속 장비별 활용 현황을 파악해 장비 운용 효율성 진단에도 활용할 수 있습니다. 또한 반복적으로 단속이 발생하는 지역을 특정함으로써, 교통약자 보호구역, 학교 주변, 소방도로 등 중요구간에 대한 정책적 개입 근거자료로도 활용 가능합니다.이 데이터는 불법주차 계도 중심의 행정으로 전환하거나, 시민 대상 맞춤형 교통안전 캠페인 운영, 교통 정책 개선, CCTV 설치 등 사전 예방 기반 정책 수립에도 유용하게 쓰일 수 있습니다.
