summary_user: 위험물질운송차량 1,100대에 설치된 졸음운전방지장치(DSM)가 감지한 졸음운전 위치를 도로 링크(노드링크) 단위로 묶어, 기준년월별 발생횟수·발생등급·링크길이·도로명을 담은 전국 범위의 집계 파일이다. 교통안전 담당자나 분석가가 "위험물 운반차 운전자가 어느 도로 구간에서 졸음운전을 자주 하는가, 캠페인이나 휴게공간을 어디 앞에 두어야 하는가"를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 링크아이디를 노드링크 체계의 다른 도로 데이터와 맞추거나 도로명으로 대조해 이어 쓴다.
limits: 전국 범위지만 행정구역 단위로 나뉘지 않은 비공간 자료여서 시군구별 집계는 바로 나오지 않는다. 다른 데이터와 공통 코드로 바로 붙지 않으므로 링크아이디나 도로명 매핑 작업이 필요하다.
