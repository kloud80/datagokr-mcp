description_portal: 한국교통안전공단에서는 2022년 1월부터 위험물질운송차량 1,100대에 졸음운전방지장치(DSM)를 설치하였고, 운전자의 얼굴을 AI로 분석하여 눈 깜박임 등을 통해 졸음운전 및 전방주시태만 여부를 실시간으로 감지하였으며, 해당 위치 정보를 노드링크 방식으로 데이터화하였다. 졸음운전이 자주 발생한 구간은 졸음운전다발구간으로 분류하였고, 이를 활용하여 해당 구간 전에 운전자 대상 캠페인을 실시하거나 휴게공간을 마련하는 등 사고 예방을 위한 정책에 활용하고자 한다.
