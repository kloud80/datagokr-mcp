summary_user: 경기도버스운송관리시스템(BMS)에서 나온 자료로, 버스 노선마다 소속 운수업체와 그 노선을 맡는 영업소(차고지·정비·운행관리 거점)의 식별자를 한 행에 이어 기록한 노선 단위 원장입니다. 교통 분석가나 지자체 담당자가 '이 노선은 어느 업체의 어느 영업소가 운영하나', '업체별로 노선이 영업소에 어떻게 배정돼 있나'를 확인하는 데 쓴다. 노선 ID(route_id)로 경기도 버스 노선·정류장 정보와, 업체 ID(entrps_id)·영업소 ID(buzplc_id)로 같은 기관의 업체·영업소 정보와 맞춰 쓰지만, 실측상 전역 조인 키는 없어 같은 BMS 계열 코드끼리만 연결된다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 노선별 영업소 정보로, 각 버스노선이 소속된 영업소를 업체와 함께 연계하여 기록한 자료입니다. 주요 항목은 ‘업체ID’, ‘노선ID’, ‘영업소ID’로 구성되어 있으며, 특정 노선이 어떤 업체의 소속이고, 해당 노선을 관리·운영하는 영업소가 어디인지 파악할 수 있습니다. ‘영업소ID’는 버스 차량의 출발지, 정비, 주차, 운행관리 등의 기능을 수행하는 장소를 식별하는 코드로, 운영 효율성 및 관리 책임 분배에 중요한 역할을 합니다. 교통운영체계 최적화, 업체별 노선 배정 분석 등에 활용될 수 있습니다.
