description_portal: '- 충청남도 금산군의 현재 운영중인 일반화물자동차 운송사업자 업체현황을 설명합니다.- 일반화물은 과거 2대 이상의 화물자동차를 등록하면 일반화물, 1대의 화물자동차를 등록하면 개인(개별)화물사업체로 인정했으나,    2019년이후 운송업의 대형화,효율화를 위해 20대이상의 화물자동차를 등록할 때만 일반화물사업체로 인정해주고 있습니다.- 업체명, 면허종류, 차량대수, 소재지, 운영여부, 데이터기준일 등으로 구성 된 데이터입니다.- "26년 현재, 차량대수가 20대가 넘는 업체 및 개인은 9개 업체이며, 이는 작년과 동일합니다.-전체적으로 금산군 일반화물운송사업체는 "25년  42로 동일하며, 등록 차량 대수는   "25년 510대에서 "26년 514대로 증가한 것으로 보이나, 실제 차량 수의 증가라기 보다는   오류로 기입된 업체 및 차량수를 정정함에 기인합니다.-이 데이터를 통해 금산군의 물류기반의 변화 추이를 진단하고,그에 따른 정책 수립, 투자유치, 경제 분석 등의 기초 자료로 활용하여 정책적 시사점과 기회 요인을 발굴하는 데 기여할 수 있습니다.'
