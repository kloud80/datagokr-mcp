summary_user: 제주특별자치도에서 발생한 화물차 관련 교통사고를 기준 연월과 차량 용도(대분류·소분류)별로 묶어 사고 건수·사망자 수·부상자 수를 담은 집계 통계이며, 포털 설명상 기간은 2005~2019년이다. 교통안전 담당자나 분석가가 "제주에서 화물차 사고와 사상자가 해마다 늘었나 줄었나, 어떤 용도의 화물차에서 많았나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 사고 통계와는 연월이나 용도 분류 이름을 맞춰 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도 내에서 2005년부터 2019년까지 발생한 화물차 관련 교통사고의 연도별 사고 건수, 사망자 수, 부상자 수를 집계한 통계자료이다. 제공기관은 제주도이며, 자료는 CSV 형식으로 공개되어 있어 누구나 열람·활용할 수 있다. 본 통계는 화물차를 포함한 상용차량 운행에 따른 사고 규모와 추세를 객관적으로 파악할 수 있도록 하며, 교통안전 정책 수립, 물류 운송 체계 점검, 사고 예방 대책 마련, 보험 및 보상 제도 평가, 위험 노선 분석 및 안전 인프라 정비 우선순위 설정 등 다양한 행정 및 정책 결정의 기초자료로 활용될 수 있다. 특히 지역별 또는 연도별 화물차 사고 변화를 분석함으로써 운송량 증가, 도로 환경 변화, 차량 관리 정책 변화 등이 사고에 미친 영향을 진단할 수 있다.
