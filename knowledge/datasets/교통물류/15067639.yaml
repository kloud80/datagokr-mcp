description_portal: 철도 통합 연표를 제공합니다.철도 노선과 철도역의 주요 역사적 사건을 연도별로 정리한 자료입니다.상세 내용에 국내 철도노선별 철도역별 선로구간별의 주요 사건이 정리되어 있습니다.국내 철도 노선/철도역/철도시설의 착공에서 준공후 개통까지의 정보를 연도/월/일/별로 정보를 제공하고 있습니다.철도역의 착공/준공/영업개시 및 역명의 변경등 주요 내용의 정보를 제공합니다.사건의 중요도는 1부터4까지 제공됩니다. 1이 가장 높고 4가 가장 낮습니다.(제공정보:연표순번,중요도,월,관계노선,연도,상세내용,일,관계역,요약내용,등록일자,관련기관)
