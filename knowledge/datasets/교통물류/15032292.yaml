summary_user: 대구광역시 북구 관내 교통유발부담금 부과 금액(백만원)을 연도별로 집계한 통계로, 포털 설명상 2020년~2025년을 다루며 파일 크기가 185바이트인 아주 작은 표다. 북구 주민이나 분석가가 "북구에서 연도별로 교통유발부담금이 얼마나 부과됐고 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체 교통유발부담금 자료와는 연도(구분)와 기관명을 맞춰 이어 쓴다.
description_portal: 구광역시 북구 관내 교통유발부담금 부과 내역에 대한 데이터로 연도별(2020년~2025년)  통계정보를 제공합니다. "교통유발부담금"은 도시교통의 원활한 소통과 교통편의 증진을 위해 인구 10만명 이상 도시를 "도시교통정비 지역"으로 지정하여, 교통혼잡을 유발하는 일정 규모 이상의 시설물(해당 시설물의 각 층 바닥면적의 합계(연면적)가 1,000㎡ 이상인 시설물)에 부과하는 경제적 부담금을 의미합니다. 이는 "원인자 부담의 원칙"에 따라 혼잡 유발자에게 부과되며, 궁극적으로는 자가용 이용을 억제하고 대중교통 이용을 유도하여 교통 수요를 관리하는 데 목적이 있습니다.
