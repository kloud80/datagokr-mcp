summary_user: 인천교통공사가 운영하는 도시철도 인천1호선의 월별 전력사용량(kWh)과 전기요금(원)을 두 해 비교 형태로 담은 노선 단위 집계 파일(csv, 743 bytes)이며, 전년대비 증감도 함께 들어 있다. 철도 에너지 관리나 운영비를 분석하는 사람이 '인천1호선의 월별 전력 사용량과 전기요금이 전년보다 얼마나 늘거나 줄었나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 월(월별 컬럼)을 기준으로 같은 기관의 다른 노선이나 다른 도시철도 운영기관의 전력 현황 자료와 이름을 맞춰 이어 쓴다.
description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선의 2024년 12월 31일 기준 월별 전력사용량 현황자료입니다. 해당 데이터는 월별, 2023년전력사용량(kWh), 2024년 전력사용량(kWh), 전년대비증감, 2023년전기요금(원), 2024년전기요금(원)) 항목으로 구성되어있습니다.인천1호선은 검단호수공원역에서 송도달빛축제역까지 총 33개역이 운영 중에 있습니다.2025년 6월 28일에 개통한 인천1호선 연장3개역(검단호수공원역, 신검단중앙역, 아라역)의 전기사용량은 포함되지않았습니다.
