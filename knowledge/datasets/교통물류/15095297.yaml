description_portal: 본 데이터는 대구광역시 서구 관내 주요 도로변에 식재된 은행나무 가로수의 흉고직경별 분포 현황을 정리한 자료이다. 노선별로 분류하여 각 수목의 흉고직경(BH) 기준을 B20cm 이하부터 B66-70cm까지 세분화하고, 이에 해당하는 교목 수량을 항목별로 제공한다. 본 자료는 녹지 공간의 유지·관리 및 도시 경관 개선을 위한 기초자료로 활용 가능하며, 수목 성장 추이 분석과 생육 환경 조성에도 유용하다. 특히 노선별로 구체적인 직경별 데이터를 제공함으로써 정비 우선순위 결정, 수종 관리계획 수립 등 정책적 활용도를 높이고자 하였다. 사용자에게는 가로수 규모 및 성장단계 정보를 제공하여 생활환경 및 도시 생태에 대한 이해를 돕는다.
