summary_user: 한국도로공사 고속도로 노선별 버스전용차로 구간(시작·종료 노드)에 대해 일자별 운영시간과 방향, 시행일 유형(평일·토요일·일/공휴일·명절)을 담은 운영 이력 자료로, 범위는 전국이며 공간 좌표 없이 노선·노드 단위로 제공된다. 교통 분석가나 정책 담당자가 "명절이나 주말에 경부선 버스전용차로가 어느 구간에서 몇 시간 운영됐나"를 확인하고 시행일 유형별 운영 패턴을 비교하는 데 쓴다. 전역 조인 키는 없어서 노선번호(route)와 노드ID·노드명을 같은 기관(한국도로공사)의 다른 고속도로 데이터와 이름·코드로 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 버스전용차로 운영이력 자료로, 노선별 버스전용차로 구간의 운영 내역을 OpenAPI 형태로 제공한다.제공 형식은 XML과 JSON이며, 출력 항목에는 일자, 노선번호, 시작노드ID와 명칭, 종료노드ID와 명칭, 방향(S:기점/E:종점), 운영시간, 버스전용차로시행일구분명과 코드가 포함된다.이 데이터는 각 노선과 구간에서 버스전용차로가 운영된 시간을 기록한 자료로, 평일, 토요일, 일/공휴일, 명절 등 시행일 유형별 운영 현황을 분석하는 데 유용하다.이를 통해 시간대별·구간별 운영 패턴을 파악하고, 정책의 효과를 평가할 수 있다.또한 대중교통 효율성 제고, 혼잡 완화 전략, 교통 서비스 개선 등 다양한 분야에서 활용된다.도로 이용자와 정책 담당자에게 운영 현황을 명확히 제공하는 기초 자료가 된다.
