description_portal: '강원특별자치도 강릉시 관내에 설치된 옐로카펫 현황을 정리한 데이터로, 행정동·시설별 설치 위치와 도로 부속물 현황을 함께 확인할 수 있도록 구성된 자료입니다.연번: 옐로카펫 설치 정보를 구분하기 위한 일련번호행정동: 옐로카펫이 설치된 강릉시 행정동 명칭시설명: 옐로카펫이 설치된 시설 명칭(예: 초등학교, 어린이집, 유치원 등)주소: 해당 시설의 도로명 주소옐로카펫세부위치: 시설 주변 중 옐로카펫이 실제로 설치된 구체적인 위치(예: 정문 앞 횡단보도 모서리, 교차로 코너 등)도로부속물설치현황: 옐로카펫 설치 지점 주변에 함께 설치된 도로 부속물(볼라드, 과속방지턱, 안전표지판, 신호등 등) 현황데이터기준일자: 옐로카펫 설치 및 도로부속물 현황 정보가 확인·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 어린이보호구역 및 통학로 주변 옐로카펫 설치 위치와 교통안전시설 현황을 한눈에 파악할 수 있도록 하여, 보행 안전 취약지역 점검, 추가 설치·정비 계획 수립, 어린이 교통안전 정책 수립, 생활안전 지도로의 시각화 등 교통·보행 안전 강화를 위한 기초 자료로 활용할 수 있는 공공데이터입니다.'
