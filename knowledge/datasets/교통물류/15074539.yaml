summary_user: 수원도시공사가 관리·운영하는 공영주차장을 주차장 한 곳당 한 행으로 담은 파일(csv, 약 12KB)로, 주차장명·구분·유형, 도로명·지번 주소, 주차구획수, 급지, 운영요일과 기본·추가 요금, 1일 주차권·월정기권 요금, 결제방법, 전화번호를 담는다. 수원 시민이나 방문객이 '이 근처 공영주차장의 기본요금과 월정기권 가격은 얼마인가'를 확인하거나, 분석가가 공사 운영 주차장의 면수·요금 수준을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소나 주차장명 매칭으로만 잇고, 전국주차장정보표준데이터(주차장관리번호·좌표·요금·면수 원장)와는 이름·주소를 맞춰 대조한다.
