summary_user: 경기도버스운송관리시스템(BMS)으로 수집한 정류소 실측 결과를 노선-정류소 연결 한 건씩 담으며, 각 행은 이력ID·노선ID·정류소ID·노선명·정류소명으로 이루어진다. 교통 분석가나 지자체 담당자가 "이 노선이 실제로 어느 정류소들을 지나는가"를 확인하고 정류소 서비스 수준이나 신규 정류장 설치를 검토할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 버스 노선·정류장 원장이나 실시간 도착 데이터와는 노선ID·정류소ID 같은 경기도 기관 코드나 노선명·정류소명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)을 통해 수집된 정류소 실측 정보로, 특정 노선이 실제로 운행하는 정류소 위치 및 식별정보를 기반으로 정류소별 현황을 제공합니다. 데이터는 ‘이력ID’, ‘노선ID’, ‘정류소ID’, ‘노선명’, ‘정류소명’ 항목으로 구성되며, 노선과 정류소 간의 실제 연결 구조를 파악할 수 있도록 되어 있습니다. ‘이력ID’는 정류소 및 노선 실측 결과의 고유 식별자로서 이력 관리에 활용되며, ‘정류소ID’는 각 정류장을 고유하게 식별하는 코드입니다. 정류소 위치 기반 분석, 노선 최적화, 정류소 서비스 수준 평가, 정류장 개선 및 신규 설치 계획 등에 활용될 수 있습니다.
