summary_user: 전국 시군구별로 등록 자동차의 연간 주행거리를 백만km 단위로 집계한 통계 파일로, 전체·비사업용·사업용 용도마다 승용·승합·화물·특수차로 나눠 담고 시도 합계 행과 시군구 행이 함께 들어 있다. 교통·환경 분석가가 '우리 지역 화물차가 1년에 얼마나 달리는가', '사업용 차량 주행이 많은 시군구는 어디인가' 같은 질문에 답하거나 지역별 배출량·교통량을 추정할 때 쓴다. 실측 컬럼에 행정코드 같은 전역 조인 키가 없어서, 시군구별 자동차 등록대수나 인구 통계와 붙이려면 시도·시군구 이름을 맞춰 매핑해야 한다.
description_portal: < 용도별 차종별 시군구별 연간 자동차 주행거리 - 단위(백만km)>국내에 등록되어 도로를 운행 중인 자동차의 용도별, 차종별 시군구별 연간 자동차 주행거리 현황입니다.우리나라 시군수별로 등록된 자동차 대수, 자동차 용도, 자동차 주행거리를 비교분석한 통계입니다. 전체용도의 통계와 비사업용 자동차와 사업용 자동차로 구분되며, 각각 승용차, 승합차, 화물차, 특수차로 세분 구분하여 제공하고 있습니다. 특별시, 광역시, 광역도의 합계와 시군구를 구분하고 있으며 연간주행거리를 백만km단위로 제공하고 있습니다.
