summary_user: 한국철도공사가 전국 역별 화물 하치장의 규모·잔여·사용 면적, 역 내 세부 구역별 면적, 고객의 하치장 사용 신청 건별 신청일자·구역 요금·신청 면적을 담은 파일 데이터다. 철도 화물 사업자나 물류 분석가가 "어느 역 하치장에 빈 공간이 얼마나 남았고 구역 요금은 얼마인가"를 확인하거나, 역별 하치장 활용률과 야적 수요를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 철도 데이터와는 역명을 이름으로 맞춰 연결해야 하며, 데이터 안에서는 역명·구역일련번호·신청일련번호로 하치장·구역·신청 내역을 서로 잇는다.
limits: 표준 역코드 같은 전역 조인 키가 없어 다른 역·시설 데이터와 붙일 때는 역명 표기를 직접 대조해야 한다. 범위는 전국이며 좌표가 없는 비공간 데이터라 지도 위치 분석에는 바로 쓰기 어렵다.
