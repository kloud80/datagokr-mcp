summary_user: 서울교통공사가 체결한 계약을 한 건씩 담은 목록으로, 계약번호·계약건명·계약 담당 부서·계약일자를 행 단위로 담는다(CSV 파일, 약 80KB). 사업자나 분석가가 '서울교통공사가 어떤 부서에서 언제 어떤 계약을 맺었는가'를 확인하거나, 관심 있는 사업의 계약 건을 찾는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없으므로, 포털 설명에 따라 계약건명으로 나라장터(G2B)에서 검색하는 식으로 이름 기준으로만 연결한다.
description_portal: 해당자료는 서울교통공사의 계약체결 현황을 나타내는 자료로 연번, 계약번호, 계약건명, 계약소속부서명, 계약일자로 구성되어 있습니다. 해당자료는 매년 5월 말, 10월 말 기준으로 2번 데이터를 업로드 하며, 최신 자료는 2025년 11월 ~2026년 5월에 체결된 계약 목록 입니다. 목록에 있는 계약 건은 나라장터(G2B 시스템)을 통해 추진되며, 건명으로 해당 시스템에서 검색이 가능합니다. 데이터에 대한 추가 문의는 서울교통공사 계약처(02-6311-9317)로 연락주시기 바랍니다.
