summary_user: 한국교통안전공단이 운영하는 화물운송종사자격·버스운전자격 체험교육(필기시험 대체 과정)의 회차별 계획을 담은 파일로, 구분·시행·회차·교육인원·합격점수·장소와 접수·교육 시작일과 종료일을 한 행씩 담는다(csv 약 4KB 규모). 필기시험 응시가 어려운 운전자가 상주·화성 교통안전체험센터 중 어디서 언제 접수하고 교육받을 수 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장소명(체험센터 이름)이나 같은 기관 자료와 이름으로만 맞춰 잇는다.
description_portal: '화물운송종사자격증 또는 버스운전자격증 취득을 위한 교통안전 체험교육에 대한 정보를 데이터 형식으로 제공합니다. 이 교육은 필기시험(CBT) 응시가 어려운 분들을 위해 마련되었으며, 교육 이수 시 필기시험을 대체하여 자격을 취득할 수 있습니다.1. 체험교육 기본 정보자격 종류: 화물운송종사자격증, 버스운전자격증교육 방식: 체험교육 (실기 및 필기형)필기시험 대체 여부: 필기시험(CBT) 대체 가능교육 시간:화물운송종사자격: 2일, 총 16시간버스운전자격: 3일, 총 24시간2. 자격 요건화물운송종사자격: 3년 이내 운전적성정밀검사(신규검사) 적합 판정 필수공통:운전면허: 2종 보통 이상운전 경력: 2년 이상 (면허 취소 및 정지 기간 제외)3. 체험교육 장소상주교통안전체험센터:주소: 경상북도 상주시 청리면 마공공단로 80-15호 (마공리 1238번지)숙박 가능 여부: 숙박 시설 이용 가능 (1박 20,000원, 2인실 기준, 센터 사정에 따라 변동 가능)화성교통안전체험센터:주소: 경기도 화성시 송산면 삼촌로 2004. 신청 절차 및 관련 웹사이트접수처: TS국가자격시험 홈페이지인터넷 주소: https://lic.kotsa.or.kr/tsportal/main.do신청 경로: 홈페이지 접속 후 [도로자격] - [체험교육(화물·버스) 원서접수] 메뉴 이용필수 확인 사항: 원서접수 페이지 내 **"체험교육안내"**를 반드시 숙지 후 신청중복 접수 제한: 화물운송종사 자격시험(CBT)과 체험교육 과정 동시 접수 불가기타 교육 관련 웹사이트: (개인택시면허 양수교육, 사고야기자 대상 법정의무교육 등) 한국교통안전공단 교육관리시스템 (https://tslms.kotsa.or.kr/main.do)5. 교육 입교 시 지참 및 제출 서류-운전면허증-사진 2매 (최근 3개월 이내 촬영, 3.5×4.5cm 컬러사진)6. 교육 비용(화물)192,000원(버스) 288,000원'
