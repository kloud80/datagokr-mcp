summary_user: 대구광역시 북구 관내에 설치된 자전거 공기주입기를 한 곳씩 담은 목록으로, 설치 위치·지번 및 도로명 주소·종류(태양광식·전기식·수동식)·위도와 경도를 담는다(약 3.5KB 크기의 CSV 파일). 자전거 이용자가 "집이나 지하철역 근처에서 바람 넣을 곳이 어디인가"를 찾을 때, 또는 구청·분석가가 자전거도로 주변의 편의시설 분포를 점검할 때 쓴다. 전역 조인 키나 행정 코드는 없어서, 다른 데이터와는 위도·경도 좌표나 주소 문자열로 맞춰 자전거도로 노선이나 공공자전거 대여소 위치와 겹쳐 본다.
description_portal: 대구광역시 북구의 자전거 공기주입기 설치 현황 데이터입니다.자전거 공기주입기는 자전거 타이어에 공기를 주입하는 데 사용되는 도구입니다. 일반적으로 펌프 형태를 하고 있으며, 밸브를 통해 타이어 내부로 공기를 주입하여 적정 공기압을 유지하는 역할을 합니다.자전거 공기주입기는 주로 자전거 통행이 많은 자전거 도로, 지하철역 인근 위주로 설치되어 있습니다.해당 데이터는 북구 관내에 설치된 자전거 공기주입기의 설치위치, 주소(지번주소, 도로명주소), 공기주입기의 종류(태양광식, 전기식, 수동식), 설치된 공기주입기 위치의 위도, 경도 정보를 제공합니다.
