description_portal: '○ 통계개요* 통계명 : 보도 현황(재질별)* 통계종류 : 서울시 특별시도상 보행도로의 현황을 재질별로 제공하는 일반ㆍ보고통계* 근거법령 : 「도로법」제39조 및「도로의 유지ㆍ보수 등에 관한 규칙」제3조* 작성목적 : 서울시 특별시도상 보행도로 현황을 재질별로 파악하여 보행도로에 대한장래 계획의 수립과 도로유지ㆍ관리 및 행정에 필요한 기본자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 도로관리과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구ㆍ해당기관내용 - 특별시도상 보행도로의 재질별(소형고압블록, 콘크리트류, 화강석류 등) 연장 및 면적 현황○ 용어설명* 도로의 종류 : 도로법 제8조에 의거 고속국도, 일반국도, 특별ㆍ광역시도, 지방도, 시ㆍ군도, 구도로 분류됨* 특별ㆍ광역시도 : 서울특별시와 부산, 대구, 인천, 광주, 대전, 울산광역시의 구역내 도로* 도로연장 : 도로종류별 총 길이를 의미○ 기 타* 특별시도상 보행도로로 자치구상 보행도로는 제외됨○ 출 처 : 서울특별시 도로관리과'
