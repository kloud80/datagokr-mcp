summary_user: 한국공항공사가 운영하는 공항(인천국제공항 제외)의 국제선 운항실적을 공항·일자·시간대·노선별로 도착·출발 편수로 집계한 파일 데이터이며, 포털 CSV는 약 2KB 규모로 작다. 공항 운영자나 분석가가 '어느 공항의 어느 시간대가 국제선 첨두시간인가, 그 시간대에 몇 편이 뜨고 내렸나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 항공통계·공항코드 데이터와는 공항명·노선명을 이름으로 맞춰서만 연결한다.
limits: 편 단위 실시간 출도착·결항·지연이 아니라 시간대별 집계 실적이므로 오늘의 개별 운항편 상태는 알 수 없다. 공항코드 같은 공통 키가 없어 이름 매핑이 필요하고, 인천국제공항 실적은 포함되지 않는다.
