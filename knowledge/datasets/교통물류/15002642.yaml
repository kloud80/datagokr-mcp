description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 전국 14개 공항을 운영하고 있는 공사입니다.한국공항공사에서 제공하는 해당 데이터는 국내, 국제공항 시간대별 운항실적 통계 자료에 대한 데이터로 공항별 시간대, 노선, 도착, 출발 운항편 실적 등의 항목을 제공합니다.공항에서 가장 운항이 많은 첨두시간을 알고싶거나 첨두시간에 공항의 운항실적을 알고싶으면 해당정보를 활용하시면 됩니다.추가 문의사항이나 추가 요구사항이 있으시면 02-2660-4807로 문의주시기 바랍니다.
