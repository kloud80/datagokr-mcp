summary_user: 가해운전자 차종과 피해운전자 차종의 조합별로 교통사고 건수와 사망자·중상자·경상자·부상신고자 수를 담은 전국 단위 연간 집계 통계로, 경찰이 조사·처리한 인적 피해 사고만 포함한다. 교통안전 분석가나 정책 담당자가 '승용차가 이륜차나 보행 관련 차종과 부딪힌 사고에서 사망자가 얼마나 나오는가'처럼 차종 간 충돌 조합별 피해 규모를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 교통사고 통계와는 차종 이름을 맞춰서만 연결할 수 있다.
limits: 전국 단위 비공간 집계라 지역·도로 구간별 분석이나 표준노드링크 같은 공간 데이터와의 연결에는 쓸 수 없다. 공통 조인 키가 없어 다른 데이터와 붙이려면 차종명을 직접 매핑해야 한다.
