summary_user: 경기도버스운송관리시스템(BMS)에 등록된 버스 차량의 변경 이력을 이력 건별로 담으며, 차번호·제조년도·모델명·저상버스 여부·승차정원·검사유효기간·등록일·폐차일과 사유·구입금액·보험업체 등을 포함한다. 분석가나 정책 담당자가 '경기도 시내버스 중 제조 후 오래된 차량과 저상버스 비율이 업체별로 어떤가' 같은 노후화·안전 관리 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 운수업체 ID(bus_co_id)·법정동 코드·차번호 같은 기관 내부 코드나 이름 매핑으로만 다른 경기도 버스 데이터와 연결한다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에 등록된 버스 차량의 변경 이력 정보를 포함하며, 각 차량의 운행 및 등록 관련 상세 내역을 제공합니다. 주요 항목으로는 이력ID, 차량ID, 차번호, 제조년도, 모델명, 저상차 여부, 차종류, 승차정원, 검사유효기간, 차량등록일 및 폐차일자 등이 있으며, 그 외에도 보험업체, 차량구입금액, 단말기설치내역, 감지센서 여부, 안전장치 설치 여부 등의 다양한 정보가 포함됩니다. 이 데이터는 차량의 전체 생애주기 관리, 정책 수립을 위한 통계 분석, 대중교통 안전관리, 운수업체의 운영 효율화 및 차량 노후화 관리 등에 유용하게 활용될 수 있습니다.
accrual_periodicity: 수시
