summary_user: 서울특별시 도로 차로나 교차로 바닥에 그려진 문자·숫자·기호 표시를 한 건씩 담은 시설물 데이터로, 관리번호·방향·길이·표시 내용·종류코드·설치일·교체일·공사관리번호·관할 경찰서와 구 코드 등을 포함한다. 교통 운영 담당자나 분석가가 특정 구에 어떤 노면 문자표시(제한속도, 차로 용도 등)가 언제 설치·교체됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 구코드(GU_CD)·경찰서코드 같은 서울시 내부 코드나 이름 매핑으로만 다른 데이터와 연결한다.
description_portal: '서울특별시 노면의 문자표시 정보입니다. 주요정보 : 문자표시관리번호, 방향, 길이, 내용, 고가, 경찰서코드, 구코드,작업구분, 표출구분, 도로구분, 관할사업소,  설치일, 교체일, 공사관리번호, 문자표시관리번호, 문자표시 종류코드, 등의 정보를 제공합니다.*용어설명 : 노면 문자 표시란? - 도로 차로 위 또는 교차로 바닥에 그려진 글자나 숫자, 기호 - 운전자에게 진행 방향, 제한 속도, 차로 용도, 주차 제한 등 정보를 시각적으로 안내- 일반적으로 흰색으로 표시, 버스전용차로는 노란색 글자 사용※ 제공부서 : 서울특별시 교통실 교통운영관 교통운영과(02-2133-2476)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
