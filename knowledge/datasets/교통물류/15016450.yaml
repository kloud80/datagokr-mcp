summary_user: 자동차리콜센터에 접수된 자동차 제작결함 신고를 건별로 담은 전국 단위 파일(CSV)로, 접수일자·제작사·차명·모델년도를 기록한다. 소비자나 분석가가 "특정 제작사·차종·연식에 결함 신고가 언제 얼마나 몰렸는가"를 확인하거나, 리콜 전 동일 차종의 신고 추이를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 리콜 현황 등 다른 자동차 데이터와는 제작사명·차명·모델년도의 이름 매칭으로만 이어 쓸 수 있다.
limits: 차량등록번호나 차종 코드 같은 공통 키가 없어 등록·검사 데이터와 정확히 연결되지 않고, 제작사·차명 표기를 맞춰야 한다. 실측 필드는 접수일자·제작사·차명·모델년도뿐이라 결함 장치나 결함 내용별 분석에는 쓰기 어렵다.
