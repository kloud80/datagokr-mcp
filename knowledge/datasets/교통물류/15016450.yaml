description_portal: 자동차리콜센터 자동차제작결함신고정보 안내- 전기차, 수소차 등 미래지향적인 자동차가 출시되고 있는 현재 신기술로 인해 발생되는 여러가지 결함에 대해 발빠르게 대응하여 국민의 안전을 도모하기 위해 자동차 결함신고를 접수하고 잇습니다.- 소유자가 본인 차량에 대해 결함이나 정상작동되지 않는 부분에 대해 신고할 수 있습니다.- 수집된 정보를 통해 결함내용, 차종, 장치 등으로 분류하여 일정기간동안 동일결함에 대한 발생빈도 및 지속성, 안전도에 직접적인 영향을 미치는 결함여부, 외국의 유사 리콜사례 등을 분석하고 있습니다.- 국민은 자동차 결함으로 인한 교통사고 방지로 국민의 생명과 재산을 보호하는데 기여할 수 있습니다.
