description_portal: 본 데이터는 한국도로교통공단 교통과학연구원이 발간한 ‘교통기술자료집’ 목록을 정리한 것이다. 2011~2018년 발간 건을 대상으로 발행연도·발행월·제목·저자·원문 링크를 수록하여 연구성과 탐색과 원문 열람을 돕는다. 주요 주제는 노면전차 법령 정비, 인공지능 기반 도로안전도 평가, 보호구역 개선, 디지털 CCTV 가이드라인 등이다. 목록은 연구자·정책 담당자·기업 기술기획자에게 참고 색인으로 제공되며, 기관 포털·도서관 연계 검색 품질 향상에 기여한다. 파일 형식은 CSV이며 필드는 ‘발행년, 발행월, 제목, 저자, 원문파일링크’로 구성된다. 데이터는 보완 갱신을 통해 최신 발간물 반영이 가능하고, 통계 분석·주제 분류·인용 관리 등 2차 활용에 적합하다.
