summary_user: 부산도시철도 2호선 각 역의 출구번호별로 인근 주요시설(관공서, 학교, 병원, 종교시설, 아파트, 공원 등) 이름을 한 행씩 담은 원천 목록 파일이며, 철도운영기관·노선명·역명·출구번호·주요시설명으로 구성된다. 부산 시민이나 방문객이 '○○병원에 가려면 2호선 어느 역 몇 번 출구로 나가야 하나'를 확인하거나, 분석가가 출구 단위의 역세권 시설 분포를 정리하는 데 쓴다. 전역 조인 키가 없어 다른 역·출입구 데이터와는 역명·출구번호 문자열을 맞추거나 같은 기관의 다른 노선 출구 데이터와 이어 붙여 쓴다.
description_portal: 부산2호선에 포함된 도시광역철도역들의 철도운영기관명,선명,역명,출구번호,출구별 주요시설명 등의 데이터 입니다.지하철 역의 출구 번호에 대한 주요건물(관공서, 학교, 병원, 종교시설, 아파트, 공원 등)시설 정보 등이 포함되어 있습니다. 지하철 출구번호는 어떻게 매겨질까요? 1. 수도권지역의 경우 1호선과 나머지 노선들이 출구번호를 매기는 방식이 다릅니다. 먼저 1호선의 경우 [상행선 방향 좌측 맨 뒤쪽] 출구를 1번 으로 하고, 2번 출구부터는 [시계방향] 으로 매겨집니다. 그 외 나머지 노선들에 대해서는 [상행선(2호선은 외선) 방향 우측 맨 앞쪽] 출구를 1번으로 하여 [시계방향]으로 2번 출구 → 3번 출구 차례대로 매깁니다. - 환승역의 경우 호선이 빠른 노선의 1번 출구를 기준으로 시계방향으로 출구번호가 매겨집니다. 예시는 2호선과 7호선 환승역인 건대입구역으로, 호선이 빠른 2호선의 1번 출구를 매기는 원칙에 따라 [외선 방향 우측 맨 앞쪽] 출구를 1번 출구로 하여 시계방향으로 출구가 매겨집니다. 즉 7호선에 위치한 2개의 출구는 시계방향으로 매겨지다보니 각각 3번 출구와 4번 출구가 되는 것이지요. 환승역이 되어 출구가 증설된 경우, 신설 노선의 출구가 껴들어가면 기존 출구번호가 하나씩 밀리는 경우가 생깁니다.2. 지방도시철도 - 대구·대전·광주광역시   지방도시철도의 경우 대전1호선과 광주1호선은 수도권 2호선 이후 방식을 그대로 따릅니다.    대구도시철도의 경우 [상행선방향 우측 맨 앞쪽] 출구를 1번으로 하여 [반시계방향]으로 매겨진다는 차이점이 있습니다.     특히 대구의 경우 1호선과 2호선에서도 사거리에 위치하여 출구가 8곳이 생긴 경우 1번 출구를 매기는 기준이 조금 다른 것을 볼 수 있습니다. - 부산도시철도   부산의 경우 출구 가장 특이한 출구배열방식을 보이고 있습니다. 부산은 이미 여러차례 언급한 바 있듯이 상하홀짝수 방식으로 출구를 매기기 때문에, [상행선 방향을 홀수]로, [하행선 방향을
