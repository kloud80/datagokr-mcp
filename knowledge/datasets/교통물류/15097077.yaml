summary_user: 전국 도로 교통량 조사지점(spot_id)별·방향(상행/하행)별로 24개 시간대 교통량과 12종 차종별 교통량, 전체 교통량을 일·월·연 단위 통계로 담는 조회 API입니다. 도로 계획·정책 분석가나 상권·입지를 보는 사업자가 '특정 조사지점에 몇 시, 어떤 차종이 얼마나 지나가는가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없고, 지점 ID와 차종·월 코드를 이름·코드 매핑이나 같은 기관 코드로 맞춰 연결해야 한다.
description_portal: 교통량 통계 데이터 정보조회서비스는 고속도로, 일반국도, 지방도, 국가지원지방도 등 다양한 도로 유형과 연도, 월, 차종, 시간대 등의 조건을 기준으로 시간대별·일별·월별·연도별 차량 통행량 통계 및 개별 차량 원시 데이터를 JSON·XML 형식으로 조회할 수 있도록 지원하며, 인공지능 학습, 자율주행 기술 개발, 교통 시뮬레이션, 도로의 계획과 건설, 유지관리와 도로행정 및 정책 수립 등 다양한 AI스마트교통 분야에 활용 가능한 고신뢰성과 고품질의 공공 오픈API 기반의 정보조회서비스입니다.
team:
  dept: 디지털도로팀(한국건설기술연구원 교통량팀)
