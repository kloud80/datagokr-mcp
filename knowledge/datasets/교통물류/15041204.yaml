summary_user: 공항철도 노선 역사별 장애인화장실의 위치를 화장실 한 곳당 한 행으로 담은 소규모 파일(CSV 약 2.6KB)로, 운영기관·노선·역명과 지상·지하 구분, 역층, 개찰구 안팎, 가까운 출구번호, 상세위치, 화장실 구분을 담는다. 휠체어 사용자나 보호자가 '인천공항이나 서울역 방향 공항철도 어느 역에서 개찰구 안쪽 몇 층에 장애인화장실이 있나'를 미리 확인하거나, 교통약자 이동 안내 서비스를 만드는 개발자가 역사 편의시설 정보를 채우는 데 쓴다. 전역 조인 키나 역 코드가 없어 다른 역사 편의시설·엘리베이터·역 위치 데이터와는 역명과 노선명을 이름으로 맞춰 이어 써야 한다.
limits: 표준 역 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다. 좌표가 없는 비공간 데이터라 지도 위치는 별도 역 위치 데이터로 보완해야 한다.
