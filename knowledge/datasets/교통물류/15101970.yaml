summary_user: 경기도 하남시에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 원장형 파일로, 상호·법인명·영업상태·업체유형과 법인·사무소의 도로명·지번 주소를 포함한다(범위는 하남시, 위치는 개별 주소 단위). 사업자나 화주가 "하남시에 등록된 국제물류주선업체 중 지금 영업 중인 곳은 어디인가"를 확인하거나, 분석가가 물류업체 사무소 분포를 지도로 그릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·법인명이나 주소 문자열 매칭으로만 잇고, 화물운송·주선 허가 여부는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 기관 데이터와 정확히 결합하기 어렵고 이름·주소 매칭에 의존해야 한다. 하남시 한 곳의 등록 현황만 담으므로 전국 또는 다른 시군구 비교에는 쓸 수 없다.
