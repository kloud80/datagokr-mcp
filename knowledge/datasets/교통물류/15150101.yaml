summary_user: 한국교통안전공단이 각 지자체 주차장시스템에서 수집한 주차장별 특정 시점의 주차 현황(혼잡 상태, 총 구획 수, 잔여 구획 수, 예약 가능 구획 수)을 담은 파일 데이터로, 전국 787,229행 규모이다. 운전자나 분석가가 특정 주차장의 잔여 면수와 혼잡 정도를 알아볼 때 쓴다. 주차장관리번호로 공단의 주차장 시설정보와 대조하면 주소 등을 확인할 수 있지만, 실측 컬럼에서 전역 조인 키는 찾지 못해 같은 기관 코드나 이름·코드 매핑으로만 이어진다.
description_portal: 주차정보시스템에서 각 지자체의 주차장시스템으로부터 수집한 주차장의 정보입니다. 수집하고 있는 주차장의 정보만 제공하고 있으며, 특정 시점의 주차장 잔여 면수에 대한 정보를 제공합니다. 실제 실시간의 주차장 잔여면수 정보가 필요하신 경우 OPEN API로 제공하고 있는 "주차정보 제공 API" 항목을 이용하시기 바랍니다. 해당 정보에서는 주차장의 주소를 직접적으로 제공하고 있지 않으나 주차장관리번호 항목을 이용하여 한국교통안전공단에서 제공하는 주차장 시설정보와 대조하여 주소 등의 정보를 확인하실 수 있습니다.
