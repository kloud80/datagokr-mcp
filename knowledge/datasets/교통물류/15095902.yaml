summary_user: 인천광역시 택시에 장착된 IoT 디바이스가 수집한 IMU 센서 측정값을 센서·시각·위치(위도·경도·지오해시) 단위로 담은 건별 원천 자료로, 3축 가속도·자이로·지자기 값과 시·군구·동 정보를 함께 기록하며 약 314MB 규모의 zip 파일로 받는다. 분석가가 "인천 도로 중 차량 진동이나 급가감속이 잦은 구간은 어디인가"처럼 주행 중 차량 움직임으로 도로 노면 상태를 추정할 때 쓴다. 전역 조인 키는 없어서 위도·경도·지오해시로 도로 공간자료와 겹쳐 보거나, 시·군구·동 이름을 다른 행정구역 통계와 이름으로 맞춰 잇는다.
