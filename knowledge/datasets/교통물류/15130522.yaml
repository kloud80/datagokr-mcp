summary_user: 국토교통부가 관리하는 국유재산 중 교량·터널 등 공작물을 디브레인 공작물 대장 기준으로 자산(대장번호) 한 건씩 담은 전국 단위 CSV 파일(약 120KB)이며, 재산관리관, 상·하위 관리기관, 소재지, 도로번호, 자산그룹번호, 시설구분 등을 포함한다. 도로·시설 분석가나 지자체 담당자가 '특정 도로번호 구간의 교량·터널은 어느 관서가 관리하는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 다른 데이터와는 재산관리관코드·도로번호·교량터널명 같은 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
