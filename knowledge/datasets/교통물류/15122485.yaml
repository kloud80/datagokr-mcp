summary_user: 아산시 버스정보시스템의 노선·노선정보·노선정류장 테이블을 합쳐, 노선별로 정류장 순번마다 정류장 간 구간 길이와 누적 길이, 전체 노선 길이, 배차간격, 회차 여부를 한 행씩 담은 CSV 파일(약 33만 바이트)이다. 교통 분석가나 지자체 담당자가 "아산시 각 버스 노선은 몇 km이고 어느 정류장에서 회차하며 배차간격은 얼마인가" 같은 질문에 쓴다. 전역 조인 키는 없어서, 정류장 위치 정보나 실시간 도착 정보와 붙이려면 같은 아산시 BIS의 정류장번호(출발·도착정류장번호)나 노선번호·노선명을 이름·코드로 맞춰 연결해야 한다.
description_portal: 23~25 공공데이터 중장기 개방계획에 의한 버스정보시스템 테이블 개방자료로서 노선정류장-노선정보상세-노선정보-노선 테이블을 합성하여 개방하였습니다.구성컬럼으로는 노선번호, 노선정보그룹번호,노선명,정류장순번,노선길이,노선누적길이,출발-도착 정류장 번호 등이 포함됩니다.각 노선 내 정류장 간 노선길이 및 그에 따른 전체노선 누적길이도 알 수 있습니다.
