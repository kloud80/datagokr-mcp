description_portal: 여수광양항만공사에서는 광양항을 관리 운영하는 공공기관입니다.국가 코드, 국내 항만 코드, 세계 항만 코드 정보를 함께 제공하는 데이터입니다. 세 가지 데이터는 상호 연계되어 항만 및 해운 관련 정보를 체계적으로 관리하기 위한 기본 코드 체계를 형성합니다.이 세 데이터는 함께 사용될 때 항만 물류 데이터의 국가·항만 매핑, 국제 해운 네트워크 분석, 항만 간 비교·연계성 연구에 핵심적인 역할을 합니다. 국가 코드와 항만 코드의 결합은 수출입 화물 통계, 선박 입출항 정보, 물류 경로 최적화 등 다양한 해운·항만 행정 및 산업 데이터 분석의 기반을 제공합니다.
