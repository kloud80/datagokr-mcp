summary_user: 국가 코드, 국내 항만 코드(항코드·국문/영문 항구명), 세계 항만 코드(국가코드·항구코드·항구명)를 코드별 한 행씩 담은 기준 코드 목록이며, 세 가지 조회 오퍼레이션으로 나뉘어 있다. 해운·물류 분석가가 입출항·수출입 화물 자료에 찍힌 항만·국가 코드를 실제 항구명과 국가명으로 풀어 읽을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 국가코드·항구코드 값이나 항구명 매핑으로 이어 쓴다. UN/LOCODE와 해수부 내부 코드가 함께 쓰이므로 매핑표가 필요하다.
limits: 항만코드는 UN/LOCODE와 해수부 내부 코드가 함께 쓰여, 다른 기관 데이터와 붙일 때는 별도 매핑표가 필요하다. 비공간 코드 목록이라 위치 좌표나 부두·선석 같은 시설 정보는 담지 않는다. 개발계정은 하루 1,000회로 호출이 제한된다.
