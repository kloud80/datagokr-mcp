description_portal: 이 데이터는 위험물질운송안전관리시스템을 통해 전국에서 운행 중인 위험물질 운송차량 단말기에 1년간 전송된 기상특보 정보를 담고 있습니다. 강풍, 호우, 태풍, 한파, 황사 등 총 10종의 기상특보가 포함되며, 각각 주의보(0)와 경보(1)로 구분된 특보 강도 정보도 함께 제공합니다. 해당 자료는 기상 악화 시 위험물 운송차량에 사전 경고를 전달하여 운전자에게 안전 운행을 유도하고, 사고 발생 가능성을 줄이기 위해 활용됩니다. 또한 이를 국민에게 공개함으로써 위험물 운송 경로와 사고 발생 지역의 기상 상황을 파악하고, 지역 사회의 안전 확보와 재난 대응 체계 강화를 위한 기초 자료로 활용하고자 합니다.특보종류는 아래와 같습니다. 1강풍2호우3한파4건조5폭풍해일6풍랑7태풍8대설9황사12폭염특보강도는 아래와 같습니다. 0주의보1경보
