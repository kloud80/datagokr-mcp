summary_user: 서울교통공사 1~8호선에서 교통카드로 오전 6시 30분 이전에 첫 승차해 조조할인(20%)을 받은 이용 중, 서울교통공사 외 구간에서 승차해 공사 관할 구간에서 하차한 유입 건수를 업무일자·승차역·하차역·교통카드구분·사용자구분별로 집계한 파일입니다(2025년 1월~6월 분). 교통정책 분석가가 "수도권 다른 노선에서 이른 아침 조조할인으로 들어와 서울 지하철 어느 역에서 내리는가"처럼 새벽 출근 통행의 출발·도착(OD) 흐름과 상권 배후지를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 승하차·역 데이터와는 호선명·역명을 이름으로 맞춰 연결해야 한다.
limits: 역 코드 같은 공통 키가 없어 역명 표기 차이로 매칭이 어긋날 수 있다. 서울교통공사 외 구간에서 승차해 공사 구간에서 하차한 조조할인 건만 담으므로 전체 승하차량이나 공사 구간 내부 이동은 이 데이터로 알 수 없다.
