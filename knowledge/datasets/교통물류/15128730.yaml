description_portal: 서울교통공사 1-8호선 할인유입통계 데이터 입니다. 연단위로 데이터가 업로드 되며, 데이터는 연번, 업무일자, 승차호선/역, 하차호선/역, 교통카드구분, 사용자구분, 할인유입건수 로 이루어져 있습니다.할인은 교통정책인 "조조할인"을 의미하며, 교통카드를 이용하여 오전 6시 30분 이전 첫 승차하는 대중교통 요금에서 일반·청소년·어린이 모두 20% 할인해주는 정책입니다.  유입건수는 서울교통공사 외 구간에서 승차 후 서울교통공사 관할 구간에서 하차한 건수입니다. (2025년 1월 ~ 2025년 6월 데이터 입니다.)
