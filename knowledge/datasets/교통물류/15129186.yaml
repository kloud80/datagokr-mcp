description_portal: 이 데이터는 해양수산부에서 선박의 항로 및 운항 현황 파악을 목적으로 수집된 선박 AIS 동적정보 데이터입니다.  본 데이터의 주요 내용은 선박이 특정 해역(사각형)에서 운항한 경로와 위치정보로 구성되어 있습니다. 개별 선박 식별정보(MMSI)는 특수문자로 대체되어 제공되며, 데이터의 제공 가능 기간은 2018년 9월 1일부터 2023년 3월 4일까지입니다.  본 데이터는 해양 교통량 분석, 특정 구역 내 선박 항로 추적, 해상 안전성 평가, 항만 운영 계획 수립 등과 같은 분야에 활용될 수 있습니다.
