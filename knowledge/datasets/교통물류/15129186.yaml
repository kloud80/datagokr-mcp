summary_user: 선박이 특정 사각형 해역에서 운항한 경로를 AIS 동적정보로 담은 파일로, 선박별 수신시간·위도·경도·대지속력(SOG)·대지침로(COG)·선수방향을 건별 위치 기록으로 제공하며 포털 설명상 제공 기간은 2018년 9월 1일부터 2023년 3월 4일까지다. 해양 교통량을 분석하는 연구자나 항만 운영 계획을 세우는 담당자가 '이 해역을 어떤 속도·방향으로 선박이 지나갔는가'를 파악하는 데 쓴다. 전역 조인 키가 없고 MMSI가 특수문자로 가려져 있어 선박 원장과 직접 잇기 어려우므로, 좌표·시간을 기준으로 Port-MIS 입출항 신고 등 같은 부문의 위치·항만 데이터와 공간·시간 단위로 겹쳐 쓴다.
limits: 개별 선박 식별정보(MMSI)가 특수문자로 대체되어 특정 선박을 식별하거나 선박 등록 원장과 연결할 수 없다. 실측 컬럼에 전역 조인 키가 없고, 받은 파일은 약 3.8KB 규모로 특정 해역 표본 성격이다.
