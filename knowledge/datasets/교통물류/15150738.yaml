summary_user: 경찰청이 제공하는 교통안전 위험요소 중 도로환경이 '오른쪽 합류도로'인 지점을 건별로 담으며, 지번·도로명 주소와 위경도, 위험요소 대·중·소분류 코드, 상세내용, 촬영정보 유무와 기준일자가 함께 들어 있고 범위는 전국이다. 내비게이션·운전 안내 서비스 개발자나 교통안전 분석가가 우측에서 차량이 합류하는 위험 지점이 어디에 있는지 지도에 표시하거나 주의 안내를 띄우는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 위경도·주소로 공간 매칭하거나 같은 기관의 다른 도로환경별 위험요소 데이터와 분류코드·연계링크 ID(RLTN_LNK_ID)로 맞춰 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다.
