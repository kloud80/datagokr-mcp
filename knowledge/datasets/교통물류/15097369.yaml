description_portal: 공공데이터는 어린이 보호구역 내에서 이동하는 차량 및 기타 이동체의 위험 요소를 분석한 자료입니다. 이 데이터는 2021년 기업매칭 지원사업을 통해 구축되었으며, 차량용 블랙박스 영상 기반으로 어린이 보호구역 내 위험 요소를 식별하고 기록한 결과물입니다. 위치 정보(위경도), 이동체 유형 등의 항목이 포함되어 있으며, 이를 통해 어린이 보호구역 내 교통 안전 개선을 위한 정책 수립에 활용될 수 있습니다. 어린이 보호구역 내 위험 요소가 높은 구간을 분석하여 교통 사고 예방과 안전한 보행 환경 조성을 위한 교통 시설 개선 및 단속 강화 등의 정책을 수립하는 데 기여할 수 있습니다.
