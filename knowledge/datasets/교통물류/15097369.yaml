summary_user: 대구광역시 어린이보호구역별로 차량 블랙박스 영상에서 식별한 위험요소 개수와 이동체 유형별(승용·승합차, 사람, 자전거, 버스, 트럭, 개인형 이동수단, 오토바이, 중장비, 불법 적재물·홍보물) 집계를 보호구역명·주소·위경도와 함께 담은 4KB 남짓의 소규모 CSV 파일이다. 교통안전 분석가나 지자체 담당자가 '대구에서 어느 어린이보호구역에 위험 이동체가 많아 시설 개선이나 단속을 우선해야 하나'를 따지는 데 쓴다. 전역 조인 키는 없어서, 어린이보호구역 제공표준 데이터나 단속카메라 위치와는 보호구역명·주소 매칭이나 위경도 공간 결합, 관할경찰서명·관리기관명 이름 매칭으로 이어 쓴다.
limits: 공통 코드나 식별자 같은 전역 조인 키가 없어 다른 데이터와 연결하려면 이름·주소·좌표 매칭이 필요하다. 범위는 대구광역시 한 곳의 개별 보호구역 단위이고, 포털 설명상 2021년 사업으로 블랙박스 영상을 바탕으로 만든 결과물이라 실시간 위험 현황을 보여주지는 않는다.
