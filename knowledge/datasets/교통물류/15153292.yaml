summary_user: 국토교통부가 관리하는 전국 터널의 제원을 터널 한 곳 단위로 담는 데이터로, 터널명·종류, 노선·도로 종류, 시도·시군구, 시점·종점 위경도, 연장·폭·높이·차로 수, 준공연도, 최근 안전점검 일자와 등급, 내진 설계 여부, 관리기관 같은 항목을 담는다. 지자체 담당자나 안전 분석가가 우리 지역에서 오래됐거나 안전점검 등급이 낮은 터널이 어디인지, 내진 성능이 확보되지 않은 터널이 몇 곳인지 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 시군구 이름·코드나 관리기관, 터널명과 노선명을 맞춰 교량·지하차도 같은 다른 도로 시설물 데이터나 지역 통계와 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털(www.data.go.kr)에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부에서 제공하는 터널제원에 대한 관련 정보입니다.\""
