description_portal: 자동차관리법 시행규칙 기계 기구의 정밀도검사와 환경분야 시험 검사 등에 관한 법률 시행규칙 환경측정기기 정도검사에 사용되는 자동차 정보입니다.환경분야 시험 검사 등에 관한 법률 시행규칙과 환경측정기기의 형식승인 정도검사 등에 관한 고시에서 운행차 차대동력계의 종합확인검사에서는 검정용 자동차를 사용하여 "운행차 배출가스 정밀검사 시행요령에 관한 규정" 중 하나의 검사모드를 선택하여 시험하여 정상여부를 검사하고 있기에 검정용 자동차에 대한 정보를 시험 운행에 참고할 수 있습니다.기계기구의 정밀도검사 출장업무에 사용되는 자동차의 취득 정보, 정기검사, 의무보험, 자동차 수리 내역 등에 관련한 정보이며, 특수용도의 자동차로서 활용할 수 있는 정보입니다.
