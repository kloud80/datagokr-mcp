summary_user: 전남 곡성군의 횡단보도를 한 곳씩 건별로 담으며, 관리번호·종류·고원식 여부와 도로명·지번 주소, 위도·경도, 차로 수, 신호등·교통섬·점자블록 설치 여부 같은 시설 정보를 함께 제공한다. 보행 안전 분석가나 지자체 담당자가 곡성군에서 신호등이나 점자블록이 없는 횡단보도가 어디에 있는지 확인할 때 쓴다. 전역 조인 키는 없어서 주소·좌표나 시군구명으로 다른 교통안전 시설 데이터(보호구역·단속카메라 등)와 맞춰 연결해야 한다.
