summary_user: 경기도 내 벽지노선 손실보상 지원 대상을 시군별로 집계한 현황으로, 시군명과 지원 대상 업체 수·노선 수 등을 담는다. 버스 업계나 지역 교통 분석가가 '경기도 어느 시군에 손실보상을 받는 벽지노선과 운수업체가 얼마나 있나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군명(sigun_nm)을 이름으로 맞춰 연결한다.
description_portal: '경기도 내의 벽지노선 손실보상지원대상 현황입니다.벽지는 외따로 뚝 떨어져 있는 궁벽한 땅으로서 도시에서 멀리 떨어져 있어 교통이 불편하고 문화의 혜택이 적은 곳입니다.※ 2개 업체 시군 중복(파주·연천-대양운수·신일여객), 8개 노선 지정 시군 중복(파주·연천-61번 계통 8개 노선)지원예산 및 시군별 배분 현황 등 상세 내용은 경기도청 홈페이지 사전정보공표 [벽지노선 지원현황]을 참고하여 주시기 바랍니다.※ 벽지노선 지원현황 : https://www.gg.go.kr/opendata/openDataBoard.do?decIdx=5098'
