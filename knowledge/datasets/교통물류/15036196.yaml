summary_user: 광주 서구 관내 건물 한 동(주소) 단위로 도로명·건물본번·부번, 지번(본번·부번), 건물명, 건물 용도, 우편번호·기초구역번호, 고시일자와 고시여부를 담은 건별 주소 목록 파일이다(CSV, 약 3.1MB). 특정 건물의 도로명주소와 지번이 무엇인지, 서구 어느 동에 어떤 용도의 건물이 몰려 있는지 확인하는 행정·민원 담당자나 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시군구·읍면동 이름과 도로명·건물번호 또는 지번을 맞춰 붙여야 하고, 그렇게 주소를 맞추면 건축물대장 같은 주소 기반 데이터와 이어 쓸 수 있다.
description_portal: 이 데이터는 광주광역시 서구 관내 건물 및 도로명주소 정보를 체계적으로 수록한 공공데이터로, 행정구역(시군구명, 읍면동명), 도로명, 건물번호, 건물명, 건물용도(대분류·소분류), 우편번호, 지번(본번/부번), 고시일자, 도로관리기관 등 다양한 속성 정보를 포함하고 있습니다. 도로명주소 기반의 공간정보를 제공하며, 주로 행정업무, 민원응대, 위치기반 서비스, 공간 분석, 건축 인허가 검토, 스마트시티 정책 등 다방면에 활용됩니다.특히 도로명 주소 + 건물번호 + 상세주소 체계를 통해 위치의 식별이 가능하며, 주소 기준의 유관 데이터(건축물대장, 안전점검대상, 부동산 정보 등)와 연계 시 활용도가 높습니다. 단일 주소단위로 구성되어 있으며, 고시일 기준 최신정보를 반영하여 주기적으로 업데이트되고, 실물주소와의 일치 여부는 별도 확인이 필요합니다. 해당 데이터는 행정구역 변경, 신규 건축물 발생, 주소 고시 변경 등에도 신속하게 반영되는 점에서 정책적·공공적 가치가 높습니다.
