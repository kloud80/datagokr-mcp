summary_user: 지방자치단체가 관리하는 지적측량업체를 업체 한 곳당 한 행으로 담은 표준데이터로, 사업장명·대표자·등록번호·기술자수·장비수량·좌표를 포함하며 검증 시 45행(전체 45건)이 수신됐다. 국민이나 사업자가 우리 지역에서 등록된 지적측량업체가 어디에 있고 기술자와 장비 규모는 어떤지 찾을 때 쓴다. 소재지 도로명주소·지번주소(address)와 위도·경도(coord)가 조인 키라서 주소 기반 데이터나 지도 데이터와 이어 쓰며, 업체 식별용 별도 코드 키는 없다.
limits: 수록 범위(지역)는 확인되지 않았고 45건뿐이라 전국 업체를 모두 담았다고 단정할 수 없다. 실측 최신 행 날짜는 2026-08-03(관측일 60일 전)이며 행정단위는 개별 주소·좌표 수준이라 지역 집계는 직접 해야 한다.
