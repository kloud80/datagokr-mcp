summary_user: 서울시 행정동별로 하루 단위 대중교통 총 승차 승객수와 0시~23시 시간대별 승차 승객수(PSNG_NO_00~23)를 담은 집계 데이터이며, 범위는 시도 단위 서울시, 행정단위는 읍면동입니다. 교통 분석가나 상권·입지 검토자가 '이 동네에서 출근 시간대에 대중교통을 타는 사람이 얼마나 되나' 같은 질문에 쓴다. 행정동 ID(DONG_ID)가 있으나 실측 컬럼에서 전역 조인 키는 확인되지 않아, 포털 설명이 안내하는 서울시 읍면동마스터 정보로 ID를 이름에 매핑하거나 같은 기관 코드로만 다른 데이터와 잇는다.
description_portal: 서울시 1일 1시간 단위로, 행정동별 대중교통 총 승차 승객수를 확인할 수 있습니다.행정동에 대한 ID 값 정보는 연관데이터인 서울시 읍면동마스터 정보(https://data.seoul.go.kr/dataList/OA-21234/S/1/datasetView.do)를 참고하시기 바랍니다.* 데이터 적재는 매일 5일전 데이터를 갱신합니다.제공부서는 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4958) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
