summary_user: "전국 교통사고원인조사 대상 사고다발지점을 기준년도·시도·시군구·지점구분(전체사고/중상이상사고)별로 지점 한 곳씩 담는 API로, 지점명과 좌표(EPSG 5181), 기준년도 포함 3년간 사고·사망사고 건수, 다발도와 심각도를 합친 통합지표(cnsld_index)를 준다. 지자체 교통안전 담당자나 분석가가 '우리 시군구에서 중상 이상 사고가 몰리는 지점은 어디이고, 그중 개선이 급한 곳은 어디인가'를 가려 시설개선 계획에 반영할 때 쓴다. 전역 조인 키는 없어 시도·시군구 약칭 이름(예: 서울, 중구)이나 좌표로만 다른 데이터와 맞출 수 있고, 같은 주제의 도로교통공단(TAAS) 다발지역 자료나 재난안전 부문 지자체 사고 통계와 겹치므로 함께 대조해 쓴다."
description_portal: '전체사고 대상 및 중상이상 사고다발지점을 기준년도, 광역지자체명, 기초지자체명, 지점구분(전체사고, 중상이상사고)명 을 기준으로 조회할 수 있습니다. 지역별 교통안전대책 및 교통시설개선수립계획 시 도움이 될 수 있습니다. 다발지점선정기준-전체사고 :  과거 3년간(기준년도 포함) 반경 50m 이내, 5건 이상 발생한 상위 30개 지점입니다. -중상이상사고 : 과거 3년간(기준년도 포함)반경 150m 이내, 사망사고 3건 이상이거나, 중상이상사고 10건 이상 발생한 지자체 내의 모든 지점주요제공정보 : 교통사고원인조사 대상(전체/중상이상)사고다발지점정보(광역지자체명,지점명,발생건수등)'
team:
  dept: 교통안전정책과
