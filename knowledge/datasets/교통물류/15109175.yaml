summary_user: 제주시 주정차 단속 CCTV를 설치 지점별로 담은 API로, 설치장소·설치주소·위도경도 좌표와 회전형·검지 CCTV 대수, 운영시간, 등록일시를 건별로 제공한다. 운전자나 주민이 특정 장소 주변에 주정차 단속 카메라가 있는지, 몇 시에 단속하는지 확인할 때 쓰고, 분석가는 단속 지점 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(instlAdres)나 위경도 좌표로 공간 매칭해 잇는다.
limits: 범위는 제주시 한 곳뿐이라 서귀포시나 다른 시군구 단속 CCTV는 들어 있지 않다. 표준 코드가 없어서 다른 단속·주차 데이터와 붙이려면 이름·주소·좌표로 직접 매칭해야 한다. 개발계정은 하루 10,000회까지 호출된다.
