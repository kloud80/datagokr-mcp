summary_user: 사업용 차량의 운행기록을 초 단위로 담은 건별 원천 데이터의 샘플로, 차량별 운행일자·시분초마다 GPS 좌표·운행속도와 과속(20·40·60km 초과, 장기과속)·급가속·급정지·급회전·급진로변경·공회전 초과 여부를 기록한다. 교통안전 분석가나 운수회사가 '어떤 차량이 어느 위치·시간대에 급정지나 과속 같은 위험운전을 했는가'를 살펴보거나 위험운전 판정 로직을 시험할 때 쓴다. 전역 조인 키는 없고, 운수회사코드·자동차등록번호·운수회사소재지코드를 같은 기관(한국교통안전공단)의 자동차 등록·검사 자료와 맞대거나 GPS 좌표로 위치를 겹쳐 보는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단에서 수집관리하고 있는 초단위의 위험운전행동데이터 샘플입니다. (운행일자, 운수회사코드 등) 운행기록과 관련된 데이터는 대용량데이터로 샘플데이터만 업로드
