summary_user: 전국 시도·시군구별로 설치된 2단식 기계식주차장치 대수를 단순승강식, 수동 경사승강식, 경사피트식, 승강피트식, 승강횡행식 다섯 종류로 나눠 통계년도별로 담은 집계 파일이다. 지자체 주차 담당자나 분석가가 "우리 시군구에는 어떤 방식의 2단 기계식주차장치가 몇 대 설치돼 있나"를 확인하거나 지역 간 설치 구성을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정표준코드를 준용한다는 시도·시군구 코드나 지역명을 매핑해 다른 지역 통계와 붙여 써야 한다.
description_portal: 해당 정보는 한국교통안전공단에서 보유하고 있는 정보로, 주차정보시스템에서 정보를 제공하고 있으나 원 데이터 출처는 기계식주차장 정보관리시스템입니다. 해당 정보는 년도에 따라 각 지자체(시도, 시군구)에 설치된  2단식 기계식주차장의  종류별 설치현황을 통계자료로 제공합니다. 해당 자료는 2023년도 통계자료로 2022년도 까지의 값을 제공하고 있습니다. 2단식 기계식주차장은 단순승강식, 수동 경사승강식, 경사피트식, 승강피트식, 승강횡행식으로 구분하여 제공되고 있습니다. 시도 코드, 시군구 코드는 행정안전부의 행정표준코드를 준용합니다.
