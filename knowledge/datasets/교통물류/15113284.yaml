summary_user: 서울특별시 내 육교를 한 곳씩 기록한 파일로, 육교명·도로종류·노선명·소재지 도로명주소와 함께 연장·폭·통행제한높이, 장애인편의시설 설치 여부와 종류, 관리기관을 담는다. 보행 동선을 짜는 시민이나 교통약자 이동권을 분석하는 사람이 '이 구간 육교에 엘리베이터 같은 장애인편의시설이 있는가', '통행제한높이가 낮은 육교는 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소나 도로노선명 같은 이름 매칭으로만 연결하며, 같은 도로 시설물 부문의 교량·지하차도 데이터와 주소 기준으로 함께 본다.
