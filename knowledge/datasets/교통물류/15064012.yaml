summary_user: 평택시 교통위반과태료통합민원시스템의 과오납 테이블을 그대로 내려받은 CSV(약 52KB)로, 과납이 등록된 날짜·고지 기준 연월·담당 관청(평택시청·송탄출장소·안중출장소) 코드를 건별로 담는다. 평택시 담당자나 분석가가 교통위반 과태료 과오납이 언제, 어느 관청 고지분에서 많이 생기는지 살펴 환급 업무와 고지 절차 개선을 검토하는 데 쓴다. 전역 조인 키는 없으며, 시군구코드(41220·41222·41224)와 고지 연월을 기준으로 같은 시스템의 다른 평택시 과태료 테이블과 맞춰 볼 수밖에 없다.
description_portal: '경기도 평택시 교통위반과태료통합민원시스템 DB의 과오납 테이블 정보(과납등록일자, 고지년월, 시군구코드)입니다.과오납 데이터는 세금, 공공 요금 등에서 과다하게 납부된 금액 정보를 의미하며, 이를 활용하여 과오납 발생 원인 파악, 환급 신청, 데이터 분석, 정책 개선 등에 활용할 수 있습니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의: 평택시청 종합관제사업소(031-8024-4884)'
