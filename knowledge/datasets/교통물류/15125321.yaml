summary_user: 부천시의 2025년 1월~12월 불법주정차 단속 내역을 단속일시·단속동·단속장소·단속구분(안전신문고, 주행형 CCTV, PDA, 고정형 CCTV) 단위로 담은 파일 데이터로, 내려받은 CSV는 약 10MB입니다. 시민이나 분석가가 "부천시에서 어느 동·장소에 불법주정차 단속이 몰리고, 신고와 CCTV 중 어떤 방식으로 주로 적발되는가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군구명·단속동 같은 이름 매칭으로만 연결한다.
limits: 행정동 코드나 좌표 같은 공통 키가 없어 다른 지역·공간 데이터와 바로 결합되지 않고, 단속장소 문자열을 이름 기준으로 맞춰야 한다. 범위는 부천시 한 곳이라 전국 비교에는 다른 시군구 자료가 따로 필요하다.
