description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야에 해당하는 환경관리 정보 데이터로, 특정 연도의 에너지 사용량과 온실가스 배출량을 구분별로 제공하는 환경 통계자료입니다. 본 자료는 환경(Environment) 분야의 기후변화(Climate Change), 온실가스 배출(GHG Emissions) 및 에너지 사용(Energy Consumption) 정보를 포함하고 있으며, 전력 및 연료 사용으로 발생한 CO₂, CH₄, N₂O의 배출량과 각 온실가스를 지구온난화지수(GWP) 기준으로 환산한 총 온실가스 배출량(tCO₂eq)을 함께 제공합니다. 이를 통해 Scope 1(직접배출)과 Scope 2(간접배출)의 배출 특성을 분석할 수 있으며, 구분별 에너지 소비 수준, 온실가스 배출 구조 및 연도별 변화 추이를 체계적으로 파악할 수 있습니다. 또한 본 자료는 ESG 공시, 탄소회계(Carbon Accounting), 온실가스 감축계획 수립, 에너지 효율성 평가, 탄소중립(Net-Zero) 전략 수립, 환경 성과 모니터링 및 데이터 기반 정책 수립을 위한 기초자료로 활용될 수 있습니다.'
