summary_user: 서울시 교통신호제어기를 한 대씩 담은 장비 단위 목록으로, 제어기명·설치일·온라인일·제조사와 시스템·형태·방식·전원·종류 코드, 구·동·경찰서 코드와 지번, 교체일·공사 이력, 공간데이터를 함께 담으며 범위는 서울시이고 위치는 주소·좌표 수준이다. 교통 분석가나 신호 운영 담당자가 "우리 구에서 설치된 지 오래돼 교체가 필요한 신호제어기는 어디에 몇 대 있나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 구 코드·경찰서 코드 같은 같은 기관 코드나 이름 매칭, 공간데이터(SPC_DATA)를 이용한 지도 중첩으로 잇는다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 별도 인증키가 필요하며 공공데이터포털 활용신청과는 별개다. 전국 공통 식별 키가 없어 교차로번호·코드값으로 다른 기관 데이터와 바로 조인되지 않는다.
