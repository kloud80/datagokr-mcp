summary_user: SRT를 운영하는 (주)에스알의 역사 내 부대사업장 임대수익을 연도별·분기별(1~4분기와 합계)로 집계한 단일 CSV 파일입니다(326바이트, 전국 단위·비공간). 철도 운영사의 비운송 수익 추이를 보려는 분석가가 'SRT 역사 상업시설 임대수익이 해마다 어떻게 변했나' 같은 질문에 쓴다. 공통 조인 키는 없어 다른 데이터와는 연도(구분)나 같은 기관(에스알)의 다른 공개 자료를 기준으로 맞춰 이어 쓴다.
description_portal: 1. 해당 데이터는 주식회사 에스알이 운영중인 고속열차 SRT에 대한 자료입니다.2. 역사 내 부대사업장 임대수익(백만원)을 연도별로 구분하여 제공하는 데이터입니다.3. 2016년도 1,2,3분기는 "데이터 없음"을 안내드립니다.4. 예시) 2016년도 임대수익은 2,220,000입니다.* 해당 데이터는 1회성 데이터입니다.* 2025년 3분기 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.
