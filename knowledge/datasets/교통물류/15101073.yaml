summary_user: 국토교통부가 제공하는 비행금지구역 공간정보로, OGC 표준 API를 통해 전국 범위의 구역 데이터를 내려받는 외부 API 형태이다. 드론 서비스 사업자나 조종자가 비행하려는 지역이 비행이 금지된 구역인지, 입지에 어떤 제약이 있는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있고, 드론 신고·비행승인·조종자격 데이터와 함께 입지 제약 조건으로 참고한다.
limits: 외부 사이트 vworld.kr의 인증키(query 파라미터 key)가 별도로 필요하며 포털 활용신청과는 다르다. 필드(prohibited, prh_typ, prh_lbl_1~4 등)에 명세상 의미와 코드표가 없어 값의 뜻은 별도 확인이 필요하고, 전역 조인 키가 없어 다른 데이터와의 자동 결합은 어렵다.
