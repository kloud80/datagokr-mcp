summary_user: 국토교통부가 대중교통 이용자의 통행 목적별 이동량을 운행일자·요일·시간대·이용자 유형별로, 시도·시군구(일부 읍면동 이름 포함) 단위 발생·도착 인원으로 담은 전국 범위 API이다. 교통 분석가나 지자체 담당자가 '우리 시군구에서 평일 출근 시간대에 어떤 이용자 유형의 통행이 얼마나 발생하고 도착하나'를 따져 노선·배차 조정이나 인프라 계획에 쓴다. 전역 조인 키는 없어 시도·시군구 코드(sgg_cd)와 이름을 매핑해 같은 기관의 버스·대중교통 승하차·노선 자료나 행정구역 통계와 이어 쓴다.
limits: 필수 파라미터인 시군구코드(sgg_cd)는 다른 데이터에서 먼저 받아 넘겨야 호출된다. 4개 오퍼레이션 중 월별·연간 목적통행량과 교통약자 목적통행량 3개는 최소 파라미터로 응답이 없어 일별 오퍼레이션 1개만 실호출로 확인됐다. 개발계정은 하루 1,000회로 제한된다.
