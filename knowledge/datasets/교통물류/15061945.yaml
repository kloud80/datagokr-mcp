description_portal: '데이터 개요「항공레저_경량항공기이착륙장」 데이터는 국내에서 운영되었거나 운영 중인 경량항공기 전용 이착륙장의 위치, 물리적 특성, 운영상태 등을 포함한 기초 인프라 정보를 제공합니다. 해당 정보는 경량항공기 운항계획 수립, 공역 안전관리, 항공레저 활동 기반 구축 등에 유용하게 활용됩니다.데이터 제공 항목순번고유 식별 번호명칭이착륙장 명칭규격활주로의 길이 및 폭 (예: 240m × 16m)표면상태포장(아스팔트 등), 비포장(잔디 등) 여부위치주소 또는 행정구역 기준 위치 정보비고운영상태 또는 특이사항 (예: 폐지일, 중지일 등)활용 안내경량항공기 운항 시 이착륙장 이용 가능 여부 확인항공레저 및 지역 관광자원 연계 기반 자료로 활용항공안전관리 및 공역 통제 정책 기초자료로 제공지방자치단체 및 민간 항공사업자의 공역/시설 개발 시 기초 조사 자료데이터 해석 시 유의사항비고란의 "중지", "폐지" 등 표기는 해당 이착륙장의 공식 운영 중단일 기준입니다.표면상태가 ‘잔디’인 경우, 기상 조건에 따라 이용에 제약이 있을 수 있습니다.위치 정보는 행정구역 단위로 제공되며, 일부 좌표 기반 정보는 별도 매핑이 필요할 수 있습니다.데이터 구성 예시순번명칭규격표면상태위치비고1무지개세상 구리 이착륙장225 m × 35 m잔디경기 구리시중지(2020.11)11신한에어 영암 이착륙장850m × 20m아스팔트전남 영암군12공주 경항공기 이착륙장350 m × 10 m콘크리트충남 공주시'
