summary_user: 광주광역시 도시철도 역 인근 주차장을 주차장 한 곳당 한 행으로 담은 CSV 파일(약 14KB)로, 인근 역명과 역까지 거리, 공영·민영 구분과 노상·노외·부설 유형, 요일별 운영시간, 기본요금·기본시간, 주차구획수, 도로명주소와 위경도를 담는다. 시민이나 교통 분석가가 '이 역 근처에 무료이거나 주말에도 여는 주차장이 몇 면이나 있나' 같은 환승주차 질문을 확인하거나 역세권 주차 공급을 비교하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 전국주차장정보표준데이터 원장과는 주차장관리번호·주차장명·좌표를 맞춰 보는 방식으로만 이어 쓰고, 역 단위 데이터와는 역명(문화노선도명)으로 연결한다.
description_portal: 이 데이터는 광주광역시 도시철도 역 인근 주차장 현황을 상세히 정리한 자료로, 각 주차장의 위치·운영 정보·요금 체계 등을 포함하고 있습니다. 주요 항목에는 문화노선도명(인근 역사명), 거리(미터), 요금 정보(무료/유료), 운영 시간(평일·토요일·공휴일별 시작·종료 시각), 위도·경도 좌표, 주차 기본 요금 및 시간, 총 주차 면수, 관리번호, 주차장명, 주차장 구분(공영/민영), 주차장 유형(노상/노외/부설), 도로명 주소 등이 포함됩니다.이 자료를 활용하면 역세권 주차 인프라의 분포와 접근성을 분석할 수 있으며, 요금 정책 비교, 주차 수요 예측, 이용자 편의성 향상 방안 마련 등에 기초 자료로 쓸 수 있습니다. 또한 위치 좌표를 통해 지도 시각화 및 대중교통·보행 네트워크와의 연계 분석이 가능해, 주차난 해소와 대중교통 활성화를 위한 도시교통 계획 수립에 유용합니다.
