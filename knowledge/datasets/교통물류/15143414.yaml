description_portal: 기내 불법행위 현황은  항공보안법 및 항공운송사업자의 항공기내보안요원 등 운영지침(국토교통부지침 제2023-200호)에 따른 연도별 발생건수로 폭언 등 소란행위, 음주 후 위해행위, 성희롱, 폭행 및 협박, 흡연행위, 전자기기 사용, 조종실 출입기도 등 항공기 내 불법행위 발생현황 데이터입니다.* 항공기내의 불법행위란 항공기의 안전운항을 저해할 우려가 있거나 운항을 불가능하게 하는 행위로 항공보안법 제2조제8호 각 목의 행위를 말하며, 2017년 부터 2025년 3월까지 항공기내에서 발생한 연도별 불법행위 발생 건수를 집계한 자료입니다.상세 내용은 첨부의 파일을 참조하여 주시기 바랍니다.
