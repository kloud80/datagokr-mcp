summary_user: 경기도 도로대장 전산화 시스템을 바탕으로 도로 노선·구간별 실연장(도로·교량·터널 등 구분)과 차도·보도·중앙분리대·길어깨 폭원(m), 시점·종점 위치와 위경도를 구간 단위로 담는다. 도로 확장이나 교량·터널 보수를 검토하는 행정·설계 담당자나 분석가가 '이 노선의 특정 구간은 폭이 얼마이고 교량·터널이 몇 m인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크 등 다른 데이터와는 노선번호·구간번호나 도로명 매핑, 또는 시점·종점 위경도를 이용한 공간 대조로 이어야 한다.
description_portal: 이 데이터는 경기도의 도로대장전산화시스템을 기반으로 각 도로 구간별 실연장 및 폭원 정보를 기록한 자료입니다. 각 도로의 노선번호와 구간번호, 시작 및 종점 위치, 차도·보도·중앙분리대·길어깨 등 다양한 구성 요소의 폭원(m), 도로 구간별 연장 거리(도로, 교량, 터널 등), 공간정보(위경도)까지 포함되어 있어 도로 설계 및 유지관리에 필요한 기초 인프라 자료를 제공합니다. 이를 통해 특정 도로 구간의 물리적 구성과 시설 현황을 파악할 수 있으며, 도로 확장, 교량 및 터널 유지보수, 보행자 안전 대책 수립, 도로 포장 설계, GIS 기반 공간 분석 등 다양한 교통·건설 행정 분야에서 활용됩니다.※제공되는 도로대장 정보는 구축 시기에 따라 현재 도로현황과 다를 수 있으니, 참고자료로 사용하시기 바랍니다.
