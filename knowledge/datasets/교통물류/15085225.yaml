description_portal: '○ 통계개요* 통계명 : 승용차통행속도(시간대별)* 통계종류 : 서울시 주요도로에서의 시간대별 승용차 통행속도를 제공하는 일반·조사통계* 작성목적 : 서울시 주요도로의 승용차 통행속도를 조사하여, 도로의 건설, 유지관리 및도로 운영에 필요한 기본자료와 각종 연구에 필요한 기초자료를 제공하는것을 목적으로 함* 조사체계 : 조사기관(ROTIS) → 서울특별시 도시교통본부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 주요도로의 도로별ㆍ시간대별 승용차 통행속도 현황○ 용어설명* 통행속도 : 어느 한 구간을 이동한 속도(공간평균속도: space mean speed)* 도시고속도로 : 도로법 제12조의 규정에 의한 고속국도와 자동차에 한하여 이용이가능한 도로로서 중앙분리대에 의하여 양방향이 분리되고 입체교차로를 원칙으로하며 설계도로가 80km/h 이상인 도로 중 도시지역에 소재하는 고속도로* 주간선도로 : 도시 내 주요지역을 연결하거나 도시 상호간이나 주요지방 상호간을연결하여 대량교통을 처리하는 도로로서 도시의 골격을 형성하는 도로* 보조간선도로 : 주간선도로를 집산도로 또는 주요 교통발생원과 연결하여 도시교통의 집산기능을 수행하는 도로로서 근린생활권의 외곽을 형성하는 도로○ 기 타* 2차로 이상 주요도로 300여개소에서 측정한 승용차 통행속도임* 측정시간대 : 평균(06:00~22:00) 오전(07:00~09:00) 낮(12:00~14:00)오후(18:00~20:00)○ 출 처 : 서울특별시 도시교통본부 교통정보과'
