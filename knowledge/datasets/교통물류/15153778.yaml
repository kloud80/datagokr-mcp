summary_user: 출발역·차종·품목분류 조합마다 빈 화차(공차)를 회송할지 여부와 회송 목적지 역을 적용 시작·종료일자와 함께 담은 전국 단위 기준표로, 9,840바이트 분량의 CSV 파일 한 개입니다. 철도 물류 분석가가 '특정 역에서 특정 차종·품목을 내린 뒤 빈 화차가 어느 역으로 되돌아가는지, 그 기준이 언제 바뀌었는지'를 확인하는 데 쓴다. 공통 조인 키는 없고 출발역명·회송역명·차종명·품목분류명 같은 이름으로만 다른 철도 화물·역 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 한국철도공사의 화물 운송 효율성 관리에 필수적인 공차 회송에 대한 기준 정보입니다. 공차 회송이란 화물을 내려놓은 빈 화차(공차)를 다음 화물 적재를 위해 필요한 수요지로 이동시키는 과정을 의미합니다. 각 레코드는 출발역 코드를 기준으로 특정 차종 코드와 품목 코드 조합에 대해 공차 회송이 필요한지("회송 여부")와 회송될 목적지인 "회송역 코드"를 지정합니다. 이 정보는 특정 화차나 품목을 주로 취급하는 노선에서 화차의 불필요한 유휴 시간과 불균형을 해소하기 위한 운용 지침이 됩니다. 적용 시작/종료 일자를 통해 시간의 흐름에 따른 화차 회송 정책의 변화 이력을 추적할 수 있습니다. 이 데이터는 철도 자원의 낭비를 최소화하고 물류 효율성을 극대화하는 데 기여하는 핵심 정보로 화차 자산의 최적 배치 계획, 화물 운송 시스템의 가동률 향상, 공차 운행 비용 절감 분석, 물류 네트워크의 효율성 연구 등 철도 물류 운영의 최적화 분야에서 중요한 전략적 자료로 활용될 수 있습니다.
