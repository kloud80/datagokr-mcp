summary_user: 한국공항공사가 관할하는 인천공항 제외 전국 공항의 항공편별 정기운항 스케줄을 담으며, 편명·출도착 공항·출발시간·요일별 취항 여부·운항 시작일과 종료일이 편 단위 행으로 들어 있고 API 전체 건수는 10,779건이다. 여행객이나 면세점 사업자, 분석가가 특정 노선의 편이 무슨 요일 몇 시에 운항하는지 확인하는 질문에 쓴다. 항공사 코드(IATA)와 출발·도착 공항 코드로 같은 기관 코드나 항공 분야 공항코드 정보와 이름·코드 매핑해 잇고, 전역 조인 키는 없다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑이 필요하다. 날짜 컬럼에 미래 값(2026-10-26)이 있는 일정형 데이터이며 검증 호출 조건 기준이라 최신성은 날짜 컬럼이 아닌 적재일 컬럼으로 판단해야 한다. 개발계정은 일 5,000회까지 호출할 수 있다.
