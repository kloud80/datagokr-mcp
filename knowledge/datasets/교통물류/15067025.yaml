summary_user: 목포시 소재 시내버스 운송회사별로 회사명, 전화·팩스번호, 주소, 대표자, 보유 버스 수와 등록 대수, 국토교통부 권역 코드를 한 행씩 담은 소규모 원장 파일(CSV 507바이트)이다. 목포 시내버스를 운행하는 회사가 어디이고 각 회사가 버스를 몇 대 보유했는지, 민원이나 분실물 문의 때 어느 회사에 연락해야 하는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 목포시 버스 노선·정류장 데이터와는 회사명으로 맞추거나 국토교통부 권역 코드를 기준으로 이어 쓴다.
