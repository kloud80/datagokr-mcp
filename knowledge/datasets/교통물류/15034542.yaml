summary_user: 주정차금지로 지정된 구간을 건별로 담은 전국 표준데이터로, 도로명·상세위치와 요일별(평일·토요일·공휴일) 금지 시간대, 시행·해제일자를 기록하며 검증 시 16,925건을 받았다. 운전자나 지자체 담당자, 분석가가 특정 시군구 도로에서 몇 시에 주정차가 금지되는지, 일시 허용 시간이 있는지 확인하는 질문에 쓴다. 시군구코드(sgg_cd)로 다른 시군구 단위 데이터와 이어 쓰며, 도로 구간 단위의 공통 키는 확인되지 않는다.
