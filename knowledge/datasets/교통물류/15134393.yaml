summary_user: 인천광역시 버스정보관리시스템의 통합링크정보를 노선별 링크 순번 단위로 담은 파일(csv, 약 5.6MB)로, 각 행은 버스노선 아이디와 표준 링크·시작/종료 노드, 논리링크·논리 시작/종료 노드, 링크순번, 진행방향, 적용 시작일시를 담는다. 교통 분석가나 BIS 개발자가 '인천의 특정 버스노선은 어떤 도로 링크를 어떤 순서와 방향으로 지나가는가'를 확인해 노선 경로를 재구성하거나 구간별 운행 분석의 뼈대를 만드는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 기관의 버스노선·정류장 자료와는 노선 아이디·노드 아이디 같은 인천시 내부 코드로만 맞춰 이어 써야 한다.
limits: 표준 링크·노드 아이디가 있으나 전국 공통 키로 검증되지 않아 다른 기관 자료와 바로 결합되지 않고, 이름·코드 매핑을 거쳐야 한다. 진행방향 코드의 의미는 필드 명세에 코드표가 없어 별도 확인이 필요하다.
