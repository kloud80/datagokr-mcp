description_portal: 자동차튜닝종합지원포털에 업체가 등록한 튜닝 제품에 대한 정보(가격,판매링크,등록업체 등)를 공개함으로써 소비자에게 폭넓은 선택의 기회 및 정보를 제공 및 튜닝시장의 변화에 맞는 제품 개발, 동향등을 소비자를 판단할 수있는 공간 제공합니다. 제품특성에 맞는 개발 지원을 포함하여 튜닝시장의 활성화 기여, 소비 문화의 패러다임 변화 등 다양한 니즈를 충족할 수 있는 장 입니다.향후 특성화된 제품에 대한 고객만족도 평가를 통해 튜닝마켓 시장 확대, 튜닝 제품을 생산하는 기업들의 축제의 장으로 발전시키기 위함입니다.기술력과 서비스 등이 검증된 우수한 튜닝업체가 보유한 튜닝 기술 및 제품이 시장에서 보다 원활하게 거래될 수 있도록 지원 한경 마련 및국민이 튜닝업체를 신뢰하고 이용할 수 있도록 환경 조성, 자동차튜닝 관련 사업화 유망 기술 정보 확산으로 튜닝 산업 활성화 목적으로 제공됩니다.
