summary_user: 서울 관악구의 행정동별 자동차 등록 대수를 승용·승합·화물·특수 차종으로 나눠 담은 집계표로, 범위는 관악구 한 시군구이고 단위는 읍면동(행정동)입니다. 구청 교통·주차 담당자나 분석가가 '어느 동에 승용차나 화물차 등록이 많아 주차 수요 검토가 먼저 필요한가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어, 다른 데이터와는 행정동 이름(행정동)을 매핑해 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 서울특별시 관악구 각 행정동에서 등록된 자동차 등록 현황입니다. 본 데이터의 항목은 ▲승용차 ▲승합차 ▲화물차 ▲특수차량의 대수로 구성되어 있습니다. 행정동 단위로 차량 구성 비율과 규모를 비교할 수 있도록 구성되어 있으며, 지역별 교통량 추정, 주차 수요 검토, 노상·노외주차장 운영 참고, 생활권 단위 교통관리 계획 수립 등 기본 자료로 활용될 수 있습니다. 특히 승용·화물·특수 등 차량 유형별 분포를 파악할 수 있어, 동별 특성을 반영한 교통 행정 및 주차 정책 검토 시 기초자료로 활용 가능한 정보입니다.
