summary_user: 경상북도 영주시의 불법주정차 CCTV 단속 내역을 건별로 담은 API로, 위반일자·시간·위반장소·위반내용·과태료 여부 항목을 제공한다. 영주시에서 어느 장소·시간대에 단속이 몰리는지 확인하려는 운전자나, 주정차 금지구역 지정과 단속 효과를 분석하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 위반장소 이름 매핑이나 같은 기관(영주시) 기준으로만 이어 쓴다.
description_portal: 불법주정차 CCTV 단속 현황으로 위반일자, 시간, 위반장소, 과태료 여부 등의 항목을 제공하는 API입니다.이를 통해 차량의 불법주정차 단속 내역을 구조화된 방식으로 확인할 수 있습니다.해당 API를 활용하여 운전자 대상 경고 앱이나 주차 유도 서비스 등과 연계하면 실시간 교통 질서 준수에 이바지할 수 있으며,교통혼잡완화 및 주정차 금지구역 지정 근거 자료로 활용, 단속효과에 대한 분석이나 정책 수립 시에도 활용할 수 있습니다또한 교통안전 인공지능 학습, 스마트 교통지도 제작 등에 접목할 수 있습니다.본 API는 REST 방식으로 JSON포맷으로 제공됩니다
