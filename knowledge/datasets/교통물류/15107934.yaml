summary_user: 서울시 가로등 한 기둥마다 관리번호와 위도·경도를 담은 건별 위치 원천 파일로, 검증 수신 기준 19,316행이다. 시민이나 분석가가 우리 동네 가로등이 어디에 설치돼 있는지, 야간 조명이 부족해 보이는 구역이 어디인지 따져 볼 때 쓴다. 위도·경도(좌표) 값이 조인 키라서 같은 좌표 체계를 가진 다른 위치 데이터와 공간 단위로 겹쳐 볼 수 있고, 관리번호는 명세에 연계 대상이 없어 다른 시스템과 이어 쓰는 키로는 확인되지 않았다.
