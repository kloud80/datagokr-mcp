summary_user: 대전도시철도 1호선 각 역의 상·하행 방향별, 평일·휴일 운행 구분별 열차 출발 시각(첫차·막차 포함)을 시간대별로 담은 조회용 API이다. 시민이나 길찾기·도착 안내 앱 개발자가 "이 역에서 휴일 하행 막차가 몇 시인가" 같은 질문에 답하는 서비스용 조회에 쓴다. 전역 조인 키는 없고, 요청에 역번호(stNum)·방향·요일 구분 코드를 넘겨야 하므로 같은 기관의 역 정보 데이터에서 역번호를 먼저 받아 이름·코드 매핑으로 이어 쓴다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사에 대한 열차 운행 시각표 데이터를 제공합니다.각 역별 상·하행 방향에 따른 첫차 및 막차 시각, 평일·휴일 등 운행 구분별 전체 열차 출발 시각 정보를 포함합니다.본 데이터를 활용하면 실시간 도착 안내 앱, 대중교통 길찾기 서비스, 교통 편의 플랫폼 등 다양한 교통 관련 서비스 개발에 활용할 수 있으며, 시민들의 교통 이용 편의 향상과 대중교통 이용 활성화에 기여할 수 있습니다.열차 운행 계획 변경 시 데이터가 갱신될 수 있으므로 최신 정보 반영 여부를 주기적으로 확인하시기 바랍니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
