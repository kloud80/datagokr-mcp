description_portal: NOTAM(Notice To Airmen, 항공고시보)는 항공기 운항과 관련하여 안전에 영향을 미칠 수 있는 시설, 장비, 절차, 공역 등의 변동 사항을 신속하게 알리기 위해 발행되는 공식 통보문입니다.항공고시보 부호(NOTAM Code)는 국제민간항공기구(ICAO)에서 정한 표준 규격으로총 5개의 영문 문자로 구성됩니다.첫 번째 문자는 항상 Q로 시작하여 해당 부호가 NOTAM임을 나타냅니다.두 번째와 세 번째 문자는 주제어(Subject)를 의미하며, 이 부호를 통해 해당 NOTAM이 어떤 대상에 관한 것인지 구분할 수 있습니다.대상은 설비, 시설, 항행안전 장비, 비행 절차, 특정 구역 등 다양합니다.네 번째와 다섯 번째 문자는 상태(Condition)를 나타내며, 주제어에 해당하는 대상의 운용 가능 여부, 사용 제한, 고장, 변경 등의 상태 정보를 제공합니다.이러한 코드 체계는 전 세계적으로 동일하게 사용되어 조종사, 항공사, 관제기관 등 관계자가 필요한 정보를 신속하고 정확하게 파악할 수 있도록 돕습니다
