summary_user: 한국교통안전공단 검사소에서 적용하는 자동차검사 수수료를 수수료코드별로 적용일·만료일과 함께 담은 기준표로, 정기·정밀·성능검사 수수료와 예약·캠페인·MOU·교통사고 피해차량 할인을 조합한 할인액·결제액·부가세를 항목별로 담는다(전국 단위 CSV 파일, 샘플). 검사를 앞둔 차량 소유자가 공단 검사소에서 예약하거나 할인을 받으면 실제로 얼마를 내는지 확인하거나, 분석가가 시기별 수수료 체계 변동을 비교하는 데 쓴다. 다른 데이터와 맞물릴 전역 조인 키는 없어, 같은 기관의 자동차검사관리시스템 자료와 수수료코드 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 관리하는 자동차검사 자료 중 하나로, 공단 산하 각 자동차검사소에서 적용하는 수수료 정보를 검사구분(정기검사, 종합검사 등)별로 구분하고, 할인 항목(복지 할인, MOU 할인 등)에 따라 세분화한 데이터입니다. 또한, 수수료의 적용 시작일자, 항목별 기준, 할인율 등 관련 정보가 포함되어 있어, 수수료 체계의 변동 사항이나 제도 적용 범위를 명확히 파악하는 데 유용하며, 관련 업무 종사자 및 정책 수립자, 이용자들에게 참고자료로 활용될 수 있습니다.
