summary_user: 전라남도 담양군 안의 교량을 한 행에 하나씩 담은 시군구 단위 현황 파일로, 노선명·노선번호, 소재지, 교장·총폭·유효폭, 경간수, 설계하중, 준공년도, 관리주체를 담는다. 담양군에서 오래된 교량이나 폭이 좁은 교량이 어느 노선에 있는지, 대형 차량이 지나갈 설계하중을 갖췄는지 확인하려는 주민·운송사업자·도로 분석가가 쓴다. 전역 조인 키가 없어서 다른 시군구 교량현황과는 교량명·노선명·소재지 같은 이름 매핑으로 묶는다. 교량은 제공표준 항목이므로 같은 표준을 따르는 지자체 파일과 합쳐 쓴다.
