summary_user: 여수광양항만공사가 관리하는 항만에서 선박별로 신고된 화물료 내역을 건 단위로 담으며, 항만명·호출부호·선박명·연도·일련번호·사용구분·대리점·화물 유형·화물료 톤수로 구성된다. 해운 대리점이나 항만 분석가가 특정 선박의 입항 건에 대해 어떤 화물 유형으로 몇 톤의 화물료가 신고됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 호출부호(CALL_LETTER)·항만코드·일련번호를 매개로 같은 기관의 입출항·선박 정보와 이름·코드 매핑으로만 연결한다.
description_portal: 「화물료 신고정보」 데이터는 항만에서 처리된 선박별 화물료 신고 내역을 기록한 자료입니다. 주요 항목은 항만명(PRT_NM), 호출부호(CALL_LETTER), 선박명(VSSL_NM), 연도(YR), 일련번호(SER_NO), 사용구분(USE_TP_NM), 사용번호(USE_NO), 대리점 코드 및 명(AGENT_CODE/AGENT_NM), 화물 유형(STV_TP_NM), 화물료 톤수(CRG_FARE_TN)로 구성되어 있습니다.이 데이터는 선박별·화물 유형별로 실제 신고된 화물료 규모를 보여주어, 항만 수익 구조, 컨테이너 단위별 처리 실적, 대리점별 운영 현황을 파악하는 데 유용합니다. 특히 입항·출항별 화물료 신고 차이를 통해 수출입 물동량 편중 현상을 확인할 수 있으며, 항만의 재정 운영과 요율 정책 검토에도 기초 자료로 활용될 수 있습니다.
