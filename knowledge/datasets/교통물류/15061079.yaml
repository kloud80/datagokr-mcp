summary_user: 운수종사자관리시스템에 등록된 버스·택시·화물차 운수종사자의 범죄경력을 관할관청에 통보한 건수를 연령대(구분)별로 2014년부터 2025년까지 연도 열로 집계한 전국 단위 통계 파일이다. 교통안전 분석가나 정책 담당자가 '어느 연령대 운수종사자의 범죄경력 통보가 해마다 늘거나 줄었는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령대 구분이나 같은 기관(한국교통안전공단)의 운수종사자 통계와 이름을 맞춰 나란히 놓는 방식으로만 이어 쓴다.
