summary_user: 안산시 주요 교차로별 신호 운영 계획을 교차로 고유번호·계획 번호 단위로 담은 CSV 파일(약 33만 바이트)로, A·B 방향별 8단계 신호시간과 신호 옵셋, 운영 플래그 등 21개 항목을 담는다. 교통 분석가나 연구자가 '특정 교차로의 방향별 녹색·적색 시간 배분과 옵셋이 어떻게 설정돼 있는가'를 확인하고 신호 최적화나 교차로 시뮬레이션의 입력값으로 쓴다. 전국 공통 조인 키가 없어 다른 데이터와는 교차로 고유번호를 같은 기관(안산시) 내부 자료와 맞추거나 교차로 이름·위치를 수작업으로 매핑해 잇는다.
description_portal: 이 정보는 안산시 주요 교차로의 신호등 운영 주기를 담고 있으며, 교차로 고유번호, 계획 번호, 운영 플래그, 방향별 신호시간(각 8단계), 신호 옵셋 등 총 21개 항목으로 구성되어 있습니다. 빨간불, 파란불의 변경 주기와 같은 신호등 주기 정보는 시간대별로 설정되며, 교차로별 맞춤형 신호 운영 계획 수립에 활용됩니다. 이 정보는 스마트 신호 운영 알고리즘 개발, 방향별 통행량 분석 기반 운영 전략 수립, 교차로 시뮬레이션, 신호 옵셋 최적화 등 스마트시티 교통정책의 기초 자료로 사용됩니다. 또한 도심 혼잡 완화, 대기 시간 감소, 지역 맞춤형 교통 정책 수립 등 행정 및 민간 분야 모두에서 활용도가 높습니다. 이 정보는 신호 주기 패턴의 정기적 점검 및 유지관리 체계 수립에도 활용됩니다.
