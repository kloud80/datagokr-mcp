summary_user: 수도권 5호선 각 역의 화장실을 건별로 담은 원천 목록으로, 운영기관·노선·역명과 지상·지하 구분, 역층, 개찰구 안팎 여부, 가까운 출구번호, 상세위치, 화장실 구분을 담는다(CSV 약 9KB). 지하철 이용자가 '내릴 역의 화장실이 개찰구 안에 있는지, 몇 번 출구 근처인지'를 미리 확인하거나, 분석가가 노선별 운임구역 내 화장실 비율을 따지는 데 쓴다. 전역 조인 키는 없으므로 다른 역·시설 데이터와는 역명·노선명을 이름으로 맞춰 이어 써야 한다.
limits: 역 코드 같은 공통 조인 키가 없어 다른 데이터와는 역명·선명 문자열 매칭으로만 연결되며, 표기 차이에 주의해야 한다. 범위는 수도권 5호선 역에 한정되고 공간 좌표가 없어 지도 위치를 바로 얻을 수 없다.
