summary_user: 운수안전컨설팅 지원시스템에서 안전성능함수로 산출한 표준링크 안전등급(A~D)별로 해당 링크 수, 전체 링크 수, 비율을 담은 전국 단위 집계표입니다. 교통안전 분석가가 전국 도로 링크 가운데 위험 등급 구간이 어느 정도 비중인지 파악할 때 씁니다. 실측 컬럼에는 링크ID 같은 조인 키가 없어서 표준노드링크와 공간 연결은 하지 못하고, 등급 이름을 기준으로 같은 기관의 다른 안전등급 자료와 맞춰 봐야 합니다.
description_portal: '한국교통안전공단 운수안전컨설팅 지원시스템을 통해 관리하고 있는 표준링크별 안전등급 비율에 대한 데이터 정보입니다.도로구간(링크)에서 발생한 사고 심각도를 고려하여 도로 및 교차로별 안전등급 산출 정보 입니다.- 안전성능함수(Safety Performance Function, SPF)를 이용하여 안전등급을 추정합니다.- 안전성능함수는 특정 도로 구간에서 발생한 사고를 추정하는 모형으로서, 교통사고 예측모형이라고하며, 기본적으로 교통량과 구간길이, 교통사고 건수를 이용하여 모형을 구축합니다.- 기존 11대 위험운전행동건수 합계를 사용하여 모델 구축합니다.－ 총 4 단계로 구분: A~D 등급으로 표출하고 실제 위험도를 산출합니다.－ 또한 도로 유형별로 실제 위험도를 순위화 하여 세부 등급 표출 * 파일 용량 제한으로 인해 일부 데이터만 추출'
