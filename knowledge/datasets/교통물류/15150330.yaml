description_portal: '- 자동차안전기준 종합정보시스템은 자동차 관련 법령 들에 관련하여 대국민 정보 제공을 목적으로 운영중으로, 국내외 최신 자동차안전기준 법령과 다양한 참고자료 및 통계분석 결과를 관리하고 있습니다.- 개방데이터는 국가별로 내부상황과 법령에 따라 구성하는 국가별 차종분류 정보, 자동차와 관련한 다양한 경우의 교통사고 이력 통계분석 결과 등이 있습니다.- 자동차의 분류는 국가별 안전기준 차이점에 따라 동일한 자동차를 다른 종류로 구분하여 기준을 다르게 적용하는 경우가 자주 있습니다. 주요 자동차생산국에서는 가급적 국제기준과 조화하여 통일성을 지향하지만 각국의 환경 특성에 따라 분명한 분류 구분을 정하고 있습니다. 해당 개방데이터에서는 자동차와 관련한 여러 분류의 통계자료를 제공함을 목표로 하고 있습니다.'
