summary_user: 부산시 주요 도로를 구간(시점·종점) 단위로 나눠, 교통정보 수집 장비 자료를 가공한 평균 통행속도와 교통량을 생성시간별로 담는 실시간 소통 API입니다. 운전자나 교통 분석가가 "지금 부산 어느 구간이 막히는가"를 확인하거나, 응답을 시간마다 쌓아 상습 정체 구간을 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구간명·시점명·종점명(sxnNm 등) 같은 이름 매칭이나 같은 기관(부산시) 교통 데이터로만 이어 쓴다.
description_portal: '본 데이터는 부산광역시 교통정보서비스센터에서 제공하는 부산시 주요 도로 구간별 평균 통행속도 정보입니다.교통정보 수집 장비로부터 취득한 자료를 가공하여, 구간 단위의 평균 주행속도를 산출한 것으로 실시간 교통흐름 파악, 혼잡 구간 분석, 도로 운영 효율화 등에 활용할 수 있습니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>주요 도로 구간별 실시간 통행속도 파악교통혼잡 예측 및 도로 운영·관리 정책 수립 지원돌발상황 시 교통 분산 및 우회 경로 안내 자료민간 내비게이션·교통정보 서비스 연계 활용교통 빅데이터 분석 및 스마트시티 연구 개발 지원'
