summary_user: 서울교통공사 1~8호선 지하철 역사별로 노선, 역명, 역사 형식, 길이, 층수, 면적, 준공년도 같은 건축 현황을 한 행씩 담은 역 단위 원천 목록이다. 시설 관리자나 분석가가 "준공된 지 오래된 지하 역사가 어느 호선에 몰려 있나", "역사 규모(면적·층수)가 큰 역은 어디인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 역 데이터(좌표·출입구·승하차 등)와는 호선명(SBWY_ROUT_LN)과 역명(SBWY_STNS_NM)을 맞추는 이름 매핑이나 같은 기관 코드로만 잇는다.
limits: 서울교통공사 운영 1~8호선 역사만 담겨 있다. 역 좌표나 표준 역 코드가 없어서 공간 분석이나 다른 기관 노선과의 연결에는 역명 매핑 작업이 따로 필요하다. 호출할 때는 포털 활용신청과 별개로 data.seoul.go.kr 인증키를 받아 경로 파라미터(KEY)에 넣어야 한다.
