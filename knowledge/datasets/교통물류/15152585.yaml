summary_user: 경기도 동두천시의 불법주정차 단속 건별로 단속일시, 단속장소, 과태료 부과 여부, 횡단보도 해당 여부를 담은 시군구 단위 파일 데이터로, 포털 설명상 2024년 단속분을 2025년 11월 13일 기준으로 정리했다. 시민이나 분석가가 동두천시에서 어느 장소·시간대에 불법주정차 단속이 몰리는지, 횡단보도 주변 단속 중 과태료가 실제로 부과된 비율이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·관리기관명 같은 이름이나 단속장소 주소 문자열 매칭으로만 연결하며, 다른 시군의 같은 형식 불법주정차 현황과 나란히 비교하는 방식으로 쓴다.
limits: 표준 행정코드나 좌표 같은 공통 조인 키가 없어 다른 데이터와 자동 결합이 어렵고, 단속장소는 텍스트로만 연결해야 한다. 범위는 동두천시 한 곳의 시군구 단위로 한정된다.
