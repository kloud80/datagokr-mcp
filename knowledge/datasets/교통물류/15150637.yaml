summary_user: 부산항만공사가 2019~2024년 선박 입출항 보고를 정리한 CSV 파일(약 58MB)로, 이름은 집계지만 선박별 입항회차 단위로 입항·출항 일시, 전출항지·차항지, 적재·양하·환적·위험물 톤수, 선원·승객 수, 선박 국적·종류·톤수를 담는다. 분석가가 연도별로 어느 국적·선종의 선박이 어느 항에서 와서 어디로 가며 얼마를 싣고 내렸는지 비교하는 등 물동량과 운항 패턴 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 선박명·항지명 같은 이름이나 같은 기관의 코드(청코드, 선박키, 항지코드)를 매핑해서만 이을 수 있다.
