summary_user: 경기도 김포시 관내 지하차도를 한 건씩 담은 원천 목록으로, 지하차도명·소재지 주소·폭원과 연장(미터)·배수 펌프 용량(킬로와트)과 수량·관리기관을 담으며 파일 크기는 890바이트 규모의 작은 csv다. 김포시 주민이나 도로·방재 담당자가 '우리 동네 지하차도는 어디에 있고, 침수에 대비한 배수 펌프는 몇 대·얼마 용량인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 소재지주소를 주소·좌표로 변환하거나 지하차도명으로 맞춰 이어 쓰며, 지하차도는 제공표준 대상이라 다른 지자체의 같은 형식 파일과 표준 항목 기준으로 합쳐 쓴다.
description_portal: 경기도 김포시의 지하차도에 대한 정보를 제공합니다. 제공 항목으로는 지하차도명, 소재지주소, 폭원(미터), 연장(미터), 펌프용량(킬로와트), 펌프수량(대), 관리기관, 데이터기준일자로 구성되어있습니다. 본 데이터를 통해 각 읍면동별 지하차도의 분포와 위치, 규모, 펌프 용량 및 수량을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 도로관리과로 연락주시기 바랍니다.
