summary_user: 관할 시군구에 기계식주차장치 보수업으로 등록된 업체를 전국 범위에서 업체 한 곳당 한 행으로 담은 목록 파일로, 업체명·사업장 주소·보수업 등록번호·등록일이 들어 있다. 건물 관리자나 주차장 운영자가 '우리 지역에서 기계식주차장치 보수를 맡길 수 있는 등록 업체는 어디인가'를 찾을 때 쓰고, 분석가는 지역별 보수업체 분포를 보는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로, 사업장 주소를 시군구 단위로 정리하거나 업체명을 맞춰 기계식주차장·주차장 정보 데이터와 이어 쓴다.
description_portal: 한국교통안전공단에서 제공하는 기계식주차장치 보수업체에 대한 데이터 입니다. 기계식주차장치 보수업체는 관할 지방자치단체(시군구)에서 승인받은 사업자만 제공하고 있습니다. 기계식주차장치 보수업 등록이 되지 않은 업체는 제공하고 있지 않습니다. 제공 목록은 보수업체명, 사업장 주소, 보수업 등록번호, 보수업 등록일을 제공하고 있습니다. 해당 정보는 한국교통안전공단에서 수집한 정보를 국민 편의를 위하여 제공하는 것으로, 보수업 인허가에 대한 권한이 없어 실제 보수업 등록 현황과 차이가 있을 수 있으니 참고하시기 바랍니다.
