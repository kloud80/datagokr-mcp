summary_user: 대구광역시 달서구가 설치한 바닥형 보행신호등(횡단보도 대기선 바닥에 보행신호를 비추는 보조장치)의 설치 지점을 한 곳씩 상세위치·주소·위도·경도·설치일자로 담은 시군구 단위 파일(csv, 약 6.9KB)이다. 보행안전 분석가나 주민이 달서구 안에서 어느 횡단보도에 바닥신호등이 있는지, 언제 설치됐는지를 확인할 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭해 횡단보도·어린이보호구역·교통사고 지점 자료와 이어 쓴다.
description_portal: 바닥신호등이란 횡단보도 대기선 바닥에 보행신호를 점등하여 보행자에게 추가적인 신호정보 제공으로 보행편의와 교통사고 방지에 기여하고자 하는 바닥형 보행신호등 보조장치를 말한다대구광역시 달서구에서 교통안전을 위해 설치한 바닥신호등 위치에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다..상세위치, 주소, 위도, 경도, 설치일자, 비고, 데이터기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.
