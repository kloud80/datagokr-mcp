summary_user: 인천광역시 영종구(포털 설명상 옛 중구) 공영주차장마다 관리주체, 주차장명, 위치, 전체 주차면수, 장애인전용주차구획 면수, 데이터 기준일자를 한 행씩 담은 주차장별 현황 파일(CSV, 약 5KB)이다. 장애인 운전자나 보호자가 어느 공영주차장에 장애인 전용 구획이 몇 면 있는지 확인하거나, 분석가가 주차장별 전체 면수 대비 장애인 구획 비율을 따져 보는 데 쓴다. 전역 조인 키나 코드표가 없어서, 좌표·요금이 필요하면 같은 기관의 공영주차장 현황이나 전국주차장정보표준데이터와 주차장명·위치를 맞대어 이어 써야 한다.
description_portal: 해당 데이터는 인천광역시 중구 공영주차장 내 장애인전용주차구획 현황입니다.데이터 파일 내 항목은 주차장 관리주체, 주차장명, 주차장위치, 주차면수, 장애인 주차 구획 면수, 데이터 기준일자로 구성되어 있습니다.인천광역시 중구의 공영주차장(노상주차장, 노외주차장)의 현황이 궁금하실 경우에는'인천광역시 중구 공영주차장 현황'으로 검색하시면 주차장 유형(노외, 노상, 공영 등), 주차장 위치, 주차장 위치의 자세한 위도 경도 안내, 주차면수, 주차요금, 기본요금 및 추가요금 안내, 주차장 급지 현황, 정기권 유무, 요금 체계, 운영 요일, 관리 주체  및 최신 현황을 확인하실 수 있습니다.기타 문의사항은 원도심 공영주차장(교통운수과 032-750-7554), 영종 용유지역 공영주차장(교통과 032-760-7797~8), 유료 공영주차장(인천중구시설관리공단 032-850-1475)해당 관리 기관에 문의하여 주시기 바랍니다
