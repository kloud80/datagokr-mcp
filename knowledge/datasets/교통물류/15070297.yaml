summary_user: 전국 시도·시군구별로 교통사고 건수와 사망자·중상자·경상자·부상신고자 수를 담은 집계 통계 파일이며, 경찰이 조사·처리한 인적 피해 사고만 연간 단위로 셈한다. 지자체 담당자나 분석가가 "우리 시군구의 교통사고 사망자가 인근 지역보다 많은가" 같은 지역 간 비교에 쓴다. 전역 조인 키(행정코드)가 없어 다른 데이터와는 시도·시군구 이름을 맞추거나 같은 기관(TAAS) 자료와 이어 써야 하며, 사고 다발지역 공간 원장이나 지자체 사고 통계와 함께 본다.
description_portal: '- 전국 시도 및 시군구별 교통사고 사고건수 사망자수, 중상자수, 경상자수, 부상신고자수 통계  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨 - 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
