summary_user: 한국도로공사가 관리하는 전국 고속도로 영업소별로 진입조절(통제) 지시일자·지시시간과 통제 1단계·2단계 발효일시를 담는 OpenAPI 데이터이며, 노선명·노선번호·영업소명·영업소코드가 함께 나온다. 교통관리 담당자나 연구자가 '어느 영업소에서 언제 진입 통제가 시작돼 몇 단계까지 얼마 동안 이어졌는가'를 확인하고 혼잡·기상·사고 대응을 분석하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 같은 기관의 다른 고속도로 데이터와는 영업소코드(unitCode)·노선번호로 맞추고, 그 밖의 데이터와는 영업소명·노선명 매핑으로 연결해야 한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 영업소 진입조절 영업소별 현황 자료로, 영업소 단위 통제 지시와 단계별 발효 시점을 OpenAPI 형식으로 제공한다.제공 형식은 XML과 JSON이며, 주요 항목에는 영업소통제지시일자, 집계시간단위구분코드, 영업소통제지시간, 노선명, 노선번호, 영업소명, 영업소코드, 통제 1단계 발효일시, 통제 2단계 발효일시가 포함된다.이 데이터는 영업소별 통제 상황을 시간 단위로 확인할 수 있어 도로 운영 상태를 정확하게 파악하는 데 활용된다.교통 혼잡, 기상 악화, 사고 등으로 인한 진입 제한의 시점과 지속 시간을 분석하고, 단계별 대응 체계 마련에 기여한다.교통 관리기관, 정책 담당자, 연구기관 등이 효율적 통제와 운영 전략 수립에 본 데이터를 활용할 수 있다.
