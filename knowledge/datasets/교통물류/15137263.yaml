summary_user: 대전교통공사 도시철도의 선불·후불 교통카드 통행량을 영업월·역사별로, 할인율 구분과 환승 구분에 따라 나눠 담은 월별 집계 파일로, 포털 설명상 2010년 1월부터 2025년 8월까지를 다룬다. 분석가나 상권 조사자가 '특정 역의 교통카드 통행량이 연도별로 어떻게 변했고 환승·할인 이용 비중은 얼마인가'를 볼 때 역별 유동인구의 대체 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역사 이름 매핑이나 같은 기관(대전교통공사) 자료 사이에서만 연결한다.
