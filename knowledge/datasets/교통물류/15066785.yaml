summary_user: 전국 농어촌버스 운송업체의 경영현황을 인천·경기·강원·충북·충남·전북·전남·경북·경남 등 시도 구분별로 자산총계·부채총계·자본총계·운송수입(매출액)·운송원가(매출원가)로 묶은 집계 파일이며, 단위는 백만원이고 파일 크기는 402바이트 정도로 작다. 교통정책 분석가나 지자체 담당자가 '어느 지역 농어촌버스 업계의 부채 비중이 높고 운송원가가 운송수입을 넘는가' 같은 재무 건전성 질문을 지역끼리 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도 이름(구분)을 맞춰 붙여야 하며, 같은 기관의 시내버스 등 다른 대중교통 경영현황 자료와 지역명 기준으로 나란히 놓고 쓴다.
limits: 경영부문을 작성한 업체만 집계한 값이라 해당 지역 농어촌버스 전체를 대표하지 않을 수 있고, 업체별·노선별 수치는 없다. 공간 정보와 표준 행정코드가 없어 지도화나 코드 기반 결합은 지역명 매핑을 거쳐야 한다.
