summary_user: 파주시 공공시설에 설치된 전기차 충전소를 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·시설구분, 도로명·지번주소와 위도·경도, 총주차면수와 충전 전용면수, 충전기 타입, 운영·관리기관을 포함한다. 파주 시민이나 전기차 이용자가 "집 근처 공공시설 중 급속 충전기가 있고 전용 주차면이 있는 곳은 어디인가"를 찾거나, 분석가가 공공시설 유형별 충전 인프라 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위도·경도 좌표를 기준으로 공간 결합하거나 시설명을 대조해 잇는다.
description_portal: 경기도 파주시 공공시설 내 설치된 전기차 충전소의 위치 및 운영 현황에 대한 데이터로, 충전소가 속한 공공시설 유형을 구분할 수 있는 시설명과 시설구분, 정확한 위치 확인과 지도 기반 서비스 활용이 가능한 소재지 도로명주소와 지번주소, 위도 및 경도 정보, 충전소의 주차 공간 규모와 전기차 충전 전용 공간을 파악하게 해주는 총주차면수 및 전기차충전소 전용면수, 급속, 완속 등 충전 방식의 다양성을 나타내는 충전기 타입과 충전소의 관리 주체와 사용 가능 시간대를 명확히 하여 이용자 편의를 증진시키고자 하는 운영기관명과 이용가능시간으로 구성되어 있습니다. 이는 전기차 이용 활성화 및 효율적 관리, 정책 수립 등에 활용되며, 환경친화적 교통 인프라 확충에 기여할 것을 기대합니다.
