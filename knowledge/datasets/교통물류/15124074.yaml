summary_user: 경기도 버스운송관리시스템(BMS)이 관리하는 버스 정류소의 기초 정보와 위치 변경 이력을 이력 건별(hist_id)로 담고, 정류소마다 이름·좌표·정류장 유형·환승 여부·중앙차로 여부·표지판 유형·행정동/법정동 코드·등록일자와 외국어 정류장명을 포함한다. 교통 분석가나 지자체 담당자가 특정 정류소의 위치가 언제 어떻게 바뀌었는지, 경기도 내 환승·중앙차로 정류소가 어디에 분포하는지를 지도에 올려 확인하는 데 쓴다. 정류장 아이디(sttn_id)를 키로 경기도 노선·도착 정보 같은 다른 정류장 기반 데이터와 잇고, 행정동·법정동 코드로 행정구역 통계와 묶을 수 있다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 관리하는 정류소의 기초 정보 및 위치 이력 정보를 포함하고 있습니다. 주요 항목에는 정류장아이디, 정류장명, 좌표값(Y좌표, X좌표), 링크아이디, 정류장유형, 환승정류장유무, 중앙차로여부, 표지판유형, 행정동코드, 등록일자 등이 포함되어 있으며, 각 정류장의 위치 및 기본 정보 변경 이력을 체계적으로 추적할 수 있습니다. 본 데이터는 정류소 위치 변경, 환승 기능 여부, 도심 및 외곽 정류장 구분 등 교통 인프라 계획에 활용 가능하며, GIS 연동을 통해 정류소 분포 시각화, 대중교통 네트워크 분석, 정류장 기반 서비스 구축 등의 다양한 분석과 행정 업무에 활용될 수 있습니다.
