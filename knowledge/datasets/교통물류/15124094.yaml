summary_user: 경기도 버스운송관리시스템(BMS) 기준으로 시내버스 운송업체별 예비차 등록·변경 이력을 건별로 담고, 이력마다 일반·좌석·무정차·급행 등 유형별 예비차 수, 변경 전 수와 증감 수, 총수, 등록일자를 기록한다. 교통 분석가나 지자체 담당자가 특정 운송업체의 예비차가 언제 얼마나 증차·감차됐는지, 특정 시점에 예비차를 몇 대 운영했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 업체 식별자(entrps_id)나 업무코드·운행형태 이름을 경기도의 다른 버스 데이터와 이름·코드로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로 시내버스 운행에 필요한 예비 차량 정보를 기록한 자료로, 예비차량의 등록 및 변경 이력을 포함합니다. 각 예비차는 업체별로 등록되며, 업무코드, 운행형태, 예비차 사용 여부, 일반예비차, 좌석예비차, 무정차예비차, 급행예비차 등 다양한 유형의 예비차 수량이 포함됩니다. 이를 통해 예비차 총수와 증감 내역을 확인할 수 있으며, 각 이력에는 등록일자, 등록자, 업무코드명 등도 함께 제공됩니다. 데이터는 예비차 증차 또는 감차 상황을 분석하거나, 특정 시점의 차량 운영 상태를 파악하는 데 활용될 수 있습니다. 예비차는 정규 운행 차량의 고장, 정비 등 비상 상황 발생 시 대체 투입될 수 있는 차량을 의미합니다.
