description_portal: 「여수광양항만공사 항만 시설물 및 그린 포트(Green Port) 구축 현황」 데이터는 항만 내 친환경 에너지 설비 구축 현황을 정리한 자료로, 준공연도, 설치장소, 설비용량(MWp), 연간 발전용량(MWh), 연간 이산화탄소 절감량(ton) 항목으로 구성되어 있습니다. 총 34개 시설의 설치 현황이 기록되어 있으며, 항만의 친환경 전환 노력과 성과를 수치로 보여줍니다.이 데이터는 항만의 그린 포트 구축 성과를 정량적으로 보여주는 자료로서, 항만 친환경 정책 추진 실적, 온실가스 감축 성과 평가, 향후 설비 확충 계획 수립에 중요한 기초 자료가 됩니다. 또한 설치 장소별로 데이터가 구분되어 있어, 각 거점의 에너지 자립도와 기여도를 비교·분석하는 데도 활용할 수 있습니다.
