summary_user: 서산시 도시계획정보시스템에서 수산자원보호구역을 담는 테이블의 구조를 적은 메타데이터로, 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목을 담는 약 1.9KB 크기의 CSV 파일이며 구역의 위치나 경계 자체는 들어 있지 않다. 서산시 도시계획 공간자료를 받아 쓰려는 분석가나 개발자가 수산자원보호구역 테이블에 어떤 컬럼이 있고 각 컬럼이 무엇을 뜻하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명을 이름으로 맞추거나 같은 기관(서산시) 자료끼리만 연결한다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 수산자원보호구역에 관한 메타데이터이다. 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 수산자원보호구역은 수산자원 보호와 어업 질서 유지, 환경 보전을 위해 지정된 구역이다. 이 지역은 불법 어업 방지, 수질 관리 등을 목적으로 하며, 개발 행위가 제한된다. 본 데이터는 위치와 규제 내용을 이해하는 데 유용하며, 어업 정책, 해양 계획, 행정업무에 활용된다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 도움이 되며, 공간정보 분석, 민간 활용 등 다양한 분야의 참고자료로 사용된다.
