summary_user: 광진구 관내 공동주택 건물별로 대장 종류, 법정동·본번·부번 지번, 건물명, 주·기타 용도와 옥내·옥외 기계식·자주식 주차 대수 및 총대수를 담은 건물 단위 파일(CSV 약 31KB)이다. 주민이나 분석가가 "우리 동네 아파트 단지별 주차면이 몇 면이고 기계식 비중은 얼마인가"를 확인하거나 동별 주차 공급량을 비교하는 데 쓴다. 전역 조인 키는 없으며, 법정동명과 본번·부번 지번 또는 건물명을 매칭해 건축물대장이나 전국주차장정보표준데이터와 붙여 쓴다.
description_portal: 서울특별시 광진구_공동주택 주차장 데이터는 광진구 관내 공동주택에 설치된 주차장의 허용 면수와 관련된 정보를 제공하는 행정 데이터입니다. 이 데이터는 “주소”, “대장종류”, “건물명”, “용도”, “면수”, “데이터기준일” 필드로 구성되어 있습니다. ‘주소’는 해당 공동주택 주차장의 위치를 나타내며, ‘대장종류’는 관리대장의 유형을 표시합니다. ‘건물명’은 해당 공동주택의 명칭을, ‘용도’는 건축물의 사용 목적을 나타냅니다. 또한 ‘면수’는 허용된 주차 가능 대수 정보를 제공하며, ‘데이터기준일’은 정보의 최신화 기준일을 명시합니다. 이 데이터는 공동주택 주차공간 관리, 주차 수요 분석, 교통 정책 수립 및 지역 내 생활 편의시설 계획의 기초 자료로 활용될 수 있습니다.
