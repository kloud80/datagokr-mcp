summary_user: ACI(세계공항협의회) 연례 통계를 바탕으로 세계 권역별(아프리카·아시아태평양·유럽·북미 등) 항공 여객(명)·화물(톤) 수송 실적과 전년 대비 증감률을 국제선, 국내선+국제선으로 나눠 담은 연도별 집계 파일이며, 파일 크기는 약 1KB(csv)로 작다. 분석가나 정책 담당자가 '올해 아시아태평양 국제선 여객이 전년보다 얼마나 늘었고 다른 권역과 비교하면 어떤가' 같은 세계 항공수요 회복·성장 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 권역 이름을 맞춰 붙여야 하며, 국내 공항·노선별 항공통계와는 연도 기준으로 나란히 비교하는 정도로 쓴다.
limits: 권역 단위 집계라 국가·공항·노선·항공사별 실적은 알 수 없고, 공통 코드 키가 없어 이름 매핑으로만 연결된다. 포털 설명상 권역 구분은 ACI 기준이라 IATA 권역과 범위가 다를 수 있고 공항 보고 기준에 따른 오차가 있을 수 있다.
