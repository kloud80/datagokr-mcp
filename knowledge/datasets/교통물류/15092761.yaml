description_portal: '데이터 개요국토교통부_항공통계 세계편은 세계공항협의회(ACI: Airports Council International)에서 제공하는 글로벌 항공운송 실적 통계를 기반으로, 지역별 항공 여객 및 화물 수송 실적을 전년 대비 비교할 수 있도록 구성된 데이터입니다. 지역별 국제선과 국내+국제선 구분이 포함되어 있어 국제 항공시장 분석 및 수요 동향 파악에 유용합니다.데이터 제공 항목년도: 수송 실적 기준 연도여객화물구분: 여객 또는 화물 구분국내국제구분: 국제선 / 국내선+국제선지역: 권역별 구분 (예: 아프리카, 아시아태평양, 유럽, 북미 등)실적: 해당 연도 수송 실적 (명 또는 톤 단위)전년대비: 전년 대비 증감률(%)출처 및 갱신 주기ACI의 연례 보고서를 기반으로 하며,세계 각 지역의 항공 수송 실적(여객 및 화물)을 집계함국제선 단독 통계뿐 아니라 국내선 포함한 전체 실적 제공전년 대비 성장률 포함되어 있어 회복 추이와 트렌드 분석 가능데이터 해석 시 유의사항ACI 통계는 국가별 공항 보고 기준에 따라 약간의 오차가 있을 수 있음‘국내선+국제선’ 수치는 일부 지역(섬 국가 등)에서 국제선 비중이 높아 국내선 편차가 클 수 있음권역 구분은 ACI 기준으로 지역별 범위가 IATA 기준과 다를 수 있음활용 안내세계 권역별 항공 수송 실적 비교 및 시계열 분석정책 수립을 위한 국제 항공시장 규모 및 성장률 평가항공사 및 공항의 진출 타당성 분석, 글로벌 항공산업 전략 수립 근거자료팬데믹 전후 항공수요 회복 양상 평가 및 예측 기반 자료예시 데이터년도여객화물구분국내국제구분지역실적전년대비2024여객국내선+국제선아프리카2497297169.12024여객국제선아프리카171044922132024화물국내선+국제선아프리카24833456.52024화물국제선아프리카23136807.2'
