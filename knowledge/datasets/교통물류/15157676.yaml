summary_user: 인천항 갑문을 통과한 선박의 제원을 선박 단위로 담는 API로, 호출부호·국적·총톤수·순톤수·국제총톤수·재화중량·IMO번호·선적항·선주와 운영자 코드·이중선체 여부·말소사유 등 50여 개 항목을 XML로 제공한다. 항만 물류 분석가나 항만운영 담당자가 '특정 IMO번호 선박의 톤수와 국적, 선주는 무엇인가'처럼 갑문 통과 선박의 등록·제원 정보를 확인하는 데 쓴다. 실측 조인 키는 IMO번호(imoNo)로, 같은 키를 가진 선박원부·입출항 등 다른 해운·항만 데이터와 선박 단위로 이어 쓴다.
limits: 범위는 전국·비공간으로 분류되며 위치나 행정구역 단위 분석에는 쓰지 않는다. 해양 안전·항행경보·PSC·선원 정보는 이 부문 범위 밖이다. 개발계정은 일 10,000회 호출 한도가 있고 serviceKey 인증이 필요하다.
