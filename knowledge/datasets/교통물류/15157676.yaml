description_portal: 갑문운영 선박제원 정보는 갑문을 통과한 선박에 대한 상세 데이터를 제공하며, 선박 식별자, 호출부호, 국적, 선박명, 톤수, IMO 번호, 선적항, 운항구역, 해사기구코드 등 50여 개 이상의 상세 항목으로 구성되어 있습니다. 이를 통해 항만운영시스템에서 선박 운항 이력, 등록 정보, 국제해사정보 등을 분석하고 관리할 수 있습니다. 데이터는 XML 포맷으로 제공되며, 검색일자 및 선박명 등을 조건으로 조회가 가능하고, 항만 물류관리 선박 통계 분석, 국제항만 간 협력 자료, 해양안전 분석 등 다양한 행정 및 및간 활용처에서 사용할 수 있는 정밀 선박 정보 API입니다.
