summary_user: 경기도가 매년 현행화 사업으로 보정한 여객수단 OD 자료로, 연도별 출발지역·도착지역 쌍마다 승용차·버스·지하철·택시·기타 수단별 통행량과 환승 포함/미포함 총수단 통행량을 담은 집계 데이터이며, 범위는 시도 단위의 비공간 자료다. 교통 분석가나 지자체 계획 담당자가 '어느 시군에서 어느 지역으로 가는 통행이 많고, 그중 버스·지하철 비중은 얼마인가'처럼 권역 간 흐름과 수단 분담을 진단하고 노선·환승시설 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 기점·종점 지역코드(cadnlpnt_region_cd, laststop_region_cd)나 지역명을 다른 지역 통계와 이름·코드 매핑해 잇거나 같은 경기도 자료끼리 연결해 쓴다.
description_portal: 이 데이터는 매년 수행되는 현행화 사업을 통해 보정된 여객수단 OD(Origin–Destination) 자료로, 출발지와 도착지 쌍별 교통수단별 통행량을 제공합니다. 자료에는 년도, 기점지역/종점지역 및 지역코드, 승용차·버스·지하철·택시·기타 수단별 통행량, 총수단(환승미포함/환승포함) 지표가 포함되어, 지역 간 이동 규모와 수단 선택 구조, 환승 고려 여부에 따른 수요 차이를 종합적으로 파악할 수 있습니다. 이를 통해 통행패턴 분석, 광역·기초권역 간 흐름 진단, 노선·환승시설 계획, 혼잡 완화 및 수요 관리 전략 수립에 활용할 수 있습니다.※ 해당 자료는 현재로부터 2년전의 자료를 기반으로 현행화되고 있으니 이용에 참고하여 주시기 바랍니다.※ 해당 데이터는 4년 주기로 데이터를 취합하여 갱신하고 있으니 이용에 참고하여 주시기 바랍니다.
