description_portal: 카셰어링 차고지의 이름, 주소, 좌표를 기반으로 차고지 정보(차고지명, 차고지ID, 주소, 좌표)를 조회하는 서비스 입니다.현재 제공가능 지역은 쏘카(서울), 그린카(전국) 카셰어링 차고지 정보를 조회할수 있으며, 이름, 주소 및 위치 좌표 정보를 기준으로 차고지 정보를 조회할수 있습니다.본 서비스는 각 카셰어링 사업자가 운영하는 차고지를 대상으로 하며, 입력된 차고지명 또는 주소, 좌표 정보를 바탕으로 차고지 ID, 차고지명, 상세 주소, 위·경도 좌표 등 기본적인 차고지 정보를 제공합니다.이를 통해 이용자는 원하는 위치 인근의 차고지를 보다 쉽게 검색하고 확인할 수 있으며, 차량 대여 전 차고지 위치 및 접근성을 사전에 파악할 수 있습니다.또한 한번에 출력되는 데이터 목록수를 설정할수 있으며, 페이지 번호를 설정하여 전체 데이터를 분할하여 호출이 가능합니다. TAGO 연계현황및 기술자료는 http://www.tago.go.kr에서 확인이 가능합니다.데이터 활용 추가 문의사항은 TAGO 운영팀(054-459-7870)으로 문의 바랍니다.
