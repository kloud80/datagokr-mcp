summary_user: 카셰어링 차고지(쏘카·그린카)를 한 곳씩 건별로 담은 데이터로, 차고지ID·차고지명·주소·위경도·사업자 구분(type)이 들어 있고 API 전체 579건, 범위는 전국이다. 카셰어링 이용자가 "내 위치 근처에 대여할 수 있는 차고지가 어디인가"를 찾거나 분석가가 차고지 분포를 볼 때 쓴다. 주소(address)와 좌표(경도·위도, WGS84)가 조인 키라서 주소·좌표를 쓰는 다른 위치 데이터와 이어 쓰고, 차고지ID(zoneId)로 차고지를 구분한다.
limits: 이름·주소 조회용 필수 파라미터(zoneName, zoneAddr)는 다른 데이터에서 먼저 받아 넘겨야 하며, 검증 때 /GetCarZoneListByName, /GetCarZoneListByAddr 두 오퍼레이션은 최소 파라미터로 응답이 없었다. 차고지 위치·주소 정보만 담으며 차량 재고나 요금 정보는 이 데이터에서 확인되지 않는다.
