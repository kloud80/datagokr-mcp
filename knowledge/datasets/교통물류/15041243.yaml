summary_user: 대구도시철도 3호선 역사별 화장실 위치를 화장실 한 곳당 한 행으로 담은 파일(약 5.5KB CSV)로, 운영기관·노선·역명과 함께 지상·지하 구분, 역층, 개찰구 안팎(게이트내외), 출구번호, 상세위치, 화장실 구분을 기록한다. 대구 3호선 이용객이나 교통약자 안내 서비스 개발자가 '이 역 화장실이 개찰구 안에 있어 요금을 내고 들어가야 하는가, 몇 번 출구 쪽인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 역명·노선명을 기준으로 다른 노선의 화장실·역사 시설 데이터나 역 정보와 이름 매칭으로 이어 쓴다.
limits: 역 코드 같은 표준 조인 키가 없어 다른 데이터와 연결하려면 역명·선명 문자열을 맞춰야 한다. 대구 3호선 한 노선만 담고 있어 다른 노선·환승역의 다른 노선 화장실 위치는 별도 데이터로 확인해야 한다.
