summary_user: 광산구에 있는 화물자동차 운송업체를 업체 한 곳씩 담은 파일 데이터로, 회사명, 행정동·법정동, 허가받은 차량 대수(허가대수), 위치 좌표를 함께 담는다. 분석가나 물류 사업자가 '광산구 어느 동에 화물운송사가 몰려 있고, 업체마다 허가 차량이 몇 대인가'를 볼 때 쓴다. 전역 조인 키가 없어서 회사명이나 행정동·법정동 이름으로 맞춰 붙이거나 좌표로 지도에 겹쳐 쓴다. 허가 여부를 전국 기준으로 대조하려면 전국화물자동차운송사업자표준데이터와 이름으로 비교한다.
