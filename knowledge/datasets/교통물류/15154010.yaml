summary_user: 한국건설기술연구원이 제공하는 전국 도로 구간의 기준정보로, 조사연도별로 구간마다 도로등급·노선번호와 노선명·구간명·시도 코드·차로수·구간 길이를 담는 구간 단위 목록이다. 교통량이나 사고 같은 도로 통계를 분석하는 분석가가 "이 구간은 어느 노선의 몇 차로, 몇 km 구간인가"를 확인할 때 기준표로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 구간 ID(SCTN_ID)나 노선번호·구간명 같은 이름·코드 매핑, 또는 같은 기관 데이터의 코드로만 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하고 있는 구간기준정보입니다.
