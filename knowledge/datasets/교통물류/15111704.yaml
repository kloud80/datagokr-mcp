summary_user: 경기도 파주시 교차로 접근로별로 기준일자, 현장명·카메라명, 신호방향(동서남북), 직진·좌회전·우회전·유턴 방향별 교통량과 합계, 방향별 포화도, 보행자 수·지체시간·대기행렬(평균·최대)을 담은 CSV 파일(약 4.8MB)이다. 교통 분석가나 시 교통 담당자가 "파주시 어느 교차로 접근로에서 좌회전 교통량과 포화도가 높아 신호 조정이 필요한가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 현장명(주소정보_현장명)이나 카메라명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 경기도 파주시 접근로통계데이터로 특정 일자 기준 주소정보기반 현장명 및 카메라명, 동서남북 신호방향 형태의 신호정보, 직진, 좌회전, 우회전, 유턴방향별 교통량 및 교통량 합계와 포화도 정보, 지체시간, 대기행렬 평균 및 최대치를 포함하는 보행자 정보 등으로 구성되어 있어, 교통흐름 분석, 신호체계 개선 및 도시교통 연구, 실시간 및 과거 교통 패턴 파악, 주소 및 카메라 정보를 통한 현장 특성을 통한 교통량 변화 예측 및 보행환경 개선 연구 등에 활용할 수 있습니다.이 데이터는 도시교통관리, 신호제어시스템 최적화, 교통혼잡분석 등 연구 및 개발에 광범위하게 활용될 수 있으며, 실제 현장 데이터 기반으로 교통흐름과 보행자 패턴을 종합적으로 파악하는 데 활용될 수 있습니다.
