summary_user: 인천공항 화물편의 조회 당일 운항현황을 편 단위로 담으며, 항공사·편명·예정시간·변경시간·상대 공항과 공항코드(IATA)·탑승구·터미널·현황(도착·결항·지연·회항·착륙)을 언어별로 제공한다. 물류업체나 화주가 "오늘 인천에 들어오는 특정 화물편이 지연·결항됐는지, 어느 화물터미널로 오는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 공항코드(airportCode, IATA)나 편명·항공사명을 이름·코드로 맞춰 공항코드 정보나 인천공항 여객편 운항현황 등과 연결한다.
description_portal: '인천공항 화물편의 운항현황에 대한 데이터입니다. 조회시간, 출발지 공항(IATA),편명,항공사(IATA),언어구분을 기준으로 항공사,편명,예정시간,변경시간,출발공항,탑승구,현황(도착,결항,지연,회항,착륙),출발공항코드(IATA),터미널(P0:제1터미널,P02:탑승동,P03:제2터미널,C01: 화물터미널 남측, C02: 화물터미널 북측,C03:제 2화물터미널)데이터를 제공합니다. 조회당일에 대한 데이터를 조회하실 수 있습니다. 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 1000000 트래픽을 제공합니다.'
