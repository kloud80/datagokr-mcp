summary_user: 대전광역시 도로관리시스템에서 관리하는 면형 도로 점용시설(주차장·광장·버스정류장·교통섬 등)을 시설 한 건씩 담은 파일로, 지리정보(WKT) 형상과 관리번호·허가일련번호·행정읍면동·도로구간번호·차도보도 구분을 포함한다(CSV 약 129KB). 도시계획·도로행정 분석가가 '특정 읍면동이나 도로구간에서 도로 면적을 차지하는 점용시설이 어디에 얼마나 있는가'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 도로구간번호·관리번호처럼 같은 기관(대전시 도로관리시스템) 데이터와 공유하는 코드로만 연결하고, WKT 형상으로 공간 조인하는 방식이 현실적이다.
description_portal: 대전광역시_도로 점용시설(면) 현황 데이터는 대전광역시 도로관리시스템을 통해 관리되고 있는 면적 기반의 도로 점용시설 현황 정보를 담고 있습니다. 이 데이터에는 도로 내 일정 면적을 차지하는 주차장, 광장, 버스정류장, 교통섬 등 다양한 유형의 점용시설명과 위치 정보, 점용 범위, 점용 면적, 관리번호 등의 세부사항이 포함되어 있습니다. 각 면형 점용시설의 현황을 체계적으로 제공함으로써 공간 활용 현황 분석, 시설물 관리, 도로 관련 행정 업무, 도시 공간 재구성, 기반시설 정책 수립 등에 실질적으로 활용되고 있습니다.※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
