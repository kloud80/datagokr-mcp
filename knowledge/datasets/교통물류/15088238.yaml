summary_user: 경상남도 진주시 전역 버스정류장을 정류장 한 곳당 한 행으로 담은 원장 파일로, 정류소 아이디·정류소명·위도·경도와 데이터 기준일자를 담는다. 진주시 주민이나 지도 서비스 개발자가 "우리 동네 근처 버스정류장이 어디에 있는가"를 찾거나 정류장 접근성을 분석할 때 쓴다. 전국 공통 조인 키는 확인되지 않아, 실시간 도착 정보(TAGO·지자체 BIS) 같은 다른 데이터와는 정류소 아이디나 정류소명 매핑, 또는 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경상남도 진주시 버스정류장 현황 데이터는 시 전역에 위치한 버스정류장의 기본 정보를 체계적으로 정리하여 CSV 형식으로 제공합니다. 제공 항목에는 정류소ID, 정류소명, 위도, 경도 등이 포함되어 있으며, 총 1911건의 위치 기반 데이터로 구성되어 있습니다. 이러한 자료는 시민의 대중교통 이용 편의 증진, 버스 노선 관리 효율화, 교통 정책 수립 등에 폭넓게 활용됩니다. 또한 지도 기반 서비스 구축, 정류장 접근성 분석, 정류장 혼잡도 모니터링 등 다양한 연구·행정 분야에서 중요한 참고자료로 활용 가치가 높습니다.
