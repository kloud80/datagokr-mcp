description_portal: 이 데이터는 해양수산부에서 항만건설사업의 계약 이행 관리와 사업 진행 상황을 확인하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 항만건설사업별 계약명, 계약체결일, 계약금액, 착공일자, 준공일자, 매월의 공정년월, 월별 공정 계획 및 실적 정보로 구성되어 있습니다.  본 데이터는 항만건설사업의 세부 진행 관리, 시공 현황 파악, 사업 일정 준수 여부 확인, 항만시설의 투입 자원 및 비용 관리 현황 검토 등에 활용될 수 있습니다. 건설사업 발주기관은 항만건설사업의 체계적 공정 관리를 위한 내부 참고자료로 사용할 수 있으며, 사업 관련 회계‧감사자료 작성과 국책사업 추진 과정의 사업관리 근거자료로도 활용할 수 있습니다.
