summary_user: 서울시설공단 도로관리처가 관리하는 서울시 자동차전용도로의 법정 도로부속물(옹벽·비탈면)을 시설물 한 건씩 담은 목록 파일로, 시설물 종류·노선·방향·위치·소재지·시설물등급·최고높이·연장·구조형식·기준일을 포함한다. 시민이나 안전 분석가가 '내가 다니는 자동차전용도로 노선에 어떤 등급의 옹벽·사면이 어느 위치에 얼마나 길게 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·소재지 주소 같은 이름 매칭이나 같은 기관 자료로만 이어 붙인다.
description_portal: 서울시설공단 도로관리처가 관리하는 서울시 자동차전용도로 내 법정 도로부속물(옹벽·비탈면) 현황입니다.이 자료는 「시설물의 안전 및 유지관리에 관한 특별법(시설물안전법)」에 따라, 높이 5m 이상 구간의 총합이 100m 이상인 옹벽, 30m 이상 절토사면 중 수평 길이 100m 이상인 구간을 포함한 제1종 법정시설물 목록입니다.해당 시설물들은 등 중대 재난과 직결되는 구조물로서, 정기적 점검과 지속적인 관리가 요구됩니다.이 데이터는 시설물 유형, 위치, 규격, 설치연도, 관리상태 등을 포함하며, 시민 안전 확보와 시설물 유지보수, 관련 정책 수립 등에 활용될 수 있습니다.
