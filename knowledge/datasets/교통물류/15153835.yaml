summary_user: 한국철도공사가 출발역·도착역 쌍마다 최단 운행 거리(km)를 여객 기준과 화물 기준으로 나눠 담은 전국 단위 파일(csv 약 45MB)로, 경유역 순서(구간거리내용)와 거리 적용 시작·종료일자를 함께 기록한다. 화주·물류 분석가가 두 역 사이 화물 운임 산정 거리가 얼마인지, 여객 거리와 어떻게 다른지 확인하거나 노선 변경에 따른 거리 변화 이력을 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 역은 코드가 아닌 역명으로만 들어 있어, 다른 역 마스터·화물 데이터와는 역명 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 한국철도공사의 화물 운송 운임 및 운행 계획 수립에 핵심적인 기초 정보를 제공합니다. 각 레코드는 출발역 코드와 도착역 코드를 기준으로 역 간의 최단 운행 거리(km)를 정량적으로 명시합니다. 특히, 여객 최단 운행 거리와 화물 운행 거리를 구분하여 제공하는데, 이는 화물 열차가 여객 열차와는 다른 노선이나 운행 규정을 따를 수 있음을 반영하며 정확한 운임 산정을 위한 근거가 됩니다. 구간 거리 내용 컬럼은 최단 거리 경로를 구성하는 경유역들을 순서대로 기록하여, 실제 운행 경로의 추적 및 검증을 가능하게 합니다. 적용 시작/종료 일자는 해당 거리 정보의 유효 기간을 나타내어 선로 변경이나 노선 신설 등의 인프라 변화 이력을 추적할 수 있습니다. 이 데이터는 화물 운송 요금 체계 분석, 물류 비용 산정의 투명성 제고, 최적 경로 기반의 물류 효율화 연구, 철도 네트워크 인프라 분석 등에 폭넓게 활용될 수 있습니다.
