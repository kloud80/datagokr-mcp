summary_user: 부산교통공사가 운영하는 도시철도 역사를 한 행씩 담은 역 기본정보 파일로, 역코드·역명·영문역명·전화번호·도로명주소와 환승주차장·자전거보관소·물품보관함·엘리베이터·도시철도경찰대 등 편의시설 보유 여부, 섬식 승강장 여부, 역명 유래를 수록한다(약 32KB CSV). 시민이나 관광 콘텐츠 기획자가 '엘리베이터와 물품보관함이 있는 부산 지하철역은 어디인가', '이 역 이름은 어디서 유래했나' 같은 질문에 답할 때 쓰고, 역세권 판정이나 교통시설 분석의 역 기준표로도 쓴다. 전역 공통 조인 키는 없어 다른 데이터와는 역명이나 부산교통공사 자체 역코드(역코드)로 맞춰 이어 쓰며, 같은 기관의 승하차·시간표 데이터와 연결하기에 적합하다.
description_portal: 본 데이터는 부산교통공사에서 운영 중인 도시철도 역사에 대한 기본 정보를 제공합니다.역사별 고유 코드, 역명, 영문역명, 연락처, 도로명주소 등 위치 기반 정보와 함께 환승주차장, 자전거보관소, 물품보관함, 엘리베이터, 도시철도경찰대 등의 편의시설 보유 여부를 포함하고 있습니다. 또한 각 역사명의 유래 및 지명에 대한 간단한 설명도 수록되어 있어, 도시철도 역사별 지역적 특성과 문화적 배경까지 파악할 수 있습니다. 도시철도 노선 안내, 승객 편의정보 제공, 교통시설 분석, 관광 콘텐츠 개발 등 다양한 목적에 활용이 가능하며, 도시 교통 인프라에 대한 기초 정보를 종합적으로 제공합니다.
