description_portal: 서울교통공사 역간이용인원 (2021년 10월) 정보입니다. 해당 데이터는 연번, 출발역코드, 출발역명, 도착역코드. 도착역명, 역간이용인원(2021년 10월)로 구성되어 있습니다. 해당 데이터는 데이터 요청에 의해 2021년 10월 데이터에 대해서만 업데이트 되었습니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다. 2021년 10월 기준의 자료이기 때문에, 까치울과 부평구청 구간이 포함되어 있습니다. 2022년 1월 기준으로 까치울과 부평구청 구간은 인천교통공사 구간으로 이관되었음을 알려드립니다.
