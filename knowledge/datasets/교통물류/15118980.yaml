summary_user: 한국도로공사가 관리하는 고속도로 터널별로 노선명, 터널명, 터널길이, 소화기구 수량, 옥내소화전 개수를 담은 전국 단위 현황 파일(csv, 약 47KB)이다. 도로 안전 담당자나 분석가가 "길이가 긴 터널 가운데 소화기·옥내소화전이 상대적으로 적게 설치된 곳은 어디인가" 같은 방재설비 보강 우선순위 질문에 쓴다. 전역 조인 키가 없어 다른 터널·노선 데이터와는 노선명·터널명을 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국도로공사에서 관리하는 고속도로 터널 내 소방방재설비의 설치 현황을 정리한 자료이다. 데이터는 노선명, 터널명, 터널길이, 설치된 소화기구 수량, 옥내소화전 개수 등으로 구성되어 있으며, 각 터널별 방재설비의 분포와 규모를 체계적으로 확인할 수 있다. 본 자료는 터널 내 화재 발생 시 대응력 확보를 위한 소방설비의 설치 수준을 진단하고, 안전관리 실태를 파악하며, 유지보수 및 추가 설치 계획 수립 시 기초자료로 활용된다. 특히 장대터널이나 통행량이 많은 주요 터널을 대상으로 위험도 평가 및 방재 인프라 보강의 우선순위를 설정하는 데 기여한다. 이용자의 안전 확보와 화재 재난 예방을 위한 고속도로 터널 관리 정책 수립에 필수적인 자료로 제공된다.
