summary_user: 전국 지방자치단체가 관리하는 재개발·재건축 정비사업을 구역 단위로 한 행씩 담은 표준데이터로, 구역명·시도·시군구·용도지역·건폐율·총면적·세대수·지정일자·진행단계를 포함하며 파일은 약 22KB 규모의 CSV다. 내 동네 주변에 어떤 정비구역이 지정돼 있고 사업이 어느 단계까지 진행됐는지, 예정 세대수가 얼마인지 알아보려는 주민·부동산 분석가가 쓴다. 전역 조인 키는 없어 시도명·시군구명을 행정구역 이름으로 맞추거나 제공기관코드로 같은 기관의 다른 표준데이터와 이어 쓴다.
limits: 수록 범위가 확인되지 않아 전국 모든 정비구역을 빠짐없이 담았다고 보기 어렵고, 행정단위는 시군구까지다. 공통 코드 키가 없어 다른 데이터와 연결할 때 이름 매칭 오류에 주의해야 한다. 부문이 교통물류·도로로 분류돼 있으나 내용은 도시·부동산 정비사업 정보다.
