description_portal: 경기도 광역공공버스 노선별 인원수송 운행실적(파일형 데이터)- 경기도 광역버스 운행 안정화와 도민 교통편의 증진을 위해 추진한 공공관리제 노선별 인원수송 정보를 나타냅니다.- 개방 데이터는 대도시권광역교통위원회 및 경기도에서 추진하는 광역공공버스의 운행노선을 경쟁입찰하여 낙찰된 운송사업자가 해당 노선을 운영합니다.- 연 단위로 노선별 수송한 인원을 (명)으로 나타내며 관할시군, 운송사업자명 등 으로 분류됩니다.- 해당 데이터는 시군 지역별 운행되는 노선의 경로에 따라 이동하는 인원(유동인구)을 유추할 수 있으며, 정류소별 승하차 데이터와 연계하여 해당 지역 경제 활성화 등에 대한 연구자료로 활용할 수 있습니다.
