summary_user: 경기도 광역공공버스(공공관리제 경쟁입찰 노선)의 노선별 연간 수송인원(명)을 2023~2025년 연도별 열로 담은 집계 파일이며, 관할시군·노선번호·운송사업자명·운행개시일로 구분된다. 분석가나 지자체 담당자가 '우리 시군을 지나는 광역공공버스 노선 중 어느 노선이 연간 몇 명을 실어 나르고 해마다 얼마나 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 정류소별 승하차 데이터나 노선 원장과는 노선번호·관할시군 이름을 맞춰 연결해야 한다.
limits: 연 단위 노선별 합계라 정류소별·시간대별 승하차나 실제 이동 경로는 알 수 없다. 공통 코드 키가 없어 다른 버스 데이터와는 노선번호·시군명 문자열 매칭으로만 이어지며, 같은 번호의 다른 노선과 섞이지 않게 주의해야 한다.
