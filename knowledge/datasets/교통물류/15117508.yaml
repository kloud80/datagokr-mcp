description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야 환경관리 정보 데이터로, 대구교통공사 도시철도 1·2호선 역사별 공기청정기 설치 현황 정보를 제공합니다. 데이터에는 역사명, 공기청정기 설치 대수, 제조사, 모델명, 적용면적, 처리용량, 설치일자 등의 주요 항목이 포함되어 있으며, 역사 내 공기정화 설비 운영 현황을 파악하고 체계적인 시설 관리를 위한 기초자료로 활용할 수 있습니다. 해당 데이터는 역사별 공기청정기 설치 현황 비교·분석, 설비 유지관리 계획 수립, 노후 장비 교체 검토 및 환경관리 정책 수립 등에 활용할 수 있습니다. 또한 도시철도 이용 공간의 환경관리 현황을 객관적으로 확인할 수 있는 자료로서 쾌적한 이용환경 조성과 효율적인 설비 운영에 기여할 수 있습니다. 본 데이터는 연 1회 갱신되며, 최신 공기정화 설비 설치 현황을 반영합니다.'
