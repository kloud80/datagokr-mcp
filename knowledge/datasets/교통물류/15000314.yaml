summary_user: 서울특별시 버스 노선ID 기준으로 정류소별 실시간 도착 예정 정보(도착 예측 시간, 차량번호, 혼잡도, 만차·막차 여부 등)를 조회하는 API이다. 버스를 기다리는 시민이나 안내 서비스 개발자가 '이 정류소에 다음 버스가 몇 분 뒤 오는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 노선·정류소 정보와는 이름·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 서울특별시 버스도착정보조회 서비스는 특정 노선ID를 기반으로 해당 정류소에서의 실시간 버스 도착예정 정보를 제공하는 API입니다. 이 서비스는 첫 번째·두 번째 도착 예정 버스의 메시지, 예측 도착 시간(초), 차량번호, 버스유형, 혼잡도, 만차 여부, 막차 여부 등 다양한 운행 정보를 상세히 제공합니다. 또한 주요 정류소별 예정여행시간, 다음 정류소 정보, 배차간격, 노선 유형과 정류소 기본 정보까지 포함하여 버스 운영 상황을 종합적으로 파악할 수 있습니다. 이를 통해 이용자는 정확한 도착 예측과 혼잡도 기반의 이동 판단이 가능하며, 버스 정보 안내 서비스 구축에도 폭넓게 활용할 수 있습니다. API 활용은 참고문서 확인 바랍니다.
