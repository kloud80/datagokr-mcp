summary_user: 양주시 도시지역 광역교통정보 시스템의 교통 CCTV별로 촬영 구역, 카메라 회전 각도·팬값 범위, 자막 크기·표시 좌표, 교차로명 같은 자막 내용을 한 행씩 담은 원천 현황 파일(csv 약 3KB)이다. 교통관제·교통정보 서비스 운영자나 분석가가 '양주시의 이 CCTV 영상은 어느 교차로·도로를 비추는가'를 확인하거나 회전형 CCTV의 구역별 촬영 범위를 점검할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 자막에 적힌 교차로명·도로명을 이름으로 맞추거나 같은 기관의 CCTV 식별번호로만 이어 쓴다.
description_portal: 본 데이터는 도시지역 광역교통정보 시스템에서 운영 중인 교통 CCTV 영상에 표시되는 자막 정보 및 자막 표시 설정 현황을 제공하는 데이터입니다. CCTV별 고유 식별번호, 촬영 구역(Sector) 정보, 카메라 회전(Pan) 범위, 자막 크기, 자막 표시 좌표, 자막 내용 등의 정보를 포함하고 있습니다.교통 CCTV 영상에 표시되는 자막은 교차로명, 도로명, 주요 시설명 등 교통 관측 지점의 위치 정보를 제공하며, 교통관제센터 및 교통정보 서비스에서 영상 식별과 위치 확인을 위해 활용됩니다. 또한 회전형 CCTV의 촬영 범위와 자막 표시 위치 정보를 함께 제공하여 CCTV 운영 및 유지관리, 교통정보 제공 서비스의 품질 향상에 활용할 수 있습니다.본 데이터는 도시교통 관제 업무 지원, 실시간 교통상황 모니터링, 교통정보 제공 서비스 운영, 지능형교통체계(ITS) 구축 및 운영, 스마트시티 기반 교통 서비스 개발 등을 위한 기초자료로 활용될 수 있습니다. 또한 공공기관, 연구기관, 민간기업 등이 교통 빅데이터 분석, 교통안전 정책 수립, 스마트모빌리티 서비스 개발 및 디지털 기반 도시관리 체계 구축에 활용할 수 있습니다.
