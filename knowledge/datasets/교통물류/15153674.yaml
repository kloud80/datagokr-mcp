summary_user: 경상남도 의령군의 2024년 불법주정차 신고를 건별로 담은 파일로, 신고일시·신고위치·과태료 부과 여부가 한 행에 들어 있습니다(CSV 약 30KB). 군민이나 분석가가 '의령군에서 불법주정차 신고가 많은 곳과 시간대는 어디이며, 신고 중 실제 과태료로 이어진 비율은 얼마인가'를 살피는 데 씁니다. 전역 조인 키가 없어 다른 데이터와는 신고위치 주소 문자열을 지명·주소로 매핑하거나 같은 기관(의령군) 데이터끼리 이어 씁니다.
description_portal: 본 데이터는 경상남도 의령군의 2024년 불법주정차 신고 및 과태료 부과 현황 데이터입니다. 신고일시, 신고위치, 과태료부과여부, 데이터기준일자로 구성되어 있습니다. 본 데이터는 불법주정차 개선 효과 분석 및 교통 안전 정책 수립에 활용될 수 있으며, 지역별/기간별 추세 파악이 가능해 연구기관, 기업, 시민 등 다양한 이용자가 도시 교통 환경 개선을 위한 참고자료로 활용할 수 있도록 구성되어 있습니다. 또한 지역별 불법주정차 발생 밀집 구역 파악, 단속 인력 및 예산 배분의 효율화, 주정차 환경에 따른 안전사고 위험도 분석 등 공공기관에서도 기초 자료로 활용될 수 있습니다. 본 데이터는 공공데이터 포털에서 누구나 활용할 수 있도록 공개되어 있습니다.
