summary_user: 경상북도가 이동식 과적단속 장비로 검측한 운행제한 위반차량 단속 결과를 구분(사업소 등)별로 집계한 파일로, 검측·적발 건수와 축중·총중·폭·높이·길이·도주고발 등 위반 유형별 건수, 통과 차량, 지시요구자 고발, 단속기간을 담는다(약 1.6KB의 소규모 CSV). 도로 관리 담당자나 분석가가 '경북에서 과적 단속 시 어떤 위반 유형이 가장 많이 적발되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소·지역 이름이나 기간을 수작업으로 맞춰 이어 써야 한다.
description_portal: 경상북도 운행제한 위반차량 단속 현황은 도내 이동식 과적단속 장비를 활용하여 차량의 적재중량, 총중량, 폭·높이·길이 등 법정 한계를 초과했는지를 검측하고, 그 결과를 항목별로 구분해 정리한 월별 단속 현황입니다. 각 사업소에서 수행한 검측 건수와 적발 건수, 유형별 위반 내역, 도주‧기타 사유 등이 세부적으로 기록되어 있어 실제 단속 과정에서 어떤 항목에서 위반이 많이 발생하는지 파악할 수 있습니다. 또한 통과 차량 수, 지시요구자 고발 여부, 단속기간 등의 정보가 포함되어 있어 도로 안전 관리 및 정책 수립 시 활용도가 높습니다. 이러한 자료는 과적 운행으로 인한 도로 포장 손상과 교통사고 위험을 줄이기 위한 근거 자료로 사용되며, 계절적·지역적 단속 흐름을 비교하는 데에도 도움이 됩니다.
