summary_user: 경찰청이 만든 교통안전 취약구간 중 교량·대교 구간 정보를 구간 단위로 담은 전국 범위 데이터이며, 구간명·구간 유형·길이·차로 수·지번/도로명 주소·위경도와 인근 병원·소방서·경찰서·가까운 IC 정보를 함께 제공한다. 운전자나 교통안전 분석가가 "우리 지역의 사고 취약 교량 구간은 어디이고, 사고가 나면 가장 가까운 병원과 소방서는 어디인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 법정동 코드(STDG_CD)나 주소, 위경도 좌표로 매핑해 이어 쓰고, 같은 시리즈의 터널·지하차도 등 다른 취약구간 데이터와는 같은 분류 코드 체계로 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 경찰청에서 제공하는 교통안전정보(취약구간)-교량대교 정보입니다.
