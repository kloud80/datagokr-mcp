description_portal: 울특별시 시정통계를 기반으로 교통불편 민원신고 현황을 제공하는 자료이다. 버스, 택시 등 대중교통수단별로 접수된 교통불편 민원 건수를 연도별로 집계하여 제공하며, 승차거부, 불친절, 승하차전 출발 및 무정차 통과, 부당요금 징수, 장기정차 여객 유치행위 등 다양한 민원 유형별 현황을 포함한다. 이를 통해 대중교통 서비스 이용 과정에서 발생하는 시민 불편 사항과 교통서비스 품질 수준을 파악할 수 있으며, 교통행정 개선, 운수종사자 서비스 관리, 시민 만족도 향상 정책 수립 및 교통 분야 민원 동향 분석을 위한 기초자료로 활용할 수 있다.
