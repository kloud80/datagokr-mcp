summary_user: 대구교통공사 도시철도 3호선 각 역 출구의 호선·역명·출구번호와 위도·경도 좌표를 출구 한 곳당 한 행으로 담은 파일 데이터이며, 검증 시 79행을 받았다. 도시철도 이용자나 앱 개발자, 접근성 분석가가 특정 역의 출구가 지도상 어디에 있는지 확인하는 질문에 쓴다. 위도·경도(coord 키)로 다른 역·시설 좌표 데이터와 공간 기준으로 이어 쓰며, 역 좌표·출입구 기준 역세권 판정에 활용하는 철도망·역 부문 마스터 성격이다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 3호선 역사별 출구 위치 정보를 제공하는 공간정보 데이터입니다. 데이터에는 역명, 출구번호, 위도(Latitude), 경도(Longitude) 좌표 등의 주요 항목이 포함되어 있으며, 각 역사 출구의 위치 현황을 지도 기반으로 확인할 수 있는 자료입니다. 해당 데이터는 도시철도 이용자의 이동 경로 확인, 위치 기반 서비스 개발, 역사 접근성 분석 및 시설 운영 관리 등을 위한 기초자료로 활용할 수 있습니다. 또한 출구 위치 정보를 활용하여 도시철도 이용 편의 개선과 교통약자를 포함한 이용객의 접근성 향상을 위한 자료로 활용할 수 있습니다. 본 데이터는 출구 위치 변경 등 변동 사항 발생 시 갱신되며, 도시철도 시설 위치 정보를 반영합니다.'
