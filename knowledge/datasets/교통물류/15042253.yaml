description_portal: '본 데이터는 부산광역시 지능형교통체계(ITS)에서 운영 중인 차량 인식 장치를 통해 수집한 차량 이동 구간별 통과 이력입니다.도시철도 벡스코역과 동래역을 구간에 설치된 번호판 인식 카메라를 통해 동일 차량이 서로 다른 지점을 통과한 시각을 비교하여 구간별 주행시간, 평균속도 등을 산출합니다.<자료에 포함된 정보>진입시간: 차량이 특정 지점을 진입한 날짜와 시간진출시간: 차량이 특정 지점을 진출한 날짜와 시간차종: 승용차, 화물차, 버스통행시간(초): 차량이 진입, 진출을 통과할 때 걸린 소요시간이 자료는 구간별 평균 속도와 소요 시간 분석, 교통 혼잡 구간 및 시간대 파악, 실시간 교통정보 서비스 개선의 기초자료로 활용할 수 있습니다.기대 효과: 본 데이터를 활용하면 시민에게 보다 정확하고 신뢰성 있는 실시간 교통정보를 제공할 수 있어, 목적지까지의 이동 계획을 효율적으로 세울 수 있습니다. 또한, 구간별 혼잡도 분석과 주행시간 예측을 통해 교통 혼잡을 완화하고 도로 운영의 효율성을 높일 수 있습니다. 물류와 여객 운송 분야에서는 최적 경로 선정과 소요 시간 단축에 기여하여 서비스 품질을 향상시킬 수 있으며, 연구기관과 스타트업은 본 데이터를 기반으로 한 새로운 교통 분석 기법과 솔루션을 개발할 수 있습니다.'
