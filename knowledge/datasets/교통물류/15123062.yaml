summary_user: 철도운영자와 시설관리자가 철도안전정보종합관리시스템으로 보고한 철도사고를 한 건씩 담은 전국 단위 목록으로, 사고 일시·철도구분·사고 종류·주원인과 근본원인·노선과 발생 역·사상자(사망·중상·경상)·피해액·최대 지연시간을 담는다(파일 약 9.9KB). 분석가나 국민이 "어느 노선·역에서 어떤 원인의 철도사고가 났고 사상자와 피해 규모는 얼마였나"를 확인하거나 원인별·철도구분별 사고 경향을 정리하는 데 쓴다. 전역 조인 키는 없어서, 다른 철도 데이터와는 노선명·역명(발생장소역)이나 행정구역 이름을 맞춰 연결해야 한다.
description_portal: 철도안전법 및 하위법령에 의거하여 철도운영자와 시설관리자가 철도안전정보종합관리시스템으로 보고한 철도사고 목록정보 입니다.철도사고 발생일시, 원인, 노선, 사상자 현황이 포함되어 있습니다.철도안전법 제61조(철도사고등 의무보고), 철도안전법 제71조(철도안전정보의 종합관리등)에 의해 수집, 관리된 자료입니다기관 영업비밀에 의해 일부 정보는 비공개된 채로 배포되고 있습니다.
