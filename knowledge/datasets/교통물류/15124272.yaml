summary_user: 서울시 자치구별로 설치된 보행등 한 기씩의 위치를 주소와 X·Y 좌표로 담은 개별 시설 목록이며, 포털에서 활용신청 없이 CSV 파일(약 1.45MB)로 받는다. 구청·시설 관리자나 분석가가 "우리 구 어느 골목에 보행등이 있고, 어두운 보행 구간은 어디인가"를 지도로 확인하거나 점검 대상을 고를 때 쓴다. 전역 조인 키는 없어서 자치구명이나 주소 문자열, 좌표를 기준으로 행정구역 경계·보안등·CCTV 같은 다른 공간 데이터와 겹쳐 쓴다.
