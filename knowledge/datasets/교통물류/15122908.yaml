description_portal: '항공로란 항공기, 경량항공기 또는 초경량비행장치의 항행에 적합하다고 지정한 지구의 표면상에 표시한 공간의 길을 의미합니다.항로명, 시작지점, 종료지점, 상위하위 제한고도등에 관한 정보를 제공하고 있습니다.항로명 :  항공기가 지정된 경로를 따라 비행할 수 있도록 설정된 공식 항공 경로 식별자 입니다.시작지점, 종료지점 :  항공기의 비행 경로를 따라 지정된 항로 지점(Waypoint) 으로, 항공기가 위치를 보고하거나 항행에 활용할 수 있도록 설정된 고정 기준 지점입니다.상위 제한 고도가 공란인 경우는, 해당 항로의 상한 고도가 별도로 제한되지 않았음을 의미합니다.'
