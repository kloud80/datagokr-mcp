summary_user: 한국공항공사가 운영하는 전국 공항(인천국제공항 제외)의 지연 현황을 공항·노선별로 집계한 파일로, 운항편수·지연편수·지연율과 기상·연결편·정비·기타 원인별 지연 건수를 담는다(CSV 882바이트 규모). 항공 분석가나 여행자가 "어느 공항·노선에서 지연이 잦고, 주된 원인이 날씨인지 연결편인지 정비인지"를 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 운항·항공통계 데이터와는 공항명·노선명을 이름이나 공항코드에 맞춰 이어 써야 한다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 전국공항의 지연 현황정보를 제공합니다.해당 데이터는 공항, 노선, 지연편수, 지연율, 기상 원인 지연 건수, 기상 원인 지연, 비행기 연결편 지연건수 및 지연율 정보로 이루어져 있습니다.추가 문의사항 또는 요구사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
