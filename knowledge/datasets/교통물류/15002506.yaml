summary_user: 대구도시철도 1·2·3호선 역마다 무료 자전거 보유 대수, 보관대 수, 경사로 길이(m), 보관 상세위치, 공기주입기 설치 여부, 운영시간을 한 행씩 담은 역별 현황 파일(csv, 약 2.7KB)이다. 대구 시민이나 교통 분석가가 '집 근처 도시철도역에서 무료 자전거를 빌릴 수 있는지, 몇 시까지 운영하는지'를 확인하거나 역별 자전거 연계 편의시설을 비교하는 데 쓴다. 전역 조인 키는 없어 호선·역명을 이름으로 맞춰 역 좌표·역 마스터나 같은 기관의 승하차 데이터와 연결한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선에서 운영 중인 무료 자전거 서비스의 역사별 운영 현황을 제공합니다. 주요 항목은 자전거 보유 대수, 자전거 보관대 설치 현황, 경사로 길이(m), 자전거 보관 위치의 상세 정보, 공기주입기 설치 여부 및 운영시간으로 구성되어 있습니다. 본 자료는 도시철도와 자전거를 연계한 친환경 교통수단 이용 활성화와 시민의 이동편의 증진을 지원하기 위해 제공되며, 자전거 이용 접근성 향상과 역사별 서비스 운영 현황을 파악하는 데 활용할 수 있습니다. 또한 자전거 이용 수요 분석, 생활권 이동 패턴 분석, 친환경 교통정책 수립, 역사 편의시설 운영 개선 및 공공 모빌리티 서비스 개발을 위한 기초자료로 활용될 수 있습니다. 아울러 대중교통과 개인형 이동수단의 연계성 강화, 탄소배출 저감 및 지속가능한 교통체계 구축을 지원하는 자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
