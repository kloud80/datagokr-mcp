summary_user: 경기도버스운송관리시스템(BMS)의 버스 운임기준을 운임기준 아이디 단위로 담은 기준표로, 요금구분(기본요금제·거리비례제), 운행유형(일반·좌석형·직행좌석형 등), 적용 기간, 최소·최대·증가 거리, 성인·청소년·어린이별 기본·최대·증가 요금을 담는다. 분석가나 시민이 '경기도 직행좌석버스를 일정 거리 이상 타면 청소년 요금이 얼마까지 오르나' 같은 운임 구조 질문이나 요금 적용 기간 변화를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선·정류장·승하차 데이터와는 운행유형명이나 요금구분명 같은 이름·코드 매핑 또는 같은 기관(경기도) 코드로만 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 운임기준 정보를 포함한 자료로, 각 운임기준아이디에 따라 버스의 요금구분, 운행유형, 적용 거리 및 요금, 연령대별 요금 등을 세부적으로 확인할 수 있습니다. 운임은 기본요금제와 거리비례제로 구분되며, 시내버스 및 다양한 유형의 시내버스(좌석형, 직행좌석형 등)에 대해 최소거리와 최대거리, 증가거리 기준으로 기본요금과 연령별 추가요금이 설정되어 있습니다. 주요 컬럼에는 '운임기준아이디', '요금구분코드', '운행유형', '단일요금세부코드', '운임정보시작일', '운임정보종료일', '성인기본요금', '청소년기본요금', '어린이기본요금', '증가거리', '증가요금', '등록일자', '수정일자' 등이 있습니다.
