summary_user: 경주시 교통정보시스템이 수집한 주요 도로구간별 소통현황을 구간(아이디·명칭) 단위로 길이, 평균 속도, 통행시간, 통계시각과 함께 담은 파일데이터(CSV, 약 18KB)이다. 교통 분석가나 관광·통근 서비스 사업자가 '경주시 어느 구간이 어느 시각에 느려지는가'를 확인하고, 이력을 쌓아 상습 정체 구간을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구간 명칭 매핑이나 같은 기관(경주시) 자료끼리만 이어 쓴다.
limits: 구간 아이디는 경주시 자체 식별자로 보이며 표준 노드·링크 체계와 바로 연결되는 키가 확인되지 않았다. 범위는 경주시 한 곳이고 좌표가 없어 지도 위 표시는 명칭 매핑을 거쳐야 한다. 파일 한 건은 특정 시점의 스냅숏이므로 정체 추세 분석에는 이력을 따로 적재해야 한다.
