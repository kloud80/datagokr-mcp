summary_user: 전라남도에 등록된 국제물류 주선업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 약 3.5KB)로, 상호·주소·전화번호·자본금(억원)을 담는다. 수출입 화물의 운송·통관 대행을 맡길 지역 포워더를 찾는 화주나, 전남 지역 국제물류 주선업체의 분포와 자본 규모를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭으로만 이어 쓰며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터 같은 허가 원장과 상호로 대조한다.
description_portal: '- 전라남도에 등록된 국제물류 주선업체 현황에 대해 정보를 제공합니다.(연번, 상호, 주소, 번호, 자본금(억원) 등에 대해서도 확인할 수 있습니다.)- 국제물류 주선업은 수출입 화물의 운송을 원활하게 하기 위해 운송 계약을 체결하고, 운송절차를 대행하는 서비스업입니다.- 즉, 화주(물건을 보내는 사람)를 대신해 국제 운송 수단(선박, 항공, 철도, 도로 등)을 연결하고, 통관·보험·포장·창고 보관 등 관련 업무를 종합적으로 조정합니다.- 주요 특징- 운송 수단과 경로를 직접 보유하지 않고 주선·중개- 화주와 운송업체 사이에서 조정자 역할- 복잡한 국제 무역·물류 과정을 대행하여 편의 제공- 비용, 시간, 위험 관리를 최적화하는 전문성 요구'
