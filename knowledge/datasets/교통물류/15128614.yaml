summary_user: 전국 정류장 134,442행을 정류장 단위로 담은 파일 데이터로, 정류장 아이디·정류장명·모바일 아이디와 시도·시군구·읍면동 행정구역 정보가 들어 있다. 분석가나 지자체 담당자가 특정 지역에 정류장이 몇 곳 있고 어디에 분포하는지 파악하는 질문에 쓴다. 시도코드(admin_area_code)와 시군구코드(sgg_cd) 법정동 코드로 다른 행정구역 기반 데이터와 잇고, 노선·실시간 도착 데이터와는 정류장 아이디로 연결해 볼 수 있으나 조인 키로 확인된 것은 두 지역 코드뿐이다.
description_portal: 정류장 현황은 대중교통 시스템에서 핵심적인 역할을 하는 데이터로, 정류장의 위치, 명칭, 식별 정보(ID, ARS 번호 등)를 제공하여 이용자들의 이동 편의성과 운영자들의 관리 효율성을 높이는 데 활용됩니다. 주요 항목에는 지역정보(시·도, 시·군·구, 읍·면·동), 정류장 ID, BIMS 기준 모바일 ID, 정류장명 등이 포함되며, 이를 통해 정류장별 이용 현황 분석, 노선 관리, 환승 편의성 향상, 교통 인프라 개선 등 다양한 목적에 효과적으로 활용할 수 있습니다. 정산사업자가 관리하는 정류장을 기준으로 제공하고 있습니다.
