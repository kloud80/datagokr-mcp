summary_user: 경기도 시군(시군구 단위)별 교통 정체구간 비율(%)을 연도별로 평일·주말의 오전(7~9시)·낮(12~14시)·오후(17~19시) 여섯 시간대로 나눠 담은 집계 자료이며, 정체 기준은 고속도로 통행속도 40km/h 미만, 그 외 도로 20km/h 미만이다. 교통정책 분석가나 시군 담당자가 '우리 시의 평일 출근시간 정체 비율이 다른 시군보다 높은가, 해마다 나아지고 있는가'를 비교하는 데 쓴다. 지역명(region)과 지역코드(region_cd)가 있지만 전역 조인 키로 확인되지 않아, 다른 데이터와는 시군 이름이나 코드를 매핑해서 이어 쓴다.
description_portal: '이 데이터는 경기도 내 각 시군별 교통 정체구간 비율을 연도별, 시간대별(평일 및 주말의 오전, 낮, 오후)로 제공하는 자료입니다. 지역명과 지역코드, 시간대별 정체 비율(%) 항목으로 구성되어 있으며, 도시별 교통혼잡 수준을 정량적으로 비교할 수 있습니다. 본 데이터는 교통 정체의 시간대별 패턴과 지역적 차이를 분석하여 도심 교통문제 해결, 혼잡도로 개선 사업, 통근시간 단축 등의 정책 수립에 활용됩니다. 또한, 특정 시군의 정체 심화 시간대를 확인하여 대중교통 확충이나 도로 확장 등의 교통 수요관리 방안을 수립하는 데 기초 자료로 사용될 수 있습니다.※ 산출방법 :* 고속도로 정체기준 : 통행속도 40km/h 미만*고속도로 이외 정체기준 : 통행속도 20km/h 미만- 오전 : 7 ~ 9시, 낮 : 12 ~ 14시, 오후 : 17 ~ 19시'
