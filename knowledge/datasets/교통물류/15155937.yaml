summary_user: 교정시설 수용자의 교도작업으로 생산된 제품을 식별하기 위한 분류 체계를 담은 코드표 파일로, 저장품분류코드와 상위저장품분류코드, 분류명, 공별코드, 구분코드로 구성된 전국 단위 비공간 데이터입니다. 교도작업 제품을 구매하거나 관리하는 기관·사업자, 그리고 분석가가 '이 교정기관 제품 코드는 어떤 품목이며 어느 상위 분류에 속하는가'를 확인하는 데 쓴다. 저장품분류코드(correction_store_cls_cd)가 조인 키이며, 같은 코드를 상위저장품분류코드와 연결하면 분류 계층을 구성하고, 이 코드를 쓰는 다른 교정기관 제품 데이터와도 이어 쓴다.
description_portal: 교도작업은 단순 노동을 넘어, 수용자의 직업전환, 기술 역량 강화, 디지털 리터러시 확보 등 현대 사회가 요구하는 핵심 능력을 개발하는 재사회화 프로그램으로 주목받고 있습니다. 사회적으로 강조되는 공정한 기회 보장, 사회통합, 낙인 해소, 노동시장 재진입 지원과 맞물리며, 출소 후 지속 가능한 경제적 자립 기반을 마련하는 중요한 제도로 평가됩니다.교정시설 수용자가 수행하는 교도작업을 통해 생산된 제품을 식별·관리하기 위해 부여되는 분류 체계가 교정기관제품분류코드입니다. 데이터는 공별로 상위분류코드,  분류명, 구분코드 등으로 구성되어 있으며, 년 1회 주기로 업데이트합니다. 교정기관제품은 매년 새로 추가되거나 삭제될 수 있습니다.
