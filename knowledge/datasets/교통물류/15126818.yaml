description_portal: '서울특별시 마포구청에서 보유하고 있는 관용 전기 자동차의 대수에 관한 정보를 제공합니다. 각 전기자동차의 행정 구역 정보(예: 시도명, 시군구명)와 함께, 에너지원과 차량대수 등의 세부 정보가 제공됩니다.이를 통해 마포구는 친환경 교통수단 보급 현황을 파악하고, 전기자동차 관리 및 정책 수립에 활용할 수 있습니다.또한 친환경 정책 추진, 대기환경 개선, 탄소 배출 감소 등 지속 가능한 도시 발전을 위한 중요한 기초 자료로 활용되며, 지역 내 전기자동차 확대와 관련 서비스 개선에도 기여할 수 있습니다.'
