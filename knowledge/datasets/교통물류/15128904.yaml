description_portal: '부산광역시 해운대에 등록되어 있는 화물자동차 운송주선사업업체 중 주 화물의 종류가 이사화물인 업체에 관한 데이터입니다.부산광역시 해운대구에 주사무소를 두고 있으며화물자동차 운송주선사업 업체 중 주 화물의 종류가 이사화물인 업체의 일반 현황을 알려드립니다.이사화물 업체의 정보 내용은 업체 명, 주소, 전화번호, 업종 입니다.전국화물자동차 운송주선연합회 홈페이지를 이용하시면  보다 많은 정보를 얻으실 수 있습니다.이사화물 업체 뿐만 아니라 일반화물 업체에 대한 정보도 얻으실 수 있습니다.<<홈페이지 이용방법 안내>>전국화물자동차운송주선연합회 홈페이지 방문 (주소: http://www.kffa.or.kr/ ) * 홈페이지 접속 후 메인화면 상단 "화주/소비자 마당" > "회원(허가)업체 검색"을 이용하시면 됩니다.'
