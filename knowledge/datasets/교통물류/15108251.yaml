summary_user: 서귀포시 읍·면·동별로 기준연월마다 승용·승합·화물·특수차의 등록 대수를 관용·자가용·영업용으로 나눠 집계한 통계로, 건별 차량 원장이 아닌 읍면동 단위 집계(CSV 약 83KB)를 담는다. 지역 분석가나 시 담당자가 '서귀포시 어느 동네에 자가용 화물차나 영업용 승합차가 많이 몰려 있는가'처럼 차량 보급 수준과 차종 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름과 기준연월을 맞춰 인구·주차장 등 읍면동 단위 통계에 붙여 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘읍면동별 자동차 등록현황’ 데이터는 서귀포시 각 읍·면·동 단위에 등록된 다양한 차량 유형별 등록 현황을 체계적으로 집계한 공공통계 자료입니다.이 데이터는 기준 연월, 읍·면·동 행정구역, 승용차·승합차·화물차·특수차의 관용, 자가용, 영업용 등록 대수를 구분하여 제공합니다.이를 토대로 각 지역의 차량 보급 수준·차종 분포·자동차 이용 형태 분석이 가능하며 교통수요 예측, 도로 인프라 계획, 주차 정책 기획, 환경 영향 평가 등 다양한 분야에 활용될 수 있습니다.또한 지역별 차량 집중도 지도 제작, 운송업 전략 수립, 전기차 보급 추세 파악 등 실무·연구 용도로도 유용합니다.분기별로 최신 흐름을 반영하며, CSV 파일이나 오픈API(JSON/XML) 형식으로도 제공됩니다.
