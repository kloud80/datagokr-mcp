summary_user: 인천 부평구의 탄력적 주차허용구간을 구간 단위로 담은 파일로, 행정동(동명)별 허용 시작·끝 지점, 허용·금지 구간, 주차 가능 대수, 평일·주말·공휴일 운영 시각과 조업주차 시각을 담는다(csv 약 7KB). 주민이나 상인이 '우리 동네 이 도로에 주말 몇 시부터 몇 시까지 몇 대 세울 수 있나'를 확인하거나, 구청·분석가가 동별 주차허용구간 운영 현황과 상권 주차 정책을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 동명을 행정동 이름으로 매핑하거나 같은 기관(부평구) 자료끼리만 이어 쓴다.
description_portal: '탄력적으로 운영되는 주차허용구간의 위치, 허용 및 금지 구간, 주차 가능 수, 운영 시간대 등을 수록한 데이터.지역 내 도로 공간의 효율적 활용과 교통 혼잡 완화, 상권 활성화, 주민 편의 증진 및 주차 행정 관리 등에 활용 가능하다.활용 목적 및 특징– 동별 탄력적 주차허용구간 운영 현황 분석– 허용·금지 구간 구분을 통한 주차 질서 관리 강화– 평일·주말·공휴일 시간대별 주차 허용 체계 확인– 상권 활성화 및 교통 혼잡 완화 정책 자료 활용주요 항목 설명● 동명: 주차허용구간이 위치한 행정동 명칭● 주차가능수: 해당 구간 내 주차 가능 차량 수● 허용시작구간 / 허용끝구간: 주차 허용이 시작·종료되는 지점● 허용구간 / 금지구간: 주차 허용 또는 금지된 도로 구간● 평일/주말/공휴일 운영시작·종료시각: 요일별 주차 허용 시간● 조업주차시작·종료시각: 상점 조업 차량 주차 허용 시간'
