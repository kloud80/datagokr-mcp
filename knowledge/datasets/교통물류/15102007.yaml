summary_user: 경기도 파주시에 있는 국제물류주선업체를 업체 한 곳당 한 행으로 담은 파일로, 사업장명·영업상태·도로명/지번 주소·위도·경도·허가일자·전화번호가 들어 있다(CSV 약 8KB). 파주에서 영업 중인 국제물류주선업체가 어디에 몇 곳 있는지, 허가일자와 영업상태로 보아 업체의 진입·퇴출이 어떻게 변했는지 확인하려는 화주·물류사업자·지역 분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 사업장명·주소 매칭이나 좌표 기반 공간 결합으로 잇고, 허가 사업자 여부를 대조할 때는 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
limits: 파주시 한 곳만 범위로 하므로 다른 시군구나 전국 단위 비교에는 다른 지자체 자료를 따로 모아야 한다. 사업자등록번호 같은 공통 키가 없어, 다른 데이터와 맞출 때는 이름·주소 매칭에 따른 오차를 감안해야 한다.
