description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구교통공사의 2019년부터 현재까지 연도별 중대재해 및 산업재해 발생 현황을 제공합니다. 본 자료는 산업안전보건법 및 중대재해처벌법 등 관련 법령에 따른 안전관리 현황을 기반으로 작성되었으며, 연도별 재해 발생 건수, 사망자 수 등 주요 안전관리 지표를 포함하고 있습니다. 이를 통해 중대재해 및 산업재해 발생 추이와 사고 유형을 체계적으로 분석할 수 있으며, 재해 예방대책 수립, 산업안전보건 관리체계 개선, 위험요인 분석 및 안전관리 정책 수립을 위한 기초자료로 활용될 수 있습니다. 또한 기관의 안전관리 성과 분석, 공공교통 시설의 안전성 평가, 데이터 기반 안전관리 및 재난 대응체계 개선을 지원하는 자료로 활용할 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
