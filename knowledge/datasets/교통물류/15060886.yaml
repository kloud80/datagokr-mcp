summary_user: 운수종사자관리시스템에 등록된 버스·택시·화물자동차 운수종사자의 범죄경력을 관할관청에 통보한 건수를 범죄 유형(구분)별·연도별(2014~2025)로 집계한 전국 단위 통계 파일입니다. 운수 분야 정책 담당자나 분석가가 "택시·버스 기사 범죄경력 통보가 어떤 유형에서 해마다 늘거나 줄었는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 범죄 유형 이름을 맞추거나 같은 기관(한국교통안전공단)의 운수종사자 통계와 연도 기준으로 나란히 놓아 비교한다.
