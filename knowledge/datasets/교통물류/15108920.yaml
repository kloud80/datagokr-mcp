description_portal: 해당 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 도로 상부에 설치된 고가도로의 위치 및 현황을 공간기반 속성과 함께 정리한 정보입니다. 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분 등 기본 항목과 더불어 TM 중부 GRS80 기준 위도·경도 좌표가 포함되어 있어 각 고가도로의 정확한 위치 파악이 가능합니다. 고가도로는 입체적으로 교차로나 주요 도로를 통과하도록 설계된 시설로 차량 흐름 개선 효과가 있으나, 보행환경 측면에서는 그 주변부가 어둡거나 복잡한 구조로 인해 안전 사각지대로 작용할 가능성이 있습니다. 데이터는 고가도로 분포를 분석함으로써 보행자 이동경로와의 관계를 시각화하고 위험 요인을 진단하는 기초 자료로 활용됩니다. 본 자료는 2022년 기준 1회성 수집된 정보로, 참고용으로 활용하는 것이 적합합니다.
