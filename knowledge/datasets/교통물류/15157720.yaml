summary_user: 인천항 안의 수익 시설 임대 정보를 임대코드·위치·면적·전력사용량·임대료·계약 조건 단위로 담은 인천항만공사 API이며, 검증 호출에서는 2행이 수신되었다. 항만 사업자나 분석가가 특정 연도·임대사의 인천항 시설 임대 현황과 임대료를 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않아 같은 기관 코드나 이름 매핑으로만 잇고, 항만코드(UN/LOCODE와 해수부 내부 코드 병존)는 매핑표가 있어야 입출항·물류 데이터와 연결된다.
description_portal: 해당 데이터는 인천항만공사에서 제공하는 '인천항 임대 정보' 데이터를 Open API 방식으로 제공하는 것으로, 인천항 내 수익 시설에 대한 정보를 사용자 코드(userCd), 사용종류(userTp), 연도(userYmd), 임대사(reqCompId) 등의 조건으로 조회할 수 있도록 구성되어 있습니다. 요청 방식은 REST로 사용되며, XML 형식으로 응답하여 데이터를 제공합니다. 요청 파라미터로는 총 7개의 필수 항목이 존재하며, 응답 결과는 항만 임대 시설의 임대코드, 위치 정보, 면적 전력사용량, 임대료, 계약 조건 등 다양한 정보를 포함합니다.
