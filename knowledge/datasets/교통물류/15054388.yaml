summary_user: 경상북도 영양군 관내 주요 버스 노선의 운행시간표를 담은 xlsx 파일(약 30KB)로, 영양공용버스터미널·입암정류소·수비정류소 등 출발지별로 방면별 출발시간과 경유지, 운영업체를 정리한 시군구 단위 자료다. 영양군 주민이나 방문객이 '영양터미널에서 특정 방면으로 가는 버스가 몇 시에 있는가'를 확인하거나, 분석가가 농촌 지역 버스 운행 간격과 교통 소외 정도를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 정류장·노선 데이터와는 정류소 이름이나 같은 기관 기준으로만 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경상북도 영양군 관내의 주요 버스 노선의 운행시간표 정보를 수록한 자료입니다. 출발 터미널별로 각 방면(도착지) 노선에 대한 출발시간, 경유 목적지, 운영업체 및 관리기관 등의 정보를 포함하고 있어, 지역 주민 및 방문객들이 대중교통을 효율적으로 이용할 수 있도록 돕습니다. 특히 농촌형 교통체계 특성을 반영하여 운행간격이 크거나 일부 시간대만 운영되는 노선도 포함되어 있어, 교통 소외지역 해소 및 교통 접근성 향상에 기여할 수 있습니다. 본 자료는 버스 정류소 명칭, 노선 정보, 운영사 연락처 등 상세 정보와 함께 데이터 기준일자를 포함하고 있으며, 교통정책 수립 및 이용자 안내 자료로 활용 가능합니다.
