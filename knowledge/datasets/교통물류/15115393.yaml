summary_user: 서울특별시 강남구 공영주차장을 주차장 한 곳당 한 행으로 담은 파일로, 주차장명·구분·도로명/지번 주소·주차구획수·운영요일과 평일·토요일·공휴일 운영시각·기본/추가 요금·1일권·월정기권 요금·결제방법·위도경도를 포함한다. 강남구 주민이나 방문객이 "목적지 근처 공영주차장의 운영시간과 요금, 월정기권 가격이 얼마인가"를 확인하거나, 개발자가 지도·내비게이션에 강남구 공영주차장 위치를 표시할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·좌표 또는 주차장명으로 맞춰 잇고, 주차장관리번호·좌표·요금·면수를 담은 전국주차장정보표준데이터를 원장으로 함께 쓴다.
description_portal: 서울시 강남구 공영주차장 정보(https://data.seoul.go.kr/dataList/OA-15012/S/1/datasetView.do) 입니다.  강남구 내 공영주차장 운영 현황을 체계적으로 정리한 공공데이터입니다. 본 데이터에는 총 53개 주차장의 상세 정보가 수록되어 있으며, 각 주차장은 고유 관리번호와 주차장명을 비롯해 구분(공영, 노상, 노외), 소재지 도로명 주소, 주차구획 수, 급지구분 등 기본 현황이 제공됩니다. 또한 운영요일과 운영 시간대(평일·토요일·공휴일별 시작 및 종료 시각), 요금 체계(기본 시간·기본 요금·추가 단위 시간·추가 요금), 월정기권 요금 등 이용자가 직접적인 혜택을 확인할 수 있는 항목이 포함되어 있습니다. 결제 방법은 카드·현금·지로 등 다양한 수단을 안내하고 있으며, 관리기관명과 대표 전화번호를 제공하여 문의나 민원 대응이 가능하도록 구성되어 있습니다. 더불어 위도와 경도 좌표가 제공되어 위치 기반 서비스와 연계할 수 있고, 데이터 기준일자가 명시되어 최신성을 보장합니다. 이 자료는 강남구 주민과 방문객의 주차 편의를 증진시키는 동시에, 공공기관·기업·연구자·개발자가 교통 관리, 스마트시티 서비스, 지도 및 내비게이션 개발 등 다양한 분야에서 활용할 수 있는 가치 있는 개방형 데이터입니다.
