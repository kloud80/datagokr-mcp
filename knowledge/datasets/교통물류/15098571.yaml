summary_user: 경상북도 안동시에 등록된 자동차 대수를 용도(사업용·비사업용)별 행으로 나누고, 연료 8종(휘발유·경유·LPG·CNG·전기·하이브리드·수소·기타)과 차종 4종(승용·승합·화물·특수)을 교차한 열로 담은 시군구 단위 집계표입니다(csv 895바이트의 작은 파일). 안동시에 전기·수소차가 차종별로 몇 대 등록돼 있는지, 경유 화물차는 얼마나 되는지 확인해 충전 인프라 계획이나 노후 경유차 교체 정책의 기초 수치로 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 시군구의 같은 등록현황 표와는 시군구명과 같은 연료·차종 구분명을 기준으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 경상북도 안동시에 등록된 자동차에 대한 통계정보로, 차량의 연료 유형, 차량 용도(사업용/비사업용), 차량 종류(승용차, 승합차, 화물차, 특수차) 등 다양한 기준에 따라 세분화하여 구성된 자료입니다.연료 유형은 내연기관부터 친환경 에너지원까지 폭넓게 포함하고 있으며, 구체적으로 휘발유, 경유, LPG, CNG, 수소, 전기, 하이브리드, 기타 등 총 8개 유형으로 분류됩니다. 차량 용도는 사업용과 비사업용으로 구분되며, 차량 종류는 승용차, 승합차, 화물차, 특수차의 네 가지로 분류됩니다.이 데이터는 친환경차의 지역별 보급 현황을 파악하고, 도심 내 차량 에너지 사용 특성 분석, 지역 맞춤형 교통 및 환경 정책 수립, 에너지 수요 예측 및 탄소배출 통계 산출 등 다양한 공공 및 민간 목적에 활용될 수 있습니다. 또한 전기차 충전 인프라 설치 계획, 수소차 보급 로드맵 수립, 노후 경유차 교체 정책 추진 등과 같은 실효성 있는 의사결정을 지원하는 데 유용한 근거 자료로 제공됩니다.
