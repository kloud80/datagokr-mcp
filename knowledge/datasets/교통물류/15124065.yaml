summary_user: 경기도버스운송관리시스템(BMS)의 노선별 경로 이력을 경로점 단위로 담는다. 노선ID·경로점 순서·X/Y 좌표·회차점 여부·정점간 거리와 누적거리를 포함하며, 범위는 경기도 시도 단위이고 위치는 개별 좌표로 기록된다. 교통 분석가나 GIS 담당자가 '이 버스 노선은 실제로 어느 길을 따라 몇 km를 달리는가'를 지도에 그리거나 경로 길이를 계산할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 경기도 버스 노선·정류장 데이터와 노선ID(route_id)를 이름·코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 관리되는 노선별 경로 이력 정보를 담고 있으며, 각 노선의 공간적 이동 경로를 구성하는 핵심 데이터입니다. 데이터는 노선ID, 경로점 순서, X/Y 직교좌표, 회차 유무, 경로점 종류, 정점간 거리 및 누적거리, 이력ID, 경로점ID 등의 항목으로 구성되어 있습니다. 각 경로점은 버스노선이 실제로 이동하는 경로를 구성하는 지점으로, 공간분석 및 경로 최적화, GIS 기반 시각화 등에 활용될 수 있습니다. 회차 유무는 해당 지점이 회차점인지 여부를 나타내며, 정점간 거리와 누적거리는 전체 경로의 길이를 파악하는 데 사용됩니다.
