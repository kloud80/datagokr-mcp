summary_user: 경기도 구리시 관내 버스정류소에 설치된 버스정보안내전광판을 정류소 한 곳씩 담은 설치 현황 파일로, 정류소명·정류소 번호·도로명·읍면동·전광판 모델·설치연도·관리기관을 포함한다. 구리시 주민이나 교통 분석가가 '우리 동네 어느 정류소에 도착정보 전광판이 있고 언제 설치됐는가'를 확인하거나 읍면동별 설치 편중을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 정류소 번호나 정류소명을 이름·코드 매핑으로 맞춰 정류장 원장·버스 도착정보(TAGO·지자체 BIS) 데이터와 이어 쓴다.
