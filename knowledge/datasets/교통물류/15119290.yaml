summary_user: 한국도로공사가 관할하는 고속도로 휴게소에 설치된 푸드트럭을 매장 한 곳당 한 행으로 담은 현황 파일로, 본부·지사·휴게소(시설명)·매장명·소유주·운영방식·주요품목·오픈일자를 기록하며 파일 크기는 792바이트로 작다. 고속도로 이용자가 어느 휴게소에 어떤 메뉴의 푸드트럭이 있는지 확인하거나, 분석가가 휴게소 푸드트럭의 운영방식·품목·개장 시기를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 휴게소 데이터와는 휴게소 이름(시설명)이나 본부·지사 이름을 맞춰 붙여야 한다.
description_portal: 본 데이터는 한국도로공사가 관할하는 고속도로 휴게소에 설치된 푸드트럭 운영 현황을 나타낸다. 주요 구성 항목으로는 본부, 지사, 시설명, 매장명, 소유주, 운영방식, 주요품목, 오픈일자가 포함되어 있으며, 이를 통해 각 휴게소에 설치된 푸드트럭의 위치와 운영 형태, 제공 품목 등을 파악할 수 있다. 해당 데이터는 고속도로 이용자에게 다양한 먹거리 선택 정보를 제공하며, 소상공인의 자립 기반 조성 및 휴게소의 편의성 강화를 목적으로 한다. 또한, 운영일자와 품목 정보는 푸드트럭 운영 실태 분석 및 정책 수립에 참고 자료로 활용할 수 있다. 전반적인 푸드트럭 인프라 현황을 데이터로 정리함으로써 공공의 정보 접근성과 행정의 투명성을 높인다.
