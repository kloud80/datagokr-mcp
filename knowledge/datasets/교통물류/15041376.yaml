summary_user: 부산1호선 역사에 설치된 엘리베이터를 한 대씩 담은 파일로, 운영기관·노선·역명·출입구번호·상세위치와 정원 인원·중량을 기록한다. 휠체어 이용자나 교통약자 이동 지원 분석가가 부산1호선 어느 역 몇 번 출입구에 엘리베이터가 있고 몇 명까지 탈 수 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 역 좌표·출입구 등 다른 역 데이터와는 역명·노선명을 이름으로 맞춰 이어야 한다.
