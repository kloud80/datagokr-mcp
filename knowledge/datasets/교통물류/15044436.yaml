summary_user: 서울교통공사가 운영하는 지하철 역사의 수평보행기(무빙워크)를 1대씩 한 행으로 담은 설치현황 파일로, 호선·역명·호기 번호, 가까운 출입구, 시작층·종료층의 지상/지하 구분과 상세위치, 승강기 일련번호를 포함한다(CSV 약 2KB 규모의 소량 파일). 교통약자나 이동 동선을 안내하려는 사람이 어느 역 어느 구간에 수평보행기가 있는지 확인하거나, 분석가가 역별 편의시설 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 역사 편의시설·승강기 데이터와는 호선·역명을 맞추거나 승강기 일련번호로 이어 써야 한다.
