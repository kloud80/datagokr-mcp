summary_user: 해외어획물을 실은 선박이 국내 항만에 들어올 때 항만국이 어획물을 검색한 결과를 검색 건별로 담은 파일이며, 항만국·검색항구·검색 시작·완료일, 선명·호출부호·선박국적·선박유형, 선박위치추적장치 유무, 제출서류·문서검사 적정성과 검색관 검사결과를 포함한다(전국 범위, 약 26KB 규모의 CSV). 수산 유통·통관 담당자나 분석가가 '어느 항구에서 어떤 국적·유형의 어획물 운반선이 검색을 받았고 서류나 검사에서 부적정 판정이 나왔는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 선명·호출부호·검색항구 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 해운항만물류정보시스템(PORT-MIS)을 통해 수집된 항만국검색결과보고를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해외어획물 적재선박이 항만에 입항할 때 항만국에서 실제로 어획물을 검색한 후, 그 결과를 시스템에 등록한 정보로 구성되어 있습니다. 데이터에는 항만국, 검색항구, 검색일자, 선명, 허가조업지역, 어종 등의 정보를 포함하고 있습니다. 본 데이터는 항만 국가에서의 어획물 관리 현황 파악, 어획물의 합법적 유통 관리를 위한 근거자료로 활용될 수 있으며 정확한 어획물 관리, 통관 절차, 해양수산 정책 수립 및 국제 거래 모니터링 등에 참고자료로 활용될 수 있습니다.
