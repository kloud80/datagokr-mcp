summary_user: 경기도 도로대장에 실린 인터체인지(IC)를 IC 한 곳당 한 행으로 담은 건별 대장 자료로, 노선번호·구간번호·IC명·소재지 주소·IC유형·접속도로와 그 관리기관·접속도로 차로수, 개통일·착공일·준공일 등 13개 항목으로 이루어진다. 도로 계획 담당자나 분석가가 "경기도 안의 특정 노선에 어떤 형식의 IC가 언제 개통됐고, 어느 기관이 관리하는 어떤 도로와 이어지는가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 도로망 자료와는 노선번호(route_no)·IC명·접속도로명을 이름 기준으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: '이 데이터는 경기도 도로대장에 포함된 인터체인지(IC: Interchange)에 대한 상세 정보를 제공하며, 노선번호, 구간번호, IC명, IC개통일, IC시점, IC종점, 소재지주소, IC유형, 접속도로명, 접속도로관리기관명, 접속도로차로수, 착공일, 준공일의 총 13개 항목으로 구성되어 있습니다. 각 인터체인지의 위치 정보, 도로와의 접속 방식, 개통 및 공사 일정 등 인프라 계획 및 관리에 필요한 정보를 포함하고 있습니다. IC유형(예: 클로버형, 다이아몬드형, 트럼펫형 등)은 교통 흐름 및 구조 설계 분석에 활용되며, 접속도로 및 관리기관 정보는 유지관리 및 정책수립의 근거자료로 활용될 수 있습니다.'
