summary_user: 전국 연안여객선의 다음날 운항예보를 여객선·항로·출항시간 단위 건별로 담으며, 운항·증선·비운항·통제·대기지연 구분과 통제·비운항·대기지연 사유를 함께 제공한다. 도서 주민이나 섬 여행객이 내일 타려는 배가 결항될지, 결항이라면 풍랑주의보 때문인지 선박정비 때문인지 미리 확인하는 데 쓴다. 전역 조인 키는 없어서 같은 기관의 운항상태·항로·선사 데이터와 지사코드(jbcd)·여객선코드·항로코드 또는 항로명·출항지명 매칭으로 연결한다.
description_portal: "'내일의 운항예보(상세)'는 한국해양교통안전공단에서 제공하는 공공데이터로, 전국 여객선 항로의 다음날 기상 조건 및 운항 가능 여부에 대한 예측 정보를 포함하고 있다. 본 데이터는 항로별 예보, 일시와 함께 각 항로에 대한 운항 가능 여부를 종합적으로 제공함으로써, 여객선 이용자 및 운항관리자에게 사전 정보 제공을 통해 안전한 해상교통 운영을 지원한다. 또한, 해당 정보는 매일 정기적으로 갱신되며, 표준화된 형식으로 제공되어 데이터 활용성과 접근성을 높이고 있다. 본 데이터는 여객선 운항계획 수립, 해상 안전모니터링, 기상 영향 분석 등 다양한 공공 및 민간 분야에서 활용 가능하다."
