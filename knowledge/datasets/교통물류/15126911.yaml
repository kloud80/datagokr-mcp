summary_user: 한국도로공사가 관리하는 고속도로 휴게소별 태양광 발전소의 설비용량(kW), 연평균 발전량, 에너지저장장치(ESS) 설비, 운영 개시일을 휴게소·방향 단위로 정리한 전국 현황 파일(CSV, 약 1.5KB)이다. 에너지 분석가나 정책 담당자가 '어느 휴게소에 몇 kW 규모 태양광이 깔려 있고 운영 연차와 발전량은 어떤가'를 비교하는 데 쓴다. 공통 조인 키가 없어 다른 휴게소 데이터(위치·편의시설 등)와는 휴게소명과 방향을 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국도로공사가 관리하는 고속도로 휴게소 내 태양광 발전소의 설치 및 운영 현황을 정리한 자료이다.  태양광 발전소는 신재생에너지 활용을 통해 탄소중립 실현과 에너지 비용 절감을 도모하며, 고속도로 부속시설의 친환경 운영에 기여한다.  데이터는 휴게소명, 방향, 설비용량(kW), 연평균 발전량(kWh), 에너지저장장치(ESS) 유무, 발전소 운영일 항목으로 구성된다.  해당 정보는 발전 효율 분석, 설비 용량 산정, 에너지 정책 수립, 환경 성과 평가 등에 활용된다.  또한, 지역별 발전 분포 및 운영 연차 분석을 통해 설비 투자와 운영 전략 수립의 기초자료로 사용된다.  CSV 형식으로 제공되며, 휴게소별 친환경 에너지 설비 운영 실태를 확인할 수 있다.
