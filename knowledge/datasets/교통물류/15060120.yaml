summary_user: 서울교통공사가 운영하는 1~8호선 276개 역사의 대합실 면적과 승강장 면적을 역 단위로 담은 파일로, 3호선과 4호선 충무로역이 대합실을 함께 써서 행은 277개다(2025년 12월 31일 기준). 역 혼잡도 대비 공간 여유를 비교하거나 시설 개선·편의시설 배치 대상 역을 고르려는 분석가가 "어느 역의 대합실이 승하차 인원에 비해 좁은가"를 따질 때 쓴다. 전역 조인 키가 없어 호선·역명을 이름으로 맞춰 같은 기관의 승하차·혼잡 데이터나 역 좌표·출입구 정보와 연결한다.
description_portal: '서울교통공사 1호선-8호선 276개 역사의 역사면적정보입니다. 해당 데이터는 호선, 역명, 대합실 면적, 승강장 면적으로 구성되어 있습니다.(2025년 12월 31일 기준) 1호선 10개역 / 2호선 51개역 / 3호선 34개역 / 4호선 26개역 / 5호선 56개역 / 6호선 3개역 / 7호선 42개역 / 8호선 19개역에 관한  각 역사의 대합실과 승강장 면적 정보가 제공되며 이를 통해 서울교통공사 276개 역사의  면적을 확인해보실 수 있습니다. 참고사항: 3호선 충무로역의 경우 4호선 충무로역과 대합실을 공용하여 사용하고 있어 데이터의 총 연번은 277개임을 참고 바랍니다.'
