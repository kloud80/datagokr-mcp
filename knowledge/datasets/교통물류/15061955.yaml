summary_user: 대구교통공사 도시철도의 수송실적을 년·월 단위로 집계해 선불·후불카드(일반·청소년·어린이), 아이조아카드, 무임카드(경로자·장애인·유공자), 일반권·할인권·우대권·정액권·단체권 등 권종별 열로 나눠 담은 집계 파일이다. 분석가나 정책 담당자가 '무임승차(경로자) 수송 비중이 해마다 얼마나 늘었는가'처럼 요금·무임 정책 검토나 이용권 유형별 수요 추이를 볼 때 쓴다. 전역 조인 키는 없어 년·월을 기준으로 같은 기관의 다른 수송 통계나 월별 외부 지표와 맞춰 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 1997년 11월부터 현재까지의 대구교통공사 월별 수송현황을 권종별로 제공합니다. 선불카드, 후불카드, 무임카드, 승차권, 단체권, 기타 특수카드 등 다양한 권종별 월별 수송실적을 포함하고 있습니다. 이용권 유형별 이용 현황을 통해 대중교통 수요 분석, 요금 정책 수립, 수송계획 마련 등 다양한 행정 및 연구 분야의 기초자료로 활용할 수 있으며, 시민 이동 패턴 분석, 대중교통 서비스 품질 향상, 데이터 기반 정책 수립 등에 폭넓게 활용될 수 있습니다. 본 데이터는 매월 1회 정기적으로 갱신됩니다.'
