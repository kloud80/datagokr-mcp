summary_user: 전국 철도역의 승강장을 노선·역·상하행 방향별로 한 줄씩 담은 시설 현황 파일로, 지상·지하 구분, 역층, 승강장 유형과 스크린도어·안전발판 설치 여부, 승강장 연결 여부를 포함한다. 교통약자 단체나 안전 분석가가 "어느 노선의 어느 역 승강장에 스크린도어나 안전발판이 아직 없는가"를 확인하고 역별 안전 개선 대상을 고르는 데 쓴다. 전역 공통 조인 키는 없어서 다른 역 데이터와는 역명·선명 매칭이나 같은 국토교통부 체계의 철도운영기관코드로만 이어 쓴다.
limits: 전역에서 통하는 역 코드가 없어 다른 기관의 역 마스터나 승하차 데이터와 붙이려면 역명·선명 이름 매칭이 필요하고, 동명 역이나 표기 차이에 주의해야 한다. 좌표가 없는 비공간 자료라서 이 파일만으로 위치 분석이나 역세권 판정은 하지 못한다.
