summary_user: 경상북도 김천시에 등록된 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 원천 목록으로, 업체명·면허종류·차량대수·주사무소 주소·현재 운영 여부를 포함한다(CSV 약 3.5KB 규모). 화주나 물류 사업자가 김천시에 허가받은 운송사가 어디에 있고 차량을 몇 대 운영하며 지금도 영업 중인지 확인하는 데 쓰고, 분석가는 지역 화물운송 공급 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소로 맞춰 연결해야 하며, 기준 데이터인 전국화물자동차운송사업자표준데이터와 대조할 때도 같은 방식을 쓴다.
description_portal: 이 데이터는 경상북도 김천시에 등록된 일반화물자동차 운송사업자의 현황을 수록한 자료로, 사업자명, 주사무소의 주소, 운영 차량 대수, 영업 여부 등 관련 정보를 포함하고 있습니다. 지역 물류 산업의 현황 파악, 정책 수립, 연구 분석 및 민간 활용을 위한 기초자료로 활용될 수 있으며, 매년 또는 분기별 갱신을 통해 최신성을 유지할 수 있도록 구성되어 있습니다. 특히 김천시의 교통, 물류, 산업 관련 정책 수립 및 기업 활동 지원 등에 유용하게 활용될 수 있습니다. 데이터는 CSV 형식으로 제공되며, 정형화된 구조로 분석 및 가공이 용이합니다.
