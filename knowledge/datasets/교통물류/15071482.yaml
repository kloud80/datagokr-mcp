summary_user: SRT 고속열차의 수송수익을 월별(구분)로 행에, 연도·노선(경부선·호남선, 2023년부터 경전선·동해선·전라선 추가)과 전체 합계를 열로 담은 집계표로, 포털 설명상 2016년 12월~2025년 12월 범위이며 단위는 백만원입니다. 교통 분석가나 연구자가 'SRT 노선별 월 수익이 계절이나 코로나 시기에 어떻게 달라졌나', '2023년 9월 신규 노선 개통 뒤 수익 구성이 어떻게 바뀌었나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월과 노선명을 직접 맞춰야 하며, 같은 기관(에스알)의 수송인원 등 연도별 월별 통계와 나란히 놓고 보는 방식이 현실적입니다.
limits: 전국 단위 노선별 합계라 역별·구간별·시간대별 수익은 알 수 없고, 공간 정보가 없는 비공간 데이터입니다. 연도와 노선이 열 이름에 묶인 넓은 표 형태라 분석 전에 긴 형태로 바꿔야 하며, 다른 데이터와 붙일 공통 코드가 없어 이름 매핑이 필요합니다.
