summary_user: 대전교통공사가 운행하는 대전 도시철도의 역별 열차 운행 시각을 담은 시각표 파일로, '구분' 열 아래 열차번호로 보이는 1001~1087 열마다 시각이 배치된 가로형 표다(zip 약 15KB). 이용자가 특정 역에서 몇 시에 열차가 오는지, 첫차·막차가 언제인지 확인하는 조회 용도에 쓰며, 통계 분석보다 서비스용 조회에 가깝다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역 이름 매핑이나 같은 기관(대전교통공사)의 역·승하차 데이터와 이름으로 맞춰 이어 쓴다.
