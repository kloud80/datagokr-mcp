summary_user: 부산교통공사가 운영하는 부산4호선 각 역의 장애인화장실 위치를 역별 건 단위로 담은 소규모 CSV 파일(약 2.3KB)로, 역명·지상구분·역층·게이트 안팎·가까운 출구번호·상세위치를 포함한다. 휠체어 이용자나 보호자가 '이 역에서 개찰구 안쪽 장애인화장실은 몇 층 어디에 있나'를 미리 확인하거나, 분석가가 노선별 교통약자 편의시설 배치를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 철도 역사·편의시설 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 연결해야 한다.
