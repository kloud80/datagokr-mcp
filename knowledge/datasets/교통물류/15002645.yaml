summary_user: 한국공항공사가 운영하는 주요 국제공항의 첨두시간 화물실적을 공항·일자·시간대·노선별로 도착·출발 물량으로 담은 집계 파일이며, CSV 크기가 약 1.7KB로 매우 작은 표입니다. 물류 분석가나 공항 운영 관심자가 '김해·제주 같은 지방 국제공항에서 화물이 가장 몰리는 시간대와 그 물량은 얼마인가'를 확인하거나 수출입 물류 흐름의 보조 신호로 쓴다. 전역 조인 키가 없어 공항명·노선명을 다른 항공통계(여객·운항 실적)나 공항코드표와 이름으로 맞춰 이어 써야 한다.
limits: 공항 코드 같은 공통 키가 없어 다른 데이터와는 공항명·노선명 매핑으로만 연결된다. 첨두시간 실적만 담은 작은 파일이라 전체 기간·전 시간대 화물 추이나 인천국제공항 실적은 이 데이터로 볼 수 없다.
