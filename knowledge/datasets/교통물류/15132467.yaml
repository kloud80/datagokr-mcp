summary_user: 광주광역시 각 도로관리청이 관리하는 도로교량을 2024년 12월 말 기준으로 취합한 파일로, 교량별로 도로구분·노선번호·교량명·위치·경간수·최대경간장·상하부 형식·설계하중·준공년도·교통량 같은 제원을 담는다. 지자체 도로 담당자나 분석가가 "광주 시내 준공 30년이 넘은 교량은 어느 노선에 몇 개이고 어떤 형식인가" 같은 노후 교량 점검·유지보수 우선순위 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 교량명·노선번호·시군구 이름을 맞추거나 같은 기관 코드로만 연결하며, 다른 지자체 교량 파일과는 터널·교량·지하차도 제공표준을 기준으로 묶어 쓴다.
description_portal: '"25년 광주광역시 도로교량 현황("24.12월말 기준)이며, 각 도로관리청에서 관리중인 도로교량 현황을 취합한 자료입니다.교량총괄 표를 통해 교량번호, 교량상태, 도로구분, 노선번호, 확장구분, 교량명, 위치코드, 시·군·구, 경간수, 최대경간장, 상부·하부 형식, 설계하중, 준공년도, 교통량 등 주요 시설제원이 포함되어 있습니다. 교량 종별(일반국도, 국가지원지방도, 광역시도 등) 개소 수와 관리 정보가 체계적으로 정리되어 있어 교량 구조물의 안전관리, 유지보수 계획, 도로 인프라 현황 파악에 활용할 수 있는 자료입니다.'
