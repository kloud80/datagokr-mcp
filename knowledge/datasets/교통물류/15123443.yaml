summary_user: 서산시 도시계획정보시스템 안에서 취락지구 정보를 담는 테이블의 구조를 설명하는 메타데이터로, 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목을 컬럼 단위로 담은 작은 CSV 파일(약 2.5KB)이다. 서산시 취락지구 공간자료를 요청하거나 시스템을 연계하려는 분석가·개발자가 '취락지구 테이블에는 어떤 컬럼이 있고 한글 의미는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명 같은 이름 매핑이나 같은 기관(서산시) 기준으로만 이어 쓴다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 취락지구에 관한 메타데이터이다. 본 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 취락지구는 농어촌 지역의 기존 마을을 보전하고 정비하기 위해 지정된 구역으로, 토지이용을 합리화하고 생활환경을 개선하는 데 목적이 있다. 본 데이터는 지구의 지정 목적과 규제 내용을 이해하는 데 도움이 되며, 도시계획 수립, 정비사업, 행정업무에 활용할 수 있다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 유익하며, 정책 수립, 공간정보 분석, 민간 활용 등 다양한 분야의 기초자료로 제공된다.
