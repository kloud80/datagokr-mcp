summary_user: 대전도시철도 각 역의 자동개집표기 기준 승차·하차 인원을 역별·월별로 집계한 파일로, 역번호·역명별로 1월부터 조회 시점(실측 파일은 8월까지)의 월별 승차·하차 인원을 담는다. 교통·상권 분석가가 '대전 지하철 어느 역의 이용객이 가장 많고, 월별로 어떻게 변하는가'를 비교하거나 역 주변 유동인구의 대체 지표로 쓴다. 전역 공통 조인 키가 없어 다른 역·시설 데이터와는 역명이나 역번호를 직접 매핑해 이어야 한다.
description_portal: 이 데이터는 대전도시철도 각 역의 월별 승차 및 하차 인원 수를 제공하는 서비스입니다.연도별, 역별, 월별로 구분된 데이터를 통해 각 역에서 자동개집표기를 이용한 승하차 인원 현황을 확인할 수 있습니다.자료는 해당 연도의 1월부터 조회 시점까지의 정보가 포함되며,**열(column)**에는 역번호와 역명이 오름차순으로 정렬되어 있고,**행(row)**에는 월별 승차 인원과 하차 인원이 나열되어 있어 시간 흐름에 따른 이용 추이를 파악할 수 있습니다.이 데이터를 활용하면 역별 수송 실적을 비교하거나 혼잡도를 분석하는 데 유용합니다.
