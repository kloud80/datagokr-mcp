description_portal: 센터별 입고 동향 일별 집계 데이터는 해당 연도 동안 각 급식지원센터(1센터, 3센터)를 통해 학교 급식에 공급된 농산물의 입고 현황을 일 단위로 집계한 자료입니다.주요 항목은 입고일자(년월일), 센터별 입고 물량(kg), 센터별 입고 금액(원), 일자별 공급 학교 수, 그리고 데이터 생성·등록 일시로 구성되어 있습니다.각 센터는 해당 지역 학교에 농산물을 공급하는 거점 역할을 하며, 이 데이터는 일자별 공급 규모, 센터 가동 현황, 계절별 변동성, 급식 수요 패턴 분석 등을 수행하는 데 활용될 수 있습니다. 또한 금액 데이터는 공급 단가 및 예산 집행 흐름을 분석하는 데 중요한 요소입니다.금액 항목은 원 단위 문자열 형태로 제공되며, 분석 시 숫자형으로 변환하여 사용해야 합니다. - 일부 일자에는 누락값(NaN)이 존재할 수 있으며, 이는 해당 날짜의 공급 중단, 집계 제외 등 운영 특성에 따른 것입니다.
