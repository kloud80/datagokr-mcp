summary_user: 한국건설기술연구원이 제공하는 수시 교통량 조사 통계로, 필드 구성상 조사연도·도로등급·노선·구간·관측지점 단위로 구간 길이·차로 수와 함께 시간대별 총 교통량과 13개 차종별 교통량을 담으며, 범위는 전국입니다. 교통 분석가나 도로·교통안전 담당자가 특정 노선 구간의 차종별 통행량이 연도별로 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키는 없어, 다른 데이터와는 노선번호·노선명, 구간번호, 시도·시군·읍면동 이름을 맞춰 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시등급별 통계 정보입니다.\""
