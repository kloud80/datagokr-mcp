summary_user: 대전교통공사가 관리하는 역사별 휠체어리프트의 정기검사 결과를 호기 단위로 담은 소규모 CSV 파일(약 2.9KB)로, 역사명·위치·형식·길이·운행속도·제조사와 검사 만료일·검사분기·검사결과를 한 행에 기록한다. 교통약자 이동편의를 점검하는 시민단체나 분석가가 대전 도시철도 어느 역의 휠체어리프트가 언제 검사를 받았고 합격했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 역사명을 기준으로 역 시설·승하차 데이터와 이름 매칭으로만 이어 쓴다.
limits: 고유번호·역사명 외에 표준 코드가 없어 다른 기관 데이터와 직접 조인할 수 없고, 역사명 문자열 매핑이 필요하다. 포털 설명은 에스컬레이터 법정검사를 설명하고 있어 제목(휠체어리프트)과 맞지 않으므로 대상 설비를 실제 행 내용으로 확인해야 한다. 메타데이터상 범위는 전국·비공간으로 표기돼 있으나 내용은 대전교통공사 소관 역사에 한정된다.
