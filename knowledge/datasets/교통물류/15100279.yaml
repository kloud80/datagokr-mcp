summary_user: 고양시 도로의 관측지점별로 노선명·차로수와 2023년·2024년 교통량을 담은 지점 단위 조사 결과 파일(csv, 약 3KB)이다. 상권·입지를 검토하는 사업자나 도로계획을 보는 분석가가 고양시 어느 노선·지점의 교통량이 많고 한 해 사이 어떻게 바뀌었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명·관측지점 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: '- 도로법 제102조에(도로에 관한 조사)에 따라 도로와 관련된 계획의 효율적인 수립과 도로의 보수, 도로의 유지,관리 등을 위하여 필요하면 구간별 교통량, 도로의 구조, 그 밖에 도로에 관한 사항을 조사할 수 있어 이에 따라 조사를 실시하였으며, 향후 변화하는 도로상황에 맞춰 현 실정에 맞는 도로계획의 수립 및 도로정책의 기본자료 등으로 활용 되도록 이용되고 있는 경기도 고양시 지점별 교통량 데이터로 노선명, 차로수, 관측지점, 교통량 등의 항목을 제공함(연 평균 일교통량의 추정을 위한 기본 교통량이 필요하다고 판단되는 구간에 대하여 1일 이상의 짧은 기간 동안 실시하는 조사)'
