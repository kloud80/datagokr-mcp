description_portal: 서울교통공사의 호선별 전동차 사용연수 현황 데이터입니다. 각 전동차의 운행 기간을 기준으로 5년 이하, 6~10년, 11~15년, 16~19년, 20~24년, 25년 이상 등 연식 구간별로 구분하였으며, 호선별로 해당 구간에 속하는 전동차 보유 대수를 제공합니다.예를 들어, 1호선은 사용연수 25년 이상 전동차가 124대, 2호선은 6~10년 사용한 전동차가 414대, 5호선은 25년 이상 사용한 전동차가 408대 등으로 나타납니다.이 데이터는 노후 전동차 교체 계획 수립, 안전 운행 관리 및 사고 예방 정책 마련, 정비·투자 우선순위 설정, AI 기반 예측정비 연구 등 다양한 분야에서 활용될 수 있습니다.
