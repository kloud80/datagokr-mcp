summary_user: 'SRT 호남선 열차의 요일별 승차율(%)을 열차번호별 열로 담은 집계 파일로, 행은 요일이고 열은 601~668번 열차와 중련열차 후부차량(9로 시작하는 번호, 예: 9601)이며 승차율은 승객 이동거리를 운행 좌석거리로 나눈 값이다. 승객이나 분석가가 어느 요일·어느 호남선 SRT 열차가 붐비는지, 중련 운행 열차의 앞뒤 차량 이용이 어떻게 갈리는지 비교하는 데 쓴다. 전역 조인 키가 없어 SRT 시간표 등 다른 열차 데이터와는 열차번호를 이름으로 맞춰 연결해야 한다.'
description_portal: '1. SRT 2026년 상반기까지의 호남선 열차들의 요일별 승차율 자료입니다. 승차율은 승객이 타고 간 거리를 열차가 운행한 좌석거리로 나눈 비율입니다.2. 해당 데이터 내 항목명은 열차번호를 의미합니다3. 열차번호 9번으로 시작하는 열차는 두개의 차량이 연결된 열차의 후부 차량의 승차율을 나타낸 것입니다.예시) 601(중련열차 중 전부차량의 승차율) + 9601(중련열차 중 후부차량의 승차율), (단위 : %)* 2026년 6월 말 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.'
