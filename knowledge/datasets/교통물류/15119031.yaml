description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 안전·보건관리 데이터로, 사업소별 무재해 운동 추진 현황 정보를 제공합니다. 데이터에는 담당부서, 무재해 운동 추진 목표(배수), 개시일자, 달성예정일, 목표일수, 누계일수 등의 주요 항목이 포함되어 있으며, 각 사업소의 안전관리 활동 현황을 파악하고 산업재해 예방 및 안전한 근무환경 조성을 위한 기초자료로 활용할 수 있습니다. 해당 데이터는 무재해 운동 추진 성과를 관리하고 안전관리 수준을 향상시키기 위한 지표로 활용되며, 공공기관 안전관리 평가, 실적 보고, 안전 캠페인 운영 등 다양한 분야의 자료로 활용할 수 있습니다. 매년 1회 갱신되는 이 데이터는 근로자의 안전 확보와 산업재해 예방을 위한 공공데이터로서, 대구교통공사의 안전관리 체계 강화와 투명한 성과 관리에 기여하고 있습니다.'
