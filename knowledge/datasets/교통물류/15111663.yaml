description_portal: '경기도 성남시 교통단속 카메라 데이터는 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다. 교통단속 카메라 데이터는 도로 위에서 발생하는 교통법규 위반 상황을 자동으로 탐지하고 기록하기 위해 수집되는 자료입니다. 주로 과속, 신호위반, 중앙선 침범, 불법 유턴 등 운전자의 위반 행위를 영상 및 센서 기반으로 감지하여 차량 번호판 인식 기술(LPR: License Plate Recognition)과 결합해 증거 자료로 활용됩니다. 이 데이터는 경찰청, 지자체, 교통 관련 기관에서 수집·관리하며, 단속 근거뿐 아니라 교통 흐름 분석, 사고 예방 정책 수립, 지능형 교통체계(ITS) 구축에도 활용됩니다.'
