summary_user: 성남시 교통단속 카메라를 한 행에 한 대씩 담은 위치 원천 파일로, 위도·경도와 대상시설명·보호구역아이디·관할경찰서명·데이터기준일자를 함께 담는다(CSV 약 38KB, 성남시 한 곳). 운전자나 학부모가 '아이 학교 앞 보호구역에 단속카메라가 어디 있는지'를 확인하거나, 분석가가 시설 주변 단속 공백을 찾는 데 쓴다. 전역 조인 키는 없어 좌표로 다른 공간 데이터와 겹쳐 보거나 시군구명·관할경찰서명 같은 이름으로 맞춰 잇는다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 보호구역아이디 등으로 다른 데이터와 바로 붙는다고 보면 안 되며 이름·좌표로 맞춰야 한다. 범위는 성남시 한 곳뿐이라 전국 비교에는 다른 시군구 자료를 따로 모아야 한다. CSV는 활용신청 없이 받았으나 포털 설명상 SHP·이미지 파일은 별도 제공신청 후 메일로 받는 방식이다.
