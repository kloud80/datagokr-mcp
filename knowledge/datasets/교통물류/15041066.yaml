summary_user: 경강선 도시광역철도 역별로 운영기관·노선·역명과 함께 환승 상대 운영기관·환승선·환승 기점역·이후역, 하차에 유리한 차량순서와 출입문 번호를 담은 건별 원천 파일이며, 파일 크기가 466바이트로 몇 행 안 되는 소규모 자료다. 길안내 앱 개발자나 역사 안내 담당자가 '경강선에서 다른 노선으로 갈아탈 때 몇 번째 칸 몇 번 문에서 내려야 동선이 가장 짧은가'를 안내하는 데 쓴다. 공통 역 코드 같은 전역 조인 키가 없어 다른 역·노선 데이터와는 역명·노선명 이름 매칭이나 같은 기관(국가철도공단)의 다른 노선 환승정보와 묶어 쓴다.
