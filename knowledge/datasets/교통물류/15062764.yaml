summary_user: 통영시 도시정보시스템에 등록된 방파제를 시설 한 건씩 담은 원장 파일(CSV, 약 35KB)로, 관리번호·행정읍면동·도엽번호·관리기관·방파제 구분과 위경도 좌표를 갖는다. 통영시 안의 방파제가 어느 읍면동에 있는지, 누가 관리하는지를 지도에서 확인하려는 시설 점검·해안 안전 담당자나 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 행정읍면동 이름이나 위경도 좌표의 공간 매칭으로 잇고, 항만코드가 없어 입출항·항만 물류 데이터와 바로 연결하지는 못한다.
description_portal: 통영시 도시정보시스템에서는 방파제의 위치와 관리 현황을 정확하게 파악하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 방파제의 위치와 식별이 가능하며, 관리기관 정보는 해당 시설의 유지관리 책임을 명확히 합니다. 또한 방파제의 종류를 구분하는 항목이 포함되어 구조적 특성을 파악할 수 있습니다. 더불어 위도와 경도 좌표가 제공되어 방파제의 정확한 위치를 지도상에서 확인할 수 있어, 해안 안전관리, 시설 점검, 재난 대응 등 여러 업무에서 활용될 수 있는 중요한 기초자료로 활용됩니다.
