description_portal: '데이터 개요국토교통부_연도별국제_국내항공수송실적 데이터는 2010년부터 연도별로 집계된 국내선과 국제선 통합 항공운송 실적 정보를 제공합니다.본 데이터는 여객 수송량, 화물 수송량, 운항 편수 및 거리 등 항공운송의 핵심 지표를 포함하며, 항공 산업의 수요 분석, 정책 수립, 시장 동향 파악, 장기 추세 분석 등의 기초자료로 활용 가능합니다.주요 항목 설명연도 : YEAR수송 실적이 집계된 기준 연도 (4자리)여객 수(명): 해당 연도의 항공 여객 수 여객킬로(Km) : 여객 수송 환산 거리 (여객수 × 운항 거리)화물 수송량(톤) :  항공 화물 수송량 (톤 단위)화물톤킬로(Km) : 화물 환산 수송거리 (화물톤 × 거리)운항 횟수(편) : 해당 연도의 운송횟수운항거리(Km) : 운항횟수 환산거리 (총운항거리)※ 모든 수치는 해당 연도 기준 국내선과 국제선의 총합을 기준으로 제공됩니다.데이터 활용 시 유의사항수송거리(Km)는 실제 거리 기반 산정으로, 해당 연도의 항공편별 이동거리 기준으로 계산됨데이터는 연도별 통계 기반이므로, 월별 또는 구간별 추세 분석 시에는 별도 가공 필요데이터 값은 표기상 정수지만, 실사용 시 단위 환산(천 명/천 톤 등)을 고려해야 함데이터 활용 예시항공 수요 추세 분석: 연도별 여객/화물 수송량을 기반으로 항공산업 성장률 산출코로나19 전·후 항공운송 영향 분석: 2020~2022년 수요 급감 및 회복 경로 시계열 분석공항개발/노선정책 수립 참고자료: 장기 수요 예측 기반 인프라 확충 근거 자료로 활용통계·경제연구 자료: 산업 구조 및 물류 변화 분석 등 학술연구 활용 가능'
