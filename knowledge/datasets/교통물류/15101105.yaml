summary_user: 국내선과 국제선을 합친 전국 항공수송 실적을 연도별 한 행으로 담은 집계 파일로, 여객 수·여객킬로·화물 톤·화물톤킬로·운항 횟수·운항거리를 담는다. 정책 분석가나 연구자가 '코로나19 전후로 국내 항공 여객과 화물 수송량이 얼마나 줄고 회복됐는가' 같은 장기 추세와 성장률을 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 컬럼을 기준으로 맞춰 붙여야 하며, 공항·노선·항공사별 항공통계와 함께 보면 전체 총량의 배경 지표가 된다.
