summary_user: 경기도가 관리하는 지방도와 국가지원지방도를 노선번호·구간번호 단위로 정리한 도로대장 총괄 자료로, 구간별 시점·종점, 연장, 포장·비포장·미개통 연장, 교량·터널 개수와 길이, 차도·보도 폭, 포장 두께 같은 구조 정보를 담는다. 도로 계획 담당자나 분석가가 특정 지방도 노선에 미개통·비포장 구간이 얼마나 남았는지, 터널과 교량이 몇 개인지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 도로 데이터와는 노선번호(route_no)나 구간노선명을 이름·코드로 맞춰 연결해야 하고, 교통 데이터의 공간 기준인 표준노드링크(link_id·node_id)와도 바로 붙지 않는다.
description_portal: 이 데이터는 경기도에서 제공하는 도로대장(총괄) 자료로, 지방도 및 국가지원지방도의 노선 현황과 도로 시설 정보를 종합적으로 담고 있습니다. 주요 항목으로는 노선번호, 구간번호, 구간노선명, 구간연장, 시점명, 종점명과 같은 기본 도로 구간 정보와 더불어, 포장도로 연장, 비포장도로 연장, 차도 및 보도 연장, 교량 및 터널 현황, 곡선반경, 종단경사, 도로면적 등 도로 구조적 특성이 포함되어 있습니다. 또한 중용여부, 미개통구간, 전산화완료 여부와 같은 관리적 상태도 기록되어 있어 도로 관리 및 계획 수립에 활용할 수 있습니다.
