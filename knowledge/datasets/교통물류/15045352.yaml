summary_user: 광주교통공사가 관리하는 광주도시철도 1호선 구간 건축물(역사 등) 33개 시설의 내진 실태를 시설 1건당 1행으로 담은 파일로, 건물명·위치·연면적(지하 승강장 제외)·층수·내진 평가등급·준공연도·내진설계 적용 여부를 포함한다. 시민이나 안전 분석가가 '1호선 역사 중 내진설계기준 제정 전에 지어진 건물은 어디이고 평가등급은 어떤가'를 확인하거나 보강 공사 우선순위를 검토할 때 쓴다. 전역 조인 키가 없어 다른 철도 역·시설 데이터와는 건물명(역명)이나 노선명을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 광주교통공사의 건축물 내진 실태를 정리한 자료로, 총 33개의 시설 정보를 포함합니다. 주요 항목은 구분도로별, 노선명, 건물명, 관리기관, 위치, 연면적(지하 승강장 제외), 층수(지하·지상), 평가등급, 준공연도, 내진설계 적용 여부로 구성되어 있습니다.모든 건물은 광주도시철도 1호선 구간에 위치하며, 관리기관은 모두 광주교통공사입니다. 연면적은 수백에서 수천 제곱미터까지 다양하며, 층수 표기는 ‘지하-지상’ 형태로 기록되어 있습니다. 내진 평가등급은 대부분 ‘내진1등급’으로 표시되어 있으며, 준공연도는 2001년부터 2004년까지 분포합니다. 내진설계 적용 여부는 ‘내진설계기준 제정 전’에 해당하는 시설로 기록되어 있어, 당시 기준에 따라 설계되었음을 알 수 있습니다.이 자료는 시설별 내진 안전 수준과 준공 시점, 건물 규모 및 위치를 종합적으로 파악할 수 있어 향후 보강 공사 계획이나 안전성 평가에 중요한 기초 자료로 활용될 수 있습니다.
