summary_user: 충청남도 서산시 관내에 등록된 자동차 대수를 기준연월일별로 합계와 승용차·승합차·화물차·특수차·이륜자동차 차종별로 정리한 집계 통계 파일(CSV, 약 8KB)이다. 서산시 교통정책 담당자나 분석가가 "서산시의 화물차·이륜차 등록 대수가 시점별로 어떻게 변했나" 같은 질문에 답할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군구 자동차등록통계나 인구 통계와는 기준연월일과 시군구 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 충청남도 서산시 관내에 등록된 자동차 현황을 통계적으로 정리한 공공자료이다. 항목은 기준연월일, 합계, 승용차, 승합차, 화물차, 특수차, 이륜자동차로 구성되며, 차량 유형별 등록 대수를 포함한다. 기준연월일은 자료 수록 시점을 나타내고, 합계는 전체 등록 차량 수를 의미한다. 각 항목은 차종별 등록 수량을 나타내며, 교통정책 수립, 도로 인프라 관리, 환경 정책 기초자료, 교통량 예측, 자동차세 산정, 지역 교통계획 수립 등에 활용된다. 데이터는 서산시청에서 수집 및 관리하며, 정확한 통계 제공을 위해 정기적으로 갱신된다. 시민 및 관련 기관이 지역 내 자동차 등록 현황을 파악하고 활용하는 데 기초자료로 사용된다.
