summary_user: 공단이 운항관리하는 전국 연안여객선의 운항항로를 항로 1건 단위로 담는 원장성 데이터로, 면허항로·운항항로 코드와 이름, 항로 구분, 정방향·역방향 운항 소요시간(분)과 거리(km)를 포함한다. 섬 주민이나 여행객이 '이 항로는 편도 몇 분, 몇 km 걸리나'를 확인하거나, 분석가가 항로별 소요시간·거리를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 같은 기관이 낸 연안여객선 교통정보(운항상태·스케줄·운임 등)와는 운항항로코드나 항로명을 맞춰 연결한다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로공단의 운항관리 대상 연안여객선의 운항항로 정보를 포함하고 있습니다.면허항로코드, 운항항로코드, 운항항로명 등이 포함된 정보 입니다.여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다."
