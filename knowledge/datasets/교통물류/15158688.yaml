summary_user: 한국공항공사가 운영하는 전국 공항(인천국제공항 제외)에 입점한 상업·업무시설의 임대계약을 계약 건별로 담으며, 업체명·공항·임대위치·업종·면적(㎡)·연 임대료·계약기간·계약상태가 들어 있다. 공항 입점을 검토하는 사업자나 분석가가 '김포공항 식음료 매장의 면적당 연 임대료는 어느 수준이고 언제 계약이 끝나는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 항공통계와는 공항코드(airportCode)나 공항명 매핑으로만 이어 쓴다.
description_portal: 한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는 한국공항공사가 관할하는 전국 공항 내에 입점한 다양한 상업시설 및 업무시설의 임대계약 현황을 투명하게 제공합니다.제공되는 주요 데이터 항목으로는 계약 체결 업체의 명칭(업체명)부터 해당 시설이 위치한 공항코드, 시설의 정확한 임대 면적, 그리고 계약에 따른 임대료 조건 등이 상세히 포함되어 있습니다. 이를 통해 공항 내 상권 분석, 입점 현황 파악, 임대 시세 연구 등 다양한 목적의 데이터 활용이 가능합니다.제공되는 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.
