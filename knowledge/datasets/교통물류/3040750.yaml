summary_user: 인천교통공사가 운영하는 교통약자이동지원센터(장애인 콜택시 등 특별교통수단)의 월별 접수건수·승차건수·수입액·차량 1대당 이용자수와 수입액을 담은 월 단위 집계 파일로, 포털 설명상 2024년 1월부터 2025년 6월까지를 다룬다. 교통약자 이동지원 정책 분석가나 지자체 담당자가 월별 이용 수요와 차량당 운행 효율이 어떻게 변했는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 년월 기준으로 맞추거나 같은 기관(인천교통공사)의 다른 실적 자료와 이름으로 이어 써야 한다.
description_portal: 인천교통공사에서 운영중인 교통약자이동지원센터의 2024년 1월부터 2025년 6월 까지 수송수입 실적자료입니다.해당 데이터는 년월, 접수건수, 승차건수, 수입액, 대당이용자수, 1대당수입액 항목으로 구성되어있습니다.인천교통약자이동지원센터는 교통약자의 안전한 이동 편의를 위해 인천광역시 전지역과 시 인접지역(서울시 강서구, 경기도 김포시‧부천시‧시흥시)을 운행하고 있습니다.탑승인원은 이용자 본인 및 보호자 2인을 포함하여 최대 3명까지 탑승할 수 있고 운행시간은 07시부터 22시까지(주말, 공휴일 포함) 운행하고 있습니다.
