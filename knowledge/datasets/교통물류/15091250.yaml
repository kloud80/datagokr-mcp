summary_user: 인천광역시 서구의 전기자동차 등록대수를 차종별·분기별로 집계한 소규모 CSV 파일(376바이트)로, 2023년 1분기부터 2025년 3분기까지가 분기별 열로 들어 있다. 구청 환경·교통 담당자나 분석가가 '서구에서 전기 승용차와 화물차 등록이 분기마다 얼마나 늘었나'를 확인하고 친환경차 보급 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 차종 이름이나 기준 분기를 직접 맞추거나 같은 기관(서구)의 충전소 현황 등과 수동으로 연결해 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 전기자동차 등록 현황을 분기별로 정리한 자료입니다. 본 공공데이터는 인천광역시 서구 내 전기자동차 등록현황을 차종별, 분기별로 정리하여 제공하고 있습니다. 본 공공데이터를 통하여 친환경 차량 보급 현황을 파악할 수 있고, 환경 관련 정책에 관련하여 기초자료로써 기여할 수 있을것으로 판단이 됩니다. 또한 환경 개선 분석 등 다양한 분야에 활용할 수 있을것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
