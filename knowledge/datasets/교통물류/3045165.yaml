summary_user: 안양시 관내를 경유하는 버스의 노선별 기준 정보를 노선 한 건당 한 행으로 담은 CSV 파일(약 10KB)로, 관할관청·운행업체·노선번호·기점·종점·왕복 인가거리, 출퇴근·평일·주말 배차간격, 주중·주말 상하행 첫차·막차 시각을 담는다. 시민이나 분석가가 '안양을 지나는 이 노선의 첫차·막차와 주말 배차간격은 얼마인가', '어느 업체가 어떤 노선을 운행하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 정류장·실시간 도착(TAGO·지자체 BIS) 데이터와는 노선번호나 기점·종점 이름을 맞춰서 연결해야 한다.
limits: 노선ID 같은 공통 코드가 없어 다른 버스 데이터와는 이름 매핑으로만 이어지므로, 같은 번호의 노선이 여럿이면 잘못 연결될 수 있다. 정적 노선 기준 정보라서 실시간 도착 정보는 담지 않는다.
