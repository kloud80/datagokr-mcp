summary_user: 부산광역시에서 신호등이 설치된 횡단보도 3,815개(2025년 4월 23일 기준)의 위치를 지도 표출용 공간정보(SHP)로 담은 건별 원천 데이터로, 횡단보도마다 행정구역(구·동·리)·지번·교차로·가로·세로 길이·면적·경도·위도를 준다. 보행 안전 분석가나 지자체 담당자가 '어느 동, 어느 교차로에 신호등 있는 횡단보도가 몰려 있고 비어 있는 구간은 어디인가'를 지도 위에서 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 좌표 기반 공간 결합이나 행정구역 이름 매칭으로만 연결하며, 같은 부문의 어린이보호구역·무인교통단속카메라 표준데이터와 좌표로 겹쳐 보는 방식이 현실적이다.
description_portal: 부산광역시 횡단보도의 지도표출용 공간정보(SHP) 파일입니다.( ※ 일반 파일은 SHP 없는 목록명을 검색하시기 바랍니다 )산광역시 횡단보도 위치 정보에 대한 데이터로 순번, 행정구역(구), 행정구역(동), 행정구역(리), 지번, 교차로, 신호등 존재 유무, 가로 길이, 세로 길이, 면적, 경도, 위도 항목정보를 제공합니다.부산광역시 교통정보서비스센터에서 보유하여 제공하는 데이터입니다.부산광역시 횡단보도 위치 정보를 제공하여 보행자의 편의성 증진을 제공합니다.부산광역시 횡단보도 중 신호등이 존재하는 횡단보도의 위치 정보를 행정구역별로 주소(지번), 경도, 위도, 가로 길이, 세로 길이 등의 정보를 제공합니다.신호등이 존재하는 횡단보도의 개수는 3,815개입니다.* 2025년 4월 23일 기준으로 작성된 데이터입니다.
