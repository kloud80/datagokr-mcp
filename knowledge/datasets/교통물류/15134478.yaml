summary_user: 한국교통안전공단 주차정보시스템과 연계된 전국 주차장의 시설정보를 주차장 단위 행(222,709행)으로 담은 파일 데이터로, 주소·입구 위경도·총 주차구획 수·이용 가능 차량유형·수집장치와 CCTV 설치 현황을 포함한다. 분석가나 서비스 개발자가 특정 지역에 연계된 주차장이 어디에 몇 면 규모로 있고 어떤 차량이 이용 가능한지 확인하는 질문에 쓴다. 주차장 주소(address)와 입구 위도·경도(coord)로 전국주차장정보표준데이터나 지자체 실시간 주차 가능 대수 API와 이어 쓴다.
limits: 시설정보만 담고 실시간 주차 가능 대수는 없으며, 이는 지자체·공단별 비표준 API에서 따로 받아야 한다. 원 데이터를 보유한 시스템에서 수신하지 않은 항목은 공란이므로 항목별 결측을 확인해야 한다. 연계된 주차장만 담기 때문에 전국 모든 주차장을 포괄한다고 볼 수는 없다.
