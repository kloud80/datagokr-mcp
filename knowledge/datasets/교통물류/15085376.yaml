description_portal: 부산 1호선, 2호선, 3호선, 4호선, 부산김해경전철, 동해선에서 관리하는 역들의 문화시설에 대한 철도운영기관명,선명,역명,역층,출구번호,상세위치,보유장비,이용가능시간,전화번호 입니다.서울 지하철역의 하루 평균 이용객은 9백만 명에 달한다. 이토록 많은 이들의 발이 되고 있는 지하철역들이 최근 이색 테마를 갖추며 핫 플레이스로 등극하고 있다. 사실 해외에는 여행 필수 코스로 꼽힐 만한 색다른 지하철역이 많다. 러시아의 지하철역은 그 자체로 커다란 예술 작품이다. 수십 개 역사가 문화유산으로 지정돼 있고, 지하철 관광과 관련된 투어 프로그램도 많다. 스웨덴 스톡홀름의 지하철역은 ‘세계에서 가장 긴 갤러리’라는 애칭이 있을 만큼 아름답기로 유명하다. 최근 우리나라 지하철역 역시 다양한 도전을 시도하며 스치는 공간이 아닌, 일부러 찾고 싶은 명소로 거듭나기 위해 노력 중이다.
