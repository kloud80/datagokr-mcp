summary_user: 부산교통공사가 관리하는 부산 1~4호선·부산김해경전철·동해선 역사 안 문화시설을 역별로 한 줄씩 담은 소규모 목록 파일(532바이트)로, 운영기관·노선·역명·층·출구번호·상세위치·보유장비·이용가능시간·전화번호를 담는다. 부산 지하철 이용자나 지역 문화행사 기획자가 "어느 역 몇 번 출구 근처에 공연·전시 공간이 있고 몇 시까지 쓸 수 있나"를 확인하는 데 쓴다. 전역 공통 조인 키는 없어서, 다른 역·시설 데이터와는 노선명·역명을 이름으로 맞춰 이어 쓴다.
