description_portal: 2020년 항공기 내 반입금지물품 검색현황 정보에 대한 데이터 입니다.항공기 내 반입금지물품은 위험물(Dangerous Goods)와 위해물품(Prohibited Items)로 구분되지만, 국민들의 편의를 위해 주요 항공기 내 반입금지 위험물과 위해물품에 대한 정보를 담고 있습니다.국토교통부 고시 '항공기 내 반입금지 위해물품'에 따른 총기류 및 구성부품, 전자충격기 및 퇴치스프레이, 뾰족하거나 날카로운 물체, 심각한 상해를 입히거나 항공기 안전을 위협하는데 사용될 수 있는 공구류, 둔기 및 스포츠용품, 액체분무겔류, 인화성물질 및 생물학적 위험물질, 독성물질 등에 관한 항공기 객실 반입 관련 정보를 제공합니다.
