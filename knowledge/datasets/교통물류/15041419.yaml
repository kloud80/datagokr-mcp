summary_user: 수도권 6호선 각 역의 고객센터(고객안내센터) 위치와 전화번호를 역 단위로 담은 작은 CSV 파일(약 2.3KB)이다. 운영기관명·선명·역명과 함께 지상·지하 구분, 역층, 가까운 출구번호, 상세위치, 전화번호가 들어 있어, 이용객이 '이 역 고객센터는 몇 층 어느 출구 쪽에 있고 번호가 무엇인가'를 확인할 때 쓴다. 전역 공통 조인 키는 없으므로 다른 역·시설 데이터와는 역명(필요하면 선명·운영기관명)을 맞춰 이어 쓴다.
