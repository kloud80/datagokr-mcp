summary_user: 수도권 1호선의 역과 역 사이 거리(km)를 철도운영기관명·선명·역명 단위로 담은 파일 데이터이며, 검증 시 256행이 모두 수신됐다. 철도 이용자나 분석가가 특정 구간의 역간거리가 얼마인지, 역 사이 간격이 어떤지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 철도 데이터와는 역명이나 기관 코드 매핑을 거쳐야 이어 쓸 수 있고, 역 좌표·환승 정보를 담은 역 마스터와 연결해 쓰는 용도가 맞다.
description_portal: '서울교통공사에서 운영하는 1호선의 역간거리에 대한 데이터로 철도운영기관명, 선명, 역명, 역간거리의 데이터가 있습니다.역과 역사이의 거리(Km)를 말한다.해당 정보는 연번, 호선, 역명, 운행시간(분), 역간거리(km), 호선별누계(km)를 포함하고 있습니다.해당 데이터 중 "운행시간"의 경우는 열차가 출발하여 다음역에 도착하는 표준 운행시간으로 열차사정에 따라 변동될 수 있으니, 참고 부탁드립니다거리, 시간, 운행계통 등으로 구분 하자면-거리  대경선 서대구역 ~ 왜관역: 23.3km   공항철도 청라국제도시역 ~ 영종역: 10.3km-시간  대경선 서대구 ~ 왜관: 약 15분 50초  광역철도 제외 시 공항철도 청라국제도시역 ~ 영종역: 약 8분 30초-운행계통  수도권 전철 1호선 서울역발 천안급행 서울역 ~ 금천구청역: 17.3km'
