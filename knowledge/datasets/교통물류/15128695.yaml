summary_user: 대전광역시 서구 관내 이사화물 운송업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.6KB)로, 업체명·업종분류·사업자명·소재지(상세 주소 마스킹)·데이터 기준일자를 담는다. 서구에서 이사업체를 찾는 주민이나 지역 화물운송업 분포를 보려는 분석가가 "서구에 등록된 이사업체는 어디 어디인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 업체명·소재지 같은 이름 매칭으로만 다른 데이터와 이어지며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
