summary_user: 대전광역시 도로관리시스템에 등재된 가로수를 한 그루(관리번호) 단위로 담은 원천 목록으로, 행정읍면동·도로구간번호·도엽번호와 위도·경도 좌표를 함께 담는다(CSV 약 7.5MB). 시 녹지·도로 담당자나 분석가가 '우리 동네 어느 도로 구간에 가로수가 얼마나 심겨 있나'를 지도 위에서 확인하거나 구간별 식재 밀도를 비교하는 데 쓴다. 전역 조인 키는 없어 행정읍면동 이름 매핑이나 좌표 기반 공간 결합으로 행정구역 경계·도로 데이터와 이어 쓴다.
