description_portal: '서울교통공사의 상가임대 현황(면적,업종,계약일,임대료 등) 데이터입니다. 해당 데이터는 상가 유형, 호선, 역사명, 상가번호, 면적(㎡), 영업업종, 계약시작일자, 계약종료일자, 월임대료, 사업진행 단계 정보를 포함하고 있습니다.(데이터 제공 요청으로 인해 2015년 이후 데이터 순차적으로 업데이트 합니다. ) * 상가유형  - 복합상가: 일정면적 이상을 임차인의 비용으로 일괄 개발하여 직영 또는 위탁 운영하는 상가  - 브랜드전문상가: 다수역에 다수점표를 일괄 임대차하여 운영하는 상가  - 소송상가: 계약이 종료되었으나 명도거부하여 명도소송 중인 상가'
