summary_user: 서울교통공사 지하상가의 임대 현황을 상가 단위로 담은 파일 데이터로, 상가유형·호선·역명·상가번호·면적·영업업종·계약 시작/종료일·월임대료·사업진행단계를 싣고 2016-03-15~2031-07-26 범위의 1,486행이다. 분석가나 사업자가 특정 호선·역 상가의 업종별 면적과 월임대료 수준, 계약 만료 시점을 살피는 질문에 쓴다. 전역 조인 키는 없어 역명·호선 이름 매핑이나 같은 기관 코드로만 역 정보와 이어 쓰고, 역 마스터와 연결하면 역세권 분석에 보탤 수 있다.
