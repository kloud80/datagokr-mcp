summary_user: 인천교통공사가 운영하는 인천1호선·인천2호선·7호선 인천·부천 구간의 역 단위 정보를 담은 파일 데이터로, 역번호·노선·환승 여부·좌표·도로명주소·전화번호를 역마다 한 행씩 싣고 검증 시 71행을 받았다. 시민이나 분석가가 특정 역의 위치와 환승 노선, 역 주변 역세권 범위를 확인할 때 쓴다. 역위도·역경도 좌표 키와 역사도로명주소 키로 지도, 주소, 다른 교통·시설 데이터와 이어 쓰며, 역번호 외에 다른 기관 데이터와 직접 맞는 공통 코드 키는 확인되지 않았다.
description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선, 인천 2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준 역사정보입니다.해당 데이터는 역번호,역사명,노선번호,노선명,영문역사명,한자역사명,환승역구분,환승노선번호,환승노선명,역위도,역경도,운영기관명,역사도로명,역사전화번호,데이터기준일자 항목으로 구성되어있습니다.인천1호선은 검단호수공원역에서 송도달빛축제공원까지 33개역, 인천2호선은 검단오류역에서 운연역까지 27개역, 2호선 인천·부천 구간은 까치울역에서 석남역까지 11개역이 수록되어있습니다.
