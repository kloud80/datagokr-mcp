description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 운영정보 데이터로, 대구교통공사의 역별 월별 수송 실적에 따른 수입 현황을 제공합니다. 수록 기간은 1997년 11월부터 현재까지이며, 대구도시철도 전 노선 각 역의 월별 수송량을 기반으로 산출된 수입 통계 자료를 포함하고 있습니다. 본 자료는 역별 수송 실적과 수입 추이를 비교·분석하여 노선 운영의 효율성과 이용 패턴의 변화를 파악할 수 있도록 구성되어 있으며, 공공교통 운영정보의 투명한 공개와 데이터 기반 경영 의사결정을 지원하는 자료입니다. 또한 역별 이용 수요의 시계열 분석, 수요 기반 운영계획 수립, 재원 운영의 효율성 검토 및 대중교통 정책 수립을 위한 기초자료로 활용될 수 있습니다. 아울러 공공데이터 개방을 통한 행정의 투명성과 책임성 제고, 시민의 정보 접근성 향상에도 기여할 수 있습니다. 본 데이터는 매월 정기적으로 갱신됩니다.'
