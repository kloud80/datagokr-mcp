summary_user: 대구도시철도 각 역의 월별 수송 실적에 따른 수입을 연도·월 행에 역 이름을 열로 펼친 형태로 담은 집계 통계로, 포털 설명상 1997년 11월부터 수록되어 있고 CSV 파일(약 227KB)로 활용신청 없이 받는다. 교통 분석가나 시민이 '반월당·동대구역 같은 주요 역의 수입이 연도별로 어떻게 변했는가'처럼 역별 수요와 수입 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 역 이름 매핑이나 같은 기관(대구교통공사) 데이터와의 연결로만 이어 쓴다.
limits: 역 코드 같은 표준 조인 키가 없어 다른 기관의 역·승하차 데이터와 붙이려면 역 이름을 직접 맞춰야 한다. 월별 역 단위 수입 집계라 시간대별 승하차나 출발·도착(OD) 흐름은 알 수 없고, 공간 좌표가 없는 비공간 자료다.
