description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야 투명행정 및 신뢰경영 운영정보 데이터로, 개인정보 처리와 관련한 위탁 업무 현황 정보를 제공합니다. 데이터에는 수탁업체명, 위탁업무의 구체적 내용, 해당 업무를 담당하는 사업부서명 등의 주요 항목이 포함되어 있으며, 대구교통공사가 개인정보 처리 업무를 외부 업체에 위탁하여 운영하는 현황을 확인할 수 있는 자료입니다. 해당 데이터는 개인정보 처리 위탁 현황 공개와 관리 체계 파악을 위한 자료로 활용할 수 있으며, 개인정보 보호 관련 점검, 위탁관리 현황 분석 및 관련 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 개인정보 처리 업무의 위탁 현황을 투명하게 공개함으로써 시민의 정보 접근성과 공공기관 운영의 투명성 향상에 기여합니다. 본 데이터는 연 1회 갱신되며, 개인정보 처리 위탁 현황 변동 사항을 반영합니다.'
