summary_user: 2023년 7월 31일까지 신고된 초경량 무인비행장치의 신규 신고 대수를 신고연도별·기체 종류별(무인멀티콥터 V-TOL 포함·제외, 무인비행기, 무인헬리콥터, 무인비행선)로 집계한 전국 단위 소규모 표(CSV 311바이트)이다. 교육기관·분석가·일반인이 '연도별로 드론 신규 신고가 얼마나 늘었고 어떤 기종이 많은가'처럼 국내 드론 보급 추이와 산업 규모를 가늠할 때 참고자료로 쓴다. 전역 조인 키가 없고 지역 구분도 없어서, 다른 드론 비행승인·조종자격 통계와는 신고연도를 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 항공사업법 제122조(초경량비행장치 신고), 제123조(초경량비행장치 변경신고 등)에 따라, 드론(초경량비행장치 중 무인비행장치에 한함)을 소유한 자는 신고를 해여야 하고, 한국교통안전공단은 같은법 제135조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.기체 신고 시 소유자정보, 종류, 모델, 최대이륙중량 등을 등록해야 하며, 현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있다.해당자료는 2023년 7월 31일까지 신고된 초경량 무인비행장치(무인멀티콥터, 무인비행기, 무인헬리콥터, 무인비행서)의 연도별 신규 신고현황입니다. 교육기관이나 일반인들이 국내 기체현황을 알고자 할 때 참고자료로 쓸 수 있는 데이터이다.
