description_portal: '계류장이란 공항, 비행장 또는 이착륙장에서 여객의 승하기, 화물·우편물 적재·적하, 급유, 주기, 제·방빙 또는 정비 등의 목적으로 항공기, 경량항공기 또는 초경량비행장치가 이용할 수 있도록 설정된 구역을 의미합니다.공항식별자, 공항명, 계류장명, 계류장유형, 표면포장유형, 포장부수등급, 최대타이어압력코드, 실험방법 등에 대한 정보를 제공하고 있습니다.계류장유형은 아래와 같습니다. PARKING : 항공기를 단순히 주기해두는 용도의 계류장NORMAL : 일반적인 승객 탑승, 하역, 급유 등이 이루어지는 표준 계류장포장 부수 등급은 아래와 같습니다.A : 매우 강한 지지력B : 강한 지지력 C : 보통 지지력D : 약한 지지력최대타이어압력코드는 아래와 같습니다.W : 고압 타이어용, 대형 항공기 사용 가능X : 중대형 항공기 사용 가능Y : 중형 항공기까지 사용 가능Z : 저압 타이어용, 소형 항공기 사용 가능'
