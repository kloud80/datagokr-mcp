summary_user: 경기도 광주시가 관리하는 도로시설물 가운데 점형·선형 점자블록 같은 장애인 편의시설을 시설 한 건씩 담은 파일로, 관리번호·도로구간번호·행정구역·법정구역·연장(미터)·시설 종류를 기록한다. 교통약자 이동 환경을 살피는 시민단체나 시 담당자가 '어느 동네 도로에 점자블록이 얼마나 깔려 있나'를 행정구역별 연장으로 확인하는 데 쓴다. 전역 조인 키는 없어 행정구역·법정구역 이름이나 같은 기관의 도로구간번호로 광주시 다른 도로시설물 자료와 맞춰 쓴다.
limits: 다른 기관 데이터와 바로 붙는 표준 코드가 없어 이름 매핑으로만 연결된다. 범위는 광주시 한 곳이며, 이 파일에는 좌표 같은 공간 정보 없이 속성만 들어 있다.
