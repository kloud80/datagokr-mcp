description_portal: 본 데이터는 경기도 광주시청에서 관리하는 도로시설물 중 장애인 편의시설 현황 자료입니다. 주요 제공 항목은 지형지물부호, 관리번호, 도로구간번호, 행정구역, 법정구역, 연장(미터), 편의시설종류(점형블록, 선형블록 등)로 구성되어 있으며, 광주시 공간정보에서 관리하는 장애인 편의시설의 위치, 유형, 규모 등의 정보를 수록하고 있습니다. 해당 데이터는 장애인 등 교통약자의 이동권 보장과 접근성 향상을 위한 정책 수립 및 시설 관리에 활용될 수 있습니다. 본 자료는 장애인 복지 증진, 도로 인프라 개선, 지역사회 포용성 강화 등 다양한 목적의 기초자료로 활용할 수 있습니다.
