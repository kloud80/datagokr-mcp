description_portal: 해당 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 면형 기타시설인 교통섬의 설치 현황을 공간 위치 정보와 함께 정리한 데이터입니다. 항목으로는 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분이 포함되며, TM 중부 GRS80 기준 위도·경도 좌표 기반으로 각 교통섬의 위치를 확인할 수 있습니다. 교통섬은 도로 횡단 시 보행자 임시 대기 공간을 제공하거나 차량의 회전 속도 감속을 유도하기 위해 설치되는 시설로, 교차로 구조의 안정성을 확보하고 보행 안전도를 높이는 역할을 합니다. 본 데이터는 교통섬의 설치 위치와 구조적 특성을 분석하여 보행 안전 사각지대 파악 및 시설 개선 우선순위 도출에 활용됩니다. 해당 자료는 2022년 기준 1회성 수집된 정보로, 참고용으로 활용하는 것이 적합합니다.
