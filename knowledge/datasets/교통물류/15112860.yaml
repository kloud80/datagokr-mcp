description_portal: 서울교통공사에서 제공하는 최근 5년간(2021년~2025년) 서울지하철(1~8호선) 사고 현황 자료입니다. 본 데이터는 공공데이터 제공 요청에 따라 생산된 자료로, 지하철 이용 과정에서 발생한 다양한 사고의 기본 정보를 체계적으로 수록하고 있습니다. 주요 항목은 연번, 사고일시, 사고유형, 사고 발생 장소로 구성되어 있으며, 이를 통해 특정 시기나 장소에서 사고가 집중되는 경향을 파악하거나 유형별 발생 특성을 분석할 수 있습니다. 해당 자료는 지하철 안전관리 체계 강화, 교통사고 저감 대책 수립, 연구기관·언론·학계의 정책분석, 시민 안전 인식 제고 등 다양한 목적으로 활용할 수 있는 기초 통계자료입니다.
