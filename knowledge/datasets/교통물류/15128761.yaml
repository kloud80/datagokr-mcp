summary_user: 서울교통공사 1~8호선 지하철 역사 안에 설치된 스마트도서관(무인도서대출반납기·도서반납함 등)의 운영 현황을 기기 설치 건별로 담은 파일로, 포털 설명상 89개 기기의 호선·역명·설치대수·운영 계약자·기기종류를 담는다. 시민이 출퇴근길에 들르는 역에서 책을 빌리거나 반납할 수 있는지, 그 기기를 어느 구청·문화재단이 운영하는지 확인하는 데 쓴다. 전역 조인 키가 없어 역 위치·승하차 데이터 등과는 호선·역명 이름 매칭으로만 이어 쓴다.
description_portal: 서울교통공사에서는 1~8호선 지하철 역사 내에 스마트도서관(무인도서대출반납기, 도서반납함 등) 설치장소를 임대하여 시민들이 보다 편리하게 도서를 대출하고 반납할 수 있도록 편의를 제공하고 있습니다. 이러한 스마트도서관(무인도서대출반납기, 도서반납합 등)은 각 구청이나 문화재단에서 운영 및 관리하고 있습니다. 이 자료는 각 지하철 역사내에 설치되어있는 스마트도서관의 운영 현황에 대한 자료이며, 수서역 등 89개 기기에 대해 설치 호선, 역명, 기기종류, 설치 위치에 대한 데이터를 제공합니다. 이 자료는 매년 6월 업데이트 될 예정입니다.
