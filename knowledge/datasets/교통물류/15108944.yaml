description_portal: 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 점형 도로안전시설인 도로반사경 설치 현황을 공간 위치 기반으로 정리한 정보입니다. 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분 등의 속성과 더불어 TM 중부 GRS80 기준 위도·경도 좌표값이 포함되어 있으며, 각 반사경의 설치 위치와 특성 정보가 함께 수록되어 있습니다. 특히 교차로나 굴곡도로 등 시야 확보가 어려운 지점에서 보행자 및 운전자의 시야를 보조해 사고를 예방하는 역할을 하는 시설 분포를 파악할 수 있습니다. 반사경의 존재 여부 및 위치는 보행안전 사각지대 분석 및 시설 정비 우선순위 설정에 중요한 기초 자료로 활용되며, 보행환경 개선 정책 수립에 도움을 줍니다. 본 데이터는 2022년 기준으로 1회성 수집된 자료로, 시각화 및 정책 연구 시 참고용으로 활용하는 것이 적합합니다.
