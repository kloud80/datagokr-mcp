summary_user: 광양항 컨테이너부두에서 운송된 컨테이너 차량 실적을 일자별로 적컨테이너(화물 실린 것)·공컨테이너(빈 것) 건수와 합계로 나눈 집계 파일이며, 활용신청 없이 받는 2KB 남짓의 작은 CSV입니다. 항만 물류 분석가나 운송사업자가 광양항에서 빈 컨테이너와 실린 컨테이너 운송 비중이 날짜별로 어떻게 달라지는지 보고 차량 운송 수요를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자 기준으로 맞추거나 같은 기관(여수광양항만공사)의 다른 항만 물동량 자료와 이름으로 이어 쓴다.
limits: 광양항 한 곳의 일별 합계만 담아 화물 건 단위 반출입이나 터미널·운송사별 내역은 알 수 없다. 공통 코드나 조인 키가 없어 다른 항만·전국 통계와 붙일 때는 일자와 항만명을 직접 맞춰야 한다.
