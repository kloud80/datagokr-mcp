summary_user: 경상남도 김해시 관내 시내버스정류소를 정류소 한 곳당 한 행으로 담은 원장 파일로, 행정동·정류소명·코드번호·소재지(주소)·관리부서·연락처를 제공한다. 주민이나 분석가가 "우리 동네 행정동에 어떤 버스정류소가 있고 어디에 있나"를 확인하거나, 정류소 분포를 행정동별로 세어 보는 데 쓴다. 전국 공통 조인 키는 실측 컬럼에서 확인되지 않았으므로, 정류소 코드번호(코드번호)나 정류소명·행정동 이름을 맞춰 김해시 버스정보(BIS)·도착정보 등 같은 기관 자료와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 기관·전국 정류소 데이터와는 이름·코드 매핑으로만 연결되며, 범위는 김해시 한 곳에 한정된다. 실시간 도착·노선·승하차 정보는 담지 않는다.
