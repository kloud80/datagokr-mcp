summary_user: 의정부 경전철 각 역의 일자별 승차·하차 합계와 04시부터 자정 넘어까지 시간대별 승하차 인원을 역×일자 단위로 담은 집계 파일(CSV, 약 82KB)이다. 출퇴근 시간대에 어느 역이 가장 붐비는지, 특정 역의 유동인구가 시간대별로 어떻게 달라지는지를 알고 싶은 교통 분석가나 역 주변 상권을 검토하는 사업자가 쓴다. 전역 조인 키가 없어 역명(역명)을 역 위치·시설 데이터와 이름으로 맞추거나 같은 기관(의정부시) 자료와 연결해야 한다.
limits: 실측 컬럼에 표준 역코드 같은 전역 조인 키가 없어 다른 철도·역 데이터와 붙일 때는 역명 문자열 매칭이 필요하다. 승하차 집계라 출발지-도착지(OD) 이동이나 개인 단위 통행은 알 수 없고, 범위는 의정부시 경전철에 한정된다.
