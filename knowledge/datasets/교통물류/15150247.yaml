description_portal: 이 데이터는 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 관리·집계한 자료로, 내압용기(CNG·수소 등) 장착 자동차의 정기검사 수검률을 분석한 통계 데이터입니다. 연도별·지역별(검사소별)로 검사 대상 차량 수, 실제 수검 차량 수, 수검률(%)을 산출할 수 있도록 하고 미수검 차량 현황 및 경과 차량 현황(건수), 미판정 대수, 미수검 대수 등을 함께 제공하여, 내압용기 자동차의 안전관리 실태와 검사 제도 운영 현황을 객관적으로 파악할 수 있도록 구성되어 있습니다. 이 자료는 고압가스 자동차의 폭발·누출 위험 예방, 검사 주기 적정성 검토, 환경 및 교통 안전 정책 수립 등 다양한 행정·연구 목적으로 활용될 수 있습니다.
