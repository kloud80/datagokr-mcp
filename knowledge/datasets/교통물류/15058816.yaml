summary_user: 경기도 시군별 택시요금 안내 자료로, 시군명(SIGUN_NM)과 요금 유형(표준형·가형·나형)별 기본요금, 기준 거리·거리당 요금, 기준 시간·시간당 요금, 요금 적용일자를 행 단위로 담는다. 우리 시군 택시 기본요금과 거리·시간 요금이 얼마이고 언제부터 적용됐는지, 시군 간 요금 수준이 어떻게 다른지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 택시 이용 요금에 대한 안내 자료로, 시군별 택시요금 조정 유형, 기본요금, 거리요금, 시간요금, 요금 적용일자 등 주요 항목으로 구성되어 있습니다. 요금 유형은 도시 규모 및 특성에 따라 표준형(일반 도시), 가형(도농 복합 도시 중 도시형), 나형(도농 복합 도시 중 농촌형)으로 구분되며, 이에 따라 요금 체계도 달라집니다. 각 유형에 따라 기준 거리(m), 기준 거리당 요금(원), 기준 시간(초), 기준 시간당 요금(원) 등의 상세 요금 항목이 제공됩니다. 이 데이터는 지역별 택시요금 수준 비교, 요금 인상률 분석, 교통복지 정책 수립, 택시 서비스 이용자 정보제공 등의 목적으로 활용될 수 있으며, Open API 방식으로 접근 가능합니다.
