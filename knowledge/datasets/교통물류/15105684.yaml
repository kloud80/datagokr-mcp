summary_user: 부산 1호선 각 역의 운영기관명, 노선명, 역명, 교통약자 도우미 전화번호를 역 단위 한 행씩 담은 소규모 CSV 목록(2,167바이트)이다. 휠체어 이용자나 고령자, 보호자가 "부산 1호선 ○○역에서 승하차 도움을 받으려면 어디로 전화하나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 역 정보·시설 데이터와는 역명 또는 운영기관명을 이름으로 맞춰 이어야 한다.
description_portal: 부산 1호선 에 포함된 도시광역철도역들의 철도운영기관명, 운영노선명, 역명, 교통약자도우미전화번호, 데이터기준일에 대한 데이터가 있습니다.- 혼잡한 지하철 역사 내 승하차 안전도우미로 배치돼, 교통약자 안전사고 예방 등 업무다.- "지하철 안전도우미’는 지하철 주요 혼잡역에서 시민들의 질서 유지와 안전 확보를 위한 업무를 맡는다.- 오전 출근 시간대의 혼잡한 지하철 질서 유지와, 야간 안전 취약 시간대의 순찰 등이 주요 임무다.- 이들은 교통공사의 기간제 안전 보조 인력으로 활동하며, 공공안전 강화를 위한 중요한 역할을 하게 된다.- 교통약자 사전등록 해 두고 역 접근 시 전화 하면 교통약자 도우미가 출동한다.- 역사 내.외부 불합리한 안내체계를 정비하고, 승강장 혼잡도 정보 등을 제공 한다.
