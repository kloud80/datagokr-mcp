description_portal: 이 데이터는 2026년 6월 9일 기준으로 경상북도 김천시에 등록된 화물자동차운송주선업체 중 이사화물 운송 업체들의 정보를 담고 있습니다. 총3개의 업체가 자료에 포함되어 있으며, 각 업체의 연번, 상호명, 면허 종류, 주소, 현재 운영 여부, 그리고 데이터 기준일로 구성되어 있습니다. 모든 업체는 "이사화물" 면허를 보유하고 있으며, 주소는 업체의 주사무소 주소지를 기준으로 김천시 내의 상세한 도로명 주소로 기재되어 있습니다. 현재 모든 업체는 "영업중" 상태로 표시되어 있어, 이들 업체가 정상적으로 영업을 하고 있다는 것을 알 수 있습니다. 이 데이터는 김천시 내 이사화물 관련 서비스 현황을 파악하거나, 행정 목적 및 상업적 활용을 위한 기초 자료로 유용하게 사용될 수 있습니다.
