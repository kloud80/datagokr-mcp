summary_user: 전국 지역별로 운행 중인 시내버스 전체 노선 수와 그중 저상버스가 다니는 노선 수, 그 비율(%)을 담은 집계 파일이며, 480바이트 규모의 작은 CSV다. 교통약자 단체나 지자체·정책 분석가가 "우리 지역 시내버스 노선 중 휠체어로 탈 수 있는 저상버스가 다니는 노선이 몇 %인가"를 다른 지역과 비교할 때 쓴다. 전역 조인 키가 없어 지역 구분(구분) 이름을 맞춰 지역별 인구·교통약자 통계나 버스 노선 데이터와 이어 써야 한다.
description_portal: 대중교통 가운데 가장 쉽게 이용할 수 있는 수단인 버스에 대해, 교통약자가 편리하고 안전하게 이용할 수 있는 구조로써 낮은 차체 바닥 높이로 수평 승하차가 가능한 저상버스(또는 휠체어 탑승 설비를 장착한 버스 등)를 도입하고 있으며, "교통약자법" 제13조제7항에 따라 노선버스를 대폐차 시에는 저상버스를 반드시 도입하도록 하고 있어, 매년 저상버스의 도입 현황을 파악하고 이를 관리하고자 조사된 정보를 개방하고 있습니다.본 개방 데이터는 저상버스의 운영 현황으로, 지역별 운행중인 전체 시내버스 노선 중 저상버스가 도입되어 운행되고 있는 노선의 현황을 제공하는 자료입니다.시내버스 운행 노선 수, 저상버스운행 노선 수, 저상버스 운행 비율단위( 노선, %)
