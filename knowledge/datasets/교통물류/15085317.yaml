description_portal: '○ 통계개요* 통계명 : 항공노선별 수송* 통계종류 : 김포공항의 국내선, 국제선의 여객ㆍ화물 수송실적 현황을 제공하는 일반ㆍ보고통계(승인번호 제38101호)* 작성목적 : 국내ㆍ국제선 항공에 의한 여객ㆍ화물 수송실적 현황을 파악하여 각종정책수립과 연구ㆍ분석 등을 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 한국공항공사에서 총괄 작성* 공표주기 : 정기(매년)* 공표범위 : 내용 ? 항공 노선별의 여객ㆍ화물 수송실적 현황 등○ 용어설명* 국내선(Domestic) : 국내구간 사이의 노선* 국제선(International) : 하나 또는 그 이상의 국제 운항구간을 포함하는 노선* 여객수(Passenger) : 항공수송실적에서 여객수는 각 운항의 개별 구간의 여객을 한번계산한 수이고 그 운항의 개별 구간에 대해 반복계산하지 않음* 화물(Freight) : 우편을 제외한 화물* 우편(Mail) : 우체국에 배달을 목적으로 전달되는 모든 서신과 물건'
