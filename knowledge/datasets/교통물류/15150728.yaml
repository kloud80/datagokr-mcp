summary_user: 전국의 자전거 위험도로를 위험요소 한 건 단위로 담으며, 지번·도로명 주소, 경위도, 위험요소 대·중·소 분류, 상세 내용, 기준일자, 현장 사진 여부를 함께 제공한다. 자전거 이용자나 지자체 담당자가 출퇴근 경로나 관내 자전거도로 중 사고 위험이 지적된 구간이 어디인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 자전거도로 노선이나 공공자전거 대여소 데이터와는 주소·좌표 또는 이름 매핑으로 연결한다.
