  - 혼잡도
  - 교통흐름
  - 인천 통행속도
  - 인천 도로 소통 통계
  - 시간대별 평균 속도
  - 교통 혼잡도
  - 상습 정체 구간
  - 인천 ITS 속도
  - 구간별 차량 속도
summary_user: 인천광역시 관내 주요 도로의 차량 통행속도를 일자별로 집계한 통계로, 도로명·방면 단위(일부 오퍼레이션은 구간명 단위)로 일 평균 속도와 0시~23시 시간대별 평균 속도를 담는다. 출퇴근 시간대에 인천의 어느 도로·방면이 가장 느린지, 교통 대책 시행 전후로 특정 도로의 평균 속도가 달라졌는지를 보려는 교통 분석가·정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 교통 데이터와는 도로명·구간명 같은 이름 매핑으로만 이어 쓰며, 날짜(statDate)를 기준으로 기간별 이력을 쌓아 상습 정체 분석에 쓴다.
description_portal: 인천광역시가 제공하는 도로 통행속도 통계 조회 서비스 API는 관내 주요 도로의 차량 통행속도에 대한 통계 데이터를 제공합니다. 이 API는 도시 교통의 혼잡 수준을 객관적으로 분석하고, 교통 정책의 효과 측정, 지능형 교통 시스템(ITS) 운영, 실시간 교통 정보 제공 등의 기초 자료로 활용되는 데 목적이 있습니다.이 API는 개발자들이 교통 혼잡도 분석 서비스, 최적 경로 안내 앱, 도시 교통 시뮬레이션 모델 등을 구축하는 데 필수적인 동적 교통 통계 데이터입니다.해당 데이터는 교통정보운영과에서 관리하고 있으며, 공공데이터포털에서 확인할 수 있습니다.
