description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구도시철도 1·2·3호선 각 역사에 설치된 자동심장충격기(AED) 현황을 제공합니다. 주요 항목은 역사명, 설치 위치, 품명, 제조사, 설치연도, 관할 보건소 및 역 주소 등으로 구성되어 있으며, 역사별 응급의료장비의 설치 및 관리 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 자료는 심정지 등 응급상황 발생 시 신속한 대응체계 구축과 응급의료장비 관리, 시설 안전관리 및 유지보수 계획 수립을 위한 기초자료로 활용될 수 있습니다. 또한 역사별 응급 대응 인프라 분석, 안전관리 정책 수립, 재난 및 응급의료 대응체계 개선, 공공교통 시설의 안전성 향상을 위한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
