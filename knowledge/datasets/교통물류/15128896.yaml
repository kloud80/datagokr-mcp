summary_user: 경기도 도로대장 가운데 터널을 터널 한 곳당 한 행으로 담은 원천 대장이며, 시도 범위의 비공간 자료입니다. 노선·구간번호, 시작·종료 위치, 소재지, 상·하행 통행제한높이, 종단경사, 방재·소화·환기·경보·비상전화 설비, 착공·준공일 등 25개 항목을 담습니다. 도로관리 담당자나 분석가가 '경기도 터널 중 높이 제한이 낮거나 무정전시스템·라디오방송설비가 없는 곳은 어디인가'를 확인하는 데 쓰고, 화물차 운전자는 통과 높이를 점검하는 데 씁니다. 전역 조인 키가 없어 노선번호(route_no)·구간번호와 터널명, 소재지 주소를 이름·코드로 맞춰 같은 기관의 다른 도로대장 자료나 표준노드링크와 연결합니다.
description_portal: 이 데이터는 경기도 도로대장 중 터널 정보를 포함하고 있으며, 노선번호, 구간번호, 터널명, 시작 및 종료 위치, 소재지 주소, 상·하행 통행제한높이, 종단경사, 방재시설 및 소화시설 종류와 수량, 라디오방송설비 유무, 배수시설 구분, 비상전화 수량, 환기설비 유형, 경보설비 구분, 무정전시스템 유무, 착공일, 준공일, 시행기관명 등 총 25개 항목으로 구성되어 있습니다. 이 데이터는 각 터널의 구조적 특성과 안전설비 현황을 나타내며, 화재대응, 자연배수, 환기 방식, 통과 높이 제한 등의 정보가 포함되어 있어 재난안전 관리, 도로 인프라 설계, 유지보수 및 터널 이용 안전 정책 수립 등에 활용됩니다.
