summary_user: 서울 강남구에서 이뤄진 주정차 위반 단속을 건별로 담은 파일(약 55MB CSV)로, 단속일시·단속동·단속장소와 단속 방법(고정 CCTV, 주행형 CCTV, 안전신문고 앱, PDA 등)을 기록하며 포털 설명상 2021년 10월부터 2024년 3월까지를 다룬다. 강남구 안에서 어느 동·어느 장소에 주정차 단속이 몰리는지, 시간대별로 어떻게 다른지를 보려는 주민·상인·교통 분석가가 단속 다발 지점을 파악하는 데 쓴다. 전역 조인 키는 없으므로 시군코드·단속동 이름을 기준으로 다른 구의 주정차 단속 현황이나 동 단위 통계와 이름 매칭으로 이어 쓴다.
limits: 단속장소가 좌표 없이 텍스트로 되어 있고 공통 조인 키가 없어, 지도 결합이나 타 데이터 연계에는 주소 매칭이 필요하다. 범위는 강남구 한 곳이며, 포털 설명상 2024년 3월 이후 단속분은 들어 있지 않다.
