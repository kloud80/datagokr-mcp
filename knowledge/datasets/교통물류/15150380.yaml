description_portal: 본 데이터셋은 자동차관리법 제34조에 따른 자동차 튜닝 항목중 적재함 보강의 하중 계산 결과를 종합적으로 기록한 자료입니다. 적재함 보강은 적재함 내부에 보강재로 내부를 보강함으로써 적재함의 파손, 부식 등 적재함 내구성을 보완하기 위한 튜닝으로 튜닝신청번호, 적재함구분, 적재함가로, 적재함세로, 적재함두께, 비중, 보강재료의 중량 등 필수 항목을 포함하여 제공합니다. 적재함 보강 계산결과를 토대로 튜닝승인시 하중계산식 입력값으로 사용하며 적재함 내부 크기를 초과해서 보강재를 보강할 수 없습니다.
