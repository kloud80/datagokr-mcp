summary_user: 광양시에서 교통카드로 결제할 수 있는 가맹점을 한 곳씩 담은 건별 목록이며, 읍면동·가맹점 형태·상호명·주소 및 위치·데이터기준일을 담는다. 시민이 "우리 동네에서 교통카드를 충전하거나 쓸 수 있는 가게가 어디인가"를 찾을 때, 행정 담당자가 읍면동별 교통카드 가맹점 분포를 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 읍면동 이름이나 주소 문자열을 매핑해 이어 쓴다.
description_portal: 이 데이터는 교통카드 사용이 가능한 가맹점의 현황을 제공하는 자료로, 읍면동, 가맹점 형태, 상호명, 주소 및 위치 등의 정보를 포함하고 있습니다. 이를 통해 국민은 지역 내 교통카드 사용 가능 매장을 손쉽게 확인할 수 있으며, 편리한 결제 환경 조성에 기여할 수 있습니다. 행정기관은 본 데이터를 기반으로 교통카드 사용 인프라 확충 현황을 관리하고, 결제 편의성 확대 및 지역 상권 활성화 정책 수립에 활용할 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 확보하고, 공공데이터 개방을 통해 국민 생활 편익 증진과 스마트 결제 환경 구축에 기여합니다.
