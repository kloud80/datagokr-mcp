summary_user: 'SRT 정차역별 연간 하차 인원을 연도 한 행, 역(수서·동탄·평택지제부터 여수엑스포까지 30여 개 역) 한 열로 펼쳐 담은 연도별 집계 파일이며, 크기는 1,868바이트 CSV이다. 특정 역(예: 수서, 동대구)의 SRT 하차 인원이 해마다 어떻게 늘고 줄었는지, 신규 정차역 개통 뒤 이용이 어떻게 달라졌는지를 보려는 분석가·지역 연구자가 쓴다. 전역 공통 조인 키(역 코드 등)는 없어서, 역 이름(열 이름)을 다른 철도 역 정보나 승차 실적과 이름으로 맞춰 이어 써야 한다.'
description_portal: 1. 이 데이터는 고속열차 SRT에 대한 수송실적 데이터로서, SRT가 운행하는 정차역별 하차실적을 제공하는 자료입니다.2. 수서, 동탄, 지제 등 각 열차 및 연도별 수송하차 실적을 나타낸 자료입니다.3. (예시) 2016년도 수서역 수송하차 실적은 312,280입니다.* 해당 데이터는 연간 주기성 데이터입니다.* 2025년 12월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.
