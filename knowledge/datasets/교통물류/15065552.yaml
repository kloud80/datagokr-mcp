summary_user: 광주광역시 남구 관내 불법주정차 단속을 건별로 담은 파일(csv, 약 2.3MB)로, 단속일자·시간·장소·단속구분·과태료와 특별지역 여부를 담는다. 주민이나 분석가가 '남구에서 어느 장소·시간대에 주정차 단속이 몰리는가', '어린이보호구역·소방시설 주변 단속이 얼마나 되는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속장소 이름을 주소·좌표로 바꾸거나 같은 기관(남구) 자료끼리 맞춰서만 이어 쓴다.
limits: 전역 조인 키가 없고 단속장소가 텍스트라 지도 연계나 다른 지자체 자료와 바로 결합하기 어렵다. 범위는 남구 한 개 시군구이며, 포털 설명에 따르면 단속특별지역 값은 소방시설·어린이보호구역 단속 건에만 기입돼 빈 값을 '일반지역'으로 단정하면 안 된다.
