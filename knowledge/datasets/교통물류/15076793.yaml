summary_user: 고속도로 출발 영업소와 도착 영업소 사이의 실시간 통행시간을 영업소 쌍별로 담으며, 기준일·기준시각마다 평균·최대·최소 통행시간과 차종 구분, 교통량(efcvTrfl)을 함께 제공한다. 운전자나 내비게이션·교통 분석가가 '지금 서울 영업소에서 대전 영업소까지 승용차로 몇 분 걸리나'와 같은 질문에 쓰고, 응답을 계속 쌓으면 상습 정체 구간 분석의 이력 자료가 된다. 전역 조인 키는 없으며, 영업소 코드(startUnitCode·endUnitCode)와 영업소명을 기준으로 같은 한국도로공사의 다른 고속도로 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 실시간 영업소 간 통행시간 정보를 조회할 수 있는 OpenAPI이다.해당 API는 고속도로를 이용하는 차량의 이동 이력을 바탕으로 출발지와 도착지 영업소 간의 통행시간을 실시간으로 산출한다.정보는 출발영업소명, 도착영업소명, 노선번호, 측정시간, 평균통행시간 등의 항목으로 구성되어 있으며, 갱신 주기는 수분 단위로 이루어진다.데이터는 XML 및 JSON 형식으로 제공되며, 내비게이션 경로 안내, 교통상황 분석, 소통정보 제공 등에 활용할 수 있다.실시간 데이터 특성상 교통량, 사고, 기상상황 등에 따라 변동되며, 이를 반영하여 사용자에게 정확한 정보를 제공한다.API는 인증키 발급 후 이용 가능하며, 요청 항목 및 응답 구조는 명세 문서를 통해 확인할 수 있다.
