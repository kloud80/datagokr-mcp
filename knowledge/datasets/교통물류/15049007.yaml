description_portal: 서울특별시 영등포구의 연료별 자동차 등록현황 자료는 2009년부터 2018년까지의 기간 동안 차종별, 용도별, 연료별 세부 데이터를 제공합니다. 차종은 승용차, 승합차, 특수차, 화물차로 구분되며, 용도는 사업용과 비사업용으로 나뉩니다. 또한, 연료 구분은 CNG, 경유, 기타연료, LPG, 전기, 하이브리드(LPG+전기), 하이브리드(휘발유+전기), 휘발유, 휘발유(무연), 휘발유(유연) 등 다양한 종류를 포함합니다. 이 자료는 자동차 등록 현황 분석, 친환경차 도입 추세, 정책 수립 및 교통·환경 계획 수립에 유용하게 활용될 수 있습니다.
