summary_user: 경기도 시군별로 발급된 택시 면허를 집계년월(SUM_YM) 단위로 정리한 집계 자료로, 개인 일반·모범·대형택시 면허 대수와 법인 면허 대수, 법인업체 수를 담는다. 교통정책 담당자나 분석가가 "우리 시의 개인택시와 법인택시 비율은 이웃 시군과 비교해 어떤가"처럼 지역별 택시 공급 구조를 비교하거나 면허 총량을 점검할 때 쓴다. 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명(SIGUN_NM)이나 시군코드를 이름·코드 매핑으로 맞추거나 경기도의 같은 코드 체계를 쓰는 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별로 발급된 택시 면허 현황을 집계한 자료로, 개인면허대수, 개인모범택시, 개인대형택시, 법인면허대수 및 법인업체 수 등의 항목으로 구성되어 있습니다. 집계년월 단위로 기록되며, 일반택시 외에도 모범택시 및 대형택시 등 다양한 형태의 택시면허 발급 실적을 확인할 수 있어 지역별 택시 운영 구조를 파악하는 데 유용합니다. 데이터는 교통정책 수립, 대중교통 수요 분석, 개인·법인택시 비율 비교, 면허총량 관리 등 다양한 행정 및 연구 목적에 활용될 수 있으며, 연간 주기로 갱신되며 Open API 방식으로 제공되어 정기적 데이터 접근이 가능합니다.
