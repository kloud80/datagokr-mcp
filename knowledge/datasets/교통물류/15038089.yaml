description_portal: 경기도 수원시 가로등이 설치된 위치(주소, 위경도), 설치년도, 설치형태, 관리기관, 관리부서, 관리기관 연락처,  데이터 기준일자를 포함합니다. 밤길, 골목, 공원 등 가로등 설치 위치를 미리 확인 할 수 있어 어두운 길을 피하거나 안전한 이동 경로를 선택하는데에 활용할 수 있습니다. 특정 지역의 가로등이 고장났거나, 불빛이 부족한 경우 위치 정보를 기반으로 요청할 수 있습니다. 설치 위치를 누구나 알 수 있어 주민, 단체가 협력하여 유지, 보수, 점검을 효율적으로 할 수 있습니다. 범죄 예방과 사고 방지 등 안전 의식이 자연스럽게 확산시킬 수 있습니다.
