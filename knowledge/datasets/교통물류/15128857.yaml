summary_user: 경기도 관할 지방도의 노선별 행정 정보를 노선 한 줄 단위로 담은 도로대장 목록으로, 노선번호·노선명·노선종류·노선지정일·접도구역지정일·시점·종점·주요 통과지역을 기록한다. 도로 인허가 담당자나 교통계획 분석가가 '이 지방도는 언제 지정됐고 어디서 어디까지 어느 지역을 지나는가', '접도구역은 언제 지정됐는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id) 같은 공간 기준 데이터와는 노선번호(route_no)나 노선명을 매핑해 이어야 하고, 같은 기관의 다른 도로 데이터와도 이름·코드로만 연결된다.
description_portal: 이 데이터는 경기도 관할의 지방도에 대한 도로노선 정보를 제공하며, 노선번호, 노선명, 노선종류, 노선지정일, 접도구역지정일, 시점, 종점, 주요 통과지역 등의 항목으로 구성되어 있습니다. 각 도로의 시점과 종점 위치, 경유하는 주요 지역을 포함해 지방도 지정일과 접도구역 지정일 등 행정적 정보를 포함하고 있어, 도로 관련 인허가, 도로정책 수립, 교통계획 수립 등 다양한 행정 및 연구 목적에 활용될 수 있습니다. 또한, 경기도도로대장전산화시스템을 통해 수집된 이 데이터는 도로관리 및 안전정책 수립의 기초자료로 활용될 수 있으며, 교통시설 확충이나 노선별 수요 분석 등에 사용될 수 있습니다.
