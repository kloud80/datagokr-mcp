summary_user: 경기도 시군별 복지택시의 분기별 운행 현황을 기준년도·분기·시군 단위 집계로 담으며, 운행대수·운행횟수·운행마을수를 기록한다. 교통복지 담당자나 분석가가 "어느 시군이 교통소외 마을에 복지택시를 많이 투입하고, 분기별 운행횟수는 어떻게 변하는가"를 비교하는 데 쓴다. 전역 조인 키는 없고, 시군명(sigun_nm)과 연도·분기를 기준으로 시군별 인구·고령화율, 버스 노선·정류장 자료에 이름 매핑으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 복지택시의 분기별 운행 현황을 정리한 자료로, 기준년도, 기준분기, 시군명, 운행대수, 운행횟수, 운행마을수 항목으로 구성되어 있습니다. 복지택시는 교통 취약 지역의 주민 이동권 보장을 위해 운영되며, 특히 고령자, 교통소외 마을 등 대중교통 접근성이 낮은 지역을 중심으로 운행됩니다. 운행대수와 운행마을 수는 복지서비스 수혜 범위와 효율성을 판단할 수 있는 지표로 활용되며, 지역별 교통복지 수요 예측, 예산 배분, 맞춤형 이동권 정책 수립 등에 활용됩니다. 이 데이터는 교통복지의 실현과 교통 불평등 해소를 위한 기반자료로 중요한 역할을 합니다.
