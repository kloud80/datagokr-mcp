summary_user: 경기도가 시행하는 도로 유지보수 사업을 사업 단위로 정리한 집계 자료로, 집계년도·사업 구분(포장도로·터널·교량 등)·사업명·사업기간·사업량(km)·예산액(백만원)을 담는다. 정책 분석가나 도의회·언론이 '경기도는 연도별로 어떤 유형의 도로 시설 보수에 얼마의 예산을 배정했나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 집계년도나 구분명(DIV_NM) 같은 이름을 맞춰 연결하거나 같은 기관의 자료끼리만 묶어 쓴다.
description_portal: '이 데이터는 경기도에서 시행 중인 도로 유지보수 사업의 전반적인 현황을 담고 있으며, 사업명, 사업기간, 사업량(단위: km), 예산액(단위: 백만원) 등의 항목으로 구성되어 있습니다. 포장도로, 터널, 교량 등의 시설물 유지·보수를 통해 도로의 안전성과 편의성을 확보하기 위한 행정 및 기술적 노력을 반영한 자료입니다. 연도별로 구분된 집계년도와 각 사업의 구분명(DIV_NM)을 통해 도로 유형별 유지관리 현황을 확인할 수 있으며, 지역별 도로 인프라 상태 파악, 예산집행 분석, 안전점검 계획 수립, 중장기 도로정비 계획 수립 등의 정책 자료로 활용될 수 있습니다. 데이터는 수시로 갱신되며, Open API를 통해 실시간 연계가 가능합니다.'
