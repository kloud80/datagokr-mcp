description_portal: '영덕군 내 일반화물자동차운송사업 현황에 대한 데이터로 차량대수, 운영방법, 현재 운영여부 등의 항목을 제공합니다.화물자동차 운송사업은 물품을 도로를 통해 운송하는 사업으로, 우리나라 물류산업의 핵심을 이루는 분야입니다.화물자동차 운송사업이란, 일정한 대가를 받고 화물자동차를 이용하여 다른 사람의 물건을 운송하는 사업을 말합니다. 「화물자동차 운수사업법」 제2조에 규정되어 있으며, 국토교통부 또는 지자체의 허가·등록을 받아야 운영할 수 있습니다.일반화물자동차 운송사업 : 불특정 다수 화주를 대상으로 운송계약을 체결하고 영업하는 전문 운송사업자 (보통 법인 또는 개인 사업자)'
