summary_user: 광진구 내 공영·민영 주차장을 주차장 1곳당 한 행으로 모은 파일로, 주소(지번·도로명), 일반인 이용 여부, 기본·추가·1일·월정기 요금, 평일·토요일·공휴일 운영시간, 계획 주차면수, 장애인·경차·여성우선 전용구획, 할인정책을 담는다. 광진구 주민이나 방문객이 '이 동네에서 일반인이 쓸 수 있는 무료 또는 월정기 주차장이 어디인가'를 찾거나, 분석가가 법정동별 주차면 공급을 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 구코드·법정동코드(bemd_code)나 주소·주차장명으로 전국주차장정보표준데이터·실시간 주차 API 등과 맞춰 이어 써야 한다.
description_portal: 서울특별시 광진구_공영 민영 주차장 통합 데이터는 광진구 내 공영 및 민영 주차장의 최신 현황을 통합하여 제공하는 자료로, 지역 내 주차 인프라 관리와 교통 편의성 향상을 위한 기초 데이터를 담고 있습니다. 본 데이터는 2022년 기업매칭 지원사업의 결과물로 제작되었으며, 공영과 민영 주차장을 함께 수록하여 주차 수급 현황을 종합적으로 파악할 수 있도록 지원합니다. 주요 항목에는 주차장명, 위치(도로명주소), 주차 가능 대수, 운영 형태, 요금제, 운영 시간 등의 정보가 포함될 수 있으며, 이를 통해 지역 주민과 방문객의 주차 편의성을 높이고 효율적인 공간 활용을 가능하게 합니다. 이 데이터는 주차 정책 수립, 교통 혼잡 완화, GIS 기반 지도 서비스 개발, 스마트 주차 안내 시스템 구축 등 다양한 행정 및 서비스 분야에서 활용될 수 있으며, 광진구의 교통 인프라 개선과 도시 계획 수립의 중요한 참고 자료로 사용됩니다
