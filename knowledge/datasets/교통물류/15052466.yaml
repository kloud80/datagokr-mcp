summary_user: 서울시 도로굴착 예정지를 한 지점씩 일련번호, 입력년도, 위경도 좌표(WGS1984)로 담은 건별 공간정보이며, 범위는 서울특별시 한 곳이고 개별 위치 단위다. 시민이나 사업자가 '우리 동네나 사업장 주변에 도로굴착 공사가 예정된 곳이 있는가'를 지도에서 확인하거나, 분석가가 굴착 공사 이벤트의 분포를 살피는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 좌표(위도·경도)를 이용한 공간 매칭이나 같은 기관(서울시) 자료와의 이름 대조로만 이어 쓴다.
description_portal: '해당 데이터는 서울시 도로굴착 예정지 위치정보 (좌표계: WGS1984) 데이터입니다. 서울시 도로굴착 예정지의 공간정보로 예정지 일련번호, 입력년도, 좌표(위경도)등의 정보를 제공하는 서비스 입니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2842)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
