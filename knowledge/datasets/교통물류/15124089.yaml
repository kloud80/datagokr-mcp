summary_user: 경기도 BMS(버스운행관리시스템) 등록 버스업체가 운영·관리하는 차고지와 부대시설을 시설·변경 이력 단위로 담은 건별 원천 자료로, 시설 유형·전체 규모·수용 가능 대수·사용 면적·계약 기간·신고인가 구분·처리 진행 상태를 포함한다. 교통행정 담당자나 분석가가 "특정 버스업체의 차고지 수용 대수와 계약 기간이 언제 어떻게 바뀌었나"를 추적하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 업체아이디·시설아이디로 같은 경기도 BMS 자료와 맞추거나 법정동코드(legaldong_cd)·주소로 매핑해 이어 쓴다.
description_portal: 이 데이터는 경기도 관할 BMS(버스운행관리시스템) 등록업체들이 운영 중이거나 관리하는 차고지 및 부대시설의 이력 정보를 담고 있는 자료입니다. 주요 항목으로는 ‘시설아이디’, ‘이력아이디’, ‘업체아이디’ 등을 통해 시설 및 업체의 고유 식별이 가능하며, ‘시설코드’, ‘차고지시설유형’, ‘전체규모’, ‘수용가능수’ 등을 통해 시설의 물리적 규모와 용도 정보를 파악할 수 있습니다. 또한 ‘신고인가구분명’, ‘처리진행코드명’, ‘업무코드명’은 시설의 행정적 상태와 관련된 절차 진행 상황을 설명합니다. 이 데이터는 교통시설 인프라 관리, 노선버스 운영 효율성 제고, 시설 변경 이력 추적 등 다양한 교통행정 목적에 활용될 수 있습니다.
