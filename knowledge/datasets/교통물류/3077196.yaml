description_portal: 급속한 정보통신 기술 발전과 시민들의 이동 중 인터넷 이용 수요 증가에 따라, 부산교통공사는 도시철도 역사의 대합실과 승강장 등에 공공 와이파이 설치를 확대하고 있습니다.본 데이터는 2026년  4월 기준으로 도시철도 역사별 와이파이 설치 현황을 수집·정리한 것으로, 통신사별 설치 수량, 설치 위치(대합실/승강장 등), 역사별 정보 등을 포함합니다.본 데이터를 기반으로 향후 도시철도 내 무선 인프라 확충 및 디지털 포용 정책 수립 등에 활용할 수 있고,도시철도 내 와이파이 접근성 평가, 노선·역사별 통신 인프라 격차 분석, 디지털 소외 지역 식별, 스마트 역사 구축 우선순위 도출 등의 다양한 분석이 가능합니다.특히, 민간 통신사 및 연구기관은 통신 품질 개선, 공공 무선망 최적화 등에 활용할 수 있습니다.* 2025년부터는 대합실과 승강장에 설치된 와이파이 장비 합계를 나타내는  "수량" 항목을 제외하고 개방합니다.
