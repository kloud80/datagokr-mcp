summary_user: 김해시 자전거 주차장을 설치장소 한 곳당 한 행으로 담은 원천 목록으로, 행정동·도로명/지번주소·위경도와 비가림형·일반형·입체(캐비닛)별 거치대 수량과 주차가능대수, 노상·노외·부설 구분, 공기주입기 비치 여부를 담는다. 시민이 "우리 동네 근처 비 맞지 않는 자전거 주차장과 공기주입기가 어디 있나"를 찾거나, 분석가가 행정동별 자전거 주차 공급량을 비교하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 주소로 다른 김해시 자료와 맞추거나, 위도·경도로 공공자전거 대여소·자전거도로 노선 같은 공간 데이터와 겹쳐 쓴다.
