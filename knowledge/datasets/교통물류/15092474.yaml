description_portal: '데이터 개요「정치장별 항공기 등록 현황」은 대한민국 내 항공기의 등록지를 기준으로 정치장(행정구역 또는 위치)을 분류하고, 항공기 종류별 등록 대수를 제공하는 데이터입니다.항공기는 비행기, 회전익항공기, 비행선, 활공기로 구분되며, 각 정치장(예: 시·군·구 또는 세부 주소 단위)마다 등록된 항공기 대수를 확인할 수 있습니다.데이터 제공 항목정치장항공기 등록 주소 기준 정치장(행정구역 또는 이착륙장 위치 등)비행기고정익 항공기로 등록된 항공기 수회전익항공기헬리콥터 등 회전익 항공기 등록 대수비행선기구식 비행체(비행선) 등록 대수활공기동력 없이 활공하는 항공기 등록 대수계해당 정치장에서 등록된 전체 항공기 총합활용 안내지역별 항공기 보유 현황 분석 : 시·도 또는 세부 주소 기준으로 항공기 운영 현황을 파악하여 공항 인프라 수요 분석에 활용 가능항공안전 및 감항관리 정책 수립 기초자료 : 특정 지역 내 등록 항공기 수에 따라 정비소, 관제시설, 감항관리 기관 배치 기준 마련지자체 항공산업 기반 조사 : 항공관광, 지역 특화 항공산업 개발 등에 필요한 기본 통계자료로 활용데이터 해석 시 유의사항실제 항공기 운영지와 등록지는 일치하지 않을 수 있음데이터는 일정 주기로 갱신되므로 최신성을 확인하고 활용 필요'
