summary_user: 서울교통공사가 공고한 입찰 건을 한 건씩 담은 목록 파일로, 공고명·계약방법(낙찰자 결정방법)·공고일자로 구성되며 약 71KB 규모의 CSV로 받는다. 서울교통공사 입찰에 참여하려는 사업자가 어떤 계약이 어떤 방식으로 언제 공고됐는지 확인하고, 분석가가 계약방법별 공고 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 나라장터(G2B)에서 공고명으로 검색해 세부 공고와 이어 보거나 같은 기관의 다른 데이터와 기관명으로만 연결한다.
