summary_user: 국가교통정보센터가 관리하는 국도 구간을 그룹 단위로 묶은 기본 정보로, 국도 그룹 ID·국도 ID·방향 코드·그룹 내 순서와 시작·종료 노드명, 구간명, 등록·수정 일시를 담으며 범위는 전국이고 좌표가 없는 비공간 데이터다. 교통정보 분석가나 서비스 개발자가 "특정 국도의 어느 구간들이 어떤 순서로 한 그룹을 이루는가"를 확인해 국도 소통정보를 구간 단위로 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국도·노드 이름 매핑이나 같은 기관 코드로만 연결하며, 표준노드링크(link_id·node_id)와 직접 키로 이어지지 않는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
