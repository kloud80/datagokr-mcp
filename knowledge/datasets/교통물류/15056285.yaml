summary_user: 제주시 자전거도로를 노선 단위로 정리한 파일로, 노선명·구간 기점과 종점·총연장(km)·도로폭과 유형별 겸용도로폭·자전거도로 종류(우선도로·전용도로·전용차로·자전거보행자 겸용도로)를 담는다(CSV 약 18KB). 제주시에서 자전거 전용 시설 구간과 보행자와 함께 쓰는 구간이 각각 어디에 얼마나 되는지 확인하려는 주민·자전거 이용자·교통 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·구간 지명으로 맞추거나 같은 제주시 데이터끼리 연결해야 한다.
description_portal: 이 데이터는 제주특별자치도 제주시 소재 자전거도로의 조성 및 운영 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 도시재생과이며, 지역 내 자전거 교통 기반시설의 분포와 노선별 설치 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다.데이터에는 제주시 내 자전거도로의 노선별 정보가 수록되어 있으며, 주요 항목은 노선명, 구간기점, 구간종점, 총연장, 자전거도로폭, 겸용도로폭(분리형-자전거), 겸용도로폭(분리형-보도), 겸용도로폭(비분리형), 자전거도로종류로 이루어져 있습니다. 노선명 항목을 통해 각 자전거도로의 명칭을 확인할 수 있고, 구간기점과 구간종점 항목을 통해 자전거도로가 시작되는 지점과 종료되는 지점을 파악할 수 있습니다. 총연장 항목은 각 노선의 전체 길이를 나타내어 자전거도로의 규모와 구간별 조성 수준을 확인하는 데 활용할 수 있습니다.또한 자전거도로폭과 각 유형별 겸용도로폭 항목을 통해 도로의 폭원과 조성 형태를 확인할 수 있으며, 이를 바탕으로 자전거 통행 여건과 보행자·자전거의 공간 분리 여부를 함께 분석할 수 있습니다. 특히 자전거도로종류 항목에는 자전거 우선도로, 자전거 전용도로, 자전거 전용차로, 자전거보행자 겸용도로가 포함되어 있어, 노선별 시설 특성과 이용 방식의 차이를 구분하여 파악할 수 있습니다. 이를 통해 전용 시설 중심의 구간과 보행자와 공동 이용하는 구간을 비교하고, 자전거 이용 환경과 안전성 수준을 보다 구체적으로 살펴볼 수 있습니다.
