summary_user: 한국철도공사가 운영하는 수도권 노선 역사의 물품보관함을 역·위치별 한 행으로 담은 원천 목록 파일로, 노선명·역명·지상지하 구분·층·상세위치·보관함 크기·시설 수·이용요금이 들어 있다. 여행객이나 출퇴근 이용자가 '이 역에 큰 짐을 맡길 보관함이 있는지, 몇 층 어디에 있고 요금은 얼마인지'를 확인하거나, 분석가가 노선별 보관함 배치 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 역 정보 데이터와는 노선명·역명을 이름으로 맞춰 붙여야 한다.
