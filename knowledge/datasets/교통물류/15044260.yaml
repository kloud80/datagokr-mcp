summary_user: 서울교통공사가 운영하는 역사의 에스컬레이터를 한 대씩 담은 파일로, 호선·역명·관리번호(호기)·상하행 구분·근접 출입구 번호·시작층과 종료층 위치·형폭·승강기 일련번호를 기록한다. 교통약자나 이동 경로 안내 서비스 개발자가 '이 역 몇 번 출입구 근처에 올라가는 에스컬레이터가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역·출입구 데이터와는 호선과 역명을 이름 매핑하거나 같은 기관 데이터끼리 연결해야 한다.
