summary_user: 한국교통안전공단이 시행하는 교통안전관리자 자격시험의 시험장 목록을 시험장 한 곳당 한 행으로 담은 작은 파일(csv 약 1.2KB)로, 지사코드·지사이름·시험장소이름·주소·좌석수·사용여부를 전국 범위로 담는다. 교통안전관리자 시험을 준비하는 수험생이 가까운 시험장이 어디이고 좌석이 몇 석인지 확인하거나, 분석가가 지역별 시험장 배치와 수용 규모를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩해 행정구역 단위로 묶거나 공단 지사코드·지사이름으로 같은 기관의 다른 데이터와 맞춰 잇는다.
description_portal: 교통안전법 제53조를 근거로 하여 교통수단의 운행, 운항, 항행 또는 교통시설의 운영, 관리와 관련된 기술적인 사항을 점검, 관리하기 위하여 시행하고 있는 교통안전관리자 자격 제도와 관련하여, 한국교통안전공단에서 시행하고 있는 교통안전관리자 자격시험의 장소 등에 대한 데이터(지사코드,  지사이름, 시험장소이름, 주소, 좌석수, 사용여부 등)를 제공합니다. 전국 14개 시험장(서울, 부산, 경기남부, 대구경북, 광주전남, 대전세종충남, 강원, 전북, 인천, 충북, 제주, 울산, 경남, 화성드론자격시험센터 등) ※ 제공되는 데이터는 한국교통안전공단에서 별도 제공되는 데이터와 차이가 있을 수도 있음을 인지하여 주시기 바랍니다.
