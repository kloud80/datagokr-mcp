summary_user: 수도권 4호선 도시광역철도역에 설치된 휠체어리프트를 한 대씩 기록한 시설 목록으로, 운영기관·선명·역명과 리프트의 관리번호·출입구번호·상세위치·길이·폭·시작층·종료층을 담으며 파일 크기가 492바이트에 불과한 소규모 자료다. 휠체어 이용자나 교통약자 이동지원 분석가가 '4호선 어느 역 몇 번 출입구에 휠체어리프트가 있고 몇 층에서 몇 층까지 연결되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 시설·승강기 데이터와는 역명·선명 같은 이름 매칭이나 같은 기관 자료끼리만 연결한다.
