summary_user: 부산광역시 동래구의 도로명주소를 건물 단위로 한 줄씩 담은 파일로, 2025년 8월 18일 기준 시도·구군·읍면동, 지번(본번·부번), 도로명과 건물번호(주·부), 건물명, 우편코드를 담는다. 동래구 안 특정 지번이 어떤 도로명주소·우편번호에 해당하는지 확인하거나, 주민·사업자 주소 목록을 도로명주소로 정비하려는 분석가가 쓴다. 전역 조인 키는 실측에서 확인되지 않아 읍면동명·지번·도로명 같은 이름 매칭이나 행정동코드 필드로 다른 행정동 단위 자료와 이어 쓴다.
description_portal: 도로명주소는 도로명과 건물번호로 구성된 주소정보체계로, 차량 및 보행자의 위치(길, 건물) 찾기에 편리성을 고려하여 도로마다 도로명을 부여하고 그 도로구간을 따라 좌·우 건물마다 왼쪽에는 홀수, 오른쪽에는 짝수 번호를 체계적 과학적으로 부여하는 제도로, 2011. 7. 29. 전국 일제고시를 통해 법정주소로 확정, 도로명주소 본격 사용, 2013년 말까지 지번주소와 도로명주소를 병행 사용을 거쳐 2014년부터는 도로명주소를 법정주소로 전면 사용하게 되었으며, 해당 데이터는 2025년 8월 18일 기준 부산광역시 동래구 도로명주소에 대한 데이터로 시도명, 시군구명, 읍면동명, 번지, 도로명주소(도로명, 건물본번, 건물부번), 건물명, 우편코드 항목정보를 제공합니다.
