summary_user: 구리시에서 허가를 받고 구리시에 주사무소를 둔 국제물류주선업자를 업체 한 곳당 한 행으로 담은 명부 파일입니다. 상호·등록번호·법인등록번호·허가일·대표자·주소·연락처를 담고 있으며, 파일 크기는 503바이트로 소수 업체만 담겨 있습니다. 화주나 사업자가 거래하려는 구리시 소재 포워딩 업체가 실제로 허가받은 국제물류주선업자인지 확인하는 데 쓰고, 법인등록번호(corp_rgst_no)를 키로 다른 기업·사업자 데이터와 연결하며, 화물운송 허가 여부는 전국화물자동차운송사업자표준데이터를 기준으로 맞춰 본다.
