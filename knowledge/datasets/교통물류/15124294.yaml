description_portal: '영주시 현재 1톤트럭폐차(말소)정보에 대한 설명입니다.경상북도 영주시의 1톤 화물 차량의 폐차 정보를 자동차등록 정보의 통계자료를 기반으로 작성되었습니다.  시군구명 : 자동차등록증 상의 본거지 주소최초등록일 : 자동차등록증 상의 최초등록일폐차일 : 폐차 수리일 차종 : 차의 종류주행거리 : 자동차등록증 상의 총 주행거리폐차사유 : 자진말소 에 대한 공공 데이터입니다.1톤트럭 폐차정보(자진말소)를 활용하여 교통 인프라의 효율적인 운영을 기대할 수 있습니다.2025년 8월 기준 자료입니다. 향후 자료내용 변경 시 추가 업데이트 하도록 하겠습니다.'
