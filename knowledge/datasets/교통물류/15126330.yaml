summary_user: 서울시 공공자전거 따릉이의 대여·반납 이력을 대여건별로 담은 원천 데이터로, 대여·반납 시각과 대여소, 이용시간(USE_MIN), 이용거리, 자전거 구분(새싹/일반), 이용자 구분을 포함한다. 분석가나 정책 담당자가 어느 대여소 사이에서 이용이 많고 이용 시간·거리는 어떤지 파악하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 대여소 ID(RENT_STATION_ID)와 대여소명을 이름·코드 매핑하거나 같은 기관 코드로만 대여소 정보 등과 이어 쓴다.
description_portal: 서울특별시 공공자전거 따릉이  대여이력 정보입니다.공공자전거 대여이력 데이터는 사용자가 공공자전거를 실제로 대여하고 반납한 이력(기록)을 저장한 이용 기반 데이터입니다.서울시에서는 ‘따릉이’를 중심으로 이 데이터를 수집하며, 교통 분석, 정책 기획, 인프라 개선, 사용자 패턴 파악 등에 다양하게 활용됩니다.대여건별로 자전거 구분 정보 포함(새싹/일반)하여 대여/반납 정보 등을 상세히 확인 하실 수 있습니다.또한, 이용자 종류에 따라 내국인/외국인 데이터를 분류하여 확인할 수 있으며각 데이터 들의 이용거리 및 이용시간 등도 확인 할 수 있습니다.
