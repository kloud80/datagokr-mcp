summary_user: 사업용차량 운행기록의 11대 위험운전행동 발생과 교통사고 확정통계의 상관성을 분석해, 국가표준노드링크 기준 도로 링크마다 도로안전등급과 도로명·도로유형·차선수·도로길이·최고제한속도를 담은 전국 단위 분석 결과 파일이다. 운수업체나 교통안전 분석가가 "우리 화물·버스 노선이 지나는 시군구 도로 중 안전등급이 낮은 구간은 어디인가"를 확인하고 운행 경로나 안전관리 대상을 정하는 데 쓴다. 전역 조인 키는 없고, 링크아이디로 국가표준노드링크 도로망과 맞추거나 시도명·시군구명을 이름으로 매핑해 행정구역별 교통사고·교통안전 통계와 잇는다.
limits: 실측 컬럼에서 법정동코드 같은 전역 조인 키가 확인되지 않아 다른 데이터와는 링크아이디나 시도·시군구 이름 매칭으로만 연결된다. 시군구까지가 행정 단위이며, 위험운전행동 건수나 사고 건수 원자료가 아니라 분석된 등급만 담는다.
