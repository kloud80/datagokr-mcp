description_portal: 한국교통안전공단에서 제공하는 정보입니다. 한국교통안전공단에서 수집하는 사업용차량의 운행기록정보와 교통사고정보(확정통계정보)를 활용하여 분석된 정보입니다.각 링크별(국가표준노드링크 기준) 사업용차량의 운행기록정보 중 11대 위험운전행동발생건수와 교통사고와의 상관성을 분석하여 상관관계가 높은 위험운전행동 발생에 대한 정보를 제공합니다.분석한 결과는 링크별/시도별/시군구별 도로안전등급과 링크정보를 제공합니다. 시도/시군구는 행정안전부 기준으로 제공합니다.
