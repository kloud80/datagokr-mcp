description_portal: 본 데이터는 한국도로교통공단이 추진하는 교통안전사회교육의 일환으로 운영되는 학부모 명예교사 제도 계획 정보이다. 파일은 어머니 명예교사의 임명·재위촉·해임 등 인사 구분과 지부코드, 교사관리번호로 구성되며, 지역별 운영 규모와 배치 현황을 파악하는 데 유용하다. 개인 식별정보는 포함하지 않고 관리번호를 통해 식별만 가능하다. 사회교육 교육실적, 대상별 교육인원 현황 등 다른 공공데이터와 결합하면 지부별 인력 수급, 교육 수요 등을 분석할 수 있다. 또한 신규 위촉 비율, 해임 추세 등 운영지표 산출과 예산·정책 수립의 근거자료로 활용된다. 자료는 계획 기준으로 편성되어 상세 교육일정·장소·강의내용은 별도 문서를 참조해야 한다.
