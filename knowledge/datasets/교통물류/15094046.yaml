description_portal: '본 데이터는 건설기계관리법에 따른 경기도 평택시에 등록된 건설기계 현황에 대한 데이터로 건설기계별 관용, 자가용, 영업용, 총등록, 데이터기준일자 등의 항목을 제공합니다.기종별로 자가용, 영업용, 관용으로 구분하여 등록 대수를 파악할 수 있는 자료입니다.해당 현황을 파악하여 전국 건설기계 관련 통계자료, 효율적인 관리와 운영 등에 참고자료로 활용 가능합니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 차량등록사업소(031-8024-5535)'
