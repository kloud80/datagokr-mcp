summary_user: 인천도시철도 2호선 27개 역의 역별·일자별 승차·하차·이용인원을 담은 건별 일 단위 파일로, 포털 설명상 기간은 2024년 7월 1일부터 2025년 6월 30일까지다. 상권 분석가나 사업자가 '검단·서구 쪽 어느 역 주변에 평일·주말 유동인구가 많은가'를 판단할 때 역 이용량을 유동인구 대체 지표로 쓴다. 실측 컬럼에 전역 조인 키(역 코드 등)가 없어 다른 노선 승하차나 역 위치 데이터와는 역명 매핑으로만 이어 쓸 수 있다.
