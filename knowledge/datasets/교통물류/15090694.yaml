summary_user: 인천광역시 서구(서해구) 안에 있는 가로등 분전함을 한 건씩 담은 파일로, 도로조명 관리번호·소재지 주소·설치개수·설치년도·관리기관명과 전화번호를 담는다. 주민이 집 근처 가로등이 꺼졌을 때 어느 분전함 관리번호로 어느 기관에 민원을 넣을지 확인하거나, 분석가가 구내 분전함 분포와 설치 연식을 살펴보는 데 쓴다. 전역 조인 키는 없어서 소재지 주소를 지오코딩하거나 행정동 이름으로 맞춰 다른 도로 시설물·민원 데이터와 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 위치한 가로등 분전함을 분석하여 정리한 데이터입니다. 본 공공데이터는 인천광역시 서구 내 가로등 분전함의 도로조명 관리번호, 소재지 주소, 관리기관명, 관리기관 전화번호 등에 대한 정보가 포함되어 있습니다. 본 공공데이터를 통하여 지역 주민들은 가로등 분전함 위치 및 분포를 손쉽게 파악할 수 있습니다. 이를 통하여 주민들은 조명 관련 민원을 보다 정확히 제기 할 수 있어 행정소통에도 도움이 될수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
