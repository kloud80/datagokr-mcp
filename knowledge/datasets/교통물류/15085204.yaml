description_portal: '○ 통계개요* 통계명 : 차량통행속도(구별/월별)* 통계종류 : 월별, 지역별 차량통행속도 현황을 제공하는 일반·조사통계(승인 20109호)* 작성목적 : 서울시 전체도로에 대한 일반차량에 대한 통행속도를 조사하여 도로의 건설,유지관리 및 도로운영에 필요한 기본자료와 각종 연구에 필요한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 서울특별시 교통정보센터, 영업용택시 위치정보(GPS)를 통한 통행속도수집* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시, 자치구별내용 - 지역별(권역별, 구별) 월별 통행속도 현황○ 용어설명* 통행속도(travel speed) : 어느 한 구간을 이동한 속도(공간평균속도:space mean speed)* 시간평균속도 : 어느 한 지점을 통과하는 각 차량들의 속도를 산술 평균한 속도○ 기 타* 속도조사의 시간대 구분 - 전일 : 06:00~ 22:00,오전 : 07:00~09:00 낮 : 12:00~14:00, 오후 : 17:00~19:00* 추가 자료 : TOPIS홈페이지(http://topis.seoul.go.kr/)* 2011년 서울시 차량통행속도 자료수집 및 통계작성 대행기관 폐업으로2013년부터 서울시 자체속도로 생성* 2013년 서울시 자체 속도 생성시부터 분석대상도로 연장(1,229km → 1429.7km) 변경및 속도 생성 방식 변경○ 출 처 : 서울특별시 교통정보센터「차량통행속도 보고서」'
