description_portal: 위 데이터는 서울교통공사에서 보유 및 사용중인 업무용 차량(승용차, 승합차, 화물차)정보 입니다.해당 데이터는 차량종류, 제작회사, 차량 모델명, 배기량(cc), 사용연료, 승차가능인원수(명), 최대화물적재하중(kg), 변속기종류, 보유부서명, 사용여부( Y:사용중) 항목으로 구성되어있습니다. 2026년 4월 기준 서울교통공사에서 보유중인 업무용 차량은 총 102대입니다. (차량 수량은 각 부서의 구매, 임차 및 불용 결과에 의해 달라질 수 있습니다.)2026년 이후부터 신규로 구매하는 차량은 모두 친환경 차량이어야 하며, 서울교통공사에서는 온실가스 배출 저감 및 정부의 친환경 정책에 부합하기 위해 최선을 다하고 있습니다. 해당 데이터의 변동이 있을 경우 수시 업데이트를 통해 공사의 업무용 차량 데이터를 빠르고 정확하게 공유하겠습니다.
