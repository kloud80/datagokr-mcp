summary_user: "대전도시철도 1호선 역별로 조회한 날짜 하루의 승차·하차 인원(승하차 구분 entryFlag)을 시간대별(0시 이후, 05시~23시 1시간 단위)과 합계로 담은 집계 데이터다. 상권 분석가가 '어느 역에서 출근 시간대 하차 인원이 가장 많은가'처럼 역 주변 유동인구를 대신 가늠하는 데 쓴다. 전역 공통 조인 키는 없고, 역번호(stationNo, 예: 101번 판암역)를 별첨 역명현황으로 역명에 매핑한 뒤 역 위치나 다른 교통 데이터와 이름 기준으로 잇는다."
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사의 역별 승하차 인원 정보를 제공하는 데이터입니다.조회 날짜를 입력하면 해당일의 역별 상행·하행 방향에 따른 승차 인원 및 하차 인원을 상세하게 확인할 수 있습니다.본 데이터를 활용하면 역별·방향별 이용객 현황 및 시기별 수요 변화 추이를 파악할 수 있으며, 교통 수요 예측 및 운영 효율화를 위한 정책 수립 기초 자료 등 다양한 분야에서 활용이 가능합니다.역별 승하차 인원 데이터를 투명하게 공개함으로써 대전도시철도 이용 현황에 대한 시민의 정보 접근성 향상과 합리적인 대중교통 운영 계획 수립에 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
