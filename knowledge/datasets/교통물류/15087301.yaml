description_portal: 드론을 활용하여 경영을 하려는 자는 항공사업법 제48조(초경량비행장치사용사업의 등록)에 따라 등록을 해야하고, 한국교통안전공단은 같은법 제75조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.사업등록 시 촬영,측량,관측,점검,조종교육,농업지원,기타의 항목을 선택할 수 있으며, 조종교육으로 등록된 사용사업체가 드론교육을 수행할 수 있다.현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있고, 사업자등록번호 기준으로 사용사업체의 이력을 관리하고 있다.그리고 교육생 관리를 위해 드론 비행경력시스템(https://www.kotsa.or.kr/dfms)을 통해 교관, 교육생을 관리하고 있다.해당 자료는 서울, 경기도, 경상도 등 드론 교육기관(전문 및 사설교육기관)의 교육생 수에 대한 정보를 제공하는 것으로 교육생 수와 관련된 통계 자료로 활용이 가능하다.
