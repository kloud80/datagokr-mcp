description_portal: 이 데이터는 해양수산부에서 LNG 및 메탄올 등 친환경 선박연료의 공급 실증을 위해 입출항하는 선박 현황을 관리할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 LNG 또는 메탄올과 같은 친환경 연료를 공급하거나 이를 수취하기 위해 입출항하며 항만 사용료 감면 혜택이 적용되는 선박의 목록으로 구성되어 있습니다. 선박의 호출부호, 총톤수, LNG 또는 메탄올연료 사용여부 정보를 포함하고 있습니다.  본 데이터는 항만 운영기관이 친환경 연료 선박의 입출항 현황을 파악하여 항만 사용료 감면 정책의 실효성 분석에 활용할 수 있으며, 해상 연료 공급 네트워크 구축 및 관련 정책 수립의 기초 자료로 사용할 수 있습니다.
