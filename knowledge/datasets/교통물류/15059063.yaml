summary_user: 경기도 31개 시군의 일반화물·이사화물 운송주선업체 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·업체유형·자본금·면허 유효기간·주소·위경도가 들어 있다. 사업자나 이용자가 "이 이사·화물 주선업체가 경기도에서 등록돼 영업 중인가"를 확인하거나, 분석가가 시군별 주선업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드·이름(SIGUN_CD)이나 주소·업체명 매칭으로만 잇고, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 이 데이터는 경기도 내에서 일반화물 및 이사화물의 운송을 주선하는 운송주선업체의 인허가 현황을 제공하는 자료입니다. 주요 항목으로는 사업장명, 인허가일자, 등록일자, 영업상태, 소재지 주소, 업체유형, 소유형태, 자본금, 면허 유효기간, 지정정비업종명, 위경도 좌표 등이 포함되며, 경기도 31개 시군을 대상으로 합니다. 해당 데이터는 화물운송업체의 지역 분포, 등록현황, 운송면허 관리 등에 활용 가능하며, 물류산업 분석 및 정책 수립을 위한 기초자료로 유용합니다. 데이터는 Open API로 제공되며, 2018년 9월 이후 갱신이 중단된 점을 고려해 활용 시 참고가 필요합니다.
