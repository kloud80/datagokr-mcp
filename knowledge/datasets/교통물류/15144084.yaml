description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야에 해당하는 환경관리 정보 데이터로, 도시철도 역사 내 폐의약품 수거함의 설치 현황을 제공합니다. 대구교통공사는 시민 건강 보호와 환경오염 예방을 위해 도시철도 역사 내에 폐의약품 수거함을 설치·운영하고 있으며, 가정에서 사용 후 남은 의약품이 일반 생활폐기물로 배출되어 토양 및 수질오염을 유발하는 것을 방지하고 안전하게 처리할 수 있도록 지원하고 있습니다. 본 자료는 폐의약품 수거함이 설치된 역사명, 설치 층수, 상세 위치 등 이용에 필요한 정보를 포함하고 있으며, 시민이 가까운 역사에서 편리하게 폐의약품을 배출할 수 있도록 활용할 수 있습니다. 또한 수거된 폐의약품은 관할 보건소를 통해 안전하게 처리되며, 본 데이터는 자원순환 촉진, 환경오염 예방, 시민 참여형 환경보호 활동 지원 및 지속가능한 도시환경 조성을 위한 기초자료로 활용될 수 있습니다. 데이터는 수거함 설치 및 운영 현황 변경 시 갱신됩니다.'
