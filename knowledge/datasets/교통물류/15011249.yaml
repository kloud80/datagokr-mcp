summary_user: 경기도 안에서 지적측량업을 하는 사업체를 업체 한 곳당 한 행으로 담은 현황으로, 시군명, 상호, 대표자, 사업자등록번호, 전화번호, 지번·도로명 주소, WGS84 위도·경도가 들어 있다. 토지 경계 확인이나 분할 측량을 맡길 사람이 우리 시군에 어떤 지적측량업체가 있고 연락처는 무엇인지 찾을 때 쓰고, 분석가는 시군별 업체 분포를 지도로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 사업자등록번호를 이름·코드로 맞춰 잇고, 좌표로는 공간 결합을 한다.
description_portal: 경기도 측량업 현황입니다. 업종명, 상호명, 전화번호 소재지주소(도로명/지번) 등의 정보를 제공합니다.※  사업자 등록번호를 제공합니다.이 데이터는 경기도 내 지적측량업을 영위하는 사업체에 대한 현황을 담고 있습니다. 항목에는 시군명, 상호명, 사업자등록번호, 대표자명, 전화번호, 업종명, 소재지 우편번호, 지번주소 및 도로명주소, WGS84 위도 및 경도 등의 정보가 포함되어 있습니다. 이를 통해 지역별 지적측량업체의 분포 및 상세 위치를 파악할 수 있으며, 관련 기관이나 기업은 위치 기반의 공간정보 활용, 민원 대응, 정책 수립 및 제도 개선에 활용할 수 있습니다. 사업자등록번호와 연락처 정보는 업체 식별 및 직접 연락을 위한 목적으로 유용하게 사용될 수 있습니다.
