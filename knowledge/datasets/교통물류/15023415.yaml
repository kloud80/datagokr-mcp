summary_user: 대전광역시 유성구가 운영하는 관내 마을버스의 정류장을 한 건씩 담은 원천 자료로, 정류장 종류·버스번호·정류장명·관리번호·노선 방향·위도·경도로 구성되며 범위는 유성구 한 개 시군구다. 주민이나 분석가가 '우리 동네 마을버스 정류장이 어디에 있고 몇 번 버스가 서는가', '정류장에서 먼 교통 사각지대는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 정류장명 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓰고, 대전시 BIS·TAGO 정류장 원장과도 이름·좌표로 맞춰야 한다.
description_portal: 대전광역시 유성구청에서 운영하는 관내 마을버스의 정류소 위치 및 노선 정보를 담은 자료로, 정류장 구분, 버스번호, 정류장명, 정류장 관리번호, 정류장 노선 방향, 정류장의 위도·경도 등으로 구성되어 있습니다. 해당 데이터를 활용해 유성구 마을버스의 접근성 분석, 노선 최적화, GIS 연계 지도 제작, 교통 사각지대 파악, 대중교통 인프라 개선 방안 마련 등에 활용할 수 있습니다. 또한 정류소별 위치 정보는 행정기관의 교통 민원 대응, 마을버스 정책 수립 및 버스 운행의 효율화 자료로도 쓰일 수 있습니다.
