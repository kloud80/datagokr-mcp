description_portal: 본 데이터는 자동차관리법 제34조(자동차의 튜닝)에 따라 자동차 튜닝 신청 시 제출해야 하는 필요 서류를 안내하는 자료입니다. 수록 항목은 튜닝승인신청서, 튜닝 전후 주요 제원 대비표, 튜닝 전후 외관도(외관 변경이 있는 경우 제출), 튜닝 장치의 상세도, 시험성적서(시험인증을 받은 장치 설치 시 필수 제출) 등입니다. 각 서류의 제출 조건과 목적을 명확히 기재하여 튜닝승인 심사와 민원 안내, 내부 검토 업무에 즉시 활용할 수 있도록 구성되어 있으며, 튜닝승인 신청시 참고 할 수 있는 자료입니다. 기본적인 양식이나 도면은 사이버검사소에서 튜닝승인 신청시 제공하고 있습니다.
