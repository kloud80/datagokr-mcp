description_portal: '데이터 개요국토교통부_항공사고용어는 항공사고의 원인 분석, 보고서 해석, 안전 관련 교육 및 정책 수립 등에서 활용되는 주요 항공안전 용어와 약어를 체계적으로 정리한 데이터입니다. 각 용어는 순번, 용어명, 설명 항목으로 구성되어 있으며, 항공 분야 종사자와 일반 이용자가 항공안전 정보를 명확하게 이해하고 사용할 수 있도록 돕습니다.데이터 제공 항목순번용어의 일련번호용어항공사고 관련 용어 또는 약어 (한글 또는 영문)설명해당 용어의 의미 및 정의를 간결하고 명확하게 설명활용 안내항공안전 교육 및 훈련자료 작성 시 용어 해설 자료로 활용항공사고 보고서 작성 및 해석 시 표준화된 용어 적용항공사 및 감독기관의 내부 매뉴얼 정비 및 정책 기준 수립 시 기반 자료로 활용데이터 해석 시 유의사항설명은 ICAO(국제민간항공기구), IATA(국제항공운송협회), 국토교통부 등의 표준 정의를 기준으로 작성됨일부 용어는 항공사 또는 기관 내부 용어와 다를 수 있으며, 해석 시 적용 기준을 명확히 확인해야 함약어 표기는 국제적 통용 형태(예: ICAO Doc 9859 등 참조)에 따름데이터 구성 예시순번용어설명1사고예방 (Accident Prevention)안전위해요소(Hazard)를 탐지하거나 제거 또는 회피하는 행위2안전위해요소 (Hazard)사고를 유발시킬 수 있는 상태, 사안 또는 환경3위험 (Risk)안전위해요소를 받아들이거나 방치한 결과로 발생 가능한 손실 가능성'
