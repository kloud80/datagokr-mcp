summary_user: 교통카드 자료로 분석한 수도권(서울·인천·경기) 대중교통 통행당 평균 통행거리(km/통행)를 평일·토요일·일요일별 평균과 표준편차로 담은 198바이트 크기의 소형 집계 CSV 파일이다. 교통정책 분석가나 연구자가 '수도권 대중교통 이용자는 한 번 통행에 평일과 주말에 각각 몇 km를 이동하는가'를 확인하는 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 항목 이름을 맞춰 연결하거나 같은 기관의 교통카드 이용분석 시리즈와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단에서 교통카드를 이용해 서울특별시, 인천광역시, 경도의 수도권 데이터를 분석하여 추출한 대중교통 통행거리 자료입니다.해당 데이터는 평일, 주말(토요일, 일요일)별로 세분화하여 제공하고 있습니다.단위는 통행당 km인 km/통행입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
