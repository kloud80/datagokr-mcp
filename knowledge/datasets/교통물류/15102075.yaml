description_portal: 경상남도 창원시 누비자 2020년1월부터 2022년 6월까지 누비자의 일일이용현황입니다. 항목은 연월일, 이용건수입니다.대중교통과 연계된 자전거 공공대여 서비스인 ‘누비자’의 일별 대여 및 반납 실적을 정리한 자료입니다. 이 데이터는 하루 동안의 대여 건수, 이용자 수, 주요 거점 및 시간대별 이용 패턴 등을 분석할 수 있어 스마트 모빌리티 정책 수립, 도시 이동성 분석, 대여소 관리, 서비스 개선 및 민원 대응 등에 활용될 수 있습니다.일일 이용량이 많을 경우 엑셀이나 메모장 등 일반 뷰어로는 일부만 표시될 수 있으므로 R, Python, GIS 등 분석 전용 도구를 활용한 시각화 및 통계 분석을 권장합니다.대여 시간대 구분, 사용자 유형(정기권·일일권 등), 거점별 집계 기준 등의 세부 정의는 제공기관의 메타데이터나 기술문서를 참고해 주세요.
