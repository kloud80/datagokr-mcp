description_portal: '*본 데이터는 특정 알고리즘을 이용하여 생성한 모의 합성 데이터이므로 데이터 활용 시 주의 바랍니다본 데이터는 한국도로교통공단의 고속도로 교통사고 분포와 상관구조를 반영해 생성한 화물차 사고 합성 표본이다. 개인·차량 식별정보를 제거하고 기상, 시간대, 노선, 도로기하, 제한속도, 운전자 행태 등 위험요인을 모형화하여 사고 유형, 충돌형태, 피해규모, 2차사고 가능성을 재현한다. 활용은 위험요인 도출, 사고다발구간 진단, 속도관리·차로운영 정책 평가, 안전시설 우선순위, 기계학습 예측모형 구축 등이다. 포함 항목은 사고 시각·위치, 차량 차종·적재·주행상태, 도로환경·기상 요소, 인적·물적 피해 지표이며 코드 체계를 제공한다.'
