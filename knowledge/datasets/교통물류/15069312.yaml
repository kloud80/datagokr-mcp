description_portal: 이 데이터는 광주광역시 도시철도공사의 2017년도 출퇴근 시간대 노인 이용률을 기록한 자료로, 날짜별 전체 수송 인원과 아침·저녁 혼잡 시간대의 노인 승객 수 및 비율을 포함합니다. 주요 항목에는 일자, 전체 수송 인원, 7~9시 노인 이용 인원 및 비율, 17~19시 노인 이용 인원 및 비율이 있습니다.이 자료를 통해 특정 시간대 노인 승객 비중을 분석하여, 고령층의 대중교통 이용 패턴을 파악할 수 있습니다. 특히 출근과 퇴근 시간대의 이용률 비교를 통해 시간대별 서비스 수요 차이, 고령층 맞춤형 운행 계획, 혼잡 완화 대책 수립에 활용할 수 있습니다. 또한 장기적인 분석을 통해 고령화 추세가 대중교통 수요에 미치는 영향을 평가하고, 노인 친화형 교통 정책 및 교통 복지 서비스 개선 전략을 마련하는 기초 자료로도 중요하게 쓰입니다.
