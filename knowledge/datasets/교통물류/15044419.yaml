summary_user: 서울교통공사 환승역 145개역에 대해 호선·환승노선별 환승거리와 환승소요시간을 담은 역·노선 쌍 단위의 파일(CSV)이며, 소요시간은 보행속도 1.2m/s 기준으로 환승거리를 나눠 계산한 값이다. 이용자나 교통 분석가가 '이 역에서 다른 노선으로 갈아타려면 몇 미터를 걷고 몇 분이 걸리나', '환승거리가 300m 이상인 불편 환승역은 어디인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역 데이터(역 좌표·승하차 인원 등)와는 환승역명과 호선 이름을 매핑해서만 이어 쓸 수 있다.
description_portal: '서울교통공사 환승역(145개역)의 환승거리와  환승소요시간에 관한 데이터입니다.(2025년 12월 31일 기준) 환승소요시간은 일반인 보행속도 1.2 m/s를 기준으로 소요시간(환승거리/보행속도)을 측정하고 있습니다. 총 145개의 환승역 중 환승거리는 아래와 같습니다.100m 미만: 58개역 / 100m이상 200m 미만: 56개역 / 200m이상 300m미만: 24개역 / 300m 이상: 7개역GTX 및 기타 민자노선 지하철 신규개통에 따라서 환승역이 추가되면 본 공공데이터는 변경됩니다.'
