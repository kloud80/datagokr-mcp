summary_user: 창원시 시내버스의 노선별 경유 정류장을 정류장코드·정류장명과 함께 행 단위로 담은 정적 원장 파일이다(csv 약 465KB). 창원 시민이나 교통 분석가가 특정 노선이 어떤 정류장을 지나는지, 특정 정류장에 어느 노선이 서는지 확인하는 데 쓴다. 전역 조인 키는 없어 실시간 도착정보(TAGO·지자체 BIS) 등 다른 버스 데이터와는 정류장코드나 정류장명·노선명을 같은 기관 기준으로 맞춰 이어 쓴다.
description_portal: 대중교통 수단인 버스의 정류장, 노선, 운행, 위치, 운영기관 등과 관련된 다양한 정보를 포함하는 자료입니다. 본 데이터는 대중교통 접근성 분석, 실시간 교통정보 서비스 개발, 이용자 편의 증진, 대중교통 정책 수립 등의 목적으로 활용될 수 있습니다.자료는 정적인 버스 노선 및 정류장 정보뿐만 아니라, 실시간 위치 정보, 운행 이력 등 동적 데이터도 포함할 수 있으며, 데이터의 양이 많을 경우 엑셀, 메모장 등에서 전부 표시되지 않을 수 있으므로 전문 분석도구(R, Python, GIS 등)를 활용하는 것이 좋습니다.항목에 대한 자세한 설명은 데이터 제공기관의 메타데이터 설명서 또는 공공데이터포털 내 기술문서를 참고하시기 바랍니다.
