summary_user: 경기도 버스운송관리시스템(BMS)에서 노선이 과거에 경유했던 정류소를 이력 건별로 담으며, 노선·정류장 순서·정류장과 GIS·누적·실제·확정 거리, 업무 성격(업무코드명), 승인·등록 일시를 함께 기록한다. 교통 분석가나 행정 담당자가 '이 노선의 경유 정류소가 언제, 어떤 사유로 바뀌었는가'를 확인하거나 과거와 현재 노선을 비교할 때 쓴다. 실측 조인 키는 정류장ID(sttn_id)로, 정류장 원장의 busstop_sttn_id와 이어 위치·명칭을 붙이고, 노선ID로 현행 노선·경유정류소 데이터와 대조한다.
description_portal: "이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로 구축된 ‘노선 경유정류소 이력 정보’로, 특정 노선이 과거에 경유했던 정류소 정보를 포함하고 있습니다. 각 항목은 이력ID, 노선ID, 정류장 순서, 정류장ID, GIS 거리, 누적 거리, 실제 거리, 확정 거리, 진행구분코드, 업무코드, 최종 승인자 및 승인일자, 등록 및 갱신 정보 등으로 구성되어 있습니다. 이 데이터는 시간에 따른 노선 변화 및 경유 정류소 수정사항을 추적할 수 있어, 노선 변경 이력 분석, 교통정책 효과 검토, 과거-현재 노선 비교 연구 등에 활용될 수 있습니다. 특히, '업무코드명'을 통해 정류소 수정의 성격(예: 노선 변경 등)을 식별할 수 있어 행정 및 운송 정책 수립에 근거자료가 됩니다."
