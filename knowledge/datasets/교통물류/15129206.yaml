summary_user: 순천시가 관리하는 공용주차장을 주차장(제어기 관리번호) 한 곳당 한 행으로 담은 파일로, 설치 주소와 경도·위도, 주차장 유형, 전체 주차면수, 평일 운영 시작·종료시간, 요금 부과 여부와 요금정보를 포함한다. 순천 시민이나 방문객이 목적지 근처에 평일 몇 시까지 여는 공용주차장이 있는지, 요금은 얼마인지 확인할 때 쓴다. 전역 조인 키는 없어 전국주차장정보표준데이터 등과는 주차장명·주소 매칭이나 좌표 근접으로 이어야 하며, 실시간 주차 가능 대수는 이 파일이 아니라 지자체별 별도 API에서 따로 가져와야 한다.
description_portal: 전라남도 순천시 공용주차장 현황 데이터는 순천시 내 공용으로 운영되는 주차장에 대한 정보입니다. 이 데이터에는 각 주차장의 설치 위치, 유형, 주차면수, 시작시간, 종료시간 등이 포함됩니다. 또한, 주차장의 운영 상태와 인근 지역의 교통 상황을 고려하여 주차장의 효율적인 운영과 관리에 대한 정보를 제공합니다. 시민들은 이를 통해 공용주차장의 위치와 사용 가능 여부를 실시간으로 파악할 수 있으며, 차량을 주차할 때 편리하게 이용할 수 있습니다. 이 데이터는 순천시의 교통 혼잡 해소와 주차 공간 부족 문제를 해결하는 데 중요한 기초 자료로 활용됩니다.
