summary_user: 경기도 화성시 동탄신도시 주요 도로의 측정 지점(소재지 주소)별로 일자·시간대마다 차량 통행량(대), 평균 속도, 구간 정보, 소통 판정, 도로 구분, 구간 길이를 담은 소규모 CSV 파일(약 6.6KB)입니다. 교통 분석가나 상권·입지를 검토하는 사업자가 '동탄신도시의 어느 도로 구간이 어느 시간대에 막히고 통행량이 많은가'를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 구간명을 이름으로 맞추거나 같은 기관(화성시) 데이터와 대조하는 방식으로만 이어 씁니다.
description_portal: 데이터는 경기도 화성시 동탄신도시 지역 내 주요 도로의 시간대별 통행량 및 통행로 정보를 수집·정리한 자료이다. 도로 이용 실태를 분석하여 교통 혼잡 완화, 도로 개선 및 도시교통 정책 수립 등에 활용하기 위해 구축되었다. 주요 항목으로는 수집 일자, 측정 주소, 시간대, 차량 통행량, 평균 통행 속도, 해당 구간의 도로 정보 등이 포함되며, 교통량 분석 및 도로 운영 최적화에 필요한 기초자료로 제공된다. 본 데이터는 화성시 교통 관련 부서 및 민간 연구기관, 교통 분야 사업자 등에서 활용 가능하며, 도시 내 교통 흐름에 대한 이해를 높이는 데 기여한다. 최신 정보가 필요한 경우에는 화성시청 해당 부서를 통해 별도 요청이 가능하다.
