description_portal: "본 데이터는 부산교통공사 도시철도 각 역 간의 거리(km) 및 열차 소요시간(분)을 정리한 자료입니다.노선별 역번호, 역명, 역간 거리, 누적 거리, 소요시간 등의 정보가 포함되어 있으며, 전체 노선별 정차역 기준으로 상세하게 수록되어 있습니다. 해당 데이터는 구간별 이동 시간 분석, 운행 계획 수립, 최적 경로 도출, 서비스 개선 등을 위한 기초자료로 활용할 수 있습니다. 또한 도시철도 시스템의 효율성 진단, 역세권 개발 검토, 대중교통 환승 시뮬레이션, 거리 기반 요금제 설계, 시간표 자동화 등 다양한 행정·기술적 활용에 적합한 데이터입니다. 이용자 체감 시간과 실제 소요시간 비교를 통해 교통 정책의 정교화에도 기여할 수 있습니다.'25. 3. 이전까지 제공하던 역간 구간 정보는 목적지와 도착지 간 거리 합산을 통해 산정하실 수 있습니다.(1구간 : 출발역~도착역10km 이하, 2구간 : 출발역~도착역 10km 초과)"
