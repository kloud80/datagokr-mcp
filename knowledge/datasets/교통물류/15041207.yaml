summary_user: 부산교통공사가 운영하는 부산1호선의 역별 장애인화장실 위치를 한 행씩 담은 원천 목록 파일(csv, 약 6.7KB)로, 역명·역층·지상 구분·게이트 안팎·가까운 출구번호·상세위치·화장실 구분을 담는다. 휠체어 사용자나 보호자가 '이 역에서 개찰구 안쪽 몇 층에 장애인화장실이 있고 몇 번 출구 쪽인가'를 확인하거나, 교통약자 편의시설 현황을 역별로 정리하는 분석가가 쓴다. 전역 조인 키는 없어서 다른 역·시설 데이터와는 선명·역명 같은 이름을 맞추거나 같은 기관의 다른 노선 장애인화장실 파일과 나란히 붙여 쓴다.
description_portal: 부산교통공사에서 운영하는 부산1호선의 역사별 장애인화장실 위치에 대한 데이터로, 철도운영기관명, 선명, 역명, 장애인화장실의 역층, 게이트내외, 출구번호, 상세위치 데이터가 있습니다.화장실은 일상생활에서 가장 중요한 시설이지만, 휠체어 사용자 등 장애인에게는 여전히 가장 차별적인 시설로 남아 있다. 장애인용 화장실에 대한 기준은 「장애인·노인.임산부등의 편의증진보장에 관한 법률」(장애인등편의법), 「교통약자의 이동편의증진법」(교통약자법) 및 「장애물 없는 생활환경 인증제도의 인증기준」(BF인증제도)에서 정하고 있다. 그러나 현재 장애인등편의법의 기준 가운데 실제로 휠체어 사용자의 이용이 어려운 기준이 몇 가지 있다. 이 기준들에 대한 개선이 필요하다.
