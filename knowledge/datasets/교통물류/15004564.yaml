summary_user: 용인도시공사가 위·수탁 운영하는 용인시 관내 공영주차장(부설·노상·노외)을 주차장 한 곳당 한 행으로 담은 소규모 CSV 파일(약 3KB)로, 구분·주차장명·소재지주소·주차대수·주차장면적·기준일자가 들어 있다. 시민이나 분석가가 '용인시에서 도시공사가 운영하는 공영주차장은 어디에 있고 각각 몇 면인가'를 확인하거나 지역별 공영주차 공급량을 비교하는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터(주차장관리번호·좌표·요금 원장)와는 주차장명·소재지주소를 맞춰 대조해야 이어 쓸 수 있다.
description_portal: 용인시 관내에서 용인도시공사가 위·수탁 운영 중인 공영주차장(부설주차장, 노상주차장, 노외주차장) 공공데이터를 제공하고 있습니다. 본 공공데이터는 각 주차장의 명칭, 소재지 주소, 주차 가능 면수, 주차장 총 면적 등의 주요 정보를 제공하고 있으며, 이를 통해 시민 여러분이 주차장을 보다 효율적으로 이용하실 수 있도록 돕고 있습니다.제공되는 자료는 정보의 정확성과 최신성을 유지하기 위해 연 1회 정기적으로 점검·갱신되며, 이를 통해 변화된 주차장 현황이나 시설 확충, 면수 변동 등의 정보를 반영하고 있습니다.더불어 주차 요금, 운영 시간, 휴무일, 부대시설 현황 등 보다 세부적이고 실질적인 이용 정보는 용인시 공영주차장 공식 홈페이지(https://park.yuc.co.kr/)에서 언제든 확인하실 수 있습니다.본 공공데이터는 시민의 편의 증진과 교통 환경 개선을 위해 마련된 것으로, 많은 활용과 관심을 부탁드립니다.
