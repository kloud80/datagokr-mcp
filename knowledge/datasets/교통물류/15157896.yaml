status: active
summary_user: 대전시 버스정보시스템의 버스 노선 정보를 노선별 경유 정류소, 정류소 기본 정보, 노선 운행 정보 단위로 조회하는 API이며, 범위는 대전광역시 한 시도이고 정류소는 주소·좌표 수준으로 다룬다. 대전에서 버스를 타는 시민이나 앱 개발자가 '이 노선은 어떤 정류소를 거쳐 가는가'를 확인하거나, 분석가가 노선 경로를 지도에 올릴 때 쓴다. 실측 필드에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으므로 노선 ID(busRouteId)를 먼저 받아 넘기거나 정류소·노선 이름이나 같은 기관 코드로 대전 BIS의 다른 API와 이어 쓴다.
limits: 4개 오퍼레이션 중 실호출에 성공한 것은 2개이고, 전체 정류소 조회(getStaionByRouteAll)와 전체 노선 조회(getRouteInfoAll)는 최소 파라미터로 호출했을 때 응답이 없었다. 필수 파라미터인 노선 ID(busRouteId)는 다른 데이터에서 먼저 받아 와야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
