summary_user: 대구교통공사 월배·안심 차량기지에서 운영하는 안전체험학습장의 이용 인원과 이용 건수를 연도·월별로 기지마다 나눠 담은 집계 통계로, 원본 파일은 946바이트 크기의 작은 CSV입니다. 시민·교육기관·분석가가 "대구 도시철도 안전체험학습 참여 인원이 해마다·달마다 어떻게 변했고, 두 기지 중 어디가 더 많이 쓰였나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·월 기준으로 맞추거나 대구교통공사의 다른 안전·운영 통계와 기관 단위로만 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구교통공사 월배 및 안심 차량기지사업소에서 운영하는 안전체험학습 프로그램의 운영 현황을 제공합니다. 본 자료는 연도별·월별 체험학습 이용 인원과 이용 건수 등 프로그램 운영 현황에 관한 통계 정보를 포함하고 있으며, 시민의 안전교육 참여 현황과 프로그램 운영 추이를 체계적으로 파악할 수 있도록 구성되어 있습니다. 이를 통해 안전교육 수요 분석, 체험학습 운영 성과 평가, 안전의식 향상 정책 수립 및 교육 프로그램 개선을 위한 기초자료로 활용될 수 있으며, 시민 안전문화 확산과 공공 안전교육 활성화, 데이터 기반 안전관리 정책 수립을 지원하는 자료로 활용할 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다'
