summary_user: 서산시 도시계획정보시스템 안에서 시가화조정구역 정보를 담는 데이터베이스 테이블·컬럼 구조(시스템명, 논리·물리 DB명, 영문·한글 테이블명과 컬럼명 7개 항목)를 정리한 메타데이터 파일로, 구역 자체의 위치나 지정 내용이 아니라 시스템 구조 설명이다(약 2.5KB 규모의 CSV). 서산시 도시계획 데이터를 연계하거나 시스템을 구축하는 분석가·개발자가 '시가화조정구역 정보는 어떤 테이블과 컬럼에 저장되어 있나'를 확인할 때 쓴다. 전역 조인 키가 없어서, 같은 서산시 도시계획정보시스템의 다른 메타데이터와 테이블명·컬럼명을 이름으로 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 시가화조정구역에 관한 메타데이터이다. 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 시가화조정구역은 도시 확산을 억제하고 계획적 개발을 유도하기 위해 지정되며, 일정 기간 개발이 제한된다. 이 구역은 균형 발전과 도시 확장을 위한 공간 확보를 목적으로 한다. 본 데이터는 지정 목적과 규제 내용을 이해하는 데 유용하며, 도시계획 수립, 인허가 검토, 행정업무에 활용된다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 도움이 되며, 공간정보 분석, 정책 수립, 민간 활용 등 다양한 분야에 기초자료로 활용된다.
