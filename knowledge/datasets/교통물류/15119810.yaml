summary_user: 부산교통공사 도시철도 역사에 설치된 물품보관함을 호선·역별 설치 위치 단위로 정리한 현황 파일로, 소형·중형·대형·특대형 보관함 수량과 이용요금, 운영사를 담는다(약 8KB 규모의 CSV). 짐을 맡기려는 관광객·환승객이 '어느 역 어디에 대형 보관함이 있고 요금은 얼마인가'를 확인하거나, 운영 담당자가 역별 보관함 배치와 민간 운영사 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 역 정보·승하차 데이터와는 호선과 역명(역명) 텍스트를 맞춰 이어 쓴다.
