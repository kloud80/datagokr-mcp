summary_user: 서울교통공사가 운영하는 1~8호선 역사에 비치한 소화기를 호선·역명·관리번호·소화기 종류별 보유대수로 담은 파일(csv, 약 37KB)로, 포털 설명상 276개 역의 2026년 2월 기준 현황입니다. 역사 안전 담당자나 분석가가 '특정 역 또는 호선에 소화기가 몇 대, 어떤 종류로 비치돼 있는가'를 확인하거나 역별 초기 진화 설비 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 역 단위 데이터와는 호선·역명을 문자로 맞추거나 같은 서울교통공사 데이터끼리만 연결한다.
description_portal: 서울교통공사에서 운영 중인 1~8호선 276개 역사에 비치하여 운영 중인 소화기 관련 데이터입니다.(2026년 2월 기준). 해당 데이터에는 역별 소화기의 총 비치 수량이 포함되어 있습니다. 소화기의 경우 "소화기구 및 자동소화장치의 화재안전성능기준(NFPC 101) 제4조 설치기준에 따라 각 부분으로부터 1개의 소화기까지의 보행거리가 20미터 이내가 되도록 배치하고 있습니다. 대형소화기의 경우에는 보행거리가 30미터 이내가 되도록 배치하고 있습니다. 역사에 비치한 소화기의 경우 화재 등 비상 상황 발생시 초기 진화 목적으로 배치하고 있습니다. 승강장이나 대합실에서 화재가 발생했을 경우 누구나 사용 가능하도록 배치하고 있습니다.
