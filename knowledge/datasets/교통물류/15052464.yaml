summary_user: 서울시 도로굴착 예정지의 위치를 관리구경계 단위 공간정보(WGS1984 위경도 좌표)로 담으며, 지형지물코드·구 코드·구 이름이 함께 들어 있는 시도 범위의 원천 데이터다. 사업자나 분석가가 특정 자치구에서 도로굴착 공사가 예정된 곳이 어디인지 지도에서 확인하고, 공사 이벤트에 따른 통행·접근성 변화를 미리 살피는 데 쓴다. 전역 조인 키는 없으므로 구 코드(SGG_CD)나 구 이름으로 다른 서울시 자치구 단위 데이터와 맞추거나 위경도 좌표로 공간 결합해 쓴다.
description_portal: '해당 데이터는 서울시 도로굴착 예정지 위치정보 (좌표계: WGS1984) 데이터입니다. 서울시 도로굴착 관리구경계의 공간정보로 지형지물코드, 구이름, 좌표(위경도)등의 정보를 제공하는 서비스 입니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준) ※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
