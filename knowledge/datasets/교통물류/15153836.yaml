summary_user: 한국철도공사가 보유한 철도 차량을 차량 한 대 단위로 담은 전국 범위 파일(csv, 약 0.87MB)로, 운행차종, 길이·높이·폭과 톤수 같은 물리 제원, 설계·제한·최고 속도, 제작·차적편입·폐차 일자, 좌석수·의자형식 같은 객차 사양을 담는다. 분석가나 연구자가 차종별 차량이 언제 만들어져 몇 년째 쓰이고 있는지, 선로 조건에 맞는 속도·곡선반경 제원을 갖췄는지를 살필 때 쓴다. 실측 컬럼에서 다른 데이터와 바로 붙는 전역 조인 키는 찾지 못했으므로, 같은 기관의 철도운영정보 공통기준 데이터와 차종 이름이나 코드를 맞춰 연결해야 한다.
description_portal: 이 데이터는 한국철도공사가 보유한 모든 철도 차량의 기본적인 제원, 사양, 생애 주기 정보를 담고 있는 핵심 데이터입니다. 차량 번호를 기준으로 차량 구분 코드, 차종 약어 코드 등을 통해 차량의 종류와 용도를 식별합니다. 특히, 차량 길이, 높이, 톤수, 하중 톤수 등 물리적 제원 정보와 차량 설계/제한 속도는 열차 운행의 안전성 및 선로 적합성을 판단하는 데 필수적입니다. 또한, 차량 제작 일자, 차적 편입 일자, 차량 사용 완료 일자(폐차) 정보는 차량 자산의 생애 주기(Life Cycle)와 잔존 가치를 분석하는 데 사용됩니다. 배치 소속 코드와 차량 상태 코드는 차량의 현재 관리 주체 및 운용 현황을 보여줍니다. 이 데이터는 철도 차량 자산 관리, 유지보수 계획 수립, 열차 운행 스케줄링 최적화, 운행 안전 기준 연구 등 철도 운영 및 인프라 관리 전반에 걸쳐 핵심적인 근거 자료로 활용됩니다.
