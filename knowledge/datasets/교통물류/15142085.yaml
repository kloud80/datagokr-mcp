summary_user: 정산사업자별로 쓰는 교통수단 코드와 그 이름(마을버스·시내버스·좌석버스·도시철도·고속버스·철도 등)을 짝지어 담은 전국 단위 코드표성 API 데이터로, 건별 이용 기록이 아니라 비공간 참조 목록입니다. 교통카드 정산·승하차 데이터를 분석하는 분석가가 '이 정산사업자의 교통수단코드가 어떤 수단을 뜻하는가'를 풀어 읽을 때 쓴다. 전역 조인 키는 없고, 정산사업자ID(clcln_bzmn_id)와 정산사업자교통수단코드를 같은 기관의 교통카드·정산 데이터에 이름·코드로 맞춰 이어 쓴다.
description_portal: '대중교통 수단에 대한 정보를 의미하여, 유형은 아래와 같이 분류될 수 있습니다. - 마을버스: 주거지와 대중교통 허브를 연결하며, 단거리 이동에 특화. 주로 외곽이나 주택가에서 운영. / 시내버스: 도시 내 주요 지역 연결, 다양한 목적지 접근 가능. 중·대도시와 주변 지역에서 운영. / 좌석버스: 정류장이 적고 긴 이동거리 제공. 도시 간 또는 교외 지역에서 운영. / 도시철도(지하철): 대량 수송, 정시성 및 빠른 이동 속도. 대도시 중심에서 운영. / 고속버스: 도시 간 장거리 이동에 적합, 정기적인 시간표 운영. 주요 도시 간 고속도로 경로에서 운행. / 철도(일반 열차): 장거리 수송에 적합하며, 승객 및 화물 운송 가능. 전국적인 철도망에서 운행.'
