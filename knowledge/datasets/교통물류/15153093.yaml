description_portal: 대전교통공사의 기관사 근무시간 실적 데이터입니다.이 데이터는 근무일자별로 실제 근무에 투입된 기관사의 부서명, 사번(개인정보 보호를 위해 마스킹 처리), 근무 시각, 비고 등의 정보를 포함하고 있어 기관사 근무 배치 현황과 인력 운영 흐름을 분석하는 데 활용됩니다.특히 근무 유형 파악, 인력 수급 계획, 배차 안정성 검토 등 다양한 운영 의사결정의 근거 자료로 쓰일 수 있습니다.데이터는 매년 1회 정기적으로 등록되고 있으며, 2009년 1월부터 2025년 7월까지의 장기간에 걸친 정보를 조회할 수 있습니다.현재까지 누적된 총 데이터 건수는 147,536건으로, 기관사 근무 패턴 분석 및 장기적 운영 개선 연구에 충분한 규모를 갖추고 있습니다.
