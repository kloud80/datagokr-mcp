summary_user: 철도운영기관별로 승차역과 하차역 코드 쌍마다 구간 이용거리를 담은 전국 단위 파일(CSV, 약 200KB)이다. 승차역에서 하차역까지 실제 이동 거리를 알아야 하는 분석가가 거리 기반 운임 구조나 노선별 이동 거리를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 역 이름·코드 매핑표나 같은 기관(철도운영기관코드) 기준으로 역 정보·승하차 데이터와 이어 쓴다.
description_portal: 이 데이터는 철도 이용자가 승차역부터 하차역까지 이동한 거리를 나타내는 정보입니다. 이 데이터는 철도운영기관코드, 승차역코드, 하차역코드, 그리고 구간 이용거리를 포함하고 있습니다. 이를 통해 특정 역 간의 실제 운행 거리를 파악할 수 있으며, 승차역과 하차역의 코드를 기반으로 각기 다른 역 간의 거리를 분석하는 데 활용될 수 있습니다.철도 운임 체계 분석, 노선별 효율성 평가, 그리고 역세권 분석과 같은 다양한 분야에서 중요한 기초 자료로 활용될 수 있습니다. 또한, 열차 운행 스케줄 최적화나 노선 계획 수립 시에도 각 구간의 거리를 고려하는 데에 유용하게 사용될 수 있습니다.
