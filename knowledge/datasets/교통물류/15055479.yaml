description_portal: '부산항에 입항하는 선박의 연도별 톤급별 통계 데이터를 제공합니다.- 톤급별 입항선박, 컨테이너선 비중- 단위 : 척수부산항만공사가 제공하는 본 데이터는 톤급별 입항선박 통계 정보를 연도별로 수록한 자료입니다. 선박 총계와 컨테이너선, 5천톤 이하, 1-2만톤급, 2-5만톤급, 5만톤 이상 등 다양한 선박 톤급별 분류 데이터를 포함합니다. 항만 운영 효율성 분석, 선박 수용능력 계획 수립, 해운 및 항만산업 수요 예측, 항만시설 확충 전략 수립 등에 활용할 수 있습니다. 항만별 처리 규모 비교, 선박 규모 변화 추이 분석 등 항만 물류 및 전략 수립에 실질적 근거가 되는 공공데이터입니다.'
