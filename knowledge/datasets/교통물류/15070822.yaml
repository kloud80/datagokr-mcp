summary_user: 부산 해운대구 관내 주차장을 개소 단위로 담아 주차장명·주소·급지·주차면수·관리기관·공영 지정 게시일·위경도·유형(공영주차장, 소규모공동주차장 등)을 제공하는 API입니다. 해운대구 주민이나 방문객, 분석가가 "특정 동네 근처 공영주차장이 어디에 있고 몇 면인가"를 확인하거나 구 내 주차 공급 분포를 지도로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 전국주차장정보표준데이터 등 다른 데이터와는 주차장명·주소 매칭이나 위경도(lat, lng) 기반 공간 결합으로만 이어 쓴다.
description_portal: '부산광역시 해운대구 관내에 있는 주차장에 대한 정보를 조회할 수 있는 오픈 API 서비스를 제공합니다.주차장명, 주소, 급지, 주차면수, 관리기관, 공영게시일, 위도, 경로, 분류명 정보를 포함하고 있습니다.각 항목별 설명은 다음과 같습니다.- 주차장명: 주차장의 이름- 주소: 주차장이 위치한 주소- 급지: 주차장 구역의 등급(1급지, 2급지 등)- 주차면수: 주차 가능한 차량의 주차 면 수- 관리기관: 주차장을 관리하고 있는 기관명- 공영게시일: 주차장이 공영주차장으로 지정되어 공지된 일자- 위도: 주차장 위치의 위도 좌표- 경도: 주차장 위치의 경도 좌표- 분류명: 주차장의 유형(공영주차장, 소규모공동주차장 등)'
