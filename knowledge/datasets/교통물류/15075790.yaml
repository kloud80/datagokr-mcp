description_portal: 이 데이터는 제주특별자치도가 제공하는 “어린이보호구역 내 기타점형시설물” 현황 자료이다. 보호구역 내 도로종류, 시설물 종류, 위치(위도·경도) 정보가 포함된 CSV 형식 데이터이며, 총 512건의 기록이 수록되어 있다. 해당 ‘기타점형시설물’에는 점자블럭, 시선유도표지, 충격흡수시설, 조명시설, 보차분리표지 등과 같이 어린이 통학 및 보행 안전을 지원하는 각종 도로 구조물 및 안전시설이 포함된다.이 자료는 스쿨존 내 보행자 안전 확보를 위한 시설 분포 분석, 보행 경로 안전여건 평가, 부족 시설 탐색 및 우선 보강 구간 선정, 지리정보시스템(GIS) 기반 안전지도 구축, 정책 수립 및 교통안전 인프라 계획 등의 기초자료로 유용하다.
