summary_user: 서울교통공사 지하철의 개통 이력을 호선·역구간 단위로 한 줄씩 담은 소규모 파일(csv 약 2KB)로, 구간별 역 개수, 연장(km), 개통일자를 기록한다. 연구자나 부동산·교통 분석가가 '특정 호선 구간이 언제 개통됐고 개통 전후로 주변이 어떻게 변했나'를 시점별로 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 역·승하차 데이터와는 호선명·구간(역 이름)을 맞추는 이름 매핑으로만 연결한다.
description_portal: 서울교통공사의 지하철 개통 현황(호선, 역, 역 수, 연 장, 개통일) 데이터입니다. 해당 데이터는 개통회사, 호선, 역구간, 역수, 연장길이, 개통일 데이터를 포함하고 있습니다.  1호선 서울역-청량리역 구간 1974년 8월 15일 개통을 시작으로 최근 2024년 8월 10일 8호선 연장 암사역사공원역 개통 정보를 포함하고 있습니다. 예시로 1호선 서울역-청량리역 구간은 7.8km구간에 9개역 으로 구성됩니다.  같은 호선이더라도   구간별로 개통일자가 상이하여 시간에 따른 개통정보를 확인할 수 있습니다.
