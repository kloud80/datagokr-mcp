summary_user: "SRT 정차역별로 한 달 동안의 승차인원과 하차인원(단위: 명)을 집계한 파일로, 경부선과 호남선을 모두 포함하며 2019년 1월분부터 담는다. 철도·교통 분석가가 '수서역이나 동탄역 같은 SRT 역의 월별 이용객이 어떻게 변해 왔는가'를 확인하거나 역 주변 유동인구의 대체 지표로 쓴다. 전역 조인 키나 역 코드가 없어 다른 데이터와는 역명(역명)을 이름으로 맞춰 이어 쓰고, KTX·광역철도 등 다른 기관의 역별 승하차 자료와 비교할 때도 이름 매핑이 필요하다."
description_portal: 'SRT 월별 역별 승차인원 수, 하차인원 수를 통합한 공공데이터입니다.해당 데이터는 반기별 주기성 데이터입니다.SRT가 운행중인 경부선, 호남선 모두 포함되어 있습니다.(연간데이터) SRT는 2016년도 12월  9일부터 운행을 시작하였습니다.예시) 2019년 1월 수서역 승차인원 수는 627,146명입니다, (단위 : 명)* 2019년도 1월부터의 데이터입니다.* 승하차인원 수에  해당하는 값 "0"은 미운행 열차로 인하여 값이 존재하지 않습니다.* 에스알은 해당 데이터를 무료로 제공드리고 있습니다'
