description_portal: 서울특별시의 보도통계자료입니다. 엑셀의 첫번째 시트는 서울시 자치구별 보도 총괄현황 데이터입니다. 관리기관(서울시 25개 자치구, 서울시설공단)별 연장(m), 면적(㎡), 투수성 보도포장 현황(불투수면적, 투수면적), 기존 대비 증감사유, 전체 비율 등으로 구성된 데이터입니다. 두번째 시트는 서울시의 보도 세부현황에 대한 데이터입니다. 노선번호, 관리기관, 노선명, 방향, 구간(위치), 연장(m), 폭(m), 면적(㎡), 블록 종류(점토블록, 콘트리트가공블록 등), 투수여부, 시공년도, 횡단구성, 비고 등으로 구성된 데이터입니다.
