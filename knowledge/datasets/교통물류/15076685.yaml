summary_user: 전국 고속도로의 콘존(영업소·나들목 사이 구간) 단위로 노선, 기준 일시, 교통량, 통행 속도, 점유율, 평균 통행시간, 소통 등급, 상·하행 구분을 담은 실시간 정체 현황 데이터다. 운전자나 내비게이션·물류 사업자가 '지금 경부선 어느 구간이 막히고 평균 속도는 얼마인가'를 확인하는 데 쓰고, 분석가는 호출 결과를 쌓아 상습 정체 구간을 찾는 데 쓴다. 전역 조인 키는 없어서 노선번호(routeNo)·노선명, 콘존 ID, 검지기(VDS) ID처럼 한국도로공사 내부 코드나 이름을 맞춰 같은 기관의 다른 고속도로 데이터와 잇는다.
description_portal: 본 데이터는 한국도로공사에서 운영하는 실시간 고속도로 정체 상황을 제공하는 OpenAPI 서비스이다.전국 고속도로 주요 노선의 정체 구간, 교통 흐름, 통행 속도 등을 실시간으로 수집하여 XML 및 JSON 형식으로 제공한다.이 데이터는 정체 발생 위치, 구간 거리, 통행 불편 지수 등을 포함하고 있으며, 수 분 단위로 자동 갱신된다.도로 이용자의 실시간 교통 정보 확인, 경로 탐색, 교통 예측, 민간 내비게이션 서비스와의 연계 등에 활용 가능하다.정확하고 신속한 정보 제공을 통해 고속도로 교통 흐름의 효율성 향상과 사용자 이동 편의 제고에 기여한다.또한 교통 관제, 정책 수립 등 공공 및 민간 부문에서 다양한 목적의 교통 정보 서비스 구축에 유용하게 활용될 수 있다.
