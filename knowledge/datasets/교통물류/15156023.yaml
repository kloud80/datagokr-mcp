description_portal: 한국교통안전공단에서 운영하는 기계식주차장 정보관리시스템에서 관리하는 정보입니다. 주차장법에 따라 20대 이상 차량이 들어갈 수 있는 기계식주차장치는 기계식주차장에서 발생한 사고에 대해  주차장법에서 정하는 배상기준을 충족하는 보험을 가입하여야 합니다. 또한, 기계식주차장치 보수업을 하는 사업자도 동일한 기준의 보험을 가입해야 합니다. 해당 데이터는 건물과 보수업 등록 사업자가 가입한 기계식주차장 사고배상보험에 대한 가입정보를 제공하고 있습니다.  모든 보험명은 "기계식주차장 사고배상보험"이며, 기업의 영업에 활용될 수 있는 정보(보험사명 등) 및 개인정보는 제외하고 제공합니다.
