summary_user: 원주시 주요 동 지역에 설치된 도로안전표지를 한 개씩 담은 건별 데이터로, 표지 구분·종류, 설치 도로(노선명·방향·차로 수), 도로명·지번 주소와 위경도 좌표, 설치일 등을 시군구 범위로 제공한다. 원주시 도로를 관리하거나 분석하는 사람이 '특정 노선·구간에 어떤 규제·주의표지가 어디에 설치돼 있는가'를 확인하거나 지도에 표지 위치를 올릴 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 위경도 좌표나 주소·노선명을 맞춰 공간·이름 기준으로 이어 쓴다.
