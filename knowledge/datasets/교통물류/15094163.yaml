summary_user: 시도·시군구별로 65세 이상 운전자가 낸 교통사고의 발생건수, 사망자수, 부상자수(중상·경상·부상신고 합)를 담은 전국 집계 파일로, 교통사고분석시스템(TAAS) 자료를 기반으로 한다. 지자체 교통안전 담당자나 분석가가 '우리 시군구의 고령 운전자 사고가 다른 지역보다 많은가, 사망·중상 비중은 어떤가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 맞춰 연결해야 하며, 같은 도로교통공단의 지역별·다발지역 사고 통계나 지자체 사고 통계와 이름 기준으로 이어 쓴다.
description_portal: '- 시도 시군구별 65세이상 운전자 교통사고 통계(사고건수,사망자수, 부상자수, 중상자수, 경상자수, 부상신고자수)  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우-해당 데이터는 교통사고분석시스템(taas.koroad.or.kr)을 기반으로 함'
