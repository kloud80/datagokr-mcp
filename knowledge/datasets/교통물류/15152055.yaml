description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 제주공항 등 전국공항을 운영하는 공공기관(시장형 공기업)입니다.해당 데이터는 제주국제공항 국내선 출도착 여객수 학습용 데이터로 구성은 운항일자, 도착여객(명), 출발여객(명), 전체여객(명)으로 구성되어 있습니다.데이터는 민간 IT기업 및 전력발전소에서 제주도 여객수에 따른 전기차 충전소 AI 수요 예측 모델의 학습에 활용될 예정으로 3년의 대용량 데이터로 충분한 시계열과 높은 통계 신뢰성을 확보하고 있습니다. 제주 면세점이나 호텔에서 제주 출도착 여객 수에 따른 분석모델로 활용이 가능할 것으로 보입니다.해당 데이터에 대한 추가 문의사항이나 요구사항 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
