summary_user: 서울지하철 역사 안에서 진행되는 공사를 건별로 담으며, 공사명·구분·위치·개요·시작일과 종료일·총사업비·시행부서·시공업체와 연락처가 들어 있습니다. 지하철 이용자나 교통약자 안내 담당자가 특정 날짜에 어느 역에서 어떤 공사로 시설 이용이 제한되는지 확인하는 데 쓰입니다. 역 코드 같은 전역 조인 키는 없어서, 다른 역·시설 데이터와는 공사위치(cstrnPstn)에 적힌 역 이름을 맞추거나 같은 기관 데이터끼리만 연결할 수 있습니다.
description_portal: 서울교통공사 역사 내 공사현황 API는 서울지하철 역사 내에서 시행되는 공사 현황 정보를 제공하는 API입니다. 공사 코드, 공사 구분코드, 공사명 및 공사(작업)의 내용, 위치, 착공일과 준공일 등의 항목을 포함합니다. 공사 구분코드와 특정 일자 기준의 공사 일정 조회 검색조건을 제공합니다. 공사로 인한 시설 이용 제한 안내, 승강기 공지, 안전 모니터링 시스템 등에 연계해 활용될 수 있습니다. 역사 내 공사현황은 수시로 갱신되는 데이터를 Rest API 방식으로 제공합니다. 데이터는 매일 갱신됩니다.
