summary_user: 서울시 행정동별로 하루 단위 버스 총 승차 승객수(BUS_PSNG)와 0시부터 23시까지 시간대별 승차 승객수를 담은 집계 데이터이며, 범위는 서울시 읍면동 단위입니다. 교통 분석가나 자치구 담당자가 특정 행정동에서 출근 시간대 버스 승차 수요가 얼마나 몰리는지 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동 ID(DONG_ID)를 서울시 읍면동마스터 정보와 매핑해야 행정동 이름이나 다른 통계와 이어 쓸 수 있습니다.
limits: 서울 열린데이터광장(data.seoul.go.kr)의 별도 인증키가 필요하며 공공데이터포털 활용신청과는 별개다. 행정동 ID는 표준 행정코드와 바로 맞물린다는 근거가 없으므로 서울시 자체 마스터로 이름·코드를 매핑해야 하고, 정류장·노선 단위 승차 정보는 담지 않는다.
