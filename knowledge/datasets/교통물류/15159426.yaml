legal_basis_portal: 도로교통법어린이ㆍ노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙 제1조(목적) 이 규칙은 「도로교통법」 제12조 및 제12조의2부터 제12조의4까지의 규정에 따라 어린이 보호구역, 노인 보호구역 및 장애인 보호구역을 지정ㆍ관리하는 절차 및 기준 등에 관하여 필요한 사항을 규정함을 목적으로 한다. 제3조(보호구역의 지정) ① 초등학교등의 장은 별지 제1호서식의 어린이 보호구역 지정 신청서에 따라 특별시장ㆍ광역시장ㆍ특별자치도지사 또는 시장ㆍ군수(광역시의 군수는 제외한다. 이하 “시장등”이라 한다)에게 초등학교등의 주변도로를 어린이 보호구역으로 지정하여 줄 것을 신청할 수 있다.
