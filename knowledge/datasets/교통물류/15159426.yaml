description_portal: 「도로교통법」 등에 따라 교통사고의 위험으로부터 어린이를 보호하기 위하여 자동차등의 통행속도를 30킬로미터 이내로 제한할 수 있게 지방자치단체에서 설정한 구역의 정보※ 노인 및 장애인 보호구역은 제공범위(대상)에 미포함해당 데이터는 남구 내  어린이보호구역을 표시한 자료로서, 시설종류(어린이집, 유치원, 초등학교, 특수학교)와 대상시설명, 소재지도로, 위도 및 경도, 관리기관명, 관할경찰서 등 필요한 정보들을 포함하였음.만족스러운 자료이기를 바라며, 추가 문의사항은 남구청 교통정책과(051-709-4851)
