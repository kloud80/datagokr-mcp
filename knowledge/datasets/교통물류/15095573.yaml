summary_user: 충주시 관내 전통시장 안팎에 있는 주차장을 한 곳씩 담은 건별 목록으로, 시장명·주차장명·유형·도로명/지번 주소·좌표·주차면수와 함께 평일·토요일·공휴일 운영시간과 기본·추가·일·월 요금 정보를 포함한다. 시장 이용자가 "이 전통시장 근처에 주차할 곳이 있고 요금은 얼마인가"를 확인하거나, 지자체·분석가가 시장별 주차면 공급이 충분한지 비교하는 데 쓴다. 전역 조인 키는 없어 전국주차장정보표준데이터 등과는 주차장명·주소 매칭이나 좌표(lat, lng) 근접으로만 연결하고, 시장 관련 데이터와는 시장명(market_nm)으로 이어 붙인다.
description_portal: '본 데이터는 충청북도 충주시 관내 전통시장 내외부에 설치된 주차장 현황을 제공한다.전통시장 이용자의 편의 증진과 시장 활성화를 위한 주차장 인프라 구축 실태를 파악하는 데 활용되며, 시장별 주차장 위치 및 규모에 대한 정보를 포함한다.주요 수록 항목은 다음과 같다:주차장명: 등록된 주차장의 공식 명칭주차장 유형: 노외, 노상, 지하 등 물리적 구조 또는 운영 방식주소: 해당 주차장이 위치한 도로명 주소구획 수: 해당 주차장에 설치된 총 주차구획(면수) 수량이 데이터는 다음과 같은 행정 및 민간 영역에서 유용하게 활용될 수 있다:🔹 시장 인근 주차 수요-공급 불균형 해소 정책 수립🔹 혼잡도 분석 및 주차환경 개선사업 기초자료🔹 지역상권 활성화를 위한 시설 확충 우선순위 설정🔹 공공주차장 지도서비스, 교통정보 앱 등의 기초 DB 구성※ 구획 수는 등록 당시 기준이며, 실제 운영상황에 따라 변동이 발생할 수 있음. 또한, 주차장 이용 가능 여부는 시장 운영일, 시간대 등과 연동되므로 실시간 주차 정보는 별도 서비스로 확인 필요.'
