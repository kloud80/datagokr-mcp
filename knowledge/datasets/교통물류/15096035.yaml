summary_user: 충청남도 계룡시 관내에 설치된 보안등을 시설 한 개(표지번호) 단위로 담은 건별 원천 데이터로, 지번 주소·상세 위치와 경도·위도 좌표, 설치일·등 수·등 종류·용량·작동 방식·사용량 같은 기술 사양을 제공한다. 지자체 시설 담당자나 생활안전 분석가가 '우리 동네 골목 어디에 보안등이 있고 어떤 종류·용량의 등이 설치돼 있는가'를 확인하거나 야간 조명 사각지대를 지도에서 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 좌표(경도·위도)를 이용한 공간 결합이나 지번 주소 매칭으로만 이어 쓴다.
description_portal: 충청남도 계룡시의 '보안등 현황 API' 데이터는 관내에 설치된 보안등 시설물의 상세 기술 및 위치 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 보안등 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 시설의 고유 식별자인 표지 번호, 지번 주소와 상세 위치, 그리고 경도, 위도 등 정확한 위치 정보가 포함됩니다. 또한, 설치 일, 등 수, 등 종류 및 용량 등 기술 사양 정보, 작동 방식, 사용량, 그리고 최종 수정 일까지 상세히 제공됩니다.
