description_portal: '교량은 강, 계곡, 도로 등 장애물을 넘어 사람, 차량, 기차 등이 이동할 수 있도록 설계된 구조물을 의미합니다.시설물 종별은 "시설물의 안전 및 유지관리에 관한 특별법"에서 규모 및 중요도에 따라 구분한 관리대상입니다.1종 시설물은 국가 기반시설 및 대형 공공시설 등 재난 위험이 큰 시설을 의미합니다.2종 시설물은 중규모 사회기반시설로 중간 수준의 위험을 가집니다.3종 시설물은 소규모 시설로 위험도가 낮습니다.경기도 양평군청 도로과에서 관리하는 3종 시설물 교량 데이터를 제공합니다. 관련근거: 시설물 안전법 등(시설물번호, 시설물명, 시설물 종별, 관리주체, 준공일, 주소, 승인일 등 제공)'
