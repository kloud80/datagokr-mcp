summary_user: 위험물질운송안전관리시스템을 통해 위험물 운송차량 단말기에 전송된 전국 도로 공사정보를 공사 한 건 단위로 담으며, 공사 위치(경도·위도), 도로정보, 도로등급(고속도로·일반국도·지방도·시군도 등), 공사 실제 시작·종료 일시를 포함한다. 위험물 운송 사업자나 안전 분석가가 '운송 경로상에 어느 등급 도로에서 언제 공사가 있었는가'를 확인하거나 공사 구간 분포를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크 등 다른 도로 데이터와는 좌표의 공간 매칭이나 도로명·도로등급 코드 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 위험물질운송안전관리시스템을 통해 전국을 운행하는 위험물질 운송차량의 단말기에 전송된 도로 공사정보를 수록한 자료로, 매년 1회 정기적으로 제공됩니다. 고속도로(101), 일반국도(103), 지방도(106), 시군도(107) 등 다양한 등급의 도로에서 진행되는 공사 정보를 포함하고 있으며, 도로별로 식별 가능한 등급 코드가 함께 제공됩니다. 이 데이터는 위험물 차량이 공사 구간을 사전에 인지하고 우회하거나 안전 운행을 유도하는 데 활용되며, 교통 혼잡 및 사고 가능성을 줄이기 위한 목적을 가지고 있습니다. 국민에게 해당 데이터를 제공함으로써 위험물질 운송의 안전성을 강화하고, 사고 예방과 도로 안전 확보를 위한 공공의 노력을 투명하게 공유하고자 합니다.도로등급 설명은 아래와 같습니다. 101고속도로102도시고속국도103일반국도104특별광역시도105국가지원지방도106지방도107시군도108기타
