summary_user: 하남시 ITS가 수집한 교통 정보를 도로 구간(링크)별·하루 단위로 집계한 파일로, 구간마다 최소·최대·평균 교통량과 속도, 그리고 원활·지체·혼잡이 발생한 시간대 수를 담는다(CSV 약 30KB). 교통 행정 담당자나 분석가가 '하남시에서 혼잡 시간대가 가장 많이 나오는 구간은 어디이고 평균속도는 얼마인가'를 확인해 혼잡구간 선정이나 개선 우선순위 판단에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 구간아이디를 하남시 ITS 링크 정보와 이름·코드로 맞춰 보거나 같은 기관 데이터끼리만 연결한다.
description_portal: 경기도 하남시 ITS에서 제공하는 일 단위 교통집계 정보로, 각 도로 구간의 하루 교통 패턴을 명확하게 파악할 수 있는 구조화된 자료이다. ‘구간아이디’는 각 도로의 특정 링크를 의미하며, 최소·최대·평균교통량은 구간별 이용수요와 흐름 특성을 분석하는 데 핵심 지표로 활용됩니다. 속도 항목(최소속도·최대속도·평균속도)은 해당 구간의 소통상태를 직관적으로 보여주며, 특히 평균속도는 구간 전체의 총체적 소통 수준을 나타냅니다. 또한 원활구간발생시간대수·지체발생시간대수·혼잡발생시간대수는 구간별 원활·지체·혼잡 패턴을 정량적으로 제시하여, 혼잡구간 선정·우선개선 대상 도출·신호운영 전략 수립 등 행정적 활용도가 매우 높습니다. 본 데이터는 도시 교통 혼잡 해소, 도로 개선 우선순위 판단, 출퇴근 시간대 관리 등 교통 혼잡도 행정활용에 필수적인 기반자료라고 할 수 있습니다.
