summary_user: 2013년 1월 1일 이후 신고된 이륜자동차를 한 대씩 담은 건별 등록 원장으로, 등록번호(뒷 2자리 마스킹)·관할/등록관청·최초등록일·연료·차종·모델·제작사·모델연도와 폐지 여부·폐지일을 전국 범위로 담는다. 분석가나 지자체 담당자가 '우리 관청 관할에서 최근 몇 년간 전기 이륜차 신규 신고가 얼마나 늘었고, 폐지는 얼마나 되나' 같은 등록 추이 통계를 낼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관청명·제작사명·차명 같은 이름 매칭이나 폐지차량 시도코드로만 느슨하게 연결한다.
description_portal: 이륜자동차정보는 2013년 1월 1일 이후 등록(신고)되어 운행중인 이륜자동차의 등록정보 등을 개방합니다.2026년 06월 30일 기준, 2013년 1월1일 부터 신고되어 있는 전체 등록이륜자동차 정보를 제공합니다.이륜자동차의 기본정보, 제원정보를 제공하고 있으며 제공하는 이륜자동차 정보는 이륜자동차등록번호(뒷2자리 마스킹), 관할관청명, 등록관청명, 최초등록일, 사용연료명, 차종명, 차종유형명, 차종분류명, 차명(모델), 용도구분명, 원동기형식명, 모델연도, 제작자명(브랜드), 폐지등록일, 폐지등록구분명, 폐지차량시도코드 항목을 제공합니다.이륜자동차정보를 활용하여 이륜차 등록 추이를 알 수 있는 통계자료 생산이 가능합니다.
