summary_user: 세종특별자치시의 불법주정차 단속 건을 한 행씩 담은 원천 파일로, 단속일자·단속시간·단속장소와 단속구분(고정형 CCTV, 주행형 CCTV, 민원·공익제보 등)을 기록하며 포털 설명상 2024년 1월 1일부터 2025년 7월 24일까지를 다룬다. 시민이나 분석가가 '세종시에서 어느 장소·시간대에 주정차 단속이 집중되는가, CCTV와 공익제보 중 어떤 방식으로 많이 적발되는가'를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속장소 이름을 주소·장소명으로 매핑하거나 같은 기관(세종시) 자료끼리 연결해 쓴다.
description_portal: 세종특별자치시 불법주정차 단속 현황 정보입니다.데이터는 2024년 1월 1일부터 2025년 7월24일의 세종특별자치시 불법주정차단속에 대한 연번, 단속일자, 단속시간, 단속장소, 단속구분(고정형 cctv, 민원(공익제보), 주행형 cctv 등) 에 대한 정보가 포함되어 있습니다. 단속장소는 조치원역광장-버스정류장, 조치원역광장-택시승강장, 세종교육청앞삼거리, 아름동주민센터, 세종국립도서관, 다정프라자 인근, 세종중앙농협, 소담동 소담6로, 어진동 보듬1로, 보람지구대 사거리 등이 있습니다.
