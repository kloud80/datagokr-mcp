summary_user: 대전도시철도 자동개집표기(게이트)에서 집계한 승차권 종류별 이용 실적을 영업일·역(역번호·역명)별로 담은 집계 파일로, 선불·후불 교통카드, 토큰, 전용카드, 무임교통카드(경로·장애·유공·다자녀), 프리패스를 어른·청소년·어린이 등으로 나눠 기록한다. 대전도시철도 운영·교통 분석가가 '역별로 무임승차(경로·장애 등) 이용 비중이 얼마나 되고 날짜별로 어떻게 달라지는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 역번호·역명을 이름·코드로 맞추거나 같은 대전교통공사의 역별 승하차 자료와 역 기준으로 이어 쓴다.
description_portal: 이 데이터는 대전도시철도에서 사용된 승차권 종류별 이용 현황을 제공하는 서비스입니다.교통카드, 토큰 등 승차권 종류별 통행량을 확인할 수 있으며, **자동개집표기(게이트)**를 통해 집계된 데이터를 기반으로 합니다.자료는 당해 연도 1월 1일부터 직전 월 말일까지의 기간을 포함하며,**열(column)**에는 역번호와 역명이 오름차순으로 정렬되어 있습니다.**행(row)**에는 승차권 종류별 일별 이용 실적이 나열되어 있으며, 이를 통해 승차권별 이용 패턴 및 수요 분석이 가능합니다.이 데이터는 일 단위로 제공되며, 교통카드 이용률, 종류별 통행량 비교, 이용자 유형 분석 등에 활용될 수 있습니다.
