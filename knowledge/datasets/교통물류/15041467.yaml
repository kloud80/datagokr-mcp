summary_user: 부산교통공사가 운영하는 도시철도 역별로 선명·역명·지상지하 구분·역층·상세위치마다 비치된 소화기의 종류와 보유대수를 담은 파일 데이터다. 역사 화재 안전 점검이나 연구를 하는 분석가가 "어느 역의 어느 층에 어떤 소화기가 몇 대 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 역 시설·안전 데이터와는 선명·역명 같은 이름을 맞춰 이어 쓴다.
description_portal: 부산교통공사에서 운영하는 도시광역철도역들의 철도운영기관명, 선명, 역명, 지상지하구분, 역층,  상세위치, 소화기종류, 보유대수의 데이터가 있습니다.소화기(消火器, fire extinguisher)는 불을 끄는 데 쓰이는 기구의 한 가지다. 주로 화재가 발생하는 등의 비상 사태에 사용되며, 분사하면 쉽게 불을 끌 수 있는 화학 물질이 채워져 있다. 손으로 들고 사용할 수 있으며 조작이 쉬워 화재 초기 단계에 사용한다.소화기를 분류하는 방법은 두 가지로, 분사 방식과 충전된 약제의 형태에 따라 분류할 수 있다. 전자의 경우 가압식과 축압식, 자기방출 방식, 자기반응식 등으로 구분할 수 있으며, 후자의 경우 포말 소화기, 분말 소화기, 할론 소화기, 이산화탄소 소화기 등으로 구분할 수 있다.
