description_portal: '데이터 개요국토교통부 항공통계시스템에서 제공하는 ‘항공통계 기본조회’ 기능은 국내 및 국제선 운항 실적을 월별 또는 연도별로 종합적으로 제공하는 대표 통계 서비스입니다.이 데이터는 항공운송 산업 전반의 규모와 추세를 한눈에 파악할 수 있도록, 운항편 수, 여객 수, 화물 수송량을 국내선·국제선 구분과 함께 제공하며, 전년 동기 대비 증감률이 포함되어 분석 및 보고에 활용하기 용이합니다.주요 제공 항목구분: 운항, 여객, 화물노선별 구분: 국내선, 국제선, 총계(소계)기간별 데이터: 사용자가 선택한 기간의 실적과 전년도 동기간 실적 제공증감률: 전년 동기 대비 실적 변화율(%)조건 설정 항목월별 또는 연도별 조회 가능엑셀 파일 형식으로 데이터 다운로드 가능항목별 상세 비교 기능 제공활용 사례항공시장 수요·공급 동향 파악전년 대비 실적 분석 및 정책 평가공항/항공사별 실적과의 종합 비교 기반자료보고서 작성용 기초 데이터로 활용 (정부/지자체/기업)데이터 예시구분2024-03 ~ 2024-032025-03 ~ 2025-03증감률(%)운항(편)- 국내15,57114,170-9.0- 국제42,16544,6065.8- 소계57,73658,7761.8여객(명)- 국내2,480,6362,195,078-11.5- 국제7,151,3667,557,8385.7- 소계9,632,0029,752,9161.3화물(톤)- 국내16,43015,205-7.5- 국제360,680368,9602.3- 소계377,110384,1651.9※ ‘소계’는 국내선과 국제선의 합계를 의미※ 전년 동월과의 비교가 자동 제공되어 추이 분석에 적합'
