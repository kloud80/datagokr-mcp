summary_user: 경기도 하남시 안에서 단속된 불법주정차를 건별로 담은 파일로, 위반 구분(보도 위반·주정차 금지구역 등), 단속 일시, 도로명·지번 주소, 위도·경도를 기록한다. 시 교통부서나 분석가가 "하남시에서 불법주정차가 반복되는 지점과 시간대는 어디인가"를 따져 단속 인력 배치나 계도 구역을 정하는 데 쓴다. 전국 공통 조인 키는 없어서, 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 경기도 하남시 전역에서 발생한 불법주정차 단속현황을 체계적으로 기록한 자료로, 생활도로의 안전 확보와 교통 혼잡 완화를 위한 핵심 행정정보입니다. 단속일시는 시간대별 위반 패턴을 파악하는 데 유용하며, 위치정보(위도·경도)는 GIS 기반 단속데이터로 활용되어 위반이 반복되는 위험지역을 공간적으로 분석할 수 있습니다. 특히 ‘보도 위반’과 ‘주정차 금지구역’이 다수를 차지해 보행 안전과 도로 기능 훼손 문제가 주요 단속 포인트임을 보여줍니다. 이러한 자료는 위험지역 집중분석 및 단속 인력 재배치, 민원 다발 구역 우선 관리, 캠페인·계도 활동 강화 등 교통질서 개선정책을 수립하는 데 실질적 근거로 활용될 수 있습니다.
