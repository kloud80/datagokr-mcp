summary_user: 인천공항 여객기 정기운항 스케줄을 편명 단위로 담은 API로, 시즌(동계/하계+연도)별 운항 시작일·종료일, 요일별 취항 여부, 출발시간, 터미널, 항공사, 도착지 공항, 코드쉐어 여부(마스터·슬레이브 편명)를 제공한다. 여행·관광 플랫폼 사업자가 "이번 시즌 인천에서 특정 도시로 가는 정기편은 무슨 요일, 몇 시에 뜨는가" 같은 질문에 답하거나 항공 일정 상품을 구성할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 운항·공항 데이터와는 항공사코드·도착지 공항코드(IATA)나 편명을 이름·코드 매핑으로 맞춰 잇는다.
description_portal: 여행 및 관광 플랫폼 기업을 위한 맞춤형 데이터로,코드쉐어,마스터편명,편명,정기운항 시작시간,시즌명,정기운항 시작일/종료일,요일별 취항여부,출발지 공항명,출발지 공항코드, 항공사명,항공사코드 및 추가현황 1/2의 정보를 제공합니다. 시즌별 데이터를 제공합니다. 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 10000 트래픽을 제공합니다. 하계시즌은 3월 말경에 동계시즌은 10월 말경에 협의되며 일정은 변경될 수 있습니다. tmp1/tmp2 의 추가현황 데이터는 필수 정보가 아니며 공지 없이 데이터 추가 및 상시 공백일 수 있습니다.
team:
  dept: 인프라DX팀
services:
  - op: /getSPaxFlt4TripPlatformDepartures
    name: 여객기 정기운항편 조회(관광플랫폼용) (출발)
    endpoint: https://apis.data.go.kr/B551177/statusOfSPaxFlt4TripPlatform/getSPaxFlt4TripPlatformDepartures
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: flightId
        required: false
        desc: 항공편명
      - name: season
        required: false
        desc: 시즌명 동계/하계+년도로 구성
      - name: terminalId
        required: false
        desc: '출발터미널 P01: 제 1터미널 P02: 탑승동 P03: 제 2터미널'
      - name: airport
        required: false
        desc: 인천공항에서 출발하는 편명의 도착지공항 한글명
      - name: airportCode
        required: false
        desc: 인천공항에서 출발하는 도착지 공항 코드 (IATA 공식 홈페이지 참조)
      - name: tmp1
        required: false
        desc: 추가현황1
      - name: tmp2
        required: false
        desc: 추가현황2
      - name: type
        required: false
        desc: 응답유형 [xml, json] default=xml
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getSPaxFlt4TripPlatformArrivals
    name: 여객기 정기운항편 조회(관광플랫폼용) (도착)
    endpoint: https://apis.data.go.kr/B551177/statusOfSPaxFlt4TripPlatform/getSPaxFlt4TripPlatformArrivals
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: flightId
        required: false
        example: OZ730
        desc: 항공편명
      - name: season
        required: false
        example: S25
        desc: 시즌명 동계/하계+년도로 구성
      - name: terminalId
        required: false
        example: P01
        desc: '도착터미널 P01: 제 1터미널 P02: 탑승동 P03: 제 2터미널'
      - name: airport
        required: false
        example: 하노이
        desc: 인천공항에도착 하는 편명의 출발지공항 한글명
      - name: airportCode
        required: false
        example: HAN
        desc: 인천공항에 도착하는 출발지 공항 코드 (IATA 공식 홈페이지 참조)
      - name: tmp1
        required: false
        desc: 추가현황1
      - name: tmp2
        required: false
        desc: 추가현황2
      - name: type
        required: false
        example: xml
        desc: 응답유형 [xml, json] default=xml
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
