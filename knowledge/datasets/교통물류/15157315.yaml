summary_user: 수원시가 불법주정차 단속을 위해 설치한 고정형 CCTV를 한 대씩 담은 위치 목록으로, 관리기관·단속구분·단속동·단속지역·위도·경도·설치일자를 담는다(CSV 약 52KB). 운전자나 주민이 '이 동네 어디에 주정차 단속 카메라가 있나'를 확인하거나, 분석가가 단속 CCTV 분포와 사각지대를 지도에서 살피는 데 쓴다. 전역 조인 키는 없어 위도·경도로 GIS 위에 다른 공간 데이터와 겹치거나 단속동(행정동 이름)으로 동 단위 통계와 이름 매칭해 잇는다.
description_portal: 경기도 수원시 불법주정차를 단속하기 위해 설치된 고정형 CCTV 위치(관리기관, 단속구분, 단속동, 단속지역, 위도, 경도 등) 데이터 입니다. 교통 흐름 개선, 교통 사고 예방, 불법주정차 다발 지역 분석 등 다양한 목적에 활용될 수 있습니다. 특히 교통행정, 안전정책 수립, 민원 처리 분석 등에 유용하며 CCTV 설치 효과 분석, 감시 사각지대 보완, 도심 내 교통질서 유지와 관련한 정책적 의사결정에도 활용 가능합니다. 또한 위치 기반 데이터이므로 GIS와 연계한 시각적 분석 자료로도 활용할 수 있으니 교통 관련 산업과 공공기관의 정보 기반 구축에 활용할 수 있습니다.
