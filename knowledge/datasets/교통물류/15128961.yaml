description_portal: 2024년 이사비 산출내역은 공익사업 시행에 따른 이주 대상자에게 지급되는 이사 비용 보상을 위한 기준 자료로, 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 시행규칙」 제55조 제2항 및 별표4에 따라 산정됩니다. 해당 기준은 공익사업 시행일 이후 계약 시점부터 적용되며, 대상자의 소유 여부(소유자 또는 세입자), 점유 형태, 이사 유형 등에 따라 이사비 금액이 결정됩니다. 산정된 이사비 합계는 원단위는 절사하여 지급액을 확정하며, 이는 보상금의 명확성과 행정의 일관성을 확보하기 위한 조치입니다. 본 자료는 공공사업 이주자 지원, 이사계획 수립, 보상금 산정 등의 실무에 활용되는 핵심 보상 관련 데이터입니다.
