summary_user: 한국철도기술연구원이 수행한 국가·민간 연구개발 사업을 과제 한 건당 한 행으로 정리한 파일로, 과제코드·연구사업명·사업 시작일과 종료일·연구책임자·발주처를 담는다. 철도 분야 연구자나 연구기획 담당자가 "어떤 발주처가 이 연구원에 어떤 철도 연구과제를 언제부터 언제까지 맡겼는가"를 확인하거나 유사 과제를 기획할 때 참고하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 발주처 기관명이나 연구사업명을 이름으로 맞춰 다른 연구과제·기관 자료와 연결해야 한다.
limits: 전역 조인 키가 없으므로 과제코드는 이 기관 내부 식별용으로 보고, 다른 R&D 과제 데이터와는 이름 매칭으로만 이을 수 있다. 지역 단위가 없는 전국·비공간 자료라서 지역별 분석에는 쓰지 못한다.
