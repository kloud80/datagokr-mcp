summary_user: 대구광역시 버스정보시스템(BIS)의 정류소 단위 기본정보(정류소 ID·이름·좌표·모바일 ID)와 노선·정류장 상세, 정류소별 도착예정, 노선별 버스 위치를 오퍼레이션별로 조회하는 API이며, 범위는 대구시 안의 개별 정류소·좌표 단위다. 대구 시민이나 앱 개발자가 "이 정류소에 내가 탈 버스가 몇 분 뒤에 오나", "이 노선 버스가 지금 어디쯤 있나"를 확인하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못했고, 정류소 ID(bsId)와 노선 ID를 먼저 이 API의 기본정보에서 받아 도착·위치 조회에 넘기는 식으로 내부에서 이어 쓰며, 다른 데이터와는 정류소 이름이나 좌표로 맞춰야 한다.
limits: 검증 때 5개 오퍼레이션 중 1개만 응답했고, 링크·실시간 도착·정류소·위치 조회(/getLink02, /getRealtime02, /getBs02, /getPos02)는 최소 파라미터로 응답이 없었으므로 정류소 ID·노선 ID를 먼저 확보해 넘겨야 한다. 개발계정은 하루 1,000회로 제한된다.
