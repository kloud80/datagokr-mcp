summary_user: PORT-MIS에 예선담당자가 등록한 예선(터그보트)을 한 척당 한 행으로 담은 전국 단위 원장 파일로, 관할 항구·예선사·선박명·호출부호·총톤수와 마력·추진기 형태·예항력·예항력 검사일자·진수일·선원 수를 함께 싣는다. 항만 운영자나 분석가가 "이 항구에는 어느 예선사의 몇 마력·예항력 예선이 배치돼 있고, 예항력 검사는 언제 받았나"를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으므로, 호출부호·선박번호나 항구명을 이름 매칭해 Port-MIS 입출항·선박 등록 자료와 이어 쓴다.
description_portal: 이 데이터는 해양수산부 해운항만물류정보시스템(PORT-MIS)을 통해 예선담당자가 등록한 예선현황을 파악하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 예선 등록 일련번호, 관할 항만명, 선박명, 선박 호출부호, 총톤수와 같은 선박의 기본정보 및 예선 마력, 추진기 형태, 예향력, 예향력 검사일자 등 예선과 관련된 정보 등으로 구성되어 있습니다.  본 데이터는 해운항만 관련 정책 수립, 항만 내 예선 운항 관리, 예선 선박 운영 및 효율성 분석, 항만 물류 프로세스 개선 연구 등 다양한 해운항만 업무에 활용될 수 있습니다.
