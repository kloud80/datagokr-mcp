summary_user: 경기도 일반국도 상시교통량 관측 지점별로 설·휴가·추석·연말 특별수송기간의 평균 집중률과 기간 내 최대 집중률을 연도별로 담은 집계 자료이며, 집중률은 지점 연평균일교통량 대비 해당 기간 평균(또는 최대일) 교통량 비율이다. 명절이나 휴가철에 어느 국도 노선·지점에 교통이 평소보다 얼마나 몰리는지 비교해 교통대책이나 이동 계획을 세우려는 교통 분석가·행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키는 없어, 노선코드(route_cd)·노선명·지점번호·시군명을 이름이나 코드로 맞춰 같은 기관의 상시교통량 자료 등과 이어 쓴다.
description_portal: '일반국도 상시교통량을 이용한 특별수송시간별(설, 휴가, 추석, 연말) 집중률 자료입니다.특별수송기간 도로별 집중률과 기간내 최대 집중률 정보를 제공합니다.도로별 집중률은 지점별 연평균교통량 대비 특별수송기간동안이 평균교통량 비율입니다.* 특별수송기간집중율 = (지점별특별수송기간평균 or 최대일교통량) / 지점별연평균일교통량특별수송기간은 아래와 같습니다.* 설기간 : 설 전후, 토요일, 일요일을 포함한 연휴기간* 휴가기간 : 7 월 마지막주, 8 월 첫째주 기간* 추석기간 : 추석 전후 토요일 일요일을 포함한 연휴기간* 연말기간 : 12 월 마지막주 기간'
