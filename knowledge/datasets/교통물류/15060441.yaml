summary_user: 인천교통공사가 운영하는 인천 1호선·2호선·7호선(인천·부천 구간)의 2024년 7월~2025년 6월 역별 월별 수송인원·승차인원·유입인원을 담은 집계 파일 데이터이며, 검증 수신 기준 852행이다. 인천 도시철도 역별로 월별 이용이 어느 정도인지, 어느 역에 승객이 몰리는지를 보려는 분석가나 상권·유동인구 검토자가 쓴다. 공통 조인 키는 없어 호선·역명 이름 매핑이나 같은 기관의 다른 코드를 통해서만 다른 데이터와 잇는다.
description_portal: 인천교통공사에서 운영 중인 도시철도 인천 1호선, 인천 2호선, 7호선(인천구간+부천구간)의 2024년 7월 부터 2025년 6월 까지 역별 월별 수송인원 현황자료입니다. 해당 데이터는 호선, 역명, 연도, 월, 수송인원(명), 승차인원(명), 유입인원(명) 항목으로 구성되어있습니다.인천1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개 역이 존재합니다.인천2호선은 검단오류역에서 운연역까지 총 27개 역이 운영 중입니다. 그리고 인천교통공사가 운영하는 도시철도 7호선은 까치울역에서 석남역까지이며 총 11개역을 운영 중에 있습니다.
