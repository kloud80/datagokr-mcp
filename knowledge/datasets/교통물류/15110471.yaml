summary_user: 대전광역시 도로관리시스템에 등재된 신호등제어기를 한 대씩 담은 시설물 목록으로, 관리번호·도로노선명·도로구간번호와 위도·경도 좌표를 개별 단위로 제공한다(CSV 약 61KB). 교통 분석가나 지자체 담당자가 '대전 시내 어느 도로 노선에 신호제어기가 몰려 있는가'처럼 신호시설 분포를 지도에서 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표로 공간 결합하거나 도로노선명·도로구간번호 같은 이름·기관 내부 코드로 맞춰 이어 쓴다.
