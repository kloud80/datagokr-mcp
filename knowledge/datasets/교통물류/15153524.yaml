summary_user: 인제군 관내 불법주정차 신고 건을 한 건씩 담은 파일로, 신고일시·신고 위치·과태료 부과 여부·위반구분(횡단보도·교차로 모퉁이·버스정류소·소방시설 인근 등)을 담는다(csv 약 26KB). 군 담당자나 주민이 '인제군에서 어느 위치·어떤 위반 유형의 불법주정차 신고가 많고, 그중 과태료가 실제로 부과된 비율은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 신고 위치(도로명·지번) 문자열을 주소 매핑하거나 같은 인제군 기관 데이터와 이름으로 맞춰 이어 쓴다.
