summary_user: 서울지하철 역별로 통행일자·시간대·교통카드 권종·사용자 유형별 승차·하차 인원 합계를 담는 API이다. 분석가나 상권 조사자가 특정 역의 시간대별 이용 패턴이나 혼잡을 가늠하는 유동인구 대체 지표로 쓴다. 전역 조인 키는 없고 역코드(stnCd)·역명(stnNm)·호선명 같은 같은 기관 코드나 이름 매핑으로만 다른 서울교통공사 역 데이터와 이어 쓴다.
description_portal: 서울교통공사 역별승하차인원 API는 서울지하철의 각 역사별 승차 및 하차 인원 현황을 조회할 수 있는 API입니다. 이용일 기준으로 역별 유동 인구 데이터를 수집하며, 통행일자, 통행시간, 역명, 역코드, 역번호, 승하차 인원, 교통카드구분코드, 교통카드 사용자 구분코드 등의 항목이 포함되며, 수시로 갱신되는 정보를 Rest API 방식으로 제공합니다. 대중교통의 혼잡도를 예측하거나, 시간대별 이용 패턴을 분석하는 등 다양한 교통 운영 분석에 활용될 수 있습니다. 데이터는 매일 갱신되며 최근 일주일치만 제공됩니다.
