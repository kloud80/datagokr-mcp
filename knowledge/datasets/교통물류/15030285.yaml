description_portal: 유통전문판매업은 식품을 직접 제조하거나 조리하지 않고, 제조된 식품을 보관, 운반, 판매하는 사업 형태입니다. 주로 온라인 쇼핑몰, 편의점 본사, 대형마트 본사 등이 이에 해당하며, 제품의 물류와 유통 경로를 관리합니다. 이 업종은 제품의 보관 상태, 유통기한, 표시사항 관리 등이 중요합니다.집단급식소 식품판매업은 급식소나 단체에 식품을 판매하는 업종으로, 학교, 기업, 병원 등 다수에게 식사를 제공하는 시설을 대상으로 반조리 식품, 식재료, 완제품 등을 공급합니다. 이 업종은 공급되는 식품의 안전성과 위생, 공급자의 위생관리 능력, 유통 과정의 냉장·냉동 체계 등이 핵심 요소입니다
