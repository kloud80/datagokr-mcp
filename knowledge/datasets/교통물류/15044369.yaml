summary_user: 2011~2020년 내압용기자동차(CNG 등 가스용기 장착 차량)의 검사 대수와 불합격 대수를 연도별·차종별(승용·승합·화물)로 집계한 소규모 CSV 파일(약 2.8KB)로, 행은 '구분' 열의 항목이고 열은 연도와 차종 조합으로 펼쳐진 넓은 표 형태다. 정책 분석가나 연구자가 '최근 10년간 내압용기 차량의 검사 불합격 추이가 차종별로 어떻게 변했는가'를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·차종 이름을 기준으로 맞춰 붙여야 하며, 자동차 등록·검사 통계와 이름 매핑으로만 연결된다.
limits: 건별 차량이나 검사 기록이 아닌 집계표여서 개별 차량·검사소 단위 분석에는 쓰지 못하며, 조인 키가 없어 다른 데이터와 자동 연결되지 않는다. 범위는 전국 단위의 비공간 자료로 확인되어 좌표나 행정코드 기반의 지도화는 불가능하다. 필드 목록상 2011년 승용 열이 보이지 않고 연도 표기("년도"/"년")와 공백이 섞여 있어 열 이름을 정규화한 뒤 써야 한다.
