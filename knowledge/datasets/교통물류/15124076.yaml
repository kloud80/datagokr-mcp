summary_user: 경기도 버스운송관리시스템(BMS)에서 모은 운수업체별 예비차 현황으로, 업체 한 곳당 예비차 총수와 일반·좌석·무정차·급행·시외무정차 유형별 대수를 담는다. 경기도 교통 담당자나 분석가가 "어느 운수업체가 비상 시 투입할 예비 좌석버스를 몇 대 갖고 있나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 업체아이디(entrps_id)를 경기도 BMS의 다른 업체·노선 자료와 같은 기관 코드로 맞춰 잇는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 통해 수집된 예비차량 현황 정보를 담고 있습니다. 각 운수 업체별로 등록된 예비차의 총수와 예비차의 유형(일반, 좌석, 무정차, 급행, 시외무정차)별 수량을 제공합니다. 주요 항목으로는 업체아이디, 예비차총수, 일반수, 좌석수, 무정차수, 급행차수, 시외무정차수, 갱신일자, 갱신아이디 등이 있으며, 이를 통해 각 업체의 차량 예비 운영 능력과 버스 서비스 형태를 파악할 수 있습니다. 데이터는 정기적으로 갱신되며, 교통정책 수립, 운영 계획 수립, 비상 시 차량 투입 등의 목적으로 활용될 수 있습니다.
