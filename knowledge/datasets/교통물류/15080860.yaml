summary_user: 경기도 안에서 이사화물·화물운송주선 등을 영위하는 업체를 한 행씩 담은 건별 현황으로, 시군명·인허가일자·영업상태·업종구분·업체명·도로명/지번 주소·연락처·위경도 좌표를 포함한다. 이사를 앞둔 주민이 우리 시군에서 영업 중인 이사화물 업체를 찾거나, 분석가가 시군별 이사·주선업체 분포와 밀도를 지도로 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소나 시군명으로 맞춰 이어야 하며, 허가받은 운송·주선사인지는 전국화물자동차운송사업자표준데이터와 대조해 확인한다.
description_portal: 이 데이터는 경기도 내에서 이사화물, 화물운송주선, 주선업 등을 영위하고 있는 업체들의 현황을 정리한 자료입니다. 각 업체의 시군명, 인허가일자, 영업상태, 업종구분, 업체명, 사업장 주소, 연락처, 좌표정보 등을 포함하고 있어 지역 내 물류 및 이사 서비스 사업체 분포를 파악할 수 있습니다. 이 자료는 이사·운송 산업의 지역 기반 현황을 분석하거나 소비자 서비스 접근성 검토, 정책적 지원 대상 사업체 선별, 물류 네트워크 구축을 위한 기초 자료로 활용될 수 있습니다. 특히 주소 기반의 정제된 위치정보는 지도 기반 분석이나 지역 특성에 따른 업체 밀도 분석에도 유용합니다.
