summary_user: 부산광역시 남구의 도로조명시설(가로등·보행등)을 구분, 전력(와트), 수량으로 묶은 집계 현황 파일로, 개별 등기구 위치가 아닌 종류별 합계를 담으며 파일 크기는 235바이트로 매우 작다. 남구에 어떤 전력의 가로등·보행등이 몇 개 설치돼 있는지 확인하거나, 고효율등 교체에 따른 시설 구성 변화를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름(부산 남구)이나 같은 기관 기준으로만 맞춰 이어 쓴다.
description_portal: 가로등은 공공도로에 설치하는 조명시설로서 도로 밤거리를 밝혀 운전자의 시인성 개선이 가능하다. 보행등은 도로 양옆의 인도에 설치되는 도로조명시설로서 인도 보행에 도움을 기한다.도로조명시설(가로등,보행등) 고장으로 인한 등기구 교체를 진행 중이며, 즉 해당 도로의 적정 조도를 책정하여 적절한 광원으로 교체한다. 또한, 도로조명시설 중 가로등은 구 재정 여건 상 전기요금 절감을 위해 시행한 격등제가 교통사고 발생 증가에 영향을 준다고 인식되었으나 2014년부터 도로조명시설 주광원을 에너지 절감형 고효율 메탈할라이드등과 LED등으로 교체추진하면서 전등제 구간을 확대해 나가고 있어, 점차 그 문제를 해소해 나가고 있으며, 고효율등 적용으로 전기용량이 절감되어 전등제를 시행하면서도 격등제 시행시기와 견줄만한 전기요금을 유지하고 있어 국가 에너지 절감 정책과 구 재정 건전성 향상에 부합할 뿐만 아니라 도로통행자(운전자, 보행자 등)의 야간 통행불편해소와 안전사고를 미연에 방지하는데도 큰 기여를 하고 있다. 위 원인으로  부산광역시 남구 도로조명시설 현황이 매년 달라지며, 이에 가로등(보행등 포함)을 구분, 전력, 수량으로 현황 정보를 제공한다.
