summary_user: 분당선 도시광역철도역의 장애인화장실 위치를 화장실 한 곳당 한 행으로 담은 파일로, 운영기관·선명·역명·지상/지하 구분·역층·게이트 안팎·출구번호·상세위치·화장실 구분을 기록한다(csv 약 8KB). 휠체어 사용자나 교통약자 이동 지원 서비스 개발자가 '분당선 이 역의 장애인화장실은 개찰구 안쪽 몇 층 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 노선의 장애인화장실·편의시설 데이터나 역 정보와는 역명·선명을 맞춰 이어 쓴다.
