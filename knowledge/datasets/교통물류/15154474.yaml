summary_user: 대전광역시 유성구 관내에 접수된 불법주정차 신고를 건별로 담은 파일로, 신고일시·신고위치·과태료부과여부가 들어 있으며 포털 설명 기준 약 2만 3천여 행입니다. 주민이나 분석가가 유성구에서 불법주정차 신고가 어느 장소·시간대에 몰리고, 신고 가운데 과태료로 이어진 비율이 얼마인지 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명이나 신고위치 주소를 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 대전광역시 유성구 불법주정차 신고 현황에 대한 데이터를 제공합니다.해당 데이터는 시도명, 시군구명, 신고일시, 신고위치, 과태료부과여부 데이터를 포함하여, 총 23508개의 행으로 구성되어 있습니다.이 데이터는 유성구 관내  불법주정차 신고 등의 정보를 포함하고 있어 데이터 이용자의 정보 접근성과 행정자료 검색의 효율성 향상에 기여할 수 있습니다. 이를 통해 정책 분석, 행정자료 활용, 공공행정 연구, 위치기반 서비스 개발, 학술기관 연구 등 다양한 분야의 기초 자료로 활용이 가능합니다.
