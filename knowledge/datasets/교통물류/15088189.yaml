summary_user: 충청남도 보령시 관내에 설치된 방호울타리를 시설 한 건씩 담은 파일로, 설치장소·관리기관·방지책 종류·재질·연장(미터)과 위도·경도 좌표를 포함한다. 도로 관리자나 분석가가 "보령시 어느 구간에 어떤 재질의 방호울타리가 얼마나 설치돼 있고 누가 관리하나"를 확인하거나, 노후 시설 교체·신규 설치 우선순위를 검토할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표로 위치를 겹쳐 보거나 설치장소·관리기관 이름으로 맞춰 이어 쓴다.
limits: 보령시 한 곳만 다루므로 다른 시군과 비교하려면 별도 데이터를 모아야 한다. 공통 코드 키가 없어 사고·도로 데이터와의 연결은 좌표나 이름 매칭에 의존한다.
