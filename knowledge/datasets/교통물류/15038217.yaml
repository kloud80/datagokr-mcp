summary_user: 경기도 김포시 안의 고가도로를 한 건씩 담은 파일 목록으로, 고가도로명·읍면동·도로구간번호·구조물등급·종별·총연장(미터)·위경도를 담는다. 시 도로관리 담당자나 지역 분석가가 김포시 어느 읍면동에 어떤 등급의 고가도로가 얼마나 긴 연장으로 분포하는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 위경도로 지도나 표준노드링크 위에 겹쳐 보거나, 읍면동 이름·도로구간번호를 기준으로 같은 기관의 도로 자료와 이름 매칭으로 잇는다.
description_portal: 경기도 김포시의 고가도로 현황에 대한 정보를 제공합니다. 제공 항목으로는 읍면동구분, 도엽번호, 도로구간번호, 고가도로명, 구조물등급, 위도, 경도, 종별, 총연장(미터), 비고1, 비고2로 구성되어있습니다. 본 데이터를 통해 김포시 내 고가도로 현황과 지역별 분포 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 공공데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시청 도로관리과로 연락주시기 바랍니다.
