summary_user: 전 세계 항공 관련 기관·업체를 한 행에 한 곳씩 담은 목록으로, 기관 유형(공항운영자·국제기구·정부기관·협회 등), 한글·영문 명칭, 약어, 국가명, 홈페이지 주소를 수록한 약 32KB 규모의 CSV 파일이다. 항공 분야 연구자나 정책 담당자가 '특정 국가의 항공청·공항운영자는 어디이고 공식 홈페이지는 무엇인가'를 확인하거나 해외 협력 대상 기관 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 항공 데이터와는 기관명칭·약어·국가명을 이름 매칭하는 방식으로만 이어 쓴다.
