description_portal: '데이터 개요국토교통부_항공관련기관및업체_정보는 전 세계 항공 관련 주요 기관 및 업체에 대한 정보를 제공하는 데이터입니다. 각 기관의 유형(공항운영자, 국제기구, 정부기관, 협회 등)을 포함하여 명칭, 영문명, 약어, 국가명, 공식 홈페이지 주소 등을 수록하고 있어, 항공 정책·산업·국제 협력 관계 분석에 활용할 수 있습니다.데이터 제공 항목구분: 기관 유형(예: 공항운영자, 국제기구, 협회 등)기관명칭: 기관의 한글 공식 명칭기관영문명: 기관의 영문 표기약어: 공식적으로 사용하는 영문 약칭 (해당 시)국가명: 해당 기관이 위치한 국가홈페이지: 기관 또는 업체의 공식 웹사이트 주소출처 및 갱신 주기국토교통부 및 산하기관, 국제기구(ICAO, IATA 등), 각국 항공청 및 공항공사에서 수집된 항공 관련 조직 정보항공 행정 및 산업 분야에서 참고 가능한 조직 리스트 제공일부 데이터는 정기적으로 업데이트되며, 항공 관련 국제협력망 구축에도 활용됨활용 안내전 세계 항공 기관과 업체 간 비교 및 네트워크 파악국제 항공 정책 수립 시 참고 기관 리스트 확보산업 동향 분석, 공공 협업 파트너 식별, 해외 기관 접촉 기반자료항공 분야 연구자 및 정책 담당자의 기초 정보 수집에 유용데이터 해석 시 유의사항일부 공공기관은 산하기관 단위로 구분되며, 명칭이 유사할 수 있음영문명 및 약어는 각 기관 공식 표기를 기준으로 하며, 약어 미표기 시 공란일 수 있음홈페이지 주소는 변경될 수 있으므로 사용 시 최신 주소 확인 권장예시 데이터구분기관명칭기관영문명약어국가명홈페이지공항운영자광주공항Gwangju International AirportKoreawww.airport.co.kr/gwangju/main.do공항운영자군산공항Gunsan AirportKoreawww.airport.co.kr/gunsan/main.do공항운영자김포국제공항Gimpo International AirportKoreawww.'
