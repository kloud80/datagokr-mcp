summary_user: 한국철도공사가 보유한 철도차량 대수를 연도(시점)별로 집계한 전국 단위 파일로, KTX·SRT·KTX-이음 같은 고속철도차량부터 디젤·전기 기관차, 동차, ITX-청춘, 객차, 발전차, 화차, 기중기까지 차종별 열에 담는다(CSV 772바이트의 작은 표). 정책연구자나 분석가가 "최근 몇 년 사이 고속철도차량은 늘고 기관차·화차는 줄었나"처럼 차종별 보유 대수의 증감과 구성 변화를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(시점)를 기준으로 수송실적·화물 통계 등 같은 기관의 연도별 표와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
limits: 차량 단위나 노선·지역별 배치 정보가 없는 전국 연도별 합계라 차량 연식·노후도나 지역별 운용 현황은 알 수 없다. 공통 코드 키가 없어 다른 데이터와 자동으로 결합되지 않고 연도나 차종 이름을 직접 맞춰야 한다.
