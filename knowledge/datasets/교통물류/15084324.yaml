summary_user: 광주광역시 남구에서 접수된 도로 굴착 허가를 공사 건별로 담은 파일로, 공사명·주소·신청자·착공일·준공일·처리상태를 시군구 범위의 개별 주소 단위로 기록한다(csv 약 6KB). 주민이나 사업자가 "우리 동네 도로를 언제, 누가, 어떤 공사로 파는가"를 확인하거나 분석가가 지역 공사 이벤트를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 매핑하거나 같은 기관(남구) 데이터끼리 이름으로 맞춰 이어 쓴다.
description_portal: 광주광역시 남구 도로 굴착 허가 정보(공사명, 공사 장소, 신청자, 착공일 및 준공일, 처리상태 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 건설과(☎062-607-4042)에서 제공합니다. 처리상태에 따라 착공일자, 준공일자가 미기재된 공사가 있으니 참고 하시기 바랍니다.※ 상·하수도, 전기, 통신, 가스관 등 지하 매설물 설치·보수 시 도로를 굴착해야 하므로, 무분별한 굴착을 막고 도로 안전과 원활한 교통을 보장하기 위함이며, 절차는 다음과 같습니다. - 공사 계획 수립- 해당 부서에 허가 신청- 굴착 위치, 면적, 기간, 복구 계획 등 검토- 허가증 발급 후 공사 진행
