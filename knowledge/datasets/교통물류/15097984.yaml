summary_user: 전북특별자치도 14개 시군의 과속방지턱을 한 개씩 위치(주소·좌표) 단위로 담은 건별 데이터로, 포털 설명상 2020년 기준 20,966건이 구축돼 있다. 운전자나 내비·지도 서비스 개발자가 '이 도로 구간에 과속방지턱이 어디 있나'를 확인하거나, 분석가가 시군별 과속방지턱 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표 또는 시군 이름으로 맞춰 이어야 하며, 전국 통일 형식인 무인교통단속카메라·어린이보호구역 표준데이터와 위치 기준으로 겹쳐 쓰는 방식이 현실적이다.
limits: 2021년 사업에서 카카오·네이버 로드뷰로 조사한 2020년 기준 자료라 실제 현장과 다를 수 있고 법적 효력이 없다. 공통 코드 키가 없어 주소·좌표나 이름 매칭으로만 연결되며, 개발계정은 하루 100회까지 호출된다.
