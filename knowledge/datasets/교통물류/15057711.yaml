summary_user: 경기도 31개 시군에서 인허가를 받은 시내버스 운수업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록입니다. 사업장명, 인허가일자, 영업상태, 면허 유효기간, 소유형태, 업체유형, 지정정비업종, 주소, 좌표, 소재지 면적이 들어 있습니다. 교통 분석가나 정책 담당자가 어느 시군에 어떤 버스업체가 영업 중이거나 폐업했는지, 업체 분포가 어떤지를 살필 때 쓰며, 전역 조인 키는 없으므로 시군 코드·이름(SIGUN_CD)으로 다른 시군 통계와 맞추고 좌표(WGS84)로 노선·정류장 데이터와 공간 결합합니다.
description_portal: 경기도 내 시내버스업체 현황은 도내에서 인허가를 받아 운행하는 시내버스 운수업체의 정보를 제공합니다. 시내버스는 도심과 부도심, 도심과 외곽, 또는 인접 시군 간을 연결하며 광역, 간선, 지선 등 다양한 노선을 통해 주민들의 주요 교통수단 역할을 하고 있습니다. 이 데이터에는 각 업체의 사업장명, 인허가일자, 영업상태, 등록일자, 면허 유효기간, 소유형태, 업체유형 등이 포함되어 있으며, 지정정비업종 관련 코드 및 명칭도 제공되어 버스 정비 관리 체계까지 확인할 수 있습니다. 또한 위치 정보로 도로명주소, 지번주소, 우편번호, WGS84 좌표가 제공되어 GIS 시스템이나 지도 시각화 서비스와 연계가 가능하며, 업체별 사업장 규모를 파악할 수 있도록 소재지 면적까지 포함되어 있습니다.이 데이터는 행정안전부가 관리하며, 경기도 31개 시군의 인허가 데이터를 기반으로 수집된 것입니다. 다만 지방행정데이터개방시스템 개편에 따라 2018년 9월 이후 갱신이 중단되었으므로, 이후의 최신 정보는 별도의 행정자료를 통해 확인해야 합니다. 활용 예시로는 경기도 내 버스업체 분포 분석, 교통 정책 수립, 버스 노선 운영 효율화, 교통 인프라 투자 방향 검토 등이 있으며, 특히 위치 좌표와 결합하여 시군별 교통 편의성 평가나 대중교통 접근성 개선 정책 연구에 활용할 수 있습니다.궁극적으로 이 데이터는 주민의 생활 편의를 책임지는 시내버스 교통망을 관리하고, 경기도 전역에서 균형 잡힌 대중교통 서비스를 제공하기 위한 기초 자료로서 가치가 큽니다.
