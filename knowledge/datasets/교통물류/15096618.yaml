summary_user: 전북특별자치도 내 유치원·어린이집 주변 어린이보호구역의 안전 정보를 담은 파일로, 시설명(SCHOOL_NM)별로 조사일자·요일·시간대와 유형별 이동량 집계(COUNT_P_1~6) 같은 현장 조사 결과를 담는다. 지자체 교통안전 담당자나 분석가가 '어느 유치원·어린이집 앞 보호구역의 통행량이 많아 단속카메라나 안전 펜스를 먼저 설치해야 하는가'를 따질 때 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어, 어린이보호구역·무인교통단속카메라 표준데이터 등과는 시설명 등 이름 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와 연결하려면 시설명 매핑이 필요하다. 포털 설명상 2021년 공공데이터 뉴딜 사업으로 수집된 자료이며, 범위는 전북특별자치도 단위로 좌표 같은 공간 정보가 없는 비공간 데이터다.
