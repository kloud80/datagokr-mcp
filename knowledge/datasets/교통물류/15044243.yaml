summary_user: 서울교통공사 구간 역별 연간수송인원(승차인원+환승유입인원)을 순위와 함께 담은 파일 데이터로, 검증 시 286행을 받았다. 분석가나 상권 담당자가 어느 역의 연간 이용 규모가 큰지, 순위가 어떻게 되는지 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않아, 호선·역번호·역명 필드로 같은 기관 데이터와 이름·코드 매핑을 거쳐 이어 쓴다.
description_portal: 서울교통공사 연간수송인원 수송순위에 대한 데이터 입니다. 이 데이터는 수송순위,  역명, 연간수송인원(명) 데이터를 제공합니다. 수송인원은 승차인원과 환승유입인원의 합으로 계산됩니다. 승차인원은 공사구간에서 게이트를 통과한 인원(개표한 인원)을 정의합니다. 또한, 환승유입인원의 정의는 하차인원 중 승차한 호선이 다른 인원을 의미합니다.(자구간 유입 및 타구간 유입인원 포함) 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
