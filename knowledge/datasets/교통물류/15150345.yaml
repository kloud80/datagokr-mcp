summary_user: 전국 지방항공청(서울·부산·제주)에 설치 신고된 항공장애물을 건별로 나열한 시설 원천 파일로, 장애물 이름·종류, 지면·해수 기준 높이, 위도·경도 좌표, 저광도·중광도·고광도 표시등의 종류별 개수를 담는다(작성 기준 2019~2025년, CSV 약 2.2MB). 건설·통신 사업자나 드론·저고도 운항 분석가가 "우리 지역 반경 안에 높이 몇 m 이상의 장애물이 어디에 있고 표시등은 어떻게 달려 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표를 이용한 공간 결합이나 장애물 이름 매칭으로만 잇는다.
description_portal: '한국교통안전공단은 안전한 저고도 운항환경 조성을 위해 국내 설치된 항공장애 표시등 및 주간표지를  정기적으로 검사하고 있습니다.해당 데이터는 항공장애 표시등 및 주간표지 등 검사를 위한 기본 시설정보에 대한 내용입니다.각 지방항공청(서울, 부산, 제주)으로 소유 관리자가 설치 신고한 설치물 기준으로 나열되어 있습니다.장애물 이름, 종류, 지면 높이, 해수 높이 ,위도, 경도, 등의 종류 및 개수 등에 대한 정보를 포함하고 있습니다. 이를 통해 공역 내 항공장애물(장애등, 주간표지 등) 분포와 특성을 파악하고, 안전기준에 따른 적절한 조치를 위한 기초 자료로 활용됩니다.작성 기준 연도 :  2019~2025'
