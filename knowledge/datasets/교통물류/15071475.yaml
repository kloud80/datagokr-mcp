summary_user: SRT 고속열차가 정차하는 수서·동탄·평택지제·부산·목포 등 32개 역의 수송승차 실적을 연도별로 집계한 표로, 한 행이 한 연도이고 역이 열로 펼쳐진 작은 CSV 파일(1,886바이트)이다. 교통 분석가나 지자체 담당자가 특정 SRT 역의 연간 승차 인원이 개통 이후 어떻게 늘거나 줄었는지 확인하는 데 쓴다. 전역 조인 키가 없어서, 다른 철도·역 데이터와는 역 이름을 직접 맞춰 붙이거나 같은 기관(에스알) 데이터끼리만 이어 쓴다.
limits: 연도별 승차 합계만 담고 있어 시간대별 승하차나 출발·도착(OD) 흐름은 알 수 없다. 역 코드나 좌표가 없는 비공간 집계이므로, 지도나 다른 기관 데이터와 연결하려면 역 이름을 직접 매핑해야 한다.
