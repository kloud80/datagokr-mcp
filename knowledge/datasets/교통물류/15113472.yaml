summary_user: 광주광역시 광산구의 도로조명 시설물(가로등)을 분전함 관리번호 단위로 담은 파일로, 행정동·설치주소·등기구 종류·가로등 수·관리기관을 기록한다. 주민이나 분석가가 "우리 동네 어느 분전함에 가로등이 몇 개 있고 LED로 바뀌었는가"처럼 야간 조명 현황과 안전 취약 구간을 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 설치주소를 매핑하거나 같은 광산구의 다른 시설물 파일과 맞춰 이어 쓴다.
description_portal: 광주광역시 광산구  야간 안전사고 및 범죄 사전 예방을 위한 도로조명 시설물(가로등)의 현황(관리번호, 설치주소, 가로등 수, 관리기관명 등)으로 구성된 데이터 입니다.* 등기구 종류는 현장 여건에 따라 다수 설치된 시설물로 표출하였음을 알려드립니다.(분전함 1면에 LED와 램프등이 같이 설치된 경우 다수의 등기구로 표시)* 매년 등기구 개선(LED교체) 사업을 진행중에 있어 등기구 종류가 변경될 수 있습니다.(메탈램프 -> LED)* 도시개발 및 도로건설 등 추가적으로 도로조명시설이 증가함에 따라 가로등 수량이 증가할 수 있습니다.* 등기구 종류 및 수량은 건수가 많아 모든 데이터가 표출되지 않으니, 시설지원과 조명전기팀으로 문의 바랍니다.도로조명시설 설치 현황은 광주광역시 광산구 도로조명시스템(http://gjgs.roadlighting.kr/)에서 확인이 가능합니다.
