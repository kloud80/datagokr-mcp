summary_user: 대구광역시 달서구 민영주차장을 주차장 한 곳당 한 행으로 담은 파일로, 주소·위경도와 주차구획수, 요일별 운영시각, 기본·추가·1일·월정기 요금을 담는다(CSV 약 13KB, 달서구 범위). 달서구 주민이나 방문객이 '이 근처 민영주차장 중 토요일에 운영하고 월정기권이 있는 곳은 어디이고 요금은 얼마인가'를 찾을 때, 또는 분석가가 구 단위 민간 주차 공급을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주차장명·주소 매칭이나 위경도 근접으로 잇고, 주차장관리번호 형식이 같다면 전국주차장정보표준데이터 원장과 대조하는 보조 자료로 쓴다.
