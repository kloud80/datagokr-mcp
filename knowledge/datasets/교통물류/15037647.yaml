summary_user: 서울 강남구에 등록된 자동차 대수를 연료종류(경유·LPG·CNG·수소·기타연료 등)와 사업용·비사업용 용도별로 나누고, 승용·승합·화물·특수 차종별 대수와 총등록대수로 집계한 작은 CSV 파일(약 2.3KB)이다. 강남구의 친환경차·경유차 비중이나 사업용 차량 구성을 확인하려는 분석가나 주민이 '강남구에 수소차·LPG차가 몇 대 등록돼 있나' 같은 질문에 쓴다. 전역 조인 키는 없어 다른 시군구의 연료별 등록현황이나 전국 자동차 등록 통계와는 시군구명·연료종류 이름을 맞춰 붙여야 한다.
description_portal: 서울특별시 강남구 연료별 자동차 등록 현황으로 시군구명, 연료종류, 용도, 승용, 승합, 화물, 특수 등록대수, 총등록대수, 관리기관, 데이터기준일자 정보입니다연료종류는 차량이 사용하는 에너지의 종류로 구분되며, 대표적으로 압축천연가스(CNG), 경유, 기타연료, 수소, 액화석유가스(LPG) 등이 포함되어 있습니다. 용도 항목은 해당 차량이 어떠한 목적으로 사용되는가를 나타냅니다. 여기에는 사업용과 비사업용이라는 두 가지로 나뉘며, 사업용은 영업 활동을 위해 사용되는 차량, 비사업용은 개인적인 용도로 쓰이는 차량을 뜻합니다. 또한 등록대수를 파악할 수 있는 세부 분류로는 승용 차량, 승합 차량, 화물 차량, 특수 차량 등이 있으며, 각각의 분류별로 등록된 차량의 대수를 별도로 집계합니다.
