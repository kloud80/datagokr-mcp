description_portal: 이 데이터는 부산광역시 영도구 마을버스 노선 현황과 관련된 것입니다.영도구는 영도여객(주), (주)대일버스 2개의 마을버스 업체가 있습니다.영도여객은 전화번호가  412-3440이며, 영도구1번과 영도구2번을 관리하고 있습니다.영도구1번은 운행대수가 3대이며, 소요시간은 36분, 운행거리는 8.8km, 배차간격은 약 18분입니다. 첫차는 6시 20분, 막차는 21시 45분입니다.운행구간은 홈플러스~대교사거리~강남병원~흰여울문화마을~유림아파트입니다.영도구2번은 운행대수가 3대이며, 소요시간은 36분, 운행거리는 7.8km, 배차간격은 약 18분입니다. 첫차는 6시 15분, 막차는 21시 35분입니다.운행구간은 영선동반도보라아파트~대평동~(구)전차종점~선용품유통센터~남항초등학교~체육공원입니다.대일버스 연락처는 403-7782이며, 영도구5, 영도구7 마을버스를 관리하고 있습니다.영도구5번은 운행대수가 10대이며, 소요시간은 80분, 운행거리는 45km, 배차간격은 약19분입니다. 첫차는 6시, 막차는 22시입니다.운행구간은 동삼그린힐~영도구청~고신대~중복도로~이송도~남포역~연안부두입니다.영도구7번은 운행대수가 1대이며, 소요시간은 18분, 운행거리는 5.3km, 배차간격은 30분입니다. 첫차는 6시, 막차는 22시입니다.이 데이터는 영도구 마을버스 운행 관련 정보를 이해하는데 도움이 되는 자료입니다.
