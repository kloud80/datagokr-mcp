summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 정류소를 교통카드 시스템 기준으로 정리한 정류장 원장으로, 정류장 한 곳당 한 행에 이비(교통카드) 정류장 아이디·정류장 아이디·정류장명·정류장번호·좌표·법정동코드·사용 여부를 담는다. 교통카드 승하차 데이터에 찍힌 정류장이 어디인지, 지금도 쓰이는 정류장인지 확인하려는 분석가나 경로 안내·GIS 서비스 개발자가 쓴다. 정류장 아이디(sttn_id)를 조인 키로 버스 노선·도착·승하차 데이터와 잇고, 법정동코드로 행정구역 통계와 묶어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에 등록된 정류소 정보를 기반으로 한 데이터로, 교통카드 시스템과 연동된 정류장 정보를 포함하고 있습니다. 주요 항목은 이비정류장아이디, 정류장아이디, 정류장명, 시도관련코드, 기관코드, 좌표정보(Y좌표/X좌표 및 지역좌표), 정류장번호, 사용 여부 등을 포함합니다. 이 데이터를 통해 경기도 내 버스정류소의 위치와 관리 현황을 파악할 수 있으며, 대중교통 경로 안내 서비스, 교통정보 시스템 구축, 정류소 최적화 및 통합관리, 지리정보시스템(GIS) 연계 분석 등에 유용하게 활용될 수 있습니다.
