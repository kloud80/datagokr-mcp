summary_user: 전라남도 곡성군에 설치된 과속방지턱을 한 개씩 담은 건별 데이터로, 관리번호·설치장소·도로명/지번 주소·위경도와 함께 재료·형태·높이·폭·길이, 표준 여부 같은 시설 제원을 담는다. 운전자나 내비·지도 서비스 개발자가 '곡성군 어느 도로 어디에 과속방지턱이 있고 규격에 맞게 설치됐는가'를 확인하거나, 군 단위 도로 안전시설 현황을 분석할 때 쓴다. 전국 공통 조인 키는 없어 주소(도로명·지번)나 위경도 좌표로 같은 지역의 무인교통단속카메라·어린이보호구역 등 다른 교통안전 데이터와 공간적으로 맞춰 쓴다.
description_portal: 과속방지턱관리번호, 설치장소, 과속방지턱재료 등의 과속방지턱 데이터 정보를 제공하는 전라남도 곡성군 과속방지턱 정보 데이터 조회 서비스
