summary_user: 전라남도 시군별로 등록된 건설기계 대수를 2024년 1월~6월 월별(및 2025년 6월 열)로 정리한 시군구 단위 집계 표이며, 파일 크기는 약 1KB의 소규모 CSV다. 지역 건설 경기나 장비 수요를 보는 분석가·사업자가 '전남에서 건설기계가 가장 많이 등록된 시군은 어디이고 상반기 동안 어떻게 변했나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 시군구 통계와는 시군 이름(구분)을 행정구역 코드에 직접 매핑해 이어 써야 한다.
description_portal: '- 전라남도 내 각 시군별로 등록된 2024년 상반기(1월~6월) 건설기계 등록현황에 대한 자료를 조회하실 수 있습니다.- 건설기계 등록 및 관리 : 전라남도 내에서 건설기계를 등록하고 관리하는 기관은 전라남도청과 각 시군청입니다. 건설기계의 등록, 말소, 이전, 변경 등은 해당 기관을 통해 처리할 수 있습니다.- 전라남도청 건설교통국 : 건설기계 관련 정책 수립 및 총괄 관리- 각 시군청 건설과 : 건설기계 등록 및 민원 처리- 건설기계 등록 시 필요 서류 : 신분증, 차량 등록증, 보험 가입 증명서 등- 건설기계 면허 취득 요건 : 만 18세 이상, 관련 교육 이수, 면허 시험 합격 등- 건설기계 안전 운전 수칙 : 정기적인 점검, 안전 장비 착용, 도로 교통법 준수 등'
