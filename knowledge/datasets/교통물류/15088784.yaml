description_portal: '이 데이터는 경기도 양주시에서 운영하는 공공형 택시의 현황을 다루고 있으며, 교통 소외 지역 주민들의 이동 편의를 위한 교통 복지 서비스의 일환으로 제공되고 있다. 주요 항목으로는 공공형 택시가 운영되는 기관명, 유형(공공형/일반형), 읍면동 및 마을명, 세부 출발지 정보가 포함된다. 또한, 이용 시작·종료 시간(예: 06:00~22:00), 이용요금(주로 1,000원 고정 요금), 이용 가능한 횟수(1일 기준 60회 제한 등), 월 평균 이용자 수와 건설 지원 금액 등도 제공된다. 이를 통해 공공형 택시가 교통취약지에서 어떻게 운영되고 있는지, 주민 이동 수요를 얼마나 충족시키는지 확인할 수 있다. 특히, 이용요금이 저렴하게 설정되어 있어 교통 복지 정책의 실질적 효과를 보여주며, 행정기관에서 운영 실적을 바탕으로 정책 개선이나 예산 지원 방향을 결정하는 기초자료로도 활용된다. 따라서 이 데이터는 교통복지 실현, 지역 교통격차 해소, 주민 삶의 질 향상을 위한 중요한 참고자료가 된다.'
