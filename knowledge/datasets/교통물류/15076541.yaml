description_portal: '제주특별자치도에서 제공하는 어린이보호구역 내 폐회로텔레비전 관련 데이터를 제공합니다.항목: 설치목적구분, 카메라대수, 보관일수, 위도, 경도 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 어린이 보호구역의 도로 중에서 행정안전부령으로 정하는 곳에 우선적으로 제4조의2에 따른 무인 교통단속용 장비를 설치하여야 한다.'
