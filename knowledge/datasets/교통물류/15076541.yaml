summary_user: 제주특별자치도 어린이보호구역 안에 설치된 폐회로텔레비전(CCTV)을 설치 지점별로 담은 파일로, 관리기관·주소·설치목적·카메라 대수·촬영방면·영상 보관일수·위도·경도를 한 행씩 기록한다. 학부모나 지역 분석가가 "우리 아이 학교 앞 보호구역에 CCTV가 몇 대, 어떤 목적으로 설치돼 있고 영상은 며칠 보관되나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도에 따른 위치 매칭이나 주소·관리기관명 같은 이름 매칭으로만 잇는다.
limits: 표준 행정코드 같은 공통 키가 없어 어린이보호구역·단속카메라 등 다른 데이터와 바로 조인되지 않는다. 범위는 제주특별자치도 한 곳뿐이라 전국 비교에는 다른 시도 데이터가 따로 필요하다.
