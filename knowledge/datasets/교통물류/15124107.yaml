summary_user: 경기도버스운송관리시스템(BMS)을 바탕으로 버스 차량의 형식승인번호별 재원을 담는다. 승차정원(좌석·입석), 길이·너비·높이, 총중량, 엔진 출력·실린더 수·연료 종류, 축별 하중 배분 같은 차량 구조·기술 정보가 형식 단위로 들어 있다. 운수사업자나 정책 분석가가 "도입 예정 차종의 승차정원과 연료 종류는 무엇인가"처럼 차량 대체·안전 기준을 검토할 때 쓰고, 측정된 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어 형식승인번호나 제조사 코드 같은 이름·코드 매핑으로만 다른 버스 데이터와 잇는다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)을 기반으로 버스 차량별 주요 재원 정보를 제공하는 자료입니다. 차량별 형식승인번호를 중심으로 차종 코드, 차형태, 승인구분, 차유형 등의 기본 분류 항목과 함께, 좌석 및 입석 승차인원, 차체 길이·너비·높이, 총중량, 엔진사양(유형, 출력, 실린더 수, 연료종류 등), 차량 하중 배분, 타이어 규격 및 허용 무게, 변속기 및 제동 장치 등의 차량 구조 및 안전과 관련된 세부 기술정보가 포함됩니다. 해당 정보는 버스의 운행적합성, 차량 등록관리, 기술 기준 분석, 차량 안전성 평가, 차량 대체 계획 수립 등 다양한 행정 및 정책적 목적으로 활용 가능합니다.
accrual_periodicity: 수시
