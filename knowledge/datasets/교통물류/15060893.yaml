summary_user: 대구도시철도 2호선의 열차 운행실적을 연·월 단위로 집계한 파일로, 영업일수와 영업·비영업열차의 운행횟수(정기·임시)와 운행거리(킬로미터)를 담는다. 교통 분석가나 정책 담당자가 '2호선의 월별 열차 운행횟수와 운행거리는 어떻게 변해 왔나'를 확인하거나 운행계획·차량 정비 계획의 기초자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·월이나 호선 이름을 맞춰 대구교통공사의 다른 호선 운행실적, 승하차 통계 등과 이어 쓴다.
description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 운영정보 데이터로, 2005년 10월부터 현재까지 대구도시철도 2호선의 월별 영업열차 운행횟수(정기·임시), 비영업열차 운행횟수 및 운행거리(정기·임시), 영업열차 운행거리(정기·임시), 비영업열차 운행거리(정기·임시)를 제공하고 있습니다. 해당 자료는 도시철도 운행 효율성 분석, 차량 정비 및 운행계획 수립, 정책 수립 등 다양한 행정 및 연구 목적의 기초자료로 활용할 수 있으며, 공공교통 서비스 품질 향상 및 데이터 기반 정책결정 지원에도 폭넓게 기여할 수 있습니다. 본 데이터는 매월 정기적으로 갱신됩니다.'
