summary_user: 안산시 관내 행정동별 자동차 등록 대수를 차종(승용·승합·화물·특수)과 용도(관용·자가용·영업용)로 나눠 담은 집계 통계로, 범위는 시군구, 단위는 읍면동이며 원본은 1.7KB 남짓한 작은 CSV 파일이다. 지자체 교통·주차 담당자나 분석가가 '안산시에서 화물차나 영업용 차량이 많이 등록된 동은 어디인가', '주차장 수급을 우선 점검할 동은 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 행정동 이름(행정동명)을 기준으로 인구·주차장 등 다른 동 단위 자료와 이름 매칭해 이어 쓴다.
description_portal: 이 데이터는 안산시 관내 행정동별 자동차 등록 현황을 용도와 차종에 따라 상세하게 집계한 통계 자료입니다. 안산시 각 행정동별로 승용, 승합, 화물, 특수 자동차의 등록 대수를 기록하고 있으며, 이를 다시 관용, 자가용, 영업용으로 세분화하여 체계적으로 보여줍니다. 데이터 분석 결과, 초지동의 경우 자가용과 화물차의 등록 대수가 타 동에 비해 압도적으로 많아 주거 밀집 지역과 산업 단지의 특성이 혼재된 것으로 보이며, 고잔동과 사동은 관공서 위치 특성상 관용 차량의 비중이 상대적으로 높게 나타납니다. 이 자료는 지역별 주차난 해소를 위한 주차장 수급 실태 조사, 교통 인프라 확충 계획 수립, 그리고 지역별 경제 규모 및 특성을 분석하는 데 필수적인 기초 데이터로 활용될 수 있습니다.
