summary_user: 경상남도 안의 전기차 충전기를 충전기 한 대(충전기ID) 단위로 담은 건별 파일로, 운영기관·충전소·충전기 타입·상태·시설구분·시군구·주소·상세위치·이용가능시간·이용자 제한·충전용량을 함께 담는다. 전기차 이용자나 충전사업자, 정책 분석가가 "경남 시군구별로 급속충전기가 어디에 몇 대 있고 누구나 이용할 수 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구 이름이나 주소 문자열을 맞춰 연결하고, 충전소명·운영기관명으로 이름 매칭한다.
description_portal: 'ㅇ 경상남도 충전기 설치 현황을 운영기관, 충전소, 충전기타입, 충전기상태, 시설구분(대), 시설구분(소), 지역, 시군구, 주소, 상세위치, 이용가능시간, 이용자 제한, 충전용량, 편의제공 등의 항목으로 제공합니다.    * 무공해차통합누리집 가까운 충전소 찾기(링크 : https://ev.or.kr/nportal/monitor/evMap.do#)       -  해당 링크를 통해 실시간으로 업데이트 되는 충전기 현황을 지도와 연계하여 확인할 수 있으며, 전국의 충전소 현황 또한 확인이 가능함을  안내드리오니, 참고하여 주시기 바랍니다.'
legal_basis_portal: 환경부 충전시설 설치 사업을 통한 충전소 검색 가능하며  충전사업자 유지관리하도록 지침상 규정하고 있음( 실시간 충전시설 사용가능 여부 등 확인 가능  )
