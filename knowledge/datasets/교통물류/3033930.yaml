summary_user: 남양주시 시내버스를 노선 1건당 한 행으로 정리한 원장 파일(csv, 약 12.8KB)로, 운행업체·기점·종점·인가거리·인가대수와 출퇴근·평일·주말 배차간격, 주중·주말 상하행 첫차·막차 시각을 담는다. 시민이 "이 노선은 주말 막차가 몇 시이고 배차가 몇 분 간격인가"를 확인하거나, 분석가가 시내 노선별 운행 규모와 배차 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 정류장·실시간 도착 데이터(TAGO·경기 BIS 등)와는 노선번호 이름을 맞춰 붙여야 한다.
description_portal: '남양주시 시내버스 노선정보에 대한 데이터로 운행정보, 노선번호, 기점, 종점, 인가거리, 인가대수, 배차간격, 첫차시간, 막차시간 등의 항목을 제공합니다.(참고 : https://www.nyj.go.kr/www/contents.do?key=4688)  시내버스의 운행 경로 및 운영 정보를 체계적으로 정리한 자료입니다. 이 데이터는 대중교통 운영의 효율성을 높이고, 시민들에게 정확한 교통 정보를 제공하는 데 필수적인 기초 자료입니다.노선 자체의 구조와 운영 특성에 대한 정보가 제공됩니다. 대중교통 서비스의 질을 향상시키고, 도시 교통 정책의 과학적 근거를 마련하는 데 폭넓게 활용됩니다.'
