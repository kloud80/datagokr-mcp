summary_user: 대구도시철도 1호선의 역별 구간정보를 역 단위 한 행씩 담은 작은 파일(csv, 약 4KB)로, 역코드·역명·역종류와 상행·하행 거리(km)·소요시간·정차시간, 표준구배, 최고·평균속도, 회차·측선·승무교대·가동 여부를 포함한다. 분석가나 운영 담당자가 '1호선에서 역 사이 거리와 소요시간이 어떻게 되고 어느 역에서 회차·승무교대가 이뤄지는가'를 확인하거나 노선 운행 특성을 분석할 때 쓴다. 전역에서 통하는 조인 키는 없어, 대구교통공사의 다른 데이터(승하차·시간표 등)와는 같은 기관의 역코드나 역명 매핑으로만 이어 쓴다.
limits: 표준 역 코드 같은 전역 조인 키가 없어 다른 기관 철도·역 데이터와 붙이려면 역명 기준 매핑을 따로 만들어야 한다. 포털에 범위가 전국으로 표시돼 있으나 내용은 대구 1호선 한 노선에 한정되며 역 좌표는 없어 공간 분석에는 바로 쓰지 못한다.
