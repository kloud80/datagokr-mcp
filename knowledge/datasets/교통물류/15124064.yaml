summary_user: 경기도버스운송관리시스템(BMS)의 버스 정류소 기초 정보를 정류소 한 곳당 한 행으로 담는 원장 데이터로, 정류장 ID·정류장명(한·영·중·일·베트남어)·좌표·정류장 유형·환승정류장 여부·중앙차로 여부·표지판 유형을 포함한다. 교통 분석가나 지자체 담당자가 '우리 동네 정류소가 어디에 있고, 환승·중앙차로 정류소는 어디인가'처럼 정류소 배치를 지도에 올려 노선 계획이나 교통약자 이동환경을 검토할 때 쓴다. 정류장 ID(sttn_id)로 같은 ID를 쓰는 경기도 노선·도착 정보와 잇고, 법정동·행정동 코드와 좌표로 행정구역 통계나 GIS 자료와 맞춰 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 정류소 관련 기초 정보로, 각 정류소의 고유 식별자인 '정류장아이디', 위치 정보(GPSX좌표, GPSY좌표), 정류장명(한글, 영어, 중국어, 일본어, 베트남어), 정류장유형, 환승정류장 여부, 중앙차로 여부 등의 항목을 포함하고 있습니다. 해당 데이터는 정류소의 공간적 배치와 기능적 분류를 파악할 수 있어, 버스 노선 계획 수립, 교통 정책 수립, 교통약자 이동환경 개선 등에 활용될 수 있습니다. 또한 표지판 유형, 행정동코드, 권역코드 등도 포함되어 있어 다양한 GIS 기반 대중교통 분석 및 시각화 작업에 유용하게 사용될 수 있습니다. 데이터는 자동 업데이트 방식을 통해 최신성을 유지하며, 정류소 정보의 정확성 확보와 연계 서비스 제공에 기여합니다.
