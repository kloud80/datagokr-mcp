summary_user: 인천광역시 서구에 설치된 불법주정차 단속용 CCTV를 카메라 한 대씩 설치주소·위도·경도, 용도, 설치연도, 행정동·법정동과 함께 담은 시군구 범위의 개별 위치 목록이다. 주민이나 사업자가 '우리 동네 어느 길목에 주정차 단속 카메라가 있나'를 확인하거나, 분석가가 단속 카메라 배치 밀도를 동별로 비교하는 데 쓴다. 전역 조인 키는 없어서 행정동·법정동 이름으로 다른 통계와 맞추거나 위도·경도 좌표로 지도·주차장·보호구역 데이터와 공간 결합해 쓴다.
limits: 인천 서구 한 곳만 담고 전국 통일 형식의 표준데이터가 아니므로 다른 시군구 데이터와 바로 합치기 어렵다. 공통 코드 키가 없어 행정동·법정동 이름 매핑이나 좌표 결합에 의존해야 하며, 단속 건수나 운영 실적은 담지 않는다.
