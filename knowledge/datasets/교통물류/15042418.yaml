summary_user: 경기도 안양시 관내에 설치된 교통표지판을 한 개씩 담은 시설물 현황 파일로, 표지판마다 관리번호·높이·관할지역·설치일자를 기록한다. 안양시 도로시설 담당자나 분석가가 동네(관할지역)별로 교통표지판이 몇 개 있고 언제 설치됐는지, 설치된 지 오래된 표지판이 어디에 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어서, 다른 데이터와는 관할지역 이름을 맞추거나 같은 안양시의 다른 공간정보시스템 시설물 파일과 나란히 놓고 이어 쓴다.
