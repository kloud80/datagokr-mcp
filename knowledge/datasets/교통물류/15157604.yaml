summary_user: 전국 교차로별 기본 정보(위치·차로폭·제한속도)와 8개 방향별 버스·자전거·좌회전·보행·직진·유턴 신호의 점등 상태와 잔여시간(센티초)을 담은 실시간 API이며, 검증 시 전체 4,239건 중 1,399행을 받았다. 운전자나 내비·앱 개발자가 특정 교차로의 신호가 지금 어떤 상태이고 몇 초 뒤 바뀌는지 확인하는 질문에 쓴다. 지자체코드(stdgCd, 법정동코드 키), 교차로명(주소 키), 교차로 중심 위경도(좌표 키)로 다른 지역·도로 데이터와 잇고, 교차로아이디(crsrdId)로 교차로 정보와 신호 정보를 서로 연결한다.
description_portal: 전국 자치단체에서 운행중인 교차로 신호등 점등 상태 및 잔여시간 정보의 실시간 정보의 제공을 위해 지자체 코드, 지차체 명, 교차로아이디, 교차로명, 교차로 위도 및 경도, 차로 폭, 제한속도 유형명, 제한속도, 교차로 영문명 등 교차로에 대한 기본적인 정보인 "교차로 정보"와 지자체 코드, 지차체 명 및 교차로 신호제어기 기준 8개방향(북쪽, 동쪽, 남쪽, 서쪽, 북동쪽, 남동쪽,남서쪽,북서쪽)별 신호등 방향별 버스신호 잔여시간, 자전거신호 잔여시간, 좌회전신호 잔여시간, 보행신호 잔여시간, 직진신호 잔여시간, 유턴신호 잔여시간 및 버스신호 점등상태명, 자전거신호 점등상태명, 좌회전신호 점등상태명, 보행신호 점등상태명, 직진신호 점등상태명, 유턴신호 점등상태명 등 실시간 신호정보인 "신호제어기 신호잔여 시간 정보"를 제공 합니다.※ 본 개방데이터는 데이터 처리 과정 등으로 인해 실제 신호 시간과 차이가 발생할 수 있으며, 참고용으로 사용하는 것을 권고 드립니다.      본 개방데이터를 기반으로 발생한 어떠한 손해, 사고 또는 법적 책임에 대하여 제공기관은 책임을 지지 않습니다.
