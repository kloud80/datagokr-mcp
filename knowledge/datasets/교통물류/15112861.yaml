summary_user: 서울 중랑구 관내 공동주택 단지별 주차장 허가 면수를 건물 단위로 담은 파일(csv 약 40KB)로, 법정동·지번(본번·부번)·건물명·주용도와 옥내외 기계식·자주식 대수, 총 주차수를 한 행에 담는다. 주민·분석가가 '우리 동네 아파트 단지는 주차면이 몇 면이고 기계식 비중은 얼마인가'를 확인하거나 법정동별 공동주택 주차 공급 규모를 비교하는 데 쓴다. 전역 조인 키는 없어서 법정동명과 본번·부번을 지번 주소로 맞추거나 건물명으로 매칭해 건축물대장이나 전국주차장정보표준데이터와 이어 쓴다.
description_portal: 서울특별시 중랑구 관내의 공동주택 주차장 허가 면수 정보입니다. 시군구명, 건물명, 주용도, 옥내 기계식 대수, 옥외 기계식 대수, 옥내 자주식 대수, 옥외 자주식 대수 등의 데이터를 제공합니다. 데이터의 카테고리는 일방행정, 교통관리 분야입니다. 중랑구 법정동별 공동주택 단지 내 주차시설의 규모를 확인할 수 있습니다. 교통정책 및 주민 편의 향상, 도시주거환경 개선 등의 분석, 정책 수립에 다양하게 활용될 수 있습니다. 자세한 사항은 엑셀파일을 다운로드 받아서 확인하여 주시기 바랍니다. 감사합니다.
