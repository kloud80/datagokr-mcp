summary_user: 경기도 하남시 버스정보시스템에 등록된 버스정류장을 정류장 한 곳당 한 행으로 담은 파일로, 정류장 ID·정류장명·약어명·위도·경도·데이터기준일자를 포함한다. 하남시 교통 담당자나 분석가가 "정류장이 없거나 멀리 떨어진 대중교통 소외 구역은 어디인가"처럼 정류장 간격과 밀집도를 좌표로 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 노선·도착 정보 같은 다른 데이터와는 정류장 ID나 정류장명을 맞대어 매핑하거나 위경도 좌표로 공간 결합해 이어 쓴다.
limits: 하남시 한 곳의 정류장 위치 원장이라 노선 경유 정보, 실시간 도착 정보, 승하차 인원은 들어 있지 않다. 공통 코드 체계의 조인 키가 없어 다른 기관 데이터와 연결하려면 이름이나 ID를 별도로 매핑해야 한다.
