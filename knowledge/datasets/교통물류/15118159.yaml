summary_user: 국가철도공단이 유휴 철도부지에 추진하는 행복주택 건설 사업을 사업 1건당 1행으로 담은 소규모 파일(csv 약 1.5KB)로, 사업명·소재지·지구면적(㎡)·사업시행자·공급 규모(세대수 등)·사업비·사업기간을 담는다. 철도부지 공공주택이 어디에 몇 세대 규모로 언제까지 들어서는지 확인하려는 청년·신혼부부, 주거복지 정책 담당자, 부동산 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소나 사업명을 이름으로 맞춰 행정구역·주택 공급 데이터와 이어 쓴다.
description_portal: 국가철도공단이 철도부지를 활용해 추진 중인 행복주택 건설 사업의 현황을 담은 데이터로, 유휴 철도자산을 활용한 공공주택 공급 사례를 포함합니다. 주요 항목은 사업명, 소재지, 지구면적(㎡ 단위), 사업시행자, 주택 공급 규모(세대수 등), 총사업비, 사업기간 등으로 구성되어 있으며, 각 사업의 위치, 규모, 추진 주체, 예산 및 일정 정보를 종합적으로 제공합니다. 이 데이터는 도시 내 주거복지 실현, 철도부지의 효율적 활용, 청년·신혼부부 등 주거 지원 대상자에 대한 정책 수립과 관련 행정계획 수립을 위한 기반 자료로 활용됩니다.
