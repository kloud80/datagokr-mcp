summary_user: 성남시 교차로·우회전 구간에 설치된 반사경, 경고등, 보행자 감지센서 같은 보행자 안전시설물을 시설물 한 건씩 담은 건별 위치 자료로, 시도·시군구·읍면동명과 세부 위치설명, 위경도 좌표, 사진명이 함께 들어 있다. 교통안전 담당자나 분석가가 '우회전 사고가 잦은 교차로에 사각지대 안전시설이 실제로 설치돼 있는가'를 확인하거나 시설 정비가 필요한 취약지역을 찾는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 읍면동명 같은 이름 매핑이나 위경도 좌표의 공간 근접으로 이어 쓰며, 교통사고 다발지점이나 보호구역 위치 자료와 겹쳐 보는 방식이 현실적이다.
description_portal: 경기도 성남시 우회전 사각지대 시설물 위치데이터를 제공합니다.본 데이터는 우회전 위험구간 관리번호, 우회전 위험구간 시설물 세부위치설명, 시설물 사진명 등으로 구성되어있습니다. 교차로 및 차량 우회전 구간에서 보행자 안전을 확보하기 위해 설치된 안전시설물의 위치와 특성을 체계적으로 정리한 자료입니다. 이 데이터는 반사경, 스마트 경고등, 보행자 감지센서, LED 표지판, 음성 알림 장치, 우회전 전용 신호등 등 운전자의 시야 확보 및 보행자 사고 예방을 목적으로 설치된 장비에 대한 정보를 포함합니다. 이를 통해 성남시는 사각지대 취약지역 분석, 교통안전시설 정비계획 수립, 교통약자 보호구역 안전 강화 등 다양한 정책에 활용합니다.
