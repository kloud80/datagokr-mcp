description_portal: '보행자 전용 육교의 명칭, 위치, 구조 정보, 준공년도, 설계하중, 관리주체 등을 포함한 시설물 현황 자료.보행자 안전 확보 및 도시 인프라 노후도 관리, 보행환경 개선계획 수립 등을 위한 기초자료로 활용됨.활용 목적 및 특징– 시설물 길이, 폭, 상부·하부 구조 등을 통한 육교 구조 분석 가능– 준공년도 기반으로 노후시설 현황 및 보수 대상 우선순위 설정– 설계하중을 활용한 구조 안전성 검토 및 하중 제한 판단 가능– 관리주체 정보로 유지관리 책임 소재 및 행정 대응 체계 정립주요 항목 설명● 연번: 시설물 항목의 고유 식별번호● 시설물명: 보도육교의 명칭● 위치: 해당 육교의 설치 위치 정보● 길이 / 폭: 구조물의 연장 길이 및 폭 정보(미터 단위)● 준공년도: 해당 육교의 준공 연도● 상부 / 하부: 구조물의 상부 및 하부 구조 유형● 설계하중: 구조물 설계 시 적용된 하중 기준● 관리주체: 해당 육교의 유지관리 기관 또는 부서'
