summary_user: 김제시에 시민이 신고한 불법주정차를 신고 한 건당 한 줄로 담은 원천 파일로, 신고일시, 신고 위치 주소, 횡단보도 주변 여부, 과태료 부과 여부가 들어 있다(CSV 약 39KB). 시민이나 분석가가 김제시에서 어느 시간대와 어느 위치에 불법주정차 신고가 몰리는지, 횡단보도 주변 신고 중 실제로 과태료가 부과된 비율이 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 신고위치주소를 지오코딩하거나 주소 문자열로 맞춰 연결해야 한다. 그렇게 하면 단속카메라나 어린이보호구역 같은 위치 데이터와 겹쳐 볼 수 있다.
description_portal: 본 데이터는 시민이 신고한 불법주정차 사례를 체계적으로 관리하기 위해 수집된 자료로, 신고일시, 신고위치주소, 횡단보도 주변 여부, 과태료 부과 여부를 포함하고 있습니다. 이를 통해 불법주정차 발생 현황을 시간대별, 위치별로 분석할 수 있으며, 횡단보도 주변 등 안전 취약 구역의 단속 실태를 파악할 수 있습니다. 또한 과태료 부과 여부 정보는 단속 처리 결과와 행정 집행 현황을 확인하는 데 활용할 수 있습니다. 해당 데이터는 개인정보 보호를 위해 차량 소유자 정보 등 식별 가능한 정보는 포함하지 않았으며, 행정 정책 수립, 교통 안전 관리, 시민 안내, 연구 및 통계 분석 등 다양한 목적으로 활용이 가능합니다. 이를 통해 시민 참여를 촉진하고, 보다 안전한 교통 환경 조성에 기여할 수 있습니다.
