summary_user: 서울시 시영·구영 공영주차장과 일반시민이 이용 가능한 공공 부설주차장의 이름·주소·주차장 형태(노상·노외·부설)·운영구분·총 주차면수·평일/주말/공휴일 운영시각·기본요금과 추가요금·일 최대요금·월정기권 요금·위경도를 주차장 단위로 담은 서울시 원천 목록이다. 운전자가 '이 근처 공영주차장이 주말 몇 시까지 열고 기본 요금은 얼마이며 야간에 무료로 개방하는지'를 확인하거나, 분석가가 자치구별 공영주차 면수와 유무료 운영 현황을 살펴보는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 주차장명·주소 매칭이나 서울시 주차장코드(PKLT_CD)로만 연결하며, 주차장관리번호 기반의 전국주차장정보표준데이터(원장)나 지자체 실시간 주차 가능 대수 API와는 이 방식으로 이어 쓴다.
description_portal: 서울시내 시영주차장, 구영주차장의 정보, 주차장 주소, 주차장 형태(노상, 노외, 부설주차장), 운영시간, 총 주차면수 등 주차장 운영에 관련된 정보입니다. 주차장명, 주소, 주차장코드, 주차장 종류, 주차장 종류명, 운영구분, 운영구분명, 전화번호, 주차현황 정보 제공여부, 주차현황 정보 제공여부명, 총 주차면, 유무료구분, 유무료구분명, 야간무료개방여부, 야간무료개방여부명, 평일 운영 시작시각(HHMM), 평일 운영 종료시각(HHMM), 주말 운영 시작시각(HHMM), 주말 운영 종료시각(HHMM) 등으로 구성됩니다.(제공되는 정보는 일반시민이 이용가능한 공영, 공공 부설주차장을 안내하고 있으며, 주차장 여건에 따라 실제 정보와 다를 수 있습니다.) (* 데이터 연동주기는 1분입니다.)
