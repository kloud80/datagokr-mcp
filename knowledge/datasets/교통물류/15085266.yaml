description_portal: '○ 통계개요* 통계명 : 대중교통요금* 통계종류 : 서울시 대중교통요금을 제공하는 일반·보고통계* 작성목적 : 대중교통수단의 이용 및 촉진을 도모하고, 대중교통의 육성ㆍ지원 정책의수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당업체 → 서울특별시 교통정책과, 버스관리과, 택시물류과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 서울시 대중교통별(시내버스, 마을버스, 지하철, 택시)요금 현황○ 용어설명○ 기 타* 택시요금은 기본요금을 의미하며 중형은 2㎞ 기준, 모범은 3㎞를 기준으로 함* 버스, 지하철은 ‘03까지는 현금승차(일반인) 기준, ‘04년 7월 요금개편 이후는교통카드 사용요금(일반인) 기준* 구체적인 내용 참고 : http://traffic.seoul.go.kr/archives/345○ 출 처 : 서울특별시 교통정책과, 버스관리과, 택시물류과'
