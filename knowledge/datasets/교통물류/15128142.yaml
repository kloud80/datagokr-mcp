description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)에 등록된 선박의 총톤수를 기준으로 선박원부정보를 분류하고, 등록 선박의 톤급별 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 선박의 총톤수를 16단계로 세분화하여 각 단계별로 등록된 선박의 수를 제공합니다. 데이터는 톤급별 구분 기준과 각 그룹에 포함된 선박 구분별 수의 통계로 구성되어 있습니다.  본 데이터는 국내 등록 선박의 규모별 분포 현황을 파악하여 해운항만 정책 수립, 항만시설 투자 계획, 해사업계의 현황 분석 등 선박 규모와 관련된 정책 또는 연구에 활용될 수 있습니다. 해양수산부 및 유관 기관에서는 톤급별 선박 증가 추이, 항만시설 수용 능력 분석 자료로 사용할 수 있으며, 선박 운영 기업에서는 사업 전략 및 시장 진입 분석 자료로 이용할 수 있습니다.
