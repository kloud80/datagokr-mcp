summary_user: 2015년식 대형 CNG 시내버스 한 대의 하루 운행을 시각별로 기록한 센서 원천 데이터로, 위경도·차량속도·엔진회전수 같은 기본 주행 항목과 가스탱크압력·가스분사온도·흡기압력·EGR·배기가스 온도·실린더별 값 등 엔진 제어 항목 약 40개를 담은 CSV 파일(약 18MB)입니다. 버스 운수업체나 연구자가 '정차·출발·공회전이 반복되는 시내 노선에서 CNG 엔진의 부하·가스 소모·배기 특성이 어떻게 변하는가'를 분석하거나 고장 예측·예방 정비 모형을 시험할 때 쓴다. 노선·정류장·차량 식별 같은 전역 조인 키가 없어 다른 데이터와 코드로 연결되지 않으며, 위도·경도와 GPS시간을 기준으로 도로·정류장 위치 데이터와 공간적으로 겹쳐 보는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 2015년식 대형 CNG(압축천연가스) 시내버스의 하루 전체 운행 기록을 담고 있는 고정밀 센서 데이터입니다. 특히 2015년은 CNG 버스의 데이터 수집 항목이 기존 25개에서 40여 개로 대폭 확장된 중요한 기점으로, 이전 모델보다 훨씬 풍부하고 심층적인 분석이 가능한 것이 특징입니다.데이터는 '정차-출발-공회전'이 반복되는 실제 시내버스 노선 환경에서 천연가스 엔진의 작동 특성을 정밀하게 보여줍니다. 기본 위치(GPS), 속도, RPM, 엔진 부하율 정보는 물론, 확장된 항목을 통해 연료 레일 압력, 가스 온도, 연료 분사 타이밍, 흡기 매니폴드 압력 등 CNG 엔진의 핵심 제어 상태를 상세히 확인할 수 있습니다. 실시간 가스 소모량과 연료 탱크 압력 데이터는 연비 관리와 충전 시점 예측의 정확도를 높여줍니다.이처럼 대폭 늘어난 데이터 항목은 단순한 운행 기록 분석을 넘어, 정밀한 차량 상태 원격 진단과 고장 예측을 가능하게 합니다. 버스 운수업체는 이를 기반으로 차량 원격관제(FMS)를 고도화하고, 예방 정비 체계를 구축하여 운행 효율성과 안전성을 극대화할 수 있습니다. 학술적으로는 CNG 엔진의 실제 도로 주행 효율성 및 배출가스 특성 연구, 대중교통 에너지 정책 수립 등을 위한 귀중한 실증 자료로 활용될 수 있습니다.
