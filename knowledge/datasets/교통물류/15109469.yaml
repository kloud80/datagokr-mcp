summary_user: 대전광역시 전역에 설치된 불법주정차 단속용 CCTV를 대당 한 건씩 담은 시설 목록으로, 관리번호·관리기관·CCTV명·지번/도로명 주소·좌표(crdntX, crdntY)를 개별 지점 단위로 제공한다. 운전자나 주민이 '우리 동네 어느 도로에 불법주정차 단속 카메라가 있는가'를 확인하거나, 분석가가 단속 카메라 분포와 주정차 민원·사고 지점을 비교하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 주소나 좌표를 기준으로 공간 매칭하거나 같은 기관 데이터와 이름으로 연결해야 한다.
description_portal: 대전광역시 불법주정차용 CCTV 자료는 대전 전역에 설치된 불법주정차 단속용 CCTV의 상세 위치와 운영 현황을 제공합니다. 이 데이터는 각 CCTV의 관리번호, 시군구명, 도로명주소, 위도·경도 좌표, 설치 장소 등에 관한 정보를 포함하고 있어, 불법 주정차 단속 구간을 정확히 파악할 수 있습니다. 또한 단속 카메라 수와 교차로 수 등 구체적 시설 현황이 기록되어 있어 단속 효율성 평가와 교통 관리 개선에 활용 가능합니다.2022년 대전광역시 공공데이터 기업매칭사원사업으로 개발한 데이터입니다.
