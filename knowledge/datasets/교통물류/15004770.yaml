summary_user: '제주특별자치도 안의 관심지점(POI)을 장소 한 곳당 한 행으로 담은 파일(CSV 약 7.5MB)로, 구분번호·X/Y 좌표·구분(교통시설, 공공기관, 관광/숙박, 음식점 등)·장소명·소재지를 담는다. 지도 서비스나 관광·상권 분석가가 제주의 특정 유형 시설(예: 숙박시설, 금융기관)이 어디에 몰려 있는지 좌표로 찍어 보는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 장소명·소재지 주소나 좌표를 매칭해 공간 결합하는 방식으로 이어 쓴다.'
description_portal: '제주특별자치도에 있는 장소(POI) 데이터를 제공합니다.항목: 구분번호, 위치좌표, 구분, 장소명, 소재지*POI(Point of Interest) : 관심지점. 지도나 네비게이션 시스템에서 특정 위치나 장소를 나타내는 데이터 포인트로 다양한 카테고리의 장소나 시설을 포함함 *구분: 교통시설, 공공기관, 교육기관, 지명관련, 주택관련, 기업, 관광/숙박, 문화/종교/예술, 도로시설, 금융기관, 농공시설, 쇼핑/편의 음식점 등자세한 사항은 제주특별자치도 공간포털 홈페이지에서 확인하시기 바랍니다.https://gis.jeju.go.kr/'
