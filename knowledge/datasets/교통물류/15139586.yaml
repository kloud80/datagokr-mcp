status: active
summary_user: 포항시 주요 도로의 링크(시작·끝 노드, 방향)별로 기준일의 1시부터 00시까지 시간대별 속도를 한 행에 담은 교통 통계 데이터이며, 포항시 범위의 비공간 자료다. 포항 시내 출퇴근 시간대에 어느 도로 구간이 느려지는지, 상습 정체 구간이 어디인지 확인하려는 시민·교통 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 링크 아이디(link_id)·도로 이름 같은 이름·코드 매핑이나 같은 기관 자료로만 다른 데이터와 연결한다.
limits: 표준 링크 체계 등과 바로 맞물리는 전역 조인 키가 확인되지 않아 다른 교통 데이터와 결합하려면 별도 매핑이 필요하다. 좌표 없는 비공간 자료라 지도에 올리려면 노드·링크 위치를 따로 구해야 하며, 개발계정은 하루 10,000회 호출로 제한된다.
