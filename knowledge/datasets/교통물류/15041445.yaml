description_portal: '대전교통공사에서 운영하는 노선의 호선구성에 대한 데이터로 철도운영기관명, 선명, 역명, 역구성순서, 구간키로, 기점키로 등이 있습니다.참고로 역간거리는역과 역사이의 거리(Km)를 말한다.해당 정보는 연번, 호선, 역명, 운행순서, 역간거리(km), 호선별누계(km)를 포함하고 있습니다.-가장 역간거리가 긴 구간 대경선 서대구역 ~ 왜관역: 23.3km 광역철도 제외 시 공항철도 청라국제도시역 ~ 영종역: 10.3km-가장 역간거리가 긴 운행계통 수도권 전철 1호선 서울역발 천안급행 서울역 ~ 금천구청역: 17.3km'
