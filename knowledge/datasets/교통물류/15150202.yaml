description_portal: '- 국토교통부는 불법하도급 및 노무관련 위반으로 처분을 받은 건설업자에 대하여 2년 이내 범위에서 공공건설공사 * 에 대한 하도급 참여를 제한하고 있으며, 열람이 가능하도록 건설산업종합정보망에 하도급 참여제한 대상자를 게재하고 있습니다.-건설산업기본법 제29조의3제5항을 위반하여 하도급참여제한 대상자에게 하도급을 준 수급인과 하도급을 한 건설업자는 1년 이하의 영업정지 또는 위반공사의 100분의 30에 상당하는 금액 이하의 과징금 처분대상이 됩니다. (건설산업기본법 제82조제2항제7호)* 공공건설공사 : 국가, 지자체, 공공기관의 운영에 관한 법률 제5조에 따른 공기업 및 준정부기관, 지방공기업법에 따른 지방공사 및 지방공단이 발주한 공사근거 : 건설산업기본법 제29조의3 및 같은법 시행령 제33조, 시행규칙 제27조 ("19.6.19 시행)'
