description_portal: '장애물 정보는 항공기 운항 시 안전에 영향을 줄 수 있는 장애물에 대한 주요 정보를 포함하고 있습니다.본 데이터는 공항식별자, 공항명, 장애물 명칭, 구조물부분유형, 높이, 높이 단위, 위치 구역, 좌표 정보를 제공합니다.위치 구역 정보에는 Area2, Area3, Area4가 포함됩니다.Area2: 시·도 단위의 광역 행정구역으로, 전국을 큰 범위로 구분합니다.Area3: 시·군·구 단위의 기초 행정구역으로, 광역 구역 내 세부 지역을 구분합니다.Area4: 동·읍·면 단위의 세부 행정구역으로, 실제 장애물이 위치한 가장 세밀한 행정구역 정보를 나타냅니다.좌표 표기 방식은 도·분·초(DMS, Degrees Minutes Seconds) 형식을 사용하며, 다음과 같이 표기됩니다.N (North): 북위를 의미하며, 위도 정보를 나타냅니다. 위도는 적도를 기준으로 북쪽 방향의 각도를 나타내며, 0°에서 90°까지 표시됩니다.E (East): 동경을 의미하며, 경도 정보를 나타냅니다. 경도는 본초 자오선을 기준으로 동쪽 방향의 각도를 나타내며, 0°에서 180°까지 표시됩니다.'
