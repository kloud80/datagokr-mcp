summary_user: 광주교통공사 도시철도 전동차 안에서 재생되는 안내방송을 방송구간(시발역·종착역 등)별로 정리한 파일로, 방송멘트 문구와 방송 파일 식별 코드(파일명)를 건별로 담으며 CSV 약 31KB 규모입니다. 승객 안내 서비스 담당자나 연구자가 "역·구간마다 어떤 행선·환승·안전 안내가 나오고, 문구가 표준화돼 있는가"를 확인하거나 다국어·교통약자 안내 설계를 검토할 때 씁니다. 전역 조인 키는 없어서, 다른 역 정보·시간표 데이터와는 방송구간에 적힌 역 이름을 직접 맞춰 이어 써야 합니다.
description_portal: '이 데이터는 광주광역시 도시철도공사 전동차 내 안내방송 내용을 정리한 자료로, 각 열차 운행 구간에서 재생되는 다양한 방송멘트를 포함하고 있습니다. 주요 항목에는 방송구간(예: 녹동역 시발역, 종착역 등), 방송멘트(열차 행선 안내, 환승 안내, 안전 수칙, 로고송 등), 파일명(방송 파일 식별 코드)이 있습니다.이 자료를 활용하면 전동차 내 안내방송의 구성과 메시지 유형을 분석할 수 있으며, 승객 안전 유도, 서비스 품질 관리, 다국어 안내 확충 등에 참고할 수 있습니다. 또한 방송 내용의 표준화 여부와 상황별 변화를 비교하여, 승객 안내 효과성 평가, 홍보·안내 전략 개선, 교통약자 친화적 안내방송 설계 등에 적용할 수 있습니다. 나아가 파일명 정보는 실제 음성 파일 시스템과 연계해 방송 관리 효율성을 높이는 데 기여할 수 있습니다.'
