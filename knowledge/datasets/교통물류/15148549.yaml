summary_user: 대구광역시 북구 데이터통합플랫폼에 저장된 불법주차 위치를 건별로 담은 파일로, 각 건마다 경도·위도 좌표, 행정동(고성동 외 22개 동), 위반상태(주간불법·야간불법·주간기타·야간기타), 기준일자를 기록한다. 북구 안에서 어린이 보행 취약지역을 찾거나 교통안전시설물을 어디에 먼저 둘지 정하려는 분석가가 '어느 동, 어느 지점에 주·야간 불법주차가 몰려 있는가'를 확인하는 데 쓴다. 공통 조인 키는 없어서, 다른 데이터와는 행정동 이름을 맞추거나 좌표를 공간 결합하는 방식으로 잇는다.
description_portal: 대구광역시 북구 내 보행어린이 취약지역 도출 및 교통안전시설물 우선 입지 선정 근거 마련을 하고자 보행어린이 교통안전 데이터분석을 위해  활용되었고, 대구광역시 북구 데이터통합플랫폼에 저장되어있는 데이터로 불법 주차 위치 정보를 제공하고있습니다.경도, 위도, 행정동(고성동 외 22개 동), 위반상태(주간불법, 야간불법, 주간기타, 야간기타), 기준일자 항목을 제공중입니다.해당 DB의 데이터는 현재 업데이트가 중단된 상태(데이터기준일자  2020. 10. 5.)이므로 유의하여주시기 바랍니다.
