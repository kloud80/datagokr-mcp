summary_user: 성남시 버스 노선을 이루는 정류장 간 연결 구간(링크)마다 시작·종료 정류장명, 구간 거리(미터), 평균속도, 평균통과시간(초)을 담은 시군구 단위 CSV 파일(약 175KB)이다. 교통 분석가나 시 행정 담당자가 '성남시 안에서 어느 정류장 구간이 가장 느리게 통과되는가'처럼 구간별 버스 운행 속도와 소요시간을 비교할 때 쓴다. 정류장 ID 같은 전역 조인 키가 없어 정류장 원장이나 도착정보와는 정류장명을 맞춰 붙여야 하고, 같은 기관(성남시) 데이터끼리만 연결이 수월하다.
description_portal: 성남시 버스링크정보(정류장과 정류장의 연결정보) 현황으로 시작정류장명, 종료정류장명, 거리(미터), 평균속도(km), 평균통과시간(초), 데이터기준일자 로 구성되어 있음. 버스 링크 정보는 버스 노선과 정류장 간의 환승 연계 관계를 나타내는 교통정보입니다. 쉽게 말해, 어떤 정류장에서 어떤 버스노선끼리 환승이 가능한지, 혹은 버스와 다른 교통수단(지하철, 마을버스 등) 간의 연결성이 어떤지를 구조화한 데이터라고 볼 수 있습니다. 이 데이터는 다양한 분야에 행정, 연구 분야에 활용 될 수 있습니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.
