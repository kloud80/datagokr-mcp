summary_user: 경기도 도로대장 중 교량을 한 건씩 담은 원천 목록으로, 노선번호·구간번호·교량명·시점과 종점 위치·소재지 주소·교량연장·보도폭·교차종류·착공일·준공일 등 12개 항목을 담는다. 도로 관리 담당자나 분석가가 '특정 노선에서 하천이나 철도를 건너는 교량이 어디에 몇 개 있고, 언제 준공됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 노선번호(route_no)나 교량명·주소 같은 이름 매핑, 또는 경기도의 다른 도로대장 데이터와 같은 기관 코드로만 연결할 수 있다.
description_portal: 이 데이터는 경기도의 도로대장 중 교량에 관한 정보를 담고 있으며, 노선번호, 구간번호, 교량명, 시점 및 종점 위치, 소재지 주소, 교량연장, 보도폭, 교차종류, 비고, 착공일, 준공일 등 총 12개의 항목으로 구성되어 있습니다. 각 교량의 위치, 길이, 보도 설치 여부, 교량이 교차하는 대상(하천, 철도, 도로 등), 공사 일정 등을 제공하며, 도로 인프라의 구조적 특성과 공공안전 관리에 필수적인 정보를 포함하고 있습니다. 해당 데이터는 교량 유지관리계획 수립, 하천 및 도로 통과구조물 분석, 도시 인프라 시뮬레이션, 재난 대응계획 수립 등에 활용 가능합니다.
