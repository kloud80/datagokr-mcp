description_portal: '부산광역시 동구 마을버스 현황 자료입니다. 동구에서 운행하고 있는 마을버스 노선, 운행거리, 구간, 배차간격 등 운행계통 전반에 대하여 설명하는 자료입니다. 현재 동구 마을버스는 총3개 노선으로 운행 중입니다. *마을버스운송사업: 주로 시ㆍ군ㆍ구의 단일 행정구역에서 기점ㆍ종점의 특수성이나 사용되는 자동차의 특수성 등으로 인하여 다른 노선 여객자동차운송사업자가 운행하기 어려운 구간을 대상으로 국토교통부령으로 정하는 기준에 따라 운행계통을 정하고 국토교통부령으로 정하는 자동차를 사용하여 여객을 운송하는 사업'
