summary_user: 울산광역시 남구의 주정차 위반 단속을 건별로 담은 원천 파일로, 단속일자·단속시간·장소·단속구분을 행마다 기록한다(CSV 약 18MB). 주민이나 분석가가 '남구에서 어느 장소·시간대에 주정차 단속이 몰리는가'를 살펴 주차 수요나 단속 취약 지점을 파악하는 데 쓴다. 전역 조인 키나 좌표가 없어 다른 데이터와는 장소 이름을 주소·지명 매핑해 잇거나 같은 남구 자료끼리만 연결한다.
limits: 단속 장소가 이름(텍스트)으로만 있어 지도 위치나 법정동 코드로 바로 집계할 수 없고, 별도 지오코딩이나 이름 매핑이 필요하다. 남구 한 곳의 자료라 울산 전체나 다른 시군구와 비교하려면 각 기관 파일을 따로 모아 형식을 맞춰야 한다.
