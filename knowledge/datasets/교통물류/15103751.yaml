summary_user: 울산시설공단이 운영하는 삼산공영주차장 한 곳의 월별 입차·출차 대수와 주차구획 수, 주차장 구분·유형, 도로명·지번 주소를 연월 단위로 담은 집계 파일(csv, 약 6KB)이다. 울산 삼산동 일대를 오가는 시민이나 교통·도시 분석가가 '이 주차장의 이용량이 어느 달에 몰리고 해마다 어떻게 변하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 같은 원장과는 주차장명·주소를 맞춰 연결하고, 같은 기관의 다른 주차장 현황과는 기관 단위로 나란히 놓고 쓴다.
description_portal: '울산시설공단은 삼산공영주차장의 월별 이용 현황을 시민들에게 투명하게 제공하여 공공주차장의 효율적인 이용과 운영 개선에 기여하고 있습니다. 제공되는 데이터는 주차장명, 주차장 구분(예: 공영, 민영 등), 주차장 유형(노상, 노외 등), 소재지 도로명 주소 및 지번 주소, 주차구획 수, 입차 대수, 출차 대수, 연월, 데이터 기준일자 등 다양한 항목으로 구성되어 있습니다. 또한, 연월 항목을 기준으로 특정 시기의 주차 수요를 비교하거나 추이를 분석하는 데 활용이 가능합니다. 데이테 기준일자를 제공함으로써 데이터의 생성 일자를 보여줍니다.'
