summary_user: 국내선·국제선 항공의 운항편수, 여객 수송인원, 화물 수송량(톤)을 연도별로 합산한 전국 단위 집계표로, 실측 파일은 2023~2025년 세 해를 열로 둔 420바이트 규모의 작은 CSV다. 정책 담당자나 항공·물류 분석가가 '팬데믹 이후 국제선 여객과 운항편수가 해마다 얼마나 회복됐는가' 같은 연도별 총량 추이를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 열이나 구분 이름을 맞춰 붙여야 하며, 공항·노선·항공사별 세부 항공통계와 함께 놓고 총량 기준치로 비교하는 데 쓴다.
description_portal: 데이터 개요국토교통부_국내_국제 항공수송실적은 연도별로 국내선 및 국제선의 통합 항공수송 실적(운항편수, 여객 수송량, 화물 수송량)을 종합 제공하는 공공데이터입니다. 본 자료는 항공산업의 연도별 성장 추이, 수요 변화, 정책 수립, 인프라 투자 전략 마련 등에 활용됩니다.데이터 제공 항목연도해당 통계가 집계된 기준 연도국내+국제 운항실적(편)국내선 및 국제선 총 운항 편수국내+국제 여객수송실적(명)국내선 및 국제선 총 여객 수송 인원국내+국제 화물수송실적(톤)국내선 및 국제선 총 화물 수송량 (톤 단위)활용 안내항공교통량 추이 분석 및 공항 용량 계획 수립포스트 팬데믹 항공 수요 회복률 진단항공물류 시장 동향 및 물동량 변화 예측항공사 네트워크 전략 및 운항계획 수립 참고데이터 해석 시 유의사항운항실적은 실제 운항된 항공편 기준으로 집계되며, 스케줄 기준 수치와 차이가 있을 수 있음여객/화물 수송실적은 실제 탑승자 및 적재량을 기준으로 산출됨데이터는 국토교통부 항공통계시스템 및 항공정보포털에서 주기적으로 갱신됨데이터 구성 예시구분2023년2024년2025년국내운항실적(편)191064186784181873국제운항실적(편)411299519085548998국내+국제운항실적(편)602363705869730871국내여객실적(명)321896763113175030245051국제여객실적(명)683190158892662194548031국내+국제여객실적(명)100508691120058371124793082국내화물실적(톤)212436203801196741국제화물실적(톤)374148541915054272011국내+국제화물실적(톤)395391943953064468752
