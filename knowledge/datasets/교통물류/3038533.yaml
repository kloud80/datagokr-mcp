summary_user: 국토종주 자전거길 13개 노선(북한강·아라·오천·금강·영산강·섬진강·제주환상·동해안·한강종주·새재·낙동강 등)의 경로를 순서별 위도·경도 점으로 담은 노선 좌표 파일이며, 포털 설명상 인증센터·화장실·급수대 등 주변 시설 위치도 함께 제공한다. 자전거 여행자나 지도 서비스 개발자가 '특정 국토종주 노선이 어디를 지나며 경로를 지도에 어떻게 그리나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선 이름으로 맞추거나 좌표 기반 공간 결합으로 공공자전거 대여소·자전거도로 데이터와 이어 쓴다.
description_portal: 국토종주 자전거길 13개에 대한 도로 위도 및 경도에 대한 정보를 제공하며 인증센터, 화장실, 급수대 등 국토종주 자전거길 주변에 있는 시설들에 대한 위치정보를 제공합니다.북한강자전거길(밝은 광장 ~ 춘천 신매대교, 70Km), 아라자전거길(아라서해갑문~아라한강갑문, 21Km), 오천자전거길(행촌교차로~합강공원, 105Km), 금강자전거길(대청댐~금강 하구둑, 146Km), 영산강자전거길(담양댐~영산강 하구둑, 133Km), 섬진강자전거길(전북임실 섬진강 생활체육공원~전남광양 배알도수변공원, 149Km), 제주환상자전거길(제주도 해안도록 일주, 234Km), 동해안자전거길(강원구간)(고성 통일전망대~삼척 고포마을, 242Km), 동해안자전거길(경북구간)(울진 은어다리~영덕 해맞이공원, 76Km), 한강종주자전거길(아라한강갑문~충주댐, 192Km), 새재자전거길(충주탄금대~상주 상풍교, 100Km), 국토종주 낙동강자전거길(상주 상풍교~낙동강 하구둑, 385Km)
