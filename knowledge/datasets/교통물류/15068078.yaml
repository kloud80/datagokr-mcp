description_portal: '기내에 반입 가능한 물품과 제한되는 물품을 분류하여, 항공 탑승 시 혼선을 방지하고 보안 규정을 사전에 안내하기 위해 제공되는 데이터입니다.1. 형식: CSV2. 내용 요약■ GUBUN: 기내반입 금지물품을 그 특성에 따라 구분 나타낸 항목명■ CARRY_BAN: 비행기에 탑승하는 승객의 휴대 또는 탑재가 금지된 품목 (가능한 물품도 포함)■ CABIN: 비행기에 탑승하는 승객이 물품을 기내에 반입할 수 있는지의 여부■ TRUST: 비행기에 탑승하는 승객이 물품을 위탁처리할 수 있는지에 대한 여부■ SEQ: 기내반입 금지물품(또는 허가물품)에 부여한 일련번호3. 활용 예제■ 항공사 또는 공항 안내 페이지에서 실시간으로 기내 반입 가능 여부를 확인할 수 있도록 안내 시스템에 연동■ 여행객이 사전에 자신이 소지한 물품의 기내 반입 가능 여부를 파악하여 보안 검색 시 불필요한 혼선을 줄이는 데 활용■ 공공기관 또는 교육기관에서 항공보안 교육 콘텐츠에 포함하여 실습 및 사례 분석에 활용 가능'
