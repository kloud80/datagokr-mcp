summary_user: 경기도버스운송관리시스템(BMS) 기준으로 경기도에서 출발하거나 경유하는 시외버스 노선의 노선ID(route_id)와 노선명(route_nm)을 노선 1건당 1행으로 담은 노선 원장이다. 대중교통 분석가나 서비스 개발자가 '경기도를 지나는 시외·공항버스 노선에는 어떤 것이 있고, 시스템 식별 코드는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 정류소·도착정보 같은 다른 버스 데이터와는 노선명 매핑이나 같은 기관(경기도 BMS) 노선ID로만 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)을 통해 제공되는 시외버스 노선 정보로, 경기도 내 출발 또는 경유하는 장거리 시외버스 노선에 대한 기본 정보를 포함합니다. 데이터는 ‘노선ID’와 ‘노선명’으로 구성되어 있으며, ‘노선ID’는 시스템 내에서 각 노선을 고유하게 식별하는 코드이고, ‘노선명’은 일반 이용자가 인지하는 번호 또는 노선의 구간명을 포함합니다. 예를 들어, ‘3901증평-인천공항’, ‘4100-1’, ‘8877’ 등의 형식으로 구성되어 있습니다. 이 데이터는 시외버스 노선의 관리, 운영 효율화, 정류소 연계 데이터 분석, 공항 리무진 버스 및 광역교통 서비스 설계 등에 활용될 수 있습니다.
