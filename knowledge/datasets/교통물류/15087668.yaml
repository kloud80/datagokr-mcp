summary_user: 2012~2024년 연도별로 16개 시도 지역 구분에 따라 휘발유·경유·LPG·도시가스(CNG)·하이브리드 등 연료별 도로부문 온실가스 배출량(천톤CO2eq)을 담은 집계 파일이다. 지자체·정책 분석가가 "우리 시도에서 경유차 배출량이 휘발유차보다 얼마나 많고, 연도별로 어떻게 변했나" 같은 질문에 쓴다. 전역 조인 키가 없어 같은 기관의 지역별 온실가스별·차종별 도로부문 배출량 자료와는 연도와 시도 이름(구분)을 맞춰 이어 쓴다.
description_portal: 개방 데이터는 2012년부터 2024년까지 연도별로 16개 시도에 따른 지역별 및 휘발유, 경유, CNG, LPG, 하이브리드 등 연료별 도로부문 온실가스 배출량을 표준화하여 등록하여 제공하고 있습니다.(단위:천톤CO2eq)해당 자료는 지역별, 차종별로 온실가스 배출량 산정 결과 비교 및 분석에 활용될  수 있습니다. 또한 연도별로 배출량 산정 결과를 비교할 수 있습니다.해당 자료와 유사한 자료로, 지역별 온실가스별 도로부문 온실가스 배출량, 지역별 차종별 도로부문 온실가스 배출량 자료가 있습니다.
