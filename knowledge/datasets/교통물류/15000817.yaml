summary_user: 성남시 도로를 도로명별로 나눠 포장도로 1차로부터 16차로까지의 차로 수 구간과 미포장·미개통 구간을 정리한 집계 현황 파일입니다(약 110KB CSV, 데이터기준일자 포함). 성남시 도로계획 담당자나 교통 분석가가 '성남시 어느 도로가 몇 차로 구간을 얼마나 갖고 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id) 등 다른 도로망 데이터와는 도로명 문자열을 맞춰서만 연결된다.
description_portal: 차로별 도로현황은 도로의 전체 구간을 차로 수(차선 수)에 따라 구분하여 구성된 도로 인프라의 현황을 말합니다. 이는 도로계획, 교통흐름 분석, 인프라 투자 우선순위 설정 등에 필수적인 기초자료입니다. 차로 수는 통상적으로 2차로, 4차로, 6차로 이상 등으로 구분되며, 도로의 폭원, 용량, 통행 속도, 교통사고 위험도 등과 밀접한 관련이 있습니다. 예를 들어, 2차로 도로는 교통량이 적은 지역이나 농촌지역에 많고, 6차로 이상은 도시 간 고속도로, 주요 간선도로 등에서 흔히 나타납니다. 이러한 차로별 구분은 도로 기능(주간선, 보조간선, 집산도로) 및 **도로유형(국도, 지방도, 시도 등)**과도 연계되어 분석됩니다.
