summary_user: SRT 전용역인 수서역·동탄역·평택지제역의 주차장 면적과 주차면수를 장애인·여성·경차 전용 구분과 합계로 정리한 2023년 9월 기준 1회성 집계표로, 159바이트 크기의 소형 CSV 파일입니다. SRT를 타려는 이용객이나 역세권 분석가가 'SRT 역별로 주차면이 얼마나 되고 장애인·여성·경차 전용면은 몇 면인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 좌표·시설 데이터와는 역명(수서·동탄·평택지제)을 기준으로 매핑해 연결한다.
