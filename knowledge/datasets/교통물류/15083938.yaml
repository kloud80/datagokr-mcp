summary_user: 부산광역시 남구 자전거도로를 노선 한 건 단위로 담은 파일로, 포털 설명상 31개 노선의 종류(전용·우선·보행자겸용), 기점·종점 도로명주소와 위경도, 주요 경유지, 총길이(km)·너비를 담는다. 남구에서 해안 구간이나 도심 구간을 자전거로 달리려는 시민, 또는 노선별 연장·종류 구성을 파악하려는 분석가가 '남구에 자전거전용도로는 몇 km이고 어디서 어디까지인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어 시도명·시군구명 이름 매칭이나 기점·종점 위경도를 이용한 공간 결합으로 다른 지자체 자전거도로·대여소 데이터와 이어 쓴다.
description_portal: 부산광역시 남구의 자전거도로 총 31개의 노선에 대한 정보를 제공합니다. 자전거도로의 종류, 위치, 연장에 대한 정보를 파악할 수 있습니다. 부산광역시 남구 자전거도로의 종류에는 자전거전용도로, 자전거우선도로, 자전거보행자겸용도로가 있습니다.  자전거 전용도로는 자전거만 통행할 수 있도록 분리대, 경계석 등으로 차도 및 보도와 완전히 분리하여 설치된 도로이며, 자전거 우선도로는 자동차의 통행량이 적은 도로의 일부 구간에 자전거와 다른 차량이 안전하게 통행할 수 있도록 노면표시로 설치한 도로이며, 자전거·보행자 겸용도로는 자전거와 보행자가 함께 통행할 수 있도록 차도와 분리하여 설치된 도로입니다. 또한 자전거도로의 시점과 종점에 대한 정보를 제공하여 전체 구간에 대한 정보를 알 수 있습니다.  용호별빛공원에서 오륙도 스카이워크까지는 아름다운 해안 경치를 따라 자전거를 탈 수 있는 구간이며,  유엔기념공원부터 동천까지는 도심 속에서 자연을 느끼며 여유롭게 자전거를 탈 수 있습니다.
