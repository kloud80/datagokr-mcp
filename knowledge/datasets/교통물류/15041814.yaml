summary_user: 수인분당선 도시광역철도역별로 역번호와 역명, 영어·로마자·일본어·중국어(간체·번체) 표기, 운영기관명, 선명, 환승역 여부, 유실물 취급 여부, 신설일자를 한 행씩 담은 역 목록 파일(xlsx)이다. 안내표지·다국어 지도나 외국인 관광 안내를 만드는 사람이 '이 역의 역번호와 외국어 표기는 무엇인가', '어느 역이 환승역인가'를 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 철도 데이터와는 역명·역번호 이름 매칭이나 같은 기관(국가철도공단)의 다른 노선별 역번호 파일과 맞춰 이어 쓴다.
description_portal: 수인분당선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 영어명, 로마자, 일본어, 중국어간체, 중국어번체, 환승역여부, 신설일자 에 대한 데이터가 있습니다.도시철도나 광역철도 등에서 노선에 따라 역마다 번호를 부여하는 체계를 의미한다. 번호 등에 따라 역의 위치 등을 쉽게 알게 하거나, 그 지역의 언어가 익숙지 않은 외국인 관광객 등에게 보다 역을 쉽게 인식하기 쉽게 하기 위한 목적이 있다.역번호는 1983년 서울 지하철 2호선 서울대입구~을지로입구 구간이 개통될 때 세계 최초로 부여되기 시작했다. 그러나 아는 사람만 써먹는 등 활용은 잘 하지 않고 있다. 현재는 한국에서도 한국철도공사 노선들을 중심으로 새로 도입된 TTS 안내방송에서 역번호를 알려주기 시작했다. 또한 번호 변경이 자주 이루어져 영구적인 포인터 기능을 수행하지는 못하는 한국과는 달리, 비교적 번호 변경을 억제(신설역에 -1 등 가지 번호 사용)하는 경향이 있어 포인터로의 기능을 충실히 하는 편. 각 역들의 역번호를 외우고 다니면, 다른 사람에게 현재 역에서 목적지까지 몇 정거장이 걸리는지, 대략 시간이 얼마나 걸릴지 바로 알려줄 수 있다.
