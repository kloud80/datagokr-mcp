summary_user: 2018년 기준 전국 행정구역 읍면동 단위로 평일·주말을 나눠 집계한 평균속도를 담은 파일 데이터로, 링크별 건별 원천이 아니라 읍면동별 집계값이다. 교통 분석가나 지자체 담당자가 '우리 동네 도로는 평일과 주말에 평균 몇 km/h로 다니는가', '어느 읍면동이 상대적으로 느린가'를 비교하는 데 쓴다. 행정구역코드와 시도·시군구·읍면동명이 있어 인구·토지이용 같은 읍면동 통계와 이름·코드 매핑으로 이어 쓰지만, 실측상 전역 조인 키로 확인된 컬럼은 없다.
