summary_user: 서울특별시 대중교통(버스·지하철·택시)에서 승객이 두고 내린 습득물을 건별로 담으며, 분실물명·종류·처리 상태·등록일자·수령일자·보관 장소·상세 내용 등을 관리번호(LOST_MNG_NO) 단위로 제공한다. 지하철·버스·택시에 물건을 두고 내린 시민이 "내 지갑이 어느 분실물센터에 보관돼 있고 아직 찾아갈 수 있는 상태인가"를 확인하거나, 분석가가 분실물 종류·발생 빈도를 살펴보는 데 쓴다. 실측 컬럼에 다른 데이터와 이을 전역 조인 키가 없어, 경찰청 유실물 정보 등과는 분실물명·보관 장소 이름이나 같은 기관 기준으로만 맞춰 써야 한다.
description_portal: '서울특별시 대중교통(버스, 택시, 지하철) 습득물 정보입니다.대중교통통합분실물센터 홈페이지를 통해 분실물명, 분실물상태, 등록일자, 수령일자, 수령장소, 유실물상세내용, 분실장소 등의 정보를 제공합니다.*용어설명- 대중교통 분실물센터는 버스·지하철·택시 등 대중교통을 이용하는 과정에서 승객이 두고 내린 물건을 접수·보관하고, 주인을 찾아주는 서비스 기관, 대한민국에서는 서울을 비롯해 각 지자체가 운영하는 시민서비스 센터 혹은 경찰청 유실물 통합센터와 연계- 지하철: 각 노선 별 고객센터·역무실에서 접수 → 일정 기간 후 서울메트로 분실물센터(종로3가역 등) 이관.- 버스: 버스 차고지나 운수회사에서 접수·보관 → 서울버스공제조합 분실물센터로 이관.- 택시: 택시기사에게 직접 연락하거나, 서울택시조합 분실물센터(ARS 또는 홈페이지)에서 조회 가능.'
