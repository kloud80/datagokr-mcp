summary_user: 인천광역시 남동구에 등록된 자동차 대수를 연료(휘발유·경유·LPG·전기·수소·하이브리드·CNG 등)와 용도(비사업용·사업용)별로 나누고, 차종(승용·승합·화물·특수)별 대수와 합계를 담은 시군구 단위 집계표이며, 약 1KB 크기의 CSV 파일 하나다. 남동구의 전기차·수소차 같은 친환경차가 몇 대 등록돼 있고 사업용 화물차가 얼마나 되는지 확인하려는 주민·분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 다른 시군구 자료와 이으려면 시군구 이름(시군구별)과 연료·용도 구분명을 맞춰 붙여야 한다.
description_portal: 이 데이터는 연료 종류별로 분류된 자동차 등록 현황 정보를 제공합니다. 연료는 CNG, 경유, 수소, 엘피지, 전기, 하이브리드, 휘발유 및 기타 연료로 구분되어 있으며, 차량의 차종은 승용, 승합, 화물, 특수차량 등으로 분류됩니다. 또한, 용도별로는 비사업용과 사업용으로 구분하여 각 차량의 등록 상태를 체계적으로 파악할 수 있습니다. 이러한 세부 분류는 자동차 산업의 다양성과 변화 추이를 이해하는 데 도움을 주며, 친환경차 보급 현황과 연료 사용의 변화를 분석하는 데 중요한 기초 자료가 됩니다. 앞으로도 관련 정책 수립과 환경 규제 대응, 전기차 및 수소차 등 미래형 차량 확대에 있어 핵심적인 역할을 할 것으로 기대됩니다.
