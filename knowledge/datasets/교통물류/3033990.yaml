summary_user: 남양주시 안의 철도역을 역 단위로 정리한 소규모 목록 파일로, 중앙선·경춘선·진접선·별내선 등 선로명과 역명, 전화번호, 도로명주소를 담는다. 남양주 시민이나 방문객이 시 안에 어떤 노선의 어떤 역이 있는지, 역 연락처와 주소가 무엇인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 철도 데이터와는 역명·선로명 이름 매칭이나 도로명주소 기준으로만 이어 쓴다.
limits: 남양주시 범위의 역 목록만 담으며, 운행 시간·이용객·사고 같은 운영 현황은 이 파일에 없다. 역 코드 등 공통 키가 없어 다른 데이터와 연결할 때 역명 표기 차이를 직접 맞춰야 한다.
