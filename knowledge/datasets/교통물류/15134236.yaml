summary_user: 서울시와 25개 자치구가 운영하는 주정차 단속용 고정형 CCTV(불법주정차, 버스전용차로, 자전거전용차로 단속)의 설치 주소, 위도·경도, 자치구 코드, 단속 지점명을 CCTV 한 대당 한 행으로 담는다. 운전자나 내비·교통 서비스 개발자가 '이 도로 구간에 주정차·전용차로 단속 카메라가 있는가'를 확인하거나, 분석가가 자치구별 단속 CCTV 분포를 지도에 그리는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 자치구 코드(CGG_CD)나 지명으로 맞추거나 좌표로 공간 결합해 쓴다.
description_portal: '서울시 및 25개 자치구에서 운영중인 주정차단속용(불법주정차단속, 버스전용차로단속, 자전거 전용차로단속) 고정형CCTV의 위치정보를 제공하여 불법주정차 위반으로 인한 사회적 비용을 절감하고, 교통정보 플랫폼과 연계하여 시민에게 다양한 교통 서비스를 제공하고자 합니다.*원본시스템 : 서울특별시 교통질서 플랫폼(s-TOP) (구. 불법주정차 통합플랫폼)※ 제공부서 : 서울특별시 교통실 교통운영관 주차계획과(02-2133-4563)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
