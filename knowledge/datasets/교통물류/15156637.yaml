summary_user: 울산항에 입항한 선박별로 항차·호출부호 단위의 화물정보(양적하·통과화물)를 담으며, 선박명·선박유형, 하역 시설, 하역방법, 화물품목, 반출입 구분, 용적톤수·중량톤수, 양적하 항구, 입항일시를 건별로 제공한다. 해운·물류 분석가가 '특정 선박 항차에서 울산항 어느 시설로 어떤 화물이 몇 톤 양하·적하됐는가'를 확인하거나 울산항 물동량 흐름을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 항구코드(prtCd)·호출부호(callsgn)·항차(vyg)·업체코드(bzentyCd)로 같은 기관의 입출항·선박 데이터와 이름·코드 매핑으로 잇는다.
description_portal: '- 울산항 수출입 화물정보를 국가중점데이터로 개방하여, 이용자들의 편의성을 제고하고 항만 운영의 투명성을 강화하고자 합니다.- 본 데이터를 통해 울산항 선박 내 화물정보(양적하 및 통과화물)를 확인하실 수 있습니다.- 해당 데이터는 항구코드, 입항연도, 항차, 호출부호, 선박유형, 선박명, 시설코드, 시설명, 하역방법, 용적톤수, 중량톤수, 양적하항구명, 입항일시 등의 내용으로 구성되어 있습니다.- 업데이트 주기: 월간- 데이터 유형: 오픈API'
