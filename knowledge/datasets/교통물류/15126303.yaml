summary_user: 경기도 시군별로 자동차등록원부에 등록된 수입자동차 대수를 승용·승합·화물·특수 차종으로 나눠 담은 통계시점 기준 집계 자료로, 범위는 경기도 한 시도이고 단위는 시군구다. 수입차 판매·정비 사업자나 교통정책 분석가가 "경기도 어느 시군에 수입 승용차가 많이 등록돼 있는가"처럼 지역별 수입차 보급과 차종 분포를 비교하는 데 쓴다. 전역 조인 키(행정구역 코드 등)는 없어 다른 데이터와는 시군구명(signgu_nm)을 이름으로 맞추거나 같은 기관(경기도) 자료끼리만 연결한다.
description_portal: 이 데이터는 통계시점 기준으로 경기도 내 각 시군구별로 자동차등록원부에 등록되어 운행이 가능한 수입자동차의 대수를 구분하여 정리한 자료입니다. 주요 항목에는 ‘시군구명’을 통해 지역을 식별할 수 있으며, ‘승용차수’, ‘승합차수’, ‘화물차수’, ‘특수차수’는 각각 해당 지역에 등록된 수입차량의 차종별 대수를 나타냅니다. 이는 수입차의 지역별 보급 현황과 차종 분포를 파악할 수 있는 자료로, 자동차 관련 산업 분석, 교통정책 수립, 수입차 수요 예측, 정비 인프라 구축 등 다양한 행정 및 산업 분야에서 활용될 수 있습니다. 월별 상세 통계는 국토교통부 통계누리 사이트(stat.molit.go.kr)의 자동차등록현황보고 통계를 통해 추가적으로 확인할 수 있습니다.
