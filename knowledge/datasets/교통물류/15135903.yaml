description_portal: 한국교통안전공단은 항공장애 표시등 및 주간표지에 대해 정기적으로 관리실태 검사를 실시하고 있으며, 검사 결과는 적합/부적합으로 구분됩니다.검사는 국토교통부 공항시설법 및 관련 고시에 따른 관리실태검사표에 따라 수행하며, 세부 검사항목별 운영상태의 적합성을 판단합니다.공단의 검사결과에 대해 관할 지방항공청의 검토를 거쳐, 시정명령 대상 여부를 판단합니다.이후 공단에서 시정명령 통보에 따라 발행일자와 지적사항, 조치내용 등이 함께 기록됩니다.본 데이터는 검사 종류, 검사 방법, 검사표 문항, 시설검사 결과, 시정명령 이력 등 항공장애 표시등의 안전관리 현황을 종합적으로 제공합니다.
