summary_user: 서울시설공단이 관리하는 자동차전용도로의 도로시설물 164개를 시설물 한 건씩 담은 파일로, 노선별 시설명·시설 종류·준공일·공용년수·안전등급·보수보강 건수를 담는다. 시설 관리 분석가나 시민이 '내부순환로·강변북로 같은 노선에 30년 넘은 교량이나 C등급 시설이 얼마나 있는가'처럼 노후도와 안전등급을 노선별로 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 노선명·시설명을 이름으로 맞추거나 같은 기관(서울시설공단) 자료끼리만 이어 쓴다.
description_portal: 서울시설공단에서 관리하는 자동차전용도로의 164개 도로시설물 현황입니다. 본 데이터는 자동차전용도로 노션별로 시설물 명과, 시설물 종류, 준공일자, 공용년수, 안전등급, 보수보강 건수에 대하여 확인이 가능합니다. 수집된 데이터 기간은 2014년부터 2026년입니다. 164개 자동차전용도로 중 A등급 시설물은 16개, B등급 시설물은 140개, C등급은 3개, 등급 미지정 시설물 5개가 있습니다. 공용년수별로 164개 도로시설물 중 30년 이상 시설물은 81개이며, 20년이상 30년 미만은 41개, 10년 이상 20년 미만은 19개, 10년 미만 시설물은 23개 입니다.
