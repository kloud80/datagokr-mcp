description_portal: 2025년도 충청북도 지역별 전기자동차 보급 현황의 데이터입니다.충청북도 지역별 11개 시군(청주, 충주, 제천, 보은, 옥천, 영동, 증평, 진천, 괴산, 음성, 단양)에 대한 보급현황 자료입니다.전기자동차는 승용차, 화물차, 승합차(버스),전기이륜차로 구분되어 있습니다.환경부의 2025년 전기자동차 보급사업의 보조금 지급기준에 따른전기자동차 보급충북의 시군별 보급차종(승용, 화물, 승합, 이륜)에 대한 각 세부 보급현황에 관한 데이터를 제공해드립니다. ※ 붙임의 자료는 환경부 보조금 정산기준으로 작성되었으며, 국토부 차량등록 현황과는 차이가 있을수 있습니다.
