summary_user: SRT 경부선 열차의 승차율(승객 이동거리를 좌석거리로 나눈 비율, %)을 요일별 행과 열차번호별 열로 집계한 표로, 2026년 6월 말 기준 상반기 자료이며 9로 시작하는 열차번호는 중련열차 후부 차량의 승차율이다. 이용객이나 분석가가 경부선 SRT의 어느 요일·어느 열차가 붐비는지 확인하거나 증편·좌석 수요를 따져볼 때 쓴다. 다른 데이터와 맞출 전역 조인 키는 없으므로, 열차번호를 SRT 시간표 같은 같은 기관 자료와 직접 맞춰 이어 쓴다.
description_portal: '1. SRT  2026년 상반기까지의 경부선 열차들의 요일별 승차율 자료입니다. 승차율은 승객이 타고 간 거리를 열차가 운행한 좌석거리로 나눈 비율입니다.2. 해당 데이터 내 항목명은 열차번호를 의미합니다.3. 열차번호 9번으로 시작하는 열차는 두개의 차량이 연결된 열차의 후부 차량의 승차율을 나타낸 것입니다.  예시) 301(중련열차 중 전부차량의 승차율) + 9301(중련열차 중 후부차량의 승차율), (단위 : %)* 2026년 6월 말 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.'
