summary_user: 부산광역시 구·군이 실시한 불법 주정차 단속을 건별로 담으며, 구군명·단속일자·단속장소 주소가 들어 있다. 시민이나 분석가가 "우리 동네 어느 길에서 주정차 단속이 자주 일어나는가"를 알아보거나, 구군별 단속 추이를 비교해 주차정책 기초자료로 쓴다. 전국 공통 조인 키는 없어서 구군명이나 기관코드(insttCode), 단속장소 주소를 이름·주소 매핑해 다른 행정구역·주차장 데이터와 잇는다.
description_portal: 부산광역시 구·군별 불법 주정차 단속 현황을 제공하는 데이터로, 각 구군에서 실시한 불법 주정차 단속 현황을 보여주고 있습니다. 데이터에는 단속 일자, 단속지역 등의 정보가 포함되어 있으며, 지역별 불법 주정차 발생 특성과 단속 추이를 분석하는 데 활용할 수 있습니다. 또한 교통질서 확립, 주차정책 수립, 교통안전 개선 및 시민 불편 해소를 위한 기초자료로 활용 가능합니다. 연구기관, 공공기관, 민간기업 및 시민이 부산시의 교통행정 현황을 파악하고 정책 수립 및 서비스 개발에 활용할 수 있는 공공데이터 입니다.
