description_portal: 데이터는 경기도 화성시 관내 읍면동별 버스정류장에 설치된 버스정보안내단말기(BIT)의 설치 현황을 정리한 자료이다. 항목에는 정류장 수, 단말기 유형(쉘터형, 독립형, 전자종이형), 교통약자용 안내기 설치 여부, 설치 확인 필요 여부 등이 포함된다. 본 자료는 시민의 대중교통 이용 편의 향상 및 교통정보 접근성 제고를 목적으로 제공되며, 지역 간 설치 현황의 차이를 파악하여 교통 기반시설의 형평성과 접근성을 개선하는 데 기초자료로 활용될 수 있다. 특히 교통약자 지원 단말기 현황을 포함함으로써 교통 약자에 대한 배려 수준을 진단하고 포용적 교통환경 조성에 이바지할 수 있다.
