summary_user: 경기도 화성시 관내 버스정류장에 설치된 버스정보안내단말기(BIT) 현황을 읍면동 단위로 집계한 파일로, 읍면동별 정류장 수와 쉘터형·독립형·전자종이형 단말기 수, 교통약자용 안내기, 설치 확인 필요 건수를 담는다. 시청 교통 담당자나 분석가가 '화성시 어느 읍면동이 정류장 대비 도착정보 단말기나 교통약자용 안내기가 부족한가'를 비교하는 데 쓴다. 전역 조인 키가 없어 읍면동 이름을 맞춰 화성시 인구·정류장 원장 등 다른 읍면동 단위 자료와 이어 쓴다.
limits: 정류장별 위치나 단말기 개별 목록이 아닌 읍면동 집계라 특정 정류장의 단말기 유무는 알 수 없고, 실시간 도착정보도 담지 않는다. 행정동 코드 같은 공통 키가 없어 다른 데이터와는 읍면동 이름 매칭으로만 연결된다.
