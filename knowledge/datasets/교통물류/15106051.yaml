summary_user: 지역(구분)별로 노선버스가 쓰는 CNG·전기·수소 충전소 설치 수를 개소 단위로 집계한 전국 대상 소형 파일(csv 351바이트)이다. 지자체 교통 담당자나 분석가가 "우리 지역에서 수소·전기 저상버스를 늘리려면 충전 인프라가 얼마나 갖춰져 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 저상버스 운영현황 같은 같은 기관 자료와는 지역명(구분)을 이름으로 맞춰 연결해야 한다.
description_portal: 정부 및 지자체는 탄소중립 등을 위해 친환경 교통수단 확대를 위한 정책을 지속적으로 추진에 따라 CNG, 전기, 수소와 같은 친환경 저상버스 차량이 도입되고 있으며, 별도의 충전 인프라가 필수적입니다. 충전소가 부족하거나  위치가 적절하지 않으면 노선 운영이 제한적일 수 있음에 따라 저상버스의 배차 및 운행 가능 노선 설정에도 제약이 있을 수 있어 충전소 현황 저상버스 운영현황과 함께 조사하여 자료를 제공하고 있습니다.지역별 노선버스가 충전할 수 있도록 설치되어있는 버스 충전소 설치 수CNG, 전기, 수소 충전소단위( 개소)
