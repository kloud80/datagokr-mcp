summary_user: 전 세계 철도 관련 잡지를 잡지 한 종당 한 행으로 정리한 목록 파일(CSV, 약 80KB)로, 발행 국가·잡지명·주요 내용·발행주기·온라인 제공 여부·구독가격·홈페이지·분류(일반철도잡지, 철도모형 등)를 담는다. 해외 철도 기술·정책 동향을 따라가려는 연구자·학생·애호가가 "특정 국가에서 나오는 월간 철도 기술지 중 온라인으로 볼 수 있는 것은 무엇인가" 같은 질문에 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 나라명 같은 이름 값으로만 다른 자료와 맞춰 볼 수 있다.
description_portal: '"해외철도 잡지 정보" 는 전 세계의 다양한 철도 관련 잡지에 대한 정보를 제공합니다.해외 철도 기술, 동향, 정책 등에 관심 있는 전문가, 학생, 철도 애호가들에게 유용한 자료가 되길 희망합니다.ㅁ 글번호: 게시물의 순서를 나타내는 항목입니다.ㅁ 나라명: 해당 잡지가 발행되는 국가의 이름입니다.ㅁ 잡지명: 잡지의 정식 명칭입니다.ㅁ 내용: 잡지의 주요 다루는 주제나 특징에 대한 설명입니다.ㅁ 발행주기: 잡지가 얼마나 자주 발행되는지를 나타냅니다. (예: 월간,주간 등)ㅁ온라인지원: 온라인으로 잡지 콘텐츠를 제공하는지 여부입니다. (예: "지원", "미지원")ㅁ 구독가격: 잡지의 구독료 정보입니다. (참고: 가격은 환율이나 정책에 따라 변동될 수 있습니다.)ㅁ 이미지경로: 잡지 표지 등 관련 이미지 파일의 경로입니다.ㅁ 홈페이지: 잡지의 공식 홈페이지 주소입니다.ㅁ 구분: 잡지의 성격이나 종류를 분류합니다. (예: 일반철도잡지, 철도모형관련잡지 등)ㅁ 등록일: 데이터가 입력된 날짜입니다.'
