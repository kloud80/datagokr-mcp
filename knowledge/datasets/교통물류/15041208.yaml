summary_user: 부산교통공사가 운영하는 부산 2호선의 역별 장애인화장실 위치를 한 행씩 담은 파일로, 운영기관명·선명·역명과 함께 지상·지하 구분, 역층, 게이트 안팎, 가까운 출구번호, 상세위치를 적는다. 휠체어 사용자나 보호자가 '이 역에서 장애인화장실이 개찰구 안에 있는지, 몇 번 출구 쪽 몇 층에 있는지'를 미리 확인하는 데 쓰고, 교통약자 이동편의 분석가가 노선 내 설치 위치를 점검하는 데에도 쓴다. 실측 컬럼에 전역 조인 키(역코드 등)가 없어서, 다른 역 시설·승하차 데이터와는 역명·선명을 이름으로 맞춰 연결해야 한다.
limits: 역 코드 같은 공통 키가 없어 다른 데이터와 붙이려면 역명 표기를 직접 맞춰야 한다. 부산 2호선 한 노선만 담고 있으므로 다른 노선이나 다른 도시 지하철의 장애인화장실은 별도 파일이 필요하다.
