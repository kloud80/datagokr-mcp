description_portal: 광주교통공사에서 제공한 자료로, 광주도시철도의 각 지하철역별로 다양한 종류의 승차권이 얼마나 사용되었는지를 나타낸 수송 인원 통계입니다. 데이터는 각 역을 기준으로 하여 선불 및 후불 교통카드, 보통권(1회용 승차권), 우대권(무임승차권), 업무용 및 단체용 승차권 등 여러 유형의 승차권별 이용 인원을 구분하여 기록하고 있습니다. 교통카드는 일반 성인, 대학생, 청소년, 어린이, 경로우대자, 장애인, 국가유공자 등 세부 이용자 유형으로 나뉘며, 이와 같은 방식으로 각 승차권의 사용 내역이 항목별로 정리되어 있습니다. 마지막에는 모든 승차권 유형을 포함한 역별 총 이용 인원이 집계되어 있어, 각 역의 전체 수송 규모를 한눈에 파악할 수 있습니다
