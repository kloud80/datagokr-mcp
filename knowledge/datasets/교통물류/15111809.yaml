summary_user: 경상남도 남해군 관내 과속방지턱을 한 개씩 건별로 담은 파일로, 위치(도로명·지번주소, 위도·경도)와 재료·형태·높이·폭·연장 같은 제원, 도로유형(어린이보호구역 등)과 규격 준수 여부, 설치연도를 포함한다. 군 도로 담당자나 교통안전 분석가가 남해군에서 규격에 맞지 않거나 오래된 과속방지턱이 어디에 몰려 있는지 찾아 정비 계획을 세우는 데 쓴다. 전역 조인 키는 없어서 주소·위도·경도로 어린이보호구역·단속카메라 같은 다른 교통안전시설 데이터와 위치 기준으로 겹쳐 보거나 시군구명으로 다른 지자체 과속방지턱 현황과 이어 쓴다.
description_portal: "본 데이터는 경상남도 남해군 관내에 설치된 과속방지턱의 상세 제원 및 관리 현황을 체계적으로 제공하여, 교통안전 증진 및 안전한 도로 환경 조성에 기여하고자 합니다. 각 과속방지턱마다 부여된 고유 '관리번호'를 비롯하여, 제작에 사용된 '과속방지턱재료', 원호형이나 사다리꼴형 등 '과속방지턱형태구분', 그리고 핵심 규격인 '과속방지턱높이', '과속방지턱폭', '과속방지턱연장(길이)' 정보가 상세히 포함되어 있습니다. 또한, 과속방지턱이 설치된 도로의 '도로유형구분'(예: 어린이보호구역, 일반도로)과 해당 시설물이 현재 설치 기준을 준수하고 있는지 여부를 나타내는 '규격여부'를 명시하여 시설물 관리의 효율성과 정확성을 높였습니다. 이 자료는 남해군 내 교통안정시설의 현황 분석, 노후 또는 비규격 시설에 대한 정비 계획 수립, 보행자 안전 강화 및 차량의 효과적인 속도 제어를 위한 교통 정책 수립의 핵심 기초자료로 활용될 것입니다."
