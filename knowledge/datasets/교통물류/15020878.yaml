summary_user: 광양항에 기항하는 컨테이너선 정기 서비스를 서비스(항로) 단위로 담은 일회성 CSV 파일(약 14.5KB)이다. 행마다 터미널, 선사와 공동운항 선사, 얼라이언스, 서비스명, 최대 17개 기항지, 선박 규모(TEU), 투입 선박 수, 기항요일이 들어 있다. 해운·물류 분석가가 '광양항 어느 터미널에 어떤 선사·얼라이언스가 어떤 항로로 주 몇 회 들어오는가'를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 항만 물동량·입출항 데이터와는 선사명·서비스명·터미널명 같은 이름을 맞춰 붙여 써야 한다.
limits: 갱신주기가 수시(1회성)인 스냅샷 파일이므로 현재 운항 스케줄이나 시계열 변화를 보여주지 않는다. 화물 건 단위 반출입이나 물동량 수치는 담지 않는다. 선사·기항지 코드를 표준 코드표로 연결하는 키가 없다.
