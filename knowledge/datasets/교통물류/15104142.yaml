summary_user: 서울시 자치구별·연월별 전기차 등록 대수를 용도별(관용·자가용·영업용 등)로 나누고 차종(승용·승합·화물·특수)과 합계로 집계한 파일 데이터이며, 포털 설명상 기간은 2017년부터 2022년 7월까지이고 출처는 한국교통안전공단 자동차관리정보시스템입니다. 분석가나 자치구 담당자가 "어느 자치구에서 자가용 전기 승용차 등록이 가장 빠르게 늘었나"를 비교하거나 충전 인프라 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치구 이름(시군구별)과 연월을 기준으로 충전소 현황 등 다른 자치구 단위 통계와 이름 매핑으로 이어 쓴다.
