summary_user: 경기도 버스운송관리시스템(BMS)에서 나온 자료로, 버스 노선마다 인가된 운송업체를 노선ID와 업체ID 한 쌍씩 담은 매핑 원장이다. 교통 분석가나 행정 담당자가 '이 노선은 어느 업체가 운행하나', '업체별로 몇 개 노선을 맡고 있나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 따라서 경기도 버스 노선·업체 정보 같은 같은 기관 자료와 노선ID(route_id)·업체ID(entrps_id) 코드로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 통해 제공되는 노선별 인가된 업체 정보를 담고 있습니다. 데이터는 '노선ID'와 '업체ID' 두 가지 항목으로 구성되어 있으며, 각 버스 노선에 대해 인가된 운송업체의 고유 식별정보를 제공합니다. 이를 통해 특정 노선을 운행하는 업체를 파악할 수 있으며, 운송업체별 노선 운영 현황 분석, 정책 수립 시 업체별 배정현황 참고, 공공 교통 행정의 효율성 제고 등에 활용될 수 있습니다. 또한 대중교통 서비스의 지역별 격차 해소, 업체 간 경쟁 분석, 노선 이관 및 변경 기록 파악 등 다양한 교통행정 및 연구목적으로 사용될 수 있는 기초 자료입니다.
