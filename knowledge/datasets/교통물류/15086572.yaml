summary_user: 한국교통안전공단의 승인을 받아 튜닝 작업을 할 수 있는 튜닝제작업체를 업체 한 곳당 한 행으로 담은 전국 목록(CSV 약 39KB)이다. 각 행에는 주소, 튜닝인증 여부와 인증일자, 시설면적·도장시설·검사시설, 작업 가능 분야(길이·너비·높이, 총중량, 차체·차대, 연결장치, 승차장치, 물품적재장치 등) 여부가 들어 있다. 차량 소유자가 '우리 지역에서 적재함이나 승차장치 튜닝을 맡길 승인 업체가 어디인가'를 찾을 때나 분석가가 지역별 튜닝제작자 분포를 볼 때 쓰며, 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소 텍스트를 매칭해 이어 쓴다.
description_portal: 튜닝제작자는 자동차관리법에 따라 자동차 튜닝이 가능한 업체 중에서, 한국교통안전공단의 승인을 받아 자동차제작자로 등록된 업체 가운데 튜닝을 수행할 수 있도록 별도의 승인을 받은 사업체를 의미합니다. 해당 튜닝제작업체 목록은 매년 등록된 업체 정보를 바탕으로 공개되며, 이를 통해 연도별 튜닝제작자 산업의 현황을 파악할 수 있습니다. 또한 업체별 보유시설, 주소, 주요 작업 영역 등 구체적인 정보를 확인함으로써 실제 튜닝을 희망하는 수요자 입장에서는 어느 지역에서 어떤 방식의 튜닝이 가능한지를 사전에 확인하고 계획할 수 있어, 실질적인 정보 제공과 함께 산업 투명성 제고에에 기여합니다.
