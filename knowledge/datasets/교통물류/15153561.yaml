summary_user: 한국철도공사 화물 운송에서 운송장 접수 뒤 착역 변경·화물 지시 변경 등 수탁 조건이 바뀐 건에 대해 화차 단위로 지시번호·운송장번호·화통번호, 단가 기준 일시(1차·2차), 최종 산정된 화차 요금(화차요금)을 담은 건별 원천 기록이며, 범위는 전국이고 공간 정보는 없다. 철도 화물 분석가나 물류 사업자가 착역 변경 같은 수탁 변경이 어느 역에서 얼마나 자주 생기고 화차당 추가 요금이 어느 수준인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 다른 데이터와는 역명이나 같은 기관 화물 데이터의 운송장번호·지시번호·화차차량번호를 이름 매핑해 잇는다.
description_portal: 이 데이터는 한국철도공사의 화물 운송 계약 변경에 따른 요금 산정 및 정산 이력을 제공하는 수탁 관리 데이터입니다. "화물정보_수탁변경요금" 데이터는 운송장 접수 후 발생한 착역 변경, 화물 지시 변경 등 수탁 조건 변경 건별로 제요금 입력역, 입력 일자, 운송장 번호, 화통 번호, 화차 차량번호를 기록하며, 변경 사유에 따른 화물 운송 단가(1~3단계)와 적용 화차 차량 수를 상세히 보존합니다. "화물정보_수탁변경요금화차별" 데이터는 개별 화차 단위로 지시번호, 운송장번호, 화통번호를 매핑하고, 단가 기준 일시(1차, 2차)와 최종 산정된 화차 요금을 명시하여 화차별 변경 요금 산출 근거를 투명하게 제공합니다. 이 통합 데이터는 화물 운송 계약 변경 빈도 및 사유 분석, 착역 변경으로 인한 추가 요금 발생 패턴 파악, 고객별·노선별 수탁 변경 이력 추적, 운송 단가 적용 기준 및 요금 정산 프로세스 검증, 화물 운송 계약 관리 효율화 방안 연구, 철도 화물 물류 서비스 개선 및 정책 수립에 필수적인 수탁 변경 이력 데이터로 활용됩니다.
