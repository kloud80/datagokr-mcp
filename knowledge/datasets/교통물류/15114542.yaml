description_portal: 본 데이터는 안양시 관용차량 중 전기자동차 현황을 제공합니다. 이는 친환경 차량 보급 확대 정책에 기여하고, 공공부문 탄소중립 실현을 위한 기초 자료를 마련할 목적으로 수집되었습니다. 세부 항목으로는 기관명, 차명, 자동차등록번호, 비고(등록일자, 유류정보, 소유부서, 인승 등), 데이터기준일자가 포함됩니다. 관용 전기차의 보유 현황과 상세 정보를 파악하여 효율적인 차량 관리 및 친환경 차량 전환 계획 수립에 활용될 수 있습니다. 지속 가능한 도시 환경 조성 및 에너지 효율 증대를 위한 중요한 자료로 기여할 것으로 기대됩니다.
