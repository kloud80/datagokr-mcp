summary_user: 광양항 서측배후단지에 드나든 컨테이너 차량의 운행을 차량 한 대의 출입 한 건 단위로 담은 원천 기록으로, 차량번호(끝 4자리 마스킹), 진입·진출 게이트와 일시, 작업시간으로 구성된다. 항만 물류 분석가나 배후단지 운영자가 '어느 게이트에 어느 시간대 차량이 몰리고 단지 안에서 얼마나 머무는가'를 파악해 게이트 운영과 혼잡 완화를 검토하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 같은 기관(여수광양항만공사)의 광양항 물동량·배후단지 자료와 항만명·기간 기준으로만 맞춰 쓰며, 입출항 등 항만 물류 데이터와 잇는 데는 항만코드 매핑표가 필요하다.
description_portal: 광양항 서측배후단지 내 컨테이너 차량의 게이트별 도로 운행 정보입니다. 차량정보(개인정보로 인한 끝 4자리 마스킹처리), 진입게이트, 진입일시, 진출게이트, 진출일시, 작업시간으로 구성되어 있습니다. 갱신주기는 반기입니다.이 데이터는 단지 내 차량 이동 패턴을 분석해 물류 동선 최적화, 게이트 운영 효율화, 교통 혼잡 완화 등에 활용할 수 있습니다. 특히 진입과 진출 게이트 간 불균형은 교통 흐름 관리와 시설 개선 방향을 수립하는 근거 자료가 될 수 있으며, 출입 시간대와 작업시간 데이터를 연계하면 물류 처리량 분석 및 배후단지 운영 효율성 검토에도 유용합니다.
