summary_user: 의왕시 내 자전거보관소를 시설 1곳당 1행으로 담은 공간정보 파일로, 보관대수·설치일자·위도·경도와 관리번호·도로구간번호 같은 위치 식별 정보가 들어 있다(csv 약 6.5KB). 의왕시 안에서 자전거보관소가 어디에 얼마나 설치돼 있는지, 보행안전지수 산출이나 자전거 이용 접근성 분석에 기초 자료로 쓴다. 전역 조인 키는 없으므로 행정동읍면코드나 위도·경도 좌표를 기준으로 행정구역·자전거도로 노선 등 다른 공간 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 의왕시 내 자전거보관소 설치 현황을 기록한 공간정보 자료로, 보행안전지수 지도 시각화에 활용되는 중간 데이터입니다. 공간지리식별번호, 지형지물부호, 도로구간번호 등 위치 기반 정보와 함께 자전거보관소 명칭, 보관대수, 설치일자, 상세 위치정보를 포함하고 있어 자전거 이용자의 편의성과 접근성을 분석할 수 있습니다. 자전거보관소는 시민들이 안전하게 자전거를 주차할 수 있는 시설로, 친환경 교통수단 활성화와 보행자 안전 확보에 중요한 역할을 합니다. 이 데이터는 자전거 이용과 보행환경 간 상호작용을 평가하고 보행안전지수 산출 시 기초 자료로 활용됩니다. 2022년 기준으로 수집된 1회성 자료이므로 참고용으로 사용하는 것이 적절합니다.
