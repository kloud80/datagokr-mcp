description_portal: 서울특별시 서초구에서 운영하는 2026년 찾아가는 자전거 수리센터 운영 안내 프로그램입니다. 운영기간 2026년 4월부터 10월 까지입니다. (혹서기 7~8월 제외)운영일정은 4월22일에 서초1동, 5월 27일에 서초2동, 6월10일에 내곡동, 6월24일에 잠원동, 9월9일에 양재2동, 9월23일에 서초4동, 10월14일에 반포3동을 찾아갈 예정입니다.운영시간은 오전 10시부터 오후16시까지입니다. [수리접수는 15시까지입니다.] ※ 점심시간 12:00~13:00이니, 이 시간은 피해주시기 바랍니다.운영내용은 자전거 무상 점검·수리 (부품교체 시 실비 징수)를 합니다. 특히, 개인소유 일반자전거에 한하여 이 프로그램은 진행됨을 유념해주시기 바랍니다. 주민들이 더욱 안전하고 편리하게 자전거를 이용할 수 있도록 고정식 자전거 수리센터와 더불어 찾아가는 수리센터를 운영합니다. 친환경 교통 수단인 자전거 활성화를 통해 탄소중립도시 서초를 만들어가도록 노력하겠습니다.
