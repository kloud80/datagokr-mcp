summary_user: 교통영향평가 보고서의 기하구조 항목에서 뽑은 가로구간(시작·끝 교차로, 구간거리, 차로수)과 구간별 조사일·시간대·분 단위 차종별 교통량(승용차·버스·화물 규모별)을 담은 전국 범위의 건별 조사 원천 파일입니다. 개발사업 주변 도로의 첨두시간 교통량이나 차종 구성을 확인하려는 분석가·사업자가 '이 교차로 사이 구간에 출퇴근 시간대 화물차가 얼마나 다니나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 교차로명 같은 이름 매칭으로만 연결하며, 같은 파일 안에서는 가로정보아이디로 구간 정보와 교통량을 묶는다.
