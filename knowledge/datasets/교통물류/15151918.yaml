summary_user: 한국도로공사가 관리하는 고속도로의 살얼음·결빙 취약 구간을 구간 단위로 담은 기본 정보로, 노선·시작/종료 이정·위경도·주행방향·시설명·등급과 산정 점수를 구간별로 담는다. 운전자나 교통안전 분석가가 겨울철 어느 노선의 어느 이정 구간이 결빙 위험이 높은지 확인하고 등급별로 살펴보는 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 노선코드(RTE_CD)와 이정 범위로 같은 기관의 고속도로 데이터에 맞추거나 위경도로 기상·사고 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하는 도로살얼음결빙구간 기본 정보입니다.
