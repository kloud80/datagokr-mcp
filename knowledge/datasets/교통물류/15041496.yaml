summary_user: 부산교통공사가 운영하는 부산 3호선의 역별·승강장별로 차량 순서와 출입문 번호마다 전동차와 승강장 사이 안전거리(이격거리)를 담은 건별 파일 데이터이다. 교통약자 단체나 안전 분석가가 '부산 3호선 어느 역, 몇 번째 칸 몇 번 문에서 승강장 틈이 넓어 발 빠짐 위험이 큰가'를 확인하거나 안전발판 설치 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 역 마스터나 승하차·시설 데이터와는 운영기관명·선명·역명 같은 이름 매핑으로만 이어 쓴다.
