summary_user: 진주시 관내 스마트 버스쉘터(정류장)별로 날짜별 이용자수와 도로명주소·장소명·정류소 아이디·위경도·CCTV 관리번호를 담은 건별 파일 데이터이며, 범위는 진주시 한 곳이고 위치는 주소·좌표 단위로 나온다. 교통 분석가나 시 담당자가 '진주시 스마트정류장 중 이용자가 많은 곳은 어디이고 날짜별로 어떻게 달라지나'를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 정류소 아이디(정류소 아이디)를 정류장 원장·버스도착정보의 정류소 ID와 맞추거나 좌표·주소로 공간 매칭해 이어 써야 한다.
description_portal: 진주시 관내에 설치된 스마트 버스쉘터 및 정류장 정보와 이용 현황을 제공합니다. 데이터에는 스마트정류장 노드아이디, 이용자수, 날짜, 소재지 도로명주소, 장소명, 정류소 아이디, 좌표_X, 좌표_Y, CCTV 관리번호 등이 포함되어 있습니다. 이 데이터는 정류장 이용 패턴 분석, 교통 서비스 개선, 안전 관리 및 도시 계획에 활용할 수 있으며, 대중교통 효율성 증대와 시민 편의 향상에도 크게 기여합니다. 또한, 실시간 모니터링을 통해 신속한 문제 대응이 가능하여 보다 안전한 교통 환경 조성에 도움을 줍니다.
