summary_user: 경기도 버스운송관리시스템(BMS)에서 정류소 ID 체계를 바꾸면서 생긴 변경 내역을 정류소 한 곳당 한 행으로 담는다. 정류소명, 새 정류소ID, 변경 전 정류소ID와 정류소번호가 들어 있다. 분석가나 시스템 개발자가 예전 ID로 쌓인 노선·운행·교통카드 기록이 지금 어느 정류소에 해당하는지 확인할 때 쓴다. 전역 조인 키는 실측되지 않아서 경기도 버스 데이터와는 같은 기관의 정류소ID(station_id)나 변경 전 ID·정류소명으로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에서 관리하는 정류소ID의 변경 이력을 나타낸 자료입니다. 각 정류소에 대해 기존에 사용되던 정류소ID와 정류소번호를 새로운 ID 체계에 따라 갱신한 내역이 포함되어 있으며, '정류소명', '정류소ID', '변경전 정류소ID', '변경전 정류소번호' 등의 항목을 포함합니다. 이 데이터는 정류소 ID 체계 개편 또는 시스템 정비에 따라 변경된 ID를 추적할 수 있도록 설계되었으며, 노선 및 운행 정보, 교통카드 기록 등 기존 데이터와 연계한 분석 및 시스템 연동 시 기초자료입니다.
