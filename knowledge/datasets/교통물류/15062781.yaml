summary_user: 충청북도 옥천군에서 단속된 불법 주정차 위반 건수를 구분별 행마다 1~12월 월별 값과 합계(계)로 정리한 집계표이며, 건별 단속 원천 기록이 아니다. 군청 교통 담당자나 지역 연구자가 '옥천군 주정차 위반이 어느 달에 많고 해마다 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 주정차위반 통계와는 지역명·연도를 손으로 맞춰 비교해야 한다.
limits: 단속 위치나 좌표가 없는 비공간 집계라 지점별 다발 구역 분석에는 쓰지 못한다. 법정동·시군구 코드 같은 공통 키가 없어 다른 데이터와 자동 연결이 되지 않는다.
