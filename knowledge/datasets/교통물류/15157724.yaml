summary_user: 인천항 컨테이너 단위의 선적정보, 입항정보, 분석항만정보를 REST API로 조회하는 데이터로, 터미널 코드·컨테이너 번호·접안 예정일 등을 넣어 건별로 받는다. 물류기업이나 화주가 특정 컨테이너가 인천항 어느 터미널에서 언제 선적·입항되는지 확인하거나, 분석가가 인천항 물류 흐름을 살피는 데 쓴다. 응답 필드에서 전역 조인 키가 확인되지 않아 다른 데이터와는 터미널 코드나 컨테이너 번호 같은 이름·코드 매핑, 또는 같은 기관(인천항만공사) 코드로만 연결한다.
description_portal: 인천항 컨테이너 정보 조회 Open API 서비스는 컨테이너 단위의 선적정보, 입항정보, 분석항만정보 등을 조회할 수 있는 기능을 제공합니다. REST 방식의 API 형태로 제공되며, 선적년도, 선적수, 터미널 코드 등 다양한 파라미터를 통해 데이터를 호출할 수 있습니다. 항만물류 정보의 디지털화를 통해 교통물류의 효율성 제고와 항만운영의 스마트화를 지원하며, 연간 약 11,000건의 이상의 선적 데이터를 기준으로 분석이 가능합니다. 항만 정책 수립, 물류 흐름 분석, 민간 물류기업의 정보 활용 등에서 유용하게 활용될 수 있습니다.
