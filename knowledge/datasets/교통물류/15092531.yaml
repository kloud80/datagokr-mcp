description_portal: '데이터 개요국내 공역에서 현재 유효한 항공고시보(NOTAM)를 확인할 수 있는 공공데이터입니다.본 데이터는 국토교통부가 제공하는 항공안전 통보 체계의 일환으로, 전국 FIR(Flight Information Region) 구역 내 공항별로 발행된 유효한 항공고시보 정보를 담고 있습니다. 고시보는 공역 및 공항 운영과 관련된 일시적 변동사항이나 주의사항을 항공종사자에게 신속히 전달하는 역할을 함데이터 제공 항목issue time항공고시보 발행 일시 (UTC 기준)FIR소속 비행정보구역(Flight Information Region), 예: RKRRLocation적용 공항 코드 (예: RKSI, RKSS, RKTU 등)Qcode고시보 분류 코드 (예: QGAXX – GPS 장애 관련)Notam#고시보 고유 번호 (예: G0825/25)Start Date UTC고시보 유효 시작 시각 (UTC)End Date UTC고시보 유효 종료 시각 (UTC)Full Text고시보 원문 전체 내용 (항로, 고도, 제한사항, 일정 등 포함)활용 안내항공기 운항 계획 수립: RAIM 예보, 공역 제한, 장비 장애 등에 대한 고시보를 통해 안전 운항 계획 수립비행사 및 항공교통관제사 참고: 일시적 공역 제한, 군사 훈련, 장애 예보 등에 따라 항로 및 운항방식 조정 가능전자지도 및 시스템 연계 활용: KML 파일 활용 시 항공지도 소프트웨어와 연동해 시각적 분석 가능데이터 해석 시 유의사항발행 시각 및 유효시간은 UTC 기준이며, 한국시간(KST)은 +9시간을 가산해야 함Full Text는 국제표준 NOTAM 형식(ICAO AIRAC 기준)으로 작성되어 있으며 전문적인 해석 필요동일한 Qcode가 여러 공항에 반복 적용될 수 있으므로, **위치 정보(FIR, Location)**와 함께 해석해야 정확장비별 장애 예보(GPS RAIM 등)는 일정 시간대별로 명시되어 있으므로, 시간대별 세부 분석 필요'
