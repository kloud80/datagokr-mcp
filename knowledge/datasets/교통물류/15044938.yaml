summary_user: 대구도시철도 1·2호선 역사 안의 임대시설(편의기기·매장·점포·상가 등)을 역명·시설물명별로 한 건씩 적고, 임대유형·수량·계약 시작일과 종료일·임대면적(제곱미터)을 담은 CSV 파일이다(약 5KB). 역사 상가 입점을 검토하는 사업자나 공공자산 운영을 살피는 분석가가 '어느 역에 어떤 임대시설이 얼마의 면적으로 언제까지 계약돼 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역명을 이름으로 맞추거나 같은 기관(대구교통공사)의 역 정보·승하차 자료와 이름 매핑으로 이어 쓴다.
