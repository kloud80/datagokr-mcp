description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 투명행정 및 신뢰경영 운영정보 데이터로, 대구도시철도 1·2호선 역사 내 임대시설 운영 현황을 제공합니다. 본 자료는 편의기기, 매장, 점포, 상가 등 다양한 유형의 임대시설 정보를 포함하고 있으며, 시설별 수량, 임대 시작일 및 종료일, 임대면적 등 운영 및 계약 현황에 관한 주요 항목으로 구성되어 있습니다. 이를 통해 역사 내 유휴공간 활용 현황과 상업시설 운영 실태를 체계적으로 파악할 수 있으며, 임대 계약 관리, 공공자산의 효율적 운영, 시설 활용도 분석 및 수익관리 체계 개선을 위한 기초자료로 활용될 수 있습니다. 또한 역사 기반 상권 활성화, 공공시설의 민간 활용 방안 검토, 데이터 기반 자산관리 및 운영계획 수립, 공공데이터를 통한 행정의 투명성과 책임성 제고를 위한 자료로 활용할 수 있습니다. 본 데이터는 반기마다 정기적으로 갱신됩니다.'
