summary_user: 대구교통공사가 운영하는 도시철도 노선의 역별 화장실 위치를 화장실 한 곳당 한 행으로 담은 CSV 파일(약 16KB)로, 노선·역명·지상 구분·역층·개찰구 안팎·가까운 출구번호·상세위치·화장실 구분을 포함한다. 대구 지하철 이용자나 교통약자 안내 서비스 개발자가 '이 역 화장실이 개찰구 안에 있어 요금을 내고 들어가야 하는가, 몇 번 출구 쪽인가'를 확인하는 데 쓴다. 전역 공통 조인 키는 없어 다른 역 정보·시설 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 연결해야 한다.
