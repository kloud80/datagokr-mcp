summary_user: "경기도 도로대장 전산화 시스템에 등록된 교통표지를 노선·구간별로 한 건씩 담은 원천 목록으로, 관리기관, 노선번호, 구간번호, 위치(시점·방향), 표지 종류와 명칭(예: 낙석도로, 곡선유도), 설치형식, 설치일자, 사진 파일을 담는다. 도로 관리자나 교통안전 분석가가 '이 노선 구간에 어떤 경고표지가 언제 설치됐고 오래된 것은 무엇인가'를 확인해 유지관리·교체 계획을 세우는 데 쓴다. 전역 조인 키는 없어 노선번호(route_no)·구간번호(section_no)나 관리기관명으로 같은 경기도 도로대장 계열 데이터와 이름·코드 매칭으로만 잇고, 표준노드링크(link_id·node_id)와 바로 연결되지 않는다."
description_portal: 이 데이터는 경기도 도로대장전산화시스템을 기반으로 수집된 교통 표지판 관련 정보를 포함하고 있으며, 도로 구간별로 설치된 각종 표지의 종류, 명칭, 설치위치, 설치형식, 설치일자 등을 제공합니다. 주요 항목으로는 '관리기관', '노선번호', '구간번호', '이력코드', '위치?시점', '위치?방향', '표지 종류', '표지 명칭', '설치형식', '설치일자', '비고', '입력일', '사진 파일'이 있으며, 교통안전시설의 유지관리, 시설물 노후도 파악, 도로환경 개선 설계 및 표지 시각화 자료 구축 등에 활용될 수 있습니다. 특히 '표지 명칭' 항목에는 '우로이중굽은도로', '곡선유도', '낙석도로' 등 실제 도로상황에 맞는 교통표지명이 포함되어 있어 현장 기반 교통안전계획 수립에 유용합니다.
