summary_user: 서울 양천구 관내 횡단보도에 설치된 옐로카펫을 한 곳당 한 행으로 담은 건별 목록으로, 설치위치·설치주소·설치일자와 데이터 기준일자를 담는다(파일 약 2KB 규모). 학부모나 구청·학교 담당자가 우리 동네 어린이 통학로 횡단보도 중 옐로카펫이 어디에 언제 설치됐는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치주소를 지오코딩하거나 주소 문자열로 맞춰 어린이보호구역 표준데이터 등과 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구 관내에 설치된 횡단보도 옐로카펫의 현황을 체계적으로 수집·정리한 자료이다. 옐로카펫은 어린이 보행자의 시인성을 높이고 운전자의 주의를 환기하기 위해 횡단보도 진입부를 노란색으로 도색한 안전시설로서, 교통사고 위험을 낮추는 데 중요한 역할을 수행한다. 본 자료에는 옐로카펫의 설치위치, 설치장소, 설치일 등 주요 정보가 포함되어 있으며, 관할 기관의 보행안전 정책 수립과 시설 개선 계획에 활용될 수 있다. 또한 어린이보호구역 내 안전 인프라 확충 여부를 파악하는 기초 자료로 제공되며, 지역 내 교통안전 수준을 객관적으로 평가하는 데에도 기여한다. 본 데이터는 안전한 보행 환경 조성을 위한 행정적 판단과 정책 추진을 지원하기 위한 목적으로 구축되었다.
