summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 도내 버스 운수사의 변경 이력을 이력 건별로 담으며, 항목은 이력ID·업체ID·업체명 세 가지다. 교통 분석가나 정책 담당자가 특정 운수사가 언제 신규 등록되거나 명칭이 바뀌었는지 같은 업체 변동 흐름을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 경기도 버스 데이터와는 업체ID(entrps_id)나 업체명을 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로, 경기도 내 버스 운수사의 업체 이력 정보를 제공합니다. 항목은 '이력ID', '업체ID', '업체명'으로 구성되어 있으며, 운수사의 시스템상 변경 이력 및 식별 정보를 포함합니다. 이를 통해 특정 업체의 인허가 및 운영상 변동 사항, 신규 등록, 명칭 변경 등의 행정적 흐름을 파악할 수 있습니다. 데이터는 버스 운영 이력 관리, 업체별 정보 분석, 정책 수립 시 근거자료로 활용 가능하며, 특히 운송사업의 변동성 모니터링과 교통 서비스 운영 평가 자료로도 활용될 수 있습니다.
