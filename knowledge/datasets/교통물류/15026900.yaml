summary_user: 부산 수영구 10개 행정동별로 이륜차 등록 대수를 용도(관용·자가용)와 배기량 구간(50cc 미만, 50cc 이상, 100cc 초과, 260cc 초과)으로 나눠 담은 집계 파일이다(csv 579바이트, 읍면동 단위). 구청·교통 분석가가 '수영구에서 오토바이 등록이 가장 많은 동은 어디이고 대형 배기량 비중은 어떤가' 같은 동별 비교 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름을 행정구역 코드에 매핑해 이어 쓴다.
description_portal: 부산광역시 수영구 이륜차의 등록 대수 현황을 용도(관용, 자가용), 규모(경형, 소형, 중형, 대형)별로 정리한 파일 데이터이다.수영구의  이륜차 등록 현황 정보를 이륜차 배기량(50cc미만, 50cc이상, 100cc초과, 260cc초과)과 행정동(광안1동, 광안2동, 광안3동, 광안4동, 남천1동, 남천2동, 망미1동, 망미2동, 민락동, 수영동)에 따라 구분하여 보기 쉽게 정리하였습니다.이를 통해 광안동, 남천동, 망미동, 민락동, 수영동의 오토바이 등록대수를 비교할 수 있습니다.수영구에서 이륜차 등록대수가 많은 동은 망미1동, 민락동이며, 적은 동은  남천2동, 망미2동임을 알 수 있습니다.
