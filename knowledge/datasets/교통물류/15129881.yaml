description_portal: 서울시설공단에서 관리중인 홍지문 터널, 정릉터널, 구룡터널 내 공기질 측정 결과입니다.터널은 서울시내 자동차전용도로에 위치해있으며, 터널 입구부, 중앙부, 출구부에서 각각 측정한 CO(이산화탄소) 및 NOx(질소산화물) 수치를 볼 수 있습니다.국토교통부령 법정기준에 따르면 일산화탄소 100ppm이하, 질소산화물 25ppm 이하가 정상이며, 터널 3개소(홍지문터널, 정릉터널, 구룡터널) 모두 일산화탄소, 질소산화물 농도 측정 결과 모두 양호합니다.터널 내 공기질 관련 연구, 현황 조사 등에 사용할 수 있는 자료입니다.
