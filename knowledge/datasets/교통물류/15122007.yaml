summary_user: 성남시 버스정류장에 설치된 버스정보안내단말기(BIT)를 단말기·정류장 단위로 담은 현황 파일(CSV 약 158KB)로, 정류장번호·정류장명(국문·영문)과 함께 안내기 유형, 제조사, 프로그램 버전, 화면 해상도, 화면전원·제어보드 상태, 소리 크기, 사용 여부, 등록일자를 담는다. 시·교통 담당자나 분석가가 성남시 어느 정류장의 안내단말기가 구형 버전이거나 전원·제어보드 이상 상태인지, 제조사별로 몇 대가 운영 중인지 확인하는 데 쓴다. 전역 조인 키는 없어서, 성남시 정류장 현황이나 버스 도착정보와는 정류장번호(정류장번호)·정류장명을 이름·코드 매핑으로 맞춰 잇는다.
limits: 포털 설명은 좌표·와이파이·냉온풍기 같은 정류장 시설 항목을 안내하지만, 실제 파일 필드는 단말기 정보뿐이고 위도·경도도 없어 지도 표시나 시설 분석에는 바로 쓰기 어렵다. 전국 공통 정류장 키가 없으므로 다른 기관 데이터와 붙일 때는 정류장번호 체계가 같은지 먼저 확인해야 한다.
