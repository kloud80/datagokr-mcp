description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선 역사 내 스마트도서관 운영 현황을 제공합니다. 주요 항목은 역사명, 설치 위치(출입구, 대합실 등), 운영주체(공공도서관, 구청 등), 연락처 등으로 구성되어 있으며, 도시철도 이용객이 역사 내 스마트도서관의 위치와 운영 정보를 쉽게 확인할 수 있도록 제공합니다. 본 자료는 시민의 독서 접근성 향상과 생활문화 서비스 확대를 지원하며, 스마트도서관 운영 현황 분석, 문화시설 이용 활성화, 공공서비스 개선 및 지역 문화정책 수립을 위한 기초자료로 활용될 수 있습니다. 또한 스마트도시 기반 서비스 구축, 생활 SOC 운영 관리, 위치기반 서비스(LBS) 개발 및 시민 편의 증진을 위한 다양한 행정·연구 및 민간 분야의 기초자료로 활용할 수 있습니다. 본 데이터는 변경 시 갱신됩니다.'
