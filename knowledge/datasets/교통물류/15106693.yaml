      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /TrafficInfoPage
    name: 도로 소통정보 조회
    endpoint: https://apis.data.go.kr/4820000/SCOpenApi/TrafficInfoPage
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
