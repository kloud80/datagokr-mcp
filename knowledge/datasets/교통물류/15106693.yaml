summary_user: 순천시 교통정보센터가 현장장비로 수집한 정보를 세 가지 오퍼레이션으로 제공하며, 스마트교차로 카메라별 1시간 단위 방향별(직진·좌회전·우회전) 교통량·평균속도와 차종별 교통량, 관내 주차장의 유형·구획수·운영시간·요금·좌표, 도로 구간(시점~종점)별 실시간 평균 속도와 통행시간을 담는다. 순천 시내에서 지금 어느 도로 구간이 막히는지, 특정 교차로에서 좌회전 차량이 시간대별로 얼마나 몰리는지, 목적지 근처 무료 주차장이 어디인지 알고 싶은 시민·교통 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 주차장·교차로는 위경도 좌표로, 도로 구간은 도로명·시종점 명칭 매핑으로만 다른 교통·지도 데이터와 연결한다.
description_portal: 순천시 교통정보센터에서 현장장비를 통해 수집 및 가공한 도로별 소통 정보, 순천시 관내 주차장 주차장 운영 정보, 스마트교차로 수집 정보 등을 API를 통해 제공합니다.1. 스마트 교차로 교통 통계 조회교차로에 설치된 CCTV를 통해 수집된 교통 통계 정보를 조회하기 위해 인증키와 페이지번호, 한페이지의 결과 수, 데이터 수집 시간을 이용하여 교차로ID, 카메라ID, 수집일시, 데이터 수집 위치(교차로명(방향)), 방향별(직,좌,우회전) 교통량, 방향별(직,좌,우회전) 평균속도, 차량별(소,중,대) 교통 통계를 1시간 단위로 조회하는 스마트 교차로 교통 통계 조회 기능.2. 주차장 운영정보 조회인증키와 페이지번호, 한페이지의 결과 수를 이용하여 주차장의 주차장 관리번호, 주차장 명칭, 주차장구분, 유형, 주소, 주차구획수, 부제시행구분, 운영요일, 평일시작,종료시간, 공휴일시작,종료시간, 요금정보, 요금정보 상세설명, 관리기관명, 전화번호, 주차장 위도,경도, 주차장 등록일자를 조회하는 주차장 운영정보 조회 서비스3. 도로 소통정보 조회인증키와 페이지 결과수, 페이지 번호를 이용하여 실시간으로 도로명, 도로의 시점명, 도로의 종점명, 시점명부터 종점명까지의 구간을 통과하는 차량들의 평균속도, 차량들의 평균 통행시간(초)을 조회하는 도로 소통정보 조회 서비스.
team:
  dept: 디지털정책과
services:
  - op: /SmartCrossInfoPage
    name: 스마트교차로 교통 통계 조회
    endpoint: https://apis.data.go.kr/4820000/SCOpenApi/SmartCrossInfoPage
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: clctDT
        required: false
        desc: 데이터 수집 시간
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /ParkingOperInfoPage
    name: 주차장 운영정보 조회
