summary_user: 경기도 도로대장 전산화 시스템을 바탕으로 도로 구간별로 지정된 우회도로를 한 건씩 담은 원천 목록이다. 항목은 노선번호·구간번호, 시점·종점 위치와 좌표, 우회도로 종류, 폭원·연장, 주요 경과지, 지정일이다. 도로 관리 담당자나 교통 분석가가 "이 노선 구간이 통제되면 어느 대체 도로로 얼마나 돌아가야 하나"를 확인하거나 사고·재난 대응 계획을 세울 때 쓴다. 전역 조인 키는 없어서, 다른 도로대장 데이터와는 노선번호·구간번호(route_no, section_no)를 이름이나 코드로 맞춰 잇고, 표준노드링크와는 시종점 좌표를 공간적으로 대조해 잇는다.
description_portal: '이 데이터는 경기도 도로대장전산화시스템을 기반으로 도로 구간별로 지정된 우회도로에 대한 정보를 포함하고 있으며, 노선번호, 구간번호, 시점·종점 위치, 우회도로 종류(예: 국도, 군도), 우회도로 폭원 및 연장, 주요 경과지, 지정일, 비고 등의 항목으로 구성되어 있습니다. 우회도로는 기존 도로의 통행 제한, 유지보수, 혼잡 완화 등의 목적으로 설정된 대체 노선으로, 도로 운영 및 교통 분산 정책의 일환으로 관리됩니다. 본 자료는 우회도로의 설치 목적, 도로 대체 경로의 구조적 특성, 지역별 대체 교통망 분포 분석, 사고 및 재난 시 대응 계획 수립 등에 활용될 수 있으며, 공간정보 연계를 통해 도로 네트워크 시뮬레이션, 교차로 교통량 분산 효과 분석 등에도 유용합니다.※제공되는 도로대장 정보는 구축 시기에 따라 현재 도로현황과 다를 수 있으니, 참고자료로 사용하시기 바랍니다.'
