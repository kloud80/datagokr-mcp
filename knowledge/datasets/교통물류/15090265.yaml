description_portal: 본 데이터는 광주광역시 서구에서 교통법규 위반으로 부과된 과태료에 대해 압류가 진행된 건의 연도별 현황을 수록한 자료입니다. 항목은 회계연도, 압류구분, 압류일자, 수납여부 및 일자, 수납금액, 체납일자, 체납 본세/가산금 금액, 압류해제일자, 부과일자 등으로 구성되어 있습니다.이 데이터는 과태료 체납으로 인해 자산이 압류된 사례를 정량적으로 파악할 수 있으며, 지방세외수입 징수율 분석, 체납 행정의 실효성 평가, 압류 이후 자진납부율 파악, 압류 해제 처리 흐름 등을 분석하는 데 활용됩니다. 또한 압류구분 및 해제일자 정보를 통해 민원 대응의 투명성을 제고하고, 시민권익 보호와 신속한 행정처리 기반 확보에도 기여할 수 있습니다.특히 이 데이터는 지속적 체납자의 반복성, 압류 후 수납률 변화, 체납금 구성(본세 vs. 가산금) 비율 등을 활용한 세외수입 운영 효율 분석, 강제징수 전략 평가, 체납 예방 정책 기획 등에 유용하게 활용됩니다. 행정 재정 안정성과 시민 응답행동 분석 자료로서도 의미 있는 기반 데이터입니다.
