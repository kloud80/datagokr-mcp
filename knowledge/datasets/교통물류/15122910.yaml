description_portal: '활주로란 항공기 착륙과 이륙을 위하여 국토교통부령으로 정하는 크기로 이루어지는 공항 또는 비행장에 설정된 구역을 의미합니다.공항명, 활주로식별자, 활주로유형, 길이, 폭, 활주로 구성요소, 활주로 방향, 보호구역 등에 대한 정보를 제공하고 있습니다.활주로구성요소유형은 아래와 같습니다.NORMAL : 항공기의 이륙과 착륙이 실제로 이루어지는 주 활주로 구간을 의미합니다.SHOULDER : 활주로 양측에 위치한 어깨 구간으로, 비상 시 항공기 주익 또는 바퀴 일부가 넘어갈 수 있는 공간입니다.활주로보호구역유형은 아래와 같습니다.RESA : 활주로 말단에 위치한 안전지역으로, 항공기가 활주로를 초과 이탈할 경우를 대비한 구간입니다.CWY : 항공기의 이륙을 지원하기 위해 활주로 연장선상에 설정된 이륙 초과 구간입니다.STOPWAY : 항공기가 이륙을 중단할 경우를 대비해, 활주로 끝에 설치된 정지 전용 구간입니다.'
