summary_user: 한국교통안전공단 운수안전컨설팅지원시스템의 사고정보를 국가 표준링크 단위로 분석한 산출 정보로, 개별 사고마다 링크, 사고년월, 사고 좌표, 인근 관심지점(POI) 좌표와 거리, 분류명을 건별로 담으며 범위는 전국입니다. 교통안전 분석가나 지자체 담당자가 특정 도로구간이나 관심지점 주변에서 어떤 사고가 났는지 확인하거나 교통사고 안전모형을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 링크id를 국가 표준노드링크와 이름·코드로 맞추거나 사고·POI 좌표로 공간 결합하는 방식으로 이어 쓴다.
description_portal: 한국교통안전공단 운수안전컨설팅지원시스템에서 관리하고 있는 사고정보를 분석한 POI 정보로특정 도로구간(링크)에서 발생한 사고관련 정보를 POI 분석정보로 제공하는 산출 정보 입니다.개별사고에 대한 발생위치 및 발생 내용을 포함하고 있습니다.관심위치에서 발생한 사고의 기본정보를 확인할 수 있습니다.사고분석 등에 활용 할 수 있으며, 여러가지 교통사고 안전모형 개발에 활용 할 수 있습니다.국가 표준링크단위로 분석하여 홯용 가능합니다.  * 데이터 용량등에 한계로 일부데이터만 추출
