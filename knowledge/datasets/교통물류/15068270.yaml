summary_user: 인천광역시 서구 관내 화물자동차 공영차고지 현황을 차고지 한 곳당 한 행으로 담은 작은 파일(약 350바이트)로, 위치·면적(제곱미터)·주차면수·주차율·관리주체·데이터기준일자를 담는다. 화물차 운전자나 운송사업자가 "서구에서 화물차를 세울 수 있는 공영차고지가 어디이고 몇 면인가"를 확인하거나, 행정 담당자가 화물차 주차공간 부족·불법 주정차 대책을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위치(주소) 이름 매칭이나 같은 기관 자료로만 이어 쓰며, 운송사 허가 여부는 전국화물자동차운송사업자표준데이터를 따로 참조한다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 화물자동차 공영차고지의 현황을 수록한 자료입니다. 본 자료는 위치, 면적, 주차면수 등의 항목으로 구성이 되어 있습니다. 본 데이터를 통해 화물운송 종사자와 관련 차량 운전자들의 이용 편의 제고에 기여할 것으로 판단이 되며, 또한 주차공간 부족 문제 완화, 도시 내 불법 주정차 예방, 교통혼잡 해소, 지역 물류환경 개선 등과 같은 행정적 정책 수립에 유용하게 활용될것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
