summary_user: 울산항 안에서 선박이 거치는 운항 단계(입항·접안·투묘·양묘·이안·이선·출항 등)를 선박·항차별 건 단위로 담은 원천 기록이며, 호출부호·선박명·입출항일시·시설(선석) 코드·작업일시가 들어 있다. 화주·선사·대리점이나 항만 분석가가 '특정 선박이 이번 항차에 울산항 어느 시설에 언제 접안하고 언제 출항했나', '선박의 항내 체류 시간이 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 입출항·선박 데이터와는 호출부호·입항연도·항차 조합이나 선박명, 같은 기관의 시설제원코드(fcltSpecCd)를 매칭해 잇는다.
limits: 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결되므로 매칭 오류에 주의해야 한다. 서비스키(serviceKey)가 필요하고 개발계정은 하루 10,000회로 호출이 제한된다.
