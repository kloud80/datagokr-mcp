summary_user: 경기도 버스운송관리시스템(BMS)의 노선별 경유정류소를 노선·정류장 순서 단위로 담은 원장 데이터로, 정류장ID와 GIS 거리·누적 거리·실측 거리·확정 거리, 상행·하행 진행구분, 벽지노선 여부를 함께 담는다. 교통 분석가나 지자체 담당자가 '이 노선은 어떤 정류장을 어떤 순서로 지나며, 기점부터 각 정류장까지 실제 운행 거리는 얼마인가'를 확인하는 데 쓴다. 정류장ID(sttn_id)가 정류장 조인 키(busstop_sttn_id)로 실측 확인되어 정류소 위치 원장이나 도착·승하차 데이터와 잇고, 노선ID(route_id)로 노선 기본정보와 묶는다.
description_portal: 이 데이터는 경기도에서 제공하는 버스운송관리시스템(BMS)의 '노선 경유정류소 정보'를 담고 있으며, 각 버스 노선이 정차하는 정류장의 상세 정보를 제공합니다. 주요 항목은 노선ID, 정류장 순서, 정류장ID, GIS 거리, 누적 거리, 실제 거리, 확정 거리, 진행구분코드 및 그에 따른 설명(상행, 하행), 벽지노선 여부 등으로 구성되어 있습니다. 이 데이터를 통해 각 노선별 경유 정류소의 거리 변화 및 진행 방향을 파악할 수 있으며, 대중교통 경로 분석, 교통혼잡 완화 방안 도출, 노선 최적화 및 정책 수립에 유용하게 활용될 수 있습니다. 특히, 실측거리와 누적거리 항목은 실제 운행 거리와의 차이를 분석할 수 있는 중요한 지표로 사용될 수 있습니다.
