summary_user: 전북특별자치도 14개 시군의 전기자동차 등록 대수를 읍면동 주소 단위로 집계한 파일(csv, 약 13KB)로, 건별 차량 원천이 아니라 지역별 집계값(대수)을 담는다. 지자체 담당자나 충전사업자가 '어느 읍면동에 전기차가 많이 등록돼 충전 인프라 수요가 큰가'를 따질 때 쓴다. 전역 조인 키나 행정코드 컬럼이 없어 다른 데이터와는 시군·읍면동 이름을 행정구역 코드에 매핑해 이어 써야 하며, 같은 지역의 충전소 위치 데이터와 이름 기준으로 맞춰 보는 방식이 현실적이다.
description_portal: 본 데이터는 전북특별자치도 내 전기자동차 등록 현황을 읍면동 단위로 집계한 자료입니다. 해당 자료는 전북특별자치도 내 14개 시군(전주, 익산, 군산, 정읍, 남원, 김제, 완주, 진안, 무주, 장수, 임실, 순창, 고창, 부안)을 포함하며, 각 시군별 읍·면·동 단위 주소를 기준으로 등록된 전기차의 대수를 제공합니다. 데이터는 2025년 기준으로 수집되었으며, 전기차 보급 현황을 분석하거나 지역별 친환경 차량 분포, 인프라 수요 파악 등에 활용될 수 있습니다. 지자체의 충전 인프라 구축, 정책 수립, 전기차 인센티브 배분 등 다양한 행정 및 민간 연구 자료로 활용이 가능합니다. 매년 갱신을 통해 최신 수치를 반영할 수 있도록 관리하고 있습니다.
