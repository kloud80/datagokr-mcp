summary_user: 인천 영종구(옛 중구 관내) 소재 일반화물자동차운송사업 업체를 한 업체당 한 행으로 담은 목록이며, 상호·면허종류·주소·운영여부·데이터 기준일자를 담는다. 화주나 사업자가 관내의 특정 운송사가 허가받아 현재 운영 중인 업체인지 확인하거나, 지역 화물운송 업체 분포를 살피는 데 쓴다. 전역 조인 키가 없어 상호·주소를 기준으로 전국화물자동차운송사업자표준데이터 등과 이름 매칭으로 연결해야 한다.
