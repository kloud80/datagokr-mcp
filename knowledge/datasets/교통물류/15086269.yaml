description_portal: '인천광역시 중구 관내에 위치한 일반화물자동차운송사업 업체 현황에 대한 데이터 입니다.“화물자동차”란 「자동차관리법」 제3조에 따른 화물자동차 및 특수자동차로서 국토교통부령으로 정하는 자동차를 말한다.“화물자동차 운송사업”이란 다른 사람의 요구에 응하여 화물자동차를 사용하여 화물을 유상으로 운송하는 사업을 말한다. 이 경우 화주(貨主)가 화물자동차에 함께 탈 때의 화물은 중량, 용적, 형상 등이 여객자동차 운송사업용 자동차에 싣기 부적합한 것으로서 그 기준과 대상차량 등은 국토교통부령으로 정한다.관련 법령: 화물자동차 운수사업법담당부서: 교통운수과(원도심), 교통과(영종)'
