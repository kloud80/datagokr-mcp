summary_user: 인천 서구(서해구) 안에 설치된 자전거보관함을 시설 한 곳당 한 행으로 담은 파일로, 보관함 유형·설치위치·주소·총 보관대 수·공기주입기 유무·데이터 기준일을 담는다. 자전거 이용자가 "역이나 교통 거점 근처 어디에 자전거를 세울 수 있고 공기주입기가 있는가"를 확인하거나, 분석가가 동네별 보관대 공급 규모를 살피는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 주소를 지오코딩하거나 행정동 이름으로 맞춰 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 자전거 시설 현황을 정리한 자료입니다. 본 자료는 인천광역시 서구의 자전거 시설의 자전거보관함 유형, 설치위치, 주소, 총 보관대 수, 공기주입기 유무, 기준일자 등의 정볼를 포함하고 있습니다. 본 데이터는 주요 교통 거점 주변에 설치된 자전거보관함 현황을 통해 자전거 이용자에게 편의 제공 및 자전거 교통 활성화를 도모할 것으로 판단됩니다. 본 자료로 시설 이용 등 참고자료로 활용가능할것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
