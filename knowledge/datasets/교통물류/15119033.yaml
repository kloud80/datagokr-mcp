summary_user: 대구 도시철도 역사별로 무인민원발급기의 호선·역명·상세 위치(출구·대합실 등)·운영 대수·운영사·연락처를 담은 소규모 파일(CSV 약 724바이트)이다. 지하철 이용자가 '어느 역 어디에서 주민등록등본 같은 민원서류를 뗄 수 있나'를 확인하거나, 분석가가 역사 내 행정 편의시설 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 역 정보·승하차 데이터와는 역명이나 호선 이름을 맞춰 연결해야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 역사별 무인민원발급기 설치 및 운영 현황 정보를 제공합니다. 데이터에는 역사명, 상세 위치(출구 또는 대합실 등), 운영 대수, 운영사명, 연락처 등의 주요 항목이 포함되어 있으며, 각 역사 내 무인민원발급기 운영 현황을 확인할 수 있는 자료입니다. 해당 데이터는 역사별 무인민원발급기 설치 현황 파악, 운영 관리 및 시민 편의시설 현황 분석을 위한 기초자료로 활용할 수 있습니다. 또한 도시철도 이용 공간 내 행정 편의시설 정보를 제공하여 이용자의 시설 접근성 향상과 생활 편의 서비스 운영 개선을 위한 자료로 활용할 수 있습니다. 본 데이터는 연 1회 갱신되며, 무인민원발급기 운영 현황 변동 사항을 반영합니다.'
