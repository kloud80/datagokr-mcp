summary_user: 경기도 여주시에 등록된 이사화물(이사물류) 업체를 업체 한 곳당 한 행으로 담은 행정 등록 원천 목록으로, 업체명·인허가일자·영업상태·업종구분·도로명/지번주소·연락처를 포함하며 파일 크기가 376바이트로 건수가 매우 적다. 여주시로 이사하려는 주민이나 업체를 점검하는 담당자가 '여주에서 현재 영업 중인 등록 이사업체는 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열로 맞춰야 하며, 허가 여부의 전국 기준은 전국화물자동차운송사업자표준데이터와 대조한다.
limits: 사업자번호 같은 공통 식별 키가 없어 다른 데이터셋과 정확히 연결하기 어렵고, 업체명·주소 매칭에 의존한다. 범위가 여주시 한 곳에 한정되며 건수가 매우 적어 추이 분석이나 지역 비교 용도로는 부족하다.
