summary_user: 부산교통공사가 운영하는 도시철도 노선의 차량을 호차(칸) 단위로 나눠 노선명·편성유형별로 교통약자좌석 수, 임산부좌석 수, 출입문 수를 담은 건별 원천 파일(CSV)이다. 휠체어 이용자나 임산부, 이를 돕는 안내 서비스 개발자가 '부산 지하철 몇 호선 몇 번째 칸에 교통약자석·임산부석이 몇 개 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 노선명(선명)과 호차번호를 이름 매칭해 다른 철도운영기관의 호차별 교통약자정보나 부산교통공사 역·시설 데이터와 이어 본다.
