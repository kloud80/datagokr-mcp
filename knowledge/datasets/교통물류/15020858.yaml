summary_user: 국가철도공단이 협력 건설사·시공사를 대상으로 실시하는 건설사업관리시스템(CPMS) 교육의 참석자 수와 만족도 점수를 연도·분기별로 집계한 전국 단위 소규모 파일(csv, 555바이트)이다. 공단 담당자나 분석가가 분기별 협력사 교육 참여 인원과 만족도가 어떻게 변해 왔는지 보고 교육 개선 방향을 잡는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·분기 기준으로 맞추거나 같은 기관(국가철도공단) 자료끼리만 나란히 놓고 본다.
description_portal: 이 자료는 국가철도공단이 매년 정기적으로 실시하는 건설사업관리시스템(CPMS) 교육에 관한 협력사 참여 현황을 담고 있습니다. 대상은 공단과 협력 관계에 있는 건설사, 시공사 등으로, 이 교육은 철도건설사업의 효율적인 관리와 품질 향상을 목적으로 실시됩니다. 제공되는 데이터에는 분기별로 집계된 교육 참석 인원 수와 교육에 대한 참여자들의 만족도 점수가 포함되며, 교육 효과 분석 및 향후 개선 방향 수립에 활용됩니다. 또한 협력사의 역량 강화 및 CPMS 시스템의 정확한 활용을 통해 공사 진행의 투명성과 체계성을 높이는 데 기여합니다. 해당 정보는 협력사의 참여도 및 이해도를 수치화함으로써 교육의 실질적인 성과를 측정할 수 있는 지표가 되며, 공공기관-민간 협력 구조의 내실화를 위한 자료로도 기능합니다. 이를 통해 공단은 지속적인 품질 개선과 더불어 철도 인프라 건설의 안전성과 신뢰성을 확보하고자 합니다.
