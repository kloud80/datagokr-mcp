summary_user: 국가교통정보센터가 제공하는 도시 구간별 상세 정보를 재난안전데이터 공유플랫폼을 거쳐 내려받는 데이터로, 도시 구간 ID에 속한 링크의 순번과 링크 ID, 등록·수정 일시를 담으며 범위는 전국이고 공간 좌표는 없다. 교통 분석가가 '이 도시 구간은 어떤 도로 링크들로 어떤 순서로 이어져 있는가'를 확인해 구간 단위 교통정보를 링크 단위로 풀어 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관 계열의 도시 구간·링크 데이터와 구간 ID(CTY_SCTN_ID)나 링크 ID를 이름·코드로 맞춰 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
