summary_user: 서울 서초구에 허가된 화물자동차 운송주선사업 업체를 업체 한 곳당 한 행으로 담은 건별 명부로, 업종·사업소명·도로명/지번 주소·위도·경도·면허구분·운영여부·차량대수를 담는다(CSV 약 21KB). 화물 운송을 맡기려는 기업이나 개인이 '서초구에서 허가받고 실제 영업 중인 운송주선 업체가 어디에 있는가'를 확인하거나, 분석가가 구내 업체 분포와 차량 보유 규모를 지도로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명·주소 문자열이나 위도·경도 좌표로 맞춰 이어야 하며, 전국 단위 확인은 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
limits: 범위가 서초구 한 곳뿐이라 다른 구나 전국 현황은 이 파일로 알 수 없다. 사업자번호 같은 공통 식별 키가 없어 다른 기관 데이터와 붙일 때 이름·주소 매칭 오류에 주의해야 한다.
