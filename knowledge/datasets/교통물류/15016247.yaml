summary_user: 인천광역시 부평구의 자전거도로를 노선(도로명) 구간별로 한 행씩 담은 파일로, 각 구간의 기점·종점, 자전거도로 종류(독립형·전용차로 등), 연장(m)을 기록한다. 부평구 안에서 어느 도로에 어떤 유형의 자전거도로가 얼마나 깔려 있는지 확인하려는 주민이나, 구 단위 자전거도로 총연장과 유형 구성을 비교하려는 분석가가 쓴다. 전역 조인 키나 좌표가 없어 다른 데이터와는 도로명(노선명) 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: '자전거 도로 관련 데이터는 도로명, 도로구간의 기점과 종점, 자전거 도로의 종류, 그리고 해당 구간의 연장을 포함합니다. 이를 통해 자전거 도로의 위치, 연결성, 유형 및 길이를 파악할 수 있으며, 자전거 교통망 개선 및 안전성 향상, 정책 수립에 활용될 수 있습니다.● 노선명(도로명): 자전거 도로가 위치한 도로의 이름 (도로명 주소)● 도로구간 기점: 자전거 도로가 시작되는 지점의 위치 (도로명 주소 기준)● 도로구간 종점: 자전거 도로가 끝나는 지점의 위치 (도로명 주소 기준)● 자전거 도로의 종류: 자전거 도로의 유형, 예를 들어 독립형 자전거 도로, 자전거 전용 차로 등● 연장(m): 자전거 도로 구간의 총 연장(길이), 단위: 미터 (m)'
