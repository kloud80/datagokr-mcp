description_portal: 경기도 파주시 지능형교통체계(ITS) 운영을 위해 시도명, 시군구명, 시군구코드와 함께 각 교차로의 고유 식별자인 교차로아이디, 교차로명, 교차로유형코드, 교차로유형코드값, 위도와 경도 좌표 등으로 구성되어 있습니다. 본 데이터셋은 교차로별 위치, 유형, 시군구 정보를 기반으로 교통량, 신호체계, 혼잡 구간 분석을 통한 신호 체계 개선 및 교통 흐름 최적화, 교차로 유형과 위치 정보를 결합하여 사고 다발 지역을 식별하고, 예방 대책 및 안전 시설 설치 우선순위 결정, 실시간 교통 서비스, 내비게이션, 자율주행차 경로 안내 시스템 등 다양한 스마트 모빌리티 기술 개발의 기반 데이터, 교통 정책, 도로 인프라 확충, 도시계획 및 교통 정책 의사결정 자료, 교통 네트워크 구조 분석, 시뮬레이션, 빅데이터 기반 교통 연구, 구급차, 소방차 등 긴급차량이 최적 경로로 이동할 수 있도록 신호 우선 시스템 설계, 교통 혼잡과 연관된 배출가스, 소음 등의 환경 영향 평가하고 및 친환경 교통 정책 수립 등에 활용될 수 있습니다.
