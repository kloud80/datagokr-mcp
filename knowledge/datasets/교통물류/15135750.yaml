description_portal: 이 데이터는 해양수산부에서 선박 대기오염물질 관리시스템 내 연료 관련 정보를 관리, 제공하기 위한 목적으로 수집한 데이터입니다.  본 데이터의 주요 내용은 유종 코드, 유종명, 연료변환계수, 경유 함량 및 BC함량 정보와 여객선 연료소비계산 관련 정보 및 화물선 연료소비계수 정보로 구성되어 있습니다.본 데이터는 해양 및 환경 관련 기관에서서선박의 연료 사용 현황 분석, 환경 규제에 따른 대기오염물질 감축에 대한 실태 파악, 선사 및 관련 기관의 연료 절감 방안 마련, 정책 평가 수행 등 활동을 위한 기초 자료로 활용될 수 있습니다.
