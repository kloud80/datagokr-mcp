summary_user: 인천도시철도 1호선의 역별·일자별 승차인원, 하차인원, 이용인원을 담은 집계 파일로, 2024년 7월 1일부터 2025년 6월 30일까지를 다룬다(CSV 약 44만 바이트). 상권 분석가나 지자체 담당자가 "송도·부평 일대 어느 역의 평일·주말 유동인구가 많은가"처럼 역 주변 유동인구를 가늠하는 대체 지표로 쓴다. 전역 조인 키는 없어 역명을 다른 역 목록·좌표 데이터의 역명과 맞춰 이어 쓰고, 일자로 날씨·행사 데이터와 붙인다.
description_portal: 인천교통공사가 운영 중인 도시철도 인천1호선의 2024년 7월 1일부터 2025년 6월 30일까지 일별 승하차현황 정보입니다.해당 데이터는 역명, 일자, 이용인원, 승차인원, 하차인원 항목으로 구성되어있습니다.인천1호선은 2025년 6월 30일 기준 검단호수공원역에서 송도달빛축제공원역까지 총 33개역을 운영 중에 있습니다.제공하는 자료는 2025년 6월 28일 개통한 인천1호선 연장 3개역(검단호수공원역, 신검단중앙역, 아라역)의 정보는 포함하고 있지 않습니다.
