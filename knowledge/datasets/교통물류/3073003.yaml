summary_user: 대구 도시철도 1·2·3호선 역사별 에스컬레이터·엘리베이터를 설비(호기) 한 대당 한 행으로 담은 현황 파일로, 호선·역명·설비 구분과 함께 층별 운행 구간, 운행방향, 제조사, 규격을 기록한다(CSV 약 120KB). 교통약자나 이용객이 특정 역에 엘리베이터가 어느 층 사이를 오가는지 확인하거나, 시설 담당자가 제조사·규격별 점검·유지보수 대상을 정리하는 데 쓴다. 전역 조인 키는 없어 역명·호선 이름으로 같은 기관의 역 정보나 승하차 데이터와 맞춰 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 교통약자 이동권 운영정보 데이터로, 도시철도 1·2·3호선 각 역사에서 운영 중인 에스컬레이터 및 엘리베이터 등 승강 설비 현황 정보를 제공합니다. 데이터에는 제조사, 규격(형식·적재용량 등), 운행 위치, 설치 방향(상·하행), 운행상태 등의 주요 항목이 포함되어 있으며, 역사 내 승강 설비 운영 현황을 파악하고 이용 편의 및 시설 관리를 위한 기초자료로 활용할 수 있습니다. 해당 데이터는 승강 설비별 운영 현황 분석, 점검 및 유지보수 계획 수립, 설비 관리 효율화 등에 활용할 수 있으며, 교통약자를 포함한 도시철도 이용객의 이동 편의 향상과 접근성 개선을 위한 자료로 활용됩니다. 본 데이터는 운영 장비 변경 및 상태 변동 등 데이터 변경 사항 발생 시 갱신됩니다.'
