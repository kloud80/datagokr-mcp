summary_user: 경기도 버스의 실시간 도착정보를 정류소(정류소ID) 또는 노선(노선ID) 기준으로 조회하는 API로, 곧 도착할 버스 두 대의 도착예상시간(분·초), 몇 번째 전 정류소인지, 차량번호, 저상·2층버스 여부, 빈자리 수, 차내혼잡도를 담는다. 버스 이용자나 교통 앱 개발자가 '이 정류장에 내 버스가 몇 분 뒤에 오고 빈자리가 있는가'를 확인하는 데 쓴다. 응답에 정류소아이디(stationId)·노선아이디(routeId)가 있지만 실측상 전역 조인 키는 확인되지 않아, 경기도 정류소·노선 정보와는 같은 기관 ID나 정류소명·노선명 매핑으로 이어 쓴다.
limits: 오퍼레이션 2개 중 버스도착정보 항목 조회(getBusArrivalItemv2)는 최소 파라미터 호출에서 응답이 없었으므로 정류소·노선 ID 등 요청변수를 갖춰 호출해야 한다. 개발계정은 하루 1,000회로 제한되며, 다른 기관 데이터와 공통으로 쓸 전역 코드가 없어 경기도 밖 정류소와 바로 연결되지 않는다.
