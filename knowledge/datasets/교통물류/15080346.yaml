services:
  - op: /getBusArrivalListv2
    name: 버스도착정보목록조회
    endpoint: https://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalListv2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: stationId
        required: true
        desc: 정류소아이디
      - name: format
        required: true
        desc: 응답 포멧(json/xml)
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getBusArrivalItemv2
    name: 버스도착정보항목조회
    endpoint: https://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalItemv2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: stationId
        required: true
        example: '200000177'
        desc: 정류소아이디
      - name: routeId
        required: true
        example: '200000037'
        desc: 노선아이디
      - name: staOrder
        required: true
        example: '19'
        desc: 노선의 정류소 순번
      - name: format
        required: true
        example: json
        desc: 응답 포멧(json/xml)
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
