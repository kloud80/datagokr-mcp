summary_user: 부산도시공사가 설치·운영하는 전기차 충전기를 한 대씩 담은 건별 원천 파일로, 충전기 타입(급속·완속)과 설치 시기, 회원·비회원 충전요금, 운영기관, 주소와 상세위치, 이용가능시간, 충전용량을 담는다(포털 설명상 2025년 12월 19일 기준, 1750바이트 CSV). 시민이 공사 시설 안에서 가까운 급속충전기의 요금과 이용 시간을 확인하거나, 분석가가 공사 충전 인프라의 설치 시기와 유지보수 대상을 파악하는 데 쓴다. 전역 조인 키는 없으므로 다른 충전소 데이터와는 주소나 충전소 이름을 맞춰 연결해야 한다.
description_portal: 부산도시공사에 설치된 전기차 충전소 현황을 제공합니다. 해당 자료는 2025년 12월 19일 기준이며, 公社에서 설치 운영 중인 전기차 충전기 종류(급속,완속), 설치시기(준공시기), 충전요금, 운영기관, 상세위치, 이용가능 시간을 확인해 볼 수 있습니다.전기차 충전소 현황 정보 제공으로 시민의 충전소 이용 편의 증대 효과를 기대할 수 있으며, 친환경 전기차 충전 인프라 구축관련(시설 운영 현황 및 유지보수 계획 수립)로 활용할 수 있습니다.향후에는 사용 빈도 자료를 검토하여 행정 및 정책 활용 시 사용할 예정입니다.
