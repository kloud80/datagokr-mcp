description_portal: 이 데이터는 우체국물류지원단 운송사업 중 민간위탁 계약업체가 우편물을 운송하고 있는 편수현황을 제공하고 있습니다. 이 데이터는 우편물 수집망(관내우체국에서 집중국 운송), 집중국과 집중국간 운송망의 운송편수와 우체국물류지원단 대비 민간위탁업체의 점유율을 제공하고 있으며, 2025년 5월 말 기준으로 기간망은 199,911편이고 우체국망은 292,644편입니다. 학계 및 연구기관에서는 우체국물류지원단과 계약된 업체의 운송편 수 현황을 파악할 수 있습니다. 이 데이터는 연도별 민간위탁업체의 우체국망, 집중국망의 운송편수와 점유율 증감현황을 파악할 수  있습니다.
