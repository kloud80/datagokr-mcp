summary_user: 부산광역시 서구에서 2024년 안전신문고로 접수된 불법 주·정차 신고 중 과태료가 부과된 건을 단속일시·단속장소·위반구분·과태료부과여부 단위로 담은 건별 내역 파일입니다. 서구 주민이나 교통 행정 담당자가 '서구에서 불법주정차 신고·과태료가 어느 장소와 시간대에 몰리는가'를 확인해 단속 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속장소 이름을 주소·지명으로 맞추거나 같은 기관(부산 서구) 자료끼리만 연결한다.
