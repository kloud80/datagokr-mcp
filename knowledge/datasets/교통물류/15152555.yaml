summary_user: 경기도 안산시 도로 검지 지점(지점 아이디)별로 시간 단위 통계일시마다 교통량(차량 대수), 평균 속도(km/h), 점유율(%)을 기록한 시간별 집계 파일(CSV, 약 650KB)이다. 교통 분석가나 시 담당자가 '안산시 특정 지점에서 출퇴근 시간대에 속도가 얼마나 떨어지고 교통량이 몰리는가'와 같은 시간대별 흐름 분석에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 지점 위치 등 다른 데이터와는 지점 아이디를 같은 기관(안산시)의 지점 정보와 이름·코드로 맞춰 연결해야 한다.
limits: 지점 아이디만 있고 좌표나 도로명 같은 위치 정보가 없어, 같은 기관의 지점 정보 없이는 공간 분석에 쓸 수 없다. 범위는 안산시 한 곳이므로 다른 시군구와 비교하려면 별도 데이터가 필요하다.
