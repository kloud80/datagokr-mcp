description_portal: 해당 데이터는 수입자동차 등록현황(구별) 통계입니다. 데이터는 서울시 각 구별 수입자동차 등록 현황을 시기별로 비교해 볼 수 있는 통계 자료로, 변화 추이를 월 단위로 정리한 것이 특징입니다. 승용차, 승합차, 화물차, 특수차 등 차량 유형별 구성을 함께 제공하여 지역별 자동차 보유 패턴을 세밀하게 파악할 수 있습니다. 이를 통해 특정 구의 수입차 집중도, 차량 종류별 편차, 시기적 증가·감소 흐름 등 교통·도시계획·소비 트렌드 분석에 유용한 기초 자료로 활용할 수 있습니다.※ 바로가기 클릭 시 열린데이터광장 개방 데이터로 이동합니다.
