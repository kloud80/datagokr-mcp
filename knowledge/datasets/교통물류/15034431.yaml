summary_user: 대전광역시 일반택시의 승차 동(행, 승차(세로))과 하차 동(열, 동구 원동·인동 등 동 이름 열)을 교차한 승하차 통행량 행렬을 연 단위 집계로 담으며, 택시요금미터와 운행기록장치의 운행정보를 바탕으로 하고 포털에서 zip 파일(약 300KB)로 활용신청 없이 받는다. 교통 분석가나 택시 사업자가 대전에서 어느 동에서 택시를 많이 타고 어느 동으로 많이 가는지, 이용량이 몰리는 동이 어디인지 확인하는 데 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어, 다른 동 단위 통계나 행정구역 경계와 잇는 것은 구·동 이름을 코드로 매핑해야 한다.
description_portal: '- 본  데이터는 "택시운송사업의 발전에 관한 법률" 제13조에 따른 택시요금미터와 운행기록장치에 기록된 택시운행정보를 사용합니다.- 택시를 이용한 출발지점, 도착지점의 승하차량이 어느 정도인지를 나타냅니다. 이를 통해 택시이용량이 많은 행정동을 확인할 수 있습니다.- 이러한 택시이용 승하차 통계는 택시를 이용하는 승객이 어디에서 주로 이용하는 지를 확인 할 수 있는 중요 데이터 입니다.- 해당 정보는 대전광역시의 동의를 얻어 대전광역시 내 도로별 일반택시의 승하차 통행량을 행정동 단위로 연간 제공하고 있습니다.'
