summary_user: 대구광역시 ITS로 수집한 도로 돌발상황(교통사고·고장 차량·공사·행사·집회 등)을 건별로 담은 CSV 파일이며, 날짜·시작시간·끝난시간·돌발내용과 지점 좌표(경도·위도)가 들어 있다. 교통 분석가나 시 담당자가 '대구 시내에서 돌발상황이 자주 생기는 지점과 시간대는 어디인가'를 확인해 혼잡 원인 분석이나 교통안전 개선의 기초 자료로 쓴다. 전역 조인 키는 없어서 다른 데이터와는 좌표를 이용한 공간 매칭이나 이름 매핑으로만 이을 수 있으며, 실시간 소통 데이터와 함께 이력을 쌓으면 상습 정체 분석에 쓸 수 있다.
description_portal: 대구광역시 돌발상황정보는 지능형교통시스템(ITS)를 통해 수집되는 도로 위 돌발상황정보를 제공하는 통계자료입니다. 이 데이터는 교통사고, 고장 차량, 공사 구간, 행사 및 집회 등으로 인해 교통 흐름에 영향을 미치는 다양한 돌발 요소들을 포함하며, 경찰청 DB와 연계하여 돌발상황이 발생한 일시, 구간명, 시작시간, 종료시간, 돌발내용, 지점좌표값을 제공합니다. 해당 자료를 통해 사고 다발 지역 도출, 혼잡 원인 분석, 특정 시간대 사고 위험도 분석, 도시 교통안전 개선, 정책 기초 자료 등으로 활용할 수 있습니다.
