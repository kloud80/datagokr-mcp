summary_user: 서울시 교통카드 이용 데이터와 지하철 운영 현황을 바탕으로 가공한 집계 통계로, 기준 날짜·자치구별로 0시부터 23시까지 시간대별 지하철 수요 대비 공급 비율을 한 행에 담는다(파일 약 13.6KB, csv). 출퇴근 시간대에 어느 자치구의 지하철 공급이 수요에 비해 부족한지 비교하려는 교통 분석가나 정책 담당자가 쓴다. 전역 조인 키는 없고 자치구 ID·자치구명으로 다른 자치구 단위 통계(인구·승하차 등)와 이름 또는 코드 매핑으로 이어 쓴다.
description_portal: 서울특별시 자치구별 시간대별 지하철 수요공급비율 데이터는 서울시 교통정책지원시스템에서 교통카드 이용 데이터와 지하철 운영 현황 정보를 기반으로 분석·가공하여 제공하는 교통 통계 자료입니다. 본 데이터는 기준 날짜와 자치구명을 기준으로 시간대별(0시~23시) 지하철 수요공급비율 정보를 제공하며, 특정 시간대의 지하철 이용 수요 대비 공급 수준을 파악할 수 있도록 구성되어 있습니다. 이를 통해 출퇴근 시간대 혼잡 구간 분석, 자치구별 교통 서비스 수준 비교, 대중교통 운영 효율성 분석 및 혼잡 완화 정책 수립 등에 활용 가능합니다.
