summary_user: 김포시 버스정류소에 설치된 온열의자를 정류소별로 한 행씩 담은 소규모 현황 파일(csv 약 6.5KB)로, 정류소명·승강장 ID·설치장소 지번주소·의자 개수·관리기관·데이터기준일자를 담는다. 시민이나 시 담당자가 '우리 동네 어느 정류장에 온열의자가 있고 몇 개인가', '동절기 편의시설이 부족한 정류장은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않아, 정류장 원장·노선 데이터와는 승강장 ID나 정류소명, 지번주소를 이름·주소 매칭으로 맞춰 이어 쓴다.
