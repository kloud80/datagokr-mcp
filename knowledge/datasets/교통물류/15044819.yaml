summary_user: 경상북도 관할 교량을 한 행에 한 개씩 담은 원천 목록으로, 노선번호·교량명·소재지와 교장·총폭·유효폭·교고·경간수·최대경간장 같은 치수, 상부·하부형식, 설계하중, 준공년도, 관리주체를 담는다. 도로 관리자나 분석가가 "경북 도로 노선별로 준공 30년이 넘었거나 설계하중이 낮은 교량은 어디이고 누가 관리하는가"를 따져 점검·보수 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 노선번호·교량명·소재지 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 경상북도 관할 교량의 현황에 대한 상세 정보를 제공합니다. 이는 지역 내 도로망을 구성하는 교량 시설물의 물리적 특성, 규모 및 관리 이력을 파악함으로써, 도로 시설의 효율적인 관리, 안전 확보 및 유지보수 계획 수립에 목적이 있습니다.주요 내용으로는 해당 교량이 속한 노선번호와 시설의 명칭인 교량명이 포함됩니다. 교량의 설치 위치인 소재지 정보와 함께, 규모를 나타내는 교장(미터), 층폭(미터), 유효폭(미터), 교고(미터) 등 구조적 치수 정보가 제공됩니다. 또한, 교량의 구조적 특성을 나타내는 경간수, 최대경간장, 상부형식, 하부형식 정보가 상세히 기록되어 있습니다.교량의 안전 및 내구성을 파악할 수 있는 설계하중(DB) 정보와 시설의 이력을 나타내는 준공년도 정보가 포함됩니다. 마지막으로 시설 관리의 책임 소재를 명확히 하는 관리주체 정보가 제공됩니다. 이 자료는 도로 교통 정책 수립, 시설물 안전 진단 및 SOC 투자 계획 등에 귀중한 기초 자료로 활용됩니다.자료관련 문의는 054-880-8283으로 하시기 바랍니다.
