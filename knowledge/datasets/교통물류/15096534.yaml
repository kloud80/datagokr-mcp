description_portal: '대구광역시 북구 공유개방 주차장 현황에 대한 데이터로 주차장명, 주소, 주차면수, 개방시간 등의 항목을 제공합니다.주차장 개방 공유사업은 공공기관·민간시설의 유휴 부설주차장을 일정 시간 동안 지역 주민 등 외부에 개방하여 주차 공간을 공유하는 사업입니다. 이를 통해 주차 공간 부족 문제를 해소하고, 지역 내 교통 혼잡과 불법 주정차 문제를 완화하며, 궁극적으로 주민 생활환경 개선에 기여하는 것을 목적으로 합니다.*대상 시설 : 학교, 종교시설, 기업체, 대형 상가(마트) 등 유휴 주차 공간을 보유한 곳'
