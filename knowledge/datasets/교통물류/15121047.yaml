description_portal: '본 데이터는 부산광역시에서 제공하는 도로 구간 패턴 정보로, 특정 월·요일·시간대별로 산출된 평균 통행속도 및 구간별 교통 흐름 특성을 제공합니다.제공되는 주요 항목은 패턴월, 패턴시간, 요일, 도로명, 시점명, 종점명, 평균속도 등이며, 조회 시점 기준 최근 1시간 전 데이터를 표출합니다.예를 들어, 6월 23일 3시에 데이터를 요청하면 2시~3시까지의 구간별 교통 패턴 정보가 제공됩니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>시간대·요일별 교통 패턴 분석을 통한 도로 운영 효율화특정 시점의 교통 흐름을 반영한 혼잡 예측 및 정책 수립신호운영 최적화 및 교통 시뮬레이션 연구 지원민간 내비게이션·교통정보 서비스와 연계하여 맞춤형 경로 안내 제공교통 빅데이터 분석을 통한 스마트시티 교통정책 기초자료'
