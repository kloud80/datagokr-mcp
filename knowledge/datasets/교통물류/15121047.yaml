summary_user: 부산광역시 도로 구간(도로명·시점·종점)별로 월·요일·시간대 패턴에 따라 산출된 평균 통행속도를 담는 집계형 API이며, 조회 시점 기준 직전 1시간의 패턴 정보를 돌려준다. 교통 분석가나 내비게이션 사업자가 '평일 오후 6시 부산 특정 도로 구간의 평소 속도는 얼마인가' 같은 질문에 쓰고, 호출 결과를 쌓으면 상습 정체 분석 원장이 된다. 실측 컬럼에 전역 조인 키가 없어 도로명·시점명·종점명(roadNm 등) 이름 매칭으로만 다른 부산 교통 데이터와 이어 쓴다.
limits: 링크 ID 같은 공통 키가 없어 다른 교통 데이터와 정확히 연결하려면 이름 매핑이 필요하다. 개발계정은 하루 500회 호출 제한이 있다. 조회 시점 직전 1시간 구간만 제공하므로 다른 시간대 패턴은 직접 호출해 쌓아야 한다.
