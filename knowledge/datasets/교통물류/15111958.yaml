summary_user: 경기도 남양주시 관내에 설치된 도로안내표지를 표지 1건당 1행으로 담은 개별 원천 파일이며, 검증 때 1,433행이 수신됐다. 도로 관리 담당자나 분석가가 관내 안내표지가 어느 도로·위치에 있고 어떤 방향·지명을 안내하는지 확인하는 데 쓴다. 소재지 도로명주소·지번주소와 위도·경도가 조인 키라서, 같은 주소나 좌표를 가진 다른 도로 시설물 파일이나 지도 데이터와 이어 쓴다.
description_portal: 경기도 남양주시 도로안내표지 관내 설치된 도로안내표지에 대한 데이터로 도로안내표지일련번호, 도로종류, 소재지주소, 위도, 경도 등의 데이터를 제공합니다.도로안내표지 현황 데이터는 도로를 이용하는 운전자나 보행자에게 방향, 목적지, 주요 시설물, 통행 정보 등을 안내하기 위해 도로변에 설치된 각종 안내표지(도로표지)의 위치, 규격, 설치 내용 등을 담고 있는 공공데이터입니다. 이 자료는 도로 교통의 안전성과 효율성을 높이는 데 필수적인 기반 정보를 제공합니다. 도로 관리 기관이 노후되거나 훼손된 표지를 정확히 파악하여 정기적인 점검 및 교체 계획을 수립하고, 유지관리의 효율성을 높입니다.
