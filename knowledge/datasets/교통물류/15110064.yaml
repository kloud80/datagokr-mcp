summary_user: 대구광역시 달서구 안의 노인보호구역을 지정 대상시설 한 곳당 한 행으로 담은 건별 파일(csv, 약 1.6KB)로, 도로명·지번 주소와 위도·경도, 제한속도, CCTV 설치 여부·대수, 보호구역 도로폭, 관할경찰서를 함께 싣는다. 달서구 주민이나 분석가가 "우리 동네 경로당·복지관 앞 노인보호구역은 어디이고 제한속도와 CCTV는 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군구코드·시군구명으로 같은 지역의 다른 자료와 묶거나, 위도·경도로 교통사고·단속카메라 위치 자료와 공간적으로 겹쳐 본다.
description_portal: 대구광역시 달서구 내에 노인보호구역에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.순번, 장소유형코드, 시도명, 시군구명, 시군구코드, 대상시설명, 도로명주소, 소재지지번주소, 위도, 경도, 제한속도, 관리기관명, 관리기관번화번호, 관할경찰서명, CCTV 설치여부, CCTV 설치대수, 보호구역도로폭, 데이터기준일자, 현장정보 등으로 구성되어있으며, 해당 데이터는 1회성으로 추가 업데이트하지 않습니다.지역 내 노인보호구역 현황을 파악하는데 유용하게 참고자료로 쓸수 있으며 다양한 행정업무에 기초자료로 쓰는데 활용 가능합니다.
