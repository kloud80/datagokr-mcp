summary_user: 인천광역시 관내에 설치된 택시 승차대를 한 곳씩 행으로 담은 시설물 목록으로, 구·관리번호·위치·형태·비고를 기록한 작은 CSV 파일(약 5.6KB)이다. 택시 이용객이나 지도·교통 앱 개발자가 '우리 구에서 가까운 택시 승차대는 어디에 있나'를 확인하거나, 행정 담당자가 구별 승차대 분포를 보고 유지보수·신규 설치를 검토하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구 이름이나 위치 문자열을 맞춰 연결해야 하며, 좌표 필드가 없어 지도에 올리려면 위치(주소·장소명)를 지오코딩해야 한다.
