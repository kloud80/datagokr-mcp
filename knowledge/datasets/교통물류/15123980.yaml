summary_user: 경기도 버스운송관리시스템(BMS)에서 쓰는 운수사 부대시설의 시설ID(faclt_id)와 시설명을 담은 목록으로, 사무실·차고·주차장·숙소·식당·세차장·샤워실·휴게실 같은 시설 유형을 구분한다. 분석가나 행정 담당자가 'BMS에서 운수사 부대시설은 어떤 유형으로 나뉘는가'를 확인하거나, 다른 BMS 자료의 시설 코드를 해석할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 경기도 BMS 자료와는 시설ID나 시설명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로 운수사별 부대시설에 대한 정보를 제공하며, 각 항목은 '시설ID'와 '시설명'으로 구성되어 있습니다. 제공되는 시설명에는 사무실, 차고, 주차장, 숙소, 식당, 세차장, 샤워실, 휴게실 등 운수업체의 업무 및 복지를 지원하는 다양한 시설이 포함됩니다. 이 데이터를 통해 각 운수사가 보유한 부대시설의 유형과 위치를 파악할 수 있으며, 버스 운송 환경 개선, 근무 여건 분석, 교통 인프라 확충, 업체 간 시설 보유 현황 비교 등에 활용될 수 있습니다. 특히 공영차고지나 영업소 등 공공시설과 연계한 행정계획 수립에도 도움이 됩니다.
