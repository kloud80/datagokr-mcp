summary_user: 통영시 도시정보시스템에 등록된 차도·보도 포장 구간별 속성(관리번호, 행정읍면동, 도엽번호, 도로구간번호, 공사번호, 보수 종류·공종, 연장·면적·폭원, 현재와 이전의 포장 재질)을 담은 건별 파일로, 범위는 통영시 한 곳이고 행정단위는 읍면동이다. 도로 담당 공무원이나 분석가가 "어느 읍면동의 어떤 도로 구간이 언제 어떤 재질로 재포장됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 행정읍면동 이름이나 도로구간번호·공사번호 같은 기관 내부 번호로만 맞춰 이어 쓴다.
description_portal: 통영시 도시정보시스템에서는 차도와 보도의 포장 현황을 체계적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 포장 구간의 위치와 식별이 가능하며, 관리기관과 도로구간번호, 공사번호는 유지관리와 공사 이력을 파악하는 데 활용됩니다. 또한 보수 종류, 보수 공종, 연장, 면적, 폭원 등과 함께 차도 및 보도의 현재 포장 재질과 이전 포장 재질 정보를 포함하여 포장 상태와 변화를 구체적으로 확인할 수 있습니다. 이러한 자료는 도로 유지보수, 보수 계획 수립, 안전관리 및 도시 계획 등 다양한 행정 업무에서 중요한 기초 자료로 활용됩니다.
