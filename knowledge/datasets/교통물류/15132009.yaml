description_portal: 제동시험기는 자동차관리법 시행규칙 제68조(정밀도검사의 대상 기준등)와 별표 12의 기준과 방법에 의하여 구조 장치의 설치상태와 정밀도를 검사하고 있습니다.제동시험기는 자동차의 제동력 지시값을 확인하여 좌,우 제동력의 합과 편차를 계산하여 해당 자동차의 제동력과 편차로 인하여 발생할 수 있는 사고를 예방할 수 있습니다.한국교통안전공단 특수검사정보관리 시스템에 등록되어 있으며, 자동차관리법 제68조(정밀도검사의 대상 기준등)의 제동시험기의 허용 톤 종류의 제동력시험 좌,우 기준값과 차이 제동력, 합계제동력에 대한 기준 정보는 제동시험기 제작 등에 활용할 수 있습니다.
