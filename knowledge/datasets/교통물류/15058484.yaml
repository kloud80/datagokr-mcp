summary_user: 부산광역시 자전거도로를 구간별로 담은 데이터로, 구군명·시작지점·종료지점과 자전거 전용·보행자 겸용 등 유형별 길이(gugunOnlyBike, gugunWithWalk 등), 점검일자를 담는다(범위는 부산시, 행정단위는 구·군). 시민이나 정책 담당자가 "우리 구에는 자전거 전용도로가 어느 구간에 얼마나 설치돼 있나"를 확인하거나 구·군별 자전거도로 설치 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구군명 같은 이름 매칭으로만 연결하며, 공공자전거 대여소나 자전거도로 노선 GIS 자료와 구 단위로 맞춰 본다.
limits: 표준 행정코드나 좌표 같은 조인 키가 없어 다른 데이터와는 구군명 문자열 매칭에 의존해야 한다. 범위가 부산시 구·군 단위에 한정되며 개발계정은 하루 10,000회 호출 제한이 있다.
