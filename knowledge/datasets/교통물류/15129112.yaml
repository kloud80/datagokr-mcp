description_portal: 공항 여객 편의시설에 대한 정보는 공항 내에서 승객들이 이용할 수 있는 주요 편의시설의 현황을 제공하고 있습니다.공항식별자, 공항명, 유형, 명칭, 내용에 대한 정보를 제공하고 있습니다. 공항편의시설 유형은 아래와 같습니다.HOTELS(숙박시설)공항 내 또는 인근 지역에 위치한 숙소에 대한 정보로, 환승객이나 체류 승객이 이용할 수 있는 호텔, 모텔 등의 정보를 제공합니다.RESTAURANTS(식당)공항 내에 위치한 식음료 매장에 대한 정보로, 다양한 종류의 음식점 및 카페의 위치, 운영 시간 등을 포함합니다.TRANSPORTATION(교통수단)공항과 외부 지역 간 이동을 위한 교통편 정보로, 대중교통(버스, 지하철), 택시, 렌터카 등의 이용 방법 및 위치 안내를 제공합니다.MEDICAL FACILITIES(의료시설)응급 상황 또는 간단한 진료를 받을 수 있는 의료시설에 대한 정보로, 의무실, 약국, 응급의료센터 등의 위치 및 운영 시간 등을 제공합니다.BANK OFFICE,POST OFFICE(은행 및 우체국)금융 및 우편 서비스를 제공하는 시설에 대한 정보로, 환전소, ATM, 은행 지점, 우체국 등의 위치 및 이용 안내를 포함합니다.TOURIST OFFICE(관광안내소)공항 내 관광 정보를 제공하는 안내소에 대한 정보로, 지역 관광지 안내, 지도 배포, 문화 행사 정보, 숙박 예약 지원 등의 서비스를 포함합니다.
