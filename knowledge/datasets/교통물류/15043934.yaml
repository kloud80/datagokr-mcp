description_portal: 대전교통공사_연선전화 현황  - 대전교통공사에서는 본선구간의 원활한 작업 환경 조성 및 이례 상황 발생을 대비하며 관련법규를 준수하기 위하여 연선전화 설비를 설치하여 운영 하고 있습니다.  - 판암기지~외삼기지의 전 구간을 거쳐 총 99개의 연선전화 설비를 운영하고 있습니다.  - 해당의 설비들은 그룹별의 고유한 번호를 부여한 내선통화 기능을 제공하고 있으며, 해당 설비의 정상적인 운영을 위하여 정기적인 본선구간의 점검을 통한 설비의 안정성 유지 및 동작 가능 상태를 유지, 확인 하고 있습니다.  - 해당의 공공데이터 자료는 대전교통공상의 대전도시철도 1호선 본선구간에서 사용하고 있는 연선전화의 역간 그룹별 정보 및 구체적 설치위치의 거리별 위치 및 상선, 하선, 중선에 따른 구체적 위치 정보를 포함 하고 있습니다.
