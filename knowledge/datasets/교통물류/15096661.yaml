summary_user: 제주특별자치도 관내 교통사고를 기준 연도와 노면 상태(건조·습윤·결빙·적설 등)별로 묶어 사고 건수·부상자 수·사망자 수를 담은 집계 통계로, 포털 설명상 2005~2020년을 다룬다. 도로안전 분석가나 정책 담당자가 '제주에서 결빙·적설 노면일 때 사고 한 건당 사망자가 건조 노면보다 많은가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준 연도나 노면 상태 이름을 맞춰 붙여야 하며, 같은 기관(제주특별자치도)의 다른 교통사고 통계와 연도 기준으로 나란히 보는 정도로 이어 쓴다.
description_portal: '이 데이터셋은 2005년부터 2020년까지 제주특별자치도 관내에서 발생한 교통사고를 “노면 상태”(예: 건조, 결빙, 적설, 습윤 등)별로 구분하여 사고 건수, 부상자 수, 사망자 수를 집계한 공식 통계 자료이다.  CSV 형식으로 제공되어 누구나 다운로드 가능하며, 노면 상태별 사고 발생 및 피해 규모를 분석할 수 있어 도로 안전 관리 및 사고 예방 정책 설계에 핵심 기초 자료로 활용될 수 있다. 특히 도내 도로 조건과 기후 변수에 따른 사고 위험을 객관적으로 평가하고, 위험 노면 상태에 맞춘 도로 정비-관리, 속도 제한, 운전자 경고 체계, 보험 및 보상 제도 개선, 응급 대응 체계 검토 등 다양한 행정적·안전 정책을 수립할 수 있는 근거 역할을 한다.'
