summary_user: 서울교통공사 1~8호선 차량에서 약냉방칸으로 운영하는 칸 위치를 호선별로 담은 287바이트 크기의 작은 CSV 파일입니다. 포털 설명에 따르면 1·2호선은 약냉방칸이 없고 3~8호선은 가운데 두 칸이 약냉방칸이며, 더위나 추위를 타는 승객이 어느 칸에 타야 할지 확인하거나 안내 서비스에 칸 위치를 넣을 때 씁니다. 전역 조인 키가 없어서 다른 데이터와는 호선 이름이나 같은 기관 데이터로만 맞춰 잇습니다.
description_portal: 호선별 약냉방칸 위치정보는 서울교통공사 1호선부터 8호선 차량의 각 호선별 약냉방칸 위치 정보를 나타낸 데이터입니다.파일은 연번, 호선, 호칸으로 구성되어 있습니다.1호선과 2호선은 약냉방칸을 운영하고 있지 않고 전 호칸이 일반냉방칸으로만 운영되고 있습니다.3호선~4호선은 0~9호칸 중 4호칸, 7호칸이 약냉방칸입니다.5호선~7호선은 1~8호칸 중 4호칸, 5호칸이 약냉방칸입니다.8호선은 1~6호칸 중 3호칸, 4호칸을 약냉방칸입니다.각 3~8호선마다 가운데에 위치한 2개의 칸을 약냉방칸으로 운영하고 있습니다.환경부 고시의 도시철도차량 운행공기질 매뉴얼에 따르고 있으며 실내 온도 섭씨 24~27도를 유지하도록 되어있습니다.이에 따라 일반냉방칸은 섭씨 24도, 약냉방칸은 섭씨 25도로 운행중입니다.
