        required: false
        example: '02'
        desc: '신호등이 위치한 도로의 형태 * 1) 교차로 : 두 개 이상의 도로가 만나는 지점2) 단일로 : 다른 도로와 연결되지 않고 하나로 되어있는 도로3) 기타 : 합류하거나 분리되는 도로 또는 형태불명 도로 등'
