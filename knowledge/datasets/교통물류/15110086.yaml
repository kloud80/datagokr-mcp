status: active
summary_user: 충청남도 아산시에 설치된 신호등을 한 기기씩 담은 건별 데이터로, 관리번호·도로명/지번 주소·위도·경도와 함께 신호등 구분, 신호등 색 종류, 신호 제어·현시 방식, 점멸등 운영 시간, 음향신호기·잔여시간 표시기 설치 여부 등을 담는다. 아산시 교차로·횡단보도 주변의 신호 설비 현황을 지도에 올리거나, 보행자 편의시설(음향신호기·잔여시간 표시)이 어느 지점에 있는지 확인하려는 분석가·시민이 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 주소나 위경도 좌표, 시군구명 같은 이름 매칭으로 잇는다.
limits: 범위가 아산시 한 곳의 시군구 단위라서 다른 지역이나 전국 비교에는 다른 지자체 데이터를 따로 모아야 한다. 공통 코드 키가 없어 단속카메라·보호구역 등 다른 데이터와 붙일 때 좌표 근접이나 주소 문자열 매칭에 기대야 한다. 개발계정은 하루 10,000회 호출로 제한된다.
