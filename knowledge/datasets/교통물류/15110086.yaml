      - name: SIGNLCTRLMTHD
        required: false
        example: '03'
        desc: '중앙컴퓨터 연결 가능 유무에 따른 신호제어기 종류 * 1) 독립 : 인접한 교차로를 고려하지 않고 해당교차로의 교통상황을 고려하여 제어2) 지역연동 : 인접한 지역제어기만을 연계하여 제어 ※ 교통정보센터가 설립되어 있지 않는 지역의 간선도로에 주로 적용3) 중앙연동 : 중앙 컴퓨터와 현장의 각 제어기간 정보 교환을 통해 제어 ※ 모든 제어기는 중앙 컴퓨터에'
      - name: SIGNLTIMEMTHDTYPE
        required: false
        desc: '신호등의 신호현시 및 신호대기시간을 결정하는 방식 * 1) 고정시간제어 : 사전에 입력한 몇 개의 신호시간에 따라 매일 반복하여 신호를 제어하는 방식2) 실시간교통대응제어 : 실시간 교통상황을 중앙컴퓨터로 전송하여 신호시간을 제어하는 방식3) 교통감응제어 : 교통상황 변동에 따라 신호제어변수를 조정하여 교차로 안전성과 효율을 높이는 제어방식4) 기타 : 기'
      - name: OPRATNYN
        required: false
        example: Y
        desc: 점멸등운영여부
