summary_user: 국내 여객선 해양사고를 항로명·선종·사고종류·사고일 항목으로 담은 전국 단위 파일(csv, 약 58KB)로, 포털 설명상 항로별·선종별 발생 현황을 연도별로 정리한 통계이다. 정책 담당자·연구자·언론이 "어느 항로에서 어떤 선종의 여객선이 어떤 종류의 사고를 많이 냈는가" 같은 질문을 따지고, 연도별 추이를 보며 사고 예방 대책을 세우는 데 쓴다. 전역 조인 키는 없어서 연안여객선 항로·운항 데이터와는 항로명이나 선종 이름을 맞춰 연결해야 한다.
description_portal: 본 통계자료는 국내 여객선 해양사고의 항로별 , 선종별 발생 현황 등을 종합적으로 제공하는 데이터이다. 한국해양교통안전공단이 수집·관리한 해양사고 데이터를 기반으로 하며, 항로명, 선종, 사고 종류, 사고 일자 등의 항목이 포함된다. 해양사고 항로별, 선종별 통계를 함께 제공하여 정책 수립 및 연구 분석에 활용할 수 있다. 본 데이터는 여객선 안전관리 강화를 위한 기초자료로써 정부기관, 연구자, 언론 등 다양한 이용자의 의사결정을 지원한다. 연도별 통계로 구성되어 시계열 분석이 가능하며, 사고 예방 대책 마련에도 기여할 수 있다. 본 자료는 정기적으로 갱신되며, 공공데이터포털을 통해 개방된다.
