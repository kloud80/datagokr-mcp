description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 신호등의 상세 정보를 제공합니다. 교차로와 횡단보도에 설치된 신호등의 위치, 규격, 설치 형태 등의 정보를 담고 있어 교통 신호 시설 관리에 활용됩니다. 지형지물부호와 관리번호는 신호등을 식별하며, 관리기관은 신호등 관할 주체를 나타냅니다. 위치 지점과 방향은 신호등이 설치된 지점과 향하는 방향을 표시하고, 신호등 종류와 구분은 차량용, 보행자용 등 신호등의 유형을 나타냅니다. 재질, 규격, 설치형식은 신호등의 사양을 제공하며, 신호등 수는 설치된 등기 개수를 나타냅니다. 경도와 위도는 정확한 위치 좌표를 제공합니다.
