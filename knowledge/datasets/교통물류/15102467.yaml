summary_user: 인천 부평구에 설치된 고정형 불법주정차 단속 CCTV를 한 대씩 담은 파일로, 관리번호·설치위치·행정동·지번/도로명 주소와 단속 시간대, 단속 유예 시간대를 함께 적는다. 시민이 "우리 동네 이 교차로 앞에 몇 시에 차를 세우면 단속되나"를 확인하거나, 분석가가 행정동별 단속 지점 분포와 운영 시간대를 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 행정동 이름이나 주소를 지오코딩·문자열 매칭해서 잇는다.
description_portal: '부평구 내 고정형 주정차 단속용 CCTV의 설치 위치, 운영 시간, 유예 시간 등의 정보를 정리한 자료행정동, 지번·도로명 주소 기준의 설치 지점과 단속 시간대, 단속이 유예되는 시간대 등의 항목으로 구성본 데이터는 다음과 같은 목적으로 활용 가능– 고정형 CCTV 기반 불법주정차 단속 지점 및 운영 현황 파악– 행정동별 단속시간대 분석 및 교통 민원 대응– 주정차 지도 및 단속 정책 수립 기초자료 활용– 시민 대상 단속구간 위치 및 시간 정보 제공주요 항목 설명● 관리번호: 고정형 CCTV의 고유 식별번호● 설치위치: CCTV 설치 지점의 주요 지형지물 또는 교차로 등● 행정동: 설치 위치가 속한 행정동 명칭● 지번주소: 지번 기준의 설치 위치● 도로명주소: 도로명 기준의 설치 위치● 단속시간: CCTV를 통해 주정차 위반 단속이 이루어지는 시간대● 유예시간: 단속을 유예하는 시간대'
