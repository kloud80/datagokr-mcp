summary_user: 한국철도공사가 운영하는 전국 전철역의 승차·하차 인원을 운행년월·노선(전철선 번호)·역(전철역 번호) 단위로 월별 집계한 파일 데이터이며, 건별 원천이 아닌 집계 통계다. 분석가나 사업자가 '특정 전철역의 월별 이용객이 얼마이고 계절·명절에 어떻게 달라지는가'처럼 역별 유동인구 규모와 추이를 볼 때 쓴다. 역과 노선이 공사 내부 번호로만 표기되고 전역 공통 조인 키가 없어, 다른 역 정보나 상권 데이터와 붙이려면 역명·코드 매핑표를 따로 만들거나 같은 기관의 코드 체계로 연결해야 한다.
limits: 역·노선이 번호로만 들어 있어 역명·위치 매핑 없이는 지도나 다른 기관 데이터와 바로 결합할 수 없다. 월 단위 집계이므로 시간대별·일별 혼잡도나 출발지-도착지(OD) 흐름은 알 수 없다.
