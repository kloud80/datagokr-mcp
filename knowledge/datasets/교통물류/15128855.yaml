summary_user: 경기도 도로대장 중 고가도로 시설을 노선번호·구간번호 단위로 한 건씩 담은 원천 자료로, 고가도로명·시설물 종별·시점과 종점 위치·소재지 주소·상하행 차로 수·허용 통행 하중·교차 종류를 담는다. 도로 관리 담당자나 분석가가 "우리 시군 고가도로 중 허용 통행 하중이 낮거나 차로 수가 적은 곳은 어디인가"를 확인하거나 시설물 점검·우회 계획 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id) 등과 바로 결합되지 않으며, 노선번호·구간번호나 고가도로명·소재지 주소를 이름 매칭하여 경기도의 다른 도로대장 자료와 잇는다.
description_portal: 이 데이터는 도로 관리 행정에서 중요한 고가도로 정보를 수록한 도로대장 자료입니다. 각 시설은 노선번호와 구간번호를 기준으로 관리되며, 고가도로명, 시설물 종별, 시점 및 종점 위치 정보가 제공됩니다. 또한 소재지 주소와 함께 상행·하행 차로 수, 허용 통행 하중, 교차 종류와 같은 구조적 특성이 포함되어 있어 시설의 교통 기능과 안전성을 확인할 수 있습니다. 이를 통해 도로 유지보수 계획 수립, 교통량 분산 대책 마련, 구조적 안전 점검 등 다양한 정책적 활용이 가능하며, 교량 및 도로 시설물 관리의 효율성을 높이는 데 기여할 수 있습니다.
