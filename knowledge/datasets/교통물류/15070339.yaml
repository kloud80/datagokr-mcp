summary_user: 최근 5년간 전국 교통사고를 연도별로 집계한 통계로, 사고건수·사망자수·중상자수·경상자수·부상신고자수를 해마다 한 줄씩 담는다(파일 크기 264바이트의 작은 집계표). 교통안전 분석가나 기자가 "최근 5년 사이 전국 교통사고 사망자가 줄었나, 늘었나" 같은 연도별 추세 질문에 쓴다. 전역 조인 키가 없고 발생년만 공통 축이므로, 다른 연도별 통계(차량 등록 대수, 인구 등)와는 연도를 맞춰 붙여 쓴다.
limits: 전국 단위 비공간 집계라 지역별·도로 구간별 분석이나 표준노드링크(링크·노드)와의 공간 연결은 하지 못한다. 경찰이 조사·처리한 인적 피해 사고만 집계하며, 사망은 사고 후 30일 이내 사망 기준이다.
