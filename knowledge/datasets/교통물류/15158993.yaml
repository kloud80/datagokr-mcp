summary_user: 부산교통공사 도시철도 역사별로 휠체어리프트·엘리베이터(내부·외부), 에스컬레이터, 시각장애인 유도로, 외부경사로, 승차보조대, 장애인화장실의 개수와 화장실 구분(공용·분리)을 담는 역 단위 현황 API다. 휠체어 이용자나 보호자가 '이 역에 외부 엘리베이터가 있는가'를 미리 확인하거나, 지자체·연구자가 역별 편의시설 격차를 비교하는 데 쓴다. 역 외부코드(scode)와 역명(sname)이 있으나 전역 조인 키는 없어, 다른 철도 역 데이터와는 역명 매핑이나 부산교통공사 역코드로만 연결한다.
limits: 호출 시 필수 파라미터(act, scode)는 다른 데이터에서 받은 역코드를 먼저 넘겨야 한다. 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑이 필요하며, 좌표가 없는 비공간 데이터라 위치 기반 분석은 별도 역 위치 데이터가 있어야 한다.
