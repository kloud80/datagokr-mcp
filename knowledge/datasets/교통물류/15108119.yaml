summary_user: KTX 정차역별로 상행(서울·수도권 방면)과 하행(지방·종착지 방면)의 승차·하차 인원을 운행년월 단위로 집계한 통계 파일로, 포털 설명상 2010~2023년 전국 KTX 정차역을 다룹니다. 교통 분석가나 지자체 담당자가 '우리 지역 KTX역의 연도별 이용객이 늘었는지, 상행과 하행 중 어느 방향 이용이 많은지'를 확인하는 데 씁니다. 전역 조인 키가 없어 역명(정차역)을 다른 역 목록이나 시간대별 승하차 데이터의 역명과 맞춰 이어 써야 합니다.
limits: 역 코드 같은 전역 조인 키가 없어 다른 데이터와는 역명 매핑으로만 연결되며, 표기 차이를 직접 정리해야 합니다. 역·방향별 집계라서 열차별·시간대별 이용이나 출발지-도착지(OD) 이동은 알 수 없습니다.
