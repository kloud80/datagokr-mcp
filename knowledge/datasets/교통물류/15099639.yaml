summary_user: 경상북도 안동시 관내 도로굴착 허가를 건별로 담은 파일로, 신청인·사업명·시작지와 종점지·굴착 길이(사업량, m)·도로구분·허가 심의 시기를 담는다. 시민이나 통신·가스 등 공공설비 사업자가 '안동시에서 어느 구간에 누가 어떤 굴착 공사를 허가받았는가'를 확인하거나, 분석가가 같은 구간의 공사 겹침을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명·위치명 같은 이름 매핑이나 같은 기관(안동시) 기준으로만 이어 쓴다.
description_portal: 경상북도 안동시 관내 도로 굴착 허가 현황을 제공하는 데이터로 허가 신청자, 공사명, 도로굴착위치(공사구간), 굴착길이(m) 에 대한 항목을 포함하고 있습니다. 해당 데이터는 도로 공사 계획 수립, 도시 인프라 정비, 통신 및 공공설비 관리, 이용자 안전 안내 등에 활용할 수 있습니다. 또한, 굴착 목적과 기간 정보를 기반으로 공사 겹침 여부 분석, 민원 대응 및 도심 교통 영향 평가에 유용하며, 관련 부서와 민간 업계의 협업 자료로도 활용됩니다.정기 갱신을 통해 최신 공사 정보를 제공하며, GIS와 연계하여 굴착표시 및 시각화 지도 구축에도 적용 가능합니다.
