summary_user: 대전광역시 서구에서 2018년부터 누적된 밤샘주차 단속 건을 단속연도·월, 단속동명, 자동차분류, 단속위치와 위도·경도 좌표로 담은 건별 파일 데이터다(CSV 약 173KB). 주민이나 구청 교통 담당자가 '우리 동네 어느 동에서 화물차·건설기계 같은 대형차 밤샘주차가 자주 적발되나'를 확인하고 단속·주차 정책 우선지역을 정하는 데 쓴다. 표준 행정코드 같은 전역 조인 키는 없어서, 다른 데이터와는 단속동명(동 이름) 매핑이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
