summary_user: 구미시 가로등을 분전함 단위로 묶어 위치(지번 주소·좌표·행정동·법정동), 연결된 등 표찰번호 구간, 등주 형태·등기구 종류, 설치일자·최초사용일, 총등주수·총등수·총용량·계약전력·계기번호를 담은 개별 시설 파일이다. 구미시 담당자나 분석가가 "어느 동에 어떤 등기구가 몇 등, 얼마의 용량으로 설치돼 있고 오래된 분전함은 어디인가"를 따져 유지보수·효율화 계획을 세우거나 야간 안전지도를 만드는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 행정동·법정동 이름이나 주소·좌표로 공간 결합해 이어 쓴다.
description_portal: '1. 주요 데이터 항목공공데이터포털위치 정보: 도로명  및 지번 주소, X좌표, Y좌표(위도, 경도)시설 정보 및 관리기관 : 구미시 읍면동 소재지 가로등 분전함번호, 등표찰번호, 등주 형태, 등기구 종류설치 및 관리: 설치일자, 최초사용일자전력 정보: 계약전력, 총등주수, 총등수, 총용량, 계기번호 2. 데이터 활용 및 특징활용 분야: 가로등 위치 기반의 안전지도 제작, 시설물 유지보수 계획 수립, 가로등 효율화 분석.관리 주소: 경상북도 구미시가 관리하며, 데이터는 무료로 이용 가능합니다. 3. 이용 시 유의사항해당 데이터는 기초 데이터 구축 시점에 따라 실제 현장 상황과 일부 다를 수 있으므로, 실제 작업 시 확인이 필요할 수 있습니다.공공데이터포털에서 최신 업데이트 날짜를 확인하여 활용하는 것이 좋습니다. 상세 정보는 공공데이터포털(all.data.go.kr)에서 "구미시 가로등"을 검색하여 다운로드할 수 있습니다. ※ 담당자 전화번호 054-480-5477'
