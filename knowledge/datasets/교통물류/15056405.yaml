legal_basis_portal: 1.2.1. 「도시교통정비촉진법」 제9조(기초 조사)① 시장이나 군수는 대통령령으로 정하는 바에 따라 기본계획 및 중기계획의 수립을 위하여 필요한 사항을 조사할 수 있다. 이 경우 「국가통합교통체계효율화법」 제12조에 따른 국가교통조사와 중복되지 아니하도록 하여야 한다.② 시장이나 군수는 대통령령으로 정하는 바에 따라 교통과 관련된 사항을 조사･분석하여 국토교통부장관이나 도지사에게 보고하여야 한다. 이 경우 보고받은 국토교통부장관은 행정안전부장관에게 보고받은 내용을 알려야 한다.
