summary_user: 대구광역시에 소재한 법인택시 회사별로 회사명, 보유 면허대수, 대표자, 주사무소 주소, 전화번호를 한 행씩 담은 원천 목록 파일(csv, 약 5.7KB)이다. 택시 이용 중 불편이 생긴 시민이 해당 회사의 연락처와 주소를 찾거나, 운송사업 양도양수를 검토하는 사업자가 회사별 면허 규모를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 택시·교통 데이터와는 회사명이나 주소를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 대구광역시에 소재하는 법인택시 회사의 정보를 제공하여 시민들의 정보에 대한 접근성을 향상합니다. 주요 정보로는 법인택시 회사명, 해당 법인택시회사가 보유하고 있는 면허대수(실제 등록차량 아님), 대표자 성명, 주사무소의 주소, 연락처를 포함하고 있습니다. 해당 정보는 여객자동차 운수사업법 및 동법 시행규칙에 의거 처리되는 여객자동차운송사업의 양도양수 시 유용하게 사용될 수 있는 정보입니다. 또한 택시 민원불편 사항 발생 시 민원인이 본 데이터를 바탕으로 적극적인 대응을 가능하게 함으로써 시민들의 권익 증진에 기여할 수 있습니다.
