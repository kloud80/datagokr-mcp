summary_user: 인천공항을 출발하거나 도착하는 여객기의 정기운항편을 편명 단위로 담은 스케줄 데이터로, 항공사, 상대 공항(IATA 코드·한글명), 정기운항 시작·종료일과 시각, 요일별 취항 여부, 시즌, 코드쉐어 여부와 마스터편명을 제공하며 범위는 한 시즌(하계 3월 말~10월 말 또는 동계 10월 말~익년 3월 말)이다. 여행객이나 여행사가 '이번 시즌 인천에서 특정 공항으로 가는 정기편은 무슨 요일, 몇 시에 뜨는가'를 확인하거나, 분석가가 노선별 주간 운항 빈도와 코드쉐어 구성을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 공항 IATA 코드(airportcode)나 편명으로 공항코드 데이터나 같은 공사의 일일 운항현황 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 공항코드값을 검색 조건으로 하여 인천공항 출발/도착 여객기의 항공사 이름, 공항이름, 공항코드, 정기운항편 일정 시작일, 종료일, 편명, 요일정보, 시즌코드값,코드쉐어 구분,마스터편명 등의 정보를 나타내는 여객기 정기운항편 일정 정보 서비스입니다. 개발 계정 일 500 트래픽,운영 계정 신청 시 일 10000 트래픽을 제공합니다. 개방 중인 일일 운항현황 API에서 제공하는 MASTER FLIGHT/SLAVE 편명에 대한 정보와 상이할 수 있습니다. 해당 데이터는 1개 시즌(하계3월말~10월말/동계 10월말에서 익년 3월말)에 대한 데이터입니다.
team:
  dept: 인프라DX팀
services:
  - op: /getPaxFltSchedArrivalsDeOdp
    name: 여객기 정기운항편 상세 현황 정보(도착)
    endpoint: https://apis.data.go.kr/B551177/StatusOfPaxFltSched/getPaxFltSchedArrivalsDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: type
        required: false
        desc: 응답유형 [xml, json] default=xml
      - name: airport
        required: false
        desc: 인천공항에 도착하는 출발지 공항 코드
      - name: lang
        required: false
        desc: 언어구분 국문=K, 영문=E, 중문=C, 일문=J, default=K
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getPaxFltSchedDeparturesDeOdp
    name: 여객기 정기운항편 상세 현황 정보(출발)
    endpoint: https://apis.data.go.kr/B551177/StatusOfPaxFltSched/getPaxFltSchedDeparturesDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: type
        required: true
        example: xml
        desc: 응답유형 [xml, json] default=xml
      - name: airport
        required: true
        example: MFM
        desc: 인천공항에서 출발하는 도착지 공항 코드
      - name: lang
        required: true
        example: K
        desc: 언어구분 국문=K, 영문=E, 중문=C, 일문=J, default=K
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
