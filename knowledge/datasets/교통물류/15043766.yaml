summary_user: 폐쇄식 요금체계가 적용되는 고속도로 영업소의 교통량을 노선·영업소명 행과 가락·가산·감곡 같은 영업소별 열로 펼친 교차표 형태의 집계 파일로, 전국 범위이며 CSV 약 1.1MB입니다. 도로 운영 분석가나 입지 분석가가 '어느 영업소에서 어느 영업소로 빠져나가는 차량이 많은가'처럼 영업소 간 통행 규모와 구간 혼잡도를 비교하는 데 씁니다. 전역 조인 키가 없어 다른 교통량·영업소 데이터와는 노선명·영업소명을 이름으로 맞추거나 같은 기관(한국도로공사) 자료끼리 연결해 씁니다.
description_portal: 본 데이터는 한국도로공사에서 관리하는 폐쇄식 요금체계를 적용받는 고속도로 종점에서의 교통량 현황을 제공한다. 노선명과 영업소명을 기준으로 구성되며, 각 영업소별 진출 차량 수를 상세하게 기록하고 있다. 가락, 가산, 감곡 등 다수의 영업소에 대한 교통량이 포함되어 있어, 구간별 혼잡도 분석 및 정책 수립 시 참고자료로 활용 가능하다. 폐쇄식은 진입과 진출 지점을 모두 고려하여 통행료를 산정하는 체계로, 이 데이터를 통해 교통흐름과 요금 징수의 효율성 평가가 가능하다. 아울러, 도로 운영관리 및 교통시설 투자 우선순위 결정에 기초자료로 활용된다. 본 자료는 교통량 변화 추세를 확인하고 효율적인 도로 운영을 위한 근거 자료로 제공된다.
