description_portal: 부산광역시 수영구에서 현재 시행중인 주요건설공사에 대한 현황으로  공사명, 공사개요, 공사(용역)기간, 담당공무원 등을 제공한다. 2025년 7월22일 기준 시행중인 주요공사에 대한 현황이다. 현재 주요 공사는 2건 있는 실정이며, 보도신설공사와 ASP절삭 덧씌우기 공사이다. 연번,공사명, 공사개요, 공사기간, 담당공무원,전화번호 등의 정보까지 현행화 완료된 자료이다. 공사관련 문의 사항이 있다면 담당공무원의 전화번호로 전화하면 친절한 설명을 들을 수 있다. 다음현행화는 2026년 7월22일 예정이다.
legal_basis_portal: 현 수영구청 건설과 내에서 계약체결된 공사들에 대한 정보이다.
