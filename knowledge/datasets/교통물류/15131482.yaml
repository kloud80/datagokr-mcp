description_portal: '충청북도 충주시 시내버스의 실시간 운행 현황을 기록한 데이터로, 버스 노선별 차량의 이동 경로 및 상태를 상세히 추적할 수 있는 정보를 제공합니다.노선명, 노선아이디, 차량아이디, 날짜, 배차아이디, 배차순번, 현재노드순번, 이벤트구분, 위도, 경도, 속도, 방향 등의 항목으로 구성되어 있으며, 버스 위치 추적, 운행 패턴 분석, 노선 운영 효율성 평가 등에 활용됩니다.노선아이디는 각 노선을 고유하게 식별하는 값이며, 차량아이디는 실제 운행 중인 차량의 식별번호입니다.현재노드순번은 버스가 현재 통과 중인 정류장 또는 구간 순서를 나타내며, 이벤트구분은 승·하차, 정류장 도착, 출발 등의 상태 정보를 기록합니다.위도·경도 필드는 해당 시점의 차량 위치 좌표를, 속도 및 방향은 차량의 주행 상황을 실시간으로 보여주는 데이터로, 혼잡도 분석이나 경로 최적화 등에 활용됩니다.이 데이터는 교통정보시스템(TIMS) 연계, 스마트 정류장 구축, 시민 대중교통 편의 개선, 교통 빅데이터 기반 정책 수립에 활용될 수 있으며, 특히 실시간 기반의 위치 정보 제공이 필요한 다양한 공공서비스 개발에 기초자료로 활용됩니다.※ 본 데이터는 실시간 운행 중 수집된 자료로, 일시적인 통신 오류나 차량 센서 이상에 따라 누락 또는 지연 기록이 발생할 수 있음에 유의해야 합니다.※ 해당파일은 샘플파일로 별도 담당자 요청시 원본파일 제공(샘플데이터 : 2025년 8월 1일 부터 5만건의 데이터, 원본데이터 : 2025년 8월 1일부터 2026년 1월 31일까지의 데이터를 제공)'
