summary_user: 부산광역시 교통정보서비스센터가 DSRC(단거리전용통신) 수집장치로 모은 구간별 가공 교통정보를 가공일시·구간명·시속 단위 속도로 담은 파일이며, 활용신청 없이 받는 CSV(약 580KB) 한 개로 제공된다. 교통 분석가나 시민이 '부산의 특정 DSRC 구간은 어느 시간대에 속도가 떨어지는가'처럼 구간별 속도 추이와 상습 정체를 살피는 데 쓰고, 월별 파일을 쌓으면 정체 분석 이력 원장이 된다. 전역 조인 키가 없어 다른 도로·링크 데이터와는 구간명을 이름으로 맞추거나 같은 기관(부산광역시) 교통 데이터와 수작업 매핑으로만 이어 쓴다.
description_portal: 부산광역시 교통정보서비스센터에서 운영중인 교통정보수집장치(DSRC)를 통해 수집한 DSRC구간별 가공된 교통정보 현황(가공일시, 구간명, 속도)을 제공합니다.데이터는 부산광역시 교통정보서비스센터에서 수집 생성 가공된 데이터를 제공하고 있으며 데이터 생성기준은 매월말일을 기준으로 생성하고 있습니다. 여러 달의 데이터를 원하시는 경우에는 별도로 신청하셔야 합니다. 데이터는 가공일시, 구간명, 속도 등의 DSRC데이터를 생성하여 제공하고 있으며 제공주기는 매월 단위로 제공하고 있습니다.
