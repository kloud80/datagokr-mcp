summary_user: 전국 고속도로 휴게소의 음식 메뉴를 메뉴 한 건씩 담은 원천 데이터로, 휴게소·노선 정보와 함께 음식명, 가격, 추천·대표·프리미엄·계절 메뉴 여부, 식재료 등을 제공한다. 고속도로 이용자가 들를 휴게소의 메뉴와 가격을 미리 확인하거나, 분석가가 휴게소별 대표 메뉴 가격을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 휴게소명·노선명 같은 이름 매핑이나 한국도로공사 내부 휴게소·노선 코드(stdRestCd, routeCd)로만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 휴게소 내 음식 메뉴 정보를 포함한다.제공 항목은 휴게소명, 노선명, 방향, 매장명, 음식명, 가격, 대표메뉴 여부, 영양정보 등으로 구성되어 있다.이 데이터는 고속도로 이용자가 특정 휴게소에서 제공되는 식사 메뉴를 사전에 확인하고 편리하게 이용 계획을 수립하는 데 유용하다.OpenAPI 형식으로 제공되며 XML과 JSON 포맷을 지원하여 정보 시스템과의 연계가 용이하다.제공 정보는 메뉴 구성 현황뿐 아니라 소비자 선택을 위한 다양한 식음 서비스 분석에 활용 가능하다.또한 이용자 맞춤형 정보 제공, 메뉴 가격 비교, 고속도로 이용 만족도 제고 등 다양한 목적에 활용된다.민간 기업, 연구기관, 일반 국민 등 다양한 수요자가 자유롭게 접근할 수 있도록 개방되어 있다.
