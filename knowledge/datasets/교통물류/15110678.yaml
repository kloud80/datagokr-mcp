summary_user: 대전광역시 시내 도로에 설치된 도로안전표지를 한 건씩 담은 개별 시설물 데이터로, 표지마다 위도·경도와 주소, 표지 구분(경고·규제·지시 등)과 설명, 지주 형식, 노선 정보를 제공한다. 교통관리 담당자나 분석가가 '특정 노선이나 지역에 어떤 규제·경고 표지가 어디에 설치돼 있는가'를 지도 위에서 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 좌표·주소를 기준으로 공간 매칭하거나 노선명 같은 이름으로 연결해야 한다.
limits: 표준 코드 형태의 조인 키가 없어 다른 기관 데이터와 직접 결합할 수 없고, 좌표나 이름 매핑으로만 연결된다. 포털 설명에 따르면 법적 효력이 없는 참고용 데이터이며, 범위는 대전광역시 한 곳에 한정된다.
