description_portal: '○ 제목 → 해당 철도 사업에 대한 공식적인 명칭입니다. 예를 들어, "프랑스 고속철도 TGV"나 "영국 런던-맨체스터 철도 노선" 등이 포함됩니다. 사업의 주요 특징이나 프로젝트 이름이 될 수 있습니다.○ 내용 → 철도 사업에 대한 간략한 설명으로, 해당 사업의 주요 정보가 포함됩니다. 예를 들어, 사업의 목적, 노선 정보, 서비스 유형(고속철도, 화물철도 등), 운영 방식(공공/민간 운영) 등이 포함될 수 있습니다. 이 항목은 데이터 사용자가 사업에 대해 이해할 수 있도록 도와줍니다.○ 나라명 → 해당 철도 사업이 운영되는 국가의 이름입니다. 예를 들어, "프랑스", "독일", "일본", "미국" 등이 포함될 수 있습니다. 여러 국가에서 운영되는 다양한 철도 사업에 대한 정보를 제공하기 위해 필수적인 항목입니다.○ 정보제공자 → 이 데이터의 제공 주체를 나타냅니다. 보통은 해당 사업을 운영하는 기관이나 회사가 제공자로 명시됩니다. 예를 들어, "프랑스 SNCF", "독일 Deutsche Bahn" 등이 될 수 있습니다. 이 항목은 데이터의 신뢰성을 판단하는 데 중요한 역할을 합니다.○ 출처 → 해당 데이터의 출처를 명시합니다. 예를 들어, 국가별 교통부, 철도청, 또는 국제 철도 연합 등에서 제공하는 정보가 될 수 있습니다. 출처를 명확히 기록하여 데이터의 신뢰성을 보장할 수 있습니다.○ 마감일 → 해당 데이터의 최신 업데이트 날짜나 유효 기간을 나타냅니다. 예를 들어, "2024년 6월 30일"이라면, 그 날짜까지의 정보가 포함되어 있다는 의미입니다. 마감일은 데이터의 최신성을 확인하는 중요한 항목입니다.○ 게시일 → 공공 데이터 포털에 해당 정보가 게시된 날짜입니다. 이 날짜는 해당 데이터가 언제 공개되었는지, 즉 데이터의 가용성을 나타내는 기준이 됩니다. 예: "2024-07-15"'
