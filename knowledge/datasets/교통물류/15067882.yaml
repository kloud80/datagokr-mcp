summary_user: 해외 철도 사업 한 건마다 사업 제목, 사업 설명, 나라명, 정보제공자, 출처, 마감일, 게시일을 담은 건별 목록 파일(CSV 약 33MB)입니다. 해외 철도 사업 수주를 검토하는 건설·엔지니어링 사업자나 분석가가 "어느 나라에서 어떤 철도 사업이 진행 중이고 마감은 언제인가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 다른 데이터와는 나라명이나 사업명을 이름 그대로 맞춰 이어 써야 한다.
