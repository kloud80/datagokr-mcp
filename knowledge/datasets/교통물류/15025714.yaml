summary_user: 부산광역시 사상구에 등록된 화물운송주선업체를 업체 한 곳당 한 행으로 담은 파일이며, 운송업 종류(일반화물·이사화물 등), 상호, 주사무소 주소를 담는다. 화물 운송이나 이사를 맡길 사람이 '사상구에 있는 이사화물 주선업체는 어디인가'를 찾거나, 분석가가 관내 주선업체의 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소 문자열로 맞춰 이어야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
limits: 사업자등록번호나 허가번호 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵고, 범위는 사상구 한 곳에 그친다. 허가받은 운송·주선사인지의 기준 자료는 전국화물자동차운송사업자표준데이터이므로, 이 파일은 보조 자료로 본다.
