summary_user: 전국 철도운영기관과 철도시설관리기관의 현황을 기관 한 곳당 한 행으로 담은 목록 파일로, 소속구분·기관명·철도구분 세 항목으로 구성됩니다(포털 설명상 26개 기관, 파일 크기 약 1KB). 분석가나 연구자가 "우리나라 철도·도시철도를 운영하거나 시설을 관리하는 기관은 어디이고, 공기업·지자체 공사 중 어디에 속하나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 철도 안전·사고·운영 통계와는 기관명을 맞춰 연결해야 한다.
description_portal: '대한민국 철도운영기관 및 철도시설관리기관 : 전체 운영기관의 현황을 확인가능합니다.한국교통안전공단 철도운영기관 데이터, 도시철도 운영기관 데이터, 철도시설관리기관 데이터 등이 있습니다.철도운영기관에는 대표적으로 공기업으로 한국철도공사가 있고, 지방자치단체 서울교통공사, 부산교통공사, 인천교통공사, 대구교통공사, 대전교통공사, 광주교통공사가 있습니다. 철도시설관리기관에는 대표적으로 국가철도공단이 있습니다.우리나라 전체 철도운영기관 및 철도시설관리기관은 26개기관이 있으며, 소속구분, 기관명의 컬럼명이 있습니다.'
