summary_user: 서울시 도로에 설치된 안전표지를 표지 한 개 단위로 담는 데이터로, 설치방식·표지코드·좌표(EPSG:5186 기준 X·Y)·설치일·교체일·표지 및 지주 관리번호·설치 각도 등을 포함한다. 교통 분석가나 자치구 담당자가 특정 구간에 어떤 안전표지가 언제 설치·교체됐는지 확인하거나 노후 표지 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 좌표를 이용한 공간 결합이나 표지코드 이름 매핑, 서울시 내부 관리번호(지주관리번호 등)로만 연결한다.
limits: data.seoul.go.kr의 별도 인증키(KEY)가 필요하며 공공데이터포털 활용신청과는 별개다. 공통 조인 키가 없어 다른 기관 데이터와 코드로 바로 붙일 수 없고, 표지코드·상태코드의 뜻을 풀 코드표가 함께 제공되지 않는다.
