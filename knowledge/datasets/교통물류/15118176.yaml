summary_user: 전국 자동차검사소에서 2025년 한 해 동안 검사를 마친 전기차 등 고전원 배터리 차량을 검사 1건당 한 행으로 담은 건별 파일(CSV 약 80MB)로, 제작사·차명·연식·최초등록일·검사일자·주행거리와 검사 시점 BMS에서 받은 배터리 셀별 전압(최대 120개)을 담는다. 분석가나 중고 전기차 구매자가 "주행거리나 연식이 늘수록 셀 간 전압 편차가 커지는가, 차종·제작사별로 차이가 있는가" 같은 배터리 열화 질문에 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했으며, 제원관리번호나 제작사·차명 같은 이름 매핑으로만 차량 제원 자료 등과 연결한다.
description_portal: '(전기자동차 검사정보) 전국 검사소에서 2025년 중 수집된  고전원 배터리 사용 자동차에 대한 검사정보 제공차량별 검사결과 및 배터리 상태 확인 가능주요 항목별 상세 설명○ 자료기준연도 → 2025년 1월 1일부터 12월 31일까지 검사가 완료된 차량 대상○ 제작사, 제원관리번호, 차명, 차종, 연식, 제작일자, 최초등록일 ○ 검사일자 → 자동차관리법에 따른 자동차검사 수행일 기준○ 주행거리 → 검사일 당시 계기판에 표시된 누적거리 (단위: km)○ 배터리 셀 전압1~120 → 검사 시점의 BMS 데이터 기반. 셀 수는 차량 구조에 따라 상이하며, 최대 120개까지 기록됨※ BMS에서 전송된 값 그대로 수집되며, 일부 차량은 제조사 기술 제한 등으로 셀 전압 정보가 누락될 수 있음'
