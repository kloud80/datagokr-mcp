summary_user: 전국 17개 시도별로 최근 2년(2024년·2025년) 교통사고 건수와 전년 대비 증감·증감률을 담은 시도 단위 집계 파일로, 경찰이 조사·처리한 인적 피해 사고만 센 국가공식통계(교통사고분석시스템 경찰DB)를 바탕으로 한다. 지자체 담당자나 분석가가 '우리 시도의 교통사고가 작년보다 늘었나, 다른 시도와 비교하면 어떤가'를 빠르게 확인하는 데 쓴다. 전역 조인 키가 없어 시도 이름을 행정구역 코드로 매핑한 뒤 인구·차량등록 등 시도 단위 통계와 이어 쓴다.
limits: 시도 단위 집계라 시군구·도로 링크·사고 지점 단위 분석에는 쓰지 못하고, 표준노드링크 같은 도로망 데이터와 직접 연결되는 키도 없다. 물피 사고는 빠져 있고, 연간 통계는 다음 해에 집계 완료 후 제공되므로 당해년도 수치는 없다.
