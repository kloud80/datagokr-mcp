summary_user: 한국공항공사가 운영하는 인천공항 외 전국 공항의 실시간 운항정보에서 항공편명으로 특정 편을 찾아, 편별 출발·도착 공항, 항공사, 예정·변경 시각, 게이트, 지연·결항 같은 항공편 상태를 건별로 담는다. 공항 이용객이나 마중 나가는 사람이 '오늘 김포발 제주행 이 편이 지연되거나 결항됐는지, 몇 번 게이트인지'를 확인하는 데 쓴다. 전역 조인 키는 없어 기준공항코드(airport)·운항구간코드나 공항명·항공편명을 이름·코드 매핑으로 공항코드 데이터나 같은 기관의 항공기 운항정보 API와 이어 쓴다.
description_portal: 한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는 한국공항공사가 관할하는 운영하고 있는 공항의 실시간 항공기 운항정보의 항공편 검색기능를 제공합니다.기존 제공하던 "항공기 운항정보" API 에서 제공 한 실시간 운항정보의 제공 정보 중 원하는 항공편을 검색하는 기능을 제공합니다.schFln변수를 활용하여 항공편명을 검색 하실 수 있습니다.제공되는 주요 데이터 항목으로는 편명별 출도착 시각, 지연여부, 결항여부, 출도착 공항 등 이 상세히 포함되어 있습니다. 이를 통해 공항 실시간 운항정보 제공 서비스 등 다양한 목적의 데이터 활용이 가능합니다.제공되는 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.
team:
  dept: 데이터융합부
services:
  - op: /info
    name: 항공기 운항정보 항공편 검색
    endpoint: https://apis.data.go.kr/B551178/flight-search/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: schLineType
        required: false
        desc: '항공편종류(국내 : D, 국제 : I) (샘플 :I)'
      - name: schIOType
        required: false
        desc: '운행 타입(도착 : I, 출발 : O) (샘플 :I)'
      - name: schAirCode
        required: false
        desc: 공항 코드(ex 김포공항=GMP, 제주공항=CJU 등) (샘플 :GMP)
      - name: schStTime
        required: false
        desc: 예정시간 (샘플 :0600)
      - name: schEdTime
        required: false
        desc: 변경시간  (샘플 :1800)
      - name: schFln
        required: true
        desc: '항공편명 (샘플 : KE1814)'
      - name: type
        required: false
        desc: '응답 형식(JSON & XML), 기본값 : XML  (샘플 :xml)'
    approval: auto
    traffic:
      dev: 5000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
