summary_user: 인천광역시에서 운행하는 광역버스(직행좌석형·광역급행형 M버스, 준공영·비준공영 포함)를 노선 1건당 한 행으로 담은 원장 파일로, 운수회사·기종점 정류소·면허·인가대수·배차간격·첫차·막차 시간을 담는다(포털 설명 기준 2026.2.28. 35개 노선·상용 410대). 인천에서 서울로 출퇴근하는 시민이나 교통 분석가가 "이 광역버스는 몇 분 간격으로 다니고 막차는 몇 시인가", "어느 회사가 몇 대로 운행하는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 노선번호나 기종점 정류소명을 이름으로 맞춰 BIS·TAGO 정류장·도착정보 같은 다른 버스 데이터와 연결해야 한다.
description_portal: '인천광역시에서 운영되고 있는 광역버스 노선번호, 기점, 정류소, 종점, 운행간격 등의 항목에 대한 정보를 cvs파일로 제공합니다.광역버스 종류로는 직행좌석형과 광역급행형(M버스)가 있습니다.준공영제, 비준공영제 노선 모두 포함된 정보입니다.○ 광역버스 노선 및 상용대수(26.2.28. 기준) 1. 광역버스 노선수 : 35개   -직행좌석형 광역버스 노선 수 : 21개   -광역급행형 M버스 노선수 : 14개 2. 광역버스 상용대수 : 410대   -직행좌석형 광역버스 상용대수 : 266대   -광역급행형 M버스 상용대수 : 144대'
