summary_user: 대구 도시철도 1호선 하선(하양역 → 설화명곡역) 열차의 역별 도착·출발 시각을 요일 구분(평일·토요일·공휴일)과 역명 행에, 열차번호를 열(1001, 1003 … 형태)로 펼쳐 담은 시각표 파일(CSV 약 249KB)입니다. 시민이 특정 역에서 설화명곡 방면 열차가 평일 몇 시에 오는지 확인하거나, 분석가가 시간대별 배차 간격을 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 역명을 이름으로 맞춰 연결해야 하며, 상선 시각표나 같은 기관의 역별 승하차 데이터와 역명 기준으로 함께 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 1호선 하선(하양역 → 설화명곡역) 열차 운행 시각표 정보를 제공합니다. 데이터에는 2024년 10월 7일 변경된 운행 계획이 반영되어 있으며, 열차번호별 출발역 및 도착역, 각 정차역의 도착 시각, 평일·토요일·공휴일별 운행 시간표 등의 항목이 포함되어 있습니다. 해당 데이터는 이용자가 열차 운행 계획과 역별 도착 시간을 확인하고 이동 계획을 수립할 수 있도록 제공되는 자료로, 도시철도 이용 편의 향상, 운행 정보 확인 및 교통 서비스 개선 검토를 위한 기초자료로 활용할 수 있습니다. 또한 요일별 운행 정보를 제공하여 이용 패턴에 따른 대중교통 이용 계획 수립과 효율적인 이동 경로 검토에 활용할 수 있습니다. 본 데이터는 운행 시각표 변경 등 변동 사항 발생 시 갱신되며, 변경된 열차 운행 계획을 반映합니다.'
