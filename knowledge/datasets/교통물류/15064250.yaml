summary_user: 한국도로공사가 운영하는 고속도로 휴게소에 설치된 반려동물 놀이터를 휴게소별로 한 행씩 담은 현황 파일로, 휴게소명·시설 종류·위치·운영시간·휴장일·설치연도를 수록하며 범위는 전국이다. 반려동물과 고속도로를 이용하는 운전자가 경유할 휴게소에 놀이터가 있는지, 몇 시까지 여는지, 쉬는 날은 언제인지를 미리 확인하는 데 쓴다. 전역 조인 키가 없어 다른 휴게소 데이터(주유소·편의시설 등)와는 휴게소명 문자열을 맞춰 연결해야 한다.
limits: 휴게소 코드나 좌표 같은 공통 키가 없어 다른 데이터와 이으려면 휴게소명 표기를 직접 맞춰야 한다. 위치는 휴게소 내 설치 장소 설명일 뿐 지도 좌표가 아니어서 공간 분석에는 바로 쓸 수 없다.
