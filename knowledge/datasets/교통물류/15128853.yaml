summary_user: 경기도 도로대장 가운데 종단경사 항목을 노선번호·구간번호별로 담은 자료로, 구간마다 시점·종점 위치, 경사 값(slo_angl), 시점 지반고, 경사연장, 비고를 기록한 건별 대장 데이터다. 도로 설계·안전 분석가가 "이 노선의 어느 구간이 급경사이고 얼마나 길게 이어지는가"를 확인해 사고 위험 구간이나 제동거리 검토 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id)와 바로 붙지 않으며, 노선번호·구간번호를 같은 기관의 다른 도로대장 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: 도로대장 종단경사 데이터는 도로의 종단 방향 기울기와 관련된 정보를 제공하는 자료입니다. 주요 항목은 노선번호, 구간번호, 위치 및 종점, 경사 값, 시점 지반고, 경사연장, 비고로 구성되어 있으며, 각 구간의 기울기 변화와 도로의 고도 특성을 파악할 수 있습니다. 이를 통해 차량 주행 안전성, 배수 및 도로 구조 설계, 유지보수 계획 수립 등에 활용할 수 있으며, 특히 경사 값과 연장은 교통사고 위험도 평가, 제동거리 분석, 도로 개선 설계 등 교통안전 대책 수립에 중요한 지표가 됩니다. 또한 GIS 기반 도로망 분석과 인프라 모니터링 자료로도 유용합니다.
