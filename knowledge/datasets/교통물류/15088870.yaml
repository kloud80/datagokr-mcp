summary_user: 한국철도공사가 실제 운행한 열차를 운행일자·요일구분·주운행선·역무열차종(KTX, 새마을호, 무궁화호 등)별로 나누어 운행횟수를 담은 전국 단위 집계 파일이다. 철도 분석가나 정책 담당자가 특정 노선에서 열차종별로 하루 몇 회 운행됐는지, 평일과 주말 운행 빈도가 어떻게 다른지 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 공통 조인 키가 없어서, 승하차·혼잡 같은 다른 철도 데이터와는 노선명(주운행선)이나 열차종 이름을 직접 맞춰 이어 쓴다.
