summary_user: 제주특별자치도에 소재한 자동차매매업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 행정시·업체명·등록일·소재지(주소)·연락처를 포함한다. 중고차를 사거나 팔려는 도민이나 사업자가 '제주시·서귀포시에 등록된 중고차 매매상사가 어디에 있고 연락처가 무엇인가'를 확인하거나, 분석가가 등록일 기준으로 매매업체 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 업체명·소재지 주소 매칭이나 행정시 단위로만 이어 쓴다.
description_portal: '제주특별자치도에 소재하고 있는 자동차 매매업체와 관련한 데이터를 제공합니다.항목: 행정시, 업체명, 등록일, 소재지, 연락처 등*「지동차관리법」에 의거하여 관리됨- 자동차관리사업: 자동차매매업ㆍ자동차정비업 및 자동차해체재활용업- 자동차매매업: 자동차[신조차(新造車)와 이륜자동차는 제외]의 매매 또는 매매 알선 및 그 등록 신청의 대행을 업(業)으로 하는 것자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1498850'
