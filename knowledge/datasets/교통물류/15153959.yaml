summary_user: 국토교통부 국가교통정보센터의 표준 노드·링크 체계에서 교차로(노드)별 회전제한 정보를 건별로 담으며, 진입 링크와 진출 링크, 회전제한 유형·운영 구분, 비고로 구성된 전국 단위 비공간 데이터입니다. 내비게이션·경로탐색 개발자나 교통 분석가가 '이 교차로에서 어느 링크에서 어느 링크로의 회전이 금지되는가'를 확인해 경로 계산에 반영하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았고, 노드 ID(ND_ID)와 시작·종료 링크 ID를 같은 표준 노드링크 체계의 노드·링크 데이터와 이름·코드로 맞춰 이어 쓴다.
