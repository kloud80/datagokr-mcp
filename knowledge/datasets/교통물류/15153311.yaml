summary_user: 경상남도 함양군에 접수된 불법주정차 신고를 건별로 담은 파일 데이터로, 신고일시·신고위치·과태료 부과 여부·데이터 기준일자를 한 행에 담는다(CSV 약 87KB). 군 교통 담당자나 분석가가 "함양군에서 불법주정차 신고가 어느 장소·시간대에 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가"를 따지는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 신고위치 문자열을 지명·주소로 맞추거나 같은 기관(함양군) 자료끼리 이어 써야 한다.
description_portal: 경상남도 함양군 불법주정차 신고 및 과태료 부과 현황은 연번, 신고일시 , 신고위치정보, 과태료 부과 여부, 데이터 기준일자 등으로 구성되어 있습니다.본 데이터는 교통질서 개선과 안전한 도로환경 조성에 활용됩니다.단속일시와 단속장소 정보를 통해 시간대별·지역별 단속 패턴을 분석하고, 집중 단속이 필요한 구역을 도출할 수 있으며,부과여부와 기준년도를 연계하면 연도별 단속 실적 및 과태료 부과 추이를 파악할 수 있습니다.또한 데이터기준일자를 기반으로 주기적 업데이트를 수행하여 정책 의사결정의 시의성 및 신뢰성을 확보할 수 있습니다.
