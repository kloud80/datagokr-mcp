description_portal: 대중교통 노선 굴곡도는 노선의 직선성을 수치로 평가하는 지표로, 실제 이동 거리와 출발점-도착점 간 직선 거리의 비율을 통해 산출됩니다. 굴곡도 값이 1에 가까울수록 노선은 직선적이며, 1보다 클수록 경로가 굴곡져 있음을 의미합니다. 이 데이터는 노선 효율성 평가, 이용자 접근성 분석, 대중교통 정책 수립, 운영 비용 최적화 등에 활용됩니다. 예를 들어 고속버스 노선은 굴곡도가 낮고, 지선버스 노선은 굴곡도가 높은 특성을 보이는 사례로 들 수 있습니다. 지자체 노선개편을 위한 보조지표로 활용되고 있습니다.
