summary_user: 전국 대중교통 노선별로 운행일자·요일 단위의 굴곡도(실제 노선거리와 출발·도착 정류장 간 직선거리의 비율)를 노선거리·정류장 수·출발/도착 정류장과 함께 담는다. 지자체 노선개편 담당자나 교통 분석가가 '우리 지역 지선버스 중 지나치게 돌아가는 노선은 어디인가'를 찾아 노선 효율성을 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 노선ID(rte_id)·정류장ID나 노선명·정류장명을 정류장·노선 원장이나 실시간 도착 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
limits: 비공간 데이터라 좌표나 노선 형상이 없어 지도 위 경로 분석에는 별도 정류장·노선 원장이 필요하다. 표준 조인 키가 없어 다른 데이터와 붙일 때 이름·코드 매칭 오류에 주의해야 하고, 개발계정은 하루 1,000회로 호출이 제한된다.
