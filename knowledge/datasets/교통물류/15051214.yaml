summary_user: 인천교통공사가 운영하는 도시철도 인천1호선의 역사별 실내공기질 측정결과를 2025년 6월 30일 기준으로, 역마다 대합실과 상하행 승강장 측정지점 단위로 담은 파일이다(약 3KB 규모의 csv). 지하철 이용자나 환경·보건 분석가가 '인천1호선 어느 역 승강장의 미세먼지·초미세먼지·이산화탄소·포름알데히드·일산화탄소 수치가 유지기준 대비 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 역사·노선 데이터와는 역사명(구분)을 이름으로 맞춰 이어 써야 한다.
description_portal: 인천교통공사에서 운영중인 도시철도 인천1호선의 2025년6월30일 기준 실내공기질 측정결과자료 입니다. 해당 데이터는 구분(역사명),측정지점번호,측정위치,유지기준(PM-10 (㎍/㎥)), 유지기준 (PM-2.5 (㎍/㎥)), 유지기준 (CO2 (ppm)), 유지기준(HCHO (㎍/㎥)), 유지기준(CO(ppm)), 권고기준 (NO2 (ppm)), 권고기준 (Rn (Bq/㎥)), 권고기준 (VOCs (㎍/㎥)) 항목으로 구성되어있습니다.측정위치는 역별 대합실과 상하행선 각 승강장입니다. 2025년 6월 28일 개통한 인천 1호선 연장 3개역(검단호수공원역, 신검단중앙역, 아라역)과 귤현역은 측정결과가 없습니다.
