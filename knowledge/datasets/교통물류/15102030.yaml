summary_user: 경기도 군포시 관내에 주사무소를 둔 국제물류주선업 등록업체를 업체별로 한 줄씩 담은 원천 목록으로, 업체명·소재지 주소·허가일자·영업상태를 담는다(csv 약 1.4KB의 소규모 파일). 수출입화물 주선을 맡길 군포 지역 업체가 정식 등록돼 있고 현재 영업 중인지 확인하려는 화주·사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소로 맞춰 이어야 하며, 허가 여부의 전국 기준은 전국화물자동차운송사업자표준데이터를 함께 본다.
description_portal: 국제물류주선업이란, 타인의 수요에 따라 자기의 명의와 계산으로 타인의 물류시설ㆍ장비 등을 이용하여 수출입화물의 물류를 주선하는 사업을 말합니다.본 데이터는 경기도 군포시 관내에 주사무소를 두고 있는 국제물류주선업 등록업체 관련 정보를 제공하며, 업체명, 주소, 허가일자, 영업상태에 대한 정보를 제공합니다.
