summary_user: 서울시설공단이 운영하는 서울시 공영주차장별로 주차면수와 입차·출차 대수를 담은 파일 데이터이며, 실측 컬럼은 주차장명·시간대·주차면수·입차대수·출차대수 다섯 개입니다(csv 약 80KB). 서울 공영주차장의 시간대·월별 이용 수요를 비교하려는 분석가나 정책 담당자가 '어느 공영주차장이 어느 시간대에 입차가 몰리는가' 같은 질문에 쓴다. 전역 조인 키가 없어 주차장명을 이름으로 맞춰 전국주차장정보표준데이터(주차장관리번호·좌표·요금·면수 원장) 등과 이어 쓴다.
description_portal: 본 데이터는 서울시설공단이 관리·운영하는 서울시 내 주요 공영주차장의 월별 이용 실적을 기록한 자산입니다. 주차장별 위치, 급지 분류, 총 주차면수 등의 기본 정보와 함께, 매월 해당 주차장을 이용한 총 주차 차량 대수, 정기권 및 요일제 이용 현황, 총 주차 요금 수입 등의 운영 실적 데이터를 포함하고 있습니다.이를 통해 서울시 주요 거점의 월별·계절별 주차 수요 변화 추이를 파악할 수 있으며, 도심 교통량 분석, 공영주차장 운영 효율화 및 요금 체계 개선, 나아가 스마트 시티 주차 공간 예측 서비스 개발 등 다양한 교통 정책 수립과 연구 분석의 기초 자료로 유용하게 활용될 수 있습니다.
