summary_user: 서울시 도로 가로등의 날짜별 실제 점등·소등 시간을 서울 기준 일출·일몰 시간과 나란히 담은 기록으로, 점소등 일련번호와 날짜 단위로 한 행씩 제공되며 점등·소등 편차 항목도 함께 있다. 에너지·조명 정책 분석가가 '가로등이 일몰 뒤 몇 분 만에 켜지고 일출 전후 언제 꺼지는지, 계절별 편차가 얼마인지'를 확인해 점소등 운영 기준 조정이나 절전 효과 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜(STLP_LGUPOUT_YMD)를 기준으로 일출·일몰 천문 자료나 전력 사용량 같은 일별 자료와 맞대어 쓰는 정도로만 연결한다.
description_portal: 서울특별시 가로등 점소등 시간 현황 데이터는 서울시 전역 도로에 설치된 가로등의 점등 및 소등 운영 시간을 기록한 공공데이터입니다. 본 데이터는 자치구, 도로사업소, 시설관리공단 등 다양한 기관에서 관리하는 가로등의 실제 점등·소등 시간과 함께, 서울특별시 기준의 일출 및 일몰 시간을 비교하여 운영 편차를 확인할 수 있도록 구성되어 있습니다. 데이터는 가로등 점소등 일련번호, 점소등 날짜, 일출시간, 일몰시간, 실제 소등시간, 실제 점등 시간 등의 항목으로 이루어져 있어 시간별 운영 상태를 세부적으로 분석할 수 있습니다. 이를 통해 에너지 절감 효율 분석, 도로 안전 관리, 야간 보행 환경 개선, 공공 조명 운영 최적화 및 스마트시티 정책 수립 등에 활용 가능한 자료입니다.
