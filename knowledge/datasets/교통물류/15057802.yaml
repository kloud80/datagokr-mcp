description_portal: '서울지하철 각 **역 구간의 거리(km)와 평균 소요시간(분)**을 제공하는 API입니다. 노선/역명을 기준으로 조회하면, 해당 노선에서의 구간 거리, 구간 소요시간, 그리고 노선 기점부터의 누계거리 정보를 표준화된 형식으로 받을 수 있습니다. 길찾기·ETA 산정, 시간표/지도 서비스, 운행분석, 연구용 모델링(혼잡·에너지·정시성) 등 다양한 서비스에서 기본 지표로 활용됩니다.<활용사례>ETA/길찾기: 구간별 평균 소요시간(HM)과 거리(DIST_KM)로 도착예정시간 산정, 우회 경로 비교지도·모빌리티: 누계거리(ACML_DIST)를 활용한 노선 거리 보정 및 역간 거리 시각화서비스 기획/정책: 장거리 구간·장시간 구간을 식별해 혼잡 완화, 배차 조정, 정시성 분석에 활용연구/모델링: 구간거리 × 운행패턴으로 에너지·탄소 배출 추정, 혼잡·수요 예측 모델 입력값으로 사용'
