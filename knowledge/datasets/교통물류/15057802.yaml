summary_user: 서울지하철 노선별 역 구간의 거리(km)와 평균 소요시간(분), 노선 기점부터의 누계거리를 구간 단위로 담은 서울교통공사 외부 API 데이터이다. 길찾기·도착예정시간(ETA) 산정이나 장거리·장시간 구간 식별 같은 운행·정시성 분석에서 "이 두 역 사이는 몇 km, 몇 분인가"를 확인하는 데 쓴다. 필드에 노선명(SBWY_ROUT_LN)과 역명(SBWY_STNS_NM)이 있으나 전역 조인 키는 없어, 다른 지하철 데이터와는 노선·역명 매핑이나 같은 기관 코드로 이어 쓴다.
limits: data.seoul.go.kr 인증키(KEY)가 필요하며 포털 활용신청과는 별개이다. 전역 조인 키가 없어 다른 데이터와 결합하려면 역명·노선명을 직접 매핑해야 한다. 갱신은 이벤트 주기로 생성 후 불변이라고만 확인되며, 실시간 운행 소요시간은 담지 않는다.
