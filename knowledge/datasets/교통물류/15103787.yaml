summary_user: 인천광역시 부평구 버스정류장의 명칭(정류소명)과 고유 식별번호(정류소ID)를 정류장 한 곳당 한 행으로 담은 원장 파일이다(CSV 약 17KB). 부평구 안에 어떤 정류장이 있고 각 정류장의 ID가 무엇인지 확인하려는 주민·분석가가 정류장 목록 정리나 대중교통 접근성 검토의 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 정류소명이나 정류소ID를 이름·코드 매핑하는 방식으로만 연결하고, 실시간 도착(TAGO·지자체 BIS) 정보와 이을 때도 ID 체계가 맞는지 먼저 확인해야 한다.
description_portal: '버스정류장의 명칭과 고유 ID를 수록한 데이터.대중교통 이용 현황을 파악하고, 정류장 위치 기반 교통 접근성 분석, 버스노선 운영 효율화, 교통 인프라 확충 및 주민 편의 증진 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 행정동별·노선별 버스정류장 분포 현황 분석– 정류소명·ID 기반 정류장 위치 및 운영 특성 파악– 대중교통 접근성 평가 및 교통 편의성 개선 자료 활용– 버스노선 개편, 정류장 증설 등 교통정책 근거 자료 제공주요 항목 설명● 연번: 데이터의 고유 번호● 정류소명: 버스정류장의 명칭● 정류소ID: 각 정류장을 구분하는 고유 식별번호'
