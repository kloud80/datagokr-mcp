summary_user: 2018년 기준 전국 행정구역 읍면동 단위로 추정한 교통량을 평일·주말로 나눠 전체·승용차·버스·화물차별로 담은 집계 파일이다. 상권·입지 분석가나 사업자가 특정 동네의 평일과 주말 차량 통행 규모, 화물차 비중이 어느 정도인지 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정구역코드나 시도·시군구·읍면동 이름을 매핑해 인구·상권 등 읍면동 단위 데이터와 연결한다.
limits: 조사지점별 실측값이 아니라 읍면동 단위 추정치이며, 2018년 행정구역 기준이라 이후 행정구역 변경분은 이름·코드 매핑을 따로 맞춰야 한다. 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 대조로만 이어진다.
