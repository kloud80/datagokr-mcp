summary_user: 한국도로공사 통계연보 가운데 고속도로 교통량을 조회기간·구간별로 평일과 주말을 나누고 승용차·버스·화물차 등 차종별 이용 자동차 대수로 정리한 전국 단위 집계표(CSV 파일)이다. 분석가나 교통 정책 담당자가 '어느 구간에서 주말에 승용차 교통량이 평일보다 얼마나 늘어나는가' 같은 요일·차종별 통행 특성과 혼잡 차이를 볼 때 쓴다. 실측 컬럼에 표준노드링크(link_id·node_id) 같은 전역 조인 키가 없어, 다른 교통·도로망 데이터와는 구간 이름을 직접 맞추거나 같은 기관(한국도로공사) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사가 발간하는 통계연보 중 평일과 주말 기준으로 차종별 교통량을 구분하여 정리한 자료이다.  고속도로를 이용하는 차량의 통행 특성을 요일 및 차종별로 분석할 수 있도록 구성되어 있으며, 승용차, 버스, 화물차 등 주요 차종별 교통량이 집계되어 있다.  본 데이터는 교통 수요 예측, 혼잡 분석, 요금 정책 수립 등 다양한 분야에서 활용 가능하다.  또한 평일과 주말 간 교통량 차이를 파악함으로써, 혼잡 완화 및 교통 운영 전략 수립에 기여할 수 있다.  데이터는 연도별로 제공되며, 통계표 형식으로 구성되어 시계열 분석이 가능하다.  CSV 형식으로 제공되며, 기관의 정책 분석 및 연구 목적 등에 활용될 수 있다.
