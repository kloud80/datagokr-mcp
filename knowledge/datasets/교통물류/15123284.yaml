summary_user: 경기도 도로대장 전산화 시스템을 바탕으로 도내 도로에 설치된 차량방호안전시설(가드레일·가드펜스·콘크리트방호울타리 등)을 시설 구간 단위로 담으며, 노선번호·구간번호, 시점·종점 위치와 방향, 시설 종류, 연장·높이, 등급, 시점·종점 좌표를 포함한다. 도로 관리자나 교통안전 분석가가 '특정 노선의 어느 구간에 어떤 방호시설이 얼마나 설치돼 있는가'를 확인하거나 방호시설 현황을 지도에 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선번호·구간번호 같은 이름·코드 매핑이나 시점·종점 좌표를 이용한 공간 대조로만 이어 쓴다.
description_portal: '이 데이터는 경기도 도로대장전산화시스템을 기반으로 도내 도로에 설치된 차량방호안전시설의 정보를 제공하며, 노선번호, 구간번호, 시점 및 종점 위치, 방향, 시설 종류(예: 가드레일, 가드펜스, 콘크리트방호울타리), 연장 및 높이, 공간 좌표 등으로 구성되어 있습니다. 차량 방호시설은 교통사고 발생 시 차량의 이탈을 방지하고 피해를 최소화하는 중요한 도로 안전 인프라로, 본 데이터는 교통안전시설물의 현황 파악, 노선별 안전등급 분석, 유지보수 계획 수립, 공간정보 기반 안전지도 제작 등에 활용됩니다. 위치정보가 포함되어 있어 GIS 기반 시각화 및 사고다발구간의 안전성 평가, 도로환경 개선 정책 수립 등에도 활용 가치가 높습니다.'
