summary_user: 공항철도 노선 역마다 역번호와 역명, 영어·로마자·일본어·중국어(간체·번체) 표기, 환승역 여부, 유실물 취급 여부, 신설일자를 한 행씩 담은 역 단위 원천 목록 파일(xlsx, 약 10KB)이다. 외국어 안내표지나 다국어 앱을 만드는 사업자가 '공항철도 각 역의 공식 외국어 역명과 역번호는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 좌표·출입구·승하차 데이터와는 역명이나 역번호를 직접 맞춰 매핑해야 하며, 역세권 판정용 역 마스터(transit_node_cd)에 연결하는 기준 자료로 쓴다.
limits: 표준 역 코드 같은 전역 조인 키가 없어 이름·코드 매핑으로만 다른 데이터와 연결된다. 역 좌표는 들어 있지 않아 이 파일만으로는 위치 분석을 하지 못한다.
