description_portal: 이 데이터는 해양수산부에서 선박의 운항 관련 정보를 제공하기 위해 수집한 데이터입니다.항구, 조회기간, 호출부호 등 입력 파라미터를 이용하여 데이터를 호출하실 수 있으며, 본 데이터의 주요 내용은 항구명, 입출항시간, 입항횟수, 선박의 명칭, 국가코드, 총톤수, 선원수 등 선박 제반 정보와 출항지, 차항지 등으로 구성되어 있습니다.이 데이터는 해운업체가 선박 운항 계획 수립과 운항 효율성 분석에 활용할 수 있습니다. 또한, 연구기관에서 항만 입출항 선박 동향을 위한 기초 데이터로 활용할 수 있습니다.
