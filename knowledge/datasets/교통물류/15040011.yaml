description_portal: 여수시 시민여객선의 운영 현황, 선박 특성 등을 체계적으로 제공하는 데이터입니다. 이 데이터는 여객선의 기본 식별 정보부터 선박 규모, 수송 능력, 운항 관련 정보까지 포함하여 해상교통 서비스의 효율적인 운영과 관리에 활용될 수 있는 중요한 공공데이터입니다. 시민여객선은 섬 지역 주민들의 이동권 보장과 관광객의 해상교통 이용을 지원하는 핵심 교통수단으로, 선박 정보 데이터는 각 선박의 특성과 운항 능력을 파악하는 데 중요한 역할을 합니다. 이를 통해 선박별 여객 수송 능력, 차량 적재 가능 여부, 선박 규모, 운항 가능 구간 등을 분석할 수 있으며, 해상교통 서비스 개선과 정책 수립의 기초자료로 활용할 수 있습니다.
