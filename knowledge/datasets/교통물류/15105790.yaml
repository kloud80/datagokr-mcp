description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야 환경관리 정보 데이터로, 대구교통공사의 연도별 온실가스 배출량 현황 정보를 제공합니다. 데이터에는 연도별 온실가스 배출 총량과 직접배출(Scope 1), 간접배출(Scope 2) 관련 정보가 포함되어 있으며, 도시철도 운영 및 관련 시설에서 발생하는 온실가스 배출 현황과 변화 추이를 확인할 수 있는 자료입니다. 해당 데이터는 에너지 사용량, 전력 소비, 연료 사용량 등을 기반으로 산정된 온실가스 배출 실적을 제공하며, 배출량 분석, 온실가스 감축 계획 수립, 탄소중립 관련 정책 검토 및 환경관리 업무를 위한 기초자료로 활용할 수 있습니다. 또한 연도별 배출 현황을 통해 기관의 온실가스 관리 현황을 파악하고 환경경영 관련 자료로 활용할 수 있습니다. 본 데이터는 연 1회 갱신되며, 온실가스 배출량 변동 사항을 반영합니다.'
