summary_user: 경상북도 김천시에 등록된 자동차 대수를 차종(승용·승합·화물·특수)별로 나누고, 각 차종을 관용·자가용·영업용 대수와 합계로 집계한 시군구 단위 통계 파일이다(CSV 206바이트 규모의 소형 집계표). 김천시의 차종별 등록 대수나 영업용 차량 비중을 확인하려는 분석가·행정 담당자가 지역 교통 현황 보고서나 시각화에 쓴다. 전역 조인 키가 없어 다른 시군구 자동차등록현황과는 차종 구분명과 데이터기준일을 맞춰 이름 기준으로 이어 붙여야 한다.
description_portal: 경상북도 김천시의 자동차 등록 현황으로 데이터 기준일 기준 승용차, 승합차, 화물차, 특수차 대수 및 차종별로 관용, 자가용, 영업용 대수를 구분하여 정보를 제공합니다.본 데이터는 경상북도 김천시 관내 자동차 등록 현황을 종합적으로 제공하는 통계 자료입니다. 김천시에서 등록된 관용 자동차, 자가용 자동차, 영업용 자동차의 등록 대수를 집계하였으며, 각 항목별 데이터와함계 총 등록 대수(합계)도 포함되어 있습니다. 관용 차량은 공공기관에서 운영하는 차량을 의미하며, 자가용은 개인이나 법인이 비영업 목적으로 소유한 차량, 영업용은 택시, 버스, 화물차 등 상업적 목적으로운영되는 차량을 포함됩니다.데이터는 CSV형식으로 제공되며, 누구나 자유롭게 다운로드하여 활용할 수 있습니다. 본 자료는 김천시 교통행정과에서 관리,갱신하고 있으며, 최신성 확보를 위해 정기적으로 업데이트 됩니다. 사용자는본 데이터를 가공하여 시각화하거나 머신러닝 분석, 보고서 작성 등 다양한 목적으로 활용할 수 있습니다.
