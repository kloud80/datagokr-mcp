      - name: END_LATITUDE
        required: false
        example: '36.3327270000'
        desc: 도로구간-종점(위도)
      - name: END_LONGITUDE
        required: false
        example: '127.3322610000'
        desc: 도로구간-종점(경도)
      - name: MAJOR_STOPOVER
        required: false
        example: 용계교
        desc: 자전거 도로 경로에 인접한 대표 시설, 지역 등을 표기
      - name: TOTAL_LENGTH
        required: false
        example: '1.26'
        desc: 자전거 도로의 기점에서 부터 종점까지의 거리 (표현방식/단위 = km)
      - name: ROADBT
        required: false
        example: '0'
        desc: 자전거 도로가 포함된 일반도로의 너비를 미터로 표기 (표현방식/단위 = m)
      - name: BIKE_ROAD_WIDTH
        required: false
        example: '1.75'
        desc: 자전거 도로의 너비를 미터로 표기 (표현방식/단위 = m)
      - name: BIKE_ROAD_TYPE
        required: false
        example: 자전거전용도로
        desc: 자전거 도로에 대한 종류를 표기
      - name: BIKE_ROAD_NOTI_CHK
        required: false
        example: Y
        desc: 자전거 도로 고시 유무 (표현방식/단위 = Y:있음, N:없음)
      - name: REFERENCEDATE
        required: false
