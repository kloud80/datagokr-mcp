description_portal: 서울교통공사 교통약자이용정보 API는 서울지하철 역사 내 교통약자를 위한 주요 편의시설 및 지원 현황을 제공하는 API입니다. 엘리베이터, 장애인화장실, 휠체어리프트, 수어영상전화기, 휠체어급속충전기 등 총 9종의 정보에 대해 위치, 운영 여부, 설치 현황 등의 항목을 포함하며, 수시로 갱신되는 데이터를 Rest API 방식으로 제공합니다. 해당 정보는 교통약자의 이동 편의 향상 및 역사 내 접근성 개선을 위한 서비스에 활용될 수 있습니다. 데이터는 매일(장애인화장실, 수어영상전화기, 교통약자도우미현황), 수시(휠체어급속충전기, 안전발판보유현황) 또는 매 5분마다 갱신됩니다.
