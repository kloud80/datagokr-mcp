summary_user: 서울지하철 역사 안의 교통약자 편의시설(엘리베이터, 에스컬레이터·휠체어리프트, 장애인화장실, 수어영상전화기, 휠체어급속충전기 등 9종)을 시설 한 건 단위로 담고, 호선·역명·역코드, 근접 출입구, 시작·종료 층과 상세위치, 정원, 가동현황을 함께 제공하는 API다. 휠체어 이용자나 교통약자 이동 안내 서비스 개발자가 '이 역의 몇 번 출구 근처 엘리베이터가 지금 운행 중인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 역코드(stnCd)·역명·호선명을 이름·코드로 매핑하거나 같은 서울교통공사 데이터의 역코드로만 연결한다.
limits: 전역 조인 키가 없어 국가 표준 역·시설 코드와 바로 결합할 수 없고, 역명·역코드 매핑이 필요하다. 역 좌표 필드가 없어 지도 위치는 별도 역 마스터와 이어야 한다. 개발계정은 일 10,000회 호출로 제한된다.
