summary_user: 창원시 안에 설치된 횡단보도를 한 건씩 담은 파일로, 행정읍면동·관리기관·설치일자·존재 여부·보도턱 낮춤과 장애시설 유무·폭·길이·횡단방식을 기록한다. 보행 안전을 살피는 시민이나 도로 정비를 검토하는 분석가가 '우리 동네 횡단보도 중 보도턱 낮춤이 안 된 곳이 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정읍면동 이름을 맞춰 연결하거나, 같은 창원시가 낸 자료와 기관 기준으로만 이어 쓴다.
description_portal: 창원시 횡단보도 현황 자료(지장물부호, 횡단보도 설치 행정동, 관리기관, 설치일자, 존재유무, 보도턱낮춤 유무, 장애시설 유무, 횡단보도 폭, 횡단보도 길이, 횡단보도방식)보행자 안전과 도로교통 관리 강화를 위해 설치된 횡단보도의 위치 및 현황을 정리한 자료입니다. 이 데이터는 지역별 횡단보도 분포, 안전시설 설치 여부, 보행 패턴 분석, 교통사고 예방, 도시계획 및 도로정비 등 다양한 목적에 활용될 수 있습니다.자료가 많을 경우 일반 뷰어(엑셀, 메모장 등)에서 일부만 보일 수 있으므로, R, Python, GIS 등 분석 전용 도구를 사용하는 것이 좋습니다.횡단보도 설치 기준, 보도 경계·신호체계 등 세부 항목 정의는 제공기관의 메타데이터 또는 기술문서를 참고하시기 바랍니다.
