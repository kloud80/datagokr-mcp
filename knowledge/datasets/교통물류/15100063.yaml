summary_user: 전국 자전거도로를 노선 단위로 한 줄씩 담은 표준데이터로, 노선명·시도·시군구, 기점·종점 주소와 좌표, 총길이, 도로너비, 종류, 고시 여부, 관리기관을 포함하며 검증 시 20,375행을 받았다. 자전거 이용자나 지자체·분석가가 우리 지역에 어떤 자전거도로 노선이 있고 길이와 폭이 얼마인지 확인하는 데 쓴다. 기점·종점의 도로명·지번 주소(address)와 위경도(coord)로 공공자전거 대여소나 다른 도로·교통 데이터와 이어 쓰며, 노선 식별용 별도 코드 키는 확인되지 않았다.
limits: 포털 파일 다운로드로 확인한 자료이며 전체 범위는 미상이고, 행정단위는 개별 주소·좌표 기준이다. 기록된 기간은 2022-06-27~2026-08-08이며 최신 행 날짜는 관측일보다 55일 앞서 있다. 노선 중간 경로가 아닌 기점·종점 좌표만 있어 노선 형상은 이 데이터만으로 알 수 없다.
