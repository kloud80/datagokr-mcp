summary_user: 대전광역시 내 불법주정차 단속용 고정형 CCTV 단속구간을 구간 한 건씩 담은 현황 파일로, 구간마다 주소·위도·경도·교차로수·CCTV수·기준일자가 들어 있다. 운전자나 상인이 '우리 가게 앞 도로가 고정형 CCTV 단속구간인지'를 확인하거나, 분석가가 구별 단속 CCTV 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 없어서 시군구코드·시군구명으로 행정구역 통계와 맞추거나 위도·경도로 다른 위치 데이터와 공간 결합해 이어 쓴다.
description_portal: 대전광역시 내 불법주정차 단속을 위해 설치된 고정형 CCTV 단속구간의 현황을 정리한 자료입니다. 관리번호, 시군구명, 시군구코드, 우편번호, 주소, 연락처, 위도, 경도, 위치, 교차로수, 대표이미지, 기준일자, 기타, CCTV수, 위치정보 등 다양한 항목이 포함되어 있습니다. 고정형 CCTV는 주요 도로와 교차로, 상습 위반 구간 등에 집중적으로 설치되어 있으며, 실시간 영상 분석을 통해 불법주정차 차량을 자동으로 감지하고 단속합니다. 이 자료는 교통 혼잡 해소, 보행자 안전 확보, 긴급차량 통행로 유지 등 도시 교통질서 개선에 활용되며, 각 구간별 단속 현황과 CCTV 설치 현황을 체계적으로 파악할 수 있습니다.
