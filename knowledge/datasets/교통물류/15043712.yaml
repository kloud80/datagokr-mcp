summary_user: 전국 고속도로 휴게소별 화장실 설비를 노선·시설명 단위로 남자 변기 수와 여자 변기 수로 나눠 담은 파일(csv, 약 6KB)이다. 이용자나 분석가가 "어느 노선 휴게소의 여자 화장실 변기가 상대적으로 부족한가" 같은 질문에 답하거나 확충·개보수 대상을 고를 때 쓴다. 전역 조인 키가 없어 다른 휴게소 데이터(주유소·충전소·편의시설 등)와는 노선명과 휴게소 이름을 맞춰 연결해야 한다.
