description_portal: 대구교통공사에서 관리하는 도시광역철도의 철도운영기관명,선명,역명,환승주차장명,출구번호,주차면수,운영시간_평일,운영시간_휴일,주차요금,월정기권,기타요금,환승주차장운영기관,전화번호 입니다.교통 승용차 운전자가 지하철이나 버스 따위의 다른 교통수단을 편리하게 이용하도록 하기 위하여 환승 시설 주변에 마련한 주차장을 말한다.시간주차, 월전기주차 요금으로 구분되며 각 주차장별로 금액은 다르며 출차 시, 30분 이내 지하철 이용이 확인되면 주차 요금 할인을 받을수 도 있다.환승주차장은날로 극심해지는 주차난을 감안하여, 차량의 도심진입 억제와 인근주민의 주차난 해소에 많은 도움을 주고 있습니다.지하철 환승을 위한 주차장의 위치, 이용가능한 전철/지하철의 노선, 주차면수, 이용요금을 각 주차장별로 제공함
