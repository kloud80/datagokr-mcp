summary_user: 경춘선 각 역의 승강장별로 차량 순서와 출입문 번호마다 승강장과 차량 사이 안전거리(이격거리)를 한 행씩 담은 건별 시설 측정 파일로, CSV 약 66KB 규모다. 교통약자 단체나 철도 안전 분석가가 '경춘선 어느 역, 몇 번째 칸 몇 번 문에서 승강장 틈이 넓은가'를 확인하거나 휠체어·유모차 이용 시 주의할 승하차 위치를 안내하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 역명·노선명(선명)을 이름으로 맞춰 역 좌표·출입구 등 역 마스터 데이터에 붙여 쓴다.
