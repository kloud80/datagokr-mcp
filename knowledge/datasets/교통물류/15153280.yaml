summary_user: 한국건설기술연구원이 제공하는 전국 지자체 관리 도로 지점의 속성 정보로, 지점별 도로등급, 지점 번호, 행정구역, 주소, 구간연장, 차로폭(상행·하행), 교차로까지 거리, 토지이용 현황, 주차 여건 등을 지점 단위로 담는다. 교통안전 분석가나 지자체 담당자가 "우리 시군구에서 차로폭이 좁고 교차로와 가까운 도로 지점은 어디인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 행정구역명(ADMDST)이나 주소 문자열을 매핑해 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 지자체지점에 대한 정보입니다.\""
