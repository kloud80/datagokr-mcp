summary_user: 서울특별시 동작구에 설치된 불법주정차 단속용 고정형 CCTV를 대당 한 건씩 담은 위치 목록으로, 지번주소·위도·경도·자치구·단속 지점명이 들어 있습니다. 시민이나 사업자가 "이 골목에 주정차 단속 카메라가 있나"를 확인하거나, 분석가가 단속 지점 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 자치구 코드(CGG_CD)나 지점명·주소 매칭, 또는 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구에서 주정차단속용 고정형CCTV의 위치정보를 제공하여 불법주정차 위반으로 인한 사회적 비용을 줄이기 위해 제공됩니다.교통정보 플랫폼과 연계하여 시민에게 다양한 교통 서비스를 제공합니다.이 데이터에는 고정형 CCTV 지번주소, 위도, 경도, 해당 자치구, 단속 지점명 등이 포함되어 있습니다.CCTV 주소 항목을 통해 단속 장비가 설치된 위치의 주소 정보를 확인할 수 있습니다.위도와 경도 항목을 통해 CCTV의 정확한 위치 좌표를 확인할 수 있습니다.
