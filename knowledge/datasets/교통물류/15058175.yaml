summary_user: 경기도 내 물류단지를 단지 한 곳당 한 행으로 담아 시군, 단지명, 사업시행자, 단지 면적, 준공 여부, 사업기간, 물류·상류·복합·지원·공공시설별 토지이용계획 면적, 지번·도로명 주소와 위도·경도를 제공한다. 물류 입지를 검토하는 사업자나 정책 분석가가 '경기도 어느 시군에 어떤 규모의 물류단지가 준공됐거나 조성 중인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명이나 단지명 매핑, 또는 좌표·주소를 이용한 공간 결합으로 물류창고업 등록 현황 같은 다른 물류시설 데이터와 이어 쓴다.
description_portal: 경기도의 물류 단지 시설 현황입니다. 물류단지면적, 단지명, 소재지주소, 물류/상류/복합/지원/공공 시설 토지 이용계획 면적등의 정보를 제공합니다.이 데이터는 경기도 내 물류단지의 시설 정보를 정리한 자료로, 각 단지의 위치, 시행자, 총 면적, 준공 여부, 사업기간, 토지 이용 계획(물류·지원·공공·복합시설 등) 정보를 포함하고 있습니다. 주요 항목은 시군명, 물류단지명, 사업시행자명, 물류단지면적, 공공·지원·상류·복합시설 토지이용계획면적, 소재지 주소, WGS84 좌표(위도·경도) 등으로 구성되어 있어, 해당 단지의 개발 규모와 활용 용도를 명확히 파악할 수 있습니다. 특히 **준공 상태(준공, 보상중 등)**와 사업기간 정보는 물류단지의 진행 현황을 파악하는 데 중요한 지표로 활용됩니다. 본 데이터는 물류정책 수립, 입지 전략 분석, 유통시설 기반 연구, 도심 물류 효율화 등에 유용하며, 주소 및 좌표 정보를 통해 공간 분석 및 시각화에도 활용 가능합니다. 데이터는 국토교통부 및 경기도 물류 관련 부서에서 수집·관리한 공공정보를 기반으로 합니다.
