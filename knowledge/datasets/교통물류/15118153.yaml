summary_user: 서울 강서구 관내 초등학교 주변 어린이 보호구역에 설치된 옐로카펫을 한 곳씩 학교명, 도로명주소, 설치년도, 위도·경도로 담은 건별 목록이며, 범위는 강서구 한 개 시군구이고 2.5KB 정도의 작은 CSV 파일이다. 학부모나 구청·교통 분석가가 '우리 아이 학교 앞에 옐로카펫이 있는지, 언제 설치됐는지'를 확인하거나 설치가 안 된 학교를 찾을 때 쓴다. 전역 조인 키가 없어 학교명으로 학교 정보와 맞추거나, 좌표·주소를 기준으로 어린이보호구역 표준데이터나 교통사고 지점 자료와 공간으로 겹쳐 쓴다.
description_portal: 서울특별시 강서구 관내 어린이 교통사고 예방을 위한 어린이 보호구역에 안전시설로 설치되는 옐로카펫의 위치와 설치 정보를 제공하는 데이터입니다.강서구 관내 초등학교 주변 어린이 보호구역에 설치된 옐로카펫의 학교명, 도로명주소, 설치년도, 위도 및 경도 등의 정보를 포함하고 있습니다. 옐로카펫은 어린이들이 횡단보도를 기다릴 때 운전자에게 잘 보이도록 노란색으로 구획된 공간을 의미하며, 시인성을 높여 교통사고 위험을 줄이는 역할을 합니다. 본 데이터는 어린이 안전정책 수립, 교통 인프라 개선, 보행자 중심 도시계획 수립 등에 활용할 수 있으며, 향후 설치 위치의 확대나 효과성 분석 등에도 기반자료로 유용하게 활용됩니다.
