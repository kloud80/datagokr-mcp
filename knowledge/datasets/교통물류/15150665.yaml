summary_user: 전국 우회로를 이루는 도로 구간(링크)을 순서대로 담은 건별 상세 데이터로, 우회로 식별자, 링크 식별자와 순서(LNK_SQNC), 시도·시군구명, 등록·수정 일시를 기록한다. 교통 분석가나 지자체 담당자가 '특정 우회로가 어느 시군구의 어떤 구간을 차례로 지나는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시도·시군구 이름 매칭이나 같은 출처(국가교통정보센터)의 우회로 데이터 식별자로 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
