description_portal: '경산시에 설치되어 운영중인 버스도착정보안내기 현황에 대한 자료입니다. 도착정보안내기가 설치되어 있는 정류장, 해당 정류장을 경유하는 노선, 도착안내기의 운영시간(모니터가 켜지고 꺼지는 시간 등)에 대한 정보를 포함하고 있습니다.버스도착안내기를 통해서는 버스도착예정시간 등의 정보를 확인하실 수 있으며, 현재 경산시에서는 288개소, 289대의 버스도착안내기를 운영 중에 있습니다.해당 데이터는 버스도착안내기가 설치되어 있지 않은 정류장의 정보(경유노선 등)는 포함하고 있지 않으므로,버스도착안내기가 설치되어 있지 않은 정류장을 이용하실 때는 "경산시교통정보센터" 홈페이지를 통하여 도착정보, 경유노선, 버스시간표 등을 확인하시기 바랍니다.추가로 버스 운행이 종료되는 시간대에는 버스도착안내기도 운영하지 않고 있으니, 이용에 참고 부탁드립니다.문의사항 : 경상북도 경산시 교통행정과 대중교통팀(☎053-810-6192)'
