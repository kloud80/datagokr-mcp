summary_user: 경상남도 창원시의 자동차 등록대수를 읍면동(행정동) 단위로 정리한 집계 파일로, 포털 설명상 5개 구청별로 나뉘며 관용·자가용·영업용 등 용도별 대수를 담는다. 교통·주차 정책 담당자나 분석가가 '창원시에서 자동차가 가장 많이 등록된 동은 어디인가' 같은 동별 차량 밀집도를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 읍면동 이름을 행정동 코드로 매핑해서만 이어 쓸 수 있다.
description_portal: 경상남도 창원시 행정동별 규모별 자동차 등록대수 현황입니다. (관용, 자가용, 영업용 등) 5개 구청으로 구분되어 있습니다. 읍면동별 자동차 등록대수 데이터는 지역단위로 등록된 자동차의 총수와 차종별 분류 현황을 정리한 자료로, 각 행정구역 내 교통 수요와 자동차 밀집도를 파악할 수 있도록 구성되어 있습니다. 이 데이터는 지역별 교통정책 수립, 도로·주차 인프라 계획, 배출가스 저감 정책, 교통혼잡도 예측, 민원 대응, 세금·보험 과세 기반 마련 등에 활용되며, GIS 기반 시각화와 연계하면 공간 패턴 분석과 정책 최적화 자료로 매우 유용합니다.
