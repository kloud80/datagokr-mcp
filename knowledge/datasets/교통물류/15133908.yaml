summary_user: 한국도로공사가 생산한 전자문서를 문서 한 건 단위로 등록일·제목·부서명·결재선·개방여부·분류 구분과 함께 담은 전국 단위 비공간 목록 파일(CSV 약 9MB)이다. 정보공개를 청구하려는 국민이나 기관 행정을 분석하는 연구자가 "어느 부서가 언제 어떤 문서를 만들었고 공개 문서인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 부서명이나 제목 같은 이름 매칭, 또는 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 한국도로공사에서 생산된 전자문서의 등록 현황을 제공하는 자료이다. 문서등록일, 제목, 부서명, 결재선, 개방여부 등의 항목으로 구성되어 있으며, 문서 관리 및 행정 투명성 제고를 위한 기초자료로 활용된다. 이를 통해 조직 내 의사결정 흐름을 파악하고, 부서별 문서 처리 현황을 분석할 수 있다. 전자문서의 개방 여부는 정보공개 기준에 따라 구분되며, 민간 및 공공기관의 문서 관련 분석, 업무 흐름 개선, 기록물 관리 체계 수립 등에 참고할 수 있는 데이터이다. 또한 문서의 시계열 등록 정보는 특정 시점의 업무 집중도나 조직 간 협업 패턴을 분석하는 데 활용될 수 있으며, 전자기록물 관리 및 정보공개제도 운영의 투명성과 신뢰성을 높이는 데 기여한다.
