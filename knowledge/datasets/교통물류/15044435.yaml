summary_user: 서울교통공사 1~8호선 역별로 개집표기 설치 대수를 유형(턴스타일·플랩형·개방형·교통약자용·엘리베이터용)별로 담은 시설 현황 파일로, 환승역은 호선별로 나뉘어 한 행씩 들어간다. 교통약자 이동 편의를 분석하는 연구자나 시민이 '어느 역에 교통약자용·엘리베이터용 개집표기가 몇 대 있는가'를 확인하거나 역별 개집표 설비 규모를 비교할 때 쓴다. 전역 공통 조인 키는 없어서, 다른 역 데이터와는 고유역번호(외부역코드)나 역명·호선을 맞춰 서울교통공사 데이터끼리 연결해 쓴다.
description_portal: 서울교통공사의 개집표기 설치 현황(연번,호선,역사명,턴스타일개집표기,슬림개집표기,스피드개집표기,1~8호선 자동개집표기,플랩형개집표기,개방형개집표기,우대자용개집표기,엘레베이터용개집표기) 데이터입니다. 2025년 8월 기준 입니다.역번호는1-4호선은 예를들어 150 서울역에서  맨앞숫자 1은 호선을 의미합니다.  5-8호선은 25,26,27,28로 시작하며 두번째 숫자가 호선을 의미합니다.  환승역에서는 역번호 뒤 괄호 안의 숫자가 해당호선의 개집표기 숫자입니다. 예를들어 천호(5) 와 천호(8)은 각각 5호선과 8호선의개집표기 별 숫자를 의미합니다. 개집표기 사진은 공사 홈페이지에 공개가 되어있습니다.  개집표기 숫자와 통로수는 차이가 있으니, 이점 유의 부탁드립니다 ( 예를들어 개집표기가 3개이면 2통로가 됩니다.)
