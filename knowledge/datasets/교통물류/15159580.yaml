summary_user: 광주광역시 5개 자치구 관내 시내버스 정류소를 한 곳씩 담은 목록으로, 자치구·정류소번호(ARS ID)·정류소명·주소·법정동·행정동을 담는다(포털 설명 기준 총 2,400개소, 마을버스 정류소 제외). 시민이나 분석가가 '우리 행정동에 시내버스 정류소가 몇 개이고 어디에 있나'를 확인하거나 자치구·동별 정류소 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 정류소번호나 정류소명, 법정동·행정동 이름을 매칭해 지자체 BIS 도착정보나 노선 데이터, 행정동 단위 통계와 이어 쓴다.
description_portal: '기준 광주광역시 관내 시내버스 정류소 현황 데이터입니다.광주광역시 5개 자치구(동구·서구·남구·북구·광산구) 행정구역 내 정류소를 행정동별로 분류하였으며, 정류소명, 정류소 ARS ID, 주소 등의 정보를 포함하고 있습니다.데이터는 관할 자치구 및 정류소 ARS ID 순으로 정렬되어 있으며, 마을버스 정류소는 제외하였습니다.총 정류소 수: 2,400개소· 동구 195개소· 서구 375개소· 남구 292개소· 북구 654개소· 광산구 884개소2024년 대비 정류소 21개소 추가 설치· 광산구 21개소 증가'
