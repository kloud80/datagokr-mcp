summary_user: 경기도 양평군 안에서 어린이집·유치원·학교 등 어린이보호구역에 설치된 CCTV를 대상시설·주소·위도경도 단위로 한 줄씩 담은 시군구 범위의 파일(csv)이다. 학부모나 지역 분석가가 '우리 아이 학교 주변 보호구역에 CCTV가 있는지, 영상 보관기간과 문의할 관리부서는 어디인지'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 대상시설명·주소 이름 매칭이나 위도·경도 좌표로 이어 붙이고, 같은 양평군 기관 데이터와 묶어 쓴다.
description_portal: 양평군 내 어린이집, 유치원, 학교 등 어린이보호구역으로 지정된 곳에 설치된 CCTV 정보입니다.지번주소, 보관기간, 관리부서, 전화번호 등의 정보를 제공합니다.어린이보호구역 내 문제발생 빈도를 줄이고 문제가 일어난 경우의 신속한 해결을 위하여 제공합니다.* 도로교통법 제12조 1항 시장등은 교통사고의 위험으로부터 어린이를 보호하기 위하여 필요하다고 인정하는 경우에는 다음 각 호의 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 일정 구간을 어린이 보호구역으로 지정하여 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있다
