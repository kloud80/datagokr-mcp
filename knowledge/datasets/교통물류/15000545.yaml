summary_user: 창원시 공영자전거 누비자의 터미널(대여소)을 한 행씩 담은 파일로, 터미널번호·터미널명·구·동·주소·위도·경도·사용 여부·등록일을 담는다. 시민이나 분석가가 '우리 동네 근처 누비자 터미널이 어디에 있고 지금 사용 중인가'를 확인하거나, 구·동별 터미널 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어서 구·동 이름이나 주소로 행정구역 자료와 맞추거나, 위도·경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 창원시 시민공영자전거 누비자에 대하여 현재 설치된 2023년~2025년 기준 터미널 현황을 터미널명, 위치(~구, ~동, 위도 및 경도), 주소, 등록일자 등을 제공합니다.누비자 터미널 데이터는 공영자전거 누비자의 주요 거점(터미널) 위치, 정류장 코드, 설치된 자전거 수용용량, 운영 시간대, 관리 주체 및 상태 정보를 종합적으로 정리한 자료입니다. 해당 자료는 거점별 이용 빈도 및 배차 효율 분석, 자전거 재배치 전략 수립, 접근성 및 수요 기반 인프라 확충, 서비스 품질 개선, 민원 대응, 스마트 모빌리티 정책 기획, 도시 교통 연계 측면에서 핵심 지표로 활용됩니다. 특히 GIS 기반 시각화와 결합하여 터미널 간 이용 흐름 분석 및 공간적 보완 전략을 마련하는 데 효과적입니다.
