summary_user: 경찰청이 제공한 교통 위험요소 정보를 차종별로 나누어 전국 범위로 담는다. 위험요소마다 분류 코드(대·중·소분류), 기준일자, 지번·도로명 주소, 위경도, 상세 내용이 붙는 것으로 보인다. 분석가가 특정 차종에 위험한 도로 지점이 어디에 몰려 있는지 파악하는 데 쓰며, 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로 주소나 위경도(LAT, LOT)로 위치를 맞추거나 같은 기관 코드로 연결해야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-차종별 데이터는 경찰청에서 제공하는 정보입니다.
