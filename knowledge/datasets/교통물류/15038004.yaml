    source: portal_meta:보유근거
legal_basis_portal: 주차장법 제8조제1항 ① 노상주차장은 제7조제1항에 따라 해당 주차장을 설치한 특별시장ㆍ광역시장, 시장ㆍ군수 또는 구청장이 관리하거나 특별시장ㆍ광역시장, 시장ㆍ군수 또는 구청장으로부터 그 관리를 위탁받은 자(이하 “노상주차장관리 수탁자”라 한다)가 관리한다.주차장법 제13조제1항 ① 노외주차장은 그 노외주차장을 설치한 자가 관리한다.
