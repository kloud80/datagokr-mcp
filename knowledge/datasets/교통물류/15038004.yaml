summary_user: 창원시 관내 공영(유료) 주차장을 주차장 한 곳당 한 행으로 담은 파일로, 노상·노외 구분, 관리기관과 연락처, 행정구·읍면동, 주차장명, 지번, 일반·장애인·친환경/경차 주차면 수를 담는다. 시민이나 분석가가 '우리 동네(구·읍면동)에 유료 공영주차장이 어디에 몇 면 있는지', 장애인·경차 전용면이 얼마나 되는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주차장명·지번·읍면동 이름을 맞춰 연결해야 하며, 좌표·요금·관리번호가 있는 전국주차장정보표준데이터와 이름 매칭으로 보완해 쓴다.
description_portal: 2024년 12월 31일 기준, 경상남도 창원시 공영(유료)주차장 현황 정보를 제공합니다. 창원시 관내 주차장 중 유료 주차장에 관한 정보입니다.주차장구분(노상,노외), 관리기관(연락처 등), 행정구 , 행정동, 주차장명, 지번, 주차면 현황으로 구성된  데이터 입니다. 주차요금은  최초30분 500원, 10분마다 200원,  1일 주차요금 6천원 입니다. 1일 주차요금은 주차장 입차 후 24시간 이내로 적용합니다. 자동차의  크기가 주차구획선 크기의 기준 이상일  경우에는 주차구획선 점유면수를 기준으로 요금이 계산됩니다.경형자동차 등 12종에 대하여 주차요금 50%감면 받게됩니다.  차종 및 급지에 따라 요금이 달라질 수 있으니,  자세한 내용은 "창원시 주차장 설치 및 관리 조례"[별표1]을 참조하여 주시기 바랍니다.
