summary_user: 여수시에서 운행 중인 버스의 노선(노선 ID·노선명·유형·방향·기점·종점·회차지·첫차/막차 시간)과 정류장, 정류장 도착 정보를 담는 시군구 단위 조회 API로, 정류장은 주소·좌표 수준의 개별 단위로 제공된다. 여수 시민이나 앱 개발자가 "이 노선의 첫차·막차는 몇 시이고 지금 정류장에 버스가 언제 오는가"를 확인하거나, 분석가가 여수 노선망 구조를 파악하는 데 쓴다. 다른 데이터와 직접 잇는 전역 조인 키는 실측에서 확인되지 않아, 노선 ID·정류장 ID는 같은 여수시 버스 데이터 안에서만 쓰고 외부 데이터와는 노선명·정류장명 매핑이나 좌표로 연결해야 한다.
description_portal: 전라남도 여수시에서 운행중인 버스의 운행, 버스 정류장, 정류장 도착 정보를 제공하는 서비스입니다.
