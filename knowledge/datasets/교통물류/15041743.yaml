summary_user: 강원특별자치도 태백시의 버스승강장을 한 곳씩 담은 목록으로, 번호·소재 동 이름·인근 건물명으로 본 위치를 기록한 작은 CSV 파일(약 4.7KB)이다. 태백시 주민이나 방문객, 지역 교통 분석가가 '우리 동네 어느 건물 앞에 버스승강장이 있나', '동별로 승강장이 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키나 정류장 코드가 없어 TAGO 정류장 정보나 버스 도착 정보와는 동 이름·승강장 명칭을 맞춰 보는 방식으로만 이어 쓴다.
limits: 좌표나 표준 정류장 ID가 없어 지도 표시나 다른 정류장 데이터와의 자동 연결은 바로 되지 않고, 동 이름·건물명 문자열을 맞춰야 한다. 범위는 태백시 한 곳에 그치며 노선·도착 정보는 담지 않는다.
