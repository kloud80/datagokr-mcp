summary_user: 경기도 버스운송관리시스템(BMS)에서 나온 업체별 노선 인가 이력을 이력ID·노선ID·업체ID 단위의 건별 기록으로 담는다. 행정 담당자나 분석가가 특정 노선을 어느 운수업체가 운영해 왔는지, 업체별로 어떤 노선을 인가받았는지 추적하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 경기도 버스 노선·업체 정보와는 같은 기관의 노선ID(route_id)·업체ID(entrps_id) 코드로만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로 업체ID별 노선ID 이력 정보를 제공하는 자료입니다. 각 항목은 '이력ID', '노선ID', '업체ID'로 구성되어 있으며, 특정 업체가 운영하는 버스 노선의 인가 이력 변동 사항을 기록한 데이터입니다. 이를 통해 특정 노선이 어떤 업체에 의해 언제부터 운영되었는지를 추적할 수 있으며, 대중교통 정책 수립, 버스 노선의 민원 분석, 업체별 노선 운영현황 모니터링 등에 활용될 수 있습니다. 특히 이 데이터는 경기도 내 노선 관리 및 업체별 인가 이력 분석에 유용하며, 지역 교통 서비스 품질 개선과 버스 행정 운영의 투명성 확보에 기여할 수 있습니다.
