summary_user: 서울특별시 영등포구에 설치된 불법 주정차 위반 단속용 고정 CCTV의 위치를 카메라 한 대 단위로 담은 목록으로, 설치 주소(FIX_CCTV_ADDR)와 위도·경도, 구 코드, 단속 지점명, 구분 값을 포함한다. 영등포구에서 차를 세우려는 시민이나 상가 운영자가 '이 골목에 주정차 단속 카메라가 있는가'를 미리 확인하는 데 쓰고, 분석가는 단속 카메라 분포와 보행 안전 취약 지점을 비교하는 데 쓴다. 전역 조인 키는 없어 위도·경도로 다른 공간 데이터와 겹쳐 보거나, 구 코드(CGG_CD)·주소 이름을 매핑해 같은 기관의 다른 데이터와 잇는다.
description_portal: 서울특별시  영등포구 불법 주정차 위반 단속 CCTV 위치 정보입니다. 본 정보는 불법주정차를 방지하고, 안전한 보행 및 교통 환경을 조성하기 위해 제공됩니다. 또한 단속의 투명성을 높이는 동시에 사전 안내 기능을 수행하여, 시민들이 불이익을 피하고 불필요한 민원을 예방하는 데에도 기여하고 있습니다. 이를 통해 불법주정차로 발생하는 사회적 비용을 절감하고 교통정보 플랫폼과 연계하여 시민에게 실시간  다양한 교통 서비스를 제공합니다. 궁극적으로는 단순한 단속 목적을 넘어서 시민과의 소통, 안전한 도시 환경 조성, 교통 질서 확립, 디지털 행정 활성화를 도모하고자 합니다.
