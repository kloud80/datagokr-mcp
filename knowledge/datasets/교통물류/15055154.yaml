summary_user: 경상남도 관할 지방관리무역항 6곳(통영·삼천포·고현·옥포·장승포·하동)의 연도별 선박 입출항 실적과 화물 물동량을 항만별 열로 나눠 담은 집계 통계 파일(CSV, 약 1KB)이다. 해운·물류 분석가나 지자체 담당자가 '거제 고현항과 옥포항의 화물 물동량이 해마다 어떻게 달라졌나'처럼 남해안 지방무역항의 연도별 추이를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 항만 통계나 입출항 데이터와는 연도와 항만 이름을 직접 맞춰서만 이어 쓸 수 있다.
description_portal: 본 데이터는 경상남도 관할 지방관리무역항의 연도별 화물 물동량 및 선박 입출항 현황을 기록한 통계입니다. 글로벌 공급망 변화에 따른 남해안 해운 물류 트렌드를 분석하고, 지방관리무역항 활성화 및 지역 경제 지표 수립을 위한 기초 자료로 활용할 수 있습니다. 최근 사회적 관심사인 수출입 물동량 변화 추이와 항만 물류 안정성 확보를 위한 정책 연구 및 민간 비즈니스 모델 개발에 기여할 수 있는 공공데이터입니다.※ 본 데이터는 매년 12월 말 기준으로 전년도 통계가 정기적으로 업데이트됩니다.
