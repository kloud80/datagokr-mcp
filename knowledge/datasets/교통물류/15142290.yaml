summary_user: 한국해양교통안전공단이 운항관리하는 전국 연안여객선의 제원을 선박 한 척당 한 행으로 담는다. 여객선명, 총톤수, 길이·너비·깊이, 선종, 항해속도, 여객정원, 선사명·전화번호가 들어 있다. 여행객이나 분석가가 "이 항로에 다니는 배는 몇 톤이고 정원은 몇 명인가" 같은 질문에 답할 때 쓰며, 실측에서 전역 조인 키는 찾지 못해 같은 공단의 운항상태·스케줄 데이터와는 여객선코드(psnshp_cd)나 여객선명·선사명을 맞춰 붙여야 한다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로공단의 운항관리 대상 연안여객선의 제원 정보를 포함하고 있습니다.여객선명, 총톤수, 선박길이, 선박너비, 선박깊이, 진수일자, 선종명, 항해속도, 여객정원수, 면허항로명, 선사명 등이 포함된 정보 입니다.여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다."
