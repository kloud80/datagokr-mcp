summary_user: 대전광역시 횡단보도를 개별 건 단위로 담은 API로, 위치(주소·위도·경도)와 연장·폭 같은 물리적 특성, 신호등·보행섬·점자블록 등 시설 여부 필드를 제공한다. 보행 환경을 점검하는 분석가나 담당자가 특정 지역 횡단보도의 규모와 분포, 안전시설 설치 현황을 확인하는 질문에 쓴다. 지번·도로명주소(LNMADR)와 위도·경도(LATITUDE, LONGITUDE)가 조인 키라서 주소나 좌표 기준으로 어린이보호구역, 단속카메라 같은 다른 규제·단속 데이터와 이어 쓴다.
description_portal: 대전광역시 횡단보도조회서비스는 시내 횡단보도의 위치 및 물리적 특성 정보를 종합적으로 제공합니다. 이 자료에는 각 횡단보도의 위도, 경도, 도로명주소, 횡단보도 연장(길이), 폭(너비) 등이 포함되어 있어 횡단보도의 구조적 규모와 분포를 정확히 파악할 수 있습니다. 활용자는 해당 데이터를 통해 보행자 안전 강화 및 도로시설물 관리 현황을 분석할 수 있으며, 도시 교통 계획 수립, 안전 사고 예방, 보행 환경 개선 등에 효과적으로 활용할 수 있습니다. ※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
team:
  dept: 법무통계담당관
services:
  - op: /getPdcrList1
    name: 대전광역시 횡단보도 목록 조회
    endpoint: https://apis.data.go.kr/6300000/GetPdcrListService1/getPdcrList1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: '한 페이지 결과 수 (기본값 : 10)'
      - name: pageNo
        required: true
        example: '1'
        desc: '페이지 번호(기본값 : 1)'
      - name: type
        required: true
        example: xml
        desc: XML/JSON 여부
      - name: CTPRVNNM
        required: false
        example: 대전광역시
        desc: 횡단보도가 위치한 광역시, 도 명칭
      - name: SIGNGU_NM
        required: false
        example: 서구
        desc: 횡단보도가 위치한 시, 군, 구의 명칭
      - name: ROADNM
        required: false
        example: 계룡로
        desc: 횡단보도가 위치한 도로의 명칭
      - name: LNMADR
        required: false
        example: 서구 갈마동 309-1도
        desc: 횡단보도가 위치한 상세 지번주소
      - name: CRSLKKND
        required: false
        example: '1'
        desc: 횡단보도 형태에 따른 종류 (표현형식/단위 = 01:일반형, 02:대각선, 03:스테거드, 04:도류화, 99:기타)
      - name: BCYCLCRSLKCMBNATYN
        required: false
        example: N
        desc: 자전거 횡단도와의 겸용 여부 (표현형식/단위 = Y:적용, N:미적용)
      - name: HIGHLANDYN
        required: false
        example: N
        desc: 횡단보도 고원식 적용 여부 (표현형식/단위 = Y:적용, N:미적용)
      - name: LATITUDE
        required: false
        example: '36.351648957'
        desc: 횡단보도 중심부의 위도 좌표값
      - name: LONGITUDE
        required: false
        example: '127.370654028'
        desc: 횡단보도 중심부의 경도 좌표값
      - name: CARTRKCO
        required: false
        example: '1'
        desc: 횡단보도가 위치한 도로에서 차량이 통행할 수 있도록 차선으로 구분되는 차로의 수 (표현형식/단위 = 차로)
      - name: BT
        required: false
        example: '4.2'
        desc: 횡단보도의 폭 (표현형식/단위 = m)
      - name: ET
        required: false
        example: '6.42'
        desc: 횡단보도의 길이 (표현형식/단위 = m)
      - name: TFCLGHTYN
        required: false
        example: N
        desc: 보행자신호등 유무 (표현형식/단위 = Y:있음, N:없음)
      - name: GREENSGNGNRTIME
        required: false
        example: '0'
        desc: 횡단보도 신호등의 녹색 신호 유지 시간(초 단위(SS)
      - name: REDSGNGNRTIME
        required: false
        example: '0'
        desc: 횡단보도 신호등의 적색 신호 유지 시간(초 단위(SS)
      - name: TFCILNDYN
        required: false
        example: N
        desc: 횡단보도 내 교통섬 유무 (표현형식/단위 = Y:있음, N:없음)
      - name: FTPTHLOWERYN
        required: false
        example: Y
        desc: 횡단보도 내 보도턱 낮춤 여부 (표현형식/단위 = Y:있음, N:없음)
      - name: BRLLBLCKYN
        required: false
        example: N
        desc: 횡단보도 내 점자블록 설치 여부 (표현형식/단위 = Y:있음, N:없음)
      - name: CNCTRLGHTFCLTYYN
        required: false
        example: N
        desc: 횡단보도 집중조명시설 설치 여부 (표현형식/단위 = Y:있음, N:없음)
      - name: REFERENCEDATE
        required: false
        example: '2022-12-10'
        desc: '데이터 작성 기준일자 (예시: yyyy-mm-dd) '
      - name: FNCTNGSGNGNRYN
        required: false
        desc: 보행자 스스로 신호를 요청할 수 있는 누름버튼의 부착 여부 (표현형식/단위 = Y:있음, N:없음)
      - name: SONDSGNGNRYN
        required: false
        desc: 신호등의 음향신호기 설치 여부 (표현형식/단위 = Y:설치, N:미설치)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
