summary_user: 천안시 관내 교통정보 CCTV의 설치 지점을 대당 한 행으로 담은 파일로, 관리번호·설치위치명·주소·경위도 좌표를 제공한다(약 9KB CSV). 시민이나 분석가가 '천안 시내 어느 교차로·도로에 교통 CCTV가 있는지'를 지도에서 확인하거나 실시간 소통 정보와 함께 볼 지점을 고를 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표·주소 기반 공간 매칭이나 설치위치명 대조로만 잇는다.
description_portal: 충청남도 천안시 관내 교통정보cctv에 대한 데이터입니다. 천안시 관내 교통정보cctv(CCTV관리번호, 경도, 위도, 설치위치명 등)의 항목들을 제공합니다.천안시 교통정보센터의 스트리밍 서비스는 일정 기준 이상으로 고정적 다중 접속 시 자동 차단되며, 이는 다른 시스템(BIT, BOE 등) 및 천안시 교통정보 홈페이지의 네트워크 안정성 확보를 위한 조치입니다. 차단된 IP는 원칙적으로 해제해 드릴 수 없습니다. 또한 정확한 차단 기준(접속 수, 시간 등)은 내부 보안 운영 지침에 따라 공개되지 않으며, 다수의 카메라를 고정적으로 동시에 접근하는 경우 자동 차단될 수 있습니다.
