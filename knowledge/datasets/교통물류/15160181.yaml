summary_user: 택시운행정보관리시스템(TIMS) 기록을 바탕으로 전국 500미터 격자별·월별 택시 승차(영업) 건수, 영업금액, 영업거리, 영업시간을 집계한 파일로, 법인택시와 개인택시를 모두 포함한다. 교통 분석가나 지자체 담당자가 '어느 지역 격자에서 언제 택시 수요와 매출이 몰리는가'를 보고 택시 공급·승차대 배치나 대중교통 공백 지역을 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 500미터 격자 번호와 년월을 기준으로 같은 격자 체계를 쓰는 다른 격자 통계와 맞춰 쓰고, 행정구역 단위와는 별도의 매핑을 거쳐야 이어 쓸 수 있다.
description_portal: 이 데이터는 택시운행정보관리시스템(TIMS) 기반 통계입니다.연간 500미터 격자별 월별 택시 승차 건수, 영업금액, 영업거리, 영업시간을 제공하며, 법인택시와 개인택시 모두 포함입니다.택시운행정보관리시스템은 택시운송사업의 발전에 관한 법률 제13조에 따라 주행거리, 속도, 위치정보(GPS), 분당 회전 수(RPM), 브레이크신호, 가속도 등 「교통안전법」 제55조제1항에 따른 운행기록장치에 기록된 정보와 승차일시, 승차거리, 영업거리, 요금정보 등 「자동차관리법」 제47조제1항에 따른 택시요금미터에 기록된 정보를 수집 관리합니다.
