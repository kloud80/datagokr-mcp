summary_user: 인천 부평구에서 주차장을 주민에게 개방한 학교별로 학교명·주소, 개방면수, 개방개시일, 평일·주말 개방시간을 한 행씩 담은 소규모 목록 파일(CSV 964바이트)이다. 부평구 주민이 '퇴근 후나 주말에 집 근처 어느 학교 주차장을 몇 시까지 쓸 수 있나'를 찾거나, 구청·분석가가 학교 주차장 공유사업 규모를 파악하는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 등과는 학교명이나 소재지 주소를 매칭해 붙여 써야 한다.
description_portal: '학교주차장 개방 현황은 학교에서 개방 중인 주차장의 위치, 개방 규모, 시간 등을 정리한 자료주차난 해소를 위한 공공자원 공유 사업의 일환으로, 평일·주말 개방시간과 주차 가능면수 등을 포함하며, 교통정책 수립 및 주민 이용 안내에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 학교 부설 주차장 개방 현황 및 위치 확인– 시간대별 주차장 운영 정보 제공– 공영주차 수요 분산 및 지역 주차난 대응– 공공주차 공유사업 성과 분석 및 정책 지원자료 활용주요 항목 설명● 학교명: 주차장을 개방한 학교의 명칭● 소재지: 해당 학교의 주소● 개방면수(면): 개방된 주차 공간 수● 개방개시일: 주차장 개방을 시작한 날짜● 개방시간(평일): 평일 기준 주차장 이용 가능 시간● 개방시간(주말·공휴일): 주말 및 공휴일 기준 이용 가능 시간'
