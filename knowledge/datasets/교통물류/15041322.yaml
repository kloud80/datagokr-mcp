summary_user: 인천교통공사가 운영하는 노선 역사의 물품보관함을 역·위치별로 담은 파일(csv, 약 6.5KB)로, 노선명·역명·지상/지하 구분·역층·상세위치·보관함 크기·시설 수·이용요금을 담는다. 인천 지하철을 이용하는 여행객이나 시민이 '이 역에 짐을 맡길 보관함이 있는지, 몇 층 어디에 있고 크기와 요금은 얼마인지'를 확인할 때 쓴다. 전역 조인 키나 역 코드가 없으므로 다른 역·시설 데이터와는 운영기관명·노선명·역명을 이름으로 맞춰 이어 쓴다.
description_portal: 인천교통공사에서 운영 중인 노선의 물품보관함에 대한 데이터로 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 상세위치, 사이즈, 시설수, 이용요금, 전화번호의 데이터가 있습니다.지하철 물품 보관함은 공공 장소, 특히 지하철 역사 내에 설치된, 개인 짐을 일시적으로 보관할 수 있는 잠금 가능한 수납 공간입니다. 이러한 보관함은 여행객이나 일상에서 무거운 짐을 잠시 맡기고자 할 때 유용하게 사용됩니다. 사용자는 소정의 요금을 지불하고, 짐을 안전하게 보관한 후, 필요할 때 다시 찾아갈 수 있습니다. 특히 서울과 같은 대도시에서는 지하철 물품 보관함이 여행의 편의성을 크게 향상시키며, 관광객들에게는 필수적인 서비스로 자리 잡고 있습니다.
