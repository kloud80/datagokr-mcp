summary_user: 부산광역시 중구 관내에 설치된 불법주정차 무인단속 카메라를 한 대(지점)씩 명칭·주소·위도·경도·데이터기준일자로 담은 개별 위치 목록이며, 파일 크기가 약 2KB(1,986바이트)인 소규모 CSV입니다. 운전자나 상인이 "중구 어느 길에 주정차 단속카메라가 있나"를 확인하거나, 분석가가 단속 지점 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없으므로 좌표(위도·경도)나 주소로 다른 위치 데이터와 공간 결합하고, 단속 건수는 포털 설명에 안내된 같은 구의 '불법 주정차 단속 현황' 자료와 이름·기관 기준으로 나란히 본다.
description_portal: '부산광역시 중구 관내에 설치된 불법주정차 무인단속 카메라 현황자료 입니다. 불법 주정차 무인단속 카메라가 설치된 위치, 주소, 위도, 경도, 데이터기준일자 정보를 포함하고 있습니다.참고링크- 연도별, 월별 불법주정차 단속 건수: 부산광역시 중구_불법 주정차 단속 현황(https://www.data.go.kr/data/15101554/fileData.do)- 부산광역시 중구 영상정보처리기기 운영방침: https://www.bsjunggu.go.kr/index.junggu?menuCd=DOM_000000114002003000이 데이터는 교통행정과에서 관리합니다.'
