summary_user: 서울교통공사 관할 역별로 월마다 수송인원(승차인원과 환승유입인원의 합)을 호선·역번호·역명과 함께 담은 집계 파일이며, 포털에서 활용신청 없이 CSV(약 121KB)로 받는다. 분석가나 사업자가 '특정 역의 이용객이 월별로 어떻게 변했나', '어느 역 주변 유동인구가 많은가'처럼 역 단위 이용 규모와 추세를 볼 때 유동인구 대체 지표로 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 역 데이터와는 역명이나 고유역번호(외부역코드)를 이름·코드 매핑으로 맞추거나 같은 기관(서울교통공사)의 역 코드 체계로만 연결한다.
limits: 월 단위 역별 합계라 시간대별 승하차나 출발지-도착지(OD) 흐름은 알 수 없고, 수송인원에 하차인원은 포함되지 않는다. 1호선은 서울역~청량리, 4호선은 남태령까지, 8호선은 암사역사공원까지만 서울교통공사 구간이며 7호선 까치울~부평구청 구간은 2022년에 인천교통공사로 이관되어, 연도 간 비교 때 구간 차이에 주의해야 한다.
