summary_user: 서울교통공사 관할 1~8호선 역별로 월 단위 우대권(경로·장애인·국가유공자 권종 합산) 승하차 인원을 승차·하차 구분과 6시 이전부터 23시 이후까지 1시간 단위 시간대별로 담은 집계 파일이며, 2020년 1회성 데이터다. 교통 분석가나 복지·상권 담당자가 '노인 등 우대권 이용자가 어느 역에서 몇 시에 많이 타고 내리는가'를 파악하는 데 쓴다. 전역 조인 키는 없어 역명·역번호·호선을 이름 매핑해 같은 기관의 역 정보나 2021년 이후 승객유형별 승하차 데이터와 이어 쓴다.
description_portal: 서울교통공사 역별 월별 시간대별 우대권 승하차 인원 정보입니다. 해당월, 호선, 역번호, 역명, 승하차구분, 승하차인원정보 데이터 입니다. 2020년 1회성 데이터 입니다. 2021년 이후 데이터는 서울교통공사_1_8호선 역별 일별 시간대별 승객유형별 승하차인원(https://www.data.go.kr/data/15099330/fileData.do) 확인하여 주시기 바랍니다. 우대권 승하차인원은 노인(경로), 장애인 권종, 국가유공자 권종이 합쳐진 승하차인원을 의미합니다. 호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다.마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
