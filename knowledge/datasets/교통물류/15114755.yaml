summary_user: 부산광역시 동래구 관내에 등록된 화물자동차 운송사업업체를 업체별 한 행으로 담은 CSV 파일(약 3KB)로, 업체명·업체주소·업종·운영여부를 담는다. 동래구에서 이사·용달 등 화물운송 업체를 찾는 주민이나, 관내 운송업체가 어디에 얼마나 있고 지금 운영 중인지 확인하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소로 맞춰 이어야 하며, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터이므로 그것과 대조하는 보조 자료로 쓴다.
