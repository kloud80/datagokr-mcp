summary_user: '안산시 노변 기지국(RSE) 출발지–도착지 구간별로 기준시간 단위 통과차량수·추정통과차량수와 최소·평균·최대 통행시간(초)을 집계한 월별 통행정보 파일(CSV 약 4.5MB)이다. 교통 분석가나 시 교통 담당자가 "안산 시내 어느 RSE 구간이 어느 시간대에 통행시간이 길어지는가"처럼 구간별 상습 정체와 교통 패턴을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 RSE 아이디(예: DS0002000)를 같은 기관의 RSE 위치·구간 정보와 이름·코드로 맞춰야만 이어 쓸 수 있다.'
description_portal: 이 데이터는 특정 '기준시간' 동안 RSE(노변 기지국) 구간별로 수집된 교통 흐름 분석 자료입니다. '출발지 RSE 아이디'에서 '도착지 RSE 아이디'까지 이동한 차량의 '통과차량수'와 '추정통과차량수'를 집계합니다. 또한, 해당 구간을 통과하는 데 걸린 '최소통행시간', '평균통행시간', '최대통행시간'을 초 단위로 상세히 기록하고 있습니다. 예를 들어, 'DS0002000'에서 'DS0004000'로 이동한 데이터와 같이 각 경로별 통행 특성을 파악할 수 있습니다. 이 자료는 구간별 이동 시간을 분석하고, 교통 패턴을 파악하며, 도로 소통 상태를 평가하는 데 핵심적인 기초 데이터로 활용됩니다.
