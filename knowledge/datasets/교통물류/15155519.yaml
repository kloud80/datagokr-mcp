summary_user: 나주시 시내버스의 승차·하차 인원을 날짜, 노선, 정류소, 운행시간대별로 담은 월간 집계 파일이며, 포털에서 활용신청 없이 CSV(약 9.8MB)로 받는다. 시민이나 교통 분석가가 '나주시에서 어느 노선·정류소가 어느 시간대에 승객이 가장 많은가'를 알아보거나, 배차·노선 조정 근거를 찾을 때 쓴다. 전국 공통 조인 키는 없어서 노선ID·정류소ID나 노선명·정류소명을 나주시 버스정보시스템의 노선·정류장 정보와 이름 또는 코드로 맞춰 이어 써야 한다.
description_portal: 전라남도 나주시 시내버스 노선별 승하차 정보 데이터는 나주시 시내버스 승차 및 하차에 대한 데이터입니다.  해당 정보는 승하차 날짜, 승하차 노선ID, 승하차 노선명, 승하차 정류소ID, 승하차 정류소명, 승하차 운행시간대, 승차인원, 하차인원 등의  정보를 제공합니다.  나주시 시내버스 승하차 정보를 월간으로 제공합니다. 승하차 정보는 나주시 버스정보시스템과  버스정보안내기 등 버스 정보에 대한 기본적인 데이터를 제공하며, 이를 통해 신속하고 정확한 대중교통(시내 버스)정보를 제공할 수 있어 시민들의 교통 편의 증진에 기여합니다. 본 정보의 수집기간은 매월 1일부터 말일까지이며 노선, 정류소, 운행시간대에 따른 승차인원과 하차인원에 대한 정보를 제공합니다.
