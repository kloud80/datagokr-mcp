description_portal: 본 데이터는 고속도로 영업소별 하이패스 이용 현황을 제공하는 자료이다. 한국도로공사에서 수집한 정보를 기반으로 하여 각 영업소의 명칭, 하이패스 이용비율, 운영형태 등을 포함하고 있다. 본 자료를 통해 고속도로 통행 시 하이패스를 이용하는 비율을 영업소별로 비교·분석할 수 있으며, 하이패스 시스템의 효율성 및 보급 현황을 파악할 수 있다. 특히 하이패스 이용률이 높은 지역을 중심으로 비접촉 통행환경 확대나 운영정책 수립에 필요한 기초자료로 활용된다. 또한 교통 혼잡 완화, 요금징수 효율화, 통행 시간 단축 등 다양한 분야에서 참고자료로 활용 가능하며, 향후 스마트톨링 기반 마련과 하이패스 인프라 확충 참고자료도 활용 가능하다.
