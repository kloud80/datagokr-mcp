summary_user: 대전도시철도 1호선 역사에 설치된 공중화장실을 한 곳씩 담은 건별 데이터로, 명칭·도로명/지번 주소·위도·경도·관리기관과 남녀별 대변기·소변기·어린이용·장애인용 설비 수, 남녀 공용 여부를 포함한다. 지하철 이용객이나 안내 앱 개발자가 '이 역 화장실에 장애인용·어린이용 변기가 있는가', '가까운 역 화장실은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역·화장실 명칭이나 주소·좌표로 맞춰 이어 쓴다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사에 설치된 공중화장실의 상세 정보를 제공하는 데이터입니다.공중화장실 명칭, 도로명주소, 지번주소, 위도·경도, 관리기관명, 관리기관 전화번호, 화장실 유형 구분, 남녀 공용 여부, 남자화장실 내 대변기·소변기·어린이용·장애인용 수, 여성용 화장실 내 대변기·어린이용·장애인용 수 등 항목별 상세 정보를 포함하고 있습니다.본 데이터를 활용하면 역사별 화장실 시설 현황을 정확히 파악할 수 있으며, 공중화장실 위치 기반 안내 앱 등 다양한 분야에서 활용이 가능합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
team:
  dept: 디지털정보팀
