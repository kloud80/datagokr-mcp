summary_user: 경찰청이 제공하는 교통안전 위험요소 정보 가운데 도로환경이 낙석도로인 지점을 전국 범위로 담으며, 지점마다 지번·도로명 주소, 경위도, 위험요소 분류 코드, 기준일자, 상세 내용, 사진 정보 유무를 갖는 것으로 보인다. 운전자나 지자체·도로 안전 분석가가 '우리 지역이나 통행 경로에 낙석 위험 도로가 어디에 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 주소나 경위도로 다른 도로 시설물·사고 데이터와 위치를 맞추거나 같은 기관의 다른 위험요소 데이터와 분류 코드로 묶어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다.
