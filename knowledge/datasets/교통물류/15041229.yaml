summary_user: 수도권 6호선 역사별 장애인 화장실의 위치를 역명·지상구분·역층·게이트 안팎·가까운 출구번호·상세위치 단위로 담은 건별 시설 목록 파일(CSV 약 6.7KB)이다. 휠체어 사용자나 보호자가 '6호선 특정 역에서 개찰구 안쪽에 장애인 화장실이 있고 몇 층에 있는가'를 확인하거나, 분석가가 노선 내 역별 장애인 화장실 배치 현황을 점검할 때 쓴다. 전역 조인 키는 없어서, 다른 역 시설·승하차 데이터와는 역명과 선명을 이름으로 맞춰 이어 쓴다.
