description_portal: 공항기상관측시스템(AMOS, Aerodrome Meteorological Observation System)은 활주로에 설치된 다양한 기상관측 장비 센서를 통해 기온, 기압, 풍향·풍속, 시정, 강수량 등의 실시간 기상정보를 수집합니다.수집된 자료는 1초, 10초, 1분 단위로 세분화하여 처리되며, 이를 기반으로 항공기 이착륙 및 공항 운영에 필요한 정밀한 기상정보를 신속하게 제공합니다.AMOS는 항공 안전을 위한 핵심 기반 시스템으로, 자동화된 관측을 통해 기상 변화에 대한 빠른 대응을 가능하게 합니다.
