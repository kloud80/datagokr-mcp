summary_user: 서울시내 지하철역 출입구에 설치된 휠체어 리프트의 위치를 리프트 지점(노드) 단위로 담으며, 각 지점마다 공간 좌표(NODE_WKT)와 소속 자치구·읍면동, 지하철역 코드·역명이 붙는 건별 위치 자료다. 휠체어 이용자나 교통약자 이동 지원 서비스 개발자가 '이 역의 어느 출입구에 리프트가 있는가'를 확인하거나 무장애 경로 안내를 만들 때 쓴다. 전역 조인 키는 없어 역 코드(SBWY_STN_CD)·역명이나 자치구·읍면동 코드·이름을 매핑해 지하철역 승강기·출입구 자료나 행정구역 자료와 잇는다.
limits: data.seoul.go.kr 별도 인증키가 필요하며 공공데이터포털 활용신청과는 별개다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 역 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
