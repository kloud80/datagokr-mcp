summary_user: 한국교통안전공단이 시행한 기계식주차장 보수원 안전교육의 교육장소를 장소별로 담은 작은 파일(csv, 912 bytes)로, 장소 일련번호·장소명·주소가 들어 있으며 2025년 9월 12일까지 시행분이 대상이다. 기계식주차장치 보수업체에 근무하는 보수원이나 업체 담당자가 '의무 안전교육을 어디서 받았거나 받을 수 있나'를 확인할 때 쓴다. 전역 조인 키가 없어, 날짜별 교육 장소는 같은 공단의 '기계식주차장 보수원 안전교육 일정' 데이터와 장소명으로 맞춰 확인한다.
description_portal: 한국교통안전공단에서 시행하는 기계식주차장 보수원 안전교육의 시행장소에 대한 정보를 제공합니다. 보수원 안전교육은 기계식주차장치 보수업체로 신고된 사업체에서 근무하는 보수원이 의무적으로 수료해야 하는 교육입니다. 보수원 안전교육은 2024년 주차장법 개정으로 최초 시행되었으며, 해당 정보는 2025년 9월 12일 까지 한국교통안전공단에서 시행한 보수원 안전교육의 장소를 제공합니다. 데이터는 날짜별로 정리되어 있지 않으며, 날짜별로 교육 시행 장소을 확인하기 위해서는 한국교통안전공단에서 제공하는 "기계식주차장 보수원 안전교육 일정" 데이터와 복합적으로 확인하셔야 합니다.
