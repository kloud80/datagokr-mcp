summary_user: 청주시 주요 교차로에 설치된 수집 카메라가 기록한 진입 차량 정보를 수집 시간·교차로·카메라 방향·차선·이동류(직진·좌회전 등) 단위로 담은 건별 기록 파일로, 대기 길이(m)·점유율·차종별 통과 대수(소형·버스·트럭·트레일러·오토바이)를 포함하며 CSV 한 파일이 약 192MB입니다. 교통 분석가나 시 교통 담당자가 '어느 교차로·어느 방향 차선에서 대기 길이가 길고 대형차 비중이 높은가'처럼 상습 정체 지점과 차종 구성을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교차로명을 이름으로 맞추거나 같은 청주시 기관 데이터끼리만 이어 쓴다.
limits: 교차로 표준 코드나 좌표 같은 공통 키가 없어 전국 교차로·도로 링크 데이터와 바로 붙이기 어렵고 이름 매핑이 필요하다. 범위는 청주시 한 곳이며 파일 형태라 실시간 조회보다는 이력을 쌓아 정체 패턴을 보는 원장으로 쓰는 편이 맞다.
