summary_user: 제주시 제주종합터미널과 서귀포시외버스터미널 두 곳의 연도별 이용객 수를 담은 집계 파일로, 포털 설명상 2013년부터의 값이 연도 한 행에 터미널별 열로 들어 있습니다(csv 582바이트 규모). 제주 시외버스 터미널 이용객이 해마다 어떻게 늘고 줄었는지, 두 터미널 간 이용 규모 차이가 어떤지 보려는 분석가·교통 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 터미널 이름을 손으로 맞춰 제주 관광객·버스 노선 통계 등과 나란히 놓는 식으로만 이어 쓴다.
description_portal: '제주특별자치도 내에 소재하고 있는 제주시 / 서귀포시 버스터미널 현황 데이터를 제공합니다.항목: 2013년도부터 연도별 이용객 수*여객자동차터미널: 「여객자동차 운수사업법」에 따라 승합자동차를 정류(停留)시키거나 여객을 승하차(乘下車)시키기 위하여 설치된 시설과 장소- 제주버스터미널: 13개 승차 홈 / 25개 노선 운영- 서귀포버스터미널: 5개 승차 홈 / 5개 노선 운영 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1498850'
