description_portal: '철도산업관련 입찰정보를 제공합니다.조달청 나라장터, 국가철도공단 전자조달시스템, 한국철도공사 전자조달시스템에서 철도산업관련 입찰정보를 수집하여 제공합니다.데이터는 입찰종료일이 2024년1월 이후인 구매/용역/공사 입찰정보를 제공합니다.입찰공고 수요기관은 철도관련 공공기관인 주식회사 SR, 공항철도, 광주교통공사, 국가철도공단, 국토교통부, 김포라인골드 주식회사, 남서울경전철, 대구교통공사, 대전교통공사, 부산교통공사,부산김해경전철,서울교통공사,서울메트로9호선,서해철도주식회사,우이신설도시철도,인천교통공사,한국철도공사,한국철도기술연구원의 입찰공고를 제공합니다.(제공정보: 순번, 입찰공고번호, 입찰공고명, 기관명, 입찰방법, 금액, 입찰시작일, 입찰종료일,개찰일, 개찰장소, 입찰공고내용)'
