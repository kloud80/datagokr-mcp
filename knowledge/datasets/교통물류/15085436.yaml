description_portal: 본 데이터는 서울특별시 은평구의 연도별 자동차 등록 현황을 차량 용도(사업용·비사업용)와 차종별(승용·승합·화물·특수)로 구분하여 제공한 자료입니다.은평구에 등록된 자동차 수를 연도별로 확인할 수 있습니다.사업용과 비사업용 차량의 등록 규모와 변화 추이를 비교할 수 있습니다.승용차, 승합차, 화물차, 특수차 등 차종별 등록 현황을 파악할 수 있습니다.지역 내 자동차 보유 규모 변화와 교통·주차·환경 정책 수립을 위한 기초자료로 활용할 수 있습니다.연구기관, 기업, 주민 등이 차량 증가 추세 및 교통 관련 현황을 분석하는 데 활용 가능한 공공데이터입니다.
