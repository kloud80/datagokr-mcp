description_portal: 해당 데이터는 의왕시 관내 도로 및 보행 공간에 설치된 보안등 현황을 담고 있는 공간정보 자료입니다. 공간지리식별번호, 지형지물부호, 도로구간번호 등 위치 기반 정보와 함께 보안등의 모형, 높이, 형식, 재질, 광원 종류, 위도 및 경도 정보를 포함하고 있어 야간 보행 환경을 다각도로 분석할 수 있는 기초 자료입니다. 이 데이터는 보행안전지수 지도 시각화를 위한 중간 데이터로 사용되며, 보안등이 설치된 구역의 조명 상태를 파악함으로써 야간 보행자의 안전 확보와 범죄 예방, 교통사고 감소에 기여합니다. 본 자료는 2022년 기준 자료로, 최신 정보와 차이가 있을 수 있으므로 참고용으로 활용하는 것이 적절합니다.
