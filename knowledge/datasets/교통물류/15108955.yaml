summary_user: 의왕시 관내 도로·보행 공간에 설치된 보안등을 한 개씩 담은 건별 공간정보 파일로, 위치(소재지·위도·경도)와 등주 높이·형식·재질, 광원 종류·용량, 설치일자 같은 시설 속성을 담는다. 야간 보행 환경을 분석하는 분석가나 시민이 '우리 동네 어느 골목에 보안등이 부족한가'를 지도에서 확인하는 데 쓰며, 보행안전지수 지도 시각화의 중간 자료로 쓰인다. 전역 조인 키가 없어 다른 데이터와는 좌표 기반 공간 결합이나 행정동읍면코드·도로구간번호 같은 이름·코드 매핑으로만 이어 쓴다.
limits: 포털 설명상 2022년 기준 자료라 현재 설치 현황과 다를 수 있다. 범위가 의왕시 한 곳에 한정되며, 공통 조인 키가 없어 다른 시군구 보안등·가로등 자료와 바로 합치기 어렵다.
