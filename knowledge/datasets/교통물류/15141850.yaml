summary_user: 대구광역시 수성구 관내 주차장을 주차장 한 곳 단위로 담는다. 주차장 종류(공용노상·공용노외·부설), 주소와 좌표, 요일별 운영시간, 기본·추가 요금, 총 면수와 장애인·임산부·경차·전기차용 면수가 포함된다. 운전자가 "수성구에서 가까운 주차장의 요금과 운영시간, 장애인·전기차 전용 면이 있는지"를 확인하거나, 분석가가 구내 주차 공급과 교통약자 면 배치를 살피는 데 쓴다. 실측 컬럼에는 다른 데이터와 맞물리는 전역 조인 키가 없다. 다른 데이터와는 주차장 이름이나 주소·좌표로 매칭하거나 같은 기관 코드로만 연결하며, 원장 성격의 전국주차장정보표준데이터와 대조할 때도 같은 방식으로 맞춘다.
description_portal: 본 데이터는 대구광역시 수성구 관내에서 제공되는 공영 및 민영 주차장 정보 조회 서비스에 관련된 현황을 체계적으로 정리한 자료로, 주차장명, 주차장 유형(공영·민영·복합 등), 도로명 주소 및 위도·경도, 총 주차면 수, 장애인·노약자·전기차 전용 면 수, 이용 요금(시·분 단위), 운영 시간, 운영 주체(구청·개인 사업자 등), 실시간 이용 가능 여부, 데이터 기준일자 등의 항목을 포함한다. 본 자료는 주민과 차량 이용자가 근거리 주차장 위치, 요금, 빈자리 여부 등을 한눈에 확인할 수 있도록 구성되어 있으며, 주차 편의성 향상, 교통 혼잡 완화, 모바일·웹 기반 안내 서비스 제공, 민원 대응 등에 활용 가능하다. 또한 장애인·전기차 전용 면 정보는 교통복지 정책, 환경 친화적 인프라 평가, 공공자원 배분 효율화 등에 기초자료로 유용하며, 수성구청은 이용 실적 및 운영 변경 시 데이터를 정기적으로 갱신하여 최신 정보를 반영하고 있다. 해당 데이터는 도시교통 부서, 스마트시티 기획자, 교통 연구기관, 일반 주민·운전자 등의 주차 정책 수립과 교통 서비스 개선을 위한 핵심 기반자료로 폭넓게 활용될 수 있습니다.
