summary_user: 대구도시철도 1호선 역사별 화장실 위치를 화장실 한 곳당 한 행으로 담은 CSV 파일(약 5KB)로, 역명·지상구분·역층·개찰구 안팎 여부(게이트내외)·출구번호·상세위치·화장실 구분을 기록한다. 대구 지하철 이용자가 "내릴 역의 화장실이 개찰구 안에 있는지, 몇 번 출구 쪽인지"를 미리 확인하거나, 교통약자 안내 서비스에서 역별 화장실 위치를 보여주는 데 쓴다. 전역 조인 키가 없으므로 다른 역 데이터와는 역명·선명 같은 이름을 맞추거나 같은 기관(국가철도공단) 다른 노선 화장실 파일과 같은 컬럼 구조로 묶어 쓴다.
description_portal: 대구도시철도공사에서 운영하는 1호선의 역사별 화장실 위치에 대한 데이터로 철도운영기관명, 선명, 역명, 화장실의 역층, 게이트내외, 출구번호, 상세위치 데이터가 있습니다.개찰구 안의 운임 구역(fare zone)에 공중화장실이 있는 지하철역 목록. 화장실이 개찰구 내부에 있는지 외부에 있는지는 역마다 다르므로, 자신이 가려는 역을 잘 확인해야 한다. 심지어 환승역은 노선마다 화장실의 위치가 다를 수 있으니 주의해야 한다.개찰구 안에 화장실이 있는 역 중에서 개찰구 바깥에는 화장실이 없다면, 역내 화장실을 쓰려면 이용료를 내고 개찰구를 통과해야 한다. 즉, 실제로 지하철을 이용하지 않는다면 유료 화장실이 되는 셈이다.2023년 10월 7일부터 서울교통공사 구간에 한해 교통카드 소지자는 하차 후 동일 역 동일 노선 게이트에서 15분 이내에 재승차 시 1회에 한해 재승차 환승 할인이 적용된다. GTX-A는 10분 이내로 재승차 환승 할인이 적용된다. 이를 이용해 나갔다 오면된다.참고로, 수도권 전철은 노선도에 개찰구 안에서 화장실 있는 역을 표시해 준다.
