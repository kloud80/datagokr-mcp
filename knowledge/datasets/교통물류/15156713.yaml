summary_user: 울산항 부두운영 시설을 부두·시설 단위로 담은 위치기반 API로, 길이·수심·접안수용력·하역능력·취급화물·운영사와 위경도를 함께 제공한다. 항만 이용자나 물류 담당자가 특정 부두의 수심과 하역능력이 어느 정도인지, 어디에 있는지 확인하는 데 쓴다. 위도(lat)·경도 좌표를 키로 다른 위치 데이터와 이어 쓰고, 항만코드는 UN/LOCODE와 해수부 내부 코드가 섞여 있어 매핑표를 거쳐 입출항·물류 데이터와 잇는다.
description_portal: '본 데이터는 위치기반 울산항 부두운영 시설정보를 국가중점데이터로 개방하여, 항만 이용자들의 편의성 제고 및 운영 투명성을 강화하고자 합니다. 해당 데이터를 통해 울산항 내 부두운영 시설정보를 확인하실 수 있습니다. - 항만청코드, 항구명, 부두명, 시설코드, 길이, 수심, 위도, 경도 등으로 구성 - 업데이트 주기: 월간 - 데이터 유형: 오픈API'
