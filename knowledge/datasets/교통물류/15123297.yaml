summary_user: 경기도 도로대장 전산화 시스템에서 뽑은 접도구역 지정 정보를 노선번호·구간번호 단위로 한 행씩 담는다. 각 행에는 시점·종점 위치, 지정 연장, 지정일자, 좌우측 표주 현황, 시종점 좌표, 상·하행이나 도시계획구역 같은 비고가 들어 있다. 토지를 사거나 건축을 계획하는 사람이 대상지가 도로변 접도구역에 걸려 개발 제한을 받는지 확인할 때 쓰고, 도시계획 담당자가 규제 구간의 범위를 파악할 때도 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 도로대장 데이터와는 노선번호·구간번호 같은 이름이나 코드를 맞춰 붙이거나 시종점 좌표로 공간 매칭해 잇는다.
description_portal: 이 데이터는 도로대장전산화시스템을 기반으로 작성된 접도구역에 관한 정보로, 접도구역은 도로의 구조 및 기능을 보호하기 위해 도로 양측 일정 구간에 대해 제한을 두는 지역을 의미합니다. 데이터에는 노선번호, 구간번호, 위치(시점 및 종점), 접도구역 지정 연장(길이), 지정일자, 좌우측 표주(표지주) 현황, 공간좌표 등의 항목이 포함되어 있습니다. '비고' 항목에는 상행, 하행 또는 도시계획구역 등의 추가 정보가 표기되어 있으며, 도로 개발 및 유지관리, 법적 구역 설정, 도시계획 수립 시 활용할 수 있는 기초 자료입니다. 특히 지정된 접도구역의 범위를 공간적으로 파악하고 규제구역 내 개발 제한 분석 등에 활용도가 높습니다.
