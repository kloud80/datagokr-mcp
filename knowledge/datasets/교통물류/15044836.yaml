summary_user: 창원시 관내 화물운송 주선업체(이사업체)를 업체 한 곳당 한 행으로 담은 파일로, 관할 구청, 상호, 주사무소 도로명·지번 주소, 화물 종류와 사업 종류가 들어 있습니다(약 10KB 규모 CSV). 창원에 사는 시민이 이사를 앞두고 "우리 구에 있는 이사화물 주선업체는 어디인가"를 찾을 때 쓰고, 분석가는 구청별 주선업체 분포를 볼 때 씁니다. 전역 조인 키는 없어서 주소나 업체명을 기준으로 전국화물자동차운송사업자표준데이터 같은 허가 원장과 맞춰 보는 식으로만 이어 쓸 수 있습니다.
description_portal: '창원시 관내 구청별 화물운송 주선업체(이사업체) 현황자료는 경상남도 창원시 교통정책과에서 관리하며, 공공데이터포털을 통해 제공되고 있습니다. 이 자료는 창원시의 화물운송 주선업체에 대한 정보를 포함하고 있으며, 특히 이사화물업체를 찾는 분들에게 유용합니다.제공되는 정보 항목관할 구청: 업체가 속한 구청 정보업체명: 화물운송 주선업체의 상호명도로명주소 및 지번주소: 업체의 위치를 확인할 수 있는 주소 정보사업의 종류: 업체가 수행하는 주요 업무 분야자료는 2025년 5월 22일 기준으로 최신화되어 있으며, 연간 업데이트가 예정되어 있습니다. 따라서 최신 정보를 확인하려면 해당 시점을 기준으로 자료를 다운로드하는 것이 좋습니다'
