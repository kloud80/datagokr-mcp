description_portal: 탄소중립 정책 추진과 친환경 교통수단 확산으로 전기자동차 보급이 급속히 증가하고, 대기환경 개선 및 온실가스 감축을 위한 전기차 활성화 정책이 국가적 과제로 대두되며, 전기차 충전 인프라 구축 및 지원 정책 수립을 위한 정확한 현황 파악 필요성이 증대되고, 지역별 친환경 자동차 보급 현황 분석과 교통정책 효과 측정을 위한 체계적인 통계 관리 요구가 높아짐에 따라 충청남도 보령시는 관내 읍면동별 전기자동차 등록 현황을 승용 전기, 승용 저속전기, 승용겸 화물 저속전기, 승용겸 화물 전기 등 차종별로 구분하여 연간 주기로 종합적인 통계 정보를 제공하고 있습니다.전기차 관련 업체·충전사업자는 지역별 전기차 보급 현황 분석을 통해 충전소 설치 계획 및 사업 전략 수립에 활용하고, 연구기관·학계는 친환경 교통정책 효과 분석 및 전기차 보급 확산 연구에 활용하며, 지방자치단체·교통정책기관은 친환경 교통정책 수립 및 전기차 지원 사업 계획 수립, 충전 인프라 구축 계획 마련에 활용할 수 있습니다.
