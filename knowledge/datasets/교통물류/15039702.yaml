summary_user: 보령시 관내 읍면동별 전기자동차 등록 대수를 관용·자가용·영업용과 승용·승합·화물·특수로 나눈 집계표로, 데이터기준일이 함께 붙은 1kB 남짓의 작은 CSV 파일이다. 충전사업자나 지자체 담당자가 보령시 어느 읍면동에 전기차가 많이 등록돼 있어 충전소를 우선 설치할지 판단하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·읍면동명 같은 이름을 맞춰 충전소 위치나 인구 통계 등과 연결해야 한다.
