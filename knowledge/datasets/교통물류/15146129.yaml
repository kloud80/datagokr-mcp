summary_user: 서울특별시 주택 인허가 대상 대지별로 주차장 현황을 담은 자료로, 행마다 대지위치·자치구·법정동·지번(본번·부번)과 함께 실내·실외 자주식·기계식 주차대수와 면적, 부근 주차장, 면제 주차대수를 기록한다. 주택 개발·재개발 부지를 검토하는 사업자나 분석가가 "이 자치구 주택 인허가 부지는 기계식·부근 주차장에 얼마나 의존하는가" 같은 주차 수급 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치구명·법정동명·지번을 이름 매핑해 건축물대장이나 전국주차장정보표준데이터 같은 다른 자료와 맞춰야 한다.
description_portal: 이 데이터는 서울특별시 내 주택 인허가와 관련된 주차장 현황을 나타내는 자료입니다. 각 행은 특정 토지(대지)에 대해 주차장 위치, 토지의 행정구역(자치구명, 법정동명), 지번(본번·부번)과 함께 주차장 세부 현황을 제공합니다. 주차장은 실내와 실외로 구분되며, 각각 설치 대수와 면적이 기록됩니다. 또한 기계식 주차장, 부근 주차장, 면제 주차대수 등 주차 유형별 세부 사항이 포함되어 있어 해당 부지의 주차 수용 능력과 형태를 분석할 수 있습니다. 이 자료는 도시 계획, 교통 정책 수립, 주차 수급 분석, 건축물 인허가 심사, 생활 편의시설 확보 등 다양한 분야에서 활용 가능하며, 주택 개발이나 재개발 시 필수 참고 자료로 쓰입니다.
