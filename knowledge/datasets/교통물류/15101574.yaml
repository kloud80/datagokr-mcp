description_portal: '부산광역시 동구 관내  불법주정차 월별 단속건수를  통계 형식으로 기록한 공공데이터입니다. 이 데이터에는 단속 월, 단속 건수 항목이 포함되어 있습니다. 주차단속반이 직접 현장에서 단속하는 인력단속건수, 안전신문고 신고건수, CCTV를 통한 단속건수를 합산한 자료이며, 2011년부터 매월 업데이트 중입니다. 일반적으로 CCTV 단속건수가 가장 많고 그 다음으로 안전신문고 신고건수가 많으며, 주차단속반 인력단속은 과태료 부과보다는 계도를 통한 민원 처리가 주된 목적이기 때문에 단속건수가 가장 적습니다. 매년 2개소 이상 주차단속 CCTV를 신규 설치하고 있고 안전신문고를 통한 신고건수도 매년 증가하고 있어, 전체적인 불법주차 단속건수가 증가 추세에 있습니다.(부산광역시 동구 CCTV 설치 현황 : 부산역 광장호텔 등 54개소, 안전신문고 신고 가능 구간 : 교차로모퉁이 등 6대 불법주정차 금지구역)'
