summary_user: 부산광역시 동구 관내 불법 주정차 단속건수를 월 단위로 집계한 통계로, 주차단속반 인력단속·안전신문고 신고·CCTV 단속을 합산한 건수를 단속월별로 담는다. 동구 주민이나 분석가가 동구의 불법주차 단속이 해마다 늘었는지, 어느 달에 단속이 몰리는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속월(연월)로 맞추거나 같은 동구 자료와 이름으로만 이어 쓴다.
