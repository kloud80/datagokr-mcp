description_portal: 개인형이동장치는 도로교통법 제2조 19의2 상 원동기장치자전거 중 시속 25킬로미터 이상으로 운행할 경우 전동기가 작동하지 아니하고 차체 중량이 30킬로그램 미만인 것을 의미합니다. 도내 개인형 이동장치 운영 시군은 총 11개 시군으로, 춘천, 원주, 강릉, 동해, 태백, 속초, 삼척, 홍천, 횡성, 양구, 양양이 있습니다. 도내 공유업체는 4개(지쿠, 더스윙, 디어, 씽씽이)이며, 시군별 총 4,147대 운영하고 있습니다. 업체별 운영개시일은 현재 정보를 미보유 하고 있으며, 자세한 데이터는 파일을 참고하여 주시기 바랍니다.
