summary_user: 'SRT 열차번호별로 각 역(수서·동탄·부산·목포·여수EXPO 등 33개 역 열)의 인원을 집계한 연간 파일로, 경부·호남·경전·동해·전라선을 포함하며 제목은 승차인원이지만 포털 설명은 하차인원으로 적고 있습니다. 철도 분석가나 지자체가 어느 SRT 열차가 특정 역(예: 2023년 추가된 포항·진주·순천)에서 이용객이 많은지 비교하는 데 쓴다. 전역 조인 키가 없어 역 이름(열 이름)을 다른 철도 역 목록이나 승하차 데이터의 역명과 맞춰 이어 쓴다.'
description_portal: 1. 고속열차 SRT 열차별 역별 하차인원 수에 따른 공공데이터입니다.2. 해당 데이터는 SRT가 운행중인 경부선, 호남선, 경전선, 동해선, 전라선 모두 포함되어 있습니다.3. SRT는 2016년도 12월 9일부터 지속적으로 운행을 시작하였습니다.4. 2023년 운행노선 확대에 따라 밀양, 진영, 창원, 중앙, 창원, 마산, 진주, 포항, 전주, 남원, 곡성, 구례구, 순천, 여천, 여수EXPO역의 데이터가 추가되었습니다.* 해당데이터는 연간 주기성 데이터입니다.* 열차번호별로 각 역별 하차데이터를 확인하실 수 있습니다.* 에스알은 해당 데이터를 무료로 제공드리고 있습니다.* 데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다.
