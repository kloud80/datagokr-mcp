summary_user: 서울시 교통정보 시스템(TOPIS)의 소통·돌발 교통 정보에서 쓰는 권역 목록(권역코드, 권역명)을 OpenAPI로 내려주는 데이터다. 서울 교통 정보를 권역 단위로 조회하려는 분석가나 앱 개발자가 어떤 권역이 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 소통·돌발 정보와는 권역코드나 권역명을 이름·코드 매핑해 잇는다.
limits: 포털 활용신청과 별개로 data.seoul.go.kr에서 인증키(path 파라미터 KEY)를 따로 발급받아야 호출된다. 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있다.
