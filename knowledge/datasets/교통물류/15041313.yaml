summary_user: 부산 도시철도 2호선 역사에 설치된 물품보관함을 역·위치별로 담은 파일로, 운영기관명·선명·역명·지상지하 구분·역층·상세위치·보관함 크기·시설 수·이용요금을 한 행씩 기록한다(csv 약 5.6KB 규모). 부산 2호선을 이용하는 여행객이나 시민이 "어느 역 몇 층에 어떤 크기의 보관함이 있고 요금은 얼마인가"를 확인하거나, 분석가가 역별 보관함 설치 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키(역 코드 등)가 없어 다른 역·시설 데이터와는 선명·역명 같은 이름 매칭으로만 연결한다.
