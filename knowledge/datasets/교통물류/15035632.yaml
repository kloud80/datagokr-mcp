description_portal: 이 데이터는 광주광역시 서구에 연도별로 등록된 자동차의 현황을 차량 종류(승용, 승합, 화물, 특수)와 용도(관용, 자가용, 영업용)별로 구분하여 제공하는 통계 자료입니다. 각 항목은 해당 차량이 정부 및 공공기관 소속인지(관용), 개인 소유로 가정이나 개인 목적에 사용하는지(자가용), 또는 영업을 위한 등록인지(영업용) 여부에 따라 세분화되어 있으며, 수치 정보는 수량 기준으로 제공됩니다.이 데이터를 통해 지역 내 전체 자동차 등록 규모와 함께 용도별 차량 구성 비율, 특정 차종의 증가 추이 등을 파악할 수 있습니다. 이는 대기오염 및 온실가스 배출 관련 환경 정책 수립, 자가용 증가에 따른 주차 수요 분석, 관용차 운영 효율성 진단, 영업용 차량을 통한 지역 상업 활동 추적 등 다양한 행정적‧산업적 분석에 활용 가능합니다.또한 차량 종류별 공급 현황을 기반으로 지역 교통인프라 개선, 대중교통 정책 수립, 도로계획 및 혼잡도 대응 전략 마련, 차량 감축 유도 정책 기획 등의 의사결정에 기초자료로 제공될 수 있습니다. 특히 기후위기 대응 및 지속가능교통체계 구축을 위한 기초 통계자료로서도 유용하게 사용됩니다.
