summary_user: 부산 도시철도 2호선 각 역의 역번호를 역 하나당 한 행으로 담은 파일로, 운영기관명·선명·역명과 함께 영어·로마자·일본어·중국어(간체·번체) 역명, 환승역 여부, 유실물 취급 여부, 신설일자를 포함한다. 외국어 역 안내 자료를 만드는 관광·안내 서비스 사업자나 '부산2호선 ○○역의 역번호와 외국어 표기가 무엇인가'를 확인하려는 개발자가 쓴다. 실측 컬럼에 전역 공통 조인 키가 없어 다른 철도·역 데이터와는 역명·선명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
limits: 역 좌표·출입구 정보는 필드에 없어 이 파일만으로 역세권 판정이나 위치 분석은 하지 못한다. 공통 역 코드가 없으므로 다른 데이터와 붙일 때 역명 표기 차이에 주의해야 한다.
