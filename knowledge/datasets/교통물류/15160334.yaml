description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 투명행정 및 신뢰경영 운영정보 데이터로, 기관에서 발간 및 등록한 간행물의 등록번호, 자료명, 자료형태, 등록일(제작시기), 관련부서 등의 현황을 제공한다. 이를 통해 기관의 경영계획, 예산 및 결산, 업무현황, 경영혁신, 안전관리, 교육훈련, 환경관리 등 주요 정책과 업무 수행 과정에서 생산된 간행물 정보를 체계적으로 확인할 수 있으며, 행정의 투명성 제고와 정보공개 확대에 기여한다. 또한 공공기록의 관리 현황을 국민이 쉽게 파악할 수 있도록 지원하여 알 권리를 보장하고, 공공데이터의 민간 활용 촉진, 학술 연구 및 정책 분석, 나아가 기관 운영의 책임성과 대외적 신뢰성을 투명하게 강화하는 데 적극적으로 활용할 수 있는 고가치 데이터이다.'
