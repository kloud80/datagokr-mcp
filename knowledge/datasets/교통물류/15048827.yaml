summary_user: 서울 강남구의 불법 주정차 단속 실적을 연도·동(읍면동) 단위로 집계한 파일로, 부과건수·견인건수·단속원금(부과된 과태료 총액)을 담는다. 구민이나 분석가가 "강남구에서 어느 동이 불법 주정차 단속과 견인이 가장 많고, 연도별로 늘었는가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 동 이름을 행정동 코드에 맞춰 연결하거나, 같은 강남구 자료끼리 연도·동명으로 이어 쓴다.
description_portal: 서울특별시 강남구의 불법 주정차 단속 현황(년도, 동, 견인건수, 단속원금, 데이터기준일자)동별 정보는 특정 지역에서 불법 주정차 문제가 어느 정도로 빈번하게 발생하는지에 대한 지역별 현황 파악에 활용됩니다.단속원금” 항목은 해당 기간 동안 적발된 불법 주정차 위반에 대해 부과된 총 과태료 금액을 나타냅니다. 이 원금은 행정처분 규모를 보여주는 지표로 활용가능합니다.해당 자료는 강남구 내 불법 주정차 단속의 전반적인 경향과 지역별·연도별 현황을 종합적으로 파악할 수 있도록 다양한 항목들로 구성되어 있습니다.
