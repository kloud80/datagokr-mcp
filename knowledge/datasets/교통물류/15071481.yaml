description_portal: '1. 고속열차 SRT 열차의 연간 연도별 역별 수송인원 데이터 입니다. 2. 고속열차 SRT는 2016년말부터 운행을 시작하였습니다.3. 해당 파일 내 비어있는 정보는 "데이터 없음"을 안내드립니다.4. 예시) 2016년도  수서 승차에 대한 수송인원은 313,043입니다. (단위 : 명)* 해당 데이터는 연간 주기성 데이터입니다.* 2026년 4월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.* 데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다'
