summary_user: 화성시 공영버스 노선번호별로 기점·종점과 연도별 7~12월 월별 이용객 수를 담은 집계 파일(csv, 약 6.9KB)이다. 시정 분석가나 시민이 '화성시 공영버스 중 어느 노선의 이용객이 많고 하반기에 어떻게 변했나'를 확인하고 노선 운영 효율을 따질 때 쓴다. 전역 조인 키가 없어 노선번호나 기점·종점 이름을 기준으로 화성시·경기도 버스 노선 정보나 정류장 원장과 직접 맞춰 이어 쓴다.
limits: 표준 노선 ID나 정류장 코드 같은 전역 조인 키가 없어 다른 버스 데이터와는 노선번호·이름 매칭으로만 연결된다. 월별 이용객 컬럼이 7~12월뿐이라 연간 전체 추이나 정류장·시간대별 승하차는 알 수 없다. 범위는 전국으로 표기돼 있지만 내용상 화성시 공영버스만 담고 있으므로 해석할 때 주의한다.
