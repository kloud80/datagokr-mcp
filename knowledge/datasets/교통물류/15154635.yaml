summary_user: 국가철도공단 사업에 참여하는 조달청 나라장터(G2B) 등록 업체가 보유한 면허(라이센스)를 사업자번호별·면허별 한 행으로 담은 파일로, 면허 종류(코드·코드명), 등록번호, 유효기간, 유지금액, 등급 기준연도, 대표 면허 여부, 등록·갱신 이력을 포함한다(CSV 약 119KB, 전국 범위). 입찰 분석가나 사업자가 '특정 업체가 철도공단 공사·용역에 필요한 면허를 보유하고 있고 그 면허가 아직 유효한가'를 확인하는 데 쓴다. 사업자번호(bizno)가 조인 키라서 국세청 사업자 상태 조회나 조달·계약 내역 데이터처럼 사업자번호를 가진 데이터와 업체 단위로 이어 붙인다.
description_portal: 국가철도공단_G2B 업체정보는 국가철도공단의 각종 공사·용역·조달 사업에 참여하는 G2B(정부전자조달시스템) 등록 업체들의 자격 및 면허 현황을 체계적으로 관리하기 위해 구축된 데이터입니다. 이 데이터는 각 업체의 고유 식별 정보인 사업자번호를 중심으로 구성되며, 업체가 보유한 다양한 종류의 라이센스에 대한 상세한 속성 정보를 포함하고 있습니다. 예를 들어 라이센스 등록번호, 라이센스 코드 및 코드명, 해당 라이센스가 효력을 가지는 기간(라이센스시작일 및 라이센스종료일), 라이센스를 유지하기 위해 요구되는 유지금액, 그리고 해당 라이센스의 등급 기준 연도 등이 이에 해당됩니다. 또한 특정 라이센스가 업체의 대표 라이센스로 지정되어 있는지 여부, 최초등록일 및 최종등록일과 같이 라이센스 정보가 시스템에 등록·갱신된 이력, 행정 처리상 유효한지 여부를 판단할 수 있는 라이센스 코드의 유효 여부 등의 항목도 포함되어 있어 업체 자격의 변동과 상태를 정확하게 파악할 수 있습니다. 이러한 정보들은 국가철도공단이 사업 참여 업체를 평가하고 적격 여부를 검증하며, 사업 수행을 위한 행정적·법적 기준을 충족하는지 확인하는 데 활용되는 핵심 자료로 사용됩니다.
