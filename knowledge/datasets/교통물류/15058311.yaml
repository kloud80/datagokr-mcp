summary_user: 스쿨존 안에서 1년간 발생한 12세 이하 어린이(보행자·자전거·PM 승차자) 교통사고를 반경 300m 내 2건 이상 또는 사망사고 발생 지점 기준으로 묶은 다발지역 단위 집계로, 지점별 발생건수·사상자수(사망·중상·경상·부상신고)와 좌표·다발지역 폴리곤을 담으며 검증 호출에서는 전국 범위로 2행을 받았다. 학부모나 지자체 교통안전 담당자가 '우리 동네 어린이보호구역 중 어린이 사고가 반복되는 지점이 어디인가'를 확인하고 단속·시설 개선 우선순위를 정하는 데 쓴다. 법정동코드(bjd_cd)로 행정구역 통계와, 시도·시군구명으로 지역 단위 자료와, 경도·위도 좌표로 어린이보호구역 위치나 표준노드링크 등 도로망 공간 데이터와 이어 쓴다.
description_portal: '어린이보호구역에서 발생한 12세 이하 어린이 교통사고에 대한 사고다발지역 정보 - 대상사고 : 1년간 스쿨존 내에서 발생한 12세 이하 어린이 교통사고(어린이는 보행자, 자전거 승차자 또는 개인형이동수단(PM)승차자) - 다발지역 선정조건 : 반경 300m 내 대상사고 2건이상 발생지점 또는 사망 교통사고 발생지점- WMS 형태의 API 정보는 교통사고정보개방시스템(https://opendata.koroad.or.kr/api/sample.do)을 통해 확인하실 수 있습니다.*교통사고분석시스템(https://taas.koroad.or.kr)의 데이터를 기반으로 함'
team:
  dept: AI데이터전략처
services:
