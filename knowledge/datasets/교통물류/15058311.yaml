      - name: guGun
        required: true
        example: '320'
        desc: '시도 코드종류 코드값서울특별시 강남구 680 강동구 740 강북구 305 강서구 500 관악구 620 광진구 215 구로구 530 금천구 545 노원구 350 도봉구 320 동대문구 230 동작구 590 마포구 440 서대문구 410 서초구 650 성동구 200 성북구 290 송파구 710 양천구 470 영등포구 560 용산구 170 은평구 380 종로구 '
      - name: type
        required: false
        example: xml
        desc: 결과형식(xml/json)
      - name: numOfRows
        required: true
        example: '10'
        desc: 검색건수
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지 번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getWMSSchoolzoneChild
    name: 스쿨존어린이사고다발지역정보 WMS 조회
    endpoint: https://apis.data.go.kr/B552061/schoolzoneChild/getWMSSchoolzoneChild
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: layers
        required: true
        desc: 레이어를 결정 freschoolzone 고정값 사용
      - name: format
        required: true
        desc: 이미지 포맷을 결정 image/png 고정값 사용
      - name: transparent
        required: true
        desc: 이미지의 투영성을 결정 TRUE 고정값 사용
      - name: service
        required: true
        desc: 서비스 형태를 결정 WMS 고정값 사용
      - name: version
        required: true
        desc: 서비스 버전을 결정 1.1.1 고정값 사용
      - name: request
        required: true
        desc: 요청 형태를 결정 GetMap 고정값 사용
      - name: srs
        required: true
        desc: 좌표계를 결정 EPSG:4326 고정값 사용
      - name: bbox
        required: true
        desc: '바운더리박스로 대각선의 좌표를 결정 기본값(전국) : 126.0,33.0,132.0,38.5'
      - name: width
        required: true
        desc: '결과 이미지의 가로 크기를 결정, 기본값 : 512'
      - name: height
        required: true
        desc: '결과 이미지의 세로 크기를 결정, 기본값 : 469'
      - name: searchYearCd
        required: true
        desc: 조회하고자 하는 연도값 입력
      - name: siDo
        required: true
        desc: 법정동 시도 코드
      - name: guGun
        required: true
        desc: 법정동 시군구 코드
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
