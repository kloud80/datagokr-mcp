summary_user: SR이 제공하는 승차권 지연배상금 확인 API와 정기(회수)승차권 진위확인 API의 호출 통계를 요청일자별로 담은 집계 데이터로, 요청건수·요청 파라미터건수·응답건수·응답크기(Byte)·확인건수를 제공한다. 분석가나 API 운영 담당자가 "SR 진위확인·지연배상 조회 API가 날짜별로 얼마나 호출되고 실제 확인으로 이어졌는가"를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관(SR)의 지연배상금 확인·정기승차권 진위확인 API와는 API 구분(TYPE)·요청일자(REQ_DATE) 같은 이름 매핑으로만 맞춰 본다.
description_portal: 1. 국민철도SR에서 제공하는 ‘(주)에스알_승차권 지연배상금 확인’, ‘(주)에스알_정기(회수)승차권 진위확인’ API 사용 통계 데이터입니다. 2. 요청일자로 API 호출에 대한 통계를 확인할 수 있습니다. 3. 제공되는 통계 정보는 요청건수(API 호출횟수), 요청 파라미터건수, 응답건수 (조회된 데이터 건수), 응답크기(Byte), 확인건수를 제공합니다. * 해당 데이터는 API로 제공됩니다. * 에스알은 해당 데이터를 무료로 제공드리고 있습니다. * 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.
team:
  dept: 디지털혁신처
services:
  - op: /srt_api_statistics/v1/validate_statistics
    name: 진위확인 사용통계
    endpoint: https://api.odcloud.kr/api/srt_api_statistics/v1/validate_statistics
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: page
        required: false
        desc: 페이지번호
      - name: perPage
        required: false
        desc: 한 페이지 결과 수
      - name: returnType
        required: false
        desc: '응답의 데이터 타입을 선택할 수 있습니다. (기본값: JSON)<br/>XML형태의 응답결과를 얻기 위해서는 XML 값으로 설정'
      - name: cond[REQ_DATE::LT]
        required: false
        desc: 요청일자 - 미만 (미만/이하/초과/이상 조건 중 최소 한 개 이상 YYYYMMDD 형식으로 기입 필수)
      - name: cond[REQ_DATE::LTE]
        required: false
        desc: 요청일자 - 이하 (미만/이하/초과/이상 조건 중 최소 한 개 이상 YYYYMMDD 형식으로 기입 필수)
      - name: cond[REQ_DATE::GT]
        required: false
        desc: 요청일자 - 초과 (미만/이하/초과/이상 조건 중 최소 한 개 이상 YYYYMMDD 형식으로 기입 필수)
      - name: cond[REQ_DATE::GTE]
        required: false
        desc: 요청일자 - 이상 (미만/이하/초과/이상 조건 중 최소 한 개 이상 YYYYMMDD 형식으로 기입 필수)
      - name: cond[TYPE::EQ]
        required: false
        desc: 진위확인유형 (일반/지연/정기 중 한 개 기입)
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
