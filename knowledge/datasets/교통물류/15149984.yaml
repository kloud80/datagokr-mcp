description_portal: 경기도 양주시의 도시지역 광역 교통정보 수집 현황 데이터는 링크아이디별 속도, 주행시간, 데이터 기준일을 포함하고있습니다.이 데이터는 대중교통 이용 증대 및 교통약자 이동권 확보, 교통 정책 결정의 투명성과 신뢰성을 높이고, 교통 안전 향상을 위한 근거로 활용될 수 있습니다.또한, 출퇴근 시간대 및 주요도로의 흐름을 분석하여 생활권 교통 불균형 해소 및 지속 가능한 도시 교통체계 구축에 기여합니다.시민, 행정, 연구자가 함께 활용 가능하며, 미래 탄소 중립, 환경 보호, 교통 약자 배려를 목표로 한 정책 수립에 필수적인 정보입니다.-코드정보*링크아이디:해당 데이터가 수집된 도로 구간 또는 교차로를 고유하게 식별하는 ID입니다. 이를 통해 특정 도로 구간에 대한 데이터를 연결할 수 있습니다.*속도:해당 구간에서의 차량 평균 속도를 나타내는 값입니다. 교통 흐름의 원활함 정도를 알 수 있습니다.*주행시간:해당 구간을 주행하는 데 걸린 시간을 나타냅니다. 차량이 해당 도로 구간을 통과하는 데 걸린 시간으로, 교통 혼잡도를 파악하는 데 유용합니다.
