summary_user: 대전교통공사가 관리하는 도시철도역에 비치된 공기호흡기의 위치를 장비별로 담은 파일(csv, 약 7KB)로, 운영기관·노선·역명과 지상·지하 구분, 역층, 출입구번호, 상세위치를 담는다. 역 안전 담당자나 이용자가 '이 역에서 화재가 나면 공기호흡기는 몇 층 어느 출구 근처에 있나'를 확인하거나, 분석가가 역별 비상장비 배치 현황을 점검하는 데 쓴다. 공통 코드 같은 전역 조인 키는 없어서, 다른 역 시설·안전 데이터와는 역명·선명 같은 이름을 맞춰서만 이어 쓴다.
description_portal: 대전교통공사에서 관리하는 도시광역철도역들의 철도운영기관명, 선명, 역명, 공기호흡기의 역층, 출구번호, 상세위치의 데이터가 있습니다.공기 호흡기는 호흡이 불가능한 장소나 상황(화재, 화생방, 수중)에서 압축공기를 이용해 호흡을 할 수 있도록 만들어진 호흡 장비. 흔히 압축공기 실린더는 산소통, 호흡기는 산소호흡기로 알려져 있는데 산소만 들어가지는 않으며, 순산소로만 호흡하면 중독 위험이 있어서 오히려 위험하다.-지하철에 비치된 양압식 공기호흡기 사용법!1. 공기호흡기를 메고 몸에 맞게 조절하세요...2. 면체를 쓰고 얼굴에 밀착하세요...3. 공기호흡기의 용기밸브를 여세요...4. 양압호흡으로 맞추고 밸브를 여시고 돌리세요-화재용 긴급대피용마스크 착용방법1. 포장지를 화살표 방향으로 개봉하십시오2. 고정된 마개를 분리하십시오3. 방독면을 착용하고 편안한 상태를 유지하십시오4. 얼굴에 맞게 끈을 뒤로 당겨 고정하십시오긴급대피용마스크를 많이 둘 수 없는게 현실이니 화재대피용 물티슈도 있네요~-화재대피용 물티슈 화재시 개봉하여 3~4겹으로 코와 입을 막고 신속히 대피하세요
