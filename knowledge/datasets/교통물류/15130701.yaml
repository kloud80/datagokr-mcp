summary_user: 경기도 화물자동차 운송사업의 허가 현황을 기준연도·시군별로 집계한 데이터로, 일반·개별·용달 업종별 허가대수와 운송주선업체 수를 담는다(건별 사업자 원장이 아닌 집계표). 물류 정책 담당자나 연구자가 '우리 시군에서 일반·개별 화물 허가대수와 주선업체 수가 해마다 어떻게 달라졌나'를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명 같은 이름 매핑으로만 잇고, 개별 운송사·주선사의 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
description_portal: 경기도 내의 화물자동차 운송사업의  일반허가대수, 개인허가대수, 주선업체수 등의 집계현황입니다.연도별·시군별로 업종 유형에 따른 사업 허가 대수 및 운송주선업체 수를 제공합니다. 주요 항목으로는 기준년도, 시군명, 업종별일반허가대수, 업종별개별허가대수, 업종별용달허가대수, 화물운송연결업체수 등이 있으며, 일반·개별·용달 등 화물운송업의 형태별 사업허가 현황을 구분하여 확인할 수 있습니다. 본 데이터는 물류산업 정책 수립, 화물운송시장 구조 분석, 운송업체 관리, 교통물류 수급조절, 물류산업 경쟁력 평가 등 다양한 행정·정책·연구 목적으로 활용됩니다. 특히 운송시장 내 업종별 구조와 업체 수의 변화를 파악하여 운송업계의 정책적 지원 방향을 설정하는 데 활용될 수 있습니다.※ 2022년도부터 용달화물이 개인화물로 통합되었습니다.
