summary_user: 2025년 여수항에 입항 예정인 크루즈선을 선박 한 척당 한 행으로 정리한 파일로, 선명·선사·국적·총톤수·길이·최대흘수·예상 승객수·입출항 예정일·전항지·차항지를 담는다(포털 설명상 6척, 파일 813바이트). 지역 관광업계나 지자체가 '올해 어떤 크루즈가 언제 몇 명을 태우고 여수에 들어오나'를 확인하거나, 분석가가 선박 길이·흘수로 접안 여건을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 항만의 크루즈 일정이나 입출항 자료와는 선명·선사 이름을 맞춰 이어 붙여야 한다.
description_portal: 「여수광양항만공사 여수항 크루즈선 정보(2025)」 데이터는 2025년 여수항에 입항 예정인 크루즈선의 상세 정보를 정리한 자료로, 선명, 선사, 국적, 총톤수(GT), 선박 길이, 최대흘수, 승객수, 입출항 예정일, 전항지와 차항지 항목으로 구성되어 있습니다. 총 6척의 크루즈선 정보가 기록되어 있으며, 여수항의 국제 여객선 수용 역량과 크루즈 관광 인프라 현황을 보여줍니다.이 데이터는 여수항의 크루즈 유치 현황과 여객 수송 규모를 정량적으로 보여주며, 향후 국제 크루즈 관광 활성화, 지역 관광 연계 전략, 항만 여객 인프라 확충 계획에 중요한 기초 자료로 활용될 수 있습니다. 특히 선박의 흘수와 길이 정보는 항만의 접안 능력을 점검하는 데 핵심적입니다.
