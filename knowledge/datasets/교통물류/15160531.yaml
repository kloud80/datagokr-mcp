description_portal: 강원특별자치도 시외버스 운임 정보입니다.시외버스 기점과 종점 운임 정보임에, 중간 경유지가 다를 경우 같은 기점과 종점이라도 운임이 다를 수 있습니다. 또한 시외버스 운행 형태(일반, 우등)에 따라 같은 구간이라도 요금이 다르게 적용됩니다.시외버스 운임은 국토교통부에서 고시하는 시외고속버스 운인요율을 적용하여 산정되며, 도로 여건(국도, 고속도로 등), 심야 운행, 공항 고속도로 이용, 도로 평균경사도, 운행 형태에 따라 할증이 붙을 수 있습니다. 추가의 정보가 필요할 경우 교통과로 연락주시기 바랍니다.
