summary_user: 서울시 나눔카(카셰어링) 거점별로 거점ID·거점명·주소·위도·경도와 전기차 배치 여부를 담은 거점 단위 목록으로, 범위는 서울시 전역이며 개별 주소·좌표 수준입니다. 시민이나 분석가가 '우리 동네 가까이에 나눔카 거점이 있는지, 전기차를 빌릴 수 있는 거점은 어디에 몰려 있는지'를 확인하거나 공간 분포를 분석할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표(위도·경도)나 주소를 이용한 공간·이름 매칭으로만 연결한다.
description_portal: 서울시 나눔카 거점리스트 정보는 서울 전역의 나눔카 거점 위치와 차량 특성을 제공하는 자료로, 위도와 경도 정보를 통해 정확한 거점 위치를 확인할 수 있으며, 거점ID를 통해 각 지점을 식별할 수 있습니다. 전기차 여부 항목을 통해 해당 거점에 전기차, 가솔린차 또는 혼합 차량이 배치되어 있는지 확인할 수 있고, 주소와 거점명 정보를 통해 실제 이용자가 접근할 수 있는 공간적 정보를 제공합니다. 이 자료는 나눔카의 공간 분포 분석, 친환경 차량 도입 현황 파악, 도시 교통 접근성 평가 등에 활용될 수 있는 기초 데이터입니다. 다만 2022년 12월 30일자로 원천부서의 자료 제공이 중단됨에 따라 이후 데이터는 업데이트되고 있지 않으며, 최신 현황을 반영하지 못한다는 점을 고려하여 활용할 필요가 있습니다.
