summary_user: 대전교통공사가 운영하는 도시철도 노선의 역별 화장실 위치를 한 행씩 담은 파일 데이터로, 선명·역명과 함께 지상 구분, 역층, 개찰구 안팎 여부, 가까운 출구번호, 상세위치, 화장실 구분을 기록한다(약 4KB CSV). 대전 지하철 이용자나 안내 서비스 개발자가 '이 역 화장실이 개찰구 안에 있어서 요금을 내고 들어가야 하나, 몇 번 출구 쪽인가'를 확인할 때 쓴다. 전역에 통용되는 역 코드 같은 조인 키가 없어서, 다른 역·시설 데이터와는 역명·선명을 맞춰 연결하거나 같은 기관 데이터끼리만 이을 수 있다.
description_portal: 대전교통공사에서 운영하는 노선의 역사별 화장실 위치에 대한 데이터로, 철도운영기관명, 선명, 역명, 화장실의 역층, 게이트내외, 출구번호, 상세위치 데이터가 있습니다.개찰구 안의 운임 구역(fare zone)에 공중화장실이 있는 지하철역 목록. 화장실이 개찰구 내부에 있는지 외부에 있는지는 역마다 다르므로, 자신이 가려는 역을 잘 확인해야 한다. 심지어 환승역은 노선마다 화장실의 위치가 다를 수 있으니 주의해야 한다.개찰구 안에 화장실이 있는 역 중에서 개찰구 바깥에는 화장실이 없다면, 역내 화장실을 쓰려면 이용료를 내고 개찰구를 통과해야 한다. 즉, 실제로 지하철을 이용하지 않는다면 유료 화장실이 되는 셈이다.2023년 10월 7일부터 서울교통공사 구간에 한해 교통카드 소지자는 하차 후 동일 역 동일 노선 게이트에서 15분 이내에 재승차 시 1회에 한해 재승차 환승 할인이 적용된다. GTX-A는 10분 이내로 재승차 환승 할인이 적용된다. 이를 이용해 나갔다 오면된다.참고로, 수도권 전철은 노선도에 개찰구 안에서 화장실 있는 역을 표시해 준다.
