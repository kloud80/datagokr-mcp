description_portal: 드론, 동력비행장치 등 국토교통부령으로 정하는 초경량비행장치를 사용하여 비행하려는 사람은 국토교통부령으로 정하는 기관 또는 단체의 장으로부터 그가 정한 해당 초경량비행장치별 자격기준 및 시험의 절차ㆍ방법에 따라 해당 초경량비행장치의 조종을 위하여 발급하는 증명(이하 “초경량비행장치 조종자 증명”이라 한다)을 받아야 한다. 한국교통안전공단은 항공안전법 제135조(권한의 위임ㆍ위탁)에 따라 해당 업무를 국토교통부로부터 위탁받아 운영하고 있다.한국교통안전공단에서 수집하고 있는 초경량비행장치(동력비행장치,회전익비행장치,유인자유기구, 무인비행장치 등 총 11개 자격) 자격취득 연도별("26년 6월말) 현황입니다.
