description_portal: 본 데이터는 한국철도공사 계열사인 코레일네트웍스(주)의 연도별 신규채용 실적 상세 정보를 제공합니다. 철도 역무, 주차 관리, 유통 등 기관 주요 사업 분야의 일자리 창출 현황을 투명하게 공개하여 국민의 알 권리를 보장하고 구직자에게 유용한 정보를 제공하는 데 목적이 있습니다.주요 내용은 일반직·현장직 등 직종별 채용 인원, 정규직·비정규직 등 고용 형태, 그리고 장애인 및 국가유공자를 포함한 사회형평적 채용 실적 등으로 구성됩니다. 본 자료는 공공기관 취업을 준비하는 구직자의 전략 수립과 학계·민간의 고용 지표 분석 및 일자리 정책 연구를 위한 기초 자료로 활용 가치가 높습니다.
