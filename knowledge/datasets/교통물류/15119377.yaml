description_portal: '항공자격시험(ARTS) 항공종사자 자격시험 정보 공개(응시자격부여) 입니다. 해당파일을 통해 확인하실 수 있습니다. - 응시자격부여는 항공안전법 및 시행규칙에 의한 응시자격 조건이 충족되었는지를 확인하고 자격시험에 응시할 수 있는 자격을 부여하는 절차입니다. 아래는 해당 절차의 세부 내용입니다. - 신청시기: 학과시험 접수 전부터(학과시험 합격 무관)~실기시험 접수 전까지 - 소요기간: 신청일 기준 3~4일정도 소요(실기시험 접수 전 까지 미리 신청) - 방법: 국가자격시험-항공자격 홈페이지[응시자격신청]메뉴 이용 - 부여대상: 자격종류/항공기종류/항공기등급 · 형식이 다를 때마다 각각 부여, 대상이 같은 경우 한번만 신청 가능하며 한번 신청된 것은 취소 불가 - 변경신청: 면제조건이 변경(실비행→구술)된 경우 제출서류 스캔 등록 후 담당자 전화 - 효력기간: 최종합격 전까지 한번만 신청하면 유효'
