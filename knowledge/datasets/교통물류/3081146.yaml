summary_user: 창원시에 등록된 자동차 대수를 연도별로 승용·승합·화물·특수 차종과 사업용·비사업용 구분에 따라 집계한 파일(csv, 421바이트)로, 건별 차량 원장이 아닌 시 단위 집계표다. 창원시 교통·주차 정책 담당자나 분석가가 '최근 몇 년 사이 창원시 비사업용 승용차와 사업용 화물차가 각각 얼마나 늘었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(년도)와 시군구 이름을 맞춰 다른 시군의 등록현황이나 인구 통계와 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 경상남도 창원시 자동차 등록 현황에 대한 공공데이터 파일입니다.    항목에는 연도별   승용, 승합, 화물,특수차 등록대수 등이 있습니다.자동차 등록현황 데이터는 차종별(승용·승합·화물·특수 등)로 현재 등록된 차량의 총대수와 분류 정보를 정리한 자료입니다. 이 데이터는 교통정책 수립, 도로·주차 인프라 계획, 수송 수요 예측, 차량 배출가스 저감 전략 설계, 보험 및 세수 기반 마련, 민원 대응 등에 활용될 수 있으며, GIS 기반 시각화와 결합하면 교통 밀집 구간 분석이나 정책 우선순위 설정에 중요한 기초자료로 활용됩니다.
