summary_user: 경상남도 도로대장전산화시스템에 등록된 차량방호안전시설(가드레일 등)을 시설 한 건씩 담은 파일로, 관리기관·도로종류·노선번호·구간번호와 시작·종료지점(km), 방향, 종류, 연장·높이(m), 설치일자를 기록한다. 도로 관리자나 교통안전 분석가가 '경남의 특정 노선 어느 구간에 방호시설이 얼마나 설치돼 있고 언제 설치됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선번호·구간번호나 관리기관명 같은 이름·코드를 맞춰 연결해야 하며, 다른 도로 시설물 데이터와 노선 기준으로 함께 본다.
limits: 표준 행정코드나 좌표 같은 전역 조인 키가 없어 이름·노선번호 매칭으로만 다른 데이터와 이을 수 있다. 위치는 노선상 거리(km)로만 주어져 지도 위치로 바로 쓰기 어렵고, 포털 설명상 위치방향·종류·비고 일부는 취합되지 않아 비어 있다.
