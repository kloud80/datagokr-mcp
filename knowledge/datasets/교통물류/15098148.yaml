summary_user: 서울시 지하철역 주변 교통약자용 엘리베이터의 위치를 노드 단위(노드 ID·노드 WKT 좌표, WGS84)로 담고, 각 노드에 시군구·읍면동과 지하철역 코드·이름을 붙인 위치 목록이다. 휠체어 이용자나 유모차를 끄는 시민이 "이 역에서 엘리베이터가 어디에 있나"를 확인하거나, 분석가가 역별 교통약자 이동 편의시설 분포를 지도로 살필 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 지하철역 코드·역명(SBWY_STN_NM)이나 시군구·읍면동 코드·이름 매핑으로 이어 써야 한다.
limits: 원천은 서울 열린데이터광장이며 포털 활용신청과 별도로 data.seoul.go.kr 인증키가 필요하다. 전역 조인 키가 없어 역·행정구역 코드나 이름을 맞춰 연결해야 하고, 포털 설명상 2020년 기준 자료로 안내되어 있다.
