description_portal: 서울시 내 지하철역 주변의 교통약자용 엘리베이터 위치를 제공합니다. ('20년 기준)좌표계는 WGS84을 사용합니다.노드링크 유형, 노드 WKT, 노드 ID, 노드 유형 코드, 시군구코드, 시군구명, 읍면동코드, 읍면동명, 지하철역코드, 지하철역명을 제공합니다.※ 장애인·노약자·임산부·유모차 이용자가 승강장까지 안전하고 편리하게 이동할 수 있도록 위해서 리프트보다 안전성·편의성이 뛰어나서 최근에는 리프트를 철거하고 엘리베이터를 설치하는 추세임제공부서는 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4959) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
