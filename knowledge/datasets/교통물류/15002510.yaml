summary_user: 대구도시철도 1·2·3호선의 역마다 다음 역까지의 역간 거리와 호선별 누계 거리를 담은 역 단위 파일(csv, 약 1.7KB)이다. 대구 도시철도 이용자나 교통 분석가가 "두 역 사이 노선 거리가 몇 km인가"를 확인하거나 노선 거리 구조를 분석할 때 쓴다. 전역 조인 키가 없어 다른 역·승하차 데이터와는 호선과 역명을 이름으로 매핑해 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선 구간별 역 간 거리 정보를 제공합니다. 데이터에는 각 노선별 역명, 기점역 기준 다음 역까지의 역간 거리(km), 누적 거리 등의 항목이 포함되어 있으며, 도시철도 노선별 거리 구조와 역사 간 위치 관계를 확인할 수 있는 자료입니다. 해당 데이터는 노선별 거리 현황 파악, 도시철도 시설 관리, 운행 및 운영 계획 검토, 관련 연구 및 분석을 위한 기초자료로 활용할 수 있습니다. 또한 역 간 거리 정보를 활용하여 도시철도 이용 정보 제공, 공간 분석 및 교통 관련 서비스 개발 등에 활용할 수 있습니다. 본 데이터는 노선 및 역사 정보 변경 등 변동 사항 발생 시 갱신됩니다.'
