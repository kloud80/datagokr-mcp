summary_user: 의왕시 내 과속방지턱을 시설 한 건씩 기록한 공간정보 파일로, 설치일자·폭(폭원)·길이(연장)와 위도·경도, 도로구간번호, 관리번호를 담는다(약 52KB CSV, 2022년 기준 자료). 보행안전지수 지도 시각화의 중간 데이터로, 주민이나 교통안전 분석가가 '우리 동네 어느 도로에 과속방지턱이 얼마나 있고 언제 설치됐나'를 확인할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 위도·경도 좌표로 다른 공간자료와 겹쳐 보거나, 행정읍면동코드·도로구간번호 같은 코드로 같은 기관 자료와 매칭해 이어 쓴다.
description_portal: 이 데이터는 의왕시 내 설치된 과속방지턱의 위치와 물리적 특성을 기록한 공간정보 자료로, 보행안전지수 지도 시각화에 활용되는 중간 데이터입니다. 공간지리식별번호, 지형지물부호, 도로구간번호와 함께 과속방지턱의 폭, 길이, 설치일자, 위도·경도 정보가 포함되어 있으며, 이를 통해 각 도로에서 차량 속도를 저감시키는 시설의 분포와 특성을 파악할 수 있어 교통안전 개선과 보행환경 조성을 위한 기초 자료로 의미 있는 데이터를 제공합니다.이 데이터는 2022년을 기준으로 수집된 자료로, 최신 정보와 차이가 있을 수 있으므로 참고용으로 활용하는 것이 적절합니다.
