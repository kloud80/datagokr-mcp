summary_user: 한국건설기술연구원이 제공하는 지자체 수시 조사지점의 변경 내역을 건별로 담으며, 작성일자·도로등급·조사지점 ID·변경 지점·차로수·변경 주소·변경 사유 같은 항목이 있고 범위는 전국입니다. 교통 분석가가 "특정 지자체 도로의 수시 조사지점이 언제, 어디로, 왜 바뀌었나"를 확인해 지점별 조사 자료의 연속성을 판단하는 데 쓴다. 전역 조인 키는 없으며, 조사지점 ID(EXMN_FPOTG_ID)나 주소를 같은 기관의 조사지점 자료와 이름·코드로 맞춰 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 지자체수시지점변경 정보입니다.\""
