description_portal: 드론 전문교육기관을 운영하려는 자는 항공안전법 제126조(초경량비행장치 전문교육기관 의 지정 등)에 따라 지정받아야 하고, 국토교통부 고시 제2025-185호(무인비행장치 조종자의 자격 및 전문교육기관 지정기준)에 정하는 기준을 준수해야한다. 한국교통안전공단은 같은법 제135조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.해당 자료는 권역별 분포되어 있는 전문교육기관의 보유 기체 수를 종별로 구분하여 향후 권역별 드론 기체 보유 현황 등의 통계 자료에 활용할 수 있다.
