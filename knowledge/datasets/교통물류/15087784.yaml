summary_user: 드론 전문교육기관이 보유한 교육용 기체 수를 권역(시도·시군구)별로 1종·2종·3종 기체로 나누어 담은 전국 단위 집계 파일(csv)입니다. 드론 교육 사업자나 분석가가 '어느 지역에 몇 종 기체를 갖춘 교육기관 자원이 몰려 있는가'를 따져 교육 수요 대비 공급이나 신규 교육기관 입지를 검토할 때 쓴다. 전역 조인 키가 없어 시도·시군구 이름을 행정구역 코드에 매핑하거나 같은 기관(한국교통안전공단)의 드론 신고·조종자격 자료와 지역명으로 이어 쓴다.
limits: 기관별·기체별 건 단위가 아니라 권역 합계라서 개별 교육기관이나 기체 정보는 알 수 없다. 공통 코드 키가 없어 다른 데이터와 연결하려면 시도·시군구 이름 매핑이 필요하다.
