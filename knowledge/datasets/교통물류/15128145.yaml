summary_user: PORT-MIS에 항만공사·지방청 담당자가 등록한 월정료 선박 정보를 선박·신청 건별로 담은 전국 단위 파일(CSV 약 117KB)로, 항구청·신청자·선박명·처리 유형·유효기간·납기일자·면제사유 등을 포함한다. 항만 운영 담당자나 분석가가 '어느 항구청에 어떤 선박이 어느 기간 월정료 대상으로 등록돼 있고 면제 사유는 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 선박번호·호출부호·선박명이나 항구청 이름 매핑으로 선박 등록 원장·입출항 데이터 등과 맞춰 이어 써야 한다.
description_portal: 이 데이터는 해양수산부 해운항만물류정보시스템(PORT-MIS)에서 월정료 선박에 대한 정보를 관리 및 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 항만공사와 지방청의 업무담당자가 시스템을 통해 등록한 월정료 선박에 대한 정보로 구성되어 있습니다. 항구청코드, 신청자명, 선박명, 처리결과, 유효일자 등을 포함하고 있습니다.  본 데이터는 항만 및 선박 운영 실태에 대한 연구 자료로 활용될 수 있으며, 행정기관이 항만 운영 정책을 수립하거나 월정료 징수 및 선박 등록 현황을 분석할 때 참고자료로 사용할 수 있습니다. 또한, 항만별 월정료 부과 현황에 관심이 있는 산업계와 관련 기업이 경영 분석 및 내부 관리 목적으로 활용하는 데에도 이용될 수 있습니다.
