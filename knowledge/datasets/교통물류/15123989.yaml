summary_user: 경기도 버스운송관리시스템(BMS)에서 쓰는 차량 내 단말기의 변경 유형(통합단말기 신규 설치·이전 설치 등)과 그 사유(노선 신설·증차 인가·공동운수협정 등)를 짝지어 담은 코드성 목록이다. BMS 단말기 변경 이력이나 관련 자료를 볼 때 각 변경 유형과 사유가 무엇을 뜻하는지 확인하려는 교통 담당자나 버스 운영업체가 주로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 경기도 버스 데이터와는 변경 유형(trmnl_chg_type)·사유 명칭을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에서 운영되는 차량 내 단말기의 변경 유형과 그 사유에 대한 정보를 제공합니다. 항목으로는 '단말기 변경 유형'과 '단말기 변경 사유'가 포함되어 있으며, 주로 통합단말기의 신규 설치, 이전 설치 등의 유형과 관련하여 노선 신설, 증차 인가, 공동운수협정 등 다양한 변경 사유가 기록되어 있습니다. 이 데이터는 버스 내 설비 현황 관리, 노선 변경에 따른 단말기 운영 계획 수립, 차량 설비 표준화 등 정책 수립과 교통 서비스 품질 향상을 위한 분석에 활용될 수 있습니다. 또한 버스 운영업체의 유지관리 및 점검 자료로 활용되며, BMS 데이터 정확성 검토 및 관련 민원 응대 자료로도 유용합니다.
