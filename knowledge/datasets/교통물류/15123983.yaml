summary_user: 경기도 버스운송관리시스템(BMS) 기준 노선ID·노선명과 교통카드 요금정산 시스템(EB)의 노선ID·사업자ID를 노선 단위로 짝지은 매핑표로, 건별 승하차 기록이 아닌 코드 대응 자료다. 교통카드 승하차·정산 데이터에 찍힌 이비 노선ID가 실제 어느 버스 노선(노선명)인지 확인하려는 분석가나 행정 담당자가 쓴다. 전역 조인 키는 없고, 이 표의 이비 노선ID(eb_route_id)와 BMS 노선ID(route_id)를 경기도 카드 승하차 데이터와 BMS 노선·정류장 데이터를 잇는 번역 키로 쓰거나 노선명으로 맞춘다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 카드데이터 기준의 노선 정보로, 버스요금 정산 시스템(EB)에서 사용되는 노선ID 및 사업자 ID와 BMS 시스템의 노선ID, 노선명을 상호 매핑한 자료입니다. 주요 항목은 이비노선ID(EB 노선ID), EB 사업자 ID, BMS 기준 노선ID, 노선명 등으로 구성되어 있으며, 요금 정산 기반의 운영정보와 실시간 운행정보 간 일치 여부를 확인하고 분석하는 데 사용됩니다. 본 데이터는 교통카드 시스템과 버스관리 시스템의 데이터를 연계하여 정확한 정산 및 행정처리를 지원하며, 노선정보 통합관리, 업체 간 비교 분석, 정책 수립, 교통정보 서비스 개선 등에 활용될 수 있습니다.
