description_portal: '전북특별자치도 전주시에서 2024년 1월 1일부터2024년 12월 31일까지 안전신문고를 통해 접수된 불법주정차 관련 민원과 이에 따른 과태료 부과 여부를 정리한 자료입니다.본 데이터는 시민 참여형 안전신고제도를 기반으로 수집된 불법주정차 민원 데이터를 체계적으로 관리하기 위한 것으로, 단속위치별 위반 유형과 과태료 부과 여부를 한눈에 파악할 수 있습니다.해당 데이터는 시군명, 신고일자, 신고위치, 과태료 부과 여부, 위반구분 등 항목으로 구성되어 있습니다.민원 발생 위치를 파악할 수 있어 지역별 불법주정차 집중 구역 분석에 활용 가능하며, 교통안전 정책 수립, 행정 대응의 투명성 확보, 시민 참여 기반의 문제 해결에 기여할 수 있습니다.데이터 제공부서 : 양구청 산업교통과'
