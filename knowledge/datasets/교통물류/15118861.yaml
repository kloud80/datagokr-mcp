description_portal: 이 데이터는 대구광역시 수성구 내에 설치된 전동킥보드 주차구역 정보로, 주차구역 위치, 설치일자, 참고사항, 데이터 기준일자 등의 컬럼으로 구성된다 . 각 주차구역은 행정구역 및 주소 정보를 기반으로 지정되며, 지정된 설치일자를 통해 시기별 확산현황을 확인할 수 있다. 본 자료는 **개인형 이동장치(PM)**의 무질서 주차 문제 해소 및 교통체계 및 도시공간 계획 수립에서 활용된다. 또한, 시민 편의 증진과 스마트 모빌리티 인프라 구축, 모빌리티 정책 연구를 위한 기초 데이터로서도 유용하다. 데이터는 연간 주기 업데이트되며, CSV 형태로 제공된다 .
