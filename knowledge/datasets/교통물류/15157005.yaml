description_portal: "의정부도시공사에서는 의정부시 공영주차장 이용요금 현황을 제공합니다. 본 데이터에는 기관에서 운영하는 공영주차장별 이용시간에 따른 이용요금 현황을 세부 정보로 포함하고 있습니다.이러한 정보를 통해 정책 담당자는 주차장 수입금 정책 운영 및 관리에 참고할 수 있고, 주차장 이용자는 신속하고 정확한 주차장 이용에 참고할 수 있습니다.다만 제공된 공영주차장 이용요금은 요금 변동 일자와 데이터 현행화 일자가 불일치 할 수 있어 상이할 수 있음을 알려드립니다. ○공란('0' 표시) 사유- 해당 이용시간 요금제 미운영○부설주차장 이용요금(최초 무료이용 시간, 이후 10분당 부과요금)  - 의정부시청: 30분, 300원  - 의정부 과학도서관: 1시간, 300원  - 의정부 정보도서관: 1시간, 300원  - 의정부 낙양물사랑공원: 30분, 300원  - 의정부 직동근린공원: 3시간, 200원  - 의정부 추동웰빙공원: 3시간, 200원  - 의정부 송산사지 근린공원: 3시간, 200원"
