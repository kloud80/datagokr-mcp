summary_user: 광주 광산구 관내 전세버스·장의차 등 여객 자동차 운송사업장을 업체 1곳당 1행으로 담은 원천 목록으로, 업체명·구분·도로명주소·전화번호·보유 차량 대수·위경도·데이터기준일자를 포함한다(CSV 약 4.8KB 규모). 단체 이동이나 장례용 차량이 필요한 주민·기관이 광산구 안에서 연락 가능한 전세버스·장의차 업체와 보유 차량 규모를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 위경도 기반 공간 결합으로만 이어 쓴다.
description_portal: 광주광역시 광산구 관내에 위치한 전세버스 및 장의차 등 여객 자동차 운송사업장의 현황 정보를 안내드립니다. 각 업체의 명칭, 도로명 기준의 상세 주소, 연락처 등 주요 항목들이 포함되어 있어, 해당 지역 내 여객 운송 서비스 인프라에 대한 종합적인 파악이 가능합니다. 전세버스 및 장의차 업체의 분포 현황을 한눈에 확인할 수 있으며, 특히 교통 수요 대응, 긴급·상시 운송 서비스 기획, 계약 체결 및 업체 선정 과정에서 유용하게 활용될 수 있습니다. 사업장별 연락처 정보는 실무적 소통과 협업을 보다 신속하게 지원하며, 운영 중인 업체 현황 파악은 지역 내 운송 네트워크의 적정성 및 안전성 점검에도 기초 자료가 됩니다. 이 자료는 지역 서비스 역량을 강화하기 위한 정책·사업 수립 기초 자료로 폭넓게 활용될 것으로 기대됩니다.
