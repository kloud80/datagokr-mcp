summary_user: 의정부도시공사가 운영하는 공영주차장을 주차장 한 곳당 한 행으로 담은 작은 CSV 파일(3,561바이트)이며, 동, 명칭, 주소, 전화번호, 주차면수, 급지를 담는다. 의정부 시민이나 방문자가 어느 동에 공영주차장이 있고 몇 면 규모인지 찾을 때 쓰고, 연구용역에서 시설 규모와 급지 분포를 파악할 때도 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 같은 다른 자료와는 주차장 명칭이나 주소를 맞춰 붙여야 한다.
limits: 주차요금, 감면, 월정기권 정보와 실시간 주차 가능 대수는 이 파일에 없으므로 도시공사 홈페이지나 지자체별 실시간 API를 따로 봐야 한다. 필드 목록에 좌표와 주차장관리번호가 없어 지도 표시나 표준 원장과의 정확한 매칭에는 주소 지오코딩이나 이름 대조가 필요하다.
