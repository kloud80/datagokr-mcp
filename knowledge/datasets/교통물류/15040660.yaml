summary_user: 수원시에 인가된 시내버스 노선을 노선 한 건씩 담은 원장 파일로, 운수업체명, 노선명·유형·상태, 운행형태, 최초·변경 인가일자, 인가·등록 대수, 인가횟수, 왕복 총인가거리, 기점·종점 정류소를 포함한다. 수원시 교통 담당자나 분석가가 '어느 업체가 어떤 노선을 몇 대로 운행하고 기점·종점은 어디인가', '최근 인가가 변경된 노선은 무엇인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·정류소명 매칭이나 같은 기관의 노선아이디·업체아이디로만 이을 수 있어, 정류장 원장이나 실시간 도착 정보와 붙일 때는 이름 대조가 필요하다.
limits: 실측 컬럼에서 전국 단위 조인 키를 찾지 못해 국가 버스 노선·정류장 데이터와 바로 결합되지 않는다. 범위는 수원시 한 곳의 노선 현황이며, 정류장별 경유 순서나 실시간 운행 정보는 담지 않는다.
