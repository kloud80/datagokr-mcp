summary_user: 광주교통공사 도시철도 문화전당역·양동시장역·공항역 세 역의 지하수 유출량을 월별(구분 열의 연·월)로 톤 단위 집계한 파일 데이터입니다. 역사 시설 관리자나 분석가가 어느 역에서 지하수가 많이 나오는지, 계절에 따라 유출량이 어떻게 달라지는지 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 연·월이나 역 이름을 직접 맞춰 이어야 합니다. 예를 들면 같은 기관의 역 시설 자료나 기상 관측 자료가 있습니다.
limits: 세 역만 담고 있어 다른 역이나 다른 노선의 지하수 유출은 이 데이터로 볼 수 없습니다. 표준 역코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 역 이름을 수작업으로 대조해야 합니다. 범위가 '전국'으로 분류돼 있지만 실제 내용은 광주 도시철도 역사에 한정됩니다.
