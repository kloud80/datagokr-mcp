summary_user: 경기도 군포시 관내 횡단보도에 설치된 옐로카펫을 설치 장소별로 한 행씩 담은 원천 목록으로, 장소명·도로명/지번 주소·설치 개소 수·설치연도·관리기관과 전화번호를 포함한다(약 3KB 규모의 CSV 파일). 학부모나 학교·지자체 담당자가 '우리 동네 어느 횡단보도에 옐로카펫이 있고 언제 설치됐는지'를 확인하거나 추가 설치 후보지를 검토할 때 쓴다. 전역 조인 키나 좌표·코드 컬럼이 없어 다른 데이터와는 주소 문자열을 지오코딩하거나 장소명으로 맞춰 어린이보호구역·무인단속카메라 표준데이터 등과 연결해야 한다.
description_portal: 경기도 군포시 관내에 설치된 횡단보도 옐로카펫에 대한 현황 자료를 제공합니다. 해당 자료는 시민들의 보행안전을 강화하기 위해 설치된 옐로카펫의 위치와 관리 정보를 포함하고 있으며, 구체적으로는 설치 장소명, 설치된 도로의 도로명 주소, 지번 주소, 각 설치 장소별 설치 개소 수, 설치가 완료된 연도, 시설을 관리하는 기관명과 해당 기관의 전화번호, 그리고 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이 자료는 군포시 관내 옐로카펫 설치 현황을 체계적으로 파악하고, 향후 유지관리 및 추가 설치를 위한 기초 자료로 활용될 수 있습니다.
