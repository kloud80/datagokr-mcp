summary_user: 도시철도 노선별로 경유하는 역의 목록과 순번을 담은 API로, 운행일자(opr_ymd) 기준 전국 778행을 노선명·역명·역 ID·순번 단위로 제공한다. 승객이나 분석가가 특정 노선이 어떤 역을 어떤 순서로 지나는지 확인하는 질문에 쓴다. 역 ID(sttn_id)는 조인 키 busstop_sttn_id로 확인되어 같은 키를 쓰는 정류장·역 단위 데이터와 이어 쓰며, 노선 ID(rte_id)는 명세에 의미 설명이 없다.
limits: 검증 호출은 운행일자 20250801 한 날짜만 대상으로 했고 최신 행 날짜가 그 조건 때문에 오래돼 보일 수 있어, 데이터 자체의 최신성은 단정할 수 없다. 승하차 인원이나 혼잡도 같은 수치는 필드에 없어 경유역 구성과 순번 확인용으로만 쓴다.
