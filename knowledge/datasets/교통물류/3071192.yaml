description_portal: 이 데이터는 광주광역시 도시철도공사가 보유한 토지 현황을 정리한 자료로, 각 부지의 위치, 지목, 면적, 공시지가 정보를 포함합니다. 주요 항목에는 소재지(동·지번), 지목(대·철도용지 등), 면적(㎡), 공시지가(원)가 있으며, 이를 통해 토지의 물리적 특성과 경제적 가치를 파악할 수 있습니다.이 자료를 활용하면 공사가 보유한 자산 규모와 분포를 분석할 수 있으며, 토지 활용 계획, 개발 가능성 평가, 재산 가치 산정 등에 기초 자료로 쓸 수 있습니다. 특히 위치 정보와 면적, 공시지가를 결합해 자산 포트폴리오 분석, 활용도 저평가 부지 발굴, 부동산 개발 및 매각 전략 수립이 가능하며, 도시철도 인프라 확충이나 역세권 개발 사업의 재원 계획 수립에도 중요한 참고 자료가 됩니다.
