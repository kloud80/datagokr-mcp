description_portal: '1.연간 열차별 요일별 SRT 승차율 데이터입니다. 승차율은 승객이 타고 간 거리를 열차가 운행한 좌석 거리로 나눈 값입니다.2.열차번호 9번으로 시작하는 열차는 두개의 차량이 연결된 열차의 후부 차량의 승차율을 나타낸 것입니다.3. 예시) 301(중련열차 중 전부차량의 승차율) + 9301(중련열차 중 후부차량의 승차율), (단위 : %)* 해당 데이터는 연간 주기성 데이터입니다.* 2025년 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.* 데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다'
