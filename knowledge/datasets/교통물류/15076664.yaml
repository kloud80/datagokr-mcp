summary_user: 한국도로공사가 보유하거나 출원한 지적재산권을 권리 한 건 단위로 담으며, 권리 유형(특허·실용신안·디자인·상표), 발명·기술 명칭과 개요, 출원번호·출원일자, 등록번호·등록일자를 포함한다. 도로·교통 분야 기술을 개발하는 기업이나 분석가가 "한국도로공사가 이미 특허로 보호받는 도로 기술이 무엇인지"를 확인해 유사 기술 개발을 피하거나 R&D 동향을 볼 때 쓴다. 전역 조인 키는 없고 출원번호·등록번호(applyNum·registNum)로 특허청 등 외부 특허정보와 이름·번호 매칭으로만 이어 쓸 수 있으며, 세부 부문으로 묶인 표준노드링크 같은 도로망 공간 데이터와는 직접 연결되지 않는다.
description_portal: 본 데이터는 한국도로공사에서 보유하거나 출원한 지적 재산권에 대한 현황 정보를 제공하는 OpenAPI 서비스이다.특허, 실용신안, 디자인, 상표 등의 권리 유형별로 구분되며, 각 권리의 명칭, 출원번호, 출원일자, 등록일자 등의 상세 정보를 포함한다.이용자는 해당 데이터를 통해 한국도로공사의 기술적 자산과 법적 보호 현황을 체계적으로 파악할 수 있다.데이터는 연도별, 권리유형별로 조회 가능하며, 기업 및 기관의 연구개발(R&D) 전략 수립이나 산업재산권 동향 분석에 활용될 수 있다.제공 형식은 XML 및 JSON이며, 외부 시스템과 연계하여 특허정보 통합 관리, 기술가치 평가 등의 목적에 부합하는 서비스를 구현할 수 있다.본 데이터는 공공기관의 기술 혁신 성과를 공유하고, 지식재산권 기반 정보 공개를 통해 산업 경쟁력을 제고하는 데 기여할 수 있다.또한 유사 기술 개발 방지 및 권리 보호를 위한 참고 자료로 활용 가능하다.
