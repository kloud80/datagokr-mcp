summary_user: 서울교통공사가 운영하는 역의 구내 광고시설물 현황을 역·광고시설물 종류별 수량과 담당 광고대행사 단위로 담은 파일 데이터(CSV)로, 호선·역번호·역명·데이터기준일자가 함께 들어 있다. 광고주나 광고대행사가 특정 호선·역에 어떤 광고시설이 몇 개 있고 어느 대행사가 운영하는지, 또는 아직 대행 계약이 없는 구간이 어디인지를 확인할 때 쓴다. 전역 공통 조인 키는 없어 역번호나 역명을 기준으로 같은 기관의 역 정보·승하차 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 서울교통공사 역사별 광고시설 현황 정보입니다. 해당 데이터는 역구내에 있는 광고시설물의 현황으로서 연번,호선,역번호,역명,광고시설물명,광고시설물 수량,광고대행사,데이터기준일자로 구성되어 있습니다. 호선별 광고별로 광고대행사가 각각의 대행계약에 의해 운영되고 있으며, 모든 광고도안은 한국광고자율심의 위원회의 심의를 거쳐 게첨되고 있습니다. 광고시설물에 대한 유지 보수는 광고 대행사를 통해 이루어 지고 있습니다. 해당 정보에 항목 중 광고대행상 빈칸은 현재 광고 미계약중인 구간(대행사 없음)입니다.
