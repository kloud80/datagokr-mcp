description_portal: 본 데이터는 승용차 요일제에 참여하는 가입자의 현황 정보이다. 시.구.군 발급장소, 가입상태, 운휴일 지정요일, 가입 일자 등의 세부 내용을 포함한다. 승용차 요일제는 차량 소유자가 자발적으로 주중 특정 요일에 차량 운행을 자제하여 교통 혼잡 완화 및 대기 환경 개선에 기여하는 제도이다. 해당 자료는 교통 수요 관리 정책 수립, 제도 효과 분석, 참여 활성화 방안 마련에 활용된다. 가입자 증감 추이 분석을 통해 제도 운영 성과를 평가하고 개선 방안을 도출할 수 있다. 또한 참여자에게 제공되는 각종 인센티브의 효과를 검증하고 새로운 혜택 개발에 필요한 기초 자료를 제공한다. 지역별 참여율 비교를 통해 홍보 전략 및 참여 저조 지역 집중 관리 방안을 마련한다.
