summary_user: 성남시 공영주차장을 이용한 차량의 입차·출차 일자와 주차시간(분)을 건별로 기록한 원천 데이터로, 주차장명·주소·좌표·차량유형·전체 주차면수가 함께 담긴 약 21MB 규모의 CSV 파일이다. 성남시 교통 담당자나 분석가가 "어느 공영주차장이 어느 요일·시간대에 붐비고 주차면 회전율은 얼마인가"를 따져 볼 때 쓴다. 전역 조인 키는 없어서, 전국주차장정보표준데이터 등 다른 주차장 원장과는 주차장명·주소 매칭이나 위도·경도 좌표로 이어 붙여야 한다.
description_portal: 공용주차장 입출차 현황 데이터는 공영주차장을 이용하는 차량의 입차와 출차 정보를 시간 순으로 기록한 자료입니다. 이 데이터는 주차장 관리 시스템, 무인 정산기, 차량번호 인식 카메라(LPR) 등에서 자동으로 수집되며, AI 친화 고가치 데이터로 활용이 가능합니다. 해당 데이터에는 입차일시, 출차일시, 주차시간(체류시간) 등과 같은 항목이 포함되어 있습니다. 입차일시와 출차일시는 차량의 이용 시간을 파악하는 핵심 정보이며, 이를 통해 주차장의 체류시간과 회전율을 계산할 수 있습니다. 이 데이터는 주차장의 운영 효율성을 높이기 위한 다양한 분석에 이용됩니다. 예를 들어, 시간대별·요일별 입출차 현황을 분석하면 주차장의 혼잡 시간대를 파악할 수 있고, 주차면 회전율을 계산함으로써 공간 활용도를 평가할 수 있습니다. 또한 주차요금 수입 데이터를 통해 요금정책의 적정성을 검토하고, 특정 지역의 주차 수요와 공급의 불균형 문제를 진단하는 데에도 도움을 줍니다.
