summary_user: 안산시 관내 버스정류소에 설치된 버스정보단말기(BIT)를 정류소 한 곳당 한 행으로 담은 파일로, 정류소명·단말기 종류·설치 유형·주소·위도·경도·설치년도를 기록한다(포털 설명 기준 908건). 교통 담당자나 분석가가 "우리 동네 정류소 중 도착정보 단말기가 없는 곳은 어디인가" 같은 설치 편차와 접근성 질문을 지도 위에서 확인할 때 쓴다. 정류소ID 같은 전역 조인 키는 없어서, 정류장 원장이나 실시간 도착정보와는 정류소명 매칭이나 위도·경도 근접 매칭으로 이어 써야 한다.
limits: 공통 정류소 코드가 없어 다른 정류장·노선 데이터와 정확히 1:1로 묶을 수 없고, 이름·좌표 매칭 때 동명 정류소나 좌표 오차를 주의해야 한다. 안산시 한 곳만 다루므로 다른 시군과 비교하려면 각 지자체 자료를 따로 모아야 한다.
