summary_user: 신고된 승강기 중대한 사고를 건별로 담은 원천 파일로, 1993-03-28부터 2026-07-31까지 전국 3,461건이며 발생일자·건물명·승강기고유번호·주소·사고구분을 싣는다. 건물 안전관리자나 분석가가 특정 지역이나 건물에서 중대한 승강기 사고가 언제 얼마나 있었는지 확인하는 질문에 쓴다. 주소(address)를 조인 키로 지역별 사고 통계나 건물 정보와 잇고, 승강기고유번호는 조인 키로 지정돼 있지 않아 다른 승강기 데이터와 잇는 근거는 입력에 없다.
