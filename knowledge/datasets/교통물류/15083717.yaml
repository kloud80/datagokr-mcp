summary_user: 대전시 주차안내시스템에 등록된 주차장별로 이름·주소·좌표·전화번호, 총 면수와 현재 주차 가능 면수(resQty), 기본·추가·할증 요금, 평일·토요일·공휴일 운영시간을 한 건씩 담는 실시간 조회 API다. 대전 시민이나 방문객이 목적지 근처에서 지금 빈자리가 있고 요금이 싼 주차장이 어디인지 고를 때, 또는 분석가가 시간대별 주차 혼잡을 살필 때 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터(주차장관리번호·요금·면수 원장)와는 주차장명이나 좌표·주소로 맞춰 이어 써야 한다.
description_portal: 대전광역시 실시간 주차장 정보는 대전시 주차안내시스템에 등록된 주차장을 대상으로 실시간 운영 현황, 주차 요금, 주차 가능 면수를 조회할 수 있는 서비스입니다. 주요 정보로는 주차장명, 위치(위도/경도 및 주소), 전화번호, 총 주차면수와 현재 주차 가능한 면수, 요금체계(기본 시간 및 요금, 추가 단위 시간과 요금, 할증 요금 시간대 및 금액), 운영 요일과 시간 등이 포함되어 있습니다. 이용자는 대전시 내 특정 주차장의 주차 상황 파악과 함께 요금과 영업시간 정보도 함께 확인할 수 있어, 주차장 선택과 이용이 한층 편리해집니다.
