summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 노선별 운행 차량을 노선·운수업체·차량 식별자(route_id, entrps_id, vehcle_id) 조합으로 담은 원장 데이터이며, 범위는 경기도 시도 단위이고 위치 정보는 없다. 교통 분석가나 정책 담당자가 '이 노선에 몇 대의 차량이 배정돼 있고 어느 업체가 운행하나'처럼 노선별 차량 배정 현황과 업체별 차량 운영을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 경기도 버스 노선·정류장·도착 정보 같은 같은 기관 데이터의 노선ID·업체ID와 코드를 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에 등록된 노선별 차량 정보를 제공합니다. 데이터는 노선ID, 업체ID, 차량ID로 구성되어 있으며, 각 버스 노선에 어떤 차량이 운행되고 있는지를 확인할 수 있습니다. 이 정보는 버스 노선별 차량 배정 현황을 파악하거나, 특정 노선의 운영 안정성 분석, 운수업체별 차량운영 패턴 평가 등에 활용될 수 있습니다. 또한 이 데이터는 교통정책 수립이나 교통흐름 시뮬레이션, 긴급상황 시 노선별 차량 위치 추적 시스템 설계의 기초 자료로도 활용이 가능합니다.
