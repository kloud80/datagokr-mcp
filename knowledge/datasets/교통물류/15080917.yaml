summary_user: SRT 역별로 월간 하차인원(명)을 집계한 파일 데이터로, 역 하나가 한 행이고 2019년 1월부터 월별 값이 열로 펼쳐진 와이드 형태입니다(포털 설명상 2024년 9월까지). 분석가나 지자체·상권 사업자가 'SRT 개통역 중 어느 역으로 내리는 승객이 코로나 이후 얼마나 회복됐나'처럼 역별 고속철 도착 수요와 그 추이를 볼 때 쓴다. 전역 조인 키가 없어 역 코드 대신 하차역 이름을 매핑해 같은 기관의 승차인원 자료나 역 위치 데이터와 이어 써야 합니다.
description_portal: '1. 이 데이터는 주식회사 에스알이 운영중인 고속열차 SRT의 승객 관련 자료입니다. 2. 2019년 1월 ~ 2024년 9월 기간의 SRT 역별 월간 하차인원을 제공하는 자료입니다.3. 예시) 수서역 2019년 1월 하차인원은 635,413입니다. (단위 : 명)4. 데이터값이 공란인 부분은 미집계 데이터로 공란 처리하였습니다.* 해당 데이터는 연간 주기성 데이터입니다.* 2024년 9월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.'
