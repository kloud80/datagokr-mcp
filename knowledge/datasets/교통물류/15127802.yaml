summary_user: 경기도 파주시가 관리하는 농어촌도로를 노선 단위로 담은 파일로, 읍면동·노선명·노선번호·도로종류·고시번호와 고시일자, 기점과 종점의 지번주소·위경도, 주요경과지, 노선연장(km)을 한 행씩 기록한다(CSV 약 11KB). 파주시 어느 읍면동에 어떤 농어촌도로가 고시돼 있고 노선 길이가 얼마인지 확인하려는 주민·연구자, 또는 농어촌도로 노선을 지도에 그려 접근성을 보려는 분석가가 쓴다. 전역 조인 키는 없어 표준노드링크(link_id·node_id) 등과는 기점·종점 좌표나 노선명·읍면동명 매핑으로만 이어 쓴다.
description_portal: 경기도 파주시 농어촌도로현황에 대한 공공데이터로 읍면동명, 노선명, 노선번호, 도로종류, 고시번호, 고시일자, 기점지번주소, 기점위도, 기점경도, 종점지번주소, 종점위도, 종점경도, 주요경과지, 노선연장(km) 등으로 구성되어 있습니다. 이 데이터는 위치 기반 애플리케이션, GIS 시스템과의 연동, 실시간 경로 분석 및 시각화, 지도를 기반으로 한 경로 탐색 기능, 지역별 도로 정보 시각화, 도로별 통계 분석 기능 등의 구현, GPS 기반의 다양한 서비스와의 연계, 교통 정책 수립, 농어촌 개발 계획, 공간정보 연구, 인프라 개선을 위한 기초 자료, 교통 접근성 평가, 지역 간 연결성 비교, 농어촌 교통 인프라 발전 방향 제시 등의 연구 등에 활용될 수 있습니다.
