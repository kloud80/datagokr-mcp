summary_user: 서울시 도로에 설치된 험프(과속방지턱)를 한 개씩 기록한 건별 원천 데이터로, 관리번호·유형·관할사업소·자치구·설치일·교체일과 공간정보(EPSG:5186 좌표계)를 담는다. 구청·교통 분석가가 "우리 동네 이면도로나 학교 주변에 과속방지턱이 어디에 언제 설치됐고 언제 교체됐는가"를 확인하거나, 주민이 집 근처 과속방지턱 현황을 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 자치구 코드(GU_CD)나 경찰서 코드 같은 기관 코드, 또는 이름 매핑으로 어린이보호구역·단속카메라 등 다른 도로 안전 데이터와 연결한다.
description_portal: '서울시 험프 관련 정보입니다.(좌표계: EPSG:5186) (험프관리번호, 유형, 관할사업소, 설치일, 교체일 등 정보 제공)*용어설명  험프 : 차량의 과속을 방지하고 보행자 안전을 확보하기 위해 도로 위에 설치한 돌출된 구조물 흔히 “과속방지턱(speed hump)” 또는 “도로 요철” 이라고도 함. (설치목적) 차량 속도를 줄여 보행자 보호 (특히 어린이 보호구역, 학교 주변, 이면도로 등), 교통사고 예방 및 보행자와 차량 간 안전 확보, 불법 주·정차 억제 효과 등※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
