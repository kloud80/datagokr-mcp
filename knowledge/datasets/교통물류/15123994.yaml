summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 버스를 차량 한 대당 한 행으로 담은 원장으로, 차량ID·차량번호·소속 운수업체ID·제조사·차량 모델명을 포함한다. 분석가나 정책 담당자가 '어느 운수업체가 어떤 제조사·모델의 버스를 몇 대 운영하는가'처럼 업체별 차량 구성을 확인할 때 쓴다. 전역 조인 키는 없어 노선·정류장·도착정보 같은 다른 경기도 버스 데이터와는 차량ID·업체ID 등 같은 기관 내부 코드나 차량번호 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에 등록된 버스 차량의 상세 정보를 포함합니다. 주요 항목은 차량ID, 차량번호, 업체ID, 차량 제조사, 차량명(모델명)으로 구성되어 있으며, 차량의 개별 식별 정보와 소속 운수사, 제조 브랜드 및 차종에 대한 정보를 제공합니다. 이 데이터는 노선별 차량 배차 계획 수립, 운송업체별 차량 운영 현황 분석, 차량 노후화 및 교체 주기 검토, 운행 차량의 품질관리 및 민원 대응 자료로 활용할 수 있습니다. 또한 대중교통 서비스 개선을 위한 데이터 기반의 정책 수립 및 분석에 중요한 기초자료가 됩니다.
