summary_user: 전국 17개 시도별로 1주간 대중교통 이용횟수, 한달 평균 대중교통비용, 주 이용수단(버스·도시철도) 비율, 교통카드·정보제공·환승서비스 이용률, 환승횟수를 담은 시도 단위 집계표이며, 대중교통 이용자 만족도 조사 결과의 일부로 991바이트 크기의 작은 CSV 파일이다. 정책 분석가나 지자체 담당자가 '우리 지역 주민은 다른 시도보다 대중교통을 얼마나 자주 타고 환승은 몇 번 하는가'처럼 지역 간 이용·환승 실태를 비교하는 데 쓴다. 지역이 행 대신 열(서울~제주)로 놓인 가로형 표이고 전역 조인 키가 없어, 다른 시도 단위 통계와는 시도 이름을 매핑해 이어 쓴다.
