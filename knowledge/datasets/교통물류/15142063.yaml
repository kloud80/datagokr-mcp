summary_user: 버스 노선별·정류장 순서별·시간대별 평균 차내 재차인원(avg_scdtm_nope)을 운행일자 기준으로 담은 API이며, 검증 호출에서는 전국 382행(시군구 단위, 2025-08-01 하루)이 수신됐다. 교통 분석가나 지자체 담당자가 특정 노선의 어느 시간대·구간이 혼잡한지, 배차 간격을 조정할 근거가 있는지 확인하는 데 쓴다. 시군구코드(sgg_cd)와 정류장ID(sttn_id, 정류장 키 busstop_sttn_id)로 정류장·노선 원장이나 도착정보 데이터와 이어 쓰며, 노선ID(rte_id)는 조인 키로 명시돼 있지 않다.
description_portal: '버스 노선별 차내 재차 인원 정보는 특정 지역의 각 버스 노선별 승객 수 데이터를 기록하고 분석한 자료로, 대중교통 서비스 개선과 운영 효율화를 위한 중요한 자료로 활용됩니다. 활용 방안: 승객 수에 따라 배차 간격 및 차량 수 조정. / 노선별 수익성 분석을 통한 자원 배분. / 특정 시간대나 노선의 수요에 맞춘 서비스 제공. / 승객 수요에 기반한 노선 변경 및 신규 노선 추가. / 혼잡 구간 개선 및 대체 교통 수단 제공. / 혼잡도 감소 및 차량 내 공간 최적화를 위한 보조지표로서 대중교통 노선별 특성을 파악할 수 있는 지표입니다.'
