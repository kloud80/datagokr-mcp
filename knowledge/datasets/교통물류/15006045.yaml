summary_user: 통영시 관내에서 허가·등록을 받아 운송사업을 하는 업체를 한 행에 한 곳씩 담은 건별 목록으로, 업체명·도로명 소재지·전화번호가 들어 있으며 파일 크기는 약 1.2KB(1188 bytes)로 작습니다. 통영에서 화물을 맡길 운송업체를 찾는 사업자나, 특정 업체가 관내 허가·등록 운송사인지 확인하려는 사람이 쓴다. 전역 조인 키가 없어 업체명이나 도로명주소를 맞춰 전국화물자동차운송사업자표준데이터 등 다른 운송사업자 자료와 이어 쓴다.
