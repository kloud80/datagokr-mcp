description_portal: 통영시 운송업체 현황 데이터는 통영시 관내에서 운송사업을 영위하는 업체의 등록 및 허가 정보를 체계적으로 관리하기  위해 구축된 행정 기반 데이터입니다. 본 데이터는 운성사업버령 및 지방자치단체 졸몌에 따라 허가, 등록된 운송업체를 대상으로 하며,  사업자명, 소재지, 연락처 등 운송업체 운영에 필요한 주요정보를 포함하고 있습니다. 최신 행정자료를 기반으로 주기적으로 현행화되며, 지역 내 운송업체의 운영 실태 파악 등에 활용될 수 있습니다. 또한 공공, 민간에서 교통 및 물류 관련 연구, 서비스 설계, 행정 모니터링 등 다양한 목적으로 활용이 가능합니다.
