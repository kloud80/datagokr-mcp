summary_user: '서울교통공사 지하철의 권종(선불·후불·정기권·우대권·1회권·단체권)별 승차인원을 월별·역별·호선별로 담은 파일 데이터이며, 검증 수신 기준 20,579행이다. 분석가나 상권 담당자가 특정 역·호선의 월별 승차 규모와 권종 구성(예: 우대권 비중)을 확인하는 질문에 쓴다. 전역 조인 키는 없고, 같은 기관 데이터와는 고유역번호(외부역코드)·역명·호선으로, 다른 기관 자료와는 이름·코드 매핑을 거쳐 이어 쓴다.'
description_portal: 서울교통공사의 권종별(선불, 후불, 정기권, 우대권, 1회권, 단체권) 승차인원(월별, 역별, 호선별) 데이터입니다. 2025년 12월 데이터까지 업데이트 합니다. 승차인원의 경우 해당역에서 개표를 하고 들어간 인원을 의미합니다. 선불은 교통카드를 이용전에 충전한 것을 의미하며, 후불은 교통카드 사용 실적에 따라 후에 정산하는 것을 의미합니다. 정기권의 경우에는 지하철 이용을 많이 하는 승객에 대해서 할인하는 제도이며, 우대권은 경로, 장애인, 국가유공자가 포함됩니다. 마지막으로 단체권의 경우에는 한번에 많은 인원이 이용해야 할 경우 사용하는 권종을 의미합니다.
