description_portal: 교통사고 감소와 보행자 안전 확보를 위한 교통안전시설 개선 정책 강화, 고령화 사회 진입에 따른 교통약자 보행안전 인프라 확충 필요성 증대, 그리고 보행친화도시 조성과 안전한 보행환경 구축을 위한 체계적 횡단시설 관리 요구에 따라 보령시는 관내 횡단보도 현황을 종합적으로 관리하고 있습니다. 횡단보도는 보행자의 안전한 도로 횡단을 보장하는 핵심 교통안전시설로서 일반 횡단보도부터 자전거 겸용, 고원식 횡단보도 등 다양한 형태로 설치되어 지역별 교통여건과 보행자 특성에 맞는 맞춤형 안전시설을 제공하고 있습니다. 각 횡단보도의 규격, 신호등 설치현황, 차로수 등의 세부정보를 데이터베이스화하여 교통사고 위험지역 분석과 안전시설 개선 우선순위 결정, 보행자 편의시설 확충 계획 수립에 활용하며, GIS 좌표를 통한 공간분석으로 보행안전 정책의 효과성을 평가하고 있습니다.
