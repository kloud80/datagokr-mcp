summary_user: 경기도 버스운행관리시스템(BMS)에서 쓰는 휴일·특별일자 목록으로, 연도별로 날짜(YYYYMMDD)마다 일자구분·요일구분과 설날·추석·광복절 같은 일자내용을 한 행씩 담는다. 버스 배차·운행 분석가가 '이 날짜가 경기도 버스 운행 기준으로 평일인가 휴일·특일인가'를 판정해 승하차·운행 실적을 평일/휴일로 나눠 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 버스 노선·운행 데이터와는 날짜(ymd) 값을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 관내 BMS(버스운행관리시스템)에서 휴일 또는 특별일자를 관리하기 위해 구축된 자료로, 각 연도별 주요 일자의 구분 및 성격을 기록하고 있습니다. 항목에는 ‘년도’, ‘일자’, ‘일자구분’, ‘요일구분’, ‘일자내용’ 등이 포함되며, ‘일자’는 YYYYMMDD 형식으로 표현되고, 일자내용’은 설날, 추석, 광복절 등 특정 기념일에 대한 텍스트 정보가 입력되는 경우가 있습니다. 이 데이터는 버스 노선 및 배차 계획, 휴일 대비 교통 흐름 예측, 특일 운행 일정 수립, 정류장 운영 정책 조정 등 다양한 교통행정 및 공공 서비스에 활용될 수 있습니다. 특히 휴일이나 기념일 등의 정보를 바탕으로 교통량 예측 및 운수 종사자 근무 조정 등에도 중요한 기준 자료로 사용됩니다.
