summary_user: 성남시 보행자 전용도로를 한 구간씩 담은 건별 원천 파일로, 도로명·법정동·지정일자·운영 시간(평일·주말)·시작점과 종료점 좌표·폭·보차분리 여부와 CCTV·보안등·횡단보도·점자블록 같은 안전시설 설치 개수를 담는다. 시민이나 도시계획 분석가가 '우리 동네 보행자 전용도로가 어디에 있고 언제 차량이 통제되며 안전시설은 얼마나 갖춰졌나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군구명·법정동명 같은 이름이나 시작·종료점 위경도 좌표로 다른 공간 데이터와 맞춰 이어 쓴다.
description_portal: 경기도 성남시 보행자 전용도로 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다.경기도 성남시의 보행자 전용도로 데이터는 시민의 안전하고 편리한 보행 환경을 조성하기 위해 구축된 공간정보 자료입니다. 이 데이터는 성남시 전역에 분포된 보행자 전용도로의 정보를 포함하고 있으며, 보행 중심의 도시 정책 수립과 보행환경 개선사업의 기초 자료로 활용됩니다. 해당 데이터는 주로 GIS(지리정보시스템) 형식인 SHP(쉐이프파일) 또는 CSV 형식으로 제공되며, 성남시청, 경기도청 및 공공데이터포털(data.go.kr) 등에서 확인하거나 내려받으실 수 있습니다. 이를 통해 도시계획, 교통안전, 스마트시티 설계 등 다양한 분야에서 과학적이고 효율적인 정책 추진이 가능하며, 특히 보행자 중심의 도시 공간 조성을 위한 기반 자료로 매우 유용하게 활용되고 있습니다.
