description_portal: 경상남도 교통·물류 분야에서 제공하는 ‘택시업체 현황’ 데이터셋은 도내 택시 영업법인 및 개인사업자의 면허 현황과 보유 차량 수량을 시군별로 정리한 자료입니다. 본 데이터는 경상남도 관할 18개 시·군 기초자치단체의 택시운송사업자 등록 현황 및 법인·개인 택시 면허 대수 정보를 제공합니다.경상남도 내 지역별 택시 운송 공급 규모와 운송사업자(업체)의 분포 상태를 체계적으로 파악하고, 법인택시 및 개인택시의 면허 보유 비중을 종합적으로 관리하기 위해 수집되었습니다.주요 제공 항목으로는 행정구역을 나타내는 시군명, 일반(법인)택시 구분, 지역별 등록된 일반택시 업체수, 법인택시 인가 면허 대수(대), 개인택시 인가 면허 대수(대) 정보가 포함되어 있습니다.
