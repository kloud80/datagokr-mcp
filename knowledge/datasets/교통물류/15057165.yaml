summary_user: 경기도 시군별 일반택시 운송업체의 인허가·등록 정보를 업체(사업장) 한 곳당 한 행으로 담으며, 사업장명, 인허가일자, 영업상태, 폐업일자, 면허 유효기간, 소유 형태, 업체 유형, 도로명·지번 주소, 위도·경도 좌표가 들어 있다. 교통행정 담당자나 분석가가 "우리 시군에 영업 중인 법인·개인 택시업체가 어디에 몇 곳 있는가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 시군 코드·시군명(SIGUN_CD)이나 사업장명·주소를 맞춰 잇거나 좌표로 지도에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 31개 시군 내 일반택시 운행업체에 대한 인허가 및 등록 정보를 제공하며, 사업장명, 인허가일자, 영업상태, 소재지 주소(도로명 및 지번), 면허 유효기간, 등록일자, 업체 유형 및 지정정비업종명, 위도·경도 좌표(WGS84 기준) 등으로 구성되어 있습니다. 해당 업체들은 유상으로 여객을 운송하는 일반택시 서비스를 운영하고 있으며, 각 업체의 소유 형태와 유형도 함께 제공됩니다. 데이터는 교통행정, 택시 서비스 품질 평가, 지역 교통 인프라 분석, 민간 교통업체 관리 정책 수립 등에 활용될 수 있습니다. 다만, 지방행정데이터개방시스템 개편에 따라 2018년 9월 이후로 데이터 갱신이 중단된 상태입니다. Open API를 통해 시군별 택시업체 정보를 조회할 수 있도록 설계되어 있습니다.
