summary_user: 한국건설기술연구원이 제공하는 상시월간 교통량 통계로, 조사연도(EXMN_YR)·지점 번호·시간대별로 일요일부터 토요일까지 요일별 교통량과 시간 평균 교통량, 시간 환산율을 담은 집계 자료이며 범위는 전국이다. 교통 분석가나 도로 계획 담당자가 특정 상시조사 지점에서 요일·시간대에 따라 교통량이 어떻게 달라지는지, 시간 교통량을 하루 교통량으로 환산하는 비율이 얼마인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 지점 번호나 이름을 별도로 매핑하거나 같은 기관 코드로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 상시월간 교통량 통계 정보입니다.\""
