summary_user: 대구광역시 ITS가 DSRC 장비로 하이패스 부착 차량을 검지해 만든 교통소통 통계로, 일자·시작시간·구간이름별 평균 속도와 통과시간을 시간 단위 집계로 담으며 포털에서 약 11.8MB 크기의 CSV 파일로 받는다. 교통 분석가나 시 교통정책 담당자가 "대구의 어느 도로 구간이 몇 시에 상습적으로 막히는가"를 확인할 때 쓰고, 이력을 쌓으면 상습 정체 분석의 기준 자료가 된다. 실측 컬럼에 전역 조인 키나 구간 코드가 없어, 다른 링크·도로 데이터와는 구간이름을 문자열로 매핑해야 연결된다.
description_portal: 대구광역시 구간별, 시간별 통계는 지능형교통시스템(ITS)를 통해 수집되는 교통소통정보를 제공하는 통계자료입니다. DSRC(Dedicated Short Range Communications, 단거리 전용 통신)장비를 통해 하이패스를 부착한 차량을 검지한 데이터를 기반으로 일시, 구간명, 속도, 통과시간값을 제공합니다. 해당 자료를 통해 시간대별 평균 속도를 분석하여 특정 도로 구간의 교통 흐름 파악 및 혼잡 시간대를 예측할 수 있으며, 도로 개선이나 교통정책 수립에 필요한 결과값을 추출할 수 있습니다.
