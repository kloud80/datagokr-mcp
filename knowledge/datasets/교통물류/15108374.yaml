summary_user: 서울교통공사가 운영하는 9호선 2·3단계 구간(언주~중앙보훈병원)의 역별·일별 승하차인원을 승차/하차 구분과 승객유형(일반·어린이·청소년·무임·기후동행카드 등)별로 나눠 담은 집계 파일입니다. 분석가나 사업자가 '9호선 연장 구간 특정 역의 하루 이용객은 얼마이고, 무임·기후동행카드 승객 비중은 어떤가'를 따져 역 주변 유동인구를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노선·역 데이터와는 역명이나 고유역번호(외부역코드)를 같은 기관 코드 기준으로 매핑해 이어 쓴다.
