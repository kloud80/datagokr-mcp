summary_user: 인천 서구에 등록된 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 원천 목록으로, 업체명·면허종류·사업장 주소·현재 운영 여부·데이터기준일자를 수록하며 범위는 시군구 단위이고 위치는 개별 주소로 나온다. 화물 운송을 맡기려는 사업자나 지역 물류를 보는 분석가가 '서구에서 지금 운영 중인 일반화물 운송업체는 어디이고 어떻게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 업체명·주소를 기준으로 전국화물자동차운송사업자표준데이터나 다른 지자체 화물운송업체 목록과 이름 매칭으로 이어 쓴다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와는 업체명·주소 매칭으로만 연결되며, 동명 업체나 주소 표기 차이에 주의해야 한다. 인천 서구 등록 업체만 담고 있어 다른 시군구나 전국 현황은 이 파일로 알 수 없다.
