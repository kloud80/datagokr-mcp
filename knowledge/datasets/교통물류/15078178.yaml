summary_user: 광주광역시 서구에 등록된 전기자동차 대수를 읍·면·동별로 집계한 파일 데이터로, 시군구·읍면동·등록대수 세 항목만 담은 작은 표(CSV 551바이트)다. 지자체 담당자나 충전사업자가 서구 안에서 전기차가 많은 동과 적은 동을 비교해 충전 인프라 확충 우선지역을 정할 때 쓴다. 법정동·행정동 코드 같은 전역 조인 키가 없어, 다른 동별 통계나 충전소 위치 데이터와는 읍면동 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 광주광역시 서구에 등록된 전기자동차의 읍·면·동별 등록대수 현황을 수록한 자료입니다. 행정구역(읍·면·동) 단위로 등록대수를 제공하여, 서구 내 전기차 보급 수준과 지역별 분포 특성(생활권별 편차)을 파악할 수 있는 기초 지표로 활용됩니다.이 데이터는 서구 지역의 전기차 도입 현황을 공간적으로(동 단위로) 정량 분석할 수 있게 하며, 보급이 집중되는 지역과 상대적으로 낮은 지역을 비교함으로써 친환경 교통수단 전환 흐름을 점검하는 데 유용합니다. 또한 읍·면·동별 분포를 기반으로 충전 인프라 확충 우선순위, 공영주차장·주거밀집지 등 입지 검토, 보급 촉진 사업의 대상 지역 설정 등 정책 설계 및 사업 기획에 참고될 수 있습니다.
