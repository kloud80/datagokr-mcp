summary_user: 경기도 도로대장전산화시스템에 등록된 도로 절개면을 한 건씩 담은 원천 목록으로, 노선번호·구간번호, 시점·종점 위치와 좌표, 방향, 연장, 사면 종류(흙·암반·혼합 등), 최대·최소 높이, 경사도를 담는다. 도로 관리자나 재해 분석가가 '이 노선 구간에 높고 가파른 암반사면이 어디 있는가'를 찾아 붕괴위험 점검 대상을 고르거나 GIS 지도에 올리는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 노선번호(route_no)·구간번호 같은 이름·번호 매칭이나 같은 기관(경기도) 도로대장 데이터끼리, 또는 시점·종점 좌표를 이용한 공간 매칭으로 잇는다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템을 기반으로 도로 절개면 정보를 제공하며, 노선번호, 구간번호, 시점 및 종점 위치, 방향, 연장, 절개면 종류(흙사면, 암반사면, 혼합사면 등), 최대 및 최소 높이, 경사도, 공간좌표 등의 항목으로 구성되어 있습니다. 도로절개면은 도로 개설 시 산지나 경사지를 절단하여 평탄한 도로를 확보하는 데 사용되는 구조물로, 토질 특성과 사면 안정성에 따라 설계와 관리가 중요합니다. 본 데이터는 도로구간별 절개사면의 구조적 특성 파악, 붕괴위험 지역 진단, 유지보수 계획 수립, GIS 기반 도로안전 인프라 지도 구축 등에 활용됩니다. 특히 도로재해예방계획, 도시개발계획, 사면관리계획 수립 등의 기초자료로 유용하게 사용될 수 있으며, 공간정보 기반 분석을 통해 재난 예방과 도로환경 개선에도 기여할 수 있습니다.
