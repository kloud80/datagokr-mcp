description_portal: 인천교통공사 인천 1호선 휴일 첫차 막차 운행시각에 대한 정보로 2025. 4. 12일 기준 자료입니다. 해당 데이터는 역사명, 첫차시각(상선), 첫차시각(하선), 막차시각(상선), 막차시각(하선)으로 구성되어있습니다.인천지하철 1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역을 운영하고 있습니다.첫차와 막차 시각은 역별로 상이하나 전체적인 열차운행은 05시 30분에 시작하여 익일 01시 01분에 종료됩니다.이 자료는 2025년 6월 28일 개통한 인천 1호선 3개역(검단호수공원역, 신검단중앙역, 아라역)이 반영된 데이터입니다.
