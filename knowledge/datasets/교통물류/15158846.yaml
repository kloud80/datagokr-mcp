summary_user: 서울시설공단이 관리하는 도시고속도로 가로등주(위치인식표지)별 시설물번호, 노선·방향, 위경도 좌표, 관할 구청·경찰서, 제한속도 등을 담은 건별 현황 API로, 검증 시 984건을 모두 수신했다. 도로 이용자나 민원 담당자가 도시고속도로에서 파손·사고 지점의 가로등주 번호로 정확한 위치와 관할 주체를 확인하려는 질문에 쓴다. 전역 조인 키는 없고 시설물번호(lightcd)나 관할구청·노선명 같은 이름 매핑, 또는 좌표(위도·경도)와 같은 기관 코드로만 다른 도로 시설물 데이터와 이어 쓴다.
description_portal: 본 자료는 도시고속도로 가로등주에 부여된 고유 식별 번호와 해당 시설물의 정밀한 위치 데이터를 결합하여 구축한 위치 정보 통계셋입니다. 도로 이용자가 가로등주의 고유번호를 기반으로 현재 위치 정보를 조회함으로써, 도로 파손이나 안전사고 발생 시 시설물별 소관 관리주체에 민원 및 신고 사항을 신속하고 정확하게 접수할 수 있도록 지원합니다. 이 데이터는 복잡한 도시고속도로 환경에서 모호한 위치 설명으로 인한 신고 접수 지연을 방지하고, 민원 처리 프로세스를 효율적으로 최적화하는 데 필수적인 자산입니다. 공공 인프라의 선제적 시설 유지관리는 물론, 실시간 민원 연계 시스템 구축, 민간 안전 서비스 플랫폼과의 데이터 연동 등 다방면의 행정 서비스 개선 자료로 폭넓게 활용될 수 있습니다.
