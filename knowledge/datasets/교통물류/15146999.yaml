summary_user: 교통영향평가에서 사업지 주변 유사시설을 일별로 조사한 이용 교통수단 교통량을 담은 전국 단위 원천 파일(CSV)로, 유사시설별로 이용·상근 인구와 평일·휴일을 나눠 화물·승용·택시·버스·도시철도·자전거·도보 등 수단별 값을 기록한다. 교통영향평가를 준비하는 사업자나 분석가가 "비슷한 시설 이용자는 승용차와 대중교통을 각각 얼마나 쓰는가"를 확인해 수단분담률 원단위를 잡는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 유사시설 식별자(유사시설아이디)나 시설명으로 같은 교통영향평가 계열 데이터와 맞춰 잇는 방식으로만 연결한다.
limits: 표준 행정코드나 좌표 같은 전역 조인 키가 없어 지역·시설 원장과 바로 결합하기 어렵다. 비공간 데이터라 시설 위치 기반 분석에는 별도 매핑이 필요하다.
