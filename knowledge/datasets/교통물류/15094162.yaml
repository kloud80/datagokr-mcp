summary_user: 시도·시군구별로 노인 교통사고의 발생건수, 사망자수, 부상자수(중상·경상·부상신고 합)를 묶은 집계 통계로, 경찰이 조사·처리한 인적 피해 사고만 담은 전국 범위의 작은 CSV 파일(약 7KB)이다. 지자체 담당자나 분석가가 '우리 시군구의 노인 교통사고 사망·중상 규모가 다른 지역보다 큰가'를 비교해 노인보호구역·안전 대책 우선순위를 정할 때 쓴다. 전역 조인 키나 행정코드가 없어 시도·시군구 이름을 맞춰 인구 통계나 다른 교통사고 통계와 이어 써야 한다.
description_portal: '- 시도 시군구별 노인 교통사고 통계(사고건수,사망자수, 부상자수, 중상, 경상, 부상신고)  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨- 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함'
