summary_user: 강릉·경주·부산·여수·전주 5개 도시의 주요 관광지별로, 방문한 외지인의 세대구성(싱글·신혼·영유아·어린이 자녀가족·청소년 자녀가족·성인 자녀가족·실버) 비율을 신한카드 라이프스테이지 기준으로 정리한 집계 파일(xlsx)이다. 관광 상품 기획자나 지자체 담당자가 "전주 한옥마을에는 가족 단위와 1인 방문 중 어느 쪽이 많은가"처럼 관광지별 방문객 가족구성 패턴을 비교할 때 쓴다. 전역 조인 키나 행정구역 코드는 없어서, 다른 관광·교통 데이터와는 지자체명이나 관광지명을 이름 그대로 맞춰 이어 쓴다.
