description_portal: 이 데이터는 강릉, 경주, 부산, 여수, 전주 등 5대 도시의 주요 관광지를 방문한 외지인(타지역 거주자)을 대상으로 신한카드의 라이프스테이지(가족구성) 기준에 따라 세대구성별 방문 비율 정보를 정리한 것입니다. 즉, 각 도시별 관광지에 방문한 외지인의 가족구성이 어떤 형태(예를 들어 1인 가구, 2인 가족, 3~4인 가족, 다인가구 등)로 분포하는지 비율로 확인할 수 있습니다.이 데이터를 통해 어떤 도시의 주요 관광지에 혼자 방문하는 경향이 많은지, 혹은 가족 단위, 친구/지인 단위 방문이 많은지 등 세대구성별 주요 방문 패턴을 파악할 수 있습니다. 이를 통해 도시별 관광 트렌드, 가족 관광지로서의 선호도, 1인 여행 증가 추세 등이 유추되며, 특정 시군구/관광지 별로 타깃 마케팅 전략을 세우는 데도 활용할 수 있습니다.이 자료는 도시 및 지역별 관광 정책 수립, 가족 단위나 개인 여행객을 위한 관광 상품 개발, 관광지 운영 및 마케팅 전략, 관광객 유형별 서비스 기획, 다양한 가족구성 형태에 맞는 관광 인프라 조성 등 다양한 분야에서 참고자료로 활용될 수 있는 기초 데이터입니다.
