summary_user: 드론(초경량비행장치) 전문교육기관 지정 현황을 시도별로 집계한 작은 표(CSV 213바이트)로, 시도마다 일반 전문교육기관과 비영리 전문교육기관의 수를 나눠 담는다. 드론 조종자격을 따려는 사람이나 교육사업을 검토하는 사업자, 분석가가 "우리 지역에는 지정된 드론 전문교육기관이 몇 곳 있나"를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 드론 데이터(신고 기체·조종자격 취득 현황 등)와는 시도 이름(구분)을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 항공안전법 제126조에 따라 국토교통부장관은 초경량비행장치 조종자를 양성하기 위하여 국토교통부령으로 정하는 바에 따라 초경량비행장치 전문교육기관(이하 “초경량비행장치 전문교육기관”이라 한다)을 지정할 수 있다. 드론 전문교육기관 지정의 업무를 위탁받아 수행하고 있으며, 드론 조종자 양성을 위해 노력하고 있다. 초경량비행장치 사용사업체(또는 비영리단체)는  시설, 인력, 장비 및 교육훈련규정 기준 충족한 후 서류 및 현장심사를 통해 전문교육기관이 지정될 수 있다. 해당 자료는 시도별 전문교육기관 현황자료이다.
