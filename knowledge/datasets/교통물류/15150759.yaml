summary_user: 경찰청이 제공한 노인 보행자 관련 교통안전 위험요소를 지점 단위로 담은 데이터로, 위험요소 대·중·소분류 코드, 지번·도로명 주소, 위경도, 관련 링크 ID, 기준일자, 상세내용이 들어 있으며 범위는 전국이다. 지자체 교통·안전 담당자나 분석가가 "우리 동네에서 노인 보행자에게 위험한 지점은 어디인가"를 확인해 보행환경 개선이나 노인보호구역 지정 검토에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소 문자열이나 위경도 좌표로 공간 매칭해 잇고, 관련 링크 ID(RLTN_LNK_ID)는 도로 링크 체계와의 연결 후보로만 본다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-보행자별 데이터는 경찰청에서 제공하는 정보입니다.
