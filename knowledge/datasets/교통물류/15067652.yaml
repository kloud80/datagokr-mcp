summary_user: 전국 철도역 215곳을 역 하나당 한 행으로 담은 파일 데이터로, 주소·위도·경도 좌표, 한·중·영 역이름, 관련 노선, 소속지사, 역등급, 열차 정차 횟수, 역소개와 연혁을 싣는다. 시민이나 분석가가 특정 역이 어느 노선·지사에 속하고 어디에 있는지, 역세권 범위를 어디까지 볼지 따질 때 쓴다. 주소(address)와 위도·경도 좌표(coord)를 키로 다른 위치 데이터와 이어 쓰며, 역 좌표 기준의 역세권 판정과 환승·출입구 데이터의 기준 마스터로 연결한다.
description_portal: '대한민국 철도역의 정보를 제공합니다.한국어/중국어/영어의 역이름을 제공합니다. 각역의 위도 및 경도 좌표와 관련된 노선 정보 제공합니다.역을 관리하고 있는 소속지사 정보 제공합니다.역소개란에는 역의위치 및 역의 주요역할내용이 정리되어 있으며, 주요 변경내용도 있습니다.역연혁은 역의 주요 사건들이 날짜/ 내용 형식으로 정리되어있습니다.ex) 서울역의 경우1900.07.08 경성역으로 영업개시1905.03.24 남대문역으로 역명 개칭 (경성 남대문)1915.10.15 경성역으로 명칭 환원(남대문 경성)1922.06.01 현 서울역사 신축 착공1923.05.20 현 서울역사 정초1925.09.30 현 서울역사 준공1925.10.15 현 서울역에서 영업개시1947.11.01 서울역으로 역명 개칭(제공정보: 주소,위도좌표,역등급,관련노선,열차정차횟수,역이름,소속지사, 역연혁,경도좌표, 역이름_중국어, 취급업무, 역이름_영어, 역소개, 입력일)'
