description_portal: '공항정보는 각 공항을 고유하게 식별하기 위해 부여된 공항식별자와 해당 공항의 공식 명칭에 대한 내용을 포함하고 있습니다.공항식별자 :  국제민간항공기구(ICAO) 기준에 따라 영문 대문자 4자리로 구성되며, 전 세계 공항에 중복 없이 부여되는 고유 코드입니다.해당 식별자는 항공기 운항계획 수립, 항공 노선 및 공역 설계, 항공 관제, 항공 통계 분석, 출입국 관리, 항공 보안, 각종 시스템 간 데이터 연계 등 다양한 항공 분야에서 기준 정보로 활용됩니다.공항 공식명칭 : 해당 공항을 공식적으로 지칭하는 명칭입니다.'
