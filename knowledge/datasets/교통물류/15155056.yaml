summary_user: 전국 자치단체가 관리하는 국제물류주선업 인허가 정보를 업체별 건 단위로 담은 API로, 전체 3,128건이며 인허가일자·영업상태·사업장명·소재지주소·좌표 등을 제공한다. 화주나 분석가가 "이 국제물류주선업체가 허가받은 업체인지, 영업 중인지" 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 키로 다른 주소 기반 데이터와 이어 쓰며, 화물자동차 운송·주선 허가 원장인 전국화물자동차운송사업자표준데이터와 함께 보는 용도가 가능하다.
description_portal: '기타_국제물류주선업 데이터는 수출입 화물의 물류를 주선하는 국제물류주선업을 하는 업체 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 국제물류주선업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 국토교통부 물류정책과 / 044-201-4005 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
