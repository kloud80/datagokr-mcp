summary_user: 제주특별자치도 안에서 물류창고를 관리·운영하는 호스트(업체)를 업체 한 곳씩 담은 건별 원천 목록이다. 창고 유형, 운영상태, 업체명, 대표자, 사업자번호, 업종, 주소를 함께 담으며 파일 크기는 약 10KB(csv)다. 제주에 들어갈 물류창고를 찾는 사업자나 제주 물류 인프라 입지를 보는 분석가가 "제주에서 지금 운영 중인 냉장·상온 창고 업체는 어디에 있나" 같은 질문에 쓰고, 표준 조인 키는 없으므로 사업자번호(사업자번호)로 기업 정보와 맞추거나 주소로 지역 데이터와 대조해 잇는다.
description_portal: '"제주특별자치도 내 물류창고호스트정보 데이터를 제공합니다.항목: 공간창고타입, 운영상태, 업체명, 대표자명, 사업장번호 등* 제주특별자치도 내 물류창고를 관리·운영하는 호스트(업체)에 대한 정보를 기록한 자료입니다.제주특별자치도 디지털혁신과에서 관리하며, 물류창고의 운영 상태, 업체명, 사업자번호, 업종, 대표자명, 주소 등 다양한 정보를 포함하고 있어 제주도 물류 인프라의 현황을 파악하는 데 중요한 기초 자료로 활용됩니다.*활용 분야 : 물류 인프라 분석, 물류 정책 수립, 물류 기업 매칭 지원, 지역 경제 분석"'
