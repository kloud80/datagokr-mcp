summary_user: 기상상태(맑음·흐림·비·안개·눈)별로 과거 3년간(기준년도 포함) 반경 50m 이내 5건 이상 사고가 난 상위 30개 누적지점과, 지점별 사고 상세(일시·유형·사상자·가해운전자 특성)를 담는 전국 대상 API다. 지자체 교통안전 담당자나 분석가가 '비 오는 날 사고가 반복되는 지점은 어디이고 어떤 유형인가' 같은 질문에 쓴다. 조회에 필요한 기상상태구분(brnch_se_nm)과 시도명(mtrpl_lcgv_nm)은 다른 데이터에서 받은 코드를 넘겨야 하고, 전역 조인 키는 없어 이름·코드 매핑이나 같은 기관 코드로 연결한다.
description_portal: 기상상태별 사고누적지점 정보 및 사고정보를 기준년도, 광역지자체명, 기초지자체명, 지점구분(기상상태구분_맑은날, 흐린날, 비, 안개, 눈,기타) 으로 조회하여 기상상태별 사고누적지점 정보 및 지점별 교통사고 상세 현황 정보 제공합니다.  유형별 교통사고를 분류함으로써 지역별 교통안전대책 수립 및 유형별 교통안전계획 시행 ,개선방안 등을 수립하는데 유용하게 사용될 수 있습니다.사고 다발 지점 선정 기준 은 과거 3년간(기준년도 포함) 반경 50m 이내, 5건 이상 발생한 상위 30개 지점입니다.
