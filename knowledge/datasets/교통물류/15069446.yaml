summary_user: 서울 도시고속도로 8개 노선(강변북로·올림픽대로·내부순환로 등)의 방향별로 각 요일 평균 교통량을 전체 요일 평균 교통량으로 나눈 요일변동계수를 담은 2025년 1~12월 집계 파일로, 노선마다 대표 지점 한 곳의 교통량을 기준으로 한다. 교통 분석가나 계획 담당자가 "올림픽대로 하행은 금요일 교통량이 평일 평균보다 얼마나 많은가"처럼 요일별 수요 차이를 보거나 하루 교통량을 연평균으로 환산·보정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선명·방향 이름을 맞춰 같은 기관의 도시고속도로 교통량·소통 자료와 이어 쓴다.
limits: 노선별 대표 지점 한 곳의 값이라 세부 구간별 요일 차이는 볼 수 없고, 실시간 소통 정보가 아닌 연간 집계 계수다. 표준 코드 없이 노선명·방향 문자열로만 다른 데이터와 맞춰야 한다.
