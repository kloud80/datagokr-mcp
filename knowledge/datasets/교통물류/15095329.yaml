summary_user: 부산광역시 시내버스·마을버스의 노선별 교통카드 이용 건수를 1·2·3통행 이용 형태와 일반·청소년·어린이 이용자 유형으로 나눠 집계한 CSV 파일(약 20KB)이다. 교통 분석가나 정책 담당자가 '어느 노선의 이용 수요가 크고 청소년·어린이 이용 비중은 어떤가'를 비교해 노선 개편·운영 검토에 쓴다. 전역 조인 키가 없어 노선명(노선)을 기준으로 부산 버스 노선·정류장 원장이나 BIS 정보와 이름 매핑으로만 이어 쓴다.
description_portal: 부산광역시에서 제공하는 시내버스 및 마을버스 노선별 이용 건수 데이터로 각 버스 노선의 이용 현황을 집계한 자료입니다. 이 데이터는 노선별 총 이용 건수를 중심으로 1통행, 2통행, 3통행 등 이용 형태별 구분과 함께 일반, 청소년, 어린이 등 이용자 유형별 세부 이용 건수를 포함하고 있습니다. 이를 통해 노선별 수요 규모와 이용 패턴을 파악할 수 있으며, 대중교통 운영 효율화, 노선 개편, 혼잡도 분석, 교통 정책 수립 등의 기초자료로 활용 가능할 것으로 보이며, 또한 지역별 이동 특성과 시간 흐름에 따른 이용 변화 분석에도 유용할 것으로 보입니다.
