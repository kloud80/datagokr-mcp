description_portal: 해당 오픈 데이터는 인천항 여객 터미널의 국내선 이용 선박 정보를 조회할 수 있는 Open API로 API는 REST 방식으로 작동하며 XML 포맷으로 제공됩니다. 호출 시 선박 ID, 선박명, 운항정보, 출항시간, 정박지, 운임정보, 선사명, 터미널 코드 등 다양한 선박 운영 관련 정보가 반환됩니다. 주요 입력 파라미터는 인증키, 선박명, 선박ID 등이 있으며, 호출 결과로는 선박 개요, 선석 위치, 승선 요금, 최종 운항일, 터미널 위치 등을 확인할 수 있습니다. 이 API는 여객선 운항 정보 제공, 여객 안내 시스템 연동, 선사 운영정보 분석, 항로별 수요 예측 등 다양한 항만 운영 및 고객 서비스 개선에 활용 가능합니다.
