summary_user: 국적 선사가 PORT-MIS로 신고한 국제 여객선 수송 실적을 담은 전국 단위 CSV 파일로, 신고연월·선박·상세항로별로 입출항 횟수, 한국인·외국인 여객 수, 차량·일반화물·컨테이너 톤수를 기록한다. 분석가나 항만 정책 담당자가 '한중·한일 항로별로 월간 외국인 여객이 얼마나 오가는가' 같은 국제 여객 흐름을 확인하는 데 쓴다. 전역 조인 키는 없어 항구지청명·항로명·선박명 같은 이름이나 호출부호·국제해사기구식별번호(IMO) 같은 선박 식별값을 매칭해 같은 기관의 선박·입출항 데이터와 잇는다.
description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 국적 선사가 국제 항로를 따라 운항한 여객선의 수송 실적을 신고한 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 국제 여객선의 등록 항만명, 선박명, 호출부호, IMO 식별번호 등 선박 정보, 상세 항로 정보 및 입출항횟수, 입출항 한국, 외국인수, 입출항 화물정보 등으로 구성되어 있습니다.  본 데이터는 각 항로별 국제 여객 흐름 분석, 해운산업 동향 파악, 항만 정책 수립, 국제 교통계획 수립 및 연구 자료로 활용될 수 있습니다.
