description_portal: 'NAVAID(항행안전시설) 는 항공기의 항행을 지원하기 위해 설치된 무선 및 비무선 항법 장비 전반을 지칭하는 포괄적 용어로, VOR, DME, NDB 등 다양한 항법 지원시설이 포함됩니다.공항식별자, 공항명, 유형, 식별자 ,항행시설명 ,좌표에 대한 정보를 제공하고 있습니다.유형은 아래와 같습니다.ILS_DME : 계기착륙 유도와 거리 정보를 함께 제공하는 복합 항법시설VOR : 항공기에 방위 정보를 제공하는 무선항법시설LOC_DME : 로컬라이저(좌우 유도)와 거리 정보를 제공하는 시설VOR_DME : 방위 정보와 거리 정보를 함께 제공하는 복합 항법시설ILS : 활주로 접근 시 수평 및 수직 유도 정보를 제공하는 착륙지원시설VORTAC : 민간용 VOR과 군용 TACAN이 결합된 복합 항법시설TACAN : 군용 항공기에 방위 및 거리 정보를 고정밀로 제공하는 항법시설 좌표 표기 방식은 다음과 같습니다N (North): 북위를 의미하며, 위도 정보를 나타냅니다.E (East): 동경을 의미하며, 경도 정보를 나타냅니다.'
