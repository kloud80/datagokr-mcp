summary_user: 부산광역시 남구에 등록된 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 목록 파일(csv, 약 13KB)로, 상호명·주사무소 주소·업종·운영여부를 담는다. 화주나 사업자가 남구에 주사무소를 둔 일반화물 운송사가 어디이고 지금 운영 중인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞춰 이어야 하며, 전국 기준 확인은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 2026년 6월 24일 기준 부산광역시 남구에 등록되어 있는 일반화물자동차운송사업자 업체 현황입니다.화물운수사업법에 따라 부산광역시 남구에 등록된 일반화물자동차운송사업자(법인 등)의 목록이며,일반화물자동차운송사업자의 정보(업체명, 업체주소, 업종, 운영여부 등)을 제공합니다.화물운수사업법에 따른 화물운송사업자의 분류 중 일반화물운송사업자의 정보를 포함하고 있으며상호명을 비롯한 사업체 주소(주사무소) 및 운영여부 표기를 통해 관련 자료를 필요로 하는 분들께서 이용하실 수 있도록 자료를 개방하고 있습니다.
