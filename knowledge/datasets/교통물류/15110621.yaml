summary_user: "대전광역시 시내 자전거보관소를 한 곳씩 담은 건별 목록으로, 보관소명·도로명/지번주소·위경도와 보관대수(STOR_CNT), 설치연도·설치형태, 차양·공기주입기·수리시설 여부 같은 항목을 함께 담는다. 자전거 이용자가 '집이나 역 근처에 자전거를 세울 보관소가 있고 몇 대까지 들어가나'를 확인하거나, 분석가가 구별 보관소 분포와 수용량 공백을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 위경도 좌표로 공간 매칭해 이어 쓴다(예: 공공자전거 대여소·자전거도로 위치와 겹쳐 보기)."
description_portal: 대전광역시 자전거보관소조회서비스는 시내에 설치된 자전거보관소들의 위치와 수용능력에 관한 상세한 정보를 제공합니다. 해당 데이터는 자전거보관소명, 위도와 경도, 도로명주소 등 공간정보를 포함하며, 각 보관소의 보관대수 즉, 보관 가능한 자전거의 수량 정보도 함께 제공되어 이용자들이 가까운 보관소의 용량을 파악할 수 있습니다. 이 자료는 시민의 편리한 자전거 이용과 안전한 보관을 지원하며, 자전거 인프라 구축 및 개선 정책 수립에 중요한 기초 자료로 활용됩니다.※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
team:
  dept: 법무통계담당관
services:
  - op: /getBystList1
    name: 대전광역시 자전거보관소 목록 조회
    endpoint: https://apis.data.go.kr/6300000/GetBystListService1/getBystList1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: '한 페이지 결과 수 (기본값 : 10)'
      - name: pageNo
        required: true
        example: '1'
        desc: '페이지 번호(기본값 : 1)'
      - name: type
        required: true
        example: xml
        desc: XML/JSON 여부
      - name: STORAGENM
        required: false
        example: 부사동주민센터 앞
        desc: 자전거보관소의 상세 위치
      - name: RDNMADR
        required: false
        example: 대전광역시 중구 보문로 68번길 20
        desc: 자전거보관소의 위치에 대한 상세 도로명주소
      - name: LNMADR
        required: false
        example: 대전광역시 중구 부사동 128-11
        desc: 자전거보관소가 위치한 상세 지번주소
      - name: LATITUDE
        required: false
        example: '36.3142319'
        desc: 자전거보관소 설치장소의 위도좌표값 입력
      - name: LONGITUDE
        required: false
        example: '127.4336589'
        desc: 자전거보관소 설치장소의 경도좌표값 입력
      - name: STOR_CNT
        required: false
        example: '6'
        desc: 보관대의 수 (표현형식/단위 = 수)
      - name: INSTALLATION_TYPE
        required: false
        example: 거치형
        desc: 단독형, 거치형, 휀스형 등 자전거보관소의 설치 형태
      - name: AWNINGYN
        required: false
        example: N
        desc: 차양막 설치 여부 (표현형식/단위 = Y:설치, N:미설치)
      - name: AIRYN
        required: false
        example: N
        desc: 공기주입기 설치 여부 (표현형식/단위 = Y:설치, N:미설치)
      - name: FIXYN
        required: false
        example: N
        desc: 자전거 수리를 위한 수리대 설치 여부 (표현형식/단위 = Y:설치, N:미설치)
      - name: REFERENCEDATE
        required: false
        example: '2022-06-17'
        desc: 데이터 작성 기준일자(표현형식/단위 = yyyy-mm-dd)
      - name: INSTALLATION_YEAR
        required: false
        desc: 자전거보관소 설치 연도
      - name: AIRTYPE
        required: false
        desc: 설치된 공기주입기의 작동 유형
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
