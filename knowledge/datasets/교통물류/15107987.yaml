summary_user: 광주광역시 자치구가 관리하는 공영·민영 주차장을 주차장 한 곳당 한 행으로 담은 파일(csv, 약 72KB)로, 주차장명·구분·유형·도로명주소·주차구획수와 관리기관 연락처를 담는다. 시민이나 분석가가 "우리 동네 근처 공영주차장은 어디이고 몇 면이며 어느 기관에 문의하나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 주차장명·도로명주소 같은 이름 매핑으로만 잇고, 주차장관리번호·좌표·요금이 있는 전국주차장정보표준데이터를 원장으로 함께 보고, 실시간 주차 가능 대수는 지자체·공단별 별도 API에서 따로 확인한다.
limits: 주차장관리번호나 좌표·요금 같은 공통 키가 없어 표준데이터와 정확히 1:1 연결하기 어렵고, 실시간 주차 가능 대수는 담지 않는다. 민영 주차장은 자치구에 자율 신고된 자료라 최신 상태는 소관 부서 확인이 필요하다.
