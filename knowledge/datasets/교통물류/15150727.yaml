summary_user: 경찰청이 제공하는 교통안전 위험요소 중 미끄러운 도로 지점을 건별로 담으며, 지번·도로명 주소와 위경도, 위험요소 분류(대·중·소), 판정 기준일, 사진 정보 유무, 상세 내용을 함께 싣는다. 운전자나 지자체·교통안전 분석가가 "우리 지역에서 결빙·노면 미끄럼 위험으로 지정된 도로 구간이 어디인가"를 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 주소나 위경도를 기준으로 사고다발지역·기상 데이터 등과 공간적으로 맞추거나, 같은 기관 코드(관련 링크 ID 등)로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다.
