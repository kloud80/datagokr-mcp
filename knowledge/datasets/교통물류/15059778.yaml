description_portal: 제주특별자치도개발공사는 제주 청정지하수의 난개발 방지 및 청정한 수자원을 활용한 가치를 창출하기 위해 1995년 설립되었습니다. 우리공사가 생산하고 있는 제주삼다수는 단일수원지에서 취수되는 청정 제주의 화산 암반수이며, 품질과 안전성 확보를 위해 먹는샘물 업계 최초로 환경부로부터 먹는물 수질검사기관으로 지정받아 자체적인 수질검사를 하고 이를 공사 홈페이지에 공개하고 있습니다.개방데이터는 제주도내·외 제주삼다수 제품 주요 판매처의 업체명, 소재지, 대표 연락처 등을 포함한 정보입니다.이외에도 전국의 가까운 오프라인 매장 및 다양한 온라인 플랫폼에서도 제주삼다수를 언제든 편리하게 구매하실 수 있습니다.
