summary_user: 경상남도 창원시 5개 구(의창·성산·마산합포·마산회원·진해)에 설치된 가로등을 한 개씩 표찰번호, 주소, 위도·경도로 담은 건별 위치 파일이다(CSV 약 2.3MB). 시 담당자나 분석가가 "우리 동네 어느 길에 가로등이 부족하거나 몰려 있나"를 지도로 확인하거나, 주민이 고장 가로등 민원을 넣을 때 표찰번호로 위치를 찾는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 위도·경도를 이용한 공간 결합이나 주소 문자열 매칭으로만 잇는다.
description_portal: 경상남도 창원시 5개 구(의창, 성산, 마산합포, 마산회원, 진해) 소재 가로등 위치 정보입니다. 항목은  표찰번호, 가로등위치주소,  위도, 경도 입니다. 도시·도로 환경에 설치된 가로등의 위치, 설비 유형(LED·기존 램프 등), 관리 주체 및 유지보수 상태 정보를 담은 자료입니다. 본 데이터는 가로등 분포 및 밀집도 확인, 에너지 효율 분석, 노후 구간 점검, 안전·조명 정책 수립, 민원 대응 등에 활용될 수 있습니다.다수 정보가 포함될 경우 일반 뷰어(엑셀, 메모장 등)에서 일부만 확인될 수 있으므로, R, Python, GIS 등의 분석 도구를 활용한 시공간 분석 및 시각화가 권장됩니다.등기구 규격, 점등 시간, 설치 연도, 점검 이력 등 세부 기준은 해당 메타데이터나 기술문서를 참고해 주세요.
