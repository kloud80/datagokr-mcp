summary_user: 서울 지하철 각 호선에서 역 이름이 바뀐 내역을 한 건씩 담은 작은 파일(csv, 약 3KB)로, 호선·변경 전 역명·변경 후 역명·개정일을 담는다. 옛 역명이 지금 어느 역인지, 특정 역 이름이 언제 바뀌었는지 확인하려는 이용자나 과거 승하차·시설 자료의 역명을 현재 역명으로 맞추려는 분석가가 쓴다. 전역 조인 키(역 코드)가 없어 다른 역 데이터와는 호선과 역명 문자열을 맞춰 연결해야 하며, 역 마스터의 역명 매핑 보조표로 쓴다.
