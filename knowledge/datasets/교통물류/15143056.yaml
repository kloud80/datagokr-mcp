description_portal: 경기도 남양주시에 위치한 공영주차장 현황입니다.  남양주시에서 운영 관리하는 노외공영주차장 및 노상공영주차장에 대한 데이터를 제공합니다.공영주차장의 위치 등을 포함하는 데이터로 시민들의 주차 편의 증진과 도시 교통 관리를 위해 공개된 형태로 제공됩니다.이 데이터는 교통 및 도시 계획 수립에 핵심적으로 활용될 수 있습니다. 기타  서비스 개발 시 활용되어 사용자에게 가장 가까운 공영주차장 위치, 실시간 주차 가능 대수 정보 등을 제공하여 주차 불편을 해소하고 주차장 검색 시간을 단축할 수 있으며, 주차난 해소를 위한 주차장 확충 계획 또는 교통 정책 수립의 기초 자료로 사용될 수 있습니다.
