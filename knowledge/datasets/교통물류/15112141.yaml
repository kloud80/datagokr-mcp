summary_user: 서울 강북구에 지정된 킥보드 등 개인형 이동장치 주차구역을 한 곳씩 담은 건별 목록으로, 지번주소·세부위치·거치대 유무·설치일자를 함께 담는다(CSV 920바이트 규모의 작은 파일). 강북구 주민이나 공유 킥보드 이용자·운영 사업자가 '이 동네에서 킥보드를 견인 걱정 없이 세울 수 있는 지정 구역이 어디이고 거치대가 있는가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 지번주소나 시군구명을 이름으로 맞춰 잇고, 지도에 올리려면 주소를 좌표로 바꾸는 과정이 따로 필요하다.
description_portal: 킥보드 주차구역은 서울시와 일부 지자체에서 지정된 전용 공간에 설치되어 있으며, 불법 주정차 시 즉시 견인될 수 있습니다킥보드 주차 시 유의사항 지정 주차구역 외 장소에 주차하면 즉시 견인될 수 있으며, 장애인 구역·횡단보도·버스정류소 10m 이내 등은 특히 주의해야 합니다강북구에 소재한 킥보드 등 개인 이동수단 주차구역 위치에 대한 정보입니다. 정확한 지번 주소와 거치대 유무 정보가 포함돼 있습니다.서울특별시 강북구_킥보드 주차구역 위치 데이터는 연번,시군구명,지번주소,세부위치,거치대 유무,설치일자,기준일자로 구성되어 있습니다
