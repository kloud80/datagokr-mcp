description_portal: '서울교통공사에서 2020년 8월부터 2025년 7월까지 약 5년간 수집한 지하철 안전관리 데이터를 바탕으로, 개인정보와 민감정보를 철저히 제거하고 통계적 특성을 유지하여 생성한 합성데이터입니다.본 데이터는 지하철 역사 내에서 발생한 각종 안전사고(승객 부주의 사고 포함)의 사고 종류, 발생 장소, 발생 시간, 호선 및 역사, 사고 특성(승객의 연령대·성별·요일·계절 등)을 포함하고 있습니다. 이를 통해 사고의 주요 발생 패턴과 취약 요인을 과학적으로 식별할 수 있으며, 안전 관리 체계의 선제적 개선과 맞춤형 예방 대책 수립에 활용할 수 있습니다.또한, 합성데이터이므로 개인정보 유출 우려 없이 연구·서비스 개발·정책 수립 등 폭넓은 분야에서 안전하게 활용할 수 있습니다.”(유의사항) 본 데이터에 포함된 각각의 사건은 실제 발생한 사고가 아니며, 통계적 특성을 반영하여 생성된 합성데이터입니다.  또한 본 데이터는 실제 사고 기록이 아닌, 통계적 특성을 반영하여 생성한 합성데이터로 개인정보 및 민감정보와 무관합니다. 특히,연구자·학계: 안전사고 원인 분석, 교통공학 연구, 빅데이터 기반 사고 예측 모델 개발공공기관·지자체: 정책 수립, 시설 투자 우선순위 결정, 사회적 비용 절감 효과 분석기업·스타트업: 안전 관련 앱·서비스 개발, 교통약자 지원 솔루션, AI 학습용 데이터 활용시민·단체: 안전 캠페인, 생활 속 안전 교육 자료 활용등 다양한 활용이 가능합니다.서울교통공사의 안전관리 합성데이터는 도시철도 안전성 향상, 공공데이터 기반 혁신 서비스 창출, 시민의 안전 체감도 제고에 기여하는 중요한 기반 자료입니다.'
