summary_user: 강릉시 관내 고정형 CCTV로 적발한 불법 주·정차 단속 건수를 읍·면·동별로 1월부터 12월까지 월별로 집계한 표로, 건별 단속 기록이 아닌 집계 파일(약 647바이트 CSV)이다. 분석가나 시 담당자가 '강릉시에서 고정형 CCTV 주정차 단속이 어느 동에서, 몇 월에 많이 일어나는가'를 파악해 단속 집중 지역·시기를 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 읍면동 명칭을 행정동 코드표에 이름으로 맞춰야 다른 읍면동 단위 통계(인구, 교통사고 등)와 이을 수 있다.
description_portal: '강원특별자치도 강릉시 관내 고정형 CCTV를 통해 집계된 불법 주·정차 단속 현황을 읍·면·동별·월별로 제공하는 데이터입니다.읍면동: 고정형 CCTV 주·정차 단속 대상이 되는 강릉시 읍·면·동 행정구역 명칭01월~12월: 해당 읍·면·동에서 각 월(1~12월)에 고정형 CCTV로 적발된 불법 주·정차 단속 건수(연도별 월간 단속 실적)이 데이터는 강릉시 고정형 CCTV를 통한 불법 주·정차 단속 현황을 읍·면·동별·월별로 파악하여 단속 집중 지역과 시기 분석, 교통혼잡 및 보행 안전 취약구간 관리, 주·정차 질서 개선 정책 수립, 교통 관련 민원 대응 및 단속 효율화 등 교통질서 및 시민 안전을 위한 정책·행정에 활용할 수 있는 공공데이터입니다.'
