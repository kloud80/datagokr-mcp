summary_user: 경상남도 진주시 관내 버스정보안내기(BIT)를 한 대씩 기록한 설치 현황 파일로, 정류장 아이디·지점명·방향·주소·모델·설치년도를 담는다(csv 약 43KB, 시군구 범위의 개별 주소 단위). 시민이나 교통 담당자가 '내가 이용하는 정류장에 도착 안내 전광판이 있는지, 언제 설치됐는지'를 확인하거나, 노후 안내기 교체와 추가 설치 대상 정류장을 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 정류장 아이디나 지점명을 진주시 정류장 목록·BIS 도착정보와 이름·코드로 맞춰 이어 쓴다.
description_portal: 본 자료는 경상남도 진주시 관내 버스정보안내기(BIT)의 설치 현황을 정리한 것으로, BIT번호, 정류장 ID, 지점명, 방향, 주소, 설치년도 등의 정보를 포함하고 있습니다. 해당 자료는 시내버스 이용 시민들의 편의 증진을 위해 구축된 안내기 설치 현황을 한눈에 파악할 수 있도록 제공되며, 정류장별 정보 접근성 개선, 노선 운영 관리, 교통 편의 서비스 강화 등 다양한 목적에 활용될 수 있습니다. 또한 시설 유지관리나 향후 설치 계획 수립 시 기초자료로 사용할 수 있어 행정·연구 분야에서도 유용하게 참고될 수 있습니다.
