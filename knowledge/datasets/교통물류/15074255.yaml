summary_user: 제주특별자치도 버스 정류소를 한 곳씩 담은 기본 정보로, 정류소 ID·유형·이름·주소·노선 방향·경위도를 담는다. 제주에서 버스를 타려는 주민·관광객이나 교통 분석가가 '이 주소 근처 정류소가 어디고 어느 방향 정류소인가'를 확인하거나 정류소 위치를 지도에 찍는 데 쓴다. 전역 조인 키는 확인되지 않아, 같은 기관의 노선·도착 정보와는 정류소 ID(stationId)나 정류소 이름으로, 다른 공간 데이터와는 경위도로 맞춰 잇는다.
description_portal: 버스 정류소 기본 정보와 관련한 정류소명, 주소, 노선방향, 경위도 등의 정보서비스
