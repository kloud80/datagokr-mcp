description_portal: 이 데이터는 광주광역시 서구의 연도별 주차장 현황을 정리한 공공데이터로, 부설주차장, 노상주차장, 노외주차장 등 유형별 주차시설 수를 포함합니다. 주차장 유형은 건축물 부설 주차장(민간 포함), 도로변 주차장, 공영주차장 등으로 구분되며, 주차 수급 분석과 도심 혼잡도 해소, 교통환경 개선, 불법주정차 예방 등의 행정 업무에 활용됩니다. 또한 도시계획 수립, 스마트주차 시스템 확대, 교통안전 정책 설계, 상권 유입 분석 등 다양한 공공 및 민간 영역에서 참고자료로 사용됩니다. 데이터는 CSV 형식으로 제공되며, 연 1회 이상 정기적으로 갱신됩니다. 각 행은 특정 연도 기준의 주차장 유형별 수치를 포함하고 있습니다.
