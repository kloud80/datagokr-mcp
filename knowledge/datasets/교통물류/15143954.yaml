description_portal: '선박입출항사실확인서는 선박의 입출항 신고에 대한 정보(항구, 항차, 입출항 일시, 화물명, 화물톤수 등)를 확인서로 출력하기 위해 신청하는 데이터입니다.(항구, 호출부호, 허가일시, 선박업체, 신고상태, 신청업체)선박 입출항 사실 확인서는 해당 선박이 특정 항구에 입항하거나 출항했음을 증명하는 서류입니다.법적 효력은 확인서의 용도와 발급기관에 따라 달라질 수 있지만 일반적으로는 선박의 입출항 사실을 증명하는 증거자료로 활용되며, 일부 경우에는 법적 분쟁 해결이나 행정 절차에서 증거로 채택될 수 있습니다.이 외에도 선박 보험 가입, 선박 운항 관련 통계 자료 작성 등 다양한 분야에서 선박 입출항 사실 확인서가 활용될 수 있습니다.- 선박의 입항 및 출항 등에 관한 법률 : 선박의 입출항과 관련된 기본적인 내용을 규정하는 법률입니다. (출처: 선박의 입항 및 출항 등에 관한 법률)- 항만법 : 항만 운영 및 관리에 관한 사항을 규정하는 법률입니다. (출처: 항만법)'
