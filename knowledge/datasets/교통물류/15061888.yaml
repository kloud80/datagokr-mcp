summary_user: 2024년 기준 전국 17개 시·도별 유도선 사업자, 선원(구조요원), 기타 종사자 수와 합계·비고를 담은 시·도 단위 집계표로, 404바이트 크기의 CSV 파일 한 개다. 유도선 안전 정책 담당자나 분석가가 "어느 시·도에 유도선 구조요원이 적게 배치돼 있는가" 같은 지역별 인력 분포 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시·도 이름(구분)을 행정구역 코드에 직접 매핑해야 이어 쓸 수 있다.
limits: 시·도별 합계만 있어 개별 사업장·선박·운항 실적은 알 수 없고, 실측 컬럼에 코드형 조인 키가 없어 시·도명으로 수작업 매핑해야 한다. 해운·항만 부문 기준상 선원·해양 안전 계열은 핵심 범위 밖의 보조 자료로 분류돼 있다.
