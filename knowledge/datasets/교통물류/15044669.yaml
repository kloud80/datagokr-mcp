summary_user: 대전도시철도 1호선 22개 역사별로 승강장·대합실·에스컬레이터·엘리베이터·발매기·게이트·화장실·출입구·통신기계실 등 설치 위치별 CCTV 대수와 합계, 녹화장치(DVR) 제조사·수량·모델명, 역 전화번호·주소를 담은 역 단위 현황 파일이다(포털 설명 기준 총 768대, 2025.09.16 기준). 역사 안전·방범 시설 수준을 비교하거나 특정 역의 출입구·승강장에 CCTV가 몇 대 있는지 확인하려는 시민·분석가가 쓴다. 전역 조인 키가 없어 다른 역 데이터와는 역사명이나 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: '대전교통공사 대전도시철도 1호선 영상정보처리 장치에 대한 현황 데이터 자료입니다.자료 현황 기준일:2025.09.16자료  정보 내용1. 각 역사별 CCTV 총 수량 및 설치 개소 별 수량 [총 역사 22개역 / 총 수량 768개 ]2. 역사별 영상정보 저장장치(DVR)의 총 수량 및 운용 모델  DVR 운용 모델: 아이디스(TDR-1642) 역사별 CCTV는 각 출입구, 승강장 및 대합실, E/S.E/L등 고객 이용 설비에도 설치 되어있으며 제한출입통제 구역인 통신기계실에서 설치하여 운영하고 있음.※통신기계실  CCTV는 IP카메라 설치 및 NVR을 통한 영상정보 저장 및 관리중. ※각 역사 및 출입구 등  CCTV는 아날로그 방식의 카메라 설치 및 DVR을 통한 영상정보 저장 및 관리중. 개소별 현황-승강장: 153대   -ES,EL: 360대-대합실: 54대-발매기: 38대-게이트: 63대-화장실: 24대-출입구: 54: 22대-해당 자료는 1년 단위의 자료 수정 후 정보제공 대상이며, 각 개소별 설치된 카메라의 구체적인 모델 및 도입 시기는 포함되어 있지 않습니다.'
