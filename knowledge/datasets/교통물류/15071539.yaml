summary_user: 서울시 물류창고업체의 인허가 정보를 업체(관리번호) 한 건씩 담은 원장 데이터로, 인허가일·폐업일·휴업 기간, 영업상태, 주소, 일반·냉동 창고 수와 면적, 종업원 수, 법인 여부, 업태(보관·운송·판매·제조)를 포함한다. 분석가나 물류 사업자가 '서울 어느 지역에 냉동·냉장 창고가 몰려 있고 현재 영업 중인 곳은 몇 곳인가' 같은 지역 물류 인프라와 입지 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 자치단체 코드(OPN_LCLGV_CD)로만 연결한다.
description_portal: ㅇ 본 데이터는 서울시 내 물류창고업체의 인허가 정보를 제공하는 공공데이터로, 인허가일자, 영업상태, 영업장 주소, 창고 유형과 면적, 종업원 현황 등 세부사항을 포함합니다.ㅇ 데이터에는 영업상태 구분(정상·폐업·휴업 등)과 인허가 취소 여부, 상세 영업상태가 기록되어 있으며, 물류창고의 냉동·냉장 창고 면적, 보관장소 면적 같은 시설 규모 정보도 확인할 수 있습니다.ㅇ 사업자 구분(법인·개인), 종업원 수, 시설 장비 현황 등 인적·물적 자원에 관한 내용도 담겨 있어 산업 구조 분석에 유용합니다.ㅇ 업태 정보(보관·창고업, 운송 및 택배업, 판매업, 제조업 등)도 포함되어 물류 관련 산업의 다양한 활동 유형을 파악할 수 있습니다.ㅇ 이를 통해 행정기관은 물류업체 관리 및 정책 수립에 활용할 수 있으며, 기업과 연구자는 지역 물류 인프라와 산업 현황을 분석하는 데 참고할 수 있습니다.
