summary_user: 경기도 광주시 공간정보시스템에 등록된 도로중심선을 관리번호별 도로 구간 단위로 담은 건별 원천 파일로, 구간마다 관리기관·구간구분·중용여부와 연장(미터)·면적(제곱미터)·폭원(미터)을 담는다(CSV 약 1.8MB). 광주시 도로 관리 담당자나 분석가가 '관내 특정 관리기관 소관 도로의 총연장과 평균 폭원은 얼마인가' 같은 도로망 현황 집계에 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id) 등 교통 데이터와 바로 이을 수 없고, 관리번호·관리기관 이름 매핑이나 같은 기관 데이터로만 연결한다.
description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 도로 중심선 정보를 제공합니다. 도로의 중심을 따라 그은 기준선 정보를 담고 있어 도로 관리와 공간 분석에 활용됩니다. 지형지물부호는 중심선을 식별하는 코드이며, 관리번호는 각 도로 구간의 고유 번호를 나타냅니다. 관리기관은 도로 관할 주체를 표시하고, 구간구분은 도로의 세부 구간을 나타냅니다. 중용 여부는 중요 도로 여부를 표시하며, 연장, 면적, 폭원은 도로의 길이, 면적, 너비를 수치로 제공합니다. 본 데이터는 도로망 분석, 교통 계획 수립, 도로 유지관리, 공간 정보 시스템 구축, 내비게이션 서비스 개발 등에 활용됩니다.
