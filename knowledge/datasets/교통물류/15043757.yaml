summary_user: 한국도로공사가 인증한 하이패스 단말기를 모델 한 건씩 담은 전국 단위 목록으로, 인증번호·인증받은 업체·제조사·모델명·통신매체·인증일자·인증만료일을 포함한다(약 26KB CSV 파일). 소비자나 유통업체가 '지금 쓰거나 팔려는 하이패스 단말기 모델이 인증을 받았고 유효기간이 남아 있는가'를 확인하는 데 쓴다. 모델명(hipass_obu_model)이 유일한 연결 키라서 다른 하이패스 단말기 모델 자료와 모델명으로 맞춰 쓰고, 도로 노드·링크 같은 공간 키는 없다.
description_portal: 이 데이터는 한국도로공사에서 제공하는 하이패스 단말기의 인증 현황 자료로, 국내에서 유통되는 하이패스 단말기의 적합성 여부를 확인하는 데 활용된다. 인증번호, 제조사, 인증받은 업체, 모델명, 인증일자, 인증만료일자 등의 항목으로 구성되어 있으며, 단말기의 인증 주체와 유효기간에 대한 정보를 포함하고 있다. 이를 통해 사용자는 단말기의 기술적 적합성과 안전성 여부를 검토할 수 있으며, 제조사나 유통업체는 제품의 인증 상태를 체계적으로 관리할 수 있다. 또한 이 자료는 유관기관의 단말기 승인 절차, 사후관리, 품질보증 등의 행정업무에 활용 가능하며, 향후 단말기 인증 관련 제도 개선이나 통계 분석에도 기초자료로 쓰일 수 있다.
