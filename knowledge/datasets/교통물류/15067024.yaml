description_portal: '- 한국교통안전공단에서는 여객자동차 운수사업에 관한 질서를 확립하고 여객의 원활한 운송과 여객자동차 운수사업의 종합적인 발달을 도모하여 공공복리를 증진하는 것을 목적으로 하는 여객자동차 운수사업법에 의거하여 버스운송자격제도를 운영하고 있습니다.- 또한, 화물자동차 운수사업을 효율적으로 관리하고 건전하게 육성하여 화물의 원활한 운송을 도모함으로써 공공복리의 증진에 기여함을 목적으로 한 화물자동차 운수사업법에 의거하여 화물운송종사 자격제도를 운영하고 있습니다.- 화물, 버스 자격시험은 컴퓨터를 활용한 시험(CBT)을 수행하고 있으며, 총 4개 과목, 100점 중 60점 이상 취득하여야 합격처리됩니다.- 자격시험 합격자는 관계 법령에서 정한 교육을 이수(8시간)하셔야 자격증을 발급받을 수 있습니다.- 자격시험 합격자 정보, 교육 이수 데이터는 본사-시험장 또는 본사 온라인교육시스템을 통해 데이터가 관리되고 있습니다.한국교통안전공단 화물운송종사 데이터 및 버스운전 CBT 관련 데이터 입니다.지역코드,시험장소코드,지역명,시험장소명,주소,장소구분,사용여부,등록일의 컬럼명이 있습니다.'
