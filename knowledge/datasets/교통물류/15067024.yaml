summary_user: 한국교통안전공단이 화물운송종사·버스운전 자격시험(CBT) 전송에 쓰는 시험장소 기준정보로, 시험장소 한 곳당 한 행에 지역코드·시험장소코드·지역명·시험장소명·주소·장소구분·사용여부·등록일을 담는 전국 범위의 작은 원장 파일(csv 약 3.6KB)이다. 화물·버스 운전 자격시험을 준비하는 사람이 우리 지역에서 시험을 볼 수 있는 곳과 그 주소를 찾거나, 분석가가 지역별 시험장 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 기관의 다른 CBT 데이터와는 시험장소코드·지역코드로, 그 밖의 데이터와는 주소·지역명 매칭으로만 잇는다.
