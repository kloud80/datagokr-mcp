summary_user: 경상남도 남해군 관내에 설치된 공공 CCTV를 설치 지점별로 한 행씩 담은 현황 파일로, 설치목적(방범·생활안전·시설관리 등), 카메라 대수와 화소수, 촬영방면, 영상 보관일수, 설치연월, 주소와 위도·경도 좌표를 포함한다. 주민이나 분석가가 '우리 동네 어느 지점에 방범용 CCTV가 있고 영상은 며칠 보관되는가'를 확인하거나 CCTV 사각지대를 지도로 살펴보는 데 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 매칭해 잇는다.
description_portal: 본 데이터는 경상남도 남해군 관내에 설치되어 운영 중인 공공 CCTV의 상세 현황 정보로, 군민의 안전한 생활환경 조성과 공공의 이익 증진을 목적으로 합니다. 각 CCTV 시설별로 방범, 생활안전, 시설관리 등 구체적인 '설치목적구분', 해당 지점에 설치된 '카메라대수', 선명도를 나타내는 '카메라화소수', 주요 '촬영방면정보', 영상자료의 '보관일수', 그리고 '설치연월'을 상세히 명시하고 있습니다. 또한, 신속한 유지보수 및 관련 문의 응대를 위한 '관리기관전화번호', CCTV의 정확한 지리적 위치를 나타내는 '위도' 및 '경도' 좌표, 정보의 현재성을 판단할 수 있는 '데이터기준일자'까지 포함하여 자료의 신뢰성과 활용성을 높였습니다. 이 자료는 남해군의 범죄 예방 활동 지원, 불법행위 감시, 재난 및 안전사고 발생 시 신속한 상황 파악과 증거자료 확보 등 다목적 공공안전 서비스 강화를 위한 핵심 기초자료로 활용되며, 지역사회 안전망 구축 및 운영 효율화에 기여할 것입니다.
