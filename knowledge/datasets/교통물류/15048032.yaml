summary_user: 서울교통공사 관할 역별로 수송일자·호선·승하차구분에 따른 시간대별(06시 이전~24시 이후) 승하차 인원을 일 단위로 담은 파일 데이터이며, 2024-01-01~2024-12-31 기간 199,424행이다. 상권·유동인구 분석가가 특정 역의 요일·시간대별 혼잡이 어떤 패턴인지 보는 질문에 쓴다. 전역 조인 키는 없어서 호선·역번호·역명의 이름·코드 매핑이나 같은 기관의 다른 코드로만 다른 데이터와 잇는다.
description_portal: 서울교통공사 관할역별 연도별  일별 시간대별 승하차인원 정보입니다. 해당데이터는  날짜, 호선, 역번호, 역명, 승하차구분, 시간별 승하차 인원정보를 포함하고 있습니다. (제공요청에 의해 2023년 12월 31일 까지 제공합니다.) 승하차인원은 승차인원과 하차인원의 합을 의미합니다. 또한 승차인원은 게이트에서 개표한 인원이며, 하차인원은 게이트에서 집표한 인원을 의미합니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
