summary_user: 인천국제공항에 도착하는 화물기의 동계 시즌 정기운항 스케줄을 편명별로 담은 파일 데이터로, 운항요일·항공사·편명·도착 예정시각·출발지·운항 시작일과 종료일을 담고 항공사·출발지·요일은 국문·영문·중문·일문으로 함께 제공한다. 물류 사업자나 분석가가 '이번 동계 시즌 특정 출발지에서 인천으로 들어오는 화물기는 어느 항공사가 무슨 요일 몇 시에 운항하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공항코드(Airport Code)나 편명·항공사 이름을 매핑해 하계 스케줄이나 같은 기관의 출도착 데이터와 맞춰 쓴다.
limits: 동계 정기운항 계획만 담은 스케줄이라 실제 운항 여부나 결항·지연 같은 당일 실적은 알 수 없다. 공통 조인 키가 없어 다른 데이터와 연결할 때는 이름·코드를 직접 맞춰야 한다.
