summary_user: 해양수산부 해운항만물류정보시스템에서 쓰는 위험물·지역·통계·세입 관련 공통코드를 코드구분별 코드값과 그 뜻(코드변환값), 정렬순서, 사용 여부, 등록·수정 일시로 담은 전국 단위 코드표 파일(CSV, 약 214KB)이다. 항만 물류 데이터를 다루는 분석가나 개발자가 "이 항만 데이터에 찍힌 코드값이 무슨 뜻인가"를 풀어 읽거나 시스템 코드 정합성을 검증하는 데 쓴다. 전역 조인 키는 없으므로, 같은 기관(해양수산부)의 항만 물류·입출항 데이터에 있는 코드값을 이 표의 코드구분·코드값과 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 해양수산부 해운항만물류정보시스템의 공통코드 관리를 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 위험물코드, 지역코드, 통계코드, 세입관련코드 등 정보로 구성되어 있습니다.  본 데이터는 항만 운영을 위한 정보시스템 개발, 코드 기반 행정업무 자동화, 통계자료 산출 및 데이터 정합성 검증 등의 업무에 활용될 수 있습니다. 해운 및 항만 관련 기관의 내부 프로세스 효율화, 세입 관리, 물류 정보처리 체계 개선과 같은 분야에서도 본 데이터를 적용하여 업무의 정확성과 신속성을 높일 수 있습니다.
