summary_user: 영등포구 공영 노상주차장의 일반현황을 주차장별로 담은 2014년 기준 파일(csv, 약 4KB)이다. 영등포구에서 노상 공영주차장이 어디에 어떻게 운영됐는지 과거 현황을 확인하려는 주민이나 주차 정책 분석가가 쓴다. 전역 조인 키가 없어 주차장 이름이나 주소를 맞춰 전국주차장정보표준데이터 같은 표준 원장과 수동으로 이어 써야 한다.
