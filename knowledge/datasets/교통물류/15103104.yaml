summary_user: 남양주시 관내 버스 운송업체를 업체 한 곳당 한 행으로 정리한 목록 파일로, 업체 구분·업체명·노선수·운행대수·주사무소·전화번호를 담는다(csv 약 1.3KB의 소규모 파일). 시민이나 분석가가 "남양주에서 운행하는 버스업체는 어디이고, 각 업체가 노선과 차량을 얼마나 운영하나"를 확인하거나 민원 연락처를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선·정류장 데이터와는 업체명 같은 이름 매칭으로만 연결해 쓴다.
