summary_user: 경기도 광주시 공간정보시스템에 등록된 지하차도를 시설 1건 단위로 담은 파일로, 명칭·시점과 종점·소재지와 함께 연장, 차도·보도 폭원, 상하행 차로수, 통행제한높이 같은 규격을 담는다(파일 크기 472바이트로 소수 시설 규모). 화물차·버스 운전자나 물류 사업자가 광주시 안 지하차도의 통행제한높이를 확인해 경로를 정하거나, 도로 분석가가 시설 규모를 파악하는 데 쓴다. 전역 조인 키는 없어 지하차도명·소재지 주소로 다른 데이터와 맞추거나, 다른 지자체의 같은 형식 지하차도 파일(터널·교량·지하차도 제공표준)과 이어 붙여 쓴다.
description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 지하차도의 상세 정보를 제공합니다. 도로를 지하로 통과하여 교차 지점의 교통 흐름을 원활하게 하는 지하차도의 위치와 규격 정보를 담고 있습니다. 지형지물부호와 관리번호는 시설을 식별하며, 관리기관과 관리자는 시설 운영 주체를 나타냅니다. 지하차도명과 위치 시점, 종점은 시설의 명칭과 구간을 표시하고, 연장, 규격, 폭원, 차로수 등은 시설의 규모와 통행 용량을 제공합니다. 통행제한높이는 안전 통과 높이를 나타내며, 착공일과 준공일은 시설 건설 이력을 기록합니다.
