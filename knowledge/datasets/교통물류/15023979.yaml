summary_user: 여수시 관내 버스정류장을 한 건씩 담은 원장 파일로, 정류장 명칭·번호·유형·행정동과 보안카메라·안내 단말기·액정·의자·광고물·버스베이 설치 여부를 담는다. 시민이나 분석가가 '우리 동네 정류장 중 의자나 보안카메라가 없는 곳은 어디인가'처럼 정류장 편의·안전시설 현황을 읍면동 단위로 따져볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군구코드나 행정동명·정류장 명칭·정류장번호 같은 이름·코드 매칭으로만 이어 쓰며, 실시간 도착(TAGO·BIS) 정보와 연결할 때도 정류장번호·명칭 대조가 필요하다.
limits: 표준 정류소ID 같은 전역 조인 키가 실측 컬럼에 없어 노선·도착 정보와 정확히 맞물리려면 이름·번호 매칭을 거쳐야 한다. 범위는 여수시 한 곳이며 행정단위는 읍면동까지이다. 필드 목록에 좌표 컬럼이 없어 이 파일만으로는 지도에 정류장을 위치시킬 수 없다.
