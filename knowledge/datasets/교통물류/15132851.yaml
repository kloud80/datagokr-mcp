summary_user: 한국공항공사가 운영하는 국내 공항을 오가는 항공편의 운송실적을 연·월, 공항, 국내·국제선, 항공사, 정기·부정기, 용도, 기종별로 나눠 운항편수·여객 수·화물 무게(kg)로 집계한 전국 단위 통계 파일이다. 항공 분석가나 지역 관광·물류 담당자가 특정 공항에서 어떤 기종과 항공사가 몇 편을 띄워 여객·화물을 얼마나 실어 날랐는지 알아보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 항공통계와는 공항명·항공사명·연월을 이름 그대로 맞춰 연결해야 한다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 공항을 활용하는 항공사가 보유하고 있는 항공기종의 운송실적현황을 제공합니다.해당 데이터는 항공기 기종, 항공사, 운항인원, 화물실적(KG), 운항편수 등의 운송실적 통계자료로 이루어져 있습니다.추가 문의사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
