summary_user: "서울 중랑구 관내에 설치된 바닥신호등을 설치 지점별로 한 행씩 담은 파일로, 지점명(예: 교차로·도로명 표기), 횡단보도 수, 설치년월을 기록하며 포털 설명상 2021~2024년 설치분 72개소를 다룬다. 주민이나 교통안전 분석가가 '우리 동네 어느 교차로에 바닥신호등이 언제 설치됐는지', '연도별 설치가 얼마나 늘었는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 교통안전 데이터(어린이보호구역·횡단보도·사고 현황 등)와는 지점명이나 주소를 맞춰 붙이는 방식으로만 이어 쓴다."
description_portal: 서울특별시 중랑구 관내에 설치된 바닥신호등에 대한 정보를 제공합니다. 중랑구에 설치된 시설물에 대한 위치와 상세한 주소, 설치일자에 대한 데이터를 제공합니다. 시설물 위치는 중랑구청사거리(신내로)와 같이 표기되며 주소는 서울특별시 중랑구 봉화산로 194 와 같이 표기됩니다. 중랑구 바닥신호등 현황은 2021년부터 2024년까지 총 72개가 설치되어 관리 운영 중에 있습니다. 중랑구 바닥신호등 데이터는 교통안전, 교통환경 조성, 안전정책 및 연구 등 다양한 방면에서 활용할 수 있음을 안내드립니다. 자세한 내용은 파일을 다운로드 받아서 확인하여 주시기 바랍니다. 감사합니다.
