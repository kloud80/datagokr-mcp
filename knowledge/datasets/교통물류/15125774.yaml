summary_user: 한국철도공사 역별 편의시설 정보를 API로 담은 데이터로, 역사 내 편의시설(엘리베이터·에스컬레이터·화장실·수유실), 교통약자 시설(휠체어리프트·경사로·장애인화장실), 역사 주차장(요금·자리수·운영시간) 세 갈래이며 전국 범위에 API 전체 건수는 1,239건이다. 휠체어 이용자나 보호자가 출발역과 도착역에 엘리베이터·장애인화장실이 있는지, 역 주차장 요금과 장애인 주차면이 얼마나 되는지 확인하는 질문에 쓴다. 역코드(stn_cd, 조인 키 transit_node_cd)로 다른 철도역·환승 데이터와, 주소(addr, 키 address)로 주차장을 주소 기반 데이터와 잇고, 역코드 값은 코드정보 API로 확인한다.
limits: 검증 호출에서 API 전체 건수 1,239건보다 많은 1,967행이 수신되었으므로 건수를 합산하거나 중복 여부를 가릴 때 주의해야 한다. 코드 정보는 코드정보 API를 먼저 조회해 확인해야 하며, 이 근거에서 갱신 주기는 확인되지 않는다.
