summary_user: 정읍시에 있는 버스정류장(승강장)을 한 곳씩 담은 파일로, 정류장 명칭, 지번주소 위치, 승강장 구조(알루미늄·스텐레스·철골조·무개 등), 버스표지판·시간표·명칭표 설치 여부(Y/N)를 기록한다. 시민이나 교통 담당자가 "우리 동네 정류장에 지붕(승강장 구조물)이나 시간표가 설치돼 있는가"를 확인하거나, 시설 미비 정류장을 골라 개선 대상을 정하는 데 쓴다. 전역 조인 키나 정류장 ID가 없어 TAGO·BIS 정류장 정보 등과는 정류장 명칭이나 지번주소를 맞춰 이어 써야 한다.
