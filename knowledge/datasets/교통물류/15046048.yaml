summary_user: 광주 도시철도 역사의 출구별로 이어 탈 수 있는 버스 노선과 그 버스의 행선지를 역명·출구번호 단위로 정리한 원천 목록이며, 약 9KB 크기의 CSV 파일 한 개로 제공된다. 지하철 이용자나 교통 분석가가 '이 역 몇 번 출구에서 어느 버스를 타면 어디로 가는가'를 확인하거나, 역 출구별 연계 노선 수를 비교해 환승 취약 지점을 찾는 데 쓴다. 전역 조인 키가 없고 역 코드나 노선 ID 필드도 없으므로, 역명이나 버스 노선번호를 이름 그대로 맞춰 광주 지역 역 위치·출입구 자료나 버스 노선 정보와 이어 쓴다.
description_portal: 이 데이터는 광주광역시 도시철도공사 역사 출구별 연계 버스 현황을 정리한 자료로, 각 지하철 역 출구에서 이용 가능한 버스 노선과 해당 버스의 주요 행선지를 제공합니다. 주요 항목에는 역명, 출구번호, 연계버스 노선번호(및 노선 세부 정보), 버스별 행선지가 포함됩니다. 이를 통해 지하철과 버스 간 환승 연결성을 구체적으로 파악할 수 있습니다.이 자료를 활용하면 역세권의 대중교통 접근성을 평가하고, 환승 편의성 향상 방안이나 대중교통 네트워크 최적화 전략을 수립할 수 있습니다. 예를 들어, 특정 역 출구에서 제공되는 버스 노선 다양성을 분석해 교통 취약 지역을 식별하거나, 환승 대기 시간을 최소화하는 배차 계획을 설계할 수 있습니다. 또한 버스 행선지 정보를 통해 도시 내 주요 생활권·업무지구와의 연결성 분석, 환승 안내 시스템 개발, 관광객 및 신규 이용자를 위한 통합 교통 안내 자료 제작에도 활용이 가능합니다.
