summary_user: 제주도 읍면동별·일자별로 거주·근무·방문·총 유동인구, 교통량, 평균 속도·소요 시간, 평균 기온·일강수량·평균 풍속을 한 행에 묶은 매쉬업 결과 파일입니다(CSV 약 3.9MB). 교통 분석가나 지자체 담당자가 '비 오는 날이나 관광객이 몰리는 날 어느 읍면동의 교통량과 통행 속도가 어떻게 달라지는가'를 볼 때 쓴다. 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 읍면동명·일자를 이름으로 맞춰 연결해야 한다.
description_portal: '"제주도 내 효율적인 교통량 측정을 위한 날씨유동인구 활용 교통량 데이터 매쉬업 결과 정보입니다.  - 읍면동명, 거주인구, 방문인구, 유동인구, 교통량 등 정보 제공  - 제주빅데이터센터 데이터 활용 *제주빅데이터센터: 지역 데이터 활용 활성화를 통한 데이터 산업 생태계 조성을 목적으로 각종 데이터 확보 및 제공 외의 역할을 함- 경제, 기업, 교통, 통신, 환경 등에 대한 데이터 분석 환경 제공 (폐쇄적 제공)* 데이터 매쉬업(Data Mashup): 서로 다른 출처의 데이터를 결합(융합)하여 새로운 정보나 인사이트를 만드는 작업을 말함※ 출처: 제주데이터허브 https://www.jejudatahub.net/'
