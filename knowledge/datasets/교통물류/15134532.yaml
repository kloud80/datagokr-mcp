summary_user: 서울 시내버스의 실제 운행 이력을 바탕으로 운행 출발 일시, 노선, 차량, 기사별로 그 노선에서 몇 번째로 운행했는지(운행_순서)를 건별로 담은 파일이며, 실측 파일 크기는 약 5KB(csv)입니다. 교통 분석가나 연구자가 특정 노선에서 차량들이 어떤 순서와 간격으로 배차되어 운행됐는지, 시간대별 운행 패턴이 어떤지를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 노선 ID를 서울시 버스 노선·정류장 원장이나 BIS 도착정보와 같은 기관 코드 기준으로 맞춰 이어 쓴다.
