status: active
summary_user: 지자체가 노상주차장에 설치한 거주자우선주차 전용구획을 구획 단위로 담은 표준데이터이며, 검증 시 50,000행을 받았고 구획 위치(주소·좌표), 운영시간, 요금, 접수기간, 신청방법을 포함한다. 주민이 사는 동네에서 거주자우선주차 구획을 어떻게 신청하고 요금이 얼마인지 확인하려는 질문이나, 지자체 담당자·분석가의 구획 분포 파악에 쓴다. 위도·경도(coord)와 도로명·지번 주소(address)를 키로 다른 주차장 데이터나 지도·행정구역 자료와 이어 쓰며, 전국주차장정보표준데이터가 원장이고 실시간 주차 가능 대수는 지자체별 비표준 API라 별도로 붙여야 한다.
limits: 실시간 빈 자리 정보는 담지 않으며, 전체 범위는 미상이라 전국 모든 구획이 들어 있다고 단정할 수 없다. 날짜 컬럼에 2030-01-01 같은 미래 값이 있어 최신성은 이 날짜가 아니라 적재일 컬럼으로 판단해야 한다.
