description_portal: 이 데이터는 해양수산부가 수출입 위험물의 안전 관리를 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 UN에서 정한 위험물 번호를 기준으로 위험물의 분류, 명칭, 위험 등급, 취급법 등 관련 정보를 포함하고 있으며, 수출입 시 필요한 위험물의 식별 및 대응체계에 관한 세부 정보로 구성되어 있습니다.  본 데이터는 수출입 업무를 담당하는 공공기관에서 위험물 운송 관련 법적 기준 준수 여부를 확인하거나, 위험물 취급 기업에서 위험물 별 안전관리 계획을 수립하는 데 사용될 수 있습니다. 또한, 관련 분야 연구기관에서는 위험물의 국제적 분류 기준 및 국가 간 운송 절차를 분석하는 데 활용할 수 있습니다.
