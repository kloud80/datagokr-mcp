summary_user: 광양시 특정 정류소(정류장 ID 기준)에 도착 예정인 버스를 노선별로 한 건씩 담는 실시간 조회 API로, 남은 도착 시간(초)·남은 정류장 수·최근 통과 정류장과 노선 방향·유형·기점/종점·첫차/막차·1일 운행 횟수를 함께 준다. 광양시민이나 교통 안내 서비스 개발자가 '이 정류장에 다음 버스가 몇 분 뒤, 몇 정류장 전에 있는가'를 확인할 때 쓴다. 전역 조인 키는 없어 노선 ID·정류장 ID·정류장 명으로 같은 기관의 정류장·노선 데이터와 이어 쓰며, 필수 입력인 정류장 ID는 광양시 정류장 목록 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 전라남도 광양시 특정 정류소에 도착 예정인 버스 노선의 운행 상태, 정류장 구성, 차량 도착 정보, 노선 특성 등을 종합적으로 제공하는 상세 운행 정보입니다. 제공되는 항목에는 노선 ID, 노선 명, 본선 구분, 노선 타입, 노선 방향, 노선 구간, 정류장 ID, 정류장 명, 모바일 ID, 기점명, 종점명, 차량 ID, 도착 예정 시간(초), 남은 정류장 수, 최근 정류장 명, 첫차·막차 시간, 1일 운행 횟수, 회차지 사용 여부 등이 포함됩니다.이 정보를 활용하면 특정 노선이 어떤 방향으로 운행되고 있는지, 현재 차량이 어느 정류장에 접근 중인지, 최종 목적지가 어디인지, 그리고 운행 패턴·운행 횟수와 같은 운영 특성까지 세부적으로 확인할 수 있습니다. 이러한 상세한 도착 예정 정보는 교통 안내 서비스 구축, 위치 기반 지도 서비스, 대중교통 모니터링, 스마트시티 교통 시스템 등 여러 분야에서 유용하게 활용될 수 있습니다
