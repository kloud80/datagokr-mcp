summary_user: 성남시 보행자전용도로 안에 놓인 적치물 등 장애물을 한 건씩 담은 위치 데이터로, 건마다 세부위치와 위도·경도, 시설물 사진명, 기준일자를 개별 좌표 단위로 담는다. 보행환경 개선이나 불법 점용 단속을 맡은 담당자·분석가가 "성남시 보행자전용도로 중 어느 구간에 장애물이 몰려 있나"를 지도에서 확인할 때 쓴다. 전역 조인 키는 없으므로 시도·시군구 이름이나 위도·경도 좌표를 기준으로 같은 기관의 보행자전용도로 데이터 등과 공간적으로 맞춰 쓴다.
description_portal: 경기도 성남시 보행자 전용도로 내의 적치물 등 장애물 위치데이터를 제공합니다.본 데이터는  보행자전용도로ID, 적치물 등 장애물 세부위치, 시설물 사진명 등으로 구성되어있습니다. ‘경기도 성남시_적치물 등 장애물’ 데이터는 성남시 관내 도로, 인도, 공공장소 등에 무단으로 설치되거나 방치된 적치물 및 장애물의 현황을 체계적으로 관리하기 위해 구축된 자료입니다. 이를 통해 시민의 보행을 방해하거나 안전사고를 유발할 수 있는 장애 요인을 신속하게 파악하고, 도로환경 정비 및 도시미관 개선 정책 수립에 활용하실 수 있습니다. 또한 불법 점용시설물 단속, 보행환경 개선사업, 생활도로 정비 등 다양한 행정 분야의 기초자료로도 활용됩니다. 본 데이터는 성남시가 안전하고 쾌적한 도시환경을 조성하며, 시민이 안심하고 이동할 수 있는 보행 중심의 도시를 실현하기 위한 중요한 기반 자료입니다.
