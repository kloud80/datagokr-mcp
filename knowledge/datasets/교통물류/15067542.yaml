summary_user: 철도Biz에 올라온 철도 관련 산업체 지원 공고를 건별로 담은 CSV 파일로, 공고마다 등록일·글번호·제목·유형·내용(공고기관, 지원자격, 신청방법 등)을 담으며 범위는 전국이다. 철도 부품·건설 관련 중소기업이 '우리 회사가 신청할 수 있는 금융·인력·수출 지원 공고가 지금 무엇이 있나'를 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 다른 지원사업 데이터와는 공고 제목이나 공고기관 이름을 텍스트로 맞춰 이어 써야 한다.
description_portal: 철도Biz를 통해 제공되는 정보입니다.철도관련 산업체에게 금융/인력/사업등의 지원 공고 내용을 제공합니다.중소벤처기업진흥공단/해외건설협회/국토교통부등 공공기관에서 공고되는 철도관련산업체 지원정보를 수집하여 제공합니다.금융지원정보, 인력지원정보, 수출지원정보등 철도관련기업 운영에 도움이되는 정보를 제공합니다.2020년도 부터 수집된 산업체 지원 공고를 제공합니다.내용에서 공고기관, 지원자격, 신청방법등의 내용을 확인 할 수 있습니다.(제공정보:등록일, 글번호, 내용, 유형, 제목)
