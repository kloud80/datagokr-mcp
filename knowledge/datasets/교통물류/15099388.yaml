summary_user: 서울시 버스의 노선·정류장별 하루 총 승차 승객수와 0시부터 23시까지 시간대별 승차 승객수를 기준일(CRTR_DD) 단위로 담은 집계 데이터입니다. 교통 분석가나 사업자가 특정 정류장에서 출퇴근 시간대에 어느 노선에 승객이 몰리는지 확인하는 데 쓴다. 노선 ID·정류장 ID(RTE_ID, STOPS_ID)와 정류장 순번이 있으나 실측상 전역 조인 키는 확인되지 않았으며, 정류장명·노선명은 서울시 노선마스터·정류장마스터 정보와 ID를 맞춰 붙여 쓴다.
description_portal: 서울특별시 1일 1시간 단위로, 노선별 정류장별로 총 승차 승객수를 확인할 수 있습니다.정류장, 노선에 대한 ID 값 정보는 연관데이터인 서울특별시 노선마스터 정보,서울특별시 정류장마스터 정보를 참고하시기 바랍니다.* 데이터 적재는 매일 5일전 데이터를 갱신합니다.* Sheet, OpenAPI는 최근 30일치만 서비스합니다.제공부서는 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4958)입니다.※ 바로가기 클릭 시 서울시 열린데이터광장 개방 데이터로 이동합니다.
