summary_user: 서울교통공사 관할 역별로 월별 환승유입인원(하차한 승객 중 다른 호선에서 승차한 인원)을 호선·역번호·역명·수송연월 단위로 집계한 파일 데이터입니다. 교통 분석가나 상권 조사자가 '광화문역처럼 어느 역에 다른 호선에서 갈아타고 들어와 내리는 승객이 많은가'를 월별로 비교하는 데 쓴다. 전역 공통 조인 키는 없어서, 다른 승하차·역 데이터와는 역명이나 고유역번호(외부역코드)를 서울교통공사 내부 코드로 맞춰 이어 쓴다.
description_portal: 서울교통공사의 월별 환승유입인원 데이터입니다. 해당 데이터는 호선, 역번호, 역명으로 데이터가 구성되어 있습니다. (개통되지 않은 역은 환승유입인원이 빈칸) 연단위 데이터로 2025년 12월 기준업데이트 합니다. 환승유입인원의 정의는 하차인원 중에서 승차역이 하차한 호선과 다른 인원을 의미합니다. 예를들어, 5호선 광화문역에서 하차한 승객이 1호선 서울역에서 승차하였다면 이 승객은 5호선 광화문역의 환승유입인원으로 산정합니다. 또한, 1호선의 경우에 서울교통공사 구간은 서울역~청량리 이며, 나머지 구간은 한국철도공사 관할입니다. 4호선의 경우에는 남태령까지, 그리고 7호선 부평구청~까치울 구간은 2022년 1월 인천교통공사로 이관되었습니다. 마지막으로, 8호선 별내선의 경우에는 암사역사공원역까지가 서울교통공사 구간임을 알려드립니다.
