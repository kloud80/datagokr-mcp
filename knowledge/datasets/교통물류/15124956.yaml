summary_user: "사업용자동차 교통사고가 과거 3년간(기준년도 포함) 반경 50m 안에서 5건 이상 난 사고다발지점을 지점 단위로 담으며, 지점명·좌표(EPSG 5181)와 사고·사망·대형사고·여객/화물 중대사고 건수를 기준년도·시도·시군구별로 조회한다. 지자체 교통안전 담당자나 운수업체가 '우리 시군구에서 버스·화물차 사고가 몰리는 지점은 어디이고 사망사고는 몇 건인가'를 확인하고 업종별 안전대책을 세우는 데 쓴다. 전역 조인 키는 없어서 시도·시군구 약칭 이름(예: 서울, 중구)을 매핑하거나 좌표로 도로교통공단(TAAS) 사고다발지역·지자체 사고 통계와 공간적으로 이어 쓴다."
description_portal: '사업용자동차 사고다발지점 정보 및 사고정보를 기준년도, 광역지자체명, 기초지자체명으로 조회하여 교통사고 정보를 조회할 수 있습니다. 지자체별 사업용자동차에 대한 교통사고 정보를 제공함으로써 업종별 교통안전계획 및 개선대책에 도움이 될 수 있습니다. 사고다발지점 선정 기준은 선정기준 : 과거 3년간(기준년도 포함) 반경 50m 이내, 5건 이상 발생한 상위 30개 지점입니다.주요제공정보 : 교통사고원인조사 대상 사업용자동차 사고다발지점 정보(광역지자체명,지점명,발생건수 등)'
team:
  dept: 교통안전정책과
