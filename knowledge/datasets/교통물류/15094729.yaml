summary_user: 제주특별자치도 버스 승차 인원을 날짜·요일·시간대·이용자 유형별로 집계한 통계로, 포털 설명상 2019년 1월 1일부터 12월 31일까지를 다루며 범위는 시도 단위이다. 교통 분석가나 정책 담당자가 '제주 버스는 평일 몇 시에 가장 붐비고, 이용자 유형별로 피크가 어떻게 다른가' 같은 질문에 답할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 기준일·시간대를 맞추거나 같은 기관 자료와 이름으로 대응시켜야 연결된다.
description_portal: '이 데이터셋은 2019년 1월 1일부터 2019년 12월 31일까지 제주특별자치도 내에서 버스 정류소별로 일자와 시간대(예: 시간 단위 또는 시간 구간)에 따라 집계한 승차 인원 수 현황을 담고 있다. 즉, 특정 날짜와 시간대에 얼마나 많은 승객이 버스를 탔는지를 보여주는 상세한 대중교통 이용 통계이다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과이다. 형식은 CSV이며, 누구나 무료로 다운로드 가능하다. 이 자료는 시간대별·일별 승차 패턴 분석, 출퇴근 혹은 관광-이동 피크 시간대 파악, 교통 수요 예측, 노선 운영 최적화, 도시 이동 인프라 계획, 버스 배차 효율성 분석 등 대중교통 정책 설계 및 연구에 폭넓게 활용될 수 있다. 다만 수집 기간이 2019년 단일 연도에 한정되어 있고 이후의 버스 이용 패턴 변동이나 인구 이동 변화 등은 반영되어 있지 않을 수 있다는 점을 유의해야 한다'
