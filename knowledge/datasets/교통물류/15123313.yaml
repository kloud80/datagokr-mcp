summary_user: 경기도 도로대장 전산화 시스템에 등록된 전광표지판(VMS)을 설비 한 건씩 담으며, 노선번호·구간번호·위치시점·방향, 표시면·기술형식·설치형식(편지식·부착식·측주식 등), 설치일자와 경도·위도를 포함한다. 도로관리 담당자나 교통 분석가가 '경기도 어느 노선·구간에 어떤 형식의 전광표지가 언제 설치됐고, 정보 제공 설비가 부족한 구간은 어디인가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id)와 바로 붙지 않으므로, 노선번호(route_no)·구간번호 매핑이나 경도·위도 좌표를 이용한 공간 결합으로 도로망·다른 도로대장 시설물 데이터와 이어 쓴다.
description_portal: 이 데이터는 도로대장전산화시스템을 통해 수집된 전광표지판에 대한 정보를 포함하고 있으며, 교통안내 및 공공안전을 위한 전광정보 설비의 설치 현황을 나타냅니다. 주요 항목으로는 노선번호, 구간번호, 위치시점, 방향, 표시면(발광형 등), 기술형식(문자식 등), 설치형식(편지식, 부착식, 측주식 등), 입력일, 설치일자, 공간정보(경도·위도), 비고가 있습니다. ‘표시면’은 전광판의 시각적 출력방식을, ‘설치형식’은 전광판이 도로시설물에 어떻게 설치되었는지를 나타냅니다. 해당 데이터는 교통정보 제공 인프라의 분포와 특성을 파악하고, 시설물의 유지보수 및 신규 설치 위치를 계획하는 데 활용될 수 있습니다.
