description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 선박 안전법에 따라 컨테이너 형식 승인을 받은 품목 정보를 관리하기 위해 수집된 데이터입니다.컨테이너 형식승인의 목적은 선박에 적재되어 화물 운송에 사용되는 컨테이너의 안전성과 품질을 확보하여 해상 운송의 안전을 도모하는 것입니다. 특히, 선박안전법 및 안전한 컨테이너를 위한 국제협약에서 요구하는 기준에 따라 컨테이너가 제작되었는지 확인하여 선박 및 컨테이너에 실린 화물의 안전을 보장합니다. 1. 안전성 확보- 형식승인 과정을 통해 컨테이너의 구조적 강도, 내구성, 방수성 등이 국제 기준에 부합하는지 확인하여 운송 중 파손이나 사고를 방지합니다. 2. 품질 보증- 컨테이너 제작 과정에서 일정한 품질 기준을 유지하도록 하여 제품의 신뢰성을 높입니다. 3. 국제 기준 준수- 안전한 컨테이너를 위한 국제협약 (CSC) 등 국제 기준을 준수하여 컨테이너의 상호 호환성을 확보하고 국제 운송에 적합하도록 합니다. 4. 해상 운송 안전 증진- 컨테이너의 안전 및 품질 확보를 통해 해상 운송 과정에서 발생할 수 있는 사고 위험을 줄여 안전한 해상 운송 환경을 조성합니다. 컨테이너 형식승인 대상- 바닥 면적이 해양수산부령으로 정하는 면적 이상인 컨테이너, 특히 선박에 실려 화물 운송에 사용되는 컨테이너가 대상입니다. 구체적으로는 바닥면적이 7제곱미터 이상 (윗부분에 모서리끼움쇠가 없는 컨테이너는 14제곱미터 이상)인 컨테이너가 해당됩니다. 컨테이너 형식승인 절차- 컨테이너 제조자는 해양수산부장관으로부터 형식승인을 받아야 하며, 형식승인을 받은 컨테이너에는 형식승인판을 부착해야 합니다. 컨테이너 검정은 형식승인과 별도로 진행되며, 검정에 합격한 컨테이너에 대해 형식승인판이 부착됩니다. 참고사항- 선박안전법 제23조제3항, 제7항 및 제10항, 같은 법 시행규칙 제58조제2항 및 제58조의2제1항
