summary_user: 고속도로 차량감지장치(VDS) 지점·차로별로 루프1·루프2의 오류·장애 구분 코드와 교통량·점유율·평균속도·차량길이 검지 결과를 집계일자 단위로 담은 건별 원천 데이터이며, 포털 파일은 744바이트 크기의 샘플 CSV입니다. 도로 운영자나 교통 분석가가 '어느 VDS 장비의 어느 차로에서 루프 오류·장애가 잦아 교통량·속도 값을 믿기 어려운가'를 가려 설비 점검 대상과 교통정보 품질을 판단하는 데 쓴다. 전역 조인 키는 없으며, VDS 장비 아이디를 같은 기관의 VDS 지점·교통량 데이터와 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: '고속도로 노선상에 설치된 차량감지장치(VDS)는 루프검지를 이용한 지점별 교통정보로서 VDS지점별 루프 오류 및 장애와 교통량, 점유율, 속도 등의 검지 결과를 30초 주기마다 수집하는 원시 데이터본 데이터는 한국도로공사가 운영하는 고속도로 차량감지장치(VDS: Vehicle Detection System)의 오류 및 장애 발생 이력이다.  VDS는 교통량, 속도, 점유율 등 실시간 교통 정보를 수집하는 장치로, 도로 운영과 정체 예측에 활용된다.  데이터에는 장애 발생 일시, 장치 번호, 장애 유형, 복구 여부 및 시간 등의 정보가 포함되어 있다.  장애 이력은 설비 관리와 시스템 안정성 확보에 중요한 자료이며, 오류 분석과 유지보수 전략 수립, 감지 성능 향상 등 설비 운영의 효율화에 기여한다.  또한 교통 정보 품질 개선과 시스템 안정화 등을 위한 기초 자료로도 활용된다.  CSV 형식으로 제공되며, 기간 및 위치별로 조회할 수 있도록 구성되어 있다.* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000002'
