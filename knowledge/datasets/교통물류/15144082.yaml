description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선 각 역사에 설치된 공유우산 운영 현황을 제공합니다. 대구교통공사는 시민의 이동 편의 증진과 생활 밀착형 공공서비스 제공을 위해 역사 내 공유우산 서비스를 운영하고 있으며, 본 자료는 호선, 역사명, 설치 층수, 설치 상세 위치 등 공유우산 이용에 필요한 정보를 포함하고 있습니다. 이용자는 해당 정보를 통해 가까운 공유우산 설치 위치를 확인할 수 있으며, 갑작스러운 강우 시 우산을 편리하게 대여·반납할 수 있습니다. 또한 공유우산의 재사용을 통해 자원 절약과 생활 속 친환경 실천을 지원하고, 시민 편의 증진과 공공서비스 품질 향상, 지속가능한 교통문화 조성을 위한 기초자료로 활용될 수 있습니다. 데이터는 공유우산 운영 현황 변경 시 갱신됩니다.'
