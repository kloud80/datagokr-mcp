summary_user: 부산광역시 연제구 보호구역 안 횡단보도를 한 건씩 담은 파일로, 위치(도로명·주소·위도·경도), 폭과 연장, 차로수, 보행자 신호등·음향신호기·점자블록·보도턱 낮춤 등 시설 여부와 현장 사진을 포함한다(zip 약 224MB). 구청·분석가가 '연제구 어린이보호구역 횡단보도 중 음향신호기나 보도턱 낮춤이 없는 곳은 어디인가' 같은 보행안전 점검 질문에 쓴다. 실측 컬럼에서 전국 공통 조인 키는 찾지 못했으므로, 보호구역 아이디·주소·좌표를 이용해 같은 기관의 보호구역·단속카메라 자료나 지도와 이름·위치 기준으로 맞춰 쓴다.
limits: 전역 조인 키가 없어 다른 기관·전국 데이터와는 이름이나 좌표 매핑으로만 연결된다. 범위는 연제구 한 곳으로 한정된다. 파일이 사진을 포함해 크므로 내려받을 때 용량을 감안해야 한다.
