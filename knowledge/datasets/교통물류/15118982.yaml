description_portal: 본 데이터는 한국도로공사에서 보유한 차량의 저공해 등급별 현황을 정리한 자료이다. 항목은 ‘구분’, ‘저공해차(1종)’, ‘저공해차(2종)’, ‘저공해차(3종)’, ‘일반차량’, ‘제외차량’으로 구성되어 있다. 이 데이터는 친환경 교통수단 확산 및 대기환경 개선을 위한 저공해차 도입 실태를 보여준다. 저공해 1종은 전기차 및 수소차, 2종은 하이브리드차, 3종은 배출가스 저감 기준을 충족한 차량으로 분류된다. 각 등급별 차량 보유 수량은 친환경 차량 도입 정도를 파악하는 데 활용 가능하며, 관련 정책 수립, 온실가스 감축 목표 설정, 지속 가능한 교통 인프라 조성을 위한 기초자료로 제공된다.
