description_portal: 이 데이터는 의왕시 내 설치된 주차장 현황에 관한 공간정보 자료로, 보행안전지수 지도 시각화에 활용되는 중간 데이터입니다. 공간지리식별번호, 지형지물부호, 도로구간번호 등 위치 기반 정보와 함께 주차장명, 주차장 위치, 주차면수, 요금, 위도·경도 좌표를 포함하여 주차시설의 규모와 위치를 파악할 수 있습니다. 이 데이터는 차량과 보행자의 상호작용에 영향을 주는 주차 공간 분포를 분석하는 데 활용되며, 주차장 이용과 주변 보행 환경의 안전성 평가에 중요한 기초 자료가 됩니다. 2022년 기준으로 수집된 1회성 자료이므로 참고용으로 활용하는 것이 적절합니다.
