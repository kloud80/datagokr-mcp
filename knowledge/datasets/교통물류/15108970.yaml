summary_user: 경기도 의왕시 내 주차장을 한 곳씩 담은 공간정보 파일로, 주차장명·위치구분·요금·주차면수·장애인 주차면수·운영시간과 위도·경도 좌표를 개별 주차장 단위로 담는다(csv 약 20KB). 보행안전지수 지도 시각화용 중간 자료로, 분석가가 '의왕시 어느 동네에 주차장이 몰려 있고 그 주변 보행 환경은 어떤가'를 살필 때 쓴다. 전역 조인 키는 없어서 행정읍면동코드·도로구간번호나 좌표, 주차장명 매칭으로 같은 지역의 보행·도로 데이터나 전국주차장정보표준데이터에 붙여 쓴다.
