summary_user: 한국도로공사 고속도로 영업소 가운데 진입조절 대상 영업소를 영업소 단위로 담는 외부 API로, 영업소명·영업소코드(unitCode)·노선코드와 노선명·좌표(xValue, yValue)와 단계별 조절 기준값(normalLine, step1Line, step2Line)을 돌려주며 범위는 전국이다. 내비게이션·교통정보 서비스 개발자나 운전자가 '어느 고속도로 영업소가 진입조절 대상이고 위치는 어디인가'를 확인하고 우회 경로를 안내하는 데 쓴다. 전역 조인 키는 없어서 같은 기관이 쓰는 영업소코드·노선코드나 영업소명으로 한국도로공사의 다른 영업소·노선 데이터와 맞추고, 표준노드링크와는 좌표를 공간 매칭해 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 영업소 중 진입조절 대상 영업소 목록을 조회할 수 있는 OpenAPI 서비스이다.이 API는 교통 혼잡, 사고, 공사 등의 사유로 진입이 제한되거나 조절되는 영업소에 대한 정보를 포함하고 있다.제공 항목에는 영업소명, 노선명, 방향, 조절 여부, 시작 및 종료 시간, 행정구역, 통제사유 등 다양한 정보가 포함된다.사용자는 해당 데이터를 통해 고속도로 진입 지연 여부를 사전에 확인할 수 있으며, 실시간 교통정보 시스템, 우회 경로 안내, 긴급차량 통행 전략 등에 활용 가능하다.또한 XML 및 JSON 형식으로 제공되어 다양한 시스템과의 연계가 용이하며, 인증키를 발급받은 후 표준 요청 형식에 따라 이용할 수 있다.본 데이터는 정기적으로 갱신되며, 공공데이터 포털을 통해 자유롭게 접근 가능하다.한국도로공사는 이 데이터를 통해 고속도로 통행의 안전성과 효율성을 제고하고, 교통 혼잡 완화 및 이용자 편의를 증진하고자 한다.본 API는 공공 및 민간 활용이 가능하며, 다양한 정보 서비스 개발에 기여할 수 있다.
