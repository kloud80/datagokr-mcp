summary_user: 서울특별시의 자동차 신규 등록 대수를 연월·행정동·차종별로 집계한 현황 파일로, 포털 설명상 2016년부터 2023년까지를 담고 범위는 서울시 읍면동(행정동) 단위다. 분석가나 지역 정책 담당자가 '최근 몇 년간 어느 행정동에서 승용차 신규 등록이 가장 많이 늘었나' 같은 질문에 쓴다. 실측 컬럼에 행정동 코드 같은 전역 조인 키가 없어, 다른 데이터와는 행정동명을 이름 매핑하거나 같은 기관(서울시) 자료끼리만 이어 쓴다.
limits: 행정동 코드 없이 행정동명만 있어 인구·면적 등 다른 행정동 통계와 붙이려면 이름 매칭이 필요하고, 행정동 명칭 변경·분동 시 연결이 어긋날 수 있다. 건별 등록 원장이 아닌 집계값이라 개별 차량·소유자 단위 분석은 못 한다.
