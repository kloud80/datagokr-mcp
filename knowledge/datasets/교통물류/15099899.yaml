summary_user: 서울교통공사 관할 1~8호선 역별로 하루 평균 승차인원과 하차인원을 연 단위로 집계한 파일(CSV, 약 8KB)입니다. 필드 목록상 2007년 일평균 값이 들어 있으며, 연번·호선·역번호·역명과 함께 제공됩니다. 분석가나 사업자가 '2007년 무렵 어느 지하철역의 이용객이 많았나'처럼 역별 이용 규모를 비교하거나, 유동인구를 대신하는 지표로 상권을 가늠할 때 씁니다. 전역 조인 키가 없어서, 다른 역 단위 데이터와는 역명이나 서울교통공사 역번호를 맞춰 연결합니다.
description_portal: 서울교통공사 1-8호선 역별 일평균 승하차인원 정보 입니다. 해당 데이터는 연번, 호선, 역번호, 역명, 연평균승차정보, 연평균 하차정보로 구성되어 있습니다. (2006년 이전데이터는 정보 부존재로 2006년 데이터 부터 게시합니다.) 수시 자료이므로, 1회로만 제공하는 데이터 입니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
