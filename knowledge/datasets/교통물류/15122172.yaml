summary_user: 제목은 '월별 보급현황'이지만 실제로는 전국 전기차 충전기를 한 대씩(충전기ID 단위) 담은 운영현황 파일로, 시도·군구·주소, 충전소명, 시설 구분, 기종, 운영기관, 급속충전량, 충전기 타입, 이용자 제한을 담는다. 전기차 이용자나 구매 예정자가 '우리 동네에 누구나 쓸 수 있는 급속충전기가 몇 대 있고 어느 운영기관 것인가'를 확인할 때, 분석가가 시군구별 충전 인프라 분포를 비교할 때 쓴다. 다른 데이터와 공통으로 쓰는 표준 조인 키는 없어서, 시도·군구 이름이나 주소를 맞춰 지역 통계와 붙이거나 충전소명·운영기관명으로 다른 충전소 자료와 대조해야 한다.
description_portal: '전기자동차 전기자동차 월별 보급현황: 해당 데이터는 전국 전기차 충전기 운영현황(지역, 충전소명, 운영기관,충전기 타입 등) 자료입니다.항목: 시도,군구,주소,충전소명,시설구분(대),시설구분(소),기종(대),기종(소),운영기관(대),운영기관(소),급속충전량,충전기타입,이용자제한,충전기ID업무체계분류: 환경, 대기중장기 개방 대상 여부: 해당없음개별포털 등록여부: 아니오전기차 이용자 및 구매 예정자 분들에 대한 유용한 공공데이터로 제공드리는 자료입니다.자료 관련 추가 문의사항이나 요청사항은 한국환경공단 친환경모빌리티처 자동차환경계획부로 문의부탁드립니다.감사합니다.'
