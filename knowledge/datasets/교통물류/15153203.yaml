summary_user: 한국건설기술연구원이 제공하는 전국 교통량 조사 장비(EQPMNT_ID)별·일자별 시간대 교통량을 담으며, 한 행에 0시~23시 24개 시간대 교통량과 일 합계, 요일, 방향이 들어 있는 장비 단위 집계 데이터이다. 상권·입지 분석가가 특정 조사지점의 출퇴근 시간대 통행이 얼마나 몰리는지, 요일별로 일 교통량이 어떻게 달라지는지를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장비 ID나 지점 이름을 별도로 매핑하거나 같은 기관 자료끼리만 연결할 수 있다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 시간대교통량 정보입니다.\""
