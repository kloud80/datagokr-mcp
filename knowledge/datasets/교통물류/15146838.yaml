description_portal: '해당 데이터는 선박용도별 선박연령과 총톤수에 따른 선박 등록건수의 통계정보로 해양교통안전정보시스템(MTIS)를 통해 제공됩니다.* 선박의 종류- 어선: 연안복합어선, 연안자망어선, 근해채낚기어선, 근해연승어선, 낚시어선 등- 여객선: 일반여객선, 카페리여객선, 고속여객선, 유도선(여객 13인이상) 등- 화물선: 일반화물선, 카페리선, 자동차운반선, 냉동운반선, 컨테이너운반선 등- 유조선: 원유운반선, 액화천연가스운반선, 액화석유가스운반선, 급유선 등- 예인선: 압항예선, 견인용예선, 이접안용예선 등- 기타선: 부선, 준설선, 어업지도선, 시험조사선, 어장정화선, 유도선(여객 13인미만) 등- 수상레저기구: 모터보트, 세일링요트, 호버크래프트, 수면비행선박 등'
