summary_user: 부산 도시철도 2호선 역사 안의 수유실을 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 역명·지상구분·역층·출구번호·상세위치와 유아용침대·소파·전자레인지·간이세면대 개수, 이용가능시간, 전화번호를 담는다. 영유아를 데리고 부산2호선을 타는 보호자가 "어느 역 몇 번 출구 근처에 수유실이 있고 침대나 세면대가 갖춰져 있는가"를 확인하거나, 분석가가 역별 육아 편의시설 분포를 볼 때 쓴다. 전역 조인 키는 없어 다른 철도 역·시설 데이터와는 선명·역명 이름 매칭으로만 이어 붙인다.
