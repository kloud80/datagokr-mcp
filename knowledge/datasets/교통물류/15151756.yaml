summary_user: 수출입 물류 공공·민간 데이터 공유 플랫폼에 선사가 직접 등록한 항만 입항실적을 입항 건별로 담은 전국 단위 파일로, 항만·선박명·호출부호·입항목적·이전 출항지·다음 입항지·관제입항일시 등을 포함한다. 물류 분석가나 화주가 특정 항만에 어떤 선사의 선박이 어디서 와서 언제 입항했는지, 항만별 입항 패턴이 어떤지 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 항만코드·항만명이나 선박 호출부호·선박명을 기준으로 Port-MIS 입출항 신고나 선박 등록 원장 같은 다른 입출항 데이터와 이름·코드를 맞춰 연결해야 한다.
description_portal: '수출입 물류 공공·민간 데이터 공유 플랫폼에서 제공 중인 항만 입항실적 정보입니다.1. 데이터 개요: 수출입 물류 공공·민간 데이터 공유 플랫폼에서 선사가 항만 입항 실적을 관리하기 위해 등록한 정보입니다.2. 데이터 내역: 입항순차번호, 입항항차번호, 선사 및 선박명, 입항목적, 전 출항지, 관제입항일시 등의 데이터를 담고 있습니다.3. 기타사항: 특이사항 없음4. 유의사항: 각 선사의 담당자가 직접 데이터를 입력하여 생성한 정보로써, 운항 계획 변동에 따라 실제 입항실적과 상이할 수 있으니 활용 시 유의하여 주시기 바랍니다.'
