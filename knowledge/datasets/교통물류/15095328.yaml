description_portal: 종합건설본부 구조물관리팀은 2025년 기준으로 교량, 고가교, 터널, 지하차도 등 도로 구조물 전반을 종별(제1·2·3종)로 구분하여 총괄 관리하고 있다. 관리시설은 시특법에서 정한 규모·형식·위험도에 따라 **제1종시설물(대형·중요), 제2종시설물(중규모), 제3종시설물(소규모)**로 분류되며, 각 시설물은 안전등급(A~E등급)과 점검 결과에 따라 보수·보강 및 정밀진단이 단계적으로 이루어진다.2025년 현재 광주시가 관리하는 구조물은 교량, 고가차도, 터널, 지하차도 등으로 구성되며, 시설물의 종류·연식·규모에 따라 정기안전점검, 정밀안전점검, 정밀안전진단, 성능평가가 주기적으로 시행되고 있다. 특히 D등급(미흡) 등급이 확인된 시설물은 법령에 따라 보수·보강계획을 수립하고 정밀안전진단 또는 긴급점검을 실시하여 안전성을 확보하고 있다.
