summary_user: 경상북도 구미시의 전기차 등록 대수를 읍면동별로 승용·승합·특수·화물 차종으로 나누고 총합계를 붙인 집계표로, 606바이트 크기의 작은 CSV 파일 한 개입니다. 구미시 안에서 어느 읍면동에 전기차가 많은지, 차종별 분포가 어떤지를 보고 충전소 배치나 친환경 교통 정책의 우선 지역을 정하려는 지자체 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역(읍면동) 이름을 행정동 코드표나 다른 읍면동 단위 통계와 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경상북도 구미시 읍면동별 전기차 등록 현황을 제공하는 공공데이터로, 지역 내 친환경 차량 보급 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다. 자료는 각 읍면동을 기준으로 승용, 승합, 특수, 화물 등 차량 종류별로 구분된 전기차 등록 대수를 포함하고 있어, 지역별 전기차 보급 수준과 유형별 분포를 분석할 수 있습니다. 이 데이터는 친환경 교통 정책 수립, 전기차 충전 인프라 계획, 도시 교통환경 개선, 온실가스 감축 전략 마련 등에 활용될 수 있으며, 지속가능한 교통 시스템 구축과 탄소중립 도시 실현을 위한 기초 자료로도 유의미하게 사용됩니다.
