description_portal: 한국교통안전공단에서 수행하는 기계식주차장치 관리인 교육에 대한 정보입니다. 본 정보는 2016년 부터 2024년 까지의 기계식주차장치 관리인 교육 시행에 대한 정보입니다. 교육장의 장소명, 주소, 교육 정원과 각 교육의 교육 시작시간, 종료시간, 교육비 정보를 제공하고 있습니다. 2021년 부터 시행한 온라인 교육은 교육장 주소가 공란으로 표기됩니다. 데이터 제공 시점에 따라 교육 종류가 추가된 부분이 반영되지 않을 수 있으며, 해당 정보에서는 20대 이상 기계식주차장치가 설치된 건물에서 수료해야 하는 "관리인 교육"에 대한 정보만을 제공합니다.
