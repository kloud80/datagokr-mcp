summary_user: 교통카드로 집계한 서울버스(시내·광역·마을) 노선별·정류장별 일 단위 승차·하차 인원 합계를 담는 집계 데이터로, 한 행이 하루·한 노선·한 정류장의 승하차 인원입니다. 교통 분석가나 자치구 담당자가 '특정 정류장에서 어느 노선 이용객이 가장 많고 요일별로 어떻게 달라지는가' 같은 수요 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어 노선ID(RTE_ID)·정류장ID·ARS 번호를 서울시 버스 노선·정류장 원장과 이름·코드로 맞춰 연결해야 한다.
limits: 교통카드 이용분만 집계하므로 현금 승차 등은 빠지며, 시간대별 값이 아닌 일 합계라 시간대 분석에는 쓰지 못한다. 포털이 아닌 서울 열린데이터광장(data.seoul.go.kr)에서 별도 인증키(KEY)를 받아 호출해야 하고, 다른 데이터와 연결할 공통 코드가 없어 매핑 작업이 필요하다.
