summary_user: 부산광역시 스마트교차로별로 수집일시, 교차로명, 서비스수준(LOS), 지체시간, 교통량을 담는 실시간 소통 API다. 교통 분석가나 신호운영 담당자가 "지금 부산에서 지체가 심한 교차로는 어디이고, 반복해서 막히는 시간대는 언제인가"를 확인하는 데 쓰며, 결과를 계속 쌓아 두면 상습 정체를 분석하는 이력 자료가 된다. 전역 조인 키가 없어 다른 교통 데이터와는 교차로명(ixrNm) 같은 이름 매핑이나 부산시 자체 코드로만 연결한다.
description_portal: '본 데이터는 부산광역시에서 제공하는 스마트교차로 단위의 교통 서비스 수준(LOS, Level of Service) 정보입니다.제공되는 주요 항목은 수집일시, 교차로명, 서비스수준, 지체시간, 교통량 등이며, 교차로 운영 상태와 혼잡 정도를 종합적으로 나타냅니다.이 데이터는 교차로 지체 수준 분석, 혼잡 구간 파악, 신호운영 최적화 등에 활용할 수 있습니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>교차로 단위의 교통혼잡 수준 파악 및 지체 분석신호 운영 효율성 평가 및 신호 최적화 정책 수립서비스수준(LOS) 기반 교차로 성능 진단교통 빅데이터를 활용한 도시 교통운영 연구 및 정책 지원민간 교통 서비스와 연계한 실시간 교통안내 고도화'
