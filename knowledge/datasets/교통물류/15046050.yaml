summary_user: 광주교통공사가 도시철도 역에서 운영한 무료 생활 서비스(무료 이미용 봉사, 안마봉사, 한방·안과 의료진료 등)를 연도·서비스 구분·운영 장소별로 묶어 실시 횟수와 참여 인원을 담은 집계 파일(CSV, 약 2.4KB)이다. 역사 내 복지 서비스 담당자나 정책 분석가가 "어떤 서비스가 어느 역에서 해마다 몇 번 열려 몇 명이 이용했는가"를 비교해 확대·축소 여부를 판단하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와 붙이려면 장소(역 이름)를 광주교통공사 역 목록 등과 이름으로 맞춰야 한다.
description_portal: 이 데이터는 광주교통공사가 제공한 무료 생활 서비스 운영 현황을 나타낸 자료로, 연도별로 서비스 종류, 운영 장소, 실시 횟수, 참여 인원 수를 기록하고 있습니다.서비스 구분에는 효사랑 무료 이미용 봉사, 안마봉사, 의료진료(한방), 의료진료(안과) 등 다양한 복지·편의 서비스가 포함되며, 각 서비스는 특정 역이나 복수의 역에서 운영됩니다.실시(회)는 해당 연도에 해당 서비스가 진행된 총 횟수를, 참여인원(명)은 그 기간 동안 서비스를 이용한 인원 수를 의미합니다. 이를 통해 서비스별·역별 이용 규모, 시민 참여 수준, 특정 서비스의 인기도 및 확대 필요성을 분석할 수 있습니다. 또한, 연도별 비교를 통해 특정 서비스의 수요 변화나 사회적 영향, 운영 장소 확장의 필요성 등을 판단할 수 있어 대중교통 기반 복지정책 수립에 중요한 참고자료가 됩니다.
