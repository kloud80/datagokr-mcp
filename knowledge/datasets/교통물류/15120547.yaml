summary_user: 경기도 관내 일반국도 측정 지점별로 하루 단위 상·하행 교통량을 1~24시 시간대별 통행량과 하루 합계(tday_sum)로 담은 건별 측정 자료이며, 노선명·노선코드·지점번호·지역이 함께 붙는다. 도로·교통 분석가가 특정 국도 노선 지점의 출퇴근 혼잡 시간대가 언제이고 요일별로 어떻게 달라지는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선코드(route_cd)·지점번호·지역코드를 이름이나 코드 매핑으로 표준노드링크 등 다른 교통 데이터와 맞춰야 하며, 공간 기준인 표준노드링크의 link_id와 바로 붙지는 않는다.
description_portal: '이 데이터는 경기도 관내 일반국도에서 측정된 일별 및 시간대별 교통량 정보를 제공하며, 측정일, 호선명, 지점번호, 상·하행 구분, 지역명 및 시간대(00~24시)별 통행량과 전일 합계 교통량으로 구성되어 있습니다. 주요 분석 항목은 차량 통행량의 시간대별 분포로, 혼잡 시간대 분석, 교통 혼잡도 예측, 특정 요일의 교통 패턴 파악 등에 유용합니다. 도로노선별 흐름을 정밀하게 분석할 수 있어, 교통 정책 수립, 도로 개선 사업, 스마트 교통 시스템 설계에 활용 가능하며, 일상적인 교통량 관리와 공공안전 확보에 중요한 자료입니다.※ 주의사항- 지점별 교통량(단위: 시간대 선택에 따라 대/시, 대/일-개별지점의 상태(도로이전설치, 교통량 측정기 고장, 통신오류 등)에 따라 검색결과가 없을 수 있습니다.'
