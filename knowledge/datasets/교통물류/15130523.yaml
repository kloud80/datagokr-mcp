summary_user: 국토교통부 소유 국유재산 토지를 필지 단위로 담은 토지대장 파일로, 소재지·지번·지목·면적·공시지가·용도지역과 토지이동·소유권변동 일자와 사유를 전국 범위로 담는다. 국유지 관리 담당자나 부동산·도로용지 분석가가 특정 지역에 국토교통부 소유 필지가 어디에 얼마나 있는지, 언제 어떤 사유로 소유권이 바뀌었는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 고유번호·지역코드·지번 같은 필지 식별값이나 소재지 이름을 맞춰 연결해야 한다.
description_portal: 국토교통부_국유재산_토지대장 은 공적장부 상 토지대장으로 소유권변동일자,소유권이전,소재지,지번,지목,면적,이동일자,용도지역,용도지구,지역코드등 국토교통부_국유재산_토지대장 상 고유대장에 매칭 되어 있는 테이블 데이터 입니다 (고유대장은 지역코드 일반 산 구분 및 지번을 포함하고 있습니다.).국토교통부_국유재산_토지대장에 국토교통부 소유권 정보를 파악 가능하며 소유권 변동 및 토지이동일자, 토지이동사유 등 파악이 가능하고 활용 할 수 있습니다. 또한  고유번호별  정렬을 통해 분류 및 활용이 가능합니다.국토교통부_국유재산_토지대장 테이블은 중장기 계방개획으로 2024년에 공공데이터 목록등록관리에 등록된 데이터 이며 현재는 고도화 되어 갱신되지 않는 단반성 데이터 입니다.
