summary_user: 서울시 전동킥보드 견인 처리 내역을 건별로 담으며, 신고일자, 자치구명, 주소, 견인유형, 조치일을 포함한다. 시민이나 분석가가 어느 자치구·지역에서 킥보드 불법주차 견인이 잦은지, 신고부터 조치까지 며칠이 걸리는지 살피는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 자치구명(GU_NM)이나 주소를 이름으로 맞춰 킥보드 주차구역·자전거도로 같은 개인형 이동장치 데이터와 연결한다.
limits: data.seoul.go.kr의 별도 인증키(KEY)가 있어야 호출되며, 공공데이터포털 활용신청과는 따로 받아야 한다. 실측 컬럼에서 표준 코드형 조인 키를 찾지 못했으므로 다른 데이터와 붙일 때는 자치구명·주소 문자열 매핑에 의존해야 한다.
