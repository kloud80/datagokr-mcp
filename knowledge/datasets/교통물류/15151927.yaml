summary_user: 한국건설기술연구원이 제공하는 전국 도로 교통량 통계로, 조사연도·도로등급·노선·도로명별 연평균 일교통량과 승용차·버스·화물차·기타 차종별 교통량과 구성비를 담은 집계 자료다. 입지·상권 분석가가 특정 노선이나 도로등급의 하루 평균 통행량과 화물차 비중을 확인해 점포·물류 거점 후보지를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 노선번호(RTE)·도로명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 등급별교통량통계 정보입니다.
