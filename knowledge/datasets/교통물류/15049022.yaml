description_portal: 데이터 개요「국토교통부_연도별항공납치테러현황」 데이터는 매년 발생한 항공사고 중 항공기 납치(Hijacking) 및 항공기 테러(Terrorism) 관련 사건들을 정리한 공공 통계 자료입니다.이 데이터는 사건의 발생 일자, 항공사 및 기종 정보, 사건 개요로 구성되어 있으며, 항공보안 강화 정책, 국제 테러 대응 협력, 사고 유형별 위험도 평가 및 교육·연구 등에 활용 가능한 기초 데이터를 제공합니다.데이터 제공 항목일자항공납치 또는 테러가 발생한 날짜항공사 및 기종사건이 발생한 항공사명과 해당 항공기의 기종사건 개요발생 원인, 경과, 인명 피해 등 사건의 상세 설명활용 안내항공보안 및 항공경비 정책 수립국제 항공보안 협력 및 위험국 대응 자료항공 테러 위협 대응 시뮬레이션 및 훈련자료과거 사례 분석 기반 예방대책 수립데이터 해석 시 유의사항본 데이터는 대한민국 또는 한국인과 관련된 국제 사건까지 포함할 수 있으며, 실제 기록의 완전성과 공식성은 국가 항공보안 보고체계 또는 ICAO DB 등과 교차 확인이 필요합니다.사건 개요는 요약본이며, 자세한 경위 및 조치사항은 별도 보고서를 참조해야 합니다.데이터 구성 예시일자항공사 및 기종사건 개요1952-04-29에어프랑스 / DC-4에어프랑스 DC-4기가 베를린행 중 소련 전투기의 공격을 받아 비상착륙. 3명 부상.1955-04-11에어인디아 / L-749중국 정부 전세기 내 폭탄 테러 발생. 16명 사망. 암살 시도 추정.1958-02-26대한항공공사 / 창랑호평택 상공에서 북한으로 납치. 미군 1명 사망, 다수 인질 송환됨.
