summary_user: 경기도 버스정류소별로 하루 단위 승차 인원 합계, 최초 승차 인원, 환승 인원, 하차 인원 합계를 시군명·정류소 아이디·정류소 번호(ARS)·정류소명과 함께 담은 집계 데이터다. 교통 분석가나 시군 담당자가 "우리 시군에서 어느 정류소의 승하차가 가장 많고, 환승 비중은 어디가 높은가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 정류장 원장이나 실시간 도착 데이터와는 정류소 아이디(station_id)나 정류소 번호를 이름·코드로 매핑해 이어 쓰고, 같은 기관 코드 체계 안에서만 연결된다.
description_portal: 이 데이터는 경기도 내 버스정류소 별로 집계된 승차 및 하차 인원 정보를 제공하며, 버스 이용 수요와 정류소별 이용 특성을 파악하는 데 활용됩니다. 데이터 항목은 일자, 시군명, 정류소아이디, 정류소ARS, 정류소명, 승차인원합계, 최초승차인원수, 환승인원수, 하차인원합계로 구성되어 있습니다. 전체 데이터는 대용량으로 현재 제공된 시트(SHEET)는 2025년 6월 1일의 데이터로만 구성된 샘플만 제공합니다.전체 데이터를 확인하려면 파일 탭에서 원본 전체 파일을 다운로드 받아야 합니다. 가장 최신의 데이터(한 달 전 데이터)는 정제 전 상태로 참고용으로만 확인하여 주시고,분석 및 보고서 등으로 활용 시 데이터 정제 및 검토가 완료된 현재 달 기준 두 달 전 데이터를 활용하여주시기 바랍니다.
