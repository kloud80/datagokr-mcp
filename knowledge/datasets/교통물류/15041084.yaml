summary_user: 대구 도시철도 3호선 환승역에서 다른 노선으로 갈아탈 때의 정보를 담은 작은 파일(CSV 754바이트)로, 운영기관·노선·역명과 함께 환승 노선, 환승 후 역, 환승에 유리한 차량 순서와 출입문 번호를 행 단위로 담는다. 대구 3호선 이용자나 길찾기 서비스 개발자가 "이 역에서 1·2호선으로 빨리 갈아타려면 몇 번째 칸, 몇 번 문에 타야 하나"를 안내하는 데 쓴다. 전역에서 통하는 역 코드 같은 조인 키가 없어서, 다른 역·노선 데이터와는 역명·노선명을 이름으로 맞추거나 같은 기관 데이터끼리만 이어 쓴다.
