description_portal: 경기도 남양주시의 버스노선별 저상버스 유무 현황입니다. 대중교통으로 쉽게 이용할 수 있는 버스에 대해, 휠체어나 유모차, 보행 약자가 오르내리기 좋게 차량 높이가 낮고 경사판이 장착되어 만들어진 버스인 저상버스는 "교통약자 이동편의 증진법" 제13조 제7항에 따라 도입하도록 되어있습니다. 본 데이터는 남양주시의 버스노선별로 저상버스 운행유무에 대한 정보를 담고 있습니다. 제공하고 있는 항목은 운행업체명, 노선번호, 노선 식별번호, 기점,  기점정류장 식별번호, 종점, 저상버스운행 유무 등 입니다.
