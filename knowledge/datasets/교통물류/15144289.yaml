summary_user: 경기도 남양주시 버스노선 한 줄마다 운행업체, 노선번호·노선ID, 기점·종점과 각 정류장ID, 저상버스 운행 여부를 담은 노선별 현황 파일(CSV 약 9KB)이다. 휠체어 이용자나 유모차를 끄는 시민이 "우리 동네를 지나는 어느 노선에 저상버스가 다니는가"를 확인하거나, 분석가가 노선별 저상버스 도입 현황을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 버스 노선·정류장 데이터와는 노선ID·정류장ID나 노선번호·정류장명을 맞춰 보는 방식으로만 이어 쓴다.
