summary_user: 나주시 버스의 정류장별·노선별 운행 시각을 평일과 주말로 나눠 시간 순서대로 담은 시간표 파일(csv, 약 120KB)이다. 나주 시민이나 지역 교통 분석가가 "이 정류장에서 이 노선 버스가 평일·주말 각각 몇 시에 몇 번째로 오는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 정류장 ID와 노선 ID는 같은 기관(한전KDN)이 낸 나주시 정류장·노선 데이터와 맞추거나 이름 매핑을 거쳐야 다른 데이터와 이어진다.
limits: 정류장 ID·노선 ID가 국가 표준 코드인지 확인되지 않아 TAGO 등 전국 정류장·노선 원장과 바로 조인되지 않는다. 정류장 이름·노선 번호 같은 설명 컬럼이 없어 ID만으로는 실제 위치나 노선명을 알 수 없다. 메타상 범위가 '전국'으로 잡혀 있지만 내용은 나주시 버스에 한정된다.
