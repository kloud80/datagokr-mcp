description_portal: '나주시 대중교통 이용자의 편의를 높이기 위한 버스 시간표 정보로, 평일·주말 구분(0: 평일, 1: 주말), 정류장 ID, 시간 순서, 노선 ID, 운행 시간 등의 정보를 포함하고 있습니다. 이를 통해 시민들은 각 정류장에서 버스를 몇 번째로 탑승할 수 있는지, 해당 노선의 운행 시간이 어떻게 구성되어 있는지를 정확히 파악할 수 있습니다. 특히 주말과 평일의 차이를 반영해 제공되므로 통학·출근 등 정기적 이동뿐 아니라 주말 나들이 및 일정 조율 시에도 유용합니다. 버스 운행 효율성 제고는 물론, 시민들의 정시성 높은 이동 계획 수립에 기여하며, 스마트교통 시스템 운영의 기초자료로도 활용됩니다.'
