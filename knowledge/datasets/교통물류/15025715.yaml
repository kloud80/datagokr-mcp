summary_user: 부산 사상구 관내에서 화물자동차 운송사업을 하는 법인을 한 행씩 담은 소규모 목록 파일(csv 약 4KB)로, 면허종류·법인명·주사무소 주소를 담는다. 물류 분석가나 화주·사업자가 "사상구에 사무소를 둔 일반화물 운송 법인은 어디이고 어떤 면허를 가졌나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·법인번호 등)가 없어, 다른 데이터와는 법인명·주소 문자열 매칭으로만 잇는다. 허가 여부의 기준으로는 전국화물자동차운송사업자표준데이터와 대조해 쓴다.
