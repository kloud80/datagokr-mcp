summary_user: 지방자치단체에 등록된 세차장을 한 곳씩 담은 전국 건별 데이터로, API 전체 16,185건에 사업장명·주소·좌표·영업시간·세차요금 등이 들어 있다. 차량 소유자가 내 주변 세차장이 어디에 있고 언제 여는지 찾거나, 분석가가 시도·시군구별 세차장 분포를 볼 때 쓴다. 지번주소·도로명주소(address)와 WGS84 위도(coord)가 조인 키라서 주소 기반 시설 데이터나 지도 좌표 데이터와 이어 쓴다.
description_portal: '세차장정보 데이터는 물환경보전법 등에 따라 환경부의 폐수배출시설 허가 및 신고 업체로 지방자치단체에 등록된 세차 서비스 업체 정보의 인허가 일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준으로, 전국 지방자치단체에서 관리하는 세차장 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 세차장정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터의 법령 소관기관 및 문의처 : 기후에너지환경부 수질수생태과 / 044-201-7067 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
