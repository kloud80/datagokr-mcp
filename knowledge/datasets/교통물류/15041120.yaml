summary_user: 수도권1호선에 속한 도시광역철도역마다 철도운영기관명, 노선명, 역명, 지번주소, 도로명주소를 한 행씩 담은 역 단위 주소 파일(CSV, 약 8.6KB)이다. 분석가나 서비스 개발자가 '1호선 각 역은 어느 시·구·동에 있는가'처럼 역을 행정구역이나 주소에 붙여 역세권을 판정할 때 쓴다. 공통 조인 키가 없어서 다른 역 데이터와는 역명·노선명 같은 이름으로 맞춰 붙이고, 주소를 지오코딩하거나 행정구역명과 대조해 지역 통계와 연결한다.
