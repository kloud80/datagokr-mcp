description_portal: 경기도 성남시 적치물 등 장애물 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다.경기도 성남시의 적치물 등 장애물 데이터는 보도, 차도, 공공통행로 등에 무단으로 설치되거나 방치된 물건 및 구조물로 인해 보행자 통행을 방해하는 요소들을 체계적으로 기록한 공간정보 자료입니다. 이 데이터에는 불법 적치물의 위치  등의 정보가 포함됩니다. 적치물은 보행자의 안전을 위협하고 도시 미관을 저해할 뿐 아니라, 교통약자의 이동권을 침해할 수 있어 정기적인 조사와 데이터화가 필수적입니다. 성남시에서는 이러한 데이터를 기반으로 불법 노상 물품 정비, 보행환경 개선사업, 생활도로 안전 확보 등의 정책을 추진하고 있습니다.
