summary_user: 인천광역시 택시에 장착한 IoT 센서가 수집한 차량 운행속도를 센서·시각·위경도(지오해시 포함)·시군구·법정동 단위의 건별 관측값으로 담은 파일 데이터이다(zip 약 356MB). 교통 분석가나 시 교통정책 담당자가 '인천 어느 동·구간에서 어느 시간대에 속도가 떨어지는가' 같은 혼잡 구간 파악과 상습 정체 분석에 쓴다. 전역 조인 키는 없어 군구·법정동 이름 매핑이나 위경도·지오해시 기반 공간 결합으로 다른 교통·행정 데이터와 이어 쓴다.
description_portal: '인천광역시가 제공하는 도로 내 운행속도 현황 공공데이터는 택시에 장착된 IoT(사물인터넷) 디바이스를 통해 실시간으로 수집된 차량의 운행 속도 정보입니다. 이 데이터는 차량 이동 경로를 따라 구간별 실제 통행 속도를 정밀하게 파악하고, 교통 흐름 분석, 혼잡 구간 예측, 도로 교통 정책 수립 및 지능형 교통 시스템(ITS) 구축의 기초 자료로 활용됩니다.항목 : 센서명 / 시간 / 위도 / 경도 / 지오해시 / 시 / 군구 / 법정동 / 운행속도(km/h)해당 데이터는 공공데이터포털에서 무료로 확인할 수 있습니다. 참고바랍니다.'
