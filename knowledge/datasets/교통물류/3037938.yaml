description_portal: 부천시에 등록된 차량의 월별 현황으로 용도별(관용,자가용,영엽용) , 차종별(승용, 승합, 화물, 특수, 이륜, 건설기계) 등록수의 정보를 제공합니다. 자동차는 자동차의 크기, 구조, 원동기의 종류, 총배기량 또는 정격출력등 국토교통부령이 정하는 구분 기준에 의하여 승용자동차, 승합자동차, 화물자동차, 특수자동차 및 이륜자동차로 구분합니다. 이륜자동차는 총배기량 또는 정격출력의 크기와 관계없이 1인 또는 2인의 사람을 운송하기에 적합하게 제작된 이륜의 자동차 및 그와 유사한 구조로 되어 있는 자동차를 의미합니다.자동차등록대수는 자동차등록원부에 등록하고 운행할 수 있는 자동차의 대수를 의미하고 자동차는 비교적 고가품인 대표적 내구재로서 경기상황에 민감하기 때문에 자동차 등록대수의 추이는 경기 상황을 판단하는 지표 중 하나로 활용될 수 있습니다.
