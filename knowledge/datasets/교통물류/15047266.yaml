summary_user: 서울특별시가 관리하는 신호등을 부착대(신호등이 달린 구조물) 단위로 한 건씩 담은 시설 원천 데이터로, 부착 방식·부착대 길이·방향, 신호등과 배면등의 수량·종류, 설치일·교체일, 지주관리번호, 제작사, 좌표(XCRD·YCRD) 같은 항목을 포함한다. 교통 분석가나 도시 시설 담당자가 '특정 구간에 신호등이 몇 개, 어떤 종류로 설치돼 있고 언제 교체됐는가'를 확인하거나, 노후 신호등 분포를 살펴보는 데 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없어 다른 데이터와는 지주관리번호(PLR_MNG_NO) 같은 서울시 내부 관리번호나 좌표·이름 매핑으로만 연결한다.
description_portal: 서울특별시 신호등 정보입니다. 부착대관리번호, 부착방식, 부착대길이, 고가, 부착대방향, 신호등수량, 배면등수량, 신호등종류, 배면등종류, 지주관리번호 등의 정보를 제공합니다.
