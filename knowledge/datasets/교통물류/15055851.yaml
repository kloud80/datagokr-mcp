summary_user: 지방해양수산청에 등록된 선박 한 척마다 선박명(한글·영문), 호출부호, 선박번호, IMO번호, 총톤수·순톤수·국제총톤수, 길이·너비·깊이·흘수, 선박종류·국적, 운항형태, 건조일시 등 제원을 담는 건별 원천 조회 API다. 해운업체나 분석가가 특정 선박명이나 호출부호로 '이 배의 총톤수와 길이, 운항형태는 무엇인가'를 확인하거나 선박 운용 계획·등록 현황 분석에 쓴다. 호출부호(clsgn)·선박번호(vsslNo)·IMO번호(imoNo)가 선박 식별 키로 확인돼 입출항·선박원부·검사 등 다른 선박 데이터와 이어 쓰며, 이전호출부호로 호출부호 변경 이력도 따라간다.
description_portal: 이 데이터는 해양수산부에서 각 지방해양수산청별로 등록된 선박의 제반 사항을 제공하기 위해 수집한 데이터입니다.선박명, 호출부호 등 입력 파라미터를 통해 데이터를 호출하실 수 있으며, 본 데이터의 주요 내용은 선박명, 호출부호, 총톤수, 길이, 너비 등 선박 제원 정보로 구성되어 있습니다.본 데이터는 해운업체가 선박의 제원과 운항 형태를 분석하여 선박 운용 계획을 수립하는 데 활용될 수 있습니다. 또한 연구기관은 선박 제원 정보를 활용하여 해운 산업의 동향을 연구하고, 정부 및 관련 기관은 선박 등록 현황을 분석하여 해운 정책 수립 및 제도 개선을 위한 기초자료로 활용할 수 있습니다.
