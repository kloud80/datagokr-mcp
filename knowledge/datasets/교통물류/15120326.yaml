summary_user: 광주 공영자전거 타랑께의 대여소(주차장)별 이름·주소·위도·경도를 한 행씩 담은 건별 위치 파일이며, 시도 범위의 csv 한 개(6,710바이트)로 받는다. 자전거 이용자나 분석가가 '집이나 목적지 근처에 타랑께 대여소가 어디 있나'를 찾거나, 대여소 분포를 지도에 올려 경로를 계획하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 주소나 좌표 기반 공간 매칭, 또는 대여소 이름 매핑으로만 잇는다.
