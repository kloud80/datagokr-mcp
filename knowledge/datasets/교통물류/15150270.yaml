summary_user: 한국도로공사가 제공하는 서울·서서울·동서울·군자·남양주·서시흥 6개 관문 영업소의 입구·출구별 교통량을 담으며, 필드상 시간대(TOT_HR), 입출구 구분, TCS·하이패스 구분, 차종 구분별 교통량(VOTR)으로 나뉜 데이터다. 수도권 관문 영업소로 드나드는 차량이 시간대·차종별로 얼마나 되는지 확인하려는 교통 분석가나 상권·입지 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업소 이름·코드(EX_PVIB_SE_CD) 매핑이나 같은 기관(한국도로공사) 코드로만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하는 정보로 6개지점(서울, 서서울, 동서울, 군자, 남양주, 서시흥) 입출구교통량을 제공하고 있습니다.
