summary_user: 서울교통공사가 관할하는 1~8호선 275개역(하남선 5개역 포함)에 설치된 시각장애인 음성유도기 5,802개의 위치를 기기 한 대당 한 행으로 담은 파일로, 호선·역번호·역명·설치 위치로 구성된다. 시각장애인 보행 안내 앱 개발자나 교통약자 편의시설 분석가가 '이 역의 어느 출입구·통로에 음성유도기가 있는가'를 확인하는 데 쓴다. 전역 공통 조인 키가 없어 역사 평면도나 다른 역 단위 데이터와는 역명이나 외부역번호를 이름·코드 매핑해 이어 써야 한다.
description_portal: 서울교통공사 1-8호선 275개역 5,802개(하남선 5개역, 203개 포함) 지하철 시각장애인 음성유도기(시각 장애인의 도보 경로를 안내해 주는 음성 장치) 설치 위치 정보입니다. 해당 데이터는 서울교통공사에서 관할하고 있는 역사별로 시각장애인 음성유도기가 어떻게 설치되어 있는지 확인할 수 있으며, 연번,호선,역번호,역명,음성유도기 설치 위치로 구성되어 있습니다. 이러한 데이터를 역사 평면도 데이터, 기타 애플리케이션의 API 등과 함께 활용하여 음성유도기를 통한 시각 장애인의 편의 증진을 도모할 수 있습니다. 데이터의 기준 일자는 2026년 2월 13이며, 반기별로 업데이트를 지속하고 있으므로, 업데이트 주기를 확인하여 활용하시기 바랍니다.
