summary_user: 부산광역시 교통신호제어기의 관리번호, 구군, 설치주소, 설치년도, 제어방식(LTE 모뎀을 쓰는 전자신호 제어와 수동 입력 방식의 일반신호 제어)을 제어기 한 대당 한 행으로 담은 건별 현황 파일이며, 포털 설명 기준 2026.02.01. 현재 총 2,962대입니다. 교통 분석가나 구청 담당자가 '우리 구에서 설치한 지 오래됐거나 아직 원격(전자) 제어가 안 되는 신호제어기가 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 구군 이름이나 설치주소 문자열로 부산시의 다른 교통시설 데이터(단속카메라, 보호구역 등)와 맞춰 붙여야 한다.
description_portal: 교통신호제어기란 도로에 설치된 신호등을 프로그램 정보에 따라 자동 또는 수동으로 제어하며 차량과 보행자의 통행을 안전하고 효율적으로 관리하는 장치입니다.교통정보서비스센터는 부산광역시 교통신호제어기시스템을 관리 운영하고 있으며, 교통신호제어기의 구군별 설치위치, 설치년도, 제어방식 등 정보를 제공하고 있습니다.데이터는 교통신호제어기의 구군별 설치위치 및 설치년도, 제어방식을 나타내며 2026.02.01. 기준 총 2,962대 입니다.제어방식 중 전자신호 제어는 LTE 모뎀을 통한 제어 방식을 말하며,  일반신호 제어는 모뎀 없이 수동 입력 방식을 의미 합니다.
