summary_user: 대구광역시 북구 관내에서 터미널·차고지처럼 차량이 많아 공회전 중점 제한지역으로 지정된 곳을 지점별로 담은 소규모 CSV 파일로, 구분·상호·소재지와 고정식·부착식 표지판 수, 표지판 설치위치를 기록한다. 주민이나 운전자가 북구 안에서 공회전 단속이 집중되는 장소가 어디인지 확인하거나, 환경 담당자가 표지판 설치 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호를 기준으로 맞춰 붙이거나, 대구시 다른 구·군의 같은 이름 데이터와 나란히 놓아 비교하는 방식으로 이어 쓴다.
description_portal: 대구광역시 북구 관내 자동차 공회전 제한지역 현황(구분, 상호, 소재지, 표지판 수, 표지판 설치위치 등) 정보를 제공합니다. 자동차의 공회전 배출가스로 인한 대기오염 및 미세먼지 발생 저감을 위하여 공회전 중점 제한지역을 지정하고 관리토록 합니다. 현재 대구광역시 전역이 공회전 제한지역이며 그 중에서 터미널, 차고지 등 차량이 많은 지역을 공회전 중점 제한지역으로 지정하여 관련 정보를 제공합니다.  공회전 제한시간은 2분(25℃를 이상하거나 5℃ 미만인 경우 5분, 30℃이상 또는 0℃ 이하 제한제외)이며, 초과할 경우 과태료가 부과될 수 있습니다.
