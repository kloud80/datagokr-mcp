description_portal: 이 데이터는 건축물 인허가 총괄개요 중 부설·부대시설 설치 현황을 기록한 자료로, 서울시 각 구와 동별 건물에 대한 세부 정보를 제공합니다. 각 행에는 건물의 소재지 주소, 대지 구분, 본번·부번 등의 지번 정보와 함께 부설주차장, 부대시설의 실내·실외 구분별 설치 개수와 면적이 포함됩니다. 또한 실내·실외 철거 시설 현황, 인근 시설 개수와 면적, 면적 제외 대상 여부, 기타 면적 정보가 포함되어 있습니다. 이를 통해 건축물 부설·부대시설의 규모, 위치, 구조적 배치 등을 파악할 수 있으며, 도시계획, 주차공간 관리, 건축물 유지관리 등에 활용될 수 있습니다.
