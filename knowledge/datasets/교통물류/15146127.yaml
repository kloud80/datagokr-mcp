summary_user: 서울시 건축 인허가 대장 가운데 부설주차장 설치 현황을 건물(인허가 건) 단위로 담는다. 실내·실외·인근 구분별 주차 대수와 면적을 대지 위치(구·법정동명, 본번·부번)와 함께 기록한 건별 원천 자료다. 도시계획·주차 분석가가 '이 동네 신축 건물들이 부설주차장을 얼마나, 실내·실외 어디에 확보했나'를 파악하는 데 쓴다. 전역 조인 키는 없어 구·동 이름과 지번으로 맞춰 붙이며, 인허가대장 일련번호(PRMSN_LDGR_SN)는 같은 서울시 건축인허가 계열 자료와 이을 때만 쓸 수 있다.
limits: 좌표·요금·주차장관리번호가 없어 주차장 원장(전국주차장정보표준데이터)이나 실시간 주차 가능 대수를 대신하지 못하며, 지번 텍스트로만 연결한다. 호출에는 포털 활용신청과 별개로 서울 열린데이터광장 인증키(KEY)가 필요하다.
