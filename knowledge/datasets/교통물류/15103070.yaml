summary_user: 국토교통부가 심사해 지정한 물류신기술을 기술 1건당 한 행으로 담은 목록 파일로, 지정번호·신기술명·개발사·기술분야·보호기간·상태 등을 포함하며 파일 크기는 1,559바이트로 건수가 많지 않다. 물류 분야 사업자나 공공물류사업 발주 담당자가 "어떤 물류신기술이 지정돼 있고, 보호기간이 아직 유효한 기술은 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 개발사 이름이나 신기술명을 문자열로 맞춰 연결해야 한다.
description_portal: 기술개발자(개인 또는 법인)의 물류기술 개발의욕 고취와 개발된 물류기술의 보급 및 활용 촉진으로, 국내 물류기술의 발전을 도모하여 기술경쟁력 등을 제고하기 위해 국내에서 최초로 개발되거나 외국에서 도입하여 소화･개량한 물류신기술·첨단물류시설등 중에서 성능 또는 품질이 우수하다고 인정되는 물류신기술·첨단물류시설 등에 대한 기술입니다. 물류신기술은 물류 활동의 효율성, 안전성, 친환경성을 높이기 위해 개발된 창의적이고 우수한 기술로 국토교통부가 심사하여 지정하며, 지정기술은 공공물류사업에 우선 적용되는 혜택을 받습니다.
