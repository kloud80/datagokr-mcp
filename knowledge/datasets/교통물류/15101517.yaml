summary_user: 대구광역시에 주사무소를 둔 국제물류주선업 회사를 업체 한 곳당 한 행으로 담은 명부 파일로, 법인 여부(법인구분)·상호·주사무소 주소가 들어 있고 행정단위는 개별 주소 수준입니다. 수출입 화물 운송을 맡길 대구 지역 포워딩 업체를 찾거나, 거래 상대가 대구시에 등록된 국제물류주선업자인지 민원인·사업자가 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 주소를 맞춰 연결해야 하며, 허가받은 운송·주선사 여부의 기준은 전국화물자동차운송사업자표준데이터 쪽에 있다.
