description_portal: 대구광역시에 소재하는 국제물류주선업 회사의 정보를 제공하여 시민들의 정보에 대한 접근성을 향상합니다. 국제물류주선업은 타인의 수요에 따라 자기의 명의와 계산으로 타인의 물류시설· 장비 등을 이용하여 수출입화물의 물류를 주선하는 사업을 말히며 주요 정보로는 국제물류주선업 회사명, 해당 국제물류주선업 주사무소의 주소를 포함하고 있습니다. 해당 정보는 물류정책기본법 및 동법 시행규칙에 의거 처리되는  정보입니다. 또한 국제물류주선업 관련 사항 발생 시 민원인이 본 데이터를 바탕으로 적극적인 대응을 가능하게 함으로써 시민들의 권익 증진에 기여할 수 있습니다.
