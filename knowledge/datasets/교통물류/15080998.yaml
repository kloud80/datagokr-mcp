summary_user: 서울 광진구 관내에서 화물자동차 운송주선사업 허가를 받은 업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 4.5KB)로, 업체명·주선업 유형·허가일자·주사무소 주소·관할관청을 포함한다. 화주나 이사·물류 이용자가 "이 주선업체가 광진구에서 정식 허가를 받은 곳인가"를 확인하거나, 분석가가 구 단위 주선업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 업체명이나 주소로 전국화물자동차운송사업자표준데이터 등 다른 허가 원장과 맞춰 이어 써야 한다.
description_portal: 서울특별시 광진구_화물자동차 운송주선사업 허가업체 데이터는 광진구 관내에서 화물자동차 운송주선사업 허가를 받은 업체의 현황을 제공합니다. 주요 항목에는 업체명, 주선업 유형, 허가일자, 폐업일자, 주사무소, 관할관청 등이 포함됩니다. 업체명은 허가를 받은 사업체의 공식 명칭을 나타내며, 주선업 유형은 일반 화물 운송주선, 특수 화물 운송주선 등 사업의 세부 형태를 구분하는 정보입니다. 허가일자는 해당 업체가 정식으로 영업 허가를 받은 날짜를 제공하고, 폐업일자는 영업을 종료한 경우 그 시점을 기록합니다. 주사무소 항목은 업체의 주요 사무소 위치를 나타내며, 도로명주소 기준으로 제공되어 위치 확인 및 행정 관리에 유용합니다. 관할관청 정보는 해당 업체를 관리·감독하는 행정기관을 명시하여 행정업무 및 인허가 관리 효율성을 높입니다. 본 데이터는 지역 내 물류 인프라 분석, 화물 운송 정책 수립, 사업체 운영 현황 파악 및 공공 행정서비스 개선을 위한 기초 자료로 활용됩니다.
