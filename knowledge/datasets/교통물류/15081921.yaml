summary_user: SRT 열차번호 한 행마다 수서·동탄부터 여수EXPO까지 역별 하차인원을 열로 펼쳐 담은 연간 집계 파일로, 경부·호남·경전·동해·전라선 33개 역을 포함한다(약 11KB CSV). 철도·교통 분석가가 '어느 SRT 열차가 어느 역에서 하차 수요가 몰리는가'를 보고 열차별 하차 분포나 역별 도착 수요를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 역별 승차인원·역 시설 데이터와는 역 이름(열 이름)이나 열차번호를 맞춰서만 이어 쓴다.
description_portal: 고속열차 SRT 열차별 역별 하차인원 수에 따른 공공데이터입니다. 해당 데이터는 SRT가 운행중인 경부선, 호남선, 경전선, 동해선, 전라선 모두 포함되어 있습니다. 해당데이터는 연간 주기성 데이터입니다. SRT는 2016년도 12월  9일부터 지속적으로 운행을 시작하였습니다. 2023년 운행노선 확대에 따라 밀양, 진영, 창원, 중앙, 창원, 마산, 진주, 포항, 전주, 남원, 곡성, 구례구, 순천, 여천, 여수EXPO역의 데이터를 추가합니다. 열차번호별로 각 역별 하차데이터를 확인하실 수 있습니다.  에스알은 해당 데이터를 무료로 제공드리고 있습니다.  데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다
