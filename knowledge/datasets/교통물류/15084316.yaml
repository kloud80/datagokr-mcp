summary_user: 전국의 드론 교육기관 개소 수를 시도·시군구 권역별로 집계해 전문교육기관과 사설교육기관으로 나눠 담은 통계 파일이다. 드론 조종자격 교육을 받으려는 사람이나 드론 산업 분석가가 '우리 시군구에 드론 교육기관이 몇 곳 있고, 전문·사설 비중은 어떤가'를 확인하는 데 쓴다. 전역 조인 키(행정구역 코드 등)가 없어 다른 지역 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: 드론을 활용하여 경영을 하려는 자는 항공사업법 제48조(초경량비행장치사용사업의 등록)에 따라 등록을 해야하고, 한국교통안전공단은 같은법 제75조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다. 사업등록 시 촬영,측량,관측,점검,조종교육,농업지원,기타의 항목을 선택할 수 있으며, 조종교육으로 등록된 사용사업체가 드론교육을 수행할 수 있다. 현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있고, 사업자등록번호 기준으로 사용사업체의 이력을 관리하고 있다. 해당 자료는 권역별 드론 교육기관의 개소 수를 나열한 것으로, 전문교육기관과 사설교육기관으로 나누어져 있음. 드론 교육기관 개소 수와 관련된 통계자료 필요시 활용이 가능하다
