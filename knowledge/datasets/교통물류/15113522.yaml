summary_user: 경기도 내 철도 역사에 설치된 승강기를 한 대씩 기록한 현황 자료로, 철도운영기관·노선·역명과 출입구 번호, 상세 위치, 시작·종료 운행층, 정원 인원·무게, 승강기 상태와 번호를 담는다. 휠체어 이용자나 교통약자가 "이 역의 몇 번 출입구에 엘리베이터가 있고 지하 몇 층까지 가는가"를 확인하거나, 운영기관이 노선별 승강기 분포와 점검 대상을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 역사·노선 데이터와는 운영기관·노선·역 코드(statn_cd 등)나 역명을 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 철도 역사 내에 설치된 승강기의 현황을 기록한 자료로, 각 역사별 승강기의 위치, 출입구 번호, 시작 및 종료 운행층수, 정원수 및 무게, 승강기 번호, 철도운영기관명 및 선명 등의 항목으로 구성되어 있습니다. 주요 항목으로는 ‘역명’, ‘출입구번호’, ‘위치’, ‘시작층명’, ‘종료층명’, ‘정원수’, ‘정원무게’, ‘승강기상태’ 등이 있으며, 교통약자 접근성 개선, 역사 내 시설관리, 안전 점검 계획 수립 등에 활용될 수 있습니다. ‘위치’ 항목은 승강기의 상세 위치를 자연어로 설명하고 있어 공간정보 분석에도 활용 가능하며, ‘운행층수’는 지하~지상 간 승강 범위를 나타냅니다. 일부 승강기는 상태 정보나 승강기 번호가 누락되어 있어 데이터 분석 시 주의가 필요합니다. ‘철도운영기관명’ 및 ‘선명’ 정보는 노선별 승강기 분포 현황을 파악하는 데 유용합니다.
