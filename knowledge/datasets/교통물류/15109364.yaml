summary_user: 국토교통부가 사전정보공개로 올린 도로·철도 분야 공개 자료의 목록을 건별로 담는 조회 서비스로, 자료마다 제목·카테고리·키워드·제공기관·원본등록일·제공페이지 URL·첨부파일명·다운로드 URL을 준다(범위는 전국, 비공간). 연구자나 기자, 사업자가 "국토교통부가 철도·도로 관련해 최근 어떤 문서와 첨부자료를 공개했고 원문은 어디서 받는가"를 검색어·등록일·상세분류코드로 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키는 없어서, 제목·키워드 같은 이름 매칭이나 같은 기관 기준으로만 다른 자료와 연결한다.
description_portal: 검색어, 데이터 등록일, 상세분류코드를 이용하여 국토교통부 사전정보공개 도로철도분야 데이터에 해당하는 데이터의 제목, 카테고리, 키워드, 제공기관, 원본등록일, 제공페이지 URL, 첨부파일명, 다운로드 URL을 조회할 수 있는 국토교통부 사전정보공개 도로철도분야 데이터 조회 서비스 입니다.공공데이터 제공기관, 제공범위, 활용가능 분야 등을 안내하고 공공데이터를 활용한 창업과 사업화 방법에 대한 자문 등 공공데이터 개방(공공부문)과 이용 활성화(민간부문) 전반을 지원하기 위하여 제공하는 데이터 입니다.
