summary_user: 제주특별자치도 어린이보호구역 안의 주정차금지 지정구역을 구역 한 건씩 담은 CSV 파일로, 포털 설명 기준 82건이며 도로명·상세위치·금지구역 연장과 평일·토요일·공휴일별 주정차 금지시간 및 일시적 주정차 허용시간, 시행·해제일자를 담는다. 학부모나 운전자가 "아이 학교 앞 이 도로에서 토요일 몇 시에 잠깐 정차해도 되는가"를 확인하거나, 분석가가 통학로 불법 주정차 단속 구역을 지도로 그릴 때 쓴다. 전역 조인 키는 없어 시군구코드·시군구명이나 도로명을 기준으로 어린이보호구역·단속카메라 등 다른 보호구역 데이터와 이름·코드 매칭으로 잇는다.
description_portal: 이 자료는 제주특별자치도에서 제공하는 “어린이보호구역 내 주정차금지(지정)구역” 데이터입니다. 데이터에는 각 구역의 도로명, 상세 위치, 주차금지 시작시간과 종료시간 등의 정보가 포함되어 있으며, 총 82건의 지정 구역이 CSV 형식으로 제공됩니다. 여기서 ‘어린이보호구역’은 초등학교·유치원 등 어린이 시설 주변 일정구간으로, 이 구역 내에서는 차량의 정차 또는 주차가 법적으로 금지되며 통행 속도도 일반적으로 시속 30km 이내로 제한됩니다. 이 데이터는 보호구역 내 통학로 확보 현황 점검, 불법 주정차 단속 구역 시각화, 보행 안전 정책 설계, 교통 안전 지도 작성 등 보행자 안전 확보와 행정 정책 수립을 위한 기초자료로 활용될 수 있습니다.
