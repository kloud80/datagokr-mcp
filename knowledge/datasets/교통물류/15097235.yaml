summary_user: 경상북도 구미시 안의 경찰서 무인 단속카메라를 한 대씩 담은 건별 설치 현황으로, 설치장소와 위도·경도, 관리책임자와 연락처를 함께 제공한다. 운전자나 내비·지도 서비스 개발자가 '구미시 어느 지점에 단속카메라가 있나'를 확인하거나, 분석가가 단속 지점 분포를 사고 지점과 비교할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표(위도·경도) 기반 공간 결합이나 설치장소 이름 매칭으로 이어 쓰며, 전국 무인교통단속카메라 제공표준 데이터와는 형식을 맞춰 비교할 수 있다.
limits: 범위가 구미시 한 곳에 한정되므로 다른 시군구나 전국 현황은 이 데이터로 볼 수 없다. 행정코드 같은 공통 키가 없어 다른 데이터와는 이름·좌표 매핑으로만 연결된다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
