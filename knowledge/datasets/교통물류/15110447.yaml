summary_user: 대전광역시 도로관리시스템에 등재된 도로 중심선을 구간 단위로 담은 원천 공간 데이터로, 각 행에 선형 지오메트리(WKT)와 도로구간번호·행정읍면동·도엽번호·도로폭원 등이 들어 있으며 범위는 대전광역시, 행정단위는 읍면동이다. 도시계획·교통 분석가가 '대전 어느 동에 폭이 좁은 도로 구간이 몰려 있는가'처럼 도로망의 위치·폭원을 지도 위에서 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id) 등 다른 교통 데이터와는 행정읍면동 이름이나 공간 좌표(WKT) 중첩으로 맞춰 이어 써야 한다.
description_portal: 대전광역시 도로 중심선 현황 데이터는 대전광역시 도로 관리시스템에 등재된 각 도로의 중심선 위치와 관련 정보를 포함하고 있습니다. 이 데이터는 도로의 구조적 특성과 경로를 명확하게 파악할 수 있도록 도로 중심선을 기준으로 정리되어 있으며, 도로 설계, 교통 흐름 분석, 도시 계획 등 다양한 행정 및 정책적 업무에 활용됩니다. 도로 중심선 현황은 도로의 길이, 연결 구조, 구간별 특성 등 세부 정보를 제공하여 도로 인프라의 체계적 관리와 효율적인 운영에 기여합니다. 2022년 공공데이터 기업 매칭 지원사업을 통해 청년 인턴이 직접 구축하고 정비한 데이터로, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
