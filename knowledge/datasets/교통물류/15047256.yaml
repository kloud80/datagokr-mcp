summary_user: 서울시 전체 횡단보도와 부착대(신호등)의 위치를 횡단보도 한 건 단위로 담으며, 관리번호·상태·가로·세로 길이·화살표시 수량·경찰서·구·동 코드·지번·설치·교체일자·좌표(XCRD, YCRD) 등을 포함한다. 보행 안전 분석가나 자치구 담당자가 '우리 구에서 횡단보도가 어디에 몇 개 있고 언제 설치·교체됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 구·동 코드나 경찰서 코드로 같은 서울시 데이터와 맞추거나, 좌표로 단속카메라·어린이보호구역 같은 규제·단속 데이터와 공간 결합해 쓴다.
