summary_user: 서울버스(시내·광역·마을)의 교통카드 이용 기록을 월(USE_YM) 단위로 노선·정류장별로 묶어 0시부터 시간대별 승차·하차 인원을 담은 집계 데이터다. 교통 분석가나 상권·입지를 검토하는 사업자가 '특정 정류장에서 출퇴근 시간대에 몇 명이 타고 내리는가', '어느 노선의 어느 구간이 혼잡한가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 정류장 ID(STOPS_ID)·정류장 고유번호(ARS 번호)·노선번호를 서울시 정류장·노선 원장과 이름·코드로 맞춰 이어 쓴다.
description_portal: 교통카드(선후불교통카드 및 1회용 교통카드)를 이용한 버스노선별 정류장별 시간대별 승하차인원을 나타내는 정보입니다. (월단위) 서울버스 대상 (서울시내, 서울광역, 서울마을)(* 데이터 적재는 매월 5일 전월 데이터를 갱신합니다.)* 2022년 07월이후 데이터부터 '교통수단타입명','교통수단타입코드'가 추가되었습니다.* 2022년 07월이전 데이터는 '교통수단타입코드'가 '000'으로 고정되어 있습니다.※ 데이터의 양이 많아 2023년 10월 16일부터 Sheet는 최근 2개월 데이터만 제공합니다.
