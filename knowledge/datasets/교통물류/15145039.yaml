summary_user: 국내에 등록된 초경량항공기 이착륙장을 한 곳씩 담은 전국 단위 목록 파일로, 이착륙장 유형·명칭·위치 좌표(도·분·초 형식)로 구성된 802바이트 규모의 CSV입니다. 경량비행기 등 초경량항공기 조종자나 레저·드론 사업자가 "우리 지역 근처에 쓸 수 있는 이착륙장이 어디 있나"를 확인하거나, 분석가가 이착륙장 분포를 지도에 올려 보는 데 쓴다. 공통 코드나 전역 조인 키가 없어 다른 데이터와는 좌표를 기준으로 한 공간 결합이나 명칭 매칭으로만 잇고, 비행금지·제한구역 같은 드론·초경량비행장치 공간 정보와 겹쳐 보는 용도에 맞다.
description_portal: '초경량항공기 이착륙장 정보는 국내에 등록된 초경량항공기 이착륙장의 명칭과 위치 좌표를 제공합니다.초경량항공기는 항공안전법에서 정한 소형·경량 항공기로, 경량비행기등 최대이륙중량과 성능이 제한된 항공 장치를 말합니다.제공 항목은 이착륙장 유형, 이착륙장의 명칭, 위도·경도 좌표로 구성됩니다.좌표는 도·분·초(DMS, Degrees Minutes Seconds) 형식으로 표기됩니다. 좌표 표기 방식은 다음과 같습니다N(North): 북위를 의미하며, 위도 정보를 나타냅니다. 위도는 적도를 기준으로 북쪽 방향의 각도를 나타내며, 0°에서 90°까지 표시됩니다.E(East): 동경을 의미하며, 경도 정보를 나타냅니다. 경도는 본초 자오선을 기준으로 동쪽 방향의 각도를 나타내며, 0°에서 180°까지 표시됩니다. 예) 363116N 1265610E는 북위 36도 31분 16초, 동경 126도 56분 10초를 의미합니다.'
