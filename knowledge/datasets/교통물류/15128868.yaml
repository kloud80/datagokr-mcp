summary_user: 경기도 도로대장 가운데 지하차도를 시설물 한 곳씩 담은 목록으로, 노선번호·구간번호·지하도로명, 시점·종점 위치와 소재지, 연장·규격·상하행 차로수·종단경사·곡선반경, 소화시설·통과제한높이·환기방식·배수시설, 공사기간·준공일·시행기관 등 20개 항목을 담는다. 화물차 운송사업자가 경로상 지하차도의 통과제한높이를 확인하거나, 분석가가 준공 시기와 소화·환기 설비를 함께 보고 노후·안전 점검 대상 지하차도를 고르는 데 쓴다. 전역 조인 키는 없어서 노선번호(route_no)나 지하도로명·소재지 주소를 이름 매칭해 경기도의 다른 도로대장 자료나 표준노드링크와 연결해야 한다.
description_portal: 이 데이터는 경기도의 도로대장 중 지하차도 관련 정보를 포함하고 있으며, 지하도로명, 노선번호, 구간번호, 시설물종별, 시점 및 종점 위치, 소재지 주소, 연장, 규격, 상·하행 차로수, 종단경사, 곡선반경, 소화시설 종류 및 수량, 통과제한높이, 환기방식, 배수시설 유형, 공사기간, 준공일, 시행기관명 등 총 20개의 항목으로 구성되어 있습니다. 해당 데이터는 각 지하차도의 구조적 특징과 안전 설비, 설계 정보, 공사 및 준공 일정 등을 포함하고 있어 도로 인프라 구축 및 관리, 도시계획 수립, 교통안전 대책 수립 등 다양한 행정·기술적 목적에 활용될 수 있습니다.
