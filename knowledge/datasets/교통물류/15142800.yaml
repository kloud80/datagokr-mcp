description_portal: 본 데이터는 한국도로공사가 관리하는 고속도로에서 발생한 2차사고의 연도별·월별 현황을 제공한다. 2차사고는 선행 사고 처리나 정체 구간에서 추가로 발생하는 사고를 의미하며, 교통안전 관리와 예방 정책 수립에 중요한 기초 자료이다. 본 자료는 2020년부터 2025년까지의 기간을 대상으로 발생월별 2차사고 건수, 사망자 수, 부상자 수를 구분하여 수록하였다. 이를 통해 연도별 추이와 계절적 특성을 비교·분석할 수 있고, 사고 다발 시기 도출 및 안전대책 마련에 활용 가능하다. 또한 연구기관과 지자체, 관련 종사자가 고속도로 사고 특성을 이해하고 예방 활동을 강화하는 데 참고할 수 있도록 구성하였다. 고속도로 이용자의 안전 확보를 위한 정책 기초자료로 활용된다.
