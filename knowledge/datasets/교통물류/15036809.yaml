summary_user: 충청남도 예산군의 전기차 등록 대수와 보조금 신청 대기 건수를 읍면 단위로 정리한 집계 통계로, 551바이트 크기의 CSV 파일 한 개로 받는다. 예산군 공무원이나 충전 사업자가 "어느 읍면에 전기차가 많고 보조금 대기 수요가 몰려 있어 충전소를 먼저 놓아야 하는가"를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 충전소·인구 자료와는 시도명·시군구명·읍면동명 같은 지명을 직접 맞춰 이어 붙인다.
description_portal: 충청남도 예산군에 등록되어 있는 전기자동차 대수 및 각 읍면별 전기자동차 보조금 신청 대수와 관련된 자료를 제공합니다.이 데이터는 충청남도 예산군에 등록된 전기자동차(전기차)의 보급 현황을 정리한 통계 자료입니다.전기차는 내연기관차에 비해 탄소 배출량이 적고, 정부의 친환경 교통수단 정책에 따라 보급이 확대되고 있는 차량으로,이 데이터는 예산군의 친환경 정책 수립, 전기차 충전소 설치 계획 수립, 민간 전기차 수요 예측, 교통 환경 개선 정책 분석 등에 활용되고,공공데이터포털을 통해 제공됩니다.
