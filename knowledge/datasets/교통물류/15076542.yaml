description_portal: '제주특별자치도에서 제공하는 어린이보호구역 내 횡단보도 관련 데이터를 제공합니다.항목: 도로명, 횡단보도종류, 자전거횡단도겸용여부, 차로수, 보행자신호등유무 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 횡단보도는 육교·지하도 및 다른 횡단보도로부터 다음의 거리 이내에는 설치하지 않지만, 어린이 보호구역으로 지정된 구간에는 설치할 수 있습니다(「도로교통법 시행규칙」 제11조제4호)'
