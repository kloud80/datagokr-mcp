description_portal: '데이터 개요「정치장별 경량항공기 등록 현황」은 국내 경량항공기가 등록된 정치장(정치장: 등록지 기준 위치)의 유형별(예: 타면조종형, 체중이동형 등) 등록 대수를 제공합니다.등록 정보는 지역별(시·군·구 단위)로 정렬되어 있으며, 각 정치장에 등록된 항공기의 종류 및 대수를 통해 지역별 경량항공기 보유 현황을 파악할 수 있습니다.데이터 제공 항목정치장경량항공기가 등록된 지리적 위치(행정구역 기준). 시·군·구 또는 읍·면·리 수준까지 포함됨타면조종형날개 및 조종장치를 갖춘 고정익 형태의 경량항공기 등록 대수체중이동형체중 이동을 통해 비행 방향을 조종하는 항공기 등록 대수경량헬리콥터저중량 회전익 항공기 등록 대수자이로플레인자동 회전날개를 가진 회전익형 경량항공기 등록 대수동력패러슈트모터를 장착한 낙하산 형태 항공기 등록 대수계해당 정치장에 등록된 모든 유형의 경량항공기 총합활용 안내지역별 항공레저 활성화 분석 : 각 지역의 항공기 밀도 및 항공레저 사업자 분포 분석 자료로 활용 가능경량항공기 운항기반시설 수요 예측 : 등록 대수가 많은 정치장을 중심으로 이착륙장, 정비시설 수요 평가에 참고 가능지자체 항공산업 육성정책 기초자료 : 항공관광 및 스포츠산업 진흥 정책 수립 시 경량항공기 기반 현황 자료로 활용데이터 해석 시 유의사항일부 정치장은 상세 주소(읍·면·동) 수준까지 기록됨동일 정치장에 다수 기종이 혼합 등록될 수 있으며 중복 계수에 주의실시간 현황이 아닌 주기적으로 갱신된 등록자료임'
