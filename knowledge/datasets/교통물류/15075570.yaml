summary_user: 경기평택항만공사가 관리하는 평택항 컨테이너 정기선 항로를 선사·서비스(항로)별로 담은 현황 목록으로, 선사명·서비스명·기항 형태·운항사·기항지·접안선석(평택컨테이너터미널 또는 평택신컨테이너터미널) 등을 행 단위로 제공한다. 화주·물류기업이 평택항에서 특정 국가·항만으로 가는 정기 컨테이너 항로와 운항 선사를 확인하거나, 분석가가 선사별 서비스와 터미널별 기항 구성을 비교하는 데 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 선사명·서비스명 같은 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 경기도 산하 공공기관인 경기평택항만공사 소관의 컨테이너 정기선 항로 개설 현황(선사현황) 정보입니다.선사 별 기항지, 항차 수, 접안 요일 등에 대한 정보를 제공합니다.제공 항목 중 서비스 명은 각 항로를 구분하는 식별자 역할을 수행합니다.접안선석은 PCTC(평택컨테이너터미널. 평택항의 기존 컨테이너 터미널)과 PNCT(평택신컨테이너터미널. 평택항의 새로운 컨테이너 터미널) 두 가지가 있습니다.주요 활용 방안으로는 물류 효율화, 항만시설 최적화, 신규 항로 개설 검토, 그리고 선사별 서비스 분석 등이 있습니다.
