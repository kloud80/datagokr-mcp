summary_user: 서울시 버스의 노선·정류장별 하루 총 운행횟수와 0시부터 23시까지 1시간 단위 운행횟수를 기준일(CRTR_DD)마다 담은 집계 데이터다. 교통 분석가나 시민이 '우리 동네 정류장에 특정 노선 버스가 출퇴근 시간대에 몇 번 지나가는가'처럼 시간대별 배차 수준을 비교할 때 쓴다. 노선ID(RTE_ID)와 정류장ID(STOPS_ID)는 전역 조인 키로 확인되지 않아, 포털 설명이 안내하는 서울시 노선마스터·정류장마스터 정보와 같은 기관 코드로 맞춰 노선명·정류장명을 붙여 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr)에서 별도 인증키를 발급받아 호출해야 하며 공공데이터포털 활용신청과는 별개다. 노선·정류장 이름은 이 데이터에 없고, 다른 기관 데이터와 이을 공통 코드가 확인되지 않았다.
