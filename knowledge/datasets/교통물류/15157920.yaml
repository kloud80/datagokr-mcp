summary_user: 대전시 버스정보시스템(BIS)의 정류소별 실시간 버스 도착 예정 정보를 정류소 단위로 조회하는 API로, 실호출에서 오퍼레이션 2개가 모두 응답했다. 시민이나 앱 개발자가 '지금 이 정류장에 몇 번 버스가 몇 분 뒤 오나'를 확인하는 데 쓴다. 실측 응답에서 전역 조인 키는 찾지 못했다. 필수 입력인 정류소 ID(BusStopID)·정류소 번호(arsId)를 대전시 정류소 정보 데이터에서 먼저 받아 넘기는 방식으로 이어 쓴다.
limits: 정류소 ID나 정류소 번호를 모르면 호출할 수 없으므로 정류소 목록 데이터를 먼저 조회해야 한다. 공통 조인 키가 없어 다른 기관 데이터와는 이름 매핑이나 같은 기관 코드로만 연결된다. 개발계정은 하루 10,000회로 호출이 제한된다.
