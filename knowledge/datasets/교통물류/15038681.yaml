summary_user: 세종시 조치원공영버스터미널과 서울경부고속버스터미널 사이를 오가는 고속버스의 상행·하행 출발 시각과 버스 등급(고속·우등 등)을 시간표 행 단위로 담은 349바이트 크기의 소형 CSV 파일이다. 조치원에서 서울 강남(경부)으로 가거나 돌아오는 승객이 몇 시 차가 있고 우등인지 확인할 때, 또는 지역 고속버스 운행 횟수를 살펴보는 분석가가 쓴다. 실측 컬럼에 정류장 ID·노선 코드 같은 전역 조인 키가 없어, 다른 버스 노선·정류장 데이터와는 터미널명이나 노선명으로 직접 맞춰 이어 써야 한다.
