description_portal: 세종특별자치시 조치원 소재 조치원공영버스터미널에서 출발 또는 도착하는 고속, 시외, 공항버스 운행 시간표 등 항목을 제공 안내합니다. 데이터 기준일은 2022년 9월 22일 기준입니다. 제공정보로는 각 시간표별 연별, 조치원공영버스터미널에서 출발하여 서울경부고속버스터미널에 도착하는 상행버스의 운행시간표, 각 버스의 고속, 우등 등 등급표시, 서울경부고속버스터미널에서 출발하여 조치원공영버스터미널에 도착하는 하행버스의 운행시간표, 각 버스의 고속, 우등 등 등급표시로 구분되어 있습니다. 세종도시교통공사는 여객의 편안한 여행과 공영버스터미널로서의 기능 향상을 위해 2018년 10월부터 조치원공영버스터미널을 인수하여 운영중이며, 고속버스 1개 노선과 시외버스 5개 노선, 시내/마을버스 19개 노선, 두루타 버스 등이 운행중에 있습니다. 상세주소는 세종특별자치시 조치원읍 조치원로 54 이며, 이용안내 문의전화는 044-850-0225번으로 이용문의 주시기 바랍니다. 시설현황은 건축규모 지상 2층, 대지면적 2,438㎡, 건축면적 231㎡, 대합실 76㎡, 화장실 2개, 승차장 4면으로 구성되어 있습니다.
