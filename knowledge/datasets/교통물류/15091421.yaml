summary_user: 세종시 공공자전거 어울링의 대여소를 한 곳씩 담은 목록 파일로, 대여소 아이디·이름·사용 여부·동 주소와 상세주소·위경도·권역·지오펜스 거리·등록일과 수정일을 담는다. 시민이나 교통 분석가가 집이나 직장 근처에서 지금 운영 중인 어울링 대여소가 어디에 있는지, 권역별로 대여소가 고르게 퍼져 있는지 확인할 때 쓴다. 전역 조인 키는 없으므로 위경도 좌표로 버스정류장·자전거도로 같은 공간 데이터와 겹쳐 보거나, 동 이름으로 행정구역 통계와 맞춰 쓴다.
description_portal: 세종특별자치시 공공자전거(어울링) 대여소 정보 입니다. 2025년 1월 6일자 자료로 업데이트 하였습니다. 행복도시의 쾌적한 도시 환경에 적합한 세종시 어울링원하는 곳에서 쉽게 대여하고 사용 후 가까운 곳에 편리하게 반납하는, 자전거를 이용한 대중교통으로,평일엔 출‧퇴근용으로 사용하고, 야간 및 휴일에는 호수공원 등에서 레저용으로 사용 할 수 있는 창조적인 녹색교통수단입니다.제공정보로는 대여소 개체번호를 나타내는 대여소 아이디, 대여소 이름, 현재 사용유무 상태, 대여소 설치주소(동), 대여조 설치 상세주소, 경도값, 위도값, 세종시 권역구분, 대여소의 지오펜스 거리, 대여소 등록일, 대여소 수정일의 데이터를 공개하고 있습니다.
