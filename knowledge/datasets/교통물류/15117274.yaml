summary_user: 한전KDN 본사와 각 사업소가 쓰는 업무용 차량을 차종·유형·친환경차량 여부·교체시기(임차종료일)·사용용도별로 담은 기관 내부 차량 현황 파일(csv)이다. 공공기관의 친환경차 보유 비율이나 임차 차량 교체 시점을 확인하려는 분석가·시민이 "한전KDN 업무용 차량 중 전기차·하이브리드는 얼마나 되나" 같은 질문에 쓴다. 실측 컬럼에 차량등록번호나 기관코드 같은 전역 조인 키가 없어서, 다른 기관의 차량 현황과는 차종·용도 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 한전KDN(주)에서 운영 중인 전사 차량 현황 데이터는 본사 및 각 사업소에서 사용 중인 차량의 차종, 차량 대수, 친환경 차량 여부, 사용 용도 등의 정보를 포함하고 있습니다. 이를 통해 업무용 차량의 유형과 운행 규모를 파악할 수 있으며, 특히 전기차·하이브리드차 등 친환경 차량의 비율은 ESG 경영과 탄소중립 실천 노력의 지표로 활용됩니다. 차량 용도별 분류는 업무 효율화 및 차량 운영 최적화 전략 수립에 도움이 되며, 향후 차량 교체 계획이나 에너지 절감 정책에도 유용한 자료가 됩니다. 또한 공공기관의 투명한 차량 운영 현황 공개를 통해 국민 신뢰도 향상에도 기여할 수 있습니다.
