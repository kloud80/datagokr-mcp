summary_user: 대구도시철도 역별 승차인원을 월 단위로 집계한 파일(CSV, 약 168KB)로, 한 행이 연·월이고 역명(설화명곡, 중앙로, 동대구역 등)이 각각 열로 펼쳐진 형태이며, 포털 설명상 1997년 11월부터의 1·2·3호선 기록을 담는다. 분석가나 상권·역세권 기획자가 '특정 역의 승차인원이 연도별로 어떻게 변했고, 신규 개통이나 정책 시점 전후로 달라졌는가'를 볼 때 쓴다. 전역 조인 키나 역 코드는 없어 다른 역 정보·좌표 데이터와는 역명을 직접 맞추거나 같은 기관(대구교통공사) 자료끼리만 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 1997년 11월부터 최근까지 수집된 대구도시철도 1, 2, 3호선 전 역사에 대한 월별 승차인원 통계입니다.역별 이용현황을 월 단위로 집계한 자료로, 주요 항목은 역명, 연도, 월, 승차인원으로 구성되어 있습니다.장기간의 데이터가 축적되어 있어 노선별·역별 이용 추이 분석, 연도별 교통수요 변화, 주요 이슈나 정책 반영 효과 분석 등에 유용하게 활용할 수 있습니다.또한 유동인구 기반 상권 변화 분석, 역세권 개발 정책 수립, 민간 교통 관련 서비스 기획 등 행정 및 민간 분야의 정책·서비스 개선을 위한 기초 자료로 활용될 수 있습니다.본 데이터는 월 1회 정기적으로 갱신됩니다.'
