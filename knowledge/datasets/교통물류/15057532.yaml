summary_user: 중고차 거래 때 작성되는 성능상태점검기록부의 등록 건수를 등록 연월·차종·광역시도·모델연도 조건별로 집계해 돌려주는 전국 단위 통계 API이며, 응답은 통계 건수(dtaCo) 하나다. 중고차 시장 분석가나 매매업 사업자가 "특정 지역·연식·차종의 성능점검 등록이 월별로 얼마나 되나"처럼 중고차 거래량 추이를 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 차종코드·지역코드 같은 같은 기관 코드나 연월 기준으로 맞춰 붙여 쓴다.
description_portal: 자동차종합정보 API 서비스로 자동차 등록년, 등록월, 차종코드, 등록지역코드(서울,부산,대구,인천 등 광역시도 구분 코드), 모델년도를 입력하여 성능점검 등록 통계정보를 조회하는 서비스 입니다.성능상태점검기록부는 중고자동차 거래시 자동차관리법 제58조1항에 따라 매수인에게 고지할 의무가 있으며 기간별 성능점검 등록정보를 조건값에 따라 건수로 제공하고 있습니다.* 매월 1일부터 말일까지의 데이터는 익월 2일에 조회 및 활용 가능합니다.* 인증키는 공공데이터 포털에서 자동 발급 됩니다.
