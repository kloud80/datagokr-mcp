summary_user: 경기도 시군별로 수시 평균교통량을 차로수 단위로 집계한 연도별 통계로, 고속국도·일반국도·국지도·지방도 등 도로등급별 차로당 교통량을 담는다. 교통 분석가나 지자체 담당자가 '우리 시군의 지방도 차로당 교통량이 다른 시군보다 높은가, 몇 년 사이 늘었는가'처럼 도로망 계획·투자 우선순위와 상권·입지 분석의 기초 비교에 쓴다. 전역 조인 키는 실측되지 않아 시군 이름이나 경기도 자체 지역코드(region_cd)를 다른 시군구 단위 통계와 이름·코드 매핑해 연결해야 한다.
description_portal: '도로등급별(고속국도, 일반국도, 국지도, 지방도) 시군별/호선별로 구분된 교통량 통계를 연도별로 제공합니다. 교통 혼잡도 예측, 도로망 계획, 교통시설 투자 우선순위 설정 등의 정책 수립을 위한 기초 자료로 활용될 수 있으며, 시계열 분석을 통해 지역별 교통량 변화를 비교하고 교통 정책의 효과를 평가할 수 있습니다. 경기도 교통정보센터 홈페이지에서 차트자료를 확인할 수 있습니다.시군별 : 수시 평균교통량을 차로수단위 및 행정구역 단위로 집계차로별 : 수시 교통량의 도로등급별 호선별 교통량을 도로등급별 호선별 차로수로 나눈 값'
