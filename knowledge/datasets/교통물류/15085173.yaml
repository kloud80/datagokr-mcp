description_portal: '○ 통계개요* 통계명 : 자동차검사 현황* 통계종류 : 일반통계, 보고통계* 작성목적 : 의무적으로 받아야 하는 자동차검사 결과를 공표하여국민의 알권리를 충족시키고, 정부의 자동차관리 정책의 기초자료 제공* 작성대상 : 「자동차관리법」제43조에 따라 정기적으로 자동차검사를 받는 차량을 대상* 조사체계 : 자동차검사(검사소) → 교통안전공단* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 서울시 차종별 자동차검사대수 및 부적합률 등○ 용어설명* 자동차검사 : 운행중인 자동차의 안전도 적합여부 및 배출가스 허용기준 준수여부등을 확인하여 교통사고와 환경오염으로부터 국민의 귀중한 생명과재산을 지키는 사업.* 자동차검사 : 자동차의 구조 및 장치가 교통부령으로 정한 기준에 적합한가의 여부와차대번호를 확인하는 일○ 기타* 자동차검사 : 자동차관리법 제43조 및 제43조2에 의함○ 출처 : 교통안전공단 「자동차검사현황」'
