summary_user: '경기도 내 철도역·버스정류장과 연계된 환승주차장을 주차장 한 곳씩 담은 시설 목록으로, 연도·행정구역·주차장명·소재지·환승수단(예: 1호선)·노외/노상 형식·급지·주차면수·일반요금·환승요금·운영기관을 담는다. 통근자가 집 근처 역에 환승주차장이 있는지와 환승 할인 요금이 얼마인지 확인하거나, 분석가가 시군별 환승주차 면수와 요금 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 행정구역 코드(region_cd)나 주차장명·소재지 이름 매칭으로 전국주차장정보표준데이터(주차장관리번호·좌표가 있는 원장) 같은 다른 주차장 자료와 이어 쓴다.'
description_portal: "이 데이터는 경기도 내 환승주차장의 운영 현황을 정리한 자료로, 대중교통과 연계된 주차 편의 제공을 위한 시설정보를 담고 있습니다. 주요 항목에는 연도, 행정구역명, 주차장명, 소재지, 환승수단(예: 1호선), 주차장형식(노외·노상), 주차급지, 주차면수, 일반주차요금, 환승주차요금, 운영기관 등이 포함됩니다. 해당 데이터는 철도역 또는 버스정류장과 인접한 주차장 정보를 통해 환승 편의성 및 접근성 분석, 교통수요관리 정책 수립, 지역별 대중교통 연계 주차 인프라 현황 파악 등에 활용될 수 있습니다. 특히 '환승주차요금'은 일부 항목에서 비어 있으나, 일반요금과 비교해 요금제 차별성 분석에 유용하며, '주차면수'는 주차 수용 규모 파악에 필수적입니다."
