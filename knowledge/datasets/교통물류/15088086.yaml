summary_user: 운수종사자관리시스템에 등록된 버스·택시·화물차 운수종사자의 운전면허 취소 현황을 연도와 구분(시도 등)별로, 버스·고속버스·전세버스·마을버스·특수여객·개인택시·법인택시·일반화물·용달화물·개별화물 업종 열로 나눠 집계한 통계 파일이며, 개인 단위 원천 기록은 들어 있지 않다. 교통안전 분석가나 지자체 담당자가 "어느 시도·어느 업종에서 운수종사자 면허 취소가 많고, 해마다 어떻게 변하는가"를 확인할 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 연도와 시도 이름을 맞춰 붙이거나, 같은 공단의 운수종사자 관련 통계와 나란히 놓고 본다.
description_portal: '운수종사자관리시템은 여객자동차 운수사업법 및 화물자동차 운수사업법에 따라 버스, 택시, 화물자동차를 운전하는 운수종사자의 종사자격 등을 관리하는 시스템 입니다.관리하고 있는 모든 데이터는 개인정보이므로, 데이터를 가공하여 통계데이터를 개방하였습니다.  * 관리항목 : 운수종사자 경력사항, 교통사고 및 법규위반 이력, 운전적성정밀검사, 운전면허, 자격증 정보, 교육현황정보해당 데이터는 운수종사자관리시스템에 등록된 운수종사자의 운전면허 취소 현황에 대한 데이터로  17개 시도, 업종별(버스, 전세버스, 고속버스, 마을버스, 특수여객, 법인택시, 개인택시, 용달화물, 일반화물, 개별화물) 항목을 가공하여 제공하는 정보 입니다.'
