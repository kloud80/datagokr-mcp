summary_user: 인천교통공사가 운영하는 인천1호선(33개역), 인천2호선(27개역), 7호선 인천·부천구간(11개역)의 이용인원을 수송일자·역·승하차구분별로 06시 이전부터 24시 이후까지 1시간 단위 열로 담은 일별 집계 파일이다. 상권 분석가나 창업 준비자가 '이 역 주변에 출근 시간대와 저녁 시간대에 사람이 얼마나 타고 내리는가'처럼 역세권 유동인구를 가늠하는 질문에 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 데이터와는 역명이나 역번호를 이름·코드 매핑해 연결해야 하며, 같은 기관이 낸 역·시설 자료와는 기관 내부 역번호로 맞춰 쓴다.
limits: 전역 조인 키가 없어 서울교통공사 등 다른 운영기관 데이터나 행정구역 데이터와 붙이려면 역명 매핑을 따로 해야 한다. 시간대 값은 역별 승하차 집계라 출발역-도착역(OD) 이동이나 개인 단위 통행은 알 수 없다. 2025년 6월 28일 개통한 인천1호선 연장 3개역(검단호수공원·신검단중앙·아라)은 개통일부터만 값이 있다.
