summary_user: 경기도 이천시에서 한파 대응용으로 운영하는 온기나눔쉼터를 쉼터 한 곳당 한 행으로 담은 파일로, 읍면동명·설치장소명·도로명/지번 주소·위도·경도·운영 시작·종료일·관리기관과 연락처를 포함한다. 시민이나 복지 담당자가 "우리 동네에서 겨울철에 가까운 쉼터는 어디이고 언제까지 운영하나"를 확인하거나, 분석가가 쉼터가 부족한 읍면동을 찾는 데 쓴다. 전역 조인 키는 없어서 위도·경도로 다른 시설·인구 공간자료와 겹쳐 보거나 읍면동명·주소를 이름으로 맞춰 연결한다.
description_portal: 이 데이터는 경기도 이천시 내 한파 대응을 위한 온기나눔쉼터(이하 ‘쉼터’)의 설치 및 운영 현황을 수록한 자료로, 기준연도, 읍면동명, 쉼터명, 도로명주소 및 지번주소, 설치 위치의 위도·경도 좌표, 운영 시작 및 종료일, 관리기관 및 연락처 등의 항목으로 구성되어 있습니다. 쉼터의 지리정보는 GIS 기반 시각화, 접근성 분석, 기온 저하 시 대피소 안내 등에 활용될 수 있으며, 연도별 운영기간 정보는 한파 기간과의 대응 일치 여부를 검토하는 데 유용합니다. 또한 쉼터 주소와 연락처 정보는 시민 안내, 복지 서비스 연계, 재난상황 대응체계 구축 등에 기초자료로 활용될 수 있습니다. 행정기관은 이 데이터를 기반으로 쉼터 확충 필요 지역 도출, 민감계층 보호 정책 수립, 계절성 복지 정책 운영 현황 점검 등에 활용할 수 있습니다.
