summary_user: 경기도 성남시 어린이 보호구역 주변에 설치된 옐로우 카펫(노란 바닥·벽면 도색 시각유도 시설)을 한 곳당 한 행으로 담은 파일로, 위도·경도 좌표와 대상시설명, 관할경찰서, 보호구역아이디를 개별 주소·좌표 단위로 기록한다. 학부모나 교통안전 담당자가 '우리 동네 초등학교 앞에 옐로우 카펫이 설치되어 있는가, 아직 없는 보호구역은 어디인가'를 확인하고 설치 우선지역을 고를 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표로 공간 결합하거나 대상시설명·관할경찰서명 같은 이름 매핑, 또는 보호구역아이디를 같은 기관의 어린이 보호구역 데이터와 맞춰 보는 방식으로 이어 쓴다.
description_portal: 경기도 성남시 옐로우 카펫 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다.경기도 성남시의 옐로우 카펫(Yellow Carpet) 데이터는 어린이 보호구역 내 보행자의 안전 확보와 교통사고 예방을 목적으로 설치된 시각유도 시설에 대한 정보를 포함하고 있습니다. 이 데이터는 주로 초등학교 주변 교차로 또는 횡단보도 인근에 설치된 옐로우 카펫의 위치 등의 항목으로 구성되어 있습니다. 옐로우 카펫은 노란색의 바닥 도색과 벽면 색상 강조를 통해 운전자의 주의를 환기시키고, 어린이 보행자가 횡단 전 대기할 수 있는 안전 공간을 명확히 표시하는 기능을 합니다. 이러한 데이터는 교통약자 보호 정책 수립, 시인성 강화 시설의 우선 설치 지역 선정, 보행자 사고 예방을 위한 환경개선사업 등 다양한 정책적 활용이 가능하며, 교통안전계획 수립의 기반 자료로 사용됩니다.
