description_portal: '○ 통계개요* 통계명 : 기상상태별 교통사고 현황* 통계종류 : 일반, 보고통계(승인번호 132002)* 근거법령 :「도로교통법」제2조에 규정하는 도로에서 차의 교통으로 인하여발생한 인적피해를 수반하는 교통사고* 작성목적 : 교통위반 및 사고 현황을 종합적이고 체계적으로 분석하여 교통안전대책 수립, 학술연구 등의 기초자료 및 국민의 교통안전의식 제고에활용하는 것을 목적으로 함* 조사체계 : 서울지방경찰청 → 서울특별시* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 기상상황별 교통사고 발생건수, 사상자수 등○ 용어설명* 교통사고 : 도로교통법 제2조의 규정에 의한 도로(도로법에 의한 도로, 유료도로법에의한 유료도로, 그 밖의 불특정 다수의 통행을 위하여 공개된 장소)에서차량의 운행중 인적인 피해가 발생한 사고* 사망자 : 교통사고 발생시로부터 30일이내에 사망한 경우* 부상자 : 중상+경상+부상신고** 중상 : 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우** 경상 : 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우** 부상신고 : 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우'
