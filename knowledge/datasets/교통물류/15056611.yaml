summary_user: 자동차 이전(변경)등록을 등록연월·차종·광역시도·사용연료·차명·용도·성별·연령대·이전등록구분(매매업자·당사자·상속·증여 등)별 조건으로 조회한 통계 건수(dtaCo)를 담는 전국 단위 집계 데이터다. 분석가나 중고차 사업자가 '특정 지역에서 지난달 전기차 당사자거래 이전등록이 몇 건이었나' 같은 중고차 거래·명의이전 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지역·차종·연료 같은 코드나 이름을 매핑하거나 같은 기관의 자동차 등록 통계와 같은 조건으로 맞춰 이어 쓴다.
limits: 건별 차량·소유자 원천이 아니라 입력 조건에 따른 통계 건수만 돌려주므로 개별 차량 추적이나 시군구 이하 분석에는 쓸 수 없다. 공용 조인 키가 없어 다른 데이터와 붙이려면 코드·이름 매핑이 필요하며, 개발계정은 하루 10,000회 호출로 제한된다.
