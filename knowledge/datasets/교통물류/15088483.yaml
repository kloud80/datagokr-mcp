description_portal: < 용도별 차종별 시군구별 일평균 자동차 주행거리 - 단위(km/대)>국내에 등록되어 도로를 운행 중인 자동차의 용도별, 차종별 시군구별 1일 평균 자동차 주행거리 현황입니다.우리나라 시군수별로 등록된 자동차 대수, 자동차 용도, 자동차 주행거리를 1일 평균으로 비교분석한 통계입니다. 전체용도의 통계와 비사업용 자동차와 사업용 자동차로 구분되며, 각각 승용차, 승합차, 화물차, 특수차로 세분 구분하여 제공하고 있습니다. 특별시, 광역시, 광역도의 합계와 시군구를 구분하고 있으며 1일 평균 주행거리를 km당 차량 대수 단위로 제공하고 있습니다.
