summary_user: 전국 시군구별로 등록 자동차의 1일 평균 주행거리(km/대)를 전체·비사업용·사업용 용도와 승용·승합·화물·특수 차종으로 나눠 담은 집계 통계 파일이며, 시도 합계와 시군구 행이 함께 들어 있다. 교통·환경 분석가가 '우리 지역 화물차는 다른 시군구보다 하루에 얼마나 더 달리나' 같은 지역별·차종별 운행 강도 비교에 쓴다. 표준 행정코드 같은 전역 조인 키가 없어 시도·시군구 이름을 매핑해야 다른 시군구 단위 통계(자동차 등록대수 등)와 이어 쓸 수 있다.
limits: 값은 차량 1대당 일평균 주행거리 집계라 개별 차량이나 도로 구간별 주행량은 알 수 없다. 행정코드가 없어 시군구 이름으로 연결해야 하며, 시도 합계 행과 시군구 행이 섞여 있으므로 합산할 때 중복에 주의한다.
