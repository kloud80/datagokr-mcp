summary_user: 경기도 군포시 관내 도로에서 이뤄진 깊이 1m 이상 도로굴착 행위허가를 건별로 담은 파일(csv 약 21KB)로, 최근 3년치 허가 건마다 지번주소·공사목적·착공일자·준공일자를 기록하며 취소된 건은 빠져 있다. 주민이나 사업자가 '우리 동네 어느 도로가 언제부터 언제까지 무슨 이유로 파헤쳐지는가'를 확인하거나, 분석가가 특정 구간의 중복굴착·공사 집중 시기를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소·좌표로 변환하거나 같은 군포시 기관 데이터와 이름으로 맞춰 이어 써야 한다.
limits: 공통 코드나 식별자가 없어 다른 데이터와 직접 조인할 수 없고 주소 매칭에 의존해야 한다. 명세상 반기 단위로 생성되는 데이터라 실시간 공사 현황 확인에는 맞지 않으며, 범위는 군포시 한 곳에 한정된다.
