summary_user: 한국철도공사 역사 안에서 임대로 운영되는 매장을 매장 한 곳 단위로 담으며, 매장명·역사 내 위치·층수, 개업일자와 계약 시작·종료일자, 승인면적, 사업 구분, 평일·휴일 영업시간, 주소를 전국 범위로 제공한다. 이용객이 특정 역에 어떤 매장이 몇 시까지 여는지 확인하거나, 사업자·분석가가 역별 임대매장의 업종 구성과 계약 만료 시점을 살펴보는 데 쓴다. 역코드(stn_cd)가 교통 노드 코드(transit_node_cd)로 이어져 역 위치·시설 데이터와 결합할 수 있고, 코드 값의 뜻은 함께 제공되는 코드정보 오퍼레이션의 역코드 유형으로 확인한다.
limits: 역코드는 이 API 전용 코드 체계라서 다른 데이터와 붙이기 전에 코드정보 조회 결과로 값을 확인해야 한다. 개발계정 호출은 하루 10,000회로 제한된다. 매출이나 임대료 같은 영업 실적은 들어 있지 않다.
