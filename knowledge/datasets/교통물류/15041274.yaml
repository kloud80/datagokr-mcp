summary_user: 대전교통공사가 운영하는 도시철도 노선의 역사 안 ATM을 기기 한 대씩 한 행으로 담은 작은 파일(CSV 571바이트)로, 역명·지상/지하 구분·층·상세 위치·금융기관명·연락처를 담는다. 대전 도시철도 이용객이 "이 역에 어느 은행 ATM이 몇 층 어디에 있나"를 확인하거나, 역 편의시설 안내를 만드는 사업자가 역별 ATM 위치를 정리할 때 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 이어 쓴다.
