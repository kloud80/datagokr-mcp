summary_user: 한국건설기술연구원이 제공하는 전국 도로의 수시구간 교통량 통계로, 조사연도·도로등급·구간 ID·시간대 구분별로 당해·1년 전·2년 전 교통량과 13개 차종별 교통량을 담는 집계 데이터다. 교통 분석가나 지자체 담당자가 특정 도로 구간의 교통량이 최근 몇 년간 어떻게 바뀌었는지, 화물차 같은 차종 구성이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 교통량 자료와는 구간 ID(SCTN_ID)·도로등급의 이름이나 코드를 직접 맞춰 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시구간통계 정보입니다.\""
