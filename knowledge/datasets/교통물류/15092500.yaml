description_portal: '데이터 개요국토교통부_환승여객별 항공통계는 항공 통계 상세조회 항목 중 ‘환승여객’을 선택하여, 공항별‧기간별 환승 여객 현황을 정량적으로 분석할 수 있는 데이터를 제공합니다. 환승 수요에 기반한 공항운영 전략 수립, 인프라 투자계획, 항공사 네트워크 분석 등에 활용할 수 있습니다.데이터 제공 항목공항명공급(석): 해당 기간 동안 투입된 총 좌석 수운항(편): 해당 기간 동안의 총 운항 편수여객(명): 환승으로 분류된 항공 여객 수화물(톤): 동일 기간 동안의 환승 관련 항공 화물 처리량출처 및 갱신 주기국토교통부 항공정보포털시스템(Airportal)에서 제공하는 항공통계 상세조회 서비스 중 하나로,‘여객구분’에서 **‘환승’**을 선택한 데이터를 기반으로 구성됨제공 기간: 월간/연간 단위 기준 통계포맷: 웹 조회 및 엑셀 파일 다운로드 가능데이터 해석 시 유의사항환승여객은 ‘입국 후 출국이 아닌 항공편 간 환승’ 개념에 해당함동일 여객이 다구간 여정 중 2회 이상 환승한 경우 건수 중복 가능항공사별, 시간대별 데이터는 별도 항목에서 확인 필요활용 안내주요 환승공항(예: 인천, 김포 등)의 환승객 유입 현황 분석항공사 노선망 재편, 허브공항 경쟁력 평가 자료로 활용공항별 인프라 용량 검토 및 환승객 서비스 설계 기초 자료외국항공사 환승 유치 마케팅 및 환승 인센티브 정책 수립 지원예시 데이터공항명공급(석)운항(편)여객(명)화물(톤)전체 합계14,427,32272,946660,184399,370인천(ICN)7,264,34335,399657,610349,320김포(GMP)1,994,40110,11826616,136'
