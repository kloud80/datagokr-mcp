summary_user: 여수시 관내를 오가는 시민여객선의 객실 구성을 선박·객실 단위로 담은 작은 파일(csv, 약 1.7KB)로, 선박명·객실명·객실등급·객실정원·좌석 지정 여부·적용 시작일·사용 여부가 들어 있다. 여객선 이용객이나 여행 안내 서비스가 "이 배에 특실이 있고 정원은 몇 명인지, 좌석이 지정되는지"를 미리 확인할 때 쓴다. 전역 조인 키가 없어 다른 여객선 운항·항로 데이터와는 선박명을 이름으로 맞춰 이어 써야 한다.
description_portal: 여수시 관내를 운항하는 여객선의 객실 등급 및 객실 운영 현황에 대한 정보를 제공하는 데이터입니다. 이 데이터는 여객선 이용객이 선박별 객실 종류와 정원, 예약 가능 여부 등을 사전에 확인할 수 있도록 지원하며, 보다 편리하고 효율적인 해상교통 이용 환경을 조성하기 위해 구축되었습니다.데이터에는 여객선 선박명, 객실명, 객실등급, 객실정원, 예약시스템 운영 여부 등 객실 이용과 관련된 다양한 정보가 포함됩니다. 이용객은 이를 통해 여객선별 객실 구성을 비교하고, 일반석, 특실 등 객실 등급에 따른 이용 가능 좌석 수와 예약 가능 여부를 확인할 수 있습니다. 또한 여행 일정과 이용 목적에 맞는 객실을 선택하는 데 필요한 정보를 얻을 수 있어 예약 편의성을 높일 수 있습니다.
