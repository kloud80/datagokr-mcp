summary_user: 광주도시철도공사가 운영하는 도시철도 역마다 설치된 자동제세동기(AED)의 위치를 역명·선명·지상지하·역층·출입구번호·상세위치 단위로 담고, 출력에너지·운영방식·수량도 함께 담은 건별 목록 파일이다(CSV 약 1.4KB). 승객이나 역 안전 담당자가 '광주 도시철도 이 역에서 가장 가까운 제세동기는 몇 층, 어느 출입구 근처에 있나'를 확인할 때 쓴다. 전역 조인 키는 없으므로 다른 역 정보나 다른 운영기관의 제세동기 데이터와는 역명·선명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 광주도시철도공사에서 운영하는 도시광역철도역들의 철도운영기관명, 선명, 역명, 지상지하, 역층, 출입구번호, 상세위치, 제세동기출력에너지의 데이터가 있습니다.자동제세동기는 자동(自動)으로 세동(細動)을 제(際)거하는 기(器)계라는 의미다. 환자에게 심정지(심장마비)가 왔을 때 자동제세동기를 통해 환자의 심장을 인위적으로 뛰게 하면, 환자의 생존율을 두 배 이상 높일 수 있다. 하지만 이런 중요성에도 불구하고, 대다수의 사람들은 자동제세동기의 기능과 사용법에 대해 알지 못한다. 평소에 자동제세동기에 대한 전반적인 내용을 숙지토록 하여야 한다.
