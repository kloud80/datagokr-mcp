summary_user: 인천광역시 안의 보도육교를 시설물 한 곳당 한 행으로 담은 파일로, 시설물명·주소·길이·폭·준공년도·관리주체를 기록한다. 시 도로 담당자나 분석가가 준공년도가 오래된 육교를 골라 안전점검·개선 우선순위를 정하거나, 구별 육교 분포를 확인하는 데 쓴다. 전역 조인 키는 없어서 주소를 지오코딩하거나 시설물명으로 같은 기관의 다른 도로 시설물 자료와 맞춰 이어 써야 한다.
limits: 표준 코드나 시설 고유번호 같은 공통 키가 없어 다른 데이터와의 연결은 이름·주소 매칭에 의존한다. 범위는 인천광역시에 한정되므로 다른 시도와 비교하려면 지자체별 파일을 따로 모아야 한다.
