summary_user: 광주교통공사 운영 노선 역사에 설치된 물품보관함을 역·위치·크기별로 한 행씩 담은 시설 목록 파일로, 역명·선명·지상지하 구분·층·상세위치·사이즈·시설 수·이용요금이 들어 있다(CSV 약 3KB의 소규모 파일). 광주 지하철을 이용하는 여행객이나 시민이 "어느 역 몇 층에 짐을 맡길 보관함이 있고 요금은 얼마인가"를 확인하거나, 역별 편의시설 현황을 정리하는 데 쓴다. 전역 조인 키나 역 코드는 없어 다른 철도·역 데이터와는 역명·선명 같은 이름 매칭으로만 연결한다.
limits: 역 코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 역명 표기를 직접 맞춰야 한다. 포털 범위 표기는 전국이지만 실제로는 광주교통공사 노선만 담고 좌표가 없는 비공간 데이터이므로, 지도 표시나 다른 도시 비교에는 별도 자료가 필요하다.
