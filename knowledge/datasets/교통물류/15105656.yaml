description_portal: 용인경량전철에 포함된 도시광역철도역들의 철도운영기관, 운영노선명, 역명, 역내안전설비 구분, 근접출입구 번호, 상세위치, 운영방식, 출력에너지, 보유대수, 데이터기준일의 데이터가 있습니다.자동제세동기는 자동(自動)으로 세동(細動)을 제(際)거하는 기(器)계라는 의미다. 환자에게 심정지(심장마비)가 왔을 때 자동제세동기를 통해 환자의 심장을 인위적으로 뛰게 하면, 환자의 생존율을 두 배 이상 높일 수 있다. 하지만 이런 중요성에도 불구하고, 대다수의 사람들은 자동제세동기의 기능과 사용법에 대해 알지 못한다. 평소에 자동제세동기에 대한 전반적인 내용을 숙지토록 하여야 한다.
