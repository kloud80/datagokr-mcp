summary_user: 광주광역시 북구 교통지도과가 적발한 불법주정차 단속을 건별로 담은 CSV 파일(약 32MB)로, 단속일시·단속동·단속장소·단속구분(고정형CCTV·버스장착형CCTV·주행형CCTV·기동·시민신고·일반도보)·단속원금을 기록한다. 주민이나 분석가가 '북구에서 어느 동·어느 장소에 어느 시간대에 주정차 단속이 몰리는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속동 이름이나 시군구명 같은 이름 매핑으로만 붙이며, 같은 형식의 다른 시군구 주정차단속 파일과 나란히 비교하는 식으로 이어 쓴다.
limits: 범위가 광주 북구 한 곳(시군구 단위)뿐이라 광역·전국 비교는 다른 지자체 파일을 따로 모아야 한다. 법정동 코드 같은 공통 키가 없어 행정구역·좌표 데이터와 붙일 때는 동 이름을 직접 맞춰야 한다.
