status: active
summary_user: 인천국제공항 화물편의 도착·출발 운항정보를 조회일 기준 D+6일까지 편 단위로 담으며, 항공사·편명·출발지(또는 도착지) 공항명과 IATA 코드·예정시간·변경시간·터미널 등을 제공한다. 물류업체나 화주가 '이번 주 특정 공항발 화물기가 인천에 언제 도착하고 시간이 바뀌었는지'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 공항 IATA 코드(airportCode)나 편명·항공사명을 기준으로 공항코드 자료나 다른 운항정보와 이름·코드 매핑으로 연결한다.
limits: 실측 컬럼에서 다른 데이터와 바로 묶을 공통 조인 키를 찾지 못해, 연계하려면 공항코드·편명 같은 이름·코드 매핑이 필요하다. 개발계정은 일 1,000회 호출로 제한된다.
