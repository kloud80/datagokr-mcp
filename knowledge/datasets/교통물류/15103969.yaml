description_portal: 인천국제공항공사에서 제공하는 인천국제공항 화물편 운항 정보에 대한 데이터로 화물기 주간 운항 도착정보와 화물기 주간 운항 출발 정보를 제공합니다. 인천국제공항의 조회일 기준 D+6일간의 화물편 운항정보를 출발지 공항 코드 (IATA)를 기준으로 구분하여 항공사,출발지공항명,출발지공항코드(IATA),편명,예정시간,변경시간,주기장,터미널 등의 정보를 제공합니다. 개발 계정 일 1000트래픽, 운영 계정 신청 시 일 100000 트래픽을 제공합니다. 데이터 포맷은 JSON과 XML을 모두 제공합니다.
