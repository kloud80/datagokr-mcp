summary_user: 정읍시가 2024년 안전신문고에 접수된 불법주정차 신고를 건별로 담은 파일로, 건마다 단속 일시·단속 장소·과태료 부과 여부·횡단보도 인근 여부가 들어 있다(CSV 약 143KB). 시민이나 분석가가 '정읍시에서 불법주정차 신고가 어느 장소·시간대에 몰리고, 그중 실제 과태료가 부과된 비율은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속 장소 이름을 주소·지명으로 맞추거나 같은 기관(정읍시) 단위로만 이어 쓴다.
limits: 단속 장소가 좌표 없이 텍스트로만 있어 지도 표시나 다른 공간 데이터와 바로 결합할 수 없고, 범위는 정읍시 한 곳의 2024년 신고에 한정된다. 공통 코드 키가 없어 타 시군구 자료와 합칠 때 이름 매핑이 필요하다.
