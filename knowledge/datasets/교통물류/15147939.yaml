description_portal: 이 데이터는 부산항만공사의 외내항 선박 통합 집계 실시간 자료로, 연도와 월, 분기별 기준으로 선박의 입항 및 출항 현황을 기록합니다. 항만별, 부두별, 선종별로 국내선과 외국선의 수와 총 톤수를 집계하여 항만 운영 현황을 실시간으로 파악할 수 있도록 제공합니다. 이를 통해 외내항 구분에 따른 선박 수요를 추적하고, 수출입 구분별 물동량 흐름을 확인할 수 있습니다. 항만 관리자는 본 데이터를 활용해 선박 접안 계획, 부두 운영 효율화, 물류 수송 능력 평가를 수행할 수 있으며, 연구자와 정책 담당자는 실시간 선박 집계 자료를 통해 항만 경쟁력 분석과 물류 정책 수립에 기초 자료로 활용할 수 있습니다.
