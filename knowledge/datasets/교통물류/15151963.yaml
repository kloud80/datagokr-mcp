description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 전국 14개 공항을 운영하는 공공기관입니다.해당 데이터는 2024년 군산공항 유입지역을 읍면동 단위까지 알 수 있는 데이터입니다.공항 주차장 입출차 정보와 국토부 차량등록원부(여객의 범주화된 주소, 연령대, 성별) 정보를 결합한 데이터이며, 결합에 대한 내용은 개인정보보호위원회 심의를 통과한 안전한 데이터입니다.데이터의 구성은 월, 시군구, 읍면동, 성별, 연령구분, 유입차량수로 구성되어 있습니다.연령대에서 기타 부분은 법인차량이며, 순수 여객이 어디서 오는지 알고 싶으시면 법인차량을 제외하고 데이터를 활용하시는 것을 추천드립니다.추가 문의사항이나 요구사항 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
