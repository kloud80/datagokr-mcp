summary_user: 제주특별자치도 어린이보호구역 안에 설치된 신호등을 한 기씩 위치(위도·경도·주소), 도로노선, 신호 제어·점등 방식, 점멸 운영 시각, 잔여시간표시기·시각장애인용 음향신호기 유무 등으로 담은 건별 CSV 파일(약 295KB)입니다. 학부모나 교통안전 분석가가 특정 학교 앞 보호구역 신호등에 잔여시간표시기나 음향신호기가 갖춰져 있는지, 야간에 점멸로 운영되는지 확인할 때 씁니다. 전역 조인 키는 없으므로 어린이보호구역·무인교통단속카메라 같은 제공표준 데이터와는 위도·경도나 주소, 시군구명을 맞춰 공간·이름 기준으로 이어 씁니다.
description_portal: '제주특별자치도에서 제공하는 어린이보호구역 내 신호등 관련 데이터를 제공합니다.항목: 도로노선번호, 노선명, 위도, 경도, 신호등구분 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 어린이 보호구역으로 지정한 시설의 주 출입문과 가장 가까운 거리에 위치한 간선도로의 횡단보도에는 신호기를 우선적으로 설치·관리해야 합니다(「어린이·노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙」 제6조제1항)'
