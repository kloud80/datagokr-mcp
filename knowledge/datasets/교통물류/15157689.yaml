summary_user: 인천항 갑문 운영 시스템의 풍향·풍속, 갑문 입출거 예정 시간표, 월별 예상 수위, 내외항 실시간 수위, 내항 충수 요청을 오퍼레이션별로 조회하는 API이며, 충수 요청은 신청 건별(선박명·톤수·너비·길이·흘수·접안예정선석)로 담는다. 선사나 대리점 담당자, 항만 운영 분석가가 특정 일자에 갑문을 통과할 선박 일정과 내항 수위 요청 상황을 확인하는 데 쓴다. 전역 조인 키는 없어서 선박명·회사명 같은 이름 매핑이나 같은 기관(Port-MIS 계열 인천항만공사 API)의 코드로 다른 데이터와 잇고, 필수 파라미터(facilMeetDt, gateMm 등)는 다른 데이터에서 받은 코드를 넘겨야 한다.
description_portal: 해당 자료는 인천항만공사에서 운영중인 갑문 운영 시스템에서 인천항의 풍향 풍속 정보, 갑문 입출거 예정 시간표, 월별 예상 수위 정보, 실시간 내외항 수위 정보, 내항 충수 요청 정보를 조회하는 서비스를 Open API 형태로 제공하며, 주요 요청 변수로는 선석 회의 일자, 선박 구분, 호출부호(callLetter), 입출항 시간, 선박명, 선박 제원(너비, 길이, 흘수 등), 소속사명 등이 있습니다. 조회 결과는 갑문별 선박 통과 내역과 통과 예정 시간, 통과 선박 수, 선박별 상세 정보 등을 제공하며 이 정보는 항만 운영 효율화, 입출항 관리 최적화, 해운 물류 계획 수립, 항만 안전 관제 시스템 등에 활용 될 수 있습니다.
