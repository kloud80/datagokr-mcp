summary_user: 부산광역시 서구에서 운행하는 마을버스를 노선 한 줄 단위로 정리한 작은 현황 파일(csv 약 1.6KB)로, 운송업체·기점·경유지·종점, 운행거리, 운행·예비 차량 수, 첫차·막차 시간, 평일·주말 배차간격, 연령별 카드·현금 요금을 담는다. 서구 주민이 특정 마을버스의 막차 시간이나 배차간격을 확인하거나, 분석가가 노선별 차량 수와 배차간격을 비교해 증차·노선 조정 필요성을 검토하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선번호나 정류장·지명 같은 이름을 맞추거나 구군명(시군구)으로만 연결하며, 부산 BIS 정류장·노선 원장이나 실시간 도착 정보와 이어 볼 때도 이름 매핑이 필요하다.
description_portal: 부산광역시 서구에서 운영 중인 마을버스의 운행 정보를 체계적으로 관리하기 위해 구축된 마을버스 운행 현황 데이터입니다.수집 항목에는 노선번호, 운송업체명, 기·종점 및 주요 경유지, 운행거리, 운행 차량수·예비 차량수, 첫차·막차 시간, 배차간격, 요금 정보, 연락처 등 마을버스 운영에 필요한 핵심 정보가 포함되어 있으며, 이를 통해 노선별 운행 특성 분석, 배차 효율성 검토 등 다양한 활용이 가능합니다.예시 데이터에는 서구 1, 서구 2, 서구 2-2, 서구 3, 서구 3-1, 서구 5 등 다양한 마을버스 노선이 포함되어 있으며, 각 노선별 운행구간, 차량 운영 현황, 시간표(첫차·막차·배차간격), 요금, 그리고 데이터 기준일자 정보가 제공됩니다.본 데이터는 대중교통 서비스 개선, 노선 신설·조정 검토, 배차 간격 최적화, 교통 접근성 향상 등 여러 행정 및 교통 정책 분야에서 활용될 수 있습니다.
