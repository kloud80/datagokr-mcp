summary_user: 대전광역시 공영자전거 '타슈'의 대여소를 한 건씩 담은 데이터로, 대여소 번호·명칭·설명·주소·자치구와 위도·경도 좌표, 거치대 수(dfrCo) 등을 대여소별 주소·좌표 단위로 제공한다. 시민이 집이나 목적지 근처의 타슈 대여소와 거치대 규모를 찾거나, 분석가가 대전 시내 구별 대여소 분포와 공백 지역을 파악해 확충 계획을 검토할 때 쓴다. 전역 공통 조인 키는 없어서 자치구명(signgu)이나 주소·좌표를 기준으로 다른 자전거도로·행정구역 데이터와 공간·이름 매칭으로 이어 쓴다.
description_portal: 대전광역시 타슈 정보는 공영자전거 ‘타슈’의 대여소 위치와 자전거 현황을 포함한 상세 데이터를 제공합니다. 주요 내용은 각 대여소의 명칭, 주소, 위도·경도 좌표, 거치대 수 및 이용 가능한 자전거 수량이며, GPS 기반 위치 정보로 실시간 대여소 상태 확인이 가능합니다. 이 자료는 시민들이 가까운 대여소를 쉽게 찾고 자전거를 편리하게 이용하도록 돕고, 도시 내 자전거 인프라 현황 파악 및 확충, 정비 계획 수립에 중요한 역할을 합니다.2022년 대전광역시 공공데이터 기업매칭지원사업으로 개발한 데이터입니다.
