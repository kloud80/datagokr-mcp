status: active
summary_user: 대전광역시 안에 설치된 육교를 한 건씩 담은 데이터로, 육교명·도로 종류와 노선·도로명주소·위경도와 함께 총연장·높이·폭·통행제한높이·난간 높이·조명 수·장애인 편의시설(유형·개수)·준공일자 같은 규격을 담는다. 보행 동선을 분석하는 분석가나 시민이 '우리 동네 육교 중 엘리베이터 같은 장애인 편의시설이 있는 곳은 어디인가', '차량 통행제한높이가 낮은 육교는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명주소·좌표나 노선번호·이름 매칭으로만 잇는다.
limits: 다른 데이터셋과 바로 붙는 공통 코드가 없어 연계하려면 주소·좌표·이름 매핑이 필요하다. 범위는 대전광역시 한 곳이고, 포털 설명대로 법적 효력이 없어 참고용으로만 쓴다. 개발계정은 하루 10,000회까지 호출할 수 있다.
