description_portal: 대전교통공사 대전도시철도 1호선 역명 및 도로명 주소역명, 도로명 주소의 변경이 없어 기존 업데이트 정보와 변경 사항 없음향후 역명 제개정 사유 발생시 신규 자료로 업데이트 예정임자료는 역번호,역의 위치, 한글,한자,로마자로 표기되어 있습니다.역명괄호는 병기역명이며 필요 시 부기역명을 표기할 수있습니다.역명제정(병기) 기준은,  역이 소재한 관할 행정동명이나 도로명,  문화유적지 및 주요 공공시설 명칭,   기타 시민이 역 위치를 가장 쉽게 알 수 있는 명칭역명 제·개정 절차는   ① 타당성 검토 (의견수렴)  ② 역명 제정(변경) 검토의견(공사 →市)  ③ 시 지명(시정)원회 심의·결정  ④ 확정 고시(시장)  ※ 역명병기는 시정위원회 심의 후 확정역명 병기는 기준은  역명은 역주변의 행정구역․관공서․문화유산 등 상징성에 의해 결정되었으며 부득이한 경우 역명을 병기, 역명의 추가 병기는 형평성, 공정성 논란을 낳을 소지가 있고, 역명 대표성 퇴색 및 고객 이용 혼란 우려 등이 예상되므로 역명 개정 및 추가병기는 신중히 처리해야 할 문제입니다.
