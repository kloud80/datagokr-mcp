description_portal: '해양교통안전정보시스템(MTIS)에서 제공 중인 "실시간 해양교통정보" 서비스는해양수산부 공동활용체계 기준 해양격자 4단계를 기반으로 매 5분 단위의 실시간 해양 교통량 정보(선박척수)와 밀집도(%)를 제공합니다.주요 기능은 다음과 같습니다.1. 조건선택: 일자, 시간, 선박용도, 톤수 선택2. 격자 레벨(해양수산부 격자 단계)- 2단계(15분): 약 22.7x27.7km- 3단계(3분): 약 4.4x5.5km- 4단계(1분30초): 약 2.3x2.8km3. 시각화 및 분석결과 제공: 격자별 선박용도, 톤수별 교통량 통계 관련 시각화 및 엑셀 파일로 즉시 다운로드 가능'
