status: active
summary_user: 해양교통안전정보시스템(MTIS)이 해양수산부 해양격자(2~4단계)별로 5분 단위 해양 교통량(선박 척수)과 밀집도(%)를 집계해 담은 실시간 데이터이며, 범위는 전국 해역입니다. 해운·항만 분석가나 운항 관계자가 '지금 특정 해역 격자에 선박이 얼마나 몰려 있는가'를 선박용도·톤수별로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 격자번호(grid_id)를 해양수산부 해양격자 체계와 매핑하거나 같은 기관 자료와 이어 쓰는 방식으로만 연결된다.
limits: 개별 선박의 위치·항적이나 입출항 기록이 아니라 격자 단위 집계값이므로 선박 추적에는 쓰지 못한다. 다른 데이터와 바로 붙일 공통 키가 없어 격자번호 매핑이 별도로 필요하며, 개발계정은 하루 500회 호출 제한이 있다.
