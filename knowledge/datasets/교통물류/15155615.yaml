summary_user: 부산 해운대구 안전신문고로 들어온 불법주정차 신고와 그에 따른 단속(과태료 부과) 내역을 신고 건별로 담은 2024년 1회성 파일로, 민원 구분·신고 일시·단속 일시·단속 장소·비고를 기록한다. 해운대구에서 어느 장소·시간대에 불법주정차 신고와 단속이 몰리는지, 신고 뒤 단속까지 얼마나 걸리는지를 보려는 주민·분석가가 쓴다. 전역 조인 키나 코드가 없어 단속장소 텍스트를 주소·지명으로 맞추거나 같은 기관의 다른 주정차 데이터와 이름 기준으로만 이어 쓴다.
limits: 해운대구 한 곳의 2024년치만 담은 1회성 데이터라 다른 지역 비교나 시계열 추적에는 쓰지 못한다. 장소가 좌표 없는 텍스트라 지도에 올리려면 별도 주소 변환이 필요하다.
