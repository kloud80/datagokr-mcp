description_portal: '이 데이터셋은 한국철도공사(KORAIL)의 "트로리(Trolley)" 사용 승인 기록에 대한 상세 정보를 제공합니다. 트로리는 철도 선로 위에서 인력이나 소규모 자재를 운반하거나 선로 점검, 보수 작업 시 사용되는 소형 장비로, 열차 운행에 지장을 주지 않기 위해 사용 전 엄격한 승인 절차를 거칩니다. 본 데이터는 트로리 사용의 운영 현황 및 안전 관리 기록을 담고 있으며, 주요 컬럼으로는 소속 코드, 관리 번호, 시행 일자를 포함합니다. 핵심 정보인 구간 내용에는 트로리가 운행된 정확한 선로 구간 및 이정(킬로미터)이 명시되어 있으며, 선행 열차 내용과 후속 열차 내용은 트로리 운행 전후의 안전 확보를 위한 열차 정보를 나타냅니다. 또한, 트로리 사용의 **목적(예: 차단 작업, 자재 운반, 선로 순회 등)**과 승인 시 사용된 표찰 표시 내용 등의 안전 관련 정보도 포함하고 있습니다.'
