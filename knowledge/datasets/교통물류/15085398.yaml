summary_user: 부산교통공사가 운영하는 부산 도시철도 1~4호선 역 안에 설치된 비상콜폰의 위치를 한 대씩 담은 파일(CSV, 약 50KB)로, 운영기관·노선·역명·역층·상세위치(상하선 승강장번호, 출입구 표시)를 기록한다. 역 관리자나 안전 분석가가 '이 역 어느 층, 몇 번 승강장 근처에 비상콜폰이 있는가'를 확인하거나 역별 설치 현황을 점검할 때 쓴다. 전역 조인 키나 역 코드가 없어 다른 역·시설 데이터와는 노선명·역명 같은 이름을 맞춰 연결해야 한다.
description_portal: 부산교통공사 비상콜폰 데이터는 부산 1호선, 2호선, 3호선, 4호선 노선 내 관리되는 역들의 비상콜폰 위치 정보를 상세히 제공합니다. 이 데이터는 철도운영기관명, 노선명, 역명, 역층, 상세위치(상선/하선별 승강장번호 및 출입구 표시) 등의 항목을 포함하여 각 역 내 비상콜폰의 정확한 설치 위치를 파악할 수 있게 합니다. 비상콜폰은 긴급 상황 발생 시 승객이 즉시 도움을 요청할 수 있도록 설치된 필수 안전장비로, 신속한 대응과 사고 예방에 중요한 역할을 합니다. 이 정보는 비상콜폰의 관리 및 유지보수, 안전 점검뿐만 아니라 이용객의 안전 인식 제고와 비상 대응 체계 강화에 크게 기여합니다. 철도 안전관리와 이용자 보호를 위한 필수 자료로 활용됩니다.
