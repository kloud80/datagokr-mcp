description_portal: 본 데이터는 한국도로공사가 제공하는 고속도로 통행 차량에 대한 연간 및 월간 차종별 교통량 통계이다.  해당 통계는 노선별 또는 요금소별로 수집된 교통량을 바탕으로, 차량 종류에 따라 구분된 이용 실적을 정리한 것이다.  승용차, 화물차, 버스 등 차종에 따라 집계된 교통량 정보는 고속도로 이용 현황을 종합적으로 파악하는 데 활용된다.  본 데이터는 정책 수립, 교통 수요 예측, 인프라 투자 계획 수립 등 다양한 분야에서 참고자료로 쓰이며,  도로별 통행 패턴 분석 및 차종 간 구성비 변화 등 교통 흐름에 대한 정량적 분석이 가능하다.  제공 형식은 CSV이며, 연도별·월별·노선별로 구분되어 있어 사용자 맞춤형 분석이 가능하도록 구성되어 있다.
