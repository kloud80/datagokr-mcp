description_portal: '자동차의 속도, 위치, 방위각, 가속도 등 자동차 운행에 관련된 정보를 기록하는 운행기록장치(DTG: Digital Tacho graph)로부터 1초단위로 수집되는 데이터한국교통안전공단에서 수집관리하고 있는 초단위의 운행기록데이터 샘플입니다. (운행일자, 운수회사코드 등) 운행기록과 관련된 데이터는 대용량데이터로 샘플데이터만 업로드합니다.차량 속도: 차량의 순간적인 속도입니다.차량 위치: 차량의 정확한 지리적 좌표(위도 및 경도)입니다.방위각: 차량이 향하고 있는 방향으로, 일반적으로 북쪽을 기준으로 시계방향으로 측정된 각도입니다.가속도: 차량 속도 변화율로, 가속하거나 감속하는 정도를 나타냅니다.운행기록데이터는 교통행정기관, 공단 및 운송사업자에게 교통안전 관리업무에 한정하여 활용하는 전제하에 제공되고 있으며, 운행기록분석시스템의 데이터신청 메뉴에서 개방서비스를 통해 자료를 신청 및 제공받으실 수 있습니다.'
