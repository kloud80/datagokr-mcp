summary_user: 사업용 차량의 운행기록장치(DTG)에서 1초 단위로 수집한 운행기록을 건별 원천 형태로 담은 샘플 파일로, 속도·RPM·브레이크 신호·GPS 좌표·방위각·가속도·일일/누적 주행거리 등이 들어 있다. 교통안전 분석가나 운송사업자가 급가속·급감속이나 과속 같은 위험 운전 행태를 초 단위 궤적으로 어떻게 식별할지 분석 방법을 미리 설계하고 검증하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 바로 붙지 않으며, 좌표(시작GPS X·Y)로 도로·지역 공간 데이터와 겹치거나 운행지역코드를 같은 기관 코드 체계와 맞춰 이어 쓴다.
limits: 대용량 원본이 아닌 약 12KB 분량의 샘플만 공개되어 전국 단위 통계나 실제 운행 실태 분석에는 쓸 수 없고, 전체 자료는 운행기록분석시스템을 통해 교통안전 관리 목적에 한해 별도 신청해야 한다. 차량등록번호 등 전역 조인 키가 없어 차량·사업자 원장과 직접 연결되지 않는다.
