description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 안전·보건관리 데이터로, 도시철도 역사별 CCTV 설치 현황 정보를 제공합니다. 데이터에는 각 역사 내 CCTV 설치 수량, 설치 구역 등 시설 운영과 관련된 주요 항목이 포함되어 있으며, 역사 내 안전관리 체계 운영과 시설물 관리 현황을 파악하기 위한 기초자료로 활용할 수 있습니다. 해당 데이터는 역사별 CCTV 설치 현황 분석, 안전관리 계획 수립, 시설 운영 개선 및 관련 정책 검토 등에 활용할 수 있으며, 도시철도 이용객 보호와 안전한 이용환경 조성을 위한 관리 자료로 활용됩니다. 본 데이터는 도시철도 안전 인프라 현황을 객관적으로 확인할 수 있는 자료로서, 효율적인 시설 관리와 안전관리 수준 향상에 기여할 수 있습니다.'
