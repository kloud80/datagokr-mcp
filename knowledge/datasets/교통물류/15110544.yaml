summary_user: 대구광역시 서구에 있는 일반택시회사를 회사 한 곳당 한 건으로 담으며, 등록번호·회사명·도로명주소·전화번호를 제공한다. 서구 주민이나 사업자가 '서구에 어떤 법인택시 회사가 있고 연락처·주소는 어디인가'를 확인하거나, 분석가가 시군구 단위 택시운송사업자 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 회사명이나 도로명주소(ADRES)를 기준으로 매핑해 이어 써야 한다.
limits: 범위가 대구 서구 한 곳에 한정되어 다른 구·군이나 대구 전체 택시회사 현황은 이 데이터만으로 알 수 없다. 등록번호 등 공통 코드로 다른 데이터와 바로 결합되지 않으며, 개발계정은 하루 10,000회까지 호출할 수 있다.
