summary_user: 인천광역시 버스·지하철 등 대중교통의 이용 현황과 운행 실적을 노선 구간별·일자별 재차 승객수, 시간대별(0~23시) 평균 운행시간 같은 집계 통계로 담으며, 범위는 시도 단위이고 행정단위는 읍면동까지 내려간다. 교통 분석가나 정책 담당자가 '특정 버스 노선의 어느 구간이 몇 시에 가장 붐비고 운행시간이 길어지는가'를 확인해 노선 조정이나 증차를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선번호(routeName)나 구간명을 이름으로 맞춰 정류장·노선 원장이나 실시간 도착 데이터와 이어 쓰고, 필수 파라미터인 노선번호는 다른 데이터에서 먼저 받아 넘겨야 한다.
