summary_user: 경상북도 영천시에 소재한 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 원천 목록으로, 업체명·면허종류·차량대수·주소·현재 운영 여부를 담는다(csv 약 2.4KB의 소규모 파일). 영천시에서 화물을 맡길 운송사를 찾는 화주나 지역 운송업체의 분포와 차량 규모를 파악하려는 분석가가 "이 업체가 영천시에 등록된 일반화물 운송사업자이며 지금 운영 중인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소로 맞춰 이어 쓰며, 전국 기준인 전국화물자동차운송사업자표준데이터와 대조할 때도 업체명·주소 매칭이 필요하다.
description_portal: 해당 데이터는 경상북도 영천시에 소재한 일반화물 자동차 운송사업자 현황을 나타내는 공공데이터입니다. 영천시 내에서 운영 중인 다양한 운송업체들의 업체명, 면허 종류, 차량 대수, 주소, 현재 운영 여부 등의 정보를 포함하고 있으며, 지역 내 물류 및 운송업계의 실태 파악과 정책 수립에 활용될 수 있고 영천시 내 운송업체의 분포와 규모를 쉽게 파악할 수 있도록 지원합니다. 이를 통해 물류 효율성 증진을 위한 정책 수립에 기여할 것으로 기대됩니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 교통행정과로 연락주시기 바랍니다.
