summary_user: 충청남도 청양군이 관내 보호구역에서 관리하는 과속방지턱을 한 개씩 행으로 담은 파일(약 17KB CSV)로, 관리기관·도로구분·노선번호·위치·왕복 차로수·설치 길이·높이·재료를 기록한다. 주민이나 교통안전 분석가가 청양군 어느 도로·노선에 과속방지턱이 어떤 규격으로 설치돼 있는지 확인하거나, 어린이·노인보호구역 시설 정비 현황을 점검하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 노선번호나 위치 이름을 맞추거나 같은 기관(청양군) 기준으로만 연결하며, 어린이보호구역·무인단속카메라 표준데이터와 지역 단위로 나란히 놓고 보는 방식이 현실적이다.
description_portal: 충청남도 청양군의 과속방지턱 정보(관리 기관,도로 구분,노선 구분,위치,차로 수,설치 길이, 설치 높이, 재료 등)입니다. 관내 보호구역으로 지정되어 관리하고 있는 과속방지턱 정보이며, 보행약자를 위한 제도 정비 및 인프라 확충을 목표로 계획하고 있습니다.보호구역 현황으로는 어린이보호구역 16개소, 노인보호구역 91개소이며, 읍면에서 건의서를 제출하여 군청 건설정책과에서 접수 후 방지턱 설치를 진행하고 있습니다.도로유지관리를 위해 과속방지턱 조사를 통해 관리하고 있는 실정입니다. 고령보행자 보호를 위한 노인보호구역 지정 활성화하여 정비를 지속적으로 추진코자 합니다.어린이보호구역 내 안전한 통학로를 조성하기 위해 고원형 횡단보도, 방호울타리, 과속방지턱 등 도로시설물 정비를 수행하고 있습니다.
