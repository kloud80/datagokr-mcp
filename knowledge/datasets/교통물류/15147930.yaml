description_portal: '이 데이터는 부산항만공사의 월간 물동량 예측 자료로, 연도와 월별 기준으로 수출입 구분 코드와 함께 물동량을 기록한 통계 정보입니다. 이를 통해 특정 시점의 물류 흐름을 확인할 수 있으며, 장기적인 수출입 추세 분석, 항만 운영계획 수립, 물류정책 평가 등에 활용됩니다. 특히 연도별, 월별 데이터를 바탕으로 계절적 변동이나 경기 변화에 따른 물동량 변화를 파악할 수 있어 항만 시설 운영과 선박 입출항 계획 수립에 필요한 기초자료로 유용합니다. 공공데이터 분석에서는 수출입 규모 추정, 물동량 예측 모델링, 국가 물류 경쟁력 평가 등 다양한 연구와 행정 업무에 기여할 수 있습니다.* 물동량 단위 : TON* 수출입 구분 :    - II : 수입    - IT : 수입환적    - OO : 수출    - OT : 수출환적'
