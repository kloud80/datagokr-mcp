summary_user: 위험물질운송안전관리시스템이 관제하는 위험물 운송차량 경로상 주요 도로(고속도로·국도·지방도 등)에 설치된 전국 CCTV를 한 대씩 아이디·지점명·경도·위도·사용여부로 담은 건별 목록 파일이다(CSV 약 526KB). 분석가나 안전 담당자가 "위험물 차량이 다니는 이 구간에 관제용 CCTV가 어디에 몇 대 있고 실제 사용 중인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 교통·CCTV 데이터와는 좌표(경도·위도) 근접 매칭이나 지점명 매핑으로만 잇는다.
description_portal: 이 데이터는 위험물질운송안전관리시스템을 통해 실시간으로 관제 중인 위험물질 운송차량의 경로 상 주요 도로에 설치된 CCTV 목록 정보를 제공합니다. 고속도로, 국도, 지방도 등 전국의 주요 도로에 연계된 CCTV 위치 정보와 식별 정보를 포함하고 있으며, 이를 통해 위험물 차량의 이동 경로를 모니터링하고 사고 발생 시 신속한 대응이 가능하도록 지원합니다. 본 데이터를 국민에게 제공함으로써 위험물질 운송에 대한 투명성을 높이고, 안전한 도로 환경 조성과 사고 예방을 위한 공공의 감시 체계 강화에 기여하고자 합니다.
