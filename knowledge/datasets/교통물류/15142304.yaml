summary_user: 연안여객선의 운항 건별 상태(출항일자·출항시각·면허항로·운항항로·방향·기항지·운항상태와 변경시간)를 담은 API로, 전체 4,467건이며 범위는 전국이다. 도서 주민이나 여행객이 오늘 이 배가 정상 운항하는지, 결항·변경됐는지 확인하는 질문에 쓴다. 전역 조인 키는 없어서 여객선코드·항로코드·기항지코드 등 같은 기관 코드나 여객선명·항로명·기항지명 매핑으로 같은 공단의 항로·선사·터미널 데이터와 이어 쓴다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로공단의 운항관리 대상 연안여객선의 운항상태 정보를 포함하고 있습니다.여객선명, 여객선코드, 일자, 여객선출발시각, 면허항로명, 운항항로명, 운항상태 등이 포함된 정보 입니다.여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다.* (유의사항) 승선인원수, 하선인원수 정보는 참고용으로 제공되는 정보로 국가 통계 등 실제 데이터와 차이가 있을 수 있으니 사용에 유의하여 주시기 바랍니다."
