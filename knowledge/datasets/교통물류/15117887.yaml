description_portal: 서울특별시 용산구 옐로카펫 현황에 대한 데이터로 학교명, 설치장소, 도로명주소, 설치연월, 보수연월, 데이터기준일, 관리기관, 관리기관 전화번호에 대한 항목을 제공합니다 국제아동인권센터에서 고안한 시설로, 아이들이 횡단보도를 안전하게 이용할 수 있도록 돕는 역할을 합니다.  횡단보도 진입부의 노면과 벽면에 삼각형 모양의 노란색 존을 설치하여 어린이들이 안전한 영역에서 신호를 기다릴 수 있게 합니다. 어린이들이 안전한 영역에서 신호를 기다리게 하는 장치로서, 아이들뿐 아니라 운전자도 주위를 기울이며 어린이를 쉽게 인식할 수 있어 교통사고를 예방해주는 효과가 있습니다. 옐로카펫과 더불어 횡단보도에서 보행자의 안전을 도와주는 것으로 보행신호 음성안내 보조 장치도 있습니다. 횡단보도의 안전선을 한 발짝이라도 넘어설 경우 사람을 인식하여 “안전을 위해 한걸음 뒤로 물러서주기 바랍니다” 하는 신호음을 보냅니다. 무의식중이라도 신호음이 각인되어 교통사고를 예방할 수 있습니다. 보행 신호 등의 상태를 음성으로 안내해 시각장애인뿐만 아니라 교통약자의 보행에 도움을 줍니다.
