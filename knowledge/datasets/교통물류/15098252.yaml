description_portal: 서울 도시철도 환승정보 데이터는 서울 도시철도 각 환승역의 최단 환승 경로(승하차 출입문 위치) 정보를 제공하는 데이터입니다.환승 시작역, 환승 시작 호선, 환승 종료 호선, 하차 위치, 환승 승차 위치, 소요시간 등의 항목으로 제공하며,하차 위치 또는 환승 승차 위치는 호차, 문으로 값을 분리하여 제공합니다.(예시) 하차위치(호차)가 "10", 하차위치(문)가 "4" 인 환승 정보는 10-4에서 하차하는 것이 최단 환승경로임을 의미하며, 환승 승차 위치는 환승 통로를 따라 이동하였을 때 가장 가까운 출입문의 위치를 동일한 방법으로 표기합니다.환승 소요시간의 경우 개인 걸음걸이, 속도에 따라 차이가 있으므로 단순 참고용으로 활용하시기 바랍니다.
