summary_user: 서울 도시철도 환승역별로 환승 시작역·시작 호선·하차 열차 방면에서 환승 종료 호선·방면까지의 최단 환승 경로를 담은 파일로, 하차 위치와 환승 승차 위치를 호차와 문 번호로 나눠 소요시간과 함께 건별로 제공한다(CSV 약 81KB). 승객이나 길찾기 서비스 개발자가 '이 역에서 몇 호선으로 갈아탈 때 몇 번째 칸 몇 번 문에서 내려야 가장 빠른가'를 안내하는 데 쓴다. 전역 조인 키는 없고, 환승시작역 코드(역 코드)나 역명·호선명으로 같은 기관의 역 정보·시설 데이터와 매핑해 이어 쓴다.
limits: 표준화된 전역 조인 키가 없어 다른 기관 데이터와는 역명·호선명 매핑으로만 연결된다. 소요시간은 개인 걸음 속도에 따라 달라지는 참고값이며, 역 좌표나 실시간 운행 정보는 담지 않는다.
