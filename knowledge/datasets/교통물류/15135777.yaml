summary_user: 건축물대장에서 확인되는 주차정보를 전국 범위에서 지번(주소 코드·본번·부번) 단위로 담은 파일로, 건물별 주차면수와 옥내·옥외 기계식·자주식 주차대수, 인근 주차장 대수, 면제대수를 담는다. 특정 필지 건물의 부설주차장 규모가 얼마인지, 지역별로 기계식 주차 비중이 어떤지 살피려는 주민·사업자·교통 분석가가 쓴다. 실측 컬럼에 전역 조인 키는 없어 주소 코드(행정표준코드 준용)와 본번·부번을 조합해 건축물대장·지번 기반 데이터와 맞춰 쓰고, 주차장관리번호·좌표가 원장인 전국주차장정보표준데이터와는 직접 키로 연결되지 않는다.
description_portal: 해당 데이터는 한국교통안전공단에서 제공하는 정보입니다. 데이터를 제공하는 시스템은 주차정보시스템에서 제공하고 있으나, 본 정보는 각 건축정보 행정시스템에서 수집하여 각 지번별로 데이터를 제공하고 있습니다.건축물 대장에서 확인할 수 있는 주차정보를 제공합니다. 주소코드는 행정표준코드를 준용하며, 주차장과 관련된 정보만 제공합니다. 해당 데이터는 2022년 말 기준으로 작성된 데이터로 시스템간 연계상의 이슈 등으로 인하여 실제 건축물대장상의 생성 시기와 일치하지 않을 수 있습니다.
