summary_user: 서울교통공사 역별로 하루 단위, 시간대별(06시 이전~24시 이후) 65세 이상 노인 권종의 승차·하차 인원을 담은 건별 원천 파일이며, 검증 수신 기준 199,398행에 2024-01-01~2024-12-31 기간이다. 노인 이용객이 많은 역과 시간대가 언제인지, 어르신 대상 시설이나 서비스를 어느 역 주변에 둘지 같은 질문에 쓴다. 역번호·역명으로 같은 기관의 다른 역 데이터와 이어 쓰며, 전역 조인 키는 없어 이름·코드 매핑이 필요하다.
description_portal: 서울교통공사 역별 일별 시간대별 노인 승하차인원 정보입니다. 해당 데이터는 연번,수송일자,역번호,역명,승하차구분,시간대별 인원수로 구성되어 있으며, 데이터 개방이 가능한 2021년 7월부터 개방합니다. 노인 권종은 65세 이상 인원을 의미합니다. 일반적으로 경로라는 컬럼으로 구성되어 있습니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
