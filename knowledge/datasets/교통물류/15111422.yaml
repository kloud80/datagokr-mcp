summary_user: 광주교통공사 도시철도 역사 안에 설치된 CCTV·개찰구·고객안내센터 같은 안전·편의시설을 시설물 한 건씩, 역사·호선·층/구역 위치·종류·사진 링크와 함께 담은 CSV 파일(약 71KB)이다. 광주 지하철 이용자나 시설 관리자가 '이 역 몇 층에 고객안내센터나 개찰구가 어디 있는가'를 확인하거나, 역별 안전·편의시설 현황을 비교해 유지보수 계획을 세우는 데 쓴다. 전역 조인 키는 없고, 같은 기관의 다른 역 데이터와는 역사코드나 역사명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 광주교통공사 역사 내 설치된 시설물 정보입니다. 주요 항목은 시설물 설명, 역사코드, 역사명, 시설물 이름, 호선, 기준일자, 시설물 위치, 시설물 종류, 시설물 사진입니다. 각 기록은 특정 역사에 설치된 시설물의 종류와 위치, 설치 목적을 나타내며, CCTV·개찰구·고객안내센터 등 안전시설과 편의시설이 포함됩니다. ‘기준일자’는 해당 시설물 정보가 확인된 날짜를, ‘시설물 위치’는 역사 내 층이나 구역을 표시합니다. 또한 ‘시설물 사진’ 항목에는 실제 이미지 링크가 제공되어 현장 확인 없이도 시각적 정보를 확인할 수 있습니다. 이 자료는 역사별 시설물 현황 파악, 안전·편의시설 관리, 시설물 유지보수 계획 수립, 시각자료 기반 안내 시스템 구축 등 다양한 분야에서 활용 가치가 높습니다.
