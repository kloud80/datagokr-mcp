summary_user: 한국교통안전공단 대중교통 현황조사로 집계한 지역 간 일반철도(고속철도 포함) 이용인원을 시간대 구분별로 평일평균·토요일·일요일 값(단위 명)으로 담은 717바이트 분량의 작은 집계 CSV 파일로, 범위는 전국이다. 교통 정책 분석가나 연구자가 '지역 간 철도 이용은 평일과 주말에 어느 시간대에 몰리는가'를 확인하는 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시간대 구분(구분1) 이름을 맞추거나 같은 기관의 지역 간 버스·항공 등 수단별 시간대 이용인원 자료와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단에서 대중교통 현황조사를 통해 조사한 지역 간 대중교통 평일 시간대별 철도 이용인원 데이터입니다.해당 데이터의 수단은 일반철도(고속철도 포함)이며, 평일과 주말(토요일, 일요일)별로 시간대별에 따라 이용인원을 세분화하여 제공하였습니다.단위는 명입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
