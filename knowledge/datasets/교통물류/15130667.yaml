summary_user: 전국 철도역 출발역과 도착역 쌍마다 경로 유형(최소시간·최소환승 등), 출발·도착 철도운영기관·노선·역 코드, 정차역 개수를 담은 경로 단위 파일로, 포털 설명 기준 93,261건이다. 대중교통 안내 서비스 개발자나 교통 분석가가 "A역에서 B역까지 최소환승 경로로 가면 몇 개 역에 정차하는가"를 확인하거나 역간 이동 부담을 비교하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관 체계의 운영기관·노선·역 코드를 쓰는 철도역 마스터(역명·좌표) 데이터와 코드 매핑으로 이어 쓴다.
