summary_user: 부산 도시철도의 호선·역사별로 승강장, 대합실·기능실, 역무자동설비(개찰구·발매기 등), 편의설비(엘리베이터·에스컬레이터 등), 기타 공간에 설치된 CCTV 카메라 수량을 담은 역사 단위 집계 파일입니다(약 2.5KB csv). 특정 역의 감시 카메라가 어느 공간에 몇 대 있는지, 역별 감시 밀도가 낮은 곳은 어디인지 살피는 안전·시설 분석가나 시민 질문에 쓴다. 전역 조인 키나 역 코드는 없으므로, 다른 역별 데이터(승하차·혼잡, 역 시설 등)와는 호선명·역사명을 매칭해 이어 쓴다.
