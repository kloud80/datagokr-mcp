description_portal: 도시철도 내 범죄 예방 및 안전 관리 강화를 위해 부산교통공사는 전 역사 및 주요 시설에 CCTV를 지속적으로 확대 설치하고 있습니다.본 데이터는 2026. 4월 기준으로 도시철도 역사별 CCTV 설치 현황을 정리한 것으로, 각 호선의 역사별 설치 위치별 카메라 수량 정보를 포함합니다.데이터는 각 역사별로 승강장, 대합실/기능실, 역무자동설비(개찰구, 발매기 등), 편의설비(엘리베이터, 에스컬레이터 등), 기타 항목으로 구분된 공간의 CCTV 설치 수량을 제공합니다.이를 통해 역사 내 주요 위치별 감시 체계를 파악할 수 있으며, 방범·방재 시스템 구축과 시설 보완 등에 활용될 수 있습니다.또한, 이 데이터는 역사별 위험요소 분석, 감시 사각지대 탐지, 통합관제센터 연계 강화, 스마트역사 구축 전략 수립 등 다양한 공공 안전 및 도시철도 운영 개선에 활용할 수 있으며,범죄·사고 예방 정책, 민원 대응 체계 개선, 유지보수 예산 책정 등의 기초 자료로도 활용될 수 있습니다.
