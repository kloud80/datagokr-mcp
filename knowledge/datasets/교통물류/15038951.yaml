summary_user: 인천광역시 남동구에 있는 여객자동차운송업체를 업체 한 곳당 한 행으로 정리한 목록으로, 업체명·도로명 소재지·전화번호·데이터기준일자를 담는다(CSV 약 1.4KB의 소규모 파일). 남동구 주민이나 분석가가 '구 안에 어떤 여객운수업체가 어디에 있고 연락처는 무엇인가'를 확인하거나 업체 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명 매칭이나 도로명주소를 지오코딩해 행정구역·좌표 단위로만 이어 쓴다.
limits: 노선·정류장·운행 실적 같은 운영 정보는 없고 업체 명부 수준이라 서비스 실태 분석에는 별도 데이터가 필요하다. 사업자번호 등 공통 코드가 없어 다른 기관 데이터와 정확히 대조하기 어렵고, 범위는 남동구 한 곳뿐이다.
