summary_user: 경찰청이 제공하는 교통안전 위험요소 가운데 도로환경이 급경사(내리막)인 곳을 전국 범위로 한 건씩 담으며, 각 건에는 지번·도로명 주소, 위경도, 위험요소 분류 코드, 기준일자, 상세 내용이 들어 있다. 운전자나 지자체 교통 담당자가 "우리 동네 통학로나 배송 경로에 사고 위험이 있는 급한 내리막이 어디 있나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소 이름 매핑이나 같은 기관(행정안전부·경찰청) 코드로만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별:급경사(내리막) 데이터는 경찰청에서 제공하는 정보입니다.
