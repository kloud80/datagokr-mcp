summary_user: 성남시에서 교차로 우회전 때 운전자가 보행자·자전거·어린이 등 교통약자를 보기 어려운 사각지대를 지점 단위로 담은 데이터로, 횡단보도 관리번호·시도·시군구·읍면동·지번주소·세부위치·위경도·이미지명을 함께 제공한다. 보행자 안전 정책 담당자나 교통 분석가가 '성남시 어느 교차로 횡단보도에 우회전 사각지대가 몰려 있고, 반사경·우회전 신호 같은 개선이 먼저 필요한 곳은 어디인가'를 파악하는 데 쓴다. 전역 조인 키는 없으므로 위경도로 사고 지점·단속카메라·어린이보호구역 같은 위치 데이터와 공간적으로 겹쳐 보거나, 횡단보도 관리번호(crslkmanageno)·읍면동 이름으로 같은 기관 자료와 맞춰 쓴다.
description_portal: 경기도 성남시 우회전 사각지대 위치데이터를 제공합니다.본 데이터는 횡단보도 관리번호,  도로명, 세부위치,위경도, 이미지명 등으로 구성되어있습니다. 차량이 교차로에서 우회전할 때 보행자, 자전거, 어린이 등 교통약자를 인지하기 어려운 지점의 위치 및 특성을 기록한 자료입니다. 이 데이터는 주로 교차로 구조, 건물 벽면, 가로수, 불법주정차 차량 등으로 인해 운전자의 시야가 제한되는 구간을 중심으로 수집됩니다. 성남시는 이 데이터를 바탕으로 우회전 전용 신호등 설치, 우회전 알림 시스템 구축, 반사경·경고표지 설치, 시야 확보 공작물 정비 등 맞춤형 개선사업을 추진하고 있습니다. 또한, 해당 정보는 교통사고 예방, 스마트 교통 인프라 설계, 보행자 중심 교통정책 수립에 중요한 기초자료로 활용되고 있습니다.
