summary_user: 공단이 운항관리하는 연안여객선의 권역(인천·목포·여수·통영 등)별 코드와 설명을 담은 전국 단위 코드 목록이다. 연안여객선 항로·운항 정보를 다루는 개발자나 분석가가 "이 권역 코드가 어느 지역을 뜻하는가"를 확인하는 데 쓴다. 권역 코드(sarea_cd)로 같은 기관의 연안여객선 교통정보 데이터(항로·운항상태 등)와 이어 쓰며, 실측상 전역 조인 키는 없어 다른 기관 데이터와는 이름 매핑으로만 연결한다.
limits: 권역 코드와 설명만 담은 비공간 목록이라 권역 경계나 좌표, 항로·운항 여부는 이 데이터로 알 수 없다. 개발계정은 하루 100회로 호출이 제한된다.
