summary_user: 광진구 안에 설치된 자전거도로를 노선 하나당 한 행으로 담은 4.5KB 남짓의 작은 CSV 파일로, 노선명·자전거도로 종류·기점·종점·주요 경유지·방향·총연장·도로폭·설치연도·도로 재질을 기록한다. 광진구 주민이나 자전거 정책 담당자가 "광진구에서 전용도로로 된 자전거길은 어디서 어디까지이고 폭과 재질은 어떤가"를 확인하거나, 구 단위 자전거 인프라 현황을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어서, 다른 자치구 자전거도로 파일이나 공공자전거 대여소 데이터와는 노선명·기점·종점 같은 지명을 기준으로 맞춰서 이어 써야 한다.
limits: 좌표나 표준 코드가 없어 GIS 노선 지도에 바로 올릴 수 없고, 다른 데이터와는 지명을 이름으로 매칭해야 한다. 범위는 광진구 한 곳뿐이므로 서울 전체나 전국 현황을 보려면 다른 기관 파일을 따로 모아야 한다.
