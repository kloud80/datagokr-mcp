description_portal: '장애인 전용 주차구역 위반 시 과태료는 위반 유형에 따라 10만 원에서 최대 200만 원까지 부과됩니다.주요 위반 유형 및 과태료로는 불법주차(주차가능 표지 미부착, 보행상 장애인 미탑승 등) : 10만 원 , 주차 방해(물건 적치, 이중주차, 진입로 막힘 등) : 50만 원 , 표지 위·변조 및 부당사용(타인 양도, 위조 등) : 200만 원, 도로·여객시설 점자블록 방해 : 50만 원 등이 있습니다서울특별시 강북구_장애인전용주차구역 과태료 부과 현황 데이터는 연번, 시군구, 과세년도, 과세월, 담당기관, 담당부서, 세목명, 건수, 금액으로 구성되어 있습니다.2022년 강북구 내의 장애인 주차구역에서 과태료 부과 현황(금액, 건수)을 월별로 집계하여 제공한 데이터로 총 1735건의 과태료가 부가되었습니다.'
