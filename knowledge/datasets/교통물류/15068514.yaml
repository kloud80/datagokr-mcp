description_portal: 이 데이터는 한국철도공사에서 제공하는 ‘연도별 석탄 수송실적(톤-키로)’ 자료로, 발전용 무연탄과 민수용 무연탄 등 각종 석탄이 한 해 동안 철도를 통해 수송된 규모를 “톤-키로(ton-km)” 단위로 연도별 집계한 통계입니다. 여기서 ‘톤-키로’란 실질적으로 수송된 석탄의 무게(톤)에 실제 이동거리(킬로미터)를 곱해 산출한 값으로, 단순한 화물량뿐 아니라 수송 거리까지 반영한 핵심적인 물류성과 지표입니다. 데이터는 약 23년치(1회성 스냅샷)로 제공되며, CSV, XML, JSON 등 다양한 오픈 포맷으로 누구나 자유롭게 다운로드해 활용할 수 있습니다.해당 데이터로 확인할 수 있는 또는 유추 가능한 인사이트는 다음과 같습니다. 첫째, 연도별 석탄의 철도 수송 규모 변화와 추이를 통해 국내 에너지 수요, 발전소 및 산업체의 석탄 이용 동향, 석탄 화물의 철도 시장 내 위상 변화 등 주요 산업·정책적 현안을 객관적으로 파악할 수 있습니다. 둘째, 특정 연도 석탄 수송실적의 급등·급락 시기에는 대형 발전소 신설, 에너지 정책 변화, 석탄 수입 구조 변화 등의 영향 분석과 연계가 가능합니다. 셋째, ‘톤-키로’ 수치는 실제 운송거리까지 고려해 수송 효율성, 주요 노선별·거점별 물동량 집중 현상, 대체 운송수단(도로·해운 등) 대비 철도의 정량적 효과 등 폭넓은 경향 분석에 활용됩니다.이 자료는 에너지·자원·물류·환경 등 다양한 분야의 참고자료로서 가치가 높습니다. 구체적으로는 정부 및 지자체의 에너지·석탄 정책 및 물류 인프라 투자 타당성 평가, 대규모 발전소 및 산업단지 입지 선정, 민간물류기업의 시장 점유율 분석, 철도물류 신사업 전략, 환경영향평가와 에너지 공급망 연구, 학술논문 및 시장통계 보고서 등 정책·산업·연구 전반에 걸쳐 폭넓게 활용할 수 있는 데이터입니다.
