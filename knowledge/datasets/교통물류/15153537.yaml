summary_user: 한국철도공사 화물 터미널·거점역의 작업선(입출고·조성·적하·하역용)이 어떤 개별 선로번호로 구성되는지를 역별로 한 행씩 담은 전국 단위 기준 정보 파일(CSV, 약 50KB)이며, 폐선 여부와 폐선일자도 함께 담는다. 화물 물류 분석가나 철도 시설 담당자가 '특정 역의 화물 작업선은 몇 개 선로로 이뤄져 있고 그중 폐선된 것은 언제 닫혔나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 철도 역·시설·화물 데이터와는 역명(작업선명) 문자열 매핑으로만 연결한다.
limits: 표준 역 코드 같은 공통 조인 키가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다. 선로의 물리적 구성과 폐선 이력만 담으며 위치 좌표가 없는 비공간 데이터다.
