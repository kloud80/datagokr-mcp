summary_user: 성남시 교차로 등에 설치된 우회전 사각지대 안전시설물을 시설물 한 건씩 담은 원천 목록으로, 법정동·관리번호·시설물명·세부위치·위도·경도·이미지명을 함께 기록한다. 보행자 안전 분석가나 시 교통 담당자가 "우회전 사고 위험 교차로 중 아직 시설물이 없는 곳은 어디인가"를 따져 볼 때 쓴다. 전역 조인 키는 없으므로 법정동명 같은 이름 매칭이나 위도·경도 좌표로 사고 다발 지점·어린이보호구역 등 다른 공간 데이터와 겹쳐 본다.
description_portal: 경기도 성남시 우회전 사각지대 시설물 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다.경기도 성남시의 우회전 사각지대 시설물 데이터는 교차로에서 차량이 우회전할 때 발생하는 시야 사각지대로 인한 보행자 사고를 예방하기 위해 설치된 안전시설물의 위치와 특성을 기록한 공간정보 자료입니다. 성남시는 사고 다발 교차로, 스쿨존, 이면도로 등에 이러한 시설을 우선 설치하여 차량 운전자의 주의를 유도하고, 보행자의 안전한 횡단을 지원하고 있습니다.  시각화 분석을 통해 우회전 사각지대 해소 대상지를 도출하거나 시설물 유지보수 관리, 교통안전계획 수립에 활용됩니다. 이는 보행자 중심의 안전도시 구현을 위한 핵심 자료로서 중요성이 높습니다.
