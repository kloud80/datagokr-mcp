summary_user: 정읍시 안에서 도로 열선이 설치된 도로·터널을 한 곳당 한 행으로 담은 목록으로, 명칭·지번주소·차선 수·열선 길이(미터)·설치연도를 담는다(2024년 1월 기준, 1.3KB 정도의 작은 CSV 파일). 시민이나 도로·안전 분석가가 겨울철 결빙 걱정 없이 다닐 수 있는 열선 구간이 정읍시 어디에 있고 언제 설치됐는지 확인하는 데 쓴다. 전역 조인 키가 없어서, 다른 데이터와는 지번주소(열선설치주소)를 지오코딩하거나 도로·터널 이름을 맞춰 연결한다.
description_portal: '전북특별자치도 정읍시_도로 열선설치 목록2024.1월 기준 정읍시 도로 열선설치 목록중(명칭, 열선설치주소, 차선, 열선설치미터, 설치연도)등의 정보를 제공합니다.[데이터 안내]- 명칭 : 열선이 설치된 도로 또는 터널명- 열선설치주소 : 열선이 설치된 주소(지번주소)- 차선 : 차선 수- 열선설치미터 : 열선 길이(단위 : 미터,  최소 280, 최대 1200)- 설치연도 : 열선이 설치된 연도- 데이터기준일자 : 2024-01-31기타 궁금한 사항은 도로 열선설치 및 관리 담당부서인 정읍시청 건설과로 문의하시기 바랍니다.'
