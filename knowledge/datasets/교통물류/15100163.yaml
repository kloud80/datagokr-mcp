description_portal: 한국도로교통공단이 제공한 자동차 운전면허 학과시험 대비 데이터로, 1종·2종 보통 응시자의 이해를 돕는 문제은행이다. CSV 형식이며 각 행은 ‘문제’, ‘보기1~5’, ‘정답’으로 구성되어 모의풀이와 유형 분석에 곧바로 활용된다. 총 1,000문항이 수록되어 교통법규, 안전운전, 도로표지·신호 판독 등 핵심 영역을 다루며, 교육기관·지자체·민간 서비스의 교재 제작과 CBT 콘텐츠 구축에 적합하다. 본 자료는 2022년 7월 10일까지 유효한 문제를 기준으로 제공되므로 이후 제도 변경이나 법령 개정으로 실제 시험과 차이가 생길 수 있다. 원문 문항·표현의 임의 수정은 지양하고 출처 표기 등 이용 조건을 준수하여야 한다. 이미지·동영상 등 멀티미디어는 포함되지 않는다.
