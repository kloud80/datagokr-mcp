summary_user: 도로교통공단이 만든 1종·2종 보통 운전면허 학과시험 대비 문제은행으로, 한 행에 문제 한 개와 보기 다섯 개, 정답이 들어 있다. 교육기관이나 앱 개발자가 "교통법규·안전운전·표지 판독 문항으로 모의시험(CBT)이나 교재를 어떻게 만들까"를 풀 때 쓰고, 활용신청 없이 CSV로 바로 받는다. 실측 컬럼에 전역 조인 키나 코드표가 없어서 다른 데이터와 키로 이어 쓰기는 어렵고, 단독으로 쓰거나 문항 내용을 기준으로 직접 분류해 연결한다.
