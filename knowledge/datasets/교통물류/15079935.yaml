summary_user: 국내에서 발생해 국가에 의무보고된 철도사고와 운행장애를 한 건씩 담은 전국 단위 마이크로데이터로, 건마다 발생일시, 철도구분, 사고·장애 종류, 주원인과 근본원인, 지연 열차 수와 최대 지연시간, 사상자와 피해액, 노선·발생역·건널목 정보를 기록한다. 철도 안전 분석가나 연구자가 "어떤 노선·장소유형에서 어떤 원인의 사고와 운행장애가 자주 일어나고 지연·인명피해가 얼마나 컸는가"를 따지는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 노선명·역명(발생장소역)이나 행정구역 이름을 맞춰 연결해야 한다.
