summary_user: 서울교통공사 1~8호선 관할 역의 자전거 보관소를 역·출입구 단위로 담은 파일로, 호선·역번호·역명과 출입구 번호, 보관소 개소 수와 거치 대수, 관할 지자체를 행마다 기록한다. 지하철과 자전거를 함께 이용하려는 시민이나 역세권 이동수단 연계를 분석하는 사람이 '이 역 몇 번 출입구에 자전거 보관소가 있고 몇 대를 세울 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 역 데이터와는 역명·역번호를 이름·코드로 매핑하거나 같은 기관의 역 코드로 연결해야 한다.
description_portal: 해당 정보는 서울교통공사 1~8호선 관할 역에 위치하고 있는 자전거 보관소 위치에 대한 정보를 포함하고 있습니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 관할 구간이며, 4호선은 남태령 이후부터는 한국철도공사 관할입니다. 또한, 8호선의 경우에는 암사역사공원역 이후에는 남양주와 구리 도시공사가 각각 관할하고 있습니다. 자전거 보관소의 경우에는 각 지자체에서 관할하고 있으며 서울교통공사에서는 정보를 수합하여 데이터를 제공해 드림을 알려드립니다. 세부 보관소의 위치 혹은 건의사항의 경우에는 지자체에 문의해주시기 바랍니다.
