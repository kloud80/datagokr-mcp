title: 국토교통부_사고누적지점 조회 서비스
sector: 교통물류/도로/traffic-accidents
agency:
  id: '1613000'
  name: 국토교통부
kind: API
channel: portal
portal_url: https://www.data.go.kr/data/15124951/openapi.do
synonyms:
  - 교통사고
  - 결과보고서
  - 원인조사
  - 지자체별
  - 연도별
  - 교통사고 다발지역
  - 사고 잦은 곳
  - 교통사고원인조사
  - 위험 교차로
  - 사고다발지점
  - 교통사고 상세현황
  - TAAS
summary_user: 교통사고원인조사 대상으로 선정된 사고누적지점(과거 3년간 교차로 후방 150m 이내 사망사고 3건 이상 또는 중상이상사고 10건 이상)의 지점 목록과 지점별 개별 사고 상세(사고 일시·유형·등급·가해운전자 특성·기상 등)를 전국 범위로 담는다. 지자체 교통안전 담당자나 분석가가 "우리 시군구에서 원인조사 대상이 된 사고누적지점은 어디이고, 그곳 사고는 주로 어떤 형태·시간대에 나는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시도·시군구명(약칭 표기)과 지점명으로 다른 사고 통계와 이름 매칭하거나, 좌표(EPSG:5181)로 도로교통공단 다발지역 공간 자료와 공간 결합한다.
description_portal: '교통사고원인조사 대상 사고누적지점에 대해 기준년도, 광역지자체명, 기초지자체명, 지점명(상세정보) 조회조건으로 교통사고원인조사 대상 사고누적지점 정보 및 지점별 교통사고 상세 현황 정보 조회할 수 있습니다. 교통사고원인조사 대상 지점을 선정합니다. 선정기준 : 과거 3년간(기준년도 포함)교차로 후방 150m 이내, 사망사고 3건 이상이거나, 중상이상사고 10건 이상 발생한 지자체 내의 모든 지점 주요제공정보 : 교통사고원인조사 대상 사고누적지점 정보(광역지자체명,지점명,발생건수 등)등'
team:
  dept: 교통안전정책과
services:
  - op: /T_OD_ACDNT_CMPNT_BRN_INFO
    name: 사고누적지점_지점정보
    endpoint: https://apis.data.go.kr/1613000/ACDNT_CMPNT/T_OD_ACDNT_CMPNT_BRN_INFO
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지 번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: resultType
        required: true
        desc: 결과형식 ( xml/json ) - 소문자로 입력
      - name: crtr_yr
        required: true
        desc: 교통사고원인조사 기준년도-기준년도 포함 과거 3년간의 교통사고 데이터를 포함
      - name: mtrpl_lcgv_nm
        required: true
        desc: 교통사고 발생 구간 법정동 시도에 해당하는 주소 예)서울, 세종, 경북, 전북, 제주서울특별시(X), 제주도(X), 세종특별자치시(X)
      - name: basic_lcgv_nm
        required: false
        desc: 교통사고 발생 구간 법정동 시군구명에 해당하는 주소 예) 서울특별시중구(X), 중구(0)단, 세종특별자치시와 같이 하위 시군구가 없는 광역지자체명과 동일하게 세종으로  표시
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
