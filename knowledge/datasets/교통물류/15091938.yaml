summary_user: 경상남도 도로대장전산화 시스템에 등록된 도로별 구조물(교량·터널 등) 정보를 구조물 한 건씩 담은 파일로, 관리기관·도로종류·노선번호·구간번호·구간 내 시점 이정·구조물명을 담는다. 도로 관리 담당자나 분석가가 '경남의 특정 노선·구간에 어떤 구조물이 어느 이정에 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선번호·구간번호나 관리기관 이름을 맞춰 같은 기관의 다른 도로대장 데이터와 잇는 방식으로만 연결하며, 표준노드링크(link_id·node_id)와는 직접 이어지지 않는다.
