summary_user: 인천지하철 2호선 평일 상선(운연역→검단오류역) 열차마다 시발역·종착역·운행순번과 27개 역의 출발시각을 한 행으로 담은 운행시각표 파일(CSV, 약 60KB)이다. 출퇴근 승객이나 교통 분석가가 '평일 특정 역에서 검단오류 방향 첫차·막차와 배차 간격이 어떻게 되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 역 이름(열 이름)을 기준으로 다른 역 정보나 같은 기관의 하선·주말 시각표와 이름 매칭으로 이어 쓴다.
description_portal: 인천지하철 2호선 평일 상선(운연역에서 검단오류역 방향) 열차운행시각표 정보로 시발역, 종착역, 열차운행순번, 경유역(운연역 ~ 검단오류역) 출발시각 항목으로 구성되어 있습니다.2호선은 검단오류역에서 운연역까지 총 27개역을 운영하고 있습니다.대부분의 데이터의 시발역은 운연역이고 검암역, 서부여성회관역, 주안역, 인천시청역이 시발역인 데이터가 각각 1건씩 존재합니다.모든 데이터의 종착역은 검단오류역입니다. 평일 상선의 열차운행은 역별로 상이하나 전체적인 열차운행은 05시 30분에서 시작하여 익일 01시 06분에 종료됩니다.
