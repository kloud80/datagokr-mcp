summary_user: 춘천시 버스 정류장에 설치된 버스정보안내단말기(BIT)를 정류장 단위로 한 줄씩 담은 현황 파일(CSV 약 34KB)로, 정류장명·좌표·정류장 번호·단말기 종류·설치연월·음성 안내와 외국어 지원 여부를 담는다. 춘천시 어느 정류장에 음성·외국어 안내가 되는 BIT가 있는지 확인하거나, 교통약자 접근성을 위한 BIT 미설치 정류장을 찾는 데 쓴다. 전역 조인 키는 없어 정류장 번호·정류장명으로 TAGO나 지자체 BIS의 정류장·도착정보 데이터에 맞추거나 위도·경도로 위치를 겹쳐 연결한다.
description_portal: 강원특별자치도 춘천시 버스정보안내단말기(BIT) 현황 데이터는 시민들의 대중교통 이용 편의를 높이기 위해 제공되는 자료입니다. 이 데이터에는 BIT가 설치된 버스 정류장의 이름, 위도, 경도, 정류장 번호, 단말기 종류, 설치 연월, 음성 안내 사용 여부, 정보 표출 시간, 외국어 지원 여부, 데이터 기준일자 등이 포함됩니다. 이 자료는 교통약자와 외국인 이용자의 정보 접근성을 높이는 데 활용되며, 버스정류장의 위치 기반 교통정보 시스템 개선 및 단말기 유지관리에도 기여합니다. 또한 행정기관은 이를 바탕으로 설치 현황을 점검하고 서비스 품질을 향상시킬 수 있습니다. 데이터는 갱신되어 최신 정보를 반영하며, 시민들이 보다 정확한 버스 도착 정보와 편의 기능을 이용할 수 있도록 지원합니다.
