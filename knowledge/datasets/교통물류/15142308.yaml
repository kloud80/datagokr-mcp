summary_user: 한국해양교통안전공단이 운항관리하는 연안여객선의 운항 실적을 운항일자·권역 단위로 집계한 통계로, 계획 대비 실제 운항 선박수·운항건수, 운송인원수, 기상특보로 인한 운항취소 건수를 담는다. 도서 주민·여행객의 결항 수요를 분석하는 분석가나 정책 담당자가 '특정 권역에서 기상특보 때문에 계획 대비 몇 회가 결항됐고 이용객은 얼마나 됐나' 같은 질문에 쓴다. 전역 조인 키는 없어 권역코드(sarea_cd)를 같은 기관의 연안여객선 교통정보(운항상태·항로 등) 데이터와 코드·이름 매핑으로 맞추고, 운항일자로 기상 자료와 날짜 기준으로 붙여 쓴다.
limits: 권역 단위 일별 집계라 개별 항로·선박·운항편 단위의 결항 여부나 실시간 운항상태는 알 수 없다. 포털 안내상 참고용 통계로 국가 통계와 차이가 있을 수 있고, 개발계정은 하루 100회 호출 제한이 있다.
