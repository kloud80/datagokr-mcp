summary_user: "전국 노인보호구역을 구역 한 곳당 한 행으로 담고, 대상 시설명, 소재지 도로명·지번 주소, 위경도, 지정일, 제한속도, CCTV 설치 여부·대수, 관할 경찰서, 관리기관을 함께 제공한다. 지자체·분석가가 '우리 시군구 노인보호구역 중 CCTV가 없거나 제한속도가 높은 곳은 어디인가'를 확인하거나, 운전자가 경로상의 보호구역을 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 시군구 코드·시군구명이나 주소·좌표 매칭으로 이어 쓴다(예: 어린이보호구역, 무인교통단속카메라 데이터)."
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(노인보호구역)는 경찰청에서 제공하는 데이터입니다.
