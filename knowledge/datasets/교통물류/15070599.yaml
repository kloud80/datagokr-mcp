summary_user: SRT 전체 이용객 가운데 장애인 이용객 수를 연도별 한 행, 1~12월 열로 정리한 전국 단위 월별 집계 파일로, 단위는 천 명이며 건별 원천 기록이 아니다. 교통약자 정책 분석가나 철도 접근성 연구자가 SRT 장애인 이용객이 연도·계절에 따라 어떻게 늘고 줄었는지 확인하는 데 쓴다. 공통 조인 키는 없어 연도·월을 기준으로 SRT 전체 이용객 수나 다른 철도 이용 통계와 맞춰 비율을 계산하는 식으로 이어 쓴다.
description_portal: 1. 고속철도 SRT 전체 이용객 중에서 장애인을 대상으로한 이용객 수를 별도로 구분하여 해당 대상자에 대한 이용객 수를 연간 월별로 구분하여 설명하는 자료이며, 단위는 천명입니다.2. 연도별 월별 장애인 이용객수를 확인하실 수 있습니다.3. 데이터 내 0으로 적힌 수치는 "데이터 없음"을 안내드립니다.4. 2016년 12월 장애인 이용객 수는 24천명입니다 (단위:천명)* 해당 데이터는 연도별 주기성 데이터입니다.* 2025년 6월 말 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.
