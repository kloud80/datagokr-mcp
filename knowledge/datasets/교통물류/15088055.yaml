summary_user: 자동차 사용 구분(사업용·비사업용)과 차종별로 배출가스 정밀검사 대상이 되는 차령 기준(표준차령)과 적용 기간·사용 여부를 정리한 기준표 샘플로, 전국 단위·비공간 자료이며 722바이트짜리 CSV 한 건입니다. 차량 소유자나 정비·검사 사업자가 '내 차종과 사용 구분이면 몇 년차부터 정밀검사 대상인가'를 확인하거나, 분석가가 정밀검사 제도 기준을 참고할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자동차 검사·등록 자료와는 사용 구분·차종 이름을 맞춰 매핑하거나 같은 기관(한국교통안전공단) 자료 안에서만 연결한다.
description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 관리하는 자동차검사 자료 중 하나로, 자동차의 사용 구분(사업용/비사업용), 차종(승용, 승합, 화물, 특수), 그리고 자동차 차령(사용 기간)에 따라 배출가스 정밀검사 대상 차량을 선정하는 기준 정보를 담은 데이터 샘플입니다. 이 자료는 각 조건에 따른 검사 대상 차량 분류 기준과 적용 여부를 체계적으로 정리한 것으로, 환경 관련 규제 적용, 정밀검사 제도 운영, 대기오염 저감 정책 수립 등에 필요한 참고자료로 활용될 수 있습니다.
