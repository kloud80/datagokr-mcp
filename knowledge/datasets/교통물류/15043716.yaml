summary_user: 전국 고속도로 휴게소별로 소속 본부, 노선, 휴게소명과 함께 주차면 수(합계·대형·소형·장애인 전용)를 담은 현황 파일이다. 화물차 운전자나 물류·교통 분석가가 특정 노선의 어느 휴게소에 대형차 주차면이 많은지, 휴게소별 장애인 주차구역 비율이 어떤지 비교할 때 쓴다. 전역 조인 키가 없어 휴게소명·노선명을 이름으로 맞춰 다른 휴게소 데이터나 전국주차장정보표준데이터와 연결해야 한다.
description_portal: 한국도로공사에서 제공하는 본 데이터는 전국 고속도로 휴게소에 설치된 주차장 현황 정보를 담고 있다. 주요 항목은 소속 본부, 해당 노선명, 휴게소명, 총 주차 가능 대수(합계), 대형 차량 전용 공간, 소형 차량 공간, 장애인 전용 주차 공간으로 구성되어 있다. 이 데이터는 고속도로 이용자의 주차 수요와 편의성 향상을 위한 기초자료로 활용되며, 휴게소별 주차시설 규모를 정량적으로 파악할 수 있도록 지원한다. 또한 대형·소형·장애인 주차구역의 구성 비율을 확인할 수 있어, 고속도로 인프라 개선, 휴게소 혼잡도 분석, 장애인 편의시설 확보 등의 정책 수립에 참고자료로 활용된다.
