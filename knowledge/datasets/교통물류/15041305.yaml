summary_user: 수도권 6호선 역마다 철도운영기관명·선명·역명과 십진수 도(DD) 형식의 경도·위도를 한 행씩 담은 역 단위 위치 파일(CSV, 약 2KB)이다. 분석가가 "6호선 각 역 반경 몇 m 안에 이 시설이 들어가는가" 같은 역세권 판정이나 노선 지도 표시에 쓴다. 전역 조인 키가 없어 다른 역 단위 데이터(승하차·시설 등)와는 역명·선명 문자열 매칭이나 같은 기관 코드 매핑으로 잇고, 좌표로 주소·시설 데이터와 공간 결합한다.
description_portal: 수도권6호선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 경도, 위도에 대한 데이터가 있습니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
