summary_user: 경기도 양평군에 설치된 방호울타리를 시설 한 건씩 담은 원천 현황 파일로, 읍면동 단위 위치(행정읍면동코드)와 관리기관, 방지책 종류, 재질, 연장·높이(미터)를 기록한다. 도로 안전 분석가나 군 담당자가 양평군 어느 읍면동·도로구간에 어떤 재질의 방호울타리가 얼마나 길게 설치됐는지 파악하는 데 쓴다. 전역 조인 키는 없어서 행정읍면동코드·도로구간번호·관리기관코드를 같은 기관의 다른 도로시설 데이터와 이름·코드로 맞춰 이어 쓴다.
