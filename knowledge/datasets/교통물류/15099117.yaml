description_portal: 방호울타리(防護欄柵, Guardrail)는 차량이나 보행자의 이탈·충돌로 인한 피해를 줄이기 위해 도로·교량·시설 가장자리에 설치하는 안전시설입니다.방호울타리는 단순한 “막는 시설”이 아니라, 사고 시 피해를 최소화하도록 설계된 안전장치입니다.주요 목적1. 차량이탈방지(도로 밖으로 떨어지는것을 막음)2. 충돌 에너지 흡수(차량의 충격을 완화)3. 진행 방향 유도(차량을 도로 안쪽으로 다시 돌려보냄)4. 보행자 보호(차량과 보행자 공간 분리)5. 위험 구간 보호(교량, 절토부, 낭떠러지 등)방호울타리는 그래서 위험도가 높은 곳에 설치됩니다.방호울타리의 설치 기준과 고려사항1. 도로 설계 속도2. 교통량 및 대형차 비율3. 지형(곡선, 경사)4. 위험물 존재 여부(하천, 절벽)5. 유지관리 가능성방호울타리는 사고 후 반드시 점검 및 복구가 필요한 시설입니다. 제기능을 못하면 2차 사고를 유발할 수 있기 때문입니다.방호울타리는 차량과 사람의 생명을 보호하기 위해 충격을 "막는 것"이 아니라 "흡수하고 유도하는" 도로 안전시설입니다.경기도 양평군에 설치된 방호울타리 현황에 대한 데이터 입니다. (관리기관, 방지책종류, 방호울타리재질, 연장 등)
