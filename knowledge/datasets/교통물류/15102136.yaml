summary_user: 한국도로공사가 전국 고속도로 터널 안에 설치해 운영하는 도로관리용 CCTV를 대당 한 행으로 담은 현황 파일이며, 본부·지사, 노선번호·노선명, 터널명, 이정, 방향, 위치를 기록한다. 도로 안전 분석가나 관제·유지관리 담당자가 '어느 노선의 어느 터널에 CCTV가 몇 대, 어느 방향·이정에 설치돼 있는가'를 확인해 감시 공백 구간을 찾는 데 쓴다. 전역 조인 키는 없어서 노선번호·노선명·터널명·이정 같은 이름과 위치 값을 맞춰 한국도로공사의 다른 터널·시설물 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국도로공사가 고속도로 터널 내 설치한 도로관리용 폐쇄회로텔레비전(CCTV)의 운영 현황을 수록한 자료이다.  터널은 사고 발생 시 대형 피해로 이어질 수 있어 실시간 관제와 상황 대응을 위한 CCTV 운영이 필수적이다.  데이터는 설치 위치, 터널명, 노선명, 방향, 관리기관, 설치 연도, 장비 유형, 설치 목적 등으로 구성되며, 전국 고속도로 터널 구간의 CCTV 운영 현황을 정리하고 있다.  해당 정보는 화재, 차량 고장 등 비상상황 감시, 교통 흐름 모니터링, 유지관리 계획 수립, 재난 대응 등 다양한 분야에서 활용 가능하다.  CSV 형식으로 제공되며, 터널별·노선별 조회가 가능하여 안전 취약구간 분석 및 시설 운영 최적화에 활용될 수 있다.
