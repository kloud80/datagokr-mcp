description_portal: 국토 관리 사무소 별로 소모품 및 부속품 재고 정보에 대한 자료를 부속품 재고 정보, 소모품 재고 정보, 소모품 출급 정보, 수입 보고 이력, 청구 및 집행 요구 이력, 출납 물품 정보, 출납 이력 정보의 7개 자료로 구분하여 제공합니다.부속품 재고 정보와 소모품 재고 정보는 사무소 명, 연도, 월 별로 품목코드A, 품목코드B, 수입 수량, 수입 금액, 출급 수량, 품목 명의 재고 정보를 제공합니다.소모품 출급 정보는 소모품에 대한 사무소 명, 승인 일자, 품목 명, 수량, 장비번호A, 장비번호B, 등록일의 출급 정보를 제공합니다.수입 보고 이력은 수입 보고에 대한 사무소명, 보고일자, 회계구분, 예산구분, 수량, 단가, 금액의 이력 정보를 제공합니다.청구 및 집행 요구 이력은 청구 및 집행요구에 대한 사무소명, 품목명, 수량, 단가, 등록일의 이력 정보를 제공합니다.출납 물품 정보는 출납 물품에 대한 사무소명, 증빙서번호, 승인일자, 회계구분, 수량, 단가, 금액, 고유번호A, 고유번호B, 반납상태구분, 반납수량, 반납사유, 반납조치 정보를 제공하고, 출납 이력 정보는 출납 물품 정보에 장비명을 추가하여 정보를 제공합니다.
