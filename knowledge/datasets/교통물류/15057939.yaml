summary_user: 자동차 등록 연·월과 관리사업 유형(자동차매매업, 정비업, 해체재활용업, 번호판발급대행 등)을 넣어 기간별 관리사업자 등록 통계건수(dtaCo)를 조회하는 집계형 API이며, 검증 호출에서는 전국 범위 1행이 수신됐다. 자동차 관리사업자가 최근 몇 달간 유형별로 얼마나 등록됐는지 알고 싶은 분석가나 사업자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관(교통안전공단) 코드로만 이어 쓴다.
limits: 사업자별 개별 건이나 사업자번호 단위 정보는 담지 않고 통계건수만 돌려주며, 지역별 구분 없이 전국 단위로만 확인됐다. 포털 설명상 매월 1일부터 말일까지의 데이터는 익월 2일부터 조회할 수 있다.
