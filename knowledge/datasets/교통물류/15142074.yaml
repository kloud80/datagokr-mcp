summary_user: 전국 읍면동·정류장 단위로 운행연월, 시간대, 환승유형별 환승시간과 통행건수·통행인원수를 담은 환승접근성 데이터로, API 전체 11,555건이다. 대중교통 이용자·정책 담당자·분석가가 특정 지역 정류장의 환승이 얼마나 걸리고 얼마나 이뤄지는지 살필 때 쓴다. 시군구코드(sgg_cd)로 다른 데이터의 시군구 코드와, 정류장ID(sttn_id)로 정류장 데이터와 이어 쓴다.
description_portal: 환승접근성 일간 데이터는 특정 교통수단 간 환승 시 소요 시간, 환승 횟수, 환승 유형 등을 일 단위로 기록한 자료입니다. 이 데이터는 대중교통 시스템 내 환승 구간의 효율성과 편의성을 정밀하게 분석하는 데 활용되며, 환승 경로 최적화, 환승 시간 단축, 환승 시설 개선 등의 정책 수립에 중요한 기초 자료가 됩니다. 또한 승객 이동 패턴 분석, 혼잡 완화, 교통 수단 연계성 강화, 대중교통 이용 활성화 등에도 활용되어 교통 서비스 품질 향상에 기여합니다. 데이터 제공범위는 일별/월별 등의 환승 접근성 데이터 활용이 가능합니다.
