summary_user: 대전광역시 시내버스의 기점지(기종점지·종점지·공영차고지)별로 명칭, 주소, 운행 노선수, 운행대수를 한 행씩 담은 작은 목록 파일(csv 약 693바이트)이다. 대전 시내버스가 어느 차고지·기점에 몰려 있는지, 기점지별로 노선과 차량이 몇 대 배치됐는지 확인하려는 교통 분석가나 행정 담당자가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 기점지 이름이나 주소를 직접 맞춰 정류장·노선 원장과 연결해야 한다.
description_portal: 대전광역시 시내버스 기점지 목록은 대전광역시 내 시내버스의 기점지(기종점지, 종점지, 공영차고지)에 대한 정보를 정리한 자료입니다. 이 자료에는 각 기점지의 명칭, 주소, 해당 기점지에서 운행되는 노선수, 운행대수 등 주요 정보가 포함되어 있습니다. 이를 통해 대전 시내버스의 운행 구조와 기점지별 현황을 한눈에 파악할 수 있습니다. 이 자료는 버스 노선 운영, 대중교통 정책 수립, 차고지 관리 등 다양한 행정 및 연구 목적으로 활용할 수 있습니다. 또한, 각 기점지의 상세 주소와 노선별 운행대수 정보가 함께 제공됩니다.
