summary_user: 고속도로 노선·지점(구간)별로 연장, 차로수와 2021~2025년 연도별 연평균 일교통량(ADT)을 담은 집계 파일로, 범위는 전국 고속도로이고 좌표 등 공간 정보는 없다. 교통 분석가나 입지 검토자가 '이 고속도로 구간의 하루 평균 통행량이 최근 5년간 어떻게 변했고 차로수 대비 이용 수준은 어떤가'를 따질 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 노선명·구간명 같은 이름을 맞추거나 같은 기관(한국도로공사)의 지점번호 체계로만 이어 쓴다.
description_portal: 본 데이터는 고속도로 지점별 연평균 일교통량(ADT, Annual Daily Traffic) 정보를 제공하는 공공자료이다. 한국도로공사에서 관리하며, 노선명, 지점번호, 구간명, 구간에 대한 차로수, 연도별 교통량 항목으로 구성되어 있다. 해당 데이터는 일정 기간의 평균 교통량을 바탕으로 도로 구간별 이용 수준을 정량적으로 파악할 수 있어 교통 수요 예측, 혼잡도 평가, 차로 확장 검토 등 다양한 행정·기술적 목적에 활용된다. 지점번호와 구간명은 공간 단위별 분석 및 인접 구간 비교를 가능하게 하며, 차로수 정보는 도로 용량 분석과 설계 기준 검토에 중요한 기초자료로 쓰인다. 본 자료는 고속도로 인프라의 운영 효율성 제고와 중장기 교통정책 수립에 활용되는 공공데이터이다.
