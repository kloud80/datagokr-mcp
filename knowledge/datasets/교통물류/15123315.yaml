summary_user: 경기도 도로대장 전산화 시스템에 등록된 오르막 차로를 노선번호·구간번호별로 한 건씩 담으며, 시점·종점 위치와 좌표, 방향, 연장, 차로수, 폭원, 경사를 수록한다. 도로 설계·정비 담당자나 교통 분석가가 '경기도 어느 노선 구간에 오르막 차로가 있고 경사와 길이는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 도로대장 항목이나 도로망 데이터와는 노선번호·구간번호 같은 이름·코드 매핑이나 시점·종점 좌표로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 도로대장 전산화 시스템을 통해 제공되는 오르막 차로에 대한 정보로, 각 도로 구간별 경사로 특성을 수록한 자료입니다. 주요 항목은 '노선번호', '구간번호', '위치', '위치_종점', '위치-방향', '연장', '차로수', '폭원', '경사' 등으로 구성되어 있으며, 도로의 특정 구간이 상행 또는 하행 오르막으로 분류되는지를 포함합니다. 이를 통해 급경사 도로 구간을 식별하거나, 도로 설계 및 정비계획 수립, 차량 안전관리 기준 마련, 재난 대응 시 긴급 차량 진입경로 분석 등에 활용할 수 있습니다. 데이터는 건설 및 교통 인프라 운영기관, 도로공사 관계자, 도시계획 담당자 등이 참고 자료로 사용할 수 있습니다.
