summary_user: 경기도 이천시에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 건별 목록 파일(약 1.7KB CSV)로, 업체명·도로명주소·등록번호·최초 등록일·운영상태를 담는다. 화주나 물류 담당자가 "이천시에서 영업 중인 국제물류주선업체가 어디이고 아직 운영 중인가"를 확인하거나, 지자체가 지역 물류 인프라 현황을 파악하는 데 쓴다. 전국 공통 조인 키는 없어 업체명·주소 매칭으로만 다른 데이터와 잇고, 허가 여부 대조에는 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
