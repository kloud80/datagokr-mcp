summary_user: 서울 지하철 1~8호선 정거장별로 층수, 구조 형식, 지반고·레일면고(해발고도+100.3m 기준), 선로 기준과 승강장 기준 정거장 깊이를 한 행씩 담은 2025년 8월 기준 정적 파일(CSV, 약 15KB)이다. 방재 계획 담당자나 지하공간·BIM 분석가가 '어느 역 승강장이 지표에서 얼마나 깊은가', '대피 동선이 긴 깊은 역은 어디인가' 같은 질문에 쓴다. 전역 조인 키나 역 코드가 없으므로, 다른 역 좌표·승하차 데이터와는 호선과 역명을 맞춰 이름 매핑으로 연결한다.
description_portal: 서울교통공사에서 제공하는 역사 심도 데이터는 지하철 정거장의 위치 및 구조 정보를 정량적으로 파악할 수 있는 중요한 자료입니다. 본 데이터는 2025년 8월 기준으로, 서울 지하철 1~8호선 각 정거장에 대한 정보를 포함하며, 구성 항목은 호선, 정거장명, 정거장층수, 형식, ⓐ지반고(해발고도+100.3m), ⓑ레일면고(해발고도+100.3m), 정거장 깊이선로기준(m), 정거장 깊이승강장기준(m), 비고로 이루어져 있습니다. 해당 정보는 지하 인프라 설계, 방재 계획 수립, 도시 개발, BIM 모델링 등 다양한 분야에서 실용적으로 활용될 수 있습니다. 데이터는 향후 역사 신설, 구조 변경 시 갱신되어 추가 개방될 예정입니다. 각 항목의 산식은 그대로 유지되며, 지하공간 분석이나 위치 기반 시스템에서 정밀한 높이 및 깊이 정보를 제공하는 데 큰 도움이 됩니다.
