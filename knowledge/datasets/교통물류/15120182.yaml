summary_user: 한국교통안전공단 택시운전자격증의 신규발급·재발급 건수를 발급 기관(서울본부 등 지역본부, 홍성·진주 등 검사소, 상주교육센터)별 열과 합계 열로 정리한 전국 단위 집계표이며, 파일 크기가 460바이트인 소량 CSV다. 택시 운전 인력 수급을 보는 분석가나 사업자가 '어느 지역 본부·검사소에서 택시자격증이 많이 새로 발급되거나 재발급됐나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 본부·검사소 이름을 지역명으로 직접 맞추는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단 택시운송종사 데이터 및 CBT 관련 데이터 입니다.발급지역별로 신규발급건수 재발급건수 컬럼명이 있습니다- 국가자격시험 중 택시자격시험 응시 및 합격에 따른 자격증을 발급합니다.- 택시 육상종사자에게 필수로 취득하여야 하는 자격증입니다.- 총 4개 과목(지리 1문항), 총 70문항이 출제되며, 100점 만점 중 60점 이상 취득하여야합니다.- 택시자격 시험 정보는 본사-시험장 간 통신을 통해 전송되며, 시험 정보 일체(정답선택, 오답선택 등 개인이 선택한 사항과 시간 정보)가 본사 서버에 보관됩니다.- 택시자격증은 시험 합격자 대상으로 현장 발급되며, 자격번호, 주민번호, 지역정보가 표기되어 있습니다.- 영문자격증은 지원하지 않으며, 인터넷 또는 현장에서 (재)발급 받으실수 있습니다.- 택시자격시험은 필기시험 합격 후 취업 전까지 정밀검사를 받아야합니다.- 국가자격시험 시행 및 위탁 근거는 여객자동차 운수사업법을 참고 부탁드리며, 세부적인 사항은 한국교통안전공단으로 연락 부탁드립니다.
