summary_user: 경상남도 시군별로 고속도로·일반국도·지방도·시군도 등 도로등급별 전체 연장과 포장·미포장·미개통 연장을 미터 단위로 담은 집계 파일입니다(포털 설명상 2024년 10월말 기준, 3KB 남짓의 작은 CSV). 지역 분석가나 도·시군 담당자가 '우리 시군의 지방도·시군도 중 미포장이나 미개통 구간이 얼마나 남았는가'를 다른 시군과 비교하는 데 쓴다. 전역 조인 키가 없어 시군 이름(행정구역명)을 행정구역 코드표에 맞춰 매핑해야 다른 시군 단위 통계와 붙일 수 있고, 링크·노드 ID가 없으므로 표준노드링크와는 직접 연결되지 않는다.
limits: 시군구 단위 집계라 개별 노선·구간이나 위치는 알 수 없고, 링크·노드 같은 공통 키가 없어 다른 데이터와는 이름 매핑으로만 잇는다. 범위는 경상남도 한 시도에 한정된다.
