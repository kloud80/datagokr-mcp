description_portal: 경기도 부천시에 등록된 차량의 월별 현황으로 자동차(연료별,차종별,용도별)등록 수의 정보를 제공합니다.자동차는 자동차의 크기, 구조, 원동기의 종류, 총배기량 또는 정격출력등 국토교통부령이 정하는 구분 기준에 의하여 승용자동차, 승합자동차, 화물자동차, 특수자동차로 구분합니다.자동차등록대수는 자동차등록원부에 등록하고 운행할 수 있는 자동차의 대수를 의미합니다.자동차는 비교적 고가품인 대표적 내구재로서 경기상황에 민감하기 때문에 자동차 등록대수의 추이는 경기 상황을 판단하는 지표 중 하나로 활용될 수 있습니다.
