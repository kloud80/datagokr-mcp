summary_user: 자동차 검사를 받은 등록 차량의 1일 평균 주행거리를 전국 17개 시도별로 용도·차종(승용·승합·화물·특수)·연료(휘발유·경유·LPG·기타)에 따라 나눠 담은 집계 파일이다. 분석가나 정책 담당자가 '우리 시도의 경유 화물차는 하루 평균 몇 km를 달리나' 같은 지역·차종·연료별 주행 강도 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명·차종·연료명 같은 이름 매핑으로만 이어 쓰며, 더 세분한 자료는 같은 기관의 시군구별·연료별 일평균 주행거리 데이터와 함께 본다.
description_portal: 국내에 등록되어 도로를 운행 중인 자동차 중 자동차 검사를 받은 차량의 시도별, 용도별, 연료별, 일평균 자동차 주행거리 자료입니다. 시도(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)로 구분하고차종별 (승용차, 승합차, 화물차, 특수차)와연료별(휘발유, 경유, LPG, 기타) 로 구분하여한 1일 평균 자동차 주행거리 자료입니다. * 보다 상세한 자료는 "한국교통안전공단-용도별 차종별 시군구별 일평균 자동차 주행거리"나  "한국교통안전공단-용도별 차종별 연료별  일평균 자동차 주행거리"를 확인하기 바랍니다.
