summary_user: 부산광역시 수영구 관내에 등록된 운송사업체를 업체별 한 행으로 담은 명부 파일로, 업체명·업종 종류(화물운송·운송주선·전세버스·자동차대여 등)·주사무소 주소·전화번호가 들어 있다(CSV 약 2.8KB 규모). 구민이나 화주가 "수영구에 등록된 이 화물·이사 업체가 실제 등록 업체인가, 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 업체명·주소 문자열로 전국화물자동차운송사업자표준데이터 같은 허가 원장과 대조해 이어 쓴다.
