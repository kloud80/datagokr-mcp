summary_user: 인천광역시에 접수된 시내버스 불편민원을 연도별로 집계해 무정차통과·불친절·배차시간미준수·승차거부·난폭운전·기타 유형별 건수와 합계를 담은 작은 CSV 파일(343바이트)이다. 시민이나 교통 분석가가 '인천 시내버스 민원 중 무정차통과가 해마다 늘었나 줄었나'처럼 유형별 민원 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도(연도별)를 기준으로 다른 인천 버스 통계와 맞춰 붙이는 정도로만 연계한다.
limits: 연도·유형별 합계만 있어 노선·정류장·운수업체·군구별로 나눠 보거나 개별 민원 내용을 확인할 수 없다. 다른 데이터와 직접 연결할 공통 코드가 없어 연도나 이름 매칭으로만 이어 써야 한다.
