description_portal: 남산 1·3호 터널 시간대별 통행량 정보는 혼잡통행료 징수시간(오전 7시 ~ 오후 9시)동안의 시간대별 통행 데이터를 제공합니다.  시간대별로 제공되는 통행량을 통해 시간에 따른 교통량 추이 등을 파악하실 수 있으며 통행량 정보가 남산 1·3호 각 터널별로 제공되어 터널별 교통 통행량 현황을 파악하실 수 있습니다.데이터 시간대 단위는 1시간이며, 표기된 시간으로부터 1시간 동안 집계된 통행량을 의미합니다.(07:00 → 07시부터 08시까지의 데이터, 20:00 → 20시부터 21시까지의 데이터)※집계된 통행량 데이터는 2025년(2025.01.01 ~ 2025.12.31)의 징수시간(오전7시 ~ 오후9시)동안 산정된 교통 통행량이며, 공휴일 등 미징수일의 데이터는 미포함되었습니다.
