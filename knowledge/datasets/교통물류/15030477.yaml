summary_user: 부산광역시 사상구의 불법주정차 단속 내역을 단속 건별로 담은 파일(CSV 약 2.7MB)로, 단속기관·위반일자와 시간·위반장소명·과태료 부과 여부를 기록한다. 구청 교통 담당자나 분석가가 사상구에서 불법주정차 단속이 자주 일어나는 장소와 시간대가 어디인지, 그중 과태료가 실제 부과된 비율은 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위반장소명을 주소·지명으로 직접 매핑하거나 같은 기관(사상구) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 부산광역시 사상구의 불법주정차 단속현황 데이터로서, 불법주정차 단속에 대한 내역 데이터로 단속장소, 단속일시, 과태료 부과여부 등 다양한 정보를 포함하고 있어 도시 교통 질서 관리, 주정차 위반 예방 정책 수립, 자치구별 단속 실적 분석 등 행정적·정책적 목적에 활용될 수 있습니다. 또한 이 데이터는 지역 별 불법주정차가 빈번하게 발생하는 구역을 파악하고, 단속 강화를 위한 우선순위 설정, 계도 및 홍보 활동의 효과 분석, 과태료 부과 현황에 따른 재정 수입 추이 등 다양한 분석에 활용할 수 있습니다.
