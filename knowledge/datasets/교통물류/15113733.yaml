summary_user: 청주시가 고정형·주행형 CCTV와 주민신고(안전신문고앱)로 단속한 불법주정차 단속건수와 과태료 합계를 2019~2025년 연도별·4개 일반구(상당구·서원구·흥덕구·청원구)별로 담은 집계 파일이다. 시민이나 분석가가 '청주시 어느 구에서 불법주정차 단속과 과태료가 해마다 늘었나'처럼 구별 단속 추이를 볼 때 쓴다. 전역 조인 키(행정코드 등)가 없어 다른 데이터와는 연도와 구 이름(구명)을 맞춰 연결해야 한다.
description_portal: 본 공공데이터는 2019년부터 2025년까지 충청북도 청주시의 불법주정차 차량에 대한 단속 현황을 제공합니다. 불법주정차는 도로교통법에 따라 금지된 장소나 방법으로 주차 또는 정차하는 것을 뜻하며, 본 데이터에서는 청주시에서 고정형 CCTV, 주행형 CCTV, 주민신고제(안전신문고앱 신고) 등을 통하여 단속한 불법주정차 단속건수 및 과태료의 합계를 청주시 4개 일반구(상당구, 서원구, 흥덕구, 청원구)별로 제공합니다.본 데이터를 통하여 청주시 불법주정차 단속 추이를 알 수 있습니다.
