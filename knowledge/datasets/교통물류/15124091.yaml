summary_user: 경기도에서 운행 중인 버스의 차량 모델 목록으로, 제조사명(maker_nm)과 차종명(automb_nm)을 '[에디슨모터스] SMART9.3'처럼 모델 단위로 담은 참조 목록이며 운행 차량별 원천 기록은 아니다. 교통 분석가가 경기도 버스에 어떤 제조사·모델이 쓰이는지, 예를 들어 특정 제조사 차종이 목록에 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 버스 노선·차량 데이터와는 제조사명·차종명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: "이 데이터는 경기도에서 운영 중인 버스의 차량 모델 정보를 제공하며, 제조사명과 차종을 항목으로 포함합니다. 각 버스 모델은 제조사에 따라 구분되며, '[에디슨모터스] SMART9.3'과 같이 브랜드와 모델명이 함께 제공되어 식별이 용이합니다. 주요 제조사로는 에디슨모터스, 대우, 디피코, 범한자동차 등이 있으며, 일부 차량은 특수 관광용 버스(예: 트롤리버스)도 포함됩니다. 이 데이터는 차량 관리, 운행 노선별 차량 분포 분석, 친환경 차량 보급률 조사 등 다양한 교통 정책 및 운송 계획 수립에 활용될 수 있습니다. 또한, 차량 노후도 분석이나 제조사별 정비 이력 관리에도 유용하게 사용될 수 있습니다."
