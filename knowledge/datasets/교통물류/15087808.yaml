description_portal: 한국도로교통공단이 제공하는 고령 운전자 대상 교통안전 교육의 예약 정보를 정리한 데이터이다. 레코드는 기관·지부, 과정명, 교육일시, 교육장소, 회차, 모집정원, 신청자 수, 잔여좌석, 접수상태(접수중·마감), 접수방법(온라인·전화), 문의처 등으로 구성된다. 이용자는 지역과 기간, 과정 유형으로 필터링하여 수강 가능 여부를 확인하고, 수요 추세 분석·정원 배분·시설 운영 계획 수립의 근거로 활용할 수 있다. 필드 정의와 단위를 메타데이터에서 제공한다. 개인정보는 포함하지 않도록 비식별 기준을 적용하며, 분석·재가공 시 출처를 명시한다.
