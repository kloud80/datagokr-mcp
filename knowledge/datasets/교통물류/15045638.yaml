summary_user: 한국도로공사가 관리하는 고속도로의 교통사고 발생 현황을 연도별로 집계한 통계로, 2000년부터 2024년까지 해마다 사고 건수·사망자 수·부상자 수를 담은 작은 CSV 파일이다. 교통안전 분석가나 정책 담당자가 '고속도로 사망자 수가 지난 25년간 어떻게 변했는가' 같은 장기 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도(연도) 기준으로 다른 연도별 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 수집·관리하는 연도별 교통사고 발생 현황을 정리한 통계자료이다. 2000년부터 2024년까지 연도별 사고 건수, 사망자 수, 부상자 수 등 주요 지표가 포함되어 있으며, 고속도로 안전관리 및 사고 예방 정책 수립을 위한 기초자료로 활용된다. 이 통계는 사고 발생 추세를 파악하고, 시기별·규모별 사고 변화 분석에 유용하며, 교통안전대책 수립 및 평가의 기초자료로서 공공성과 활용도가 높다. 또한, 장기적인 도로 안전 정책 설계 및 사회적 비용 분석에도 기여할 수 있는 데이터이다. 해당 자료는 고속도로 이용자의 안전 확보, 교통 인프라 개선, 위험 구간의 선제적 대응을 위한 정보 제공을 목적으로 한다.
