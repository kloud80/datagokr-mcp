summary_user: 서울시 교통사고를 발생일·발생시간·법정동 단위로 묶어 사고건수, 사망자수, 중상자수, 경상자수, 부상신고자수를 담은 집계 통계로, 포털 설명상 2017~2019년 경찰이 처리한 인적 피해 사고만 대상이다. 서울 어느 동네에서 어느 요일·시간대에 사고와 사상자가 몰리는지 보려는 분석가나 교통안전 담당자가 쓴다. 전역 조인 키나 법정동코드 없이 시도·시군구·법정동명(이름)만 있어, 행정구역 코드표나 다른 지역 통계와는 이름을 매핑해 붙여야 한다.
description_portal: '- 서울시 일별 시간별  법정동별 교통사고 통계(2017~2019)(사고건수, 사망자수, 중상자수, 경상자수, 부상신고자수)    * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨- 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함'
