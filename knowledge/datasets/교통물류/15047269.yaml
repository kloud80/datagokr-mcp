summary_user: 서울시 교차로를 한 건씩 담은 목록으로, 교차로 코드와 명칭, 유형, 연동 교차로, 구 코드·지번·관할 경찰서, 계약종별·계량기번호 같은 유지관리 정보, X·Y 좌표를 함께 담는다. 교통 분석가나 지자체 담당자가 특정 구에 있는 교차로의 위치와 관할 경찰서, 연동 운영 여부를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 교차로 코드(INTR_CD)나 구 코드처럼 같은 기관 코드로 잇거나, 좌표·명칭으로 매핑해서 잇는다.
limits: data.seoul.go.kr 외부 사이트의 인증키(path 파라미터 KEY)가 따로 필요하며, 공공데이터포털 활용신청과는 별개다. 표준노드링크(node_id·link_id) 같은 전국 공통 키가 없다. 따라서 국가 교통 데이터와 바로 조인되지 않는다.
