summary_user: 대구도시철도 역에서 대구 시내버스로 갈아탄 승객 수를 연·월·승객 유형(일반·청소년·어린이)별 행으로, 역별 열(설화명곡~이곡 등)로 담은 월별 집계 CSV(약 53KB)이다. 교통 분석가나 시 정책 담당자가 어느 역에서 버스 환승이 많고 청소년·어린이 환승이 요금정책 뒤 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역별 승하차 통계와는 역 이름(열 이름)을 맞추고 연·월로 이어 붙여야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 2023년부터 대구도시철도에서 대구 시내버스로 환승하는 이용객의 월별·역별 환승 현황을 제공합니다. 일반, 청소년, 어린이 승객의 환승 인원 정보를 포함하고 있으며, 대중교통 간 연계 이동 현황을 정량적으로 파악할 수 있도록 구성되어 있습니다. 해당 자료는 도시철도 역별 유입 통계, 연령대별 환승 이용 행태, 환승 수요 분석 등에 활용될 수 있으며, 교통요금 정책 효과 분석, 연령별 이용 행태 비교, 노선 조정 및 혼잡도 개선 등 데이터 기반 교통정책 수립을 위한 기초자료로 활용될 수 있습니다. 본 데이터는 매월 1회 정기적으로 갱신됩니다.'
