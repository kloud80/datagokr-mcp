summary_user: 수도권1호선 도시광역철도역에 설치된 휠체어리프트를 한 대씩 담은 시설 목록으로, 운영기관·역명·관리번호·출입구번호·상세위치·길이·폭·시작층·종료층을 기록한 약 10KB 규모의 CSV 파일이다. 교통약자 이동권 분석가나 장애인 이용자가 '1호선 어느 역에 휠체어리프트가 남아 있고 몇 층에서 몇 층까지 연결되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·선명 같은 이름을 맞추거나 같은 기관(국가철도공단)의 다른 노선 휠체어리프트·승강설비 파일과 나란히 놓고 쓴다.
