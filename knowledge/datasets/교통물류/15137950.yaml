summary_user: 여수시 도로에서 발생한 돌발상황을 건별로 담으며, 돌발상황마다 발생위치·좌표·유형·진행상황·시작일시와 종료예정일시를 기록하고 일별 발생이력으로 조회한다. 운전자나 교통 분석가가 '여수시 어느 도로에서 지금 공사·사고 같은 돌발상황이 있고 언제 끝나는가'를 확인하거나, 이력을 쌓아 상습 돌발·정체 구간을 분석하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으나 명세상 표준링크 ID(link_id)와 X·Y좌표가 있어 링크 속도 데이터나 지도와 위치 기준으로 맞춰 볼 수 있다.
limits: 여수시 한 개 시 범위만 다루며 다른 시군구와 비교하려면 별도 데이터가 필요하다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로 연결해야 한다. 조회 결과는 그날의 사실이므로 추세 분석에는 이력을 직접 적재해야 한다.
