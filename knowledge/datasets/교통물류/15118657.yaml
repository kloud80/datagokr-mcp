summary_user: 서울교통공사가 운영하는 1~8호선 276개 역에 비치한 자동심장충격기(AED)를 역·설치 위치 단위로 담은 파일로, 호선·역명·지상/지하 구분·역층·상세위치·설치형태·보유대수가 들어 있다. 지하철 이용객이나 역 주변 응급대응 담당자가 '이 역에서 AED가 몇 층 어디에 있는가'를 확인하거나, 분석가가 역별 AED 보유 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역 데이터와는 호선과 역명을 이름으로 매핑하거나 같은 기관(서울교통공사) 자료끼리만 이어 쓴다.
description_portal: 서울교통공사에서 운영 중인 1~8호선 276개 역사에 비치하여 운영 중인 자동심장충격기(AED) 관련 데이터입니다.(2026년 2월 기준). 해당 데이터에는 역별 자동심장충격기(AED)의 총 비치 수량 및 설치장소가 포함되어 있습니다. 자동심장충격기(AED)의 경우 도시철도 역사 내 법적 의무 비치 물품은 아니나 현재 공사 내부 기준에 따라 역별 1개 이상씩 비치하여 심정지 환자 발생 등 긴급상황에 대비하고 있습니다. 보건복지부의 자동심장충격기(AED) 설치 및 관리 지침 내 "의무설치기관 외의 자동심장충격기 신고 및 관리" 규정에 준하여 점검 및 관리를 진행하고 있습니다. 심정지 환자 발생 시 누구나 사용 가능하도록 배치하고 있습니다.
