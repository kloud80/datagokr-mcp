summary_user: 이천시의 불법주정차 시민신고와 현장단속 결과를 한 건씩 담은 파일 데이터로, 신고일시·신고 위치·위반구분·과태료 부과 여부가 들어 있다. 시 교통·단속 담당자나 분석가가 '어느 시간대·요일·지역에 불법주정차 신고가 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가'를 따져 단속 인력 배치나 어린이보호구역·소방시설 주변 집중단속 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 신고 위치의 주소·지명을 이름으로 맞추는 방식으로만 연결되며, 어린이보호구역·무인단속카메라 표준데이터와 위치 기준으로 겹쳐 보는 정도가 현실적이다.
limits: 행정코드나 표준 키가 없어 다른 데이터와 자동으로 조인되지 않고, 이름·주소 매칭에 의존해야 한다. 범위는 이천시 한 곳뿐이라 시군구 간 비교에는 다른 지자체 자료를 따로 모아야 한다.
