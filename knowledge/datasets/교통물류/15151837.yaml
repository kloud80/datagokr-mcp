description_portal: 본 데이터는 이천시 불법주정차 시민신고 및 현장단속 결과를 통합한 건별 현황으로, 신고일시, 신고 위치, 위반구분, 과태료 부과 여부를 포함한다. 시간대·요일·지역별 위반밀집과 부과율·재발률을 산출해 어린이보호구역·소방시설 주변 집중단속, 계도→부과 전환효과 평가, 주차질서 개선에 활용된다. 월 1회 갱신을 권장하며 좌표는 소수점4자리 반올림, 주소는 블록단위 마스킹을 적용한다. 열지도 시각화와 단속 인력 배치 계획수립에 유용하며, 민원 대응과 취약시간대 예측에 참고된다. 데이터 결측 최소화 원칙을 준수함.
