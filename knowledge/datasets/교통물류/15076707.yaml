summary_user: 고속도로 버스전용차로가 운영되는 구간을 콘존(구간 단위) 별로 담은 데이터로, 노선명·노선번호, 콘존 이름, 상하행 방향, 운영 시작·종료 시각을 담는다. 운전자가 '주말 오후 경부고속도로 이 구간에서 버스전용차로가 시행되는가'를 미리 확인하거나, 내비·교통정보 서비스 사업자가 경로 안내에 시행 구간·시간을 반영하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 한국도로공사 데이터와는 노선번호(routeNo)·콘존 ID(conzoneId) 같은 기관 내부 코드나 노선·콘존 이름 매핑으로 이어 쓴다.
description_portal: 본 데이터는 고속도로 내 콘존 단위로 운영되는 버스전용차로의 구간 및 시간 정보를 제공한다.API를 통해 각 노선의 시작지점과 종료지점, 적용 방향, 운영 시작 및 종료 시각 등을 조회할 수 있다.운전자는 이를 통해 특정 시간대에 버스전용차로가 시행되는 구간을 사전에 확인할 수 있어 위반 방지 및 경로 설정에 도움이 된다.해당 정보는 교통운영기관, 정책 수립기관, 민간 서비스 제공자에게도 교통관리와 정보제공의 기초자료로 활용될 수 있다.제공되는 응답 데이터는 운영구간, 적용시간, 방향, 노선명 등의 항목으로 구성되며 XML과 JSON 형식으로 제공된다.본 API는 한국도로공사에서 관리하고 있으며, 최신 운영 현황이 반영되어 주기적으로 갱신된다.
