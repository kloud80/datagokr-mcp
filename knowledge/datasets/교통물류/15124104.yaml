summary_user: 경기도 버스운송관리시스템(BMS)에서 쓰는 행정기관 코드를 시도·시군구·읍면동 이름과 짝지은 코드 매핑표입니다. 경기도 버스 노선·정류소·차량 데이터의 지역 코드를 시군·읍면동 이름으로 풀어 시군별 통계를 내려는 분석가가 씁니다. 법정동코드(legaldong_cd)와 시외버스 지역코드 성격의 컬럼이 있지만, 실측에서 전역 조인 키로 확인되지 않아 이름·코드 매핑이나 같은 기관(경기도 BMS) 코드로만 다른 데이터와 잇습니다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에서 사용되는 행정기관명과 이에 대응하는 코드 정보를 포함한 코드 매핑표입니다. 각 기관명에 대한 고유 코드값을 제공함으로써 BMS 내의 행정구역 정보를 체계적으로 관리하고 일관된 방식으로 데이터를 처리할 수 있도록 지원합니다. 주요 항목은 행정기관명, 행정기관코드로 구성되며, 이는 각종 교통데이터와의 연계 시 필수적인 기준값으로 활용됩니다. 특히 데이터 분석, 시군 단위별 통계, 기관별 업무 분류, 정류소나 차량 정보의 위치 식별 등에 활용되며, 공공기관 간 데이터 교환 및 시스템 통합 시에도 중요한 역할을 합니다
