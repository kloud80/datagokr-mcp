summary_user: 부산광역시 연제구 관내에서 불법주정차로 과태료가 부과된 단속 건을 건별로 담으며, 각 건은 위반구분·단속일시·단속장소·데이터기준일자로 이루어진 CSV 파일(약 880KB)이다. 구청 담당자나 주민·분석가가 연제구 안에서 어느 장소·시간대에 불법주정차 단속이 몰리는지 확인하고 주정차 개선 정책이나 민원 응대의 기초자료로 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 단속장소 주소 문자열이나 같은 기관(연제구) 기준으로만 맞춰 이어 쓴다.
description_portal: '부산광역시 연제구 불법주정차 과태료 부과 현황은 연제구 관내 전 지역을 대상으로 제공하고 있으며, 제공하고 있는 기본정보는 각 건별로 위반구분, 단속일시, 단속장소, 데이터 기준일자 등으로 구성된 데이터입니다. 개인정보는 포함되어 있지 않습니다.제공하고 있는 데이터의 형태는 엑셀 데이터를 제공하고 있습니다. 제공되고 있는 데이터에 대한 자세한 설명이 필요할 경우 연제구청 교통행정과로(대표전화 ☎ 051-665-4000) 연락주시면 됩니다.※ 참고사항 : 위반장소의 경우, 단속 당시 차량의 정확한 위치 좌표를 확보하기 어려워 실제 차량 위치와 다소 차이가 있을 수 있으며, 가능한 한 인근 주소를 기준으로 기재하였습니다.이 자료는 행정 참고, 민원 응대, 불법 주정차 개선 정책 수립 등을 위한 기초자료로 활용 가능합니다.'
