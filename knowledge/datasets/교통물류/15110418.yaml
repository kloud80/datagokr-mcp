summary_user: 대전광역시 도로관리시스템에 기타 시설로 분류된 선형 도로시설물(방호울타리·가드레일·울타리·차선 등)을 시설물 한 건씩 담은 파일로, 선 형태 위치(WKT)·지형지물부호·관리번호·행정읍면동·도로구간번호를 포함하며 범위는 대전시 읍면동 단위다. 도로 관리 담당자나 분석가가 특정 동이나 도로구간에 어떤 선형 안전시설이 어디에 깔려 있는지 지도로 확인하고 점검 대상을 고를 때 쓴다. 전역 조인 키는 없어서 행정읍면동 이름이나 도로구간번호·관리번호를 같은 기관의 다른 도로시설물 파일과 맞춰 붙이고, WKT 좌표로 공간 결합해 쓴다.
