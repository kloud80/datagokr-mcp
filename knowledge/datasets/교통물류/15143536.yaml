summary_user: 대전도시공사가 운영하는 학하·신대·낭월 세 곳 수소충전소의 실시간 대기 상황을 충전소별로 담는 API로, 승용차·버스 대기차량 수와 트레일러 교체 여부를 제공한다. 수소차 운전자가 지금 어느 충전소가 덜 붐비는지, 트레일러 교체로 충전이 멈췄는지 확인하고 충전소를 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 충전소·위치 데이터와는 충전소 이름으로 맞춰 이어 써야 한다.
limits: 표준 충전소 코드 같은 조인 키가 없어 이름 매핑으로만 다른 데이터와 연결된다. 범위 메타데이터는 전국으로 잡혀 있지만 포털 설명상 실제 대상은 대전도시공사 충전소 세 곳뿐이다. 개발계정은 하루 10,000회 호출로 제한된다.
