summary_user: 인천1호선 각 역의 장애인화장실 위치를 화장실 한 곳당 한 행으로 담은 파일로, 운영기관·선명·역명과 지상·지하 구분, 역층, 게이트(개찰구) 안팎, 가까운 출구번호, 상세위치, 화장실 구분을 적는다(CSV 약 6KB). 휠체어 사용자나 보호자가 '이 역의 장애인화장실이 개찰구 안에 있는지, 몇 층 어느 출구 근처인지'를 미리 확인하거나, 분석가가 노선 내 역별 장애인화장실 배치 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 역 시설·승강기 데이터와는 역명·선명을 맞춰 붙여야 한다.
