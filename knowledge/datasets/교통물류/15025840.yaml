summary_user: 부산 금정구에 등록된 화물운송주선사업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 사업소명·도로명 소재지 주소·면허 구분·운영 여부·데이터 기준일자를 담는다. 화주나 이사·운송을 맡기려는 주민, 물류 분석가가 "금정구에서 허가받고 지금 영업 중인 주선업체는 어디인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명이나 도로명주소를 맞춰 이어야 하며, 전국 단위 허가 여부는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
limits: 금정구 한 곳만 담은 시군구 단위 자료라 다른 구나 부산 전체 현황은 알 수 없다. 사업자번호 같은 공통 식별 키가 없어 다른 데이터와 붙일 때는 업체명·주소 매칭에 기대야 하고, 이때 오매칭이 생길 수 있다.
