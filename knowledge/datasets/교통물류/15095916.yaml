summary_user: 대구광역시 북구에 주사무소를 둔 법인택시 회사를 회사 단위로 한 건씩 담은 목록으로, 사업체명·구분·주소·연락처·공개 여부를 제공한다. 택시 이용 중 불편을 겪은 시민이 해당 법인택시 회사의 연락처를 찾거나, 운송사업 양도양수를 검토하는 사업자가 북구 소재 택시회사를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업체명이나 주소 문자열 매칭, 또는 같은 기관 데이터로만 이어 쓴다.
description_portal: 대구광역시 북구에 소재하는 법인택시 회사의 정보를 제공하여 시민들의 정보에 대한 접근성을 향상합니다. 주요 정보로는 법인택시 회사명, 해당 법인택시회사가 보유하고 있는 면허대수(실제 등록차량 아님), 대표자 성명, 주사무소의 주소, 연락처를 포함하고 있습니다. 해당 정보는 여객자동차 운수사업법 및 동법 시행규칙에 의거 처리되는 여객자동차운송사업의 양도양수 시 유용하게 사용될 수 있는 정보입니다. 또한 택시 민원불편 사항 발생 시 민원인이 본 데이터를 바탕으로 적극적인 대응을 가능하게 함으로써 시민들의 권익 증진에 기여할 수 있습니다.
