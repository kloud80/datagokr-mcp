summary_user: 대전도시철도 1호선 역사에 설치된 CCTV를 설치 위치별로 카메라 위치·대수·화소수(만 단위)·설치목적·설치연월·보관일수·위경도·주소·관리기관 연락처와 함께 담은 건별 현황 데이터입니다. 시민이나 안전 분야 분석가가 '내가 이용하는 역에 CCTV가 몇 대, 어떤 목적으로 설치돼 있고 영상은 며칠 보관되나'를 확인하거나, 역사별 안전관리 현황 대시보드를 만들 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역 이름·주소 매칭이나 위도·경도 좌표 근접으로만 연결합니다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사에 설치된 CCTV 현황 정보를 제공하는 데이터입니다.카메라 위치, 화소수(만 단위), 카메라 대수, 설치목적 구분, 설치연월, 위도·경도, 관리기관명, 관리기관 전화번호, 도로명주소, 보관일수, 데이터 기준일자 등 CCTV 설치 및 운영에 관한 상세 항목 정보를 포함하고 있습니다.본 데이터를 활용하면 역사별 CCTV 설치 현황 및 안전관리 수준을 파악할 수 있으며, 공공안전 모니터링 서비스, 스마트 시티 안전 플랫폼, 교통 시설 안전관리 현황 대시보드 등 다양한 분야에서 활용이 가능합니다.CCTV 설치 현황을 투명하게 공개함으로써 시민이 안심하고 도시철도를 이용할 수 있는 환경 조성에 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
