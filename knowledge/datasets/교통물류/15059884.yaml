description_portal: '서울특별시 마포구의 마을버스 현황 데이터입니다. 이 데이터는 마을버스가 운영되는 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 실제 사무소 주소(도로명주소 및 행정동)가 포함되어 있습니다.기종점과 운행거리(단위:km), 정류소의 개수(중복 개수), 업체명과 연락처, 대표자 성함 등의 정보 등을 포함한 상세 정보를 제공합니다. 또한 등록대수(단위:대)등의 세부 정보도 포함되어 있어 주민들의 대중교통 이용 편의를 높이는 데 활용됩니다.이 데이터를 통해 지자체는 효율적인 노선 운영과 대중교통 서비스 개선을 추진할 수 있으며, 시민들은 실시간 노선 정보와 가까운 정류장 위치를 쉽게 확인하여 편리하게 이동할 수 있습니다.'
