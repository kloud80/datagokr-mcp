summary_user: 경기도 시군구별로 통행자가 하루 24시간 중 어느 시간대에 출발했는지를 통행 목적(출근·통학·귀가·기타·전체)별 백분율로 담은 집계 통계로, 포털 설명상 2021년 기준입니다. 교통 분석가나 지자체 담당자가 '우리 시의 출근 통행은 몇 시에 가장 많이 출발하나'처럼 시간대별 수요와 혼잡 시간을 시군끼리 비교할 때 쓴다. 전역 조인 키는 없고, 지역 코드(region_cd)와 지역명으로 다른 경기도 시군구 통계에 매핑해 이어 쓴다.
description_portal: 이 데이터는 2021년 기준 경기도 내 시군구별 통행자의 출발시간을 통행 목적(출근, 통학, 귀가, 기타, 총합)별로 시간대 단위로 백분율(%)로 나타낸 자료입니다. 지역별 코드와 이름이 포함되어 있으며, 하루 24시간을 시간대별로 구분하여 각 통행 목적에 따라 몇 퍼센트의 사람들이 이동을 시작했는지에 대한 통계 정보를 제공합니다. 해당 자료는 5년 주기로 조사·갱신됩니다. 이 데이터는 지역별 교통 수요 예측, 대중교통 시간표 조정, 혼잡 시간대 분석, 도시계획 수립 등 다양한 교통 정책 수립 및 연구에 활용될 수 있습니다. 예를 들어, 특정 시군의 출근 시간대 비중이 높은 경우 해당 시간대에 교통 자원 배분을 집중할 수 있으며, 시군 간 비교를 통해 교통 인프라 개선의 우선순위를 설정하는 데에도 유용합니다.
