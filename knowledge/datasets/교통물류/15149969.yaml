summary_user: 최대이륙중량 250g 초과 2kg 이하 드론에 해당하는 4종 조종자격의 연도별 이수 인원을 무인멀티콥터·무인헬리콥터·무인비행기·무인수직이착륙기 기체 형태별로 나눠 담은 전국 단위 집계 파일(CSV 약 221바이트)이다. 드론 산업 분석가나 교육·정책 담당자가 "해마다 4종 드론 자격 취득자가 늘고 있는지, 어떤 기체 형태에 몰리는지"를 확인할 때 쓴다. 전역 조인 키가 없으므로 다른 드론 자격(1~3종)·기체 신고·비행승인 통계와는 연도 컬럼(년도)을 기준으로 나란히 놓고 비교해 쓴다.
description_portal: 항공안전법 제125조에 따라 초경량비행장치를 사용하여 비행하려는 사람은  조종을 위하여 발급하는 증명을 받아야 한다. 그 중 최대이륙중량 2kg이하 250g초과의 기체는 4종으로 분류되며, 한국교통안전공단 ts배움터(edu.kotsa.or.kr)에서 온라인 교육 수료 및 온라인 시험 합격 후 취득할 수 있다. 드론의 종류를 형태에 따라, 무인멀티콥터,무인헬리콥터,무인비행기,무인수직이착륙기(2025년5월 신설)로 구분된다. 해당 자료는 년도별 4종 드론 자격 이수현황에 대한 자료이다.
