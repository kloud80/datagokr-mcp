description_portal: 해당 정보는 한국교통안전공단에서 보유하고 있는 정보로, 주차정보시스템에서 정보를 제공하고 있으나 원 데이터 출처는 기계식주차장 정보관리시스템입니다. 해당 정보는 년도에 따라 각 지자체(시도, 시군구)에 설치된  2단식 기계식주차장의  설치 기수, 설치 대수에 대한 정보를 제공합니다. 해당 자료는 2023년도 통계자료로 2022년도 까지의 값을 제공하고 있습니다. 2단식 기계식주차장치의 대분류 코드명과 세부유형 코드명을 같이 제공하고 있으니  정보이용에 참고하시기 바랍니다.
