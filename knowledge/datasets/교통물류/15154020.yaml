summary_user: 한국국토정보공사가 제공하는 국가지점번호 관련 전국 데이터로, 필드 이름으로 보아 측정 일시, 위치(GPS 경도·위도), 온도·습도·기울기·충격·소리·배터리 측정값과 각 항목의 경보 설정값을 담는 것으로 보이나 명세상 필드 의미는 비어 있다. 시설 관리자나 분석가가 "어느 지점번호판에서 기울기·충격 이상이나 배터리 저하가 경보 기준을 넘었는가" 같은 상태 점검 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 지점 번호로 보이는 필드(MPLS_NO)의 이름·코드 매핑이나 GPS 좌표 근접 매칭으로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국국토정보공사에서 제공하고 있는 국가지점번호정보데이터서비스입니다.
