description_portal: 세종도시교통공사 운행노선 정류장정보에 대해서 안내합니다. 버스정류장 시설현황 데이터는 2021년 9월 24일 기준입니다.세종도시교통공사는 시민들이 쾌적하게 버스정류장을 이용하실 수 있도록 세종시 관내 1,298개소 시내버스 및 BRT 정류장 시설을 관리하고 있습니다.시설현황은 비가림형 750개소, 기둥형 646개소, 신교통형34개소이며, 정류장 관제센터를 운영하고 있습니다.제공정보로는 자료의 연번, 해당 정류장의 버스노선번호, 노선의 고유 ID, 버스정류장의 정류소번호, 정류소의 고유ID 번호, 정류소의 설치위치를 나타내는 정류소 명, 대여소 설치 경도값과 위도값을 공개하고 있습니다.
