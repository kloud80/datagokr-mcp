summary_user: 세종도시교통공사가 운행하는 시내버스·BRT 노선의 정류장 정보를 노선번호·노선ID와 정류소번호·정류소ID·정류소명·위도·경도로 한 행씩 담은 CSV 파일이며, 포털 설명상 2021년 9월 24일 기준 세종시 관내 정류장 1,298개소를 다룹니다. 시민이나 분석가가 '이 노선은 어느 정류장들을 지나고 그 정류장은 지도상 어디에 있는가'를 확인하거나 정류장 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 정류소ID·노선ID를 같은 기관 코드 체계(세종 BIS·도착정보 등)로 맞추거나 정류소명·좌표로 매칭해 이어 쓴다.
