summary_user: 대구광역시 도로에서 발생한 교통사고·고장 차량·공사·행사 등 돌발 상황을 건별로 담은 파일로, 날짜·돌발번호·돌발내용·시작·종료 시각과 위경도를 개별 지점 단위로 기록한다. 교통 분석가나 시 담당자가 '대구에서 돌발 통제가 잦은 지점과 시간대는 어디인가'를 파악해 사고 다발 지역 도출이나 혼잡 원인 분석에 쓴다. 전역 조인 키는 없어 다른 데이터와는 위경도 좌표로 공간 매칭하거나 날짜·시간으로 맞춰 이어 쓴다.
description_portal: 대구광역시 교통통제 정보는 지능형교통시스템(ITS)를 통해 수집된 실시간 도로상 돌발 상황 정보를 제공하는 통계자료입니다. 이 정보는 교통사고, 고장 차량, 공사 구간, 행사 및 집회 등 다양한 원인으로 도로 위에서 발생하는 교통통제 상황에 대해 경찰청 DB와 연계하여 제공되며, 수집된 데이터는 해당 상황이 발생한 일시, 돌발번호, 돌발등급, 시작시간, 종료시간, 주소, 위경도값을 제공합니다. 해당 자료를 통해 사고 다발 지역 도출, 혼잡 원인 분석, 특정 시간대 사고 위험도 분석, 도시 교통안전 개선, 정책 기초 자료 등으로 활용할 수 있습니다.
