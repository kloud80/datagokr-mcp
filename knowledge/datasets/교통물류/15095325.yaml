description_portal: '광주광역시 과적차량 단속 현황에 대한 데이터로 검차대수 및 지역(자치구)별 적발건수 등을 제공합니다.과적차량 단속은 도로의 구조를 보전하고 통행의 위험을 방지하여 교통소통의 원활을 목적으로 합니다. ○ 단속대상 : 단속기준을 초과한 운행제한(과적) 자동차 및 건설기계 ○ 단속기준 : 축하중 10톤, 총중량 40톤, 폭 2.5m, 높이 4.0m, 길이 16.7m 운행제한 기준 초과 차량 ○ 위반처리 : 위반 정도에 따라 30~300만원 과태료 부과 ○ 단속근거 : 도로법 제77조 및 동법 시행령 제79조 ○ 단속방법 : 1개조(6명) 편성 이동단속'
