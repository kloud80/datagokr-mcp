description_portal: 인천국제공항 운항(항공편/여객/화물) 실적에 대한 공항별 통계 정보로 정기/부정기 (periodicity 정기=0,부정기=1),화물기/여객기(null= 전체, 여객기 =Y, 화물기 = N),국제선/국내선(null=전체,국제선=I,국내선=D)기준으로 공항,도착,출발,합계편수등을 제공합니다. 월별 데이터를 제공하며 개발 계정 일 1000 트래픽,운영 계정 신청 시 일 1000000 트래픽을 제공합니다. 개발 계정과 운영 계정 모두 자동 승인됩니다. *2024년 10월까지만의 데이터만 조회 가능합니다. 24년 11월부터 기관 관리대상 정보에서 제외되어, 전국 공항별 항공통계 정보는 한국공항공사 홈페이지의 항공통계에서 확인 가능하오니 참고하시기 바랍니다.
