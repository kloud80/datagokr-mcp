summary_user: 인천국제공항 운항 실적을 상대 공항별로 월 단위 도착·출발·합계 편수로 집계해 담으며, 정기/부정기·여객기/화물기·국제선/국내선 기준으로 나눠 조회하고 검증 호출에서는 8행을 받았다. 분석가나 관광·물류 사업자가 '인천공항에서 특정 공항으로 오가는 항공편이 월별로 얼마나 되는가'를 보고 노선별 여행·출장 수요나 화물 물류 흐름을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 항공통계·공항코드 데이터와는 공항 이름을 맞춰 연결해야 한다.
