summary_user: 대전광역시 어린이보호구역 안의 불법주정차 단속구간을 구간별로 담은 원천 목록 파일(csv, 약 38KB)로, 주소·위도·경도·인근 학교이름·시군구·연락처·기준일자를 함께 담는다. 학부모나 주민이 우리 아이 학교 앞이 주정차 단속구간인지, 주민신고 대상 구역이 어디인지 확인하거나 분석가가 단속구간 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 시군구코드·시군구명이나 학교이름 매핑, 위경도 좌표 기반 공간 결합으로 어린이보호구역 표준데이터·학교 정보 등과 이어 쓴다.
description_portal: 대전광역시 불법주정차 단속구간(어린이보호구역 단속구간) 데이터는 대전광역시 내 어린이보호구역에서의 불법주정차 단속구간 및 주민신고제 운영 현황을 제공하며, 관리번호, 시군구명, 시군구코드, 우편번호, 주소, 연락처, 위도, 경도, 위치, 학교이름, 대표이미지, 기준일자, 기타 등 다양한 항목으로 구성되어 있습니다. 이 데이터는 어린이 보호구역 내 불법주정차 단속이 이루어지는 구간의 정확한 위치 정보와 단속 현황, 신고 접수 및 처리 내역 등을 포함하고 있어, 어린이 교통안전 강화와 불법주정차 예방에 효과적으로 활용될 수 있습니다.
