summary_user: 인천도시철도 1호선 휴일 하선(검단호수공원역→송도달빛축제공원역 방향) 열차마다 시발역·종착역·열차번호와 33개 역별 출발시각을 한 행씩 담은 시각표 파일(csv, 약 43KB)이다. 휴일에 특정 역에서 송도 방향 첫차·막차가 몇 시인지, 역 간 소요시간이 얼마인지 확인하려는 이용자나 배차 간격을 분석하는 사람이 쓴다. 전역 조인 키는 없어 평일·상선 시각표나 역 단위 승하차 데이터와는 역 이름을 맞춰서 잇는다.
description_portal: 인천교통공사에서 운영하는 인천도시철도 1호선 휴일 하선(검단호수공원역에서 송도달빛축제공원역 방향) 열차운행시간표 입니다.해당데이터는 시발역, 종착역, 열차번호, 경유역별 열차출발시각 정보로 구성되어있습니다.인천지하철 1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역을 운영하고 있습니다.대부분의 데이터의 시발역과 종착역은 검단호수공원역과 송도달빛축제공원역입니다. 시발역이 예술회관역, 작전역, 박촌역인 정보가 각각 1건씩 존재합니다.종착역이 국제업무지구역은 2건이고 송도달빛축제공원역, 동막역, 예술회관역, 작전역은 각각 1건씩 존재합니다.인천1호선 휴일 운행시간은 역별로 상이하나 전체적인 열차운행은 05시 30분에 시작하여 익일 00시 59분에 종료됩니다.이 자료는 2025년 6월 28일 개통한 인천 1호선 3개역(검단호수공원역, 신검단중앙역, 아라역)이 반영된 데이터입니다.
