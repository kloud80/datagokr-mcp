summary_user: 전국 드론 교육기관(조종교육으로 등록된 초경량비행장치 사용사업체)의 교관 수를 지역1·지역2 권역별로 나눠 2022~2026년 연도별 열로 담은 집계 표이며, 활용신청 없이 받는 작은 CSV 파일(약 6.6KB)이다. 분석가나 교육사업자가 "어느 권역에 드론 교관이 몰려 있고 해마다 늘었나"를 볼 때 쓴다. 전역 조인 키가 없어 다른 드론 통계(사용사업체·조종자격 현황 등)와는 권역 이름을 맞춰서만 이어 쓴다.
description_portal: 드론을 활용하여 경영을 하려는 자는 항공사업법 제48조(초경량비행장치사용사업의 등록)에 따라 등록을 해야하고, 한국교통안전공단은 같은법 제75조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.사업등록 시 촬영,측량,관측,점검,조종교육,농업지원,기타의 항목을 선택할 수 있으며, 조종교육으로 등록된 사용사업체가 드론교육을 수행할 수 있다.현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있고, 사업자등록번호 기준으로 사용사업체의 이력을 관리하고 있다.그리고 교육생 관리를 위해 드론 비행경력시스템(https://www.kotsa.or.kr/dfms)을 통해 교관, 교육생을 관리하고 있다.해당자료는 서울, 경기도, 경상도 등 권역별 드론 교육기관의 년도별 교관 수 정보를 제공하여, 교관 수와 관련된 통계자료 필요 시 활용 이 가능하다.
