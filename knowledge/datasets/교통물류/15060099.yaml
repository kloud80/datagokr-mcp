summary_user: 대구 북구 안의 자전거 수리업소(수리센터)를 업소 한 곳당 한 행으로 담은 파일로, 상호명·주소·상세위치·전화번호·운영시각·영업일과 휴무일·비용부과 여부·위경도를 기록한다(CSV 384바이트의 소규모 목록). 북구 주민이 '집 근처에서 무료나 저렴하게 자전거를 고칠 곳이 어디이고 언제 여는지'를 확인하거나, 분석가가 자전거 정비시설 위치를 지도에 표시하는 데 쓴다. 전역 조인 키는 없으므로 위도·경도로 공공자전거 대여소나 자전거도로 노선 GIS와 공간적으로 겹쳐 보거나 주소·기관명으로 맞춰 잇는다.
