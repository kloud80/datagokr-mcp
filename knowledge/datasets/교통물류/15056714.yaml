summary_user: 경기도 31개 시군에서 인허가를 받은 1톤 이하 일반형·밴형 화물차 용달화물 운송사업자를 업체 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자와 도로명·지번주소, 위도·경도를 포함한다. 화주나 분석가가 "우리 시군에 영업 중인 용달화물 업체가 어디에 몇 곳 있는가"를 확인하거나 업체 분포를 지도로 그리는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 시군명(SIGUN_NM)·사업장명·주소로 다른 데이터와 맞춰 쓰고, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터와 대조해 본다.
description_portal: 용달화물(운송사업)업체 현황 데이터는 경기도 내 31개 시군에서 인허가를 받은, 최대 적재량 1톤 이하의 일반형 또는 밴형 화물자동차를 이용해 전국을 대상으로 유상 화물운송을 수행하는 사업자의 정보를 제공합니다. 데이터는 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 면적, 건물소유구분, 자료기준년도, 다중이용업소여부, 위생업종 및 업태명, 도로명주소, 지번주소, 우편번호, 위도·경도 등으로 구성되어 있으며, 용달화물 시장 분석, 운송업체 현황 파악, 위치기반 서비스 개발 등 다양한 분야에 활용될 수 있습니다. 단, 본 데이터는 2018년 9월 기준이며 이후 갱신이 중단되었습니다.
