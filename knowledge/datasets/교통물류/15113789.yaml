description_portal: 서울교통공사 개집표기 시설물 종류 정보입니다. 2025년 8월  현재기준 기준턴스타일 개집표기, 슬립 개집표기, 플랩형 개집표기, 표준형 개집표기, 개방형 개집표기, 스피드 개집표기, 우대자용 개집표기, 엘리베이터용 개집표기에 대한 예시 사진  및 크기에 대한 정보를 포합하고 있습니다. 턴스타일 개집표기 상부외함 교체 진행중에 대한 사진을 추가해서 3월에 업데이트 하였습니다.현재 1~4호선만 턴스타일 개집표기의 상부외함 교체 작업 진행중이라 해당 부분 사진 추가하였습니다.  5~8호선에 대해서는 턴스타일이 설치되어 있지 않습니다.  (현재 1~4호선에만 턴스타일이 설치되어 있습니다.)개집표기는 교통카드를 태그하는 설비로 요금처리를 위한 기반이 되는 시설이며,  동작하는 방식 및 목적에 따라 이름을 분류하고 있습니다.  사진 및 추가 설명은 파일을 참고해 주시기 바랍니다.
