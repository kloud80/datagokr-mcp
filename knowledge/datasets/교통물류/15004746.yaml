summary_user: 강남구도시관리공단이 운영하는 공영주차장을 주차장 한 곳당 한 행으로 담은 CSV 파일(약 11KB)로, 주차장 구분(노상·노외·부설), 도로명·지번 주소, 주차구획수와 장애인·가족배려·경차·대형차 등 전용면 수, 요일별 운영시간, 기본요금·월정기권 요금을 담는다. 강남구 주민이나 방문객이 '주말에 문을 열고 장애인 주차면이 있는 공영주차장이 어디이며 기본요금은 얼마인가'를 확인하거나, 분석가가 구 내 공영주차 공급 규모를 파악하는 데 쓴다. 전역 조인 키(주차장관리번호 등)가 없어 전국주차장정보표준데이터 같은 원장과는 주차장명·주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 강남구도시관리공단이 운영·관리하는 공영주차장의 주요 정보를 종합적으로 정리하여 제공하는 자료입니다.주차장 위치, 운영시간, 주차요금 등 이용자가 실제로 필요로 하는 핵심 정보를 체계적으로 제공함으로써 주민과 방문객의 주차 편의를 높였습니다.데이터에는 주차장명, 주차장 구분(노상·노외·부설), 소재지 도로명주소 및 지번주소 등 기본적인 위치 정보와 함께 주차구획수가 포함되어 있어 각 주차장의 수용 능력을 명확하게 파악할 수 있습니다.또한 장애인 주차면, 가족배려 주차면, 대형차 주차면 등 다양한 전용 주차구역 현황을 제공하여, 이용자의 특성과 필요에 맞는 주차 가능 공간을 쉽고 정확하게 확인할 수 있습니다.운영 정보에는 운영요일, 평일·토요일·공휴일의 운영 시작 및 종료시간이 포함되어 있어 방문 전 주차장 이용 가능 여부를 사전에 확인하는 데 유용합니다.이와 더불어, 주차기본시간, 기본요금, 월정기권 요금 등 상세한 요금 정보도 함께 제공되어 실제 이용 비용을 예측하고 합리적인 주차 계획을 세울 수 있도록 지원합니다.
