summary_user: 서울특별시 양천구 관내의 불법 주정차 단속용 고정형 CCTV를 설치 지점 한 곳당 한 행으로 담으며, 설치 주소, 위도·경도, 자치구 코드, 단속지점명이 들어 있다. 시민이나 운전자가 '이 도로나 생활권에 주정차 단속 카메라가 있는가'를 확인하거나, 분석가가 단속 카메라가 적은 불법 주정차 취약 지역을 찾고 시설 확충을 검토하는 데 쓴다. 데이터셋 사이를 잇는 공통 조인 키는 없어서, 자치구 코드(CGG_CD)나 지점명·주소를 매핑해 서울시의 다른 자치구 CCTV 위치 자료나 교통 데이터와 붙여 쓰고, 위경도로 지도에 겹쳐 본다.
description_portal: 서울특별시 양천구가 제공하는 본 데이터는 관내 주요 도로 및 생활권 중심지에 설치된 불법 주정차 단속 CCTV의 위치 정보를 체계적으로 정리한 자료이다. 해당 정보는 서울시 및 25개 자치구에서 운영중인 주정차단속용 고정형CCTV의 위치정보를 제공하여 불법주정차 위반으로 인한 사회적 비용을 절감하고, 교통정보 플랫폼과 연계하여 시민에게 다양한 교통 서비스를 제공하고자 합니다.이 자료는 도로 혼잡 완화와 보행 안전 확보를 위한 행정 업무의 효율성을 높이는 데에도 기여하며, 불법 주정차 취약 지역 분석, 단속 계획 수립, 시설 확충 검토 등 정책적 판단의 근거 자료로 활용된다. 이용자는 본 데이터를 통해 지역 내 단속 현황을 손쉽게 확인할 수 있으며, 공공 서비스 개발이나 교통 관리 체계 개선을 위한 기초 정보로도 유용하게 사용할 수 있다.
