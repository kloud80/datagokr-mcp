summary_user: 한국도로공사가 관리하는 고속도로의 도로파임(포트홀) 발생건수를 2015년부터 2025년까지 연도별로 집계한 777바이트 CSV 파일입니다. 고속도로 포트홀이 해마다 늘었는지 줄었는지를 보려는 분석가나 도로 안전에 관심 있는 국민이 연도별 추이를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞춰 붙이거나 기관명으로만 연결합니다.
description_portal: 본 데이터는 한국도로공사가 관리하는 고속도로에서 발생한 도로파임(포트홀) 정보를 수록한 자료이다.  도로파임은 차량 하중, 기후 변화, 노면 노후화 등에 의해 발생하며, 차량 파손이나 교통사고로 이어질 수 있는 주요 도로 손상 유형 중 하나이다.  데이터는 발생 일시, 발생 위치, 노선명, 방향, 발생 원인, 처리 여부, 처리 시간 등으로 구성되어 있으며, 고속도로 내 도로파임 발생 현황을 체계적으로 정리하고 있다.  해당 정보는 유지관리 계획 수립, 긴급보수 대응, 위험 구간 분석, 사고 예방 대책 마련 등 다양한 분야에서 활용 가능하다.  CSV 형식으로 제공되며, 연도별 조회가 가능하여 도로 손상 이력 분석 및 관리 효율성 향상에 기초자료로 쓰일 수 있다.
