summary_user: 한국건설기술연구원이 제공하는 도로 교통량 수시조사 자료로, 필드명으로 보아 조사연도·도로등급·조사지점·방향·조사시간대별로 교통량 합계와 12개 구분(차종으로 추정)별 교통량을 담으며, 범위는 전국이고 공간 좌표는 없습니다. 교통 분석가나 도로 계획 담당자가 특정 도로등급·지점에서 시간대와 방향별 교통량이 어떻게 나뉘는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 조사지점 번호나 도로등급 이름을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시조사자료 정보입니다.\""
