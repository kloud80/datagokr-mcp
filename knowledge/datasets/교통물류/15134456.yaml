description_portal: 한국교통안전공단에서 제공하는 정보입니다. 해당 정보는 각 지방자치단체에서 관리하는 주차장 정보를 수집하여 취합 제공하는 정보입니다. 지방자치단체별(시도, 시군구) 주차장 현황을 제공하고 있으며 주차장 구분에 따라 부설주차장, 노외주차장, 노상주차장의 수를 제공하고 있습니다. 노상주차장은 유료, 무료 여부를 구분하여 제공하고 있으며, 노외주차장은 민영주차장, 공영주차장을 구분하여 제공하고 있습니다. 2023년도에 취합한 자료로 2022년까지의 자료를 제공하고 있습니다.
