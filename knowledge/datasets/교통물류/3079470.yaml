summary_user: 광양시 안의 불법주정차 단속용 무인카메라를 설치 장소 한 곳당 한 행으로 담은 파일로, 읍면동·설치 장소명·설치 주소·설치년도·카메라 수를 싣고 있다. 광양 시민이나 운전자가 '우리 동네 어디에 주정차 단속 카메라가 있나'를 확인하거나, 분석가가 읍면동별 단속 장비 배치를 비교하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와 붙이려면 읍면동 이름이나 설치 주소를 맞춰 연결해야 한다.
limits: 행정코드 같은 공통 키가 없으므로 다른 지역·전국 데이터와는 이름·주소 매핑으로만 연결된다. 범위는 광양시 한 곳뿐이고, 좌표가 아닌 주소 문자열로 위치를 담고 있어 지도에 올리려면 주소 변환이 필요하다.
