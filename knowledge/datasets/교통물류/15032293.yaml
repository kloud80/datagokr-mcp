summary_user: 경상남도 거창군에 등록된 화물운송주선업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·대표자명·도로명/지번 주소·위도·경도·전화번호를 제공하며 파일 크기는 671바이트로 소수 업체만 들어 있다. 거창군에서 화물 운송을 맡길 주선업체를 찾는 사업자나 지역 물류 중개업체 분포를 지도에 올려 보려는 분석가가 "거창군 안 주선업체는 어디에 있고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열이나 좌표로 맞춰야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: '경상남도 거창군 화물운송주선업체에 대한 데이터로 경상남도 거창군 화물운송주선업체 업체명, 경상남도 거창군 화물운송주선업체 대표자명, 경상남도 거창군 화물운송주선업체 소재지도로명주소, 경상남도 거창군 화물운송주선업체 소재지지번주소, 위도, 경도, 경상남도 거창군 화물운송주선업체 전화번호를 제공합니다.○ 데이터 기준일 : 2025. 11. 13.○ 화물운송주선업체란 화물 운송을 필요로 하는 고객과 실제 운송을 수행하는 운송사업자 사이를 연결해주는 중개업체로, 운송계약 체결, 배차, 운임 정산, 화물 추적 등의 업무를 수행합니다. 이들은 직접 차량을 보유하지 않고도 운송 서비스를 기획·관리하며, 고객의 물류 효율성을 높이는 역할을 합니다. 국내에서는 「화물자동차 운수사업법」에 따라 등록된 업체만이 합법적으로 운영할 수 있습니다.'
