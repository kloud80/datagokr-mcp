description_portal: 전라남도 나주시청과 관련된 주차장에 설치된 태양광 시설에 대한 현황 데이터입니다. 태양광 시설이 설치되어 있는 주차장은 총 3곳으로 2012년에 설치한 송월동의 나주시청 주차장의 태양광 시설, 2012년에 설치된 빛가람동의 빛가람행정복지센터 주차장의 태양광 시설 그리고, 2024년에 설치한 영산강변로에 위치한 나주종합스포츠파크 주차장의 태양광 시설입니다.해당 데이터에는주차장명, 주소, 면적곱미터, 주차면수(면), 설비용량, 설치연도(YYYY), 용도(자가소비/판매 등) 정보가 포함되어 있습니다. 주차장 면적은 제곱미터 단위이며, 설비용량은 킬로와트 단위입니다.
