summary_user: 시군구별로 자동차 주행거리 10억 km당 교통사고 사망자 수(명/10억km)를 담은 전국 단위 집계 통계로, 시도·시군구·주행거리당 사망자수 세 항목으로 이루어진 작은 CSV 파일(약 5KB)이다. 지자체 교통안전 담당자나 분석가가 "우리 시군구는 차량 운행량에 비해 교통사고 사망 위험이 다른 지역보다 높은가"를 비교하는 데 쓴다. 전역 조인 키(행정구역 코드 등)가 없어 다른 시군구 통계와는 시도·시군구 이름을 매핑해 이어 써야 한다.
description_portal: 자동차주행거리 당 교통사고 통계 중 교통사고 사망자수 통계입니다. 우리나라 시군수별로 실제 도로를 운행 중인 자동차 주행거리, 교통사고 사망자 수를 비교분석한 통계입니다. 자동차주행거리 10억 km당 시군구별 교통사고 사망건수를 비교분석한 통계를 제공하고 있습니다. 특별시, 광역시, 광역도로 구분하며, 시군구별로 229개 기초 지자체의  통계를 제공하고 있습니다교통사고 현황은 경찰청 교통사고 통계의 가해운전자 차종별 월별 교통사고를 자료를 활용합니다. 단위(명/10억km)
