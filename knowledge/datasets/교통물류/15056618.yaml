summary_user: 서울시 교통정보 시스템(TOPIS) 기준 소통 돌발 링크 정보를 서울 열린데이터광장 OpenAPI로 조회하는 데이터로, 링크 아이디·도로명·시작/종료 노드명·지도거리·권역코드를 링크 단위로 담는다. 교통 분석가나 앱 개발자가 서울 도로의 어느 링크에서 돌발 상황이 발생했는지 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않아 링크 아이디나 도로명·노드명 매핑, 같은 기관의 다른 교통 데이터 코드로만 연결하며, 이력을 쌓으면 상습 정체 분석에 쓸 수 있다.
description_portal: '해당 데이터는 서울시 소통 돌발 링크 정보 OpenAPI 데이터입니다. 데이터의 원본시스템은 서울시 교통정보 시스템(https://topis.seoul.go.kr)입니다. 요청인자 : 인증키, 요청파일타입, 서비스명, 요청시작위치, 요청종료위치, 링크 아이디출력값 : 총 데이터 건수(정상조회 시 출력됨), 요청결과 코드, 요청결과 메시지, 링크 아이디, 도로명, 시작노드명, 종료노드명, 지도거리, 권역코드※ 바로가기 링크 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다. 열린데이터광장에서 제공하는 오픈API를 사용하기 위해서는 먼저 인증키를 발급받으셔야 합니다.'
