summary_user: 전국 고속도로 출발·도착 영업소 쌍마다 운영기관, 차로 수별 합계거리, 주행시간, 경로 수, 차종별 정상요금과 시간대별 할인요금을 담는 조회형 API다. 화물차 운전자나 물류업체가 '이 영업소에서 저 영업소까지 내 차종이면 통행료가 얼마고, 할인 시간대에 가면 얼마인가'를 확인하거나 운송비를 추정할 때 쓴다. 전역 조인 키는 없어 영업소 코드·명칭(dprtrTolofCd 등)이나 같은 기관(한국도로공사)의 영업소 코드를 쓰는 다른 데이터와 이름·코드를 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 전국 고속도로 영업소 간 통행요금 정보를 조회할 수 있는 OpenAPI 서비스이다.제공 항목에는 출발·도착 영업소 코드와 명칭, 고속도로운영기관 코드와 명칭, 차로별 합계거리, 주행시간(시간·분), 경로 수, 차종별 정상요금, 시간대별 할인요금 등이 포함된다.데이터는 XML과 JSON 형식으로 제공되며, 이용자는 구간 거리와 소요시간, 차종별 요금을 한 번에 확인할 수 있다.이를 통해 운전자는 최적 경로와 예상 요금을 사전에 파악하여 효율적인 이동 계획을 세울 수 있다.물류업체는 차량 종류와 시간대별 요금 변동을 고려해 운송비를 절감할 수 있으며, 공공기관은 교통 정책과 요금 체계 분석에 활용할 수 있다.정확한 요금 및 거리 정보 제공을 통해 국민 편의와 도로 이용 효율성 향상에 기여한다.
