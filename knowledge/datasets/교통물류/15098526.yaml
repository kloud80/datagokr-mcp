summary_user: 출발·도착 공항을 기준으로 국내선 항공편의 출발·도착 예정 시각 등 운항 목록을 조회하는 API로, 국내 공항 목록과 항공사 목록 조회 오퍼레이션을 함께 제공하며 검증 호출에서는 전국 범위 28행을 받았다. 여행자나 이동 계획을 세우는 사람이 '오늘 김포에서 제주로 가는 국내선은 몇 시에 어떤 항공사 편이 있나'를 확인하는 데 쓴다. 공항ID(airportId)가 공항코드(airport_cd) 조인 키이므로, 먼저 공항 목록에서 코드를 받아 운항정보 조회의 출발·도착 공항 파라미터에 넘기고 다른 공항코드 기반 항공 데이터와도 잇는다.
description_portal: 출/도착지를 기준으로 국내선 항공운항정보를 조회하는 국내항공운항정보 서비스이며, 항공운항정보 목록, 공항목록, 항공사 목록조회가 가능하다. 출발지와 도착지를 기준으로 국내선 항공 운항 정보를 조회할 수 있는 국내항공운항정보 서비스입니다. 본 서비스는 이용자가 선택한 출발 공항과 도착 공항을 기반으로 해당 구간을 운항하는 국내선 항공편의 운항 정보 목록을 제공하며, 항공편의 출발 시간, 도착 예정 시간 등 기본적인 운항 현황을 확인할 수 있도록 구성되어 있습니다. 또한 국내 공항 목록과 항공사 목록 조회 기능을 함께 제공하여, 항공편 검색 및 관련 정보 확인 시 활용할 수 있다. 이를 통해 이용자는 국내선 항공 운항 현황을 종합적으로 파악하고 이동 계획 수립에 참고할 수 있습니다.또한 한번에 출력되는 데이터 목록수를 설정할수 있으며, 페이지 번호를 설정하여 전체 데이터를 분할하여 호출이 가능합니다. TAGO 연계현황및 기술자료는 http://www.tago.go.kr에서 확인이 가능합니다.데이터 활용 추가 문의사항은 TAGO 운영팀(054-459-7870)으로 문의 바랍니다.
