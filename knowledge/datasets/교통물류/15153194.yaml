summary_user: 한국건설기술연구원이 제공하는 도로 교통량 수시조사지점 정보로, 조사연도·도로등급·노선번호·구간·차로수·시도·시군구·읍면동 위치·연평균일교통량(AVRDY_VOTR)·좌표를 지점 단위로 담고 범위는 전국이다. 교통 분석가가 특정 노선이나 구간에서 수시조사가 이뤄진 지점이 어디이고 일평균 교통량이 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시도코드·시군구명·노선번호·구간명 같은 이름·코드 매핑이나 좌표로 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시조사지점 정보입니다.\""
