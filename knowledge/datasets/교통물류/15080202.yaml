summary_user: 수원시 관내 도로 조사지점별로 수집일자·방면·수집장치에 따른 차량 통행 대수(대)를 담은 파일 데이터로, 약 9.8MB 분량의 CSV로 제공된다. 분석가나 사업자가 '수원시 특정 지점·방향의 하루 통행량이 얼마이며 날짜별로 어떻게 달라지는가'를 확인해 상권·입지 분석이나 교통 흐름 파악에 쓴다. 전역 조인 키가 없어 다른 데이터와는 수집지점 이름을 직접 매핑하거나 같은 수원시 자료끼리만 이어 쓴다.
description_portal: 경기도 수원시 관내 도로의 교통량 현황을 시민 여러분께 공개하기 위해 수집된 자료입니다. 본 데이터는 교통량 수집일자, 수집지점, 도로방향, 교통량을 측정한 수집장치, 차량 통행 대수(대) 등의 정보를 포함하고 있으며, 데이터기준일자를 함께 제공하여 자료가 어느 시점을 기준으로 작성되었는지 쉽게 확인할 수 있도록 구성되어 있습니다. 해당 자료는 도로 이용 현황을 이해하고 교통 흐름을 파악하는 데 참고 자료로 활용할 수 있으며, 시민의 교통 정보 이해와 교통 정책에 대한 관심 제고에 도움을 줄 수 있습니다.
