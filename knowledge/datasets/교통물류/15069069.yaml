summary_user: 남양주시에 등록된 자동차를 승용·승합 등 차종별로 나누고, 각 차종의 관용·자가용·영업용 대수를 특정 기준일 시점으로 집계한 시군구 단위 통계 파일(csv)입니다. 교통 정책 담당자나 분석가가 '남양주시에 등록된 영업용 화물차·승합차는 몇 대인가' 같은 질문에 답할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 다른 시군의 같은 차종별 등록 현황과는 차종 이름을 맞춰 붙이거나 같은 기관 자료끼리만 연결합니다.
description_portal: 남양주시 자동차등록(2025.12.31.기준) 현황에 대한 데이터로 승용차, 승합차 등 차종별 관용, 자가용, 영업용 등의 수 등을 제공합니다.자동차등록원부에 등록된 차량의 총 대수를 특정 시점 기준으로 집계하여 제공하는 통계 자료입니다. 이 데이터의 핵심은 차량을 법적 분류 기준인 차종별로 나누어 현황을 파악하는 것입니다.주로 행정구역별, 기간별로 차량의 누적 등록 현황 및 신규 등록/이전 등록 현황을 차종 기준으로 분류합니다. 교통 정책 수립, 산업 동향 분석, 인프라 계획 등 다양한 분야에서 핵심적인 기초 자료로 활용됩니다.
