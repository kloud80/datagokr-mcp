summary_user: 전국 지정정비사업자의 검사소명, 주소, 연락처, 대형차(5.5톤) 검사 가능 여부를 사업자 한 곳당 한 행으로 담은 파일 데이터로, 검증 시 2,039행이 전국 범위로 수신되었다. 자동차검사를 받으려는 국민이나 안내 서비스 운영자가 내 지역에서 대형차 검사가 되는 지정정비 검사소가 어디인지 찾는 데 쓴다. 조인 키는 주소(address) 하나뿐이어서 다른 지점·지역 데이터와는 주소 매칭으로 잇고, 사업자번호나 차량등록번호 같은 키는 이 파일 필드에 없다.
description_portal: 자동차관리법제43조(자동차검사), 자동차관리법제69조(자동차관리업무의 전산처리), 자동차종합검사의 시행 등에 관한규칙과 관련 전국(종합)지정정비사업자 등록 현황입니다.(종합검사지정정비사업자인지 정기검사지정정비사업자인지 구분은 안됩니다.)전국 지정정비사업자의 검사소명 및 주소를 알 수 있으며 연락처 및 대형차(5.5톤) 검사가 가능한 검사소인지 파악할 수 있는 자료입니다.지정정비사업자 등록 현황은 2026년 6월 30일 기준 자료입니다. 지정정비사업자 자동차검사소 안내를 위해 사용 할 수 있는 자료입니다.
