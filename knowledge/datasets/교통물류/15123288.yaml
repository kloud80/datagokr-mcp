summary_user: 교통영향평가에서 조사한 유사시설별 주차발생 원단위를 담은 전국 단위 파일(CSV 약 2MB)로, 시설마다 조사일·규모(세대수·연면적)와 평일·주말 첨두주차대수, 평일·주말 주차원단위를 한 행씩 기록한다. 신규 건물·사업의 교통영향평가나 주차계획을 세우는 사업자·분석가가 '비슷한 규모의 시설은 평일과 주말 첨두에 주차가 몇 대 발생하는가'를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 유사시설명이나 같은 기관 내부 식별자(유사시설아이디)로만 이어 쓸 수 있다.
limits: 표준 행정코드나 위치 정보가 없는 비공간 데이터라 지역별 집계나 지도 결합은 바로 하지 못하고, 시설명 매칭이 필요하다. 사용여부·승인여부 필드가 있으므로 분석 전에 이 값으로 유효한 행을 걸러야 한다.
