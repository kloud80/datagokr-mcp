summary_user: 가해운전자의 법규위반 유형(신호위반, 중앙선침범 등)과 주간(06~18시)·야간(18~06시)별로 전국 교통사고 건수와 사망자·중상자·경상자·부상신고자 수를 담은 연간 집계 통계로, 경찰이 처리한 인적 피해 사고만 포함한 소규모 CSV 파일이다. 교통안전 분석가나 정책 담당자가 '야간에 어떤 법규위반이 사망사고로 이어지는 비중이 높은가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법규위반 유형명·주야 구분 같은 이름 매핑이나 같은 기관(교통사고분석시스템 TAAS)의 다른 통계와 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 단위 비공간 집계라 지역·지점·도로 링크 단위 분석은 할 수 없고, 표준노드링크 등 공간 데이터와 직접 조인할 키가 없다. 포털 설명상 2021년 통계부터 과속이 법규위반 항목에서 빠져 별도 집계되므로 연도 간 비교 때 주의해야 한다.
