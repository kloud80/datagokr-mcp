summary_user: 수원시 어린이보호구역마다 한 건씩, 고시 정보(고시일·고시번호·구간)와 행정동·법정동, 주소·위경도, 그리고 보호구역 표지·노면표시·미끄럼방지포장·주정차금지 표지·방호울타리·주정차단속 CCTV 같은 교통안전시설의 방향별 수량을 담는다. 학부모나 지역 분석가가 "우리 동네 초등학교 앞 보호구역에 단속 CCTV와 보행자 방호울타리가 설치돼 있는가"를 확인하거나, 관할 구청·경찰서별로 시설이 부족한 구역을 찾는 데 쓴다. 전역 조인 키는 없어서 행정동·법정동 이름, 주소, 위경도 좌표로 다른 수원시 교통·학교 데이터와 공간·이름 매칭으로 잇는다. 행안부 기준 일련번호(mois_sn)는 행안부 어린이보호구역 표준데이터와 대조하는 단서가 될 수 있다.
description_portal: 경기도 수원시 어린이보호구역별 교통안전시설 현황에 대한 데이터로 시설현황, 위치정보, 교통안전시설 정보를 포함한 데이터입니다. 어린이보호구역은 어린이의 교통사고를 예방하고 안전한 통학 환경을 조성하기 위해 지정한 특별보호구역입니다. 이에 따라 지차제는 보호구역 내 교통안전시설 설치를 의무화하고 있으며, 이와 관련된 시설 현황을 체계적으로 관리 및 제공하기 위해 어린이보호구역별 교통안전시설 데이터를 관리하고 있습니다. 공공데이터포털을 통해 어린이보호구역 내 설치된 교통안전시설물의 위치, 종류 등 상세한 정보를 참고하여 주시기를 바랍니다.
