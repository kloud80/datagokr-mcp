        required: false
        example: 권선동
        desc: 필터 값
      - name: type
        required: false
        example: xml
        desc: 데이터 타입
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
