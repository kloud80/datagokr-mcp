description_portal: 본 데이터는 해양수산부가 전국 항만의 예산 운영 현황을 체계적으로 관리하기 위해 수집한 자료입니다.주요 내용으로는 항만 건설 사업과 관련된 항목별 예산 정보, 회계코드, 연도별 예산 금액, 관리기관, 예산 프로그램, 단위사업, 세부사업 및 세목 등이 포함되어 있습니다.2017년부터 2025년까지의 연도별 자료를 제공하며, 이를 통해 항만별 예산 집행 현황과 연도별 변동 추이를 확인할 수 있습니다.본 데이터는 중앙정부 및 지방자치단체의 항만 재정 계획 수립, 예산 편성 및 검토, 사업별 예산 집행 관리 등 행정 업무에 활용될 수 있으며, 항만 개발 및 관리와 관련된 연구, 회계 감사, 정책 분석 및 평가 자료로도 활용 가능합니다.
