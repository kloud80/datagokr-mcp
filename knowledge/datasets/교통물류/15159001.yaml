summary_user: 전주시 시내버스의 노선별 기본정보(노선번호·기점·종점·방향)와 첫차·막차 시각, 배차간격, 평균소요시간, 운행 버스대수, 노선길이를 노선 단위로 담는 조회 API다. 시민이나 교통 분석가가 '이 노선의 첫차·막차는 몇 시이고 배차간격은 얼마인가'를 확인하거나 노선 운영 현황을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선번호(brtId)·노선ID 같은 같은 기관 내부 코드나 이름 매칭으로만 이어 쓴다.
description_portal: 전주시 버스 운행과 관련된 다양한 노선 정보를 종합적으로 조회할 수 있는 서비스입니다. 노선번호, 기점명, 종점명, 노선 방향 등 기본적인 노선 정보를 비롯하여 노선별 경유 정류장 목록을 확인할 수 있습니다. 또한 첫차 및 막차 시각, 평균 소요 시간, 배차 간격(점두시 및 비점두시) 등 시간표 관련 상세 정보를 제공하며, 토요일 및 일요일·공휴일 감회 운행 시간표도 함께 조회할 수 있어 요일별 운행 현황 파악이 가능합니다. 아울러 운행 버스 대수, 총 운행 횟수, 노선 길이 등 운영 현황 정보와 함께 저상버스 운행 여부를 확인할 수 있어 교통 약자 및 휠체어 이용자를 포함한 시민 누구나 보다 편리하게 대중교통 정보를 활용할 수 있습니다.
