description_portal: 해당 데이터는 호출부호와 선박명을 기준으로 인천항에 입항하는 선박의 제원 상세 정보를 Open API 형태로 제공합니다. 요청 변수에는 callLetter(호출부호), vsslKorNm(선박명) 등이 있으며, 응답 결과에 따라 선박 번호(vsslNo), 한글 및 영문 선박명(vsslKorNm, vsslEngNm), 국적코드(flag, flagNm), 선박의 총톤수(grsTn), 규칙톤수(intTn), 순톤수(netTn), 선박 제원(크기, 너비, 길이, 깊이, 흘수, 용적) 등의 데이터가 포함되며 항만운영시스템(POS), 해양안전관리, 선박 입출항 계획 수립, 항만시설 운영 최적화 등 다양한 분야에서 활용되며, 실시간 선박 특성 분석 및 선박 관련 통계 구축에도 유용한 자료로 활용됩니다.
