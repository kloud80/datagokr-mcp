    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '1'
        desc: 줄수
      - name: callLetter
        required: true
        example: DSEG8
        desc: 호출부호
      - name: vsslKorNm
        required: false
        desc: 선박명(한글명)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
