summary_user: 인천항에 입항하는 선박의 제원을 선박 한 척 단위로 담는 API로, 호출부호나 선박명으로 조회하면 선박번호·IMO 번호·국적·선종·내외항 구분과 총톤수·국제총톤수·순톤수, 길이·너비·깊이·흘수, 대리점(업체) 정보를 돌려준다. 해운·항만 분석가나 대리점 실무자가 "이 호출부호의 선박은 몇 톤급이고 흘수가 얼마인가" 같은 질문으로 선석 배정이나 입출항 계획의 선박 특성을 확인할 때 쓴다. IMO 번호(imoNo)와 선박번호(vsslNo)가 선박 식별 키여서 입출항 실적·선박 등록 원장 등 다른 선박 데이터와 이어 쓴다.
limits: 호출부호·선박명 기준 조회라 전체 선박 목록을 한 번에 받는 용도에는 맞지 않는다. 개발계정은 하루 10,000회로 호출이 제한된다. 해양 안전·PSC·선원 정보는 이 데이터 범위에 들지 않는다.
