description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 공항 중 국제선 기능이 있는 김포공항, 김해공항, 제주공항, 대구공항, 무안공항, 양양공항, 청주공항의 시간대별 여객실정 정보를 제공합니다.해당 데이터를 통해 어느 시간대에 여객이 많이 공항에 오는지 알 수 있습니다.추가 문의사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
