summary_user: 한국공항공사가 운영하는 국제선 공항(김포·김해·제주·대구·무안·양양·청주)의 국제선 여객 실적을 연도·공항·노선·시간대별 도착·출발 여객수로 담은 집계 파일(CSV, 약 9.7KB)이다. 공항 이용자나 공항 주변 사업자·분석가가 '이 공항 국제선은 어느 시간대에 도착·출발 여객이 몰리는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 항공통계와는 공항명·노선명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
limits: 공통 코드(공항코드 등)가 없어 다른 데이터와 붙이려면 공항·노선 이름을 직접 매핑해야 한다. 인천국제공항은 한국공항공사 운영 대상이 아니어서 포함되지 않고, 행정구역 단위의 공간 분석에는 쓸 수 없다.
