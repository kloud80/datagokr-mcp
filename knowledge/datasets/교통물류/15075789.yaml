description_portal: 이 데이터는 제주특별자치도가 제공하는 “어린이보호구역 내 교차로” 현황 자료입니다. 보호구역 안 또는 인근에 위치한 교차로의 도로명, 위도·경도, 차로 수, 교차 형태(삼거리, 사거리 등) 및 보행자 보호시설 유무 등의 정보가 기록되어 있으며, 해당 지역의 교통 흐름과 보행자 안전 여건을 종합적으로 파악할 수 있도록 구성되어 있습니다. 이 정보는 스쿨존 내 어린이 보행 안전 진단, 위험 교차로 식별, 횡단보도·신호등 설치 필요 구간 선별, 교통 흐름 재구조화 등 보행 환경 개선 및 안전 정책 수립을 위한 기초자료로 활용될 수 있습니다.
