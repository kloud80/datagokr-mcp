description_portal: 본 데이터는 보행 중 스마트폰 사용으로 인한 사고를 예방하고 야간이나 우천 시 시인성을 확보하기 위해 횡단보도 대기선 바닥에 설치된 LED 보행신호등 정보를 제공합니다. 본 데이터는 시설물이 설치된 구체적인 위치 명칭과 함께 도로명 주소 및 지번 주소를 병행 표기하여 위치 정보의 정확성을 높였으며 위도와 경도 좌표를 통해 디지털 지도상에서의 정밀한 확인이 가능하도록 구성되었습니다. 특히 각 시설물의 설치 연월 정보가 포함되어 있어 노후도 파악 및 유지 보수 주기를 체계적으로 관리할 수 있으며 관리 기관명과 비상 연락처를 명시하여 고장 신고 및 현장 대응의 효율성을 극대화했습니다. 바닥신호등은 시선이 아래로 향해 있는 보행자들에게 신호 상태를 직관적으로 전달함으로써 교통사고를 획기적으로 줄이는 스마트 교통 행정의 결과물입니다.
