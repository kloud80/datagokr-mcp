summary_user: 서울특별시 동대문구 횡단보도 대기선 바닥에 설치된 LED 바닥신호등을 시설물 한 곳당 한 행으로 담은 파일로, 위치명·도로명·지번 주소·위도경도·설치 연월·관리기관과 연락처가 들어 있다. 보행자 안전 분석가나 구청 담당자가 '동대문구 어느 횡단보도에 바닥신호등이 있고, 설치한 지 오래된 곳은 어디인가'를 확인하는 데 쓴다. 공통 조인 키는 없어 주소 문자열이나 위도·경도 좌표로 횡단보도·보호구역·교통사고 위치 데이터와 공간 매칭해 이어 쓴다.
