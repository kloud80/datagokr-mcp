summary_user: 한국공항공사가 운영하는 전국 공항(인천국제공항 제외)의 여객 실적을 연도·공항·노선·정기/부정기 구분별로 성인·유아 출발·도착 인원으로 나눠 담은 집계 통계 파일로, 실측 파일 크기는 2,352바이트입니다. 지역 관광·출장 수요를 보려는 분석가나 지자체가 '어느 지방공항의 어떤 노선 여객이 연도별로 늘었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 항공통계(화물·운항 실적)나 공항코드 자료와는 공항명·노선명을 이름으로 맞춰 연결한다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 전국공항의 공항별 여객실적 정보를 제공합니다.해당 데이터는 공항, 노선, 정기/부정기 여부, 여객성인 출발/도착 수, 여객유아 출발/도착 수 등의 통계자료로 이루어져 있습니다.추가 문의사항 또는 요구사항 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
