summary_user: 경기도 시군별 일반화물자동차 운송사업 업체의 인허가 정보를 업체(사업장) 한 건 단위로 담으며, 사업장명·인허가일자·영업상태·폐업일자·자본금·면허 유효기간과 주소·좌표를 포함한다. 물류 분석가나 사업자가 '경기도 어느 시군에 허가받은 일반화물 운송사가 몰려 있고 지금도 영업 중인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드·시군명(SIGUN_CD)이나 사업장명·주소 매칭으로만 다른 데이터와 잇고, 전국 기준 확인은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 일반화물(운송사업)업체 현황 데이터는 경기도 31개 시군에서 유상 화물운송을 위한 요건(5대 이상의 화물자동차, 일정 자본금, 시설기준)을 충족한 업체들의 인허가 정보를 포함합니다. 이 데이터는 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 면적, 등록일자, 자본금, 소유형태, 업체유형, 면허정보(시작일, 종료일, 발급일자), 지정정비업종 코드 및 명칭, 주소정보(도로명, 지번), 우편번호, 위도·경도 등으로 구성되어 있으며, 화물운송 산업의 구조 분석, 물류정책 수립, 지역 기반의 운송업체 분포 파악 등에 활용될 수 있습니다. 본 데이터는 2018년 9월 6일 이후 갱신이 중단되었으며, 최신 현황은 별도 채널에서 확인해야 합니다.
