summary_user: 시군구(SIGNGU_NM)·기준일(STD_DE)별로 승용·승합·화물·특수 차량의 등록 대수를 관용·자가용·영업용으로 나눠 담은 집계 자료이며, 용도별 합계와 전체 등록 대수도 함께 들어 있다. 지역별 영업용 화물차 비중이나 자가용 승용차 등록 규모를 비교해 교통·물류·환경 정책의 기초 수치를 잡으려는 분석가와 공무원이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름을 행정코드에 매핑하거나 같은 기관의 자료와 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 전국 시군구 단위로 집계된 자동차 등록 현황 자료로, 승용, 승합, 화물, 특수 등 차량의 종류별 등록 대수를 관용, 자가용, 영업용으로 세분화하여 제공합니다. 각 차종별 세부 등록수와 함께 용도별 총계 및 전체 등록 대수가 포함되어 있어, 지역별 자동차 분포 특성과 이용형태를 종합적으로 분석할 수 있습니다. 데이터는 지역 교통량 추산, 인프라 구축, 자동차산업 동향 파악, 환경정책 설계, 물류체계 개선, 도시계획 등 다양한 정책과 연구의 기초자료로 활용될 수 있습니다. 또한 다양한 차종 간 비율 비교를 통해 교통 정책의 우선순위 설정 및 차량 관련 세제 설계에도 활용이 가능합니다.
