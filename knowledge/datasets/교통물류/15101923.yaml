summary_user: 고속도로 졸음쉼터별로 노선·방향·쉼터 이름과 시간대마다 들어온 교통량을 담은 파일 데이터로, 총합계와 1종~12종 차종별 대수를 함께 기록한다. 도로 운영 담당자나 분석가가 어느 졸음쉼터가 몇 시에, 어떤 차종으로 가장 붐비는지 확인해 쉼터 확충이나 졸음운전 예방 대책의 우선순위를 정하는 데 쓴다. 공통 조인 키는 없어서 다른 데이터와는 노선명·방향·쉼터 명칭을 이름으로 맞추거나 같은 한국도로공사 데이터의 코드로만 이어 쓴다.
