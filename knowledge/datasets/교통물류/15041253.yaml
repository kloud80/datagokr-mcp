summary_user: 경의중앙선 각 역의 화장실을 한 행씩 담은 목록으로, 역명·지상/지하 구분·역층·개찰구 안팎(게이트내외)·출구번호·상세위치·화장실 구분을 담는다(CSV 약 8KB 규모의 소규모 파일). 지하철 이용객이 '가려는 역의 화장실이 개찰구 안에 있는지 밖에 있는지, 몇 번 출구 쪽인지'를 확인하거나, 교통약자 안내 서비스를 만드는 개발자가 역별 화장실 위치를 안내하는 데 쓴다. 전역 공통 조인 키(역 코드)가 없어 다른 노선 화장실·역 정보 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 연결해야 한다.
limits: 역 코드 같은 표준 키가 없어 역명 표기 차이가 있으면 다른 데이터와 자동으로 맞지 않는다. 경의중앙선 한 노선만 담으므로 환승역의 다른 노선 화장실 위치는 이 데이터로 알 수 없다.
