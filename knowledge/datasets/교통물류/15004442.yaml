summary_user: 광진구시설관리공단이 운영하는 공영주차장을 주차장 한 곳당 한 행으로 담은 현황 파일로, 주차장명·형태·운영방식·위치·주차면수·유무료 구분·급지·시간당 및 전일 요금·월 정기권·요일별 운영시간을 담는다(csv 약 2.5KB의 소규모 파일). 광진구 주민이나 방문자가 근처 공영주차장의 요금, 월 정기권 가격, 주말 운영 여부를 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어, 전국주차장정보표준데이터 같은 원장과는 주차장명·위치를 이름으로 맞춰 이어 써야 한다.
limits: 이 파일은 현황 원장이고 실시간 주차 가능 대수는 담지 않는다. 실시간 정보는 지자체·공단별 비표준 API로 따로 찾아야 한다. 자체 관리번호는 전국 표준 주차장관리번호와 같다는 근거가 없어 조인 키로 바로 쓰지 않는다.
