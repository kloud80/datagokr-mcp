summary_user: 김포시 도로점용(굴착) 허가를 건별로 담은 파일로, 허가번호·허가일자·점용종료일·점용목적·위치와 점용 길이·폭·관경(미터)을 기록한다. 김포시에서 어느 도로에 어떤 목적의 굴착·점용 공사가 언제까지 잡혀 있는지 확인하려는 주민·사업자, 또는 공사 이벤트 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(주소 문자열)를 이름 매칭하거나 같은 김포시 자료끼리만 이어 쓴다.
limits: 표준 행정코드나 좌표 같은 조인 키가 없어 지도·타 지자체 자료와 바로 붙이기 어렵고, 위치 텍스트를 직접 매칭해야 한다. 명세상 연간 갱신이므로 최근 허가가 바로 반영되지 않을 수 있다.
