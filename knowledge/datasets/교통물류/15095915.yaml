summary_user: 대구광역시 북구에 등록된 중고 자동차매매업 사업체를 건별로 담으며, 구분·사업체명·주소·연락처·공개 여부 등을 제공한다. 북구에서 중고차를 사거나 팔려는 주민이 '우리 동네에 등록된 중고차 매매상이 어디에 있고 연락처는 무엇인가'를 확인하는 데 쓰거나, 분석가가 지역 매매업체 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업체명이나 주소를 매핑하는 방식으로만 이어 쓴다.
