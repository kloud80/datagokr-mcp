description_portal: 이 데이터는 해양수산부에서 항만건설사업에 참여하는 기술자 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 항만건설관련 사업의 참여기술자별 참여사업명, 계약명, 발주청, 참여 기술자의 성명, 담당 분야, 소속 업체, 직급, 참여 시작일, 참여 종료일 등으로 구성되어 있습니다. 기술자 성명 및 기타 개인정보는 비식별화 처리 되었습니다.  본 데이터는 항만건설사업 기술자들의 프로젝트 참여 이력 관리, 기술자 인력풀 유지, 사업별 기술자 배치 현황 분석, 관련 업체의 인력 운용 현황 파악 및 공공 발주 사업의 기술자 인력 등록·관리업무 등에 활용될 수 있습니다.
