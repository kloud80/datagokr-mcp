summary_user: 광양항 배후단지에 입주한 기업별로 구역, 입주면적·창고면적(제곱미터), 창고동수, 주요화물을 담은 2025년 기준 파일이며, 포털 설명상 68개 기업을 기업 단위로 정리한 현황표다. 물류기업이나 투자 검토자가 '광양항 배후단지 어느 구역에 어떤 화물을 다루는 기업이 얼마나 넓은 창고를 쓰고 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 항만 데이터와는 기업명·구역명 같은 이름 매칭이나 같은 기관(여수광양항만공사) 자료끼리만 이어 쓸 수 있고, 항만코드도 들어 있지 않다.
description_portal: 「광양항 배후단지 현황(2025)」 데이터는 총 68개 기업의 입주 현황을 정리한 자료로, 구역, 입주기업, 입주면적, 창고면적, 창고동수, 주요화물 항목으로 구성되어 있습니다. 이를 통해 광양항 배후단지의 공간 활용도와 물류 기능, 기업별 특화 화물 처리 현황을 파악할 수 있습니다.이 데이터는 배후단지의 기업 입주 현황, 물류 처리 특성, 공간 활용 구조를 종합적으로 파악할 수 있어 항만 개발 계획, 투자 유치 전략, 물류 네트워크 고도화 정책 수립에 활용될 수 있습니다.
