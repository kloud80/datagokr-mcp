summary_user: 경기도 안양시가 허가한 화물자동차운송주선사업(일반화물·이사화물 주선) 업체를 한 업체씩 담은 허가 명단으로, 인허가일자·인허가번호·영업상태·업종구분·업체명·도로명/지번주소를 포함한다. 화주나 이사를 앞둔 시민이 '이 주선업체가 안양시에서 정식 허가를 받고 지금도 영업 중인가'를 확인하거나, 분석가가 안양시 내 주선업체 분포와 휴·폐업 현황을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭으로 잇고, 전국 단위 대조는 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
description_portal: '화물운송("일반화물", "이사화물", "일반이사화물") 주선사업 허가업체 현황(시군명, 인허가일자, 인허가번호, 영업상태, 업종구분, 업체명, 도로명주소, 지번주소, 데이터기준일자) 입니다.- 업체명: 회사 이름- 사업장 주소: 도로명주소 또는 지번- 허가일자 및 허가번호: 언제, 어떤 번호로 허가받았는지- 영업상태: 현재 영업 중인지, 휴업 또는 폐업 상태인지- 업종 구분: 일반 화물인지, 이삿짐 전문인지 등- 데이터 기준일자: 공표되는 데이터 기준일자에 따름안양시에서 공식적으로 운송주선사업을 허가 받은 업체들의 명단과 관련 정보입니다.'
