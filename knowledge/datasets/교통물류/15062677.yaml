summary_user: 통영시 도시정보시스템에 등록된 교차시설을 시설 한 건씩 담은 파일로, 지형지물부호·관리번호·행정읍면동·도엽번호·도로구간번호와 위도·경도 좌표를 가진다(약 3KB 규모의 소량 CSV). 통영시 도로 관리 담당자나 교통안전 분석가가 '관내 교차시설이 어느 읍면동, 어느 도로구간에 있는가'를 지도에 찍어 확인할 때 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 도로구간번호(같은 기관 도시정보시스템 내부 코드), 위경도 좌표의 공간 매칭으로 다른 도로 시설물·사고 데이터와 이어 쓴다.
description_portal: 통영시 도시정보시스템에서는 교차시설의 위치와 특성을 명확하게 관리하기 위해 여러 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 교차시설의 위치와 기본 식별이 가능하며, 도로구간번호는 해당 시설이 연결된 도로 정보를 파악하는 데 활용됩니다. 또한 구분 ID를 통해 시설의 종류나 특성을 세부적으로 구분할 수 있습니다. 더불어 위도와 경도 좌표가 함께 제공되어 교차시설의 정확한 위치를 지도상에서 확인할 수 있어, 도로 관리, 교통안전 대책, 현장 점검 등 다양한 행정 업무에 활용되는 중요한 기초자료로 사용됩니다.
