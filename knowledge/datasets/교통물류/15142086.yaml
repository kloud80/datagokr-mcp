summary_user: 대중교통 교통카드의 구분(선불·후불·모바일 등)을 정산사업자별로 코드와 이름으로 담은 전국 단위 코드표 성격의 데이터로, 건별 이용 기록이 아니다. 교통카드 승하차·정산 데이터를 분석하는 분석가가 '이 카드구분코드가 선불인지 후불인지'처럼 코드의 뜻을 풀어 결제 방식별 이용 특성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 교통카드 이용 데이터와 정산사업자ID·카드구분코드(card_se_cd)를 이름·코드 매핑으로 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 정산사업자ID·카드구분코드를 직접 대조해야 연결된다. 지역 단위 구분이 없는 전국·비공간 자료라 이 데이터만으로 지역별 카드 사용 현황은 알 수 없다. 개발계정은 하루 1,000회 호출로 제한된다.
