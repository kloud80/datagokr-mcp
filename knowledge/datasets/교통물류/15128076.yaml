summary_user: 한국도로공사가 집행한 전자조달 계약을 건별로 담으며, 공고구분·공고번호·계약명·계약방법·계약업체·계약금액·계약부서·주관부서·계약체결일자를 제공하는 전국 단위 비공간 데이터다. 기업이나 분석가가 '특정 업체가 도로공사와 어떤 계약을 얼마에 몇 건 체결했는가', '계약방식별 비율은 어떠한가'를 확인하는 데 쓴다. 업체 식별 필드(crno)가 실측상 법인등록번호(corp_rgst_no) 키로 확인되어, 같은 키를 쓰는 법인·기업정보 데이터와 업체 단위로 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 집행하는 전자조달 계약의 공개 현황을 투명하고 체계적으로 제공하는 OpenAPI 서비스이다.제공 항목에는 공고구분코드와 명칭, 공고번호, 계약명, 계약방법, 사업자등록번호, 계약업체명, 계약금액, 계약부서명, 주관부서명, 계약체결일자 등이 포함된다.데이터는 XML과 JSON 두 가지 형식으로 제공되어 다양한 정보시스템, 분석도구, 애플리케이션에서 손쉽게 연계·가공할 수 있다.이 API를 활용하면 계약별 세부 내역과 진행 단계, 금액 규모를 실시간으로 확인하여 공공조달의 투명성과 신뢰성을 높일 수 있다.기관 내부에서는 계약 현황 모니터링, 부서별 실적 분석, 예산 집행 효율성 검토, 계약방식별 집계, 감사 대비 자료 준비 등 행정업무의 정확성과 효율성을 동시에 달성할 수 있다.외부에서는 분석기관, 학계, 언론, 기업 등이 계약 체결 건수 변화, 업체별 참여 빈도, 계약금액 분포, 계약방식별 비율과 추이를 심층 분석하여 정책 제안, 연구 보고, 경영 전략 수립, 시장 진입 전략 설계, 경쟁사 분석 등에 활용할 수 있다.
