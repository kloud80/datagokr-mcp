summary_user: 전북특별자치도 지방도의 덧씌우기(재포장) 사업 대상지를 담은 데이터로, 도로유지관리 종이대장의 2018~2021년 이력을 GIS DB로 옮긴 건별 원천 자료이며 대상지 211건이 구축되었다(기준일 2021.12.21, 주소·좌표 단위). 도로 분석가나 지역 주민이 '최근 몇 년 사이 우리 지역 어느 지방도 구간이 덧씌우기 공사를 했는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 도로명·주소 같은 이름 매핑이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: '· 데이터 공간적 범위 : 전북특별자치 지방도 · 데이터 시간적 범위 : 2018년 ~ 2021년 · 데이터 출처 : 전북특별자치 지방도 도로유지관리 종이대장 · 데이터 구축방법 : 한글, 사진, 엑셀파일로 구성되어 있는 이력정보에 대해 GIS DB(위치정보, CSV 등)로 변환· 데이터 구축결과 : 덧씌우기 대상지 정보 211건 구축 완료 · 데이터 구축업체 : (주)선도소프트 · 데이터 기준일 : 2021. 12. 21 ※ 참고사항 : 2021년 공공데이터 뉴딜 기업매칭 지원사업을 통하여 조사한 것으로 실제와 차이가 있을 수 있으며, 해당 데이터의 법적 효력은 없습니다.'
