description_portal: 본 데이터는 한국도로공사와 관련된 공사 현장에서 발생한 하도급사의 부실 시공, 계약 위반 등으로 인한 벌점 부과 현황을 정리한 자료이다. 데이터는 하도급사의 부실내용, 벌금 액수, 벌점 부과일 등의 항목으로 구성되어 있으며, 하도급사 관리 및 계약의 투명성 제고에 활용될 수 있다. 이를 통해 반복적인 위반 여부 확인, 업체 선정 기준 강화, 건설공사 품질 확보 등의 목적에 기여할 수 있다. 본 데이터는 행정 처분 이력 관리, 공공공사 하도급 관리 강화, 계약사후관리 제도 개선 등의 정책 수립을 위한 기초자료로 제공된다. 또한, 시공사의 책임 강화 및 건설 안전문화 확산에 도움이 되는 자료로서, 공공성과 실효성이 높은 정보로 평가된다.
