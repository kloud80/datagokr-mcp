summary_user: 관악구에 설치된 스마트폴을 한 기둥씩 기록한 목록으로, 유형·설치장소·위도·경도와 보안등·보행신호등·공공와이파이·CCTV·LED 비상벨·시각장애인용 음향신호기·스피커·로고젝터 탑재 여부를 담는다(CSV 파일 880바이트 규모의 소량 데이터). 구청 담당자나 분석가가 "어느 스마트폴에 CCTV나 비상벨이 없어 기능 보강이 필요한가", "스마트폴이 부족한 생활권은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 위도·경도로 지도에 올려 어린이보호구역·CCTV·보안등 같은 다른 위치 데이터와 공간적으로 겹쳐 보거나, 설치장소 이름으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 관악구에 설치된 스마트폴의 세부 구성을 확인할 수 있는 정보로, ▲스마트폴 유형 ▲설치장소 ▲위도·경도 ▲보안등 여부 ▲보행신호등 여부 ▲공공와이파이 설치 여부 ▲CCTV 설치 여부 ▲LED 비상벨 여부 ▲시각장애인용 음양신호기 여부 ▲스피커·로고젝터 탑재 여부 등의 항목으로 구성되어 있습니다. 스마트폴별 기능과 위치를 한눈에 파악할 수 있어, 안전시설 점검, 기능 개선 검토, 신규 설치 필요 지역 분석 등 기초 행정업무에 활용될 수 있습니다. 또한 어린이보호구역과 주요 도로 등 생활권 중심지의 안전 인프라 현황을 확인하는 데 참고자료로 사용할 수 있는 정보입니다.
