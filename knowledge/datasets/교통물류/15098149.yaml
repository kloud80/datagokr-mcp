summary_user: 서울시내 지하철역 출입구에 설치된 휠체어 리프트의 위치를 리프트 노드 한 건씩 담으며, 노드 좌표(WGS84, 노드 WKT)와 노드 유형, 시군구·읍면동, 지하철역 코드·이름을 함께 제공한다. 교통약자 이동 지원 서비스 개발자나 분석가가 '이 역의 어느 출입구에 휠체어 리프트가 있는가'를 확인하거나, 역세권 접근성을 분석할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 지하철역 코드·역명이나 시군구·읍면동 코드로 맞추거나 서울시 같은 기관의 역·출입구 데이터와 코드 매핑으로 연결한다.
description_portal: '서울시내 지하철역 출입구의 리프트 위치를 제공하는 서비스입니다. *용어설명 : 지하철 출입구에 설치된 리프트(lift)는 주로 교통약자(장애인, 노약자, 유모차 이용자 등)가 지상과 승강장 사이를 오갈 수 있도록 만든 승강 설비를 말함 엘리베이터와는 조금 다르고, 보통 "휠체어 리프트"라고 칭함- 좌표계는 WGS84 입니다. - 노드링크 유형, 노드 WKT, 노드 ID, 노드 유형 코드, 시군구코드, 시군구명, 읍면동코드, 읍면동명, 지하철역코드, 지하철역명 등을 제공제공부서는 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4959) 입니다.※ 바로가기 클릭 시 서울특별 열린데이터광장 개방 데이터로 이동합니다.'
