summary_user: 유가보조금관리시스템에서 버스 운송사업자에게 지급된 유가보조금을 연도별·지자체별(구분)로 나누고, 경유·CNG·수소·LPG 유종별 열로 펼친 전국 단위 집계표다. 지역별로 버스 유가보조금이 어떤 연료에 얼마나 지급됐는지, 수소·LPG 버스 지급이 언제부터 늘었는지를 보려는 분석가와 운송업계 관계자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지자체 이름을 행정구역 코드에 직접 매핑해 이어 써야 한다.
limits: 서면청구분은 빠져 있어 실제 총 지급액과 다를 수 있다. 건별·사업자별 원천이 아니라 지자체·연도·유종 집계여서 개별 노선이나 업체 단위 분석은 할 수 없다. 공통 코드가 없어 다른 데이터와 연결할 때는 이름 매핑 오류에 주의해야 한다.
