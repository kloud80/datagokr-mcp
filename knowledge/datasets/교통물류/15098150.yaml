description_portal: 서울시내 지하철역과 연계된 지하도 네트워크 위치 정보를 제공합니다. 지하철역 내부에서 이동 가능한 출입구간의 관계를 공간데이터를 통해 확인할 수 있습니다.좌표계는 WGS84 입니다. 노드링크 유형, 노드 WKT, 노드 ID, 노드 유형 코드, 링크 WKT, 링크 ID, 링크 유형 코드, 시작노드 ID, 종료노드 ID, 링크 길이, 시군구코드, 시군구명, 읍면동코드, 읍면동명, 지하철역명, 리프트, 엘리베이터 등을 제공합니다.제공부서는 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4958) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
