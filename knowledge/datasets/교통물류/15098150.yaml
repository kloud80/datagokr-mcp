summary_user: 서울시내 지하철역과 연계된 지하도 네트워크를 노드(출입구·연결점)와 링크(이동 구간) 단위로 담은 공간 원천 데이터로, 각 요소의 WGS84 좌표 형상(WKT), 링크 길이, 시작·종료 노드, 소속 지하철역과 시군구·읍면동, 리프트·엘리베이터 정보를 포함한다. 교통약자 동선을 설계하는 분석가나 보행 길찾기 서비스 개발자가 '이 역 출입구에서 저 출입구까지 엘리베이터로 이어지는 지하 경로가 있는가, 거리는 얼마인가'를 확인하는 데 쓴다. 실측상 전역 공통 조인 키는 확인되지 않아, 다른 데이터와는 지하철역명·역코드(SBWY_STN_CD)나 시군구·읍면동 코드·이름을 매핑해 역 마스터·행정구역 데이터와 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr)에서 별도 발급한 인증키가 필요하며, 공공데이터포털 활용신청과는 별개다. 전역 조인 키가 없어 다른 기관 데이터와 연결할 때는 이름이나 코드 매핑을 직접 해야 한다.
