summary_user: 광양항을 드나든 컨테이너 차량의 운송 실적을 일자별 수입·수출 차량 대수로 나눠 담은 집계 파일이며, 포털 CSV 크기는 665바이트로 한 달 안팎 분량의 작은 자료입니다. 항만 물류 분석가나 교통 정책 담당자가 '광양항 컨테이너 차량 운송에서 수출과 수입 비중이 날마다 어떻게 달라지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자 기준으로 맞추거나 같은 기관(여수광양항만공사)의 다른 항만 물동량 자료와 이름으로만 이어 쓴다.
