summary_user: 부산시 자전거 보관대에 설치된 공기 주입기의 설치장소, 구군명, 주입기 구분과 대수, 설치비용 정보를 설치 지점별로 담는 API이며 범위는 부산시 전체, 행정단위는 구·군입니다. 자전거 이용자가 '우리 구에서 바퀴 바람을 넣을 수 있는 곳이 어디인가'를 찾거나, 분석가가 구·군별 주입기 설치 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 구군명(gugun)이나 설치장소 이름을 매핑해 공공자전거 대여소·자전거도로 등 다른 자전거 데이터와 이어 쓴다.
limits: 실측 컬럼에 표준 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름 매핑으로만 연결되므로 표기 차이에 주의해야 한다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
