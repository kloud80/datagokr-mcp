summary_user: 인천광역시 미추홀구 안에서 시민에게 개방 중인 부설주차장을 건물 단위로 담은 파일로, 건물명·도로명 주소·위도·경도와 전체 주차면수, 개방 주차면수가 들어 있습니다(약 3KB 규모의 소량 csv). 미추홀구 주민이나 방문자가 "우리 동네에서 교회 등 건물 부설주차장 가운데 개방된 곳은 어디이고 몇 면을 쓸 수 있나"를 미리 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 좌표나 주소·건물명 매칭으로 잇고, 주차장 원장 성격의 전국주차장정보표준데이터와는 위치 기준으로 대조해 쓴다.
limits: 주차장관리번호 같은 공통 키가 없어 다른 주차장 데이터와 정확히 연결되지 않고, 이름·주소·좌표 매칭에 기대야 한다. 실시간 주차 가능 대수는 담지 않으므로 현재 빈자리 여부는 알 수 없다. 범위는 미추홀구 한 곳뿐이다.
