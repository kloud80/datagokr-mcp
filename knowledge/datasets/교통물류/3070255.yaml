description_portal: 여수·광양항 입출항 선박에 대한 외내항별, 국적별 입출항선박척수 및 선박톤수합에 대한 데이터입니다. 연도, 입항선박척수(국적선, 외국적선, 내항선), 출항선박척수(국적선 외국적선, 내항선), 입항선박톤수합(국적선, 외국적선, 내항선), 출항선박톤수합(국적선, 외국적선, 내항선)으로 구성되어 있습니다. 갱신주기는 연간입니다.이 데이터는 여수광양항의 해운 구조를 보여주는 핵심 지표로, 외국선 중심의 국제 교역 의존도가 높다는 점과 함께 내항선의 빈번한 운항이 지역 물류 순환을 뒷받침하고 있음을 확인할 수 있습니다. 이를 통해 항만 물류 정책 수립, 선박 접안 능력 검토, 국적선 경쟁력 강화 방안 마련 등 다양한 활용이 가능합니다.
