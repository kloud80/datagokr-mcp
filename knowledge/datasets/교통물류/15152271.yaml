summary_user: 2024년 전라남도 장흥군 관내 횡단보도 주변 불법주정차 신고를 건별로 담은 파일(csv, 약 2.7KB)로, 신고일시·신고위치·위반구분·과태료 부과 여부가 들어 있다. 군청 담당자나 분석가가 '장흥군에서 횡단보도 불법주정차 신고가 어느 위치에 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 신고위치의 주소·지명을 맞추거나 같은 기관(장흥군) 데이터끼리 이름으로만 연결한다.
limits: 장흥군 한 개 시군구만 다루므로 다른 지역과의 비교나 전국 집계에는 쓸 수 없다. 표준 행정코드나 좌표가 없어 위치 분석을 하려면 신고위치 문자열을 직접 주소 매칭해야 한다.
