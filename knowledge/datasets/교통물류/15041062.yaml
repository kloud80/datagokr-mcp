summary_user: 수인선 역에서 다른 노선으로 갈아탈 때의 환승 정보를 역·환승노선별 행으로 담은 파일로, 운영기관·노선·역명과 환승 대상 운영기관·노선, 환승 기점·이후 역, 갈아타기 편한 차량 순서와 출입문 번호를 담는다(전체 592바이트의 소규모 CSV). 철도 이용자나 길찾기 서비스 개발자가 '수인선 이 역에서 다른 노선으로 빨리 갈아타려면 몇 번째 칸 몇 번 문에 타야 하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 역명·노선명을 다른 역 마스터나 환승·출입구 데이터의 이름과 맞춰 연결해야 한다.
description_portal: 한국철도공사에서 운영하는 역사들의 환승정보 데이터로 철도운영기관명, 선명, 역명, 환승철도운영기관, 환승선명, 환승이후역명, 환승기점역명, 차량순서, 차량출입문번호의 데이터가 있습니다.도시철도 및 철도에서 다른 노선으로 열차를 갈아탈 수 있도록 만든 역을 말한다.대개 기존에 지어진 노선 근처에 역을 만들어 환승하는 경우에만 해당되지만, 넓은 의미에서 보면 철도의 경우는 급행에서 완행으로 다른 급의 열차를 타거나 도시철도와 마찬가지로 노선이 직결되지 않아서 어쩔 수 없이 갈아타는 경우가 있다. 또한 다른 교통수단으로 갈아타는 것이 가능한 역도 이 범주에 들어간다.환승역 사이를 오갈 때 개찰구를 통과하지 않고 다른 승강장으로 갈 수 있으면 직접환승이라고 하고, 반드시 하나 이상의 개표구를 통과 해야하면 간접환승이라고 한다. 환승통로의 유무는 직접환승-간접환승을 가리는 기준이 아니다. 두 승강장의 운임구역 분리가 간접환승의 기준이다. 환승통로가 있어도 두 역의 운임구역이 별개라 개찰구를 통과해야 하면 간접환승이다. 환승통로에 환승전용 개찰구가 있는 간접환승은 환승 게이트라고 한다. 즉, 환승게이트는 환승통로 양 쪽의 두 개표기를 하나로 통합한 것이다. 단, 환승 게이트 방식은 직접환승으로 보는 관점도 있다.
