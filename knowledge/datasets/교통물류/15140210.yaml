summary_user: 경기도 양평군에 고시된 농어촌도로(면도·이도·농도)를 노선 단위로 담은 파일로, 노선명·노선번호·도로종류·노선지정일자·기점과 종점 지번주소·노선연장(km)을 한 행씩 제공한다. 양평군 읍면 지역에서 특정 마을이나 경작지로 이어지는 농어촌도로가 어느 노선이고 어디서 어디까지 얼마나 되는지 확인하려는 주민·분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기점·종점 지번주소를 주소 매칭하거나 노선명·노선번호로 같은 기관 자료와 맞춰 이어 쓴다.
limits: 표준 코드 형태의 조인 키가 없어서 다른 도로·행정 데이터와 붙이려면 주소나 이름을 매핑해야 한다. 범위가 양평군 한 곳뿐이라 다른 시군의 농어촌도로는 담지 않는다.
