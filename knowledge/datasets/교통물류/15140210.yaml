description_portal: '농어촌도로는 도로법에 규정되지 않은 읍면지역의 도로 중 농어촌 주민의 교통 편익과 생산,유통 활동에 공용되는 공로로, 농어촌도로 정비법에 따라 고시된 도로를 말합니다.근거법으론 농어촌도로 정비법이며, 터널,교량,도선장,옹벽,암거,용,배수관 등 도로와 하나가 되어 효용을 다하는 시설도 포함됩니다.도로의 효용을 다하게 하는 시설 또는 인공구조물을 포함합니다.종류로는 면도: 군도 이상의 도로와 연결되는 읍면지역의 기간 도로입니다.이도: 군도 이상의 도로 및 면도에서 갈라져 마을 간이나 주요 산업단지 등과 연결되는 도로입니다.농도: 경작지 등과 연결되어 농어민의 생산활동에 직접 공용되는 도로입니다.관련 개념으로, 공도는 행정권이 일반교통용으로 제공하는 도로로, 도로법 도로와 도시계획법 도로 및 농어촌도로 정비법에 의한 농어촌 도로 등이 포함됩니다.경기도 양평군에 위치한  농어촌도로에 대한 데이터로 노선명, 노선번호, 도로종류, 노선지정일자, 기점위치지번주소 및  종점위치지번주소를 제공합니다.'
