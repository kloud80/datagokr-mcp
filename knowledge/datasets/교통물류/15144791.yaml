description_portal: 이 정보는 안산시 도로에 설치된 VMS(Variable Message Sign) 전광판의 표출 양식 내 도형 요소의 위치 좌표를 나타낸 자료로, 도형 고유번호, 양식 고유번호, X좌표, Y좌표 등 총 4개 항목으로 구성됩니다. 이 정보는 메시지 표출 화면 구성 요소의 위치 정렬, 도형 기반 콘텐츠 시각화, 표출 이미지 자동 생성 등에 활용됩니다. 또한 VMS 양식의 표준화, 시각정보의 좌표 기반 자동 배치, 시점별 콘텐츠 최적화에 필요한 기초자료로 기능합니다. 특히 메시지 요소의 공간 배치 분석, VMS 전광판별 맞춤형 콘텐츠 레이아웃 설계, 시각적 가독성 확보 등에도 활용됩니다. 이 정보는 시각 중심의 교통정보 제공 품질 향상을 위한 레이아웃 평가 연구 자료로도 활용됩니다.
