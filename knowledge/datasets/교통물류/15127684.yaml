summary_user: 경상북도 영천시 버스 정류소마다 한 행씩, 위치(법정동·도로명·지번주소)와 쉘터 유형, 정류소안내기·온열체어·에어커튼·조명등·공공와이파이·비상벨의 설치 여부와 설치년도, 설치업체를 담은 시설 현황 파일이다. 시민이나 교통 담당자가 "우리 동네 정류장에 온열의자나 비상벨이 있는지, 몇 년에 설치됐는지"를 확인하거나 노후·미설치 승강장을 골라 개선 대상을 정하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 정류소 ID나 정류소명·주소를 기준으로 정류장 원장이나 버스 도착정보와 직접 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 경상북도 영천시의 버스 승강장 현황을 상세하게 기록한 자료입니다. 영천시 내 각 버스 정류소의 위치, 설치 년도, 설치 업체, 쉴터 유형, 조명등, 온열 체어, 에어커튼 등 다양한 시설 현황과 관련 정보를 포함하고 있으며, 승객 안전과 편의를 위한 시설 현황 파악에 유용하게 활용될 수 있습니다. 본 데이터는 정류소 별 법정동, 도로명주소, 지번주소, 쉴터 유형, 설치년도, 설치업체, 안내기 설치 여부, 통신사 유형, 통신유형, 온열체어, 에어커튼 등 세부 항목으로 구성되어 있어, 영천시의 교통 인프라 개선 및 정책 수립에 중요한 기초 자료로 활용됩니다. 또한, 정류소 위치와 시설 현황을 체계적으로 정리하여 사용자들이 쉽게 검색하고 이해할 수 있도록 하였습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 교통행정과로 연락주시기 바랍니다.
