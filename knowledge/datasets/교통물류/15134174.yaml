description_portal: 세종도시교통공사 버스운영사업과 관련한 운송부대시설에 대한 현황 데이터입니다. 2025년 6월 30일 기준입니다. 현재 공사에서 운영중인 노선은 바로타(BRT, 간선급행버스체계, 노선번호 B0, B2, B4, B5, B6), 시내버스(광역 노선번호 1004, 1005, 신도심 노선번호 203, 205, 221, 52, 53, 61, 611, 조치원,부강,신탄진,병천 노선번호 11, 12, 13, 300, 910, 18), 마을버스(금남면, 연기면, 연동.부강면, 연서면, 전동면, 소정.전의면), 두루타(DRT, 수요응답형교통체계, 읍면지역 운행), 기타(시티투어 운행용 2층버스)로 구분됩니다. 운송사업과 수반되는 차고지, 사무실, 승무사원 휴게시설과 부대사업 운영과 관련하여 CNG 충전소(CNG 충전소 운영사업) , BRT 정류장 관제센터(정류장 시설관리사업), 조치원버스터미널(조치원 공영버스터미널 운영사업), 공영자전거 운영센터(공영자전거 어울링 운영), 세종 교통약자 이동센터(장애인콜택시 누리콜 사업) 등 운송부대시설을 운영하고 있습니다. 시설에 따른 위치, 면적, 세부시설 정보 등을 작성하였습니다.
