summary_user: 진주시 버스정보시스템의 시내버스 월별 운행통계를 연월·차량번호·노선아이디별 운행횟수로 담은 집계 파일입니다(CSV 약 673KB). 교통 분석가나 시민이 특정 노선·차량이 한 달에 몇 번 운행했는지, 노선별 운행 규모가 월마다 어떻게 바뀌는지 볼 때 쓴다. 전역 조인 키는 없어 진주시 BIS의 노선·정류장 원장과는 노선아이디를 같은 기관 코드로 맞춰 잇고, 다른 데이터와는 이름 매핑으로만 연결한다.
