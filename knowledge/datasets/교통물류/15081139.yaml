summary_user: 서울시 공공자전거 따릉이의 대여 한 건마다 자전거 번호, 대여·반납 일시와 대여소, 이용 시간·거리, 이용자 구분·성별·출생연도를 담은 건별 원천 이력이다. 분석가가 "출퇴근 시간대에 어느 대여소에서 어느 대여소로 이동이 몰리고, 어디서 자전거가 남거나 부족한가"를 따져 재배치 계획을 세우는 데 쓴다. 전역 조인 키는 없고, 대여·반납 대여소 ID(RENT_STATION_ID, RETURN_STATION_ID)나 대여소명으로 같은 서울시 공공자전거 대여소 정보와 맞춰 위치를 붙이는 방식으로만 이어 쓴다.
description_portal: 서울특별시 공공자전거 대여이력 정보입니다. 자전거 이동경로에 대한 데이터 분석이 가능하도록 년도별, 대여소별, 자전거별 대여이력 원천 데이터를 제공합니다. 서울특별시 공공자전거 따릉이 대여이력 정보 데이터는 자전거 이용 흐름과 이동 경로를 분석할 수 있도록 구축된 원천 자료이다. 이 데이터는 년도별, 대여소별, 자전거별로 세분화된 대여이력을 포함하고 있어 특정 자전거가 어떤 대여소에서 출발해 어디로 이동했는지 추적이 가능하다. 이를 통해 이용자의 이동 패턴, 주요 이동 구간, 혼잡 시간대 등을 분석할 수 있으며, 대여소 간 수요 불균형이나 자전거 회전율도 파악할 수 있다. 이러한 정보는 공공자전거 운영 효율성 향상, 재배치 전략 수립, 교통 정책 개선뿐 아니라 스마트시티 기반 데이터 분석에도 중요한 기초자료로 활용된다.
