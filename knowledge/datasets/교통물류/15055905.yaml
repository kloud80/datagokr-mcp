summary_user: 광주광역시가 2007년부터 설치·유지관리 중인 버스도착안내단말기(BIT)를 정류소 단위로 한 행씩 담은 원천 목록이며, 정류소 코드·정류소명·다음 정류소명·주소·경유 노선 수·단말기 형태·설치 연도를 담는다(CSV 약 85KB). 시민이나 교통 분석가가 '우리 동네 정류소에 도착안내단말기가 있는가, 단말기가 없는 정류소는 어디인가'를 확인하거나 단말기 설치 우선순위를 검토하는 데 쓴다. 전역 조인 키는 없어서, 광주 BIS·국가 정류장 원장과는 정류소 코드나 정류소명을 맞춰 붙이고, 지도나 행정구역과는 주소를 지오코딩해 연결한다.
description_portal: 광주광역시 버스도착안내단말기 설치 현황 정보입니다.국가통합교통체계효율화법 시행령,제72조(교통체계지능화사업의 시행 등)에 따라 광주광역시에서 2007년부터 2025년까지 설치하고 유지관리 중인 버스도착안내단말기의정류소번호, 정류소명칭, 다음정류소, 설치장소, 경유노선, BIT 설치형태, 준공(예정) 등의 테이터 항목을 제공합니다.키오스크는 지하철 역사, 터미널 등에 설치되어 시내버스를 이용하는 시민들의 편의를 위해 버스도착안내모니터로서 설치되어 있습니다.
