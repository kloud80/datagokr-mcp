summary_user: 서울 도시고속도로에 설치된 도로전광표지(VMS) 279개를 표지판 한 곳당 한 행으로 담은 파일 데이터이며, 표지판 ID·설치(교체)년도·주소·형식(문형식·측주식 등)을 싣는다. 도로 관리자나 교통 분석가가 특정 구간에 VMS가 어디에 어떤 형식으로 설치돼 있고 언제 설치·교체됐는지 확인하는 데 쓴다. 주소(address)를 조인 키로 삼아 같은 주소 기준의 다른 도로·교통 데이터와 이어 쓰며, 같은 세부 부문의 링크 속도·돌발상황 같은 실시간 소통 데이터와 함께 보면 표지판 위치별 소통 상황을 볼 수 있다.
description_portal: '서울시설공단_도로전광표지판VMS - 서울 도시고속도로의 VMS(도로전광표지)에 대한 데이터로  도로전광표지 ID, 위치정보, 설치교체년도, 설치유형, 운영타입의 정보를 확인할 수 있습니다.  - 설치교체년도 : 2009년 ~ 2024년 - 설치유형으로는 문형식, 측주식 등이 있으며, 문형식이란 도로의 양 가장자리,보도 또는 중앙분리대 등에 지주를 설치하고 그 지주를 문의 형태로 가로로 연결하여 가로축에 VMS를 설치하는 형식입니다. 측주식이란 도로의 가장자리,보도 등에 설치된 지주를 차도부분까지 높게 달아내어 끝부분에 VMS를 설치하는 형식입니다.'
