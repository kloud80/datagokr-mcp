summary_user: 인천광역시 택시에 단 IoT 센서가 도로를 달리며 잰 주변 밝기(조도, Lux)를 측정 시점·위도·경도·지오해시·시·군구·동과 함께 측정 건별로 담은 원천 파일이며, 압축 파일 크기는 약 350MB이다. 야간에 어둡게 측정되는 도로 구간이 어디인지 찾아 가로등 설치·운영을 점검하거나, 야간 교통안전 취약 지점을 파악하려는 분석가·지자체 담당자가 쓴다. 전역 조인 키는 없어서, 시·군구·동 이름이나 위경도·지오해시 좌표를 매핑해 가로등 위치나 교통사고 지점 같은 다른 공간 데이터와 겹쳐 본다.
description_portal: '인천광역시가 제공하는 도로 주변 조도 공공데이터는 택시에 장착된 IoT 디바이스를 통해 실시간으로 수집된 도로 환경의 밝기 정보를 체계적으로 기록한 자료입니다. 이 데이터는 교통 안전, 도시 환경 관리, 에너지 효율 정책 수립 등에 활용됩니다. 주요 항목은 센서명으로 수집 장치를 구분하고, 시간을 통해 측정 시점을 기록합니다. 위도·경도·지오해시는 위치 정보를 정밀하게 제공하며, 시·군구·법정동 단위로 행정구역별 분류가 가능합니다. 핵심 지표인 조도(밝기)는 도로 주변의 실제 광량을 나타내어, 야간 교통 안전 확보, 가로등 설치·운영 효율성 평가, 도시 환경 분석 등에 활용됩니다.항목 : 센서명 / 시간 / 위도 / 경도 / 지오해시 / 시 / 군구 / 법정동 / 조도(Lux)'
