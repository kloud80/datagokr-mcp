summary_user: 전국 고속도로 영업소별로 현재 진입조절을 시행하는지(ctrlYn)와 등록 시각, 노선, 평상시·단계별 운영 정보를 영업소 단위로 담는 실시간 조회 API다. 운전자나 교통정보 서비스 운영자가 '지금 진입이 제한된 고속도로 영업소가 어디인가'를 확인해 우회 경로를 안내하는 데 쓴다. 전역 조인 키는 없으며, 영업소코드(unitCode)·노선코드(lineCode)나 영업소명·노선명으로 같은 한국도로공사의 다른 고속도로 데이터와 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 영업소별 진입조절 시행여부에 대한 현황을 조회할 수 있는 OpenAPI 서비스이다.이 API는 고속도로 혼잡 완화, 돌발 상황 대응 등을 목적으로 특정 영업소에 대해 시행 중인 진입조절 여부를 실시간으로 제공한다.제공 항목에는 영업소명, 노선명, 행정구역, 방향, 조절 사유, 시행 여부, 시작 및 종료 시간 등의 정보가 포함된다.사용자는 본 데이터를 활용하여 진입 제한 구간을 사전에 확인할 수 있으며, 우회 경로 안내, 교통방송, 긴급차량 이동 전략 등 다양한 서비스에 적용할 수 있다.API는 XML 및 JSON 형식으로 제공되며, 인증키 발급 후 표준화된 요청 형식에 따라 활용 가능하다.해당 정보는 정기적으로 갱신되며, 공공데이터 포털을 통해 누구나 자유롭게 이용할 수 있다.본 데이터는 고속도로 교통 흐름의 안정성과 효율성을 높이는 데 기여하며, 교통정보 기반 시스템 구축에도 유용하게 활용될 수 있다.한국도로공사는 본 서비스를 통해 국민의 교통 편의 향상과 안전 확보에 기여하고자 한다.
