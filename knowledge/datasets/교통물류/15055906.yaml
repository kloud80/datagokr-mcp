summary_user: 광주광역시 시내버스 정류소 시설물(정류소, 쉘터, 표지판, 버스도착안내단말기) 수를 동구·서구·남구·북구·광산구 자치구별로 집계한 표로, 2024년 12월 31일 기준이며 파일 크기는 319바이트에 불과한 소규모 요약 자료이다. 광주 시민이나 교통 분석가가 '우리 구에 쉘터가 설치된 유개승강장이나 버스도착안내단말기가 다른 구보다 적은가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 정류장 원장이나 실시간 도착정보(TAGO·지자체 BIS)와는 자치구 이름을 맞춰서만 연결할 수 있다.
description_portal: '광주광역시 시내버스 정류소 시설물(정류소, 쉘터, 표지판, 버스도착안내단말기) 현황에 대한 데이터로해당 데이터는 24.12.31.기준이며, 자치구별 시설 종류 현황을 제공합니다.- 쉘터 : 버스 정류장에 설치되는 덮개로 폭염 폭우로부터 이용승객을 보호해 주는 역할을 하는 시설물이며, 쉘터가 설치된 정류소를 "유개승강장"이라고 함- 버스도착안내단말기 : 실시간 버스 운행정보를 표출하는 단말기- 표지판 : 해당 정류소의 표지판. 정류소 정차 노선 및 노선별 경유 정류소를 안내하는 노선도가 부착되어 있음'
