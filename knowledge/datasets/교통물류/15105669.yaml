summary_user: 부산김해경전철 역별로 비치된 자동제세동기의 운영기관·노선명·역명·가까운 출입구 번호·상세 위치·운영방식·출력에너지·보유 대수를 한 줄씩 담은 작은 파일(CSV 681바이트)이다. 승객이나 역 주변 응급 대응 인력이 '이 역에서 가장 가까운 제세동기는 어느 출입구 근처에 있나'를 확인하거나, 분석가가 역별 제세동기 비치 현황을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명이나 노선명을 이름으로 맞춰 연결해야 한다.
description_portal: 부산김해경전철에 포함된 도시광역철도역들의 철도운영기관, 운영노선명, 역명, 역내안전설비 구분, 근접출입구 번호, 상세위치, 운영방식, 출력에너지, 보유대수의 데이터가 있습니다.자동제세동기는 자동(自動)으로 세동(細動)을 제(際)거하는 기(器)계라는 의미다. 환자에게 심정지(심장마비)가 왔을 때 자동제세동기를 통해 환자의 심장을 인위적으로 뛰게 하면, 환자의 생존율을 두 배 이상 높일 수 있다. 하지만 이런 중요성에도 불구하고, 대다수의 사람들은 자동제세동기의 기능과 사용법에 대해 알지 못한다. 평소에 자동제세동기에 대한 전반적인 내용을 숙지토록 하여야 한다.
