summary_user: 서울시 교통정보시스템(TOPIS)이 제공하는 소통 돌발 링크의 형상 좌표를 링크 아이디별로 Vertex 순서에 따라 TMX·TMY 좌표로 담는 외부 OpenAPI이다. 돌발이 발생한 도로 구간이 지도에서 어떤 선형인지 그리려는 분석가나 개발자가 링크의 위치를 확인하는 데 쓴다. 링크 아이디로 같은 서울 열린데이터광장의 링크별 실시간 속도·돌발 정보와 이어 쓰며, 이력을 쌓으면 상습 정체 분석에도 쓴다.
