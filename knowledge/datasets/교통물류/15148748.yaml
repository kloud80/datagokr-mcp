description_portal: 항만업체변경신청정보는 해당 업체가 등록한 업체정보에 수정사항이 있을 시 해운항만물류정보시스템(Port-MIS)을 통해 신청하며, 관련 서식으로는 항만관련업체(신규/변경)신고서를 작성하여 해운항만물류정보센터에 제출하여야 합니다. 또한 Port-MIS 홈페이지(www.new.portmis.go.kr)의 업체정보 변경신고 메뉴를 이용해 신청할 수 있으며, 이때 사업자등록증 구비서류가 필요하고 신청결과에 대한 처리결과를 문자로 수신 받을 수 있습니다.등록 된 업체정보에 따라 고지서에 대표자 성명 및 고지서 발부 주소도 지정되므로 변동사항이 있을 경우 빠른 변경신청이 필요합니다.
