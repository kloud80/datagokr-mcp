summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 버스 경로를 이루는 도로 구간(링크) 단위 자료로, 링크마다 시작·종점 노드, 링크 거리(rink_dstn), 도로명을 담는다. 교통 분석가가 노선 경로를 그리거나 정류소 사이 실제 도로 거리를 계산하고 싶을 때 이 데이터를 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 경기도 BMS의 노드·노선 자료와 노드 ID·링크 ID를 이름·코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에 등록된 GIS 기반 버스 경로의 기본 단위 정보인 링크(Link)에 대한 자료로, 노선 경로를 구성하는 시작노드아이디, 종점노드아이디, 링크아이디, 링크거리, 도로명 등의 정보를 포함하고 있습니다. 링크는 경로 내에서 하나의 연속된 도로 구간을 의미하며, 전체 노선 경로의 분석, 버스의 이동 경로 시각화, 경로 최적화, 정류소 간 거리 계산 등에 활용됩니다. 특히 이 데이터는 도로 위의 정확한 위치 및 거리 단위를 파악하여 공간 기반 교통분석 및 시뮬레이션 작업에 기초자료로 사용됩니다.
