summary_user: 서울시 횡단보도를 한 곳씩 담은 시설물 대장으로, 관리번호, 횡단보도 종류, 폭·길이, 화살표 표시, 자치구·동 코드, 지번, 설치·교체 일자, EPSG:5186 좌표(XCRD·YCRD)를 담는다. 교통안전 분석가나 자치구 담당자가 '어느 동네에 횡단보도가 적거나 오래 교체되지 않았는가'를 따질 때 쓴다. 전역 조인 키는 없어서 자치구·동 코드(GU_CD·DONG_CD)나 이름으로 맞추거나 좌표를 공간 결합해 사고 다발지점·보호구역 데이터와 이어 쓴다.
description_portal: '서울시 횡단보도 관련 정보입니다. (좌표계: EPSG:5186)*용어설명교통안전시설물은 도로를 이용하는 보행자와 운전자의 교통사고를 예방하고 안전을 확보하기 위해 설치되는 각종 시설물을 말합니다. 「도로교통법」과 「도로안전시설 설치·관리지침」에 근거해 관리<주요시설>- 신호·표지 시설 : 교통신호기: 차량 신호등, 보행자 신호등, 점멸 신호기- 도로표지판: 규제표지(속도 제한, 주정차 금지), 지시표지(진행 방향), 안내표지(거리, 방향), 위험표지(급커브, 어린이보호구역 등)- 과속방지턱: 차량 속도 억제- 방호 울타리(가드레일): 도로 이탈 방지-  안전 펜스: 보행자 보호, 차도-보도 분리- 도로 반사경(Convex Mirror): 교차로·골목길 시야 확보- 시선유도봉/도로표시봉: 차선 변경 제한, 공사 구간 표시- 횡단보도: 보행자 전용 통행로- 보행자 난간/펜스: 무단횡단 방지- 옐로카펫, 옐로로드: 어린이 보호구역 대기 및 통행 표시- 점자블록: 시각장애인 안내'
