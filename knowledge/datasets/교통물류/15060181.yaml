summary_user: "SRT 역별 월간 승차인원(단위: 명)을 승차역 한 행에 월별 열로 펼쳐 담은 집계 파일로, 포털 설명상 2019년 1월부터 2024년 9월까지를 다룬다. 철도·지역 분석가가 'SRT 수서역 승차인원은 코로나19 전후로 어떻게 달라졌나'처럼 역별 월간 이용 추이를 비교하는 질문에 쓴다. 전역 조인 키가 없어 역 위치·시설 마스터나 다른 승하차 데이터와는 역 이름을 맞춰 연결해야 한다."
description_portal: '1. 이 데이터는 주식회사 에스알이 운영중인 고속열차 SRT의 승객 관련 자료입니다.2. 2019년 1월 ~ 2024년 9월 기간의 SRT 역별 월간 승차인원을 제공하는 자료입니다.3. 예시) 2019년 1월 수서역 승차인원은 627,146입니다. (단위 : 명)* 해당 데이터는 연간 주기성 데이터입니다.* 2024년 9월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.* 공란으로 기록된 부분은 미운행기간으로 미집계부분임을 안내드립니다.'
