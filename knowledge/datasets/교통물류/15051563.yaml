summary_user: 수원시 관내 콜택시(한아름콜 포함) 업체를 한 행씩 담은 건별 목록으로, 콜 명칭·운영방식·가입대상·가입대수·도로명/지번 주소·위도·경도·대표자명·전화번호를 담으며 파일 크기는 451바이트로 몇 건 안 되는 소규모 자료다. 교통약자나 시민이 '우리 동네에서 가까운 콜택시 업체 연락처는 어디인가'를 찾거나, 분석가가 콜택시 업체 위치와 가입대수를 지도에 올려 교통 취약지역을 살피는 데 쓴다. 전역 조인 키는 없어 주소나 위도·경도 좌표를 기준으로 정류장·병원·시설 위치 데이터와 공간 결합하거나, 같은 수원시 기관 데이터와 이름으로 맞춰 쓴다.
limits: 수원시 한 개 시군구만 다루며 업체 단위 현황이라 차량별 위치·운행·호출 실적은 없다. 공통 코드 키가 없어 다른 데이터와는 주소·좌표나 이름 매칭으로만 연결된다.
