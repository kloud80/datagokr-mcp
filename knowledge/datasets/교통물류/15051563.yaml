description_portal: 수원시 관내 콜택시 현황입니다. 한아름콜 현황을 포함하고 있으며, 가입대수, 도로명주소, 위도 경도를 포함한 내용을 기재하였습니다. 콜택시현황과 위치 정보를 이용하여 교통 접근성 개선, 시민 편의 향상, 교통정책 수립, 민간 서비스 혁신 등 다양한 분야에서 실질적으로 활용이 가능합니다. 교통약자가 긴급 상황 시 가까운 콜택시 업체를 쉽게 찾을 수 있고, 교통 취약지역 발굴을 발굴하여 콜택시 배치 정책을 설계할 수 있습니다. 병원, 재난구호시설 등에서 긴급 수송수단 확보로 이용이 가능하고, 교통 혼잡 구간, 버스, 지하철 미운행 시간대의 대체 수단으로 이용할 수 있습니다.
