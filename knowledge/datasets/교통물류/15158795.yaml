summary_user: 대전도시철도 1호선 역별·일자별로 승차권 종류(교통카드, 일회용 승차권 등)에 따라 승차와 하차를 나눠 0시부터 23시까지 1시간 단위 인원과 하루 합계를 담는 집계 데이터다. 분석가가 '특정 역에서 출근 시간대에 어떤 승차권 이용자가 많이 타고 내리는가'처럼 승차권 유형별 시간대 이용 패턴이나 역 주변 유동인구를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역번호(stationNo)와 역명 매핑 또는 같은 기관 데이터로만 잇고, 역번호와 승차권 종류의 뜻은 별첨 역명현황·승차권 종류표를 함께 봐야 한다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사의 승차권 종류별 통행량 정보를 제공하는 데이터입니다.원하는 날짜를 입력하면 역별·시간별·승차권 종류별 승차 인원 및 하차 인원 정보를 상세하게 확인할 수 있습니다.본 데이터를 활용하면 승차권 유형별 이용 패턴 파악 등이 가능하며, 교통 정책 수립을 위한 기초 자료 등 다양한 분야에서 활용이 가능합니다.교통카드, 일회용 승차권 등 승차권 종류별 이용 현황을 세분화하여 제공함으로써 대중교통 이용 행태 연구 및 운영 효율화에도 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
