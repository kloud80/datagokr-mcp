summary_user: 수도권 3호선 각 역사의 장애인 화장실 위치를 화장실 한 곳당 한 행으로 담은 파일(csv, 약 6.8KB)로, 운영기관·선명·역명과 함께 지상·지하 구분, 역층, 게이트(개찰구) 안팎, 가까운 출구번호, 상세위치, 화장실 구분을 적는다. 휠체어 사용자나 교통약자 이동 안내 서비스를 만드는 사람이 "이 역에서 장애인 화장실은 몇 층, 개찰구 안쪽인가 바깥쪽인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 역 시설·승강기 데이터와는 역명과 선명을 이름으로 맞춰 이어 써야 한다.
description_portal: 수도권3호선의 역사별 장애인 화장실 위치에 대한 데이터로, 철도운영기관명, 선명, 역명, 장애인화장실의 역층, 게이트내외, 출구번호, 상세위치 데이터가 있습니다.화장실은 일상생활에서 가장 중요한 시설이지만, 휠체어 사용자 등 장애인에게는 여전히 가장 차별적인 시설로 남아 있다. 장애인용 화장실에 대한 기준은 「장애인·노인.임산부등의 편의증진보장에 관한 법률」(장애인등편의법), 「교통약자의 이동편의증진법」(교통약자법) 및 「장애물 없는 생활환경 인증제도의 인증기준」(BF인증제도)에서 정하고 있다. 그러나 현재 장애인등편의법의 기준 가운데 실제로 휠체어 사용자의 이용이 어려운 기준이 몇 가지 있다. 이 기준들에 대한 개선이 필요하다.
