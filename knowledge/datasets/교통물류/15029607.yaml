description_portal: 이 데이터는 해양수산부에서 화물운임 공표 정보를 제공하기 위해 수집한 데이터입니다.  공표번호, 항구코드 등 입력 파라미터를 이용하여 데이터를 호출하실 수 있으며, 본 데이터의 주요 내용은 운임공표번호, 공표일, 업체명, 적하/양하항구정보, 각종 운임 통화구분과 요금정보 등으로 구성되어 있습니다.  본 데이터는 해운회사나 물류기업에서 화물 운송 시 운임정보 확인 및 비교, 자체 물류비 산정 자료로 활용될 수 있으며, 정부 및 관련 기관에서는 운임정보 분석과 화물운임 관련 정책 수립 자료로 사용할 수 있습니다. 또한 연구기관에서 해운운임의 변동요인이나 시장 구조를 분석하는 데 참고자료로 활용할 수 있습니다.
