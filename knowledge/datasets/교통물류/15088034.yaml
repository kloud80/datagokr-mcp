description_portal: 본 자료는 「자동차관리법」 및 「자동차종합검사 시행 등에 관한 규칙」에 근거하여 한국교통안전공단(KOTSA)에서 관리하는 자동차 검사 데이터를 토대로 제작된 샘플 안내 자료입니다. 자동차의 규모별(경형, 소형, 중형, 대형), 연료별, 배출가스 종류별, 그리고 제작연도별로 구분된 배출가스 허용치와 실제 측정치를 체계적으로 정리하였으며, 이를 통해 차량별 환경 기준 준수 여부를 확인할 수 있도록 하였습니다. 이 샘플은 실제 데이터를 기반으로 하여 작성되었으며, 배출가스 저감 정책 수립과 환경 규제 관리, 더 나아가 관련 연구 및 기술 개발에 활용 가능한 기초자료로서의 역할을 수행합니다.
