summary_user: 대전도시철도 1호선 열차의 운행 실적을 운행일(rsltDate) 단위로 담으며, 운행횟수의 계획·회송·실적과 운행거리(km)의 계획·회송을 함께 제공한다. 분석가나 시민이 '특정 기간 동안 계획 대비 실제 운행횟수 이행률이 얼마였고 회송 운행은 얼마나 됐나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 운행일 날짜나 같은 기관(대전교통공사)의 데이터로 맞춰 이어 쓴다.
description_portal: '대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 열차의 운행 실적 정보를 제공하는 데이터입니다.운행일, 운행횟수(계획·회송·실적), 운행거리 계획 및 회송(단위: km) 등 주요 항목별 정보를 포함하고 있습니다.계획 대비 실적 운행횟수 및 운행거리를 비교 분석할 수 있어 도시철도 운행 효율성 평가와 운영 현황 파악에 유용합니다.본 데이터를 활용하면 열차 운행 계획 이행률 분석, 회송 운행 현황 모니터링, 대중교통 운영 성과 평가, 교통 정책 수립을 위한 기초 자료 등 다양한 분야에서 활용이 가능합니다.운행 실적을 투명하게 공개함으로써 공공기관 경영 투명성 제고와 대중교통 서비스 신뢰도 향상에 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)'
