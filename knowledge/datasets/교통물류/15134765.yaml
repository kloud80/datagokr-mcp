summary_user: 서울시 시내버스의 운행 출발 기록을 기준일자·노선·차량·기사·운행순서별로 한 건씩 담은 파일 데이터로, 내려받은 CSV는 5,129바이트로 규모가 작습니다. 교통 분석가가 특정 노선의 하루 운행 횟수와 출발 간격(배차 간격)이 어떤지 확인할 때 쓴다. 전역 조인 키는 없으며, 노선_ID를 서울시 버스 노선 원장의 노선 코드와 같은 기관 코드로 맞춰 이어 쓴다.
description_portal: 서울시에서 운행되는 시내버스의 노선별·정류소별 출발 시간을 기록한 자료로, 각 버스가 특정 정류장에서 실제로 출발한 시점(운행 시작 기준)을 제공한다는 점에서 대중교통 운영 분석에 중요한 정보를 제공합니다. 데이터에는 노선 번호, 정류소 ID, 정류소명, 출발 일시, 차량 번호, 운행 구분 등의 정보가 포함되어 있어 특정 시간대·지역별 버스 공급량 분석, 배차 간격 평가, 차량 운영 효율성, 출퇴근 시간 혼잡도 예측 등에 활용될 수 있습니다. 또한 실시간 이동 데이터와 결합하여 정시성 평가, 교통 정책 수립, 공공 교통 서비스 개선 등에 기초 자료로 활용할 수 있으며, 민간 모빌리티 앱이나 지도 서비스에서도 경로 추천 및 대기 시간 예측 모델 고도화에 활용이 가능합니다.
