summary_user: 창원시 관내 버스정류소를 한 곳당 한 행으로 담은 위치 원장으로, 정류소 ID·정류소명·방면·유형·관할관청·경도·위도·방위각·동코드를 담는다(CSV 약 310KB). 시민이나 분석가가 '우리 동네에서 가장 가까운 버스정류소는 어디이고 어느 방면으로 가는가'를 확인하거나, 정류소 분포와 접근성을 지도로 분석하는 데 쓴다. 전역 조인 키는 없어 같은 기관의 노선·도착 정보와는 정류소 ID나 이름으로 맞춰 쓰고, 행정구역과는 동코드(동코드)나 좌표로 이어 쓴다.
description_portal: 창원시 관내 버스정류소의 ID, 정류소명, 방면, x,y좌표 데이터를 제공하오니, 버스 정류소 관련 자료가 필요하신 분들은 참고하시기 바랍니다.시·도 및 지자체가 관리하는 버스정류소의 지리적 좌표, 정류소 명칭, 도로명/지번 주소 등 위치 정보를 정리한 자료입니다. 본 데이터는 정류소 간 분포, 접근성 평가, 경로 분석, 대중교통 서비스 개선, 도시계획, 민원 대응 등 다양한 분야에서 활용될 수 있습니다.정류소 수가 많을 경우 일반 뷰어(엑셀, 메모장 등)에서는 일부만 표시될 수 있으므로, R, Python, GIS 등 분석 전용 도구를 사용한 공간 분석 및 시각화를 권장합니다.좌표계(WGS84, TM), 집계 기준일, 정류소 코드 체계 등 세부 정의는 제공기관의 메타데이터 또는 기술문서를 참고해 주세요.
