description_portal: 라디오통신채널 정보는 공항·헬리포트의 관제탑, 지상관제, 조종사 간의 안전하고 효율적인 통신을 위해 제공되는 무선 채널에 관한 데이터입니다.제공 항목은 공항식별자, 공항명, 호출명, 통신방식, 우선순위, 송신주파수이며, 이를 통해 해당 채널의 기능과 운용 현황을 파악할 수 있습니다.통신방식은 해당 무선채널이 사용하는 주파수 대역을 나타내며, 채널의 성격과 운용 목적에 따라 구분됩니다.VHF는 Very High Frequency(초고주파)의 약어로 민간 항공 음성통신 주파수 대역을 의미하며, 관제탑, 접근관제, 지상관제 등 민간 항공기와 관제기관 간의 정상 운항과 안전 확보를 위해 폭넓게 사용됩니다.UHF는 Ultra HighFrequency(극초단파)의 약어로 군용 항공 통신 주파수 대역을 의미하며, 군 항공기와 군 관제기관 간의 작전, 훈련, 비상 상황 등에서 안정적이고 신속한 교신을 위해 주로 사용됩니다.
