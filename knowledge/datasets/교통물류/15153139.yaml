summary_user: 국토교통부 항공교통본부의 국내 비행장 정보를 비행장과 활주로(착륙대) 단위로 담은 전국 범위의 비공간 목록이다. 필드명으로 보아 비행장 식별자·이름·관제 유형, 활주로 식별자·폭·길이·방향, 유효기간이 들어 있다. 국내 비행장별 활주로 규모나 관제 유형을 확인하려는 분석가가 쓰고, 전역 조인 키가 없어 운항·항공통계 데이터와는 비행장 식별자(ARPR_IDCH)나 비행장 이름을 매핑해서만 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 항공교통본부에서 제공하는 비행장 관련 정보입니다.\""
