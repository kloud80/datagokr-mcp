summary_user: 경기도 내 자동차대여업(렌터카) 사업장을 사업장 한 곳당 한 행으로 담으며, 시군명·사업장명·인허가일자·영업상태·폐업일자·업체유형·도로명/지번 주소·우편번호·WGS84 위경도를 포함한다. 분석가나 사업자가 '우리 시군에 영업 중인 렌터카 업체가 몇 곳이고 최근 폐업이 늘었는가'처럼 지역별 업체 분포와 신규·폐업 추세를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명으로 같은 경기도 데이터와 묶거나, 주소·좌표를 이용해 다른 공간 자료와 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 자동차대여업(렌터카 업체) 현황을 집계한 자료로, 각 사업장의 기본 정보와 인허가 내역을 포함하고 있습니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태(운영중, 폐업 등), 폐업일자, 업체유형명, 소재지 주소(도로명·지번), 우편번호, WGS84 좌표(위도·경도) 등입니다. 이를 통해 지역별 자동차대여업 등록 업체 분포를 파악할 수 있으며, 신규 등록과 폐업 추세, 렌터카 사업의 지리적 특성 분석에 활용할 수 있습니다. 본 데이터는 교통수단 이용 현황 분석, 관광산업과의 연계성 연구, 대여차량 관리 및 정책 수립, 교통안전 대책 마련 등 다양한 분야에서 유용하게 활용될 수 있습니다.
