description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 투명행정 및 신뢰경영 운영정보 데이터로, 기관에서 주기적으로 배포한 보도자료의 제목, 주관부서, 배포일자, 자료유형, 매체구분 등 언론홍보 활동 전반의 현황 정보를 제공합니다. 이를 통해 기관이 추진하는 주요 정책의 수립과 집행, 철저한 안전관리 시스템, 지속 가능한 경영성과, 지역사회 상생을 위한 사회공헌, 디지털 전환(DX) 성과, 고객 서비스 개선 등 다양한 대국민 소통 채널의 활성화 상태를 면밀히 확인할 수 있습니다. 본 데이터는 공공기관의 행정 투명성을 한층 제고하고 국민의 정보 접근성을 획기적으로 향상시킴은 물론, 정책 홍보의 이력 관리 체계를 구축하고 공공데이터의 민간 활용을 활성화하여 기관의 사회적 책임을 완수하기 위해 개방하는 데이터입니다.'
