summary_user: 최근 5년간 전국 철도사고 사상자를 건별로 담은 파일 데이터로, 발생 일시·철도구분·사고 종류·주원인과 부원인·행정구역·노선·발생장소와 함께 사망·중상 인원, 여객구분, 나이, 성별을 기록한다. 철도 안전 분석가나 정책 담당자가 "어느 연령대·성별의 사상자가 어떤 원인의 철도사고에서 많이 발생하는가"를 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정구역명·노선명 같은 이름 매핑이나 같은 기관(한국교통안전공단) 자료의 코드로만 이어 쓴다.
limits: 표준 코드형 조인 키가 없어 다른 통계와 결합하려면 행정구역·노선 이름을 직접 맞춰야 한다. 공간 좌표가 없는 비공간 자료라 지도 위 정확한 사고 지점 분석에는 쓰기 어렵다.
