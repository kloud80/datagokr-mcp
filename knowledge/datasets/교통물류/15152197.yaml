summary_user: 서울지하철 역별로 자전거를 끌고 계단을 오르내리는 미끄럼 레일형 자전거 경사로의 설치 수량을 외부출구·대합실·승강장 구간별로 나누고, 외부 출구에 있는 경우 출구 번호를 함께 담은 역 단위 CSV 파일(약 5KB)이다. 자전거를 가지고 지하철을 타려는 시민이나 지도 서비스 개발자가 '이 역의 몇 번 출구로 자전거를 끌고 들어갈 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 정보 데이터와는 호선과 역명을 이름으로 맞춰 연결해야 한다.
description_portal: 서울지하철 각 역에 설치된 자전거 경사로의  설치 수량 및 위치(외부 출구 번호)을 제공합니다.자전거 경사로는 자전거를 끌고 계단을 오르내릴 수 있도록 설치된 미끄럼 레일 형태의 편의시설입니다.역별로 외부출구·대합실·승강장(내부계단) 등 설치 구간별 수량과 외부 출구 번호를 함께 제공합니다.외부 출구에 위치한 경우에만 세부 정보를 제공하며, 대합실, 승강장의 경우 설치 수량 정보만 제공합니다.지도 서비스 에서 “자전거 진입 가능한 출구 안내” 기능 구현, 교통약자 이동편의 개선 연구, 도시 접근성 분석 등에 활용 가능합니다.*외 부 출구 번호 항목은 외부 출구에 설치되어 있을 경우만 기재되어 있어 빈칸이 다수 존재함을 알려드립니다.*
