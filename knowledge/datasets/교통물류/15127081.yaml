description_portal: '이 데이터는 경상북도 김천시 전체 행정 구역(읍 1개, 면 14개, 동 7개)을 기준으로 전기자동차 등록 및 보조금 신청 현황을 정리한 통계 자료입니다.김천시의 지속가능한 교통정책, 친환경차량 보급 확산, 에너지 전환 행정 기반 마련을 위한 기초 자료로 활용됩니다.자료에는 각 행정동(읍·면·동) 단위로 전기자동차 등록 대수, 전기차 구입을 위한 보조금 신청 대기 건수, 그리고 해당 정보가 입력 또는 데이터기준일자가 포함되어 있습니다.파일은 행정구역별로 세분화된 전기차 등록정보가 포함된 표 형식(예: Excel, CSV 등)으로 제공되며, 데이터 기반 의사결정에 적합한 구조를 갖추고 있습니다.'
