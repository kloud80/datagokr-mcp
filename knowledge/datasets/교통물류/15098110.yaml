description_portal: 이 데이터는 2021년 12월 기준으로 서울특별시 성북구에 등록된 전기차 및 전기이륜차의 현황을 정리한 자료입니다. 전체 전기차 등록대수를 비롯해 자동차와 이륜차로 구분된 등록 현황이 포함되어 있으며, 이를 통해 성북구의 친환경 모빌리티 보급 수준과 전기차 이용 증가 추세를 파악할 수 있습니다. 본 자료는 전기차 충전 인프라 확충 계획, 탄소중립 교통정책 수립, 친환경 이동수단 보급사업 평가 등 다양한 행정·연구 목적에 활용될 수 있으며, 지역 기반 스마트교통 정책 수립의 기초 데이터로도 활용 가치가 높습니다.
