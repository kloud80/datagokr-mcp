summary_user: 통영시 도시정보시스템에 등록된 선착장 시설을 한 곳씩 담은 원천 목록으로, 관리번호·행정읍면동·관리기관·구분과 위도·경도 좌표를 가진다(csv 파일, 약 5.5KB). 섬 주민·여행객이나 분석가가 통영시 어느 읍면동에 어떤 선착장이 있고 누가 관리하는지를 지도에서 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 선착장 이름·행정읍면동 매핑이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 통영시 도시정보시스템에서는 선착장의 위치와 관리 현황을 체계적으로 파악하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 선착장의 정확한 위치와 식별이 가능하며, 관리기관 정보는 해당 시설의 유지관리 책임을 명확히 합니다. 또한 구분 항목을 통해 선착장의 유형이나 기능을 구체적으로 구분할 수 있습니다. 위도와 경도 좌표가 포함되어 있어 지도상에서 정확한 위치 확인이 가능하며, 이러한 정보는 선박 운항 관리, 시설 점검, 해양 안전 및 재난 대응 등 다양한 행정 및 운영 업무에 활용될 수 있는 중요한 기초자료로 제공됩니다.
