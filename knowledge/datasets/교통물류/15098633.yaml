description_portal: 해당 데이터는 경상북도 영천시의 연료별 자동차 등록 현황과 관련된 데이터입니다. 해당 데이터는 영천시 내에서 등록된 차량들의 연료 유형별 분포와 용도별 등록 현황을 상세하게 제공하며, 연료별, 용도별, 차량 종류별로 구분된 정보를 포함하고 있습니다. 해당 데이터는 CNG, 경유, 기타 연료, 수소, LPG, 전기, 하이브리드, 휘발유 등 다양한 연료 유형별로 구분되어 있으며, 각각의 연료별로 사업용과 비사업용 차량의 등록 수를 상세하게 보여줍니다. 특히, 각 연료별 용도 구분은 차량의 사용 목적에 따라 구분되어 있어, 영천시 내 차량 운행 특성을 분석하는 데 중요한 자료입니다 해당 데이터와 관련하여 궁금하신 사항이 있으신 경우 영천시 교통행정과로 연락주시기 바랍니다.
