summary_user: 경상북도 영천시에 등록된 자동차 대수를 연료(휘발유·경유·LPG·전기·수소·하이브리드·CNG·기타)와 용도(사업용·비사업용)별로 나눠, 승용·승합·화물·특수 차종별 대수와 합계로 담은 시군구 단위 집계 파일이다. 영천시 교통·환경 담당자나 분석가가 "영천시에 등록된 전기·수소차가 몇 대이고 차종별로 어떻게 분포하는가"처럼 친환경차 보급 수준이나 사업용 차량 구성을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 시군의 같은 연료별 등록 현황과는 시군구 이름과 통계일자를 맞춰 붙여야 한다.
