summary_user: 해운항만물류정보시스템(PORT-MIS)에 등록된 항만운송사업자를 사업자 건별로 담은 전국 단위 파일로, 관리청·등록번호·사업종류·사업구역·사업체명·등록일자 등을 담는다(파일 크기 약 4KB). 특정 항만에서 어떤 하역·항만용역 사업자가 등록돼 영업하는지 확인하거나, 사업종류별 사업자 분포로 항만운송시장 구조를 살피는 데 쓴다. 다른 데이터와 바로 묶을 전역 조인 키는 없어, 사업체명이나 관리청·사업구역 이름을 매핑해 항만별 물동량·하역 데이터와 이어 쓴다.
description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 항만운송사업자가 관련 법령에 따라 관리청에 등록한 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 항만운송사업자의 등록번호, 상호명, 업종, 사업구역, 등록일자, 관리청 정보 등으로 구성되어 있습니다.  본 데이터는 항만운송사업자 현황 파악, 항만운송시장 구조 분석, 신규 사업자 발굴, 항만운송서비스 정책 수립, 항만 업무 관련 DB 연계 및 해양수산 분야 연구자료 등 공공 부문 및 민간 연구기관의 항만운송 정책수립과 시장분석, 법적 등록 현황 조사 등을 위한 자료로 활용될 수 있습니다.
