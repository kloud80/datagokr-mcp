summary_user: 금산군에 접수된 불법주정차 신고(안전신문고·CCTV 단속)를 건별로 담은 원천 자료로, 신고일자·신고시각·신고위치와 과태료 부과 여부를 한 줄씩 기록하며 CSV 파일(약 229KB)로 받는다. 주민이나 분석가가 금산군 내 어느 위치·시간대에 불법주정차 신고가 몰리고, 그중 실제 과태료로 이어진 비율이 얼마인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 신고위치(주소·장소명) 문자열을 매핑하거나 같은 기관(금산군) 자료끼리만 이어 쓴다.
description_portal: 현재 금산군의 안전신문고 및 CCTV 자료를 토대로 신고 건수 및 과태료 부과 현황 추출자료입니다.- 2025.11.26. 기준으로 하여 2024.01.01. 이후 현재까지 금산군 불법주정차에 대한 신고건수, 신고일시, 신고 위치 및 그에 따른 과태료 부과 현황 자료로서 신고 유형에 따른 과태료 부과 사실 확인 가능 - 안전신문고 신고건에 대하여는 절대주정차금지구역에 대해서만 과태료 부과 사실 확인 가능하며 그 외 구역은 안전신문고 신고 시 과태료 부과 불가능합니다. - CCTV단속은 지정 위치에서 20분 이상 주차 시 단속되며 과태료 부과됩니다.
