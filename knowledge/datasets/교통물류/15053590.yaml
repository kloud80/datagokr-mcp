description_portal: 이 데이터는 광주광역시 도시철도공사의 연도별 운임 변동 현황을 기록한 자료로, 이용권 종류별 요금 변화를 시기별로 확인할 수 있도록 구성되어 있습니다. 주요 항목에는 구분(일반 1회권, 대학생 1회권, 청소년 1회권, 어린이 1회권, 일반 교통카드 등)과 각 시점별 운임 금액(원)이 포함됩니다. 시점은 2004년 4월, 2005년 6월, 2006년 10월, 2007년 9월, 2011년 7월, 2016년 8월 등 주요 요금 조정 시기를 반영하고 있습니다.이 자료를 통해 기간별 운임 인상 추이를 파악할 수 있으며, 요금 정책 변화가 대중교통 이용 패턴에 미친 영향을 분석하는 데 활용할 수 있습니다. 특히 이용권 유형별로 인상 폭과 시기를 비교하면 연령·이용자 계층별 요금 정책 차이를 분석할 수 있어, 향후 운임 조정 계획 수립, 교통 복지 정책 평가, 요금 인상에 따른 수요 변화 예측 등에 중요한 참고 자료가 됩니다.
