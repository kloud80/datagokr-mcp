summary_user: GICOMS가 관리하는 AIS(선박자동식별시스템) 정적정보를 선박 국적(국가명)별 선박 수로 집계한 전국 단위 통계 파일로, 국적과 건수 두 컬럼만 담은 작은 CSV(약 3.5KB)다. 해운·조선 분석가나 정책 담당자가 '국내 해역 AIS에 잡힌 선박은 어느 등록국가 비중이 큰가' 같은 국적별 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명 문자열을 직접 매핑하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 해양안전종합정보시스템(GICOMS)을 통해 관리하는 AIS(선박자동식별시스템) 기반의 선박 정적 정보를 통계 형태로 가공하여 제공하기 위해 수집한 데이터입니다.본 데이터의 주요 내용은 각 선박의 국적 및 국가명에 따라 선박 수를 분류한 통계 정보로 구성되어 있습니다.본 데이터는 해양 교통정책 수립, 국가 간 해운산업 비교, 해양물류 동향 분석, 해운·조선 산업 관련 시장 조사 및 연구 등 다양한 공공 및 민간 영역에서 활용될 수 있습니다. 특히, 선박의 등록국가별 분포 현황은 국제 해운 흐름 분석 및 해양안전 정책의 기초 자료로 사용될 수 있습니다.
