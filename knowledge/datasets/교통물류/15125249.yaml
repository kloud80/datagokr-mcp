summary_user: 경기도 고양시에서 이루어진 주정차 위반 단속을 건별로 담은 원천 자료로, 집계년도·단속일시·단속장소(상세 주소)·단속방법(이동식·고정형 등)·관리기관명을 시군구 단위 범위에서 수록하며 CSV 파일 크기는 약 13MB입니다. 고양시 교통 담당자나 분석가가 '어느 장소·시간대에 불법 주정차 단속이 몰리는가'를 파악해 단속 인력 배치나 주정차 금지구역 지정 근거를 찾는 데 쓴다. 실측 컬럼에 전국 공통 조인 키는 없으므로 시군코드나 단속장소 주소를 이름·주소 매칭으로 지오코딩해 무인교통단속카메라·어린이보호구역 표준데이터나 교통 민원 자료와 겹쳐 본다.
description_portal: '이 데이터는 경기도 고양시 내에서 수행된 주정차 위반 단속의 연도별 위치 및 이력 정보를 제공하는 자료로, 시군명, 단속일시, 단속장소, 단속방법, 관리기관명, 단속일 기준일자 등의 항목으로 구성되어 있습니다. 단속 위치는 상세 주소 단위로 수록되어 있으며, 단속방법(예: 이동식, 고정형 등)은 교통행정 집행 방식 구분에 활용됩니다. 또한 관리기관명과 단속일 정보는 행정 주체별 단속 실적 분석, 연도별 위반 집중지역 파악, 지도 기반 시각화 등에 유용합니다. 교통 불편 해소, 불법 주정차 예방, 효율적인 단속 인력 배치 등 정책 수립의 근거 자료로 활용될 수 있으며, 타 부서와의 교차 활용 시 교통 민원 분석 및 교통안전 대책 마련에도 기여합니다.'
