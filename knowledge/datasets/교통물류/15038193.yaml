summary_user: 서울 성동구 관내 학교 주변 어린이 보호구역에 설치된 옐로카펫을 설치 지점 한 곳당 한 행으로 담은 파일로, 학교명·설치위치·설치연도를 기록한다(CSV 약 1.7KB 규모의 소량 목록). 학부모가 "우리 아이 학교 앞 횡단보도에 옐로카펫이 있는지, 언제 설치됐는지"를 확인하거나, 구청·분석가가 학교별 설치 여부를 보고 추가 설치가 필요한 곳을 고르는 데 쓴다. 전역 조인 키가 없어 학교명이나 위치 문자열을 손으로 맞춰 어린이보호구역 표준데이터나 학교 목록과 이어 써야 한다.
