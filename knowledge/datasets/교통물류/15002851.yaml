summary_user: 전국 14개 공항(김포·김해·제주 등)의 공항명, 행정구역, 위도·경도(WGS84)를 공항 한 곳당 한 행으로 담은 작은 CSV 파일이다. 공항 위치를 지도에 표시하거나 특정 지점에서 가까운 공항을 찾으려는 분석가·개발자가 쓴다. 위도·경도(coord) 키로 다른 좌표 데이터와 이어 쓰며, 운항·통계·노선 데이터를 잇는 공항 코드 마스터 부문에 속하지만 IATA/ICAO 코드 필드는 이 파일에 없다.
limits: 14개 공항만 담고 있어 이 목록 밖의 공항이나 헬기장은 찾을 수 없다. 공항 코드(IATA/ICAO) 필드가 없어 코드 기준 조인은 다른 데이터가 필요하고, 조인 키는 좌표뿐이라 값이 정확히 같아야 이어진다.
