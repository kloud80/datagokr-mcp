description_portal: 한국공항공사(Korea Airports Cooperation)가 운영하는 전국 공항의 위치정보를 제공합니다.해당정보는 행정구역의 도로명 주소와 위도(WGS84좌표), 경도(WGS84좌표)의 정보로 이루어져 있습니다.전국공항 기준은 김포공항, 김해공항, 제주공항, 대구공항, 청주공항, 무안공항, 양양공항, 광주공항, 울산공항, 여수공항, 포항경주공항, 사천공항, 군산공항, 원주공항 14개 공항이 대상입니다.해당 정보에 대한 문의사항이 있으시면 02-2660-4807로 문의주시기 바랍니다.
