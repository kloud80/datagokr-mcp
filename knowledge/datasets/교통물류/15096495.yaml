summary_user: 대구광역시 북구 관내 불법주정차 민원을 2018년~2021년 5월까지 지번주소별·연도별 누적건수(1~873건)로 묶어 경도·위도와 함께 담은 집계 데이터로, 포털 설명상 14,814행이다. 북구 안에서 어느 주소에 불법주정차 민원이 반복해서 몰리는지 확인해 단속 인력이나 주차 공간 확충 위치를 정하려는 분석가·지자체 담당자가 쓴다. 전역 조인 키는 없어 주소(지번) 문자열이나 위경도 좌표로 단속카메라·주차장 위치 데이터와 공간적으로 맞춰 쓴다.
description_portal: 먼저 해당 데이터는 2021년 공공데이터 기업매칭 사업 완료시 구축된 1회성 데이터이며, 더이상 업데이트가 진행되지않음을 말씀드립니다.대구광역시 북구 관내의 불법주정차 민원에 대한 14,814개의 데이터가 존재하며, 데이터 수집기간(2018년~2021년 5월)까지의 불법주정차 민원에 대한 데이터로 불법주정차 민원발생 주소(지번주소), 주소별 민원발생 누적건수(1~873, ※연도별 누적건수로서 이전년도 누적건수 포함하지 않습니다.), 민원 발생년도(YYYY), 경도, 위도 등의 항목을 제공합니다.
