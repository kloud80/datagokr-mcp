summary_user: 서울교통공사 1~8호선 역 승강장의 위치별로 승강장 선형(직선·곡선), 열차와 승강장 사이 연단간격(넓음/보통/좁음), 높이차(높음/보통/낮음)를 담은 건별 시설 정보 파일입니다. 승객·교통약자 단체나 안전 분석가가 '어느 역 어느 승강장 위치가 발빠짐 위험이 큰가'를 확인하고 안전발판 설치 우선순위를 검토하는 데 씁니다. 전역 조인 키는 없으며, 역코드·역외부코드나 역명·호선을 매핑해 같은 기관의 역별 승하차·시설 데이터와 이어 씁니다.
description_portal: '서울교통공사의 운영구간인 1호선~8호선 275개역 전체 승강장 형태를 직선과 곡선으로 구분하였습니다. 동시에 각 승강장별 연단간격(넓음/보통/좁음), 높이차(높음/보통/낮음) 정보를 제공하고 있습니다.(2025년 12월 31일 기준)승객 발빠짐 사고 방지를 위해 연단간격이 큰 구간에 고무발판을 설치(일부 개소는 열차 충돌문제 등으로 설치 불가)하였고 자동안전발판 역시 시범설치 및 운영 중에 있습니다. 또한 승강장 바닥과 스크린도어 등에 발빠짐 주의안내문을 부착하여 승객 안전을 위해 많은 노력을 다하고 있습니다.참고사항: 암사역사공원역은 연단간격 조사 중으로 조사 완료 후 업데이트 실시토록 하겠습니다.'
