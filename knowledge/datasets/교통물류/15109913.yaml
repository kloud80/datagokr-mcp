summary_user: 전라남도 곡성군에 설치된 신호등을 한 대씩 담은 건별 데이터로, 신호등관리번호·신호등 구분·색 종류와 함께 설치 도로(도로종류·노선번호·도로명), 주소와 위경도, 신호 현시 방식·순서·시간, 점멸 운영 시간, 잔여시간 표시기·음향신호기 설치 여부 등을 담는다. 곡성군 안에서 특정 도로나 교차로에 어떤 신호등이 있는지, 음향신호기·잔여시간 표시기가 어디에 설치돼 있는지 확인하려는 주민·분석가·내비게이션 사업자가 쓴다. 전국 공통 조인 키는 없어 다른 데이터와는 주소(도로명·지번)나 위경도 좌표, 시도·시군구 이름으로 맞춰 이어 쓰며, 같은 지역의 무인교통단속카메라·어린이보호구역 표준데이터와 위치 기준으로 겹쳐 보는 데 쓴다.
description_portal: 신호등관리번호, 신호등구분, 신호등 색 종류 등의 신호등 데이터 정보를 제공하는 전라남도 곡성군 신호등 정보 데이터 조회 서비스
