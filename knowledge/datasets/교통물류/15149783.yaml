description_portal: 해당 정보는 한국교통안전공단에서 제공하는 정보입니다. 해당 정보는 한국교통안전공단에서 수집하는 사업용차량(버스, 택시, 화물)의 운행기록 자료를 기반으로 분석된 정보입니다. 운행기록자료에서 수집된 좌표 및 속도를 기준으로 도로링크의 운행속도(통과속도)를 산출하고, 해당 도로의 제한속도와 비교하여 제한속도 준수율을 산정하여 제공되는 정보입니다. 제한속도 준수율 정보는 행안부 기준에 따라 시도별, 시군구별 제한속도 준수율 정보를 제공합니다. 또한 통과차량 대수와 위반차량 대수를 월별로 산정하여 제공합니다.
