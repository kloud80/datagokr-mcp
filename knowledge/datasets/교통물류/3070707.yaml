summary_user: 충청남도 서산시 안의 교통카드 충전소를 한 곳당 한 행으로 담은 파일로, 읍면동·상호·도로명 주소·위도·경도·데이터기준일을 기록한다. 서산 주민이나 방문객이 '우리 동네에서 버스 교통카드를 충전할 수 있는 가게가 어디 있나'를 찾거나, 분석가가 읍면동별 충전소 분포를 지도에 올려 충전 접근성이 낮은 곳을 살피는 데 쓴다. 전역 조인 키는 없으므로 읍면동 이름이나 위도·경도 좌표를 기준으로 서산시 버스 정류장·노선 자료 같은 다른 공간 데이터와 붙여 쓴다.
