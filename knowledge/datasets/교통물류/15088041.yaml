description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 관리하는 자동차검사 자료 중 하나로, 자동차의 차종(승용·승합·화물·특수)별, 유종별, 제작년월일별, 적용 법령별, 자동차 제원(차량중량 등)별로 세분화된 배기가스 허용기준 데이터를 담고 있는 샘플입니다. 각 배출가스 항목별(CO, HC, NOx 등)로 허용기준치를 구체적으로 제공하며, 차량 종류와 특성에 따라 차등 적용되는 규제 내용을 비교·분석할 수 있도록 구성되어 있습니다. 이 자료는 환경정책 수립, 제도 개선, 차량 성능 평가, 저공해 차량 연구 등 다양한 분야에서 기초자료로 활용됩니다.
