summary_user: 경기도 시군별·연도별 어린이보호구역 개선사업의 사업량(개소)과 국비·도비·시군비(백만원) 투입액을 담은 집계 자료다. 지자체 담당자나 분석가가 "우리 시군은 어린이보호구역 개선에 몇 곳, 얼마를 썼고 재원을 국가·도·시군이 어떻게 나눴나"를 비교할 때 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)과 기준년도를 이름으로 맞춰 어린이보호구역 표준데이터나 교통사고 통계 같은 다른 시군 단위 자료와 잇는다.
description_portal: 이 데이터는 어린이보호구역의 개선사업 추진 현황을 기록한 자료로, 연도별·시군별로 사업 수행 현황과 재정 지원 내역을 제공합니다. 주요 항목으로는 기준년도, 시군명, 사업량(개소), 국비(백만원), 도비(백만원), 시군비(백만원) 등이 포함되어 있으며, 이를 통해 각 시군이 어린이보호구역 내 안전시설물 설치 및 환경개선 등을 위해 투입한 사업 수와 재정 지원 규모를 파악할 수 있습니다. 본 데이터는 어린이 교통안전 정책 수립, 지방재정 투자 계획, 사업성과 분석, 교통안전시설 투자 우선순위 선정 등 다양한 행정적·정책적 목적으로 활용될 수 있습니다. 특히 국비·도비·시군비의 분담 내역을 통해 정부 및 지자체 간 재원 분담 현황을 확인할 수 있습니다.
