summary_user: 경찰이 조사·처리한 인적 피해 교통사고를 가해운전자 차량용도(사업용·비사업용, 택시·버스 등 대분류·중분류·세부 용도)와 시간대별로 묶어 사고건수·사망자수·중상자수·경상자수·부상신고자수를 담은 전국 단위 집계 파일(csv 약 19KB)이다. 교통안전 분석가나 운수업 관계자가 '택시·버스 같은 사업용 차량의 사고가 어느 시간대에 몰리고 사망자가 많은가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 교통사고 통계와는 차량용도·시간대 이름을 맞춰 붙여야 한다.
description_portal: '- 차량용도별(사업용, 비사업용, 택시, 버스 등) 시간대별 교통사고 통계(사고건수, 사망자수, 중상자수, 경상자수, 부상신고자수)   * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨 - 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
