summary_user: 대전광역시 도로관리시스템에 등재된 도로시설물 가운데 점·선·면 등 표준 분류에 들지 않는 그밖의시설물을 시설물 한 건씩 담은 원천 목록으로, 관리번호·행정읍면동·도로명·지번과 위도·경도를 포함하며 파일 크기는 약 2KB(1962 bytes)로 작다. 대전시 도로시설물 관리 담당자나 분석가가 '특정 동이나 도로 구간에 분류되지 않은 도로시설물이 어디에 몇 개 있는가'를 확인하고 지도에 찍어 보는 데 쓴다. 전역 조인 키는 없어서 위도·경도로 다른 공간 데이터와 겹쳐 보거나, 행정읍면동·새주소도로명·도로구간번호 같은 이름·코드를 맞춰 대전시의 다른 도로시설물 현황(점·선·면 시설물)과 이어 쓴다.
description_portal: 대전광역시_도로시설물 현황(그밖의시설물) 데이터는 대전광역시 도로관리시스템에 등재된 도로시설물 중에서 기존의 표준 분류(점, 선, 면, 기타)에 포함되지 않는, 분류되지 않은 시설물(그밖의시설물)의 현황 정보를 포함하고 있습니다. 이 데이터에는 다양한 형태와 용도의 특수 시설물들이 포함되어 있으며, 위치, 종류, 설치 구간, 관리 상태 등 여러 속성 정보를 제공합니다. 해당 자료는 도로시설물의 체계적 유지보수, 도시 인프라 관리, 시설물 안전 점검, 공공자산의 효율적 관리 등 다양한 행정적 목적에 활용될 수 있습니다. 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴이 직접 구축·정비한 데이터로, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
