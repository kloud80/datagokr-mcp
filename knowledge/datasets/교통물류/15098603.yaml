summary_user: 경상북도 청송군에 등록된 자동차 대수를 차종(승용·승합 등)과 용도(사업용·비사업용)별로 나누고, 휘발유·경유·엘피지·전기·수소·하이브리드 등 연료별로 집계한 시군구 단위 표입니다(CSV 746바이트 규모). 청송군의 전기·하이브리드 차량 보급 수준이나 사업용 차량 비중을 파악하려는 지자체 담당자·분석가가 씁니다. 전역 조인 키가 없어 다른 시군구의 같은 형식 차량등록현황과 시도·시군구 이름으로 맞춰 붙여 비교합니다.
description_portal: 경상북도 청송군의 자동차 등록 현황에 대한 데이터로, 차종별(승용차, 승합차 등), 용도별(사업용, 비사업용), 연료별(휘발유, 경유, LPG 등)로 구분하여 차량등록대수 정보를 제공하고 있습니다.휘발유와 하이브리드의 경우 상세 연료별로 구분하여 제공합니다. 데이터 업로드 일자를 기준으로 등록된 차량의 대수를 제공합니다.
legal_basis_portal: 지자체에 등록된 자동차의 현황을 파악하여 교통행정의 기초자료로 활용.
