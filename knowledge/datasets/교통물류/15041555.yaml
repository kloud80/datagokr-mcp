summary_user: 강원특별자치도 홍천군의 버스 정류장을 한 행에 한 곳씩 담은 원장 파일로, 2020년 12월 1일 기준 932곳의 정류장명(한글·영문), 도로명, 노변·중앙차로 구분, 경도·위도를 담는다. 홍천군 주민이나 교통 분석가가 '이 마을·지방도 구간에는 어떤 정류장이 어디에 있나'를 확인하거나 정류장 위치를 지도에 찍는 데 쓴다. 전역 조인 키가 없어 노선·도착 정보 등 다른 대중교통 데이터와는 정류장명이나 좌표(경도·위도)로 맞춰 이어 써야 한다.
