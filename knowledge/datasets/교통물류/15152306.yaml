description_portal: '이 자료는 공공데이터 제공 신청을 통해 생성된 결과입니다.데이터의 대상은 2024년 동안 접수된 불법 주정차 신고 중 과태료가 부과된 건입니다.이 자료는 불법 주정차 신고 처리 과정과 과태료 부과 현황을 확인하기 위해 제공되었습니다.자료 제공처는 **강릉시 교통과(033-640-5754)**입니다.제공된 데이터에는 다음 정보가 포함됩니다.신고일시: 신고가 접수된 정확한 날짜와 시간과태료부과: 해당 신고에 대해 과태료가 실제로 부과되었는지 여부비고: 신고가 안전신문고 건인지, 횡단보도 관련 건인지에 대한 구분 정보이 자료는 신고 발생 시점, 부과 여부, 신고 유형을 함께 확인할 수 있어,불법 주정차 단속 현황과 처리 흐름을 분석하는 데 활용할 수 있습니다.'
