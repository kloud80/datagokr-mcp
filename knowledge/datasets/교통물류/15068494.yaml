description_portal: '이 데이터는 한국철도공사가 제공하는 ‘연도별 여객 할인 수송량’ 자료로, 고속철도(KTX), 새마을, 무궁화 등 주요 일반열차의 연도별 할인 승차 인원(수송량)을 집계한 것입니다. 할인 수송량이란 장애인, 국가유공자, 군경, 노인, 어린이, 단체 등 각종 할인 대상 이용자가 해당 연차에 열차를 이용한 인원수를 의미하며, 연도별, 열차종별로 상세하게 정리됩니다. 데이터는 CSV, XML, JSON 등 다양한 오픈 포맷으로 제공되며, 누구나 무료로 다운로드해서 이용할 수 있습니다.이 데이터를 통해 확인하거나 유추할 수 있는 주요 인사이트는 다음과 같습니다. 첫째, 연도별로 할인 혜택 이용자의 수요 변동을 분석하면, 특정 시기(예: 정책변경, 사회복지 확충, 경기변동 등)나 열차종(고속 vs 일반)별 할인 승객의 이용 패턴을 파악할 수 있습니다. 둘째, 각 할인 유형별(예: 경로, 장애인, 단체 등)의 이용 인원 증감으로 사회복지정책, 교통복지 수준 변화, 고객층 특성 및 시장 수요 구조 변화를 평가할 수 있습니다. 셋째, 할인 수송량 데이터와 전체 여객 수송 실적을 결합해 할인제도의 여객시장 점유율, 경기변동·정책효과 등을 정량적으로 진단할 수 있습니다.이 자료는 철도 및 교통복지 정책 수립, 할인제도 개선 및 효과분석, 열차별·노선별 할인 대상자 수요 예측, 운영 계획 및 마케팅 전략 수립, 복지행정 근거자료 등 공공·민간 분야에서 폭넓게 활용됩니다. 정부와 지자체의 교통약자 지원정책 평가, 노인 및 장애인 등 취약계층 수송 지원 연구, 대중교통 마케팅 및 서비스 전략, 학술 논문 작성 등에서도 참고자료로 쓰이는 중요한 기초 데이터입니다.'
