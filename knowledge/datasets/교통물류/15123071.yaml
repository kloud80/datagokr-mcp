summary_user: 용도지역지구 등 그룹코드별로 적용 컬럼명·적용코드·코드내용을 KLIS(한국토지정보시스템) SHP 레이어명과 KLIS 코드에 대응시킨 전국 단위 비공간 코드매칭표로, 약 4KB 크기의 CSV 파일 한 개입니다. 공간정보 분석가가 KLIS 용도지역지구 SHP 파일의 코드값이 어떤 용도지역·지구를 뜻하고 어느 레이어에 속하는지 해석할 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, KLIS 레이어명과 KLIS 코드, 적용코드 값을 SHP 속성의 코드와 이름·코드로 맞춰 이어 쓴다.
description_portal: 국토교통부_KLIS 코드매칭 테이블 데이터는 용도지역지구,용돋지역지구분코드를 사용하는 공간정보 KLIS.SHP 데이터와 해당되는 컬럼명으로 매칭 되어있는 테이블입니다.작성된 데이터의 코드내용으로  적용되는 코드별로 해당 컬럼에 맞는 코드내용과 레이어  매칭되고 추가적으로 KLIS코드도 매칭됩니다. 국토교통부  KLIS 코드매칭 테이블은 중장기 계방개획으로 2023년에 공공데이터 목록등록관리에 등록된 데이터 이며 현재는 고도화 되어 갱신되지 않는 단반성 데이터 입니다.
