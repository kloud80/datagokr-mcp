summary_user: 서울 강서구에 설치된 고정형 불법주정차 단속 CCTV를 지점별로 한 행씩 담은 위치 목록으로, 설치 주소(FIX_CCTV_ADDR)·위도·경도·단속지점명·현장구분을 포함한다. 주민이나 분석가가 '우리 동네 어느 도로에 주정차 단속 카메라가 있는가'를 확인하거나, 단속지점의 공간 분포를 지도에 올려 단속 공백 구간을 찾는 데 쓴다. 전역 조인 키는 없으므로 위도·경도로 다른 공간 데이터와 겹치거나, 자치구 코드(CGG_CD)로 같은 기관의 다른 서울시 자료와 잇는다.
description_portal: 서울시 강서구 내 불법주정차 단속을 위해 설치된 고정형 CCTV의 위치정보를 제공하는 자료입니다. 각 단속지점별로 위도, 경도 좌표와 함께 도로명, 단속지역명, 현장구분 등이 포함되어 있으며, 불법주정차로 인한 교통 혼잡과 안전사고를 예방하기 위한 행정적 관리 기반으로 활용됩니다. 특히 불법주정차 문제는 교통 흐름 저해, 보행자 안전 위협, 응급차량 이동 지연 등의 문제를 야기하기 때문에, CCTV 기반 단속은 교통질서 확립과 안전 확보에 중요한 역할을 합니다. 본 데이터를 통해 단속지점의 공간적 분포를 분석할 수 있으며, GIS와 연계하여 불법주정차 다발 지역을 시각화하거나 정책적 대응의 우선순위를 설정하는 데 활용할 수 있습니다. 나아가 교통 빅데이터 분석, 스마트 교통 시스템 구축, 안전 관련 인공지능 모델 학습 자료로도 적용 가능하여 다양한 공공·연구 목적에 유용합니다.
