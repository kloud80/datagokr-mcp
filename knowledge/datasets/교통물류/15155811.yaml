summary_user: 2013년 1월 1일 이후 신고된 이륜자동차를 한 대씩 담은 건별 등록 원장 파일로, 등록번호(뒷 2자리 마스킹)·관할/등록관청·최초등록일·연료·차종·차명·용도·원동기형식·모델연도·제작사·폐지등록 정보를 담는다(제목은 서울경기이나 claim상 범위는 전국으로 기록됨). 분석가나 지자체 담당자가 '지역별·제작사별로 이륜차 신규 등록과 폐지가 해마다 어떻게 변했나' 같은 등록 추이 통계를 만들 때 쓴다. 전역 조인 키가 없어 관할관청명·등록관청명 같은 기관명이나 폐지차량시도코드를 이름·코드 매핑해 다른 지역 통계와 붙여 쓴다.
description_portal: 이륜자동차정보는 2013년 1월 1일 이후 등록(신고)되어 운행중인 이륜자동차의 등록정보 등을 개방합니다.2013년 1월1일 부터 신고되어 있는 전체 등록이륜자동차 정보를 제공합니다.이륜자동차의 기본정보, 제원정보를 제공하고 있으며 제공하는 이륜자동차 정보는 이륜자동차등록번호(뒷2자리 마스킹),  관할관청명, 등록관청명, 최초등록일, 사용연료명, 차종명, 차종유형명, 차종분류명, 차명(모델), 용도구분명, 원동기형식명, 모델연도, 제작자명(브랜드), 폐지등록일, 폐지등록구분명, 폐지차량시도코드 항목을 제공합니다.이륜자동차정보를 활용하여 이륜차 등록 추이를 알 수 있는 통계자료 생산이 가능합니다.
