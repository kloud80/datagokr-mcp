summary_user: 자동차검사관리시스템에서 검사방법·사용연료·차종·제작기간별로 적용되는 배출가스 허용 기준값(기준값1~5)과 적용 기간을 담은 기준표 샘플로, 약 11KB 분량의 CSV 파일이며 전국 단위의 비공간 자료이다. 정비업자나 차량 소유자가 '내 차의 연료·차종·제작연월이면 검사 때 어떤 배출가스 기준을 적용받는가'를 확인하거나, 분석가가 제작 시기에 따른 기준 강화 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 검사 결과 데이터와는 검사방법코드·연료 구분·차종·제작일자 같은 조건 값을 맞춰 이어 쓴다.
description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 체계적으로 관리하는 자동차검사 자료 중 일부로, 검사구분(정기검사, 종합검사)별, 연료별, 차종(승용, 승합, 화물, 특수)별, 제작년월일별로 세분화된 배출가스 검사 결과 및 기준치 정보를 포함하는 데이터 샘플입니다. 이 자료는 각 조건에 따른 배출가스 허용 기준과 실제 검사 결과를 비교 분석할 수 있어, 환경 규제 준수 확인과 정책 수립, 자동차 환경 성능 개선을 위한 연구에 중요한 기초 자료로 활용할 수 있는 자료 샘플입니다.
