summary_user: 대전광역시에서 발급된 개인택시 면허 현황을 구분별로 나누어 2010년부터 2020년까지 연도별 열로 담은 소규모 집계표(CSV 약 380바이트)이다. 택시 정책 담당자나 분석가가 '대전의 개인택시 면허 발급이 연도별로 늘었나 줄었나'를 보고 택시 공급·수급 균형을 진단할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 지역명(대전광역시)을 기준으로 직접 맞춰 이어 써야 한다.
limits: 연도별 집계표라 면허 건별 내역이나 운전자·차량 단위 정보는 없고, 다른 데이터와 코드로 바로 조인할 키도 없다. 열이 2010~2020년으로 고정된 가로형 표라 분석하려면 연도를 행으로 바꿔야 한다.
