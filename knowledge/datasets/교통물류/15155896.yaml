description_portal: 부산광역시 북구 소관지역을 대상으로 안전신문고를 통해 신고된 불법주정차 신고 현황을 나타내는 데이터로, 신고일시 과태료부과여부 단속장소가 데이터로 나와있습니다. 단속구분의 경우 부과는 과태료 부과를 나타내고, 비부과는 과태료 미부과, 대기의 경우 잘못된 신고 또는 이송된 건으로 처리가 되지 않은 자료를 나타냅니다. 단속장소의 경우 안전신문고 신고자가 신고한 장소와 동일합니다. 해당 데이터를 통해 불법주정차 주민신고제인 안전신문고를 통해 신고한 불법주정차의 신고일시, 과태료 부과여부, 신고장소 현황을 알 수 있습니다.
