summary_user: 대구 달서구가 운영하는 개방공유 주차장을 시설 한 곳당 한 행으로 정리한 CSV 파일(약 4KB)로, 개방시설명·도로명주소·위도경도·주차면수·운영시간·운영방법·개방일시·관리부서를 담는다. 달서구 주민이나 방문자가 '집이나 목적지 근처에 무료로 개방된 학교·기관 주차장이 어디 있고 몇 시에 쓸 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 전국주차장정보표준데이터 같은 다른 자료와는 도로명주소나 좌표(위도·경도)를 맞대어 연결해야 한다.
