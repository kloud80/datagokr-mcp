summary_user: 전주시 관내 시내버스 승강장(정류장)을 건별로 담으며, 정류장 서비스 ID·표준 ID·한글 이름·x/y 좌표를 API로 조회한다. 버스 앱·지도 서비스 개발자가 '이 정류장의 위치와 식별번호가 무엇인가', '이 정류장에 어떤 버스가 접근 중인가'를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않아 정류장 표준 ID(stopStandardid)나 정류장 이름·좌표로 같은 기관의 노선·도착 정보나 다른 정류장 데이터와 맞춰 쓴다.
description_portal: 전주시  승강장 정보 서비스는 API를 제공하며 전주시 관내 시내버스 운행과 관련된 노선정보, 승강장정보, 실시간 운행정보, 환승정보 및 교통 소통정보를 시스템 간 연계를 통해 제공하기 위해 구축된 서비스형 데이터입니다. 본 API는 노선 운영 정보, 정류장 위치 및 식별 정보, 버스 실시간 위치 및 도착 예정 정보, 노선 간 환승 가능 정보, 도로 구간별 교통 소통 현황 등을 요청·응답 방식으로 제공하여 외부 시스템과의 연계 활용이 가능하도록 구성되었습니다.특히 정류장ID 및 노선번호 기반 데이터 연계를 지원하여 지도 기반 서비스, 경로 안내 서비스, 실시간 도착 알림 서비스, 교통 빅데이터 분석 및 스마트 교통 플랫폼 구축 등에 활용할 수 있도록 설계되었습니다. 이를 통해 시민은 보다 정확한 대중교통 정보를 제공받을 수 있으며, 개발자 및 기업은 교통정보 서비스를 개발·고도화하는 데 활용할 수 있습니다.전주시는 본 API를 통해 대중교통 정보의 실시간성과 활용성을 강화하고 데이터 기반 교통행정을 지원하는 것을 목표로 하며, 노선 변경, 운행계통 조정, 시스템 개선 사항 등을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 서비스는 전주시 관련 부서에서 제공·관리합니다.
