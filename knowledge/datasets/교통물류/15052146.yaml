summary_user: 건설기계조종사 경력관리 대상자의 승인일자, 현 소속 회사명·입사일, 사업종류, 조종하는 기계종류, 회사 우편번호·주소를 개인 단위 건별로 담은 전국 범위 CSV 파일이다. 개인택시 면허 요건(건설기계 경력 3년)과 연계된 경력관리 현황을 보고, 어느 지역·기계종류·사업종류에 경력 등록 조종사가 많은지 파악하려는 분석가나 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 회사주소·우편번호를 행정구역으로 매핑하거나 회사명·기계종류 이름을 맞춰 다른 건설기계·사업체 자료와 잇는다.
description_portal: '- 목적 : 건설기계조종사 경력 관리 업무의 효율적 수행을 통한 개인택시 면허 발급 제도 지원 및 민원편의 제공- 근거 : 건설기계관리법 제30조의2 및 동법 시행령 제18조의2, 건설기계조종사의 경력관리 방법 및 절차 등에 관한 규정(고시 제2009-1205호), 여객자동차 운수사업법 시행규칙 제19조제1항- 정의 * 건설기계조종사 : 1종 대형 운전면허를 소지하고 건설기계를 조종하는 자 * 영업용 건설기계조종사 : 건설기계대여업에 사용되는 건설기계를 조종하는 자 * 자가용 건설기계조종사 : 영업용 건설기계조종사 이외의 건설기계를 소유한 업체에 취업하여 소속업체의 건설기계를 조종하는 자(업체에 고용된 영업용 건설기계조종사 포함)- 내용 * 건설기계조종사에 대한 개인택시 면허 취득을 위한 제도적 지원이며, 건설기계 경력 3년 충족시 개인택시 운전면허 취득 가능. * 건설기계조종사에 대한 근무이력을 관리하여 국가가 해당 경력을 확인서로 발급하여 편의 제공'
