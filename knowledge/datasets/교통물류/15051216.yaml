summary_user: 인천도시철도 2호선 역사별 대합실과 상하행 승강장의 실내공기질 측정결과(미세먼지·초미세먼지·이산화탄소·포름알데히드·일산화탄소 등)를 측정지점 단위로 담은 2025년 6월 30일 기준 파일이며, 27개역 중 5개역(검단오류·왕길·검바위·인천대공원·운연)은 결과가 없다. 지하철 이용자나 환경·보건 분석가가 '내가 자주 타는 2호선 역 승강장의 미세먼지 농도가 기준 이내인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역사 정보나 다른 노선 공기질 데이터와는 역사명(구분)으로 이름을 맞춰 연결해야 한다.
