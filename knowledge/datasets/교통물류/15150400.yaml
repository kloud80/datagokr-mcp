description_portal: '한국교통안전공단은 안전한 저고도 운항환경 조성을 위해 국내 설치된 항공장애 표시등 및 주간표지를  정기적으로 검사하고 있습니다.해당 데이터는 항공장애 표시등 업무관리시스템의 사용자 메뉴에 대한  안내하고 있는 정보입니다.메뉴명(검사표관리, 사용자관리, 권한관리, 드론검사현황, 시설정보관리, 검사 수행 등), 사용여부, 메뉴가 최초로 등록된 일자 등에 대한 정보입니다. 이를 통해 공역 내 항공장애물(장애등, 주간표지 등) 분포와 특성을 파악하고, 안전기준에 따른 적절한 조치를 위한 기초 자료로 활용됩니다.작성 기준 연도 :  2019~2025'
