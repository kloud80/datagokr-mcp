status: active
summary_user: 인천공항 여객기 정기운항 스케줄을 시즌(동계/하계+연도)별·편명 단위로 담으며, 편마다 정기운항 시작·종료일, 요일별 취항 여부, 출발시간, 출발터미널, 항공사, 도착지 공항, 코드쉐어(마스터편명) 정보를 준다. 면세점 사업자가 "고객이 입력한 출국 편명·날짜가 실제로 그 요일에 인천에서 운항하는 편인가"를 대조할 때 쓴다. 전역 조인 키는 없고, 항공편명(flightId)·항공사 IATA 코드·도착지 공항 IATA 코드를 이름·코드 매핑으로 다른 운항정보나 공항코드 데이터와 맞춰 쓴다.
limits: 오퍼레이션 2개 중 도착편 조회(/getSPaxFlt4DutyFreeArrivals)는 최소 파라미터로 호출했을 때 응답이 없었다. 정기 스케줄이므로 당일 실제 결항·지연은 담지 않는다. 개발계정은 하루 500회로 호출이 제한된다.
