description_portal: 면세점 기업을 위한 맞춤형 데이터로,면세품 구매를 위해 면세점 고객이 입력한 출국정보와 실제 운항정보 대조를 위한 여객기 운항편  조회 서비스입니다. 각 스케줄에 따른 편명 별 유니크 코드값, 데이터 생성시간, fid 기준 메세지 발생 형태, 정기운항 시작시간,시즌명, 정기운항 시작일, 정기운항 종료일, 요일별 취항여부,코드쉐어,마스터편명,편명,터미널구분,항공사명,항공사코드(IATA),도착지 공항명과 도착지 공항코드,추가현황1&2 정보 등의 데이터를 제공합니다.시즌별로 데이터를 제공하며 개발계정 일 500 트래픽, 운영 계정 신청 시 일 10000 트래픽을 제공합니다.
