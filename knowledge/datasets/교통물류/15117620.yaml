description_portal: 한국가스공사 평택기지본부 내 부두 및 물양장에서 해상 기름 유출 시 확산을 방지하기 위해 설치된 해양오염 방제설비 현황 정보입니다. 해양오염 사고 대응 체계 구축 및 관련 기관 간 원활한 정보공유를 목적으로 수집되었으며, 부두 이용자, 인근 부두 운영사 및 평택당진항 해상교통관제센터, 평택지방해양수산청, 해양경찰 등 관련기관 정보를 공유합니다.데이터 구성 항목으로는 방제설비 구분, 설치장소, 상세위치, 종류, 치수, 설치형태 등 방제설비의 제원 및 배치에 관한 상세 정보가 포함됩니다. 본 데이터를 활용하면 평택당진항 해상교통관제센터, 평택지방해양수산청, 해양경찰 등 유관기관과의 원활한 정보공유가 가능합니다. 또한 해양오염 재난 발생 시 신속하고 체계적인 대응 매뉴얼 작성, 방제 역량 강화 계획 수립, 정책 의사결정 지원, 부두 운영사 및 인근 사업장의 방제 계획 수립에 참고자료로 활용할 수 있으며, 해양환경 보호 정책 연구와 연안 재난 대응 역량 강화에도 크게 기여할 수 있습니다.
