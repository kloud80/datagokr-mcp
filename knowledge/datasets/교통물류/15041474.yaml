summary_user: 대구교통공사가 운영하는 대구2호선 역별로 소화기가 놓인 층·상세위치와 소화기 종류, 보유 대수를 위치 단위로 담은 CSV 파일(약 6KB)이다. 철도 안전 담당자나 분석가가 "대구2호선 어느 역 어느 층에 어떤 소화기가 몇 대 있는가"를 확인하거나 역별 소화설비 배치를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노선의 소화기설비·역 시설 데이터와는 역명·선명 같은 이름 매핑으로만 이어 쓴다.
