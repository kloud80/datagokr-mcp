description_portal: 대구교통공사에서 운영하는 대구2호선의 소화기설비에 대한 데이터로 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 상세위치, 소화기종류, 보유대수의 데이터가 있습니다.소화기는 불을 끄는 데 쓰이는 기구의 한 가지다. 주로 화재가 발생하는 등의 비상 사태에 사용되며, 분사하면 쉽게 불을 끌 수 있는 화학 물질이 채워져 있다. 손으로 들고 사용할 수 있으며 조작이 쉬워 화재 초기 단계에 사용한다.소화기 두 가지로, 분사 방식과 충전된 약제의 형태에 따라 분류할 수 있다. 전자의 경우 가압식과 축압식, 자기방출 방식, 자기반응식 등으로 구분할 수 있으며, 후자의 경우 포말 소화기, 분말 소화기, 할론 소화기, 이산화탄소 소화기 등으로 구분할 수 있다.
