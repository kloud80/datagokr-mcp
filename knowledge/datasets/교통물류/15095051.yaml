summary_user: 인천공항을 출발·도착하는 화물기 정기운항편의 일정을 편명 단위로 담으며, 항공사·상대 공항·운항 시작일과 종료일·요일별 운항 여부·시즌 정보를 국문·영문·중문·일문으로 제공한다. 물류 사업자나 화주가 '이번 시즌 인천에서 특정 공항으로 가는 화물기가 어느 항공사, 무슨 요일에 뜨는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 운항·통계 데이터와는 공항코드(airportCode)나 편명·항공사 이름을 매핑해 잇는다.
description_portal: 인천국제공항공사에서 제공하는 화물기 정기운항편 일정정보 서비스입니다. 공항코드 값을 검색조건으로 하여 인천공항 출발/도착 화물기의 항공사 이름,공항이름,공항코드,정기운항편 일정 시작일,종료일,편명,요일정보,시즌코드 값 등의 정보를 다국어(국문,영문,중문,일문)로 나타내는 화물기 정기운항편 일정 정보 서비스입니다. 시즌별 데이터를 제공합니다.개발 계정 일 1000트래픽, 서비스 URL 및 상세 이용사례와 함께 운영계정 신청 시 일 1000000 트래픽을 제공합니다. 데이터포맷은 JSON과 XML을 모두 제공합니다.
