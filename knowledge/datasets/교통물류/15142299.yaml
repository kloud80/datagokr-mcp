summary_user: 한국해양교통안전공단이 운항관리하는 연안여객선의 면허항로를 항로 단위로 담은 전국 범위 목록으로, 면허항로코드·면허항로명과 낙도보조항로 여부를 담는다. 도서 주민·여행객용 여객선 안내 서비스를 만드는 개발자나 분석가가 "어떤 섬 항로가 면허항로이고 그중 낙도보조항로는 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 연안여객선 교통정보(운항상태·스케줄 등)와는 면허항로코드(lcns_seawy_cd) 같은 기관 내부 코드나 항로명 매핑으로만 이어 쓴다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로공단의 운항관리 대상 연안여객선의 면허항로 정보를 포함하고 있습니다.면허항로명, 면허항로코드, 기항지명, 기항지코드, 낙도보조항로여부 등이 포함된 정보 입니다.여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다."
