description_portal: '교차로 교통량 정보는 부천시 주요 교차로별 시간대(1시간 단위) 교통량 집계자료로,각 교차로에서 일정 시간 동안 통과한 차량의 교통량을 기록한 데이터입니다.본 데이터는 2026년 1월 한 달 동안의 교통량을 대상으로 하며,시간별 교통 흐름 분석, 혼잡도 평가, 교통정책 수립 및 도로 운영계획 수립 등에 활용할 수 있습니다.데이터는 다음과 같은 항목으로 구성되어 있습니다.- 시간: 교통량 집계 기준 시각 (YYYY-MM-DD HH:00)- 교차로명: 교통량이 측정된 교차로 명칭- 교통량: 해당 시간대 교차로 통과 차량 수(대)참고사항- 본 자료는 시간대별 교통량을 단순 집계한 값으로, 차량 종류별 구분은 포함하지 않습니다.- 본 데이터는 개인정보를 포함하지 않으며, 교통량 분석 목적의 공공 활용을 위해 개방됩니다.'
