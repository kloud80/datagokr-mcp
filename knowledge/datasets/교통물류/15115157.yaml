summary_user: 경상북도 영양군 관내 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 목록으로, 상호·사업의 종류·등록 차량대수·주사무소 도로명/지번 주소와 우편번호·영업상태(신규 또는 폐지)·데이터기준일자를 담는다(CSV 파일 212바이트로 매우 작은 규모). 화주나 주민이 "영양군에 주사무소를 둔 허가 일반화물 운송사가 어디이고 차량을 몇 대 보유하는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭으로만 잇고, 전국 단위 허가 여부 대조는 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
description_portal: '이 자료는 경상북도 영양군 일반화물자동차운송사업자 현황을 정리한 데이터입니다. 데이터는 총 7개 항목으로 구성되어 있으며, 각 항목의 내용은 다음과 같습니다.상호: 업체명을 나타냅니다.면허종류: 화물자동차운송사업 면허의 종류를 나타냅니다.차량대수: 해당 일반화물 업체로 등록된 차량의 총 대수를 나타냅니다. 주소: 화물자동차운송사업 업체의 주사무소 주소지를 나타냅니다.영업상태: 해당 화물자동차운송사업 업체의 운영 여부(신규 혹은 폐지)를 나타냅니다. 데이터 기준일자: 정보가 수집되거나 갱신된 날짜로, 데이터의 최신성을 확인할 수 있습니다.이 자료의 주요 활용 목적은 관내 일반화물자동차운송사업자 현황을 안내하는 것입니다.'
