summary_user: 서울교통공사가 관할하는 1~8호선 역사에 설치된 전동휠체어 급속충전기를 역 단위로 정리한 현황 파일로, 호선·역번호·역명·충전기 수·설치 위치를 담는다(포털 설명상 기준일자 2026년 2월 13일). 전동휠체어 이용자가 '타려는 역에 충전기가 있고 역 안 어디에 있는가'를 확인하거나, 교통약자 편의시설 확충 계획을 세우는 분석가가 역별 설치 현황을 볼 때 쓴다. 전역 공통 조인 키는 확인되지 않았으며, 역명이나 외부역코드(고유역번호)를 서울교통공사의 다른 역·시설 데이터와 맞춰 보는 방식으로만 연결할 수 있다.
