summary_user: 수도권 6호선 각 역을 한 행으로 하여 운영기관명, 노선명, 역번호, 역명과 영어·로마자·일본어·중국어(간체·번체) 표기, 환승역 여부, 유실물 취급 여부, 신설일자를 담은 역 목록 파일이다. 외국어 역명 안내판이나 다국어 노선도를 만들거나, 6호선 중 환승역이 어디인지 확인하려는 개발자·분석가가 쓴다. 전역 조인 키가 없어 다른 역 좌표·승하차 데이터와는 역명이나 역번호를 이름 매핑하는 방식으로만 이어 쓴다.
