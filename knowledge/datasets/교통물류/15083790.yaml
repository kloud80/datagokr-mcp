description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선, 인천2호선의 2025년 6월 30일 기준 교량시설물 내진실태 현황입니다.해당 데이터는 구분도로별,호선명,교량명,관리기관,위치,총연장,총폭,교량구조,상부구조,하부구조,준공연도,설계하중,성능평가결과,내진설계적용여부 항목으로 구성되어있습니다.인천1호선은 2건, 인천2호선은 8건의 교량시설물이 존재하고 이에 대한 교량시설물 내진설계정보와 성능평가결과가 포함되어있습니다.교량시설물 성능평가는 5년 주기로 시행되어 2025년 6월 30일 기준 미도래 교량의 경우 성능평가 결과를 기재하지 않았습니다.
