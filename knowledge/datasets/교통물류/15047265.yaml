summary_user: 서울특별시 도로 위 차선을 차선관리번호(TRFLN_MNG_NO) 단위로 한 건씩 담은 시설물 대장으로, 차선 코드 대·중분류, 상태, 고가 여부, 관할 경찰서·구·사업소, 설치일·교체일, 공사관리번호, 길이 등을 포함한다. 도로 관리 담당자나 교통 분석가가 "우리 구에서 설치나 교체가 오래된 차선은 어디이고 어느 사업소 관할인가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없다. 다른 데이터와는 구 코드·경찰서 코드 같은 서울시 내부 코드나 이름 매핑으로만 이어 쓴다.
description_portal: '서울특별시 차선 정보입니다. - 주요정보 : 상태, 차선관리번호, 차선코드분류, 고가, (신.구)경찰서코드, 작업구분, 표출구분, 관할사업소, 설치일, 교체일,  공사관리번호, 차선코드 등의 정보를 제공합니다.*용어설명차선 정보란?도로 위 차로(Lane)의 위치, 개수, 폭, 진행 방향, 용도 등을 나타내는 정보로 운전자에게 주행 가능 방향, 차선 변경, 교차로 접근, 버스·자전거 전용 차로 등을 안내하는 데 필수※ 제공부서 : 서울특별시 교통실 교통운영관 교통운영과(02-2133-2476)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
