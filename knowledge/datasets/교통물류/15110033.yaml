summary_user: 대구광역시 달서구의 불법주정차 민원·단속 누적 정보, 공영·민영·개방공유 주차장 운영 현황, 어린이·노인장애인 보호구역 현황을 주소·좌표 단위 개별 행으로 담은 API이며, 전체 건수는 20,002건이다. 주민이나 분석가가 "달서구에서 불법주정차 민원이 많은 곳 근처에 공영주차장이나 개방 주차장이 있는가", "어린이보호구역에 CCTV가 설치돼 있는가" 같은 질문을 확인하는 데 쓴다. 지번주소(noAddr)·도로명주소(roadAddr)와 위도 좌표(lat)가 조인 키이므로, 이를 기준으로 다른 주소 기반 교통사고·시설 데이터와 연결하거나 지도에 겹쳐 쓴다.
description_portal: '대구광역시 달서구 교통안전데이터로 불법주정차와 관련된 민원 발생 및 단속 누적 정보, 공영·민영 등 주차장 운영 현황, 각 보호구역 현황 등이 포함되어 있습니다.교통안전데이터 오픈API 7종은 1. 불법주정차 민원 정보 2. 불법주정차 단속 정보 3. 공영주차장 운영 현황  4. 민영주차장 운영 현황 5. 개방공유 주차장 현황 6. 어린이보호구역 현황  7. 노인장애인보호구역 현황으로 구성되어 있습니다. 대구광역시 달서구 교통안전 지도 서비스 : https://www.dalseo.daegu.kr/dmap/ds_park/'
