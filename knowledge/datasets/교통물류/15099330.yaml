summary_user: 서울교통공사 1~8호선 역별·일별로 시간대(06시 이전~24시 이후)와 승객유형별 승하차 인원을 담은 건별 원천 파일이며, 검증 수신 773,508행에 2026-01-01~2026-06-30 기간이 들어 있다. 상권 분석가나 지자체 담당자가 특정 역의 시간대별 유동 규모가 어떤지, 출퇴근 시간대에 어떤 승객유형이 많은지 알아볼 때 쓴다. 전역 조인 키는 없어서 호선명·역번호·역명으로 같은 기관의 다른 역 자료와 이름 매핑으로만 잇는다.
description_portal: 서울교통공사 1-8호선 역별 일별 시간대별 승객유형별(일반, 어린이, 중고생, 청소년, 우대권 등) 승하차 인원 정보입니다. 해당 데이터는 2021년 1월 이후 데이터부터 반기 주기로 제공합니다. (단, 2025년 12월까지 업데이트 합니다.) 우대권 권종은 노인(경로), 장애인 권종, 국가 유공자 권종이 포함된 자료입니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다.마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
