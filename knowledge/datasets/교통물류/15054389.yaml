summary_user: 경상북도 영양군 관내 농어촌버스의 노선별 시간표를 담은 xlsx 파일(약 24KB)로, 제목 행 기준 2025년 11월 11일 현재 시간표이며 첫 행이 제목이고 나머지 열은 이름 없이 42열로 펼쳐진 표 형태다. 영양군 주민이나 방문객이 특정 마을·정류장에서 읍내로 가는 버스가 몇 시에 있는지 확인하거나, 분석가가 교통 소외 지역의 운행 횟수를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 정류장·노선 원장이나 실시간 도착 정보와는 정류장명·노선명을 이름으로 맞춰 이어 써야 한다.
limits: 표준 컬럼명 없이 엑셀 서식 그대로(헤더 대부분이 이름 없는 열)라 기계 처리 전에 표 구조를 직접 정리해야 한다. 공통 조인 키가 없어 다른 버스·정류장 데이터와의 연결은 이름 매칭에 의존하며, 영양군 한 곳의 시간표만 담는다.
