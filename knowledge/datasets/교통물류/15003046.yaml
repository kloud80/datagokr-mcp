summary_user: 남산 1·3호 터널에서 혼잡통행료를 징수한 차량 통행량을 날짜별로 집계한 파일로, 일별 합계와 함께 징수·미징수·면제 차량 수, 일반차량·경차·전자태그 구분, 현금·선불카드·후불카드·쿠폰 등 납부수단별 대수와 환불 건수를 담는다(약 32KB CSV). 남산 터널을 지나는 차량이 날마다 얼마나 되는지, 경차와 면제차량 비중이 어느 정도인지, 이용자가 어떤 납부수단을 주로 쓰는지 살피는 분석가·정책 담당자의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜(날짜)를 기준으로 맞추거나 같은 기관 자료와 이름으로 대조해 이어 쓴다.
description_portal: 교통혼잡 통행량 정보는 남산 1·3호 터널에서 징수하는 혼잡통행료의 통행 데이터를 제공합니다. 유형별 제공되는 데이터를 통해 남산 1·3호 터널의 경차 통행량, 면제차량의 대수, 납부수단(현금, 카드, 쿠폰 등)별 비율 등 통행량 현황과 이용자들이 선호하는 납부수단 등을 파악하고 활용하실 수 있습니다.※ 제공하는 정보- 남산 1,3호 터널 일별 통행량 정보- 유형별(일반, 경차, 선·후불 카드, 쿠폰 등) 차량 통행량 및 면제 차량 통행량*일부 칼럼은 혼잡통행료 징수 정책에 따라 미사용되거나 변경될 수 있습니다.
