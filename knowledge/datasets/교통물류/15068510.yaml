description_portal: '한국철도공사의 연도별 컨테이너 수송실적(톤-키로) 데이터는 일반, 중량, 석탄류 등 다양한 품목의 컨테이너를 철도를 통해 운송한 실적을 연도별로 ‘톤-키로’ 단위(운송 무게 × 거리)로 집계한 공식 통계 자료입니다. 이 데이터를 통해 한 해 동안 전국 철도망을 활용해 실제로 얼마나 많은 컨테이너 화물이, 얼마나 먼 거리를 이동했는지 그 규모와 변동을 객관적으로 파악할 수 있습니다.이 데이터를 분석하면 연도별 전체 컨테이너 화물의 운송량 및 운송거리 변화 추이, 특정 시기에 컨테이너 수송이 증가하거나 감소하는 원인(예: 산업구조 변화, 수출입 동향, 대규모 건설경기, 물류 정책 변화 등), 운송 효율성 및 철도 물류 네트워크 활용도, 그리고 다른 운송수단과의 점유율 변화까지 다각적인 인사이트를 얻을 수 있습니다. 특히 동일한 톤수라 하더라도 운송거리가 달라지면 톤-키로 실적이 크게 변화하므로, 장거리 철도 운송 활성화나 주요 산업벨트간 물류 흐름의 전환 현상도 유추할 수 있습니다.이 자료는 국가 물류 및 교통정책 수립, 산업별 화물 운송시장 실태 분석, 컨테이너 기반 철도운송 동향 예측, 수송 효율성 평가, 도시 및 지역경제 연구 등에서 참고자료로 널리 활용될 수 있습니다. 또한 환경 및 에너지 정책 효과 평가, 학술 논문이나 정책보고서, 물류·운송업계 실적 분석 등 민간·공공 전 분야에서 신뢰성이 높은 기초 통계자료로 활용 가치가 높습니다.'
