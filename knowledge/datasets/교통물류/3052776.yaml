summary_user: 서울교통공사가 운영하는 1~8호선의 호선별 운행 제원(영업구간·영업거리·역수·소요시간·보유 차량 칸수·편성수·표정속도·평일 주행거리·출근/평시 운행간격·평일/휴일 운행횟수)을 호선 단위로 집계한 작은 표(CSV 886바이트)다. 분석가나 시민이 '어느 호선이 출근시간 배차간격이 가장 짧고 표정속도가 빠른가'처럼 호선 간 운행 수준을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 호선 이름(호선)을 기준으로 승하차·혼잡도 같은 호선별 자료와 이름 매칭으로만 잇는다.
description_portal: 서울교통공사의 열차운행 현황과 관련 데이터입니다.열차 운행 현황 정보는 서울교통공사에어 운행하는 1-8호선에 대한 영업구간, 영업거리(km, 해당 호선 중 서울교통공사의 영업구간 거리), 역수(개), 소요시간(분), 보유편성차량수(칸, 해당 호선의 보유 편성수 x 해당 호선의 1편성을 구성하는 1편성당 칸수), 열차편성수(1편성당 칸수), 표정속도(km/h), 열차주행거리(평일 km/일, 평일 기준 해당 호선의 열차가 하루동안 운행한 거리),운행시격_RH(출근), 운행시격_NH(평시), 운행횟수_평일, 운행횟수_휴일 정보로 구성되어 있습니다.
