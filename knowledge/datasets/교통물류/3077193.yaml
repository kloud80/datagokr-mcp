summary_user: 부산교통공사 도시철도 역사에 설치된 자전거 보관소를 호선·역명별로 한 줄씩 정리한 파일로, 설치 위치·관리 주체(지자체 등)·보관 가능 대수를 담는다(CSV 약 16KB). 부산 시민이 '집 근처 지하철역에 자전거를 세워둘 곳이 있고 몇 대까지 들어가나'를 확인하거나, 분석가가 역별 자전거-도시철도 환승 여건을 비교하는 데 쓴다. 전역 조인 키가 없어 역 좌표·승하차 인원 같은 다른 역 데이터와는 호선·역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 부산교통공사 도시철도 역사에 설치된 자전거 보관소 현황을 호선별·역사별로 정리한 자료입니다.각 보관소의 설치 위치, 관리 주체(지자체 등), 수용 가능 자전거 대수 등의 정보가 포함되어 있으며, 대중교통과 자전거 간 연계 이용을 위한 기반 시설 현황을 파악할 수 있습니다. 해당 데이터는 도시철도와 자전거 간 환승 접근성 분석, 친환경 교통수단 활성화 전략 수립, 생활형 교통체계 개선 등 다양한 정책 수립에 활용 가능합니다. 또한 역사별 출입구 공간 활용도, 자전거 수요 예측, 교통약자 접근성 분석, 마이크로모빌리티 확산 등과 관련한 정책 수립과 연구에 활용될 수 있으며, 저탄소 교통 환경 조성을 위한 실무 중심의 공공데이터입니다.
