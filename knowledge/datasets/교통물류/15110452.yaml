summary_user: 대전광역시 도로관리시스템에 등재된 도시계획도로 계획선을 선형 단위로 담은 건별 공간 데이터로, 각 선의 지리정보(WKT)와 분류·규모·지형지물부호가 들어 있으며 약 16.5MB 분량의 CSV 파일 하나로 받는다. 개발 예정지 주변에 계획도로가 지나는지, 어느 정도 폭의 도로가 계획돼 있는지 확인하려는 사업자·도시계획 분석가가 지역 접근성 변화를 미리 가늠하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로, 지리정보 좌표로 필지·행정구역 경계와 공간 중첩하거나 같은 기관의 코드·명칭으로 맞춰 연결한다.
