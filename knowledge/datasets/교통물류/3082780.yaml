summary_user: 광주 지역 법인 택시 운수회사를 한 행에 한 업체씩 담은 업체 목록으로, 관할관청·회사명·면허대수·등록대수·전화·팩스·주소와 데이터 기준일자를 담는다. 택시 사업자나 교통 분석가가 '광주에서 면허대수가 많은 택시회사는 어디이고 어느 구에 있나'를 확인하거나 업체 연락처를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 운수회사명이나 주소(도로명)를 문자열로 맞춰 연결해야 하며, 주소를 지오코딩하면 지역별 분포를 볼 수 있다.
description_portal: 광주광역시 공공데이터포털에 올라온 “광주광역시 택시 사업체 현황” 자료는,• 조합명, 업체명, 면허대수, 전화번호, 소재지(도로명 주소), 입력기관, 기준일자 등 항목 포함• 2025년 6월 10일 기준으로 76개 행이 수록됨 **정보 보완 관리 **주요 정보 (팩스번호, 이메일, 대표자명 등) 추가 확보 시, 대중교통과와 협조더 많은 항목이 필요하시면 **광주광역시 대중교통과(☎ 062‑613‑4531)**에 연중 언제든지 최신 정보 요청이 가능합니다.특히 팩스번호, 대표자·담당자, 이메일, 업력 등은 별도 요청 시 추가 확보가 가능하며, DB를 강화하시기 유리합니다.
