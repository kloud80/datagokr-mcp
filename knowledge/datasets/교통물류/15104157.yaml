summary_user: 인천 부평구 공공시설에 설치된 전기차 충전기를 한 대씩 담은 파일로, 운영기관·충전소명·충전기 식별번호·급속/완속 유형·설치 시설 종류·주소·이용 가능 시간·최대 충전용량(kW)을 기록한다. 주민이나 전기차 운전자가 집 근처 공공시설 중 급속 충전기가 있고 밤에도 쓸 수 있는 곳을 찾을 때, 분석가가 시설 종류별 충전 인프라 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 충전소 이름으로 맞춰 붙여야 한다.
description_portal: '공공시설에 설치된 전기차 충전소의 운영기관, 위치, 충전기 정보, 이용 가능 시간 등을 수록한 데이터.친환경 교통 인프라 확충 현황을 파악하고, 전기차 보급 확대, 에너지 전환 정책, 주민 편의 향상 등에 활용 가능하다.활용 목적 및 특징– 전기차 충전소 설치·운영 현황 분석– 충전기 타입·용량별 충전 인프라 파악– 주소·시설구분 기반 입지 특성 및 이용 가능 시간 확인– 친환경 교통 활성화 및 에너지 정책 수립 근거 자료 활용주요 항목 설명● 운영기관: 충전소를 설치·운영하는 기관 명칭● 충전소: 전기차 충전소의 명칭 또는 위치● 충전기ID: 충전기를 구분하는 고유 식별번호● 충전기타입: 급속·완속 등 충전기 유형● 시설구분: 충전소가 설치된 공공시설의 종류● 주소: 충전소 소재지 주소● 이용가능시간: 충전소 운영 가능 시간대● 충전용량: 해당 충전기의 최대 충전 용량(kW)'
