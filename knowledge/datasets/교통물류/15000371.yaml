summary_user: 국제특급우편(EMS) 신청에 필요한 정보를 조회하는 API이며, 검증 호출에서는 국가명·영문국가명·국가코드·요금적용지역(chrgeApplcArea)으로 된 국가별 목록 87행을 받았다. 개인이나 온라인 판매 사업자가 특정 나라로 EMS를 보낼 수 있는지, 그 나라가 어느 요금 적용 지역에 속하는지 확인할 때 쓴다. 국가코드(nation)는 ISO 3166 2자리 국가코드와 맞아 국가코드를 쓰는 다른 무역·통계·환율 데이터와 이어 쓴다.
