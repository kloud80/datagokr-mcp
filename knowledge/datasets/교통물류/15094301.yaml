summary_user: 광주광역시 북구에 설치된 가로등 한 기마다 등록번호·표찰번호·지번주소·위도·경도를 담은 건별 위치 목록으로, 시군구 범위의 개별 주소·좌표 단위 CSV 파일(약 0.9MB)이다. 주민이 고장 난 가로등의 표찰번호로 위치를 확인해 신고하거나, 분석가가 어두운 골목·보행 안전 취약 구간을 지도에서 찾을 때 쓴다. 전역 조인 키는 없으므로 위도·경도 좌표를 기준으로 다른 도로 시설물이나 사고·범죄 위치 데이터와 공간적으로 겹쳐 쓰고, 다른 지자체 가로등 파일과는 같은 항목 이름을 맞춰 이어 붙인다.
description_portal: 광주광역시 북구 가로등 위치정보 데이터입니다.가로등 등록번호, 표찰번호, 지번주소, 위도, 경도의 항목에 대한 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 가로등이 설치된 장소인 도로변 특성상 해당 위치에는 도로명주소가 부여되지 않아 지번주소 데이터만을 제공합니다. 또한, 명확한 지번주소 확인이 어려운 경우 지번주소 컬럼에서 해당하는 셀을 공란으로 두었습니다.** 표찰번호가 부여되지 않았거나 정확한 표찰번호 확인이 어려운 경우 표찰번호 컬럼에서 해당하는 셀을 공란으로 두었습니다.
