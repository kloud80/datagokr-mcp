summary_user: 서울특별시 관악구의 주정차 위반 단속건수와 과태료 부과액(단속원금)을 과태료명·단속년월별로 집계한 시군구 단위 월별 자료이며, 파일 크기가 약 2KB인 작은 CSV입니다. 구청 교통 담당자나 분석가가 관악구에서 불법 주정차 적발이 월별로 늘었는지 줄었는지, 과태료 규모가 어떻게 달라졌는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 자치구 단속 자료나 지역 통계와는 시도·시군구 이름을 맞추고 단속년월로 기간을 맞춰 이어 쓴다.
