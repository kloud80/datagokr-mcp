description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구도시철도 1·2·3호선 각 역사에 설치된 소화기 현황을 제공합니다. 주요 항목은 역사명, 설치 위치(지상·지하 구분, 층수 등), 소화기 종류 및 보유 대수로 구성되어 있으며, 역사별 소방안전 설비의 배치 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 자료는 화재 예방과 초기 대응 체계 강화, 역사 시설 안전관리, 소방설비 유지관리 및 정기 점검 계획 수립을 위한 기초자료로 활용될 수 있으며, 비상대응 체계 구축, 안전관리 정책 수립 및 재난 대응 역량 강화를 지원하는 자료로 활용할 수 있습니다. 또한 도시철도 이용객의 안전한 이용환경 조성과 공공교통 시설의 안전성 향상을 위한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
