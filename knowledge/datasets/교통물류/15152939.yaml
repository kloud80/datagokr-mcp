description_portal: '- 신 기후체계 가동 및 국가 온실가스 감축 목표 달성을 위해 경제운전 생활화를 유도하여 교통부문 온실가스 배출 및 에너지 소비절감, 교통사고 감소 등에 기여하고자 정보를 제공하고 있습니다.- 개방데이터는 지속가능교통물류발전법 제48조, 시행령 제43조에 의해 한국교통안전공단 교통안전체험교육에서 매년 에코드라이브 체험교육을 진행하고 있으며, 에코드라이브 체험교육의 결과자료(연비개선율, 연료소모량 개선율, CO2배출량 개선율)를 제공하는 현황 데이터 정보 입니다.※ 제공되는 데이터는 한국교통안전공단에서 별도 제공되는 데이터와 차이가 있을 수도 있음을 인지하여 주시기 바랍니다.'
