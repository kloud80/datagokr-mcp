summary_user: 한국도로공사가 관리하는 고속도로·일반도로의 교통량 조사 지점을 한 행씩 담은 목록으로, 노선·지점번호·조사 구간·시작/종료 연장(km)과 도·시군·읍면·동리 주소를 포함하며 범위는 전국이다. 교통 분석가나 입지 검토자가 '이 노선의 교통량은 어느 구간, 어느 행정구역에 있는 지점에서 재는가'를 확인할 때 쓴다. 다른 데이터와 바로 맞출 전역 조인 키는 없어서, 같은 기관의 교통량 자료와는 노선·지점번호로, 행정구역 자료와는 시도·시군 이름 매칭으로 잇는다.
