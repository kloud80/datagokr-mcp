description_portal: 해당 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 도로구간별 횡단보도 설치 현황을 공간 위치 기반으로 정리한 정보입니다. 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분 등 기본 속성과 더불어 TM 중부 GRS80 기준 위도·경도 좌표를 포함하고 있으며, 각 횡단보도의 위치 및 특성 정보를 함께 제공합니다. 횡단보도는 보행자가 안전하게 도로를 횡단할 수 있도록 설치된 대표적인 보행시설로서, 설치 간격과 밀도를 통해 보행 접근성을 평가할 수 있습니다. 해당 데이터는 횡단보도 분포를 파악함으로써 보행 안전 취약 지역을 진단하고 시설 확충이나 개선이 필요한 구역을 도출하는 데 활용됩니다. 본 자료는 2022년 기준으로 1회성 수집된 정보이며, 참고용 데이터로 활용하는 것이 적합합니다.
