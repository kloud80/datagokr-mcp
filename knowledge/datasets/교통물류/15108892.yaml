summary_user: 경기도 의왕시의 횡단보도를 한 건씩 위치(위도·경도)와 함께 담은 파일로, 도로구간번호·횡단보도 폭과 길이·방식·설치일자·보도턱 낮춤·장애인시설 유무 같은 시설 속성을 포함하며 보행안전지수 지도 시각화를 위해 만든 중간 데이터다. 시 교통·도시계획 담당자나 분석가가 '의왕시에서 횡단보도 간격이 넓거나 보도턱 낮춤이 없는 보행 취약 구간은 어디인가'를 찾는 데 쓴다. 전국 공통 조인 키는 없어 좌표로 다른 공간 데이터와 겹쳐 보거나, 행정읍면동코드·도로구간번호로 같은 기관의 도로·보행 자료와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 기관 데이터와는 좌표나 이름·코드 매핑으로만 연결된다. 범위가 의왕시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다. 포털 설명상 2022년 기준 1회성 수집 자료라 현재 현황과 다를 수 있어 참고용으로 써야 한다.
