summary_user: 인천도시철도 1호선 휴일 상선(송도달빛축제공원→검단호수공원 방향) 열차별로 시발역·종착역·열차번호와 33개 역의 출발시각을 한 행에 담은 시각표 파일(csv)이며, 2025년 6월 개통한 검단호수공원·신검단중앙·아라역이 반영돼 있다. 휴일에 특정 역에서 검단 방향 첫차·막차나 배차 간격을 확인하려는 이용자, 휴일 운행 횟수를 역별로 세어 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 역 이름을 맞춰 연결해야 하며, 같은 기관의 평일·하선 시각표나 역별 승하차 데이터와 역명 기준으로 이어 쓴다.
description_portal: 인천교통공사에서 운영하는 인천도시철도 1호선 휴일 상선(송도달빛축제공원역에서 검단호수공원역 방향) 2025년 4월 12일 기준 열차운행시각표 입니다.해당데이터는 시발역, 종착역, 열차번호, 경유역별 열차출발시각 정보로 구성되어있습니다.인천지하철 1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역을 운영하고 있습니다.인천1호선 휴일 상선 열차운행시각표의 시발역은 동막역, 송도달빛축제공원역, 예술회관역, 작전역입니다.또한 종착역은 검단호수공원역, 계양역, 신연수역입니다.대부분의 시발역과 종착역은 송도달빛축제공원역과 검단호수공원역입니다.인천1호선 휴일 상선 운행시간은 역별로 상이하나 전체적인 열차운행은 05시 30분에 시작하여 익일 01시 01분에 종료됩니다.이 자료는 2025년 6월 28일 개통한 인천 1호선 3개역(검단호수공원역, 신검단중앙역, 아라역)이 반영된 데이터입니다.
