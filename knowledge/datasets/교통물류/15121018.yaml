summary_user: 부산광역시 교통정보서비스센터가 운영하는 AVI(차량자동인식) 장치 지점별로 생성시간, 지점명, 경도·위도, 수집된 교통량을 담은 건별 관측 데이터로, 범위는 부산시 전역이고 위치는 개별 좌표로 표시된다. 교통 분석가나 물류·연구기관이 '부산의 특정 도로 구간은 어느 시간대에 교통량이 몰리는가'를 파악해 혼잡 예측이나 우회 안내, 상권·입지 분석의 입력으로 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 AVI 지점명을 이름으로 맞추거나 경도·위도 좌표로 공간 매칭해 이어 쓴다.
description_portal: '본 데이터는 부산광역시 교통정보서비스센터에서 운영하는 AVI(Automatic Vehicle Identification) 장치를 통해 생성일시, AVI 지점명, 경도, 위도, 수집된 구간별 교통량 정보를 제공합니다.이 데이터를 활용하여 교통량·통행 시간·통행 패턴 등을 산출할 수 있습니다.본 데이터셋은 시간대별·구간별 교통량 분석, 혼잡 예측, 도로 운영 효율화를 위한 기초자료로 활용 가능합니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>구간별 시간대별 교통량 파악혼잡 예측 및 도로 운영 최적화 지원돌발상황 발생 시 교통 분산·우회 경로 안내물류·대중교통 수송 효율성 분석 근거자료민간 교통정보 서비스 및 연구기관 데이터 분석 활용'
