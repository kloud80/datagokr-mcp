summary_user: 대전광역시 도로관리시스템에 등재된 관로·케이블·송수관·통신선 같은 선형 도로 점용시설을 시설 한 건씩 담은 파일로, 위치(WKT 선형), 길이·관경·심도, 관리번호·허가일련번호, 행정읍면동, 도로구간번호, 차도·보도 구분을 포함한다. 굴착 공사나 도로 계획을 검토하는 담당자·사업자가 '이 도로 구간 아래에 어떤 관로가 얼마나 깊게 묻혀 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 행정읍면동 이름, 도로구간번호, 허가일련번호처럼 같은 기관 자료와 이름·코드를 맞추는 방식으로만 이어 쓰고, WKT 좌표로 다른 공간 자료와 겹쳐 볼 수 있다.
description_portal: 대전광역시_도로 점용시설(선) 현황 데이터는 대전광역시 도로관리시스템에 등재된 선형 형태의 도로 점용시설 현황 정보를 담고 있습니다. 이 자료는 도로 선로, 관로, 케이블, 송수관, 통신선 등 다양한 선형 점용시설의 위치, 길이, 점용구간, 관리번호 등 세부 내역을 포함하고 있습니다. 이를 통해 시내 주요 도로 구간별로 분포된 시설물 현황을 한눈에 파악할 수 있어 도로 유지관리, 선로시설 보수, 교통계획, 도시 인프라 확장 등 행정과 실무 업무 전반에서 활용도가 높습니다. ※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
