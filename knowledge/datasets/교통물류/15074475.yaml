summary_user: 서울 강남구에 실제 등록된 전기차 총 대수를 연도별로 한 줄씩 담은 시군구 단위 집계 파일로, 포털 설명상 2018~2020년을 다루며 파일 크기는 237바이트에 불과하다. 강남구의 전기차 보급이 해마다 얼마나 늘었는지 확인하려는 분석가나 충전 인프라를 검토하는 담당자가 연도별 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 자치구·충전소 데이터와는 시도명·자치구명 같은 이름과 연도를 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 강남구를 대상으로, 2018년부터 2020년까지 매해 실제로 등록된 전기차의 총 대수를 체계적으로 보여주는 자료입니다.  - 연번, 시도명, 자치구명, 연도, 전기차 등록대수에 대한 정보를 제공하는 데이터입니다해당 연도에서 실제로 등록되어 있는 전기차의 총 대수를 통해 강남구에서 전기차 보급 현황과 인프라 확산 정도를 정량적으로 파악할 수 있습니다.전기차 등록 흐름을 분석하거나, 연도별 추이를 확인하는 등  참고 자료로 활용될 수 있습니다.데이터 활용시 참고하시기 바랍니다.
