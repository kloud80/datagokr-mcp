description_portal: 이 데이터는 제주특별자치도 서귀포시에 등록된 이륜자동차의 월별 등록 현황을 용도별로 분류하여 제공합니다. 등록 용도는 ‘관용’과 ‘자가용’으로 구분되며, 각 월마다 사용 등록된 이륜차의 수를 기준으로 통계가 집계됩니다. 해당 자료는 서귀포시 관내 이륜차 등록 현황을 파악하고, 공공기관의 차량 보유 현황 분석, 자가용 이용 추이 분석, 교통 정책 수립 및 환경 영향 평가 등 다양한 행정 및 정책적 활용을 위한 기초 자료로 활용될 수 있습니다.  또한 등록 추이 변화 분석이나 이륜차 증가에 따른 교통안전 대책 마련 시에도 유용한 참고 자료가 됩니다.
