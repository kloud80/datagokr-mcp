summary_user: 수도권 5호선 도시광역철도역에 설치된 엘리베이터를 한 대씩 담은 파일로, 운영기관·노선·역명·출입구 번호·상세 위치와 정원 인원·중량을 기록한다(약 10KB 규모의 CSV). 휠체어 이용자나 교통약자 이동 지원 기관이 "5호선 이 역의 몇 번 출입구에 엘리베이터가 있고 몇 명까지 탈 수 있나"를 확인하거나, 분석가가 역별 엘리베이터 설치 현황을 비교하는 데 쓴다. 공통 역 코드 같은 전역 조인 키가 없어 다른 역·출입구 데이터와는 역명·노선명을 이름으로 맞춰 이어 써야 한다.
