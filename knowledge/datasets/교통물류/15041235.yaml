summary_user: 부산김해경전철 역사별 화장실의 위치를 화장실 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 역명·역층·지상 구분·개찰구 안팎(게이트내외)·출구번호·상세위치·화장실 구분을 기록한다. 경전철 이용자가 '내릴 역의 화장실이 개찰구 안에 있는지, 몇 번 출구 쪽인지'를 확인하거나, 분석가가 역별 편의시설 배치를 정리할 때 쓴다. 전역 조인 키는 없어서 다른 역·시설 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 연결한다.
limits: 역 코드 같은 공통 키가 없어 다른 철도 데이터와 붙이려면 역명 표기를 직접 맞춰야 한다. 범위 표기는 전국·비공간이지만 실제 내용은 부산김해경전철 한 노선의 역에 한정되고, 좌표가 없어 지도 위 위치는 알 수 없다.
