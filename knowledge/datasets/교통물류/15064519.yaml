summary_user: 철도자격관리시스템에 등록된 신체검사·적성검사·교육훈련기관 등 철도 유관기관을 기관 단위로 한 행씩 담은 전국 범위 파일로, 기관 종류, 기관코드·기관명, 주소·우편번호, 대표전화, 사용 여부를 담는다. 철도 종사자 자격을 준비하는 사람이 "신체검사나 적성검사를 받을 수 있는 지정 기관이 어디이고 연락처가 무엇인가"를 찾거나, 분석가가 유관기관의 지역 분포를 보는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 실측 컬럼에서 확인되지 않아, 기관명 매칭이나 같은 기관(한국교통안전공단)의 기관코드로만 연결한다.
