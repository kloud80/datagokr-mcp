summary_user: 대구교통공사가 운영하는 대구3호선 역의 엘리베이터를 한 대씩 담은 파일로, 운영기관·노선·역명·출입구번호·상세위치와 정원(인원·중량)을 기록한다(CSV 약 10KB). 휠체어 이용자나 교통약자가 '이 역 몇 번 출입구에 엘리베이터가 있고 몇 명까지 타는가'를 확인하거나, 분석가가 역별 엘리베이터 설치 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 역·출입구 데이터와는 역명·출입구번호를 이름으로 맞춰 잇거나 같은 기관의 다른 노선 엘리베이터 파일과 나란히 쓴다.
description_portal: 대구교통공사에서 운영하는 대구3호선의 엘리베이터에 대한 데이터로 철도운영기관명, 선명, 역명, 출입구번호, 상세위치, 정원인원, 정원중량의데이터가 있습니다.1990년대부터 수도권 전철에서는 장애인의 이동권을 고려하여 장애인도 도시철도를 원활하게 이용할 수 있도록 여러 시설을 갖추기 시작했다. 엘리베이터가 최초로 설치된 역은 1993년에 개통된 학여울역으로 지상과 환승주차장, 대합실을 잇는 엘리베이터였다. 서울 5~8호선은 개통 당시(1995~2001년)부터 주요 거점 역사에 엘리베이터를 설치했고 엘리베이터가 없는 구간은 계단 옆에 경사형 휠체어리프트를 대신 마련했다.
