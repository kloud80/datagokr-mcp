summary_user: 울산광역시 중구에 설치된 불법주정차 단속 CCTV를 설치위치별로 한 행씩 담은 현황 파일로, 카메라대수·운영시간·설치연도·데이터기준일을 함께 담는다(CSV 약 3.9KB 규모의 소규모 목록). 주민이나 운전자가 '중구 어느 위치에 주정차 단속 카메라가 있고 몇 시에 운영되는가'를 확인하거나, 분석가가 단속 CCTV 배치와 설치 시기를 점검하는 데 쓴다. 전역 조인 키나 좌표·코드 필드가 없어 다른 데이터와는 설치위치 이름을 주소·지명으로 직접 매핑하거나 같은 기관(울산 중구) 자료끼리만 이어 쓴다.
description_portal: 울산광역시 중구 불법주정차 CCTV 현황에 대한 자료로, 울산광역시 중구에 소재한 불법주정차 CCTV 현황 정보를 제공합니다.본 데이터는 CCTV의 설치위치, 카메라대수, 운영시각, 설치연도 등의 현황을 확인할 수 있습니다.데이터 출처는 울산광역시 중구 교통과 교통지도계(052-290-3980)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 4월 8일입니다. 다음 업데이트는 2027년 4~5월 중 제공됩니다.본 자료는 울산광역시 중구 불법주정차 단속 CCTV의 설치 위치 및 운영 현황 파악, 교통질서 관리 및 단속 효율성 분석, 안전한 교통환경 조성을 위한 정책 수립 등을 위한 기초자료로 활용할 수 있습니다.
