summary_user: 경상남도 남해군에 등록된 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 목록으로, 업체명·면허종류·직영 차량대수·사업장 주소·현재 운영여부를 포함한다(CSV 파일 845바이트 규모의 소규모 원장). 화주나 물류 분석가가 "남해군에 허가받은 일반화물 운송사가 어디 있고, 지금 운영 중이며 차량을 몇 대 보유하는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 업체명·주소를 기준으로 전국화물자동차운송사업자표준데이터 등 다른 화물운송 허가 자료와 이름 매칭으로 이어 쓴다.
description_portal: 해당 데이터는 경상남도 남해군에 정식으로 등록된 일반화물자동차운송사업자들의 상세 정보를 제공합니다. 각 업체의 ▲상호명 ▲면허 종류(일반운송사업) ▲직접 관리하는 차량의 수 ▲사업장 소재지 주소 그리고 ▲현재 운영 중인지 여부에 대한 핵심 현황을 포함하고 있습니다. 이 데이터를 통해 남해군 관내 화물 운송업체의 규모와 활동성을 파악하고, 관련 산업 동향 분석 및 정책 수립의 기초 자료로 활용할 수 있습니다. 특히, 정기적으로 갱신되는 이 공식 데이터는 남해군 물류 시스템의 현황을 객관적으로 파악하고, 향후 발전 전략 수립 시 구체적인 근거 자료로 활용됩니다.
