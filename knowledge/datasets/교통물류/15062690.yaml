description_portal: 통영시 도시정보시스템에서는 중앙분리대의 위치와 구조적 특성을 체계적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 중앙분리대의 정확한 위치와 식별이 가능하며, 관리기관과 도로구간번호는 유지관리와 행정적 책임을 파악하는 데 활용됩니다. 또한 종류, 연장, 폭원, 높이 등 구조적 정보를 포함하여 중앙분리대의 형태와 규모를 구체적으로 확인할 수 있습니다. 이러한 정보는 도로 안전관리, 교통 계획, 시설 점검 및 유지보수 등 다양한 행정 및 운영 업무에서 중요한 기초 자료로 활용됩니다.
