summary_user: 통영시 도시정보시스템에 등록된 중앙분리대를 한 건씩 담은 시설물 목록 파일로, 관리번호·행정읍면동·도엽번호와 종류·연장·폭원·높이 같은 구조 정보, 경도·위도 좌표를 포함한다. 도로 안전 분석가나 시 담당자가 '통영시 어느 읍면동 도로에 어떤 종류의 중앙분리대가 얼마나 길게 설치돼 있는가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 도로구간번호, 좌표(경도·위도)를 기준으로 같은 기관의 다른 도시정보시스템 시설물 데이터나 교통사고 위치 자료와 공간·이름 매칭으로 이어 쓴다.
limits: 범위는 통영시 한 곳뿐이라 다른 시군구와 비교하려면 별도 파일을 모아야 한다. 실측 컬럼에서 법정동코드 같은 전역 조인 키가 확인되지 않아 다른 데이터와는 이름·코드 매핑이나 좌표로만 연결된다.
