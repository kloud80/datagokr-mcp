services:
  - op: /getTrctList1
    name: 대전광역시 무인단속카메라 목록 조회
    endpoint: https://apis.data.go.kr/6300000/GetTrctListService1/getTrctList1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: '한 페이지 결과 수 (기본값 : 10)'
      - name: pageNo
        required: true
        example: '1'
        desc: '페이지 번호(기본값 : 1)'
      - name: type
        required: true
        example: xml
        desc: XML/JSON 여부
      - name: MNLSSREGLTCAMERAMANAGENO
        required: false
        example: F6312
        desc: 무인교통단속카메라를 식별하기 위해 관리기관이 부여하는 일련번호
      - name: CTPRVNNM
        required: false
        example: 대전광역시
        desc: 무인교통단속카메라가 있는 광역시, 도 명칭
      - name: SIGNGU_NM
        required: false
        example: 유성구
        desc: 무인교통단속카메라가 있는 시, 군, 구의 명칭
      - name: ROADKND
        required: false
        example: 시도
        desc: 도로의 종류 구분
      - name: ROAD_ROUTE_NO
        required: false
        example: '0'
        desc: 도로의 지정 노선번호
      - name: ROAD_ROUTE_NM
        required: false
        example: 유성대로
        desc: 도로의 명칭
      - name: RDNMADR
        required: false
        example: 대전시 유성구 유성대로 1307
        desc: 무인교통단속카메라가 위치한 상세 도로명주소
      - name: LNMADR
        required: false
        example: 대전시 유성구 장동236-7
        desc: 무인교통단속카메라가 위치한 상세 지번주소
      - name: LATITUDE
        required: false
        example: '36.4014160000'
        desc: 무인교통단속카메라 설치 장소의 위도 좌표값 입력
      - name: LONGITUDE
        required: false
        example: '127.3626660000'
        desc: 무인교통단속카메라 설치 장소의 경도 좌표값 입력
      - name: ITLPC
        required: false
        example: 대전시 유성구 유성대로 1307(장동236-7) 장재울삼거리
        desc: 무인교통단속카메라를 설치한 장소 설명
      - name: REGLTSE
        required: false
        example: '2'
        desc: 무인교통단속카메라의 단속 유형에 대한 구분 (표현방식/단위 = 01:속도, 02:신호, 03:통행위반, 04:불법주정차, 99:기타)
      - name: LMTTVE
        required: false
        example: '60'
        desc: 무인교통단속카메라가 위치한 도로에서 허용되는 최대 주행 속도* 속도를 제한하지 않는 경우 ‘0’으로 입력 (표현방식/단위 = km/h)
      - name: REGLTSCTNLCSE
        required: false
        example: '0'
        desc: 구간단속의 시점 및 종점 구분 (표현방식/단위 = 01:시점, 02:종점)
      - name: OVRSPDREGLTSCTNLT
        required: false
        example: '0'
        desc: 구간단속의 시점부터 종점까지의 거리 (표현방식/단위 = km/h)
      - name: PRTCAREATYPE
        required: false
        example: '0'
        desc: 무인교통단속카메라가 위치한 장소가 보호구역으로 지정된 경우의 구분 (표현방식/단위 = 01:노인보호구역, 02:어린이보호구역, 99:기타)
      - name: INSTALLATION_YEAR
        required: false
        example: '2011'
        desc: 무인교통단속카메라의 설치연도
      - name: REFERENCEDATE
        required: false
        example: '2021-10-14'
        desc: '데이터 작성 기준일자(예시: yyyy-mm-dd) '
      - name: ROADROUTEDRC
        required: false
        desc: 도로노선의 방향 구분 (표현방식/단위 = 01:상행, 02:하행, 03:양방향)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
