summary_user: 서울교통공사가 관할하는 지하철역을 자치구 단위로 묶어 자치구마다 해당 역명과 호선, 역 개수를 담은 집계 파일입니다(포털 설명 기준 289개 역, csv 약 3.5KB). 도시 통계나 학술 연구에서 '우리 구에는 지하철역이 몇 개이고 어느 호선이 지나는가'를 확인하거나 자치구 간 철도 접근성을 비교하는 데 씁니다. 전역 조인 키가 없어 자치구 이름으로 다른 시군구 통계와 붙이고, 역 단위 데이터와는 역명·호선 문자열을 매핑해 연결합니다.
description_portal: '- 서울 지역 자치구별 서울교통공사에서 관할하는 역 정보를 제공하고 있습니다. - 각종 도시 통계 및 학술 연구에 필요한 서울특별시 자치구별 역 개수, 자치구별 호선 정보를 포함하고 있습니다. - 개방 데이터는 연번, 자치구, 해당역(호선), 역개수 로 구성되어 있습니다. - 자치구 30개 별 역명과 호선 자료로 구성되어 있으며 서울교통공사에서 관리하는 289개역 정보로 구성되어 있습니다.- 참고 사항 : 공공데이터 제공요청으로 2020년 이전 데이터는 5년 주기로 제공하고 있습니다.- 현 자료는 2026년 2월 기준 업데이트한 자료 입니다.'
