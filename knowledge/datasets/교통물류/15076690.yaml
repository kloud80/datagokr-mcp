summary_user: 전국 고속도로에 설치된 AVC 장비를 한 대씩 담은 설치 지점 목록으로, 장비 ID, 노선명·노선번호, 관할 본부·지사, 위경도, 도로등급, 장비 소속, 등록일을 담는다. 교통 분석가나 물류 사업자가 '특정 고속도로 노선의 어느 구간에 차량 측정 장비가 설치되어 있는가'를 확인하거나, 지점 단위 교통량 분석의 위치 기준표로 쓴다. 전역 조인 키는 없어서, 노선번호(routeNo)나 관할 본부·지사 코드처럼 한국도로공사 내부 코드, 또는 이름 매핑으로 같은 기관의 교통량·노선 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 AVC(자동차무게측정장치) 설치 지점 정보를 수록한 OpenAPI 서비스이다.전국 고속도로에 설치된 AVC의 장비 위치, 차로 수, 설치 방향, 측정 항목 등 주요 정보를 포함하며 XML 및 JSON 형식으로 제공된다.해당 데이터는 과적 차량 단속, 차량 중량 정보 수집, 교통 안전 강화 및 도로 유지보수 계획 수립 등에 활용 가능하다.AVC 설치 지점의 위치 정보는 내비게이션 연계, 교통 흐름 분석, 과적 방지 시스템 구축 등에 유용하게 활용된다.데이터는 정기적으로 갱신되며, 차량 하중 분산 관리와 도로 기반 시설의 효율적 운영을 위한 기초 자료로 제공된다.공공 및 민간 부문에서의 교통 정책 수립, 시설 설계, 안전 서비스 개발 등 다양한 분야에 실질적인 기여를 할 수 있다.
