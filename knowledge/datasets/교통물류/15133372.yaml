summary_user: 궤도시설(삭도·궤도 등) 정기검사 계획을 검사 대상 업체·설비 단위로 담은 파일로, 검사 목록의 연도·등록일·제목과 대상 업체명·주소·지역·선로 번호·장비부품을 함께 싣고 있으며 범위는 전국이다(csv 약 31KB). 궤도운송 사업자나 지자체·안전 분석가가 "올해 우리 지역 케이블카·궤도시설은 언제 어떤 설비가 정기검사를 받는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소·지역 이름을 맞춰 붙이는 방식으로만 이어 쓸 수 있다.
description_portal: 궤도운송법, 궤도운송법 시행령, 궤도운송법 시행규칙 및 국토교통부 고시(궤도시설의 건설에 관한 설비기준, 궤도시설 안전검사 기준, 궤도시설 점검 정비요령)에 따른 궤도시설의 안전검사(설계서안전도검사, 시허문행적정성검토, 정기검사, 수시검사 등)에 대한 전반적인 정보를 확인할 수 있는 데이터이며 해당목록에서는 다음의 정보들을 포함하여 확인할 수 있습니다.궤도시설의 정기검사 대상, 궤도시설의 정기검사 목록, 궤도시설의 정기검사 일자, 궤도시설의 정기검사 년도, 궤도시설 정기검사 대상 업체의 설비종류를 포함합니다.
