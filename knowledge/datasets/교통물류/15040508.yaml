summary_user: 부산시 16개 구군에서 운행하는 마을버스를 노선별로 한 행씩 담아, 노선번호·운행업체·기점·경유지·종점, 운행·예비 차량 수, 운행거리, 첫차·막차 시간, 평시·출퇴근·주말 배차간격, 일반·청소년·어린이 카드/현금 요금을 담는 현황 데이터다. 주민이나 분석가가 "우리 구에서 마을버스가 몇 시까지 다니고 배차간격·요금은 얼마인가" 같은 질문을 확인하거나, 구군별 마을버스 공급(노선 수·차량 수·운행거리)을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구군명(gugun)이나 노선번호·업체명 같은 이름을 매핑해 이어 쓰며, 정류장·노선 원장이나 실시간 도착정보와도 이런 이름 기준으로만 맞춰 볼 수 있다.
description_portal: 부산시 16개 구군에서 운행중인  마을버스 운행 현황 데이터를 개방합니다.마을버스는 일반적으로 도시 내 주요 교통 노선이 닿지 않는 주거 지역이나 외곽 지역을 연결해주는 소형 대중교통 수단입니다. 주로 짧은 거리를 운행하며, 주민들의 일상생활에 밀접하게 연결된 교통수단으로 사용되고 있습니다. 짧은 노선, 소형, 저렴한 요금, 지역기반 운영등의 특징을 가지고 있습니다.개방되는 데이터는 노선번호, 업체명, 기점, 경유, 종점 정보와 버스회사 전화번호, 운행차량수, 운행거리, 첫차/막차 시간, 배차간격과 대상별 버스요금(카드/현금) 데이터가 포함되어 있습니다.
