summary_user: 부산교통공사 도시철도 역별 호선, 역번호, 역명, 영문 역명, 주소, 전화번호를 담은 파일 데이터로, 검증 시 114행이 수신되었다. 이용자나 분석가가 특정 역의 호선·역번호·영문 표기·위치·문의 전화번호를 확인하는 질문에 쓴다. 조인 키는 주소(address)뿐이라 주소 문자열 기준으로 다른 위치 데이터와 맞추며, 역 좌표·출입구·환승 정보를 담은 세부 부문 데이터와 이어 역세권 판정에 쓴다.
description_portal: 본 데이터는 부산교통공사에서 관리하는 도시철도 역명 정보로, 호선, 역번호, 역명, 영문역명, 주소, 전화번호 등으로 구성되어 있습니다.역번호는 각 호선 내 고유한 식별번호이며, 영문역명은 외국인 이용자의 편의를 고려해 제공됩니다. 주소는 지하철역의 위치를 기준으로 하며, 전화번호는 고객 문의 및 안내를 위한 연락처입니다. 해당 데이터는 노선 탐색, 위치 파악, 서비스 문의 등에 활용될 수 있으며, 특히 교통약자나 외국인 관광객을 위한 정보 접근성 제고에 기여합니다. 공사는 본 정보를 통해 지하철 이용자의 편의성 향상과 이용자 중심의 대중교통 서비스를 실현하고자 하며, 관련 정보는 주기적으로 갱신·공개되어 정확성과 최신성을 유지하고 있습니다.
