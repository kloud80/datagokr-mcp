summary_user: 서울 시내에 설치된 전동킥보드 전용 주차구역을 한 곳씩 담은 목록으로, 자치구명·주소·상세위치·거치대 유무와 거치 가능 대수를 항목으로 둔다. 시민이나 공유 킥보드 사업자가 '우리 구 어디에 킥보드를 합법적으로 세울 수 있나, 거치대는 있나'를 확인하거나, 분석가가 자치구별 주차구역 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 자치구명(SGG_NM)이나 주소 문자열로 공공자전거 대여소·자전거도로 같은 다른 개인형 이동장치 데이터와 이름 매칭으로만 잇는다.
description_portal: 이 데이터는 서울시 전동킥보드 주차구역 현황을 정리한 자료로, 서울 시내 주요 지점에 설치된 전동킥보드 전용 주차구역 정보를 제공합니다. 주요 항목에는 순번, 시군구명, 주소, 상세위치, 거치대 유무, 거치대 크기(거치 가능 대수)가 포함되어 있습니다. 이를 통해 이용자는 전동킥보드를 합법적으로 주차할 수 있는 구역을 확인할 수 있으며, 무분별한 방치 문제를 줄이고 교통 안전과 보행 편의를 높이는 데 기여합니다. 또한 행정적으로는 공유 모빌리티 관리 정책과 공간 효율성을 강화하는 근거 자료로 활용될 수 있습니다.
