summary_user: 경상남도 의령군에 설치된 주정차 무인단속카메라를 설치 지점별로 담은 원천 목록으로, 설치위치·주소, 단속 시작·종료 시간, 촬영각도·촬영거리, 설치대수, 데이터기준일을 담는다(CSV 593바이트의 작은 파일). 의령군 주민이나 방문 운전자가 '이 장소에 몇 시부터 몇 시까지 주정차 단속카메라가 작동하는가'를 확인하거나, 분석가가 단속 지점의 분포를 지도에 표시하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소 문자열을 지오코딩하거나 이름을 매칭해 잇고, 시군구 단위의 다른 단속·보호구역 데이터와는 같은 기관(의령군) 기준으로 맞춰 쓴다.
description_portal: 본 데이터는 경상남도 의령군 주정차무인단속카메라설치현황을 제공합니다. 데이터는 연번, 설치위치, 주소, 단속시작시간, 단속종료시간, 촬영각도, 촬영거리(m), 설치대수, 데이터기준일로 구성됩니다. 이를 통해 이용자는 각 카메라의 설치 위치와 단속 시간대, 촬영 범위와 거리, 설치된 대수, 최신 기준일을 한눈에 확인할 수 있습니다. 이 정보는 단속 효율 분석, 주정차 관리 계획, 단속장소 안내 자료 제작, 공간 분포 시각화 등에 활용될 수 있습니다. 행정기관은 이를 바탕으로 단속 정책 조정, 장비 유지보수 계획, 교통 환경 개선 전략 수립 등에 참고할 수 있습니다. 본 데이터는 공공데이터포털에서 제공되며, 지역 교통질서 확립과 행정 대응력을 높이는 기본 자료입니다.
