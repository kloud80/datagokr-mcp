summary_user: 서울시 공공자전거 따릉이의 운영 자전거를 한 대씩 자전거번호와 종류(일반 따릉이·새싹 따릉이)로 담은 건별 목록 파일(csv)이며, 포털 설명상 약 45,000대 규모입니다. 분석가가 대여 기록 속 특정 자전거가 일반형인지 새싹형인지 가려 종류별 이용 차이를 볼 때 쓴다. 조인 키는 자전거번호(seoul_bike_id) 하나여서, 같은 번호를 가진 따릉이 대여 이력 같은 자료와 이어 쓴다.
description_portal: 자전거와 함께하는 건강한 도시, 세계적인 자전거 도시 서울!서울특별시에서 운영하고 있는 공공자전거 따릉이의 운영 정보입니다.따릉이에서 운영하고 있는 45,000 대의 자전거 번호 현황과 자전거별 종류(일반 따릉이, 새싹 따릉이)에 대한 정보를 확인 할 수 있습니다.자전거 번호 80,000 번을 기준으로 80,000 이전은 일반 따릉이로 운영하고 있고 80,000 이후는 새싹 따릉이로 운영하고 있습니다.현재 운영하고 있는 자전거는 전부 QR형 자전거로 QR 코드를 스캔하여 대여하는 방법으로 운영되고 있습니다.
