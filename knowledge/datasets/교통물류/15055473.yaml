description_portal: '서울특별시 마포구에 등록된 자동차에 대한 정보입니다. 이 데이터에는 각 차량이 등록된 구체적인 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 차량의 연료 유형(예: 휘발유, 경유, LPG, 전기, 수소 등), 그리고 해당 연료별 차량 등록 대수가 포함되어 있습니다. 또한 차량 종류별(관용승용차, 관용승합차, 자가용특수차 등) 자동차 수량에 대한 정보도 함께 제공됩니다. 이 데이터를 통해 주민들은 거주 지역의 자동차 연료 구성 비율을 확인할 수 있으며, 지역 내 친환경 차량 보급 현황이나 내연기관 차량 집중 분포를 쉽게 파악할 수 있습니다.'
