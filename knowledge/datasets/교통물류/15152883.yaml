summary_user: 무안군 관내에서 2024년 한 해 동안 접수된 불법주정차 신고를 건별로 담으며, 신고 일시·신고 위치·위도·경도·위반유형·과태료 부과 여부를 기록한다. 군청 단속 담당자나 분석가가 '무안군에서 불법주정차 신고가 몰리는 지점과 시간대는 어디이고, 실제 과태료로 이어진 비율은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없으므로 위도·경도 좌표로 보호구역·단속카메라 위치 같은 공간 데이터와 겹쳐 보거나, 신고 위치 주소 문자열로 행정구역과 맞춰 이어 쓴다.
description_portal: 무안군 관내 2024년 불법주정차 신고 및 과태료 부과 현황을 제공하는 데이터입니다. 데이터는 신고일시, 신고위치, 위도·경도, 과태료부과 여부, 위반유형으로 구성되어 신고 접수부터 처분 결과까지의 기본 정보를 한눈에 확인할 수 있습니다.수록 범위는 2024년 1월 1일~12월 31일 동안 무안군 전역에서 접수·처리된 건이며, 신고 위치 좌표는 현장 상황과 신고 기기 특성에 따라 소폭의 오차가 있을 수 있습니다. 신고자 인적사항과 차량 식별정보 등 개인정보는 포함하지 않으며, 과태료부과 여부는 행정처분 확정 기준으로 제공되나 이의제기·재결 등으로 사후 변경될 수 있습니다. 본 데이터는 단속·계도 계획 수립, 불법주정차 다발구역 분석, 생활안전 취약지점 개선, 민원 대응, 지도 기반 시각화 및 연구에 활용 가능합니다.
