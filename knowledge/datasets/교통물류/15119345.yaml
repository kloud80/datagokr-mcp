summary_user: 서울교통공사 1~8호선의 인접 역 사이 거리(km)와 표준 운행시간(분), 호선별 누계 거리를 역 단위 행으로 담은 정리표입니다. 지하철 이동 경로의 소요시간을 어림하거나 노선별 역간 거리 분포를 비교하려는 분석가·시민이 "이 두 역 사이는 몇 km이고 몇 분 걸리나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역 데이터(좌표·출입구·승하차 등)와는 호선명(SBWY_ROUT_LN)과 역명(SBWY_STNS_NM)을 이름으로 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 소울교통공사 역간거리 데이터입니다. 데이터는 서울교통공사에서 제공하는 1~8호선 지하철 역간 거리 및 소요 시간 정보입니다. 해당 정보는 연번, 호선, 역명, 운행시간(분), 역간거리(km), 호선별누계(km)를 포함하고 있습니다. 해당 데이터 중 "운행시간"의 경우는 열차가 출발하여 다음역에 도착하는 표준 운행시간으로 열차사정에 따라 변동될 수 있으니, 참고 부탁드립니다. 데이터의 원본 시스템은 서울교통공사 지하철정보(http://www.seoulmetro.co.kr/kr/index.do?device=PC)입니다.
