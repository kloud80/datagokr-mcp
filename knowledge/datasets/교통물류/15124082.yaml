summary_user: 경기도 버스운송관리시스템(BMS)에 기록된 버스 예비차 변경 이력을 이력 건별로 담으며, 실측 필드는 운수업체별 일반·좌석·직행·시외·급행 차종의 변경 전후 차량 수와 예비차 수, 차고지 면적, 증감 사유, 승인·등록 일시로 구성된다. 교통행정 담당자나 분석가가 어느 운수업체가 언제 어떤 사유로 차종별 예비차를 늘리거나 줄였는지 추적하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관(경기도 BMS) 데이터와 업체 아이디(entrps_id)나 업체명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로 예비 차량의 운행 및 등록 이력을 기록한 자료입니다. 항목에는 차량식별번호, 이력아이디, 차종류, 차번호, 등록일자, 버스회사아이디, 업무코드, 사용구분, 기관코드 등 차량의 운영 상태 및 이력 관련 정보가 포함되어 있으며, 정류장정보와 연계되는 항목도 존재합니다. 본 데이터는 차량 관리의 이력 분석, 차량별 운행상태 추적, 차량 등록 이력관리, 교통행정 계획 수립 및 차량 자원 운영 최적화 등에 활용될 수 있습니다. 예비 차량의 운행 여부와 구분이 명확히 기록되어 있어 운수업체의 효율적 차량 운용과 정책 수립 시 유용한 기초자료로 사용됩니다.
accrual_periodicity: 수시
