summary_user: 고속도로 휴게소 안에 있는 청년창업매장을 매장 한 건씩 담은 전국 단위 OpenAPI로, 휴게소명·노선명·휴게소 주소·매장명(bzNm)·운영 시작·종료 시각 같은 항목을 준다. 창업 지원 담당자나 분석가가 '어느 노선, 어느 휴게소에 청년창업매장이 몇 곳이나 들어서 있나'를 확인할 때 쓰고, 고속도로 이용자가 들를 휴게소의 청년 매장을 찾을 때도 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 휴게소 데이터와는 휴게소 코드(stdRestCd)·노선 코드(routeCd) 같은 한국도로공사 내부 코드나 휴게소 이름을 맞춰 이어 쓴다.
description_portal: 본 데이터는 고속도로 휴게소 내 청년창업매장의 명칭, 위치, 운영여부, 연락처, 매장유형 등의 정보를 제공하는 OpenAPI 서비스이다.한국도로공사가 관리하는 청년창업매장 현황을 XML 및 JSON 형식으로 실시간 조회할 수 있으며, 청년 일자리 창출 및 창업 지원 정책 수립에 활용 가능하다.응답 항목에는 휴게소명, 매장명, 창업자명, 매장종류, 운영현황, 전화번호 등이 포함된다.해당 데이터는 고속도로 이용자에게 청년 창업 매장 정보를 제공하여 접근성을 높이고, 지역경제 활성화 및 창업문화 확산에 기여한다.매장은 음식, 특산품, 수공예 등 다양한 분야로 구성되어 있으며, 창업자에게 실질적인 판로와 운영 경험을 제공한다.공공데이터포털을 통해 인증키를 발급받아 자유롭게 이용할 수 있으며, 정보는 수시로 최신화된다.본 데이터는 공공데이터 활용 촉진과 국민 편익 증진을 목적으로 개방되었다.
