summary_user: 광주교통공사 도시철도 역사별·연도별 공기질 측정 평균 농도를 담은 집계 파일로, 미세먼지·초미세먼지·이산화탄소·폼알데히드·일산화탄소 등 유지기준 항목과 이산화질소·라돈·휘발성유기화합물 등 권고기준 항목을 함께 기록한다. 이용객이나 분석가가 "우리 동네 지하철역의 미세먼지 농도가 해마다 어떻게 변했고 기준을 넘은 적이 있는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 역명(역명 필드) 이름 매칭이나 같은 기관 데이터끼리만 연결한다.
limits: 역 코드 등 표준 조인 키가 없어 다른 기관 역 정보와 붙이려면 역명 표기를 직접 맞춰야 한다. 각 수치는 연간 평균 농도라 시간대·일별 변동이나 실시간 공기질은 알 수 없다.
