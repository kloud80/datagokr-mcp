description_portal: 이 데이터는 광주교통공사의 역사 공기질 측정 결과를 담고 있으며, 연도별·역별로 주요 대기 오염 물질 농도를 기록하고 있습니다.측정 항목은 PM10(미세먼지, ㎍/㎥), PM2.5(초미세먼지), CO2(이산화탄소, ppm), HCHO(폼알데히드, ㎎/㎥), CO(일산화탄소, ppm) 등 유지기준 항목과, NO2, 라돈(Rn), VOC(휘발성유기화합물) 등의 권고기준 항목을 포함합니다.각 수치는 해당 역에서 측정된 평균 농도를 나타내며, 이를 통해 역사 내 공기질의 연도별 변화, 역별 오염 수준 차이, 특정 항목의 기준 초과 여부 등을 분석할 수 있습니다. 이 자료는 역사 환경 개선, 환기·공조 설비 조정, 친환경 정책 효과 평가에 활용 가치가 높습니다.
