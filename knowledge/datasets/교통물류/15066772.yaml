summary_user: "철도통계연보를 바탕으로 경부선·경부고속선·경춘선·분당선 등 일반·고속·광역철도 노선별로 보통역, 배치·무배치 간이역, 조차장, 신호장, 신호소 개수(단위: 개소)를 담은 전국 단위 집계표이며, 파일 크기는 706바이트로 작은 표 하나다. 분석가나 정책 담당자가 '어느 철도 노선에 무배치 간이역이나 신호장이 몇 곳 있는가'처럼 노선별 역 시설 구성을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선 이름(구분)을 맞춰 붙여야 한다."
description_portal: 한국교통안전공단에서 전국 대중교통 철도의 역사 현황에 대한 데이터를 제공한 자료입니다.해당 데이터는 일반 고속철도 및 광역철도에 대한 역사 현황입니다.(강릉선, 경간성, 경부고속선, 경부선, 경북선, 경원선, 경의선, 경인선, 경전선, 경춘선, 과천선, 동해선, 분당선, 서해선, 수서평택고속선, 안산선, 영동선, 일산선, 장항선, 전라선, 중부내륙선 등)배치 간이역, 무배치 간이역, 조차장, 신호장, 신호소에 대한 자료를 제공합니다.해당 데이터는 철도통계연보 자료를 바탕으로 작성되었습니다.단위는 개소입니다.
