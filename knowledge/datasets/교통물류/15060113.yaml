summary_user: 인천교통공사가 운영하는 월미바다열차 1개 노선 4개 역의 역사명·노선명·운영기관명·도로명주소·전화번호를 역 단위로 담은 작은 CSV 파일(362바이트)이다. 월미도 관광객이나 관광·교통 분석가가 '월미바다열차 역은 어디에 있고 연락처는 무엇인가'를 확인하거나 역 주변 관광지·상권을 살필 때 쓴다. 전역 조인 키나 역 코드가 없어 역사명이나 도로명주소를 기준으로 다른 철도역·관광 데이터와 이름 매칭해 이어 써야 한다.
description_portal: 2025년 6월30일기준 인천교통공사에서 운영중인 월미바다열차 역사 정보입니다.해당 데이터는 역사명,노선명,운영기관명,역사도로주소명,역사전화번호 항목으로 구성되어있습니다.월비바다열차의 운행노선은 1개 노선 4개역(월미바다역, 월미공원역, 월미문화의 거리역, 박물관)이 운영 중에 있습니다.2019년 10월 8일 개통 이후 현재까지 노선 연장없이 4개역으로 운영되고 있는 인천 월미도를 순환하는 국내 최장 도심형 관광모노레일입니다.월미바다열차 역사는 모두 지상 2층에서 5층 높이에 위치하고 있습니다.
