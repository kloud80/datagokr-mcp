description_portal: 이 데이터는 특정 "통계일시"를 기준으로 수집된 실시간 교통 상황을 상세히 기록한 자료입니다. "FDT00011"와 같이 고유한 "검지기 아이디"별로 해당 시점의 "교통량"(차량 대수), 평균 "속도"(km/h), 그리고 도로 "점유율"(%)을 정확하게 측정하여 보여줍니다.  "FDT00080"처럼 일부 검지기의 교통량이 "0"으로 기록된 것은, 해당 시점에 차량 통행이 없었음을 의미할 수 있습니다. 이러한 시계열 데이터는 특정 시간대의 교통 흐름을 정밀하게 분석하고, 실시간 교통 상황을 모니터링하는 데 필수적인 기초 자료로 활용됩니다.
