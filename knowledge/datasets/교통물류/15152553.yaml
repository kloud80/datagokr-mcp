summary_user: 안산시 도로에 설치된 검지기별로 통계일시 단위 시간별 교통량(차량 대수), 평균 속도(km/h), 점유율(%)을 담은 파일 데이터이며, 활용신청 없이 약 2MB 크기의 CSV로 받는다. 교통 분석가나 시 담당자가 특정 검지기 구간에서 출퇴근 시간대에 교통량이 몰리고 속도가 떨어지는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 검지기 아이디를 검지기 위치 정보 등 같은 기관 자료와 이름·코드로 맞춰 이어 써야 한다.
limits: 검지기 아이디만 있고 좌표·도로명이 없어 이 파일만으로는 검지기 위치를 알 수 없으며, 다른 데이터와 붙이려면 같은 기관의 코드 매핑이 필요하다. 범위는 안산시 단위로 한정된다.
