summary_user: 전국 연안여객선의 일일 운항 현황을 공단 지사·일자·출항시각·여객선·면허항로 단위로 한 건씩 기록한 파일 데이터로, 각 운항이 정상 운항인지 결항·통제인지(운항여부)를 담는다(CSV 약 52.8MB). 섬 주민이나 여행객, 분석가가 '이 항로는 과거에 어느 계절·시간대에 결항이 잦았나'처럼 특정 항로의 운항 실적과 결항 빈도를 확인할 때 쓴다. 전역 조인 키가 없어 다른 여객선·항로·선사 데이터와는 여객선명·면허항로명 같은 이름이나 공단 자체 코드(지사코드·여객선코드)를 맞춰서만 이어 쓴다.
description_portal: 한국해양교통안전공단에서 제공하는 전국 항로별 여객선의 일일 운항 현황에 대한 데이터이다. 본 데이터는 공단 각 지사(지사코드, 지사명)별로 특정 일자 및 출항 시간에 따른 개별 여객선(여객선코드, 여객선명)의 운항 상태 정보를 상세히 포함한다. 구체적으로, 허가된 면허항로를 운항하는 각 선박의 정상 운항, 결항, 통제 등 실제 운항 여부를 기록하여 제공한다.사용자는 이 데이터를 통해 특정 항로의 과거 여객선 운항 여부를  파악하여 섬 지역 방문이나 해상 이동 계획을 수립하는 데 효과적으로 활용할 수 있다. 또한, 해상교통 관련 정책 수립, 학술 연구 분석, 민간의 관광 정보 서비스 개발 등 다양한 분야에서 기초 자료로 사용될 수 있는 높은 가치를 지닌다.데이터는 지사, 일자, 여객선, 항로, 운항여부 등 명확하고 직관적인 항목으로 구성되어 있어 사용자의 데이터 검색 편의성과 정보 접근성을 높였다. 한국해양교통안전공단은 본 데이터의 주기적인 갱신을 통해 정보의 신뢰성과 최신성을 확보하고, 국민의 안전한 바닷길 이용에 기여하고자 한다.
