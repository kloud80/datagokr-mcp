summary_user: 경기도 도로대장 전산화 시스템에 등록된 중앙분리대를 노선·구간 단위로 한 건씩 담고, 위치 시점·종점, 연장, 종류(대부분 가드레일), 분리대 폭, 높이, 설치일자, 시점·종점 경위도를 함께 제공한다. 도로 관리자나 교통안전 분석가가 '이 노선의 어느 구간에 어떤 형태·규격의 중앙분리대가 언제 설치됐는가'를 확인하고 교통안전시설 개선 대상을 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 노선번호(route_no)·구간번호 이름 매칭이나 시점·종점 경위도로 표준노드링크 등 도로망 데이터와 공간적으로 맞춰 이어 써야 한다.
description_portal: '이 데이터는 도로대장전산화시스템을 통해 구축된 중앙분리대에 대한 정보를 포함하고 있으며, 도로 상의 차량 간 충돌을 방지하고 안전을 확보하기 위한 구조물 현황을 나타냅니다. 주요 항목은 노선번호, 구간번호, 위치시점 및 종점, 연장, 종류(예: 가드레일), 분리대 폭, 높이, 설치일자, 공간정보(시점/종점의 경도·위도), 비고 등입니다. ‘종류’ 항목은 설치된 중앙분리대의 형태를 나타내며, 대부분 ‘가드레일’로 구성되어 있습니다. 이 데이터는 도로구간별 중앙분리대의 설치여부와 구조적 특성을 파악하고, 교통안전시설 개선 및 도로 설계 기준 마련에 활용될 수 있습니다. 또한 연장, 폭, 높이 등의 물리적 특성은 사고 방지 설계 및 유지보수 전략 수립 시 유용하며, 공간정보와 결합하여 시각화 및 위치기반 분석에도 적용 가능합니다'
