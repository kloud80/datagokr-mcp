summary_user: 제천시 스마트주차 대상 주차장별로 전체 주차대수, 현재 주차가능대수, 장기주차 대수, 원활·혼잡 상태와 운영시간·요금·주소·좌표를 담는 시설물 정보로, 주차장 단위 개별 행을 시군구 범위로 제공한다. 제천 시내에서 지금 빈자리가 있는 공영주차장이 어디이고 기본요금과 운영시간이 어떤지 확인하려는 운전자나, 주차장별 혼잡도를 비교하려는 분석가가 쓴다. 전역 조인 키는 없으므로 다른 주차장 데이터와는 주소나 위도·경도 좌표, 주차장 그룹명(groupName)으로 매핑해 연결한다.
description_portal: 주차장의 원활, 혼잡 등 상태, 전체 주차대수, 현재 주차대수, 장기주차 대수 등의 제천시에서 제공하는 주차장 별 시설물 정보를 조회하는 서비스
