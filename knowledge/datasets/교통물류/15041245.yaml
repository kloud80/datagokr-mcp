summary_user: 광주도시철도 노선 역사의 화장실 위치를 화장실 한 곳당 한 행으로 담은 파일(약 3.5KB CSV)로, 운영기관·노선·역명과 지상·지하 구분, 역층, 개찰구 안팎 여부, 가까운 출구번호, 상세위치, 화장실 구분을 담는다. 광주 지하철 이용자나 안내 서비스 개발자가 '이 역에서 개찰구를 통과하지 않고 쓸 수 있는 화장실이 있는지, 몇 번 출구 쪽인지'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 역사 시설·편의시설 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 잇는다.
