description_portal: 생활도로 내 과속 운행으로 인한 교통사고 증가와 보행자 안전 위협 문제 심화, 어린이보호구역과 주거지역 내 속도 저감을 통한 교통사고 예방 정책 강화, 그리고 안전속도 5030 정책 시행과 보행자 중심의 교통안전 환경 조성 필요성 증대에 따라 보령시는 관내 설치된 과속방지턱 현황을 체계적으로 관리하고 있습니다. 과속방지턱은 물리적 속도 저감시설로서 운전자로 하여금 자연스럽게 감속을 유도하여 생활도로와 보행자가 많은 구간에서 교통사고 위험을 현저히 감소시키는 역할을 담당하고 있습니다. 재료별 내구성과 소음 발생 정도, 형태별 속도 저감 효과, 높이와 연장에 따른 안전성 등을 종합적으로 분석하여 지역 특성에 맞는 최적의 과속방지턱 설치 기준을 마련하고, 기존 시설의 개선 필요성 평가와 신규 설치 우선순위 결정에 활용하고 있습니다.
