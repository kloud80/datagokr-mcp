summary_user: 유가보조금관리시스템에서 발급된 택시 유류구매카드 수를 연도별·유종별(LPG·경유, 일부 연도 수소)·카드종류별(구분)로 정리한 전국 단위 집계표로, 757바이트 크기의 작은 CSV 한 장이다. 택시 유가보조금 제도를 살펴보는 분석가나 업계 관계자가 '택시 유류구매카드 발급이 연도별로, 또 LPG에서 수소 등 유종별로 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키가 없고 지역 구분 없는 전국·비공간 자료이므로, 다른 유가보조금 현황(화물·버스)이나 택시 통계와는 연도·유종 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 택시 유류구매카드 발급현황 정보해당 자료는 화물/택시/버스 운송사업자에게 지급하는 유가보조금 제도 운영을 위한 유가보조금관리시스템의 자료로 2015년부터 2024년까지 발급된 택시 유류구매카드 정보를 년도별, 유종별, 카드종류별로 구분한 현황 정보입니다. 해당 자료를 공개함으로써 운송업계 관계자뿐만 아니라 대국민이 유가보조금 제도와 유류구매카드 발급현황에 대한 정보를 제공받아 이를 참고 및 활용할 수 있도록 하는 것이 목적입니다. 또한 민간기업이 관련사업 확장 및 신규사업 발굴을 통해 수익창출에 기여할 수 있을 것으로 예상합니다.
