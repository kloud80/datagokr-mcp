summary_user: 전북특별자치도 14개 시군에 설치된 과속방지턱 20,966개를 한 건씩 담은 파일로, 위치(주소·위도·경도)와 재료·형태·높이·폭·연장, 규격 여부·연속형 여부 등 시설 제원을 기록한다. 지자체 교통 담당자나 분석가가 '어린이보호구역·학교 주변 도로에 규격에 맞지 않는 과속방지턱이 몰려 있는 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군구명·도로명·주소로 맞추거나 위도·경도로 다른 위치 데이터(단속카메라·보호구역 등)와 공간 결합해 쓴다.
description_portal: 이 데이터는 전북특별자치도 14개 시군 전역에 설치된 20,966개의 과속방지턱 위치 정보를 담고 있는 종합적인 교통안전 데이터베이스입니다. 2021년 공공데이터 뉴딜 사업의 일환으로, 2020년 기준의 카카오맵과 네이버지도 로드뷰를 활용한 온라인 실측 방식을 통해 구축되었습니다. 단순히 물리적인 과속방지턱뿐만 아니라, 운전자의 감속을 유도하는 다양한 교통 정온화 시설물의 현황을 포함하고 있어 그 가치가 높습니다. 이 자료는 지역 내 도로별 안전 시설물의 분포를 정밀하게 분석하고, 교통사고 위험 지역을 예측하며, 보행자 중심의 안전한 교통 환경을 조성하기 위한 정책 수립 및 학술 연구에 필수적인 기초 자료로 활용될 수 있습니다.
