summary_user: 부산광역시 도로를 시점–종점 구간(링크)으로 나눈 단위로 링크ID·도로명·시점명·종점명과 실시간 평균 속도·교통량, 생성시간을 담는 실시간 소통 데이터입니다. 운전자나 교통 분석가가 '지금 부산 어느 도로 구간이 막히는가'를 확인하는 데 쓰고, 이력을 쌓으면 상습 정체 구간 분석의 원장으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 링크ID·도로명 같은 이름·코드 매핑이나 같은 기관(부산광역시) 코드로만 연결한다.
description_portal: '부산광역시 내 링크 소통 정보에 대한 데이터로써 부산광역시의 링크 ID, 도로명, 시점명, 종점명, 속도, 교통량 등의 대한 정보를 제공합니다. 링크소통정보란 부산광역시 내 도로 ‘링크(link)’ 단위의 실시간 교통소통현황을 제공하는 공공데이터를 말합니다. 링크란 도로를 일정 구간으로 쪼갠 최소 단위(예: 시점–종점)이고, 각각에 링크 ID, 도로명, 시점명, 종점명, 실시간 평균 속도, 교통량 등의 정보가 포함됩니다. 이 데이터를 통해 보다 세부적인 교통 관련 정보들을 확보할 수 있고 이는 다양하게 활용될 수 있습니다.'
