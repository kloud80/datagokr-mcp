summary_user: 관보에 고시된 철도 기본계획을 고시 한 건씩 정리한 파일로, 관보고시번호·고시기관·노선명·사업구간·사업내용·연장·고시 공사기간을 담으며 전국 범위의 비공간 자료이고 CSV 크기는 약 4KB로 작다. 철도 정책 담당자나 부동산·지역 분석가가 '어느 노선이 어떤 구간으로 언제까지 공사하도록 기본계획이 고시됐나'를 확인하고, 계획 단계 변화를 개발 선행 신호로 볼 때 쓴다. 공통 조인 키가 없어 다른 철도 계획·역 데이터와는 노선명·사업구간 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 국가철도공단_기본계획 고시 데이터는 대한민국 관보고시에 기초하여 정리된 철도기본계획 고시문 정보를 포함하며, 고속철도 및 광역철도 등 철도건설사업과 관련된 핵심 내용을 제공합니다. 본 자료는 철도사업의 추진 방향을 규정하는 기본계획의 고시사항을 정리한 것으로, 노선 개요, 계획 구간, 사업 필요성, 추진 일정, 관계기관 협의 사항 등이 포함되어 있습니다. 고시된 계획은 국가 철도망 구축의 법적·행정적 근거로 활용되며, 해당 데이터는 철도사업 이해관계자 및 정책 수립자에게 철도건설사업의 목표, 범위, 기대효과 등을 체계적으로 제공하여 사업 진행의 기준 자료로 활용됩니다.
