description_portal: 2024년 중장기 개방계획에 의한 테이블 개방정보로서 BIT테이블 외 6개 테이블을 JOIN하여 개방함. 개방자료로는 표출시간, 통신상태, 설치정류장 등의 자료를 포함합니다.아산시에서 제공하는 BIT(버스정보안내단말기) 상태정보 데이터는 관내 버스정류장에 설치된 BIT 단말기의 운영 현황을 종합적으로 관리하기 위하여 구축된 자료이다. 본 데이터는 BIT 고유ID, 정류소 정보, 설치 위치, 운영 상태, 통신 상태, 전원 상태 및 데이터 기준일 등의 항목으로 구성되어 있으며, 대중교통 서비스의 신뢰성 확보와 교통 행정업무의 효율적 운영을 목적으로 한다.해당 데이터는 행정적으로는 BIT 유지관리 및 점검업무에 활용되며, 민간 분야에서는 실시간 버스도착 안내 시스템, 모바일 교통 애플리케이션 등 교통서비스 고도화에 활용될 수 있다. 또한 시민은 이를 통해 정류소 안내기의 정상 동작 여부를 확인함으로써 대중교통 이용 시 불편을 최소화할 수 있다.
