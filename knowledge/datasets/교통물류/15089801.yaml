summary_user: 경기도 의왕시에 등록된 이사화물운송업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 약 2KB)로, 인허가일자·영업상태·업종구분·업체명·도로명/지번 주소를 담는다. 시민이 "의왕시에서 정식 등록되어 현재 영업 중인 이사업체는 어디인가"를 확인하거나, 행정·분석가가 지역 생활물류 업체 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 업체명·주소로 전국화물자동차운송사업자표준데이터 등 허가 원장과 대조하거나 주소를 지오코딩해 위치 데이터와 잇는다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와는 업체명·주소 매칭으로만 연결되며, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터 쪽이다. 범위는 의왕시 한 곳뿐이라 다른 시군 업체는 없다.
