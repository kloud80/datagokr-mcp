summary_user: 택시 유가보조금 지급현황을 연도별(2015~2025년 컬럼)로 법인택시와 개인택시를 나누어 구분(지자체 등)별로 정리한 전국 단위 집계 파일로, 서면청구분은 포함하지 않는다. 지역별 택시 유가보조금이 법인·개인택시에 연도별로 얼마나 지급됐고 어떻게 변했는지 보려는 운송업계 관계자나 정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 '구분' 열의 지자체 이름을 매핑해 연결해야 한다.
description_portal: 택시 유가보조금 지급현황 정보(서면청구 불포함)해당 자료는 화물/택시/버스 운송사업자에게 지급하는 유가보조금 제도 운영을 위한 유가보조금관리시스템의 자료로 2015년부터 2024년까지 지급된 택시 유가보조금 지급정보를 년도별, 사업자별, 지자체별로 구분한 현황 정보입니다. 해당 자료를 공개함으로써 운송업계 관계자뿐만 아니라 대국민이 유가보조금 제도와 유가보조금 지급현황에 대한 정보를 제공받아 이를 참고 및 활용할 수 있도록 하는 것이 목적입니다. 또한 민간기업이 관련사업 확장 및 신규사업 발굴을 통해 수익창출에 기여할 수 있을 것으로 예상합니다.
