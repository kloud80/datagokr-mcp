summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 버스 노선별 인가 GIS 경로를 링크 단위로 담은 자료로, 한 행이 노선 하나의 경로를 이루는 링크 하나와 그 순서(rink_seq)에 해당하는 건별 원천 데이터다. 교통 분석가나 지도 서비스 개발자가 '이 노선은 실제로 어떤 도로 링크를 어떤 순서로 지나가는가'를 재구성하거나 노선별 경로 변경 이력(사용구분·등록일자)을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 노선아이디(route_id)는 같은 경기도 버스 노선·정류장 데이터와, 링크아이디(rink_id)는 링크 형상 데이터와 같은 기관 코드 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)을 기반으로 버스 노선이 인가받은 GIS(Geographic Information System, 지리정보시스템) 경로의 단위 정보를 기록한 자료입니다. 각 노선은 다수의 경로 링크로 구성되며, 해당 경로를 구성하는 링크아이디, 링크순서, 노선아이디 등이 포함되어 노선별 이동경로의 세부 구성을 파악할 수 있습니다. 또한 사용 여부를 나타내는 '사용구분', 등록자 정보와 등록일자, 시외버스의 추가 경로 여부 등의 항목을 포함하여 관리 이력도 확인할 수 있도록 설계되어 있습니다.
