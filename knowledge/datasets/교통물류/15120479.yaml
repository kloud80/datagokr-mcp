summary_user: 경기도 현행화 사업에서 보정한 Tour 기반 여객목적 OD 자료로, 연도별 출발지역·도착지역 쌍마다 가정기반 통근·통학·학원·쇼핑·기타와 비가정기반 업무·쇼핑·기타 통행량, 전체 목적 합계를 담은 집계 데이터다. 교통 분석가나 정책 담당자가 "어느 지역에서 어느 지역으로 출근 통행이 가장 많은가" 같은 목적별 지역 간 이동 수요를 파악하거나 교통 수요 모형의 입력으로 쓴다. 전역 조인 키는 없으며, 출발·도착 지역 코드(cadnlpnt_region_cd, laststop_region_cd)나 지역명을 매핑해 같은 기관의 교통량·인구 자료와 연결한다.
description_portal: "매년 작성되는 현행화 사업에서 보정된 여객목적 OD(Origin-Destination, 출발지와 도착지) 자료입니다. (Tour 기반)※ 해당 자료는 현재로부터 2년전의 자료를 기반으로 현행화되고 있으니 이용에 참고하여 주시기 바랍니다.tour기법의 통행목적 구분은 기본적으로 '가구통행실태조사'의 목적구분을 따르며, 별도의 목적으로 모형화하기에는 통행량이 작은 배웅목적만 친교/개인의 목적과 통합하여 기타 목적으로 분류가정기반 통근 : 집에서 출발한 출근, 업무 / 출근, 업무 후 집으로 도착한 귀가가정기반 통학 : 집에서 출발한 등교 / 등교 후 집으로 도착한 귀가가정기반 학원 : 집에서 출발한 학원가정기반 쇼핑 : 집에서 출발한 쇼핑가정기반 기타 : 집에서 출발한 배웅, 친교 개인업무비가정기반 업무 : 집이 아닌곳에서 출발 / 도착한 출근,업무,귀가비가정기반 쇼핑 : 집이 아닌곳에서 출발 / 도착한 쇼핑비가정기반 기타 : 집이 아닌곳에서 출발 / 도착한 배웅, 등교, 학원, 친교, 개인업무"
