summary_user: 국내 지역 교통공사(서울·인천·대전·대구·광주·부산)와 국가철도공단·한국철도공사·공항철도·SR 등 철도 관련 기관의 규정·내규·세칙·지침을 문서 한 건씩 목록으로 담은 전국 단위 파일로, 제공기관·자료유형·제목·개정일과 첨부파일 다운로드 링크를 함께 준다. 철도시설물 유지보수 담당자나 분석가가 "기관별 시설물 보수 규정의 최신 개정본이 무엇이고 언제 개정됐나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제공기관 이름으로만 대응해 이어 쓴다.
