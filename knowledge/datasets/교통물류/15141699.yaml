description_portal: 정선군시설관리공단이 운영하고 있는 공공시설 내 전기차 충전소 현황자료입니다.전기차 충전소는 전기를 연료로 쓰는 전기자동차 및 전기를 보조 동력원으로 사용하는 플러그인 하이브리드 자동차 전용 충전소입니다.전기차 충전소가 있는 관광지, 야영장 및 체육시설의 시설명, 주소, 설치년도, 기종, 운영기관, 충전량, 충전기타입 등을 한눈에 확인할 수 있습니다.정선군을 전기차로 관광온 이용객이 편리하게 충전소를 찾고 이용할 수 있도록 정리된 정보입니다.전기차 충전소는 100%로 셀프로 이용됩니다.
