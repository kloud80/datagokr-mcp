summary_user: 정선군시설관리공단이 운영하는 관광지·야영장·체육시설 안 전기차 충전소를 충전소별로 정리한 소규모 파일(csv 약 1.4KB)로, 시설명·주소·위도경도·설치년도·기종·급속충전량·충전기타입·이용자제한을 담는다. 전기차로 정선을 찾은 관광객이 '가려는 야영장이나 체육시설에 급속충전기가 있고 누구나 쓸 수 있나'를 확인하거나, 분석가가 지역 공공시설 충전 인프라를 점검할 때 쓴다. 전역 조인 키는 없어 시설명·주소로 맞추거나 위도경도를 써서 환경부 전국 충전소 현황 등 다른 충전소·관광지 데이터와 위치 기준으로 겹쳐 본다.
