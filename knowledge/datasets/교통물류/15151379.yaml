description_portal: 이 데이터는 LG U+와 BC카드의 고가치 민간 데이터를 금융결제원을 통해 결합해 만들어진 융합 데이터이다. 개방형휴게소 3개소에 해당하는 체류시간 정보 및 인구통계학(가구유형) 정보를 담고있는 데이터로써, 연령대별 및 성별에 따른 휴게소 체류시간을 확인할 수 있다. 각 휴게소별로 시간대별 평균 체류시간을 산출하고, 연령대·성별·가구유형·가구원수 등 인구통계학적 정보를 포함하여 이용 특성을 세분화하였다. 이를 통해 특정 시간대별 이용객 집중도와 지역주민 이용패턴을 파악하고, 지역 연계형 서비스 제공 및 휴게소 운영 효율화 방안 수립에 활용할 수 있다. 데이터는 체류시간을 분 단위로 제공하며, 교통 수요 분석, 지역 상권 활성화, 휴게소 서비스 개선, 지역사회 협력정책 수립 등 다양한 분야에서 활용이 가능하다. 한국도로공사는 본 데이터를 통해 지역사회와 상생하는 휴게소 운영체계 구축과 이용자 중심의 교통복지 향상에 기여하고자 한다.※ 본 데이터는 합성데이터로, 합성데이터 특성상 주기성 데이터 등록이 어려운 관계로 수시 1회성 데이터로 등록하였습니다.※ 본 데이터는 과학기술정보통신부 및 한국지능정보사회진흥원의 2025년 가명정보활용지원사업 지원을 받아 생성된 데이터를 기반으로 수행한 사업임
