summary_user: 대구광역시 ITS의 DSRC 장비가 하이패스 부착 차량을 검지해 만든 교통소통 통계로, 날짜·시간대별로 가로명과 링크명 단위의 속도값을 담은 집계 파일(CSV 약 23MB)입니다. 교통 분석가나 시민이 '특정 도로 구간이 평일 몇 시에 가장 막히는가' 같은 상습 정체·혼잡 시간대 질문에 쓴다. 전역 조인 키가 없어 다른 링크 속도·도로망 데이터와는 가로명·링크명 같은 이름을 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 대구광역시 링크별, 시간별 통계는 지능형교통시스템(ITS)를 통해 수집되는 교통소통정보를 제공하는 통계자료입니다. DSRC(Dedicated Short Range Communications, 단거리 전용 통신)장비를 통해 하이패스를 부착한 차량을 검지한 데이터를 기반으로 일시, 가로명, 링크명, 속도값을 제공합니다. 해당 자료를 통해 시간대별 평균 속도를 분석하여 특정 도로 구간의 교통 흐름 파악 및 혼잡 시간대를 예측할 수 있으며, 도로 개선이나 교통정책 수립에 필요한 결과값을 추출할 수 있습니다.
