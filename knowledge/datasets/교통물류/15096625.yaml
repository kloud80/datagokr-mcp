description_portal: 이 데이터는 전북특별자치도 내 도로폭 6미터 이하 생활도로의 주차 공간 공급과 수요의 불균형 상태를 분석한 공간정보입니다. 2021년 공공데이터 뉴딜 사업의 일환으로 구축되었으며, 로드뷰 및 현장 실측을 통해 확보한 실제 주차면 수와 불법 주정차 현황 데이터에 차량 등록 대수, 도로 속성 등 공공데이터를 융합하여 '주정차 수요-공급 불균형 지수(PRI)'를 도출하였습니다. 500미터 격자 단위로 구성된 이 공간 데이터는 지역별 주차난의 심각도를 과학적으로 보여주며, 어느 지역에 공영주차장 확충이 시급한지, 또는 불법주정차 단속이 우선적으로 필요한지를 객관적으로 판단할 수 있는 중요한 근거 자료입니다. 도시 교통 문제 해결 및 시민 편의 증진을 위한 정책 수립에 핵심적으로 활용될 수 있습니다.
