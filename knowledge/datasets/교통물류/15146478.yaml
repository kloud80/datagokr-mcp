summary_user: 서울시가 운영하는 시영(공영) 주차장을 한 곳씩 담아, 주차장 명칭·주소·종류·운영 구분과 함께 현재 주차 대수·갱신 시각, 총 주차면 수, 요일별 운영시간, 기본·추가·일 최대 요금, 공유주차장 여부를 제공하는 실시간 현황 데이터다. 시민이 목적지 근처 시영주차장에 지금 빈자리가 있는지, 요금은 얼마인지 확인하거나, 분석가가 주차장별 이용률을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 전국주차장정보표준데이터(좌표·요금·면수 원장) 같은 다른 데이터와는 주차장 이름·주소 매칭이나 서울시 자체 코드(PKLT_CD)로만 연결한다.
description_portal: 이 데이터는 서울시 시영주차장 실시간 주차대수 정보를 제공하며, 서울시가 운영하는 공영주차장의 현황을 종합적으로 담고 있습니다. 주요 항목에는 주차장 코드와 명칭, 주소, 주차장 종류(노외·노상 등), 운영 구분(시간제·정기권 등), 연락처, 실시간 주차현황 제공 여부, 현재 주차 가능 대수, 총 주차면 수, 기본 요금 및 시간, 추가 요금 체계, 일 최대 요금, 공유 주차장 여부 및 관리업체 정보 등이 포함되어 있습니다. 이 데이터는 시민들이 실시간으로 주차 가능 여부를 확인하여 편리하게 이용할 수 있도록 지원하며, 나아가 서울시의 주차 정책 수립과 효율적인 공간 활용에도 중요한 근거 자료로 활용됩니다.
