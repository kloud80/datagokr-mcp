summary_user: SRT 고속열차의 편성(편성번호)별로 열차 내 자동심장충격기가 어느 객차 위치에 배치돼 있는지를 소유구분·제조업체·관할보건소와 함께 담은 1회성 현황표로, 2023년 9월 기준 소규모 CSV 파일이다. 철도 안전 담당자나 응급의료 분석가가 'SRT 각 편성에 자동심장충격기가 몇 대, 어느 호차에 있고 어느 보건소 관할인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 편성번호나 관할보건소 이름을 매핑하는 방식으로만 이어 쓴다.
description_portal: 1. 이 데이터는 주식회사 에스알이 운영중인 고속열차 SRT의 열차 내 자동심장충격기 보유 현황에 대한 자료입니다.  2. 데이터 내 소유구분, 편성번호, 배치 위치, 제조업체, 관할보건소의 항목을 제공합니다.3. 예시) 편성번호 201 내 T5, T7 자동심장충격기 배치* 해당 데이터는 1회성 데이터입니다.* 2023년 9월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.
