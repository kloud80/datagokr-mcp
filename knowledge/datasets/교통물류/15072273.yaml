summary_user: 한국교통안전공단이 교통카드 데이터를 분석해 산출한 대중교통 환승통행률(%)을 지역 구분별로 평일·토요일·일요일 값으로 나눠 담은 집계 파일이며, 범위는 전국이고 파일 크기는 367바이트로 소규모 요약표입니다. 정책 분석가나 지자체 교통 담당자가 "우리 지역의 대중교통 통행 중 환승 비율이 평일과 주말에 어떻게 다른가"를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 교통카드 이용분석 자료와는 지역 이름(구분1)을 맞춰 연결해야 한다.
