summary_user: 한국도로공사가 관리하는 전주 수목원에 식재·보존된 식물 유전자원을 종 단위로 정리한 목록 파일로, 과명·구분·식물유전자원명·학명·수량을 담는다(csv 약 285KB). 연구자나 환경교육 담당자가 '전주 수목원에 어떤 과의 어떤 식물이 몇 개체 보존돼 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식물·생물자원 데이터와는 학명이나 식물명을 맞춰 이어 써야 한다.
description_portal: 본 데이터는 한국도로공사에서 관리하는 전주 수목원에 식재된 식물 유전자원의 정보를 제공한다. 데이터는 일련번호, 과명, 구분, 식물유전자원명, 학명, 수량 등의 항목으로 구성되어 있으며, 전주 수목원에 보존된 다양한 식물 종의 분류와 학술 정보를 포함하고 있다. 이를 통해 수목원 내 자생 및 외래 식물 종에 대한 보전 현황을 파악하고, 식물 다양성 연구, 생물자원 관리, 환경 교육 자료 등으로 활용할 수 있다. 특히, 학명 기반의 식별 정보를 제공함으로써 생물학적 연구뿐 아니라 시민들의 식물 이해도 제고에도 기여한다. 본 자료는 수목원 운영의 투명성을 높이고, 관련 기관 및 연구자들이 식물 자원 현황을 파악하는 데 실질적인 도움을 줄 수 있다.
