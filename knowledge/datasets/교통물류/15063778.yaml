summary_user: 대구광역시 승용차요일제의 구·군별 전체차량 대수, 참여가능차량 대수, 참여차량 대수와 참여율(퍼센트)을 담은 시군구 단위 집계 파일(csv, 321바이트)이다. 대구시 각 구·군에서 승용차요일제에 참여하는 차량이 얼마나 되고 참여율이 어느 구·군에서 높거나 낮은지 비교하려는 분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 구·군 이름을 행정구역 코드나 다른 구·군별 교통·인구 통계에 이름 매핑해서 이어 쓴다.
description_portal: 대구시에서 운영중인 승용차요일제 참여자 통계자료 입니다. 대구시승용차요일제는 일주일에 하루 운휴일을 정하여 승용차를 이용하지 않고 대중교통을 이용하면 대중교통 요금의 일정 부분을 마일리지로 적립해드리는 제도입니다. 대중교통수송 분담률을 제고하고 탄소중립을 목표로 하는 시민들의 자발적인 참여를 독려하는 운동으로 탄소 중립 및 대중교통 이용을 장려하는 취지의 운동입니다. 적립한 대중교통 마일리지는 지역 화폐로 변환하여 현금처럼 사용할 수 있습니다. 대구광역시승용차요일제 참여자 통계자료는 4가지로, 구군/전체차량/참여가능차량/참여차량이 있습니다.
