description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '안전정책/생활안전' 중 '내수면 유·도선 및 안전사고', '연도별 내수면 유·도선 보유'에 관한 통계입니다. 선박 수(척)(소계, 유선, 도선), 규모별(척)(무동력, 동력선 소계, 동력선 5t미만, 동력선 5100t, 동력선 101t 이상, 모터보트), 유·도선장(개소)(소계, 유선장, 도선장) 등 연도별 내수면 유·도선 보유 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
