summary_user: 행정안전 통계연보에 실린 전국 단위 연도별 내수면 유·도선 보유 현황 집계로, 선박 수(유선·도선), 규모별 선박 수(무동력, 동력선 톤급별, 모터보트), 유·도선장 개소 수를 연도별로 담는다. 강·호수의 유람선과 도선 운영 규모가 해마다 어떻게 바뀌었는지, 동력선 비중이 늘었는지를 보려는 안전정책 담당자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 연도나 항목 이름을 맞춰 붙여야 하며, 같은 통계연보의 내수면 유·도선 안전사고 통계와 함께 보는 것이 자연스럽다.
limits: 전국·비공간 집계라 시도·시군구별이나 개별 선박·선착장 단위 분석에는 쓸 수 없다. 공통 조인 키가 없어 다른 데이터와는 연도·이름 매핑으로만 연결된다.
