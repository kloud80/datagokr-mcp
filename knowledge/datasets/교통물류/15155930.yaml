description_portal: '제시된 데이터 항목들은 시내버스 정류장의 위치, 기능, 운영 상태 및 주변 환경 정보를 종합적으로 담고 있어, 지능형 교통 시스템(ITS) 구축과 대중교통 서비스 개선에 필수적인 공공데이터셋입니다.주요 항목별 기능정류소번호: 각 정류소를 고유하게 식별하는 번호입니다. 이는 버스 정보 시스템(BIS)에서 실시간 버스 위치, 도착 정보, 노선 관리를 연동하는 데 사용되는 **가장 핵심적인 식별자(ID)**입니다.교차로 구분: 정류소의 설치 위치가 일반 도로변인지, 아니면 교차로 주변에 위치하는지를 분류하여 교통 흐름 및 안전성 분석에 활용됩니다.정류소명 약칭: 정식 명칭이 아닌, 시스템에서 관리 편의를 위해 사용하거나 LED 전광판 등에 표시할 수 있는 줄임말 이름입니다.경도와 위도: 정류소의 정확한 지리적 위치를 WGS84와 같은 표준 좌표계로 제공하는 항목입니다. 모바일 앱, 지도 서비스, 네비게이션 등에 정류소 위치를 표시하는 데 사용됩니다.기본정류소와 사용여부: 정류소가 주요 거점 정류소인지, 그리고 현재 실제로 운행에 사용되고 있는지의 활성화 상태를 나타냅니다.진입각도: 버스가 정류장에 진입할 때의 도로와의 각도 또는 정류장의 방향을 나타내어, 정류소 설계의 적절성과 버스의 정차 편의성을 분석하는 데 활용될 수 있습니다.안내기설치: 정류장에 **버스 도착 정보 안내기(BIT)**가 설치되어 운영 중인지 여부를 나타냅니다.노선상 다음정류소: 해당 정류소에서 출발했을 때, 노선 순서상 다음에 도착하는 정류소의 ID를 지정하여 노선 순서와 연결성을 정의합니다.지역: 정류소가 위치한 특정 행정구역 (예: 시, 군, 읍면동) 정보를 포함합니다.진주 정류장 ID: 인접 지역인 진주시의 버스 시스템과 연동이 필요할 경우 사용되는 진주 시스템 고유 식별자입니다. (통합 교통 시스템 운영에 중요)평균속도: 해당 정류소 구간에서 버스가 운행하는 평균 속도 정보를 제공하여 운행 효율성 및 정체 구간을 분석하는 데 기초 자료로 사'
