summary_user: 경상남도 사천시 시내버스 정류장을 한 줄에 하나씩 담은 정류장 원장 파일로, 정류소번호·약칭·경위도 좌표·교차로 구분·기본정류소·사용여부·안내기(BIT) 설치 여부·노선상 다음정류소·지역·평균속도를 담는다(CSV 약 96KB). 사천시 시민이나 앱 개발자가 "우리 동네 정류장은 어디에 있고, 도착 안내기가 설치돼 있나"를 확인하거나, 분석가가 정류장 분포와 안내기 설치 현황을 지도에 올려 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 정류소번호·정류소명 매핑이나 좌표 기반 공간 결합으로 이어야 하며, 같은 기관의 BIS 노선·도착 정보와는 정류소번호로 맞춰 보는 것이 현실적이다.
limits: 실시간 버스 도착이나 승하차 인원은 담지 않아 별도 BIS·TAGO 데이터가 필요하다. 표준 정류소 ID 같은 전역 조인 키가 없어 다른 지역·전국 데이터와 붙일 때는 이름·코드 매핑을 직접 해야 하고, 범위는 사천시 한 곳에 한정된다.
