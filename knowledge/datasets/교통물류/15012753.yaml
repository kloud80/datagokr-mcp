summary_user: 동대문구 거주자우선주차장을 동·지구별로 나눠 구분, 구획수, 운영형태를 담은 현황 파일(csv, 약 5KB)로, 개별 주차면이 아니라 지구 단위로 정리된 표다. 동대문구 주민이 우리 동네에 거주자우선주차 구획이 몇 면 있고 어떻게 운영되는지 확인하거나, 분석가가 동별 거주자우선주차 공급량을 비교하는 데 쓴다. 전역 조인 키가 없어 행정동 이름(동명)을 문자로 맞춰 행정동 코드표나 다른 동별 통계와 잇고, 좌표·요금이 필요하면 전국주차장정보표준데이터와 이름 기준으로 따로 대조한다.
limits: 주차장관리번호나 행정코드 같은 공통 키가 없어 다른 데이터와는 동 이름 매핑으로만 연결되며, 위치 좌표나 실시간 주차 가능 대수는 담지 않는다. 메타데이터상 범위는 '전국'으로 표기돼 있으나 내용은 동대문구 한정으로 보고 해석한다.
