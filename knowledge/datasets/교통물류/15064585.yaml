summary_user: 운수종사자관리시스템에 등록된 버스·택시·화물자동차 운수종사자의 교통사고를 연도·업종·시도별로 묶어 사고건수와 사망자·중상자·경상자 수로 집계한 전국 단위 통계 파일입니다. 교통안전 분석가나 지자체 담당자가 "우리 시도에서 택시와 화물차 중 어느 업종 운전자의 사고·사망자가 더 많고 해마다 어떻게 변하나" 같은 질문에 쓴다. 전역 조인 키가 없어 시도 이름이나 업종명을 직접 맞춰 도로교통공단 사고 통계나 지자체 사고 통계와 나란히 비교한다.
description_portal: '운수종사자관리시템은 여객자동차 운수사업법 및 화물자동차 운수사업법에 따라 버스, 택시, 화물자동차를 운전하는 운수종사자의 종사자격 등을 관리하는 시스템 입니다.관리하고 있는 모든 데이터는 개인정보이므로, 데이터를 가공하여 통계데이터를 개방하였습니다.  * 관리항목 : 운수종사자 경력사항, 교통사고 및 법규위반 이력, 운전적성정밀검사, 운전면허, 자격증 정보, 교육현황정보해당 데이터는 운수종사자관리시스템에 등록된 운수종사자의 교통사고정보를 시도별, 업종별, 교통사고건수, 사망자, 중상자, 경사자수로 가공하여 제공하는 정보 입니다.'
