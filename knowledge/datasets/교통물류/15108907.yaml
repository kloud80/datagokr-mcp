summary_user: 강원특별자치도 강릉시의 전기차 충전소를 충전기 단위로 담은 현황 파일로, 충전소명·사용시간·이용자 제한·충전기 상태와 타입·용량·도로명주소·위도와 경도를 담고 위치 공간정보(shp)도 함께 제공한다. 강릉 시민이나 방문객이 '근처에 24시간 일반 개방되는 급속 충전기가 있는가'를 확인하거나, 분석가가 시내 충전 인프라 분포와 공백 지역을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 충전소명·주소 같은 이름 매칭이나 위도·경도 좌표로 이어 쓴다.
description_portal: '강원특별자치도 강릉시에서 2022년 기업매칭 지원 사업으로 구축한 전기차 충전소 설치 현황 데이터입니다.충전소명: 전기차 충전기가 설치된 충전소의 공식 명칭사용시간: 충전소를 이용할 수 있는 운영 시간(예: 24시간, 09:00~18:00 등)이용자제한여부: 일반 개방 여부 또는 입주민·직원 전용 등 이용 제한 정보충전기상태: 충전기가 정상 운영 중인지, 점검·중지 상태인지 표시충전기타입: 급속·완속 여부와 커넥터 종류 등 충전 방식 정보소재지위치정보: 충전소의 도로명주소 및 세부 위치 또는 좌표 정보전자도면(shp): 충전소 위치를 지도에서 활용할 수 있도록 제공하는 공간정보(Shapefile)이 데이터는 강릉시 전기차 충전소의 위치와 운영 특성을 간단히 파악할 수 있도록 해 주며, 충전소 안내 서비스 구축, 충전 인프라 확충 계획 수립, 친환경 교통 정책·모빌리티 서비스 연계 등에 활용할 수 있는 공공데이터입니다.'
