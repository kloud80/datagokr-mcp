summary_user: 서울교통공사 관할 1~8호선의 불편민원 접수 건수를 연도·호선·민원구분(전동차 냉난방, 열차내 질서저해, 열차이용예절, 기타)별로 집계한 작은 CSV 파일(약 1KB)이다. 지하철 이용객이나 교통 분석가가 '어느 호선에서 냉난방이나 질서저해 민원이 많이 들어오는가'를 비교할 때 쓴다. 전역 조인 키는 없어서 호선 이름을 기준으로 같은 기관의 호선별 승하차·혼잡 데이터와 이름 매핑으로 이어 쓴다.
limits: 호선 단위 집계라서 역별·시간대별 민원이나 개별 민원 내용은 볼 수 없다. 표준 코드 같은 조인 키가 없으므로 다른 데이터와 붙일 때는 호선 이름 표기를 직접 맞춰야 한다.
