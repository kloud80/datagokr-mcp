summary_user: 정류장별로 운행일자·시간대·이용자유형에 따른 승차인원과 하차인원을 담은 이용량 데이터이며, 시도·시군구·읍면동 단위 지역 정보가 붙고 범위는 전국이다. 지자체나 교통 분석가가 특정 지역 정류장의 시간대별 혼잡 정도와 노선·배차 조정 필요를 확인하는 질문에 쓴다. 시군구코드(sgg_cd)와 정류장ID(sttn_id)가 조인 키라서, 시군구코드를 제공하는 다른 코드 데이터나 정류장·노선 원장 데이터와 이어 쓴다.
limits: 필수 파라미터 sgg_cd는 다른 데이터에서 먼저 받아 넘겨야 하며, 오퍼레이션 3개 중 일별(/getDailyTripVolumebyStop)과 월별(/getMonthlyTripVolumebyStop) 2개는 최소 파라미터로 응답이 없었다. 검증 호출에서는 수신 행이 1행뿐이어서 실제 데이터 규모와 갱신 주기는 확인되지 않았다.
