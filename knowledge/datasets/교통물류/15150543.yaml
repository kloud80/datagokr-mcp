description_portal: '*본 데이터는 특정 알고리즘을 이용하여 생성한 모의 합성 데이터이므로 데이터 활용 시 주의 바랍니다한국도로교통공단이 제공하는 터널 사고 특성 이해를 지원하기 위해 구성한 학습·분석용 합성데이터이다. 터널 환경에서 관찰되는 사고 맥락을 설명하도록 생성하였다. 컬럼은 발생지역, 가해자성별·연령대·차종, 시간대, 사고유형, 사망자수, 중상자수, 경상자수, 부상신고자수로, 공간·인적 특성 및 피해 정도를 일관된 정의에 따라 표준화하였다. 시간대–차종–연령대 교차분석으로 시인성 저하 등 터널 특유 위험 패턴을 탐지하고, 사망·부상 지표로 사고 심각도를 정량화하여 취약 구간 파악, 안전시설 개선 검토, 교육·정책 시뮬레이션에 활용할 수 있다.'
