summary_user: SRT를 이용한 65세 이상 경로 고객 수를 개통 이후 연도별 한 행에 1월~12월 월별 값(단위 천 명)으로 정리한 전국 단위 집계 파일입니다. 교통 분석가나 정책 담당자가 고속철도 고령 이용객이 어느 달에 늘고 줄며 해마다 어떻게 변하는지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 SRT 월별 이용객 통계와는 연도·월을 기준으로 맞춰 이어 쓴다.
