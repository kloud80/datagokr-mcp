description_portal: '제주특별자치도 내 특수여객(장의차) 현황 데이터를 제공합니다.항목: 업체명, 연락처, 차량(승용/승합) 보유 대수 등*「여객자동차 운수사업법 시행령」 기준 ""특수여객자동차운송사업""은 운행계통을 정하지 아니하고 전국을 사업구역으로 하여 1개의 운송계약에 따라 국토교통부령으로 정하는 특수한 자동차를 사용하여 장례에 참여하는 자와 시체(유골을 포함한다)를 운송하는 사업을 말함- 특수형 승합자동차 또는 승용자동차. 이 경우 일반장의자동차 및 운구전용 장의자동차로 구분함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1498850'
