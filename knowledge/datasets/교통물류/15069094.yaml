summary_user: 경상북도 칠곡군 관내 시내버스의 노선별 운행 정보를 노선번호, 출발지, 도착지, 주요 경유지로 담은 노선 단위 목록 파일(CSV, 약 13.5KB)이다. 칠곡군 주민이나 이동성 서비스 개발자가 '이 노선이 어디서 출발해 어디를 거쳐 어디로 가는가'를 확인하거나 군내 노선망을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 버스 정류장·노선 데이터와는 노선번호나 지명 같은 이름을 맞춰 연결해야 한다.
