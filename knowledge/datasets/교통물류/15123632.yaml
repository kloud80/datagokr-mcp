summary_user: 경기도 이천시에 허가된 화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 허가 현황 파일로, 인허가일자·영업상태·업종구분·업체명·도로명주소·연락처·데이터기준일자를 포함한다. 화주나 사업자가 이천시의 특정 운송업체가 허가받아 현재 영업 중인 운송사인지 확인하거나, 분석가가 이천시 화물운송업체의 업종별 분포와 위치를 파악하는 데 쓴다. 전역 조인 키가 없어서 전국화물자동차운송사업자표준데이터 등 다른 자료와는 업체명·도로명주소 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 이천시에 등록된 화물자동차 운송사업자에 대한 허가 현황을 정리한 자료로, 시군명, 업종, 업체명, 주소, 차량 보유대수, 전화번호, 데이터 기준일자 등의 정보를 포함합니다. 이를 통해 특정 화물운송업체의 등록 현황과 운영 규모를 파악할 수 있으며, 행정기관은 이를 바탕으로 지역별 운송 인프라 관리, 불법 운송 단속, 업종별 등록 변화 추이 분석 등의 업무를 수행할 수 있습니다. 차량 대수 항목은 업체별 수송역량 분석에 활용되고, 주소·연락처 정보는 지도 기반의 현장 점검, 지역별 수요 대응 체계 수립 등에 유용합니다. 또한 기준일자는 연도별 비교 분석 및 최신 정보 유지 관리를 위한 기준값으로 활용됩니다.
