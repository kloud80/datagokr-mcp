summary_user: 서울 동작구의 자동차 등록 대수를 행정동과 사용연료(휘발유·경유·LPG·전기 등)별로 나누고, 승용·승합·화물·특수 차종마다 관용·자가용·영업용으로 구분해 담은 집계 파일(CSV)입니다. 동작구 안에서 어느 동에 전기차나 경유 화물차 등록이 많은지 비교하려는 주민·분석가가 친환경차 보급 현황이나 지역별 차량 수요를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 동 이름을 행정동 코드로 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구의 연료별 자동차등록현황을 나타내는 것으로, 동별 및 사용연료, 관용 및 자가용, 화물용 등으로 현황을 나타내고 있습니다.승용, 승합, 화물 등 차량을 자가용·영업용 등으로 구분하여 등록 대수를 제공합니다.휘발유, 경유, LPG, 전기 등 연료 유형에 따른 자동차 등록 현황 데이터입니다.행정동 단위 자동차 등록 현황을 통해 지역별 차량 수요 및 교통 특성을 파악할 수 있습니다.자동차 사용 연료별 등록 현황을 기반으로 지역 내 에너지 소비 및 친환경차 보급 추이를 분석할 수 있습니다.
