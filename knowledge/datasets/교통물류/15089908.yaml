summary_user: 인천광역시 지능형교통정보시스템(UTIS)이 운영하는 도로 CCTV의 설치 위치명·주소·위경도를 CCTV 한 대씩 담은 위치 목록 파일(csv, 약 8KB)입니다. 교통 분석가나 시 담당자가 '인천 시내 어느 교차로·도로 구간에 교통 CCTV가 설치돼 있고 감시 공백 구간은 어디인가'를 지도에서 확인하는 데 씁니다. 전역 조인 키나 코드가 없어, 다른 교통·사고 데이터와는 위경도 좌표로 공간 결합하거나 주소·위치명을 맞춰 연결합니다.
description_portal: 인천광역시 UTIS(지능형교통정보시스템)의 CCTV 설치위치(위치,주소,위경도)에 관련된 데이터 입니다. CCTV는 도로 상황을 실시간으로 모니터링하고 교통 흐름을 분석하며, 돌발 상황 발생 시 신속한 대응을 지원하는 핵심 인프라입니다. <활용 목적> 이 자료는 교통 혼잡 완화, 사고 예방, 돌발 상황 대응, 자율주행 지원 등 다양한 교통 관리 정책에 필수적입니다. 또한, CCTV 위치 기반 데이터를 활용해 교통 안전 인프라를 강화하고, 스마트 교통망 구축 및 도시 교통 운영의 투명성과 효율성을 높이는 데 중요한 기초 정보를 제공합니다.
