summary_user: 부산광역시 준공영제 시내버스의 차량 한 대마다 운수사, 인가노선, 차량번호, 연식, 연료, 차량구분, 운행·상용 구분을 담은 건별 등록 현황 파일이다. 노선별 투입 대수, 연식별 차령 분포, 연료별(전기·CNG 등) 버스 구성을 확인하려는 교통 분석가나 시민이 '어느 노선에 몇 대가 다니고, 내구연한이 가까운 차량은 얼마나 되나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 노선·정류장 원장이나 BIS 도착정보와는 인가노선 번호나 운수사 이름을 직접 맞춰 이어 쓴다.
description_portal: 개방데이터는 부산광역시 시내버스 업체별 연도별 버스 등록대수 현황으로 버스회사명,버스노선번호, 버스차량번호, 등록년도, 연료, 차량유형 등의 항목에 대해서, 부산시 준공영제로 운영중인 2,511대 버스에 대한 정보를 제공하고 있습니다.노선별로 운행되는 버스대수, 연도별 차량대수, 연료별 버스대수 등 확인을 통해 부산광역시에서 운행되는 주요 시내버스 통계를 생성할 수 있습니다. 버스내구연한은 총 9년이고  필요에 따라 2년연장이 가능하며 해당 데이터는 매년 지속적인 업데이트하고 있습니다.
