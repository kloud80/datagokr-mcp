summary_user: 대전광역시 유성구 관내 전기차 등록 대수를 기준년월과 행정동·법정동 단위로 집계한 파일 데이터로, 포털 설명 기준 746행이다. 분석가나 지자체 담당자가 유성구 어느 동에서 전기차 등록이 빠르게 늘고 있는지 살펴 충전 인프라 확충 지역을 고르는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위의 충전소 위치·인구·주차장 데이터와 이어 쓰고, 행정동코드로 행정동 기준 통계와도 맞출 수 있다.
description_portal: 대전광역시 유성구 관내 월별 전기차등록 대수에 대한 데이터를 제공합니다.해당 데이터는 기준년월, 시도코드, 시도이름, 시군구 코드, 시군구이름, 행정동코드, 행정동이름, 법정동코드, 법정동이름, 등록대수 등의 항목을 제공하며, 총 746건의 행으로 구성되어 있습니다.해당 데이터는 친환경 차량 수요 변화를 분석하는 데 활용할 수 있습니다.또한 친환경 교통정책 수립, 전기차 충전 인프라 확충 계획 수립 등에 활용 가능합니다.그 외에도 자동차 시장 분석, 친환경 산업 동향 파악, 충전 서비스 수요 예측 등 다양한 분야에 활용할 수 있습니다.
