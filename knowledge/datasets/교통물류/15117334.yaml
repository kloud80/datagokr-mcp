summary_user: "세종특별자치시 내 횡단보도를 한 곳씩 담은 파일로, 횡단보도 종류(일반·고원식), 위치 설명, 교통섬과 보행자 신호등 유무, 도로 차로 수, 도로명, 도로명·지번 주소, 위도·경도를 담는다. 보행 안전을 살피는 주민이나 교통·도시 분석가가 '우리 동네 어느 횡단보도에 보행자 신호등이 없고 차로가 많은가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위도·경도를 기준으로 공간 결합해 쓴다(예: 어린이보호구역·무인단속카메라 위치)."
description_portal: 세종특별자치시 횡단보도 정보를 제공합니다.데이터는 연번, 횡단보도 종류(일반, 고원식), 위치, 교통섬 유무, 도로차로 수, 도로명칭, 도로명 주소, 지번주소, 보행자 신호등 유무, 위도, 경도로 구성되어 있으며횡단보도는 봉산1리 마을회관, 세종우리땅 공인중개사사무소 앞, 첫마을 3단지 301동-308동 사이, 신흥주공아파트 버스정류장 앞, 고운동 스마트큐브 1 앞 등에 있습니다.횡단보도는 표준데이터셋으로 제공되는 데이터입니다.횡단보도 정보 기타는 데이터 제공 신청에 맞춘 항목으로 구성하였습니다.
