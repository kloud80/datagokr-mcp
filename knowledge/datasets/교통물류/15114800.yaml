summary_user: 충청북도에 등록된 일반화물자동차 운송업체를 업체 1건당 1행으로 담은 파일로, 사업자구분·가입조합·운수회사 코드·지역과 관할관청·면허정보·면허대수·보유대수·영업시작일을 포함한다(포털 설명 기준 2025년 9월 5일, 1,187개 업체, 면허 7,868대). 화물 운송을 맡기려는 화주나 분석가가 '이 업체가 충북에서 허가받은 일반화물 운송사인지, 면허 대비 실제 보유 차량은 몇 대인지'를 확인하는 데 쓴다. 전역 조인 키가 없어 운수회사명이나 운수회사 코드를 매핑해 전국화물자동차운송사업자표준데이터 등 허가 원장과 대조하는 방식으로 이어 쓴다.
description_portal: '충청북도 일반화물운송업체에 대한 데이터로 사업자구분, 가입조합정보, 운수회사코드, 지역 및 관할관청 정보, 운수회사명,  면허정보, 면허대수, 보유대수, 영업시작일 그리고 정보입력기관에 관한 데이터를 제공합니다. 2025년 9월 5일 기준으로 작성 되었습니다. 총 1187개의 운송업체에 7,868대의 면허를 보유하고 있습니다.  화물자동차운수사업법에 따라   1. 일반화물자동차 운송사업: 20대 이상의 범위에서 대통령령으로 정하는 대수 이상의 화물자동차를 사용하여 화물을 운송하는 사업  2. 개인화물자동차 운송사업: 화물자동차 1대를 사용하여 화물을 운송하는 사업으로서 대통령령으로 정하는 사업 로 분류됩니다.'
