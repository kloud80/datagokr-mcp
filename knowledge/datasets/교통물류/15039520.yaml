summary_user: 인천광역시 서구에 등록된 영업용 화물자동차 운송사업 현황을 기준연도별로 일반·개별·용달 차종과 1대 보유·2대 이상 보유로 나눠 집계한 소규모 파일(csv 445바이트)이다. 서구 지역 물류 정책을 검토하는 공무원이나 분석가가 "서구의 화물운송사업은 용달·개별 같은 1대 보유 영세 사업자 비중이 얼마나 되나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역명(지역)과 기준 연도를 기준으로 다른 시군구 현황이나 전국화물자동차운송사업자표준데이터와 이름 매핑으로만 맞춰 쓴다.
