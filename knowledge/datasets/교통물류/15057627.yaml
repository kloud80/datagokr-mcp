summary_user: 경기도 내 버스전용차로를 구간 단위로 정리한 현황 자료로, 시군별 구간명·노선명·전용차로 종류·연장거리·운영시간 구분과 운영시간·시행일자·집계년월을 담는다. 교통 분석가나 정책 담당자가 "우리 시군의 버스전용차로는 어느 구간에 몇 km가 있고, 어떤 시간대에 통행이 제한되는가"를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로, 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 노선명 같은 이름·코드 매핑으로만 잇는다.
description_portal: 이 데이터는 경기도 내 버스전용차로의 설치 및 운영 현황을 정리한 자료로, 구간별 전용차로 노선명, 연장거리(km), 운영시간, 시행일자, 차로종류 등의 항목을 포함합니다. 시군명 및 코드, 집계년월 등의 정보도 제공되며, 전용차로 운영체계 분석, 대중교통 효율성 평가, 교통혼잡 개선 및 전용차로 정책 수립 등의 목적에 활용될 수 있습니다. 특히 운영시간정보(OPERT_TM_INFO)와 전용차로종류명(DVR_CARTRK_KIND_NM)은 시간대 및 차로 유형별 통행 제한 조건 분석에 유용합니다. 데이터는 수시로 갱신되며 Open API를 통해 실시간 접근 및 연동이 가능합니다.
