summary_user: 대구광역시 읍면동(7개 구는 행정동, 달성군·군위군은 읍면)마다 등록된 전기차 대수를 용도(관용·자가용·영업용)와 차종(승용·승합·화물·특수)으로 나눈 12분류와 합계로 담은 집계 파일입니다. 충전기 설치 위치를 정하려는 지자체·충전사업자가 대구에서 전기차가 많이 등록된 동네가 어디인지 묻는 질문에 쓴다. 표준 행정동 코드 같은 전역 조인 키가 없어, 다른 데이터와는 행정동 이름(행정동)을 행정구역 코드표에 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 대구광역시 행정동별 전기차 등록대수로서 행정동별, 전기차(승용,승합,특수,화물) 등록대수에 관한 데이터를 제공하고 있습니다. 단, 달성군과 군위군은 읍면별 전기자동차 대수 제공-관용, 자가용, 영업용을 구분하여 승용, 승합, 화물, 특수차의 전기자동차 등록대수 제공   (행정동별 12분류의 전기차대수 제공)- 대구광역시는 7개구는 동별, 2개군은 읍면별로 총151개 읍면동으로 구분- 중구 12개동, 동구 23개동, 서구 17개동, 남구 13개동, 북구 23개동, 수성구 23개동, 달서구 23개동, 달성군 9개읍면, 군위군 8개읍- 매년 10월말 기준 자료를 제공
legal_basis_portal: 전기자동차 충전시설 확보를 위한 기초자료
