summary_user: 안양시 관내 주요 도로에 설치된 도로표지판을 한 개씩 관리번호 단위로 담은 시설물 목록 파일(CSV, 약 60KB)로, 높이·가로·세로 규격, 표준 규격, 설치일자, 관할지역이 들어 있다. 시 도로관리 담당자나 분석가가 "설치된 지 오래된 표지판이 어느 동에 몰려 있어 교체를 먼저 해야 하나" 같은 노후도·교체 우선순위 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 관할지역 이름을 맞추거나 같은 안양시 공간정보시스템 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 경기도 안양시 관내 주요 도로에 설치된 도로표지판의 위치 및 사양을 체계적으로 관리하기 위해 구축된 자료입니다.각 표지판의 고유 관리번호를 중심으로 높이, 가로·세로 규격, 표준 규격, 설치일자, 관할 행정지역 등의 정보를 포함하고 있습니다. 해당 정보는 설치 시점별 데이터를 통해 노후화 여부를 파악할 수 있어, 표지판 교체 우선순위 결정 및 예산 운용의 효율성을 높이는 데 이바지할 수 있습니다.해당 데이터는 안양시 공간정보시스템을 기반으로 수집·정리되었으며, 시스템의 상황에 따라 데이터 업데이트가 이루어지지 않을 수 있습니다.
