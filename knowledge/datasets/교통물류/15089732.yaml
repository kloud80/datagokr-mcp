summary_user: 한국교통안전공단이 운영하는 중소도시 버스정보시스템(TS-BIS)에 소속된 시·군별로 버스정보안내기(정류장 안내 전광판) 수량과 버스통합단말기(차량 탑재 단말기) 수량을 담은 시군 단위 집계 파일이며, 범위는 전국 시군구 단위입니다. 지자체·연구기관이 '우리 시군의 정류장 안내기와 차량 단말기 보급 수준이 다른 TS-BIS 참여 시군과 비교해 어느 정도인가'를 확인하거나, 지역 간 버스정보 제공 격차를 살피는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 광역시도명·시군명을 이름으로 맞춰 행정구역 코드표, 정류장·노선 원장, 실시간 도착정보 데이터와 이어 쓴다.
limits: 행정구역 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 시군 이름 표기를 직접 맞춰야 한다. 시군별 기기 수량 집계만 담고 있어 개별 정류장·차량 위치나 실시간 운행 정보는 이 파일로 알 수 없다.
