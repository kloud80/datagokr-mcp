summary_user: 광주광역시 서구 관내 도로굴착공사 허가를 건별로 담은 파일로, 허가번호·신청기관·공사위치·허가일·허가기간과 포장재별(고압블록·투수콘·아스콘·기타) 굴착면적, 연간·일시 점용면적을 제곱미터 단위로 담는다(약 10KB 규모의 CSV). 주민이나 분석가가 "우리 동네 도로를 어느 기관이 언제까지 파는가, 어느 구간에 굴착 허가가 몰리는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공사위치 주소 문자열이나 신청기관 이름을 맞추는 방식, 또는 같은 서구 기관 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 광주광역시 서구 관내에서 발생한 도로굴착공사에 대한 허가 정보를 항목별로 제공하는 자료로, 허가번호, 신청기관, 공사위치, 허가일 및 허가기간, 굴착면적(고압블록, 투수콘, 기타, 아스콘), 점용면적(연간·일시) 등을 포함하고 있습니다.도로굴착은 상·하수도, 통신, 전력, 도시가스 등 지하시설물 설치나 유지보수를 위해 필수적인 행위로, 해당 데이터는 도시 기반시설의 유지관리, 굴착 공사 현황 모니터링, 도로 점용률 분석에 활용될 수 있습니다. 또한 허가기관과 공사 위치 및 기간 등의 정보는 불필요한 중복 굴착을 방지하고, 시민 불편 최소화를 위한 공공 공사 조정에 중요한 근거자료가 됩니다.굴착 면적 단위가 소재별로 구분되어 제공됨에 따라 포장재별 유지관리 비용 추산이나 도시환경 영향 분석에도 활용할 수 있으며, 연도별 누적 데이터를 통해 특정 구간의 굴착 빈도나 허가 집중 지역 파악도 가능합니다. 아울러, 도로 점용 연간·일시 구분 정보는 점용료 산정 및 회계·재정 관련 분석에도 활용할 수 있습니다.
