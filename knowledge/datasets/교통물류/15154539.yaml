summary_user: 부산광역시가 설치·운영하는 스마트 버스쉘터(냉·난방, 디지털 안내, CCTV, 충전시설 등을 갖춘 정류장)를 한 곳당 한 행으로 담은 원천 목록으로, 정류소명·위치·설치년도·규격·부대시설과 x·y 좌표를 담는다(CSV 약 6KB). 시민이 "우리 동네 정류장 중 냉난방 쉘터가 있는 곳은 어디인가"를 찾거나, 분석가가 구·연도별 스마트 쉘터 보급 현황을 파악하는 데 쓴다. 전역 조인 키(정류소 ID 등)는 없으므로 정류소명이나 좌표를 기준으로 부산 BIS·TAGO 정류장 원장 및 도착정보와 이름·근접 매칭해 이어 쓴다.
description_portal: 본 데이터는 시민의 대중교통 이용 편의 증진과 기후환경 대응을 위해 지자체에서 설치·운영 중인 스마트 버스쉘터의 설치 현황 정보를 제공하는 자료이다스마트 버스쉘터는 냉·난방, 디지털 안내시설, CCTV, 충전시설 등을 갖춘 지능형 정류장으로, 스마트 교통 인프라 구축 현황 파악, 교통서비스 개선 정책 수립 및 시민 편의시설 정보 제공을 위한 기초자료로 활용될 수 있다.
