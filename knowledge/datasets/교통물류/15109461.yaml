description_portal: ‘한국철도공사_(5대 도시)철도 이용자의 전국 소비행태 대비 관광지 내 소비행태 비교’ 데이터는 한국철도공사가 운영하는 여객열차 정보를 기반으로, 강릉, 경주, 부산, 여수, 전주 등 5개 도시의 주요역에 하차한 방문객의 업종별 소비 비율 정보를 제공합니다. 이 데이터는 각 관광지 방문객의 소비행태(업종별 소비 비율)를 전국의 전체 철도 이용자 소비행태(업종별 소비 비율)와 비교할 수 있도록 구축되었습니다.이 데이터를 통해 지역 주요 관광지에서 방문객들의 소비 패턴과 업종별 소비 집중도를 지역·전국 단위로 비교 분석할 수 있습니다. 예를 들면, 강릉에 방문한 철도 고객들이 전국적으로 동일 업종에서 소비하는 것과 달리 음식, 숙박, 관광, 쇼핑 등 특정 업종에 더 집중적으로 소비가 일어나는지 확인할 수 있습니다. 또한 각 도시별로 가장 소비 비율이 높은 업종을 파악하고, 지방 관광지와 대도시 업종 간 소비 차이나 특징적인 소비 트렌드도 유추할 수 있습니다.이 데이터는 관광 활성화 정책, 지역별 업종 육성 전략, 방문객 맞춤 마케팅, 관광지별 인프라 투자 우선순위 선정, 창업 및 유통 입지 조사, 도시별·업종별 소비 특성 비교 연구, 여행상품/코스 개발, 지방시장 경제분석 등 정책 및 실무에서 폭넓게 참고자료로 활용될 수 있습니다. 각 지자체는 해당 소비 구조 분석을 통해 관광객 유치와 소비 증대 전략을 구체적으로 수립할 수 있습니다.
