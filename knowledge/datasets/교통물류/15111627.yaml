summary_user: 성남시에 설치된 울타리와 무단횡단 방지펜스를 건별로 담은 파일로, 시설마다 위도·경도 좌표와 대상시설명, 관할경찰서명, 보호구역아이디 같은 속성이 들어 있습니다. 보행안전 업무 담당자나 분석가가 '학교 주변 보호구역 안에서 방지펜스가 어디에 설치돼 있고 빠진 구간은 어디인가'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키가 없어서 좌표로 공간 결합하거나, 보호구역아이디·대상시설명·관할경찰서명을 이름 매칭해 어린이보호구역 표준데이터나 교통사고 지점 데이터와 붙여 쓴다.
limits: 범위는 성남시 한 곳뿐이라 다른 시군구와 바로 비교하기 어렵다. 실측 컬럼에서 표준 코드형 조인 키를 찾지 못했으므로, 다른 데이터와 연결하려면 좌표나 이름 매칭에 기대야 한다.
