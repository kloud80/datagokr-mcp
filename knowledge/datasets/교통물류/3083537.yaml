summary_user: 경상남도 시장·군수에게 물류창고업으로 등록한 업체를 한 행씩 담은 등록 현황 파일로, 상호명·소재지·취급품목·전화번호를 담는다. 물류 대행이나 보관 창고를 찾는 사업자가 '도내 어느 시군에 냉동·냉장 등 특정 품목을 다루는 등록 창고가 있는가'를 확인하거나, 분석가가 지역 물류 인프라 입지를 파악하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 소재지 주소를 행정구역으로 매핑하거나 상호명을 대조하는 방식으로만 이어 쓴다.
description_portal: '「물류시설의 개발 및 운영에 관한 법률」제21조의2(물류창고업의 등록),물류시설의 개발 및 운영에 관한 법률」제64조(권한의 위임), 경상남도 사무위임 규칙」제2조(권한 재위임사항)에 따라 시장 군수에게 물류창고업을 등록한 상호 현황"주요 업무"화물 보관상품을 단기 또는 장기 보관일반창고, 냉동·냉장창고 등 다양한 유형 존재입출고 관리입고 시 검수, 분류 / 출고 시 포장, 피킹(picking)재고관리재고 수량 및 위치 데이터 관리WMS(창고관리시스템)를 활용유통가공라벨링, 세트 조립, 포장 등 간단한 가공 작업물류정보 제공입출고 및 재고 상태에 대한 실시간 정보 제공- 기타유의사항: 전화번호 미제공 업체가 있음'
