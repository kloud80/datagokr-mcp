summary_user: 경기도 도로의 호선별 차로당 교통량을 연도(yr)·도로등급(고속국도·일반국도·국지도·지방도)·노선 단위로 담은 집계 자료로, 수시 조사 교통량을 해당 노선의 차로수로 나눈 값이다. 교통 분석가나 도로 정책 담당자가 "경기도에서 차로당 교통량이 가장 많은 일반국도·지방도 노선은 어디인가" 같은 질문으로 혼잡 노선과 개선 우선순위를 가리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로등급 코드(road_kind_cd)·노선 코드(route_cd)나 노선명으로 맞춰 이어 쓴다.
description_portal: '도로 호선별 교통량 자료로 도로등급별(고속국도, 일반국도, 국지도, 지방도) 호선별로 구분하여 제공합니다.각 도로 호선별로 차량 통행의 밀도를 파악할 수 있어 도로 효율성 분석 및 교통 인프라 개선을 위한 기초자료로 활용됩니다. 교통량 변화 추이 분석을 통해 도로 이용의 수요 예측이 가능하며, 도로 유형 간 비교를 통해 도로정책의 우선순위 설정 및 혼잡구간 개선 전략 수립에도 유용합니다. - 산출방법* 시군별 : 수시 평균교통량을 차로수단위 및 행정구역 단위로 집계* 차로별 : 수시 교통량의 도로등급별 호선별 교통량을 도로등급별 호선별 차로수로 나눈 값'
