summary_user: 강릉·경주·부산·여수·전주 5개 도시의 주요 관광지별로 방문자 연령대(20대·30대·40대·50대·60대 이상) 비율을 담은 집계 파일(xlsx)이다. 지역관광 담당자나 관광 사업자가 '이 관광지는 어느 연령층이 주로 찾는가', '도시별로 어떤 세대가 주 방문객인가'를 비교해 연령 타깃 마케팅이나 상품 기획에 쓴다. 공통 조인 키가 없어 다른 관광·교통 데이터와는 방문지역(도시명)이나 관광지 이름을 직접 맞춰 이어 써야 한다.
description_portal: 이 데이터는 강릉, 경주, 부산, 여수, 전주 등 5대 도시의 주요 관광지를 방문한 이들의 연령대를 세분화하여, 각 관광지별로 어느 연령대 그룹이 얼마나 방문했는지에 대한 비율 정보를 제공합니다. 이러한 자료를 통해 각 도시 및 각 관광지가 어떤 연령층에 특히 인기가 있는지, 특정 연령대의 방문자 비중이 높은 관광지와 그렇지 않은 관광지의 차이 등을 구체적으로 파악할 수 있습니다.이 데이터를 분석하면, 예를 들어 청년층, 중장년층, 노년층 등 연령대별로 선호하는 관광지가 어디인지 확인할 수 있고, 도시별로 어떤 세대가 주요 방문객으로 자리하는지 유추할 수 있습니다. 또한 각 도시별로 다양한 세대의 방문 분포를 비교함으로써 연령별 도시 관광 트렌드, 세대별 여행 선호지 변화, 타깃 마케팅 전략 수립에 필요한 인사이트를 도출할 수 있습니다.따라서 이 데이터는 지역관광 정책 수립, 관광지별 연령 타깃 마케팅, 관광상품 및 서비스 개발, 도시별 관광 수요 분석, 연령 맞춤형 관광 인프라 구축 등 여러 방면에서 중요한 참고자료로 활용될 수 있습니다.
