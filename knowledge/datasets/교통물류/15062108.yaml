description_portal: 승용차요일제 위반정보는 승용차요일제 가입자 중 차량에 부착되어 있는 RFID 테그를 인식하여 운휴일에 운행한 위반차량의 횟수별정보(위반 차량 댓수)로 구성된 데이터입니다.데이터는 시행 시작년도인 2012년 부터 현재까지 1년 단위  및 위반 횟수별로 작성된 데이터 입니다.코로나19 유행으로 인해 승용차요일제 단속을 2020년 2월 부터 2022년 6월까지 한시적 해제하였으며 2022년 7월부터 재개하여 단속한 데이터 입니다.   위반횟수가 5회 이상 되면 자동으로 승용차요일제 가입에서 탈퇴 처리되며 가입에 따른 혜택이 소멸됩니다.
