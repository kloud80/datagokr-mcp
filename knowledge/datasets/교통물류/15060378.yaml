summary_user: 천안시 전역에 설치된 가로등을 한 개씩 기록한 건별 원천 데이터로, 위치(위도·경도·소재지주소)와 설치형태, 관리기관·관리부서, 데이터기준일자를 담는다. 시민이나 분석가가 "우리 동네 어느 길에 가로등이 부족한가", "야간 보행이 어두운 구간은 어디인가"를 지도에서 확인하거나 도로조명 유지보수 담당 부서를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 좌표·주소를 이용한 공간 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 충청남도 천안시 가로등 현황 데이터는 시 전역에 설치된 가로등의 위치와 관리 상태를 체계적으로 파악하기 위해 구축된 공공 인프라 관리 자료입니다. 관리기관과 관리부서 항목은 각 가로등의 유지 관리 담당을 명시하였고, 위도, 경도 및 소재지 주소 정보는 가로등의 정확한 위치를 지도기반으로 파악 가능하게 합니다. 그 외에도 구조 및 유형, 데이터 기준일자 등을 확인하실 수 있습니다. 본 데이터는 야간 보행 안전 확보, 도시 경관 개선, 방범 환경 조성, 도로조명 유지보수 계획 수립 등 다양한 행정업무와 도시 관리에 활용될 수 있습니다.
