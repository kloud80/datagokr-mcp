summary_user: 부산교통공사가 운영하는 부산 지하철 1~4호선의 역별 구조 정보를 층 단위로 담은 파일로, 운영기관명·노선명·역명·지상/지하 구분·역층·층 구분·면적을 담는다. 역이 지상역인지 지하역인지, 몇 층 구조이고 층별 면적이 얼마인지 확인하려는 교통 분석가나 시설·접근성 검토자가 쓴다. 전역 조인 키가 없어 다른 역 데이터와는 역명·노선명 이름 매칭이나 같은 기관(국가철도공단) 역 데이터의 코드 매핑으로만 이어 쓴다.
limits: 역 코드나 좌표 같은 공통 키가 없어 승하차·출입구 등 다른 데이터와 붙이려면 역명 표기를 직접 맞춰야 한다. 포털 설명의 지상역 예시(서울·수도권 역 등)는 일반 설명일 뿐이고 실제 범위는 부산 지하철 1~4호선 역 구조이며, 위치 정보가 없는 비공간 데이터다.
