summary_user: 광주 남구 관내 가로등을 분전함 관리번호 단위로 도로명주소·지번주소·위도·경도와 함께 담은 개별 시설 목록 파일(CSV, 약 30KB)이다. 주민이나 분석가가 "우리 동네 어느 골목에 가로등 분전함이 있는가", "야간 조명이 부족한 구역은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 주소나 좌표를 기준으로 다른 시설·안전 데이터와 공간적으로 맞춰 쓰거나 같은 기관의 데이터와만 연결한다.
description_portal: 광주광역시 남구 관내 가로등 설치 현황 및 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 도시계획과(☎062-607-3831)에서 제공하며,  미수집된 위도, 경도는 미기재하였으니 데이터 조회 시, 참고하여주시기 바랍니다. 또한 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 가로등 데이터는 도로와 보행자의 안전을 위해 설치된 공공 조명의 위치, 수량, 설치 연도, 교체 이력 등을 파악하는 데 활용됩니다. 시민들은 고장 신고와 안전 민원 제기에 참고할 수 있고, 지자체는 노후 가로등의 교체, LED 전환, 스마트 조명 도입 등을 통해 에너지 절감과 안전성 향상을 추진할 수 있습니다. 또한 도시 야간 경관 조성, 범죄 예방, 교통사고 감소를 위한 정책 수립에도 중요한 자료로 쓰입니다.
