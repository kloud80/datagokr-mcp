description_portal: 2024년 1월 1일 ~ 2024년 12월 31일까지 인천교통공사 철도사고 등 현황으로 사고구분, 사고종류, 1월 ~12월의 월별 사고건수 항목으로 구성됨.사고구분과 사고종류에 따른 유형으로 열차사고(열차충돌, 열차탈선, 열차화재, 기타열차사고), 건널목사고, 철도안전사상(여객, 공중, 직원), 철도화재사고, 철도안전사상사고(여객, 공중, 직원), 철도시설파손사고, 기타철도안전사고, 철도준사고, 운행장애, 인명피해(사망, 중상, 경상), 재산피해가 있음.기타 정보로는 선로연장, 열차운행거리(여객, 화물, 기타), 수송여객, 수송화물 데이터가 있음.
