summary_user: 인천교통공사가 운영하는 철도의 2024년 1~12월 철도사고 등 발생 건수를 사고구분·사고종류별로 월별 집계한 표(약 1.4KB CSV)이며, 열차사고·건널목사고·철도안전사상사고·준사고·운행장애·인명피해·재산피해와 선로연장·열차운행거리·수송여객·수송화물 같은 운영 지표를 함께 담는다. 철도 안전 분석가나 시민이 '인천 도시철도에서 지난해 운행장애나 사상사고가 어느 달에 몇 건 났는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 철도 운영기관 사고현황과는 사고구분·사고종류 이름을 맞추거나 기관 단위로만 나란히 비교한다.
limits: 월별 건수 집계라서 개별 사고의 일시·장소·원인은 알 수 없다. 표준 코드나 조인 키가 없어 다른 데이터와 자동으로 결합하기 어렵다.
