summary_user: 서울특별시 도로관리시스템의 도로노선을 노선 단위로 담은 목록으로, 노선명과 도로종류·도로기능·도로규모(류·급) 같은 분류명을 함께 담는다. 도시계획·교통 분석가가 '서울의 특정 도로가 간선도로인지 보조·생활도로인지, 규모 등급은 어떤지'를 확인하거나 기능별 도로 구성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명(ROD_NAM) 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 해당 데이터는 서울특별시 도로관리시스템에서 제공하는 도로노선 정보입니다. 도로노선 노선명, 도로종류, 도로기능, 도로규모, 도로폭 등의 정보를 제공합니다. 이를 통해 서울시 도로망의 구조와 역할을 종합적으로 파악할 수 있으며, 주요 간선도로와 보조도로, 생활도로 간의 기능적 차이를 비교·분석하는 데 활용할 수 있습니다. 또한 교통 정책 수립, 도로 유지관리 계획, 도시계획 및 교통량 분석 등 다양한 행정·연구 목적에 기초 자료로 활용 가치가 높은 데이터입니다.※(법령)도시·군계획시설의 결정·구조 및 설치기준에 관한 규칙 제9조(도로의 구분)에 의거 구분※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
