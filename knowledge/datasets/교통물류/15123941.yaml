summary_user: 경기도 버스운송관리시스템(BMS)에서 모은 노선별 운영·배차 이력을 이력 한 건 단위로 담으며, 각 행은 이력ID(hist_id)·노선ID·운수업체ID로 이루어진다. 특정 노선을 어느 운수사가 맡아 왔는지, 노선 신설·변경·폐지가 언제 있었는지 추적하려는 교통정책 분석가나 연구자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 경기도 버스 노선·운수업체 데이터와는 노선ID·업체ID를 맞춰 보는 같은 기관 코드 매핑으로만 잇는다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 수집된 노선별 차량 운영 및 배차 이력 정보로, 각 노선의 ‘노선ID’, 이를 운영하는 ‘업체ID’, 해당 배차의 고유 ‘이력ID’로 구성되어 있습니다. 본 데이터는 특정 노선이 어느 업체에 의해 언제부터 언제까지 운행되었는지를 이력형태로 기록한 것으로, 버스운행 실태 분석, 업체별 서비스 관리, 교통정책 수립, 노선의 신설·변경·폐지 추적 등에 활용됩니다. 각 ‘노선ID’는 경기도 버스노선을 식별하는 고유번호이며, ‘업체ID’는 해당 노선을 운영하는 운수사의 고유 식별번호와 일치합니다. 이력ID는 배차나 시스템 변경 시 생성되는 고유값으로 시간 기반 데이터 분석 시 중요한 역할을 합니다.
