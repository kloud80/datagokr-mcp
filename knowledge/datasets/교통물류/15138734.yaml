summary_user: 대구 도시철도 3호선 하선(칠곡경대병원역→용지역) 열차 시각표를 요일 구분(평일·토요일·공휴일)과 역명별 행으로, 열차번호(3001, 3003 등 홀수 번호)를 열 이름으로 둔 표 형태의 CSV 파일(약 238KB)입니다. 3호선 이용자가 특정 역에서 평일 아침 용지역 방향 열차가 몇 시에 오는지 확인하거나, 분석가가 요일별 하선 운행 간격과 첫차·막차 시각을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 역명 텍스트를 매칭해 3호선 상선 시각표나 같은 기관의 역별 승하차 데이터와 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 3호선 하선(칠곡경대병원역 → 용지역) 열차 운행 시각표 정보를 제공합니다. 데이터에는 열차번호별 출발역 및 도착역, 각 정차역의 도착 시각, 평일·토요일·공휴일별 운행 시간표 등의 항목이 포함되어 있으며, 이용자가 열차 운행 계획과 역별 도착 시간을 확인할 수 있는 자료입니다. 해당 데이터는 도시철도 이용자의 이동 계획 수립, 열차 운행 정보 확인, 역사별 운행 현황 파악 및 교통 서비스 개선 검토를 위한 기초자료로 활용할 수 있습니다. 또한 요일별 운행 정보를 제공하여 이용 패턴에 따른 대중교통 이용 편의 향상에 활용할 수 있습니다. 본 데이터는 운행 시각표 변경 등 변동 사항 발생 시 갱신되며, 변경된 열차 운행 계획을 반영합니다.'
