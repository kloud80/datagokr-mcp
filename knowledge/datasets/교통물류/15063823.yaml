summary_user: 전국 국토관리사무소별로 외부 업체에 맡겨 수행한 장비 정비 내역을 정비 건·품목 단위로 담은 원천 파일로, 사무소명·고장일자·착수일자·완료일자·정비구분·정비비총계와 장비명·품목명·규격·수량·단위·금액을 포함한다. 도로 관리 예산을 분석하는 연구자나 감사 담당자가 '어느 사무소의 어떤 장비에 외주 정비비가 얼마나 들었고 고장부터 완료까지 며칠이 걸렸나'를 따지는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소명(약칭)이나 장비명을 이름으로 맞춰 연결해야 하며, 같은 기관의 자체 정비 정보 등과 사무소 단위로 나란히 비교하는 식으로 쓴다.
limits: 실측 컬럼에 표준 코드나 전역 조인 키가 없어 사무소명 약칭 등 이름 매핑에 의존해야 하고, 공간 정보가 없어 지도 위 위치 분석에는 쓰지 못한다. 포털 설명상 정비비총계의 세부 내역(인건비·부속품비 등)과 공수·공임·산출근거, 보고일자·보고번호는 빠져 있다.
