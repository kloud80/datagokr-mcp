summary_user: 광주 광산구에 등록된 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 파일로, 업체명·면허종류(지입·직영 등)·보유 차량대수·주소를 개별 주소 단위로 제공한다. 화주나 지역 물류 분석가가 "광산구 어느 동네에 차량 몇 대 규모의 허가 운송사가 있는가"를 확인하거나 소규모 지입 업체와 중대형 업체의 분포를 살필 때 쓴다. 전역 조인 키가 없어 업체명이나 주소를 기준으로 전국화물자동차운송사업자표준데이터 등 다른 허가 원장과 맞춰 이어 써야 한다.
description_portal: 광주광역시 광산구 일반화물자동차운송사업자 업체 현황 대한 자료로 업체명, 면허종류, 차량대수, 주소 등의 정보를 제공합니다.광주광역시 광산구에는 총 493개의 일반화물자동차운송사업자가 등록되어 있으며,이들 업체는  ‘지입’, ‘직영’ 등 다양한 면허 종류로 활동 중입니다. 사업자들은 보통 1대에서 수십 대에 이르는 차량을 보유합니다.지입차 중심의 소규모 업체는 통상 1~5대 정도의 차량을 운영하는 반면, 중대형 업체는 10대 이상의 차량을 운행합니다. 주소는 장덕동, 도천동, 임방울대로 인근 등 광산구 전역에 분포되어 있으며, 도로 접근성과 물류 인프라를 고려해 주요 도로변과 산업단지 인근에 집중적으로 위치해 있습니다.
