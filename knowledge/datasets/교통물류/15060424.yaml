summary_user: 서울교통공사가 운영하는 9호선 2·3단계 구간(언주~중앙보훈병원)의 역별·일별 승하차 인원을 승차/하차 구분과 함께 00시부터 24시까지 1시간 단위로 담은 집계 파일입니다. 상권 분석가나 창업 예정자가 '이 역 주변에 출퇴근 시간대와 주말에 사람이 얼마나 오가는가'를 확인할 때 유동인구의 대체 지표로 쓴다. 전역 조인 키는 없으므로 역사명이나 역번호를 다른 호선 승하차 데이터, 역 위치 데이터와 이름 기준으로 맞춰 이어 쓴다.
limits: 표준 역 코드 같은 전역 조인 키가 없어서 다른 데이터와는 역 이름 매핑이나 같은 기관 코드로만 연결된다. 9호선 1단계(개화~신논현) 구간은 이 파일에 포함되지 않고, 승객이 어디서 타서 어디서 내렸는지(출발지-도착지) 정보도 없다.
