description_portal: '서울교통공사 9호선 2~3단계(언주 ~ 중앙보훈병원) 역별 일별 시간대별 승하차인원 입니다.  해당 데이터는 연번, 날짜, 호선, 역번호, 역사명, 승하차구분,  시간대별승하차인원으로 구성되어 있습니다. 공공데이터 제공신청에 의해 2015년부터 2026년 4월까지 업데이트 합니다.* 사업장 컬럼별 상세설명연번 : 구분을 위한 번호날짜 : 승하차 승객 수 날짜호선 : 호선 구분역번호 : 역구분을 위한 번호역사명 : 승하차 승객 역 구분승하차구분 : 순승차(승차 인원)/ 순하차 (하차 인원)시간대별 승하차 인원 : 1시간 간격 승하차 승객 인원'
