limits: 전국·비공간 집계라서 지역이나 개별 노선·링크 단위의 사고 위치는 알 수 없고, 표준노드링크 같은 공간 데이터와 키로 직접 연결되지 않는다. 경찰이 조사·처리한 인적 피해 사고만 집계한 연간 통계다. 사망 기준(30일 이내, 1999년까지는 72시간 이내)이 달라 연도 간 비교에 주의한다.
