summary_user: 인천국제공항에 취항하는 항공사별로 항공사명, 대표·공항 연락처, IATA·ICAO 코드, 로고 이미지 URL을 담은 현황 목록이며, 조회 당일 기준으로 제공한다. 여행객이나 서비스 개발자가 '이 항공편을 운항하는 항공사의 인천공항 카운터 연락처와 로고는 무엇인가'를 확인하거나, 항공편 코드를 항공사명으로 풀어 표시할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않았으나, IATA 코드(airlineIata)·ICAO 코드를 매개로 같은 기관의 운항정보·출도착 데이터의 항공사 코드와 이름·코드 매핑으로 연결한다.
description_portal: 인천국제공항공사에서 제공하는 취항 항공사 현황에 대한 데이터입니다. 항공사 코드를 기준으로 항공사 이름, 대표연락처,공항연락처,항공사코드(IATA),(ICAO)등의 현황 정보에 대한 데이터와 항공사 로고 이미지 다운로드 URL을 항목으로 제공합니다. 조회 당일을  기준으로 데이터를 조회할 수 있습니다. 개발계정 일 1000 트래픽, 운영계정 신청 시 일 1000000 트래픽을 제공합니다. 데이터 포맷은 JSON과 XML을 모두 제공합니다. 개발 계정과 운영 계정 모두 자동승인됩니다.
