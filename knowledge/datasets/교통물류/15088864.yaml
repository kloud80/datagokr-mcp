summary_user: 코레일이 운영하는 전국 전철에서 특정 연도 상반기 기준 장애인이 차지한 이용 비율을 담은 전국 단위 집계 통계로, 파일은 구분과 이용률 두 항목뿐인 52바이트 크기의 1회성 자료입니다. 교통약자 정책 담당자나 연구자가 '코레일 전철 이용객 중 장애인 비중은 어느 정도인가'를 확인하는 참고값으로 쓴다. 실측 컬럼에 역·노선·지역 코드 같은 공통 조인 키가 없어 다른 대중교통 이용 통계와는 기간·기관명을 기준으로 수작업 비교만 가능하다.
description_portal: 한국철도공사의 ‘장애인 전철 이용률’ 데이터는 코레일이 운영하는 전철을 대상으로, 상반기 기준 장애인이 전철을 얼마나 이용했는지의 비율 정보를 제공하는 공식 통계자료입니다. 본 데이터는 수도권을 포함해 전국 철도 전철망에서 파악된 장애인 이용률을 기준으로 하며, 1회성으로 수집돼 더 이상 갱신되지 않는 점이 특징입니다. 자료구성은 간단하지만, 해당 연도 상반기의 장애인 이용비중을 객관적으로 확인할 수 있도록 설계되었습니다.이 데이터를 통해 장애인 등 교통약자의 철도 접근성 수준을 간략히 파악할 수 있습니다. 예를 들어, 전철 이용 전체 인원 중 장애인 비율을 확인 가능하며, 이를 다른 기간·지역의 대중교통 이용 데이터와 비교하면 장애인 이동권 보장 수준이나, 교통 정책의 효과, 접근성 개선 노력 등을 추정하는 데에 인사이트를 얻을 수 있습니다. 만약 이용률이 낮다면, 장애인 친화적 환경 부족, 이동편의시설 한계, 환승불편, 정보제공 미흡 등 구조적 장애 요인을 유추해볼 수 있습니다. 또한 정책 지원의 필요성이나 교통약자 이동권 증진방안 마련의 근거자료로 활용할 충분한 가치가 있습니다.본 자료는 교통약자 정책 수립, 철도 접근성 연구, 열차 및 역사 내 편의시설 개선 타당성 검토, 대중교통 이용 분석, 여객 서비스 개선 전략, 도시교통정책 및 복지정책 보고서 작성, 교통약자 이동지원의 사회적·학술적 논의 등 다방면에서 참고자료로 활용할 수 있습니다. 특히 정책 입안자, 연구기관, 복지기관, 교통 인프라 개선 기획담당자가 실증적 근거로 활용하기에 적합한 데이터입니다.
