summary_user: 전국 철도·지하철역에서 한 노선에서 다른 노선으로 갈아타는 과정을 단계별 행으로 담은 건별 안내 데이터로, 각 행은 환승 이동 순서(환승이동순서)에 따른 한 동작(하차, 엘리베이터·휠체어리프트 이용, 환승 통로 이동, 승차 등)이다. 교통약자 길안내 서비스 개발자가 "이 역에서 휠체어로 2호선에서 5호선으로 갈아타려면 어떤 순서로 움직여야 하나"를 안내하거나, 분석가가 역별 환승 단계 수로 동선 복잡도를 비교하는 데 쓴다. 전역 공통 조인 키는 없어서 철도운영기관코드·선명·역명을 이름 또는 같은 기관 코드로 맞춰 역 좌표·출입구 등 다른 역 시설 데이터와 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 역 데이터와 연결할 때 역명·노선명 표기 매핑이 필요하다. 좌표가 없는 비공간 데이터라 지도 위치나 거리 계산에는 바로 쓸 수 없다.
