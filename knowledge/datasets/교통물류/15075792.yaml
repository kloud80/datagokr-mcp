description_portal: '제주특별자치도에서 제공하는 어린이보호구역 내 방호울타리 관련 데이터를 제공합니다.항목: 도로명, 보차분리여부, 위도, 경도 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 방호울타리: 자동차가 구조물과 직접적으로 충돌하는 것을 방지해 운전자와 자동차, 보행자 또는 도로변 주요 시설을 안전하게 보호하기 위해 설치하는 시설'
