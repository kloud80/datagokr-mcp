summary_user: 한국교통안전공단이 전국을 대상으로 조사한 버스·지하철 이용자의 만족도를 주이용교통수단·이용횟수·통행목적별(구분1·구분2)로 나눠 7점 만점 점수로 담은 집계 파일(CSV, 약 2.5KB)이다. 정책 담당자나 분석가가 "버스를 주로 타는 통근자는 배차간격·차내 혼잡도·환승요금에 얼마나 만족하는가"처럼 이용 유형별로 어떤 서비스 항목의 점수가 낮은지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교통수단명·구분명 같은 이름 매핑으로만 맞대어 볼 수 있다.
description_portal: 한국교통안전공단에서 전국을 대상으로 대중교통 수단(버스, 지하철)에 따른 이용실태별 만족도를 조사한 자료입니다.해당 데이터는 운영서비스(노선체계 적절성, 배차간격 적절성 등), 이용환경서비스(기사-역무원 친절도, 내부시설이용 편리성 등), 쾌적환경서비스(차량내부혼잡도, 차량 및 시설 쾌적성 등), 안전환경서비스((버스) 출발전 안전 확인 등), 정보제공서비스(대중교통정보제공시스템 구축 등), 접근서비스(접근거리 및 시간 등), 환승서비스(환승거리 및 시간 등)별 등으로 만족도 점수를 제공하고 있습니다.이용실태별을 주이용교통수단, 이용횟수, 통행목적에 따라 세분화하여 자료를 제공하고 있습니다.단위는 점으로, 7점 만점입니다.
