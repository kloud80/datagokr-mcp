summary_user: 국가철도공단 철도건설사업의 관보고시별로 편입되는 개별 토지·구분지상권(터널 등 지하 사용)을 필지 단위로 담은 건별 원천 파일로, 지역본부·관보고시번호·편입지번·편입면적·당초지번·당초면적 등을 전국 범위로 수록한다(CSV 약 38MB). 토지 소유자나 부동산 분석가가 '내 땅(특정 지번)이 어느 철도사업 고시에 편입됐고 면적이 얼마인가'를 확인하거나 철도 건설 예정지의 보상·토지이용 영향을 검토하는 데 쓴다. 전역 조인 키는 없어 편입지번(본번·부번)과 산여부를 소재지와 함께 맞춰 토지대장·지적 데이터와 이름 매칭으로 잇거나, 관보고시번호로 같은 기관의 고시·사업 정보와 연결한다.
description_portal: 국가철도공단에서 시행하는 철도건설사업에 대한 관보고시 세부 항목을 담은 데이터로, 철도사업 추진 과정에서 편입되는 개별 토지 및 지상권 현황을 명시한 행정 자료입니다. 주요 항목은 사업관할 본부, 고시명, 고시번호, 소재지(편입 대상의 행정구역), 편입면적(㎡ 단위로 표시된 대상 구간의 규모)이며, 각 편입 대상은 구분코드를 통해 구체화됩니다. 구분코드는 ‘토지’와 ‘구분지상권’으로 나뉘며, ‘토지’는 철도 건설로 인해 직접 편입되는 지상의 토지를 의미하고, ‘구분지상권’은 편입 구간이 터널 또는 지하공간인 경우로서 토지 소유권은 유지되나 지하 사용에 따라 지상권 설정 및 사용료가 부과되는 대상을 의미합니다. 본 데이터는 철도사업의 토지 이용계획 수립, 보상 절차 이행, 행정 고시 이력 확인 등에 활용되며, 이해관계자의 권리 보호, 도시계획 연계 검토, 철도 개발 타당성 분석 등에 필요한 핵심 공공데이터입니다.
