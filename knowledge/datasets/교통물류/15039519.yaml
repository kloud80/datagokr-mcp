summary_user: 인천 서구(서해구)의 이륜자동차 등록 대수를 배기량 구분별로 관용·자가용과 합계(대)로 나눠 담은 집계 표이며, 파일 크기가 188바이트에 불과한 소규모 시군구 단위 자료입니다. 구청 교통 담당자나 분석가가 '서구에 등록된 이륜차는 배기량대별로 몇 대이고, 관용과 자가용 비중은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체의 이륜차 등록현황과는 배기량 구분 이름과 기준일자를 맞춰 붙여야 한다.
