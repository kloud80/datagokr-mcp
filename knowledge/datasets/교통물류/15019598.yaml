summary_user: 광진구 관내 도로의 노선·구간별로 평균조도(LX)와 차도등·보행등·지하차도등·지하보도등 개수를 담은 가로등 현황 파일로, 주소 단위로 정리된 소규모 csv(약 4.8KB)입니다. 구청 시설 담당자나 분석가가 '어느 노선·구간이 평균조도가 낮고 보행등이 부족한가'를 따져 야간 보행 안전 개선 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·주소 같은 이름 매칭이나 같은 기관(광진구) 단위로만 연결한다.
description_portal: 서울특별시 광진구_가로등정보 데이터는 광진구 관내에 설치된 가로등의 현황을 제공하며, 도시 조명 인프라 관리 및 보행 안전 확보를 위한 기초 자료로 활용됩니다. 주요 항목에는 평균조도, 차도등 개수, 보행등 개수, 지하차도등 개수 등이 포함되어 있습니다. 평균조도 항목은 도로와 보행 공간의 밝기 수준을 수치화하여 야간 가시성 및 안전성을 평가하는 지표로 사용됩니다. 차도등은 차량 도로를 비추는 조명 수량을 나타내며, 보행등은 인도와 보행로의 안전을 위한 조명의 수를 보여줍니다. 지하차도등 개수는 지하도로 및 통로의 조명 설치 현황을 파악할 수 있도록 제공합니다. 본 데이터는 도시 조명 관리, 에너지 효율화 계획, 야간 교통사고 예방, 보행자 안전 확보 및 공공 인프라 개선을 위한 중요한 자료로 활용되며, 정기적인 유지보수 및 도시계획 수립에도 유용합니다.
