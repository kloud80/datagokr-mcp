summary_user: 대전교통공사가 관리하는 도시철도역의 에스컬레이터를 한 대씩 담은 시설 목록으로, 운영기관·노선·역명·상하행 구분·출입구번호·상세위치·시작층과 종료층을 기록한다(CSV 파일 약 13.8KB). 교통약자나 이동 경로를 안내하는 서비스 개발자가 '이 역의 몇 번 출입구에 에스컬레이터가 있고 몇 층에서 몇 층까지 연결되는가'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 역·출입구 데이터와는 역명·선명 같은 이름을 매핑하거나 같은 기관 자료끼리만 연결한다.
limits: 코드형 공통 키가 없어 다른 철도역 데이터와 붙이려면 역명 표기를 직접 맞춰야 한다. 범위가 전국으로 표시돼 있으나 내용은 대전교통공사 관할 역에 한정되고 좌표 같은 공간 정보도 없다.
