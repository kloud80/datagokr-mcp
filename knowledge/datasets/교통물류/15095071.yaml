summary_user: 인천국제공항공사가 제공하는 국가별 항공 통계로, 월 단위로 지역구분·국가명과 도착편수·출발편수·합계편수를 담은 집계 데이터이며 정기/부정기, 여객기/화물기, 국제선/국내선 조건으로 나눠 조회한다. 분석가가 "특정 국가와 오가는 항공편이 월별로 얼마나 늘거나 줄었나"처럼 국가별 관광·출장 수요나 수출입 물류 흐름의 신호를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명(country) 같은 이름 매핑이나 같은 기관의 다른 항공 통계와의 대조로만 이어 쓴다.
description_portal: 인천국제공항공사에서 제공하는 국가별 항공/여객/화물/통계에 대한 데이터입니다. 정기/부정기,화물기/여객기,국제선/국내선등의 조건으로 데이터를 구분하여 국가별 항공/여객/화물 통계 정보를 지역구분,국가명,도착편수,출발편수,합계편수에 대한 데이터를 제공합니다. 해당 데이터는 월별 데이터를 제공합니다. 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 1000000 트래픽을 제공합니다. 데이터 포맷은 JSON 과 XML을 모두 제공합니다. 개발 계정과 운영 계정 모두 자동 승인됩니다.
