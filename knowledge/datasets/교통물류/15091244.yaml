summary_user: 인천광역시 서구(서해구)에 불법주정차 단속용으로 설치된 CCTV를 대당 한 행씩, 주소와 용도 중심으로 담은 개별 시설 목록(csv 약 16KB)이다. 주민이나 구청 교통 담당자가 "우리 동네 어느 도로에 주정차 단속 카메라가 있는가", "단속 카메라가 특정 구역에 몰려 있지 않은가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 행정동 이름으로 맞춰 이어 써야 하며, 같은 구의 주정차 단속 실적이나 불법주정차 민원 데이터와 위치 기준으로 겹쳐 본다.
description_portal: 본 공공데이터는 인천광역시 서구 내 불법주정차 단속을 위해 설치된 CCTV의 현황을 수록한 자료입니다. 본 자료는 주소, 용도 등 기본적인 항목으로 구성이 되어 있습니다. 본 데이터를 통해 각 구역별 단속용 카메라의 배치를 확인 할 수 있어, 이를 통해 주차 질서 개선, 단속의 효율적 운영을 위한 기초자료로 활용이 될 수 있을것으로 판단이 됩니다. 또한 도시 교통정책 수립 등에도 참고할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영을 하고 있습니다.
