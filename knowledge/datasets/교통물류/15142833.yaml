description_portal: 본 데이터는 한국도로공사가 운영하는 고속도로 휴게소 및 졸음쉼터 내 장애인 및 가족사랑 화장실의 설치 여부와 위치 정보를 수록한 자료이다.  해당 화장실은 교통약자와 가족 단위 이용자의 편의 증진을 위해 설치되며, 다양한 사용자의 접근성과 안전한 휴게 환경 조성을 위한 기반 시설이다.  데이터는 설치 휴게소명, 가족사랑 화장실 운영여부, 남자 장애인 화장실 운영여부, 여자 장애인 화장실 운영여부의 항목으로 구성되어 있다.  이 정보를 통해 이용자는 편의시설 위치를 사전에 확인하여 효율적인 경로를 계획할 수 있으며, 교통약자 지원 정책 수립에도 활용 가능하다.  CSV 형식으로 제공되며, 사용자 맞춤형 공간정보 분석이 가능하다.
