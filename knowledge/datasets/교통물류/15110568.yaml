summary_user: 대구광역시 서구가 시행한 교통개선사업을 사업 한 건씩 담으며, 사업명, 차선 도색·과속방지턱·횡단보도 집중조명·전방신호기 등 공사 개요, 공사 시작·종료 일자, 집행 사업비(원)를 제공한다. 주민이나 교통안전 분석가가 '서구에서 사고 위험 교차로에 어떤 안전시설을 언제, 얼마를 들여 설치했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·공사 내용의 위치 이름을 매핑하거나 같은 기관(대구 서구) 데이터끼리만 이어 쓴다.
description_portal: '입력 파라미터를 이용하여 대구광역시 서구_교통개선사업 현황의 등록번호, 교통 개선 사업 명, 개선 내용 공사 개요, 공사 시작 일자, 공사 종료 일자, 사업비 집행 내역 항목을 제공하는 서비스이 사업은 교통사고를 예방하고 안전한 도로환경을 조성하기 위해 진행된 교통 개선 사업입니다. 주요 내용으로는 차선 도색, 차선분리대 및 과속방지턱 설치, 횡단보도 집중조명과 전방신호기 설치 등이 있으며, 사고 위험이 높은 교차로와 도로를 중심으로 시행되었습니다.[데이터 상세설명]교통 개선 사업 명: 진행한 사업의 이름 (교통안전 관련 공사의 구체적 명칭)개선 내용/공사 개요: 사업의 구체적인 공사 내용과 설치 항목 (차선 도색, 신호기, 조명 등)공사 시작 일자: 공사 착공일공사 종료 일자: 공사 완료일 또는 계획된 종료일사업비 집행 내역: 해당 공사에 투입된 예산 총액 (단위: 원)'
