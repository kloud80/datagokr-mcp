summary_user: 한국공항공사가 운영하는 공항의 국제선 환승(T/S) 실적을 연도·공항·항공사별로 집계한 파일로, 유임·무임 여객, 환승 T/S, 통과(직항) T/S, 환승비율을 담으며 파일 크기는 약 2.8KB로 작다. 공항 운영·항공 분석가가 '어느 지방공항에서 어떤 항공사의 국제선 환승 여객 비중이 높은가'를 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 항공통계와는 연도·공항명·항공사명을 이름으로 맞춰 연결해야 한다.
limits: 표준 공항코드나 항공사코드 같은 조인 키가 없어 다른 데이터와 이으려면 이름 매핑이 필요하다. 행정구역 단위가 아닌 전국·비공간 통계라 지역별 공간 분석에는 바로 쓰기 어렵다.
