summary_user: 관세청 수출입 신고 운임정보를 화물정보와 연계해 산출한 40피트 일반화물 컨테이너(FCL) 1개당 평균 해상 수출입 운송비용을 국가별·기간별로 담은 집계 데이터이다. 수출은 CIF·CFR, 수입은 FOB 거래조건 신고 건 기준이다. 화주나 물류 분석가가 '특정 국가와 거래할 때 컨테이너 한 개 해상운임이 기간에 따라 얼마나 변했나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 국가코드(statCd)와 국가명으로 다른 국가별 무역·물동량 통계와 이름·코드 매핑으로 이어 쓴다.
limits: 전국 단위의 비공간 집계라 항만별·화물 건별 운임은 알 수 없다. 실측 컬럼에 전역 조인 키가 없어 국가코드·국가명 매핑으로만 다른 데이터와 연결된다. 개발계정은 일 10,000회 호출 제한이 있다.
