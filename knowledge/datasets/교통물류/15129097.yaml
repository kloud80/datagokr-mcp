description_portal: 기업이 세관에 수출입 신고하는 과정에서 생산된 운임정보를 화물정보와 연계하여 컨테이너당 평균 수출입 운송비용을 산출·공표하는 데이터로,거래조건은 운임을 포함하는 대표적 정형거래조건(국제상업회의소 제정)인 CIF(Cost, Insurance and Freight)와 CFR(Cost and Frieght)을 거래조건으로 하는 수출신고 건과 운임을 포함하지 않는 대표적 정형거래조건(국제상업회의소 제정)인 FOB(Free On Board)를 거래조건으로 하는 수입신고 건이다.단일 화주의 물품만 적재되는 FCL(Full Container Load) 형태만 선별, 40피트(2TEU) 일반화물 운송용(GP, Genaral Purpose) 컨테이너 조건이다.
