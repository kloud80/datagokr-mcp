summary_user: 청주시 시내버스가 정차하는 승강장(정류소)별로 정류소명, 서비스ID, WGS84 경위도 좌표(X, Y)를 한 줄씩 담은 정류장 원장 파일로, 포털 설명상 2025년 4월 기준이며 대전·세종·증평·진천 등 청주시 밖 정차 승강장도 포함한다. 시민이나 분석가가 "우리 동네에서 가장 가까운 시내버스 정류장은 어디인가", "정류장이 부족한 지역은 어디인가" 같은 질문에 지도 위 위치를 찍어 보는 데 쓴다. 전역 조인 키는 없어서 같은 청주시 BIS의 노선·도착 데이터와는 서비스ID나 정류소명 매칭으로 잇고, 다른 공간 데이터와는 좌표로 공간 결합한다.
limits: 실측 컬럼에 전국 공통 정류소 코드 같은 조인 키가 없어, 국가 대중교통 정보나 타 지자체 데이터와는 이름·좌표 매칭으로만 연결된다. 정류장 위치 원장일 뿐 노선 경유·실시간 도착·승하차 인원은 담지 않는다.
