description_portal: 2014년 부터 2025년 까지 부산광역시 도로에 발생한 포트홀 정비 현황을 월별로 정리한 자료입니다.(지방도를 제외한 구군, 건설안전시험사업소, 부산시설공단 관리 구간 자료) 포트홀(Pothole)은 도로에 생긴 움푹 파인 구멍으로, 차량 사고나 보행자 낙상 위험을 유발할 수 있습니다. 따라서 위 데이터는 도로 안전 및 시민 생명과 관련되어 있으며 이를 잘 활용하면 어느 시기에 포트홀 정비가 많이 필요한 지 파악할 수 있습니다. 이를 통해 도로 유지보수 예산의 효율적 집행이 가능해지고 포트홀 정비 데이터를 교통량, 날씨, 사고 데이터와 융합하면 예측 모델링 및 스마트 도로 관리 시스템 구축에도 활용이 가능합니다.
