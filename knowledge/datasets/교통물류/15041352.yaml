summary_user: 부산교통공사가 관리하는 도시철도역의 에스컬레이터를 한 대씩 담은 시설 목록 파일로, 노선·역명·상하행 구분·출입구 번호·상세 위치·시작층과 종료층을 기록한다(CSV 약 54KB). 휠체어나 유모차 이용자, 교통약자 이동 동선을 설계하는 분석가가 '이 역 몇 번 출입구에 대합실까지 올라가는 에스컬레이터가 있는가'를 확인할 때 쓴다. 전역 공통 조인 키가 없어서, 다른 역·출입구 데이터나 엘리베이터 데이터와는 운영기관명·선명·역명을 이름 그대로 맞추거나 같은 기관 코드로만 이어 쓴다.
