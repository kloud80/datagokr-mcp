summary_user: 서울시 자치구 단위 보행 네트워크를 노드(지점)와 링크(연결 구간) 건별로 담은 공간정보로, 각 링크에 좌표 형상·길이·시군구·읍면동 행정구역과 함께 고가도로·지하철·교량·터널·육교·횡단보도·공원녹지·건물 내 통로 여부를 표시한다. 교통계획 담당자나 분석가가 "우리 구에서 지하철역까지 횡단보도·육교를 거쳐 걸어가는 실제 보행 동선은 얼마나 긴가"처럼 보행 접근성과 연결성을 따지는 데 쓴다. 전역 조인 키는 없어서 시군구·읍면동 코드나 이름(SGG_CD, EMD_CD)으로 행정구역 단위 통계와 맞추고, 링크 시작·끝 노드 ID로 내부 네트워크를 구성하며, 국토부 표준노드링크와 같은 공용 ID 체계로 바로 이어진다는 근거는 없다.
description_portal: 서울시 자치구별 도보 네트워크 공간정보 데이터는 자치구 단위에서 사람의 이동을 중심으로 한 보행 네트워크 구조를 상세히 파악할 수 있도록 구성된 자료입니다. 이 데이터는 각 지점과 지점을 연결하는 노드와 링크 정보를 기반으로 도보 이동 경로를 공간적으로 표현하고, 링크 길이 및 시군구·읍면동 행정구역 정보를 함께 제공하여 지역별 보행 환경의 특성과 연결성을 분석할 수 있도록 합니다. 또한 고가도로, 지하철 네트워크, 교량, 터널, 육교, 횡단보도, 공원·녹지, 건물 내 통로 등 다양한 보행 관련 요소를 포함하고 있어, 실제 보행 동선과 접근성을 세밀하게 파악하는 데 유용합니다. 이를 통해 보행자 중심의 교통계획 수립, 보행 약자 이동권 개선, 공원·녹지 및 대중교통과의 연계성 강화 등 도시 보행 환경 개선 정책을 설계하는 기초 자료로 활용할 수 있습니다.
