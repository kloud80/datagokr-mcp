summary_user: 광주 도시철도 역사별로 출구 주변의 시장·명소, 공공기관, 의료기관 같은 주변시설을 안내하는 음성 파일 주소와 안내 텍스트를 출구 번호 단위로 담은 파일(CSV 약 818KB)이다. 외국인 관광객이나 교통약자를 위한 안내 앱을 만드는 개발자가 특정 역 몇 번 출구 근처에 어떤 기관·명소가 있는지를 다국어 음성으로 안내하는 데 쓴다. 역사코드(gwangju_metro_station_no)와 호선정보(urban_rail_line_no)를 키로 역 좌표·출입구 등 철도역 마스터 데이터와 이어 쓴다.
description_portal: 이 데이터는 광주광역시 도시철도공사 역사별 안내음성 정보를 체계적으로 정리한 자료로, 각 지하철 역사 출구 주변의 주요 시설·기관·명소 등에 대한 음성 안내 데이터를 담고 있습니다. 주요 필드에는 주변정보 종류(시장·명소, 공공기관, 의료기관 등), 음성 안내 파일 URL, 역사 코드 및 명칭, 출구 번호, 호선 정보, 음성 파일 번호, 음성 안내 텍스트, 연번, 주변정보 고유번호가 포함되어 있습니다.이 자료를 활용하면 역사별 출구 주변 환경과 편의시설 정보를 손쉽게 파악할 수 있으며, 음성 안내 콘텐츠를 통해 다국어 안내 서비스, 관광객 편의 제공, 교통 약자 지원 등의 목적에 활용할 수 있습니다. 특히 안내문이 한국어뿐 아니라 일본어·중국어·영어 등으로 구성되어 있어, 외국인 이용객 맞춤형 안내 시스템 개발과 관광 인프라 강화에도 중요한 기초 자료가 됩니다.
