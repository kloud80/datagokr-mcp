summary_user: 지역(시도)별로 인허가된 시내버스 총대수 대비 저상버스 보급대수(대)와 보급률(%)을 담은 집계 파일로, 2021년 기준 값이 들어 있으며 전국을 다룬다. 교통약자 이동편의 정책 담당자나 분석가가 '우리 지역 시내버스 중 저상버스 비율이 전국 다른 지역보다 낮은가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 통계와는 지역명(구분)을 이름으로 맞춰 이어 써야 한다.
description_portal: 대중교통 가운데 가장 쉽게 이용할 수 있는 수단인 버스에 대해, 교통약자가 편리하고 안전하게 이용할 수 있는 구조로써 낮은 차체 바닥 높이로 수평 승하차가 가능한 저상버스(또는 휠체어 탑승 설비를 장착한 버스 등)를 도입하고 있으며, "교통약자법" 제13조제7항에 따라 노선버스를 대폐차 시에는 저상버스를 반드시 도입하도록 하고 있어, 매년 저상버스의 도입 현황을 파악하고 이를 관리하고자 조사된 정보를 개방하고 있습니다.본 개방 데이터는 저상버스의 운영 현황으로, 지역별 인허가된 시내버스 총대수에 대비한 저상버스 보급대수 현황입니다.지역별, 저상버스 보급대수 및 보급률단위( 대, %)
