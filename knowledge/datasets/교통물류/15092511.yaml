description_portal: '데이터 개요국토교통부_업체별 항공기 등록 현황은 국내 민간 항공사 및 공공기관이 보유·운용 중인 항공기 등록 정보를 집계한 데이터입니다. 등록 주체(소유자 또는 사용자)별로 항공기 유형(비행기, 회전익 항공기 등)에 따라 분류되며, 연도별 보유 대수 추이를 확인할 수 있어 항공산업 규모, 기재 구성, 산업 동향 파악에 활용됩니다.데이터 제공 항목소유자(사용자): 항공기를 등록한 기업 또는 기관명비행기: 고정익 항공기(예: 여객기, 화물기 등) 등록 수회전익 항공기: 헬리콥터 등 회전익 항공기 등록 수비행선: 공기부양형 항공기 등록 수활공기: 동력 없이 비행하는 활공기 등록 수계: 해당 업체의 총 등록 항공기 수출처 및 갱신 주기국토교통부 항공기 등록 관리 시스템을 기반으로 제공등록 기준은 「항공안전법」에 따라 운영되며, 실제 운용 여부와 다를 수 있음항공기 등록 연도 기준으로 연 1회 또는 수시로 갱신됨데이터 해석 시 유의사항등록정보는 실 운항 여부와 다를 수 있으며, 운항 중단 또는 예비 기재도 포함소유자 기준이 아닌 실사용자 기준으로 분류된 항공기도 존재동일 업체가 복수 유형 항공기를 보유하는 경우 계(합계) 기준 중복 확인 필요활용 안내국내 항공기 보유 현황 파악 및 항공기 운영 주체 분석공공 항공서비스(예: 산림, 경찰, 응급구조 등)와 민간 항공운송업체의 기재 운영 실태 비교신규 항공사 설립 및 기재 도입 전략 수립 시 참고자료항공기 유형별 수요 변화 분석 및 항공정책 수립에 활용 가능예시 데이터소유자(사용자)비행기회전익 항공기비행선활공기계(재)스타항공우주01001(주)더스카이0120012(주)미도지리정보10001(주)스페이스10001'
