summary_user: 광주광역시(현 전남광주통합특별시)에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 정리한 등록 현황 파일로, 등록번호·상호·주사무소 주소·최초(변경)등록일을 담는다. 화주나 무역업체가 거래하려는 포워더가 광주에 정식 등록된 국제물류주선업체인지, 언제 등록됐고 주사무소가 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 등록번호를 문자열로 맞춰 붙여야 하며, 화물운송·주선사업 허가 여부는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: 본 데이터는 광주광역시 국제물류주선업의 등록 현황을 정리한 자료로, 등록번호, 상호, 주사무소, 최초(변경)등록일 항목으로 구성되어 있습니다. (유)동국상운, ㈜에이원로지스틱, (유)고고, 케스터로지스㈜, 서희물류 주식회사 등 다양한 운송·물류 관련 업체가 포함되어 있으며, 각 업체의 주사무소 주소와 등록일자를 확인하실 수 있습니다. 예시로 (유)동국상운은 광산구 사암로 216번길 일원에 위치하며 2006년 1월 등록되어 있고, ㈜에이원로지스틱은 광산구 수완로12번길 소재지로 2022년 4월 등록된 것으로 제시되어 있습니다.
