summary_user: 서산시 도시계획정보시스템 안에서 보존지구 정보를 담는 테이블의 메타데이터로, 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목을 컬럼 단위로 담은 작은 CSV 파일(약 2.5KB)이다. 실제 보존지구의 위치나 지정 내용이 아니라 테이블 구조를 담으므로, 분석가나 개발자가 서산시 보존지구 자료가 어떤 테이블·컬럼으로 관리되는지 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명 같은 이름 매핑이나 같은 기관(서산시) 기준으로만 이어 쓴다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 보존지구에 관한 메타데이터이다. 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 보존지구는 생태, 역사, 문화, 경관 등 보전이 필요한 지역을 보호하기 위해 지정되며, 개발과 이용에 제한이 따른다. 해당 데이터는 지구별 지정 목적과 규제 내용을 이해하는 데 유용하며, 도시계획 수립, 환경 정책, 문화재 관리 등에 활용된다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 도움이 되며, 공간정보 분석, 행정업무, 민간 활용 등 다양한 분야의 기초자료로 활용 가능하다.
