summary_user: 대전광역시 시내 주요 도로·교차로에 설치된 교통 관제용 CCTV를 대당 한 건씩 담은 위치 목록으로, 관리번호·관리기관·CCTV명·지번/도로명 주소·좌표를 포함한다. 교통 분석가나 내비게이션·지도 서비스 사업자가 '대전 시내 어느 교차로에 관제 CCTV가 있는가'를 확인하거나 지도에 카메라 위치를 표시할 때 쓴다. 전역 조인 키는 없어서, 좌표(crdntX·crdntY)나 주소를 기준으로 도로 링크·돌발상황 같은 대전시 실시간 소통 데이터와 공간적으로 맞춰 이어 쓴다.
limits: 다른 데이터와 바로 연결할 공통 코드가 없어 주소·좌표 매칭이나 이름 대조로만 연결된다. 범위는 대전광역시 한 곳의 개별 설치 지점에 그친다. 개발계정은 하루 10,000회까지 호출할 수 있다.
