summary_user: 출발역·도착역 기준으로 KTX를 포함한 열차 운행 시간표를 조회하고, 차량 종류·도시 코드 목록도 함께 내려주는 조회형 API이다(검증 시 전국 범위 31행 수신). 승객이 특정 구간의 열차 출발·도착 시각을 확인해 이동 일정을 짤 때 쓴다. 필수 파라미터인 출발·도착 장소 ID와 도시코드는 다른 데이터에서 먼저 받아 넘겨야 하며, 필드 중 도시코드(citycode)·차량종류코드(vehiclekndid)가 이 목록 조회와 이어지는 코드이다.
description_portal: 출발/도착지를 기준으로 열차(KTX포함)의 운행시간표정보를 조회하는 열차정보 서비스이다. 열차정보는 출/도착지 기반, 차량 종류 목록, 시도별 기차목록, 도시코드목록 조회가 가능하다. 출발지와 도착지를 기준으로 열차(KTX 포함)의 운행 시간표 정보를 조회할 수 있는 열차정보 서비스이다. 본 서비스는 이용자가 선택한 출발역과 도착역을 기반으로 해당 구간을 운행하는 열차의 시간표 정보를 제공하며, 열차의 출발 시간, 도착 예정 시간 등 기본적인 운행 현황을 확인할 수 있도록 구성되어 있다. 또한 차량 종류 목록, 시도별 기차 목록, 도시 코드 목록 조회 기능을 함께 제공하여 열차 정보 검색 및 관련 데이터 활용이 가능하다. 이를 통해 이용자는 철도 운행 정보를 종합적으로 파악하고 이동 일정 계획 수립에 참고할 수 있습니다.또한 한번에 출력되는 데이터 목록수를 설정할수 있으며, 페이지 번호를 설정하여 전체 데이터를 분할하여 호출이 가능합니다. TAGO 연계현황및 기술자료는 http://www.tago.go.kr에서 확인이 가능합니다.데이터 활용 추가 문의사항은 TAGO 운영팀(054-459-7870)으로 문의 바랍니다.
