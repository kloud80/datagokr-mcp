summary_user: 서울교통공사 관할 지하철 1~8호선 역사 안 공중화장실을 화장실 한 곳씩 담은 파일로, 노선·역명·주소·위경도·층·게이트 안팎 여부·근접 출입구와 대소변기·장애인용·어린이용 변기 수, 비상벨·CCTV·기저귀교환대 설치 여부, 개방시간을 담는다. 지하철 이용객이나 교통약자 지원 분석가가 '이 역에서 개찰구 밖 장애인 화장실이나 기저귀교환대가 있는 화장실은 몇 번 출입구 근처인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 역명·운영노선명을 역 마스터와 이름으로 맞추거나, 위도·경도로 역 좌표·출입구 데이터와 공간 결합해 쓴다.
description_portal: '지하철 1~8호선의 역사 내 공중화장실 데이터입니다.(기준일자: "26년 2월 12일)1호선에서부터 8호선까지 서울교통공사 관할 역사 내 공중화장실을 이용하는 고객 편의를 증진하기 위하여 제공되고 있는 자료이며, 해당 데이터는 화장실명, 소재지도로명주소, 소재지지번주소,  상세위치, 전화번호, 개방시간, 대소변기  수량·기저귀교환대 · 비상벨 현황 등 화장실 내  시설물 정보에 대한 자료입니다.서울교통공사 역사 공중화장실 정보는 지하철 이용고객이 쉽게 화장실을 찾고 이용하는 등 고객 만족도 증진에 기여하고자 합니다.(수시, 1회성 데이터)'
