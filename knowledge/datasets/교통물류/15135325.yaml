description_portal: 서울특별시 일자별 택시 OD 유형별 상위 10개소 데이터는 서울시 교통정책지원시스템에서 택시 단말기를 통해 수집된 운행 정보를 기반으로 구축된 교통 빅데이터입니다. 해당 자료는 특정 일자를 기준으로 택시 승·하차(OD, Origin-Destination) 이동 패턴을 분석하여 이용량이 많은 상위 10개 이동 구간 정보를 제공합니다. 데이터에는 기준 날짜, 인접승차대, 행정동, 단거리 시작 명칭, 단거리 종료 명칭, 단거리 이용수, 심야시간 이용수 등 다양한 항목이 포함되어 있습니다. 이를 통해 시간대별·지역별 택시 이용 특성과 시민 이동 흐름을 파악할 수 있습니다. 특히 심야 이동 및 단거리 이동 데이터를 활용하여 상권 활성도 분석, 교통 혼잡 지역 파악, 대중교통 보완 필요 지역 분석 등이 가능합니다. 또한 도시 교통정책 수립, 택시 운영 효율화, 스마트 모빌리티 서비스 개발, 생활권 기반 연구 등 다양한 분야에서 활용 가능한 공공데이터입니다.
