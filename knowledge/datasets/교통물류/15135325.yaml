summary_user: 서울시 교통정책지원시스템의 택시 단말기 운행 정보를 일자별로 집계해, 인접승차대·행정동 간·단거리·심야시간·외부통행 유형별로 이용량 상위 10개 승하차(OD) 구간과 이용수를 담은 집계 파일이다(범위는 시도, 행정단위는 읍면동). 분석가나 정책 담당자가 "특정 날짜에 심야 택시 이동이 가장 많은 행정동 구간은 어디인가"처럼 상권 활성도나 대중교통 보완 필요 지역을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 행정동 ID·명칭(행정동_시작_ID 등)을 이름·코드 매핑으로 행정동 단위 인구·상권 자료와 맞춰 이어 쓴다.
limits: 상위 10개 구간만 담은 집계라 전체 OD 행렬이나 건별 운행 기록은 알 수 없다. 표준 조인 키가 없어 다른 데이터와 연결하려면 행정동 이름·코드를 따로 매핑해야 한다.
