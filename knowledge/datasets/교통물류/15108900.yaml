summary_user: 의왕시 도로 구간에 설치된 가로등을 한 개씩 담은 개별 시설물 자료로, 도로구간번호·등주높이·등주재질·광원종류·광원용량·설치일자와 위도·경도를 포함한다. 시민이나 분석가가 '야간에 어둡고 가로등이 드문 보행 구간이 어디인가'를 지도에서 확인하거나 보행안전지수를 산출할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 위도·경도 좌표나 행정동읍면코드·도로구간번호 같은 기관 내부 코드로 의왕시의 다른 공간 자료(범죄·교통사고 지점, 보도 등)와 공간적으로 겹쳐 쓴다.
description_portal: 본 데이터는 의왕시 내 도로 구간에 설치된 가로등 현황을 담은 공간정보 자료입니다. 공간지리식별번호, 지형지물부호, 도로구간번호와 함께 가로등의 모형, 높이, 형식, 재질, 광원 종류, 위도 및 경도 등의 세부 정보가 포함되어 있으며, 보행안전지수 지도 시각화를 위한 중간 데이터로 활용됩니다. 가로등 정보는 보행자의 시야 확보와 범죄 예방, 교통사고 감소 등 도시 안전과 밀접한 관련이 있으며, 야간 보행자의 안전 확보 및 도시의 조명 인프라 현황 파악에 중요한 기초자료 역할을 합니다. 이 자료는 1회성으로 수집된 데이터로 이후 갱신되지 않아 최신 상태와 차이가 있을 수 있으므로, 참고용으로 활용하는 것이 적합합니다.
