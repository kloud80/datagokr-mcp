summary_user: 경기도 도로대장전산화시스템에 등록된 석축 구조물을 노선·구간별 건 단위로 담으며, 시점·종점 위치와 좌표, 방향, 연장, 재료 종류(화강암·석재 등), 최대·최소 높이, 폭, 비고(돌망태·축대 등)를 포함한다. 도로관리 담당자나 분석가가 특정 노선 구간에 어떤 석축이 얼마나 길고 높게 설치돼 있는지 파악해 경사면 안정성 점검이나 재해 예방 대상을 고르는 데 쓴다. 전역 조인 키는 없어 노선번호(route_no)·구간번호와 시종점 좌표를 이용해 같은 도로대장 시리즈의 다른 구조물 데이터나 도로망 데이터와 이름·위치 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템을 기반으로 수집된 석축 구조물에 대한 정보로, 도로 경사면 보호 및 토사유출 방지를 위해 설치된 석축의 위치, 종류, 연장, 높이, 폭 등의 물리적 특성을 포함합니다. 주요 항목으로는 '노산번호', '구간번호', '위치-시점', '위치-종점', '위치-방향', '연장', '종류', '높이-최대', '높이-최소', '폭', '비고' 등이 있으며, 석축의 재료는 '화강암', '석재', '기타' 등으로 구분되고, 일부는 '돌망태', '축대' 등 비고란을 통해 세부 형식이 제시됩니다. 본 데이터는 구조물 유지보수 계획 수립, 경사면 안정성 분석, 재해 예방을 위한 공간정보 기반 모니터링 등에 유용하게 활용될 수 있습니다.
