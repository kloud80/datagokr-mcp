summary_user: 부산 도시철도 1호선 열차의 혼잡률(%)을 날짜·시간대·역·행선지별로 1~8호차 칸마다 담은 측정 기반 집계 파일로, 포털 설명상 월 단위로 집계한다. 출퇴근 시간에 서면역에서 노포 방면 열차를 탈 때 몇 호차가 덜 붐비는지 알고 싶은 이용자나 혼잡 구간·배차 조정을 검토하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 역 이름이나 같은 기관 자료(역별 시간대별 승하차 등)와 이름 매칭으로만 이어 쓴다.
description_portal: '본 데이터는 부산교통공사 1호선 열차의 차량별 혼잡도 정보를 시간대·역별로 측정하여 월 단위로 집계한 자료입니다.혼잡도는 각 열차 내 1~8호차별 혼잡률(%)로 제공되며, 탑승 위치·노선 방향·운행 시간대에 따른 혼잡 패턴을 파악할 수 있도록 구성되어 있습니다. 해당 데이터는 시간대별 혼잡 구간 도출, 교통약자 배려 차량 위치 선정, 배차 간격 조정, 이용자 분산 유도 등 열차 운행 최적화와 관련된 정책 수립에 활용될 수 있습니다. 또한 민간 앱 서비스의 실시간 혼잡도 정보 제공, 교통 시뮬레이션 연구, 이용자 체감 품질 향상을 위한 도시철도 서비스 설계 등 다양한 분야의 기반 자료로 활용 가능한 고밀도 수송정보 데이터입니다.* 혼잡률 35% 이하 : 좌석에 앉을 수 있는 상태  혼잡률 36~50% : 빈 좌석이 없고, 통로에 승객이 서있으나 승차 후 자유롭게 이동할 수 있는 상태  혼잡률 51~70% : 통로에 승객들이 많이 서 있어서 승차 후 이동 시 주변 승객들과 몸이 부딪힘  혼잡률 71% 이상 : 통로에 승객이 빽빽하게 서 있어서 승차 후 이동이 불가능한 상태'
