summary_user: 대전 도시철도 1호선 22개 역(판암~반석)의 역간 운임을 승차권 종류(일반·청소년·어린이 등)별로 담은 표 형태 파일이며, 행마다 도착역과 영업일자가 있고 열마다 출발역별 운임 금액이 들어 있다(csv 약 72KB). 시민이 특정 두 역 사이 요금을 확인하거나, 분석가가 2011년 7월~2024년 7월 사이 적용된 거리·구간별 요금 체계를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역 이름 매핑이나 같은 기관(대전교통공사) 데이터 기준으로만 이어 쓴다.
limits: 역 코드 같은 표준 조인 키가 없어 승하차·역 시설 데이터와 연결하려면 역명을 직접 맞춰야 한다. 출발역이 열로 펼쳐진 넓은 표라 분석 전에 출발역-도착역 쌍으로 바꾸는 작업이 필요하며, 이 데이터는 분석용이 아닌 서비스용 조회 성격으로 분류된다.
