summary_user: 제주도 내 버스 정류소별로 일반·학생·장애인 등 이용자 유형에 따른 승하차 인원을 날짜(base_date) 단위로 집계한 통계로, 포털 설명상 2019년 한 해를 다룬다. 교통·복지 분석가가 "어느 정류소에서 학생이나 장애인 이용 비율이 높은가" 같은 질문에 답하거나 정류소별 수요를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 정류소 원장이나 실시간 도착 데이터와는 정류소 이름(station_name)으로 매칭해 이어 써야 한다.
description_portal: 이 데이터셋은 2019년 1월 1일부터 2019년 12월 31일까지, 제주도 내 각 버스 정류소에서 이용자 유형별로 승차 또는 하차 인원 수를 집계한 통계자료입니다. 즉, 정류소별로 일반 승객, 학생, 장애인 등 이용자 구분에 따라 해당 정류소를 이용한 인원 수가 기록되어 있어서, 노선-정류소 단위의 이용자 구성과 이용 패턴을 분석하기에 적합합니다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 무료 배포되며, 누구나 다운로드해 활용할 수 있습니다. 이 자료는 대중교통 이용자 구성 분석, 취약계층(학생, 장애인 등) 이용 비율 파악, 정류소별 수요 분석, 노선·정류소 운영 효율화, 도시 교통 정책 수립 및 복지 교통 계획 수립, 교통 접근성 평가 등에 유용합니다. 다만 조사 기간이 2019년 단일 연도에 한정되어 있어 이후 변화(노선 변경, 정류소 추가/삭제, 이용자 구성 변화 등)는 반영되어 있지 않을 수 있다는 점이 한계입니다
