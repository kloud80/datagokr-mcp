description_portal: '우리나라 시군수별로 등록된 자동차 대수, 자동차 주행거리, 교통사고 사망자 수를 비교분석한 통계입니다. 10억 km당 교통사고 발생건수에 대한  통계를 제공하고 있습니다. 비사업용 자동차와 사업용 자동차로 구분되며, 각각 승용차, 승합차, 화물차, 특수차로 세분구분하여 제공하고 있습니다. 연간주행거리(천km)와 교통사고 현황 (발생건수, 사망자, 부상자), 10억 km 주행거리 당 (발생건수, 사망자, 부상자)로 구분됩니다. 교통사고 현황은 경찰청 교통사고 통계의 가해운전자 차종별 월별 교통사고를 자료를 활용합니다. 단위 : (천km, 건, 명, 건/10km, 명/10억km)'
