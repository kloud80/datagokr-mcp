description_portal: 경기도 버스정보시스템(BIS)에서 운영하는 버스정보안내단말기(BIT)의 화면 표출 시나리오 운영 현황 데이터입니다. 버스정보안내단말기에 표시되는 안내 및 홍보 콘텐츠의 표출 순서, 화면 구성, 화면별 표출 시간 및 적용 기간 등 시나리오 운영 정보를 제공합니다. 해당 데이터는 버스 도착정보, 시정홍보, 공공안내 등 시민에게 제공되는 정보의 화면 운영 기준을 관리하기 위한 기초자료로 활용되며, 버스정보안내 서비스 운영 관리, 안내 콘텐츠 구성 및 운영 현황 분석, 정보 제공 체계 개선, 대중교통 이용 편의 증진을 위한 행정업무 및 정책 수립에 활용할 수 있습니다. 또한 버스정보안내단말기 운영 현황을 파악하고 공공정보 제공 서비스의 효율성을 분석하기 위한 기초자료로 활용 가능합니다.
