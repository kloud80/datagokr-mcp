summary_user: 대구 1호선 도시광역철도역의 역명을 역 단위로 담은 파일로, 한글 역명과 함께 영문·로마자·일본어·중국어(간체·번체) 표기를 운영기관명·선명과 나란히 담는다. 관광 안내 앱이나 다국어 표지판을 만드는 사업자가 '대구 1호선 각 역을 외국어로 어떻게 표기하나'를 확인할 때 쓴다. 실측 컬럼에 역코드 같은 전역 조인 키가 없어 다른 역·승하차 데이터와는 역명·선명 문자열 매칭으로만 잇는다.
description_portal: 대구1호선에 포함된 도시광역철도역들의 역명,역명(영문),역명(로마자),역명(일본어),역명(중국어간체),역명(중국어번체) 등의 정보 입니다.역명(驛名 / Name of station)은 철도역(정거장)의 명칭을 말한다.① 노선명 및 역명 표기문자는 한글로 최대 6자 이내로 정하는 것을 원칙으로 하되, 5자 이상으로 정할 경우에는 4자 이내의 축약 역명까지 동시에 정하여야 한다.② 철도시설관리자 및 철도운영자는 한글 역명과 더불어 외국인 관광객의 안내 등을 위하여 외국어(로마자, 한자) 역명을 표기하여야 한다.1. 한글 명칭과 한자 명칭이 서로 다른 때에는 한글 명칭을 우선 고려할 것2. 역명은 한글 맞춤법에 따를 것3. 로마자 표기는 국어의 표준 발음법에 따라 적는 것을 원칙으로 하며, 정부에서 정한 국어의 로마자 표기법에 따를 것. 다만, 일반적으로 국어와 외래어가 혼용하여 사용되고 있는 시청, 광장, 종합운동장 등은 번역하여 시티 홀(City Hall), 스퀘어(Square), 스포츠 콤플렉스(Sports Complex) 등으로 표기 가능
