summary_user: 전국 고속도로의 노선별 기본 정보를 담은 기준 데이터로, 고속도로 식별자, 방향, 노선명·노선번호, 도로 등급, 기점·종점 방향명과 등록·수정 일시가 들어 있습니다. 교통 분석가나 서비스 개발자가 실시간 속도·돌발 정보에 나오는 고속도로가 어느 노선의 어느 방향인지 확인할 때, 그리고 이력을 쌓아 상습 정체 구간을 분석할 때 노선 기준표로 씁니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 고속도로 실시간 소통 데이터와는 노선번호(RTE_NO)·노선명 등 이름·코드를 맞춰 잇습니다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
