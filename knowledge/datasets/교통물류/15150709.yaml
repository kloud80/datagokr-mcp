summary_user: 경찰청이 제공하는 교통안전 위험요소 중 기상 요인인 도로 결빙 정보를 위험요소 건별로 담으며, 각 건에 지번·도로명 주소, 위경도, 관련 링크 ID, 기준일자, 분류코드, 상세 내용이 붙고 범위는 전국이다. 운전자나 지자체·교통안전 분석가가 '우리 지역에서 결빙 위험이 지정된 도로 지점은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 주소·위경도 같은 위치 정보나 관련 링크 ID(RLTN_LNK_ID)를 이름·코드 매핑해 붙여 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별:기상-결빙 데이터는 경찰청에서 제공하는 정보입니다.
