summary_user: 출발·도착 터미널을 지정해 시외버스 배차·출발시간·도착 예정시간을 조회하는 API로, 전국 범위이며 전체 4,358건 중 1,025행을 검증 수신했다. 이용자가 '이 구간 시외버스가 오늘 운행하는지, 몇 시에 출발하는지'를 확인하는 질문에 쓴다. 필수 파라미터인 출발·도착 터미널ID는 터미널 목록(terminalId, 터미널명, 도시코드)을 먼저 받아 넘겨야 하며, 이를 제외하면 다른 데이터와 잇는 전역 조인 키는 없다.
limits: 포털 설명상 당일 배차정보만 제공하므로 미래 날짜나 과거 운행 이력은 조회할 수 없다. 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결되며, 오퍼레이션 중 /GetStrtpntAlocFndSuberbsBusInfo는 최소 파라미터로 응답이 없었다.
