description_portal: 출/도착지를 기반으로 시외버스 운행정보를 조회하는 서비스입니다.※ 현재 당일 배차정보만 제공하고 있습니다.(추후에 배차정보 기간을 연장할 예정이니 양해해 주시기 바랍니다.)본 서비스는 이용자가 선택한 출발 터미널과 도착 터미널을 기반으로, 해당 구간을 운행하는 시외버스의 배차 정보와 출발 시간, 도착 예정 시간 등 기본적인 운행 현황을 종합적으로 제공합니다.이를 통해 이용자는 특정 노선의 시외버스 운행 여부를 사전에 확인할 수 있으며, 이동 일정 수립과 대기 시간 예측 등 보다 효율적인 교통 계획을 세우는 데 활용할 수 있습니다.현재는 시스템 운영 정책에 따라 당일 운행되는 배차 정보만 제공하고 있으나, 향후 서비스 안정화 및 이용 편의성 향상을 위해 배차 정보 조회 기간을 단계적으로 확대할 예정이므로 이용에 참고 바랍니다.또한 한번에 출력되는 데이터 목록수를 설정할수 있으며, 페이지 번호를 설정하여 전체 데이터를 분할하여 호출이 가능합니다. TAGO 연계현황및 기술자료는 http://www.tago.go.kr에서 확인이 가능합니다.데이터 활용 추가 문의사항은 TAGO 운영팀(054-459-7870)으로 문의 바랍니다.
