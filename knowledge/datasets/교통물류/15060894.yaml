summary_user: 대구도시철도 3호선의 열차 운행실적을 연·월 단위로 집계한 파일로, 영업일수와 정기·임시 영업열차 및 비영업열차의 운행횟수와 운행거리(킬로미터)를 담는다. 분석가나 정책 담당자가 '3호선의 월별 열차 운행횟수와 운행거리는 어떻게 변해 왔는가'처럼 운행 효율과 운행계획을 살필 때 쓴다. 전역 조인 키는 없으므로 같은 대구교통공사의 다른 호선 운행실적이나 승하차 통계와는 연도·월·호선 값을 맞춰 이어 쓴다.
description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 운영정보 데이터로, 2015년 4월부터 현재까지 대구도시철도 3호선의 월별 영업열차 및 비영업열차 운행실적을 제공합니다. 주요 항목은 정기·임시 영업열차 운행횟수와 운행거리, 정기·임시 비영업열차 운행횟수와 운행거리로 구성되어 있습니다. 해당 자료는 도시철도 운영 현황의 투명한 공개를 통해 공공기관의 책임성과 신뢰성을 높이는 데 활용될 수 있으며, 도시철도 운행 효율성 분석, 차량 정비 및 운행계획 수립, 정책 수립 등 다양한 행정 및 연구 분야의 기초자료로 활용할 수 있습니다. 또한 공공교통 서비스 품질 향상과 데이터 기반 정책결정을 지원하는 자료로 활용될 수 있습니다. 본 데이터는 매월 정기적으로 갱신됩니다.'
