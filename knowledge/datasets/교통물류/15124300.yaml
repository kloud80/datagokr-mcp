description_portal: '○ 경상남도 거창군 1톤 트럭 폐차 현황에 대한 데이터로 폐차 대상 차량 최초 등록일, 폐차 일(말소일), 폐차 시점 차량 최종 주행거리, 폐차 시점 차량 최종 주행거리, 폐차 사유 (노후/사고), 폐차시 차량 상태, 데이터기준일자를 제공합니다.○ 데이터 기준일 : 2025. 09. 19.○ 1톤 트럭 폐차 및 말소등록은 조기폐차 지원금 대상 여부 확인, 폐차 신청 및 말소 행정 처리, 말소 사실 증명서 발급 순서로 진행됩니다. 먼저, 폐차를 원하는 1톤 트럭이 조기폐차 지원금 대상(배출가스 4·5등급 경유차 등)인지 확인하고, 지원금을 받으려면 한국자동차환경협회 등에 신청해야 합니다. 지원 대상 확인 후 폐차장으로 차량을 보내 폐차 절차를 진행하면, 폐차장은 말소 행정 처리를 하여 차량 등록 정보를 삭제하고 말소 사실 증명서를 발급해 줍니다.'
