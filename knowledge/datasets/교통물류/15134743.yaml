description_portal: 서울시의 교량·터널 통합모니터링 시스템에서 수집한 도로에서 발생한 화재의 위치 정보(XTM좌표계, 위경도 좌표) 및 발생 일시를 시민과 관계 기관에 제공합니다.  지난 1년간 발생한 서울시 도로상에서 발생한 화재 위치 및 시간 정보를 제공하며 화재가 발생한 도로의 종류(일반도로, 전용도로, 지하도로 등) 를 제공합니다. 발생 일시 및 위치정보는 사후 분석 및 통계자료로 활용할 수 있습니다. 또한 , 서울시의 교통안전에 대한 정보를 제공함으로써 시민의 불안감을 줄이고 행정 정보의 투명성과 신뢰도 제공을 목표로 합니다.
