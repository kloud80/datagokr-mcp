description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 대구도시철도 각 역사별 주소 및 연락처 정보를 제공합니다. 데이터에는 호선별 역명(한글·영어·중국어), 환승 가능 여부, 역사 주소, 전화번호 등의 주요 항목이 포함되어 있으며, 이용자가 역사 위치와 기본 시설 정보를 확인할 수 있는 자료입니다. 해당 데이터는 도시철도 이용 안내, 역사 정보 제공, 위치 기반 서비스 활용 및 교통 관련 정보 서비스 구축을 위한 기초자료로 활용할 수 있습니다. 또한 외국인 이용자를 포함한 다양한 이용자가 역사 정보를 쉽게 확인할 수 있도록 지원하며, 도시철도 접근성 향상과 이용 편의 개선을 위한 자료로 활용할 수 있습니다. 본 데이터는 역명, 주소, 전화번호 등 역사 정보 변경 사항 발생 시 갱신됩니다.'
