summary_user: 전라남도 광양시의 가로등을 한 개씩 관리번호와 위도·경도 좌표, 관리부서로 기록한 건별 원천 목록(CSV 약 1MB)이다. 시민이나 분석가가 "우리 동네 어느 길에 가로등이 있고 어느 부서가 관리하는가", "야간 보행 경로의 조명 공백은 어디인가" 같은 질문에 지도 위로 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표로 공간 결합하거나 같은 기관(광양시)의 다른 시설물 자료와 이름으로 맞춰 쓴다.
description_portal: 이 데이터는 시군구별 가로등 설치 및 관리 현황을 기록한 자료입니다. 가로등의 종류, 관리구분, 위도와 경도 좌표, 관리부서 등의 항목을 포함하여 각 지역의 가로등 위치 및 관리 체계를 상세히 제공합니다. 이를 통해 지자체는 가로등 유지보수, 안전 점검, 에너지 효율화 정책 수립 등에 활용할 수 있습니다. 또한 가로등 종류별 설치 현황을 분석하면 친환경 LED 가로등 확산 추세나 노후 가로등 교체 필요성을 파악할 수 있으며, 시민 안전과 도시 환경 개선을 위한 정책적 의사결정에도 기초 자료로 사용됩니다.
