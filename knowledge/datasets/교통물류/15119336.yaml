summary_user: 서울교통공사 각 역에 설치된 엘리베이터·에스컬레이터 등 승강기를 한 대씩 역 코드·역명·승강기명·운행구간·설치위치·승강기 구분과 함께 담고, 정상 가동 여부(USE_YN)를 기록한 시설 단위 현황 데이터입니다. 휠체어 이용자·노약자·유모차 동반 승객이 '지금 가려는 역의 엘리베이터가 정상 운행 중인가, 어느 출입구 쪽에 있나'를 확인하거나, 분석가가 역별 교통약자 이동편의시설 설치·고장 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 역 데이터와는 역 코드(STN_CD)나 역명을 맞춰 같은 기관(서울교통공사) 역 데이터와 연결하며, 역 좌표·출입구 마스터와 이어 역세권 접근성 분석에 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 외부 API로, 공공데이터포털 활용신청과 별도로 서울시 인증키(경로의 KEY)가 필요하다. 공통 조인 키가 없어 다른 기관·노선 데이터와는 역명이나 서울교통공사 역 코드 매핑으로만 연결된다.
