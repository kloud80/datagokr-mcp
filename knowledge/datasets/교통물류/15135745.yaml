description_portal: '이 데이터는 해양수산부 선박대기오염물질관리시스템에서 선박의 연료유 유형별, 연료별 오염물질 배출계수를 산정하고 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 레저용 선박을 대상으로 한 연료유 유형에 따른 대기오염물질(예: 황산화물(SOx), 질소산화물(NOx), 입자상물질(PM) 등) 배출계수로 구성되어 있습니다. 연료별로 구분된 배출계수 자료가 수록되어 있어 선박에서 발생하는 대기오염물질의 배출량 산정에 활용할 수 있도록 제공됩니다.  본 데이터는 선박 연료 종류별 오염물질 배출량 계산에 활용될 수 있으며, 선박의 대기환경 영향을 산정하거나 해양환경 정부 부처의 대기오염 저감 정책 수립 등과 관련된 업무에 사용할 수 있습니다. 또한 연구 기관에서 연료유 유형별로 선박 배출계수의 실태를 분석하거나 배출량 산정 모델을 검증하는 데 활용할 수 있습니다.'
