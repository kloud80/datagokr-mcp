summary_user: 전국 교통사고를 발생월과 요일 조합별로 묶어 사고건수와 사망·중상·경상·부상신고자수를 담은 집계 통계 파일이며, 경찰이 조사·처리한 인적 피해 사고만 포함하고 행정구역 구분이 없는 전국 단위 비공간 자료다. 교통안전 담당자나 분석가가 '어느 달, 어느 요일에 사고와 사망자가 많은가' 같은 시기별 사고 집중 패턴을 확인하고 단속·홍보 시기를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발생월·요일 같은 이름 값으로 맞추거나 같은 기관의 다른 교통사고 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '- 월별, 요일별 교통사고 통계  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수    ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)    ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우    ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우    ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨- 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
