summary_user: 부산광역시 남구 관내(대연동·용호동·용당동·감만동·우암동·문현동) 도로를 노선 단위로 정리한 파일로, 노선마다 도로 구분(대로·로·길), 노선명, 시점·종점 주소, 폭(m), 길이(m)를 담는다. 남구의 도로망 구성과 규모를 파악하려는 지자체 담당자나 분석가가 "남구에서 폭이 넓은 대로는 어디서 어디까지 이어지는가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명이나 시점·종점 주소를 이름으로 맞춰 연결해야 한다.
limits: 표준 코드나 도로 식별번호 같은 공통 키가 없어 도로명주소·도로 대장 등 다른 데이터와 자동으로 결합하기 어렵다. 범위는 부산 남구 한 개 시군구에 그치고 좌표가 없는 비공간 자료라 지도 분석에는 주소 변환이 따로 필요하다.
