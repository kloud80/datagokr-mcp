summary_user: 서울시 공공자전거 따릉이의 이용 실적을 대여일자·대여소별로 정기권 여부, 성별, 연령대에 따라 나눠 이용건수·운동량·탄소량·이동거리·이동시간을 집계해 담는다. 분석가나 정책 담당자가 '특정 대여소에서 어느 연령대·성별이 언제 많이 빌리는가'처럼 대여소별 일별 수요와 이용자 구성을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 따릉이 대여소 정보 데이터와는 대여소 번호·이름(RENT_ID, RENT_NM)을 맞춰 연결해야 한다.
description_portal: 서울특별시 공공자전거 일별 이용정보입니다. 대여일자, 대여소, 정기권유무, 성별, 연령대, 운동량, 이용건수 정보를 제공합니다. 서울특별시 공공자전거 따릉이 일별 이용정보 데이터는 시민들의 자전거 이용 패턴을 다각도로 분석할 수 있도록 구성된 자료이다. 이 데이터에는 대여일자를 기준으로 대여소 위치, 정기권 이용 여부, 이용자의 성별과 연령대, 운동량, 이용건수 등의 정보가 포함되어 있어 다양한 관점에서 이용 행태를 파악할 수 있다. 이를 통해 특정 연령층이나 성별에 따른 이용 특성, 정기권 이용자의 비율, 일별 수요 변화 등을 분석할 수 있으며, 건강 및 운동 효과와의 연관성도 살펴볼 수 있다. 또한 이러한 분석 결과는 공공자전거 서비스 개선, 이용자 맞춤 정책 수립, 그리고 도시 내 친환경 교통 활성화를 위한 기초자료로 활용될 수 있다.
