summary_user: 경기도 안산시 개별 교차로의 교통량·포화도를 5분 단위 시계열로 담은 파일 데이터로, 교차로 아이디와 통계일시분별로 기록되며 csv 한 개(약 1.37MB)로 제공된다. 교통 분석가나 지자체 담당자가 '안산시의 어느 교차로가 어느 시간대에 포화도가 높아 병목이 생기는가'를 확인해 신호 최적화나 상습 정체 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 교차로 아이디를 같은 기관의 교차로 위치·명칭 자료와 이름·코드 매핑으로 연결해야 하며, 이력을 쌓아 링크 속도 등 다른 실시간 소통 자료와 함께 본다.
description_portal: 이 데이터는 개별 교차로의 교통 상황을 5분 단위로 매우 상세하게 기록한 시계열 자료입니다. 각 교차로 아이디(ID)별로 특정 시간대의 교통량, 도로가 얼마나 혼잡한지를 나타내는 포화도, 그리고 전반적인 소통 상태를 등급으로 보여주는 서비스 수준을 핵심 지표로 제공합니다. 도로 구간이 아닌 교차로에만 집중된 데이터를 통해 특정 지점의 신호 최적화, 병목 현상 원인 분석, 그리고 실시간 교통 제어 전략 수립에 직접적으로 활용될 수 있는 매우 구체적이고 실용적인 정보입니다. 도시 교통 관리 시스템의 효율성을 높이는 데 필수적인 기초 데이터로 높은 가치를 지닙니다.
