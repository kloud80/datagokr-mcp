summary_user: 인천광역시 계양구의 불법 주정차 위반 내용·위반 차종·위반 구역·근거 법규별 과태료 금액(원)을 담은 CSV 파일이다. 파일 크기가 585바이트에 불과해, 개별 단속 건을 쌓은 기록이라기보다 위반 유형별 과태료 기준을 정리한 짧은 표로 보인다. 시민이나 사업자가 '계양구에서 승용차를 횡단보도 앞에 세우면 과태료가 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위반 내용·차종 같은 이름을 맞추거나 같은 계양구 데이터끼리만 이어 쓴다.
description_portal: '이 데이터는 인천광역시 계양구 내에서 발생한 불법 주정차 위반 사례에 대한 과태료 정보를 수록한 공공데이터 파일입니다. 포함된 주요 항목으로는 순번, 위반내용, 위반차종, 위반구역, 근거법규, 위반과태료 등이 있으며, 계양구 관내 교통질서 위반에 대한 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다.순번은 각 위반 사례를 식별하기 위한 고유 번호이며, 위반내용은 불법 주정차의 구체적인 행위(예: 횡단보도 앞 주차, 이중주차 등)를 명시합니다. 위반차종은 해당 위반을 일으킨 차량의 종류(예: 승용차, 화물차, 이륜차 등)를 나타내고, 위반구역은 위반 행위가 발생한 구체적인 장소나 도로 구간을 의미합니다. 근거법규는 해당 과태료가 부과된 법적 근거(예: 도로교통법 제XX조 등)를 제시하며, 위반과태료는 각 위반 행위에 부과되는 금액을 나타냅니다.이 데이터는 행정기관의 교통단속 정책 수립, 불법 주정차 위험 지역 분석, 과태료 부과 기준 검토 등 다양한 행정적 목적뿐만 아니라 민간의 연구 및 시민들의 자가 학습 자료로도 활용이 가능합니다. 계양구는 해당 정보를 투명하게 제공함으로써 공공의 교통질서 확립과 시민 안전을 위한 예방적 조치에 기여하고자 합니다.'
