summary_user: 경찰청이 제공하는 화물차 기준 교통 위험요소 정보를 지점(위험요소) 단위로 담으며, 위험요소 식별번호, 대·중·소분류 코드, 지번·도로명 주소, 위경도, 탐지 기준일자, 촬영정보 유무와 상세내용이 들어 있다. 화물차 운수사업자나 교통안전 분석가가 화물차 운행 경로 주변에 어떤 위험요소가 어디에 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 위경도·주소를 기준으로 공간·이름 매핑해 잇는다. 연계 링크 식별자(RLTN_LNK_ID)가 있으나 어떤 도로 링크 체계와 맞물리는지는 확인되지 않았다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-차종별 데이터는 경찰청에서 제공하는 정보입니다.
