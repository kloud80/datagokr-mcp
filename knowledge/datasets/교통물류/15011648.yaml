description_portal: 본 데이터는 항만을 통해 이뤄지는 화물의 반출입 내역을 관리하는 시스템으로, 먼저 청코드(항만 또는 행정청 식별 코드), 호출부호, 입항횟수 등 기본 식별 정보로 화물 반출입 기록을 조회할 수 있도록 구성되어 있습니다. 조회 후 ‘화물정보’ 탭에서는 각 항목별 세부 정보가 제공되며, 여기에는 적하목록관리번호(cargo manifest ID), B/L 번호(선하증권 번호), MSN (Manifest Sequence Number 혹은 화물 표시번호), 부두코드(화물이 하역된 부두 식별 코드), 국내 화주 정보, 최종 목적항(destination port) 등 수출입 화물의 흐름과 관련된 핵심 정보가 포함되어 있습니다.
