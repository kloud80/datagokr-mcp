summary_user: 경찰이 조사·처리한 인적 피해 교통사고를 전국 단위로 발생월별 집계해 사고건수·사망자수·중상자수·경상자수·부상신고자수를 담은 소용량 파일(약 453바이트 CSV)이다. 교통안전 분석가나 정책 담당자가 "교통사고와 사망자가 몇 월에 많이 발생하는가" 같은 월별 계절성을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 발생월을 기준으로 이름을 맞춰 붙이거나 같은 기관(도로교통공단·TAAS) 통계와 함께 쓴다.
limits: 전국 단위 비공간 집계라 지역·도로 구간·링크 단위 분석에는 쓸 수 없고, 표준노드링크 등 공간 데이터와 직접 이어지지 않는다. 연간 단위로 집계돼 당해년도 통계는 다음 해에 제공되며, 사망은 사고 후 30일 이내 기준(1999년까지는 72시간)이라 시계열 비교 때 주의한다.
