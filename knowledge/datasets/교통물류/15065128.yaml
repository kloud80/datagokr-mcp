description_portal: 택시운행정보관리시스템(TIMS) 운영현황 확인을 위한 홈페이지 일별 메뉴별 접속자수 데이터이며,일자, 상위메뉴명, 메뉴명, 접속자수를 제공합니다.택시운행정보관리시스템은 택시운송사업의 발전에 관한 법률 제13조에 따라  주행거리, 속도, 위치정보(GPS), 분당 회전 수(RPM), 브레이크신호, 가속도 등 「교통안전법」 제55조제1항에 따른 운행기록장치에 기록된 정보와 승차일시, 승차거리, 영업거리, 요금정보 등 「자동차관리법」 제47조제1항에 따른 택시요금미터에 기록된 정보를 수집 관리합니다.
