summary_user: 경상남도 양산시 버스정보시스템의 버스정류장을 정류장 하나당 한 행으로 담은 원장 파일로, 정류장 아이디·정류장명·교차로 여부와 위도·경도 좌표를 담는다(CSV 약 130KB). 시민이나 분석가가 '우리 동네에서 가장 가까운 버스정류장은 어디인가', '양산시 정류장이 어느 지역에 몰려 있는가'를 알아보거나 지도에 표시할 때 쓴다. 전역 조인 키는 없으므로 실시간 도착·노선 정보와는 정류장 아이디나 정류장명으로 직접 맞춰 붙이고, 다른 공간 데이터와는 위도·경도 좌표로 잇는다.
description_portal: 양산시 버스정보시스템은 버스와 정류소에 무선 송, 수신기를 설치함으로써 버스의 운행상황을 실시간으로 파악하여 정류소에서 해당버스의 도착시간을 안내하고, 이를 유무선 인터넷을 통하여 제공함으로써, 이용시민이 체감하는 대기시간을 축소하고, 운수업체의 수익을 제고하는 등의 많은 기대효과를 거둘 수 있는 최첨단 시스템 입니다.또한 서비스 지역을 단일시가 아닌 양산을 중심으로 광역생활권인 부산광역시 및 울산광역시를 포함하는 서비스 입니다. 광역BIS는 시내버스 이용자에 대한 서비스를 향상시켜 승용차 통행을 억제하고 시내버스 이용의 활성화 및 정시성 확보를 목적으로 합니다.본 데이트는 양산시 버스 정류장 명칭 및 위도, 경도 등 위치정보를 제공합니다.
