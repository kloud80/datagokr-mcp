summary_user: 서울교통공사 1~8호선 역사 안에 설치된 무인민원발급기를 기기 설치 장소 단위로 담은 현황 파일로, 호선·역명·기기종류·지상/지하 구분·역층·상세위치·설치대수와 운영 업체 연락처를 포함한다. 시민이 집이나 회사 근처 어느 지하철역에서 주민등록등본 같은 민원서류를 뽑을 수 있는지, 역 안 어디에 기기가 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 역사·시설 데이터와는 호선과 역명을 이름으로 맞춰 연결해야 한다.
description_portal: 서울교통공사에서는 1~8호선 지하철 역사 내에 무인민원발급기 설치 장소를 제공하고 있습니다. (서울시 각 구청 또는 경기도청에서 운영 및 관리) 이를 통해 시민들이 구청까지 방문하지 않아도 근처 지하철역을 방문하여 민원 관련 서류를 발급할 수 있도록 시민 편의를 제공하고 있습니다. 이 자료는 각 지하철 역사내에 설치되어있는 무인민원발급기의 운영 현황에 대한 자료이며, 선릉역 등 74개 기기(25년 6월 기준)에 대한 데이터를 제공합니다. (설치 호선, 역명, 기기종류, 지상지하 구분, 역층, 상세위치 등) 이 자료는 1년에 2번 업데이트 될 예정입니다.
