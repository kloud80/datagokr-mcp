summary_user: 충청남도 공주시가 내준 도로점용(굴착) 허가를 허가 건별로 담은 파일로, 점용자·점용 시작일과 종료일·점용 목적·도로명을 기록한다. 공주시 주민이나 사업자가 "우리 동네 어느 도로에서 언제까지 굴착·점용 공사가 이어지는가"를 확인하거나, 분석가가 시내 도로 공사 발생 시기와 목적을 파악하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 도로명을 이름으로 맞추거나 같은 공주시 자료끼리 연결해 쓴다.
limits: 공식 코드형 조인 키가 없어 도로명 표기를 직접 맞춰야 하며, 범위는 공주시 한 곳에 한정되고 좌표가 없어 지도 위치 분석에는 바로 쓰기 어렵다. 명세상 연간 또는 이벤트 단위로 만들어지는 파일이라 진행 중인 공사의 실시간 현황으로 보면 안 된다.
