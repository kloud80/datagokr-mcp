summary_user: 경기도 포천시에 등록된 화물운송주선업체를 업체 한 곳당 한 행으로 담은 목록으로, 업체명·업종구분·인허가일자와 도로명·지번주소를 포함한다(시군구 범위, CSV 약 7KB). 화주나 물류 서비스 이용자가 '포천에 있는 허가받은 화물운송주선업체가 어디에 있고 언제 인허가됐나'를 확인하거나, 분석가가 지역 내 주선업체 분포를 살피는 데 쓴다. 전역 조인 키가 없어 전국화물자동차운송사업자표준데이터 등 다른 자료와는 업체명·주소를 맞춰 이어 써야 한다.
description_portal: 경기도 포천시에서 제공하는 화물운송주선업현황 데이터입니다. 인허가일자 항목은 인허가된 일자를 나타냅니다. 업체명은 해당 업체명을 나타냅니다. 도로명주소는 업체가 위치한 도로명주소를 나타냅니다. 지번주소는 업체가 위치한 지번주소를 나타냅니다. 데이터기준일자는 데이터가 갱신된 일자를 나타냅니다. 이 데이터는 지역 내 물류업체의 분포와 특성을 파악하는 데 유용하며, 물류 서비스 이용자나 관련 기관이 업체를 찾거나 비교할 때 참고할 수 있습니다. 또한, 물류 산업의 구조 분석이나 정책 수립에 필요한 기초 자료로 활용될 수 있습니다.
