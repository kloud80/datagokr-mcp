description_portal: 한국교통안전공단에서 버스 운송사업자를 대상으로 수집한 전국 대중교통 고속버스 경영현황 자료입니다.경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남으로 구분하여 데이터를 제공하고 있습니다.데이터는 자산총계, 부채총계, 자본총계, 운송수입(매출액), 운송원가(매출원가)로 구분하여 제공합니다.이때 자산총계 = 부채총계 + 자본총계 입니다.단위는 백만원입니다.해당 데이터를 통해 대중교통 운영자 현황을 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.
