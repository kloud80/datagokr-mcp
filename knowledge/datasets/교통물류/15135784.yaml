summary_user: 건축물대장에서 모은 지번주소(시도·시군구·법정읍면동·리·산 여부·본번·부번)를 지번 한 건씩 담은 전국 단위 원천 목록이며, 도로명주소와 건물 정보는 담지 않는다. 지번주소를 정제하거나 검증하려는 분석가가 '이 지번이 어느 법정동에 속하고 실제로 존재하는 지번인가'를 확인하는 데 쓴다. 법정동 코드(행안부 행정표준코드 준용)가 있지만 실측에서 전역 조인 키로는 확인되지 않아, 다른 데이터와는 법정동 코드나 시도·시군구·읍면동 이름 매핑으로 이어 쓴다.
description_portal: 한국교통안전공단에서 제공하는 정보입니다. 해당 정보는 지번주소에 대한 내용을 제공하고 있으며, 도로명 주소는 제공하고 있지 않습니다. 건축물대장 정보에서 수집한 지번정보(시도, 시군구, 법정동, 읍면동, 리, 본번, 부번)를 제공하고 있으며, 이외 건물에 대한 정보는 포함하고 있지 않습니다. 리가 없는 지번은 법정리 항목을 공란으로 표기하여 제공합니다. 데이터 제공 시점에 따라 현행 지번 부여 체계와 맞지 않을 수 있으니 이용에 참고하시기 바랍니다. 법정동 코드는 행안부의 행정표준코드를 준용합니다.
