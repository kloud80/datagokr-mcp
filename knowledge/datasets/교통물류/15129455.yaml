summary_user: 전국 공항 국내노선의 여객 실적을 노선·항공사(ICAO 코드)별로 묶어 좌석수, 성인·유아 여객수, 좌석 대비 이용률로 담은 월별 집계 통계 파일이다(CSV, 약 5KB). 항공사·여행업계나 지역 관광 분석가가 '어느 국내노선·어느 항공사의 좌석이 얼마나 차는가'를 보고 노선 수요나 지역 관광·출장 수요를 가늠하는 데 쓴다. 전역 조인 키는 없어서, 다른 항공통계와는 노선명(공항 이름)이나 항공사 ICAO 코드를 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 한국공항공사(Korea Airports Cooperation)에서 운영하는 전국공항 국내노선을 활용하는 여객의 항공사별 이용률 월별 통계자료를 제공합니다.국내노선에서 노선, 항공사(ICAO 코드), 좌석수, 성인, 유아, 여객수, 이용률에 대한 정보를 제공하며,좌석수 대비 얼마나 많은 승객이 이용했는 지를 이용률을 통해서 알 수 있습니다. 해당자료는 매월 업데이트가 되며, 통계처리를 하는 기간에 따라 시간이 조금 지연된 자료가 업로드 될 수 있으니 유의해주시기 바랍니다. 추가 문의사항 있으시면 02-2660-4803로 문의주세요!
