summary_user: 수원시의 주정차 위반 단속 건을 단속일시·단속장소·단속방법 단위로 담은 시군구 범위의 파일 데이터로, 포털 설명상 2023년 기준 일회성 자료이며 CSV 한 파일이 약 67MB에 이른다. 시민이 '수원시에서 주정차 단속이 자주 일어나는 장소와 시간대는 어디인가'를 확인하거나, 분석가가 상습 단속 구역을 찾아 단속 인력·장비 배치를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속장소 이름을 주소·좌표로 바꿔 맞추거나 시군명·관리기관명으로만 연결한다.
