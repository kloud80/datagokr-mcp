summary_user: 경기도 버스운송관리시스템(BMS) 사용자가 올린 문의 게시글을 글 한 건 단위로 담은 원천 자료로, 게시판 일련번호·제목·등록일자만 들어 있다. 운수사·지자체 담당자나 분석가가 노선 정보 오류, 차량 등록 에러, 차대번호 중복 같은 시스템 문의가 어떤 유형으로 언제 몰렸는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 버스 노선·정류장 데이터와는 직접 연결되지 않고, 제목의 노선명 같은 이름 매칭이나 같은 기관 자료로만 느슨하게 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 이용하는 사용자들의 문의사항을 기록한 게시판 형식의 자료입니다. 주요 항목은 '게시판 일련번호', '제목', '등록일자'로 구성되어 있으며, 사용자들이 시스템 사용 중 겪은 문제나 개선 요청사항, 정보 문의 등을 담고 있습니다. 문의 내용에는 노선 정보 오류, 차량 등록 에러, 막차시간, 운행정보 등록 문제, 차대번호 중복, 차령만료일 수정 등 다양한 실무적 이슈가 포함되어 있습니다. 이 데이터를 활용하면 사용자 불편사항의 유형별 분석, 시스템 개선 방향 도출, 민원 대응 우선순위 설정, 버스운송관리시스템의 운영 효율성 향상 등을 위한 기반자료로 활용할 수 있습니다.
