summary_user: 익산시 관내 도로 굴착공사를 허가 건별로 정리한 파일로, 허가날짜·굴착위치·굴착목적(통신·전기·가스·수도 매설물 유지보수, 도로정비 등)·굴착 연장·점용자를 담는다(CSV 약 12KB). 시민이나 공사 관계 기관이 "우리 동네 도로가 언제, 누구의 무슨 공사로 파였는지"를 확인하거나 같은 구간 중복 굴착 여부를 살피는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 굴착위치의 주소·도로명 문자열이나 점용자 이름을 맞춰 연결해야 한다.
limits: 표준 행정코드나 좌표가 없어 지도 결합이나 다른 시군구 자료와 바로 조인하기 어렵다. 범위는 익산시 한 곳이고, 명세상 연 단위로 만들어 고정하는 파일이라 진행 중인 공사 현황을 실시간으로 보는 용도에는 맞지 않는다.
