description_portal: 서울특별시 서초구 활주로형 횡단보도 사고예방 분석 데이터_사고번호기준 상세 사고데이터로 연번, 사고번호, 설치위치, 설치연도, 구분, 사고내용, 위도, 경도, 데이터기준일 등의 항목을 제공합니다. 활주로형 횡단보도가 설치된 곳의 설치 전 사고내용을 확인할 수 있는 데이터입니다.서울특별시 서초구는 교통사고 예방과 보행자 안전 강화를 위해 초등학교 주변, 어린이보호구역, 이면도로 등에 활주로형 횡단보도를 설치해오고 있다.활주로형 횡단보도는 구민들의 안전한 보행환경을 위해 서초구가 전국 최초로 설치한 선진국형 교통안전시설이다.일반 횡단보도 주변 바닥(차도 양옆 또는 중앙)에 LED 조명 라인을 설치해서, 비행기 활주로의 유도등처럼 직선형으로 빛이 나도록 만든 횡단보도입니다.활주로형 횡단보도는 첫번째로 운전자 주의를 환기 시킨다. 멀리서도 LED 라인이 눈에 잘 띄어 “앞에 횡단보도 있음!”을 직관적으로 인지하게 할수 있고, 특히 야간·우천·안개 등 시야가 나쁜 상황에서 효과가 크다고 할수 있다. 두번째로 보행자 보호 강화인데, 보행자는 횡단보도 위치를 정확히 인식할 수 있고, 어두운 곳에서도 차량 접근 상황을 쉽게 파악할 수 있다.세번째로 과속및 급정지 사고 감소가 있는데, 조명이 일정한 패턴으로 점등되며. 운전자가 자연스럽게 속도를 줄이고 서행할수 있게 유도한다.매년 보행자 교통사고 다발지점과 민원이 접수된 구간을 중심으로 우선 설치가 이루어졌으며, 초등학교 앞 통학로와 시장 주변, 생활권 보행축 등을 중심으로 확대 중에 있습니다.기대되는 효과로는 야간 보행자 사고율 감소, 차량 감속 효과, 보행자 횡단 의도 파악이 쉬워진다고 볼수 있을것이다.
