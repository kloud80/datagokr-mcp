description_portal: '공공데이터 설명(한글)자동차 안전확인부품제도 시행(2024.5.)에 따라 안전확인부품의 인증 및 관리 등 제도 운영을 위하여 안전확인부품 관리시스템을 구축하였습니다.○ 본 데이터는 자동차 안전확인부품에 대한 통계 자료입니다.자동차 제작사 및 부품 제작사에서 제조한 안전확인부품이 실제 차량에 장착된 건수를 집계한 것입니다.○ 자동차 안전확인부품 장착 현황연도별, 인증대상(대분류·소분류), 차종별 장착 건수를 포함하고 있으며, 안전확인부품 장착 데이터는 안전확인부품 관리시스템을 통해 등록·연계된 자료입니다.○ 데이터 기준일자 : 2025.10.31○ 데이터 항목 설명장착년도 : 해당 안전확인부품을 장착한 연도인증대상_대분류 : 안전확인부품 인증 대상의 대분류 (예: 등화장치, 제동장치, 내장재 등)인증대상_소분류 : 인증대상 세부 부품명 (예: 전조등 튜닝용 LED광원, 주간주행등 등)차종 : 안전확인부품이 장착된 차량의 종류 (예: 승용차, 화물차, 특수차 등)장착건수 : 연도별·차종별 안전확인부품 장착 건수○ 데이터 출처 : 한국교통안전공단 안전확인부품 관리시스템○ 데이터 제공 목적 : 자동차 안전확인부품 제도의 운영 현황 분석 및 제도 활용도 파악'
