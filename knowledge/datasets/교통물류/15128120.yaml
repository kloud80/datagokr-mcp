description_portal: 울산시설공단은 울산대공원 남문 주차장의 월별 주차 현황 데이터를 제공하며, 이 데이터에는 주차장명, 주차장구분, 주차장유형, 소재지도로명주소, 소재지지번주소, 주차구획수, 입차대수, 출차대수 등이 포함됩니다. 주차장명은 주차장의 이름을, 주차장구분은 공영주차장과 민영주차장 구분을, 주차장 유형은 지상 또는 지하 형태를 나타냅니다. 소재지 도로명주소와 소재지 지번 주소는 주차장의 위치를 제공하며, 주차구획 수는 총 주차 공간 수를, 입차 대수와 출차 대수는 각각 차량의 입·출차 수를 기록합니다. 연월은 데이터의 기준 기간을, 데이터기준일자는 데이터 수집일을 나타냅니다.
