summary_user: 경기도 광주시에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 소규모 파일(약 700바이트 CSV)이며, 상호명·소재지·등록번호·최초 등록일·영업 여부를 포함한다. 화주나 무역업자가 광주시 안의 국제물류주선업체가 정식 등록된 곳인지, 지금도 영업 중인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·소재지 주소나 등록번호를 맞춰 보는 방식으로만 잇는다. 운송·주선 허가 여부를 넓게 확인할 때는 전국화물자동차운송사업자표준데이터를 기준으로 함께 본다.
description_portal: 본 데이터는 경기도 광주시에 등록된 국제물류 주선업체의 현황 정보를 제공합니다. 국제 화물의 운송을 중개하고 주선하는 업체의 등록 정보를 담고 있어 국제 물류 서비스 이용과 산업 관리에 활용됩니다. 상호명은 업체의 명칭이며, 소재지는 사업장의 위치를 제공합니다. 등록번호는 업체를 식별하는 고유 번호이고, (최초)등록일은 사업자 등록 시점을 나타냅니다. 사업 여부는 현재 영업 상태를 표시하며, 데이터 기준일자는 정보의 최신성을 확인할 수 있습니다. 본 데이터는 물류 산업 관리, 국제 무역 지원, 적법 업체 확인, 물류 서비스 선택, 산업 통계 분석 등에 활용됩니다.
