summary_user: 나주시 시내버스의 승차·하차 인원을 날짜, 노선, 정류소, 운행시간대별로 담은 월간 집계 파일이며, 포털에서 활용신청 없이 CSV(약 10.9MB)로 받는다. 교통 분석가나 시 담당자가 '어느 노선·정류소에서 어떤 시간대에 이용객이 몰리는가'를 파악해 배차·노선 조정을 검토할 때 쓴다. 전역 조인 키는 없어서, 정류장·노선 원장이나 버스정보(BIS) 데이터와는 노선 ID·정류소 ID 또는 노선명·정류소명을 같은 기관 코드 기준으로 맞춰 이어 쓴다.
description_portal: 승하차 정보 데이터는 버스 승차와 하차에 대한 데이터이며, 날짜, 노선ID, 노선명, 정류소ID, 정류소명, 운행시간대, 승차인원, 하차인원 등을 제공합니다. 나주시 시내버스 승하차 정보를 월간으로 제공합니다. 승하차 정보는 버스정보시스템과 안내기 등 버스정보에 대한 기본적인 데이터이며, 이를 통해 신속, 정확한 대중교통(버스)정보를 제공할 수 있어 시민들의 교통 편의 증진에 기여합니다.수집기간은 매월 1일부터 말일까지 이며 노선, 정류소, 운행시간대에 따른 승차인원과 하차인원에 대한 정보를 제공합니다.
