description_portal: 최근 5개년도(2021~2025년) 교통안전체험교육 센터 이수자 현황 자료입니다. 직접 운전을 통한 체험교육으로 진행되며, 교육 성격에 따라 일수와 교육 난이도, 사용하는 차량 유형, 교육수수료 등이 다릅니다. 체험교육센터는 302,802㎡(경북 상주시), 247,224㎡(경기 화성시)로 전국 2군데 넓은 면적으로 이루어진 교육장입니다.본 데이터에서는 실인원과 연인원으로 구분되어 있습니다. 예를들어, 실인원의 경우, 1명이  5일 분량의 교육을 이수하였을 경우에도 1명으로 산입하지만, 연인원은 5명으로 계산됩니다. 다만, 교육 중 "중도퇴소"가 이루어지는 경우, "실인원 x 5 = 연인원"으로 정확히 맞아 떨어지지 않을 수 있습니다.
