description_portal: '제공되는 데이터는 단순한 총계가 아닌, 건설기계를 다각도로 분류한 상세 현황을 포함합니다.건설기계 명칭: 덤프트럭, 굴삭기, 지게차, 기중기 등 「건설기계관리법」에 따른 각 기계 종류별 명칭과 해당 기종의 등록 대수를 제공합니다.사용 용도별 분류: 등록된 건설기계를 그 사용 목적에 따라 세 가지 범주로 명확히 구분합니다.자가용: 사업자가 자신의 건설 현장이나 목적으로 직접 사용하는 기계.영업용: 타인에게 대여하거나 운송 용역을 제공하여 영업 활동에 사용하는 기계.관용: 사천시청 등 공공기관에서 관리 및 사용하는 기계.기계 종류별 합계: 각 건설기계 명칭(예: 굴삭기)별로 자가용, 영업용, 관용의 총 합계 대수를 제공하여, 특정 기종의 등록 규모를 한눈에 파악할 수 있도록 합니다.'
