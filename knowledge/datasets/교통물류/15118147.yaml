summary_user: 국가철도공단이 시행하는 광역철도 사업을 사업 한 건당 한 행으로 정리한 파일로, 사업명·사업구간(시점~종점)·사업내용(신설·연장·개량 등)·연장(km)·총사업비(억원)·사업기간을 담으며 파일 크기는 992바이트로 소수 사업만 수록된 작은 목록이다. 특정 광역철도 노선이 언제까지 얼마의 예산으로 어느 구간을 신설·연장하는지 확인하려는 주민·부동산 분석가나, 개통 예정을 지역 가격의 선행 신호로 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 철도 계획·역 데이터와는 사업명이나 구간의 역·지명을 이름으로 맞춰 이어 써야 한다.
description_portal: 국가철도공단에서 시행하는 광역철도사업의 세부 내용을 담은 데이터로, 수도권 및 주요 대도시권을 중심으로 추진되는 광역철도 인프라 확장 및 개량 계획을 포함합니다. 주요 항목은 사업명, 사업구간(시점~종점), 사업내용(신설, 연장, 개량 등), 선로길이(㎞), 총사업비, 사업기간으로 구성되어 있으며, 각 사업의 추진 범위, 규모, 예산 및 일정 정보를 종합적으로 제공합니다. 이 데이터는 광역철도 이용자의 접근성 개선, 도시 간 연계성 강화, 교통 혼잡 해소 등을 위한 정책 수립 및 투자 전략 마련에 활용되는 핵심 공공데이터입니다.
