summary_user: 부산광역시 교통정보서비스센터의 AVI(차량 자동 인식) 장치가 차량의 두 지점 통과 시간 차이로 계산한 구간 통행 속도를 생성시간·AVI 구간명·속도 단위로 담는 실시간 API다. 운전자나 교통 분석가가 지금 부산의 어느 AVI 구간이 막히는지 확인하는 데 쓰고, 응답을 계속 쌓으면 상습 정체 구간 분석의 이력 자료가 된다. 전역 조인 키가 없어 다른 링크 속도·돌발상황 데이터와는 구간명(aviSxnNm)을 이름으로 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: '본 데이터는 부산광역시 교통정보서비스센터에서 운영하는 AVI(Automatic Vehicle Identification) 장치를 통해 생성시간, AVI 구간명, 속도 등의 정보를 제공합니다.AVI 장치는 도로에 설치된 인식기를 통해 차량을 식별하고, 차량의 특정 지점 통과 시간 차이를 이용해 구간 통행 속도를 계산합니다.이 데이터는 실시간 교통흐름 파악, 혼잡 구간 분석, 도로 운영 효율화를 위한 중요한 기초자료로 활용될 수 있습니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>구간별 실시간 교통속도 파악 및 소통상황 관리혼잡 예측 및 교통운영 정책 수립 지원돌발상황 발생 시 신속한 우회 안내 및 대응체계 강화물류·여객 교통 효율성 개선을 위한 분석 자료민간 내비게이션·모바일 서비스 연계 활용'
