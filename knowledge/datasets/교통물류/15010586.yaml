summary_user: 한국교통안전공단이 운행기록장치(DTG) 데이터를 분석해 사업용자동차의 위험운전행동 건수를 연·월·차종(업종)별로 집계한 전국 단위 파일로, 과속·장기과속·급가속·급출발·급감속·급정지·급좌우회전·급유턴·급앞지르기·급진로변경 유형별 건수를 담는다. 교통안전 분석가나 운수업 관계자가 "버스·택시·화물 중 어느 업종에서 급감속·과속이 많고 월별로 어떻게 달라지는가"를 비교해 안전운전 교육·관리 대상을 정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연·월과 차종명(업종 이름)을 맞춰 사업용차량 교통사고 통계 등과 이어 쓴다.
description_portal: '한국교통안전공단 운행기록분석을 통한 업종별 월 평균 사업용자동차 업종별 위험운전행동 현황화한 데이터 입니다. 사업용자동차의 위험운전행동 현황은 교통사고 예방과 운전자의 안전운전 습관 형성에 매우 중요한 지표입니다. 한국교통안전공단은 운행기록장치(DTG) 데이터를 분석하여 사업용자동차의 다양한 위험운전행동을 파악하고 있습니다.위험운전행동은 안전운전을 저해하고 사고 발생 위험을 높이는 운전 습관을 말합니다. 한국교통안전공단은 주로 다음과 같은 11가지 유형의 위험운전행동을 정의하고 분석합니다.과속: 제한 속도 이상으로 주행하는 행위장기과속: 일정 시간 이상 지속적으로 과속하는 행위급가속: 급격하게 가속페달을 밟아 속도를 올리는 행위급출발: 정지 상태에서 급하게 출발하는 행위급감속: 급하게 속도를 줄이는 행위급정지: 급하게 브레이크를 밟아 정지하는 행위급진로변경: 급하게 차선을 변경하는 행위급앞지르기: 급하게 다른 차량을 앞지르는 행위급좌회전/급우회전: 급하게 좌회전 또는 우회전하는 행위급U턴: 급하게 U턴하는 행위연속운전: 장시간 휴식 없이 운전하는 행위'
