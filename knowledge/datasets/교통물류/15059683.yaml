description_portal: 「여수광양항만공사 크루즈 입항스케줄(2025)」 데이터는 2025년 한 해 동안 예정된 크루즈선 입항 일정을 정리한 자료로, 선명, 승객수(예상), 입항·출항 예정일, 전항지와 차항지, 대리점 및 연락처 항목으로 구성되어 있습니다. 총 6척의 크루즈 입항이 기록되어 있으며, 항만의 국제 여객 교통 및 관광 수요를 가늠할 수 있는 기초 자료입니다이 데이터는 여수광양항의 크루즈 관광 수요 및 국제 여객 네트워크를 보여주며, 주요 기항지가 일본·제주 등 동북아 지역에 집중되어 있음을 알 수 있습니다. 또한 크루즈별 승객 규모가 수백 명에서 2천 명까지 다양해, 항만 관광 인프라와 지역 경제에 미치는 영향이 클 것으로 예상됩니다. 이 자료는 항만의 크루즈 유치 전략, 지역 관광 연계 정책, 국제 여객 인프라 확충 계획에 중요한 기초 자료로 활용될 수 있습니다.
