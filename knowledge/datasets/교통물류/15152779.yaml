summary_user: 하남시 전역의 버스정류장을 한 행씩 담은 시설 원장 파일로, 정류장 아이디·정류장명·위도·경도를 정류장 단위 좌표로 제공한다. 교통 분석가나 시 담당자가 '정류장에서 먼 교통취약지역이 어디인지, 신규 정류장 후보지는 어디가 적합한지'를 지도 위에서 검토하는 데 쓴다. 전국 공통 조인 키는 확인되지 않아 정류장명이나 하남시 자체 정류장 아이디로 같은 기관의 BIS·노선 자료와 맞춰 잇고, 좌표로 행정구역·인구 격자 등 공간 데이터와 겹쳐 쓴다.
description_portal: 경기도 하남시 전역의 버스정류장 시설정보(버스정류장명, 위경도 등)를 체계적으로 정리한 교통행정 기반자료로, 정류장별 위치·유형·시설물 현황을 정밀하게 파악할 수 있습니다.  정류장의 명칭과 운영 형태를 구분하는 핵심 정보를 제공하고, 경도·위도 값은 GIS 분석을 통해 교통취약지역을 파악하거나 신규 정류장 설치 후보지 검토에 활용될 수 있습니다.  이러한 공간·시설 데이터는 향후 정류장 이용수요 분석, 노선개편 지원, 교통약자 이동권 강화 등 공간기반 대중교통관리 정책의 핵심 기초자료가 될 수 있습니다.
