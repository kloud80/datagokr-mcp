description_portal: '(자료추출 : 2025년, 기준일 2024년 1~12월 수료자 기준)2024년도 체험교육(개인택시면허 양수교육) 이수자의 연령대입니다. 자료는 만나이로 계산되었으며, 2025년 기준일 당시 나이입니다. 교통안전체험교육센터는 「교통안전법」 제56조제1항 및 시행령 제48조제2항에 따라 설치 및 위탁되어 운영되는 "연구·교육" 시설입니다. 승용/화물/승합의 차량을 다양하게 활용하여 총 23종의 교육이 진행되고 있으며, 그 중 "21년부터 시행된 개인택시면허 양수교육의 수요와 국민적 관심에 따라 현재 교육의 절반 이상을 운영하고 있으며 , 이에 따라 교육 간 이수자의 연령대를 데이터화 한 자료입니다.'
