summary_user: 대구 도시철도 1~3호선 각 역의 2017년 1월 1일~12월 31일 승차·하차 인원을 역·날짜별로 05시부터 24시까지 1시간 단위 열과 하루 합계(일계)로 담은 집계 통계 파일(CSV 약 6.6MB)이다. 분석가나 사업자가 '특정 역 주변은 평일 출퇴근 시간대에 유동인구가 얼마나 몰리는가'처럼 역세권 유동인구를 가늠하거나 시간대별 이용 패턴을 비교하는 데 쓴다. 전역 조인 키는 없고 역번호·역명으로만 다른 연도 같은 기관 승하차 자료나 역 위치·시설 자료와 이름 매핑해 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 1~3호선 각 역사별 일자·시간대별 수송 현황 정보를 제공하는 통계 자료입니다. 데이터에는 호선명, 역명, 일자, 시간대, 승차인원, 하차인원 등의 주요 항목이 포함되어 있으며, 2017년 1월 1일부터 12월 31일까지 역사별·시간대별 이용 현황을 확인할 수 있습니다. 해당 데이터는 도시철도 이용 패턴 분석, 시간대별 이용량 비교, 역사별 수송 현황 파악 및 교통 운영 계획 수립을 위한 기초자료로 활용할 수 있습니다. 또한 대중교통 이용 행태 분석, 서비스 개선 검토, 도시 교통 관련 연구 및 정책 수립 등에 활용할 수 있습니다.'
