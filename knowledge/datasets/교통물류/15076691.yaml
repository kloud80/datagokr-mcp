summary_user: 전국 고속도로에 설치된 VDS(차량검지기)의 노선, 검지기 번호(vdsId), 이정·구간 길이, 방향, 도로 등급, 소속 장비 구분, GRS80 좌표를 검지기 한 대 단위로 담는 설치 정보 API이다. 교통량·속도 데이터를 분석하는 사람이 "이 검지기가 어느 노선 어느 지점, 어느 방향에 있는가"를 확인해 지도에 올리거나 구간별 혼잡 분석의 기준 지점으로 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않았다. 같은 기관(한국도로공사)의 VDS 교통량·속도 자료와는 검지기 번호나 노선번호·이름으로 맞춰 잇고, 다른 공간 데이터와는 좌표로 붙인다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 VDS(차량검지기) 설치 지점 정보를 수록한 OpenAPI 서비스이다.전국 고속도로에 설치된 VDS의 위치, 검지 방식, 차로 수, 방향 등 주요 정보를 포함하며 XML 및 JSON 형식으로 제공된다.본 데이터는 교통량 분석, 차량 속도 측정, 혼잡도 예측, 차종 분류 등 교통 관련 정보 수집에 활용 가능하다.VDS 설치 정보는 교통 흐름 모니터링, 스마트 교통체계 구축, 실시간 정보 제공 등 다양한 서비스에 연계될 수 있다.정기적으로 갱신되는 자료는 교통 정책 수립과 도로 운영 효율화, 공공 안전 관리에 기여한다.공공 및 민간 부문에서의 내비게이션 경로 최적화, 시설 계획, 교통 정보 서비스 개발 등에 폭넓게 활용될 수 있다.
