summary_user: 김해시 횡단보도에 설치된 보행신호 음성안내 보조장치를 설치 지점별로 담은 원천 목록으로, 시설종류·대상시설명·도로명/지번 주소·위도·경도·설치연도·설치수량·관리기관을 제공한다. 시각장애인 단체나 보행 안전 분석가가 "우리 동네 어느 횡단보도에 음성안내 장치가 있고, 언제 설치됐나"를 확인하거나 미설치 구간을 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭해 이어 쓴다.
limits: 김해시 한 개 시군구만 다루며 다른 지역 현황은 없다. 표준 코드나 공통 식별자가 없어 신호등·횡단보도 등 다른 시설 데이터와 붙일 때는 주소·좌표 매칭에 의존해야 한다.
