description_portal: 이 데이터는 해양수산부에서 항만 건설 사업의 재정 집행 계획을 관리, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 사업이 종료된 공사의 발주기관명, 회계구분, 사업구분, 세부사업명, 사업금액 및 예산 등 사업 정보로 구성되어 있습니다.본 데이터는 관련 기관에서 항만 건설 사업의 재정 집행 현황을 점검하거나, 사업별 예산 운용 현황을 분석하는 데 활용될 수 있으며, 국고 예산의 효율적 사용과 공정한 사업 관리 체계 구축을 위한 정책 수립, 항만 관련 사업계획 수립 시 참고자료로 사용될 수 있습니다.
