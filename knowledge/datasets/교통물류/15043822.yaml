description_portal: 이 데이터는 해양수산부에서 국적별 항만국통제(Port State Control) 현황 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 선박 국적별 점검선박, 결함선박, 출항이 정지된 선박의 건수와 각 구분별 비율 정보로 구성되어 있습니다.  본 데이터는 항만국통제 제도의 운영 현황을 점검하고, 특정 국적 선박의 결함 및 출항정지 동향을 분석하여 해양 안전관리 지도, 정책 수립과 선사별 점검 필요성 검토, 향후 항만국통제 강화 방안 마련 등 활동을 위한 기초 자료로 활용될 수 있습니다.
