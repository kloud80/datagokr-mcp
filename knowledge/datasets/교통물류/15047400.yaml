summary_user: 서울 지하철 1~9호선(서울시 관할 운송기관) 역별로 교통카드 기준 유임·무임 승차 인원과 하차 인원을 사용월 단위로 집계해 담는다. 분석가나 정책 담당자가 '어느 역에서 무임승차(경로 등) 비중이 높은가', '역별 월간 이용객이 어떻게 변하는가'를 확인하고 유동인구 대체 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 역명(STTN)과 호선명으로 이름을 매핑하거나 같은 서울시 데이터와 연결해 쓴다.
limits: 외부 사이트(서울 열린데이터광장) 인증키가 따로 필요하며 포털 활용신청과는 별개다. 역 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다. 월 단위 집계라 시간대별 승하차나 출발·도착(OD) 분석에는 쓰지 못한다.
