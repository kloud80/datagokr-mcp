summary_user: 서울교통공사가 운영하는 수도권 5호선의 역별 승강장 이격거리를 승강장번호·차량순서·차량출입문번호 단위로 담은 파일(csv, 약 140KB)로, 출입문마다 전동차와 승강장 사이 거리(안전거리)를 기록한다. 교통약자 단체나 안전 분석가가 '5호선에서 열차와 승강장 사이가 넓어 발 빠짐 위험이 큰 역과 출입문은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 역 데이터와는 역명·선명 같은 이름 매핑으로만 연결하고, 같은 기관의 다른 호선 승강장이격거리 파일과 묶어 쓴다.
