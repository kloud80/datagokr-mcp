summary_user: 대구광역시 내 단독주택·공동주택·공장을 제외한 건축물 부설주차장을 주차장 한 곳당 한 행으로 담고, 주소·위경도, 주차구획수, 운영시간, 요금, 개방공유 참여 여부와 개방 면수·시간을 함께 담는 시도 단위 파일(CSV 약 1.4MB)이다. 시민이 '지금 가려는 동네에 주말에 외부인에게 개방되는 부설주차장이 있고 요금은 얼마인가'를 확인하거나, 분석가가 구·군별 개방공유 주차자원 분포를 살피는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 같은 다른 주차장 데이터와는 주차장명·주소 매칭이나 위경도 근접 매칭으로 잇고, 구·군 단위 집계는 구군코드를 기관 내부 코드로 써서 묶는다.
description_portal: 본 데이터는 대구광역시 내 단독주택, 공동주택, 공장을 제외한 건축물 부설주차장의 운영 및 개방공유 현황을 종합적으로 제공한다. 주차장의 위치, 도로명주소 또는 지번주소, 요금정보, 운영시간, 주차시설 면수, 개방공유주차사업 참여 여부 등의 주요 항목을 포함하며, 이를 통해 시민은 주차 가능 여부를 쉽게 확인할 수 있다. 또한 공공·민간 주차자원의 효율적 활용을 지원하고, 불법주차 예방과 지역 교통 혼잡 완화, 나아가 주차정책 수립의 기초자료로 활용될 수 있다. 또한. 개방공유로 통해 교통유발부담금 할인을 할수 있다.
