summary_user: 전국 철도에서 일어난 자살사고를 건별로 담은 파일로, 발생 연·월·일, 철도구분, 사고 종류와 근본원인, 행정구역·노선·발생장소, 사망·중상자 수, 총 피해액(백만원)을 기록한다. 철도 안전 담당자나 분석가가 어느 노선·장소 유형에서 자살사고가 반복되는지 확인해 스크린도어 설치 같은 예방 대책의 우선순위를 정하는 데 쓴다. 전역 조인 키는 없어서, 다른 철도 사고·역 데이터와는 행정구역·노선·발생장소 이름을 맞춰 연결하거나 같은 기관의 철도 안전 데이터와 나란히 놓고 본다.
limits: 표준 코드 형태의 조인 키가 없어 다른 데이터와 붙이려면 노선명·장소명 같은 이름을 직접 맞춰야 한다. 범위는 전국이며 좌표 같은 공간 정보가 없어 지도 위 지점 분석에는 바로 쓰기 어렵다.
