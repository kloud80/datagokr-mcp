summary_user: 울산시설공단 각 부서가 운용하는 친환경 차량을 한 대씩 담은 보유 목록으로, 부서명·차량번호·차량명·등록일자·배기량·승차인원·유종 등과 기준일자를 담으며 CSV 파일 크기가 637바이트인 소규모 자료다. 공공기관 친환경차 도입 현황을 살피는 분석가나 시민이 '울산시설공단은 어떤 연료의 친환경차를 몇 대, 어느 부서에서 운용하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 기관 차량 보유현황과는 유종·차량명 같은 이름 매핑으로만 견주어 쓴다.
description_portal: 울산시설공단에서 보유하고 있는 친환경 차량에 대한 데이터를 다양한 항목별로 상세하게 제공합니다. 이 데이터는 공단 소속 각 부서에서 운용 중인 친환경 차량의 정보를 포함하고 있으며, 주요 항목으로는 차량을 관리하는 부서명, 차량의 고유 식별번호인 차량번호, 차량명, 차량 구분, 차량이 등록된 날짜인 등록 일자, 최대적재량, 배기량, 승차 가능 인원수, 기어변속 방식, 사용 연료 종류, 기준일자가 포함되어 있습니다. 이 정보는 울산시설공단의 친환경 정책 추진 현황과 차량 운영의 투명성을 높이는 데 기여하며, 공공부문의 지속 가능한 교통수단 도입과 관련된 실질적인 통계 자료로 활용될 수 있습니다.
