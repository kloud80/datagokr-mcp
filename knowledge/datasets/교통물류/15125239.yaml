summary_user: 경기도 오산시에서 이루어진 주정차 위반 단속을 단속 일시·장소·방법 단위로 담은 시군구 범위의 파일 데이터이며, 집계년도와 관리기관명, 데이터기준일자가 함께 들어 있다. 시민이나 분석가가 "오산시에서 주정차 단속이 자주 이뤄지는 장소와 시간대는 어디인가"를 확인하거나, 단속 정책을 세울 때 단속 실적을 보는 데 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없으므로, 단속장소 이름이나 시군명을 매칭하거나 같은 기관 자료끼리 이어 써야 한다.
limits: 전역 조인 키나 좌표·법정동 코드가 없어 다른 지역 자료나 공간 자료와 바로 결합할 수 없고, 장소 문자열을 따로 매칭해야 한다. 범위는 오산시 한 곳이라 시군 간 비교에는 다른 시군 파일이 필요하다.
