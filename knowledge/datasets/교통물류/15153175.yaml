summary_user: 한국건설기술연구원이 제공하는 상시 교통량 조사지점의 기준정보로, 조사연도·도로등급·노선번호와 노선명·구간명·지점 주소·차로수 등을 지점 단위로 담으며 범위는 전국이다. 도로 분석가나 교통안전 담당자가 특정 노선·구간에 상시 조사지점이 어디에 있고 몇 차로인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 노선번호(RTE)·노선명·지점 ID 같은 이름·코드 매칭으로 같은 기관의 상시지점 교통량 자료 등과 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 상시지점통계기준 정보입니다.\""
