description_portal: '경상북도 경산시의 전기차 충전소 현황은 운영기관, 충전소명, 충전기 타입, 주소, 이용 가능 시간 등의 정보를 포함하고 있으며, 전기차 이용자들이 충전소를 효율적으로 이용할 수 있도록 돕는 데 목적이 있습니다.이 데이터는 주로 각 충전소의 고정 정보(예: 위치, 설치 유형, 제공 용량 등)를 담고 있으며, 충전기 상태나 실시간 이용 가능 여부 등은 포함되어 있지 않습니다.보다 정확하고 실시간 정보(예: 현재 충전기 사용 가능 여부, 실시간 충전 상태, 위치 등)가 필요할 경우, **환경부에서 운영하는 "무공해차 통합누리집(https://ev.or.kr/)"**을 이용하는 것이 좋습니다. 이 사이트에서는 전국 전기차 충전소에 대한 실시간 정보 검색이 가능하며, 지도 기반 위치 조회, 충전기 상세 정보 확인 등의 기능을 제공합니다.또한, 무공해차 통합누리집에서는 충전소 정보를 엑셀(CSV) 파일로 다운로드할 수 있는 기능도 제공하고 있어, 이를 활용하면 보다 다양한 조건에 맞는 충전소 데이터를 가공하거나 분석용으로 사용할 수 있습니다.'
