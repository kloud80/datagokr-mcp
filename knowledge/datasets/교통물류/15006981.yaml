summary_user: 외국 운전면허를 국내 면허로 교환할 수 있는 인정 대상 국가·지역을 권역(지역)과 국가명으로 한 줄씩 정리한 전국 단위 목록 파일로, 1,928바이트 규모의 작은 CSV입니다. 국내에 거주하는 외국인이나 해외 면허 소지 귀국자가 자기 나라 면허를 국내 면허로 바꿀 수 있는지 확인하거나, 민원 담당자가 교환 안내 기준을 정비할 때 쓴다. 실측 컬럼에 전역 조인 키나 국가코드가 없어, 영문면허 인정국가·재외공관 안내 같은 다른 목록과는 국가명 문자열을 맞춰서만 이어 쓴다.
description_portal: 본 데이터는 한국도로교통공단이 제공하는 국내 운전면허 인정 대상 국가·지역 목록이다. 경찰청 고시와 상호인정 협정·약정에 근거하여 외국 면허의 국내 교환 가능 대상을 권역과 국가명으로 정리하였다. 주요 필드는 지역, 국가명이며 개인정보는 포함하지 않는다. 본 목록은 외국면허 교환 안내와 민원 응대 기준 정비의 근거로 활용한다. 아포스티유 또는 영사확인, 번역문 등 증빙 요구는 관할 안내와 함께 확인해야 하며, 상호인정 여부에 따라 시험 면제 범위가 달라질 수 있다. 영문면허 인정국가·재외공관 안내 등과 결합하면 국가별 조치 구분, 권역별 수요 예측, 국제협력 현황 분석에 유용하다.
