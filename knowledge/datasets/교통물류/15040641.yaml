summary_user: 수원시 안의 공영차고지를 차고지 한 곳당 한 행으로 담은 파일 데이터로, 시설명·도로명/지번 주소·위도·경도·주차면 수·토지 면적·관리기관과 연락처를 담는다. 교통 분석가나 시 담당자가 '버스 노선과 차고지 사이의 공차 운행 거리가 얼마나 되는가', '주거지와 가까운 차고지는 어디인가'를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 차고지명으로 맞춰 붙여야 하고, 같은 항목은 전국 표준데이터셋 '버스차고지현황'에서도 확인한다.
description_portal: 경기도 수원시에 위치한 공영차고지의 시설명, 도로명 주소, 위도, 경도를 나타낸 데이터입니다. 또한 주차가능한 수와 차고지 면적을 포함하였으며, 관리기관명과 연락처도 있습니다.  공영차고지 위치 데이터는 다양한 행정, 교통, 환경, 도시계획 분야에서 유용하게 활용할 수 있습니다. 차고지와 노선의 거리 및 동선을 분석하여 공차 운행 시간을 줄이거나, 수요 대비 차고지 위치가 너무 멀면 재배치 제안을 할 수 있는 등 대중교통 효율성 분석 및 개선을 할 수 있습니다. 또한 주변 주거지와의 거리 분석을 통해 환경 민원을 사전에 예방할 수 있고, 차고지 주변 교통량 데이터와 연계하여 출퇴근 시간의 혼잡 영향에 활용할 수 있습니다.** 공공데이터 제공표준 제20차 제·개정에 따라 표준데이터셋 버스차고지현황에서 확인할 수 있습니다. https://www.data.go.kr/data/15155697/standard.do
