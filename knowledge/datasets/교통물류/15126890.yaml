description_portal: 본 데이터는 강남구도시관리공단 공영주차장 내 설치된 전기자동차 충전시설 설치 현황을 정리하여 제공합니다.공영주차장을 이용하는 국민들의 전기차 충전 가능 여부를 쉽게 확인할 수 있도록 하고, 강남구 내 공영주차장의 전기차 인프라 현황을 파악할 수 있는 기초자료로 활용됩니다.데이터에는 노상·노외·부설 공영주차장 구분, 주차장명, 실내·실외, 의무설치대수, 설치수량, 설치위치가 제공되며 사용자에게 필요한 정보가 포함되어 있어 이용 편의성을 높여줍니다.이를 통해 공영주차장을 이용하는 누구나 가까운 충전시설을 빠르게 찾을 수 있으며, 민간 서비스 제공(지도 서비스 등)을 원하는 분에게도 중요한 참고자료로 활용될 수 있습니다.
