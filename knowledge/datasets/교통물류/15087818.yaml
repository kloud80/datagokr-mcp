description_portal: 본 데이터는 한국도로교통공단이 시행하는 교통안전 사회교육의 운영 성과를 정리한 실적 정보이다. 항목은 연도, 교육유형(어린이·청소년·고령자·사업용운전자·기관·기업 등), 교육일시, 지역·교육장, 참여인원, 이수인원, 이수율로 구성한다. 참여인원은 실제 참석 인원, 이수인원은 수료 기준 충족 인원을 뜻하며, 이수율은 이수인원/참여인원×100으로 산출한다. 값은 대상군·지역·기간별 비교가 가능하도록 정형화하였다. 이용자는 수요 추세와 지역 편차를 파악하고, 프로그램 효과 평가, 취약계층 맞춤 설계, 교육장 운영 개선의 근거로 활용할 수 있다.
