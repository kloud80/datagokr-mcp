summary_user: 전국 노드링크(도로 구간) 단위로 연간 일평균 택시 통행량을 담은 집계 파일 데이터로, 법인·개인택시를 모두 포함하며 524,653행 규모다. 분석가나 입지 담당자가 특정 도로 구간에 택시가 하루 평균 얼마나 지나가는지 파악하는 질문에 쓴다. 지역·링크아이디·도로명 필드가 있으나 전역 조인 키는 확인되지 않아, 다른 데이터와는 이름·코드 매핑이나 같은 기관의 코드로만 잇는다.
