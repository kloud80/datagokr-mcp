summary_user: 2024년 환경부 전기차 충전기의 충전건별 충전량 원본(약 630만 건)을 바탕으로 만든 합성(가상) 데이터로, 충전소·충전기별 충전 시작·종료일시, 총충전시간, 총충전량, 충전기 유형·용량을 건 단위로 담는다. 분석가나 AI 개발자가 실제 개인정보 없이 '급속·완속 충전기별 충전량 분포는 어떤 모양인가' 같은 모델 학습·테스트용 질문에 쓴다. 전역 조인 키는 없고, 충전소아이디(chrsId)·충전기아이디(chrgrId)나 지역명·시군구명, 주소를 매개로 같은 기관의 충전소 정보 데이터와 이름·코드 매칭으로 연결한다.
limits: 실측값이 아닌 합성데이터이므로 실제 충전소 이용 실적 집계나 특정 충전소 운영 판단에 그대로 쓰면 안 된다. 원본에서도 충전시간과 충전량은 비례하지 않는다. 다른 데이터와 묶을 공통 키가 없어 이름·코드 매핑이 필요하다.
