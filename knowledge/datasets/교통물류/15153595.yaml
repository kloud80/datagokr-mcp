description_portal: '1. 전기차는 고전압 배터리에서 전기에너지를 전기모터로 공급하여 구동력을 발생시키는 차량으로 화석연료를 전혀 사용하지 않는 무공해차량입니다. 전기차의 배터리를 충전할 수 있도록 전기를 공급하는 충전소 및 충전기는 공공기관/민간기업 에서 설치 운영하고 있습니다.이 API는 2024년의 환경부 전기차 충전소 충전기에서 전기차별로 충전한 충전량 데이터를 기반으로 AI학습 테스트용으로 생성한 합성데이터(가상데이터) 조회서비스 입니다.2. 합성데이터 설명- 원본데이터 이용기간 및 건수: 2024년, 약 630만건- 원본데이터 특성 : 충전건별 충전량데이터, 범주형 및 수치형 데이터로 구성, 충전시간과 충전량이 비례하지 않음- 합성데이터 특성 : 범주형 및 수치형 데이터 생성, 충전시작 및 종료일시 조건에 따른 충전시간 및 충전량 생성- 합성데이터 활용 : 실제 측정 데이터의 구조와 통계적 특성을 반영하되 민감정보를 포함하지 않아 AI학습 테스트 데이터로 활용 가능'
