summary_user: 광주 광산구의 불법주정차 단속을 한 건씩 기록한 원천 자료로, 차종·단속일시·단속동·단속장소·단속구분·과태료 원금(단속원금)·위반법규·특별지역 여부를 담는다(CSV 약 19MB, 시군구 범위). 광산구에서 어느 동·장소·시간대에 단속이 몰리는지, 특별지역 단속 비중이 어떤지를 보려는 주민·분석가·교통 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속동·단속장소 같은 이름 매핑이나 같은 기관 코드로만 연결된다.
description_portal: 광주광역시 광산구에서 수집한 불법주정차 단속자료에 대한데이터로 차종, 단속일시, 단속장소, 단속구분, 단속원금, 위반법규, 단속특별지역 등의 정보를 제공합니다. 이 자료는 차량의 차종부터 단속이 이루어진 일시와 장소, 단속 구분에 이르기까지 다양한 세부 항목을 포함하고 있습니다. 또한 단속과 관련된 금액, 위반 법규 내용, 그리고 단속이 진행된 특별지역 여부 등도 함께 기록되어 있어 단속 현황을 종합적으로 파악할 수 있습니다. 이러한 데이터는 불법주정차 문제를 효과적으로 관리하고, 도시 교통 질서를 유지하는 데 중요한 역할을 합니다. 광산구 내 교통 안전과 원활한 차량 흐름을 위해 단속 실태를 분석하는 데 활용되며, 시민들에게는 주차 관련 법규 준수에 대한 인식 제고에도 도움을 줍니다.(파일데이터에서 표준데이터셋으로 관리이관됨에 따라 해당 파일데이터 데이터기준일자 이후의 관련자료의 경우 표준데이터셋을 통해 데이터를 활용하시기 바라며 이에 따라 이 파일데이터의 업데이트 주기는 1회성 데이터로 변경되었음을 안내드립니다.)
