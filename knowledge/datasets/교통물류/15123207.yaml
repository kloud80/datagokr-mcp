summary_user: 경기도 교통취약지역을 운행하는 공영버스 운영결손금 지원 현황을 시군별 집계로 담으며, 컬럼은 시군명(sigun_nm)과 업체 수·운행 대수·노선 수로 보이는 값으로 구성된다. 지자체 교통 담당자나 분석가가 '어느 시군에서 공영버스 업체·차량·노선이 얼마나 운영되는가'를 비교해 농촌·외곽 지역의 교통 격차를 살펴보는 데 쓴다. 전역 조인 키는 없어서, 다른 버스 노선·인구·재정 데이터와는 시군명을 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 교통취약지역에 운행 중인 공영버스에 대한 운영결손금 지원 현황을 보여주는 자료입니다. 공영버스는 수익성보다는 공공성을 중시하여 지역 간 교통서비스의 격차를 해소하고, 주민 이동권 보장을 위해 운행되는 교통수단으로, 일반 민간버스가 기피하는 농촌 및 외곽지역 등에서 주로 운행됩니다.교통취약지역을 운행하는 공영버스에 대한 재정지원을 통하여 지역 간 교통서비스 격차를 해소합니다.지원 예산 및 시군별 지원예산 배분 현황 등 상세 내용은 경기도 사전정보공표 [공영버스 지원현황]을 참고해주시기 바랍니다.※ 공영버스 지원현황 : https://www.gg.go.kr/opendata/openDataBoard.do?decIdx=5099'
