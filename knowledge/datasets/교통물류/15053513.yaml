description_portal: 이 데이터는 충청남도 서산시에서 운용 중인 건설기계 통계를 정리한 공공자료이다. 항목은 건설기계명, 합계, 관용, 자가용, 영업용, 데이터 기준일자로 구성되며, 건설기계의 유형별 등록 현황을 파악하는 데 활용된다. 건설기계명은 굴착기, 지게차, 덤프트럭 등 장비 종류이며, 합계는 전체 등록 대수를 나타낸다. 관용은 공공기관 보유 장비, 자가용은 개인 또는 업체가 자체 사용을 위해 등록한 장비, 영업용은 상업 목적의 장비를 의미한다. 기준일자는 데이터 집계 시점을 뜻한다. 본 자료는 장비 등록관리, 건설업 분석, 정책 자료 제공, 행정계획 수립 등 다양한 분야에서 활용된다.
