description_portal: '데이터 개요국토교통부_항공고시보 검색 데이터는 국내 및 국제 항공고시보(NOTAM, Notice to Air Missions)를 실시간으로 검색하고, 다운로드 및 지도 기반으로 조회할 수 있는 공공데이터입니다. 항공기의 안전운항을 위해 필요한 항행안전시설, 공역, 공항 운용 상태 등에 대한 정보를 포함하고 있으며, 비행 전 운항계획 수립과 항공관제 업무에 필수적으로 활용됩니다.데이터 제공 항목issue time고시보 발행 시각 (UTC 기준)Fir관할 비행정보구역(FIR: Flight Information Region)Location적용 공항 또는 관련 공역 코드 (예: RKSM, RKTY 등)QcodeNOTAM 유형을 나타내는 코드 (예: QCTAS, QCPAS 등)Notam#고시보 고유 식별번호 (예: C0806/25)Start Date UTC고시 유효 시작 시각 (UTC 기준)End Date UTC고시 유효 종료 시각 (UTC 기준)Full Text고시 내용 전문 (ICAO 형식의 전문 메시지 포함)데이터 해석 시 유의사항ICAO 표준 형식 제공 : 고시 전문은 국제민간항공기구(ICAO)의 NOTAM 형식에 따라 제공되어, 항공 실무자 및 항공사, 관제기관에서 국제적으로 통용 가능.UTC 시간 기준  : 모든 시간 정보는 협정세계시(UTC)로 제공되므로 현지 시각과 비교 시 주의 필요.다양한 조건 검색  : FIR, 공항코드, Q코드, 날짜 범위, 키워드 등으로 필터링 가능하며, 특정 공항이나 공역에 대한 고시 현황을 빠르게 파악 가능.지도 연동 기능 : 발행된 항공고시보의 위치와 범위를 지도상에서 확인할 수 있는 시각화 서비스 지원.운항안전 및 계획 수립 활용 : 비행 제한 구역, 활주로 정비, 항행시설 고장 등으로 인한 영향 범위를 조기에 파악하여 안전 운항 계획에 활용 가능'
