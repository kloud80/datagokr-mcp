summary_user: 서울특별시 성동구에서 적발된 불법주정차 단속을 건별로 단속일·단속시간·단속장소와 함께 담은 원천 기록이며, 포털에서 약 18MB 크기의 CSV 파일로 받는다. 구민이나 교통 분석가가 '성동구에서 어느 거리, 어느 시간대에 불법주정차 단속이 몰리는가'를 따져 집중구역과 단속 패턴을 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 단속장소 문자열을 주소·지명으로 매핑하거나 같은 성동구 자료끼리 이어 써야 한다.
