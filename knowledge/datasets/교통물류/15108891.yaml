summary_user: 경기도 의왕시 안의 신호등을 한 기마다 한 행으로 담은 원천 목록이며, 보행안전지수 지도 시각화를 위한 중간 데이터로 2022년 기준 1회 수집했다. 각 행에는 위치 좌표(위도·경도), 도로구간번호, 신호등 종류·규격·수, 잔여시간표시기·음향신호기 유무, 설치일자가 들어 있다. 보행 안전을 분석하는 사람이 '의왕시에서 음향신호기나 잔여시간표시기가 없는 신호등은 어느 구간에 몰려 있나'를 지도로 확인하는 데 쓴다. 전국 단위로 통하는 공통 조인 키는 없어서, 행정읍면동코드나 도로구간번호, 좌표를 기준으로 같은 의왕시의 다른 공간 데이터와 맞춰 이어 쓴다.
description_portal: 해당 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 도로구간별 신호등 설치 현황을 공간 위치 기반으로 정리한 정보입니다. 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분 등의 속성과 TM 중부 GRS80 기준 위도·경도 좌표가 포함되어 있으며, 보행자용 및 차량용 신호기 설치 여부 등의 세부 정보도 함께 제공합니다. 신호등은 교차로 및 횡단보도에서 차량과 보행자의 통행을 제어하는 대표적인 안전 시설로, 신호기 분포를 통해 교통사고 예방 체계와 보행안전 수준을 분석할 수 있습니다. 2022년 기준 1회성 수집된 정보로, 변화 추적보다는 시각화 및 정책 참고용으로 활용하는 것이 적합합니다.
