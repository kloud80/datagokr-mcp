summary_user: 경기도 양주시 도로변에 설치된 노변기지국(차량·교통시설과 무선으로 정보를 주고받는 장치)의 식별자, 이름, 경도·위도를 기지국 한 곳당 한 행으로 담은 위치 목록이며, 원본 CSV는 약 2KB 크기의 소규모 파일입니다. ITS·V2X 서비스 사업자나 교통 분석가가 '양주시 어느 도로 구간에 노변기지국이 설치돼 있나'를 지도에서 확인할 때 씁니다. 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 연결하려면 좌표로 공간 매칭을 하거나 양주시 다른 교통 데이터와 기지국 이름을 직접 맞춰야 합니다.
limits: 기지국 위치만 담고 있어 통신으로 수집한 교통량이나 소통 정보는 들어 있지 않습니다. 범위는 양주시 한 곳에 그치고, 다른 데이터와 맞출 공통 코드가 없습니다.
