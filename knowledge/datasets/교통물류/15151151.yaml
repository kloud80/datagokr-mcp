description_portal: 이 데이터는 도시 도로망 내 교통정보 수집 및 통신 인프라 관리에 활용되는 노변기지국(Roadside Base Station) 의 위치 정보를 제공하는 자료입니다. 노변기지국이란 도로 인근에 설치된 무선통신 장치로, 차량과 교통 인프라(신호등, 센서, 관제센터 등) 간의정보를 주고받는 역할을 합니다.해당정보는 노변기지국 식별자, 노변기지국명, 경도, 위도를 포함하고있고, 해당 정보는  차량·교통 센서와의 실시간 통신, 교통 흐름 모니터링, 스마트 신호제어, 자율주행차 통신(V2X) 등 지능형 교통체계(ITS) 구현에 필수적인 기초 데이터로 활용됩니다.도시 교통 효율성 제고, 교통 혼잡 완화, 안전한 자율주행 환경 조성 등을 위한 기반자료로 공공 및 민간 교통서비스에서 다양하게 사용될 수 있습니다.
