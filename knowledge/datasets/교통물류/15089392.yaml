summary_user: 인천광역시에 2021~2025년 설치된 스마트 횡단보도 장치(음성안내 보조장치, 바닥형 보행신호등, 보행신호 자동연장시스템, 적색잔여시간표시기)를 설치 지점 한 곳씩 담은 위치 목록으로, 군·구, 설치 위치, 교차로명, 설치년도, 운영기관, 위경도를 포함한다. 보행 안전을 살피는 시민·연구자가 '우리 동네 어느 교차로에 바닥형 신호등이나 잔여시간표시기가 있나', '군·구별로 설치가 고르게 됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 위경도로 다른 공간 데이터(보호구역·단속카메라·사고 지점 등)와 겹쳐 보거나 군·구명과 교차로명을 이름으로 맞춰 연결한다.
limits: 표준 코드가 없어 다른 데이터와 붙일 때 군·구명·교차로명 같은 이름 매핑이나 좌표 근접 매칭에 기대야 한다. 범위는 인천광역시에 한정되고 설명상 2021~2025년 설치분만 담는다.
