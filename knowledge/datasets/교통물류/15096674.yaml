summary_user: 제주특별자치도 내 택시 교통사고를 기준 연월과 용도(대분류·소분류)별로 사고 건수, 부상자 수, 사망자 수로 집계한 통계 데이터로, 포털 설명상 2005년부터 2019년까지를 담는다. 교통안전 담당자나 분석가가 '제주 택시 사고와 사상자가 해마다 늘었나 줄었나'를 확인하거나 운전자 교육·규제 필요성을 진단할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 교통사고·택시 등록 통계와는 연월과 용도 분류 이름을 맞춰서만 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도가 공개한 ‘택시 교통사고 현황’ 통계자료로, 2005년부터 2019년까지 제주 지역 내에서 발생한 택시 사고의 연도별 사고 건수, 부상자 수, 사망자 수를 체계적으로 집계하여 제공한다. 자료 형식은 CSV이며, 사고 유형이 택시로 제한된 만큼 도내 택시 운행의 안전 실태를 집중 분석할 수 있는 중요한 기초 데이터이다. 이 정보는 교통안전 정책 수립, 택시 운송체계 관리, 위험구간 또는 사고다발 노선 파악, 보험 및 보상 체계 점검, 응급 구조 및 의료 인프라 배치, 택시업계 규제 및 운전자 교육 필요성 진단 등 다양한 사회적·행정적 목적으로 활용될 수 있다. 특히 택시이동이 많은 관광지 및 출퇴근 경로 중심으로 사고 분포를 GIS 기반으로 시각화하면, 교통약자 안전 대책 및 도시교통 계획 수립에 실질적인 근거자료로 사용하기에 적합하다.
