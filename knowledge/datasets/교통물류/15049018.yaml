description_portal: '데이터 개요「연도별전세계항공사고발생현황」 데이터는 전 세계에서 발생한 항공사고 정보를 연도 및 사고일자 기준으로 정리한 항공안전 통계자료입니다. 사고 발생 시점, 항공사, 항공기 기종, 비행단계, 탑승자 및 사망자 수, 사고 개요 등을 포함하며, 항공안전 분석, 정책 수립, 국제 비교, 교육자료로 폭넓게 활용할 수 있습니다.데이터 제공 항목순번고유 식별 번호일자사고 발생일 (YYYY-MM-DD)항공사사고 항공기의 소속 항공사명기종사고 항공기의 기종 (예: Boeing 737-800 등)비행단계사고 발생 시 비행 상태 (이륙(TKI), 순항(ENR), 착륙(LDG) 등)탑승항공기에 탑승한 총 인원 수사망사고로 인한 사망자 수사고 개요사고의 원인, 경위, 위치 등 설명활용 안내국제 항공사고 통계 비교 및 추이 분석항공사 및 기종별 사고 경향 파악비행단계별 위험도 평가 및 대응 전략 수립항공안전교육 사례 자료 구축 및 교육 콘텐츠 활용ICAO, IATA 기준의 안전성과 정책수립 자료 기반 활용데이터 해석 시 유의사항동일 일자에 발생한 다중 항공기 간 충돌 사고는 각 항공기 기준으로 별도 기록됩니다.일부 사고는 사고 조사 진행 중일 수 있으며, 정보가 추후 수정될 수 있습니다.비행단계는 국제표준(ICAO Annex 13) 기반 약어로 제공됩니다 :TKI: Take-off,,ENR: En Route (순항 중), LDG: Landing, TXI: Taxiing, APR: Approach데이터 구성 예시순번일자항공사기종비행단계탑승사망사고 개요12024-01-02Japan AirlinesAirbus A350-941LDG3790Tokyo-Haneda 공항 활주로에서 해양경비대 항공기와 충돌, 인명피해 없음22024-01-02Japan Coast GuardDHC-8-315Q MPATXI65활주로 충돌로 기장 1명 부상, 승무원 5명 사망'
