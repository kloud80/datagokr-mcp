summary_user: 사이버검사소에 등록된 타이어 형식별로 장착 위치와 허용하중을 담은 전국 단위 목록 파일(CSV, 약 74KB)이다. 빌드업 튜닝 등으로 차량 전·후방 무게 분포가 바뀔 때 어떤 규격의 타이어가 늘어난 하중을 견디는지, 구조변경검사를 통과할 수 있는지 판단하는 데 쓴다. 전역 조인 키가 없어 다른 차량·검사 데이터와는 타이어 형식명을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단 사이버검사소에 등록된 차량 형식별 타이어 허용하중 정보는, 차량의 구조나 적재 상태에 따라 어떤 규격의 타이어를 선택해야 하는지를 판단하는데 매우 유용한 자료입니다. 특히 빌드업 튜닝을 수행할 경우, 차량 전·후방의 무게 분포 변화에 따라 적정 타이어를 선정해야 안전성과 주행 안정성을 확보할 수 있는데, 본 데이터는 이러한 튜닝 과정에서 타이어 규격 적용 기준을 판한할 수 있는 기초자료로 활용될 수 있습니다. 형식별 허용하중 정보를 기반으로 차량에 적합한 타이어를 선택함으로써, 구조변경검사 통과는 물론 안전한 튜닝이 가능해집니다.
