summary_user: 경기도 성남시에 설치된 험프형(고원식) 횡단보도를 한 곳씩 담은 개별 목록으로, 설치장소·도로명/지번 주소·설치연도·관리기관 전화번호·데이터기준일을 담는다(CSV 약 9KB). 우리 동네 통학로나 이면도로에 고원식 횡단보도가 언제 어디에 설치됐는지 확인하거나, 연도별 설치 추이를 보려는 주민·분석가가 쓴다. 전역 조인 키나 좌표 필드는 없어서 다른 데이터와는 주소를 지오코딩하거나 이름·주소를 맞춰서 이어야 하며, 어린이보호구역·단속카메라 표준데이터와 겹쳐 볼 때도 같은 방식으로 연결한다.
description_portal: 경기도 성남시 험프형 횡단보도 설치현황에 관한 데이터로 연번, 설치장소, 설치주소, 설치연도, 관리기관 전화번호, 데이터기준일 등의 항목을 제공합니다. 성남시는 교통사고 예방과 보행자 안전 강화를 위해 초등학교 주변, 어린이보호구역, 이면도로 등에 험프형(고원식) 횡단보도를 설치해오고 있다. 험프형 횡단보도는 노면을 높여 차량의 속도를 자연스럽게 저감시키는 효과가 있으며, 보행자의 시인성을 높이는 동시에 통행 안전을 확보하는 데 목적이 있습니다. 매년 보행자 교통사고 다발지점과 민원이 접수된 구간을 중심으로 우선 설치가 이루어졌으며, 초등학교 앞 통학로와 시장 주변, 생활권 보행축 등을 중심으로 확대 중에 있습니다.
