summary_user: 서울교통공사 관할 1~8호선 역별로 하루(당일 04시~익일 03시 59분) 승차·하차 인원을 권종과 승객유형별로 나누어 04시부터 03시까지 시간대별로 집계한 파일 데이터를 담는다. 상권 분석가나 창업자가 '특정 역 주변의 평일 출근 시간대와 저녁 시간대 유동인구가 어떻게 다른가'를 볼 때 유동인구 대체 지표로 쓴다. 실측 컬럼에 역코드 같은 전역 조인 키가 없어 역명·호선 이름을 매핑해야 다른 역 위치·시설 데이터나 같은 기관의 다른 통계와 이을 수 있다.
description_portal: '서울교통공사의 1-8호선 일별 통행 통계 데이터 입니다. 연단위로 데이터가 업로드 되며, 데이터는 연번, 업무일자, 호선, 역명, 승하차구분, 권종, 승객유형, 시간대별 수송인원수 데이터로 구성되어 있습니다.(2025년 1월 ~ 2025년 6월 데이터 입니다.)역명: 1~8호선 서울교통공사 관할역사 구간업무일자: 당일 04시00분00초 ~ 익일 03시59분59초 기준승하차구분: 승차, 하차권종: 선불카드, 후불카드, 1회용교통카드, 정기권카드 등 승객유형: 일반, 우대권, 어린이, 청소년, 외국인, 중고생 등'
