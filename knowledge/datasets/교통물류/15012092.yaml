summary_user: 서울특별시 동대문구가 관리하는 가로등을 도로 노선별로 묶어 가로등주 수, 차도등 수, 보행등 수를 담은 집계 파일로, 포털 설명상 시도 18개 노선과 구도 41개 노선을 다룬다. 동대문구 안에서 어느 도로에 보행등이나 차도등이 많고 적은지 비교하려는 주민·연구자·조명 시설 담당자가 노선별 야간 조명 시설 규모를 확인하는 데 쓴다. 전역 조인 키가 없어 도로명·주소 같은 이름으로 맞추거나 같은 기관의 다른 도로 시설물 자료와 나란히 놓고 써야 한다.
description_portal: 이 데이터는 서울특별시 동대문구가 관리하는 가로등 현황에 대한 정보를 제공하며, 시도 18개 노선과 구도 41개 노선에 대한 가로등 수량 정보를 제공합니다. 데이터는 각 노선별 가로등주의 개수, 차도등의 개수, 보행등의 개수로 이루어져 있습니다. 가로등주는 가로등을 위해 설치된 등주이며, 차도등은 차량 통행을 위해 차도를 비추는 등, 보행등은 보행자 통행를 위해 보도를 비추는 등을 의미합니다. 단, 서울시설공단 또는 성동도로사업소에서 관리하는 가로등에 관한 정보는 포함되어 있지 않습니다.
