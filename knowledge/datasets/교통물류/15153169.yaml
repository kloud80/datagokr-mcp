summary_user: 강원특별자치도 동해시의 불법주정차 신고를 건별로 담은 원천 파일로, 신고일시·지번주소·경도·위도와 과태료 부과 여부를 기록하며 범위는 동해시 한 곳이고 위치는 개별 주소·좌표 단위다. 동해시 교통 담당자나 분석가가 '어느 지역·시간대에 신고가 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가'를 따져 집중 단속 구역을 정하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 지번주소나 위도·경도로 위치를 맞춰 잇고, 무인교통단속카메라·어린이보호구역 표준데이터와 좌표로 겹쳐 보는 방식으로 쓴다.
description_portal: '불법주정차 신고 및 과태료 부과 현황 공공데이터는 교통질서 개선, 안전한 도로환경 조성, 정책 의사결정 지원 등 다양한 분야에서 활용됩니다. • 교통질서 개선 : 단속일시·장소 데이터를 활용해 시간대별·지역별 위반 패턴을 분석하고, 집중 단속이 필요한 구역을 도출할 수 있습니다 • 안전한 도로환경 조성 : 횡단보도, 어린이보호구역, 버스정류소 등 보행자 안전 취약지역의 위반 현황을 파악하여 교통사고 예방 정책에 반영할 수 있습니다 • 정책 의사결정 지원연도별 과태료 부과 추이를 분석하여 교통행정 정책 수립 및 예산 배분에 활용할 수 있습니다'
