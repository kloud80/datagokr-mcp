summary_user: 인천국제공항의 운항마감 정보를 운항편 단위로 담으며, 도착·출발 구분, 스케줄 일자·시간, 국내·국제와 정기·부정기 구분, 지연·결항·회항 여부, 기체 용도, 게이트·스팟 번호가 들어 있다. 항공 분석가나 공항 이용 관련 사업자가 '이번 달 인천공항 국제선 출발편 중 지연·결항된 편은 몇 편이고 어느 게이트에 몰렸나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 운항정보 데이터와는 운항편 ID(flightNum)·스케줄 일자 같은 이름·코드 매칭으로만 연결한다.
description_portal: '인천국제공항 항공통계정보 중 운항마감 정보에 관한 데이터입니다. 여객/화물구분,스케줄 일자,도착/출발 구분,운항편 ID, 상태ID(0:정상,1:회항(Return)1,2:Return1에 의한 도착,3:회항(Divert),4:회항(Return),5: Return2에 의한 도착1, 6:회항(Return)3,7:Return3에 의한 도착1, 스케줄시간,연월,국내/국제구분, 정기/비정기구분,지연여부(0:정상,1:지연,2:결항,3:회항),용도(0:여객기,1:화물기,2:군용기,3:자가용,8:특별기,9:기타),Gate번호,Spot 번호 등의 정보를 제공합니다. 조회 당월/당일의 데이터를 제공하고 있습니다. 개발계정 일 10000 트래픽, 운영계정 신청 시 일 1000000 트래픽을 제공합니다.'
