description_portal: 서울특별시 서초구 개인형이동장치(공유형 전동킥보드)주차구역 위치 및 설치 현황 정보를 포함하고 있습니다.제공하고 있는 개인형이동장치 주차구역 안내 자료에는 각각의 구역에 해당하는 도로명 주소와 지번주소가 체계적으로 정리되어 있습니다. 도로명 주소란 거리와 건물 번호로 이루어진 공식적인 위치 표기 방식이고, 지번주소는 토지 대장상의 번호를 활용한 주소 체계입니다. 이 두 가지 정보를 함께 제공함으로써, 개인형이동장치 사용자들이 더욱 쉽고 정확하게 원하는 주차구역을 찾을 수 있도록 돕고 있습니다.상세위치 항목을 통해 개인형이동자치 주차구역 시설의 구체적인 위치 정보를 쉽게 확인할 수 있습니다.지하철역 몇번출구로 표시함으로써, 주요 지하철역 및 해당 출구 번호를 통해서 쉽게 주차구역 확인이 가능합니다.대중교통을 이용하는 분들이 대중교통에서 개인형이동장치를 이용하여 보다 쉽고, 보다 빠르게 목적지를 갈 수 있도록 안내하고 있습니다.그리고, 반대로 목적지에서 버스나 지하철같은 대중교통 이용시에 보다 편리하게 주차구역에 개인형이동장치를 주차하고 대중교통을 이용할 수 있을것 입니다.
