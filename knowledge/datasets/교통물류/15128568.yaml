description_portal: 남산 혼잡통행료 차종별 통행데이터는 남산 1·3호 터널의 통행량을 차종별로 분류하여 제공합니다.데이터를 통해 남산 1·3호 터널의 통행량 현황과 차종(일반 승용차, 승합차, 버스, 화물, 택시 등)별 통행량 추이를 파악하고 활용하실 수 있습니다.※ 제공하는 정보- 연간 남산 1·3호 터널 통행량 및 차종별 통행량* 토, 일, 공휴일 등 무료 통행일은 제외되었으며 2024년 1월 15일부터는 징수 정책 변화(양방향 징수 → 단방향 징수)로 도심 방향의 통행량 데이터만 제공합니다.* 통행료 징수시스템 장비 점검 및 테스트의 영향으로 일부 데이터가 비정상적일 수 있습니다.
