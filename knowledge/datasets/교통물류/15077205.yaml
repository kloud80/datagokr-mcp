description_portal: 이 자료는 대전광역시에 등록된 영업용 화물자동차를 대상으로 유가보조금 지급 현황과 과징금 징수 현황을 정리한 자료입니다. 유가보조금은 화물자동차 운수업계의 유류비 부담 경감을 위해 지급되며, 지급액과 지급대수 등 구체적인 수치가 포함되어 있습니다. 자료에서 과징금 항목에는 법령 위반 등으로 인해 부과된 과징금의 징수액과 징수건수가 기록됩니다. 또한, 지급 및 징수 내역이 명확히 구분되어 있어, 화물자동차 운송업계의 재정 지원과 규제 집행 현황을 종합적으로 파악할 수 있습니다.
