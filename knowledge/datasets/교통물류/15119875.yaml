description_portal: 본 데이터는 부산교통공사 도시철도 역사에 설치된 엘리베이터의 위치 및 운행구간 정보를 정리한 자료입니다.호선, 역명, 출입구 번호, 상세위치, 운행 층간 정보가 포함되어 있으며, 역사 내부 및 외부에서 이동 동선 확보와 교통약자 편의 확보를 위한 기반시설 현황을 확인할 수 있습니다. 해당 데이터는 교통약자 접근성 향상, 유니버설디자인 기반 공간 설계, 출입구 및 환승 통로 개선, 비상 시 대피 계획 수립 등 다양한 행정 및 기술적 목적에 활용될 수 있습니다. 또한 이용자 중심의 역사 안내 정보 구축, 시설물 유지관리 계획 수립, 공간 활용도 분석 등에도 유의미한 자료로 활용될 수 있는 교통약자 편의시설 관련 공공데이터입니다.* 엘리베이터 근처에 출입구가 없는 경우에는 "출입구번호"항목을 공란으로 표기합니다.
