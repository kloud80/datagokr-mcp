summary_user: 부산 도시철도 역사에 설치된 엘리베이터를 한 대씩 담은 원천 목록으로, 호선·역명·인접 출입구 번호·상세위치와 운행하는 시작층·종료층을 담는다(파일 약 38KB csv). 휠체어 이용자나 유모차 이용객이 '이 역에서 몇 번 출입구 쪽 엘리베이터로 지상에서 승강장까지 갈 수 있나'를 확인하거나, 분석가가 역별 교통약자 접근성을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 역 정보·승하차 데이터와는 호선과 역명을 이름으로 맞추거나 같은 기관(부산교통공사) 자료끼리만 연결한다.
