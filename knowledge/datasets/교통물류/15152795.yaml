description_portal: 경기도 하남시 지능형교통시스템(ITS)에서 수집한 교차로 방향별 소통정보로, 1시간 단위로 각 교차로의 교통량·속도·혼잡도를 정밀하게 집계한 스마트교통 핵심 자료입니다. 노드아이디는 도로망 상 교차점을 식별하는 고유 Node ID이며, DRCT_CD는 동·서·남·북 등 진입 방향별 교통 패턴 분석을 가능하게 합니다. TRF_QNTY와 AVG_SPD는 해당 방향의 실제 흐름 상태를 나타내고, LOS와 V/C 값은 교통혼잡 수준을 판단하는 대표 지표이다. 특히 V/C는 교통량이 용량 대비 어느 정도를 차지하는지 보여주며, 1.0을 초과하면 혼잡 구간으로 분류됩니다. 이러한 ITS 데이터는 신호주기 조정, 우회 추천, 혼잡 완화 등 신호운영 최적화에 활용되며, 교통약자 보호구역·보행자 이동량 분석 등 다양한 스마트시티 교통정책 수립에 중요 역할을 합니다.
