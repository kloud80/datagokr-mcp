description_portal: 본 공공데이터는 대전광역시 중구 관내에 위치한 가도교 현황(시설명, 위치, 시설규모, 연장, 폭, 높이, 년도,  설치목적) 데이터를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 연장, 폭, 높이는 m 단위로 작성되었으며, 년도는 해당 시설의 설치년도를 기재하고 있습니다.데이터 컬럼 중 시설규모는 설치되어 있는 수중펌프 상세내용 및 대수를 기재하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
