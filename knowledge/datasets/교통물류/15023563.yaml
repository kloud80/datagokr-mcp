summary_user: 아산시 관내 버스정류장을 한 곳당 한 행으로 담은 파일로, 정류장 고유번호·정류소명·지번주소·읍면동·시설구분(유개승강장, 표지판 등)을 시군구 범위에서 개별 주소 단위로 담는다. 시민이나 분석가가 '우리 동네 어느 정류장에 비가림 승강장이 있는가'처럼 읍면동별 정류장 위치와 시설 현황을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선·실시간 도착 정보 등과는 정류장 고유번호나 정류소명을 이름 매핑하는 방식으로만 이어 쓴다.
description_portal: '정의: 노선버스가 통행하는 고속국도 및 자동차전용도로, 일반도로에서 노선버스가 승객의 승차, 하차를 위하여 전용으로 이용하는 시설물설치기준: 교통의 안전성, 이용상의 편리성, 경제성을 고려하여 설치해야 함본 데이터는 아산시 관내 버스정류장 정보로서 정류장 고유번호,  정류소명, 정류장이 위치한 지번주소, 정류장 시설구분(유개승강장, 표지판 등) 등이 표시됩니다.'
