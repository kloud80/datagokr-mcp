description_portal: 대전광역시 연간 특수여객자동차 운송사업 현황자료는 2018년부터 2021년까지 대전광역시에 등록된 특수여객자동차 운송사업의 연도별 현황을 체계적으로 정리한 자료입니다. 자료에는 각 사업자의 상호, 설립날짜, 주사무소, 보유 차량 대수 등 주요 정보가 포함되어 있어, 지역 내 특수여객자동차 운송사업의 분포와 사업자별 규모, 연도별 변동 추이를 파악할 수 있습니다. 자료는 운송사업 관리, 행정적 지도·감독, 운송서비스 수급 현황 분석, 신규 사업자 진입 및 사업자 간 비교 등 다양한 행정적·정책적 의사결정에 활용됩니다.본 자료는 2022년 공공데이터 기업매칭지원사업의 일환으로 구축되었습니다
