summary_user: 공단이 운항관리하는 전국 연안여객선의 운항노선을 면허항로·운항항로별로, 기항지 순서와 정방향·역방향 정차 여부까지 기항지 단위 행으로 담는다. 도서 주민이나 여행객이 '이 항로의 배가 어느 섬·항구에 몇 번째로 들르고, 돌아오는 편에도 서는가'를 확인하거나, 앱 개발자가 여객선 노선도를 그리는 데 쓴다. 전역 조인 키는 없어 같은 공단의 운항상태·스케줄·운임 데이터와 항로코드(nvg_seawy_cd)·기항지코드 같은 기관 내부 코드나 항로·기항지 이름으로 맞춰 이어 쓴다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 추가 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로 공단의 운항관리 대상 연안여객선의 운항노선 정보를 포함하고 있습니다. 면허항로코드, 면허항로명, 운항항로코드, 운항항로명, 기항지순번, 기항지코드, 기항지명 등이 포함된 정보 입니다. 여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다."
