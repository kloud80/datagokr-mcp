description_portal: 서울시에서 운영중인 "기후동행카드" 이용자의 연령정보(티머니 홈페이지 등록자에 한함)를 담은 데이터 입니다.기후동행카드는 서울시에서 운영하는 새로운 패러다임의 교통카드로 1회 충전을 통해 30일 동안 지정된 권역 내의 대중교통(버스, 지하철, 따릉이)을 무제한으로 이용할 수 있는 교통카드 입니다.기후동행카드는 일반권과 청년할인 권종으로 구분되어 있으며, 다양한 연령층에서 이용하고 있는 대중교통 카드 입니다.기후동행카드는 구매 즉시 사용할 수 있으나, 청년할인 혜택 혹은 분실, 환불 처리를 위해 티머니 홈페이지에 등록해야 혜택을 볼 수 있는 사항이며, 해당 데이터에서는 "24.9월 기준으로 티머니 홈페이지에 등록된 이용자의 정보중 단순 연령정보(이용자의 10세 단위의 연령 통계 정보)만을 제공하고 있습니다.※ 기후동행카드 연령 데이터는 "24.9월 기준으로 제공되고 있으며, 연단위로 갱신됨을 알려드립니다.
