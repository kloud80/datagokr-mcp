description_portal: '데이터 개요국토교통부_연도별국내_국제항공수송실적 데이터는 2010년부터 연도별로 집계된 국내선과 국제선의 항공수송 실적 정보를 제공합니다. 주요 제공 항목은 여객 수송량(명), 화물 수송량(톤), 운항 횟수(편수), 항공 거리(Km) 등을 포함하며, 항공산업의 수요·공급 분석, 수송량 추이 파악, 항공정책 수립, 학술연구 등 다양한 목적으로 활용 가능합니다.주요 항목 설명연도 : YEAR수송 실적이 집계된 기준 연도 (4자리)국내외 구분: 국내선 / 국제선 / 전체 합계 구분여객 수(명): 해당 연도의 항공 여객 수 여객킬로(Km) : 여객 수송 환산 거리 (여객수 × 운항 거리)화물 수송량(톤) :  항공 화물 수송량 (톤 단위)화물톤킬로(Km) : 화물 환산 수송거리 (화물톤 × 거리)운항 횟수(편) : 해당 연도의 운송횟수운항거리(Km) : 운항횟수 환산거리 (총운항거리)데이터 활용 시 유의사항합계 항목은 국내와 국제 데이터를 단순 합산한 값으로 구성됩니다.수송거리(Km)는 실제 거리 기반 산정으로, 해당 연도의 항공편별 이동거리 기준으로 계산됨데이터는 연도별 통계 기반이므로, 월별 또는 구간별 추세 분석 시에는 별도 가공 필요데이터 값은 표기상 정수지만, 실사용 시 단위 환산(천 명/천 톤 등)을 고려해야 함데이터 활용 예시항공 수요 예측 모델링 (RPK/ASK 기반)코로나19 팬데믹 이전/이후 항공산업 회복 추이 분석공항 확장 타당성 검토를 위한 여객/화물 흐름 기반 수요 검토지역 간 항공운송 의존도 평가 등'
