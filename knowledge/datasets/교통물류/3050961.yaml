description_portal: '이 데이터는 한국철도공사가 매년 발행하는 철도통계연보에서 수집한 ‘연도별 수송실적’으로, 각 해별로 일반열차(예: KTX, 새마을, 무궁화, 통근열차 등)의 여객 수송 실적을 열차종, 구분(정기·비정기·기타), 단위, 수송인원 등의 항목으로 체계적으로 정리한 자료입니다. 데이터는 CSV, XML, JSON 등 다양한 오픈 포맷으로 제공되며, 주요 열차 유형별, 연도별 수송 실적 집계가 포함되어 있습니다. 최신 등록 데이터는 2023년 12월 31일 기준으로 96건의 원시 데이터(행)로 구성되어 있습니다.이 자료를 통해 연도별, 열차종별 수송인원 및 실적 변화 추이를 객관적으로 확인할 수 있습니다. 이를 바탕으로 KTX와 새마을, 무궁화, 통근열차 등 다양한 유형 열차의 성장 또는 감소 트렌드, 특정 연도의 여객 수송 증감, 노선별·차종별 이용 패턴 및 승객 집중 현상, 사회·경제적 변화(예: 대규모 행사, 정책·인프라 변화 등)의 파급효과까지 다양한 인사이트를 도출할 수 있습니다. 또한 장기시계열 변화, 코로나19 등 사회적 이슈와의 연관성, 각 열차의 상대적인 운영 경쟁력 및 정책효과 진단 등도 유추가 가능합니다.이 데이터는 국가 및 지자체의 철도정책 수립, 여객 수송시장 동향 파악, 교통 인프라 투자 및 증편 계획, 경제성 평가, 장기적 인구·도시 계획, 민간기업 교통·관광사업 전략, 학술연구, 여객수송시장의 수요예측 및 정책분석, 정부보고서 자료 활용 등 실무·행정·연구·산업 전 분야에서 참고자료와 근거자료로 널리 활용될 수 있습니다.'
