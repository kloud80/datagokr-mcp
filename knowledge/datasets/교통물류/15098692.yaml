description_portal: 창원시 공공부지에 설치된 전기자동차 공용충전시설 및 환경부 보조금을 받은 전기자동차 공용충전시설  설치현황입니다.전기차충전기 현황 데이터는 공공장소 및 민간 시설에 설치된 전기차 충전기의 위치, 충전기 유형(급속·완속), 운영 주체, 가동 상태, 충전 가능 시간대 및 설치 일자 등을 종합적으로 정리한 자료입니다. 이 데이터는 전기차 이용 패턴 분석, 접근성 평가, 충전 인프라 확충 계획, 과부하 방지 및 에너지 관리, 민원 대응, 정책 수립 등에 활용될 수 있으며 GIS 기반 시각화 및 수요 분석과 결합하면 설치 밀집도 및 충전기 효율성과 운영 전략 수립에 유용한 기초 자료로 쓰입니다.
