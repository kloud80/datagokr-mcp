summary_user: 안산시 RSE(노변기지국) 장비로 수집한 교통량을 통계일·DSRC 구간(루트 아이디)별로 10km/h 이하부터 100km/h 초과까지 속도 구간별 차량 건수로 집계한 5분 단위 통계 파일이다. 교통 분석가나 시 교통 담당자가 "특정 시간대에 저속 차량이 몰리는 안산시 도로 구간은 어디인가" 같은 속도 분포·정체 패턴 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 DSRC 루트 아이디를 안산시의 다른 DSRC·링크 자료와 이름·코드로 맞춰 이어 써야 한다.
description_portal: 이 정보는 RSE 장비를 통해 수집된 5분 단위의 속도 구간별 교통량 통계 자료로, 각 시점별로 장비 ID, 위치 코드, 수집 시각, 요일 유형, 그리고 10km/h 이하부터 100km/h 초과까지의 속도 구간별 차량 수가 포함됩니다. 이 데이터를 활용하면 도로 구간별 속도 분포 특성과 혼잡 정도를 분석할 수 있으며, 특정 시간대의 저속 차량 집중 구간이나 속도 분산이 큰 지역을 식별하여 교통 안전 대책 마련에 활용할 수 있습니다. 또한 실시간 속도 기반의 교통 흐름 예측, 정체 패턴 분석, 교통정보 제공 서비스 개선 등 다양한 스마트 교통 정책 수립에 기초 자료로 활용됩니다.【해당 데이터는 일정 기간에 한하여 샘플데이터로 제공하고 있습니다. 추가 데이터를 원하시면 기관에 문의주시기 바랍니다.】
