description_portal: 경기도 고양시의 현행 택시 이용요금은 시민 교통편의 증진과 운송서비스의 안정적인 운영을 위하여 2023년 7월 1일부터 조정·시행되고 있습니다. 본 자료는 현재 적용 중인 택시요금 체계를 정리한 것으로, 중형택시와 모범·대형택시의 요금 현황을 포함하고 있습니다. 세부 내용으로는 기본요금을 비롯하여 거리요금, 시간요금, 심야시간대 할증요금 및 시계외 운행 시 적용되는 할증요금 등이 수록되어 있으며, 택시 이용 시민과 관련 업무 담당자들이 현행 요금체계를 정확히 이해하고 참고할 수 있도록 작성되었습니다.
