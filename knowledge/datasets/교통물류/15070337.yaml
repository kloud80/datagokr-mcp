summary_user: 전국 시군구별로 일자(발생월·발생일)마다 경찰이 조사·처리한 인적 피해 교통사고의 사고건수와 사망·중상·경상·부상신고자수를 집계한 통계 파일입니다. 지자체 교통안전 담당자나 분석가가 "우리 시군구에서 어느 달, 어느 날에 사상자 사고가 몰렸는가"를 확인하는 데 쓴다. 표준 행정구역코드 같은 전역 조인 키가 없어 시도·시군구 이름을 매핑해 인구·도로 등 다른 지역 통계와 붙여 쓰며, 같은 기관(TAAS)의 사고 다발지역 데이터와 함께 본다.
limits: 인적 피해가 있는 사고만 집계되어 물적 피해 사고는 없다. 행정구역 코드 없이 이름으로만 연결해야 하므로 시군구 명칭 변경·통폐합 시 매핑 오류에 주의한다. 사고 지점 좌표 등 공간 정보는 없어 다발지역 분석은 별도 데이터가 필요하다.
