summary_user: 전국 대중교통 이용을 읍면동 단위로 집계해 수단통행량(버스·지하철 등 수단별 이동 횟수), 목적통행량(출발지에서 최종 목적지까지를 한 통행으로 본 수), 그 비율인 수단목적비를 운행연월과 함께 담는 집계 자료다. 교통 분석가나 지자체 담당자가 '우리 동네 주민은 목적지까지 가는 데 대중교통을 평균 몇 번 갈아타는가' 같은 환승 패턴과 수단별 수요를 따질 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시도·시군구·읍면동 코드와 이름을 매핑해 같은 기관의 다른 대중교통 데이터와 잇고, 필수 파라미터인 시군구코드(sgg_cd)는 다른 데이터에서 먼저 받아 넘겨야 한다.
limits: 호출에는 다른 데이터에서 얻은 시군구코드가 필수이며, 일간 오퍼레이션(/getDailyModePurposeRatio)은 최소 파라미터로 호출했을 때 응답이 없었다(2개 중 1개만 실호출 성공). 건별 통행 원천이 아닌 읍면동 단위 집계라 개인 이동 경로나 노선·정류장별 분석에는 쓰지 못한다.
