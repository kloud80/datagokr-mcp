summary_user: 서울시 교통정보시스템(TOPIS) 홈페이지에 등록된 공지사항 목록을 건별로 담으며, 통제·버스·정책·기상·기타 안내로 구분된 교통통제, 버스 우회, 집회·행사, 기상재난, 서비스 장애 공지가 들어 있다. 시민이나 분석가가 "오늘 서울에서 집회·행사로 통제되는 도로나 우회하는 버스 노선이 있는가"를 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 묶을 공통 조인 키를 찾지 못해, 실시간 소통·돌발상황 데이터와는 공지 본문의 도로명·노선명 같은 이름을 맞춰서만 이어 쓴다.
description_portal: '해당 데이터는 서울 교통정보시스템(TOPIS) 공지사항 API입니다. 데이터의 원본시스템은 서울시 교통정보시스템입니다.(https://topis.seoul.go.kr)TOPIS 홈페이지에 등록 된 공지사항에 대한 목록 제공 (정보 구분 항목 : 통제안내 / 버스안내 / 정책안내 / 기상안내 / 기타안내)주요 내용은 교통통제 정보, 버스 우회정보, 집회/행사 알림, 서울시 교통정책 홍보, 기상재난 관련 공지, 지하철 또타 앱정보 전달, 서비스 장애 안내 등입니다.※ 바로가기 클릭 시 서울 열린데이터광장으로 이동합니다.'
