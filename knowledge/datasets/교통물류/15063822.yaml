description_portal: 전국 18개의 국토 관리 사무소 별로 수행한 장비 기술검사(입고, 출고) 및 축중계 고장수리 내역 정보(품목명, 고장 내역 등)를 제공합니다.기술검사 자료에서는 각 국토 사무소명을 약자로 표출하고, 검사일자 순으로 데이터를 볼 수 있습니다.장비번호를 A와 B로 나누어서 구분하였는데, 예를 들어서 장비번호가 "151-259"이면 장비번호 A는 "151"이고, 장비번호 B는 "259"로 표시됩니다.품목IDX는 장비의 인덱스 값이고, 검사구분에 입고, 출고로 구분하여 표시되며, 각 장비의 거리누계와 품목명의 데이터를 제공합니다.축중계관리정보 자료에서는 축중계 고장수리 내역 정보로 사무소명_약자, 장비번호 A, 장비번호B, 품목명, 문서번호, 각개번호 등의 정보를 제공하고,수리업체와 검문소를 구분한 데이터를 볼수 있으며, 접수일자, 착수일자, 완료일자, 등록일의 정보를 제공합니다.
