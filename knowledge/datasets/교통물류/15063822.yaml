summary_user: 전국 18개 국토관리사무소가 수행한 장비 기술검사(입고·출고) 내역과 축중계 고장수리 내역을 건별로 담은 파일 데이터로, 사무소 약칭·검사일자·장비번호·품목명·거리누계·검사구분 등을 담는다. 도로 관리 분석가나 행정 담당자가 사무소별로 어떤 장비가 언제 입고·출고 검사를 받았는지, 축중계 고장이 얼마나 자주 수리되는지 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사무소 이름이나 장비번호·품목명을 직접 맞춰서 연결해야 한다.
