summary_user: 드론(무인비행장치) 사용사업체가 낸 변경신고를 연도별로 모아, 전체 변경건수와 사업체 명칭·대표자·주소·사업소 주소·사업범위·기타 등 변경사유별 건수를 담은 집계 자료이며 범위는 전국이고 파일 크기는 510바이트로 작다. 드론 산업 분석가나 정책 담당자가 '해마다 드론 사용사업체의 변경신고가 얼마나 늘었고, 대표자 교체나 사업범위 확대 같은 사유 중 무엇이 많은가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(년도)를 기준으로 맞춰 보거나, 같은 기관의 드론 사용사업체 등록·신고 기체 현황과 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 항공사업법 제48조에 따라 초경량비행장치사용사업을 경영하려는 자는 국토교통부령으로 정하는 바에 따라 신청서에 사업계획서와 그 밖에 국토교통부령으로 정하는 서류를 첨부하여 국토교통부장관에게 등록하여야 한다. 그 중 무인비행장치인 드론을 활용한 사용사업체는 한국교통안전공단에 서류를 제출해야하며, 드론원스톱민원서비스(drone.onestop.go.kr)를 통해 등록 할 수 있다. 해당자료는 데이터 기준일까지의 사용사업체 변경신고의 변경사유를 분석한 자료이다.
