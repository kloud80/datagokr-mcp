summary_user: 철도 각 역의 측정거리(키로정)를 역 단위로 담은 전국 파일로, 한 역에 여객 기준과 화물 기준 키로정이 함께 들어 있다(CSV 약 38KB). 분석가나 물류 사업자가 '두 역 사이 여객·화물 기준 거리가 얼마이며, 거리 기반 운임이나 물류비를 어떻게 잡을까'를 따질 때 쓴다. 전역 공통 조인 키는 없어, 역 마스터·노선도·수송량 데이터와는 역명 매칭이나 같은 기관(한국철도공사) 코드 매핑으로만 이어 쓴다.
description_portal: '"이 데이터는 철도 각 역의 측정거리(키로정) 값을 제공하는 공공데이터입니다. 각 역에 대하여 여객과 화물 기준의 구간 거리가 함께 제공되어, 수송 종류별로 동일 역이 어떤 거리 체계 내에 속하는지 확인할 수 있습니다.구간 거리 데이터를 분석하여 철도 노선 구조 분석, 구간 기반 운임 산정, 물류비 계산, 구간 단위 수송 효율 평가 등에 활용할 수 있습니다. 특히 화물 운송 시 특정 구간의 거리 비중이 높아지는 지점을 분석하여 병목 및 고비용 구간을 탐지하거나, 여객 노선 계획 시 구간별 거리 구조를 기반으로 배차 효율을 평가하는 방식의 분석이 가능합니다. 또한 세그먼트 거리, 노선도, 열차 운행스케줄, 여객/화물 수송량 등과 결합하여 구간 분석, 거리 기반 운임/정책 설계, 노선별 접근성 평가 등 다양한 정책적 활용이 가능합니다."'
