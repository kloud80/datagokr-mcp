summary_user: 선박법에 따라 지방해양수산청에 등록된 선박을 연월·톤급별로 집계해 척수와 톤수, 선령 구간(5년 미만부터 35년 이상까지 8개 구간)별 선박 수를 담은 전국 단위 월별 집계 파일입니다. 해운·조선 업체나 정책 연구자가 '특정 톤급에서 선령 25년 이상 노후 선박이 몇 척이고, 최근 몇 년간 어떻게 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 선박등록번호·IMO 같은 전역 조인 키가 없어 건별 선박원부와는 직접 연결되지 않고, 연월과 톤급 구분 이름을 맞춰 다른 해운 통계와 나란히 비교하는 방식으로 쓴다.
description_portal: 이 데이터는 해양수산부에서 선박법에 따라 각 지방해양수산청에 등록된 선박 현황을 파악, 제공하기 위해 수집된 데이터입니다.본 데이터의 주요 내용은 2014년 1월부터 2025년 12월까지 월별로 집계된 등록 선박의 척수와 톤수, 톤급 구분별 총계, 선박의 연령별 구분(5년 미만, 5-10년 미만, 10-15년 미만, 15-20년 미만, 20-25년 미만, 25-30년 미만, 30-35년 미만, 35년 이상)에 따른 선박 수 등으로 구성되어 있습니다.   본 데이터는 해양수산 관련 정책의 근거자료로써 선박 관련 인허가 담당자, 해운·조선 관련 산업체, 연구기관에서 선박 등록 현황 및 선박 연령 분포 분석을 위해 활용할 수 있습니다. 또한, 선박의 운항 및 관리, 노후 선박 교체 계획, 산업 트렌드 파악 등의 분야에도 적용할 수 있습니다.
