summary_user: 경상북도 영양군에 접수된 불법 주정차 신고를 건별로 담은 파일로, 신고일시·신고위치(지번주소)·과태료 부과 여부·데이터 기준일자를 기록한다. 주민이나 분석가가 영양군에서 주정차 신고가 어느 지번과 시간대에 몰리는지, 실제 과태료로 이어진 비율은 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소·좌표로 바꾸거나 같은 기관 코드로 맞춰 연결해야 한다.
description_portal: 이 데이터는 도로교통법에 따른 불법 주정차 위반사항에 대해 신고 접수일시, 신고 위치(지번주소), 과태료 부과 여부, 데이터 기준일자 등을 포함하고 있습니다.행정기관이 시민 신고를 바탕으로 주정차 위반을 확인하고, 위반 차량에 대해 실제 과태료가 부과되었는지 여부를 명확히 기록한 자료로, 교통 질서 확립 및 민원 처리 현황 분석에 활용됩니다.특히 특정 지역에서의 반복적인 위반 여부나 시간대별 집중 발생 현황 등을 파악하여 교통지도 계획 수립, CCTV 설치 우선순위 설정, 주차 단속 정책 보완 등에 기초 자료로 활용될 수 있습니다.데이터는 행정목적 외에도 공공안전, 지역 내 도로 이용 실태 분석 등 다양한 목적으로 연계 활용될 수 있습니다.
