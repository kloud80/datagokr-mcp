summary_user: 전국 무역항·연안항(국가관리 무역항 14개, 지방관리 무역항 17개, 국가관리 연안항 11개, 지방관리 연안항 18개)을 항만 한 곳당 한 행으로 정리한 시설 원장 파일로, 관리청·위치·수면적·부지면적·방파제·안벽 길이·접안능력(선석)·하역능력·주요취급화물 등을 담는다. 물류·운송업체나 정책 분석가가 "어느 항만이 어떤 화물을 주로 다루고 선석·하역능력이 얼마나 되는가"를 비교해 거점 항만을 고를 때 쓴다. 항만코드 컬럼이 없어 다른 데이터와는 항만명(항만명)을 이름으로 맞춰 이어야 하며, 입출항·항만 물류 데이터와 묶으려면 UN/LOCODE·해수부 내부 코드와의 매핑표가 따로 필요하다.
description_portal: 이 데이터는 해양수산부에서 전국 무역항 및 연안항의 위치, 면적 등 항만 정보를 관리하고 제공하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 국가관리 무역항 14개, 지방관리 무역항 17개, 국가관리 연안항 11개, 지방관리 연안항 18개의 항만별 위치와 면적, 하역능력 등 항만 세부정보로 구성되어 있습니다. 본 데이터는 항만 운영 및 시설 관리 계획 수립, 관련 기관의 항만 관리 체계 연구, 물류 및 운송업체의 항로 및 거점 분석, 해양수산 정책 자료로 활용될 수 있습니다. 또한 항만 개발 사업의 사전 조사, 각종 통계 작성 및 항만 관련 산업의 사업성 평가 등에도 사용할 수 있습니다.
