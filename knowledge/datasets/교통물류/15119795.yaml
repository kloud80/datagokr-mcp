description_portal: 경기도 하남시 건설기계 등록 현황입니다. 건설기계는  건설기계관리법에 따른 건설공사에 사용할 수 있는 기계로서 굴착기, 지게차 등이 있습니다. 본 데이터는 하남시 관내 건설기계 등록현황을 관용, 자가용, 영업용 등 세부 용도별로 확인 할 수 있습니다. 본 데이터로 전체 건설기계 중 자가용, 영업용, 관용이 각각 차지하는 비율을 알 수 있으며, 연도별 자료를 이용할 시 각 용도의 증감 추세를 알 수 있습니다. 다른 지역의 자료까지 활용할 경우, 특정지역은 자가용 위주인지, 영업용 위주인지 파악 가능합니다.
