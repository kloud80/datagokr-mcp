description_portal: 이 데이터는 서울교통공사 챗봇(민원·문의 응답 서비스) 에서 시민이 실제로 입력한 질문을 바탕으로 만든 가상의(합성) 데이터입니다.개인정보는 전혀 포함되어 있지 않으며, 챗봇이 더 똑똑하게 답변할 수 있도록 AI 학습용으로 가공되었습니다.각 문장은 “누가(user), 언제(sysdate), 무슨 요일(dayofweek), 어떤 방식으로(type), 어떤 내용(msg_m), 어떤 감정인지(pos_neg)”가 기록되어 있어AI가 사람의 말투나 감정을 학습하는 데 활용할 수 있습니다.실제 시민 발화를 반영한 자연어 기반 합성데이터이며, 개인정보, 민원 세부내용, 위치정보 등 비식별 처리 완료하였습니다.텍스트·시간·감정정보 등 AI 학습에 필요한 메타정보 구조화 문장 내 오타·구어체도 일부 반영하여 현실 대화 특성 유지하였습니다.
