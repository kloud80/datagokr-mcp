summary_user: 대구광역시 도로 구간(링크)별로 도로명·도로폭·구간길이·구군, 탄력주차 허용 시간, 주정차 단속 시간, 어린이보호구역 여부와 주간·야간 주차대수(적법·불법, 관내·관외, 차종별)를 담은 조사 자료이다. 범위는 대구광역시이고 시군구 단위로 구분되며, CSV 파일(약 26MB)로 받는다. 교통·주차 정책 담당자나 분석가가 "어느 구간에서 야간 불법주차가 많고, 그곳은 단속 대상인지 탄력주차 허용 구간인지"를 파악하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았다. 다만 표준링크아이디와 구군코드 필드가 있어 도로 링크 자료나 구·군 단위 통계와 이름·코드를 맞춰 붙여 쓴다.
description_portal: 대구광역시 내 도로망에서의 주정차 현황과 주차 운영 및 이용 실태를 분석한 공공데이터입니다. 이 데이터는 2021년 기업매칭 지원사업을 통해 구축된 자료로, 도로명, 도로폭, 구간길이, 구군명, 조사일자, 노견선 종류, 탄력주차 허용 여부 등의 항목을 포함합니다. 주차 운영 및 이용 실태 정보를 제공함으로써, 도시 내 주차 문제 해결과 교통 흐름 개선을 위한 정책 수립에 활용될 수 있습니다. 이 데이터를 활용하면 탄력주차 허용 여부나 주정차 단속 여부 등의 정보 등 도시 교통 관리와 주차 공간 최적화와 대구광역시 내 주차 공간의 효율적인 운영 방안을 모색할 수 있으며, 시민들에게 보다 나은 주차 환경을 제공하는 데 기여할 수 있습니다.
