summary_user: 국토관리사무소별로 장비를 운행해 수행한 국도 유지보수 작업 이력을 작업 건별로 담은 파일로, 2024년 1년치(2024-01-01~2024-12-31)에 대해 작업일자·사무소·노선번호·구간·장비명, 작업시간과 계기거리, 작업종류(대·중·소분류), 작업량·투입자재, 운전원·보수원 수를 기록한다(약 52MB CSV). 도로 관리 분석가가 어느 국토관리사무소가 어떤 노선에서 어떤 장비로 얼마나 오래 보수 작업을 했는지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 노선번호나 사무소명 같은 이름·코드를 직접 맞춰서만 연결한다.
description_portal: 국토 관리 사무소 별로 장비를 운행하여 수행한 국도 유지 보수 작업을 진행한 이력 정보를 제공합니다. (2024-01-01~2024-12-31)작업 일자 별과 국토 관리 사무소 별로 운전원번호, 운전원과 보수원의 수를 입력하고, 작업장소, 노선번호, 노선담당자, 구간, 장비번호, 장비명 등의 정보를 제공하며, 구체적인 작업시간(작업시간_시작, 작업시간_종료, 작업시간_계)과 계기거리(계기거리_시작, 계기거리_종료, 계기거리_계)의 정보를 제공합니다.작업종류를 대분류, 중분류, 소분류로 구분하여 정보를 제공하고, 작업량과 투입자재의 정보도 제공합니다.
