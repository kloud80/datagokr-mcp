summary_user: 전국 표준노드링크 체계의 링크 단위 기본 정보로, 링크마다 시작·종료 노드, 차로 수, 도로 등급·유형, 노선번호·도로명, 최고제한속도, 통과 제한 차량·하중·높이, 링크 길이를 한 행씩 담는다(비공간 속성). 교통 분석가나 내비·물류 사업자가 "이 구간의 제한속도와 높이·하중 제한은 얼마인가" 같은 구간 속성을 확인하거나, 교통 데이터를 구간 기준에 맞출 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나 링크 ID(LNK_ID)와 시작·종료 노드 ID는 표준노드링크 기준이라 같은 체계의 노드 정보, 링크 기반 소통·돌발 정보, 국토부가 배포하는 표준노드링크 SHP 파일과 ID로 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
