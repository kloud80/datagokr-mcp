summary_user: 경기도 양주시에 있는 물류창고업체를 업체 한 곳당 한 행으로 담은 파일이며, 상호명·사업자등록번호·소재지·연락처와 창고 동수·전체 면적(제곱미터)·종사자수, 보관·택배·판매·제조 업태 해당 여부를 함께 싣는다. 양주시에서 창고를 구하려는 사업자나 지역 물류 인프라 입지를 보는 분석가가 '양주시 어디에 어느 규모의 물류창고가 몰려 있나'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 상태 조회나 기업 정보 데이터와 연결하고, 소재지 주소로 지도나 다른 시군의 물류창고업 현황과 맞춰 본다.
limits: 양주시 한 곳만 다루는 시군구 단위 자료라서 경기도 전체나 전국 비교에는 다른 시군의 같은 자료를 모아야 한다. 받은 파일이 약 2KB(csv)로 작아 수록 업체 수가 적을 수 있다.
