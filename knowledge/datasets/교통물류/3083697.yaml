summary_user: 제주특별자치도 내 주정차 단속구간을 행정시·노선도로명·단속구간·거리(Km) 단위로 정리한 구간 목록 파일(CSV, 약 11KB)이다. 제주에서 운전하는 주민이나 관광객, 상인이 특정 도로의 어느 구간이 주정차 단속 대상인지, 그 길이는 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없으며, 다른 데이터와는 행정시 이름이나 노선도로명을 이름으로 맞춰야만 이을 수 있다.
description_portal: '제주특별자치도에서 관리하고 있는 도내 차량 및 주정차 단속구간과 관련한 데이터를 제공합니다.항목: 노선도로명, 단속구간, 거리, 비고 등*6대 불법 주정차: 소화전, 교차로 모퉁이, 버스정류소, 인도, 횡단보도, 어린이보호구역 *기타 불법주정차: 안전지대, 다리(교량), 터널 안, 어린이승하차구역, 통학로(보행로)자세한 사항은 각 행정시 홈페이지에서 확인하시기 바랍니다.*제주시: https://www.jejusi.go.kr/part/safety/service/illegalParking/1.do*서귀포시: https://parkingsms.seogwipo.go.kr/parkingsms/re_new/'
