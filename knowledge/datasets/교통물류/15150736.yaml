summary_user: 경찰청이 제공하는 교통안전 위험요소 중 도로환경 '침수' 항목을 지점별로 담은 데이터로, 위험요소 식별번호·지번/도로명 주소·위경도·분류코드·탐지 기준일자·상세내용 등을 전국 범위로 제공한다. 운전자나 지자체·분석가가 '침수 위험이 있는 도로 지점이 어디인가'를 확인하거나 우천 시 위험 구간을 지도에 표시하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소·위경도 기반 공간 매칭이나 같은 기관의 위험요소 분류코드·관련 링크 ID(RLTN_LNK_ID)로만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다.
