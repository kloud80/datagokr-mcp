summary_user: 경기도 버스운송관리시스템(BMS)이 관리하는 버스 노선별 경로를 도로 링크 순서 단위로 쪼개 그 등록·갱신 이력을 담은 건별 원천 데이터로, 노선아이디·링크순서·링크아이디·업무코드·처리진행코드·등록/갱신일자·시외버스 추가경로 구분을 담는다. 교통 분석가나 지자체 담당자가 '특정 노선의 운행 경로가 언제 어느 링크로 바뀌었는가'를 확인하거나 노선 경로를 지도에 그릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 경기도 버스 노선 정보와는 노선아이디(route_id)로, 도로 링크 정보와는 링크아이디로 이름·코드를 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 관리하는 버스 노선의 GIS 기반 경로 단위 이력 정보를 제공합니다. 주요 항목에는 노선아이디, 링크순서, 링크아이디, 업무코드, 처리진행코드, 등록일자, 갱신일자, 시외버스추가경로구분 등이 포함되며, 각 버스 노선이 실제 운행하는 경로의 세부 링크 단위 이력을 추적할 수 있도록 구성되어 있습니다. 이 데이터는 버스 노선의 이동 경로를 분석하거나 변경 이력을 기록하고자 하는 경우 유용하게 활용되며, 특히 공간정보 시스템과 연계한 시각화 및 대중교통 운영 시스템 고도화 등에 활용됩니다.
