summary_user: 전국의 유선·도선 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 상호명·업종(유선/도선)·소재지 주소·사무실 전화번호를 담는다(csv 약 12.7KB). 여행객이나 지역 주민이 '이 지역에서 관광 유람선이나 섬을 오가는 도선을 운영하는 업체가 어디이고 연락처가 무엇인가'를 찾을 때, 또는 분석가가 지역별 유도선 사업장 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 소재지 주소를 문자열로 맞춰 연결해야 한다.
description_portal: 국내 유선 및 도선의 사업장 현황 정보- 유선사업은 유선 및 유선장을 갖추고 수상에서 고기잡이, 관광, 그 밖의 유락을 위하여 선박을 대여하거나 유락하는 사람을 승선시키는 것- 도선사업은  도선 및 도선장을 갖추고 내수면 또는 대통령령으로 정하는 바다목에서 사람을 운송하거나 사람과 물건을 운송하는 것
