summary_user: 김포시 주정차 위반 단속에 따른 과태료 부과건수와 징수건수를 집계일자(집계년월일)별로 담은 시군구 단위 집계 파일로, 단속 건별 원천 기록은 들어 있지 않습니다. 교통정책 담당자나 분석가가 김포시에서 주정차 위반 부과·징수 건수가 기간에 따라 어떻게 늘고 줄었는지, 부과 대비 징수 비율이 어떤지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 같은 형식 데이터와는 시군명과 집계 시점을 맞춰 이어 붙인다.
description_portal: 경기도 김포시의 주정차단속위반현황에 대한 정보를 제공합니다. 제공 항목으로는 시군명, 집계년월일, 부과건수, 징수건수로 구성되어있으며 부과건수와 징수건수  월단위로 수집하여 제공합니다.. 본 데이터를 통해 월별 주정차 부과 및 징수 건수 증감 추이에 대한 정보 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 교통정책과로 연락주시기 바랍니다.
