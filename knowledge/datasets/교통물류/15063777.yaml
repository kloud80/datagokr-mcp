description_portal: 대구광역시에서 운영중인  승용차요일제 가입자 중 위반 통계 자료 입니다. 대구시 승용차요일제는 지정한 운휴일에 대중교통을 이용시 대중교통 요금의 80% 마일리지로 적립해주는 제도입니다.승용차요일제 위반이란, 이용자가 지정한 운휴일에 대중교통마일리지를 적립받고 승용차를 운행한 것을 말하며, 위반시 즉시 문자가 발송됩니다.4회 위반시까지는 적립이 가능하지만, 5회 위반시 승용차요일제 혜택이 정지됩니다.통계는 월 및 요일별로 통계 낸 내용 입니다.월별 위반 통계, 요일별 위반 통계등의 자료를 포함합니다.
