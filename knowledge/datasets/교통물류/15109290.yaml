description_portal: 검색어, 데이터 등록일을 이용하여 코로나 관심통계 정보를 기반으로 한 데이터의 제목, 카테고리, 키워드, 제공기관, 원본등록일, 제공페이지 URL을 조회할 수 있는 국토교통부 코로나 관심통계 분석정보 서비스 입니다.코로나19는 비대면 사회로의 급격한 이행에 따른 경제, 산업, 노동시장 구조 변화 및 국민들의 여가, 문화생활 변화 등 경제와 사회 전반에 걸쳐 많은 변화를 초래하고 있습니다.코로나19로 인한 경제,사회 구조 변화를 파악할 수 있는 대국민 통계 서비스 제공 합니다. 코로나19의 감염병 등급이 4급으로 조정(전수감시체계에서 표본감시체계로 전환)됨에 따라 코로나 관심 통계 업데이트는 종료됩니다.
