summary_user: 코로나19로 인한 경제·사회 변화를 보여주는 '코로나 관심 통계' 데이터 목록을 건별로 담으며, 각 건마다 제목, 카테고리, 키워드, 제공기관, 원본등록일, 제공 페이지 URL을 전국 단위(비공간)로 제공한다. 분석가나 연구자가 "코로나19 이후 여가·노동·산업 변화를 다룬 통계가 어디에 어떤 이름으로 공개돼 있나"를 검색어와 등록일로 찾아 원본 통계 페이지로 넘어갈 때 쓴다. 다른 데이터와 직접 이을 전역 조인 키는 없으며, 제공기관명(pvsnInst)이나 제목·키워드 같은 이름 매칭, 또는 제공 URL을 따라가 원본 통계를 확보하는 방식으로만 연결된다.
limits: 통계 수치 자체가 아니라 관련 통계의 목록·메타정보와 URL만 담으므로, 실제 값은 원본 페이지에서 따로 받아야 한다. 포털 설명상 코로나19 감염병 등급이 4급으로 조정되면서 관심 통계 업데이트가 종료되었다. 개발계정은 하루 1,000회 호출로 제한된다.
