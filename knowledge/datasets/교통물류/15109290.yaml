services:
  - op: /getCovidItrstStatList
    name: 코로나 관심통계 분석정보 목록조회
    endpoint: https://apis.data.go.kr/1613000/covidItrstStatAnls/getCovidItrstStatList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: viewType
        required: false
        example: json
        desc: 응답타입구분 (xml or json)
      - name: startDate
        required: false
        example: '2022-01-01'
        desc: 작성일 기준 검색 시 검색범위의 시작일 (YYYY-MM-DD)
      - name: endDate
        required: false
        example: '2023-01-01'
        desc: 작성일 기준 검색 시 검색범위의 종료일 (YYYY-MM-DD)
      - name: srchWord
        required: false
        example: 코로나
        desc: 대상의 제목/키워드에 포함되어 있을 단어
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
