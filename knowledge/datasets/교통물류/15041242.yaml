summary_user: 대구도시철도 2호선 역사별 화장실 위치를 화장실 한 곳당 한 행으로 담은 원천 목록 파일(csv, 약 5KB)로, 운영기관·노선·역명과 지상·지하 구분, 역층, 개찰구 안팎(게이트내외), 가까운 출구번호, 상세위치, 화장실 구분을 담는다. 대구 2호선 이용자가 '내릴 역의 화장실이 개찰구 안에 있는지, 몇 번 출구 쪽 몇 층에 있는지'를 확인하거나, 분석가가 노선의 역내 화장실 배치를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 역 시설·편의시설 데이터와는 역명·선명 문자열을 맞추거나 같은 기관(국가철도공단) 데이터끼리 이름으로 이어 쓴다.
limits: 역 코드 같은 공통 조인 키가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다. 범위는 대구 2호선에 한정되며, 다른 노선이나 같은 역 다른 노선의 화장실 위치는 이 파일로 알 수 없다.
