summary_user: 경찰청이 제공한 장애인 보행자 관련 교통 위험요소 정보를 행정안전부 재난안전데이터 공유플랫폼에서 API로 제공하며, 범위는 전국입니다. 필드명으로 보아 지점별로 시도·시군구·읍면동·동리 이름, 위경도(LAT, LOT), 구분, 장소 설명을 담는 것으로 보이며, 지자체·교통안전 분석가가 '우리 지역에서 장애인 보행자에게 위험한 곳이 어디인가'를 확인하는 데 씁니다. 전역 조인 키가 없어서 다른 데이터와는 시도·시군구 같은 행정구역 이름을 맞추는 방식으로만 이어 씁니다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-보행자별 데이터는 경찰청에서 제공하는 정보입니다.
