summary_user: 인천공항 화물기의 출발·도착 운항현황을 편 단위로 담는 API로, 조회일 기준 D-3~D+6일 범위의 예정·변경 시각, 도착지 공항, 탑승구, 화물터미널 구분, 운항상태(출발·결항·지연)를 제공한다. 물류업체나 화주가 "오늘 인천에서 나가는 특정 화물편이 지연되거나 결항됐는가"를 확인하는 데 쓴다. 전역 조인 키는 없고, 도착지 공항코드(airportCode)나 편명으로 공항코드표·여객기 운항현황 같은 다른 운항 데이터와 이름·코드 매핑해 잇는다.
description_portal: 인천국제공항공사에서 관리하는 인천공항 화물기 운항정보입니다. 화물기의 출발/도착 정보 현황에 대한 데이터로 조회일 기준 D-3~D+6일간의 운항현황 데이터를 확인할 수 있습니다. 예정시간 또는 변경시간 기준으로 조회시간 구분코드를 지정하여 조회일자와 시간별로 조회조건 적용이 가능합니다.공항코드, 편명UNIQ코드, 편명, 3자리 IATA 공항코드, 언어구분 기준으로 조회조건도 제공합니다. 항공사, 공항명, 공항코드, 예정일시 및 변경일시, 코드쉐어여부, 편명, 마스터편명, 탑승구, 터미널 구분, 운항현황, 항공기 운항타입 등의 응답 데이터를 제공합니다. 개발계정 일 500트래픽, 운영계정(서비스 URL 및 상세 운영사례 기재 필요) 신청 시 일 100,000트래픽을 제공합니다.
