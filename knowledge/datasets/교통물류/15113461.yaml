      - name: searchday
        required: false
        example: '20230413'
        desc: 항공기 스케줄 조회일자
      - name: from_time
        required: false
        example: '0000'
        desc: 항공기 스케줄 조회시간부터
      - name: to_time
        required: false
        example: '2400'
        desc: 항공기 스케줄 조회시간 까지
      - name: airport_code
        required: false
        example: LHR
        desc: 인천공항에서 출발하는 도착지 공항 코드 IATA 공식 홈페이지 참조
      - name: f_id
        required: false
        example: '2023040700000004963719'
        desc: 각 스케줄에 따른 편명 별 유니크 코드 값(랜덤생성)
      - name: flight_id
        required: false
        example: BA8571
        desc: 운항 편명
