summary_user: 대전도시철도 1호선에서 출발역과 도착역 두 역을 넣으면 해당 구간의 소요시간(분·초), 역간 거리(km), 운임 요금을 한 건으로 돌려주는 조회용 API다. 시민이나 길찾기·요금 안내 앱 개발자가 "이 역에서 저 역까지 몇 분 걸리고 요금은 얼마인가"를 이용 전에 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없다. 다만 필수 입력인 출발·도착 역번호는 다른 데이터의 코드이므로, 대전교통공사의 역 정보 데이터에서 역번호를 먼저 받아 넘기는 방식으로 이어 쓴다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 역 중 출발역과 도착역 두 역을 입력하면 해당 구간의 소요시간, 역간 거리, 운임 요금 정보를 제공하는 데이터입니다.본 데이터를 활용하면 원하는 두 역 사이의 이동 시간과 거리, 승차 요금을 손쉽게 확인할 수 있으며, 대중교통 길찾기 서비스, 교통 요금 안내 앱, 환승 경로 최적화 플랫폼, 대전 지역 교통 정보 통합 서비스 등 다양한 분야의 애플리케이션 개발에 활용할 수 있습니다. 민들이 지하철 이용 전 구간별 소요시간과 요금을 미리 파악할 수 있어 편리한 대중교통 이용 환경 조성과 교통 정보 접근성 향상에 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
