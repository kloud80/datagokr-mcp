summary_user: 경기도 고양시에 등록된 이사화물 운송업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·업종구분·인허가일자·소재지 도로명주소·연락처를 포함한다. 고양시 주민이 이사를 앞두고 관내에 허가받은 이사업체가 어디에 있는지 확인하거나, 분석가가 지역 내 이사업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭으로 잇는다. 허가 여부를 교차 확인할 때는 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
description_portal: 경기도 고양시 이사화물업체 데이터로 번호, 시도명, 시군구명, 관리번호, 인허가일자, 업종구분, 업체명, 소재지도로명주소, 연락처, 데이터기준일자 등의 항목을 제공합니다. 본 데이터는 지역내 이사업체 분포와 서비스 제공 규모를 파악할 수 있으며 행정동별 업체 밀집도나 생활물류수요분석에도 활용 가능합니다. 또한 소비자에게 공정하고 안전한 이사서비스제공을 위한 기초자료로 사용될 수 있으며 업체 등록 관리, 민원대응, 지역물류정책수립 등 행정 업무의 효율성 향상에도 기여하는 데이터입니다.
