summary_user: 대구 도시철도 3호선 상선(용지역→칠곡경대병원역) 열차 시각표를 요일 구분(평일·토요일·공휴일)과 역명별 행으로, 열차번호(3002, 3004 … 짝수 번호)를 열로 펼쳐 각 역 도착 시각을 담은 CSV 파일(약 238KB)이다. 3호선 이용자가 '평일 아침 특정 역에서 칠곡경대병원 방면 다음 열차가 몇 시에 오나'를 확인하거나, 서비스가 시간표 조회 기능을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 하선 시각표나 다른 호선·역 정보와는 역명 문자열을 맞추거나 같은 기관 자료끼리 이어 써야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 3호선 상선(용지역 → 칠곡경대병원역) 열차 운행 시각표 정보를 제공합니다. 데이터에는 열차번호별 출발역 및 도착역, 각 정차역의 도착 시각, 평일·토요일·공휴일별 운행 시간표 등의 항목이 포함되어 있으며, 이용자가 열차 운행 계획과 역별 도착 시간을 확인할 수 있는 자료입니다. 해당 데이터는 도시철도 이용자의 이동 계획 수립, 열차 운행 정보 확인, 역사별 운행 현황 파악 및 교통 서비스 개선 검토를 위한 기초자료로 활용할 수 있습니다. 또한 요일별 운행 정보를 제공하여 이용 패턴에 따른 대중교통 이용 편의 향상과 효율적인 이동 계획 수립에 활용할 수 있습니다. 본 데이터는 운행 시각표 변경 등 변동 사항 발생 시 갱신되며, 변경된 열차 운행 계획을 반영합니다..'
