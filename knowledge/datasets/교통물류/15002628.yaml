summary_user: 한국공항공사가 운영하는 공항(인천국제공항 제외)을 이용하는 항공사의 운항실적을 연도·노선·항공사·정기/부정기·여객기/화물기 구분별 출발·도착 운항 횟수로 집계한 통계 파일이다(약 11KB CSV, 전국 범위). 항공 분석가나 지역 공항 관계자가 '특정 연도에 어느 항공사가 어떤 노선에서 정기편·부정기편을 몇 편 운항했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 항공통계와는 항공사명·노선명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 공항을 활용하는 항공사들의 운항실적 현황을 제공합니다.해당 데이터는 항공사, 노선, 정기/부정기, 도착여객수, 출발여객수 등의 적발현황 통계자료로 이루어져 있습니다.추가 문의사항  또는 요구사항 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
