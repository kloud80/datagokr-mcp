summary_user: 경기도 광역공공버스의 노선별 연간 인원 수송 실적을 담은 집계 자료로, 행마다 기준연도·노선 구분·시군명·노선번호·운송사업자명·수송인원이 들어 있다. 교통 분석가나 시군 담당자가 '어느 광역버스 노선이 해마다 승객을 가장 많이 실어 나르는지, 어느 운송사업자 노선의 수요가 줄었는지'를 확인해 증편·조정을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 버스 노선·정류장·승하차 데이터와는 시군명과 노선번호를 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 광역 공공버스의 노선별 인원 수송 및 운행 실적을 정리한 자료입니다. 각 노선별로 버스가 몇 명의 승객을 수송했는지를 종합적으로 파악할 수 있어, 대중교통 이용 현황, 노선별 수요 차이, 운행 효율성을 분석하는 데 활용됩니다. 이를 통해 지방자치단체와 교통 관련 기관은 노선 증편·조정, 배차 간격 최적화, 교통 혼잡 완화 대책을 마련할 수 있으며, 연구기관에서는 광역 교통 네트워크 분석, 이용자 이동 패턴 연구, 교통 정책 평가의 자료로 활용할 수 있습니다. 또한 버스 운영 효율과 서비스 품질을 높이는 기초 자료가 되어, 대중교통 만족도 향상 및 교통 복지 확대에 기여할 수 있습니다.
