description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)에 신고된 외항화물 신고정보 중 공컨테이너 환적 시 발생하는 사용료 할인내역을 제공할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 공컨테이너로 환적 신고된 건별 할인정보로, 각각의 건에 대해 하역톤수와 사용료 할인내역 등이 포함됩니다. 이 데이터는 신고청, 선박 호출부호 등 정보와 공컨구분, 기본요금 및 할인율 등 정보로 구성되어 있습니다.  본 데이터는 해양수산부 및 관련 기관에서 항만물류 관련 정책 수립 시 항만 내 공컨테이너 환적 현황과 할인제도의 실효성 분석 등에 활용될 수 있으며, 항만을 이용하는 선사 및 물류기업은 이에 따라 운송비용 구조 분석이나 공컨테이너 환적 계획 수립을 지원하는 데 활용할 수 있습니다.
