summary_user: 경기도 도로대장 전산화 시스템에 등록된 측구(도로 배수로)를 노선번호·구간번호별로 한 건씩 담은 시설 대장으로, 시점·종점 위치와 방향, 연장, 단면 형상(V형·L형 등), 최대·최소 높이, 폭, 시종점 경위도를 포함한다. 도로 관리자나 분석가가 특정 노선 구간에 어떤 형태와 규모의 배수로가 깔려 있는지 확인하고, 침수 위험 구간의 배수시설 현황을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 노선번호·구간번호나 경위도 좌표를 기준으로 같은 경기도 도로대장의 다른 시설 데이터나 표준노드링크와 매핑해 이어 쓴다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템에 등록된 측구(도로 배수로) 정보를 제공하며, 도로 노선번호, 구간번호, 시점 및 종점 위치, 방향, 측구의 연장, 단면 형상(V형, L형 등), 최대·최소 높이, 폭, 비고, 공간정보(경도·위도) 등으로 구성되어 있습니다. 측구는 도로에 내린 빗물 및 지표수를 빠르게 배수하여 도로의 구조적 안정성과 통행 안전을 확보하는 중요한 도로배수시설입니다. 이 데이터는 도로별 배수 인프라의 설치 현황과 특성을 체계적으로 파악하고, 배수 설계 및 유지관리 계획 수립, 침수 방지대책 마련, 도로환경 개선 및 재난 예방 등의 행정적 목적으로 활용됩니다. 공간정보가 포함되어 있어 GIS 기반 시설분석 및 도로 재해 위험도 평가에도 활용 가능합니다.
