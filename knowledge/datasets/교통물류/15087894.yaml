summary_user: 한국교통안전공단이 기관으로서 보유한 드론을 구매연도·제작사·제작국·기종·모델명별 보유대수와 용도로 정리한 2022년 7월 31일 기준 소규모 집계 파일(CSV 약 2.5KB)이다. 공공기관의 드론 도입 현황이나 어떤 제작사·국가의 기체를 어떤 업무 용도로 쓰는지 확인하려는 분석가·연구자가 참고 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 드론 신고·비행승인 데이터와는 제작사명·모델명 같은 이름 매칭으로만 느슨하게 이어 쓴다.
