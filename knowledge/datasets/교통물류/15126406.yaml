summary_user: 강서구시설관리공단이 운영하는 공영주차장을 주차장 한 곳당 한 행으로 담은 소규모 CSV 파일로, 주차장명·급지·주소·면수·5분당 요금을 담는다. 강서구 주민이나 방문자가 목적지 근처 공영주차장의 위치와 주차 면수, 급지에 따른 요금을 비교하는 데 쓴다. 전역 조인 키가 없으므로 전국주차장정보표준데이터 등 다른 주차장 자료와는 주차장명이나 주소를 맞춰 연결해야 한다.
description_portal: 강서구시설관리공단에서 운영하고 관리하는 공영주차장 현황입니다. 주차장명, 급지, 면수, 관리주체에 대한 정보를 담고 있습니다.- 2급지 6개소(724면수), 4급지 7개소(1,534면수), 5급지 16개소(1,184면수) 총 29개소(3,442면수)를 운영하고 있습니다. (2026.1.1.기준)- 급지별로 요금이 상이합니다.- 강서구시설관리공단 공영주차장은 무인으로 운영하고 있으며(노상주차장 제외), 관련 문의는 02-2065-1575로 연락주시면 감사하겠습니다. - 자세한 사항은 https://www.gssi.or.kr/parking1/에서 확인 가능하십니다.
