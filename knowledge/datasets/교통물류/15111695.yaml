summary_user: 경기도 성남시 어린이·노인·장애인 보호구역에 설치된 교통안전 표지판을 한 개씩 기록한 건별 원천 파일로, 표지판마다 위도·경도, 보호구역 아이디, 대상시설명, 관할경찰서명, 이미지명을 담는다. 교통안전 분석가나 지자체 담당자가 "특정 학교 앞 스쿨존에 표지판이 어디에 몇 개 서 있고, 사고다발 지점 주변에 표지판이 빠진 곳은 없는가"를 확인하는 데 쓴다. 전국 공통 조인 키는 없으므로 좌표로 사고·단속카메라 위치와 공간 결합하거나, 대상시설명·보호구역아이디(제공표준 어린이보호구역 데이터와 이름 매칭)·관할경찰서명으로 이어 쓴다.
limits: 범위가 성남시 한 곳뿐이라 다른 시군구와 비교할 수 없고, 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·좌표 매칭으로만 연결된다. 포털 설명은 메일 제공(CSV·SHP·이미지)이라고 하지만, CSV는 활용신청 없이 바로 내려받아 파싱했다.
