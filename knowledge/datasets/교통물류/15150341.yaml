summary_user: 전국 도로에 설치된 교통 CCTV의 기본 정보를 CCTV 한 대당 한 건으로 담으며, 명칭·도로번호와 등급·노선명·방향·설치 주소·설치 좌표(INSTL_XCRD, INSTL_YCRD)·연계 링크·관리기관 등이 들어 있다. 교통 분석가나 내비게이션·관제 서비스 사업자가 특정 노선과 방향에 어떤 CCTV가 어디에 설치돼 있는지 확인하고 실시간 소통 정보와 위치를 맞춰 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 링크 ID(LINK_ID)나 도로번호·도로명 같은 이름·코드 매핑으로 링크 속도·돌발상황 데이터와 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
