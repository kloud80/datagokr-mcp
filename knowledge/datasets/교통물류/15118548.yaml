summary_user: 광주 서구 관내에서 시행한 이동형 불법 주정차 단속을 1건 1행으로 담은 건별 원천 데이터로, 단속일시·단속장소와 단속지점 위도·경도를 포함하며 포털 설명상 2022년 한 해 기록이다. 주민이나 분석가가 '서구에서 이동형 단속이 자주 일어나는 상습 불법 주정차 지점과 시간대는 어디인가'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 위도·경도 좌표나 장소명을 매칭해 연결하고, 다른 연도의 같은 형식 파일과 병합해 시계열로 쓴다.
description_portal: 이 데이터는 광주광역시 서구 관내에서 시행된 이동형 불법 주정차 단속 현황을 수록한 공공데이터로, 단속 순번, 단속일시, 단속장소, 단속지점의 위도·경도 정보 등을 포함하고 있습니다. 해당 데이터는 2022년 한 해 동안의 단속 기록을 기반으로 하며, 교통질서 확립 및 주차 공간 관리, 불법 주정차 민원 대응, 단속 효율성 분석 등 다양한 행정 수요에 활용됩니다.특히 위도·경도 정보가 포함되어 있어 **공간기반 시각화 분석(GIS)**이 가능하며, 단속 빈도·시간대·장소 분포를 종합적으로 파악할 수 있습니다. 이는 특정 구역의 상습 불법 주정차 지역을 파악하거나, 주차 유도 정책, 교통안전 대책 수립 시 기초자료로 활용됩니다.단속 데이터는 CSV 형식으로 제공되며, 각 행(Row)은 1건의 단속기록을 의미합니다. 이 데이터는 수시 등록되는 1회성 데이터로 관리되며, 시계열 누적 분석 시 다른 연도 데이터와 병합해 활용이 가능합니다.
