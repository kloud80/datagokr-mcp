description_portal: 서울교통공사에서는 잠실광역환승센터를 위수탁하여 관리하고 있습니다. 잠실광역환승센터는 지하철 2,8호선 잠실역과 다양한 버스노선을 이어주는 역할을 합니다. 이 자료는 잠실광역환승센터를 경유하는 버스 노선별 월간 수송인원에 대한 자료입니다. 해당 자료는 수송월(데이터가 수집된 연월정보), 버스 노선 번호, 목적지에 따라 일평균 승하차인원(하루 평균 승차 및 하차 인원수)이 정리되어 있습니다. 이 자료는 노선별 이용 규모와 시기별 수송인원 변동을 파악할 수 있는 기초 데이터를 제공합니다. 이 자료는 매월 15일 전후로 업데이트 될 예정입니다.
