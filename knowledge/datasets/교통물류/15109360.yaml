status: active
summary_user: 국토교통부가 사전정보공개로 올린 교통물류 분야 공개자료의 목록을 자료 한 건 단위로 담으며, 제목·카테고리·키워드·제공기관·원본등록일·제공페이지 주소·첨부파일명·다운로드 주소를 전국 범위로 제공한다. 분석가나 사업자가 '국토교통부가 최근 공개한 교통물류 관련 자료와 첨부파일을 어디서 내려받을 수 있나'를 검색어·등록일·분류로 찾는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키는 없어, 제목·키워드 같은 이름 매칭이나 제공기관(pvsnInst) 기준으로만 다른 자료와 연결한다.
limits: 실제 통계나 원자료 값이 아니라 공개자료의 목록과 링크만 담으므로 내용은 첨부파일을 따로 내려받아 확인해야 한다. 지역 단위가 없는 비공간 자료여서 지도·지역별 분석에는 바로 쓰지 못하고, 개발계정은 하루 1,000회로 호출이 제한된다.
