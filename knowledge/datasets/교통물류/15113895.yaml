summary_user: 부산광역시 안의 수소충전소를 한 곳씩 행으로 담은 원천 목록으로, 충전소 이름·도로명주소·위도와 경도·운영 시작과 종료 시각·휴무일·전화번호·데이터 기준일을 담는다(CSV 1.3KB 규모의 작은 파일). 수소전기차 운전자가 '지금 문 연 가까운 부산 수소충전소가 어디인가'를 확인하거나, 분석가가 부산의 수소충전 인프라 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 충전소 이름·주소 매칭이나 위경도 기반 공간 결합으로 이어 쓴다.
description_portal: 이파일은부산광역시수소충전소의위치및운영정보를담은공공데이터로,충전소명칭,주소,위도·경도,운영시간,휴무일,연락처,데이터기준일 등을 포함합니다.수소충전소는수소전기자동차에수소를재보충합니다.수소충전소는두가지방식이있으며,Off-site방식과on-site방식으로 나눌수있습니다.off-site방식은공장에서  생산된 수로를 파이프라인과 튜브트레일러로 수소공급하며,On-site방식은충전소내에서개질(추출)등을통해수소를생산하는것을말합니다.현재국내에구축된수소충전소는대부분 튜브트레일러방식입니다.
