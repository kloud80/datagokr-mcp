description_portal: 본 데이터는 경기도 광주시 도로변에 식재된 가로수의 위치 정보를 공간정보 형태로 제공합니다. 가로수는 도시 미관 개선, 대기 정화, 그늘 제공 등 다양한 기능을 수행하는 도시 녹지 자원으로, 본 데이터는 광주시 내 가로수의 정확한 위치 좌표와 분포 현황을 담고 있습니다. 압축 파일 내 위치 파일인 shp 파일과, 속성파일 dbf, 인덱스를 표시하는 sbx, sbn 파일이 포함되어 있습니다. 공간정보데이터(shp) 파일은 QGIS, ArcGIS 등 공간정보를 확인할 수 있는 소프트웨어를 이용하셔야 합니다.
