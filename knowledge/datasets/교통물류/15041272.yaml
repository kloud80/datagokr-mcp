description_portal: 대구도시철도공사에서 운영하는 대구1호선의 ATM에 대한 데이터로 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 상세위치, 금융기관명, 연락처의 데이터가 있습니다.현금 자동 입출금기(現金自動入出金機), 간단히 ATM(Automated Teller Machine)은 은행을 대신하여 입출금이나 송금, 기타 역무를 편리하게 처리할 수 있도록 설치되는 기기이다. 입출금 외의 부가적 서비스를 고루 갖춘 것을 디지털 키오스크(Digital Kiosk)라고도 부르나, 일상적으로는 모두 통틀어 ATM으로 불리는 편이다.은행원의 일부 업무를 대신할 수 있어 인건비를 줄일 수 있으며, 은행을 열지 않는 매일 밤부터 아침, 또는 주말의 빈 시간, 또는 해당 은행 점포가 없는 곳에서 은행 역할을 대신한다.
