summary_user: 대구도시철도 1호선 역사 안에 설치된 ATM을 한 대씩 담은 원천 목록으로, 역명·지상지하 구분·역층·상세위치·금융기관명·이용시간·연락처를 담는다(CSV 파일 약 1.2KB의 소규모 데이터). 대구 지하철 이용객이 '이 역에 어느 은행 ATM이 몇 층 어디에 있고 몇 시까지 쓸 수 있나'를 확인하거나, 분석가가 역사 편의시설 현황을 정리할 때 쓴다. 전역 조인 키가 없어 다른 역·편의시설 데이터와는 선명·역명 같은 이름 매칭으로만 잇는다.
limits: 표준 역코드 같은 공통 키가 없어 다른 데이터와 연결할 때 역명 표기 차이를 직접 맞춰야 한다. 대구 1호선 한 노선만 다루므로 다른 노선·도시의 ATM 현황은 이 파일로 알 수 없다.
