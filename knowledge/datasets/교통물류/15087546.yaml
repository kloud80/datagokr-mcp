summary_user: 서울교통공사가 운영하는 1~8호선의 2020년 열차 전력사용량을 호선·일자별로 담은 파일로, 시간대별 계측기가 없어 월별 전력사용량을 일자별 열차운행 실적 비율로 나눠 계산한 추정값(일별전력사용량, kWh)과 열차운행횟수·운행거리를 함께 담는다. 분석가가 '호선별로 평일과 휴일의 하루 열차 전력사용량이 얼마나 다른가', '운행거리 1km당 전력사용량은 호선마다 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 호선 이름과 일자를 맞춰 이어 쓴다.
description_portal: 서울교통공사에서 운영중인 1~8호선 2020년 열차 전력사용량정보 입니다.(공공데이터 제공 요청으로 지하철 시간별 운행 전력 사용량데이터의 요청이 있었으나,) 열차 전력사용량을 시간대별로 측정하는 별도의 계측기가 설치되어 있지 않아전체 열차 전력사용량과 열차운행 거리를 바탕으로 일별 전력사용량을 계산한 정보입니다.(공공데이터 신청에 의한 일시성 데이터로 업데이트 합니다.)열차운행횟수 = 본선운행열차, 회송열차, 임시열차의 총합일자별 전력사용량 = 월별 전력사용량 / 월별 열차실적 * 일자별열차실적
