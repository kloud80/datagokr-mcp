description_portal: '파일다운로드 방법항공산업실적 - 종사자현황 - 필수항목(종사자) - 선택항목(출신)  선택 후 조회 및 다운로드 데이터 개요국토교통부가 제공하는 ‘항공기 조종사 출신별 현황’ 데이터는 국내 항공사에 재직 중인 항공기 조종사들의 출신 유형별 분포를 연도별로 정리한 통계입니다.이 자료는 조종사의 인력 공급 경로를 군 출신, 항공사 자체 양성, 항공기관사 전직, 기타 경력자, 외국인으로 분류하여 제공하며, 항공사별 인력 구조 비교, 조종사 양성정책 수립, 조종사 수급 안정성 평가 등에 활용됩니다.주요 제공 항목군 전역: 공군·해군 등에서 전역 후 민항사로 이직한 조종사자체 양성: 항공사 또는 위탁교육기관을 통한 자체 선발·훈련 조종사기관사 출신: 항공기관사 자격에서 조종사로 전환된 인력기타(경력): 타 항공사·외항사·교관 출신 등 민간 경력자외국인: 외국 국적을 가진 조종사데이터 제공구조항공사별 행(row) 구성출신 유형별 열(column) 구성각 연도 기준으로 집계엑셀 파일 형태로 제공활용 안내항공인력 수급 경로 다양성 평가군→민 이직 정책 효과 분석외국인 조종사 의존도 분석항공사별 조종사 양성체계의 독립성 및 안정성 비교데이터 예시구분군전역자체양성기관사 출신기타(경력)외국인합계대한항공1,26269396802022,846아시아나77264700201,439제주항공8150701601749진에어820032310415.....................계2,3802,08191,7532456,468※ 단위: 명※ 일부 항공사는 자체양성 또는 외국인 채용이 없을 수 있음※ 기준 시점: 연도 말 기준'
