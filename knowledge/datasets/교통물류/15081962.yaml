summary_user: "경기도 구리시에 설치된 바닥형 보행신호등(횡단보도 대기선 바닥에 보행신호를 점등하는 보조장치)을 설치장소별로 한 행씩 담은 목록으로, 설치장소명·시·동·번지 주소, 준공일자, 위도·경도, 관리기관명을 담는다. 구리시 주민이나 교통안전 분석가가 '우리 동네 어느 횡단보도에 바닥형 보행신호등이 있고 언제 설치됐나'를 확인하거나 설치 위치를 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 위도·경도 좌표나 동·번지 주소를 매칭하는 방식으로 연결한다(예: 횡단보도·어린이보호구역 위치 데이터와 공간 결합)."
description_portal: 횡단보도 대기선 바닥에 보행신호를 점등하여 보행자에게 추가적인 신호정보를 제공하여, 보행 편의와 교통사고 방지에 기여하고자 하는 바닥형 보행신호등 정보를 제공합니다.설치 횡단보도 위치명, 주소 , 설치 일자, 위도, 경도, 관할 관리청 등
