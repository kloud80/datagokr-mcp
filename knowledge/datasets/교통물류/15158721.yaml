summary_user: 여수광양항만공사가 제공하는 선박 입항 이력 API로, 입항 건별로 항만명·호출부호·선박명·입항연도·일련번호·대리점·외항/내항 구분·입항일자·출항지·차항지·접안 위치·시설명 등 18개 항목을 담는다. 해운 분석가나 대리점 실무자가 특정 선박이 언제 어디서 와서 어느 선석에 접안했고 다음에 어디로 가는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 Port-MIS 입출항 데이터와는 호출부호·선박명·항만 코드 같은 이름·코드 매핑으로만 연결한다.
description_portal: 「입항정보」 데이터는 선박의 입항 이력을 기록한 자료로, 항만명(PRT_NM), 호출부호(CALL_LETTER), 선박명(VSSL_NM), 입항연도(YR), 일련번호(SER_NO), 대리점(AGENT_NM), 구분(외항/내항), 입항일자(ARVL_DT), 출항지(DEP_PRT_NM), 차항지(NXT_PRT_NM), 접안 위치 코드(BERTH_PLC_CODE_1/2), 시설명(FACIL_NM) 등 총 18개 항목으로 구성되어 있습니다.이 데이터는 선박의 입항 경로 및 일정, 대리점 관리, 접안 시설 운영을 파악하는 데 중요한 기초 자료입니다. 특히 출발지·도착지와의 연계 정보는 국제 해운 네트워크 분석에 활용할 수 있으며, 입출항 정보와 결합하면 항만의 물동량 흐름과 운영 효율성을 종합적으로 평가할 수 있습니다.
