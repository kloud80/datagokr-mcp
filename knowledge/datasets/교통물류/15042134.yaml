summary_user: 한국철도공사가 운영하는 광역철도 노선별로 전체 역 수, 승강장안전문(스크린도어) 설치역 수, 밀폐형·반밀폐형·미설치역 수를 담은 노선 단위 집계 파일(csv, 951 bytes)이다. 철도 안전 분석가나 지자체·언론이 '어느 노선에 스크린도어 미설치역이 많은가, 설치율은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 역·노선 마스터나 다른 철도 통계와는 운영기관명·노선명을 이름으로 맞춰 이어 쓴다.
description_portal: 한국철도공사_승강장안전문 설치현황 데이터는 광역철도 각 노선 및 역사별로 승강장안전문(스크린도어) 설치 관련 현황을 제공하는 자료입니다. 데이터에는 운영기관, 노선명, 해당 노선을 지나는 전체 역수, 승강장안전문이 설치된 역 수(설치역소계), 그리고 설치 유형별로 밀폐형, 반밀폐형, 미설치 역의 수가 포함되어 있습니다. 이로 인해 각 노선별로 안전문이 어떻게 설치되어 있는지, 설치되지 않은 역이 어디인지, 설치 형태가 어떻게 분포되어 있는지를 상세히 알 수 있습니다.이 데이터를 통해 노선별로 승강장안전문 설치율과 미설치 구간 현황을 명확히 파악할 수 있습니다. 밀폐형과 반밀폐형 안전문의 수를 통해 안전문 종류별 도입 현황을 비교할 수 있으며, 특정 노선이 다른 노선에 비해 안전문 도입이 선진적으로 이루어졌는지, 또는 미설치 역이 많은 구간이 어디인지 등도 쉽게 분석 가능합니다. 이를 바탕으로 각 노선의 안전 개선 필요성, 이용자 안전 확보 현황, 정책 추진의 효과 및 지원이 미흡한 지역의 특성 등을 유추할 수 있습니다.이 자료는 철도 시설의 안전 기반 현황 파악, 노선별 시설 개선 정책 수립, 이용자 안전 수준 분석, 언론 보도용 안전 실태 확인, 지방자치단체의 시설 투자 기획 및 보고서 작성, 공공기관 정책 논의, 그리고 이용자 안전 관련 사회단체·연구기관의 비교·분석 자료로 폭넓게 활용될 수 있습니다. 안전문 설치 현황은 철도 이용자 안전과 직결되므로, 각종 정책 수립과 예산 배분, 대외적 평가 등에서 신뢰성 높은 참고자료로 쓰일 수 있습니다.
