summary_user: 한국도로공사가 관리하는 고속도로 터널 안에서 2022년부터 발생한 교통사고를 사고연도·노선명·사고발생이정·기종점명·터널명·사고원인 항목으로 담은 전국 단위 파일(csv, 약 16KB)이다. 도로 안전 분석가나 정책 담당자가 '어느 노선의 어느 터널에서 어떤 원인의 사고가 자주 나는가'를 따져 위험 터널 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 노선명·터널명 같은 이름 매칭이나 같은 기관 자료와의 연결로만 이어 쓴다.
