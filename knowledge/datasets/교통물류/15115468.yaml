summary_user: 울산광역시 북구에 있는 일반화물자동차운송사업자를 업체별로 한 행씩 담은 원천 목록으로, 사업소명·면허종류·주소·현재 운영여부를 담는다(CSV 약 5.8KB). 화물 운송을 맡길 사업자를 찾는 사업자나, 북구 안 화물운송업체의 분포와 영업·폐업 현황을 보려는 분석가가 "북구에서 지금 운영 중인 일반화물 운송사는 어디인가" 같은 질문에 쓴다. 전역 조인 키는 없어서, 허가 여부의 기준인 전국화물자동차운송사업자표준데이터 등 다른 자료와는 업체명·주소를 맞춰 이어 쓴다.
