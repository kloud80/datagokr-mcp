description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)에 신고된 외항 및 내항 화물의 운임 요금에서 화물 보안료 내역을 산출하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 외항화물신고 및 내항화물신고 호출부호별 입항년도, 입항횟수, 화물구분, 보안료 등으로 구성되어 있습니다.   화물보안료산출정보 데이터는 항만 운영기관이 화물 운송 과정에서 보안 관련 요금 집행 내역을 파악하거나, 화주 및 물류기업이 각 운송 경로별 보안료 부담 현황을 분석하는 데 활용될 수 있습니다. 또한 관련 정책 입안 과정에서 보안료 산출 체계 및 변동 추이를 검토하는 근거 자료로도 활용할 수 있습니다.
