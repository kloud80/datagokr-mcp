summary_user: 김해시 공공자전거의 대여 한 건마다 자전거번호, 대여·반납 일시, 대여·반납 대여소명과 거치대, 이용시간을 담은 건별 원천 이력 파일이며, 범위는 김해시 한 시군구다. 교통 분석가나 시 담당자가 어느 대여소에서 어느 대여소로 언제 많이 이동하는지, 시간대별 대여 수요와 평균 이용시간이 어떤지를 따질 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 대여소명을 김해시 공공자전거 대여소 위치 정보 등과 이름으로 맞춰 이어 쓴다.
