summary_user: 한국도로공사 차종분류장치(AVC)가 감지한 고속도로 지정차로제 위반을 15분 단위로 집계한 데이터로, 노선·콘존(구간)·방향·차로·차종별 전체교통량과 위반교통량을 전국 범위로 담는다. 교통 분석가나 정책 담당자가 '어느 고속도로 구간·시간대·차로에서 어떤 차종의 지정차로 위반이 많은가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 노선번호·콘존ID 같은 한국도로공사 자체 코드나 출발·도착 노드 이름과 위경도를 통해 같은 기관의 고속도로 데이터나 도로망 자료와 이름·좌표로 맞춰 이어 써야 한다.
