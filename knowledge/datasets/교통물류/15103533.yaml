description_portal: '본 데이터는 한국도로공사가 고속도로 지정차로제 위반 현황을 파악하기 위해 수집한 자료로, 차종분류장치(AVC: Automatic Vehicle Classification)를 기반으로 한다.  고속도로 지정차로제는 도로의 효율적 운영과 교통 안전을 위해 특정 차로를 특정 차종에 한정하여 운행하도록 정한 제도이다.  데이터는 15분 단위로 수집되며, 위반 차량의 통행 시간, 위치, 차종, 위반 유형 등의 정보가 포함되어 있다.  이를 통해 사용자는 고속도로 내에서 지정차로제 위반 현황을 시간대 및 구간별로 분석할 수 있으며,  교통 정책 수립, 안전성 평가, 법규 준수 현황 파악 등 다양한 분야에서 활용 가능하다.  데이터는 CSV 형식으로 제공되며, 정기적으로 갱신되어 최신 위반 정보를 반영한다.* 기상 여건 등으로 차종 분류 장치(AVC)의 감지 데이터에 대한 오류 발생이 일부 있을 수 있습니다.* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000043'
