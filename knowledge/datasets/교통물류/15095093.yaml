summary_user: 인천국제공항에 운항하는 여객기의 조회 당일 운항 현황을 항공편 한 편 단위로 담는 실시간 API로, 예정·변경 시각, 출발지·경유지 공항, 게이트·수하물수취대·출구 번호, 코드쉐어 여부, 현황(결항·지연 등)을 다국어로 제공한다. 여행객이나 마중 나가는 사람이 '오늘 이 편명이 몇 시에 어느 터미널·출구로 도착하나, 지연되거나 결항됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 운항·공항 데이터와는 편명(flightId)이나 IATA 공항·항공사 코드를 이름·코드 매핑해 이어 쓴다.
description_portal: 인천국제공항에 운항하는 여객기 항공편의 당일 운항 현황에 대한 다국어 데이터로 조회시간, 출발지 공항(IATA ) 편명, 항공사(IATA)를 기준으로 항공기 운항 타입, 항공사 한글명, 편명, 예정시간, 변경시간, 출발지공항, 도착게이트 번호, 수하물수취대 번호, 도시코드, 코드쉐어, 마스터편명, 출구 번호, 현황 코드, 출발공항코드(IATA),터미널,소요시간,경유지 공항코드, 경유지공항이름 등을 제공합니다. 조회 당일에 대한 데이터를 제공합니다. 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 1000000트래픽을 제공합니다.
