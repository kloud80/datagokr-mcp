summary_user: 대구광역시 시내버스의 정류소별·월별 이용자 수를 승차·하차로 나눠(구분) 05시부터 23시까지 시간대별로 담은 집계 파일이며, 포털 설명상 2024~2025년 교통카드 단말기 이력 기반의 평균값이다. 교통 분석가나 사업자가 '이 정류소는 출퇴근 시간대에 승차와 하차 중 어느 쪽이 몰리는가'처럼 정류소 혼잡 시간대와 상권 유동 인구를 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 정류소ID나 정류소명을 같은 기관의 정류소 위치·노선 자료와 맞춰 이어 쓴다.
description_portal: 대구광역시에서 제공하는 2024-2025년 시내버스 정류소별 시간대별 평균 이용자 수 자료입니다. 년월, 정류소명, 정류소ID,  구분, 시간대별 승하차인원 등의 내용이 포함된 CSV 파일형식의 자료입니다.정류소ID는 정류소별로 부여된 고유식별번호이며, 승차인원 및 하차인원은 버스 내에 설치된 승차 및 하차 단말기의 교통카드 통신이력을 기반으로 제공해 드리고 있습니다.추가로 궁금한 사항이 있으시면 대구광역시 교통정보운영과(☎053-803-6861)로 연락해주시기 바랍니다.
