summary_user: 노선별로 경유하는 정류장마다 이용자유형·시간대별 승차·하차 인원수를 담는 교통카드 기반 이용량 API이며, 시도·시군구·읍면동 단위 전국 범위로 전체 905건이 확인된다. 분석가나 지자체 담당자가 특정 노선의 어느 정류장·시간대에 승객이 몰리는지 확인하는 질문에 쓴다. 시군구코드(sgg_cd)와 정류장ID(sttn_id)를 조인 키로 다른 정류장·노선 데이터와 이어 쓰며, 노선ID(rte_id)는 키로 확인되지 않았다.
description_portal: 노선별 경유 정류장별 일간 이용량 정보는 특정 노선과 정류장을 기준으로 승객 이용 데이터를 일 단위로 집계하여 교통 운영 최적화 및 정책 개선에 활용되는 핵심 자료입니다. 이 데이터를 통해 노선별 수요에 따른 배차 간격 조정, 정류장 시설 개선, 혼잡 시간대 관리가 가능하며, 교통카드 데이터를 기반으로 시계열 분석, 공간 분석, 인구통계 분석, 비용 정산 및 수요 예측 등 다양한 정밀 분석이 수행됩니다. 이를 통해 정책 근거 마련, 서비스 품질 향상, 대중교통 접근성 제고 및 예산의 효율적 운용에 기여할 수 있습니다.
