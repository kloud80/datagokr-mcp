summary_user: 서울시 공공자전거 따릉이 대여소별 이름·관리번호(RENT_ID)·주소·위도경도 좌표·거치대 수를 대여소 한 곳당 한 행으로 담은 현황 목록이다. 시민이 가까운 따릉이 대여소 위치와 거치 규모를 확인하거나, 분석가가 자치구·지역별 대여소 분포와 거치대 공급량을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 따릉이 대여 이력·실시간 잔여 데이터와는 대여소 관리번호·이름 매핑으로 잇고, 다른 공간 데이터와는 위도·경도 좌표로 겹쳐 쓴다.
description_portal: 서울특별시 공공자전거 대여소(따릉이) 현황정보입니다. 대여소의 이름, 관리번호, 위치정보와, 거치대수 정보를 제공합니다.서울특별시 공공자전거 따릉이 대여소 현황정보 데이터는 시민들이 보다 편리하게 자전거를 이용할 수 있도록 각 대여소의 기본 정보를 체계적으로 정리한 자료이다. 이 데이터에는 대여소의 이름과 고유 관리번호, 정확한 위치정보(좌표 및 주소), 그리고 자전거를 보관할 수 있는 거치대 수가 포함되어 있다. 이를 통해 이용자는 가까운 대여소의 위치와 수용 규모를 쉽게 확인할 수 있으며, 운영 측면에서는 대여소별 수요와 공급을 분석하여 효율적인 자전거 배치와 시설 확충 계획을 수립할 수 있다. 또한 도시 교통 인프라 개선과 친환경 이동수단 활성화를 위한 기초자료로도 활용되는 중요한 공공데이터이다.
