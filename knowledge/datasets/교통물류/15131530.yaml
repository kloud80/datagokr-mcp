summary_user: 진주시 지능형교통체계(ITS)에서 수집한 교통정보를 가공구간 단위로 묶어, 구간별 통행량 합계와 평균속도, 구간의 시작·종료 노드 ID를 담는 API입니다. 진주 시내 도로를 분석하는 사람이 "지금 어느 구간이 느리고 통행량이 많은가"를 확인하는 데 쓰고, 조회 결과를 계속 쌓으면 상습 정체 구간 분석의 원장이 됩니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 구간명이나 노드 ID를 이름·코드로 맞춰 보거나 같은 기관 코드로만 연결합니다.
limits: 과거 이력은 직접 쌓아야 하며, 응답만으로는 장기 추세를 볼 수 없습니다. 개발계정은 하루 100회로 호출이 제한되고, 범위는 진주시 한 곳이며 좌표 같은 공간 정보는 없습니다.
