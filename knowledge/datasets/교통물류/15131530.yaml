description_portal: 경상남도 진주시 지능형교통체계(ITS) 시스템에서 수집된 교통 정보를 기반으로 가공한 데이터입니다. 본 데이터는 가공구간ID와 가공구간명을 중심으로 구간별 통행량 합계, 평균속도 등 핵심 교통 흐름 지표를 제공하며, 시작노드ID와 종료노드ID를 포함해 각 구간의 구조적 연결 정보를 함께 제공합니다. 이를 통해 도심 내 주요 도로 구간의 교통량 변화와 속도 패턴을 정밀하게 파악할 수 있으며, 교통 혼잡도 분석, 구간별 운영 효율성 진단, 신호체계 조정, 도로 교통 정책 수립 등 다양한 행정적·연구적 활용에 적합한 데이터로 구성되어 있습니다.
