services:
  - op: /status
    name: 교통소통 정보 조회
    endpoint: https://apis.data.go.kr/5310000/traffic_status/status
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: dataType
        required: false
        example: json
        desc: 데이터 타입
      - name: timePeriod
        required: false
        example: 1D
        desc: 데이터 적재 시간 단위(1일 1D, 1시간 1H, 5분 5M)
      - name: startDate
        required: true
        example: '20240801'
        desc: 시작 날짜
      - name: endDate
        required: true
        example: '20240802'
        desc: 종료 날짜
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 100
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
