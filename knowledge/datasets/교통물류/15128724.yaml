summary_user: 서울교통공사 1~8호선에서 외국인 관광객 전용 기간권(MPASS 관광권, 1·2·3·5·7일권)의 승차·하차 건수를 업무일자·시간대·호선·역별로 집계한 파일이며, 포털 설명상 2025년 1월~6월분을 담는다. 관광·상권 분석가가 외국인 관광객이 어느 역에서 어느 시간대에 많이 타고 내리는지, 사용일수별로 이용 양상이 어떻게 다른지를 볼 때 쓴다. 전역 조인 키는 없어서 다른 역별 승하차 통계나 역 위치 데이터와는 호선·역명을 이름으로 맞춰 이어 쓴다.
description_portal: 서울교통공사 1-8호선 외국인 관광객 기간권 일별 통행통계 데이터 입니다. 연단위로 데이터가 업로드 되며, 데이터는 연번, 업무일자, 시간대, 호선, 역명, 교통카드구분, 사용자구분, 사용일수구분, 승하차건수 로 이루어져 있습니다.외국인 관광객 기간권은 사용일수가 1,2,3,5,7일 로 구분된 외국인 관광객 전용 교통카드(MPASS관광권) 입니다. (2025년 1월 ~ 2025년 6월 데이터 입니다.)Mpass는 국토부, 서울시가 외국인 관광객들의 편리한 대중교통 이용을 위해 출시한 외국인 전용 교통카드입니다.
