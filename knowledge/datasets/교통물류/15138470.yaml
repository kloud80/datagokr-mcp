summary_user: 성남시에서 노선버스를 운행하는 버스운수회사별로 회사명·대표자명·소재지주소·전화번호·버스인가대수를 한 행씩 담은 목록 파일이며, 시군구 범위의 2KB 남짓한 작은 CSV입니다. 성남시 대중교통 정책 담당자나 분석가가 "성남시에 버스회사가 몇 곳이고 각 회사가 인가받은 버스는 몇 대인가"를 확인할 때 쓴다. 전역 조인 키가 없어 정류장·노선 원장이나 실시간 도착 데이터와는 운수회사명 같은 이름 매칭이나 소재지주소 기반으로만 이어 쓴다.
description_portal: 성남시 버스운수회사 현황으로 운수회사명, 대표자명, 소재지주소, 전화번호, 버스인가대수, 데이터기준일자 항목으로 구성됨. 버스운수회사는 시내버스, 마을버스, 광역버스 등 노선버스를 운행하는 운송사업자를 말합니다. 이들은 일정 구간(노선)에 대해 지자체로부터 운송사업 면허를 받아, 시민들에게 대중교통 서비스를 제공하며, 지역 대중교통망의 핵심 역할을 수행합니다. 이런 데이터는 교통정책 수립, 도시계획, 공공교통 개선 전략 수립 등에 매우 중요합니다.예를 들어, 특정 시·도에서 버스 운수회사 수가 감소하는 추세라면 지역 교통공백이 발생할 수 있어 ‘운수회사 현황 데이터’가 이를 미리 알려주는 지표가 됩니다.
