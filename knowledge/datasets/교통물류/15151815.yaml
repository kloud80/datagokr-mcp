summary_user: 전국 철도·지하철역에 설치된 물품보관함, 무인민원발급기 같은 무인 편의시설을 역·시설별로 담은 현황 파일로, 운영기관·노선·역명과 함께 지상/지하 구분, 역층, 상세위치, 시설 수, 크기, 이용요금을 기록한다. 승객이 '이 역에 큰 짐을 맡길 보관함이 있고 요금은 얼마인가'를 확인하거나, 서비스 개발자가 역내 편의시설 안내·지도 앱에 위치 정보를 넣을 때 쓴다. 전역 조인 키나 역 코드가 없어 다른 역 데이터와는 운영기관명·노선명·역명 같은 이름을 맞춰 이어 붙여야 한다.
description_portal: 이 데이터는 전국 철도 및 지하철역에 설치된 **"무인 편의시설"**의 현황을 상세히 담고 있는 자료입니다. 국토교통부에서 제공하며, 역사를 이용하는 승객들이 필요로 할 수 있는 다양한 무인 서비스를 쉽게 찾을 수 있도록 돕습니다.주요 시설로는 물품보관함(라커), 무인민원발급기 등이 있으며, 각 시설의 정확한 **상세 위치(역층, 출입구 근처 등)**와 시설 수량, 이용 요금까지 구체적으로 명시되어 있습니다. 특히 물품보관함의 경우, "소/중/대"와 같은 크기 정보도 포함하여 실용성을 높였습니다.이 자료는 역내 편의시설 안내 서비스, 모바일 지도 앱과의 연동, 또는 역사 내 공간 활용 계획 수립 등 다방면으로 활용될 수 있는 유용한 데이터입니다.
