summary_user: 서울 영등포구가 2017년 6~7월에 시행한 노후·불량 도로 정비 공사를 위치(도로명) 단위로 한 줄씩 담은 소규모 원천 목록(CSV 약 4KB)으로, 아스팔트·보도블록 포장, 측구, 경계석 정비의 폭과 연장, 공사 시작·종료일을 담는다. 구청 도로 담당자나 분석가가 당시 어느 구간을 어떤 방식으로 얼마나 정비했는지 확인하고 향후 유지보수 대상과 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(도로명) 문자열을 주소·도로명 정보와 맞추거나 같은 영등포구 자료끼리만 이어 쓴다.
limits: 2017년 한 차례 정비 사업 시점에 만들어진 이벤트성 자료로 이후 갱신되지 않으므로 현재 도로 상태나 진행 중인 공사 파악에는 쓰지 못한다. 범위는 영등포구 한 곳뿐이고 좌표가 없어 지도 결합에는 도로명 매칭이 필요하다. 포털 설명의 항목명(콘크리트·혼합포장 등)과 실제 컬럼(보도블록·측구·경계석)이 다르므로 컬럼 기준으로 해석해야 한다.
