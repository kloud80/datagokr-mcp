summary_user: 부산광역시 교통정보서비스센터가 DSRC 수집장치로 모은 통행 정보를 세부 구간별로 가공한 속도 자료로, 가공일시·구간명·시점·종점·시속을 행 단위로 담은 CSV 파일(약 16MB)이다. 교통 분석가나 시민이 부산 시내 특정 구간이 어느 시간대에 얼마나 느려지는지, 상습 정체 구간이 어디인지 살피는 데 쓰며, 월별 파일을 쌓으면 정체 이력 분석의 기초 자료가 된다. 전역 조인 키가 없어 다른 교통 데이터와는 구간명·시점·종점 이름을 맞추거나 같은 부산시 자료의 코드로만 이어 쓴다.
