description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 2006년 1월부터 최근까지의 대구도시철도 1, 2, 3호선 전 역사에 대한 월별 하차인원 통계입니다.역별 이용현황을 월 단위로 집계한 자료로, 주요 항목은 역명, 연도, 월, 하차인원으로 구성되어 있습니다.장기간에 걸친 누적 데이터를 기반으로 하여 도시철도 하차 수요의 변화 추이, 연도별 역세권 유동인구 흐름, 특정 시점의 정책 및 도시계획의 효과 분석 등에 유용하게 활용할 수 있습니다.또한 상권 변화 분석, 환승 수요 파악, 민간 교통 플랫폼 및 상업 서비스 기획 등 다양한 공공 및 민간 분야에서 참고자료로 활용 가능합니다. 본 데이터는 월 1회 정기적으로 갱신됩니다.'
