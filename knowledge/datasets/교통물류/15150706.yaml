summary_user: 경찰청이 제공하는 교통안전 위험요소 중 급커브(굽은도로) 지점 정보를 전국 범위로 담으며, 지점별로 지번·도로명 주소, 위경도(LAT·LOT), 위험요소 분류코드, 탐지 기준일자, 상세 내용 등이 들어 있다. 운전자나 교통안전 분석가가 특정 지역이나 경로에 급커브 위험 구간이 어디 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·좌표나 이름 매칭으로 이어 쓰며, 같은 재난안전데이터 공유플랫폼의 다른 도로환경별 위험요소 데이터와는 분류코드 체계로 함께 볼 수 있다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별:급커브(굽은도로)는 경찰청에서 제공하는 정보입니다.
