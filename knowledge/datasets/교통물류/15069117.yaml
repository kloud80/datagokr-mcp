summary_user: 대구광역시 구·군과 도시관리본부·시설관리공단 등이 관리하는 자전거도로를 노선 한 건씩 담은 원천 목록으로, 노선명·시군구·기점과 종점 위치·총길이(km)·주요 너비(m)를 시군구 단위로 담는다. 시민이 "우리 구에 자전거도로가 어디서 어디까지 몇 km 나 있나"를 확인하거나, 분석가가 구·군별 자전거도로 연장과 폭원을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 이름 매칭으로만 붙이며, 공공자전거 대여소나 사고 통계 등 같은 지역의 다른 데이터와 시군구 이름으로 엮어 본다.
description_portal: 대구시 자전거도로는 대구시 도시관리본부, 대구시설관리공단, 중구, 동구,  서구, 남구, 수성구, 북구, 달서구, 달성군, 군위군 11개 기관에서 유지 관리하고 있는 현황 자료로써 자전거도로 노선, 시종점 위치, 자전거도로 연장, 자전거도로 폭원(주요 폭원)에 대한 자료를 제공합니다. 도심내에는 인도에 분리형 또는 겸용으로 설치된 생활형 자전거도로로 조성된 반면 금호강, 낙동강, 신천을 따라 조성된 자전거 도로의 경우 전용도로, 분리형으로 조성된 구간이 많아 안전하게 자연을 즐기며 레저를 즐기기에 좋습니다.
