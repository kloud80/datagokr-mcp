description_portal: '서울특별시 송파구의 LPG충전소 목록과 부지면적에 관한 데이터입니다. LPG충전소 목록에 대한 데이터를 포함하고 있습니다.영업 중인 송파구 LPG 충전소 데이터를 제공합니다.(지역, 업소명, 충전소 주소, 충전소 전화번호, 관리구분, 충전소 부지면적)[데이터 변경 안내]1. 지역 : 서울특별시 송파구2. 업소명 : 잠실LPG충전소, 오금가스충전소, 홍익에너지(주), 송파충전소3. 주소 : 업체별 주소 안내4. 전화번호 : 업체별 전화번호 안내5. 관리구분 : 자동차 충전6. 부지면적 : 업체별 충전시설 부지면적 안내'
