description_portal: '[데이터 설명: 경기도 구리시 주정차 단속 사전 알림서비스 발송 현황]1. 개요 및 목적본 데이터는 경기도 구리시에서 운영하는 **‘주정차 단속 사전 알림 서비스’**의 운영 실적을 담은 상세 현황 정보입니다. 구리시 내 주정차 금지구역에 주차된 차량이 고정식·이동식 CCTV 등에 의해 1차 단속 촬영되었을 때, 차주에게 단속 사실을 미리 알려 자발적인 차량 이동을 유도하고 원활한 교통 흐름을 확보하기 위해 발송된 알림 내역을 제공합니다.2. 데이터 구성 항목 (컬럼 정보)이용자가 분석에 즉시 활용할 수 있도록 다음과 같은 핵심 정보를 포함하고 있습니다.단속날짜: 주정차 위반으로 1차 촬영이 발생한 구체적인 일자단속구분: 단속이 이루어진 방식발송구분: 가입자에게 안내된 알림의 형태단속위치: 불법 주정차가 발생한 구리시 내 상세 위치 또는 도로명발송결과: 안내 메시지가 사용자에게 성공적으로 도달했는지 여부3. 데이터 범위 및 기준시간적 범위: 2024년 1월 1일부터 2026년 3월 31일까지의 누적 데이터공간적 범위: 경기도 구리시 관내 주정차 금지구역 전체데이터 기준일자: 2026년 3월 31일 (최신성 반영)'
