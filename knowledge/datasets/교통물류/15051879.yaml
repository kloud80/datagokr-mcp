summary_user: 서울시 공공자전거(따릉이) 이용 중 접수된 고장신고를 건별로 담으며, 신고된 자전거 번호(bikeNo), 신고 등록일시, 고장 유형을 제공한다. 운영·정책 분석가가 어떤 고장이 어느 시기에 자주 신고되는지, 특정 자전거가 반복 신고되는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자전거 번호나 고장 유형 이름 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 서울특별시 공공자전거 고장신고 내역 데이터로 고장신고된 공공자전거의 자전거번호, 등록일시, 고장구분의 내용을 제공합니다. 서울특별시 공공자전거 고장신고 내역 데이터는 따릉이 이용 중 발생한 자전거의 이상 상태를 체계적으로 관리하기 위해 수집된 정보이다. 이 데이터에는 고장신고된 자전거의 고유 번호, 신고가 접수된 등록일시, 그리고 고장의 유형을 구분하는 항목이 포함되어 있어 유지보수 및 운영 효율성을 높이는 데 중요한 역할을 한다. 이를 통해 관리자는 특정 시점에 어떤 종류의 고장이 자주 발생하는지 분석할 수 있으며, 신속한 수리 및 점검이 가능해진다. 또한 이용자 안전 확보와 서비스 품질 향상에도 기여하며, 장기적으로는 공공자전거 운영 정책 수립과 개선 방향 설정에도 활용될 수 있는 중요한 공공데이터이다.
