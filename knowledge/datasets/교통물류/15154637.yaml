description_portal: 국가철도공단_계약 상세정보 데이터는 국가철도공단이 수행하는 각종 공사, 용역, 조달 등 사업에서 발생하는 계약 내역을 세부적으로 관리하기 위해 구축된 데이터입니다. 각 거래를 고유하게 식별할 수 있는 거래일자, 거래번호와 함께, 관련 거래번호를 통해 계약 간 연계 관계를 확인할 수 있습니다. 또한 그룹번호를 활용하여 유사 계약이나 사업 단위별로 묶어서 분석할 수 있습니다. 이 데이터에는 계약명과 발주예산 정보(원금액 및 거래금액), 실제 지급금액, 보증금 내역(원금액 및 거래금액)과 같은 금액 관련 정보가 포함되어 있으며, 각 계약이 수행되는 현장 정보도 함께 제공됩니다. 아울러 집계 계산을 위한 소계 항목으로서 집계_소계_분자 및 집계_소계_분모를 포함하고 있어, 계약별 예산 대비 집행 현황을 정확하게 파악할 수 있습니다.
