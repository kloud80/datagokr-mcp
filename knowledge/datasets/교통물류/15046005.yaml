summary_user: 상주교통안전체험교육센터에서 운영하는 교통안전 체험교육 프로그램을 과정별로 정리한 소규모 목록 파일(csv, 약 2.7KB)로, 교육과정명·대상 차종·교육일·교육시간·정원·교육비·숙박 여부를 담는다. 운전자나 운수사업자가 "내 차종에 맞는 체험교육 과정은 며칠짜리이고 교육비와 숙박은 어떻게 되나"를 확인하거나, 분석가가 체험교육 과정 구성을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 과정명·차종 같은 이름 매칭이나 같은 기관(한국교통안전공단) 데이터로만 느슨하게 이어 쓴다.
description_portal: '- 한국교통안전공단 상주교통안전체험교육센터는 2009년 설립 이래 교통사고로부터 발생되는 국민의 생명과 재산을 보호하기 위해 기존의 이론교육에서 탈피한 현장 실습 위주의 안전운전 체험교육과 저탄소 녹색성장을 위한 에코드라이빙 교육 등 교통사고 사상자 줄이기에 최선을 다하고 있습니다. - 체험교육 수료생 대상 전 후 1년 분석 결과 교통사고 발생 건수가 50%이상 감소한 것으로 나타나 사고 감소에 기여하고 있다는 결과가 나왔습니다. - 이처럼 교통 사고 감소에 기여하고있는 상주교통안전체험교육센터에서 운영 중인 교육 프로그램 별 교육 시간, 교육비 등 교육 관련 정보를 간략하게 제공하는 데이터입니다.'
