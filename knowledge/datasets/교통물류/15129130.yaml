description_portal: 'TACAN(전술 항법 장비) 은 VOR과 DME 기능을 통합한 군용 항법시설로, 군용 항공기에 고정밀 방향 및 거리 정보를 제공합니다.일부 민간 항공기에서도 거리 정보(DME) 를 수신하여 활용할 수 있으며, 이는 항공기의 정확한 위치 확인과 항행 안전 확보에 기여하는 주요 항행안전시설입니다.공항식별자, 공항명, 식별자 ,전술항법장비명 ,좌표에 대한 정보를 제공하고 있습니다. 좌표 표기 방식은 다음과 같습니다N (North): 북위를 의미하며, 위도 정보를 나타냅니다.E (East): 동경을 의미하며, 경도 정보를 나타냅니다.'
