summary_user: 수도권 광역전철 역 간 여객 상호발착 수송량을 출발역(행)×도착역(열) 행렬 형태로 집계한 파일로, 서울·용산·청량리·왕십리·수서·덕소 등 경부·경원·중앙·분당선 축의 역들이 열로 나열된다(CSV 약 724KB). 교통 분석가나 상권 조사자가 '청량리에서 출발한 승객이 어느 역에서 가장 많이 내리는가'처럼 역 간 이동 집중 구간과 환승 허브를 파악하는 데 쓴다. 실측 컬럼에 표준 역코드 같은 전역 조인 키가 없어 다른 승하차·역 시설 데이터와는 역 이름 매핑으로만 이어 쓴다.
limits: 역 코드 없이 역 이름 열로만 구성되어 있어 다른 데이터와 붙이려면 역명 표기를 직접 맞춰야 한다. 포털 설명에 시간대별 분석 가능성이 적혀 있으나 필드에는 시간·기간 열이 확인되지 않으므로, 시간대·시기별 패턴 분석에 쓸 수 있는지는 파일을 열어 확인해야 한다.
