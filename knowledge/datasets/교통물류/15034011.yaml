description_portal: 부산광역시_구·군별 주요도로 방사선 탐지결과 데이터를 개방합니다. 주요도로에서 탐지되는 방사선은 자연적 방사선이라고 볼 수 있는데 도로의 경우 도로포장재에 포함된 자연 방사선 물질에 의해 방사선이 발생할 수 있습니다. 높은 농도의 방사선은 인체에 해로워 이를 모니터링하는 것이 중요합니다. 방사선에 노출될 경우 구토, 피부손상, 탈모, 백혈병, 갑상선암 등의 질병이 발생할 수 있습니다. 개방되는 데이터에는 조사년월, 탐사기관, 측정일자, 경로, 방사선최저, 방사선최고, ㄷ데이터 기준일자가 포함되어 있습니다.
