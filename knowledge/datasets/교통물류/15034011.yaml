summary_user: 부산광역시 구·군별 주요도로에서 측정한 방사선 탐지결과를 측정 건별로 담으며, 조사연월·탐사기관·측정일자·측정 경로와 방사선 최저·최고값을 포함한다. 시민이나 환경·안전 분석가가 "우리 동네 주요도로의 도로포장재 방사선 수준이 어느 정도이고 경로별로 차이가 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 경로명(rshPlc) 같은 이름 매핑이나 같은 기관 데이터로만 이어 쓸 수 있다.
limits: 공간 좌표나 표준 행정코드가 없어 지도 표시나 다른 데이터와의 자동 결합은 이름 매핑에 의존해야 한다. 범위는 부산광역시 한 시도에 한정되며, 호출에는 포털 활용신청 후 받은 serviceKey가 필요하다(개발계정 일 10,000회).
