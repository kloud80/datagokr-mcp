description_portal: 한국교통안전공단에서 제공하는 정보입니다. 해당 정보는 지방자치단체에서 관리하는 정보를 수집하여 취합 제공하는 정보입니다. 주차상한제에 대해 제공하는 정보입니다. 각 지방자치단체(시도, 시군구)에서 시행하는 주차상한제의 정보로 각 지방자치단체에서 조례로 지정한 주차상한제의 지정지역과 실제로 지정된 지역, 제한기준 등에 대하여 제공하고 있습니다. 2023년에 지방자치단체에서 취합한 정보로 2022년도 말 까지의 정보를 제공하고 있습니다. 시도 코드, 시군구 코드는 행안부의 행정표준코드를 준수합니다.
