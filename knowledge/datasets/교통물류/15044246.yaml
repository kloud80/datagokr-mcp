summary_user: 서울교통공사 구간 역별 일평균 환승유입인원과 그 순위를 담은 집계 파일로, 2025년 12월 기준 286행이다. 환승유입은 하차인원 중 승차호선이 다른 인원이라, 어느 역에 환승객이 몰리는지 알고 싶은 분석가나 역 주변 상권을 보는 사업자가 쓴다. 호선·역번호·역명 컬럼이 있어 같은 기관의 다른 역 단위 승하차 자료와 이름이나 역번호로 이어 쓰되, 전역에서 통하는 공통 조인 키는 없다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 역명·코드 매핑이나 같은 기관 코드로만 연결된다. 시간대별 값이 아닌 일평균 순위이며, 포털 설명상 서울교통공사 관할 구간만 포함하므로 다른 기관 관할 구간 역은 빠져 있다.
