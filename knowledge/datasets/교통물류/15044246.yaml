description_portal: 서울교통공사의 일평균 환승유입순위 데이터입니다. 해당 데이터는 순위, 해당호선, 역번호, 역명, 환승유입인원수 데이터를 포함하고 있습니다. 2025년 12월 기준 데이터입니다. 환승유입인원은 하차인원 중에서 승차호선이 다른 인원을 의미합니다. 자구간 유입인원과 타구간 유입인원 모두를 포함합니다.1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 7호선의 경우에는 까치울~부평구청 구간은 2022년 인천교통공사로 이관되었음을 알려드립니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
