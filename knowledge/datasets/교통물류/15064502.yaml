summary_user: 한국교통안전공단 DRT지원시스템을 쓰는 지자체별로 수요응답형 교통(DRT)에 등록된 택시·버스 대수를 시도·시군구 단위로 집계한 연말 기준(2025.12) 현황 파일이며, 범위는 전국 시군구다. 교통정책 담당자나 분석가가 '우리 지역과 비슷한 농촌 시군에서는 DRT를 택시형과 버스형 중 어느 쪽으로 몇 대나 운영하는가'를 비교할 때 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: 한국교통안전공단 수요응답형대중교통(DRT) 시스템 지자체별 등록대수 현황(2025.12 기준) 자료입니다. 시도, 시군구, 택시, 버스의 컬럼명으로 구성되어 있고, 연말 기준으로 한국교통안전공단의 DRT 시스템을 사용중인 지자체별 택시, 버스사용 현황 자료입니다. DRT는 수요응답형교통수단을 의미하는데, 노선 버스 등의 대중교통이 잘 다니지 않는 곳에 거주하시는 분들이 필요에 따라 호출하여 이용할 수 있는 준대중교통의 역할을 수행하고 있습니다. 이 데이터에서 제공하는 자료는 농촌형 및 도시형 교통모델이 대부분이며, 호출과 자동배차가 이루어 지는 플랫폼형 DRT를 포함하지 않습니다. 데이터는 한국교통안전공단에서 운영중인 DRT지원시스템을 사용하는 지자체의 현황자료만을 포함하고 있으며, 지자체가 보조금을 통해 운영하는 택시형 DRT 또는 버스형 DRT를 대상으로 하므로 해석상에 주의를 요합니다.
