summary_user: 서울지하철의 역별 열차 시간표를 열차 단위로 담은 조회용 API로, 상하행·주말 구분, 출발·도착역과 시각, 급행·임시시간표 여부를 제공하며 전체 1,404건이다. 승객이나 서비스 개발자가 특정 역에서 출발하는 열차가 몇 시에 있고 급행인지 확인하는 질문에 쓴다. 전역 조인 키는 없고 역코드(stnCd)·역명·호선명으로 같은 기관의 다른 지하철 데이터와 이름·코드 매핑을 거쳐 이어 쓴다.
description_portal: 서울교통공사 열차시간표 API는 서울지하철의 열차 시간표 정보를 조회할 수 있는 API입니다. 상하행, 내외선 및 주말 구분을 포함한 역별 열차 운행 시간 정보를 제공하며, 역코드, 역번호, 역명, 지선명, 호선명, 열차 번호, 출도착 시각, 임시 시간표 여부, 급행 여부 및 환승 가능 여부 등의 항목을 포함합니다. 출발역과 도착역 기준의 열차시간표 확인, 교통정보 서비스 연계 등에 활용될 수 있습니다. 열차시간표는 수시로 갱신되는 정보를 Rest API 방식으로 제공합니다. 데이터는 수시로 갱신됩니다.
