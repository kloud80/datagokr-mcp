summary_user: 대전광역시 서구가 개인·기관 소유의 빈 땅을 빌려 조성한 공한지 주차장을 주차장 1곳당 한 행으로 담은 파일이며, 주차장명·행정동·법정동·지번/도로명 주소·면적(m2)·주차면수·설치일·소유자를 포함한다(포털 설명 기준 16개소). 주민이 서구 동네별로 무료 공한지 주차장이 어디에 몇 면 있는지 확인하거나, 분석가가 동별 주차 공급 현황을 살필 때 쓴다. 전역 조인 키는 없어서 주소·법정동 이름으로 전국주차장정보표준데이터 같은 주차장 원장이나 행정동 단위 자료와 이름 매칭해 이어 쓴다.
description_portal: 대전광역시 서구 공한지주차장 시설현황입니다.(순번, 주차장명, 행정동, 법정동, 지번주소, 도로명주소, 상세주소, 면적, 주차면수, 설치일, 소유자)현재 공한지 주차장은 16개소로 관저동, 도안동, 용문동, 둔산동, 변동, 기성동, 복수동, 가수원동, 우명동, 탄방동 등에 위치 하고 있습니다.공한지 주차장은 개인 및 기관의 소유 대지를 사용하여 주차장을 조성합니다. 현재 이용하고 있지 않은 공지를 공공의 주차장으로 이용토록 하고자 하시는 분은 구청에 연락 주시면 됩니다.구청에서는 현장을 확인하고 가능하다고 판단되면 계약 및 시설물 정비를 진행하여 주차장을 조성합니다.
