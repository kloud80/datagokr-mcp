summary_user: 제주특별자치도에 등록된 자동차를 차량 단위로 차명·배기량·연료·용도(자가용/영업용)·차종 분류와 종별·최초등록일·등록현황과 함께 담은 파일 데이터로, 2019년 이후 기준이며 CSV 약 42MB 규모다. 분석가나 정책 담당자가 '제주에서 최근 몇 년간 경유차 대비 기타연료(전기 등) 차량 등록이 얼마나 늘었는가', '영업용 승합·화물 차량 구성은 어떤가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 차종·연료·용도 같은 분류 이름이나 최초등록일 기간으로 맞춰 집계 수준에서 이어 쓴다.
