summary_user: 자동차 정비업자가 전송한 점검정비명세서를 바탕으로, 등록년·등록월·차종(경형·소형·중형·대형·다목적·기타)·부품구분(신품·재제조품·중고품·수입부품·없음) 조건별 정비이력 등록 건수(dtaCo)를 돌려주는 전국 단위 집계 통계입니다. 정책 분석가나 정비업계 관계자가 "특정 월에 중형차 정비에서 재제조품 부품이 쓰인 정비이력이 몇 건 등록됐나" 같은 질문에 답할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기간(연·월)과 차종·부품구분 코드의 이름 매핑으로만 맞춰 붙이며, 같은 기관의 자동차 등록·검사 통계와 시점을 맞춰 나란히 보는 방식이 현실적입니다.
description_portal: 자동차종합정보 API서비스로 자동차 등록년(등록된 년도'YYYY'), 등록월(등록된 월'MM'), 차종코드(경형, 소형,중형,대형,다목적,기타), 부품구분코드(신품,재제조품,중고품,수입부품,없음)를 입력하여 자동차 정비 이력정보 기간별 등록 통계정보를 조회하는 서비스 입니다. *자동차정비업자는 자동차관리법 시행규칙 제116조(자동차관리사업자 등의 전송 의무)에  따라 자동차 점검정비명세서 발급 후 72시간 이내 전산정보처리조직에 전송해야한다*매월1일부터 말일까지의 데이터는 익월2일에 조회 및 활용 가능합니다. *인증키는 공공데이터포털에서 자동발급 됩니다.
