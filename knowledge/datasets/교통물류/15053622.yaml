summary_user: 한국철도공사가 보유한 화차를 자중(톤) 구간별로 나누어 유개차·유조차·무개차·평판차·소화물차·차장차·침식차 종류별 보유 대수를 담은 전국 단위 집계표로, 철도통계연보 수록 자료를 작은 CSV 파일 하나로 받는다. 철도 물류 분석가나 정책 담당자가 "자중이 무거운 화차와 가벼운 화차가 종류별로 몇 대씩 있나"를 확인해 수송 용량이나 화차 구성을 파악하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 같은 기관의 다른 철도통계 자료와는 화차 종류 이름을 맞춰 연결해야 한다.
