summary_user: 전국 시군구 단위로 버스·지하철 등 교통수단 간 환승 통행량을 운행일자·요일·시간대·이용자유형별로 담고, 읍면동별 환승 발생 인원과 도착 인원을 집계한 데이터다. 교통 분석가나 지자체 담당자가 '우리 시군구에서 어느 읍면동, 어느 시간대에 환승 수요가 몰리는가'를 따져 환승센터·정류장 배치나 노선 조정을 검토할 때 쓴다. 전역 조인 키는 없어 시도·시군구 코드와 이름(sgg_cd 등)으로 같은 행정구역 코드를 쓰는 다른 대중교통·인구 데이터와 맞춰 이어 쓴다.
description_portal: 일일 환승 통행량은 특정 하루 동안 버스, 지하철 등 교통수단 간 환승한 승객의 횟수나 인원을 기록한 데이터로, 지역별·유형별 환승 발생지와 도착지 정보를 포함합니다. 이 데이터는 교통 정책 수립의 핵심 기초 자료로 활용되며, 노선 조정, 환승 할인 제도 개선, 환승센터 및 정류장 시설물 배치 최적화, 교통 인프라 확충 계획 수립 등에 기여합니다. 또한 환승 편의성 평가, 교통 혼잡 완화, 환승 시간 단축 방안 마련 등 대중교통 서비스 품질 향상에도 중요한 역할을 합니다. 차내시간/차외시간 등의 정보를 확인할 수 있는 중요한 자료입니다.
