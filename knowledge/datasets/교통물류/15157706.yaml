summary_user: 인천항만공사 선박 입출항 시스템에 접수된 입항·출항 신고를 건별로 조회하는 API로, 호출부호·입항일자·외항 여부를 조건으로 넣으면 입출항 시간, 항차와 항차 구분, 국적, 출항지·입항지를 돌려준다. 물류업체나 분석가가 특정 선박이 언제 인천항에 들어오고 나갔는지, 외항선 항차가 얼마나 되는지 확인할 때 쓴다. 실측 응답에서 전역 조인 키는 확인되지 않아, 다른 항만공사 입출항 API나 선박 원장과는 호출부호·선명 같은 이름 매칭으로만 이어 쓴다.
