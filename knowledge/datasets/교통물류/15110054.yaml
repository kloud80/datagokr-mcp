summary_user: 대전광역시 도로관리시스템에 등재된 가로등을 한 개씩 담은 건별 원천 파일로, 관리번호·행정읍면동·도로구간번호와 함께 등주 높이·형식·재질, 등기구 모형·수량, 광원 종류, 위도·경도를 담는다. 대전시 도로·안전 담당자나 분석가가 '어느 동, 어느 도로구간에 어떤 광원의 가로등이 몇 개 있고 야간 보행 취약 구간은 어디인가'를 확인하거나 LED 전환 대상을 추릴 때 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 위도·경도 좌표로 교통사고·보안등·행정구역 경계 데이터와 공간적으로 맞춰 쓰고, 도로구간번호·가로등제어기관리번호는 같은 기관 자료와의 연결에만 쓴다.
description_portal: 대전광역시_가로등 현황 데이터는 대전광역시 도로관리시스템에 등재된 가로등의 위치, 종류, 설치 구간, 관리 상태, 설치년도 등 다양한 정보를 포함하고 있습니다. 이 데이터는 도로 및 보행자 안전을 위해 설치된 가로등의 체계적인 관리와 유지보수, 도시 야간 경관 개선, 에너지 효율화 등 다양한 행정적 목적에 활용됩니다. 가로등 현황 자료는 도로시설물의 효율적 운영, 도시 인프라 관리, 교통사고 예방, 야간 보행 환경 개선 등에도 중요한 자료로 활용될 수 있습니다. 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴이 직접 정비·구축한 데이터로, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
