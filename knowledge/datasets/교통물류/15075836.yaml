summary_user: 제주특별자치도 대중교통 IoT센서에서 쓰는 센서코드와 그 값·유형(code, value, type)을 조회하는 코드 목록형 API로, 건별 측정값이 아니라 센서코드 정의를 담는다. 제주 버스·정류장 IoT 센서 데이터를 받아 쓰는 개발자나 분석가가 "이 센서코드가 무엇을 뜻하는가"를 해석하는 데 쓴다. 전역 조인 키는 없어 같은 기관(제주특별자치도)이 제공하는 대중교통 IoT 센서 데이터와 센서코드(sensorCd) 이름·코드 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와 직접 결합되지 않는다. 필드 명세에 의미 설명이 비어 있어 code·value·type의 뜻은 실제 응답을 보고 확인해야 한다. 개발계정은 하루 1,000회로 호출이 제한된다.
