summary_user: '아산시 관내 가로등을 한 기씩 담은 건별 원천 파일로, 표찰번호·분전함번호, 지번 주소와 경도·위도, 등주 형태·높이, 램프 종류·용량, 보행등 정보, 등록일을 담는다(파일 약 2.9MB). 시민이 고장 난 가로등의 표찰번호로 위치를 확인하거나, 분석가가 특정 동네의 야간 조명 분포와 램프 종류(예: LED 전환 여부)를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표(경도·위도)나 지번 주소로 공간·주소 매칭해 잇고, 같은 부문의 다른 지자체 가로등 파일과는 컬럼 이름을 맞춰 합친다.'
description_portal: ‘충청남도 아산시 가로등 현황’ 데이터는 아산시 관내 도로와 보행 공간에 설치된 가로등의 위치 및 시설 정보를 시민에게 제공하기 위해 공개되는 공공데이터이다. 본 자료에는 가로등의 설치 위치(주소 또는 좌표), 등기구 종류, 램프 종류, 설치일자, 관리번호 등 주요 정보가 포함되어 있으며, 안전한 보행 환경 조성과 도시 야간경관 개선을 위한 기초자료로 활용된다. 해당 데이터는 고장‧파손 등 시설물 관리에 필요한 정보를 제공하여 민원 처리의 효율성을 높이고, 가로등 유지보수 계획 수립에도 중요한 역할을 한다. 아산시는 시설물 점검 결과를 반영해 자료를 정기적으로 갱신하고 있으며, 공공데이터포털을 통해 누구나 열람·활용할 수 있도록 제공하고 있다.
