summary_user: 광주광역시 버스전용차로의 연도별 단속건수와 단속원금(부과된 과태료 총액)을 담은 연도 단위 집계 파일로, 539바이트 크기의 작은 CSV입니다. 교통행정 담당자나 분석가가 버스전용차로 위반 단속이 해마다 늘었는지 줄었는지, 과태료 부과액이 어떻게 변했는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속년도나 기관(광주) 기준으로만 맞춰 이어 볼 수 있다.
description_portal: 광주광역시 버스전용차로의 연도별 단속건수와 단속원금 현황은 버스전용차로 운영 성과를 종합적으로 보여주는 핵심 지표라 할 수 있습니다. 단속건수는 매년 교통량 변화, 시민들의 법규 준수 수준, 단속 장비의 설치·확대 여부, 그리고 계도 및 홍보 활동의 강도 등에 따라 차이를 보입니다. 단속원금은 단속된 건수를 바탕으로 부과된 과태료의 총액을 의미하며, 교통법규 위반 억제와 더불어 시 재정에도 일정 부분 기여하는 성격을 가지고 있습니다. 특히 단속건수와 단속원금의 추이를 연도별로 비교하면 버스전용차로 제도의 효과성과 시민들의 법규 준수 개선 정도를 객관적으로 확인할 수 있으며, 향후 단속정책 수립, 교통행정 운영 방향 설정, 교통안전 대책 마련 등에 중요한 참고자료로 활용될 수 있습니다.
