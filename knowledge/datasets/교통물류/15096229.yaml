summary_user: 수원시에 설치된 전기차 충전기를 충전기 단위로 담은 파일(CSV, 약 44만 바이트)로, 충전소명·사용시간·이용자제한·충전기 상태와 타입·용량·도로명/지번 주소·위도·경도·관리업체를 포함한다. 수원 시민이나 전기차 이용자가 '우리 동네 어디에 급속 충전기가 있고 누구나 쓸 수 있는가'를 확인하거나, 분석가가 지역별 충전 인프라 부족 지점을 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 충전소ID·충전기ID나 주소·위경도를 기준으로 다른 충전소 데이터나 행정구역 자료와 맞춰 이어 써야 한다.
limits: 다른 데이터와 바로 연결되는 공통 코드가 없어 이름·주소·좌표 매칭으로만 결합할 수 있다. 범위는 수원시 한 곳이므로 경기도나 전국 충전소 현황을 대신하지 못한다.
