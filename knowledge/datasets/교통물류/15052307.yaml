description_portal: '데이터 개요국토교통부_항공용어사전은 항공 산업 및 행정 분야에서 빈번히 사용되는 전문 용어와 약어에 대해 체계적이고 상세한 해설을 제공하는 공공데이터입니다. 영문·한글 표기, 약어, 해설을 포함한 표 형식으로 정리되어 있어 항공 분야 종사자, 연구자, 학생 등이 정확한 용어 이해와 효율적인 정보 탐색을 할 수 있도록 지원합니다.데이터 제공 항목용어항공 관련 영문 명칭 또는 기술 용어한글명용어의 한국어 번역 또는 설명 명칭약어해당 용어의 약칭 또는 줄임말해설항공 현장에서의 의미, 용도, 사용 사례 등 상세 설명활용 안내항공산업 실무: 정비, 운항, 공항운영 분야에서의 용어 일관성 확보교육 및 연구: 항공학과 커리큘럼, 기술 문서 작성 및 논문 용어 정의정책 및 보고서: 항공 관련 법령, 안전정책 수립 시 용어 표준화 자료로 활용데이터 해석 시 유의사항항공기 기종명, 무기체계 등 일부 용어는 국가·군 별로 해석이 상이할 수 있음용어 해설은 국토교통부가 설정한 기준에 기반하며, 국제표준(ICAO, FAA 등)과 병행하여 참고하는 것이 권장됨일부 군사용 기체 및 장비 설명은 제작 시점 기준의 기술사양이 포함되어 있음데이터 구성 예시용어한글명약어해설A & B hydraulic brake systemA & B 유압 제동 장치대형 항공기의 예비 제동 시스템으로, 각각 A와 B 유압계통에 의해 작동되는 다중디스크 방식의 제동장치 구성요소를 포함한다.A & P technician기체 및 동력장치 정비사FAA에서 공인한 정비사로서, 항공기의 운항복귀를 승인할 수 있는 자격을 가진 전문가이다.A-10 Thunderbolt IIA-10 선더볼트 II 전투기미국 공군의 근접지원 공격기. 중무장을 통해 대전차 공격에 특화되었으며, 1972년 첫 비행. 최대속도 707km/h.'
