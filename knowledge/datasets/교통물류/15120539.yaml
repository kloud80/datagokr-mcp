summary_user: 경기도 교통정보센터가 연도·지역(시군)별로 정류소 수, 버스정보안내단말기(BIT) 설치 대수와 음성안내 대수, BIT 구축률을 집계해 담은 현황 자료다. 정책 담당자나 분석가가 "우리 시군의 BIT 구축률과 음성안내 단말 보급이 다른 시군보다 얼마나 뒤처져 있나"처럼 교통약자 정보 접근성 격차를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 지역코드(region_cd)나 지역명을 다른 시군 통계와 이름·코드 매핑하거나 같은 기관 자료와 맞춰 연결해야 한다.
description_portal: 경기도 교통정보센터에서 제공하는 버스정류소 및 버스정보안내단말기(BIT) 구축 현황 자료로, 대중교통 편의성과 정보 접근성 수준을 평가할 수 있습니다. 주요 항목은 연도, 지역명, 지역코드, 정류소 수, BIT 구축 수(대), BIT 음성안내 수(대), BIT 구축률(%)로 구성되어 있으며, BIT는 버스 도착정보와 운행 상태를 실시간으로 제공하는 전자 단말기입니다. 데이터는 각 지역의 BIT 도입률 및 교통정보 인프라의 확산 수준을 정량적으로 파악할 수 있도록 하며, 교통약자의 정보 접근성 개선, 시군별 교통 인프라 격차 분석, 대중교통 서비스 향상 정책 수립 등에 활용될 수 있습니다. 특히 음성안내 기능 유무는 시각장애인 등 교통약자 편의 개선에 중요한 기준이 됩니다.
