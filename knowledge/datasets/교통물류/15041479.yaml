description_portal: 부산교통공사에서 운영하는 노선의 제세동기에 대한 데이터로 철도운영기관명,선명,역명,지상지하구분 ,역층, 출입구번호, 상세위치, 제세동기출력에너지,제세동기출력방식, 수량 등이 있습니다.자동제세동기는 자동(自動)으로 세동(細動)을 제(際)거하는 기(器)계라는 의미다. 환자에게 심정지(심장마비)가 왔을 때 자동제세동기를 통해 환자의 심장을 인위적으로 뛰게 하면, 환자의 생존율을 두 배 이상 높일 수 있다. 하지만 이런 중요성에도 불구하고, 대다수의 사람들은 자동제세동기의 기능과 사용법에 대해 알지 못한다. 평소에 자동제세동기에 대한 전반적인 내용을 숙지토록 하여야 한다.
