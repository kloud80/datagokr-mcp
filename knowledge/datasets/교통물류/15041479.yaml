summary_user: 부산교통공사가 운영하는 도시철도 노선의 역별 자동제세동기 설치 현황을 설치 위치 단위로 담은 파일 데이터로, 노선·역명·지상지하 구분·층·출입구 번호·상세 위치와 출력 에너지·운영 방식·수량을 기록한다. 시민이나 역 안전 담당자가 '이 역 어느 층, 어느 출입구 근처에 제세동기가 있는가'를 확인하거나, 분석가가 노선별 제세동기 배치 밀도를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 역 정보·역사 시설 데이터와는 노선명(선명)과 역명을 이름으로 맞춰 연결해야 한다.
limits: 표준 역 코드 같은 공통 조인 키가 없으므로 다른 데이터와 붙일 때는 역명·노선명 표기 차이를 직접 맞춰야 한다. 부산교통공사 노선만 다루므로 다른 철도운영기관의 제세동기 위치는 이 파일로 알 수 없다.
