summary_user: 한국국토정보공사가 본부·부서별로 운영하며 무료로 개방하는 주차장의 주소·우편번호·전화번호·운영시간·이용료·이용 유의사항을 주차장 한 곳당 한 행으로 담은 파일(CSV 약 26KB)이다. 국민이 근처 국토정보공사 사옥 주차장을 언제, 얼마에 쓸 수 있는지 확인하거나, 분석가가 공공기관 유휴 주차공간 개방 현황을 지역별로 살펴볼 때 쓴다. 전역 조인 키가 없어 주소(또는 우편번호)를 매칭해 전국주차장정보표준데이터 같은 주차장 원장과 이어 써야 한다.
description_portal: 한국국토정보공사에서 개방하고 있는 무료개방 주차장 정보입니다. 이 데이터는 본부 및 부서별로 운영중인 주차장에 대한 상세 정보를 포함하고 있습니다. 데이터에는 주차장이 위치한 주소, 우편번호, 운영 시간, 이용 요금, 이용시 유의사항 또는 특이사항 등 기타 안내 정보가 포함됩니다. 해당 데이터는 지역 내 주차 공간 확보 현황을 파악하고, 공공시설 활용도 제고 및 대국민 편의 제공을 위한 정책 수립 등에 활용될 수 있습니다. 또한 공공기관의 유휴 공간 개방 현황을 모니터링하거나 지역별 주차 수요 분석 등 분석 목적으로도 유용하게 횔용될 수 있습니다.
