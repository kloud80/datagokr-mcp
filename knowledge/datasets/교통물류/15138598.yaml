summary_user: 서울교통공사 관할 지하철역별로 승차·하차를 나눠 1월~12월 월별 인원과 연간 합계(계)를 담은 집계 파일이며, 포털 설명상 2000년~2023년 자료를 제공한다. 분석가나 사업자가 '특정 역의 이용객이 어느 달에 많고 해마다 어떻게 변했나'를 확인해 역세권 유동인구의 대체 지표로 쓴다. 전역 공통 조인 키는 없어 역번호·역명을 기준으로 다른 역 정보나 시간대별 승하차 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 서울교통공사 역별 월별 승하차인원 정보입니다. 제공신청에 의하여 2000년~2023년 자료까지 제공합니다.위 데이터는  역번호, 역명, 구분(승차/하차), 구분에 따른 월별 인원 정보(1월~12월)로 구성되어있습니다.승차인원은 일반적으로 역에서 개표한 인원을 의미하며, 하차인원은 역에서 집표한 인원을 의미합니다.1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다.마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.
