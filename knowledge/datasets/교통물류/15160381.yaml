description_portal: 경기도 양주시 수요응답형 똑버스 노선형 운행정보 현황 데이터입니다.평시에는 이용자의 호출에 따라 차량이 배차되는 수요응답형(DRT, Demand Responsive Transport) 방식으로 운영되며, 교통수요 및 지역 여건을 고려한 일부 구간은 정해진 시간표와 노선에 따라 노선형으로 운행됩니다. 노선형으로 운행되는 경우에도 이용자는 똑타(똑버스) 앱을 통해 차량을 호출한 후 탑승하여야 합니다.본 데이터는 노선형으로 운영되는 똑버스의 권역명, 노선명, 기점, 종점, 운행구분, 운행요일, 운행횟수 및 출발시간 등의 운행정보를 제공합니다. 이를 통해 시민은 노선별 운행일정과 운행시간을 확인할 수 있으며, 대중교통 이용 편의 증진과 교통 취약지역의 이동권 보장에 활용됩니다. 또한 AI 기반 교통서비스, 디지털 교통플랫폼, MaaS(Mobility as a Service), 대중교통 운영 최적화, 교통수요 분석 및 스마트시티 정책 수립을 위한 AI 친화형 고가치 데이터로 활용할 수 있습니다.
