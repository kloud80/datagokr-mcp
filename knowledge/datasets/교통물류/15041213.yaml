summary_user: 인천교통공사가 운영하는 노선의 역별 장애인 화장실 위치를 한 행씩 담은 원천 목록 파일(CSV, 약 13KB)로, 노선·역명·지상/지하 구분·역층·게이트 안팎·출구번호·상세위치·화장실 구분을 담는다. 휠체어 사용자나 보호자가 인천 도시철도 특정 역에서 개찰구 안쪽 장애인 화장실이 몇 층 어느 출구 근처에 있는지 확인하거나, 분석가가 역별 장애인 화장실 배치 현황을 점검하는 데 쓴다. 전역 조인 키가 없어서 다른 역 시설·승강기·편의시설 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 이어 쓴다.
description_portal: 인천교통공사에서 운영하는 노선의 역사별 장애인 화장실 위치에 대한 데이터로, 철도운영기관명, 선명, 역명, 장애인화장실의 역층, 게이트내외, 출구번호, 상세위치 데이터가 있습니다.화장실은 일상생활에서 가장 중요한 시설이지만, 휠체어 사용자 등 장애인에게는 여전히 가장 차별적인 시설로 남아 있다. 장애인용 화장실에 대한 기준은 「장애인·노인.임산부등의 편의증진보장에 관한 법률」(장애인등편의법), 「교통약자의 이동편의증진법」(교통약자법) 및 「장애물 없는 생활환경 인증제도의 인증기준」(BF인증제도)에서 정하고 있다. 그러나 현재 장애인등편의법의 기준 가운데 실제로 휠체어 사용자의 이용이 어려운 기준이 몇 가지 있다. 이 기준들에 대한 개선이 필요하다.
