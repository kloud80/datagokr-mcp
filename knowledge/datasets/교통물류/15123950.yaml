summary_user: 경기도버스운송관리시스템(BMS) 기준으로 경기도 버스 노선마다 노선ID(route_id)와 그 노선을 운행하는 운수업체ID(entrps_id)를 담은 노선별 배차·운영업체 데이터다. 교통정책 담당자나 분석가가 "이 노선은 어느 운수사가 운행하고, 한 업체가 몇 개 노선을 맡고 있나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 경기도 버스 노선·정류장 데이터와 노선ID 같은 기관 내부 코드로만 연결한다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 노선별 배차 정보로, 경기도 내 운행되는 각 버스 노선에 대해 노선 고유식별번호인 ‘노선ID’와 해당 노선을 운영하는 ‘업체ID’ 정보를 제공합니다. ‘노선ID’는 경기도 내 모든 시내·마을버스 등 대중교통 노선을 고유하게 식별하는 번호이며, ‘업체ID’는 해당 노선을 실제 운행하는 운수사의 고유 식별값입니다. 이 데이터는 노선별 운영업체 현황 파악, 노선 분석, 업체별 서비스 범위 검토, 교통정책 수립, 버스노선의 체계적 관리 등에 활용될 수 있습니다.
