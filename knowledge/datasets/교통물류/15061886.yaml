description_portal: 이 데이터는 유도선 사고 예방과 국민 안전 강화를 위해 필수적인 구명장비·소화설비·통신장비 기준을 정리한 CSV 자료로, 총 6행 4열로 구성되어 있다. 최근 잇따른 수상레저·여객선 사고, 재난대응 강화 요구 등 사회적 관심이 높아짐에 따라 유도선의 기본 안전장비 확보 기준을 명확히 제공하는 것이 중요해지고 있다. 본 자료에는 구명조끼(정원의 120%, 소아용 20% 포함), 구명부환(정원 대비 30% 이상), 구명줄(정원 13인 이상 필수), 소화설비(선실·조타실·기관실별 1개 이상), 통신장비(2마일 이상 운항 시 필수) 등 선박 안전과 직결되는 핵심 규정이 체계적으로 반영되어 있다. 이는 최근 사회적 이슈인 재난안전, 수상교통 안전성, 응급대응 역량 강화와 직접적으로 연계되는 기초 자료로 활용될 수 있다.
