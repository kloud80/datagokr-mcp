summary_user: 경기도 파주시 지능형교통체계(ITS)가 관리하는 도로 링크를 한 행씩 담은 원천 목록으로, 링크마다 시작·종료 노드, 도로명, 도로등급, 최고제한속도, 링크길이, 차로수를 담는다(파일 약 1.3MB, 범위는 파주시 한 시군구). 교통 분석가나 연구자가 '파주시에서 제한속도와 차로수가 어떤 구간에서 바뀌고, 혼잡·사고가 잦은 링크는 어떤 도로 특성을 갖는가'를 볼 때 링크 속성 기준표로 쓴다. 실측상 전역 조인 키로 확인된 컬럼은 없으며, 링크아이디·시작/종료 노드아이디를 표준노드링크 체계나 같은 센터의 교통 소통정보와 맞춰 보거나 시군구코드·도로명으로 연결해 쓴다.
description_portal: 경기도 파주시 지능형교통체계(ITS) 운영을 위한 링크 단위 정보에 관한 공공데이터로, 행정구역별 식별이 가능한 시도명, 시군구명, 시군구코드, 연계 등에 활용될 수 있는 센터아이디와 센터정보명, 도로 특성 정보인 도로명, 도로등급, 구간등급코드, 최고제한속도, 링크길이, 링크아이디, 노드아이디, 차로수, 시작·종료지점명 등으로 구성되어 있습니다. 본 데이터셋은 링크별 제한속도, 도로등급, 링크길이 등의 세부 속성을 사용하여 특정 구간의 혼잡 발생 패턴을 분석하거나, 머신러닝 기반 교통량·속도 예측 모델 구축, 도로 특성(차로수, 도로등급, 제한속도)과 공간 정보(노드·링크 구조)를 결합한 사고 위험 가능성이 높은 구간 도출 연구, 링크 단위 네트워크 구조를 활용한 최단거리, 최소시간, 혼잡 회피 등의 경로 탐색 알고리즘 개발, 교통 시뮬레이션 모델 구축, 스마트시티 교통 서비스 설계 등에 활용될 수 있습니다.
