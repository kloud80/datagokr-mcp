summary_user: 부산1호선 도시철도역마다 설치된 자동제세동기(AED)의 위치(지상·지하 구분, 역층, 출입구번호, 상세위치)와 출력에너지, 운영방식, 수량을 설치 장소 단위로 담은 작은 CSV 파일(약 3.5KB)입니다. 시민이나 역 이용자, 안전 분석가가 "부산1호선 ○○역에서 제세동기는 몇 층 어느 출입구 근처에 있나"를 확인하거나 역별 비치 현황을 점검할 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 역명·선명 같은 이름 매핑으로만 이어 쓰며, 다른 노선의 같은 기관 제세동기 데이터와 붙일 때도 역명 기준으로 맞춥니다.
limits: 역코드나 좌표 같은 공통 키가 없어 역 시설·승하차 데이터와 정확히 조인하려면 역명 표기를 직접 맞춰야 합니다. 범위는 전국으로 분류돼 있지만 비공간 데이터라 지도 위치 분석에는 바로 쓰기 어렵습니다.
