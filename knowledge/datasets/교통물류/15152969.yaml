summary_user: 대구도시철도 1호선 지상 엘리베이터의 위치를 호선·역명·EV번호와 위도·경도 좌표로 담은 건별 시설 파일이며, 전체 59행이다. 교통약자나 경로 안내·위치기반 서비스 개발자가 특정 역의 엘리베이터가 어디에 있는지 확인하는 질문에 쓴다. 위도·경도(coord) 키로 다른 역·출입구 좌표 데이터와 공간적으로 이어 쓰고, 역 단위 코드 키는 필드에 없다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 교통약자 이동권 운영정보 데이터로, 대구도시철도 1호선 각 역사의 지상과 지하를 연결하는 엘리베이터 현황을 제공합니다. 주요 항목은 호선명, 역사명, 엘리베이터(EV) 번호, 설치 위치, 위도·경도 좌표 등으로 구성되어 있으며, 역사별 엘리베이터의 위치와 접근 정보를 체계적으로 확인할 수 있도록 구성되어 있습니다. 본 자료는 교통약자를 비롯한 이용객의 이동 편의성 향상과 안전한 이동환경 조성을 지원하며, 경로 안내 서비스, 위치기반 서비스(LBS), 접근성 분석 및 모빌리티 서비스 개발을 위한 기초자료로 활용될 수 있습니다. 또한 시설 운영 및 유지관리, 접근성 개선 정책 수립, 시설 현황 모니터링, 정비 우선순위 설정 등 다양한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 변경 시 갱신됩니다.'
