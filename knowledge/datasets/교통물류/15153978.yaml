description_portal: '본 자료는 국가철도공단이 2025년 1월부터 11월까지 시행한 철도건설사업 중,감정평가업자 선정을 위해 공고한 모든 사업 내역을 정리한 목록입니다.해당 목록은 다음과 같은 주요 항목으로 구성되어 있습니다.사업명(공고명): 감정평가가 필요한 철도건설사업의 명칭작성일자: 각 공고가 게시된 날짜담당자: 공고 및 사업 관련 문의가 가능한 공단 담당자 정보각 공고는 국가철도공단 홈페이지(www.kr.or.kr) ‘게시판’ 메뉴에서 세부내용 확인이 가능하며,해당 페이지에서는 다음과 같은 정보를 함께 열람할 수 있습니다.공고의 상세 개요감정평가업자 선정 절차 및 기준사업 위치 및 사업량제출서류, 평가방법, 유의사항본 자료는 해당 기간(’25.1~11월) 동안 감정평가가 필요하여 공단이 정식으로 공고한 사업만을 수집·정리한 것으로,각 사업별 업자 선정에 필요한 서류 및 자세한 내용은 첨부파일을 통해 확인할 수 있습니다.전체 내용은 공단 홈페이지에서 상시 열람 가능하며, 최신 공고는 홈페이지 기준으로 반영됩니다.'
