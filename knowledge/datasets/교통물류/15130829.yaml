description_portal: ㅇ 자동차 튜닝부품인증제도 시행(2015.1.)에 따라 튜닝부품에 대한 인증 및 튜닝부품 관리 등 효율적인 튜닝부품인증제 시행을 위한 자동차튜닝부품인증센터(cartuning.kr) 관리시스템을 구축하였습니다.ㅇ 자동차튜닝부품인증품에 대한 통계를 작성하였습니다.  - 자동차 튜닝 부품 제작사에서 제조한 안전도가 확인된 자동차 튜닝 부품을 자동차에 장착한 건수 입니다.ㅇ 자동차 튜닝인증부품을 장착한 년도별 장착건수 현황  - 자동차 인증부품 등록건수는 튜닝협회 전산시스템에서 등록된 데이터가 현재(자동차튜닝부품인증센터) 시스템에  연계되어 기록된 건수
