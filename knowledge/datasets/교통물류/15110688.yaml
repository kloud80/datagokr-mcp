status: active
summary_user: 대전광역시 도로에 설치된 과속방지턱을 한 건씩 담은 개별 시설 데이터로, 시군구·도로명·지번주소, 설치위치, 재질과 형식, 폭, 위도·경도, 기준일자를 담는다. 운전자나 내비·지도 서비스 사업자, 도로안전 분석가가 '특정 도로 구간에 과속방지턱이 어디에 몇 개 있고 어떤 형식인가'를 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군구명·도로명 같은 이름 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 기관 데이터와 붙일 때 이름 표기 차이를 직접 맞춰야 한다. 범위는 대전광역시에 한정되므로 전국 비교에는 다른 시도 자료가 따로 필요하다. 개발계정은 일 10,000회 호출 제한이 있다.
