      - name: OVRSPDPRVNTYPE
        required: false
        example: '1'
        desc: 과속방지턱 상부면의 형상에 따른 구분 (표현방식/단위 = 01:원호형, 02:사다리꼴, 03:가상형, 99:기타))
      - name: BT
        required: false
        example: '3.8'
        desc: 과속방지턱의 폭 (표현방식/단위 = cm)
      - name: ET
        required: false
        example: '4.7'
        desc: 과속방지턱의 길이 (표현방식/단위 = cm)
      - name: ROAD_TP
        required: false
        example: '2'
        desc: 도로의 폭 크기에 따른 유형 구분 (표현방식/단위 = 01:일반, 02:소로)
      - name: LATITUDE
        required: false
