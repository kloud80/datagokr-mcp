description_portal: '공기질 측정장비 유지관리 및 정도검사  ▢ 관련근거    ❍ 환경분야 시험․검사등에 관한 법률 제11조 (측정기기의 정도검사)      ‣ 형식승인 받은 장비에 대한 구조와 성능검사    ❍ 환경분야 시험․검사등에 관한 법률 시행규칙 제7조 (정도검사의 기준과 주기)  ▢ 정도검사    ❍ 환경분야 시험ㆍ검사 등에 관한 법률 시행규칙 제7조에 따라 연1회 시행    ❍ 대    상: 총28대 ‣ 승강장 초미세먼지 장비 22대, 대합실 및 터널장비 6대‣ Thermo社 장비 중 형식승인을 받지 않은 초미세먼지 장비 1대는 제외    ❍ 집행계획 : 7월    ❍ 검사기관: 환경부 지정 환경측정기기 검사대행기관    ❍ 검사항목: 시료채취부, 분석부, 출력부 및 유량의 정확성 등  ▢ 정도검사    ❍ 환경분야 시험‧검사 등에 관한 법률에 따른 환경측정기기 검사기관에 의뢰 및 법적 수수료 지급    ❍ 분해점검과 별도 시행, 정도검사 기간 중 장비 반출에 따른 측정값 환경부 전송 일시중지    ❍ 승강장 초미세먼지 측정장비는 실시간 감시를 위해 반출하지 않고 현장에서 출장검사 실시'
