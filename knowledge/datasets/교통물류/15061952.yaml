description_portal: '데이터 개요국토교통부_년도별항공시장동향분석목차 데이터는 매월 발간되는 항공시장 동향분석(현: 글로벌 항공산업동향) 단행본의 주요 콘텐츠 구조를 보여주는 자료입니다. 발행일자별, 호수별로 각 장의 제목과 하위 세부 목차 항목들을 체계적으로 제공하여, 항공산업 관련 정책 흐름, 국제 동향, 산업 통계 및 주요 이슈 분석 등을 파악할 수 있는 기반 자료로 활용됩니다.데이터 제공 항목발행일자: 해당 호가 발행된 날짜발행호수: 단행본 순번 (예: 제25호)메인목차: 각 장의 제목 또는 주제 (예: 제1장. 주요 국가 동향)서버목차: 해당 장의 세부 이슈 항목 또는 소제목활용 안내항공정책, 국제제도, 산업 트렌드, 기술 동향 등 세부 이슈별 인덱싱 자료로서 분석 연구에 활용 가능각 항목별 기사 또는 보고서 본문은 ‘년도별 항공시장동향분석파일’의 링크를 통해 열람 가능정책 수립, 연구기획, 산업 리포트 작성 시 키워드 기반으로 유용하게 인용 가능데이터 해석 시 유의사항메인목차는 장 단위 기준으로 제공되며, 서버목차는 각 장의 세부 주제나 핵심 이슈를 정리한 제목 형식으로 제공됨발행호수 및 목차 체계는 편집 정책에 따라 변경될 수 있으며, 일부 항목은 수정/누락될 수 있음본 데이터는 목차 정보만 제공하므로 실제 기사 또는 해설 내용은 원본 파일(년도별항공시장동향분석파일)을 참고해야 함예시 데이터발행일자발행호수메인목차서버목차2025-01-02제49호제1장.주요 국가 동향1.OAG, ’24년 가장 붐비는 국제선 및 국내선 노선 순위 발표2025-01-02제49호제2장.글로벌 친환경 정책 동향1.화물 항공기 규모 증대, 이에 따른 탄소배출량 감축 노력 시급2025-01-02제49호제2장.글로벌 친환경 정책 동향2.중국, 향후 SAF 생산 시 폐식용유 대체 에너지원 발굴 필요2025-01-02제49호제2장.글로벌 친환경 정책 동향3.IT 솔루션, 공항 운영 최적화 통해 연간 탄소배출량 570만톤 감축 기대'
