summary_user: 전국 17개 시도별 대중교통 버스터미널 수를 공영·공용·합계로 나눠 개소 단위로 담은 집계표이며, 파일 크기가 240바이트에 불과한 소규모 요약 자료입니다. 정책 담당자나 분석가가 '시도별로 공영 버스터미널과 공용 버스터미널이 몇 곳씩 있는가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도 이름(구분)을 맞춰서 붙여야 하며, 시도별 인구·노선·정류장 통계와 이렇게 이어 쓴다.
description_portal: 한국교통안전공단에서 전국 161개 지자체를 대상으로 수집된 전국 대중교통 버스터미널 현황 자료입니다.전국 대중교통 버스터미널을 공영과 공용, 계로 구분하여 데이터를 제공하고 있습니다.(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)단위는 개소입니다.해당 데이터를 통해 대중교통 수단 및 시설 현황을 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
