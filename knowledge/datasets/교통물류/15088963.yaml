summary_user: 서울 한강공원 주차장 정보를 주차장 한 곳당 한 행으로 담으며, 지구 구분, 위치(위도·경도·주소), 전체·장애인·정기 주차면 수, 주중·주말 운영시간, 기본·추가·1일·월정기 요금, 운영업체와 운영기간을 포함한다. 한강공원을 찾는 시민이 '주말에 이 지구 주차장은 몇 시까지 열고 기본요금은 얼마인가'를 확인하거나, 분석가가 지구별 주차면과 요금 수준을 비교하는 데 쓴다. 전역 조인 키는 없어 전국주차장정보표준데이터 같은 주차장 원장과는 주차장명·주소 매칭이나 좌표 근접으로만 이어 쓴다.
description_portal: 해당 데이터는 한강공원 주차장 정보 데이터입니다. 한강공원의 지구별, 주차장명, 위치정보, 면적수, 장애면수, 정기면수, 주중 이용시간, 주중 이용요금, 주말 이용시간, 주말 주차요금, 주차장, 운영업체, 업체대표자명, 업체 사업자번호, 업체 전화번호, 운영기간을 볼수 있으며 한강사업본부와 현업하는 업체를 구축으로 제공되는 주차장 정보입니다. 원본시스템은 한강 통합주차포털(https://www.ihangangpark.kr)입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
