summary_user: 서울교통공사 1~8호선 역별로 외국인이 1회용 교통카드로 타고 내린 인원을 일자·승하차구분·승객유형(영어·일어·중국어별 일반/어린이)마다 04시부터 03시까지 1시간 단위로 집계한 파일이며, 포털 설명상 이번 파일은 2025년 1~6월분이다. 관광·상권 분석가가 '중국어권 외국인 관광객이 어느 역에서 몇 시에 가장 많이 내리는가'처럼 외국인 방문 수요를 역·시간대별로 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 승하차·역 데이터와는 역명·호선 이름을 맞춰 연결해야 한다.
description_portal: '서울교통공사 1-8호선 1회권 외국인 일별 통행 통계 데이터 입니다. 연단위로 데이터가 업로드 되며, 데이터는 연번, 수송일자, 호선, 역명, 승하차구분, 권종, 승객유형, 시간대별 수송인원수 데이터로 구성되어 있습니다. (2025년 1월 ~ 2025년 6월 데이터 입니다.)역명: 서울교통공사 관할 1호선 ~8호선 역사승하차구분: 승차, 하차권종: 1회용 교통카드승객유형: 영어 일반, 영어 어린이, 일어 일반, 일어 어린이, 중국어 일반, 중국어 어린이시간대 예시: 04시 > 04시00분00초~04시59분59초'
