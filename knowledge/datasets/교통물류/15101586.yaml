summary_user: 목포시 관내 장애인 주차면이 있는 주차장을 주차장 한 곳당 한 행으로 담은 파일(csv, 약 5KB)로, 주차장명·공영/민영 구분·주소와 일반·장애인·전기차 주차 면수, 운영요일, 요금정보를 담는다. 장애인 운전자나 보호자가 '목포 시내 어느 주차장에 장애인 주차면이 몇 면 있고 요금은 얼마인가'를 확인하거나, 분석가가 시내 장애인 주차 인프라 분포를 살피는 데 쓴다. 전역 조인 키(주차장관리번호 등)가 없어 전국주차장정보표준데이터 등과는 주차장명·주소를 맞춰 이어야 하며, 좌표는 주소를 지오코딩해 얻는다.
description_portal: 본 데이터는 전라남도 목포시 관내에 설치된 장애인 전용 주차장에 대한 상세 현황을 제공합니다. 제공 항목으로는 주차장명, 주차장 구분(공영, 민영 등), 주차장 주소, 일반 차량 주차 면수, 장애인 차량 주차 면수, 전기차량 주차 면수, 운영 요일 및 요금 정보 등이 포함되어 있습니다. 이를 통해 목포시 내 장애인 주차시설의 분포 및 접근성을 파악할 수 있으며, 교통약자를 위한 주차 인프라 개선이나 정책 수립에 활용될 수 있습니다. 또한 사용자는 위치 기반의 주차장 검색과 요금 비교 등을 통해 실생활에서 필요한 주차 정보를 손쉽게 확인할 수 있습니다. 본 데이터는 지속적으로 갱신되며, 공공데이터 개방을 통해 시민의 정보 접근성을 높이고자 합니다.
