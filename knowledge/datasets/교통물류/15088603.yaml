summary_user: 국토교통부·국가철도공단·한국철도공사·도시철도 운영기관 등 철도관련 기관의 용역·구매·공사 발주계획을 건별로 담은 전국 단위 파일(CSV)로, 게시물등록일·구분·기관명·제목·내용으로 구성되고 내용에 상세업무와 배정예산액이 들어 있다. 철도 분야 건설·점검·유지보수 업체가 '올해 어느 기관이 선로유지보수나 정밀안전점검 용역을 얼마 예산으로 발주할 예정인가'를 미리 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 발주 제목을 이름 매칭해 이어 쓴다.
limits: 표준 기관 코드나 사업 코드가 없어 조달 실적·계약 데이터와 바로 붙일 수 없고, 기관명 문자열 매칭이 필요하다. 상세업무와 예산액이 내용 필드 안의 자유 텍스트로 들어 있어, 금액 집계나 비교를 하려면 따로 추출해야 한다. 발주계획 정보이므로 실제 발주·계약 결과는 담지 않는다.
