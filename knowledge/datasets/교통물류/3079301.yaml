summary_user: 경기도 부천시에 등록된 물류창고업체를 업체별 한 행으로 담은 원장 파일로, 업체명·소재지·창고종류·규모(㎡)·홈페이지·전화번호를 담는다(포털 설명상 12개소, 대부분 부천오정물류단지 내). 지역 물류 인프라 입지를 살피는 분석가나 사업자가 '부천시 어디에 어떤 종류·규모의 물류창고가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 매칭해 잇거나 같은 기관(부천시) 데이터끼리 연결한다.
limits: 사업자번호 같은 전역 키가 실측 컬럼에 없어 기업 정보와 바로 조인되지 않고, 업체명·주소 매칭에 의존해야 한다. 범위가 부천시 한 곳뿐이라 시도·전국 비교에는 다른 시군 자료가 함께 필요하다.
