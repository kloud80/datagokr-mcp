description_portal: 이 데이터는 LG U+와 BC카드의 고가치 민간 데이터를 금융결제원을 통해 결합해 만들어진 융합데이터 이다. 소비자의 소득구간에 따른 매장분류 판매정보를 담고있으며, 매장별 소비자 이용 행태정보를 비율값을 통해 휴게소 선호 컨텐츠를 확인할 수 있는 자료이다. 일반적인 휴게소 이용객과는 다른 개방형 휴게소 이용객들의 소비 및 행동 패턴을 심층적으로 분석할 수 있다. 휴게소별로 숙박·여행업, 레저·스포츠용품, 문화·취미, 유통업, 음식·음료 등 업종별 이용비율과 총판매액을 포함한다. 이를 통해 이용자의 업종별 소비 패턴과 선호도를 파악하고, 지역사회와의 연계성 및 상권 활성화 방안을 도출할 수 있다. 데이터는 전체 소비액과 업종별 판매 비중을 제공하여 휴게소 운영전략 수립, 지역 맞춤형 서비스 기획, 소비자 행동분석 등 다양한 정책·연구 분야에 활용 가능하다. 한국도로공사는 본 데이터를 통해 지역과 상생하는 휴게소 운영체계를 구축하고, 공공데이터 기반의 교통·상권 융합분석 및 지역경제 활성화에 기여하고자 한다.※ 본 데이터는 합성데이터로, 합성데이터 특성상 주기성 데이터 등록이 어려운 관계로 수시 1회성 데이터로 등록하였습니다.※ 본 데이터는 과학기술정보통신부 및 한국지능정보사회진흥원의 2025년 가명정보활용지원사업 지원을 받아 생성된 데이터를 기반으로 수행한 사업임
