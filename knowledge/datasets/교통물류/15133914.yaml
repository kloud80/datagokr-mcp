description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야 환경관리 정보 데이터로, 대구교통공사의 녹색제품 구매실적 현황 정보를 제공합니다. 데이터에는 조달 총구매금액, 조달을 통한 녹색제품 구매금액, 녹색장터를 통한 구매실적, 전체 녹색제품 구매실적, 총 구매금액 등의 주요 항목이 포함되어 있으며, 연도별 녹색제품 구매 현황과 친환경 구매 활동 실적을 확인할 수 있는 자료입니다. 해당 데이터는 연도별 녹색제품 구매실적 비교·분석, 공공기관 녹색구매 이행 현황 파악, 친환경 조달 관련 정책 및 운영 계획 수립을 위한 기초자료로 활용할 수 있습니다. 또한 녹색제품 구매 확대 및 환경친화적 소비 활동 현황을 관리하는 자료로 활용할 수 있습니다. 본 데이터는 연 1회 갱신되며, 녹색제품 구매실적 변동 사항을 반영합니다.'
