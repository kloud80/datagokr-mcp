status: active
summary_user: 인천공항 여객기의 출발·도착 운항편을 편 단위로 담은 API로, 조회일 기준 D-3~D+6일 범위의 항공사·편명·도착지 공항·예정/변경 일시·코드쉐어 여부·터미널 등을 돌려준다. 면세점 사업자나 여행객이 '오늘 제2터미널에서 출발하는 특정 편이 지연돼 출발시각이 바뀌었는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 항공사 IATA 코드(airlineCode)와 도착지 공항코드(airportCode)를 공항코드·항공통계 데이터와 이름·코드 매핑으로 이어 쓴다.
limits: 도착편 오퍼레이션(/getAPaxFlt4DutyFreeArrivals)은 최소 파라미터로 호출했을 때 응답이 없었으므로 조회조건을 갖춰 호출해야 한다. 표준 공통 키가 없어 다른 데이터와는 코드·이름 매칭으로만 연결된다. 개발계정은 하루 500회로 호출이 제한된다.
