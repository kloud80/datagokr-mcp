        required: false
        desc: 인천공항에서 출발하는 도착지 공항 코드 (IATA 공식 홈페이지 참조)
      - name: tmp1
        required: false
        desc: 기타
      - name: tmp2
        required: false
        desc: 기타
      - name: type
        required: false
        desc: 응답유형 [xml, json] default=xml
      - name: fgenTime
        required: false
        desc: Timestamp Year Month Day Hour Minute Second 이후 데이터 조회
