services:
  - op: /getAPaxFlt4DutyFreeDepartures
    name: 여객기 운항편 조회(면세점용) (출발)
    endpoint: https://apis.data.go.kr/B551177/statusOfAPaxFlt4DutyFree/getAPaxFlt4DutyFreeDepartures
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: searchdtCode
        required: false
        desc: '항공기 스케줄 조회기준 S: 예정시간기준,  E: 변경시간기준 default=E'
      - name: searchDate
        required: false
        desc: 항공기 스케줄 조회일자 default=sysdate
      - name: searchFrom
        required: false
        desc: 항공기 스케줄  ~시부터
      - name: searchTo
        required: false
        desc: 항공기 스케줄  ~시까지
      - name: flightId
        required: false
        desc: 항공편명
      - name: fgenType
        required: false
        desc: 'Message Type I(Insert): 신규 U(Update): 변경 D(Delete): 삭제 Default : !=D(Delete)'
      - name: terminalId
        required: false
        desc: '출발터미널 P01: 제 1터미널 P02: 탑승동 P03: 제 2터미널'
      - name: airport
        required: false
        desc: 인천공항에서 출발하는 편명의 도착지공항 한글명
