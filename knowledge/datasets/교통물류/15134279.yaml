description_portal: 인천국제공항공사에서 제공하는 인천공항 여객기 운항정보입니다. 여객기의 출발/도착 정보 현황에 대한 데이터로 조회일 기준 D-3~D+6일간의 운항현황 데이터를 확인할 수 있습니다. 예정시간 또는 변경시간 기준으로 조회시간 구분코드를 지정하여 조회일자와 시간별로 조회조건 적용이 가능합니다. 공항코드, 편명 UNIQ 코드,편명,3자리 IATA 공항코드, 언어구분 기준으로 조회조건을 제공합니다. 항공사,공항명,공항코드,예정일시 및 변경일시, 코드쉐어여부, 편명, 마스터편명, 탑승구, 터미널 구분, 운항현황, 항공기 운항 타입 등의 응답 데이터를 제공합니다. 개발계정 일 500 트래픽, 서비스 URL 및 상세 이용사례와 함께 운영계정 신청 시 일 10000 트래픽을 제공합니다.
