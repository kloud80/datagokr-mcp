description_portal: '한국교통안전공단 운수안전컨설팅지원시스템에서 관리하고 있는 운수회사 교육정보로운수회사 교통안전관리자 및 운수종사자가 수강하여야 하는 교육과정과 교육내용에 대한 정보를 제공합니다.운수회사의 안전관리체계 확립 및 증진 등을 위해 지정된 교통안전담당자들의 교통안전에 관한 전문지식과 기술능력을 향상시키기 위한 교육입니다.각 회차별 수강일시와 수강내역을 포함하고 있습니다.신규교육, 보수교육, 체험교육 등의 내용을 포함합니다.신규교육 : 교통안전담당자의 직무를 시작한 날부터 6개월 이내에 1회보수교육 : 교통안전담당자의 직무를 시작한 날이 속하는 연도를 기준으로 2년마다 1회'
