summary_user: 한국도로공사가 꼽은 전국 고속도로 상습 정체 구간을 구간별로 담은 작은 파일(CSV 약 3.7KB)로, 평일 정체와 주말 반복 정체를 구분하고 노선·정체구간·방향·연장(km)을 기록한다. 고속도로 이용자가 '주말에 이 노선 어느 방향 구간이 막히는가'를 확인해 운행 계획을 세우거나, 분석가가 정체 분산 정책의 대상 구간을 고르는 데 쓴다. 전역 조인 키가 없어 노선명·구간명(IC·JCT 이름)을 기준으로 같은 기관의 교통량·소통 자료나 표준노드링크와 이름을 맞춰 이어 써야 한다.
description_portal: 본 데이터는 한국도로공사가 제공하는 고속도로 상습 정체 구간 정보를 수록한 것이다. 평일에만 정체가 발생하는 구간과 주말에도 반복되는 정체 구간으로 구분되며, 노선명, 정체구간, 주행방향, 정체 연장 등의 항목으로 구성된다. 해당 정보는 고속도로 이용자의 운행 계획 수립, 교통 분산 유도, 정책 수립 등 다양한 목적으로 활용될 수 있다. 정체구간은 교통량 분석을 바탕으로 도출되었으며, 정기적인 업데이트를 통해 해당 데이터 자료를 제공한다. 본 자료는 교통 흐름 개선 및 정체 해소 정책 마련을 위한 기초 데이터로 기능한다.
