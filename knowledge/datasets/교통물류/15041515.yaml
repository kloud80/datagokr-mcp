summary_user: 서울교통공사가 운영하는 수도권 2호선의 역별·승강장별로 차량 순서와 출입문 번호마다 전동차와 승강장 사이 이격거리(안전거리)를 담은 건별 측정 파일이다. 교통약자 이동 지원 단체나 안전 분석가가 '2호선에서 열차와 승강장 틈이 넓은 역과 출입문은 어디인가'를 확인해 안전발판 설치 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어 다른 역 데이터와는 역명·노선명을 이름으로 맞춰 연결해야 하며, 같은 기관의 다른 노선 승강장이격거리 파일과 같은 컬럼 구조로 묶어 쓴다.
limits: 역 코드 같은 표준 조인 키가 없어 역 좌표·승하차 데이터와 연결하려면 역명 매핑이 필요하다. 행정구역 단위가 아닌 비공간 데이터라 지도 위 위치 분석에는 별도 역 마스터가 있어야 한다.
