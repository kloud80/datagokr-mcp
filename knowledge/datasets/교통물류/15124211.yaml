summary_user: 서울시 보행자 신호등(보행등)을 한 기기씩 담은 건별 원천 파일로, 자치구·도로 구분·부착대 종류·보행등과 연결 지주의 관리번호, X·Y 좌표와 상세 주소를 행마다 담는다. 보행 안전 분석가나 자치구 담당자가 '우리 구 어느 도로에 보행등이 몰려 있고 어디가 비어 있나'를 지도에서 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 자치구 이름 매칭이나 좌표·주소 기반 공간 결합으로 횡단보도·보호구역·사고 지점 자료와 겹쳐 본다.
description_portal: 서울시 보행자 신호등 분포도 데이터는 자치구별·도로구분별로 설치된 보행등의 위치(X·Y 좌표), 관리번호(보행등·연결지주), 부착대 종류(대·공·천·유 등)와 상세 주소를 포함한 표준화된 공공데이터입니다. 이 자료는 보행자 안전 분석, 교통신호 최적화, 유지보수 계획 수립, 사고 다발지점 파악 및 스마트 시티 교통 인프라 설계에 활용될 수 있습니다. GIS(지리정보시스템) 맵핑을 통해 신호등 밀집도 시각화, 보행 접근성 평가, 노후·손상 장비 우선 교체 대상 선정이 가능하며, 도시 계획·응급대응 경로 설정에도 중요한 근거자료로 쓰입니다. 데이터는 시설관리 및 정책결정에 투명성과 효율성을 제공해 교통사고 감소와 보행환경 개선에 기여합니다.
