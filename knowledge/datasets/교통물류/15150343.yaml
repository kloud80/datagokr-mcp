summary_user: 국토교통부 국가교통정보센터의 차량검지기(VDS) 기본정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 제공하며, 검지기 한 대마다 노선 번호·노선명, 시작·종료 이정, 도로 방향과 구간 길이, 도로 등급, 검지 구역 유형을 담는다. 교통 분석가가 특정 고속도로·국도 노선의 어느 이정 구간에 어떤 검지기가 설치돼 있는지 확인하고, 교통량·속도 측정값을 해석할 위치 기준표로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 플랫폼의 VDS 소통·교통량 데이터와는 검지기 ID(VDS_ID)나 노선 번호·노선명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
