summary_user: 한국교통안전공단 대중교통 현황조사에서 나온 지역 간 버스 이용인원을 고속버스·시외버스별로 평일·토요일·일요일로 나눠 명 단위로 담은 전국 단위 집계표이며, 파일 크기가 357바이트로 몇 줄 안 되는 요약 자료다. 분석가나 정책 담당자가 '고속버스와 시외버스 이용이 평일과 주말에 얼마나 다른가'처럼 지역 간 버스 수요의 요일별 차이를 살펴보는 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 항목(구분1)의 이름을 맞춰 붙이거나 같은 기관의 대중교통 현황조사 자료와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단에서 대중교통 현황조사를 통해 조사한 지역 간 대중교통 버스유형별 이용인원 데이터입니다.해당 데이터의 수단은 고속버스, 시외버스이며 수단별로 평일과 주말(토요일, 일요일)별로 이용인원을 세분화하여 제공하였습니다.단위는 명입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
