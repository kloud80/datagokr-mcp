summary_user: 제주특별자치도 대중교통의 급정차 발생 정보를 건별로 담으며, 노선번호(routeNo)와 위성측위 좌표·속도·시각, 센서 코드 같은 개별 위치 단위 항목으로 구성된다. 교통안전 분석가나 운수 관리자가 '제주 버스 급정차가 어느 노선·어느 지점에서 자주 일어나는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 노선번호로 제주 버스 노선·정류장 정보와 맞추거나 좌표로 위치 기반 매칭을 해서 이어 쓴다.
limits: 표준 조인 키가 없어 다른 데이터와는 노선번호 같은 이름·코드 매핑이나 좌표로만 연결된다. 범위는 제주특별자치도 한 곳이고, 개발계정 호출은 하루 1,000회로 제한된다.
