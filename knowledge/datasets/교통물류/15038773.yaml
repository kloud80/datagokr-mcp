description_portal: 경기도 김포시의 통과높이제한시설에 대한 정보를 제공합니다. 제공 항목으로는 행정읍면동,도엽번,도로구간번호,시설물종류,통과높이(미터),위도,경도,데이터기준일로 구성되어있습니다. 본 데이터를 통해 김포시 관내 읍면동별 통과높이제한시설 위치와 규모 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시청 도로관리과로 연락주시기 바랍니다.
