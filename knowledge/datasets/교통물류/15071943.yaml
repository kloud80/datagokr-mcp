summary_user: SRT 고속열차의 역별 평균 승차인원을 주차 단위로 집계한 표로, 한 행이 한 주차(주차구분)이고 수서·동탄부터 여수EXPO까지 32개 역이 열로 놓인 7KB 남짓의 CSV 파일이다. 철도 수요 분석가나 지역 정책 담당자가 '특정 역의 주별 SRT 이용객이 명절·휴가철에 얼마나 늘어나는가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 철도·역 데이터와는 역 이름을 직접 맞추거나 같은 기관(에스알) 자료끼리만 연결한다.
limits: 일반권 기준 집계라 정기권·회수권 승차는 빠져 있고, 하차인원이나 열차·시간대별 수치는 담지 않는다. 역 코드가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다.
