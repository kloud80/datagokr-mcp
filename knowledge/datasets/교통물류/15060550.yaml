description_portal: 인천교통공사에서 운영중인 도시철도 인천1호선, 인천2호선의 2025년 6월 30일 기준 전동차 안내방송 문안입니다. 해당 데이터는 호선, 역명, 안내문안(한국어), 안내문안(영어) 항목으로 구성되어있습니다.이 자료에는 인천 1호선 검단호수공원역에서 송도달빛축제공원역까지 총 33개역, 인천2호선 검단오류역에서 운연역까지 총 27개 역의 안내방송 문안이 포함되어있습니다.안내방송 문안에는 도착역명 뿐 아니라 해당 열차의 종착역 정보, 환승 노선 안내, 역주변 정보, 종착역의 경우 유실물 예방 안내 등이 포함되어있습니다.
