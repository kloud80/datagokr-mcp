summary_user: 대전광역시 도로관리시스템에 등재된 교차시설(교차로·입체교차로·램프·연결로 등)을 시설 한 건씩 담은 파일로, 시설명·교차로명·교차방식·교차로 수·행정읍면동·도로구간번호와 위도·경도 좌표를 포함한다. 교통·도시계획 분석가가 대전 시내 입체교차로나 램프가 어느 동, 어느 도로구간에 몰려 있는지 지도에 찍어 보는 질문에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 좌표, 행정읍면동 이름, 같은 기관의 도로구간번호·관리번호로만 연결한다.
description_portal: 대전광역시_교차시설 현황 데이터는 대전광역시 도로관리시스템에 등재된 교차시설의 위치, 종류, 설치 구간, 관리 상태 등 다양한 정보를 포함하고 있습니다. 이 데이터는 도로의 교차로, 입체교차로, 램프, 연결로 등 다양한 교차시설의 현황을 체계적으로 관리하고, 교통 흐름 개선, 교통안전 강화, 도시 인프라 운영 등에 중요한 역할을 합니다. 교차시설 현황 자료는 교통 정책 수립, 시설물 유지보수, 도시계획, 교통사고 예방 등 다양한 행정적 목적에 활용될 수 있습니다. 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴이 직접 구축·정비한 데이터로, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
