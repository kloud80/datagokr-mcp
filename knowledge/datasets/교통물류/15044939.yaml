summary_user: 대구교통공사가 2010년부터 개최한 DTRO문화한마당의 운영실적을 연도별로 정리한 소규모 CSV 파일(약 3.7KB)로, 개최기간·행사장소·행사내용·건수와 참여단체명·단체 수를 담는다. 시민이나 분석가가 도시철도 공간에서 해마다 어떤 공연·전시·캠페인이 몇 건 열렸고 몇 개 단체가 참여했는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 행사장소(역 이름)나 개최년도를 이름 기준으로 맞춰 대구교통공사의 역·승하차 자료 등과 이어 써야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 시민소통 및 문화정보를 제공하는 사회(Social) 분야 데이터로, 2010년부터 최근까지 대구교통공사에서 개최한 DTRO문화한마당 운영실적에 대한 정보를 제공하는 공공데이터입니다. 해당 데이터는 행사 개최기간, 행사장소, 행사내용, 연도별 행사 건수를 포함하고 있으며, 각 행사에 참여한 단체명과 참여단체 수도 함께 제공합니다. 공공기관의 문화사업 운영성과를 시민과 공유하고 도시문화 향유 기회 확대에 기여하는 자료로, 대중교통 공간을 활용한 공연, 전시, 캠페인 등 다양한 문화행사의 운영 내역을 확인할 수 있습니다. 이를 통해 공공시설의 문화적 활용도와 시민참여 현황을 종합적으로 파악할 수 있습니다.'
