limits: 표준 조인 키가 없어 다른 데이터셋과 자동 결합이 어렵고 등록번호·등록명 대조로만 연결된다. 필드에 권리 종류를 구분하는 별도 코드가 확인되지 않아 특허·상표·저작권 구분은 등록번호나 등록명으로 판단해야 한다.
