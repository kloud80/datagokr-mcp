description_portal: 대구지하철2호선에 포한된 도시광역철도역들의 철도운영기관명, 선명, 역명, 비상사다리의 역층, 상세위치의 데이터가 있습니다.비상시에 인명을 구호하는데 사용되는 물품으로 평시에 관리가 잘 되어 있어야 한다.해당 지하철의 깊이와 인접역과의 거리를 고려하여 설치되어 있읍니다.터널 내 대피가 필요한 경우, 승강장에 설치된 비상 사다리를 이용해 침착하게 터널로 이동하세요역과 역 사이 또는 승강장 화재로 지상으로 대피가 불가능할 때에는     - 승강장에 비치된 비상사다리를 이용해 터널로 내려간 후     - 열차 진행방향의 선로를 따라 다음 역으로 이동 대피합니다.     - 부상자 및 교통약자(장애인, 어린이, 노약자, 임산부 등)가 먼저 대피할 수 있도록 배려하고 도와줍니다.
