summary_user: 경찰청이 제공하는 어린이 보행자 관련 교통안전 위험요소 정보를 건별로 담으며, 각 건에 위험요소 분류(대·중·소분류 코드), 지번·도로명 주소, 위경도, 데이터 기준일자, 상세 내용이 있고 범위는 전국이다. 학부모나 지자체 담당자가 통학로 주변에서 어린이 보행자에게 위험한 지점이 어디인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 주소나 위경도를 이용한 위치 매칭, 또는 이름·코드 매핑으로 연결하며, 어린이보호구역·무인교통단속카메라 표준데이터와 위치 기준으로 겹쳐 보는 방식이 현실적이다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-보행자별 데이터는 경찰청에서 제공하는 정보입니다.
