summary_user: 한국교통안전공단이 시행하는 택시운전자격 CBT 시험의 회차 정보를 시험일자번호·시험구분·지역·시험장소 단위로 담은 전국 범위 CSV 파일(약 857KB)이다. 택시 자격시험을 준비하는 사람이나 분석가가 '어느 지역 어느 시험장에서 언제 택시 자격시험이 열렸나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·시험장소명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '한국교통안전공단 택시운송종사 데이터 및 택시CBT관련 데이터 입니다시험일자번호, 시험구분, 지역, 시험장소 정보가 있습니다- 국가자격시험은 여객자동차 운수사업법에 근거하여 한국교통안전공단에서 시행하고 있는 제도입니다.- 택시자격시험은 총 4개 과목(교통법규, 안전운행, 지리, 안전서비스)에 대한 내용으로 과목당 20문제(지리 10문항), 총 70문제가 출제됩니다.- 전체 100점 만점 중 60% 이상 득점하여야 합격 처리됩니다.- 자격시험 합격 후 현장에서 자격증을 발급받으실 수 있습니다.   (준비물 : 운전면허증, 사진 1매, 전체기간 운전경력증명서)- 택시자격시험 합격 후 취업 전까지 운전적성검사를 통과 하여야 됩니다.- 택시자격시험 정보는 지역본부-본사 간 서버 통신을 통해 시험장소, 선택항목, 선택시간 등 상세 데이터를 전송하며, 본사 서버 내에 보관 및 관리하게 됩니다.'
