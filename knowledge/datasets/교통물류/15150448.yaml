summary_user: TS-BIS(버스정보시스템)의 광역버스 정보에서 관할 지자체 기반정보를 담은 전국 범위 CSV 파일(약 7KB)로, 관할관청 코드와 행정자치부 코드, 광역시도명·시군구명을 지자체 단위로 정리한 소규모 기준표다. 분석가나 개발자가 광역버스 노선 데이터에 나오는 관할관청 코드가 어느 시도·시군구를 가리키는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관(한국교통안전공단)의 버스 노선·정류장 데이터와는 관할관청코드로, 다른 행정 데이터와는 시도명·시군구명 이름 매칭으로 잇는다.
description_portal: '- 한국교통안전공단에서 운영하는 TS-BIS(버스정보시스템)는 중소도시 대중교통 이용자의 교통복지 향상과 교통정보 격차 개선을 위한 버스정보를 제공하고 있습니다.- 관할 지자체 기반정보(기점정류장, 종점정류장, 노선기본정보, 기점노드, 종점노드, 관할관청)를 공개하고 있습니다.(2026년 7월 기준)- 데이터를 활용하여 학계, 연구기관, 지자체는 버스노선 개편, 대중교통 정보제공 알고리즘 고도화 및 정확성 향상, 노선 이탈률 감소 방안, 지역별 맞춤형 정보 제공 등 연구에 기여할 수 있습니다.'
