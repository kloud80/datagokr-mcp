summary_user: 한국공항공사가 운영하는 전국 공항(인천국제공항 제외)의 주차장별 실시간 주차 현황을 담으며, 주차장마다 전체 주차면 수, 입고·출고 차량 수, 현재 주차 차량 수와 갱신 일자·시각을 제공한다. 공항 이용객이 출발 전 "지금 김포공항 주차장에 자리가 남아 있나"를 확인하거나, 분석가가 시간대별 주차 점유 패턴을 쌓아 공항 접근 수요를 살피는 데 쓴다. 전역 조인 키는 없으므로 다른 항공 데이터와는 한글·영문 공항명(aprKor, aprEng)을 공항코드나 운항·여객 통계의 공항명에 이름으로 맞춰 연결한다.
limits: 공항 코드 같은 공통 키가 없어 다른 데이터와 붙이려면 공항명 문자열을 직접 매핑해야 한다. 실시간 현황만 주는 API이므로 과거 추이를 보려면 이용자가 주기적으로 호출해 쌓아야 하며, 개발계정은 하루 5,000회로 호출이 제한된다.
