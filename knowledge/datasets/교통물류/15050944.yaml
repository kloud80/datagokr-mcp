summary_user: 대구광역시 시내버스 정류소를 한 행씩 담은 목록 파일로, 정류소ID·모바일ID·한글·영문 정류소명·시도·구군·동·X·Y 좌표·경유노선수·경유노선 목록을 담는다(포털 설명상 2019년 5월 기준, CSV 약 390KB). 시민이나 분석가가 '우리 동네 정류소에 어떤 노선이 몇 개 지나는지', '구·군별 정류소 분포와 노선 밀도는 어떤지'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 정류소명·행정구역(구_군·동) 이름 매칭이나 좌표 기반 공간 결합, 또는 대구시 BIS 등 같은 기관 데이터의 정류소ID로만 이어 쓴다.
description_portal: 2019년 5월 기준 대구광역시 시내버스 정류소의 전체 목록파일입니다.정류소ID, 모바일ID, 정류소명(한글), 정류소명(영어), 행정구역, GPS(X-Y좌표), 경유노선수, 경유노선 등의 내용이 포함된 CSV 파일형식의 자료입니다.  시민들의 대중교통 이용 편의를 높이기 위해 제공되는 자료로, 정류소별 정보를 체계적으로 정리하여 이용자에게 정확한 정보를 전달하고자 합니다. 추가로 궁금한 사항이 있으시면 대구광역시 교통정보운영과 교통운영팀(☎053-803-6861)으로 연락해주시기 바랍니다.
