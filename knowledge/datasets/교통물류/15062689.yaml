summary_user: 통영시 도시정보시스템에 등록된 지하차도를 시설 한 곳당 한 행으로 담은 건별 파일로, 관리번호·행정읍면동·관리기관과 총연장·폭원·통행제한높이·왕복차로수 같은 제원, 경도·위도 좌표를 포함한다(CSV 약 3.8KB의 소규모 파일). 높이 제한이 있는 화물차 운전자나 운송 사업자가 '통영시 지하차도의 통행제한높이와 위치는 어디인가'를 확인하거나, 분석가가 시설 규모와 구조물 등급을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 행정읍면동 이름이나 경도·위도 좌표로 공간 결합하고, 터널·교량·지하차도 제공표준에 맞춰 다른 지자체 지하차도 파일과 합쳐 쓴다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 이름 매칭이나 좌표로만 연결된다. 범위는 통영시 한 곳뿐이라 다른 시군구 지하차도는 별도 파일을 모아야 한다.
