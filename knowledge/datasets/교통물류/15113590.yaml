summary_user: 고속국도·일반국도·지방도·국가지원지방도의 노선별 평균일교통량을 승용차·버스·화물차로 나눠 대수와 구성비로 담은 전국 단위 집계 파일(약 10KB CSV)입니다. 도로 정책 담당자나 연구자가 '어느 노선이 화물차 비율이 높은가', '도로등급별로 교통량이 어떻게 다른가'를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 교통량·도로 데이터와는 도로등급·노선번호·노선명을 이름이나 번호로 맞춰 연결해야 한다.
limits: 조사지점이나 구간 단위가 아니라 노선 단위 집계라서 특정 지점·영업소의 교통량이나 공간 위치는 알 수 없다. 표준 코드 같은 조인 키가 없어 다른 데이터와 붙일 때는 노선명·노선번호를 직접 대조해야 한다.
