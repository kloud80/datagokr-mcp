description_portal: 행복도시에 설치된 회전교차로(Roundabout) 현황 데이터입니다. 회전교차로는 차량이 원형 교차로를 시계 반대 방향으로 순환하며 통행하는 도로 구조로, 직진·좌회전 시 신호대기 없이 주행이 가능해 교통사고를 약 30% 줄이고 혼잡을 완화하는 효과가 있습니다. 데이터에는 위치(동), 생활권별 운영현황(운영 중 또는 설치 계획), 규모(차로 수 등), 설치주체(LH, 민간, 타기관) 정보가 포함됩니다. 이를 통해 행복도시 내 회전교차로의 분포를 파악하고, 시설 확충 계획, 교통안전 대책 수립, 교통흐름 분석 등 다양한 분야에서 활용할 수 있습니다.
