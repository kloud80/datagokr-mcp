summary_user: 경기도 의왕시 관내 보도육교를 한 건씩 기록한 시설물 대장 파일로, 육교명·소재지·구조물 등급·구체와 계단·난간 제원·장애인 램프 유무와 함께 위도·경도 좌표를 담는다(3.8KB 규모의 소량 CSV). 보행안전지수 지도를 만드는 분석가나 시민이 의왕시 육교가 어디에 있고, 장애인 램프가 있는지, 구조 등급은 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 좌표·소재지 기준 공간 매칭이나 행정동읍면코드·도로구간 번호 같은 기관 코드로만 이어 쓴다.
description_portal: 이 데이터는 의왕시 관내에 설치된 육교의 현황을 기록한 공간정보 자료로, 보행안전지수 지도 시각화를 위한 중간 데이터로 활용됩니다. 공간지리식별번호, 지형지물부호, 도로구간번호를 비롯해 육교명, 구조물 등급, 면적, 높이, 계단 정보, 위도·경도 좌표 등이 포함되어 있어, 육교의 물리적 특성과 위치를 파악할 수 있습니다. 데이터는 이러한 육교의 설치 위치와 구조 정보를 기반으로, 보행환경의 안전도를 분석하고 시각화하는 데 필요한 기초 자료로 활용됩니다. 2022년 기준으로 수집된 1회성 데이터이므로 참고용으로 적합합니다.
