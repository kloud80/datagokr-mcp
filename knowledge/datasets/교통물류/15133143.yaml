summary_user: 외항선이 국내 항만에 입항할 때 Port-MIS로 제출한 평형수 입항 신고를 건별로 담은 전국 단위 파일(CSV 약 3.9MB)로, 항구청·선박 식별정보와 평형수 보유량·교환량·탱크별 이력, 관리계획서 비치·실행 여부를 포함한다. 항만 관리자나 해양환경 연구자가 "어느 항만에 어떤 국적·선종의 선박이 평형수를 얼마나 싣고 들어와 교환했는가"를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않았으며, 같은 Port-MIS 입출항 자료와는 호출부호·IMO 번호(국제해사기구식별번호)·입항년도·입항횟수 같은 이름 매핑으로만 이어 붙인다.
limits: 실측 컬럼에서 공통 조인 키를 찾지 못해 다른 데이터와는 선박 식별번호나 항구명 문자열 매칭에 의존해야 한다. 공간 좌표가 없는 비공간 자료이므로 지도 분석에는 별도 항만 위치 정보가 필요하다.
