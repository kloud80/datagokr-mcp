description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 외항선이 국내 항만에 입항할 때 평형수 입항 신고 정보를 수집한 목적으로 구축된 데이터입니다.  본 데이터의 주요 내용은 평형수의 입항 관련 신고 내역으로 구성되어 있으며, 항구청명, 선박의 호출번호, 총톤수 등 정보와 선박의 평형수보유량, 교환용량 정보 등이 포함되어 있습니다.  본 데이터는 항만운영 및 선박관리 업무에서 평형수 관리 및 규제 이행 현황을 파악하고, 해양환경 보전 정책 수립이나 평형수에 의한 해양생태계 변화 연구, 항만별 입항 선박 동향 분석에 활용될 수 있습니다.
