summary_user: 안산시 주요 도로·교차로에 설치된 CCTV를 장비 1대당 1행으로 담은 위치 목록으로, 고유번호·설치 위치·도로 고유번호·경위도와 TM 좌표·CCTV 유형·모니터링 여부 등 12개 항목을 담는다. 교통 분석가나 관제 시스템 설계자가 '안산시 어느 교차로에 교통 CCTV가 있고 실시간 모니터링 대상인가'를 확인하거나 지도에 배치할 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 경위도 좌표를 이용한 공간 결합이나 설치 위치 이름 매칭, 같은 기관 데이터의 도로 고유번호로 연결한다.
