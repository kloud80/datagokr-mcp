summary_user: 대전광역시 도로관리시스템에 등재된 점자블록 등 장애인 이동 편의 도로시설물을 시설물 한 건씩 담은 원천 목록으로, 위치(WKT 좌표), 읍면동, 설치일자, 턱낮추기 유무, 유도블럭 종류·연장·면적을 포함한다. 보행 약자 정책 담당자나 분석가가 "우리 동네 횡단보도 주변에 점자블록과 턱낮추기가 제대로 설치돼 있나"를 확인하거나 읍면동별 설치 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 행정읍면동 이름 매핑이나 WKT 좌표를 이용한 공간 결합, 같은 기관 도로구간번호로만 잇는다.
description_portal: 대전광역시 장애인편의시설 도로시설물 현황 데이터는 대전광역시 도로관리시스템에 등재된 점자블록 등 장애인 이동 편의를 위한 다양한 시설물의 위치, 종류, 설치 구간, 관리 상태 등의 정보를 포함하고 있습니다. 이 데이터는 장애인의 안전한 보행 환경 조성과 이동권 보장, 교통 약자에 대한 지원 정책 수립에 중요한 역할을 합니다. 장애인편의시설 현황 자료는 도로시설물의 설치 및 유지보수, 접근성 개선, 도시 인프라 관리 등 여러 행정적 목적에 활용될 수 있도록 구성되어 있습니다. 2022년 공공데이터 기업 매칭 지원사업을 통해 청년 인턴이 직접 구축하고 정비한 데이터로, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
