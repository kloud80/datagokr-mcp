summary_user: 전국 전기차 충전기별 위치와 운영정보(시도·군구·주소, 충전소명, 시설구분, 기종, 운영기관, 급속충전량, 충전기타입, 이용자제한)를 담은 건별 파일 데이터로, 검증 시 190,498행을 받았다. 전기차 이용자나 구매 예정자가 사는 지역 주변에 어떤 타입의 충전기가 어디에 있는지 찾을 때 쓴다. 이어 쓰는 키는 주소(address)뿐이라 주소 기준으로 다른 시설·지역 자료와 맞춰 보며, 별도 코드표는 명세에 없다.
description_portal: '전기차 충전소 위치 및 운영정보: 전국 전기차 충전소의 운영기관, 주소, 충전기 타입, 충전용량 등에 대한 데이터 입니다.항목: 시도,군구,주소,충전소명,시설구분(대),시설구분(소),기종(대),기종(소),운영기관(대),운영기관(소),급속충전량,충전기타입,이용자제한,충전기ID업무체계분류: 환경, 대기중장기 개방 대상 여부: 해당없음개별포털 등록여부: 아니오전기차 이용자 및 구매 예정자 분들에 대한 유용한 공공데이터로 제공드리는 자료입니다.자료 관련 추가 문의사항이나 요청사항은 한국환경공단 친환경모빌리티처 자동차환경계획부로 문의부탁드립니다.감사합니다.'
