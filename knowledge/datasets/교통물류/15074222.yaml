summary_user: 2014년 대중교통 현황조사에서 교통카드 등의 자료를 분석해, 전국 대중교통 이용인원을 월요일부터 일요일까지 요일별로 집계한 소규모 파일(csv, 894 bytes)이다. 교통정책 분석가나 연구자가 '2014년 기준 평일과 주말 사이, 또는 요일마다 대중교통 이용량이 얼마나 달랐나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 항목 이름을 맞추거나 같은 기관 자료와 대조하는 방식으로만 잇고, 이후 연도는 평일·주말로 나눠 제공하는 '한국교통안전공단_대중교통 이용인원 현황'과 비교해 쓴다.
description_portal: 대중교통 현황조사를 통해 교통카드 등의 데이터를 조사, 분석하여 제공한 2014년 대중교통 요일별 이용인원 자료입니다.해당 데이터는 요일별(월요일, 화요일, 수요일, 목요일, 금요일, 토요일, 일요일)로 구분하여 데이터를 제공하였으나,현재 대중교통 현황조사에서는 평일과 주말(토요일, 일요일)로 데이터를 분석하여 제공하고 있습니다.해당 데이터는 '한국교통안전공단_대중교통 이용인원 현황' 데이터를 통해 확인하실 수 있습니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.
