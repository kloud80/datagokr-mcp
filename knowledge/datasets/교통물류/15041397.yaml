summary_user: 공항철도가 관리하는 역별 고객센터(안내데스크)의 위치와 연락처를 역 단위로 담은 소규모 파일(csv 약 1KB)로, 운영기관명·노선명·역명·지상/지하 구분·역층·상세위치·전화번호를 담는다. 공항철도 이용객이 "이 역 고객센터는 몇 층 어디에 있고 전화번호는 무엇인가"를 확인하거나 유실물·불편 문의처를 찾을 때 쓴다. 전역 조인 키는 없어서 다른 역 데이터(역 위치, 승하차 통계 등)와는 역명·노선명을 이름으로 맞춰 이어 쓴다.
limits: 표준 역코드 같은 공통 키가 없어 다른 데이터와는 역명 문자열 매칭에 의존하므로 표기 차이에 주의한다. 포털 설명의 타 지하철 기관 문의 전화번호는 설명문 내용일 뿐 파일 데이터에 포함된 것으로 확인되지 않았다.
