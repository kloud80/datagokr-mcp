summary_user: 인천광역시 남동구에 등록된 택시업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 상호·소재지·대표자·연락처·면허 대수·현직 운전자 수·영업 시작일·데이터 기준일이 들어 있으며 파일 크기는 약 910바이트의 작은 CSV다. 남동구 안에 어떤 법인택시 업체가 있고 업체별 면허 대수 대비 현직 운전자가 얼마나 되는지를 확인하려는 주민·행정 담당자·교통 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명이나 주소를 맞추거나 같은 기관(남동구)의 자료끼리만 이어 쓴다.
limits: 범위가 남동구 한 시군구에 한정되어 인천 전체나 다른 구의 택시업체는 담지 않는다. 사업자번호 같은 공통 키가 없어 다른 데이터와 연결하려면 업체명·주소 문자열을 맞춰야 한다.
