summary_user: 부산교통공사가 운영하는 부산 도시철도 2호선 역들(서면·해운대·양산 등)에 설치된 비상콜폰의 위치를 역명·역층·상세위치(상선/하선 승강장, 출입구 번호 등) 단위로 한 줄씩 담은 CSV 파일(약 19KB)이다. 역사 안전 점검 담당자나 이용객 안내 서비스 개발자가 '이 역의 어느 층, 어느 승강장에 비상콜폰이 있는가'를 확인하는 데 쓴다. 전역 조인 키나 역 코드가 없어 다른 역·시설 데이터와는 역명·노선명 같은 이름을 맞춰서만 이어 쓴다.
limits: 역 코드 같은 공통 키가 없어 다른 철도 데이터와 연결할 때 역명 표기 차이를 직접 맞춰야 한다. 범위가 전국으로 표기돼 있지만 내용은 부산 2호선 역에 한정되고, 좌표 없이 역 내 위치를 글로 적은 비공간 자료이다.
