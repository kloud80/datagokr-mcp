description_portal: 이 데이터는 해양수산부에서 현재 등록된 선박을 선종, 선령별로 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 선령(5년미만, 5~10년미만, 10~15년미만, 15~20년미만, 20~25년미만, 25~30년미만, 30~35년미만, 35년 이상)에 따라 여객선, 화물선, 유조선, 예선, 부선, 기타 선박으로 나누어 등록된 선박의 척수와 총톤수 정보를 집계한 자료로 구성되어 있습니다.  본 데이터는 선박의 노후도 분석, 선종별 운항 현황 파악, 선박등록 정책 수립, 해운 산업 구조 변화 모니터링, 선박안전관리 대책 마련, 해양 관련 통계자료 산출 등에 활용될 수 있습니다.
