summary_user: 전국에 등록된 선박을 선령 구간(5년 미만부터 35년 이상까지 5년 단위)과 선종(여객선·화물선·유조선·예선·부선·기타)별로 나눠 척수와 총톤수를 연월 기준으로 집계한 파일로, 개별 선박 단위가 아닌 집계표입니다. 해운 정책 담당자나 분석가가 '20년 넘은 노후 여객선·화물선이 얼마나 되고 총톤수 비중은 어떤가' 같은 선박 노후도·선종 구성 변화를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 선박 통계와는 연월·선종 이름을 맞춰 붙이는 방식으로만 연결한다.
limits: 집계표라 선박원부의 선박등록번호·IMO·MMSI 같은 개별 선박 키가 없어 개별 선박 정보와 직접 연결할 수 없다. 범위는 전국 단위이며 지역(선적항)별 분해는 담고 있지 않다.
