summary_user: 경기도 고양시에서 허가증을 받은 노점상(길벗가게, 교통카드판매소, 구두수선소)을 점포 한 곳씩 담은 건별 파일로, 허가번호·업종·폐업여부·인허가일자·점용면적과 지번·도로명 주소가 들어 있다. 고양시 안에서 특정 동네나 도로에 허가받은 구두수선소나 교통카드판매소가 어디 있는지, 영업 중인지를 확인하려는 시민이나 보도 점용 현황을 보려는 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(소재지도로명주소)를 지오코딩하거나 업종명·시군명 같은 이름으로 맞춰 이어 쓴다.
description_portal: 경기도 고양시 관내 매년 허가증 발급받은 노점상(길벗가게, 교통카드판매소, 구두수선소) 현황(2025. 9. 10. 기준)에 대한 데이터로 점포명, 허가번호, 업종명, 폐업여부, 인허가일자, 점용면적, 소개지 지번, 소재지 도로명 주소 등의 자료를 제공합니다. 아울러 고양시 노점판매대 운영규정에 따라 매년 해당 점용부분에 대한 점용료 납부 및 실태조사(허가자 직접 운영 여부,  판매품목, 허가 장소, 허가 면적, 허가 보조원 여부, 가림막신청 여부) 등을 통한 허가 연장 신청 접수 및 검토 후 허가증을 발급하고 있습니다.
