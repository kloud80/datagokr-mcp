description_portal: 이 데이터는 제주특별자치도가 제공하는 “어린이보호구역 내 미끄럼방지시설 현황” 자료입니다. 어린이보호구역 내 보행로 또는 도로 구간에 설치된 미끄럼 방지 포장 또는 노면 마감 상태 정보를 담고 있으며, 각 기록에는 위치(위도·경도), 설치 여부, 시설 유형 등이 포함되어 있습니다. 전체적으로 도내 보호구역에서 어린이 보행 안전을 확보하기 위해 어느 구간에 미끄럼방지시설이 적용되었는지를 확인할 수 있도록 구성되어 있습니다.이 자료는 스쿨존 내 보행 환경 평가, 노면 상태에 따른 사고 위험 분석, 추가 미끄럼방지 포장 필요 구간 파악, 보행 안전 개선 우선순위 설정 및 정책 계획 수립을 위한 기초자료로 활용될 수 있습니다.
