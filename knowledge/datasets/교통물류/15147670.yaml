description_portal: '서울시 동대문구에서 제공하는 주정차금지(지정)구역 관련 데이터를 제공합니다.항목: 도로명, 상세위치, 주차금지시작시간, 주차금지종료시간 등(규제「도로교통법」 제33조)-모든 차의 운전자는 다음 각 호의 어느 하나에 해당하는 곳에 차를 주차해서는 안됩니다.1. 터널 안 및 다리 위2. 다음 각 목의 곳으로부터 5미터 이내인 곳가. 도로공사를 하고 있는 경우에는 그 공사 구역의 양쪽 가장자리나. 「다중이용업소의 안전관리에 관한 특별법」에 따른 다중이용업소의 영업장이 속한 건축물로 소방본부장의 요청에 의하여 시ㆍ도경찰청장이 지정한 곳3. 시ㆍ도경찰청장이 도로에서의 위험을 방지하고 교통의 안전과 원활한 소통을 확보하기 위하여 필요하다고 인정하여 지정한 곳'
