summary_user: 경춘선 도시광역철도역마다 운영기관명, 노선명, 역명, 십진수 도(DD) 형식의 경도·위도를 한 행씩 담은 역 단위 원천 파일(csv, 약 1KB)이다. 분석가나 사업자가 '이 건물이나 매물이 경춘선 어느 역의 역세권에 드는가'를 판정할 때 역 기준점으로 쓴다. 공통 역 코드 같은 전역 조인 키가 없어서, 다른 철도·승하차 데이터와는 역명·노선명을 맞춰 붙이거나 같은 기관의 다른 노선 역위치 파일과 묶어 쓴다.
description_portal: 경춘선에서 운영하는  도시광역철도역들의 철도운영기관명, 선명, 역명, 경도, 위도 에 대한 데이터가 있는 파일데이터 입니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
