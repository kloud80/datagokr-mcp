summary_user: 광양시 버스 정류장별로 7자리 정류소 ID, 모바일 ID, 정류소 이름, 위경도 좌표, 경유 노선 이름과 노선 ID 목록을 담은 건별 원장 API다. 시민이나 교통 앱 개발자가 '이 정류장은 어디에 있고 어떤 노선이 지나가나', '여기서 갈아탈 수 있는 노선은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 같은 광양시 버스 데이터와는 정류소 ID·노선 ID 같은 기관 코드로 잇고, 다른 데이터와는 정류장 이름이나 좌표로 맞춰 쓴다.
description_portal: 광양시 버스 정류장과 관련된 주요 정보를 종합적으로 제공하며, 제공 항목에는 정류소 ID(7자리), 모바일 ID, 정류소 이름, 위도, 경도, 경유 노선 명, 경유 노선 ID 등이 포함됩니다. 이를 통해 사용자는 특정 정류장이 어떤 위치에 있으며, 어떤 노선들이 해당 정류장을 경유하는지를 정확하게 파악할 수 있습니다. 또한 모바일 ID를 통해 모바일 기반 서비스와의 연계가 가능해지고, 경유 노선 정보를 함께 제공함으로써 환승 가능 노선 확인, 정류장 중심 교통 분석, 이용자 이동 동선 파악 등 다양한 활용이 가능합니다. 이러한 상세한 정류장 정보는 교통 안내 서비스 구축, 위치 기반 지도 서비스, 대중교통 모니터링, 스마트시티 교통 시스템 등 여러 분야에서 유용하게 활용될 수 있습니다
