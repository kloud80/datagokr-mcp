summary_user: 철도특별사법경찰대가 관할 철도역사에 설치해 운영하는 방범용 CCTV를 설치 지점별로 담은 원천 목록으로, 관리기관·도로명주소·위도·경도·설치목적·카메라 대수와 화소수·촬영 방면·영상 보관일수·설치년월을 전국 범위로 담는다(CSV 약 20KB). 역 이용자나 안전·도시 분석가가 '이 역 주변에는 철도경찰 CCTV가 몇 대 있고 영상은 며칠 보관되나'를 확인하거나 역별 방범 설비 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 역명·주소 문자열 매칭이나 위도·경도 좌표를 기준으로 역 위치 마스터 등 다른 철도역·시설 데이터와 공간적으로 이어 쓴다.
description_portal: '- 국토교통부 철도특별사법경찰대에서 철도지역내 철도역사에 설치하여 운영 중인 철도방범영상감시설비 자료를 제공합니다.- 고정형영상처리기기를 운영하며 관할 역사별 CCTV 현황(관리 센터, 대수, 설치목적 등) 을 제공합니다.- 철도특별사법경찰대 상주 센터가 있는 각 역에 보유 및 관리 CCTV 안내판이 설치 되어 관련 정보가 공개되어 있습니다 .- 자세한 현황은 철도경찰대 대표 홈페이지(https://police.molit.go.kr/intro.do) 하단 <개인정보처리방침> - <영상정보처리기기 운영.관리 방침> 에서 확인하여 주시기 바랍니다.'
