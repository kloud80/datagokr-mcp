summary_user: 대구교통공사 도시철도에서 발생한 철도사고와 운행장애를 연도별·구분·세분류별로 나누어 1월~12월 월별 건수로 담은 집계 통계로, 약 1.3KB 크기의 작은 CSV 파일입니다. 시민·연구자·안전 분석가가 '대구 도시철도의 운행장애가 어느 달, 어떤 유형에서 많이 났는가'처럼 시기별·유형별 사고 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 사고 유형 이름을 맞추거나 같은 기관(대구교통공사) 데이터끼리 묶어서만 이어 쓴다.
