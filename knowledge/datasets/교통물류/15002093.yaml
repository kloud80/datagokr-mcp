description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구교통공사에서 발생한 철도사고 및 운행장애에 대한 연간·월별 통계 정보를 제공합니다. 주요 항목은 열차사고, 철도교통 사상사고, 각종 운행장애의 발생 현황과 사고 건수, 사고 유형, 피해 발생 금액 등으로 구성되어 있으며, 도시철도 운영 과정에서 발생하는 위험 요소와 안전관리 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다. 또한 시기별 사고 발생 추이와 유형별 특성을 분석하여 사고 예방 대책 수립, 안전관리 정책 개선, 운영 효율성 향상 및 위험요인 관리 등을 위한 기초자료로 활용될 수 있습니다. 아울러 공공교통의 안전성 확보와 시민의 안전한 도시철도 이용환경 조성, 데이터 기반 안전관리 체계 구축을 위한 행정 및 연구 분야의 기초자료로 활용할 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
