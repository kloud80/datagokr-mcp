summary_user: 경기도 내 도로 호선별 정체구간 비율(%)을 연도별로 담은 집계 자료로, 도로종류(고속국도·일반국도·국가지원지방도·시군도 등)와 호선명·호선코드별로 한 행씩 기록한다. 교통 분석가나 도로 정책 담당자가 '경기도에서 정체 비중이 가장 높은 노선은 어디이고 해마다 나아지고 있는가'를 따질 때 쓴다(정체 기준은 고속도로 통행속도 40km/h 미만, 그 외 도로 20km/h 미만). 전역 조인 키는 없어 다른 도로 데이터와는 호선코드(route_cd)·도로종류코드나 호선명을 이름·코드로 맞춰 연결해야 한다.
description_portal: '이 데이터는 경기도 내 각 도로 호선별 정체구간 비율을 연도별로 기록한 자료로, 도로종류(고속국도, 일반국도, 국가지원지방도, 시군도 등), 호선명, 호선코드, 정체구간비율(%) 등의 항목으로 구성됩니다. 특정 노선에서 발생하는 정체 구간의 비중을 수치로 표현함으로써 도로별 혼잡도를 정량적으로 비교할 수 있으며, 도로 효율성 분석과 교통 개선 정책 수립에 활용됩니다. 연도별 정체 비율의 추이를 통해 교통상황의 변화와 인프라 개선 효과를 평가할 수 있으며, 교통체계 개선을 위한 우선순위 설정, 정체 해소 사업의 타당성 검토 등 실효적인 도로 정책 설계에 기초 자료로 사용될 수 있습니다.* 고속도로 정체기준 : 통행속도 40km/h 미만* 고속도로 이외 정체기준 : 통행속도 20km/h 미만'
