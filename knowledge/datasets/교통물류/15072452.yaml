summary_user: 유가보조금관리시스템에서 집계한 화물 유류구매카드 발급 현황을 연도별(2015~2025년)·유종별(경유·LPG)로 나누고 카드 종류(구분)별 행으로 정리한 전국 단위 집계표로, 719바이트 분량의 작은 CSV 파일이다. 화물운송 업계 관계자나 분석가가 '최근 몇 년간 화물차 유류구매카드 발급이 경유·LPG별로 어떻게 늘거나 줄었나', '어떤 카드 종류가 많이 발급됐나' 같은 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·유종 이름을 맞추거나 같은 기관(국토교통부)의 택시·버스 유가보조금 자료와 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 단위 집계라 지역별·사업자별 발급 내역이나 실제 보조금 지급액은 알 수 없다. 연도·유종이 열 이름에 들어 있는 가로형 표라서 시계열 분석 전에 세로형으로 바꿔야 하며, 다른 데이터와 붙일 공통 코드가 없다.
