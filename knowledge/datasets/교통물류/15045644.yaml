description_portal: 본 데이터는 한국도로공사에서 2010년부터 2013년까지 수집한 고속도로 차량운행 비용 정보를 포함하고 있다. 차량운행 비용이란 고속도로를 주행하는 동안 발생하는 연료비, 유지관리비, 감가상각비 등을 종합적으로 고려하여 산출한 비용이다. 해당 자료는 연도별 및 노선별로 구성되어 있으며, 교통량 및 통행속도 등 교통지표와 연계 분석을 통해 도로운영 효율성 평가, 유지보수 예산 편성, 교통환경 개선 정책 수립 등에 활용 가능하다. 또한, 차량종류별 운행비용 차이를 비교하거나 에너지 절감 효과 분석 등에도 기초자료로 쓰일 수 있다.한국도로공사에서 제공하는 고속도로 차량운행 비용에 관한 지표 정보 (2010년 ~ 2013년)(집계일자,상수값제공기관구분코드,상수값제공기관,차량5종분류구분코드,차량5종분류구분명,차량3종분류구분코드,차량3종분류구분명,차량운행비용금액)
