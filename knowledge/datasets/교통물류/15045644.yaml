summary_user: 한국도로공사가 2010~2013년 고속도로 차량운행 비용(연료비·유지관리비·감가상각비 등을 종합한 단가)을 집계일자별·차종 분류(5종·3종)별·상수값 제공기관별로 정리한 전국 단위 집계 파일이다. 도로 정책 분석가가 "고속도로 사업의 편익을 따질 때 차종별 운행비용 단가를 얼마로 잡아야 하나" 같은 질문에 기초 상수로 쓴다. 전역 조인 키는 없고, 차종 분류명·코드나 집계 연도를 기준으로 교통량·통행속도 같은 한국도로공사 교통지표와 이름·코드 매핑으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 차종 분류명·코드나 같은 기관 코드로 직접 매핑해야 한다. 범위는 전국 단위 비공간 자료여서 지역·구간별 비용은 알 수 없고, 수록 기간은 포털 설명상 2010~2013년이다.
