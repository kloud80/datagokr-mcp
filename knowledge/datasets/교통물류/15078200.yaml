summary_user: 광주 남구에 등록된 전기차 대수를 연도별로 집계한 파일로, 포털 설명상 2012년부터 2025년까지를 담고 행정단위는 시군구(자치구) 하나다. 지자체 담당자나 분석가가 남구의 전기차 보급이 해마다 얼마나 늘었는지 보고 충전소 확충 규모나 보조금 수요를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·자치구명 이름이나 연도로 맞춰 이어야 하며, 남구 충전소 현황이나 다른 자치구의 같은 통계와 나란히 비교하는 식으로 쓴다.
description_portal: 광주광역시 남구에 등록된 연도별 전기차 등록 현황으로 2012년도부터 2025년까지 등록된 전기차 등록대수 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 탄소중립과(☎062-607-3622)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 전기차는 배터리와 전기 모터를 동력원으로 사용하는 친환경 차량으로, 온실가스와 대기오염 물질 배출이 적습니다. 해당 데이터는 연도별 등록 대수를 집계하여 보급 추이와 성장 속도를 파악할 수 있도록 하며, 충전소 설치 계획 수립, 보급 확대 정책 설계, 보조금 지원 규모 산정, 교통·환경 영향 분석 등 다양한 분야에서 활용될 수 있을 것으로 보입니다. 특히 지역별 전기차 확산 정도를 비교·분석해 맞춤형 인프라를 구축하고, 지속 가능한 친환경 교통체계 조성의 근거 자료로 활용 가능합니다.
