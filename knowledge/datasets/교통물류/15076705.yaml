summary_user: 전국 고속도로 전광표지판(VMS)마다 지금 표출 중인 교통 안내 문구를 한 건씩 담은 실시간 원천 데이터로, 노선·관리센터·방향·표지판 위치와 함께 제공된다. 운전자나 교통정보 서비스 개발자가 '지금 이 노선 이 방향 전광판에 사고·공사·정체 안내가 떠 있는가'를 확인하는 데 쓰고, 이력을 쌓으면 상습 정체·돌발 구간 분석 자료가 된다. 노선번호·표지판 ID·표준링크(stdLink)·좌표 필드는 있지만 실측에서 전역 조인 키로 확인되지 않았으므로, 같은 기관의 다른 고속도로 소통·돌발 데이터와는 노선명·센터 코드 매칭이나 좌표 근접으로 이어 쓴다.
description_portal: '본 데이터는 전국 고속도로에 설치된 전광표지판(VMS: Variable Message Sign)에 표출되는 실시간 교통 안내 문구 현황을 제공한다.API를 통해 노선명, 관리기관, 방향, 위치 등을 기준으로 표출 중인 문구를 조회할 수 있으며, 주요 내용에는 도로 공사, 교통사고, 정체 구간, 기상특보 등이 포함된다.이 정보는 운전자가 도로 상황을 사전에 인지하여 효율적인 경로를 선택하는 데 활용될 수 있으며, 공공기관 및 민간 개발자의 실시간 교통정보 서비스 연계에도 유용하다.응답 데이터는 표출내용, 표출시각, 위치명, 문구 유형 등의 항목으로 구성되며, XML과 JSON 형식으로 제공된다.해당 API는 한국도로공사가 운영 및 관리하며, 실시간 상황을 반영하여 주기적으로 갱신된다.'
