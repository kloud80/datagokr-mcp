summary_user: 인천국제공항에서 출발하는 화물기의 동계 시즌 정기운항 스케줄을 편명 단위로 담은 파일 데이터로, 운항요일·항공사·편명·출발 예정시각·목적지(공항코드)·운항 시작일과 종료일이 한 행에 들어간다. 물류 사업자나 분석가가 "이번 겨울 인천에서 특정 목적지로 가는 화물기는 어느 항공사가 무슨 요일 몇 시에 띄우는가"를 확인하는 데 쓴다. 전역 조인 키는 없고, 목적지 공항코드(Airport Code)나 항공사·편명을 이름·코드로 맞춰 하계 스케줄이나 공항코드 자료와 이어 쓴다.
description_portal: 인천국제공항공사에서 제공하는 화물기 정기운항편 출발정보입니다. 해당 데이터는 동계 시즌의 데이터를 제공하고 있습니다. 본 데이터는  인천국제공항에서 출발하는 인천국제공항에서 출발하는 동계 화물기의 상세운항정보를 종합적으로 제공하고 있으며, 항공기 운항편의  운항요일,항공사,운항편명,예정시각,목적지,시작일자,종료일자에 대한 정기운항 정보를 제공하고 있습니다. 운항요일,항공사,출발지에 대한 정보는 국문·영문·중문·일문으로 제공하고 있어 다국어로 데이터를 확인하실 수 있습니다.
