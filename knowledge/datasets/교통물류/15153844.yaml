description_portal: '이 데이터는 한국철도공사의 위험물 화물 운송 시 안전 관리를 위한 분류 기준, 검사 정보 및 UN 위험물 코드 체계를 제공하는 위험물 관리 종합 데이터입니다. "화물정보_위험물코드상세" 데이터는 UN 위험물 번호, 위험물 등급 번호, IMDG 코드, 위험물 분류 코드, UN 위험물 한글명(예: 연료전지 카트리지, 리튬이온 배터리, 에탄올·가솔린 화합물 등), 버전별 할증률을 상세히 기록하여 국제 해상 위험물 규정(IMDG Code) 기준에 따른 위험물 식별 체계를 제공합니다. "화물정보_위험물분류기준" 데이터는 위험물 등급별(가스류, 인화성 액체, 가연성 고체, 산화성 물질, 독성 물질, 부식성 물질 등) IMDG 코드명, 물질 내용, 위험물 성질 및 비고를 정의하여 위험물 분류 원칙과 특성을 체계화합니다. "화물정보_수출위험물검사정보"와 "화물정보_수입위험물검사정보" 데이터는 하역 항구, 검사 확인번호, 예약번호, 화차 차량번호, 컨테이너 번호, UN 위험물 번호, 위험물 등급명, IMDG 코드, 컨테이너 총 계중량, 내적 화물 중량, 인화점, HOT 여부, 제한 수량 여부, 오염 여부, 포장 형태, 패키지 수량, EMS 번호, 서브 위험 코드 등을 기록하여 수출입 위험물 화물의 검사 이력과 안전 정보를 추적합니다. 이 통합 데이터는 위험물 운송 안전 기준 준수 및 사고 예방, UN 위험물 분류 체계 기반 화물 식별 및 관리, 수출입 위험물 검사 이력 추적 및 통관 절차 검증, 위험물 등급별 운송량 및 패턴 분석, 위험물 취급 요금 할증률 적용 기준 관리, 철도 화물 안전 정책 수립 및 국제 규정 준수 연구에 필수적인 위험물 관리 데이터로 활용됩니다.'
