description_portal: '서울특별시 마포구의 버스정류소별로 기록된 승하차 승객 수를 기반으로 구성되어 있습니다. 각 정류소에 대해 정류소명, 지번 주소, 버스정류장 ARS번호가 포함되어 있으며, 해당 정류소를 이용한 승차승객수와 하차승객수가 함께 제공됩니다. 이 데이터를 통해 교통당국과 지자체는 버스 노선 및 정류소 운영 효율화를 위한 의사결정에 활용할 수 있으며, 정류소별 혼잡도 분석 및 교통 인프라 개선에도 중요한 자료가 됩니다.서울 열린데이터광장의 "서울시 버스노선별 정류자별 승하차 인원정보" 데이터와 "서울시 버스정류소 위치정보" 데이터를 가공하여 마포구 관내의 버스정류소별 승하차 승객수를 추출하였습니다. ※ 기준연도 : 2022년 (1월~12월)'
