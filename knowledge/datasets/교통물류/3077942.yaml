summary_user: 창원시 관내 시외·고속버스 터미널(창원종합, 마산시외, 마산남부, 마산고속, 진해 등)을 터미널 한 곳당 한 행으로 정리한 소규모 현황표(csv 약 1.8KB)로, 터미널명·구분(시외/고속)·위치·주요노선을 담는다. 창원에서 다른 도시로 가는 시민이나 여행자가 '어느 터미널에서 어느 방면 버스를 타야 하나'를 확인하거나, 분석가가 지역 터미널 목록을 확보하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 버스 노선·정류장 데이터와는 터미널명이나 주소를 직접 맞춰 연결해야 한다.
description_portal: 2026년 5월 기준 창원시 관내 시외,고속버스 터미널 현황입니다. 현재 창원시 관내에는 시외 4개소, 고속 1개소가 있습니다.창원종합버스터미널, 마산고속버스터미널, 내서고속버스터미널, 마산시외버스터미널, 마산남부버스터미널, 진해시외버스정류장 등이 있습니다. 창원종합터미널 주소는 창원시 의창구 창원대로 371(팔용동)에 소재하고 창원시 소유입니다.마산시외버스터미널은 창원시 마산회원구 3.15대로 756(합성동)에 소재하고 (주)마산버스터미널에서 관리하고 있습니다.마산남부시외버스터미널은 창원시 마산합포구 월영동서로 10(해운동)에 소재하고 (주)마산버스터미널에서 관리하고 있습니다.마산고속버스터미널은 창원시 마산회원구 합포로 290(양덕동)에 소재하고 (주)동양고속에서 관리하고 있습니다.진해터미널은 창원시 진해구 인의동에 소재하며 동아여객에서 관리하고 있습니다.
