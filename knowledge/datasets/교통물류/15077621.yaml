summary_user: 대전광역시 교통안전시설물관리시스템에 등록된 신호등을 한 대씩 담은 파일로, 관리번호·주소·교차로명과 번호·설치일자·신호등 종류·재질·전구 형식·경위도를 함께 제공한다. 교통 담당자나 분석가가 어느 교차로에 어떤 종류의 신호등이 언제 설치됐는지, 오래된 신호등이 어디에 몰려 있는지를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 교차로명·주소를 맞추거나 경위도로 공간 결합해 이어 쓴다.
