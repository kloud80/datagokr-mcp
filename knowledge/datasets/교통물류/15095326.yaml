description_portal: '과적차량 단속현황 및 과태료 부과, 징수 현황을 제공합니다.과적차량 단속은 도로의 구조를 보전하고 통행의 위험을 방지하여 교통소통의 원활을 목적하게 하는 것입니다. ○ 단속대상 : 단속기준을 초과한 운행제한(과적) 자동차 및 건설기계 ○ 단속기준 : 축하중 10톤, 총중량 40톤, 폭 2.5m, 높이 4.0m, 길이 16.7m 운행제한 기준 초과 차량 ○ 위반처리 : 위반 정도에 따라 30~300만원 과태료 부과. ○ 단속방법 : 1개조(6명) 편성 이동단속  ○ 근거법률 : 도로법 제77조 및 제117조 ○ 산출근거 : 도로법시행령 제105조 별표7'
