summary_user: 전남광주통합특별시가 집계한 과적(운행제한 초과) 차량의 검차대수, 단속건수, 과태료 부과금액과 징수금액을 구분별로 묶은 소규모 집계 파일(약 530바이트 CSV)이다. 지역 도로 관리 담당자나 분석가가 "한 해에 과적 단속이 몇 건이었고, 부과한 과태료 가운데 실제로 얼마가 걷혔는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와 코드로 직접 붙일 수 없고, 다른 시도의 과적 단속 현황과는 구분 이름과 기준일자를 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
