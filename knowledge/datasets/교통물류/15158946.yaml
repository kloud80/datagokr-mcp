summary_user: 김포·김해·제주공항의 항공편별로 배정된 주기장(sptNm)과 탑승구·수하물 수취대 번호, 예정·변경 시간, 출도착 구분, 국내/국제 구분, 항공편 상태를 실시간 건별로 담는다. 지상조업사나 공항 이용객이 '오늘 이 항공편은 어느 주기장·게이트에 배정됐고 지연됐는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 운항정보 API와는 항공편명·운항일자·기준공항코드를 맞춰 붙이고 공항명은 이름 매핑으로 연결한다.
description_portal: 한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는 한국공항공사가 관할하는 운영하고 있는 김포, 김해, 제주공항의 실시간 주기장 현황정보를 제공합니다.제공되는 주요 데이터 항목으로는 출발공항, 도착공항, 탑승구 번호, 항공기 운항정보 등 이 상세히 포함되어 있습니다. 이를 통해 실시간 주기장 안내, 지상조업사 업무활용 등 다양한 목적의 데이터 활용이 가능합니다.제공되는 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.
