summary_user: 한국공항공사가 정리한 주요공항의 IATA 세자리 코드(쓰리레터코드)를 공항 한 곳당 한 행으로 담은 코드 목록 파일(csv, 약 5KB)로, 구분·공항코드·영문 공항명으로 구성된다. 항공 운항·통계·노선 데이터를 다루는 분석가나 개발자가 'GMP·CJU 같은 코드가 어느 공항인가'를 확인하거나 코드를 공항명으로 바꿀 때 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 운항정보·항공통계처럼 IATA 공항코드를 쓰는 데이터와는 공항코드 값을 맞춰 이어 쓰는 코드 매핑 마스터로 활용한다.
limits: 실측 컬럼에서 표준 조인 키가 확인되지 않아 다른 데이터와는 공항코드·공항명 매핑으로만 연결된다. 비공간 데이터라 공항 위치 좌표는 담지 않으며, 주요공항만 다루므로 전 세계 공항 전체 목록으로 보기 어렵다.
