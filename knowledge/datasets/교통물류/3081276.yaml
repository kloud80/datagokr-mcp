summary_user: 전북특별자치도 국가지원지방도·일반지방도에 설치된 터널을 한 행에 하나씩 담은 시설물 현황 파일로, 시설명·위치·준공연도와 연장·폭·높이, 계약 전력, 시특법 대상 여부·정기점검주기·등급을 포함하며 파일 크기는 약 2KB로 작다. 도로 관리 담당자나 분석가가 '전북 지방도 터널 중 준공이 오래됐거나 등급이 낮은 곳은 어디이고 점검 주기는 어떻게 되나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 터널·교량 현황이나 지자체 터널 표준데이터와는 시설명·위치 문자열을 맞춰 이어야 한다.
description_portal: 전북특별자치도 내 국가지원지방도 및 일반지방도에 설치된 터널의 상세 제원 및 현황 데이터입니다. 이 자료는 각 터널의 명칭, 위치, 준공 연도와 함께 연장, 폭, 높이 등 구조물의 규모를 나타내는 핵심 제원을 포함하고 있습니다. 또한, 「시설물의 안전 및 유지관리에 관한 특별법」에 따른 시설물 등급과 정기 점검 주기 등 안전 관리 상태를 파악할 수 있는 중요한 정보도 제공합니다. 이 데이터는 도로 관리 기관이 터널의 안전 상태를 체계적으로 점검하고 유지보수 계획을 수립하는 데 필수적인 기초 자료로 활용됩니다.
