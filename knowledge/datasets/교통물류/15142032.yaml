summary_user: 전국 버스정류장을 한 건씩 담은 원장 성격의 API로, 운행일자별 정류장 ID·명칭·ARS번호와 소속 시도·시군구·읍면동을 담으며 정산사업자가 관리하는 정류장을 기준으로 한다. 교통 분석가나 지자체 담당자가 특정 시군구·읍면동 안에 어떤 버스정류장이 있고 ARS번호가 무엇인지 확인할 때 쓴다. 정류장 ID(sttn_id)로 노선·도착·승하차 데이터와 잇고, 시군구코드와 법정동 체계의 읍면동코드(emd_cd)로 행정구역 단위 인구·시설 통계와 잇는다.
description_portal: 버스정류장 정보는 대중교통 시스템에서 핵심적인 역할을 하는 데이터로, 정류장의 위치, 명칭, 식별 정보(ID, ARS 번호 등)를 제공하여 이용자들의 이동 편의성과 운영자들의 관리 효율성을 높이는 데 활용됩니다. 주요 항목에는 지역정보(시·도, 시·군·구, 읍·면·동), 정류장 ID, BIMS ID, 정류장명 등이 포함되며, 이를 통해 정류장별 이용 현황 분석, 노선 관리, 환승 편의성 향상, 교통 인프라 개선 등 다양한 목적에 효과적으로 활용할 수 있습니다. 정산사업자가 관리하는 정류장을 기준으로 제공하고 있습니다.
