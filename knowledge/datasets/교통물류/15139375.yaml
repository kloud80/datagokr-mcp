description_portal: 본 데이터는 우리 회사의 2026년 3월 기준 재무상태표로, 상반기 말 시점에 보유한 자산,부채,자본 등 재무구조를 종합적으로 나타낸 자료입니다.재무상태표는 일정 시점에 자산, 부채, 자본의 세가지 요소로 구성되며, 이를 통해 재무구조와 안정성을 종합적으로 확인할 수 있습니다.자산 항목은 유동자산과 비유동자산으로 구분되어 자원 보유 현황을 보여주며, 공사가 보유한 자원의 유동성과 활용 가능성을 보여줍니다부채 항목은 단기적으로 상환해야 하는 단기차입금이나 미지급금, 장기적으로 부담해야하는 장기채무와 충당부채 등으로 구분되어 경제적 의무 수준을 나타냅니다.자본항목은 납입자본 등 기업의 순자산 규모를 나타냅니다.해당 데이터는 회계기준에 따라 작성되었으며, 기업 내부의 경영계획 수립과 재무분석, 외부 서울시 등 이해관계자의 정책 활용 등 다양한 의사결정 과정에서 기초자료로 활용됩니다.2025 회계연도 기말 재무제표는 공사 홈페이지 및 클린아이에 공시될 예정입니다
