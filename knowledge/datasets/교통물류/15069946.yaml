description_portal: 경상남도 연도별  선박 입출항 및 화물 물동량 실적에 대한 자료로, 물동 및 입출항이 이루어지는 지역의 실적 통계 데이터를 제공하며, 실적의 단위는 선박은 척 , 화물은 천톤에 해당합니다.글로벌 공급망 변화에 따른 남해안 해운 물류 트렌드를 분석하고, 지방관리무역항 활성화 및 지역 경제 지표 수립을 위한 기초 자료로 활용할 수 있습니다. 최근 사회적 관심사인 수출입 물동량 변화 추이와 항만 물류 안정성 확보를 위한 정책 연구 및 민간 비즈니스 모델 개발에 기여할 수 있는 공공데이터입니다.※ 본 데이터는 매년 12월 말 기준으로 전년도 통계가 정기적으로 업데이트됩니다.
