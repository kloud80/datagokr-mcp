summary_user: 경상남도 지방관리무역항 6곳(통영·삼천포·고현·옥포·장승포·하동)의 선박 입출항 실적(척)과 화물 물동량(천톤)을 연도별로 정리한 집계 파일로, 행 하나가 한 해이고 항구별 선박·화물 값이 열로 나뉜다. 지역 해운·물류 분석가나 지자체 담당자가 "통영항과 삼천포항의 연간 물동량이 최근 몇 년간 어떻게 변했나" 같은 항구별 추이 비교에 쓴다. 전역 조인 키가 없어 다른 항만 통계와는 연도와 항구 이름을 맞춰서만 이어 쓴다.
