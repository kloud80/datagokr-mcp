summary_user: 전국 철도·지하철역에 설치된 수평보행기(무빙워크)를 한 건씩 담은 시설 목록으로, 운영기관 코드·노선명·역명과 환승통로·방향 같은 상세 위치, 시작·종료 층을 기록한다(CSV 약 5.5KB의 소규모 파일). 교통약자 이동 정책 연구자나 역사 안내 서비스 개발자가 '어느 환승역 어느 통로에 무빙워크가 있고 몇 층에서 몇 층으로 이어지는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 시설·좌표 데이터와는 역명·노선명 이름 매핑이나 철도운영기관코드로만 연결한다.
description_portal: 이 데이터는 전국 철도 및 지하철역에 설치된 **수평보행기(무빙워크)**의 위치 정보를 담고 있는 자료입니다. 국토교통부에서 제공한 데이터로, 각 무빙워크가 어느 운영기관의 어느 노선, 어느 역에 설치되어 있는지 상세히 파악할 수 있습니다.주요 정보로는 철도운영기관 코드, 노선명, 역명과 함께 환승 통로, 특정 방향 등 무빙워크의 상세 위치가 포함되어 있습니다. 이를 통해 이용객은 역 내부의 정확한 시설 위치를 확인할 수 있습니다.해당 자료는 대규모 환승역의 승객 동선 관리, 역사 내 편의시설 안내 서비스 개발, 교통약자의 이동 편의성 증진을 위한 정책 연구 등에 유용하게 활용될 수 있습니다.
