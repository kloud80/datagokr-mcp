description_portal: '- 직전연도부터 과거3년간 건설공사 대금 체불로 2회 이상 처분(시정명령·영업정지 등) 받고 체불액이 1천만원 이상인 건설사업자의 명단을 관보에 싣거나, 국토교통부 홈페이지 또는 건설산업정보망을 통해 공표하는 제도  하도급대금, 건설기계 대여대금, 건설공사용 부품대금  근거 : 건설산업기본법 제86조의4 및 같은 법 시행령 제82조의4("14.11.15 시행 )- 공표 대상자가 공표 이후에 「건설산업기본법 시행령」 제82조의3 각 호의 어느 하나에 해당하는 사유가 발생하였다는 사실을 소명할 경우 ‘상습체불건설사업자 명단공표심의위원회’의 의결을 거쳐 위 공표 명단에서 제외될 수 있으므로 국토교통부에 즉시 소명자료를 제출하여 주시기 바랍니다.    문의 및 소명서 접수처 : 세종특별자치시 도움6로 11 정부세종청사 6동 국토교통부 건설현장준법감시팀(☎ 044-201-3578)-(주의사항) 공표 대상자 정보의 일부 또는 전부를 사용하여 특정인의 명예를 훼손할 경우 형사상 명예훼손죄로 처벌을 받거나 민사상 손해배상 책임을 질 수 있습니다.'
