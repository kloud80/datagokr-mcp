description_portal: '경산시 버스배차정보입니다.경산시에서 운영중인 버스 노선번호, 해당 노선의 가짓수, 운행계획차량대수, 저상버스운행대수, 배차간격, 운송업체(운수사)에 관한 정보가 포함되어 있습니다.운행계획대수는 차량이 배정된 대수를 뜻하는 것이며, 하루동안의 운행 횟수는 아니며,지선(남산1,남산2,남천1 등)의 경우 노선에 따라 시간이 일정하지 않아 시간표를 따로 참조해야 함을 알려드립니다.정확한 버스의 출발정보, 버스 노선별 시간표, 저상버스  운행 시간표 등의 상세 내용이 필요하신 경우 "경산시 교통정보센터"홈페이지에서 확인하실 수 있습니다.문의사항 : 경상북도 경산시 교통행정과 대중교통팀(☎053-810-6192)'
