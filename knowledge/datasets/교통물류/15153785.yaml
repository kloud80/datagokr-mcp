summary_user: 광양시 불법 주정차 단속 기록을 단속 건별로 담은 파일(csv, 약 1.3MB)로, 부과연도·단속 법정동·단속장소·단속구분·부과진행상태·단속일시를 읍면동 단위로 제공한다. 시 교통 담당자나 분석가가 '광양시에서 불법 주정차 단속이 어느 동·장소와 어느 시간대에 몰리는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 법정동명을 이름으로 매핑해 다른 읍면동 단위 자료와 붙이거나, 같은 기관의 교통 자료와 함께 본다.
description_portal: 이 데이터는 불법 주정차 단속 과정에서 생성된 기록을 바탕으로 부과연도, 단속법정동명, 단속장소, 단속구분, 부과진행상태, 단속일시 항목을 체계적으로 정리한 자료다. 각 단속 건마다 적용된 단속 유형과 실제 확인된 일시, 위치 정보가 포함되어 있어 불법 주정차 발생 상황을 시점별로 파악할 수 있다. 단속법정동명과 단속장소는 위반 사례가 어느 지역에서 반복되는지 확인하는 데 활용 가능하며, 단속일시는 시간대별 단속 효과성을 분석하는 데 도움이 된다. 부과진행상태는 단속 처리 흐름을 이해하는 데 필요한 기본 정보를 제공한다. 본 자료는 단속 건별 행정 처리 정보를 단순화하여 구성한 것으로, 정책 분석과 행정 효율성 검토에 활용될 수 있다.
