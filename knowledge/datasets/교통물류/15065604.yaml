description_portal: 부산광역시 금정구 도로현황에 대한 데이터로 해당데이터의 시점, 노선명, 종점, 폭 등을 설명합니다. 비워진 공란은 데이터가 없는것입니다.<항목설명>차선자동차 도로에 주행 방향을 따라 일정한 간격으로 그어 놓은 선노선번호일정한 두 지점을 정기적으로 오가는 교통선의 번호노선명자동차 선로, 철도 선로 따위와 같이 일정한 두 지점을 정기적으로 오가는 교통선의 이름시 점도로가 처음으로 이어지거나 시작되는 곳종 점기차, 버스, 전차 따위를 운행하는 일정한 구간의 맨 끝이 되는 지점내용_내용폭(m)도로의 넓이를 재기 위해 가로로 건너지른 거리길이(m)도로 한끝에서 다른 한끝까지의 거리비고참고 사항
