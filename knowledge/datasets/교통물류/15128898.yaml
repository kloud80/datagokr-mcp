summary_user: 서울 성북구 관내에 이사화물 운송주선업으로 등록된 업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 사업체명·사업자구분·대표자·전화번호·주소와 위도·경도를 포함한다. 성북구 주민이 이사를 앞두고 동네에 등록된 이사업체가 어디 있고 연락처가 무엇인지 확인하거나, 분석가가 구내 이사업체 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 사업체명·주소로 전국화물자동차운송사업자표준데이터 같은 허가 원장과 맞대거나 좌표로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: '성북구 관내 이사, 이사화물로 등록된 화물운송주선* 업체 현황 목록으로, 사업체 명 , 사업체 주소 및 전화번호를 제공하고 있습니다. ※ 화물운송주선업 : 화물자동차운수사업법 제2조4호에 따라 타인의 수요에 의하여 유상으로 화물운송계약을 중개, 대리하거나 화물자동차운송사업은 경영하는 자의 화물운송 수단을 이용하여 자기의 명의와 계산으로 화물을 운송하는 사업※ 운송주선업은 운송업과 마찬가지로 화물운송 의뢰시 운송물의 멸실, 훼손 또는 지연으로 인한 손해를 배상할 책임이 있으므로 화물운송 의뢰시 참고하시기 바랍니다.'
