description_portal: '- 한국교통안전공단에서는 여객자동차 운수사업에 관한 질서를 확립하고 여객의 원활한 운송과 여객자동차 운수사업의 종합적인 발달을 도모하여 공공복리를 증진하는 것을 목적으로 하는 여객자동차 운수사업법에 의거하여 버스운송자격제도를 운영하고 있습니다. 또한, - 화물자동차 운수사업을 효율적으로 관리하고 건전하게 육성하여 화물의 원활한 운송을 도모함으로써 공공복리의 증진에 기여함을 목적으로 한 화물자동차 운수사업법에 의거하여 화물운송종사 자격제도를 운영하고 있습니다. * 해당 데이터는 버스운전자격시험 및 화물운송종사자격시험과 관련한 시험정보 데이터입니다. * 데이터는 행별 시험일자번호, 시험구분, 지역, 시험장소의 컬럼이 있습니다.'
