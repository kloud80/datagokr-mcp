summary_user: 부산광역시 교통시설물관리시스템에 등록된 교통안전시설물 철주(신호등·표지판 등을 지지하는 철제 기둥)를 한 개씩 담은 원천 목록으로, 시군구·동·리, 도로명, 교차로명과 경도·위도를 담는다(CSV 약 963KB). 도로·교통 담당자나 분석가가 '특정 교차로나 도로 구간에 철주가 어디에 몇 개 서 있는가'를 지도에 찍어 점검·정비 대상을 고를 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·동명 같은 행정구역 이름이나 도로명·교차로명 문자열, 또는 좌표 근접으로만 이어 쓴다.
description_portal: '교통안전시설물 철주에 관한 공공데이터는 도로나 교통 환경에서 안전을 위해 설치되는 철제 기둥(철주)에 관한 정보를 포함하는 데이터입니다. 주로 정부나 지방자치단체에서 관리하며, 교통사고 예방과 도로 안전 관리를 목적으로 공개합니다.1. 교통안전시설물 철주란?**철주(철제 기둥)**는 도로변에 설치되어 교통표지판, 신호등, 가로등, CCTV, 속도측정기 등 다양한 교통안전시설물을 지지하는 역할을 합니다.철주는 내구성과 안정성이 높아 오랜 기간 교통안전시설물의 기능을 보장합니다.2. 공공데이터 내용 예시위치 정보: GPS 좌표, 도로명, 행정구역 정보 등철주 종류: 재질(철제, 스틸), 크기, 높이, 형태 등설치 목적: 신호등 지지, CCTV 설치, 교통표지판 부착 등관리 정보: 설치일, 유지보수 이력, 관리 주체(기관)안전 관련 정보: 내구연한, 손상 및 파손 상태, 교체 필요 여부3. 활용 목적도로 안전 관리 및 유지보수 계획 수립교통사고 예방을 위한 시설물 점검스마트 시티 및 ITS(지능형 교통 시스템) 구축 시 기반 데이터 활용시민들에게 교통안전정보 제공4. 데이터 제공처 및 접근 방법정부 24, 공공데이터 포털(data.go.kr) 등에서 교통안전시설물 관련 데이터를 조회 및 다운로드 가능지방자치단체별 도로관리청 또는 교통 관련 부서에서 추가 데이터 제공'
