summary_user: 서울교통공사가 운영하는 역사의 휠체어리프트를 한 대씩 담은 설치현황 파일로, 호선·역명·호기, 가까운 출입구, 시작층과 종료층 위치, 길이·폭·한계중량, 승강기 일련번호를 담는다. 휠체어 이용자나 보호자가 어느 역 몇 번 출입구 근처에 리프트가 있고 몇 층에서 몇 층까지 오가는지 확인하거나, 분석가가 노선별 리프트 분포를 살펴보는 데 쓴다. 실측 컬럼에는 전역에서 쓸 조인 키가 없어서, 다른 역 시설 데이터와는 호선·역명을 이름으로 맞추거나 같은 기관 데이터끼리 연결해야 하며, 승강기 일련번호(승강기 일련번호)는 이름상 승강기 관련 자료와 대조할 후보로만 본다.
limits: 역 코드 같은 표준 조인 키가 없어 역명 표기 차이에 주의해야 한다. 포털 설명상 특정 기준일 시점의 현황이고 일부 리프트는 이미 철거되었으므로, 기준일 이후 변동이나 실시간 가동 여부는 이 파일로 알 수 없다.
