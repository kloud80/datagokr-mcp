summary_user: 인천공항을 오가는 화물기의 정기운항 스케줄을 편명 단위로 담으며, 항공사명·출발지 공항(IATA 코드)·정기운항 시작일과 종료일·요일별 취항 여부·시즌명·마스터편명과 코드셰어 여부를 포함한다. 물류 사업자나 분석가가 '특정 해외 공항과 인천을 잇는 화물기 정기편이 이번 시즌 무슨 요일에 운항하는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 출발지 공항 IATA 코드(airportCode)나 공항명을 공항코드 자료와 맞추거나 편명으로 같은 기관의 운항 API와 대조하는 식으로 연결한다.
limits: 두 오퍼레이션 가운데 실호출에서 성공한 것은 1개이며, 출발편 조회(/getCgoFltSchedDeparturesDeOdp)는 최소 파라미터로 호출했을 때 응답이 없었다. 포털 설명에 따르면 한 시즌 단위의 정기 스케줄이라 일일운항 API와 갱신 주기가 다르고 마스터·슬레이브 편명이 서로 다를 수 있으므로, 당일 실제 운항·지연 여부를 확인하는 데는 맞지 않는다. 개발계정 호출 한도는 하루 500회다.
