services:
  - op: /getCgoFltSchedArrivalsDeOdp
    name: 화물편 정기운항편 상세 일정 -도착
    endpoint: https://apis.data.go.kr/B551177/StatusOfCgoFltSched/getCgoFltSchedArrivalsDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: lang
        required: false
        desc: '언어 구분값(K: 국문E: 영문C: 중문J: 일문) default=xml'
      - name: airport
        required: false
        desc: 인천공항에 도착하는 편명의 출발지공항(IATA) 코드
      - name: type
        required: false
        desc: 응답유형 [xml, json] default=xml
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getCgoFltSchedDeparturesDeOdp
    name: 화물편 정기운항편 상세 일정 -출발
    endpoint: https://apis.data.go.kr/B551177/StatusOfCgoFltSched/getCgoFltSchedDeparturesDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: lang
        required: false
        example: K
        desc: '언어 구분값(K: 국문E: 영문C: 중문J: 일문) default=xml'
      - name: airport
        required: false
        example: CTS
        desc: 인천공항에서 출발하는 편명의 도착지공항(IATA) 코드
      - name: type
        required: false
        example: xml
        desc: 응답유형 [xml, json] default=xml
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
