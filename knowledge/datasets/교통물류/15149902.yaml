description_portal: '서울시설공단_서울도시고속도로 차량검지기서울 도시고속도로의 차량검지기에 대한 데이터로 차량검지기 모델명, X좌표, Y좌표 정보를 확인할 수 있습니다.- 차량검지기 : 도로 일정지점에서 교통량, 속도 등 교통상황에 대한 자료를 수집하기 위해 설치한 장치로 영상검지기, AI영상검지기, 루프검지기, 지자기검지기 등이 있습니다.- 설치년도 : 2001 ~ 2026 ※ 1. 영상검지기 : 현장 카메라에서 촬영한 영상을 센터 영상제어기에서 검지영역을 설정, 차량이 검지영역을 통과시 교통량, 속도 등을 측정 하는 검지기      2. AI영상검지기 : 딥러닝이 가능한 AI 카메라에서 촬영과 동시에 차량, 사람을 인식하여 객체를 추적하는 방식으로 교통량, 속도를 측정하는 검지기, 정지차량 및 보행자 등의 돌발상황 검지 가능      3. 루프검지기 : 도로에 매설된 루프코일 위를 차량이 통과할 때 발생하는 전류변화를 이용하여 교통량, 속도 등을 측정하는 검지기      4. 지자기검지기 : 유도자기장이나 지구자기장이 형성된 검지영역에 금속물체가 존재할 때 자기장이 변화하는 원리를 이용하여 교통량, 속도 등을 측정하는 검지기'
