summary_user: 대구교통공사 노선 역사에 설치된 물품보관함을 역·위치 단위로 담은 파일로, 노선·역명·지상지하 구분·층·상세위치·보관함 크기·시설 수·이용요금을 한 행에 기록한다(CSV 약 9.9KB). 대구 도시철도를 이용하는 여행객이나 시민이 "어느 역 몇 층에 큰 짐을 맡길 보관함이 있고 요금은 얼마인가"를 확인하는 데 쓴다. 공통 역 코드 같은 전역 조인 키는 없어서, 다른 역·시설 데이터와는 역명·선명을 이름으로 맞춰 붙여야 한다.
description_portal: 대구교통공사에서 운영하는 노선의 물품보관함에 대한 데이터로, 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 상세위치, 사이즈, 시설수, 이용요금 의 데이터가 있습니다.지하철 물품 보관함은 공공 장소, 특히 지하철 역사 내에 설치된, 개인 짐을 일시적으로 보관할 수 있는 잠금 가능한 수납 공간입니다. 이러한 보관함은 여행객이나 일상에서 무거운 짐을 잠시 맡기고자 할 때 유용하게 사용됩니다. 사용자는 소정의 요금을 지불하고, 짐을 안전하게 보관한 후, 필요할 때 다시 찾아갈 수 있습니다. 특히 서울과 같은 대도시에서는 지하철 물품 보관함이 여행의 편의성을 크게 향상시키며, 관광객들에게는 필수적인 서비스로 자리 잡고 있습니다.
