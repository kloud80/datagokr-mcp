summary_user: 영주시 관내 교통신호기를 한 대씩 기록한 목록 파일로, 설치 위치, 설치·교체·교체예정 연월, 제어기 종류, 운용방식, 점멸시간을 담는다. 시 교통 담당자나 분석가가 "설치된 지 오래돼 교체가 다가온 신호기가 어느 교차로에 있는가"를 확인하거나, 신호기 노후도를 점검하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키나 좌표가 없어서, 다른 데이터와는 위치 명칭(교차로·도로명)을 직접 맞추거나 같은 영주시 자료끼리만 이어 쓴다.
description_portal: 경상북도 영주시 교통신호기 현황은 관내 교통 흐름과 보행 안전을 위한 신호기 설치 및 운영 상태를 체계적으로 관리하기 위해 구축된 공공데이터 입니다.본 데이터는 교통신호기의 설치 위치, 선치년월, 제어기 종류, 점멸 시간 등의 항목으로 구성되어 있습니다.이를 통해신호기별 유지관리 현황을 파악하고 도시 내 교통 제어 체계의 운영 안정성을 진단할 수 있습니다.또한 교통사고 예방 대책 마련 등 행정적 목적으로 활용될 수 있으며 교차로별 특성과 연결하여 분석할 경우 교통흐름 최적화 및 스마트 교통 인프라 확대에도 기역할 수 있습니다.
