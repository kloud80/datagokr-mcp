description_portal: 여객자동차 운수사업에 관한 질서를 확립하고 여객의 원활한 운송과 여객자동차 운수사업의 종합적인 발달을 도모하기 위하여, 여객자동차 운수사업법 상 위반행위가 있을시 행정기관은 이를 조사하여, 교육지도하거나 과태료 부과 등 행정처분을 내릴수있다. 이러한 처리절차를 체계적으로 관리할 필요가 있으므로, 여객자동차운수사업법령위반관리시스템을 구축하였다. 여객자동차운수사업법령위반관리시스템을 통해 위반부과정보(관리년도, 관리번호, 접수구분명, 접수일자, 위반대분류명, 현징수사항, 처리일자) 등을 한번에 파악할 수 있도록 제공하는 데이터이다.
