description_portal: '○ 통계개요* 통계명 : 차량통행속도(구별/요일별)* 통계종류 : 서울시 구별, 요일별 차량통행속도 현황을 제공하는 일반·조사통계(승인통계 20109호)* 작성목적 : 서울시 전체도로에 대한 일반차량에 대한 통행속도를 조사하여 도로의건설, 유지관리 및 도로운영에 필요한 기본자료와 각종 연구에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 서울특별시 교통정보센터, 영업용 택시 위치 정보(GPS)를 통한 통행속도 수집* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시, 자치구별내용 - 승용차의 시간대별, 요일별 운행거리속도 현황○ 용어설명* 통행속도(travel speed):어느 한 구간을 이동한 속도(공간평균속도:space mean speed)'
