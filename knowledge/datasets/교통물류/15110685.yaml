summary_user: 대전광역시 전역에 설치된 보안등의 위치명, 설치 개수, 도로명·지번 주소, 위경도 좌표를 개별 위치 단위로 담은 API이다. 야간 보행 안전이나 범죄 예방을 살피는 시민·분석가가 특정 지역에 보안등이 어디에 얼마나 설치돼 있는지 확인하는 데 쓴다. 도로명주소(RDNMADR)·지번주소(LNMADR)와 위경도(LATITUDE, LONGITUDE)를 키로 삼아 다른 주소·좌표 기반 데이터와 이어 쓴다.
description_portal: 대전광역시 보안등조회서비스는 대전시 전역에 설치된 보안등의 위치와 설치 개수 등의 정보가 체계적으로 수집 된 데이터입니다. 이 자료는 보안등의 위치명, 위도와 경도 좌표, 도로명주소를 포함하여 각각의 보안등이 어느 위치에 얼마나 설치되어 있는지 구체적으로 파악할 수 있도록 합니다. 보안등 데이터는 도시 내 야간 보행자 안전 확보 및 범죄 예방에 중요한 역할을 하며, 공공 안전과 도시 환경 개선을 위한 기초 자료로 활용됩니다. ※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
