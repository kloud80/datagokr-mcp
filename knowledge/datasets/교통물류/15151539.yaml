description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 교통약자 이동권 운영정보 데이터로, 대구도시철도 1·2·3호선 각 역의 휠체어 전용칸 위치와 승강장 기준 엘리베이터 위치정보를 제공합니다. 주요 항목은 호선명, 역사명, 휠체어 전용칸 위치(승강장 번호 및 열차 출입문 위치), 엘리베이터 위치 등으로 구성되어 있으며, 교통약자가 역사 내 이동 동선을 사전에 확인할 수 있도록 구성되어 있습니다. 본 자료는 휠체어 이용객, 노약자, 임산부, 유아 동반 이용객 등 교통약자의 안전하고 편리한 도시철도 이용을 지원하며, 경로 안내 서비스, 역 안내 시스템, 위치기반 서비스(LBS), 스마트 모빌리티 및 교통정보 플랫폼 구축을 위한 기초자료로 활용될 수 있습니다. 또한 역사별 접근성 분석, 이동편의시설 운영 및 유지관리, 교통약자 이동권 보장 정책 수립, 시설 개선 및 서비스 품질 향상을 위한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 변경 시 갱신됩니다.'
