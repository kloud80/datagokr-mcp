summary_user: 고속도로 영업소별로 10km 미만부터 300km 이상까지 9개 주행거리 구간에 해당하는 총 이용 차량 대수를 정리한 집계 파일(csv, 약 32KB)로, 범위는 전국이다. 교통 분석가나 정책 담당자가 '특정 영업소를 드나드는 차량이 주로 단거리인지 장거리인지'처럼 영업소별 이동거리 분포와 통행 특성을 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 고속도로 데이터와는 영업소 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국도로공사에서 관리하는 고속도로 영업소별 주행거리 구간에 따른 총 이용 차량 수를 정리한 자료이다. 각 영업소를 기준으로 10km 미만부터 300km 이상까지 주행거리 구간을 세분화하여, 해당 구간별로 고속도로를 이용한 차량 대수를 제공한다. 이를 통해 특정 주행거리 구간에서의 통행량 분포를 분석할 수 있으며, 고속도로 이용 행태와 통행 특성 파악, 요금 정책 수립, 교통 수요 예측 등에 유용하게 활용될 수 있다. 또한, 도로 이용자의 이동거리 패턴을 기반으로 한 맞춤형 서비스 개선과 효율적인 도로 운영계획 수립에도 기초자료로 사용된다. 데이터는 연도별로 제공되어 시간적 변화 추이 분석에도 적합하며, 교통 빅데이터 활용 기반을 마련한다.
