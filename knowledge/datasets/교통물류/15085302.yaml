description_portal: '○ 통계개요* 통계명 : 업종별 운수업체* 통계종류 : 서울시 업종별 운수업체 규모현황을 제공하는 일반ㆍ조사통계* 작성목적 : 운수관련업체 규모와 여객ㆍ화물 수송실적 등 전반적인 현황을 파악하여운수관련 정책수립과 연구ㆍ분석 등을 위한 기초 자료를 제공하는 것을목적으로 함* 조사체계 : 각 운송조합, 버스회사 → 서울특별시 버스관리과, 택시물류과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 업종별(버스, 택시, 화물, 특수여객 등) 운수업체수 및 보유 차량 대수 현황○ 기 타* 시외버스는 도단위 시도에서 관리되고, 농어촌버스는 없음'
