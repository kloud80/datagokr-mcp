description_portal: 성남시 주정차 위반 단속 위치 현황에 대한 데이터로 집계년도, 시군명, 관리기관명, 단속일시정보, 단속장소 등의 항목을 제공합니다. 성남시의 주정차 위반 단속 위치 현황은 불법 주정차를 예방하고 교통 흐름을 개선하기 위해 수집된 자료입니다. 이 자료는 성남시 전역에서 실시된 단속 정보를 기반으로 하며, 관리기관명, 단속 일시, 단속 장소, 단속 방법 등의 항목을 포함합니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공 데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 교통 정책 수립이나 민원 대응 등 기초자료로 활용될 수 있습니다.
