summary_user: 해양수산부 해양안전종합정보시스템에서 선박 VMS 등록 때 국가를 식별하는 데 쓰는 선박국가코드 코드표로, 국가코드와 국가 한글명·영문명을 국가 한 건씩 담은 작은 CSV 파일(7,942바이트)입니다. 선박 관리 시스템 개발자나 분석가가 VMS·선박 자료에 찍힌 국가코드가 어느 나라인지 한글·영문 이름으로 풀어 국가별 선박 통계를 낼 때 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 같은 기관 자료의 국가코드나 국가명을 매핑해 다른 선박 데이터와 잇습니다.
description_portal: 이 데이터는 해양수산부 해양안전종합정보시스템에서 선박 VMS 등록 과정에서 선박의 국가를 식별하기 위해 사용되는 선박국가코드 정보를 수집한 데이터입니다.  본 데이터의 주요 내용은 국가코드, 국가명(한글 및 영문), MID(Maritime Identification Digits) 등 선박 국가 식별과 관련된 항목으로 구성되어 있습니다.  본 데이터는 선박 관리 시스템 구축 시 국가정보 조회, 선박 등록 및 행정 처리 과정에서 국가 식별 기준으로의 활용, 해양안전 및 선박 운항 관련 정책수립, VMS 운영체계 내 국가별 선박 통계분석 등에 활용될 수 있습니다.
