summary_user: 고속도로 노선별로 안전운전 콘텐츠를 건별로 담는 외부 API로, 노선명·노선번호·상하행 구분·좌표·돌발 유형 코드·콘텐츠 문구(contentMsg)·콘텐츠 순위 등을 제공하며 범위는 전국입니다. 고속도로 안내 시스템이나 운전자 안전 캠페인 운영자가 '지금 이 노선 이 방향에 운전자에게 어떤 주의 문구를 띄워야 하나'를 확인하는 데 쓴다. 표준링크 ID 형태의 필드(rStdLinkId, startStdLinkId)와 노선번호가 있어 표준노드링크와 맞춰볼 여지는 있으나, 실측에서는 전역 조인 키가 확인되지 않아 노선명·코드 매핑이나 같은 기관(한국도로공사) 데이터의 코드로 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 안전운전을 위한 콘텐츠 정보를 조회할 수 있는 OpenAPI이다.해당 API는 고속도로 이용자에게 안전운전과 관련된 유용한 정보를 제공하기 위해 다양한 콘텐츠 항목을 수록하고 있다.정보는 콘텐츠 유형, 제공 일시, 위치 정보, 콘텐츠 제목 및 설명 등의 항목으로 구성되며, 정기적으로 갱신된다.데이터는 XML 및 JSON 형식으로 제공되며, 운전자 안전 교육, 공공안전 캠페인, 안내 시스템 등에 활용이 가능하다.각 콘텐츠는 지역별 또는 상황별로 구분되어 제공되며, 사용자 맞춤형 정보 제공이 가능하도록 설계되었다.API는 인증키 발급을 통해 사용할 수 있다.
