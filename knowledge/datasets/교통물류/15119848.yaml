description_portal: 부산광역시에서 운영하고 있는 도시공간정보업무포털의 굴착허가정보(도로굴착관리번호, 도로굴착허가번호,  허가날짜, 기준일자)입니다. 도로 관리, 안전 측면에서는 허가 정보를 통해 다른 공사와의 충돌이나 지하 시설물 손상을 예방할 수 있고 도시 계획, 정책 측면에서는 중복 굴착을 방지하고 공사 이력 관리 할 수 있습니다. 그리고 데이터를 기반으로 실시간 안내 서비스가 가능해지고 도로 굴착은 아스팔트 절단·재포장 비용이 크기 때문에, 허가정보 공유로 불필요한 재굴착을 줄일 수도 있습니다.
