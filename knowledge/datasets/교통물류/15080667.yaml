summary_user: 성남시 안에서 영업하는 화물자동차 운송주선사업자를 업체 한 곳당 한 행으로 담은 현황 파일로, 인허가일자·영업상태·업종(이사화물, 일반화물, 둘 다)·도로명주소·위경도·연락처를 포함한다. 화주나 이사 예정자가 "이 주선업체가 성남시에 등록된 업체이고 지금도 영업 중인가"를 확인하거나, 분석가가 성남시 내 주선업체의 위치 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명·주소를 맞추거나 위경도로 공간 결합하는 방식으로 잇고, 전국 단위 허가 여부는 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 화물자동차운수사업법등 관련법령에 따라 성남시 내에서 운영되는 화물자동차 운송주선사업자의 정보를 포함하고 있는 현황자료입니다. 시군명(성남시), 인허가일자, 영업상태 구분, 업종구분(이사화물, 일반화물, 이사+일반화물), 업체명, 도로명 주소, 위도좌표, 경도좌표, 연락처 등의 항목으로 구성되어 있습니다. 해당 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 구간은 공란으로 처리됩니다.* 화물자동차 운송주선사업”이란 다른 사람의 요구에 응하여 유상으로 화물운송계약을 중개ㆍ대리하거나 화물자동차 운송사업 또는 화물자동차 운송가맹사업을 경영하는 자의 화물 운송수단을 이용하여 자기 명의와 계산으로 화물을 운송하는 사업(화물이 이사화물인 경우에는 포장 및 보관 등 부대서비스를 함께 제공하는 사업을 포함)을 말합니다.
