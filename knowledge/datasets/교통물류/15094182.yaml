summary_user: 2015~2020년에 선정된 전국 자전거 교통사고 다발지역(반경 300m 안에서 1년간 자전거 관련 사고 4건 이상)에 포함된 사고를 한 건씩 담은 원천 데이터로, 다발지역·시군구·지점명, 발생일과 시간대, 가해자·피해자의 성별·연령·차종·상해 정도, 사고유형, 법규위반, 기상상태, 사상자 수를 담는다. 지자체 교통안전 담당자나 분석가가 '우리 시군구 자전거 사고 다발지점에서는 어떤 시간대에 어떤 차종과 어떤 유형의 사고가 반복되는가'를 따져 개선 대상 지점을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·지점명 같은 이름 매칭으로만 이어 붙이며, 다발지역의 공간 정보는 교통사고분석시스템(TAAS)의 다발지역 자료와 함께 본다.
