summary_user: '전국 유도선 선박 576척을 선박 한 척당 한 행으로 담은 CSV 파일이다(7열: 관리기관·선박명·선박종류·사업구분·등록구분·톤수 등). 지자체별로 관리 중인 유도선이 몇 척이고 동력선·무동력선, 규모(톤수)가 어떠한지 파악하려는 분석가나 담당자가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 선박명·관리기관 이름 매핑이나 같은 기관 코드로만 이어 쓸 수 있다.'
description_portal: 이 파일은 2024년 기준 유도선 선박 현황을 정리한 CSV 자료로, 총 576행 7열로 구성되어 있다. 주요 열(column)은 번호, 관리기관, 선박명, 선박종류, 사업구분, 등록구분, 톤수로 나뉘어 있으며, 각 선박의 기본 정보를 체계적으로 기록하고 있다. 예를 들어 관리기관에는 서울특별시 한강사업본부 등 지자체별 관리 주체가 기재되어 있고, 선박명에는 ‘러브크루즈호’, ‘로이타니아호’와 같은 개별 선박 명칭이 포함된다. 선박종류는 동력선과 무동력선으로 구분되며, 사업구분은 ‘유선’ 등 운영 형태를 표시한다. 등록구분에는 신규나 갱신 여부가 기재되어 선박 등록 상태를 확인할 수 있고, 톤수는 선박의 규모를 나타내는 지표로 제시된다. 이 자료는 전국 유도선 선박의 분포와 관리 현황을 한눈에 파악할 수 있는 기초 데이터로, 정책 수립이나 안전 점검 계획 수립 시 활용도가 높다.
