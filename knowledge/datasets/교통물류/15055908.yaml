summary_user: 광주광역시에 등록된 시내버스 운송업체 10곳의 업체명, 면허대수(보유 차량 수), 도로명·지번 주소, 위도·경도, 전화·팩스번호를 업체 1행씩 담은 소규모 현황 파일이다(2025년 12월 31일 기준). 광주 시내버스를 어느 회사가 몇 대씩 운행하는지, 차고지·사무실이 어디에 있는지 확인하거나 업체에 연락처를 찾는 데 쓴다. 전역 조인 키는 없어 노선·정류장 데이터와는 업체명으로 맞춰 붙이고, 위도·경도나 주소로 지도·행정구역 데이터와 겹쳐 본다.
limits: 업체 단위 일반현황만 있어 노선별 배차, 승하차, 실시간 도착 같은 운행 정보는 담지 않는다. 다른 데이터와 공통 코드 키가 없어 연계는 업체명 문자열 매칭에 기대야 한다.
