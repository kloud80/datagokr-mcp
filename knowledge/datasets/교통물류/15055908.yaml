description_portal: 본 데이터는 광주광역시에 등록된 시내버스 운송업체의 일반현황을 정리한 것으로, 총 10개 운송업체에 대한 세부정보를 포함하고 있습니다. 각 업체별로 업체명, 면허대수(보유 차량 수), 소재지 도로명주소 및 지번주소, 우편번호, 위도와 경도 정보(정확한 지리적 위치 확인용), 전화번호 및 팩스번호 등 다양한 항목으로 구성되어 있습니다. 이를 통해 광주광역시의 시내버스 사업자 현황을 파악할 수 있으며, 각 업체의 운영규모나 지역별 분포, 연락처 등의 정보도 함께 확인할 수 있습니다. 본 자료는 2025년 12월 31일 기준으로 작성되었습니다.
