status: active
summary_user: 서울시 버스 노선별로 출발 정류장에서 도착 정류장까지 구간의 평균 운행시간을 기준일(CRTR_DD) 하루 단위로 담고, 0시부터 23시까지 시간대별 값을 열로 나눠 제공하는 집계 데이터다. 교통 분석가나 시민이 '출근 시간대 특정 노선의 이 정류장 구간은 평균 몇 분 걸리나' 같은 질문에 답하거나 시간대별 구간 지연을 비교하는 데 쓴다. 노선 ID(RTE_ID)와 출발·도착 정류장 ID를 서울시 노선마스터·정류장마스터 정보에 맞춰 노선명·정류장명을 붙여 쓰지만, 실측 컬럼에서 전역 조인 키는 확인되지 않아 같은 기관 코드 체계 안에서만 연결된다.
limits: data.seoul.go.kr 외부 사이트 인증키가 따로 필요하며 공공데이터포털 활용신청과는 별개다. 노선·정류장 ID는 서울시 내부 코드라 다른 지자체나 전국 정류장 데이터와는 이름 매핑 없이 바로 이어지지 않는다.
