description_portal: 이 데이터는 광주광역시 도시철도공사 교량 시설물의 내진 실태 현황을 정리한 자료로, 각 교량의 구조적 특성과 내진 적용 여부를 상세히 제공합니다. 주요 항목에는 구분(도로별·노선별), 교량명, 관리기관, 위치, 총연장 및 폭, 교량 구조(거더교, 라멘교, PSC박스 등), 상·하부 구조 형식, 준공연도, 설계하중(톤), 평가등급, 내진설계 적용 여부(적용 전·후)가 포함됩니다.이 자료를 통해 광주 도시철도 노선상의 교량별 내진 안전 수준을 파악할 수 있으며, 구조 형식과 준공 시기를 비교하여 노후화된 교량의 보강 우선순위를 설정할 수 있습니다. 또한 설계하중과 평가등급을 기반으로 지진 발생 시 안전성 분석, 내진 보강 필요성 검토, 시설물 관리·점검 계획 수립에 활용 가능합니다. 이는 도시철도의 안전 운행과 재난 대비 체계 강화에 필수적인 기초 자료입니다.
