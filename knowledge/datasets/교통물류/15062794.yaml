description_portal: 대전광역시 버스전용차로위반 부과현황은 2021년 한 해 동안 대전시 내에서 발생한 버스전용차로 위반 관련 부과 내역을 집계한 자료입니다. 이 자료는 위반 부과 건수와 부과된 금액, 체납 건수 및 체납 금액, 실제 징수 건수와 징수 금액 등의 항목을 포함하여, 버스전용차로 위반에 대한 행정적 조치 현황을 상세하게 제공합니다. 해당 자료는 교통 질서 확립과 버스 전용 차로의 효율적 운영을 위한 정책 수립에 기초가 되며, 위반 행위에 대한 단속 실적과 징수 현황을 분석해 교통법규 준수 유도 및 교통환경 개선에 활용할 수 있습니다.
