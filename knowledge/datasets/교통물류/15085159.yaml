description_portal: '○ 통계개요* 통계명 : 자동차 1일 평균주행거리(용도별·차종별)* 통계종류 : 일반, 보고통계* 법적근거 : 「자동차관리법」제43조 및 제43조의2* 작성목적 : 국내에 등록되어 도로를 운행중인 자동차의 용도별·차종별 주행거리를조사하여 교통, 환경, 에너지 분야 정책수립 기초자료로 활용* 조사체계 : 자동차검사차량 → 자동차검사소 → 교통안전공단* 공표주기 : 매년* 공표범위 : 지역 - 서울시 및 자치구내용 - 용도별, 차종별 자동차 1일 평균주행거리○ 용어설명* 주행거리 : 자동차검사 시 계기판 주행거리 정보를 통해 작성되며,최종검사 주행거리에서 이전검사 주행거리를 뺀 거리로 계산* 1일 평균주행거리 : 주행거리를 운행일수로 나눈 값임** 운행일수 : 최근 검사일에서 이전 검사일 사이 일수○ 기타* 통계산정기준은 기준년도 실제 주행거리가 아닌 기준년도 자동차검사를 받은차량의 이전검사로부터 최근검사까지의 평균 주행거리임* 자동차분류기준 : 「자동차관리법 시행규칙」 별표1(자동차의 종류)에 따름○ 출 처 : 교통안전공단, 자동차주행거리통계작성기관 및 부서전화번호 : 한국교통안전공단 교통안전연구처( ☎ 054-459-7431)'
