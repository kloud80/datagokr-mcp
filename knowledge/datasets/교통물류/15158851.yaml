summary_user: 한국공항공사가 제공하는 출발공항-도착공항 노선별 운항거리(km)와 운항시간을 국내/국제 구분과 함께 노선 단위로 담은 전국 범위의 비공간 데이터다. 항공편 스케줄을 연구하는 분석가나 여행자가 '김포에서 제주까지 비행 거리와 소요시간이 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 운항 스케줄·항공통계 등 다른 데이터와는 공항명을 이름 매핑하거나 공항코드표로 변환해 연결해야 한다.
description_portal: '"한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는노선별 소요시간 및 거리 정보 제공를 제공합니다.제공되는 주요 데이터 항목으로는 출발공항-도착공항의  거리와 소요시간 정보가 상세히 포함되어 있습니다. 이를 통해 항공편 스케줄 연구 등 다양하게 데이터를 활용하실 수 있습니다.제공되는 항공 노선의 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.'
