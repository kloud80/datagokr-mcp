summary_user: 경기도 도로대장 가운데 '용지' 부분으로, 도로 노선·구간별로 편입된 필지의 법정동코드·지번·지목, 저촉면적과 잔여면적(㎡), 국유·사유 등 소유구분과 소유자명을 필지 단위로 담는다. 도로 확장이나 보상 업무를 맡은 공무원·분석가가 특정 노선 구간에 걸린 토지가 몇 필지이고 사유지 저촉면적이 얼마인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 소재지 법정동코드(locplc_legaldong_cd)와 지번으로 토지·지적 자료와 맞추거나, 노선번호·구간번호로 같은 기관의 다른 도로대장 항목과 연결한다.
description_portal: 이 데이터는 경기도의 도로대장 중 ‘용지’에 해당하는 정보를 포함하고 있으며, 노선번호, 구간번호, 단위도면명, 소재지법정동코드, 지번, 지목코드, 저촉면적(㎡), 잔여면적(㎡), 소유구분, 소유자명, 비고 등 총 11개 항목으로 구성되어 있습니다. 각 용지의 행정구역 내 위치와 해당 토지의 공공시설 영향 여부, 국유지·사유지 등 소유권 구분, 면적 정보를 통해 도로 건설, 확장, 토지 보상 등의 업무에 활용 가능합니다. 경기도도로대장전산화시스템에서 수집된 이 자료는 도로 건설계획, 보상업무, 도시계획 수립, 토지이용계획 검토 등과 같은 정책 및 행정업무 수행 시 참고자료로 활용될 수 있습니다.
