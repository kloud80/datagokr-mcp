summary_user: 제주특별자치도 내 6개 항만(제주항·서귀포항·애월항·한림항·성산포항·화순항)의 화물 물동량을 연월별로 담은 집계 파일로, 입항은 모래·유류·시멘트·비료·목재·철재·자갈·기타, 출항은 감귤채소·기타 품목별 톤수로 나뉜다. 분석가나 물류 사업자가 '제주항으로 들어오는 시멘트·자갈 같은 건설자재 물량이 해마다 어떻게 변했나', '감귤채소 출항 물량이 어느 달에 몰리나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 항만 통계와는 항만 이름과 해당연월을 맞춰 붙여야 한다.
description_portal: '제주특별자치도 내에 위치한 각 항만별로 2016~ 부터 입항 및 출항에 대한 화물 물동량 데이터를 제공합니다.항목: 구분, 상세, 해당연월 등*화물물동량: 화물의 이동을 나타내는 물류지표*대상항: 제주항, 서귀포항, 애월항, 한림항, 성산포항, 화순항 *입항(톤): 모래, 유류, 시멘트, 비료, 목재, 철재, 자갈, 기타*출항(톤): 감귤채소, 기타자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1652'
