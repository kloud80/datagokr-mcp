description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG(Environment) 분야 환경관리 정보의 일환으로, 도시철도 차량의 제원 정보를 개방하여 친환경 대중교통 이용 활성화와 철도 운영의 투명성 제고를 위해 제공됩니다. 데이터에는 노선별 전동차의 차종, 제어방식, 도입년도, 전원방식, 편성정보, 차량 규격, 차량 성능, 정원, 추진제어장치, 보조전원장치, 대차, 제동장치, 견인전동기, 출입문, 집전장치, 공기압축기 등 도시철도 차량의 주요 기술 제원이 포함되어 있습니다. 본 데이터는 연구기관, 산업계, 교육기관 및 일반 시민이 도시철도 차량의 성능과 특성을 분석하고 노선별 차량 제원을 비교하는 것은 물론, 철도 운영 및 안전 연구, 정책 수립, 학술연구, 교육자료 제작, 서비스 및 콘텐츠 개발 등 다양한 분야에서 활용할 수 있는 공공데이터입니다.'
