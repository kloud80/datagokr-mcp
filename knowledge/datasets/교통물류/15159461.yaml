summary_user: 경기도 남양주시가 허가한 화물자동차 운송주선사업자를 업체 한 곳당 한 행으로 담은 파일(csv, 약 20KB)로, 인허가일자·인허가번호·영업상태·업종구분·업체명·도로명·지번주소를 포함한다. 화주나 사업자가 거래하려는 남양주 소재 주선업체가 적법하게 허가받았고 현재 영업 중인지 확인하는 데 쓴다. 전역 조인 키가 없어 업체명·인허가번호·주소로 맞춰야 하며, 전국 단위 확인은 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
description_portal: 화물자동차 운송주선사업 허가업체 현황 데이터는 화물 운송을 중개·알선하는 운송주선사업자의 허가 및 운영 현황을 체계적으로 제공하기 위한 공공데이터입니다. 본 자료에는 인허가일자, 인허가번호, 업종구분, 업체명, 주소 정보가 포함되어 있어 이용자가 적법하게 허가된 운송주선업체를 확인하고 신뢰할 수 있는 물류 서비스를 이용할 수 있도록 지원합니다. 또한 해당 데이터는 물류산업 관리 체계 강화와 화물 운송 질서 확립, 관련 정책 수립 및 산업 분석을 위한 기초 자료로 활용됩니다. 더불어 효율적인 물류서비스 운영과 건전한 운송시장 환경 조성에 기여하며, 지역경제와 물류산업 발전을 지원하는 중요한 공공데이터입니다.
