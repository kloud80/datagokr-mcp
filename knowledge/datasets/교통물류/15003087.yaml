summary_user: 한국공항공사가 운영하는 전국 공항의 국제선 정기 운항 스케줄을 편 단위로 담은 파일 데이터로, 항공사·운항편명·출발/도착공항·시간·운항요일·시작/종료일자로 구성되며 2026-03-29~2026-10-25 구간 11,325행이다. 해외여행객이나 항공 분석가가 특정 공항에서 어느 항공사가 무슨 요일에 국제선을 띄우는지 확인하는 질문에 쓴다. 전역 조인 키는 없어 공항·항공사 이름이나 같은 기관의 코드로만 다른 운항정보와 연결한다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 전국공항의 항공기 국제선 운항 스케불 정보를 제공합니다.해당 데이터는 항공사, 운항편명, 출발공항, 도착공항, 운항요일 등의 정보로 구성되어 있습니다.항공기 스케줄은 하계, 동계 기준으로 스케줄이 짜여지니 참고하시기 바랍니다.추가 문의사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
