summary_user: 경기도 광주시 공간정보시스템에 등록된 과적검문소를 시설 한 곳씩 담은 위치 목록으로, 지번주소·경도·위도와 단속 방향, 고정식·이동식 같은 종류, 사용 여부를 담는다(파일 크기 393바이트의 소규모 CSV). 화물 운송 사업자나 도로 안전 분석가가 '광주시 안에서 과적 검문소가 어디에 있고 지금 운영 중인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 경도·위도 좌표나 주소를 기준으로 공간 결합하거나 관리기관 이름으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 과적검문소의 위치 정보를 제공합니다. 화물차량의 과적재를 단속하여 도로 파손과 교통사고를 예방하는 검문소 시설의 정보를 담고 있습니다. 지형지물부호는 검문소를 식별하는 코드이며, 관리기관은 검문소 운영 주체를 나타냅니다. 지번주소와 경도, 위도는 검문소의 정확한 위치를 제공하고, 방향은 단속 진행 방향을 표시합니다. 종류는 고정식, 이동식 등 검문소 유형을 나타내며, 사용 유무는 현재 운영 상태를 표시합니다. 본 데이터는 교통 단속 계획, 도로 안전 관리, 과적 차량 단속, 교통 법규 집행 등에 활용됩니다.
