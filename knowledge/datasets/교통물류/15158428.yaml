summary_user: 대전도시철도 1호선 이용객의 도시철도–버스 환승 기록을 영업일·환승역·버스 종류별 환승 건수로 집계해 담는다. 교통 정책 담당자나 분석가가 특정 역에서 어느 날 어떤 종류의 버스와 환승이 몇 건 일어났는지 파악해 환승 편의 개선이나 노선 조정 근거를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고 역 코드(stationCode)로만 대전교통공사의 다른 역·승하차 데이터와 이을 수 있다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 이용 고객의 환승 정보를 제공하는 데이터입니다.환승일, 환승역, 버스 종류, 환승 건수 등 주요 항목별 정보를 포함하고 있으며, 도시철도와 버스 간 환승 흐름을 체계적으로 파악할 수 있습니다.본 데이터를 활용하면 교통 정책 수립 및 서비스 개선에 유용하게 활용할 수 있습니다.또한 이용자 이동 특성을 기반으로 한 대중교통 운영 효율화 및 환승 편의성 향상을 위한 정책 수립의 참고 자료로도 활용이 가능하여 대전 시민의 편리한 대중교통 이용 환경 조성에 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
