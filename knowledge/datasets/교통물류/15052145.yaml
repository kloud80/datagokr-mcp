summary_user: 건설기계조종사경력관리시스템에 신청된 조종사를 지역별로 나누고, 덤프트럭·콘크리트믹서트럭·콘크리트펌프 등 8개 기계 종류별 인원을 2007년부터 누계로 집계한 소규모 CSV 파일입니다(약 587바이트). 건설·운송 업계 분석가나 정책 담당자가 "어느 지역에 덤프트럭이나 믹서트럭 조종사가 많이 몰려 있는가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지역 구분 이름을 맞추는 방식으로만 이어 쓴다.
limits: 2007년 이후 누계라서 특정 연도의 신규 인원이나 현재 활동 인원은 알 수 없다. 지역 구분에 표준 행정코드가 없어 다른 통계와 연결하려면 지역명을 직접 매핑해야 한다.
