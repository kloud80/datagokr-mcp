summary_user: 원주시를 격자 단위로 나눠 격자ID·측정일자·측정시각·행정동별로 도로면·횡단보도·육교·주차면·버스 노선·정류장·신호등·표지판 지수와 유동인구 수, 교통소통·교통사고 지수를 함께 담은 파일 데이터이다(zip 약 16MB). 교통 분석가나 시 담당자가 '원주시에서 소통이 나쁘고 사고 지수가 높은데 신호등·횡단보도 같은 시설 지수는 낮은 격자가 어디인가'처럼 시설 투자 우선순위를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 행정동 이름을 매핑하거나 격자 공간 정보로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 강원특별자치도 원주시의 격자 단위로 세밀하게 분석된 교통 지수를 투명하게 공개하여, 과학적인 도시 교통 관리와 맞춤형 교통 정보 서비스 개발을 지원하기 위해 구축되었습니다. 해당 기관에서 교통량, 평균 속도, 혼잡도 등 주요 지표를 공적 자료를 통해 수집하고 정제했습니다. 전체 행정동을 포함하는 이 상세 정보는 지역별 교통 흐름을 면밀히 파악하여 교통 혼잡 해소 및 시설 투자 우선순위 결정에 필수적입니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있으며, 스마트 시티 기반 조성에 기여합니다.
