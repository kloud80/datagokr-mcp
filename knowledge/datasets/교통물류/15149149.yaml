description_portal: 일시수출입차량(*여행자용차량 기준)을 자동차와 오토바이로 구분하여 수출입 통관 내역을 2014년부터 2024년까지 연도별 월별 집계한 내역입니다. 집계 내역이 없는 월은 따로 표시하지 않았습니다.일시수출입차량에 관한 사항은 일시수출입하는 차량통관에 관한 고시를 통해 자세한 내용을 확인하실 수 있습니다.수입은 차량등록국가 제출 기준에 따라 일본에서 한국으로 일시수입한 통관내역이며, 수출은 차량등록국가 및 목적국 제출이 필수 신고 대상이 아니어서 특정국 수출 통계가 불가합니다. 이에 한국에서 일시 수출 신고된 여행자용 차량 전체 건수를 제공합니다.
