summary_user: 한국공항공사가 운영하는 인천 외 공항을 이용한 항공사별 화물 실적을 연도·노선·항공사·정기/부정기 구분별로 도착·출발 화물량을 집계한 통계 파일입니다(csv 약 4KB 규모). 물류 분석가가 특정 항공사의 노선별 화물 처리량 변화를 보고 수출입 물류 흐름을 가늠하는 데 쓴다. 전역 조인 키가 없어 항공사명·노선명을 이름 매핑하거나 같은 기관의 공항·노선별 여객·운항 실적 통계와 맞대어 쓴다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 공항을 활용하는 항공사별 화물실적 정보를 제공합니다.해당 데이터는 연도, 노선, 정기/부정기 여부, 총 도착 화물량, 총 출발 화물량 항목의 통계자료로 이루어져 있습니다.추가 문의사항 또는 요구사항 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
