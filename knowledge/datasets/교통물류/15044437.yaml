summary_user: 서울교통공사가 쓰는 궤도시설 종류(B2S궤도, 급곡선 궤도, 방진상 궤도, 직결궤도, 탈선방지 안전가드레일, 탄성분기기 등)별로 시설명과 특징 설명을 한 행씩 담은 소규모 설명표(CSV 697바이트)이다. 철도 분야 학습자나 분석가가 "방진상 궤도와 직결궤도는 구조·특징이 어떻게 다른가", "급곡선 구간에 가드레일을 왜 설치하나" 같은 용어·개념 질문에 참고 자료로 쓴다. 필드는 연번·시설명·특징뿐이고 전역 조인 키가 없어, 다른 서울교통공사 시설·안전 데이터와는 시설명 텍스트를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 서울교통공사 궤도시설 종류(궤도시설명, 특징)에 관한 데이터입니다. 해당 데이터는 B2S궤도, 급곡선 궤도, 방진상 궤도, 직결궤도, 탈선방지 안전가드레일, 탄성분기기 등에 대한 정보를 포함하고 있습니다. 궤도시설물의 주요 궤도구조인 B2S궤도, 급곡선 궤도, 방진상 궤도, 직결궤도의 설명 및 특징을 포함하고 있습니다.또한, 급곡선 구간에서 설치하고 있는 탈선방지 안전 가드레일의 설치 목적과 특성 그리고 탄성 분기기의 정의에 대해 설명하고 있습니다.2026년 2월 13일자 기준 자료로 궤도시설물의 전반적인 특징을 파악하기에 적합한 자료입니다.
