summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 운수업체의 버스 영업소 이력을 이력 한 건 단위로 담으며, 이력ID·영업소ID·업체ID·영업소명으로 구성된다. 교통 분석가나 담당 공무원이 "어느 운수사가 어떤 이름의 영업소를 두고 있고 그 명칭·관리 이력이 어떻게 바뀌었나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 없어, 같은 BMS 계열 데이터와 업체ID(entrps_id)·영업소ID 같은 기관 내부 코드나 업체·영업소 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에 등록된 운수업체의 영업소 이력 정보를 제공합니다. 주요 항목은 이력ID, 영업소ID, 업체ID, 영업소명으로 구성되어 있으며, 각 운수사의 지역별 버스 영업소 명칭과 관리 이력을 확인할 수 있습니다. 이 데이터는 노선 운영 권역 설정, 차량 배치 계획 수립, 업체별 운행 범위 분석, 교통 민원 대응체계 마련 등 대중교통 운영 관리에 활용됩니다. 또한 지역 교통 정책 수립 시 영업소의 위치 분포나 변동 이력을 바탕으로 효율적인 교통 인프라 개선에 기여할 수 있습니다.
