summary_user: 교통카드 이용 기록을 분석해 전국 대중교통 통행량을 평일·토요일·일요일별로 나눠 담은 집계 파일이며, 단위는 통행이고 파일 크기가 474바이트로 행 수가 매우 적은 요약표다. 정책 담당자나 분석가가 '평일과 주말 사이 대중교통 통행량이 얼마나 차이 나는가'처럼 요일 유형별 이용 규모를 확인하는 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 항목(구분1)의 이름을 맞추거나 같은 기관의 교통카드 이용분석 자료와 대조하는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단에서 교통카드를 이용해 전국(서울특별시, 부산광역시, 대구광역시 등)의 데이터를 분석하여 추출한 대중교통 통행량 자료입니다.해당 데이터는 평일, 주말(토요일, 일요일)별로 세분화하여 제공하고 있습니다.단위는 통행 입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
