summary_user: 대구 도시철도 1호선 상선(하양역→설화명곡역)의 열차 운행 시각표를 담은 파일 데이터로, 열차번호(1002~1084 열)별로 역마다 도착 시각과 요일 구분(평일·토요일·공휴일)을 행으로 두며 전체 204행이다. 이용자나 분석가가 특정 역에 몇 시에 열차가 오는지, 요일별 운행 계획이 어떻게 다른지 확인하는 데 쓴다. 전역에서 통하는 조인 키는 없어 다른 데이터와는 역명 매핑이나 같은 기관의 코드로만 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 1호선 상선(하양역 → 설화명곡역) 열차 운행 시각표 정보를 제공합니다. 데이터에는 2024년 10월 7일 변경된 운행 계획이 반영되어 있으며, 열차번호별 출발역 및 도착역, 각 정차역의 도착 시각, 평일·토요일·공휴일별 운행 시간표 등의 항목이 포함되어 있습니다. 해당 데이터는 이용자가 열차 운행 계획과 역별 도착 시간을 확인하고 이동 계획을 수립할 수 있도록 제공되는 자료로, 도시철도 이용 편의 향상, 운행 정보 확인 및 교통 서비스 개선 검토를 위한 기초자료로 활용할 수 있습니다. 또한 요일별 운행 정보를 제공하여 이용 패턴에 따른 대중교통 이용 계획 수립과 효율적인 이동 경로 검토에 활용할 수 있습니다. 본 데이터는 운행 시각표 변경 등 변동 사항 발생 시 갱신되며, 변경된 열차 운행 계획을 반영합니다.'
