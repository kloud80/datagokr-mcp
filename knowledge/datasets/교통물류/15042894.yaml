summary_user: SRT 운영사 (주)에스알이 2025년 상반기 기준으로 출발역과 도착역 사이의 일평균 수송 인원을 담은 역간 OD 행렬 파일이며, 행은 출발역(역명)이고 열은 수서·동탄·부산·여수EXPO 등 SRT 정차역입니다. 철도 수요 분석가나 지역 상권·관광 담당자가 '수서에서 부산·광주송정 등 각 지역으로 하루 평균 몇 명이 SRT로 이동하는가' 같은 지역 간 고속철도 통행량 질문에 쓴다. 공통 코드 형태의 조인 키는 없어서, 역 이름을 기준으로 다른 철도 승하차·역 시설 데이터나 지역 통계와 직접 매핑해 이어 쓴다.
