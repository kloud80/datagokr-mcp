summary_user: 서산시 도시계획정보시스템 가운데 도면이미지 관련 테이블과 컬럼의 구조를 정리한 메타데이터로, 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목을 담은 1877바이트 분량의 작은 CSV 파일이다. 도면이미지 자체나 도시계획 공간정보가 아니라 자료 구조 정의이므로, 서산시 도시계획 DB와 연계하거나 정보공개를 청구하려는 분석가·개발자가 "도면이미지 테이블에 어떤 컬럼이 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명 같은 이름 매칭으로만 잇는다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 도면이미지에 관한 메타데이터이다. 본 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 도면이미지는 도시계획 공간정보를 시각화한 자료로, 계획 구역, 경계, 지형, 도로, 용도지역 등의 내용을 포함한다. 해당 데이터는 도시계획 수립, 행정업무, 공간분석 등에 활용되며, 시각 자료로서 이해도 향상에 기여한다. 메타데이터 형식으로 제공되어 도시계획정보시스템의 자료 구조 및 속성 파악에 유용하며, 정책 수립, 민간 활용, 도시설계 등 다양한 분야에서 기초자료로 활용 가능하다.
