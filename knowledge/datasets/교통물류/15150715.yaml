summary_user: 경찰청이 제공하는 교통안전 위험요소 정보 가운데 비가 오는 기상 조건에서의 도로환경 정보를 담으며, 시작·종료 지점(정류소) 이름과 식별자, 구간 거리, 소요 시간을 구간별로 제공하고 범위는 전국이다. 교통안전 분석가나 지자체 담당자가 "비 오는 날 위험요소가 있는 구간이 어디이고 거리·소요 시간은 얼마인가"를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지점 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다."
