summary_user: 대구1호선 각 역 승강장에 설치된 비상콜폰의 설치 위치를 운영기관·노선·역·층·상세위치 단위로 한 줄씩 담은 소규모 CSV 파일(약 4.6KB)이다. 승객 안전 담당자나 분석가가 "이 역 승강장의 비상콜폰은 어느 층, 상하선 어느 방향 끝에 있나"를 확인하거나 역별 설치 현황을 점검할 때 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·노선명 같은 이름 매칭으로만 이어 쓴다.
limits: 표준 역 코드 같은 조인 키가 없어 다른 철도 데이터와 연결하려면 역명 표기를 맞춰야 한다. 좌표가 없는 비공간 데이터라 지도 위치는 바로 얻을 수 없고, 상세위치는 문장형 설명이다.
