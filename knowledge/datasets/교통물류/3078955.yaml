summary_user: 부산진구 마을버스를 노선 단위로 정리한 파일로, 노선번호·운행업체·기점·경유지·종점, 운행대수와 예비대수, 운행거리, 평일·출근시간·주말공휴일 배차간격, 일반·청소년·어린이의 카드·현금 요금을 담는다(약 2KB CSV, 포털 설명상 7개 업체 15개 노선). 주민이나 방문객이 집 근처 마을버스가 어디서 어디까지 가는지, 배차간격과 요금이 얼마인지 확인할 때, 분석가가 구 내 노선별 차량 투입과 서비스 수준을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 정류장·노선 원장이나 실시간 도착 정보(BIMS·TAGO)와는 노선번호·정류장 이름을 맞춰 붙여야 하며, 다른 구 자료와는 구군명으로만 묶을 수 있다.
description_portal: 부산진구 마을버스 운행정보(노선번호, 기점, 종점, 운행시간, 요금 정보 등), 7개업체(범우교통, 한국교통, 세성교통, 신지교통, 대도공영, 대명교통, 한창버스)  15개노선 운행정보입니다.운행대수 총 63대(예비차포함)으로, 부산진구 1번은 시민공원 촉진3구역 재개발 사업으로 인하여 내년 초반 휴업 들어갈 에정입니다. 일반적인 마을버스의 운행시간은 오전 6시부터 오후 11시로 안내되어 있지만, 각 노선별로 약간의 차이가 있을 수 있습니다.실시간 운행 정보는 부산버스정보시스템(BIMS)을 통해 확인하는 것이 가장 정확합니다.
