description_portal: 도시개발과 사회기반시설 확충에 따른 건설업계의 성장으로 건설기계에 대한 수요가 지속적으로 증가하고 있으며, 건설기계의 안전관리와 효율적인 운영을 위한 체계적인 등록 관리 시스템의 중요성이 커지고 있습니다. 건설기계관리법에 따른 적정한 건설기계 관리와 안전사고 예방을 위한 등록 현황 파악이 중요해지고 있으며, 건설기계 임대업체와 건설업체 간의 공정한 거래질서 확립과 시장 투명성 제고를 위한 정보 공개가 필요합니다. 지역 건설업계의 시장 분석과 건설기계 수급 현황 파악을 통한 효율적인 장비 운영 계획 수립의 필요성이 증대되고 있으며, 건설기계 운영자들의 영업 기회 확대와 장비 활용도 제고를 위한 정보 제공이 요구되고 있습니다. 또한 건설기계 관련 정책 수립과 건설업계 지원 사업 계획 수립을 위한 기초 통계 자료 확보의 중요성이 증가하고 있으며, 건설 안전 관리와 장비 운영 효율성 향상을 위한 데이터 기반 정책 수립이 필요하게 되어, 충청남도 보령시는 관내 등록된 15종의 건설기계 유형별 등록 현황과 용도별(관용, 자가용, 영업용) 등록 대수 등 건설업계 현황 파악과 건설기계 관리 정책 수립에 필요한 종합적인 건설기계 등록 현황 정보를 제공하고 있습니다.
