summary_user: 서울교통공사 1~8호선에서 하차 태그 후 15분 안에 같은 역으로 다시 승차한 건수를 업무일자·시간대·호선·역·교통카드구분·사용자구분별로 집계한 일별 통계로, 이번 파일은 2025년 1월~6월분을 담는다. 교통 분석가나 정책 담당자가 '동일역 15분 재승차 제도 시행 이후 어느 역·시간대에서 재승차가 많이 일어나는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 승하차·역 데이터와는 역명·호선 이름을 맞춰서만 이어 쓴다.
description_portal: 서울교통공사 1-8호선 일별동일역15분재승차통계 데이터 입니다. 연단위로 데이터가 업로드 되며, 데이터는 연번, 업무일자, 시간대, 호선, 역명, 교통카드구분, 사용자구분, 15분재승차건수 로 이루어져 있습니다. 동일역15분재승차는 승차역과는 다른 곳에서 지하철 하차 태그 후 15분 내 동일역으로 재승차하면 기본운임이 차감되는 대신 환승이 1회 적용되는 제도입니다. 선불·후불 교통카드 사용자만 혜택 적용 (1회권·정기권 제외)("24. 7. 1. 정식시행) (2025년 1월 ~ 2025년 6월 데이터 입니다.)
