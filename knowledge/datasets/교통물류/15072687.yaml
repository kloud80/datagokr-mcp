summary_user: 부산교통공사가 보유한 도시철도 전동차를 호선별·도입 차수별로 정리한 소규모 파일(csv 약 1KB)로, 도입일자와 보유량(편성·차량 수), 도입 배경을 담는다. 교통 분석가나 정책 담당자가 "부산 2호선 전동차는 언제 몇 량이 들어왔고, 교체 시기는 언제쯤인가" 같은 질문에 쓴다. 전역 조인 키는 없어 다른 부산교통공사 데이터(승하차·혼잡 등)와는 호선 이름으로만 맞춰 이어 쓴다.
