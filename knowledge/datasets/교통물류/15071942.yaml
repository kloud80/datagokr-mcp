summary_user: SRT 고속열차의 상하반기 승차율(%)을 행은 요일, 열은 열차번호(301~344 등)로 펼친 넓은 형태의 집계 파일로, 9로 시작하는 열차번호는 두 편성이 연결된 중련열차의 후부 차량 이용률을 뜻한다. 이용객이나 분석가가 특정 SRT 열차가 어느 요일에 붐비는지, 주말과 평일의 승차율 차이가 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 SRT 시간표·운행 정보와는 열차번호를 이름 그대로 맞춰 연결해야 한다.
description_portal: '1. 고속열차SRT에 대한 자료로, SRT의 연도별 상반기 열차별 요일별 승차율을 제공하는 데이터입니다.2. 열차번호 9번으로 시작하는 열차는 두개의 차량이 연결된 열차의 후부 차량의 이용률을 나타낸 것입니다.예시) 301(중련열차 중 전부차량의 이용률) + 9301(중련열차 중 후부차량의 이용률), (단위 : %)* 2025년 12월 31일기준으로  현행화 및 업데이트된 파일입니다.* 열차 번호와 요일에 해당하는 "빈칸"은 미운행 열차로 값이 존재하지 않습니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다'
