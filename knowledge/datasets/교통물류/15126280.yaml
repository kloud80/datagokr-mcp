summary_user: 창원시 공영자전거 누비자의 2025년 1월~12월 대여·반납 이력을 한 건(한 번의 이용)마다 자전거번호, 출발·도착 터미널, 출발·도착 일시로 담은 건별 원천 파일로, CSV 용량이 약 237MB에 이른다. 분석가나 시 교통 담당자가 '어느 터미널 사이 이동이 가장 많고, 출퇴근 시간대에 어느 대여소에서 자전거가 부족해지는가' 같은 이용 흐름과 재배치 질문에 쓴다. 전역 조인 키는 없어서, 터미널 이름이나 코드를 '경상남도 창원시_누비자 터미널' 데이터와 맞춰 위치를 붙이는 방식으로 이어 쓴다.
description_portal: 창원시 공영자전거 누비자의 2025년 1월부터 12월까지 일일 사용내역-출발 정류장, 도착 정류장, 이용시간이 기록된 데이터입니다.공영자전거 ‘누비자’의 이용자가 언제, 어디에서 자전거를 대여하고 반납했는지에 대한 일시, 대여소, 반납소 정보가 담긴 자료입니다. 본 데이터는 시간대별 이용 흐름, 인기 노선 및 대여소 분석, 서비스 이용 패턴, 운영 효율 및 재배치 전략, 정책 평가 및 민원 대응 등에 활용될 수 있습니다.이전 자료는 아래 주기성 과거데이터에서 확인 가능합니다.터미널에 대한 정보는 '경상남도 창원시_누비자 터미널'데이터를 참고해주시기바랍니다.(https://www.data.go.kr/data/15000545/fileData.do)대여·반납 건수가 많아 엑셀 등 일반 뷰어에서는 일부만 표시될 수 있으니 R, Python, GIS 등 전문 도구를 사용한 시각화 및 시계열 분석을 권장합니다.이력 수집 방식(실시간 자동센서, 수기 입력 등), 회원/비회원 구분, 요금 적용 조건, 대여소 코드 체계 등 세부 정의는 제공기관 메타데이터나 기술문서를 참고해 주세요.
