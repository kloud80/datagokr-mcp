summary_user: 군포시 관내 버스정류장을 정류장 한 곳당 한 행으로 담은 원장 파일로, 정류장 형태(쉘터형·표지판형·무표지형), 정류장번호, 정류장명, 위도·경도, 벤치·조명·버스정보시스템(BIS) 설치 여부를 기록한다. 시민이나 분석가가 "우리 동네 정류장 중 쉘터나 실시간 도착 안내기가 없는 곳은 어디인가" 같은 편의시설 공백을 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로, 다른 노선·도착 정보 데이터와는 정류장번호(ARSID)나 정류장명을 맞추거나 좌표로 근접 매칭해 이어 쓴다.
limits: 군포시 한 곳의 정류장 시설 현황만 담으며, 노선·실시간 도착·승하차 인원은 들어 있지 않다. 표준화된 공통 키가 없어 다른 데이터와 연결할 때는 정류장번호·명칭 매핑이나 좌표 매칭을 따로 검증해야 한다.
