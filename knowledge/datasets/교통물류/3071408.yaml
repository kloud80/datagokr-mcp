description_portal: 군포시 관내 버스정류장에 대한 현황자료는 다양한 항목으로 구성되어 있으며, 이를 통해 정류장의 설치 형태와 편의시설 유무 등 다양한 정보를 확인할 수 있습니다. 정류장 형태는 쉘터형, 표지판형, 무표지형으로 구분되어 있으며, 시민들이 대기할 수 있는 구조물의 유무나 형태를 파악하는 데 도움이 됩니다. 정류장 번호는 ARSID라 불리며, 정류장마다 고유하게 부여된 번호로 26으로 시작하는 5자리 숫자로 구성되어 있어 시스템상 위치 식별 및 정보 연계에 활용됩니다. 정류장명은 해당 정류장의 명칭을 의미하며, 시민들이 일상적으로 사용하는 지명이나 주요 지점을 기준으로 설정됩니다. 또한 정류장의 위치는 위도 및 경도 좌표로 제공되어 지도 기반의 정류장 위치 분석이 가능하고, 각 정류장에 벤치(의자)가 설치되어 있는지 여부와 야간 이용을 고려한 조명 유무 상태도 확인할 수 있습니다. 이 외에도 LCD, LED, 일체형 등의 형태로 제공되는 버스정보시스템(BIS)의 설치 유무를 통해 실시간 버스 도착 정보를 제공받을 수 있는지 여부를 확인할 수 있으며, 모든 항목은 데이터가 수집되거나 갱신된 시점을 나타내는 데이터 기준일자와 함께 제공되어 최신성을 평가할 수 있습니다.
