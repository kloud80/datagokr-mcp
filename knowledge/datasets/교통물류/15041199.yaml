summary_user: 서울교통공사가 운영하는 수도권 6호선 각 역의 승강장을 한 행씩 담은 건별 시설 파일로, 승강장번호·상하행 구분·지상/지하 구분·역층·승강장 연결 여부·스크린도어와 안전발판 유무를 기록한다(CSV 약 4KB의 소규모 파일). 교통약자 이동 안내나 철도안전 분석가가 '6호선에서 스크린도어나 안전발판이 없는 승강장은 어느 역 어느 방향인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 호선 승강장 정보나 역 좌표·출입구 데이터와는 역명·선명 같은 이름 매칭으로만 잇는다.
