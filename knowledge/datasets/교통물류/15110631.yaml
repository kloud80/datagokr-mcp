      - name: SIGNGU_CD
        required: false
        example: '30110'
        desc: 법률로 지정된 시도/시군구의 하부 행정구역 단위인 법정동에 부여된 행정표준코드인 법정동코드 중 시도 및 시군구를 구분하는 상위 5자리
