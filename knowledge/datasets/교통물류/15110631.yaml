        desc: 교량이 위치한 상세 소재지 지번주소
      - name: START_LATITUDE
        required: false
        example: '36.3174075'
        desc: 도로노선의 상행 방향 기준으로 시작되는 교량 시작점의 위도 좌표값 입력
