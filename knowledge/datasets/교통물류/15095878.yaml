summary_user: 대구광역시 도로망에서 운영되는 노상 주차면을 주차장명·도로명·위경도·구군·유무료 여부·주차급지와 함께 개별 위치(좌표) 단위로 담은 파일 데이터로, 2021년 기업매칭 지원사업으로 구축됐다. 시민이나 분석가가 '대구 특정 구·도로 주변에 무료 노상주차면이 어디에 있고 급지는 몇 급인가'를 확인하거나 노상주차 공간 배치를 분석하는 데 쓴다. 전역 조인 키는 없어 구군코드·구군명으로 대구 내 다른 구군 단위 자료와, 위경도로 전국주차장정보표준데이터 등 좌표 기반 자료와 공간적으로 붙여 쓴다.
description_portal: 대구광역시 내 도로망에서 운영되는 노상 주차면 정보를 제공하는 데이터입니다. 이 데이터는 2021년 기업매칭 지원사업을 통해 구축된 자료로, 주차장명, 도로명, 위경도, 구군명, 유무료 여부, 주차급지 등의 항목을 포함합니다. 이 데이터를 활용하면 대구광역시 내 주차 공간의 효율적인 운영 방안을 모색하여 도시 교통 관리와 주차 공간 최적화에 기여할 수 있으며, 시민들에게 보다 나은 주차 환경을 제공하는 데 기여할 수 있습니다. 또한, 주차 급지 정보는 주차 요금 및 이용 가능 시간 등을 파악하는 데 유용하며 도시 내 주차 문제 해결과 교통 흐름 개선을 위한 정책 수립에 활용될 수 있습니다.
