summary_user: 대전광역시 도로관리시스템에 등재된 방호울타리를 시설물 한 건씩 담은 원천 목록으로, 위치(WKT 지리정보), 행정읍면동, 도로구간번호, 방지책 종류, 울타리 재질, 연장을 담으며 범위는 대전시 전역이고 읍면동 단위로 구분된다. 도로 안전 담당자나 분석가가 어느 동·도로구간에 어떤 종류와 재질의 방호울타리가 얼마나 길게 설치돼 있는지 확인해 차량 이탈·보행자 사고 위험 구간과 비교하는 데 쓴다. 전역 조인 키는 없으므로 행정읍면동 이름이나 도로구간번호·관리번호를 같은 기관의 다른 도로시설물 자료와 맞춰 잇고, WKT 좌표로 공간 결합한다.
description_portal: 대전광역시_방호울타리(도로시설물) 현황 데이터는 대전광역시 도로관리시스템에 등재된 방호울타리의 위치, 종류, 설치 구간, 관리 상태 등 다양한 정보를 포함하고 있습니다. 이 데이터는 도로를 이용하는 시민의 안전 확보와 차량 이탈 사고 예방, 보행자 보호 등 교통 안전 정책에 중요한 역할을 합니다. 방호울타리 현황 자료는 도로시설물 관리와 유지보수, 도시 인프라 개선, 도로 확장 및 개량 사업 등 다양한 행정적 목적에 활용될 수 있도록 구성되어 있습니다. 2022년 공공데이터 기업 매칭 지원사업을 통해 청년 인턴이 직접 구축하고 정비한 데이터이며, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
