summary_user: 파주시 ITS와 연계돼 스마트폰 요금 정산이 되는 파주파킹(통합주차포털) 공영주차장을 주차장 한 곳당 한 행으로 담은 위치 목록 파일(csv 약 10KB)로, 주차장관리번호·이름·도로명/지번주소·위도·경도와 안내 사이트 주소를 담는다. 운전자나 앱 개발자가 '파주에서 파주파킹 앱으로 정산되는 공영주차장이 어디 있나'를 지도에 표시하거나 목적지 주변 주차장을 찾을 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 주차장관리번호나 주차장명·주소를 매칭해 전국주차장정보표준데이터(요금·면수 원장)와 붙이고, 좌표로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 경기도 파주시 지능형교통체계(ITS)와 연계된 관내 공영주차장의 주차 요금을 스마트폰으로 정산할 수 있는 파주파킹(파주시 통합주차포털) 주차장에 대한 공공데이터로, 기본식별자인 주차장관리번호, 주차장명, 도로명주소 및 지번주소, 위도와 경도 좌표, 주차장 운영 현황이나 이용안내 등 추가정보에 대한 접근성을 위한 사이트명과 홈페이지주소 등으로 구성되어 있습니다. 본 데이터셋은 사용자가 앱이나 내비게이션에서 빈 주차장을 실시간으로 확인하고 안내받는 스마트 주차 안내 시스템 구축, 지도 기반 UI에서 위도·경도 정보를 활용한 주차장 위치 표시, 공유 주차(공유형 주차장) 매칭 플랫폼, 주차 수요 예측 및 계획, 교통 흐름과 주차장 이용 정보를 결합하여 운전자에게 경로와 주차장 추천하기 등에 활용될 수 있습니다.
