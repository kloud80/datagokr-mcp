summary_user: 광주광역시 첨단교통관리시스템(ATMS)이 수집한 교통소통 정보로, 수집일시별·연계구간별 속도, 통행시간, 교통량, 점유율, 혼잡도 수준, 교통운영상태를 담은 CSV 파일(약 3MB)입니다. 교통 분석가나 시민이 광주 시내 어느 구간이 어느 시간대에 상습적으로 막히는지를 따질 때 쓰며, 이력을 쌓으면 정체 분석의 기초 자료가 됩니다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 다른 데이터와는 연계번호를 같은 기관의 링크·구간 코드와 맞추거나 이름으로 매핑해서만 잇습니다.
