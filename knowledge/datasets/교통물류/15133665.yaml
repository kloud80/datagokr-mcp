summary_user: 우체국물류지원단이 운영하는 물류사업소 3곳(동서울·안양·부평)의 지사, 소속 사업소, 주소, 우편번호, 전화번호를 사업소 1곳당 1행으로 담은 작은 CSV 파일(418바이트)이다. 우편물류 서비스 이용자가 '내 우편물을 처리하는 물류사업소는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 우체국 물류거점의 위치를 다른 물류시설 분포와 견줘 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 주소·우편번호를 지오코딩하거나 이름으로 매핑해 물류창고업 등록 원장 같은 물류시설 데이터와 맞춰 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 주소·이름 매핑으로만 연결할 수 있다. 좌표 필드가 없어 지도에 표시하려면 주소를 따로 변환해야 한다. 3개 사업소만 담고 있어 면적·처리물량 같은 시설 규모나 전국 물류센터 현황은 이 데이터로 알 수 없다.
