description_portal: 우체국물류지원단에서는 운영중인 3개 물류사업소(동서울물류사업소, 안양물류사업소, 부평물류사업소)의 위치정보를 제공하고 있습니다. 제공되는 데이터의 항목으로는 물류사업소의 지사, 사업소(소속부서), 사업소명, 주소, 우편번호, 전화번호로 구성되어 있습니다. 해당 데이터를 통해 물류사업소 관련 기관은 주소 및 전화번호 확인 통해 교통 접근성, 인근지역 인프라 분석을 통한 신규 물류사업소의 입지 선정에 대한 의사결정에 활용 할 수 있으며, 또한 우편물류 서비스 이용 고객은 해당되는 우편물 종적 확인 및 문의 등에 활용할 수 있습니다.
