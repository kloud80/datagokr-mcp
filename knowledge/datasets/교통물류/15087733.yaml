description_portal: 한국교통안전공단은 안전한 저고도 운항환경 조성을 위해 항공장애 표시등 및 주간표지 설치 현황을 검사하고 있습니다.본 데이터는 해당 시설물의 설치 위치에 따라 권역(지역)별 분류 및 각 시설의 장애물 종류, 지면과 수면 기준 높이, 장애물 제한구역 해당 여부 등의 항목으로 구성됩니다.장애물의 종류에는 가공선, 케이블, 송전탑, 풍력터빈, 굴뚝, 철탑, 기타 등이 있습니다.이를 통해 공역 내 항공장애물(장애등, 주간표지 등) 분포와 특성을 파악하고, 안전기준에 따른 적절한 조치를 위한 기초 자료로 활용됩니다.
