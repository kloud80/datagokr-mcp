summary_user: 대전시 버스정보시스템의 노선별 실시간 버스 위치와 운행 정보를 조회하는 API로, 대전광역시 범위의 건별 실시간 응답을 담는다. 대전 시민이나 앱 개발자가 '이 노선 버스가 지금 어디쯤 오고 있나'를 확인하거나, 분석가가 노선별 운행 현황을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 필수 파라미터인 노선 ID(busRouteId)를 대전 버스 노선 정보 데이터에서 먼저 받아 넘기는 방식으로 이어 쓴다.
limits: 노선 ID(busRouteId)가 없으면 호출할 수 없어 노선 정보 데이터를 먼저 조회해야 하며, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 개발계정은 하루 100회로 호출이 제한된다.
