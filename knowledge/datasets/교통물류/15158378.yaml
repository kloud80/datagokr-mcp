description_portal: 광주광역시 주요 교차로인 운암사거리, 동운고가사거리, 광천사거리, 농성광장 등 4개 교차로를 대상으로 시간대별 교통량 조사를 실시하였다. 본 조사는 각 교차로의 교통 흐름 및 특성을 파악하기 위하여 조사 위치별 차량 통행량, 시간대별 교통량, 평균 주행속도, 좌회전·우회전·직진 등 방향별 차량 통행량을 세부적으로 조사하였다. 또한 교통량 변동 특성을 보다 체계적으로 분석하기 위하여 1시간 단위로 구분하여 교통량을 계측하였으며, 이를 통해 시간대별 교통 집중 현상과 교차로 운영 특성을 종합적으로 파악할 수 있도록 하였다. 이러한 기초 교통자료는 향후 교통운영 개선 및 교통정책 수립을 위한 기초자료로 활용될 수 있도록 정확하고 체계적으로 분석하였다.
