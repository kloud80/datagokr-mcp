description_portal: '수출입 물류 공공·민간 데이터 공유 플랫폼에서 제공 중인 선사 제약 정보입니다.1. 데이터 개요: 국제 해사기구에서 발행하는 국제 해상 위험물 규정을 선사의 선박 서비스 노선에 적용한 내역 정보입니다.2. 데이터 내역: 아이엠디지선사제약순번, 아이엠디지개정번호, 아이엠디지유엔번호, 등급코드, 노선코드 등으로 구성되어 있습니다.3. 기타사항: 플랫폼 이용 선사가 직접 입력한 데이터입니다.  - D열 설명:  국제해상위험물규칙 개정번호로써 개정판 번호 - 발효연도 뒷 두 자리로 구성됨 예)38-16 → 제38차 개정판, 2016년 발효   - E열 설명:  위험물질별 고유 식별번호를 나타냄4. 유의사항: 각 선사 담당자의 판단에 따라 적용 코드를 부여한 데이터로서 공신력이 있지 않으니 활용 시 참고하여 주시기 바랍니다.'
