summary_user: 서울교통공사 1~8호선의 역별·월별 장애인 승하차인원을 승차·하차 구분해 담은 집계 파일(csv, 약 26만 바이트)로, 장애인·동반무임·생활보호자 권종을 합산한 인원이다. 교통약자 정책 담당자나 분석가가 어느 역에서 장애인 이용이 많아 엘리베이터·편의시설 확충이 우선 필요한지 파악하는 데 쓴다. 전역 공통 조인 키는 없어, 고유역번호(외부역코드)나 역명·호선을 매핑해 같은 기관의 역별 승하차·시설 데이터와 연결한다.
description_portal: 서울교통공사  1-8호선 역별 월별 장애인 승하차인원 정보입니다. 호선, 역번호, 역이름, 승하차 구분, 월별 장애인 승하차인원 정보로 데이터가 구성되어 있습니다. 연간 데이터로 2025년 12월 데이터까지 업데이트 합니다. 장애인 승하차인원의 산정은 장애인 권종, 동반무임 권종, 생활보호자 권종의 합계로 산정합니다. 승차인원은 해당역에서 개표를 하고 들어간 인원을 의미하며, 하차인원은 해당역에서 집표를 하고 나간 인원을 의미합니다. 또한, 1호선의 경우에 서울교통공사 구간은 서울역부터 청량리이며 나머지 구간은 한국철도공사 관할입니다. 4호선의 경우 불암산부터 남태령까지가 서울교통공사 구간이며 8호선의 경우 암사역사공원역까지 입니다. 또한, 7호선의 경우 까치울과 부평구청구간 사이는 22년 인천교통공사로 이관되었습니다.
