summary_user: 수도권 7호선 도시광역철도역에 설치된 전동휠체어 급속충전기를 역별로 담은 파일로, 운영기관·선명·역명·지상지하 구분·역층·상세위치·충전설비 수·전화번호가 들어 있습니다(약 2.7KB CSV). 전동휠체어 이용 장애인이나 보호자가 '7호선 어느 역 몇 층 어디에 충전기가 있고 몇 대인가'를 확인할 때, 또는 교통약자 편의시설 분포를 정리하는 분석가가 노선 단위 현황을 볼 때 쓴다. 전역 조인 키나 역 코드가 없어 다른 노선의 충전설비 파일이나 역 정보 데이터와는 역명·선명 문자열을 맞춰 이어 써야 한다.
