summary_user: 2019년 5월 기준 대구광역시에서 운행하는 시내버스 노선 전체를 노선 한 건당 한 행으로 담은 CSV 목록으로, 노선번호·유형·종류·운행업체·기점·종점·정류장수 등이 들어 있다. 분석가나 시민이 '대구에서 어느 업체가 몇 개 노선을 운행하고, 노선별 기점·종점과 정류장 수는 어떤가'를 파악하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관의 노선 ID(노선아이디)나 노선번호를 매개로 대구 버스정보(BIS)의 정류장·도착 데이터와 이어 쓴다.
description_portal: 2019년 5월 기준 대구광역시 내에 운행 중인 시내버스 노선 전체 목록파일입니다. 노선번호, 유형, 종류, 운행업체, 분리노선, 노선ID,  기점, 종점, 정류장수 등의 내용이 포함된 CSV 파일형식의 자료입니다. 이 파일은 대구시내버스의 운행 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 각 노선별 세부 정보와 운행 경로를 체계적으로 확인할 수 있습니다. 추가적으로 궁금하신 사항이나 의견이 있으시면 대구광역시 교통정보운영과 교통운영팀(☎053-803-6861)으로 연락주시기 바랍니다.
