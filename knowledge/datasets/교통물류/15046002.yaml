summary_user: 운수종사자관리시스템에 등록된 버스·택시·화물 운수종사자 수를 연도별·업종별로 근속연수 구간(1년 미만부터 20년 이상까지 1년 단위)에 따라 집계한 전국 단위 통계 파일이다. 교통안전 분석가나 정책 담당자가 "택시 운전자 중 근속 1~2년 차 신규 인력 비중은 버스·화물과 비교해 어떻게 달라졌나" 같은 질문에 쓴다. 전역 조인 키가 없어 같은 기관의 다른 운수종사자 통계(연령별·사고 이력 등)와 연도·업종 이름을 맞춰 이어 쓴다.
description_portal: '운수종사자관리시템은 여객자동차 운수사업법 및 화물자동차 운수사업법에 따라 버스, 택시, 화물자동차를 운전하는 운수종사자의 종사자격 등을 관리하는 시스템 입니다.관리하고 있는 모든 데이터는 개인정보이므로, 데이터를 가공하여 통계데이터를 개방하였습니다.  * 관리항목 : 운수종사자 경력사항, 교통사고 및 법규위반 이력, 운전적성정밀검사, 운전면허, 자격증 정보, 교육현황정보해당 데이터는 운수종사자관리시스템에 등록된 운수종사자의 연도별로 1년에서 20이상 운수종사자의  근속연수별, 업종별( 버스, 택시, 화물) 현황을 항목별로 가공하여 제공하는 정보 입니다.'
