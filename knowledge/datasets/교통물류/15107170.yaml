summary_user: 행정안전 통계연보에 수록된 유형별 전국 도로 길이 통계로, 도로 유형별 총연장·미개통 연장(km)과 총연장·포장도·비포장도 구성비를 전국 단위 집계로 담는다. 분석가나 정책 담당자가 '고속국도·국도·지방도 등 도로 유형별로 전국 도로가 얼마나 길고 포장률은 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로 유형 이름 매핑이나 같은 기관(행정안전부) 통계연보 항목끼리만 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '유형별 전국 도로 길이'으로, 도로, 총연장 구성비, 포장도 구성비, 비포장도 구성비, 총연장 연장(km), 미개통 연장(km) 등 유형별 전국 도로 길이 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
