summary_user: 진주대로 위 차번인식 CCTV 지점별로 하루 교통량을 날짜·장소·주소·위경도와 함께 담은 지점·일 단위 집계 파일로, 포털 설명상 2026년 4월 1일부터 6월 29일까지 수집분이다. 진주시 교통 분석가나 상권·입지를 검토하는 사업자가 '진주대로의 어느 지점에 하루 차량이 얼마나 지나가는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 같은 진주시 자료와 지점명으로 맞춰 이어 쓴다.
description_portal: 2026년 4월 1일부터 2026년 6월 29일까지 수집된 1일 교통량 자료를 제공합니다. 제공 항목은 수집일자, CCTV 위치, 주소, 좌표, 1일 교통량 값으로 구성되어 있으며, 차번인식카메라를 통해 수집된 데이터를 기반으로 합니다. 해당 자료는 교통 흐름 분석, 정책 수립 및 연구 등에 활용할 수 있습니다. 다만, 차번인식카메라의 특성상 강우, 안개, 적설 등 기상 여건이나 현장 환경, 장비 운영 상태 등의 영향으로 일부 날짜 또는 지점의 데이터 정확도와 수집률이 저하될 수 있으므로 활용 시 참고하시기 바랍니다. 또한, 자료에 대한 이해를 돕기 위한 샘플 데이터는 추가 요청 시 별도로 제공 가능합니다.
