summary_user: SRT 고속철도 이용객 중 만6세 미만 유아와 만6세 이상 만13세 미만 어린이의 이용객 수를 연도별 행, 1~12월 열 형태로 담은 전국 단위 집계 자료이며 단위는 천명이다. 철도·관광 분석가가 SRT 어린이·유아 이용이 방학철이나 연휴가 있는 달에 얼마나 늘어나는지, 연도별로 어떻게 변해 왔는지 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·월을 기준으로 맞추거나 같은 에스알의 다른 월별 이용객 통계와 나란히 놓고 비교하는 식으로만 이어 쓴다.
description_portal: 1. 고속철도 SRT 전체 이용객 중에서 만6세미만의 유아와 만6세이상에서 만13세미만 어린이를 대상으로 이용객 수를 별도로 구분하여 해당 대상자에 대한 이용객 수를 연간으로 구분하여 설명하는 자료이며 단위는 천명입니다.2. 연도별 월별 어린이및유아 이용객수를 확인하실 수 있습니다.3. 데이터 내 0으로 적힌 수치는 "데이터 없음"을 안내드립니다.4. 2016년 12월 어린이및유아 이용객수는 38천명입니다 (단위:천명)* 해당 데이터는 연도별 주기성 데이터입니다.* 2025년 6월 말 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.
