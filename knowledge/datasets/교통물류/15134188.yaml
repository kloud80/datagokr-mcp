description_portal: 세종특별자치시 공공자전거 어울링의 이용건수에 대한 데이터입니다. 연도별로  구분하였으며, 2025년 6월 30일 기준입니다. 세종도시교통공사는 세종특별자치시에서 공공자전거 사업을 위탁받아 언제 어디서든 쉽게 대여하고 편리하게 반납하는 자전거 대중교통서비스를 제공하고, 관련 시설을 관리하고 있습니다. 어울링은 원하는 곳에서 쉽게 대여하고 사용 후 가까운 곳에 편리하게 반납하는 자전거를 이용한 대중교통으로, 평일엔 출퇴근용으로 사용하고, 야간 및 휴일에는 호수공원 등에서 레저용으로 사용 할 수 있는 창조적인 녹색교통수단입니다. 어울링은 도로에 설치되어 있는 일반자전거 거치대를 가상의 대여소로 지정하여 일반자전거 거치대에서 대여 반납이 가능한 것이 가장 큰 특징입니다. 또한 전국 최초로 IoT모듈을 장착하여 무인정보단말기 없이 스마트폰으로 자전거에 부착된 QR코드를 스캔하여 간편하고 편리한 이용이 가능합니다. 연도별 어울링 이용건수를 정리하였으며, 세부 이용데이터가 필요하신 경우, 세종도시교통공사에서 등록한 공공자전거(어울링) 이용 현황 데이터를 참조하시기 바랍니다.
