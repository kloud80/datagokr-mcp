summary_user: 경찰이 조사·처리한 인적 피해 교통사고를 사고유형(차대사람·차대차 등 대·중·소분류)과 도로종류(고속국도·일반국도 등)별로 묶어 사고건수·사망자수·중상자수·경상자수·부상신고자수를 담은 전국 단위 집계 통계 파일(CSV 약 7KB)이다. 교통안전 분석가나 도로 관리 담당자가 '고속국도에서는 어떤 유형의 사고가 사망자를 많이 내는가'처럼 도로 종류와 사고 유형에 따른 피해 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 교통사고 통계와는 사고유형·도로종류 명칭을 맞춰서만 이어 쓰며, 지역 구분이 없는 비공간 집계라 표준노드링크 같은 도로망 공간 데이터와 직접 연결되지 않는다.
limits: 전국 합계만 담은 비공간 집계라 시도·시군구별이나 개별 도로 구간(링크) 단위 분석에는 쓰지 못한다. 다른 데이터와 연결할 코드형 조인 키가 없어 사고유형·도로종류 이름 매핑에 의존해야 한다.
