summary_user: 서울지하철 운행 중 생긴 열차 지연·사고·역 주변 시위로 인한 무정차·시간표 변경 같은 이례 상황을 알림 한 건 단위로 담으며, 알림 제목·내용·구분, 대상 호선과 역 목록, 상하행, 무정차 여부, 이례 상황 시작·종료 일시를 제공한다. 이용자나 서비스 개발자가 '지금 내가 탈 호선에 지연이나 무정차 통과가 있는가'를 확인하는 운행 상황 안내·실시간 알림에 쓴다. 전역 조인 키는 없고, 쉼표로 나열된 호선명·역코드 목록(stnSctnCdLst)을 풀어 같은 기관의 역 정보나 도착 정보와 이름·코드로 맞춰 잇는다.
description_portal: 서울교통공사 지하철 알림정보 API는 서울지하철 운행 중 발생하는 열차 지연과 각종 사고 및 역주변 시위 등 혼잡으로 인한 무정차 안내는 물론 열차 시간표 변경 등 다양한 이례 상황에 대한 공지사항 메시지를 제공하는 API입니다. 또타 앱서비스를 통해 안내되는 공지사항 컨텐츠 데이터를 기반으로 알림 제목, 알림 내용, 알림구분코드, 이례 상황 시작 일시, 종료 일시 등의 정보를 개방하며, 수시로 갱신되는 정보를 Rest API 방식으로 제공합니다. 열차 운행 상황 안내 서비스 또는 실시간 알림 서비스 등에 활용될 수 있습니다. 데이터는 매 1분마다 갱신됩니다.
