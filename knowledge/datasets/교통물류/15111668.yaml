summary_user: 경기도 성남시가 보행자 우선도로(후보지)로 관리하는 구간을 구간 하나당 한 건씩 담고, 각 구간의 시작점·종료점 좌표, 연장거리, 도로 최소폭, 일방통행 여부, 이미지명을 제공한다. 주민이나 교통·도시계획 분석가가 성남시 생활권 이면도로나 학교·시장 주변 중 어느 구간이 보행자 우선도로 후보인지, 그 길이와 폭은 얼마인지 확인할 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 시작·종료점 위경도를 공간 매칭하거나, 시도·시군구 이름 또는 도로명으로 맞춰 어린이보호구역·단속카메라 같은 보행안전 데이터와 이어 쓴다.
description_portal: 경기도 성남시 보행자 우선도로  위치데이터를 제공합니다.본 데이터는 보행자 우선도로 시작점, 보행자 우선도로 종료점, 연장거리, 도로의 최소폭, 일방통행적용여부, 이미지명  등으로 구성되어있습니다. 도로 공간 내에서 보행자의 안전과 통행권을 우선적으로 보장하기 위해 지정된 구간에 대한 정보를 체계적으로 수록한 자료입니다. 이 데이터는 주로 생활권 이면도로, 어린이보호구역, 전통시장 주변, 학교 및 복지시설 인근 등 차량과 보행자가 혼재하는 지역에서 차량 속도 저감, 보행 공간 확보, 교통사고 예방을 목적으로 수집 및 관리됩니다.
