summary_user: 부산광역시 교통정보서비스센터와 연계된 유관기관이 수집한 도로 소통정보를 링크(도로 구간) 단위 건별로 담으며, 수집일시·도로명·시점·종점·수집원과 함께 속도와 교통량을 제공한다. 교통 분석가나 내비게이션 사업자가 "지금 부산 특정 도로 구간의 속도와 교통량은 얼마인가"를 확인하는 데 쓰고, 이력을 쌓으면 상습 정체 구간 분석의 원장으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 링크ID(lkId)나 도로명·시점·종점 이름을 매핑하거나 부산광역시의 다른 교통 데이터와 같은 기관 코드 기준으로만 연결한다.
description_portal: '본 데이터는 부산광역시 교통정보서비스센터와 연계된 유관기관에서 제공하는 도로 소통정보입니다.제공되는 주요 항목은 수집일시, 링크ID, 도로명, 시점명, 종점명, 수집원명, 속도, 교통량 등으로, 센터 고유 수집 데이터 외에도 기관 간 협력체계를 통해 확보된 교통정보를 포함하고 있습니다.이 데이터는 부산시 전역의 교통흐름 현황을 보다 폭넓게 파악할 수 있도록 지원합니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>기관 간 연계 교통정보 융합을 통한 종합 교통상황 관리도로 구간별 실시간 소통속도·교통량 분석돌발상황 대응 및 혼잡 관리 체계 강화민간 교통정보 서비스(내비게이션·지도 등)와 연계 활용교통 빅데이터 기반 정책 수립 및 연구 지원'
