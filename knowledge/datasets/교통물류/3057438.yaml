summary_user: 부산 도시철도의 열차 운행 계획 대비 실적을 월별·호선별로 집계한 파일로, 계획·실적 운행횟수와 계획·실적 운행거리(킬로미터)를 담는다(CSV 약 1.9KB 규모). 시민이나 분석가가 '부산 지하철 각 호선이 이번 달 계획한 운행횟수와 거리를 실제로 얼마나 채웠는가'를 확인하거나, 운행 계획 이행률 점검·성과 평가에 쓴다. 전역 조인 키가 없어 다른 데이터와는 호선명·월을 기준으로 이름을 맞춰 붙여야 하며, 부산교통공사의 승하차·혼잡 등 같은 기관 자료와 호선 단위로 이어 쓰는 방식이 현실적이다.
