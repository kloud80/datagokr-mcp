description_portal: '· 조사기간 : 2020. 09. 09. ~ 2020. 12. 31.· 조사방식 : 전북특별자치도 어린이보호구역 정보 수집· 조사대상 : 전북특별자치도 초등학교 424개소 안전정보 14종, 교통이동량과 주정차량 정보(로드뷰의 경우 조사대상 제외)· 구축업체 : (주)업데이터· 참고사항 : 2020년 공공데이터 뉴딜 기업매칭 지원사업을 통하여 실측하여 조사한 것으로 실제와 차이가 있을 수 있으며, 해당 데이터의 법적 효력은 없습니다.·  기타유의사항 :  공간데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 하며,  SHP파일 이용시 언어 설정을 UTF8로 설정하여야 한글 데이터가 깨지는 현상을 방지할 수 있습니다.이 데이터는 전북특별자치도 내 초등학교 주변 어린이보호구역의 안전시설 및 교통환경 정보를 공간 데이터 형태로 수록한 자료입니다. 과속단속카메라, 과속방지턱, 교차로, 실폭도로, 다용도 CCTV, 도로 적색표면, 제한속도 표지판, 횡단보도 등 어린이 보호를 위한 다양한 교통안전 인프라의 위치와 특성을 포함하고 있습니다. 또한, 어린이보호구역 내 주정차 및 교통이동량 조사 데이터와 거주인구 정보도 함께 제공되어 통합적인 분석이 가능합니다. 이 데이터는 보행자 중심의 안전한 통학환경 조성, 교통사고 예방정책 수립, 안전시설 설치 우선순위 결정 등에 활용될 수 있는 중요한 자료입니다.'
