description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구교통공사에서 관리하는 도시철도 유실물 처리 현황을 제공합니다. 본 자료는 도시철도 이용 중 접수된 유실물의 연도별 발생 현황과 처리 결과를 포함하고 있으며, 유실물 종류, 접수 건수, 처리 건수, 관할 경찰서 제출 건수, 현금 유실물의 건수 및 금액 등으로 구성되어 있습니다. 이를 통해 도시철도 이용 중 발생하는 유실물의 유형별 특성과 접수·보관·처리 현황을 체계적으로 파악할 수 있으며, 시민의 분실물 관리 편의 향상과 공공자산의 효율적인 관리, 유실물 처리 체계 개선을 위한 기초자료로 활용될 수 있습니다. 또한 유실물 발생 추이와 유형별 현황을 분석하여 고객서비스 품질 향상, 역사 운영 개선, 시민 편의 증진 및 데이터 기반 유실물 관리 정책 수립을 위한 행정·연구 분야의 기초자료로 활용할 수 있습니다. 본 데이터는 반기마다 정기적으로 갱신됩니다.'
