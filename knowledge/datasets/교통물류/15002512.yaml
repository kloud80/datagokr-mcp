summary_user: 대구 도시철도에서 접수된 유실물을 연도·호선(센터)·처리구분별로 집계한 파일로, 합계 건수와 개수, 현금 건수·금액, 그리고 귀금속·전자제품·가방·지갑 등 물품 종류별 수량을 담는다. 시민이나 분석가가 "대구 지하철에서 어떤 물건이 가장 많이 분실되고, 그중 얼마나 주인에게 돌아가거나 경찰서로 넘겨지는가"를 연도별로 살펴볼 때 쓴다. 전역 조인 키는 없으므로, 다른 대구교통공사 자료와는 연도와 호선 이름을 맞춰서만 이을 수 있다.
limits: 건별 원천이 아닌 연도별 집계라서 개별 유실물 조회나 분실물 찾기에는 쓸 수 없다. 표준 코드 같은 공통 조인 키가 없으므로, 다른 데이터와 연결하려면 호선명이나 연도를 직접 매핑해야 한다.
