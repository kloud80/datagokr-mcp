description_portal: 대중교통 이용 확대와 교통 약자의 이동권 보장을 위한 택시 서비스의 중요성이 증대되면서, 지역 주민과 관광객의 교통 편의성 향상을 위한 체계적인 택시 운송 서비스 관리가 중요한 교통정책 과제로 대두되고 있습니다. 고령화 사회 진입과 함께 고령자와 장애인 등 교통 약자들의 안전하고 편리한 교통 서비스 이용을 위한 택시의 역할이 확대되고 있으며, 여객자동차 운수사업법에 따른 적정한 택시업체 관리와 서비스 품질 향상을 통한 승객 만족도 제고가 요구되고 있습니다. 관광 활성화와 지역 경제 발전을 위한 관광객 교통 편의 서비스 개선과 택시를 활용한 관광 서비스 다양화의 필요성이 증가하고 있으며, 택시 요금 투명성 확보와 서비스 개선을 통한 택시 이용자들의 권익 보호가 중요해지고 있습니다. 또한 콜택시 서비스와 디지털 플랫폼을 활용한 택시 호출 시스템 개선을 통한 이용 편의성 향상이 요구되고 있으며, 택시 운송 정책 수립과 교통 서비스 개선을 위한 업체 현황 파악의 필요성이 증대되고 있어, 충청남도 보령시는 관내 5개 택시업체의 업종, 보유 차량 수, 위치, 연락처 등 시민과 관광객의 교통 이용 편의와 택시 운송 정책 수립에 필요한 종합적인 택시업체 현황 정보를 제공하고 있습니다.
