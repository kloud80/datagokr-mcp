summary_user: 서울시 건물·시설에 설치된 보행자 출입구를 출입구 하나당 한 행으로 담은 건별 자료로, 위도·경도, 출입구 구분과 진입·진출 방향, 자전거 출입 가능 여부, 경사로·계단·장애인 편의 설비·점자블록 여부, 출입구 높이·폭, 평일·주말·공휴일 허용 시간, 국가지점번호, 원경 이미지 파일명을 포함한다. 교통약자 이동 지원 서비스 개발자나 도시계획 분석가가 '이 시설에 휠체어로 드나들 수 있는 출입구가 어디이며 주말에도 열려 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시설명(FCLT_NM)·도로명주소 식별자 같은 이름·코드 매핑이나 좌표 기반 근접 매칭으로 이어 쓴다.
description_portal: 이 데이터는 서울시 보행자 출입구 정보로, 건물 및 시설에 설치된 보행자 출입구의 위치와 특성을 상세히 기록한 자료입니다. 주요 항목에는 시설 아이디와 명칭, 출입구 아이디, 위도·경도 좌표, 출입구 구분(보행·자전거 겸용 등), 출입 방향(진입·진출), 자전거 출입 가능 여부, 출입구 높이 및 구조물 정보, 평일·주말·공휴일 허용 시간, 국가지점번호, 데이터 기준일자, 정면 및 좌·우측 원경 이미지 파일명이 포함되어 있습니다. 이를 통해 서울시 내 보행자 이동 동선을 분석하고, 안전한 보행 환경 조성을 위한 기반 자료로 활용할 수 있습니다. 또한 교통약자 이동 편의성 확보, 시설 관리, 도시계획 및 보행자 중심 정책 수립에 중요한 역할을 합니다.
