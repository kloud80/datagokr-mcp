summary_user: 전국 고속도로 VMS(도로 전광판)에 표출된 메시지를 유형별로 묶어 전광판 ID·노선명·노선번호·방향과 함께 건별로 담은 외부 OpenAPI 데이터다. 교통정보 서비스 사업자나 분석가가 "지금 어느 고속도로 구간 전광판에 사고·공사·기상 안내가 떠 있는가"를 확인하거나 유형별 표출 이력을 모을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선번호·노선명(routeNo) 같은 이름·코드 매핑이나 한국도로공사의 다른 데이터의 기관 코드로만 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 VMS(Variable Message Sign)의 메시지를 유형별로 일괄 조회할 수 있는 OpenAPI이다.VMS는 교통 상황, 기상 정보, 돌발 상황, 공사 안내 등 다양한 정보를 실시간으로 운전자에게 전달하는 전광판 장치이다.해당 API는 표출된 메시지를 유형별로 분류하여 제공하며, 표출 시간, 메시지 ID, 표출 위치, 관리 기관 등의 정보를 포함한다.데이터는 XML 및 JSON 형식으로 제공되며, 도로 운영 시스템, 교통정보 플랫폼, 정책 수립 도구 등과 연계해 활용 가능하다.API는 일괄 조회 방식으로 구성되어 있어 대량 데이터 수집과 표출 이력 관리에 용이하다.또한 메시지 유형별 통계 분석, 예측 모델 개발 등 민간과 공공의 다양한 활용 수요를 충족할 수 있다.API 이용을 위해 인증키가 필요하며, 상세 요청 형식과 응답 구조는 명세서를 통해 확인할 수 있다.
