summary_user: 부산교통공사 도시철도의 운임을 환승 방법과 이용 대상별로 정리한 소규모 요금표 파일로, 도시철도 1구간 운임·타 교통수단 운임·총운임(원)과 비고를 담는다. 시민이나 서비스 개발자가 "부산 지하철에서 일반버스로 환승하면 청소년은 총 얼마를 내나" 같은 요금 조회에 쓰며, 분석용이 아니라 서비스용 조회 자료다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 환승방법·대상 같은 이름 매핑이나 같은 기관 자료로만 연결한다.
