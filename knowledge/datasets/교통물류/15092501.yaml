description_portal: '데이터 개요연도별로 말소된 항공기에 대한 정보를 제공하는 데이터입니다. 해당 데이터는 국내에서 등록된 항공기 가운데 임차권 말소, 임대 만료, 해체 등의 사유로 국적 등록이 말소된 항공기에 대한 기록을 포함하며, 항공기별 기종, 등록기호, 일련번호, 말소일자 및 말소사유 등을 항공사 기준으로 분류하여 제공합니다.데이터 제공 항목순번: 각 데이터 행의 고유번호기종: 말소된 항공기의 제조 기종 (예: A330-300, B737-800)등록기호: 항공기의 등록번호 (예: HL7736)제작일련번호: 항공기 제작사에서 부여한 고유 일련번호말소일자: 해당 항공기의 등록이 말소된 날짜 (예: 25.01.07은 2025년 1월 7일 의미)말소사유: 등록이 말소된 사유 (예: 임차권말소등록에 따른 국적소멸, 임대만료, 항공기해체 등)항공사: 해당 항공기의 말소 전 운용 항공사 (예: 아시아나항공, 티웨이항공)활용 안내항공정책 수립 및 항공산업 통계 분석에 유용항공기 수명 관리, 기체 교체 주기, 리스업계 동향 파악 등에 활용 가능국적기 등록 현황과 운영 트렌드를 반영하는 지표로 활용됨데이터 해석 시 유의사항말소일자는 실제 항공기 운용 중단일과 차이가 있을 수 있으며, 행정등록 기준임일부 말소사유는 복합적 사유가 포함될 수 있으나 단일 항목으로 분류됨제공되는 연도 및 범위는 국토교통부 데이터셋 갱신 주기에 따라 달라질 수 있음h데이터 구성 예시순번기종등록기호제작일련번호말소일자말소사유항공사1A330-300HL7736064025.01.07임차권말소등록에 따른 국적소멸아시아나항공2B737-800HL82943279825.01.16임대만료티웨이항공3B777-200HL75752844525.01.22항공기해체대한항공'
