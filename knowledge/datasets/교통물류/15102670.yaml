summary_user: 인천교통공사가 운영하는 인천 1호선·2호선·7호선 인천·부천구간 역사에 설치된 무인민원발급기를 역별로 정리한 소규모 현황 파일(CSV 598바이트)로, 호선·역명·설치 위치(층·상세위치)·대수·운영 행정기관·전화번호를 담는다. 시민이 "가까운 지하철역 어디에서 주민등록등본 같은 민원서류를 뗄 수 있나"를 확인하거나, 지자체·분석가가 역사 내 생활편의시설 분포를 파악하는 데 쓴다. 전역 공통 조인 키는 없으므로 다른 역 정보나 승하차 데이터와는 호선·역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 인천교통공사에서 운영중인 도시철도 인천 1호선, 인천 2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준 역사에 설치된 무인민원발급기 현황 자료입니다.해당 데이터는 호선, 역명, 위치구분, 위치층, 상세위치, 시설수, 운영사, 전화번호 항목으로 구성되어있습니다.무인민원발급기는 인천1호선 2개역(박촌, 작전), 인천2호선 4개역(마전, 가정, 석남, 가재울), 7호선부천구간 4개역(상동, 신중동, 춘의, 부천종합운동장)에 총 10대가 운영 중에 있습니다.무인민원발급기의 운영사는 해당 역을 관할하는 자치구 행정기관입니다.
