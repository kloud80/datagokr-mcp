summary_user: 대전도시철도 각 역의 시간대별 승차·하차 인원을 날짜·역 단위로 담은 파일 데이터로, 2026-01-01부터 2026-08-31까지 10,692행이 확인됐다. 출퇴근 시간대에 어느 역이 붐비는지, 역별 수송 수요가 어떤지를 보려는 분석가나 시민이 쓴다. 역번호·역명 필드로 같은 기관 자료와 이름·코드 매핑을 거쳐 이어 쓰며, 전역에서 통하는 조인 키는 없다.
description_portal: 이 데이터는 대전도시철도 각 역의 시간대별 승차 및 하차 인원 수를 제공하는 서비스입니다.역별, 시간대별, 승하차 인원 정보를 통해 혼잡 시간대 분석이 가능합니다.데이터는 당해 연도 1월 1일부터 직전 월 말까지의 누적 통행량을 기준으로 하며,**열(column)**에는 역번호 및 역명이 나열되고, 각 역의 승차인원과 하차인원이 구분되어 있습니다.**행(row)**에는 03시부터 1시간 단위로 나뉜 시간대별 통행량이 표시되어 있어 하루 중 유동인구 분포를 파악할 수 있습니다.이 데이터는 출퇴근 시간대 분석, 혼잡도 예측, 역별 수송 수요 평가 등에 유용하게 활용될 수 있습니다.
