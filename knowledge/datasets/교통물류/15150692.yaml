summary_user: 국가교통정보센터가 제공하는 도로 본선 구간의 상세 정보로, 구간 식별자(MLSN_ID)별로 그 구간을 이루는 링크 순서와 링크 ID, 시도·시군구명, 등록·수정일시를 전국 단위로 담는다. 교통 분석가가 특정 본선 구간이 어떤 링크들로 이어지고 어느 시군구를 지나는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 교통 데이터와는 링크 ID나 시도·시군구 이름 매핑으로 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하는 정보입니다.
