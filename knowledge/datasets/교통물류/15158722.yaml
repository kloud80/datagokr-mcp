description_portal: 「출항정보」 데이터는 선박의 출항 이력을 기록한 자료로, 항만명(PRT_NM), 선박 호출부호(CALL_LETTER), 선박명(VSSL_NM), 출항연도(YR), 일련번호(SER_NO), 대리점(AGENT_NM), 구분(외항/내항), 출항일자(DEP_DT), 도착 예정지(DST_PRT_NM), 차항지(NXT_PRT_NM), 접안 위치 코드(BERTH_PLC_CODE), 시설명(FACIL_NM) 등 총 18개 항목으로 구성되어 있습니다.이 데이터는 선박의 출항 기록을 관리하는 데 활용되며, 선박 운항 이력 추적, 항만 운영 관리, 항차별 대리점 관리 및 접안 위치 파악 등 다양한 행정적·물류적 분석 자료가 됩니다. 특히 출항항만, 목적항만, 접안 시설명 등은 운항 경로 분석 및 항만 운영 효율성 검토에 중요한 기초 정보로 제공됩니다.
