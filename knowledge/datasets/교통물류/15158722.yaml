summary_user: 여수광양항만공사가 제공하는 선박 출항 이력 API로, 출항 건별로 항만명·호출부호·선박명·대리점·외항/내항 구분·출항일자·차항지·접안 위치 등 18개 항목을 담는다. 해운 물류 분석가나 대리점이 특정 선박이 언제 어느 접안 시설에서 출항해 어디로 향했는지 운항 경로를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 호출부호·선박명 같은 이름·코드 매핑이나 같은 기관(Port-MIS 계열) 코드로만 연결하며, 같은 기관의 입항정보 등과 묶어 항차를 추적한다.
limits: 호출 시 필수 파라미터인 호출부호(call_letter)·항만 코드(prt_at_code)·일련번호(ser_no)는 다른 데이터에서 먼저 받아 넘겨야 하므로 단독으로 전체 출항 목록을 조회하기 어렵다. 개발계정은 하루 1,000회로 제한된다.
