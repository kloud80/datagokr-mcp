summary_user: 해양수산부가 관리하는 전국 항만의 화물 선적·하역·운송·보관용 시설 장비를 장비 단위로 담은 현황 파일로, 관리청·설치 항만·시설장비명·장비구분·취급 화물 및 용도를 기록한다. 항만운영 기관이나 물류 분석가가 '특정 항만에 어떤 하역 장비가 어떤 화물용으로 배치돼 있는가'를 확인하고 장비 배치·유지보수·투자 우선순위를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 항만 시설·입출항·물류 데이터와는 항만 이름이나 관리청 이름을 맞춰 이어야 하며, 항만코드(UN/LOCODE·해수부 내부 코드)로 연결하려면 별도 매핑표가 필요하다.
