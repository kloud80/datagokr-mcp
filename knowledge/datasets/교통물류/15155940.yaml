summary_user: 경상남도 사천시 시내버스의 운행 이벤트를 노선·차량·배차순번·정류소 단위로 기록한 건별 파일로, 출발·도착 시각, 뒷문 서비스 시간, 개문주행 횟수, 정류장 체류시간, 평균·최대 속도, 어린이 현금승차 수를 담는다. 교통 분석가나 지자체 담당자가 '어느 노선·정류소에서 체류시간이 길어 배차가 지연되고 개문주행 같은 안전 위반이 잦은가'를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 노선아이디·정류소아이디를 같은 사천시의 노선·정류장 자료와 이름이나 코드로 맞춰야 이어 쓸 수 있다.
description_portal: '제시된 데이터 항목들은 버스 운행 중 발생한 세부 이벤트 및 승하차 통계를 기록한 데이터셋입니다. 이는 버스 회사의 운행 효율성, 안전성, 서비스 품질을 정밀하게 분석하고 개선하는 데 핵심적인 자료로 활용됩니다.이벤트일자와 출발시간: 특정 운행 행위(이벤트)가 발생한 날짜와 버스가 기점/종점 또는 정류소에서 출발한 시각을 기록합니다.노선아이디와 차량아이디: 각각 운행된 노선과 실제 운행에 투입된 버스 차량을 고유하게 식별합니다.배차순번: 해당 노선에서 하루 중 몇 번째 운행인지 순서를 나타내어, 배차 계획의 준수 여부를 확인합니다.출발구분 : 이벤트가 정류소 도착/출발인지, 혹은 종점에서 운행을 시작하는 이벤트인지를 구분하여 운행의 시작점을 명확히 합니다.정류소아이디: 해당 이벤트가 발생한 정류소의 고유 식별자입니다.뒷문서비스시간(초): 승객이 승하차를 위해 뒷문이 열려 있던 시간을 초 단위로 기록하여, 승객의 승하차 지연이나 서비스 효율성을 분석하는 데 사용됩니다.무정차횟수: 승객이 있음에도 정류장에 정차하지 않고 지나간 횟수를 기록하여, 서비스 불만 요인 및 운전자 준수 사항 위반 여부를 점검합니다.개문주행횟수: 버스 문이 열린 상태로 주행한 횟수를 기록하여, 안전 규정 준수 여부를 판단하는 핵심 안전 지표로 활용됩니다.정류장체류시간합계(초): 정류소에 정차해 있던 총 시간을 초 단위로 합산하여, 정체 유발 또는 배차 시간 지연의 원인을 분석합니다.평균속도와 최대속도: 운행 구간별 평균 운행 속도와 기록된 가장 빠른 속도를 나타내어, 과속 여부와 운행 효율성을 평가합니다.현금승차수-어린이: 승차 유형과 현금으로 결제한 어린이 승객 수를 기록하여, 정확한 운송 수입금 정산 및 연령별 이용 패턴을 분석합니다.데이터기준일자: 해당 데이터가 최종적으로 생성 또는 갱신된 날짜를 명시하여 자료의 신뢰성을 보장합니다.'
