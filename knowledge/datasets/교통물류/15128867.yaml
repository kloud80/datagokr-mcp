summary_user: 부산 영도구에 주사무소를 둔 화물자동차 운송주선 이사화물 업체를 업체 한 곳당 한 줄로 담은 목록 파일로, 상호·주소·우편번호·사무실 연락처·업종·화물 종류를 담는다. 영도구에서 이사를 앞둔 주민이 '구에 등록된 이사화물 주선업체가 어디이고 연락처가 무엇인가'를 확인하거나, 분석가가 지역별 이사업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 이름 매칭으로만 잇고, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: 부산광역시 영도구에 주사무소가 소재한 화물자동차운송주선 이사화물 업체 현황입니다.화물운송주선업에 등록하여 이사화물을 취급하는 업체 목록입니다.현재 2026년 6월 기준으로 총 6곳의 이사화물 업체가 영업 중에 있습니다.이사화물 업체의 업체명과 주사무소 주소를 비롯하여 우편번호, 연락처 등의 자료를 공개하였습니다.참고로 연락처는 개인 핸드폰 번호는 공개를 제외하고, 사무실 번호를 업데이트했습니다.이사화물 업체 관련 데이터는 1년 주기로 매년 업데이트하고 있습니다.현황 업무는 영도구청 도시안전국 교통과 자동차관리팀에서 담당하고 있습니다.
