summary_user: 오피넷이 게시하는 시군별 주유소 평균가격 중 경기도 시군 분을 시군·제품(휘발유·고급휘발유·경유·LPG 등)별 평균가격과 전일 대비 등락값으로 담은 집계 데이터다. 운전자나 분석가가 "오늘 우리 시군의 경유 평균가격이 인접 시군보다 비싼가, 어제보다 얼마나 올랐나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 시군구 단위 데이터와는 시군 코드(SIGUN_CD)나 시군명을 이름·코드 매핑해 붙여 쓴다.
description_portal: 오피넷(https://www.opinet.co.kr/user/custapi/custApiInfo.do) 에서 게시하고 있는 시군별 주유소 평균 가격 정보 중 경기도에 해당하는 데이터를 제공합니다.시군별 제품별 평균 가격 및 전일 대비 등락 값을 제공합니다.이 데이터는 경기도 내 각 시군별 주유소에서 판매되는 주요 유류 제품(B034, C004, D047, K015 등)의 평균가격과 전일 대비 등락값을 기록한 자료입니다. 주요 항목으로는 ‘시군명’, ‘제품구분’, ‘평균가격’, ‘전일대비 등락값’이 있으며, 지역별 연료 가격 비교, 에너지 시장 동향 분석, 유류세 변동 효과 파악 등 다양한 정책 및 연구 분석에 활용할 수 있습니다. 제품구분은 가솔린, 경유, LPG, 고급휘발유 등 다양한 연료유형을 나타내며, 등락값은 전일 가격 변화량을 수치로 제공하여 시계열 변화 분석에 유용합니다.특정 시군의 연료비 부담, 주유소 운영 전략, 공공 교통정책 수립 등의 데이터 기반 의사결정에 활용 가능합니다.
