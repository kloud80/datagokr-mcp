summary_user: 대구 도시철도 1·2·3호선 역사 엘리베이터의 고장을 건별로 담은 원천 이력 파일로, 호선·역명·호기, 고장 발생과 조치 완료 일시, 조치 소요시간, 고장 원인을 한 행에 기록한다(CSV 약 18KB). 교통약자 단체나 시설 분석가가 어느 역·어느 호기 엘리베이터가 자주 멈추고 복구에 얼마나 걸리는지, 주된 고장 원인이 무엇인지 따질 때 쓴다. 호선(urban_rail_line_no)과 엘리베이터 호기(daegu_metro_ev_no)가 조인 키라서, 같은 키를 가진 대구교통공사 엘리베이터 설비 현황이나 역별 승하차 데이터와 이어 붙여 설비 노후도·이용량 대비 고장 빈도를 볼 때 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 안전·보건관리 데이터로, 도시철도 1·2·3호선 전 역사에서 운영 중인 엘리베이터의 고장 이력 정보를 제공합니다.  데이터에는 역명, 장비명, 호기번호, 고장 발생 일시, 조치 완료 일시, 고장 처리 소요시간, 고장 원인 등의 주요 항목이 포함되어 있으며, 도시철도 시설물의 안전한 운영과 체계적인 유지관리를 위한 기초자료로 활용할 수 있습니다. 해당 데이터를 통해 엘리베이터 고장 발생 현황과 원인을 분석하여 고장 예방 및 효율적인 정비계획 수립에 활용할 수 있으며, 예지정비 시스템 구축과 유지보수 업무 개선에도 도움을 줄 수 있습니다. 또한 고장 처리 소요시간 분석을 통해 신속한 대응체계를 마련하고 시민 이용 서비스 품질 향상에도 기여할 수 있습니다.  매년 1회 갱신되는 이 데이터는 시민의 안전 확보와 교통약자의 이동 편의 증진을 위한 공공데이터로서, 도시철도 설비 운영의 투명성과 신뢰성을 높이는 데 기여하고 있습니다.'
