description_portal: 광양항을 이용하는 컨테이너선의 기항 현황(선사별 항차)데이터 입니다. 선사명, 선사코드, 국적 외국적 구분, 주당항차수, 공동운항항차수로 구성되어 있습니다. 소수점 입력이 불가하여 2주에 1번 입항건에 대하여 반올림하여 수량을 올립니다. 데이터는 연간 갱신됩니다.이 데이터는 선사별 항로 운영 현황을 보여줌으로써 국적선과 외국선의 경쟁력 비교, 공동운항 구조의 효과, 항만 내 항차 배분 현황을 분석하는 데 유용합니다. 특히 공동운항 포함 항차수가 실질적 물동량 처리에 큰 영향을 미치므로, 향후 항만 운영 정책과 협력 전략 수립의 중요한 기초 자료가 될 수 있습니다.
