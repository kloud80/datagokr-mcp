description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 선박 안전법에 따라 선박용 물건을 형식 승인을 받기 위해 시험기관에 의뢰하여 받은 시험결과를 관리하기 위해 수집된 데이터입니다.본 데이터의 주요 내용은 선박의 안전 운항과 관련 법규 준수를 위해, 선박에 탑재되는 물품들이 적합한 품질과 기준을 갖추고 있는지 확인하기 위해 시험받은 결과를 다루고 있으며, 성적서번호, 합격증번호, 신청일자, 신청 및 제조업체, 품명, 규격, 형식, 시험기관 등의 데이터로 이루어져 있습니다.선용품 시험 방법은 선박용 물건의 형식승인, 검사 및 시험 절차에 관한 규정을 따릅니다. 성능시험은 지정 시험 기관에서 실시하며, 제조자의 기술적 능력, 설비, 제조법, 품질 관리 등을 확인하는 공장심사를 포함합니다. 시험 기준 및 품목은 관련 법규 및 규정에 따라 정해집니다.선용품 시험방법의 주요 내용 안내1. 형식승인- 선용품 등을 제조하거나 수입하는 자는 형식승인을 받아야 합니다.- 지정 시험 기관에서 형식승인 시험을 신청해야 하며,  이때 필요한 서류를 제출해야 합니다.- 지정 시험 기고나은 제조자의 기술적 능력, 설비, 제조법, 품질 관리 등을 평가하는 공장심사를 실시합니다.- 성능시험은 관련 법규 및 규정에 따른 시험기준에 따라 진행됩니다.2. 검사 및 시험- 선박안전법 등 관련 법령에 따라 해운관청이 선용품에 대한 검사 및 시험을 실시합니다.- 선용품검사시험규정은 검사 및 시험 절차에 관한 사항을 규정합니다.- 검사 및 시험 수수료는 관련 규정에 따라 부과됩니다.3. 선용품 관리- 선용품은 일정 기준에 따라 관리되어야 하며, 보세공장에서 건조 중인 선박에 적재할 수 있습니다.- 세관장의 승인을 받아 보세운송을 통해 선용품을 운반할 수 있습니다.4. 시험 조사선 관리- 시험 조사선 관리 및 운영에 관한 사항은 별도의 규정에 따라 관리됩니다.- 시험 조사선은 선박의 안전 및 품질 관리를 위한 시험 및 조사를 수행합니다.
