summary_user: 천안시 시내버스를 노선 단위로 정리한 파일로, 노선번호별 운영 운수업체, 편도 기준 1회 운행거리(km)와 1일 운행횟수, 비고, 데이터기준일자를 담는다(csv 약 7KB). 분석가나 시 교통 담당자가 '어느 운수업체가 어떤 노선을 맡고, 노선별 운행거리·횟수로 본 서비스 규모가 얼마인가'를 확인하거나 노선 조정을 검토할 때 쓴다. 전역 조인 키가 없어 정류장·도착정보(TAGO·BIS) 같은 다른 버스 데이터와는 노선번호나 업체명을 이름으로 맞춰 이어 써야 한다.
limits: 표준 노선ID 같은 공통 키가 없으므로 다른 노선·정류장 데이터와의 연결은 노선번호·업체명 문자열 매칭에 의존하며 불일치가 생길 수 있다. 천안시 한 곳만 다루는 자료여서 정류장 위치나 실시간 운행 정보는 이 데이터로 알 수 없다.
