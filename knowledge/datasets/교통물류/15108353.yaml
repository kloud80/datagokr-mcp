summary_user: SRT의 운행일별·노선별 승차인원, 운행월별 노선별 승차거리, 월별 정차역별 승하차인원, 병합승차권 이용인원, 고객유형별 승차인원을 담는 집계 데이터로, 범위는 전국이며 REST API(JSON·XML)로 제공된다. 분석가나 지역 사업자가 '수서·동탄 등 특정 SRT 정차역의 월별 승하차인원이 어떻게 변하는가'처럼 역 주변 유동인구를 가늠하는 질문에 쓴다. 전역 조인 키는 없고, 출발·도착역 코드와 역명(DPT_STN_CD 등), 노선명, 운행연월·일자를 기준으로 다른 철도 승하차 데이터나 역 정보와 이름·코드 매핑으로 이어 쓴다.
description_portal: '1. 국민철도SR에서 제공하는 승객이동유형 데이터입니다. 2.  "운행일별 운행노선별 승차인원", "운행월별 운행노선별 승차거리", "운행월별 정차역별 승하차인원", "운행월별 운행노선별 병합승차권 이용인원", "운행월별 운행노선별 고객유형별 승차인원" 항목이 있습니다.* 데이터 포맷 : JSON +XML* 해당 데이터는 REST API로 제공됩니다. * 에스알은 해당 데이터를 무료로 제공드리고 있습니다. * 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.'
