description_portal: '해당 데이터는 전라남도 강진군에 등록된 일반화물 운송사업자 현황을 정리한 표입니다.각 업체별로 업체명, 면허종류, 보유 차량 수, 소재지 주소, 운영 여부가 제시되어 있으며, 대부분 ‘일반화물’ 면허로 운영되고 있다. 업체는 총 28개 이며, 차량 보유 규모는 최소 1대부터 최대 51대까지 다양하며, 사업자 규모 차이가 뚜렷하게 나타난다. 모든 업체가 ‘운영여부: 여’로 표시되어 있어 현재 영업 중임을 의미한다. 이 데이터는 지역 내 운송업체 분포 파악, 물류 인프라 분석, 사업자 규모 비교 등에 활용될 수 있다.'
