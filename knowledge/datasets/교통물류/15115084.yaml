summary_user: 전라남도 강진군에 등록된 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 파일로, 업체명·면허종류·차량대수·주소·운영여부가 들어 있으며 범위는 강진군 한 곳이다. 강진군에서 화물 운송을 맡길 업체를 찾는 사업자나 지역 운송업체의 분포와 차량 보유 규모를 비교하려는 분석가가 "강진군에 허가받은 일반화물 운송사가 어디에 있고 차량을 몇 대 갖고 있나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소로 맞춰 이어 쓰며, 전국 기준 자료인 전국화물자동차운송사업자표준데이터와 대조하는 용도에 맞다.
limits: 사업자등록번호 같은 공통 키가 없어 다른 데이터와 정확히 연결되지 않고, 업체명·주소 매칭에 의존해야 한다. 범위가 강진군 한 곳이라 다른 시군이나 전국 현황은 이 파일로 알 수 없다.
