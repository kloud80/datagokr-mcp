summary_user: 광주 북구에 있는 일반화물자동차운송사업자를 업체 1곳당 1행으로 담은 원천 목록이며, 면허종류((구)일반·일반), 보유 차량대수, 구 단위 주소, 현재 운영 여부, 데이터 기준일자를 담는다(CSV 약 4.7KB). 북구에서 영업 중인 일반화물 운송사가 몇 곳이고 차량을 얼마나 보유했는지 확인하려는 분석가나 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 직접 결합할 수 없고, 운송사 허가 여부 확인의 기준은 전국화물자동차운송사업자표준데이터이므로 이 파일은 그 데이터를 보조하는 지역 목록으로 쓴다.
description_portal: 광주광역시 북구에 소재한 일반화물자동차운송사업자 업체의 현황 데이터입니다. 일정 대수 이상의 화물자동차를 사용하여 화물을 운송하는 사업인 일반화물자동차 운송사업 업체의 현황 정보를 포함하고 있습니다.업체명, 면허종류((구)일반, 일반), 차량대수(1 ~ 89), 주소(광주광역시 북구), 현재운영여부(영업중) 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 각 업체의 업체명은 마스킹 처리하여 제공하고 있습니다.** 각 업체의 주소 또한 구 단위까지만 제공하며, 보다 상세한 주소 데이터는 제공하지 않습니다.
