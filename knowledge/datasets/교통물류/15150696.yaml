summary_user: 국토교통부 국가교통정보센터의 도로 본선 구간 기준정보를 전국 범위에서 구간 한 건씩 담으며, 노선번호·도로명, 구간 시작·끝 지점 이름, 방향, 구간 길이(SCTN_LEN), 시작·끝 좌표와 서비스 여부 같은 기본 속성이 들어 있다. 교통 분석가가 소통정보나 사고 지점을 특정 도로 본선 구간에 맞추려 할 때 '이 구간은 어느 노선의 어디부터 어디까지이고 길이가 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 구간 ID(MLSN_ID)·노선번호·도로명 같은 이름·코드 매핑이나 같은 기관(국가교통정보센터) 코드로만 잇는다.
