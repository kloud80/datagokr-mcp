summary_user: 서울교통공사가 운영하는 수도권 2호선의 역별 장애인 화장실 위치를 한 행씩 담은 CSV 파일(약 9KB)로, 역명·지상/지하 구분·역층·게이트 안팎·가까운 출구번호·상세위치·화장실 구분을 담는다. 휠체어 사용자나 보호자가 '2호선 이 역에서 장애인 화장실은 개찰구 안에 있나, 몇 번 출구 쪽인가'를 확인하거나, 분석가가 역별 교통약자 편의시설 배치를 점검하는 데 쓴다. 공통 역 코드 같은 전역 조인 키가 없어 다른 노선의 장애인화장실·엘리베이터 데이터나 역 목록과는 운영기관명·선명·역명을 이름으로 맞춰 이어 써야 한다.
limits: 역 코드가 없어 다른 데이터와는 역명 문자열로 맞춰야 하며, 같은 역의 표기 차이에 주의해야 한다. 2호선만 담고 있어 다른 노선이나 화장실의 이용 가능 여부·설비 규격은 알 수 없다.
