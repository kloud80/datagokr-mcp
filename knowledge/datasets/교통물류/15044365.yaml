description_portal: '서울교통공사의 호선별 역사 AP 설치 현황(SKT, KT, LG유플러스) 데이터입니다.AP란 휴대폰과 같은 무선 통신기기가 인터넷에 접속할 수 있도록 접속점을 제공하는 와이파이와 같은 장비를 말합니다.해당 데이터를 활용하여 서울 지하철 역사 내 인터넷 품질을 확인하는 부가적인 데이터로 활용할 수 있습니다.※ 역사내 와이파이 AP : 통신3사 평균 1역당 21대 설치(통신속도 300Mbps ~ 1Gbps로 서비스 중)이 데이터는 반기마다 업데이트 되므로 업데이트 주기를 확인하여 활용하시기 바랍니다.'
