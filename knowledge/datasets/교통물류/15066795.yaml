summary_user: 전국 17개 시·도별 대중교통 버스 평균 운행속도(km/h)를 평일·토요일·일요일로 나눠 담은 집계표로, 교통카드와 BIS/BMS 자료를 분석해 만든 374바이트짜리 작은 CSV 파일이다. 분석가나 정책 담당자가 '우리 시·도 버스는 평일과 주말에 평균 몇 km/h로 달리며 다른 지역보다 느린가'를 비교하는 데 쓴다. 전역 조인 키가 없어 시·도 이름(구분)을 기준으로 다른 시·도 단위 통계와 이름 매핑해 붙여 쓴다.
