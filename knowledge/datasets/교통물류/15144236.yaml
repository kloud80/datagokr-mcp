summary_user: 서울 서초구에 설치된 활주로형 횡단보도(양옆에 LED 유도등을 매립한 횡단보도)를 설치 지점 한 곳당 한 행으로 담은 파일이며, 설치연도·관리번호·지번주소·위도·경도를 개별 지점 단위로 제공한다. 주민이나 분석가가 "우리 동네 초등학교 통학로나 어린이보호구역 주변에 활주로형 횡단보도가 언제 설치됐고 어디에 있는가"를 확인하거나, 설치 지점을 지도에 표시해 보행안전시설 분포를 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와 직접 결합되지 않으며, 위도·경도로 어린이보호구역·교통사고 지점 같은 공간 데이터와 겹쳐 보거나 지번주소를 이름으로 맞춰 연결한다.
description_portal: 서울특별시 서초구 활주로형 횡단보도 설치현황에 관한 데이터로 연번, 설치장소, 설치주소, 관리번호, 위도, 경도, 설치연도, 데이터기준일 등의 항목을 제공합니다. 서울특별시 서초구는 교통사고 예방과 보행자 안전 강화를 위해 초등학교 주변, 어린이보호구역, 이면도로 등에 활주로형 횡단보도를 설치해오고 있다. 활주로형 횡단보도는 구민들의 안전한 보행환경을 위해 서초구가 전국 최초로 설치한 선진국형 교통안전시설이다. 횡단보도 양 옆을 따라 일정한 간격으로 매립한 LED 유도등을 설치는 설치 당시 경찰청 규정 상 위배되는 시설로 규정에는 횡단보도 상 LED 설치가 금지되어 있었다.해외에서 운영중인 사례를 분석및 벤치마킹하여 경찰청과 협력한 적극행정의 모범사례이다. 매년 보행자 교통사고 다발지점과 민원이 접수된 구간을 중심으로 우선 설치가 이루어졌으며, 초등학교 앞 통학로와 시장 주변, 생활권 보행축 등을 중심으로 확대 중에 있습니다.
