summary_user: 전남광주통합특별시 북구 교통지도과가 부과한 주정차 위반 과태료를 단속 건별로 담은 CSV 파일로, 단속일시·부과금액(본세)·가산금·부과총금액과 수납일자·수납금액을 시군구 단위로 제공한다. 지자체 재정·교통 분석가가 북구의 주정차 과태료가 연도별로 얼마나 부과되고 실제로 얼마나 걷혔는지, 체납으로 가산금이 붙은 비중은 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·시군구명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
