description_portal: 인천국제공항에서 환승하는 승객현황(출발국가,도착국가,출발공항,도착공항,공항코드,운항일자,계획시간,실제시간,운항편명,환승객)에 대한 정보를 출발편과 도착편으로 구분하여 반기별 1회  통계 최종 취합 후에 사용하기 편리 하도록 공공공데이터포털에 제공하며 통계성 데이터로 기준일과 업로드, 등록일은 상이 할 수 있으며 차기 등록 예정일의 주기 역시 상이 할 수 있습니다. 통계성 데이터로 추후에 변경 될 수 있습니다. 실시간 데이터는 운항현황API를 사용하여 확인하시고 기타 다른 형태의 통계자료는 인천공항공사 홈페이지의 정보공개 메뉴에서 확인하시면 됩니다.
