description_portal: 본 데이터는 2023년부터 2025년까지 한국교통안전공단 검사소와 민간 지정정비사업장에서 실시한 자동차검사 실적을 연도별로 정리한 자료이다. 검사기관 유형별 수검차량 대수, 검사 결과 부적합 판정을 받은 차량의 비율 및 수검차량의 평균 차령을 포함하고 있다. 이를 통해 연도별 자동차검사 물량의 변화와 검사기관 유형별 부적합률 추이를 확인할 수 있으며, 평균 차령을 함께 비교하여  살펴볼 수 있다. 부적합비율은 검사를 받은 전체 차량 중 검사기준을 충족하지 못해 부적합 판정을 받은 차량이 차지하는 비율이며, 평균 차령은 해당 연도와 검사기관 유형에 속한 수검차량의 차령을 평균한 값이다. 다만, 부적합률은 평균 차령 외에도 차종, 용도, 주행거리, 지역 및 검사종류 등의 영향을 받을 수 있으므로 기관의 검사 수준을 직접 평가하는 지표로 해석할 때에는 주의가 필요하다.
