summary_user: 2025년에 신청된 이륜자동차 튜닝승인을 원동기·제동장치·등화장치·소음방지장치 등 14개 장치 항목별로 묶어 승인 건수를 담은 전국 단위 집계표이며, 274바이트 CSV 한 개로 활용신청 없이 받는다. 이륜차 튜닝 정책 담당자나 정비·부품 사업자가 '이륜차 튜닝 수요가 어느 장치 항목에 몰려 있는가'를 확인할 때 쓴다. 장치 항목명(코드명)과 연도별 건수 열만 있고 전역 조인 키가 없어서, 다른 연도 같은 통계나 자동차 튜닝 통계와는 장치 항목 이름을 맞춰서만 이어 쓴다.
