description_portal: '데이터 개요**국토교통부가 IATA(국제항공운송협회)**를 통해 수집한 **세계 주요 항공사별 인력 현황 데이터(2024년 기준)**는 항공사별 인력 운영 구조를 직군 단위로 세분화하여 제공합니다. 이 데이터는 항공사 내부의 인적 자원 배분 현황을 정량적으로 분석할 수 있어, 항공산업 종사자 규모 비교, 국가 간 항공 인력 구조 비교, 직군별 수요 예측, 교육 및 훈련 정책 수립 등에 활용됩니다.주요 제공 항목조종사: 기장 및 부기장 등 비행 책임자기타 운항승무원: 운항관리사, 항공교통 관제지원 인력 등객실승무원: 승객 안전·서비스 담당 인력정비사: 기체·엔진·항전장비 등 항공기 정비 담당영업인원: 예약, 발권, 마케팅 등공항인원: 체크인, 탑승게이트, 지상조업 인력 등기타: 본사 관리직, IT, 재무, 교육 등 기타 사무직계: 항공사 전체 인력 총합데이터 기준IATA가 집계한 공식 항공사 등록 데이터항공사별 연간 기준 (2024년)활용 사례항공사별 인력 규모 비교 및 산업 벤치마킹직군별 인력 편성 비율 분석국가별 항공인력 양성 정책 수립의 기초자료항공 고용 트렌드 모니터링 및 국제 협력 기반 자료데이터 예시항공사조종사기타 운항승무원객실승무원정비사영업인원공항인원기타계ABX Air272--61-239-572Aerolineas Argentinas1,218-2,0802,3429673,4161,90311,926Aeromexico1,557-3,1135151,1951,2113,56111,152※ 일부 항공사는 특정 직군에 대해 데이터 미제공 또는 비공개(-) 처리됨※ 단위: 명 / 기준연도: 2024년'
