summary_user: 부산교통공사가 운행하는 도시철도 1~4호선 전동차의 차종, 궤간, 전원 공급방식, 차량 길이·폭·높이, 설계상 수용 인원, 차량당 문 수 같은 주요 제원을 항목(구분)별 행과 호선별 열로 정리한 작은 표(CSV 약 1KB)입니다. 교통 연구자나 차량 제조·정책 담당자가 "부산 1호선과 4호선 전동차는 크기·급전방식·정원이 어떻게 다른가"처럼 노선별 차량 사양을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 호선 이름을 맞춰 붙이거나 같은 부산교통공사 데이터끼리만 이어 쓴다.
description_portal: '본 데이터는 부산교통공사에서 운행 중인 도시철도 전동차의 노선별 주요 제원 정보를 정리한 데이터입니다.각 노선(1~4호선)에 투입된 전동차의 차종, 궤간, 전원 공급방식, 차량의 길이·폭·높이 등 주요 사양을 표 형식으로 제공하며, 설계상 수용 인원과 차량 당 문 수 등도 포함되어 있습니다. 이 데이터는 차량의 물리적 특성과 기술적 기준에 대한 기초 자료로서, 노선별 차량 운영 특성 비교나 신규 노선 계획 수립 시 참고자료로 활용 가능합니다. 또한 교통 관련 연구기관, 정책수립기관, 제조업체 등에서 철도 차량 기술 기준의 분석 및 개선 방향 도출, 비교 연구, 교통 정책 수립 등에 유용하게 활용될 수 있습니다.* TIS: Train Information System / TCMS: Train Control Management System'
