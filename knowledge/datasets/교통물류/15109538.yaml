summary_user: 포천시에 있는 공공·민간 주차장을 한 곳씩 담은 파일로, 주차구획수·장애인주차구역면수·요금·운영시간과 함께 출입구 단차 제거, 장애인용 승강기·화장실, 점자블록, 경보·피난설비 같은 사회적약자 편의시설 여부를 주소·좌표 단위로 담는다. 장애인이나 보호자가 포천시에서 장애인전용 주차구역과 장애인용 화장실을 함께 갖춘 주차장을 찾을 때 쓰고, 분석가는 지역별 편의시설 설치 현황을 비교할 때 쓴다. 실측상 전역 조인 키는 확인되지 않았다. 주차장관리번호 필드가 있으므로 전국주차장정보표준데이터 원장과 이 번호나 주차장명·주소로 맞춰 볼 수 있지만, 실제 대응 여부는 확인이 필요하다.
