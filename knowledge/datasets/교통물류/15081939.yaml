summary_user: 부산광역시와 구·군이 도시공간정보시스템에서 관리하는 도로면 도형 하나하나를 행으로 담은 건별 시설물 자료로, 지형지물부호·도형아이디·보도/차도 구분·시군구·면적(제곱미터)을 담으며 범위는 부산 시도 안의 시군구 단위다. 도시계획·도로 분석가가 "구·군별로 보도와 차도 면적이 각각 얼마나 되는가"를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름 매핑으로만 잇고, 표준노드링크(link_id·node_id) 같은 교통 공간 기준과 바로 연결하는 키는 없다.
description_portal: 부산광역시 및 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있음.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 도로시설물인 도로면에 대한 정보이고, 매년 5월에 현행화 됨을 알려드립니다.부산광역시와 구.군에서 관리하고 있는 도로시설물 중 도로면의 도형데이터에 대한 지형지물부호, 도형아이디, 보도차도구분, 시군구, 면적(제곱미터) 등의 자료를 확인할 수 있음.
