summary_user: 경기도 31개 시군에서 일반화물(이사화물 외) 운송·주선 업체의 인허가·사업장 정보를 사업장 단위로 담는다(사업장명, 인허가일자, 영업상태·폐업일자, 소유형태, 업체유형, 자본금, 면허 유효기간, 주소와 위경도). 사업자나 분석가가 "이 업체가 경기도에서 허가받은 화물운송·주선 업체이며 지금도 영업 중인가"를 확인하거나 시군별 업체 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 시군코드·시군명, 사업장명, 주소, 위경도로 맞춰 잇고, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 이 데이터는 경기도 내에서 일반화물(이사화물이 아닌 모든 화물)의 운송을 주선하는 운송업체의 인허가 및 사업장 정보를 제공합니다. 포함된 항목으로는 사업장명, 인허가일자, 폐업일자, 소재지 주소, 소유형태, 업체유형, 자본금, 면허 유효기간, 지정정비업종명, 위경도 좌표 등이 있으며, 경기도 31개 시군 전체를 대상으로 합니다. 해당 데이터는 물류산업 구조 분석, 운송업 등록현황 파악, 화물운송 네트워크 연구 등에 활용할 수 있으며, 물류 정책 수립 및 규제 기준 마련을 위한 기초자료로 유용합니다. 본 데이터는 2018년 9월 이후 갱신이 중단되었으며, 제공된 Open API를 통해 데이터 호출이 가능합니다.
