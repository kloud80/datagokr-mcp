summary_user: 대전 도시철도 각 역사의 운수수입을 영업월·역사 단위로 집계한 파일로, 발권기·발매기·정산기·복합자동발매기 등 기기 취급 수입과 특종·반환·단체권·기타 등 인력 취급 수입, 수입금 정정액, 이벤트 수입, 세종시 환승손실 부담액, 다기능 충전기 금액을 담는다. 교통 분석가나 지자체 담당자가 "어느 역의 월별 운수수입이 어떻게 변했고, 기기 발매와 창구 판매 비중은 어떤가"를 따질 때 쓴다. 전역 조인 키는 없으므로 같은 기관의 승하차 인원 데이터와 역사 이름·영업월을 맞춰 이어 쓴다.
description_portal: 대전교통공사의 각 역사 운수수입총괄 현황 데이터입니다.월별로 각 역사의 기기(발권기, 발매기, 정산기, 복합자동발매기)에 따른 기기 취급 수입과 인력(특종, 반환, 단체권, 기타수입)에 따른 인력 취급 수입 데이터,수입금 정정 보고 금액, 수입금 지시 정정 금액, 이벤트 수입 금액, 환승 손실 부담(세종시) 금액, 다기능 충전기 금액를 조회할 수 있습니다.데이터는 연간 1회(보통 8월 ~ 9월 중) 등록하고 있으며 전체 데이터는 2006년 3월부터 2025년 8월까지의 데이터를 조회할 수 있습니다.2024년 8월부터 2025년 8월까지 전체 데이터의 행은 286건으로 과거 데이터는 과거 파일 데이터를 통해 확인할 수 있습니다.
