summary_user: 인천교통공사가 운영하는 인천1호선(37개 구간), 인천2호선(25개 구간), 7호선 인천·부천구간(13개 구간)의 터널을 한 행씩 담은 2025년 6월 30일 기준 내진실태 현황 파일이다. 시설 안전 분석가나 지역 주민이 '우리 노선의 어느 터널이 내진설계기준 제정 전에 지어졌고, 성능평가 결과는 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 호선명·터널명·위치를 이름으로 맞추거나 같은 기관의 다른 시설물 현황과 나란히 놓고 쓴다.
description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선, 인천2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준 터널시설물 내진실태 현황입니다.해당 데이터는 구분도로별,호선명,터널명,관리기관,위치,총연장,총폭,터널형식,준공연도,성능평가결과,내진설계적용여부 항목으로 구성되어있습니다.인천1호선 내 터널 37개 구간, 인천2호선 내 터널 25개 구간, 7호선 인천·부천구간 내 터널 13개 구간의 정보가 포함되어있습니다.터널시설물 성능평가는 5년 주기로 시행되어 시기가 미도래한 터널의 경우 평가결과를 기재하지 않았습니다.
