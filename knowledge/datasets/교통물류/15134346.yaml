description_portal: 서울교통공사에서 운영 중인 1~8호선 25개 지상 역사 중 냉방 설비를 갖춘 고객 대기실(동행쉼터) 관련 데이터입니다.(2025년 8월 기준). 해당 데이터에는 현재 지상역 승강장에 설치된 고객 대기실(동행쉼터) 개수와 역 주소 정보가 포함되어 있습니다. 서울교통공사 운영 역사 중 지상 역사의 수는 총 25개이며, 폭염 재난 대비 냉방 설비를 갖춘 부스형 고객 대기실(동행쉼터)를 확대 설치하고 있으며, 공사에서는 이용 승객의 편의를 위해 최선을 다하고 있습니다. 현재 9개 역사에서 총 14개소를 운영 중이며, 지상 역사에 설치 노력 중이나 일부 역의 경우 타 기관 운영 공간의 존재, 설치 공간 협소(혼잡상황 우려) 등으로 설치되지 않을 수 있습니다.
