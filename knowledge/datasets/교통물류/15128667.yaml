summary_user: 울산광역시 중구 버스승강장별로 바람막이·온열의자·냉온열의자·선풍기·에어송풍기·조명 같은 편의시설 설치 현황을 동·정류장 번호·정류장명과 함께 담은 정류장 단위 현황 파일(CSV 약 19.7KB)이다. 중구 주민이나 교통정책 담당자가 '우리 동네 어느 정류장에 온열의자나 바람막이가 없는가'를 확인하거나 편의시설 확충 대상을 고르는 데 쓴다. 전역 조인 키는 없어서 버스정류장 번호나 정류장명을 국가 정류장 원장·BIS 정류장 정보와 이름·번호로 맞춰 이어 써야 한다.
description_portal: 울산광역시 중구 버스승강장 교통편의시설물 현황에 대한 자료로, 울산광역시 중구 버스승강장 교통편의시설물 현황 정보를 제공합니다.본 데이터는 연번, 동, 버스정류장 번호, 버스정류장명, 바람막이, 온열의자, 냉온열의자, 선풍기, 에어송풍기, 조명 등의 상세 현황을 확인할 수 있습니다.데이터 출처는 울산광역시 중구 교통과 교통지도계 (052-290-3980)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 3월 31일입니다. 다음 업데이트는 2027년 3~4월 중 제공됩니다.본 자료는 울산광역시 중구 버스승강장 내 편의시설 설치 현황 파악, 대중교통 이용객 편의 증진 분석, 교통 인프라 수요 예측 및 지역 교통 정책 수립 등을 위한 기초자료로 활용할 수 있습니다.
