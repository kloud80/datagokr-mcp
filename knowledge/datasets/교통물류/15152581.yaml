status: active
summary_user: 경상북도 청송군 관내에서 접수된 불법주정차 신고·단속 건을 건별로 담은 CSV 파일로, 위반구분·신고일시·위반장소·과태료부과일을 포함하며 포털 설명상 2024년도 자료다. 청송군 주민이나 지역 분석가가 "군내 어느 장소에서 어떤 유형의 불법주정차가 자주 신고되고 과태료로 이어지는가"를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위반장소 이름을 주소·지명으로 맞추거나 같은 기관(청송군) 기준으로만 이어 쓸 수 있다.
limits: 전역 조인 키가 없어 단속카메라·보호구역 등 다른 데이터와 자동으로 연결되지 않고 장소명 매칭이 필요하다. 범위는 청송군 한 개 시군구에 한정되어 전국 비교에는 다른 지자체 자료를 따로 모아야 한다.
