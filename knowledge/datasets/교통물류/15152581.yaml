description_portal: 경상북도 청송군의 불법주정차 신고 및 과태료 부과 현황 자료는 청송군 관내 전지역의 불법주정차 단속정보를 제공하고 있습니다.제공하고 있는 기본정보는 위반구분, 위반일시, 위반장소, 과태료부과일자, 데이터 기준일자 등으로 구성된 데이터입니다.제공하고 있는 데이터의 형태는 CSV 형태의 데이터입니다. 제공하는 데이터의 시간적 범위는 2024년도의 데이터를 제공하고 있습니다.제공되는 데이터는 개인정보를 제외하고 있으니 참고하시기 바랍니다.해당 자료를 통해 지역 내 불법주정차 단속 정보을 통해 파악하는데 유용하게 참고자료로 할용가능합니다.
