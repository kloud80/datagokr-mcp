summary_user: 전국 고속도로 영업소의 하이패스 차로별 개방·폐쇄 상태를 차로 단위로 담은 외부 API 데이터로, 영업소 이름·코드, 차로번호, 차로유형·구분, 차로제어(LCS) 상태와 근무일자·수집일시·최종저장일시를 함께 준다. 내비게이션·길안내 서비스 개발자나 교통 분석가가 '지금 이 영업소에서 열린 하이패스 차로는 몇 개이고 어느 차로인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업소 이름이나 한국도로공사 영업소 코드(tolofCd)를 매핑해서만 잇는다.
description_portal: 본 데이터는 한국도로공사가 전국 고속도로 영업소의 하이패스 차로 개방 여부를 확인하기 위해 제공하는 정보이다.이용자는 해당 데이터를 통해 영업소별 차로번호, 차로유형, 차로구분 등 구조적 특성과 함께 LCS 상태를 기반으로 특정 시점에 개방 또는 폐쇄 여부를 확인할 수 있다.또한 근무일자와 수집일시, 최종저장일시가 포함되어 실시간성 및 이력 확인이 가능하다.본 데이터는 고속도로 운영, 교통서비스 개선, 정책 연구 및 민간 서비스 개발 등 다양한 활용 목적에 적합하다.OpenAPI 형식으로 제공되어 시스템 간 연동이 용이하며, 데이터 항목별 표준화된 명칭을 통해 사용자가 이해하기 쉽게 구성되어 있다.이를 통해 교통 혼잡 분석, 긴급 상황 대응, 사용자 길안내 서비스 등에도 활용될 수 있다.※ 해당 데이터는 자동차융합기술원에서 우리기관으로 요청한 자율운송 상용차 실증지원 사업과 관련된 테스트베드용 데이터로써 2순위로 활용할 것을 요청드리며, 활용 중 발생한 사고 및 민원에 대해서는 우리 공사에서 일체 책임지지 아니합니다.
