summary_user: 대구 도시철도 호선·역사별로 냉동기, 공기조화기, 히트펌프, 패키지에어컨, 항온항습기, 본선송풍기, 자동에어필터, 자동세정형필터 등 공조설비의 종류별 운영대수를 한 행씩 담은 집계 파일(CSV, 약 2.8KB)이다. 시설 관리자나 ESG·에너지 분석가가 "어느 역에 냉동기와 공기조화기가 몇 대씩 있어 냉방 부하나 유지관리 대상이 많은가"를 확인하는 데 쓴다. 전역 조인 키가 없어 역사명·호선 이름으로 다른 대구교통공사 역별 데이터(승하차, 에너지 사용 등)와 맞춰 이어 쓴다.
