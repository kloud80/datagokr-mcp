description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야 환경관리 정보 데이터로, 도시철도 역사별 공조설비 운영 현황 정보를 제공합니다. 데이터에는 냉동기, 공기조화기, 히트펌프, 패키지에어컨, 항온항습기, 본선송풍기, 자동에어필터, 자동세정형 데미스트 등 역사 내 설치·운영 중인 공조설비의 종류별 운영대수 정보가 포함되어 있습니다. 해당 데이터는 역사별 공조설비 운영 현황 파악, 시설물 유지관리 계획 수립, 설비 운영 효율 분석 및 환경관리 업무를 위한 기초자료로 활용할 수 있습니다. 또한 공조설비 구성 현황을 확인하여 설비 관리, 에너지 사용 효율 검토 및 시설 운영 개선 방안 마련에 활용할 수 있습니다. 본 데이터는 설비 교체 및 운영 현황 변경 등 변동 사항 발생 시 갱신됩니다.'
