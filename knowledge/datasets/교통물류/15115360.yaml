summary_user: 경상남도 거창군 안의 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 파일로, 업체명·면허종류·차량대수·도로명/지번 주소·위도·경도·현재 운영여부를 담는다(파일 약 1.2KB의 소규모 목록). 화주나 지역 사업자가 "거창군에서 지금 영업 중인 화물운송사는 어디이고 차량은 몇 대인가"를 확인하거나, 허가받은 운송사인지 대조할 때 쓴다. 사업자번호 같은 전역 조인 키는 없어 업체명·주소로 매칭하거나 위도·경도로 지도에 올려 쓰며, 전국 기준은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 경상남도 거창군 내 일반화물자동차운송사업자 업체의 업체명, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 면허종류, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 차량대수, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 도로명주소, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 지번주소, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 위도, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 경도, 경상남도 거창군 내 일반화물자동차운송사업자 업체의 현재 운영여부를 나타낸 데이터입니다.○ 일반 화물차 운송사업자는 화물자동차를 이용해 유상으로 화물을 운송하는 사업을 하는 자를 말합니다. 이때, 화물자동차는 「화물자동차 운수사업법」에 따른 화물자동차를 의미하며, 사업자는 해당 사업을 하기 위해 국토교통부 장관의 허가를 받아야 합니다.
