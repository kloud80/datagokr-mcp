summary_user: 초경량비행장치가 별도 비행승인 없이 운용할 수 있는 비행허용공역(UA)을 공역 하나당 한 행으로 담은 파일(약 3KB CSV)이며, 공역 코드·중심 좌표·수평 반경·최대 고도(주로 지면 기준 500피트)·특기사항을 담는다. 패러글라이더·드론 등 항공레저 활동자나 지자체가 '이 지역 근처에 승인 없이 날릴 수 있는 공역이 있는가'를 확인하고 비행계획을 세우는 데 쓴다. 전역 조인 키가 없어, 다른 공역·비행금지구역 데이터와는 공역 코드나 지명을 직접 맞추거나 위치 좌표를 공간적으로 겹쳐 보는 방식으로만 잇는다.
