description_portal: '서울시 1일 정류장별 사용자유형별(일반, 어린이, 경로, 장애인 등)로 환승한 승객수 및 환승시간을 확인할 수 있습니다.정류장 ID는 9자리의 숫자 체계이고 역사 ID는 4자리 숫자 체계이므로 ID 값 자리수에 따라 구분할 수 있습니다.정류장, 역사에 대한 ID 값 정보는 연관데이터인 서울시 지하철역 정보 검색(역명),서울시 정류장마스터 정보를 참고하시기 바랍니다.* 데이터 적재는 매일 5일전 데이터를 갱신합니다.※ 제공부서 : 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4959)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
