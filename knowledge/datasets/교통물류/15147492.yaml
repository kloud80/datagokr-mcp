summary_user: 인천광역시 영종구 관할의 물류창고업 사업장을 한 곳씩 사업장명·소재지주소·소재지전화·데이터기준일자로 담은 건별 목록이며, 활용신청 없이 받는 작은 CSV 파일(약 6.9KB)입니다. 영종 지역에 어떤 물류창고가 어디에 몰려 있는지 파악하거나, 3PL·보관 위탁처를 찾는 사업자와 지역 물류 인프라 입지를 분석하는 사람이 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 사업장명이나 주소를 맞춰 보거나 같은 기관의 자료끼리만 연결한다.
description_portal: '물류창고는 상품의 입출고, 보관분류, 하역 등 다양한 물류기능을 수행하는 시설로 ,생산과 판매를 연결하고소통을 원활하게 하는 핵심적인 역할을 합니다.물류창고의 유형은 아래와 같습니다.물류센터 : 상품의 이동과 배송을 최적화하여 시간과 비용을 절감하는 데 중점을 둔 시설냉동/냉장 창고온도와 습도에 민감한 의약품, 신선식품 등을 일정하게 유지하며 보관하는 시설보세창고외국에서 수입된 화물을 보세구역 내에서 관세납부를 유예하고 보관할 수 있는 창고물류창고업 등록을 위해서는 아래 구비서류가 필요합니다.1, 물류창고업 등록 신청서2, 법인 인감 증명서3, 법인 등기부 등본4, 법인 대표자 기본증명서5, 사업자 등록증6, 임대차 계약서7, 토지등기부 등본8, 건물등기부등본9, 건축물 대장10, 물류창고업 사업운영계획서11, 화재안전관리계획서본 데이터는 물류시설 사업장명, 소재지주소, 소재지전화 정보를 포함하고 있어 관할 구역 내 물류산업 현황분석 및 3PL업체 조사를 위해 구축된 자료입니다.'
