summary_user: 한국교통안전공단이 교통카드와 BIS/BMS 자료를 분석해 전국 17개 시도별 버스 1회 평균 운행시간(분/회)을 평일·토요일·일요일로 나눠 담은 집계표로, 387바이트 크기의 작은 CSV 파일이다. 정책 분석가나 지자체 담당자가 '우리 시도 버스의 평균 운행시간이 다른 지역이나 주말과 비교해 얼마나 긴가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시도명(구분)을 기준으로 다른 시도별 대중교통·인구 통계와 이름으로 맞춰 이어 쓴다.
description_portal: 한국교통안전공단에서 교통카드와 BIS/BMS 자료를 이용해 전국 데이터를 분석하여 추출한 전국 대중교통 버스 평균 운행시간 자료입니다.해당 데이터는 평일과 주말(토요일, 일요일)별로 운행시간을 제공하고 있습니다.전국(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)으로 구분하여 데이터를 제공하고 있습니다.단위는 분/회입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
