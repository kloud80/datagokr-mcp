description_portal: 광주도시철도공사에서 운영하는 노선의 엘리베이터에 대한 데이터로 철도운영기관명, 선명, 역명, 출입구번호, 상세위치, 정원인원, 정원중량의데이터가 있습니다.1990년대부터 수도권 전철에서는 장애인의 이동권을 고려하여 장애인도 도시철도를 원활하게 이용할 수 있도록 여러 시설을 갖추기 시작했다. 엘리베이터가 최초로 설치된 역은 1993년에 개통된 학여울역으로 지상과 환승주차장, 대합실을 잇는 엘리베이터였다. 서울 5~8호선은 개통 당시(1995~2001년)부터 주요 거점 역사에 엘리베이터를 설치했고 엘리베이터가 없는 구간은 계단 옆에 경사형 휠체어리프트를 대신 마련했다.
