summary_user: 광주도시철도 노선 역에 설치된 엘리베이터를 한 대씩 담은 파일로, 운영기관명·선명·역명·출입구번호·상세위치와 정원 인원·중량을 담는다(CSV 약 7KB 규모). 휠체어 이용자나 보행약자가 광주 지하철 어느 역 몇 번 출입구에 엘리베이터가 있는지 확인하거나, 분석가가 역별 교통약자 편의시설 현황을 비교하는 데 쓴다. 전역 조인 키나 역 코드가 없어 역명·선명을 기준으로 다른 역·출입구 데이터와 이름 매칭해 이어 쓴다.
limits: 역 코드나 좌표 같은 공통 키가 없어 다른 데이터와는 역명·선명 문자열 매칭으로만 연결되므로 표기 차이에 주의한다. 포털 설명의 수도권 엘리베이터 연혁은 이 파일 내용과 무관하며, 파일은 광주 노선만 다룬다.
