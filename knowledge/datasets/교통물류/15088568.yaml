description_portal: 이 데이터는 해양수산부에서 건설공사 사후평가(총사업비 300억원 이상의 건설공사를 대상으로 공사 계획과정, 공사완료 후 공사비, 공사기간, 수요, 효과 등에 대한 예측치와 실측치를 비교)에 대한 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 300억 원 이상의 사업비가 투입된 공사의 발주청, 사업명, 공사 개요, 공사비, 공사기간 및 사후평가 기간 정보로 구성되어 있습니다.   본 데이터는 항만건설사업의 효율성과 사업관리 투명성 제고, 미래 항만건설사업 계획 수립 시 유사 사업의 사례 분석, 정책 수립 시 의사결정의 참고자료로 활용될 수 있습니다.
