description_portal: 이 데이터는 LG U+와 BC카드의 고가치 민간 데이터를 금융결제원을 통해 결합해 만들어진 융합데이터이다. 고속도로 외에서도 접근할 수 있는 6개 휴게소에서의 고속도로 이용객 인구통계특성 및 소비 이용정보를 담고 있으며, 개인주소지에 따른 소비패턴을 확인할 수 있는 자료이다. 이를 통해 맞춤형 마케팅 전략을 수립하는데 활용할 수 있다. 각 휴게소별로 연령대, 성별, 지역(시도·시군구) 정보를 포함하고, 매장 대분류 및 소분류별 총판매액을 산출하였다. 이를 통해 이용자 집단의 소비 경향과 시설 선호도를 파악하고, 휴게소 내 상업시설 운영전략 및 서비스 개선에 활용할 수 있다. 데이터는 특정 연령층이나 성별의 구매패턴 비교, 지역별 이용 차이 분석, 교통 수요 예측, 상권 활성화, 맞춤형 상품기획 등 다양한 분야에서 활용이 가능하다. 한국도로공사는 본 데이터를 통해 이용자 중심의 휴게소 운영체계를 강화하고, 공공데이터 기반의 서비스 품질 향상과 지역경제 활성화에 기여하고자 한다.※ 본 데이터는 합성데이터로, 합성데이터 특성상 주기성 데이터 등록이 어려운 관계로 수시 1회성 데이터로 등록하였습니다.※ 본 데이터는 과학기술정보통신부 및 한국지능정보사회진흥원의 2025년 가명정보활용지원사업 지원을 받아 생성된 데이터를 기반으로 수행한 사업임
