summary_user: 경찰청이 제공하는 교통안전 위험요소 중 법규위반 유형이 '과속'인 지점 정보를 건별로 담으며, 지번·도로명 주소와 위경도, 위험요소 분류코드, 촬영정보 유무, 상세내용, 데이터 기준일자를 포함하고 범위는 전국이다. 운전자·내비게이션 사업자·교통안전 분석가가 '우리 동네에서 과속 위험이 지적된 지점은 어디인가'를 확인하거나 단속·안전시설 배치를 검토할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소 이름이나 위경도 좌표로 맞춰 이어 써야 하며, 연계 링크 ID(RLTN_LNK_ID)는 도로 링크와의 연결 후보로 볼 수 있으나 매핑 기준은 명세에 없다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-법규위반별 데이터는 경찰청에서 제공하는 정보입니다.
