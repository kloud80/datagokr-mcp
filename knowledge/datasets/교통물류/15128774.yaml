summary_user: 강원특별자치도 동해시에서 영업 중인 이사화물업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·업종·영업상태·전화번호·도로명주소·데이터기준일자를 담는다(파일 크기 약 1.4KB의 소규모 목록). 동해시 주민이 이사 업체를 고를 때 업체의 연락처와 영업 여부를 확인하거나, 분석가가 동해시 이사화물업체 수와 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·도로명주소 같은 이름 매칭으로만 이을 수 있고, 허가 여부 확인에는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
