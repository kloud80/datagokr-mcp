summary_user: 경기도 광주시 공간정보시스템에 등록된 교통광장을 광장 한 곳당 한 행으로 담은 원천 목록 파일로, 광장명·관리기관·연장(미터)·면적(제곱미터)·접속도로명·지번주소를 담는다(파일 크기 755바이트로 건수가 매우 적다). 도시계획·교통 분석가가 '광주시 교통광장은 어디에 있고 어느 도로와 이어지며 규모는 얼마인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 지번주소나 접속도로명을 문자열로 맞춰 광주시 도로·도시계획 자료와 이어 쓰고, 지형지물부호는 같은 기관 공간정보 자료 안에서만 연결 고리로 쓴다.
description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 교통광장의 정보를 제공합니다. 여러 도로가 교차하는 지점에 조성된 교통광장의 위치와 규모 정보를 담고 있어 교통 관리와 도시 계획에 활용됩니다. 지형지물부호는 광장을 식별하는 코드이며, 광장명은 광장의 명칭을 나타냅니다. 관리기관은 광장 관할 주체를 표시하고, 광장 연장과 면적은 광장의 규모를 수치로 제공합니다. 접속도로명은 광장과 연결된 도로들을 나타내며, 지번주소는 광장의 위치를 제공합니다. 본 데이터는 교통 계획 수립, 도로망 분석, 광장 시설 관리, 도시 공간 구조 파악 등에 활용됩니다.
