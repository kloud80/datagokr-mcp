description_portal: "데이터 개요감항성 관련 정보를 발행한 외국 항공당국별 연도별 통계를 제공하는 공공데이터입니다.이 데이터는 2012년부터 매년 국토교통부에 의해 수집된 감항 정보(감항성 개선지시 등) 발행 실적을 외국 항공당국별로 정리한 것입니다. FAA(미국), EASA(유럽), ANAC(브라질), CAA(영국 등) 등 주요 항공안전 당국이 발행한 감항자료의 연도별 건수를 확인할 수 있으며, 누적 발행량도 함께 제공합니다. 항공안전 기준 동향 파악, 해외 감항성 규정 대응전략 수립, 국제 협력 자료로 활용됩니다.데이터 제공 항목외국항공당국감항정보를 발행한 국가 또는 국제기구 (예: FAA, EASA, ANAC 등)연도별 발행 건수해당 연도에 각 당국에서 발행한 감항정보(AD, SB 등) 수계2012년 이후 누적 발행 건수활용 안내국가별 감항성 규제 강도 비교: 각국 항공당국의 연간 발행 건수를 비교함으로써 규제 활동 수준 분석감항정보 대응 우선순위 수립: FAA, EASA 등 발행량이 높은 기관의 자료를 우선 검토하는 전략 수립 가능국제협력 및 수용검토 근거자료: 타국 AD 수용 여부 및 기술 검토 시 참고자료로 활용국산 항공기·부품의 인증 대응전략 수립: 주요 수출대상국의 감항 발행 추이를 기반으로 인증 리스크 관리데이터 해석 시 유의사항각국 항공당국의 감항정보는 발행 정책과 절차가 상이하므로 건수의 직접적 비교는 신중하게 해석 필요일부 기관(예: ANAC, CAA 등)은 특정 연도에만 발행 또는 공유되므로 '0건'도 의미 있는 값일 수 있음발행 건수는 AD(감항성 개선지시), SB(서비스 게시), 비상조치 등 포함여부에 따라 달라질 수 있음‘계’ 열은 단순 누계이며, 중복 발행 또는 취소된 항목은 제외되지 않을 수 있음예시 데이터외국항공당국20252024202320222021…계EASA63164129173188…1501FAA2353577166…629ANAC05201…11"
