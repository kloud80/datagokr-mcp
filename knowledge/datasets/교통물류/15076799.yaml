summary_user: 한국도로공사 고속도로 노선별 LCS(차로제어시스템) 장비가 언제 어떤 기호를 표출했는지를 표출 건별로 담은 운영이력이며, 일자·시간, LCS 그룹과 장비 ID, 장비 설명, 구간길이(km), 표출 기호, 방향(기점/종점), 노선번호가 들어 있고 범위는 전국이다. 도로 운영 분석가가 특정 노선·구간에서 어느 시간대에 차로 통제·전환 표출이 잦았는지, 방향별 표출 빈도가 어떻게 다른지 확인하는 데 쓴다. 전역 조인 키는 없어 노선번호(routeNo)나 장비 ID·그룹명 같은 이름·코드 매핑, 또는 같은 한국도로공사 데이터의 코드로만 다른 교통 데이터와 이어 쓰며, 표준노드링크(link_id·node_id)와의 직접 연결 키는 실측 컬럼에서 확인되지 않았다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 LCS 운영이력으로, 노선별 LCS 장비의 표출 이력을 OpenAPI 형태로 제공한다.제공 형식은 XML과 JSON이며, 출력 항목에는 일자, 시간, LCS그룹명과 ID, LCS_ID, 장비설명내용, LCS구간길이(km), 기호ID, 표출일시, 방향코드(S:기점/E:종점), 노선번호가 포함된다.이 데이터는 노선별 LCS 장비의 운영 현황을 파악하고 표출 이력을 분석하는 데 유용하다.이를 통해 특정 시점의 표출 패턴, 방향별 표출 빈도, 구간별 운영 특성을 확인할 수 있다.또한 도로 운영 효율성 분석, 교통 안내 서비스 품질 향상, 장비 유지관리 계획 수립 등 다양한 분야에서 활용 가능하며, 도로 이용자에게는 안내 정보의 신뢰성을 높이는 기반 자료가 된다.
