description_portal: 경기도 하남시 지능형교통체계시스템(ITS) 마스터 시설 DSRC 정보는 도로변통신장치(DSRC)의 설치현황과 운영정보를 담고 있습니다. DSRC는 차량과 인프라 간 통신을 지원하는 핵심 장치로 교통안전과 효율적인 신호운영을 가능하게 합니다. 데이터에는 시설관리아이디, 설치위치명, 위경도 좌표 등이 포함되어 있어 장치별 관리와 위치기반 분석에 활용됩니다. 이를 통해 ITS 기반 교통정책 수립, 차량통신 인프라 확충, 자율주행 서비스 실증 등 다양한 분야에서 중요한 기반자료로 쓰일 수 있습니다.
