summary_user: 광주 도시철도 역사에 조성된 테마 공간(전시관·홍보관·도서관·체험관 등)의 명칭, 조성 내용, 해당 역명을 테마 공간 한 곳당 한 행으로 정리한 소규모 현황 파일(csv 약 1.4KB)이다. 시민이나 문화관광 기획자가 '광주 지하철 어느 역에 어떤 전시·체험 공간이 있는가'를 확인하거나, 역별 문화 콘텐츠 분포를 파악할 때 쓴다. 전역 조인 키가 없어 역 위치·승하차 데이터 등과 연결하려면 역명(역 명)을 문자열로 맞춰 매핑해야 한다.
description_portal: 이 데이터는 광주광역시 도시철도공사 테마역사 운영 현황을 정리한 자료로, 각 지하철 역에 조성된 특화 공간과 그 내용, 위치를 기록하고 있습니다. 주요 항목에는 구분(테마역사), 테마별 명칭, 조성내용(전시물, 홍보관, 도서관, 체험관 등), 역명이 포함됩니다. 예를 들어 무등산국립공원테마관(학동증심사입구역), 추억여행전시관·메트로열린도서관(남광주역), 518기념홍보관(문화전당역) 등 역사별 문화·교육·역사적 테마를 확인할 수 있습니다.이 자료를 활용하면 역별 테마 콘텐츠의 분포와 성격을 분석하여 문화관광 연계 프로그램 기획, 시민 문화향유 기회 확대, 지역 역사·정체성 홍보 전략 수립에 도움을 줄 수 있습니다. 또한 각 테마역의 운영 효과를 평가하여 이용객 만족도 조사, 관광객 유입 효과 분석, 테마 갱신·확충 계획 수립에도 활용 가능하며, 도시철도의 단순 교통 기능을 넘어 문화·교육 플랫폼으로서의 역할을 강화하는 기반 자료가 됩니다.
