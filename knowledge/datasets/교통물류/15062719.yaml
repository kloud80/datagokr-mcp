summary_user: 통영시 도시정보시스템에 등록된 도로 점용시설을 시설 한 건씩 담은 파일로, 지형지물부호·관리번호·행정읍면동·도엽번호·관리기관·도로구간번호·차도/보도 구분·점용물 관리코드를 기록하며 범위는 통영시 읍면동 단위다. 도로 관리 담당자나 분석가가 '통영시 어느 읍면동·도로구간에 어떤 점용시설이 차도와 보도 중 어디에 몇 개 있는가'를 파악하거나 점용·굴착 공사 이벤트를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 행정읍면동 이름이나 도로구간번호·도엽번호를 이름·코드로 맞춰 붙이거나 같은 통영시 도시정보시스템 자료끼리만 연결한다.
description_portal: 통영시 도시정보시스템에서는 도로 점용시설의 위치와 관리 현황을 체계적으로 파악하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 점용시설의 정확한 위치와 식별이 가능하며, 관리기관과 도로구간번호 정보는 시설의 유지관리와 행정적 책임을 명확히 하는 데 활용됩니다. 또한 차도·보도 구분, 점용물 관리코드 등은 시설의 유형과 특성을 세부적으로 구분하는데 중요합니다. 위도와 경도 좌표도 함께 제공되어 지도상에서 정확한 위치를 확인할 수 있으며, 이러한 정보는 도로 관리, 점용 허가, 안전 점검, 도시 계획 등 다양한 업무에 활용될 수 있는 핵심 자료로 사용됩니다.
