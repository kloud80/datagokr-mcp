summary_user: 전국 고속도로 차로제어시스템 구간별 정보를 담으며, 구간 식별자·구간명(CZ_NM)과 노선명·노선번호, 방향 관련 항목으로 구성된 비공간 데이터다. 교통 분석가나 도로 이용자가 어느 고속도로 노선의 어느 구간에서 차로제어가 운영되는지 확인할 때 쓴다. 전역 조인 키가 없어서 노선번호·노선명을 이름·코드로 맞춰 한국도로공사의 다른 고속도로 소통·돌발 데이터와 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하고 있는 노선명, 노선번호 등을 포함하고 있는 정보입니다.
