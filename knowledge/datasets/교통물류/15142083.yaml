description_portal: '교통카드 이용자 유형에 대한 정보를 의미하며, 이용자 유형은 아래와 같이 분류될 수 있습니다. - 경로(노인): 65세 이상 고령자, 요금 감면 또는 무임승차 혜택 제공이 가능함. / 국가유공자: 국가 헌신 인정받은 사람, 요금 면제 또는 할인 혜택 제공 가능. / 어린이: 6~12세, 대중교통 요금 50% 이상 할인. / 일반인: 할인 대상이 아닌 성인, 정가 요금 지불. / 장애인: 신체적/정신적 장애인, 요금 감면 또는 무임승차 혜택 및 이동권 보장 서비스 제공 가능. / 청소년: 13~18세, 요금 20~30% 할인, 경제적 부담 경감 정책 적용 대상임.'
