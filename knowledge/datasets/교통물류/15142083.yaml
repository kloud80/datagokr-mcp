summary_user: 교통카드 이용자 유형(일반인·어린이·청소년·경로·장애인·국가유공자 등)의 코드와 이름을 짝지은 전국 단위 비공간 코드표입니다. 교통카드 승하차·이용 데이터를 분석하는 사람이 '이 유형 코드는 어떤 이용자 구분을 뜻하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 교통카드 데이터와는 이용자 유형 코드(users_type_cd)나 유형명을 이름·코드 매핑으로 맞춰 이어 쓴다.
limits: 유형별 이용 건수나 요금 같은 실적 수치는 없고 코드와 명칭만 담는다. 전역 조인 키가 없어 다른 데이터와 붙일 때 코드·이름 대응을 직접 확인해야 하며, 개발계정은 하루 1,000회로 호출이 제한된다.
