summary_user: 경상북도 영천시에 등록된 이사화물업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업체명·인허가일자·업종·소재지 주소·데이터 기준일자를 담는다(CSV 338바이트 규모의 소량 자료). 영천에서 이사를 앞둔 시민이나 지역 운송업 현황을 보는 담당자가 "영천시에 등록된 이사화물업체는 어디이고 언제 허가받았나"를 확인하는 데 쓴다. 전역 조인 키가 없어 업체명이나 주소로 맞춰 이어야 하며, 허가 여부를 교차 확인할 때는 전국화물자동차운송사업자표준데이터와 업체명 기준으로 대조한다.
description_portal: 경상북도 영천시 소재 이사화물업 현황 데이터는 영천시 내에서 영업을 영위하는 이사화물업체들의 등록 현황을 체계적으로 정리한 자료입니다. 본 데이터는 각 업체의 업체명, 인허가일자, 업종, 소재지 주소,  데이터 기준일자 등의 정보를 포함하고 있으며, 영천시 지역 내 이사화물업체들의 등록 현황을 파악하는 데 유용하게 활용되며 지역 내 화물 운송업체의 현황 파악과 정책 수립, 행정 업무 수행에 기초 자료로 활용될 수 있습니다.해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 교통행정과로 연락주시기 바랍니다.
