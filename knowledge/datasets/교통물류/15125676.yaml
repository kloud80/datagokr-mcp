summary_user: 용인시 용인앱택시의 호출(요청)·탑승(출발)·도착 건수를 조회 연·월 기준 읍·면·동 단위로 집계해 담는다. 교통정책 담당자나 분석가가 "용인시 어느 동에서 앱택시 호출은 많은데 실제 배차·운행 완료는 적은가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 시/도·시/군/구·읍/면/동 이름(eupMyunDong)을 매핑해서만 이어 쓸 수 있다.
description_portal: 본 데이터는 용인시 용인앱택시 운행현황 조회 API를 통해 제공되는 지역별 택시 이용 통계를 확인하기 위한 자료이다. 조회 연·월을 기준으로 읍·면·동 단위의 호출건수, 탑승건수, 도착건수를 제공하여 특정 기간의 이동 수요와 서비스 이용 흐름을 파악할 수 있도록 구성하였다. 호출건수는 이용 요청 규모를, 탑승건수는 배차 성사 수준을, 도착건수는 운행 완료 건수를 의미하여 단계별 운행 효율성을 분석하는 지표로 활용된다. 본 데이터는 지역 교통 취약지 대응, 이동 패턴 분석, 수요 기반 교통정책 수립 등에 활용되는 기반 자료이며, 운행량 변화를 파악하여 서비스 품질 관리와 자원 배분의 근거로도 활용된다. 이를 통해 지역 맞춤형 이동 서비스 개선에 기여한다.
