description_portal: 전조등(변환빔) 정밀도검사는 자동차관리법 시행규칙 제68조(정밀도검사의 대상 기준 등)에 의하여 시행하고 있으며, 검사의 기준은 별표 12에 따라 시행하고 있습니다.2021년 부터 운행차의 자동차 검사는 기존 전조등(주행빔) 검사에서 전조등(변환빔) 검사로 변경되었으며, 신규 개발 제작된 기계 기구의 정밀도검사 불합격 현황 자료입니다.해당 자료는 접수본부, 업체구분, 기기명, 종별, 검사일, 재검일, 결과, 형식, 고유번호, 불합격 내용 총 10가지로 구성되어 변환빔 전조등시험기의 형식과 사용하는 업체구분, 검사구분, 검사결과, 불합격 내용 등 세부자료 활용으로 기계 기구 정밀도 확보를 위한 자료로 활용할 수 있습니다.
