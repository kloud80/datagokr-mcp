summary_user: 유도선 이용객 수를 연도·지역별로 집계하고 월별(1~12월)과 연간 합계로 나눠 담은 전국 통계 파일로, 포털 설명상 2011~2024년을 다룬다. 지자체·관광 분석가가 "코로나19 이후 우리 지역 유도선 이용객이 얼마나 회복됐고 어느 달에 몰리는가" 같은 수요 추이·계절성 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명(지역별)과 연도를 이름 매핑으로 맞춰 연결해야 한다.
description_portal: 이 파일은 2011년부터 2024년까지 유도선 이용객 수를 연도별로 정리한 자료이다. 각 연도별로 유도선을 이용한 총 승객 수가 기록되어 있어, 이용 추이와 증감 현황을 파악할 수 있다. 예를 들어, 특정 해에는 이용객 수가 크게 증가하거나 감소한 해가 확인되며, 이러한 변동은 관광 수요 변화, 안전사고, 코로나19 팬데믹 같은 외부 요인의 영향을 받았을 가능성이 있다. 특히 2020~2021년에는 코로나19의 여파로 이용객 수가 현저히 줄어드는 패턴이 드러나고, 이후 점진적으로 회복하는 모습이 보인다. 이 자료는 유도선 산업의 수요 분석, 정책 수립, 관광산업 계획 등에 중요한 기초 데이터로 활용될 수 있으며, 향후 이용객 수 예측이나 안전관리 계획 수립에도 유용하다. 또한 지역 경제 활성화와도 직결되는 수치로서, 해운·관광 관련 기관이나 지자체가 참고하기 적합한 통계 자료라고 할 수 있다.
