description_portal: '데이터 개요국내 항공기 정비조직에 대한 인증 현황을 관할청 및 인증 범위별로 제공하는 공공데이터입니다.이 데이터는 국토교통부 산하 지방항공청별로 인증한 국내외 항공기 정비조직의 수를 인증범위별로 구분하여 제공합니다. 인증 유형은 일반적으로 국내 인증(국제운송, 소형항공기, 항공기사용사업, 전문정비조직)과 해외 인증(북미, 오세아니아, 유럽, 남미, 아시아)으로 구분되며, 인증조직의 지역별 분포와 항공기 유지관리 인프라 현황을 파악하는 데 활용됩니다.데이터 제공 항목관할청해당 정비조직 인증을 수행한 국토교통부 지방항공청 (예: 부산지방항공청, 서울지방항공청)국제운송국제항공기 운송사업자용 대형 정비조직 인증 수소형소형 항공기를 위한 정비조직 인증 수항공기사용사업농업, 산림, 교육, 응급 등 항공기사용사업용 정비조직 인증 수전문특정 부품, 장비 또는 시스템을 대상으로 한 전문정비조직 인증 수북미/오세아니아/유럽/남미/아시아각 지역에서 국외 정비조직으로 인증된 수, 국제 협정 또는 상호인정협정에 따른 인증 가능활용 안내정비 인프라 분석: 지역별 항공정비 산업의 분포 및 역량 파악항공산업 정책수립: 항공정비 전문인력 및 시설 확충 계획 수립에 활용국제 정비시장 진출 기초자료: 해외 인증조직 수 확인을 통한 경쟁력 분석운항 안정성 확보: 정비조직 인증 범위를 통한 감항성 및 정비 품질 관리 기반 마련데이터 해석 시 유의사항동일 정비조직이 복수 항목(예: 국내 및 해외)으로 중복 인증을 받는 경우가 있음‘총계’는 단순 합계이므로 중복 포함 여부를 고려한 해석 필요인증 건수는 정기적으로 갱신되며, 실제 운영 현황과 차이가 있을 수 있음국제 인증은 해당국 항공당국과의 상호 인증 협약 유무에 따라 제한될 수 있음'
