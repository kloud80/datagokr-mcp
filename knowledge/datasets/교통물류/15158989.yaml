summary_user: "부산도시철도의 출발역·도착역 구간별로 이동거리(0.1km 단위), 표준 이동시간과 정차시간(초 단위), 환승역 여부를 담는 API 데이터다. 경로 안내 앱 개발자나 교통 분석가가 '서면역에서 안평역까지 몇 km이고 몇 분 걸리나'처럼 구간 거리·소요시간을 계산하거나 노선별 정차·환승 패턴을 분석하는 데 쓴다. 전역 조인 키는 없고 부산교통공사 자체 역 코드(startSc·endSc, 예: 신평 101)나 역명으로 같은 기관의 역·시간표·승하차 데이터와 맞춰 잇는다."
limits: 이동시간은 표준 시각이라 실제 운행시간과 차이가 날 수 있다. 필수 파라미터 act는 다른 데이터에서 먼저 받아 넘겨야 하는 코드이며, 개발계정은 일 1,000회로 호출이 제한된다. 공용 역 코드가 없어 타 기관 철도·버스 데이터와는 역명 매핑으로만 연결된다.
