summary_user: SRT 정차역별 하차인원을 연도·상하반기·주별 평균으로 집계한 파일로, 행(구분)마다 기간을 두고 수서·동탄부터 여수엑스포까지 역 33곳이 각각 열로 들어 있다. 철도·지역 분석가가 'SRT 어느 역에서 내리는 승객이 상반기와 하반기에 얼마나 다른가', '노선 확대 이후 새 역의 하차 수요가 어느 정도인가'를 볼 때 쓴다. 전역 조인 키나 역 코드가 없어 다른 승하차·역 데이터와는 역 이름을 맞춰 붙여야 한다.
limits: 역이 행이 아닌 열로 펼쳐진 형태이고 표준 역 코드가 없으므로, 다른 데이터와 연결하려면 이름 매핑이 먼저 필요하다. 주별 평균 집계라서 날짜별·시간대별 하차나 출발-도착(OD) 흐름은 알 수 없다.
