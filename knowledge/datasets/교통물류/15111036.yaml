summary_user: 대전광역시 전역에 설치된 횡단보도를 한 건씩 구·동·지번과 위도·경도 좌표로 담은 건별 위치 파일(CSV, 약 530KB)이며, 포털 설명상 2020년 기준 교통안전시설물관리시스템 등록 정보를 바탕으로 한다. 보행환경을 평가하는 분석가나 행정 담당자가 '우리 동네 어느 지번에 횡단보도가 있고, 동별로 몇 개나 설치돼 있나'를 지도에 찍거나 세어 보는 데 쓴다. 전역 조인 키는 없어서 구명·동명·지번을 이름으로 맞추거나 위도·경도로 공간 결합하는 방식으로 대전시의 보호구역·단속카메라 같은 다른 교통안전시설 데이터와 이어 쓴다.
description_portal: 대전광역시 2020년 횡단보도 통계 및 현황 자료는 대전광역시 전역에 설치된 횡단보도의 위치와 관련 통계 정보를 체계적으로 정리한 자료입니다. 이 자료에는 각 횡단보도의 위치 좌표, 설치 도로명, 관리기관, 설치 유형 등 다양한 항목이 포함되어 있으며, 대전시 교통안전시설물관리시스템에 등록된 정보를 기반으로 합니다. 이 자료는 교통안전 정책 수립, 도로 인프라 개선, 보행환경 평가, 연구 및 행정업무 등 다양한 분야에 활용됩니다. 본 자료는 2022년 공공데이터 기업매칭지원사업의 일환으로 구축되었습니다.
