summary_user: 한국철도공사가 철도통계연보로 공개하는 화차 보유 현황을 적재하중 등급별로 집계한 표로, 하중 등급마다 전체 보유량과 유개차·무개차·평판차·유조차·차장차 등 차종별 대수를 담는다(전국 단위, csv 730바이트 규모의 소형 파일). 물류 분석가나 정책 담당자가 '국내 화물철도의 화차는 어느 적재하중 등급·차종에 몰려 있는가'처럼 화물 수송 역량의 구조를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 철도 화물 통계와는 차종명·하중 등급 이름을 맞추거나 같은 기관(한국철도공사) 자료끼리 연도 기준으로 나란히 놓고 쓴다.
description_portal: '‘한국철도공사_화차 하중별 보유현황’ 데이터는 매년 한국철도공사가 철도통계연보를 통해 공개하는 자료로, 화물열차용 화차(貨車)의 적재 하중별 보유 현황을 표 형식으로 정리하고 있습니다. 주요 항목은 각 화차의 적재하중(화물 적재 가능 최대 중량), 다양한 종류(유개차, 무개차, 평판차, 소화물차, 유조차, 침식차, 차장차 등), 해당 종류별 보유 대수, 그리고 단위 등입니다. 최근 연도 기준(2024년 발표)은 총 27개 행에 걸쳐, 각 하중 등급 및 차종별 보유량이 구체적으로 제공됩니다. 데이터는 CSV, XML, JSON 등 오픈 포맷으로 누구나 무료로 다운로드할 수 있습니다.이 데이터를 통해 확인할 수 있는 인사이트는 다음과 같습니다. 전국 철도 화차의 전체 규모 및 하중 등급별, 차종별 보유 현황을 객관적으로 파악할 수 있기에, 국내 화물철도의 적재 역량·용량, 수송체계의 구조적 특성, 주요 화차 종류와 그 트렌드(예: 컨테이너화차, 유조차, 평판차 등), 신규 도입 및 퇴역 차량의 변동 추이, 하중별 운송 트렌드, 특정 하중·차종에 대한 수요 변화, 노후 화차 비율 등도 유추할 수 있습니다. 이를 토대로 물류 거점별 효율성 분석, 노선별 중량 분포 최적화, 산업별 수송량 배분, 미래 화차 운용 전략 및 투자 방향을 모색할 수 있습니다.참고자료로서는 다음과 같은 분야에서 활용됩니다. 정부 및 철도공사의 물류·운송 정책 수립, 화물 수송 전략·투자계획, 연차별 차량 조달·재배치, 노후 차량 퇴역 기준 및 신규 화차 도입 계획의 근거자료로 매우 중요합니다. 또한 학계 및 연구기관의 수송용량 분석, 산업 및 물류기업의 운송계획·가격 정책 수립, IT 시스템(운송 네트워크 최적화·시뮬레이션 등), 환경 정책(친환경 대체차량 검토), 물류 DB 네트워크 구축 등에서 신뢰도 높은 기초 데이터로서 핵심적인 참고 가치를 갖고 있습니다.'
