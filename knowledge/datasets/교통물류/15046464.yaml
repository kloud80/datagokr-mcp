description_portal: '○ 통계개요* 통계명 : 도로시설물* 통계종류 : 서울시 도로시설물 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도로법」에 의해 교량, 터널 등 도로에 설치되어 도로의 기능을 하는 시설물* 작성목적 : 서울시에서 설치ㆍ관리하는 도로시설물 현황을 파악하여, 도로시설물에 대한장래계획을 수립하고 구조물 유지관리 및 도로행정에 필요한 기본자료를 제공하는 것을 목적으로 함* 조사체계 : 도시기반시설본부 및 자치구 → 서울특별시 도로시설과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 도로시설물별(고가차도, 입체교차로, 터널 등)ㆍ관리주체별연장 및 면적 현황 등'
