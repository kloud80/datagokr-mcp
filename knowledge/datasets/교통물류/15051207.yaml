summary_user: 인천지하철 2호선 휴일 하선(검단오류역→운연역 방향) 열차 한 편을 한 행으로 두고, 시발역·종착역·운행순번과 검단오류부터 운연까지 27개 역의 출발시각을 열로 담은 시각표 파일(csv, 약 48KB)이다. 휴일에 특정 역에서 운연 방향 첫차·막차가 몇 시인지 확인하거나, 역별 배차 간격과 운행 밀도를 분석하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 역 이름 열을 기준으로 같은 기관의 평일·상선 시각표나 역별 이용 통계와 이름을 맞춰 이어 쓴다.
description_portal: 인천지하철 2호선 휴일 검단오류역에서 운연역 방향 열차운행시각표 정보로 시발역, 종착역, 열차운행순번, 경유역(검단오류역 ~ 운연역) 출발시각 항목으로 구성되어 있습니다.2호선은 검단오류역에서 운연역까지 총 27개역을 운영하고 있습니다.대부분의 데이터의 시발역은 검단오류역이고 인천시청역, 서부여성회관역, 검암역이 시발역인 데이터가 각각 1건씩 존재합니다.모든 데이터의 종착역은 운연역입니다. 휴일 하선의 열차운행은 05시 30분에서 시작하여 익일 01시 05분에 종료됩니다.
