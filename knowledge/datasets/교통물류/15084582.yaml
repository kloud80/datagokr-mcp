description_portal: '데이터셋에는 굴착 공사와 관련된 다음과 같은 핵심 속성들이 포함되어 있습니다관리번호: 개별 도로 굴착 사업을 식별하고 추적하기 위한 고유한 식별자입니다.구분: 굴착 행위의 성격이나 목적을 분류하는 항목입니다 (예: 상하수도 공사, 통신선 매설, 전기 공사 등).굴착연장: 도로를 굴착한 총 길이를 나타내는 정량적 정보로, 공사의 규모를 파악하는 데 중요합니다.신청부서: 굴착 공사를 신청한 기관 또는 부서의 정보입니다.사업구역: 굴착이 이루어진 도로의 특정 위치 또는 구역 정보를 제공하여 지리적 현황 파악을 용이하게 합니다.공종: 실제 굴착 공사에서 수행되는 세부적인 작업 종류를 명시합니다.굴착신청년도: 굴착 공사가 신청된 시점을 기록하여 연도별 굴착 발생 추이를 분석할 수 있게 합니다.'
