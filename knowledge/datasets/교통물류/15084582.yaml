summary_user: 경상남도 사천시에서 신청된 도로굴착 공사를 관리번호 단위로 한 건씩 담은 작은 파일(약 3KB CSV)로, 굴착 구분, 굴착연장(미터), 신청부서, 사업구역 위치와 노선, 공종, 굴착신청연도, 착공월을 기록한다. 주민이나 사업자가 '우리 동네 도로에 언제 어떤 굴착 공사가 들어오나'를 확인하거나, 분석가가 사천시 연도별 굴착 발생 추이와 공사 종류를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업구역 위치나 노선 이름을 맞추거나, 같은 사천시 기관이 낸 데이터끼리만 이어 쓴다.
limits: 사천시 한 개 시군구만 다루고 좌표가 없는 비공간 자료여서 지도 위 위치는 사업구역 위치·노선 이름으로만 짐작한다. 명세상 갱신은 수시·이벤트 주기라 정기적으로 최신 굴착 허가가 반영된다고 보기 어렵다.
