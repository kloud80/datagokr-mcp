summary_user: 부산교통공사가 관리하는 부산 도시철도 역의 휴대폰 충전설비를 역·설비 위치 단위로 담은 파일(csv, 약 9KB)로, 노선명·역명·역층·상세위치·충전설비 수·이용요금·전화번호를 담는다. 부산 지하철 이용객이 '어느 역 몇 층 어디에 휴대폰 충전기가 있고 요금은 얼마인가'를 확인하거나, 분석가가 노선별 충전설비 설치 현황을 비교하는 데 쓴다. 전역 조인 키나 역 코드가 없어 다른 역 정보 데이터와는 노선명·역명 문자열을 맞춰 연결해야 한다.
description_portal: 부산교통공사에서 관리하는 부산 소재 역들의 휴대폰충전설비에 대한 철도운영기관명,선명,역명,역층,커넥트구분,상세위치,충전설비수,이용요금,전화번호 입니다.지하철 5호선 새 전동차에는 휴대전화를 충전할 수 있는 무선 급속충전 설비도 설치됐다. 휠체어석이 위치한 2칸과 중앙 2칸에서 무선 급속 충전을 이용할 수 있다. 충전이 완료될 때까지는 약 2시간이 소요되지만, 배터리가 없어 막막한 상황에서는 지하철을 이용하는 잠깐의 시간을 이용해 요긴하게 사용될 것 같다.특히 서울 지하철 5~8호선 지하철역에서 휴대용 휴대폰 충전기를 무료로 빌려준다. 3시간까지 무료이고, 원하는 지하철역에서 반납할 수 있다.
