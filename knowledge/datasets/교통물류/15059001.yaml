summary_user: 경기도 시군별 인허가 자료를 바탕으로 마을버스 운송업체를 한 업체당 한 건씩 담으며, 사업장명·인허가일·영업상태·폐업일·면허 유효기간·업체유형과 소재지 주소·위경도를 포함한다. 교통 분석가나 지자체 담당자가 '우리 시군에 영업 중인 마을버스 업체가 어디에 몇 곳 있나'를 확인하거나 업체 분포를 지도에 올릴 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 경기도의 다른 데이터와 이름·코드를 맞춰 연결해야 한다.
description_portal: 경기도 내 마을버스업체 현황 데이터는 시내버스나 광역버스가 닿지 않는 지역 주민들의 이동권 보장을 위해 운영되는 마을버스 관련 업체 정보를 종합적으로 제공한다. 마을버스는 주로 대중교통이 원활히 연결되지 않는 고지대, 외곽지역, 미운행지역 등을 운행하면서 주거지와 주요 교통거점인 일반버스 정류장, 지하철역, 시내 중심지를 연결하는 역할을 수행한다. 따라서 이 데이터는 단순한 업체 현황 이상의 의미를 가지며, 지역 교통 사각지대 해소와 교통 복지 측면에서 중요한 정책적 자료로 활용될 수 있다.데이터에는 사업장명, 인허가일자, 영업상태, 폐업일자와 같은 행정 정보는 물론 등록일자, 면허 발급일자 및 유효기간, 소유형태와 업체유형, 지정정비업종 코드 및 명칭 등과 같이 업체의 운영 방식과 안전 관리 현황을 파악할 수 있는 항목이 포함되어 있다. 또한 사업장 소재지에 대한 도로명주소, 지번주소, 우편번호와 WGS84 위도·경도 좌표가 제공되어 지도 기반 공간분석 및 위치 시각화가 가능하다.본 데이터는 경기도 31개 시군별 인허가 데이터를 기반으로 수집되었으며, 지방행정데이터개방시스템을 통해 제공된다. 다만, 해당 시스템의 전면 개편으로 인해 2018년 9월 6일부로 데이터 갱신이 중단된 상태이므로 이후 변화된 현황은 최신 행정 데이터를 참고해야 한다.이 데이터는 지역별 마을버스 업체의 분포를 분석하거나 교통 취약지역을 파악하는 데 활용될 수 있으며, 향후 교통 정책 수립, 마을버스 노선 최적화, 대중교통 인프라 확충, 주민 이동권 개선 등에 유용하게 쓰일 수 있다. 특히 교통약자 이동 지원 정책, 농촌 및 외곽지역 생활권 개선, 지속가능한 교통망 구축을 위한 기초 자료로도 중요한 의미를 가진다.
