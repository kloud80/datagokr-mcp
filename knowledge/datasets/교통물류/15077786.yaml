summary_user: 서울시 따릉이 대여소별 시간대 단위 운영현황을 담은 외부 API 데이터로, 최근 7일 이내의 대여 가능 자전거 수(parkingBikeTotCnt), 거치율(shared), 대여소 위치(위도·경도)를 제공한다. 이용자나 분석가가 특정 시간대에 어느 대여소에 자전거가 얼마나 남아 있었는지 확인하는 질문에 쓴다. 대여소 식별자(stationId)와 좌표로 다른 서울시 자전거 데이터와 맞춰 볼 수 있으나, 실측 컬럼에서 전역 조인 키는 찾지 못해 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
limits: data.seoul.go.kr 인증키(path 파라미터 KEY)가 필요하며 포털 활용신청과는 별개다. 포털 설명상 최근 7일 이내만 조회되고 시간 단위로만 표시되며, 한 번에 최대 1,000건을 넘길 수 없다. 전역 조인 키가 없어 다른 데이터와 결합할 때 이름·코드 매핑이 필요하다.
