summary_user: 광주 동구 관내 불법 주정차 단속을 건별로 담은 파일로, 위반 일자·시간·위반장소명·과태료를 기록하며 범위는 시군구 단위 개별 위치이고 CSV 약 5MB 규모다. 동구 주민이나 교통 분석가가 '어느 장소·시간대에 불법 주정차 단속이 몰리는가'를 따져 상습 위반 구간이나 집중 단속 지역을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위반장소명을 주소·좌표로 바꾸거나 이름을 맞춰 연결해야 하며, 어린이보호구역 등 제공표준 데이터와도 이 방식으로 이어 쓴다.
