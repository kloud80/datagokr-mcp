summary_user: 부산광역시에 설치된 교통 CCTV를 한 대씩 담은 현황 데이터로, 설치 위치·영상 주소(hlsAddr)·경도·위도를 개별 좌표 단위로 제공한다. 운전자나 교통 서비스 개발자가 '지금 이 도로 구간 상황을 영상으로 확인하려면 어느 CCTV를 봐야 하나'를 찾거나 지도에 CCTV 위치를 표시하는 데 쓴다. 전역 조인 키가 없어 다른 교통 데이터와는 경도·위도 좌표를 이용한 공간 매칭이나 설치위치 이름 매핑으로만 연결한다.
description_portal: 부산광역시 내 설치된 교통 CCTV에 대한 데이터로 교통 CCTV의 설치 위치, 영상 주소, 경도, 위도 등의 현황 정보를 제공합니다.
