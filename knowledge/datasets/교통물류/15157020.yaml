description_portal: 수요응답형 교통체계, 일명 DRT(Demand Responsive Transport)는 정해진 노선과 시간표에 맞춰 운행하는 기존 버스와 달리, 승객의 호출에 따라 실시간으로 노선을 변경하며 탄력적으로 운행하는 맞춤형 모빌리티 서비스입니다. 전통적인 버스가 정해진 길로만 다녔다면, DRT는 승객의 수요에 반응합니다. 똑타 앱 이용 또는 전화를 통해 출발지와 목적지를 입력하면, AI알고리즘이 실시간으로 가장 최적화된 경로를 계산하여 버스를 보내주는 방식입니다.  신도시 거주자 (아직 버스 노선이 부족해 지하철역까지 가기 힘든 분), 교통 소외 지역 주민(버스 배차 간격이 너무 길어 이동이 불편한 어르신이나 학생들), 승객이 적은  시간대에도 안전하고 편리하게 이동하고 싶은 분들에게 유용한 서비스 입니다.
