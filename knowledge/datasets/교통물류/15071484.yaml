status: active
summary_user: SRT 노선별 월간 수송실적을 운행월을 행으로, 연도·노선을 열로 놓은 집계표로 담으며, 2016~2022년은 경부선·호남선, 2023~2025년은 경전선·동해선·전라선까지 포함하고 연도별 전체 합계 열이 있다. 철도 수요 분석가나 지역 관계자가 'SRT 호남선 이용 실적이 연도·월별로 어떻게 변했나', '경전선·전라선 개통 뒤 수송량은 얼마인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연월과 노선명을 기준으로 이름을 맞춰 붙여야 한다.
limits: 전국 단위 노선별 월 합계만 있어 역별·시간대별 승하차나 출발·도착(OD) 분석에는 쓸 수 없다. 표준 조인 키가 없어 노선명·연월을 직접 매핑해야 하며, 일부 연도에는 노선 열이 없고 파일의 빈 칸은 '데이터 없음'으로 처리된 것이므로 0으로 읽지 않는다.
