summary_user: 대전광역시 도로관리시스템에 등재된 과속방지턱을 한 건씩 담은 원천 목록으로, 위치(WKT 지리정보)·관리번호·도로구간번호·폭원·연장·행정읍면동·도엽번호를 담으며 범위는 대전광역시, 행정단위는 읍면동이다. 교통안전 담당자나 분석가가 어린이보호구역·학교 주변·주택가 같은 취약지역에 과속방지턱이 얼마나 설치돼 있는지, 어느 구간에 부족한지를 지도에서 확인하는 데 쓴다. 전역 조인 키는 없어서 행정읍면동 이름 매핑이나 WKT 좌표를 이용한 공간 결합으로 어린이보호구역·교통사고 위치 데이터와 겹쳐 본다.
description_portal: 대전광역시 과속방지턱 현황 데이터는 대전광역시 도로관리시스템에 등재된 과속방지턱의 위치, 관리번호, 도로구간번호, 폭원, 연장, 행정읍면동, 도엽번호 등 다양한 정보를 포함하고 있습니다. 이 데이터에는 각 과속방지턱의 지리정보 값이 포함되어 있어, 공간분석 및 지도 시각화, 교통안전 정책 수립, 도로시설물 유지관리 등 다양한 행정적 목적에 활용됩니다. 또한, 과속방지턱의 설치 현황을 바탕으로 어린이보호구역, 학교 주변, 주택가 등 교통사고 취약지역에 대한 맞춤형 안전대책 마련에 활용할 수 있으며, 노후 또는 미설치 구간의 개선 필요성 평가, 도로별 교통흐름 분석, 보행자 안전 확보 등에도 중요한 기초자료로 쓰입니다.
