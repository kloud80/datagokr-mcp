summary_user: 광주 북구에 소재한 법인택시 업체를 업체 한 곳당 한 행으로 담은 목록으로, 회사명·본사 도로명주소(괄호 안 법정동 병기)·전화번호·팩스번호·데이터기준일자를 담는다(CSV 1,838바이트 규모의 소량 파일). 북구에 어떤 택시회사가 있고 연락처가 무엇인지 확인하려는 주민이나, 지역 택시 운수업체 분포를 파악하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 회사명이나 주소(법정동)를 이름 매핑해 붙이거나 같은 기관의 다른 데이터와 나란히 보는 식으로만 이어 쓴다.
limits: 범위가 북구 한 시군구에 한정돼 광주 전체나 다른 구의 법인택시 현황은 담지 않는다. 업체 식별 코드가 없어 다른 데이터와 연결할 때는 회사명·주소 문자열 매칭에 의존해야 한다.
