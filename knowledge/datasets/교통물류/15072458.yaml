summary_user: 유가보조금관리시스템 사용자를 대상으로 매년 실시한 만족도 조사 결과를 연도·문항별로 집계한 파일로, 전체 대상 수·응답 인원·평균점수와 매우 만족부터 매우 불만족까지의 응답 분포를 담는다(포털 설명상 2017~2024년, 전국 단위·비공간). 화물·택시·버스 유가보조금 업무를 맡은 담당자나 정책 분석가가 '시스템 활용도·이용편의성 만족도가 해마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 같은 기관(국토교통부) 기준으로만 느슨하게 맞춰 볼 수 있다.
limits: 집계된 설문 결과라 개별 응답자·운송업종별·지역별 만족도는 볼 수 없다. 조인 키가 없어 유가보조금 지급 실적 등 다른 데이터와 행 단위로 연결되지 않는다.
