summary_user: 경기도 도로대장 전산화 시스템에서 관리하는 생태통로를 시설 단위로 담은 원천 목록으로, 노선번호·구간번호·시점 위치와 방향, 통로 유형, 가로·세로·길이 규모, 식생·유도시설 같은 부대시설의 구분·수량·규격, 설치일자를 기록한다. 도로·환경 분야 분석가가 "경기도 어느 도로 노선의 어느 구간에 어떤 형식과 규모의 생태통로가 언제 설치됐는가"를 확인하거나 야생동물 이동경로 단절 구간을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선번호·구간번호나 위치 이름을 맞춰 연결해야 하며, 표준노드링크(link_id·node_id)와 바로 이어지지 않는다.
description_portal: "이 데이터는 도로대장전산화시스템을 기반으로 수집된 생태통로 설치 현황에 대한 자료로, 도로로 인해 단절된 야생 생물 서식지 연결 및 생태계 보전을 위해 설치된 구조물 정보를 담고 있습니다. 주요 항목은 '서비스ID', '노선번호', '구간번호', '위치?시점', '위치?방향', '유형', '규모_가로(중앙폭)', '규모_세로', '규모_길이', '시설물현황_구분', '시설물현황_수량', '시설물현황_규격', '설치일자', '관리번호부여년도', '비고' 등이 포함됩니다. 데이터는 생태통로의 형식(예: 터널형), 식생 및 유도시설 현황 등 환경보호 목적의 구조물 관리 및 성능 분석, 친환경 도로 설계, 생물 이동경로 확보 및 생태계 단절 방지 정책 수립 등에 활용될 수 있습니다."
