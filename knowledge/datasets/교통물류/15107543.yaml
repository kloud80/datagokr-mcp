summary_user: 행정안전 통계연보의 '행정관리·정부서무' 중 공무원 통근버스 운행 통계를 담은 집계 데이터로, 정부청사(대전·과천·서울·세종)별 운행대수 등 운행 현황을 제공하는 전국 단위 비공간 통계다. 정책 분석가나 연구자가 '정부청사별로 공무원 통근버스가 몇 대 운행되고 연도별로 어떻게 달라졌는가'를 확인할 때 쓴다. 실측 컬럼에서 공통 조인 키가 확인되지 않아, 다른 데이터와는 청사명 같은 이름 매핑이나 같은 기관의 다른 통계연보 항목과 맞춰 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '행정관리' 중 '정부서무', '공무원 통근버스 운행'에 관한 통계입니다. 정부청사(대전, 과천, 서울, 세종), 운행대수 등 공무원 통근버스 운행 관련 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
