summary_user: 대전광역시 도로관리시스템에 등재된 도로시설물 가운데 기타 시설로 분류된 면(폴리곤) 형태 시설물을 시설물별로 담은 파일로, 위치 도형(WKT)·지형지물부호·관리번호·행정읍면동·도엽번호·도로구간번호를 포함하며 범위는 대전시 전역, 행정단위는 읍면동입니다. 도로·도시시설 관리 담당자나 공간분석가가 '어느 동, 어느 도로구간에 어떤 기타 면적형 시설물이 있는가'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 도로구간번호·관리번호처럼 같은 기관(대전시 도로관리시스템)의 다른 도로시설물 파일과 맞춰 잇거나, WKT 도형으로 공간 결합해 쓴다.
