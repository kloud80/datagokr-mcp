description_portal: 이 데이터는 연료 종류 및 용도별로 등록된 자동차 수를 나타낸 표로, 각 연료 유형별로 ‘비사업용’과 ‘사업용’ 차량을 구분하여 승용, 승합, 화물, 특수 네 가지 차량 유형의 등록 대수를 집계하고 있다. 주요 연료 구분은 CNG, 경유, 수소, 전기, LPG, 휘발유 등으로 구성되어 있으며, 하이브리드 및 복합연료 차량도 별도 분류되어 있다. 예를 들어, ‘경유 비사업용 승용차’는 1,878대, ‘휘발유(무연) 비사업용 승용차’는 2,531대로 확인된다. 이 데이터는 지역 내 연료별 차량 분포를 분석하거나 친환경차 비율을 파악하는 데 활용할 수 있으며, 에너지 정책 수립, 배출가스 저감 대책, 자동차세 과세 기준 등의 행정 자료로도 유의미하다. 연도별 변화 추이를 추가로 연계하면 교통 및 환경정책의 효과 분석도 가능하다.
