summary_user: 인천항에 입항한 선박의 선석 이용 이력을 선박·항차 단위로 담는 건별 API로, 선박명·호출부호·입항일자·입항목적·선석코드, 선박 길이·너비·흘수, 하역회사·화물량 등을 제공한다. 항만 운영 분석가나 물류 사업자가 '특정 기간 인천항 어느 선석에 어떤 크기의 선박이 얼마나 자주 접안했는가'처럼 선석 이용 현황과 효율을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 호출부호(callLetter)·선박명이나 선석코드·청코드 같은 기관 내부 코드로 Port-MIS 입출항 신고 등 같은 계열 데이터와 맞춰 쓴다.
limits: 표준화된 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다. 범위는 전국·비공간으로 표기돼 있으나 위치 좌표는 없어 공간 분석에는 바로 쓰지 못하며, 개발계정은 일 10,000회 호출로 제한된다.
