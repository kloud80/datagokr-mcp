summary_user: 한국도로공사가 관리하는 전국 고속도로 암거를 한 건씩 담은 파일로, 암거명·관할 본부와 지사·용도(수로형·터널형)·노선·이정·폭·높이·연장과 X·Y 좌표를 포함한다. 수해 대비나 구조물 점검을 계획하는 분석가가 '특정 노선 어느 이정 구간에 수로형 암거가 몇 개 있고 규모는 어떤가'를 확인하거나, 정밀도로지도 작업에서 암거 위치를 찾는 데 쓴다. 전역 조인 키는 없으므로 노선명·이정으로 같은 기관의 다른 고속도로 시설물 데이터와 맞추거나, 좌표로 하천·침수 등 공간 데이터와 겹쳐 쓴다.
