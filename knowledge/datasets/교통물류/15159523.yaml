description_portal: 본 데이터는 한국도로공사에서 관리하는  데이터이다. 데이터는 암거명, 본부, 지사, 암거용, 노선, 이정, 폭, 높이, 연장, Y좌표, X좌표 등으로 구성되어 있습니다. 고속도로 암거 좌표는 도로 유지관리, 수해방지, 자율주행용 정밀도로지도 제작에 핵심적인 역할을 합니다. 본 데이터는 구조물의 유지보수, 환경영향평가 등 다양한 행정업무 및 연구에 유용하게 활용될 수 있다. 고속도로의 암거 좌표는 수로형, 터널형으로 구분되어 있으며 암거의 상세정보를 포함하고 있습니다. 또한 이 데이터는  정밀도로지도 제작 등에도움이 될 수 있습니다.
