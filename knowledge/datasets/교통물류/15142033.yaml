summary_user: 전국 도시철도 노선 정보를 운행일자·권역·노선·출발역·도착역 단위로 담는 API 데이터로, 검증 시 전체 66건이 2025-08-01 한 날짜 기준으로 수신됐다. 시민이 특정 권역의 도시철도 노선과 구간(출발역→도착역)이 어떻게 구성되는지 확인하거나, 분석가가 노선망 현황을 정리할 때 쓴다. 전역 조인 키가 없어 노선ID(rte_id)나 노선명·역명 매핑, 같은 기관 코드로만 다른 철도 데이터와 이어 쓴다.
