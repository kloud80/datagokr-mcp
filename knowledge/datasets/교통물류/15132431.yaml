summary_user: 전국 기계식주차장치를 시도·시군구별, 장치 종류별(2단식·다단식·수직순환식·승강기식·평면왕복식 등)로 집계한 파일로, 값은 장치 개수가 아니라 종류별 대수(2단식은 면수)이며 포털 설명상 2022년 말 기준 자료다. 지자체 주차 담당자나 분석가가 '우리 시군구에는 어떤 형식의 기계식주차장치가 얼마나 몰려 있나'를 확인해 안전점검·관리 수요를 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 행정표준코드를 따른다고 안내된 시도·시군구 코드나 지역명 매핑으로 인구·주차장 원장(전국주차장정보표준데이터) 같은 지역 통계와 붙여 쓴다.
limits: 개별 주차장이나 장치 단위 위치·관리번호가 없는 지역 집계라 특정 주차장과 직접 연결할 수 없고, 실시간 주차 가능 대수와도 무관하다. 수치는 장치 개수가 아닌 대수이고 공란은 해당 값 없음을 뜻하므로 0과 구분해 해석해야 한다.
