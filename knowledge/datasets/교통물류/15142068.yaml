summary_user: 버스 노선의 운행일자·시간대·정류장 순서별 혼잡도를 시군구·읍면동 단위 행으로 담은 API로, 검증 시 전국 780행이 확인됐다. 대중교통 운영 담당자나 분석가가 특정 노선의 어느 시간대·구간에 승객이 몰리는지, 배차 간격이나 차량 투입을 어떻게 조정할지 살필 때 쓴다. 시군구코드(sgg_cd)와 정류장ID(sttn_id)를 키로 정류장·노선 원장이나 지역 단위 데이터와 이어 쓴다.
description_portal: 노선별 혼잡도 데이터는 특정 버스 노선에서 시간대별, 구간별로 승객 밀집도를 정량적으로 측정한 자료로, 대중교통 운영의 효율성 향상과 승객 편의성 개선을 위한 핵심 자료로 활용됩니다. 이 데이터를 통해 혼잡이 집중되는 시간대와 구간을 정확히 파악할 수 있으며, 이를 기반으로 추가 차량 투입, 배차 간격 조정, 정류장 재배치, 대형 차량 도입, 교통 인프라 개선 등의 대책을 수립할 수 있습니다. 나아가 운영비 절감과 서비스 품질 향상에도 크게 기여할 수 있습니다. 노선별 서비스 수준을 알아볼 수 있는 지표입니다.
