summary_user: 대전광역시 서구 관내 기계식주차장을 건물 단위로 한 줄씩 담은 현황 파일로, 건물명·지번·도로명주소와 행정동·법정동, 총설치대수·총설치기수를 담는다. 서구 주민이나 분석가가 "우리 동네 어느 건물에 기계식주차장이 몇 기·몇 대 규모로 설치돼 있나"를 확인하거나 동별 분포를 볼 때 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 인구·건축물 등 다른 데이터와 잇고, 전국주차장정보표준데이터(주차장 원장)와는 주소를 기준으로 대조한다.
limits: 대전 서구 한 개 시군구만 담고 요금·운영시간·실시간 주차 가능 대수는 없어서, 실시간 정보는 지자체·공단별 별도 API에서 찾아야 한다. 주차장관리번호 같은 표준 식별자가 없어 전국주차장정보표준데이터와 맞출 때는 주소로 대조해야 한다.
