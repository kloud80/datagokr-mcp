summary_user: 대구 도시철도 2호선 각 역에 설치된 에스컬레이터를 한 대씩 담은 시설 목록으로, 운영기관·노선·역명·상하행 구분·출입구 번호·상세 위치·시작층과 종료층을 기록한 CSV 파일(약 20KB)이다. 교통약자나 이동 편의 서비스 개발자가 '이 역의 몇 번 출입구에 에스컬레이터가 있고 어느 층에서 어느 층으로 이어지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역·출입구 데이터와는 역명·출입구 번호를 이름 기준으로 맞춰 이어 써야 한다.
description_portal: '대구2호선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 상하행구분, 출입구번호, 상세위치, 시작층, 종료층의 데이터가 있습니다.에스컬레이터(영어: escalator, 문화어: 계단승강기), 또는 자동계단(自動階段)은 건물이나 지하도 등에서 층과층 사이에 사람을 태우고 운반하는, 움직이는 계단 형태의 수직 이동수단을 말한다. 경사도 30도 이하의 장소에 설치되며, 경사도 12도 이하의 평면형 플랫 에스컬레이터는 무빙워크라고 한다. 정격 속도는 하향 방향의 안전을 고려하여 0.5m/초 또는 30m/분 이하로 수송 능력과 내측 패널로서 매시 5,000 ~ 8,000명 정도이다. 구동기, 메인 드라이브(main drive), 구동체인, 조속기 및 머신 브레이크 등으로 구성된다.'
