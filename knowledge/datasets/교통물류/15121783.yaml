summary_user: 경상북도 봉화군 관내 버스정류장을 한 행씩 담은 원장 파일로, 정류장 ID·한글명·정류장유형(공용·전용 등)·관할관청과 위도·경도 좌표를 담는다(CSV 약 34KB, 포털 설명상 기준일 2025년 8월 18일). 군청·교통 분석가가 "봉화군 마을별로 걸어서 갈 만한 거리에 버스정류장이 있는가" 같은 대중교통 접근성·정류장 분포 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 좌표로 공간 결합하거나 정류장명·정류장 ID를 노선·도착정보(TAGO·지자체 BIS) 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
limits: 정류장 위치·유형만 담고 경유 노선, 운행 시간표, 실시간 도착, 승하차 인원은 없다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 기관 정류장 데이터와 연결하려면 이름·코드 매핑이나 좌표 대조가 필요하다.
