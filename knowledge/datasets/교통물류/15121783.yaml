description_portal: '이 데이터는 도로 위에 설치된 버스정류장의 위치 및 특성을 정리한 자료로, 대중교통 접근성과 정류장 분포를 파악하는 데 활용됩니다. 각 정류장의 고유 ID, 명칭, 정류장 유형, 위도 및 경도 좌표 등 위치 정보가 포함되어 있어 GIS 기반 공간분석 및 대중교통 기반시설 운영에 유용하게 쓰일 수 있습니다. 또한 정류장의 관할 관청 정보도 함께 제공되어 행정구역별 관리체계 수립 및 유지보수 업무에도 활용 가능합니다. 데이터는 총 7개 항목으로 구성되어 있으며, 기준일은 2025년 8월 18일입니다.순번: 데이터상 정류장의 일련번호입니다.관할관청: 해당 정류장을 관리하는 지방자치단체 또는 행정기관입니다.정류장구분(ID): 정류장의 고유 식별번호(ID)입니다.정류장 한글명: 실제 도로 위에 표기된 정류장의 명칭입니다.정류장유형: 공용, 전용 등의 유형 구분입니다.위도: 정류장이 위치한 위도 좌표입니다.경도: 정류장이 위치한 경도 좌표입니다.'
