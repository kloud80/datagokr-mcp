summary_user: 춘천시 시내버스 이용자를 대상으로 한 설문 응답을 한 건씩 담은 파일로, 응답자의 나이대·성별·주소, 출발·도착 장소, 환승횟수, 서비스·배차간격·정류장 만족도와 기타 의견을 기록한다. 춘천시 교통 담당자나 분석가가 '어느 출발·도착 구간에서 배차간격이나 정류장 만족도가 낮은가'를 살펴 노선 운영과 정류장 환경 정비 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어 정류장 원장이나 버스 도착정보와는 출발·도착 장소 이름을 정류장명에 맞춰 매핑해야 이어 쓸 수 있다.
description_portal: 해당 데이터는 2022년도 공공데이터 기업매칭 사업을 통해 구축된 춘천시 시내버스 이용객의 의견을 기반으로 수집된 정류장별 버스 민원 통합 데이터입니다. 실제 버스 이용자를 대상으로 설문을 진행하여 취합된 것으로, 시민들의 이용 경험과 만족도를 반영하고 있습니다. 주요 항목으로는 설문번호, 응답자나이대, 응답자성별, 응답자주소, 출발장소, 도착장소, 환승횟수, 서비스만족도, 배차간격, 정류장만족도, 기타특이사항, 등록일시, 등록자아이디, 데이터기준일 등이 포함되어 있습니다. 이 데이터는 춘천시 시내버스 운영 개선, 정류장 환경 정비, 교통 정책 수립 등의 행정적 의사결정에 있어 유용한 참고 자료로 활용될 수 있습니다.
