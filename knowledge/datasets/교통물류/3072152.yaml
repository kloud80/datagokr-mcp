summary_user: 부산광역시 횡단보도 가운데 신호등이 있는 곳을 한 건씩 담은 위치 파일로, 행정구역(구·동·리)과 지번, 교차로, 가로·세로 길이와 면적, 경도·위도를 담는다(포털 설명상 3,815개, 2025년 4월 23일 기준). 보행 안전 분석가나 지자체 담당자가 '어느 구·동에 신호 횡단보도가 몰려 있고 어디가 비어 있는가'를 지도로 확인하는 데 쓴다. 전역 조인 키는 없어서 경도·위도로 공간 결합하거나 구·동 이름과 지번을 맞춰 다른 부산 교통·보호구역 데이터와 이어 쓴다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와는 이름 매핑이나 좌표로만 연결된다. 범위는 부산광역시 한 곳이며 신호등이 있는 횡단보도만 담는다.
