summary_user: 한국공항공사가 운영하는 인천 제외 전국 14개 공항의 수송실적을 연도·요일·공항·노선별로 집계해 도착·출발 운항기수와 도착·출발 여객수를 담은 작은 CSV 파일(약 2.6KB)이다. 지역 관광·출장 수요를 보려는 분석가가 "김포·제주·김해 공항의 특정 노선에서 어느 요일에 여객이 가장 많이 오가는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 공항명·노선명을 공항코드 등으로 이름 매핑하거나 같은 기관(한국공항공사)의 다른 항공통계와 공항 이름 기준으로 이어 쓴다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개의 전국공항을 운영하는 기관입니다.한국공항공사에서 운영하는 공항의 지역별 수송실적, 노선별 수송실적, 요일별 수송실적, 운항도착/운항출발, 여객도착/여객출발 통계 정보를 제공합니다.해당 데이터로 김포공항, 제주공항, 김해공항 등 공항별 출도착 운항기수와 여객수를 쉽게 알 수 있습니다.추가 문의사항이나 추가 요구사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
