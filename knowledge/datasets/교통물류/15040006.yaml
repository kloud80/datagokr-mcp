summary_user: 여수시 관내 9개 항로 여객선의 항로·출발지·도착지·선박·객실등급별 운임을 일반 승객과 도서 주민으로 나누고, 다시 대인·중고생·경로·소아 유형별로 담은 운임표 파일(csv, 약 317KB)입니다. 도서 주민이나 여행객이 '여수에서 특정 섬까지 내 승객 유형이면 얼마인가', '도서민 할인이 일반 운임과 얼마나 차이 나는가'를 확인하거나, 지자체가 시민여객선 운임지원 사업의 예산을 산정할 때 쓴다. 전역 조인 키가 없어 다른 여객선 운항·결항 데이터와는 항로명·출발지·도착지·선박명을 이름으로 맞춰 연결해야 한다.
description_portal: 여수시 시민여객선 운임정보는 여객선 이용객에게 적용되는 운임 및 할인 기준에 관한 기초자료를 제공하는 데이터입니다. 여수시 관내 9개 항로를 운항하는 여객선사의 기본 운임 정보를 포함하고 있으며, 시민여객선 운임지원 사업 및 관련 행정업무에 활용됩니다.데이터에는 항로별 운임 정보와 함께 요금종류에 대한 기본 정보가 포함되어 있으며, 여객선 이용객 유형에 따른 운임 체계를 파악할 수 있습니다. 이를 통해 여객선 이용자는 항로별 운임 수준을 확인할 수 있고, 관계기관은 운임지원 사업 운영, 예산 관리, 통계 분석 및 정책 수립을 위한 자료로 활용할 수 있습니다.또한 본 데이터는 도서지역 주민의 교통복지 증진과 해상교통 서비스 개선을 위한 기초자료로 활용 가능하며, 여객선 운임지원 제도 운영, 이용 현황 분석, 항로별 운임 비교 및 관련 정보서비스 구축 등에 활용될 수 있습니다.
