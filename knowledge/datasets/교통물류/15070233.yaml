summary_user: 도로종류별로 경찰이 조사·처리한 인적 피해 교통사고의 사고건수, 사망자수, 중상자수, 경상자수, 부상신고자수를 전국 단위로 집계한 통계 파일이다. 교통안전 분석가나 정책 담당자가 "고속도로·일반국도·시도 등 어떤 도로종류에서 사망·중상 사고가 많이 나는가"를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로종류 이름을 매핑하거나 같은 기관(교통사고분석시스템) 통계와 나란히 놓아 쓴다.
description_portal: '- 도로종류별 교통사고 사고건수, 사망자수, 중상자수, 경상자수, 부상신고자수  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨 - 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
