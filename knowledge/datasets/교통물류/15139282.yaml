summary_user: 잠실광역환승센터(잠실역) 승강장별로 정차하는 버스 노선 번호와 목적지를 담은 소규모 현황표로, 승강장번호·정차노선·목적지가 한 행씩 정리돼 있다(포털 설명 기준 20개 승강장, 31개 노선). 잠실역에서 수원·남양주·의정부·양평 등 경기도 방면 광역버스를 타려는 이용자가 '어느 승강장에서 몇 번 버스를 타야 하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 버스 노선·정류장 데이터와는 노선 번호나 정류장 이름으로 맞춰 이어 써야 한다.
description_portal: 서울교통공사가 위탁운영하고 있는 잠실광역환승센터(잠실역)의 버스 운행 노선 및 현황입니다.위 데이터는 연번, 승강장번호, 정차노선, 목적지로 구성되어있습니다.  잠실광역환승센터에서는 총 20개 승강장을 운영하고 있으며, 이 20개의 승강장에는 수원, 남양주, 구리, 의정부, 양평, 화성, 포천, 양주 등 경기도까지 운행하는 총 31개 노선의 버스가 정차하고 있습니다. 이는 26. 01.19. 기준데이터입니다. 이 데이터는 통상 반기에 한 번 업데이트 되며, 이 외에도 변경사항이 있는 경우 업데이트 하고 있습니다.
