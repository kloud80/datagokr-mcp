summary_user: 인천광역시 사회조사의 주차공간 만족도를 관공서·상가·전통시장·관광지 네 장소별로 매우 불만족부터 매우 만족까지 5단계 응답 비율(퍼센트)과 5점·100점 평균으로 담은 집계 통계이며, 행은 군/구·성별·연령 등 응답자 특성(특성별(1)·(2))으로 나뉘고 파일은 약 8KB 크기의 CSV입니다. 교통·도시정책 분석가가 '인천에서 어느 군/구, 어느 연령대가 전통시장이나 관광지 주차에 가장 불만이 큰가'를 확인하고 주차장 확충 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 특성별 칸의 군/구 이름을 맞춰 인천 군/구별 주차장 현황이나 다른 사회조사 항목과 연결한다.
description_portal: 인천광역시가 사회조사를 통해 제공하는 주차환경 만족도 공공데이터는 시민들이 현재 거주하는 동네 주차 환경에 대해 느끼는 만족 정도를 군/구별, 성별, 연령별 등 다양한 특성에 따라 세분화하여 집계한 통계 자료입니다. 이 데이터는 지역 교통 및 주거 환경의 품질을 파악하고, 주차장 확충 및 관리 계획, 주거 환경 개선 정책, 주거 만족도 제고 방안 수립의 기초 자료로 활용됩니다.해당 데이터는 국가통계포털(KOSIS)에서 참고하였으며, 공공데이터포털에서 CSV파일로 무료로 다운로드 할 수 있습니다.
