description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선 각 역사의 자동화설비 설치 현황을 제공합니다. 본 자료는 도시철도 운영에 필요한 주요 자동화설비의 설치 및 운영 정보를 포함하고 있으며, 발권기, 자동개집표기, 자동발매기, 카드보충기, 자동분류기, 휴대용 정산기, 역단위 전산기, 감시제어기, 유지보수 전산기, 운용자 전산기, 출입관리시스템 등 다양한 설비 현황으로 구성되어 있습니다. 이를 통해 역사별 자동화설비의 설치 현황과 운영 수준을 체계적으로 파악할 수 있으며, 시설 운영 효율성 분석, 설비 유지관리 및 교체 계획 수립, 역사 운영환경 개선, 이용객 편의시설 확충 및 서비스 품질 향상을 위한 기초자료로 활용될 수 있습니다. 또한 스마트 역사 구축, 디지털 기반 운영체계 고도화, 시설 자산관리 및 데이터 기반 운영계획 수립 등 다양한 행정·연구 분야에서도 활용할 수 있습니다. 본 데이터는 변경 시 갱신됩니다.'
