summary_user: 대구도시철도 1·2·3호선 역마다 발권기, 자동개집표기(일반·장애인용·환승·유아), 자동발매기, 교통카드보충기, 역단위 전산기, 출입관리시스템 등 자동화설비가 몇 대씩 있는지를 담은 역별 집계 파일이다(CSV 약 7KB). 교통약자 정책 담당자나 연구자가 '장애인용 개집표기나 우대 발매기가 부족한 역은 어디인가'처럼 역별 설비 수준을 비교하거나 설비 교체 계획을 세울 때 쓴다. 전역 조인 키가 없어 호선·역명을 이름으로 맞춰 대구교통공사의 다른 역별 데이터(승하차 인원, 역 위치 등)나 역 코드 마스터와 연결해야 한다.
