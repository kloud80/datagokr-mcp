summary_user: 대구광역시 동구 안의 아파트 단지별 전기차 충전시설 설치 현황을 단지 한 건씩 담는다(등록번호, 아파트명, 주소, 충전시설 수). 동구 주민이나 이사를 고민하는 전기차 이용자가 '이 아파트 단지에 충전기가 있는지, 몇 대인지'를 확인하는 데 쓰고, 구청·분석가는 단지별 충전 인프라 분포를 보는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 아파트명이나 주소를 맞춰 공동주택 정보·충전소 목록과 이어 쓴다.
limits: 대구 동구만 다루며 다른 시군구 아파트는 담지 않는다. 표준 코드 키가 없어 아파트명·주소 문자열로만 다른 데이터와 연결할 수 있고, 이 과정에서 표기 차이로 매칭이 어긋날 수 있다. 충전기 운영 상태나 이용 요금 같은 정보는 필드에 없다.
