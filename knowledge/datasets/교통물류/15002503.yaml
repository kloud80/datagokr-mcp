summary_user: 대구도시철도 역별로 일자별 승차·하차 인원을 05시부터 24시까지 1시간 단위로 나눠 담은 CSV 파일 데이터로, 검증 수신 기준 45,684행이다. 출퇴근 시간대에 어느 역이 붐비는지, 역세권 유동인구가 어느 정도인지 알고 싶은 분석가나 상권 조사자가 쓴다. 전역에서 통하는 조인 키는 없고, 역번호·역명을 이름이나 코드 매핑으로 다른 역 정보와 맞추거나 같은 기관 코드로 이어야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 시민편의 및 운영정보를 제공하는 사회(Social) 분야 데이터로, 대구도시철도 1~3호선 각 역사에서 수집된 수송 현황을 일별·역별·시간대별로 제공하는 통계 자료입니다. 주요 항목은 호선명, 역명, 일자, 시간대, 승차인원, 하차인원으로 구성되어 있으며, 시간 단위의 세부적인 이용 현황 파악이 가능합니다.해당 데이터는 시민의 이동 패턴 분석, 출퇴근 시간대 혼잡도 예측, 역세권 유동인구 기반 상권 분석, 대중교통 서비스 개선, 도시 교통계획 수립, 민간 모빌리티 플랫폼 개발 등 다양한 행정 및 민간 분야에서 활용할 수 있습니다. 데이터는 매월 1회 정기적으로 갱신됩니다.'
