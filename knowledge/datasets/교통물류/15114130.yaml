summary_user: 해양수산부 관리청(지방해양수산청 등)별로 관할하는 컨테이너 터미널을 한 행씩 나열한 전국 단위 목록으로, 관리청 코드·명, 시설코드·시설서브코드, 시설명, 컨테이너터미널명을 담은 약 6KB 분량의 작은 CSV 파일이다. 항만 정책 연구자나 물류 분석가가 '어느 관리청이 어떤 컨테이너 터미널을 관할하는가', '특정 항만 시설코드에 해당하는 터미널 이름은 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없으므로 관리청코드·시설코드를 같은 해양수산부 계열 데이터(입출항·항만 물류 등)의 코드와 이름 매핑으로 맞춰 잇는다.
