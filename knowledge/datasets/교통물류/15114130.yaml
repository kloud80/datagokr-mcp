description_portal: 이 데이터는 해양수산부에서 관리하는 각 관리청별 컨테이너 터미널 현황을 파악하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 터미널의 관할기관 코드, 관할기관 코드명, 시설코드, 시설서브코드, 시설명 및 컨테이너터미널 명칭 등으로 구성되어 있습니다.  본 데이터는 항만 운영 및 정책 연구, 항만 시설별 컨테이너 물동량 분석, 항만 관리 효율성 평가, 해운·항만분야 관련 기관의 현황 분석, 관할 기관별 터미널 관리 체계 도출 등 다양한 해운항만물류 분야의 행정적·연구적 목적에 활용될 수 있습니다.
