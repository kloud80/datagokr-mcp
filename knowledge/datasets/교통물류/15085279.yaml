description_portal: '○ 통계개요* 통계명 : 운전면허 시험* 통계종류 : 운전면허 응시자, 합격자 등의 현황을 제공하는 일반ㆍ보고통계* 근거법령 : 「도로교통법」제80조* 작성목적 : 운전면허 응시자와 합격자 현황을 파악, 관련정책수립 등의 활용을 위한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 도로교통공단 면허전산처* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 운전면허 소지자(종별, 남녀별) 현황○ 기 타* 운전면허시험에 응시하여 최종합격한 후 지방경찰청장 명의의 운전면허증을 발급받은사람을 대상으로 함* 1종,2종 보통은 도로주행, 그외 종별은 기능시험을 최종시험으로 함* 소형견인시험이 신설로 추가되었으며 1종 특수로 분류함(2016년)'
