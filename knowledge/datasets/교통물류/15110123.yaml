summary_user: 충청남도 아산시에 설치된 도로안전표지를 표지 한 건 단위로 담으며, 위도·경도와 도로명·지번 주소, 안전표지 구분·설명, 도로 종류·노선, 설치일자 등을 함께 제공한다. 도로 관리자나 교통 분석가가 특정 도로 구간이나 좌표 주변에 어떤 안전표지가 언제 설치됐는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 좌표·주소나 노선명·노선번호 같은 이름 매칭, 또는 같은 기관 코드로만 이어 쓴다.
