summary_user: 전국 지자체가 관리하는 자전거보관소를 한 건씩 담은 시설 단위 원천 데이터로, 보관소명·주소·설치연도·설치형태·보관대수와 공기주입기·수리대·차양막 설치 여부를 담고 전체 18,516건이다. 시민이 내 주변에 자전거를 맡길 보관소가 어디 있고 몇 대까지 수용하는지 찾거나, 분석가가 지역별 보관 시설 현황을 비교하는 데 쓴다. 도로명주소·지번주소(address)와 WGS84 위도(coord)를 키로 공공자전거 대여소나 자전거도로 같은 같은 부문의 위치 데이터와 이어 쓴다.
description_portal: '자전거보관소정보 데이터는 자전거 이용 활성화에 관한 법률 등에 따라 지방자치단체에서 관리하는 자전거주차장 또는 보관시설 데이터로 자전거보관소명, 소재지 주소(도로명·지번), 설치연도 및 설치형태, 보관대수 등 시설 정보와 함께 위치 확인을 위한 위·경도 좌표 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 자전거보관소 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 자전거보관소의 기본 현황과 시설 특성을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 행정안전부 주소정보혁신과 / 044-205-3547 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
