summary_user: 교통카드 자료를 분석해 대중교통 이용인원을 이용자유형(일반·어린이·청소년·기타)별로 나눠 담은 집계 파일로, 전국 17개 시도 구분으로 제공되며 단위는 명·통행이다. 정책 담당자나 분석가가 '어느 지역에서 청소년·어린이 승객 비중이 높은가'처럼 연령대별 대중교통 이용 구성을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명(구분1)을 이름으로 맞춰 시도별 인구·노선 자료 등과 이어 쓴다.
description_portal: 한국교통안전공단에서 교통카드를 이용해 전국 데이터를 분석하여 추출한 대중교통 이용자유형별 이용인원 자료입니다.해당 데이터는 이용자유형별(일반, 어린이, 청소년, 기타)로 이용인원을 제공하고 있습니다.전국(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)으로 구분하여 데이터를 제공하고 있습니다.단위는 명, 통행입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
