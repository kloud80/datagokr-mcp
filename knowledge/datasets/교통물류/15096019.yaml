summary_user: 충청남도 계룡시에 설치된 가로등을 한 기씩 담은 시설 단위 원천 목록으로, 관리번호·관리부서와 위도·경도, 지번 주소, 설치연도·설치형태, 용도 등을 담는다. 계룡시 도로 조명을 관리하는 부서나 분석가가 "어느 동네에 언제 설치된 가로등이 몰려 있고 노후 교체 대상은 어디인가" 같은 질문에 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 실측 컬럼에서 확인되지 않아, 지번 주소의 동 이름 매칭이나 위도·경도(LA, LO) 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 본 데이터는 충청남도 계룡시에 설치된 가로등시설에 대한 정보를 담고 있습니다. 각 가로등 시설을 고유하게 식별하는 표찰번호(가로등 고유 번호)가 핵심 컬럼으로 제공됩니다. 이 번호를 통해 개별 가로등의 위치와 상태를 관리할 수 있습니다. 위치 정보는 행정 구역을 기준으로 행정동 및 법정동으로 구분되어 제공되므로, 지역별 가로등 분포와 관리 주체를 명확히 파악할 수 있습니다. 가로등의 성능과 전력 소비를 나타내는 중요한 정보인 램프용량이 포함되어 있어, 계룡시의 도로 조명 환경 및 에너지 효율성 분석에 활용될 수 있습니다. 이 데이터는 시의 도시 기반 시설 관리 부서가 조명 시설의 설치 현황, 유지보수 계획 수립, 에너지 절약 정책 검토 등을 위해 사용하기에 적합한 기초 자료입니다.
