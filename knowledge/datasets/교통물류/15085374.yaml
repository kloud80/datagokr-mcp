summary_user: 서울교통공사가 관리하는 수도권 3·6·7호선 역의 무빙워크를 한 대씩 담은 시설 목록으로, 운영기관·노선·역명·관리번호·상세위치·시작층과 종료층을 기록한 작은 CSV 파일(약 1.2KB)이다. 교통약자나 이동 편의 안내 서비스 개발자가 '어느 역 어느 위치에 무빙워크가 있는가'를 확인하거나, 분석가가 역별 이동편의시설 현황을 정리할 때 쓴다. 전역 조인 키가 없어 다른 역 시설 데이터(에스컬레이터·엘리베이터 등)와는 노선명·역명 같은 이름을 맞춰서 이어 쓴다.
description_portal: 서울교통공사에서 관리하는 수도권 3호선, 6호선, 7호선 역들의 무빙워크에 대한 철도운영기관명,선명,역명,관리번호,상세위치,시작역층,종료역층 데이터가 포함되어 있습니다.사람이나 화물이 자동적으로 이동할 수 있게 만든 기계. 컨베이어 벨트의 일종이라고도 볼 수 있다. 쉽게 말하자면, 수평버전 에스컬레이터 이다.에스컬레이터와의 차이점은 계단이 아닌 평평한 판 구조로 되어있다는 것이다. 에스컬레이터와 모양과 역할이 똑같아서 그냥 에스컬레이터라고 부르는 사람들이 많은데 "escalate"라는 단어는 "올리다, 상승시키다"라는 의미라 어폐가 있다.설치 목적 또한 다른데 에스컬레이터는 "층간이동"이 필요한 구간에서 대규모의 인원이 더 쉽게 층간이동을 하기 위해 설치하는 것인 반면 무빙워크는 장거리 "수평이동"을 요구하는 구간에서 대규모의 인원이 더 쉽게 수평이동을 하기 위해 설치하는 것이다.
