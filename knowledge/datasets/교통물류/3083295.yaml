summary_user: 경상남도 안 전세버스 운송사업 업체를 한 행에 한 업체씩 담은 명단으로, 관할관청·업체명·주소·연락처·구분을 담는다(CSV 약 11KB). 전세버스를 빌리려는 단체나 사업자가 우리 시군 관할 전세버스 업체가 어디이고 연락처가 무엇인지 찾을 때, 분석가가 시군별 업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 관할관청 이름이나 주소의 시군명을 맞춰 이어야 하며, 주소를 좌표로 바꾸면 지도에 올릴 수 있다.
limits: 업체 명단일 뿐 보유 차량 대수, 운행 실적, 요금은 담지 않는다. 표준 기관코드나 사업자번호 같은 공통 키가 없어 다른 데이터와 붙이려면 이름·주소 문자열 매칭이 필요하다. 포털 설명상 연락처는 기관이 보유한 것만 기재되어 빈 값이 있을 수 있다.
