summary_user: 진주시 도심 주요 교차로 감응신호 카메라가 수집한 교통량을 수집 구간(수집시작·종료일시)과 교차로(수집위치)별로 1~6차선마다 기록한 건별 원천 데이터로, 차선마다 직진·좌회전·우회전·유턴·잔여·대기 차량 수와 승용·승합·버스·트럭·특수·오토바이·자전거 차종 정보를 담으며 CSV 파일(약 1.4MB)로 제공된다. 교통 분석가나 시 교통 담당자가 '특정 교차로에서 시간대별로 좌회전 대기 차량이 얼마나 쌓이고 어떤 차종이 많은가'를 따져 신호 주기 조정이나 혼잡 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교차로 이름(수집위치)을 매핑하거나 진주시 단위로만 이어 쓸 수 있으며, 같은 시의 다른 교통·신호 자료와는 이름 대조로 연결한다.
limits: 교차로 좌표나 표준 지점 코드가 없어 지도 위 결합이나 타 지역 데이터와의 직접 조인은 어렵고, 범위는 진주시 단일 시군구에 그친다. 카메라 영상 인식 기반이라 폭설·짙은 안개 같은 극한 기상 때는 인식률이 떨어질 수 있다고 포털이 밝히고 있다.
