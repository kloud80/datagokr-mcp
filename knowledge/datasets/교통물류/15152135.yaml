description_portal: '경상남도 진주시 도심 주요 교차로에 설치된 감응신호 시스템을 통해 수집된 차선별 교통량 정보 데이터입니다.본 데이터는 수집일시 및 교차로별·차선별 교통량과 차량 종류 정보를 체계적으로 기록하고 있으며, 시간대별 교통 흐름 변화와 차량 이동 패턴을 정밀하게 분석할 수 있습니다.이 데이터는 교통 혼잡도 분석, 신호 최적화 알고리즘 개발, AI 기반 교통 예측 모델 학습, 자율주행 시뮬레이션 검증 등 다양한 분야에서 활용 가능하며, 스마트시티 구축을 위한 핵심 기반 데이터로서의 가치가 높습니다. 또한, 실시간 데이터 수집 및 분석 체계를 통해 교통 정책 의사 결정의 정확도 향상과 시민 체감형 교통서비스 고도화에 기여할 수 있습니다.* 교통량, 차량종류 컬럼별 데이터의 의미는 다음과 같습니다.차로별 교통량 데이터 : 직진 / 좌회전 / 우회전 / 유턴 / 잔여차량 / 대기차량차로별 차량종류 데이터 : 승용 / 승합 / 버스 / 트럭 / 특수 / 오토바이 / 자전거본 데이터는 카메라 영상 인식 기술을 기반으로 수집되며, 평상시에는 높은 정확도를 유지하나, 폭설·짙은 안개 등 극한 기상 상황에서는 인식률이 일시적으로 다소 저하될 수 있습니다.'
