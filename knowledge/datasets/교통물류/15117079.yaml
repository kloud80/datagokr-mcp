summary_user: 고창군에 소재한 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 파일로, 업체명·허가업종·도로명 소재지 주소·차량대수·영업상태를 포함한다(시군구 범위, 파일 크기 779바이트 수준의 소규모 목록). 화물 운송을 맡길 업체를 찾는 사업자나 지역 화물운송 사업자 분포를 보는 분석가가 "고창군에 영업 중인 허가 운송사가 어디이고 차량을 몇 대 보유했나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소로 맞춰 이어야 하며, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터와 대조해 확인한다.
limits: 실측 컬럼에 사업자등록번호 같은 전역 식별키가 없어 다른 데이터와 정확히 조인하기 어렵고 업체명·주소 매칭에 의존해야 한다. 고창군 한 곳만 다루므로 다른 시군이나 전국 현황은 표준데이터로 따로 봐야 한다.
