summary_user: 부산항에서 처리된 컨테이너화물 물동량을 연도별로 집계한 파일로, 한 행이 한 해이며 합계와 자성대·신선대·감만·신항1~5부두 등 부두별 물동량(TEU)을 열로 담는다(약 3KB 규모의 CSV). 해운·항만 분석가가 '부산항 전체 물동량이 해마다 어떻게 변했고, 북항에서 신항으로 물량이 얼마나 옮겨갔는가'를 볼 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 연도(년도) 열이나 부두 이름을 맞춰 연결하며, 같은 부산항만공사의 다른 항만 통계와 함께 보는 방식이 현실적이다.
description_portal: '부산항에서 처리되는 컨테이너화물의 연도별 물동량 통계 데이터를 제공합니다.- 부산항 컨테이너 부두- 단위 : TEU부산항만공사가 제공하는 본 데이터는 부산항에서 처리된 컨테이너화물의 물동량 통계를 연도별로 집계한 정보를 담고 있습니다. 전체 물동량, 부두별 물동량 등을 포함하며, 항만 물류 흐름 분석, 인프라 투자 계획 수립, 운영 효율성 평가, 수출입 물량 예측, 물류 정책 개발 등 다양한 공공 및 민간 활용 목적에 부합합니다. 특히 해운물류 연구, 항만 경쟁력 분석, 항만 간 비교연구 등에도 유용하게 쓰일 수 있는 공공데이터입니다. 또한 국제 해상운송시장 변화에 따른 물동량 추이 예측, 지역 항만산업의 성장성 평가 등에도 활용될 수 있습니다.'
