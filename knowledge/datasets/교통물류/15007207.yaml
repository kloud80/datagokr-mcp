summary_user: 대구광역시경찰청이 지정한 탄력적 주차허용 구간을 구간 한 건씩 담은 현황 파일(CSV, 약 40KB)입니다. 각 구간마다 관할 경찰서, 시작점·종료점, 허용면, 총거리, 평일·토요일·일요일 및 공휴일 운영시간, 금지차량이 들어 있습니다. 운전자나 상인이 '이 도로에서 주말 몇 시에 차를 세울 수 있나'를 확인할 때 쓰고, 분석가는 경찰서별 허용 구간 길이를 비교할 때 씁니다. 전역 조인 키는 없어서 다른 데이터와는 경찰서명이나 도로·지점 이름을 텍스트로 맞춰 연결합니다.
description_portal: 대구광역시경찰청에서는 교통 흐름 개선과 지역 상권 활성화를 위해 탄력적 주정차 허용 구간을 지정하여 운영하고 있습니다. 탄력적 주차허용은 시간대별, 구간별로 주차가 허용되며, 도로 여건과 지역 특성에 따라 유동적으로 관리하고 있습니다. 탄력적 주차허용 구간 현황 정보는 경찰서별, 시점 및 종접(위치), 허용면, 허용 구간(거리), 허용시간(평일, 주말 및 공휴일 등 특정 시간대에 주차가 허용되는 시간)으로 구분하여 제공하고 있습니다. 해당 현황은 대구광역시경찰청 생활안전부 교통과에서 담당하고 있습니다
