summary_user: 제주특별자치도 읍면(애월·한림·한경·대정·안덕·표선·성산·구좌·조천) 지역을 다니는 지선 시내버스의 노선별 현황을 노선 한 줄씩 담은 소규모 CSV 파일로, 운행구간·거리·평일 1일 운행횟수·배차간격·운행대수·운행업체를 담는다. 주민이나 교통 분석가가 '우리 읍면 지선버스는 평일에 몇 분 간격으로 몇 번 다니고, 어느 업체가 운행하나'를 확인하거나 읍면별 지선 공급 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 정류장·노선 원장이나 실시간 도착 정보(제주버스정보시스템, TAGO)와는 노선명을 기준으로 이름 매칭해 이어 써야 한다.
limits: 노선명 외에 노선 ID 같은 공통 코드가 없어 다른 버스 데이터와 정확히 연결되지 않고 이름 매칭에 의존한다. 평일 기준 운행 통계만 담아 주말 운행이나 실시간 운행·도착 정보는 알 수 없다.
