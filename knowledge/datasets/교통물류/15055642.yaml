summary_user: "전북특별자치도 지방도 노선별로 설치된 실제 과속방지턱과 착시형 가상방지턱의 수를 구분해 집계한 작은 CSV 파일(약 1.7KB)이다. 도로·교통안전 담당자나 분석가가 '어느 지방도 노선에 과속방지턱이 많고 적은가' 같은 노선별 교통 정온화 시설 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선 이름(예: 지방도 635호선)을 직접 맞춰 이어야 한다."
description_portal: 이 데이터는 전북특별자치도 내 지방도 노선별로 설치된 과속방지턱의 현황을 집계한 자료입니다. 각 도로 노선(지방도 635호선 등)에 물리적으로 설치된 '과속방지턱'과 착시 효과를 이용한 '가상방지턱'의 수를 구분하여 보여주는 것이 특징입니다. 이를 통해 각 도로의 교통 안전 시설물 분포 현황을 파악할 수 있으며, 지역별 교통 정온화(Traffic Calming) 정책의 실행 정도를 분석하는 데 활용될 수 있습니다. 본 자료는 도로 관리 및 교통 안전 정책 수립을 위한 기초 데이터로서 중요한 가치를 가집니다.
