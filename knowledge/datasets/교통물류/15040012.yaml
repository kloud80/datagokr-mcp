summary_user: 여수시 시민여객선 운임지원 사업과 관련된 관내 여객선 선사 기본 현황을 선박 단위로 담은 작은 파일(csv, 약 1.2KB)로, 선사명·선명·항로·톤수·여객/선원 승선정원·기항지·소형차량 적재·선종·홈페이지를 수록한다. 여수 섬 주민이나 여행객이 특정 섬으로 가는 항로를 어느 선사·어떤 배가 운항하며 정원과 차량 적재가 되는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 선사명·선명·항로명 같은 이름 매칭으로만 이을 수 있으며, 결항 여부 등 실시간 운항 정보는 해양교통안전공단 운항상태 데이터와 이름으로 맞춰 함께 본다.
description_portal: 여수시 시민여객선운임지원 관련된 선사 기본자료입니다. 여수시 관내 시민여객선 운항 선사의 기본 현황을 수록하고 있으며, 선사별 연락처, 홈페이지, 여객선 종류 등의 정보를 제공하여 운임지원 대상 관리 및 이용자 안내에 활용됩니다.본 데이터는 여수시 시민여객선 운임지원 사업과 관련된 선사 정보를 체계적으로 관리하고 제공하기 위한 자료로, 여객선 이용 주민과 관계기관이 선사별 기본 정보를 쉽게 확인할 수 있도록 구성되어 있습니다. 데이터 항목에는 선사명, 대표 연락처, 홈페이지 주소, 여객선 종류 등 선사 운영과 관련된 기초 정보가 포함되어 있으며, 시민여객선 운항 현황 파악 및 행정업무 지원에 활용될 수 있습니다.
