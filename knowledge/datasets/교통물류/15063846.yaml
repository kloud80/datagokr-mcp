summary_user: 창원시 도로를 고속국도·국도·지방도·시도·군도·농어촌도로 등 도로 종류별 열과 구분 행으로 정리한 작은 집계표(CSV 285바이트)로, 구간별 건별 원천 자료가 아니다. 창원시 도시계획·교통 분석가가 '창원시 도로는 종류별로 어떤 규모로 분포하는가'를 파악하거나, 다른 시군구 도로현황과 비교할 기초 수치를 얻는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 도로 종류명이나 창원시라는 기관·지역 단위로만 맞춰 이어 쓴다.
limits: 창원시 한 시군구의 비공간 집계표라서 도로 구간의 위치나 지도 시각화, 구간별 폭원 분석에는 쓸 수 없다. 공통 코드 키가 없어 다른 데이터와는 이름 매핑으로만 연결된다.
