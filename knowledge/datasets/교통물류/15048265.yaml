summary_user: 인천광역시 시내버스의 노선별 경유 정류장을 운행 순서(순번)대로 한 행씩 담은 파일로, 운수회사·노선번호·정류소명·정류소번호와 정류소 사이 구간거리·누적거리, 주요경유지 여부, 상·하행 구분을 포함한다. 교통 앱 개발자나 분석가가 '특정 노선이 어떤 정류장을 어떤 순서로 지나며 기점에서 몇 km 떨어져 있는가'를 확인하거나 노선 개선안을 검토할 때 쓴다. 실측 컬럼에서 전국 공통 조인 키는 확인되지 않아, 인천시 실시간 도착·정류소 위치 데이터 등과는 노선아이디·정류소아이디·정류소번호 같은 인천시 자체 코드나 정류소명 매칭으로 이어 쓴다.
description_portal: '인천광역시_버스 노선별 정류장 현황 데이터는 시내버스의 운행 경로와 정류장 정보를 상세하게 제공하는 자료입니다.주요 항목: 기준일자, 회사명, 회사아이디, 노선번호, 노선아이디, 순번, 정류소명, 정류소번호, 아이에스씨 아이디, 정류소간거리, 정류소간누적거리, 주요경유지여부, 상_하행 등으로 구성되어 있습니다.특징 및 활용: 버스가 이동하는 순서(순번)와 정류장 사이의 거리, 누적거리를 명확히 알 수 있어 효율적인 노선 분석이 가능합니다. 이 데이터는 교통 앱(App) 개발, 대중교통 노선 개선, 시민들의 편리한 이동 경로 확인을 위한 기초 자료로 유용하게 활용됩니다'
