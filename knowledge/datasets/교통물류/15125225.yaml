summary_user: 대구광역시 937번 버스 노선이 지나는 정류소별로 2023년 1월부터 10월까지 월별·시간대(0시~23시)별 승하차인원을 교통카드 단말기 이력으로 집계한 CSV 통계(약 140KB)다. 버스 운영 분석가나 시민이 '937번은 어느 정류소에서 몇 시에 승하차가 몰리는가'를 확인하고 혼잡 구간과 월별 추이를 볼 때 쓴다. 정류소 ID 같은 전역 조인 키 없이 정류소 이름만 있어서, 대구시 정류장 원장이나 다른 노선별 승하차 파일과는 정류소명을 맞춰 연결해야 한다.
description_portal: 2023년 1월부터 2023년 10월까지 대구광역시 내에 운행 한  937노선에 대한 경유 정류장별 시간대별 승하차인원 통계입니다. 년월, 정류소, 시간대별 승하차인원 등의 내용이 포함된 CSV 파일형식의 자료입니다.승하차인원은 버스 내에 설치된 승차 및 하차 단말기의 교통카드 통신이력을 기반으로 제공해 드리고 있습니다. 이를 통해 937노선의 정류소별 이용자 패턴, 승하차 집중구간 등 월별 추이 분석이 가능합니다. 추가적으로 궁금한 사항이나 의견이 있으시면 대구광역시 교통정보운영과 교통운영팀(☎053-803-6861)으로 연락해주시기 바랍니다.
