summary_user: 대전광역시 도로관리시스템에 등록된 도로 안전시설물(교통안전 표지, 방호울타리, 조명 등)을 시설물 한 건씩 담은 파일로, 시설 종류 부호·관리번호·행정동·도로명·지번·위도·경도를 가진다. 대전 시내 특정 도로나 동네에 방호울타리·조명 같은 안전시설이 어디에 얼마나 있는지 지도에 표시하려는 분석가나 시민이 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 행정동·도로명·지번 같은 이름 매칭이나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 대전광역시 안전시설물(도로시설물)현황 데이터는 대전광역시 도로관리시스템에 등록된 도로 내 안전시설물의 전반적인 현황을 상세히 제공합니다. 해당 자료는 각 도로시설물의 명칭, 위치, 설치 목적, 관리번호, 주요 기능, 설치 시점 등 다양한 정보를 포함하고 있으며, 교통안전 표지, 방호울타리, 조명 등 시민의 안전과 원활한 교통 질서 유지에 필수적인 시설물이 모두 포함됩니다.※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
