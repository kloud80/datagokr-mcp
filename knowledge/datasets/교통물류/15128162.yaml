description_portal: 이 데이터는 해양수산부에서 해운항만물류정보시스템(PORT-MIS)을 통해 선박이 입출항할 때 선박료 산정 시 적용하는 할인사유를 코드화하여 관리하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 할인사유코드, 각 코드에 따른 할인사유의 명칭, 할인율, 적용시기 등으로 구성되어 있습니다.   본 데이터는 해운항만분야의 행정 업무 처리 시 선박료 할인사유를 식별하거나, 항만 이용 기업의 예산 수립 및 비용 분석, 선박 운항 스케줄 조정 시 할인 적용 여부 확인 등 선박의 입출항과 관련된 서비스 개선 및 효율적 자원관리에 활용될 수 있습니다.
