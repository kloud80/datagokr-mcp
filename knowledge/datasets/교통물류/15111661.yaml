description_portal: 경기도 성남시 우회전 사각지대 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다.우회전 사각지대 파일데이터"는 차량이 도로에서 우회전을 할 때 발생하는 **시야 제한 구간(블라인드 스팟)** 데이터 파일을 의미합니다. 운전자의 눈이나 차량 장착 카메라, 센서(LiDAR, 레이더 등)로 확인하기 어려운 보행자·자전거·오토바이의 위치나 움직임을 포함하는 영역을 정량적으로 분석하기 위해 구축됩니다. 이 데이터에는 차량 회전 반경, 교차로 구조, 보행자 횡단 위치, 시간대별 시야 확보율, 사고 위험 발생 빈도 등이 기록될 수 있습니다. 교통안전 연구에서는 이를 활용해 우회전 시 발생하는 사고 패턴을 파악하고, 보행자 보호를 위한 신호체계 개선, 교차로 구조 설계, 보조 안전장치 개발 등에 참고될 수 있습니다.
