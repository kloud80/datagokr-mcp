summary_user: 성남시 안의 우회전 사각지대 지점을 한 행에 한 곳씩 담은 지점 목록으로, 법정동·도로명·세부위치와 위도·경도, 관련 횡단보도관리번호, 이미지명을 함께 기록한다. 교통안전 담당자나 분석가가 '성남시에서 우회전 사각지대가 있는 교차로·횡단보도가 어디에 몰려 있는가'를 확인하고 보행자 보호 시설이나 신호 개선 후보지를 고르는 데 쓴다. 전역 공통 조인 키는 없어서, 위도·경도로 공간 결합하거나 법정동명·도로명을 이름으로 매칭해 횡단보도·보호구역·단속카메라 표준데이터와 이어 쓴다.
limits: 범위가 성남시 한 곳뿐이라 다른 시군구와 비교할 수 없다. 공통 코드 키가 없어 다른 데이터와는 이름 매칭이나 좌표 결합으로만 이을 수 있다. 횡단보도관리번호는 기관 내부 번호일 수 있으니 결합 전에 대상 데이터와 같은 체계인지 확인해야 한다.
