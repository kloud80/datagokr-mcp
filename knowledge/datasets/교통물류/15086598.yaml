summary_user: 항만구역에서 화물을 선적·하역·운송·보관하는 데 쓰는 항만시설장비(컨테이너크레인, 트랜스퍼크레인, 야드트랙터, 십로더, 벨트컨베이어, 탑승교 등)의 보유 대수를, 장비를 관리하는 행정청·지방자치단체(구분)별로 집계한 전국 단위 소형 CSV 파일(1,488바이트)이다. 지역 간 항만 하역 인프라를 비교하거나 특정 지방청 관할 항만에 컨테이너 하역 장비가 얼마나 갖춰져 있는지, 장비 확충이 필요한지를 따지는 정책·물류 분석가가 쓴다. 전역 조인 키가 없어 다른 항만 데이터와는 관리청 이름을 맞춰 연결해야 하며, 입출항·물류 통계와 잇는 핵심 키인 항만코드도 이 파일에는 없다.
limits: 집계 단위가 관리청·지자체라서 개별 항만·부두·선석별 장비 현황이나 장비별 제원·노후도는 알 수 없다. 항만코드나 기관 코드 같은 조인 키가 없어 입출항·물류 데이터와 연결하려면 이름 매핑을 따로 만들어야 한다.
