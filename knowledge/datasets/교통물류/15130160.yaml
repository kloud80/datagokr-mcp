summary_user: 국가철도공단이 철도건설현장 재난·사건사고 전파용 앱인 재난알리미에 올린 공지를 공지 한 건 단위로 담은 파일로, 제목·내용·등록일시·전체푸시 여부·조회수가 들어 있다. 철도 안전 담당자나 분석가가 건설현장에 폭염·풍수해 같은 재난 공지가 언제 얼마나 나갔고 얼마나 조회됐는지 살펴볼 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 같은 기관 자료와 등록일시나 공지 제목·내용의 이름으로만 맞춰 볼 수 있다.
