description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 가로화단의 정보를 제공합니다. 도로변에 조성된 화단의 위치와 규모 정보를 담고 있어 도시 녹화 관리와 경관 개선에 활용됩니다. 지형지물부호는 가로화단을 식별하며, 관리기관은 화단 관할 주체를 나타냅니다. 위치는 화단이 설치된 지점을 표시하고, 길이와 면적은 화단의 규모를 수치로 제공합니다. 데이터 기준일은 정보의 최신성을 확인할 수 있습니다. 본 데이터는 가로 녹지 관리, 조경 시설 유지보수, 도시 미관 개선, 녹지 면적 산정, 환경 정책 수립 등에 활용됩니다.
