description_portal: 서울교통공사에서 제공하는 기계시설물 관련 기계설비 정보로, 공조설비·소방설비·위생설비 등 다양한 분야의 세부 자료를 포함하고 있습니다. 데이터에는 대구분, 중구분, 소구분, 그리고 단위별 구체적인 항목이 체계적으로 정리되어 있으며, 1호선부터 8호선까지 각 노선별로 설치된 기계시설물의 종류와 현황이 함께 수록되어 있습니다. 이를 통해 노선별 설비 구성과 관리 현황을 한눈에 파악할 수 있고, 시설 유지보수나 계획 수립에도 유용하게 활용할 수 있도록 작성되었습니다. 본 자료는 2026년 2월을 기준으로 집계된 최신 데이터입니다.
