summary_user: 한국건설기술연구원이 낸 수시 교통량조사 결과를 시간대별로 정리한 전국 단위 집계 통계로, 필드 이름으로 보면 조사연도·도로등급·조사지점 번호·시간대·방향별 교통량 합계와 13개 차종별 교통량을 담는 것으로 보입니다(명세에 필드 의미는 비어 있음). 교통 분석가나 도로·교통안전 담당자가 특정 도로등급 조사지점에서 어느 시간대에 화물차 등 특정 차종 통행이 몰리는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 조사지점 번호나 도로등급 같은 이름·코드를 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시시간대통계 정보입니다.\""
