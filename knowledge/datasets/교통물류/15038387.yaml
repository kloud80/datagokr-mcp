summary_user: 경상남도 합천군이 운영하는 교통복지 택시인 행복택시의 이용 기록을 운행 건별로 담으며, 승하차 일시·승하차 지점·승차 인원·총 요금·승객 부담액·보조금·주행 시간을 포함한다(시군구 단위, CSV 약 2.3MB). 군청 담당자나 교통복지 분석가가 어느 마을에서 언제 행복택시 수요가 몰리는지, 군이 건당 얼마의 보조금을 부담하는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 승하차 지점명을 직접 맞춰야 이어 쓸 수 있고, 다른 시군의 행복택시 이용 정보와도 이름 기준으로 비교한다.
description_portal: 해당 자료는 경상남도 합천군 행복택시 이용 정보 현황에 관한 자료입니다.행복택시는 대중교통 취약계층 주민의 이동권 보장을 위해서 지방자치단체에서 운영하는 교통복지 서비스입니다.일반적인 대중교통 수단 이용이 어려운 교통수단 취약계층의 불편함을 해소하기 위해 운영되며 일정 부분 요금을 지방자치단체에서 지원합니다.본 데이터는 시도, 시군구, 관리부서, 승차 일시, 하차 일시, 승차지(승하차지점매칭), 하차지(승하차지점매칭), 승차인원, 총 요금, 승객 지불 요금, 보조금, 총 주행시간에 대한 데이터가 포함되어 있습니다.
