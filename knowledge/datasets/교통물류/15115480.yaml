description_portal: '이 데이터는 광주광역시 서구에 등록된 일반화물자동차운송사업자에 대한 정보를 수록한 공공데이터로, 각 업체별 연번, 상호(업체명), 면허종류, 차량대수, 주소, 운영여부, 기준일자 등의 항목으로 구성되어 있습니다. 운송업체의 등록 현황과 실제 운영 여부를 함께 제공함으로써, 지역 내 운송사업체 분포 및 영업 실태를 파악하는 데 유용합니다.이 데이터는 화물운송 관련 행정업무(예: 허가·면허 관리, 운송업체 실태조사, 지도·단속)뿐만 아니라, 지역별 물류 기반 분석, 운송 수요 예측, 불법운송 방지 대책 수립 등에도 활용됩니다. 차량 보유 규모나 주소지 기반 분석을 통해 업체별 운영 규모 파악이 가능하며, 민원 대응, 물류 정책 설계, 지역 교통정책 수립을 위한 기초자료로 행정적 활용도가 높습니다.데이터는 연 1회 이상 갱신되며, 사업자 단위의 개별 정보가 행 단위(Row)로 정리되어 있어 활용이 용이합니다. 좌표값은 포함되어 있지 않아 공간정보 분석 시 주소기반 매핑이 필요합니다.'
