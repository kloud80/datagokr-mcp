summary_user: 국가철도공단이 시행하는 철도건설사업의 관보 고시를 고시 한 건 단위로 담은 파일로, 사업코드·관보고시번호·고시기관·고시명·고시일자·고시 내용과 사업 시작·종료일자를 포함하며 범위는 전국(시군구 단위)이다. 철도 노선 신설·변경이나 사업계획·실시계획 승인이 언제 공식 고시됐는지 확인하려는 지자체·시민·분석가가 "우리 지역 철도사업이 어느 절차까지 진행됐나"를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업코드나 사업명·고시명 같은 이름 매핑, 같은 기관(국가철도공단) 코드로만 이어 쓴다.
description_portal: 국가철도공단에서 시행하는 철도건설사업과 관련된 관보고시 기본정보를 제공하는 데이터로, 법적·행정적 절차에 따라 공표되는 철도사업의 공식 고시 현황을 담고 있습니다. 주요 항목은 사업코드(철도사업의 코드), 고시번호(행정 고시의 고유 번호), 고시기관(발행 주체), 고시명(고시의 제목 또는 내용 요약)으로 구성되어 있습니다. 이 데이터는 철도 노선 신설·변경, 사업계획 승인, 실시계획 승인 등 주요 절차의 공표 정보를 확인할 수 있어, 관계기관·지자체·시민 등 이해관계자의 행정적 참고자료로 활용됩니다. 또한, 철도사업의 추진 현황, 법적 효력 발생 여부 등을 파악하는 데 유용한 공공 데이터입니다.
