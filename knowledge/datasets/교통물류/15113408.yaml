summary_user: 교통영향평가 대상 사업을 사업 한 건 단위로 담으며, 사업명·사업위치 주소와 X·Y좌표·사업구분·부지면적·연면적·건폐율·용적률·사업시행자·평가대행업체와 심의위원회·심의완료일자 같은 심의 결과를 전국 범위로 제공한다. 개발사업 인근 주민이나 입지·상권 분석가가 특정 지역에서 어떤 대규모 사업이 교통영향평가 심의를 받았고 규모와 목표년도가 어떤지 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 맞물리는 조인 키가 없어서, 사업위치 주소·좌표(crsgmX, crsgmY)나 사업명을 매칭해 교통량 조사지점 등 위치 기반 데이터와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 주소·좌표·이름 매칭으로만 연결된다. 세부 부문은 교통량으로 분류돼 있지만 필드에는 교통량 수치가 없고, 평가 대상 사업의 정보와 심의 결과만 담는다. 호출에는 포털 활용신청으로 받는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
