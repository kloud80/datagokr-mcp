summary_user: 대전광역시에서 버스전용차로 위반 과태료 면제대상으로 등록된 차량을 면제 사유별 대수로 집계한 작은 파일(CSV 약 266바이트)이다. 버스전용차로 운영을 검토하는 분석가나 시민이 '어떤 사유로 면제받는 차량이 몇 대인가'를 확인하는 데 쓴다. 실측 컬럼(번호·면제사유·대수)에 전역 조인 키가 없어, 다른 데이터와는 면제 사유 이름을 맞추거나 같은 기관(대전광역시) 자료끼리만 이어 쓴다.
description_portal: 대전광역시 버스전용차로위반 과태료 면제차량 등록현황 자료는 대전광역시에서 버스전용차로 위반 과태료 면제대상에 해당하는 차량의 등록 현황을 제공합니다. 이 자료에는 면제 사유별 등록 대수, 차량 종류, 등록일자 등 다양한 항목이 포함되어 있어, 버스전용차로 운영의 투명성 확보, 면제차량 관리, 교통정책 수립, 과태료 부과 및 면제 기준 검토 등 다양한 행정적·정책적 목적에 활용될 수 있습니다. 또한, 면제대상 차량의 유형 및 등록 추이를 분석하여 교통 흐름 개선, 사회적 약자 차량 지원, 공공서비스 효율화 등에도 중요한 참고자료로 사용됩니다.
