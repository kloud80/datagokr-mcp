summary_user: 한국공항공사가 운영하는 공항을 쓰는 항공사의 국내선 정기 운항 스케줄을 편명 단위로 담은 파일 데이터로, 항공사·편명·출발/도착 공항·시간·운항요일·시작/종료일자를 싣고 있고 전국 7,881행(2026-03-29~2026-10-24)이다. 여행객이나 분석가가 특정 구간을 어느 요일, 어떤 편명으로 운항하는지 확인할 때 쓴다. 전역 조인 키는 없어서 공항 이름·코드 매핑이나 같은 기관의 다른 코드로만 다른 데이터와 잇는다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 공항을 활용하는 항공사의 국내선 항공기 스케줄 정보를 제공합니다.해당 데이터로 국내선 항공기가 주기적으로 어떤 편명으로 어떤 요일에 어떤 공항에서 출발하고 도착하는지 알 수 있습니다.데이터에 대한 추가 문의사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
