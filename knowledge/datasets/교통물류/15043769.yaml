summary_user: 고속도로 노선별로 차종(소형·중형·대형)에 따른 교통대수를 연도 단위로 집계한 표로, 2005년부터 2025년까지 연도가 열로 펼쳐진 전국 범위의 CSV 파일(약 21KB)이다. 분석가나 도로 정책 담당자가 '특정 고속도로 노선의 대형차 통행량이 지난 20년간 어떻게 변했나'처럼 노선·차종별 장기 추이를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명(구분)을 이름으로 맞추거나 같은 한국도로공사 자료끼리만 이어 쓴다.
limits: 노선 단위 연간 집계라 구간·영업소·일별·시간대별 통행량은 알 수 없고, 지도에 올릴 좌표나 행정구역 정보가 없다. 연결용 공통 코드가 없어 다른 데이터와 합칠 때 노선명 표기를 직접 맞춰야 한다.
