summary_user: 인천교통공사가 관리하는 역사 주차장 5개소(1호선 계양역, 2호선 검단오류·검암·주안·인천대공원)를 주차장별 1행으로 담은 CSV 파일이다. 주차구획수, 운영시간, 기본·추가 요금, 1일권·월정기권 요금을 담고 있어, 지하철역에 차를 대고 환승하려는 이용자가 요금과 운영시간을 비교하는 질문에 쓴다. 소재지도로명주소·소재지지번주소(address)를 조인 키로 삼아 다른 주차장·역 위치 데이터와 주소 기준으로 이어 쓰며, 별도 코드표는 없다.
limits: 검증 시 5행만 수신되어 인천교통공사 관리 5개소 외 주차장은 포함하지 않는다. 포털 설명상 2025년 6월 30일 기준이므로 현재 요금과 다를 수 있고, 실시간 주차 가능 대수는 담지 않는다. 필드에 명세상 의미와 코드표가 없어 급지구분 등 값의 해석은 원문 확인이 필요하다.
