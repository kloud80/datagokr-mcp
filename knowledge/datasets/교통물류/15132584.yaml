summary_user: 선박이 항만시설에 접안할 때 예선 사용을 면제받으려고 낸 신청을 건별로 담은 전국 파일(csv, 약 447KB)로, 선박명·호출부호·총톤수·국적·위험물 적재 여부, 신청일과 면제 여부, 면제허가 유효기간, 관할기관을 담는다. 항만 행정 담당자나 해운 분석가가 '어느 관할 항만에서 어떤 크기·종류의 선박이 예선 면제를 받고 있고 허가가 언제 끝나는가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 호출부호(호출부호)와 선박명으로 Port-MIS 입출항 신고나 선박 등록 자료에 이름·코드를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 항만별 예선사용 규칙에 따라 선박이 항만시설에 접안할 때 예선을 사용하지 않고 면제받기 위해 민원인이 신청한 예선면제신청 내역을 관리할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 예선면제 선박 정보, 신청 일자, 면제 여부, 면제허가 유효기간 등으로 구성되어 있습니다.  본 데이터는 예선면제 제도 관련 업무를 수행하는 행정기관에서 항만별 예선면제 신청 현황을 점검할 때 참고자료로 활용되며, 항만 운영 방식 분석자료, 선박 운항 및 항만 이용 정책 수립, 항만 업무 효율성 개선 등 행정적 분석자료로 활용될 수 있습니다.
