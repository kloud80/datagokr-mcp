summary_user: 한국철도공사가 운영하는 역사별로 스크린도어가 설치된 연도와 월을 노선·역명과 함께 담은 전국 단위 파일 데이터이며, 역 하나당 설치 시점을 기록한 목록 형태다(CSV 약 20KB). 철도 안전 분석가나 언론·지자체가 '어느 노선의 어느 역에 스크린도어가 언제 설치됐는지, 설치가 몰린 시기는 언제인지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역·노선 데이터와는 노선명과 역명 문자열을 맞추거나 같은 기관의 코드로만 이어 쓴다.
