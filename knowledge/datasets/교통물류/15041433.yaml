summary_user: 수도권 6호선 역에 설치된 휠체어리프트를 한 대씩 담은 파일로, 운영기관·역명·관리번호·출입구번호·상세위치·길이·폭·시작층·종료층을 담는다(CSV 약 1.3KB의 소규모 목록). 휠체어 이용자나 교통약자 이동편의 분석가가 '6호선 어느 역 몇 번 출입구에 리프트가 있고 몇 층에서 몇 층까지 이어지는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 역·시설 데이터와는 선명·역명 이름 매칭으로만 잇는다.
description_portal: 수도권6호선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 휠체어리프트의 관리번호, 출입구번호, 상세위치, 길이, 폭, 시작층, 종료층의 데이터가 있습니다.- 장애인등이 건축물 1개 층에서 다른 층으로 편리하게 이동할 수 있도록 하는 설비이다- 휠체어 리프트의종류는 경사형 휠체어리프트와 수직형 휠체어리프트 가 있다.- 엘리베이터 등이 제대로 갖춰지지 않은 상태에서 장애인의 이동 편의를 위해 설치됐지만, 잦은 고장 등으로 인명사고가 끊이질 않았다.- 서울교통공사는 그동안 지하철역에 설치된 휠체어 리프트 400여대를 ‘1역사 1동선’ 사업에 따라 순차적으로 철거해 왔다. ‘1역사 1동선’은 교통약자가 지하철역 바깥 출구부터 승강장까지 다른 사람의 도움 없이 이동할 수 있도록 엘리베이터 등을 설치하는 사업으로 장애인 리프트를 철거하기 위한 기본적인 요건이다. 현재 서울 지하철 전체 275개 역 가운데 263개 역(95.6%)이 1역사 1동선을 갖췄다. 공사는 남은 12개 역에도 엘리베이터를 설치해 2024년 안에 100% 동선 확보를 마친다는 계획이다.경사형 휠체어리프트는 설치 직후부터 정작 장애인의 이동권을 제대로 보장하지 못한다는 문제제기가 있었다. 특히 사용방법과 절차가 까다로워 장애인 혼자서는 이용할 수 없고 안전사고 방지를 위한 장치는 미비하고 지나치게 사용자 주의사항에 의존하고 있어 추락사고에 취약하다는 지적이 계속 제기되었다
