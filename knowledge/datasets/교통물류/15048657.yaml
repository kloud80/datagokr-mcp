summary_user: 서울 영등포구청 치수과가 2017년 6~7월에 시행한 도로 관련 공사를 공사 건별로 정리한 단발성 파일로, 실측 컬럼은 연번·공사기간·주소·데이터기준일자 네 개뿐이며 파일 크기는 약 1.3KB입니다. 지역 주민이나 분석가가 '2017년 여름 영등포구 어느 도로에서 언제 치수과 공사가 있었나'를 확인할 때 씁니다. 전역 조인 키가 없어 주소 문자열을 기준으로 다른 도로·공사 자료와 맞추거나, 같은 영등포구 자료끼리만 이어 씁니다.
description_portal: 서울특별시 영등포구청 치수과에서는 2017년 6월 1일부터 같은 해 7월 31일까지의 기간 동안, 해당 부서의 자체적인 계획과 내부 예산 집행에 따라 시행된 도로 관련 공사에 대한 전반적인 추진 현황 및 세부 내역을 종합적으로 정리한 자료 파일입니다. 본 자료에는 공사의 정확한 위치, 시행 일자, 공사 유형, 소요 예산, 투입된 인력 및 장비 내역, 사용된 주요 자재의 종류, 공사 시행 목적, 완료 여부, 관련 부서와의 협의 사항 및 민원 발생 여부 등의 다양한 정보가 체계적으로 수록되어 있으며, 치수과가 직접 기획·관리하고 감독하여 완료한 공사의 구체적인 내역을 포함하고 있습니다.
