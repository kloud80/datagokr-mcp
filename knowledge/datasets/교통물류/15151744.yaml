description_portal: '수출입 물류 공공·민간 데이터 공유 플랫폼에서 제공 중인 선박 운영 예정일정 데이터입니다.1. 데이터 개요: 수출입 물류 공공·민간 데이터 공유 플랫폼의 선사-항만 운영 정보 서비스 기능 제공을 위해 보유중인 정보입니다.2. 데이터 내역: 선박 코드, 항차, 기항 항만 순번, 예상 도착시간, 예상 접안시간 등 선박의 항만 입출항에 대한 예정 일정을 담고 있습니다.3. 기타사항: 항만 및 터미널명은 코드로 표시4. 유의사항: 각 선사의 담당자가 예정 일정을 직접 입력하여 생성하는 데이터로써, 모든 선박의 예정일정을 담고 있지 않으니 활용시 유의하여 주시기 바랍니다.'
