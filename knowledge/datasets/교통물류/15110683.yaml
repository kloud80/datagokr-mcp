      - name: TRGET_FCLTY_NM
        required: false
        example: 대전송강초교
        desc: 어린이 보호구역 시설명
      - name: RDNMADR
        required: false
        example: 대전 유성구 송강로42번길 6
        desc: 대상시설의 위치에 대한 상세 도로명주소
      - name: LNMADR
        required: false
        desc: 대상시설의 위치에 대한 상세 지번주소
      - name: LATITUDE
        required: false
        example: '36.4325440509'
