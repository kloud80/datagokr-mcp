summary_user: 대전광역시 시내 어린이보호구역을 대상시설(어린이집·학교 등) 단위로 한 건씩 담은 원천 목록으로, 시설 종류·대상시설명·도로명/지번 주소·위도·경도와 CCTV 설치 여부·설치 대수, 기준일자를 담는다. 학부모나 교통안전 분석가가 우리 동네 학교 앞 보호구역에 CCTV가 몇 대 설치돼 있는지, 어느 구역에 감시 장비가 없는지를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표 기반 공간 매칭이나 시설명 매핑으로 이어 쓰며, 전국 통일 형식인 어린이보호구역·무인교통단속카메라 표준데이터와 위치로 대조할 때 유용하다.
limits: 공통 코드 키가 없어 사고·단속 데이터와 바로 결합되지 않고 이름·주소·좌표 매칭이 필요하다. 범위는 대전광역시에 한정되며, 포털 안내상 청년 인턴이 구축·정비한 참고용 데이터로 법적 효력이 없다.
