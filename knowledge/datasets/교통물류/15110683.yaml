      - name: LONGITUDE
        required: false
        example: '127.384228348'
        desc: 보호구역의 중앙지점 경도좌표값 입력
      - name: CCTV_YN
        required: false
        example: Y
        desc: 보호구역 내 CCTV 설치 여부 (표현방식/단위 = Y:설치, N:미설치)
      - name: CCTV_NUMBER
        required: false
        example: '7'
        desc: 보호구역 내 CCTV 설치 대수 (표현방식/단위 = 대)
      - name: REFERENCEDATE
        required: false
        example: '2022-12-10'
        desc: 데이터 작성 기준일자
