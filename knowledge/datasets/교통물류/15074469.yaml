summary_user: 서울특별시 영등포구에 등록된 전기자동차를 차량 한 대씩 기록한 파일로, 모델연도·연료·최초등록일·등록연도를 담는다(포털 설명상 2018~2020년 등록분, 시군구 단위). 구청 담당자나 분석가가 '영등포구에서 해마다 전기차가 몇 대씩 새로 등록됐고 어떤 연식이 많은가'를 따져 충전 인프라나 친환경차 정책을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 등록연도나 영등포구라는 지역명으로만 맞춰 붙일 수 있다.
description_portal: 2018년부터 2020년까지 서울특별시 영등포구에서 등록된 전기자동차(electric vehicle) 현황 데이터를 제공합니다. 이 자료에는 차량의 등록일과 모델연도가 포함되어 있어 연도별 전기차 등록 추세를 분석할 수 있습니다. 해당 데이터는 전기차 보급 현황, 친환경차 정책 효과, 차량 교체 주기 등을 파악하는 데 유용하며, 나아가 전기차 충전 인프라 구축, 탄소중립 실현, 친환경 교통수단 확대 정책 수립을 위한 핵심 기초자료로 활용될 수 있으며, 다양한 연구와 행정계획에도 활용 가능합니다.
