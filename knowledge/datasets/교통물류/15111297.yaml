summary_user: 경기도 어린이·청소년(만 6~18세) 교통비 지원금의 신청자 수, 지급자 수, 1인 평균 지급액을 기준년도·기간구분별, 경기도 시군 단위로 집계한 파일 데이터입니다(포털 설명상 2021~2025년, CSV 약 19KB). 경기도나 시군 담당자·분석가가 '어느 시군에서 신청 대비 지급이 많고 1인당 얼마가 지원됐는가'를 비교할 때 쓴다. 전역 조인 키는 없으므로 행정구역(시군) 이름을 매핑해 시군별·연령별 인구 통계와 붙여 대상 인구 대비 신청 비율을 구하는 식으로 이어 쓴다.
description_portal: 경기도 어린이 청소년 교통비 지원금 지급 현황(파일형 데이터)- 경기도에 거주중인 어린이 및 청소년(만6세~만18세)들의 통학 등에 필요한 교통비를 신청하고 지원받은 내역을 시군별, 지급비율 등의 정보로 제공하고 있습니다.- 개방된 데이터는 2021년부터 2025년까지 경기도 시군별 교통비 지원을 신청한 신청자 수와 내역 및 증빙확인 등 절차에 따라 교통비를 지원받은 지급자 수, 년도별 지급비율 등 7종 약 3,000건 입니다.- 해당 데이터로 시군 지역별 대중교통을 활용하는 어린이 및 청소년의 분포 정도를 예측할 수 있으며, 지역별.연령별 인구데이터와 연계하여 대상연령별 신청자 비율을 추출할 수 있습니다.
