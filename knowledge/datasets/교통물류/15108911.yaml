description_portal: '강원특별자치도 강릉시 내 전기차 충전소 추가 설치가 적합한 후보지 정보를 정리한 데이터로, 후보지별 우선순위, 시설 유형, 위치(주소·좌표), 관리주체 등을 한 번에 확인할 수 있도록 구성된 자료입니다.연번: 전기차 충전소 후보지를 구분하기 위한 일련번호우선순위: 충전소 설치 필요성과 시급성을 반영한 우선순위 등급(1·2·3 등)시설유형: 후보지가 속한 시설의 유형(교통시설, 관광지, 공공시설, 상업시설, 주거지, 편의시설 등)시설명: 충전소 설치가 검토되는 주차장·건물·시설의 명칭도로명주소: 후보지의 도로명 기반 주소지번주소: 도로명주소와 대응되는 지번(번지) 주소관리주체: 해당 시설·부지를 관리·운영하는 주체(공공, 민간 등)위도: 후보지 위치의 위도 좌표(WGS84 기준)경도: 후보지 위치의 경도 좌표(WGS84 기준)데이터일자: 최적입지 분석 결과와 후보지 정보가 작성·확인된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 전역의 전기차 충전소 최적 설치 후보지를 체계적으로 관리하기 위한 기본 자료로, 공영·민간 충전소 설치 계획 수립, 충전 수요가 높은 생활권·관광권 중심의 인프라 확충, 공공·민간 투자 유치 및 협업 대상지 선정, 공간분석(GIS) 기반의 친환경 교통·탄소중립 정책 수립 등에 활용할 수 있는 공공데이터입니다.'
