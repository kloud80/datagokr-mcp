summary_user: 인천국제공항에서 운항한 여객기·화물기 실적을 월별로 항공사·노선·국가·공항별, 출발/도착·정기/부정기·여객/화물 구분에 따라 운항편수, 유임·무임·환승 여객수, 직화물·환적화물·우편물·수하물 물동량(kg)으로 담은 집계 파일이다(CSV 약 947KB). 특정 항공사나 노선의 월별 여객·화물 추이를 보려는 분석가가 "인천–특정 국가 노선의 환승객과 화물이 어떻게 변했나" 같은 질문을 풀거나, 관광·출장 수요와 수출입 물류 흐름을 가늠하는 데 쓴다. 전역 조인 키는 없으며, 항공사 ICAO·IATA 코드와 공항·국가 이름을 매개로 공항코드·항공사 정보 등 다른 항공 데이터와 이름·코드 매핑으로 잇는다.
description_portal: 인천국제공항의 항공운송실적 정보로 월별, 항공사별, 노선별, 국가별, 공항별로 인천공항에서 운항한 여객기 및 화물기의 정기/부정기 출발 도착 운항편수, 유임여객수, 무임여객수, 환승여객수, 직화물 물동량, 환적화물 물동량, 우편물 물동량, 수하물 물동량 실적에 대한 세부 정보를 포함하고 있습니다. (여객기/화물기 구분, 정기/부정기 구분, 출발/도착 구분) - 총여객수= 유임여객수+무임여객수+환승여객수 - 항공화물 = 직화물+환적화물+우편물 (인천공항의 항공화물은 수하물 물동량은 제외됩니다)매년 반기마다 업로드되며, 7월에 업로드되는 데이터는 당해 1~6월 데이터, 1월에 업로드되는 데이터는 전년도 1~12월 데이터입니다.
