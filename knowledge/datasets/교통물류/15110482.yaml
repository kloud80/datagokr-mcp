summary_user: 대전광역시 도로관리시스템에 등록된 도로 점용시설(점형)을 시설 한 건씩 담은 원천 파일로, 관리번호·허가일련번호·행정읍면동·도로구간·차도/보도 구분과 위도·경도 좌표를 포함한다. 대전 시내 특정 동이나 도로 구간에 어떤 점용시설이 얼마나 몰려 있는지, 공사·인허가 검토 때 해당 위치에 기존 점용물이 있는지 확인하려는 행정 실무자나 분석가가 쓴다. 전역 조인 키는 없어서 행정읍면동 이름이나 위경도 좌표로 다른 공간 데이터와 겹쳐 보거나, 같은 기관의 도로구간번호·허가일련번호로 대전시 도로·점용허가 자료와 맞춰 쓴다.
description_portal: 대전광역시_도로 점용시설(점) 현황 데이터는 대전광역시 도로관리시스템에 등록된 각종 도로 점용시설의 위치와 현황 정보를 종합적으로 제공합니다. 주요 항목에는 점용시설의 명칭, 설치 위치 좌표, 관리번호, 점용구간 및 규모, 점용유형 등 세부 정보가 포함되어 있어, 도로상 시설물의 분포 현황을 체계적으로 확인할 수 있습니다. 이를 통해 도로 환경 유지관리, 시설물 안전 점검, 관련 인허가 업무, 공공 설비계획, 도시 인프라 관리 등 다양한 행정 및 실무 분야에서의 활용도가 매우 높습니다.※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
