description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 1·2·3호선 각 역사별 심도 정보를 제공합니다. 데이터에는 역사별 심도 값과 산정 기준 정보가 포함되어 있으며, 1·2호선은 지하 승강장에서 지상까지의 높이, 3호선은 지상부터 선로 도상 바닥까지의 높이를 기준으로 구성되어 있습니다. 해당 데이터는 도시철도 역사 구조 및 공간 특성에 대한 현황 파악을 위한 자료로 활용할 수 있으며, 시설 관리, 공간 활용 검토, 관련 연구 및 분석을 위한 기초자료로 활용할 수 있습니다. 또한 도시철도 이용 시설에 대한 구조 정보를 제공하여 시민과 연구기관 등의 도시 인프라 이해를 높이는 데 활용될 수 있습니다. 본 데이터는 역사 신설 및 구조 변경 등 변동 사항 발생 시 갱신됩니다.'
