summary_user: 부산광역시 북구에 등록된 건설기계사업자를 업체 한 곳당 한 행으로 담은 건별 명단으로, 등록일·상호·대표자명·사업유형·등록종별·전화번호를 담으며 파일 크기는 577바이트로 매우 작다. 북구에서 굴착기·크레인 같은 건설기계를 빌려야 하는 시공업체나 주민이 "북구에 등록된 건설기계대여업체는 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 전역 조인 키(사업자번호 등)가 없으므로 다른 구·군의 같은 명단과는 상호·대표자명 같은 이름으로만 맞춰 이어 쓴다.
limits: 사업자등록번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 범위가 북구 한 곳에 한정된다. 포털 설명상 현재 대여업만 등록돼 있어 정비업·매매업 분포 분석에는 쓰지 못한다.
