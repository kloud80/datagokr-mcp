description_portal: 경상북도 경주시에서 관리하는 배기량별 자동차 등록대수 데이터이다. 본 자료는 경주시에 등록된 자동차의 등록 현황을 차량 종류와 배기량 구분에 따라 제공하는 통계자료이다. 데이터는 차량종류, 등록대수 합계, 관용, 자가용, 영업용 등록대수 항목으로 구성되어 차량 유형별 등록 규모와 용도별 분포를 확인할 수 있다. 행정기관은 교통행정과 자동차 정책 수립, 교통수요 분석의 기초자료로 활용할 수 있으며 연구기관은 자동차 등록 추세와 지역 교통 특성을 분석하는 자료로 활용할 수 있다. 시민과 기업은 자동차 등록 현황과 시장 동향을 파악하는 자료로 활용할 수 있다. 본 데이터는 경주시 자동차 등록 현황을 종합적으로 파악하고 교통행정을 지원하는 자료이다.
