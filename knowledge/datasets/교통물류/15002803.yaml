summary_user: 성북구도시관리공단이 운영하는 성북구 공영주차장 현황을 담은 작은 CSV 파일(2,581바이트)로, 주차장별 이름·주소·급지·운영시간·요금(5분당 시간요금, 1일 주차, 주간·야간·전일 정기요금)과 공단 직영·민간위탁별 주차장 수·면수 집계를 함께 담는다. 성북구 주민이나 방문자가 목적지 근처 공영주차장의 위치와 요금, 운영시간을 미리 확인하거나, 분석가가 직영과 위탁 주차장의 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 주차장·교통 데이터와는 주차장명이나 주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 쾌적한 도심 주차 환경을 조성하고 시민들의 이동 편의성을 극대화하기 위해 성북구도시관리공단 주차관리팀에서 전담 운영·관리하는 공영주차장의 통합 운영 현황 정보를 제공합니다.데이터의 세부 구성 체계로는 관내 주차장별 정밀 위치 안내와 총 주차 면수(수용량) 정보를 포함하여, 이용자의 예측 가능성을 높이기 위한 운영 시간 및 주차 요금(기본/추가) 등을 수록하고 있습니다. 이를 통해 이용자는 목적지 인근의 최적 주차 공간을 사전에 파악하여 불필요한 배회 주행을 줄이고 효율적인 이동 계획을 수립할 수 있습니다.본 데이터는 지역별 주차 수급 불균형 정밀 분석, 도심 교통 혼잡 완화 정책 수립, 실시간 주차 정보 공유 플랫폼 및 스마트 내비게이션 연계 서비스 개발을 위한 핵심 공공 데이터로서 그 활용 가치가 매우 높습니다.주차장별 면수 및  최신 현황은 성북구도시관리공단 홈페이지(https://www.gongdan.go.kr/park/statusAndLocation/selectStatusAndLocation.do)를 통해 상시 확인이 가능합니다.
