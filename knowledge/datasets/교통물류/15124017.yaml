summary_user: 경기도버스운송관리시스템(BMS)에 등록된 버스 터미널 정류소를 정류소 한 건씩 담은 원장이며, 정류소 번호·이름(sttn_nm)·지역 구분과 지역 번호·용도 구분 컬럼으로 이루어져 있다. 경기도 버스 노선이나 정류장을 분석하는 사람이 '어느 지역에 어떤 터미널 정류소가 등록돼 있는가'를 확인하거나 노선·도착 정보와 맞춰 볼 정류소 목록을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 정류장·노선·실시간 도착 데이터와는 정류소 이름이나 같은 기관의 정류소 번호를 매핑해 이어야 한다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에 등록된 터미널 정류소 정보를 포함하고 있으며, 각 정류장에 대한 고유 식별번호(정류장ID), 정류장명, 위치 정보(X좌표, Y좌표), 지역 코드(시도 관련 코드 및 기관 코드) 등을 제공합니다. 이 정보는 버스 정류소별 시설 위치를 파악하거나 정류소 간 거리 분석, 교통 인프라 설계, 버스 운행 노선의 정밀 분석 등에 활용될 수 있습니다. 특히 위치좌표 기반으로 정류장 분포를 시각화하거나 GIS 시스템과 연계해 실시간 버스정보서비스, 정류장 배치 최적화 및 노선 재편성 등의 교통정책 수립에 필수적인 기반 자료로 활용이 가능합니다.
