description_portal: 한국해양교통안전공단에서 제공하는 전국 연안 항로별 여객선의 기준 정보 데이터이다. 본 데이터는 국내 연안을 운항하는 각 여객선(여객선코드, 여객선명)의 주요 제원 정보인 엔진 종류와, 해당 선박이 인가받은 정식 면허항로(면허항로명) 및 항로에 포함된 모든 기항지명에 대한 상세 정보를 망라한다. 이는 매일 변동되는 운항 여부나 시간과 같은 동적 정보와 구별되는 선박과 항로 자체의 핵심적인 고정 정보로서, 해상교통 정보 생태계의 가장 기초가 되는 데이터라 할 수 있다.국민과 관련 산업 종사자들은 본 정보를 통해 특정 항로를 운항하는 선박의 종류와 제원을 파악할 수 있으며, 공공데이터포털에 개방된 "항로별 여객선 운항상황 현황"과 결합하여 더욱 심층적인 분석 및 정보 서비스 개발에 활용할 수 있다. 데이터는 선박, 항로, 기항지 등 명확한 항목으로 구성하여 사용자의 정보 접근성과 활용성을 극대화하였다. 공단은 앞으로도 정확하고 신뢰도 높은 해상교통 데이터를 지속적으로 개방하여 국민 편의 증진과 관련 산업 발전에 기여하고자 한다.
