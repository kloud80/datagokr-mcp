summary_user: 대구 지하철 2호선 역사 안에 설치된 ATM을 기기별로 담은 작은 파일(CSV 약 2.5KB)로, 역명·지상지하 구분·역층·상세위치·금융기관명·연락처·데이터기준일을 담는다. 대구 2호선 이용객이 특정 역에서 어느 은행 ATM을 몇 층 어디에서 쓸 수 있는지 확인하거나, 분석가가 역사 내 금융 편의시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 선명·역명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 대구 지하철 2호선 ATM기기의 철도운영기관, 선명, 역명, 지상지하구분, 역층, 상세위치, 금융기관명, 연락처, 데이터기준일 정보입니다.현금 자동 입출금기(現金自動入出金機), 간단히 ATM(Automated Teller Machine)은 은행을 대신하여 입출금이나 송금, 기타 역무를 편리하게 처리할 수 있도록 설치되는 기기이다. 입출금 외의 부가적 서비스를 고루 갖춘 것을 디지털 키오스크(Digital Kiosk)라고도 부르나, 일상적으로는 모두 통틀어 ATM으로 불리는 편이다.은행원의 일부 업무를 대신할 수 있어 인건비를 줄일 수 있으며, 은행을 열지 않는 매일 밤부터 아침, 또는 주말의 빈 시간, 또는 해당 은행 점포가 없는 곳에서 은행 역할을 대신한다.
