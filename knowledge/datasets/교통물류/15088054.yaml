summary_user: 한국교통안전공단 자동차검사관리시스템에 등록된 자동차 정비업체를 업체 한 곳당 한 행으로 담은 전국 범위의 샘플 파일(csv, 약 10KB)로, 업체코드·업체명·구분코드·주소·입력처리일자를 담는다. 분석가나 정책 담당자가 '우리 지역에 지정정비사업자·전문정비업체가 어디에 얼마나 분포하는가'를 가늠하거나 원본 자료 구조를 미리 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭이나 같은 기관(교통안전공단 검사관리시스템)의 정비업체코드로만 연결한다.
description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 관리하는 자동차검사 자료 중 하나로, 자동차 정비업체에 대한 정보를 정리한 데이터 샘플입니다. 해당 자료는 업체 구분(지정정비사업자, 전문정비업체 등), 소재지, 법정동 코드, 영업 현황(영업, 휴업, 폐업 등) 등을 기준으로 세분화되어 있으며, 지역별 정비업체의 분포와 운영 상태를 파악하는 데 유용합니다. 이 데이터는 정비업체의 관리 체계 분석, 정책 수립, 제도 운영에 필요한 참고자료로 활용될 수 있습니다.
