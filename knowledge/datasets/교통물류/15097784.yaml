summary_user: 대전광역시 안 교차로 모퉁이별 불법 주정차 금지구역을 한 행씩 담은 현황 파일로, 교차로 중심 위경도와 시군구, 금지구역 내용, 데이터 기준일자를 담는다(CSV 약 4.3MB). 운전자나 사업자가 특정 교차로 모퉁이에 차를 세워도 되는지 확인하거나, 분석가가 대전시 구별 교차로 주정차 금지구역 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어서 시군구코드·시군구명으로 행정구역 자료와 맞추거나 교차로 중심 좌표로 단속카메라·사고 지점 같은 공간 자료와 거리 기준으로 겹쳐 쓴다.
description_portal: 대전광역시 내 교차로 모퉁이 구간의 불법 주정차 금지구역에 대한 현황 자료로, 관리번호, 시군구, 시군구코드, 교차로 중심 경도와 위도, 불법 주정차 금지구역, 데이터 기준일자, 기타 항목이 포함되어 있습니다. 교차로 모퉁이 5m 이내는 주정차가 엄격히 금지되어 있으며, 위반 시 과태료가 부과됩니다. 이 자료는 교차로 안전 확보와 원활한 차량 소통, 교통사고 예방을 위해 활용되며, 각 구간별 단속 현황과 위치 정보가 체계적으로 정리되어 있습니다. 더불어, 교차로 시야 확보와 긴급차량 통행로 유지에도 중요한 역할을 하여 도시 전반의 교통환경 개선에 기여합니다.
