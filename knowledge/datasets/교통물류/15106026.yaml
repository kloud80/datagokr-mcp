summary_user: 강릉·경주·부산·여수·전주 5개 도시를 찾은 외지 방문객의 소비를 시군구·업종별로 묶어, 시도 안에서 각 업종이 차지하는 소비 건수 비율과 소비 금액 비율을 담은 집계 파일(xlsx)이다. 지자체 관광·상권 담당자나 분석가가 "외지 방문객이 이 도시에서 음식점·숙박·소매 중 어디에 돈을 많이 쓰는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시도·시군구 이름이나 업종명을 맞춰 다른 지역 통계와 이어 붙여야 한다.
description_portal: '이 데이터는 5대 도시(강릉, 경주, 부산, 여수, 전주)를 방문한 외지 방문객들의 시군구, 행정동, 업종별로 소비 행동을 분석해 업종 기준의 소비 건수 비율과 소비 금액 비율을 제공합니다. 즉, 각 도시 내에서 외지 방문객이 어떤 업종에서 얼마나 소비했는지, 업종별로 소비 빈도와 소비 금액이 어떻게 분포되어 있는지를 파악할 수 있습니다.이 자료를 통해 방문객들이 특정 도시에 방문했을 때 어느 업종(예: 음식점, 숙박업, 소매업 등)에서 소비가 많이 일어나는지 확인할 수 있습니다. 더불어 같은 업종 내에서도 도시·행정단위별로 소비패턴의 차이가 있는지, 업종별로 매출기여도가 높은 영역이 어디인지를 유추할 수 있습니다. 이에 따라 지역별 인기 업종, 소비 트렌드, 외지 방문객의 경제적 영향력 등의 인사이트를 도출하는 데 활용될 수 있습니다.이 데이터는 각 도시의 업종별 경영 전략이나 관광객 유치 정책에 대한 기초자료로 참고될 수 있습니다. 또한, 지역경제 활성화, 상권분석, 도시별 주요 소비업종 선정, 지역별·업종별 투자 또는 마케팅 전략 수립, 관광산업 발전 정책 등에 활용할 수 있는 실질적인 참고자료가 됩니다.'
