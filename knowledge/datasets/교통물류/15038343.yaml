summary_user: 나주시 버스 정류소를 한 줄에 한 곳씩 담은 CSV 파일(약 10KB)로, 정류소ID·정류소명·위도·경도·위치 설명(정류소위치)을 담는다. 나주 시민이나 앱 개발자가 "이 근처 버스 정류소는 어디이고 어떤 랜드마크 옆에 있나"를 지도에 표시하거나 찾을 때 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 노선·도착 데이터와는 정류소명 매칭이나 같은 기관 코드로만 잇고, 위도·경도로 주변 시설 데이터와 공간 결합해 쓴다.
limits: 정류소ID는 전역 조인 키로 확인되지 않아 국가 정류소 체계나 다른 기관 데이터와 바로 붙지 않으며, 이름 매핑이 필요하다. 노선·실시간 도착 정보는 없으므로 TAGO나 지자체 BIS 등 별도 데이터와 함께 써야 한다.
