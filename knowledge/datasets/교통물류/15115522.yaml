summary_user: 충청남도에 등록된 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 명부 파일로, 업체명·면허정보·현재운영여부·주소를 포함하며 포털 설명상 2023년 6월 23일 기준입니다. 화주나 물류 담당자가 '이 충남 업체가 일반화물 운송 면허를 가지고 현재 운영 중인가'를 확인하거나, 분석가가 시군별 운송사 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 업체명이나 주소를 맞춰 전국화물자동차운송사업자표준데이터 등 허가 원장과 대조해야 한다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되며 동명 업체 오매칭에 주의해야 한다. 허가 여부의 기준 데이터는 전국화물자동차운송사업자표준데이터이고, 이 파일은 충남 범위의 보조 자료다.
