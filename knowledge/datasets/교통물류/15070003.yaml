summary_user: 서울도시고속도로 8개 노선(내부순환로·강변북로·올림픽대로 등)의 2025년 월별 요일별 평균속도(07~22시 전구간 기준)와 노선별 월별 평일평균 교통량을 노선·월 단위로 집계한 작은 CSV 파일이다. 출퇴근 운전자나 교통 분석가가 '올림픽대로는 무슨 요일, 몇 월에 가장 느린가'처럼 노선별 요일·계절 속도 차이를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명(노선 이름)과 년도·월로 맞춰 이어 써야 한다.
description_portal: 서울도시고속도로 노선별 요일별 속도자료- 해당자료는 2025년 자료이며, 서울도시고속도로 8개 노선의 노선별 월별 요일별 평균속도 데이터를 확인 할 수 있음.- 속도는 요일별(평일평균, 월, 화, 수, 목, 금, 토, 일(휴일)) 및 노선별 월별 전구간 활동시간대 평균속도(07시~22시)를 산정하여 제공하였음.  또한, 참고 데이터로 노선별 월별 평일평균 교통량(해당노선의 특성을 반영하는 지점을 대표구간 자료로 사용)을 제공하였음.- 노선은 내부순환로, 강변북로, 북부간선도로, 올림픽대로, 동부간선도로, 분당수서로, 경부고속도로, 강남순환로 등 총 8개 노선임
