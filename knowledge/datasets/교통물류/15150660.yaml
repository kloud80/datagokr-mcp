summary_user: 한국도로공사 휴게소 내 주유소의 휘발유·경유·LPG 가격과 인근 도로 교통량·평균속도를 날짜·시간대별로 묶어 담은 전국 범위 데이터로, 휴게소(REAR_CD)·노선·방향·정유사 정보가 함께 들어 있다. 분석가가 "고속도로 교통량이 많은 휴게소나 시간대에 주유 가격이 더 높은가" 같은 가격과 통행량의 관계를 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 휴게소·주유소 데이터와는 휴게소 코드·이름이나 노선 코드·이름 매핑으로만 이어 붙인다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하는 휴게소 내 주유소의 가격(휘발유, 경유, LPG) 및 교통량 정보입니다.
