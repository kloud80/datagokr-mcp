summary_user: 울산항 벙커링(선박 연료 공급) 정박지 사용 신청을 건별로 담은 파일로, 입항구분·입항년도·입항항차·총톤수·벙커량·예정 시작·종료일·등록일을 담고 포털 설명상 2024년 8월 기준이며 CSV 약 33만 바이트 규모이다. 항만 이용자나 분석가가 울산항 벙커링정박지가 언제, 어느 크기 선박에, 얼마만큼의 연료 공급으로 쓰였는지 보고 사용 빈도와 운영 계획을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 입항년도·입항항차 같은 항목을 이름으로 맞추거나 같은 기관(울산항만공사) 입출항 자료와 맞대어 이어 쓴다.
description_portal: '- 울산항만공사 벙커링정박지 신청현황 데이터를 공공데이터 포털을 통해 대국민에게 개방하여, 항만운영의 투명성을 강화하고 울산항 이용자의 이해도를 제고하고자 합니다.- 데이터 기준일은 24년 8월 기준이며, 입항목적, 입항구분(입/출항), 신청시설코드, 입항년도, 입항항차, 총톤수, 벙커량, 예정시작·종료일, 등록일 등 다양한 항목으로 구성되어 개방되고 있습니다.- 해당 울산항 벙커링정박지 신청현황 데이터를 통해 사용빈도 파악, 운영 계획 수립 등 다양한 목적으로 활용이 가능할 것으로 예상됩니다.'
