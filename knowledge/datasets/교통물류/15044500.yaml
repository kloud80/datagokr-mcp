summary_user: 철도통계연보에 실린 통계 용어를 구분·통계명·용어명·용어설명 단위로 정리한 전국 범위의 용어집 파일(CSV, 약 75KB)이다. 철도 수송량·차량·사고 통계를 읽는 분석가나 기자가 '여객인킬로'나 '열차킬로' 같은 지표가 정확히 무엇을 뜻하는지 확인할 때 쓴다. 전역 조인 키가 없어서 철도통계연보 기반 통계 데이터와는 통계명이나 용어명을 이름으로 맞춰 이어 쓴다.
description_portal: '해당 데이터는 철도통계연보에서 발간되는 철도통계 용어집에 대한 설명입니다.철도통계연보는 한국철도공사에서 매년 발간하는 자료로, 철도 관련 통계 자료를 모아 놓은 책자입니다. 이 연보는 철도 노선, 역, 차량, 여객 및 화물 수송 현황 등 다양한 정보를 담고 있습니다. 쉽게 말해, 철도 사업 전반에 대한 통계 정보를 제공하는 자료입니다.- 철도 노선 및 역 현황: 철도 노선의 길이, 역의 종류 및 수, 선로 연장 등에 대한 정보를 포함합니다.- 차량 현황: 기관차, 객차, 화차 등 철도 차량의 종류, 수량, 운행 현황 등을 제공합니다.- 여객 및 화물 수송 현황: 여객 및 화물 수송량, 수송 거리, 수송 실적 등에 대한 통계 자료를 보여줍니다.- 철도 사고 현황: 철도 사고 발생 건수, 사상자 수 등 안전 관련 통계 자료도 포함하고 있습니다.- 기타: 철도 건설 및 개량 현황, 철도 관련 재정 현황 등 다양한 정보를 담고 있습니다.'
