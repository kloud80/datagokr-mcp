summary_user: 강릉·경주·부산·여수·전주 등 5개 도시 주요역에 하차한 철도 이용객의 소비를 하차역·업종별로 묶어, 전국 단위 소비와 관광지 안 소비의 금액·건수 비율(총계 및 1인당)을 나란히 담은 집계 파일이다. 지자체 관광 담당자나 상권 분석가가 '전주역에 내린 철도 관광객은 전국 평균보다 음식·숙박 업종에 더 많이 쓰는가' 같은 질문에 답할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 하차역 이름이나 업종명을 직접 맞춰서만 이을 수 있다.
description_portal: '이 데이터는 강릉, 경주, 부산, 여수, 전주 등 5대 도시 주요역에 하차한 철도 이용객의 업종별 소비 정보를 바탕으로, 전국단위 일반 소비행태와 해당 관광지 내에서의 소비행태를 비교할 수 있는 정보를 제공합니다. 이를 통해 관광지 방문객들이 각 지역에서 어떤 업종에 얼마나 소비하는지, 전국 평균과 비교했을 때 해당 지역 관광지 내 소비 패턴이 어떻게 다른지를 구체적으로 파악할 수 있습니다.데이터 분석을 통해 각 도시별로 철도 관광객이 주로 소비하는 업종(예: 숙박, 음식, 소매, 문화체험 등)과 그러한 소비의 상대적 비중을 확인할 수 있습니다. 또한 관광지 방문 시 전국 평균과 비교해 특정 업종에 대한 소비가 증가하거나 감소하는 경향, 도시별 업종별 특화 소비행태 차이, 외지 관광객이 경제에 미치는 영향 등 다양한 인사이트를 유추할 수 있습니다.이 자료는 도시별 주요 소비 유도 업종 선정, 관광산업 마케팅 전략, 관광지별 맞춤형 서비스 개발, 관광객 유입 효과 분석, 지역경제 활성화 정책 수립 등에서 참고자료로 활용될 수 있습니다. 효율적인 관광정책과 지역 상권 활성화, 관광객 친화적 인프라 조성 등 다각적인 활용이 가능한 기초 데이터입니다.'
