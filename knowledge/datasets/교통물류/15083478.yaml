summary_user: 인천교통공사가 운영하는 인천1호선(33개역)·인천2호선(27개역)·7호선 인천·부천구간(11개역)의 엘리베이터를 호기 단위로 한 줄씩 담은 설치현황 파일로, 호선·역명·장비종류·승강기번호·운행구간·설치위치를 담는다. 휠체어 이용자·고령자·유모차 이용객이 "이 역의 엘리베이터가 어느 출입구에서 대합실·승강장까지 이어지는가"를 확인하거나, 분석가가 역별 교통약자 이동편의시설 수를 비교하는 데 쓴다. 전역 조인 키는 없어 역명·호선 이름으로 다른 역 정보(역 좌표·출입구·승하차 인원)와 맞춰 붙이고, 승강기번호는 승강기 관련 다른 자료와 대조할 때 쓴다.
description_portal: 인천교통공사에서 운영중인 도시철도 인천1호선, 인천2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준 엘리베이터 설치현황 정보입니다.해당 데이터는 호선,역명,장비종류,호기,승강기번호,운행구간,설치위치 항목으로 구성되어있습니다.엘리베이터는 인천교통공사가 운영하는 도시철도노선 모든 역에 설치되어있습니다.인천1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역 , 인천2호선은 검단오류역에서 운연역까지 총 27개역, 7호선 인천·부천구간도 까치울역에서 석남역까지 총 11개역입니다.
