description_portal: '데이터 개요국토교통부_세계항공기_정보는 전 세계 항공기의 제조사, 모델, 제원 및 운항 특성 정보를 통합 제공하는 항공기 데이터베이스입니다. 항공기 분류, 기체 크기, 엔진 종류, 최대 수용 인원, 운항 거리 등 다양한 항목을 통해 항공기의 성능과 운용 가능성을 정량적으로 비교 분석할 수 있도록 구성되어 있으며, 항공사 기재 전략 수립, 기종 성능 분석, 정책 기획 자료 등으로 활용됩니다.데이터 제공 항목제조사비행기모델항공기코드 (IATA / ICAO)비행기구분: LandPlane, Seaplane 등비행기크기: HIGH, MEDIUM, LOW비행기등급: Narrow-body, Wide-body 등엔진 종류: Jet, Turboprop 등엔진 수최초운항일생산 상태: 생산중 / 단종조종석 수, 승객 수 (좌석 수)기체 길이 (m), 기체 높이 (m), 운송 가능 거리 (km)출처 및 갱신 주기항공기 제조사 및 ICAO, IATA 등록 정보를 기반으로 항공기별 제원을 정리데이터는 항공기별로 최신 상태(생산 중 / 단종 여부)를 포함하고 있어 실무 적용성 높음활용 안내항공사별 도입 가능 기종 분석 및 기재 운용 전략 수립항공기 성능 비교 및 기종별 운항 효율성 분석제조사별 기술 흐름 파악 및 항공기 시장 구조 연구데이터 해석 시 유의사항실제 운용 조건(탑재량, 기상 조건 등)에 따라 운송 범위는 달라질 수 있음동일 모델이라도 좌석 구성(2-class, 3-class)에 따라 승객 수는 상이할 수 있음항공기 등급 구분은 ICAO 및 업계 표준 분류를 기반으로 함예시 데이터제조사비행기모델IATAICAO비행기크기엔진승객수운송범위(km)상태AIRBUSAirbus 350-900A359359HIGHJet44015,372생산중AIRBUSAirbus A220-100BCS1221MEDIUMJet1356,390생산중'
