summary_user: 버스 노선별로 어떤 정류장을 몇 번째 순서로 지나는지를 담는 노선·정류장 단위 API이며, 시도·시군구·읍면동 행정구역 정보가 함께 들어 있다. 검증 호출에서는 전국 범위로 29행(전체 건수 29)이 수신되었고, 특정 노선이 어느 정류장에 정차하는지 알고 싶은 이용자나 노선·정류장 배치를 검토하는 분석가가 쓴다. 정류장ID(sttn_id, 조인 키 busstop_sttn_id)로 정류장 정보 데이터와, 시군구코드(sgg_cd)로 지역 단위 데이터와 이어 쓴다.
limits: 실측 최신 행 날짜는 2025-08-01이지만 검증 호출 조건(opr_ymd=20250801) 때문에 나온 값이라 데이터 자체의 최신성과 다를 수 있다. 검증된 수신 범위는 하루(2025-08-01) 29행이어서 전체 노선의 경유 정류장을 확인했다고 볼 수 없다. 포털 활용신청은 자동승인이며 개발계정은 일 1,000회까지 호출할 수 있다.
