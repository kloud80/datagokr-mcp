description_portal: 본 자료는 김천시 불법주정차 단속 CCTV 운영구역 정보를 정리한 것으로,  단속 CCTV 운영 현황을 포함하고 있습니다. 어린이보호구역 , 전통시장 및 시장구역, 그 외 일반 단속구역에 설치된 CCTV 현황을 포함하고 있습니다. 일반 단속구역의 운영시간은 07:30~18:00이며 유예시간은 11:00~16:00입니다. 전통시장구역의 유예시간은 10:00~17:00(전통시장 구역 장날 cctv를 통한 불법주정차 단속 전면 유예), 어린이보호구역의 유예시간은 11:00~13:30으로 운영되고 있습니다. 본 자료는 불법주정차 단속구역의 위치, 운영시간 및 유예시간 등 관련 정보를 제공하기 위한 자료입니다.
