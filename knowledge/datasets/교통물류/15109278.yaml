summary_user: 국토교통 국민참여 해커톤에서 수상했거나 인기 있는 유즈케이스와 관련된 데이터 목록을 건별로 담으며, 각 건마다 데이터 제목·카테고리·키워드·제공기관·원본등록일·제공페이지 주소를 제공하고 범위는 전국·비공간이다. 해커톤 참가자나 분석가가 '국토교통 분야에서 활용 사례가 검증된 공공데이터는 무엇이고 어디서 받나'를 검색어와 등록일로 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·키워드 같은 이름 매핑이나 제공기관 명칭으로만 느슨하게 연결하고, 제공페이지 주소(url)를 따라 원본 데이터셋으로 이동해 쓴다.
description_portal: 검색어, 데이터 등록일을 이용하여 국토교통 국민참여 해커톤에서 수상 또는 인기있는 국민참여 유즈케이스를 기반으로 한 데이터의 제목, 카테고리, 키워드, 제공기관, 원본등록일, 제공페이지 URL을 조회할 수 있는 국토교통부 국민참여 데이터 의 분석정보를 제공하는 서비스 입니다.공공데이터 제공기관, 제공범위, 활용가능 분야 등을 안내하고 공공데이터를 활용한 창업과 사업화 방법에 대한 자문 등 공공데이터 개방(공공부문)과 이용 활성화(민간부문) 전반을 지원하기 위하여 제공하는 데이터 입니다.
