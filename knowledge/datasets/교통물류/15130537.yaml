description_portal: 본 데이터는 2016년 이후 서울시 자동차전용도로에서 발생한 도로 침수 이력을 기록한 자료입니다.자료에는 침수 일시, 노선, 진행 방향, 침수 구간 등이 포함되어 있으며, 이를 통해 침수가 주로 발생하는 기간과 도로별 침수 위치를 확인할 수 있습니다.도로 침수는 주로 여름철, 장마철의 호우나 태풍에 의해 발생하며 한강과 중랑천의 수위 상승과 밀접한 연관이 있으며, 서울시설공단에서는 기상 정보와 수위 정보에 따라 교통 통제를 실시하고 있습니다.이 데이터는 교통 통제 이력 분석, 재난 대비 시설 개선, 침수 취약지역 파악 등에 활용될 수 있습니다.
