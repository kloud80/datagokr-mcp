summary_user: 인천광역시 영종구(포털 설명상 중구)의 공영주차장을 주차장 한 곳당 한 행으로 담은 파일로, 주소·위도·경도와 함께 주차구획수, 노상·노외 구분, 운영시간, 기본·추가 요금, 1일권·월정기권 요금, 결제방법, 관리기관을 담는다. 주민이나 방문객이 '영종 지역에서 월정기권을 운영하는 유료 공영주차장은 어디이고 요금이 얼마인가'를 확인하거나, 분석가가 시군구 단위 공영주차 공급을 파악하는 데 쓴다. 실측상 전역 조인 키는 없어서 주차장관리번호·주차장명으로 전국주차장정보표준데이터와 맞춰 보거나 위도·경도로 공간 결합해 쓰고, 실시간 주차 가능 대수는 지자체·공단별 별도 API와 따로 이어야 한다.
description_portal: 인천광역시 중구 공영주차장 현황입니다.정보 제공 항목은 주차장 위치, 주차장 장소 위도 및 경도, 주차장명, 주차 면수, 주차장 종류(노상, 노외), 주차 요금(유료,무료), 주차장 운영 시간, 주차장 이용 요일제 시행 유무, 주차장 급지 안내,  기본 요금 및 추가 요금, 1일 주차권 운영 유무 및 1일 주차 요금, 월정기권 운영 유무 및 요금, 주차요금 결제 방법, 주차장  관리 주체 등으로 구성되어 있습니다.무료 공영주차장 문의는 중구 교통운수과(032-750-7554), 유료 공영주차장 문의는 중구시설관리공단(032-850-1475)으로 연락하여 주시기 바랍니다.
