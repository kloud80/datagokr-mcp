summary_user: 부산교통공사 도시철도 각 역의 승차·하차 인원을 역별·월별로 집계하고 어린이·청소년·무임(경로우대 등) 같은 권종별 인원을 함께 담은 파일로, 포털 설명상 2014~2024년 11개년 자료다. 분석가나 상권·교통복지 연구자가 '특정 역의 무임승차 비중이 해마다 어떻게 변했나', '계절에 따라 어느 역 이용이 늘어나나' 같은 질문에 쓰며, 역별 승하차는 유동인구를 가늠하는 대체 지표로 쓰인다. 전역 조인 키가 없어 다른 데이터와는 역명이나 연월을 맞추는 이름 매칭, 또는 같은 기관의 역 정보로만 연결한다.
description_portal: 본 데이터는 부산교통공사 도시철도 각 역사에서 발생한 월별, 역별, 권종별 승차 및 하차 인원 정보를 제공합니다.일반권, 청소년권, 어린이권, 경로우대권 등 다양한 권종별 이용 현황을 월 단위로 수록하였으며, 도시철도 이용수요 분석, 요금 정책 수립, 교통복지 연구 등에 유용한 기초자료로 활용됩니다. 특히 특정 역의 권종별 이용 변화나 계절별 유동 인구 추이를 파악할 수 있어, 맞춤형 대중교통 서비스 기획과 교통 운영 효율화 방안 마련에 기여할 수 있습니다. 통계 기반의 정책 수립, 민간의 수요기반 서비스 개발 등 데이터 기반 행정을 위한 참고자료로 활용이 가능합니다.* 2014년부터 2024년까지 11개년 자료를 제공합니다.
