summary_user: "서울특별시 양천구 관내에 설치된 스마트횡단보도를 설치 지점 한 곳당 한 행으로 담은 파일로, 설치위치·설치주소·위도·경도·설치일자를 포함한다. 주민이나 교통안전 담당자가 '우리 동네 어느 횡단보도에 스마트횡단보도가 언제 설치됐나'를 확인하거나 시설 보수·보행안전 개선 대상을 고를 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위도·경도 좌표를 기준으로 공간 매칭해 잇는다(예: 어린이보호구역·무인교통단속카메라 표준데이터와 위치 대조)."
