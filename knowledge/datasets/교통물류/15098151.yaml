summary_user: 서울시내 육교를 노드와 링크로 나눠 위치(WKT 좌표, WGS84)와 링크 길이, 자치구·읍면동 코드와 이름을 담은 공간정보로, 포털 설명상 2020년 기준 자료다. 보행 동선이나 도로 횡단시설을 분석하는 사람이 '우리 동네(자치구·동)에 육교가 어디에 몇 개 있고 길이는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 시군구·읍면동 코드와 이름(SGG_CD, EMD_CD)을 매핑하거나 같은 서울시 자료와 노드·링크 ID로만 연결한다.
limits: 서울 열린데이터광장(data.seoul.go.kr)의 별도 인증키가 필요하며, 공공데이터포털 활용신청과는 별개다. 다른 기관 데이터와 바로 붙일 공통 키가 없어 행정구역 코드·이름 매핑에 의존해야 한다.
