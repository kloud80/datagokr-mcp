summary_user: 경기도 요소수 중점 유통 주유소별 요소수 재고 현황을 주유소 한 곳당 한 행으로 담으며, 주유소명·도로명주소·좌표·영업시간·전화번호·잔량과 잔량 구간(여유·보통·부족·매진)·가격·기준일자가 들어 있다. 2021~2022년 요소수 품귀 당시 어느 주유소에 요소수가 남아 있었고 얼마에 팔렸는지 되짚어 보는 분석에 쓴다. 전역 조인 키는 없어서 주유소명·주소로 매칭하거나 위도·경도(lat, logt)로 다른 주유소·시설 데이터와 공간 결합해 쓴다.
description_portal: '요소수 중점 유통 주유소에서 2시간 간격으로 입력하는 데이터를 5분 단위로 제공합니다.단, 실제 재고 현황과 차이가 있을 수 있으며, 공개되는 요소수 가격은 기본적으로 벌크 가격으로 페트 가격은 표시된 가격과 다를 수 있습니다.벌크 요소수가 매진 되었을 경우, 페트 요소수 가격으로 업데이트 됩니다.-잔량 수량 구간 구분-(GREEN)초록: 여유(YELLOW)노랑: 보통(RED)빨강: 부족(GRAY)회색: 매진※ 공공데이터포털(data.go.kr) 원본시스템 API지원 중단에 따라 요소수 중점 유통 주유소 재고 현황 데이터가 22년 8월 이후 갱신이 중단되었습니다.※ 대체데이터 : 주유소의 요소수 판매가격(지역별) → https://data.gg.go.kr/portal/data/service/selectServicePage.do?infId=16AV5FE8FIJYWJVBRG2532452510&infSeq=1'
