summary_user: 김제시 관내 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 업체명·주소·허가업종·보유 차량 대수·운영 여부를 기록한다. 화주나 물류 담당자가 "김제에서 지금 운영 중인 화물운송업체는 어디이고 차량을 몇 대 갖고 있나"를 확인하거나, 지자체가 지도점검 대상을 추릴 때 쓴다. 전역 조인 키가 없어 업체명·주소를 맞춰 전국화물자동차운송사업자표준데이터나 다른 시군의 같은 현황과 이어 써야 한다.
description_portal: 전북특별자치도 김제시 일반화물자동차운송사업자에 대한 현황 데이터로, 지역 내 화물운송업체의 운영 실태를 파악하기 위한 목적으로 수집된 정보입니다. 이 데이터는 업체명, 주소, 허가업종 구분, 보유 차량 대수, 업체 운영 여부 등의 항목으로 구성되어 있으며, 화물 운송 수요 예측, 물류 정책 수립, 안전관리 및 지도점검 등에 활용될 수 있습니다.또한 기업체 물류 협력 파트너 탐색, 화물 운송 서비스 수요자에게 유용한 참고자료로 활용 가능합니다.이 데이터는 김제시 관내 일반화물자동차운송업체의 규모 및 운영 현황을 파악하는 데 기초 자료로 활용될 수 있습니다.
