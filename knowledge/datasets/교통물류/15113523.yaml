summary_user: 경기도 시군별 버스노선마다 관할시군·운행업체·노선번호·노선ID·기점과 종점 정류장, 저상버스 운행 여부(lowfloor_bus_oprt_extno)를 노선 한 줄씩 담은 노선 단위 현황표다. 교통약자 단체나 정책 담당자가 '우리 시군의 어느 노선에 휠체어 이용 가능한 저상버스가 다니는가'를 확인하거나 시군 간 저상버스 도입 수준을 비교하는 데 쓴다. 실측상 전역 조인 키는 없어, 노선ID·정류장ID나 시군명을 경기도 버스노선·정류장 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별 버스노선에 대해 저상버스의 운행 여부를 확인할 수 있도록 정리된 자료입니다. 주요 항목으로는 순번, 관할시군, 운행업체명, 노선번호, 노선ID, 기점 및 종점, 기점정류장ID 및 종점정류장ID, 저상버스운행유무, 데이터기준일자 등이 포함되어 있으며, 각 버스노선에서 저상버스(휠체어 이용이 가능한 버스)의 운행 여부를 명시합니다. 이 자료는 교통약자 접근성 개선, 교통복지 정책 수립, 노선별 저상버스 도입 현황 평가, 버스 서비스 개선 등에 활용됩니다. 특히 시군별·노선별로 저상버스 운행여부를 구체적으로 파악할 수 있어, 정책의 지역별 균형성과 서비스 수준을 비교하는 데 유용합니다.
