summary_user: 광주 도시철도의 출발역–도착역 쌍마다 통과역 수와 역간 소요시간(분:초), 기준일자, 호선을 담은 역간 구간 단위 파일(CSV, 약 19.5KB)이다. 광주 지하철로 두 역 사이를 가는 데 몇 분이 걸리고 몇 개 역을 지나는지 확인하거나, 구간별 이동시간으로 역세권·접근성을 분석하는 데 쓴다. 출발역·도착역 코드가 광주 도시철도 역번호 키로, 호선이 도시철도 호선 키로 잡혀 있어 같은 키를 쓰는 광주교통공사 역 위치·승하차 데이터와 이어 쓴다.
description_portal: 이 데이터는 광주광역시 도시철도공사 역간 소요시간 현황을 정리한 자료로, 각 행은 특정 출발역과 도착역 간 운행 정보와 소요 시간을 나타냅니다. 주요 항목에는 출발역·도착역 명칭과 코드, 통과역 수, 역간 소요시간(분:초), 기준일자, 그리고 호선 번호가 포함되어 있습니다. 이를 통해 역 간 이동 시간과 거리 관계를 분석할 수 있으며, 노선 운영 효율성 평가, 배차 간격 최적화, 운행 계획 수립 등에 활용 가능합니다. 특히 통과역 수와 소요 시간을 함께 제공함으로써, 노선 구간별 혼잡도 예측, 최단 경로 분석, 환승 시간 계산 등 교통 서비스 품질 개선을 위한 다양한 분석 기반 자료로서 유용합니다.
