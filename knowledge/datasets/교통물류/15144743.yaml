summary_user: 안산시 RSE(노변기지국) 장비 간 통신으로 수집한 차량 통과 기록을 출발·도착 RSE 구간과 처리일자·기준시각별로 묶어 실제·추정 통과 차량 수와 최소·평균·최대 통행 시간을 담은 일별 집계 파일이다. 교통 분석가나 지자체 담당자가 '안산시 특정 RSE 구간의 평균 통행 시간이 날짜·시각별로 어떻게 달라지고 상습 정체 구간은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 출발·도착 RSE 고유번호를 안산시가 관리하는 RSE 위치 정보와 이름·코드로 매핑해야 다른 도로·교통 데이터와 이어 쓸 수 있다.
description_portal: 이 정보는 안산시 RSE 장비 간 통신을 통해 수집된 하루 단위 차량 통과 및 통행 시간 통계를 포함하며, 처리일자, 기준 시각, 출발 및 도착 RSE 고유번호, 통과 차량 수, 최소·평균·최대 통행 시간, 추정 통과 차량 수 등 12개 항목으로 구성됩니다. 이 정보는 노드 간 평균 이동 시간 산출, 경로 기반 혼잡도 평가, 구간별 통행 시간 비교, 교통량 기반 동적 신호제어 등에 활용됩니다. 또한 DSRC 기반 교통 정보 수집 체계에서 실시간 경로 선택, 교통 예측 시스템 연계, 통행 시간 이력 데이터베이스 구축 등 스마트 교통 정책의 핵심 요소로 사용됩니다. 이 정보를 통해 교차로 간 이동 흐름을 정량화하고, 도심 내 지체 시간 분석, 신호 최적화, 경로 재설계 등에 활용할 수 있습니다.
