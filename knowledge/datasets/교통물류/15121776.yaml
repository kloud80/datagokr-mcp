description_portal: 이 데이터는 광주교통공사의 승차권 발매 통계 정보입니다. 주요 항목은 연간(연·월), 역사명, 카드종류, 발매건수, 발매금액입니다. ‘연간’은 2022년 1월부터 월 단위로 기록되어 있고, ‘역사명’은 녹동, 소태, 학동증심사입구 등 도시철도 1호선 전 구간의 역명을 포함합니다. ‘카드종류’는 일반, 어린이, 경로, 장애인, 유공자 등으로 구분되며, 발매건수와 발매금액은 각각 해당 유형의 발권 건수와 금액을 나타냅니다. 경로, 장애인, 유공자 등의 경우 요금이 무료이므로 발매금액이 0원으로 표시됩니다. 이 자료는 역별·연령대별·이용자 유형별 승차권 발권 현황 분석, 수입 구조 파악, 무임승차 비율 계산, 계절·월별 수요 변화 분석 등 대중교통 운영 전략 수립에 활용할 수 있는 중요한 기초 자료입니다.
