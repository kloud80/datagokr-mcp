summary_user: 대전도시철도 1호선 판암역~반석역 22개 역사에 설치된 음성유도기(포털 설명 기준 총 271개)를 설비 단위로 정리한 파일로, 역사별 상세위치(외부출입구·장애인 엘리베이터·화장실 입구·발매기실 등)와 안내 멘트 내용을 담는다. 시각장애인 등 교통약자 이동지원 단체나 길안내 앱 개발자가 '이 역의 어느 출입구와 엘리베이터에 음성유도기가 있고 어떤 안내가 나오는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 대전교통공사의 다른 역사·편의시설 데이터와는 역명을 이름으로 맞춰 연결해야 한다.
description_portal: 대전교통공사_음성유도기 설치 현황  - 대전교통공사에서는 교통약지의 원활한 대전교통공사 시설물의 이용을 위하여 음성유도기 설치하여 관련 법규를 준수하고 이용편의를 제공하고자 노력하고 있습니다.  - 해당 데이터는 판암역~반석역 총 22개 역사에 해당하는 음성유도기 설비의 역사별 상세위치, 음성유도기의 위치정도, 멘트 사항을 포함하고 있습니다.  - 판암역~반석역(대전교통공사 1호선)에 대한 역사 음성유도기 설치의 총 개수는 271개로 각 역삽별 외부출입구, 장애인 엘레베이터, 화장실 입구, 발매기실 등의 위치에 설치 되어있습니다.  - 해당의 공공데이터 자료는 대전도시철도 1호선 음성유도기 설치 현황에 대한 전반적인 사항을 포함하고 있으며, 해당 설비는 교통약자의 원활한 시설운용을 위한 설비로, 설비의 온전한  동작 상태 확인을 위하여 정기적인 점검 및 장애인의날을 위한 특별 점검등을 시행하여 설비의 유지관리에 기여 하고 있습니다.
