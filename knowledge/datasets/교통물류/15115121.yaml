summary_user: 충청북도 증평군에 등록된 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.7KB)로, 업체명·면허종류·직영과 위수탁을 나눈 차량대수·주소·데이터기준일자를 수록한다. 화주나 물류 담당자가 "증평군에서 허가받은 일반화물 운송사가 어디이고 차량을 몇 대 보유했는가"를 확인하거나, 분석가가 군 단위 화물 운송능력을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭으로만 잇고, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터와 대조해 확인한다.
