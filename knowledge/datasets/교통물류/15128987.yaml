description_portal: 「화물자동차운수사업법」에 따라 지방자치단체에서 관리하는 부산광역시 동구 이사화물 업체 수 데이터입니다. 이 데이터에는 업체명이 포함되어 있으며 관내 업체 현황을 파악할 수 있습니다. 2025.11.기준 데이터로 부산광역시 동구 관내에는 총 7개의 업체가 있으며, 상호명만 포함되어있는 자료입니다. 운송주선사업자는  허가를 받은 후, 5년마다 90일 이내에 허가 기준에 관한 사항을 주기적 신고하여야하며 관련법규에 적합한 시설을 계속 갖추고 사업장소는 등록허가 장소만 허용 합니다. 화물의 안전수송과 서비스 향상을 위하여 항상 노력하여야 하며 각종 행정지시를 성실히 이행하여야 합니다.
