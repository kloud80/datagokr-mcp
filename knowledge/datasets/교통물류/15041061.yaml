summary_user: 경춘선 역사별 환승 정보를 담은 작은 파일(csv, 774 bytes)로, 역마다 운영기관·노선명·역명과 환승 대상 운영기관·환승선명·환승 기점역·환승 이후역, 그리고 빠른 환승에 유리한 열차 칸 순서와 출입문 번호를 한 행씩 담는다. 경춘선을 타는 통근자나 관광객이 '이 역에서 다른 노선으로 갈아타려면 몇 번째 칸 몇 번 문에서 내려야 하나'를 안내하는 앱·역사 안내 서비스에 쓴다. 전역 조인 키가 없어 다른 역·노선 데이터와는 역명·노선명 같은 이름 매핑으로만 이어 쓴다.
