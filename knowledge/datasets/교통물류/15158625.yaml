summary_user: 한국공항공사가 관할하는 공항(인천 제외)의 편 단위 실시간 운항정보를 담으며, 편명별 예정·실제 시각, 지연·결항 여부, 출도착 공항을 제공한다. 검증 기간(2026-09-29~10-03) 전국 범위로 API 전체 8,344건이다. 여행객이 오늘 특정 편이 지연·결항됐는지 확인하거나 보험사가 지연·결항 보상 자격을 확인하는 데 쓴다. 출발·도착공항 IATA 코드(depAirportCode, arrAirportCode)와 편명(flightid)으로 공항코드 데이터나 같은 기관 데이터와 연결할 수 있다.
description_portal: 한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는 한국공항공사가 관할하는 운영하고 있는 공항의 실시간 항공기 운항정보를 제공합니다.기존 제공하던 면세점용 여객기 실시간 운항조회, 실시간 항공운항 현황정보 상세 조회서비스, 보험사용 항공편 지연결항 결과조회, 항공기 운항정보 내 실시간 운항정보를 포함하였습니다.보험사에서 항공기 지연 결항에 대한 정보를 통해 보상 자격 확인을 위한 항공편 정보를 제공합니다.(기준일 D-3 ~ D+6일까지 조회)제공되는 주요 데이터 항목으로는 편명별 출도착 시각, 지연여부, 결항여부, 출도착 공항 등 이 상세히 포함되어 있습니다. 이를 통해 공항 실시간 운항정보 제공 서비스 등 다양한 목적의 데이터 활용이 가능합니다.제공되는 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.
