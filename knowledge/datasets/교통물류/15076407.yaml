status: active
summary_user: 상시·수시 교통량 조사 지점의 측정 장치 목록과 위치(장치 ID·종류·좌표·주소·지역)를 담고, 오퍼레이션에 따라 도로 종류·차종·시간대별 일자 교통량을 조회하는 API다(전체 550건, 검증 수신 450행, 전국 범위). 분석가나 사업자가 '이 입지 주변 국도·고속도로 조사지점의 통행량은 얼마인가' 같은 상권·입지 분석 질문에 쓴다. 지점 좌표(위도·경도)와 장치 위치 주소를 키로 삼아 주소·좌표 기반의 다른 입지·상권 데이터와 이어 쓰고, 장치 ID는 교통량 조회 오퍼레이션의 입력으로 넘긴다.
limits: 실호출 검증에서 6개 오퍼레이션 중 1개만 성공했고, 장치 상태·지점별 차종 교통량 등 여러 오퍼레이션은 최소 파라미터로 응답이 없었다. 교통량 조회에 필요한 장치 ID·자료 유형·월 등은 다른 응답의 코드이므로 먼저 장치 목록을 받아 넘겨야 하며, 개발계정은 하루 100회로 제한된다.
