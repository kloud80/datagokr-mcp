summary_user: 전국 드론(초경량비행장치 중 무인비행장치) 기체 신고 건수를 연도별로 신규·변경·말소 신고로 나눠 담은 전국 단위 집계 파일로, 451바이트짜리 작은 CSV입니다. 분석가나 드론 사업자가 "해마다 새로 신고되는 드론이 늘고 있는가, 말소는 얼마나 되는가"처럼 국내 드론 보급 규모와 추세를 볼 때 쓴다. 지역·기관 코드 같은 조인 키가 없고 연도(년도)만 있어서, 다른 드론 비행승인·조종자격 통계와는 연도 기준으로만 나란히 놓고 비교한다.
description_portal: 항공사업법 제122조(초경량비행장치 신고), 제123조(초경량비행장치 변경신고 등)에 따라, 드론(초경량비행장치 중 무인비행장치에 한함)을 소유한 자는 신고를 해여야 하고, 한국교통안전공단은 같은법 제135조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.기체 신고 시 소유자정보, 종류, 모델, 최대이륙중량 등을 등록해야 하며, 현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있다.년도별 신규,변경,말소의 신고현황자료이다.
