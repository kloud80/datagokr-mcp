description_portal: 국가철도공단_EPMS_재해근무일지 현황 데이터는 국가철도공단 내부에서 재해 대응을 위해 운영되는 근무 일지 정보를 기반으로 구성된 자료입니다. 이 데이터는 재해 상황 발생 시 각 기관 및 소속 직원의 근무 현황을 체계적으로 기록·관리하기 위해 EPMS(전사적 문서관리시스템)를 통해 수집되며, 순번, 기관, 근무일자, 소속, 직급, 성명, 작성일시, 주간·야간 근무 구분 등 주요 메타데이터로 이루어져 있습니다. 해당 자료는 재해 대응 인력의 배치 현황을 확인하고, 근무 기록의 신뢰성과 시점 정보를 확인할 수 있도록 설계되어 있어 재난 상황의 대응 체계 강화와 사후 분석에도 활용될 수 있는 기반 정보로 활용됩니다.
