summary_user: 광양항 서부컨테이너터미널에 드나든 컨테이너 차량을 한 건씩 기록한 원천 데이터로, 차량번호·진입/진출 게이트와 일시·작업시간을 담은 CSV 파일(약 5.4MB)이다. 터미널 운영자나 물류 분석가가 '어느 날짜·시간대에 게이트 차량이 몰리고, 차량 한 대가 터미널 안에 얼마나 머무는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜·시간대로 맞추거나 같은 기관(여수광양항만공사)의 물동량 자료와 이름 기준으로만 이어 쓴다.
limits: 다른 데이터와 직접 결합할 공통 코드가 없어 차량 기록을 화물·선박·화주 정보와 바로 연결할 수 없다. 범위는 광양항 서부컨테이너터미널 한 곳의 게이트 기록이며, 행정구역 단위의 공간 분석에는 맞지 않는다.
