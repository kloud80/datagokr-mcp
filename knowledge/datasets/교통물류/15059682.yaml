description_portal: 광양항 내 서부컨테이너 터미널이 운영하는 게이트별 컨테이너 차량의 이동데이터 입니다. 차량번호, 진입게이트, 진입시간, 진출게이트, 진출시간, 작업시간으로 구성되어 있습니다. 데이터 갱신주기는 반기입니다.이 데이터는 특정 시점의 차량 집중 현상이나 일자별, 시간대별 통행량 추이를 확인하는 데 유용하며, 터미널 운영정책 수립이나 주차·대기 공간 관리에도 참고할 수 있습니다. 또한 차량별 통행 특성을 추적하면 주요 고객사 물동량 흐름이나 특정 노선의 이용 패턴까지 파악할 수 있습니다. 나아가 교통 빅데이터로서 항만 배후단지 접근로 개선, 친환경 교통수단 도입, 항만 스마트 모빌리티 구축 등의 근거자료로 활용될 수 있습니다. 결국 이 자료는 항만 운영의 효율화, 물류 경쟁력 강화, 그리고 교통 안전 및 환경정책 수립을 위한 중요한 기초 데이터라 할 수 있습니다.
