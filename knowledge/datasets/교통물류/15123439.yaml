summary_user: 서산시 도시계획정보시스템에서 시설보호지구를 저장하는 테이블의 구조를 설명하는 메타데이터로, 지구 자체의 위치·면적 같은 실제 값이 아니라 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목을 행 단위로 담은 작은 CSV 파일(2,660바이트)이다. 서산시 도시계획 자료를 받아 분석하려는 분석가나 개발자가 '시설보호지구 테이블에는 어떤 컬럼이 있고, 영문 컬럼명은 각각 무슨 뜻인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 기관이 낸 도시계획정보시스템 메타데이터나 실제 공간자료와는 테이블명·컬럼명을 이름으로 맞춰 이어 쓴다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 시설보호지구에 관한 메타데이터이다. 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 시설보호지구는 공공시설 또는 주요 기반시설의 보호와 기능 유지를 위해 지정되며, 개발행위 제한 등 특정 규제가 적용된다. 본 데이터는 해당 지구의 목적과 규제 기준을 이해하는 데 유용하며, 도시계획 수립, 인허가 검토, 행정업무 등에 참고자료로 활용할 수 있다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 도움이 되며, 정책 수립, 공간정보 분석, 민간 활용 등 다양한 분야의 기초자료로 제공된다.
