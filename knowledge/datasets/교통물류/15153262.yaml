summary_user: 전국 일반국도의 상시 교통량 조사지점 정보를 지점 단위로 담는 데이터로, 조사연도·노선·구간·차로수·소재지(시도·시군구·읍면동·리)·연평균 일교통량·좌표 필드를 갖고 있다. 도로 분석가나 지자체 담당자가 '특정 국도 구간에 조사지점이 어디 있고, 하루 평균 교통량이 얼마인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 노선번호·구간명, 시도코드(PROVIN_CD)·지역명 같은 이름·코드 매핑이나 좌표로 표준노드링크 등 다른 도로망 데이터와 이어 쓴다.
