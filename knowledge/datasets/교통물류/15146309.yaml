description_portal: '2006년 이전 통계 데이터○ 통계개요* 통계명 : 주차장(동별)* 통계종류 : 서울시 주차장 현황을 동 단위로 제공하는 일반ㆍ조사통계* 작성목적 : 서울시 주차장의 종류별, 운영주체별 현황 등을 파악하여 각종 정책수립과연구ㆍ분석 등을 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울특별시 주차계획과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구ㆍ동내용 - 서울시 주차장의 종류별(노상, 노외, 건축물부설), 운영주체별(공영, 민영) 현황 등○ 용어설명* 노상주차장 : 도로의 노면 또는 교통광장의 일정한 구역에 설치된 주차장으로서일반의 이용에 제공되는 것* 노외주차장 : 도로의 노면 또는 교통광장 외의 장소에 설치된 주차장으로서일반의 이용에 제공되는 것* 부설주차장 : 건축물 등 주차수요를 유발하는 시설에 부대하여 설치된 주차장으로서해당건축물ㆍ시설의 이용자 또는 일반의 이용에 제공되는 것○ 기타* 합계의 공영주차장은 노상주차장(시영ㆍ구영) + 노외주차장의(시영ㆍ구영)부문이며,민영주차장은 노외주차장(민영) + 건축물부설주차장 부문임* 2007년부터 노상주차장에 거주자우선 주차장 포함. 거주자우선 주차장은 구영에 포함되어 있으며, 구영은 다시 거주자우선과 시간제 주차장으로 구분가능'
