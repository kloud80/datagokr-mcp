description_portal: 자동차 번호판 영치는 자동차손해배상 보장법, 도로교통법, 자동차관리법 위반(체납된 세금, 과태료, 보험 미가입)등으로 인해 차량 번호판을 공무원이 압수하는 행정처분입니다. 이는 납세 의무 이행을 강제하고 자동차 관련 법규를 준수하도록 유도하며, 불법 운행을 방지하기 위한 제도입니다.서울특별시 강북구 자동차 번호판 영치 현황에 대한 데이터로 2014년 1월부터 현재까지 월별 영치건수 통계 자료를 제공합니다. 데이터의 정보는 영치년도, 영치월, 영치기관, 영치기관코드, 영치건수로 이루어져있습니다.
