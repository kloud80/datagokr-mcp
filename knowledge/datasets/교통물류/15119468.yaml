description_portal: 항공자격시험(ARTS) 항공종사자 자격시험 정보 공개(실기원서접수현황) 입니다. 해당파일을 통해 확인하실 수 있습니다. - 항공안전법 제34조 및 같은 법 규칙 제75조와 별표 4에 따른 응시경력을 충족하는 사람으로서 실기시험에 응시하고자 하는 사람은 별표 1에서 정한 서류를 첨부하여 응시자격 부여를 공단이사장에게 신청합니다. - 실기시험에 응시하고자 하는 사람은 학과시험에 합격하고 항공종사자 자격증명 시험요령(국토부 고시) 제2항에 따른 응시자격을 부여받은 후 공단에 방문하거나 공단 인터넷 홈페이지를 통해 응시원서를 제출하게 됩니다. - 본 데이터는  공단이사장이 상기 응시원서를 접수할 때에 응시 현황 자료를 전산 보관하는 사항들과 관련됩니다.
