summary_user: 서울특별시 용산구 관내 불법 주정차 단속용 고정 CCTV를 대당 한 건씩 담은 현황 목록으로, 설치 주소(FIX_CCTV_ADDR), 단속 지점명, 위도·경도, 자치구 코드 등을 포함한다. 주민이 '우리 동네 어느 도로에 주정차 단속 카메라가 있나'를 확인하거나, 구청·분석가가 어린이 보호구역·혼잡 구간 주변의 단속 장비 분포를 지도에서 점검하는 데 쓴다. 전역 조인 키는 없어 자치구 코드(CGG_CD)나 주소·지점명 매칭으로 다른 데이터와 연결하고, 위도·경도로 보호구역·사고다발지점 같은 위치 데이터와 공간 결합해 쓴다.
description_portal: 이 자료는 서울특별시 용산구 관내에 설치된 불법 주정차 단속용 CCTV의 현황 정보를 체계적으로 정리한 것으로, CCTV ID, 설치 위치(도로명 주소 및 지점명), 위도·경도 좌표, 설치년월, 운영 시간대(24시간 또는 시간제), 단속 기준 시간(서울시 5분, 용산구 10분), 데이터 기준일자 등의 항목을 포함합니다. 이 정보를 통해 단속 장비의 설치 분포와 운영 특성을 분석하고, 교통 질서 확립, 교통 사고 예방, 보행자 안전 확보, 도로 혼잡 완화, 불법 주정차 단속 계획 수립, 민원 대응 및 교통 정책 마련 등에 활용할 수 있습니다. 특히 어린이 보호구역, 노인 보호구역, 소화전 주변, 혼잡 구간 등에서의 단속 강도를 파악하여 CCTV 신규 설치나 유지보수 계획 수립에도 기초 자료로 활용 가능하며, 교통 행정 부서, 지역 주민, 민원 응대 조직 등 다양한 주체가 도로 안전 강화와 행정 투명성 제고를 위해 참고할 수 있는 실효성 높은 자료입니다. 특정 시간대나 구역별 단속 효율을 분석함으로써 향후 교통 인프라 개선에 활용될 수 있습니다.
