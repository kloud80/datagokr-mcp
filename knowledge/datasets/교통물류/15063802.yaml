description_portal: 수원시 불법주정차 단속 정보에 대한 데이터로관내 지역별 단속구분 및 단속일자 에 따른 단속 건수 정보 등의 항목을 제공합니다.  어떤 방식(고정형 CCTV, 국민신문고, 모바일 등)으로 단속이 가장 많이 이루어지는지 알 수 있어 시민이 위반 위험이 높은 상황을 인식하는데 도움이 됩니다. 단속 건수와 출처를 알 수 있어 시민은 단속이 공정하게 이루어지는지 확인 가능합니다. 특정 구역 출처에 단속이 과도하게 집중되는지 시민 눈높이에서 검증하는데에 활용할 수 있습니다. 국민 신문고 등 시민 참여 채널을 통한 단속 비율을 보면 시민 제보가 실제 효과을 내는 구나로 체감할 수 있습니다.
