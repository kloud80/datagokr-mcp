summary_user: "수원시 불법주정차 단속 실적을 부서(구청 등)·단속구분(고정형 CCTV, 국민신문고, 모바일 등)·단속일자별로 집계한 파일로, 총 단속건수와 정상·종결 건수를 담는다. 시민이나 분석가가 '수원시에서 어떤 단속 방식(예: 시민 제보 대 CCTV)으로 단속이 가장 많이 이뤄지고, 특정 부서에 단속이 몰리는가'를 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 부서명·날짜를 이름으로 맞추거나 같은 기관(수원시) 자료끼리만 이어 쓴다."
