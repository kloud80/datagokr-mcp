summary_user: 대구광역시 달성군에서 허가한 도로굴착 건을 허가일·허가번호·신청기관·주소·포장종류·폭·연장·면적 단위로 한 건씩 담은 파일(CSV 약 1.3MB)이다. 지역 주민이나 사업자가 '우리 동네 도로를 어느 기관이 언제, 어느 규모로 파헤쳤는가'를 확인하거나, 분석가가 신청기관별·지역별 굴착 공사 빈도를 집계하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(주소)를 지오코딩하거나 신청기관 이름을 매핑해야 이어 쓸 수 있으며, 달성군의 도로점용 허가 등 같은 기관 자료와 함께 보는 방식이 현실적이다.
limits: 표준 코드나 전역 키가 없어 다른 기관 데이터와 직접 결합되지 않고, 주소·기관명 문자열 매핑에 의존한다. 범위는 달성군 한 곳뿐이며, 명세상 수시 생성 자료라 정기적으로 갱신된다고 가정하면 안 된다.
