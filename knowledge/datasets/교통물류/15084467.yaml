description_portal: 도로 굴착 허가와 관련된 기본 현황 정보를 정리한 자료로, 굴착 위치, 허가 대상, 공사 목적 등 도로 관리 및 굴착 허가 업무에 필요한 주요 정보를 포함하고 있다. 본 자료는 도로굴착 허가 대상의 분포 현황과 관리 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 도로굴착 허가 현황에 대한 체계적인 관리를 통해 도로 시설 훼손을 최소화하고, 지하 매설물 보호 및 안전한 도로 이용 환경 조성을 위한 행정적 의사결정을 지원한다. 본 자료는 도로굴착 공사에 대한 행정 관리, 허가·점검 및 공사 관리 업무 수행과 함께 관련 통계 산출 및 도로 관리 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 도로 이용자의 안전 확보와 도로 시설의 효율적인 유지 관리를 위한 관리 체계를 강화하고, 도로 공사로 인한 불편을 최소화하기 위한 정책 추진의 기초자료로 활용되며, 지속적인 도로 관리 및 건설 행정 업무 수행을 지원하는 행정자료로 활용된다.
