description_portal: 본 데이터는 한국도로공사에서 고속도로 상 과적 차량을 단속한 실적을 연도별로 정리한 자료이다. 과적 차량은 도로의 파손과 교통사고 위험을 높이는 주요 요인으로, 본 데이터는 안전한 고속도로 환경 조성을 위한 기초자료로 활용된다. 데이터는 본부별 단속 구분, 상세 구분, 연도별 단속 건수 등으로 구성되어 있으며, 2018년부터 2025년까지의 이력을 포함한다. 이를 통해 지역별 과적 발생 추이, 단속 강화 효과, 정책 수립의 기초자료로 활용될 수 있다. 또한 교통안전 관련 연구, 시설 보강 계획 수립, 단속 효율성 분석 등 다양한 목적으로 민간과 공공 부문에서의 활용이 가능하다. 시계열적 분석이 가능하도록 연속성과 체계성을 갖추어 제공되는 공공데이터이다.
