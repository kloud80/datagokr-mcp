description_portal: 한국해양교통안전공단에서 제공하는 전국 연안 여객선 항로별 월별 이용 현황 통계 데이터이다. 본 자료는 각 항로의 이용객을 도서민과 일반인으로 구분하여 파악할 수 있도록 월별 여객 수송 실적 정보를 상세하게 집계하여 제공한다. 데이터는 일반 국민, 섬 지역 주민으로 이용객 유형을 구분하여 각 항로의 월간 승객 수 정보를 포함하고 있어 다각적인 분석이 가능하다. 본 통계는 해상교통 정책의 효과성 분석, 특정 시기별 항로 운영의 효율화 방안 모색, 학술 기관의 교통 수요 예측 연구 및 도서 지역의 관광 활성화 전략 수립 등 여러 분야에서 핵심적인 기초 자료로 활용될 수 있다. 데이터의 정확성과 일관성을 유지하기 위해 정기적인 검증 절차를 거쳤으며, 사용자의 정보 접근성과 데이터 활용성을 극대화하고자 표준화된 형식으로 개방한다. 이를 통해 국민의 안전하고 편리한 해상교통 이용을 지원하고 관련 산업의 건전한 발전에 기여하고자 한다. 단, 본 데이터는 여객 운송 실적 정보만을 포함하며, 차량 및 화물 선적 관련 정보는 포함하고 있지 않다.
