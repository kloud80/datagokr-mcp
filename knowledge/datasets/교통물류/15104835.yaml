summary_user: 서울교통공사 1~8호선의 역별·일별·승객유형별 승차인원과 환승유입인원을 담은 집계 파일(CSV, 약 42MB)로, 인원은 실제 사람 수가 아니라 교통카드 태그 횟수 기준이다. 분석가나 상권 조사자가 '특정 역의 하루 이용객이 요일·시기별로 어떻게 달라지고 환승으로 들어오는 인원은 얼마인가'를 확인해 유동인구 대체 지표로 쓴다. 전역 공통 조인 키는 없어서, 역명이나 서울교통공사 자체 역번호로 같은 기관의 시간대별 승하차·역 위치 데이터와 맞춰 이어 쓴다.
description_portal: 서울교통공사 1~8호선 역별 일별 승객유형별 수송인원(환승유입인원 포함) 정보입니다. 해당 데이터는 연번, 날짜 호선, 역번호, 역명, 승객유형, 승차인원, 환승유입인원 데이터로 구성되어 있습니다. 환승유입인원은 하차인원 중 승차호선이 다른 인원으로 간주합니다. 승차인원은 해당 역에서 개표를 하고 들어간 인원을 산정합니다. 인원의 정의는 실제 한 사람을 세는 것이 아닌 한 사람이 태그 한 횟수를 인원이라고 산정합니다. 1호선의 경우에는 서울교통공사 구간은 서울역부터 청량리역이며, 나머지 구간은 한국철도공사 관할입니다.
