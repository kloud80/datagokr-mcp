summary_user: 전국 지하철역 목록과 역별 출구의 버스노선·주변시설, 역별 시간표를 조회하는 API로, 전체 1,108건 중 1,000행을 검증 수신했다. 환승 경로를 짜는 이용자나 서비스 개발자가 특정 역의 출구 정보와 시간표를 확인하는 질문에 쓴다. 키워드로 받은 지하철역ID(subwayStationId)를 출구·시간표 조회에 넘겨 잇고, 요일구분·상하행 코드는 다른 데이터에서 먼저 받아야 하며 전역 조인 키는 없다.
limits: 분석용이 아니라 서비스용 조회 도구이며, 검증에서 오퍼레이션 4개 중 1개만 호출에 성공하고 출구별 버스노선·주변시설·시간표 3개는 최소 파라미터로 응답이 없었다. 필수 파라미터(dailyTypeCode, subwayStationId, upDownTypeCode)는 다른 데이터의 코드라 먼저 받아 넘겨야 하며, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
