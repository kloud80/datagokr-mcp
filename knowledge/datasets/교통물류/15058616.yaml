summary_user: 경기도 내 도로를 도로종류(국도·지방도·고속도로·시군도 등)와 구분별로 묶어 노선 수, 총연장(km), 포장·미포장 구간 길이, 포장도율(%)을 담은 연간 집계 통계다. 도로정책 담당자나 분석가가 "경기도에서 미포장 구간이 가장 긴 도로종류는 무엇이고 포장도율은 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로종류명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: ‘도로 집계 현황’ 데이터는 경기도 내 도로종류별 도로 규모와 특성을 종합적으로 파악할 수 있도록 정리된 연간 통계자료입니다. 해당 데이터는 도로종류명(ROAD_KIND_NM)과 구분명(DIV_NM)을 기준으로, 각 도로유형의 노선 수(ROUTE_CNT), 총연장(km)(EXTS), 포장된 구간의 길이(PAVE_DEGR_LENG), 미포장 구간 길이(UNPAVE_DEGR_LENG), 포장도율(%)(PAVE_DEGR_RT)을 제공합니다.이 데이터는 국도·지방도·고속도로·시군도 등 다양한 도로의 분포 상태 및 관리 현황을 분석할 수 있어, 경기도의 도로정책 수립, 유지보수 우선순위 결정, 노후구간 개량 사업 계획 등에 활용됩니다. 또한 도로 인프라에 대한 지역 간 격차 분석 및 장기 교통계획 수립의 기반 자료로 활용될 수 있습니다.
