description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 국제 항행을 하는 상선을 소유한 대한민국 국민 또는 법인회사가 등록한 국제선박에 대한 정보를 관리할 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 국제선박의 선박명, 국적, IMO번호, 총톤수, 소유자 정보, 등록일자 등으로 구성되어 있습니다.  본 데이터는 선박 소유권 및 관리 현황 파악, 국제선박의 등록 추이 분석, 무역 및 해운 관련 업계의 시장 조사, 산업 통계 분석, 선박 관련 행정업무, 해운 정책 수립 자료 등으로 활용될 수 있습니다.
