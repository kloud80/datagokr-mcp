summary_user: PORT-MIS에 등록된 국제선박을 선박 한 척 단위로 담은 전국 범위 원장 파일로, 국제선박등록번호·IMO번호·선박명·소유 업체명·조선소·국제총톤수·재화중량톤수·선적항·관할항·진수일자·등록상태를 포함한다. 해운 분석가나 선사가 '어느 업체가 몇 톤급 국제선박을 보유하고 있고 언제 등록했는가'를 확인하거나 국제선박 등록 추이를 볼 때 쓴다. 실측 결과 전역 조인 키는 확인되지 않았으나, IMO번호(국제해사기구식별번호)와 선박번호가 있어 다른 선박원부·입출항 데이터와 선박 식별자 또는 선박명으로 맞춰 이어 쓸 수 있다.
limits: 전역 조인 키가 확인되지 않아 다른 데이터와는 이름·코드 매핑으로 연결해야 하며, 일치 여부를 따로 검증해야 한다. 비공간 전국 데이터라 좌표 기반 분석에는 쓰지 못하고, 해양 안전·검사(PSC)·선원 정보는 담지 않는다.
