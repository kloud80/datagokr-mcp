description_portal: '광주광역시 북구 마을버스 운영 현황입니다.광주광역시 북구 관내 마을버스의 노선별 정보(노선번호, 운행개시일, 기점, 종점, 정류소개소, 운행거리, 운행대수, 등록대수, 운행간격)를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 운행거리는 km(킬로미터) 단위로 소수점 첫째 자리까지 표기된 데이터를 제공합니다.※ 마을버스: 여객자동차 운수사업법 시행령 제3조와 여객자동차 운수사업법 시행규칙 제7조 및 제8조에 근거하여 고지대 마을, 외지 마을, 아파트단지, 산업단지, 학교, 종교단체의 소재지 중 하나에 해당하는 마을 등을 기점 또는 종점으로 하여 운행하는 버스'
