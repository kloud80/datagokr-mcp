summary_user: 광주 도시철도 2호선 1·2단계 구간의 정거장을 한 행에 한 역씩 담은 현황표로, 역번호·역간거리(m)·주변 입지·지상/지하 위치·승강장 형식·환승 여부를 담는다(파일 크기 약 1.5KB의 소규모 CSV). 도시교통 연구자나 역세권 분석가가 '2호선 각 역은 지하인지 지상인지, 역 사이 거리는 얼마이고 어느 역에서 1호선으로 갈아탈 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 역번호나 역 이름을 직접 매핑하거나 같은 기관(광주교통공사) 자료끼리만 이어 쓴다.
description_portal: '이 데이터는 광주광역시 도시철도 2호선(1·2단계) 정거장 현황을 체계적으로 정리한 자료입니다. 각 행은 하나의 정거장을 나타내며, 역번호, 역간거리(미터), 입지현황(해당 정거장이 위치한 지역의 주요 지명·시설), 정거장 위치(지상/지하 여부), 정거장 형식(예: 상대식), 그리고 환승정거장 여부(예: 1호선 환승 가능) 정보가 포함되어 있습니다.이 자료를 활용하면 정거장 간 물리적 거리와 배치, 환승 가능성, 주변 환경 특성을 종합적으로 파악할 수 있습니다. 특히, 도시철도 건설 계획 수립, 역세권 개발 전략, 교통 접근성 분석, 환승 체계 최적화 등 도시교통 인프라 연구와 정책 설계에 있어 기초 자료로서 중요한 가치를 가집니다.'
