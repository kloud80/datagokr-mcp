summary_user: 서울 강북구 안의 민영 노외주차장을 주차장 한 곳당 한 행으로 담은 목록 파일로, 주차장명·도로명주소·지번주소·주차면수가 들어 있다. 강북구를 방문하는 운전자나 주차 수요를 보는 분석가가 '어느 동네에 민간 주차장이 몇 면 규모로 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 주소나 주차장명을 매칭해 전국주차장정보표준데이터(주차장관리번호·좌표·요금) 같은 원장과 이어 쓴다.
