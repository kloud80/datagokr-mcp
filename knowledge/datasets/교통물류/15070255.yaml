summary_user: 도로종류(일반국도·고속국도 등)와 도로형태(터널안·교량위 등)별로 전국 교통사고의 사고건수와 사망·중상·경상·부상신고자 수를 연간 단위로 묶은 집계 통계로, 경찰이 조사·처리한 인적 피해 사고만 담는다. 교통안전 분석가나 도로 관리 담당자가 '고속국도의 터널 안이나 교량 위에서 사고가 얼마나 나고 사망자가 얼마나 되는가' 같은 도로 유형별 위험도 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로종류·도로형태 이름을 맞춰 연결하거나 같은 기관(한국도로교통공단)의 다른 사고 통계와 나란히 놓고 쓴다.
description_portal: '- 도로종류별(일반국도, 고속국도 등), 도로형태별(터널안, 교량위 등) 교통사고 통계  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨 - 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
