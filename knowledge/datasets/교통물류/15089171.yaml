summary_user: 울산시설공단이 보유한 차량을 한 대씩 담은 현황 파일로, 관리 부서, 차량번호, 차량명, 등록일자, 차종, 변속 종류, 유종, 기준일자를 담으며 CSV 약 4.7KB의 소규모 자료다. 공공기관 보유 차량의 연료 구성이나 노후도(등록일자 기준)를 살펴보려는 분석가·시민이 공단의 친환경차 전환 수준을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 차량번호·차종·유종 같은 이름 매칭이나 같은 기관(울산시설공단) 자료끼리만 이어 쓴다.
description_portal: 울산시설공단에서는 공단이 보유하고 있는 차량에 대한 현황 정보를 체계적으로 관리하고 있으며, 해당 정보는 여러 항목으로 구성되어 있습니다. 이 데이터에는 차량을 관리하는 부서명, 개별 차량을 식별할 수 있는 차량번호, 차량의 명칭(차량명), 공단에 등록된 등록 일자, 차량의 차종 및 변속기 종류(변속 종류), 사용되는 연료의 종류(유종), 그리고 정보의 기준이 되는 기준일자 등이 포함되어 있습니다. 이러한 정보를 통해 차량 운영의 투명성을 높이고, 공공정보로서의 가치를 가지며, 정책 수립 및 자산 관리에 활용될 수 있습니다.
