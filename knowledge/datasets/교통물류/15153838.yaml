description_portal: 이 데이터는 여수광양항만공사의 항만시설 사용 내역을 상세 기록한 운영 데이터셋으로, 선박이 특정 선석에서 접안·하역·이안하는 전 과정의 정보를 포함하고 있습니다. 주요 정보로는 선박명, 총톤수(GT), 재화중량톤수(DWT), 접안일시, 이안일시, 작업 시작 시각, 그리고 하역사, 화주사, 대리점명 등 항만운영에 필요한 모든 핵심 항목이 포함되어 있습니다.또한 각 기록에는 최초 등록일(FRST_REG_DT) 및 **최종 수정일(LAST_MDFCN_DT)**이 포함되어 있어, 항만시설 사용 기록의 변경 이력 추적도 가능합니다.전체적으로 항만운영 실적 분석, 선석 가동률 계산, 선박 처리 효율 평가 등에 활용할 수 있는 정형화된 데이터 구조를 가지고 있습니다.
