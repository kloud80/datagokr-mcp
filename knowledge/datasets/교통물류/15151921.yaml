summary_user: 한국도로공사가 제공하는 도로살얼음 관련 지사의 위치 정보를 지사 코드(BROF_CD)별 위경도·좌표와 등록·수정 일시로 담는 전국 단위 목록이다. 겨울철 도로살얼음 대응을 분석하는 사람이 "살얼음 대응 지사가 어디에 있고 특정 구간에서 가장 가까운 지사는 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지사 코드·이름 매핑이나 위경도 기반 공간 근접으로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하는 도로살얼음지사 위치 정보입니다.
