summary_user: 인천공항 출발·도착 여객기의 정기운항편 일정(항공사, 편명, 상대 공항, 일정 시작일·종료일, 요일별 운항 여부, 시즌)을 편명 단위로 담은 API 데이터로, 전체 2,138건이며 한 시즌(하계 또는 동계) 기준이다. 여행사나 분석가가 특정 노선의 편이 어느 요일에 시즌 동안 운항하는지 확인하는 질문에 쓴다. 전역 조인 키는 없어서 공항코드(airportcode)나 항공사명 같은 이름·코드 매핑, 또는 같은 기관의 다른 운항정보 코드로 연결한다.
description_portal: 인천국제공항에 도착하는 여객기 항공편의 운항 일정정보에 대한 데이터로 공항코드값을 검색 조건으로 하여 인천공항 출발/도착 여객기의 항공사 이름,공항 이름, 공항 코드, 정기운항편 일정 시작일/종료일, 편명, 요일 정보, 시즌 코드값등의 정보를 다국어(국문,영문,일문,중문)으로 나타내는 여객기 정기운항편 일정 정보 서비스입니다. 한 개의 시즌(하계 3월말~10월말/ 동계 10월말에서 익년 3월말)에 대한 데이터입니다. 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 1000000 트래픽을 제공합니다.
