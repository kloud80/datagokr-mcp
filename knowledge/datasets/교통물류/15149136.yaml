summary_user: 전국 항만의 시설별로 계선장 지정 여부와 상태, 담당기관, 등록·수정일시를 담은 건별 등록 원장 파일(csv, 약 11KB)이다. 선사·해운대리점이나 항만 분석가가 특정 항만청 관할에서 어떤 시설이 계선장으로 지정되어 현재 사용 가능한 상태인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 항만코드가 없어 다른 항만 시설·입출항 데이터와는 항구청명·시설명 같은 이름 매핑으로만 이어 붙인다.
description_portal: 이 데이터는 항만별 시설별 계선장 등록 및 관리 목적으로 수집된 데이터 입니다.본 데이터의 주요 내용은 항구청명, 시설명, 계선장여부, 계선장상태, 담당기관, 등록일시, 수정일시로 구성되어 있습니다.선박 계선장은 선박의 입출항법에 따라 항만관리청이 지정한 곳으로, 선박을 매어두는 장소를 의미하며, 선박이 정박하여 머무르는 곳에서 발생하는 사용료인 "계선료"가 부과됩니다. 계선장은 육지와 접한 시설(안벽, 물양장) 외에도, 심해에 수심 관계상 설치된 해중 계선장 등이 있으며, 선박의 크기나 항로 등에 따라 적합한 곳에 계류하게 됩니다.
