summary_user: 부산광역시 교통정보서비스센터가 교통정보수집장치(RSE)로 모은 구간별 교통정보를 가공해, 시점·종점과 각 지점 통과시간, 구간 속도(시속), 통과시간(초)을 가공일시별 건 단위로 담은 CSV 파일(약 19MB)이다. 교통 분석가나 시민이 '부산의 특정 RSE 구간은 어느 시간대에 속도가 떨어지고 통과에 얼마나 걸리는가'를 확인하거나, 여러 달 치를 쌓아 상습 정체 구간을 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시점·종점 지점 이름을 매핑하거나 같은 부산시 교통정보 데이터와 기관 코드 기준으로만 이어 쓴다.
