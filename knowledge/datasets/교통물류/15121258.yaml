summary_user: 울산항 입항 선박이 어느 부두·선석에 배정됐는지를 배정 건별로 담은 파일(CSV, 약 2.3MB)로, 항구명·부두명·입항연도·접안예정일·선석배정일·접안방향(좌현/우현)과 등록·수정일자를 포함한다. 항만 이용자나 물류 분석가가 '울산항에서 어느 부두·선석이 가장 많이 배정되고, 접안예정일 대비 배정은 언제 이뤄지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 입출항·항만시설 데이터와는 부두명·항구명 이름 매칭이나 같은 기관(울산항만공사) 데이터로만 연결하며, 항만코드 매핑표가 있으면 입출항·물류 데이터로 넓힐 수 있다.
description_portal: '- 울산항에 입항하는 선박이 주로 어느 선석에 배정되는지 제공하여 항만 이용자들의 편의를 향상하고, 항만 운영의 투명성을 제고하기 위해 선석배정 현황정보를 제공하고 있습니다.- 개방데이터는 항구명, 부두명, 선박 입항연도, 접안예정일, 출항예정일, 선석배정일, 데이터 등록일자 및 수정일자, 선박 접안방향에 대한 내용으로 구성되어 있습니다.- 해당 데이터를 활용하여, 선박별 선석배정현황 통계분석 및 주로 사용되는 선석현황 등 울산항 선석 운영현황을 파악할 수 있습니다.* 출처: 울산항만공사 선석운영지원시스템(울산항 선석배정현황정보)* 용어설명 - 선석: 선박이 항내에서 접안하는 장소 - 선석배정: 울산항 입항 선박이 신청한 선석에 대한 배정결과 - 접안방향: Port(좌현), Star(우현) - 시프팅: 선박이 접안 장소를 이동하는 것'
