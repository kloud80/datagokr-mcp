summary_user: 순천시 도시재생 활성화구역 안의 소상공인 업소를 한 곳씩 담은 건별 목록으로, 업소명·업종 분류·주소·위도경도와 함께 주차 가능 여부, 발렛파킹 가능 여부, 주차 유무료 여부를 담는다(CSV 약 1.2MB). 순천 도시재생구역 상권을 찾는 방문객이나 상권 분석가가 '이 가게에 차를 대고 갈 수 있는지, 주차가 무료인지'를 확인하는 데 쓴다. 전역 조인 키는 없어서 주소(도로명·지번)나 위도·경도를 기준으로 전국주차장정보표준데이터 같은 주차장 원장이나 다른 순천시 데이터와 이어 쓴다.
limits: 주차장관리번호 같은 공통 키가 없으므로 다른 데이터와는 주소·좌표·이름 매칭으로만 연결된다. 업소별 주차 가능 여부만 담고, 공영주차장 면수·요금이나 실시간 주차 가능 대수는 담지 않는다.
