description_portal: 부산교통공사에서 관리하는 4호선 역들의 호차별교통약자정보에 대한 철도운영기관명,선명,편성유형,호차번호,교통약자좌석수,임산부좌석수,출입문수 입니다.참고로 (도시ㆍ광역철도 차량) 전국단위 조사 시 기준적합 설치율 97.3%로 ‘21년에 비해 1.3%p 상승했다. 경부ㆍ동해ㆍ경원선 등 한국철도공사 운영 구간 및 대구 1호선, 광주 1호선, 대전 1호선, 우이신설선은 기준적합 설치율 100%로 나타났다. 의정부경전철, 신림선, 용인경전철은 목적지표시 등이 기준에 적합하지 않았다.   * (철도차량) 전국단위 조사시 기준적합 설치율 99.4%로 조사대상 중 가장 높았으며, 향후 노후 열차가 신규 열차로 대체됨에 따라 100%에 근접할 것으로 예상 됩니다.
