summary_user: 충주시 관내 가로등 분전함을 한 건씩 담은 파일로, 분전함 번호·이름·설치위치, 연결된 가로등 수(등주수량), 관리기관, 위도·경도를 시군구 범위의 개별 시설 단위로 제공한다. 시설 관리자나 분석가가 '특정 동네의 가로등은 어느 분전함에 몇 개 묶여 있고 그 분전함은 어디에 있나'처럼 점검 범위와 위치를 파악하는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어서 위도·경도 좌표로 지도 위에서 겹치거나 설치위치 주소·이름을 맞춰 연결한다.
description_portal: 충청북도 충주시 관내 도로 조명시설 운영을 위한 가로등 분전함 현황 정보를 제공하는 데이터입니다.분전함 ID, 설치위치, 분전함 이름, 연결된 등주 수량, 관리기관, 위도·경도 좌표, 기준일자 항목으로 구성되어 있으며, 도시 기반시설 관리 및 조명 유지보수 정책 수립에 활용됩니다.분전함은 특정 구간의 가로등 전원을 통합 관리하는 전기설비로, 위치 정보와 식별명이 함께 제공됩니다.등주 수량은 해당 분전함에 연결된 가로등 개수를 의미하며, 정기 점검 및 유지관리 대상 범위 파악에 활용됩니다.위도·경도 정보는 GIS 기반의 시설지도 구축, 야간 조도 분석, 도시재난 대응 체계 설계 등에 활용될 수 있습니다.관리기관은 시설 유지보수를 담당하는 부서 기준으로 제공되며, 예산 수립, 민원처리, 고장 대응 등의 업무 기반자료로 활용됩니다.※ 분전함 명칭은 행정구역 및 설치위치와 연계된 고유 식별체계이며, 현장 위치는 GPS 수신 상태에 따라 오차가 발생할 수 있으므로 활용 시 주의가 필요합니다.※ 자세한 유지관리 이력 및 전기안전 점검 내용은 충주시청 도로과 등 관련 부서를 통해 확인해야 합니다.
