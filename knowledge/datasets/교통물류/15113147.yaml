description_portal: 서울특별시 신호등 표준데이터는 서울 전역에 설치된 신호등의 위치와 특성을 체계적으로 관리하기 위해 구축된 공공데이터입니다. 각 신호등의 행정구역, 도로 종류, 설치 주소와 함께 좌표 정보가 포함되어 있어 GIS 기반 분석 및 교통안전 정책 수립에 활용할 수 있습니다. 또한 신호등 부착 방식, 신호등 종류, 광원 종류, 보행자 작동 신호기, 음향 신호기, 잔여 시간 표시 장치 여부 등 다양한 세부 속성이 기록되어 있어 교통약자 안전 강화, 교통시설 유지보수, 스마트 교통 인프라 연구에 중요한 자료로 활용됩니다.
