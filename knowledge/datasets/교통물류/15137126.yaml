description_portal: 해당 데이터는 충청북도 제천시의 불법주정차 상습 발생지 현장 정보를 정리한 데이터입니다. 순번, 주소, 민원발생누적건수, 20년 ~ 23년 민원발생건수, 경도, 위도, 데이터기준일자 등의 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 충청북도 제천시의 불법주정차 상습 발생지 현장 정보의 민원발생 건수 등을 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 12월 29일입니다. 담당부서는 제천시 안전건설국의 교통과이며 문의를 주시면 최신의 충청북도 제천시 불법주정차 상습 발생지 현장 정보 데이터를 열람하실 수 있게 도와드립니다.해당 데이터는 20년 ~ 23년 데이터의 데이터만 존재하고, 24년데이터는 26년에 추가될 예정입니다.
