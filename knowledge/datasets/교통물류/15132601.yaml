summary_user: 철도시설종합정보시스템(RAFIS)에서 쓰는 전국 철도역 기본 정보를 역 단위로 담은 파일(csv, 약 31KB)로, 역명·약어·영문·한문 명칭과 기준 역간 거리(KP), 고속선 노선거리, 역 신설·폐지일자를 담는다. 철도 분석가나 연구자가 특정 역이 언제 생기고 없어졌는지, 노선상 몇 km 지점에 있는지를 확인하거나 역명의 영문·한문 표기를 맞출 때 쓴다. 실측 컬럼에 전국 공통 역코드 같은 조인 키가 없어 다른 역·승하차 데이터와는 역명 문자열 매핑이나 국가철도공단의 다른 RAFIS 자료를 통해서만 이어 쓴다.
description_portal: '국가철도공단_RAFIS_역 정보는 철도시설종합정보시스템(RAFIS)에서 사용하는 전국 철도역의 기본 정보를 담고 있는 데이터로, 철도 역무와 시설 운영의 기반 정보를 제공합니다. 해당 데이터는 역명, 역약어명, 영문역명, 한문역명 등 명칭 정보뿐 아니라 기준 역간 거리(KP: Kilometer Post), 역의 신설일자와 폐지일자 등 연혁 정보도 포함되어 있습니다. 이를 통해 철도 운영 기관 및 관련 부서에서는 노선 설계, 유지보수 계획, 신설·폐지 검토, 시설 관리 등의 업무에 참고할 수 있으며, 데이터의 일관성과 표준화가 유지되어 시스템 간 연계 활용이 용이합니다. 본 자료는 철도 인프라 관련 정책 수립, 공공데이터 활용, 민간 연구 분석 등의 기초 정보로 폭넓게 활용됩니다.'
