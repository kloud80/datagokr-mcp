description_portal: '데이터 개요국토교통부_항공기 좌석수 주간랭킹은 국제항공운송협회(IATA)에서 매주 수집한 항공사별 좌석 공급 데이터를 기반으로 연간 좌석 수를 집계하여 세계 항공사 순위를 산정한 통계 자료입니다. 항공사의 공급 능력, 시장 점유율, 네트워크 확장 정도 등을 정량적으로 비교할 수 있어 글로벌 항공 산업 분석의 기초 지표로 활용됩니다.데이터 제공 항목년도: 통계 기준 연도순위: 항공사별 연간 좌석수 기준 순위항공사명: 공급 좌석수를 기준으로 랭킹에 포함된 항공사명좌석수(백만석): 해당 연도의 총 공급 좌석 수 (단위: 백만 석)출처 및 갱신 주기국제항공운송협회(IATA)에서 제공하는 주간 항공 운항 스케줄 데이터를 기반으로 연간 누적 좌석 수를 집계해당 수치는 항공사가 운항하는 노선, 운항 편수, 항공기 기종 등에 따라 산정됨좌석 수는 공급 기준(Available Seats)으로, 실제 탑승률이나 수익성과는 무관데이터 해석 시 유의사항좌석 수는 실제 탑승객 수가 아니라 공급 용량(좌석 제공 수)을 의미하므로 RPK(Revenue Passenger Kilometers) 등과 병행 분석 필요항공사 간 코드쉐어, 계열사 통합 등으로 인해 단순 비교 시 주의 필요국제선·국내선 구분 없이 통합된 전체 좌석 수 기준이며, 지역별 통계는 별도 확인 필요활용 안내전 세계 항공사들의 운항 공급 능력 비교항공사별 네트워크 전략 및 시장 점유율 분석항공산업 트렌드 파악 (예: 팬데믹 이후 회복 여부, LCC/국적사 성장률 등)항공사 투자 분석, 항공정책 수립, 노선개설 전략 기초 자료예시 데이터 (2024년 기준)연도순위항공사명좌석수 (백만)20251American Airlines279.620252Delta Air Lines246.920253Southwest Airlines229.220254United Airlines225.520255Ryanair213.1'
