summary_user: 서울 강남구에서 주정차가 허용된 도로 구간을 한 행씩 담은 건별 목록으로, 도로명과 시점·종점(도로명주소·인근 건물명), 편측·양측 구분, 허용 구간 길이, 평일·토요일·공휴일 허용시간, 명절 허용 여부를 담는다. 강남구에서 차를 잠시 세워야 하는 운전자나 배달·영업 사업자가 '이 도로에서 토요일 몇 시까지 세워도 되는가'를 확인하거나, 분석가가 주정차 허용 구간 분포를 살피는 데 쓴다. 전역 조인 키는 없어 시군구코드나 도로명 같은 이름으로 다른 주정차 금지구역·단속카메라 데이터와 맞춰 써야 한다.
description_portal: '서울특별시 강남구에서 주차가 허용된 구역 정보(상세위치, 허용구역도로길이, 평일주정차허용시간, 토요일주정차허용시간, 공휴일주정차허용시간, 명절허용여부)시점: 시점은 주차 허용 구간의 시작 위치를 의미하며, 종점: 종점은 주차 허용 구간의 종료 위치를 뜻합니다, 각각 도로명주소와 인근 건물명으로 작성되었습니다. 허용면은 편측, 양측으로 구분되어 있으며, 허용구역도로길이는 주차가 허용된 구간의 길이입니다. 주차허용구역 별로 허용시간이 상이할수 있으니 데이터 이용시 담당경찰서로 문의하여 주시기 바랍니다.'
