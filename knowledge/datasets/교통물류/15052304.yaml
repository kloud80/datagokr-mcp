summary_user: 1989년부터 연도별로 집계한 국내선 항공수송 실적을 연도 한 행 단위로 담은 전국 집계 파일로, 여객 수·여객킬로·화물 톤수·화물톤킬로·운항 편수·운항킬로를 담는다. 분석가나 정책 담당자가 '국내선 여객과 화물 수송량이 장기적으로 어떻게 늘거나 줄었나', '운항 편당 여객 수가 어떻게 변했나' 같은 질문에 쓴다. 전역 조인 키가 없어 연도(구분)를 기준으로 다른 연도별 통계와 맞대어 쓰는 방식으로만 이어 쓴다.
description_portal: '데이터 개요국토교통부_연도별 국내 항공수송실적 데이터는 1989년부터 매년 집계된 국내선 항공수송 실적 정보를 제공합니다. 항공 여객과 화물 수송량뿐만 아니라 여객·화물 운송거리, 운항 편수, 운항 거리 등 항공운송 전반에 걸친 핵심 지표가 포함되어 있어 국내 항공시장의 성장 추이, 운항 효율성, 수송 수요의 변화 등을 장기적으로 분석하는 데 유용한 통계 자료입니다.데이터 제공 항목구분(연도): 통계 기준 연도여객(명): 해당 연도 국내선 총 여객 수여객킬로(Km, RPK): 여객 수송 거리의 총합 (Revenue Passenger Kilometers)화물(톤): 국내선 총 화물 수송량화물톤킬로(Km, FTK): 화물 수송 거리의 총합 (Freight Ton Kilometers)운항(편): 국내선 총 운항 횟수운항킬로(Km): 운항 거리의 총합출처 및 갱신 주기국토교통부 항공통계 자료를 기반으로 하며, 항·항공사 보고 데이터를 집계하여 산출활용 안내국내 항공시장 수요 분석 및 중장기 성장률 평가여객 및 화물운송 효율성(단위당 거리 대비 수송량 등) 분석,노선 개설·감축 전략 수립, 항공사 운항 계획 수립의 기초자료,공항별 수요 예측, 지역 간 항공 연결성 비교정부 항공정책 및 투자계획 수립을 위한 기반 통계데이터 해석 시 유의사항‘여객킬로’, ‘화물톤킬로’는 단순 수송량이 아닌 거리 반영 수송량이므로 시장 규모 비교 시 주의예시 데이터연도여객(명)여객킬로(Km)화물(톤)화물톤킬로(Km)운항(편)운항킬로(Km)19898,951,7163,178,575,833154,41863,150,67078,63827,769,643199011,063,8204,010,705,187182,83171,541,05286,08730,934,763199112,253,0714,446,875,398199,54278,577,07090,66832,751,254'
