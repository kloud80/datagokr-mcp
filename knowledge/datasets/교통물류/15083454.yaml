description_portal: '행정동별 자동차 등록 현황을 승용, 승합, 화물, 특수 차량으로 구분하여 수록한 데이터.지역 내 차량 보급 및 교통 수요 현황을 파악하고, 교통 정책 수립, 도로 인프라 관리, 환경 영향 분석 및 행정 자원 배분 등에 활용 가능하다.활용 목적 및 특징– 행정동별 차량 등록 현황 및 유형별 분포 분석– 승용·승합·화물·특수차량 구분에 따른 교통 특성 파악– 교통 수요 관리 및 주차·도로 인프라 정책 자료 활용– 환경 영향 평가 및 교통 행정 근거 제공주요 항목 설명● 행정동: 차량이 등록된 행정동 명칭● 승용: 행정동별 등록된 승용차 대수● 승합: 행정동별 등록된 승합차 대수● 화물: 행정동별 등록된 화물차 대수● 특수: 행정동별 등록된 특수차 대수'
