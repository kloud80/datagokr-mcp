summary_user: 광양시에 등록된 중고자동차 매매업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 2.8KB)로, 상호명·소재지·전화번호·데이터기준일을 담는다. 중고차를 사려는 시민이 '광양에서 정식 등록된 매매업체가 어디이고 연락처는 무엇인가'를 확인하거나, 행정기관이 매매업소 위치를 지도로 정리할 때 쓴다. 전역 조인 키나 코드표가 없어서 다른 데이터와는 소재지 주소나 상호명을 직접 맞춰 연결해야 한다.
description_portal: 본 자료는 전라남도 광양시에 등록된 중고자동차 매매업체 현황을 체계적으로 정리한 공공 데이터로, 상호명, 소재지, 전화번호, 데이터 기준일 등의 항목으로 구성되어 있습니다.자료는 자동차 매매와 관련된 공신력 있는 등록 업체 정보를 국민에게 투명하게 공개하여, 중고차 거래 시 소비자 보호와 피해 예방, 정식 등록된 매매업체 선택에 도움을 주기 위한 목적으로 제공됩니다.또한 중고차 거래를 위한 실질적인 상담·위치확인·사전 예약 등에 활용될 수 있으며, 행정기관에서는 등록업체 관리, 매매업소 지도작성, 자동차 관련 민원 대응 등에 본 데이터를 활용합니다.
