summary_user: 대구 도시철도 2호선 역에 설치된 전동휠체어 급속 충전설비를 역별로 담은 소규모 파일(csv 약 2KB)로, 운영기관명·선명·역명·지상지하 구분·역층·상세위치·충전설비 수·전화번호가 들어 있다. 전동휠체어 이용자나 교통약자 이동지원 분석가가 '대구 2호선 어느 역 몇 층 어디에서 휠체어를 충전할 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·선명을 이름으로 맞추거나 같은 기관(국가철도공단)의 다른 노선별 충전설비 파일과 묶어 쓴다.
