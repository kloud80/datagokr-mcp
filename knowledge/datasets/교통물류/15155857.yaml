summary_user: 전손처리된 자동차의 수리검사를 접수 건별로 기록한 원천 데이터로, 검사소코드·접수일자·접수일련번호·접수횟수·특이사항코드를 담으며 범위는 전국입니다. 보험 전손 차량이 수리 후 다시 도로에 나오는 규모나 검사소별·시기별 수리검사 접수 추이, 특이사항 유형 분포를 보려는 분석가가 쓴다. 실측 컬럼에 차량번호 같은 전역 조인 키가 없어 다른 데이터와는 검사소코드나 특이사항코드를 같은 기관(한국교통안전공단)의 코드표와 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 전손처리 자동차에 대한 수리검사 내역을 기록하고 있습니다. 접수일자와 접수일련번호를 통해 각 검사 건을 추적할 수 있으며, 특이사항코드와 특이사항설명을 통해 특정 자동차의 수리 및 상태 변화에 대한 정보를 제공합니다. 이 데이터는 폐차 재사용 및 전손처리 차량의 재활용에 대한 활용률 분석에 유용하게 활용될 수 있습니다. 특이사항 항목은 차량 수리 후 발생한 문제점이나 상태를 상세히 기록하고 있어, 이를 통해 재사용 가능성을 평가하고, 자원 효율성과 환경적 영향을 개선하는 데 기여할 수 있습니다.
