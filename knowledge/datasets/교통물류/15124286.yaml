description_portal: '이 데이터는 경상북도 김천시에서 2023년도에 말소 처리된 1톤 트럭(화물자동차)에 대한 폐차 정보를 수록한 통계자료입니다.각 차량의 최초 등록일, 말소일(폐차일), 최종 주행거리 항목을 제공하며,이는 노후 차량의 운행 실태 분석, 미세먼지 저감 대책, 친환경차 전환사업 설계 등에 있어 핵심 기초자료로 활용될 수 있습니다.자료는 2023년도 전체 폐차 트럭 중 1톤 화물차량만 선별 수록되어 있으며,자동차 등록·말소 시스템과 연계된 실제 등록정보 기반으로 수집됩니다.유의사항 : 해당 데이터는 1톤 화물트럭만 포함되며, 승합차, 승용차, 특수차량은 제외됩니다.'
