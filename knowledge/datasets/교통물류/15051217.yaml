summary_user: 인천교통공사가 운영하는 인천1호선·인천2호선 전동차 안에서 상행·하행, 혼잡·비혼잡 시간대별로 측정한 실내공기질 결과(초미세먼지·이산화탄소·온도·습도, 공기정화설비 가동 여부)를 차량·측정구간 단위로 담은 2025년 6월 30일 기준 파일입니다(약 1.3KB 규모의 작은 CSV). 승객이나 환경·보건 분석가가 '출퇴근 혼잡시간대 인천 지하철 객실의 초미세먼지와 이산화탄소 농도가 비혼잡 시간대보다 얼마나 높은가'를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 도시철도 공기질 자료와는 호선명·측정구간 이름을 맞춰 붙여야 합니다.
description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선, 인천2호선의 2025년 6월 30일 기준 전동차 실내공기질 측정결과 자료입니다. 해당 데이터는 호선, 차량번호, 측정구간(기점-종점), 온도(℃), 습도(%), 시간대(혼잡/비혼잡), 공기정화설비가동여부,측정방식,초미세먼지(㎍/㎥),이산화탄소(ppm) 항목으로 구성되어있습니다.인천1호선은 계양역에서 송도달빛축제공원역까지 운행하는 전동차 내에서 측정하였고 인천2호선은 검단오류역에서 운연역에서 운행하는 전동차 내에서 측정하였습니다.상행과 하행, 혼잡시간대와 비혼잡시간대에 각각 측정하였습니다.
