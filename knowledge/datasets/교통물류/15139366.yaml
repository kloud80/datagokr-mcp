description_portal: 서울교통공사의 연혁정보입니다. 해당데이터는 1974년 1호선 개통일부터 2017년 서울메트로와 서울도시철도공사와의 통합 출범을 비롯해 2024년 8월 별내선 개통까지 서울교통공사의 연혁을 포함하고 있습니다.서울교통공사의 연혁은 공사의 설립 과정과 조직 변화, 지하철 노선 개통 등 주요 이력을 연번, 연대, 연혁내용 형식으로 정리한 자료로서 서울 도시철도 시스템의 발전과정을 한눈에 파악할 수 있도록 구성되어 있으며, 정책 수립, 연구, 시민 정보 제공 등 다양한 분야에서 활용이 가능합니다.  2026. 2. 10. 기준입니다.
