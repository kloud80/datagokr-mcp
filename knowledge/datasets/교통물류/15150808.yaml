description_portal: 경기도 남양주시 관내 옹벽현황입니다. 옹벽이란 흙, 암석, 사면 등이 붕괴하거나 흘러내리는 것을 막기 위해 토압을 견디도록 설계·시공한 구조물로 주로 흙을 지지·구속해 경사를 유지하거나 고저차를 형성·안정화하는 데 사용됩니다. 주로, 도로 절토·성토부, 택지 개발지의 단차, 하천 제방 인접부, 철도·터널 출입구 주변 등에 설치되며, 설계 시 지반조건, 배수계획, 지진·동결, 배면 성토재료, 안전율 등을 고려해야 합니다. 해당 데이터는 남양주시의 읍면동별 옹벽, 연장, 폭원, 높이, 재질등의 정보를 제공하며, 해당 데이터는 옹벽 설치나 현황 확인 시 유용하게 활용될 수 있습니다.
