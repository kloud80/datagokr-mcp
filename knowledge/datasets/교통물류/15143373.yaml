description_portal: '(이 데이터의 기초 데이터는 2006년 구축된 것임에 따라 현재 실제 상황과 다를 수 있음에 따라 참고용으로 활용하시기 바랍니다.) 이 파일 데이터는 가로등에 대한 정보입니다. 위치는 경상북도 김천시의 도로에 설치된 가로등에 대한 정보입니다. 세부적인 내용은 1. 도로구간 번호 :  가로등이 설치된 정확한 도로 구간을 식별할 수 있는 고유번호2. 설치일자:해당 가로등이 최초 설치된 날짜로, 유지보수 주기나 노후시설 교체 시점 판단에 활용3. 등기구 모형 : 사용된 가로등의 등기구 디자인이나 모델명으로, 외관 및 성능 식별4. 등주 높이: 가로등 기둥의 높이로, 조명 범위와 밝기 산정에 필수적인 요소5. 등주 형식,6. 등주 재질:철재, 알루미늄, 콘크리트 등 기둥 재료로, 내구성 및 유지비용 산정에 활용7. 암길이:등기구가 도로 위로 뻗어 있는 길이로, 조명 분포와 연계8.등기구 수량:각 기둥에 설치된 조명 수량9. 광원 종류: LED, 나트륨램프, 메탈할라이드 등 사용된 조명 광원의 유형을 의미데이터기준일에 대한 세부 정보를 제공합니다.  다만 본 데이터는 현장 실사와 행정 기록을 기반으로 수집되어 조사시기에 따라 일부 데이터는 정보가 없거나 갱신이 되지 않은 경우가 있을 수 있습니다.'
