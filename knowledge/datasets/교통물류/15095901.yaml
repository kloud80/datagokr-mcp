summary_user: 택시에 장착된 IoT 기기(센서)가 수집한 인천 도로 주변 유동인구를 센서명·시각·위경도·지오해시와 시·군구·동, 성별·연령대(10세 단위)로 기록한 건별 관측 파일로, 압축 파일 하나(약 45MB)로 제공된다. 상권 분석가나 도시계획 담당자가 '특정 시간대에 어느 동네 도로 주변에 어떤 성별·연령대 유동인구가 많은가'를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시·군구·동 이름 매핑이나 위경도·지오해시 기반 공간 결합으로 이어 쓴다.
description_portal: '인천광역시가 제공하는 도로 주변 유동인구 공공데이터는 교통·도시계획·상권 분석 등에 활용할 수 있도록 택시에 장착된 IOT 디바이스를 통해 수집된 도로 주변 유동인구 정보를 담고 있습니다.주요 항목은 센서명으로 데이터 수집 장치를 구분하고, 시간을 통해 특정 시점의 유동인구 현황을 기록합니다. 또한 위도·경도와 지오해시를 통해 위치 정보를 정밀하게 제공하며, 시·군구·법정동 단위로 행정구역별 분류가 가능합니다.(항목 : 센서명 / 시간 / 위도 / 경도 / 지오해시 / 시 / 군구 / 법정동 / 성별 / 연령대)(성별 : M / F)(연령대 : 10 ~ 100 사이의 숫자 ( 10 단위 ))'
