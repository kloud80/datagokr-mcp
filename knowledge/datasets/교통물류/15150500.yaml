description_portal: 국내에서 출시되어 판매되고 있는 자동차는 제조사가 자기인증을 통해 인증하여 판매됨- 매년 임의로 자기인증적합시험 대상 차량을 선정하여 구매하고 이를 세부 항목별로 테스트하여 안전기준에 적합한지 여부를 검사함- 자동차를 제작ㆍ조립 또는 수입(이하 “제작등”이라 한다)하려는 자는 국토교통부령으로 정하는 바에 따라 그 자동차의 형식이 자동차안전기준에 적합함을 스스로 인증하여야 한다.- 자동차제작ㆍ조립자는 국토교통부령으로 정하는 생산대수 이하로 제작ㆍ조립되는 자동차에 대하여 제1항에 따른 자동차안전기준에도 불구하고 국토교통부령으로 정하는 바에 따라 유사한 수준의 안전도 확인방법으로 자동차자기인증을 할 수 있다. 이 경우 제3항에 따른 기술검토 및 안전검사를 받아 자동차자기인증을 하여야 한다.- 첨부된 자료를 연도별로 선정된 자기인증대상 차량 리스트임
