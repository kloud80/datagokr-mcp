description_portal: 한국교통안전공단에서 운영하는 기계식주차장 정보관리시스템에서 관리하는 정보입니다. 주차장법에 따라 20대 이상 차량이 들어갈 수 있는 기계식주차장치는 기계식주차장 관리인 교육을 수료한 관리인을 두어야 하며, 교육을 받은 관리인은 3년에 한번 보수교육을 이수하여야 합니다. 해당 데이터는 관리인 교육 수료자들 중 온라인으로 교육을 수료한 관리인들에 대한 정보입니다. 교육 과정은 신규교육과 보수교육 모두에 대한 정보를 제공하고 있습니다. 개인정보는 제외하고 제공합니다.
