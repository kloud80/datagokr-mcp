summary_user: 전국 자치단체가 관리하는 과속방지턱을 개별 설치 지점 단위로 담은 원천 데이터로, API 전체 141,140건에 높이·폭·연장·형태·재료·설치연도·규격 여부·관리기관 정보가 들어 있다. 운전자나 도로 안전 분석가가 특정 동네 도로에 과속방지턱이 어디에 얼마나 있고 규격에 맞는지 확인하는 데 쓴다. 지번주소·도로명주소와 WGS84 좌표(위도)를 키로 삼아 단속카메라·보호구역·제한속도 같은 같은 부문의 위치 데이터와 이어 쓴다.
description_portal: '과속방지턱정보 데이터는 도로법에 따른 도로 부속물로서 차량의 속도를 제어하기 위해 설치하는 과속 방지턱에 대한 정보 등에 대한 데이터로 관리 자치단체명, 설치장소, 과속방지턱 높이, 규격준수여부, 도로 유형, 규격 여부, 보차 분리 및 연속형 여부, 관리기관명·연락처, 데이터 기준일자 등 관리 정보 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 과속방지턱 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 과속방지턱정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 국토교통부 도로관리과 / 044-201-3890 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
services:
  - op: /info
    name: 과속방지턱정보 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/speed_bump_info/info
    method: GET
    security:
      scheme: apiKey
