    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[SGG_NM::LIKE]
        required: false
        desc: 시군구명 을(를) 포함하는 값
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[DAT_CRTR_YMD::GTE]
        required: false
        desc: 데이터기준일자 이상의 값(YYYYMMDD)
      - name: cond[DAT_CRTR_YMD::LT]
        required: false
        desc: 데이터기준일자 미만의 값(YYYYMMDD)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
