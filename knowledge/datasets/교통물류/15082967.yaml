summary_user: 서울시가 도시계획시설로 결정한 도로 외 교통시설(주차장, 자동차정류장, 철도, 궤도, 공항 등)을 도형 단위로 담은 공간정보로, 도형 분류코드·결정고시 관리코드·집행상태·면적·길이를 함께 담는다. 도시계획 분석가나 부동산·개발 사업자가 특정 지역에 어떤 교통시설이 계획·결정되어 있고 집행되었는지를 확인해 접근성 변화를 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 시군구코드(SGG_CD)나 결정고시 관리코드 같은 서울시 내부 코드로만 다른 서울시 도시계획 데이터와 이어 쓴다.
description_portal: '해당 데이터는 서울시 도시계획시설(교통시설_도로외) 공간정보 데이터입니다.데이터는 객체id, 현황도형 관리번호, 도형 대분류코드, 도형 중분류코드, 도형 소분류코드, 도형 속성코드, 도형 조서관리 코드, 결정고시관리코드, 라벨명, 시군구코드, 도면번호, 집행상태코드 심볼, 현황도형 생성일시, 면적(도형), 길이(도형)으로 구성되어 있습니다.국토의계획및이용에관한법률에 의한 도로 외의 교통시설(주차장, 자동차정류장, 차량 검사 및 면허시설, 철도, 궤도, 항만, 공항)[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.문의 : 도시계획과 (02-2133-8339)※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
