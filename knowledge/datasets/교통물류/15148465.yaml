summary_user: 인천광역시 강화군 관내에 등록된 물류창고업체를 업체별 한 행으로 담은 파일이며, 업체명·사업자등록번호·마스킹된 대표자명·도로명/지번 주소·연락처·데이터기준일자를 포함한다(파일 크기 366바이트로 소규모). 기업 입지를 검토하는 사업자나 지역 물류 인프라를 살피는 분석가가 '강화군에 어떤 물류창고업체가 어디에 있는가'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 사업자 정보·물류창고업 등록 데이터와 연결하고, 주소로 위치 기반 자료와 이어 쓴다.
description_portal: '인천광역시 강화군 관내 물류창고업 현황 데이터입니다.본 데이터에는 연번, 업체명, 사업자등록번호, 대표자명, 주소(도로명주소, 지번주소), 연락처, 데이터기준일자 정보를 포함되어 있으며,대표자명의 경우 개인정보 보호를 위해 마스킹 처리하였습니다.해당 데이터는 물류 효율화 연구, 기업 입지 분석, 지역경제 활성화 방안 마련 등 다양한 행정 및 연구 목적의 기초자료로 활용이 가능합니다.데이터와 관련된 추가 문의사항은 데이터 제공부서로 연락주시기 바랍니다.○ 제공부서 : 도로교통과 교통행정팀'
