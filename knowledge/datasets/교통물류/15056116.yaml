summary_user: 경상남도 내 등록된 자동차등록번호판 발급대행 업체를 업체 1곳당 1행으로 담은 파일로, 관할 시군명·업체명·주소·전화번호로 구성되며 포털 설명상 2019년 기준 총 25건입니다. 차량을 새로 등록하거나 번호판을 바꾸려는 도민이 '우리 시군에서 번호판을 발급해 주는 업체가 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명이나 주소 문자열을 매칭해서만 이어 쓸 수 있다.
description_portal: (데이터 수집목적 및 과정) 경상남도 자동차등록번호판 발급대행 업체 정보 데이터는 2019년 기준 경상남도 내 등록되어 있는 자동차등록번호판 발급 대해 업체에 대한 정보입니다. 관할 시군과 업체이름, 주소, 전화번호 등의 정보를 파악할 수 있습니다. 시군으로도 분류하였습니다.(데이터 구성 및 세부항목) 데이터는 시군명, 업체명, 주소, 전화번호 구성됩니다. 총 25건입니다.* 주소는 도로명주소의 상세주소로 동(棟)번호, 층(層)수, 호(號)수의 순서로 표기합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 하지 않습니다.
