summary_user: 고속도로 휴게소 가운데 LPG 충전소가 설치된 휴게소를 휴게소 한 곳당 한 건으로 담으며, 노선명·휴게소명·위치·주소·정유사(브랜드) 등이 들어 있고 범위는 전국 고속도로다. LPG 차량 운전자가 "이번 고속도로 경로에서 LPG를 넣을 수 있는 휴게소가 어디인가"를 미리 확인하거나, 분석가가 노선별 LPG 충전 인프라 분포를 살필 때 쓴다. 휴게소코드(serviceAreaCode)와 노선코드(routeCode)가 있어 같은 한국도로공사 휴게소·노선 데이터와는 이 코드로 잇되, 전역 조인 키는 없어 다른 기관 데이터와는 휴게소명·노선명 매칭으로만 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 휴게소 중 액화석유가스(LPG) 충전소가 설치된 휴게소의 현황 정보이다.제공 항목은 노선명, 휴게소명, 위치, 전화번호, 운영여부, 브랜드명, 유종 정보 등으로 구성되어 있다.이 데이터는 LPG 차량 운전자가 고속도로 주행 중 이용 가능한 충전소 위치를 사전에 확인하고 경로를 효율적으로 계획하는 데 도움을 준다.OpenAPI 형태로 제공되며, XML과 JSON 형식을 모두 지원하여 다양한 정보 시스템과 연계 활용이 가능하다.실시간 접근성을 바탕으로 운전자에게 충전 편의성을 높이고 에너지 절약 및 운영 효율화를 도모할 수 있다.에너지 수급 정책, 친환경 차량 운행 유도, 유가 정보 서비스 제공 등 다양한 목적에 활용될 수 있다.민간 기업, 연구기관, 일반 국민 등 다양한 수요자가 쉽게 접근하여 사용할 수 있도록 개방되어 있다.
