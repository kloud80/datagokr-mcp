summary_user: 전국 고속도로에 설치된 VMS(도로전광표지) 장비를 장비 한 대 단위로 담은 목록으로, 장비 ID와 노선명·노선번호, 관리 본부(센터) 코드·이름을 포함한다. 교통정보 서비스 개발자나 분석가가 "어느 노선에 어느 본부 관할 VMS가 설치돼 있는가"를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 고속도로 데이터와는 노선번호·노선명, 본부 코드·이름 같은 이름·코드 매핑이나 같은 기관(한국도로공사) 코드로만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로에 설치된 VMS(Variable Message Sign) 장비의 본부별 목록 정보를 제공하는 OpenAPI 서비스이다.전국 고속도로에 설치된 VMS의 위치, 관리 본부, 장비 유형, 노선명, 방향 등 주요 정보가 포함되며 XML 및 JSON 형식으로 제공된다.본 데이터는 교통 정보 제공, 돌발 상황 알림, 공사 및 기상 안내 등 실시간 정보 표출 기능을 수행하는 장비 현황 파악에 활용된다.VMS의 유지관리 체계 구축, 스마트 교통 시스템 연계, 교통 운영 효율성 향상 등에도 기여할 수 있다.데이터는 정기적으로 갱신되며, 공공 및 민간의 교통 정보 서비스 개발과 정책 수립에 필요한 기초 자료로 사용된다.또한 위치 기반 경고 시스템, 통합 교통 관제, 도로 이용자 안내 서비스 등 다양한 분야에서 실질적으로 활용 가능하다.
