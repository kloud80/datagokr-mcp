description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 선박이 해상에서 사고로 인해 유류 오염이 발생했을 때 손해배상을 목적으로 체결한 손해보장계약 정보를 등록한 내역을 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 해양수산부 해운항만물류정보 시스템을 기반으로 유류오염보장계약의 체결 현황, 계약의 등록일, 계약 대상 선박, 손해보장의 기간 등으로 구성되어 있습니다.  본 데이터는 항만 운영자나 해양보험업계에서 유류오염 사고 시 손해보장 이행 현황 파악, 손해배상 책임 검증, 관련 법규 준수 여부 확인 등의 업무에 활용할 수 있으며, 유관 기관에서는 정책 개선 자료로도 사용할 수 있습니다.
