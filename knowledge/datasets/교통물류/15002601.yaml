summary_user: 대구 도시철도 1~3호선 역사별로 통신사(SK텔레콤·KT·LG유플러스) 와이파이 설치 수량을 대합실과 승강장으로 나눠 담은 역 단위 현황 파일이다(CSV 약 2KB). 이용객이나 분석가가 '어느 역의 승강장에서 특정 통신사 와이파이가 잡히는가', '역별 무선 인프라 격차가 어디서 큰가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 역사·시설 데이터와는 호선·역사명을 이름으로 맞춰 연결해야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 1~3호선 각 역사별 통신사 와이파이 설치 현황 정보를 제공합니다. 데이터에는 호선, 역사명, 통신사별(SK텔레콤, KT, LG유플러스) 와이파이 설치 위치 및 수량 등의 주요 항목이 포함되어 있으며, 역사 내 무선 통신 인프라 운영 현황을 파악하기 위한 기초자료로 활용할 수 있습니다. 해당 데이터는 역사별 와이파이 설치 현황 비교·분석, 통신 인프라 관리 및 서비스 개선 계획 수립 등에 활용할 수 있으며, 도시철도 이용객의 통신 편의성 향상과 이용 환경 개선에 기여할 수 있습니다. 본 데이터는 연 1회 갱신되며, 역사 내 와이파이 설비 운영 현황을 최신 정보로 반영합니다.'
