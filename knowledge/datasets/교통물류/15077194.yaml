summary_user: 인천광역시에 등록된 전기자동차 대수를 시군구별·용도별(사업용·비사업용)로 나누고 승용·승합·화물·특수 차종별과 합계로 집계한 통계 파일(csv)입니다. 충전 인프라 담당자나 분석가가 어느 구에 사업용 또는 비사업용 전기차가 몰려 있어 급속·완속 충전기를 어디에 먼저 늘려야 하는지 판단하는 데 쓴다. 전역 조인 키가 없어 충전소 현황 등 다른 데이터와는 시군구 이름을 직접 맞춰 연결해야 한다.
description_portal: '이 데이터는 인천광역시 내에 등록된 전기자동차의 현황을 시군구별, 용도별, 차종별로 상세하게 집계한 통계 자료입니다. 인천광역시의 친환경 자동차 보급 정책 성과를 측정하고, 전기차 충전 인프라 확충 및 대기질 개선 정책 수립을 위한 핵심 기초 자료로 활용됩니다.데이터 분석 및 활용 가치보급 현황 파악: 연수구(비사업용 승용 약 1만 대)나 계양구(사업용 승용 약 1.7만 대)처럼 특정 지역 및 용도에 집중된 전기차 수요를 분석할 수 있습니다.맞춤형 인프라 구축: 사업용 전기차 등록이 많은 지역에는 급속 충전 시설을, 비사업용 승용차가 많은 주거 단지에는 완속 충전기를 우선 배치하는 등 효율적인 행정 처리가 가능해집니다.'
