summary_user: 강릉시 지능형교통체계(ITS)에서 수집한 주차장 실시간 주차면수·사용대수, 교차로·회전교차로별 교통량·통행시간·속도, 돌발상황·스마트 횡단보도·신호 정보를 개별 지점(주소·좌표) 단위로 조회하는 API이다. 강릉 시민이나 관광객이 '지금 이 주차장에 빈자리가 있는가', 분석가가 '어느 교차로가 어느 시간대에 막히는가'를 확인하는 데 쓰며, 정보일시(colDate) 기준으로 이력을 쌓으면 상습 정체 분석 자료가 된다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주차장명·교차로명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: '강원특별자치도 강릉시의 지능형교통체계(ITS) 기반 실시간 교통 정보를 조회하는 서비스입니다.본 서비스는 총 10개의 기능(오퍼레이션)을 제공하며, 각 기능별 상세 제공 정보는 다음과 같습니다.주차 정보 조회: 강릉시 관내 주차장의 기본 정보(주차장명, 주소, 운영시간) 및 실시간 정보(전체 주차면수, 실시간 주차 사용대수) 제공스마트 교차로 정보: 교차로별 교통량, 용량, 포화도, 서비스수준, 지체시간 및 보행자 수, 사고 건수 등의 통계 정보 조회돌발상황 검지: 도로 상의 사고 등 돌발상황 발생 시 수집된 검지 정보 조회스마트 횡단보도: 횡단보도 내 대기자 정보, 횡단 보행자 수, 무단 횡단자 수 조회회전교차로 정보: 회전교차로의 교통량, 통행시간, 속도 정보 및 차량 간 사고 예방을 위한 실시간 정보 조회안전 운행 지원: 객체 분석을 통한 교차로 우회전 안전 정보 조회신호 정보: 신호 교차로의 위치 정보 및 신호 현시 정보 조회'
