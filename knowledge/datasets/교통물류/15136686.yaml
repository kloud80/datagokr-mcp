summary_user: 국내에서 발생한 자동차 화재사고 연도별 집계(구분·항목별 건수와 피해금액)와 교통사고 건별 이력(발생 일시, 주야·요일, 사망·중상·경상·부상신고자 수, 발생 시도, 사고유형, 법규위반, 도로형태)을 한 CSV 파일(약 5MB)에 담는 전국 범위 데이터다. 교통안전 분석가나 지자체 담당자가 '어느 시도에서 어떤 사고유형·법규위반이 야간에 사상자를 많이 내는가'처럼 사고예방 대책의 우선순위를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 발생지 시도 코드나 연도를 이름·코드로 맞춰 도로교통공단(TAAS) 사고다발지역 자료나 지자체 사고 통계와 이어 쓴다.
description_portal: '- 자동차안전기준 종합정보시스템은 자동차 관련 법령 들에 관련하여 대국민 정보 제공을 목적으로 운영중으로, 국내외 최신 자동차안전기준 법령과 다양한 참고자료 및 통계분석 결과를 관리하고 있습니다.- 개방데이터는 국가별로 내부상황과 법령에 따라 구성하는 국가별 차종분류 정보, 자동차와 관련한 다양한 경우의 교통사고 이력 통계분석 결과 등이 있습니다.- 국내 자동차사고 통계는 국내에서 발생한 화재사고 및 교통사고에 대하여 발생원인, 발생위치, 사고상황에 대한 상세분류 정보를 제공하여 사고예방 대책 수립을 위한 데이터로 활용되고 있습니다.'
