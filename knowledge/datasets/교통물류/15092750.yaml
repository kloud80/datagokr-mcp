summary_user: 부산광역시 시내버스의 정류소·노선 기본정보와 정류소별 실시간 도착 예정, 노선 위의 실시간 버스 위치를 정류소 단위(정류소ID·ARS 번호·정류장명·좌표)로 조회하는 API이다. 시민이나 앱 개발자가 "지금 이 정류장에 내가 탈 버스가 몇 분 뒤에 오는가"를 확인하거나, 분석가가 노선별 경유 정류소와 운행 현황을 파악하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 정류소명·ARS 번호 같은 이름·코드 매칭이나 좌표(gpsx, gpsy)로 위치를 맞춰 이어 써야 한다.
limits: 부산광역시 범위만 담으며, 다른 시도 버스정보나 전국 단위 비교에는 쓸 수 없다. 포털 활용신청(자동승인) 후 serviceKey가 필요하고 개발계정은 하루 10,000회로 호출이 제한된다.
