summary_user: 서울교통공사가 관할하는 역 289개를 역 단위로 한 줄씩 담은 파일 데이터로, 역번호·호선·역명·역 전화번호와 도로명주소·지번주소를 싣는다. 역 연락처나 위치 주소가 필요한 시민이나 분석가가 특정 역의 전화번호와 소재지를 확인하는 데 쓴다. 도로명주소와 지번주소 필드가 주소(address) 조인 키라서 주소 기준의 다른 데이터와 이어 쓰고, 역 좌표·출입구·환승 정보와 합쳐 역세권 판정의 기준 목록으로 삼는다.
limits: 좌표 필드가 없어 주소를 좌표로 바꾸는 별도 작업 없이는 거리 계산이나 지도 표시를 바로 할 수 없다. 포털 설명에 따르면 2020년 이전 데이터는 5년 주기로 제공되며 현 자료는 2026년 2월 기준이다.
