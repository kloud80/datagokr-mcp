summary_user: 행정안전 통계연보 '지방행정/지역발전' 분야에 실린 부여사유별 도로명주소 통계로, 행정구역 명칭·지명·자연마을이름·역사적 인물·문화재 등 도로명을 붙인 사유별로 전국 단위 집계값을 담는다(건별 도로명 원천 아님, 비공간). 정책 분석가나 지명·주소 연구자가 '전국 도로명 가운데 역사적 인물이나 문화재에서 따온 이름이 얼마나 되는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부여사유 이름 매핑이나 같은 기관(행정안전부) 통계연보의 다른 항목과 나란히 놓는 방식으로만 연결한다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '도로명주소', '부여사유별 도로명주소'에 관한 통계입니다. 행정구역 명칭, 지명·자연마을이름, 역사적인물·기념, 문화재·유적 등을 기준으로 부여사유별 도로명을 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
