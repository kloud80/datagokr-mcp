summary_user: 2010년식 대형 CNG 시내버스 한 대의 하루 운행을 시간 단위 행으로 기록한 차량 센서 원천 데이터로, 차량속도·엔진속도·엔진 실제/목표 토크·가스분사량·산소센서값·흡기압력·냉각수온도 등 엔진 상태와 GPS 위도·경도를 담는다(CSV 약 10.7MB). 운수업체나 분석가가 급가속·공회전·불필요한 정차 같은 운전 습관이 연료(가스) 사용에 어떤 영향을 주는지, 또는 최신 차량 센서 데이터와 비교해 구형 버스의 운행 특성이 어떻게 다른지 살피는 데 쓴다. 노선·정류장 ID 같은 전역 조인 키가 없어 다른 데이터와 직접 결합되지 않으며, 위도·경도 좌표나 시간으로 정류장 위치 데이터 등과 공간·시간 대조하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 2010년식 대형 CNG(압축천연가스) 시내버스의 하루 운행 기록입니다. 이 시기의 데이터는 차량 내 센서 데이터 표준화 초기 단계의 특징을 가지며, 차량 원격 관리에 필수적인 핵심 기초 정보를 중심으로 구성되어 있습니다. 2015년 이후 모델에서 제공되는 세분된 엔진 제어 값이나 부품별 상세 진단 정보보다는, 차량의 거시적인 운행 패턴과 에너지 효율성을 분석하는 데 중점을 둡니다.데이터는 주로 GPS를 통한 위치, 속도, 운행 거리 등 위치 기반 정보와 엔진 회전수(RPM), 엔진 부하율, 누적 연료 소모량 등 기본적인 운행 상태 정보로 이루어져 있습니다. 이를 통해 버스 노선별 평균 속도, 정류장 외 불필요한 정차 시간, 공회전 시간 등을 산출하고, 이를 연비와 연관 지어 분석함으로써 기본적인 운행 효율성 평가가 가능합니다.운수업체 입장에서는 이 데이터를 통해 운전자들의 운전 습관(급가속, 과속 등)을 비교 분석하고, 비경제적인 운전 요소를 파악하여 연비 향상을 위한 교육 자료로 활용할 수 있습니다. 또한, 최신 차량 데이터와의 비교 분석을 통해 지난 10여 년간 차량 기술 발전과 운행 환경 변화가 버스 운영에 미친 영향을 연구하는 데 귀중한 기초 자료 및 시계열 데이터로서의 가치를 지닙니다.
