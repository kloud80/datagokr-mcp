summary_user: 경기도 평택시에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·영업상태·법인구분·도로명/지번주소와 위도·경도를 포함하며 범위는 평택시 한 곳이다(CSV 약 7.8KB). 수출입 화물을 맡길 평택 지역 국제물류주선업체가 어디에 있고 현재 영업 중인지 찾는 무역 사업자나, 평택항 주변 물류업체 분포를 지도로 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓰며, 화물 운송·주선 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: '경기도 평택시에 등록된 국제물류주선업체의 상호(업체명), 영업상태, 법인구분, 도로명주소 등의 정보를 제공합니다. 자료는 국제 물류 및 수출입 업무를 수행하는 기업 현황을 파악하기 위한 기초 자료로 활용됩니다. 이용자는 평택시 내 관련 업체의 분포, 규모, 업종 특성 등을 확인할 수 있으며, 물류 서비스 이용자 및 무역 기업의 참고자료로 활용 가능합니다. 데이터는 구조화된 형식으로 제공되어 검색과 분석이 용이하며, 물류산업 정책 수립, 기업 지원, 연구 등의 다양한 분야에서 활용될 수 있습니다※ 문의 : 평택시청 대중교통과(031-8024-4862)'
