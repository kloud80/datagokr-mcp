summary_user: 인천광역시 관내 주요 도로의 교통량을 표준링크(linkID)·방면·일자 단위로 집계해 0시부터 23시까지 시간대별 교통량으로 담은 통계 데이터다. 교통 분석가나 상권·입지 분석가가 '특정 도로 구간의 출퇴근 시간대 교통량이 얼마나 되는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 표준링크 ID나 도로명·시점·종점 노드명 같은 이름 매핑 또는 같은 기관 코드로만 다른 데이터와 연결한다.
limits: 실측상 전역 조인 키가 없어 다른 기관 데이터와 직접 결합하기 어렵고 이름·코드 매핑이 필요하다. 행정단위 코드나 좌표가 없는 비공간 데이터라 지도 분석에는 별도의 위치 정보가 필요하다. 호출에는 포털 활용신청(자동승인) 후 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
