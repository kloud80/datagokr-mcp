    endpoint: https://apis.data.go.kr/6280000/ICRoadVolStat/NodeLink_Trfc_DD
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: YMD
        required: true
        example: '20230403'
        desc: 연월일
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
