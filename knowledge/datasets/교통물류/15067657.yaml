summary_user: 국제철도연맹(UIC) 규격을 규격번호별로 한 건씩 담은 목록 파일로, 규격명·분류명·규격구분·원문사이트 주소·작성일시·조회수를 담으며 내려받은 CSV는 약 168KB 규모다. 철도 차량·운영 실무자나 연구자가 '특정 UIC 규격번호의 규격명과 분류(철도차량, 화물수송, 정보기술 등)는 무엇이고 원문은 어디서 보나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 규격번호나 분류코드를 기준으로 이름·코드를 직접 맞춰 붙이는 방식으로만 연결한다.
description_portal: '철도 UIC 규격 정보를 제공합니다.국제철도연맹(Union International Chemine de fer)의 철도차량 및 운전방식등 규격 정보를 제공합니다.국제철도연멩(UIC)규격번호에 따른 규격명/분류명 정보를 제공합니다.UIC규격분류는 구동/규격및규칙/기술적사양/승객및수화물수송/운영/재무,회계,원가,통계/절차및지침/정보기술,기타/철도차량/화물수송으로 나누어져 있습니다.(제공정보: 순번,작성일시,규격명,분류명,원문사이트,조회수,분류코드,규격번호,규격구분)'
