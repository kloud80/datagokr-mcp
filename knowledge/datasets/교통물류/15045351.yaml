summary_user: 광주교통공사가 운영하는 광주 도시철도 정거장별 연면적 현황을 역 단위로 정리한 작은 CSV 파일(약 1KB)로, 역명·위치·연면적·구조를 담는다. 시설 담당자나 분석가가 "어느 역이 가장 넓고, 역 규모에 맞춰 청소·경비 인력이나 유지관리 예산을 어떻게 나눌까"를 따질 때 쓴다. 공통 조인 키가 없어 승하차 인원이나 운영비 같은 다른 역 단위 데이터와는 역명을 맞춰 붙여 써야 한다.
description_portal: '이 데이터는 광주광역시 도시철도공사 정거장의 연면적 현황을 정리한 자료로, 각 역사의 규모와 구조적 특성을 보여줍니다. 주요 항목에는 역명, 위치(행정동 기준), 연면적(㎡), 구조(예: 지상·지하 층수, 부속시설 포함 여부)가 포함됩니다. 연면적은 역사, 승강장, 주차장 등 부속시설을 모두 포함한 수치로, 역의 규모와 기능적 범위를 파악할 수 있습니다.이 자료를 활용하면 각 역의 건축 규모를 비교 분석해 유지관리 예산 산정, 청소·경비 인력 배치 계획, 시설 개선 및 확장 필요성 평가 등을 수행할 수 있습니다. 또한 구조 정보는 승객 동선 설계, 비상 대피 계획 수립, 시설물 리모델링·보강 계획 수립에 중요한 참고 자료가 됩니다. 특히 대규모 역과 소규모 역의 운영 비용·이용객 수 데이터를 결합하면 역 운영 효율성 분석과 역세권 개발 전략 수립에도 활용할 수 있습니다.'
