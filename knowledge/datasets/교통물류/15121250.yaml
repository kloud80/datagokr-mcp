summary_user: 한국도로공사가 부산광역시 시도긴급구조표준시스템에 연계 제공하는 고속도로 특별상황(사고·안개·작업·지정체 등) 발생 기록을 건별로 담은 CSV 파일(약 20MB)로, 노선명·상하행·상황유형·발생일자·시점/종점과 지체 구간·지체길이를 기록한다. 분석가나 긴급구조 담당자가 '어느 고속도로 노선·구간에서 사고나 안개로 인한 지체가 자주 발생하는가'를 확인하거나, 이력을 쌓아 상습 정체 구간을 분석하는 데 쓴다. 전역 조인 키가 없어 다른 교통 데이터와는 노선명과 시점·종점 명칭을 매핑해 연결해야 한다.
