description_portal: 자동차의 운행정보를 실시간으로 저장하여 시시각각 변화하는 운행상황을 자동적으로 기록할 수 있는 운행기록장치를 통해 자동차의 순간속도, 분당 엔진회전수(RPM), 브레이크 신호, GPS, 방위각, 가속도 등의 운행기록 자료를 분석하여 운전자의 과속, 급감속 등의 운전습관 파악을 위한 과학적이고 실증적인 운전자 안전관리를 위한 분석데이터입니다. 업종(화물,버스,택시 등)별 , 시간별, 위험운전행동 통계데이터를 확인할 수 있으며, 해당 위험운전을 산출하기위한 안전운전지수를 제공합니다. 수요자 중심의 운행기록데이터를 제공함으로써 수요기관의 사업용 차량 사고 예방 분석에 활용 할 수 있으며 데이터 기반 교통안전정책수립에 신뢰성을 확보할 수 있습니다.
