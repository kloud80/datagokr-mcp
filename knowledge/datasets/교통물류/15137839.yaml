summary_user: 전라남도 여수시 안의 표준링크별로 날짜·요일마다 0시부터 23시까지 시간대별 평균 통행속도를 담은 집계 통계이며, 도로명·방면·시점·종점·링크길이·도로유형이 함께 붙는다. 교통 분석가나 시 교통 담당자가 '여수 시내 특정 도로 구간이 출퇴근 시간대에 얼마나 느려지는가'를 확인하는 데 쓴다. 명세상 표준노드링크 ID(linkID)가 있어 국토부 ITS 센터가 배포하는 표준노드링크 파일과 링크 단위로 맞춰 지도에 올리는 데 쓰지만, 실측에서는 전역 조인 키로 확인되지 않아 도로명·구간명 대조나 같은 기관 데이터로 잇는 것이 확실하다.
description_portal: 전라남도 여수시 내 표준링크별 교통 통계 데이터를 제공합니다.표준링크별 교통량, 평균속도 통계 데이터를 조회할 수 있습니다.
