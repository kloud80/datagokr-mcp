summary_user: 인천 부평구에 등록된 자동차를 차종(승용·승합·화물·특수)별로 나누고 관용·자가용·영업용 용도별 등록 대수를 담은 집계 파일로, 실측 파일 크기가 132바이트에 불과한 작은 표입니다. 교통정책 담당자나 분석가가 부평구 차량 중 자가용과 영업용 비중이 어떤지, 공영주차장 수요를 어떻게 잡을지 판단할 때 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름(부평구)이나 차종 이름을 맞춰 다른 구의 자동차 등록 현황과 나란히 비교하는 식으로만 잇는다.
description_portal: '자동차 등록 현황은 부평구 내에 등록된 차량의 종류 및 용도별 등록 대수를 구분한 데이터차종은 승용차, 승합차, 화물자동차, 특수자동차로 나뉘며, 차량 용도는 자가용, 영업용, 관용으로 분류차량 등록 규모, 용도별 분포, 지역 내 교통수요 추이 등을 파악하는 데 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 자동차 종류별 등록현황 분석 및 교통정책 기초자료– 자가용·영업용 차량의 용도 비율 추이 분석– 공영주차장 수요예측 및 도로 인프라 계획 수립– 대기오염 및 교통량 관련 환경 분석 자료로 연계 활용주요 항목 설명● 순번: 데이터 항목의 일련번호● 구분: 승용차, 승합차, 화물자동차, 특수자동차 등 차량 종류● 관용: 공공기관 소속 차량 등록 대수● 자가용: 개인 소유 차량 등록 대수● 영업용: 택시, 버스, 화물 등 사업용 차량 등록 대수'
