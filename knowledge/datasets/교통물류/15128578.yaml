summary_user: 부산 동래구 관내에 등록된 화물자동차 이사업체를 업체 한 곳당 한 행으로 담은 목록으로, 상호·주소·전화번호·업종을 수록한 작은 CSV 파일(약 1.5KB)이다. 동래구 주민이 이사를 앞두고 관내 등록 이사업체를 찾아 연락하거나, 분석가가 구 단위 이사업체 분포를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 상호·주소 문자열로 맞춰야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: '본 자료는 부산광역시 동래구 관내에서 등록된 화물자동차 기반 이사업체의 현황을 수록한 데이터셋으로,데이터는 CSV 형식으로 제공되며, 다음과 같은 항목으로 구성되어 있습니다:연번: 항목 순서를 나타내는 고유 번호상호: 사업체의 공식 상호명주소: 해당 업체의 도로명 주소 또는 지번 주소전화번호: 업체에 직접 연락 가능한 대표 전화번호업종이 데이터를 통해 동래구 내 이사업체의 위치 정보, 연락처, 업종 유형 등 주요 정보를 한눈에 파악할 수 있습니다.본 자료는 정기적으로 점검 및 갱신되어 최신 정보를 유지하고 있으며,자세한 사항이나 추가 정보가 필요한 경우에는 부산광역시 동래구청 교통과(051-550-4546 )로 문의해 주시기 바랍니다.'
