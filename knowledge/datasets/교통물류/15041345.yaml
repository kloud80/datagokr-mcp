summary_user: 대구교통공사가 운영하는 도시철도역 수유실을 한 곳당 한 행으로 담은 파일로, 노선·역명·지상/지하 구분·층·출구번호·상세위치와 유아용침대·소파·전자렌지·간이세면대 개수, 이용가능시간, 전화번호를 담는다(csv 약 1.3KB의 작은 목록). 아기와 함께 대구 도시철도를 타는 보호자가 "이 역에 수유실이 있는지, 몇 번 출구 쪽 몇 층에 있고 몇 시까지 쓰는지"를 확인하거나, 교통약자 편의시설 현황을 정리하는 분석가가 역별 비치 비품을 비교하는 데 쓴다. 공통 역코드 같은 전역 조인 키는 없어 다른 역·시설 데이터와는 역명·선명 문자열을 맞춰 연결해야 한다.
limits: 역코드 등 조인 키가 없어 다른 철도 데이터와 이을 때 역명 표기 차이를 직접 맞춰야 한다. 포털 설명에 나오는 모유수유/착유실과 가족수유실 구분은 필드 목록에 별도 컬럼으로 없으므로 이용 주체 구분은 현장 표지판으로 확인해야 한다.
