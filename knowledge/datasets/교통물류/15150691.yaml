summary_user: 전국 도로를 콘존(구간) 단위로 나눠 구간마다 길이, 차로 수, 제한속도, 시작·종료 노드, 노선번호, 도로등급, 버스전용차로 여부 같은 속성을 담은 기준정보다. 교통 분석가나 서비스 개발자가 특정 노선 구간의 제한속도와 차로 수를 확인하거나, 구간별 소통·사고 데이터를 해석할 때 구간 속성을 붙이는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 콘존 ID(CZ_ID)나 노드 ID, 노선번호 같은 같은 기관 계열 코드, 또는 구간·노드 이름으로만 다른 교통 데이터와 맞춰 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
