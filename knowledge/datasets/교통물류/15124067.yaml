summary_user: 경기도 버스운송관리시스템(BMS)에서 쓰는 공통 코드를 코드유형·코드번호·코드명·사용구분·등록/갱신일자·계정권한코드 단위로 담은 코드표로, 시내·시외·공항버스 구분, 면허유형, 운영체계, 회계서류 구분 등을 포함한다. 경기도 버스 관련 다른 BMS 자료를 받아 본 분석가나 개발자가 "이 코드값이 무슨 뜻인가", "현재 사용 중인 코드인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 같은 BMS 계열 데이터의 코드 필드와 코드유형·코드번호(cd_type, cd_no)를 맞춰 이름을 풀어 쓰는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS) 내에서 사용되는 공통 코드 정보를 제공하는 자료로, 시스템 내 다양한 기능에서 활용되는 코드의 유형, 번호, 명칭, 사용여부 및 등록·갱신 정보를 포함하고 있습니다. 항목에는 '코드유형', '코드번호', '코드명', '사용구분', '등록일자', '갱신일자', '계정권한코드' 등이 있으며, 시내버스·시외버스·공항버스 등의 구분부터 면허유형, 운영체계, 회계서류 구분 등 교통 행정 및 시스템 운영에 필요한 다양한 코드 분류 체계를 포괄합니다. 이 데이터는 코드 표준화, 시스템 간 연계작업, 데이터 처리 자동화, 사용자 권한 구분, 행정자료 정합성 유지 등에 활용됩니다.
