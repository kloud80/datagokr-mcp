legal_basis_portal: '1. 공공데이터의 제공 및 이용 활성화에 관한 법률- 공공데이터 이용정책 : 공공기관은 공공데이터 포털을 통해 누구든지 공공데이터를 편리하게 이용할 수 있도록 보장하며, 이용권의 보편적 확대를 위하여 노력하고 있습니다. (공공데이터법 제1조, 제3조)- 공공데이터 이용 허락범위 : 공공데이터 관리지침 제8조- 제8조(저작물이 포함된 공공데이터의 관리)2. 경량항공기 안전성인증 법정근거-항공안전법 : 제108조(경량항공기 안전성인증 등)-항공안전법 시행규칙 : 제284조(경량항공기의 시험비행등 허가 및 안전성인증 등)3. 초경량비행장치 안전성인증 법정근거-항공안전법 : 제124조(초경량비행장치 안전성인증)-항공안전법 시행규칙 : 제305조(초경량비행장치 안전성인증 대상 등)'
