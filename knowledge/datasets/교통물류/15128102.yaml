summary_user: 항공안전기술원이 수행한 경량항공기·초경량비행장치 안전성인증 건수를 연도별(포털 설명상 2021~2025년)로 조종형비행기·경량헬리콥터·자이로플레인·동력패러글라이더·무인멀티콥터 등 기체 유형별 열에 담은 전국 단위 집계표(CSV 1개 파일)이다. 드론·레저항공 사업자나 정책 분석가가 "최근 몇 년 사이 무인멀티콥터 같은 무인비행장치의 안전성인증이 유인 경량항공기보다 얼마나 늘었나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 드론 신고·조종자격 등 다른 드론 통계와는 연도와 기체 유형 이름을 맞춰 이어 쓴다.
description_portal: 이 통계는 항공안전기술원이 수행한 경량항공기 및 초경량비행장치에 대한 안전성인증 현황을 2021년부터 2025년까지 5년간 기체 유형별로 집계한 자료입니다. 인증 대상은 국토교통부령으로 정한 최대이륙중량, 좌석 수 등 기준에 해당하는 항공기 외 비행기, 헬리콥터, 자이로플레인, 동력비행장치, 무인비행장치 등을 포함하며, 안전관리 및 정책 수립을 위한 기초자료로 활용됩니다.
