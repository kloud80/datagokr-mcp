summary_user: 전북특별자치도 안의 도로폭 6미터 이하 생활도로를 길 단위로 나눠, 실측 주차면 수, 불법 주정차 현황, 차량 등록 대수를 묶어 산출한 주정차 수요-공급 불균형 지수(PRI)를 담은 공간정보이며, 약 19MB zip 파일로 활용신청 없이 받는다. 시군 교통 담당자나 분석가가 '우리 동네에서 주차난이 가장 심한 골목은 어디이고 공영주차장이나 단속은 어디부터 늘려야 하나'를 판단하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 도로명·행정구역 같은 이름 매핑이나 같은 기관 코드로만 잇고, 주정차 단속카메라나 공영주차장 데이터와는 도로명 기준으로 맞춰 본다.
description_portal: 이 데이터는 전북특별자치도 내 도로폭 6미터 이하의 좁은 생활도로를 대상으로 주차 공간의 수요와 공급 불균형 상태를 과학적으로 분석한 길 단위 공간정보입니다. 2021년 공공데이터 뉴딜 사업을 통해 구축된 이 자료는, 로드뷰와 현장 실측으로 조사한 실제 주차면 수 및 불법 주정차량 현황 데이터와 차량 등록 대수, 도로명, 도로폭과 같은 공공데이터를 융합하여 만들어졌습니다. 이러한 다차원적인 데이터를 바탕으로 '주정차 수요-공급 불균형 지수(PRI)'를 도출하여, 각 도로별 주차난의 심각도를 정량적으로 보여줍니다. 이는 특정 지역의 주차 환경 개선을 위한 공영주차장 확충, 불법주정차 단속 강화 등 맞춤형 교통 정책을 수립하는 데 핵심적인 근거 자료로 활용될 수 있습니다.
