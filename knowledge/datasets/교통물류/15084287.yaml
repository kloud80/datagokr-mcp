summary_user: 청주시 관내 도로에서 도로점용허가를 받아 굴착을 수반한 공사를 허가 건별로 정리한 대장으로, 허가일자·굴착위치·굴착기간 등을 담은 xlsx 파일(약 1MB)이다. 시민이나 공사·시설 사업자가 '우리 동네 도로가 언제, 어디서 굴착되었거나 예정되어 있는가'를 확인하거나, 분석가가 도로 공사 이벤트를 지역 변화의 단서로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·도로명 같은 이름 매핑이나 청주시라는 같은 기관 단위로만 연결한다.
