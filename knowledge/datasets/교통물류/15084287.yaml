description_portal: 청주시 관내 도로에서 도로점용허가를 받아 도로굴착을 수반하는 각종 점용 현황을 체계적으로 정리한 목록을 제공함으로써 굴착 공사 시행 시 발생할 수 있는 안전사고 및 시민 불편을 최소화하고자 하며, 공사 전 사전 검토와 협의를 통해 효율적인 공정관리를 지원하고 관련 기관 정보 공유를 원활히 하여 중복 굴착을 방지하고 도로 이용자의 불편을 줄이는 것을 목적으로 합니다. 해당 데이터에는 허가일자, 굴착위치, 굴착 기간 등 중요한 정보가 포함되어 있으며, 추가적인 참고자료로 활용이 가능합니다.
