description_portal: 도로의 안전 확보와 차량 속도 저감을 위해 설치된 과속방지턱의 위치 및 관리 정보를 담고 있는 자료입니다. 본 데이터는 과속방지턱이 설치된 지점을 나타내는 도로명주소와 지번주소, 해당 시설물을 설치·관리하는 기관명, 기관의 연락처(전화번호) 정보로 구성되어 있습니다.본 자료는 지역별 교통안전시설 설치현황을 파악하고, 정책 수립, 민원 대응 및 시설 유지보수에 활용될 수 있습니다.데이터 건수가 많아 일부 뷰어(엑셀, 메모장 등)에서는 모든 정보가 나타나지 않을 수 있으므로, 전용 분석 소프트웨어(CSV 뷰어, Python, R 등)의 사용을 권장합니다.항목별 상세 설명은 데이터 제공기관의 설명서 또는 공공데이터포털 메타데이터를 참고해 주시기 바랍니다.
