summary_user: 경기도 내 지자체·공공기관이 보유하거나 임차해 운영하는 관용차량 가운데 전기자동차로 등록된 차량을 차량 한 대 단위로 담은 현황 자료로, 행정기관명·차명·등록번호·소유/임차 구분·전기차 여부·데이터 기준일자가 들어 있다. 정책 분석가나 도의원·시민이 "우리 시군이나 기관은 관용차를 얼마나 전기차로 바꿨고, 소유와 임차 중 어느 방식이 많은가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 행정기관명(inst_nm)이나 차명을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 지자체 및 공공기관이 보유하거나 운영 중인 관용차량 중 전기자동차로 등록된 차량의 현황을 정리한 자료입니다. 차량의 차명, 등록번호, 소유 또는 임차 여부, 행정기관명 등과 함께 전기차 여부 및 데이터 기준일자 등의 정보가 포함되어 있으며, 친환경 차량 도입 현황과 운영 유형을 파악할 수 있습니다. 이 자료는 공공부문에서의 전기자동차 보급 수준을 확인하고, 탄소중립 정책 이행 및 친환경 차량 전환 실적 분석에 활용될 수 있습니다. 또한 공공 행정차량 운영 효율성, 전기차 활용률 및 배치 현황 등에 대한 기초 자료로서, 향후 친환경 교통수단 확대를 위한 정책 수립과 실적 평가에 유용합니다.
