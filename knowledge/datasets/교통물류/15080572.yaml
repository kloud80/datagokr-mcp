summary_user: 부산광역시 도시공간정보시스템에서 관리하는 도로 터널을 한 행에 한 터널씩 담은 건별 시설물 대장으로, 터널명·관리기관·소재지·행정동과 연장·차도폭원·유효고·통과제한높이, 환기·조명·배수시설, 굴착형식·라이닝·방수 같은 구조 제원을 담는다(CSV 약 18KB). 화물차 운전자나 물류 사업자가 부산 시내 어느 터널의 통과제한높이가 몇 m인지 확인하거나, 분석가가 준공 시기와 구조 형식별로 터널 노후도를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 터널명·소재지·행정동 같은 이름 매칭이나 도로구간번호로 붙여야 하며, 전국 터널 제공표준 데이터와 함께 쓸 때도 이름 기준으로 맞춘다.
description_portal: 부산광역시 및 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있음.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 시설물인 터널에 대한 정보임.도로시설물인 터널에 대한 명칭, 위치, 연장, 폭, 통과유효높이, 유료구분, 소재지, 관리기관 등의 정보를 확인 할 수 있음.(예) 관리기관, 터널명, 소유구분, 소유자명, 준공일, 유료구분, 유료개시일, 유료종료일, 위치_시점, 위치_종점, 환기설비, 터널차도폭원  등
