summary_user: 부산광역시에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 명부로, 업체명·대표자명·전화번호·등록일·도로명주소를 제공한다. 화주나 무역업체가 "이 포워딩 업체가 부산시에 국제물류주선업으로 등록된 곳인가"를 확인하거나, 분석가가 부산 지역 국제물류주선업체의 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명주소를 맞춰 붙여야 하며, 화물운송·주선 허가 여부는 전국화물자동차운송사업자표준데이터와 대조해 확인한다.
description_portal: 부산광역시 국제물류주선업 등록업체 현황에 대한 데이터로 연번, 업체명, 대표자명, 전화번호, 도로명주소, 데이터기준일자 항목을 제공합니다. 제43조(국제물류주선업의 등록) ① 국제물류주선업을 경영하려는 자는 국토교통부령으로 정하는 바에 따라 시ㆍ도지사에게 등록하여야 한다. <개정 2008. 2. 29., 2013. 3. 23., 2017. 1. 17.>② 제1항에 따라 국제물류주선업을 등록한 자(이하 “국제물류주선업자”라 한다)가 등록한 사항 중 국토교통부령으로 정하는 중요한 사항을 변경하려는 경우에는 국토교통부령으로 정하는 바에 따라 변경등록을 하여야 한다. <개정 2008. 2. 29., 2013. 3. 23.>③ 제1항에 따라 등록을 하려는 자는 3억원 이상의 자본금(법인이 아닌 경우에는 6억원 이상의 자산평가액을 말한다)을 보유하고 그 밖에 대통령령으로 정하는 기준을 충족하여야 한다. <개정 2012. 6. 1.>④ 국제물류주선업자는 제3항에 따른 등록기준에 관한 사항을 3년이 경과할 때마다 국토교통부령으로 정하는 바에 따라 신고하여야 한다.
