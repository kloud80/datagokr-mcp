summary_user: 수원시가 전기차 충전소 최적입지를 분석해 도출한 후보지를 지점별로 담은 분석 결과 데이터로, 후보 시설마다 검토 우선순위·시설유형·다중이용시설명·관리주체·지번/도로명 주소·위경도를 담는다. 수원시 공무원이나 충전사업자가 '수원시에서 다음 충전소를 어느 다중이용시설에 먼저 설치를 검토해야 하나'를 판단할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·시설명 매칭이나 위경도 기반 공간 결합으로 이어 써야 하며, 기존 충전소 현황 데이터와 좌표로 겹쳐 보는 방식이 현실적이다.
description_portal: 수원시 전기차충전소 최적 입지 도출 분석 결과 데이터로 최적입지의 우선순위, 시설유형, 시설명, 위치정보 등을 포함하는 데이터입니다. 최근 전기차 보급이 빠르게 확산됨에 따라 효율적인 충전 인프라 구축의 중요성이 점점 커지고 있습니다. 이에 따라 전기차 이용자들의 접근성과 이용 편의성을 높이기 위해 전기차 충전소의 최적입지를 과학적으로 분석하고, 공공데이터 OPEN API를 활용한 기반 데이터 확보를 제공하는 정보입니다. 전기차 충전소는 단순히 설치하는 것이 아니라, 수요가 많은 지역, 접근성이 높은 지점, 전력 공급이 원활한 장소에 배치되어야 합니다.
