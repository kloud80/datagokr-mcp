description_portal: 드론을 활용하여 경영을 하려는 자는 항공사업법 제48조(초경량비행장치사용사업의 등록)에 따라 등록을 해야하고, 한국교통안전공단은 같은법 제75조(권한의 위임·위탁)에 따라 초경량비행장치사용사업체의 등록 및 안전관리 업무를 국토교통부로 부터 위탁받아 운영하고 있다.초경량비행장치사용사업 등록 시 촬영,측량,관측,점검,조종교육,농업지원,기타의 사업 범위를 선택할 수 있으며 이 중 기타 사업범위 중 군집드론 공연으로 등록된 사용사업체가 드론 쇼 사업을 수행할 수 있다.해당 자료는 군집드론 사업체로 등록된 사업체 중 실제 공연 이력이 존재하거나 공연 진행이 확정된 사업체의 정보들이 포함되어 있다.
