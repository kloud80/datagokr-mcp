description_portal: 본 데이터는 전북특별자치도의 내항을 운항하는 여객선의 상세 현황을 담고 있는 자료입니다. 군산-개야도, 격포-위도 등 각 항로별로 운항하는 선박의 이름, 소속 선사, 톤수, 승객 및 선원 정원, 속력 등 선박의 제원 정보를 포함하고 있습니다. 또한, 운항 시간과 거리, 운항 구역 등 실제 운항에 필요한 정보까지 상세히 제공하여, 지역 내 도서(섬)를 연결하는 해상 교통망의 전체적인 그림을 파악할 수 있게 합니다. 이 자료는 섬 주민과 관광객의 교통 편의를 위한 기초 정보를 제공할 뿐만 아니라, 연안 해운 정책 및 항로 관리, 보조 항로 운영 등을 위한 중요한 행정 데이터로 활용됩니다.
