summary_user: 광주 광산구에서 이루어진 불법주정차 단속을 행정동(단속동)·단속장소·단속일시·관리부서 단위로 담은 건별 기록 파일로, 포털 설명상 2022~2023년 자료이며 CSV 약 36MB 규모입니다. 주민이나 분석가가 '광산구에서 불법주정차 단속이 어느 동, 어느 장소, 어느 시간대에 몰리는가'를 따져 주차 대책이나 단속 인력 배치를 검토하는 데 씁니다. 전역 조인 키는 없으므로, 행정동 이름(단속동)을 행정동 코드표와 이름으로 맞춰 인구·주차장 같은 읍면동 단위 통계와 이어 씁니다.
description_portal: 광주광역시 광산구에서는 2022년부터 2023년까지 행정동별로 발생한 불법주정차 단속 건수에 대한 데이터를 체계적으로 제공하고 있습니다. 이 자료는 연번을 포함하여 단속이 이루어진 행정동(단속동), 구체적인 단속 장소, 단속 일시, 해당 단속을 담당한 관리 부서, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 광산구 내 각 행정동별 불법주정차 현황을 파악하고, 특정 지역이나 시간대에 집중된 단속 추이를 분석할 수 있으며, 원활한 차량 흐름을 위한 정책 수립에 참고 자료로  사용할 수 있습니다.
