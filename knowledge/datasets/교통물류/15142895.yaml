summary_user: 광주광역시 남구 관내 공영주차장을 주차장 한 곳당 한 행으로 담은 파일(csv, 약 5.8KB)로, 주차장명·도로명/지번 주소·주차구획수·요일별 운영시각·위경도·장애인전용구역 보유 여부를 담는다. 남구 주민이나 방문객이 '목적지 근처에 평일 저녁이나 공휴일에도 여는 공영주차장이 있는가'를 확인하거나, 분석가가 남구 공영주차 공급 면수를 지도에 올려 볼 때 쓴다. 전국 공통으로 맞물리는 조인 키는 확인되지 않아, 주차장관리번호나 주차장명·주소로 전국주차장정보표준데이터의 남구 행과 맞춰 보거나 위경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 광주광역시 남구 관내에서 운영 중인 공영주차장 현황 및 정보(주차장명, 소재지, 주차면수 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 교통지도과(☎062-607-4231)에서 제공하며, 소재지도로명주소가 공란인 경우 소재지지번주소를 참고하여주시기 바랍니다.(소재지번주소가 공란인 경우에는 소재지도로명주소 참고) 아울러 현재 해당 데이터는 전국주차장정보표준데이터(https://www.data.go.kr/data/15012896/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 공영주차장은 지방자치단체가 설치·운영하는 주차 시설로, 주민과 방문객이 차량을 안전하게 주차할 수 있도록 돕습니다. 광주광역시 남구청은 관내 여러 지역에 무료 및 유료 공영주차장을 운영하며, 이를 통해 도심 내 불법 주차를 줄이고 교통 혼잡을 완화하며 주차 편의성을 높이고 있습니다. 또한 주차장 위치, 요금, 이용 시간 등 다양한 정보를 제공하여 시민들이 효율적으로 차량을 이용하고 접근할 수 있도록 지원합니다.
