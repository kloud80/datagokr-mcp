description_portal: 충청북도 충주시의 시내버스 운행정보를 연간 기준으로 제공하는 데이터입니다.시내버스 시간표, 운임 및 요율 내역, 할인제도, 무료 환승지원 정책 등의 항목으로 구성되어 있으며, 대중교통 이용 편의 증진과 교통정책 수립에 활용됩니다.시간표는 노선별 정류장 기준 출발시간을 연간 고정 운행 기준으로 수록하였으며, 실제 운행은 계절·날씨·노선 개편 등으로 일부 변경될 수 있습니다.운임요율은 일반, 청소년, 어린이 등 대상별 기본 요금과 카드/현금 구분을 포함하며, 최신 교통카드 시스템 기준입니다.할인제도에는 국가유공자, 경로우대, 장애인 할인 등 현행 법령에 따른 감면 항목이 포함됩니다.무료 환승 지원은 특정 시간·노선 간 조건을 충족할 경우 적용되며, 교통카드 이용 시에만 적용되는 경우가 있습니다.※ 실제 이용 시 변동 가능성이 있으므로 충주시청 또는 버스운수업체 공지사항을 참고하시기 바랍니다. 노선개편 등 데이터 정합성 유지를 위해 기준일자 확인이 필수입니다.
