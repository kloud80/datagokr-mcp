summary_user: 전국 고속버스터미널의 코드(tmnCd)와 터미널명(tmnNm)을 담고, 출발·도착 터미널 기준으로 운행 중인 고속버스의 위치와 도착예정시간을 조회하는 API이며 검증 시 터미널 목록은 242행이 수신되었다. 고속버스를 타러 가는 이용객이나 환승 서비스 개발자가 특정 구간 버스가 언제 도착하는지 확인하는 질문에 쓴다. 전역 조인 키는 없고, 터미널 목록에서 받은 터미널코드를 출발지·도착지 코드(depTmnCd, arrTmnCd)로 넘겨 같은 기관의 도착지 목록·도착예정 조회와 이어 쓴다.
description_portal: 출/도착지 고속버스터미널 코드를 기준으로 현재 운행중인 고속버스의 위치 및 도착시간을 조회하는 고속버스도착정보 서비스 입니다.고속버스도착정보 서비스는 우선 고속버스 터미널 목록을 조회하여 터미널별 터미널코드(ID)를 확인한후 출발지 기준 도착지목록을 조회하여 출발지와 도착지 터미널, 차량 정보를 확인하여고속버스 도착예정정보 조회 API를 활용하여 운행중인 고속버스의 위치 및 도착시간을 조회할수 있습니다.한번에 출력되는 데이터 목록수를 설정할수 있으며, 페이지 번호를 설정하여 전체 데이터를 분할하여 호출이 가능합니다. TAGO 연계현황및 기술자료는 http://www.tago.go.kr에서 확인이 가능합니다.데이터 활용 추가 문의사항은 TAGO 운영팀(054-459-7870)으로 문의 바랍니다.
