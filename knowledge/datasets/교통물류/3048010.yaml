summary_user: 운수종사자관리시스템에 등록된 운수회사의 교통사고 건수를 연도·시도별로 집계해 버스(시내·고속·전세·마을·특수여객), 택시(개인·일반), 화물(일반·용달·개별) 업종별 소계와 합계로 담은 전국 단위 통계 파일이다. 교통안전 분석가나 지자체 담당자가 '우리 시도에서 택시와 화물 중 어느 업종의 운수회사 사고가 많고 해마다 어떻게 변하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 연도와 시도 이름을 맞춰 도로교통공단(TAAS) 지역별 사고 통계나 지자체 사고 통계와 이어 쓴다.
description_portal: '운수종사자관리시템은 여객자동차 운수사업법 및 화물자동차 운수사업법에 따라 버스, 택시, 화물자동차를 운전하는 운수종사자의 종사자격 등을 관리하는 시스템 입니다.관리하고 있는 모든 데이터는 개인정보이므로, 데이터를 가공하여 통계데이터를 개방하였습니다.  * 관리항목 : 운수종사자 경력사항, 교통사고 및 법규위반 이력, 운전적성정밀검사, 운전면허, 자격증 정보, 교육현황정보해당 데이터는 운수종사자관리시스템에 등록된 운수회사의 교통사고 통계현황(버스,화물,택시) 건수를 가공하여 제공하는 정보 입니다.'
