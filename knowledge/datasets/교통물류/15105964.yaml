summary_user: 중소도시 버스정보시스템(TS-BIS)의 버스 노선 목록을 노선 단위로 담은 CSV 파일 데이터로, 노선 아이디·노선명·기점/종점 노드와 정류장·지자체 정보를 포함하며 전국 7,239건이다. 지자체나 연구기관이 노선 개편이나 지역별 대중교통 정보 제공 방안을 검토할 때, 어느 지역에 어떤 노선이 있고 기점과 종점이 어디인지 확인하는 데 쓴다. 지자체코드·지자체명으로 같은 기관의 다른 코드와 연결할 수 있지만, 전역에서 통용되는 조인 키는 실측 컬럼에서 확인되지 않아 이름·코드 매핑이 필요하다.
description_portal: -한국교통안전공단에서 운영하는 TS-BIS(버스정보시스템)는 중소도시 대중교통 이용자의 교통복지 향상과 교통정보 격차 개선을 위한 버스정보를 제공하고 있습니다.-노선아이디와 노선명, 기점노드 아이디, 종점노드 아이디, 기점정류장, 종점정류장, 지자체코드, 지자체명 등을 공개하고 있습니다.(2026년 7월 기준)-데이터를 활용하여 학계, 연구기관, 지자체는 버스노선 개편, 대중교통 정보제공 알고리즘 고도화 및 정확성 향상, 노선 이탈률 감소 방안, 지역별 맞춤형 정보 제공 등 연구에 기여할 수 있습니다.
