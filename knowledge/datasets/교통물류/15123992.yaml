summary_user: 경기도 버스운송관리시스템(BMS)에 적용된 GIS 엔진·소프트웨어의 버전 정보를 등록일자(reg_ymd)와 버전값(gis_ver) 두 항목으로 담는 시스템 관리용 이력 자료입니다. 버스정보 시스템을 분석하거나 연계 개발하는 기술 담당자가 '노선·정류장 공간 데이터가 어느 GIS 버전 기준으로 만들어졌는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 등록일자나 같은 기관(경기도 BMS) 기준으로만 맞춰 본다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에서 사용되는 GIS(지리정보시스템)의 버전 정보를 제공하는 자료입니다. 항목은 '등록일자'와 'GIS 버전 확인'으로 구성되어 있으며, 시스템에 적용된 GIS 엔진 또는 소프트웨어의 버전 상태를 나타냅니다. 해당 데이터는 공간 기반 버스정보 시스템의 기능 개선 여부, 시스템 업데이트 이력, 데이터 정합성 분석, 기술적 호환성 검토 등에 활용될 수 있습니다. 특히 GIS 기반 교통정보 시각화, 경로 분석 기능, 노선 시뮬레이션 등 고도화 기능을 도입하거나 시스템 변경 시 참고자료로 사용됩니다.
