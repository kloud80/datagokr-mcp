summary_user: 경기도 과천시가 내준 도로굴착(점용) 허가를 허가번호별로 담은 건별 원천 파일로, 점용기간 시작·종료일, 노선번호, 점용장소, 점용면적, 폭·길이, 허가받은 자, 설치공작물(우수관·도시가스배관 등), 굴착공사방법을 담는다. 과천 시민이나 사업자가 "우리 동네 도로가 언제부터 언제까지 어떤 공사로 파헤쳐지는가"를 확인하거나, 분석가가 지하시설물 공사 이벤트와 중복 굴착을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 점용장소 주소나 노선번호를 이름으로 맞추거나 같은 기관(과천시) 자료끼리만 이어 쓴다.
limits: 과천시 한 곳의 허가만 담아 다른 시군구와 비교하거나 전국 단위로 볼 수 없고, 좌표 없이 점용장소 텍스트만 있어 바로 지도에 올리기 어렵다. 명세상 수시 갱신이므로 최신 허가가 즉시 반영된다고 가정하지 말고, 공통 코드 키가 없어 연계는 이름 매핑에 의존한다.
