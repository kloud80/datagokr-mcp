summary_user: 한국도로공사 차량검지기(VDS)로 수집한 고속도로 지점별 교통량·평균속도·점유율을 5분 단위로 집계한 통계로, 검지기 ID와 차로유형별로 담으며 범위는 전국입니다. 분석가가 '특정 고속도로 지점이 어느 시간대에 혼잡해지는가'처럼 정체 지점 파악, 혼잡도 분석, 교통 수요 예측에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, VDS 고유ID(VDS고유ID)를 같은 기관의 검지기 위치 정보와 이름·코드 매핑으로 연결해야 한다.
