summary_user: 성남시 교통신호기를 설치 위치(구, 도로명·교차로 명칭, 설치주소)별로 한 행씩 담고, 각 지점의 교통제어기 종류와 차량등·보조등·보행등·음향신호기·잔여시간 표시기, 신호등 철주·부착대의 규격·재질별 수량을 기록한다. 시민이나 분석가가 '우리 동네 교차로에 보행 잔여시간 표시기나 시각장애인용 음향신호기가 설치돼 있나'를 확인하거나, 구별 신호시설 구성을 비교하는 데 쓴다. 전국 공통 조인 키가 없어 다른 데이터와는 구 이름·교차로 명칭·주소를 맞추거나 주소를 좌표로 바꿔 어린이보호구역·무인단속카메라 같은 규제·단속 데이터와 겹쳐 본다.
description_portal: 성남시 내의 교통신호기에 대한 데이터이며, 위치, 종류, 보행등 잔여시간, 등의 형태, 재질 등의 자료를 포함하고 있습니다. 성남시는 원활한 교통 흐름과 보행자 안전 확보를 위해 시 전역에 걸쳐 교통신호기 설치 및 운영을 지속해오고 있다. 교통신호기는 차량용, 보행자용, 잔여시간 표시기 등으로 구성되며, 주요 교차로, 스쿨존, 보행 밀집구역 등에 집중 설치되어 있다. 성남시 전체 교통신호기가 설치되어 있으며, 이 중 상당수는 지능형교통체계(ITS) 연동을 통해 실시간 교통량에 따라 유연하게 운영되고 있다.
accrual_periodicity: 연간
