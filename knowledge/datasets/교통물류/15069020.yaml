summary_user: 전국 도로의 노드링크(링크아이디·도로명·지역)별로 택시 평균속도를 연간 일평균과 시간대별로 집계해 담은 파일로, 택시운행정보관리시스템(TIMS) 기반이며 법인택시와 개인택시를 모두 포함한다. 교통 분석가나 지자체 담당자가 '이 도로 구간은 몇 시대에 속도가 가장 떨어지는가' 같은 상습 정체 구간과 시간대를 찾는 데 쓴다. 링크아이디 컬럼이 있지만 실측에서 전역 조인 키로 확인되지 않아, 다른 도로·교통 데이터와는 링크아이디나 도로명·지역 이름을 맞춰 매핑하는 방식으로 연결한다.
description_portal: 연간 전국 노드링크별 일평균 및 시간대별 택시평균속도이며, 법인택시와 개인택시 모두 포함입니다.이 데이터는 택시운행정보관리시스템(TIMS) 기반 통계입니다.택시운행정보관리시스템은 택시운송사업의 발전에 관한 법률 제13조에 따라 주행거리, 속도, 위치정보(GPS), 분당 회전 수(RPM), 브레이크신호, 가속도 등 「교통안전법」 제55조제1항에 따른 운행기록장치에 기록된 정보와 승차일시, 승차거리, 영업거리, 요금정보 등 「자동차관리법」 제47조제1항에 따른 택시요금미터에 기록된 정보를 수집 관리합니다.
