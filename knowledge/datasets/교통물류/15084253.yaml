summary_user: 부산광역시 신호등 현황을 관리번호·설치장소·신호종류·설치일자·형태·위도·경도 등의 항목으로 담은 지도표출용 공간정보(SHP) 파일이며, 활용신청 없이 약 177KB zip으로 받는다. 교통 분석가나 시민이 '우리 동네 교차로·횡단보도 주변에 어떤 종류의 신호등이 어디에 설치돼 있나'를 지도에서 확인하거나 교통안전시설 분포를 분석할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 설치장소 이름 매핑이나 같은 기관(부산광역시) 코드로만 연결하며, 좌표를 이용해 단속카메라·보호구역 등 위치 데이터와 겹쳐 보는 방식으로 이어 쓴다.
description_portal: '부산광역시 신호등 현황 (관리번호, 설치장소, 신호종류, 설치일자, 형태, 위도, 경도 등) 지도표출용 공간정보(SHP) 파일입니다.( ※ 일반 파일은 SHP 없는 목록명을 검색하시기 바랍니다 )1. 교통안전시설물 신호등이란? 신호등은 교차로나 횡단보도 등에서 차량과 보행자의 통행을 안전하게 조절하기 위해 설치된 전자기기입니다. 교통 흐름을 원활하게 하고, 사고 예방 및 교통 법규 준수를 유도하는 중요한 시설물입니다. 2. 신호등 현황 공공데이터 주요 항목 설치 위치: GPS 좌표, 도로명 주소, 행정구역 정보 신호등 종류: 차량 신호등, 보행자 신호등, 자전거 신호등, 복합 신호등 등 설치 방식: 지상형, 천장형, 벽부형 등 설치 일자 및 제조사 정보 제어 방식: 고정시간 제어, 적응형 신호 제어 등 상태 정보: 정상 작동, 고장, 유지보수 필요 여부 부가 정보: 신호등에 부착된 CCTV, 교통 센서, 음성 안내기 등의 부속 장치 정보 3. 데이터 활용 목적 교통신호 체계 개선 및 최적화 연구 교통사고 예방 및 안전 강화 대책 수립 스마트 시티 및 ITS(지능형 교통 시스템) 구축 기반 자료 시민 대상 교통정보 제공 및 교통 시설 현황 안내 4. 데이터 제공처 및 접근 방법 공공데이터 포털(data.go.kr) 및 지방자치단체 교통관리부서에서 제공합니다.'
