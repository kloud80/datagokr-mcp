description_portal: 서울특별시 중랑구 자동차손해배상 보장법, 도로교통법, 자동차관리법 위반 차량에 대한 서울시 자동차번호판 영치 현황입니다. 자동차 번호판 영치 현황 데이터의 주요 제공 항목으로는 영치년도, 영치월, 영치기관, 영치기관코드, 영치건수가 있습니다. 영치년도는 2014년부터 2025년까지 있습니다. 연월별 영치건수가 표시되는 형태입니다. 자세한 사항은 하단의 링크를 클릭하여 서울시 열린데이터광장 홈페이지를 참고하여 주시기 바랍니다. 서울시 열린데이터광장에서 확인하실 경우 내려받기(csv) 버튼을 통해 다운 받으실 수 있습니다. 감사합니다.
