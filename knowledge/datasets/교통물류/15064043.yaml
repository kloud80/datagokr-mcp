summary_user: 수도권 5호선 각 역의 이름을 한글·영문·로마자·일본어·중국어(간체·번체)로 한 줄씩 담은 역 단위 xlsx 파일이며, 운영기관명과 노선명이 함께 들어 있다. 외국인 안내 표지·앱·지도 서비스를 만드는 사업자가 '5호선 ○○역을 영어·중국어·일본어로 어떻게 표기하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(역코드 등)가 없어 다른 역·승하차 데이터와는 역명·노선명 문자열을 맞춰 연결해야 한다.
description_portal: 수도권 5호선의 역명(한글),역명(영문),역명(로마자),역명(일본어),역명(중국어간체),역명(중국어번체) 등의 정보를 제공를 제공합니다.역명(驛名 / Name of station)은 철도역(정거장)의 명칭을 말한다.① 노선명 및 역명 표기문자는 한글로 최대 6자 이내로 정하는 것을 원칙으로 하되, 5자 이상으로 정할 경우에는 4자 이내의 축약 역명까지 동시에 정하여야 한다.② 철도시설관리자 및 철도운영자는 한글 역명과 더불어 외국인 관광객의 안내 등을 위하여 외국어(로마자, 한자) 역명을 표기하여야 한다.1. 한글 명칭과 한자 명칭이 서로 다른 때에는 한글 명칭을 우선 고려할 것2. 역명은 한글 맞춤법에 따를 것3. 로마자 표기는 국어의 표준 발음법에 따라 적는 것을 원칙으로 하며, 정부에서 정한 국어의 로마자 표기법에 따를 것. 다만, 일반적으로 국어와 외래어가 혼용하여 사용되고 있는 시청, 광장, 종합운동장 등은 번역하여 시티 홀(City Hall), 스퀘어(Square), 스포츠 콤플렉스(Sports Complex) 등으로 표기 가능
