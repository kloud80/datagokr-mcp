description_portal: 항공자격시험(ARTS) 항공종사자 자격시험 정보 공개(자격관리현황) 입니다. 해당파일을 통해 확인하실 수 있습니다. - 항공종사자 자격시험은 항공안전법 제34조에 따른 항공종사자 자격증명시험과 같은 법 제37조 및 제44조에 따른 자격증명 한정심사로 크게 구분할 수 있습니다. - 자격증명시험은 항공종사자 자격증명 구분에 따라 운송용조종사, 사업용조종사, 자가용조종사, 항공교통관제사, 항공정비사, 운항관리사 등으로 구분되며, - 한정심사는 항공기기종별 자격, 계기비행증명, 초급조종교육증명, 선임조종교육증명 등으로 구분됩니다.
