summary_user: 대전교통공사가 운영하는 도시철도 역사 안 수유실을 한 줄에 한 곳씩 담은 파일로, 노선·역명·지상/지하 구분·층·출구번호·상세위치와 유아용침대·소파·전자레인지·간이세면대 개수, 이용가능시간, 전화번호를 담으며 파일 크기가 450바이트로 매우 작다. 영유아를 동반한 이용자가 '대전 도시철도 어느 역 몇 번 출구 근처에 수유실이 있고 몇 시까지 쓸 수 있나'를 확인하거나, 분석가가 역별 육아편의시설 비품 현황을 살피는 데 쓴다. 공통 역 코드 같은 전역 조인 키가 없어 다른 철도 역·시설 데이터와는 역명·노선명을 이름으로 맞춰 연결해야 한다.
limits: 역 코드 등 조인 키가 없어 다른 데이터와 붙일 때 역명 표기 차이를 직접 맞춰야 한다. 파일이 450바이트에 불과해 수록된 수유실이 극히 적으므로 대전 도시철도 전체 수유실 현황으로 단정하지 않는다. 모유수유실과 가족수유실 구분 필드는 없어 이용 주체는 현장 안내를 확인해야 한다.
