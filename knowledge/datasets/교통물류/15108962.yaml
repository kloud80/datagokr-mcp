summary_user: 의왕시 자전거도로를 구간별로 한 행씩 담은 공간정보 파일로, 도로명·연장·폭원·재질·설치일자·재원과 위도·경도 좌표가 들어 있다. 시민이나 분석가가 '의왕시 어느 지역에 자전거도로가 얼마나 깔려 있고 폭은 어떤가'를 확인하거나 보행안전지수 지도에 자전거 이용환경을 반영할 때 쓴다. 전역 조인 키는 없어 행정동읍면코드·도로구간 번호 같은 기관 내부 코드나 좌표로 다른 의왕시 공간 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 의왕시 내 자전거도로 현황에 관한 공간정보 자료로, 보행안전지수 지도 시각화에 활용하기 위한 중간 데이터입니다. 공간지리식별번호, 지형지물부호, 도로구간번호와 같은 위치 관련 정보와 함께 자전거 도로명, 도로 길이, 도로 폭, 위도·경도 좌표 등의 정보를 포함하여 자전거도로의 위치 및 물리적 특성을 제공합니다. 이 데이터는 자전거도로의 분포와 규모를 파악하고, 보행안전지수 산출 시 자전거 이용환경을 반영하는 데 중요한 역할을 합니다. 2022년 기준 1회성으로 수집된 자료이므로 참고용으로 활용하는 것이 적절합니다.
