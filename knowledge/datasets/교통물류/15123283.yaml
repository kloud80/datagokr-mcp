summary_user: 경기도 도로대장전산화시스템의 도로중심선 곡선 설계 요소를 노선·구간·교점(IP) 번호별로 담은 자료로, 곡선반경·접선장·곡선장·곡선 시점과 종점·편경사·확폭 같은 선형 정보를 행 단위로 제공한다. 도로 설계·유지보수 실무자나 교통안전 분석가가 '이 노선 구간의 급곡선은 어디이고 반경과 경사는 얼마인가'를 확인하거나 GIS 도로모델을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 노선번호(route_no)·구간번호를 기준으로 같은 기관의 도로대장 자료와 이름·코드를 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템에서 도로 중심선의 곡선 설계 요소들을 구간별로 정리한 자료로, 각 도로 구간 내 곡선의 시작점(IP), 곡률(반경), 접선장, 곡선장, 곡선 시작점 및 종점 거리, 도로 경사, 확폭 등의 정보를 제공합니다. 이는 도로 선형 설계에서 중요한 기준이 되는 기하학적 요소들로, 도로의 안전성, 차량 속도 설정, 시야 확보, 구조물 배치 등에 직접적으로 영향을 미칩니다. 본 자료는 도로공사 설계, 유지보수, 재포장 및 확장계획, GIS기반 도로모델링, 교통안전시설 배치 등 다양한 토목공학 및 교통계획 분야에서 실무적으로 활용될 수 있습니다.
