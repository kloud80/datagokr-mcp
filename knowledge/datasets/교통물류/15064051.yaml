summary_user: 수도권 경의중앙선 각 역의 이름을 한글·영문·로마자·일본어·중국어 간체·번체로 담은 역 단위 목록 파일(xlsx)이다. 안내 표지·다국어 지도·관광 안내 앱을 만드는 사업자나 분석가가 '경의중앙선 ○○역을 영어·중국어로 어떻게 표기하나'를 확인할 때 쓴다. 전역 조인 키나 역 코드는 없어 다른 철도 데이터와는 운영기관명·노선명(선명)·역명 이름 매칭으로만 잇는다.
