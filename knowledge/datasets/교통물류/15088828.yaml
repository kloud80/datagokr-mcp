description_portal: '[데이터 설명:  경기도 구리시 불법주정차 압류정보]1. 개요 및 목적본 데이터는 경기도 구리시 지역내의 불법주정차 차량에 대한 처벌 및 압류정보(처리상태, 압류일자, 체납일자, 본세, 체납가산금, 부과일자 등)를 건별로 제공합니다.이 데이터는 과태료 체납으로 인해 자산이 압류된 사례를 정량적으로 파악할 수 있으며 압류등록 정보를 통해 민원 대응의 투명성을 제고합니다.2. 데이터 구성 항목 (컬럼 정보)이용자가 분석에 즉시 활용할 수 있도록 다음과 같은 핵심 정보를 포함하고 있습니다.회계연도: 해당 과태료 또는 체납금이 귀속되는 회계연도압류구분: 체납처분에 따라 설정된 압류여압류일자: 해당 차량에 대해 압류가 실제로 설정된 날짜수납구분: 과태료 또는 체납금의 납부 상태 구분 (예: 미납, 완납, 부분납 등)체납일자: 납부기한 경과 후 체납이 발생한 기준일자체납본세금액: 체납된 과태료의 원금 금액체납가산금: 체납에 따라 추가로 부과된 가산금부과일자: 과태료가 최초로 부과된 날짜3. 데이터 범위 및 기준시간적 범위: 2025년 1월 1일부터 2025년 12월 31일까지데이터 기준일자: 2026년 4월 15일'
