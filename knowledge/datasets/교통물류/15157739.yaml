summary_user: 인천항 여객터미널에서 운영하는 선사(선사코드·선사명·전화번호·홈페이지·소개·활성 여부), 선박(선박코드·선명·소속 선사코드), 항로(항로코드·출발지·종착지·편도 여부·주변 볼거리) 같은 기본 운영정보를 건별 목록으로 담는 API다. 인천항에서 어느 선사가 어떤 배로 어느 섬 항로를 다니는지, 선사 연락처는 무엇인지 확인하려는 여행객·도서 주민과 고객 안내 시스템을 만드는 운영사가 쓴다. 전역 조인 키는 없다. 오퍼레이션끼리는 선사코드(wtorcmpCode)로 선사와 선박을 잇고, 다른 연안여객 데이터와는 선사명·항로명 같은 이름 매칭이나 같은 기관 코드로만 연결된다.
description_portal: 해당 자료는 인천항만공사에서 운영하는 인천항 여객터미널에 대한 기본 운영정보를 제공하는 Open API 설명 자료로, 각 선사의 명칭, 개장일시, 최근 운영일자, 전화번호, 회사코드 등 선사 운영 관련 정보를 포함합니다. REST 방식의 API로 XML 포맷 데이터를 제공하며, 페이지 단위로 호출 가능하고, 터미널 운영사 및 여객 운송기관에서 선사 관리, 고객 안내, 서비스 연계 등에 활용될 수 있습니다. 또한 여객터미널 운영 효율화, 선사별 입출항 정보 연계, 민원 응대 시스템 구축 등에서도 적용 가능하며, 해양교통 서비스 품질 제고 및 여객 운송 데이터 기반 분석에도 기여할 수 있습니다.
