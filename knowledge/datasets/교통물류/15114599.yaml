summary_user: 목포시가 관할하는 일반화물자동차 운송사업체를 업체별 한 줄로 담은 파일로, 업체명·면허종류·차량대수·사업장 주소·현재 운영여부를 포함한다(csv 약 8.9KB, 시군구 범위). 목포에서 영업 중인 화물운송사가 어디이고 차량을 몇 대 보유했는지, 지역 운송 능력이 어느 정도인지 확인하는 데 쓴다. 전역 조인 키가 없어 전국화물자동차운송사업자표준데이터 등과는 업체명·주소를 맞춰 대조해야 한다.
description_portal: 본 데이터는 전라남도 목포시에서 관할하고 있는 일반화물자동차 운송사업의 현황을 수록한 자료입니다. 관내 등록된 사업체를 기준으로 업체명, 면허종류, 차량대수, 사업장 주소, 운영 여부 등의 항목을 포함하고 있으며, 이는 지역 내 화물운송업체의 운영 실태 및 규모를 파악하는 데 활용될 수 있습니다. 본 데이터는 운송업 관련 행정 자료의 기초자료로서 정책 수립, 행정 관리, 민원 응대 등에 활용 가능하며, 운송업 종사자 및 관련 산업 관계자들에게 실질적인 정보를 제공합니다. 수록된 정보는 각 사업체별로 구분되어 있으며, 실제 등록된 차량의 수량을 통해 지역 내 운송 능력의 분포를 파악할 수 있도록 구성되어 있습니다. 또한 폐업 여부 등 운영 상태 정보가 포함되어 있어 실시간 관리에 유용합니다. 데이터는 정기적으로 갱신되며, 관련 법령 및 행정지침에 따라 정확성을 유지하고 있습니다.
