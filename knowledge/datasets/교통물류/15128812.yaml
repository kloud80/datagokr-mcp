summary_user: 서울 동대문구에 등록된 화물자동차 주선업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 업종명·업체명·영업상태·주선업 유형(일반·이사 화물 등)·주사무소 주소·전화번호를 수록한다(파일 크기 약 2KB의 소규모 자료). 이사나 화물 운송을 맡기려는 주민이나 사업자가 "동대문구에서 영업 중인 이사화물 주선업체는 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭으로만 잇는다. 허가 여부를 확인하려면 전국화물자동차운송사업자표준데이터와 대조하는 방식이 기준이 된다.
description_portal: 본 화물 데이터는 관내 물류 산업의 투명성을 높이고 효율적인 화물 운송 체계를 지원하기 위해 등록된 주선 사업자의 핵심 정보를 제공합니다. 해당 업체가 종사하는 업종명과 공식 업체명을 명시하며 일반 화물이나 이사 화물 등 취급 품목에 따른 주선업 유형을 상세히 구분하여 수록하고 있습니다. 또한 이용자가 서비스를 원활히 이용할 수 있도록 업체의 정확한 소재지 주소와 업무 협의를 위한 대표 전화번호 정보를 포함하여 민간과 공공 분야 모두에서 실질적인 활용이 가능하도록 구성되었습니다.
