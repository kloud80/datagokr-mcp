summary_user: 대구교통공사가 관리하는 도시철도역의 전동휠체어 급속충전기 설치 현황을 역별로 담은 파일(csv, 약 6KB)로, 운영기관·노선·역명·지상지하 구분·역층·상세위치·충전설비 수·전화번호가 들어 있다. 대구 지하철을 이용하는 전동휠체어 사용자나 보호자가 '어느 역 몇 층 어디에서 배터리를 충전할 수 있나'를 확인하거나, 교통약자 편의시설 분포를 점검하는 분석에 쓴다. 전역 조인 키(역 코드 등)는 없어서 다른 역·시설 데이터와는 노선명과 역명을 이름으로 맞춰 이어 써야 한다.
limits: 역 코드 같은 공통 키가 없어 다른 철도 데이터와 연결할 때 역명 표기를 직접 맞춰야 한다. 범위는 전국으로 분류돼 있으나 내용은 대구교통공사 관리 역에 한정되며, 위치는 좌표가 아닌 상세위치 문구로만 주어진다.
