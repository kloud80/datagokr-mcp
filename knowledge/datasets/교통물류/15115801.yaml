summary_user: 서울특별시 중구 등에서 운영하는 불법주정차 단속용 고정형 CCTV의 설치 지점을 한 대씩 담은 위치 목록으로, 설치 주소, 위도·경도, 자치구 코드, 단속지점명 등을 포함한다. 시민이나 사업자가 '이 길에 주차하면 단속 카메라에 찍히는가'를 확인하거나, 분석가가 어린이 보호구역·소방시설 주변의 단속 CCTV 배치 현황을 지도로 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 자치구 코드(CGG_CD)나 주소 이름 매핑, 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 서울시 및 25개 자치구에서 운영중인 주정차단속용 고정형CCTV의 위치정보를 제공하는 자료입니다. 주요 항목에는 설치 지점 주소, 위도와 경도 좌표, 단속지점, 관리 기관 등이 포함되어 있습니다. 불법주정차 단속 CCTV는 교통 혼잡을 줄이고 보행자 안전을 확보하기 위해 운영되는 장치로, 특히 소방시설 주변, 어린이 보호구역, 횡단보도 인근과 같은 주요 지역에 집중 배치됩니다. 본 데이터를 통해 불법주정차 위반으로 인한 사회적 비용을 절감하고 교통정보 플랫폼과 연계하여 시민에게 다양한 교통 서비스를 제공하고자 합니다.
