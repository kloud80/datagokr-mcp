description_portal: '민원인의 요청에 따라 제공되는 일회성 데이터입니다.충청북도 보은군의 2024년 국민신문고로 접수된 불법주정차 민원 및 과태료 부과현황(신고일자, 신고위치, 과태료 부과여부 등)을 다음과 같이 제공하고자 합니다.국가정보자원관리원 화재 발생(2025.9.26.)으로 조직개편 전 자료가 복구되지 않아 개편(2024.7.1.) 이후 제공 가능한 데이터만 제공됩니다.충청북도 보은군의 불법주정차 민원 및 과태료 부과현황 데이터와 관련된 기타 문의사항은 보은군청 민원과(043-540-3096)로 연락하여 주시기 바랍니다.○신고 접수현황 : 총 66건※ 기준일 2024.12.31.'
