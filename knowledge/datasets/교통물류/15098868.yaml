description_portal: '이 데이터는 경상북도 봉화군에 등록된 자동차의 현황을 연료별, 차종별, 용도별로 세분화하여 집계한 공공데이터입니다. 자동차 등록 현황은 해당 지역의 교통, 환경, 에너지 정책 수립에 중요한 기초자료로 활용될 수 있습니다. 예를 들어, 경유 차량 비중은 대기오염 및 미세먼지 관리 정책과 연관이 있으며, LPG 차량이나 기타 친환경 연료 차량의 등록 현황은 친환경 교통수단 보급 정도를 보여줍니다. 또한 승용, 승합, 화물, 특수차량 등 차종별 구분을 통해 봉화군 내에서 개인용 차량, 대중교통, 화물 운송, 특수 목적 차량의 분포를 확인할 수 있습니다. 용도별로는 비사업용(개인 차량 등)과 사업용(운송업, 상업용 등)으로 구분되어 있어 교통 수요와 상업 활동의 규모를 파악하는 데 유용할 것으로 판단됩니다. 데이터는 특정 시점을 기준으로 제공되며, 봉화군의 교통 및 에너지 구조를 종합적으로 이해할 수 있는 중요한 통계자료라 할 수 있습니다.[컬럼별 항목 설명]시군구별 : 자동차가 등록된 행정구역연료별 : 차량에 사용되는 주요 연료 종류용도별 : 차량 등록 용도 구분승용 : 등록된 승용차 대수.승합 : 등록된 승합차 대수화물 : 등록된 화물차 대수.특수 : 등록된 특수차량 대수계 : 위 차량 대수의 합계.데이터기준일 : 해당 통계가 집계된 기준일'
