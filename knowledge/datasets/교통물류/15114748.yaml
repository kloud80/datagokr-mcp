description_portal: '본 데이터는 강원특별자치도 삼척시에 등록·허가된 일반화물자동차 운송사업자에 대한 포괄적인 정보를 제공합니다.지자체(삼척시 총무과)에서 분기별로 갱신·관리하며, 화물자동차 운수사업법에 의거하여 등록된 사업자의 현황을 주민과 행정·연구기관에 투명하게 공개하고자 합니다.주요 제공 항목상호(CompanyName): 각 운송업체의 공식 명칭사업의 종류(BusinessType): 일반화물, 개별화물, 용달화물 구분사업자 구분(OperatorClass): 법인·개인 여부전화번호(PhoneNumber): 대표 연락처 정보사무소 주소(OfficeAddress): 본사 또는 지점 소재지영업 상태(BusinessStatus): 영업중, 휴업, 말소 등 현황위수탁 여부(ConsignmentFlag): 직영 운송 또는 위탁 운송 구분데이터 형식 및 접근 방법파일 형식: CSV (열 구조화 텍스트), XML·JSON API 제공전체 행 수: 11건(2025‑04‑28 기준)업데이트 주기: 분기별 (다음 갱신 예정일: 2025‑07‑28)이용 요금: 무료활용 사례정책 수립·평가: 운송업체 구성비·영업 상태 변화를 분석하여 안전·환경·물류 정책에 반영물류 인프라 계획: 사무소 주소를 기반으로 화물차 주차장·물류창고 입지 선정시장 조사: 법인 대 개인, 일반·개별·용달 화물 운송 비중 파악을 통한 경쟁 구도 분석행정 모니터링: 휴·폐업 발생 시 신속한 민원 대응 및 허가 관리 강화이 데이터는 행정의 투명성과 물류 서비스 품질 향상을 위해 제공되며, 연구기관·물류기업·시민 누구나 자유롭게 활용할 수 있습니다. 추가 문의나 원시 데이터 가공 요청 시 삼척시 총무과 데이터관리팀으로 연락 바랍니다.'
