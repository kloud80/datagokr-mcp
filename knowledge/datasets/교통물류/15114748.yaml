summary_user: 강원특별자치도 삼척시에 있는 일반화물자동차 운송사업자를 사업소 한 곳당 한 행으로 담은 건별 명부로, 사업소명·도로명/지번 주소·운영여부·차량대수·데이터기준일자를 담고 범위는 삼척시 한 곳이다(CSV 1,208바이트). 화물 운송을 맡기려는 사업자나 지역 물류를 보는 분석가가 '삼척시에서 운영 중인 일반화물 운송사가 어디에 있고 차량을 몇 대 갖고 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 전국화물자동차운송사업자표준데이터 등 다른 허가 원장과는 사업소명·주소 문자열로 맞춰 이어 쓴다.
limits: 사업자번호 같은 공통 키가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 기대야 하고, 삼척시 밖의 사업자는 들어 있지 않다. 포털 설명에 적힌 전화번호·법인/개인 구분·위수탁 여부는 실제 파일 컬럼에 없으므로 이 항목은 이 데이터로 확인할 수 없다.
