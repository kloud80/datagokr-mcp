summary_user: "인천지하철 2호선 휴일 상선(운연→검단오류 방향) 열차마다 시발역·종착역·운행순번과 운연부터 검단오류까지 27개 역의 출발시각을 한 행으로 담은 시각표 파일(csv)이다. 휴일에 2호선을 타는 시민이 '검암역에서 검단오류 방향 첫차·막차가 몇 시인가'를 확인하거나, 분석가가 역별 배차 간격을 계산하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 역 이름을 매핑해 잇는다(예: 같은 기관의 평일·하선 시각표, 역별 승하차 인원)."
description_portal: 인천지하철 2호선 휴일 상선(운연역에서 검단오류역 방향) 열차운행시각표 정보로 시발역, 종착역, 열차운행순번, 경유역(운연역 ~ 검단역) 출발시각 항목으로 구성되어 있습니다.2호선은 검단오류역에서 운연역까지 총 27개역을 운영하고 있습니다.대부분의 데이터의 시발역은 운연역이고 인천시청역, 서부여성회관역, 검암역이 시발역인 데이터가 각각 1건씩 존재합니다.모든 데이터의 종착역은 검단오류역입니다. 휴일 상선의 열차운행은 05시 30분에서 시작하여 익일 01시 05분에 종료됩니다.
