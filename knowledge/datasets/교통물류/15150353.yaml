summary_user: 전국 국도의 노선별 기본 정보(노선명·노선번호·방향 코드, 시작·종료 방향명, 등록·수정 일시)를 노선·방향 단위의 비공간 목록으로 담는다. 교통 분석가나 개발자가 '국도 몇 호선의 양방향 기점·종점 방향이 어디인가'를 확인하거나 국도 노선 코드표를 만들 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 노선번호나 노선명 같은 이름·코드 매칭으로 이어 쓰고, 교통 데이터의 공간 기준인 표준노드링크(link_id·node_id)와는 직접 연결되지 않는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
