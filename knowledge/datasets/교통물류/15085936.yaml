summary_user: 경기도 평택시 수소충전소 6곳을 한 곳당 한 행으로 담은 파일 데이터로, 충전소 명칭·도로명·지번 주소·위경도·운영 시작·종료 시각·휴무일·연락처를 싣는다. 수소전기차 운전자가 평택시에서 지금 문 연 수소충전소가 어디인지 찾을 때 쓴다. 도로명주소·지번주소(address)나 위도·경도(coord)를 키로 지도, 다른 지역의 충전소 목록, 주소 데이터와 이어 쓴다.
description_portal: '경기도 평택시 수소충전소 현황에 대한 데이터로 충전소 명칭, 소재지도로명주소, 소재지지번주소, 위도, 경도, 운영시작시각, 운영종료시각, 휴무일, 연락처 등의 정보를 제공합니다.수소충전소는 수소전기차에 수소를 충전해주는 곳으로, 수소를 공급하는 방식에 따라 저장식 충전소와 제조식 충전소로 나눌 수 있습니다.본 데이터는 원활한 수소자동차 연료 수급이 가능하도록 도움을 주고자 제공하는 데이터입니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 환경정책과(031-8024-3758)'
