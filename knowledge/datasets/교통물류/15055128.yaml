summary_user: 경상남도 도내 교량을 한 건씩 담은 파일로, 도로종류·노선명·시설명과 시군구·읍면동·리 단위 소재지, 교량길이·총폭·유효폭·교고·경간수·최대경간장, 상부·하부구조, 설계하중, 교통수량, 준공연도를 담는다. 도로 분석가나 지자체 담당자가 '경남의 어느 시군에 준공된 지 오래된 교량이나 설계하중이 낮은 교량이 몰려 있는가'를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구·읍면동 이름이나 노선명·시설명으로 매칭해 잇고, 터널·교량·지하차도는 제공표준이 있어 다른 지자체 교량 현황과 같은 형식으로 묶어 볼 수 있다.
