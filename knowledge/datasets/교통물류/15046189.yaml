description_portal: 광주광역시 동구지역 헬기 이착륙장 현황에 대한 데이터로 이착륙장 기관명, 위치, 층수, 대상별로 설명하는 자료입니다.헬기 이착륙장은 재난이나 응급 상황에서 소방헬기·의무후송헬기 등이 신속하게 이착륙할 수 있도록 마련된 공간입니다. 화재, 산악사고, 교통사고, 응급환자 이송 등 긴급 상황에서 헬기의 골든타임 확보를 위해 꼭 필요한 시설입니다. 특히 동부소방서 관내는 산지와 도심이 혼재된 지역이어서 헬기 지원이 중요합니다.동부소방서 관내에는 주거지 밀집 지역뿐 아니라 동구 외곽 산악지대도 포함되어 있어, 공공기관 부지·운동장·공원 등 다목적 공간이 임시 또는 상설 헬기 이착륙장으로 지정되어 있습니다. 이착륙장은 보통 다음과 같은 장소를 중심으로 마련됩니다. 병원 부지(응급환자 이송을 위한 헬기장), 학교 운동장 및 공원(대형 재난 시 임시 착륙지), 공공기관 시설 부지(화재 및 구조작업 지원용 착륙지)광주 동부소방서 관내 헬기 이착륙장은 단순한 공터가 아니라, 재난 대응과 응급환자 구조를 위한 생명선 역할을 하는 중요한 시설입니다.이 데이터는 동부소방서 관내 헬기 이착륙장 기관명, 위치, 층수, 대상 등의 항목을 제공합니다.
