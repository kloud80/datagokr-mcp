description_portal: 본 데이터는 겨울철 강설 및 결빙으로 인한 도로 안전사고를 예방하고, 시민들이 비상시 제설 자재를 신속하게 이용할 수 있도록 관내에 설치된 제설함의 위치 및 관리 현황 정보를 제공합니다.주요 제공 항목으로는 제설함의 고유 식별을 위한 관리번호, 실제 현장에서 찾을 수 있는 정확한 설치 위치 및 설치 주소(지번 또는 도로명), 지도상에 시각화할 수 있는 경도와 위도 좌표 정보가 포함되어 있습니다. 또한, 시설물의 체계적인 유지 관리를 위해 관리기관과 관리부서 정보를 명시하였으며, 제설함의 설치형태(지상형, 벽면부착형 등), 최초 제설함 설치연월일, 그리고 내부에 구비된 구체적인 내용물(염화칼슘, 모래, 삽 등)에 대한 상세 정보를 함께 제공합니다.본 데이터를 활용하여 겨울철 빙판길 안전사고 위험 지역을 분석하거나, 시민용 내비게이션 및 생활안전 지도 서비스 내 "내 주변 제설함 찾기" 기능 개발 등 다양한 안전 인프라 서비스 및 민간 애플리케이션 개발에 유용하게 활용할 수 있습니다.
legal_basis_portal: 제설함 위치정보로 위급시 누구나 사용할 수 있게 공개하고 있습니다.
