summary_user: 대구광역시 ITS가 하이패스 장착 차량을 DSRC 장비로 검지한 결과를 바탕으로, 날짜·시간대·링크(도로 구간)별 원활·서행·정체 값을 담은 상습지정체 통계 파일(CSV, 약 550KB)이다. 교통 분석가나 시 교통정책 담당자가 '대구 어느 도로 구간이 몇 시에 상습적으로 막히는가'를 파악해 혼잡 시간대 예측이나 도로 개선 대상 선정에 쓴다. 실측 컬럼에 표준 링크ID 같은 전역 조인 키가 없으므로, 다른 교통 데이터와는 링크명(도로 구간 이름) 매핑으로만 연결한다.
description_portal: 대구광역시 상습지정체 정보는 지능형교통시스템(ITS)를 통해 수집되는 지·정체 정보를 제공하는 통계자료입니다. DSRC(Dedicated Short Range Communications, 단거리 전용 통신)장비를 통해 하이패스를 부착한 차량을 검지한 데이터를 기반으로 일시, 링크명, 원활, 서행, 정체값을 제공합니다. 해당 자료를 통해 시간대별 지정체 구간을 분석하여 특정 도로 구간의 교통 흐름 파악 및 혼잡 시간대를 예측할 수 있으며, 도로 개선이나 교통정책 수립에 필요한 결과값을 추출할 수 있습니다.
