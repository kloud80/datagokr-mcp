summary_user: 수도권 전철의 출발역–도착역 쌍별 연간 여객 수송 인원을 연도 단위로 담은 집계 파일(CSV, 약 7MB)입니다. 교통 분석가나 상권 분석가가 '어느 역에서 어느 역으로 가는 이동이 해마다 가장 많은가'처럼 고수요 구간과 통행 흐름을 파악하는 데 쓴다. 전역 조인 키는 없어서 역 이름을 기준으로 역 위치·역별 승하차 데이터와 이름 매핑해 이어 쓴다.
description_portal: 이 데이터는 수도권 전철의 역간 여객 발착(승하차) 수송량 정보를 제공합니다. 각 연도별로 출발역, 도착역, 수송 인원 및 단위가 기록되어 있습니다.이 자료를 활용하면 역간 승하차 인원 흐름, 주요 환승 노선 및 이용 집중 구간, 고수요 출발·도착 조합, 노선 및 시간대별 여객 분포, 통행 패턴 및 여객 이동망 구조, 여행 수요 변화 추이, 출퇴근 및 중심도시 유동 인구 등 다양한 인사이트를 도출할 수 있습니다. 또한, 역세권 개발·상권 분석, 노선 증설 및 혼잡 구간 선별, 수도권 대중교통 정책 수립, 수송력·서비스 개선 방안 도출, 민간·공공 교통연구, 이동 빅데이터 분석 등 다양한 분야의 기초 참고자료로 쓰일 수 있습니다.
