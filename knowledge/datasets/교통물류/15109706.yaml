summary_user: 제주특별자치도 내 전기차 충전기에서 발생한 충전 이력을 충전 건별로 담은 원천 파일(CSV, 약 194MB)로, 운영기관·충전소·충전기 식별 정보와 충전 시작·종료 시각, 충전 시간, 충전량, 충전 금액, 완료 상태를 기록한다. 분석가나 정책 담당자가 '제주의 어느 충전소·충전기가 어느 시간대에 얼마나 쓰이고, 건당 충전량과 금액은 어느 정도인가' 같은 이용 패턴과 충전 인프라 효율성을 따질 때 쓴다. 전역 조인 키는 없어서, 다른 충전소 현황 데이터와는 충전소 아이디·충전소 이름을 이름·코드 매핑으로 맞추거나 같은 기관(제주특별자치도) 자료끼리만 연결한다.
limits: 실측 컬럼에 표준 조인 키가 없어 충전소 위치나 전국 충전기 현황과 바로 결합되지 않고, 이름·코드를 직접 맞춰야 한다. 범위는 시도(제주) 단위이며 좌표 같은 공간 정보가 없어 지도 분석에는 별도 위치 자료가 필요하다.
