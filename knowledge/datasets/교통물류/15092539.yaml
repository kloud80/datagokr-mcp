summary_user: 출발공항과 도착공항의 IATA 코드·공항명과 두 공항 사이의 대권거리(km)를 공항 쌍 한 행씩 담은 CSV 파일(약 40KB)이다. 항공사·연구자가 "인천에서 특정 해외 공항까지 노선 거리는 몇 km인가"를 확인해 연료 소비량·탄소배출량 추정이나 거리 기반 운임 분석에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 출발·도착 공항의 IATA 코드를 공항 코드 마스터나 운항·항공통계 데이터의 공항 코드와 맞춰 이어 쓴다.
description_portal: '데이터 개요항공산업 분석 및 정책 수립에 활용되는 항공노선 거리 정보를 제공합니다. 이 데이터는 출발공항과 도착공항의 IATA 코드 및 공항명, 그리고 두 공항 간의 직선거리(Great Circle Distance, km) 정보를 포함합니다.주로 노선 분석, 항공사 운항 통계, 연료 소비량 추정, 탄소배출량 산정, 항공권 거리 기반 운임 분석 등에 활용됩니다.주요 제공 항목공항식별 기준: 국제항공운송협회(IATA) 공항 코드 기준 출발 및 도착 공항의 IATA 코드와 공항명 제공거리 산정 기준: 지구 곡률을 고려한 Great Circle Distance(대권거리) 기준실운항 거리와는 차이가 있을 수 있음활용 안내정책기관 및 지자체: 공항 개발 및 확장 타당성 검토항공사: 노선 전략 및 기재 운영계획 수립연구기관 및 기업: 산업동향 및 물류 수요 분석 기반 자료공공포털 및 통계 시스템: 공공 항공통계 연계 제공데이터 이용 시 유의사항연도별 데이터로만 제공되며, 월별, 분기별 세부 항목은 별도 항목 참조 필요국내선과 국제선의 세부 구분값은 포함되지 않음공항 또는 항공사 단위의 상세자료는 별도 분석 시스템 또는 보고서 참고 필요'
