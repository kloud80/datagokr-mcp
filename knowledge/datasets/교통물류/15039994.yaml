summary_user: 여수시 관내 시민여객선이 들르는 기점·종점·중간기항지를 기항지 한 곳당 한 행으로 담은 기본정보 파일로, 기항지 이름·영문명·주소·경도·위도와 사용 여부를 포함한다(약 5KB 분량의 CSV). 도서 주민 운임지원 대상 기항지를 관리하는 담당자나 분석가가 '여수 섬 지역 여객선 기항지는 어디에 있고 지금 쓰이는 곳은 어디인가'를 지도 위에 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 기항지 이름 매칭이나 경도·위도 기반 공간 결합으로만 이어 쓴다. 대상은 여수시 자체 기항지 아이디(주기항지아이디·부기항지아이디)를 쓰는 데이터로 한정된다.
description_portal: 여수시 관내 여객선 기점, 종점 및 중간기항지 등 기항지 기본정보입니다. 여객선 운임지원 업무에 활용되는 기초자료로, 여객선이 운항하는 각 기항지의 위치 및 현황 정보를 제공합니다.본 데이터는 여객선 운임지원 대상 기항지 관리, 도서지역 교통서비스 운영, 항로 현황 파악, 공간정보 기반 분석, 행정업무 지원 및 관련 정책 수립을 위한 기초자료로 활용될 수 있습니다. 경도·위도 정보를 활용하여 지도 기반 서비스 구축, 기항지 위치 시각화 및 해상교통 네트워크 분석 등 다양한 분야에서 활용이 가능합니다.
