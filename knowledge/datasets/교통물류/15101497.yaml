summary_user: 인천광역시에 국제물류주선업으로 등록된 업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업체명·주소·데이터기준일이 들어 있습니다(CSV 약 65KB). 수출입 화주나 물류업체가 인천 소재 포워딩(국제물류주선) 업체가 정식 등록됐는지 확인하거나, 분석가가 인천 지역 국제물류주선업체의 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소를 맞춰 붙여야 하며, 화물운송·주선사업 허가 여부는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: 인천광역시에 등록되어 있는 국제물류주선업 등록업체 현황 정보를 제공합니다. (등록번호, 업체명, 주소 등 항목 제공)이 공공데이터는 인천광역시에 국제 물류 주선업으로 정식 등록하고 영업 중인 업체들의 기본 등록 정보를 정리하여 제공하는 산업 인프라 자료입니다. 이는 국제 물류 및 무역 관련 서비스 현황을 파악하는 데 활용됩니다. 인천시의 국제 물류 산업 인프라 관리 및 무역 서비스 정보 제공을 위한 핵심 기반 정보입니다. 해당 데이터는 공공데이터포털에서 제공되고 있으며, CSV파일을 다운로드 할 수 있습니다.
