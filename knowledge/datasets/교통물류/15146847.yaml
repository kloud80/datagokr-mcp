description_portal: 경기도 하남시 스마트교차로 CCTV 정보는 교통 흐름과 사고 예방을 위해 설치된 장치들의 세부 현황(카메라식별번호, 시설관리아이디, 카메라명, 설치방향, 카메라설치각도, 설치경도, 설치위도, 사용여부)을 담고 있습니다. 각 CCTV는 고유 식별번호와 시설관리아이디로 관리되며, 위치정보는 위도와 경도로 제공되어 정확한 설치 지점을 확인할 수 있습니다. 또한 설치방향과 카메라설치각도가 기록되어 교통 모니터링에 최적화된 시야를 확보합니다.  사용여부는 장치의 운영 상태를 판별하는 지표로 활용됩니다. 이 데이터는 교차로의 교통안전 강화와 실시간 교통관제, 시설관리 효율화를 위해 중요한 기반 자료로 활용될 수 있습니다.
