summary_user: 화물운송종사자격시험 합격자를 대상으로 한 대면 합격자 교육의 장소(교육지사)와 교육 정보(시행코드, 교육차수, 교육년도, 교육이수일자, 교육구분)를 행 단위로 담은 전국 범위 파일 데이터(CSV 약 36MB)입니다. 화물운송 자격제도를 분석하는 연구자나 담당자가 연도별·지사별로 합격자 교육이 몇 차수, 언제 이수되었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육지사 이름이나 시행코드 같은 기관 내부 코드를 매핑해야만 연결된다.
