description_portal: 한국교통안전공단에서는 화물자동차 운수사업을 효율적으로 관리하고 건전하게 육성하여 화물의 원활한 운송을 도모함으로써 공공복리의 증진에 기여함을 목적으로 한 화물자동차 운수사업법에 의거하여 화물운송종사 자격제도를 운영하고 있습니다.해당 데이터는 한국교통안전공단에서 시행하는 화물운송종사자격시험 합격자에 합격자 교육 장소 데이터 및 교육 정보에 대한 데이터입니다.데이터는 행 기준 시행코드, 교육지사, 교육차수, 교육년도, 교육이수일자, 교육구분목록 순으로 정리하였습니다.* 해당 데이터는 화물 합격자 교육(대면) 현황 자료이며, 2020년부터 코로나로 인해 전면 온라인 교육으로 전환되었습니다.
