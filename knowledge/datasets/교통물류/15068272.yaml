summary_user: 무공해차 통합누리집(ev.or.kr)에 등록된 전기차 완속충전기(40kW 미만)의 연도별 신규 보급 수량(기)을 해당연도말 기준으로 담은 전국 단위 집계 파일로, 285바이트 정도의 작은 CSV입니다. 정책 분석가나 연구자가 '완속충전기 신규 보급이 해마다 얼마나 늘었는가'처럼 연도별 추이를 볼 때 쓴다. 지역·충전소 코드 같은 공통 조인 키가 없어 다른 데이터와는 연도(년도)를 기준으로만 맞춰 붙여 쓴다.
description_portal: '전기자동차 완속충전기 년별 보급현황 자료입니다.- 단위 : 신규 보급 기/개소- 전기차 충전기는 무공해차 통합누리집(ev.or.kr)에 등록된 충전기 기준입니다- 본 자료는  해당연도말 기준으로 작성된 자료입니다- 완속 충전기는 40kW 미만의 충전기로서 아파트 등 공동주택, 생활공간에 주로 설치되고 있으며 전용충전구역에서 14시간까지 충전이 가능합니다- 7kW, 11kW의 충전기가 많이 설치되고 있으며, 무공해차 통합누리집에서 충전기가 설치된 곳의 위치와 정보를 확인할 수 있습니다'
