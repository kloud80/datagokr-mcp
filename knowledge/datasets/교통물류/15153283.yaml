summary_user: 국토교통부 항공교통본부가 제공하는 지형(장애물) 정보를 장애물 한 건 단위로 담으며, 장애물 이름·유형, 길이·폭·고도·높이(단위 포함), 유효기간 시작·종료 시점, 항공정보간행물 게재 여부 등을 포함하고 범위는 전국이다. 항공 운항·드론 비행 계획을 세우는 사업자나 분석가가 특정 지역의 고층 장애물이 어떤 것이고 높이가 얼마인지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 이을 전역 조인 키는 찾지 못했으므로, 장애물 이름 매핑이나 같은 기관(항공교통본부) 데이터의 식별자로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 항공교통본부에서 제공하는 지형(장애물) 정보입니다.\""
