summary_user: 김포시에서 버스를 운행하는 운수회사별로 구분, 업체명, 소재지 도로명·지번 주소, 전화번호, 운행노선을 한 행씩 담은 소규모 목록 파일(csv 약 2KB)이다. 시민이나 분석가가 김포의 특정 버스 노선을 어느 회사가 운행하는지, 그 회사의 위치와 연락처가 어떻게 되는지 확인할 때 쓴다. 전역 조인 키는 없고, 운행노선 번호나 업체명을 이름 그대로 맞춰 노선·정류장 원장이나 버스 도착정보와 연결해야 한다.
