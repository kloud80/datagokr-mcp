summary_user: 부산광역시 북구 관내 도시재생 마을지기사무소에 설치된 무인택배보관함을 한 곳당 한 행으로 담은 위치 원장으로, 법정동·위치·보관기간·콜센터 번호를 담으며 파일 크기는 412바이트의 작은 CSV다. 북구 주민이 우리 동네 가까운 무인택배함이 어디에 있고 택배를 며칠까지 보관해 주는지, 문의는 어디로 하는지 확인하는 데 쓴다. 전역 조인 키가 없어 법정동 이름으로 읍면동 단위 행정구역 자료와 맞추거나, 송장 단위 택배·우편 종적 조회 도구와 나란히 생활물류 안내에 이어 쓴다.
description_portal: 이 데이터는 부산광역시 북구 관내 도시재생 마을지기사무소에 설치된 무인택배보관함 현황을 제공하는 공공데이터입니다. 위치, 보관기간, 관할지, 연락처 등의 항목으로 구성되어 있으며, 주민들이 택배를 안전하고 편리하게 수령할 수 있도록 돕는 생활밀착형 정보입니다. 시민들은 이 데이터를 통해 가까운 무인택배보관함 위치와 이용 가능 시간, 문의 연락처 등을 확인할 수 있어 생활 편의성이 향상됩니다. 해당 데이터는 정기적으로 갱신되어 최신성과 정확성을 유지하며, 지역 내 물류 편의 증진과 도시 생활 환경 개선에 기여할 수 있습니다.
