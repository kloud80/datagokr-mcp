summary_user: 경기도 버스 노선별로 현재 운행 중인 차량의 위치를 차량 단위로 담는 실시간 API로, 차량이 머문 정류소와 순번, 정류소 도착·출발·교차로 통과 상태, 저상·2층 등 차량 종류, 차내 혼잡도나 빈자리 수를 함께 준다. 이용자나 앱 개발자가 '지금 이 노선 버스들이 어느 정류소에 있고, 좌석버스에 빈자리가 남았나'를 확인하는 데 쓴다. 노선아이디(routeId)와 정류소아이디(stationId)는 경기도 버스 노선·정류소 정보와 같은 기관 코드로 이어 쓰지만, 실측상 전역 조인 키는 없어 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
limits: 전역 조인 키가 없어 국토부 TAGO 등 다른 체계의 노선·정류장 데이터와 바로 붙지 않는다. 혼잡도는 일반형 시내버스 등 일부 노선 유형에만, 빈자리 수는 좌석형·광역급행 등 일부 유형에만 제공되며, 정보가 없으면 -1로 나온다. 개발계정은 하루 1,000회로 호출이 제한된다.
