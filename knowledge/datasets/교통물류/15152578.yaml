summary_user: 2024년 경산시 전 지역에서 안전신문고(주민신고제)로 신고된 불법 주정차 단속 건을 한 건씩 담은 원천 자료로, 단속일시·단속 위치·위반 및 단속 구분과 경도·위도 좌표를 포함한다. 교통행정 담당자나 분석가가 경산시에서 주민신고 불법 주정차가 어느 지점·시간대에 몰리는지 파악해 단속·시설 개선 위치를 정할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 좌표(경도·위도)를 이용한 공간 결합이나 단속 위치 주소 문자열 매칭으로 잇는다.
description_portal: 본 데이터는 2024년 경산시 전 지역 안전신문고 신고 건 자료로 불법 주정차 단속정보를 제공하며, 개인정보는 포함되지 않습니다.제공하고 있는 데이터 내용은 안전신문고(주민신고제)로 신고된  위반 단속일시, 단속장소, 단속구분, 경도, 위도 데이터, 데이터 기준일자(제공일)를 포함하고 있습니다.데이터 형태는 엑셀(csv)파일로 제공됩니다.해당 데이터에 대하여 자세한 설명이 필요하신 경우 경산시청 교통행정과 교통지도팀(053-810-5263)으로 연락주시면 친절히 답해드리겠습니다.
