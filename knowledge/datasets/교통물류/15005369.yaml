summary_user: 경상남도 창녕군에 설치된 자전거도로를 노선(도로명)별로 기점·종점, 연장(km), 종류(겸용·우선·전용), 포장형태, 관리청과 함께 담은 소규모 목록 파일(CSV 약 1.8KB)이다. 창녕군 주민이나 자전거 여행자가 어느 읍면에 어떤 자전거 전용·겸용 도로가 몇 km 있는지 확인하거나, 분석가가 시군 간 자전거도로 연장·포장 상태를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 자전거도로 데이터와는 행정구역·도로명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 경상남도 창녕군에 설치되어 있는 자전거도로 현황입니다. 1. 행정구역(도, 군, 읍면 정보), 자전거 도로의 명칭, 구간(기점), 구간(종점), 연장(킬로미터), 자전거 도로의 종류(겸용, 우선, 전용), 포장형태(투수콘,  아스콘,  콘크리트, 흙포장), 관리청, 데이터 기준일 정보를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 15일이며, 해당 자료는 매년 1회 정기적으로 업데이트됩니다.3. 데이터에 대하여 추가 문의사항이 있는 경우에는 창녕군청 건설산업국 도시건축과 도시계획팀 055-530-1706으로 문의 주시기 바랍니다.
