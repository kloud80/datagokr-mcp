summary_user: 영천시 안전신문고 주민신고로 접수된 불법주정차 신고를 건별로 담은 파일로, 신고일시·신고위치 주소·과태료 부과 여부를 한 줄씩 기록한다. 시민이나 분석가가 영천시에서 어느 장소·시간대에 주정차 위반 신고가 많고 그중 실제 과태료로 이어진 비율이 어느 정도인지 살피는 데 쓴다. 전역 조인 키는 없어 신고위치 주소를 지오코딩하거나 행정동 이름으로 맞춰 단속카메라·어린이보호구역 같은 다른 규제 데이터와 이어 쓴다.
description_portal: 주민신고제인 안전신문고 앱에서 주정차 위반 차량을 신고하여 수용 결과를 받으면 해당 차량은 도로교통법에 해당되는 과태료가 부과될 수 있습니다. 도로교통법 제32조에 해당되는 항목을 주민신고제 운영사항으로 구간을 지정했습니다. 영천시의 경우 소화전, 교차로모퉁이 5m이내, 버스정류소, 횡단보도, 어린이보호구역, 인도, 안전지대 등으로 구성되어 있고 자세한 범위와 조건은 지자체마다 조금씩 다를 수 있습니다. 자세한 내용은 안전신문고 앱을 통해 사용방법을 참고하시거나 교통과 주정차 담당 주무관에게 질의하시면 안내받을 수 있습니다.
