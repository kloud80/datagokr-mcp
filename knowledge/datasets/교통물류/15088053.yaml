summary_user: 자동차 검사 때 측정한 전조등 결과를 검사 건별로 담은 샘플 파일(CSV, 약 21KB)로, 좌·우 전조등의 광도와 상·하·좌·우 조사 방향, 진폭 측정치와 합격 기준치(하한·상한), 설치높이, 육안검사 여부를 담는다. 분석가나 정책·기술 검토자가 "전조등 광도나 진폭이 기준치 대비 어느 정도 분포하고, 기준을 벗어나는 경우가 얼마나 되는가"를 살펴보는 데 쓴다. 실측 컬럼에 차량번호·검사번호 같은 조인 키가 없어 다른 자동차검사·등록 데이터와 행 단위로 이을 수 없고, 같은 기관의 검사 자료와는 항목 이름 수준에서만 대조한다.
limits: 샘플 파일이라 전국 전조등 검사 전체를 대표한다고 볼 수 없고, 차량·검사소·지역을 가리키는 키가 없어 차종별·지역별 분석이나 다른 데이터와의 결합이 되지 않는다. 범위는 전국이지만 비공간 자료라 지역 단위 집계도 하지 못한다.
