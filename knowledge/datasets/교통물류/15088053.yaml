description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 관리하는 자동차검사 자료 중 하나로, 자동차의 전조등(헤드라이트) 검사와 관련된 데이터를 수록한 샘플입니다. 해당 자료는 전조등의 위치(좌측/우측), 조사 유형(상향/하향), 법적 합격 기준치, 광도(cd), 설치 위치, 진폭(상하 높낮이) 측정치 등의 항목으로 구성되어 있으며, 전조등의 성능과 설치 기준의 적합 여부를 객관적으로 평가하는 데 활용됩니다. 이 데이터는 자동차의 야간 주행 안전성과 관련된 검사 기준을 분석하거나 정책 수립 및 기술 검토 시 참고할 수 있는 기초 자료로 활용됩니다.
