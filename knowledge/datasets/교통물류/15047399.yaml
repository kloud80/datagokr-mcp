summary_user: 서울시 관할 운송기관의 지하철 1~9호선 역별로 교통카드 승하차 인원을 월(USE_MM) 단위로 집계해, 새벽 4시부터 자정까지 시간대별 승차·하차 인원을 나눠 담는다. 상권 분석가나 창업 예정자가 특정 역 주변의 출퇴근·심야 시간대 유동인구가 얼마나 되는지 가늠하는 데 쓰며, 역별 시간대 승하차는 유동인구의 대체 지표로 쓰인다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 호선명·역명(STTN)을 이름으로 맞춰 연결해야 한다.
