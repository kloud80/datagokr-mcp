summary_user: 일반버스·도시철도를 이용한 승객의 출발지와 도착지를 읍면동 단위로 집계해 시간대·15분 단위별 통행인원수, 통행건수, 평균 통행시간·거리로 담는다. 검증 호출에서는 전국 범위 158행(2025-08-01 하루분)이 수신되었고, 분석가나 교통 담당자가 특정 지역 간 대중교통 이동량이 시간대별로 어떻게 다른지 알아볼 때 쓴다. 출발·도착 시군구코드(sgg_cd)가 조인 키이며, 이 코드는 다른 데이터에서 먼저 받아 파라미터로 넘겨야 하므로 시군구 코드 목록을 제공하는 데이터와 이어 쓴다.
limits: 필수 파라미터인 출발·도착 시군구코드는 다른 데이터의 코드라서 먼저 확보해야 하고, 일·월·연 단위 오퍼레이션 3개는 최소 파라미터로 응답이 없었다. 확인된 최신 행 날짜는 2025-08-01이지만 검증 호출 조건에 따른 것이라 데이터 자체의 최신성과 다를 수 있다.
