summary_user: 인천시 UTIS(도시교통정보시스템) 도로 구간(도로아이디·방향)별로 저장일시 기준 평균속도, 5·10·15분 전 속도, 통행시간, 소통상황 구분, 출발·도착 노드를 담은 파일 데이터이며, 포털 CSV 한 건(약 113KB)으로 받는다. 교통 분석가나 서비스 개발자가 '인천의 이 도로 구간은 지금 얼마나 막히고 통과에 몇 분 걸리는가'를 확인하거나, 파일을 시점별로 쌓아 상습 정체 구간을 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 도로·노드 아이디를 같은 기관(인천시 UTIS)의 링크·노드 정보와 이름·코드 매핑으로만 이어 쓴다.
description_portal: 인천광역시 UTIS 기반정보(도로정보)를 제공하는 데이터(도로아이디,방향,저장일시,패턴여부,도로평균속도,소통상황구분,5분전도로속도,10분전도로속도,15분전도로속도,통행시간,출발노드아이디,도착노드아이디 등)입니다.<활용 목적>이 자료는 UTIS 기반의 실시간 교통 예측, 최적 경로 탐색, 교통 소통 정보 제공 서비스 개발에 필수적입니다. 행정적으로는 신호 제어, 교통 통제, 우회 경로 안내 등 지능형 교통 관리를 위한 기초 자료로 활용되어 교통 효율성을 극대화하는 데 기여합니다.인천시 UTIS 교통 관리 시스템의 운영 기반 및 정보 제공 정확성 향상을 위한 핵심 기반 정보입니다.
