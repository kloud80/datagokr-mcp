description_portal: 특장차 산업은 다양한 분야에서 활발히 운영되고 있으며, 고소작업차는 그 중 하나로 활용되고 있습니다.최근에는 고소작업차에 대한 관심이 높아지면서, 한국교통안전공단에 자기인증 현황에 대한 정보를 요청하는 사례가 많아지고 있습니다. 이에 따라 공단에서는 관련 데이터를 제공하고 있습니다.고소작업차의 연도별 자기인증 현황은 한국교통안전공단 특장차인증센터에서 관리하고 있으며,2022년도와 2023년도 차량탑재형 고소작업차의 자기인증 건수를 포함하고 있습니다.이 데이터는 차량탑재형 고소작업차의 자기인증 현황 및 추이를 파악하기 위한 자료로 활용될 수 있습니다.*제공되는 데이터는 자기인증 건수에 대한 내용만 포함되어 있습니다. 보다 자세한 내용은 한국교통안전공단과의 협의가 필요할 수 있습니다.
