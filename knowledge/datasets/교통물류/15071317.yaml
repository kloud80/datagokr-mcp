description_portal: 서울시 관내 보도상영업시설물(가로판매대, 구두수선대) 운영 정보를 검색 할 수 있는 서비스입니다. 보도상영업시설물의 위치, 규격 등의 정보를 서비스합니다.(용어설명)“보도상영업시설물”은 인도(보도) 위에서 설치되어 영업에 사용되는 시설물을 뜻합니다. 보도를 원래 목적(보행 통행)이 아닌 영업 목적으로 점유하는 것이므로, 「도로법」상 ‘도로점용’의 일종제공부서는 서울특별시 재난안전실 도로기획관 보행환경개선과(02-2133-0442)입니다."해당 데이터의 원본시스템은 도로점용관리시스템 입니다."※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
