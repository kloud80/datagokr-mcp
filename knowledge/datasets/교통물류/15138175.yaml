summary_user: 파주시 버스정보시스템(BIS)이 관리하는 버스정류장을 한 행에 하나씩 담은 원장 파일로, 정류장 식별자·서비스 식별자·정류장명·위도·경도·중앙차로 운행 여부가 들어 있다. 사업자나 분석가가 '파주시 안 정류장이 어디에 몇 개 있고, 특정 지점 주변 정류장은 어디인가' 같은 위치 기반 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 노선·도착 데이터와는 정류장명이나 파주시 BIS 정류장 식별자를 직접 맞춰 보는 방식으로만 이어 쓰고, 좌표(위도·경도)로 지도·주소 데이터와 공간 결합한다.
limits: 범위가 파주시 한 시군구에 한정되며, 노선·실시간 도착·승하차 정보는 담지 않는다. 전국 공통 정류장 코드 같은 전역 조인 키가 없어 TAGO 등 다른 출처와 연결할 때 이름·코드 매핑이 따로 필요하다.
