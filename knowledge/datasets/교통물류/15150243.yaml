summary_user: 긴급리콜 대상 차량을 차대번호(VIN) 단위로 한 줄씩 담은 건별 원천 파일로, 제작사명·제작사코드, 리콜 시행일자, 리콜 사유, 제작사 전화번호, 사용 여부, 등록일시를 함께 담으며 범위는 전국이고 파일 크기는 약 48MB이다. 차량 소유주나 중고차 매매업자가 "이 차대번호의 차가 긴급리콜 대상인가, 어느 제작사에 연락해야 하나"를 확인하거나, 분석가가 제작사별·시기별 긴급리콜 규모를 집계하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 차량 데이터와는 차대번호나 제작사명·제작사코드를 직접 맞춰 이어 써야 한다.
description_portal: 이 데이터는 「자동차관리법」 및 관련 고시에 따라 한국교통안전공단(KOTSA)이 제작사와 국토교통부로부터 통보받아 관리하는 긴급리콜 대상 차량 정보를 바탕으로 정리된 샘플입니다. 주요 항목에는 리콜 대상 차량의 차대번호(VIN), 제작사, 생산연도, 리콜 사유 및 결함 부위, 리콜 시행일자 등이 포함됩니다. 이 자료는 긴급리콜 대상 차량의 개별 식별과 조치 이력을 확인하고, 제작사의 리콜 진행 현황을 관리·감독하거나 차량 소유주에게 신속하게 안내하기 위한 기초 데이터로 활용될 수 있습니다. 특히 차대번호를 통해 차량별 리콜 여부를 정확히 조회할 수 있어, 소비자 안전 확보와 리콜 제도 운영의 투명성을 높이는 데 중요한 근거 자료로 제공됩니다.
