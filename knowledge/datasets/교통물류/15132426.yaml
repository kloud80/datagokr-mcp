summary_user: 주차장법에 따라 기계식주차장치 보수업으로 등록한 업체 수를 시도·시군구별로 집계한 통계 파일로, 전국을 시군구 단위로 담는다. 주차설비 업계 분석가나 지자체 담당자가 '우리 지역에 등록된 기계식주차장치 보수업체가 몇 곳인가'를 지역별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도·시군구 코드(행정표준코드 준용)나 지역명을 매핑해 주차장정보표준데이터 등 지역 단위 자료와 붙여 쓴다.
description_portal: 한국교통안전공단에서 제공하는 정보입니다. 해당 정보는 주차장법에 의거하여 기계식주차장치 보수업을 등록한 업체에 대한 통계 자료를 제공합니다. 기계식주차장치 보수업의 인허가는 각 지방자치단체에서 담당하는 정보로, 해당 정보는 지방자치단체의 정보를 수집, 취합하여 제공합니다. 각 지방자치단체별(시도, 시군구)로 정보를 구분하여 제공하고 있습니다. 2023년도에 취합한 자료로 2022년 말 기준으로 정보를 제공합니다. 주소코드는 행정표준코드를 준용하니 참고하시기 바랍니다.
