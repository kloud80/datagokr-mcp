summary_user: 통영시 관내에서 운항하는 여객선을 선박 한 척 단위로 정리한 현황 파일로, 선사명·항로·선명·톤수·정원·속력·소요시간·운항거리와 데이터 기준일자를 담는다(CSV 약 1.4KB의 소규모 목록). 통영에서 섬으로 가려는 여행객이나 도서 주민이 '어느 항로에 어떤 배가 다니고, 몇 명이 타며, 얼마나 걸리는가'를 확인하거나, 행정·분석가가 관내 여객선 규모와 항로 구성을 살필 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 선사명·선명·항로 이름을 직접 맞춰 이어야 하며, 결항 여부는 해양교통안전공단(가보고싶은섬)의 운항상태·운항예보 같은 데이터와 이름으로 대조해 함께 쓴다.
limits: 선박·항로의 정적 제원 목록일 뿐 운항 스케줄·운임·실시간 결항 여부는 담지 않으므로, 당일 운항 확인에는 별도 운항상태 데이터가 필요하다. 표준 코드나 공통 키가 없어 다른 기관 데이터와 연결하려면 선박명·항로명 문자열 매칭에 의존해야 한다.
