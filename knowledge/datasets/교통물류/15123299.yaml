summary_user: 경기도 도로대장 전산화 시스템에서 관리하는 가로등 시설 정보를 노선번호·구간번호별로 담으며, 위치 시점·종점, 등기구 수량, 방향, 등주 형식·재질, 광원 종류·용량, 설치일자와 시점·종점 경위도 좌표를 포함한다. 도로 관리자나 분석가가 "경기도 도로 구간 중 수은램프 같은 구형 광원이 남아 있는 가로등은 어디이고 언제 설치됐나"를 파악해 교체·효율화 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 도로대장 시설 데이터와는 노선번호·구간번호 이름 매핑으로만 잇고, 표준노드링크(link_id)와는 시점·종점 좌표를 공간 대조해 연결해야 한다.
description_portal: "이 데이터는 도로대장전산화시스템에서 수집된 가로등 관련 정보로, 도로 구간별 가로등의 설치 위치, 조명 장치 특성, 방향, 조명 방식 등을 포함하고 있습니다. 주요 항목으로는 '노선번호', '구간번호', '위치-시점', '위치-종점', '등기구 수량', '위치-방향', '등주형식', '등주재질', '광원종류', '광원용량', '설치일자', '비고', '공간경도시점', '공간위도시점', '공간경도종점', '공간위도종점'이 있으며, 도로 조명 설비의 유지보수, 야간 교통 안전 확보, 에너지 효율성 개선을 위한 기초자료로 활용됩니다. 특히 광원종류(예: 고압나트륨램프, 수은램프) 및 등주재질(예: 스테인레스, 주물형)은 조명 품질과 수명에 영향을 주는 요소로, 시설 개선이나 효율화 계획 수립에 유용한 정보를 제공합니다."
