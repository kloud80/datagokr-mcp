summary_user: 궤도시설의 허가·승인을 맡는 관할기관(지자체 등)의 주소·담당과·전화번호와 한국교통안전공단에 안전검사를 위탁한 내용(위탁공고일·위탁기간), 그리고 관할 시도별 궤도시설 운영업체의 이름·허가년월일·용도·위치·주소·전화번호를 업체·기관 단위로 담은 전국 범위의 작은 파일(CSV 약 4KB)이다. 궤도시설 사업자나 지자체 담당자가 "우리 지역 삭도·궤도 시설은 어느 기관이 허가하고, 안전검사 위탁은 언제부터 언제까지인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명·업체명·주소 같은 이름 매핑으로 잇고, 기관법정동코드(INSTT_LEGALDONG_CODE)가 채워져 있다면 법정동 코드표로 행정구역 단위 연결을 시도할 수 있다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와 묶으려면 이름·주소 매핑에 의존해야 한다. 명세에 구인구직 관련 필드가 섞여 있어 실제 파일에 어떤 컬럼이 채워져 있는지 받아서 확인해야 한다.
