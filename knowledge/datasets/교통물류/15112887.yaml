summary_user: 경기도 내 터널을 한 행으로 하여 노선·위치(위경도)·길이·폭·높이·준공연도·관리기관 같은 기본 정보와 소화전·긴급전화·CCTV·비상조명·피난대피시설·제연설비 등 방재시설의 설치 여부 또는 개수를 담은 시도 단위 현황 자료다. 도로 안전 분석가나 지자체 담당자가 '고속국도와 지방도 중 어느 도로유형 터널에 비상조명·제연설비가 덜 갖춰졌는가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 터널명·노선명 이름 매칭이나 위경도 좌표로 이어야 하며, 터널·교량·지하차도 제공표준 데이터와 함께 보는 데 쓴다.
description_portal: 이 데이터는 경기도에 위치한 터널 방재시설 현황에 대한 자료로 터널 위치, 길이, 높이 등 터널에 대한 기본 정보와 소화전, 긴급전화, CCTV, 비상조명 등 터널에 설치된 방재시설에 대한 정보를 제공합니다.경기도 건설본부 및 시군, 수원·의정부 국토관리사무소, 한국도로공사에서 관리하는 경기도 내 터널의 방재시설 정보를 취합하여 제공하지만 경기도에서 관리하는 데이터(도로관리청의 값이 경기도인 데이터)만 갱신이 진행되오니 이용에 참고 부탁드립니다.방재시설이 미설치된 경우 공란으로 제공하며 설치 여부만 확인된 경우 "설치" 로 제공합니다.방재시설의  값이 숫자인 경우, 해당 터널에 설치된 시설물의 갯수를 의미합니다.이 데이터는 도로 교통 인프라의 안전성 점검 및 재난예방 체계 마련을 위한 기초 자료로 활용될 수 있으며, 도로유형별 방재설비 설치 현황을 통해 고속국도, 지방도 등에서의 설비 현황을 비교 분석할 수 있습니다.
