summary_user: 부산광역시 금정구 관내 불법주정차 무인단속카메라를 대수별로 담은 파일로, 관리번호·설치목적·설치년월·설치장소·지번주소·위경도·운용시간·관리부서를 한 행에 기록한다. 주민이나 운전자가 '우리 동네 어느 길에 주정차 단속카메라가 있고 몇 시에 운영되는가'를 확인할 때, 분석가가 금정구 단속 지점 분포를 지도로 볼 때 쓴다. 전국 공통 조인 키는 없어 다른 데이터와는 지번주소나 위경도 좌표로 공간 결합하거나 같은 금정구 기관 데이터와 이름으로 맞춰 잇는다.
limits: 전역 조인 키가 없어 다른 시군구·기관 데이터와 코드로 바로 연결되지 않고 주소·좌표·이름 매칭에 의존한다. 범위는 금정구 한 곳뿐이므로 부산 전체나 전국 현황은 다른 구·제공표준 데이터와 합쳐야 한다.
