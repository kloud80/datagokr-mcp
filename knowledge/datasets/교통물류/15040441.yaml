description_portal: 부산광역시 금정구에서는 불법주정차를 효과적으로 단속하기 위해 무인단속카메라를 설치해 운영하고 있습니다. 금정구 관내의 무인단속카메라 설치 위치와 설치년도, 운영 시간, 관리부서명, 관리번호 등 자세한 정보는 공공데이터파일에서 확인할 수 있습니다. 단속 기준과 방법은 금정구청 홈페이지 내 ‘불법주정차의 모든 것’ 메뉴에서 안내하고 있으며, 무인카메라는 주정차 위반 차량을 자동으로 촬영해 단속합니다. 자세한 내용은 금정구청-분야별정보-교통-불법주정차의 모든것 관련 페이지를 참고해주시기 바랍니다.
