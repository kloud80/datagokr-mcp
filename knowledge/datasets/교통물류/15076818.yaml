summary_user: 한국도로공사가 통행료징수시스템(TCS) 기록을 바탕으로 전국 고속도로 교통량을 일자·기준통행거리 구간·TCS 차종별로 집계해 담은 데이터다. 교통 분석가나 정책 담당자가 '장거리 통행에서 화물차 비중이 단거리보다 얼마나 높은가' 같은 통행거리별 차종 구성과 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크 등 공간 데이터와 직접 붙지 않고, 같은 기관 데이터와는 일자와 TCS 차종코드(tcsCarTypeCd) 같은 코드 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사가 제공하는 통행거리별 교통량 정보를 TCS(통행료징수시스템) 기준으로 집계하여 제공한 것이다.OpenAPI 형태로 제공되며 XML과 JSON 형식을 지원한다.제공 항목에는 일자, 기준통행거리명 및 코드, 교통량, TCS 차종구분명 및 코드, TCS 차종유형구분명 및 코드가 포함된다.이를 통해 통행거리에 따른 차종별 교통량 변화를 분석할 수 있다.데이터는 도로 통행료 징수 과정에서 자동 수집된 정보를 기반으로 하며, 전국 고속도로의 통행특성을 반영한다.이용자는 해당 데이터를 활용하여 교통 수요 예측, 차종별 이용행태 분석, 도로 운영 전략 수립 등에 참고할 수 있다.또한 장기적 분석을 통해 통행거리 변화에 따른 교통량 추이를 파악함으로써 효율적인 교통정책 수립과 인프라 투자 계획 마련에 기여할 수 있다.
