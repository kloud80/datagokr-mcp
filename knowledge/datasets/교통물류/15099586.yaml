summary_user: 서울특별시 안의 통행불편지역을 지역별 한 건씩 담은 공간정보로, 지역명·구분코드·조사일자·비고·시군구코드가 들어 있고 좌표계는 EPSG:5186, 인코딩은 windows-949입니다. 주민이나 도시계획·생활환경 분석가가 '우리 구에서 통행불편지역으로 조사된 곳은 어디이고 언제 조사됐나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군구코드(SGG_CD)나 지역명으로 서울시의 다른 행정구역·생활환경 공간정보에 코드 또는 이름을 맞춰 연결한다.
description_portal: '해당 데이터는 서울특별시 통행불편지역 공간정보 입니다.[좌표계] ESPG:5186 (GRS80 타원체의 한국 중부원점이며 Y 축으로 600000미터만큼 이동시킨 좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울특별시의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다. 문의 : 토지관리과 (02-2133-4672)'
