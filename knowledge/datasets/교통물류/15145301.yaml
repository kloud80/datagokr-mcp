description_portal: 이 정보는 ARTR(실시간 도로교통 분석 시스템)의 일별 교통 현황을 기록한 표준 테이블로, 측정일자, 노선명, 구간명, 통행량, 평균속도, 혼잡도, 소요시간, 차종별 통계 등으로 구성됩니다.이 정보는 도로 혼잡 완화 대책 수립, 교통량 변화 분석, 출퇴근 시간대 혼잡 구간 식별, 교통 정책 평가, 신호 체계 개선, 도로 용량 확충 계획, 교통사고 예방 대책 수립 등에 활용됩니다. 특히 차종별 통계와 평균속도 정보를 통해 물류 흐름 분석, 대중교통 운행 효율성 평가, 환경영향 분석, 탄소배출 저감 정책 설계 등에도 기초 자료로 활용됩니다.【해당 데이터는 일정 기간에 한하여 샘플데이터로 제공하고 있습니다. 추가 데이터를 원하시면 기관에 문의주시기 바랍니다.】
