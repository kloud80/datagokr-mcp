summary_user: 광양시 관내에 등록된 수소연료전지 자동차 대수를 시군구 단위로 집계한 소규모 파일(csv 137바이트)로, 비사업용 승용차와 사업용 승합차를 나눠 담는다. 지역 수소차 보급 현황을 보고 수소충전소 수요나 친환경 교통정책 기초자료를 마련하려는 지자체 담당자·분석가가 '광양시에 수소 승용차와 수소버스가 각각 몇 대 등록돼 있나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 시군구의 수소차 등록 현황이나 충전소 데이터와는 시도명·시군구명을 이름으로 맞춰 연결한다.
description_portal: 본 자료는 전라남도 광양시 관내에 등록된 수소연료전지 자동차의 등록 현황을 나타낸 데이터로, 친환경 교통수단의 보급 실태 및 보급 추세를 분석하는 데 활용됩니다.해당 자료는 시도명, 시군구명, 수소차량등록대수(승용)-비사업용, 수소차량등록대수(승합)-사업용, 데이터기준일 항목으로 구성되어 있으며, 개인 자가용 수소차량과 대중교통 또는 상업용으로 등록된 수소 승합차량을 구분하여 집계한 것이 특징입니다.이 데이터는 광양시를 포함한 전라남도 내 수소차 보급 현황, 친환경차 인프라 확대 필요성, 탄소중립 교통정책 수립 등을 위한 기초자료로 활용되며, 정부 및 지방자치단체의 수소충전소 설치계획 수립, 수소차 지원사업 대상지 선정, 미세먼지 감축 시뮬레이션 등의 기초 근거로도 활용됩니다.특히 광양시는 산업단지와 항만이 밀집된 지역으로 에너지 전환 및 청정 대중교통 도입에 대한 수요가 높은 지역이며, 이에 따라 수소차 보급과 운영현황을 정확히 파악하는 것은 매우 중요한 행정적 과제입니다. 본 데이터는 이러한 정책 수립을 위한 기반자료로써 정기적으로 갱신되며, 국민 누구나 활용할 수 있도록 개방되어 있습니다.
