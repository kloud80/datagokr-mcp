summary_user: 순천시 가로등을 한 개씩 위치(도로명·지번주소·위도·경도)와 설치연도, 관리기관 전화번호, CCTV·와이파이·GPS수신기·비콘·조명제어·위급상황 신고 가능 여부 같은 스마트 기능 탑재 여부와 함께 담은 건별 시설물 목록이다(CSV 약 4.7KB). 시민이나 앱 개발자가 "귀갓길 이 도로에 CCTV나 비상신고 기능이 있는 가로등이 있나"를 확인하거나, 분석가가 야간 보행 안전·범죄 예방 지도를 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 주소·도로명 문자열 매칭으로 공간 결합해 쓴다.
description_portal: 전라남도 순천시 가로등 현황은 시민의 야간 보행 안전과 스마트도시 환경 조성을 위해 개방되는 공공데이터입니다.이 데이터는 가로등의 정확한 위치(도로명, 소재지주소, 위·경도)와 설치연도, 신속한 민원 처리를 위한 관리기관 전화번호를 상세히 제공합니다.특히 단순한 조명 기능을 넘어 CCTV, 와이파이, GPS수신기, 비콘, 조명제어 여부 및 위급상황 신고 가능 여부 등 첨단 스마트 기능 탑재 현황까지 모두 포함하고 있습니다.이를 통해 안심 귀가 서비스 앱(App) 개발이나 범죄 예방 지도 제작 등 시민 편의와 안전을 높이는 다양한 생활 밀착형 서비스에 유용하게 활용될 수 있습니다.
