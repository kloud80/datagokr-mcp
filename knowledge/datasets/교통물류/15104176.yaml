summary_user: 인천광역시 버스정류소별로 설치된 버스도착안내단말기를 한 줄씩 담은 설치 현황 파일로, 설치지역·설치년도·정류소 번호와 이름·안내기유형을 기록한다. 시민이나 정책 담당자가 "우리 구·군의 어느 정류소에 도착안내기가 있고, 언제 어떤 유형으로 설치됐나"를 확인하거나 지역별 설치 분포와 연도별 추이를 볼 때 쓴다. 전역 조인 키가 없어 정류소 번호(정류소)나 정류소명을 인천 BIS·TAGO 정류장 원장과 이름·번호로 맞춰 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 정류장·노선 데이터와는 정류소 이름·번호 매핑으로만 연결되며, 좌표가 없어 바로 지도에 올릴 수 없다. 설치 현황만 담고 실시간 도착 정보는 없다.
