description_portal: 대한민국 철도의 노선분류에 관한 정보로 선분류명이나 선별코드 선의 이름 등을 담은 정보입니다.  대표적으로 경부선, 호남선, 전라선, 동해선 등 다양한 노선에 관한 정보입니다. 경부선은 공항철도, 경인선, 수인선, 안산선, 병점기지선, 부강화물선, 경부고속선, 경부일반선, 대구선, 동해남부선, 대구선, 동해남부선 등이 있고 호남선은 옥구선 군산화물선 강경선 호남선 장성화물선 대불선 광주선 호남고속선 등이 있으며 전라선은 북전주선 전라선 여천선 등이 있습니다.동해선은 동해선, 괴동선, 울산항선, 장생포선, 부전선 등이 있습니다. 세부내역은 파일을 다운로드 하셔서 참조 하시기 바랍니다.
