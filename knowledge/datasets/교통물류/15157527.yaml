description_portal: 경기도 수원시 관내 무인민원발급기 설치 장소를 제공하는 데이터입니다. 이를 통해 관공서에 직접 찾아가기 번거롭거나 정부24같은 온라인 시스템이 불가할 경우 무인민원발급기가 대체수단이 될 수 있습니다. 주민등록등본/초본, 가족관계증명서, 기본증명서, 지방세세목별과세증명서 등 다양한 민원서류를 제공 받을 수 있습니다. 다만 설치 장소나 운영시간에 따라 발급 가능한 문서가 다를 수 있으니 사전에 확인 필요합니다. 일부는 24시간 운영되는 곳도 있으니 비업무시간에도 발급이 가능하므로 데이터를 활용하여  주시기를 바랍니다.
