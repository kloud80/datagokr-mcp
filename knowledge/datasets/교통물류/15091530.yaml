summary_user: 서울교통공사 관할 역의 승하차 인원을 연도·호선·역·승하차 구분·권종(일반·청소년·어린이·우대권 등)별로 04시부터 다음날 03시까지 1시간 단위로 집계한 연간 파일로, 포털 설명상 2020년까지만 올라와 있습니다. 분석가나 상권을 보는 사업자가 '이 역은 출근 시간대에 내리는 사람이 많은가, 우대권 승객 비중은 어느 시간대에 높은가' 같은 유동인구 대체 질문에 쓴다. 전역 공통 조인 키는 없어 역명·역번호를 이름이나 같은 기관 코드로 맞춰 다른 역 데이터와 잇고, 2021년 이후는 같은 기관의 '1_8호선 역별 일별 시간대별 승객유형별 승하차인원 정보'로 이어 본다.
description_portal: '서울교통공사 연도별로 산정한 권종별 역별 시간대별 승하차 인원 정보입니다. 해당 데이터는  연도, 호선, 역변호, 역사명, 승하차구분, 할인종류, 시간대별 승하차 인원수를 포함하고 있습니다.(해당 데이터는 2020년까지 업로드 되어 있습니다. 이후 데이터는 일별로 산정한 역별 일별 시간대별 승객유형별 승하차인원 정보를 참조하여 주시기바랍니다. 감사합니다. (서울교통공사_1_8호선 역별 일별 시간대별 승객유형별 승하차인원 정보: https://www.data.go.kr/data/15099330/fileData.do) 권종별에는 일반, 청소년, 어린이, 우대권 등이 포함되어 있습니다. 1호선의 경우에는 청량리~서울역까지가 서울교통공사 구간이며, 4호선은 남태령 이후 구간은 한국철도공사, 불암산 이후는 남양주도시공사가 관할하고 있습니다. 마지막으로, 8호선의 경우에는 암사역사공원역까지가 서울교통공사 관할이며, 나머지 구간은 구리와 남양주 도시공사가 양분하여 관할하고 있습니다.'
