summary_user: 목포시가 2024년 안전신문고로 접수된 불법주정차 신고 가운데 과태료가 실제로 부과된 건만 골라, 신고 한 건당 한 행으로 신고일시·위치정보·과태료 부과 여부를 담은 건별 CSV 파일이다(약 2.2MB). 목포 시민이나 분석가가 '목포에서 불법주정차 신고가 어느 위치와 시간대에 몰리는가'를 확인하고 단속 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위치정보의 주소·지명 문자열을 매핑하거나 같은 기관 자료끼리만 연결한다.
