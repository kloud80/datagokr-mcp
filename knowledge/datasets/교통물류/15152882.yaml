description_portal: 본 데이터는 전라남도 목포시에서 관리하는 불법주정차 관련 신고 처리 및 과태료 부과 현황을 제공하는 자료입니다. 2024년 동안 안전신문고를 통해 접수된 불법주정차 신고 중 과태료가 실제로 부과된 건만 선별하여 공개하는 자료로 주요 제공 항목은 연번, 접수받은 신고의 일시와 위치정보, 기관의 확인 결과에 따른 과태료 부과 여부입니다. 과태료부과여부는 ‘Y’로만 표기되어 모든 건이 과태료 대상임을 의미합니다. 본 데이터는 지역 내 교통질서 개선과 안전한 보행환경 조성에 활용할 수 있으며, 정책수립 및 분석을 위한 근거자료로서의 신뢰성을 확보하고자 합니다. 또한 불법주정차 발생 지역의 시간대별 집중도를 파악하여 효율적인 단속 계획 수립에 도움을 주며, 시민 참여 기반의 교통관리 체계를 강화하는 데 기초자료로 활용될 수 있습니다.
