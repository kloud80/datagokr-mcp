summary_user: 경상남도 사천시에 있는 이사화물자동차운송주선사업자를 업체 한 곳당 한 행으로 담은 명단 파일로, 업체명·소재지·전화번호·업종·데이터기준일자가 들어 있다(약 1.6KB 규모의 작은 CSV). 사천에서 이사를 앞둔 주민이나 분석가가 "이 이사업체가 사천시 허가 현황에 올라 있는 주선사업자인가, 어디에 있고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없으므로, 전국화물자동차운송사업자표준데이터 같은 허가 원장과는 업체명·주소를 직접 맞춰 이어 쓴다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되며, 동명 업체는 오매칭될 수 있다. 포털 설명에 나온 대표자명·허가일자·허가번호는 실제 파일 컬럼에서 확인되지 않는다. 범위는 사천시 한 곳에 한정된다.
