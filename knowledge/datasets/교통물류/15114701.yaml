summary_user: 여수시에 등록된 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 파일(csv, 약 11KB)로, 업체명·면허 종류·직영과 위수탁을 나눈 차량 대수·주소·운영 여부가 들어 있다. 화주나 물류 사업자가 "여수에서 허가받아 영업 중인 일반화물 운송사가 어디이고 차량을 몇 대 갖고 있나"를 확인하거나, 분석가가 시내 운송사 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소로 맞춰 이어야 하며, 허가 여부의 기준은 전국화물자동차운송사업자표준데이터이므로 그 자료와 업체명으로 대조해 쓴다.
description_portal: 화물자동차 운수사업 공공데이터는 지역 내 일반화물자동차 운수사업자의 정보 현황을 담고 있는 자료로, 여수시가 육상 물류 운송 체계를 효율적으로 관리하고자 수집·제공하는 데이터입니다.이 데이터에는 업체명, 면허 종류, 등록 차량 대수, 주소, 운영 여부 등이 포함되며,  등록된 일반화물자동차 운수사업자의 정보를 통해 지역 내 물동량 운송의 분포와 운영 실태를 분석하고 교통 정책이나 산업 지원에 활용할 수 있으며,공공데이터는 일반 시민이나 기업에도 개방되어 있어, 창업, 시장 조사, 학술 연구 등 다양한 분야에서 활용할 수 있습니다.
