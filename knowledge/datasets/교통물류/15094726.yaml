summary_user: 제주특별자치도 관내 버스의 2019년 1월 1일부터 12월 31일까지 승차 인원을 날짜·노선(버스번호)·이용자 구분(일반·학생·장애인 등)별로 집계한 일별 통계다. 교통 분석가나 정책 담당자가 "2019년 제주에서 어느 노선이 주말과 평일에 승객이 얼마나 달랐나" 같은 노선별 수요 패턴과 노선 효율성을 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 제주 버스 노선·정류장 데이터와는 버스번호(bus_number)나 노선명을 이름 매핑으로 맞춰 잇는다.
description_portal: '이 데이터셋은 2019년 1월 1일부터 2019년 12월 31일까지 제주특별자치도 관내 버스의 일자별 승차 인원 수를 정리한 통계자료입니다. 각 기록은 날짜, 버스 노선명, 사용자 구분(예: 일반, 학생, 장애인 등) 등의 항목을 포함하며, 해당 일에 각 노선에서 실제 탑승한 승객 수 집계를 제공하므로 버스 이용량 패턴 및 수요 변화를 분석할 수 있습니다. 제공기관은 제주특별자치도, 관리 부서는 디지털혁신과이며 형식은 CSV입니다. 이 데이터는 대중교통 이용 현황 분석, 출퇴근‧주말‧관광객 이동 패턴 조사, 노선 효율성 평가, 교통 인프라 계획 및 정책 수립, 지역 교통 수요 예측 등에 유용합니다. 다만 대상 기간이 2019년 단일 연도로 한정되어 있어, 이후의 버스 이용 변화나 코로나19 등 외부 요인으로 인한 변동은 반영되어 있지 않을 수 있다는 한계가 있습니다.'
