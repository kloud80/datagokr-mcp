summary_user: 경기도 각 시군이 등록한 주정차 위반 단속 건의 단속일시, 단속장소(도로명·위치), 단속방법(이동형CCTV·고정형CCTV·단속차량 등)을 시군명·관리기관·집계년도와 함께 담는다. 연구자나 지자체 담당자가 '우리 시군에서 어느 장소·시간대에 어떤 방식의 단속이 많이 이뤄지는가'를 파악해 불법주정차 개선이나 단속 효율 평가에 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)이나 단속장소 이름으로 다른 시군 단위 교통·단속 자료와 이름 매칭해 이어 쓴다.
description_portal: 본 데이터는 경기도 내 각 시군이 수집하는 주정차위반 단속 위치 및 단속 방식을 기록한 자료입니다. 주요 항목으로 집계년도, 시군명, 단속일시정보, 단속장소, 단속방법 등이 포함됩니다. 단속일시는 단속이 수행된 날짜 및 시간이 포함되며, 단속장소는 위반이 발생한 도로명 또는 위치를 나타냅니다. 단속방법 항목에는 이동형CCTV, 고정형CCTV, 단속차량 등 단속장비 및 방법이 기록되어 있습니다. 본 데이터는 불법주정차 개선 정책 수립, 교통안전 대책 마련, 교통혼잡 해소 방안 연구, 단속효율성 평가 등에 활용될 수 있으며, 경기도 각 시군에서 등록하는 자료로 시군별 집계년도가 상이합니다.
