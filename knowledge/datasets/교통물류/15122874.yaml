description_portal: 'FIX 정보는 항공기의 항로 구성 및 비행 절차(SID, STAR 등) 설계에 활용되는 고정 항행 지점(Fix Point) 에 대한 자료로, 항공기의 비행 경로를 정의하고 위치를 파악하는 데 사용됩니다.해당 정보는 식별자, 좌표에 대한 정보를 제공하고 있습니다.식별자 : 해당 FIX 지점을 나타내는 고유 명칭(5자 영문자)입니다.좌표 : FIX 지점의 위치 정보를 의미하며, 위도와 경도 값으로 구성됩니다.좌표 표기 방식은 다음과 같습니다N (North): 북위를 의미하며, 위도 정보를 나타냅니다.E (East): 동경을 의미하며, 경도 정보를 나타냅니다.'
