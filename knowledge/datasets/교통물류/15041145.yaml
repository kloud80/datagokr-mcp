summary_user: 대전지하철1호선 각 역의 구조를 역 단위로 담은 파일로, 운영기관명·노선명·역명과 함께 지상·지하 구분과 역층 정보를 담는다(csv 약 3.6KB 규모의 소량 데이터). 이용객이나 교통 분석가가 '대전1호선 어느 역이 지하역이고 승강장이 몇 층에 있는가' 같은 역 구조 확인 질문에 쓴다. 전역 조인 키가 없어 다른 역 좌표·출입구·승하차 데이터와는 역명이나 노선명을 이름으로 맞춰 연결해야 한다.
description_portal: 대전교통공사에서 운영하는 대전지하철1호선의 역구조에 대한 데이터로, 철도운영기관명, 선명, 역명, 지상구분, 역층의 데이터가 있습니다.가장 일반적인 철도역의 형태. 맞이방도 선로도 지상에 위치하며, 보통 승강장은 지상 1층에 존재한다. 다른 플랫폼으로 넘어갈 때는 건널목, 육교 또는 지하도를 이용한다. 경의·중앙선 도농역, 서울 지하철 2호선 신답역, 수도권 전철 8호선 남위례역, 부산 도시철도 2호선의 부산대양산캠퍼스역, 두단식 승강장 구조의 경인선 인천역, 호남선 목포역, 전라선 여수엑스포역 등이 좋은 예. 건널목으로 다른 플랫폼으로 넘어갈 때 안전사고 위험이 있다는 단점이 있다. 그래서 밀양역, 김천역처럼 열차 운행이 빈번한 지상역의 경우 플랫폼으로 가는 육교나 지하도를 놓는다.
