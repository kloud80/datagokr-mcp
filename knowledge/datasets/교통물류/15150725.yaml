summary_user: 경찰청이 제공한 교통안전 위험요소 가운데 도로 폭이 좁아지는 지점을 전국 범위에서 건별로 담으며, 지번·도로명 주소, 위경도, 위험요소 분류(대·중·소), 기준일자, 상세 내용 등을 함께 싣는다. 운전자나 지자체 교통 담당자, 분석가가 '우리 지역 어디에서 도로 폭이 갑자기 좁아지는가'를 확인해 안전시설 보강이나 경로 안내에 반영할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소·좌표 기준의 매칭이나 같은 기관(행정안전부 재난안전데이터 공유플랫폼)의 다른 도로환경별 위험요소 데이터와 분류코드로 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다.
