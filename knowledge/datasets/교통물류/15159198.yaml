description_portal: 본 데이터는 한국도로공사에서 관리하는 재정 구간 고속도로의 2022년부터 2024년까지 월별 미납통행료 발생 및 수납 현황을 정리한 통계자료이다. 데이터는 해당 월에 발생한 미납 확정치와 더불어, 2025년 10월 31일 기준으로 산출된 누적 수납액 정보를 포함하고 있다. 수납액은 해당 월에 발생한 미납통행료 중 수납된 금액을 나타내며 발생 이후 지속적으로 누적되는 특성이 있어, 최근 발생분일수록 납부 기간이 짧아 수납률이 낮게 산출된다. 이는 고정된 수치가 아닌 상시 회수 과정을 통해 변동되는 수치이며, 미납금의 연도별 수납 효율을 입체적으로 분석하는 데 활용된다.단위는 천건, 억원이다. 본 자료를 통해 연도별 · 월별 미납 발생 추이와 수납 성과를 비교 분석함으로써 미납 관리 정책의 실효성을 검토하는 정책적 기초자료로 활용할 수 있다. 한국도로공사 및 관련 연구기관은 이를 활용하여 수납 전략을 고도화하고, 고객 맞춤형 납부 안내 서비스 개선 및 미래 교통 행정 시스템 설계 등 고속도로 운영 전반의 전략적 의사결정에 도움을 받을 수 있다.
