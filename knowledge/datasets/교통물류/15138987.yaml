summary_user: 광주광역시 남구에서 불법 주정차되거나 방치된 전동킥보드를 견인한 내역을 건별로 담은 파일(약 9KB CSV)로, 신고일자·주소·견인유형·조치일자를 기록한다. 구청이나 연구자가 남구 안에서 킥보드 방치 신고가 어느 주소에 몰리는지, 신고 후 조치까지 며칠 걸리는지를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 행정구역 이름을 맞춰 붙이거나, 같은 기관이 낸 킥보드 주차구역·자전거 관련 자료와 함께 보는 방식으로 이어 쓴다.
description_portal: 광주광역시 남구의 전동킥보드(개인형이동장치) 견인 현황(신고일자, 주소, 견인 유형, 조치일자)을 제공합니다. 해당 데이터는 광주광역시 남구청 교통지도과(☎062-607-4225)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다.※ 전동킥보드 견인 현황은 도로, 보행로, 지하철 출입구 등에서 불법 주정차되거나 방치된 전동킥보드를 수거·견인한 내역을 집계한 자료입니다. 개인형 이동수단 이용이 증가하면서 보행자 안전과 교통질서 문제가 대두되고 있으며, 이에 따라 지자체는 견인 조치와 과태료 부과를 병행하고 있습니다. 이 데이터는 견인 위치, 건수, 관리 기관 등의 정보를 제공하여 전동킥보드 운영 실태와 안전 관리 수준을 분석할 수 있습니다. 지자체는 이를 통해 보행자 안전을 강화하고, 방치 문제 해소 및 교통 정책 수립에 활용할 수 있습니다. 민간에서는 공유킥보드 운영사 관리 효율화, 내비게이션 서비스와 연계한 안전 구역 설정, 연구기관의 교통안전 정책 연구 등에 응용할 수 있습니다.
