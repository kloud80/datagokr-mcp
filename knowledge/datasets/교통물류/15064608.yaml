summary_user: 서울특별시 성동구에 설치된 바닥형 보행신호등을 시설물 한 곳당 한 행으로 담은 작은 현황 파일(약 1.2KB)로, 자치구·설치위치(도로명·주소·교차로명)·교차로 방향 수를 담는다. 구청 담당자나 보행안전 연구자가 '성동구 어느 교차로·횡단보도에 바닥형 보행신호등이 있고 몇 방향으로 작동하나'를 확인하거나 추가 설치 후보지를 검토할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 설치위치의 도로명·교차로명을 이름으로 맞추거나 주소를 지오코딩해 횡단보도·어린이보호구역·교통사고 데이터와 이어 쓴다.
limits: 범위가 성동구 한 시군구로 한정돼 다른 자치구나 서울 전체 비교에는 그대로 쓸 수 없다. 좌표나 표준 코드가 없어 위치 연계는 설치위치 문자열을 이름 매칭하거나 지오코딩해야 한다.
