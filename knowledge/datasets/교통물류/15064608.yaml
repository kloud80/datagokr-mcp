description_portal: 서울특별시 성동구 내에 설치된 바닥형 보행신호등의 설치 현황에 관한 데이터입니다. 이 데이터는 보행자의 안전을 위해 교차로, 횡단보도 등에 바닥에 설치된 신호등의 위치와 각 시설물마다 적용된 교차로 방향 수 등 2개 항목으로 구성되어 있습니다. 시설물 설치 위치 항목을 통해 신호등이 설치된 도로명, 주소, 또는 교차로명을 확인할 수 있으며, 교차로 방향 수는 해당 신호등이 작동하는 방향의 수를 명확하게 파악할 수 있습니다. 본 데이터는 교통약자 보행 안전 및 스마트시티 기반 교통 인프라 관리에 유용하며, 행정기관의 보행환경 개선 정책 수립, 스마트 교통 시설 설치계획, 시민의 안전한 보행 경로 안내 등에 활용할 수 있습니다. 또한 연구자와 기업이 교통안전 연구, 실증사업, 스마트 교통서비스 기획 등에도 활용 가능한 실용적인 기초정보입니다.
