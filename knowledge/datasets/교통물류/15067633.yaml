summary_user: 국내외에서 열리는 철도 관련 행사를 한 건씩 담은 파일로, 행사명·개최 국가(국내는 국가명 또는 지역명)·위치·주관기관·시작일과 종료일·국내외 구분을 기록하며 포털 설명상 2009년 4월 이후 행사로 구성된다. 철도 업계 종사자나 연구자가 '올해 해외에서 열리는 철도 박람회·학회는 언제 어디서 열리나'를 확인하거나, 연도별 국내외 철도 행사 개최 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주관기관명이나 국가명 같은 이름을 매핑해 느슨하게 잇는 수준이다.
description_portal: '철도 관련 행사정보를 제공합니다.국내 및 해외에서 개최되는 철도 관련 행사정보를 제공합니다.행사가 개최되는 국가 및 주관기관과 행사장의 위치 정보를 제공합니다.행사의 시작일 및 종료일 정보도 제공합니다.제공정보 중 국가명에는 국외의 경우 행사주체 국가 정보가 제공되고, 국내의 경우 국가명 또는 행사 지역명 정보가 제공됩니다.철도관련 국내외 행사정보는 2009년 4월이후 정보들로 구성되어 있습니다.(제공정보: 국가명,행사명,위치,주관기관명,행사시작일,행사종료일,행사순번,국내외구분)'
