summary_user: 경기도 이천시에 등록된 이사화물(이사물류) 업체를 업체 한 곳당 한 행으로 담은 행정 등록 원장 파일로, 업체명·인허가일자·영업상태·업종구분·도로명/지번주소·연락처를 포함하며 CSV 크기는 약 3.5KB로 소규모입니다. 이천시에서 이사를 앞둔 시민이 주변에 영업 중인 등록 이사업체를 찾거나, 분석가가 인허가일자로 지역 이사업체 등록 추이를 볼 때 쓴다. 전역 조인 키가 없어 업체명·주소를 매칭해 전국화물자동차운송사업자표준데이터 등 허가 원장과 대조하거나, 주소를 지오코딩해 지도에 얹어 쓴다.
limits: 사업자번호 같은 공통 식별 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭으로만 연결된다. 범위가 이천시 한 곳뿐이라 다른 시군과 비교하려면 지자체별 파일을 따로 모아야 하며, 화물운송 허가 여부의 기준 원장은 전국화물자동차운송사업자표준데이터이다.
