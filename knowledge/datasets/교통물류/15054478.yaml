description_portal: 한국교통안전공단에서는 화물자동차 운수사업을 효율적으로 관리하고 건전하게 육성하여 화물의 원활한 운송을 도모함으로써 공공복리의 증진에 기여함을 목적으로 한 화물자동차 운수사업법에 의거하여 화물운송종사 자격제도를 운영하고 있습니다. 해당 데이터는 한국교통안전공단에서 시행하는 화물운송종사자격시험의 연도별 자격시험 현황 자료입니다. 데이터는 행을 기준으로 하여 순서대로 연도, 면제자, 자격시험합격자, 체험교육이수자, 자격증발급자 현황으로 정리하였습니다.* 해당 데이터는 한국교통안전공단에서 별도로 제공하는 자료와 시점 차이 등으로 일부 차이가 발생할 수 있음을 안내 드립니다.
