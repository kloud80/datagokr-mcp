summary_user: 국토교통부가 원천인 전국 도로 돌발상황을 건별로 담으며, 도로유형·이벤트 유형과 세부유형·발생 및 종료 일시·위경도·도로명과 노선번호·방향·차단 방식과 차로·돌발 내용을 포함한다. 운전자나 물류 사업자는 지금 이 도로에 사고나 공사로 차로가 막혔는지 확인하는 데 쓰고, 분석가는 이력을 쌓아 상습 돌발·정체 구간을 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 링크 ID(LNK_ID)·도로명·위경도를 이름·코드 매핑해 같은 계열의 링크 속도·통행시간 데이터와 붙여 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 돌발상황 정보로 데이터 제공 원천기관은 국토교통부입니다. 도로유형, 이벤트유형, 발생일시, 위도, 경도, 도로명, 돌발내용 등을 제공하고 있습니다. 데이터의 갱신주기는 1시간입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
