summary_user: 인천공항 여객기의 출발·도착 운항 현황을 편 단위로 담은 API로, 조회일 기준 D-3~D+6일 범위에서 예정·변경일시, 탑승구, 수하물수취대, 터미널, 코드쉐어 여부, 운항현황(결항·지연 등)을 돌려준다. 여행객이나 서비스 개발자가 '오늘 내가 탈 편이 지연됐는지, 어느 터미널·탑승구로 가야 하는지'를 확인하는 데 쓴다. 전역 조인 키는 없고, 공항코드(airportCode)·편명(flightId)을 이름·코드로 맞춰 공항코드 정보나 다른 운항·항공통계 데이터와 이어 쓴다.
description_portal: 인천국제공항공사에서 제공하는 인천공항 여객기 운항정보입니다. 여객기의 출발/도착 정보 현황에 대한 데이터로 조회일 기준 D-3~D+6일간의 운항현황 데이터를 확인할 수 있습니다. 예정 시간 또는 변경시간을 기준으로 조회시간 구분코드를 지정하여 조회일자와 시간별로 조회조건 적용이 가능합니다. 공항코드, 편명 UNIQ 코드, 편명, 3자리, IATA 공항코드, 언어구분을 기준으로 조회조건을 제공합니다. 항공사, 공항명, 공항코드, 예정일시 및 변경일시, 코드쉐어 여부, 편명, 마스터편명, 탑승구, 터미널 구분,운항현황,항공기 운항 타입 등의 응답 데이터를 제공합니다. 개발 계정 일 500 트래픽,서비스 URL 및 상세 이용사례와 함께 운영계정 신청 시 일 100000 트래픽을 제공합니다.
team:
  dept: 인프라DX팀
services:
  - op: /getPassengerArrivalsDeOdp
    name: 여객기 운항 현황 정보(도착)
    endpoint: https://apis.data.go.kr/B551177/StatusOfPassengerFlightsDeOdp/getPassengerArrivalsDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: type
        required: false
        desc: 응답유형 [xml, json] default=xml
      - name: searchday
        required: false
        desc: 조회일자
      - name: from_time
        required: false
        desc: 조회시간(부터)
      - name: to_time
        required: false
        desc: 조회시간(까지)
      - name: airport_code
        required: false
        desc: 인천공항에 도착하는 출발지 공항 코드 IATA 공식 홈페이지 참조
      - name: f_id
        required: false
        desc: 편명UNIQ코드값
      - name: flight_id
        required: false
        desc: 편명
      - name: lang
        required: false
        desc: 언어구분 / 국문=K, 영문=E, 중문=C, 일문=J, default=K
      - name: inqtimechcd
        required: false
        desc: '조회시간구분코드(E: EstimatedDateTime / S: ScheduleDateTime)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getPassengerDeparturesDeOdp
    name: 여객기 운항 현황 정보(출발)
    endpoint: https://apis.data.go.kr/B551177/StatusOfPassengerFlightsDeOdp/getPassengerDeparturesDeOdp
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: type
        required: false
        example: xml
        desc: 응답유형 [xml, json] default=xml
      - name: searchday
        required: false
        example: '20230403'
        desc: 조회일자
      - name: from_time
        required: false
        example: '000'
        desc: 조회시간(부터)
      - name: to_time
        required: false
        example: '2400'
        desc: 조회시간(까지)
      - name: airport_code
        required: false
        example: MNL
        desc: 인천공항에서 출발하는 도착지 공항 코드 IATA 공식 홈페이지 참조
      - name: f_id
        required: false
        example: '2023032800000004944786'
        desc: 편명UNIQ코드값
      - name: flight_id
        required: false
        example: 5J187
        desc: 편명
      - name: lang
        required: false
        example: K
        desc: 언어구분 / 국문=K, 영문=E, 중문=C, 일문=J, default=K
      - name: inqtimechcd
        required: false
        example: E
        desc: '조회시간구분코드 (E: EstimatedDateTime / S: ScheduleDateTime)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
