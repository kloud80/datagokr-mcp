description_portal: 경기도 양주시에서 운영하는 버스정보안내시스템(BIS)의 버스정보 문자현황 데이터로, 버스 이용자에게 제공되는 안내 정보와 이를 지원하는 버스정보안내단말기 운영 현황을 관리하기 위한 기초자료입니다. 본데이터의 내용에는 업종, 업체명, 관할관청, 노선번호, 문자정송일, 문자정송시간, 메시지가 포함되어있습니다. 해당 데이터는 운영 상태 확인 및 교통법규 준수 등 안정적인 대중교통 정보 서비스를 제공하기 위한 목적으로 활용됩니다. 해당 데이터는 버스정보 서비스 운영 현황 파악, 정류장별 안내 서비스 관리, 시설물 유지보수 및 교통정보 서비스 개선을 위한 분석 자료로 활용할 수 있습니다.
