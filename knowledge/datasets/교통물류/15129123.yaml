description_portal: 비행장에 설치된 항공교통업무 통신시설에 대한 정보로 공항식별자, 공항명, 유형, 통신시설명, 내용에 대한 정보를 제공하고 있습니다.각 통신시설명은 다음과 같은 의미를 가집니다.TOWER관제탑을 의미하며, 활주로에서 항공기의 이륙 및 착륙을 직접 관제하는 통신시설입니다.GROUND활주로를 제외한 공항 내 지상 이동 구간에서 항공기의 이동을 관제합니다.DELIVERY항공기 출발 전, 비행계획 승인 및 출발 허가를 조종사에게 전달하는 통신입니다.APPROACH / ARRIVAL착륙을 위해 공항에 접근 중인 항공기를 관제하는 통신입니다. 계기접근 절차 시 사용됩니다.DEPARTURE이륙한 항공기가 터미널 공역을 벗어날 때까지의 구간을 관제합니다.GCA (Ground Controlled Approach)지상 관제사가 레이더를 이용해 항공기를 착륙까지 유도하는 시스템으로, 주로 군 공항에서 정밀접근 관제에 사용됩니다.
