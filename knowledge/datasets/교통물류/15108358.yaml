      - name: perPage
        required: false
        example: '10'
        desc: 한 페이지 결과 수
      - name: returnType
        required: false
        example: JSON
        desc: '응답의 데이터 타입을 선택할 수 있습니다. (기본값: JSON) XML형태의 응답결과를 얻기 위해서는 XML 값으로 설정'
      - name: cond[STATS_CRTR_YMD::LT]
        required: false
        example: '20220101'
        desc: 통계기준일자 - 미만 (미만/이하/초과/이상 조건 중 최소 한 개 이상 기입 필수)
      - name: cond[STATS_CRTR_YMD::LTE]
        required: false
        example: '20220101'
        desc: 통계기준일자 - 이하 (미만/이하/초과/이상 조건 중 최소 한 개 이상 기입 필수)
      - name: cond[STATS_CRTR_YMD::GT]
        required: false
        example: '20220101'
        desc: 통계기준일자 - 초과 (미만/이하/초과/이상 조건 중 최소 한 개 이상 기입 필수)
      - name: cond[STATS_CRTR_YMD::GTE]
        required: false
        example: '20220101'
        desc: 통계기준일자 - 이상 (미만/이하/초과/이상 조건 중 최소 한 개 이상 기입 필수)
    approval: auto
    traffic:
