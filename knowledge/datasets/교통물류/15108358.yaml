summary_user: SRT 승차권 진위확인 API가 일자·시간·조회 결과(승차권 상태)별로 몇 번 호출됐는지를 집계한 전국 단위 통계로, 건별 승차권 정보가 아니라 요청 건수(DMND_CNT)를 담는다. 철도 서비스 분석가가 "하루 중 어느 시간대에 승차권 진위확인 요청이 몰리고, 그중 비정상 결과는 얼마나 되는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자·시간 값이나 같은 기관(에스알)의 데이터로만 이어 붙인다.
description_portal: '1. 해당 데이터는 주식회사 에스알이 운영중인 고속철도 SRT 승차권 진위확인 API 서비스 이용에 대한 통계 데이터입니다.2. 상용통계 데이터는 일자 시간 승차권 상태를 기준으로 집계한 데이터입니다.* 데이터 형태 : JSON + XML* 에스알은 통계 데이터를 2022년 11월부터 제공드리고 있습니다.* 해당 데이터는 REST API로 제공됩니다. * 에스알은 해당 데이터를 무료로 제공드리고 있습니다. * 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.'
team:
  dept: 디지털혁신처
services:
  - op: /v1/validate_statistics
    name: SRT 승차권 확인데이터 유효확인 현황
    endpoint: https://apis.data.go.kr/B553912/api_statistics/v1/validate_statistics
    method: GET
