description_portal: 이 데이터는 해양수산부 선박대기오염물질관리시스템의 추천 사이트 정보를 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 추천 사이트 ID, 추천사이트명, 추천사이트 URL, 추천사이트 설명, 추천사이트 내용, 추천 사이트 여부 등의 항목으로 구성되어 있습니다.  본 데이터는 선박대기오염물질 관리와 관련된 온라인 정보나 서비스를 제공하는 사이트를 찾고자 할 때 참고자료로 활용될 수 있습니다. 해양수산부, 관련 기관 및 업계에서는 선박대기오염물질 저감과 관련된 정보망 구축이나 정책 자료 수집에 본 데이터를 사용할 수 있습니다. 또한 연구기관에서는 선박 배출가스 저감 대책 등 연구를 위한 정보 검토 시 데이터에 포함된 추천 사이트의 내용을 분석하는 데 활용할 수 있습니다.
