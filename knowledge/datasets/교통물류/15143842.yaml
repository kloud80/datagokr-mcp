description_portal: 서울교통공사 최단경로이동정보 API는 지하철 출발역과 도착역을 입력하면 최단 경로를 산출해주는 API입니다. 최소 시간, 최단 거리, 최소 환승 3가지 유형의 최단 경로를 탐색하며, 각 구간별 정차역, 역간 이동시간 및 이동 거리, 환승 여부 등의 정보를 제공합니다. 특정 경유역목록 또는 환승제외역목록 검색조건도 제공합니다. 검색조건 시의 날짜 및 시간은 경로를 계산할 기준일시를 의미하며, 이는 적합한 열차시간표를 제공하는데 사용되므로, 기준일시에 따라 다른 시간표가 적용될 수 있습니다. 최단경로에 사용되는 데이터는 수시로 갱신됩니다. '역값구분' 파라미터를 통해 역 정보 파라미터를 역명 또는 역코드로 조회할 수 있습니다.
