summary_user: 지하철 출발역과 도착역을 넣으면 최소 시간·최단 거리·최소 환승 기준의 최단 경로를 계산해 구간별 정차역, 역간 이동시간·거리, 환승 여부를 돌려주는 조회형 API로, 건별 원천 데이터가 아니라 요청마다 산출되는 결과이다. 승객이나 서비스 개발자가 "이 역에서 저 역까지 특정 시각 기준으로 가장 빨리 가려면 어디서 갈아타야 하나" 같은 질문에 쓰며, 경유역 지정이나 특정 역 환승 제외 조건도 건다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 역명(stnNm)과 출발·도착 호선명으로 역·노선 정보 데이터와 이름 매핑하거나 같은 기관 코드로만 연결한다.
limits: 다른 데이터와 바로 붙일 공통 키가 없어 역명·호선명 매핑이 필요하다. 개발계정은 하루 10,000회로 호출이 제한되며, 기준일시에 따라 다른 열차시간표가 적용되므로 같은 구간이라도 결과가 달라질 수 있다.
