summary_user: 한국교통안전공단 DRT지원시스템을 쓰는 지자체별로 2025년 한 해 동안 한 번이라도 로그인한 수요응답형 교통 기사(운전자) 수를 시도·시군구 단위로 집계한 파일(약 1.3KB 규모 CSV)이다. 교통 정책 담당자나 분석가가 '우리 지역 택시형·버스형 DRT에 실제로 운행하는 기사가 몇 명인가'를 다른 지자체와 비교할 때 쓴다. 전역 조인 키나 행정코드가 없으므로 같은 기관의 DRT 등록대수 현황 등과는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: 한국교통안전공단 수요응답형대중교통(DRT) 시스템에서 수집한 지자체별 시스템 이용 기사(운전자) 수 현황(2025.12 기준) 자료입니다. 시도, 시군구, 로그인 기사수로  컬럼명이 구성되어 있고, 연말 기준으로 한국교통안전공단의 DRT 시스템을 사용중인 지자체를 대상으로 2025년 한 해 동안 1회라도 시스템을 통해 로그인한 기사(운전자)의 수를 카운팅한 현황 자료입니다. DRT는 수요응답형교통수단을 의미하는데, 노선 버스 등의 대중교통이 잘 다니지 않는 곳에 거주하시는 분들이 필요에 따라 호출하여 이용할 수 있는 준대중교통의 역할을 수행하고 있습니다. 이 데이터에서 제공하는 자료는 농촌형 및 도시형 교통모델이 대부분이며, 호출과 자동배차가 이루어 지는 플랫폼형 DRT를 포함하지 않습니다. 데이터는 한국교통안전공단에서 운영 중인 DRT지원시스템을 사용하는 지자체의 현황자료만을 포함하고 있으며, 지자체가 보조금을 통해 운영하는 택시형 DRT 또는 버스형 DRT를 대상으로 하므로 해석상에 주의를 요합니다. 이용 기사의 수는  수요응답형대중교통시스템 등록대수와는 차이를 보이는데, 등록은 되어 있으나 로그인 기록이 없는 경우에는 실제 운행은 하지 않는다는 의미이기 때문입니다. 따라서 로그인 기록이 있는 경우 실제 이용 기사(또는 차량)의 수와 흡사하다고 볼 수 있습니다.(택시형 DRT는 이용 기사의 수와 실 운행 차량의 수가 같으나, 버스형 DRT는 이용 기사의 수와 실 운행 차량의 수가 동일하지 않음)
