description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)에서 선박용물건 형식승인 시 활용하기 위해 수집된 데이터입니다.본 데이터의 주요 내용은 선박용물건 및 해양오염방지설비의 품목코드, 품목명, 대분류코드, 중분류코드, 소분류코드 정보로 구성되어 있습니다.선박용물건 품목 코드는 선박 및 해양 관련 제품의 국제 표준 분류 코드인 HS 코드(Harmonized System Code)를 기반으로 합니다. 일반적으로 선박, 보트, 부표, 코퍼댐 등 수상 구조물이 포함되는 제89류에 속하며, 세부 품목에 따라 6자리 또는 그 이상의 코드로 분류됩니다.선박용물건 품목 코드 분류1. HS 코드- 국제적으로 통용되는 품목 분류 코드로, 6자리로 구성됩니다. 2. 국내 분류- HS 코드 6자리에 4자리를 추가하여 HSK 코드로 사용하며, 더욱 세분화된 품목 분류를 가능하게 합니다. 3. 선박 관련 분류- 제89류에는 선박, 보트, 부표, 코퍼댐 등이 포함되며, 어선, 요트 등은 각각 8902호, 8903호 등으로 세분화됩니다. 선박용물건 형식승인1. 선박 안전법- 선박용물건은 선박 안전법에 따라 형식 승인을 받아야 합니다. 2. 형식승인- 해양수산부장관이 정하는 기준에 따라 선박용물건의 형식승인 시험 및 검정을 받습니다. 3. 대상 물품- 선박용물건의 종류는 선박 안전법 시행규칙 별표 1에 규정되어 있습니다.4. 승인 정보형식 승인된 선박용 물품 정보는 공공데이터포털에서 확인할 수 있습니다.
