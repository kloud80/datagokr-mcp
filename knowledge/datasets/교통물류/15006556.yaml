summary_user: 광진구 내 공영주차장을 시설 한 곳당 한 행으로 담은 파일로, 운영개시일·행정동·시설명·도로명주소 위치·부지면적·주차면수(노상·노외·거주자·공영 구분)·급지·5분당/주간/야간/종일 주차요금을 포함한다(csv 약 3.6KB 규모의 소량 목록). 광진구 주민·방문객이 '우리 동네 공영주차장 위치와 요금이 얼마인가'를 확인하거나, 분석가가 행정동별 공영 주차면 공급 현황을 비교하는 데 쓴다. 전역 조인 키(주차장관리번호·좌표 등)가 없어 전국주차장정보표준데이터 등과는 시설명·주소·동명을 이름 매칭해 이어 써야 한다.
description_portal: 서울특별시 광진구_공영주차장 정보 데이터는 광진구 내 공영주차장의 운영 현황과 시설 정보를 제공하며, 효율적인 주차 관리와 교통 정책 수립을 위한 기초 자료로 활용됩니다. 주요 항목에는 운영개시일, 동명, 시설명, 위치, 부지면적, 주차요금, 운영방법, 급지 등이 포함됩니다. 운영개시일은 해당 주차장의 공식 개장 일자를 기록하여 운영 이력 관리에 활용되며, 동명은 주차장이 위치한 행정동을 나타냅니다. 시설명은 주차장의 명칭을 제공하고, 위치 항목은 도로명주소 기준으로 정확한 장소 확인을 지원합니다. 부지면적은 전체 주차장의 규모를 나타내며, 주차요금 항목은 이용 요율을 명시하여 주민과 방문객의 편의를 높입니다. 운영방법은 자치구 직영, 위탁 운영 등 관리 형태를 구분하고, 급지 항목은 주차요금 산정 및 행정구역별 정책 수립에 활용됩니다. 본 데이터는 주차 수급 분석, 교통 혼잡 완화, 스마트 주차 시스템 구축, 도시 계획 등 다양한 분야에서 유용한 공공데이터입니다.
