summary_user: 제주특별자치도 내 전기차 충전소별로 조사 연월, 이용 차량 대분류, 이용자 유형·연령대·성별, 대기 유형, 충전기 타입을 나눠 대기·충전 횟수(합계)와 대기·충전·회차 시간(평균)을 담은 월별 집계 파일(CSV 약 183KB)이다. 충전 인프라를 계획하는 분석가나 정책 담당자가 "제주에서 어느 충전소가 대기 시간이 길고, 어떤 이용자층이 오래 기다리는가"를 파악할 때 쓴다. 전역 조인 키는 없어서 충전소 아이디·이름이나 주소를 이름 매칭하는 방식으로만 충전소 위치·현황 데이터와 이어 쓴다.
description_portal: '제주특별자치도 내 월별전기자동차충전대기시간데이터(파일)를 제공합니다.항목: 전소 아이디, 충전소 이름, 충전소 주소, 이용 차량 대분류, 이용자 유형, 이용자 연령대 등* 제주특별자치도 내 주요 지역에서 전기차 충전기의 월별 대기 시간 및 충전 시간을 기록한 자료입니다.데이터를 통해 전기차가 충전소에서 얼마나 대기했는지, 충전했는지, 그리고 충전 완료 후 충전소를 떠날 때까지 걸린 시간을 확인할 수 있습니다. 충전 및 대기 횟수는 합계, 충전 및 대기 시간은 평균으로 계산되어 제공되므로, 충전소별 이용 현황과 이용 패턴을 종합적으로 분석할 수 있습니다.* 활용 분야 : 전기차 충전 인프라의 효율성 평가, 충전소 운영 최적화, 정책 수립 및 개선, 친환경 교통 전략 수립 등 다양한 분야에서 활용될 수 있습니다"'
