summary_user: 안양시 관내 버스정류소에 설치된 버스정보안내단말기(BIT)를 단말기 한 대씩 정류장명·위치(주소)·경위도 좌표와 함께 담은 시군구 단위 설치 현황 파일이다. 시민은 자주 쓰는 정류소에 도착정보 안내기가 있는지 확인하는 데 쓰고, 분석가는 BIT가 없는 정류소 분포를 찾아 추가 설치 우선순위를 정하는 데 쓴다. 전역 조인 키는 없어서 정류장아이디·정류장 명칭을 안양시나 경기도 버스정류소 원장과 맞춰 붙이거나 경위도 좌표로 공간 매칭해 쓴다.
description_portal: 안양시 관내 버스정류소에 설치된 버스정보안내단말기(BIT) 정류소명, 위치, 경위도 좌표 등 설치 현황 정보입니다.경기도 안양시 관내 버스정류소에 설치된 버스정보안내단말기(BIT)의 설치 현황을 제공합니다. 시민들에게 실시간 버스 운행 정보를 제공하여 대중교통 이용 편의 증진 및 효율적인 대중교통 시스템 운영을 지원하기 위해 수집되었습니다. 데이터 세부 항목으로는 각 BIT가 설치된 정류소명, 정확한 위치(주소), 경위도 좌표가 포함되어 있습니다. BIT의 분포를 파악할 수 있으며, 버스 이용객들은 원하는 정류소의 BIT 위치를 쉽게 확인할 수 있습니다. 대중교통 인프라 개선 계획 수립 및 스마트시티 구축을 위한 기초 자료로 삶의 질 향상에 기여할 것으로 기대됩니다.
