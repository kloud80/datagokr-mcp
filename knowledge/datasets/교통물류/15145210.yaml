summary_user: 한국도로공사가 관리하는 고속도로에서 2022년부터 발생한 졸음운전 교통사고를 사고 한 건씩 담은 파일(CSV, 약 33KB)로, 사고 연도·일자·시간, 노선명, 사고 발생 이정, 주행 방향, 사망·부상자 수가 들어 있다. 교통안전 담당자나 분석가가 '어느 고속도로 노선, 어느 이정 구간, 어느 시간대에 졸음운전 사고가 몰리는가'를 파악해 졸음쉼터·경고시설 배치나 예방 캠페인 시기를 정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명과 이정을 이름 기준으로 맞추거나 같은 한국도로공사의 노선·구간 자료와 대조해야 연결되고, 지역별 사고 다발지역 분석에는 도로교통공단(TAAS) 다발지역 자료를 함께 본다.
limits: 좌표나 행정구역 코드가 없는 비공간 데이터라 지도 위 위치나 시군구별 집계는 노선명·이정을 별도로 매핑해야 한다. 고속도로 졸음운전 사고만 담으므로 일반도로 사고나 전체 사고 대비 비율은 이 파일만으로 알 수 없다.
