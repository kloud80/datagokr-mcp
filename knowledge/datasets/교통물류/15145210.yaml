description_portal: 본 데이터는 한국도로공사에서 관리하는 2022년부터의 고속도로 졸음운전 교통사고 발생 현황을 제공한다. 데이터는 사고 발생 연도, 일자, 노선명, 사고 발생 이정, 주행 방향, 사망자 수, 부상자 수 등으로 구성되어 있으며, 졸음운전에 의한 사고의 시기별, 구간별, 노선별 특성을 분석할 수 있도록 체계적으로 정리되어 있다. 이를 통해 졸음운전 사고가 빈번히 발생하는 시간대 및 위치를 파악할 수 있어, 교통안전 인프라 개선, 예방 캠페인 실시, 정책 수립 등에 활용할 수 있다. 해당 정보는 공공기관뿐만 아니라 민간 기업, 연구기관 등에서도 교통안전 관련 정책 수립과 안전장치 설계에 참고자료로 유용하게 활용될 수 있다. 또한 데이터 기반의 졸음운전 예방정책 효과를 분석하는 데에도 기초자료로서 기능한다.
