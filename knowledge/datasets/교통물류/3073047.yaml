summary_user: 경기도 연천군에 등록된 건설기계를 불도저·굴삭기·로더·지게차·덤프트럭 등 기종별로 나누어 관용·자가용·영업용 보유 대수를 집계한 파일이며, 기종 한 줄당 용도별 대수와 기준일자를 담는다(파일 크기 377바이트의 소규모 집계표). 연천군의 건설장비 수급이나 재난 복구 장비 동원 계획을 세우는 공무원·분석가가 "연천군에 영업용 굴삭기·덤프트럭이 몇 대 있나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 시군의 같은 이름 데이터와는 건설기계명(기종 이름)을 맞춰 붙이고, 연천군의 다른 데이터와는 기관 단위로만 연결한다.
description_portal: 이 데이터는 건설기계의 종류별 보유 현황을 관용, 자가용, 영업용으로 구분하여 체계적으로 집계한 자료입니다. 불도저, 굴삭기, 로더, 지게차, 덤프트럭 등 주요 건설기계의 용도별 보유 대수를 포함하고 있어 건설업계 장비 운영 실태를 파악하고, 안전관리 및 도로 사용 정책, 환경 규제 수립 등 행정 업무에 활용할 수 있습니다. 또한 건설장비 수급계획, 재난 복구 및 도시 개발 계획 수립 시 기초 자료로 제공됩니다. 데이터는 정기적인 조사와 행정 검증을 통해 신뢰성을 확보하였으며, 향후 정책 평가 및 통계분석의 기초자료로 활용도가 높습니다.
