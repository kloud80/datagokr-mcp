summary_user: 제주시 관내 지역·읍면동별로 등록된 자동차 대수를 용도별(관용·자가용·영업용)로 나눠 담은 집계 파일이며, 파일 크기는 870바이트 정도의 작은 표입니다. 제주시 교통·주차 담당자나 분석가가 '어느 읍면동에 자가용·영업용 차량이 많이 몰려 있는가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지(읍면동) 이름을 맞춰 읍면동별 인구·주차장 현황 등과 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도 제주시 관내의 지역별 및 읍면동별 자동차 등록 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 차량관리과이며, 지역 내 자동차 보유 현황과 차량 유형별 분포를 파악할 수 있도록 구성되어 있습니다.데이터에는 제주시 각 지역 및 읍면동을 기준으로 등록된 자동차 대수 정보가 수록되어 있으며, 주요 항목은 소재지, 관용, 자가용, 영업용으로 이루어져 있습니다. 소재지 항목을 통해 지역별 구분 현황을 확인할 수 있고, 관용 항목에서는 행정기관 및 공공기관에서 운영하는 차량 대수를 파악할 수 있습니다. 자가용 항목은 개인 또는 일반 법인이 등록하여 사용하는 차량 규모를 보여주며, 영업용 항목은 운송, 여객, 물류 등 영업 목적에 활용되는 차량 현황을 확인할 수 있도록 합니다.이 데이터를 통해 제주시 내 지역별 자동차 등록 규모와 차량 용도별 분포 특성을 비교·분석할 수 있으며, 특정 읍면동의 차량 집중 현황이나 생활권별 교통 수요 특성을 파악하는 데 활용할 수 있습니다. 또한 지역 교통정책 수립, 주차 수요 검토, 도로 및 교통 인프라 계획, 생활권별 차량 이용 현황 분석 등 다양한 행정 및 정책 업무의 기초자료로 활용할 수 있습니다.
