summary_user: 전국 연안여객선을 한 척씩 행으로 두고 선박번호·여객선명·선사명·면허항로명·관할 지사와 선종·선적항·총톤수·진수일·여객정원·차량적재가능대수·항해속력·구명조끼(대·소) 수량을 담은 선박별 면허·제원 파일(CSV)이다. 섬 주민이나 여행객, 분석가가 '이 항로에는 어떤 선사의 몇 인승, 몇 톤급 배가 다니고 차를 몇 대 실을 수 있나', '오래된 선박이 투입된 항로는 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 운항상태·운항예보나 선박 등록 자료와는 선박명·선사명·항로명을 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 국내 여객선이 운항하는 항로별 면허 정보를 체계적으로 제공하는 자료이다. 한국해양교통안전공단이 관리하며, 각 여객선의 선박번호, 선박명, 선사명, 면허 항로명, 지사명, 선종, 선적항, 총톤수, 진수일자, 여객정원, 차량 최대 적재량, 항해속력, 구명조끼 수량 등의 항목으로 구성된다. 해당 정보는 여객선의 기본 제원과 운항 적합성 판단에 필요한 기초자료로 활용되며, 선박 안전관리, 정책 수립, 연구 분석, 민간 활용 등 다양한 목적으로 활용 가능하다. 또한 여객선의 수용 능력 및 안전장비 현황 등을 파악할 수 있어 국민이 이해하기 쉬운 형태로 제공된다. 데이터는 주기적으로 갱신되며, 공공데이터포털을 통해 개방된다.
