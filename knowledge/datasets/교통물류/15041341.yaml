description_portal: 부산교통공사에서 운영하는 노선의 수유실에 대한 데이터로, 철도운영기관명, 선명, 역명, 지상구분, 역층, 출구번호, 상세위치, 유아용침대개수, 소파개수, 전자렌지개수, 간이세면대개수, 전화번호의 데이터가 있습니다.수유공간에는 유아용침대, 소파, 기저귀교환대, 전자렌지 등 유아수유에 필요한 각종 비품이 구비되어 있습니다. 수유 뿐만 아니라 아기를 잠시 돌보아야 할 경우가 생겼을 때도 편리하게 이용할 수 있습니다.엄마와 아기, 수유부만 이용 가능한 수유실이 있고, 아빠를 포함한 육아 가족 이용가능 수유실이 구분되어 있어요. 각각 '모유수유/착유실', '가족수유실' 이라고 부릅니다. 아빠라고 수유실에 무조건 같이 들어갈 수 있는게 아니에요. 아무도 사용하고 있지 않다면 불편한 상황에 마주하지 않겠지만, 이용 주체를 인식하지 못하고 수유실을 이용한다면 곤란한 일을 마주할 수 있어요.일반적으로 수유실이라고 부르지만 이용주체와 이용 상황에 따라 구분된다는걸 많이 모르더라구요. 잘 모르는 경우라면 수유실 입구에 부착된 안내 표지판을 먼저 확인하고 이용하기를 권장합니다.
