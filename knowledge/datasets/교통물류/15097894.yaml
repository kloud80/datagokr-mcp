description_portal: 군포시 자동차 연료종류별 등록 현황에 대한 데이터입니다.사용본거지가 군포시로 등록되어 있는 자동차들을 연료종류별로 분류하고 연도별로 집계하여 제공합니다.연료의 종류는 휘발유, 경유, 엘피지, 전기, 하이브리드(휘발유_전기), 하이브리드(경유_전기), 하이브리드(LPG_전기), 수소, 압축천연가스(CNG), 기타연료 총 10가지로 분류되며, 각 연료종류별 등록 대수를 제공합니다.연도별 집계는 2005년부터  각 년도의 말일을 기준으로 하며, 말일 기준 군포시에 등록되어 있는 자동차의 등록 대수를 추출하여 자료를 제공합니다.
