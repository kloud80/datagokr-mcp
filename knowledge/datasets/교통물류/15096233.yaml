description_portal: 수원시 전기차충전소 최적 입지 도출 분석 결과 데이터로 최적입지의 우선순위, 시설유형, 시설명, 위치정보 등을 포함합니다. 본 데이터는 2021년 공공데이터 구축 가공 매칭사업을 통해 일회성으로 수집 집계된 데이터입니다. 특정 지역에 충전소가 몰리는 현상을 방지하고, 부족 지역을 보완할 수 있습니다. 전기차 충전소 위치 및 개수, 충전기 종류 등 정보관리 및 통신데이터(생활이동인구) 데이터 등 융합 구축하여 전기차 충전소 최적입지를 선정하였습니다. 공공데이터 개방을 통하여 친환경 자동차 확산 및 다양한 민간활용으로 지역경제 활성화에 기여하기를 바랍니다.
