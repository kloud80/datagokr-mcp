description_portal: 본 공공데이터는 국가철도공단 전자조달시스템에 등록된 PQ(Pre-Quailfication, 입찰참가자격사전심사) 담당자 목록입니다.안전한 철도건설을 위하여 각 공종분야(노반, 건축, 전력, 통신, 궤도 등)와 겁증대상(고속철도, 일반철도 등)을 구분하여 제공하고 있으며, 각 공종 및 검증대상별 검증부서와 검증위원 연락처 정보를 포함하고 있습니다.또한 사전심사영역을 공사계약과 용역계약 분야로 구분하여 제공하고 있어서, 입찰에 참여하는 기업이 PQ 심사 문의 및 절차 진행을 위해 정화갛고 신속하게 담당부서와 연락할 수 있도록 지원하며, 전자조달 업무의 효율성을 높이는 데 기여합니다.
