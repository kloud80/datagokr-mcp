        desc: '검색 항목 입력 시, 항목명중 일부가 대문자인 경우, 대문자 앞에는 언더바(_)를 반드시 입력해주세요. (예) 검색항목: 제공언어, 출력변수: lGubun → searchCondition=l_Gubun'
      - name: searchKeyword
        required: false
        example: K
        desc: 검색키워드를 입력하세요 (예) K 국문, E 영문, C 중문, J 일문, V 베트남어
    approval: auto
    traffic:
