summary_user: 서울교통공사가 운영하는 1~8호선과 9호선 2~3단계(언주~중앙보훈병원) 구간의 지하철역을 역 단위로 담은 역 목록 마스터로, 역코드·역명(국문·영문·중문·일문)·호선·외부코드(FR_CODE)를 담는다. 교통·부동산 분석가가 "이 역은 몇 호선이고 외부 역번호는 무엇인가"를 확인하거나, 역세권 판정·환승역 집계를 위해 역명과 노선을 표준화할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 승하차·혼잡·시간표 등 다른 철도 데이터와는 역명이나 같은 기관의 역코드(STATION_CD)·외부코드 매핑으로만 이어 쓴다.
limits: 역 좌표·주소 같은 공간 정보가 없는 비공간 목록이라 이것만으로 거리 기반 역세권 판정은 하지 못하고, 다른 기관 데이터와는 역명 매칭으로 연결해야 한다. 호출에는 포털 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 경로 파라미터로 넣어야 한다.
