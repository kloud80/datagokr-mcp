summary_user: 김해시 버스 정류소에 설치된 버스정보 안내 단말기(BIT)를 단말기별 한 행으로 담은 파일로, 읍면동·정류소명·정류소번호·설치형태·설치연도·위경도·지번주소가 들어 있다. 시민이나 교통 분석가가 '우리 동네 어느 정류장에 도착정보 안내기가 있고, 언제 설치됐나'를 확인하거나 BIT 미설치 정류장을 찾는 데 쓴다. 전역 조인 키는 없으므로 정류소명·정류소번호로 김해시 정류장 원장이나 BIS 도착정보와 맞추고, 위경도로 지도·인구 자료와 공간 결합해 쓴다.
description_portal: '경상남도 김해시 버스정보 안내 단말기(BIT) 설치 현황에 대한 데이터로 읍면동명(행정동), 정류소명(정류소 명칭), 정류소번호(코드번호 4자리), 형태(설치타입), 년도(설치연도), 위도(GPS 좌표), 경도(GPS 좌표), 주소(지번주소) 등의 항목을 제공합니다.연간 버스정보안내기 설치(신규 및 교체)한 현행화 자료입니다.해당 데이터의 데이터 기준일자는 2025년 10월 31일로, 연간 주기로 관리하고 있습니다.데이터 담당부서 : 김해시 대중교통과 교통정보팀(055-330-6773)[데이터 변경 내용]1. 신규 설치 장소2. 교체 설치 장소3. 위치 이동'
