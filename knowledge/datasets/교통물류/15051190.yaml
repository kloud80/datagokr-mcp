summary_user: 인천교통공사가 운영하는 도시철도(인천1호선·인천2호선·7호선 인천·부천구간)의 수송인원을 1999년부터 2024년까지 연도별로 집계해 담은 파일로, 연도마다 수송인원·승차인원·유입인원이 한 행에 들어 있다. 교통 분석가나 시민이 '인천 도시철도 이용객이 2호선 개통이나 7호선 연장 뒤 해마다 얼마나 늘었나' 같은 장기 추세를 확인할 때 쓴다. 실측 컬럼에 역·노선 코드 같은 조인 키가 없어서, 다른 연도별 교통·인구 통계와는 연도 값으로만 맞춰 쓴다.
description_portal: 인천교통공사에서 운영하는 도시철도의 1999년부터 2024년까지 연도별 수송인원 현황자료입니다. 해당 데이터는 연도, 수송인원, 승차인원, 유입인원 항목으로 구성되어있습니다.인천교통공사에서 운영하는 도시철도 노선은 인천1호선 33개역, 인천2호선 27개역, 7호선 인천·부천구간 11개역이 있습니다.2025년 6월 28일 개통한 인천1호선 연장 3개역(검단호수공원역, 신검단중앙역, 아라역)의 수송인원은 포함되지 않았습니다.2021년도 자료부터 7호선 석남연장구간(석남, 산곡) 2개역의 수송인원이 포함되어 있고 2022년 자료부터는 7호선 인천·부천구간(까치울역 ~ 부평구청역) 9개역의 수송인원이 포함되어있습니다.그리고 2016년 자료부터는 2호선 27개역의 수송인원이 포함되어있습니다.
