summary_user: 부산1호선 역사 안에 설치된 ATM을 한 대(한 곳)씩 기록한 목록으로, 역명·지상지하 구분·층·상세위치·금융기관명·이용시간·연락처를 담은 작은 CSV 파일(약 3.7KB)이다. 지하철 이용객이 '부산1호선 어느 역 몇 층에 어느 은행 ATM이 있고 몇 시까지 쓸 수 있나'를 확인하거나, 분석가가 역별 금융 편의시설 분포를 볼 때 쓴다. 공통 조인 키는 없어서, 다른 역 시설·승하차 데이터와는 선명과 역명(역명)을 이름으로 맞춰 이어 쓴다.
description_portal: 부산1호선의 ATM 위치에 대한 데이터로 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 상세위치, 금융기관명, 연락처의 데이터가 있습니다.현금 자동 입출금기(現金自動入出金機), 간단히 ATM(Automated Teller Machine)은 은행을 대신하여 입출금이나 송금, 기타 역무를 편리하게 처리할 수 있도록 설치되는 기기이다. 입출금 외의 부가적 서비스를 고루 갖춘 것을 디지털 키오스크(Digital Kiosk)라고도 부르나, 일상적으로는 모두 통틀어 ATM으로 불리는 편이다.은행원의 일부 업무를 대신할 수 있어 인건비를 줄일 수 있으며, 은행을 열지 않는 매일 밤부터 아침, 또는 주말의 빈 시간, 또는 해당 은행 점포가 없는 곳에서 은행 역할을 대신한다.
