description_portal: 경상남도 진주시 지능형교통체계(ITS) 시스템을 통해 수집된 교통 관련 정보를 기반으로 가공한 데이터입니다. 해당 데이터는 각 지점별 시설물ID를 중심으로 수집 수 합계, 평균 속도 등 주요 교통 지표를 포함하며, 시설물 이름과 위도·경도 정보를 함께 제공합니다. 이를 통해 도심 주요 지점의 교통 흐름 상태를 파악할 수 있으며, 교통 혼잡도 분석, 시설물 운영 효율화, 신호체계 개선, 교통정책 수립 등 다양한 행정적·연구적 활용이 가능합니다. 또한 지점별 변화 추세 분석 및 스마트 교통 서비스 개발에도 유용하게 사용할 수 있는 데이터입니다.
