summary_user: 진주시 ITS로 수집한 교통 정보를 시설물(검지 지점) 단위로 가공해 시설물 ID·이름, 수집 수 합계, 평균 속도, 위도·경도를 담은 시군구 범위의 지점별 집계 데이터다. 교통 분석가나 상권·입지를 검토하는 사업자가 '진주 시내 어느 지점의 통행이 많고 속도가 느린가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표로 공간 매칭하거나 시설물 이름을 매핑해 잇고, 같은 기관(진주시)의 다른 ITS 데이터와는 시설물 ID(fcltsId)로 연결한다.
limits: 실측 컬럼에서 법정동코드 같은 전역 조인 키가 확인되지 않아 타 기관 데이터와 바로 결합하기 어렵다. 개발계정은 일 100회 호출로 제한되며 serviceKey를 쿼리로 넘겨야 한다.
