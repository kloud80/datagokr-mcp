summary_user: 경기도 광주시에서 화물자동차 운송주선사업 허가를 받은 업체를 한 행에 한 곳씩 담은 목록으로, 업체명·업종구분·주소·영업상태·데이터기준일자를 담는다. 화물 운송을 맡기려는 기업이나 개인이 '이 주선업체가 광주시에서 허가를 받았고 지금 영업 중인가'를 확인하거나, 분석가가 시 안의 주선업체 분포를 살피는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명·주소로 맞춰 붙여야 하며, 전국 단위 확인은 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
description_portal: 본 데이터는 경기도 광주시에서 화물자동차 운송 주선 사업 허가를 받은 업체들의 현황 정보를 제공합니다. 화물자동차 운송 주선 사업은 화물 운송을 의뢰하는 화주와 운송 업체를 연결하여 물류 서비스를 중개하는 사업으로, 지역 물류 산업의 중요한 역할을 담당합니다. 업체명과 주소를 통해 광주시 내 허가 업체의 분포를 파악할 수 있으며, 업종구분은 사업의 세부 유형을 나타냅니다. 영업상태 항목은 해당 업체의 현재 운영 여부를 표시하여 실제 영업 중인 업체를 확인할 수 있습니다. 이를 통해 화물 운송이 필요한 기업 및 개인은 적법한 허가 업체를 선택하여 안전하고 신뢰할 수 있는 물류 서비스를 이용할 수 있습니다.
