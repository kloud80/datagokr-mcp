summary_user: 대구교통공사(대구도시철도)가 관리하는 역의 휴대폰 충전설비를 설비 위치별로 담은 파일 데이터로, 운영기관·노선·역명·층·상세위치·충전설비 수·이용요금·전화번호를 담는다. 지하철 이용객이 대구 도시철도 어느 역 몇 층에서 휴대폰을 충전할 수 있고 요금이 있는지 확인하거나, 분석가가 역별 편의시설 현황을 정리하는 데 쓴다. 전역 조인 키는 없어 다른 역·시설 데이터와는 노선명·역명 이름 매칭으로만 잇는다.
description_portal: 대구도시철도공사에서 관리하는 대구 소재 역들의 휴대폰충전설비에 대한 철도운영기관명,선명,역명,역층,상세위치,충전설비수,이용요금,전화번호입니다.지하철 5호선 새 전동차에는 휴대전화를 충전할 수 있는 무선 급속충전 설비도 설치됐다. 휠체어석이 위치한 2칸과 중앙 2칸에서 무선 급속 충전을 이용할 수 있다. 충전이 완료될 때까지는 약 2시간이 소요되지만, 배터리가 없어 막막한 상황에서는 지하철을 이용하는 잠깐의 시간을 이용해 요긴하게 사용될 것 같다.특히 서울 지하철 5~8호선 지하철역에서 휴대용 휴대폰 충전기를 무료로 빌려준다. 3시간까지 무료이고, 원하는 지하철역에서 반납할 수 있다.
