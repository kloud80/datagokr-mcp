summary_user: 한국철도공사 철도운영정보시스템의 화물 적하역 전용 작업선 기준 정보를 작업선 한 건 단위로 담은 전국 범위 파일(CSV, 약 36KB)로, 역명·작업선명과 전용선 길이·작업 거리·운임계산거리·할인할증 구분과 비율·폐선 여부를 포함한다. 화주나 물류 분석가가 "특정 역 전용선을 쓰면 화물 운임 계산에 어떤 거리 보정과 할인·할증이 붙는가"를 확인하거나 화물역 전용선 운영 현황을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 철도 역·시설 데이터와는 역명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 한국철도공사 철도운영정보시스템에서 화물의 적재 및 하역 작업이 이루어지는 전용 작업선에 대한 상세 기준 정보를 포함합니다. 각 레코드는 역 코드와 작업선 번호를 통해 특정 작업 공간을 식별하며, 작업선 명을 통해 선로의 용도를 명확히 합니다. 특히, "전용선 길이"와 "작업 거리"는 해당 선로의 물리적 제원을 나타내어 작업 효율성을 분석하는 기초 자료가 됩니다. 가장 중요한 정보 중 하나는 "운임 계산 거리"로, 이는 화물 운송 요금을 산정하는 데 있어 실제 주행 거리와는 별개로 작업선을 사용함에 따라 추가되거나 보정되는 거리를 의미합니다. 할인 할증 구분 코드는 해당 작업선의 이용 조건에 따라 운임이 가감되는 정책을 나타냅니다. 이 데이터는 철도 화물 물류의 최종 단계인 적하역 작업의 운영 환경을 분석하고, 화물 운임의 산정 기준을 투명하게 파악할 수 있도록 합니다. 또한, 화물역의 시설 이용 효율성 평가 및 전용선 운영 관리를 위한 정책 수립 등에 활용될 수 있습니다.
