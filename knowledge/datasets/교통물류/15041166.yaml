summary_user: 부산2호선 도시광역철도 역 43곳의 철도운영기관명, 선명, 역명, 경도·위도(십진수 도 단위 좌표)를 역 한 곳당 한 행으로 담은 CSV 파일 데이터이다. 부산2호선 역이 지도상 어디에 있는지 찾거나 역세권을 따지려는 분석가·사업자가 쓴다. 경도·위도(coord) 키로 다른 역·출입구·시설 좌표 데이터와 공간 결합해 이어 쓰며, 역 코드 같은 별도 식별 키는 필드에 없다.
description_portal: 부산2호선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 경도, 위도의 데이터가 포함된 파일데이터 입니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
