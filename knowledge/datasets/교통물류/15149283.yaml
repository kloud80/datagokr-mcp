description_portal: 한국교통안전공단은 위험물질운송차량을 실시간으로 관제하기 위해 위험물질운송안전관리시스템을 운영하고 있습니다. 이 시스템은 2018년 기준 전국의 3km 이상 장대터널 데이터를 체계적으로 확보하여, 위험물질운송차량의 안전한 운행과 효과적인 실시간 관제를 지원하고 있습니다. 장대터널 데이터는 고속도로에서 발생할 수 있는 사고에 신속히 대응할 수 있도록 하며, 국민 안전 확보와 재난 예방, 그리고 과학적이고 효율적인 교통정책 수립을 위한 핵심 기초자료로 활용되고 있습니다.
