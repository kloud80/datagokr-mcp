summary_user: 경기도 도로대장전산화시스템에 등록된 충격흡수시설을 시설 한 건씩 담은 원천 목록으로, 노선번호·구간번호·위치(시점·방향)·경위도 좌표와 종류(주행복귀형, 쿠션탱크, PE드럼 등)·제품명·등급·설치일자를 포함한다. 도로 안전 분석가나 도로관리 담당자가 경기도 내 어느 노선·구간에 어떤 등급의 충격흡수시설이 언제 설치됐는지 확인하고, 충돌 위험구간에 시설이 부족한 곳을 찾는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 노선번호·구간번호 같은 이름·코드 매핑이나 경위도 좌표(space_logt, space_lat)를 이용한 공간 매칭으로 이어 써야 하며, 표준노드링크의 링크 ID와 직접 연결되는 필드는 없다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템에 등록된 충격흡수시설의 설치 및 운영 정보를 담고 있으며, 차량 충돌 시 충격을 흡수하여 피해를 줄이기 위한 도로 안전시설의 설치 위치, 종류, 제품명, 등급, 설치일자 등을 포함하고 있습니다. 주요 항목은 '노선번호', '구간번호', '위치-시점', '위치-방향', '공간경도', '공간위도', '종류', '제품명', '등급', '설치일자', '비고'로 구성되어 있으며, 주행복귀형(충돌 후 원위치 회복 가능)이나 비규격 제품, 쿠션탱크시스템, PE드럼 등 다양한 형식의 충격흡수장치가 포함되어 있습니다. 본 자료는 교통사고 예방, 도로 안전성 향상, 충돌 위험구간 분석 및 재설계, 교통안전시설 유지보수 계획 등에 활용할 수 있습니다.
