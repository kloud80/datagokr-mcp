summary_user: 한국도로공사가 LCS(차로제어) 운영구간의 콘존(conzone) 구간별 교통량(대)·속도(km/h)·지정체 길이(km)를 기준일자·시간·방향(기점/종점)·차로유형별로 집계해 담은 전국 범위 OpenAPI 데이터다. 도로 운영 분석가나 물류·버스 운행 계획 담당자가 "특정 고속도로 노선의 어느 콘존에서 몇 시에 어떤 차로가 막히는가"를 확인하거나, 매일 쌓아 상습 정체 구간을 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 노선번호(routeNo)·콘존 ID(conzoneId)·VDS ID처럼 같은 한국도로공사 코드 체계를 쓰는 다른 도공 교통 데이터와 코드 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 LCS운영구간 교통량 정보로, 노선별 콘존 구간의 교통 흐름과 이용 현황을 OpenAPI 형태로 제공한다.제공 형식은 XML과 JSON이며, 출력 항목에는 기간, 시간, 콘존명과 ID, VDS_ID, 도로이정(km), 교통량(대), 속도(km/h), 차로유형구분명과 코드, 지정체길이(km), 노선번호, 기준일자, 방향(S:기점/E:종점), 집계시간단위구분코드가 포함된다.이 데이터는 구간별 교통량, 속도, 혼잡 정도를 분석하여 도로 운영 효율성을 높이는 데 유용하다.이를 통해 교통 패턴과 차로별 이용 특성, 지정체 발생 양상을 세부적으로 파악할 수 있다.또한 교통정책 수립, 혼잡 완화 대책, 물류와 버스 운행 계획, 도로 서비스 개선 등 다양한 분야에서 활용된다.
