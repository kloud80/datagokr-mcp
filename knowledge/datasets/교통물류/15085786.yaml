summary_user: 군산시에서 발생한 주정차 위반 과태료 부과 건을 위반일자·위반장소·단속구분(현장·CCTV 등)·최초 과태료 금액 단위로 기록한 파일 데이터이며, 활용신청 없이 약 5.8MB 분량의 CSV로 받는다. 시 교통 담당자나 분석가가 군산시 어느 장소·시기에 불법 주정차 단속이 몰리는지, 현장 단속과 CCTV 단속의 비중이 어떻게 다른지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위반장소 이름이나 자치단체명을 맞춰 연결해야 하며, 보호구역·단속카메라 같은 전국 표준 데이터와도 주소·명칭 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 군산시에서 발생한 주정차 위반에 따른 과태료 부과 현황을 기록한 자료로, 자치단체명, 위반일자, 위반장소, 단속 구분, 최초 과태료 금액 등의 항목으로 구성되어 있다. 본 자료는 군산시 내 불법 주정차 단속 실태를 파악하고 교통질서 유지 및 도로 안전 확보를 위한 정책 수립에 활용된다. 위반일자와 장소 정보는 특정 시기나 지역에서의 위반 빈도 및 패턴을 분석하는 데 도움이 되며, 단속 구분은 현장 단속, CCTV 단속 등 집행 방식의 구분을 통해 단속 효과성을 비교 분석할 수 있다. 또한 최초 과태료 금액은 위반의 심각성과 유형에 따른 행정처분 강도를 확인할 수 있는 지표로 기능하며, 이를 통해 시민들의 교통법규 준수를 유도하고 도심 교통 환경 개선에 기여할 수 있다.
