summary_user: 여수시에서 시내버스 교통카드를 충전할 수 있는 가맹점을 한 곳당 한 행으로 정리한 건별 목록으로, 가맹점명·읍면동·주소를 담고 시군구 범위의 CSV 파일(약 51KB)로 내려받는다. 여수 시민이나 관광객이 '내 주변 읍면동에서 교통카드를 어디서 충전하나'를 찾거나, 분석가가 읍면동별 충전 인프라 분포를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 읍면동 이름이나 주소를 지오코딩·문자열 매칭해 정류장 위치 등과 맞대어 쓴다.
description_portal: 전라남도 여수시에서 운영되는 시내버스 교통카드 충전소 가맹점 현황을 제공하는 공공데이터입니다. 본 자료는 시민과 관광객이 교통카드를 편리하게 충전할 수 있도록 충전 가능 가맹점의 위치 정보를 체계적으로 정리한 데이터로, 충전소의 명칭과 소재지, 상세 주소 정보를 포함하고 있습니다. 이를 통해 이용자는 주변의 교통카드 충전 가능 장소를 쉽게 확인할 수 있으며, 교통카드 이용 환경 분석, 충전소 접근성 평가, 대중교통 편의시설 분포 파악 등의 목적으로 활용할 수 있습니다. 또한 여수시 내 교통카드 충전 서비스 제공 현황을 파악하고 지역별 충전 인프라 분포를 분석하는 기초자료로 활용 가능한 데이터입니다.
