summary_user: 경기도 안양시 공간정보시스템에서 관리하는 횡단보도를 관리번호 기준 한 건씩 담은 파일로, 폭·길이·관할지역·위도·경도와 보도턱 낮춤 여부, 점자블록 유무를 기록한다. 보행환경 개선을 검토하는 시·구 담당자나 분석가가 '안양시에서 보도턱이 낮춰지지 않았거나 점자블록이 없는 횡단보도는 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 위도·경도로 공간 결합하거나 관할지역 이름을 매핑해 이어 쓴다.
description_portal: 본 데이터는 경기도 안양시 관내에 설치된 횡단보도의 위치 및 특성을 관리하기 위해 구축된 자료입니다. 각 횡단보도의 고유 관리번호를 기준으로 폭, 길이, 관할 행정구역 등의 정보를 포함하고 있으며, 보행자 안전 확보 및 도로교통 체계의 효율적 운영을 위한 기초자료로 활용될 수 있습니다. 해당 정보는 생활권 내 보행환경 개선, 교통사고 저감, 도시 보행정책 수립 등 다양한 행정적 수요에 대응할 수 있도록 구성되어 있습니다. 해당 데이터는 안양시 공간정보시스템을 기반으로 수집·정리되었으며, 시스템의 상황에 따라 데이터 업데이트가 이루어지지 않을 수 있습니다.
