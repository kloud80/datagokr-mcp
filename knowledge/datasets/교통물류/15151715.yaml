summary_user: 전 세계 항만을 위치(항만) 한 건 단위로 정리한 원장 파일로, 위치코드·유엔위치코드·나라와 대륙 이름·행정구역·위경도·내륙 여부·기항 항만 여부를 담으며 약 1.5MB zip으로 제공된다. 수출입 화주나 물류 분석가가 '거래 상대 선사가 기항하는 항만이 어느 나라·대륙에 있고 UN/LOCODE는 무엇인가'를 확인하거나 항만을 국가별로 분류할 때 쓴다. 실측상 전역 조인 키는 없으므로, 유엔위치코드(UN/LOCODE)나 나라코드를 기준으로 입출항·항만 물류 데이터와 코드를 매핑해 잇는다.
description_portal: '수출입 물류 공공·민간 데이터 공유 플랫폼에서 제공 중인 항만 정보 데이터입니다.1. 개요: 수출입 물류 공공·민간 데이터 공유 플랫폼의 선사-항만 운영 정보 서비스 기능 제공을 위해 보유중인 정보입니다.2. 데이터 내역: 전 세계 항만을 대상으로 하여 각 국가별 항만 이름, 위치 코드, 나라 코드, 행정구역 코드, 유엔위치 코드 등으로 이루어져 있습니다.3. 기타사항: 국가별 항만 분류를 위해 사용 가능한 수준으로 구성4. 유의사항: 일부 누락된 항만 정보가 있을 수 있습니다. 활용 시 유의하여 주시기 바랍니다.'
