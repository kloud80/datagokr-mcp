summary_user: 경기도 부천시 관내 전문건설업체를 업체별 한 행으로 담은 파일로, 업체명·업종(지반조성·포장, 실내건축, 철근·콘크리트, 상·하수도설비 등)·도로명 소재지를 담는다. 발주처나 시공사가 "부천시에서 포장공사나 방수공사를 하는 전문건설업체는 어디에 있나"를 찾거나, 분석가가 업종별 업체 분포를 동네 단위로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명 이름 매칭이나 소재지 주소를 지오코딩해 행정동·좌표 기준으로 붙여 쓴다.
limits: 사업자번호 같은 공통 식별자가 없어 다른 건설업·사업자 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 부천시 한 곳에 한정되며, 명세상 갱신은 연간 또는 이벤트 단위라 최신 등록·폐업이 바로 반영되지 않을 수 있다.
