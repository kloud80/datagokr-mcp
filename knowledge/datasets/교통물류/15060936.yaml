summary_user: 대구광역시 시내버스의 정류소별·노선별·진행방향별로 시간표유형, 첫차·막차 시각, 운행횟수, 평균배차간격을 한 행씩 담은 CSV 파일(약 2.5MB)로, 포털 설명상 2025년 11월 14일 기준 시점 자료다. 대구 시민이나 교통 분석가가 '우리 동네 정류소에 서는 노선은 몇 분마다 오고 첫차·막차는 언제인가'를 확인하거나, 정류소별 대기시간과 배차 수준을 비교하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어, 대구시 정류소ID(정류소ID)나 노선명으로 대구시 정류소·노선 자료, BIS 도착정보와 맞춰 이어 써야 한다.
description_portal: 2025년 11월 14일 기준 대구광역시 내 운행 중인 시내버스의 정류소별 노선별 평균배차간격 자료입니다. 정류소ID, 정류소명, 노선, 진행방향, 시간표유형, 첫차, 막차, 운행횟수, 평균배차간격 등의 정보를 포함하는 CSV 파일형식의 자료입니다. 이를 통해 각 정류소에서 운행되는 버스 노선의 배차 간격을 확인할 수 있어 대중교통 운영 효율성 분석, 이용자 대기시간 예측 등에 활용할 수 있습니다. 추가적으로 궁금한 사항이나 의견이 있으시면 대구광역시 교통정보운영과 교통운영팀(☎053-803-6861)으로 연락해주시기 바랍니다.
