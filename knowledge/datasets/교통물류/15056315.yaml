summary_user: 제주특별자치도 안에 있는 자동차등록번호판 발급대행업체를 업체 한 곳당 한 행으로 담은 목록이며, 업체명·등록일·소재지 주소·연락처·팩스번호와 데이터기준일자가 들어 있다. 제주에서 차를 등록하거나 번호판을 바꾸려는 도민이나 사업자가 가까운 번호판 발급대행소의 위치와 연락처를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 보는 방식으로만 이을 수 있고, 자동차 등록·검사·정비업 같은 같은 세부 부문 자료와 나란히 놓고 볼 때 보조 자료로 쓴다.
description_portal: '제주특별자치도 내에 소재하고 있는 자동차등록번호판 발급대행자 데이터를 제공합니다.항목: 업체명, 등록일, 소재지, 연락처 등*「자동차등록령」- 자동차 등록번호는 법 제3조에 따른 자동차의 종류와 자동차의 용도(자동차운수사업용인 것과 자동차운수사업용이 아닌 것으로 구분)에 따라 국토교통부장관이 정하여 고시하는 기준에 의하여 각각 순서대로 부여함*제주특별자치도 자동차등록번호판발급대행자심사위원회의 심의를 거쳐 등록번호판발급대행자를 지정하고 등록번호판발급대행자지정서를 발급함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1498850'
