summary_user: 부산광역시 해운대구 관내에 설치된 CCTV를 한 대씩 설치지역, 주소, 관리기관, 담당자 전화번호, 위도·경도로 담은 건별 위치 목록이며, 범위는 해운대구 한 개 시군구입니다. 주민이나 분석가가 '우리 동네 어디에 CCTV가 있고 누가 관리하는가'를 확인하거나, 지도 위에 CCTV 위치를 찍어 방범·교통 시설 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 매칭하거나 관리기관 이름으로만 이어 쓴다.
limits: 영상이나 실시간 소통 정보가 아니라 설치 위치·관리 정보만 담고, 해운대구 밖의 CCTV는 포함하지 않는다. 공통 코드 키가 없어 다른 구·기관 CCTV 데이터와 합칠 때는 이름·주소·좌표 매핑이 필요하다. 개발계정은 하루 10,000회 호출 제한이 있다.
