description_portal: 서울시 거주자우선주차정보 데이터는 서울 시민을 대상으로 운영되는 거주자우선주차 구획별 위치, 이용 조건, 요금 정보를 제공하는 자료입니다. 거주자우선주차구획번호, 위도·경도, 구역명, 도로명주소·지번주소를 통해 각 주차 구획의 정확한 위치를 확인할 수 있습니다. 운영형태, 사용시간대정보, 사용기간은 주간·야간, 시간제·정기 등 이용 가능 형태와 기간을 보여줍니다. 이용요금, 할인정보, 결제방법, 환불안내는 주차비 부과 방식과 감면, 결제 수단, 환불 기준을 알려주는 항목입니다. 정기접수 시작·종료일자, 신청방법, 신청서류는 거주자우선주차 신청 절차와 준비사항을 안내하며, 관리기관명과 전화번호는 이용 문의 및 민원 접수 창구 역할을 합니다. 데이터기준일자와 작업일시는 정보의 최신성 및 관리 이력을 파악하는 데 활용됩니다.
