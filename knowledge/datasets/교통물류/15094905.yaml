summary_user: 서울시 행정동(읍면동) 단위로 연료 종류별 자동차 등록 대수를 기준연월(STATS_YM)마다 집계한 표로, 시도·시군구·행정동 코드와 이름, 연료명, 세부 구분별 합계와 총계를 담는다. 동네별 전기차·수소차·경유차 보급 정도를 비교하거나 충전소 입지, 노후 경유차 관리 대상 지역을 가늠하려는 분석가와 행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 시도·시군구·동 코드를 매핑하거나 같은 서울시 자료의 코드로만 이어 쓴다.
description_portal: 서울시 행정동별 연료별 자동차 등록현황입니다. 출처는 국토교통부 산하 한국교통안전공단에서 운영하는 자동차관리정보시스템입니다. 자동차관리정보시스템측 문의 결과 법정동 기준과는 다르게 행정동 기준은 코드 입력이 정확하게 되어있지 않아 등록현황차이(데이터 중 경기도 포함, 차량대수)가 있을 수 있다고 전달 받았으니 참고해주시기 바랍니다.제공부서는 서울특별시 교통실 교통기획관 미래첨단교통과(02-2133-4958) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
