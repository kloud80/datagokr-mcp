description_portal: 세종도시교통공사에서 운영하고 있는 버스노선의 월별 수송인원에 대한 데이터입니다. 연번, 수송연월, 수송인원수로 구분하였으며, 해당 자료는 2025년 6월 30일을 기준으로 작성하였습니다. 현재 세종도시교통공사에서 운영중인 노선은 바로타(BRT, 간선급행버스체계, 노선번호 B0, B2, B4, B5, B6), 시내버스(광역 노선번호 1004, 1005, 신도심 노선번호 203, 205, 221, 52, 53, 61, 611, 조치원,부강,신탄진,병천 노선번호 11, 12, 13, 300, 910, 18), 마을버스(금남면, 연기면, 연동.부강면, 연서면, 전동면, 소정.전의면), 두루타(DRT, 수요응답형교통체계, 읍면지역 운행)로 구분됩니다. 세종도시교통공사에서 등록한 연도별 수송인원 자료를 함께 참고하시기 바랍니다.
