description_portal: 광주광역시 남구 과속방지턱 현황 및 정보(설치장소, 재료, 높이, 폭, 연장 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 건설과(☎062-607-4023)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 과속방지턱은 차량의 속도를 줄이고 보행자 안전을 확보하기 위해 설치되는 도로 안전시설입니다. 특히 학교, 어린이보호구역, 주택가, 교차로 등 보행자 밀집 지역에 배치되어 교통사고를 예방합니다. 해당 데이터는 교통안전 시설 유지관리, 노후 방지턱 교체, 위험 구간 선정 등 다양한 행정 및 연구 목적에 활용할 수 있을 것으로 보입니다.
