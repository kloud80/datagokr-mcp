description_portal: <2001~2023년 도의 통계 정보 입니다>인천광역시 천연가스 자동차 보급 현황 공공데이터는 도시 내 친환경 교통수단인 천연가스 차량의 총 대수와 보급 추세를 담고 있습니다.  이 데이터는 버스, 청소차 등 차량의 종류별 등록 대수, 등록 연도, 구/군별 현황 등 세부 정보를 제공합니다. 미세먼지 등 대기 환경 개선을 위한 정부의 친환경 정책 성과를 측정하고, 천연가스 충전소 등 관련 인프라 구축 계획을 수립하는 데 중요한 기초 자료로 활용됩니다.<참고사항>환경부 천영가스 자동차 보급사업 종료로 24년도부터 보급실적이 없습니다.
