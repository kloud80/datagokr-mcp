description_portal: 이 데이터는 해양수산부가 선박의 위성망을 통해 수집한 선박 AIS 정적정보를 기반으로 각 선박의 국적별 건수를 집계한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 해양안전정보시스템에서 취득한 선박별 AIS 정적정보 중 국적 정보를 기준으로 각 국적별 선박 건수를 통계적으로 산출한 내용으로 구성되어 있습니다.  본 데이터는 국내외 선박의 국적별 분포 현황을 파악하고, 선박 운항 정책 및 해양안전 관련 제도 수립 시 기초 자료로 활용될 수 있습니다. 또한 선박 등록 현황 분석이나 국제 해사 관리 연구, 무역 및 해양 운송 경로의 국적별 특성 비교 연구 등에서도 사용될 수 있습니다.
