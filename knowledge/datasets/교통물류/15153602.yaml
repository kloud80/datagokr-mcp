description_portal: '"안전신문고 불법주정차 신고 및 과태료 부과 현황" 데이터는 2024년 동안 안전신문고를 통해 접수된 불법주정차 신고 중 과태료가 실제로 부과된 건만 선별하여 공개하는 자료입니다. 주요 제공 항목은 연번, 단속일시, 단속행정동, 단속위치(지번주소)이며, 과태료부과여부는 ‘부과’로만 표기되어 모든 건이 과태료 대상임을 의미합니다. 본 데이터는 지역별 불법주정차 발생 경향을 파악하고 시민 안전 확보를 위한 주정차 질서 개선 정책 수립에 활용할 수 있으며, 보행자 안전성 개선 및 정책적 보완 방안 도출 등 여러 연구에 활용할 수 있습니다.'
