summary_user: 경상남도 산청군에 안전신문고로 접수된 불법주정차 신고 가운데 과태료가 실제 부과된 건을 한 건씩 신고일시와 신고위치(지번주소)로 담은 원천 목록이며, 범위는 산청군 한 시군구입니다. 주민이나 분석가가 산청군 안에서 불법주정차 신고가 어느 지번·시간대에 몰리는지 보고 단속·주정차 질서 개선 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 좌표·행정구역으로 바꾸는 주소 매핑이나 같은 기관(산청군) 기준으로만 이어 쓴다.
