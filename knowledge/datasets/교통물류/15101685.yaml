description_portal: 서울특별시 용산구에서 운영 중인 공영주차장에 설치된 장애인 주차 현황에 대한 정보를 제공합니다. 교통약자나 장애인의 편의를 위해 장애인 전용 주차구역을 별도로 마련하여 운영하고 있습니다. 장애인 주차구역은 일반 주차면과 구분되어 넓고 안전한 공간으로 확보되어 있으며, 출입이 쉽도록 출입구와 가까운 위치에 배치되어 있습니다. 장애인 차량 전용 주차구역은 장애인복지법에 따라 주차 허가증을 소지한 차량만 이용할 수 있으며, 이를 통해 장애인의 이동 편의와 안전한 주차 환경을 보장하고 있습니다. 무단 주차 시에는 과태료 부과 및 견인 조치가 이루어질 수 있으니 주의해 주시기를 바랍니다. 현재 공사 중인 공영주차장도 함께 안내하고 있으며 용산구청 부설주차장 내 장애인 주차면 수도 제공하고 있습니다.
