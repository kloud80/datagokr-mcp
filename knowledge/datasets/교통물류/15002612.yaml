summary_user: 한국공항공사가 운영하는 인천국제공항 외 전국 공항의 화물실적을 연도·공항·노선·정기/부정기 구분별로 집계해 도착·출발 화물, 수하물, 우편물(메일) 물량을 담은 작은 CSV 파일(약 2.8KB)이다. 물류 분석가나 지역 사업자가 '어느 지방공항의 어떤 노선에서 화물 출발·도착 물량이 연도별로 어떻게 변했는가'처럼 수출입·항공물류 흐름을 가늠하는 질문에 쓴다. 공통 조인 키는 없어서, 같은 기관의 공항별 여객·운항 실적과는 공항명·노선명·연도를 이름으로 맞춰 이어 쓴다.
limits: 인천국제공항 실적은 포함되지 않는다. 실측 컬럼에 표준 공항코드 같은 전역 조인 키가 없어서 다른 데이터와 붙이려면 공항·노선 이름을 직접 매핑해야 한다. 연도 단위 집계여서 월별 추이나 화물 건별 내역은 알 수 없다.
