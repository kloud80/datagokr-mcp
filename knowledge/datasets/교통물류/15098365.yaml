summary_user: 세종특별자치시 도로에 설치된 안전표지를 한 건씩 담은 원천 데이터로, 노선 번호·명칭·방향, 차로수·도로폭, 도로명주소·지번주소와 위경도, 안전표지 구분·설명, 주행제한속도, 제2외국어 표기 여부, 설치일자를 담는다. 시민이나 교통 분석가가 '우리 동네 도로의 제한속도 표지는 어디에 있고 언제 설치됐나'를 확인하거나, 노선별 표지 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명·주소 같은 이름 매핑이나 위경도 좌표로 공간 결합해 이어 쓴다.
limits: 세종시 한 곳만 다루므로 다른 시도와 비교하려면 별도 데이터를 찾아야 한다. 공통 코드 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오차를 감안해야 한다. 개발계정은 하루 5,000회로 호출이 제한된다.
