summary_user: 고속도로에서 사고·공사·혼잡·기상 등 상황이 생길 때 송출되는 실시간 문자 안내를 건별로 담으며, 문자 내용(smsText)과 발생 일시, 상황 유형, 노선·지점명, 차로 통제 여부, 위도 등 위치 정보가 함께 온다. 운전자 알림 서비스 개발자나 교통 분석가가 '지금 어느 고속도로 노선 어느 지점에서 사고나 공사로 차로가 막혔는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 표준노드링크(link_id·node_id) 등 다른 교통 데이터와는 노선명·지점명 같은 이름 매칭이나 위경도 근접 매칭으로만 잇는다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 교통 상황에 대한 실시간 문자 안내 정보를 수록한 OpenAPI 서비스이다.교통 혼잡, 공사 구간, 사고 발생, 기상 특보 등 다양한 상황에 따라 발송되는 문자 메시지의 내용, 송출 시각, 제공 구간, 송출 수단 등의 정보가 포함된다.XML 및 JSON 형식으로 제공되며, 실시간 교통 정보 제공, 운전자 경고 시스템, 스마트 교통 서비스 등에 활용 가능하다.본 데이터는 도로 이용자에게 신속한 정보를 제공함으로써 안전 운행을 유도하고 교통 혼잡을 완화하는 데 기여한다.정보는 수시로 갱신되며, 상황별 문자 유형별 분류가 가능하여 교통 관련 응용 서비스 개발에 적합하다.공공기관 및 민간 서비스의 실시간 알림 연계, 교통 정보 분석, 사용자 맞춤형 안내 시스템 구축에 활용될 수 있다.
