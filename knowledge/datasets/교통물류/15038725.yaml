summary_user: 인천광역시 종합건설본부가 추진하는 도로개설사업을 사업별 한 행으로 담은 소형 CSV 파일(약 1.7KB)로, 사업명·총사업비(백만원)·연장(km)·폭(m)·차로 수와 설계용역·공사 공정률을 담는다. 인천 주민이나 부동산·상권 분석가가 '우리 동네 인근 신설 도로가 어느 단계까지 진척됐는가'를 확인해 지역 접근성 변화를 미리 가늠하는 데 쓴다. 전역 조인 키나 위치 좌표·행정구역 코드가 없어서, 다른 도로·도시계획 데이터와는 사업명을 직접 맞춰 이어 써야 한다.
description_portal: '1. 목록명: 인천광역시 종합건설본부 도로개설사업 추진현황2. 키워드: 도시계획시설, 도로망확충, 총사업비, 차선연장, 차선폭, 차선, 공정률3. 데이터설명: 인천광역시 종합건설본부 도로개설사업 추진현황에 대한 데이터를 제공하고 있습니다. 이 데이터에는 도로사업의 총사업비, 차선연장, 차선폭, 차선 및 설계용역의 공정률과 공사 공정률이 포함되어 있습니다. 이를 통해 종합건설본부에서 추진하는 도로개설사업 현황을 확인할 수 있으며, 데이터는 연간 업데이트되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드 할 수 있으며, CSV 형식으로 제공됩니다.'
