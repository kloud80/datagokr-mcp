summary_user: 부산광역시 공영주차장을 주차장 한 곳당 한 행으로 담으며, 주차장관리번호·이름·구·도로명/지번 주소·좌표·주차구획수·운영시간(평일·토요일·공휴일)·요금 정보를 포함한다. 시민이나 관광객이 '부산 어느 구에 있는 공영주차장이 주말에 몇 시까지 열고 기본요금이 얼마인가'를 확인하거나, 시·구가 구별 공영주차 면수를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주차장 이름·주소·좌표로 맞춰 연결하며, 전국주차장정보표준데이터(주차장관리번호·좌표·요금·면수)를 원장으로 놓고 대조하는 방식이 기본이다.
limits: 전역 조인 키가 없어 다른 기관 데이터와는 이름·주소 매칭이나 같은 기관 코드로만 이을 수 있다. 실시간 주차 가능 대수는 지자체·공단별 비표준 API 층이라 표준 원장과 구분해서 다뤄야 한다. 범위는 부산광역시 한 곳에 한정된다.
