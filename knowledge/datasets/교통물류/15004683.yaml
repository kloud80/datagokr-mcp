description_portal: 부산광역시 공영주차장의 주차장관리번호, 주차장명, 주차장유형, 관리기관명, 소재지도로명주소, 주차구획수, 급지구분 등을 조회하는 서비스입니다. 최근 부산광역시 내의 차량수가 나날이 증가함에 따라 주차를 할 수 있는 공영주차장의 역할이 갈수록 중요해지고 있습니다. 이에 따라 부산 곳곳의 공영주차장의 위치와 관련 정보등을 한 눈에 알 수 있는 데이터가 꼭 필요합니다. 공영주차장 정보 데이터는 시민 또는 관광객들의 여행 계획 수립, 그리고 시와 지방자치단체의 교통 관련 정책 등에도 도움을 줄 수 있습니다.
