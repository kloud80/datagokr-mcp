summary_user: 서울도시고속도로 8개 노선(내부순환로·강변북로·올림픽대로·동부간선도로 등)의 본선부 평일 평균속도와 대표구간 교통량을 2023~2025년 연도별로 정리한 소규모 집계표(CSV 약 855바이트)이다. 시민이나 교통 분석가가 '올림픽대로와 강변북로 중 어느 노선이 평일에 더 느리고 차가 많은가, 3년간 어떻게 변했나'를 확인할 때 쓴다. 전역 조인 키는 없고 노선명이 열 이름으로 들어 있어, 다른 데이터와는 노선 이름을 맞춰 연결해야 한다.
limits: 노선별 연 단위 집계여서 실시간 소통·링크별 속도·시간대별 정체는 볼 수 없다. 교통량은 노선 전체가 아니라 대표 지점 값이고 속도는 전구간 평균이므로, 두 값을 같은 구간 기준으로 해석하면 안 된다. 공통 코드가 없어 노선 이름 매핑으로만 다른 데이터와 붙일 수 있다.
