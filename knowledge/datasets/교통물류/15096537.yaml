description_portal: 먼저 해당 데이터는 2021년 공공데이터 기업매칭 사업 완료시 구축된 1회성 데이터이며, 더이상 업데이트가 진행되지않음을 말씀드립니다.대구광역시 북구 보행자 전용도로 현황에 대한 120개의 데이터로 시설명, 폭원(3~15), 연장(10~680), 지번주소, 경도, 위도 등의 항목을 제공합니다[보행자전용도로란?]① 보행자의 통행만을 목적으로 하고, 자동차 교통을 완전히 배제한 도로의 총칭.② 보행자만 통행할 수 있도록 안전 표지나 그와 비슷한 인공 구조물로 표시.[관련법규]도로교통법 제6조(통행의 금지 및 제한)①지방경찰청장은 도로에서의 위험을 방지하고 교통의 안전과 원활한 소통을 확보하기 위하여 필요하다고 인정할 때에는 구간을 정하여 보행자, 차마 또는 노면전차의 통행을 금지하거나 제한할 수 있다. 이 경우 지방경찰청장은 보행자, 차마 또는 노면전차의 통행을 금지하거나 제한한 도로의 관리청에 그 사실을 알려야 한다.도로교통법 제28조(보행자 전용도로의 설치)①지방경찰청정이나 경찰서장은 보행자의 통행을 보호하기 위하여 특히 필요한 경우에는 도로에 보행자 전용도로를 설치할 수 있다.②차마 또는 노면전차의 운전자는 제1항에 따른 보행자 전용도로를 통행하여서는 아니된다. 다만 지방경찰청장이나 경찰서장은 특히 필요하다고 인정되는 경우에는 보행자 전용도로에 차마의 통행을 허용할 수 있다.
