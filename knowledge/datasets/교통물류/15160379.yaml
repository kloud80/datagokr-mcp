description_portal: 경기도 양주시에서 운영하는 똑버스 노선형 운행정보 데이터입니다.평시에는 이용자의 호출에 따라 차량이 배차되는 수요응답형(DRT, Demand Responsive Transport) 방식으로 운영되며, 교통수요가 집중되는 시간대(출퇴근) 또는 지역 여건을 고려한 일부 노선은 정해진 시간표와 경로에 따라 노선형으로 운행됩니다. 노선형으로 운행되는 경우에도 이용자는 똑타(똑버스) 앱을 통해 차량을 호출한 후 탑승하여야 합니다.본 데이터는 노선형으로 운영되는 똑버스의 노선명, 운행구간, 정류소 순서, 정류소 위치정보(좌표), 운행구분(상행·하행·편도), 기·종점 정보 등을 포함하고 있으며, 대중교통 취약지역의 이동권 보장과 지역 간 교통 접근성 향상을 위한 기초자료로 활용할 수 있습니다. 또한 AI 기반 교통서비스, 디지털 교통플랫폼, MaaS(Mobility as a Service), 교통수요 분석, 경로 탐색, 공간정보 분석, 스마트시티 및 교통정책 수립 등 다양한 분야에서 활용 가능한 AI 친화형 고가치 데이터입니다.
