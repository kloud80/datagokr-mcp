summary_user: 고속도로 콘존(구간)별로 일자·시간대마다 차로번호와 AVC 차종 구분별 전체교통량과 위반교통량을 담은 전국 단위 집계 데이터이다. 교통 분석가나 단속 담당자가 '어느 구간·시간대에 버스전용차로나 차종제한 위반이 많은가'를 따져 단속 지점과 혼잡 관리 대상을 고르는 데 쓴다. 전역 조인 키는 없어서 콘존ID·콘존명(conzoneId)이나 노선번호를 같은 기관(한국도로공사)의 다른 고속도로 교통 데이터와 맞춰 잇고, 표준노드링크와는 이름·코드 매핑을 거쳐야 연결된다.
description_portal: 본 데이터는 한국도로공사에서 수집·제공하는 차로별 차종 구성 및 위반율 정보로, 고속도로 각 구간의 차로별 교통 흐름과 차종별 구성비, 그리고 해당 차로에서 발생한 위반율을 정확하고 체계적으로 제공하는 공공데이터이다.데이터는 OpenAPI 형태로 제공되며 XML과 JSON 형식을 모두 지원하여, 다양한 정보시스템과 분석 도구에서 연계 활용이 가능하다.주요 제공 항목에는 일자, 시간, 콘존명, 콘존ID, 버스차로구분, 차로번호, AVC차종구분코드, 전체교통량, 위반교통량이 포함된다.이 데이터는 각 차로의 교통량 분포와 차종별 점유율, 그리고 버스전용차로 위반이나 차종제한 위반과 같은 법규 위반 현황을 정량적으로 분석할 수 있도록 지원한다.이를 통해 시간대별·구간별 위반 패턴을 도출하여 단속 지점 선정, 혼잡구간 관리, 도로 안전성 강화 등 다양한 교통관리 정책 수립에 기여한다.
