summary_user: 부산 도시철도 2호선 역들에 설치된 에스컬레이터를 한 대씩 기록한 시설 목록으로, 운영기관·노선·역명·상하행 구분·출입구 번호·상세 위치·시작층과 종료층을 담는다(CSV 파일 약 16KB). 교통약자나 이동 편의 서비스를 만드는 사업자가 '이 역 몇 번 출입구에 에스컬레이터가 있고 몇 층에서 몇 층까지 이어지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 역 코드가 없어 다른 역·출입구 데이터와는 역명·출입구번호를 문자열로 맞춰 이어 써야 한다.
