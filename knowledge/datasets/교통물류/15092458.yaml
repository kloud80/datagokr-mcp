description_portal: '데이터 개요국토교통부 항공통계시스템에서 제공하는 ‘지역·국가별 항공통계’는 국가 또는 권역별 항공운송 실적을 월 단위로 분석할 수 있도록 구성된 통계 자료입니다. 해당 데이터는 특정 지역(예: 동북아, 동남아, 유럽 등) 또는 국가(예: 일본, 미국, 베트남 등)를 기준으로 운항편 수, 여객 수송량, 화물 수송량 등을 항목별로 조회할 수 있으며, 출발/도착 구분, 운항형태, 여객/화물 유형 등에 따라 세부 조건 설정이 가능합니다.주요 제공 항목지역: 예) 동북아, 동남아, 미주, 유럽 등국가: 예) 일본, 중국, 미국 등 (국제항공노선 기준)운항편 수: 해당 국가와의 월별 항공편 총 수 (출발/도착 기준 선택 가능)여객 수: 유임, 무임, 환승 포함 전체 여객 수화물 수송량: 순화물, 수하물, 우편물 포함 총 화물량(톤)조건 설정 항목운항 구분: 정기편, 부정기편여객 구분: 유임, 무임, 환승, 전체화물 구분: 순화물, 수하물, 우편물출발/도착 구분: 출발, 도착, 전체활용 안내국가별 항공 수요 변화 추이 분석지역별 항공시장 구조 비교 및 진출 전략 수립항공운송 실적 보고 및 지역 간 항공교류 실적 산출항공화물 수출입 분석(FTA 활용, 공급망 분석 등)데이터 예시지역국가운항(편)여객(명)화물(톤)일본일본12,2552,312,54550,392중국중국9,2871,188,78063,672동남아베트남5,110890,34712,553※ 월별 기준 데이터 제공, 엑셀 파일 다운로드 가능※ 여객 수는 총탑승 기준이며, 환승·무임도 포함 가능※ 화물 수는 적재 기준이며, 환적은 포함되지 않을 수 있음'
