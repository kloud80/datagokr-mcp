summary_user: 완주군 안에서 이루어진 도로굴착 공사를 건별로 담은 파일 데이터로, 공사위치(도로명주소)·점용목적·공사기간 시작일·굴착연장을 기록한다. 주민이나 사업자가 "우리 동네 도로에서 언제, 어떤 목적의 굴착 공사가 있었나"를 확인하거나, 분석가가 굴착 공사를 지역 공사 이벤트로 집계할 때 쓴다. 전역 조인 키는 없어서 도로명주소를 주소·좌표로 매핑하거나 완주군 기관 단위로만 다른 도로·공사 데이터와 이어 쓴다.
limits: 표준 행정코드나 전역 조인 키가 없어 다른 데이터와 연결하려면 주소 문자열을 따로 매핑해야 한다. 명세상 연간·이벤트 주기로 생성된 뒤 바뀌지 않는 파일이라 진행 중인 공사의 실시간 현황으로 보면 안 된다. 실측 필드에는 공사 시작일만 있어 종료일이나 공사 기간은 확인되지 않는다.
