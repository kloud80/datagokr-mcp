description_portal: '데이터 개요**「국토교통부_세계공항_코드」**는 전 세계 공항의 표준 식별코드와 관련 정보를 제공하는 데이터로, 항공운송 관리, 노선 설계, 항공정보시스템 연계 등에 활용할 수 있는 기초 자료입니다.해당 데이터는 영문 공항명, 한글 공항명, IATA 코드, ICAO 코드, 공항 운영 상태 항목으로 구성되어 있으며, 신규 공항을 제외한 현재 운영 중인 공항을 중심으로 수록되어 있습니다.데이터 제공 항목영문공항명국제적으로 통용되는 공항의 영문 명칭한글공항명공항의 공식 한글 표기공항코드1 (IATA)국제항공운송협회(IATA)에서 지정한 3자리 공항 코드공항코드2 (ICAO)국제민간항공기구(ICAO)에서 지정한 4자리 공항 코드공항운영상태구분현재 운영 여부(예: 기존공항, 폐쇄공항 등)활용 안내항공 노선 분석 및 국제 연결성 비교공항 관련 정보시스템 구축 (예약, 수하물 연계 등)국제 항공통계 및 시장 조사 보고서 작성공항 운영 현황 관리 및 정책 수립용 참조자료데이터 해석 시 유의사항데이터는 신규 개항이나 폐쇄된 공항 정보를 포함하지 않으며, 현존 운영 공항에 한해 제공됩니다.코드 중복이나 변경 이력은 IATA 및 ICAO의 최신 공식자료와 비교 검토 후 사용해야 정확성을 보장할 수 있습니다.공항 코드 활용 시, 국가별 시간대, 위치좌표, 항공기 운항규모 등 추가 정보와의 병행 분석이 필요할 수 있습니다.데이터 구성 예시영문공항명한글공항IATAICAO공항운영상태구분A Coruna Airport아코루냐 공항LCGLECO기존공항Aalborg Airport올보르 공항AALEKYT기존공항Aarhus Airport오르후스 공항AAREKAH기존공항'
