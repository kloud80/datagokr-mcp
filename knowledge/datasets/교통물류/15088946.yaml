summary_user: 보령시 관내 가로등·보안등을 시설물 한 기씩 담은 건별 원천 파일로, 관리번호·도로명/지번주소·위도·경도·설치연도·설치형태·사용목적을 담는다(약 3.3MB CSV, 시군구 범위). 시청 담당자나 주민이 '우리 동네 어느 골목에 보안등이 있고 언제 설치됐나', '야간 조명이 비는 구간은 어디인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 법정동·리·지번 주소나 위도·경도 좌표로 다른 공간 데이터(필지·건물, 다른 시군 가로등 파일 등)와 맞춰 붙인다.
description_portal: 도시 안전 환경 조성 및 야간 보행 환경 개선에 대한 필요성이 높아지는 가운데, 충청남도 보령시는 관내에 설치된 가로등 및 보안등의 상세 현황 데이터를 함께 제공합니다. 본 데이터는 가로등·보안등 관리번호, 설치 법정동, 지번주소, 상세 설치 위치(위도, 경도) 등을 제공하며, 두 시설물의 분포 현황을 통합적으로 파악할 수 있도록 정리되었습니다. 지자체 및 도로 관리 기관은 본 데이터를 통해 가로등·보안등의 위치 및 설치 정보를 기반으로 효율적인 유지보수 및 점검 계획을 수립할 수 있습니다. 또한 스마트시티 관련 연구기관에서는 조명 시설물 분포 데이터를 에너지 사용량 분석 및 절감 방안 연구에 활용할 수 있으며, 도시 계획 및 안전 분야에서는 야간 조도 취약 구간 파악 및 추가 설치 계획 수립에 본 데이터를 활용할 수 있습니다.
