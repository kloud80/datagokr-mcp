summary_user: 서울 관악구 안에서 화물자동차운송주선사업 허가를 받은 업체를 한 줄에 한 곳씩 담은 원천 목록으로, 업체명·인허가일자·영업상태·소재지주소·위도·경도·구분·전화번호를 담는다(파일 크기 약 5KB의 소규모 CSV). 이사나 화물을 맡기려는 주민이 관악구의 특정 주선업체가 허가를 받았는지, 지금도 영업 중인지 확인할 때 쓰고, 구청 담당자가 관내 업체 분포를 점검할 때도 쓴다. 전역 조인 키는 없으므로 업체명·주소를 기준으로 전국화물자동차운송사업자표준데이터나 다른 시군구 허가 목록과 맞춰 보고, 위도·경도로 지도에 올려 쓴다.
description_portal: 본 데이터는 서울특별시 관악구 내 화물자동차운송주선사업 허가업체 현황을 정리한 자료입니다. ▲업체명 ▲인허가일자 ▲영업상태명 ▲소재지주소 ▲위도·경도 ▲구분 ▲전화번호 항목으로 구성되어 있으며, 관내에서 화물운송 또는 이사 관련 서비스를 제공하는 업체들의 기본 정보를 한곳에서 확인할 수 있습니다. 이를 통해 각 업체가 언제 허가를 받았는지, 현재 영업 중인지 여부, 위치와 연락 가능 정보 등을 체계적으로 파악할 수 있어 지역 내 운송업체 분포 이해, 현황 점검, 행정업무 참고자료로 활용하기에 유용한 기반 데이터입니다.
