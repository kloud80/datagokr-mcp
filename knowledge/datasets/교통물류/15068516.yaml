description_portal: '한국철도공사의 연도별 유류 수송실적(톤-키로) 데이터는 휘발유, 방카씨유 등 다양한 유류를 철도로 운송한 실적을 연도별, 거리(톤-키로, 즉 화물 무게와 운송 거리의 곱) 단위로 집계한 공식 통계 자료입니다. 이 데이터를 통해 각 연도별로 실제로 철도를 통해 운송된 유류의 총 규모와 물동량 변동을 구체적으로 파악할 수 있습니다.이 자료를 분석하면 유류 운송실적의 연도별 추이, 특정 시기에 유류 수송이 증가하거나 감소하는 원인(예: 산업 구조 변화, 에너지 정책, 경기 변동 등), 그리고 철도의 화물운송 효율성과 친환경 물류정책 실현 정도 등을 유추할 수 있습니다. 또 철도-도로 등 경쟁 운송수단과 점유율 변화, 유류 이외 다른 화물과의 수송실적 비교, 에너지 소비 유형 변화 등도 인사이트로 도출할 수 있습니다.이 데이터는 철도 물류시장 분석, 물동량 예측, 국가 교통·물류정책 수립, 에너지 수요 연구, 환경정책 효과 평가, 학술 논문, 각종 운송·물류업계 보고서 작성에 폭넓게 활용될 수 있습니다. 특히 유류 이외 수송품(시멘트, 석탄 등)과 합산해 전체 화물 운송 패턴을 분석하거나, 특정 연도 및 정책 전환 전후의 비교 연구 등에도 신뢰성 높은 참고자료가 될 수 있습니다.'
