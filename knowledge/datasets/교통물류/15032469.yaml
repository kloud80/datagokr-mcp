summary_user: 성남시 자전거도로를 노선 단위로 한 행씩 담은 CSV 파일로, 노선명·시점·종점과 연장(km)·폭(m)·포장종류·도로종류, 데이터기준일자를 담는다. 시민이나 자전거 정책 분석가가 성남시 안에서 어떤 노선이 어디서 어디까지 얼마나 길고 넓게 깔려 있는지, 포장 상태가 어떤지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명이나 시점·종점 지명을 맞춰 붙이거나, 같은 성남시가 낸 공공자전거·킥보드 주차구역 자료와 이름 기준으로만 이어 쓴다.
description_portal: 성남시 내 자전거 이용이 가능한 도로 현황을 제공하는 데이터로, 연장(km), 폭(m), 도로포장종류, 도로 종류, 시점(시작점), 종점 항목으로 구성되어 있습니다. CSV파일 형태로 1년주기로 현행화하여 자료를 제공합니다. 전체 자전거 도로는  약 120km이며, 주요 노선은 탄천 자전거길(분당구~서울숭파구), 운중천변 자전거길(판교, 운중천일대), 청계산 주변 연결로(산악형 노선 일부 존재)가 대표 노선입니다.  이중 성남시를 관통하는  탄천 자전거 도로는 일부 구간에서 교량과 교차로에서 단절 현상이 발생하여, 연결로를 설치차거나 우회로를 마련하는 방안을 검토 중입니다
