description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 차량 진입방지 시설의 위치 정보를 제공합니다. 보행자 전용구역이나 공원 등에 차량의 무단 진입을 막기 위해 설치된 볼라드, 방지턱 등의 시설 정보를 담고 있습니다. 지형지물부호는 시설을 식별하는 코드이며, 지번주소와 경도, 위도는 시설의 정확한 위치를 제공합니다. 관리기관은 시설 관할 주체를 나타내고, 재질은 철재, 석재 등 시설의 소재를 표시합니다. 형태는 고정식, 이동식 등 설치 유형을 나타냅니다. 본 데이터는 보행 안전 시설 관리, 차량 통제 구역 관리, 보행 환경 개선, 시설물 유지보수 등에 활용됩니다.
