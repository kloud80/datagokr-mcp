summary_user: 드론 조종교육 사용사업체(교육기관)의 교육생 수를 지역(시도·시군구 수준의 지역1·지역2)별로 2022년부터 2026년까지 연도별 열로 정리한 집계 파일이다. 지역별 드론 교육 수요가 어디서 늘거나 줄었는지 확인하려는 분석가나 교육기관 입지를 검토하는 사업자가 연도별 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 드론 데이터(사용사업체·조종자격 등)와는 지역명을 직접 맞춰서만 이을 수 있다.
description_portal: 드론을 활용하여 경영을 하려는 자는 항공사업법 제48조(초경량비행장치사용사업의 등록)에 따라 등록을 해야하고, 한국교통안전공단은 같은법 제75조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.사업등록 시 촬영,측량,관측,점검,조종교육,농업지원,기타의 항목을 선택할 수 있으며, 조종교육으로 등록된 사용사업체가 드론교육을 수행할 수 있다.현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있고, 사업자등록번호 기준으로 사용사업체의 이력을 관리하고 있다.그리고 교육생 관리를 위해 드론 비행경력시스템(https://www.kotsa.or.kr/dfms)을 통해 교관, 교육생을 관리하고 있다.해당자료는 서울, 경기도, 경상도 등 드론 교육기관의 교육생 수에 대한 정보를 년도별로 제공하여, 교육생 수와 관련된 통계 자료로 활용이 가능하다.
