summary_user: 공단이 운항관리하는 전국 연안여객선의 운항 스케줄을 일자·출항시각별 운항편 단위로 담으며, 여객선·출항지·도착지·면허항로·운항항로와 운항상태, 통제·비운항·결항 사유를 함께 싣는다. 도서 주민이나 여행객이 '내일 아침 이 항로 배가 뜨는지, 통제됐다면 이유가 무엇인지'를 확인하거나, 분석가가 항로별 결항·통제 빈도를 살피는 데 쓴다. 전역 조인 키는 없어 여객선코드·항로코드·출항지/도착지코드나 이름을 같은 공단의 항로·선사·여객터미널 데이터와 맞춰 잇는다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로공단의 운항관리 대상 연안여객선의 운항 스케줄 정보를 포함하고 있습니다.여객선명, 여객선코드, 일자, 출항시각, 출항지명, 면허항로명, 운항항로명, 통제사유, 여객정원수 등이 포함된 정보 입니다.여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다."
