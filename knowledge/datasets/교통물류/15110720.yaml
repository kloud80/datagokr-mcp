summary_user: 진주시 성북지구에서 운영하는 주차장별로 관리번호·명칭·주소와 전체 일반 주차면수, 사용 중 일반 주차면수, 전체·사용 중 장애인 주차면수를 담는 주차장 단위 현황 API다. 운전자나 안내 서비스 운영자가 '지금 성북지구 어느 주차장에 일반·장애인 빈자리가 남아 있나'를 확인하거나, 분석가가 주차장별 혼잡도를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 전국주차장정보표준데이터(주차장관리번호·좌표·요금·면수 원장)와는 주차장 이름·주소 매핑으로만 이어 쓴다.
description_portal: 경상남도 진주시 성북지구에서 운영 중인 주차장의 현황 정보를 제공하는 서비스로, 각 주차장의 관리번호, 명칭, 주소 등 기본 정보를 확인할 수 있습니다. 또한 주차면수 관련 세부 정보가 함께 제공되며, 전체 일반 주차면수와 현재 사용 중인 일반 주차면수, 전체 장애인 주차면수 및 이용 중인 장애인 주차면수가 구분되어 제공됩니다. 이를 통해 주차장별 이용 현황을 실시간에 가깝게 파악할 수 있으며, 주차 수요 분석, 혼잡도 예측, 주차 정책 수립, 이용자 안내 서비스 개선 등 다양한 행정·운영 분야에서 활용할 수 있는 유용한 데이터입니다.
