summary_user: 대구교통공사가 운영하는 대구 2호선 열차의 편성유형·호차(칸)별로 교통약자좌석수, 임산부좌석수, 출입문수를 담은 소규모 CSV 파일(약 6.7KB)이다. 휠체어 이용자나 임산부가 대구 2호선 몇 번째 칸에 교통약자석·임산부석이 몇 개 있는지 확인하거나, 분석가가 노선별 교통약자 좌석 배치를 비교하는 데 쓴다. 전역 조인 키는 없으므로 다른 노선의 호차별 교통약자정보나 역 시설 데이터와는 운영기관명·선명·호차번호 같은 이름 매칭으로만 이어 쓴다.
description_portal: 대구교통공사에서 관리하는 2호선 역들의 호차별교통약자정보에 대한 철도운영기관명,선명,편성유형,호차번호,교통약자좌석수,임산부좌석수 입니다.참고로 (도시ㆍ광역철도 차량) 전국단위 조사 시 기준적합 설치율 97.3%로 ‘21년에 비해 1.3%p 상승했다. 경부ㆍ동해ㆍ경원선 등 한국철도공사 운영 구간 및 대구 1호선, 광주 1호선, 대전 1호선, 우이신설선은 기준적합 설치율 100%로 나타났다. 의정부경전철, 신림선, 용인경전철은 목적지표시 등이 기준에 적합하지 않았다.   * (철도차량) 전국단위 조사시 기준적합 설치율 99.4%로 조사대상 중 가장 높았으며, 향후 노후 열차가 신규 열차로 대체됨에 따라 100%에 근접할 것으로 예상 됩니다.
