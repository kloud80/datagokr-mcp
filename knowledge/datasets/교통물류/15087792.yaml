summary_user: 한국교통안전공단이 관리하는 항공종사자 자격증명(조종사·항공교통관제사·항공정비사·운항관리사 등) 취득 기록을 건별로 담으며, 포털 설명상 기간은 2019~2023년이고 전국 범위의 CSV 파일(약 1.2MB)이다. 항공 인력 수급을 보는 분석가나 교육기관이 '최근 몇 년간 어떤 자격·항공기 종류에서, 어느 나이대와 성별, 어느 지역의 취득자가 늘었는가'를 확인하는 데 쓴다. 개인특정코드(arts_person_cd)가 조인 키로 확인되어 같은 사람의 여러 자격 취득을 묶는 데 쓰며, 자격명·등급·주소 필드에는 다른 데이터와 연결할 표준 코드표가 명세에 없다.
description_portal: 한국교통안전공단에서 담당하고 있는 항공종사자(조종사, 항공교통관제사, 항공정비사, 운항관리사 등) 자격증명 년도별(2019~2023) 취득자 정보입니다. - 항공종사자는 항공안전법 제35조에 따라 1. 운송용 조종사 2. 사업용 조종사 3. 자가용 조종사 4. 부조종사  5. 항공사 6. 항공기관사 7. 항공교통관제사 8. 항공정비사 9. 운항관리사 로 구분됩니다. - 항공종사자 자격증명은 항공안전법 제2조제5호에 따른 항공업무를 하는 경우에는 항공안전법 제34조에 따라 받아야 하는 사항입니다.
