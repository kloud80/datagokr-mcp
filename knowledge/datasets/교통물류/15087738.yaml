summary_user: 경산시 버스정보시스템의 노선 원장으로, 노선 한 건마다 노선번호·노선명·방면·노선거리·노선종류·시작·회차·종료 정류장·운행 시작·종료일·관리부서를 담은 CSV 파일(약 52KB)이다. 시민이나 분석가가 '경산시에 어떤 시내·마을버스 노선이 있고, 각 노선이 어디서 출발해 어디서 회차하며 거리가 얼마인가'를 확인하거나 노선 폐지·변경 이력을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 경산시 정류장 정보나 도착 정보와는 노선 아이디·노선번호·정류장 이름을 맞춰 붙여야 한다.
description_portal: 이 자료는 경산시의 대중교통 노선 정보를 담은 공공데이터로, 노선번호, 노선명, 노선거리, 노선종류, 시작정류장, 종료정류장, 노선시작일, 노선종료일, 관리부 등의 항목으로 구성되어 있습니다. 노선번호와 노선명은 각각 노선을 구분하고 식별할 수 있는 기본 정보이며, 시민들이 버스를 이용할 때 참고하는 주요 기준입니다. 노선거리는 해당 노선이 운행하는 전체 거리로, 운행 범위와 소요 시간 추정에 활용됩니다. 노선종류는 일반, 마을버스, 시내외 등 운행 형태를 구분하는 항목입니다. 시작정류장과 종료정류장은 노선의 출발지와 도착지를 나타내며, 경로 계획과 정류장 위치 파악에 도움이 됩니다. 노선시작일과 종료일은 노선의 운행 기간을 보여주며, 변경이나 폐지 여부를 확인하는 데 유용합니다. 관리부는 해당 노선을 관리하는 행정 부서를 나타내며, 민원 대응 및 정책 관리에 활용됩니다. 이 데이터는 대중교통 운영의 효율성 분석과 시민의 교통 접근성 향상에 기여할 수 있습니다.
