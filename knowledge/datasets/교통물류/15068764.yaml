summary_user: 인천광역시 남동구에 등록된 물류창고업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 업체명·소재지(주소)·취급품목·데이터기준일자를 담는다(파일 크기 491바이트의 소규모 CSV). 물류 입지를 찾는 사업자나 지역 물류 인프라를 살피는 분석가가 '남동구 어디에 어떤 품목을 다루는 물류창고가 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명 이름 매칭이나 소재지 주소의 지오코딩으로만 잇는다.
