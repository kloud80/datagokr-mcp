summary_user: 경기도 도로대장전산화시스템에 등록된 신호등을 시설 한 건씩 담은 원천 목록으로, 노선번호·구간번호·시점 위치와 방향, 신호등 종류(3색등·4색등·보행등 등), 설치형식, 설치일자, 비고를 포함한다. 도로 관리자나 교통안전 분석가가 '특정 도로 노선의 어느 구간에 어떤 종류의 신호등이 언제 설치됐는가'를 파악해 시설 유지관리나 신호 체계 개선 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 도로대장 다른 시설물 데이터와 노선번호(route_no)·구간번호(section_no)를 맞추는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 도로대장전산화시스템에 등록된 신호등에 관한 정보를 제공하며, 노선번호, 구간번호, 시점 위치 및 방향, 신호등 종류(예: 3색등, 4색등, 보행등), 설치형식(측주식, 편지식), 설치일자, 비고, 공간좌표(위도·경도) 등의 항목으로 구성되어 있습니다. 신호등은 차량과 보행자의 안전한 교통흐름을 유도하기 위한 필수 교통제어시설로서, 도로의 교차로 및 횡단보도 등에 설치됩니다. 본 데이터는 도로 노선별 교통제어시설의 분포를 파악하고, 시설물 유지관리, 교통안전 대책 수립, 신호 체계 개선 등의 행정 목적에 활용됩니다. 공간정보가 포함되어 있어 교통신호 시뮬레이션, 교차로 혼잡도 분석, 교통사고 위험도 평가 등에도 유용하게 사용할 수 있습니다.'
