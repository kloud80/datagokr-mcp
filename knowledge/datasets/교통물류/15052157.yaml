summary_user: "울릉도·독도를 오가는 주요 여객선의 출발지·도착지, 선박명, 운항회사, 연락처, 예약사이트, 운항항로를 노선(선박) 단위로 정리한 소규모 목록 파일(약 1KB CSV)이다. 울릉도·독도 여행객이 '어느 항구에서 어떤 배가 다니고 어디서 예약하나'를 확인하거나, 분석가가 울릉도 항로별 운항 선사를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 연안여객선 데이터(예: 해양교통안전공단 운항상태·운항예보)와는 선박명·항구명 같은 이름 매칭으로만 이어 쓴다."
