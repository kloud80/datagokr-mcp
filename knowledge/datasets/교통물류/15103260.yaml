summary_user: 인천 부평구 안 건축물 부설주차장 가운데 개방 정보가 있는 곳을 주차장(건물) 한 곳당 한 행으로 담은 소규모 CSV 파일(약 3KB)로, 건물명·주소·주차면수·무료 개방기간·개방 시간을 수록한다. 부평구 주민이나 방문객이 '이 근처에서 야간이나 주말에 무료로 쓸 수 있는 건물 주차장이 어디인가'를 찾을 때 쓰고, 구청이 주차 수급이 부족한 지역의 개방 주차장 분포를 살필 때도 쓴다. 주차장관리번호 같은 전역 조인 키가 없어서, 전국주차장정보표준데이터 등 다른 자료와는 주소나 건물명을 맞춰 이어 써야 한다.
description_portal: '건축물에 부설된 주차장의 위치, 주차면수, 무료 개방 시간 등을 수록한 자료.지역 주민과 방문객의 주차 편의 증진, 주차 공간 공유 활성화, 불법주정차 완화 등 교통행정 기반자료로 활용됨.활용 목적 및 특징– 부설주차장의 주소 및 개방정보를 통해 주차 가능 구역 확인– 무료 개방 기간 및 시간 분석으로 유휴 주차 공간 활용도 제고– 지역 내 주차 수급 불균형 해소를 위한 정책자료로 활용– 교통 혼잡 지역 중심의 주차장 개방 정책 유도 가능주요 항목 설명● 건물명: 부설주차장이 설치된 건축물의 명칭● 주소: 해당 건축물이 위치한 도로명 또는 지번 주소● 면수: 제공 가능한 총 주차 가능 대수● 무료 개방기간: 무상으로 주차장을 개방하는 기간 정보● 개방 시간: 개방기간 중 실제 이용 가능한 시간대'
