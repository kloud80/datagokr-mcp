summary_user: 대전교통공사가 2009년부터 2025년까지 추진한 내부 연구과제·연구용역·국가공모사업 등 연구개발 과제를 과제 한 건씩(다년도 과제는 연차별로) 연도, 구분, 과제명, 연구기간, 수행부서와 함께 담은 목록 파일입니다. 도시철도·트램 운영기관 관계자나 교통 연구자가 대전교통공사가 어느 분야에 어떤 형태의 연구를 언제, 어느 부서에서 수행했는지 확인하고 신규 과제를 기획할 때 참고자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과제명·수행부서 같은 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 2009년부터 2025년에 이르기까지 대전교통공사는 조직의 전문성 강화와 기술자립도 향상을 위해 다양한 형태의 연구 활동을 지속적으로 추진해왔다. 내부 직원들이 직접 기획·수행한 내부 연구과제, 전문기관과의 협업을 통해 수행된 연구용역, 그리고 중앙정부 및 공공기관에서 주관하는 국가공모사업 등 대외 과제를 망라한 종합적인 과제 현황 자료가 이에 해당한다.특히 대외 공모 과제의 경우 단년도 사업뿐만 아니라 2~3년 이상 지속되는 다년도 과제가 포함되어 있어, 단순히 ‘완료 과제’ 목록에 그치지 않고 연차별 추진 실적을 세부적으로 기록하여 사업의 진행 경과와 성과를 체계적으로 확인할 수 있도록 구성하였다. 이를 통해 각 과제가 어떤 방식으로 기획되었고, 어떤 목표를 향해 단계적으로 진척되었는지 한눈에 파악할 수 있다.본 자료는 지난 16년간 대전교통공사가 축적해 온 연구개발 활동의 성과를 총체적으로 정리한 것으로,신교통수단 도입,철도·트램·버스 등 교통체계 혁신,안전·신호·운영 분야 기술 고도화,에너지 절감 및 친환경 교통정책 대응,스마트 모빌리티 및 ICT 융합 기술 적용,시민 서비스 개선 및 경영 효율화등 다양한 분야에서 이루어진 과제들을 폭넓게 아우르고 있다.또한 이 자료는 단순한 연혁 정리 차원을 넘어, 향후 신규 사업 발굴과 연구과제 선정 시 참고자료 및 전략적 의사결정 근거로 활용될 수 있다. 대전교통공사가 지난 기간 동안 어떤 분야에 역량을 집중해 왔는지, 지역·국가 단위 정책 변화에 어떻게 대응해 왔는지, 그리고 어떠한 기술적·조직적 성과를 이뤄냈는지를 종합적으로 조망할 수 있는 중요한 문서라 할 수 있다.
