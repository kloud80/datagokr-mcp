summary_user: 한국공항공사가 운영하는 김포·김해·제주 등 전국 14개 공항의 부지면적, 주·보조 활주로 규격, 연간 처리능력, 2025년 시설 활용률, 슬롯 정보를 공항당 한 행으로 담은 소형 현황표(CSV 약 1KB)이다. 분석가나 지역 정책 담당자가 "어느 지방공항이 처리능력 대비 활용률이 낮거나 포화에 가까운가"를 비교하는 데 쓴다. 공항코드 같은 전역 조인 키가 없어 공항명(공항명)을 기준으로 같은 기관의 공항별 여객·운항 실적 통계와 이름 매핑으로 이어 쓴다.
description_portal: 한국공항공사(Korea Airports Cooperation)가 운영하는 공항별 시설 현황정보를 제공합니다.공항 착륙시설, 터미널, 부지 및 활주로 정보에 대한 데이터로 공항면적, 주(보조) 활주로 규격(m), 연간 처리능력(회), 매년 시설 활용률(퍼센트), 슬롯 이용률, 등의 정보를 제공합니다.전국공항 기준은 김포공항, 김해공항, 제주공항, 대구공항, 청주공항, 무안공항, 양양공항, 광주공항, 울산공항, 여수공항, 포항경주공항, 사천공항, 군산공항, 원주공항 14개 공항이 대상입니다.추가 요구사항이나 문의사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
