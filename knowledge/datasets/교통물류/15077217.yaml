summary_user: 대전광역시 안의 사업용 화물자동차 운송사업과 주선사업 현황을 업종별 업체 수와 허가 차량 대수로 묶은 집계 엑셀 파일(xlsx 한 건)이며, 업체별 건별 원장은 아니다. 지역 물류 분석가나 화물운송 창업을 검토하는 사업자가 '대전에서 일반·개별·용달화물 업종별로 허가 차량이 얼마나 되나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명·지역명 매핑으로만 잇고, 개별 운송사·주선사의 허가 여부는 전국화물자동차운송사업자표준데이터에서 확인한다.
description_portal: 대전광역시 화물자동차운송 및 주선사업 현황은 대전광역시 내에서 사업용 화물자동차 관련 운송업과 주선사업의 운영 실태를 나타내는 자료입니다. 이 자료는 업종별 업체 수, 허가받은 화물자동차 대수, 각종 허가 유형에 따른 등록 현황 등을 포함하고 있어, 지역 내 화물 운송 서비스의 구조와 공급 현황을 이해하는 데 중요한 기초 정보를 제공합니다. 업종 분류를 통해 일반화물, 개별화물, 용달화물 등 다양한 유형의 운송사업 체계를 파악할 수 있으며, 사업자 수와 차량 대수의 추이를 통해 지역 내 물류 수요와 공급 균형에 대한 분석이 가능합니다.
