summary_user: 광주광역시 시내버스의 승하차 거래를 거래일자·시간대·노선·정류장·승하차 구분·권종별로 묶어 거래건수와 거래금액을 담은 집계 파일로, 포털 설명상 2025년 10~12월 일자별 자료이며 약 195MB zip으로 받는다. 교통 분석가나 시 행정 담당자가 '출퇴근 시간대에 어느 노선·정류장에서 승차가 가장 많은가' 같은 혼잡도·수요 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 정류장 원장·노선 정보나 실시간 도착 데이터와는 노선코드·정류장번호·정류장명 같은 같은 기관 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 광주광역시의 시내버스 이용 현황을 분석할 수 있는 자료로, 2025년 10월부터 12월까지 일자별로 정리된 버스 승하차 인원 정보를 포함하고 있습니다. 구체적으로는 각 날짜를 기준으로 노선명(버스 번호), 정류장명, 시간대, 그리고 승차와 하차 각각의 거래 건수를 제공하여, 특정 시간대 또는 노선의 혼잡도와 이용 패턴을 파악할 수 있습니다. 이 데이터를 활용하면 대중교통 수요 예측, 노선 최적화, 정류장별 이용률 분석 등 다양한 방면의 연구와 행정 서비스 개선이 가능합니다. 또한, 시민들의 이동 행태를 시간대별로 세밀하게 파악할 수 있어, 출퇴근 시간대 혼잡 완화 정책이나 버스 배차 간격 조정 등에 유용하게 활용될 수 있습니다. 광주광역시 교통정책 수립 및 스마트 교통 시스템 구현에 있어 중요한 기초자료라 할 수 있습니다.
