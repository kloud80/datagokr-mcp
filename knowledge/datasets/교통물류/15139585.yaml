status: active
summary_user: 포항시 희망대로 구간의 교통량을 기준일별·링크(시작·끝 노드) 단위로 1시부터 00시까지 시간대별 24개 값으로 담은 집계 데이터다. 분석가나 사업자가 '희망대로에서 출퇴근 시간대 교통량이 얼마나 몰리는가'를 확인하거나 주변 상권·입지 분석의 입력으로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으며, 링크 아이디(link_id)나 노드 이름을 기준으로 같은 기관의 다른 도로 교통량 데이터와 이름 매핑으로만 연결한다.
limits: 희망대로 한 도로만 다루므로 포항시 전체나 다른 시군구 도로 교통량은 알 수 없다. 표준 조인 키가 없어 다른 기관 데이터와 붙일 때는 노드 이름·링크 아이디를 직접 매핑해야 한다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
