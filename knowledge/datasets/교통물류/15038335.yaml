summary_user: 광주시 버스 노선별로 노선번호·노선이름, 기점과 종점 정류소 이름, 첫차·막차 시간, 배차간격을 한 행씩 담은 노선 원장 파일(csv, 약 5KB)이다. 시민이나 분석가가 "이 노선은 어디서 출발해 어디까지 가고, 막차는 몇 시이며 몇 분 간격으로 오는가"를 확인하거나 노선별 운행시간대를 비교할 때 쓴다. 전역 조인 키가 없어 정류장 원장이나 실시간 도착 정보와는 노선번호·정류소 이름을 맞춰 붙여야 한다.
description_portal: 빛가람정보포탈을 통해 제공되고 있는 광주시 버스 노선 정보로, 시민들의 교통 이용 편의성을 높이기 위해 구성되었습니다. 버스 노선번호, 노선이름, 기점 및 종점 정류소 명칭, 첫차 및 막차 운행시간, 배차간격 등 핵심 정보를 포함하고 있어 일상적인 출·퇴근이나 지역 간 이동 시 효과적으로 활용할 수 있습니다. 특히, 광주 도시권의 주요 거점 간 연결을 고려한 정보 제공으로 지역 내 접근성을 강화하고, 교통 혼잡 해소에도 기여합니다. 다양한 노선이 시간대별로 운행되고 있어 시민의 생활패턴에 맞춘 대중교통 이용 계획 수립에 유용하며, 정기적 업데이트를 통해 신뢰성과 실용성을 동시에 갖추고 있습니다.
