summary_user: 인천항 도선·예선 일정을 건별로 담으며, 도선 상태, 도선 예정일시, 도선사명, 선박명, 도선 출발·도착 구간 등을 예선계획일자 범위와 호출부호로 조회한다. 선사·대리점이나 항만 물류 분석가가 '특정 선박의 인천항 입출항 도선이 언제 어느 구간에서 예정돼 있고 어느 도선사가 맡았는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 선박명·호출부호 같은 이름·코드 매핑으로만 이어 쓰며, Port-MIS 입출항 신고나 AIS 위치 데이터와 맞춰 보는 식으로 연결한다.
limits: 전역 조인 키가 없어 다른 입출항·선박 데이터와 붙일 때 이름·코드 매핑에 의존해야 한다. 개발계정은 일 10,000회 호출 한도가 있고 serviceKey를 쿼리로 넘겨야 한다.
