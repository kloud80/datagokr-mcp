description_portal: 해당 데이터는 예선 일정 및 도선 업무에 필요한 데이터를 통합적으로 제공하는 Open API로서 요청변수로는 예선게획일자 범위(pltPlanDtFrom, pltPlanDtTo), 호출부호(callLetter) 등이 있으며, 응답 데이터에는 도선 상태(pltStatusNm), 도선 예정일자 및 시간(pltPlanDt, pltPlanTm), 도선사명(mainpltm), 선박명(vsslNm), 도선구간 정보(pltFromNm, pltToNm) 등이 포함됩니다. 이 API는 항만 내 입출항 도선 일정 조율, 선박 운항 지원, 도선사 배치 게획 수립 등에 활용되며, 항만운영시스템(POS), 예선사 및 해양안전관리기관에서 활용할 수 있는 실시간 운항 및 안전정보가 포함되어 있습니다.
