summary_user: 경찰청이 제공하는 교통안전 위험요소 중 신호위반 관련 지점을 건별로 담으며, 지점마다 지번·도로명 주소, 위경도, 위험요소 대·중·소분류 코드, 기준일자, 촬영정보 유무와 상세내용이 들어 있고 범위는 전국이다. 운전자나 내비게이션·교통안전 분석가가 '우리 동네 어느 교차로에서 신호위반 위험요소가 관리되고 있는가'를 확인하거나 위험지점을 지도에 표시하는 데 쓴다. 실측 컬럼에서 다른 데이터와 바로 이을 전역 조인 키는 찾지 못했으므로, 무인교통단속카메라·어린이보호구역 같은 규제·단속 데이터와는 주소 문자열이나 위경도 근접으로 맞춰 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-법규위반별 데이터는 경찰청에서 제공하는 정보입니다.
