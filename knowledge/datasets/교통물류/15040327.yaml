summary_user: 서울 성북구 관내 우리마을 공동주차장을 주차장 한 곳당 한 행으로 담은 현황 파일로, 명칭·주소·관리기관·전화번호·주차면수·위도·경도·행정동이 들어 있다(csv 약 2.3KB의 소규모 목록). 주민이나 분석가가 '우리 동네 행정동에 공동주차장이 어디 있고 몇 면인가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 주차장 데이터와는 주차장명·주소나 행정동 이름을 맞춰 연결해야 하며, 주차장관리번호·요금이 있는 전국주차장정보표준데이터가 원장 역할을 한다.
