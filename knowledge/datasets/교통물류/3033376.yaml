summary_user: 대구 도시철도 2호선 상선(영남대역→문양역)의 열차번호별 역 도착 시각을 평일·토요일·공휴일 요일별로 담은 시각표 파일이며, 검증 수신 169행이다. 이용자가 특정 역에 열차가 몇 시에 도착하는지 확인해 이동 계획을 세우는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 역명 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 2호선 상선(영남대역 → 문양역) 열차 운행 시각표 정보를 제공합니다. 데이터에는 2024년 10월 7일 변경된 운행 시각표와 2024년 10월 10일 수성알파시티역(기존 대공원역) 역명 변경 사항이 반영되어 있으며, 열차번호별 출발역 및 도착역, 각 정차역의 도착 시각, 평일·토요일·공휴일별 운행 시간표 등의 항목이 포함되어 있습니다. 해당 데이터는 이용자가 열차 운행 계획과 역별 도착 시간을 확인하고 이동 계획을 수립할 수 있도록 제공되는 자료로, 도시철도 이용 편의 향상, 운행 정보 확인 및 교통 서비스 개선 검토를 위한 기초자료로 활용할 수 있습니다. 또한 요일별 운행 정보를 제공하여 이용 패턴에 따른 대중교통 이용 계획 수립에 활용할 수 있습니다. 본 데이터는 운행 시각표 및 역명 변경 등 변동 사항 발생 시 갱신되며, 변경된 열차 운행 계획을 반영합니다.'
