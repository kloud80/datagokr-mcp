summary_user: 대전광역시 서구에서 단속한 무단방치차량을 한 건씩 기록한 원천 자료로, 단속일자·차량분류·위반장소·행정동·위도·경도를 담는다(CSV 약 65KB). 구청 담당자나 분석가가 "서구에서 방치차량이 어느 동, 어느 골목에 몰리고 어느 계절에 늘어나는가"를 따져 집중 단속구역을 정할 때 쓴다. 전역 조인 키는 없어서 행정동 이름(위반동명)을 행정구역 코드에 이름으로 맞추거나, 위도·경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 CSV 데이터는 대전광역시 서구에서 발생한 무단방치차량 단속 현황을 기록한 차량·도시환경 관리 분야의 행정자료입니다. 지역 내 장기간 방치된 차량은 안전사고 위험, 도시 미관 저해, 범죄 악용 가능성 등을 야기할 수 있어, 해당 데이터를 통해 방치 차량의 발생 특성과 단속 패턴을 객관적으로 파악할 수 있습니다.‘연번’은 각 단속 건을 구분하기 위한 고유 번호이며,‘단속일자’는 방치 차량이 확인·단속된 날짜를 기록하여 연도·월·계절별 발생 경향을 분석할 수 있도록 합니다.‘차량분류’는 방치된 차량의 유형(승용, 화물, 이륜 등)을 구분함으로써 차량 종류별 방치 특성을 파악하는 데 활용됩니다.‘위반장소’는 차량이 방치된 구체적 위치를 의미하며, 도로명, 교차로 주변, 골목길 등 도시공간 특성을 파악하는 데 중요한 항목입니다.‘위반동명’은 해당 위치가 속한 행정동을 표시하여 동별 발생 빈도, 지역별 집중 관리 필요성을 판단할 수 있게 합니다.‘위도’와 ‘경도’는 각 방치 차량의 정확한 좌표를 제공하여, GIS 기반 공간 분석을 통해 방치 차량 밀집 지역, 단속 취약 구역, 주거지역·상업지역·공원 등 도시공간 유형별 발생 패턴을 시각화할 수 있습니다.이 데이터는 방치 차량 문제의 공간적·시간적 분포 분석, 집중 단속구역 설정, 도시환경 개선 정책 검토, 지역 주민 민원 대응 전략 수립 등 다양한 행정·정책 분야에서 활용 가능한 기초자료입니다.
