summary_user: 인천 계양구 안의 불법주정차 단속 구역별로 단속지역과 평일·주말 및 공휴일 단속 시작·종료 시간을 한 행씩 담은 작은 파일(CSV 505바이트)이다. 계양구 주민이나 운전자가 '이 지역에 지금 차를 세우면 단속되는가, 주말에는 몇 시까지 단속하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속지역 이름을 주소·지명과 맞추는 방식으로만 이어 쓴다.
limits: 단속지역이 이름(문자열)으로만 있고 좌표나 표준 코드가 없어 지도 표시나 다른 단속·주차 데이터와의 자동 결합이 어렵다. 계양구 한 곳만 다루므로 다른 시군구나 인천 전체 단속 현황은 알 수 없다.
