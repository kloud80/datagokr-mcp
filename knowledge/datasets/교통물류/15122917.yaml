description_portal: '유도로란, 항공기가 지상에서 주행하며 비행장의 각 지점 간을 이동할 수 있도록 설정된 항공기 이동 전용 도로를 의미합니다.유도로 식별자, 유도로 유형, 유도로 길이 및 단위, 유도로 폭 및 단위 에 대한 정보를 제공하고 있습니다.유도로 유형은 아래와 같습니다.NORMAL: 일반적인 항공기 이동을 위한 기본 유도로입니다.INTERSECTION: 두 유도로가 교차하는 지점 또는 유도로와 활주로가 만나는 교차 구간을 포함합니다.SHOULDER: 유도로 본선 양측에 위치한 포장된 가장자리 구역으로, 항공기 주익이나 엔진이 넘는 공간을 보호하거나, 배수 및 구조적 안전성을 보완하는 기능을 합니다.'
