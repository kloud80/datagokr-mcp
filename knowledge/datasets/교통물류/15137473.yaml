summary_user: 대구도시철도 1·2·3호선 환승역에서 다른 호선으로 갈아탄 이용객 수를 연도·월·호선·역 단위로 집계한 파일(CSV)로, 도착 호선별 환승인원(1·2·3호선 환승인원)이 열로 나뉜다. 교통 분석가나 시 교통정책 담당자가 '반월당역·명덕역 같은 환승역에서 어느 호선 간 환승 수요가 월별로 어떻게 바뀌는가'를 볼 때 쓴다. 전역 조인 키는 없어 역명·호선 이름을 맞춰 같은 기관의 역별 승하차 통계 등과 이어 써야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선에서 다른 호선으로 환승한 이용객의 호선별·역별 환승 현황을 제공합니다. 본 자료는 호선별 및 역별 환승 이용객 수를 기반으로 도시철도 노선 간 연계 이용 현황을 파악할 수 있도록 구성되어 있으며, 환승 수요의 변화와 역별 이용 특성을 분석하는 데 활용할 수 있습니다. 또한 노선 간 수요 균형 분석, 운영계획 수립, 혼잡 완화 정책 마련, 환승 동선 개선 등 대중교통 서비스 품질 향상을 위한 기초자료로 활용될 수 있습니다. 아울러 환승 통계를 통해 시민의 이동 경로와 이용 패턴을 분석할 수 있어 스마트교통 시스템 고도화, 환승체계 개선 및 데이터 기반 도시교통정책 수립에도 활용할 수 있습니다. 본 데이터는 매월 정기적으로 갱신됩니다.'
