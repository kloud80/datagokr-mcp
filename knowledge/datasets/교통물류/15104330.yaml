summary_user: 한국교통안전공단이 온라인 교육 플랫폼(TS배움터)에서 비대면으로 운영하는 철도안전전문가교육 기본과정의 수료인원을 연·월·교육과목별로 집계한 전국 단위 파일(csv, 약 1KB)이다. 철도안전 교육 담당자나 분석가가 사고사례·안전관리체계 등 과목별로 매달 몇 명이 수료했는지, 비대면 교육 수요가 어떻게 변하는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연·월이나 과목명을 맞추거나 같은 기관의 철도안전 자료와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 한국교통안전공단의 온라인 교육 플랫폼(TS배움터)을 활용하여 비대면 방식으로 철도안전전문가교육 기본과정을 운영 중에 있습니다. 이와 관련한 교육 수료인원 현황입니다.기본과정 내에는 총 12개 과정이 있으며 철도사고사례, 철도사고현황, 충돌사고사례, 탈선사고사례, 종사자사고사례, 기타사고사례, 인적오류사례 등으로 사례교육이 있으며 철도안전 강화를 위한 철도사고보고체계, 철도안전관리 및 수준평가, 철도안전관리체계, 철도안전법 및 종합계획, 철도안전관리체계 승인검사, 수시검사, 정기검사 등 콘텐츠로 구성되어 있습니다.
