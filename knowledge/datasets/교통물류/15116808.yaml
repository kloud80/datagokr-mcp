description_portal: 한국교통안전공단 자동차부품자기인증 시스템에 등록된 부품제작자 등록 현황 데이터입니다.자동차관리법 시행령 제8조의2에 따른 13종의 부품(브레이크호스, 브레이크라이닝, 좌석안전띠, 안전삼각대, 자동차휠, 후부반사지, 후부반사판 등)을 국내에서 판매, 유통하고자 하는 자는자동차관리법 제30조의2에 따라 부품제작자로 등록하여야 합니다. 신청서류를 준비하여 국토교통부에 신청하여 등록할 수 있습니다.이 데이터는 데이터 등록시점까지 자동차부품자기인증시스템에 등록되어있는 부품제작자 목록을 담고 있습니다.
