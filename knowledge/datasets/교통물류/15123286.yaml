summary_user: 경기도 도로대장전산화시스템에 등록된 도로 성토면을 노선번호·구간번호별로 한 건씩 담는 원천 대장 자료로, 시점·종점 위치, 방향, 연장, 사면 종류(흙사면·혼합사면 등), 최대·최소 높이, 경사도, 시종점 위·경도를 포함한다. 도로 관리자나 안전 분석가가 '경기도 도로 중 높이가 크고 경사가 급한 흙사면 성토구간은 어느 노선 어느 구간에 있나'를 찾아 사면 붕괴 위험 평가나 점검 대상 선정에 쓴다. 전역 조인 키는 없으므로 노선번호·구간번호로 같은 경기도 도로대장 계열 데이터와 맞추고, 시종점 좌표로 표준노드링크 등 도로망 자료에 공간 매칭해 이어 쓴다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템에 등록된 도로 성토면의 정보를 제공하며, 노선번호, 구간번호, 위치정보(시점/종점), 방향, 연장, 사면 종류(흙사면, 혼합사면 등), 최대·최소 높이, 경사도, 비고, 공간좌표(위도·경도) 등의 항목으로 구성되어 있습니다. 도로 성토면은 도로 지반을 안정적으로 유지하고 경사면을 형성하는 구조물로서, 도로 건설 및 유지관리의 핵심 요소입니다. 이 데이터는 도로 구간별 사면 유형 및 규모, 경사정보 등을 체계적으로 분석하여 사면 붕괴 위험 평가, 도로안전 진단, 성토구간 관리, 경관계획 수립 등에 활용됩니다. 공간정보가 포함되어 있어 GIS 기반의 위험지구 분석, 토목 설계 및 시공 관리 자료로도 유용하게 사용할 수 있습니다.
