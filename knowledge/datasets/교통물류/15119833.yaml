description_portal: 부산광역시에서 운영하고있는 도시공간정보업무포털의 굴착사업예장지별 규모정보(굴착위치관리번호, 포장내역일련번호, 포장종류, 신청연장, 신청관경, 적용건수, 기준일자)입니다. 위 데이터는 부산시에서 진행 예정인 도로·지하 시설물 관련 굴착 사업을 위치별로 규모·범위·세부 내용을 정리한 데이터입니다. 이 데이터는 시민들에게는 교통 혼잡, 소음·먼지 등의 생활 불편 예상 및 대비를, 지자체에게는 중복 굴착 최소화, 예산 절감, 효율적 공사 계획 등의 효과를 줄 수 있습니다. 그리고 도시 인프라 확충 패턴과 지역별 공사 집중도를 분석하는 데에도 도움을 줄 수 있습니다.
