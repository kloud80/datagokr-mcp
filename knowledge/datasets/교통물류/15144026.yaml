summary_user: 수원시에 설치된 전기차 충전소를 충전기 단위로 담은 건별 데이터로, 충전소명·충전기 타입과 용량·충전기 상태·사용시간·이용자 제한 여부·도로명주소와 위도·경도를 포함합니다. 수원 시민이나 전기차 운전자가 '집 근처에서 지금 쓸 수 있고 외부인도 이용 가능한 급속 충전기가 어디 있나'를 확인하는 데 쓰고, 분석가는 동네별 충전 인프라 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소·좌표로 공간 결합하거나 충전소명·충전소ID 같은 이름·코드 매핑으로 연결한다.
limits: 수원시 한 곳만 다루므로 다른 시군구나 전국 충전소와 비교하려면 별도 데이터가 필요하다. 표준 행정코드 같은 공통 조인 키가 없어 다른 데이터와 붙일 때 주소나 좌표, 이름 매칭에 의존해야 한다. 포털 활용신청은 자동승인이며, 서비스키를 붙여 호출하고 개발계정은 하루 10,000회로 제한된다.
