description_portal: 수원시의 전기차 충전소 설치 현황으로 충전소명, 사용시간, 이용자제한여부, 충전기상태, 충전기타입, 소재지위치정보 등의 데이터를 포함합니다. 수도권에서 발생하는 미세먼지 30%이상이 경유차 등 자동차에서 배출되는 오염물질로서 자동차로 인한 대기오염이 심각해지고 있습니다. 내연기관차를 친환경차인 전기차로 대체해나갈 경우 자동차로 인한 대기오염 문제를 해결할 수 있습니다. 보다 여러 곳의 전기차 충전소를 설치함으로써 전기차 사용에 지향하여 전기차 사용량을 증가시킵니다.
