summary_user: PORT-MIS로 신고된 HNS(위험·유해물질) 수령 내역을 수령 건 단위로 담은 전국 단위 파일(CSV, 약 68KB)로, 보고대상년도·물리적 수령업체·화주·화물명·수령일자·오염등급·운송방법·분담대상 여부와 분담대상 화물량(톤)을 포함한다. 해운·화학물질 분석가가 어떤 위험물질이 어느 업체로 얼마나 들어왔는지, 오염등급별로 분담금 대상 물량이 얼마인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·화물명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 해양수산부가 HNS위험물질을 수령하는 업체의 운송 현황을 신고받기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 HNS(Hazardous and Noxious Substances) 위험물질을 운송받은 업체가 그 수령량과 운송량을 등록한 정보로 구성되어 있습니다. 업체명, 수령일자, 위험물질 명칭, 수령량, 오염등급, 분담대상 여부 및 화물량 등이 포함되어 있습니다.  본 데이터는 정부 및 관계 기관이 위험물질의 국내 유통 현황을 확인하고, 해당 물질의 안전관리 정책 수립 및 분담금 산정과 같은 행정 업무에 활용될 수 있습니다. 또한 관련 업계는 자사 운송 실적 관리, 수입 통계 분석 및 관련 규정 준수를 위해 사용할 수 있습니다.
