description_portal: 한국교통안전공단에서 매년 업데이트 하여 제공하는 항공종사자 자격증명(조종사, 관제사, 운항관리사, 정비사 등) 년도별 취득현황 입니다.- 항공종사자는 항공안전법 제35조에 따라 1. 운송용 조종사 2. 사업용 조종사 3. 자가용 조종사 4. 부조종사 5. 항공사 6. 항공기관사 7. 항공교통관제사 8. 항공정비사 9. 운항관리사 로 구분됩니다.- 항공종사자 자격증명은 항공기의 운항(무선설비의 조작을 포함한다) 업무 또는 항공교통관제(무선설비의 조작을 포함한다) 업무 또는 항공기의 운항관리 업무 또는 정비ㆍ수리ㆍ개조된 항공기ㆍ발동기ㆍ프로펠러, 장비품 또는 부품에 대하여 안전하게 운용할 수 있는 성능이 있는지를 확인하는 업무 및 경량항공기 또는 그 장비품ㆍ부품의 정비사항을 확인하는 업무 시에 필요한 자격입니다.
