summary_user: 성남시 관내 도로·교차로에 설치된 무인교통단속카메라를 장비 한 대씩 위치(위경도)·대상시설명·관할경찰서명·이미지명으로 담은 건별 위치 데이터로, 범위는 성남시 한 곳입니다. 운전자나 내비·지도 서비스 사업자가 '성남시 어느 도로에 단속카메라가 있고 어느 경찰서 관할인가'를 확인하거나, 분석가가 사고 다발 지점과 카메라 위치를 겹쳐 보는 데 쓴다. 실측 컬럼에 전국 공통 조인 키는 없어 시도명·시군구명(ctprvnnm, signgunm) 같은 이름 매핑이나 위경도 좌표 기준 공간 결합으로 다른 데이터와 잇는다.
description_portal: 경기도 성남시 교통단속  카메라 위치데이터를 제공합니다.본 데이터는 대상시설명, 관할경찰서명, 시설 위경도, 이미지명 등으로 구성되어있습니다. 성남시의 교통단속 카메라 데이터는 관내 주요 도로 및 교차로에 설치된 무인교통단속장비의 위치, 설치 목적, 운영 현황 등을 포함하는 정보입니다. 이 데이터는 과속, 신호위반, 불법 유턴, 정지선 위반 등 다양한 교통법규 위반 행위를 단속하기 위해 수집되며, 성남시청 교통기획과 또는 경찰청 교통안전계와 연계해 관리됩니다. 이를 활용해 교통사고 다발 지역 분석, 교통 흐름 개선 정책 수립, 단속 민원 대응 등 다양한 행정 및 정책 업무에 활용됩니다. 또한 일부 정보는 공공데이터포털이나 성남시청 홈페이지를 통해 시민에게도 제공되어 교통법규 준수 유도와 교통안전 향상에 기여하고 있습니다.
