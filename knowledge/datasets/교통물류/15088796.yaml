summary_user: 2025년 국내에서 발생한 철도준사고(철도사고로 이어질 수 있었던 사건)를 건별로 담은 CSV 파일로, 발생일자·철도구분·노선·발생장소·열차종류·근본원인·피해액 등을 기록하며 범위는 전국이다. 철도 운영기관이나 안전 분석가가 "어떤 노선·장소유형에서 어떤 근본원인의 준사고가 자주 나는가"를 파악해 사고 위험요인을 미리 줄이는 데 쓴다. 전역 조인 키가 없어 노선명·행정구역 이름 매핑이나 같은 기관의 철도사고·운행장애 자료와 이름 기준으로만 이어 쓴다.
description_portal: 2025년 철도 준사고 발생현황철도준사고란, 철도안전에 중대한 위해를 끼쳐 철도사고로 이어질 수 있었던 사건입니다. 철도사고, 운행장애와는 다른 유형으로 관리되며, 사고 위험요인 등을 사전에 제거하기 위한 자료로 이용됩니다.
