summary_user: 제주특별자치도 내 국지도·지방도의 관측지점별 교통량 조사결과를 행정시·도로·노선·지점번호 단위로 담고, 2016년부터 2025년까지 연도별 조사값을 한 행에 나란히 둔 집계 파일(csv, 약 9KB)이다. 도로 계획·관리 담당자나 분석가가 "제주 특정 노선 관측지점의 교통량이 최근 몇 년간 어떻게 변했나"를 확인하거나 상권·입지 분석의 지점별 통행량 입력으로 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·관측지점명 같은 이름 매칭이나 같은 기관의 지점번호로만 이어 쓴다.
description_portal: '제주특별자치도 내 국지도 및 지방도 교통량 조사결과 데이터를 제공합니다.항목: 노선, 관측지점, 조사결과, 조사기간 등*최근 조사일시 : 2024.10.19(목) 07:00~2024.10.20(금)07:00, 24시간*도로 통행량을 조사하여 도로의 건설계획과 유지관리 및 도로행정에 필요한 기본 자료와 각종 연구에 필요한 기초자료 제공함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1006'
