description_portal: 본 데이터는 경상북도에서 운영하는 개인형 이동장치 대여 사업의 현황을 제공합니다. 경상북도 내 각 지역에서 개인형 이동장치, 특히 전동킥보드의 대여 사업에 대한 정보를 담고 있으며, 상호명, 운영 개시 월, 전동킥보드 대수, 운영 지역 등의 칼럼으로 구성되어 있습니다. 이 데이터는 개인형 이동장치 대여 사업의 운영 현황을 파악하고자 하는 연구자, 정책 입안자, 그리고 대중에게 유용한 자료가 될 것입니다. 운영 개시 월은 각 대여 사업의 시작 시기를 나타내며, 전동킥보드 대수는 각 사업자가 보유한 전동킥보드의 수량을 의미합니다. 운영 지역은 경상북도 내에서 각 사업자가 운영하는 지역을 명시합니다. 본 데이터는 경상북도의 교통 서비스 발전과 정책 개선에 기여할 수 있는 가치 있는 자료입니다. 데이터의 활용을 통해 경상북도의 대중교통 체계의 효율성을 제고하고, 시민의 이동 편의성을 높이는 데 기여할 것으로 기대됩니다.자료에 관한 문의는 경상북도 교통정책과 054-880-2667로 하시면 됩니다.
