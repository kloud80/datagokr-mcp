summary_user: 대구광역시 북구에 있는 화물자동차운송주선업체(이사업체 포함)를 업체 한 곳당 한 행으로 담은 목록이며, 사업체명·주소·연락처·구분(SE)을 포함한다. 북구에서 이사나 화물 운송을 맡길 주선업체를 찾는 주민, 또는 지역 주선업체 분포를 보려는 분석가가 "북구에 등록된 주선업체는 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 사업체명·주소 매칭으로만 잇는다. 허가 여부를 확인할 때는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: 화물운송주선업은 화주로부터 위탁을 받아 운송계약을 체결하고, 운송인은 직접 운송을 수행하는 대신 운송수단을 알선해주는 운송 주선 서비스업입니다.대구광역시 북구에 위치한 화물자동차운송주선업체(이사업체)들의 사업체명, 주소, 우편번호, 연락처, 구분 등의 항목을 포함하고있습니다.대구광역시_북구청_화물운송주선업체 데이터의 업체명, 주소, 전화번호 항목을 조회하는 서비스전화번호란에 개인정보의 이유로 다소 공란이 존재합니다. 활용하실때 참고 바랍니다.데이터 기준일자 (2025년 2월)
