summary_user: 2019년 인천광역시 버스정류장별로 운행일자마다 승차·하차 건수와 교통카드 승하차·현금 승차 건수를 담은 일별 집계 파일(xlsx, 약 80MB)이다. 교통 분석가나 지자체 담당자가 '어느 정류장이 어느 날 이용객이 많았고, 현금 승차 비중은 얼마나 되나'를 따지는 데 쓴다. 전역 조인 키는 없고, 정류장ID나 정류장명을 같은 기관의 정류장 원장·노선 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
