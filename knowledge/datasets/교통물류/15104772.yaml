description_portal: 제공신청에 따라 2019년도 인천광역시 정류장의 일별 이용객수 통계자료로 일자, 정류장명, 정류장ID, 이용객수(카드, 현금 등) 등을 제공합니다.본 데이터는 특정 운행일자별로 각 버스정류장에서 발생한 승차 및 하차 건수를 기록하여 정류장별 이용 규모와 흐름을 파악할 수 있도록 한다. 주요 항목에는 운행일자, 정류장명, 정류장ID가 포함되어 정류소를 식별할 수 있으며, 승차건수와 하차건수는 전체 이용량을 보여준다. 또한 카드승차건수와 카드하차건수는 교통카드 이용 현황을, 현금승차건수는 현금 결제 이용 현황을 나타내어 결제수단별 이용 특성을 분석할 수 있다.
