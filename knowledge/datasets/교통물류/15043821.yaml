description_portal: 이 데이터는 해양수산부에서 각 항만별 항만국통제(Port State Control) 현황을 파악, 제공하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 2020년도 기준 항만별로 구분된 점검선박의 수, 결함 지적 건수, 결함률, 출항정지 건수, 출항정지율 정보로 구성되어 있습니다.  본 데이터는 관련 기관에서 항만 운영 및 관리 현황 분석, 해상 안전 정책 개발, 선박 점검 및 검사 절차 개선, 항만의 결함 및 출항정지 사례 연구, 그리고 항만 관련 규제 또는 제도 수립을 위한 실증자료로 활용될 수 있습니다.
