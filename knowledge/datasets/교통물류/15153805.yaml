description_portal: 본 데이터는 행정안전부의 안전신문고를 통해 접수된 불법 주·정차 신고 중 과태료가 부과된 건에 대한 정보입니다. 특히, 연구의 핵심 주제인 횡단보도 주변에서 발생한 불법 주·정차 신고 및 과태료 부과 건이 별도로 분류되어 제공됩니다.데이터는 신고 일시, 신고 위치 정보(행정구역 또는 좌표), 그리고 과태료 부과 여부를 포함하며, 서울대학교에서 수행하는 '지역별 교통안전진단자료 조사' 연구 과제에 활용됩니다. 이 연구는 횡단보도 주변 불법 주·정차 단속 현황을 기반으로 전국 실태를 분석하고, 궁극적으로 횡단보도 주변 보행자 안전 개선 및 관련 정책적 보완 방안을 도출하는 데 목적이 있습니다.이 데이터는 교통 안전 및 보행자 보호를 위한 정책 수립의 기초 자료로 매우 중요한 가치를 가집니다.
