summary_user: 코레일이 운영하는 도시광역철도역의 장애인화장실을 한 곳씩 담은 파일로, 노선·역명·지상/지하 구분·역층·개찰구 안팎·출구번호·상세위치·화장실 구분을 기록한다. 휠체어 사용자나 이동 보조인이 "이 역에서 장애인화장실이 개찰구 안에 있는지, 몇 층 어느 출구 쪽인지"를 미리 확인하거나, 분석가가 노선별 장애인화장실 배치를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 역 시설·승하차 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 이어 써야 한다.
