summary_user: 운전적성정밀검사의 신규·특별·자격유지검사 실적을 구분별로 1999년도부터 2020년도까지 연도 열로 나눠 담은 전국 단위 집계표이며, 5KB 남짓한 CSV 파일 하나로 제공된다. 운수사업 운전자 적성검사 수검 규모가 연도별로 어떻게 변했는지, 예컨대 만65세 이상 자격유지검사 도입 뒤 수검 건수가 얼마나 늘었는지를 보려는 교통안전 정책 분석가가 쓴다. 실측 컬럼에 다른 데이터와 맞출 공통 조인 키가 없어, 검사 구분 이름이나 연도를 기준으로 같은 기관의 다른 교통안전 통계와 수동으로 맞춰 쓴다.
description_portal: '운전적성정밀검사에 대한 데이터로 신규검사, 특별검사, 자격유지검사 등의 정보를 제공합니다.[수검대상구분]* 신규검사 : 신규로 여객자동차 운송사업용 자동차를 운전하려는 자 등* 특별검사 : 벌점, 사고 등에 의한 자* 자격유지검사 : 만65세 이상인 자- 이는 이해를 돕기위한 간략한 설명으로, 상세기준은 법령정보 참고[검사장 및 도입시기 등]* 검사장 : 서울(성산, 노원, 송파), 경기남부, 경기북부, 인천, 대전세종충남, 홍성, 대구경북, 부산, 광주전남, 충북, 전북, 울산, 경남, 강원, 강릉, 제주, 상주, 이동1호, 이동2호* 이동1호/이동2호/홍성 : 신규검사 및 자격유지검사 2020년 시작* 자격유지검사 도입시기) 버스 : 2016.01.01/택시 : 2019.02.13/화물 : 2020.01.01'
