summary_user: 대구 도시철도 1·2호선 역사별로 미세먼지(PM10·PM2.5), 이산화탄소, 폼알데하이드, 일산화탄소, 이산화질소, 라돈, 휘발성유기화합물 측정값을 측정연도 단위로 담은 작은 CSV 파일(약 3.5KB)입니다. 시민이나 연구자가 '내가 이용하는 지하 역사의 미세먼지·라돈 수치가 다른 역보다 높은가'를 비교하거나 연도별 공기질 변화를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 호선·역명을 이름으로 맞춰 대구교통공사의 역 정보나 승하차 인원 데이터와 이어 쓴다.
description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야 환경관리 정보 데이터로, 도시철도 1·2호선 역사별 공기질 측정 결과 정보를 제공합니다. 데이터에는 측정일자, 역사명, 미세먼지(PM10), 이산화탄소(CO₂), 폼알데하이드(HCHO), 일산화탄소(CO), 이산화질소(NO₂), 라돈(Rn) 등 주요 실내 공기질 측정 항목별 수치 정보가 포함되어 있으며, 측정 시점별 역사 내 공기질 상태를 확인하고 비교·분석할 수 있는 자료입니다. 해당 데이터는 지하 역사 내 실내 환경 관리 현황 파악, 공기질 개선 방안 검토, 환경관리 정책 수립 및 관련 연구를 위한 기초자료로 활용할 수 있습니다. 또한 도시철도 이용 공간의 환경 정보를 공개하여 시민들이 시설 환경 관리 현황을 확인할 수 있는 자료로 활용됩니다. 본 데이터는 연 1회 갱신되며, 공기질 측정 결과 변동 사항을 반영합니다.'
