description_portal: 대전교통공사의 열차운행 운전 무사고 실적 데이터입니다.이 데이터는 운행일자별로 기관사가 근무한 근무조, 일부 마스킹 처리된 사번 정보, 해당 일자의 실제 운행 실적 거리 등을 포함하고 있어 운전 업무의 안전성과 운행 성과를 종합적으로 확인할 수 있는 데이터입니다.기관사별 안전 운행 성향 분석, 사고 예방 활동의 성과 평가, 장기적인 안전지표 관리 등 다양한 목적에 활용할 수 있습니다.데이터는 매년 1회 정기적으로 업데이트하며, 2021년 10월부터 2025년 9월까지의 기간을 포괄하고 있습니다.현재까지 누적된 총 건수는 59,358건으로, 안전운행 성과 분석에 충분한 규모를 갖춘 데이터셋입니다.
