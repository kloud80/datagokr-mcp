summary_user: 대전 도시철도 1호선 상·하선의 곡선 구간을 역구간별로 한 행씩 담은 시설 원천 목록으로, 시작·끝 위치(sta), 곡선연장, 곡선반경, 캔트, 슬랙, 설계속도, 곡선형태, 도유기 대수를 기록한다(CSV 약 1.2KB의 소규모 파일). 철도 분석가나 연구자가 '1호선에서 반경이 작고 설계속도가 낮은 급곡선 구간은 어느 역 사이인가'처럼 선형 조건과 운행 속도 제약을 확인할 때 쓴다. 전역 조인 키가 없어 다른 역·노선 데이터와는 역구간 이름을 역명으로 맞춰 대전교통공사의 다른 시설 데이터와 이어 써야 한다.
