description_portal: '- 전라남도 도로관리사업소 홈페이지에 게재된 전라남도 도로관리 주요사업 게획(사업명, 지방도 및 위임국도 사업량, 사업비 등)에 대해 조회하실 수 있습니다.- 전라남도는 도로 인프라의 효율적인 관리와 안전한 교통 환경 조성을 위해 다양한 도로 관리 사업을 추진하고 있습니다.- 도로 유지관리 및 보수 : 노후화된 도로의 포장 보수, 균열 및 파손 부위 수리, 배수시설 정비 등을 통해 도로의 안전성과 통행성을 확보합니다.- 교량 및 터널 유지보수 : 교량과 터널의 구조적 안전성을 점검하고, 필요한 보수 및 보강 작업을 실시하여 교통사고를 예방합니다.- 교통안전시설 설치 및 개선 : 교차로 및 보행자 보호구역에 신호등, 과속방지턱, 도로표지판 등을 설치하여 교통사고를 예방하고 보행자의 안전을 확보합니다.'
