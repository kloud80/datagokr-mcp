summary_user: SRT 17개 역(수서~목포)의 2020년 1~6월 승차·하차 인원을 주차별로 집계한 1회성 파일로, 역이 열(컬럼)로 펼쳐진 형태이며 단위는 명입니다. 코로나19 초기 상반기 동안 수서·동탄 같은 수도권 출발역과 부산·광주송정 등 지방역의 주별 이용객이 어떻게 달라졌는지 보려는 교통·지역 분석가가 유동인구 대체 지표로 쓴다. 실측 컬럼에 전역 조인 키(역 코드 등)가 없어, 다른 철도 승하차·역 시설 데이터와는 역 이름을 맞춰 매핑해야 이어 쓸 수 있다.
description_portal: 1. 해당 데이터는 (주)에스알에서 제공하는 SRT 역별 주별 승하차인원 데이터입니다.2. 2020년 1~6월 기간을 주별로 구분하여 각 역의 승하차인원에 대한 정보를 조회할 수 있습니다.3. 관련 역은 수서, 동탄, 지제, 천안아산, 오송, 대전, 김천구미, 동대구, 신경주, 울산, 부산, 공주, 익산, 정읍, 광주송정, 나주, 목포입니다.4. (예시) 2020년 1주차 승차인원은 20,114입니다. (단위:명)* 해당 데이터는 1회성 데이터입니다.* 2020년 7월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.
