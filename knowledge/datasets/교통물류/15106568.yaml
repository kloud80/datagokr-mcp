summary_user: 무인멀티콥터 조종자 증명을 1종부터 4종까지 종별로 나눠 기간별 취득 인원을 담은 전국 단위 집계 통계로, 포털 설명상 2021년과 2022년(8월말 기준) 수치를 담고 파일 크기는 120바이트의 작은 표다. 드론 산업 분석가나 정책 담당자가 '무인멀티콥터 조종자격 취득자가 어느 종별에 몰려 있는가'처럼 조종인력 규모와 종별 분포를 파악하는 데 쓴다. 전역 조인 키가 없고 지역 구분도 없는 비공간 데이터라서, 다른 드론 신고·비행승인 통계와는 기간(연도) 값을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 드론 등 국토교통부령으로 정하는 초경량비행장치를 사용하여 비행하려는 사람은 국토교통부령으로 정하는 기관 또는 단체의 장으로부터 그가 정한 해당 초경량비행장치별 자격기준 및 시험의 절차ㆍ방법에 따라 해당 초경량비행장치의 조종을 위하여 발급하는 증명(이하 “초경량비행장치 조종자 증명”이라 한다)을 받아야 한다. 한국교통안전공단은 항공안전법 제135조(권한의 위임ㆍ위탁)에 따라 해당 업무를 국토교통부로부터 위탁받아 운영하고 있습니다.'20년 5월 항공안전법 시행규칙 제306조제4항(초경량비행장치 조종자 증명 등) 신설, '21년 3월 "무인비행장치 조종자 증명 운영 세칙" 개정으로 인해 무인비행장치 종별 구분이 되었습니다. 공단에서 수집하고 있는 무인비행장치 중 무인멀티콥터 종별 조종자 자격 취득 현황(2021년 및 2022년(8월말기준) 통계 데이터) 현황입니다.
