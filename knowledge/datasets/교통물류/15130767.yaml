description_portal: '이 데이터는 경상북도 봉화군에 위치한 주유소들의 현황을 정리한 자료입니다. 각 주유소의 상호, 주소, 회사 구분, 영업 여부, 브랜드(폴구분) 등 다양한 항목으로 구성되어 있으며, 봉화군 내 주유소의 분포 및 운영 상태를 한눈에 확인할 수 있도록 제공합니다. 데이터는 총 9개 컬럼으로 구성되어 있으며, 기준일은 2026년 6월 30일입니다.연번: 데이터에 기록된 주유소의 일련번호로, 각 행을 구분하기 위해 부여된 고유 번호입니다.회사구분: 해당 주유소의 유형으로, ‘주유소’, ‘충전소’ 등으로 표기됩니다.상호: 주유소의 공식 상호명입니다.사업자등록번호: 주유소 사업자의 등록번호입니다.주소: 주유소가 위치한 도로명 주소입니다.업태: 주유소의 운영 형태로, ‘자영주유소’ 등으로 표기됩니다.영업여부: 현재 주유소의 영업 상태를 나타냅니다. 예: 영업, 폐업.폴구분: 주유소의 브랜드(정유사)를 나타내며, ‘SK에너지’, ‘GS칼텍스’ 등으로 표시됩니다.데이터기준일: 데이터가 집계된 기준일로, 2026년 6월 30일로 명시되어 있습니다.'
