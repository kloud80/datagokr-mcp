summary_user: 도시철도 인천2호선(검단오류역~운연역 27개역) 운영에 쓴 전력사용량(kWh)과 전기요금(원)을 월별로 집계해 두 해를 나란히 비교하고 전년대비 증감률을 함께 담은 작은 CSV 파일입니다(약 700바이트, 역사 내 임대상가 전기요금은 제외). 교통·에너지 분석가가 '인천2호선의 월별 전력 사용과 요금이 전년보다 늘었나, 어느 달에 많이 쓰나' 같은 질문에 쓰며, 포털에서 활용신청 없이 바로 받을 수 있습니다. 실측 컬럼에 전역 조인 키가 없어 인천1호선 등 다른 노선 전기사용량이나 승하차 통계와는 월(기간)과 노선명을 맞춰 수작업으로 이어 써야 합니다.
limits: 포털 설명은 2023·2024년 비교라고 하지만 실제 파일 컬럼은 2024·2025년으로 되어 있어, 어느 연도 자료인지 확인한 뒤 해석해야 합니다. 노선 전체 월 합계만 있어 역별·시설별 사용량은 알 수 없고, 다른 데이터와 붙일 공통 코드가 없습니다.
