description_portal: 인천지하철 2호선 평일 하선(검단오류역에서 운연역역 방향) 열차운행시각표 정보로 시발역, 종착역, 열차운행순번, 경유역(검단오류역 ~ 운연역) 출발시각 항목으로 구성되어 있습니다.2호선은 검단오류역에서 운연역까지 총 27개역을 운영하고 있습니다.대부분의 데이터의 시발역은 검단오류역이고 인천시청역, 서부여성회관역, 서구청역, 검암역이 시발역인 데이터가 각각 1건씩 존재합니다.모든 데이터의 종착역은 운연역입니다. 평일 하선의 열차운행은 역별로 상이하나 전체적인 열차운행은 05시 30분에서 시작하여 익일 01시 06분에 종료됩니다.
