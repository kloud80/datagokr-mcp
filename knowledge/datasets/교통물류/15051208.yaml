summary_user: 인천지하철 2호선 평일 하선(검단오류역→운연역 방향) 열차를 한 행에 한 편성씩, 시발역·종착역·운행순번과 27개 역별 출발시각으로 담은 시각표 파일이다(csv 약 61KB). 이용자가 특정 역에서 평일 운연 방향 첫차·막차가 몇 시인지, 출퇴근 시간대 배차가 얼마나 촘촘한지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 역 코드가 없어, 다른 데이터와는 역 이름을 맞춰 연결해야 한다.
limits: 평일 하선 방향만 담고 있어 상선·주말·공휴일 운행은 별도 파일이 필요하다. 역은 컬럼명(역 이름)으로만 구분되므로 역 코드 기반 데이터와 이으려면 이름 매핑을 직접 만들어야 한다. 명세상 갱신 주기는 연간·이벤트성으로 표기되어 있으므로, 실제 현행 시각표와 일치하는지는 따로 확인해야 한다.
