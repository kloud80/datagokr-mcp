summary_user: 광진구 관내 도로·교차로에 설치된 불법주정차 단속 CCTV를 한 대(지점)씩 담은 위치 목록으로, 설치 지번 주소, 단속 지점 명칭, 어린이보호구역·일반도로 같은 지점 구분, WGS84 위도·경도를 포함한다. 운전자나 지도 서비스 사업자가 '이 동네 어디에 주정차 단속 카메라가 있는가'를 확인하거나, 분석가가 어린이보호구역 단속 지점 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표를 이용한 공간 결합이나 주소·지점명 매칭, 같은 기관 코드(자치구 코드 CGG_CD)로만 이어 쓴다.
description_portal: '서울특별시 광진구_불법주정차 위반 단속 CCTV 위치정보는 광진구 관내의 주요 도로 및 교차로 등에 설치된 불법 주정차 단속용 CCTV 장비의 위치와 관련된 정보를 제공합니다. 본 데이터는 단속 카메라의 설치 지번 주소, 단속 지점 명칭, 단속 지점 구분(예: 어린이보호구역, 일반도로 등), 위도·경도 좌표 등의 위치 정보를 포함하고 있으며, 단속지점의 구체적 위치와 구분을 통해 실질적인 교통질서 유지 및 안전한 도로환경 조성을 위한 기초 자료로 활용됩니다. 제공된 좌표는 WGS84 위경도 기준으로 구성되어 있어 GIS기반 시각화 및 위치기반 서비스에 활용 가능하며, 해당 단속 정보에 대한 문의는 광진구청 교통행정과(☎ 02-450-1001)로 연락하면 상세 안내를 받을 수 있습니다. 데이터는 최신 기준으로 약 3일 전 상태를 반영합니다.'
