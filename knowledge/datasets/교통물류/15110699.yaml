summary_user: 대전광역시 도로에 있는 터널을 한 건씩 담은 API로, 터널명·도로 종류와 노선·시군구·지번주소, 시작점과 끝점 좌표, 연장·폭·높이·차로 수 같은 물리적 특성을 개별 시설 단위로 제공한다. 분석가나 교통 담당자가 '대전 시내 터널이 어느 노선 어디에 몇 개 있고, 높이 제한이나 길이는 얼마인가'를 확인하거나 긴급 대응·유지보수 계획용 시설 지도를 만들 때 쓴다. 전역 조인 키는 없어 시군구 코드(SIGNGU_CD)·시군구명, 도로 노선명·번호, 좌표로 다른 지자체 터널 데이터나 교량·지하차도 등 도로시설물 데이터와 맞춰 써야 한다.
description_portal: 대전광역시 터널조회서비스 자료는 대전시 내 도로에 건설된 각종 터널에 대한 위치 정보와 물리적 특성 데이터를 종합적으로 제공합니다. 이 자료에는 터널의 명칭, 위도와 경도 등이 포함됩니다. 사용자는 해당 데이터를 활용하여 특정 지역 내 터널 분포, 교통 동선 파악, 도로 인프라 구축 현황을 확인할 수 있으며, 도시 교통관리, 긴급 상황 발생 시 신속한 대응, 도로 시설물 유지보수 및 안전점검 등 다양한 행정과 정책 연구에도 활용 가능합니다. ※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
team:
  dept: 법무통계담당관
services:
  - op: /getTrnlList
    name: 대전광역시 터널 목록 조회
    endpoint: https://apis.data.go.kr/6300000/GetTrnlListService/getTrnlList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: '한 페이지 결과 수 (기본값 : 10)'
      - name: pageNo
        required: true
        example: '1'
        desc: '페이지 번호(기본값 : 1)'
      - name: type
        required: true
        example: xml
        desc: XML/JSON 여부
      - name: TUNNELNM
        required: false
        example: 구완터널
        desc: 자동차의 통행을 목적으로 설치된 터널의 명칭
      - name: TUNNELTYPE
        required: false
        example: 도로터널
        desc: 터널의 종류 구분
      - name: ROADKND
        required: false
        example: 고속국도
        desc: 도로의 종류
      - name: ROAD_ROUTE_NM
        required: false
        example: 대전남부순환선
        desc: 도로노선의 명칭
      - name: ROAD_ROUTE_NO
        required: false
        example: '300'
        desc: 도로의 지정 노선번호
      - name: ROADROUTEDRC
        required: false
        example: 상행
        desc: 도로노선의 방향 구분
      - name: CTPRVNNM
        required: false
        example: 대전광역시
        desc: 도로터널이 위치한 광역시, 도 명칭
      - name: SIGNGU_NM
        required: false
        example: 중구
        desc: 도로터널이 위치한 시, 군, 구의 명칭
      - name: SIGNGU_CD
        required: false
        example: '30140'
        desc: 법률로 지정된 시도/시군구의 하부 행정구역 단위인 법정동에 부여된 행정표준코드인 법정동코드 중 시도 및 시군구를 구분하는 상위 5자리
      - name: LNMADR
        required: false
        example: 대전광역시 중구 이사동 354도
        desc: 도로터널이 위치한 상세 소재지 지번주소
      - name: TUNNELBEGINLATITUDE
        required: false
        example: '36.27857685'
        desc: 도로노선의 상행 방향 기준으로 시작되는 터널 입구의 위도 좌표값 입력
      - name: TUNNELBEGINLONGITUDE
        required: false
        example: '127.43537744'
        desc: 도로노선의 상행 방향 기준으로 시작되는 터널 입구의 경도 좌표값 입력
      - name: TUNNELENDLATITUDE
        required: false
        example: '36.2786759'
        desc: 도로노선의 상행 방향 기준으로 종료되는 터널 출구의 위도 좌표값 입력
      - name: TUNNELENDLONGITUDE
        required: false
        example: '127.4285303'
        desc: 도로노선의 상행 방향 기준으로 종료되는 터널 출구의 경도 좌표값 입력
      - name: TUNNELEXTENSION
        required: false
        example: '616.91'
        desc: 터널의 총 길이(연장) (표현방식/단위 = m)
      - name: TUNNELWIDTH
        required: false
        example: '13.09'
        desc: 터널의 폭 (표현방식/단위 = m)
      - name: TUNNELHG
        required: false
        example: '0'
        desc: 노면으로부터 측정한 터널구조물(천장)까지의 높이 (표현방식/단위 = m)
      - name: CARTRKCO
        required: false
        example: '2'
        desc: 터널 안의 차량이 통행할 수 있도록 차선으로 구분되는 차로의 수 (표현방식/단위 = 차로)
      - name: REFERENCEDATE
        required: false
        example: '2022-12-10'
        desc: 데이터 작성 기준일자 (표현형식/단위 = yyyy-mm-dd)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
