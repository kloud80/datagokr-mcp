description_portal: 「항만시설 견학 정보」는 항만공사가 운영하는 견학 프로그램의 이용 현황을 정리한 데이터로, 국민과 지역사회의 항만 이해 및 체험 기회를 제공하기 위해 구축된 자료입니다. 본 데이터는 2019년부터 2024년까지의 견학 기록을 포함하고 있으며, 항만을 직접 둘러볼 수 있는 항만안내선 견학과 항만 주요 시설을 방문하는 항만시설 견학으로 구분됩니다. 총 1,178건의 기록 중 항만안내선이 1,000건 이상으로 대다수를 차지하며, 1만8천여 명이 참여해 단체 중심 체험형 프로그램으로 운영되었습니다. 항만시설 견학은 143건, 약 600명 참여로 상대적으로 소규모 운영되며, 전문적 학습이나 연구 목적에 적합한 프로그램으로 활용되고 있습니다. 연도별로는 코로나19로 제한되었던 2020~2022년을 지나, 2023년에 1만 명 이상이 참여하면서 본격적으로 활성화되었고, 2024년에도 7천여 명 이상이 참여하여 안정적인 운영 추세를 보였습니다. 이 데이터는 항만 견학의 수요 분석, 교육·홍보 프로그램 기획, 운영 효율성 평가 등 다양한 정책적·학술적 활용이 가능하며, 특히 항만을 체험하고 이해하려는 국민과 연구자들에게 유용한 자료가 될 것입니다. 데이터 구성은 일자(견학일자), 예약시설, (방문)인원수입니다. 데이터는 수시데이터입니다.
