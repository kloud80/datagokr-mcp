summary_user: 경기도 광주시 관내 버스노선별로 노선번호, 기점·종점, 상행·하행 첫차·막차 시각, 붐빌 때와 한산할 때의 배차간격을 한 행씩 담은 노선 원장 파일(CSV)입니다. 시민이 "이 노선의 첫차·막차가 몇 시이고, 출퇴근 시간에는 몇 분마다 오는가"를 확인하거나, 분석가가 광주시 노선별 운행 시간대와 배차 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 정류장·실시간 도착 데이터와는 노선번호(노선번호) 같은 이름 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 광주시 관내 버스노선의 주요 정보를 제공하는 자료입니다. 주요 제공 항목은 노선번호, 기점, 종점, 상행 첫차, 상행 막차, 하행 첫차, 하행 막차, 배차간격(첨두-붐빌때 배차간격), 배차간격(비첨두-붐비지 않을때 배차간격)로 구성되어 있습니다. 해당 데이터는 광주시 내 버스 운행 현황을 체계적으로 파악하고, 시민들의 대중교통 이용 편의를 증진하기 위해 제공되고 있습니다. 본 데이터는 대중교통이용 활성화 및 환경보호 정책의 기초자료로 활용되며, 시민들은 이 데이터를 이용하여 노선별 운행 시간과 경로를 파악하여 효율적인 이동 계획을 수립할 수 있습니다.
