summary_user: 통영시 도시정보시스템에 등록된 도로 미끄럼방지시설을 시설 한 건씩 담은 원천 목록으로, 관리번호·행정읍면동·포장재질·폭원·연장과 경도·위도 좌표가 들어 있다(CSV 약 24KB). 시민이나 도로안전 분석가가 '통영시 어느 동네 어느 도로 구간에 미끄럼방지 포장이 깔려 있고 재질은 무엇인가'를 지도에서 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 좌표로 공간 결합하거나 행정읍면동 이름, 도로구간번호(같은 기관 도로 데이터 안에서)로 맞춰 이어 쓴다.
description_portal: 통영시 도시정보시스템에서는 도로 미끄럼방지시설의 설치 위치와 특성을 체계적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 관리번호, 행정읍면동, 도엽번호 등을 통해 각 시설의 정확한 위치와 식별이 가능하며, 포장재질 정보는 시설의 구조적 특성을 이해하는 데 활용됩니다. 또한 경도와 위도 좌표가 제공되어 지도상에서 시설의 정확한 위치를 확인할 수 있으며, 이를 통해 도로 안전 관리, 사고 예방, 시설 점검 및 유지보수 계획 수립 등 다양한 행정 및 운영 업무에 활용할 수 있는 중요한 기초자료로 사용됩니다. 이러한 정보는 도로 이용자의 안전 확보와 효율적인 시설 관리를 위한 필수 자료로 제공됩니다.
