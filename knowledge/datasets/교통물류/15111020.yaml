description_portal: 대전광역시 2020년 운전자푸른쉼터 현황 자료는 택시 운전자의 안전운행과 휴식을 지원하기 위해 마련된 쉼터 운영 현황을 수록한 자료입니다. 대전시는 2020년 기준으로 중구 부사동(한밭체육관 2층)과 서구 탄방동(보라매공원 내) 등 2곳에서 운전자푸른쉼터를 운영하고 있으며, 각 쉼터의 위치, 관리 인원, 관리처(사)전국모범운전자연합회 대전시지부 등 주요 정보를 포함하고 있습니다. 이 데이터는 운전자 복지 향상, 교통안전 정책 수립, 쉼터 이용 현황 분석 등 다양한 행정 및 정책적 활용에 적합합니다. 2022년 공공데이터 기업매칭지원사업의 일환으로 구축되었습니다.
