summary_user: 경상남도의 자동차 등록대수를 차종별(승용·승합·화물·특수·이륜)·연도별(2010~2017년) 칸으로 나눠 월 구분(monthSe)마다 담은 집계 데이터이며, 건별 차량 원장은 아니다. 지역 교통 분석가나 정책 담당자가 '2010년대 경남에서 화물차와 이륜차 등록이 해마다 얼마나 늘었나' 같은 차종별 추세를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 월·연도나 차종 이름을 맞추는 방식으로만 이어 쓴다.
limits: 필드가 2010~2017년 연도별 컬럼으로 고정돼 있어 그 이후 연도나 시군구별 분포는 이 데이터로 볼 수 없고, 차량등록번호 같은 개별 차량 단위 정보도 없다. 조인 키가 없어 다른 지역·전국 통계와 결합하려면 연월과 차종명을 직접 맞춰야 한다.
