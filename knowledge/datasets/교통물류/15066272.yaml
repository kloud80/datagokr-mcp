description_portal: '인천광역시가 사회조사를 통해 제공하는 이 데이터는 인천 시민들의 통근 및 통학 지역과 이에 소요되는 평균 시간을 군/구별, 성별, 연령별 등 다양한 인구사회학적 특성에 따라 세분화하여 집계한 통계 자료입니다. 이 데이터는 지역 교통 수요 패턴, 도시 이동성(Mobility), 광역 교통망 이용 실태를 파악하고, 교통 정책, 대중교통 노선 개편, 주거 및 직장 배치 계획 수립의 기초 자료로 활용됩니다.※BASE : 통근 및 통학하는 경우해당 데이터는 국가통계포털 또는 공공데이터포털에서 확인할 수 있습니다.'
