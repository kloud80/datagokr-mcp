summary_user: 대전 도시철도 1호선 22개 역(판암역~반석역)마다 지상에서 도상면(궤도 바닥)까지의 깊이를 미터 단위(심도)로 담은 역별 정적 목록 파일이다. 역 접근 동선 계획이나 비상 대피·시설 분석 때 '어느 역이 가장 깊은가, 지상에서 승강장까지 얼마나 내려가야 하나'를 확인하는 데 쓴다. 표준 역 코드 같은 전역 조인 키가 없어 역사명을 기준으로 다른 역 위치·출입구·승하차 데이터와 이름 매핑해 이어 쓴다.
limits: 컬럼이 연번·역사명·심도 세 개뿐이라 역 좌표나 코드가 없고, 다른 데이터와는 역 이름 매핑으로만 연결된다. 범위 메타데이터는 전국·비공간으로 표기되어 있지만 실제 내용은 대전 1호선 역만 담는다.
