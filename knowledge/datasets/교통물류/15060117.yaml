description_portal: 서울교통공사 4개 환승역(동대문역사문화공원, 시청, 서울역, 충무로)의 공기질 측정 데이터를 제공하는 자료입니다. 본 데이터는 2017년 8월부터 2020년 4월까지 약 3년간 수집되었으며, 각 역별로 00시부터 23시까지 시간 단위로 기록된 환경 정보를 포함하고 있습니다. 주요 측정 항목은 이산화질소(NO₂), 미세먼지(PM10), 일산화탄소(CO), 이산화탄소(CO₂)이며, 대기오염물질별 기준치와 비교할 수 있도록 제공됩니다. 예를 들어 미세먼지는 140㎍/㎥, 이산화탄소는 1,000ppm, 일산화탄소는 9ppm, 이산화질소는 0.05ppm을 기준으로 합니다. 이를 통해 지하철 역사 내 대기질 변화를 모니터링하고, 환승객의 건강과 쾌적한 이용 환경 확보를 위한 기초 자료로 활용할 수 있습니다.
