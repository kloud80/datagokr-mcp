summary_user: 세종특별자치시 버스 노선별 운행 현황을 노선 한 줄 단위로 담은 작은 CSV 파일(약 3.6KB)로, 버스 유형 구분(BRT·광역·간선·지선·마을), 노선번호, 기점·경유지·종점, 배차간격, 운행횟수를 담는다. 세종시 주민이나 교통 분석가가 '이 노선은 어디서 출발해 어디를 거치고, 몇 분 간격으로 하루 몇 번 다니나'를 확인하거나 노선 유형별 운행 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선번호나 기점·종점 지명을 이름으로 맞춰 이어 써야 하며, 세종시 BIS·TAGO의 정류장·노선 원장이나 실시간 도착 정보와 노선번호 기준으로 대조하는 방식이 현실적이다.
description_portal: 세종특별자치시 BTR, 광역버스, 지선버스, 간선버스, 마을버스 운행현황 데이터입니다.이 데이터는 구분, 노선번호, 기점지, 경유지, 종점지, 배차간격, 운행횟수, 등록기준일로 구성되어 있으며이 데이터를 통해 세종시 총 68개 버스 노선의 기점지, 경유지, 종점지, 배차간격, 운행회수 등을 확인할 수 있습니다.세종특별자치시 교통정보센터 홈페이지(https://bis.sejong.go.kr/web/main/main.view)에서 버스 노선, 경유 정류장 및 실시간 버스 위치정보 등을 확인하실 수 있습니다.
