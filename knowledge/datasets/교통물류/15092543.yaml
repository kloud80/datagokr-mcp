description_portal: '데이터 개요항공기의 감항성 관련 정보가 적용된 대상별 현황을 연도별로 제공하는 공공데이터입니다.감항정보는 항공기 및 항공기 구성품(엔진, 프로펠러, 장비품 등)에 대해 적용된 감항성 기준 및 기술적 규제사항에 관한 정보를 의미하며, 이 데이터는 해당 정보가 적용된 대상을 연도별로 분류하여 제공합니다. 감항증명 발급, 항공기 등록검사, 구성품 관리 및 감항성 유지 정책 수립의 기초자료로 활용됩니다.데이터 제공 항목연도감항정보가 적용된 기준 연도항공기감항정보가 적용된 항공기 수엔진감항정보가 적용된 항공기 엔진 수프로펠러감항정보가 적용된 프로펠러 수장비품감항정보가 적용된 장비품 수 (예: 항법장치, 통신장비 등)계해당 연도 기준 감항정보 적용 대상 전체 수 (합계)활용 안내감항성 관리 정책 수립: 연도별 감항성 적용 현황을 통해 항공기 및 구성품의 감항정보 적용 범위 분석 가능정비 및 검사 주기 관리: 감항정보가 적용된 대상 수를 기반으로 검사계획 및 자원배분 전략 수립기술 기준 이행 점검: 장비품 및 엔진 등 부품단위의 감항정보 적용 추이를 통해 기술기준 이행현황 파악항공기 등록검사 지원: 신규 등록기 및 개조 항공기 대상의 감항정보 등록 현황 확인 가능데이터 해석 시 유의사항감항정보는 항공안전법에 따라 정기적으로 갱신되며, 항공기 상태나 설계 변경 시 재적용 가능항공기 외 구성품(엔진, 장비 등)은 감항인증 외에도 별도 인증절차를 필요로 하므로 해석 시 구분 필요연도별 수치는 감항정보가 ‘신규 적용’된 대상 수로, 누적 대수와는 차이가 있을 수 있음프로펠러 적용 대상이 0으로 나타나는 경우는 데이터 누락이 아닌 해당 연도의 신규 적용이 없음을 의미함'
