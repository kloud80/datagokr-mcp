summary_user: 대구광역시 시내버스의 노선별·월별 승차·하차·합계 이용자 수를 담은 집계 CSV 파일로, 포털 설명상 2025년 8월부터 2026년 6월까지를 다루며 버스 내 단말기의 교통카드 통신이력을 기반으로 한다. 교통 분석가나 시민이 '대구에서 이용자가 가장 많은 시내버스 노선은 어디이고 달마다 어떻게 변하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 노선 이름(버스노선)을 대구시 노선·정류장 원장이나 버스정보시스템(BIS) 자료와 이름으로 맞춰 이어 쓴다.
