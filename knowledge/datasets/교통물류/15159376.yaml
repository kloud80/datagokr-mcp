status: active
summary_user: 공주시 시내버스의 노선 단위 정보(노선 ID·노선 번호·기점·종점·회차지·첫차·막차 시간·운행 방향)와 노선별 경유 정류장 목록(정류장 ID·이름·순번·좌표)을 담은 API이며, 범위는 공주시 한 곳입니다. 시민·관광객용 앱이나 지도 서비스를 만드는 개발자가 '이 버스는 어느 정류장을 몇 번째로 지나고 첫차·막차는 언제인가'를 안내하거나, 분석가가 노선 경로를 지도에 그리는 데 씁니다. 같은 데이터 안에서는 노선 ID(route_id)로 노선 정보와 경유 정류장 좌표·순번을 묶고, 정류장 ID(stop_id)·좌표로 다른 정류장 자료와 이어 쓰지만, 실측상 기관 밖 데이터와 맞출 전역 조인 키는 없어 이름·좌표 매칭이나 같은 기관 코드로만 연결됩니다.
limits: 필수 파라미터인 노선 ID(busRouteId)를 먼저 다른 오퍼레이션에서 받아 넘겨야 하며, 정류장 경유 조회(/getStaionByRoute)와 노선 상세(/getRouteInfo)는 최소 파라미터로 호출했을 때 응답이 없었습니다(실호출 성공 2/4). 개발계정은 하루 1,000회로 제한되고, 실시간 도착 정보는 담지 않습니다.
