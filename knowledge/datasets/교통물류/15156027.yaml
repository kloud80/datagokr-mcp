description_portal: 한국교통안전공단에서 운영하는 기계식주차장 정보관리시스템에서 관리하는 정보입니다. 주차장법에 따라 20대 미만의 차량이 들어가는 기계식주차장치를 관리하는 기계식주차장 관리자등은 기계식주차장 안전관리교육을 수료하여야 하며, 교육을 받은 관리자 등은 3년에 한번 보수교육을 이수하여야 합니다. 해당 데이터는 안전관리교육을 수료한 관리자들의 접수, 결과 정보를 제공합니다. 현장, 온라인 교육 모두 제공하고 있습니다. 교육 과정은 아직 보수교육을 시행하지 않아 신규교육에 대한 정보만 제공하고 있습니다. 개인정보는 제외하고 제공합니다.
