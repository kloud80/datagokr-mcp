description_portal: 서울교통공사 편의시설위치정보는 서울지하철 역사 내 주요 편의시설의 위치를 조회할 수 있는 API입니다. 엘리베이터, 에스컬레이터, 화장실, 수유실, ATM, 무인민원발급기 등 총 15종의 시설 위치를 유형별로 제공하며, 각 시설의 설치 위치, 운영 여부, 상세 설명 등의 항목을 포함합니다. 해당 정보는 역사 내 편의시설 접근성 향상, 안내 시스템 연계 등에 활용될 수 있으며, 수시로 갱신되는 데이터를 Rest API 방식으로 제공합니다. 데이터는 매 5분(엘리베이터, 에스컬레이터), 매일(화장실, 승차권자동발매기, 수유실) 또는 수시로 갱신됩니다.
