summary_user: 전국 도로의 호선 정보를 연도(YR)별로 담은 목록으로, 도로 등급·노선 번호·노선명·참고사항을 한 행씩 기록한다. 교통안전·도로 분석가가 특정 노선 번호가 어떤 이름과 등급의 도로인지 확인하거나, 다른 도로·사고 데이터의 노선 표기를 정리하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 노선 번호(RTE_NO)나 노선명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 도로호선 관련 정보입니다.
