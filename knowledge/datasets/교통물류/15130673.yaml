summary_user: 철도산업정보센터가 수집한 철도시설 사업별로 사업비용, 사업시작일·종료일, 사업개요(구간·기간·총사업비·효과), 추진경위(조사·설계·고시·착공 등 날짜별 이벤트)를 담은 건별 파일로, 1990년부터 2024년에 시작된 전국 사업을 다룬다. 분석가나 부동산·지역 관심자가 '특정 철도 건설 사업이 언제 설계·고시·착공 단계를 거쳤고 총사업비는 얼마인가'를 확인하거나, 계획 단계 변경을 지역 가격의 선행 신호로 살피는 데 쓴다. 공통 조인 키가 없어 다른 철도 데이터(역·노선·개통 정보)와는 사업명·구간명 같은 이름 매칭으로만 이어 쓴다.
description_portal: '철도산업정보센터에서 수집한 철도시설 사업에 대한 사업비용, 사업시작일, 사업종료일, 사업개요, 추진경위 정보입니다.1990년 부터 2024년에 시작된 사업정보를 제공하고 있습니다.사업개요정보에서 사업구간,사업기간,총사업비,사업효과등의 내용을 확인할 수 있습니다.추진경위정보는 사업진행관련되어 발생하고 처리된 각종 조사, 설계, 고시, 각종 시험 및 분석, 계획수립, 착공등의 정보를 제공합니다.추진경위정보는 날짜정보 및 발생 이벤트 내용으로 정리되어 있습니다.(제공정보: 사업비용,사업시작일,사업종료일,추진경위)'
