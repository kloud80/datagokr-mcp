description_portal: 본 데이터는 2018년부터 2021년까지 경기도 용인시 각 행정동에 등록된 전기자동차 수를 연도별로 집계한 현황을 제공한다. 주요 항목은 연도, 행정동, 전기차 등록 수로 구성되어 있으며, 이를 통해 지역별 전기차 보급 수준과 연도별 증가 추세를 체계적으로 파악할 수 있다. 자료는 전기차 충전 인프라 구축, 충전소 설치 입지 선정, 친환경 교통정책 수립, 대기질 개선 대책 마련 등 다양한 분야에서 행정 및 연구 목적으로 활용된다. 특히 연도별 데이터 제공을 통해 시계열 분석이 가능하므로, 전기차 확산 속도와 지역 간 격차를 비교·검토할 수 있다. 또한, 시민과 연구자는 친환경 도시 조성 전략, 기후변화 대응, 에너지 절약 정책 등 다양한 정책 수립에 기초자료로 활용할 수 있다. 본 데이터는 각 연말 및 2021년 8월 기준으로 정리된 것으로, 당시 용인시의 전기차 등록 현황을 시점별로 종합적으로 이해할 수 있도록 구성되어 있다. 공공데이터 개방을 통해 교통 및 환경 관련 정보의 신뢰성과 활용도를 강화하고, 지속가능한 도시 발전과 시민 생활환경 개선에 기여하는 것을 목표로 한다.
