summary_user: 부산광역시 구·군별 주요도로에서 실시한 방사선 탐지 결과를 탐지 연월·구군·탐사일·탐사시간·당일 날씨·방사선량률 변동범위·최대값 탐지지점 단위로 담는다. 부산 시민이나 환경 분석가가 우리 구 주요도로의 방사선량이 어느 범위였고 어디서 가장 높게 측정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구·군 이름(gugun)을 매핑하거나 탐지 연월로 맞춰 연결한다.
description_portal: 부산광역시_구·군별 주요도로 방사선 탐지결과 데이터를 개방합니다.주요도로에서 탐지되는 방사선은 자연적 방사선이라고 볼 수 있는데 도로의 경우 도로포장재에 포함된 자연 방사선 물질에 의해 방사선이 발생할 수 있습니다. 높은 농도의 방사선은 인체에 해로워 이를 모니터링하는 것이 중요합니다. 방사선에 노출될 경우 구토, 피부손상, 탈모, 백혈병, 갑상선암 등의 질병이 발생할 수 있습니다. 개방되는 데이터에는  탐지년월, 탐지 구군, 탐사일, 탐사시간, 탐지일 날씨, 탐지년도 방사선량률변동범위, 최대값탐지지점 등의 데이터가 있습니다.(탐사일시, 시간, 날씨, 방사선량 범위, 최대값지점 등)
