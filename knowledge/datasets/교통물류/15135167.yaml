summary_user: 서울 지하철의 기준 날짜별 승차 호선→하차 호선 쌍마다 승객 수를 담고, 이를 일반·어린이·청소년·경로·장애인·국가유공자·외국인경로 유형별로 나눈 집계 파일이다(csv, 약 6KB, 활용신청 없이 받음). 교통 분석가나 정책 담당자가 '경로·장애인 등 무임 이용객은 어느 호선 사이를 많이 오가는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지하철 승하차·수송 데이터와는 호선 번호나 호선 명칭을 직접 맞춰 이어 쓴다.
description_portal: '서울시 지하철 이용객의 이동 흐름(Origin–Destination, 출발–도착)을 호선별·이용자 유형별로 세분화하여 제공하는 교통 분석용 데이터입니다. OD 데이터는 특정 시간대 또는 하루 동안 이용객이 어느 역에서 출발해 어느 역으로 이동했는지를 나타내며, 여기에 이용자 유형(예: 일반, 청소년, 어린이, 경로, 장애인 등)을 결합하여 승객 특성에 따른 이동 패턴을 분석할 수 있도록 구성된 것이 특징입니다.이 데이터를 활용하면 호선별 혼잡도 예측, 노선별 수요 분석, 이용자 유형별 이동 행태 비교, 환승 최적화, 이용자 맞춤형 정책 수립, 교통복지 기반 대중교통 정책 설계, 시간대별 혼잡 완화 시나리오 분석 등에 활용할 수 있습니다. 또한 민간 MaaS(모빌리티 서비스) 플랫폼, 도시 교통 시뮬레이션, 교통 빅데이터 기반 AI 예측모델 개발 등 스마트시티 교통정책과 연계해 실무 활용도가 매우 높습니다.'
