summary_user: 한국철도공사가 정리한 철도 용어 해설집으로, 용어 하나당 한 행에 번호·용어명·해설을 담은 전국 단위의 비공간 참고 자료다. 철도 안내·예매 시스템을 만드는 개발자나 교육자료를 쓰는 담당자가 '이 철도 전문 용어의 공식 뜻과 표기가 무엇인가'를 확인할 때 쓴다. 다른 데이터와 맞출 공통 조인 키는 없어, 용어명(문자열)으로 다른 철도 데이터의 항목명과 직접 맞춰 보는 방식으로만 연결한다.
limits: 전역 조인 키가 없어 역·노선·운행 데이터와 코드로 바로 붙일 수 없고 용어명 문자열 일치에 의존해야 한다. 필드에 분야(여객·차량·전기 등) 구분 열이 따로 없어 분야별 분류는 해설 내용으로 판단해야 한다.
