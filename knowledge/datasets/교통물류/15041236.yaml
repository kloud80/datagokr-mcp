summary_user: 부산 도시철도 2호선 역사별 화장실 위치를 화장실 한 곳당 한 행으로 담은 CSV 파일(약 8KB)로, 운영기관명·선명·역명과 함께 지상/지하 구분, 역층, 개찰구 안팎 여부(게이트내외), 가까운 출구번호, 상세위치, 화장실 구분을 담는다. 부산2호선을 타는 시민이나 안내 서비스 개발자가 '내가 갈 역의 화장실이 개찰구 안에 있는지, 몇 번 출구 쪽에 있는지'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 역 시설·승하차 데이터와는 역명·선명을 이름 매핑해 붙이거나 같은 기관의 다른 노선 화장실 파일과 같은 컬럼 구조로 합쳐 쓴다.
description_portal: 부산2호선의 역사별 지하철 화장실에 대한 데이터로 철도운영기관명, 선명, 역명, 화장실의 역층, 게이트내외, 출구번호, 상세위치 의 데이터가 있습니다.개찰구 안의 운임 구역(fare zone)에 공중화장실이 있는 지하철역 목록. 화장실이 개찰구 내부에 있는지 외부에 있는지는 역마다 다르므로, 자신이 가려는 역을 잘 확인해야 한다. 심지어 환승역은 노선마다 화장실의 위치가 다를 수 있으니 주의해야 한다.개찰구 안에 화장실이 있는 역 중에서 개찰구 바깥에는 화장실이 없다면, 역내 화장실을 쓰려면 이용료를 내고 개찰구를 통과해야 한다. 즉, 실제로 지하철을 이용하지 않는다면 유료 화장실이 되는 셈이다.2023년 10월 7일부터 서울교통공사 구간에 한해 교통카드 소지자는 하차 후 동일 역 동일 노선 게이트에서 15분 이내에 재승차 시 1회에 한해 재승차 환승 할인이 적용된다. GTX-A는 10분 이내로 재승차 환승 할인이 적용된다. 이를 이용해 나갔다 오면된다.참고로, 수도권 전철은 노선도에 개찰구 안에서 화장실 있는 역을 표시해 준다.
