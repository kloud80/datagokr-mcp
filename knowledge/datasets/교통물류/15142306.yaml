summary_user: 공단 운항관리 대상 연안여객선의 운항 실적을 출발일자·출발기항지별로 집계해 계획 대비 운항 선박수·운항건수, 운송인원수, 기상특보로 인한 운항취소 건수를 담은 전국 범위 통계다. 도서 주민·여행객이나 분석가가 '특정 출발 항구에서 어느 날 계획 대비 실제 운항이 얼마나 이뤄졌고 기상특보로 몇 편이 취소됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 출발기항지코드(dptre_portcl_cd)를 같은 기관의 연안여객선 항로·운항상태 데이터와 코드나 이름으로 맞춰 이어 쓴다.
limits: 포털 안내상 참고용 통계로 국가 통계 등 실제 데이터와 차이가 있을 수 있다. 출발기항지 단위 집계라 개별 항로·선박·운항편의 실시간 결항 여부는 알 수 없다. 개발계정은 일 100회 호출로 제한된다.
