description_portal: '○ 통계개요* 통계명 : 시계지점별 교통량* 통계종류 : 서울시 시계지점별 교통량을 제공하는 일반ㆍ조사통계* 작성목적 : 서울시 주요 시계지점별 교통량을 조사하여, 도로의 건설, 유지관리 및도로 운영에 필요한 기본자료와 각종 연구에 필요한 기초자료를 제공하는것을 목적으로 함* 조사체계 : 서울특별시, 서울지방경찰청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 주요 시계지점별 교통량(차량검지기를 통해 조사된 1일양방향 전체 차량교통량) 현황 등○ 용어설명* 평균 일 교통량(ADT: Average Daily Traffic) : 조사기간의 총 교통량/조사일수* 시계(유출입)지점 : 시와 주변지역으로 유출입하는 도로 및 교차로를 연결하는 권역도심지점 : 서울시내 도심 4대문안 유출입 지점교량지점 : 한강의 남북간 연결대교 지점간선도로지점 : 타 지점군에 속하지 않는 간선도로 지점'
