summary_user: 여수시 시민여객선 운임지원 사업과 관련된 항로별 운항 정보를 담은 파일 데이터로, 항로명별로 기항지명과 기항지 순서, 사용 여부를 행 단위로 담는다(CSV 약 2.8KB의 소규모 목록). 여수 도서 주민이나 관계기관이 '이 항로는 어떤 섬을 어떤 순서로 거쳐 가는가'를 확인하거나, 운임지원 대상 항로를 관리하는 데 쓴다. 전역 조인 키가 없어서 다른 여객선 데이터와는 항로명·기항지명을 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 여수시 시민여객선 운임지원 사업과 관련하여 항로별 운항 현황을 체계적으로 관리하기 위한 자료로, 여객선이 운항하는 노선의 기점, 종점, 경유지 및 운항 구간에 대한 정보를 포함하고 있습니다. 항로별 운항정보를 통해 도서지역과 육지를 연결하는 여객선 운항 현황을 확인할 수 있으며, 시민여객선 이용자와 관계기관의 업무 수행에 필요한 기초자료로 활용될 수 있습니다.데이터에는 항로명, 출발지, 도착지, 중간기항지, 운항구간 등 항로 운영과 관련된 기본 정보가 포함될 수 있으며, 여객선 운임지원 대상 항로 관리, 터미널이용료 산정, 운항 노선 현황 파악 및 관련 행정업무 지원에 활용 가능합니다. 또한 도서지역 주민의 교통 접근성 향상과 해상교통 정책 수립, 교통복지 서비스 제공, 통계 분석 등의 목적으로 활용할 수 있습니다.
