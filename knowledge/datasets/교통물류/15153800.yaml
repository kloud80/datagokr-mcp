description_portal: 경기도 하남시 ITS 체계 내 전광표지(VMS) 장비의 현황을 관리하기 위한 VMS 시설관리 기준정보로, 장치아이디·장치위치명·설치주소·좌표 등 위치 기반 정보를 통해 현장 점검 및 시설 자산관리에 필요한 기반자료를 제공합니다. 웹캠모델명은 현장 상황 모니터링 장비의 구성 요소를 나타내며, 설치일자와 사업명은 장비 연식·사업 이력 확인에 활용됩니다. 또한 모듈전원차단온도, 팬동작기준온도, 히터동작기준온도 등은 전광표지 하드웨어 보호설정으로, 온도 변화에 따른 장비 손상을 방지하는 핵심 파라미터입니다. 모듈장애판단확률기준, 재시도회수, 최대응답대기시간은 장애 발생 시 판단 기준과 통신 안정성을 확보하기 위한 값으로, 유지보수·고장판단 체계 구축에 중요합니다.
