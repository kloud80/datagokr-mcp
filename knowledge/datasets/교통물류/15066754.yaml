summary_user: 전국 161개 지자체를 대상으로 수집한 버스정류장 수를 전체 정류장과 지붕이 있는 유개 정류장으로 나눠 지역(구분)별로 담은 집계표이며, 파일 크기가 316바이트에 불과한 소규모 요약 자료다. 정책 담당자나 분석가가 "우리 시도의 버스정류장 중 유개 정류장 비율은 다른 지역과 비교해 어느 정도인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도 이름(구분)을 맞춰 연결해야 하며, 정류장 위치 원장이나 실시간 도착 정보와는 개별 정류장 단위로 이어지지 않는다.
description_portal: 한국교통안전공단에서 전국 161개 지자체를 대상으로 수집한 전국 대중교통 버스정류장 현황 자료입니다.전국(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주) 버스정류장을 전체 버스정류장, 유개버스 정류장으로 세분화하여 현황을 제공하고 있습니다.해당 데이터를 통해 대중교통 수단 및 시설 현황을 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
