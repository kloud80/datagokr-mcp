description_portal: '한국교통안전공단은 안전한 저고도 운항환경 조성을 위해 국내 설치된 항공장애 표시등 및 주간표지를  정기적으로 검사하고 있습니다.해당 데이터는 항공장애 표시등  업무관리시스템 게시판에  대한 내용입니다.공지사항, 자료실에 등록되어 있는 게시물 제목과 등록일 수정일에 대한 정보입니다. 검사표 작성, 관리대장 작성 등에 대한 내용과 검사 시 유의사항 등 다양한 정보를 안내하고 있습니다. 이를 통해 공역 내 항공장애물(장애등, 주간표지 등) 분포와 특성을 파악하고, 안전기준에 따른 적절한 조치를 위한 기초 자료로 활용됩니다.작성 기준 연도 :  2019~2025'
