summary_user: 경상북도 성주군 관내 불법주정차 위반 건별로 신고일시·단속장소·단속구분·위반구분·과태료 부과 여부를 담은 파일(CSV 약 28KB)이다. 군민이나 분석가가 성주군에서 어느 장소·시간대에 주정차 단속과 과태료 부과가 몰리는지, 주정차 취약 구역이 어디인지 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 단속장소 이름을 주소·지명으로 매핑하거나 같은 기관(성주군) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 성주군 관내에서 발생한 불법주정차 위반 행위에 대한 과태료 부과 현황을 체계적으로 정리한 정보이다. 위반 차량의 단속 일시, 위치, 위반 유형 등 주요 행정처분 사항을 포함하여 불법주정차 관리의 기반 자료로 활용될 수 있도록 구성하였다. 성주군은 지속적인 교통 질서 확립을 위해 단속 건수를 주기적으로 관리하고 있으며, 본 데이터는 해당 행정 절차의 투명성을 제고하기 위한 목적을 가진다. 이용자는 제공된 정보를 통해 지역별 위반 추세를 파악하고 정책 수립이나 연구 분석에 필요한 근거 자료로 활용할 수 있다. 또한 데이터는 민원 업무 처리, 주정차 취약 구역 발굴, 단속 효율성 향상 등 다양한 행정 서비스 개선에도 기여한다. 각 항목은 중복 없이 명확하게 구분되어 있으며 사용자 이해도를 높이기 위해 상세한 속성 설명을 포함하였다. 이를 통해 성주군의 교통질서 관리 현황을 직관적으로 파악할 수 있도록 하였다.
