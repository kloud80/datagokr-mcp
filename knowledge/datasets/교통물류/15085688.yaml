summary_user: 부산교통공사가 운영하는 부산 3호선 전동차의 호차(객차)별 교통약자좌석 수, 임산부좌석 수, 출입문 수를 편성유형과 함께 담은 작은 파일(CSV 약 2.4KB)이다. 휠체어 이용자나 임산부가 3호선에서 어느 호차에 교통약자석·임산부석이 몇 석 있는지 확인하거나, 분석가가 노선별 교통약자 편의시설 현황을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노선의 호차별 교통약자정보와는 운영기관명·선명 같은 이름을 맞춰 이어 붙여야 한다.
description_portal: 부산교통공사에서 관리하는 3호선 역들의 호차별교통약자정보에 대한 철도운영기관명,선명,편성유형,호차번호,교통약자좌석수,임산부좌석수,출입문수 입니다.참고로 (도시ㆍ광역철도 차량) 전국단위 조사 시 기준적합 설치율 97.3%로 ‘21년에 비해 1.3%p 상승했다. 경부ㆍ동해ㆍ경원선 등 한국철도공사 운영 구간 및 대구 1호선, 광주 1호선, 대전 1호선, 우이신설선은 기준적합 설치율 100%로 나타났다. 의정부경전철, 신림선, 용인경전철은 목적지표시 등이 기준에 적합하지 않았다.   * (철도차량) 전국단위 조사시 기준적합 설치율 99.4%로 조사대상 중 가장 높았으며, 향후 노후 열차가 신규 열차로 대체됨에 따라 100%에 근접할 것으로 예상 됩니다.
