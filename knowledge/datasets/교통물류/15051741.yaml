summary_user: 서울시 버스정류소 한 곳마다 정류소번호(ARS-ID), 정류소명, 경도·위도 좌표, 노드ID, 정류소 유형을 담은 건별 위치 원장이며, 포털 설명상 2022년 4월 기준 자료다. 지도 위에 정류장을 찍거나 특정 주소·시설에서 가장 가까운 버스정류소를 찾으려는 앱 개발자·교통 분석가가 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 실시간 버스도착 정보 등과는 정류소번호(STOPS_NO)나 노드ID, 정류소명 매핑으로 이어 써야 한다.
limits: 인증키를 data.seoul.go.kr에서 따로 받아야 하며, 포털 활용신청과는 별개다. CSV에서는 5자리 정류소번호의 앞자리 0이 빠지므로 4자리 값은 앞에 0을 붙여 맞춰야 하고, 같은 번호를 쓰는 두 정류장은 A·B 접미로 구분된다. 다른 데이터와 공통으로 쓰는 표준 코드 키는 확인되지 않았다.
