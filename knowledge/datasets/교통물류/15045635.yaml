summary_user: 고속도로 노선(도로명)과 양방향 콘존(구간)별로 연도마다 1~12월의 월 교통량 변동계수를 담은 집계 파일로, 범위는 전국이며 CSV 약 60KB 규모다. 교통 분석가나 도로 운영 담당자가 "특정 고속도로 구간은 휴가철·명절이 있는 달에 평소보다 교통량이 얼마나 늘어나는가"를 확인하거나 월별 수요 예측 보정에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 고속도로 교통량·콘존 데이터와는 도로명·콘존명 같은 이름 매핑이나 한국도로공사 내부 코드로만 이어 쓴다.
description_portal: 본 데이터는 고속도로 노선별 월간 교통량의 변동 특성을 수치화하여 제공하는 공공자료이다. 한국도로공사에서 관리하며, 도로명, 월별, 구간 등의 항목으로 구성되어 있다. 각 도로 구간의 월별 교통량 차이를 계수 형태로 나타내어 계절적 요인, 휴가철, 명절 등 시기별 교통 흐름의 변화를 정량적으로 분석할 수 있도록 지원한다. 해당 데이터는 교통 수요 예측, 혼잡도 해소 방안 마련, 도로 운영계획 수립 등에 활용 가능하다. 또한 시계열 기반의 데이터이므로 중장기 교통 패턴 변화 분석이나 정책 효과 검토에도 유용하게 쓰인다. 본 자료는 고속도로 이용 행태에 대한 구조적 이해를 돕고, 체계적 도로 인프라 운영에 활용될 수 있다.
