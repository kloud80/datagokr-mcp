summary_user: 충청남도 서산시 관내 자동차 대여업소(렌터카 업체)를 업소 한 곳당 한 행으로 담은 목록 파일로, 업체명·대표자·소재지 주소·전화번호·위도·경도·데이터기준일을 담는다(csv 약 2.6KB 규모). 서산에서 차를 빌리려는 시민이나 위치기반 앱 개발자가 '내 위치 근처에 어떤 렌터카 업체가 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 소재지 주소나 좌표(위도·경도)로 지도 위에 겹쳐 보거나 업체명으로 맞춰 이어 쓴다.
