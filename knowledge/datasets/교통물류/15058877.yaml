summary_user: 서울시 교통정보 시스템(TOPIS)이 제공하는 실시간 돌발 정보를 담은 외부 오픈API로, 돌발 아이디·발생 일자·발생 시각 등 돌발 건별 현황을 조회한다. 운전자나 교통 분석가가 지금 서울 도로에 어떤 돌발상황이 있는지 확인하는 질문에 쓰고, 이력을 쌓으면 상습 정체 구간 분석에도 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: data.seoul.go.kr 인증키(path 파라미터 KEY)가 필요하며 포털 활용신청과는 별개다. 응답 필드 중 명세상 의미가 확인된 것은 결과 코드(CODE)와 메시지(MESSAGE) 정도이고, 전역 조인 키가 없어 자동 결합은 어렵다. 실시간 조회이므로 과거 이력은 직접 적재해야 한다.
