summary_user: 행정안전 통계연보 '안전정책/생활안전' 편에 수록된 내수면 유·도선 안전사고를 연도별·전국 단위로 집계한 통계로, 합계·대형사고·소형사고별 안전사고 건수와 사망자 수를 담는다. 안전정책 담당자나 분석가가 '강·호수 유람선·도선 사고와 사망자가 연도별로 어떻게 변했고 대형사고 비중은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나 같은 기관(행정안전부) 통계연보의 다른 생활안전 통계와 이름 대응으로만 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '안전정책/생활안전' 중 '내수면 유·도선 및 안전사고', '연도별 내수면 유·도선 안전사고'에 관한 통계입니다. 합계(안전사고, 사망), 대형사고(안전사고, 사망), 소형사고(안전사고, 사망) 등 연도별 내수면 유·도선 안전사고를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
