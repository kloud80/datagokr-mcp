summary_user: 서울 서대문구에 등록된 일반화물자동차운송사업체를 업체 한 곳당 한 행으로 담은 파일로, 면허종류·업체명·도로명주소·차량대수·현재 운영여부를 기록한다(포털 기준일 2023.6.26, CSV 약 1.3KB 규모). 화주나 물류업체가 서대문구 안에서 허가받은 운송사인지, 몇 대의 차량을 보유하고 지금 영업 중인지 확인하는 데 쓴다. 전역 조인 키가 없어 업체명이나 주소로 전국화물자동차운송사업자표준데이터 같은 화물운송 허가 원장과 맞춰 이어 쓴다.
description_portal: '서울특별시 서대문구 일반화물자동차운송사업자 현황 (제공데이터 : 면허종류, 업체명, 도로명주소, 차량대수, 현재운영여부 )데이터 입니다.서울특별시 서대문구 일반화물자동차운송사업자 현황 데이터는 서대문구에 등록된 일반화물자동차운송사업체에 대한 상세 정보를 제공합니다. 이 데이터는 주로 지역 물류 산업 동향 분석, 운송 정책 수립, 사업자 관리 및 감독에 활용될 수 있습니다. 또한, 물류 관련 연구자나 기업들은 이 정보를 바탕으로 시장 경쟁 환경을 분석하거나, 신규 사업 진출 전략을 수립하는 데 참고 자료로 활용할 수 있습니다.데이터기준일 : 2023.6.26.'
