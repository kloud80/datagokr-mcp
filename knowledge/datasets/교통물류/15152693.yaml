summary_user: 경상북도 의성군이 안전신문고로 접수된 횡단보도 등 불법 주정차 신고를 건별로 담은 파일로, 신고일시·신고위치·과태료 부과 여부를 담는다(CSV 약 2.8KB의 소규모 파일). 의성군 주민이나 교통안전 분석가가 '어느 장소에서 불법 주정차 신고가 반복되고, 신고 건 중 실제 과태료가 부과된 비율은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 신고위치의 장소명이나 같은 기관(의성군) 기준으로만 맞춰 이어 쓴다.
limits: 표준화된 주소 코드·좌표가 없어 지도 위 정확한 위치 결합이나 다른 시군과의 자동 연계가 어렵고, 범위는 의성군 한 곳에 한정된다. 파일 크기가 작아 건수가 적으므로 통계적 일반화에 주의한다.
