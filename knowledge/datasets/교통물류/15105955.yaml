summary_user: 하남시 공공시설에 설치된 전기차 충전소를 충전소·충전기 단위로 담은 건별 원천 파일로, 운영기관·충전소명·충전기 유형·충전용량·시설구분·소재지 주소를 기록한다. 하남시 주민이나 전기차 이용자가 가까운 공공시설 중 급속 충전기가 있는 곳을 찾을 때, 또는 분석가가 시설 유형별 충전 인프라 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 충전소 데이터와는 주소(소재지주소)나 충전소명을 맞춰 연결해야 한다.
