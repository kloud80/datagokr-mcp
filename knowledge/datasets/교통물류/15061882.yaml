summary_user: 2024년 전국 유도선(유람선·도선·차도선 등) 업계의 인력 현황을 시·도별로 집계한 표로, 사업자 수, 선원(구조요원) 수, 기타 종사자 수와 그 합계를 담으며 건별 원천이 아니라 404바이트 크기의 작은 CSV 집계 파일이다. 정책 담당자나 분석가가 '어느 시·도에 유도선 사업자와 구조요원이 얼마나 배치되어 있고 사업자당 종사자는 몇 명인가'처럼 지역별 산업 규모와 안전관리 인력을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시·도 이름(구분)을 맞춰 매핑하는 방식으로만 이어 쓴다.
limits: 시·도 단위 집계표라 개별 사업자·선박·항로 단위 분석이나 선박 위치·입출항 추적에는 쓸 수 없고, 행정코드 같은 조인 키가 없어 이름 매핑이 필요하다. 해운·항만 핵심 범위에서는 선원·해양안전 성격의 보조 자료로 분류되어 있다.
