description_portal: 2024년 전국 유도선(관광 유람선, 도선, 차도선 등) 산업과 관련된 인력 현황을 표로 정리한 자료이다. 각 시·도별로 구분되어 있으며, 사업자 수, 선원 수, 구조요원 수, 종사자 수 등이 숫자로 집계되어 있다. 예를 들어, 특정 지역의 사업자 수가 몇 명인지, 해당 선박에 종사하는 선원 수가 얼마나 되는지, 안전을 위해 배치된 구조요원 수가 몇 명인지 등을 확인할 수 있다. 이를 통해 지역별 유도선 산업의 규모나 안전관리 인력 배치 현황 등을 비교하거나 정책 수립 시 참고자료로 활용하기 적합하다. 특히, 안전관리 측면에서 구조요원 수와 선원 수의 비율이나, 사업자 대비 종사자 수를 분석하면 현장의 안전 수준이나 추가 인력 수급 필요성을 파악할 수 있다. 전반적으로 유도선 산업의 운영 실태와 인적 자원의 분포를 한눈에 보여주는 자료라고 할 수 있다.
