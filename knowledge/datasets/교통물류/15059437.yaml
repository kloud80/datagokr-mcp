summary_user: 대전광역시 공영·민간 주차장을 주차장별로 한 건씩 담은 API로, 명칭·주소·좌표와 주차장 구분·유형, 총 주차구획 수, 요일별 운영시간, 부제 시행 여부, 무료 기본시간, 예약 서비스 여부를 제공한다. 운전자나 지도·내비 서비스 개발자가 '대전에서 지금 목적지 근처에 열려 있고 무료 시간이 있는 주차장이 어디인가'를 찾을 때 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 주차장 ID(PARKING_ID)는 자체 식별자로만 쓰고, 다른 데이터와는 주차장 이름·주소 매칭이나 좌표(위도·경도) 기반 공간 결합으로 잇는다.
description_portal: 대전광역시 주차장정보 제공 API 서비스2는 대전 지역에 위치한 공영 및 민간 주차장에 관한 다양한 정보를 체계적으로 제공합니다. 이 데이터는 주차장 명칭, 위도 경도 주소뿐 아니라 주차장 구분 유형, 총 주차구획 수, 운영요일 및 시간, 주차부제 시행 여부, 무료 기본 시간, 예약 서비스 시행 여부 등 세부 항목을 포함하고 있습니다. 이를 통해 이용자는 주차장 위치와 이용 가능 시간을 명확히 파악할 수 있으며, 행정기관은 주차장 관리와 정책 수립에 필요한 정확한 기초 자료로 활용할 수 있습니다.. 표준데이터의 갱신주기는 개별 파일마다 다릅니다.(기관에서 등록한 데이터를 취합한 것으로 개별 파일별 갱신시점이 다름) 전국표준데이터의 취합시점은 월말 일괄 취합됩니다.
