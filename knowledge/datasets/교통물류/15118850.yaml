summary_user: 최근 5년간 전국 어린이보호구역에서 발생한 12세 이하 어린이 교통사고를 발생년별로 집계한 통계로, 사고건수와 사망·중상·경상·부상신고자수를 담은 235바이트 크기의 작은 CSV 파일이다. 스쿨존 어린이 교통사고가 해마다 늘었는지 줄었는지, 사망·중상 같은 심각한 피해가 어떻게 바뀌었는지 확인하려는 학부모·지자체 담당자·정책 분석가가 쓴다. 전역 조인 키나 지역 코드가 없는 전국 단위 비공간 집계이므로, 다른 데이터와는 발생년 기준으로 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '- 최근 5년 간 어린이보호구역에서 발생한 12세 이하 어린이 교통사고 통계  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수    ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우. (99년까지는 72시간 이내)    ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우.    ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우.    ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우.- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨- 교통사고분석시스템(https://taas.koroad.or.kr)의 데이터를 바탕으로 함  * 교통사고분석시스템>통계분석>교통사고상세통계>경찰DB- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
