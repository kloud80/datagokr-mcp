summary_user: 충주시 시내버스 노선을 노선 한 줄씩 담은 원장 파일로, 노선명·노선아이디·노선설명·총경로거리(km)·시작/종료 정류장아이디를 담는다(CSV 약 34KB). 충주시 대중교통을 분석하는 사람이 '이 노선은 어디서 출발해 어디서 끝나고 운행 거리는 얼마인가'를 확인하거나 노선별 거리 비교·교통지도 구축에 쓴다. 전역 조인 키는 없어서, 같은 기관의 정류장 데이터와 시작·종료 정류장아이디로 잇거나 노선명·노선아이디로 이름 매핑해 연결한다.
