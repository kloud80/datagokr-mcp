summary_user: 경기도 일반국도의 상시 조사 교통량을 연도·노선(호선명·호선코드)별로 묶어 1월부터 12월까지 월별 평균값으로 담은 집계 자료다. 도로 관리자나 분석가가 '어느 국도에서 여름 휴가철이나 겨울에 교통량이 얼마나 늘고 주는가'처럼 계절별 증감과 노선 간 집중도를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 호선코드(route_cd)나 호선명을 기준으로 이름·코드 매핑을 거쳐 같은 기관의 도로·교통 자료와 이어 쓴다.
description_portal: 이 데이터는 일반국도별로 월별 평균 교통량을 연도별로 기록한 자료로, 호선명과 호선코드, 각 월(1월~12월)의 교통량 수치를 포함합니다. 계절 변화에 따른 도로 이용량의 증감 추이를 파악할 수 있어 교통시설 유지보수, 계절별 수송대책 수립, 관광객 유입 예측 등의 다양한 정책 분야에서 활용됩니다. 도로별 교통량 변화를 비교하여 특정 구간의 교통 집중도를 분석하고, 장기적 교통 인프라 계획 및 환경영향평가 자료로도 유용합니다. 특히 연도 및 호선별로 세분화된 데이터는 시간적·공간적 비교 분석에 효과적입니다.
