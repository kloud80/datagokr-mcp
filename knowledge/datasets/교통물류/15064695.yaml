summary_user: 부산 3호선 도시광역철도역 하나하나의 한글 역명과 영문·로마자·일본어·중국어(간체·번체) 표기를 역 단위로 담은 파일(xlsx, 약 11KB)이다. 외국인 안내 표지·관광 앱·번역 서비스를 만드는 사업자나 분석가가 '이 역의 공식 영문·일본어·중국어 표기는 무엇인가'를 확인하는 데 쓴다. 역 코드 같은 공통 조인 키가 없어서, 다른 철도 데이터와는 역명·선명 텍스트를 맞추거나 같은 기관(국가철도공단) 자료끼리 이어 쓴다.
description_portal: 부산에 위치한 부산3호선의 도시광역철도역들의 한글,영문,로마자,일본어,중국어(간체,번체) 등의 정보입니다.역명(驛名 / Name of station)은 철도역(정거장)의 명칭을 말한다.① 노선명 및 역명 표기문자는 한글로 최대 6자 이내로 정하는 것을 원칙으로 하되, 5자 이상으로 정할 경우에는 4자 이내의 축약 역명까지 동시에 정하여야 한다.② 철도시설관리자 및 철도운영자는 한글 역명과 더불어 외국인 관광객의 안내 등을 위하여 외국어(로마자, 한자) 역명을 표기하여야 한다.1. 한글 명칭과 한자 명칭이 서로 다른 때에는 한글 명칭을 우선 고려할 것2. 역명은 한글 맞춤법에 따를 것3. 로마자 표기는 국어의 표준 발음법에 따라 적는 것을 원칙으로 하며, 정부에서 정한 국어의 로마자 표기법에 따를 것. 다만, 일반적으로 국어와 외래어가 혼용하여 사용되고 있는 시청, 광장, 종합운동장 등은 번역하여 시티 홀(City Hall), 스퀘어(Square), 스포츠 콤플렉스(Sports Complex) 등으로 표기 가능
