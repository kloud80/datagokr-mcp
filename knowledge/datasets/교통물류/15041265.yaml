summary_user: 부산교통공사가 운영하는 도시철도 노선의 역사 안 ATM을 한 대씩 담은 목록 파일로, 노선·역명·지상지하 구분·층·상세위치·금융기관명·이용시간·연락처를 담는다(CSV 약 6KB 규모). 부산 지하철 이용자가 '이 역에 어느 은행 ATM이 몇 층 어디에 있고 몇 시까지 쓸 수 있나'를 확인하거나, 분석가가 역별 금융편의시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·노선명 문자열을 맞춰 연결해야 한다.
limits: 역 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 역명·노선명 표기 차이를 직접 정리해야 한다. 파일 범위가 '전국'으로 분류돼 있으나 실제 내용은 부산교통공사 노선에 한정되며, 좌표가 없는 비공간 데이터다.
