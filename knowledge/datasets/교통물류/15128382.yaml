description_portal: 2024년도 분묘이전비 산출내역은 국가철도공단의 보상업무 중 분묘 이전과 관련된 보상금 산정 기준을 나타내는 자료로, 유연분묘와 무연분묘로 구분하여 금액을 산출합니다. 유연분묘는 2개 감정평가법인에서 제공된 각 항목별 금액을 산술평균하여 산정하며, 이는 실제 분묘 소재지와 관계인 권리 등을 고려한 평가 방식입니다. 무연분묘는 유연분묘 산정 기준에서 4분판 1매 등을 포함한 항목별 기준 금액의 50%를 적용하여 산출합니다. 본 자료는 분묘이전 간접비 산출의 투명성과 합리성을 확보하기 위한 기준 자료로 활용되며, 보상 집행의 공정성 확보와 관련 민원 예방을 위한 필수 공공 보상정보입니다.
