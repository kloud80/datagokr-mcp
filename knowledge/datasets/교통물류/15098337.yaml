summary_user: 세종특별자치시 안에 설치된 긴급차량 우선신호시스템을 설치 지점별로 한 건씩 담은 원천 목록으로, 설치 장소명(instlPlace), 지번 주소, 위도·경도 좌표를 제공한다. 소방·구급 동선을 분석하는 담당자나 교통 분석가가 '세종시에서 긴급차량 우선신호가 설치된 교차로는 어디이고 출동 경로와 얼마나 겹치는가'를 지도에서 확인할 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소 문자열 매칭이나 위경도 좌표의 공간 결합으로 이어 써야 한다.
limits: 설치 위치(주소·좌표)만 담고 있어 신호 작동 이력이나 긴급차량 통과 실적은 알 수 없으며, 범위는 세종시 한 곳에 한정된다. 공통 코드 키가 없어 다른 기관 데이터와 붙일 때는 주소 표기 차이를 직접 맞춰야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 5,000회까지 호출할 수 있다.
