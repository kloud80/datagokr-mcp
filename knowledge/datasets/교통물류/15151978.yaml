description_portal: 2024년도 증평군 횡단보도 불법주정차에 대한 단속 결과 데이터입니다.단속 일시, 단속 장소, 과태료 부과 여부로 구성되었습니다.단속일시 정보는 분 단위까지, 단속장소는 지번 주소이며, 과태료 부과 여부는 과태료/계도로 구분되어 있습니다.해당 정보는 특성 상 CCTV를 통한 단속 자료는 포함되어 있지 않으며, 안전신문고를 통한 주민신고 자료를 기반으로 하고 있습니다.횡단보도 불법주정차의 기준은 횡단보도 만이 아닌 횡단보도 앞 정지선을 침범하여도 불법주정차로 판단하고 있으니 자료 이용에 참고 바랍니다.
