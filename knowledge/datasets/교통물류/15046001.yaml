description_portal: '운수종사자관리시템은 여객자동차 운수사업법 및 화물자동차 운수사업법에 따라 버스, 택시, 화물자동차를 운전하는 운수종사자의 종사자격 등을 관리하는 시스템 입니다.관리하고 있는 모든 데이터는 개인정보이므로, 데이터를 가공하여 통계데이터를 개방하였습니다.  * 관리항목 : 운수종사자 경력사항, 교통사고 및 법규위반 이력, 운전적성정밀검사, 운전면허, 자격증 정보, 교육현황정보해당 데이터는 운수종사자관리시스템에 등록된 운수종사자의 17개 시도/ 업종별 운수종사자 건수를 가공하여 제공하는 정보 입니다. - 버스, 전세버스, 고속버스, 마을버스,  특수여객, 법인택시, 개인택시, 용달화물, 일반화물, 개별화물 10개 업종으로 관리중'
