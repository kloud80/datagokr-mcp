summary_user: 한국해양교통안전공단이 내는 다음 날 연안여객선 운항 예보를 출항 편(일자·출항시간·여객선·운항항로·출항지) 단위로 담고, 운항·증선·비운항·통제·대기/지연 구분과 통제·비운항·지연 사유를 함께 준다. 섬 주민이나 여행객이 내일 타려는 배가 풍랑주의보나 기상악화로 통제될지 미리 확인하고 일정을 바꿀지 판단하는 데 쓴다. 전역 조인 키는 없어서 지사코드·여객선코드·항로코드 같은 공단 내부 코드나 항로명·선박명으로 같은 기관의 운항상태 데이터와 맞춰 잇는다.
limits: 예보이므로 실제 당일 운항 결과와 다를 수 있다. 실측 컬럼에 다른 기관 데이터와 바로 붙는 공통 키가 없어 이름 매핑이 필요하고, 개발계정은 하루 500회로 호출이 제한된다.
