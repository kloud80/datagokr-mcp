summary_user: 대전광역시 중구에 주사무소를 둔 일반화물자동차운송사업자를 업체 한 곳당 한 행으로 담은 목록으로, 업체명·면허종류·도로명 기준 주사무소 주소로 구성된 작은 CSV 파일(약 3.7KB)이다. 화주나 사업자가 '중구에 있는 이 운송사가 허가받은 일반화물 운송업체인가'를 확인하거나, 분석가가 중구 내 화물운송업체의 분포를 주소로 살펴보는 데 쓴다. 전역 조인 키가 없어 업체명이나 주소를 매칭해 이어 써야 하며, 허가 여부의 기준 원장은 전국화물자동차운송사업자표준데이터이므로 그것과 대조하는 용도로 쓴다.
