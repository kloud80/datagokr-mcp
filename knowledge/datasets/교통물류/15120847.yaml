summary_user: 부산광역시 교통정보서비스센터가 운영하는 교통전광판(VMS)을 한 기기당 한 건으로, 유형·설치위치·경도·위도를 담는 설치 현황 데이터이며 범위는 부산 시 전역이고 위치는 주소·좌표 단위로 제공된다. 교통 분석가나 내비게이션·지도 서비스 사업자가 '부산 시내 어느 도로 구간에 어떤 유형의 전광판이 설치돼 있는가'를 지도에 표시하거나 우회 안내 지점을 검토할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 좌표 기반 공간 결합이나 설치위치 이름 매핑, 같은 기관(부산시) 교통 데이터끼리로만 이어 쓴다.
limits: 설치 현황 정보만 담고 전광판에 표출되는 실시간 메시지 내용은 필드에 없다. 공통 조인 키가 없어 링크 속도·돌발상황 등 다른 실시간 소통 데이터와는 좌표·이름으로 직접 매핑해야 한다. 개발계정은 하루 500회 호출로 제한된다.
