description_portal: 서울특별시 마포구에 설치된 과속방지턱에 대한 정보입니다. 이 데이터에는 각 과속방지턱의 관리기관 및 부서와 함께, 설치 지점의 도로명 주소와 노선명 및 시설명이 포함되어 있습니다.또한, 각 과속방지턱의 설치년도뿐만 아니라 보차도 구분 유무와 설치종류에 대한 데이터도 포함되어 있습니다.그리고 각 시설의 폭, 높이, 연장, 면적 와 같은 시설의 상세 정보도 함께 제공됩니다.이 데이터를 통해 주민들은 과속방지턱의 분포와 위치를 쉽게 파악할 수 있으며, 교통안전 개선과 관련한 정책 수립에도 활용될 수 있습니다.
