summary_user: 대구교통공사가 공공데이터포털에 개방 중인 데이터 목록을 한 행에 한 건씩 담은 메타정보 파일로, 목록명·목록 유형(파일·오픈API 등)·제공주기·등록일·마지막수정일을 담는다(CSV 약 7.9KB). 분석가나 이용자가 "대구교통공사가 어떤 데이터를 어떤 형태와 주기로 내놓고 있고, 최근에 바뀐 것은 무엇인가"를 확인할 때 쓴다. 전역 조인 키는 없어서, 목록명을 공공데이터포털의 개별 데이터셋 이름과 맞추거나 기관명으로만 다른 데이터와 연결한다.
description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 공공데이터 운영정보로, 공사에서 개방 중인 전체 공공데이터 목록의 현황과 운영 정보를 제공합니다. 기관이 보유한 공공데이터의 개방 현황을 투명하게 공개하여 국민의 알 권리 보장과 정보 접근성 향상에 기여하고자 합니다. 본 자료는 데이터명, 목록 유형(파일데이터, 오픈API 등), 제공 주기(일간, 월간, 비정기 등), 최초 등록일자, 최근 수정일자 등 공공데이터 이용에 필요한 주요 메타정보를 포함하고 있습니다. 이를 통해 이용자는 공공데이터 제공 현황과 최신 변경 사항을 체계적으로 확인하고 활용할 수 있습니다. 또한 공공데이터 관리 체계의 투명성과 행정 신뢰성 제고를 위한 기초자료로 활용될 수 있습니다. 본 데이터는 매 분기 정기적으로 갱신됩니다.'
