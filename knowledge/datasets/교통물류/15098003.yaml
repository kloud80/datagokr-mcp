summary_user: 인천 관내 도로에서 차량이 감지한 위험물(유형·등급·개수·상태·이미지)을 건별로 담고, 위치(위경도·주소·시군구·읍면동), 도로 링크(링크id·시작/끝노드·도로등급), 차량 상태(속도·진동각·온도), 기상(온도·습도·풍속)을 함께 싣는 원천 데이터로, API 전체는 9,900건이다. 도로 안전 담당자나 분석가가 '인천 어느 구간 도로에 어떤 위험물이 몰려 있었나'를 확인할 때 쓴다. 위경도와 전체 주소(full_addr)로 사고다발지역·행정구역 데이터와 공간 결합하고, 링크id·노드 정보로 표준노드링크 기반 소통 데이터와 이어 쓴다.
description_portal: 인천광역시가 제공하는 인천 도로 위험 조회 API는 관내 도로에서 발생하는 위험 요소 및 사고 다발 지역에 대한 공간 및 속성 데이터를 제공합니다. 이 API는 도로 안전 관리의 투명성을 높이고, 운전자와 보행자에게 위험 정보를 사전에 제공하여 교통 사고를 예방하는 것을 목적으로 합니다.주요 오퍼레이션은 인천 도로 위험 조회이며, 전체 약 9,900개의 도로 위험 데이터를 분할 조회할 수 있어 대용량 데이터를 효율적으로 처리할 수 있습니다.제공되는 정보에는 위험물에 대한 정보, 차량 상태 정보, 라벨 정보 등의 데이터를 페이지별로 조회할 수 있습니다.
team:
  dept: AI혁신과
services:
  - op: /hazard-list
    name: 인천 도로 위험 조회
    endpoint: https://apis.data.go.kr/6280000/incheon-road-hazard/hazard-list
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지 번호
    approval: auto
    traffic:
      dev: 5000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
