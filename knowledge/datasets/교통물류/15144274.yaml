description_portal: 선박대기오염물질 관리시스템은 선박에서 사용하는 연료유를 통한 대기오염물질 관리를 통해 환경개선에 이바지하고, 우리나라 국적선사의 CII 등급 산출을 위해 DCS 데이터를 국제해사기구에 보고하고 있습니다.이 데어터는 해양수산부에서 선박 대기오염물질 관리시스템 내 감축효과 게시판 관련 댓글 정보를 관리, 제공하기 위한 목적으로 수집한 데이터입니다. 본 데이터의 주요 내용은 작성한 댓글 내용으로 댓글번호, 작성자명, 작성자 ID, 댓글, 별점으로 구성되어 있습니다. 댓글을 통해 대기오염물질 감축 효과에 대한 내용을 파악할 수 있습니다.
