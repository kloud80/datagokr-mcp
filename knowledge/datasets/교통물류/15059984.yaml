description_portal: 이 데이터는 해양수산부에서 국내 항만 별 연안화물 운송 현황을 파악, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 2019년부터 2020년 1월까지의 품목별, 수출입 구분별로 국내 항만의 물동량 정보로 구성되어 있습니다.본 데이터는 해양수산 정책의 수립 및 평가, 항만 운영 계획 및 연안물류 전략 도출, 항만별 물동량 예측 모델 개발 등 분야에서 활용될 수 있습니다. 또한 지자체나 항만공사에서 지역별 항만시설 투자 검토 및 운영 효율화 방안 마련에 참고 자료로 사용할 수 있습니다.
