summary_user: 경상남도 18개 시군(창원·진주·김해·양산·거제 등)별 전기자동차 보급 대수 또는 충전기 설치 수를 연도 구분(yeargbn)별 한 행에 시군 열로 나눠 담은 집계 통계로, 경남 합계(totCnt)도 함께 있다. 지자체 정책 담당자나 충전 사업자가 "경남에서 어느 시군에 전기차가 많이 보급됐고 충전기는 얼마나 깔렸나"를 연도별로 비교할 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 시군 이름을 행정구역 코드로 직접 매핑하거나 연도 기준으로 맞춰 이어 써야 한다.
limits: 시군 단위 집계 수치만 있어 개별 충전소의 위치·운영 정보는 이 데이터로 알 수 없고, 다른 데이터와 바로 붙일 공통 코드가 없다. 필드 명세에 의미 설명이 비어 있어 각 행이 보급 대수인지 충전기 수인지, 연도 구분의 기준이 무엇인지는 실제 응답을 보고 확인해야 한다.
