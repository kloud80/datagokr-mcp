summary_user: 전국 2,003개 지역의 인구밀도를 시도·시군구·읍면동 단위 주소와 법정동코드, 행정구역코드와 함께 담은 CSV 파일 데이터이다. 위험물질운송차량 관제 담당자나 분석가가 특정 지역의 인구밀도가 얼마인지, 어떤 행정구역에 해당하는지 확인하는 질문에 쓴다. 주소(address)와 법정동코드(bjd_cd)를 조인 키로 삼아 법정동코드 기반의 다른 지역 데이터와 이어 쓴다.
description_portal: 한국교통안전공단은 위험물질운송차량을 실시간으로 관제하는 위험물질운송안전관리시스템을 운영하고 있습니다. 본 시스템은 인구밀도 데이터를 활용하여 위험물질운송차량의 효과적인 관제와 국민 안전 확보에 사용하고 있습니다. 해당 특정지역의 인구밀도 데이터와 주소, 법정동코드와 행정구역코드와 함께 제공하여 이를 바탕으로 국민들에게 각 지역별 인구밀도와 행정구역 정보를 투명하게 제공하고 있습니다. 이러한 데이터 제공은 국민 안전과 재난 예방, 그리고 효과적인 교통정책 수립에 중요한 기초자료로 활용되기를 기대합니다.
