summary_user: 철도 분야 직업별로 직업명, 하는 일과 주요 역할, 평균 연봉, 세부 분야(운전·기술·관리 등), 입력일을 한 행씩 담은 소개용 파일 데이터이며 전국 단위의 비공간 자료다. 철도 산업 취업을 준비하는 구직자나 진로 상담자가 '기관사나 철도 기술직은 어떤 일을 하고 연봉은 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어서, 직업명을 이름으로 맞추거나 같은 기관 자료와 나란히 보는 방식으로만 연결한다.
description_portal: '철도 분야의 다양한 직업에 대한 정보를 소개합니다. 철도 산업에 관심 있는 분들이나 관련 직업을 찾고 계신 분들에게 유용한 정보가 되었으면 합니다.ㅁ 글번호: 각 직업 항목을 구분하는 고유 번호입니다.ㅁ 직업명: 철도 분야의 구체적인 직업 이름입니다.ㅁ 내용: 해당 직업이 어떤 일을 하는지, 주요 업무와 역할에 대한 설명입니다.ㅁ 연봉: 해당 직업의 평균적인 연봉 정보를 담고 있습니다. (참고: 연봉 정보는 시장 상황이나 경력에 따라 달라질 수 있으므로, 참고 자료로 활용해 주세요.)ㅁ 분야: 직업이 속한 세부 분야를 나타냅니다. (예: 운전, 기술, 관리 등)ㅁ 입력일: 데이터가 입력된 날짜입니다.'
