summary_user: 경기도 파주시가 지능형교통체계(ITS) 운영에 쓰는 차량검지기의 설치 현황을 검지기 단위로 담은 파일(csv 약 8KB)로, 제어기관리번호·검지기 유형·설치 도로 구간(링크아이디)·차로 방향·차로수를 담는다. 교통 분석가나 지자체 담당자가 "파주시 어느 도로 구간, 어느 방향 차로에 어떤 유형의 검지기가 설치돼 있나"를 확인하거나 차로별 교통량 분석·시뮬레이션의 지점 기준표를 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 링크아이디·검지제어기아이디 같은 같은 기관 체계의 코드나 이름 매핑으로만 연결한다.
description_portal: 경기도 파주시 지능형교통체계(ITS) 운영을 위해 지점정보를 수집하는 차량검지기에 대한 데이터로, 고유식별정보인 제어기관리번호, 검지기의 위치 및 장치 구성을 나타내는 차로아이디와 검지기번호, 검지기유형코드, 검지기유형명, 검지제어기아이디, 검지기가 설치된 도로 구간을 식별하는 정보인 링크아이디, 교통 흐름과 차로별 차량 통행을 구분할 수 있는 차로방향코드, 차로방향명과 차로수 등으로 구성되어 있습니다. 본 데이터셋은 차로별 검지기 데이터를 활용한 특정 도로 구간의 시간대별 차량 흐름과 혼잡도 분석 및 향후 교통량 변화 예측, 디텍터 및 링크 정보를 기반으로 교통 신호 제어, 차로 변경 안내, 혼잡 완화 조치 등 지능형교통체계 기반 실시간 교통 관리 시스템 개발, 차로번호와 차로방향코드를 통해 차량 이동 패턴, 통행 속도, 정체 구간 등을 분석하여 교통 정책 수립 등의 차로별 운행 패턴 연구, 검지기 위치와 연계된 링크 데이터를 활용하여 교통 시뮬레이션 모델을 구성하고, 다양한 도로 설계 및 교통 정책 시나리오 검증 등에 활용될 수 있습니다.
