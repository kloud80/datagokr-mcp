summary_user: 울산광역시 북구의 불법주정차 단속 실적을 연도·월·단속종류(고정 CCTV, 버스탑재형 CCTV, 이동식, 안전신문고앱)별로 묶어 단속건수와 과태료 합계(천원)를 담은 집계 파일이며, 파일 크기가 265바이트에 불과한 소규모 표다. 구청 담당자나 분석가가 "북구에서 어떤 단속 방식이 건수와 과태료를 가장 많이 차지하고, 월별로 어떻게 달라지나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군구의 주정차 단속 현황과는 연도·월·단속종류 이름을 맞춰 나란히 비교하는 방식으로만 잇는다.
limits: 건별 단속 기록이 아니라 월·단속종류별 집계라서 단속 위치·차종·시간대는 알 수 없고, 범위가 울산 북구 한 곳에 그친다. 조인 키가 없어 다른 데이터와는 이름 매핑으로만 연결된다.
