summary_user: 국토교통부 국가교통정보센터의 교통정보 공통기반 지역정보를 전국 범위로 담는 기본 목록입니다. 필드 이름으로 보면 지역(권역) 단위로 시도·구군 이름, 지역코드(TRRY_CD), 최소·최대 좌표 범위, 등록일시가 들어 있는 것으로 보이며, 명세에는 필드 의미가 적혀 있지 않습니다. 교통정보 분석가가 특정 소통·돌발 정보가 어느 시도·구군 권역에 속하는지 정리할 때 기준표로 쓰고, 다른 데이터와는 전역 조인 키 없이 시도·구군 이름이나 같은 기관의 지역코드를 맞춰 연결합니다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
