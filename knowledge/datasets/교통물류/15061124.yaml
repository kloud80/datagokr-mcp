summary_user: 성남시 관내 버스공영차고지를 한 곳당 한 행으로 담은 목록으로, 차고지명·도로명/지번 주소·위도경도·면적·주차면수·충전시설·관리 및 운영 부서와 연락처를 포함하며 파일 크기는 510바이트로 몇 건 안 되는 소규모 원천 목록이다. 도시계획·교통 분석가가 성남시 버스 차고지가 어디에 있고 주차면과 충전시설을 얼마나 갖췄는지 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 차고지명·시군구 이름으로 맞춰 이어야 한다.
description_portal: 본 자료는 성남시 관내 버스공영차고지의 위치 및 운영 현황을 수록한 공공데이터입니다. 장소, 면적, 주차면수, 관리부서, 전화번호 등의 항목이 포함되어 있습니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.자료는 공간정보(위도·경도 포함)를 통해 지도 시각화 및 교통 인프라 분석에 활용 가능합니다. 공공데이터포털에서 무료로 열람 및 다운로드 가능합니다. 행정, 연구, 도시계획 등 다양한 분야에서 유용하게 활용될 수 있습니다.
