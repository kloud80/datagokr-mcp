summary_user: 전국 교통카드 정산사업자의 식별자(정산사업자ID)와 이름(정산사업자명)을 담은 코드성 목록 API로, 건별 결제·이용 기록이 아니라 기관 목록이다. 대중교통 승하차·교통카드 데이터를 분석하는 분석가가 "이 정류장·노선 정보는 어느 정산사가 관리하는가"를 확인하거나 정산사 코드를 이름으로 풀어 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 기관(국토교통부)의 교통카드·정류장·노선 데이터에 있는 정산사업자ID 또는 이름으로 매핑해 이어 쓴다.
description_portal: 교통카드 정산사업자는 대중교통 이용 과정에서 발생하는 결제 데이터를 수집, 처리, 검증하여 카드 발급사, 대중교통 운영기관, 지방자치단체 간 요금을 정확하게 정산하고 분배하는 역할을 수행하는 기관입니다. 주요 업무는 결제 데이터 처리, 요금 정산 및 분배, 교통 이용 데이터 통계 제공, 시스템 유지 관리이며, 이를 통해 대중교통 운영의 투명성과 효율성을 높이고, 다양한 교통 정책 수립을 위한 기초 자료를 제공합니다. 또한 이용자 편의를 위한 서비스 품질 개선에도 기여합니다. 정류장, 노선 등의 정보를 정산사 자체적으로 관리하고 있습니다.
