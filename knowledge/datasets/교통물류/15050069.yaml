summary_user: 사업용 차량의 운행기록장치 자료를 시동 ON부터 OFF까지의 트립 1건 단위로 담은 샘플 파일로, 운행거리·평균/최고속도·제동·공회전·RPM 초과시간·구간별 과속 건수와 시간, 시작·종료 GPS 좌표를 포함하며 범위는 전국입니다. 운수업 안전 분석가가 '어떤 운수회사 차량에서 과속·급제동 같은 위험운전 행동이 잦은가'를 살펴볼 때 원본 대용량 데이터의 구조를 미리 확인하는 용도로 쓴다. 사업자등록번호(bizno)로 사업자 정보와 이어 쓰고, 자동차등록번호·차대번호는 자동차 등록·검사 원장과 맞춰 보는 데 쓴다.
description_portal: 한국교통안전공단에서 수집관리하고 있는 트립단위의 위험운전행동데이터 샘플입니다. (운행일자, 운수회사코드 등) 운행기록과 관련된 데이터는 대용량데이터로 샘플데이터만 업로드
