summary_user: 수도권 4호선 도시광역철도역마다 철도운영기관명, 노선명, 역명과 십진수 도(DD) 형식의 경도·위도 좌표를 한 행씩 담은 역 단위 위치 파일이다(CSV 약 2.4KB). 분석가나 사업자가 '4호선 각 역이 지도상 어디에 있고, 특정 주소가 역세권에 드는가'를 판정할 때 기준 좌표로 쓴다. 실측 컬럼에 전역 조인 키나 역 코드가 없어, 다른 노선 역위치·승하차 데이터와는 역명(필요하면 노선명까지) 문자열 매핑으로 잇고, 좌표로 주소·시설 데이터와 공간 결합한다.
description_portal: 수도권4호선에서 관리하는 도시광역철도역들의 철도운영기관명, 선명, 역명, 경도, 위도의 데이터가 포함되어 있습니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
