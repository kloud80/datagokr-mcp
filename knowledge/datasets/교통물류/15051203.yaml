summary_user: 인천도시철도 1호선 평일 상선(송도달빛축제공원→검단호수공원 방향) 열차별로 시발역·종착역·열차번호와 33개 역의 출발시각을 한 행에 담은 시각표 파일(CSV)입니다. 통근자나 교통 분석가가 '평일 아침 특정 역에서 검단 방향 열차가 몇 분 간격으로 오는지', '막차가 몇 시인지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 역 이름을 맞춰 연결해야 하며, 같은 기관의 하선·주말 시각표와는 역명 컬럼 기준으로 이어 쓴다.
description_portal: 인천교통공사에서 운영하는 인천도시철도 1호선 평일 상선(송도달빛축제공원역에서 검단호수공원역 방향) 2025년 4월 12일 기준 열차운행시각표 입니다.해당데이터는 시발역, 종착역, 열차번호, 경유역별 열차출발시각 정보로 구성되어있습니다.인천지하철 1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역을 운영하고 있습니다.인천1호선 평일 상선 열차운행시각표의 시발역은 국제업무지구역, 동막역, 박촌역, 송도달빛축제공원역, 예술회관역, 작전역입니다.또한 종착역은 검단호수공원역, 계양역, 박촌역, 신연수역입니다.대부분의 시발역과 종착역은 송도달빛축제공원역과 검단호수공원역입니다.인천1호선 평일 상선 운행시간은 역별로 상이하나 전체적인 열차운행은 05시 30분에 시작하여 익일 01시 01분에 종료됩니다.이 자료는 2025년 6월 28일 개통한 인천 1호선 3개역(검단호수공원역, 신검단중앙역, 아라역)이 반영된 데이터입니다.
