summary_user: 대전광역시 서구에 설치된 장애인 주차구역을 한 곳씩 위치(주소), 행정동명, 위도·경도로 담은 개별 목록이며 CSV 파일(약 7KB)로 활용신청 없이 받는다. 장애인 운전자나 복지·교통 분석가가 '서구 어느 동에 장애인 주차구역이 부족한가', '특정 공공시설 근처에 장애인 주차장이 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 행정동명을 행정구역 코드표에 이름으로 맞추거나, 위도·경도로 전국주차장정보표준데이터 같은 주차장 원장이나 공공시설 위치 데이터와 공간 결합해 이어 쓴다.
description_portal: 이 CSV 데이터는 대전광역시 서구 지역에 설치된 장애인 주차장의 위치정보 현황을 제공하는 공간 기반 교통·복지 인프라 데이터입니다. 장애인의 이동권 보장을 위해 마련된 주차구역의 정확한 위치를 객관적으로 파악할 수 있도록 구성되어 있으며, 접근성 평가와 편의시설 배치를 위한 기초자료로 활용됩니다.‘장애인 주차장 위치’는 각 주차구역의 지번 또는 도로명 기반의 구체적 위치를 의미하며, 실제 이용자가 현장을 찾는 데 필요한 기본 공간 정보를 제공합니다.‘행정동명’은 주차장이 속한 행정 구역을 나타내어 동별 주차장 분포를 파악하고, 지역 간 편차나 부족 구역을 분석하는 데 유용합니다.‘위도·경도’는 지도 기반 서비스 및 GIS 공간 분석에 필수적인 좌표 정보로, 장애인 주차장의 밀집 지역 파악, 생활권 단위 접근성 분석, 공공시설과의 거리 측정 등에 활용할 수 있습니다.
