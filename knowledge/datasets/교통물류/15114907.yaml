summary_user: 부산광역시 서구에 주사무소를 둔 일반화물자동차운송사업 업체를 업체별 한 행으로 담은 파일 목록으로, 업체명·면허종류·연락처·주소·현재운영여부가 들어 있다(포털 설명상 12개 업체, 다운로드 파일 1,129바이트). 화주나 이사·운송을 맡길 사업자가 "서구에서 허가받아 지금 운영 중인 화물운송사가 어디인가"를 확인할 때 쓴다. 전역 조인 키가 없어 전국화물자동차운송사업자표준데이터 등 다른 허가 원장과는 업체명·주소를 맞춰 이어 써야 한다.
description_portal: 부산광역시 서구에서 관리하는  화물자동차 운송사업은 물류산업의 중요한 부분으로 화물자동차를 사용하여 유상으로 화물을 운송하는 화물운송업체 허가권을 관리를 하고 있습니다. 현재 서구의 일반화물 업체로는 12개의 업체가 있으며  아미동, 암남동에 기반하여 화물업에  종사하고 있습니다. 26년  6월기준  각 업체의 업체명, 운송 가능 화물종류, 운영지역(주사무소) 등을 공개하여 제공하고 있으며 정확한 데이터를 제공하여 운송 업체 현황을 파악 할  수 있습니다. 자세한 내용은 밑에 파일 참고해주시기 바랍니다
