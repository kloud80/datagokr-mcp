summary_user: 서울교통공사 또타지하철 앱에서 이미 게시된 열차 이용 안내 공지사항을 공지 한 건씩 담은 CSV 파일로, 제공대상(국문·영문), 제목, 내용, 게시 시작·종료 시간을 포함한다. 분석가가 "어떤 종류의 운행 안내 공지가 언제, 얼마 동안 게시됐는가"처럼 과거 공지 이력과 게시 기간을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 게시 시간이나 제목·내용 속 역명·노선명 같은 이름 매칭으로만 연결한다.
