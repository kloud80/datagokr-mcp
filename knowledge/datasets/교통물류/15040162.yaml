summary_user: 고속열차 SRT의 좌석 공급 실적을 분기별로 노선(경부선·호남선·경전선·동해선·전라선)과 전체 합계로 나눠 담은 전국 단위 집계 파일로, 내려받은 CSV는 1,285바이트 규모의 작은 표입니다. 철도 분석가나 이용자가 "SRT 노선 확대 뒤 분기별 좌석 공급이 노선별로 얼마나 늘었나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 같은 기관(에스알)의 분기별 승차·이용 실적 자료와 분기(구분)·노선명을 맞춰 이어 쓴다.
limits: 노선별 분기 합계만 있어 열차·역·구간 단위 공급이나 실시간 좌석 현황은 알 수 없다. 공통 코드 키가 없어 다른 데이터와는 분기·노선 이름을 직접 맞춰야 연결된다. 경전선·동해선·전라선은 2023년 3분기부터만 값이 있어 그 이전과 전체 합계를 비교할 때 주의한다.
