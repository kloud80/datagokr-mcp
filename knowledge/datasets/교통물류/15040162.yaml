description_portal: 이 데이터는 고속열차 SRT에 대한 자료로, 2019년~2025년 2분기 기간 동안의 분기별 좌석 공급 실적을 제공하는 자료입니다. 해당 데이터는 분기별 주기성 데이터입니다. SRT는 2016년도 12월 9일부터 지속적으로 운행을 시작하였습니다. 기존에는 경부선 호남선에 대한 데이터를 제공하였으며, 2023년 운행노선 확대에 따라 2023년 3분기부터 경전선, 동해선, 전라선 데이터를 추가합니다. 각 분기별로 좌석공급 실적을 확인하실 수 있습니다. 에스알은 해당 데이터를 현재 무료로 제공드리고 있습니다.
