summary_user: 부산3호선 각 역에 설치된 비상콜폰(비상통화장치)의 위치를 운영기관명·선명·역명·역층·상세위치(상선/하선별 승강장 번호·입구) 단위로 한 줄씩 담은 시설 목록 파일(CSV, 약 7.7KB)이다. 승객이나 역사 안전·접근성 분석가가 '이 역에서 비상통화장치가 어느 층, 어느 승강장 위치에 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·선명 같은 이름을 맞춰서만 이어 쓴다.
limits: 표준 역코드 같은 조인 키가 없어 다른 데이터와 연결하려면 역명 문자열 매칭에 의존해야 한다. 좌표가 없는 비공간 데이터라 지도 위 위치 표시는 바로 하지 못하고, 통화 이력이나 작동 상태는 담지 않는다.
