agency:
  id: '6300000'
  name: 대전광역시
kind: API
channel: portal
portal_url: https://www.data.go.kr/data/15110659/openapi.do
synonyms:
  - 자동차
  - 주차장
  - 도로
  - 운영 요일
  - 주차장 명
  - 대전 주차장
  - 대전 공영주차장
  - 주차요금
  - 주차장 위치
  - 주차면수
  - 주차장 운영시간
  - 노상주차장
  - 노외주차장
summary_user: 대전광역시 내 주차장을 한 곳당 한 건으로 담으며, 주차장 번호·명칭, 구분(공영·민영 등)과 유형(노상·노외 등), 도로명·지번 주소와 위도·경도, 주차면수, 요일별 운영시간, 기본·추가 요금과 1일·월 정기권 요금, 결제 방식, 기준일자를 포함한다. 시민이나 내비·지도 서비스 개발자가 '목적지 주변 주차장의 위치, 요금, 지금 시간대 운영 여부'를 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 데이터와는 주차장 이름·주소나 좌표(위도·경도) 매칭으로 잇고, 전국주차장정보표준데이터와 대조할 때도 같은 방식으로 맞춘다.
description_portal: 대전광역시 주차장조회서비스 자료는 대전 지역 내 다양한 유형의 주차장에 대한 주요 정보를 포괄적으로 제공합니다. 자료에는 각 주차장의 명칭, 위치 정보(위도, 경도, 도로명주소), 운영 요일, 운영 시간, 주차 가능 대수(주차면수), 요금 부과 기준 및 금액, 주차장 유형(노상, 노외 등)과 입출입 방식 등 실질적인 이용에 필요한 항목이 포함되어 있습니다. 시민들은 이 데이터를 활용하여 인근 또는 목적지 주변의 주차장 위치, 실시간 이용 가능 여부, 요금 체계, 운영시간 등을 쉽게 확인할 수 있어 교통 혼잡 최소화 및 주차 편의 향상에 도움이 됩니다.※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
team:
  dept: 법무통계담당관
services:
  - op: /getPakpList1
    name: 대전광역시 주차장 목록 조회
    endpoint: https://apis.data.go.kr/6300000/GetPakpListService1/getPakpList1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: '한 페이지 결과 수 (기본값 : 10)'
      - name: pageNo
        required: true
        example: '1'
        desc: '페이지 번호(기본값 : 1)'
      - name: type
        required: true
        example: xml
        desc: XML/JSON 여부
      - name: PRKPLCENO
        required: false
        example: 183-2-000025
        desc: 각 기관별로 부여하는 주차장 관리번호
      - name: PRKPLCENM
        required: false
        example: 인동시장노외공영주차장
        desc: 주차장의 이름
      - name: PRKPLCESE
        required: false
        example: 공영
        desc: 주차장에 대한 공영/민영 주차장 구분
      - name: PRKPLCETYPE
        required: false
        example: 노외
        desc: 노상/노외/부설 주차장 유형 구분
      - name: LNMADR
        required: false
        example: 대전광역시 동구 인동 30-1
        desc: 주차장의 위치에 대한 상세 지번주소
      - name: PRKCMPRT
        required: false
        example: '31'
        desc: 주차장의 총 주차단위구획 수 (표현형식/단위 = 면)
      - name: FEEDINGSE
        required: false
        example: '1'
        desc: 주차장의 급지에 대한 구분 (표현형식/단위 = 급지)
      - name: ENFORCESE
        required: false
        example: 미시행
        desc: 2부제, 5부제, 10부제, 요일제 등을 시행하는 주차장인지에 대한 구분
      - name: OPERDAY
        required: false
        example: 평일
        desc: 평일, 토요일, 공휴일 등 주차장 운영요일에 대한 구분
      - name: WEEKDAYOPEROPENHHMM
        required: false
        example: 0:00
        desc: 평일에 주차장이 운영되는 시간대의 시작 시각
      - name: WEEKDAYOPERCOLSEHHMM
        required: false
        example: 23:59:00
        desc: 평일에 주차장이 운영되는 시간대의 종료 시각
      - name: SATOPEROPEROPENHHMM
        required: false
        example: 0:00
        desc: 토요일에 주차장이 운영되는 시간대의 시작 시각
      - name: SATOPERCLOSEHHMM
        required: false
        example: 0:00
        desc: 토요일에 주차장이 운영되는 시간대의 종료 시각
      - name: HOLIDAYOPEROPENHHMM
        required: false
        example: 0:00
        desc: 공휴일에 주차장이 운영되는 시간대의 시작 시각
      - name: HOLIDAYCLOSEOPENHHMM
        required: false
        example: 0:00
        desc: 공휴일에 주차장이 운영되는 시간대의 종료 시각
      - name: PARKINGCHRGEINFO
        required: false
        example: 유료
        desc: 주차장 유료/무료/혼합 개방여부
      - name: BASICTIME
        required: false
        example: '15'
        desc: 1회 주차시 주차장 이용을 위한 최소단위 시간 (표현형식/단위 = 분)
      - name: BASICCHARGE
        required: false
        example: '400'
        desc: 주차기본시간에 적용되는 단위요금 (표현형식/단위 = 원)
      - name: ADDUNITTIME
        required: false
        example: '15'
        desc: 주차기본시간을 초과할 경우 추가요금을 부과하는 단위시간 (표현형식/단위 = 분)
      - name: ADDUNITCHARGE
        required: false
        example: '300'
        desc: 주차기본시간을 초과할 경우 부여되는 주차요금 (추가단위시간에 적용되는 요금) (표현형식/단위 = 원)
      - name: DAYCMMTKTADJTIME
        required: false
        example: '0'
        desc: 1일 주차권 요금과 동일한 요금이 부과되는 최대 시간제 주차시간 (표현형식/단위 = 시간)
      - name: DAYCMMTKT
        required: false
        example: '0'
        desc: 종일 주차 시 시간제 요금을 적용하지 않고 1일 주차권 요금을 적용할 수 있는 경우 1일 주차권 요금 (표현형식/단위 = 원)
      - name: MONTHCMMTKT
        required: false
        example: '0'
        desc: 월 정기 주차를 허용하는 경우 월정기권 요금 (표현형식/단위 = 원)
      - name: METPAY
        required: false
        example: 카드
        desc: 주차요금 결제방법 입력
      - name: LATITUDE
        required: false
        example: '36.32275269'
        desc: 주출입구 위도좌표값 입력
      - name: LONGITUDE
        required: false
        example: '127.436145'
        desc: 주출입구 경도좌표값 입력
      - name: REFERENCEDATE
        required: false
        example: '2022-03-04'
        desc: 주차장정보 데이터 작성 기준일자
      - name: RDNMADR
        required: false
        desc: 주차장의 위치에 대한 상세 도로명주소
      - name: SPCMNT
        required: false
        desc: 기타 주차장과 관련된 특기 사항 기록. 본 양식에 부합하지 않는 예외적인 규칙 입력
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
