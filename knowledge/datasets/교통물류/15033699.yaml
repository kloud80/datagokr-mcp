summary_user: 강원특별자치도 안의 여객자동차터미널(고속·시외버스)과 여객항터미널(여객선)을 시설 한 곳당 한 행으로 담은 현황 파일로, 시군구·운영주체·운행노선 수·주요노선·연락처·도로명주소를 포함하며 CSV 약 7KB 규모다. 여행자나 교통 분석가가 '강원도 어느 시군에 시외버스·여객선 터미널이 있고 어디로 가는 노선이 다니는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군구명이나 시설명·도로명주소를 기준으로 정류장·노선 원장이나 주소 좌표 데이터와 이름 매칭해 잇는다.
description_portal: '강원특별자치도 내 위치한 여객터미널  데이터를 제공합니다. - 제공 데이터 : 시군구명, 구분, 시설명, 운영주체, 운행노선 수 및 주요노선, 연락처, 소재지도로명주소 등* 컬럼별 상세설명○ 여객터미널(여객자동차터미널): 고속버스 및 시외버스 정차 터미널○ 여객항터미널: 여객선 정차 터미널○ 주요노선 및 운행노선 수는 2025년 9월 기준 자료로 실제와 상이 할 수 있으며, 정확한 내용은 해당 터미널 운영사에 문의하여 주시기 바랍니다.○ 주요노선: 자동차 등이 정기적으로 운행하는 구간(경유지 및 종점 등 표기)'
