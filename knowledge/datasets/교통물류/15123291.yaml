summary_user: 경기도 도로대장전산화시스템에 등록된 과속방지턱을 시설 한 개씩 담은 건별 원천 데이터로, 노선번호·구간번호·위치(시점·방향), 시설 연장·폭·높이, 종류, 재료, 설치일자, 위임기관을 포함한다. 도로 관리자나 교통안전 분석가가 '이 노선 구간에 어떤 형태·높이의 방지턱이 언제 설치됐나'를 확인하거나 시설물 현황을 점검하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 노선번호·구간번호나 위임기관 이름으로 경기도 도로대장의 다른 시설물 데이터와 맞춰 쓰는 정도이며, 표준노드링크(link_id·node_id)와 직접 연결되지는 않는다.
description_portal: '이 데이터는 경기도 도로대장전산화시스템에 등록된 과속방지턱 정보를 담고 있으며, 도로 노선번호, 구간번호, 위치(시점·방향), 시설연장, 시설폭, 시설높이, 방지턱 종류(예: 원호형, 가상방지턱), 재료(아스팔트, 콘크리트 등), 설치일자, 위임기관 등으로 구성되어 있습니다. 과속방지턱은 차량 속도를 저감하여 보행자 안전을 확보하고, 교통사고를 예방하기 위한 대표적인 교통안전시설물입니다. 이 데이터는 도로별 방지턱의 물리적 특성과 위치정보를 제공하여 교통안전 설계, 시설물 유지관리, 도로환경 분석, 사고다발지역 점검, 교통시설물 시각화 등에 활용될 수 있으며, 공간정보와 결합하여 GIS 기반 도로안전 인프라 분석에도 유용하게 사용됩니다.'
