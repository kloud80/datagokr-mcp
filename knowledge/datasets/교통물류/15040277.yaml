summary_user: 청주시에 설치된 신호등을 한 건씩 담은 파일로, 설치 위치의 구·동·리와 지번, 교차로 이름, 일반신호등과 안전신호등(어린이보호구역용 노란 테두리)을 구분하는 용도를 기록한다. 시민이나 분석가가 '우리 동네 어린이보호구역 주변 교차로에 안전신호등이 얼마나 설치돼 있나'처럼 생활권 신호 시설 분포를 확인하는 데 쓴다. 전역 조인 키나 좌표는 없어서, 어린이보호구역·단속카메라 표준데이터 같은 다른 자료와는 행정구역(구·동) 이름과 지번, 교차로 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 청주시 내에 설치된 신호등 정보를 담고 있는 공공데이터로 주요 항목은 다음과 같습니다. ‘행정구역(구)’와 ‘행정구역(동)’은 신호등이 설치된 지역의 행정단위를 나타내며, ‘리명’은 읍면 지역의 리명을 제공하며, 동 지역인 경우 공백입니다. ‘지번’은 도로명 주소와 다른 토지의 고유번호로, 교차로 이름과 조합하여 위치 확인에 도움이 됩니다. ‘교차로이름’은 신호등이 설치된 교차로의 명칭을 나타내며, ‘신호등용도’는 일반신호등과 안전신호등으로 구분되고, 신호등의 테두리를 노란색으로 칠하여 어린이보호구역에 설치한 신호등이 안전신호등입니다. 이 데이터는 시민들이 교통 혼잡 지역이나 사고 위험 구역을 파악하고, 생활권 내 교통 환경을 이해하는 데 유용하게 활용될 수 있습니다. 또한, 어린이 보호구역이나 노약자 보호구역 등 특정 지역의 안전 시설을 분석할 수 있는 자료로도 쓰일 수 있습니다.
