summary_user: 익산시에 접수된 불법주정차 신고 건을 건별로 위반일시 순으로 정리해 신고위치(읍면동·상세 구역)와 과태료 부과 여부를 담은 CSV 파일(약 515KB)이다. 시민이나 연구자가 익산시의 어느 동네·시기에 불법주정차 신고가 몰리고 그중 실제 과태료로 이어진 비율이 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 신고위치의 읍면동 이름을 매핑해 다른 행정동 단위 통계와 붙이거나 같은 익산시 자료와 연결해야 한다.
limits: 표준 행정구역 코드나 좌표가 없어 위치는 이름 매칭으로만 연결되며, 범위는 익산시 한 곳이라 다른 시군구와 직접 비교할 수 없다. 포털 설명은 통계 자료라 하지만 필드는 건별 항목(순번·위반일시·신고위치·부과 여부)뿐이라 과태료 금액 등은 담겨 있지 않다.
