summary_user: 세종특별자치시에 설치된 스마트 바닥신호등(바닥형 LED)을 개소별로 담은 원천 목록 파일로, 관리번호·설치일자·도로명/지번주소·위도·경도·관리기관명을 행마다 기록한다. 보행자 안전 정책 담당자나 분석가가 '세종시 어느 횡단보도에 바닥신호등이 설치돼 있고 언제 생겼나'를 지도로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 교통안전시설 데이터와는 위도·경도 좌표나 주소 문자열로 공간·이름 매칭해서 이어 쓴다.
description_portal: 세종특별자치시 스마트 바닥신호등에 대한 정보를 제공합니다.데이터는 연번, 관리번호, 신호등유형(바닥형LED), 설치일자, 도로명주소, 지번주소, 위도, 경도, 관리기관명(한국교통연구원, 세종특별자치시청), 데이터기준일로 구성되어 있습니다.데이터기준일 현재 세종특별자치시 바닥신호등은 총 27개소로 국토부, 조치원, 종촌, 아름, 다정, 소담, 한솔, 대평, 반곡, 보람, 도담 등세종특별자치시 도움6로 11, 세종특별자치시 한누리대로 1834, 세종특별자치시 남세종로 772, 세종특별자치시 다정남로 57 등에 소재하고 있습니다.이 데이터는 세종특별자치시 교통국 교통정책과에서 관리하고 있는 데이터입니다.
