summary_user: 한국도로공사가 주요 고속도로 구간별·차종별 교통량을 연도 열(2021년~2025년)과 전년대비 증감으로 정리한 전국 단위 집계 파일(CSV)이며, 건별 관측 원천이 아니다. 교통 분석가나 물류 사업자가 특정 고속도로 구간에서 화물차·버스·승용차 교통량이 최근 몇 년간 늘었는지 줄었는지 확인하는 데 쓴다. 실측 컬럼에 링크ID 같은 공통 조인 키가 없어서 다른 데이터와는 구간 이름(구분)이나 차종 명칭을 직접 맞춰 연결해야 한다. 공간 기준인 표준노드링크와 붙이려면 구간명을 링크에 수작업으로 대응시켜야 한다.
limits: 구간 좌표나 노드·링크 ID가 없는 비공간 집계라서 지도 위 표출이나 표준노드링크와의 자동 결합은 하지 못한다. 포털 설명은 2020~2024년이라고 적었지만 실제 파일의 연도 열은 2021년~2025년이므로, 해석 전에 열 이름으로 연도를 확인한다.
