summary_user: 자동차 검사 결과를 검사일자·검사소·차량연식별로 묶어 검사건수와 관능·배출·2회 부적합 건수, 부적합 합계를 담은 집계 파일입니다(전국 범위, CSV 약 417KB). 오래된 연식 차량일수록 배출가스나 관능검사에서 부적합이 얼마나 많이 나오는지 알고 싶은 정책 분석가나 정비업계가 연식별 부적합률을 계산하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 검사소코드를 같은 기관(한국교통안전공단)의 검사소 목록 등과 코드·이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 차량 연식별 검사 건수와 부적합 유형별 건수 합계를 기록한 자료로, 각 검사소별, 시도코드별로 구분되어 있습니다. 차량연식은 특정 연식 차량에 대한 검사 결과를 추적할 수 있게 하며, 검사건수와 부적합합계는 검사 대상 차량에 대한 총 검사 수와 부적합 판정 건수를 나타냅니다. 관능부적합, 배출부적합, 2회부적합 등의 항목을 통해 각 부적합 유형별 문제를 파악할 수 있으며, 이는 차량 관리 정책이나 검사 효율성 개선을 위한 기초 자료로 활용됩니다. 이 데이터는 연식별 차량 상태 분석, 부적합 패턴 추적 및 연식별 차량 평가에 중요한 역할을 합니다.
