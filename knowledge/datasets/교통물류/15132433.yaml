summary_user: 전국 지방자치단체가 보고한 공공시설 지하주차장의 건설·운영 현황을 시도·시군구 단위로 묶은 집계 파일로, 시설구분별 시설 개수·주차면수·준공(예정)일을 담는다. 지자체 담당자나 분석가가 "우리 시군구에 공공시설 지하주차장이 몇 곳, 몇 면 있고 언제 준공됐거나 준공 예정인가"를 다른 지역과 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 포털 설명상 행정표준코드를 따르는 시도·시군구 코드를 행정구역 기준으로 맞춰 지역별 인구·차량 통계나 전국주차장정보표준데이터의 지역 집계와 나란히 비교하는 정도로 쓴다.
description_portal: 한국교통안전공단에서 제공하는 정보입니다. 데이터는 주차정보시스템에서 제공하고 있으나, 각 지방자치단체로부터 수집한 공공시설 지하주차장의 건설 및 운영 현황 정보를 취합하여 제공하고 있습니다. 해당 정보는 각 지방자치단체별(시도, 시군구)로 구분하여 정보를 제공하고 있으며, 시설구분, 시설개수, 주차면수, 준공(예정)일을 제공합니다. 주소코드는 행정표준코드를 준용하여 제공합니다. 해당 정보는 지방자치단체로부터 2023년에 수집한 자료로, 2022년도 까지의 정보를 제공합니다.
