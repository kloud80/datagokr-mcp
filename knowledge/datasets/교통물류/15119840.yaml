summary_user: 부산시 도로 굴착·복구 과정에서 기존 포장 재질이 어떤 재질로 바뀌었는지를 굴착관리번호·굴착위치·포장내역·변경 일련번호 단위로 담은 이력 파일(CSV 약 33KB)입니다. 도로 관리 담당자나 분석가가 '굴착 공사 뒤 어느 구간의 포장 종류가 무엇으로 바뀌었나'를 확인해 재포장 이력과 유지보수 계획을 살피는 데 쓴다. 전역 조인 키는 없어서, 같은 도시공간정보업무포털의 다른 도로굴착 데이터와 도로굴착관리번호·굴착위치관리번호 같은 기관 내부 번호로만 이어 쓴다.
description_portal: 부산광역시에서 운영하고있는 도시공간정보업무포털의 도로굴착포장재질변경정보(도로굴착관리번호, 굴착위치관리번호, 포장내역일련번호, 변경일련번호, 포장종류, 기준일자)입니다. 이 데이터는 부산시 도로의 굴착·복구 과정에서 기존 포장 재질이 어떤 재질로 변경되었는지에 관한 데이터를 의미하며 도로 품질 관리 면에서 포장재질 변경 이력은 향후 유지보수 계획 수립과 수명 예측에 중요한 기초 자료가 될 수 있습니다. 그리고 교통 안전 분석과 도시 계획, 환경 영향분석에도 도움을 줄 수 있으며 시민들이 도로 재포장 공사의 진행 내용과 결과를 파악하는 데에도 도움을 줄 수 있습니다.
