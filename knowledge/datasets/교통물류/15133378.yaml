summary_user: 한국교통안전공단이 주관하는 궤도시설 종사자 안전교육의 일정·교육장·접수·수료 정보를 교육 차수와 접수 건 단위로 담은 전국 범위 파일(CSV, 약 140KB)입니다. 궤도 운영업체 담당자나 분석가가 언제 어느 교육장에서 교육이 열리고 수용인원·수수료·교육시간은 얼마인지, 접수자 중 참석·수료 비율은 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육장 주소·우편번호나 지역코드 같은 이름·코드 매핑으로만 잇고, 업체·직원 일련번호는 공단 내부 번호라 외부 데이터와 직접 연결되지 않는다.
description_portal: 궤도운송법 제27조(궤도운송종사자의 의무) 및 궤도운송법 시행규칙 제23조의3(안전교육의 대상 및 내용 등)에 근거하여, 한국교통안전공단에서 주관하는 궤도시설 안전교육에 대한 전반적인 정보(궤도시설 종사자 교육계획, 궤도시설 종사자 교육 실시장소, 궤도시설 종사자 교육장 이름, 궤도시설 종사자 교육장 주소, 궤도시설 종사자 교육 수용인원, 궤도시설 종사자 교육시작일 ㅁ치 교육종료일, 궤도시설 종사자 교육수료, 궤도시설 종사자 교육시간 정보 등)을 포함하며, 궤도시설 종사원 교육에 대한 전반적인 정보를 확인할 수 있는 데이터입니다.
