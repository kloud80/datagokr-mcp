summary_user: 한국철도공사 철도통계연보에 실린 수도권전철 여객 수송실적을 노선별·승차권 종류별 인원과 비율로 담은 연간 집계표이며, 2,716바이트 분량의 작은 CSV 파일이다. 교통 분석가나 연구자가 '수도권전철 어느 노선에서 정기권 등 어떤 승차권 이용 비중이 큰가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선 이름을 맞춰 붙이거나 같은 기관(한국철도공사)의 역별 승하차 자료와 이름 기준으로 연결해야 한다.
description_portal: '이 데이터는 매년 한국철도공사가 발행하는 철도통계연보에 수록된 수도권전철 여객 수송실적으로, 승차노선, 표종(승차권 종류), 인원, 단위 등의 세부 항목을 포함합니다.이 데이터를 통해 노선별·표종별 연간 승차 인원 현황, 주요 노선의 여객 수송량 증가·감소 추이, 특정 노선 및 표종(예시: 정기권, 일일권 등)의 이용 규모, 도심 vs 외곽 노선 수요 구조, 시간·노선별 수송 집중 패턴 및 서비스 개선 필요성 등 다양한 인사이트를 도출할 수 있습니다. 또한 수송량 변화의 연도별 경향, 정책 변화나 외부 요인(예: 팬데믹) 반영 정도, 이용자의 이동 특성까지 정량적으로 파악 가능합니다.이 자료는 대중교통 정책 수립, 노선 신설 및 증편 계획, 혼잡 구간 및 시간대 선정, 수송능력 최적화 방안, 교통 인프라 투자, 이용자 안내 및 민간(상업권) 분석, 철도산업·도시교통 연구 등 광범위한 분야에서 필수적인 참고자료로 활용될 수 있습니다.'
