description_portal: 이 데이터는 해운항만물류정보시스템(PORT-MIS)을 통해 선박 안전법에 따라 선박용 물건의 형식 승인을 받은 품목 정보를 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 선박용 물건을 제조하거나 수입하고자 하는 자가 형식 승인을 받은 내역으로 구성되어 있으며, 품목명, 제조업체명, 품목규격, 형식, 승인일자 등 정보를 포함하고 있습니다.  본 데이터는 선박안전법에 따라 선용품 제조 및 수입 시의 형식 승인 현황을 확인하여 선박 관련 업체의 제품 등록 및 인증 절차에 참고자료로 활용될 수 있으며, 관련 기관의 승인 관리 업무, 선박용 물건의 유통 및 품질관리 등에도 사용할 수 있습니다.
