summary_user: 한국건설기술연구원이 낸 등급별 교통량 분포 통계로, 조사연도(EXMN_YR)와 도로등급(ROAD_GRD)별로 일교통량 7개 항목의 값과 합계, 항목별 구성비, 평균 일교통량을 담은 전국 단위 집계 자료다. 교통 분석가가 고속국도·일반국도 같은 도로등급마다 하루 교통량이 어떻게 분포하는지, 연도에 따라 어떻게 바뀌었는지를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 교통량 자료와는 조사연도와 도로등급 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 등급별교통량분포통계 정보입니다.
