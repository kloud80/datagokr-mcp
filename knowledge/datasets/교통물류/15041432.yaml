summary_user: 수도권 5호선 도시광역철도역에 설치된 휠체어리프트를 한 대씩 담은 파일로, 운영기관·선명·역명과 함께 리프트의 관리번호, 출입구번호, 상세위치, 길이·폭, 시작층·종료층을 기록하며 파일 크기는 696바이트로 소량이다. 교통약자 이동편의 분석가나 휠체어 이용자가 '5호선 어느 역 어느 출입구에 리프트가 있고 몇 층에서 몇 층까지 이어지는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 역명·선명을 기준으로 다른 노선의 휠체어리프트·엘리베이터 현황이나 역 정보와 이름 매칭으로 이어 쓴다.
