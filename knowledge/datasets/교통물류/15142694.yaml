summary_user: 부산 부산진구 관내 개인형 이동장치(전동킥보드·전기자전거 등) 주차구역을 구역 한 곳당 한 행으로 담은 파일로, 위치 설명·위도·경도·주차대수·데이터기준일자를 제공한다(csv 약 1.5KB 규모). 주민이나 공유킥보드 사업자가 '부산진구에서 킥보드를 세워도 되는 지정 주차구역은 어디이고 주차대가 몇 대 있나'를 확인하거나, 분석가가 주차구역 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 위도·경도 좌표 기반 공간 결합이나 위치 이름 대조로만 이어 쓴다.
description_portal: 부산광역시 부산진구청 개인형 이동장치(전동킥보드, 전기자전거 등)의 주차구역에 대한 데이터로 주차구역별 위치 및 위도, 경도, 주차대수 항목을 제공합니다.2026년 5월 18일자를 기준으로 부산진구 관내에 있는 개인형 이동장치 주차구역의 위치, 위도, 경도, 주차대수, 데이터기준일로 구분하여 자료를 작성하였습니다. 주차대수가 0대로 기재된 구역은 따로 주차대 없이 주차구역만 표시된 구간을 나타냅니다.매년 추가되는 사항을 업데이트 예정이며 수시로 변경사항 있을시 업데이트 주기와 상관없이 데이터를 현행화 시킬 예정입니다.
