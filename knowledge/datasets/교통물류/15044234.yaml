summary_user: 서울교통공사가 운영하는 역사 내 물품보관함의 위치를 보관함 한 개소당 한 행으로 담은 파일로, 호선·보관함명·상세위치(출입구 주변 등)를 포함하며 2026년 6월 30일(2분기) 기준이다. 지하철 이용객이나 안내 서비스 개발자가 '이 역에 물품보관함이 있는지, 몇 번 출구 근처에 있는지'를 확인하는 데 쓴다. 전역 조인 키나 역 코드가 없어 다른 역 데이터와는 호선과 역명(보관함명)을 이름으로 맞춰서만 이어 쓸 수 있다.
limits: 역 코드 같은 공통 조인 키가 없어 다른 역·시설 데이터와 연결하려면 이름 매핑이 필요하다. 포털 설명상 특정 분기 기준 시점의 위치 목록이며, 보관함의 크기·요금·실시간 이용 가능 여부는 필드에 없다.
