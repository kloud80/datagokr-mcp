description_portal: 서울교통공사 역사내 물품보관함 위치정보입니다. 역사내 물품보관함 위치정보 데이터는 호선, 역명, 역 보관함 위치정보를 포함하고 있습니다. 2026년 6월 30일(2분기) 기준입니다.해당 물품보관함 위치정보 공공데이터를 통해 서울교통공사가 운영하는 1호선 서울역에는 보관함이 총 3개소가 위치해 있으며, 첫번째 개소는 1호선 1번 출입구 주변, 두번째 개소는 2,3번 출입구 복도 사이, 세번째 개소는 2,3번 출입구 복도사이와 화장실 주변에 위치해있다는 사실을 알 수 있습니다. 또, 시청역에는 2개소가 위치해 있으며, 첫번째 개소는 1번 출구 주변, 두번째 개소는 2,3번 출구 주변에 위치해 있다는 사실을 알 수 있습니다.이렇게 서울교통공사가 운영하고 있는 물품보관함의 위치정보를 서울지하철 1호선부터 8호선 뿐만 아니라 9호선과 서울식물원 등 보관함이 존재하는 역이라면 손쉽게 파악할 수 있습니다.
