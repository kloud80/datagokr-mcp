summary_user: 진주시 ITS가 수집한 돌발상황을 건별로 담는 API로, 발생일자·돌발 유형과 세부유형·내용·장소·경위도 좌표·링크ID·심각도·종료예상일자를 시군구 범위에서 개별 지점 단위로 제공한다. 운전자나 교통 분석가가 '지금 진주시 어느 도로에서 사고·공사 같은 돌발상황이 생겼고 언제 풀릴 것으로 예상되는가'를 확인하는 데 쓰며, 호출 결과를 날마다 쌓으면 상습 정체·돌발 다발 구간 분석의 이력 원장이 된다. 전역 조인 키는 실측에서 확인되지 않아, 같은 진주시 ITS의 링크ID나 경위도 좌표를 기준으로 진주시 링크 속도·통행시간 같은 실시간 소통 데이터와 맞춰 쓴다.
description_portal: 경상남도 진주시 지능형교통체계(ITS) 시스템에서 수집된 돌발 상황 정보를 기반으로 가공한 데이터입니다. 해당 데이터는 발생일자, 돌발ID, 돌발유형 및 세부유형, 돌발 내용과 발생 장소 등 주요 정보를 포함하며, 경도·위도 기반 위치 정보와 링크ID를 통해 정확한 발생 지점을 확인할 수 있습니다. 또한 심각도 레벨과 돌발 주요 구분, 종료예상일자 등이 제공되어 돌발 상황의 영향도 분석과 대응 계획 수립에 활용할 수 있습니다. 본 데이터는 교통 혼잡 원인 분석, 긴급 상황 대응 체계 강화, 안전한 도로 환경 조성 등 다양한 행정·연구 분야에 유용하게 활용될 수 있습니다.
