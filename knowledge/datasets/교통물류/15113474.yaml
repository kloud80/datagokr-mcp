description_portal: 데이터 설명본 데이터는 전북특별자치도 남원시에서 폭염과 강한 햇빛으로부터 시민들을 보호하기 위해 마련한 그늘막의 현황을 체계적으로 정리한 자료입니다. 기후변화로 인한 이상기후와 폭염 현상이 심화되면서 일사병, 열사병 등 온열질환 예방을 위한 공공 쉼터의 중요성이 더욱 커지고 있습니다. 이 데이터는 각 그늘막의 위치, 규모, 설치시기 등 세부정보를 포함하여 시민들이 더위를 피할 수 있는 햇빛차단 시설의 분포와 접근성을 쉽게 파악할 수 있도록 구성되었습니다.데이터 항목명시도, 시군구, 읍면동, 설치장소명, 그늘막유형, 그늘막지름, 위도, 경도, 설치년월기대효과시민들이 폭염 시 인근 그늘막을 손쉽게 찾아 이용할 수 있어 온열질환 예방에 실질적으로 기여하고, 향후 그늘막 설치 계획 수립 시 기존 시설의 분포를 고려한 보다 효율적인 배치가 가능합니다.
