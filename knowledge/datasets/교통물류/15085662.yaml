summary_user: 대구교통공사가 관리하는 대구 도시철도 1·2·3호선 역의 위생용품 자판기 위치를 역 단위로 담은 파일로, 운영기관명·노선명·역명·역층·상세위치를 적은 소규모 목록(CSV 약 4KB)이다. 지하철 이용객이 '이 역에서 생리대나 손 세정제를 살 수 있는 자판기가 어느 층, 어디에 있나'를 확인하거나, 분석가가 노선별 위생용품 자판기 설치 현황을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·노선명을 이름으로 맞춰 연결해야 한다.
