summary_user: 인천국제공항을 출발하는 여객기의 하계 시즌 정기운항편을 편명별로 담은 스케줄 파일로, 운항요일, 예정 출발 시각, 목적지, 운항 시작·종료일자, 항공사를 포함한다. 여행자나 항공 분석가가 '이번 하계 시즌에 인천에서 특정 목적지로 가는 정기편은 어느 항공사가 무슨 요일 몇 시에 운항하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 운항·공항 데이터와는 편명·항공사명·목적지 이름을 맞춰 붙여야 한다.
description_portal: 인천국제공항공사에서 제공하고 있는 인천국제공항을 출발하는 여객기 하계 정기운항편의 출발 정보에 대한 데이터입니다. 이 데이터는 하계 시즌 동안 인천국제공항에서  운항되는  정기운항편을 대상으로 하며,항공기 운항요일, 운항편명, 항공기 예정 출발 시각, 목적지, 항공기 운항 시작일자와 종료일자, 항공사 정보 등 다양한 항목을 포함하고 있습니다. 특히, 목적지 정보와 정기운항 관련 사항은 국문·영문·중문·일문의 다국어로 제공되어 국내외 이용자가 쉽게 이해할 수 있도록 구성되어 있습니다.
