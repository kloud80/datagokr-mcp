summary_user: 대전교통공사 도시철도 22개 역사별 소방시설 법정점검 기록을 역사·연도 단위로 담은 파일(CSV)로, 역사명과 작동점검일·종합점검일, 점검결과를 싣는다. 시민이나 안전 분석가가 '내가 이용하는 대전 도시철도역은 언제 소방점검을 받았고 결과가 어땠나'를 확인하는 데 쓴다. 전역 조인 키가 없어 역사명을 이름으로 맞춰 대전교통공사의 역·시설 데이터와 연결해야 한다.
description_portal: '우리공사 22개역사 소방시설에 대한 법정점검을 시행, 관련법 준수 및 화재안전관리에 만전을 기함.* 관련근거  - 소방시설 설치 및 관리에 관한 법률 제22조(소방시설등의 자체점검 등) - 동법 시행령 45조(소방시설관리업의 등록기준 등) - 동법 시행규칙 제23조(소방시설등의 자체점검 결과의 조치 등) - 소방시설 자체점검 등에 관한 고시 제5조(점검사항, 세부점검방법 및 소방시설등 점검표* 추진사항 - 점검시기: 총 4회 / 건축물 사용승인 월별로 나누어 시행 - 점검대상: 22개역사 - 점검인력: 67일(201명) / 특급기술자(소방관리자) 1명 + 초급기술자 2명* 소방시설물 관리내용 - 연기감지기 교체, 화재수신기 교체 - 이산화탄소 소화설비 개량 - 특별점검 / 화재예방, 겨울철 대비, 연말연시 소방'
