summary_user: 인천광역시 부평구에 등록된 일반화물자동차 운송사업체를 업체별 한 행으로 담은 파일로, 업체명과 사업장 주소만 들어 있는 작은 목록(csv 약 2KB)이다. 화주나 지역 물류 담당자가 "부평구 안에 어떤 일반화물 운송업체가 어디에 있나"를 확인하거나 구 단위 운송사 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소 문자열로 맞춰 이어야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: '부평구에 등록된 일반화물자동차 운송사업체의 명칭과 소재지를 체계적으로 정리한 데이터입니다. 부평구의 화물 운송 기반을 파악하고, 효율적인 물류 네트워크 구축 및 관련 산업 지원 정책을 수립하는 데 필수적인 기초 자료로 활용됩니다.본 데이터는 다음과 같은 목적으로 활용 가능– 일반화물 운송사업체 분포 및 차량 규모 파악– 물류 네트워크 구축 및 교통량 추정 자료 활용– 사업자 등록 현황 관리 및 민원 대응– 지역 기반 물류정책 수립 및 기반시설 분석주요 항목 설명● 업체명: 등록된 일반화물 운송사업체의 명칭● 주소: 사업장의 도로명 또는 지번 기준 주소'
