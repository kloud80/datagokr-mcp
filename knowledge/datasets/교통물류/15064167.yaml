description_portal: <데이터 소개>부산지방해양수산청 해양수산환경과에서 제공하는 데이터입니다.부산항의 선박수리 민원 신고 및 허가 건수에 대한 데이터로 구성되어 있습니다.<활용 가능성>1. 전국, 부산항의 선박수리 산업의 실적 파악2. 전국에서 부산항이 차지하는 비율 파악3. 실적 추이를 분석하여 향후 선박수리산업의 지원방법 모색<제공 신청 내용>ㅇ 2020.7.22 제공 신청선박의 입출항 및 출항 등에 관한 법률에 따라 항만에서 선박수리를 하는 자는 지방 관할 해양수산청에  신고를 해야함. 이에 신고된 선박수리  월별 건수를 원합니다. 요청 데이터로는 선박수리신고 건수, 선박수리 허가 건수입니다.3년간 자료와 향후 데이터를 분석하여 실적 추이를 파악합니다.
