description_portal: 광주교통공사의 각 지하철역별 이용 행태를 분석하기 위해 작성된 자료로, 역명별로 ‘후탑 비율’과 ‘순수 지하철 이용 비율’이 백분율로 정리되어 있습니다. 여기서 ‘후탑 비율’은 해당 역에서 하차한 승객 중 다른 교통수단(버스, 택시 등)으로 환승한 비율을 의미하며, ‘순수 지하철 비율’은 지하철만 단독으로 이용한 승객의 비율을 나타냅니다. 이러한 데이터는 역별 환승 패턴을 정밀하게 파악하고, 지하철의 독립적 수송 기능과 타 교통수단과의 연계성을 동시에 분석하는 데 매우 유용합니다. 특히 특정 역에서 후탑 비율이 높게 나타나는 경우, 해당 지역의 교통 연계성을 강화하거나 환승 편의성을 개선할 필요성이 제기될 수 있습니다. 또한 정책 수립 시 순수 지하철 이용률이 높은 지역은 지하철 중심의 교통 운영 전략을 고려할 수 있어, 교통 인프라 계획, 이용 행태 분석, 시민 이동 경로 연구 등 다양한 도시철도 행정 분야에 활용될 수 있는 기초자료입니다.
