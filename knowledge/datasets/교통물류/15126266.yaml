summary_user: 대구광역시 ITS가 수집한 주요도로의 구간별 실시간 소통 상태를 담는다. 각 구간마다 구간명, 시작·도착 지점명, 가로명, 거리(m), 속도(km/h), 통행시간(초), 소통등급(원활·서행·정체), 정보가공일시가 들어 있다. 운전자는 지금 대구 어느 도로가 막히는지 확인하는 데 쓰고, 분석가는 이 값을 시간대별로 쌓아 상습 정체 구간을 찾는 데 쓴다. 표준노드링크 ID(STD_LINK_ID)로 국토교통부 표준노드링크 지도와 맞춰 볼 여지는 있으나, 실측 컬럼에서는 전역 조인 키가 확인되지 않아 다른 데이터와는 구간·도로 이름이나 같은 기관 코드로만 연결된다.
limits: 호출 시점의 현재값만 주므로 과거 추이나 상습 정체를 보려면 직접 주기적으로 받아 쌓아야 한다. 개발계정은 하루 5,000회로 제한되며, 다른 데이터와 붙일 확인된 공통 키가 없어 이름 매핑이 필요하다.
