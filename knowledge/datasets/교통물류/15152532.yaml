summary_user: 평창군 관내 불법주정차 신고 건을 한 건씩 담은 파일로, 신고일시·신고위치(읍·면 단위)·과태료 부과 여부를 2024년 1~12월 1년치로 제공한다. 평창군 담당자나 지역 분석가가 "어느 읍·면에서, 어느 시간대에 불법주정차 신고가 몰리고 그중 실제 과태료로 이어진 비율은 얼마인가"를 따지는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 읍·면 이름이나 같은 기관(평창군)을 기준으로만 맞춰 이어 쓴다.
description_portal: '강원특별자치도 평창군 관내 불법주정차 신고 및 과태료 부과 현황입니다.2024년 1월~12월 1년간의 데이터이며, 관리기관, 신고일시, 신고위치, 과태료부과여부, 데이터기준일자 등의 항목을 제공합니다.단속 위치와 시간을 통해 지역 내 단속 취약 지역 및 시간대를 파악하고 교통 혼잡 완화 대책 마련 및 주민 과태료 예방 등 다양하게  활용 할 수 있습니다.※ 개인정보는 포함되어 있지 않으며, 신고 위치는 읍·면 정보까지만 제공합니다.※ 자세한 정보는 관리부서로 문의하여 주시기 바랍니다.    - 관리부서: 평창군 안전교통과(☎033-330-2531)'
