description_portal: 'VOR(초단파 전방향 표지시설)은 항공기에 방위 정보를 제공하는 무선항법시설로, 항공기의 안전한 항로 비행과 정확한 위치 확인을 지원하는 핵심 항행안전시설입니다.공항식별자, 공항명, 유형, 식별자 ,무선방향장비명 ,좌표에 대한 정보를 제공하고 있습니다.무선방향장비명은 아래와 같습니다.VOR: 항공기에 방위 정보를 제공합니다.VORTAC: VOR 과 TACAN을 통합한 장비로, 방위 및 거리 정보를 제공합니다.좌표 표기 방식은 다음과 같습니다N (North): 북위를 의미하며, 위도 정보를 나타냅니다.E (East): 동경을 의미하며, 경도 정보를 나타냅니다.'
