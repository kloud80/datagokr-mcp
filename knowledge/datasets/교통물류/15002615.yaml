summary_user: 한국공항공사가 운영하는 전국 공항의 결항 현황을 공항·노선별로 집계한 파일로, 계획편수·운항편수·결항편수·결항률과 기상·연결편·정비·기타 원인별 결항 건수를 담는다(CSV 930바이트 규모). 분석가나 여행객이 어느 공항·노선에서 결항이 잦고 그 원인이 주로 기상인지 정비인지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 운항·통계 데이터와는 공항명·노선명을 이름 매핑하거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 14개 공항을 운영하고 있는 기관입니다.한국공항공사(Korea Airports Cooperation)가 운영하는 전국공항의 결항 현황정보를 제공합니다.해당 데이터는 공항, 노선, 결항편수, 결항, 기상 원인 결항 건수, 기상 원인 결항, 비행기 연결편 결항건수 및 결항률 정보로 이루어져 있습니다.추가 문의사항 또는 요구사항 있으시면 02-2660-4807로 문의주시기 바랍니다.
