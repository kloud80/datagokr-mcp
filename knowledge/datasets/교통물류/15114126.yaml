summary_user: UN/LOCODE 기준에 따라 국가별로 지정된 항구를 한 행씩 담은 코드표로, 국가코드·항구구분자·항구코드·국가명·항구명으로 구성된 약 1.3MB 분량의 CSV 파일이다. 해운·물류기업이나 분석가가 "이 항구코드는 어느 나라 어느 항구인가"를 확인하거나, 입출항·수출입 자료의 항구 표기를 표준 코드로 맞출 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 국가명·항구명 또는 항구코드 값 매핑으로 이어 쓰며, 해수부 내부 항만코드와 UN/LOCODE가 함께 쓰이므로 입출항·항만물류 데이터와 연결하려면 매핑표가 필요하다.
limits: 항구별 부두·선석·하역능력 같은 시설 정보는 없고 국가·항구 식별 코드만 담는다. 해수부 내부 항만코드와 UN/LOCODE가 병존하므로 다른 해수부 데이터의 항만코드와 그대로 일치한다고 가정하면 안 된다. 좌표가 없는 비공간 자료다.
