description_portal: '제주특별자치도에서 운영하는 주정차단속 용 버스탑재형 CCTV와 관련한 데이터를 제공합니다.항목: CCTV의 설치노선, 설치차량대수, 단속구간, 단속시간(평일/공휴일) 등*불법주정차 차량에 대한 단속을 통하여 교통사고 예방 및 원활한 교통흐름을 확보함*단속 방법 : 노선버스에 탑재된 CCTV 시스템 카메라를 통해 불법 주․정차 차량을 자동 번호인식하여 단속하고, 동일 노선의 후속 배차되는 버스에 탑재된 CCTV 시스템 카메라가 해당 차량 연속 촬영 시 불법 주․정차 단속 적발*단속시간: 평일 07:30 ~ 22:00, 토․일요일 및 공휴일 : 09:00 ~ 18:00'
