summary_user: 제주특별자치도가 불법 주정차 단속용으로 노선버스에 탑재해 운영하는 CCTV 현황을 노선 단위로 담은 작은 파일(CSV 662바이트)로, 행정시·노선명·운영업체·설치차량대수·단속구간·평일/공휴일 운영시간·단속방법을 기록한다. 제주에서 차를 대려는 운전자나 사업자가 "이 버스 노선 구간에서 몇 시에 버스 CCTV 주정차 단속이 이뤄지나"를 확인하거나, 분석가가 단속 구간을 불법주정차·교통사고 자료와 견줘 보는 데 쓴다. 전역 조인 키는 없어 노선명이나 단속구간 이름을 제주 버스 노선·정류장 정보와 이름으로 맞춰 이어 써야 한다.
limits: 실측 컬럼에 표준 코드 같은 전역 조인 키가 없어 다른 데이터와는 노선명·구간명 등 이름 매칭으로만 연결된다. 단속 실적(적발 건수)이나 좌표는 없고 운영 현황만 담는다.
