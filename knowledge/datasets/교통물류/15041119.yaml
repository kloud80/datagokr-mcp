summary_user: 부산 동해선에 포함된 도시광역철도역별로 운영기관명·노선명·역명과 지번주소·도로명주소를 한 행씩 담은 작은 역 주소 목록 파일(csv 약 1.8KB)이다. 동해선 각 역이 어느 주소에 있는지 확인하거나, 역 위치를 지도·역세권 분석의 기준점으로 삼으려는 분석가가 쓴다. 역 코드 같은 전역 조인 키가 없어 다른 철도·역 데이터와는 역명·노선명 이름 매칭으로 잇고, 주소는 주소·좌표 변환을 거쳐 공간 데이터와 연결한다.
description_portal: 부산동해선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 지번주소, 도로명주소의 데이터가 있습니다.주소(住所)는 거주소(居住所)의 준말로, 사람이 사는 곳이나 기관, 회사 따위가 자리 잡고 있는 위치를 일정한 형식의 거리 이름과 행정 구역으로 나타낸 정보의 집합체이다. 또한 어떠한 주소에는 우편 번호와 같이 우편물과 포장물의 이동을 도와주는 특별한 부호가 포함되어 있기도 하다.주소는 생활의 근거(根據), 즉 사람이 일상생활을 영위하고 또 사회적 활동을 할 때의 장소적 중심을 가리킨다. 주거를 정하고 생활의 도구를 비치하여 가정을 가지고 있는 곳으로서 보통 사람에게는 하나뿐이겠으나 예컨대 대부분의 변호사처럼 가정과 별도로 법률사무소를 가지고 있는 사람과 같은 경우를 보면 일상의 가정생활 관계의 것과 전문적인 직업관계의 것으로 각각 그 사정에 따라 주소가 두 개 있는 것으로 인정할 수가 있으며 또 그 편이 편리하기도 하다.
