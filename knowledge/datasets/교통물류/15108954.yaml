summary_user: 의왕시 도로 구간에 설치된 방호울타리(방지책)를 시설 한 건씩 담은 원천 목록이다. 시설마다 종류·재질·연장·높이·설치일자와 위도·경도가 있다. 보행안전지수 지도 시각화의 중간데이터로 만들어졌고, 시민이나 분석가가 '우리 동네 보행로 주변에 보행자 보호 울타리가 어디에 얼마나 설치돼 있나'를 공간적으로 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다른 데이터와는 행정동읍면코드·도로구간 번호 같은 기관 내부 코드나 위도·경도 좌표 매칭으로 이어 쓴다.
description_portal: 이 데이터는 의왕시 내 도로 구간에 설치된 방호울타리(방지책)의 현황을 담고 있으며, 보행안전지수 지도 시각화를 위한 중간데이터로 활용됩니다. 각 울타리 시설의 공간지리식별번호, 지형지물부호, 도로구간번호, 방지책 종류, 재질, 길이, 높이, 위도·경도 등 구조물의 물리적 정보와 위치 데이터를 포함하고 있습니다. 이를 통해 도로 주변 보행자 보호시설의 분포와 특성을 공간적으로 분석할 수 있으며, 보행 안전 수준을 종합적으로 파악하는 데 기초 자료로 쓰입니다. 이 데이터는 2022년을 기준으로 수집된 자료로 현재의 시설 설치 여부나 변경사항은 반영되어 있지 않으므로 참고용으로 활용하시기 바랍니다.
