summary_user: 충주시 자동차 등록 대수를 읍면동·차종(승용·승합·화물·특수)별로 나누고, 비사업용·사업용과 경형·소형·중형·대형 규모별로 집계한 통계 파일이다(통계기준년월 기준, 약 9.5KB CSV). 충주시의 어느 읍면동에 승용차나 화물차가 많은지, 사업용 차량 비중이 어느 정도인지를 확인하려는 교통·주차 정책 담당자나 지역 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 읍면동 이름을 행정구역 코드에 맞춰 매핑해 붙이거나, 같은 충주시의 다른 통계와 기관 단위로 이어 쓴다.
description_portal: 본 데이터는 충청북도 충주시의 법정도별 자동차 등록 현황을 제공하는 자료로, 구분(비사업용/사업용), 차량유형(승용, 승합, 화물, 특수), 차량규모(경형, 소형, 중형, 대형) 등의 항목으로 구성되어 있음. 이를 통해 지역별 자동차 보급 수준과 차량 구조를 정량적으로 파악할 수 있으며, 교통행정 및 도시계획 수립에 기초자료로 활용됨. 특히 비사업용 차량과 사업용 차량의 비중을 비교하거나 차량 종류별·규모별 분포를 분석하면 교통수요 관리, 주차 정책, 대중교통 연계 정책 마련 등에서 중요한 참고자료가 됨. 또한 장기적 추세 분석을 통해 자동차 증가 추이, 교통 혼잡도 변화, 환경영향 평가 등 다양한 정책적 활용이 가능함.
