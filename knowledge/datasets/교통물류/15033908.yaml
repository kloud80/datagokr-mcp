description_portal: 전라남도 무안군 관내에 설치하여 현재 버스가 운행되고 있는 버스정류장에 대한 정보를 제공합니다. 본 파일데이터에는 버스 정류장명, 정류장 소재지지번주소, GPS 위도, GPS 경도, 데이터기준일자 등의 항목들을 제공하고 있으며, 버스정보시스템(BIS)에 구축된 버스정보와 국가대중교통정보센터(TAGO)와 연계된 버스정류장의 상세한 위치정보를 포함한 데이터를 제공합니다. 교통서비스개선, 모빌리티플랫폼 활용, 도시계획 및 정책수립, 민간 비즈니스 활용 등 다양하게 이용가능한 자료입니다.
