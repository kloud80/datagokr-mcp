status: active
summary_user: 전라남도 무안군 관내에서 버스가 운행 중인 정류장을 한 행에 하나씩 담은 정류장 목록 파일로, 정류장명·지번주소·위도·경도·데이터기준일을 개별 정류장 단위로 제공한다. 주민이나 모빌리티 서비스 사업자가 '무안군 안에서 이 주소 근처에 있는 버스정류장은 어디인가'를 확인하거나 정류장 분포를 지도에 올려 교통 취약지역을 살피는 데 쓴다. 정류장 ID 같은 전역 조인 키가 없어서 TAGO·BIS 노선·도착 정보나 다른 데이터와는 정류장명 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 정류장 고유 코드가 없어 다른 정류장·노선 데이터와 정확히 1:1로 맞추기 어렵고, 이름이나 좌표로 매칭해야 한다. 범위는 무안군 한 곳의 정류장 위치뿐이며, 노선·배차·실시간 도착 정보는 이 파일에 없다.
