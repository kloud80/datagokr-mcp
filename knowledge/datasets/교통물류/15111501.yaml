description_portal: '‘한국철도공사_시군구단위 거주 철도이용객 열차종별 선호레저 정보’는 2022년 4월부터 6월까지 강릉, 경주, 목포, 부산, 안동, 영주, 여수, 전주 등 주요 관광지를 방문한 철도 이용객의 거주지(시군구)별로, 열차종별(예: KTX, 무궁화호, 새마을호 등)로 발권한 철도회원의 1순위 선호레저 유형을 집계한 데이터입니다. 이 데이터는 거주지 기준 시군구 단위로 각 열차종별 승차권을 이용한 회원들이 가장 선호하는 주요 레저 활동(예: 골프, 스키, 해양스포츠 등)의 분포와 패턴을 구체적으로 보여줍니다.이 데이터를 통해서는 시군구별로 열차종별 이용객들이 어떤 레저 유형을 1순위로 선택하는지, 고속철·일반열차별로 선호 레저활동의 트렌드가 어떻게 다른지, 특정 열차종과 지역의 연계성을 바탕으로 인기 레저 유형의 지역별 집중도, 관광지와 연계된 레저 수요 등이 객관적으로 파악됩니다. 또한 열차종(고속/일반), 지역별 특성, 특정 레저 유형 집중 등의 차이를 비교 분석하여, 여행 목적지에 따른 교통수단-레저 활동 매칭과 계절, 지역, 노선별 수요 변화 등도 유추할 수 있습니다.이 자료는 지역별·노선별 관광 및 레저 상품 개발, 열차별 마케팅 전략 및 레저 연계 프로모션 기획, 지역 인프라 투자 및 관광 정책 수립, 열차운영 서비스 개선, 지자체·공공기관의 교통 및 관광 트렌드 조사, 학술·연구기관의 이동·소비행태 분석, 언론의 지역별 레저 트렌드 보도 등 다양한 분야의 참고자료로 활용될 수 있습니다.'
