summary_user: 국토교통부 ITS와 연계해 받은 고속도로·국도 사고정보를 건별로 담은 파일로, 등록일시·도로정보·진행방향·사고정보메시지와 경위도 좌표를 전국 범위로 기록한다. 위험물 운송 관제나 도로 안전 분석가가 특정 노선·구간에서 언제 어떤 사고가 났는지, 사고가 어디에 몰리는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 경도·위도 좌표로 공간 결합하거나 도로명을 이름으로 맞춰 이어 쓰고, 사고 다발지역 분석에는 도로교통공단(TAAS) 다발지역 자료와 함께 본다.
description_portal: 한국교통안전공단은 위험물질운송안전관리시스템을 통해 위험물 운송차량을 실시간으로 관제하고 있습니다. 국토교통부 ITS와 연계하여 고속도로와 국도의 사고정보를 실시간으로 받아 위험물 차량 운행 상황을 신속하게 파악하고, 사고 예방과 신속한 대응이 가능하도록 운영 중입니다. 이러한 정보를 공개함으로써 관련 기관과 국민이 위험물 운송 관련 현황을 더욱 투명하게 확인할 수 있으며, 교통사고 대응력과 안전관리를 한층 강화할 수 있습니다. 데이터 개방을 통해 운수업계와 공공 안전 향상에 기여하고자 합니다.
