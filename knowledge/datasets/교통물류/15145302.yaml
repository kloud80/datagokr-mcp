summary_user: 안산시 실시간 도로교통 분석 시스템(ARTR)의 운영구간별 월별 교통 현황을 담은 집계 파일로, 통계월·운영구간마다 교통량·속도·점유율과 RSE·VDS·UTIS·AVI·BIS·민간 등 수집원별 속도·건수, 교차로구간 용량·포화도·서비스 수준을 담는다(csv 약 12.7MB). 교통 분석가나 시 담당자가 '안산시 어느 구간이 몇 월에 속도가 떨어지고 포화도가 높아지는가'처럼 상습 정체 구간과 계절별 흐름 변화를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 운영구간 아이디를 안산시 자체 구간 정보와 이름·코드로 맞춰야만 이어 쓸 수 있다.
description_portal: 이 정보는 ARTR(안산시 실시간 도로교통 분석 시스템)의 월별 교통 현황을 기록한 표준 테이블로, 측정월, 노선명, 구간명, 통행량, 평균속도, 혼잡도, 소요시간, 차종별 통계 등으로 구성됩니다.이 정보는 장기적인 교통량 변화 추세 분석, 혼잡 완화 대책 수립, 출퇴근 시간대 교통 흐름 개선, 도로 용량 확충 계획, 신호 체계 조정, 대중교통 및 물류 효율화 전략 수립, 환경영향 분석 등에 활용됩니다. 특히 월별 차종별 통계와 평균속도 데이터는 계절별 교통 패턴 파악, 물류 경로 최적화, 탄소배출 저감 계획, 도로 유지보수 우선순위 결정 등에도 중요한 기초자료로 쓰입니다.
