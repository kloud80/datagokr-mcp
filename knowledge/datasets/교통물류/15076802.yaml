summary_user: 대전광역시 안에서 주정차가 허용된 도로 구간을 한 행에 한 구간씩 담은 파일로, 시군구·도로명·허용 구간·연장·허용 구분·허용 시간·허용 일자를 기록한다. 운전자나 인근 상인이 '이 도로에서 몇 시에 차를 세워도 되는가'를 확인하거나, 분석가가 구별 주정차 허용 구간 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군구명·시군구코드나 도로명을 맞춰 붙여야 하며, 주정차 금지·단속 구간 데이터와 대조하는 용도에 맞는다.
description_portal: 대전광역시 주정차 허용구간 데이터는 대전광역시 내 주정차 허용구간의 관리번호, 시군구명, 시군구코드, 도로명, 허용 구간, 연장, 허용 구분, 허용 시간, 허용 일자, 기타 등 다양한 항목으로 구성되어 있으며, 교통 흐름 개선과 지역 상권 활성화를 위해 시간대별로 주정차가 허용되는 구간을 지정·운영하고 도로 여건과 지역 특성에 따라 유동적으로 관리되고 있어, 주정차 허용 구간의 위치, 구간 별 허용 조건, 공간정보 등은 교통정책 수립, 도시교통 관리, 상권 활성화 등 다양한 행정적·정책적 목적에 활용될 수 있습니다.
