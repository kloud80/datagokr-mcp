summary_user: 안산시 교차로별로 15분 간격의 교통량과 포화도를 담은 집계 통계 파일이며, 통계일시·교차로 아이디·교통량·포화도로 구성된다(일정 기간 샘플로 제공, CSV 약 467KB). 교통 분석가나 시 교통 담당자가 '특정 교차로가 어느 시간대에 가장 붐비고 포화 수준이 얼마인가'를 확인하거나 신호 운영 조정 근거를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 교차로 아이디를 안산시 자체 교차로 목록이나 같은 기관 자료와 이름·코드로 맞춰야만 위치나 다른 데이터와 연결된다.
