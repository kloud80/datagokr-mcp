summary_user: 부산광역시 자율주행버스의 운행 중 차량 상태를 단말기(terminalId)·기록 일시(logDate, 시 단위 형식) 단위로 담으며, 정차·주행 여부, 속도, 레이더·라이다·카메라 센서의 정상·장애 상태, 금일·누적 운행 거리, 배터리 잔량이 포함된다. 교통 분석가나 운영 담당자가 "특정 시간대에 센서 장애가 난 차량이 있었는가, 하루 운행 거리와 배터리 소모는 어땠는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 노선·정류장·도착 정보 등 다른 대중교통 데이터와는 단말기 ID나 같은 기관 기준의 이름 매핑으로만 느슨하게 연결한다.
limits: 다른 데이터와 직접 이을 공통 키가 없어 노선·정류장·승하차 데이터와의 결합은 수작업 매핑이 필요하다. 차량 위치 좌표가 없는 비공간 데이터라 지도상 위치 분석에는 쓸 수 없다. 개발계정은 일 1,000회 호출로 제한된다.
