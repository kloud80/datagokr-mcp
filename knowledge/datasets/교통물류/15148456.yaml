summary_user: 대구광역시 북구 관할에서 발생한 교통사고를 건별로 담은 CSV 파일로, 사고발생일시·사고장소·행정동·사고종별·사고원인·피해와 경도·위도 좌표를 사고 한 건 단위로 제공한다. 북구청이나 분석가가 '북구에서 어린이 보행 사고가 잦은 지점은 어디이고, 교통안전시설물을 어디에 먼저 설치해야 하나'를 따질 때 쓴다. 전역 조인 키는 없어서 행정동 이름으로 북구의 다른 행정동 단위 데이터와 맞추거나, 경도·위도로 도로교통공단(TAAS) 사고다발지역 같은 공간 자료와 겹쳐 보는 방식으로 잇는다.
description_portal: 대구 북구 내 보행어린이 취약지역 도출 및 교통안전시설물 우선 입지 선정 근거 마련을 하고자 보행어린이 교통안전 데이터분석을 위해 수집한 대구광역시 북구 데이터통합플랫폼에 저장된 데이터로 관할 내의 교통사고 발생 위치 정보를 제공합니다.사고발생일시, 사고장소, 행정동, 사고종별, 사고원인(안전운전불이행, 보행자보호의무위반 등),  피해, 경도, 위도, 데이터기준일자 항목을 제공합니다.해당 DB의 데이터는 업데이트가 중단된 상태이며, 데이터기준일자가 과거(2018년)이므로  유의하시기바랍니다.
