description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 2023년부터 현재까지 대구 시내버스에서 도시철도로 환승한 이용객의 월별·역별 환승 현황을 제공합니다. 일반, 청소년, 어린이 등 연령대별 환승 인원 정보를 포함하고 있어 대중교통 간 연계 이용 행태를 정량적으로 분석하는 데 활용할 수 있습니다. 또한 월별 환승 수요 변화와 역사별 이용 특성을 비교·분석할 수 있어 환승 거점의 이용 현황을 종합적으로 파악할 수 있습니다. 해당 자료는 도시철도 역별 유입 통계, 연령대별 환승 패턴 분석, 교통요금 정책 효과 평가, 노선 최적화 및 환승체계 개선 등 데이터 기반 교통정책 수립을 위한 기초자료로 활용될 수 있습니다. 또한 대중교통 이용 활성화와 시민 이동편의 증진, 교통 서비스 품질 향상을 위한 정책 및 연구에도 활용할 수 있습니다. 본 데이터는 매월 정기적으로 갱신됩니다.'
