summary_user: 광양항 항만공사가 관리하는 부두·시설 자산을 자산 건별(자산코드·자산명·지번·면적·재산구분)로 담고, 자산별 임대 허가 내역(신청·허가일자, 사용 기간, 사용면적)과 위치별·부두별 사용·미사용 면적 합계를 함께 제공한다. 항만 배후부지 입주를 검토하는 물류 사업자나 분석가가 "광양항 어느 부두에 아직 임대되지 않은 면적이 얼마나 남아 있나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 항만 데이터와는 항코드(prtAtCode)·부두명 같은 이름·코드 매핑이나 같은 기관 코드로만 잇는다. 항코드는 UN/LOCODE와 해수부 내부 코드가 함께 쓰여 입출항·물류 데이터와 맞추려면 매핑표가 필요하다.
description_portal: 여수광양항만공사에서는 광양항을 관리 운영하는 공공기관입니다.이와 관련해서 관리 및 운영하고 있는 부두, 시설 등 자산에 대한 운영현황을 조회할 수 있습니다. 세부적으로 오퍼레이션은 자산현황 조회, 자산임대현황 조회, 위치별 사용 현황 조회, 부두별 사용현황 조회입니다.이 데이터들은 항만공사의 자산 운영 전략을 수립하고, 자산 활용 효율성 평가, 임대 정책 개선, 유휴자산 발굴, 신규 개발 필요성 검토 등에 핵심 자료로 활용됩니다. 또한 공공기관으로서 투명한 자산 관리 및 외부 이해관계자와의 정보 공유 차원에서도 중요한 역할을 합니다.해당 데이터의 시간적 공간적 범위를 참고하시어 활용해주시기 바랍니다.
