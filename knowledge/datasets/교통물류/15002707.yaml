summary_user: '한국공항공사가 운영하는 공항에 취항하는 국내 항공사별 국내선 노선(예: 김포-김해, 제주-김포)을 항공사와 취항노선 한 줄씩으로 정리한 작은 목록 파일(csv, 1348 bytes)이다. 여행객이나 분석가가 "어느 항공사가 어느 공항 사이 국내선을 운항하나"를 확인할 때 쓴다. 공항코드나 항공사 코드 같은 전역 조인 키가 없어서, 다른 운항·통계 데이터와는 항공사명과 공항명을 이름으로 맞춰 이어 써야 한다.'
description_portal: 한국공항공사(Korea Aiports Cooperation)는 인천국제공항을 제외한 전국 14개 공항을 운영하는 기관입니다.한국공항공사에서 제공하는 해당 데이터는 전국 공항에 취항하는 국내 항공사별 국내선 항공노선 정보로 이루어져 있습니다..(ex. xx항공 김포-김해, 제주-김포 노선)해당 데이터를 보시면 항공사에서 어디 공항을 운행하는지 한눈에 확인 할 수 있습니다.데이터에 대한 추가 요구사항이나 문의사항 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
