summary_user: 경기도 도로대장 전산화 시스템에 등록된 정차대(버스 등이 도로변에서 임시로 서는 공간)를 한 곳씩 기록한 원천 목록으로, 노선번호·구간번호·위치·방향·연장·폭원·대기소 유무·위도·경도·비고를 담는다. 교통계획 담당자나 분석가가 "이 도로 노선의 어느 구간에 정차대가 있고, 폭과 길이는 얼마이며, 대기소가 갖춰져 있는가"를 확인하고 정류장 안전성을 평가하는 데 쓴다. 전역 조인 키는 없어 노선번호(route_no)·구간번호(section_no)로 같은 기관의 다른 도로대장 데이터와 이름·코드를 맞춰 이어야 하고, 표준노드링크와는 링크 ID가 없어 위경도 좌표를 기준으로 공간 매칭해야 한다.
description_portal: 이 데이터는 도로대장전산화시스템을 통해 수집된 정차대(버스 등의 차량이 임시로 정차할 수 있도록 도로변에 설치된 공간)에 대한 정보를 포함하고 있습니다. 항목에는 노선번호, 구간번호, 위치, 방향, 연장, 폭원, 대기소유무, 공간정보(위도·경도), 비고 등이 포함되어 있습니다. 정차대의 물리적 특성과 위치 정보를 제공함으로써, 도로 인프라의 정밀한 관리와 도시교통계획 수립, 정류장 안전성 평가 등에 활용될 수 있습니다. 또한 ‘대기소유무’ 항목은 상·하행 방향 구분뿐 아니라 차량 정차 및 대기 가능 여부를 파악하는 데 유용하며, ‘비고’ 항목에는 주요 지명 또는 참고 정보가 포함되어 있어 현장 식별을 돕습니다. 공간정보와 함께 제공되어 GIS 기반의 교통공간 분석 및 인프라 개선 자료로도 활용 가능합니다.
