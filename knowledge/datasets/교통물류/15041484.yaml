summary_user: 대구교통공사가 운영하는 도시철도 역의 자동제세동기(AED) 설치 현황을 역·위치별 행으로 담은 파일(csv, 약 9.8KB)로, 노선·역명·지상지하 구분·역층·출입구 번호·상세위치와 제세동기의 출력에너지·운영방식·수량을 기록한다. 대구 도시철도 이용객이나 역 안전관리자가 "이 역의 몇 층, 어느 출입구 근처에 제세동기가 몇 대 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 역 시설·승하차 데이터와는 선명·역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 대구교통공사에서 운영하는 도시광역철도역들의 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 출입구번호, 상세위치, 제세동기출력에너지, 제세동기운영방식, 수량의 데이터가 있습니다.자동제세동기는 자동(自動)으로 세동(細動)을 제(際)거하는 기(器)계라는 의미다. 환자에게 심정지(심장마비)가 왔을 때 자동제세동기를 통해 환자의 심장을 인위적으로 뛰게 하면, 환자의 생존율을 두 배 이상 높일 수 있다. 하지만 이런 중요성에도 불구하고, 대다수의 사람들은 자동제세동기의 기능과 사용법에 대해 알지 못한다. 평소에 자동제세동기에 대한 전반적인 내용을 숙지토록 하여야 한다.
