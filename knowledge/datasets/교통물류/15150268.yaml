summary_user: 한국도로공사가 관리하는 1종시설물 교량을 교량 단위로 담은 전국 목록으로, 본부·지사·노선·방향별로 교량명, 개통연도, 교량 연장(미터), 이정(km)을 담는다. 고속도로 노선에서 특정 구간에 어떤 교량이 있고 언제 개통했는지, 노후 교량이 어느 지사 관할에 몰려 있는지 살피는 분석가·안전관리 담당자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 노선번호(RTE_NO)·노선명이나 교량명 같은 이름·코드 매칭으로만 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하는 정보로 교량명, 개통연도, 교량연장미터 등의 제공하고 있습니다."
