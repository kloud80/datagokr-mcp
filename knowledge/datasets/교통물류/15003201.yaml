description_portal: 전주시설관리공단에서 관리하는 전주시 공영주차장에 대한 정보로 주차장명, 주차면수, 운영시간, 당일최고요금, 주차요금, 주소, 전화번호를  제공합니다시민의 주차 편의 증진과 정보 접근성 향상을 목적으로 제공되며 주차요금 및 운영시간은 정책 변경, 조례 개정, 현장 운영 상황에 따라 변동될 수 있습니다. 자세한 사항은 전주시시설관리공단 홈페이지 jjss.or.kr을 참고하여 주시기 바랍니다.
