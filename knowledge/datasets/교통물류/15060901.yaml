description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야에 해당하는 운영정보 데이터로, 대구도시철도 3호선의 연도별 열차운행실적을 제공합니다. 수록 기간은 2015년부터 2025년까지이며, 정기 및 임시 영업열차 운행횟수, 비영업열차 운행횟수, 정기 및 임시 영업열차 주행거리(km), 비영업열차 주행거리(km) 등 다양한 운행실적 정보를 포함하고 있습니다. 본 자료는 연도별 열차 운행 현황과 운행 패턴을 체계적으로 분석하고, 도시철도 운영의 효율성과 안정성을 평가할 수 있도록 구성되어 있으며, 데이터 기반 운영계획 수립과 시설·차량 운영 관리, 정책 의사결정을 위한 기초자료로 활용될 수 있습니다. 또한 공공교통 운영정보의 투명한 공개를 통해 행정의 신뢰성과 책임성을 높이고, 공공교통 서비스 품질 향상과 지속가능한 도시철도 운영을 지원하는 자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
