summary_user: 성남시 관내 공영주차장별로 연도마다 1월~12월 월별 입출차 건수를 담은 집계 파일(CSV 약 42KB)이다. 시 교통 담당자나 분석가가 '어느 공영주차장이 어느 달에 이용이 몰리는가'처럼 주차장별 계절·월별 수요 차이를 비교하는 데 쓴다. 실측 컬럼에 주차장관리번호 같은 전역 조인 키가 없어, 전국주차장정보표준데이터(면수·좌표·요금)와는 주차장명(주차장명)을 이름 매칭해서만 이어 쓸 수 있다.
description_portal: 성남시 공영주차장 월별 입출차 현황 자료는 성남시 관내 공영주차장의 이용 실태를 월 단위로 기록한 자료입니다. 이 자료는 주차장별로 연도와 월에 따라 입차 및 출자 건수를 제공하며, 공영주차장 명과 월별(1월~12월) 입출차 수 항목이 포함되어 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당 자료는 성남시의 주차 수요와 공급을 분석하고 주차장 운영 효율화를 위한 정책수립의 기초 자료로 활용할 수 있습니다.
