summary_user: 진주시 관내 버스노선을 노선 1건당 1행으로 정리한 노선 원장 파일로, 노선번호·노선아이디·구분·방면·거리·하루 운행횟수·운행개시일·운수회사를 담는다. 진주시 교통 담당자나 분석가가 노선 개편을 검토하면서 '어느 노선이 거리 대비 운행횟수가 적은가', '운수회사별로 어떤 노선을 맡고 있는가'를 확인할 때 쓴다. 전역 조인 키는 없어서, 정류장·실시간 도착 정보 같은 다른 버스 데이터와는 노선번호나 노선아이디를 이름·코드로 맞춰 붙여야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 바로 결합되지 않고, 노선번호·노선아이디를 직접 대조해야 한다. 범위는 진주시 한 곳뿐이며, 노선별 정류장 순서나 실시간 운행 정보는 담지 않는다.
