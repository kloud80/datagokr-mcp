description_portal: 서울교통공사에서 운영 중인 1~8호선 203개 역사에 비치하여 운영 중인 이동식 안전발판 관련 데이터입니다.(2026년 2월 기준). 해당 데이터에는 역별 이동식 안전발판의 총 비치 수량이 포함되어 있습니다. 이동식 안전발판은 휠체어를 사용하는 교통약자가 지하철을 이용할 때 편의를 도모하기 위한 목적으로 배치하고 있습니다. 276개 역사 중 연단 간격이 넓거나 단차가 높은 역을 선정하여 배치하고 있습니다. 이동식 안전발판을 사용하여 지하철을 탈 때 발생할 수 있는 발빠짐 사고를 방지하고 있습니다. 현재 203개 역에서 219개를 배치하여 운용 중이며, 도움이 필요한 승객들이 사용할 수 있도록 운용하고 있습니다
