summary_user: 충청남도 아산시에 설치된 과속방지턱을 한 건씩 담은 데이터로, 위치(위도·경도, 도로명·지번 주소)와 도로명, 높이·폭, 형태·재질, 설치연도, 기준 규격 준수 여부 등을 개별 시설 단위로 제공합니다. 운전자 안내 서비스 개발자나 교통안전 분석가가 '아산시 어느 도로에 규격에 맞지 않는 과속방지턱이 있는가' 같은 질문을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 도로명·주소 이름 매칭이나 좌표 기반 공간 결합으로 이어 쓰고, 같은 아산시가 제공하는 데이터와는 기관명으로 묶는다.
limits: 아산시 한 곳만 담고 있어 다른 시군구와 비교하려면 지자체별 데이터를 따로 모아야 한다. 공통 코드 키가 없으므로 다른 데이터와 연결할 때 주소 표기 차이나 좌표 오차에 주의해야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
