summary_user: 서울시 TOPIS를 원천으로 한 서울 시내버스 정류장 원장으로, 정류장 하나마다 정류장 ID·명칭·유형·정류장 번호·위도·경도와 버스도착정보안내기 설치 여부(미설치·설치·확인불가)를 담는다. 시민이나 분석가가 '우리 동네 정류장 중 도착정보안내기가 없는 곳은 어디인가', '특정 정류장 번호의 위치는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않았으므로, 서울시 노선·도착·승하차 데이터와는 같은 기관의 정류장 ID(CRTR_ID)나 정류장 번호로 이어 쓰고, 다른 기관 데이터와는 정류장 이름 매핑이나 좌표로 연결해야 한다.
description_portal: '해당 데이터는 서울시 정류장 마스터 정보입니다. 서울시 정류장에 대한 정류장 ID, 정류장 명칭, 정류장 유형, 정류장 번호, 정류장 위도, 정류장 경, 버스도착정보안내기 설치 여부(미설치, 설치, 확인불가) 정보를 확인할 수 있습니다. 데이터의 원천 시스템은 서울시 교통정보 시스템(TOPIS)(https://topis.seoul.go.kr)입니다. 자치구정류장 코드분류는 자치구, 정류장ARS, 정류장ID 정보를 제공합니다.부서: 교통정보과(02-2133-4959)※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
