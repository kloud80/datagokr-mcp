summary_user: 장성군 안의 충전소를 한 곳씩 담은 현황 파일로, 충전소 구분·상호·대표자·소재지·위도·경도·충전종류·전화번호를 개별 시설 단위로 담는다. 장성군 주민이나 운전자가 근처 충전소 위치와 충전 종류를 확인할 때, 분석가가 군내 충전 인프라 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소나 위도·경도 좌표, 상호 이름으로 맞춰 잇는다.
limits: 법정동·행정 코드 같은 공통 키가 없어서 다른 데이터와 붙이려면 주소 문자열이나 좌표로 매칭해야 한다. 범위는 장성군 한 곳의 시설 목록에 그쳐 다른 시군과 비교하려면 별도 파일이 필요하다.
