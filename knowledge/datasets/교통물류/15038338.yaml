description_portal: 한전KDN이 빛가람혁신도시 내 시민과 임직원의 편의를 위해 빛가람정보포탈을 통해 제공한 나주시 버스 노선 운행 시간 정보입니다. 주요 항목은 버스 노선별 상행(도심 방향) 및 하행(외곽 방향) 첫차와 막차 시간으로 구성되어 있으며, 이용자는 이를 통해 출퇴근 및 대중교통 이용 계획을 수립할 수 있습니다. 이 데이터는 지역 교통 접근성을 높이고, 대중교통 이용 활성화를 통해 친환경 이동 수단 확산에도 기여할 수 있습니다. 특히 디지털 기반 생활정보 제공을 통한 공공서비스 품질 향상 측면에서 의미가 있으며, 시민 생활 편의성과 지역사회 연계 강화를 위한 노력의 일환으로 활용됩니다.
