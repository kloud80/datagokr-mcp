summary_user: 나주시 버스 노선별로 배차간격과 상행(도심 방향)·하행(외곽 방향)의 기점·종점, 첫차·막차 시간을 한 행씩 담은 노선 원장 파일이며, 파일 크기는 825바이트로 노선 수가 적은 소규모 자료다. 빛가람혁신도시 주민이나 임직원이 "이 노선의 첫차와 막차는 몇 시이고 배차간격은 얼마인가"를 확인해 출퇴근 계획을 세우는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 정류장·실시간 도착(TAGO·지자체 BIS) 같은 다른 버스 데이터와는 노선아이디나 노선명을 이름·코드 매핑으로 맞춰야만 연결된다.
limits: 표준 노선 코드 같은 전역 조인 키가 없어 다른 교통 데이터와 바로 결합되지 않으며, 노선명·노선아이디를 수작업으로 대조해야 한다. 범위가 전국·비공간으로 표기되어 있으나 실제 내용은 나주시 노선이고 좌표가 없어 위치 기반 분석에는 쓰기 어렵다.
