description_portal: 'VOR 체크포인트란, 항공기의 위치 확인과 항법 장비 점검을 위해 비행 경로상에 설정된 고정 기준 지점으로, 항공기가 VOR(Directional Radio Beacon) 신호를 수신하여 자신의 위치를 확인하거나 장비의 정확도를 검증하는 데 활용됩니다.VOR 체크포인트는 공항식별자, 공항명, vor checkpoint와 연관된 유도로 정보를 제공하고 있습니다.공항식별자: 해당 공항을 고유하게 식별할 수 있는 코드입니다.공항명: 공항의 명칭을 나타냅니다.연관유도로 : VOR 체크포인트는 항공기의 항법 장비 확인을 위한 참조 지점으로, 실질적인 접근성과 활용성을 고려해 인접한 유도로 기준으로 정보를 제공합니다'
