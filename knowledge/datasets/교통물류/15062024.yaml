summary_user: 운수종사자관리시스템에 등록된 버스·택시·화물 운수종사자 수를 연도별·시도별로 20대부터 70세 이상까지 7개 연령대로 나눠 집계한 통계 파일이다. 지역별 운수종사자 고령화 정도를 파악하려는 정책 담당자나 분석가가 "어느 시도에서 65세 이상 버스·택시 기사 비중이 높은가" 같은 질문에 쓴다. 전역 조인 키는 없어서, 다른 시도 단위 통계와는 시도 이름(구분)을 직접 맞춰 이어 쓴다.
description_portal: '운수종사자관리시템은 여객자동차 운수사업법 및 화물자동차 운수사업법에 따라 버스, 택시, 화물자동차를 운전하는 운수종사자의 종사자격 등을 관리하는 시스템 입니다.관리하고 있는 모든 데이터는 개인정보이므로, 데이터를 가공하여 통계데이터를 개방하였습니다.  * 관리항목 : 운수종사자 경력사항, 교통사고 및 법규위반 이력, 운전적성정밀검사, 운전면허, 자격증 정보, 교육현황정보해당 데이터는 운수종사자관리시스템에 등록된 운수종사자의 연령별,지역별에 따른 운수종사자현황(버스,화물,택시) 건수를 가공하여 제공하는 정보 입니다.- 20대, 30대, 40대, 50대, 60~64세, 65~69세, 70세 이상'
