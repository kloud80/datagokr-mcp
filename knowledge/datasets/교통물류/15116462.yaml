summary_user: 대구 수성구 관내에서 자동차 공회전을 제한하도록 지정된 구역을 장소 한 곳당 한 행으로 담은 원천 목록으로, 구분·상호·소재지와 고정식·부착식 표지판 여부, 표지판 설치위치를 담는다(CSV 약 2.4KB의 소규모 파일). 수성구 운전자나 주차장·사업장 이용자가 '이 장소가 공회전 제한구역인지, 안내 표지판이 어디에 붙어 있는지'를 확인하거나, 분석가가 구 단위 공회전 단속 대상 장소 분포를 볼 때 쓴다. 전역 조인 키나 코드표는 없어 소재지 주소를 지오코딩하거나 상호·주소 문자열로 다른 주차장·시설 목록과 맞춰 이어 쓴다.
description_portal: 대구광역시 수성구_자동차공회전제한구역 데이터는 수성구 관내에서 자동차 공회전을 제한하기 위해 지정된 구역에 대한 정보를 담고 있는 공공데이터입니다.공회전 제한이란, 자동차가 멈춰 서 있을 때 시동을 계속 켜 놓는 것을 막는 것을 말하며, 이 데이터는 어디서 공회전을 제한하고 있는지, 그 장소에 어떤 안내 표지판이 설치되어 있는지를 알려줍니다.자동차 공회전은 불필요한 연료 소비를 유발하고 대기오염, 온실가스 배출의 원인이 되기 때문에, 특정 지역에서는 이를 제한하여 쾌적한 생활환경을 조성하고자 합니다.구분, 상호, 소재지, 표지판형식, 표지판 설치위치에 대한 데이터를 제공합니다.
