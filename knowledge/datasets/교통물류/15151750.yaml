summary_user: 수출입 물류 공공·민간 데이터 공유 플랫폼에 선사 담당자가 입력한 적시선박 입출항 일정을 선박·항차·이벤트 단위로 담은 건별 파일로, 항만·접안 터미널 코드, 입항·접안·출항 일시, IMO번호가 들어 있다. 물류 분석가나 화주가 '특정 선박이 어느 항만 터미널에 언제 접안하고 출항했는가'를 확인하거나 선박의 정시 운항 여부를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, IMO번호(아엠오번호)나 항만·터미널 코드를 이름·코드 매핑으로 맞춰 Port-MIS 입출항 신고나 선박 위치 자료와 이어 쓴다.
description_portal: '수출입 물류 공공·민간 데이터 공유 플랫폼에서 제공 중인 적시선박 입출항 정보입니다.1. 데이터 개요: 수출입 물류 공공·민간 데이터 공유 플랫폼에서 선박의 적시 운항을 관리하기 위한 입출항 데이터 입니다.2. 데이터 내역: 입출항 항만과 접안 터미널 코드, 항차번호, 입항일시, 접안일시, 출항일시로 구성되어 있습니다.3. 기타사항: IMO번호가 포함되어 있습니다.4. 유의사항: 각 선사의 담당자가 직접 데이터를 입력한 정보로써, 모든 선사의 신고 내역이 포함된 것은 아니므로 활용 시 유의하여 주시기 바랍니다.'
