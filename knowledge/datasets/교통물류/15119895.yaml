summary_user: 전기차 차종·형식별로 배출가스 인증 1건마다 상온·저온 조건의 도심·고속·복합 1회충전주행거리와 업체명, 차명, 인증번호·인증일자, 인증구분(신규/변경)을 담은 전국 단위 인증 원천 정보다. 전기차 구매를 고민하는 소비자나 분석가가 "이 모델은 겨울철 저온에서 주행거리가 상온 대비 얼마나 줄어드나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·차명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 환경부 국립환경과학원에서 전기차 1회충전주행거리 인증정보를 제공하며, 항목으로는 1회충전주행거리 상온 조건의 도심/고속/복합, 저온 조건의 도심/고속/복합, 업체명, 배출가스 인증번호, 배출가스 인증일자, 차종, 자동차명, 전기차형식, 사용연료, 인증구분(신규인증/변경인증)의 데이터를 제공합니다.1. 무공해차(전기차/수소차) 배출가스 인증번호 OMY-OO-21-OO 입니다.2. 인증완료 상태의 인증서만 조회가 가능합니다.(인증반납 및 인증취소 차량은 제외됨)3. 전산시스템으로 발급되지 않은 제작차 및 수입차 과거 인증서는 조회되지 않습니다.
team:
