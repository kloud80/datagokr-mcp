services:
  - op: /getEVCert
    name: 전기차 1회충전주행거리 인증정보 조회
    endpoint: https://apis.data.go.kr/1480523/KencisEV/getEVCert
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: '페이지번호 (기본 값 : 1)'
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수 (기본 값 : 10)'
      - name: resultType
        required: false
        desc: 결과형식 (XML)
      - name: gubun
        required: false
        desc: '제조사구분 (1 : 수입제작차, 2 : 국내제작차, 기본 값 : 2)'
      - name: certiDate
        required: false
        desc: 인증년도
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
