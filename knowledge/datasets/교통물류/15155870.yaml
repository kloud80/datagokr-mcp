summary_user: 자동차 검사 접수 건별로 관능·기능 검사 이력을 담은 전국 단위 원천 파일로, 검사소(검사소코드)·접수일자·접수일련번호와 주행거리, 차량형태, 과급기·촉매·기화기 부착 여부, 관능검사 결과와 부적합 사항을 기록한다. 분석가가 '어떤 차량형태나 주행거리 구간에서 관능·기능 검사 부적합이 많이 나오는가', '검사소별 부적합 사항은 어떻게 다른가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 차량등록번호도 없어서, 다른 데이터와는 같은 기관(한국교통안전공단)의 검사소코드·전문정비업체코드나 접수일자·접수일련번호를 맞춰야만 이어 쓴다.
description_portal: 이 데이터는 관능 및 기능 검사 이력을 기록한 자료로, 각 검사소 코드와 접수 일자를 기반으로 진행된 검사 내역을 추적할 수 있습니다. 차종과 주행거리는 검사된 차량에 대한 기본 정보를 제공하며, 관능검사결과 항목은 해당 차량의 검사 결과를 나타냅니다. 또한, 관능및기능부적합사항은 검사에서 부적합 판정을 받은 부분을 상세히 기록하고 있어, 차량 상태 분석에 유용합니다. 전문 정비업체 코드와 과급기 부착 여부, 촉매 적용 여부 등도 포함되어 있으며, 이를 통해 차량 관리 및 정비 이력을 보다 체계적으로 추적할 수 있습니다. 이 정보는 검사 효율성 및 차량 상태 개선을 위한 기초 자료로 활용됩니다.
