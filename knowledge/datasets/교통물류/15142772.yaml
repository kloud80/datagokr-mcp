description_portal: 본 데이터는 한국도로공사가 관리하는 고속도로 졸음쉼터 내 가로등 설치 현황을 수록한 자료이다.  가로등은 야간 운전자 안전 확보 및 시설 이용 편의성을 높이기 위한 필수 기반시설로, 졸음쉼터의 조도 확보와 사고 예방에 중요한 역할을 한다.  데이터는 노선명, 위치, 이정, 설치 용량(KW), 설치 개소 수, 가로등 개수 항목으로 구성되어 있으며, 졸음쉼터별 가로등 설치 현황을 체계적으로 정리하고 있다.  해당 정보는 졸음쉼터 조명 환경 개선, 유지보수 계획 수립, 에너지 사용량 분석, 야간 안전 대책 마련 등 다양한 분야에서 활용 가능하다.  CSV 형식으로 제공되며, 노선 및 위치 단위로 조회가 가능하여 조명 인프라 현황 분석에 유용하다.
