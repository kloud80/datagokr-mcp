summary_user: 대구광역시 달서구의 불법주정차 단속 건을 위반일자·위반장소명·담당 부서명 단위로 담은 건별 파일 데이터이며, 범위는 달서구 한 개 시군구다(CSV 약 10.7MB). 주민이나 분석가가 "달서구에서 불법주정차 단속이 자주 일어나는 장소와 시기는 어디·언제인가"를 따져 단속 취약지점이나 주정차 예방 정책 대상지를 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 위반장소명(주소·장소 이름) 매핑이나 해당구 이름으로만 연결하며, 좌표나 법정동 코드로 바로 붙일 수는 없다.
description_portal: 대구광역시 달서구에서 불법주정차 단속에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.해당구, 위반일자, 위반장소명, 부서명, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.지역 내 불법주정차 단속 정보을 통해 파악하는데 유용하게 참고자료로 쓸수 있으며 교통 안전 및 질서 확립을 위한 정책, 교통 질서 관리, 주정차 위반 예방 정책 수립 등의 다양한 행정업무에 기초자료로 쓰는데 활용 가능합니다.
