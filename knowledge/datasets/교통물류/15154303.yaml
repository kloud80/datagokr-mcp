synonyms:
  - 교통이용경로
  - 출발지·도착지 분석
  - 통행량·우선순위
  - 지역 간 이동흐름
  - 교통·상권 활용데이터
  - 기종점 통행량
  - OD 데이터
  - 교통카드 이동경로
  - 시군구 간 통행
  - 대중교통 이동 패턴
  - 주요 통행 흐름
  - 출발지 도착지 통계
summary_user: 교통카드 이용 기록을 바탕으로 월(운행연월) 단위로 출발 시군구와 도착 시군구 사이 통행량이 많은 경로를 우선순위·동률여부·기종점 통행량과 함께 담은 집계 데이터이며, 범위는 전국·시군구 단위로 표시되어 있다. 교통 분석가나 지자체 담당자가 "우리 시군구에서 출발한 대중교통 이용자는 주로 어느 시군구로 가는가"를 확인해 노선 개선이나 상권·입지 분석에 쓴다. 출발·도착 시도코드와 시군구코드, 시도·시군구명이 들어 있어 행정구역 코드나 이름으로 인구·상권 등 시군구 단위 통계와 맞춰 쓰지만, 실측에서 전역 조인 키는 확인되지 않아 코드·이름 매핑이 필요하다.
description_portal: 최빈교통이용 경로 데이터는 특정 기간 동안 교통카드 이용자들이 가장 많이 이동한 출발지와 도착지 간의 경로 정보를 제공합니다. 출발·도착 행정구역 단위로 구성되며, 경로별 우선순위, 기종점 통행량 등의 항목을 포함합니다. 이를 통해 지역 간 주요 통행 흐름을 파악할 수 있어 교통 정책 수립, 대중교통 노선 개선, 상권 분석 및 부동산 입지 연구 등 다양한 분야에서 활용할 수 있습니다. 특히 지역별 이동 수요를 정량적으로 확인할 수 있어, 교통 인프라 투자 우선순위 설정이나 민간 기업의 마케팅 전략 수립에도 유용합니다.
