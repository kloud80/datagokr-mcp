description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민소통 및 민원정보 데이터로, 대구교통공사 고객의 소리(VOC, Voice of Customer) 등록 현황을 분야별로 제공합니다. 주요 항목은 운수영업, 열차운행, 시설이용, 일반현황, 기타 등 서비스 분야별 VOC 접수 현황과 유형으로 구성되어 있으며, 시민 의견과 불편 사항의 발생 현황 및 주요 경향을 체계적으로 파악할 수 있습니다. 해당 자료는 고객 요구사항 분석, 민원 처리 현황 관리, 서비스 품질 개선, 고객 만족도 향상 및 민원 대응 체계 고도화를 위한 기초자료로 활용될 수 있습니다. 또한 시민 중심의 공공서비스 개선, 데이터 기반 행정 의사결정 및 고객 소통 정책 수립을 지원하는 자료로 활용될 수 있습니다. 본 데이터는 반기마다 정기적으로 갱신됩니다.'
