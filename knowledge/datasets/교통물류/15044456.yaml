description_portal: 서울교통공사의 역사내 스마트팜 설치현황 정보입니다. 해당 데이터는 호선, 역사명, 설치주소, 면적, 준공월, 재배작물 정보로 구성되어 있습니다. 2026년 6월 30일(2분기) 기준 입니다.해당 스마트팜 설치현황 공공데이터를 통해 서울교통공사가 운영하는 7호선 천왕역에는 면적 101제곱미터의 스마트팜이 조성되어 있으며, 2020년 2월 25일에 준공했고, 버터헤드레터스, 카이피라, 이자트릭스, 파게로, 이자벨 등의 식물을 재배하고 있다는 사실을 알 수 있습니다. 또, 7호선 상도역에는 면적 523제곱미터의 스마트팜이 조성되어 있으며, 2019년 9월 26일에 준공했고, 천왕역 재배작물과 동일한 식물을 재배하고 있다는 사실을 알 수 있습니다.이렇게 해당 공공데이터를 통해서 스마트팜 설치현황을 파악할 수 있습니다.
