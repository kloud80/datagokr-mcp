description_portal: '○ 통계개요* 통계명 : 도로 현황* 통계종류 : 서울시 도로의 현황을 도로등급별로 제공하는 일반ㆍ보고통계* 작성목적 : 국가 및 서울시에서 설치ㆍ관리하는 도로현황을 파악하여 도로에 대한장래계획의 수립과 도로유지관리 및 행정에 필요한 기본자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 도로계획과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 자치구별 도로(고속ㆍ일반ㆍ특별시도)의 포장/미포장 현황 등○ 용어설명* 일반국도 : 주요도시, 항만, 관광지 등을 연결하는 국가 기간도로* 특별(광역)시도 : 서울특별시와 부산,대구,인천,광주,대전,울산광역시의 구역내 도로○ 기 타○ 출 처 : 서울특별시 도로계획과'
