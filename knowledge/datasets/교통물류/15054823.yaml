description_portal: 경상남도는 전기자동차 보급 확대를 통해 탄소 감축과 대기환경 개선에 앞장서, 도민들에게 쾌적하고 살기 좋은 환경을 제공하도록 최선을 다하고 있습니다.본 데이터는 경상남도 전기자동차의 보급현황으로, 연도별(2011년~2024년) 및  시군별 친환경 전기 자동차의 보급 현황을 제공합니다.2024년 말까지 경상남도 전체의 전기자동차 누적 보급량은 3만 8천 여대로 파악되었습니다.2025년 전기자동차 보급 현황 자료는 기후에너지환경부 정산자료 확정 후 업로드할 예정입니다.
