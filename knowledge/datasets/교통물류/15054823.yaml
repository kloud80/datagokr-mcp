summary_user: 경상남도 18개 시군의 전기자동차 보급 대수를 연도별(포털 설명상 2011~2024년)로 담은 집계 파일입니다. 행은 연도, 열은 시군인 표 형태이며, 포털 설명에 따르면 2024년 말 도 전체 누적 보급량은 약 3만 8천 대입니다. 도민이나 분석가가 '우리 시군에 전기차가 해마다 얼마나 늘었는지', '시군별 보급 격차가 어떤지'를 살피거나 충전소 수요를 가늠하는 데 쓰며, 전역 조인 키가 없어 다른 시군구 데이터와는 시군명을 행정구역 코드에 직접 매핑해 이어 써야 합니다.
limits: 차량별 원천 자료가 아니라 연도·시군 단위 집계라 차종·제조사·읍면동 단위 분석에는 쓸 수 없습니다. 표준 행정코드 같은 조인 키가 없어 시군명 문자열로 맞춰야 하며, 시군이 열로 펼쳐진 형태라 결합 전에 행·열 변환이 필요합니다. 포털 설명상 2025년 자료는 정산 확정 후 올라올 예정입니다.
