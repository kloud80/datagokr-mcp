summary_user: 대구광역시 내 9면 이상 건축물 부설주차장(단독·공동주택·공장 제외)을 주차장 한 곳당 한 건으로 담으며, 도로명·지번 주소와 좌표, 요일별 운영시간, 기본·추가·일·월 요금, 면수, 개방공유주차사업 참여 여부와 개방 시간을 함께 제공한다. 운전자나 주차 안내 앱 사업자가 '목적지 근처에서 주말 저녁에 일반인에게 개방되는 부설주차장이 있고 요금은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 주차장명, 구 코드(gu_code) 같은 기관 내부 코드로 맞춰 이어 쓰며, 주차장 원장 성격의 전국주차장정보표준데이터와는 주소·좌표 기준으로 대조한다.
description_portal: 대구광역시 건축물 중 단독주택, 공동주택, 공장을 제외한 9면 이상의 건축물 부설주차장의 ① 위치, ② 도로명주소 또는 지번주소, ③ 요금정보, ④ 운영시간, ⑤ 주차시설정보(면수), ⑥ 개방공유주차사업 참여여부 등 부설주차장의 전반적인 운영정보 제공 서비스 이며, 공공데이터 부설주차장 운영 및 개방 공유정보 조회 서비스는 전국 지자체 및 공공기관에서 제공하는 부설주차장의 운영 현황과 개방 여부, 이용 가능 시간 등을 통합적으로 조회할 수 있는 공공데이터 기반의 서비스입니다. 이 서비스는 각 기관이 보유한 부설주차장을 시민에게 개방하는 경우, 해당 정보를 국민이 쉽게 확인하고 활용할 수 있도록 제공함으로써 주차 공간 부족 문제를 해소하고, 도시 내 교통 혼잡을 완화하는 데 기여합니다. 조회 가능한 정보에는 주차장의 위치, 운영 시간, 요금, 면수, 개방 여부, 담당 기관 등의 상세 정보가 포함되며, 이를 통해 시민들은 목적지 주변의 개방 주차장을 사전에 확인하고 효율적으로 이용할 수 있습니다. 또한 해당 데이터는 공공 API 형태로도 제공되어, 민간 서비스 사업자들이 교통 관련 앱이나 주차 안내 시스템에 이를 연계하여 활용할 수 있도록 지원합니다.
