summary_user: 연천군시설관리공단이 관리하는 주차장을 한 곳씩 한 행으로 담은 소규모 CSV 파일(약 4.8KB)로, 주차장명·구분·유형·도로명주소·주차구획수, 평일·토요일·공휴일 운영시각, 기본·추가·1일·월정기 요금, 결제방법, 장애인전용구역 보유 여부를 담는다. 연천군 주민이나 방문객이 '공단 주차장 중 어디가 몇 면이고, 주말에도 열며, 요금이 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주차장명·주소 같은 이름 매칭이나 같은 기관 기준으로 연결하고, 좌표·면수 원장은 전국주차장정보표준데이터에서 찾는다.
