summary_user: 경상북도 경주시가 운영하는 불법 주정차 단속카메라를 한 대(지점)씩 명칭과 주소로 담은 개별 위치 목록 파일(csv)로, 범위는 경주시 한 곳입니다. 시민이 '우리 동네 어느 길에 주정차 단속카메라가 있나'를 확인하거나, 분석가가 단속 지점 분포를 지도로 그려 위험 구간을 점검할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 주소나 명칭을 맞추는 방식으로만 이어 쓰며, 무인교통단속카메라·어린이보호구역 표준데이터와 주소 기준으로 겹쳐 보는 것이 현실적입니다.
description_portal: 본 데이터는 경상북도 경주시에서 운영 중인 불법 주정차 단속용 카메라의 설치 현황을 정리한 파일 형식의 공공데이터이다. 단속 카메라는 교통 혼잡이나 사고 위험이 높은 구간, 특히 어린이보호구역, 소방시설 주변, 버스정류장 등 주요 지점에 설치되어 불법 주정차 차량을 자동으로 인식하고 촬영하여 행정 처분에 활용된다. 데이터에는 명칭 ,주소 등의 항목이 포함되어 있으며, 교통 정책 수립, 위험 지역 모니터링, 민원 처리 및 교통안전 지도 제작 등 행정적 용도에 활용할 수 있다. 경주시는 교통 환경 개선과 시민 안전 확보를 위해 해당 데이터를 주기적으로 갱신하며, 투명한 정보 제공과 효율적인 단속 체계 운영을 위해 이를 개방하고 있다.
