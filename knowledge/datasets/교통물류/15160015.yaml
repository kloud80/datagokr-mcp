summary_user: 해양수산부 Port-MIS의 항만시설 사용허가 신청을 선박 입항 건별로 담은 원천 데이터로, 선박·부선 정보, 요청시설과 요청기간, 신고업체, 지정시설과 지정기간, 허가 여부를 전국 범위로 제공한다. 해운업체나 대리점이 특정 선박이 어느 선석·시설을 언제부터 언제까지 배정받았고 허가가 났는지를 확인해 선박 운용 계획을 세우는 데 쓴다. 호출부호(clsgn)가 실측 조인 키여서 같은 키를 쓰는 Port-MIS 입출항 신고·선박 위치·선박 등록 데이터와 이어 쓰고, 항구청코드와 시설코드로 항만 시설 원장과 맞춰 본다.
description_portal: 이 데이터는 해양수산부에서 시설사용의 허가현황을 확인하기 위한 데이터입니다. 항구, 검색(시작/종료)일자, 입항연도, 입항횟수, 호출부호, 부선호출부호 등 입력 파라미터를 이용하여 데이터를 호출하실 수 있으며, 본 데이터의 주요 내용은 시설사용허가현황에 대한 선박정보, 요청시설정보, 요청기간, 신고업체정보, 지정시설정보, 지정기간, 허가유무 등으로 구성되어 있습니다. 본 데이터는 해운업체가 항만시설의 지정 상태 및 사용기간, 허가현황 등을 조회하여 선박 운용 계획을 수립하는 데 활용될 수 있습니다. 또한 연구기관은 시설사용허가현황을 활용하여 해운 산업의 동향을 연구하고, 정부 및 관련 기관은 시설사용허가현황을 분석하여 해운 정책 수립 및 제도 개선을 위한 기초자료로 활용할 수 있습니다.
