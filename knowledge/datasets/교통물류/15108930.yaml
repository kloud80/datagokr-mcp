summary_user: 김포시 도로점용허가대장을 허가 건별로 담은 파일로, 점용 목적(OCPAT_PPS)·점용면적·점용기간 시작일·건물 용도 등의 항목이 들어 있고 활용신청 없이 zip 파일(약 1.5MB)로 받는다. 김포시에서 어느 도로가 어떤 목적으로 얼마만큼 점용되고 있는지, 언제부터 점용이 시작됐는지 확인하려는 주민·사업자·분석가가 공사·점용 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명 같은 이름 매핑이나 같은 기관(김포시) 단위로만 이어 쓴다.
description_portal: 경기도 김포시에서 보유하고 있는 도로점용허가대장에 대한 정보입니다. 점용노선, 점용면적 등의 정보를 포함하고 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 데이터는 UTF-8로 인코딩되 어 있기 때문에 UTF-8 포맷으로 열어야 합니다. 및 공간정보데이터(SHP)파일은 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하셔야 합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 스마트도시과로 연락주시기 바랍니다.
