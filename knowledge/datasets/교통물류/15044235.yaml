summary_user: 서울교통공사가 운영하는 역사 내 물품보관함을 호선·보관함(개소)별로 한 행씩 담고, 소형·중형·대형 함 수와 열 수를 적은 설치 현황 파일(csv, 약 8KB)이다. 지하철 이용객이나 여행자가 '어느 역에 큰 짐을 넣을 대형 보관함이 몇 개 있나'를 확인하거나, 분석가가 호선별 보관함 배치를 비교하는 데 쓴다. 전역 조인 키가 없어 역 정보·승하차 데이터와는 보관함명에 들어 있는 역명이나 호선 이름을 맞춰 연결해야 한다.
description_portal: 서울교통공사 역사내 물품보관함  설치수량 정보 입니다.  데이터는 호선, 역명, 보관함 크기별 종류, 설치수량 정보가 포함되어 있습니다. 2026년 6월 30일(2분기) 기준 입니다.해당 물품보관함 설치수량 공공데이터를 통해 서울교통공사가 운영하는 1호선 서울역에는 보관함이 총 3개소가 위치해 있으며, 첫번째 개소에는 소형 12개함, 중형 4개함, 대형 6개함의 총 6열이 위치해 있고, 두번째 개소에는 소형 12개함, 중형 4개함, 대형 6개함의 총 6열, 세번째 개소에는 소형 12개함, 중형 4개함, 대형 4개함으로 총 5열의 보관함이 위치해 있다는 사실을 알 수 있습니다.이렇게 서울교통공사가 운영하고 있는 물품보관함의 설치수량 정보를 서울지하철 1호선부터 8호선 뿐만 아니라 9호선과 서울식물원 등 보관함이 존재하는 역이라면 손쉽게 파악할 수 있습니다.
