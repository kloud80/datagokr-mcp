summary_user: 경기도 내 버스정류소를 한 건씩 담은 정류소 원장으로, 정류소 국문·영문명, 정류소 ID와 번호, 중앙차로 여부, 관할 관청, 위치 설명, WGS84 위도·경도, 시군명·시군코드를 포함한다. 교통 분석가나 지자체 담당자가 '우리 시군에 정류소가 어디에 몇 개 있고, 중앙차로 정류소는 어디인가'를 확인하거나 정류소 접근성을 평가할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시군코드(SIGUN_CD)나 정류소 ID·이름을 같은 기관(경기도) 버스 노선·도착 데이터와 매핑해 잇는다.
description_portal: 이 데이터는 경기도 내에 설치된 버스정류소의 위치 및 관련 정보를 포함한 자료로, 정류소의 국문명과 영문명, 고유 식별자인 정류소 ID, 정류소 번호, 중앙차로 여부, 관할 관청명, 위치 설명, WGS84 좌표계 기반 위도 및 경도 정보를 제공합니다. 또한 시군 명칭 및 시군 코드가 포함되어 있어 지역 단위의 교통 인프라 분석에 활용될 수 있습니다. 특히 영문 정류소명은 외국인 이용자의 대중교통 접근성을 높이기 위한 정보로 활용될 수 있으며, 위치 정보는 버스 노선 설계, 정류소 접근성 평가, 대중교통 서비스 개선 등에 유용하게 활용됩니다. 이 데이터는 정류장 영문명 부여 사업 중단으로 갱신이 불가하므로, 최신 정보 확인 시 유의가 필요합니다. Open API를 통해 정류소 정보를 실시간으로 활용할 수 있으며, 인증키를 활용한 API 접근이 가능합니다.
