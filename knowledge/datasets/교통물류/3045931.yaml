description_portal: 자동차등록현황은 kosis.kr의 부산광역시 강서구 관내의 자동차 등록수에 대한기본정보(승용, 화물, 특수)와 각 차량의 종류에대한 사용방법 (관용, 자가용,화물용) 및 각 정보의 총계로구성된 데이터입니다.2025년 8월 공공데이터 개방자료 현행화 협조 요청에 따라 기존 24년도 4월자료를 25년도 7월24일자 의 최신자료로 변경되었습니다.파일내 항목별 자료 외 지금까지의 연도 및 월별 자료는 밑의 개별 데이터포털 정보에 등록된 통계청 국가통계통합DB시스템 시도별 자동차등록대수현황에서 확인할 수 있습니다.  .데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 사이트(kosis.kr)을 이용해주시기 바랍니다.추후 요청계획 이 있거나 최신 자료가 업로드 되는대로 최신 데이터를 업로드 할 예정을 알려드립니다.
