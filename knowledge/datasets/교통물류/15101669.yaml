description_portal: '본 자료는 연제구 관내 불법 주정차 단속 현황을 정리한 것으로, 2023년 1월 1일부터 11월 30일까지의 단속 데이터를 포함하고 있습니다. 단속 방식은 주행형 CCTV, 고정형 CCTV, 안전신문고(주민 신고)를 통해 이루어졌으며, 각 건별로 위반일자, 위반시간, 위반장소명 정보를 포함하고 있습니다.※ 참고사항: 위반장소의 경우, 단속 당시 차량의 정확한 위치 좌표를 확보하기 어려워 실제 차량 위치와 다소 차이가 있을 수 있으며, 가능한 한 인근 주소 또는 지점명을 기준으로 기재하였습니다. 이 자료는 행정 참고, 민원 응대, 불법 주정차 개선 정책 수립 등을 위한 기초자료로 활용 가능합니다.'
