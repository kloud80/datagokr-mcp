summary_user: 부산광역시 교통정보서비스센터가 DSRC 장치로 수집한 도로 구간별 평균 주행 속도를 시각(statsDt)과 구간명(rseSxnNm)별로 담는 실시간 API다. 운전자나 교통 분석가가 지금 부산의 어느 DSRC 구간이 막히는지 확인하는 데 쓰고, 응답을 계속 쌓으면 상습 정체 구간 분석의 이력 자료가 된다. 실측 컬럼에 전역 조인 키가 없어 다른 링크·교통 데이터와는 구간 이름을 매핑하거나 같은 기관의 코드로만 이어 쓴다.
limits: 표준 링크 ID 같은 공통 키가 없어 국가 표준 링크망이나 다른 기관 데이터와 바로 결합할 수 없고, 구간 이름 매핑이 필요하다. 응답은 실시간 값이라 추세를 보려면 직접 호출해 이력을 쌓아야 하며, 개발계정은 하루 500회로 호출이 제한된다.
