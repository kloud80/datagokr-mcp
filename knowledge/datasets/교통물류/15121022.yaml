description_portal: '본 데이터는 부산광역시 교통정보서비스센터에서 운영하는 DSRC(Dedicated Short-Range Communication) 장치를 통해 수집된 도로 구간별 평균 주행 속도 정보를 제공합니다.DSRC는 도로 인프라와 차량 간 단거리 무선통신을 이용해 차량의 통행 정보를 수집하는 기술로, 본 데이터셋은 구간별 교통흐름 분석, 실시간 교통관리, 돌발상황 대응 등에 활용할 수 있습니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>DSRC 기반 구간 교통속도 및 소통상황 파악교통운영기관의 혼잡 관리 및 돌발상황 대응 지원도로 이용자에게 정확한 실시간 교통정보 제공민간 내비게이션·교통 서비스와 연계 활용교통 빅데이터 기반 ITS 및 스마트시티 연구 자료'
