summary_user: 전국 졸음쉼터를 한 곳씩 한 행으로 담은 건별 표준데이터로, 쉼터명·도로 노선과 방향·주소·좌표·총연장·주차면수·화장실 유무·방범용 CCTV 수·관리기관을 담으며 API 전체 253건이다. 장거리 운전자나 물류 사업자가 이동 경로 위에서 쉬어갈 수 있는 졸음쉼터의 위치와 화장실·주차 여건을 확인하는 데 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)가 조인 키라서 주소 변환이나 좌표 기반 지도, 인근 휴게소·주유소·충전소 데이터와 위치로 이어 쓴다.
limits: 검증 시 수신한 행의 기준 날짜가 2026-02-25 하나뿐이고 행정단위는 개별 주소·좌표이며 범위는 미상이다. 쉼터 간 공통 식별 코드가 없어 주소나 좌표로만 다른 데이터와 맞출 수 있다. 최신 행 날짜가 219일 전이지만 검증 호출 조건 때문일 수 있어 데이터가 오래됐다고 단정하지 않는다.
