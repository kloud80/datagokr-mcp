services:
  - op: /getTrainTime
    name: 부산도시철도 열차시각표 조회 서비스
    endpoint: https://apis.data.go.kr/B551542/trainTime/getTrainTime
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: day
        required: false
        desc: 1:평일, 2:토요일, 3:일/공휴일
      - name: updown
        required: false
        desc: '0:상행선, 1: 하행선'
      - name: stime
        required: false
        desc: 시, 분(ex.오후1시 1분->1301)
      - name: etime
        required: false
        desc: 시, 분(ex.오후1시 1분->1301)
      - name: enum
        required: false
        desc: 검색시작시각부터 리스트할 갯수
      - name: act
        required: true
        desc: json
      - name: scode
        required: true
        desc: 역외부코드(ex.신평:101, 안평:414)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
