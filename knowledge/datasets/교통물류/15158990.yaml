summary_user: 부산도시철도 1~4호선 역별로 열차번호, 표준 도착시각, 요일 구분(평일·토요일·일요일/공휴일), 상·하행 방향, 종착역을 담은 열차시각표를 건별로 조회하는 API이다. 시민이나 교통정보 서비스 개발자가 '이 역에서 평일 저녁 하행선 열차가 몇 시에 오고 어디까지 가는가'를 미리 확인하는 데 쓴다. 전역 조인 키는 확인되지 않았고, 역 외부코드(scode·endcode)와 역명으로 같은 기관의 다른 도시철도 데이터와 맞춰 잇는다.
limits: 표준 시각표라 실제 도착시각과 다를 수 있으며 실시간 위치·지연 정보는 담지 않는다. 필수 파라미터 act와 scode(역 외부코드)는 다른 데이터에서 먼저 받아 넘겨야 하고, 개발계정은 하루 1,000회로 제한된다.
