description_portal: 경기도 하남시 지능형교통체계ITS 마스터시설 차량검지기(VDS)정보는 도로 구간별 교통량, 속도, 점유율 등 교통 흐름을 실시간으로 파악하기 위해 설치된 검지기의 위치와 관리 현황을 담고 있습니다. 각 검지기는 시설 관리 ID와 설치 방향, 위도와 경도 좌표로 구체적으로 기록되어 있으며, 교통량과 점유율, 속도의 최소·최대 측정 범위를 정의하여 교통 분석에 활용됩니다. 또한 등록일과 수정일, 사용 여부를 통해 시설 운영 상태를 추적할 수 있어 교통 인프라 관리와 정책 수립의 기초 자료로 쓰입니다. 이 데이터는 ITS 인프라의 효율적 운영뿐 아니라 교통 혼잡 해소, 안전성 강화, 스마트시티 교통 정책 수립에 중요한 역할을 합니다.
