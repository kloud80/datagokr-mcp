summary_user: 서울 동작구 안의 자전거도로를 노선 한 건씩 담은 원천 목록으로, 노선명·기점·종점과 자전거도로 종류, 총연장(km)·폭원(m), 설치방향, 분리시설·포장재질·포장색상, 안전표지판·노면표시·경사로 개수, 설치연도, 관리부서를 담는다. 구민이나 자전거 정책 분석가가 '동작구에서 분리시설이 있는 자전거도로는 어느 노선이고 총 몇 km인가'처럼 노선별 유형과 시설 상태를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어, 다른 자치구 자전거도로 목록이나 공공자전거 대여소 데이터와는 노선명·기점·종점 같은 이름을 맞춰서만 이어 쓴다.
limits: 동작구 한 곳의 자전거도로만 담은 작은 CSV 파일(약 2.7KB)이라 서울 전체나 전국 현황은 다른 자치구 파일을 따로 모아야 한다. 좌표나 노선 형상이 없는 비공간 데이터라 지도에 바로 그리거나 공간 결합하는 데 쓸 수 없고, 다른 데이터와는 이름 매칭으로만 연결된다.
