summary_user: 인천광역시 연수구 안 공영주차장을 주차장 한 곳당 한 행으로 담은 파일로, 주차장명·노상/노외 구분·유형·지번주소·주차구획수·요금 급지·위도/경도를 포함한다. 연수구에서 차를 댈 공영주차장이 어디에 몇 면 있는지 찾는 시민이나, 동네별 주차면 분포를 보고 추가 설치 지역을 따지는 정책 담당자가 쓴다. 전역 조인 키(주차장관리번호 등)가 없어 전국주차장정보표준데이터 등과는 주차장명·주소 매칭이나 좌표 근접으로만 이어 붙인다.
description_portal: 본 데이터는 인천광역시 연수구 내 공영주차장의 위치 및 기본 정보를 제공하는 자료로, 주차장명, 주차장구분(노상/노외), 주차장유형, 소재지 지번 주소, 주차구획수, 급지구분(요금 기준), 위도 및 경도 좌표 등의 항목으로 구성되어 있습니다. 이를 통해 연수구 내 공영주차장의 분포, 주차 가능 공간 수, 위치정보(GPS 좌표) 등을 파악할 수 있으며, 주차 공간을 찾는 시민, 내비게이션 및 지도 서비스 개발자, 공공 정책 수립자, 도시교통 연구자 등 다양한 수요자가 활용할 수 있습니다. 특히, 위치 기반 서비스와 연계하여 실시간 주차정보 시스템, 교통 혼잡도 분석, 주차장 추가 설치 계획 등에 유용하게 활용될 수 있습니다.
