summary_user: 인천광역시 연수구에서 발생한 싱크홀(지반 침하) 사고를 건별로 기록한 CSV 파일로, 발생일·발생 위치 주소·위도·경도·발생원인과 담당 부서·연락처를 담는다(파일 크기 약 1KB로 소규모). 주민이나 도시안전 분석가가 '연수구에서 싱크홀이 어디서, 언제, 무슨 원인으로 났는가'를 확인하거나 지도에 표시해 위험 지점을 살피는 데 쓴다. 공통 조인 키는 없으므로 위도·경도나 주소를 기준으로 지하시설물·도로 공사·지반 정보 같은 공간 데이터와 위치로 겹쳐 쓴다.
description_portal: 인천광역시 연수구 싱크홀 발생 현황 데이터는 지역 내 발생한 지반 침하 사고를 체계적으로 기록·관리하기 위해 구축된 자료입니다. 해당 데이터에는 발생일과 발생위치, 위도·경도 정보가 포함되어 있어 시공간적 분석이 가능하며, 발생원인을 함께 제공하여 향후 재발 방지 대책 수립에 활용할 수 있습니다. 또한 담당부서와 연락처가 기재되어 있어 현장 확인이나 민원 응대 시 즉각적인 소통이 가능합니다. 이 데이터는 도시 안전관리, 도로 유지보수, 학술 연구, 재난 대응 정책 수립 등 다양한 분야에서 활용될 수 있는 중요한 기초자료입니다.
