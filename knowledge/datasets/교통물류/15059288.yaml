summary_user: 경기도 내 물류 창고업체를 사업장 한 곳당 한 행으로 담은 건별 목록으로, 사업장명·인허가일자·영업상태·폐업일자, 소재지 주소와 좌표, 일반창고와 냉동·냉장창고의 동수·면적, 보관요율, 종업원 수, 시설·장비 현황을 포함한다. 물류 기업이나 정책 분석가가 "어느 시군에 냉동·냉장창고가 몰려 있고, 보관요율과 고용 규모는 지역별로 어떻게 다른가"를 확인할 때 쓴다. 전역 조인 키는 없으며, 시군 코드(SIGUN_CD)·주소·위경도 좌표를 기준으로 같은 경기도 데이터나 다른 시설 데이터와 이름·위치 매칭으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 물류 창고업체 현황을 제공합니다. 물류 창고업체는 물품의 보관, 유통, 판매를 목적으로 직접 보관하거나 창고 공간을 대여해주는 시설로, 해당 데이터는 사업장명, 소재지, 보관요율, 종업원 수, 시설 및 장비 현황, 냉동·냉장창고 동수 및 면적 등 세부 정보를 포함합니다. 이를 통해 시군별 창고 분포, 일반창고와 냉장·냉동창고의 비중, 보관요율의 차이, 고용 규모 등을 파악할 수 있습니다. 물류·유통 산업은 전자상거래, 제조업, 수출입 산업과 긴밀히 연결되어 있어, 이 데이터는 지역별 물류 인프라 현황을 진단하거나 신설 창고 수요 예측, 산업단지 물류 최적화, 스마트 물류 시스템 구축 등 정책 연구 및 기업 의사결정에 활용될 수 있습니다. 또한 평택항 물동량 데이터와 연계 분석 시, 항만 물류와 내륙 보관시설 간의 상호작용을 평가하는 근거 자료로도 의미가 있습니다.
