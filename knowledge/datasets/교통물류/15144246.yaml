description_portal: 서울특별시 서초구 활주로형 횡단보도 사고예방 분석 데이터_설치위치 기준 사고변화율 분석 데이터로 연번, 설치위치(지번주소), 설치위치(도로명주소), 설치연도, 설치 전 사고 수 , 설치 후 사고수, 변화값, 변화율(%), 위도, 경도, 데이터기준일 등의 항목을 제공합니다. 활주로형 횡단보도 설치 전후의 사고 증감을 확인할 수 있는 데이터입니다.서울특별시 서초구는 교통사고 예방과 보행자 안전 강화를 위해 초등학교 주변, 어린이보호구역, 이면도로 등에 활주로형 횡단보도를 설치해오고 있습니다.활주로형 횡단보도는 구민들의 안전한 보행환경을 위해 서초구가 전국 최초로 설치한 선진국형 교통안전시설입니다.야간뿐 아니라 미세먼지、 안개、 우천 등 기상변화로 인해 가시거리가 짧아졌을 때도 유용합니다。이 시설은 ＧＰＳ시스템을 이용해 기상위성의 데이터를 전송받아 계절별 일출、 일몰시간에 맞춰 점등시간이 자동 제어되고 조도센서를 통해 일정 조도이하일 경우 자동으로 작동이 됩니다。횡단보도 양 옆을 따라 일정한 간격으로 매립한 LED 유도등 설치는 설치 당시 경찰청 규정 상 위배되는 시설로 규정에는 횡단보도 상 LED 설치가 금지되어 있었습니다.해외에서 운영중인 사례를 분석및 벤치마킹하여 경찰청과 협력한 적극행정의 모범사례입니다.매년 보행자 교통사고 다발지점과 민원이 접수된 구간을 중심으로 우선 설치가 이루어졌으며, 초등학교 앞 통학로와 시장 주변, 생활권 보행축 등을 중심으로 확대 중에 있습니다.
