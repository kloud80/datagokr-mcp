summary_user: 서울 강서구시설관리공단이 운영하는 거주자우선주차 구획을 한 행씩 담은 원천 목록으로, 구획마다 행정동·구간명·구획번호와 위도·경도 좌표가 들어 있다(CSV 약 183KB, 포털 설명상 2023.7.1. 기준). 강서구 주민이나 분석가가 '우리 동네 어느 골목에 거주자우선주차 구획이 몇 면 있는지'를 지도에서 확인하거나 동별 구획 분포를 비교할 때 쓴다. 전역 조인 키가 없어 행정동 이름 매칭이나 좌표 기반 공간 결합으로 전국주차장정보표준데이터(공영·민영 주차장 원장) 등과 이어 쓴다.
description_portal: 서울특별시 강서구 내 강서구시설관리공단이 관리 및 운영하고 있는 거주자우선주차 구획선 정보입니다. 구획명, 동명, 구간명 등 거주자우선주차장 구획선에 대한 경도 및 위도에 대한 정보가 있습니다.(2023.7.1.기준)
