summary_user: 경찰청이 제공하는 교통안전 위험요소 정보 중 이륜차(원동기·자전거) 차종에 해당하는 항목을 위험요소 건별로 담으며, 지번·도로명 주소, 위경도, 위험요소 대·중·소분류 코드, 데이터 기준일자, 상세 내용 필드를 포함하고 범위는 전국이다. 자전거·오토바이 이용자나 지자체 교통안전 담당자가 '우리 동네 자전거 이동 경로에 어떤 위험요소가 어디에 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 위경도(LAT·LOT)나 주소를 이용한 공간·이름 매칭으로 자전거도로 노선 GIS나 공공자전거 대여소 데이터와 겹쳐 본다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-차종별 데이터는 경찰청에서 제공하는 정보입니다.
