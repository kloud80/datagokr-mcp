summary_user: 전국 화물 운송사업자에게 지급된 유가보조금을 지자체별로 나누어 연도별·유종별(경유·LPG, 2022년부터 수소) 금액 열로 정리한 집계 파일이며, 필드는 2015년부터 2025년까지의 열을 담고 있습니다. 운송업계 관계자나 정책 분석가가 '우리 지역의 화물 유가보조금 지급액이 해마다 어떻게 변했고, 수소 화물차 보조금 비중은 얼마나 늘었나' 같은 질문에 답할 때 씁니다. 실측 컬럼에는 행정구역 코드 같은 공통 조인 키가 없어서, 다른 지역 통계와는 지자체 이름을 맞춰 연결해야 합니다.
limits: 공통 조인 키가 없어 지자체 이름 매핑으로만 다른 데이터와 연결되며, 공간 좌표가 없는 비공간 집계 자료입니다. 포털 설명에 따르면 서면청구분은 빠져 있어 실제 총 지급액보다 적을 수 있습니다. 개별 사업자나 차량 단위 지급 내역은 담겨 있지 않습니다.
