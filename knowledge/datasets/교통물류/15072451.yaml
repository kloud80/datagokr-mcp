description_portal: 화물 유가보조금 지급현황 정보(서면청구 불포함)해당 자료는 화물/택시/버스 운송사업자에게 지급하는 유가보조금 제도 운영을 위한 유가보조금관리시스템의 자료로 2015년부터 2024년까지 지급된 화물 유가보조금 지급정보를 년도별, 지자체별, 유종별로 구분한 현황 정보입니다. 해당 자료를 공개함으로써 운송업계 관계자뿐만 아니라 대국민이 유가보조금 제도와 유가보조금 지급현황에 대한 정보를 제공받아 이를 참고 및 활용할 수 있도록 하는 것이 목적입니다. 또한 민간기업이 관련사업 확장 및 신규사업 발굴을 통해 수익창출에 기여할 수 있을 것으로 예상합니다.
