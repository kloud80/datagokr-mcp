summary_user: 전라남도 여수시에서 운행하는 버스의 정류장 정보와 운행·정류장 도착 정보를 시군구 범위에서 개별 정류장(주소·좌표) 단위로 담는 API이다. 여수 시민이나 관광객이 '이 정류장에 어떤 버스가 언제 오는가'를 확인하거나, 분석가가 여수시 정류장 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 정류장 이름 매핑이나 같은 기관(여수시) 코드로만 이어 쓴다.
limits: 전역 조인 키가 없어 국가 대중교통 정류장 데이터 등과 바로 결합하기 어렵고, 이름·코드 매핑이 따로 필요하다. 범위는 여수시 한 곳에 한정된다. 포털 활용신청은 자동승인이며 개발계정은 하루 10,000회까지 호출한다.
