summary_user: 광주광역시 종합건설본부가 시행 중인 도로·하천·하수·환경시설·조경 분야 토목공사를 사업 1건당 1행으로 담은 목록 파일로, 사업명·위치·개요·시작/종료 연도·총사업비(백만원)·담당부서·연락처를 포함하며 포털 설명상 34건입니다. 주민이나 분석가가 "우리 동네 근처에서 언제까지 어떤 도로·하천 공사가 진행되고 사업비는 얼마인가"를 확인하고, 도로 개통 계획을 지역 접근성 변화의 선행 지표로 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 사업명·위치 텍스트를 매칭하거나 같은 기관 데이터끼리만 이어 쓴다.
