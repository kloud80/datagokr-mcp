summary_user: 2024년 한 해 전국 자동차검사 결과를 용도·차종·규모별로 나누고, 차령 구간(4년 이하부터 15년 이상·기타까지)마다 검사대수와 부적합률을 담은 집계표로, 3.5KB 남짓한 CSV 파일이다. 연구자나 행정 담당자가 '차령이 오래될수록 승합·화물 등 차종별 검사 부적합률이 얼마나 높아지는가' 같은 질문을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 자동차 등록·검사 통계와는 용도·차종·규모 명칭을 직접 맞춰서만 이어 쓴다.
description_portal: 2024년도 자동차검사 현황 데이터 중 1종류입니다.자동차검사대수 및 부적합률에 대해 용도별, 차종별, 규모별, 차령별 등으로 구분되어 있습니다.연구 및 행정자료로 사용하기 위한 데이터입니다.
