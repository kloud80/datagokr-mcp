description_portal: 본 데이터는 경상남도 남해군 관내에 설치된 보안등의 상세 현황 정보로, 지역 주민의 야간 생활안전 증진 및 안전한 정주 환경 조성을 목적으로 합니다. 각 보안등별로 정확한 설치 '주소'(도로명 또는 지번), GIS 분석 및 위치 기반 서비스에 필수적인 '위도'와 '경도' 좌표, 해당 보안등의 '설치연도' 및 전주 부착형, 독립주형 등 구체적인 '설치형태' 정보를 포함하고 있습니다. 더불어, 신속한 유지보수 및 관리를 위한 '관리기관명'과 '관리기관전화번호', 그리고 정보의 현재성을 판단할 수 있는 '데이터기준일자'까지 명시하여 자료의 신뢰성과 실용성을 확보했습니다. 이 자료는 남해군 내 보안등의 공간적 분포 현황 분석, 노후 시설의 체계적인 교체 계획 수립, 범죄 취약지역 개선 및 전반적인 야간 통행 환경 개선 등 안전한 지역사회 구축을 위한 정책 수립의 핵심 기초자료로 활용될 것입니다.
