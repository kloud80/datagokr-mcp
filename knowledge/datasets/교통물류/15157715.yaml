summary_user: 인천항 연안여객터미널의 입항 여객정보를 입항 건별로 조회하는 API로, 포털 설명상 입항구분·여객 수·승객 구분·선박명·업체명·선석·부두명과 연·월·주 단위 입항일자를 담는다. 항만 운영자나 분석가가 "인천항 연안여객터미널로 들어오는 여객 수가 주·월별로 어떻게 변하는가" 같은 연안 여객 수요·터미널 운영 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 선박명·업체명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 필수 파라미터인 주 단위 코드(yyyyWw)는 다른 데이터에서 먼저 받아 넘겨야 호출된다. 결항·운항 여부 같은 실시간 운항상태는 이 데이터의 대상이 아니며, 그런 용도는 해양교통안전공단 운항상태 데이터가 대표다.
