description_portal: 해당 자료는 연안여객터미널의 입항 여객정보를 조회할 수 있는 공공 Open API 서비스에 대한 상세 설명입니다. 주요 요청 파라미터로는 조회 범위 설정용, endRow, skipRow, pageNo, 인증키 등이 있으며, 응답 결과에는 입항구분, 여객 수, 선박명, 업체명, 국가코드 및 이름, 선석코드, 부두명, 항구명 등 다양한 항만 정보가 포함됩니다. 특히 여객 수(psngrCnt)와 승객 구분(psngrTp)는 연안 여객 수요 분석, 터미널 운영 최적화, 정책 수립 기반 자료로 활용됩니다. 연도, 월, 주 단위 입항일자 항목도 제공되어, 시계열 기반 여객 흐름 분석 및 해양 교통 수요 예측 등 다양한 분석 업무에 적용 가능합니다.
