summary_user: 부산교통공사가 운영하는 부산 3호선의 역별 장애인화장실 위치를 화장실 한 곳당 한 행으로 담은 파일(csv, 약 2.8KB)로, 역명·역층·게이트 안팎·가까운 출구번호·상세위치·화장실 구분이 들어 있다. 휠체어 사용자나 보호자가 '이 역의 장애인화장실은 개찰구 안에 있는지, 몇 번 출구 쪽 몇 층에 있는지'를 미리 확인하거나, 분석가가 노선별 장애인 편의시설 배치를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 노선의 장애인화장실·엘리베이터 데이터나 역 정보와는 운영기관명·선명·역명을 이름으로 맞춰 이어 쓴다.
