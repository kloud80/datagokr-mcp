description_portal: 교통약자란 장애인, 고령자, 임산부, 영유아를 동반한 사람, 어린이 등 일상생활에서 이동에 불편을 느끼는 사람을 의미하며,총 주민등록인구 가운데 추정 가능한 교통약자 인구를 연도별, 지역별로 집계하여 제공하는 자료입니다.개방 데이터는 주민등록인구현황(행정안전부)에 따른 고령자(65세 이상), 어린이(8~12세), 영유아동반자(7세 이하)와  장애인 등록 현황(보건복지부), 임산부(인구동향조사의 출생인구, 행정안전부)로 구성되어 있으며,  중복 집계되는 0~12세 및 65세 이상 장애인구를 제외한 총 교통약자 인구를 제공하며, 자료의 단위는 명, %입니다.
