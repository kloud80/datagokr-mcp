summary_user: 지역·성별 단위로 총인구와 교통약자 전체 인구·비율, 그리고 장애인·고령자(65세 이상)·임산부·영유아동반자(7세 이하)·어린이(8~12세) 유형별 인구를 집계한 전국 범위 자료로, 0~12세와 65세 이상 장애인구의 중복을 뺀 총 교통약자 수를 명·% 단위로 담는다. 교통정책 담당자나 분석가가 '어느 지역에서 교통약자 비율이 높아 저상버스·특별교통수단·보행 안전시설을 먼저 늘려야 하는가'를 판단할 때 쓴다. 실측 컬럼에 공통 조인 키(행정구역 코드 등)가 없어 다른 지역 통계와는 지역 이름을 맞춰 매핑해 이어 쓴다.
limits: 지역 이름만 있고 행정구역 코드가 없어 다른 데이터와 붙일 때 이름 표기를 직접 맞춰야 한다. 비공간 집계 자료이므로 지도상 위치나 개인·건별 분석에는 쓸 수 없다.
