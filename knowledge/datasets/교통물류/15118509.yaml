summary_user: 출입국관리시스템에서 쓰는 전 세계 공항의 세 자리 영문 공항코드와 공식 영문 공항명을 공항 한 곳당 한 행으로 담은 코드 마스터 파일(CSV, 약 162KB)이다. 출입국·운항·항공통계 자료에 나오는 ICN 같은 세 자리 공항코드가 어느 공항인지 영문명으로 풀어 보려는 분석가나 행정 실무자가 쓴다. 공항코드(공항코드) 열을 기준으로 운항정보·항공통계·노선 데이터의 공항 코드와 이어 붙이는 매핑표로 쓰지만, 실측상 전역 조인 키로 확인된 열은 없어 코드값·이름 매칭으로 연결해야 한다.
description_portal: 해당데이터는출입국관리시스템에서활용되는전세계공항의세자리영문코드와공식영문공항명을포함합니다.공항코드는각공항에부여된고유식별자로서출입국심사,탑승정보등록,행정서류처리,국제통계작성등여러행정업무에이용됩니다.공항명은공식영문표기를기준으로하며정기적으로갱신됩니다.예를들어ICN은인천국제공항IncheonInternationalAirport을의미합니다.해당정보는시스템간데이터연계를위해표준형태로구성되어있으며공공데이터로서누구나조회및활용이가능합니다.
