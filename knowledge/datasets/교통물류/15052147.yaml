summary_user: 한국교통안전공단 건설기계조종사경력관리시스템 신청 때 함께 적어 낸 소속 업체 정보를 바탕으로, 건설기계를 운영하는 업체의 이름·우편번호·주소를 업체 한 곳당 한 줄로 담은 전국 단위 파일(CSV 약 587KB)이다. 건설기계 임대·정비·부품 사업자나 분석가가 "우리 지역에 건설기계를 운영하는 업체가 어디에 얼마나 있나"를 확인하거나 영업 대상 목록을 만드는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업체명 문자열이나 주소·우편번호를 매칭해 이어 써야 한다.
description_portal: '- 건설기계 업체정보 수집 데이터 현황 * 한국교통안전공단의 건설기계조종사경력관리시스템에  저장된 건설기계 운영 업체 현황 (업체명, 우편번호, 주소)- 건설기계조종사경력관리시스템 신청 시 해당 건설기계의 용도(영업용, 자가용)에 대한 정보와 소속되어 있는 업체 정보를 함께 기재하여 제출하도록 규정하고 있습니다. 해당 신청정보를 바탕으로 건설기계를 취급하는 업체 정보를 수집하고 있습니다. 또한, 자가용의 경우 퇴직, 이직 여부를 확인하기 위해 주기적(반기 1회)으로 변경사항을 관리하고 있습니다. 많은 건설기계 업체 정보를 수집하고 있어 전체 업체에 대한 통계자료 추출이 가능합니다.'
