description_portal: '[ESG-Environment] 본 데이터는 대구교통공사의 ESG 환경(Environment) 분야 환경관리 정보 데이터로, 대구교통공사의 연도별·월별 상수도 사용 현황 정보를 제공합니다. 데이터에는 종합청사, 월배기지, 안심기지, 문양기지, 칠곡기지, 범물기지, 1·2·3호선 역사, 경산관리소, 사월관리소, 하양주재소  등 주요 시설별 월별 상수도 사용량 정보가 포함되어 있으며, 시설별 용수 사용 현황을 확인할 수 있는 자료입니다. 해당 데이터는 연도별·시설별 상수도 사용량 비교·분석, 시설 운영 현황 파악, 물 사용 관리 및 환경관리 계획 수립을 위한 기초자료로 활용할 수 있습니다. 또한 도시철도 운영 과정에서 발생하는 용수 사용 실적을 체계적으로 관리하고, 효율적인 자원 관리 방안을 검토하는 데 활용할 수 있습니다. 본 데이터는 연 1회 갱신되며, 상수도 사용 현황 변동 사항을 반영합니다.'
