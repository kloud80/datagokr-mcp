limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 시설명·연월을 직접 맞춰 연결해야 한다. 시설별 합계만 있어 개별 역 단위 사용량은 알 수 없고, 범위가 전국·비공간으로 분류되어 있지만 실제로는 대구교통공사 시설에 한정된 자료다.
