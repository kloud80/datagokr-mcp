summary_user: 부산4호선 각 역(고촌, 금사, 낙민, 동래, 미남, 안평 등)에 설치된 비상콜폰의 위치를 운영기관명·노선명·역명·역층·상세위치(상하선별 승강장 출입구 번호) 단위로 한 줄씩 담은 작은 CSV 파일(약 4KB)이다. 승객이나 역사 안전 분석가가 '이 역 몇 층, 어느 승강장 쪽에 비상통화장치가 있나'를 확인하거나 역별 비상설비 배치를 점검할 때 쓴다. 전역 조인 키나 역 코드가 없어, 다른 역·시설 데이터와는 역명·노선명을 이름으로 맞춰서만 이어 쓴다.
limits: 역 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 역명 표기를 직접 맞춰야 한다. 좌표가 없는 비공간 데이터라 지도 위치 분석에는 바로 쓰지 못한다.
