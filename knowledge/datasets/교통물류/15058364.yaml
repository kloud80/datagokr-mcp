summary_user: 서울시 교통정보 시스템(TOPIS)이 제공하는 도로 링크별 실시간 속도와 통행시간(여행 시간)을 조회하는 외부 오픈API이다. 운전자나 교통 분석가가 특정 도로 구간이 지금 얼마나 막히는지 확인하는 데 쓰고, 조회 결과를 쌓아 두면 상습 정체 구간 분석에도 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
