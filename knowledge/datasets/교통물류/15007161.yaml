summary_user: 대전 지역에서 차량 통행 때 상습적으로 정체되는 교차로를 한 행에 하나씩 담은 목록으로, 노선(도로명)·교차로명·관할경찰서를 담고 파일 크기는 980바이트 수준의 작은 CSV다. 시민이나 교통 분석가가 '대전에서 꼬리물기·정체가 잦은 교차로는 어디이고 어느 경찰서 관할인가'를 확인하거나 정체 개선·교통정책 검토 대상을 고를 때 쓴다. 전역 조인 키가 없어 다른 교통 데이터와는 교차로명·도로명 같은 이름 매칭이나 관할경찰서 이름으로만 연결한다.
description_portal: 대전광역시는 교차로 내 교통혼잡의 주범인 "꼬리물기"에 따른 차량 지,정체로 교통소통저하, 운전자 불편야기 등 지속적인 문제로 교차로 내 엘로우존(Yellow Zone)을 시범 설치하여 운영하는 등 정체구간 해소를 위한 정책을 실시 중이다. 그 외 다각적인 교통 문제 해결을 위한 연구 및 정책 자료로 사용하기 위한 대전지역 차량통행시 상습적으로 정체되는 교차로에 대한 데이터로 노선명, 교차로명, 관할경찰서 등의 항목을 제공합니다. 이를 통해 교통관련 정책 수립, 교통 시설 개선, 사고 다발 지역 분석 등 다양한 분야에서 활용될 수 있도록 하고 시민들에게 교통안전 정보 제공을 목적으로 한다.
