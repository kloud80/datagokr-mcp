description_portal: 양산시 버스정보시스템은 버스와 정류소에 무선 송, 수신기를 설치함으로써 버스의 운행상황을 실시간으로 파악하여 정류소에서 해당버스의 도착시간을 안내하고, 이를 유무선 인터넷을 통하여 제공함으로써, 이용시민이 체감하는 대기시간을 축소하고, 운수업체의 수익을 제고하는 등의 많은 기대효과를 거둘 수 있는 최첨단 시스템 입니다.또한 서비스 지역을 단일시가 아닌 양산을 중심으로 광역생활권인 부산광역시 및 울산광역시를 포함하는 서비스 입니다. 광역BIS는 시내버스 이용자에 대한 서비스를 향상시켜 승용차 통행을 억제하고 시내버스 이용의 활성화 및 정시성 확보를 목적으로 합니다.본 데이트는 양산시 버스 노선번호, 노선명칭, 정차정류장 등 정보를 제공합니다.
