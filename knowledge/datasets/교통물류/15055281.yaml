description_portal: 본 데이터는 서울특별시 중구에 등록된 자동차의 연료별 등록 현황을 제공합니다.연료 종류에는 휘발유, 경유, 전기, 하이브리드, 수소 등이 포함되며, 각 연료 유형별 등록 차량 수가 집계됩니다.해당 자료는 중구 내 친환경 차량의 보급 추세와 에너지 전환 흐름을 파악하는 데 활용될 수 있습니다.또한 대기오염 저감 정책, 교통 에너지 수요 분석, 연료 유형별 이용 현황 파악 등 다양한 분야에서 기초자료로 사용 가능합니다.데이터는 연료 구분, 등록 대수 등의 항목으로 구성되며, 중구청 차량 등록 자료를 기반으로 정기적으로 갱신됩니다.공공기관, 연구기관, 기업 등에서 환경 및 교통 관련 정책 수립과 연구에 유용하게 활용될 수 있는 공공데이터입니다.
