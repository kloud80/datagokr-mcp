description_portal: 경상북도 문경시 자동차 연료별/차종별(승용,승합,화물,특수)/용도별(사업용,비사업용) 자동차 연료별 등록현황입니다. 자동차 등록 현황을 연료별로 살펴보면, 최근 몇 년간 친환경 차량의 비중이 꾸준히 증가하고 있는 것이 특징입니다. 과거에는 휘발유와 경유 차량이 대부분을 차지했으나, 미세먼지와 온실가스 감축을 위한 정책적 노력과 전기차 보급 확대 정책 덕분에 전기차, 수소차, 하이브리드 차량 등록이 빠른 속도로 늘어나고 있습니다. 특히 전기차는 충전 인프라 확충과 보조금 지원 효과로 매년 큰 폭으로 증가하는 추세를 보이고 있으며, 수소차 역시 시범 도시와 대도시권을 중심으로 보급이 확대되고 있습니다. 반면, 디젤 차량은 환경 규제 강화와 경유 가격 상승 등으로 점차 감소세를 보이고 있습니다. 해당 자료는 문경시 교통행정과에서 관리하는 자료입니다.
