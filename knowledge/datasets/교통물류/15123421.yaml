summary_user: 서산시 도시계획정보시스템 안에서 도로 정보를 담는 테이블과 컬럼의 구조를 7개 항목(시스템명, 논리·물리 데이터베이스명, 영문·한글 테이블명, 영문·한글 컬럼명)으로 정리한 메타데이터 파일(csv, 약 3KB)로, 도로 자체의 건별 기록이 아니라 시스템 구조 설명이다. 도시계획 시스템 자료를 요청하거나 연계하려는 분석가·개발자가 서산시 도로 데이터에 어떤 테이블과 컬럼이 있고 한글 컬럼명이 무엇인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 데이터와는 테이블명·컬럼명을 이름으로 맞추거나 같은 기관(서산시) 자료끼리만 연결한다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 도로에 관한 메타데이터이다. 본 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 도로는 도시 내 교통 흐름을 원활히 하고 공간 구조를 형성하는 핵심 기반시설로서, 도시개발과 밀접하게 연관된다. 본 데이터는 도로의 위치, 기능, 구분 등을 이해하는 데 유용하며, 교통계획, 토지이용, 행정업무 등에 참고자료로 활용할 수 있다. 메타데이터 형식으로 제공되어 도시계획정보시스템 구조와 정보 속성 파악에 기여하며, 공간정보 분석, 정책 수립, 민간 활용 등 다양한 분야의 기초자료로 제공된다.
