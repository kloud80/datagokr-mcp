summary_user: 부산교통공사가 운영하는 도시철도 역을 호선별로 한 줄씩 담은 역 목록 파일로, 운영기관명·선명·역명과 함께 노선 안 역 순서(역구성순서), 앞 역과의 거리(구간키로), 기점부터의 누적거리(기점키로)를 담는다(CSV 약 4.6KB, 활용신청 없이 내려받음). 부산 도시철도 어느 두 역 사이의 거리가 얼마인지, 특정 호선에서 역이 몇 번째에 놓이는지를 확인하려는 이용자·분석가가 쓴다. 전역에서 통하는 역 코드 같은 조인 키가 없어서, 다른 철도·역 데이터와는 역명·선명을 이름으로 맞추거나 같은 기관 코드로만 잇는다.
limits: 역 좌표·출입구·환승 정보는 들어 있지 않아 이 파일만으로는 역세권을 판정하지 못한다. 공통 역 코드가 없으므로 역명 표기 차이 때문에 다른 데이터와 매칭이 어긋날 수 있다.
