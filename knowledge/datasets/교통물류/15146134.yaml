description_portal: 이 데이터는 서울특별시 각 자치구 간의 물품·우편·문서 등의 배송·전달 현황을 날짜별, 발송지·수신지별, 항목 분류별로 집계한 자료입니다.각 <row>는 특정 배송연월일(배송전달일) (배송전달일)에 송하인_구명에서 수하인_구명으로 전달된 건수를 나타냅니다.송하인_시명, 송하인_시코드, 송하인_구코드 등은 발송 지역의 행정구역명과 코드,수하인_시명, 수하인_시코드, 수하인_구코드는 수신 지역의 행정구역명과 코드를 뜻합니다.대분류_착지물동량_가구/인테리어 ~ 대분류_착지물동량_화장품/미용(총 11개)은 전달된 항목을 세부 분류로 나눈 건수를 나타내며, 각 숫자는 해당 분류 건수입니다.예를 들어, 대분류_착지물동량_생활/건강이 9라면 해당 분류 항목이 9건 전달된 것을 의미합니다.이 자료를 통해 자치구 간 물류 흐름, 행정문서 교환, 특정 품목의 구간별 이동량 등을 분석할 수 있습니다.연도별·분류별 비교를 통해 행정 효율성, 물류 수요 패턴, 자치구 간 협력 현황을 파악하는 데 유용합니다.
