summary_user: 경기도버스운송관리시스템(BMS)에서 나온 노선별 운행 차량 이력으로, 이력 한 건마다 어떤 노선(route_id)을 어느 운수업체 차량이 운행했는지를 담은 건별 원천 데이터다. 버스 운영 분석가나 정책 담당자가 '이 노선에는 어떤 차량이 배정돼 왔고 언제 차량이 바뀌었나', '운수업체별로 운영 차량이 몇 대인가'를 확인할 때 쓴다. 전역 조인 키는 없고, 노선ID·업체ID·차량ID 같은 경기도 내부 코드를 통해 같은 기관의 버스 노선·정류장·도착 정보 데이터와만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 노선별 운행 차량 이력 정보로, 경기도 내 각 버스 노선에 대해 어떤 차량이 어느 시점에 운행되었는지를 기록한 데이터입니다. 주요 항목으로는 '이력ID', '노선ID', '업체ID', '차량ID'가 포함되며, '노선ID'는 특정 노선을 식별하는 고유번호, '차량ID'는 해당 노선을 운행한 차량의 고유 식별번호, '업체ID'는 차량을 운영한 운수업체를 나타냅니다. 이 데이터는 차량 배차 이력 분석, 노선별 차량 운행 이력 추적, 운수업체별 운영 차량 파악 등에 활용되며, 특히 노선 변경 이력이나 차량 교체 패턴을 분석하는 데 유용합니다. 또한 교통정책 수립, 버스 운영 효율화, 이용자 민원 대응 등의 기반 자료로 사용될 수 있습니다.
