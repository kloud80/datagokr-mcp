description_portal: 자동차리콜센터 리콜현황 안내- 전기차, 수소차 등 미래지향적인 자동차가 출시되고 있는 현재 신기술로 인해 발생되는 여러가지 결함에 대해 국가와 제작사가 발빠르게 대응하여 국민의 안전을 도모하기 위해 리콜을 실시합니다.     이러한 리콜이 실시되었을 때 모든 국민이 이를 바로 알 수 있도록 리콜현황 정보를 제공하고 있습니다.- 제작사별, 차명별로 발생된 리콜을 차명별로 생산시작일, 생산종료일을 안내하여 소유자가 본인의 자동차, 이륜차가 해당 리콜에 해당되는지 확인할 수 있습니다.- 리콜개시일을 통해 소유자는 리콜을 받을 수 있는 시작 날짜를 알 수 있으며 리콜시정을 받기위해 제작사에  방문을 하여 조치를 받을 수 있습니다.- 해당 리콜을 실시하는 이유를 통해 국민의 알권리를 충족시켜 줄 수 있습니다.- 위 자료를 통해 모든 리콜정보를 제공받을 수 있으며 소비자가 어떠한 경로를 통해서도 자동차, 이륜차 제작사에서 진행하는 리콜을 모두 알 수가 있습니다.- 국민은 안내를 받고 리콜 시정을 받을 수 있으며 위 데이터를 통해 자동차 결함으로 인한 교통사고 방지로 국민의 생명과 재산을 보호하는데 기여할 수 있습니다.
