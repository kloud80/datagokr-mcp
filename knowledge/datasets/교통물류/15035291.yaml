summary_user: 창원시 관내 정류소에 설치된 버스정보안내기(실시간 도착정보 안내기)를 한 행에 한 대씩 담은 설치현황 파일로, 정류소명·주소·정류소 ID·모바일ID로 구성된다. 시민이나 교통 분석가가 '우리 동네 정류장에 도착정보 안내기가 있는가', '안내기가 없는 정류장은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 창원시 버스정류장 원장이나 지자체 BIS 실시간 도착정보와는 정류소 ID·모바일ID 또는 정류소명으로 맞춰 이어 쓴다.
description_portal: 경상남도 창원시 관내 버스정보안내기의 설치현황(정류장명, 주소, ID, 모바일ID) 자료를 올려드리니, 참고하시기 바랍니다.버스정보안내기 설치현황 데이터는 정류소에 설치된 실시간 버스도착정보 안내기의 설치 위치, 설치연도, 운영주체, 안내기 유형, 관리상태 등 전반적인 운영 정보를 포함하고 있습니다. 이 자료는 대중교통 정보 접근성 개선, 교통약자 이동권 보장, 안내기 고장 민원 대응, 도시 교통서비스 품질 향상, 예산 투자 우선순위 판단 등에 활용할 수 있으며, 정류소별 접근성 평가 및 시각화를 통한 정책적 활용도가 높습니다.
