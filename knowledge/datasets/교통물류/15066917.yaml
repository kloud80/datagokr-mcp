summary_user: 국가표준 링크(도로구간)별로 기준년도 단위의 운행 통계와 안전성능함수(SPF) 회귀 결과, 사고·사상자 수, 11대 위험운전행동 월평균 건수, A~D 안전등급과 위험순위를 담은 전국 집계 파일이며, 파일 용량 제한으로 일부 데이터만 들어 있다. 도로 안전 분석가나 지자체 담당자가 '어느 도로구간이 같은 도로등급 안에서 실제 위험도가 높고 과속·급감속 같은 위험운전이 잦은가'를 살펴 개선 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 링크 식별값(링크 계정)을 국가표준 노드링크와 이름·코드로 맞추거나 같은 기관 자료와만 연결하며, 다발지역 위치는 도로교통공단(TAAS) 사고다발지역 자료와 함께 본다.
description_portal: '한국교통안전공단 운수안전컨설팅지원시스템에서 관리하고 있는 국가표준 링크에 대한 운행 통계 및 분석 정보로 도로구간(링크)에서 발생한 사고 심각도를 고려하여 도로 및 교차로별 안전등급 산출 정보 입니다.- 안전성능함수(Safety Performance Function, SPF)를 이용하여 안전등급을 추정합니다.- 안전성능함수는 특정 도로 구간에서 발생한 사고를 추정하는 모형으로서, 교통사고 예측모형이라고하며, 기본적으로 교통량과 구간길이, 교통사고 건수를 이용하여 모형을 구축합니다.- 기존 11대 위험운전행동건수 합계를 사용하여 모델 구축합니다.－ 총 4 단계로 구분: A~D 등급으로 표출하고 실제 위험도를 산출합니다.－ 또한 도로 유형별로 실제 위험도를 순위화 하여 세부 등급 표출 * 파일 용량 제한으로 인해 일부 데이터만 추출'
accrual_periodicity: 수시
