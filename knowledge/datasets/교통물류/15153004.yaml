summary_user: 부산광역시 어린이보호구역 안에 설치된 불법주정차 단속용 CCTV를 한 대(설치 지점)씩 담은 원천 목록으로, 보호구역 시설명·관리기관·상세주소·설치시기·x/y 좌표를 포함하며 약 19KB 분량의 CSV 파일로 제공된다. 우리 아이 학교 앞 보호구역에 단속 CCTV가 있는지, 단속 카메라가 없는 보호구역은 어디인지 확인하려는 학부모·지자체 교통안전 담당자·분석가가 쓴다. 전역 조인 키는 없어서 다른 어린이보호구역 지정 현황이나 교통사고 데이터와는 시설명·주소를 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 어린이보호구역 내 설치된 불법주정차 단속용 CCTV 현황 정보를 제공합니다.데이터에는 각 어린이보호구역별로 CCTV의 설치 위치 정보가 포함되어 있으며, 이를 통해 어린이 보행 안전 확보와 교통사고 예방을 위한 기초 자료로 활용할 수 있습니다.제공된 좌표 정보는 지도 서비스, GIS 기반 분석, 단속 효율성 평가, 안전 시설 배치 계획 등 다양한 공공정책 및 연구 목적으로 활용 가능하며, 어린이보호구역 안전 점검과 시설물 유지·보수 계획 수립에도 참고 자료로 사용될 수 있습니다.
