summary_user: 인천광역시 버스정보관리시스템(BIS)에서 버스 운행 이벤트가 생길 때마다 갱신되는 정류소별 버스 도착예정 정보를 건별 이력으로 담은 파일로, 실시간 수집 데이터 중 일부 시간대만 추출한 CSV(약 1.5MB)이다. 분석가가 특정 정류소에서 노선별 도착예정시간이 실제 운행 이벤트에 따라 어떻게 바뀌는지, 막차·돌발상황 때 도착 예측이 어떻게 달라지는지를 살피는 데 쓴다. 정류소·노선·노드·버스 관리번호(ID)가 들어 있지만 전역 조인 키는 아니어서, 인천시 BIS의 정류소·노선 원장처럼 같은 기관 코드 체계를 쓰는 자료와만 이어 쓸 수 있다.
limits: 일부 시간대만 뽑은 1회성 추출 파일이라 연속된 실시간 도착 정보나 장기 추세 분석에는 맞지 않는다. 전역 조인 키가 없어 국가 표준 정류장 코드(TAGO 등)와 바로 연결되지 않고, 이름이나 코드 매핑을 거쳐야 한다.
