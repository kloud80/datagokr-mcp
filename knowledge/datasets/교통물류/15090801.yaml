summary_user: 울산광역시 승용차요일제 참여자에게 할인 혜택을 주는 협력 업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 분야 구분·상호·전화번호·구·주소·할인내역을 담는다(CSV 약 16KB). 울산 시민이 요일제에 참여하면 내 동네(구)에서 어떤 업체가 무엇을 얼마나 할인해 주는지 찾을 때 쓴다. 전역 조인 키는 없어서 구 이름이나 주소 문자열로 행정구역·주소 기반 데이터와 맞춰 이어 쓴다.
description_portal: 본 데이터는 승용차 요일제 참여자에게 제공되는 각종 할인 혜택의 이용 내역 정보이다. 할인 제공 분야, 상호명, 연락처, 소재지 정주소, 할인 내역 등의 상세 내용을 포함한다. 승용차 요일제는 지정된 요일에 자발적으로 차량 운행을 자제하는 제도로, 참여자에게는 주차 요금, 자동차세, 공영 주차장 이용료, 협력 업체 서비스 이용 등에 대한 할인 혜택이 제공된다. 본 정보는 참여자 혜택 관리, 정책 효과 분석, 예산 집행 관리, 제도 개선 방안 수립 등에 활용되며, 참여 독려와 제도 활성화를 위한 기초 자료로 제공된다. 할인 혜택 이용 현황 분석을 통해 효과적인 인센티브 제도 운영과 교통 수요 관리 정책 강화에 기여한다.
