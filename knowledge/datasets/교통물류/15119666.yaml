summary_user: PORT-MIS에서 추출한 전국 항만시설의 제원코드를 담은 파일(CSV, 약 77KB)로, 한 행이 항만별 시설 하나이며 시설이용구분·시설구분·시설명·선석 구분과 시설 제원 코드를 담는다. 항만 운영기관이나 연구자가 "이 항만의 어느 부두·선석이 어떤 코드로 관리되는가"를 확인하거나 항만별 시설 구성을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항만명·시설명 매칭이나 같은 기관(해양수산부) 내부 코드로만 연결하며, 입출항·물류 데이터와 잇는 항만코드는 UN/LOCODE와 해수부 내부 코드가 병존하므로 별도 매핑표가 필요하다.
description_portal: 이 데이터는 해양수산부에서 해운항만물류정보시스템(PORT-MIS)를 기반으로 추출된 항만시설 제원코드 정보를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 항만별 시설이용구분, 시설 구분, 항만시설의 명칭, 선석구분 및 시설 제원 코드 정보로 구성되어 있습니다.  본 데이터는 항만 운영 기관에서 항만 운영 현황 파악, 시설 장비 관리, 항만별 시설 비교 분석, 항만시설 코드표 일원화 등 항만 행정 및 관리 업무를 위한 기초 자료로 활용될 수 있습니다. 또한, 연구기관에서 항만 관련 연구자료 작성 등에 활용될 수 있습니다.
