summary_user: 경기도 버스운송관리시스템(BMS) 카드데이터를 기준으로 버스 노선별 경유 정류장을 정류장 순서 단위로 한 행씩 담고, 누적거리·정류장 간 거리·회차 정류장명 같은 거리 정보를 함께 제공한다. 교통 분석가가 "이 노선은 어떤 정류장을 어떤 순서로 지나며 정류장 사이 거리는 얼마인가"를 확인하거나, 교통카드 승하차 데이터를 노선 구간별로 집계하는 데 쓴다. 정류장 ID(sttn_id)가 실측 조인 키로 확인돼 정류장 원장·도착 정보와 이어 쓰고, 이비노선·이비정류장 아이디는 교통카드 시스템 연동용 식별자이지만 실측 조인 키로 확인된 것은 정류장 ID뿐이다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)의 카드데이터를 기준으로 구축된 ‘노선 경유정류소 정보’로, 버스노선별로 경유하는 정류장의 정보를 상세히 제공합니다. 주요 항목은 이비노선아이디, 정류장 순서, 노선ID, 정류장ID, 누적거리, 확정거리, 정류장간 거리, 회차 정류장명 등으로 구성되어 있으며, 이동 거리 정보도 함께 제공됩니다. 특히 이비노선 및 이비정류장아이디는 교통카드 시스템 연동을 위한 식별자 역할을 하며, 실시간 승하차 데이터 분석과 연계 활용이 가능합니다. 본 데이터는 노선 설계, 정류장 간 거리 기반 요금제 설정, 교통카드 기반 승하차 흐름 분석 등의 다양한 분야에 활용될 수 있습니다.
