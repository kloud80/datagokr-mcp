summary_user: 포항시 공영 주차장별로 주차장명·주소·위도·경도와 주차 가능 대수, 주차 가능 여부, 휴무일을 수집 일시와 함께 담은 개별 시설 단위 데이터입니다. 포항 시민이나 방문객이 '지금 근처 공영 주차장에 빈자리가 있는지'를 확인하거나, 분석가가 시간대별 주차 가능 대수 변화를 살피는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터(주차장관리번호·요금·면수 원장) 등과는 주차장명·주소나 좌표 매칭으로만 이어 쓴다.
