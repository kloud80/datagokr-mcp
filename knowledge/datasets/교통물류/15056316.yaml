summary_user: 제주특별자치도에 있는 자동차해체재활용업체(폐차장)를 업체 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 1.3KB)로, 행정시·업체명·등록일·소재지 주소·연락처를 담는다. 제주에서 폐차를 맡길 업체를 찾는 도민이나, 지역별 폐차·자원순환 업체 분포를 보려는 분석가가 '제주시와 서귀포시에 등록된 해체재활용업체는 어디인가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호·업체코드 등)가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 잇거나, 주소를 좌표로 바꿔 지도에 올려 쓴다.
limits: 사업자번호 같은 공통 식별 키가 없어 다른 업체 원장과 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 제주특별자치도 한 곳뿐이라 다른 시도와 비교하려면 별도 자료가 필요하다.
