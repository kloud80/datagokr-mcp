description_portal: '제주특별자치도 내에 소재하고 있는 자동차해체재활용업 데이터를 제공합니다.항목: 행정시, 업체명, 등록(면허)년월일, 소재지, 연락처 *「전기ㆍ전자제품 및 자동차의 자원순환에 관한 법률」 - 자동차해체재활용업자는 폐자동차를 최대한 재활용하여야 하며, 재활용하고 남은 폐자동차의 잔여 부분은 파쇄재활용업자 등에게 인계하여 재활용되도록 하여야 한다. 이 경우 폐자동차와 관련 없는 다른 폐기물이 섞여 들어가지 아니하도록 하여야 함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1498850'
