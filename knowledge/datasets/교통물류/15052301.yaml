description_portal: '데이터 개요국토교통부_연도별 항공수송실적요약은 1971년부터 매년 집계된 국내선 및 국제선 항공수송량(여객·화물)을 요약하여 제공하는 통계입니다. 연도별 수송실적을 간결하게 정리한 자료로, 국내외 항공 수요의 장기적 추세를 파악하고 항공산업 정책 수립, 시장 구조 분석, 수요 예측 등에 기초자료로 활용할 수 있습니다.데이터 제공 항목구분(연도): 기준 연도국내선여객(명): 해당 연도 국내선 총 여객 수국제선여객(명): 해당 연도 국제선 총 여객 수국내선화물(톤): 국내선 총 화물 수송량국제선화물(톤): 국제선 총 화물 수송량출처 및 갱신 주기국토교통부 항공정보포털시스템의 항공통계를 기반으로 연도별 정리여객 및 화물은 실운송 기준이며, 각 항공사의 운송 실적을 종합하여 산출국내선·국제선 구분은 운항구간을 기준으로 분리활용 안내국내·국제 항공수송 수요의 장기적 성장 추이 분석국내외 항공시장 구조적 변화 파악 및 수요 예측항공사 전략 수립, 노선 정책 기획, 항공 인프라 투자 판단의 기초자료정책 수립·산업 연구·통계 간행물 발간 등 공공 목적의 참고자료데이터 해석 시 유의사항해당 데이터는 요약 형태로 제공되며, 운항횟수, 수송거리(RPK/FTK) 등은 별도 데이터에서 확인 필요코로나19, 글로벌 경제위기 등 특정 연도의 외부 요인은 수치에 직접적 영향을 미칠 수 있음연도별 수치는 원자료(공항별/항공사별)와 연결하여 심층 분석 가능예시 데이터연도국내선여객(명)국제선여객(명)국내선화물(톤)국제선화물(톤)19711,105,470515,2447,28428,58019721,120,922784,8457,84138,03519731,269,0811,432,8608,82057,885'
