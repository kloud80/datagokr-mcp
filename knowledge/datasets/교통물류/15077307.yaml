summary_user: 성남시 버스정류장을 한 곳당 한 행으로 담은 원천 목록으로, 정류장번호·이름·상세위치·위도경도와 경유 시내·시외버스 노선번호, 중앙차로·레드존 여부, BIT·의자·바람막이·냉온풍기·공기청정기·와이파이·비상벨 등 편의시설 설치 여부를 담는다. 시민이나 분석가가 '우리 동네 정류장 중 냉온풍기나 버스정보안내단말기가 없는 곳은 어디인가', '정류장이 부족한 행정동은 어디인가'처럼 시설 현황과 접근성을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 정류장명·정류장번호 대조나 시군구·행정동 이름, 좌표 기반 공간 결합으로 이어 써야 한다.
description_portal: 성남시 내 버스정류장 현황이며 아래와 같은 항목을 제공하고 있습니다.정류장번호(ID),정류장명,상세위치,위도,경도,정류장설치유형,시내버스_경유노선번호,시외버스_경유노선번호,레드존여부,중앙차로여부,미세먼지 측정센서 설치여부,와이파이설치여부,안전비상벨설치여부,버스정보안내단말기(BIT) 유형,의자설치유형,바람막이설치여부,냉온풍기설치여부,공기청정기설치여부또한 특정 지역의 정류장 밀집도, 접근성, 교통 취약지역 여부 등을 분석하는 데 유용해 교통 인프라 개선이나 정류장 증설·이전 검토와 같은 행정적 판단에도 중요한 근거 자료로 사용됩니다. 더불어 스마트 교통서비스 구축, 정류장 정보 시스템 개선, 이동 약자를 위한 교통환경 분석 등 다양한 도시교통 정책 수립에도 의미 있는 기초자료로 활용될 수 있는 데이터입니다.
