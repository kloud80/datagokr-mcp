summary_user: 1989년부터의 한국 국제선 항공운송 실적을 연도 단위로 집계한 전국 통계로, 여객 수와 여객킬로(RPK), 화물 톤수와 화물톤킬로(FTK), 운항 편수와 운항거리를 담는다. 정책 담당자나 항공시장 분석가가 '팬데믹 이전 대비 국제선 여객·화물 수요가 얼마나 회복됐나' 같은 장기 추세 질문에 쓴다. 전역 조인 키는 없고 연도(구분)를 기준으로 국내선 수송실적 등 같은 기관의 연도별 항공통계와 나란히 붙여 쓴다.
description_portal: '데이터 개요국토교통부_연도별 국제 항공수송실적 데이터는 1989년부터 현재까지의 연도별 국제선 항공운송 실적을 수록한 통계 자료입니다. 국제선 여객 수송, 화물 운송, 운항 건수 및 거리와 같은 핵심 지표들을 포함하고 있으며, 한국의 국제 항공시장 규모와 성장 추세를 시계열로 분석할 수 있는 기반 데이터를 제공합니다. 본 자료는 항공정책 수립, 시장 분석, 노선 전략 수립, 국제협력 대응 등에 활용됩니다.데이터 제공 항목구분(연도): 통계 기준 연도여객(명): 국제선 탑승객 총수여객킬로(Km, RPK): 여객 수송 거리의 총합 (Revenue Passenger Kilometers)화물(톤): 국제선 화물 운송 총량화물톤킬로(Km, FTK): 화물 수송 거리의 총합 (Freight Ton Kilometers)운항(편): 국제선 총 운항 횟수운항킬로(Km): 국제선 항공기의 총 운항 거리출처 및 갱신 주기국토교통부 항공정보포털시스템에서 제공항공사 및 공항의 실적 보고를 기반으로 연도별 집계,국제선만을 대상으로 하며, 국내선 실적과는 별도 제공됨활용 안내운송 효율성(탑승률, 거리당 수익 등) 분석 기반 항공사 경영 전략, 노선 개편, 수익모델 수립 등에 활용팬데믹 전후 수요 회복률 등 비교 분석의 기초자료데이터 해석 시 유의사항RPK 및 FTK 수치는 단순 여객·화물 수송량이 아닌 거리 기반 수송량으로, 실제 운송 효율 분석에 중요예시 데이터연도여객(명)여객킬로(Km)화물(톤)화물톤킬로(Km)운항(편)운항킬로(Km)19898,283,16429,795,423,539711,2954,268,280,90044,219212,959,28319909,626,41536,405,075,593776,7594,554,913,26953,442249,721,301199110,270,66638,521,435,036787,3424,470,003,43659,927267,728,140'
