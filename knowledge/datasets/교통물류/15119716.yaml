summary_user: '한국교통안전공단 대중교통 현황조사에서 나온 지역 간 일반철도(고속철도 포함) 이용인원을 SRT·KTX·ITX·새마을호·무궁화호·누리로·통근열차 등 철도유형별로, 월요일부터 일요일까지 요일별로 집계한 전국 단위 표(단위: 명)로, 파일 크기가 345바이트인 작은 요약표다. 교통 분석가나 정책 담당자가 "KTX와 무궁화호 이용이 주중과 주말에 어떻게 다른가" 같은 철도유형별 요일 수요 차이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 철도유형 이름(구분1)을 맞추거나 같은 기관의 다른 대중교통 현황조사 자료와 이름 기준으로만 이어 쓴다.'
description_portal: 한국교통안전공단에서 대중교통 현황조사를 통해 조사한 지역 간 대중교통 철도유형별 이용인원 데이터입니다.해당 데이터의 수단은 일반철도(고속철도 포함)입니다.철도유형별로(SRT, KTX, ITX, 새마을호, 무궁화호, 누리로, 통근열차) 요일별(월요일 ~ 일요일) 이용인원을 세분화하여 제공하였습니다.단위는 명입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 할 수도 있습니다.
