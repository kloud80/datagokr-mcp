summary_user: 경기도 시군별 주민의 통행을 출근·통학·쇼핑 등 목적별로 나누어, 0~80km를 5km 구간으로 나눈 통행거리 비율(%)과 80km 초과 비율을 연도별로 담은 집계 데이터다. 교통 계획 담당자나 분석가가 "우리 시 주민의 출근 통행이 몇 km 안에서 끝나는 비율이 얼마인가"처럼 도시 자족성과 대중교통·자전거 정책 대상 거리를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 시군 통계와는 지역명(region)이나 지역코드(region_cd)를 같은 기관 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별 주민들의 통행 목적에 따른 통행 거리 분포를 연도별로 수록하고 있으며, 출근·통학·업무·쇼핑·여가오락친교 등의 목적별로 5km 단위의 거리 구간별 통행 비율(%)을 포함합니다. 지역 주민들의 일상 이동 패턴과 통행 거리 특성을 정밀하게 분석할 수 있습니다. 이 데이터는 교통 수요 분석, 대중교통 노선 설계, 도심 혼잡도 완화 전략, 자전거 및 도보 기반 교통정책 수립 등 다양한 교통 계획 수립에 활용될 수 있으며, 도시 내 자족성 평가 및 교통복지 향상 정책의 기초 자료로도 매우 유용합니다.*행정구역별 동일 목적 통행자의 통행거리를 0~80km까지 5km단위로 구분하여 전체 통행수로 나눈 값
