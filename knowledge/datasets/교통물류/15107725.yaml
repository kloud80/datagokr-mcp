summary_user: 동작구 안의 공유형 전동킥보드 주차구역을 한 곳씩 담은 파일로, 시군구·상세주소·주변 위치 설명·설치일자가 들어 있으며 파일 크기가 285바이트에 불과해 수록 건수는 매우 적다. 주민이나 공유킥보드 사업자가 '동작구에서 킥보드를 어디에 세워야 하나', 분석가가 '주차구역이 언제 얼마나 설치됐나'를 확인하는 데 쓴다. 전역 조인 키나 좌표가 없어 다른 데이터와는 상세주소를 지오코딩하거나 시군구 이름으로 맞춰 이어 쓴다.
