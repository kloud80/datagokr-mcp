summary_user: 수도권 8호선 역사별 장애인 화장실의 위치를 화장실 한 곳당 한 행으로 담은 파일로, 운영기관·노선·역명과 지상 구분, 역층, 개찰구 안팎(게이트내외), 가까운 출구번호, 상세위치를 포함한다(CSV 약 3KB 규모). 휠체어 사용자나 이동 안내 서비스 개발자가 '8호선 이 역에서 장애인 화장실은 개찰구 안에 있나, 몇 번 출구 쪽인가'를 확인하는 데 쓴다. 공통 역 코드 같은 전역 조인 키가 없어서 다른 역사 편의시설·엘리베이터 데이터와는 역명·노선명을 문자열로 맞춰 이어 써야 한다.
