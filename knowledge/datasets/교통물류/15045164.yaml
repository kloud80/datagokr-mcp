summary_user: 인천광역시 군·구별로 자전거 보관시설의 개소 수와 보관대수를 노상주차장·노외주차장·기타(부설주차장 포함)로 나눠 집계한 통계 파일로, 건별 시설 목록이 아니라 군구 단위 합계이며 파일 크기는 367바이트 수준의 작은 표다. 인천시 교통정책 담당자나 분석가가 '어느 군·구에 자전거 보관대가 상대적으로 부족한가'를 비교해 보관대 확충 지역을 고르는 데 쓴다. 전역 조인 키는 없어 군구 이름(군구)을 기준으로 인구·자전거도로·공공자전거 대여소 같은 인천 군구별 통계와 이름 매핑으로 이어 쓴다.
description_portal: 인천광역시 군·구별 자전거 보관대수 통계 현황 공공데이터는 인천시 각 행정구역(군·구)에 설치된 자전거 보관 시설의 수량을 집계한 자료입니다.이 데이터에는 군구별 노상주차장(개소, 주차대수), 노외주차장(개소, 주차대수), 기타(개수, 주차대수) 등의 정보가 포함되어 있습니다.<활용 방안>인프라 불균형 해소자치구별 보관대 설치 현황을 비교 분석하여 자전거 이용률은 높으나 보관 시설이 부족한 지역을 식별하고, 해당 지역에 보관대 확충 예산 및 정책을 집중하는 근거 자료로 활용됩니다.해당 데이터는 인천시 정보공개포털 또는 공공데이터포털에서 확인할 수 있습니다.
