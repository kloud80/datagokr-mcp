summary_user: 충주시 첨단교통관리시스템이 관리하는 도로 링크(교차로와 교차로를 잇는 도로 구간)를 한 행씩 담은 CSV 파일(약 153KB)로, 차로 수·도로 등급·도로 유형·최고 제한속도·통과 제한 하중과 높이·연장 같은 구조·운영 속성을 담는다. 교통 분석가나 화물 운송 사업자가 '충주시 안에서 높이나 하중 제한이 걸린 구간은 어디이고, 제한속도와 차로 수는 어떻게 되나'를 확인하는 데 쓴다. 실측 컬럼에서는 전국 공통 조인 키가 확인되지 않아, 국토부 표준노드링크 등 다른 교통 데이터와는 도로명·도로번호를 이름으로 맞추거나 같은 기관(충주시) 자료끼리 이어 쓴다.
description_portal: 본 데이터는 충청북도 충주시의 첨단교통관리시스템에서 관리되는 링크(Link) 정보를 제공하는 자료로, 링크 ID, 시작 노드 ID, 종료 노드 ID, 도로 사용 여부, 차로 수, 도로 등급, 도로 유형, 도로 번호 및 도로명, 중용구간 여부, 연결로 코드, 최고 제한속도, 통행 제한 차량, 통과 제한 하중, 통과 제한 높이, 연장, 비고 등의 항목으로 구성되어 있음. 링크 정보는 교차로와 교차로를 연결하는 도로 단위를 의미하며, 도로의 구조적·운영적 특성을 종합적으로 관리할 수 있도록 함. 본 데이터는 교통 시뮬레이션, 도로 설계 검토, 제한조건 기반 교통안전 정책 마련, 도로망 최적화, 스마트 교통체계 구축 등에 활용될 수 있음. 또한 장기적 분석을 통해 교통 혼잡 구간 파악, 제한 조건 위반 관리, 도로 인프라 개선 정책 수립에도 유용함.
