summary_user: 서울교통공사가 운영하는 1~8호선과 9호선(2·3단계) 역의 출구번호별 인접 역세권(건물·시설·지명 등) 안내 정보를 한 행에 한 건씩 담은 파일이며, 같은 역세권이 여러 출구에 걸치면 출구마다 따로 행이 생긴다. 시민이나 서비스 개발자가 '이 건물·시설에 가려면 몇 번 출구로 나가야 하나'를 확인하거나, 분석가가 역별 주변 시설 분포를 정리하는 데 쓴다. 전역 조인 키는 없어서 같은 기관의 역 코드(전철역코드·외부코드)나 역명·호선 매핑으로 서울교통공사의 다른 역·승하차 데이터와 이어 쓴다.
limits: 역세권 정보가 등록되지 않은 출구는 행이 없을 수 있어 출구 전체 목록으로 쓰면 안 되며, 동일 역세권명이 출구별로 중복될 수 있어 시설 수를 셀 때 중복을 제거해야 한다. 역세권명은 지명·시설명 텍스트일 뿐 좌표가 없어 공간 분석에는 바로 쓸 수 없다.
