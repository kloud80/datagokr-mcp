description_portal: 전국의 설치되어 있는 궤도시설에 대한 현황을 확인할 수 있도록 관련 정보를 제공하며 다음의 내용들을 포함합니다.해당 궤도시설이 설치되어 있는 지역에 대한 내용, 궤도시설이 설치되어 있는 위치에 대한 내용, 궤도시설을 운영하는 업체의 업체명에 대한 내용, 궤도시설의 준공일에 대한 내용, 궤도시설의 용도에 관한 내용, 궤도시설의 설비 종류(톱니바퀴식 모노레일, 일반모노레일, 케이블철도, 노면전차, 자기부상열차, 철제차륜형경전철, 고무차륜형경전철, 선형유도전동기형 경전철, 화물용 궤도)에 대한 내용 등의 정보를 포함하며 관련 내용들을 확인할 수 있습니다.
