summary_user: '인천광역시 안 전동킥보드 주차구역을 한 곳씩 담은 파일로, 군구명·주차구역 주소·거치구역 개소·설치년도를 행 단위로 기록한다. 시민이 "우리 구 어디에 킥보드를 세울 수 있나"를 찾거나, 분석가가 군구별 주차구역 수와 연도별 조성 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 군구명이나 주소 문자열을 매칭해 잇는다(예: 공공자전거 대여소·자전거도로 위치와 주소 기준 비교).'
description_portal: 인천광역시 전동킥보드 주차구역 위치 현황 공공데이터는 공유 전동킥보드의 체계적 관리와 안전한 이용 환경을 조성하기 위해 제공되는 자료입니다. 이 데이터는 연번, 군구명, 주차구역 주소, 거치구역 개소, 설치년도 항목으로 구성되어 있습니다. 연번은 데이터 식별 번호를 의미하며, 군구명은 주차구역이 속한 행정구역을 나타냅니다. 주차구역 주소는 시민들이 쉽게 찾을 수 있도록 정확한 위치 정보를 제공하고, 거치구역 개소는 해당 구역에 설치된 거치대 수나 주차 공간 수를 보여줍니다. 설치년도는 해당 구역이 조성된 시점을 기록하여 인프라 구축 현황을 파악할 수 있게 합니다
