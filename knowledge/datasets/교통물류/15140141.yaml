description_portal: 회전교차로는 교차로 중앙에 원형 교통섬을 두고, 차량이 이 교통섬을 반시계 방향으로 우회하며 통행하는 평면 교차로 방식입니다.신호등 없이 운영되는 점이 가장 큰 특징이고, 유지비 절감 및 환경 개선을 기대합니다. 또한 정면 충돌 위험이 적고, 사고 발생 시 인명 피해도 낮아 교통사고 감소 효과를 기대하고 있습니다.회전교차로는 교통 흐름의 효율성과 안전성을 높이기 위해 도입된 교차로 형식으로, 올바른 이용이 중요합니다. (내부 주정차, 차선변경 금지 등)양평군 내 회전교차로 설치 현황에 대한 데이터로 교차로명, 교차로 위치 및 지번주소, 설치연도, 사업비(백만원), 시행청 등을 제공합니다.
