description_portal: 이 정보는 안산시 도로에 설치된 전광판(VMS)에서 수집된 표출 이미지 데이터를 담고 있으며, VMS 고유번호, 표출 순번, 이미지 수집일시, 표출 이미지 데이터, 사용 여부, 이미지 포인트, 표출 양식 ID 등 총 7개 항목으로 구성됩니다. 이 정보는 전광판 운영 이력 분석, 표출 패턴 추적, 메시지 유형별 효과성 분석 등 다양한 스마트 교통 서비스 분석에 활용됩니다. 또한 VMS 메시지의 시각적 품질 관리, 표출 빈도 분석, 시점별 정책 메시지 송출 현황 파악 등에도 유용합니다. 특히 계절별·시간대별 안내 메시지 유형 통계, 전광판 콘텐츠 유형 다각화, 교통안전·재난 메시지 운영 실적 평가 등에도 활용됩니다. 이 정보는 스마트시티 기반의 공공 정보 전달 전략 수립 자료로도 활용됩니다.
