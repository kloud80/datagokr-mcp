summary_user: 광주광역시 관내 버스전용차로 운영구간을 노선(구간)별로 한 행씩 담은 소규모 파일(CSV 933바이트)로, 도로명·기점·종점·방향·거리(km)·전용차로 종류를 담는다. 시민이나 교통 분석가가 '어느 도로의 어느 구간이 버스전용차로이고 길이는 얼마인가'를 확인하거나 노선별 전용차로 연장을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명·기점·종점 같은 이름 매칭이나 시도명으로만 연결한다.
description_portal: 광주광역시 관내 버스전용차로 운영구간 현황 데이터는 대중교통 중심의 교통체계 구축과 원활한 도로 소통을 위해 마련된 중요한 기초 자료입니다. 해당 자료에는 노선별 기점과 종점, 구간이 위치한 도로명, 차로 형태 등 세부적인 정보가 포함되어 있어 실제 운영 현황을 체계적으로 파악할 수 있습니다. 광주광역시는 1994년 5월 버스전용차로제를 최초로 지정하여 대중교통 활성화와 교통 혼잡 완화를 도모해 왔으며, 이후 점진적인 노선 확충과 제도 보완을 거쳐 현재는 도시 전역에 걸쳐 주요 간선도로 중심으로 버스전용차로가 운영되고 있습니다. 총 11개 노선, 연장 67.4km에 달하는 버스전용차로가 운영 중이며, 이는 광주시민의 대중교통 이용 편의성을 높이고, 버스의 정시성을 확보하며, 나아가 대기오염 저감과 교통 효율성 제고에도 기여하고 있습니다. 이러한 운영구간 현황 데이터는 향후 정책 결정 및 교통 인프라 개선 계획 수립 시 중요한 근거자료로 활용될 수 있습니다.
