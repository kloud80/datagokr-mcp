summary_user: 경기도 도로대장에 기록된 교차시설(교차로·삼거리·IC·교량 등)을 노선번호·구간번호별로 한 건씩 담고, 위치·시설명·교차연장·교차시설폭·교차방식(평면·입체)·유효높이·교차각도를 함께 기록한다. 도로 관리자나 교통안전 분석가가 '이 노선 구간의 입체교차 시설 유효높이가 대형차 통행에 충분한가', '교차각도가 비정상적인 교차로가 어디인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크(link_id·node_id)와 직접 이어지지 않으며, 노선번호(route_no)·위치명 같은 이름·코드 매핑이나 같은 기관의 도로대장 자료로만 연결한다.
description_portal: 도로대장 교차시설 데이터는 주요 도로 구간에 위치한 교차시설의 구조적 특성과 규모를 기록한 자료입니다. 항목에는 노선번호, 구간번호, 위치, 교차시설명, 교차연장, 교차시설폭, 교차방식(평면·입체), 유효높이, 교차각도, 비고 등이 포함됩니다. 이를 통해 교차로, 삼거리, IC, 교량 등의 설계 및 구조 정보를 확인할 수 있으며, 교통 흐름 분석, 교통안전 대책 수립, 도로 유지관리, GIS 기반 도로망 분석에 활용할 수 있습니다. 특히 교차방식, 교차각도, 유효높이 정보는 교통안전성 평가와 시설 개선 계획 수립에 중요한 근거 자료가 됩니다.
