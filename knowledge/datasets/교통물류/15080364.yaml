summary_user: 서울시 전역에 설치된 불법주정차·전용차로 위반 단속용 고정형 CCTV를 한 대씩 담은 위치 목록으로, 지번주소·위도·경도·자치구·단속지점명·현장구분(단속 목적)을 담는다. 시민이나 분석가가 '우리 동네 어느 교차로에 주정차 단속 카메라가 있나', '자치구별 전용차로 단속 지점은 어디에 몰려 있나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구 코드·이름 매핑이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 서울시 불법주정차/전용차로 위반 단속 CCTV 위치정보는 서울시 전역에 설치된 불법 주정차 및 전용차로 위반 단속용 고정형 CCTV의 위치와 관리 정보를 제공하는 데이터입니다. 이 정보에는 고정형CCTV가 설치된 지번주소, 위도·경도 좌표가 포함되어 있어 단속 지점을 지도상에 정확히 표시하고 공간 분석을 수행하는 데 활용할 수 있습니다. 자치구 정보는 각 단속 지점이 속한 행정구역을 나타내며, 단속지점명은 도로명, 교차로, 전용차로 구간 등 구체적인 단속 위치를 식별하는 데 도움을 줍니다. 현장구분 항목을 통해 해당 CCTV가 주로 불법 주정차 단속용인지, 전용차로 위반 단속용인지 등 단속 목적과 현장 특성을 구분할 수 있습니다. 이 데이터는 불법 주정차 및 전용차로 위반이 빈번한 지역을 분석하고, 교통 흐름 개선과 보행 안전 확보, 대중교통 우선 정책 추진을 위한 기초 자료로 활용되며, 시민들이 단속 취지를 이해하고 교통 법규를 준수하도록 유도하는 데에도 중요한 참고 자료가 됩니다.
