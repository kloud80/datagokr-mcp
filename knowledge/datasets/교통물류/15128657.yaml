summary_user: 경부고속선의 서울역부터 부산역까지 역·연결선 사이 운행거리를 km 단위로 담은 역간 거리 행렬 형태의 파일(csv, 약 4.5KB)로, 기준역명 행과 각 역(서울·광명·천안아산·오송·대전·김천구미·동대구·울산·부산 등) 열이 교차하는 구조다. 분석가나 서비스 개발자가 '서울에서 동대구까지 고속선 운행거리는 몇 km인가'처럼 두 역 사이 거리를 확인해 소요시간 추정이나 운임 계산 근거로 쓰는 데 쓴다. 전역 조인 키가 없어 다른 철도 데이터(승하차 인원, 시간표, 역 정보 등)와는 역 이름을 맞춰 연결해야 한다.
limits: 역 코드 같은 공통 조인 키가 없어 다른 데이터와는 역명 매핑으로만 이을 수 있고, 연결선·조차장 같은 비영업 지점도 열로 섞여 있다. 좌표가 없는 비공간 자료라 지도 위 위치나 노선 형상(곡선·직선 비율)은 이 파일만으로 알 수 없다.
