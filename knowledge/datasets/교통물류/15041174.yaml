description_portal: 부산교통공사에서 운영하는 부산3호선 승강장 정보에 대한 데이터로 철도운영기관명, 선명, 역명, 승강장번호, 상하행구분, 지상구분, 역층, 승강장연결 여부, 스크린도어 유무, 안전발판 유무의 데이터가 있습니다.승강장(乘降場)이란, 철도역, 정류장 따위에서 차에 타고 내리기 위해 만든 시설 혹은 장소를 말한다. 주로 역에서 열차를 타고 내리는 곳을 말한다.보통 승강장의 길이(승강장 유효장)는 열차의 길이 이상으로 지어진다. 다만 대구 도시철도 3호선처럼 승강장의 길이가 열차의 길이보다 짧은 경우도 있다. 이때는 일부 출입문만 열린다.지하역의 경우는 보통 지하 2~3층에 지어지고 지상 고가역은 보통 2~3층에 지어지며, 지상 노반역은 1층에 승강장이 지어지지만 역 깊이나 구조에 따라 많은 예외가 존재한다.승강장은 서울시 등 지방자치단체 조례의 역세권 측정 시 승강장 경계부터라는 기준으로 중요한 의미를 지닌다. 지하철의 경우, 지하에 있는 승강장의 위치를 알기 어려운 점으로 일부 주민들은 역의 출입구별로 역세권 측정 기준을 바꿔야 한다는 주장도 있으나 현행 제도는 아직 근접 승강장의 경계다.이는 많은 지하철역, 철도역과 대다수 환승역이 출입구로부터 승강장 간 거리가 길게는 수백m 떨어진 경우가 있어 측정 기준의 일관성과 형평성에 문제가 되기 때문이다.
