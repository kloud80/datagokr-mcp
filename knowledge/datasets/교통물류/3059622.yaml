summary_user: 군산시에 설치된 버스정보 안내기를 정류장 단위로 한 줄씩 담은 파일로, 정류장번호·정류장이름과 지번·도로명 주소, 위도·경도 좌표가 들어 있다. 시민이나 분석가가 '우리 동네 어느 정류장에 도착 안내 전광판이 있나', '안내기가 없는 정류장은 어디인가'를 확인할 때 쓴다. 전역 조인 키는 없으므로 정류장번호·정류장이름을 기준으로 군산시 버스정류장 원장이나 BIS 도착정보와 맞추고, 좌표로 지도나 다른 공간 데이터와 겹쳐 쓴다.
limits: 군산시 한 시군구 범위의 개별 위치 자료이며, 다른 데이터와 공통으로 쓰는 표준 코드가 없어 이름·번호 매핑이나 좌표 대조로만 연결된다. 실시간 도착 정보나 노선 정보는 들어 있지 않다.
