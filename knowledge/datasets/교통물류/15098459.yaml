summary_user: 세종특별자치시 안의 자동차관리사업장(정비업 등)을 사업장 한 곳당 한 행으로 담는 원천 목록으로, 영업 상태, 휴·폐업 일자, 상호, 주소, 등록 일자, 업종과 세부 업종을 담는다. 세종시 주민이나 사업자가 "우리 동네에서 지금 영업 중인 자동차 정비·관리 업체가 어디인가"를 찾거나, 분석가가 업종별 사업장 등록·폐업 추이를 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소나 상호를 맞춰서 연결해야 하며, 업종(induty) 값을 기준으로 다른 시도의 자동차관리사업자 현황과 이름을 맞춰 비교한다.
limits: 사업자번호 같은 공통 식별 키가 없어서 국세청이나 교통안전공단 자료와 바로 조인하지 못하고, 주소·상호 문자열로 매칭해야 한다. 범위가 세종시 한 곳이라 전국 비교에는 다른 시도 자료를 따로 모아야 한다.
