summary_user: 여수시 시민여객선 항로를 한 행씩 담은 소규모 파일(csv 약 930바이트)로, 항로별 출발·도착 기항지, 항로 구분, 터미널, 항로 거리(마일), 운영 여부, 연륙교 연결 여부, 기항지 이용료 부과 여부를 담는다. 도서 주민이나 여행객, 분석가가 '여수의 어느 섬이 다리 없이 여객선에만 의존하고, 그 항로는 얼마나 먼가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 기항지·터미널 이름을 맞춰 다른 여객선 운항·결항 데이터나 같은 기관 자료와 이어 써야 한다.
description_portal: 여수시 여객선 기항지명 및 항로거리 등 항로정보입니다.시민여객선 항로정보 공공데이터는 여객선 항로의 출발·도착 기항지, 항로 구분, 터미널 정보, 항로 거리, 운영 여부, 연륙교 연결 여부, 기항지 이용료 부과 여부 등의 정보를 제공합니다. 이 데이터는 도서 지역 주민의 이동권 보장과 해상교통 서비스 개선을 위한 기초자료로 활용될 수 있으며, 여객선 운항 노선 분석, 해양 관광 서비스 개발, 교통 접근성 평가, 지역 균형 발전 연구, 물류 및 해운 정책 수립 등 다양한 분야에서 활용 가치가 높습니다. 또한 연륙교 여부를 통해 교량으로 육지와 연결된 섬과 여객선 의존 지역을 구분할 수 있으며, 기항지 이용료 여부를 분석하여 항만 운영 정책이나 이용자 비용 부담 현황을 파악하는 데에도 활용할 수 있습니다.
