description_portal: 서울특별시 마포구의 옐로카펫 설치 현황입니다. 이 데이터에는 각 옐로카펫이 설치된  위치인 학교의 이름을 확인할 수 있습니다.또한, 설치일자와 재원 및 사업주체기관에 대한 정보도 함께 제공됩니다.그리고 가이드라인(색상,재질, 규격 및 형상, 설치절차)의 준수 여부도 포함되어 있습니다.이 데이터를 통해 주민과 보호자는 어린이 통학로에 설치된 옐로카펫의 위치를 쉽게 확인하고, 어린이 교통안전 확보에 대한 정보를 얻을 수 있으며, 행정기관은 옐로카펫의 분포 및 유지 상태를 관리하여 어린이 보호구역 개선 및 안전 정책 수립에 활용할 수 있습니다.
