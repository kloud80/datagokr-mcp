description_portal: 항공사업법 제48조에 따라 초경량비행장치사용사업을 경영하려는 자는 국토교통부령으로 정하는 바에 따라 신청서에 사업계획서와 그 밖에 국토교통부령으로 정하는 서류를 첨부하여 국토교통부장관에게 등록하여야 한다. 그 중 무인비행장치인 드론을 활용한 사용사업체는 한국교통안전공단에 서류를 제출해야하며, 드론원스톱민원서비스(drone.onestop.go.kr)를 통해 등록 할 수 있다. 해당자료는 2025년8월기준 운영중인 시도기준 사용사업체 수 현황자료이다. 사업체는 사업범위를 촬영,농업지원,측량,점검,관측,조종교육,기타 중에 선택할 수 있고, 중복선택이 가능하다.
