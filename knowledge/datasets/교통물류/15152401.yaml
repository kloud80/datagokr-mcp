summary_user: 대구 DRT(수요응답형 교통) 권역별 정류장의 위치를 정류장 한 곳당 한 행으로 담은 파일 데이터로, 권역·정류장명·좌표 X·좌표Y 네 항목에 110행이 있다. 교통약자나 시민이 DRT를 어느 권역 어디에서 탈 수 있는지 확인하거나, 분석가가 정류장 분포와 접근성을 살피는 데 쓴다. 좌표(coord) 키로 위치 기반의 다른 정류장·시설 데이터와 이어 쓰며, 그 밖의 코드표나 행정구역 코드 같은 조인 키는 없다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 교통약자 이동권 운영정보 데이터로, 대구지역 DRT(수요응답형 교통) 서비스의 권역별 정류장 위치정보를 제공합니다. 주요 항목은 권역 구분, 정류장 명칭, 위도·경도 좌표 등으로 구성되어 있으며, DRT 서비스의 운행 권역과 정류장 위치를 체계적으로 확인할 수 있도록 구성되어 있습니다. 본 자료는 교통약자를 비롯한 시민의 이동 편의성 향상과 대중교통 접근성 개선을 지원하며, DRT 노선 운영 분석, 경로 안내 서비스, 위치기반 서비스(LBS), 스마트 모빌리티 서비스 개발을 위한 기초자료로 활용될 수 있습니다. 또한 교통정책 수립, 교통 인프라 분석, 수요응답형 교통서비스 운영 효율성 평가 및 데이터 기반 교통서비스 개선을 위한 행정·연구 및 민간 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
