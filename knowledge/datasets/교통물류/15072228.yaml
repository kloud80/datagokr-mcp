summary_user: 교통카드 이용 기록을 분석해 대중교통 1회 이용(통행) 요금을 원/통행 단위로 평일·토요일·일요일별로 나눈 전국 단위 집계표이며, 383바이트짜리 작은 CSV 파일 하나로 제공된다. 분석가나 정책 담당자가 '주말에 대중교통 한 번 타는 데 평일보다 돈이 더 드는가'처럼 요일 유형별 통행당 요금 수준을 비교할 때 쓴다. 전역 조인 키가 없어 다른 교통카드 이용분석 자료와는 행 구분값(구분1)의 이름을 맞춰 연결하거나 같은 기관 자료끼리 나란히 놓고 비교한다.
description_portal: 한국교통안전공단에서 교통카드를 이용해 전국(서울특별시, 부산광역시, 대구광역시 등)의 데이터를 분석하여 추출한 대중교통 1회 이용인원 자료입니다.해당 데이터는 평일, 주말(토요일, 일요일)별로 세분화하여 제공하고 있습니다.단위는 원/통행 입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
