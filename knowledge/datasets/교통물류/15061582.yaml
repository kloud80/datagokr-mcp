summary_user: 대구 남구청이 단속한 불법 주정차 건을 위반일자·위반시간·위반장소명 단위로 한 건씩 담은 CSV 파일(약 12MB)이다. 주민이나 분석가가 남구 안에서 어느 장소·시간대에 불법 주정차 단속이 몰리는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 장소명 문자열 매칭이나 같은 기관(대구 남구) 자료끼리만 이어 쓴다.
description_portal: 대구광역시 남구청에서 수행한 불법 주정차 단속 현황에 관한 자료로, 위반일자, 위반시간, 위반장소명에 대한 데이터를 제공합니다.해당 데이터는 불법 주정차가 발생한 시점과 위치를 세부적으로 기록하여시민들이 불법 주정차 문제의 심각성을 인식하고, 이를 개선하기 위한 대책을 마련하는 데 도움을 줄 수 있습니다.또한, 교통 안전 및 질서 확립을 위한 정책 수립에 필요한 기초 자료를 제공하며, 단속 효율성을 높이기 위한 분석 및 개선 작업에 활용됩니다.이 데이터를 통해 대민 서비스의 투명성을 높이고, 교통환경을 개선하는 데 도움이 될 수 있습니다.
