description_portal: '데이터 개요사업 유형별로 등록된 경량항공기의 보유 현황을 확인할 수 있는 공공데이터입니다.해당 데이터는 국토교통부가 관리하는 경량항공기 등록 정보를 사업구분(자가용, 항공레저스포츠사업 등)과 항공기 종류별(타면조종형, 체중이동형, 경량헬리콥터, 자이로플레인, 동력패러슈트)로 나누어 제공하며, 항공레저산업 및 소형항공기 관련 정책 수립, 사업자 등록 분석, 경향 파악 등에 활용됩니다.데이터 제공 항목사업구분항공기 등록 목적에 따른 분류 (자가용, 항공레저스포츠사업 등)타면조종형고정익 날개 조종장치를 이용해 조종하는 항공기 등록 수체중이동형체중 중심 이동으로 조종하는 초경량항공기 등록 수경량헬리콥터회전익 방식으로 비행하는 경량형 헬리콥터 등록 수자이로플레인자이로스코프 방식의 비행장치 등록 수동력패러슈트동력 장치가 장착된 패러글라이더형 비행장치 등록 수계각 사업구분별 전체 등록 대수 합계활용 안내항공레저산업 시장 구조 분석 : 사업 목적에 따른 기종별 보급 현황을 통해 항공레저 인프라 발전 수준 및 수요 흐름을 파악할 수 있음항공안전 및 등록 정책 개선 자료 : 자가용 대비 사업용 경량항공기 보유 현황을 기반으로 등록 기준, 보험제도, 안전검사 항목 개편 가능지역별 항공산업 육성 자료로 활용 가능 : 동일 데이터를 지역 단위로 세분화하면 지방정부의 항공레저산업 육성 정책 근거 자료로 활용 가능데이터 해석 시 유의사항데이터는 사업구분별 집계 단위이므로 개별 등록기체 정보(제작사, 등록번호 등)는 별도 조회 필요동일 기종이 자가용과 사업용으로 중복 등록되지 않도록 구분 관리됨자이로플레인, 체중이동형 등 일부 항공기는 등록 수가 적어 통계적 유의성 확보에 주의 필요'
