summary_user: 서울교통공사가 운영하는 1~9호선 지하철역의 첫차·막차 시각을 역·방향(상행/내선, 하행/외선)·요일(평일, 토요일, 일요일/공휴일)별로 담는 시간표 조회 API입니다. 역 이용객이나 서비스 개발자가 '이 역에서 평일 하행 막차는 몇 시에 출발하고 어디까지 가는가' 같은 질문에 답할 때 쓰며, 분석용보다는 서비스용 조회 도구에 가깝습니다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 전철역코드(SUBW_CD)와 외부코드는 '서울교통공사_역명으로 지하철역 검색' 데이터와 같은 기관 코드로 맞춰 이어 씁니다.
