description_portal: 이 데이터는 택시운행정보관리시스템(TIMS) 기반 통계입니다.연간 지자체별 월별 영업대수, 영업횟수, 운행거리, 실차거리, 공차거리, 운행시간, 실차시간, 공차시간 합계 및 1대당 1일평균을 제공하며, 법인택시와 개인택시 모두 포함입니다.택시운행정보관리시스템은 택시운송사업의 발전에 관한 법률 제13조에 따라  주행거리, 속도, 위치정보(GPS), 분당 회전 수(RPM), 브레이크신호, 가속도 등 「교통안전법」 제55조제1항에 따른 운행기록장치에 기록된 정보와 승차일시, 승차거리, 영업거리, 요금정보 등 「자동차관리법」 제47조제1항에 따른 택시요금미터에 기록된 정보를 수집 관리합니다.
