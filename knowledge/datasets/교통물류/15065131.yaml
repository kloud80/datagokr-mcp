summary_user: 택시운행정보관리시스템(TIMS) 기반으로 지자체별·월별 택시 영업대수, 영업횟수, 운행·영업(실차)·공차 거리와 시간의 합계 및 1대당 1일평균을 담은 전국 집계 통계이며, 법인택시와 개인택시를 모두 포함한다. 지자체 교통 담당자나 분석가가 "우리 지역 택시의 공차 비율(공차거리·공차시간)은 다른 지자체나 이전 달에 비해 얼마나 높은가"처럼 택시 수급과 운행 효율을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지자체명(지자체명)과 연월을 이름 매핑해 연결해야 한다.
limits: 건별 운행기록이 아닌 지자체·월 단위 집계라 개별 차량·시간대·구간 분석에는 쓸 수 없다. 표준 행정코드 같은 조인 키가 없어 인구·대중교통 통계 등과 붙이려면 지자체명을 직접 코드에 매핑해야 하며, 비공간 데이터라 좌표 연결도 되지 않는다.
