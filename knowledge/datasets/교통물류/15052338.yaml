description_portal: 해당 건물정보는 서울교통공사의 청사, 차량기지 관련 건물 현황(건물명칭, 소재지, 대표지번, 건물연면적, 용도 등)으로 구성된 데이터입니다.청사와 차량기지 건물에 관한 정보를 담고 있으며, 관련 법령에 따라 서울교통공사의 도시철도 운영에 필수적인  건물에 해당합니다.*각 항목에 대한 설명건물명은 청사, 차량기지의 명칭을 의미합니다.소재지는 청사, 차량기지가 놓인 행정구역을 나타내며 관련 지번이 여러 개인 경우 대표지번을 기준으로 작성했습니다.연면적은 해당 건물의 연면적을 의미하며, 상세정보가 필요한 경우 비고에 작성하였습니다.
