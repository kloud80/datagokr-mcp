summary_user: 서울교통공사가 관리하는 1~8호선 지하철 환기구를 한 행에 하나씩 담은 시설물 목록으로, 호선·환기구 번호·위치 구간·용도와 환기·배기 기능, 지표면 높이(높이(m)), 구조물 형태, 필터 설치 여부를 담는다. 시설 관리자나 분석가가 "어느 호선 어느 구간에 필터 없는 환기구가 몇 개 있고 높이는 얼마인가" 같은 유지관리·안전 점검 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 호선명이나 구간(역 이름) 같은 이름 매핑으로만 이어 쓰며, 같은 기관의 역·시설 데이터와 맞춰 보는 방식이 현실적이다.
limits: 역 코드나 좌표 같은 공통 키가 없어 다른 데이터와 자동으로 결합되지 않고, 구간 이름을 직접 맞춰야 한다. 범위가 '전국·비공간'으로 분류돼 있으나 실제 내용은 서울교통공사 1~8호선 환기구에 한정되며 위치 좌표는 없다.
