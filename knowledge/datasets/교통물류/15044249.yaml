summary_user: 서울교통공사 관할 지하철역의 월별 승하차인원을 호선·역번호·역명·수송연월 단위로 담은 집계 파일이며, 인원은 개표·집표 태그 횟수 기준으로 센다. 상권 분석가나 창업자가 '이 역 주변 유동인구가 몇 달 사이 얼마나 늘었나'를 가늠하는 대체 지표로 쓴다. 전역 공통 조인 키는 없어 고유역번호(외부역코드)나 역명을 다른 역 정보·시간대별 승하차 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 서울교통공사의 월별 승하차인원 데이터입니다. 해당 데이터는 연번, 호선, 역번호, 역명,  월별 승하차 인원 데이터로 구성되어 있습니다. 연단위 데이터로 2025년 12월 기준 파일까지 업로드 합니다.통상적으로, 승하차인원은 승차인원과 하차인원의 합으로 나타납니다. 승차인원은 해당 역에 개표하고 들어간 인원을 말하며, 하차인원은 해당 역을 집표하고 나온 인원을 말합니다. 실질적인 인원의 개념은 한 사람이 태그 한 횟수로 간주하고 있습니다. 또한 서울교통공사 1호선 구간의 경우에는 서울역부터 청량리 구간이며 나머지 구간은 한국철도공사 관할입니다.
