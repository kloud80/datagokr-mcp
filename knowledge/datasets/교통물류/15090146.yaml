summary_user: 광양항에서 한 달 동안 컨테이너 차량이 하루에 몇 대 이동했는지와 평균 소요시간(분)을 일자별로 집계한 통계로, 634바이트 크기의 CSV 파일 하나로 제공된다. 항만 운영 분석가나 교통관리 담당자가 "광양항에서 컨테이너 차량이 몰리는 날에 처리 시간이 얼마나 늘어나는가"를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 항만 물동량·반출입 통계와는 일자(일자) 기준으로 맞추거나 같은 기관 자료와 이름을 대조해 이어 써야 한다.
description_portal: 본 데이터는 한 달간 광양항에서 컨테이너 차량의 일자별 이동 대수 및 평균 소요 시간을 기록한 통계입니다. 차량 이동량과 평균 운송시간을 통해 일별 물류 흐름의 밀집도, 혼잡도, 처리 속도를 파악할 수 있으며, 항만 운영 효율성 분석과 교통관리 정책 수립에 유용한 기초자료로 활용됩니다.
