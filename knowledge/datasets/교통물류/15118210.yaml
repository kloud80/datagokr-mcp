summary_user: 병점역(1호선) 주변 정류장을 대상으로 2023년 6월 1일~5일의 교통카드 승하차를 정류장·노선·날짜·이용자유형(일반·어린이·청소년 등)별로 04시~23시 시간대마다 집계한 샘플 CSV 파일입니다. 교통 분석가나 지자체 담당자가 '병점역 주변 버스 정류장은 출근 시간대 몇 시에 승차가 몰리고, 어린이·청소년 이용은 어느 노선에 많은가'를 확인하는 데 쓴다. 정류장 ID 같은 전역 조인 키가 없어서, 정류장·노선 원장이나 실시간 도착 정보와는 정류장명·노선 이름을 맞춰서만 이어 쓴다.
description_portal: '"교통카드 데이터 이용량(샘플)"은 한국교통안전공단의 교통카드빅데이터 통합정보시스템에서 추출한 자료로, 병점역(1호선)을 중심으로 2023년 6월 1일부터 5일까지의 교통카드 이용자별 시간대별 승하차 통계를 집계한 것 입니다. 해당 데이터는 정류장명, 노선, 기종점, 날짜, 이용자 유형(일반, 어린이, 청소년 등), 시간대별 승하차 이용량으로 구성되어 있으며, 대중교통 혼잡도 진단, 노선 및 배차 최적화, 교통약자 이용 편의 분석 등 다양한 분야에서 활용할 수 있습니다. 이와 같은 정류장별 이용량을 포함하여 지역별, 주제별로 더욱 다양한 대중교통 이용 분석 자료는 공공데이터 포털과 교통카드빅데이터 통합정보시스템을 통해 확인하실 수 있습니다.'
