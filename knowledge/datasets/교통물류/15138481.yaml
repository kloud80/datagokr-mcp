summary_user: 파주시 버스정보시스템(BIS)이 관리하는 마을버스 정류장을 정류장 한 곳당 한 행으로 담은 원천 목록으로, 시도코드·모바일번호(정류장 식별 번호)와 로컬·세계측지계 좌표, 중앙차선 여부를 포함한다. 분석가나 서비스 개발자가 '파주시 마을버스 정류장은 어디에 분포하고 우리 동네에서 걸어서 닿는 정류장은 어디인가' 같은 접근성 질문을 지도로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노선·도착 데이터와는 모바일번호나 정류장 이름 매핑, 같은 기관 코드로만 잇고, 위치 기반 결합은 세계측지계 좌표로 공간 조인한다.
description_portal: 경기도 파주시 버스정보시스템(BIS)에서 관리 중인 마을버스정류장정보에 대한 공공데이터로, 각 정류장의 행정구역 코드 및 식별자인 시도코드,모바일번호, 로컬 및 GRS 기반의 좌표 정보인 로컬Y좌표, 로컬X좌표, GRS_Y좌표, GRS_X좌표, 정류장의 도로상 위치 특성인 중앙차선유무 등으로 구성되어 있습니다. 이 데이터는 위치 기반 서비스 개발, GIS 기반의 위치 시각화, 교통 흐름 분석, 대중교통 접근성 연구, 대중교통 정보 시스템 개발, 정류장 최적화 및 교통 정책 수립, 노선 설계나 안전성 분석, 실시간 대중교통 연동 및 개인 맞춤형 이동 서비스 등에 활용될 수 있습니다.
