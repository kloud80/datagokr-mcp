description_portal: '*본 데이터는 특정 알고리즘을 이용하여 생성한 모의 합성 데이터이므로 데이터 활용 시 주의 바랍니다본 데이터는 한국도로교통공단이 제공하는 개인형 이동장치 관련 교통사고의 분포와 구조를 반영해 생성한 합성 레코드로 구성되어 있다. 원자료의 통계적 특성을 모사하되 개인 식별정보는 제거되며 실제 사고와 일대일 대응하지 않는다. 포함 항목은 사고유형, 법규위반, 도로유형, 시간대, 요일, 기상, 연령대, 주행상태, 위치 격자 등이다. 이 데이터는 전동킥보드 등 PM 사고의 위험요인 탐색, 고위험 시간·공간 식별, 정책 효과 분석, 안전교육 콘텐츠 개발, 모델 학습·검증과 테스트에 활용된다.'
