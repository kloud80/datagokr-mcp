summary_user: 서울시 공공자전거 따릉이의 대여 건수와 반납 건수를 날짜별·자치구별로 집계한 통계 파일로, 건별 이용 기록이 아닌 자치구 단위 합계를 담는다. 시 교통 담당자나 분석가가 '어느 자치구에서 대여보다 반납이 많아 자전거가 쌓이는가'처럼 자치구별 이용 규모와 대여·반납 불균형을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와 붙일 때는 자치구 이름(자치구_명칭)이나 서울시 자체 자치구 코드를 맞춰 날씨·인구·대여소 현황 데이터와 연결한다.
description_portal: 서울시 공공자전거 ‘따릉이’의 일별 이용 현황을 자치구 단위로 구분하여, 대여 건수와 반납 건수를 집계한 통계 데이터입니다. 이 데이터는 시간 흐름에 따른 지역별 이용 규모 차이, 출·퇴근형 이동 집중 지역, 상업·관광지 중심 이용 패턴, 특정 날짜·이벤트·날씨 요인에 따른 변동 등 도시 모빌리티 이용 행태 분석에 중요한 기초자료입니다. 각 자치구별 대여·반납 데이터는 균형적 운영 여부, 이용 수요 대비 대여소 분포, 인프라 부족 지역 탐색, 자전거 도로 확충 우선 정책 등 실질적인 정책 수립에 활용할 수 있습니다.이 데이터는 날씨, 요일, 시간대, 인구 비율, 상권 특성, 관광지 분포 등 외부 데이터와 융합했을 때 예측 모델링 및 도시 계획 의사결정을 위한 수요 예측, 안전사고 위험도 평가, 자전거 인프라 최적화, 도시형 마이크로 모빌리티 전략 수립에 활용도가 높습니다. 또한 지역별 특성을 반영한 스마트 시티 모빌리티 운영, 공유 자전거 공급조절, 이용률 격차 해소 전략 마련에도 기여할 수 있습니다.
