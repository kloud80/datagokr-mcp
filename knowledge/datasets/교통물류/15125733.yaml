summary_user: 한국철도공사의 간선 여객열차·광역 여객열차·화물열차 수송실적을 운행일자와 역·주운행선별로 담은 집계 데이터로, 여객은 승차·하차 인원, 화물은 품목별 발송톤과 연톤키로를 담는다(전국, API 전체 178,691건, 관측 기간 2025-12-17~2026-09-26). 분석가가 특정 역의 일별 승하차 인원을 유동인구 대체 지표로 보거나, 어느 역에서 어떤 품목 화물이 얼마나 발송되는지 파악하는 데 쓴다. 역코드와 도착역코드(stn_cd, arvl_stn_cd)가 교통 노드 키로 실측되어 역·시설 정보나 다른 철도 승하차 데이터와 이어 쓰며, 주운행선·역·품목 분류 코드는 같은 기관의 코드정보 API 코드표로 풀어 쓴다.
