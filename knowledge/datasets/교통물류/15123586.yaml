summary_user: 서울교통공사가 운영하는 도시철도 1~8호선의 열차 지연을 지연일자·노선·지연 시간대·최대 지연시간(분) 단위로 한 건씩 담은 파일로, 포털 설명상 2024년 9월 1일부터 2025년 8월 30일까지 승객이 발급받은 지연증명서 입력 내역을 바탕으로 한다. 시민이나 교통 분석가가 "어느 호선이 어느 시간대에 자주, 얼마나 길게 지연되는가"를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명이나 날짜를 기준으로 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 본 데이터는 서울교통공사에서 운영하는 도시철도 1~8호선의 열차 지연 현황을 정리한 자료로, 2024년 9월 1일부터 2025년 8월 30일까지의 연간 데이터를 포함합니다. 각 항목은 연번, 지연일자, 해당 노선, 지연이 발생한 시간대, 최대 지연시간(분 단위)으로 구성되어 있으며, 실제로 승객이 요청 시 발급받는 지연증명서의 입력 내역을 기반으로 수집된 자료입니다. 이 데이터는 열차 지연의 발생 추이를 분석하거나, 특정 시간대 및 노선별 운행 안정성을 평가하는 데 활용할 수 있으며, 대중교통 서비스 개선, 시민 편의 증진, 정책 수립 등 다양한 목적에 유용한 기반자료로 활용될 수 있습니다. 주기적 공공데이터 제공 요청에 따라 2025년 8월 30일까지 제공됩니다.
