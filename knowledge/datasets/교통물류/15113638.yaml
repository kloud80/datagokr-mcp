summary_user: 교통카드 데이터를 바탕으로 서울 지하철의 기준일자별 승차 호선·역에서 하차 호선·역까지의 승객 수를 담는 OD 집계 데이터로, 총 승객수와 일반·어린이·청소년·대학생·경로·장애인 등 권종별 승객수를 함께 담는다. 분석가나 사업자가 '특정 역에서 탄 승객은 주로 어느 역에서 내리는가'처럼 역 간 통행 흐름과 상권 배후지를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 역 데이터와는 호선·역 이름을 매핑해서만 이어 쓸 수 있다.
description_portal: 해당 데이터는 교통카드 데이터를 기반으로 수집된 서울시 지하철 역별 OD 데이터입니다. 데이터는 기준일자,승차_호선,승차_역,하차_호선,하차_역,총_승객수,일반_승객수,어린이_승객수,청소년_승객수,대학생_승객수,경로_승객수,장애인_승객수,국가유공자_승객수,직원_승객수,외국인경로_승객수 등으로 구성됩니다. 현재 파일은 샘플 데이터입니다. 데이터 용량 초과 문제로 인해 자료 요청 시, 전자메일 이용하여 전달드립니다. 원하시는 기간을 명시하여 별도 요청바랍니다. 데이터의 제공부서는 교통실 미래첨단교통과입니다.
