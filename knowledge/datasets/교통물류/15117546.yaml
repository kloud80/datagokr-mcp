summary_user: 한국가스공사가 「수소 튜브트레일러 지원사업」으로 보유·임대 중인 수소 튜브트레일러를 임차사(익명 처리)별로 소재지, 임차 대수, 해당 임차사가 공급하는 충전소 개소 수와 함께 담은 소규모 현황 파일(CSV 384바이트)이다. 지역별로 수소 운송용 튜브트레일러가 어느 정도 배치돼 있고 몇 개 충전소에 수소를 공급하는지 확인하려는 수소 유통·충전 인프라 분석가나 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 임차사 소재지(시도·시군구 이름)를 기준으로 수소충전소 현황 등과 이름 매칭해 이어 쓴다.
description_portal: '□ 우리공사는 수소유통전담기관으로 수소 운송비용 절감을 통한 수소 가격인하 및 수급안정에 기여하기 위해 「수소 튜브트레일러 지원사업」을 시행하고 있음□ "23. 7월 현재 우리공사는 총 96대의 수소 튜브트레일러를 보유·임대*("23. 7. 18. 기준 100% 임대)하고 있으며, 지속적인 수소차 보급 확대와 수소충전소 증가**로 지원사업 확대를 계획하고 있음    * "21년 : 16대, "22년 : 80대, "23년 26대(예정)   ** 수소차 보급계획(누적) : "22년 29,733대, "23년 46,653대, "30년 880,000대        수소충전기 보급계획(누적) : "22년 229기, "23년 320기, "30년 660기□ 따라서, 우리공사가 보유·임대하고 있는 수소 튜브트레일러의 임대현황을 공개하여 국민의 이용권 보장 및 삶의 질 향상 도모 필요'
