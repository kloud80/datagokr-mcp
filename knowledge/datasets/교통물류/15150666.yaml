summary_user: 국가교통정보센터가 제공하는 우회로 구간 정보를 구간 단위로 담은 전국 기본 데이터로, 구간 상세정보·구간 길이·시작·끝 좌표와 최소·최대 좌표 범위, 서비스 여부·예측 여부 등을 포함한다. 교통 정보 서비스 개발자나 분석가가 사고·통제 시 어느 우회로 구간을 안내할지, 그 구간의 위치와 길이가 얼마인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 우회로 식별자(RNBT_ID)·좌표 등을 이름·코드 매핑으로 맞추거나 같은 기관의 공통기반 데이터와 연결해 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
