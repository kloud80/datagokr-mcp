summary_user: 경상북도 영덕군에 등록된 자동차 대수를 차종(승용·승합·화물·특수)과 용도(사업용·비사업용)별로 나누고, 연료유형(휘발유·경유·LPG·CNG·수소·전기·하이브리드·기타)별 대수를 열로 담은 시군구 단위 집계 파일이다(csv 597바이트 규모). 영덕군의 전기·수소차 보급 수준이나 사업용 화물차 비중을 알고 싶은 지자체 담당자·분석가가 연료 전환 현황을 확인하는 데 쓴다. 전역 조인 키나 행정코드 열은 없어서, 다른 시군구 자료와는 시도·시군구 이름과 데이터기준일자를 맞춰 이어 붙인다.
description_portal: 이 데이터는 데이터기준일자 기준 경상북도 영덕군의 차종별(승용차, 승합차, 화물차, 특수차), 용도별(사업용, 비사업용), 연료유형별(휘발유, 경유, 엘피지, 씨엔지, 수소, 전기, 하이브리드, 기타) 자동차 등록 대수 정보를 제공합니다.국토교통 통계누리(https://stat.molit.go.kr/portal/cate/statView.do?hRsId=58&hFormId=5498&hDivEng=&month_yn=)에서는 최신 자료를 포함한 기간별로 전국자치단체의 정보를 확인할 수 있습니다. 또한 화물차의 경우 최대 적재량별로, 전체 차량에 대해서는 규모별(경형, 소형, 중형, 대형)로 세분화된 등록 현황 정보를 제공합니다.
