summary_user: 경찰청이 제공하는 교통안전 위험요소 중 도로환경별 기상(눈) 항목을 지점 단위로 담은 전국 데이터로, 위험요소 식별번호·대중소 분류 코드·지번/도로명 주소·위경도·관련 링크 ID·기준일자·상세내용 등을 건별로 제공한다. 운전자나 지자체·교통 분석가가 '눈이 올 때 사고 위험이 큰 도로 지점이 어디인가'를 확인하거나 겨울철 위험 구간을 지도에 표시하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·위경도나 관련 링크 ID(RLTN_LNK_ID) 같은 이름·좌표 매핑으로 이어 써야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-도로환경별 데이터는 경찰청에서 제공하는 정보입니다.
