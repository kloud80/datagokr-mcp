summary_user: 대구광역시 북구청이 관리하는 공유재산 중 건물(구청·행정복지센터 청사, 경로당, 청소년회관 등)과 주차장을 재산 한 건당 한 행으로 담은 현황 파일로, 구분·재산명·소재지 주소·면적(제곱미터)·재산관리부서·데이터기준일자를 제공한다. 북구 주민이나 분석가가 '북구 관내 구 소유 주차장과 공공건물은 어디에 있고 면적은 얼마인지, 어느 부서가 관리하는지' 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 재산명으로 맞춰 이어야 하며, 주차장 요금·면수·좌표는 전국주차장정보표준데이터와 주소·이름 매칭으로 보완한다.
description_portal: 본 데이터는 대구광역시 북구청이 행정 목적으로 사용하거나 시민의 편의를 위해 운영하고 있는 공유재산(건물 및 주차장)의 현황 정보입니다.대구광역시 북구 관내에 위치한 구청 및 동 행정복지센터 청사, 경로당 및 청소년회관 등과 같은 건물 정보와 주차장 정보를 담고 있습니다.각 항목을 통해 재산의 종류(구분), 재산 명칭과 상세 소재지 주소 및 면적 정보를 확인할 수 있으며, 해당 재산을 관리하고 있는 대구광역시 북구청의 담당부서와 데이터 기준일자를 제공합니다.본 자료는 2026년 4월 30일 기준으로 작성되었습니다.
