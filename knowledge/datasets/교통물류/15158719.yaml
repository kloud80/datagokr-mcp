summary_user: 여수광양항만공사 관할 항만에서 선박이 시설을 사용한 내역을 건별로 담으며, 항만명·호출부호·선박명·대리점·외항/내항 구분·요청 시설과 배정 시설·사용 시작/종료일을 포함한다. 해운대리점이나 항만 운영 분석가가 특정 선박이 어느 부두·선석을 요청했고 실제로 어디에 언제까지 배정받았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 호출부호·항만코드·일련번호를 다른 입출항 데이터에서 받아 넘기는 방식으로 잇고, 항만코드는 UN/LOCODE와 해수부 내부 코드가 섞여 있어 매핑표가 필요하다.
description_portal: 「항만시설이용정보」 데이터는 선박의 항만 시설 사용 내역을 기록한 자료로, 항만명(PRT_NM), 선박 호출부호(CALL_LETTER), 선박명(VSSL_NM), 연도(YR), 일련번호(SER_NO), 대리점(AGENT_NM), 외항·내항 구분(OC_CT_NM), 요청 시설 코드 및 명(REP_FAC_CODE, REQ_FACIL_NM), 배정 시설 코드 및 명(ALLOT_FAC_CODE, ALLOT_FACIL_NM), 시설 사용 시작·종료일(USE_SCR_DT_FR, USE_SCR_DT_TO) 등이 포함되어 있습니다.이 데이터는 선박별 항만 시설 사용 현황을 추적할 수 있는 중요한 자료로, 부두 배정 관리, 시설 이용 내역 확인, 항만 자원 운영 효율성 평가 등에 활용됩니다. 특히 요청 시설과 배정 시설 정보는 항만 운영의 수요와 공급 매칭 과정을 보여주며, 향후 항만 인프라 확충 계획이나 시설 배치 최적화에도 기초 자료가 됩니다.
