limits: 표준 역 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 역명 매칭이나 좌표 근접 비교가 필요하다. 9호선 2·3단계 구간 역사만 담으므로 다른 호선·구간의 화장실은 별도 데이터로 찾아야 한다.
