services:
  - op: /getHarborFcltyCode
    name: 인천항 항만 시설 코드
    endpoint: https://apis.data.go.kr/B551504/ipaCode/getHarborFcltyCode
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: pageNo
        required: true
        desc: 페이지 번호
      - name: prtAtCode
        required: true
        desc: 항코드
      - name: facCode
        required: true
        desc: 시설제원코드
      - name: facKorNm
        required: true
        desc: 시설제원명(한글명)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getShipagentCode
    name: 인천항 선사 코드
    endpoint: https://apis.data.go.kr/B551504/ipaCode/getShipagentCode
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: shipperId
        required: false
        desc: 선사ID
      - name: shipperNm
        required: false
        desc: 선사명
      - name: endRow
        required: true
        desc: 총 조회 수
      - name: skipRow
        required: true
        desc: 조회시작 번호
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
