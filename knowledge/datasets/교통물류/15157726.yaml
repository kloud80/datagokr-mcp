summary_user: 인천항의 항만 시설을 항코드·시설코드 단위로 조회하는 API로, 시설별 접안 가능 척수, 수심 범위, 시설 제원 길이와 부속 코드 같은 시설 인프라 정보를 담는다. 선사·물류 분석가가 인천항의 특정 부두나 선석에 몇 척이 접안할 수 있고 수심이 얼마인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 항만코드(항코드)를 매개로 입출항·물류 데이터와 잇되 UN/LOCODE와 해수부 내부 코드가 섞여 있어 매핑표가 필요하다.
description_portal: 해당 Open API는 인천항의 항만 시설에 대한 코드 정보를 조회할 수 있는 API로, 항코드(prtAtCode), 시설코드(facCode), 시설제원명(facKorNm) 등을 파라미터로 활용해 항만별 접안 가능 척수, 수심 정보, 시설제원 길이, 시설제원 부속 코드 등을 확인할 수 있습니다. 응답 데이터에는 전체 결과 수, 접안가능 척수, 수심(FR, TO), 시설 제원, 접안시설 수용 능력 등 다양한 시설 인프라 정보를 포함하고 있어 항만 시설의 활용도 분석, 항만 운영계획 수립, 항만 인프라 개선 정책 등의 기초자료로 유용하게 사용횝니다. 특히 물류 효율성 분석, 선박 접안 계획, 시설 확충 필요성 진단 등 해운 물류 정책 수립 시 활용도가 높은 구조화된 데이터입니다.
team:
