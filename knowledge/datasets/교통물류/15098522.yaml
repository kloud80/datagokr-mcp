summary_user: 전국 고속버스의 터미널·등급·도시코드 목록과 출발·도착 터미널 간 배차·요금 정보를 조회하는 API이며, 검증 때 전체 건수 453, 수신 1,561행이 확인됐다. 승객이나 서비스 개발자가 특정 출발지에서 도착지로 가는 고속버스의 출발·도착 시간, 등급, 요금을 알아보는 데 쓴다. 출발·도착 터미널 ID(terminalId)는 이 API의 터미널 목록에서 먼저 받아 운행정보 조회에 넘기며, 도시코드(cityCode)와 등급코드(gradeId)도 같은 기관 코드로 이어 쓰지만 다른 데이터와 잇는 전역 조인 키는 없다.
description_portal: 운영중인 전국 고속버스의 배차정보, 차량정보, 요금정보를 제공하는 서비스 입니다.고속버스 정보서비스는 고속버스 등급, 고속버스 터미널 목록, 도시코드 목록을 조회할수 있으며,  조회된 정보를 활용하여 출발/도착 터미널 ID를 통해 고속버스의 운행정보를 조회할수 있습니다. 제공되는 고속버스 정보에는 출발 터미널명, 도착 터미널명, 출발시간, 도착시간, 고속버스 등급, 노선ID, 요금정보가 제공됩니다.한번에 출력되는 데이터 목록수를 설정할수 있으며, 페이지 번호를 설정하여 전체 데이터를 분할하여 호출이 가능합니다.데이터 활용 추가 문의사항은 TAGO 운영팀(054-459-7870)으로 문의 바랍니다.
