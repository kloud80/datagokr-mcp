summary_user: 고속도로 휴게소별로 장애인 전용 주차구역, 점자블록, 임산부·노약자용 휴게시설 설치 여부를 본부·휴게소명과 함께 담은 전국 단위 현황표(약 7.8KB CSV 파일)이다. 휠체어 이용자나 임산부 동반 운전자가 "이 노선 휴게소 중 장애인 주차구역과 점자블록이 갖춰진 곳은 어디인가"를 확인하거나, 분석가가 본부별 교통약자 편의시설 설치 실태를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 휴게소 데이터(위치·편의시설 등)와는 휴게소명을 이름으로 맞춰 연결해야 한다.
