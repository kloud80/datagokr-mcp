summary_user: 부산교통공사가 운영하는 도시철도 노선의 역별 장애인 화장실 위치를 한 행씩 담은 파일 데이터로, 운영기관명·노선명·역명과 함께 역층, 개찰구 안팎(게이트내외), 가까운 출구번호, 상세위치, 화장실 구분을 담는다(csv 약 19KB). 휠체어 이용자나 보호자가 '이 역에서 장애인 화장실이 개찰구 안에 있는지, 몇 번 출구 쪽 어느 층에 있는지'를 미리 확인하거나, 분석가가 역별 장애인 화장실 설치 현황을 점검하는 데 쓴다. 공통 역 코드 같은 전역 조인 키가 없어, 다른 역 시설·승강기·역 위치 데이터와는 노선명·역명을 이름 매칭해 이어 쓴다.
