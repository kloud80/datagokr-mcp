summary_user: 2025년 4월 7일 기준 전국에 등록된 전기자동차 대수를 시군구별로 묶어 차종(승용·승합·화물·특수)과 용도(사업용·비사업용)로 나눈 집계표이며, 건별 차량 원장은 아니다. 지자체 담당자나 분석가가 "우리 시군구에 사업용 전기 화물차가 몇 대 등록돼 있나"처럼 지역별 전기차 보급 규모와 용도 구성을 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구 이름을 행정구역 코드표에 맞춰 매핑해야 이어 쓸 수 있다. 이렇게 맞춘 뒤 충전소 현황이나 인구 같은 시군구 단위 데이터와 함께 본다.
