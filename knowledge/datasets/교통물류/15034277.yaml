summary_user: 한국철도기술연구원 도서관이 소장한 철도 분야 전문 도서를 한 권(등록번호) 단위로 담은 서지 목록 파일로, 제어번호·청구기호·서명·저자·출판사·출판년도를 담는다. 연구자나 철도 실무자가 "특정 주제나 저자의 철도 기술 도서를 연구원 도서관에서 열람·대출할 수 있는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 서명·저자·출판사 같은 이름 매칭으로만 연결한다.
description_portal: 한국철도기술연구원_철도분야 도서 목록 정보는 한국철도기술연구원 도서관에서 소장하고 있는 철도 관련 전문 도서의 상세 목록을 제공합니다. 해당 목록은 연구자와 실무자, 관련 분야 종사자들이 필요한 자료를 보다 쉽게 찾을 수 있도록 정리되어 있습니다. 엑셀 파일에는 등록번호, 청구기호, 서명, 저자, 출판사, 출판년도 등 기본적인 서지 정보가 체계적으로 수록되어 있어 자료 검색, 분류 및 관리에 용이합니다. 관심 있는 도서가 있을 경우 목록을 확인한 후 도서관을 방문하여 직접 열람하거나 대출 가능 여부를 문의하여 이용하실 수 있습니다.
