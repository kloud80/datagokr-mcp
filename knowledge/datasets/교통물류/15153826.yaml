summary_user: 경기도 파주시 지능형교통체계(ITS)의 노드(교차로 등 지점)를 한 줄에 하나씩 담은 파일로, 노드아이디·노드명·노드유형·회전제한 유무와 위도·경도, 시군구 행정구역 정보를 포함한다. 파주시 교통 분석가나 연구자가 '파주시 교차로 중 회전제한이 있는 지점은 어디이고 어떤 유형인가'를 지도에서 확인하거나 경로탐색·교통 시뮬레이션의 지점 기준으로 쓴다. 실측상 전역 조인 키는 확인되지 않아 노드아이디·노드명이나 시군구코드로 표준노드링크 등 다른 교통 데이터와 매핑해야 하며, 위도·경도로 공간 결합한다.
description_portal: 경기도 파주시 지능형교통체계(ITS) 운영을 위해 노드가 위치한 시도명·시군구명·시군구코드 등의 행정구역정보, 좌표기반 분석과 경로탐색 연구 등에 활용될 수 있는 위도와 경도 좌표 값, 각 지점의 교통운영 특성을 파악할 수 있는 회전제한 유무와 노드유형코드 및 노드유형명, 고유식별 정보인 노드명, 노드아이디 등으로 구성되어 있습니다. 본 데이터셋은 실시간 내비게이션 경로 설계, 교차로별 혼잡도 분석을 통한 최적 경로 추천 알고리즘 개발, 회전제한유무와 노드유형을 활용한 교차로 안전성 평가, 교통 신호 제어, 차량 흐름 시뮬레이션, 자율주행차 경로 실험, 도시 계획 및 정책 수립 등에 활용될 수 있습니다.
