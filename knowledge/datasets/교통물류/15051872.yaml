summary_user: 서울시 공공자전거 '따릉이'의 이용 실적을 대여일자·대여시간대·대여소별로 묶어 담은 데이터로, 정기권 여부·성별·연령대별 이용건수와 운동량·탄소량·이동거리·이동시간을 함께 제공합니다. 교통 분석가나 자치구 담당자가 '어느 대여소에서 출퇴근 시간대에 어떤 연령층이 가장 많이 빌리는가'처럼 시간대별 수요를 파악해 자전거 재배치나 대여소 확충을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 대여소번호(RENT_ID)나 대여소명을 매개로 서울시 대여소 목록·실시간 잔여 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: '서울특별시 공공자전거 시간대별 이용정보입니다. 대여일시, 대여시간, 대여소번호, 대여소명, 정기권유무, 성별, 연령대, 탄소량, 이동거리, 이동시간 정보를 제공합니다.*용어설명공공자전거 서비스 ‘따릉이’는 시민·방문객 누구나 앱 또는 교통카드로 저렴하게 대여·반납할 수 있는 무인 공유자전거운영 지역: 서울 전역(주요 지하철역, 상업지, 주거지 중심으로 대여소 설치)운영 시간: 24시간(기상악화, 점검 시 일부 대여소 일시 중단 가능)제공부서는 서울특별시 교통실 교통운영관 보행자전거과(02-2133-2434) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
