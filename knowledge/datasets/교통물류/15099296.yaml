summary_user: 전주시 관내 운수회사별로 2020년부터 2025년까지 연도별 수소버스 도입 대수를 담은 집계 파일이며, 운수회사 한 곳이 한 행이고 연도가 열로 펼쳐진 작은 표(CSV 335바이트)다. 전주시 버스 정책 담당자나 연구자가 '어느 운수회사에 수소버스가 언제 몇 대씩 배정됐나'를 확인하고 친환경 버스 전환 추이나 충전 인프라 수요를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 운수회사 이름을 맞춰 붙여야 하며, 전주시 버스 노선·차량 현황 같은 같은 기관 자료와 회사명 기준으로 이어 쓴다.
description_portal: '전북특별자치도 전주시 내 운수회사별 2020년부터 현재까지 연도별 수소버스 도입 및 배정 현황을 제공하는 데이터입니다. 이 데이터는 전주시 관내 운수회사의 친환경 차량(수소버스) 도입 추이를 파악하고, 탄소중립 교통체계 구축, 수소경제 확산, 대기환경 개선  등 지역 정책 수립과 연구ㆍ분석을 위한 기초자료로 활용할 수 있습니다. 또한 수소버스 보급 현황 분석, 충전 인프라 수요 예측, 교통 에너지 전환 전략 수립 등 다양한 목적으로 참고할 수 있는 유용한 데이터입니다.데이터항목 : 운수회사, 수소버스 도입 차량 수(2020년~), 데이터 기준일자데이터 제공부서 :  버스정책과'
