description_portal: '이 데이터는 한국철도공사가 제공하는 ‘연도별 건설 수송실적(톤-키로)’ 자료로, 연도별로 건설 관련 화물(예: 무연탄, 유류 등)이 철도를 통해 실제로 수송된 총 실적을 “톤-키로”(ton-km) 단위로 집계한 것입니다. 여기서 ‘톤-키로’란 수송된 화물의 무게(톤)에 이동한 거리(킬로미터)를 곱한 값으로, 수송량과 수송거리를 모두 반영하는 대표적 물류 성과 지표입니다. 본 데이터는 철도 교통 및 물류 분야 정책 수립, 수송현황 진단, 연구 등에 활용할 수 있도록 CSV, XML, JSON 등 여러 형태로 무료 제공됩니다.이 자료를 통해 확인하거나 유추할 수 있는 주요 인사이트로는 다음과 같은 내용이 있습니다. 첫째, 연도별로 건설 관련 화물의 철도 수송 규모가 얼마나 변동해왔는지를 확인할 수 있어, 경제 상황이나 산업·인프라 개발 활성화 정도, 대규모 국책사업 또는 에너지 수요 변화에 따른 실제 화물 흐름을 객관적으로 파악할 수 있습니다. 둘째, 특정 연도 큰 폭의 증감이 있을 경우 그 시기 주요 건설 프로젝트나 경기 변화의 영향을 진단할 수 있습니다. 셋째, 수송실적 추이는 대체 운송수단(도로, 해상 등)과 비교 분석 시 철도화물 시장의 위치와 비중 변화, 정책효과 등도 간접적으로 평가할 수 있습니다.참고자료로 활용될 수 있는 분야는 매우 다양합니다. 정부나 지자체의 철도 및 물류 정책 수립·성과 평가, 대형 인프라 사업 타당성 검토, 에너지·유류 공급망 연구, 철도 기반 건설·화물 사업의 신규 진출 전략 수립, 민간물류기업의 시장·경쟁 환경 분석, 학술연구 및 통계보고서 작성, 각종 공공 교통·물류 행정업무의 기초자료 등에서 폭넓게 참고 또는 근거로 활용됩니다.'
