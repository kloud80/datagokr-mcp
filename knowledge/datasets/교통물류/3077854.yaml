summary_user: 서울 용산구 공영주차장을 주차장 한 곳당 한 행으로 담은 파일로, 도로명·지번 주소와 위도·경도, 주차구획수, 요일별 운영시간, 기본·추가 요금, 월정기권 요금, 결제방법, 관리기관 연락처를 포함한다(약 8KB CSV). 용산구 주민이나 방문객이 '근처 공영주차장의 평일·주말 운영시간과 기본요금은 얼마인가'를 확인하거나, 분석가가 구내 공영주차 공급과 요금 수준을 지도에 올려 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주차장명·주소 매칭이나 위도·경도 좌표로 공간 결합해 이어 쓰며, 전국주차장정보표준데이터를 원장으로 삼아 대조하는 방식이 기본이다.
limits: 실시간 주차 가능 대수는 담지 않는다. 실시간 정보는 지자체·공단별 비표준 API에서 따로 받아야 한다. 주차장관리번호 필드가 있지만 전역 조인 키로 확인되지 않았으므로, 다른 데이터와 연결할 때는 이름·주소·좌표 매칭 결과를 직접 검증해야 한다.
