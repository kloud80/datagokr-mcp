description_portal: 자동차안전연구원은 한국교통안전공단법 제4조에 따라 부설기관으로 지정되어 안전기준과 관련된 연구개발을 수행중입니다.대표사업에 대한 홍보 목적과 주요시설 안내 및 시설예약 등에 대한 정보를 대국민에게 제공하고 있으며, 자동차관리법 제29조의2, 동법 제33조의4에 따라 홈페이지를 운영중입니다. - 주요 제공 정보는 제작결함조사 정보 및 관련 사이트 연계, 기술지원, 사고조사 정보 및 관련 사이트 연계, 자동차 안전도 평가 정보 및 관련 사이트 연계 등이 대표적이며, 본 데이터는 자동차안전연구원 홈페이지에 방문한 국민들의 접속기록 중 공휴일 접속 통계를 나타내는 데이터 입니다.
