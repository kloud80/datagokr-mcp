description_portal: '경상남도 진주시에서 운영하는 버스정보시스템의 시내버스 일별지점통계 테이블(제공항목 : 연월일, 노선아이디,  지점순번, 정차시간, 운행시간, 속도, 수집건수) 정보를 제공합니다.각 해당 정보는 진주시 버스정보시스템에서 수집된 자료를 통계자료로서 활용 가능하며,시내버스의 정차시간, 운행시간, 속도 등에 대한 기초 자료를 제공함으로써교통 및 물류 분야의 연구기초자료 등으로 다방면으로 활요 가능합니다.참고사항 : 2022년 공공데이터 중장기 개방계획 수립 완료한 개방대상테이블 2023년 개방 이행한 자료이며, 2024년 8월~2025년 8월까지 데이터입니다.'
