summary_user: 대구도시철도 1·2·3호선 각 역 주변의 역세권 주차장을 주차장 한 곳당 한 행으로 담은 작은 CSV 파일(약 5KB)로, 호선·역명·주차장명·관리주체·위치·규모(주차 면수)·비고를 담는다. 도시철도 이용객이나 내비게이션·위치기반 서비스 개발자가 "이 역 근처에 차를 대고 지하철로 갈아탈 주차장이 어디 있고 몇 면인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 역명·호선 이름으로 대구도시철도 역 정보나 승하차 데이터와 맞춰 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 시민편의 및 운영정보 데이터로, 대구도시철도 1·2·3호선 각 역사 주변의 역세권 주차장 현황을 제공합니다. 주요 항목은 주차장 명칭, 관리주체, 역사 출구 기준 위치 및 거리, 주차 가능 면수, 운영시간 등으로 구성되어 있으며, 도시철도 이용객이 역사 인근 주차시설 정보를 편리하게 확인할 수 있도록 제공됩니다. 본 자료는 자가용과 도시철도를 연계한 환승체계(Park & Ride) 이용을 지원하고, 시민의 주차 편의 향상과 대중교통 접근성 개선을 위한 기초자료로 활용될 수 있습니다. 또한 역세권 교통 인프라 분석, 주차 수요 예측, 교통정책 수립, 스마트 모빌리티 및 위치기반 서비스(LBS) 개발, 내비게이션 경로 안내, 지역 교통서비스 개선 등 다양한 행정·연구 및 민간 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
