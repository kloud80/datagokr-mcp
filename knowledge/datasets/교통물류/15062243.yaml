summary_user: 한국도로공사가 수시로 실시한 전국 고속도로 교통량 조사 결과를 노선·방향·구간·지점번호별로 시간대마다 1종~12종 차종별 통행량으로 담은 CSV 파일(약 2MB)이다. 분석가나 사업자가 "특정 고속도로 구간에서 어느 시간대에 화물차 통행이 몰리는가"처럼 구간별 혼잡 시간대나 차종 구성을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 교통량·도로 데이터와는 노선명·구간명을 이름으로 맞추거나 같은 기관의 지점번호로만 연결한다.
description_portal: 본 데이터는 한국도로공사에서 수시로 수행하는 고속도로 교통량 조사 결과를 수록한 자료이다. 주요 항목으로는 노선명, 주행 방향, 조사 구간, 시간대별 통행량, 차종별 통계 등이 포함된다. 고속도로 이용 실태 파악과 구간별 혼잡도 분석, 차종별 교통 흐름 예측 등에 활용 가능하다. 본 데이터는 실시간 또는 단기 분석이 필요한 수요에 대응하기 위해 수시 단위로 갱신되며, 교통 운영 정책 수립, 혼잡 완화 대책 마련 등 공공 및 민간 부문에서 다양한 용도로 활용된다. 또한 특정 시간대의 교통 집중 현상 분석, 노선별 교통 분산 전략 수립 등 실질적 정책 자료로 활용도가 높으며, 시계열적 접근을 통해 특정 시기별 교통 특성을 비교 분석하는 데 유용한 공공데이터이다.
