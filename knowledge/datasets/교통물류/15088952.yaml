summary_user: 서울교통공사가 운영하는 1~8호선의 호선·구간별 표정속도(운행거리를 정차시간 포함 총 소요시간으로 나눈, 승객이 체감하는 평균 운행속도)를 담은 작은 집계 파일(CSV 243바이트)이다. 시민이나 교통 분석가가 '어느 호선이 실제로 가장 빨리 이동하는가'처럼 노선 간 체감 속도를 비교하거나 통행시간을 어림할 때 쓴다. 전역 조인 키는 없어 다른 지하철 데이터(역 정보·승하차 인원 등)와는 호선 이름으로 맞춰 이어 써야 한다.
description_portal: 서울교통공사에서 운행하는 1~8호선 열차들의 표정속도 값을 나타내는 정보입니다.표정속도란 해당 호선 열차들의 운행거리를 역간 이동 시간 및 역에서의 정차시간을 포함한 총 소요시간으로 나눈 값으로 전동차가 운행 할 수 있는 최고 운행 가능속도나선로의 조건 및 구조등에 의해 일부구간에서 운행할 수 있는 최고 허용 운행속도와는 의미가 다르며 지하철을 이용하는 승객들이 실제로 체감할 수 있는 운행속도를 나타냅니다.이는 지하철 노선 건설 계획 당시부터 해당 호선의 수송수요, 정차역 수, 역간거리, 차량성능, 선로조건 등 지하철을 건설하고 운행하는 모든 조건등을 고려하여 정해집니다.해당 데이터는 연번, 호선, 구간, 표정속도 정보로 구성되어 있습니다.
