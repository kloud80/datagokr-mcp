summary_user: 개발제한구역의 해제·변경에 관해 지자체가 고시한 내용을 고시 건별로 담는 API이며, 범위는 전국이고 공간 좌표가 없는 속성 데이터입니다. 도시계획 분석가나 토지 소유자가 특정 지역의 개발제한구역이 언제 어떤 고시로 해제·변경됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명·고시번호 같은 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
limits: 좌표·도형이 없는 비공간 데이터라 구역 경계를 지도에 그리려면 별도 도형자료가 필요하다. 표준 조인 키가 없어 다른 공공데이터와 자동으로 결합하기 어렵다. 개발계정은 하루 10,000회까지 호출할 수 있다.
