summary_user: 서귀포시에서 적발된 불법 주정차를 단속 건별로 담은 CSV 파일(약 12MB)로, 단속일시·단속 동과 장소·단속구분·차종·위반 법조항·과태료 금액을 담는다. 시청 교통 담당자나 분석가가 "서귀포시에서 불법 주정차가 반복 적발되는 동·장소와 시간대는 어디인가"를 파악해 단속 인력 배치나 보호구역 관리에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 단속 동·장소(단속동단속장소) 이름을 행정동 코드나 다른 데이터의 지명과 이름으로 매핑해야만 연결된다.
description_portal: “제주특별자치도 서귀포시_불법 주정차 단속 적발 위치” 데이터는 서귀포시 전역에서 발생한 불법 주정차 적발 지점을 좌표 기반으로 제공하는 자료로, 단속 일시, 적발 위치, 위도‧경도, 도로 유형 등 주요 항목을 포함하고 있습니다. 이 데이터는 교통 혼잡을 유발하는 대표적 요인인 불법 주정차의 발생 패턴을 분석하고, 위험 지역이나 반복적으로 적발되는 구역을 파악하는 데 활용됩니다. 이를 통해 지자체는 단속 인력 배치 효율을 높이고, 교통사고 예방 대책 마련, 안전한 보행 환경 조성, 어린이보호구역 관리 강화 등에 도움이 되는 정책 기반을 마련할 수 있습니다. 또한 시민과 관광객에게는 혼잡 지역이나 단속이 잦은 구역에 대한 정보를 제공해 교통법규 준수와 안전 운행을 유도하는 데도 기여합니다.
