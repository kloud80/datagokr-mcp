summary_user: 시설물안전법에 따라 국토안전관리원 시설물정보관리종합시스템에 등록된 공공교량 35,931개의 주요제원(교량형식·연장·차로수·경간수·최대경간장)을 교량 1건당 1행으로 담은 전국 단위 파일이다. 지역별 교량이 어떤 형식과 규모로 있는지, 특정 교량의 연장과 차로수가 얼마인지 알아보려는 분석가나 국민이 쓴다. 주소(address)를 조인 키로 삼아 같은 주소 기준의 다른 도로 시설물이나 지자체 교량 파일과 이어 쓴다.
description_portal: 국토안전관리원에서 제공하는 데이터이며, 시설물의 안전 및 유지관리에 관한 특별법에 의거하여 국토안전관리원에서 운영중인 시설물정보관리종합시스템 내 등록된 공공교량시설물의 주요제원현황을 제공합니다.시설물안전법은 시설물의 안전점검과 적정한 유지관리를 통해 재해 및 재난을 예방하고, 공중의 안전을 확보하는 것을 목적으로 합니다.데이터는 시설물명, 주소, 교량형식, 교량연장, 차로수, 경간수, 최대 경간장의 열로 구성되어 있습니다. 데이터는 35,931개의 공공교량시설물에 대한 정보를 포함하고 있습니다.
