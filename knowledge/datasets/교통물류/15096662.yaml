summary_user: 제주특별자치도에서 발생한 교통사고를 연도와 기상 상태(맑음·비·눈·기타 등)별로 묶어 사고 건수·부상자 수·사망자 수를 담은 집계 통계로, 포털 설명상 2005~2020년을 다룬다. 교통안전 담당자나 분석가가 '제주에서 비나 눈이 올 때 사고와 사망자가 맑은 날보다 얼마나 많은가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준 연도와 기상 상태 이름으로만 맞춰 붙이며, 다발지역 위치가 필요하면 도로교통공단(TAAS) 다발지역 공간 자료나 지자체 사고 통계와 함께 본다.
description_portal: '"제주특별자치도 내 기상 상태별 교통사고 통계 데이터를 제공합니다.항목: 연도, 기상 상태, 사고건 수, 부상자 수, 사망자 수 등*2005년부터 2020년까지 제주특별자치도 내에서 발생한 교통사고를 기상 상태별로 집계한 종합 통계자료입니다.주요 항목은 사고 건수, 부상자 수, 사망자 수로 구성되어 있으며, 이를 통해 기상 조건(맑음, 비, 눈, 기타 등)과 교통사고 발생 간의 상관관계를 계량적으로 분석할 수 있습니다. 이 자료는 단순한 수치 집계를 넘어, 특정 기상 상황에서 사고 위험이 얼마나 높아지는지를 과학적으로 검토할 수 있게 하며, 교통 안전 대책 수립과 사고 예방 정책을 마련하는 데 중요한 기초 자료로 활용될 수 있습니다.* 활용 분야 : 기상별 교통사고 위험도 시각화, 교통안전 정책 수립, 자동화된 교통사고 모니터링 시스템 구 등"'
