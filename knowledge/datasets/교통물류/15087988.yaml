summary_user: 개인형이동장치(PM)가 가해 차종인 교통사고를 발생월과 가해자 연령층별로 묶어 사고건수·사망자수·중상자수·경상자수·부상신고자수를 담은 전국 단위 집계 통계로, 포털 설명상 2017~2022년이 범위이며 지역 구분은 없다. 전동킥보드 사고가 어느 연령대 운전자에게서, 어느 달에 많이 나는지 확인하려는 정책 분석가·안전교육 담당자의 질문에 쓴다. 전역 조인 키가 없어 다른 TAAS 교통사고 통계와는 발생월·연령층 이름을 맞춰서만 이어 쓴다.
limits: 전국 합계만 있어 시도·시군구별 사고 분석에는 쓸 수 없고, 다른 데이터와 연결할 표준 코드가 없어 이름 매칭에 의존해야 한다. 포털 설명상 경찰이 조사·처리한 인적 피해 사고만 집계된다.
