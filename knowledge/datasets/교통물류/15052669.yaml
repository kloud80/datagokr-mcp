summary_user: 울산광역시 시내버스의 정류소 위치와 버스전용차로 정보를 개별 주소·좌표 단위로 담는 API이다. 울산에서 버스를 타려는 시민이나 교통 분석가가 '이 근처 정류소가 어디이고 전용차로는 어느 구간에 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 정류소·노선 이름 매핑이나 같은 기관(울산광역시) 코드로만 연결한다.
limits: 실측 필드에서 공통 조인 키가 확인되지 않아 TAGO 등 전국 버스 데이터와 바로 붙이기 어렵다. 개발계정은 하루 1,000회 호출로 제한되며, 범위는 울산광역시 한 곳뿐이다.
