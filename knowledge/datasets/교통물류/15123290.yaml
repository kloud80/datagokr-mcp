summary_user: 경기도 도로대장 전산화 시스템에 기록된 옹벽 구조물을 건별로 담는다. 노선·구간별로 위치(시점·종점·상하행 방향), 연장, 종류, 최대·최소 높이, 폭, 시점·종점 경위도를 함께 싣는다. 도로 관리자나 분석가가 특정 노선 구간에 어떤 옹벽이 얼마나 높고 길게 설치돼 있는지 확인하고 지도에 표시하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 노선번호·구간번호 이름 매핑이나 시점·종점 경위도 좌표로 표준노드링크 같은 도로망 자료와 공간 매칭해 잇는다.
description_portal: 이 데이터는 도로대장전산화시스템을 기반으로 수집된 옹벽 구조물 정보를 담고 있으며, 도로 구간별로 설치된 옹벽의 종류, 위치, 연장길이, 최대 및 최소 높이, 폭 등 구조물의 물리적 특성과 도로방향(상행, 하행) 등의 정보를 포함하고 있습니다. 주요 항목으로는 '노선번호', '구간번호', '위치-시점', '위치-종점', '위치-방향', '연장', '종류', '높이-최대', '높이-최소', '폭', '비고', '공간경도시점', '공간위도시점', '공간경도종점', '공간위도종점' 등이 있으며, 도로안전관리, 구조물 점검 및 보수 계획 수립, 공간정보 연계 분석 등 다양한 분야에 활용될 수 있습니다. 특히 옹벽 구조물의 특성 분석과 더불어 지도 기반의 시각화 자료로도 확장 가능성이 높습니다.
