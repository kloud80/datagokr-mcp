summary_user: 고속도로 구간(구분)별 차량 통행량을 평일과 주말로 나누고 1종~5종 차종별로 집계한 파일 데이터로, 전국 고속도로를 범위로 하며 CSV 한 개(약 48KB) 규모다. 도로 운영·교통 분석가가 '어느 구간이 주말에 승용차(1종) 통행이 평일보다 크게 늘어나는가', '화물차(4·5종) 비중이 높은 구간은 어디인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키(구간 코드·링크 ID)가 없어 다른 데이터와는 구간 명칭을 이름 매칭하거나 같은 한국도로공사 자료와 맞춰 이어야 하며, 표준노드링크(link_id) 같은 공간 기준과 바로 연결되지 않는다.
description_portal: 본 데이터는 고속도로 구간별 차량 통행량을 평일과 주말로 나누어 차종별로 제공하는 자료이다. 한국도로공사에서 관리하며, 구간명칭, 평일 교통량(1종~5종), 주말 교통량(1종~5종) 항목으로 구성되어 있다. 해당 데이터는 요일별 교통량 변화를 분석할 수 있어 수요 예측, 도로 운영 계획, 혼잡도 관리 등에 활용된다. 평일과 주말 간 통행 특성 차이를 반영하여 데이터를 집계한 데이터이다. 차종별 통계는 차량 유형별 이용 행태 분석과 정책 설계에 도움이 되며, 지역별 통행량 비교 및 인프라 운영 전략 마련에도 활용된다. 본 자료는 고속도로 이용 특성 이해를 높이고, 체계적인 교통관리 기반 마련에 기여하는 공공데이터이다.
