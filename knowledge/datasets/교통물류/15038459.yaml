summary_user: 대구도시철도 1·2·3호선 각 역사에 비치된 방독면을 역별·세부품명별로 보유량, 제조일자, 유효기간과 함께 담은 파일 데이터로, 역 위치(위도·경도)가 함께 들어 있다. 시민이나 안전관리 담당자가 "우리 동네 역에 방독면이 몇 개 있고 유효기간이 언제 끝나는가"를 확인하거나, 교체가 필요한 노후 장비를 역별로 추리는 데 쓴다. 전역 조인 키가 없어 다른 역 데이터와는 역명 매칭이나 같은 기관(대구교통공사) 데이터끼리, 또는 위도·경도 좌표로 이어 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 안전·보건관리 데이터로, 대구도시철도 1·2·3호선 각 역사에 비치된 방독면 현황을 제공합니다. 주요 항목은 역사별 방독면 보유 수량, 제조일자, 유효기간 등으로 구성되어 있으며, 비상용 보호장비의 관리 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 자료는 화재, 유해가스 누출 등 재난 및 비상상황에 대비한 안전관리 체계 구축과 방재설비 운영 현황 분석, 안전장비 적정성 검토 및 유지관리 계획 수립을 위한 기초자료로 활용될 수 있습니다. 또한 역사별 안전 대응 인프라 분석, 노후 장비 교체 주기 산정, 재난 대응 역량 강화 및 공공교통 시설의 안전성 향상을 위한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 본 데이터는 연 1회 정기적으로 갱신됩니다.'
