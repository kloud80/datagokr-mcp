summary_user: 제주특별자치도 어린이보호구역 안에 설치된 과속방지턱을 한 건씩 담은 원천 목록 파일(CSV, 약 265KB)로, 설치장소·주소·위경도와 재료·형태·높이·폭·연장, 규격 여부, 연속형 여부, 관리기관을 함께 담는다. 학부모나 교통안전 분석가가 '우리 아이 학교 앞 보호구역의 과속방지턱이 표준규격(길이 3.6m, 높이 10cm)에 맞게 설치됐는가'를 확인하거나 보호구역별 설치 현황을 점검하는 데 쓴다. 다른 데이터와 바로 이을 전역 조인 키는 없으므로 시군구명·도로명·소재지 주소나 위경도를 맞춰 어린이보호구역 표준데이터 등과 연결한다.
description_portal: '"제주특별자치도에서 제공하는 어린이보호구역 내 과속방지턱 관련 데이터를 제공합니다.항목: 설치장소, 과속방지턱재료/형태구분/높이/폭/연장 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 30km/h 이하의 속도제한이 필요한 구역에 표준규격(길이 3.6m*높이 10cm)의 과속방지턱을 설치'
