summary_user: 부산 도시철도 2호선 역사에 설치된 자동제세동기를 설치 위치 단위로 담은 파일로, 역명·지상지하 구분·역층·출입구번호·상세위치와 출력에너지·운영방식·수량이 들어 있습니다(CSV 약 3.9KB 규모의 작은 목록). 승객이나 역 주변 응급대응 담당자가 '이 역에서 가장 가까운 제세동기는 몇 층, 어느 출입구 근처에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 철도역 시설 데이터나 다른 노선의 제세동기 데이터와는 역명·선명 같은 이름을 맞춰 연결한다.
description_portal: 부산2호선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 지상지하구분, 제세동기의 역층, 출입구번호, 상세위치, 제세동기출력에너지, 제세동기운영방식, 수량의 데이터가 있습니다.자동제세동기는 자동(自動)으로 세동(細動)을 제(際)거하는 기(器)계라는 의미다. 환자에게 심정지(심장마비)가 왔을 때 자동제세동기를 통해 환자의 심장을 인위적으로 뛰게 하면, 환자의 생존율을 두 배 이상 높일 수 있다. 하지만 이런 중요성에도 불구하고, 대다수의 사람들은 자동제세동기의 기능과 사용법에 대해 알지 못한다. 평소에 자동제세동기에 대한 전반적인 내용을 숙지토록 하여야 한다.
