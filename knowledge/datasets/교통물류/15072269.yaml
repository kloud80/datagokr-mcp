description_portal: 한국교통안전공단에서 교통카드를 이용해 전국(서울특별시, 부산광역시, 대구광역시 등)의 데이터를 분석하여 추출한 환승소요시간 자료입니다.해당 데이터는 평일, 주말(토요일, 일요일)별로 세분화하여 제공하고 있습니다.단위는 통행당 분인 분/통행입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
