summary_user: 경상남도 고성군에 안전신문고로 접수된 불법주정차 신고를 건별로 담은 파일(csv, 약 90KB)로, 신고일시·신고 위치·과태료 부과 여부를 기록한다. 고성군 주민이나 교통 분석가가 "군내 어느 장소에서 불법주정차 신고가 자주 들어오고, 그중 실제로 과태료가 부과된 비율은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 신고 위치의 장소명·주소 문자열이나 고성군이라는 기관 단위로만 맞춰 이어 쓴다.
