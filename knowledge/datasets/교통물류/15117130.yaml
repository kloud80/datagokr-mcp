summary_user: 한국교통안전공단이 운영하는 전국 내압용기(CNG 등 압력용기) 검사소를 검사소 한 곳당 한 행으로 담은 목록 파일로, 지역·검사장 이름·출장검사소 여부·주소·연락처를 담는다. 내압용기 재검사를 받아야 하는 차량 소유자나 운수사업자가 '우리 지역에서 검사원이 상주하는 본검사소는 어디이고 출장검사소는 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 코드 필드는 없어서, 다른 데이터와는 주소를 지오코딩하거나 지역·검사소 이름을 맞춰서만 이어 쓴다.
description_portal: 2023년 7월을 기준으로 생성된 한국교통안전공단의 내압용기검사소 지역, 주소, 전화번호가 기재되어있습니다. 내압용기검사소 민간검사소가 부재합니다. *'23년 기준 성산, 상암, 강동, 노원, 신탄진, 계양, 인천, 전주, 광주, 수성, 서수원, 창원, 해운대, 주례, 울산은 본검사소로 상시 검사원이 상주하며 그외 양주, 춘천, 동해, 원주, 김포, 시흥, 성남, 포항, 경주, 진주, 여수, 목포, 천안, 순천, 청주, 김해는 출장검사소로 검사원이 상주하고 있지 않습니다. 지속적인 현황 필요 시 공단 홈페이지(자동차,도로-안전검사-내압용기재검사-검사소안내)를 통해 확인하실 수 있습니다.
