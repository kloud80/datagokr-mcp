summary_user: 경찰청이 제공하는 교통안전 위험요소 가운데 교차로 운행방법 위반 관련 정보를 지점(위험요소 식별자) 단위로 담으며, 지번·도로명 주소, 위경도, 위험요소 대·중·소분류 코드, 기준일자, 상세내용 필드로 구성되고 범위는 전국이다. 운전자나 내비게이션·교통안전 분석가가 '우리 동네 어느 교차로에서 운행방법 위반 위험이 지적되는가'를 확인하거나 위험 지점을 지도에 표시하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·위경도 같은 위치 정보나 이름 매핑으로 이어 써야 한다.
