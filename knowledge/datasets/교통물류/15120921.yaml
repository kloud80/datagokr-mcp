summary_user: 경기도 수도권 주요도로(고속국도·일반국도·지방도·시군도 등)의 수시 조사 지점별로 연도, 노선, 상·하행, 시간대, 차종(1~12종)별 교통량과 전차종 합계를 담은 지점·시간대 단위 집계 자료다. 교통 분석가나 사업자가 특정 노선 조사지점의 혼잡 시간대와 화물차 비중을 확인하거나, 상권·입지 분석에 지점 교통량을 넣을 때 쓴다. 전역 조인 키는 없어 노선명·노선코드(route_cd), 지역명·지역코드, 지점번호 같은 이름·코드 매핑으로 다른 교통량·도로 자료와 이어 쓴다.
description_portal: 수도권 주요도로(고속도로, 일반도로, 국가지원지방도, 지방도, 시군도)의 지점별, 시간대별, 방향 차종을 구분한 교통량 자료입니다.도로종류(고속국도, 일반국도 등), 지점번호, 호선명, 상/하행 구분, 시간대, 차량유형(1종~12종), 전차종합계 등의 항목으로 구성되어 있습니다. 시간대별 교통량 분포와 다양한 차량군의 통행 실태를 정량적으로 확인할 수 있어 혼잡 시간대 파악, 도로 용량 분석, 교통정책 수립에 중요한 기초자료로 활용됩니다.- 차종1종(승용차, 16인 미만 승합차량)2종(25인승, 35인승, 45인승 승합차량)3종(1~2.5톤 미만의 화물차량)4종(2.5~8.5톤의 화물차량)5종~12종은 설명자료를 참조(FIle 탭)
