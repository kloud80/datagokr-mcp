summary_user: 울산광역시 중구가 관리하는 공영주차장을 주차장 한 곳당 한 행으로 담은 작은 파일(약 2.5KB CSV)로, 주차장명·설립장소·주차면수·면적·관리기관과 전화번호를 담는다. 중구 주민이나 분석가가 '중구 어느 동네에 공영주차장이 몇 면 규모로 있는가'를 확인하거나 지역별 주차 인프라 분포를 파악하는 데 쓴다. 전역 조인 키(주차장관리번호·좌표 등)가 없어 전국주차장정보표준데이터 등과는 주차장명·설립장소 문자열을 맞춰 연결해야 한다.
description_portal: 울산광역시 중구 공영주차장 현황에 대한 자료로, 울산광역시 중구 공영주차장 현황 정보를 제공합니다.본 데이터는 연번, 주차장명, 주차장 설립장소, 주차면수, 면적(㎡), 관리기관 소속, 관리기관 전화번호 등의 상세 현황을 확인할 수 있습니다.데이터 출처는 울산광역시 중구 교통과 교통행정계 (052-290-3960)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 4월 28일입니다. 다음 업데이트는 2027년 4~5월 중 제공됩니다.본 자료는 울산광역시 중구 공영주차장의 지역별 분포 및 규모 파악, 주차 인프라 현황 분석, 지역별 주차 수요 예측 및 교통 주차 정책 수립 등을 위한 기초자료로 활용할 수 있습니다.
