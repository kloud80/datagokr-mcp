summary_user: 인천광역시 지능형교통정보시스템(UTIS)에 등록된 교통정보운영과 관리 CCTV를 한 대씩 담은 목록으로, 설치 위치 명칭·설치주소·경도·위도를 개별 단위로 제공한다(CSV 약 11KB). 인천 시내 도로 어느 지점에 시가 운영하는 교통 CCTV가 있는지 확인하거나, 지도에 CCTV 분포를 표시하려는 시민·분석가가 쓴다. 전역 조인 키는 없으므로 경도·위도 좌표로 링크 속도·돌발상황 같은 인천 UTIS 실시간 소통 데이터와 공간 매칭하거나, 설치주소를 행정구역 이름으로 매핑해 이어 쓴다.
