description_portal: '데이터 개요업체별 경량항공기 등록 현황 데이터는 사업자 또는 개인 소유 경량항공기의 등록 대수를 항공기 종류별로 구분하여 제공합니다.해당 데이터는 경량항공기 정책 수립, 시장 규모 분석, 업체별 운영 현황 파악 등에 유용하게 활용될 수 있으며, 항공사명, 사업구분, 항공기 종류별 보유 현황을 통계적으로 제공합니다.데이터 제공 항목사업구분항공기의 운용 목적에 따른 구분 (예: 자가용, 항공레저스포츠사업 등)항공사등록된 경량항공기의 소유자 또는 운영주체 (법인명 또는 개인명)타면조종형날개와 조종면이 있는 조종식 고정익 항공기체중이동형조종자의 체중 이동으로 방향을 제어하는 항공기경량헬리콥터최대이륙중량 600kg 이하의 경량 회전익 항공기자이로플레인자전식 회전익을 이용하는 초경량항공기동력패러슈트낙하산형 날개에 엔진이 장착된 경량 비행장치계해당 업체가 보유한 경량항공기 총 등록 대수활용 안내항공레저 및 소형항공기 산업 분석 : 업체별 등록현황을 통해 경량항공기 시장 참여 기업의 규모 및 분포를 파악하고 정책지원의 근거로 활용 가능기체 안전관리 대상 식별 : 특정 업체 또는 개인이 다수의 기체를 보유한 경우, 정비·감항성 점검 등의 대상 선별에 유용지역별 경량항공기 운영현황 파악 : 업체 주소 정보와 연계 분석 시, 지역 기반 항공레저산업의 확산 정도를 파악 가능데이터 해석 시 유의사항일부 항공사는 개인 명의로 등록되어 있으며, 실운영 단위와 상이할 수 있음항공기 등록 수는 ‘보유 수량’ 기준이며 말소 항목은 포함되어 있지 않음'
