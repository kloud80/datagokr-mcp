description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야에 해당하는 교통약자 이동권 및 시민편의 운영정보 데이터로, 대구도시철도 1호선 각 역사의 지상 에스컬레이터 위치정보를 제공합니다. 주요 항목은 호선번호, 역사명, 출구번호, 위도·경도 좌표로 구성되어 있으며, 각 역사 출구를 기준으로 지상과 지하를 연결하는 에스컬레이터의 위치를 확인할 수 있습니다. 본 자료는 교통약자, 고령자, 장애인, 유아차 및 대형 수하물 이용객 등 이동편의가 필요한 시민의 역사 이용 접근성을 높이고, 효율적인 이동 동선 계획을 지원하는 데 활용할 수 있습니다. 또한 지도 기반 위치정보 서비스, 경로 탐색 서비스 개발, 스마트 모빌리티 서비스 구축, 역사 시설 운영 및 이용환경 개선, 이용 동선 분석 등 다양한 행정·연구 분야의 기초자료로 활용될 수 있습니다. 데이터는 시설 운영 현황 변경 시 갱신됩니다.'
