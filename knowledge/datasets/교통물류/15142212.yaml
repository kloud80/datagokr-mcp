description_portal: '광주광역시 남구에서는 도로 위험 요소에 대한 선제적인 대응과 효율적인 유지보수 업무 처리를 위해 "실시간 도로 위험정보 서비스"를 도입하여 운영하고 있습니다. "실시간 도로 위험정보 서비스"를 통해  수집한 광주광역시 남구 관내 도로에 발생한 포트홀, 균열 등에 대한 정보(수집일시, 발생장소, 위도, 경도 등 / "25. 3. ~ "25. 7. 기준)를 제공합니다.  일부 데이터의 경우, 시스템에서 도로명이 수집되지 않아 공란 표기 상태이므로, 발생 장소의 행정동, 위도, 경도를 참고하여 주시기 바랍니다. 데이터 제공부서 : 광주광역시 남구청 홍보실(☎062-607-3733) 사업 주관부서 : 광주광역시 남구청 민생경제과(☎062-607-2722)'
