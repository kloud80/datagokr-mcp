summary_user: 국가철도공단 전자조달 시스템에서 나온 입찰공고를 공고 한 건씩 담은 파일(CSV, 약 657KB)이며, 공고명·설계금액·계약방법·낙찰하한율·공고게시일·입찰서 접수마감일·개찰일·진행상태·입찰담당관과 소속을 담는다. 철도건설·유지관리 공사나 용역 입찰에 참여하려는 사업자가 '공단이 어떤 계약방법과 낙찰하한율로 발주했고 접수 마감과 개찰은 언제인가'를 확인하거나, 분석가가 공단 발주 규모와 계약방식 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고명 같은 이름 매칭이나 같은 기관(국가철도공단) 기준으로만 이어 쓴다.
limits: 실측 컬럼에 공고번호 같은 전역 조인 키가 없어 조달청 입찰·계약 데이터와 건 단위로 정확히 맞물리지 않는다. 범위는 전국이지만 공간 정보가 없는 비공간 데이터라 공사 위치별 분석에는 쓰기 어렵다.
