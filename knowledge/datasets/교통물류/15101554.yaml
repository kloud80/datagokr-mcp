summary_user: 부산광역시 중구 관내 불법 주정차 단속 건수를 연도별 한 행에 1월~12월 월별 열로 담은 집계 통계로, 포털 설명상 2019년 이후 CCTV 무인단속·인력단속·주민신고제 단속을 모두 합친 수치다(CSV 623바이트의 작은 파일). 구청·지역 분석가가 "중구의 불법 주정차 단속이 어느 달에 많고 해마다 늘거나 줄었는가" 같은 계절·연도 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·월 기준이나 '부산 중구'라는 지역명으로만 맞춰 이어 쓰며, 무인교통단속카메라 등 전국 통일 형식의 단속 관련 데이터와 나란히 참고한다.
limits: 구 전체 월별 합계만 있어 단속 위치·단속 수단(CCTV·인력·주민신고)별 건수나 개별 단속 건은 알 수 없다. 조인 키가 없어 다른 지역·데이터와 연결하려면 이름이나 기관 기준으로 직접 맞춰야 한다.
