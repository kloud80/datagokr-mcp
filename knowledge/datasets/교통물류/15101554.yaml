description_portal: '부산광역시 중구 관내에서 이루어진 월별 불법 주정차 단속 건수에 관한 데이터입니다.  2019년 이후 월별(1월~12월) 통계를 제공합니다.  무인단속시스템(CCTV),  인력단속,  주민신고제 등에 의한 단속건수를 모두 포함한 통계치입니다.  [참고자료] ※ 부산광역시 중구 무인단속카메라(고정형 단속카메라) 현황1. 대청사거리2. 흑교로 홍일한의원 옆(부평동)3. 국제시장 사거리4. 유라리광장(건어물 위판장 앞)(남포동)5. 국제시장 로뎀나무 앞(광복동)6. 용두산 공영주차장 진입로(대청동)7. 남포사거리8. 보수사거리9. 자갈치시장 제창주차장 앞(남포동)10. 보수대로 건강의료기 앞(부평동)11. 광복중앙로 이재모 피자 앞(대청동)12. 고려화공 앞(중앙동)*무역회관13. 남포동 다이소앞(남포동)14. 해관로 반도빌딩 앞(중앙동)15. 롯데 야외 주차장 앞(중앙동)16. 남포역 5번출구 앞17. 메리놀병원 앞(동광동)18. 영주동 교통섬 주변(영주1동)19. 건어물시장 입구(남포동)20. 부산터널 위(영주1동)21. 자갈치 공영주차장 주변22. 자갈치역 3번출구 앞23. 중앙공원 화장실 앞(영주동) ※ 불법주정차 주민신고제(안전신문고 앱)-신고대상 : 버스정류소 10m이내, 소화전 5m이내, 교차로 모퉁이 5m이내, 횡단보도, 보도, 어린이보호구역 중 초등학교 정문 앞 도로가 다른 교차로와 만나기 전까지 구간, 기타구역(행정예고 참고)'
