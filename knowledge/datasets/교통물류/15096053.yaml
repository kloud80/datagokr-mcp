summary_user: 충청남도 계룡시에 등록된 자동차 대수를 승용·승합(다인승)·화물·특수차 종류별로 집계해 집계 날짜(DE)와 구분별로 담고, 이전 대비 증감도 함께 제공하는 시군구 단위 집계 통계다. 계룡시의 차종별 등록 대수가 어떻게 구성돼 있고 늘었는지 줄었는지를 확인하려는 지역 교통·행정 분석가나 주민이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 자동차 등록 통계와는 시군구 이름이나 같은 기관 코드로만 맞춰 이어 쓴다.
description_portal: 충청남도 계룡시의 '자동차 등록 현황 API' 데이터는 관내에 등록된 차량의 종류별 통계를 실시간으로 제공하는 교통 행정 정보 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 자동차 등록 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 집계 날짜, 통계 분류 기준인 구분 정보와 함께, 차량의 종류별 등록 대수인 승용 차량, 다인승 차량, 화물 차량, 특수차의 수치가 포함됩니다. 또한, 이전 기간 대비 등록 대수의 변화를 나타내는 증감 정보도 제공됩니다.
