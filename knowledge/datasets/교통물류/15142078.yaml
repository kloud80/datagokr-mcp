summary_user: 전국 시군구별로 운행일자·요일마다 정류장 수, 시가화면적, 정류장 공급도 지표를 담은 집계 데이터다. 교통 분석가나 지자체 담당자가 "우리 시군구는 시가화면적에 비해 정류장이 부족한가"를 다른 지역과 비교해 정류장 신설·조정 대상을 고를 때 쓴다. 전역 조인 키는 실측되지 않았으므로 시도·시군구 코드(sgg_cd)나 시군구명을 행정구역 코드표에 맞춰 인구·노선·승하차 통계 같은 다른 시군구 단위 데이터와 연결한다.
description_portal: 정류장 공급도는 특정 지역 내에 위치한 대중교통 정류장의 분포 상태를 종합적으로 평가하는 지표로서, 해당 지역 주민들이 대중교통 수단을 얼마나 편리하게 이용할 수 있는지를 객관적으로 파악하는 데 활용됩니다. 이를 통해 지역별 대중교통 접근성 수준을 분석할 수 있으며, 부족하거나 과밀한 구역을 식별하여 교통망 재설계, 정류장 신설 및 조정, 그리고 도시 인프라 개선 등의 정책적 의사결정에 중요한 자료로 사용됩니다. 또한 정류장 공급도는 도시 균형 발전, 교통 혼잡 완화, 친환경 교통 수단 확산 등을 위한 기초 자료로도 활용될 수 있습니다.
