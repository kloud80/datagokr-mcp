summary_user: 세종특별자치시 24개 읍면동별 전기차 등록 대수와 차종(승용·승합·화물·특수)을 담은 집계 파일로, 포털 설명상 2025년 7월 31일 기준 총 6,318대입니다. 충전소 확충 계획을 세우는 공무원이나 충전 사업자가 "세종시 어느 동에 전기차가 많이 등록돼 있나"를 확인하는 데 쓴다. 공통 조인 키는 없어 읍면동 이름(동명)을 기준으로 충전소 위치나 인구 등 다른 읍면동 단위 데이터와 이름 매칭해 이어 쓴다.
