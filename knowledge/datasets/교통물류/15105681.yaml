summary_user: 의정부경전철 역사에 설치된 물품보관함을 역·설치 위치 단위로 정리한 시설 목록으로, 역명·지상지하 구분·역층·상세위치·크기·시설수·이용요금을 담으며 파일 크기가 454바이트에 불과한 소규모 CSV입니다. 의정부경전철을 이용하는 시민이나 여행객이 '어느 역 몇 층에 어떤 크기의 보관함이 있고 요금이 얼마인가'를 확인하는 데 쓴다. 공통 조인 키나 코드표가 없어 다른 철도 역사·편의시설 데이터와는 역명·노선명을 이름으로 맞춰 이어 써야 한다.
description_portal: 의정부경전철에 포함된 도시광역철도역들의 철도운영기관, 운영노선명, 역명, 무인편의시설이름, 크기, 역층, 상세위치, 시설수, 이용요금, 운영사, 전화번호, 데이터기준일 에 대한 데이터가 있습니다.지하철 물품 보관함은 공공 장소, 특히 지하철 역사 내에 설치된, 개인 짐을 일시적으로 보관할 수 있는 잠금 가능한 수납 공간입니다. 이러한 보관함은 여행객이나 일상에서 무거운 짐을 잠시 맡기고자 할 때 유용하게 사용됩니다. 사용자는 소정의 요금을 지불하고, 짐을 안전하게 보관한 후, 필요할 때 다시 찾아갈 수 있습니다. 특히 서울과 같은 대도시에서는 지하철 물품 보관함이 여행의 편의성을 크게 향상시키며, 관광객들에게는 필수적인 서비스로 자리 잡고 있습니다.
