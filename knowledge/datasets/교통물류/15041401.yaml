summary_user: 부산2호선 도시철도역별 고객센터의 위치와 연락처를 역 단위로 담은 소규모 파일(csv 약 3.5KB)로, 운영기관명·선명·역명·지상/지하 구분·역층·출구번호·상세위치·전화번호가 들어 있다. 부산2호선 이용객이 분실물이나 불편 신고를 위해 "이 역 고객센터는 몇 층 어디에 있고 전화번호는 무엇인가"를 찾을 때 쓰고, 안내 서비스나 챗봇이 역별 문의처를 답할 때도 쓴다. 전역 조인 키나 역 코드는 없으므로 다른 역 정보 데이터와는 역명·선명을 이름으로 맞춰 연결해야 한다.
