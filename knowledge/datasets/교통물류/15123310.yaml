summary_user: 경기도 도로대장 전산화 시스템에 등록된 낙석방지시설을 시설 한 건씩 담으며, 노선번호·구간번호, 시점·종점·방향 위치, 종류(낙석방지울타리·낙석방지망 등), 연장, 높이, 설치일자가 들어 있다. 도로 관리자나 안전 분석가가 '어느 노선의 어느 구간에 어떤 낙석방지시설이 언제 설치됐는지'를 확인해 절개지 위험구간 점검이나 보수·보강 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선번호·구간번호 같은 이름·코드를 맞추거나 같은 경기도 도로대장 시리즈끼리 연결해야 하며, 표준노드링크(link_id·node_id)와 바로 이어지지 않는다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템을 기반으로 수집된 낙석방지시설에 대한 정보로, 도로 인근 절개지나 급경사지에서 발생할 수 있는 낙석을 방지하고 차량 및 인명 피해를 예방하기 위해 설치된 시설물의 위치, 종류, 연장, 높이 등의 특성을 포함합니다. 주요 항목으로는 '노선번호', '구간번호', '위치?시점', '위치?종점', '위치?방향', '종류', '연장', '높이', '설치일자', '비고', '일련번호' 등이 있으며, '종류'에는 낙석방지울타리, 낙석방지망 등이 포함되어 있습니다. 본 데이터는 도로 절개지 위험도 분석, 낙석사고 예방계획 수립, 시설물 보수 및 보강 작업 계획, 안전 취약구간 우선 관리 등에 활용될 수 있습니다.
