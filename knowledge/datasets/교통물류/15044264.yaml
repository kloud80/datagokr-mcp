summary_user: 서울교통공사 1~8호선 역사 안에 설치된 수유실을 한 곳당 한 행으로 담은 파일(csv, 약 12KB)로, 호선·역명·주소·상세위치·조성연도·면적·운임구역 안팎 여부·고객안전실 경유 여부와 기저귀교환대·소파 등 비품 보유 현황을 담는다. 영유아를 동반한 이용객이 '이 역에 수유실이 있는지, 개찰구 안쪽인지, 기저귀교환대가 있는지'를 확인하거나, 분석가가 노선별 수유실 설치 현황과 비품 구비 수준을 비교하는 데 쓴다. 전역 공통 조인 키는 없어서, 다른 역 단위 데이터(역 정보·승하차 인원 등)와는 호선·역명을 이름으로 맞춰 잇거나 같은 기관의 역 코드로 매핑해 이어 쓴다.
description_portal: '서울교통공사 수유실현황 데이터입니다.(기준일자: "26년 6월 16일)서울교통공사에서는 지하철을 이용하는 임산부와 영유아의 편리하고 안전한 휴식공간을 제공하기 위해 1~8호선 역사 내 수유실 현황 정보를 제공하고 있습니다.역사 내 수유실 제공 현황을 통해 지하철 이용객의 편의 증진 및 만족도 향상에 기여하고자 합니다.수유실 현황에 대한 개방 데이터는 역사 내 수유실이 설치되어 있는 호선, 역명, 주소, 상세위치, 조성연도,  면적 , 시설구분, 운임 ·비운임  구분,  고객안전실 경유 유무, 비품(기저귀교환대, 기저귀수거함, 수유용칸막이, 1인용 소파, 2인용 소파, 탁자) 보유 현황 등"에 대한 정보를 포함하고 있습니다.( 수시, 1회성 데이터)'
