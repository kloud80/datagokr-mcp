summary_user: 경기도 버스운송관리시스템(BMS)에서 운수업체나 시군이 요청한 버스 정류소 위치 실측 요청 내역을 요청 건별로 담으며, 정류장 아이디·이름, 요청·확인·입력 일자, 요청 당시 좌표와 실측 후 실제 위경도(real_lat, real_logt)가 들어 있다. 정류장 위치가 언제 누구 요청으로 얼마나 바뀌었는지 확인하려는 버스정보시스템·GIS 담당자나 분석가가 정류장 좌표 정비 이력을 추적하는 데 쓴다. 정류장 아이디(sttn_id)를 조인 키로 삼아 경기도 버스 정류장 원장이나 노선·도착 정보와 이어 쓴다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)을 기반으로, 운수업체나 시군에서 요청한 정류소의 위치 실측 요청 내역을 수록하고 있습니다. 주요 항목으로는 정류장아이디, 정류장명, 요청일자, 위도, 경도, 실측 요청 당시의 Y좌표 및 X좌표, 실제요청일자, 실제입력일자, 실제위도 및 실제경도 등이 있으며, 이를 통해 정류소의 위치 정밀도를 향상시키기 위한 행정 절차와 이력 정보를 확인할 수 있습니다. 해당 데이터는 버스 노선 및 정류소의 공간 정보 정비, 정류장 위치 정확도 향상, GIS 기반 버스정보시스템 고도화 등의 목적으로 활용될 수 있습니다.
