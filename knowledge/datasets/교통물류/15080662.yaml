summary_user: 경기도 버스노선의 정보(노선 목록·노선 상세·노선 경유 정류소·노선 형상 좌표)를 개별 주소·좌표 단위로 담는 API이며, 실측된 필드는 노선 형상의 좌표 순서(lineSeq)와 X·Y 좌표뿐이다. 경기도 버스 이용자나 교통 분석가가 '특정 노선이 어떤 경로로 다니는가'를 확인하거나 노선을 지도에 그릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명·코드 매핑이나 같은 기관(경기도) 버스 데이터의 노선 ID로만 연결하며, routeId·keyword 같은 필수 파라미터는 노선 검색 결과에서 먼저 받아 넘겨야 한다.
limits: 2026-10-04 실호출에서 4개 오퍼레이션 중 1개만 성공했고, 노선 목록·노선 상세·노선 경유 정류소 조회(v2)는 최소 파라미터로 응답이 없었다. 필수 파라미터 format·keyword·routeId는 다른 데이터에서 얻은 값을 넘겨야 하며, 개발계정은 일 1,000회로 제한된다.
