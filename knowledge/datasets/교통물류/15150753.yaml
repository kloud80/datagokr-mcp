summary_user: 경찰청이 제공하는 교통안전 위험요소 중 법규위반 유형 '안전거리 미확보'에 해당하는 항목을 행정안전부 재난안전데이터 공유플랫폼에서 전국 범위로 제공하며, 각 행은 위험요소 식별번호, 지번·도로명 주소, 위경도, 대·중·소 분류코드, 기준일자, 상세내용을 담는다. 운전자나 지자체 교통안전 담당자가 안전거리 미확보로 위험이 지적된 지점이 어디인지 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 법규위반별 위험요소 데이터 등과는 분류코드나 같은 기관 코드로 맞추어 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 교통안전정보(위험요소)-법규위반별 데이터는 경찰청에서 제공하는 정보입니다.
