status: active
summary_user: 울산항 항만시설 중 임대시설을 시설 건별로 담으며, 시설명·계약시설면적·임차인명·임차상태·임대 시작일과 종료일, 전용·사용유형을 함께 제공한다. 항만 이용 사업자나 분석가가 울산항의 어느 시설을 어떤 업체가 언제까지 얼마의 면적으로 임차하고 있는지, 비어 있는 임대시설이 있는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 항만 시설·입출항 데이터와는 시설명이나 업체명 같은 이름 매핑, 또는 같은 기관(울산항만공사) 데이터끼리만 연결한다.
limits: 항만코드 등 공통 키가 없어 입출항·물류 데이터와 바로 붙일 수 없고, 이름 기반 매핑이 필요하다. 커버리지는 '전국'으로 표기되어 있으나 실제 내용은 울산항 임대시설에 한정되며 비공간 데이터라 위치 좌표가 없다.
