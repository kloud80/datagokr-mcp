summary_user: 광주 도시철도 각 역의 상하행 승강장을 열차 출입문 번호별로 나누어 플랫폼과 열차 사이 간격(연단간격), 높이 차이(단차), 휠체어석·임산부석·노약자석 위치를 담은 CSV 파일(약 30KB)입니다. 휠체어 이용자나 임산부가 어느 역에서 몇 번 문으로 타야 지정석 가까이 단차가 작은 곳에서 탈 수 있는지 확인하거나, 분석가가 연단간격이 큰 역·출입문을 골라 승강장 개량 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명칭을 이름으로 맞춰 이어야 하며, 같은 광주교통공사의 역사·시설 자료와 함께 쓰는 것이 현실적이다.
description_portal: 광주교통공사 도시철도 각 역사별 승강장 연단 간격, 단차, 교통약자 지정석 배치 현황을 체계적으로 관리하기 위해 구축된 기본 자료입니다.각 열차의 출입문 번호별로 플랫폼과 열차 간의 간격(연단간격), 높이 차이(단차), 그리고 휠체어석·임산부석·노약자석 위치 정보를 구체적으로 기록하여, 역사별 접근성과 안전 수준을 비교·분석할 수 있도록 구성되어 있습니다.이 자료는 지하철 안전관리, 배리어프리(Barrier-Free) 정책 추진, 교통약자 이동 편의성 개선, 승강장 유지보수 및 시설 개량 우선순위 설정 등에 활용됩니다.본 데이터는 광주교통공사의 도시철도 서비스 품질 향상, 안전성 확보, 공공시설 접근성 개선 전략 수립을 위한 핵심 기초자료라 할 수 있습니다.
