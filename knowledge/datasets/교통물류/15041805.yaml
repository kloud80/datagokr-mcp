summary_user: 서울교통공사 운영 노선의 승강장별·차량 출입문별 전동차와 승강장 사이 이격(안전)거리를 건별로 담은 파일 데이터로, 운영기관명·노선명·역명·승강장번호·차량순서·출입문번호마다 안전거리 값이 한 행씩 들어 있다. 교통약자 이동 지원 단체나 안전 분석가가 '어느 역 몇 번째 칸 출입문에서 발 빠짐 위험이 큰가'를 확인하거나 안전발판 설치 우선순위를 정할 때 쓴다. 전역 조인 키는 없어 역명·노선명을 역 마스터나 같은 기관의 역 코드에 이름으로 맞춰 이어야 한다.
description_portal: 승강장이격거리는 지하철이나 철도역에서 전동차와 승강장(플랫폼) 사이의 안전거리를 의미하며, 승객의 안전과 이동 편의를 위해 규정된 값입니다.승강장이격거리의 주요 기준일반적으로 10cm 이하가 권장되며, 일부 곡선 구간이나 안전사고 위험이 높은 역에서는 15cm 이상까지 이격거리가 넓어질 수 있습니다.코레일 관리역사의 57%가 안전기준(10cm 이하)을 위반한 사례가 보고된 바 있으며, 곡선 승강장에서는 20~25cm까지 이격거리가 벌어져 장애인 등 교통약자의 안전에 위험이 지적되고 있습니다.공공데이터포털에서는 수도권 1·3호선 등 주요 노선의 승강장이격거리 데이터를 무료로 제공하고 있어, 각 역별 구체적 수치를 확인할 수 있습니다.안전 및 이용 시 유의점이격거리가 10cm를 초과하면 승강장 이용 시 발 빠짐 등 안전사고 위험이 커집니다.곡선 구간, 장애인·어린이 이용 역에서는 이격거리가 더 넓어질 수 있으므로, 이동식 안전발판 등 보조시설 설치가 필요합니다.승강장이격거리는 승객의 안전과 직결되는 중요한 기준이므로, 각 역별 데이터와 현장 상황을 확인하는 것이 중요합니다.
