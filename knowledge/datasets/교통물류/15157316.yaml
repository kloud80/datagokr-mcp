summary_user: 경기도 수원시에 설치된 점멸신호등을 한 곳당 한 행으로 담은 파일로, 주소·위도·경도·교차로명과 점멸 시작·종료 시각, 설치연도를 개별 위치 단위로 기록한다(CSV 약 55KB). 운전자나 교통 분석가가 '수원시에서 밤에 점멸로 바뀌는 교차로는 어디이고 몇 시부터 몇 시까지인가'를 확인하거나, 사고·민원 발생 지점과 점멸 운영 시간대를 비교하는 데 쓴다. 전역 조인 키는 없어 교차로명·주소로 이름을 맞추거나 위도·경도 좌표로 사고 지점·보호구역 같은 다른 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 경기도 수원시에 설치된 신호등 중 점멸 시작 시간과 종료시간외 신호등 위치정보 데이터입니다. 점멸신호등은 밤늦은 시간, 차량  및 보행자가 거의 없을 떄 신호 대기 시간을 줄이고 불필요한 정차를 최소화 하기 위해서 합니다. 또한 신호 통제까지는 필요 없지만 사고 위험은 있는 곳이어서 운전자에게 주의를 주고 싶거나, 교차로 기능을 단순화 하기 위함입니다.  민원 발생 지역 분석, 사고 발생 전 후 비교, 점멸 시간대 최적화 등 활용 할 수 있습니다. 보행자, 운전자 안전을 강화하고 스마트 교통 서비스로 확장이 가능합니다.
