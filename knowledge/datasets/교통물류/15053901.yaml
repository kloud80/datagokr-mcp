description_portal: '지하수 수질검사지하수법 제20조, 지하수의수질보전등에 관한규칙 제12조에 따라 생활용수의 경우 3년 주기로 수질검사 시행* 검사개요  ○ 현    황 : 지하수 발생역사(판암역 등 8역)  ○ 사업내용     - 기    간 : 4월     - 장    소 : 지하수 발생역사(판암, 신흥, 대동, 대전, 중앙로, 중구청, 현충원, 월드컵경기장) 배수펌프실     - 주요내용 : 3년 주기 지하수 발생역사 20항목 수질검사 시행     - 집행계획 : 5월     -기대효과 : 관련법규 준수 및 터널 내 유출지하수를 위생용수로 재활용함으로써 상수도요금 절감 * 활용 용도   ○ 역사에서 용출되는 지하수 생활용수 기준 수질검사 결과(역사에서 용출되는 지하수 생활용수 기준 수질검사 결과)역사에 게시하여 활용되고 있음   ○ 지하수 수질검사 검사항목(지하수법 시행규칙 제41조)       지하수 시행규칙 [별표9]       지하수 수질기준(제41조 관련)     - 지하수를 먹는물로 이용하는 경우: 먹는물관리법 제5조에 따른 먹는물의 수질 기준      - 지하수를 생활용수, 농어업용수 또는 공업용수로 이용하는경우      - 생활용수  : 총대장균군(5000이하), 질산성질소(2mcg_L이하), 염소이온(250mcg_L이하), 카드뮴(0.01mcg_L이하), 비소(0.05mcg_L이하), 시안(0.01mcg_L이하), 수은(0.001mcg_L이하),                            유기인(0.0005mcg_L이하), 페놀(0.005mcg_L이하), 납(0.1mcg_L이하), 6가크롬(0.05mcg_L이하), 111-트리클로로에탄(0.15mcg_L이하), 테트라클로로에틸렌(0.01mcg_L이하),                           트리클로로에틸렌(0.03mcg_L이하), 벤젠(0.015mcg_L이하), 톨루엔(1.0mcg_L이하), 에틸벤젠(0.45mcg_L이하), 크실렌(0.75mcg_L이하)'
