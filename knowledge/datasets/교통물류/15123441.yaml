description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 지구단위계획에 관한 메타데이터이다. 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 지구단위계획은 도시공간의 효율적 개발과 정비를 위해 일정 구역을 대상으로 수립되며, 건축물의 용도, 높이, 배치, 외관 등의 기준을 포함한다. 본 데이터는 계획 내용과 적용 기준을 이해하는 데 도움이 되며, 개발사업, 건축심의, 도시관리계획 수립에 활용할 수 있다. 메타데이터 형식으로 제공되어 시스템 구조와 속성 파악에 유익하며, 정책 수립, 공간정보 분석, 민간 활용 등 다양한 분야의 기초자료로 제공된다.
