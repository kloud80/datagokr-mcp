summary_user: 고양시 자전거도로를 노선 한 줄 단위로 담은 파일로, 노선명·기점·종점·연장과 함께 도로부지·하천부지 구분, 전용도로·전용차로·우선도로·겸용도로 등 자전거도로 종류별 값을 담는다(CSV 약 24KB). 시민이나 교통 분석가가 '고양시에서 출퇴근에 쓸 수 있는 하천변·전용 자전거도로가 어느 구간에 얼마나 되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명·기점·종점 같은 이름 매칭으로만 이어 쓰며, 같은 시군구의 공공자전거 대여소나 킥보드 주차구역 데이터와 지역 단위로 함께 본다.
description_portal: 경기도 고양시는 시민들의 친환경 교통수단 이용 활성화를 위해 자전거도로 인프라를 꾸준히 확충해 왔습니다. 현재 고양시 전역에는 하천변을 따라 조성된 창릉천·공릉천 자전거도로와 한강과 연결되는 평화누리길, 도심 생활권과 연계된 도로형 자전거도로 등이 균형 있게 분포되어 있습니다. 주요 노선은 접근성이 높고 연장이 길어 출퇴근과 여가 활용 모두에 적합하며, 도로 종류 또한 일반도로형·하천부지형·생활형 등 다양합니다. 또한 구간별 너비를 확보해 보행자와 자전거 이용자의 안전한 분리 통행이 가능하도록 설계되었으며, 교통 결절점인 역세권과 연계해 대중교통과의 환승 편의성도 높였습니다. 고양시는 앞으로도 자전거도로 연속성을 강화하고 노선별 특성을 고려한 정비를 추진하여 자전거 친화도시로서의 위상을 확립해 나갈 계획입니다.
