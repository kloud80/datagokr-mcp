summary_user: 부산광역시 남구에 등록된 화물자동차운송주선사업자 중 이사화물 업체의 목록으로, 업체별로 업체명·소재지(주사무소)·전화번호를 한 행씩 담은 건별 원천 파일이다(CSV 약 1KB 규모). 남구 주민이나 이사를 앞둔 사람이 '남구에 등록된 이사화물 주선업체가 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드 컬럼이 없어서, 다른 데이터와는 업체명·주소 문자열 매칭으로만 잇는다. 허가 여부를 교차 확인할 때는 전국화물자동차운송사업자표준데이터가 기준이다.
limits: 사업자등록번호 같은 고유 식별자가 없어 다른 데이터와 정확히 조인할 수 없다. 업체명·주소로 맞춰야 하며, 범위는 부산 남구 한 곳에 한정된다. 허가 상태나 차량 규모 같은 정보는 담지 않으므로, 허가 여부 판단은 전국화물자동차운송사업자표준데이터로 확인해야 한다.
