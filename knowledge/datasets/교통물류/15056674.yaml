summary_user: 국토교통부 표준교통망 DB의 교통링크(도로 구간) 정보를 담으며, 범위는 전국이고 링크 ID(link_id)·도로명·최고속도·도로 등급과 유형·통행 제한 차량 높이와 폭 같은 속성을 제공한다. 교통정보 업계나 분석가가 특정 도로 구간의 제한속도나 도로 등급, 통행 제한 조건이 무엇인지 확인할 때 쓴다. 표준노드링크의 link_id·node_id는 교통 데이터 전반의 공간 기준이지만, 실측 컬럼에서는 전역 조인 키가 확인되지 않아 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로 연결해야 한다.
