summary_user: 충주시 첨단교통관리시스템에 기록된 도로 돌발상황(사고·차량 고장·낙하물·화재 위험물 등)을 건별로 담은 파일로, 발생 위치명·경도·위도와 상황 제목·설명, 고장 차량·낙하물·화재위험물 여부, 외부 연계·전광판 표출 여부를 기록한다. 충주시 교통 담당자나 분석가가 "충주 시내에서 돌발상황이 자주 나는 지점과 유형은 어디·무엇인가"를 따지거나 사고 다발 구간을 고를 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 위치명이나 경도·위도 좌표를 기준으로 공간 매칭하거나 같은 기관(충주시)의 교통 데이터와 이어 쓴다.
limits: 충주시 한 곳만 다루는 개별 위치 단위 자료이며, 포털 설명의 링크 ID는 실측 컬럼에서 조인 키로 확인되지 않아 링크 속도 등과 바로 결합되지 않는다. 파일 다운로드 형태라서 실시간 조회가 아니며, 상습 정체·돌발 패턴 분석에 쓰려면 이력을 따로 쌓아야 한다.
