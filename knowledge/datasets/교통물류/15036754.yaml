summary_user: 울산광역시의 전기자동차 민간 보급 대수를 연도별로 승용·화물·승합 차종별과 합계(대)로 정리한 집계 파일이며, 원본은 215바이트 크기의 작은 CSV입니다. 울산에서 해마다 전기차가 몇 대씩 보급됐는지, 차종별 비중이 어떻게 바뀌었는지를 보려는 분석가나 충전 인프라 수요를 가늠하려는 사업자가 쓴다. 공통 조인 키는 없어서 다른 데이터와는 연도나 울산광역시라는 지역명으로 맞춰 이어 쓴다. 예를 들면 울산 충전소 현황이나 다른 시도의 전기차 보급현황과 비교하는 식이다.
