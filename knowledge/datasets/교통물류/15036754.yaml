description_portal: 울산광역시  전기자동차 민간보급현황 정보로 차종별(승용차, 화물차) 연도별 보급현황 데이터를 제공하고 있습니다. (*2011년 부터 보급시작)울산광역시 대기환경 개선  및 온실가스 감축을 위해 매년 전기자동차 민간 보급사업을 실시합니다. 대상은 개인, 기업체, 법인, 공공기관 등이며, 유형·차종별 구매지원금과 전환지원금을 지원하고 있습니다.추진절차는 무공해차통합누리집을 통하여 접수처리하고 있으며, 공고문은 울산광역시청 홈페이지 또는 무공해차통합누리집(ev.or.kr)을 통하여 확인할 수 있습니다.
