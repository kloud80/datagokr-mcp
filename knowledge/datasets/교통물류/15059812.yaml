summary_user: 전기자동차 급속충전기(충전속도 40kW 이상)의 전국 보급 기수를 연도별로 집계한 작은 파일로, 무공해차 통합누리집(ev.or.kr) 등록 충전기를 해당 연도말 기준으로 셉니다. 정책 분석가나 기자가 "전국 급속충전기가 해마다 몇 기씩 늘었나"를 확인하거나 보급 추세 그래프를 그리는 데 쓴다. 지역 코드나 충전소 ID 같은 조인 키가 없어 연도(년도)를 기준으로 전기차 등록대수 같은 다른 연도별 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: '전기자동차 급속충전기 연도별 보급현황(2023-12-31)입니다. - 단위 : 보급기수 - 전기차 충전기는 무공해차 통합누리집(ev.or.kr)에 등록된 충전기 기준- 본 자료는 해당연도말 기준으로 작성된 자료임- 급속 충전기는 충전속도 40kW 이상의 충전기로서 고속도로 휴게소 등 이동거점에  주로 설치되고 있으며전용충전구역에서 2시간까지 충전이 가능함- 100kW, 200kW의 충전기가 많이 설치되고 있으며, 무공해차 통합누리집에서 충전기가 설치된 곳의 위치와 정보를 확인할 수 있음'
