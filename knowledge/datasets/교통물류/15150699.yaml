summary_user: 국토교통부 국가교통정보센터의 전국 표준 노드(교차로·도로 분기점 등 도로망의 점)를 노드 한 건씩 담은 기본 정보로, 노드 ID·노드 유형·노드명·회전제한 여부·비고 항목을 제공한다. 교통 분석가나 내비게이션·교통정보 서비스 개발자가 "이 노드 ID가 어느 교차로이고 회전제한이 있는가"를 확인하거나, 교통 데이터를 표준노드링크 기준에 맞출 때 쓴다. 노드 ID(ND_ID)는 표준노드링크 체계의 node_id로, 링크·소통정보 등 같은 체계의 교통 데이터와 이어 쓴다. 다만 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름 매핑이나 같은 기관 코드로만 연결된다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
