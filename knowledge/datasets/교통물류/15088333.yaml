summary_user: 서울 강동구에 설치된 바닥신호등을 한 곳당 한 행으로 담은 파일로, 시설명·신호등 유형·도로명/지번 주소·위도·경도·개설년도·관리 전화번호를 포함하며 파일 크기가 373바이트에 불과해 행 수가 적은 개별 시설 목록이다. 강동구 주민이나 보행안전 분석가가 '우리 동네 어느 횡단보도에 바닥신호등이 있고 언제 설치됐나'를 확인하거나 고장 신고처를 찾는 데 쓴다. 전역 조인 키는 없으므로 위도·경도 좌표나 주소를 기준으로 어린이보호구역·교통사고 지점 같은 다른 위치 데이터와 공간적으로 겹쳐 본다.
description_portal: 서울특별시 강동구 내에 설치되어 운영 중인 바닥신호등 현황을 제공하는 공공데이터입니다. 이 데이터는 바닥신호등명, 주소(도로명 및 지번), 위치 좌표(위도·경도)뿐만 아니라 개설 연도, 관리 부서 연락처 등을 상세히 포함하고 있어 지역 내 교통안전 인프라 구축 현황을 파악할 수 있습니다.바닥신호등은 횡단보도 대기선 바닥에 신호 상태를 점등해 주는 보행자 안전 시설물입니다. 스마트폰을 보며 걷는 보행자(스몸비)의 횡단보도 사고를 예방하고, 야간이나 우천 시 보행 신호의 시인성을 극대화하여 어린이와 고령자 등 시민의 안전을 지키는 핵심적인 스마트 교통 인프라입니다.이 데이터를 바탕으로 시민은 생활권 내의 보행 안전시설 현황을 파악해 더욱 안전한 이동 경로를 선택할 수 있습니다. 시설물의 정확한 위치와 관리 연락처가 함께 제공되므로, 고장이나 점등 이상 발생 시 신속하고 정확한 민원 접수도 가능합니다.지자체와 교통 행정 기관은 위치 및 설치 연도 정보를 활용해 체계적인 정기 점검과 유지보수 계획을 수립할 수 있습니다. 유동인구, 교통사고 발생, 어린이보호구역 등 타 데이터와 연계하면 보행 안전 취약 지역을 심층 분석하여 지역 맞춤형 교통안전 정책을 세우는 데 큰 도움이 됩니다. 아울러 관련 연구기관은 보행자 안전 인프라 분포 및 교통안전 시설 효과 분석 등 보행환경 개선 연구를 위한 기초 자료로 폭넓게 활용할 수 있습니다.
