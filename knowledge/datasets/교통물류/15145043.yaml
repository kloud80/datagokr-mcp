description_portal: '활주로방향 조명정보는 활주로의 특정 방향에 설치된 조명 시스템 정보를 제공합니다.제공 항목은 공항식별자, 공항명, 활주로식별자, 활주로방향식별자, 조명위치, 좌표로 구성됩니다.조명 위치 값의 의미는 다음과 같습니다.thr: 활주로 시단등(Threshold light) – 활주로 시작 지점을 표시하는 등화cl: 활주로 중심선등(Centerline light) – 활주로 중앙을 따라 설치된 등화tdz: 착륙구간등(Touchdown zone light) – 항공기의 착륙 목표 구간을 표시하는 등화edge: 활주로 측면등(Runway edge light) – 활주로 경계를 따라 설치된 등화aim: 조준점등(Aiming point light) – 착륙 시 조종사가 목표로 삼는 위치를 표시하는 등화좌표는 위도·경도 10진수(Decimal Degrees) 형식으로 제공되며,예) 37.4659370339301, 126.422218756108 과 같이 표기합니다.'
