summary_user: 대구도시철도 3호선 각 역의 소화기 설비를 역·층·상세위치·소화기 종류별 보유대수로 담은 건별 시설 목록 파일(CSV, 약 6KB)이다. 철도 안전 담당자나 분석가가 '3호선 어느 역 어느 위치에 어떤 종류의 소화기가 몇 대 있는가'를 확인하거나 역별 소화설비 배치를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·선명 같은 이름을 맞춰 잇거나 같은 기관 데이터끼리 묶어 쓴다.
