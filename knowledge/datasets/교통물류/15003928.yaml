summary_user: 교통안전관리자 자격증 발급 건수를 연도별 한 행씩 도로·철도·항공·항만·삭도 다섯 분야로 나누어 담은 전국 단위 집계표로, 포털 설명상 2002~2025년을 다루며 파일은 551바이트 CSV 하나입니다. 자격 취득을 준비하는 수험생이나 교통안전 인력 정책을 보는 분석가가 '분야별 교통안전관리자 신규 배출이 해마다 어떻게 변했나'를 확인하는 데 씁니다. 공통 조인 키나 코드표가 없어 다른 데이터와는 연도(구분) 값을 기준으로 같은 기관의 응시·합격 현황 등과 수작업으로 맞춰 봐야 합니다.
description_portal: 교통안전관리자 자격증 발급 연도별 현황 데이터는 한국교통안전공단에서 교통안전관리자 자격시험을 응시한 인원 중 합격 이상의 점수를 받고 기준을 충족하여 도로교통안전관리자, 철도교통안전관리자, 항공교통안전관리자, 항만교통안전관리자, 삭도교통안전관리자 등 자격증을 발급한 현황 데이터 입니다. * 2002~2025년까지 연도별 행 기준 좌측부터 도로, 철도, 항공, 항만, 삭도교통안전관리자 순으로 자격증 발급 현황을 정리하였습니다.연도별 데이터로 인해 현시점에서 확인이 가능한 2025년 데이터까지 포함하였습니다. 관련 제도는 교통안전법 제53조에 근거하여 시행하고 있습니다.
