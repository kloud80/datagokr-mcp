summary_user: 광양시 관내 육상 운수업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 회사명·대표자·소재지·전화번호·주요 취급 품목이 들어 있다(CSV 약 27KB). 화주나 사업자가 광양에서 특정 품목을 운송하는 업체와 연락처를 찾거나, 분석가가 시 단위 운수업체 분포를 소재지 기준으로 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 회사명·소재지 주소 문자열 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 지역 내 육상운수업 현황을 제공하는 자료로, 회사명, 대표자, 소재지, 전화번호 등 기본 정보와 주요 취급 품목을 포함하고 있습니다. 이를 통해 국민은 해당 운수업체의 영업 현황과 주요 취급 품목을 확인할 수 있으며, 물류 및 운송 서비스 이용에 참고할 수 있습니다. 행정기관은 본 데이터를 활용해 지역별 운송업체 현황을 체계적으로 관리하고, 물류 정책 수립과 교통 인프라 개선에 필요한 기초 자료로 삼을 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 확보하며, 공공데이터 개방을 통해 산업계와 소비자 모두의 정보 접근성을 높이고, 육상운송 산업의 효율성 증진과 지역경제 활성화에 기여할 수 있습니다.
