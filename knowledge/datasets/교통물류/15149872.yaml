summary_user: 대구 도시철도 1·2·3호선의 역사별로 휠체어리프트·엘리베이터·에스컬레이터 대수, 장애인화장실·전용개찰구 개소, 점형·선형 블록 길이, 점자표지·음성유도기 개수 등 교통약자 편의시설 설치 현황을 한 역당 한 행으로 담은 집계 파일(CSV 약 5KB)이다. 휠체어 이용자나 시각장애인이 '어느 역에 엘리베이터나 장애인화장실이 있는가'를 확인하거나, 분석가가 호선별 편의시설 편차를 비교해 접근성 개선 우선 역을 고르는 데 쓴다. 실측 조인 키는 호선(urban_rail_line_no)뿐이고 역 코드는 없으므로, 다른 역 단위 데이터(승하차 인원, 역 좌표 등)와는 호선과 역명 문자열을 맞춰 이어야 한다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 교통약자 이동권 운영정보 데이터로, 도시철도 1·2·3호선 각 역사에 설치된 교통약자 편의시설 및 이동 지원 설비 현황 정보를 제공합니다. 데이터에는 휠체어리프트, 엘리베이터, 에스컬레이터, 전용 개찰구, 출입구 경사로, 장애인 화장실 등 이동 지원 시설과 점형·선형 블록, 점자 표지판, 음성 유도기, 점자 유도선 등 시각장애인 안내 설비, 장애인 픽토그램, 공중전화, 핸드레일, 안내 표지 등 역사 이용 편의시설 관련 정보가 포함되어 있습니다. 해당 데이터는 역사별 교통약자 편의시설 설치 현황을 파악하고, 시설 관리 및 이동 접근성 개선을 위한 기초자료로 활용할 수 있습니다. 또한 교통약자의 도시철도 이용 편의 증진, 접근성 향상 정책 수립, 시설 운영 개선 및 관련 연구 자료 등 다양한 분야에 활용할 수 있습니다. 본 데이터는 연 1회 갱신되며, 도시철도 이용 환경 개선과 교통약자의 이동권 보장을 위한 기반 자료로 활용됩니다.'
