summary_user: 한국교통안전공단 상주교통안전체험교육센터가 운영하는 교육과정별로 연도·교육일·차종에 따른 신청·입교·수료·미수료 인원과 연인원을 담은 집계 실적표이며, 파일 크기가 약 1.5KB(CSV)로 작은 규모입니다. 교통안전 담당자나 분석가가 "체험교육 과정 가운데 신청 대비 수료율이 높은 과정은 무엇이고 차종별 교육 실적은 어떤가"를 살펴보는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키가 없어, 같은 기관의 다른 교육 실적 자료와는 교육과정명·연도 같은 이름 기준으로만 맞춰 쓴다.
description_portal: '- 한국교통안전공단 상주교통안전체험교육센터는 2009년 설립 이래 교통사고로부터 발생되는 국민의 생명과 재산을 보호하기 위해 기존의 이론교육에서 탈피한 현장 실습 위주의 안전운전 체험교육과 저탄소 녹색성장을 위한 에코드라이빙 교육 등 교통사고 사상자 줄이기에 최선을 다하고 있습니다. - 체험교육 수료생 대상 전 후 1년 분석 결과 교통사고 발생 건수가 50%이상 감소한 것으로 나타나 사고 감소에 기여하고 있다는 결과가 나왔습니다. - 이처럼 교통 사고 감소에 기여 중인 상주교통안전체험교육센터에서 운영 중인 교육 프로그램 별 교육 실적 현황 데이터입니다.'
