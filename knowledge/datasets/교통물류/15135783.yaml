summary_user: 주차정보시스템과 연계된 시스템에서 수집한 전국 주차장을 한 행씩 담은 파일로, 연계 시스템의 센터 ID(통합주차정보시스템 ID)와 우편번호 기반 18자리 주차장 관리번호를 제공한다. 실시간 주차정보를 연계하려는 사업자나 분석가가 "이 주차장이 어느 연계 센터에 속하고 관리번호는 무엇인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주차장 관리번호나 이름 매핑으로만 이어 쓰며, 좌표·요금·면수 등은 전국주차장정보표준데이터 같은 원장과 따로 맞춰야 한다.
description_portal: 한국교통안전공단에서 제공하는 정보입니다. 주차정보시스템과 연계된 시스템으로부터 수집한 주차장에 대한 정보를 제공하고 있습니다. 연계된 시스템의 센터 ID와 각 주차장에 부여된 관리번호를 제공합니다. 센터 ID와 주차장 관리번호는 ITS Korea의 실시간 주차정보 수집, 연계 규격에 따라 부여된 정보입니다. 주차장 관리번호는 설치된 지역의 우편번호를 활용하여 부여하며, 총 18자리로 이루어져 있습니다. 해당 정보 이외에 다른 정보를 이용하는 경우 같은 주차장이더라도 관리번호가 다를 수 있으니 유의하시기 바랍니다.
