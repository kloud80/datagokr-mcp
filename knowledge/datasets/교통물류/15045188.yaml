description_portal: 인천광역시 도로조명시설 설치 통계현황 공공데이터는 도시 내 교통 안전과 생활환경 개선을 위해 구축된 조명 인프라의 세부 현황을 체계적으로 제공하는 자료입니다. 주요 항목에는 가로등기구의 램프 종류별 설치 수량(나트륨, 메탈, CDM, CPO, 무전극, LED, 기타), 제어함 개소 수, 선로 길이(km), 보안등 수량 등이 포함됩니다. 또한 가로등주 형태별 설치 현황(1등용, 2등용, 3등용, 4등용, 기타)과 재질별 분류(스텐리스, 주물, 강관, 알루미늄)도 제공되어 시설의 구조적 특성을 파악할 수 있습니다. 공데이터 개방을 통해 시민은 지역별 조명 인프라 수준을 이해할 수 있고, 행정기관은 스마트 조명 도입이나 친환경 정책 추진의 기초 자료로 활용할 수 있습니다.
