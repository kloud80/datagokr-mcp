summary_user: 전국 대중교통 특별교통수단(교통약자용 차량)의 운행현황을 구분별로 인구·장애인수·법정기준대수·운행대수로 정리한 소규모 집계 파일(csv 513 bytes)이다. 지역별로 특별교통수단 운행대수가 법정기준대수를 얼마나 채우는지, 장애인 인구 대비 차량이 충분한지를 따지려는 정책 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분(지역 이름 등)을 이름으로 맞춰 이어야 한다.
description_portal: 한국교통안전공단에서 공개된 데이터를 바탕을 이용하여 추출한 전국의 대중교통 특별교통수단 운행현황 자료입니다.인구 출처는 아래와 같습니다.행정안전부 홈페이지>정책자료>통계>주민등록 인구통계>주민등록 인구 및 세대현황장애인 인구 출처는 아래와 같습니다.국가통계포털>주제별통계>복지>장애인현황교통약자 이동편의 실태조사(국토교통부)자료도 참조하였으며,장애인 인구의 경우 교통약자의 중복산정을 피하기 위해 장애인 중 영유아 및 어린이, 고령자 인구를 제외한 데이터입니다.
