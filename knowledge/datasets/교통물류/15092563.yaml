description_portal: '데이터 개요국토교통부가 제공하는 ‘항공기 조종사 경력년수별 현황’ 데이터는 국내 항공사에 재직 중인 항공기 조종사들의 경력 누적 연수에 따른 분포 현황을 연도별로 정리한 항공종사자 통계입니다.이 자료는 조종사의 **경력 구간(5년 단위)**으로 분류하여 조종사의 숙련도 수준, 세대 간 구성 변화, 장기근속 비중 등을 분석할 수 있는 기초 자료로 활용됩니다. 또한 항공사별 숙련 인력 확보 상황이나 경력단절·전직 위험도 평가, 신규 조종사 비중 분석에도 매우 유용합니다.경력 구간별 분류5년 미만5년 이상 ~ 10년 미만10년 이상 ~ 15년 미만15년 이상 ~ 20년 미만20년 이상데이터 제공구조항공사별(예: 대한항공, 아시아나항공 등)로 각 경력 구간별 조종사 수 제시특정 연도 기준 집계전체 조종사 수(합계) 포함엑셀 파일 형태로 제공활용 안내항공사별 숙련도 인력 보유 현황 평가항공교육기관의 훈련 수요 및 시차 분석항공노동시장 내 경력자 이직 경향 분석항공산업 고경력 인력의 퇴직 타이밍 예측 자료데이터 예시경력구간대한항공아시아나항공제주항공진에어에어부산이스타항공티웨이에어서울에어인천플라이강원에어로케이에어프레미아계5년 미만4242124031536812244939158161,6035~10년 미만8744252062181092712414878192,03910~15년 미만437304344453162773020495815~20년 미만38718390151088421062720년 이상7243151101916087138341,155※ 단위: 명※ 일부 항공사는 장기근속자 또는 신입 조종사 분포가 없을 수 있음※ 기준 시점: 연도 말 기준, 국토교통부 항공정보포털 통계 기준'
