description_portal: 서울교통공사의 신호시스템은 지하철 열차의 안전하고 효율적인 운행을 보장하기 위해 사용되는 핵심 인프라입니다. 파일데이터에는 서울교통공사의 신호설비 현황으로 신호기계실, 신호취급실, 연동장치, 선로전환기, 궤도회로(가청주파(AF), 상용주파(PF)), 신호기장치, 감시장치, 전원장치, 분기부히팅장치, ATS지상자 등이 포함되어 있습니다. 지하철 각 호선에 설치된 설비를 대분류, 중분류, 소분류로 구분하여 설비의 명칭, 수량, 단위, 위치(호선)를 기록한 자산 목록으로, 유지보수, 자산관리, 예산 수립 등에 활용되는 설비 관리용으로 표준 데이터 형식입니다. 2026년 2월 기준 입니다.
