summary_user: 한국건설기술연구원이 제공하는 도로등급 분류 정보로, 등급 코드(ROAD_GRD)와 등급명, 정렬 순서, 참고사항을 담은 전국 단위의 비공간 코드표 성격 데이터다. 교통안전·도로 분야 분석가가 다른 도로·사고 데이터에 나오는 도로등급 코드를 사람이 읽는 등급명으로 풀어 해석할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 도로등급 코드나 등급명이 같은 다른 재난안전데이터와 이름·코드 매핑으로만 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 도로등급 관련 정보입니다.
