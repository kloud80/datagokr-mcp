summary_user: 서울시 공공자전거(따릉이) 이용을 월 단위로 대여소·대여구분(정기·비정기)·성별·연령대별로 묶어 이용건수, 운동량, 탄소절감량, 이동거리, 이동시간을 담은 집계 데이터다. 교통 분석가나 시 담당자가 '어느 대여소에서 어떤 연령대·성별이 얼마나 자주, 얼마나 멀리 타는가'를 따져 대여소 배치나 서비스 개선을 검토하는 데 쓴다. 전역 조인 키는 없고, 대여소번호(STATION_NO)·대여소명을 같은 서울시의 대여소 위치·현황 데이터와 이름·번호로 맞춰 이어 쓴다.
description_portal: 서울특별시 공공자전거 이용정보입니다. 대여일자, 대여소번호, 대여소명, 대여구분(정기,비정기), 성별, 연령대, 이용건수, 운동량, 탄소량, 이동거리, 이동시간 정보를 월별로 제공합니다. 서울특별시 공공자전거 이용정보는 시민들의 자전거 이용 패턴을 파악할 수 있도록 다양한 항목을 체계적으로 제공한다. 이 데이터는 월별 기준으로 정리되며, 대여일자와 대여소번호, 대여소명 등 기본적인 이용 위치 정보부터 대여구분(정기권, 비정기권)까지 포함된다. 또한 이용자의 성별과 연령대 정보가 함께 제공되어 사용자 특성을 분석할 수 있다. 이용건수와 이동거리, 이동시간을 통해 실제 이용 규모와 이동 행태를 파악할 수 있으며, 운동량과 탄소 절감량 정보는 건강 증진 효과와 친환경적 가치까지 확인할 수 있게 한다. 이러한 데이터는 도시 교통 정책 수립과 공공자전거 서비스 개선에 중요한 기초 자료로 활용된다.
