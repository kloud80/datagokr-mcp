summary_user: 부산광역시 가로등을 관리부서별로 묶어 광원 종류(나트륨·메탈·LED·기타)와 기구 용량 구간(50W 이하~2kW 이하)별 설치 수량을 담은 집계표이며, 파일 크기는 약 1.9KB(csv)로 작다. 부산시나 구·군 도로조명 담당자, 에너지 분석가가 "우리 관리부서 가로등 중 LED로 바뀐 비율은 얼마이고, 나트륨·메탈 고와트 등은 얼마나 남았나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 관리부서(구·군·기관) 이름을 맞춰서만 연결한다.
description_portal: 부산광역시  가로등(광원별) 현황 자료로서 구 군별 및 관리 기관별 가로등 기구 용량 및 타입에 따른 전체 수량 데이터 제공합니다. 노선별, 광원별, 재질별 등 체계적으로 분류하여 도로조명시설의 보급 확대 등 관리업무의 원활한 추진을 위한 통계자료임.또한, 각 기관별 연간 예산 집행 및 에너지 절감 내역, 고효율 조명(LED) 교체 건수 등을 파악하여 우수 기관 및  우수 사례 전파하여 안전한 도로 환경 조성에 기여함.통계 분석하여 향후 도로조명 시설 개선 사업에 반영하여 시설개선을 통한 안전사고 및 야간범죄 예방 등 안전하고 쾌적한 도로환경을 조성
