summary_user: 인천 옹진군 각 면에 설치된 가로등을 위치별로 담은 파일로, 면·구분·위치명·설치개수·도로명/지번 주소·설치년도·설치형태·관리기관 전화번호를 개별 주소 단위로 기록한다. 주민이나 군 담당자가 "우리 면 어느 도로에 가로등이 몇 개, 언제 설치됐고 고장 나면 어디에 연락하나"를 확인할 때나, 분석가가 섬 지역 야간 조명 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 면 이름을 매칭해 잇는다.
limits: 표준 코드나 공통 키가 없어 다른 시군구 가로등 데이터나 행정 데이터와 붙이려면 주소·면 이름을 직접 매핑해야 한다. 범위는 옹진군 한 곳뿐이며, 가로등 고장·보수 같은 유지관리 이력은 담지 않는다.
