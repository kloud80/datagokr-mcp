summary_user: 경상남도 창원시에서 2023년 6월 1일부터 12월 31일까지 적발된 불법주정차 단속 건을 한 건씩 담은 원천 파일로, 단속일자·시간, 관할 구청, 단속장소명, 단속장비 구분이 들어 있다. 시민이나 교통 분석가가 '창원시 어느 구, 어느 장소에서 어떤 시간대에 주정차 단속이 몰리는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구청명·장소명 같은 이름 매칭이나 같은 기관(창원시) 자료끼리만 이어 쓴다.
description_portal: 경상남도 창원시 불법주정차 단속 정보입니다. 2023년 6월 1일 부터 2023년 12월 31일 까지 자료이며 항목은 단속일자, 단속시간,  구청구분, 단속장소명, 단속구분(단속장비)입니다.도로 및 지정 구역에서 발생한 불법 주차·정차 건에 대해 단속 시점, 위치, 위반 유형, 과태료 부과 여부 등 주요 정보를 담은 자료입니다. 본 데이터는 단속 빈도 및 패턴 분석, 교통 흐름 개선, 도시 인프라 정책 수립, 민원 대응, 사고 예방 대책 수립 등에 활용될 수 있습니다.단속 건수가 많아 일반 뷰어(엑셀, 메모장 등)에서는 일부 정보만 표시될 수 있으므로, R, Python, GIS 등 전문 분석 도구를 사용한 시각화 및 통계 분석을 권장합니다.위반 기준(시간대, 유형), 과태료 기준, 단속 주체(지자체, 경찰 등), 갱신 시기 등의 세부 정의는 제공기관의 메타데이터나 기술문서를 확인해 주세요.
