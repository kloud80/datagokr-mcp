summary_user: 충청남도 서산시 관내 자동차 매매업소를 업소 한 곳당 한 행으로 담은 파일 목록으로, 업체명·대표자·소재지·전화번호·위도·경도·데이터기준일을 담는다(파일 크기 약 2.8KB의 소규모 CSV). 서산에서 중고차를 사고팔려는 시민이 가까운 매매업소의 위치와 연락처를 찾거나, 분석가가 시내 매매업소 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 사업자번호 등으로 다른 자동차 원장과 직접 잇지 못하고, 주소(소재지)나 위도·경도 좌표로 지도·행정구역 데이터에 공간 결합하거나 업체명으로 맞춰 쓴다.
description_portal: 충청남도 서산시에서 제공하는 본 데이터는 관내 자동차 매매업소의 현황을 정리한 자료이다. 항목은 업체명, 대표자, 소재지, 전화번호, 위도, 경도, 데이터기준일로 구성되며, 시민이 중고차 매매와 관련된 정보를 확인할 수 있도록 제공된다. 본 데이터는 서산시 내 등록된 자동차 매매업소의 위치와 연락처 정보를 포함하고 있어, 차량 구매자와 판매자 간 원활한 거래를 지원한다. 또한 중고차 유통 현황 파악, 민원 대응, 자동차 관련 행정업무에 기초자료로 활용된다. 지역 내 유통업체 분포 분석, 접근성 평가, 소비자 보호 정책 수립에도 참고자료가 된다. 데이터는 정기적으로 갱신되며, 공공기관과 시민에게 유용한 지역 상업정보로 제공된다.
