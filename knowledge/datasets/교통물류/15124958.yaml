description_portal: '지자체별 도로별 사고누적구간 정보 및 사고정보를 기준년도, 도로등급, 도로명 기준으로 조회하여 도로별 사고누적구간 정보 및 구간별 교통사고 상세 현황 정보제공합니다. 지자체별 교통안전대책수립 및 시행계획 등을 수립하는데 도움이 될 수 있습니다. 구간 선정 기준은 과거 3년간(기준년도 포함) 반경 50m 이내, 5건 이상 발생한 상위 30개 지점입니다. 주요제공 정보 : 교통사고원인조사 대상 도로별 사고누적구간 정보(광역지차제명,구간명,발생건수 등) 및 구간결 교통사고 상세 현황 정보(사고정소, 사고형태,기상상태 등)'
