description_portal: 서울교통공사 역직원 폭행 등 감정노동 피해현황 데이터입니다. 자료 요청에 의해 서울교통공사 관할 구간인 1~8호선 276개 역사에 근무중인 역직원의 폭행 등 감정노동 피해현황에 해당하는 정보를 개방합니다. 해당 정보는 경찰이 현장에 출두하여 진술서 작성한 사건 내역을 관리하고 있으며, 역직원 이외의 범죄발생 데이터는 경찰이 관리하고 있음을 참고하여 주시기 바랍니다. 데이터의 항목은 연번, 발생일자, 발생시간, 호선, 전철역코드, 외부역번호, 역명, 피해상황, 피해인원 데이터를 포함하고 있습니다. 역 직원에 대한 폭행 등 악성 민원 행위는 민원처리에 관한 법률, 산업안전보건법 등 관계 법률 및 조례에 따라 응대 거부될 수 있으며, 폭행 등 관련 행위에 따라 철도안전법, 상해죄, 폭행죄 등 관련 법령에 의해 처벌될 수 있습니다.
