      - name: SIGNGU_NM
        required: false
        example: 대덕구
        desc: 신호등이 있는 시, 군, 구의 명칭
      - name: ROADKND
        required: false
        example: 지방도
        desc: 도로의 종류 구분
      - name: ROAD_ROUTE_NO
        required: false
        example: '32'
        desc: 도로의 지정 노선번호
      - name: ROAD_ROUTE_NM
        required: false
        example: 대덕대로
        desc: 도로의 명칭
      - name: ROADROUTEDRC
        required: false
        example: '1'
        desc: 도로노선의 방향 구분 (표현방식/단위 = 01:상행, 02:하행, 03:양방향)
      - name: LNMADR
        required: false
        example: 대덕구 신탄진동 733 도
        desc: 신호등 위치에 대한 상세 지번주소
      - name: LATITUDE
        required: false
        example: '36.45108428000'
        desc: 신호기 기둥의 위도 좌표값
      - name: LONGITUDE
        required: false
        example: '127.42854310000'
        desc: 신호기 기둥의 경도 좌표값
      - name: SGNGNRINSTLMTHD
        required: false
        example: '3'
        desc: 신호기 지주와 신호등의 설치 구조에 따른 방식 (표현방식/단위 = 01:현수식, 02:측주식종형, 03:측주식횡형, 04:중앙주식, 05:문형식, 99:기타)
      - name: ROADTYPE
        required: false
        example: '2'
        desc: 신호등이 위치한 도로의 형태 (표현방식/단위 = 01:단일로, 02:교차로, 99:기타)
      - name: TFCLGHTMANAGENO
        required: false
        example: '20537'
        desc: 신호등관리번호
      - name: TFCLGHTSE
        required: false
        example: '1'
        desc: 신호등의 신호 이용 목적에 따른 구분 (표현방식/단위 = 01:차량등, 02:보행등, 03:버스신호등, 04:자전거신호등, 05:차량보조등, 06:경보등, 07:가변등, 99:기타등)
      - name: TFCLGHTCOLORKND
        required: false
        example: '4'
        desc: 신호를 제공하기 위한 렌즈(신호등면)의 수 (표현방식/단위 = 01:1색등, 02:2색등, 03:3색등, 04:4색등, 99:기타)
      - name: SOTKND
        required: false
        example: '2'
        desc: 렌즈를 통해 빛을 전달하기 위한 광원의 종류 (표현방식/단위 = 01:전구, 02:LED, 99:기타)
      - name: REFERENCEDATE
        required: false
        example: '2022-12-10'
        desc: 데이터 작성 기준일자
