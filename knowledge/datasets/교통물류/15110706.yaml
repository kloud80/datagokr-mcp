summary_user: 대전광역시 시내 신호등의 설치 위치(도로명주소·위도·경도)와 신호등 구분·색 종류·설치 방식 등 속성을 개별 신호등 단위로 담는 API다. 교통 담당자나 분석가가 특정 도로 구간에 어떤 신호등이 설치돼 있는지 확인하는 질문에 쓴다. 주소(LNMADR)와 좌표(LATITUDE·LONGITUDE) 키로 단속카메라·보호구역·횡단보도 등 다른 도로 규제 데이터와 위치 기준으로 이어 쓴다.
description_portal: 대전광역시 신호등조회서비스는 시내 신호등의 설치 위치와 특성 정보를 상세히 제공합니다. 이 데이터는 각 신호등의 위도, 경도, 도로명주소와 함께 신호등 구분(교통신호등, 보행자신호등 등), 신호등 색 종류 및 신호 체계, 작동 방식(자동, 수동, 센서 연동 등) 등 상세 항목을 포함하고 있습니다. 이를 통해 교통관리기관은 신호등의 효율적 운영과 유지보수, 교통 흐름 최적화에 활용할 수 있으며, 보행자 안전 강화 및 교통 혼잡 완화 정책 수립에도 중요한 기초 자료가 됩니다. ※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
