summary_user: 서울시 주요 교차로의 신호 운영 정보를 교차로 단위로 제공하는 API로, 검증 호출에서는 교차로번호·교차로명·지역코드·좌표·갱신날짜를 담은 402행을 받았다. 교통 서비스 개발자나 분석가가 '이 교차로는 어디에 있고, 신호 운영 정보는 언제 갱신됐나'를 확인하고, 신호 제어·교통 흐름 분석의 기준 목록으로 쓴다. 전역 조인 키는 없으므로 교차로번호(INT_NO)나 교차로명으로 같은 기관의 신호 운영 데이터와 잇고, X·Y 좌표로 다른 도로·단속 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 경찰청 교통안전과에서 제공하는 교차로기반정보서비스는 서울시 주요 교차로에서 운영 중인 교통신호등의 상세 운영 정보를 오픈API 형태로 제공합니다. 교차로별로 요일별 신호 운영 계획, 예약된 신호 변경 계획, 현재 운영 중인 신호 계획, 그리고 시간대별 신호 시간 계획 등을 실시간으로 확인할 수 있습니다.이 정보는 교통 흐름 예측 및 최적화, 긴급 차량 우선 신호 제어, 그리고 시민들에게 정확한 교통 정보 제공 등 다양한 분야에 활용될 수 있습니다. 특히 교통 정체 완화 및 교통 안전 증진에 기여할 수 있으며, 스마트 교통 시스템 구축의 중요한 기반 데이터가 될 것입니다. 개발자들은 API를 활용하여 교통 관련 다양한 서비스 및 애플리케이션 개발에 활용할 수 있습니다.
