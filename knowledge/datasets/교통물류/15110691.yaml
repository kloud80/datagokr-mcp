summary_user: 대전광역시 시내 버스정류소를 정류소 한 곳당 한 건으로 담아 정류소 식별자(NODEID)·정류소명·위도·경도를 제공하는 API이며, 범위는 대전시 한 곳이고 위치는 개별 좌표 단위다. 시민이나 앱 개발자가 '내 주변에서 가장 가까운 버스정류소는 어디인가'를 확인하거나, 분석가가 정류소 분포를 지도에 올려 대중교통 접근성을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 정류소명·정류소 ID 매핑이나 대전시 버스 노선·도착정보처럼 같은 기관 코드 체계를 쓰는 데이터로만 이어 쓰며, 좌표를 기준으로 공간 결합하는 방법도 있다.
description_portal: 대전광역시 버스정류소조회서비스는 대전시 내에 설치된 모든 버스정류소의 위치와 기본 정보를 체계적으로 제공합니다. 주요 정보로는 정류소명, 정류소번호, 위도 및 경도 좌표가 포함되어 있어 각 정류소의 정확한 위치 확인이 가능합니다. 또한, 노선별 정류소의 연결 관계와 거리 정보도 포함되어 있어 시민들이 버스 이용 시 정류소 위치와 노선 정보를 효율적으로 활용할 수 있도록 돕습니다. 이 데이터는 대중교통 이용 편의를 향상시키고, 교통관리기관에서는 버스 노선 계획과 운영, 정류소 시설 유지 보수 및 안전 관리 등에 활용할 수 있습니다. ※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
team:
  dept: 법무통계담당관
services:
  - op: /getStatList
    name: 대전광역시 버스정류소 목록 조회
    endpoint: https://apis.data.go.kr/6300000/GetStatListService/getStatList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: '한 페이지 결과 수 (기본값 : 10)'
      - name: pageNo
        required: true
        example: '1'
        desc: '페이지 번호(기본값 : 1)'
      - name: type
        required: true
        example: xml
        desc: XML/JSON 여부
      - name: NODEID
        required: false
        example: 1839-시외2
        desc: 정류장 ID체계에 의한 고유 식별번호
      - name: NODENM
        required: false
        example: 신흥시외버스정류장
        desc: 버스정류소의 명칭
      - name: LATITUDE
        required: false
        example: '36.3231722105'
        desc: 버스정류소의 위도좌표값 입력
      - name: LONGITUDE
        required: false
        example: '127.4452603544'
        desc: 버스정류소의 경도좌표값 입력
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
