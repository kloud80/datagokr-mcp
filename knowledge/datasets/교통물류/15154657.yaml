summary_user: 대구광역시 달서구에서 접수된 불법주정차 신고를 건별로 담은 파일 데이터로, 신고일시·신고위치·과태료 부과 여부·데이터기준일자로 구성되며 CSV 한 파일(약 5.9MB)로 받는다. 달서구 주민이나 교통행정 분석가가 '어느 위치·시간대에 불법주정차 신고가 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가'를 확인해 단속·예방 정책을 세우는 데 쓴다. 실측 컬럼에 전국 공통 조인 키(법정동코드 등)가 없어, 다른 데이터와는 신고위치의 주소·지명 문자열을 매핑하거나 같은 달서구 기관 자료끼리만 연결한다.
description_portal: 대구광역시 달서구 내 불법주정차 신고 및 과태료 부과 현황에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.신고일시, 신고위치,  과태료 부과 여부, 데이터기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.지역 내 불법주정차 신고 및 과태료 부과 현황을 파악하는데 유용하게 참고자료로 쓸 수 있으며 교통행정의 과학적 분석 및 예방 중심의 단속 정책 수립 등의 다양한 행정업무에 쓰는데 활용 가능합니다.
