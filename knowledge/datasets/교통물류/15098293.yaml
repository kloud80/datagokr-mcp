summary_user: 세종특별자치시에 등록된 건설기계를 기종 명칭별로 자가용·영업용·관용 등록 대수로 나눠 담은 집계 데이터이며, 기준일자(crtrYmd)가 함께 붙는다. 건설기계 임대·정비 사업자나 지역 분석가가 '세종시에 굴삭기·덤프트럭 같은 기종이 영업용으로 몇 대 등록돼 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 건설기계 등록현황이나 자동차 등록 통계와는 기종 명칭을 맞추거나 시도 단위로만 이어 쓴다.
limits: 개별 장비나 등록번호·사업자번호가 없는 기종별 대수 집계라 소유자·장비 단위 분석에는 쓰지 못한다. 범위는 세종시 한 곳의 시도 단위 수치이고 읍면동 같은 하위 지역 구분이나 좌표는 없다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 5,000회로 제한된다.
