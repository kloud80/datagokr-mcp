summary_user: 대구 수성구 관내 불법 주정차 단속 내역을 단속 한 건마다 단속일자·단속시간·단속장소로 담은 건별 원천 파일이다(CSV 약 16MB). 주민이나 교통 정책 담당자가 "수성구에서 어느 장소·시간대에 주정차 단속이 몰리는가"를 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속장소 이름을 주소·도로명과 직접 맞추거나 같은 기관 데이터끼리 이어 써야 한다.
limits: 행정동 코드나 좌표 같은 공통 키가 없어 지도나 다른 지역 데이터와 바로 붙일 수 없고, 단속장소 문자열을 따로 매핑해야 한다. 범위는 수성구 한 곳이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
