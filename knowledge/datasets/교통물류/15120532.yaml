summary_user: 안산시 관내에 설치된 공유 전동킥보드·공유자전거 등 개인형 이동수단(PM) 주차구역을 한 곳당 한 행으로 담은 현황 파일로, 상세 위치·주소·법정동·설치일자·데이터기준일자를 담는다. 시민이나 공유 모빌리티 사업자가 '우리 동네 어디에 킥보드 주차구역이 있고 동별로 얼마나 분포하는가'를 확인하거나, 시 담당자가 주차구역 확충 위치를 검토하는 데 쓴다. 전역 조인 키는 없어 법정동 이름이나 주소 문자열로 행정구역 자료와 맞춰 쓰며, 일반 주차장은 전국주차장정보표준데이터가 원장이므로 별도 층으로 다룬다.
description_portal: 이 정보는 개인형이동수단(PM, Personal Mobility) 주차장의 위치, 주소, 설치일자 등을 수록한 현황 자료입니다. 안산시 관내에 설치된 공유 전동킥보드, 공유자전거 등 개인형 이동수단 주차 구역에 대한 정보를 포함하고 있으며, 각 주차장의 상세 위치, 행정구역(법정동), 설치일, 정보 기준일을 제공합니다. 이 정보는 도시 내 이동편의성과 교통 인프라 확충, PM 이용자 편의 증진, 도시 공간 효율적 활용을 위한 정책 자료로 활용될 수 있습니다. 특히 지역별 주차장 분포 분석이나 공유 모빌리티 운영계획 수립, 교통약자 접근성 개선, 스마트시티 교통 서비스 구축 등 다양한 행정적 활용이 가능합니다.
