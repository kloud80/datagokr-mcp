summary_user: 인천국제공항에서 출발하는 화물기의 하계 정기운항 스케줄을 운항편 단위로 담은 파일 데이터로, 운항요일·편명·예정 출발시각·운항 시작일과 종료일·항공사·목적지를 담는다. 물류업체나 화주가 하계 기간 특정 목적지로 가는 화물기가 무슨 요일, 몇 시에, 어느 항공사 편으로 뜨는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 운항·통계 데이터와는 편명·항공사명·목적지 이름을 맞춰서만 연결한다.
description_portal: 인천국제공항공사에서 제공하는 화물기 하계 정기운항편 출발 데이터입니다. 본 데이터는 인천국제공항에서 출발하는 하계 화물기의 주요 운항 정보를 종합적으로 제공하고 있습니다. 해당 데이터는 화물기의 운항요일,운항편명,예정시각,목적지,시작일자,종료일자,항공사, 목적지에 대한 정기운항 정보를 제공하고 있습니다.운항 요일, 항공사명, 목적지 정보는 국문·영문·중문·일문 등 다국어로 제공되어, 국내외 다양한 이용자들이 언어 장벽 없이 데이터를 쉽게 활용할 수 있도록 지원하고 있습니다.
