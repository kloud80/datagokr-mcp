description_portal: 서울교통공사는 국내 최고의 지하철 관련 기술 노하우를 보유하고 있으며, R&D에 심혈을 기울여 국내·외 지하철 관련 기관의 모범이 되고 있습니다. 각종 연구과제 또는 직무와 관련한 아이디어를 적극적으로 발굴하여 산업재산권 출원 및 등록을 체계적으로 진행하고 있으며, 효율적인 유지관리 업무에 만전을 기하고 있습니다. 더불어 산업재산권 실시권 허락 등을 통한 기술료 수입으로 공사의 수익 증대에 기여하고 있습니다. 위 자료는 서울교통공사 산업재산권 등록 정보, 연번, 구분, 발명의 명칭, 등록일자, 등록번호로 구성되어 있습니다. 이 자료는 반기별로 업데이트 될 예정입니다.
