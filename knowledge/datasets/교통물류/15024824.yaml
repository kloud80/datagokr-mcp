summary_user: 서울교통공사가 보유한 산업재산권의 등록 정보를 한 건당 한 행으로 담은 파일로, 구분(특허·실용신안 등), 발명의 명칭, 등록일자, 등록번호로 구성된다. 공사가 어떤 지하철 관련 기술을 언제 권리로 등록했는지 알고 싶은 기술 실시 희망 사업자나, 공공기관 R&D 성과를 비교하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 등록번호나 발명 명칭을 기준으로 특허 정보와 직접 맞춰 보는 방식으로만 이어 쓴다.
