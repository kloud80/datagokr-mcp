summary_user: 부산광역시 강서구 불법주정차 문자알림 서비스에서 나간 단속 건을 한 행씩 담은 건별 원천 파일로, 건 번호·단속시간·단속구분(사전단속 예보 알림인지 유예 시간 뒤 단속확정 통보인지)·단속장비를 담는다. 강서구 주민이나 분석가가 '언제, 어떤 장비로 사전단속 알림이 얼마나 나가고 그중 얼마가 확정 단속으로 이어지는가'를 시간대·장비별로 따져 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 같은 기관(강서구) 기준이나 시간대 같은 이름·값 매핑으로만 이어 쓴다.
description_portal: 부산광역시 강서구에서 운영하는 불법주정차 단속 문자알림 서비스에 사용되는 단속 세부 사항에 대한 정보를 제공해 드립니다.이 서비스는 구민들의 불필요한 과태료 부과를 예방하고 원활한 차량 소통을 유도하기 위해 시행됩니다. 제공되는 정보에는 단속 건을 식별하는 고유 번호, 초기단속일자, 단속의 성격을 구분하는 단속구분, 그리고 단속에 사용된 장비 정보(단속장비)가 포함됩니다."단속구분" 항목은 두 가지로 나뉘는데, "사전단속"은 실제로 과태료를 부과하기 전 차량 이동을 유도하기 위한 예보성 알림을 의미하며, "단속확정"은 규정된 유예 시간 이후에 단속이 최종 확정되었음을 통보하는 것을 나타냅니다.
