summary_user: 광주 도시철도의 월별 영업 운행거리·운행횟수·전체 및 전동차 전력 사용량(kWh)·전기요금·총 승객수와 승객 1인당 전력사용량·요금을 월 단위 집계로 담은 파일(csv, 약 8KB)이며, 포털 설명상 2017년부터 기록된다. 운영 분석가나 에너지 정책 담당자가 "승객 한 명을 실어 나르는 데 드는 전기량과 전기요금이 계절·연도별로 어떻게 달라지는가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월(구분) 기준으로 같은 기관의 승하차 통계 등과 맞춰 붙여야 한다.
description_portal: 이 데이터는 광주교통공사의 월별 수송 전력 사용 현황을 분석한 자료입니다. 주요 항목은 구분(연월), 영업 운행거리(km), 운행횟수, 전체 전력 사용량(kWh), 전동차 전력 사용량(kWh), 전기요금, 총 승객수, 승객 1인당 전기사용량, 승객 1인당 전기사용요금입니다. 기록 기간은 2017년부터 시작되며, 월별로 운행거리와 횟수, 전력 사용량, 전기요금이 함께 제공됩니다. 전동차 전력 사용량은 전체 전력 사용량 중 실제 차량 운행에 투입된 전력을 의미하며, 승객 1인당 전기사용량과 요금은 효율성을 분석하는 지표로 활용됩니다. 이 자료는 운행 효율성 평가, 에너지 절감 방안 마련, 운송 단가 분석, 계절별 전력 수요 변화 파악 등 교통 운영 최적화와 환경·경제적 정책 수립에 중요한 기초 자료가 됩니다.
