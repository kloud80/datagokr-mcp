summary_user: 서울시설공단이 운영하는 공영주차장의 시간대별 입차대수와 출차대수를 주차장 단위로 집계한 파일 데이터로, 2025-06-01~2026-06-30 기간에 322,286행을 담는다. 분석가나 정책 담당자가 어느 주차장이 어느 시간대에 붐비는지, 시간대별 차량 흐름이 어떤지 살필 때 쓴다. 전역 조인 키가 없어 주차장명으로 이름 매핑을 하거나 같은 기관 코드로 연결해야 하며, 좌표·요금·면수 원장인 전국주차장정보표준데이터와는 이름 대조를 거쳐 잇는다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와 곧바로 결합되지 않는다. 입출차 집계라서 현재 주차 가능 대수를 알려 주는 실시간 데이터가 아니며, 실시간 가능 대수는 지자체·공단별 비표준 API로 따로 확인해야 한다. 명세상 갱신은 연간이고 실측 최신 행은 2026-06-30이다.
