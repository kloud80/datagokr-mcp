summary_user: 전라남도 나주시에 등록된 일반화물자동차운송사업 업체를 한 행씩 담은 업체 목록으로, 업체명·면허종류·차량 등록대수·읍면동 단위 주소를 담는다. 화주나 물류 사업자가 "나주에 있는 이 운송사가 허가받은 일반화물 운송업체이고 차량을 몇 대 보유했나"를 확인하거나, 시 단위 화물운송 업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 같은 이름 매칭으로만 잇고, 허가 여부 기준은 전국화물자동차운송사업자표준데이터와 대조해 쓴다.
