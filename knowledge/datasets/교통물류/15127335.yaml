description_portal: '창원시 버스노선 및 운행대수 현황- 시내버스 : 창원~마산, 창원~진해, 마산~진해, 창원지역, 마산지역, 진해지역- 마을버스 : 창원지역, 진해지역지자체 또는 교통 운영 기관이 관리하는 버스 노선 정보와 해당 노선에 배정된 차량 수를 종합한 자료입니다. 이 데이터는 노선별 주행 차량대수, 지역별 운행 밀도 분석, 대중교통 이용 실태 파악, 운송 자원 배치, 정책 기획 및 민원 처리 등에 활용될 수 있습니다.운행대수가 많은 경우 일반 뷰어(엑셀, 메모장 등)에서는 일부만 표시될 수 있으니 R, Python, GIS 등 전문 도구를 사용해 분석·시각화하는 것이 좋습니다.노선 유형(시내·광역·행선지 등), 집계 시점, 차량 운행 기준(평일, 주말 등)에 대한 세부 정의는 제공기관의 메타데이터나 기술문서를 참고하시기 바랍니다.'
