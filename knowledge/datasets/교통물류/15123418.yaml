summary_user: 서산시 도시계획정보시스템 안에서 기타용도구역을 담는 테이블·컬럼 구조를 정리한 메타데이터로, 시스템명·데이터베이스명·영문/한글 테이블명·영문/한글 컬럼명 7개 항목을 담은 작은 CSV 파일(약 2.6KB)이다. 구역 지정 현황 자체가 아니라 시스템 설계 정보이므로, 서산시 도시계획 DB에 어떤 테이블과 컬럼이 있는지 확인하려는 시스템 연계 담당자나 분석가가 원천 자료를 요청하기 전에 구조를 파악하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관이 낸 도시계획정보시스템 메타데이터 파일들과 테이블명·컬럼명을 이름으로 맞춰 보는 식으로만 이어 쓴다.
limits: 구역의 위치·면적·지정일 같은 실제 구역 정보는 없고 테이블·컬럼 정의만 있어 공간 분석이나 도로 계획 판단에는 쓰지 못한다. 명세상 수시 갱신이며 한 번 생성된 뒤 바뀌지 않는 형태라 최신 시스템 구조와 다를 수 있고, 다른 데이터와 연결할 공통 코드가 없다.
