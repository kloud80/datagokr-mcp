summary_user: 철도 분야에서 취득할 수 있는 자격증을 한 행에 하나씩, 게시글 순번·자격증 정식 명칭·상세 설명(자격증정보)으로 담은 전국 단위 비공간 목록 파일(CSV)이다. 철도 산업 취업이나 이직을 준비하는 사람이 "철도 기관사나 시설 직무에 어떤 자격증이 필요한가" 같은 진로 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 자격증명 문자열을 직접 맞춰 이어 쓴다.
limits: 코드형 조인 키가 없어 다른 자격·채용 데이터와 기계적으로 결합하기 어렵다. 자격증정보는 서술형 상세 설명이어서 시험 일정이나 응시 자격처럼 구조화된 항목으로 바로 나누어 쓰기 어렵다.
