description_portal: '전기차 충전시설은 전기차(EV, Electric Vehicle)의 배터리를 충전할 수 있도록 설치된 장비와 공간을 의미합니다. 전기차 충전시설의 종류1.  완속 충전기 (AC 충전)  - 전력 용량: 보통 3~7kW, 충전 시간: 약 4~10시간  - 설치 장소: 아파트, 주택, 직장 등2. 급속 충전기 (DC 충전)  - 전력 용량: 50~350kW 이상, 충전 시간: 20~60분 내외  - 설치 장소: 고속도로 휴게소, 대형마트, 공공시설 등3. 초급속 충전기 (고출력 DC)  - 150kW 이상 출력  - 10~30분 내외로 충전 가능 (차량 호환 필요)4. 공공 충전소: 지방자치단체나 민간업체가 설치, 누구나 사용 가능5. 공동주택 충전소: 아파트, 오피스텔 등의 주차장, 입주민 중심 사용6. 자가용 충전기: 단독주택이나 빌라 등 개인용 충전기, 거주자 본인만 사용7. 이동형 충전기 (휴대용): 일반 220V 콘센트에 연결, 출력은 작지만 비상용으로 유용창녕군시설관리공단  공공시설 전기차 설치 현황 데이터를 제공합니다.'
