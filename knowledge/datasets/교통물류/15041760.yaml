summary_user: 광양시를 오가는 시외버스의 노선별 운행 시간표와 요금을 출발지·도착지·시간·구분·요일·요금(원) 단위로 담은 CSV 파일(약 17KB)이다. 광양에서 특정 도시로 가는 시외버스가 몇 시에 있고 요금이 얼마인지 확인하려는 주민·여행자, 지역 시외버스 운행 현황을 살피는 분석가가 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 버스 노선·정류장 데이터와는 출발지·도착지 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 시외버스 운행에 관한 시간표 및 요금 정보를 제공하는 자료로, 출발지와 도착지, 운행 시간, 구분, 요일 등 주요 정보를 포함하고 있습니다. 이를 통해 이용자는 원하는 노선의 운행 시간과 요금을 확인할 수 있으며, 교통 편의를 높일 수 있습니다. 행정기관은 본 데이터를 기반으로 교통정책 수립, 대중교통 수요 분석, 노선 운영 효율성 개선 등에 활용할 수 있습니다. 또한 데이터 기준일을 명시하여 최신성과 신뢰성을 확보하였으며, 공공데이터 개방을 통해 국민의 교통 정보 접근성을 높이고, 대중교통 서비스 품질 향상과 이용 편의 증진에 기여합니다.
