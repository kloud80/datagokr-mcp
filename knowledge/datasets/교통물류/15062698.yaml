summary_user: 통영시 도시정보시스템에 등록된 장애인 편의 도로시설(점자 유도블록 등)을 시설 한 건씩 담은 원천 목록으로, 시설 구분·재질, 유도블록 연장(m)·면적, 행정읍면동, 경도·위도를 포함하며 범위는 통영시 한 곳이다. 지자체 담당자나 보행 접근성 분석가가 '통영시 어느 동에 유도블록이 얼마나, 어떤 재질로 깔려 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 도로구간번호·관리번호로 같은 기관의 다른 도시정보시스템 자료와 잇고, 경도·위도로 지도 위에서 다른 공간 데이터와 겹쳐 본다.
description_portal: 통영시 도시정보시스템에서는 장애인 편의 도로시설의 설치 현황과 특성을 체계적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호를 통해 시설의 위치를 정확히 확인할 수 있으며, 장애인 편의시설 구분 정보를 통해 시설의 종류와 기능을 구체적으로 파악할 수 있습니다. 또한 장애인 편의시설 재질 정보는 시설의 구조적 특성과 내구성을 이해하는 데 활용됩니다. 이러한 자료는 장애인 접근성 개선, 안전한 도로 이용 환경 조성, 시설 점검 및 유지보수, 도시 계획 및 교통 정책 수립 등 다양한 행정과 운영 업무에서 중요한 기초자료로 활용되며, 시민 모두가 안전하고 편리하게 도로를 이용할 수 있는 환경을 마련하는 데 필수적인 정보를 제공합니다.
