summary_user: 전국 철도역의 자전거 보관시설을 역·출구 단위로 담은 파일로, 운영기관 코드·노선명·역명·출구번호·보관 가능 대수·상세 위치를 기록한다(포털 기준 2,793건). 자전거를 타고 역에 가는 이용자가 '이 역 몇 번 출구에 자전거를 몇 대까지 세울 수 있나'를 확인하거나, 분석가가 노선·역별 보관대 규모를 비교해 자전거-철도 연계 인프라 확충 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 역 데이터와는 역명·노선명 매핑이나 같은 철도운영기관코드로만 이어 쓴다.
limits: 표준 역 코드 같은 전역 조인 키가 없어 역 시설·승하차 데이터와 붙이려면 역명·노선명 이름 매칭이 필요하다. 행정구역이나 좌표가 없는 비공간 데이터라 지도 표시나 시군구별 집계는 별도 매핑 없이는 어렵다.
