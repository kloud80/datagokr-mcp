summary_user: 부산광역시에 설치된 시각장애인용 음향신호기를 설치 지점별로 담은 데이터로, 구·군, 설치 위치와 주소, 설치업체·설치연도, 상태, 경위도 좌표가 한 행에 들어 있다. 시각장애인 보행 지원 단체나 교통 분석가가 '우리 구의 어느 교차로 횡단보도에 음향신호기가 있는가'를 확인하거나 미설치 구간을 찾는 데 쓴다. 전역 조인 키는 없어 구·군 이름이나 주소로 맞추거나, 좌표(lng·lat)로 횡단보도·어린이보호구역 등 다른 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 교통약자의 이동편의와 교통사고 예방을 위해 시각장애인 밀집 거주지역 및 보행수요가 많은 교차로, 민원 요구 지점에 시각장애인용 음향신호기를 설치 하였습니다.보행신호등에 설치하는 시각장애인용 음향신호기는 버튼 및 리모컨을 통해 횡단보도의 방향이나 보행신호를 음성으로 알리는 장치입니다.지능형 음향신호기는 IoT기술이 적용된 디지털 방식의 음향신호기로 고장 여부 및 작동상태 등을 원격으로 실시간 모니터링을 할 수 있고, 음향 크기도 원격으로 조정할 수 있어고장 시 능독적 대처와 신속한 민원 처리가 가능합니다.현재 부산시는 신호등이 있는 횡단보도 5,617개소중 2,660개소 5,320대를 설치 운영중에 있습니다.
