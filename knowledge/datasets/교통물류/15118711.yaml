summary_user: 서울교통공사가 운영하는 9호선 2·3단계 구간 역사의 에스컬레이터를 한 대씩 담은 설비 목록으로, 역명·호기·상하행 구분·근접 출입구·시작층과 종료층(지상/지하, 층, 상세위치)·형폭·승강기 일련번호를 포함하며 포털 설명상 2026년 1월 기준이다. 교통약자나 승객이 '이 역 몇 번 출입구 쪽에 상행 에스컬레이터가 있는가'를 확인하거나, 분석가가 역별 에스컬레이터 대수와 배치를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 역·시설 데이터와는 역명이나 호선 이름을 맞춰 연결하며, 승강기 일련번호(승강기일련번호)는 승강기 등록번호로 쓰이는 값이다.
