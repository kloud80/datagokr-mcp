description_portal: '"제주특별자치도에서 제공하는 어린이보호구역 내 어린이승하차구역 관련 데이터를 제공합니다.항목: 도로명, 보차분리여부, 어린이 승하차 구역 폭 (m), 위도, 경도 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 어린이승하차: 허가된 구역 내에서는 어린이를 태우거나 내리려는 경우에는 통학버스는 물론 학부모 자가용 등 일반자동차도 어린이보호구역 안에서 5분내 정차가 가능함'
