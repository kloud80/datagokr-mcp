description_portal: 경상북도 문경시_굴착공사 허가정보 공공데이터는 2025년 문경시 도로관리심의회 심의·의결조서를 바탕으로 작성한 자료로, 문경시 관내 도로 굴착공사에 대한 행정 허가 현황을 제공하기 위한 데이터입니다.본 데이터에는 공사명, 굴착위치, 사업내용, 사업시작일, 사업종료일, 심의결과, 시행처, 데이터기준일 등의 항목이 포함되어 있으며, 도로 굴착공사에 대한 심의 결과 및 사업 추진 현황을 시민에게 투명하게 공개하고 행정·연구·정책 수립 등의 기초자료로 활용할 수 있도록 구성되었습니다.제공되는 정보는 데이터기준일 현재 유효한 심의·의결 결과를 기준으로 작성되었으며, 이후 행정 절차 진행 상황에 따라 실제 공사 내용과 일부 차이가 발생할 수 있습니다.해당 공공데이터는 문경시청 건설과에서 관리하는 데이터입니다.
