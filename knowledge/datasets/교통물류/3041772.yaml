summary_user: 광주광역시 5개 자치구(동구·서구·남구·북구·광산구)별로 화물자동차 등록 대수를 일반·개인 구분과 합계로 담은 집계 파일이며, 2025년 12월 31일 기준 한 시점 자료다. 지역 물류 분석가나 행정 담당자가 "광주에서 화물차가 가장 많이 등록된 자치구는 어디이고, 일반과 개인 등록 비중은 어떻게 다른가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 자치구 단위 통계와는 자치구 이름을 맞춰 붙여야 하며, 개별 운송사·주선사의 허가 여부는 전국화물자동차운송사업자표준데이터 같은 원장 데이터로 따로 본다.
limits: 자치구 단위 합계만 있어 차량별·업체별 정보나 운송사업 허가 여부는 알 수 없고, 한 시점 집계라 추이 비교에는 다른 시점 파일이 필요하다. 행정코드가 없어 다른 데이터와 연결할 때 자치구 이름으로 직접 매핑해야 한다.
