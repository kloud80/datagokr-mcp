summary_user: 대구광역시 도시철도역의 출구 번호별로 그 인근에 있는 시내버스 정류소를 짝지어 담은 목록으로, 역 ID·역명·출구번호·정류소 ID·정류소명이 한 행을 이루는 CSV 파일(약 15KB)이다. 시민이나 교통 분석가가 '이 지하철역 몇 번 출구로 나가면 어느 버스 정류소에서 갈아탈 수 있나'를 확인하거나 환승 안내·경로 분석을 할 때 쓴다. 전국 공통 조인 키는 없으므로, 정류소 ID나 정류소명을 대구시 버스정보(BIS) 정류소·노선 자료와 맞춰 보거나 역 ID·역명을 대구 도시철도 역 자료와 이름·코드 매핑으로 연결해 쓴다.
description_portal: 대구광역시 도시철도역 출구 인근에 위치한 시내버스 정류소 목록 정보입니다. 본 자료는 도시철도역 ID, 도시철도역명, 도시철도역 출구 번호, 정류소 ID, 정류소명 등의 내용을 포함하고 있으며, CSV 파일 형식으로 제공됩니다. 이를 통해 대구광역시의 도시철도역과 시내버스 정류소 간의 위치 정보를 파악할 수 있고, 대중교통 환승 안내 및 경로 분석에 활용할 수 있습니다. 추가로 궁금하신 사항이나 의견이 있으시면 대구광역시 교통정보운영과 교통운영팀(☎053-803-6861)로 연락주시기 바랍니다.
