summary_user: 교통영향평가 평가대행자가 체결한 계약을 건별(계약일련번호 단위)로 담은 전국 파일 데이터로, 사업명·소재지 주소·사업규모·사업유형과 발주자, 계약일자·계약금액·낙찰률·지분율·계약상태를 담는다. 개발사업 인근 입지를 검토하는 사업자나 분석가가 '이 지역에서 어떤 유형의 사업이 교통영향평가 계약을 맺었고 계약금액·낙찰률은 어느 수준인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 소재지 주소·우편번호로 행정구역이나 좌표에 맞추거나, 평가대행자명·발주자 이름으로 다른 데이터와 매핑해 잇는다.
description_portal: 교통영향평가를 수행하는 평가대행자가 체결한 사업지에 대한 교통영향평가 계약 기초정보를 제공합니다. 사업지 정보, 사업기간, 사업유형/구분, 발주자 정보와 계약기간, 금액 등의 정보를 제공합니다.
