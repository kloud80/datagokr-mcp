summary_user: 제주특별자치도가 집계한 시내·외 버스 수송 인원을 연도와 버스 구분(시내·시외 등)별로 담은 연 단위 집계 통계로, 포털 설명상 2001~2020년을 다루며 2017년 시내·시외 통합 이후 변화도 포함한다. 교통 분석가나 정책 담당자가 '제주 버스 이용객이 2017년 대중교통 개편 전후로 어떻게 달라졌나' 같은 연도별 이용 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준 연도를 맞춰 인구·관광객 통계 등과 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 이 데이터셋은 2001년부터 2020년까지 제주특별자치도청이 집계한 제주 지역 시내·외 버스의 연도별 수송 인원 정보를 체계적으로 정리한 공공 통계자료이다. 버스 구분(시내버스, 시외버스 등)에 따라 연도별 승객 수가 구분되어 있으며, 2017년부터 시내와 시외 버스가 통합된 이후의 변화도 포함하고 있다. 이 정보는 제주 지역의 대중교통 이용 추세를 분석하거나, 교통 정책 수립, 버스 노선 운영 효율성 검토, 승객 수 변동과 인구 및 관광객 변화 간 상관관계 분석 등에 활용 가능하다. 또한 대중교통 활성화 방안 마련, 환경 영향 평가, 도시계획 또는 지속가능한 교통 인프라 구축을 위한 기초자료로서 유용하며, 다양한 연구 및 행정 목적으로 신뢰성 있게 사용될 수 있다.
