summary_user: 전국 9개 도 지자체를 대상으로 수집한 시외버스 운송사업자의 경영현황을 도별(경기·강원·충북·충남·전북·전남·경북·경남)로 묶어 자산총계·부채총계·자본총계·운송수익·운송원가를 백만원 단위로 담은 집계 파일입니다(파일 크기 368바이트의 소규모 표). 분석가나 정책 담당자가 '어느 도의 시외버스 업계가 운송원가 대비 운송수익이 낮아 재정 지원이 필요한가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도 이름(구분)을 직접 맞춰서만 연결한다.
description_portal: 한국교통안전공단에서전국 9개 도 지자체를 대상으로 수집한 전국 대중교통 시외버스 경영현황 자료입니다.(경영부문 작성업체에 한함)경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남으로 구분하여 데이터를 제공하고 있습니다.데이터는 자산총계, 부채총계, 자본총계, 운송수익, 운송원가로 구분하여 데이터를 제공하고 있습니다.이때 자산총계 = 부채총계 + 자본총계 입니다.단위는 백만원입니다.해당 데이터를 통해 대중교통 운영자 현황을 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.
