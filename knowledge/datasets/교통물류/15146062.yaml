summary_user: 인천교통공사가 운영하는 인천1호선·인천2호선·7호선 인천·부천구간의 역별 장애인 화장실 설치현황을 2025년 6월 30일 기준으로 역·설치위치 단위로 담은 파일(csv)입니다. 휠체어 이용자나 보호자가 '이 역에 장애인 화장실이 있는지, 승강장에서 얼마나 떨어져 있는지'를 확인하거나, 분석가가 호선별 장애인 위생시설 미설치 역을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 역 정보·승하차 데이터와는 호선과 역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 인천교통공사에서 운영중인 도시철도 인천1호선, 인천2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준 역별 장애인 위생시설(화장실) 설치현황입니다.해당 데이터는 호선, 역명, 설치위치, 위생기구, 승강거리(m) 항목으로 구성되어있습니다.인천1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역 중26개역에 장애인 위생시설이 설치되어있습니다.인천2호선은 검단오류역에서 운연역까지 총 27개역에 모두 설치되어있고,7호선 인천·부천구간도 까치울역에서 석남역까지 총 11개역에 모두 설치되어있습니다.
