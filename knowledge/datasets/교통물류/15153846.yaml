description_portal: 이 데이터는 한국철도공사의 화물 보관 및 하역 작업에 따른 제요금(諸要金) 산정 내역을 제공하는 화물 부대 서비스 요금 관리 데이터입니다. "화물정보_화물유치요금" 데이터는 역별·구역별 화물 하치장 사용 신청 건에 대해 사용 시작·종료 일자, 제요금 면제 여부, 화물 하치장 구분(갑지, 을지 등), 구역 구분(야적, 상옥, 컨테이너 등), 구역 요금 및 면적, CY 공동 사용 여부, 단가 적용 일수, 정산 이전·이후 단가, 단가 변동 일자 등을 상세히 기록하여 하치장 사용에 따른 유치 요금 산정 근거와 정산 내역을 추적합니다. "화물정보_CFS작업요금보관요금" 데이터는 CFS(Container Freight Station, 컨테이너 화물 집배송 시설) 내 작업량을 톤수별(작업1~4톤수) 및 CBM(Cubic Meter, 용적) 단위별(작업CBM1~4)로 구분하여 각각의 작업 금액을 산정하고, 보관 톤수·CBM·보관 기간에 따른 보관 금액, CFS 총 영수 금액 및 작업 요금을 집계합니다. 이 통합 데이터는 화물 유치 및 CFS 작업 요금 체계 분석, 구역별·시설별 단가 적용 기준 및 변동 추이 파악, 하치장 및 CFS 시설 수익성 평가, 요금 정산 프로세스 검증 및 투명성 제고, 화물 보관·하역 서비스 가격 정책 수립, 철도 화물 부대 서비스 개선 및 경쟁력 강화 연구에 필수적인 제요금 관리 데이터로 활용됩니다.
