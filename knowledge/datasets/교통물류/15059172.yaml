summary_user: 경기도 관할 도로의 교량·터널·고가교 등 주요 도로시설물을 시설물 한 건씩 담고, 집계년도·시군별로 명칭·시설물 구분·위치·준공년도·종별·노선명을 제공한다. 도로 관리 담당자나 분석가가 '우리 시군에 준공 30년이 넘은 교량·터널이 어디에 몇 개 있는가' 같은 노후 시설물 파악과 보수 계획 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 노선명·시설물명 같은 이름 매칭으로만 이어 쓴다.
description_portal: ‘도로시설물 현황’ 데이터는 경기도 관할 도로에 설치·관리되는 교량·터널·고가교 등 주요 도로시설물의 분포와 특성을 연간 단위로 집계한 공공데이터입니다. 집계년도 (SUM_YY)를 기준으로 시군명(SIGUN_NM)·시군코드(SIGUN_CD)별 시설물 정보를 제공하며, 각 시설물의 명칭(FACLTS_NM), 시설물구분명(FACLTS_DIV_NM), 위치(FACLTS_LOC), 준공년도(FACLTS_COMPLTN_YY), 종별구분명(ASORTMT_DIV_NM), 노선명(ROUTE_NM), 비고(RM) 항목이 포함됩니다.데이터는 도로 설계 및 보수 계획 수립, 재난 · 안전관리, 스마트시티 인프라 구축, 도로자산 관리시스템(DAMS) 구축 연구 등에서 활용 가능하며, Open API를 통해 인증키만 있으면 제한 없이 조회할 수 있어 민간·학계 모두 접근성이 높습니다. 활용 시에는 ① 시설물 위치가 행정경계 변경에 따라 달라질 수 있으므로 최신 행정구역 코드를 함께 검증하고, ② 준공년도(FACLTS_COMPLTN_YY)가 ‘미상’으로 표기된 경우 별도 현장 확인이 필요합니다.이 데이터를 통해 이용 기관은 사각지대 시설물의 노후도 분석, 교통 혼잡 구간별 구조물 안전등급 평가, 긴급 재난 대응 경로 시뮬레이션 등에 필요한 기초 정보를 확보할 수 있으며, 데이터 개방으로 도로 안전성 제고 및 예산 효율화 효과를 기대할 수 있습니다.
