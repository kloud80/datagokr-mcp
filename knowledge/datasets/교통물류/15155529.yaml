description_portal: 드론 활용의 촉진 및 기반조성에 관한 법률 제9조의2의 근거로 구축된 드론 정보통합시스템은 분산된 드론 정보를 통합하여 한곳에서 편리하게 조회하고 데이터 기반 정책 연구 및 개발을 위해 활용되고 있다. 2022년12월에 구축완료 후 법 시행일인 2023년 5월16일에 맞춰 운영을 게시하였다. 보유 중인 정보는 기체, 사용사업체, 사고, 자격정보 등이다. 시스템 운영정보의 일부인 SMS발송 통계를 공개하여 시스템의 활용현황을 알리고자 한다. 탬플릿에서 기본은 문자로 발송되었고, 그 외 값은 카카오톡으로 발송되었다.
