description_portal: '항공자격시험(ARTS) 항공종사자 자격시험 정보 공개(영어등급관리현황) 입니다. 해당파일을 통해 확인하실 수 있습니다. - 본 데이터는 항공안전법 제45조제2항에 따른 항공영어구술능력증명시험의 등급관리현황과 관련된 자료입니다. - 항공영어구술능력증명시험의 등급은 6등급으로 구분하되, 6등급 항공영어구술능력증명시험에 응시하려는 사람은 응시원서 접수 당시 유효기간 내에 있는 5등급 항공영어구술능력증명을 보유하고 시험을 응시합니다. - 항공영어구술능력증명시험을 4등급 이상으로 부여 받은 경우에 1. 두 나라 이상을 운항하는 항공기의 조종 또는 2. 두 나라 이상을 운항하는 항공기에 대한 관제 또는 3. 「공항시설법」 제53조에 따른 항공통신업무 중 두 나라 이상을 운항하는 항공기에 대한 무선통신 업무를 수행할 수 있습니다. - 항공영어구술능력증명의 등급별 유효기간은 다음 각 호의 구분에 따른 기준일부터 계산하여 4등급은 3년, 5등급은 6년, 6등급은 영구로 합니다.    1. 최초 응시자(항공영어구술능력증명의 유효기간이 지난 사람을 포함한다): 합격 통지일   2. 4등급 또는 5등급의 항공영어구술능력증명을 받은 사람이 유효기간이 끝나기 전 6개월 이내에 항공영어구술능력증명시험에 합격한 경우: 기존 증명의 유효기간이 끝난 다음 날'
