description_portal: 자료는 보행안전지수 지도 제작을 위한 중간 단계 데이터로, 도로구간별 중앙분리대 설치 현황을 공간 위치 기반으로 정리한 정보입니다. 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분 등의 기본 속성과 중앙분리대 유무 및 상세 구조 정보를 함께 제공하며, 각 시설의 위치는 TM 중부 GRS80 좌표계 기준의 위도·경도 값으로 표시되어 있습니다. 해당 데이터는 차도와 보도·차로 간 물리적 구분 상태를 파악할 수 있어 차량과 보행자의 충돌 위험을 줄이는 시설의 효율성을 분석하는 데 활용됩니다. 보행자 안전 측면에서 분리시설이 설치된 위치와 미설치 구간을 비교함으로써 잠재적 사고다발지역을 진단하는 데 기초자료로 이용됩니다. 이 데이터는 2022년 기준 1회성 수집된 자료로서 시각화 및 정책 참고용 분석 데이터로 활용하는 것이 적합합니다.
