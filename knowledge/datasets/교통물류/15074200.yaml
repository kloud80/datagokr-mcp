description_portal: 한국교통안전공단에서 교통카드를 이용해 전국 데이터를 분석하여 추출한 대중교통 이용인원 현황 자료입니다.해당 데이터는 평일과 주말(토요일, 일요일)별로 이용인원을 제공하고 있습니다.전국(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)으로 구분하여 데이터를 제공하고 있습니다.단위는 명, 통행입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
