description_portal: '- 전라남도 내 시군에 위치한 공유전동킥보드 업체명 및 킥보드 대수에 관한 데이터를 제공합니다.- 공유 전동킥보드는 여러 사람이 함께 사용할 수 있도록 도시 곳곳에 배치된 전동 킥보드입니다. 스마트폰 앱을 통해 대여 및 반납이 가능하며, 단거리 이동이나 출퇴근 시 "라스트 마일" 교통수단으로 인기를 끌고 있습니다.- 주요 특징- 간편한 대여: QR코드 스캔 또는 앱으로 대여- 무인 운용: 정해진 주차장 없이 도로변, 인도 등에 주차 가능 (도시별로 규제 차이 있음)- 친환경 이동수단: 전기를 사용해 배출가스 없음- 단거리 이동 최적화: 보통 2~5km 이동에 적합- 이용 방법 예시- 앱 설치 및 회원가입- 지도에서 가까운 킥보드 확인- QR코드 스캔하여 대여- 목적지 도착 후 정해진 방법으로 반납- 이용요금 자동 결제'
