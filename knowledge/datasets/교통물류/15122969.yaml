summary_user: 수도권 도시철도의 급행 노선별로 정차역을 운행 순서대로 담은 파일로, 한 행이 급행명·구성 순서·역명 하나씩인 정차 목록이다(csv 약 6.9KB). 이용자나 분석가가 '용산-동인천 급행·특급, 서울역-신창, 서울역-인천공항 급행이 어느 역에 서는가'를 확인하거나 급행 정차역 여부로 역세권을 구분하는 데 쓴다. 전역 조인 키나 역 코드가 없어 역 좌표·승하차 데이터와는 역명을 맞춰서만 이을 수 있다.
description_portal: 대한민국 수도권 도시철도 구간의 급행열차 정보로 급행선명이나 급행구성의 순서를 담고 있으며 급행선에 포함되는 역명의 정보를 담고 있습니다.용산-동인천(급행)은 용산을 출발기점으로 동인천 종점까지 16개역에 정차합니다.용산-신창행은 용산을 출발기점으로 신창(순천향대) 종점까지 23개역에 정차합니다.서울역-신창행은 서울역을 출발기점으로 신창(순천향대) 종점까지 21개역에 정차하고 있습니다.용산-동인천(특급)은 용산역을 출발하여 동인천역 까지 9개역에 정차 합니다.서울역-인천공항행은 서울역, 인천공항1터미널, 인천공항2터미널에만 정차 합니다.
