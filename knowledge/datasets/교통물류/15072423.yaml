summary_user: 교통안전정보관리시스템 이용자를 대상으로 한 설문조사 결과를 문항별로 집계한 xlsx 파일로, 정보검색 편리성·신속성, 화면 디자인, 접근성, 활용도 만족도와 방문 횟수·목적, 많이 쓰는 서비스, 불편사항을 담는다(포털 설명상 2024년 조사 기준, 전국·비공간). 시스템 운영자나 분석가가 '이용자들은 어떤 목적으로 방문하고 어떤 점을 불편해하는가'를 확인해 서비스 개선 방향을 잡을 때 쓴다. 실측 컬럼에서 조인 키를 찾지 못해 다른 데이터와 직접 결합하기 어렵고, 같은 기관의 다른 연도 설문 자료와 문항명을 맞춰 비교하는 정도로만 이어 쓴다.
description_portal: '교통안전정보관리시스템의 서비스 제공현황에 관한 고객만족도와 신규서비스 개발 및 서비스 개선에 관한 이용자의 수요를 파악하기 위한 설문조사 결과입니다. 조사항목 : 교통안전정보관리시스템 이용에 따른 의식변화 여부, 정보검색 편리성 만족도, 정보검색 신속성 만족도, 메인화면 디자인 만족도, 정보의 접근성 만족도, 정보활용도 만족도,시스템 방문횟수, 시스템 방문 목적, 시스템에서 가장 많이 이용하는 서비스,이용시 불편사항 설문조사년 매년 실시하고 있으며 해당 자료는 2024년 설문조사 기준입니다.'
