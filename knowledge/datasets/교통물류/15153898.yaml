summary_user: 한국철도공사가 철도로 운송한 컨테이너를 건별로 기록한 원천 데이터로, 화물 수탁일자·컨테이너 번호·화차 차량번호·예약번호와 함께 컨테이너 크기(20·40피트)·높이, 공컨테이너·실화물 구분 품목명, 내적 중량·실제 중량, 화차당 컨테이너 수를 전국 범위로 담는다. 물류 분석가가 "철도로 나르는 컨테이너 중 공컨테이너 비율은 얼마이고 20피트와 40피트 운송량은 어떻게 나뉘는가" 같은 질문이나 화차 적재 효율을 따질 때 쓴다. 전역 조인 키는 없어서, 같은 기관의 다른 철도 화물 데이터와는 컨테이너 번호·화차 차량번호·예약번호처럼 이름이 같은 컬럼을 맞춰 이어 붙여야 한다.
