description_portal: 이 데이터는 한국철도공사의 컨테이너 화물 운송 시 적재된 컨테이너의 규격 정보와 적재 내역을 통합하여 제공하는 컨테이너 물류 관리 데이터입니다. 화물 수탁 일자, 컨테이너 번호, 화차 차량번호, 화통 번호, 예약 번호, EDI 관리번호와 함께 컨테이너 크기(20피트, 40피트 등), 컨테이너 높이, 사용 여부, 봉인번호, 품목명(컨20공, 컨40영 등 공컨테이너·실화물 구분), 화물 내적수, 화물 내적 중량, 실제 중량, 화차 개당 컨테이너 수, 사유화차 공동 사용 여부, 내적 화물명 등 컨테이너의 물리적 규격과 적재 상태를 상세히 기록합니다. 이 데이터는 컨테이너 규격별(20피트/40피트) 운송량 및 수요 분석, 공컨테이너와 실화물 컨테이너 운송 비율 파악, 컨테이너 중량 적재 패턴 및 화차 활용 효율성 평가, 컨테이너 봉인 관리 및 보안 추적, 예약-수탁-운송 단계별 컨테이너 이력 관리, 철도 컨테이너 물류 네트워크 최적화, 항만-철도 연계 복합 운송 정책 수립 등에 필수적인 컨테이너 운송 이력 데이터로 활용됩니다.
