summary_user: 경기도 버스운송관리시스템(BMS)에 입력된 데이터를 기간별로 마감한 기록을 마감 건 단위로 담으며, 각 건에 마감일자 번호·코드, 대상 기간의 시작일·종료일, 마감시간, 등록일시가 있다. 버스 운송 실적을 분석하는 분석가가 "특정 기간의 BMS 집계는 언제 마감된 값인가"를 확인해 집계 기준 시점을 맞추는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 BMS 운송 데이터와는 시작일·종료일 같은 날짜 범위나 같은 기관 코드로만 맞춰 연결한다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)의 입력 마감일자에 관한 정보를 포함하고 있습니다. 데이터는 마감일자번호, 마감일자코드, 시작일, 종료일, 마감시간, 등록일자 항목으로 구성되어 있으며, 특정 기간 동안 BMS에 입력된 데이터를 마감한 시점과 그 관련 정보를 제공합니다. 이를 통해 각 마감 기간의 데이터 입력 시점을 파악할 수 있으며, 운송정보 집계나 시스템 관리의 기준이 되는 시간정보를 확인할 수 있습니다. 특히, 마감시간은 데이터를 마무리한 시점을 의미하며, 시스템 운영 및 데이터 분석 시 기준점으로 활용될 수 있습니다.
