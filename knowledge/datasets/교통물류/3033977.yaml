summary_user: 광주광역시 자치구별로 승용·승합·화물·특수 자동차 등록 대수를 관용·자가용·영업용으로 나눠 담은 집계표로, 포털 설명상 2025년 12월 31일 기준이며 437바이트 크기의 작은 CSV 파일이다. 분석가나 사업자가 "광주 어느 자치구에 영업용 화물차가 많은가"처럼 자치구별 차종·용도 분포를 비교할 때 쓴다. 전역 조인 키가 없어 자치구 이름을 기준으로 다른 시군구 단위 통계(인구·사업체 등)와 이름 매핑으로 이어 쓴다.
