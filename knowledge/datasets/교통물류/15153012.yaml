summary_user: 경상남도 양산시에 접수된 불법주정차 신고·단속 건을 건별로 담은 파일 자료로, 신고일·신고 위치·과태료 부과 여부·단속구분(시민 신고/CCTV 등)을 담는다. 시민이나 분석가가 '양산시에서 불법주정차가 자주 적발되는 구간과 요일은 어디이고, 신고 건 중 실제 과태료가 부과된 비율은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 신고 위치의 주소·지명 문자열을 매칭하는 방식으로만 주정차 금지구역·단속카메라 등 다른 자료와 이어 쓸 수 있다.
