summary_user: 국토교통부 국가교통정보센터의 도로 본선 구간 기본정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 제공하며, 구간 하나가 한 행으로 노선 번호·이름, 시작·끝 지점명, 구간 길이, 시작·끝 좌표와 서비스·예측 여부를 담는다. 교통정보 분석가가 특정 도로 노선이 어떤 구간으로 나뉘고 각 구간의 길이와 위치가 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 도로 번호·도로명이나 구간 시작·끝 이름을 맞추거나 구간 ID(MLSN_ID)를 쓰는 같은 기관 교통정보 데이터와 맞춰 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
