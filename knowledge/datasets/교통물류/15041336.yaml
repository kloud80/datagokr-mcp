summary_user: 수인선 역마다 운영기관명, 노선명, 역명과 십진수 도(DD) 형식의 경도·위도를 한 행씩 담은 역 위치 원천 파일로, 2,948바이트 크기의 CSV로 받는다. 분석가나 사업자가 '수인선 각 역은 지도상 어디에 있고 특정 주소나 시설이 어느 역의 역세권에 드는가'를 판정할 때 기준 좌표로 쓴다. 전역 조인 키는 없어서, 다른 철도 데이터와는 역명·노선명을 맞춰 붙이거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 한국철도공사에서 운영하는 수인선의 역 위치에 대한 데이터로 철도운영기관명,선명,역명,경도,위도 등이 있습니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
