summary_user: 교통수단(버스·지하철 등)별로 하루 동안 발생·도착한 통행 인원을 시군구 단위로 담은 API 데이터이며, 검증 호출에서는 전국 685행(2025-08-01 하루분)을 받았다. 대중교통 운영 담당자나 분석가가 특정 시군구의 시간대·이용자유형별 수단 통행량이 어떤지 볼 때 쓴다. 시군구코드(sgg_cd)로 다른 데이터의 시군구 코드와 이어 쓰며, 이 코드는 다른 데이터에서 먼저 받아 넘겨야 한다.
limits: 필수 파라미터 sgg_cd는 다른 데이터의 코드를 먼저 받아 넘겨야 한다. 일별·월별·연별 오퍼레이션 3개(/getDailyTransportationModeTripVolume, /getMonthlyTransportationModeTripVolume, /getAnnualTransportationModeTripVolume)는 최소 파라미터로 응답이 없었다. 확인된 최신 행 날짜(2025-08-01)는 검증 호출 조건에 따른 것이라 데이터 자체의 최신성과 다를 수 있다.
