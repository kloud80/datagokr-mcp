summary_user: 성남시 관내 도로·보행공간에 설치된 울타리와 무단횡단 방지펜스의 위치를 시설 단위로 담은 원천 목록으로, 각 건에 위경도 좌표, 보호구역ID, 대상시설명, 관할경찰서명, 이미지명이 들어 있다. 성남시 교통안전 담당자나 분석가가 "어린이 보호구역 주변에 무단횡단 방지펜스가 어디에 설치돼 있고 빈 구간은 어디인가"를 확인하는 데 쓴다. 전국 공통 조인 키는 없어서, 보호구역ID(sfznid)나 대상시설명으로 어린이보호구역 자료와 이름·코드를 맞추거나 좌표로 다른 공간 데이터와 겹쳐 쓴다.
limits: 성남시 한 곳만 다루며 다른 시군구 자료는 없다. 전역 조인 키가 없어 다른 데이터와 붙일 때는 이름·코드 매핑이나 좌표 대조가 필요하다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 5,000회로 제한된다.
