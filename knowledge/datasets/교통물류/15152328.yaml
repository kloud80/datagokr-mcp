description_portal: 이 데이터는 2024년 안전신문고를 통해 국민들이 직접 접수한 불법 주정차 신고 민원 현황을 체계적으로 정리한 파일입니다. 해당 데이터는 전국 각지에서 시민들이 스마트폰 앱 또는 홈페이지를 활용하여 도로교통법, 소방기본법 등 관련 법령에 따라 불법 주정차로 의심되는 차량 또는 상황을 촬영 및 신고한 사례들을 포함합니다. 신고는 대표적으로 버스정류소, 횡단보도, 소화전, 교차로 모퉁이 등 4대·6대 불법 주정차 구역을 대상으로 하며, 제출 시에는 동일 위치에서 1분 이상의 간격을 두고 2장 이상의 사진 첨부와 함께 신고 위치, 상황 설명 등이 요구됩니다. 데이터는 과태료 부과 여부를 포함하여 행정기관의 확인 또는 조치 결과까지 기록되어, 교통질서 준수, 보행자 안전 확보, 도시 내 불법 주정차 근절 등 정책 수립과 효과 분석, 연구 자료로 활용할 수 있습니다. 이러한 자료는 공공기관, 지자체, 민간 등 다양한 주체가 활용 가능하며, 데이터 개방을 통해 시민의 안전 의식 고취와 열린 행정 실현에 기여합니다.
