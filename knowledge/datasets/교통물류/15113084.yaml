summary_user: 대전광역시 서구가 운영하는 시간제 주차노선을 노선 단위로 담은 행정 원천 파일로, 노선명·설치연도·주차면수·주차구간 연장과 주간·야간·주말·공휴일 허용시간, 구간 시작·끝 위경도를 함께 싣는다. 서구 주민이나 상인이 '우리 동네 어느 도로에서 몇 시에 주차가 허용되는가'를 확인하거나, 분석가가 동별 도로변 주차 공급 규모를 파악하는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 인구·상권·불법주정차 단속 자료와 잇고, 행정동코드와 위경도로 행정동 통계나 지도 위 다른 주차장 자료와 겹쳐 본다.
limits: 범위가 대전 서구 한 시군구에 한정되어 다른 구나 시 전체와 비교하려면 별도 자료가 필요하다. 파일이 약 1KB 수준으로 작아 노선 수가 적으며, 실제 주차 이용률이나 회전율 같은 운영 실적은 담지 않는다.
