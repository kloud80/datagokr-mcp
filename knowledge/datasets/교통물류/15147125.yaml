summary_user: 경기도 파주시에 등록된 물류창고업 사업자를 업체 한 곳당 한 행으로 담은 파일(csv, 약 9KB)로, 업체명·사업자등록번호·대표자명·도로명/지번 주소·위도·경도를 포함한다. 물류 기업이나 정책 담당자가 '파주시 안에서 물류창고가 어느 지역에 몰려 있고, 고속도로·IC와는 얼마나 떨어져 있나'를 지도로 확인할 때 쓴다. 사업자등록번호(bizno)를 키로 사업자 상태조회·기업정보 데이터와 잇고, 좌표·주소로 다른 물류시설·교통시설 데이터와 공간 결합한다.
description_portal: 경기도 파주시 관내에 등록된 물류창고업 사업자들의 정보를 포함하고 있는 공공데이터로, 업체명, 사업자등록번호, 대표자명, 도로명주소, 지번주소, 위도, 경도로 구성되어 있습니다. 이 데이터는 행정구역 기반 분석, 지도 시각화, 공간 통계 분석, 물류 동선 최적화 등 위치기반 기능 구현, 전국 물류 인프라 현황을 파악하거나 지역별 창고 집중도, 창고 접근성, 물류허브 선정 등 스마트 물류 정책 수립 및 민간 물류서비스 개발에 필요한 실증, 지역 기반 산업 분석, 창고 입지의 공간적 분포, 물류시설의 군집 특성 등 공간·산업 융합형 연구, GIS 기반 분석, 공간통계, 거리 기반 분석, 행정구역 단위의 분류 및 시각화, 지역 물류 인프라 격차 해소, 물류 집적지 선정, 교통 인프라 연계성 연구 등에 활용될 수 있습니다.
