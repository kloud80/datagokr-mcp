summary_user: 인천광역시 택시에 단 IoT 센서가 측정한 도로 주변 기온(섭씨)을 센서·측정 시각·위경도·지오해시·시군구·동 단위로 기록한 건별 원천 파일이며, 압축 파일 크기만 약 368MB에 이른다. 폭염 때 인천 어느 동네 도로가 특히 뜨거웠는지, 도시 열섬이 어디에 몰리는지를 살피는 분석가나 도로 안전·폭염 대응 담당자가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군구·동 이름을 맞추거나 위경도·지오해시로 공간 결합해 이어 쓴다.
description_portal: '인천광역시가 제공하는 도로 주변 온도 공공데이터는 택시에 장착된 IoT 디바이스를 통해 실시간으로 수집된 기온 정보를 체계적으로 기록한 자료입니다.주요 항목은 센서명으로 데이터 수집 장치를 구분하고, 시간을 통해 측정 시점을 기록합니다. 또한 위도·경도·지오해시를 통해 위치를 정밀하게 표시하며, 시·군구·법정동 단위로 행정구역별 분류가 가능합니다. 핵심 지표인 온도(섭씨)는 도로 주변의 실제 기온을 제공하여, 폭염 대응, 도로 안전 관리, 도시 열섬 현상 분석 등에 활용됩니다.항목 : 센서명 / 시간 / 위도 / 경도 / 지오해시 / 시 / 군구 / 법정동 / 온도(섭씨)'
