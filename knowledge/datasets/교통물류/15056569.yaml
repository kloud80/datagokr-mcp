summary_user: 서울시 주요 교차로 신호등의 운영 계획을 교차로별(교차로번호·교차로명)로 담은 API로, 요일별·특정일 예약 신호 계획과 계획 번호, 수집 일시를 건별로 제공한다. 교통 분석가나 ITS 개발자가 '이 교차로는 어떤 날 어떤 신호 계획으로 운영되는가'를 확인해 신호 최적화나 교통 흐름 분석에 쓴다. 전역 조인 키는 없어서, 다른 신호·교통 데이터와는 교차로번호(INT_NO)·교차로명 같은 이름·코드 매핑이나 지역코드를 통해서만 이어 쓴다.
