summary_user: 인천 미추홀구 관내 자전거보관대를 시설 하나당 한 행으로 담은 건별 현황 파일로, 시설 유형·설치 위치·보관대 조수·주차 대수·공기주입기 수를 담는다(CSV 약 1.6KB의 소규모 파일). 주민이나 구 교통 담당자가 "우리 동네 역이나 학교 주변에 자전거를 몇 대 세울 수 있고 공기주입기가 있는가", "보관대가 부족한 곳은 어디인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치위치 이름을 맞추거나 같은 기관(미추홀구) 단위로만 이어 쓴다.
limits: 좌표나 행정코드가 없어 지도 위 분석이나 다른 지역 데이터와의 직접 결합은 이름 매칭에 기대야 한다. 보관대 위치·규모만 담고 있어 공공자전거 실시간 잔여 대수나 자전거도로 노선 정보는 얻을 수 없다.
