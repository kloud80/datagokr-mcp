summary_user: 경기도 31개 시군의 시외버스 운송사업체 인허가 현황을 업체(사업장) 한 곳당 한 행으로 담으며, 인허가·등록·면허 유효기간, 영업상태와 폐업일자, 소유형태·업체유형, 주소와 위경도를 포함하고 포털 설명상 2018년 9월 이후 정기 갱신은 중단됐다. 교통정책 분석가나 사업자가 '경기도 어느 시군에 시외버스 업체가 몰려 있고 그중 지금 영업 중인 곳은 어디인가'를 확인할 때 쓴다. 실측상 전역 조인 키는 없어서, 다른 데이터와는 시군명·시군코드(SIGUN_CD)로 같은 경기도 데이터끼리 잇거나 사업장명 매칭, 위경도 좌표를 이용한 공간 결합으로 연결한다.
description_portal: 경기도 내 시외버스업 현황 데이터는 경기도를 기점으로 하여 둘 이상의 도시를 연결하는 시외버스 운영 업체 정보를 제공한다. 시외버스는 정기 노선을 기반으로 장거리 이동 수단을 제공하며, 도심과 도심 외곽, 타 시도 간 이동을 지원하는 중요한 교통 수단이다. 본 데이터는 자동차(버스)를 사용하여 유상으로 여객을 운송하는 업체 중 시외버스를 운영하는 업체들의 인허가 현황을 포함한다. 사업장명, 인허가일자, 영업상태, 폐업일자 등 기본 행정 정보를 포함하며, 등록일자와 면허 발급일 및 유효기간도 기록되어 있어 업체의 법적·제도적 운영 기반을 확인할 수 있다. 또한 소유형태, 업체유형, 지정정비업종 관련 정보가 제공되어 기업 운영의 특성과 안전 관리 수준을 파악하는 데 활용 가능하다.위치 관련 정보로는 도로명주소, 지번주소, 우편번호, WGS84 위도·경도 좌표가 포함되어 있어 지도 기반 분석 및 공간 데이터 활용이 가능하다. 이를 통해 시외버스 업체의 지역별 분포를 확인하고, 주요 교통거점과의 접근성을 분석할 수 있다. 본 데이터는 경기도 31개 시군의 인허가 자료를 기반으로 수집되었으며, 지방행정데이터개방시스템을 통해 제공되었다. 다만 시스템 개편으로 인해 2018년 9월 이후 정기 갱신은 중단되었으므로, 이후의 최신 현황은 별도의 행정 경로를 통해 확인해야 한다.이 데이터는 경기도 교통정책 수립, 시외버스 노선 최적화, 지역 간 교통망 분석 등에 유용하게 활용될 수 있다. 특히 교통 수요가 높은 지역과 낮은 지역의 격차를 파악하여 교통 인프라 확충이나 노선 신설·조정에 기초 자료로 쓰일 수 있다. 또한 시외버스 운영 업체의 안전 관리 수준을 점검하거나 여객 수송 효율성을 높이기 위한 정책 설계에 참고할 수 있다. 관광객 이동 경로 분석, 지역 간 경제적 연결망 구축, 교통 소외 지역 지원 정책에도 활용될 수 있어 공공 및 민간 부문 모두에서 실질적 가치가 있는 데이터이다.
