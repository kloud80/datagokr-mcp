summary_user: 청주시시설관리공단이 운영하는 노상·노외·부설 공영주차장을 주차장 한 곳당 한 행으로 담은 일회성 파일로, 주차면수·장애인면수·급지·기본·추가·당일최고 요금(원)·급속·완속 충전기 수·주소·위경도를 포함한다(csv 약 3KB). 청주 시민이나 방문객이 "전기차 충전기가 있는 공영주차장 중 요금이 싼 곳은 어디인가"를 찾거나, 분석가가 청주 공영주차장의 급지별 요금·면수 분포를 볼 때 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 등과는 주차장명·주소 매칭이나 위경도 근접 비교로만 이어 쓴다.
description_portal: '청주시시설관리공단의 공영 주차장 운영 데이터는 노상·노외·부설 주차장을 포함하며, 주차장명, 총면수(장애인 포함), 급지, 요금(기본·추가·최고), 전기차 충전기 수(급속·완속), 설치 위치, 위도·경도 정보로 구성됩니다. 공공서비스 및 교통편의 향상에 활용됩니다.본 데이터는 일회성 제공으로, 변경사항이 없는 한 별도 업데이트는 예정되어 있지 않습니다.참고1) 요금의 단위: 원참고2) 공영주차장은 지방자치단체나 공공기관이 직접 설치하고 운영하는 주차장으로, 주차난 해소와 도시 교통 혼잡 개선을 목적으로 조성되며, 비교적 저렴한 요금으로 시민에게 주차 편의를 제공합니다.'
