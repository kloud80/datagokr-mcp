summary_user: 부산광역시 구군별 교통안전시설물 부착대(표지판·신호등 등을 고정하는 지주·구조물)를 한 행에 한 개씩 담은 건별 원천 파일로, 시군구·동·리·도로명·교차로명과 경도·위도 좌표를 담는다. 도로 관리 부서나 분석가가 특정 교차로·도로 구간에 부착대가 어디에 몇 개 설치돼 있는지 지도에서 확인하고 시설물 점검 대상을 추릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구명·동명 같은 행정구역 이름 매칭이나 경도·위도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '부산광역시 16개 구군의 교통안전시설물 부착대에 관한 데이터를 제공합니다.1. 교통안전시설물 부착대란?부착대는 교통안전시설물(예: 교통표지판, 신호등, CCTV, 가로등 등)을 도로나 건축물에 고정하거나 지지하기 위해 설치하는 장치나 구조물입니다.일반적으로 철재, 알루미늄 등 내구성이 강한 재질로 만들어져 교통안전시설물의 안정적 설치와 유지 관리를 돕습니다.2. 공공데이터의 주요 항목설치 위치: 위도/경도 좌표, 도로명 주소, 행정구역 등부착대 유형: 철제, 알루미늄, 콘크리트 등 재질 및 구조 종류설치 목적 및 용도: 교통표지판 부착용, CCTV 부착용, 가로등 지지용 등규격 및 크기: 길이, 높이, 두께 등 물리적 사양관리 정보: 설치 일자, 유지보수 기록, 관리 주체(시/군/구청 등)상태 정보: 정상, 파손, 교체 필요 여부3. 데이터 활용 예도로 안전 점검 및 시설물 유지보수 계획 수립스마트 교통 시스템 구축 시 기반 데이터로 활용교통사고 예방을 위한 안전시설물 위치 분석시민 및 관계 기관 대상 교통안전 정보 제공4. 데이터 제공처 및 접근법공공데이터 포털(data.go.kr) 및 각 지방자치단체의 교통 관련 부서에서 제공보통 CSV, Excel, JSON 등의 형식으로 공개되며, API를 통한 실시간 데이터 접근도 가능데이터에는 시설물 위치, 종류, 설치 시기, 상태 등이 포함되어 있음'
