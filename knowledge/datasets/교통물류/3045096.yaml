summary_user: 대전 도시철도의 운임표를 이용 대상(어른·청소년·어린이 등)과 승차권 종류(교통카드·토큰형승차권)별로 1구간·2구간 금액으로 정리한 516바이트짜리 작은 CSV 파일로, 건별 기록이 아니라 요금 기준표다. 대전 지하철 이용자나 교통비를 계산하는 분석가가 '청소년이 교통카드로 2구간을 타면 얼마인가' 같은 질문에 답할 때 쓰며, 분석용보다는 서비스용 조회 자료에 가깝다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대상·승차권종별 같은 이름 매핑이나 같은 기관(대전교통공사)의 역·승하차 데이터와 묶는 방식으로만 이어 쓴다.
description_portal: 고객운송약관에 따른면운송계약의 성립 시기는 다음과 같습니다.. 이 경우 고객은 이 약관과 약관을 시행하는데 필요한 사항을 규정한 내규에 동의한 것으로 봅니다.1. 고객이 정해진 운임을 지급하고 토큰형승차권을 구입한 때2. 교통카드 이용자는 개표를 한 때3. 우대권사용자는 토큰형승차권을 교부받은 때4. 보호자와 함께 여행하는 유아는 보호자가 개표를 한 때약관에 정하지 아니한 교통카드 이용에 관한 사항은 카드사업자와 교통카드소지자 간의 계약에 따릅니다.대전도시철도운임은 2024.1.1. 변동되었습니다.승차권운임의 구분은 교통카드운임과 자체승차권인 토큰형승차권 운임으로 나눌수 있습니다.교통카드 운임을 기준으로 어른은 1구간 1550원 2구간 1650원청소년(만13세 이상 만18세까지) 1구간 880원 2구간 960원어린이(만6세이상 만12세까지) 1구간 550원 2구간 600원이며토큰형승차권 기준으로 어른은 1구간 1700원 2구간 1800원청소년(만13세 이상 만18세까지) 1구간 1700원 2구간 1800원어린이(만6세이상 만12세까지) 1구간 600원 2구간 650원입니다.단체권은 다음과 같습니다.(‘단체’란 동일한 열차로 동일한 구간을 여행하는 20명 이상의 고객을 말한다.)1. 단체운임은 각 고객의 승차구간에 대한 교통카드운임에 해당 인원수를 곱하여 합산한 금액으로 한다.2. 단체인원 20명이 될 때마다 그 중 인솔자 1명의 운임을 면제한다.3. 단체인원 중 유아는 어린이 교통카드 운임을 적용한다.① 다음 각 호에 해당하는 경우에는 운임을 감면할 수 있다.
