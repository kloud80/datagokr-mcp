description_portal: '○ 통계개요* 통계명 : 도로 현황(도로율)* 통계종류 : 시가화면적에 대한 도로면적의 비율을 제공하는 일반ㆍ보고통계* 작성목적 : 국가 및 서울시에서 설치ㆍ관리하는 도로현황을 파악하여 도로에 대한장래계획의 수립과 도로 유지관리 및 행정에 필요한 기본자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 도로계획과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 도로연장ㆍ면적 및 도로율 현황○ 용어설명* 시가화면적 : 행정구역면적에서 시가화될 수 없는 공원, 임야, 하천 등을 제외한 면적○ 기 타* 도로율=도로면적/시가화면적(=행정구역면적-공원, 하천, 녹지 등)으로 행정구역면적에서 도로면적이 차지하는 비율이 아니므로 활용시 주의* 시가화면적은 부정기로 생산되고 있음○ 출 처 : 서울특별시 도로계획과'
