summary_user: 한국건설기술연구원이 산출한 등급별 교통량 분포비율을 조사연도(EXMN_YR)와 도로등급(ROAD_GRD)별로 묶어 17개 비율 칸(DAY_VOTR_1~17)에 담은 전국 단위 집계 데이터이며, 지점별 원천 관측값이 아니다. 교통 분석가나 도로 계획 담당자가 '특정 도로등급에서 교통량이 각 구간에 어떤 비율로 나뉘는가'를 연도별로 비교하거나, 지점 교통량을 등급별 분포로 나눌 때 기준값으로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 교통량 데이터와는 조사연도와 도로등급 이름을 맞춰서만 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 등급별교통량분포비율 정보입니다.
