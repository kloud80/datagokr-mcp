summary_user: 대전도시철도 1호선 역사별 기본 정보를 역 단위로 담은 조회 API이며, 검증 호출에서 23행이 수신됐다. 이용자나 앱 개발자가 특정 역에 엘리베이터·휠체어리프트·수유실·화장실 같은 편의시설이 있는지, 출입구와 승강장 형태가 어떤지 확인하는 질문에 쓴다. 역 주소(stationAddr)가 실측 조인 키라서 주소 기준으로 다른 역·지도 데이터와 이어 쓰고, 필수 파라미터인 역 코드(stationcode)는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선 전 역사에 대한 기본 정보를 제공하는 데이터입니다.한글 역사명, 영문 역사명, 한자 역사명, 환승역 여부 등 역사별 주요 항목 정보를 포함하고 있으며, 공공데이터 개방 표준데이터 속성정보에 따라 체계적으로 구성된 전국 표준데이터입니다.본 데이터를 활용하면 대전도시철도 역사의 다국어 명칭 및 환승 가능 여부를 손쉽게 확인할 수 있으며, 대중교통 길찾기 서비스, 다국어 교통 안내 앱, 환승 경로 안내 플랫폼, 관광 정보 연계 서비스 등 다양한 분야의 애플리케이션 개발에 활용할 수 있습니다.전국 표준데이터 형식을 준수하여 타 기관 데이터와의 연계 및 통합 활용이 용이합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
