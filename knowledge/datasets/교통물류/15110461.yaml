summary_user: 대전광역시 도로관리시스템에 등재된 버스정류장을 한 곳씩 담은 목록으로, 관리번호·정류장 이름·시군구·읍면동·지번을 담는다(xlsx 파일 약 142KB). 시민이나 분석가가 "우리 동네(읍면동)에 버스정류장이 몇 곳, 어디에 있나"를 확인하거나 정류장 분포를 행정구역별로 집계할 때 쓴다. 전역 조인 키가 없어 TAGO·대전 BIS 정류장 정보와는 정류장 이름이나 시군구·읍면동 이름을 맞춰 연결해야 한다.
description_portal: 대전광역시_버스정류장 현황 데이터는 대전광역시 도로관리시스템에 등재된 버스정류장의 위치, 정류장명, 정류장 유형 등 다양한 정보를 포함하고 있습니다. 이 데이터는 대중교통 이용 활성화, 노선 관리, 정류장 접근성 개선 등 시민 교통 편의 증진과 도시 교통 정책 수립에 중요한 역할을 합니다. 버스정류장 현황 자료는 도로시설물 유지보수, 교통 인프라 개선, 버스 노선 최적화, 시민 이동 동선 분석 등 다양한 행정적 목적에 활용될 수 있습니다. 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴이 직접 구축·정비한 데이터를 업데이트한 자료로서, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
