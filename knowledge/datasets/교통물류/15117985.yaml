description_portal: 한국교통안전공단의 전기트럭 센서 데이터는 차량 운행 중 실시간으로 측정된 핵심 원시 데이터(Raw Data)입니다. 이 데이터의 가장 큰 가치는 승용차와 달리 적재 중량이 수시로 변하는 상용차의 특성을 그대로 담고 있다는 점입니다. 즉, 화물의 무게라는 핵심 변수에 따라 배터리 충전 상태(SOC)와 전력 소모율이 어떻게 유동적으로 변화하는지를 직접적으로 보여주어 실제 데이터로서의 활용도가 매우 높습니다.데이터는 크게 주행, 배터리, 제어 정보로 구성됩니다. 위성항법장치(GPS) 위치, 속도, 가속도 데이터는 물류 경로 효율성과 운전자 주행 습관 분석의 기반이 됩니다. 특히 배터리의 SOC, 전압, 전류, 온도 정보는 화물차의 무거운 하중이 배터리 성능 저하 및 수명에 미치는 영향을 심층적으로 연구하는 데 필수적입니다.하루 단위로 집계된 이 로우 데이터는 정밀한 분석을 가능하게 하여, 학술 및 연구용 자료로서 가치가 뛰어납니다. 이를 통해 적재량을 실시간으로 고려하는 더 정확한 주행 가능 거리 예측 모델, 최적의 에너지 소비를 위한 상용차 전용 주행 알고리즘 개발, 맞춤형 배터리 관리 시스템(BMS) 고도화 등 다양한 차세대 기술 연구를 촉진할 수 있는 중요한 기초 자료입니다.
