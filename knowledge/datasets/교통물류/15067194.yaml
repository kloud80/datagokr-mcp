summary_user: 한국교통안전공단 운전적성정밀검사 중 신규검사(여객자동차 운송사업용 자동차를 새로 운전하려는 사람 등) 수검 건별로 수검일자, 지사, 속도예측·정지거리·주의전환 등 인지·운동 항목 등급과 정서안정성 등 인성검사 등급, 합격여부를 담은 전국 단위 CSV 파일(약 33KB)이다. 운수업 분석가나 교통안전 연구자가 "신규 버스·택시 운전 지원자는 어떤 검사 항목에서 낮은 등급을 받아 불합격하는가", "지사별 합격률은 어떻게 다른가" 같은 질문에 쓴다. 실측 컬럼에 다른 데이터와 이어 줄 전역 조인 키가 없어, 같은 공단의 특별검사·자격유지검사 통계와는 지사 이름과 수검일자를 기준으로 맞춰 비교하는 방식으로만 연결한다.
description_portal: '한국교통안전공단 운전적성정밀검사시스템에서 관리하고 있는 신규검사 통계정보를 제공합니다.[데이터 설명]* 일자, 지역본부, 검사항목, 검사항목별 등급, 합격여부 등[수검대상구분]* 신규검사 : 신규로 여객자동차 운송사업용 자동차를 운전하려는 자 등* 특별검사 : 벌점, 사고 등에 의한 자* 자격유지검사 : 만65세 이상인 자- 이는 이해를 돕기위한 간략한 설명으로, 상세기준은 법령정보 참고[검사장 및 도입시기 등]* 검사장 : 서울(성산, 노원, 송파), 경기남부, 경기북부, 인천, 대전세종충남, 홍성, 대구경북, 부산, 광주전남, 충북, 전북, 울산, 경남, 강원, 강릉, 제주, 상주, 이동1호, 이동2호* 이동1호/이동2호/홍성 : 신규검사 및 자격유지검사 2020년 시작'
