summary_user: 위험물질 운송 관제에 쓰는 전국 도로 CCTV 14,562곳의 목록을 지점 단위로 담은 CSV 파일이다(아이디·지점명·관할명·경도·위도·사용여부). 위험물질 운송 경로 주변에 볼 수 있는 CCTV가 어디에 있는지, 어느 관할인지 찾으려는 분석가나 관제 담당자가 쓴다. 경도·위도 좌표(coord)를 키로 삼아 링크 속도·돌발상황 등 다른 실시간 소통 데이터나 지도 데이터와 위치 기준으로 이어 쓴다.
description_portal: 한국교통안전공단은 국민의 안전을 위해 주요 도로에 설치된 CCTV 영상을 실시간으로 제공하는 공공데이터를 운영하고 있습니다. 이 데이터는 관제요원들이 도로 상황을 신속하게 파악하고, 특히 위험물질 운송 차량의 이동 경로와 사고 여부를 실시간으로 모니터링하는 데 활용됩니다. 위험물질 운송 차량은 사고 발생 시 큰 피해를 초래할 수 있으므로, 관제요원들은 CCTV 영상을 통해 사고 발생 여부를 신속하게 확인하고, 필요 시 소방청과 경찰청에 즉시 연락하여 대응할 수 있습니다. 이러한 실시간 모니터링 시스템은 교통사고 발생 시 신속한 대응을 통해 피해를 최소화하는 데 중요한 역할을 합니다. 국민들은 이 공공데이터를 통해 한국교통안전공단에서 사용하는 CCTV 정보를 파악할 수 있습니다.
