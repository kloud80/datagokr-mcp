summary_user: 대전 시내 도로를 링크 단위로 나눠 링크별 실시간 통행속도(km/h)·통행시간(초)·혼잡등급(원활·지체·정체)·상행/하행 방향과 시작·끝 노드, 링크 길이를 담는 실시간 소통 API입니다. 출퇴근 전에 "지금 계룡로 하행이 막히는지"를 확인하려는 시민이나, 조회 결과를 계속 쌓아 상습 정체 구간과 시간대를 찾으려는 교통 분석가가 씁니다. 전국 공통 조인 키는 없어 같은 기관 데이터의 링크ID·노드ID나 도로명·노드명 매핑으로만 다른 데이터와 잇고, 링크ID는 다른 데이터에서 먼저 받아 와야 합니다.
description_portal: 대전광역시 대전교통정보 자료는 도심 내 도로의 실시간 소통상태를 비롯하여 다양한 교통수단별 이동 경로 정보를 포함하고 있습니다. 주요 도로의 통행속도 통행시간 소통등급 등이 상세히 제공되며 승용차 버스 지하철 등 교통수단별 목적지까지 최적 경로 안내 기능도 포함되어 있습니다. 이 자료는 효과적인 교통 흐름 관리 및 교통 정책 수립에 기반이 되며 시민들의 출퇴근길 및 기타 이동 시 혼잡 최소화와 대중교통 이용 편의성 향상을 돕습니다. 또한 도로별 상행과 하행 방향 정보 통행시간 데이터를 통해 교통 상황 변화에 신속 대응하고 분석하기에 용이합니다.
