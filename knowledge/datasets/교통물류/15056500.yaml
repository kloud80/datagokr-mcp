summary_user: 서울시 교통정보 시스템(TOPIS)의 소통 돌발 API에서 쓰는 돌발 유형 코드와 코드명을 담은 코드표이며, 건별 원천 기록이 아니라 참조용 목록이다. 서울시 실시간 돌발상황 데이터를 받아 쓰는 개발자·분석가가 '이 돌발 코드가 사고인지 공사인지 무엇을 뜻하나'를 풀어 읽는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 소통 돌발 API 응답에 있는 돌발 유형 코드와 코드값·이름을 맞춰 연결한다.
description_portal: '해당 데이터는 서울시 돌발 유형 코드 정보 OpenAPI 데이터이며 소통 돌발 API를 사용하기 위한 돌발 유형 코드입니다. 데이터의 원본시스템은 서울시 교통정보 시스템(https://topis.seoul.go.kr)입니다.요청인자 : 인증키, 요청파일타입, 서비스명, 요청시작위치출력값 : 총 데이터 건수(정상조회 시 출력됨), 요청결과 코드, 요청결과 메시지, 돌발 유형 코드, 돌발 유형 코드명※ 바로가기 링크 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다. 열린데이터광장에서 제공하는 오픈API를 사용하기 위해서는 먼저 인증키를 발급받으셔야 합니다.'
