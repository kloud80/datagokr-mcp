summary_user: 대전광역시 도로관리시스템에 등재된 도로포장 구간을 건별로 담은 공간 데이터로, 구간마다 위치 도형(WKT), 관리번호, 행정읍면동, 도로구간번호, 포장종류, 면적 등을 기록하며 범위는 대전시 전역을 읍면동 단위로 나눈다(CSV 약 42MB). 도시·도로 분석가가 '어느 동에 아스팔트·콘크리트 포장 면적이 얼마나 되는가'처럼 지역별 포장 종류와 면적을 파악하고 보수 계획이나 공간분석의 기초자료로 쓴다. 전역 조인 키는 없어서 행정읍면동 이름이나 도로구간번호·도엽번호로 같은 기관의 다른 도로시설 데이터와 맞추고, WKT 도형을 공간 결합해 표준노드링크 등 도로망 데이터와 겹쳐 쓴다.
limits: 표준 행정코드나 link_id 같은 전역 조인 키가 없어 다른 데이터와는 이름 매칭이나 공간 결합으로만 연결된다. 포털 설명상 2022년 청년 인턴이 구축·정비한 자료로 법적 효력이 없어 참고용으로만 쓴다.
