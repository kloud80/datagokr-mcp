description_portal: 2020년 1월부터 2025년 6월까지 5년 6개월 동안(총 59회 점검) 광주광역시 도시철도 2호선 건설현장에서 매월 정기적으로 시행한 안전점검 현황데이터입니다. 지하철 건설현장에서 일어날 수 있는 지반 침하, 씽크홀, 붕괴, 추락, 감전, 화재사고, 낙하물 사고같은 다양한 사고를  방지 및 예방하기 위한 목적으로 광주광역시 지하철 2호선 건설현장에서 시행된  안전점검 데이터로 점검 횟수, 점검 일자, 점검대상, 점검명, 점검조사자, 점검내용 등의 현황을 제공합니다. 광주광역시 지하철 2호선 건설현장 안전점검은 1단계 6공구와 2단계 8공구로 구성되어  총 14공구에서 시행되었습니다. 점검에는 도시철도건설본부 안전관리실,건설사업관리단 외에도 점검 시기별로 필요한 외부전문가, 상수도관계자, 해양도시가스관계자 등이 참여하였습니다.
