summary_user: 의정부도시공사가 운영하는 거주자우선주차구획을 동별로 묶어 운영면수, 일반구획 면수, 전용구획 면수를 담은 집계 파일(CSV, 334바이트)이며, 포털 설명상 2025.12.31. 기준입니다. 거주자우선주차를 신청하려는 의정부 주민이 우리 동에 구획이 몇 면이고 그중 전용구획이 얼마인지 확인하거나, 분석가가 동별 거주자우선주차 공급을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 동 이름(구분)을 행정동 명칭에 맞춰 매핑해야 하며, 개별 주차장 단위 정보는 전국주차장정보표준데이터 같은 표준 원장과 따로 맞춰 봐야 한다.
description_portal: '의정부도시공사에서 운영하고 있는 거주자우선주차 현황에 관한 정보입니다. 거주자우선주차 관련하여 동별 운영면수, 일반구획면수, 전용구획면수에 대한 세부정보를 제공하고 있습니다. 해당 정보는 거주자우선주차 이용자 및 이용희망자, 기타 수요자를 위하여 정확하고 신속하게 제공 및 현행화되고 있습니다.또한 의정부도시공사 대표 홈페이지에 접속하시면 사업소개>교통사업>거주자우선주차 소개에서 좀더 상세한 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/businessInfo/trafficPage/resident/list.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.※ 거주자우선주차 신청 문의 : 031-828-6854,6855'
