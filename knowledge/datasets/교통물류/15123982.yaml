summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 버스 영업소를 한 행씩 담은 목록으로, 영업소 식별자(buzplc_id), 소속 버스 업체 식별자, 영업소명('동서울터미널', '남부영업소' 등)으로 이루어진다. 교통 분석가가 "어느 버스 업체가 어떤 영업소·터미널을 거점으로 운영하는가"를 파악하거나 노선·차량 데이터의 업체·영업소 코드를 이름으로 풀어 읽을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 경기도 BMS 계열 데이터와는 업체ID·영업소ID 같은 기관 내부 코드로, 그 밖의 데이터와는 영업소명·업체명 같은 이름 매핑으로만 잇는다.
description_portal: 이 데이터는 경기도 버스운송관리시스템(BMS)에 등록된 버스 영업소 정보를 담고 있습니다. 각 버스 영업소에 대해 고유 식별자인 '영업소ID'와 이를 소유한 버스 회사의 '업체ID', 그리고 실제 운영되는 '영업소명'이 포함되어 있습니다. 이 정보는 교통카드 데이터, 노선정보, 차량정보 등과 연계하여 대중교통 운행 실태를 분석하거나, 지역별 대중교통 인프라 현황을 파악하는 데 활용될 수 있습니다. 또한 터미널이나 차고지 위치 분석, 업체별 버스 운행 효율성 분석, 교통정책 수립 자료 등으로 활용될 수 있습니다. 영업소명에는 '동서울터미널', '고양터미널', '남부영업소'와 같이 실제 운영 장소를 식별할 수 있는 명칭이 제공됩니다.
