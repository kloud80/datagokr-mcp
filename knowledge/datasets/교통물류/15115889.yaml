description_portal: 이 데이터는 해양수산부 해양안전종합정보시스템을 통해 위험해역을 통항하는 선박의 현황을 파악하고 관리하기 위한 목적으로 수집된 데이터입니다.  본 데이터의 주요 내용은 선박이 위험해역을 통과하는 건수를 선종별, 그리고 인도양(아덴만 통과/미통과), 서아프리카, 호르무즈 등 구역별로 구분하여 제공하고 있습니다.본 데이터는 해양 관련 기관에서 위험해역의 선박 통항 안전관리에 활용할 수 있으며, 해양보안 및 선박 운항 정책 수립 시 참고자료로 사용할 수 있습니다. 또한 해운업계에서는 선박의 위험구역 통과 현황을 분석하여 운항 전략을 수립하는 데 사용할 수 있고, 관련 연구기관에서는 해상 안전 연구 및 국제 해상 위험 분석 등에 활용할 수 있습니다.
