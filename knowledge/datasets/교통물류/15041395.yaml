summary_user: 수도권 7호선 도시광역철도역에 설치된 엘리베이터를 한 대씩 담은 시설 목록으로, 운영기관·노선·역명·출입구번호·상세위치와 정원(인원·중량)이 들어 있으며 약 13KB 분량의 CSV 파일이다. 휠체어 이용자나 교통약자가 7호선 특정 역의 몇 번 출입구에 엘리베이터가 있는지 확인하거나, 분석가가 역별 엘리베이터 설치 현황과 수용 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역·시설 데이터와는 역명과 출입구번호를 이름으로 맞춰 이어 써야 한다.
