summary_user: 한국건설기술연구원이 제공하는 상시지점(상시 교통량 조사지점) 통계를 조사연도(EXMN_YR)·지점번호·자료 구분·도로 등급별 통계값 단위로 담은 전국 범위 데이터이며, 공간 좌표는 없다. 교통 분석가가 특정 도로 등급이나 상시지점의 연도별 통계값 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지점번호나 도로 등급 이름을 직접 맞추는 방식으로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 상시지점통계 정보입니다.\""
