summary_user: 부산광역시 연제구 관내 마을버스를 노선 단위로 정리한 현황표로, 노선번호·운수업체·기점·경유지·종점과 운행·예비 차량 수, 운행거리, 첫차·막차 시각, 평시·출근·주말 배차간격, 연령·결제수단별 요금을 담는다(CSV 863바이트의 작은 파일). 연제구 주민이 동네 마을버스의 노선과 첫차·막차 시간, 배차간격을 확인하거나, 분석가가 노선별 차량 수와 배차간격을 비교해 서비스가 부족한 구간을 찾는 데 쓴다. 전역 조인 키가 없어 노선번호·정류장 이름이나 구군명으로 부산 버스 노선·정류장 원장, 실시간 도착 정보(BIS·TAGO)와 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 연제구 관내에서 운행 중인 마을버스의 운행 계통에 관한 상세한 정보를 담고 있습니다. 각 버스업체별로 운영되는 다양한 노선의 기점, 경유지, 종점뿐만 아니라 업체 전화번호, 운행 차량 수, 첫차와 막차 시간 등 주요 현황이 포함되어 있습니다. 2026년 5월 17일 기준으로 정리된 이 자료는 연제구 내 마을버스의 전반적인 운행 상황을 보다 정확하게 파악하는 데 큰 도움을 줍니다. 또한 노선별 배차 간격이나 주요 환승 지점과의 연계성 등을 분석하는 데에도 활용될 수 있어, 지역 교통 정책을 수립하거나 서비스 개선이 필요한 지점을 찾는 데 유용합니다. 이 데이터는 지역 주민과 관련 기관뿐만 아니라 도시계획 연구자, 대중교통 이용 패턴을 분석하는 전문가들에게도 중요한 참고 자료로 활용될 수 있습니다.
