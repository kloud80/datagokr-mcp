summary_user: 고속도로 노선별 영업소마다 진입조절 시행 여부를 담는 외부 API로, 영업소(unitName) 단위 건별 상태와 노선, 좌표, 단계별 조절 기준, 조절 등록 시각을 함께 제공하며 범위는 전국이다. 운전자나 내비게이션·교통 분석 사업자가 '지금 이 고속도로 영업소에서 진입조절을 하고 있어 우회해야 하는가'를 확인할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로 다른 데이터와는 영업소 코드(unitCode)·노선 코드(lineCode) 같은 한국도로공사 내부 코드나 영업소명·노선명 매칭으로만 잇는다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 고속도로 노선별 영업소의 진입조절 시행여부를 조회할 수 있는 OpenAPI 서비스이다.해당 API는 노선 단위로 지정된 영업소에 대해 진입조절이 시행 중인지 여부를 실시간에 가깝게 제공하며, 교통 혼잡 완화 및 사고 대응 체계 구축에 활용된다.제공 항목에는 노선명, 영업소명, 조절 시행 여부, 조절 시작 및 종료 시각, 방향, 행정구역, 조절 사유 등의 정보가 포함된다.사용자는 본 데이터를 활용하여 특정 노선상의 교통통제 상황을 사전에 파악할 수 있으며, 우회경로 제공, 교통 예측 시스템, 재난 대응 전략 등 다양한 분야에 활용 가능하다.API는 XML 및 JSON 형식으로 제공되며, 공공데이터 포털에서 인증키를 발급받아 접근할 수 있다.제공 정보는 정기적으로 갱신되며, 누구나 자유롭게 조회하고 서비스에 연계할 수 있다.한국도로공사는 본 데이터를 통해 효율적인 고속도로 운영과 국민의 교통 편의 증진을 도모하고자 한다.실시간성과 활용도를 고려한 본 API는 공공 및 민간의 다양한 목적에 부합하는 고부가가치 데이터를 제공한다.
