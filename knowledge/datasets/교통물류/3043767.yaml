description_portal: '강원특별자치도 강릉시의 자동차 등록현황을 **연료별·용도별·차종별(승용, 승합, 화물, 특수)**로 집계한 통계 데이터입니다. 주요 항목은 다음과 같습니다.연료별: 자동차에 사용되는 주된 연료 종류를 구분하는 값(예: 휘발유, 경유, LPG, 전기, 수소 등).용도별: 자동차의 사용 용도가 사업용인지 비사업용(자가용)인지 구분하는 항목.승용: 해당 연료별·용도별 조건에 해당하는 승용자동차 등록 대수.승합: 해당 연료별·용도별 조건에 해당하는 승합자동차 등록 대수.화물: 해당 연료별·용도별 조건에 해당하는 화물자동차 등록 대수.특수: 해당 연료별·용도별 조건에 해당하는 특수자동차(특장차 등) 등록 대수.이 데이터는 강릉시 자동차 등록 구조를 연료·용도·차종별로 파악할 수 있도록 구성되어 있으며, 친환경 차량 보급 현황 분석, 교통·주차·도로 인프라 계획 수립, 운수·물류 관련 정책 마련, 지역별 차량 구성 변화 모니터링 등 다양한 교통·환경·도시계획 분야에서 활용할 수 있는 공공데이터입니다.'
