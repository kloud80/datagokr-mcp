summary_user: 한국건설기술연구원이 제공하는 상시 교통량 조사지점의 일별 교통량 통계를 담으며, 조사연도·지점번호·순위·발생일자·요일별로 하루 교통량과 일교통량 대비 비율 같은 값을 한 행씩 제공하는 전국 단위 비공간 데이터다. 도로 분석가나 교통계획 담당자가 특정 조사지점에서 어느 날·어느 요일에 교통량이 많았는지, 연중 순위로 보면 어느 날이 첨두일인지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 교통량·도로 데이터와는 조사지점 번호나 이름을 직접 매핑하거나 같은 기관 코드로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 상시일별 교통량 통계 정보입니다.\""
