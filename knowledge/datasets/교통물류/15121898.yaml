summary_user: 경기도 내 도로 구간(시점~종점)별로 날짜·도로종류·노선·상하행을 구분해 1시간 단위 24개 시간대 평균속도와 1일 평균속도(km/h)를 담은 일별 집계 자료다. 교통 분석가나 지자체 담당자가 '이 국도·지방도 구간은 몇 시에 가장 느려지는가', '상습 정체 구간은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 도로·교통 데이터와는 노선명·노선코드(ROUTE_CD)나 시점·종점 위치 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 도로 지점별 상시속도 정보를 제공하며, 1일 24시간 기준 각 시간대별 평균 속도를 km/h 단위로 기록한 자료입니다. 주요 항목에는 날짜(년, 월, 일), 도로종류(국도, 지방도 등), 도로 코드 및 호선명, 상/하행 구분, 시점과 종점 위치, 시간대별 주행 속도 및 1일 평균속도가 포함됩니다. 해당 데이터는 경기도교통정보센터의 실시간 교통 모니터링 결과를 기반으로 수집되며, 도로 이용 효율성 분석, 혼잡 구간 파악, 시간대별 정체 구간 예측, 교통안전 정책 수립, 정류장 간 평균 소요시간 산출, 교통량 분산 정책 설계 등에 활용될 수 있습니다. 대용량 형태로 제공되며, 시계열 기반 교통속도 데이터 분석에도 적합한 자료입니다.
