summary_user: 충청남도 시군별로 택시 총량제에 따른 조정대수, 현재 면허대수, 증감차대수를 담은 집계 파일이며, 470바이트 크기의 작은 CSV입니다. 택시 사업자나 교통 분석가가 "우리 시군의 택시 면허대수가 총량제 기준보다 많은가 적은가, 감차가 얼마나 필요한가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 구분 열의 시군 이름을 행정구역 이름·코드에 직접 매핑해 이어야 한다.
