description_portal: 서울특별시 강서구에 등록된 전기자동차 및 전기이륜차의 보급 현황을 나타내는 데이터입니다. 2021년 12월 기준으로 수집된 자료이며, 강서구 내 행정동 단위로 분류된 전기차 및 전기이륜차의 등록 대수를 제공합니다. 이 데이터는 친환경 교통수단의 지역별 확산 정도를 파악할 수 있는 기초자료로 활용 가능하며, 강서구의 탄소중립 정책이나 전기차 충전 인프라 수요 예측에도 유용하게 쓰일 수 있습니다. 또한 전기차 이용자의 분포를 분석하여 대중교통 연계 방안이나 그린 모빌리티 정책 수립을 위한 기반자료로도 활용할 수 있습니다.
