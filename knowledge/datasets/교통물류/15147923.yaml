summary_user: 인천 부평구에 등록된 물류창고업체를 업체 한 곳당 한 행으로 담은 파일이며, 상호, 사업자등록번호, 도로명·지번 소재지, 물류창고업 등록일이 들어 있다. 구 안의 창고가 어디에 있는지, 언제 창고업에 들어왔는지를 확인하려는 도시계획·산업 분석가나 입지를 살피는 사업자가 쓴다. 사업자등록번호(bizno)를 키로 다른 기업 정보 데이터와 잇고, 도로명·지번 주소로 지도나 공간정보에 올려 쓴다.
description_portal: '물류창고업체의 상호, 사업자등록번호, 소재지(도로명·지번 주소), 등록일 등을 수록한 산업기초 자료.도시 내 물류 기능 분포를 파악하고, 물류 기반시설 운영 현황, 산업통계 분석, 입지 적정성 평가 등을 위한 행정자료로 활용됨.활용 목적 및 특징– 물류시설 분포 파악을 통한 교통·산업·도시계획 연계 자료 제공– 도로명·지번주소 모두 제공되어 공간정보 시스템 연동 가능– 등록일 정보 기반으로 연도별 창고업 진입 동향 및 산업 성장 추이 분석– 창고업체 현황 관리 및 민원 대응, 입지 인허가 정책자료로 활용주요 항목 설명● 업체명: 해당 물류창고업체의 상호명● 사업자등록번호: 등록된 고유 사업자번호● 소재지(도로명주소): 창고업체의 도로명 기반 주소● 소재지(지번주소): 지번 기준의 소재지 주소● 등록일: 해당 업체가 물류창고업으로 등록한 날짜'
