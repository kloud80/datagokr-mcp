summary_user: 부산광역시 자율주행버스가 운행 중 겪은 돌발 상황(충돌위험경고·급정거·제어권해제)을 건별로 기록한 이력 데이터로, 차량번호·노선번호·발생 시각·위경도·속도·진행 방향을 함께 담는다. 교통 분석가나 연구자가 "어느 노선, 어느 지점에서 자율주행이 수동으로 넘어가거나 급정거가 잦은가"를 따져 위험 구간을 찾는 데 쓴다. 전역 조인 키는 없어 노선번호(routeNo)를 부산 버스 노선 정보와 이름으로 맞추거나, 위경도로 정류장·도로 위치와 공간 결합해 이어 쓴다.
limits: 다른 데이터와 바로 붙는 공통 코드가 없어 노선번호·좌표 매핑으로만 연결된다. 개발계정은 하루 1,000회 호출로 제한되고, 돌발유형은 0·1·2 코드로 오므로 뜻(충돌위험경고·급정거·제어권해제)으로 바꿔 해석해야 한다.
