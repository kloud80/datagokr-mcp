summary_user: 성북구도시관리공단이 운영하는 거주자우선주차 노외주차장을 주차장 한 곳당 한 행으로 담은 파일로, 주소·좌표(WGS84 위경도)·주차구획수·운영시간·기본/추가 요금·1일권·월정기권 요금·결제방법을 수록한다. 성북구 주민이나 방문자가 집 근처 공단 노외주차장의 위치와 월 정기권 요금을 확인하거나, 분석가가 동네별 주차 공급을 지도에 올려 보는 데 쓴다. 필드 구성이 전국주차장정보표준데이터와 같아 주차장관리번호로 표준 원장과 맞춰 볼 수 있으나 실측상 전역 조인 키는 확인되지 않아, 다른 데이터와는 주차장명·주소 매칭이나 좌표 기반 공간 결합으로 잇는다.
description_portal: 본 데이터는 서울시 성북구 관내 거주자들의 주차 편의를 획기적으로 개선하고 체계적인 주차 공간 관리를 도모하기 위해 성북구도시관리공단에서 운영하는 거주자우선주차 노외주차장의 통합 위치 및 운영 정보를 제공합니다.데이터의 세부 구성 체계로는 각 행정동별 상세 소재지와 주차장 형태, 수용 가능한 총 구획수를 포함하고 있으며, 이용자의 요금 예측 가능성을 높이기 위해 월 정기권, 1일 주차, 기본 및 추가 요금 체계와 결제 방법 정보를 수록하고 있습니다. 특히, 각 주차장의 정밀 경위도 좌표(위도, 경도) 데이터를 포함하여 이용자가 모바일 기기를 통해 실시간으로 정확한 위치를 파악할 수 있도록 구성하였습니다.본 데이터는 지능형 교통 시스템(ITS) 연계 분석, 지역별 주차 수급 불균형 해소를 위한 정책 수립, 민간 내비게이션 및 주차 공유 플랫폼 서비스 개발을 위한 고정밀 기초 데이터로서 그 기술적·경제적 활용 가치가 매우 높습니다.주차장별 면수 확인 및 정기권 신청 절차에 관한 상세 안내는 성북구도시관리공단 홈페이지(https://www.gongdan.go.kr/park/statusAndLocation/selectStatusAndLocation.do)를 통해 편리하게 확인하실 수 있습니다.
