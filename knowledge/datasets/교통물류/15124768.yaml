summary_user: 광주광역시 남구 관내 건물별 도로명주소를 한 행씩 담은 원천 파일로, 읍면동·도로명·건물본번·부번과 건축물대장 건물명, 건물용도, 고시일자를 담는다(CSV 약 2.8MB, 시군구 범위). 남구에서 특정 도로명주소가 어떤 건물·용도에 해당하고 언제 고시됐는지 확인하려는 물류·배송 사업자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구·읍면동·도로명·건물번호 같은 이름 매칭으로만 연결한다.
description_portal: 광주광역시 남구 관내 도로명주소에 대한 동, 지번, 고시일자, 도로관리기관, 우편번호, 기초구역번호 등에 관한 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 토지정보과(☎062-607-3251)에서 제공합니다. 공란인 데이터들의 경우, 데이터가 존재하지 않아 미표기하였으니 데이터 이용 시 참고하시기 바랍니다. 아울러, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 도로명주소는 도로명을 중심으로 건물번호를 부여하여 위치를 표현하는 표준 주소 체계입니다. 기존 지번 주소보다 직관적이고 위치 확인이 용이해 우편물 배달, 내비게이션, 긴급 구조 활동 등 다양한 분야에서 활용됩니다. 해당 데이터는 행정업무 효율화, 물류·배송 최적화, 위치 기반 서비스 개발, 부동산·상권 분석, 지도 제작 등 폭넓게 사용 가능할 것으로 보이며, 재난 발생 시 신속한 구조 활동, 민원 처리의 정확성 제고, 스마트 시티 서비스 구축 등 공공과 민간 모두에서 중요한 역할을 할 수 있을 것으로 기대됩니다.
