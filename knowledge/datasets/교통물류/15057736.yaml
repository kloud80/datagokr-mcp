summary_user: 자동차 검사 기간(기준일 앞뒤 한 달)과 사용본거지 법정동코드, 용도(자가용·영업용·관용), 차종(승용·승합·특수·화물), 세부 규모(경형·소형·중형·대형)를 조건으로 넣어 해당하는 검사 건수(dtaCo)를 돌려주는 집계형 API로, 범위는 전국 읍면동 단위다. 지역 교통·안전 분석가가 특정 동네에서 특정 기간에 영업용 화물차가 몇 대나 검사를 받았는지 확인할 때 쓴다. 응답 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 조회 조건으로 쓴 법정동코드(행정표준코드관리시스템 code.go.kr)를 기준으로 지역별로 맞춰 붙인다.
description_portal: 자동차정보API 서비스로 자동차 검사 기준날짜 시작일(입력날짜 한달전으로 검색), 검사 기준날짜 종료일(입력날짜 한달 후로 검색), 사용자본거지 법정동코드(행정표준코드관리시스템에서 조회  가능 / code.go.kr / 예:2629010900), 용도(자가용,영업용,관용), 차종(승용,승합,특수,화물), 자동차규모(세부차종:경형,대형,소형,중형)를 입력하여 기간별검사(현황) 등록 통계정보를  조회하는 서비스 입니다. *매월1일부터 말일까지의 데이터는 익월2일에 조회 및 활용 가능합니다. *인증키는 공공데이터포털에서 자동발급 됩니다.
