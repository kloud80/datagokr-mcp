description_portal: '제주특별자치도에서 제공하는 어린이보호구역 내 도로안전표지 관련 데이터를 제공합니다.항목: 도로종류, 노선명, 도로형태, 위도, 경도 등“어린이 보호구역”이란 교통사고의 위험으로부터 어린이를 보호하기 위해 필요하다고 인정되는 경우 다음 중 어느 하나에 해당하는 시설이나 장소의 주변도로 가운데 지정된 일정 구간을 말하며, 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있습니다.(규제「도로교통법」 제12조제1항 및 규제「도로교통법 시행규칙」 제14조)- 시·도경찰청장이나 경찰서장은 지정된 어린이 보호구역에 안전표지를 설치해야 합니다(「어린이·노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙」 제6조제3항제1호, 「도로교통법 시행규칙」별표 6 Ⅱ. 개별기준의 일련번호 제133호·제324호 및 제536호)'
