summary_user: 인천국제공항에서 취항하는 도시(공항)의 국문 국가명, 공항(도시)명, 공항코드를 공항 한 곳당 한 행으로 담는 현황 목록이며, 조회 당일 기준 값을 돌려준다. 여행자나 서비스 개발자가 인천공항에서 어느 나라 어느 도시로 직항편이 있는지 확인하거나, 운항정보의 공항코드를 국문 도시명으로 바꿔 보여줄 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 공항코드(airportCode)나 공항명을 기준으로 같은 기관의 운항정보·공항코드 데이터와 이름·코드 매핑으로 잇는다.
description_portal: 인천국제공항공사에서 사용자들의 편리를 위해 제공하는 취항도시(공항) 현황에 대한 데이터입니다. 공항코드 데이터 요청 파라미터를 기준으로 데이터를 구분하여 취항도시의 국문 국가명, 도시명, 도시코드등에 대한  데이터를 제공하고 있습니다. 조회 당일을 기준으로 해당 데이터의 조회가 가능합니다. 개발 계정 신청 시 일 1000 트래픽, 운영 계정 신청 시 일 1000000 트래픽을 제공합니다. 데이터포맷은 JSON과 XML을 모두 제공합니다. 개발 계정과 운영 계정 모두 자동승인됩니다.
