summary_user: 제주도 내 버스 이용자 유형별 패널티(위반·제재) 적발 건수와 이용자 수를 기준연월·교통수단 유형·이용자 유형별로 월별 집계한 통계로, 포털 설명상 2019년 1~12월을 다룬다. 교통 정책 담당자나 분석가가 '어린이·청소년·일반 등 어떤 이용자 유형에서 패널티가 많이 발생하고 월별로 어떻게 달라지는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 제주 버스 데이터와는 기준연월이나 이용자 유형 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터셋은 2019년 1월 1일부터 2019년 12월 31일까지 제주도 내 버스 노선 및 이용자 유형별로 발생한 패널티(위반 또는 제재) 적발 건수를 월별로 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 공개되어 누구나 다운로드할 수 있으며, 월별·노선별·이용자 유형별로 패널티 현황을 분석할 수 있어, 대중교통 안전 관리, 시민 행태 분석, 버스 운영 정책 평가 및 개선, 교통 복지 정책 수립, 지역 교통 서비스 모니터링 등에 활용될 수 있습니다. 다만 수집 기간이 2019년 단일 연도에 한정되어 있으며, 그 이후의 패널티 현황 변화는 반영되어 있지 않을 수 있다는 점을 유의해야 합니다.
