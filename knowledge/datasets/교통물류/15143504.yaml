description_portal: 본 데이터는 전라남도 목포시에서 연안개량안강망어업에 대해 연도별로 허가한 건수를 정리하여 제공하는 자료입니다. 연안개량안강망어업은 일정 구역에 설치된 고정식 어구를 통해 어획을 수행하는 정치성 어업의 한 형태로, 수산자원의 보호 및 어업 질서 유지를 위해 해당 어업에 대한 허가가 법적으로 요구됩니다. 본 데이터는 각 연도별로 목포시 관내에서 발급된 허가 건수를 수록하고 있으며, 이를 통해 어업 허가의 추이 분석 및 어업 정책 수립에 활용될 수 있습니다. 또한 지역 어업의 현황 파악, 연구자료, 행정자료로서도 유용하며, 지속가능한 수산업 운영을 위한 기초자료로 제공됩니다.
