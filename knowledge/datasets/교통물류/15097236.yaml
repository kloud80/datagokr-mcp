summary_user: 구미시 관내 시내버스 노선을 노선 한 건 단위로 담은 원장 데이터로, 노선 번호·형태·유형, 기점·종점, 첨두·비첨두 배차 간격, 노선 총길이, 운행 개시일·종료일을 담는다. 시민이나 분석가가 '이 노선은 출퇴근 시간에 몇 분 간격으로 다니고, 언제 신설되거나 폐지됐나'를 확인하거나 구미시 노선 조정·교통 접근성을 분석할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 정류장·실시간 도착 데이터와는 노선 번호(route_no)나 노선명 같은 이름 매핑, 또는 같은 기관 코드로만 이어 쓴다.
description_portal: 경상북도 구미시 버스 노선에 대한 데이터로 노선 번호, 노선 형태, 노선 유형, 배차 간격, 노선 총길이, 운행 개시일, 운행 종료일 등의 정보를 제공합니다. 이 데이터는 시민들의 대중교통 이용 편의성을 높이기 위해 제공되며, 구미시 관내 시내버스의 운행 현황을 파악할 수 있는 기초자료로 활용됩니다. 또한, 배차 간격과 총길이 정보는 이용자에게 운행 빈도와 소요 시간 예측에 도움이 되며, 운행 개시일과 종료일은 노선의 신설 및 폐지 여부를 판단하는 데 유용합니다. 이 데이터를 통해 구미시의 교통 정책 수립 및 노선 조정, 교통 접근성 분석 등에 활용이 가능하며, 시민에게는 실질적인 이동 정보로 제공됩니다.
