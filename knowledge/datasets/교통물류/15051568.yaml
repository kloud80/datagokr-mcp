summary_user: 서귀포시 읍·면 지역을 운행하는 지선버스 노선을 노선 한 건당 한 행으로 담은 노선현황 파일로, 노선번호·구간(노선)·구분·비고·기준일자가 들어 있다(약 6.5KB 규모의 CSV). 주민이나 방문객이 '우리 읍·면을 지나는 지선버스가 있는지, 몇 번 버스가 어느 구간을 다니는지' 확인하거나, 분석가가 읍·면 대중교통 사각지대를 살피는 데 쓴다. 실측 컬럼에 정류장 ID·행정코드 같은 전역 조인 키가 없어서 다른 노선·정류장 데이터와는 노선번호나 구간 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 자료는 서귀포시 읍·면 지역을 중심으로 운행되는 지선버스 노선의 번호, 구간, 구분, 비고 정보, 기준일자를 정리한 노선현황 데이터입니다. 행정 및 교통 정책 수립 시 읍·면 지역의 교통 서비스 접근성, 대중교통 사각지대, 배차 빈도 및 노선 확대 필요 구역 분석에 유용합니다. 주민들은 자신의 읍·면 내 또는 인접 지역 노선의 존재 여부를 확인하고 노선 번호나 구간 정보를 통해 이동 계획을 세울 수 있고, 관광객이나 방문객에게도 편리한 교통 안내 정보로 활용 가능합니다. 또한 교통 운송사 및 지자체는 해당 데이터를 기반으로 운행 효율성, 배차 조정, 시설 간 연계성 등을 개선하는 데 활용할 수 있습니다.
