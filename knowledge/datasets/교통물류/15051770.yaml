summary_user: 서울 시내 마을버스 운영 업체를 업체 한 곳당 한 행으로 담은 인허가 현황 자료로, 업체명·지번/도로명 주소·인허가일·영업상태와 휴업·폐업 일자·좌표(XCODE, YCODE)를 포함한다. 행정 담당자나 교통 분석가가 '어느 자치구에 마을버스 업체가 몰려 있고, 최근 폐업·휴업한 업체가 있는 지역은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 노선·정류장 데이터와는 업체명이나 주소를 매핑해 붙이고, 지역 분석은 주소나 좌표로 행정구역에 대응시켜 연결한다.
description_portal: 서울특별시 마을버스업체 정보는 서울 시내에서 마을버스를 운영하는 업체들의 기본 현황을 종합적으로 제공하는 자료입니다. 이 정보에는 업체명, 소재지, 영업상태, 위치정보, 공간정보 등이 포함되어 있으며, 이를 통해 각 업체가 어떤 지역에 기반을 두고 운영되고 있는지를 파악할 수 있습니다. 또한 업체의 실제 위치나 행정구역과의 관계를 확인할 수 있어 지역별 마을버스 공급 상황을 분석하는 데 활용될 수 있습니다. 이 자료는 교통 취약지역을 식별하거나 노선의 신설·조정·증차 여부를 검토하는 데에도 중요한 근거가 됩니다. 더불어 업체의 운영 상태 변화를 통해 특정 지역에서 교통 공백이 발생할 가능성을 예측하는 데 사용할 수 있으며, 행정기관이 마을버스 운영을 관리·지원하는 데 기초자료로 활용되고 있습니다.
