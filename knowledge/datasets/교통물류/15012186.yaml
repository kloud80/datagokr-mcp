description_portal: 이 데이터는 서울특별시 동대문구가 관리하는 보안등 현황에 대한 정보를 제공하며, 관내 15개 행정동 및 노폭 12m 미만 도로의 설치된 보안등 수량 정보를 포함하고 있습니다. 데이터 상세 정보로는 수량, 보안등 관리번호, 행정동, 설치일자, 설치주소, 설치형태(한전주,건축물,전용주), 한전주번호, 수용가번호, 조명타입, 점멸장치 정보로  구성되어 있으며, 보안등은 야간 보행자 및 차량 통행 시 안전 확보와 범죄 예방을 위해 설치된 도로조명 시설을 의미합니다.보안등은 주로 주택가 이면도로, 골목길, 보행로 등 가로등 설치가 어려운 지역이나 야간 조도가 부족한 구간에 설치되어 주민의 안전한 야간 통행 환경을 조성하는 역할을 합니다.단, 서울특별시 또는 타 기관에서 관리하는 조명시설(가로등 등)에 관한 정보는 본 데이터에 포함되어 있지 않습니다.
