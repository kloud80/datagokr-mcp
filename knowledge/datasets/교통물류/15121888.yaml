summary_user: 경기도 행정구역별 출발지역과 도착지역 쌍을 기준으로 연·월, 주말·평일 구분에 따라 좌석·일반·마을버스 유형별 이용객 수를 담은 집계 데이터다. 교통 분석가나 지자체 담당자가 '평일에 어느 시군에서 어느 시군으로 버스 이동이 많고, 좌석버스와 일반버스 비중은 어떻게 다른가'를 파악해 노선 조정이나 수요 예측에 쓴다. 전역 조인 키는 없어 출발·도착 지역 코드(DPTRE_REGION_CD, ARVL_REGION_CD)나 지역명을 다른 경기도 교통 통계의 지역 코드·이름에 직접 매핑해 이어 써야 한다.
description_portal: ‘정류소간 버스이용객수’ 데이터는 경기도 행정구역별 출발·도착 지역을 기준으로 월별·주말-평일 구분에 따라 버스 유형별 이용객 수를 제공합니다. 주요 항목은 년도 (YY), 월 (MT), 출발지역명·코드, 도착지역명·코드, 주말/평일 구분 및 코드, 좌석버스(SEAT_BUS_ANULUSER_CNT), 일반버스(GENRL_BUS_ANULUSER_CNT), 마을버스(VILAGE_BUS_ANULUSER_CNT) 이용객 수로 구성됩니다. 이를 통해 지역 간 이동 패턴을 분석하고 노선 조정, 교통 혼잡 예측, 대중교통 정책 수립, 모빌리티 서비스 수요 예측 등의 목적으로 활용할 수 있습니다. 데이터는 월간으로 갱신되므로 시계열 추세 및 계절성 분석이 가능하며, Open API를 통해 인증키와 페이지 파라미터로 대용량 데이터를 효율적으로 수집할 수 있습니다. 데이터 사용 시 동일 기간의 버스 운행 정보 또는 다른 교통수단 통계와 결합하면 교통 수요를 입체적으로 해석할 수 있습니다.
