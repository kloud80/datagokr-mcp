summary_user: 부산교통공사가 운영하는 부산 도시철도 1호선 각 역(노포~다대포항)에 설치된 비상콜폰의 위치를 역명·역층·상세위치(승강장 번호, 상하선, 출입구 표시 등) 단위로 한 건씩 담은 파일 데이터(CSV 약 19.8KB)입니다. 역사 시설 관리자나 안전 점검 담당자가 '어느 역 몇 층 어느 승강장에 비상콜폰이 있는가'를 확인하거나, 이용객 안전 안내·시설 배치 분석을 하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 역·시설 데이터와는 운영기관명·노선명·역명 같은 이름을 맞춰 연결해야 합니다.
description_portal: 부산1호선 비상콜폰 데이터는 부산교통공사에서 관리하는 1호선의 여러 역들(괴정, 교대, 구서, 남산, 남포, 노포, 당리, 대티, 등대신, 동래, 두실, 명륜, 범내골, 범어사, 범일, 부산, 부산대, 부산진, 사하, 서대신, 서면, 시청, 신평, 양정, 연산, 온천장, 자갈치, 장전, 좌천, 중양, 초량, 토성, 하단, 낫개, 다대포항 등)에 설치된 비상콜폰 위치 정보를 상세히 제공합니다. 데이터는 철도운영기관명, 노선명, 역명, 역층, 그리고 상선/하선별 승강장 번호 및 출입구 표시 등 상세 위치 정보를 포함하여 각 역 내 비상콜폰의 정확한 설치 위치를 파악할 수 있도록 돕습니다. 비상콜폰은 긴급 상황 시 승객이 신속히 도움을 요청할 수 있는 중요한 안전장비로, 철도 안전관리와 긴급 대응 체계 구축에 필수적입니다. 이 데이터는 시설 관리, 유지보수 및 안전 점검뿐 아니라 이용객 안전 강화에 중추적인 역할을 수행합니다.
