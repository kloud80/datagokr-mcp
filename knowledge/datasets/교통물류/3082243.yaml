summary_user: 해양수산부가 관리하는 항만 시설 원장 중 시설별 하역 기기와 하역능력, 취급 화물, 선석 정보를 담은 API로, 전국 범위 전체 3,147건이다. 항만개발계획 담당자나 물류 기업, 연구자가 특정 항만의 하역능력과 시설 현황이 어떤지, 시설확보율을 산정할 근거가 되는지를 확인할 때 쓴다. 전역 조인 키는 확인되지 않아 같은 기관의 항만청 코드(prtAgCd)와 시설 코드(fcltyCd)로 연결하고, 입출항·물류 데이터와는 항만코드 매핑표를 거쳐 잇는다.
limits: 검증 호출에서는 전체 3,147건 중 50행만 받았으며, 전량을 수집하려면 페이지를 4회 이상 반복 호출해야 한다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와 결합할 때는 이름이나 코드 매핑이 필요하다.
