description_portal: 이 데이터는 해양수산부에서 항만시설 및 하역능력 파악하고, 제공하기 위해 수집한 데이터입니다.검색 대상 시설코드, 항만청코드 등 정보를 입력 파라미터로 하여 데이터를 조회할 수 있으며, 주요 내용은 항만청 코드, 시설 코드, 시설명, 하역 기기명, 하역 능력, 취급 화물명, 선석명 등으로 구성되어 있습니다.본 데이터는 관련 기관에서 시설현황 및 하역능력 파악을 통해 시설확보율을 산정하고, 항만개발계획 수립, 항만 운영 효율성 분석 및 물류 기업의 항만 이용 계획 수립을 위한 기초 자료로 활용될 수 있습니다. 또한, 연구기관에서 해운·항만 연구 등에 활용할 수 있습니다.
