summary_user: 경기도 평택시 관내에 등록된 물류창고업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일(csv, 약 7KB)로, 상호명·도로명 소재지·창고 동수·규모(제곱미터)·냉동냉장창고 동수와 면적·보관장소 면적·업태를 담는다. 평택에서 냉동냉장 창고를 갖춘 물류창고업체가 어디에 얼마나 있는지 알고 싶은 화주·물류 사업자나 창고 입지를 검토하는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 소재지도로명주소나 상호명을 맞춰 연결해야 하며, 사업자등록번호 컬럼은 이 파일에서 확인되지 않는다.
description_portal: 물류창고업은 물류 기능을 수행하기 위해 창고시설을 확보하고 이를 기반으로 물품의 입·출고, 보관, 관리 등의 서비스를 제공하는 업종으로, 지역 물류 인프라의 핵심 요소입니다. 본 데이터는 관내 물류창고업체의 등록 현황을 투명하게 공개함으로써, 물류산업의 체계적인 관리와 정책 수립을 지원하고, 민간의 물류 수요 분석 및 입지 선정 등에 활용될 수 있도록 하기 위해 개방하였습니다. 공공데이터로 공개함으로써 민간기업의 의사결정 지원, 창업 기회 확대, 연구자료 제공 등 다양한 분야에서의 활용이 가능하며, 행정의 투명성과 효율성 제고에도 기여합니다. 본 데이터에는 업체명, 사업장 소재지, 등록일자, 창고 유형 등 등록된 물류창고업체의 주요 정보가 포함되어 있습니다.이 데이터는 실제와 다소 차이가 발생할 수 있습니다.
