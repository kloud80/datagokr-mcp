summary_user: 성남시에서 운영 중인 버스노선을 노선 한 건씩 담은 원장 파일(csv, 약 15KB)로, 노선명·기점/종점 정류장명·운수회사명과 출퇴근·평일·주말 배차간격, 주중·주말 상하행 첫차·막차 시간을 담는다. 성남 시민이나 분석가가 '이 노선은 주말에 몇 분 간격으로 다니고 막차는 몇 시인가', '어느 운수회사가 어떤 노선을 운행하나' 같은 질문에 쓴다. 전역 조인 키(노선ID·정류장ID)가 없어 다른 버스 데이터(정류장 원장, TAGO·BIS 실시간 도착)와는 노선명·정류장명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 성남시 내에서 운영중인 버스노선 현황으로 노선명, 기점정류장명, 종점정류장명, 운수회사명, 배차간격, 첫차시간, 막차시간, 안내사항 등의 항목으로 구성되어 있습니다. 버스노선 현황은 시내에 운영 중인 버스 노선의 종류, 운행 경로, 정류장 위치, 배차 간격 등의 정보를 종합적으로 파악한 자료를 의미합니다. 이는 대중교통 서비스의 효율성, 교통 접근성, 주민 편의성 등을 높이기 위한 데이터로 활용됩니다. 이 밖에도 노선의 전체 운행 거리, 정류장 간 이동 시간, 버스가 운행되는 구간 교통 분석이나 정책 수립에 유용하게 쓰인다.
