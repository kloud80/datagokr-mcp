summary_user: 대구광역시 구·군 공영주차장과 신청된 민영주차장을 주차장 한 곳당 한 행으로 담은 파일(csv, 약 759KB)로, 지번주소·위도·경도, 주차구획수, 소유·운영 유형, 운영시간, 거주자 요금 등을 함께 담는다. 시민이나 분석가가 "대구 특정 구에 있는 공영주차장의 위치와 면수, 거주자 요금은 어떤가"를 확인하거나 구·군별 주차 공급과 요금 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 시군구코드·시군구명이나 주차장명·주소 매칭, 위도·경도를 이용한 공간 결합으로 전국주차장정보표준데이터 등과 이어 쓴다.
description_portal: 통합주차정보 데이터는 대구시 구군 공영주차장 및 신청된 민영주차장에 대한 위치, 운영, 요금, 이용현황 등을 종합적으로 제공하는 공공데이터로, 효율적인 주차정책 수립과 시민 편의를 위해 제공된다. 이 데이터에는 주차장아이디와 주차장명으로 시설을 식별할 수 있으며, 시군구코드 및 시군구명으로 행정구역을 구분한다. 도로명주소와 지번주소는 정확한 위치정보를 제공하고, 위도와 경도는 GIS(지리정보시스템) 연계 활용을 가능하게 한다. 운영 측면에서는 관리기관명, 운영주체명, 소유주체구분, 운영유형구분 등의 항목을 통해 주차장의 소유·운영 구조를 파악할 수 있으며, 요금 항목에는 거주자요금(주간, 야간, 전일, 상근)과 일반요금(최초, 추가, 1시간, 1일, 정기권) 등의 정보가 포함되어 유형별 요금 정책을 비교·분석할 수 있다.
