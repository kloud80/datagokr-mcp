description_portal: '본 데이터는 한국도로공사가 수집한 고속도로 갓길차로 운영(LCS: Lane Control System) 관련 메시지 이력 정보이다.  LCS는 정체 구간 해소 및 사고 예방을 위해 특정 시간대에 갓길을 임시로 차로로 운영하는 시스템이다.  데이터에는 메시지 표출 일시, 운영 구간, 메시지 종류, 표출된 메시지 내용, 표출 시간 등의 정보가 포함되어 있다.  해당 데이터는 실제 갓길차로 운영에 활용된 메시지의 시기별 변동과 내용을 반영하고 있어,  정책 수립, 교통 흐름 분석, 긴급상황 대응 전략 마련, 안전성 향상 등의 목적으로 유용하게 사용될 수 있다.  데이터는 CSV 형식으로 제공되며, 기간별 조회를 통해 특정 구간 및 시간대의 운영 이력을 파악할 수 있다.* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000047'
