summary_user: 부산시 승용차요일제 가입 차량 소유자에게 할인 혜택을 주는 가맹점을 업소 한 곳씩 담은 목록으로, 할인 구분(외식·정비·이미용·문화·주유 등), 상호, 전화번호, 할인 내용, 주소와 위경도 좌표를 포함한다. 승용차요일제에 가입한 시민이 집 근처에서 정비나 외식 할인을 받을 수 있는 업소를 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 위경도 좌표나 주소로 지도·상권 데이터에 겹쳐 보거나 업소명을 기준으로 맞춰 이어 쓴다.
description_portal: 부산시에서는 에너지 절약과 대기오염을 줄이기 위해 승용차 요일제를 시행중입니다 승용차 요일제에 가입하여 운행하는 자동차 소유자에게 할인 혜택을 제공하여 승용차 요일제 확산을 도모하기 위해 할인 가맹점의 정보를 개방합니다개방된 데이터에는 할인 구분, 할인점 상호, 전화번호, 할인 내역, 주소 등이 포함되어 있습니다외식할인 686개 업소, 정비할인 327개 업소, 이미용할인 259개 업소, 문화할인 12개 업소, 주유할인 4개 업소, 체인형 외식할인 3개 업소, 기타 678개의 할인 혜택을 제공합니다.기준금액 이상 결제시 일정 금액을 할인해주거나 서비스 제공, 공임 할인 등의 혜택을 제공하고 있습니다.*기준일 2025.5.19 현재
