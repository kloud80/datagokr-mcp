summary_user: 수도권 8호선 각 역에 설치된 전동휠체어 급속 충전설비를 역 단위로 담은 파일로, 운영기관·선명·역명·지상지하 구분·역층·상세위치·충전설비 수·전화번호가 들어 있다(csv 약 1.3KB). 전동휠체어 이용자나 보호자가 '8호선 어느 역 몇 층에 충전기가 있고 몇 대인지'를 확인하거나, 교통약자 편의시설 분포를 살피는 분석가가 역별 설치 현황을 볼 때 쓴다. 전역 조인 키가 없어 다른 역·시설 데이터와는 역명과 선명을 기준으로 이름을 맞춰 이어 써야 한다.
