summary_user: 전국 시도·시군구 단위로 거주자우선주차제의 시설구분, 거주자우선주차장 개수, 총 주차면수를 담은 집계 파일로, 각 지자체가 조사한 내용을 2023년에 취합해 2022년까지의 정보를 제공한다. 지자체 교통·주차 담당자나 분석가가 '우리 시군구의 거주자우선주차 면수가 다른 지역에 비해 얼마나 되는가'를 비교하는 데 쓴다. 전역 조인 키는 없으며, 행안부 행정표준코드를 따르는 시도·시군구 코드로 지역 단위 통계와 이어 쓰고, 개별 주차장 위치·요금은 전국주차장정보표준데이터 같은 원장과 지역명·코드 매핑으로 연결한다.
description_portal: 해당 데이터는 한국교통안전공단에서 제공하는 정보입니다. 데이터를 제공하는 시스템은 주차정보시스템에서 제공하고 있으나, 본 정보는 각 지방자치단체에서 조사한 내용을 취합하여 전국 지자체 단위(시도, 시군구)로 데이터를 제공하고 있습니다. 거주차 우선주차 제공에 대한 시설구분 정보와 거주자우선주차장의 개수 그리고 거주자우선주차장의 총 주차면수를 제공합니다. 해당 데이터는 2023년도에 각 지자체 정보를 취합한 데이터로 2022년도 까지의 정보를 제공하고 있습니다. 시도 코드, 시군구 코드는 행안부의 행정표준코드를 준용합니다.
