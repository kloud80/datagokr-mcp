summary_user: 전국 이륜자동차 사용신고 현황을 년월·시도 단위로 집계한 파일(약 14.9KB CSV)로, 관용과 자가용으로 나누고 각각 경형·소형·중형·대형 건수를 담는다. 정책 담당자나 분석가가 '어느 시도에서 자가용 이륜차 신고가 월별로 어떻게 늘거나 줄었나' 같은 지역별 추세 질문에 쓴다. 전역 조인 키는 없고 시도코드·시도명과 년월을 이름·코드 매핑해 다른 시도별 월간 통계(인구, 이륜차 사고 등)와 이어 쓴다.
description_portal: 이 데이터는 「자동차관리법」 및 관련 시행규칙에 따라 한국교통안전공단(KOTSA)에서 관리하는 이륜자동차 사용신고 현황을 월별로 집계한 자료입니다. 전국 지자체를 통해 접수된 이륜자동차 신규 사용신고, 이전·변경 신고, 말소 신고 등의 현황을 기준으로 작성되며, 신고 건수를 시·도별, 월별로 세분화하여 제공합니다. 이를 통해 이륜차 등록 추세와 지역별 신고 변동 패턴을 파악할 수 있으며, 이륜차 관리 제도 개선, 안전 정책 수립, 운행 질서 확보 등 행정 및 연구 목적으로 활용될 수 있는 기초 자료로 제공됩니다.
