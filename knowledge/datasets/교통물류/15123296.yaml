description_portal: 'ITS 국가교통정보센터(https://its.go.kr/)에서 매년 주기적으로 업데이트를 하고 있는‘국도 ITS(Intelligent Transport Systems) 구축 현황(2023. 9. 1.)’ 자료로, 관할 구역 내 주요 국도 노선별 지능형교통체계(ITS) 설치 및 운영 현황을 정리한 데이터입니다. 자가통신망 구축 구간, 연장, 교통감시 및 제어 장비 설치 현황 등을 포함하여 국도 교통관리 효율화와 안전성 제고를 위한 기반 자료로 활용됩니다.1. 형식: XLSX2. 내용 요약   ■ 노선: ITS 설비가 설치된 국도의 노선명(예: 국도5호선, 6호선 등)   ■ 자가망 구간 및 연장(㎞): 원주청 관할 국도의 구간별 자가통신망 구축 여부 및 총 연장 거리(예: 총 1,289.8㎞)   ■ 현장 설비 수량: 설치된 ITS 장비의 항목별 수량   　- CCTV: 교통상황 모니터링용 폐쇄회로카메라(예: 658대)   　- VMS(Variable Message Sign): 도로상황 안내 전광판(예: 318기)   　- VDS(Vehicle Detection System): 교통량·속도 감지기(예: 141기)   　- AVI(Automatic Vehicle Identification): 차량 식별 및 통행정보 수집 장비(예: 54기)   　- VSL(Variable Speed Limit): 구간별 속도제어 시스템(예: 840기)   　- 기타: 기상관측장비, 통신설비, 제어기 등 부대 ITS 장치(예: 580기)   ■ 비고: 장비 유지보수 또는 설치 예정 등 특이사항3. 활용 예제   ■ 국도별 ITS 설비 분포 및 노후장비 교체 계획 수립   ■ CCTV 및 VMS 데이터를 활용한 교통혼잡 모니터링 및 실시간 대응체계 구축   ■ 교통량 감지(VDS) 및 속도제어(VSL) 자료를 연계해 도로 안전성 평가 및 정책 수립   ■ 국도 자가망 연장 데이터를 기반으로 광역 I'
