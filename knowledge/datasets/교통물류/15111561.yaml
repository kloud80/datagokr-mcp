summary_user: 서귀포시 관내에서 도로 점용·굴착 허가를 받은 건을 허가 한 건 단위로 담은 파일(xlsx)로, 허가일·업무구분·점용지·점용목적 등이 들어 있다. 시민이나 공사·인프라 분석가가 '서귀포시 어느 도로에서 언제 무슨 목적으로 굴착·점용 공사가 허가됐나'를 확인해 공사 시기와 장소를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 점용지 주소 문자열을 지명·주소로 맞추거나 같은 기관(서귀포시) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 서귀포시 관내에서 도로를 점용하거나 굴착을 허가 받은 건들의 정보를 정리한 자료입니다. 주요 항목으로는 허가번호, 허가일자, 점용 시작일 및 종료일, 점용 단위(면적이나 연장), 허가 대상 사업명 및 시행기관 등이 포함되어 있습니다. 이 자료를 통해 도로 굴착이 이루어진 위치와 규모를 파악할 수 있으며, 지자체는 이 데이터를 토대로 도로관리심의회 운영, 중복공사 조정, 교통통제 계획, 주민불편 최소화 대책을 마련할 수 있습니다. 또한 연구자나 민간기업도 굴착‧점용 패턴을 분석해 공사 타이밍, 인프라 투자 분석, 도시 공간 활용 계획 등에 활용할 수 있습니다.
