description_portal: 본 데이터는 항만 건설 분야에 적용되는 신기술 정보를 체계적으로 관리하고 공유하기 위해 수집된 자료입니다.주요 항목으로는 건설신기술번호, 지정(등록)번호, 지정(등록)년도, 고시(공개)번호 및 고시(공개)일자, 신기술 명, 기술분류, 신기술 적용범위, 신기술 내용, 보호 시작기간 및 보호 종료기간, 개발회사, 과학기술표준분류, 키워드, 기술분류 코드, 과학기술표준분류 코드 등이 포함되어 있습니다.본 데이터는 항만 건설 및 유지관리 과정에서 활용 가능한 신기술의 제도적 정보와 기술적 특성을 함께 제공하여, 신기술의 적용 가능 여부, 보호 기간, 기술 분류 및 관련 분야를 종합적으로 확인할 수 있도록 구성되어 있습니다.해당 자료는 항만 건설 사업의 설계·시공 단계에서 신기술 적용 검토, 기술 중복 여부 확인, 보호기간 만료 여부 판단 등에 활용될 수 있으며, 발주기관의 기술 검토 및 제도 운영, 건설업체의 기술 도입 검토, 연구기관의 기술 동향 분석 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다.
