summary_user: 인천교통공사가 운영하는 인천1호선·인천2호선·7호선 인천·부천구간 역사에 설치된 물품보관함을 설치 위치 단위로 담은 현황 파일로, 호선·역명·위치구분·층·상세위치·시설현황·운영사를 기록한다. 지하철 이용객이 짐을 맡기려 할 때 어느 역 몇 층 어디에 보관함이 있는지, 운영사가 어디인지 확인하는 데 쓴다. 전역 조인 키나 역 코드가 없어 다른 역 데이터와는 호선·역명 이름 매칭으로만 이어 쓴다.
description_portal: 인천교통공사에서 운영중인 도시철도 인천1호선, 인천2호선, 7호선 인천·부천구간의 2025년 6월30일 기준 역사에 설치된 물품보관함 현황 정보입니다.해당 데이터는 호선, 역명, 위치구분, 위치층, 상세위치, 시설현황, 운영사 항목으로 구성되어있습니다.물품보관함은 인천1호선 17개역, 인천2호선 4개역, 7호선 인천·부천구간 10개역에 총 32대가 설치되어있습니다.물품보관함 크기는 대, 중, 소로 설치 역별로 모든 사이즈를 이용할 수 있도록 구성되어있습니다.물품보관함 운영사는 인천1호선 1개 업체, 인천2호선과 2호선 인천·부천구간을 운영하는 1개 업체가 있습니다.
