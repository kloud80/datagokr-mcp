summary_user: 2018년식 중형 경유 시내버스 한 대의 하루 운행을 시간 단위로 기록한 센서 원천 데이터로, 엔진회전수·토크·차량속도·가속페달·브레이크 같은 주행 정보와 EGR·DPF·SCR 온도·압력, SCR 전후 질소산화물 농도, 요소수 분사량 같은 후처리장치 정보를 담은 CSV 파일(약 21.6MB)이다. 연구자나 운수업체가 잦은 정차·가감속이 반복되는 도심 주행에서 엔진 부하와 질소산화물 저감 효과, 요소수 사용량이 어떻게 달라지는지를 분석하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 날짜·시간 필드를 기준으로 같은 기관의 다른 차종 센서데이터와 나란히 비교하는 정도로만 이어 쓴다.
description_portal: 본 데이터는 2018년식 중형 경유 시내버스가 하루 전체 운행 기록을 담고 있는 고정밀 센서 데이터입니다. 이 데이터는 마을버스나 특정 노선에 투입되는 중형 버스의 운행 특성, 즉 잦은 가감속과 정차, 공회전이 반복되는 도심 주행 환경(Duty Cycle)을 상세히 반영합니다.데이터는 차량의 주행 정보와 엔진 및 후처리장치 중심의 센서 정보로 구성됩니다. GPS 기반의 위치, 속도 정보는 노선별 운행 효율성을 분석하는 기초가 되며, 엔진 회전수(RPM), 엔진 부하율(Engine Load), 실시간 연료 소모량 데이터는 중형 버스의 운영 효율성과 비용 구조를 파악하는 데 직접적인 정보를 제공합니다.특히 2018년식 모델은 강화된 배출가스 규제(유로 6)를 충족하는 차량이므로, 기존 엔진 데이터 외에 요소수(Urea) 분사량, 배출가스 저감장치(SCR/DPF) 관련 정보가 포함될 수 있어 환경적 분석 가치가 더욱 높습니다. 이를 통해 운수업체는 연비 개선뿐만 아니라, 요소수 사용 최적화, DPF 관리 등 친환경 운행 전략을 수립할 수 있습니다.학술적으로는 최신 경유차의 실제 도로 주행 시 배출가스(Real-Driving Emissions, RDE) 특성을 연구하고, 도심 대기 질에 미치는 영향을 분석하며, 더 효율적인 대중교통 정책을 수립하는 데 필수적인 실증 자료로 활용될 수 있습니다.
