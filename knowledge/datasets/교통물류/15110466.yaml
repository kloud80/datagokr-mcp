summary_user: 대전광역시 도로관리시스템에 등재된 석축·옹벽을 시설물 한 건씩 담은 원천 목록으로, 위치(WKT 지리정보)·행정읍면동·도로구간번호와 재질·구조·연장·폭원·최대/최소 높이를 담으며 범위는 대전 시 전역, 행정단위는 읍면동이다. 도로 관리 담당자나 안전 분석가가 '우리 동네 도로변에서 높이가 높은 옹벽이 어디에 몰려 있는가'처럼 위험 구간 점검 대상을 추리는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 행정읍면동 이름 매핑이나 같은 기관의 도로구간번호·관리번호로 대전시 다른 도로시설물 자료와 이어 쓰고, WKT 좌표로 공간 결합한다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 기관 데이터와는 이름 매칭이나 공간 결합으로만 연결된다. 청년 인턴이 구축·정비한 참고용 자료로 법적 효력이 없고, 점검 이력·안전등급 같은 상태 평가 필드는 필드 목록에 없다.
