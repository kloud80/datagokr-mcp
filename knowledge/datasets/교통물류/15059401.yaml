summary_user: 자동차 신규등록 통계를 등록년·월, 차종, 등록지역(광역시도), 사용연료, 차명, 용도, 성별·연령대, 배기량, 국산·수입 구분 같은 조건으로 걸러 건수(dtaCo)로 돌려주는 전국 단위 집계 API다. 분석가나 사업자가 '특정 시도에서 지난달 전기차 신규등록이 몇 대였나', '30대 여성의 수입차 신규등록 추이는 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·연료명 같은 이름·코드 매핑이나 같은 기관(한국교통안전공단) 코드로만 이어 쓴다.
description_portal: 자동차정보API 서비스로 자동차 등록년(YYYY),등록월(MM),차종코드(경형,소형,중형,대형,다목적,기타),등록지역코드(광역시도),사용연료코드(CNG,경유,수소,엘피지,전기,하이브리드,휘발유),차명코드(별도코드표 제공),용도구분명,성별구분, 연령대(10대~80대),배기량코드800cc미만~5000cc 이상),국산수입구분명(국산, 외산)을 입력하여 기간별 신규등록 통계정보를 조회하는 서비스 입니다. *매월1일부터 말일까지의 데이터는 익월2일에 조회 및 활용 가능합니다. *인증키는 공공데이터포털에서 자동발급 됩니다.
