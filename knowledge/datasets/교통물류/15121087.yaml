summary_user: 부산광역시 스마트교차로의 접근로(진입 방면)별로 수집일시마다 직진·좌회전·우회전 교통량을 대형·중형·소형 차종으로 나눠 담고, 대기행렬 길이와 보행자 수를 함께 담는다. 교통 분석가나 연구자가 특정 교차로의 어느 방면에서 좌회전 대기가 길어지는지, 보행자가 많은 시간대에 신호 운영을 어떻게 조정할지 판단하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교차로명(ixrNm)·접근로 방면 이름을 맞추거나 같은 부산시 교통 데이터와 이름 매핑으로만 연결한다.
description_portal: '본 데이터는 부산광역시에서 제공하는 스마트교차로 접근로별 교통량 및 보행자 정보입니다.주요 제공 항목은 수집일시, 교차로명, 접근로 방면, 직진·좌회전·우회전 교통량, 대기행렬 길이, 보행자 수 등이며, 교차로 진입부별 세부적인 교통 흐름을 파악할 수 있습니다.이 데이터는 교차로 운영 효율성 분석, 신호 최적화, 보행자 안전 관리 등을 위한 기초자료로 활용할 수 있습니다.<제공방식>형식: Open API응답 포맷: JSON (필요 시 XML 지원 가능)인코딩: UTF-8<활용안내>접근로별 세부 교통량(좌·우회전, 직진) 분석교차로 혼잡도 및 대기행렬 길이 평가보행자 교통량 기반 안전관리 정책 수립신호 운영 최적화 및 스마트교차로 성능 향상 연구민간 교통서비스와 연계한 교차로 단위 실시간 교통 안내'
team:
  dept: 교통정보서비스센터
