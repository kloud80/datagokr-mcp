description_portal: 21년도를 기준으로 내압용기검사가  진행된 차량의 유형별 불합격 현황 자료 입니다.2021년 1월 1일부터 2021년 12월 31일까지의 내압용기검사 불합격 통계 자료로써 불합격 종류와 그에 해당하는 건수가 기재되어있습니다.15개의 대분류(가스누출, 충전밸브, 검사요건, 기타장치, 동일성확인,배관, 수소차 연료계통장치, 압력계, 압력조정기, 연료주입구, 외관검사, 용기 및 밸브표시, 용기밸브, 용기장착상태, 주밸브)로 불합격 항목을 설정하고 각 항목별 세부 내용 및 해당 불합격 내용에 대한 건수가 기재되어있습니다. *차량 대수에 대한 불합격이 아닌 건수에 대한 내용입니다.
