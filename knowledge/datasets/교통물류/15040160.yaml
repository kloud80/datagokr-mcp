summary_user: SRT 경부선·호남선의 출발역-도착역 구간별 기본여객운임(원)을 담은 2020년 1월 기준 1회성 파일로, 4KB 남짓의 작은 CSV입니다. 승객이나 서비스 개발자가 '수서에서 부산까지 SRT 기본운임이 얼마인가' 같은 구간 요금을 조회하는 데 쓰며, 분석용보다는 서비스용 조회 자료에 가깝습니다. 전역 조인 키가 없어 역 이름(출발역·도착역)을 다른 철도역·시간표 데이터의 역명과 맞춰 이어 써야 합니다.
description_portal: '1. 고속철도 SRT 운영사 주식회사 에스알에서 제공하는 SRT 여객 운임 요금 정보 데이터입니다. 2. 출발역-도착역으로 구분되어 있으며, 구분별 고속열차 SRT의 기본여객운임 정보를 알 수 있습니다. (경부선, 호남선)3. (예시)수서-동탄 기본운임 금액 : 7500 (단위 : 원)* 해당 데이터는 1회성 데이터입니다.* 2020년 1월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.'
