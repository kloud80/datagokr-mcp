summary_user: 경상북도 김천시 관내 과속방지턱을 한 개씩 담은 건별 파일로, 위치(도로명·지번주소·위경도)와 재료·형태·높이·폭·연장, 설치년도, 규격 충족 여부를 담는다. 운전자나 내비·지도 서비스 사업자, 교통안전 분석가가 '김천시 어느 도로에 규격에 맞지 않는 과속방지턱이 몰려 있나' 같은 질문에 쓴다. 전역 조인 키는 없어 시군구명·도로명 같은 이름이나 위경도 좌표로 단속카메라·어린이보호구역 등 다른 도로 규제 데이터와 맞춰 쓴다.
description_portal: 경상북도 김천시 관내 과속방지턱에 대한 현행화 데이터 자료입니다. 과속방지턱 설치 기준에 충족하며, 현장 위험도에 따라 김천시 내 과속방지턱을 설치하였으며, 데이터 내용으로는 과속방지턱 관리번호, 시도명, 시군구명, 도로명, 소재지 지번주소, 설치장소, 과속방지턱재료, 과속방지턱형태구분, 과속방지턱높이, 과속방지턱폭, 과속방지턱 연장, 도로유형구분, 위경도, 보차분리여부, 연속형여부, 설치년도, 관리기관명, 관리기관전화번호 및 데이터기준일자 등이 있으며 매년 현행화 하는 자료입니다.파일내 항목별 코드설명은 "과속방지턱 파일"을 참고해 주시기 바랍니다.
