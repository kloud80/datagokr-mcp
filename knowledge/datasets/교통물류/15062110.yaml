summary_user: 인천광역시 승용차요일제 참여자에게 혜택을 주는 제휴업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 구분·지역·상호·주소·전화번호·가입일자·사용여부가 들어 있으며 범위는 인천 시 단위, 위치는 개별 주소 수준이다. 요일제에 참여한 시민이 '우리 동네에서 요일제 혜택을 주는 가게가 어디인가'를 찾거나, 분석가가 지역별 제휴업체 분포를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소를 지오코딩하거나 지역명·상호를 이름으로 맞춰야 이어 쓸 수 있다.
description_portal: 인천광역시 승용차요일제 인센티브업체 현황 공공데이터는 요일제 참여자에게 혜택을 제공하는 제휴업체 정보를 담고 있습니다. 데이터는 번호, 구분, 지역, 상호, 주소, 전화번호, 가입일자, 사용정보가 포함되어 있습니다.이 데이터를 활용하면 승용차요일제에 참여하는 시민들이 혜택을 놓치지 않고 편리하게 이용할 수 있고, 참여업체 입장에서는 홍보 효과를 얻어 서로에게 도움이 됩니다.쉽게 말해, 인천시가 운영하는 착한 운전 제도에 동참한 시민들에게 고마움을 표시하기 위해 혜택을 제공하는 가게들의 목록입니다.해당 데이터는 공공데이터포털에서 무료로 다운로드 할 수 있습니다.
