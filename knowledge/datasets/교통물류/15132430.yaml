summary_user: 전국 기계식주차장치의 설치현황을 시도·시군구별, 장치 대분류(종류)별로 집계해 설치 대수와 설치된 건물 수를 담은 파일이다(포털 설명상 2022년 말 기준, 2023년 정리). 지자체 주차정책 담당자나 분석가가 '우리 시군구에 어떤 종류의 기계식주차장치가 몇 대, 몇 개 건물에 있는가'를 파악하거나 안전점검 수요를 가늠할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 이름 매칭으로만 이을 수 있고, 개별 주차장 단위의 전국주차장정보표준데이터와는 행정구역 수준에서만 비교한다.
description_portal: 한국교통안전공단에서 제공하는 정보입니다. 해당 정보는 전국에 설치된 기계식주차장치의 지방자치단체별(시도, 시군구) 설치현황을 간략한 정보로 제공하고 있습니다. 기계식주차장치가 설치된 건물의 개수(기계식주차장치의 개수가 아닙니다.)와 기계식주차장치의 각 종류별 설치대수를 제공합니다. 해당 자료는 2023년에 정리한 자료로, 2022년 말 기준으로 정보를 제공합니다. 정보 제공 시기에 따라 기계식주차장의 종류가 현행과 다를 수 있습니다. 주소는 행정표준코드를 준용하여 사용하고 있습니다.
