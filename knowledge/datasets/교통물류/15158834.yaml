      - name: routeBe
        required: false
        desc: 국제선 = 1 국내선 = 0 (샘플 :0)
      - name: nvgBe
        required: false
        desc: 정기 = 0부정기 = 1(샘플 :0)
      - name: pasngrCargoBe
        required: false
        desc: 여객 = 0화물 = 1(샘플 :0)
      - name: pasngrBe
        required: false
        desc: 유임 = 0무임 = 1(샘플 :0)
      - name: cargoBe
        required: false
        desc: 수화물 = 0화물 = 1우편물 = 2화물+우편 = 3(샘플 :0)
      - name: type
        required: false
        desc: 응답 형식(JSON & XML)(샘플 :xml)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 5000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
