summary_user: 한국공항공사가 관할하는 공항(인천국제공항 제외)의 수송실적을 공항별로 도착·출발·합계 운항편수(건), 여객 수(명), 화물량(KG)으로 담은 집계 통계다. 지역 관광·출장 수요를 가늠하려는 분석가가 "김포·김해·제주 등 공항별 여객과 화물 실적이 어떻게 다른가"를 비교하는 데 쓴다. 전역 조인 키가 없어 공항명(Airport)을 기준으로 다른 항공통계나 공항코드 데이터와 이름 매핑해 이어 쓴다.
limits: 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 공항 이름 매핑으로만 연결된다. 인천국제공항은 포함되지 않으므로 전국 전체 항공 수송량으로 해석하면 안 된다. 개발계정 호출은 일 5,000회로 제한된다.
