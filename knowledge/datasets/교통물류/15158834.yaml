description_portal: 한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는 한국공항공사가 관할하는 운영하고 있는 혹은 운영되었던 공항(총 18개,2014년 현재 14개 공항 운영) 수송실적(운항, 여객, 화물) 통계를 제공합니다.제공되는 주요 데이터 항목으로는 화물건수, 운송 승객 수 등 이 상세히 포함되어 있습니다. 이를 통해 공항별 운항 실적,  등 다양한 목적의 데이터 활용이 가능합니다.제공되는 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.
