summary_user: 광주 도시철도 각 역의 출구번호별로 주변 주요 지명(시설·기관·건물·아파트 단지 등)과 그곳까지의 거리(m), 도보 소요시간(분)을 한 행씩 담은 안내 목록 파일입니다(CSV 약 17KB). 승객이나 방문객이 '이 건물에 가려면 어느 역 몇 번 출구로 나가 몇 분 걸어야 하나'를 확인하거나, 역세권 편의시설 안내도와 보행 접근성 분석에 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 역 데이터와는 역명 문자열 매칭으로만 잇고, 좌표가 없으므로 GIS 연계에는 역·출입구 위치 데이터를 역명과 출구번호로 따로 붙여야 한다.
description_portal: 이 데이터는 광주광역시 도시철도공사 역사 출구별 안내 정보를 정리한 자료로, 각 지하철 역 출구 주변의 주요 지명과 그에 대한 접근 정보를 제공합니다. 주요 항목에는 역명, 지명(주요 시설·기관·건물·아파트 단지 등), 출구번호, 거리(m), 소요시간(도보 기준, 분)이 포함되어 있습니다.이 자료를 활용하면 각 역 출구별 주변 환경과 접근성을 파악할 수 있어, 승객 안내 시스템 구축, 역세권 편의시설 안내 지도 제작, 관광객 및 방문객 경로 안내 등에 유용합니다. 또한 거리와 소요시간 정보는 보행자 이동 경로 최적화, 교통약자 이동 편의 개선, 환승 동선 설계 등의 분석에 활용할 수 있습니다. 특히 주변 지명 데이터와 GIS를 연계하면 역세권 분석, 상권·주거지 접근성 평가, 도보 네트워크 효율성 연구 등에도 중요한 기초 자료로 쓰일 수 있습니다.
