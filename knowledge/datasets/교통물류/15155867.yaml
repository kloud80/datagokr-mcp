summary_user: 전국 자동차검사소별로 배정인원수, 월 총량제, 이전 총량제와 접수 가능 대수 등의 비고를 담은 검사소 단위 파일(csv, 약 35만 바이트)이다. 검사소 운영 분석가나 정책 담당자가 "어느 검사소가 배정 인원 대비 월 검사 총량이 많은가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 검사소코드를 같은 기관의 검사소 목록·위치 데이터와 코드 또는 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 자동차 검사소별 총량제에 대한 정보를 기록한 자료로, 배정인원수와 월 총량제를 포함하여 각 검사소에서 수행해야 하는 검사 총량을 관리합니다. 이전 총량제 항목은 과거의 검사량을 기록하며, 이를 통해 검사소의 검사 수행 능력과 인원 배정 효율성을 평가할 수 있습니다. 비고 항목은 접수 가능한 대수나 월별 총량에 대한 세부사항을 제공합니다. 이 정보는 검사소 운영 효율성을 분석하고, 검사 예약 시스템의 최적화를 위한 중요한 자료로 활용될 수 있습니다. 총량제는 검사소의 성능 평가와 운영 계획 수립에 중요한 기초 자료로 사용됩니다.
