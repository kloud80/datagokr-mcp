summary_user: 경상남도 도로대장전산화 시스템의 인터체인지(IC) 제원을 IC 한 곳당 한 행으로 담는 원천 대장 파일로, 노선번호·구간번호, 개통일, 구간내 이정, 소재지 주소, 형식, 접속도로 정보와 램프 최대 4개의 연장·폭원·차로수·진출입 구분을 포함한다(파일 크기 약 1.5KB로 소규모). 도로 분석가나 지자체 담당자가 '경남 관리 도로의 어느 IC가 몇 개 램프와 몇 차로로 어느 도로에 접속하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 도로대장 데이터나 표준노드링크와는 노선번호·구간번호·관리기관·인터체인지명 같은 이름·코드를 맞춰 연결해야 한다.
