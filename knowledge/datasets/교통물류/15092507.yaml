description_portal: '데이터 개요국토교통부가 제공하는 ‘업체별 항공종사자 현황’ 데이터는 국내 항공사별로 조종사, 정비사, 운항관리사, 객실승무원 등 주요 항공종사자를 **직종별·국적별(내국인/외국인)**로 구분하여 연도별로 집계한 자료입니다.항공산업의 인적 자원 구성 현황을 정량적으로 파악할 수 있는 핵심 자료로, 항공인력 수급계획, 교육훈련정책 수립, 외국인 종사자 활용 현황 분석 등에 활용됩니다.주요 제공 항목조종사: 운송용 조종사, 사업용 조종사정비사: 항공정비사, 항공기 공장정비사운항관리사: 운항통제 담당 인력객실승무원: 여객기 객실 서비스 및 안전 담당합계: 위 직종 인력의 전체 합계국적별 구분내국인: 대한민국 국적 보유 인력외국인: 외국 국적 보유 인력각 직종별로 국적별 인원을 별도로 제공활용 안내항공산업 인력 국적 다변화 추이 분석직종별 인력 수급 및 교육훈련 정책 수립 근거항공사별 인력운용 전략 비교외국인 인력 고용 규모 및 비율 모니터링[데이터 예시]항공사국적운송용 조종사사업용 조종사조종사 소계정비사(항공/공장)운항관리사객실승무원합계대한항공내국인1,8159422,7572,661 / 01686,08711,673대한항공외국인19001900 / 0040230소계-2,0059422,9472,661 / 01686,12711,903'
