summary_user: 철도산업과 관련된 국내 특허출원을 한 건씩 모아 발명의 명칭, 출원일자, 출원번호, 출원인, 요약내용을 담은 전국 범위의 파일 데이터(CSV 약 4.9MB)이다. 철도 기술 연구자나 관련 사업자가 특정 기술 분야에서 어떤 기관·기업이 언제 특허를 출원했는지, 출원 추세가 어떤지를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 출원인 이름 등으로만 연결되며, 특허의 상세 내용은 출원번호로 특허정보원 키프리스에서 따로 조회해 이어 본다.
description_portal: 철도와 관련 특허 정보를 제공합니다.특허정보원에서 제공하는 특허자료중 철도산업과 관련 있는 자료들을 수집하여 제공합니다.특허출원정보중 발명의명칭 및 출원일자/출원인의 정보를 제공합니다.수집된 특허의 내용에 대한 요약내용도 제공합니다.철도관련 특허정보는 출원년도가 1976 년부터 2025년 현재까지 공개된 자료의 요약내용과 출원인 정보를 제공합니다.특허의 상세한 내용은 특허정보원 키프리스에서 출원번호로 검색하시면 됩니다.(제공정보:발명의명칭,출원일자,요약내용,출원번호,출원인,출원정보)
