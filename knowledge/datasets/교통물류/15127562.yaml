summary_user: 서울 따릉이 대여소별 이름을 한국어·영어·중국어·일본어로 담은 정적 명칭 파일로, 한 행에 대여소명과 언어구분코드, 해당 언어의 대여소명이 들어 있다(xlsx 약 480KB, 포털 설명상 2026년 5월 기준 운영 대여소). 외국인 관광객 안내나 지도 앱·교통 안내 시스템 개발자가 '이 따릉이 대여소를 영어·중국어·일본어로 어떻게 표기하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 따릉이 대여소 위치·실시간 대여 정보 등 다른 데이터와는 한국어 대여소명을 맞춰 붙여야 하고, 같은 기관의 다국어 대여소 그룹 정보(자치구별 묶음)와 함께 쓴다.
description_portal: '서울특별시 공공자전거 따릉이 대여소 정보입니다.이 정보는 외국인 이용자들이 서울시 공공자전거를 더 쉽게 사용할 수 있도록 돕기 위해 만들어졌습니다.26.5월 기준 서울 시내에 운영중인 따릉이의 대여소 목록을 제공합니다.제공되는 대여소 목록에 대한 대여소명을  한국어, 영어, 중국어,일본어로 제공합니다.* 다국어 대여소 정보는 개별 대여소에 대한 다국어 명칭을 제공하는 것이고 다국어 대여소 그룹 정보는자치구별로 그룹화 한 정보 입니다.목적: 따릉이 대여소 이름을 한국어/영어/중국어/일본어 로 제공사용자: 외국인 관광객, 지도 앱, 교통 안내 시스템 등 활용 가능형식: 정적 다국어 데이터 (위치 + 명칭 중심)'
