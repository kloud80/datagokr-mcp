description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선, 인천 2호선, 7호선 인천·부천구간의 2024년12월31일 기준 유실물 처리현황입니다.해당데이터는 호선, 구분, 월별 처리건수(1월 ~ 12월) 항목으로 구성되어있습니다.처리 구분으로는 본인인계, 경찰서인계, 폐기가 있습니다.인천도시철도 유실물센터는 인천1호선 인천시청역 1개소로 총 71개역에서 발생하는 유실물을 처리하고 있습니다.인천1호선은 검단호수공원역에서 송도달빛축제공원까지 33개역, 인천2호선은 검단오류역에서 운연역까지 27개역, 2호선 인천·부천 구간은 까치울역에서 석남역까지 11개역입니다.
