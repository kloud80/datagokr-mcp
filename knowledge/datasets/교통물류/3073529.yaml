summary_user: 인천교통공사가 운영하는 인천1호선·인천2호선·7호선 인천·부천구간의 지하철 유실물 처리 건수를 호선과 처리 구분(본인인계·경찰서인계·폐기)별로 1월~12월 월별 집계한 파일이다(2024년 12월 31일 기준, 약 518바이트의 작은 csv). 분석가나 시민이 '인천 지하철에서 잃어버린 물건이 실제로 주인에게 얼마나 돌아가는가, 어느 달·어느 호선에서 폐기 비율이 높은가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 호선 이름을 맞춰 붙이거나 같은 인천교통공사의 다른 파일과 나란히 비교하는 방식으로만 이어 쓴다.
limits: 역별·물품 종류별·건별 내역은 없고 호선·처리 구분별 월 합계만 담겨 있어 개별 유실물 조회나 습득 위치 분석에는 쓰지 못한다. 조인 키가 없어 승하차 인원 등 다른 데이터와 결합하려면 호선 이름을 직접 매핑해야 한다.
