summary_user: 대구광역시 달서구에서 불법주정차 단속이 발생한 지점별로 단속발생 소재지, 누적발생건수, 현장정보, 위도·경도를 담은 파일(CSV, 약 1MB)이며, 주소·좌표 단위의 지점별 누적 집계다. 구청 교통 담당자나 분석가가 '달서구에서 불법주정차 단속이 반복적으로 몰리는 곳은 어디인가'를 확인해 단속·예방 정책 대상지를 고르는 데 쓴다. 전역 조인 키는 없으므로, 위도·경도를 기준으로 다른 공간 데이터(주정차 금지구역, 어린이보호구역, 단속카메라 위치 등)와 지도에서 겹쳐 보거나 소재지 주소를 매칭해 연결한다.
limits: 실측 컬럼에 행정코드 같은 공통 키가 없어 다른 데이터와 바로 조인할 수 없고, 주소 문자열이나 좌표 매칭으로만 연결할 수 있다. 범위는 달서구 한 곳뿐이다. 포털 설명상 1회성 자료라서 이후 추가 갱신은 없다.
