description_portal: 항공자격시험(ARTS) 항공종사자 자격시험 정보 공개(학과원서접수현황) 입니다. 해당파일을 통해 확인하실 수 있습니다. - 항공종사자 자격증명을 받으려는 사람은 국토교통부령으로 정하는 바에 따라 항공업무에 종사하는 데 필요한 지식 및 능력에 관하여 국토교통부장관이 실시하는 학과시험 및 실기시험에 응시하고 합격하여야 합니다. - 자격증명시험 또는 한정심사의 학과시험의 일부 과목 또는 전 과목에 합격한 사람이 같은 종류의 항공기에 대하여 자격증명시험 또는 한정심사에 응시하는 경우에는 제83조제1항에 따른 통보가 있는 날(전 과목을 합격한 경우에는 최종 과목의 합격 통보가 있는 날)부터 2년 이내에 실시(자격증명시험 또는 한정심사 접수 마감일을 기준으로 한다)하는 자격증명시험 또는 한정심사에서 그 합격을 유효한 것으로 합니다.  - 상기 일부 또는 전 과목 합격을 유효한 것으로 보는 경우 과목 합격의 유효기간을 산정할 때 공고에 따라 자격증명시험 또는 한정심사가 실시되지 않는 기간은 제외합니다.
