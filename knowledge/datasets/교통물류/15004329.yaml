summary_user: 인천교통공사가 운영하는 인천1호선(30개역)·인천2호선(27개역)·7호선 인천·부천구간(11개역)의 2024년 7월 1일~2025년 6월 30일 역별·일별 이용인원과 승차·하차인원을 담은 집계 파일이다. 상권 분석가나 지자체 담당자가 "특정 역 주변 유동인구가 요일·계절에 따라 어떻게 달라지는가"를 볼 때 승하차 인원을 유동인구 대체 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 역명·호선 이름을 매핑해 역 위치 정보나 다른 기관의 역별 승하차 자료와 잇는다.
