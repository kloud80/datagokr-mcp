summary_user: 대구광역시 달서구가 운영하는 공영주차장을 주차장 한 곳당 한 행으로 담은 원천 목록 파일(CSV, 약 52KB)로, 주소·위도경도, 주차구획수, 요일별 운영시각, 기본·추가·1일·월정기 요금, 결제방법, 관리기관 연락처를 담는다. 주민이나 방문객이 '달서구에서 토요일에 문을 열고 기본요금이 싼 공영주차장이 어디인가'를 찾거나, 분석가가 구 단위 공영주차 공급(면수·위치)을 지도로 보는 데 쓴다. 실측상 전역 조인 키는 없어서 주차장관리번호·주차장명·주소나 좌표로 전국주차장정보표준데이터 같은 주차장 원장과 맞춰 쓰고, 실시간 주차 가능 대수는 지자체·공단별 별도 API와 따로 이어야 한다.
