description_portal: 경상남도 밀양시 스마트횡단보도 현황 데이터는 스마트 기술을 적용한 교통안전 시설물의 위치 정보(주소, 경도·위도) 및 주요 설치 지점을 제공하는 데이터입니다.스마트횡단보도는 바닥 LED 경고등, 지능형 CCTV, 보행자·차량 감지 센서 등을 활용하여 무단횡단·과속·사고 위험 상황을 실시간 감지하고, 시각·청각적 경고 제공을 통해 교통사고를 예방하는 지능형 교통안전 인프라입니다.국토교통부 스마트시티 솔루션 확산사업을 통해 시청 앞, 교동사거리, 미리벌초등학교 앞 등 주요 보행·교통 지점 7개소에 스마트횡단보도를 구축하였으며, 본 데이터는 교통안전 정책 수립, 보행환경 분석, 안전사고 예방 연구, 스마트도시 서비스 확산 등 다양한 행정·민간 활용 목적에 부합하도록 구성되어 있습니다.
