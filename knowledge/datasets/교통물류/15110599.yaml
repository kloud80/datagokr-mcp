summary_user: 제주특별자치도 내 교통신호기를 설치 지점별로 한 행씩 담은 원천 목록으로, 주소·기하구조(단일로, 3지형, 4지형, 5지형 이상 교차로 구분)·관리부서를 담는다. 교통 분석가나 지자체 담당자가 '제주에서 4지형 교차로 신호기는 어느 주소에 몰려 있고 어느 부서가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소를 지오코딩하거나 이름을 맞춰 연결해야 하며, 같은 기관의 단속카메라·보호구역 데이터와 함께 위치 기준으로 겹쳐 본다.
description_portal: '제주특별자치도 자치경찰단 교통정보센터에서 제공하는 제주도 내 교통신호기 관련 데이터를 제공합니다.항목: 주소, 기하구조, 관리부서*기하구조: 일반적으로 교통신호기(신호등)의 설치 위치, 높이, 방향, 크기, 배치 방식 등과 관련된 공간적이고 물리적인 구조를 의미합니다. 다시 말해, 도로 위에서 신호등이 어떻게 배치되고 구성되어 있는지에 대한 형태적 특성을 말하는 것*구분: 단일로(직선 단순 도로구간), 3지형(도로가 3개 만나는 형태), 4지형(도로가 4개 만나는 형태/일반적으로 십자형), 5지형(도로가 5개 이상 만나는 형태)'
