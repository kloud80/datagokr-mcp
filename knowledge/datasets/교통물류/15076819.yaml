summary_user: 한국도로공사가 관리하는 전국 고속도로의 교통량을 기준 통행속도 구간과 TCS 차종·차종 유형별로 나눠 일자 단위로 집계한 데이터다. 교통 분석가나 정책 담당자가 '특정 기간 고속도로에서 대형차가 어느 속도대로 많이 달렸나' 같은 속도 분포·차종별 통행 특성 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없고 노선·구간 식별자도 보이지 않아 표준노드링크 등 공간 데이터와 직접 붙이지 못하며, 속도 구간 코드(stdSpeedCd)와 차종 코드 같은 같은 기관 코드 체계로만 한국도로공사의 다른 교통량 자료와 맞춰 쓴다.
description_portal: 이 데이터는 한국도로공사가 관리하는 고속도로 구간별 통행속도에 따른 교통량 정보를 제공하는 자료이다.OpenAPI 형태로 XML과 JSON 형식을 지원하며, 기준 통행속도명과 코드, 해당 속도 구간의 교통량, TCS 차종 구분명과 코드, 차종 유형구분명과 코드 등의 항목을 포함한다.이 자료를 통해 이용자는 속도 구간별 교통 흐름을 분석하고, 차종별 통행 특성을 파악할 수 있다.제공되는 정보는 일자 단위로 집계되며, 차량 크기와 유형별 속도대별 분포를 정량적으로 확인할 수 있어 교통 운영 계획 수립, 혼잡 구간 분석, 속도 제한 정책 평가 등에 활용 가능하다.또한 표준화된 코드 체계를 사용하여 시스템 간 데이터 연계와 비교 분석이 용이하며, 교통량 변화를 시계열로 분석함으로써 계절별·시간대별 교통 특성을 연구하는 데 기초자료로 활용될 수 있다.
