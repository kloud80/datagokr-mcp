summary_user: 서울시 도시철도 노선에서 인접한 두 역 사이 구간을 한 행으로 담는 원천 목록으로, 출발역·도착역의 역 ID와 역명, 각 호선, 구간 거리를 담는다(파일 크기 약 3.7KB의 소규모 CSV). 분석가가 "강남역에서 잠실역까지 노선을 따라가면 거리가 얼마인가"처럼 역 사이 거리를 누적하거나 역 연결망을 그래프로 구성할 때 쓴다. 전역 조인 키는 없으며, 역 ID나 역명·호선을 이름 매칭해 서울시 역별 승하차·OD·환승 데이터와 이어 쓴다.
description_portal: 서울시 도시철도 노선 내에서 각 역과 역 사이를 구성하는 구간정보를 정형화한 데이터로, 구간 ID, 노선명, 출발역·도착역, 상·하선 구분, 거리, 소요 시간, 운영사, 구간 순번 등 철도 운행 및 네트워크 분석에 필수적인 속성을 포함합니다. 이 데이터는 지하철 이용객의 이동 흐름을 설명하는 OD 데이터, 열차 운행 속도 데이터, 환승 데이터 등과 결합해 구간별 혼잡도 분석, 병목 지점 탐색, 열차 배차 최적화, 속도·거리 기반 요금 체계 연구, 사고·장애 발생 시 영향 구간 산출 등 실제 운영 및 정책에 활용할 수 있는 기반 정보를 제공합니다. 또한 공학적 분석뿐 아니라 교통 시뮬레이션, 스마트시티 MaaS 서비스 개발, 신호 시스템 고도화, 혼잡 완화형 AI 예측 모델 구축에도 실무적 활용도가 높은 핵심 데이터입니다.
