summary_user: 인천도시철도 1호선 검단연장(계양역~검단신도시 6.825km, 신설 3개 역) 토목 건설공사의 공정률을 공구별로 담은 작은 파일(약 345바이트)이며, 전월과 현재의 계획·실적·대비 공정률을 퍼센트로 담는다. 검단신도시 주민이나 부동산·교통 분석가가 '검단연장 공사가 계획 대비 얼마나 진척됐고 개통이 늦어질 조짐이 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공구명이나 역 이름을 매핑하거나 같은 기관(인천광역시) 자료끼리 이어 써야 한다.
description_portal: 인천광역시 도시철도 1호선 검단연장(토목) 건설공사는 계양역에서 검단신도시까지 총 6.825km를 연장하는 프로젝트로, 아라역, 신검단중앙역, 검단호수공원역 등 3개 정거장이 신설됩니다. 이 사업은 검단신도시 주민들의 교통 편의를 개선하고 인천 도심과의 접근성을 높이기 위해 추진되었습니다. 해당 데이터는 월별 공정률 데이터를 제공하며, 이를 통해 진행 상황을 확인 할 수 있습니다. 주요 데이터항목에는 이전 월 대비 공정률 계획, 공정률 실적, 공정률 비교 등이 포함되어 있으며, 이를 통해 사업 진행 속도를 분석할 수 있습니다.
