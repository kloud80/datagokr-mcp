description_portal: '데이터 개요국토교통부는 항공운송산업의 정책 수립 및 시장 분석을 지원하기 위해 국내외 항공산업 동향을 종합적으로 분석한 정보지인 **「항공시장동향분석」**을 2012년부터 정기 발간하고 있습니다.2023년 1월부터는 보고서 명칭을 **「Global Aviation Industry Trends(글로벌 항공산업동향)」**으로 변경하여 국제적 흐름을 보다 포괄적으로 반영하고 있습니다.주요 제공 항목발행일자: 보고서 발간 기준 일자발행호수: 월간 또는 격주 발간되는 연속 간행물 번호 (제1호~ / vol.1~)파일정보: 각 보고서의 열람 링크 (PDF 또는 웹 e-book 형태)주요 콘텐츠항공운송 실적: 여객·화물 수송량, 노선별 실적 등산업 동향: 항공사·공항·레저 등 세부 산업 트렌드정책 이슈 분석: 국내외 항공정책, 글로벌 이슈 및 전망국내외 통계 비교: 주요국 항공수송 회복도 및 구조 변화 등활용 목적정책 개발 및 항공산업 전략 수립 근거자료학술연구 및 시장조사국제 동향 비교 및 통계 기반 인사이트 도출데이터 이용 시 유의사항2022년 이전 보고서(항공시장동향)는 온라인 링크가 제공되지 않으며, 별도 이메일 요청 필요2023년부터는 모든 발간본이 e-book 형태로 제공됨예시: 2023년 1월 제1호데이터 변경 안내2023년 1월부터 항공시장동향분석 → 글로벌 항공산업동향으로 명칭 변경보고서 구성도 국내 중심에서 글로벌 비교 중심으로 전환됨항공정책, 안전, 기후변화, 공급망 등 글로벌 이슈 분석 비중 강화됨'
