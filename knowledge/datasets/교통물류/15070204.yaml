description_portal: '- 음주운전 사고에 대해서  가해운전자 음주정도별, 주야별 교통사고 통계   * 주간 : 06~18시 / 야간 : 18시 ~06시  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 음주운전 관련 * 도로교통법 제 44조(술에 취한 상태에서의 운전금지)에서 술에 취한 상태에서의 운전을 금지하고 있으며 술에 취한 상태의 기준은 혈중알코올농도 0.03% 이상인 경우를 말함    ※ 2019. 6. 26. 윤창호법 시행 이후부터는 혈중알코올농도 0.03% 이상인 경우 음주운전에 해당 * 음주운전 통계에는 음주측정 불응인 경우도 포함- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨 - 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
