summary_user: 경기도 버스운송관리시스템(BMS)에서 쓰는 공통 달력 기준표로, 날짜 하루 단위로 연도·월·일·연월일(YYYYMMDD)·요일순번·요일·휴일여부를 담는다. 버스 운행·승하차 통계를 분석하는 사람이 '이 날짜가 평일인지 주말·공휴일인지'를 붙여 평일과 휴일의 운행·수요 차이를 비교할 때 쓴다. 전역 조인 키는 없으며, 다른 BMS 데이터의 날짜 값을 연월일(ymd)에 맞춰 이어 붙이는 방식으로 연결한다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 공통일자 정보로, 각 연도별 월·일 단위의 세부 정보를 포함합니다. 주요 항목은 '연도', '월', '일', '연월일(YYYYMMDD 형식)', '요일순번(1~7)', '요일', '휴일여부(숫자코드)', '휴일여부명' 등으로 구성되며, 버스 운행 패턴 분석, 요일별 교통량 예측, 휴일 운행 정책 수립 등의 기초자료로 활용될 수 있습니다. 또한 대중교통 운영계획 수립 시 평일·주말·공휴일 운행 스케줄 차이를 분석하는 데 중요한 기준이 됩니다. 데이터는 시간기반 통계 분석과 결합하여 출퇴근 시간대 분석, 계절별 수요 예측 등 다양한 목적에 맞게 활용이 가능합니다.
