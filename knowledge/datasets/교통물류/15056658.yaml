summary_user: 국내 항만에서 반출입되는 외항화물을 B/L(선하증권) 건 단위로 담은 원천 데이터로, 항구청·호출부호·입항연도로 조회하며 화물품목·국외 출발/도착지(OD)·적하·양하항·운임톤·중량톤·하역방법·선사 등을 포함한다(2017년 조건 검증 호출 기준 전국 369건, 2017-01-18~01-24). 항만 분석가나 물류 사업자가 '특정 항만에 어떤 품목이 어느 나라에서 얼마나(운임톤) 들어오고 나가는가'를 파악하는 데 쓴다. 호출부호(clsgn)로 선박 등록·입출항 데이터와, 화물품목코드(HS부호)로 관세청 품목 분류·수출입 통계와, 적하·양하항 코드(UN/LOCODE)로 항만 코드 기반 데이터와 이어 쓴다.
description_portal: 이 데이터는 해양수산부에서 국내 항만을 통해 반출입되는 외항화물 정보를 제공하기 위해 수집한 데이터입니다.  항만청 코드, 선박 호출부호, 선박 입항연도 등 입력 파라미터를 이용해 데이터를 호출하실 수 있으며, 본 데이터의 주요 내용은 항만명, 입항년도, 화물품목, 해외지역, 반출입구분, 수출입국가(OD), 운임톤 등으로 구성되어 있습니다.  본 데이터는 수출입 화물의 흐름 및 물동량 분석, 특정 항만별 주요 화물 품목 및 반출입 특성 파악, 운임톤 기준 물류수단 계획 수립, 항만 인프라 개선 및 정책 검토, 국가 간 교역 구조 분석 등에 활용될 수 있습니다.
team:
  dept: 항만물류산업과
