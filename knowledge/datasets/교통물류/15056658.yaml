        example: '2017'
        desc: 검색을 원하는 선박의 입항연도
      - name: etryptCo
        required: true
        example: '001'
        desc: 검색을 원하는 선박의 입항횟수
      - name: clsgn
        required: true
        example: VRPP7
        desc: 검색을 원하는 조회 호출부호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
