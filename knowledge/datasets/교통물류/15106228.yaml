description_portal: '- 전라남도 도로관리사업소에서 추진하는 업무 중 연도별 도로 품질시험 의뢰건수 및 세외수입현황 정보를 조회할 수 있습니다.- 전라남도의 도로 관리 및 유지보수 업무를 담당하는 주요 기관은 전라남도 도로관리사업소입니다. 이 기관은 도로의 안전한 통행을 위해 도로의 유지보수, 보수공사, 교량 및 터널 관리 등 다양한 업무를 수행합니다.- 소속 기관: 전라남도청- 주요 업무: 국도 및 지방도 등 도로의 유지보수 및 보수공사, 교량 및 터널의 안전 점검 및 관리, 도로 시설물의 정기 점검 및 보수, 도로 공사 및 개량사업의 시행- 전라남도의 도로와 관련된 문의나 민원이 있으시면 도로관리사업소로 연락하시거나, 해당 기관의 홈페이지를 통해 자세한 정보를 확인하실 수 있습니다.'
