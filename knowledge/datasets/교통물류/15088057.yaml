summary_user: 시도·시군구별로 일반택시, 모범(고급)택시, 구급차의 택시미터 기본거리와 이후거리 기준값을 담은 자동차검사관리시스템 자료의 샘플 파일로, 전국 범위의 비공간 데이터다. 택시미터 검사·요금 제도를 살피는 분석가나 사업자가 '우리 지역 일반택시의 기본거리와 이후 요금 적용 거리는 얼마인가'를 확인하거나 지역 간 기준을 비교할 때 쓴다. 전역 조인 키는 없고 시도코드·시군구코드를 행정구역 코드표나 같은 기관의 다른 자동차검사 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 체계적으로 관리하는 자동차검사 자료 중 일부로, 시도별, 여객자동차운수사업별(일반택시, 고급택시, 구급차 포함), 기본거리별 및 이후거리별로 세분화된 데이터 샘플입니다. 이 자료는 다양한 지역과 운송사업 유형에 따른 자동차 운행 및 검사 현황을 상세하게 파악할 수 있도록 구성되어 있으며, 교통 정책 수립, 운송 효율성 증대, 안전관리 강화 등 다양한 분야에서 중요한 기초 자료로 활용되고 있습니다.
