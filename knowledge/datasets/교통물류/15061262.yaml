summary_user: 대구광역시 시내버스 정류소의 이름과 GPS 좌표(X·Y)를 정류소 한 곳당 한 행으로 담은 CSV 목록 파일이며, 포털 설명상 2011년 12월 31일 기준으로 작성됐다. 분석가나 개발자가 '대구 시내버스 정류소는 지도상 어디에 분포하는가'를 확인하거나, 정류소 위치를 지도에 찍을 때 쓴다. 실측 컬럼에 정류소 ID 같은 전역 조인 키가 없어서, 다른 노선·도착 데이터와는 정류소명 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 정류소 코드나 ID가 없어 다른 데이터와 정확한 키 조인이 안 되고, 이름 매칭은 동명 정류소 때문에 오류가 날 수 있다. 포털 설명상 2011년 말 기준 목록이므로 이후 신설·폐지된 정류소는 반영되지 않았을 수 있다.
