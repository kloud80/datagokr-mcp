description_portal: 항공사업법 제70조제4항에 따라, 초경량비행장치를 초경량비행장치사용사업, 항공기대여업 및 항공레저스포츠사업에 사용하려는 자와 무인비행장치 등 국토교통부령으로 정하는 초경량비행장치를 소유한 국가, 지방자치단체, 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관은 국토교통부령으로 정하는 보험 또는 공제에 가입하여야 한다. 보험 또는 공제 또한 같은법 시행규칙 제70조에 대인 및 대물피해에 대해 금액기준을 준수하는 보험상품을 가입하여야 한다. 드론 보험 전용상품 출시 이후 현재 기준 드론보험을 판매하는 보험(또는 공제)사의 현황이다. 공제회사 중 자체적인 기금으로 운영하는 보유공제회사만 표기되어 있고, 판매공제회사는 포함되어있지않다.
