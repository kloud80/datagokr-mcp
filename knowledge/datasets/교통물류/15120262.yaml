summary_user: 사업용 운수종사자 중 만 65세 이상 고령운전자가 받는 운전적성정밀검사(자격유지검사) 결과를 수검 건별로 담은 전국 단위 파일(CSV)로, 수검일·지사명·나이와 시야각·신호등·화살표·도로찾기·표지판·추적·복합 검사 항목별 결과, 종합판정을 담는다. 교통안전 분석가나 정책 담당자가 '고령 버스·택시·화물 운전자의 나이가 많을수록 어떤 검사 항목에서 부적합이 늘어나는가', '지사별 부적합 비율은 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지사명이나 수검일(연·월) 같은 이름·날짜 기준으로만 느슨하게 맞춰 쓴다.
limits: 운전자 식별자나 업종(버스·택시·화물) 구분 필드가 없어 개인별 추적이나 사고 이력과의 직접 연결은 하지 못하고, 다른 데이터와는 이름·코드 매핑으로만 이을 수 있다. 공간 단위가 전국·비공간이라 지사 이상의 세부 지역 분석은 어렵다.
