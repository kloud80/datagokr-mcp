summary_user: 한국도로공사 차량검지기(VDS)가 고속도로 지점별로 측정한 교통량·평균속도·점유율을 1시간 단위로 집계한 전국 범위 통계 파일이며, 포털에서는 507바이트 크기의 샘플 CSV만 제공된다. 교통 분석가나 정책 담당자가 '특정 고속도로 지점에서 어느 시간대에 속도가 떨어지고 혼잡해지는가'를 확인하거나 수요 예측의 입력으로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 검지기 고유 아이디(VDS)를 같은 기관의 검지기 위치·노선 정보와 코드로 맞추는 방식으로만 다른 데이터와 연결한다.
limits: 포털 파일은 샘플(507바이트)이라 전체 기간 분석에는 교통 빅데이터 플랫폼에서 로그인 후 전체 데이터를 따로 받아야 한다. 검지기 아이디만 있고 위치 좌표·행정구역이 없는 비공간 데이터라, 지도 표시나 지역 단위 집계에는 별도 위치 매핑이 필요하다.
