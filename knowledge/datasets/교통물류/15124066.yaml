summary_user: 경기도 버스운송관리시스템(BMS)이 관리하는 버스 노선의 노드(교차로·경유지 등 지점)별로 노드 ID, 위경도와 X·Y좌표, 권역코드, 교차로명을 담은 지점 단위 원천 목록이며 범위는 경기도 전역의 개별 좌표다. 교통 분석가나 개발자가 '경기도 버스 노선이 지나는 교차로 지점을 지도에 어떻게 표시하고 노선 경로망을 구성할까'를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관(경기도)의 버스 노선·링크 자료와는 노드 ID(node_id)로, 다른 자료와는 교차로명 매핑이나 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 관리하는 버스 노선의 노드(Node) 정보를 제공하는 자료로, 교차로나 노선 경유지 등의 지점에 대한 위치정보를 포함합니다. 주요 항목은 ‘노드아이디’, ‘위도’, ‘경도’, ‘Y좌표’, ‘X좌표’, ‘권역코드’, ‘교차로명’으로 구성되어 있으며, 이를 통해 각 노드의 공간적 좌표를 정확히 확인할 수 있습니다. 해당 데이터는 노선 경로의 설계, 교통 시뮬레이션, GIS 기반의 교통망 시각화, 혼잡도 분석 등 교통 관련 연구 및 시스템 개발에 유용하게 활용될 수 있습니다. 특히 노드 간 연결성을 분석하면 경로 최적화 및 대중교통 계획 수립 시 효과적인 정보로 작용합니다.
