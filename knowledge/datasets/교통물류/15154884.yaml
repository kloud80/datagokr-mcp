summary_user: 서울 성북구에서 2024년 1월부터 12월까지 이뤄진 불법 주정차 단속을 건별로 담은 파일로, 단속일시·단속장소·부과여부가 들어 있고 현장단속·CCTV·안전신문고·서울스마트 불편신고 단속을 모두 포함한다. 운전자나 주민이 '성북구에서 주정차 단속이 자주 되는 곳은 어디이고 어느 시간대에 몰리는가'를 확인하거나, 분석가가 장소별 단속 빈도를 집계하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 단속장소 주소 문자열을 지오코딩하거나 이름으로 맞춰 주차장·보호구역 위치 자료 등과 이어 쓴다.
limits: 표준 행정코드나 공통 키가 없어 다른 자치구·전국 단속 자료와 바로 결합할 수 없고, 범위는 성북구 한 곳에 한정된다. 단속장소는 개별 주소 수준이라 위치 분석에는 주소 정제·좌표 변환이 먼저 필요하다.
