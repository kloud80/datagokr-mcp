summary_user: 군산시 관내 보도육교를 한 곳당 한 행으로 담은 건별 현황 파일(csv, 약 1.5KB)로, 육교명·도로노선·도로명주소·위경도와 연장·높이·폭, 장애인 편의시설, 준공일자, 내진설계 여부, 안전등급, 최종 안전점검 일자를 담는다. 시민이나 분석가가 "우리 동네 육교의 안전등급은 무엇이고 마지막 점검은 언제였나", "엘리베이터 같은 장애인 편의시설이 있는 육교는 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위경도 좌표나 도로명주소·도로노선명으로 맞춰 붙이고, 다른 지자체의 같은 형식 육교 현황과는 같은 항목끼리 이어 쓴다.
limits: 군산시 한 곳의 시군구 범위만 담아 다른 지역 육교는 없다. 공통 코드 같은 조인 키가 없어 다른 데이터와 연결하려면 이름·주소·좌표로 직접 매칭해야 한다.
