summary_user: 광양항 배후단지에 드나든 컨테이너 차량의 운행을 차량 한 건씩 기록한 원천 데이터로, 진입·진출 게이트와 각 일시, 작업시간을 담고 차량번호는 마스킹돼 있다. 물류 분석가나 배후단지 입주 사업자가 어느 게이트에 어느 시간대에 차량이 몰리는지, 단지 안 체류·작업시간이 얼마인지 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 게이트 이름이나 같은 기관(여수광양항만공사)의 자료 기준으로만 이어 쓰며, 항만코드는 입출항·물류 데이터와 연결하는 키지만 이 파일에는 들어 있지 않다.
limits: 차량번호가 마스킹돼 있어 개별 차량을 추적하거나 다른 차량 데이터와 맞춰 볼 수 없고, 공통 조인 키도 없다. 범위가 전국·비공간으로 분류돼 있지만 실제 내용은 광양항 배후단지 게이트 기록이며 좌표 정보는 없다.
