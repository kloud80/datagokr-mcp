summary_user: 서울 시내 버스의 실시간 위치를 노선 ID와 정류소 구간을 요청값으로 받아 조회하는 API이며, 검증 호출에서는 1행이 수신되었고 범위는 시도 단위, 위치는 주소·좌표로 개별 표현된다. 서울 버스 이용자나 지도·모니터링 서비스 개발자가 "이 노선의 버스가 지금 어느 정류소 구간에 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 정류장·노선 원장이나 도착정보와는 이름·코드 매핑 또는 같은 기관 코드로 이어 써야 한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 기관·데이터와 자동 결합은 어렵다. 포털 활용신청은 자동승인이며 개발계정은 일 1,000회로 제한되고, 검증 호출은 1개 오퍼레이션만 성공했으며 수신은 1행이었다.
