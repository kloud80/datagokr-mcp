summary_user: 대구광역시 도로망에서 교차로·분기점·램프 접속부 같은 도로 연결지점을 노드 한 건씩 담은 파일로, 표준노드ID·노드명·노드유형·회전제한여부·경위도 좌표·적용시작일자를 제공한다(CSV 약 687KB). 교통 분석가나 시뮬레이션 모델 구축자가 '대구 시내 특정 교차로의 위치와 회전제한 여부는 어떤가'를 확인하거나 도로망 노드 기초자료를 마련하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 표준노드ID는 국토부 표준노드링크 체계의 노드 기준이므로 대구광역시 도로 표준링크 자료와 노드ID로 이어 구간 연결 관계를 파악하고, 경위도로 다른 공간 데이터와 겹쳐 쓴다.
limits: 대구광역시 범위만 담아 다른 시도나 전국 노드망을 대신하지 못한다. 실측상 전역 조인 키가 잡히지 않아 다른 데이터와는 이름·좌표 매핑이나 같은 기관 자료로만 연결된다고 보고, 전국 표준노드링크 마스터는 국토부 ITS 센터 배포본을 따로 확인해야 한다.
