summary_user: 한국도로공사가 보유한 지적재산권을 건별로 담으며, 각 건마다 권리 종류(RGHT_TP), 발명·기술 명칭, 출원일, 등록번호, 등록일이 들어 있다. 도로·교통 기술 분석가나 기술이전을 검토하는 사업자가 한국도로공사가 어떤 도로 관련 특허·기술을 언제 출원하고 등록했는지 확인할 때 쓴다. 다른 데이터와 공통으로 묶을 조인 키는 없으므로, 등록번호나 기술 명칭을 특허 정보 등 외부 자료와 직접 대조하는 방식으로만 이어 쓸 수 있다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국도로공사에서 제공하는 지적재산권현황에 대한 관련 정보입니다.\""
