description_portal: 친환경·일반 비율 일별 집계 데이터는 해당 연도 동안 각 학교급식 지원센터를 통해 공급된 친환경 농산물과 일반 농산물의 입고·납품 현황을 일 단위로 집계한 자료입니다. 주요 제공 항목에는 입고일자(년월일), 친환경 물량(kg), 친환경 납품총액, 일반 물량(kg), 일반 납품총액, 그리고 등록 일시가 포함됩니다.이 데이터는 학교급식 내 친환경 식재료 사용 비중, 센터별 공급 구조 변화, 계절별 수급 패턴, 예산 집행 규모 분석 등에 활용될 수 있습니다. 친환경·일반 물량 및 금액을 비교함으로써 급식 품질 관리, 지역친환경 농산물 확대정책 검토, 공급 안정성 평가 등의 정책적·운영적 분석이 가능합니다. - 금액 및 물량 값은 문자열 형태로 제공되며, 분석 시 숫자형으로 변환하여 사용하는 것을 권장합니다. - 일부 날짜는 집계값이 누락되어 있을 수 있으며, 이는 공급 중단 또는 데이터 수집 제외 등 운영 환경에 따라 발생할 수 있습니다.
