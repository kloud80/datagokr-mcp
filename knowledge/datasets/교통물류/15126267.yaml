summary_user: 대구광역시 ITS가 수집한 사고·공사·행사·기상 등 도로 돌발상황을 건별로 담으며, 건마다 발생 위치와 경위도 좌표, 돌발유형·등급, 해당 구간 소통상태, 제보·시작·종료 시각이 들어 있다. 운전자나 교통 분석가가 '지금 대구 어느 도로에서 사고나 공사가 진행 중이고 얼마나 막히는가'를 확인하는 데 쓰며, 이력을 쌓으면 돌발이 잦은 구간·시간대를 분석하는 원장이 된다. 실측상 전역 조인 키는 확인되지 않았으므로, 명세상 표준노드링크 ID(LINKID)나 좌표로 같은 기관의 링크 속도·소통 정보 또는 지도 데이터와 맞춰 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·좌표 매핑이나 같은 기관 코드로만 연결된다. 실시간 조회 API이므로 과거 추세 분석에는 직접 이력을 적재해야 하며, 개발계정은 하루 5,000회로 호출이 제한된다.
