description_portal: '[ESG-Governance] 본 데이터는 대구교통공사의 ESG 지배구조(Governance) 분야 투명행정 및 신뢰경영 운영정보 데이터로, 도시철도 역사 및 시설 내 운영 중인 광고매체 현황 정보를 제공합니다. 데이터에는 호선, 광고 종류, 매체 유형, 설치 위치, 광고대행사명 등의 주요 항목이 포함되어 있으며, 도시철도 공간 내 광고 운영 현황과 매체 활용 정보를 확인할 수 있는 자료입니다. 해당 데이터는 호선별·역사별 광고매체 운영 현황 분석, 매체 유형별 활용 현황 파악, 광고 운영 관리 및 관련 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 광고 운영 현황의 체계적인 관리를 통해 도시철도 공간 활용의 효율성을 높이고, 민간 협력사업 및 광고 운영 개선을 위한 참고자료로 활용할 수 있습니다. 본 데이터는 연 1회 갱신되며, 광고매체 운영 현황 변동 사항을 반영합니다.'
