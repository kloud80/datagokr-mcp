description_portal: 은평구의 연료별자동차등록현황입니다. 속성은 연도, 연료, 용도, 승용, 승합, 화물, 특수로 구성되어있습니다.연료별 자동차 등록현황 데이터는 은평구 내 자동차가 어떤 연료(휘발유, 경유, 전기, 하이브리드 등)로 운행되는지 연도별로 구분하여 등록된 데이터를 제공합니다. 속성은 연도, 연료 구분, 용도(자가용, 영업용), 차량 종류(승용,승합,화물,특수)로 구성되며, 행정 동 단위 상세 현황도 일부 제공됩니다. 이 자료는 자동차의 친환경 전환 속도나 연료 다변화, 친환경 교통 정책 성과(전기차,수소차,하이브리드차 증가 추이), 미세먼지 정책, 탄소중립 등 사회적 요구와도 밀접하게 연관돼 있습니다. 최근에는 전기차와 수소차 보급이 늘면서 연료 다변화가 가속화되고, 차량 등록 데이터는 지역별 그린 모빌리티 전략, 기반 시설 구축, 대중교통 개선 정책 등 행정 수립에 중요한 기초자료로 사용됩니다. 주민,연구자,기업 모두 자유롭게 다운로드 및 분석이 가능합니다
