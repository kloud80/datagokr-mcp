summary_user: 인천항만공사가 운영하는 국제여객터미널의 여객선 입항·출항 현황을 운항 건별로 담는 실시간 조회 API로, 선박명·선사명·항로명·터미널명·입출항 시간·운항 상태(nvgStatusName)를 준다. 인천항을 오가는 국제 여객선을 타려는 여행객이나 안내 시스템 운영자가 '오늘 이 항로 배가 예정대로 출항하는가, 몇 시에 들어오는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 운항·스케줄 데이터와는 선박명·항로명·선사명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 해당 데이터는 인천항만공사에서 제공하는 국제여객터미널의 실시간 운항정보에 대한 OpenAPI 데이터의 설명 자료로, 여객선의 출항 및 입항 현황을 실시간으로 조회할 수 있도록 설계된 서비스입니다. 항로, 선박명, 출항시간, 터미널명 등의 파라미터를 통해 운항현황 데이터를 호출할 수 있으며, 교통물류 및 해양교통 관리를 위한 핵심 자료로 활용됩니다. 본 API는 XML 형식의 데이터 구조를 채택하고 있으며, 공공기관, 해양 관련 기업, 물류 서비스 제공자들이 여객선 스케쥴 관리, 운항계획 수립, 승객 정보 안내 시스템 등에 연계하여 실시간 정보를 수집하는데 유용한 기반을 제공합니다.
