summary_user: 경기도 수원시에 소재한 국제물류주선업체를 업체 한 곳당 한 행으로 담은 목록 파일(csv, 약 4KB)로, 업체명·영업상태·도로명/지번 주소·위도·경도·관리기관을 담는다. 수출입화물 운송을 맡길 수원 지역 주선업체를 찾거나, 특정 업체가 현재 영업 중인지 확인하는 데 쓴다. 전역 조인 키가 없어 업체명·주소로 다른 업종 목록이나 화물운송사업자 표준데이터와 맞춰 보거나, 위도·경도로 지도·물류시설 위치 데이터와 겹쳐 쓴다.
description_portal: '경기도 수원시 소재 국제물류주선업체에 대한 정보로 업체명, 영업상태, 소재지도로명주소, 소재지지번주소, 위도, 경도 값, 관리기관을 제공합니다.국제물류주선업은 타인의 수요에 따라 자기의 명의와 계산으로 타인의 물류시설, 장비 등을 이용하여 수출입화물의 물류를 주선하는 사업입니다. 등록 요건자본금 : 법인의 경우 3억원 이상, 개인은 자산평가액 6억원 이상 보증보험 : 1억원 이상의 보증보험 가입 필요 (일정 조건에 따라 면제 가능) 결격 사유 : 물류 관련 법규 위반으로 금고 이상의 형을 받은 경우, 등록 취소 처분을 받은 경우 등 등록 절차국제물류주선업 등록 신청 : 관할 시·도지사에게 신청 구비 서류 제출 : 등록신청서, 등록기준에 적합함을 증명하는 서류, 선하증권 및 항공화물운송장의 양식·약관에 관한 서류 등 처리 기간 : 약 10일 소요'
