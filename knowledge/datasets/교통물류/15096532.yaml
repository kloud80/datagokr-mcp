summary_user: 대구광역시 북구 안 민영주차장을 주차장 한 곳당 한 행으로 담은 원천 목록으로, 주차장명·지번주소·주차구획수·평일/토요일/공휴일 운영시각·기본요금과 추가요금·월정기요금·결제방법·경도/위도를 담는다(약 8KB CSV 파일). 북구 주민이나 방문객이 '이 근처 민영주차장 중 주말에 열고 월정기 요금이 얼마인 곳은 어디인가'를 확인하거나, 분석가가 북구 민영주차 공급과 요금 수준을 지도로 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 전국주차장정보표준데이터 같은 원장과는 주차장명·주소 매칭이나 좌표 근접으로 이어 붙이고, 실시간 주차 가능 대수는 지자체·공단별 별도 API로 따로 다뤄야 한다.
limits: 포털 설명상 2021년 기업매칭 사업으로 한 번 구축된 데이터로 더 이상 갱신되지 않아, 현재 운영 여부·요금은 다를 수 있다. 범위는 대구 북구 민영주차장에 한정되며 실시간 주차 가능 대수는 담지 않는다. 전역 조인 키가 없어 다른 데이터와 연결할 때는 이름·주소 매칭에 의존해야 한다.
