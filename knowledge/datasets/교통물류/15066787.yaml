summary_user: 전국 시도별(서울·부산·대구·인천 등) 시내버스 운송업체의 경영현황을 자산총계·부채총계·자본총계·운송수입(매출액)·운송원가(매출원가)로 담은 집계 파일로, 단위는 백만원이며 711바이트 크기의 작은 CSV입니다. 정책 분석가나 지자체 담당자가 '어느 지역 시내버스 업체의 운송원가가 운송수입을 웃도는가', '지역별 부채 규모는 어떤가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 버스·대중교통 데이터와는 지역명(구분)을 이름으로 맞춰 이어 쓴다.
description_portal: 한국교통안전공단에서 지자체를 대상으로 수집한 전국 대중교통 시내버스 경영현황 자료입니다.(경영부문 작성업체에 한함)전국(서울, 부산, 대구, 인천, 등)으로 구분하여 데이터를 제공하고 있습니다.데이터는 자산총계, 부채총계, 자본총계, 운송수입(매출액), 운송원가(매출원가)로 구분하여 데이터를 제공하고 있습니다.이때 자산총계 = 부채총계 + 자본총계 입니다.단위는 백만원입니다.해당 데이터를 통해 대중교통 운영자 현황을 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.
