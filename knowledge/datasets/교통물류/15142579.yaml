description_portal: 부산광역시 연도별(21~23), 민원종류별(4종) 개인형이동장치 관련 민원 건수를 제공합니다.  2025년 3월 현재 개인형이동장치 관련 업종은 자유업으로서 지방자치단체에서 관련 행정업무가 존재하지 않으며, 민원신청 건수만 통계자료로 보유하고 있습니다. 개인형이동장치는 전기를 이용해 움직이는 저속의 소형 1인용 운송수단을 말합니다. '퍼스널 모빌리티'라고도 합니다. 개인소유의 장치는 개인이 관를 하지만, 회사에서 운영하는 장치들은 인도 곳곳에 세워두어 행인들의 보행을 방해하기도합니다. 이를 해결하기 위해서 규제가 필요하기도 합니다.(공공데이터 제공 신청 관련 1회성 데이터로 향후 업데이트 예정 없음)
