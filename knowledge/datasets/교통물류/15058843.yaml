summary_user: 경기도 시군에서 인허가를 받은 전세버스 업체를 사업장 한 곳당 한 행으로 담은 목록으로, 사업장명·인허가일·영업상태·폐업일·자본금·면허 유효기간·지정정비업종과 주소·WGS84 좌표가 들어 있다. 분석가나 지자체 담당자가 "경기도 어느 시군에 전세버스 업체가 몰려 있고 그중 영업 중인 곳은 몇 곳인가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 시군 코드·시군명(SIGUN_CD)이나 사업장명·주소를 맞춰 붙여야 한다.
description_portal: 경기도 내 전세버스업체 현황은 여객을 유상으로 운송하는 업체 중 전세 계약을 기반으로 운행하는 사업체 정보를 제공합니다. 전세버스는 노선버스와 달리 특정한 정해진 노선 없이 계약에 따라 운행되며, 관광이나 단체 이동, 학교 및 기업 행사, 장거리 여행 등 다양한 목적에 맞게 활용됩니다. 이 데이터는 경기도 31개 시군에서 인허가를 받아 운영되는 전세버스 업체의 현황을 집계한 것으로, 사업장명, 인허가일자, 등록일자, 영업상태 및 폐업 여부 같은 행정 정보를 포함하고 있어 행정 관리 및 정책 수립에 유용합니다.또한 업체유형 코드와 명칭, 소유형태, 자본금 정보 등 기업 운영 현황을 파악할 수 있는 항목들이 제공되며, 면허 유효기간, 면허 발급일, 지정정비업종 코드 및 명칭도 포함되어 있어 안전 관리 체계와 차량 유지 관리 실태를 확인할 수 있습니다. 위치 데이터로는 도로명주소, 지번주소, 우편번호, WGS84 좌표가 함께 제공되어 공간 분석이나 GIS 시스템을 활용한 지도 시각화에 활용이 가능하며, 이를 통해 시군별 전세버스 업체 분포 및 접근성을 한눈에 확인할 수 있습니다.이 데이터는 행정안전부가 제공하며, 지방행정데이터개방시스템을 통해 수집되었습니다. 다만, 시스템 전면 개편으로 인해 2018년 9월 이후로는 데이터 갱신이 중단된 상태이므로 최신 현황은 별도의 행정자료를 통해 확인이 필요합니다.활용 방안으로는 경기도 전세버스 업체의 분포와 규모 분석, 지역 관광 수요 대응 방안 마련, 대규모 행사 시 교통 자원 배분 연구, 전세버스 안전관리 및 차량 정비 정책 수립, 교통·관광 연계 전략 개발 등이 있으며, 특히 좌표 정보를 기반으로 지역별 교통 접근성을 평가하거나 관광 인프라 확충 계획에 반영하는 등 실질적인 정책 지원 자료로서 활용할 수 있는 가치가 높습니다.
