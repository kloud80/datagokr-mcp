summary_user: "경기도 버스운송관리시스템(BMS)에 등록된 버스 노선별로 시스템 식별자인 노선ID(route_id)와 승객이 아는 노선번호(예: '96-1', 'P9243(출근)')를 짝지어 담은 노선 원장이다. 분석가나 개발자가 \"BMS·실시간 운행 데이터에 찍힌 노선ID가 실제로 몇 번 버스인가\"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 경기도 BMS 계열 데이터(업체·정류소 등)와는 노선ID로, 다른 기관 데이터와는 노선번호 이름 매칭으로 잇는다."
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 노선 인가 정보로, 경기도 내 등록된 각 버스 노선에 대해 시스템 상의 식별자인 ‘노선ID’와 실질적인 운행번호인 ‘노선명(노선번호)’ 정보를 포함합니다. ‘노선ID’는 경기도 BMS 시스템 내에서 각 노선을 고유하게 구분하는 코드이며, ‘노선명’은 대중이 인지하고 이용하는 노선번호를 의미합니다. 예를 들어 '96-1', 'P9243(출근)' 등으로 표시됩니다. 본 데이터는 버스노선 식별, 교통정보 시스템 연계, 실시간 운행 추적, 노선별 정책 분석 및 행정처리 등에 기초 자료로 활용될 수 있으며, 다른 BMS 데이터(업체ID, 정류소정보 등)와 함께 교통운영 최적화에 활용됩니다.
