summary_user: 인천광역시에 등록된 물류창고업체를 사업장 한 곳당 한 행으로 담은 건별 인허가 원장으로, 주소·좌표, 영업상태, 인허가일자, 일반·냉동냉장 창고 동수와 면적, 직원수, 업태를 포함한다. 물류 사업자나 분석가가 인천 안에서 냉동·냉장 창고가 어느 지역에 얼마나 몰려 있는지, 영업 중인 창고의 입지와 규모가 어떤지 파악하는 데 쓴다. 전역 조인 키는 없으므로 같은 인허가 체계의 자치단체코드·관리번호나 사업장명으로 다른 지방행정인허가 데이터와 맞추고, 주소·좌표로 지도·행정구역 데이터와 공간 결합한다.
description_portal: 인천광역시 물류창고업체 현황 공공데이터는 인천시 내에 등록된 물류창고 업체들의 정보를 제공합니다. 이 데이터는 지방행정인허가데이터에서 제공받은 정보입니다.구성항목으로는 개방서비스명, 영업상태명, 인허가일자, 주소, 우편번호, 좌표정보, 일반창고, 냉동,냉장 창고, 보관장소, 직선수, 시설, 장비현황, 법인여부명 등으로 구성되어 있습니다.이 데이터는 인천 지역의 물류창고 시장을 분석하거나, 물류 관련 분석하는데에 활용될 수 있습니다.공공데이터포털, 지방인허가데이터에서 확인 할 수 있습니다. 감사합니다.
