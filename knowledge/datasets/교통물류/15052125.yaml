summary_user: 자동차 정비·검사용 기계기구와 환경측정기기의 정도검사를 받는 업체를 한 곳씩 담은 건별 목록으로, 관할 지역본부·수검업체명·주소·업체구분이 들어 있고 범위는 전국입니다. 정비·검사 업계 분석가나 지자체 담당자가 '우리 지역에 정도검사 대상 정비·검사업체가 몇 곳이고 어디에 있나'를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열을 맞추거나 주소를 지오코딩해 행정구역 단위로 묶어 이어 쓴다.
limits: 업체 코드나 사업자번호 같은 공통 키가 없어 정비업체 등록 현황 등 다른 데이터와의 연결은 이름·주소 매칭에 의존한다. 검사 일자·결과·대상 기기 내역은 필드에 없어 수검 이력이나 합격 여부는 알 수 없다.
