description_portal: 이 데이터는 해양수산부에서 해운항만물류정보시스템(PORT-MIS)을 통하여 선박의 등록과 말소 현황을 관리, 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 선박의 등록일, 말소일, 선박명, 선적항, 선박소유자, 선박 고유번호 등의 정보로 구성되어 있습니다.본 데이터는 선박의 법적 소유권 관리, 선적항 현황 분석, 국내 국적선의 변화 추이 파악에 활용될 수 있으며, 선사의 소유관계 분석, 선박 등록 및 말소 절차 관련 연구, 항만 및 해상 교통 정책 수립 시에도 참고자료로 사용될 수 있습니다.
