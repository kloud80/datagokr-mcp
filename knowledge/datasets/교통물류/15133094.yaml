status: active
summary_user: PORT-MIS로 관리되는 전국 등록 선박의 원부 정보를 선박 한 척당 한 행으로 담은 CSV 파일(약 35만 바이트)로, 선박명·선박종류·선적항·관할항·총톤수·길이·너비·깊이 같은 제원, 조선사·진수일자, 추진기·기관 정보, 최초등록일자와 최종수정일자를 담는다. 해운 분석가나 정책 담당자가 '특정 선적항에 등록된 선박은 어떤 선종과 톤수 분포를 보이는가', '특정 선박의 제원과 건조 이력은 어떤가'를 확인하는 데 쓴다. 국제해사기구식별번호(IMO)·호출부호·선박번호 필드가 있어 입출항·항만 물류 데이터와 선박 단위로 맞춰 볼 여지는 있지만, 실측에서는 전역 조인 키로 확인되지 않았으므로 선박명이나 항구명 매핑, 같은 기관 코드로 연결해야 한다.
limits: 실측 컬럼에서 다른 데이터와 바로 붙는 전역 조인 키를 찾지 못했으므로, 선박 단위로 연계할 때는 이름·코드 매핑을 직접 검증해야 한다. 범위는 전국이며 좌표가 없는 비공간 데이터이다. 해양 안전, 항만국통제(PSC), 선원, 해양 환경 정보는 이 데이터의 범위가 아니다.
