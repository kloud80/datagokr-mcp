description_portal: 본 데이터는 부산광역시 사상구 관내에서 운영되고 있는 개인형 이동장치(PM)에 대한 데이터로 연도별 공유 PM 업체 수와 운영대수 항목을 제공합니다.도시 교통정책 수립 및 교통 인프라 개선을 위한 기초자료로 활용할 수 있습니다.해당 자료는 지역 내 단거리 이동수단의 보급 현황을 파악하고, 이동수단의 균형 배치 및 안전 확보를 위한 정책 자료로 활용될 수 있으며, 민간 부문에서는 모빌리티 플랫폼 구축, 상권 분석, 위치 기반 서비스 기획, 사용자 수요 분석 등의 목적으로도 활용이 가능합니다. 또한 대중교통의 사각지대 해소, 교통약자 이동권 보장, 친환경 교통체계 확대 등 지역 사회의 지속가능한 교통체계 마련에도 기여할 수 있는 자료로, 누구나 자유롭게 열람 및 활용할 수 있도록 공공데이터포털을 통해 개방 중입니다.
