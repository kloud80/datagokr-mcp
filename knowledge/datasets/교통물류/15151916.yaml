summary_user: 한국국토정보공사가 관리하는 도로대장 정보 중 노선번호·구간번호·레이어코드를 노선 구간 단위로 담은 전국 범위의 비공간 데이터입니다. 도로 분석가나 재난안전 담당자가 특정 노선번호(ROADNO)의 도로가 어떤 구간과 레이어로 나뉘는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 도로·교통 데이터와는 노선번호·도로명 같은 이름·코드 매핑으로만 이어 쓰며, 표준노드링크(link_id·node_id)와 직접 연결되는 키는 없다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국국토정보공사에서 제공하는 도로대장 정보(노선번호, 구간번호, 레이어코드)입니다.
