summary_user: 한국도로공사가 관리하는 전국 고속도로 버스전용차로 구간의 교통량(대)과 평균 속도(km)를 콘존(구간) 단위로, 기준일자·시간·방향·차로유형(버스전용차로/인접 일반차로)별로 집계해 담는다. 교통 분석가나 정책 담당자가 '평일 출퇴근 시간대에 버스전용차로가 일반차로보다 얼마나 빠르고, 실제 이용률은 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 전역 조인 키가 없어서, 콘존 ID(conzoneId)나 콘존명을 이용해 같은 한국도로공사의 콘존 기반 소통·교통량 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 버스전용차로 구간 소통정보 및 이용률 자료로, 버스전용차로와 인접 차로의 교통 흐름과 이용 현황을 OpenAPI로 제공한다.제공 형식은 XML과 JSON이며, 출력 항목에는 기준일자, 시간, 콘존명과 ID, 차로유형구분명과 코드, 교통량(대), 속도(km), 방향(S:기점/E:종점), 집계시간단위구분코드가 포함된다.이 데이터는 버스전용차로 구간의 교통량과 평균 속도를 기반으로 차로별 소통 수준과 이용률을 분석하는 데 유용하다.이를 통해 운영 효과를 평가하고 일반차로와의 속도 차이, 시간대별 혼잡 정도를 파악할 수 있다.또한 교통정책 수립, 대중교통 서비스 개선, 혼잡 완화 등 다양한 분야에서 활용된다.도로 이용자에게는 버스전용차로 이용 정보와 소통 현황을 제공해 교통 선택과 경로 계획에 도움을 준다.
