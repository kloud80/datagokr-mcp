summary_user: 경기도 내 고속국도·일반국도의 상시 조사지점별로 하루 교통량을 방향(상·하행)과 차종(최대 12종)별로 담은 일 단위 집계 데이터다. 도로 분석가나 지자체 담당자가 특정 국도 구간에 대형 화물차가 하루 얼마나 다니는지, 노선·지역별 차종 구성이 어떻게 다른지 확인하는 데 쓴다. 전역 조인 키는 없어서 노선번호(route_cd)·지점번호·지역 코드 같은 이름·코드 매핑으로 표준노드링크 등 다른 도로 데이터와 이어 붙여야 한다.
description_portal: 기도내 고속국도 및 일반국도의 지점별로 조사된 상시교통량을 1년 365일 차종별/방향별로 1일 교통량을 제공합니다.승용차부터 대형 화물차, 특수 차량까지 다양한 교통수단의 통행량을 분석할 수 있어 도로 이용 패턴 및 교통시설 운영 전략 수립에 매우 유용합니다. 지역 및 노선별 특성에 따른 차량 분포 차이를 분석하여 도로 유지관리 계획, 교통안전 대책, 화물차 우회도로 설정 등의 정책 수립 자료로 활용될 수 있으며, 교통 영향 평가 및 도로 용량 분석에도 활용 가능성이 높습니다.※ 주의사항- 지점별 교통량 값- 차종구분이 2005년 이전은 11종, 2006년 이후는 12종-개별지점의 상태(도로이전설치, 교통량 측정기 고장, 통신오류 등)에 따라 검색결과가 없을 수 있습니다.
