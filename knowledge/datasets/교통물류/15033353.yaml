summary_user: 김해시에 주사무소를 둔 화물자동차 운송사업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·업종·사업자구분과 도로명·지번 주소, 우편번호, 위도·경도를 개별 업체 단위로 제공한다. 화주나 물류 담당자가 김해시 안의 운송사·용달업체를 찾을 때, 분석가가 업종별 업체 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명·주소로 맞추거나 좌표로 공간 결합해야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: '경상남도 김해시 화물자동차 운송사업체 현황에 대한 데이터로 순번, 업체명, 업종, 사업자구분, 주사무소도로명우편번호, 주사무소도로명주소, 주사무소지번우편번호, 주사무소지번주소, 위도, 경도의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2026년 7월 15일로, 연간 주기로 관리하고 있습니다.* 해당 데이터는 데이터 미집계 등의 사유로 공란이 많습니다.데이터 담당부서 : 김해시 교통정책과(055-330-6573)[데이터 변동 안내]1. 일부 사업체 정보 수정2. 신규 사업체 추가3. 제공 항목 변경(삭제 : 전화번호, 추가 : 사업자구분, 우편번호, 구분 : 주사무소 -> 도로명주소, 지번주소)4. 데이터 설명 수정5. 데이터 기준일 변경'
