summary_user: 부산교통공사가 관리하는 도시철도 1~4호선 역사 내 승강기(에스컬레이터)를 호선·역명·호기별로 한 행씩 담고, 각 기기의 설치연도와 개량연도를 기록한 기기 단위 현황 파일이다. 유지보수 담당자나 분석가가 "어느 역의 에스컬레이터가 설치된 지 오래됐는데 아직 개량되지 않았나"처럼 노후도를 평가하고 개량 시기를 정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역·시설 데이터와는 호선·역명을 이름으로 맞춰 이어 써야 한다.
limits: 개량년도가 비어 있는 행은 아직 개량되지 않은 기기라는 뜻이므로 결측으로 처리하면 안 된다. 역 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 역명 표기를 직접 맞춰야 한다.
