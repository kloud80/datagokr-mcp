summary_user: 안전신문고로 접수된 경상북도 청도군 관내 불법주정차 신고를 건별로 담은 파일로, 각 행은 연번과 신고일시만 갖는다(포털 설명상 2024년 한 해분). 군 담당자나 분석가가 "청도군에서 불법주정차 신고가 어느 요일·시간대에 몰리는가" 같은 신고 추이·집중 시간대를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명(청도군)이나 날짜 기준으로만 맞춰 붙일 수 있다.
description_portal: 이 데이터는 안전신문고를 통해 접수된 경상북도 청도군 관내 불법주정차 신고 현황을 연번과 신고일시 기준으로 정리한 자료이다. 2024년 한 해 동안 청도군에 접수된 신고 건별 발생 순번과 신고 접수 일시가 행(row) 단위로 수록되어 있으며, 각 건은 청도군이 운영하는 불법주정차 신고 창구를 통해 접수된 건을 의미한다. 이용자는 특정 기간의 신고 추이를 파악하거나 시간대별·일자별 신고 집중 구간을 분석함으로써 불법주정차 단속 계획 수립, 주정차 취약지역 관리, 교통질서 개선 정책 수립 등의 기초자료로 활용할 수 있다. 또한 민원 발생 양상을 장기적으로 모니터링하여 청도군의 생활환경 및 도로 이용 여건을 개선하는 데 참고자료로 활용한다.
