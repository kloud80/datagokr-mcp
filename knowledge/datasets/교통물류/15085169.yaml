description_portal: '○ 통계개요* 통계명 : 통근통학* 통계종류 : 서울서베이의 서울시민 통근통학 현황을 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의현재상태에 대한 객관적이고 심층적인 분석과 현재 도시발전수준을 모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별ㆍ연령별ㆍ지역별ㆍ학력별 등)의 통근ㆍ통학여부 및지역(서울시내, 다른시ㆍ도) 현황 등○ 용어설명* 통근·통학 : 통근인구란 12세이상 인구 중 매일 정기적으로 집에서 직장에 근무하러 다니는 자를 말함. 통학인구란 12세이상 인구 중 정규학교(원) 뿐만 아니라 입시준비학원, 이·미용학원, 양재학원, 각종 기술학원 및 직업훈련원 등에 다니는 자를 말함'
