summary_user: 대전도시철도 1호선에서 발생한 부정승차를 조회 기간을 지정해 받아오는 API로, 부정승차 유형·발생일·발생 장소 같은 항목을 담는다. 대중교통 연구자나 정책 담당자가 "어느 역에서 어떤 유형의 부정승차가 많이 일어나는가"를 파악해 역별 단속이나 운임 손실을 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 역 이름 매핑이나 같은 기관(대전교통공사)의 데이터로만 이어 쓴다.
limits: 공식 역 코드 같은 공통 조인 키가 없어 다른 철도·역 데이터와는 이름을 맞춰 붙여야 한다. 개발계정은 하루 1,000회로 호출이 제한되며, 포털 활용신청(자동승인)으로 받은 인증키가 필요하다.
