description_portal: 대전교통공사에서 운영 및 관리하고 있는 대전도시철도 1호선에서 발생한 부정승차 정보를 제공하는 데이터입니다.조회 기간을 설정하여 해당 기간 동안 발생한 부정승차 유형, 발생일, 발생 장소 등 주요 항목별 정보를 포함하고 있습니다.본 데이터를 활용하면 대전도시철도 내 부정승차 발생 현황과 유형별 추이를 파악할 수 있으며, 대중교통 부정승차 예방 연구, 승차권 운임 수입 손실 분석, 역사별 단속 강화 정책 수립을 위한 기초 자료 등 다양한 분야에서 활용이 가능합니다.부정승차 현황을 투명하게 공개함으로써 시민의 올바른 대중교통 이용 문화 정착과 공정한 운임 체계 유지에도 기여합니다.(본 데이터는 오픈API 형태로 제공되며, 데이터 활용을 위해서는 사전에 활용 신청을 완료하고 인증키를 발급받아야 합니다.)
