      - name: drvDt
        required: false
        example: '20250124'
        desc: 열차 운행 일
      - name: trnNo
        required: false
        example: A2002
        desc: 열차운행번호
      - name: stnCd
        required: false
        example: '110'
        desc: 역코드
      - name: drvSer
        required: false
        example: '1'
        desc: 운행 시리얼 번호
      - name: tmp1
        required: false
        desc: 추가현황1
      - name: tmp2
        required: false
        desc: 추가현황2
      - name: type
        required: false
        example: xml
        desc: 응답유형 [xml, json] default=xml
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 500
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
