summary_user: 인천공항 공항철도 열차의 운행일·운행번호·역별 도착·출발 예정 및 실제 일시와 열차 구분(일반/직행)을 조회하는 실시간 조회용 API이다. 승객이나 서비스 개발자가 특정 열차가 역에 예정대로 도착·출발했는지 확인하는 질문에 쓴다. 전역에서 통하는 조인 키는 없고, 역 코드(stnCd)와 정류장 코드(stopDvsnCd)를 같은 기관의 참고문서 코드표와 맞춰 연결해야 한다.
limits: 분석용이 아니라 서비스용 조회 도구이며, 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이 필요하다. 운행일 기준 D-3~D+3 범위만 제공하므로 과거 이력 분석에는 쓸 수 없고, 개발계정은 일 500회 호출 제한이 있다. 검증 시 수신된 행은 1행뿐이다.
