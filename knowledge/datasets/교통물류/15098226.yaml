description_portal: 인천국제공항 공항철도 운행 일정 정보를 제공합니다. 열차를 일반/직행을 구분(Comm:일반,Dirc:직행)하여 인천공항철도 열차 운행 일정을 제공합니다. 열차운행일,운행번호,역코드,운행 시리얼 번호를 기준으로 조회합니다. 운행 일, 운행 번호, 역 코드(참고문서참고),운행 시리얼 번호, 정류장 코드(참고문서참고),도착예정일시,출발예정일시,도착실제일시,출발실제일시,열차구분을 제공합니다. 운행일 기준 D-3~D+3의 데이터를 제공합니다. 개발 계정 일 500 트래픽, 운영 계정 신청 시 일 10000 트래픽을 제공합니다.
