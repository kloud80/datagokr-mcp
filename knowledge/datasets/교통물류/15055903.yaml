summary_user: 광주광역시 시내버스의 평일 운행 시간표를 노선별로 담은 엑셀 파일(xlsx, 약 945KB)로, 운행횟수·출발시간·출발장소·배차간격 같은 시간표 정보를 담는다. 시민이나 분석가가 '이 노선 첫차·막차가 몇 시이고 평일 배차간격은 몇 분인가'를 확인하거나 노선별 운행 빈도를 비교하는 데 쓴다. 실측 컬럼에 정류장·노선 ID 같은 전역 조인 키가 없어, 버스 정류장·노선 원장이나 실시간 도착 데이터와는 노선 이름을 매핑해서만 이어 쓴다.
description_portal: 광주광역시 시내버스 평일 운행 시간표에 대한 데이터입니다. 시내버스 노선별 운행횟수, 출발시간, 출발장소, 배차간격 등의 정보를 제공합니다. 시내버스 운행시간표는 교통 상황, 운수사 사정에 따라 변동될 수 있으며, 시간표 변동시에는 광주광역시 버스운행정보사이트 공지사항 및 노선 시간표에 게시됩니다.※본 데이터 및 추가 관련 정보는 광주광역시 버스운행정보(http://bus.gwangju.go.kr/guide/notice/noticeList) 사이트 내 공지사항에서도 확인하실 수 있습니다.
