summary_user: 서울교통공사 관할 지하철역 사이의 출발역·도착역 쌍마다 총거리, 수도권 안팎 구간거리, 공항철도 구간 정보와 운임·정기권 정보를 한 행씩 담은 운임표 파일(CSV, 약 12MB)이다. 지하철 이용자나 교통 서비스 개발자가 '이 역에서 저 역까지 거리와 기본 운임이 얼마인가'를 조회하는 데 쓰며, 분석용보다는 서비스용 조회 성격이 강하다. 전역 공통 조인 키는 없어서 다른 역 정보·시간표 데이터와는 역번호나 역명을 직접 맞춰 연결해야 한다.
description_portal: 서울교통공사 운임표 데이터입니다. 해당 데이터는 서울 내 지하철역간 모든 거리 및 운임정보를 제공합니다. 1호선 운임표는 서울교통공사 관할 서울역~청량리 운임표를 제공합니다. 수도권 도시철도 운임체계는  수도권내 구간과 수도권외 (평택~신창, 가평~춘천)구간의 운임체계 상이로 수도권내 구간거리와 수도권외 구간거리를 표시합니다.    추가로 운임 부과 기준은 최단 거리의 거리비례 요금제이므로 별도 운임이 부과되는 노선을 이용할 시, 추가 운임이 발생하여 운임표의 정보와 다른 운임이 책정될 수 있음을 참고하여 주시기 바랍니다.
