summary_user: 대구광역시 서구 관내 물류창고업체 5곳의 상호·주소·연락처를 업체 한 곳당 한 행으로 담은 소규모 목록(CSV 419바이트)이다. 서구 안에서 물류창고를 이용하거나 거래처를 찾는 사업자, 지역 물류시설 입지를 살피는 분석가가 '서구에 어떤 물류창고업체가 어디에 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·코드)가 없어, 다른 데이터와는 상호 이름이나 주소를 맞춰 잇거나 같은 기관의 다른 목록과 나란히 보는 방식으로만 연결한다.
description_portal: 대구광역시 서구 관내에 위치한 물류창고업 현황 자료입니다. 물류창고업 상호와 주소, 연락처를 포함한 데이터로 대동산업공사, 동진무역, 신양보세물류, 풍국산업주식회사, 씨제이대한통운으로 총 5개의 현황 데이터입니다. 데이터는 관내 사업장의 위치 파악, 업종별 분포 분석, 행정자료 활용 등을 위해 제공되며, 도로명주소와 지번주소를 함께 수록하여 공간 기반의 활용도를 높였다. 전화번호 항목은 이용자 편의를 위한 연락 가능 여부 및 방문 계획 수립에 유용하다. 본 목록은 행정 자료로서 시민, 기업, 연구자 등이 대구 서구 내 운영 특성을 파악하는 데 활용할 수 있다.해당데이터는 물류창고업체의 신고에 따라 관할청에서 기록하고있는 데이터로 법정 신고의무가 없음에 따라 회사의 업체 현황 및 정보가 일부 상이할 수 있습니다.
