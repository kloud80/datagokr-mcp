summary_user: 경기도 버스운송관리시스템(BMS)에서 수집한 막차 운행 기록으로, 수집일자별로 노선·차량마다 상행 최종시간, 여러 정류장의 통과 감지시각과 도착예정시각, 단계별 판정 결과, 최종 판정, 운행횟수를 건별로 담는다. 분석가나 교통 담당자가 "이 노선의 막차가 실제로 예정대로 끝까지 운행했는지, 제외 판정이 난 사유는 무엇인지"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 노선 ID(route_id)·노선명·버스회사 ID 같은 경기도 내부 코드나 이름 매핑으로 같은 기관의 노선·정류장 데이터와 이어 쓴다.
description_portal: '이 데이터는 경기도 버스운송관리시스템(BMS)에서 수집된 막차 운행 관련 정보로, 노선별 마지막 차량의 실제 운행 종료 시점에 대한 세부 내역을 담고 있습니다. 주요 항목은 버스회사명, 노선명, 차번호, 상행최종시간, 각 정류장 통과 시각(감지시간), 정류장 별 도착예정 시각, 각 단계별 판정 결과, 최종판정내역, 운행횟수 등으로 구성되어 있습니다. 막차 운행 여부를 판단하는 데 필요한 다차례 시간 기록과 비교, 이를 통해 실제 운행 종료 여부 및 운영상의 특이사항(예: 제외 판정 사유 등)을 분석할 수 있습니다.'
