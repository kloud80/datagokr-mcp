summary_user: 경기도 도로대장전산화시스템에 등록된 가로수를 도로 노선번호·구간번호별로 담은 건별 원천 데이터로, 시점·종점 위치, 방향, 수량, 수종, 설치일자, 시종점 위경도를 포함합니다. 시·군 녹지 담당자나 분석가가 "경기도 어느 도로 구간에 어떤 수종의 가로수가 몇 그루, 언제 심어졌나"를 확인하거나 녹지지도·현장 점검 자료를 만드는 데 씁니다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 경기도 도로대장 계열 데이터와 노선번호(route_no)·구간번호를 이름·코드 매핑으로 맞추거나 좌표로 표준노드링크 등 도로망 데이터에 공간 매칭해 이어 씁니다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템에 등록된 가로수 관련 정보를 담고 있으며, 도로 노선번호, 구간번호, 위치(시점/종점), 방향, 수량, 수종(벗나무, 단풍나무 등), 설치일자, 공간좌표(위도·경도) 등의 항목으로 구성되어 있습니다. 가로수는 도로변 미관 개선, 미세먼지 저감, 보행자 안전 및 환경 조성 등의 다양한 역할을 수행하는 주요 조경시설로서, 본 데이터는 도로구간별 식재 현황을 체계적으로 관리하고 분석하기 위해 활용됩니다. 특히 수종별 분포 현황, 식재 밀도, 설치 시점 등을 바탕으로 도시 녹지 관리, 생태환경 개선, 도로환경 정책 수립 등의 목적으로 사용될 수 있으며, 공간좌표 정보를 기반으로 GIS 기반 녹지지도 구축 및 현장 점검 자료로도 유용하게 활용됩니다.
