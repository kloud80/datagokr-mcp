summary_user: SRT 경부선 열차의 요일별 이용률(%)을 담은 집계 파일로, 행은 요일이고 열은 열차번호(301~344 등)이며 9로 시작하는 번호는 중련열차 후부 차량의 이용률을 뜻한다. 이용객이나 분석가가 'SRT 경부선의 어느 열차가 무슨 요일에 붐비는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 열차번호를 기준으로 SRT 시간표 등 같은 기관 자료와 이름 매핑으로만 연결한다.
limits: 포털 설명상 2024년 하반기까지의 이용률이며, 빈칸은 해당 요일 미운행 열차라 값이 없다. 역별·구간별 이용률은 담지 않으며, 표준 조인 키가 없어 다른 데이터와 직접 결합하기 어렵다.
