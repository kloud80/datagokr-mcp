summary_user: 경기도 도로대장 전산화 시스템을 바탕으로 유료도로를 노선·구간 단위로 정리한 원천 목록으로, 구간별 시점·종점 이정과 좌표, 전체·도로·교량·터널 연장, 요금징수 시작·종료일자, 징수시설 수, 설치 근거를 담는다. 도로정책 분석가가 경기도 안 유료도로 구간이 어디에 있는지, 요금징수가 언제 시작되고 끝나는지 확인하거나 유료도로 지정·해제 검토의 기초자료로 쓴다. 전역 조인 키가 없어 노선번호·노선구간코드를 같은 기관의 도로대장 데이터와 맞추거나, 시점·종점 좌표로 표준노드링크와 공간적으로 대응시켜 이어 쓴다.
description_portal: 이 데이터는 경기도 도로대장전산화시스템을 기반으로 작성된 유료도로 관련 정보로, 각 노선과 구간에 따라 유료도로의 시점과 종점, 해당 구간 내 연장거리, 요금징수 시작 및 종료일자, 유료도로 설치 근거 등을 포함하고 있습니다. 주요 항목으로는 '노선번호', '노선·구간코드', '유료도로시점구간내이정', '유료도로종점구간내이정', '연장전체', '요금징수시작일자', '요금징수종료일자', '유료도로 설치근거', '비고' 등이 있으며, 도로 통행료 정책 수립, 재정도로 운영 현황 파악, 유료도로 운영 효율성 분석 등에 활용됩니다. 또한 요금징수 구간 종료 여부나 시설 수에 대한 정보도 함께 제공되어 향후 유료도로 지정 또는 해제의 기초자료로 기능할 수 있습니다.
