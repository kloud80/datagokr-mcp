description_portal: '경기도 평택시 도로점용(굴착)허가 현황에 대한 데이터로 위치, 점용목적, 허가일자, 점용종료일 등의 정보를 제공합니다.도로점용(굴착)허가현황은 도로법에 따라 도로 내 지하매설물 공사, 즉 하수관, 상수관, 통신관, 전기, 가스 등 공사 시 필요한 허가 정보를 의미합니다. 이를 활용하면 다양한 분야에서 도로 공사 계획 수립, 안전 관리, 공사 중 도로 교통 상황 예측 등에 활용될 수 있습니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 도로관리과, 건설도시과(송탄출장소, 안중출장소)'
