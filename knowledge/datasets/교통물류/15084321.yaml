summary_user: 김제시 관내 도로 굴착 허가를 허가 한 건당 한 행으로 담은 원천 목록으로, 신청인·허가일·도로명 기준 위치·허가목적·허가 시작일과 종료일이 들어 있으며 파일 크기는 1441바이트로 작다. 주민이나 사업자가 특정 도로에서 언제부터 언제까지 굴착 공사가 있는지, 같은 기간에 공사가 겹치는 구간이 있는지 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없어 위치(도로명) 문자열을 주소·도로 데이터와 이름으로 맞추거나 같은 김제시의 다른 도로 데이터와 기관 단위로만 이어 쓴다.
description_portal: 김제시 관내 도로 굴착 허가 현황을 제공하는 데이터로, 신청인, 허가일, 굴착 위치(도로명 기준), 허가 목적, 허가 기간(시작일~종료일) 항목을 포함하고 있습니다. 해당 데이터는 도로 공사 계획 수립, 도시 인프라 정비, 통신 및 공공설비 관리, 이용자 안전 안내 등에 활용할 수 있습니다. 또한, 굴착 목적과 기간 정보를 기반으로 공사 겹침 여부 분석, 민원 대응 및 도심 교통 영향 평가에 유용하며, 관련 부서와 민간 업계의 협업 자료로도 활용됩니다.정기 갱신을 통해 최신 공사 정보를 제공하며, GIS와 연계하여 굴착표시 및 시각화 지도 구축에도 적용 가능합니다.
