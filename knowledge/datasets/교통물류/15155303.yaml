summary_user: 서울 서대문구에서 2024년 안전신문고로 접수된 불법주정차 신고 가운데 과태료를 부과한 건을 한 건씩 담은 원천 내역으로, 단속일시·단속장소(지번주소)·단속여부를 담은 CSV 파일(약 191KB)이다. 구민이나 분석가가 서대문구에서 어느 시간대·어느 동네에 불법주정차 과태료가 몰리는지 파악해 단속 계획이나 주차 정책을 검토하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 지번주소 문자열을 매칭하거나 주소를 좌표로 바꿔 보호구역·주정차 금지구역 같은 단속 데이터와 겹쳐 보는 방식으로만 잇는다.
description_portal: 이 데이터는 2024년 안전신문고로 접수된   불법주정차 신고 중 과태료를 부과한 데이터로 불법주정차 위반 차량에 대해 과태료를 부과한 내역을 담고 있습니다.. 주요항목은 단속일시(날짜 및 시간), 단속장소(지번주소), 단속여부의 항목을 포함하고 있습니다.이 데이터는 시간대별·지역별 불법주정차 발생 집중도를 파악할 수 있으며, 이를 통해 효율적인 단속 계획을 수립하고, 주차 정책 개발 및 평가에 활용하여 올바른 주차 문화를 정착시키는 데 기여할 수 있습니다.또한 이 데이터는 CSV로 다운로드 가능합니다.
