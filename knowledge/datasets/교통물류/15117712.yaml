summary_user: 튜닝 작업을 마치고 완료 입력을 할 수 있는 자동차정비업자·튜닝자동차 제작 사업자의 등록 현황을 사업장 단위로 담은 전국 4,834행 파일 데이터다. 튜닝 승인을 받은 차량 소유자가 자기 지역에서 튜닝작업완료 입력이 가능한 업체와 정비구분별 작업 범위를 찾는 질문에 쓴다. 실측 조인 키는 주소(address)뿐이라 같은 주소 필드를 가진 지역·사업장 자료와 이어 쓰고, 차량등록번호나 사업자번호 같은 키는 이 파일 필드에 없다.
description_portal: 자동차관리법제34조(자동차의 튜닝) 2항에 따라 튜닝 작업을 완료한 자동차정비업자 또는튜닝자동차제작 등록 현황입니다.튜닝작업완료입력 사업자 등록 정보 이며 업체 상호, 전화번호, 정비구분, 주소를 알 수 있는 자료로 일부 업체는 연락처를 제공하지 않습니다튜닝작업완료입력은 정비구분에 따라 튜닝작업을 할 수 있는 범위가 정해지므로 튜닝 작업가능 범위 까지 알 수 있으며 각 지역별 튜닝작업완료 입력 가능 업체를 알 수 있습니다. 자동차 튜닝은 튜닝승인이후 튜닝작업완료등록을  해야만 튜닝검사를 받을 수 있으므로 튜닝 승인이후에 필요한 자료입니다.
