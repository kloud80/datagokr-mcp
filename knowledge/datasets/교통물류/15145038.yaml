description_portal: 소방 서비스 정보는 해당 공항에서 보유하거나 운용하는 항공기 구조·소방 장비 및 차량 현황을 제공합니다.제공 항목은 공항식별자, 공항명, 제공서비스 내용으로 구성되어 있습니다.내용 항목에는 공항이 보유한 구조·소방차량(ARFF), 보조 수자원 차량, 구조차량, 구급차, 지휘차, 항공기 구조 소방 계단차, 긴급 구호 차량 등의 현황이 포함됩니다.또한, 필요 시 외부 기관에서 지원 가능한 구조·소방 장비 및 인력 정보도 포함됩니다.예) 소방서의 대형 구조차량과 고성능 소방펌프, 해양경찰의 해상 구조정과 수중 수색 장비, 해군의 군용 구조함과 화재 진압 장비, 경찰청 항공대의 구조 헬기와 응급 후송 장비 등.이러한 장비와 인력은 항공기 사고, 화재, 해상 추락, 대형 재난 등 다양한 비상 상황에 대응하기 위해 운용됩니다.해당 정보는 e-AIP AD 2.6에서 확인하실 수 있습니다.
