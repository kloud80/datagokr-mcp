summary_user: 경기도 내 고속도로 조사 구간별 상시교통량을 일자·방향(상행/하행)·차로 구분 단위로 담고, 1시부터 24시까지 시간대별 교통량과 일 합계(TDAY_SUM)를 함께 제공하는 측정값 데이터다. 분석가나 도로 관리자가 '특정 고속도로 구간에서 출퇴근 시간대 교통량이 요일·월별로 어떻게 달라지는가' 같은 질문에 쓴다. 전역 조인 키는 없으며, 노선명·구간명·구간코드(SECTION_CD)를 이름이나 같은 기관 코드로 맞춰 다른 교통 소통·사고 데이터와 연결해야 한다.
description_portal: '경기도내 고속도로의 구간별로 조사된 상시교통량을 1년 365일 시간대별/방향별로 1일 교통량을 제공합니다.데이터가 많아 2025년도 전체 파일 다운로드 시 파일 탭의 파일서비스를 이용 부탁드립니다.* 2025-09-08 기준 8/24일까지의 데이터를 제공 중에 있습니다.차후 2026년 1월 중 2025년 전체 데이터를 제공 예정입니다.※ 지점별 교통량(단위: 시간대 선택에 따라 대/시, 대/일)※ 개별지점의 상태(도로이전설치, 교통량 측정기 고장, 통신오류 등)에 따라 검색결과가 없을 수 있습니다.'
