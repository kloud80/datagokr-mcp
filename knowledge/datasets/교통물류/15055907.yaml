description_portal: 본 데이터는 광주광역시 시내버스 공영차고지의 현황을 정리한 자료로, 연번, 차고지명, 도로명주소, 부지면적, 건축연면적, 조성기간 항목으로 구성되어 있습니다. 월남동 차고지는 부지면적 12,023㎡, 건축연면적 977㎡이며 1997~1998년 조성되었고, 장등동 차고지는 13,897㎡ 규모로 1997~2001년 기간에 조성되어 있습니다. 매월동 차고지는 6,177㎡, 일곡동 차고지는 6,460㎡의 부지면적을 보유하며 각각 2000~2003년, 2002~2003년에 조성된 것으로 제시되어 있습니다. 또한 첨단동 차고지는 20,230㎡ 규모로 2024년에 조성된 현황이 포함되어 있으며, 각 차고지의 위치와 조성 규모를 확인하실 수 있는 자료입니다.
