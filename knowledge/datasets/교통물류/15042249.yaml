summary_user: 경기도 광주시 공간정보시스템에 등록된 교차로 신호등 제어기를 한 대씩 담은 건별 시설물 목록으로, 지형지물부호·설치 위치·관리기관·경도·위도를 가진다(CSV 약 47KB). 광주시 안에서 신호 제어기가 어느 교차로에 있고 누가 관리하는지 확인하거나 지도에 표시해 신호 시설 점검 대상을 고르는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 경도·위도 좌표로 공간 결합하거나 위치 이름·관리기관을 매핑해 잇는다.
