description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 신호등 제어기의 위치 정보를 제공합니다. 교차로에 설치된 신호등을 제어하는 제어기 장치의 위치 정보를 담고 있어 교통 신호 시스템 관리에 활용됩니다. 지형지물부호는 제어기를 식별하며, 위치는 제어기가 설치된 지점을 나타냅니다. 관리기관은 제어기 관할 주체를 표시하고, 경도와 위도는 제어기의 정확한 지리 좌표를 제공합니다. 본 데이터는 교통 신호 시스템 관리, 신호 제어 최적화, 시설물 유지보수, 교통 흐름 개선, 스마트 교통 체계 구축 등에 활용됩니다.
