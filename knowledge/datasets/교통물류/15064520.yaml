summary_user: 한국교통안전공단이 시행한 자동차 튜닝 컨설팅과 교육 실적을 월(연월) 단위로 집계한 전국 범위 통계 파일(CSV, 약 1KB)로, 1:1 튜닝컨설팅 수료업체 수, 합동컨설팅 횟수, 예비종사자·종사자 교육 횟수를 담는다. 튜닝 산업 지원 정책 담당자나 분석가가 '월별로 튜닝업체 컨설팅과 종사자 교육이 얼마나 이뤄졌고 추세가 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연월 기준으로 나란히 놓거나 같은 기관의 튜닝 관련 통계와 이름으로 맞춰 비교하는 정도로만 이어 쓴다.
limits: 전국 단위 집계라 시도·시군구별 지역 구분이나 개별 업체·교육 건 단위 정보는 없다. 공통 조인 키가 없어 다른 데이터와 자동 결합은 어렵고 연월이나 이름 매핑으로만 연결된다.
