summary_user: 고속도로 차량감지장치(VDS) 자료를 콘존(IC·JC·요금소 사이 관리구간)과 차로유형별로 1시간 단위 집계한 교통량·평균속도·통행시간 통계(표준편차·중위값·최대·최소 포함)를 담으며, 범위는 전국 고속도로입니다. 교통 분석가나 정책 담당자가 특정 고속도로 구간의 시간대별 혼잡 정도나 통행시간 변동이 얼마나 큰지 확인하는 데 쓴다. 전역 조인 키는 없어서 콘존ID를 같은 기관의 콘존 구간 정보와 코드로 맞추거나 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: '콘존이란? IC(나들목), JC(분기점), 그리고 TG(요금소) 등 통행하는 차량수가 일정한 고속도로 구간공용 중인 고속도로 노선상에 설치된 차량감지장치(VDS)에서 수집된 데이터를 기반으로 콘존별, 차로유형별, 교통량 및 평균속도, 통행시간 정보에 대해 1시간 단위로 통계 생성된 데이터본 데이터는 한국도로공사가 수집한 고속도로의 콘존(ConZone: 관리구간) 및 차로유형별 월간 교통 소통 정보를 제공한다.  차로유형에는 본선, 램프, 연결로 등이 포함되며, 해당 구간을 통과한 교통량, 평균속도, 점유율 등의 지표가 포함되어 있다.  각 콘존별로 유형별 차로 구분을 통해 구체적인 교통 흐름을 분석할 수 있으며, 교통 정책 수립 및 혼잡도 분석 등에 활용할 수 있다.  데이터는 고속도로별, 차로유형별, 시간대별로 구분되어 있으며, 1시간 단위로 갱신된다.  또한 도로 운영 효율성 평가 및 교통 인프라 개선 등의 목적으로도 활용 가능하다.  CSV 형식으로 제공되며, 원하는 구간 및 기간을 선택하여 조회할 수 있도록 구성되어 있다.* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000006'
