summary_user: 광주교통공사가 도시철도 차량 안 공기질을 연도별로 집계한 538바이트 크기의 작은 CSV 파일로, 초미세먼지(PM2.5)·미세먼지(PM10)·이산화탄소(CO2)를 평상시와 혼잡시로 나눠 담는다. 시민이나 분석가가 '광주 지하철 객실 안 미세먼지와 이산화탄소 농도가 해마다 어떻게 변했고, 붐빌 때는 얼마나 높아지나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 도시철도 공기질 자료나 혼잡도 자료와는 연도(연도 필드)를 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 광주교통공사의 차량 내 공기질 측정 결과를 연도별로 기록한 자료입니다. 주요 항목은 연도, 초미세먼지(PM2.5) 평상시·혼잡시, 미세먼지(PM10) 평상시·혼잡시, 이산화탄소(CO2) 평상시·혼잡시입니다. 일부 연도는 초미세먼지(PM2.5) 측정값이 누락되어 있으며, 미세먼지와 이산화탄소는 대부분의 연도에서 기록이 존재합니다. 측정값은 차량 운행 시 ‘평상시’와 ‘혼잡시’로 구분되어 공기질 변화를 비교할 수 있도록 구성되어 있습니다. 이 자료는 대중교통 이용 환경의 위생·안전 수준을 분석하고, 미세먼지 저감 대책, 차량 환기 시스템 개선, 환경 기준 준수 여부 검토 등에 활용할 수 있습니다. 특히 장기적인 공기질 변화 추이를 분석하여 시민 건강 보호를 위한 정책 근거로 활용 가치가 높습니다.
