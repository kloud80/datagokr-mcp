summary_user: 전국 대중교통 노선별 승하차 인원을 운행일자·시간대·노선·출발/도착 정류장·이용자유형 단위로 집계해 담는 API이며, 검증 호출에서는 2025-08-01 하루치 101행이 수신됐다. 분석가나 교통 계획 담당자가 특정 시군구의 어느 노선·시간대가 혼잡한지, 승차·하차 인원이 얼마인지 확인하는 질문에 쓴다. 시군구코드(sgg_cd)로 다른 데이터의 시군구 코드와 이어 쓰며, 이 코드는 필수 파라미터라 먼저 받아서 넘겨야 한다.
limits: 일·월·연 단위 오퍼레이션 3개(getDailyTripVolumebyRoute, getMonthlyTripVolumebyRoute, getAnnualTripVolumebyRoute)는 최소 파라미터로 응답이 없었고, 실측 범위는 검증 조건의 2025-08-01 하루뿐이다. 최신 행 날짜가 오래돼 보이는 것은 검증 호출 조건 때문이라 데이터 자체의 최신성과 다를 수 있다. 개발계정은 일 1,000회 호출 제한이 있다.
