summary_user: 경기도 포천시에 설치된 택시승강장을 한 곳당 한 행으로 담은 파일로, 승강장 이름·주소·형태(쉘터형·표지판형)·설치연도·데이터 기준일을 포함하며 범위는 포천시 한 곳이다. 시민이 가까운 택시승강장 위치를 찾거나, 교통 분석가가 포천시 승강장 중 쉘터형이 얼마나 되고 언제 설치됐는지 살필 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소를 지오코딩하거나 승강장 이름으로 맞춰 붙여야 하고, 같은 포천시 교통 데이터와 주소 기준으로 이어 쓴다.
description_portal: 경기도 포천시에서 공공데이터 제공 및 이용활성화에 관한 법률 제17조, 제26조, 제27조에 의거하여 택시승강장명, 택시승차장 주소, 형태, 설치연도, 데이터 기준일 항목들을 제공합니다. 택시승강장명은 설치된 택시승강장의 명칭을 나타냅니다. 택시승강장 주소는 설치된 택시승강장이 위치한 주소를 나타냅니다. 형태는 설치된 택시승강장의 종류(쉘터형,표지판형)를 나타냅니다. 데이터 기준일은 데이터가 갱신된 일자를 나타냅니다. 본 데이터는 정기적으로 갱신되며 교통정책 수립과 시민 편의 증진을 위한 핵심 자료로 제공됩니다.
