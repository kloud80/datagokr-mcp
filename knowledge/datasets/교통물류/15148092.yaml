summary_user: 안산시 ARTR(도시교통정보 수집 체계)이 운영구간(운영구간 아이디)별로 5분 단위로 집계한 교통량·속도·점유율·소통등급과 교차로구간의 용량·포화도·서비스 수준을 담은 시계열 파일(CSV 약 48MB)이다. 교통 분석가가 "안산시 어느 구간·교차로가 어느 시간대에 상습적으로 막히는가"를 따지거나 단기 교통 예측·신호 운영 개선 근거를 만드는 데 쓴다. 전역 조인 키는 없어서 운영구간 아이디나 돌발상황 아이디를 같은 기관(안산시)의 구간·돌발 정보와 이름·코드로 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 5분 단위로 집계된 정밀한 도로 교통 정보를 담고 있는 시계열 자료입니다. 각 도로 구간별로 특정 시간대의 교통량, 평균 속도, 도로 점유율과 같은 핵심 교통 지표를 상세히 제공합니다. 뿐만 아니라, 교차로 구간의 통행 용량, 포화도, 서비스 수준 정보까지 포함하고 있어, 복잡한 도심 교통 네트워크나 특정 구간의 병목 현상을 심층적으로 분석하는 데 매우 유용합니다. 이렇게 짧은 주기로 수집된 데이터는 실시간 교통 상황 모니터링, 단기 교통 예측 모델 개발, 그리고 효율적인 지능형 신호 제어 시스템 구축 등 첨단 교통 관리 분야에서 높은 활용 가치를 지니는 핵심적인 정보 자산입니다.
