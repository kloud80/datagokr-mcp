summary_user: 경기도 양주시 도시지역의 광역 교통정보 구역을 구역별로 정리한 작은 목록 파일(csv, 약 5.5KB)로, 지역식별자·시·구 지역명·지역코드를 담는다. 교통 분석가나 담당 공무원이 양주시 안에서 광역 교통정보가 어떤 구역 단위로 나뉘고 각 구역에 어떤 코드가 붙는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 교통 데이터와는 지역명이나 지역코드(지역코드)를 이름·코드로 맞추거나 같은 기관 코드 체계를 쓰는 자료와만 연결한다.
