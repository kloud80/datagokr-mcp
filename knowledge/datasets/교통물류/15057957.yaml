summary_user: 경기도 내 자동차 정비업체를 업체 한 곳당 한 행으로 담은 목록으로, 업체명·정비업 종류·도로명/지번 주소·위경도·등록일·면적·영업상태(영업·휴업·폐업)와 휴·폐업 일자, 운영시간, 관리기관 연락처를 포함한다. 운전자가 우리 동네에서 지금 영업 중인 정비업체가 어디인지 찾거나, 분석가가 시군별 정비업체 분포와 신규·폐업 추이를 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업체명 매칭이나 위경도 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 자동차정비업체 현황 데이터는 경기도 내에서 운영되는 자동차 정비업체의 등록 및 운영 정보를 포함하며, 자동차정비업체명, 정비업체종류, 소재지 주소(도로명·지번), 위도·경도 좌표, 사업등록일자, 면적, 영업상태(영업·폐업·휴업), 관리기관명 및 연락처, 데이터기준일자 등의 항목으로 구성되어 있습니다. 본 데이터는 자동차 정비업체의 분포와 운영 현황을 파악할 수 있어, 지역별 정비 인프라 접근성 평가, 차량 관리 서비스 수요 분석, 정비업종별 운영 특성 연구 등에 활용될 수 있습니다. 특히 영업상태 및 사업등록일자를 통해 신규 업체와 장기 운영 업체를 구분할 수 있으며, 위도·경도 좌표는 GIS 분석을 통한 정비업체 위치 시각화에 유용합니다. 이 데이터는 교통·자동차 관리 정책 수립, 자동차 정비 산업 현황 연구, 지역별 자동차 서비스망 강화 전략 마련 등에 기초 자료로 활용될 수 있습니다.
