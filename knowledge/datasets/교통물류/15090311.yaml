summary_user: 경기도 이천시에 허가된 화물자동차 운송주선사업 업체를 업체별 한 행으로 담은 파일 데이터로, 인허가일자·영업상태·업종구분·업체명·도로명주소·연락처·데이터기준일자를 포함한다. 화주나 물류 담당자가 "이 주선업체가 이천시에서 허가받아 지금도 영업 중인가"를 확인하거나, 이천시 내 주선업체 분포와 영업 상태를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 업체명·주소로 매칭해야 하며, 허가 여부의 기준 자료인 전국화물자동차운송사업자표준데이터와 대조해 쓴다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와는 업체명·주소 매칭으로만 연결되므로 동명 업체 오매칭에 주의해야 한다. 범위가 이천시 한 곳뿐이어서 다른 시군이나 전국 현황은 이 데이터로 알 수 없다.
