summary_user: 경기도 버스운송관리시스템(BMS)에 등록된 버스 운수사에 내려진 행정처분 이력을 처분 1건 단위로 담으며, 처분 번호(admdpstn_no)·업체 식별자·처분 일시로 구성된다. 교통행정 분석가나 시민이 어느 운수사가 얼마나 자주, 언제 행정처분을 받았는지 확인해 업체별 반복 위반 경향을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 같은 기관(경기도 BMS)의 업체 ID나 업체명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)을 통해 관리되는 버스 운수사에 대한 행정처분 이력으로, 행정처분이 내려진 일자와 관련 업체에 대한 식별정보를 포함하고 있습니다. 주요 항목으로는 ‘행정처분ID’, ‘업체ID’, ‘행정처분일시’가 있으며, 각 행정처분은 고유한 ID로 식별되며 특정 업체에 대해 특정 날짜에 행정처분이 이루어진 사실을 기록합니다. 본 데이터는 교통행정의 투명성과 공정성을 확보하기 위해 활용되며, 업체별 위반 경향 분석, 반복 위반 예방정책 수립, 운송사업자 신뢰도 평가, 안전운행 관리 등 다양한 공공 교통행정 업무에 기초자료로 활용될 수 있습니다.
