summary_user: 전국 버스정류장 227,065곳의 정류장번호·정류장명·위도·경도·도시를 한 행씩 담은 파일 데이터이며, 2025-10-31 하루 기준으로 수집된 정류장 원장이다. 지역 분석가나 앱 개발자가 우리 동네 정류장이 어디에 몇 개 있는지 지도에 찍어 확인하는 질문에 쓴다. 위도·경도 좌표 키로 다른 좌표 기반 데이터와 이어 쓰며, 도시코드·도시명 필드로 지자체별 집계를 할 수 있고, 노선이나 실시간 도착 데이터와 잇는 전용 키는 이 파일에 명시돼 있지 않다.
description_portal: 지자체 버스정보시스템(BIS)이 구축된 지자체 중 국가대중교통정보센터(TAGO)와 연계된 지자체의 특정일에 수집된 버스정류장 위치정보의 파일 데이터입니다.정류장번호, 정류장명, 위도, 경도, 정보수집일, 지자체 및 관리 지자체 등을 제공하고 있습니다.해당 정보는 직접 생성한 데이터가 아닌 각 지자체BIS로 부터 정보를 연계 받아 형태 등의 표준화를 통해 통합 제공 하고있습니다.정보를 수집한 일자(연1회)의 정보를 제공하고 있으며, 그 이후의 변동에 대해서는 반영되지 않은 데이터 입니다.
