description_portal: 대전광역시 자전거 보관소 현황 데이터는 대전광역시 도로관리시스템에 등재된 자전거보관소의 전체 정보를 포괄적으로 제공합니다. 이 데이터에는 각 자전거보관소의 명칭, 위치, 관리번호, 설치면적, 보관 가능 자전거 대수 등 주요 현황 정보가 담겨 있어, 대전시 내 자전거 인프라 분포도를 파악하는 데 큰 도움이 됩니다. 또한, 지역별 보관소 접근성과 분포, 이용 수요 및 자전거 교통 활성화 효과 확인, 도로 및 교통 인프라 사업의 연계성 분석 등 실무 및 정책 평가에 폭넓게 활용될 수 있습니다.※ 2022년 공공데이터 기업 매칭 지원사업으로 청년 인턴을 통해 구축·정비된 데이터입니다. 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
