summary_user: 경상남도 내 천연가스(CNG) 충전소를 시·군별로 한 행씩 정리한 목록으로, 충전소명·도시가스 공급사·위치를 담은 소규모 CSV 파일(약 1KB)이다. CNG 차량 운전자가 '우리 시·군에 CNG 충전소가 어디 있나'를 확인하거나, 지자체·공급사가 시군별 충전 인프라 분포를 점검하는 데 쓴다. 전역 조인 키가 없어 시군명으로 행정구역 자료와 이름 매칭하거나, 위치 주소를 지오코딩해 다른 충전소·교통 데이터와 겹쳐 쓴다.
description_portal: 2025년 7월을 기준으로 경상남도 내 천연가스(CNG) 충전소 현황은 시·군별로 충전소명, 운영 도시가스 공급사, 그리고 상세 위치를 항목별로 정리한 통계자료입니다. 이 자료는 CNG 차량 운전자들이 가까운 충전소를 확인하거나, 지방자치단체와 공급사가 충전 인프라 분포를 분석하여 서비스 개선과 안전관리 계획을 수립하는 데 활용됩니다. 최신 데이터는 한국가스안전공사가 관리하는 전국 충전소 목록과 경상남도에서 제공하는 지역별 설치 현황 데이터를 교차하여 구성되며, 데이터 기준일을 명확히 표기함
