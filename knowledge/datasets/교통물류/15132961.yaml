summary_user: PORT-MIS로 접수된 강제도선 면제 신청을 신청 1건 단위로 담은 전국 범위 원천 파일(csv, 약 56만 바이트)로, 선박명·총톤수·국적·선종·위험물 적재 여부, 관할기관, 면제 여부와 허가 유효기간, 신청 근거가 된 최근 입출항 사실(최대 4회)을 포함한다. 항만 운영기관이나 분석가가 '어느 관할기관에서 어떤 크기·선종의 선박이 도선 면제를 많이 신청하고 실제 허가받는가'를 확인하는 데 쓴다. 실측상 전역 조인 키가 없어, 선박 호출부호(호출부호)나 선박명·관할기관명을 이름 매핑해 Port-MIS 입출항 신고·선박 정보 데이터와 이어 쓴다.
