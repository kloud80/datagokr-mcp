description_portal: 이 데이터는 해양수산부의 해운항만물류정보시스템(PORT-MIS)을 통해 항만별로 도선사 탑승이 의무인 선박이 항만 시설에 이·접안할 때, 정해진 규칙에 따라 도선사 탑승 면제를 신청한 내역을 관리하기 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 항만별 강제 도선 면제 신청에 관한 구체적 정보를 포함하며, 선박 정보, 신청 일자, 면제 여부, 면제허가 유효기간 등으로 구성되어 있습니다.   본 데이터는 항만별 도선사 배치 및 운용 정책 검토, 항만 운영기관 업무 처리 현황 모니터링, 항만별 도선 면제 신청 실태 분석 등 항만 운영의 합리적 개선과 관련 정책 수립의 근거로 활용될 수 있습니다.
