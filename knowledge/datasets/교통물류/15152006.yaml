description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 전국공항을 운영하는 공공기관입니다.해당 데이터는 연도, 월, 국내/국제선 여부, 출도착, 여객(명), 지연(편), 합계지연시간(분), 평균지연시간(분) 으로 구성되어 있습니다.기간은 2017년부터 2025년 5월까지입니다.민간 보험사에서 요청한 자료로 항공기 도착 지연에 대한 여행자 보장 보험상품을 설계하기 위한 학습용 통계자료로 이루어져 있습니다.보험사 요청에 따라 2017년부터 2025년 5월까지 시간대별 항공기 출도착 지연시간으로 학습하기에 충분한 시계열과 전국공항의 단위이기에 범용성이 높고 신뢰성이 높은 데이터입니다.해당 데이터에 대한 문의사항 요청사항이 있으시면 02-2660-4807로 문의주시면 감사하겠습니다.
