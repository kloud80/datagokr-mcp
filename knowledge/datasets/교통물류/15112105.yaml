summary_user: 서울시 건물·시설에 설치된 차량 출입구를 출입구 한 곳당 한 행으로 담은 자료로, 시설 명칭, 위도·경도, 진입/진출 구분, 높이 제한, 요일·공휴일별 허용 시간, 국가지점번호, 출입구 사진 파일명을 포함한다. 화물차 기사나 물류·배송 사업자가 '이 건물 출입구의 높이 제한과 주말 진입 가능 시간은 어떻게 되나'를 확인하거나, 분석가가 시설별 차량 동선을 지도에 올릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 위도·경도 좌표, 국가지점번호(NTN_BRNCH_NO), 시설 명칭으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 서울시 차량 출입구 정보로, 건물과 시설에 설치된 차량 출입구의 위치와 특성을 정리한 자료입니다. 주요 항목에는 시설 아이디와 명칭, 출입구 아이디, 위도·경도 좌표, 출입구 구분(차량/보행), 출입 구분(진입/진출), 출입구 높이 제한 및 구조물 여부, 허용 차량 종류, 평일·주말·공휴일 허용 시간, 국가지점번호, 데이터 기준일자, 출입구 정면 및 원경 이미지 파일명 등이 포함되어 있습니다. 이 데이터는 건물 및 상업시설의 차량 접근성, 교통 흐름, 안전성 분석에 활용할 수 있으며, 특히 주차 관리, 도시 교통계획, 재난 대응 시 차량 동선 파악에 중요한 기초 자료로 기능합니다. 또한 시민 편의를 높이고 교통 혼잡을 완화하는 정책 수립에도 기여할 수 있습니다.
