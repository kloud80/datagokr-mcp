      - name: ROADROUTENM
        required: false
        example: ' 입면로'
        desc: ' 도로노선의방향구분'
      - name: ROADROUTEDRC
        required: false
        example: '1'
        desc: " '도로명주소법'에따라부여된도로명,건물번호로이루어진주소/도로명을기준으로하여건물에고유번호를붙인기본주소(상세주소는제외)"
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 5000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
