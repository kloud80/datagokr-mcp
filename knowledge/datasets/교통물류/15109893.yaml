summary_user: 전라남도 곡성군에 설치된 도로안전표지를 표지 한 건씩 담는 API로, 표지 일련번호·도로 종류·노선 번호와 노선명·노선 방향·도로명/지번 주소·위도·경도·표지 종류와 설명·관리기관·이미지명을 제공한다. 곡성군 도로를 다니는 운전자나 도로시설 분석가가 '특정 노선의 어느 지점에 어떤 안전표지가 세워져 있는가'를 확인하거나 표지 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표(LATITUDE, LONGITUDE)로 공간 결합하거나 노선 번호·노선명을 이름으로 맞춰 이어 쓴다.
description_portal: 도로안전표지일련번호, 도로종류, 도로노선번호, 도로노선명 등의 도로안전표지 데이터 정보를 제공하는 전라남도 곡성군 도로안전표지 정보 데이터 조회 서비스
