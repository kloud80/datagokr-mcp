summary_user: 화성시 관내 공영주차장을 주차장(구간) 단위로 한 줄씩 담은 파일로, 구간 이름·전체 면수·장애인 면수·정기 면수·주소·재입장 시간·위도/경도를 담는다(약 13KB CSV). 시민이나 분석가가 "목적지 근처 화성시 공영주차장이 어디에 있고 몇 면인지, 재입장 시간은 얼마인지"를 확인하는 데 쓴다. 전역 조인 키는 없어서 전국주차장정보표준데이터 등과는 주차장 이름·주소 매칭이나 위도·경도 좌표 근접으로만 이어 쓴다.
description_portal: 본 데이터는 화성시 관내 공영주차장의 위치와 시설 현황을 시민에게 정확하게 안내하기 위해 구축된 정보이다. 구간명, 주차면수, 주소, 재입장 시간 등을 포함하여 각 주차장의 규모, 이용 가능성, 접근 편의성을 종합적으로 확인할 수 있도록 구성하였다. 이용자는 목적지 인근의 주차 공간을 사전에 파악하여 이동 동선을 최적화할 수 있으며, 공공시설 이용 및 지역 내 교통 흐름 개선에도 기여한다. 또한 주차 수요가 높은 지역의 현황 정보를 제공함으로써 효율적인 주차 선택과 혼잡 분산을 유도하고, 대중교통 및 생활권 접근성을 높여 시민 편익을 증진하는 데 목적이 있다. 자세한 정보를 원하는 경우 https://smartparking.hscity.go.kr/Main으로 방문해주시기 바랍니다.
