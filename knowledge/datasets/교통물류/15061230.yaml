summary_user: 서울시 녹색교통지역(한양도성 내부) 자동차통행관리 통합플랫폼에 설치된 시설물을 지점별로 한 행씩 담는 목록으로, 지점명·주소·위경도와 시설물 유형(단속카메라, VMS 확인용 CCTV, VMS 전광판)을 함께 제공한다. 녹색교통지역 운행 제한 단속카메라가 어디에 있는지 확인하려는 운전자나, 단속·안내 시설 배치를 지도에 올려 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지점명·주소 매칭이나 위경도 기반 공간 결합으로만 이어 쓴다.
description_portal: '해당 데이터는 서울특별시 녹색교통지역 자동차통행관리 통합플랫폼 시설물 정보입니다. 일련번호,지점 아이디,지점 명,시설물 주소,시설물 위도,시설물 경도,시설물 유형,갱신일자 등의 정보를 제공합니다.*시설물 유형코드 정보(A : 단속카메라, C : VMS확인용 CCTV, V : VMS전광판)원본시스템은 바로녹색결제(https://oksign.seoul.go.kr)입니다. 데이터 제공부서는 교통실 교통기획관 미래첨단교통과입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
