summary_user: 경기도 도로대장 전산화 시스템에 등록된 배수암거·배수관 구조물을 노선·구간별 시설 단위로 담은 건별 원천 데이터로, 위치, 규격(가로·세로·직경), 연장, 관·면벽 재질, 좌우 날개벽·집수정 정보와 경도·위도를 포함한다. 도로 관리자나 방재 분석가가 '이 노선 구간에 어떤 규격의 배수관이 몇 개 있고 지도상 어디에 분포하는가'를 확인해 배수 설계나 침수 취약 구간 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선번호·구간번호를 이름 매핑해 같은 경기도 도로대장 데이터와 맞추거나, 경도·위도로 표준노드링크 같은 도로망 공간자료와 공간 결합해 쓴다.
description_portal: "이 데이터는 경기도 도로대장전산화시스템에서 수집된 배수암거 및 배수관에 대한 구조물 정보를 담고 있으며, 도로 구간별로 설치된 배수시설의 위치, 규격(가로, 세로, 직경), 연장, 재질(관, 면벽), 날개벽 유무, 집수정 여부 등의 세부사항으로 구성되어 있습니다. 주요 항목으로는 '노선번호', '구간번호', '위치', '규격-가로', '규격-세로', '규격-직경', '연장', '재질-관', '재질-면벽', '날개벽-좌', '날개벽-우', '집수정-좌', '집수정-우', '비고', '공간경도', '공간위도'가 있으며, 도로 배수 설계, 유지보수 계획 수립, 재해 예방 인프라 분석, 공간정보 기반 배수시설 분포 분석 등에 활용될 수 있습니다. ※배수암거 : 배수로가 용수로나 도로 따위를 횡단할 때, 이들 밑에 물을 대거나 빼기 위하여 땅속이나 구조물 밑으로 낸 도랑"
