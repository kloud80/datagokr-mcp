summary_user: 한국교통안전공단이 실시한 운전적성정밀검사 중 신규검사의 수검 결과를 수검자 한 명(한 건)씩 담은 전국 단위 원천 파일로, 수검일·지사(검사장)·나이·성별과 속도예측·주의전환·정서안정 등 검사항목별 결과, 종합판정을 포함한다. 교통안전 분석가가 신규 여객자동차 운송사업 운전자 지원자의 연령대·성별·검사장별 종합판정 분포나 취약 검사항목을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지사명(검사장 이름)이나 수검일을 이름·날짜 기준으로 맞춰 붙여야 한다.
description_portal: '한국교통안전공단에서 실시하는 운전적성정밀검사(신규검사) 결과 현황 정보를 제공합니다.[데이터 설명]* 일자, 지역본부(검사장), 나이, 성별, 검사항목 등[수검대상구분]* 신규검사 : 신규로 여객자동차 운송사업용 자동차를 운전하려는 자 등- 이는 이해를 돕기위한 간략한 설명으로, 상세기준은 법령정보 참고[검사장 및 도입시기 등]* 검사장 : 서울(성산, 노원, 송파), 경기남부, 경기북부, 인천, 대전세종충남, 홍성, 대구경북, 부산, 광주전남, 충북, 전북, 울산, 경남, 강원, 강릉, 제주, 상주, 이동1호, 이동2호* 이동1호/이동2호/홍성 : 신규검사 및 자격유지검사 2020년 시작'
