description_portal: 1. 해당 데이터는  고속열차 SRT의 연간 노선별 총 수송인원입니다. 2. 고속열차 SRT는 2016년 12월 6일부터 운행을 시작하였습니다. 3. 2023년부터는 경전선, 동해선, 전라선 신규 노선 확대에 따라서 해당 데이터에  수송인원 데이터를 추가합니다.* 해당 데이터는 연간 주기성 데이터입니다.* 2026년 4월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다. 데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.
