summary_user: 고속열차 SRT의 연간 수송인원을 노선별(경부선·호남선·경전선·동해선·전라선)과 전체 합계로 담은 연도 단위 집계 파일로, 466바이트 규모의 소형 CSV입니다. 철도·교통 분석가가 'SRT 개통 이후 노선별 이용객이 해마다 어떻게 늘었나'나 '신규 노선(경전·동해·전라선)이 전체 수송량에 얼마나 보탰나'를 볼 때 쓴다. 전역 조인 키가 없어 연도(구분)와 노선명을 기준으로 다른 철도 수송 통계나 같은 기관(에스알) 자료와 이름 매칭으로만 이어 쓴다.
