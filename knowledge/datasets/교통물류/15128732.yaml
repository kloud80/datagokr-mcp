summary_user: 전북특별자치도 남원시에서 영업 중인 이사화물 운송업체를 업체 한 곳당 한 행으로 담은 목록으로, 상호·화물 종류·우편번호·도로명/지번주소·전화번호를 포함하며 파일 크기는 685바이트 규모의 소량 CSV입니다. 남원시로 이사하거나 남원시에서 이사를 계획하는 시민이 "남원에 있는 이사업체 연락처와 위치가 어디인가"를 찾을 때, 또는 전입신고 안내 시 참고 목록으로 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞춰 연결해야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터와 업체명·주소로 대조하는 방식으로 이어 쓴다.
description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에서 영업 중인 이사화물 운송 서비스 제공 화물운송업체들의 상세 현황을 담고 있습니다. 시민들의 원활한 거주지 이전을 지원하고 행정 서비스를 개선하기 위해 구축되었으며, 전입신고와 연계된 시민 편의 증진이 주요 목적입니다. 각 업체의 기본 정보, 연락처, 위치 등을 포함하여 이사를 계획 중인 시민들이 신뢰할 만한 업체를 쉽고 빠르게 찾을 수 있도록 지원합니다.2. 데이터 항목명관리번호, 화물의종류명, 상호(업체명), 우편번호, 도로명주소, 지번주소, 전화번호3. 기대 효과이사업체 정보 공개를 통해 시민들의 서비스 선택권을 확대하고 투명한 시장 환경을 조성할 수 있습니다. 또한 전입신고 등 주민 이전 관련 행정업무 처리 시 중요한 참고자료로 활용되어 전반적인 민원 서비스 품질 향상에 크게 기여할 것으로 기대됩니다.
