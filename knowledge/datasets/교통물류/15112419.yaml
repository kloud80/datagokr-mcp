description_portal: 이 데이터는 의왕시 소속 기관에서 보유하고 있는 차량 중 전기차의 현황을 정리한 자료입니다. 항목은 기관명, 차명, 전기차 여부로 구성되어 있으며, 공공부문에서 운영 중인 차량 중 친환경차량이 어느 정도 도입되어 있는지를 파악할 수 있습니다. 이를 통해 행정기관의 친환경 정책 실천 정도나 전기차 전환 추이를 확인할 수 있으며, 각 기관별 도입 현황 비교 및 탄소배출 저감 노력 분석에도 활용할 수 있습니다. 공공차량의 전기차 도입은 도시의 온실가스 감축과 지속가능한 교통체계 구축에 중요한 지표로 작용하며, 시민에게는 행정기관의 에너지 전환 노력을 보여주는 유용한 정보가 됩니다. 향후 전기차 확대 정책의 기초자료로서 의미 있는 공공데이터입니다.
