summary_user: 한국철도공사가 운영하는 화차의 계중 측정(발송역별 편성 화차 수·총중량, 개별 화차의 차륜별 중량·좌우·선후 균형·이동 속도·초과 제한값), 화차 사용요금·실제 사용 구간, 유치요금, 예약번호별 적재 내역을 담은 전국 단위 건별 운영 파일(zip 약 7.5MB)이다. 철도 화물 분석가나 물류 정책 연구자가 '어느 발송역에서 출발한 화차가 중량·균형 제한값을 넘겨 측정됐는가', '고객별 화차 사용 일수와 요금은 어떻게 나타나는가' 같은 질문에 쓴다. 파일 안의 표들은 화차번호·열차번호·발송역명으로 서로 맞춰 볼 수 있지만, 다른 데이터와 잇는 전역 조인 키는 없어 역 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 한국철도공사의 화차 운영 전반에 걸친 계량, 사용, 요금 관리 이력을 제공하는 종합 화물 운송 데이터입니다. "화차계중측정" 데이터는 발송역별 열차 편성 시점의 전체 화차 수와 총 계중량을 기록하며, "화차계중측정내역" 데이터는 개별 화차의 차축별 중량, 좌우·선후 균형 비율, 이동 속도, 초과중량 및 속도 제한값 등 정밀한 계중 측정 데이터를 제공합니다. "화차사용요금내역" 데이터는 고객별·월별 화차 사용 일수, 불량 일수, 사용 금액 및 부가세를 집계하고, "화차실제사용내역" 데이터는 개별 사용 구간의 시작·종료 일자와 실제 사용 일수 및 요금을 상세히 기록합니다. "화차유치요금" 데이터는 화차의 적하 통지부터 완료까지의 유치 시간과 시간당 요금 단가를 산출하며, "화차적재" 데이터는 예약번호별 화차 차종, 적재 중량, 발착역, 적재 완료 일시, 컨테이너 적재 여부 등 화물 적재 전 과정을 추적합니다. 이 통합 데이터는 화차 과적 방지 및 안전 관리, 노선별 화물 운송량 분석, 고객별 화차 사용 패턴 및 요금 정산 검증, 유치 시간 최적화를 통한 운영 효율성 개선, 화물 운송 수요 예측 및 화차 배치 전략 수립, 철도 화물 물류 정책 연구 등에 필수적인 운영 데이터로 활용됩니다.
