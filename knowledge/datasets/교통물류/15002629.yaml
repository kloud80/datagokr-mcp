summary_user: 한국공항공사가 운영하는 공항(인천국제공항 제외)을 이용한 여객 실적을 연도·항공사·노선·정기/부정기 구분별로 도착여객수와 출발여객수로 집계한 통계 파일입니다(csv 약 8KB, 전국 범위). 분석가가 특정 항공사의 어느 노선에서 여객이 얼마나 오갔는지 확인해 지역 관광·출장 수요를 가늠할 때 쓴다. 공통 조인 키가 없어 다른 항공통계(공항·노선별 운항·화물 실적 등)와는 항공사명·노선명을 이름으로 맞춰 연결해야 한다.
