summary_user: 한국도로공사가 산정한 2010~2014년 전국 고속도로 통행시간 비용 지표를 집계년월·차량 3종 분류·주행목적(업무·비업무 등)·상수값 제공기관별 금액(통행시간비용금액)으로 담은 집계 파일이며, 공간 단위 없이 전국 단일 범위다. 도로 투자 타당성 평가나 정체 비용을 추정하는 분석가가 '차종·통행목적별로 시간 1단위의 경제적 가치를 얼마로 잡아야 하나'라는 질문에 원단위 상수로 쓴다. 실측 컬럼에 링크·노선 같은 전역 조인 키가 없어, 통행량·평균속도 자료와는 집계년월과 차종·주행목적 코드의 이름 매핑으로만 붙여 쓴다.
limits: 구간·노선·링크 단위 값이 아니라 전국 단위 상수값이므로 특정 고속도로 구간의 통행비용을 직접 볼 수 없다. 표준노드링크 등 공간 데이터와 바로 조인되는 키가 없어 코드·이름 매핑이 필요하다.
