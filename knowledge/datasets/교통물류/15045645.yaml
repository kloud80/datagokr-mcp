description_portal: 본 데이터는 한국도로공사에서 2010년부터 2014년까지 수집한 전국 고속도로의 통행시간 비용 정보를 제공한다. 통행시간 비용이란 일정 거리 구간을 주행하는 데 소요되는 시간에 운전자 인건비, 차량운행비 등을 반영하여 산출한 경제적 가치를 의미한다.해당 자료는 연도별·노선별로 정리되어 있으며, 교통정체 해소, 인프라 투자 타당성 평가, 도로운영 정책 수립 등에 활용될 수 있다. 통행량과 평균속도 등 주요 교통지표와 연계하여 시간적·공간적 통행비용 변화를 분석할 수 있는 기반 자료로서, 정책결정자 및 연구자에게 유용한 참고자료로 활용된다. 자료는 CSV 형식으로 제공되며, 고속도로 구간별 통행시간 비용을 연도 단위로 조회할 수 있다.한국도로공사에서 제공하는 고속도로상의 통행시간 비용에 관한 지표정보 (2010년 ~ 2014년)(집계년월,차량3종분류구분코드,주행목적구분코드,주행목적구분명,상수값제공기관구분코드,상수값제공기관구분명,통행시간비용금액)
