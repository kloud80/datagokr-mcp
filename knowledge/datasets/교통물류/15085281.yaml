description_portal: '○ 통계개요* 통계명 : 도심지점별 교통량* 통계종류 : 서울시 도심지점별 교통량을 제공하는 일반ㆍ조사통계* 작성목적 : 서울시 주요 도로지점별 교통량을 조사하여, 도로의 건설, 유지관리 및도로 운영에 필요한 기본자료와 각종 연구에 필요한 기초자료를 제공하는것을 목적으로 함* 조사체계 : 서울특별시, 서울지방경찰청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 주요 도심지점별 교통량(차량검지기를 통해 조사된 1일양방향 전체 차량교통량) 현황 등○ 용어설명* 평균 일 교통량(ADT: Average Daily Traffic) : 조사기간의 총 교통량/조사일수* 도심지점 : 서울시내 도심 4대문안 유출입 지점교량지점 : 한강의 남북간 연결대교 지점시계지점 : 경기도와 시경계 유출입 지점간선도로지점 : 타 지점군에 속하지 않는 간선도로 지점○ 기 타* "..."은 도로에 매설되어 있는 교통량 측정기 Loop 검지기의 기능저하, 도로공사,사고, 자연파손 등의 이유로 측정불가한 경우임* 각 년도별 10월 특정주 평일의 교통량 평균의 합계로 해당년도 발표기준임(시계열 비교시 유의)'
