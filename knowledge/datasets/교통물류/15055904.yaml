summary_user: 광주광역시 시내버스의 공휴일 운행 시간표를 노선별로 담은 xlsx 파일(약 429KB)로, 회차·출발시간·출발지·배차간격·운행횟수가 들어 있는 시도 단위 계획 시간표이다. 공휴일에 특정 노선 첫차·막차가 언제이고 배차간격이 얼마인지 확인하려는 시민이나, 평일 대비 공휴일 운행 감축 정도를 비교하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 버스 노선·정류장 데이터와는 노선명을 이름으로 맞춰서만 이어 쓸 수 있다.
limits: 파싱된 첫 시트의 컬럼이 '순환01번 운행시간표(토요일)'와 이름 없는 열로 읽혀, 노선별 블록 형태의 표로 보이며 공휴일 시트인지 확인하고 별도 정리가 필요하다. 노선 ID 같은 조인 키가 없고, 시간표는 교통상황·운수사 사정으로 변경될 수 있어 실시간 도착 정보를 대신하지 못한다.
