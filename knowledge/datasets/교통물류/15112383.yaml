summary_user: 경기도 광주시청이 보유·임차한 관용차량을 한 대씩 기록하고, 차명·자동차등록번호·전기차 여부·소유/임차 구분·등록일을 담은 파일이다(약 5KB csv). 시민이나 정책 분석가가 "광주시 관용차 가운데 전기차는 몇 대이고, 언제 등록됐는가"처럼 공공부문 친환경차 전환 정도를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 시군의 관용차 현황 파일과는 기관명이나 차명을 맞춰 붙여 비교해야 한다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 관용차량 중 전기자동차의 현황을 정리한 자료입니다. 주요 제공 항목은 차량명, 차량번호, 전기차여부, 소유·임차 구분, 등록일 등으로 구성되어 있으며, 각 차량의 친환경 여부와 행정 목적의 운행 현황을 파악할 수 있습니다. 이 데이터는 광주시의 친환경 정책 추진 현황을 반영하며, 공공부문 전기차 보급률과 차량 관리 현황을 파악할 수 있습니다. 또한, 행정차량의 친환경 전환 현황을 시민에게 공개함으로써 지역 내 친환경 교통수단 도입 확대와 관련 정책 수립의 기초자료로 활용할 수 있습니다.
