summary_user: 성남시 불법주정차 단속용 CCTV를 설치 지점 한 곳당 한 행으로 담은 파일로, 관리번호·구·지번/도로명주소·위경도·설치일자·카메라 대수를 수록한다. 시민이나 분석가가 '우리 동네 어느 도로에 주정차 단속 카메라가 있고 언제 설치됐는가', '구별로 단속 카메라가 몰리거나 빈 구역은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소(도로명·지번)나 위경도 좌표를 공간 매칭해 주정차 단속 실적·교통사고 지점 같은 다른 위치 데이터와 이어 쓰고, 구 이름으로 행정구역 단위 집계와 맞춘다.
description_portal: 경기도 성남시 불법주정차 단속을 위해 설치된 CCTV의 현황을 정리한 자료입니다. 각 항목은 연번을 통해 구분되며, 관리번호는 행정적 관리 및 유지보수 과정에서 필요한 고유 식별 값으로 제공됩니다. 시·구 정보와 더불어 지번주소 및 도로명주소가 함께 수록되어 있어 위치 파악의 정확성을 높였으며, 설치일자를 통해 장비가 가동되기 시작한 시점을 확인할 수 있습니다. 또한 위도·경도 좌표가 포함되어 있어 지도 기반의 시각화 및 공간분석이 가능하고, 특정 구역별 단속 사각지대나 중복 설치 여부도 검토할 수 있습니다. 대수 항목은 설치된 카메라의 수량을 나타내어 단속 강도의 수준을 가늠할 수 있게 하며, 데이터기준일자를 통해 자료의 최신성과 신뢰성을 확인할 수 있습니다. 이 데이터는 성남시의 교통질서 유지, 불법주정차 관리, 시민 안전 확보를 위한 정책 수립과 행정적 의사결정에 활용될 수 있습니다.
