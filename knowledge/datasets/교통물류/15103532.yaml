description_portal: 본 데이터는 2015년식 대형 경유 시내버스가 하루 동안 실제 노선을 운행하며 기록한 고해상도 센서 데이터입니다. 이 데이터의 핵심 가치는 정류장마다 정차하고 출발하며, 도심 정체 구간에서 저속 주행과 공회전(Idle)을 반복하는 시내버스의 혹독하고 복합적인 운행 조건(Duty Cycle)을 상세히 보여준다는 데 있습니다.데이터는 차량의 위치 기반 정보와 엔진 중심의 내부 센서 정보로 구성됩니다. 위성항법장치(GPS)를 통한 위치, 속도, 가속도 정보는 버스의 노선별, 시간대별 운행 특성을 파악하는 기반이 됩니다. 특히 엔진 회전수(RPM), 엔진 부하율(Engine Load), 스로틀 개도량(Throttle Position), 냉각수 온도와 같은 엔진 관련 핵심 데이터는 차량의 연비 및 출력 효율, 엔진 내구성 등을 분석하는 데 결정적입니다.또한, 실시간 순간 연비 및 누적 연료 소모량 데이터는 운전자의 주행 습관(급가속, 급감속 등)이나 교통 체증이 버스 회사의 운영 비용에 미치는 영향을 직접적으로 보여줍니다. 함께 포함된 배터리 전압 정보는 잦은 시동과 전장 장치 사용이 많은 버스의 전기 계통 안정성을 진단하는 보조 지표로 활용됩니다.이 데이터는 운수업체의 효율적인 차량 관리, 정비 시점 예측, 운전자 경제운전 교육을 위한 기초 자료로 활용 가치가 높습니다. 나아가 도심 대기환경 개선을 위한 배출가스 저감 연구나, 교통 특성을 반영한 최적의 운행 스케줄링 등 다양한 공공 및 학술 연구에 필수적인 실증 자료로 사용될 수 있습니다.
