limits: 단일 차량·하루 운행 기록이어서 노선 전체나 버스 차종 전반의 대표값으로 일반화하기 어렵다. 실측 컬럼에 전역 조인 키가 없어 노선·정류장 원장과 바로 결합되지 않고, 좌표 매칭 같은 별도 작업이 필요하다.
