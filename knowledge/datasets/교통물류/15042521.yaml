summary_user: 성남시 안 어린이 보행안전 시설인 옐로카펫(횡단보도 대기공간 노란 시각유도선)의 설치 현황을 설치장소별로 담은 파일로, 장소마다 도로명·지번 주소, 설치개소 수, 설치연도, 관리기관 전화번호가 있다. 학부모나 학교·지자체 담당자가 '우리 아이 통학로 주변 횡단보도에 옐로카펫이 있는지, 언제 설치됐는지'를 확인하거나 연도별 설치 추이를 보는 데 쓴다. 전역 조인 키는 없어서 주소(설치도로명주소)를 기준으로 어린이보호구역·학교 위치 같은 다른 데이터와 이름·주소 매칭으로 잇는다.
description_portal: 성남시 내 어린이 보행안전을 위해 설치한 옐로카펫 설치 현황으로, 설치장소, 설치도로명(지번)주소, 설치개소 수, 설치연도, 관리기관 전화번호로 구성됨.성남시는 어린이 보행자 교통사고를 예방하고 안전한 통학 환경을 조성하기 위해 초등학교 주변 어린이보호구역을 중심으로 옐로카펫을 설치해오고 있다. 옐로카펫은 횡단보도 대기공간에 노란색 시각유도선을 설치함으로써 어린이의 안전대기 공간을 명확히 하고, 운전자에게도 주의 환기를 유도하는 효과가 있다. 성남시는 2025년 기준 총 설치 개소 수는 80여 곳에  이상에 이른다.
