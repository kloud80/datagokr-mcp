summary_user: 고속철도 운영기관(한국철도공사, 에스알)이 보유한 철도차량 대수를 기관·차량구분(고속·일반·도시철도)·차종(KTX, KTX이음, ITX새마을, 전기동차, 화차 등)별로 집계한 전국 단위 소규모 파일(CSV 약 610바이트)이다. 철도 분석가나 정책 담당자가 "코레일과 SR이 각각 KTX·ITX 같은 차종을 몇 대씩 보유하고 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 철도 데이터와는 기관명이나 차종 이름을 직접 맞춰서만 연결한다.
description_portal: '2026년 6월 기준 철도차량 보유현황(고속철도) : 고속철도 철도차량의 전반적인 데이터를 추줄이 가능합니다.이 데이터는 대한민국 전체 철도 중에 고속철도 운영기관의 철도차량 보유현황으로 철도운영사는 한국철도공사, 에스알로 구분되어 있고 차량구분은 고속철도, 일반철도, 도시철도로 구분되어 있습니다. 추가적으로 차량종류에는 KTX, KTX1산천, KTX2호남, KTX3SRT, KTX4원강, KTX이음, KTX청룡, ITX마음, ITX새마을, ITX청춘, 누리로, 객차, 디젤기관차, 발전차, 전기기관차, 화차, 전기동차가 있으며 각 차종의 보유량을 확인 할 수 있습니다.'
