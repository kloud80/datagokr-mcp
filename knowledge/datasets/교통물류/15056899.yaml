summary_user: 서울시 교통정보 시스템(TOPIS)의 교통량 이력을 지점번호·년월일·시간·유입유출 구분·차로번호별 교통량으로 제공하는 외부 OpenAPI이다. 상권·입지를 분석하는 사람이 특정 조사지점의 시간대별 교통량이 어떻게 달라지는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 잇는다.
