summary_user: TIMS(택시운행정보관리시스템)로 모은 일반택시 운행기록을 바탕으로 대전광역시 도로 링크별 평균 속도와 평균 통행량을 연간 단위로 집계해 담는다(zip 파일 약 1.36MB). 교통 분석가나 지자체 담당자가 '대전 시내 어느 도로가 통행량이 많고 속도가 느린가'를 판단할 때, 일반 차량 흐름의 대리 지표로 쓴다. 링크아이디와 도로명 필드가 있지만 실측에서 전역 조인 키로 확인되지 않아, 다른 도로·교통 데이터와는 링크 코드나 도로명을 직접 맞춰 이어 쓴다.
description_portal: 택시운행정보관리시스템(TIMS)로 전송되는 택시운행정보를 활용하여 대전광역시 도로별 일반택시 평균통행량 및 속도를 제시합니다.- 택시는 승객을 태우고 영업 시 빠른 경로로 목적지로 가려고 하기 때문에 실제 도로 상에 운행되는 일반 차량과 유사한 통행속도를 보입니다.- 또한, 출퇴근, 등하교 등의 첨두시간 내 통행량이 많아 도로 위 통행패턴을 보는데 유용합니다.- 그러므로, 통행분석, 주요 도로별 통행량 등을 판단하는데 유용하게 사용될 수 있습니다.- 해당 정보는 대전광역시의 동의를 얻어 대전광역시 내 도로별 일반택시 평균 통행량 및 속도를 연간 제공하고 있으며, 타지자체의 정보의 경우, 별도 협의가 필요합니다.
