summary_user: 충주시 광역버스정보시스템(BIS)에 등록된 버스 정류장을 한 행에 한 곳씩 담은 원천 목록으로, 정류장 순번·이름·설명과 위도·경도 좌표, 데이터 기준일이 들어 있다(CSV 약 130KB). 분석가나 교통행정 담당자가 '충주 시내에서 정류장이 드문 동네는 어디인가'처럼 정류장 분포와 버스 접근성을 지도 위에서 따질 때 쓴다. 전역 조인 키가 없어 다른 노선·도착 데이터와는 정류장명 매칭이나 같은 기관 자료끼리로만 잇고, 좌표를 써서 행정구역·인구 격자 같은 공간 데이터와 겹쳐 본다.
limits: 정류장 코드 같은 공통 키가 없어 국가 대중교통 정류장 데이터나 실시간 도착 정보와 바로 조인되지 않으며, 이름으로 맞출 때 동명 정류장에 주의해야 한다. 범위는 충주시 한 곳뿐이고 노선·도착·승하차 정보는 들어 있지 않다.
