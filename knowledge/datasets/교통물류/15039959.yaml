summary_user: SRT 역별로 2016년부터 2025년까지 연도별 연간 승차인원과 하차인원을 담은 집계 파일(csv, 약 3.6KB)로, 한 행이 한 역(구분)이고 연도별 승차·하차가 열로 펼쳐져 있다. 철도·지역 분석가가 '수서·동탄 같은 SRT 역의 연간 이용객이 연도별로 어떻게 변했는지, 2023년 노선 확대로 추가된 역의 수요는 어느 정도인지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 역 좌표·역 마스터 등 다른 데이터와는 역 이름 매핑으로만 이어 쓴다.
limits: 연간 합계만 있어 월·일·시간대별 수요나 구간(출발역-도착역) 이동은 알 수 없고, 값이 비어 있는 칸은 해당 역의 미운행 기간이라 0이 아닌 미집계로 해석해야 한다. 표준 역 코드가 없어 다른 데이터와 붙일 때 역 이름 표기 차이를 직접 맞춰야 한다.
