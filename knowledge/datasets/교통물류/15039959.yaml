description_portal: 1.고속열차 SRT의 연도별 역별 연간 승차인원과 하차인원 데이터입니다. 2.SRT는 2016년도 12월 9일부터 운행을 시작하였습니다. 3. 2023년 운행노선 확대에 따라 밀양, 진영, 창원, 중앙, 창원, 마산, 진주, 포항, 전주, 남원, 곡성, 구례구, 순천, 여천, 여수EXPO역의 여객착발정보 데이터를 추가합니다.* 해당 데이터는 연간 주기성 데이터입니다.* 2026년 4월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.* 데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다
