summary_user: CNG·수소 등 내압용기 검사소를 검사소 단위로 담은 샘플 파일로, 전국 범위에서 검사소명·구분·주소·전화번호·법정동코드와 경로·이동거리·검사량 같은 항목을 개별 주소 수준으로 담는다. 수소·CNG 차량 소유자나 운수사업자가 가까운 내압용기 검사소가 어디이고 연락처가 무엇인지 확인하거나, 분석가가 지역별 검사소 분포를 살펴보는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 다른 데이터와는 검사소명·주소 매칭이나 같은 기관(한국교통안전공단) 코드로만 이어 쓰며, 사이트법정동코드가 행정구역 코드와의 연결 후보가 된다.
limits: 샘플 파일(csv, 약 7KB)이라 전체 검사소나 전체 검사 실적을 대표한다고 보기 어렵다. 실측 컬럼에서 전역 조인 키를 찾지 못해 차량등록·검사 원장 등 다른 자료와 바로 결합되지 않는다.
