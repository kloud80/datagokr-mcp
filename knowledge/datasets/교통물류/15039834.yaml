summary_user: 경상남도 남해군의 자동차 등록 대수를 월말 기준(기준년월)으로 관용·자가용·영업용과 승용·승합·화물·특수 차종을 교차한 12개 항목별 누적 대수로 담은 시군 단위 집계 통계이며, 포털 설명상 2020년 1월부터 2025년 6월까지를 다룬다. 남해군의 자가용 승용차나 영업용 화물차가 몇 년 사이 얼마나 늘었는지, 용도별 차량 비중이 어떻게 바뀌는지를 보려는 지역 정책 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년월과 남해군이라는 지역명으로 맞춰 다른 시군 등록현황이나 인구 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '이 통계자료는 2020년 1월부터 2025년 6월까지 매월 말  기준 관·민·영업용 및 차종 구분을 세분화한 12개 항목별 누적 등록 대수를 제공합니다.o 관용승용 / 자가용승용 / 영업용승용: 행정기관, 일반 개인·법인, 택시 등 유상 여객 운송용 승용차 현황o 관용승합 / 자가용승합 / 영업용승합: 버스·밴 등 승합차를 용도별로 구분o 관용화물 / 자가용화물 / 영업용화물: 트럭·덤프 등 화물차 등록 대수o 관용특수 / 자가용특수 / 영업용특수: 소방차·구난차·레커 등 특수차량 현황모든 값은 해당 월 말일 기준 정수형 누적 대수로, 기간별 증감 추세 및 용도별 점유 비율 분석에 최적화되어 있습니다.'
