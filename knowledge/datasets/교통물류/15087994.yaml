description_portal: '- 2017년부터 2019년까지 65세 이상 연령별 교통사고 유형에 따라 사고건수, 사망자수, 부상자수 현황에 대한 데이터  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 접수/처리한 인피사고를 집계한 통계임- 교통사고분석시스템(taas.koroad.or.kr)의 데이터를 기반으로 함'
