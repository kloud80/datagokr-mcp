summary_user: 2017~2019년 전국 65세 이상 노인운전자가 낸 교통사고를 발생년도·사고유형·가해운전자 연령대별로 묶어 사고건수·사망자수·부상자수를 담은 집계 통계 파일이다(경찰 접수 인피사고 기준, 교통사고분석시스템 기반). 고령운전자 정책을 검토하는 분석가가 '연령이 높아질수록 차대사람·차대차·차량단독 중 어떤 사고유형 비중이 커지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 교통사고 통계와는 연도·사고유형·연령대 이름을 맞춰서만 이어 쓴다.
