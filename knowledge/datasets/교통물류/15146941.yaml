summary_user: 수원시가 사유지 일부를 도로로 지정하며 낸 도로지정공고를 공고 한 건당 한 행으로 담은 파일로, 공고번호·도로지정일·소유자·도로 길이와 폭·면적·편입면적·지정위치를 포함한다(csv 약 2KB 규모). 토지 소유자나 부동산 거래를 검토하는 사람이 특정 위치의 땅이 언제 얼마만큼 도로로 편입됐는지 확인하거나, 분석가가 수원시의 도로지정 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로지정위치(주소·지번) 문자열이나 관리기관명으로만 맞춰 이어 써야 한다.
description_portal: 수원시 도로지정공고 (공고번호, 도로지정일, 소유자, 도로길이, 도로폭, 도로면적, 공부면적, 편입면적, 도로지정위치정보 등 포함) 개방한 데이터입니다. 사유지 일부가 도로로 편입되기 때문에 누구나 열람이 가능 할 수 있게 공고를 하고 있습니다. 더 자세한 내용은 수원시 팔달구청(https://paldal.suwon.go.kr) 고시/공고에서 도로지정으로 검색하시면 각 공고문과 자세한 위치 사진 정보를 확인할 수 있습니다. 주민 재산권 보장을 위한 투명성를 확보하고 도로망 확충 현황, 도시계획 진행 상황을 파악할 수 있습니다.
