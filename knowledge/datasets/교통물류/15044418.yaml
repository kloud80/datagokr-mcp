summary_user: 서울교통공사 관할 1~8호선 역을 호선별 운행 순서대로 나열하고, 인접 역 사이 거리(역간거리, km)와 호선 시작역부터의 누계 거리(km)를 역 단위 행으로 담은 소용량 CSV 파일(약 6KB)이다. 두 역 사이 노선 거리를 계산하거나 역 간격이 촘촘한 구간을 찾으려는 분석가·연구자가 '이 호선에서 A역과 B역 사이는 몇 km인가' 같은 질문에 쓴다. 전역 조인 키가 없어서 역 좌표·승하차 인원 같은 다른 역 데이터와는 호선과 역명을 맞춰 매핑하는 방식으로만 연결한다.
description_portal: 서울교통공사_관할역 구간간의 거리 데이터 입니다. 호선별로 순서대로 1호선은 서울역을 시작으로 다음역 시청역과의 거리를 1.1km 로 호선간 누계 정보를 포함하고 있습니다.2호선은 시청역을 시작으로 다음역 을지로입구역과의 거리를 0.7km로 호선간 누계 정보를 포함하고 있습니다.3호선은 지축역을 시작으로 다음역 구파발역과의 거리를 1.5km로 호선간 누계 정보를 포함하고 있습니다.4호선은 불암산역을 시작으로 다음역 상계역과의 거리를 1.5km로 호선간 누계 정보를 포함하고 있습니다.5호선은 방화역을 시작으로 다음역 개화역과의 거리를 0.9km로 호선간 누계 정보를 포함하고 있습니다.
