summary_user: 수원시 안에 설치된 자전거 공기주입기를 설치 지점별로 한 행씩 담은 원천 목록으로, 설치위치·도로명/지번주소·위도·경도·개수·종류·관리 전화번호·담당부서를 포함한다(CSV 약 3.7KB). 자전거 이용자가 "지금 있는 곳에서 가장 가까운 공기주입기는 어디인가"를 찾거나, 지자체·분석가가 주입기 설치 분포를 지도에 올려 공백 지역을 확인하는 데 쓴다. 전역 조인 키는 없으므로 위도·경도나 주소를 기준으로 공공자전거 대여소·자전거도로 노선 같은 다른 자전거 시설 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 경기도 수원시 내 자전거 공기주입기(연번, 설치위치, 도로명주소, 지번주소, 위도, 경도, 개수, 종류, 관리기관 전화번호, 담당부서 등) 데이터입니다. 우리 동네 곳곳에 설치된 자전거 공기주입기 위치를 공유합니다. 가까운 곳에서 간단히 공기압을 보충하면 안전하게, 더 멀리, 더 편하게 이동할 수 있습니다. 출퇴근, 등하교, 운동, 여행 중에도 필요할 때 바로 이용해 보세요. 야간, 주말에 자전거점이 문을 닫아도 가까운 공기주입기 위치를 알면 긴급 복귀가 쉬워집니다. 자전거 이용 활성화 및 공공서비스 체감도를 상승할 수 있습니다.
