summary_user: 2024년도 3분기 개인택시면허 양수교육 접수 때 교육희망자별로 검증된 일반택시 운전경력을 건별로 담은 전국 단위 CSV 파일이며, 교육센터·유효성검증일·검증 시 경력·신청 교육과정이 함께 들어 있다. 개인택시 양수를 준비하는 운전자나 택시 정책 분석가가 "양수교육 신청자들은 법인택시 경력을 얼마나 쌓은 뒤 신청하는가"를 센터·과정별로 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 센터 이름이나 같은 기관(한국교통안전공단) 자료를 기준으로만 이어 쓴다.
description_portal: 2024년도 3분기 접수 시 교육희망자 별 일반택시운전경력 데이터이며, 교통안전체험교육센터 홈페이지 내 "마이페이지 - 지원지격 확인"에서 택시운전자격증 검증 시 "일반택시운전경력일"도 같이 검증이 됨에 따라 해당 데이터를 활용하여 추출함(단, 교육접수 요건은 "접수일 기준"이므로 교육 접수일 기준 일반택시운전경력은 실제 경력일과는 상이할 수 있음)
