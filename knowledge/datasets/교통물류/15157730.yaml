summary_user: 인천항 각 터미널의 혼잡 현황을 터미널 단위로 담은 API로, 터미널코드·터미널명과 함께 혼잡 상태(trafficStatus), 혼잡 시간, 자료 구분, 최초 작성일자를 XML로 제공한다. 화주나 운송업체가 "지금 인천항 어느 터미널이 붐벼서 반출입 시간을 조정해야 하나"를 판단할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 터미널코드·터미널명을 이름으로 맞추거나 인천항만공사의 다른 서비스와 같은 기관 코드로만 잇는다.
description_portal: 해당 데이터는 인천항 터미널의 출항 정보를 담은 Open API 서비스에 대한 설명입니다. 주요 제공 항목에는 터미널 코드, 정박시간(trafficTime), ghswkqeh(traficStatus), 터미널명(termName), 자료구분(dataType), 최초 작성일자(regdate) 등이 있으며, 항만 교통 정보의 실시간 모니터링 및 물류 예측 시스템에 활용 될 수 있습니다. 특히 각 항만 터미널의 선박 혼잡 상황과 출항 현황을 데이터로 수집하여 항만 운영사 및 화주, 운송업체 등의 의사결정에 기여 할 수 있도록 설계 되었습니다. 해당 Open API는 REST 방식을 호출하여 XML 방식으로 데이터를 제공하고 있습니다.
