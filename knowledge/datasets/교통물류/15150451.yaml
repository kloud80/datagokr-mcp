summary_user: TS-BIS(중소도시 버스정보시스템)의 버스 노선별 시간표를 노선 아이디·운행요일 단위로 담은 CSV 파일(약 43만 바이트)로, 일일운행횟수, 기점·종점의 첫차·막차 출발시각, 최소·최대 배차간격(분)을 포함한다. 지자체·연구기관·분석가가 "우리 지역 중소도시 버스 노선은 평일과 주말에 하루 몇 회 다니고 막차는 몇 시인가" 같은 질문이나 노선 개편 검토에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 TS-BIS의 노선·정류장 데이터와는 노선 아이디(같은 기관 코드)로만 이어 쓰고 다른 기관 데이터와는 노선명 등 이름 매핑이 필요하다.
limits: 다른 기관 데이터와 바로 붙일 공통 키가 없어 노선 아이디를 같은 기관 데이터 안에서만 연결해야 한다. 범위는 전국으로 표시되지만 위치 좌표가 없는 비공간 데이터라 지도 분석에는 별도 정류장·노선 데이터가 필요하다.
