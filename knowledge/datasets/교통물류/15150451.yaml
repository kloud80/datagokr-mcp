description_portal: '- 한국교통안전공단에서 운영하는 TS-BIS(버스정보시스템)는 중소도시 대중교통 이용자의 교통복지 향상과 교통정보 격차 개선을 위한 버스정보를 제공하고 있습니다.- 버스 노선 및 시간표 정보(노선아이디, 운행요일, 일일운행횟수, 기점첫차출발, 기점막차출발, 종점첫차출발, 종점막차출발, 배차간격 등)를 공개하고 있습니다.(2026년 7월 기준)- 데이터를 활용하여 학계, 연구기관, 지자체는 버스노선 개편, 대중교통 정보제공 알고리즘 고도화 및 정확성 향상, 노선 이탈률 감소 방안, 지역별 맞춤형 정보 제공 등 연구에 기여할 수 있습니다.-(운행요일은 0:비정기, 1:평일, 2:토요일, 3:공휴일, 4:매일 코딩 되어있고, 배차간격의 단위는 분임)'
