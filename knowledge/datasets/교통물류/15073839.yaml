summary_user: 공무원연금공단 본사(제주 서귀포시 서호동)와 서울상록회관(서울 강남구 역삼동) 두 건물의 부설 주차장 개방 현황을 건물별 한 행씩 담은 327바이트짜리 소형 CSV 파일로, 주소·개방날짜·미개방날짜·개방시간·요금·무료개방시간·명절 무료개방 여부를 담는다. 인근 주민이나 행사 주최자가 '이 공단 건물 주차장을 언제, 얼마에 쓸 수 있고 명절에는 무료인가'를 확인할 때 쓴다. 전역 조인 키가 없어 주소나 건물 이름으로 전국주차장정보표준데이터 등 공영·민간 주차장 정보와 맞춰 이어 쓴다.
description_portal: 공무원연금공단이 관리하고 있는 주차장 개방현황 관련 데이터로 본사(제주특별자치도 서귀포시 서호동)와 서울상록회관(서울특별시 강남구 역삼동) 건물의 주차장 주소와 개방날짜 및 미개방날짜, 개방시간, 이용요금, 무료개방시간, 명절무료개방유무 데이터를 제공하고 있습니다.유휴 공고자원을 지역사회와 공유하기 위하여 활용 현황을 제공하고 있으며, 행사를 계획하는 경우 지자체 및 인근지역 공공기관 공영 주차장과 민간 주차장 정보 등과 결합하여 사전에 주차공간을 확보하고 이용할 수 있습니다.
