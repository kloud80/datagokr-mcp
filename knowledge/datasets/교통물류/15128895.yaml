summary_user: 경기도 도로대장에 등록된 육교를 한 건씩 담은 원천 목록으로, 노선번호·구간번호·육교명, 시점과 종점, 주소, 연장, 구조 형식, 허용통행하중, 통행제한높이, 장애인편익시설과 부대시설의 종류·수량, 공사기간, 착공일·준공일, 시행청을 담는다. 지자체 시설 담당자나 분석가는 이 데이터로 '준공된 지 오래된 육교는 어디에 있고 장애인편익시설은 갖췄는가'를 확인해 정비 우선순위를 정한다. 실측 컬럼에는 전역 조인 키가 없다. 그래서 다른 도로대장 데이터와는 노선번호(route_no)·구간번호나 주소를 이름 기준으로 맞춰 연결하고, 표준노드링크와 바로 이어지는 링크·노드 ID는 없다.
description_portal: '이 데이터는 경기도 도로대장에 포함된 육교 정보를 제공하며, 노선번호, 구간번호, 육교명, 시점 및 종점, 주소, 연장, 형식, 허용통행하중, 통행제한높이, 장애인편익시설 종류 및 수량, 부대시설 종류 및 수량, 공사기간, 착공일, 준공일, 시행청 등으로 구성되어 있습니다. 주요 정보로는 각 육교의 위치와 길이, 구조 형식(예: 외팔보형, 인도교)이 있습니다. 이 데이터는 보행자 교통안전 확보 및 도시 구조물 유지관리, 시설물 개선 계획 수립 등에 활용할 수 있으며, 육교의 건설 시기나 구조적 특성을 바탕으로 노후도 평가 및 정비 우선순위 설정에도 유용하게 활용될 수 있습니다.'
