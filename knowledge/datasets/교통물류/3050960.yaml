summary_user: 한국철도공사의 운수수입을 여객·화물 등 사업 구분별 금액과 단위로 정리한 전국 단위 집계표이며, 건별 원천 자료가 아니라 xlsx 파일 한 개(약 10KB) 규모입니다. 정책 분석가나 연구자가 "코레일 수입에서 여객운임과 화물운임이 각각 얼마이고 비중은 어떤가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 명칭(여객·화물 등)을 이름으로 맞추거나 같은 기관의 다른 철도 통계와 나란히 놓고 비교하는 방식으로만 잇는다.
description_portal: '한국철도공사의 ‘운수수입실적’ 데이터는 한국철도공사가 수집·관리하여 제공하는 자료로, 기본적으로 ‘구분(여객, 화물 등)’, ‘수익(금액)’, ‘단위’의 항목으로 구성됩니다. 이 표는 특정 연도에 여객과 화물운송 등 각 철도사업 부문에서 발생한 수입(운임 등) 규모를 객관적으로 산출한 공식 통계자료다. 이를 통해 한국철도공사가 여객운임, 화물운임, 기타 영업 수입 등 항목별로 실제로 얼마의 운수수입을 확보했는지 알 수 있습니다.이 데이터를 분석하면 여객과 화물, 그리고 기타 운송 부문별 수입의 비중 변화, 연도별 수입 추이, 특정 시점의 수입 급감 또는 급증 현상, 주요 수입원이 어디인지 등 다양한 인사이트를 도출할 수 있습니다. 예를 들어, 여객수입이 큰 폭으로 늘어난다면 교통 수요 증가나 정책적 요금 조정, 노선 확대와 같은 외부 요인을 유추할 수 있습니다. 또한 PSO(공익서비스의무) 지원 등 정부 보조의 의존 규모, 화물 철도의 수송 비중과 수익성 동향, 철도산업의 수입 구조 변화(예: 고속철도 중심 구조의 강화) 등 산업·정책적 구조 변화를 파악하는 데도 활용할 수 있습니다.이 자료는 정부와 공공기관의 철도정책 수립, 운수업계 경영성과 분석, 요금·이용패턴 연구, 투자 타당성 평가, 경영혁신 또는 구조조정 정책 추진, 지역 및 도시계획(교통수요 예측), 학술연구나 정책 보고서 등 다양한 연구 및 실무분야에서 참고자료로 광범위하게 쓰입니다. 특히 철도산업의 경영성과 측정, 평균 운임 조정 효과, 노선별 서비스별 수입분석, 공공서비스 제공비용 산정 등 실증적·정량적 근거가 요구되는 보고서와 정책평가에서 활용도가 높습니다.'
