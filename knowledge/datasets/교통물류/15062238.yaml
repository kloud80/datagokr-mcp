summary_user: "고속도로 교통량 조사에서 쓰는 차종 분류 기준표로, 차종마다 구분·종별, 축수·단위 기준, 차종 정의, 해당 차량 예시를 담은 작은 CSV 파일(약 2KB)이다. 고속도로 교통량 통계를 보는 분석가나 도로 설계·정책 담당자가 '교통량 자료의 몇 종 차량이 실제로 어떤 차인가(예: 축수 기준으로 대형 화물차가 어디에 들어가는가)'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 한국도로공사 교통량 데이터의 차종 구분값과 이름(종별)으로 맞춰 해석용 코드표처럼 붙여 쓴다."
description_portal: 본 데이터는 고속도로 교통량 조사에 사용되는 차량 분류 기준 정보를 제공하는 자료이다. 한국도로공사에서 수집 및 관리하며, '구분', '종별', '분류기준', '차종정의', '해당차량 예시' 항목으로 구성되어 있다. 승용차, 버스, 화물차 등 다양한 차량 유형에 대한 명확한 분류기준을 제시함으로써 교통량 통계의 정확성을 높이고 데이터 분석의 신뢰성을 확보하는 데 목적이 있다. 해당 자료는 교통정책 수립, 도로설계, 통행량 분석, 혼잡도 예측 등 공공 및 민간 부문의 다양한 의사결정에 활용될 수 있다. 또한 고속도로 이용 차량의 구조와 운행 특성을 파악하기 위한 기초자료로서 기능한다.
