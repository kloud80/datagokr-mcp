description_portal: 항공사업법 제122조(초경량비행장치 신고), 제123조(초경량비행장치 변경신고 등)에 따라, 드론(초경량비행장치 중 무인비행장치에 한함)을 소유한 자는 신고를 해여야 하고, 한국교통안전공단은 같은법 제135조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.기체 신고 시 소유자정보, 종류, 모델, 최대이륙중량 등을 등록해야 하며, 현재 드론원스톱민원서비스(https://drone.onestop.go.kr)를 통해 해당 민원을 신청 및 처리할 수 있다.해당 자료는 최대이륙중량에 따라 드론 기체 신고 대상 여부가 결정됨에 따라 현 국내에 다수 판매되고 있는 기체 모델별 최대이륙중량을 나열하고 있다.
