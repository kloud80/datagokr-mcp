summary_user: 부산광역시 금정구 관내 불법주정차 단속을 건별로 담은 파일로, 단속 주체 부서명·단속일시·단속장소(주소)를 기록하며 포털 설명상 2025년 단속분이다. 금정구 주민이나 분석가가 "어느 거리·시간대에 주정차 단속이 몰리는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단속장소 주소를 이름 매핑하거나 같은 기관(금정구) 자료로만 이어 쓴다.
limits: 표준 행정코드나 좌표가 없어 지도 결합이나 타 시군구 자료와의 직접 조인이 어렵고, 단속장소 주소를 별도로 지오코딩·정제해야 한다. 범위는 금정구 한 곳뿐이라 부산 전체나 전국 비교에는 다른 구·군 파일을 따로 모아야 한다.
