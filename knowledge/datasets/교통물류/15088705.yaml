summary_user: 전국 기계식주차장이 설치된 건물별로 건물명, 도로명·지번 주소, 주차장 종류와 대수, 최종검사일자·검사결과, 관리인 배치 여부를 담은 건별 파일 데이터입니다(전국 범위, CSV 약 3.8MB). 우리 동네나 특정 건물의 기계식주차장이 최근 검사에서 어떤 결과를 받았는지, 관리인이 배치돼 있는지를 확인하려는 주민·건물 관리자·안전 분석가가 쓴다. 공통 조인 키나 코드가 없어 다른 데이터와는 주소(도로명·지번)나 건물명을 매칭해 잇는다. 주차장 위치·요금·면수는 전국주차장정보표준데이터와 주소 기준으로 대조해 붙인다.
limits: 포털 설명상 2021년 9월 기준으로 작성되었고, 설치·철거 행정권한이 지자체에 있어 이후 신규 설치나 철거가 반영되지 않았을 수 있다. 좌표가 없는 비공간 데이터이고 전역 조인 키도 없어, 지도 표시나 다른 데이터와 연계하려면 주소 정제·지오코딩이 필요하다.
