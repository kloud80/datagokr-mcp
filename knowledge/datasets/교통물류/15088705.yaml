description_portal: 한국교통안전공단에서 제공하는 정보입니다. 전국의 기계식주차장이 설치된 건물에 대한 정보를 취합하여 제공하고 있습니다. 도로명주소와 지번주소를 모두 제공하고 있으며, 최종검사일, 검사결과, 관리인 배치여부 등 안전 관련 정보도 함께 제공하고 있습니다.  해당 정보는 2021년 9월을 기준으로 작성된 데이터로 기계식주차장의 설치 및 철거에 대한 행정권한은 각 지방자치단체가 가지고 있어 신규설치 및 철거 내용이 반영되지 않은 경우가 존재할 수 있으니 이용에 참고하시기 바랍니다.
