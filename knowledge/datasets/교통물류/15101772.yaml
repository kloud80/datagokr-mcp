summary_user: 경기도 의왕시에 등록된 국제물류주선업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv, 약 1.8KB)로, 업체명·시군·소재지·사업여부·우편번호를 담는다. 수출입 업체나 물류 분석가가 "의왕시에서 영업 중인 국제물류주선업체는 어디이고 어디에 있나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 주소를 맞춰 붙여야 하며, 허가 여부 확인은 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
