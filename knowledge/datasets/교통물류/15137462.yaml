description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민소통 및 문화정보 데이터로, 도시철도 역사 공간에서 추진된 홍보캠페인 운영 현황 정보를 제공합니다. 데이터에는 역명, 일자, 시작시간 및 종료시간, 내·외부 활동 구분, 참여인원, 참여단체, 주요 추진사항, 세부내용 등의 주요 항목이 포함되어 있으며, 호선별·역별 시민 참여형 캠페인 운영 현황을 확인할 수 있습니다. 해당 데이터는 기관의 대시민 홍보활동 실적 관리, 캠페인 운영 현황 분석 및 유사 행사 기획을 위한 참고자료로 활용할 수 있습니다. 또한 참여단체와 활동 내용을 통해 도시철도 공간에서 이루어진 다양한 시민 소통 활동 현황을 파악할 수 있습니다. 본 데이터는 연 1회 갱신되며, 시민 참여 기반의 소통 활동 관리와 도시철도 서비스 개선을 위한 기초자료로 활용됩니다.'
