description_portal: '경기도 파주시 지능형교통체계(ITS) 운영을 위한 단거리전용통신(DSRC)에 관한 공공데이터로, 단거리전용통신 구간을 식별할 수 있는 고유아이디, 구간길이, 구간시작지점명, 구간종료지점명 등으로 구성되어 있습니다. 본 데이터셋은 DSRC 기지국 간 구간길이와 시작·종료지점 정보를 활용한 특정 도로구간의 통행 속도, 정체 발생 구간, 시간대별 교통량 변화의 정밀 분석, 스마트 교통 인프라 성능 평가, V2X(Vehicle-to-Everything) 기반 연구 개발, 교통 예측 및 시뮬레이션 모델 고도화, 도로 운영 정책 수립 지원, 도로 위험 구간 조기 탐지 연구, 차량 통신 기반 긴급차량 우선 신호 시스템 검증, 자율주행차 환경 구축 연구, 대중교통 서비스 품질 향상 분석, 스마트시티 교통 데이터 융합 분석 등에 활용될 수 있습니다.* 단거리전용통신(DSRC): 도로변에 설치된 노변 장치와 차량 내에 탑재된 차량 탑재 장치(예: 하이패스단말기) 간의 양방향 단거리 무선 통신'
