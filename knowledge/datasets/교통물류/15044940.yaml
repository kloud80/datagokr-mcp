description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민소통 및 문화정보 데이터로, 도시철도 이용 시민을 대상으로 운영하는 영화 무료 시사회 관련 정보를 제공합니다. 데이터에는 영화명, 상영관, 응모장소, 응모 시작일 및 종료일, 응모인원, 초청인원 등의 주요 항목이 포함되어 있으며, 시사회 운영 현황과 참여 규모를 확인할 수 있는 자료입니다. 해당 데이터는 문화행사 운영 실적 분석, 참여 현황 파악 및 향후 시민 대상 문화 프로그램 운영 계획 수립 등에 활용할 수 있습니다. 또한 영화별 상영 정보와 응모 관련 정보를 제공하여 시민 안내 및 행사 운영 관리 자료로 활용할 수 있습니다. 본 데이터는 자료 변경 시 갱신되며, 도시철도 이용 시민의 문화 향유 기회 확대와 시민 소통 활성화를 위한 기초자료로 활용됩니다.'
