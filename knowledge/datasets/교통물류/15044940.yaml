summary_user: 대구교통공사가 도시철도 이용 시민을 대상으로 연 영화 무료 시사회를 행사 한 건씩 담은 파일(csv 약 12KB)로, 일정·영화명·장르·상영관·응모장소·응모 시작일과 종료일·응모인원·초청인원을 기록한다. 시사회 담당자나 분석가가 "어떤 영화·장르의 시사회에 응모가 많이 몰렸고 초청 대비 경쟁이 얼마나 됐나"를 따져 다음 시민 문화행사를 계획하는 데 쓴다. 다른 데이터와 맞물릴 전역 조인 키나 코드표는 없어서, 연결하려면 영화명·상영관 같은 이름을 맞추거나 같은 기관(대구교통공사) 자료끼리 묶어야 한다.
