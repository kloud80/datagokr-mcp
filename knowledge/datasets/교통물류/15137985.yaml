summary_user: 여수시 주요 도로에 설치된 CCTV를 대당 한 건씩, 관리번호·설치 위치명·주소·좌표와 HLS 실시간 영상 스트리밍 주소로 담는 원천 목록이다. 운전자나 교통 분석가가 '지금 여수 특정 교차로 일대가 막히는지 영상으로 확인할 수 있나'를 묻거나, 지도 서비스 개발자가 위치별 CCTV 영상을 띄우는 데 쓴다. 전역 조인 키는 없어서 설치 주소·좌표(x_crdn, y_crdn)로 다른 도로·소통 데이터와 공간 매칭하거나 같은 기관 코드로만 연결한다.
description_portal: 전라남도 여수시의 주요 도로에 설치된 실시간 CCTV 영상주소를 조회하여 실시간 교통 상황 모니터링이 가능한  API입니다.영상은 HLS(HTTP Live Streaming) 방식으로 제공되며 재생을 위해서는 VLC 플레이어, 팟플레이어 등 별도의 영상 플레이어가 필요합니다.
