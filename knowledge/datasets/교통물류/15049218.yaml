summary_user: 인천광역시 교통행정종합관리시스템의 결산 자료 중 이월 내역을 자치단체코드·기준년도·회계연도별로 집계해 이월금액과 이월건수를 담은 파일이며, 실측 파일 크기가 176바이트에 불과한 소량 집계표다. 교통 분야 재정을 보는 분석가가 인천시 교통행정 예산이 회계연도마다 얼마나, 몇 건 다음 해로 넘어갔는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 자치단체코드나 연도를 기준으로 같은 기관의 자료에만 맞춰 붙인다.
