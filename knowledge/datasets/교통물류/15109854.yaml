summary_user: 대전광역시 유성구 안의 공영·민영 주차장을 주차장 한 곳당 한 행으로 담은 파일로, 주소·좌표, 총·법정 주차구획 수, 장애인·경차·전기차 등 전용구획 수, 운영시간, 기본·추가·월정기 요금, 소유·운영주체를 포함한다(CSV 약 4MB). 유성구에서 일반인에게 개방된 주차장 가운데 전기차 충전기가 있는 곳의 운영시간과 요금을 확인하거나, 동네별 주차면 공급을 비교하는 분석에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 전국주차장정보표준데이터나 지자체 실시간 주차 API와는 주차장명·주소 매칭이나 같은 기관의 관리번호(고유번호)로만 이어 쓴다.
description_portal: '대전광역시 유성구의 주차장(공영+민영)에 대한 데이터를 제공합니다.해당 데이터는 고유번호(관리번호), 건물명, 허가일자, 사용검사일자, 주차장명, 주차장구분, 주차장유형, 주차시설형태, 도로명주소, 지번주소, 총주차구획(면)수, 법정주차구획(면)수 등의 항목을 포함합니다.해당 데이터는 지역별 주차 인프라와 이용 편의성을 분석하는 데 활용할 수 있습니다.또한 생활 편의시설 관리, 스마트 교통서비스 구축 등에 활용이 가능합니다.이 외에도 내비게이션 및 주차 정보 서비스 개발, 시각화 콘텐츠 제작 등 다양한 분야에 활용할 수 있습니다.사용좌표계: EPSG 4326'
