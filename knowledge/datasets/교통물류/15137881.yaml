summary_user: 아산시 버스정보시스템(BIS)의 노드(정류장 등)를 한 건씩 담은 원장으로, 노드ID·노드명·단축명, 위도·경도, 출발·도착 감지반경, 사용여부, 데이터 기준일을 담는다(CSV 약 598KB). 아산시 정류장 위치를 지도에 표시하거나 '이 정류장의 좌표와 현재 사용 여부는 무엇인가'를 확인하려는 시민·분석가가 쓴다. 전역 조인 키는 없어 같은 기관(아산시)의 노선·정류장 순번 데이터와 노드ID 또는 정류장 이름으로 맞춰 연결하고, 다른 기관 데이터와는 위도·경도로 공간 결합한다.
description_portal: 2024년 중장기 개방계획에 의한 테이블 개방정보로서 BIS노드 테이블 외 1개 테이블을 JOIN하여 개방함. 충청남도 아산시에서 제공하는 버스 노드정보 데이터는 아산시 관내를 운행하는 시내버스 노선과 그 노선상 정류장들의 순서를 구조적으로 보여주는 자료입니다. 이 데이터는 버스 노선을 식별할 수 있는 노선번호와 노선명, 노선의 그룹을 구분하는 그룹번호가 포함되어 있으며, 각 노선에 속한 정류장은 정류장순번으로 표시되어 노선의 기점부터 종점까지 정류장이 어떤 순서로 이어지는지를 확인할 수 있습니다.정류장 간 거리 정보를 담고 있는 노선길이와 기점부터 해당 정류장까지의 누적 거리를 나타내는 노선누적길이는 버스 노선 내 구간별 특성을 이해하는 데 유용합니다. 또한 노선 전체의 길이를 알려주는 전체노선길이를 통해 해당 노선의 운행 규모를 쉽게 파악할 수 있습니다. 출발정류장번호와 도착정류장번호는 노선의 시작점과 종점을 명확히 알려주며, 정류장 정보 데이터와 결합할 경우 실제 정류장 이름이나 위치를 알 수 있습니다.이외에도 노선의 특성을 설명하는 노선설명과 노선정보설명, 버스가 어느 정도 간격으로 운행되는지를 나타내는 배차간격 정보가 함께 제공되어 시민들이 버스 이용 편의를 예상하는 데 도움을 줍니다. 회차여부와 회차지순번은 노선이 단순 직선형인지, 왕복 운행을 하는지 여부와 회차 지점이 어디인지를 확인할 수 있게 해줍니다.다만 이 데이터는 정류장의 위도·경도 좌표가 포함되어 있지 않기 때문에 지도 기반의 위치 분석을 위해서는 별도의 정류장 위치 데이터와 함께 활용해야 하며, 배차간격 정보 역시 요일이나 시간대별 차이를 반영하지 않을 수 있습니다. 또한 데이터가 연 1회 주기로 갱신되기 때문에, 최근 노선 변경이나 정류장 신설·폐지와 같은 최신 현황은 실시간 반영되지 않을 수 있습니다.
