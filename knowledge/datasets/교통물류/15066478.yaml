summary_user: 철도지역과 열차 안에서 철도특별사법경찰이 단속하는 위반행위별 처벌 기준을 담은 소규모 기준표 파일(csv, 약 3.8KB)로, 경범죄처벌법 위반(음주소란 등 52개)과 철도안전법 위반(열차 내 흡연 등 23개, 주로 과태료)을 구분해 위반 횟수별(1차·2차·3회) 납부·과태료 금액을 행 단위로 담는다. 철도 이용객이나 안내 서비스 개발자가 '열차 안에서 담배를 피우면 처음 걸렸을 때 얼마를 내고, 또 걸리면 얼마로 오르나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위반행위 이름을 직접 맞추는 방식으로만 연결되며, 역·노선 같은 공간 정보와는 바로 이어지지 않는다.
