summary_user: 경강선 도시광역철도역의 역별 위치를 한 행씩 담은 원천 파일로, 운영기관명·노선명·역명과 십진수 도(DD) 형식의 경도·위도를 담는다(csv 517바이트 규모). 분석가가 경강선 각 역 반경 안에 주택·상가가 몇 곳인지 따지는 역세권 판정이나, 역 위치를 지도에 표시하는 데 쓴다. 전역 공통 조인 키는 없어서 다른 데이터와는 역명·노선명을 매칭하거나 좌표로 공간 결합해 잇는다.
description_portal: 경강선에서 운영하는 도시광역철도역들의 역위치에 대한 파일데이터로 철도운영기관명, 선명, 역명, 경도, 위도 항목이 있습니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
