summary_user: 고속도로 영업소별로 폐쇄식 요금 체계에서 진입한 차량의 통행량을 2023·2024·2025년 연도별 열로 집계한 전국 단위 파일(CSV 약 12KB)입니다. 교통 분석가나 정책 담당자가 '어느 영업소의 이용 차량이 최근 3년간 늘거나 줄었는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 영업소 이름을 기준으로 같은 기관의 다른 고속도로 데이터(영업소 위치·교통량 등)와 이름 매칭으로만 잇는다.
description_portal: 본 데이터는 한국도로공사에서 관리하던 고속도로 영업소를 통과한 차량의 폐쇄형 통행정보를 포함한다. 폐쇄식 톨링 시스템에 따라 차량이 진입한 영업소의 연도별 통행량 등을 포함하고 있다. 이 데이터는 고속도로 이용 행태 분석, 통행 패턴 예측, 구간별 교통량 산출 등에 활용될 수 있으며, 정책 수립 및 교통 계획 수립 시 유용한 기초자료로 사용된다. 특히, 특정 노선의 혼잡도 분석이나 요금제 설계, ITS 기반 서비스 개선 등 다양한 방면에서 공공 및 민간 활용이 가능하다. 또한 통계 기반의 교통 흐름 관리와 고속도로 운영 전략 수립에도 기여할 수 있는 실효성 있는 공공데이터이다.
