summary_user: 서울특별시 소재 화물자동차 주선업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 면허번호·업종명·사업자구분·업체명·주사무소 주소·팩스번호·관할관청·면허상태를 담는다. 화주나 물류 담당자가 "거래하려는 주선업체가 서울에서 면허를 받아 현재 유효한 상태인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭으로만 잇고, 전국 단위 허가 여부는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: '서울특별시 소재 화물자동차 주선업체 목록으로 면허번호, 업종명, 사업자구분, 업체명, 주사무소 우편번호, 주사무소 주소, 주 사무소 상세주소, 팩스번호, 관할관청, 면허상태를 제공합니다.*용어설명- 화물자동차 주선사업은 화주(화물 의뢰인)와 운송사업자(화물차 기사·운송사) 사이에서 운송을 알선(매칭)하고 수수료를 받는 업을 말합니다. 직접 차량으로 운송을 수행하는 “운송사업”과 구분됩니다.- 주요 역할주요 역할물량 확보·배차: 화물 특성(품목·톤수·적재방식·온도·ADR 여부)에 맞는 차량 섭외운임 협상·계약서: 운임·하차 대기료·파손·지연 책임 등 조건 확정운송 관리: 상·하차 일정 공유, 실시간 위치·이슈 대응, 증빙 수집(인수증, CMR 등)정산: 운임·할증·추가비용(대기료, 반품) 계산·지급 및 수수료 청구리스크 관리: 사고·파손 시 보험 처리, 운송사 자격·차량 적법성 확인'
