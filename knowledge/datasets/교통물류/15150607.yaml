summary_user: 한국농어촌공사가 관리하는 전국 농수로의 제원 정보를 시설별로 담은 데이터로, 시설 코드·이름, 위치(경도·위도, 주소), 착공·준공 일자, 수로 폭·높이 등이 있다. 지자체 농업 기반시설 담당자나 재해 분석가가 우리 지역 농수로가 언제 지어졌고 규모가 어떤지 확인하고, 집중호우 때 점검할 노후 수로를 고르는 데 쓴다. 전역 조인 키가 확인되지 않아 다른 데이터와는 주소 코드(ADDR_CD)나 시설 이름을 매핑해 잇거나, 같은 기관이 제공하는 다른 데이터와 기관 코드로 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국농어촌공사에서 제공하고 있는 농수로 제원 관련 정보입니다.
