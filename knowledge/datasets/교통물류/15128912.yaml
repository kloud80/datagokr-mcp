summary_user: 국제해상위험물규칙(IMDG Code)에 실린 위험물을 유엔번호별로 한 행씩 정리한 기준표로, 한글·영문 정식운송품명, 위험 등급과 부위험성, 포장등급, 소량·극소량 기준, 용기·탱크 포장지침, 비상대응절차, 적재·격리 방법을 담는다(전국·비공간, CSV 약 673KB). 해운·물류 기업이 특정 위험물(유엔번호)을 컨테이너로 수출입할 때 어떤 포장 지침과 적재·격리 기준을 지켜야 하는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으며, 다른 위험물 화물 자료와는 유엔번호나 정식운송품명 매핑으로만 연결한다.
limits: 화물 반출입 건이나 물동량 같은 실제 운송 실적은 없고 규칙상 기준 정보만 담는다. 표준 조인 키가 없어 다른 데이터와 붙일 때는 유엔번호·품명을 직접 맞춰야 한다.
