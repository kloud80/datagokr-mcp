description_portal: 이 데이터는 해양수산부에서 수출입위험물안전관리시스템 운영을 위해 수집된 데이터입니다.  본 데이터의 주요 내용은 국제해상위험물규칙(IMDG Code) 정보로 구성되어 있으며, 화물의 위험 등급, 포장방법, 적재·운반 기준, 표기사항 등 수출입 위험물의 안전관리에 필요한 정보를 포함하고 있습니다.  본 데이터는 해운 및 물류 기업이 위험물 수출입 시 준수해야 할 안전 기준 확인이나 위험물 취급계획 수립, 화물 운송 과정에서의 법적 요구사항 검토, 관련 교육 자료 작성 등에 활용될 수 있습니다. 또한, 기관에서는 국제 기준에 부합하는 위험물 관련 정책 평가 및 규정 검토 자료로 사용할 수 있습니다.
