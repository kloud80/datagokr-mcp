status: active
summary_user: 고속버스·시외버스·도시철도 이용의 출발지-도착지(OD)별 통행건수와 통행시간을 운행연월 기준으로 담은 API 데이터이며, 범위는 전국 읍면동 단위다. 분석가나 지자체 담당자가 두 지역 사이에 버스·철도 통행이 얼마나 되는지, 지역 간 접근성이 어떤지 살필 때 쓴다. 출발·도착 시군구코드(sgg_cd)로 이 코드를 제공하는 다른 데이터와 이어 쓰며, 이 코드를 먼저 받아 필수 파라미터로 넘겨야 한다.
limits: 필수 파라미터인 출발·도착 시군구코드(dptre_sgg_cd, arvl_sgg_cd)는 다른 데이터에서 먼저 받아야 한다. 오퍼레이션 3개 중 일간·연간 2개는 최소 파라미터로 호출했을 때 응답이 없었고 1개만 실호출에 성공했으며, 검증 때 받은 건수는 2행이었다.
