description_portal: 광주교통공사에서 관리하는 도시광역철도역들의 철도운영기관명,선명,역명,출구번호,출구별 주요시설명,거리,주소 입니다.지하철 역의 출구 번호에 대한 주요건물(관공서, 학교, 병원, 종교시설, 아파트, 공원 등)시설 정보 등이 포함되어 있습니다. 지하철 출구 정보는 일반적으로 지도 앱이나 지하철 앱에서 역 이름과 함께 검색할 수 있으며, 각 출구의 번호와 연결된 도로 또는 건물 정보를 제공합니다. 또한, 지하철역의 바닥에 표시된 번호는 승객의 위치 파악을 돕는 객차와 문의 순서를 나타내며, 특정 지하철역의 경우 민간 건물과 연결된 출구는 해당 건물주가 관리하기도 합니다.
