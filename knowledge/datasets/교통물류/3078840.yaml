summary_user: 대구광역시 버스전용차로에 설치된 무인단속카메라를 카메라(설치장소) 한 곳당 한 행으로 담은 작은 파일(CSV 약 3KB)로, 설치장소·가로명·설치일·단속시행일·촬영 시간대(시작·끝 두 구간)·구간단속 시행일·기준일을 포함한다. 운전자나 사업자가 '대구 어느 도로 버스전용차로에서 몇 시에 단속 카메라가 찍는가'를 확인하거나, 분석가가 버스전용차로 단속 지점과 시행 시기를 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 가로명·설치장소 이름을 맞춰 연결해야 하며, 대구 버스 노선·정류장 자료와는 도로명 기준으로만 나란히 볼 수 있다.
limits: 표준 행정코드나 좌표 같은 조인 키가 없어 지도 표시나 다른 데이터와의 결합에는 이름 매칭이 필요하다. 대구광역시 한 곳만 다루므로 다른 시도의 버스전용차로 단속 현황은 알 수 없다.
