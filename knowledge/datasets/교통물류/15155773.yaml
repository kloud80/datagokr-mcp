summary_user: 부산광역시 자율주행버스의 운행 기록을 차량·단말기별 이벤트(운행시작·정류장 도착·정류장 출발·운행종료) 단위로 담으며, 각 기록에 위경도 좌표·속도·헤딩·노선번호·정류소 ID가 붙은 건별 원천 데이터이다. 교통 분석가나 시 담당자가 '자율주행버스가 정류장 사이를 얼마나 걸리고 어느 구간에서 속도가 떨어지는가'처럼 운행 효율과 배차를 따질 때 쓴다. 전역 조인 키는 없어 정류소 ID·노선번호를 부산 버스 정류장·노선 정보와 이름·코드로 맞춰 잇거나 위경도 좌표로 공간 결합한다.
description_portal: '이 데이터는 자율주행버스의 운행 기록을 수집한 정보입니다. 주요 항목으로는 운행 경로, 출발·도착, 속도, 정류소id 정보 등이 포함됩니다. 이를 통해 자율주행버스의 운행 효율성 분석, 배차 계획 최적화, 교통 연구, 모니터링 등에 활용할 수 있습니다.  (참고) logDate형식: 2025091610'
