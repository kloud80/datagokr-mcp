description_portal: '데이터 개요국내에 등록된 항공기의 세부 정보를 확인할 수 있는 공공데이터입니다.이 데이터는 민간 항공기 및 공공기관 보유 항공기를 포함하여 등록 항공기의 사업용도, 항공사(또는 소유주), 기종, 등록기호, 제작 일자, 등록일, 좌석 수, 최대이륙중량, 사용사업 종류, 도입 방식 등을 종합적으로 제공합니다. 항공기 운용현황, 기체 통계, 노후기체 관리 등 다양한 목적으로 활용 가능합니다.데이터 제공 항목사용사업 종류항공기사용사업, 소형항공기운송사업 등 운용 목적에 따른 분류소유자등록 항공기의 소유 항공사 또는 법인명등록기호국토교통부에서 부여한 고유 식별번호 (예: HL9301)기종항공기의 모델명 (예: BELL206B, MI-2 등)제작일련번호제조사 부여 고유 일련번호제작일자항공기 제작 완료 날짜기령현재 연도 기준 항공기의 경과 연수등록일자국토교통부에 등록된 날짜좌석 수해당 항공기의 탑승 가능 좌석 수최대이륙중량항공기의 최대 이륙 중량 (kg 또는 lbs 단위)기재 위치항공기의 등록 주소 또는 배치 위치 (예: 예천군 감천면)도입 형태구매, 임차 등 기체의 확보 방식활용 안내항공정책 및 규제 기반자료: 항공기 등록·운용 기준 마련 및 관리 정책 수립에 기초자료로 활용정비 및 감항관리: 항공기 기령, 제작일자, 기종별 등록정보를 기반으로 정비 주기 및 검사 대상 식별산업현황 분석: 항공사업자별 보유기체 현황 및 운영기종 파악을 통한 시장 규모 추정데이터 해석 시 유의사항등록기체에는 정비 중단기, 운항중지 기체도 포함될 수 있으므로 실제 운용현황과 차이가 있을 수 있음제작일자와 등록일자 사이에 큰 차이가 있을 수 있으므로 기령 분석 시 주의 필요최대이륙중량 단위가 혼재(kg/lbs)될 수 있으므로 정규화 작업 필요동일 항공사 명의로 등록된 기체라도 운항목적, 기종, 도입연도에 따라 다양하게 구성되어 있음'
