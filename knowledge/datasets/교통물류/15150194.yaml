description_portal: 한국교통안전공단에서 시행하는 안전관리교육의 시행장소에 대한 정보를 제공합니다. 안전관리교육은 20대 미만의 기계식주차장이 설치된 건물의 관리자가 의무적으로 수료해야 하는 교육입니다. 안전관리교육은 2024년 주차장법 개정으로 최초 시행되었으며, 해당 정보는 2025년 9월 12일 까지 한국교통안전공단에서 시행한 안전관리교육의 장소를 제공합니다. 데이터는 날짜별로 정리되어 있지 않으며, 날짜별로 교육 시행 장소을 확인하기 위해서는 한국교통안전공단에서 제공하는 "기계식주차장 안전관리교육 일정" 데이터와 복합적으로 확인하셔야 합니다.
