summary_user: 경기도 시군별 화물자동차운송주선사업 허가업체를 업체 한 곳당 한 행으로 담은 인허가 원장으로, 시군명·인허가일자·영업상태·업체명·도로명/지번주소·연락처·사업자등록번호·위경도 좌표를 포함한다. 화주나 운송사가 "이 주선업체가 허가받은 곳이고 지금도 영업 중인가"를 확인하거나, 분석가가 시군별 주선업체 분포를 지도에 올려 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·업체명·주소 같은 이름 매핑으로 이어야 하며, 전국 기준은 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 이 데이터는 경기도 내 화물자동차운송주선사업에 대한 시군별 인허가 현황을 정리한 자료로, 업체명 및 위치, 영업상태 등을 포함하고 있습니다. 주요 항목은 시군명, 인허가일자, 영업상태, 업종구분, 업체명, 도로명주소, 연락처, 위도·경도 좌표 등이 포함되어 있으며, 화물운송과 관련된 중개업체의 등록 현황을 확인할 수 있습니다. 이 데이터는 물류 유통망 분석, 지역별 물류 서비스 수요 평가, 인허가 관리 시스템 구축, 운송사업 실태 파악 등 다양한 행정 및 산업적 활용이 가능합니다. 특히 위경도 좌표가 포함되어 있어 위치 기반의 시각화나 GIS 분석에도 활용할 수 있습니다.
