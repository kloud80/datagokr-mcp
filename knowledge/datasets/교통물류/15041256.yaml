summary_user: 수도권 3호선 도시광역철도역의 화장실을 한 건씩 담은 파일로, 운영기관·노선·역명·지상지하 구분·역층·개찰구 안팎 여부·가까운 출구번호·상세위치·화장실 구분(남녀 등)을 기록한다. 지하철 이용자가 '내가 내릴 3호선 역에서 개찰구를 나가지 않고 화장실을 쓸 수 있는가, 몇 번 출구 쪽에 있는가'를 확인하거나, 역별 화장실 배치를 정리하는 데 쓴다. 실측 컬럼에 역 코드 같은 공통 조인 키가 없어 다른 노선 화장실·역 시설 데이터와는 역명·노선명을 이름으로 맞춰 이어야 한다.
limits: 역 코드 등 전역 조인 키가 없어 역명 표기 차이에 따라 다른 데이터와의 연결이 어긋날 수 있다. 수도권 3호선 구간만 담으므로 환승역의 다른 노선 화장실 위치는 별도 노선 파일로 확인해야 한다.
