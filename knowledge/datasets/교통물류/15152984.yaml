description_portal: '불법주정차 주민신고제 과태료 부과 현황입니다.행정안전부에서 주관하는 안전신문고 앱을 통하여 신고 및 접수되었던 주민신고제 주정차위반 신고와 관련된 데이터입니다.단속일시, 단속장소, 위반구분, 과태료 부과여부 데이터가 내용이 포함되어 있습니다.위반구분의 경우 6대 주정차금지구역(소화전, 횡단보도, 교차로모퉁이, 인도, 버스정류소, 어린이보호구역) 및 기타 주정차금지구역 등으로 구별되어있습니다.위반일시는 년-월-일 시간, 단속장소는 지번주소 등으로 구별되어있습니다. (차량 번호 미식별 등  처리 불가 대상 차량은 데이터 수집 불가하여 데이터에 포함되어있지 않습니다.)*주정차 위반 차량 단속근거법령: 도로교통법 제32조 및 질서위반행위규제법'
