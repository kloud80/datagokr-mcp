description_portal: 본 자료는 국내 항만을 오가는 선박의 입항 및 출항 기록을 정리한 데이터베이스입니다.항목으로는 항만명, 호출부호, 선명, 입항 횟수, 외항/내항 구분, 총톤수(GT), 입항 일시, 출항 일시 등이 포함되어 있어, 어떤 선박이 언제 어느 항만에 들어오고 나갔는지를 명확하게 보여주는 실시간 기반의 항만 출입 통계 정보입니다.항만 이용 현황을 바탕으로 항만 개발, 확장 계획, 환경 및 안전 관리, 입출항 규제 정책 수립 등에 활용할 수 있고, 해운업체, 물류회사, 항만 운영자 등이 항만 사용 계획, 빈 항구 예측, 스케줄 최적화, 수요 예측 등을 위해 참고 자료로 활용할 수 있습니다.
