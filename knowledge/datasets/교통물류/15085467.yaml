description_portal: "대구 지하철노선의 1호선, 2호선, 3호선의 대구소재 역들의 비상콜폰에 대한 철도운영기관명,선명,역명,역층,상세위치(상선/하선별 승강장 방향 정보) 입니다.비상콜폰은 위급 상황 발생 시 도움을 요청하기 위해 사용하는 통신 장치입니다. 주로 지하철역, 화장실, 엘리베이터 등 공공장소에 설치되어 있으며, 장애인화장실이나 여성화장실처럼 안전이 중요한 장소에도 비상벨 형태의 콜폰이 설치됩니다. - 비상콜폰의 주요 용도는공공시설 내 비상 상황: 지하철 승강장이나 객차 내에 비치되어 비상 인터폰을 통해 기관사에게 직접 상황을 알릴 수 있습니다.안전 시설: 장애인이나 여성의 안전을 위해 화장실 내에 설치되어 도움을 요청할 수 있도록 합니다.기타 서비스: 특정 서비스(예: Uber)에서는 비상 상황 시 대체 연락을 받을 수 있는 사람을 지정하는 기능으로 '비상연락처'를 활용하기도 합니다"
