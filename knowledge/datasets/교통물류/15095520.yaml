summary_user: 인천시 교차로별 교통신호등의 신호주기 현황을 교차로 단위로 담은 파일 데이터로, 교차로명·관할 경찰서·지자체·보호구역 여부와 아침·낮·저녁 시간대별 주기, 최소·최대 주기, 점멸운영 여부를 포함한다. 교통 분석가나 지자체 담당자가 '우리 동네 교차로의 출퇴근 시간대 신호주기는 몇 초이고 연동(오프셋) 운영되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교차로명이나 지자체·경찰서 이름을 매칭해 연결해야 한다.
description_portal: 인천광역시 도로에 설치·운영되는 교통신호등 신호체계 관련 데이터는 각 교차로의 신호등 번호와 명칭, 신호주기 등 세부 정보를 포함하고 있습니다.이 데이터는 인천시 내 모든 교차로의 신호등 운영 현황을 체계적으로 관리하고, 교통 흐름 최적화 및 안전 확보를 위해 활용됩니다.신호주기는 교통량, 시간대, 도로 상황에 따라 조정되며, 각 교차로별로 아침, 낮, 저녁 등 시간대별 신호주기 현황이 제공됩니다.해당 데이터는 인천지방경찰청이 관리하며, 연 1회 정기적으로 갱신됩니다교통신호 운영방식(O/F)o (Offset, 오프셋) 여러 교차로 신호등이 연동될 때, 신호가 시작되는 시간 차이f (Fixed, 고정식) 신호등이 항상 똑같은 시간과 순서로 바뀌는 방식
