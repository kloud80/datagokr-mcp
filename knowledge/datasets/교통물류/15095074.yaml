summary_user: 인천공항 여객기의 출발·도착 운항 정보를 편 단위로 담은 API로, 조회일 기준 D+0~D+6일의 주간 현황이며 실측 기간 2026-10-02~2026-10-08에 8,389건을 받았다. 여행객이나 공항 이용자가 오늘·이번 주 특정 편의 예정·변경 시각, 탑승구, 운항 상태를 확인하는 질문에 쓴다. 전역 조인 키는 없고 3자리 IATA 공항코드(airportCode), 편명(flightId), 마스터 편명(masterflightid) 같은 같은 기관 코드나 이름 매핑으로만 다른 운항 데이터와 잇는다.
description_portal: 인천국제공항공사에서 관리하는 인천공항 여객기 운항정보입니다.여객기의 출발/도착 정보 현황에 대한 데이터로 조회일 기준 D+0~D+6일간의  주간 운항현황 데이터를 확인할 수 있습니다.3자리 IATA 공항코드 기준으로 조회조건 적용이 가능하며, 항공사/항공 편명, 코드쉐어 여부 및 마스터 편명, 예정시간/변경시간, 도착지/출발지 공항, 체크인카운터, 탑승구, 운항상태, 터미널 구분, 출발/도착 시간, 출발/도착지 정보 등의 응답 데이터를 제공합니다.개발계정 일  500트래픽, 운영계정 신청 시 일 10,000트래픽을 제공합니다.
