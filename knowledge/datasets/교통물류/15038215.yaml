summary_user: 광주시 버스 노선별로 경유하는 정류소를 운행 순서(시퀀스)대로 한 행씩 담은 노선-정류소 원장으로, 정류소ID·ARS번호·정류소명·경위도 좌표가 함께 들어 있으며 파일 크기는 약 5.6KB(CSV)로 작다. 광주 시내버스 이용자나 교통 분석가가 '이 노선은 어느 정류장을 어떤 순서로 지나며 그 정류장은 지도상 어디인가'를 확인하거나 정류장 위치를 지도에 표시할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 다른 버스 도착·정류장 데이터와는 노선ID·정류소ID·ARS번호나 정류소명을 같은 체계로 맞춰 대조하거나 경위도 좌표로 공간 결합해 이어 쓴다.
description_portal: 광주시 버스 기본운행 정보는 노선ID, 정류소ID, ARS_ID, 시퀀스, 정류소명, 경도, 위도 등으로 구성되어 있습니다. 노선ID는 버스 노선별 고유 번호를 의미하며, 정류소ID는 해당 노선에 포함된 정류장의 고유 식별자입니다. ARS_ID는 자동응답시스템을 통해 버스 도착 정보를 제공하는 번호로, 승객들이 편리하게 실시간 버스 위치를 확인할 수 있도록 돕습니다. 시퀀스는 노선 내 정류소의 운행 순서를 나타내며, 정류소명은 해당 정류장의 이름을 표시합니다. 경도와 위도 정보는 각 정류소의 정확한 위치를 GPS 좌표로 나타내어 운행 관리 및 승객 편의를 지원합니다. 이 데이터는 광주시 버스 운영의 효율성과 정확성을 높이는 데 중요한 역할을 합니다.
