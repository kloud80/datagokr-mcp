summary_user: 기장군을 경유하는 시내버스를 노선 한 줄 단위로 기점·경유지·종점, 첫차·막차, 배차간격, 심야 운행 시간과 배차간격, 운수업체명과 전화번호를 담은 작은 파일(약 2KB csv)이다. 기장군 주민이나 분석가가 '이 노선의 막차는 몇 시이고 심야버스는 몇 분 간격으로 다니나' 같은 질문이나 노선별 배차 편의성 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 정류장 원장·실시간 도착 정보(TAGO·부산 BIS) 등과는 노선번호나 정류장 이름을 직접 맞춰 이어야 한다.
description_portal: 이 데이터는 부산광역시 기장군 시내버스 운행 현황에 대한 데이터로 기장군을 경유하는 시내버스 노선,시간표 등의 항목을 제공합니다.* 데이터 활용방안(예시)1. 배차 간격 분석을 통한 "이동 편의성" 평가2. 주요 거점(Hub) 파악 및 노선 최적화3. 심야 버스 운행 현황 파악 (안심 귀가 가이드)* 데이터 활용시 참고사항1. 이 데이터는 부산광역시 기장군 교통행정과에서 연간 현행화하고 있으며, 수시로 변경될 수 있습니다.2. 현재 데이터 기준일자는 2025년 11월입니다.3. 데이터값이 공란인 부분은 미집계 데이터 또는 개인정보가 포함되어 공란 처리하였습니다.
