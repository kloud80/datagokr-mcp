summary_user: 진주시 ITS로 수집한 교통정보를 가공해, IC 등 지점별로 유입·유출 구분(ioFlwDiv)에 따른 통행량 합계와 평균속도를 지점 이름·위경도와 함께 담는다. 진주시 교통 분석가나 담당 공무원이 "어느 IC에서 유입·유출 통행량이 많고 속도가 떨어지는가"처럼 지점별 혼잡과 이용 패턴을 확인하는 데 쓴다. 전역 조인 키는 없어, 지점 ID는 진주시 ITS 내부에서만 쓰이고 다른 데이터와는 지점 이름이나 위경도 좌표로 맞춰 연결한다.
limits: 범위는 진주시 한 곳의 개별 지점(주소·좌표)뿐이라 다른 시군구와 바로 비교하기 어렵다. 전국 공통 코드가 없어 다른 교통·도로 데이터와 붙이려면 이름이나 좌표를 직접 매칭해야 한다. 개발계정은 하루 100회로 호출이 제한된다.
