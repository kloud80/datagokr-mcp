description_portal: 경상남도 진주시 지능형교통체계(ITS) 시스템을 통해 수집된 교통 정보를 기반으로 가공한 데이터입니다. 각 지점별 지점ID, 유출입 구분, 통행량 합계, 평균속도 등 핵심 교통 지표를 포함하고 있으며, 지점 이름과 위도·경도와 같은 위치 정보도 함께 제공합니다. 본 데이터는 도심 교통 흐름 분석, 교통 혼잡도 파악, 교차로 운영 효율화, 교통정책 수립 등 다양한 행정 및 연구 목적에 활용될 수 있도록 구성되었습니다. 또한 지점별 이용 패턴 분석, 교통 수요 예측 모델 구축, 스마트 교통 서비스 개발 등에도 유용하게 활용될 수 있는 고도화된 데이터입니다.
