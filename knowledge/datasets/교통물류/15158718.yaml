summary_user: 여수광양항만공사 항만 관제 시스템에 기록된 선박별 관제·작업 이력을 건별로 담으며, 항만명·호출부호·선박명·연도·일련번호·통신 순번·입출항 구분·시설 코드와 시설명·작업일자로 구성된다. 해운·물류 분석가가 특정 선박이 여수·광양항에서 언제 어느 시설에 접안하거나 작업했는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 호출부호·항만코드·일련번호를 매개로 같은 Port-MIS 계열 입출항 신고 데이터와 이어 쓴다.
description_portal: 「관제정보」 데이터는 항만 관제 시스템에서 기록된 선박 작업 내역을 담고 있으며, 항만명(PRT_NM), 호출부호(CALL_LETTER), 선박명(VSSL_NM), 연도(YR), 일련번호(SER_NO), 통신 순번(COM_CNT), 입출항 구분(IOPRT_TP_NM), 시설 코드(FAC_CODE), 세부 코드(FAC_SUB_CODE), 시설명(FACIL_NM), 작업일자(WRK_DT) 등으로 구성되어 있습니다.이 데이터는 항만에서 실시간으로 이루어진 선박의 작업·관제 이력을 보여주며, 선박 위치 관리, 접안 기록, 작업 진행 상황 확인에 활용됩니다. 특히 시설 코드와 세부 코드 정보는 항만 인프라의 세부 활용 현황을 분석하는 데 유용하며, 관제 데이터와 입출항·화물 처리 정보가 결합되면 항만 운영 효율성과 물류 흐름을 종합적으로 파악할 수 있습니다.
