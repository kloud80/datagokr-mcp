summary_user: 인천광역시 서해구 관내 공영 노외주차장을 주차장 한 곳당 한 행으로 정리한 시군구 단위 파일로, 주차장명·주소·행정동·주차면수·구분·주차요금을 담는다(csv 약 3KB). 주민·방문객이 '서해구 어느 동에 유료·무료 공영주차장이 있고 몇 면인가'를 확인하거나, 분석가가 행정동별 공영 주차 공급량을 비교하는 데 쓴다. 전역 조인 키가 없어 주소·행정동·주차장명으로 전국주차장정보표준데이터(주차장관리번호·좌표·요금·면수 원장)나 행정동 단위 자료와 이름 매핑해 잇는다.
description_portal: 본 공공데이터는 인천광역시 서해구 관내의 공영 노외주차장 운영 현황을 정리한 자료입니다. 본 자료는 인천광역시 서해구 내 공영(노외)주차장의 이름, 위치, 운영기관, 총 주차면수, 유료 여부 등의 정보가 포함되어 있습니다. 본 데이터를 통해 주민과 방문객의 주차 편의를 돕고, 교통 혼잡 완화 및 주차 공간 효율화를 위한 정책 수립에 활용될수 있을것으로 판단됩니다. 또한 도시계획, 교통정책, 민원 대응 등 기초자료로서 활용할수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
