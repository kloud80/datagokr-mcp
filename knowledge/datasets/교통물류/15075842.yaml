summary_user: 제주특별자치도 대중교통(버스) 운행 중 정류장 부근에서 탐지된 속도 변화를 건별로 담으며, 각 건은 노선번호와 위성측위 위도·경도·속도·시각, 센서 코드로 이루어진 개별 좌표 단위 기록이다. 교통 분석가나 지자체 담당자가 '제주 어느 노선·정류장 구간에서 버스가 급감속하거나 속도가 크게 바뀌는가'를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선번호(routeNo)를 제주 버스 노선·정류장 정보와 이름·번호로 맞추거나 좌표로 공간 매칭해 이어 쓴다.
limits: 표준 조인 키가 없어 다른 데이터와는 노선번호·좌표 매칭으로만 연결되며, 필드 의미가 명세에 비어 있어 센서 코드 등의 해석은 따로 확인해야 한다. 개발계정은 하루 1,000회 호출로 제한된다.
