summary_user: 인천광역시에 등록된 전세버스 운송사업체를 업체 한 곳당 한 행으로 담고, 업체명·주소·전화·팩스와 대형·중형 버스 보유 대수, 총 등록 대수를 제공한다. 전세버스를 빌리려는 단체나 통학·통근 버스 업체를 찾는 사업자가 '인천 서구나 연수구에서 대형 버스를 많이 가진 업체가 어디인가'를 확인하는 데 쓰고, 분석가는 군·구별 업체 분포와 차량 보유 규모 집계에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소(시군구 이름)를 맞춰 연결해야 한다.
