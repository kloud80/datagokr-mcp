description_portal: '본 데이터는 국내 전역의 전세버스 운송사업체 정보를 정리한 현황 자료입니다.각 전세버스 업체의 업체명, 대표자 성명, 사업장 주소(소재지), 연락처(전화번호, 팩스번호) 등의 기본 인허가 정보와 함께, 보유 중인 전세버스 등록 대수를 차량 유형별로 구분하여 제공하고 있습니다.주요 제공 항목으로는 대형 전세버스 보유 대수, 중형 전세버스 대수, 그리고 총 등록 차량 수가 포함되어 있어, 전세버스 운송능력, 차량 운영 규모, 지역별 버스 보급 수준 등을 파악하는 데 활용할 수 있습니다.현재 인천광역시에는 총 45개소의 전세 버스 업체가 등록되어 있으며, 이들 업체는 크게 두 가지 형태로 나뉩니다. 45개소 중 36개소는 주사무소로 운영되고 있고, 나머지 9개소는 영업소로 운영됩니다. 주사무소는 각 업체의 중심이 되는 장소로, 주된 관리와 운영이 이루어지는 곳을 말하며, 영업소는 특정 지역에서 고객 서비스나 버스 운행 등을 담당하는 부속적인 장소입니다.<군, 구별 업체 수>강화군: 3, 중구: 4, 동구: 1, 미추홀구: 1, 연수구: 8, 남동구: 5, 부평구: 8, 계양구: 2, 서구: 12, 기타 : 1이 45개소의 전세 버스 업체들은 총 1,879대의 전세 버스를 보유하고 있습니다. 이 중 997대는 대형 버스로, 882대는 중형 버스로 분류되며 주로 단체 여행 및 행사, 통학 및 통근에 사용됩니다.해당 데이터는 여객자동차 운수사업법에 따라 정식 등록된 전세버스 업체를 기준으로 구성되며, 운송사업 등록 현황, 차량 보유 현황, 사업장 연락처 정보를 체계적으로 제공합니다.데이터는 지역별 전세버스 업체 분포 현황, 운송 차량 보유 현황 통계, 전세버스 시장 규모 분석, 단체 교통수단 수요 조사, 지자체 교통정책 수립, 관광·통근·통학 버스 운행 정책 개발 등에 활용될 수 있습니다.본 데이터는 CSV 형식으로 제공되며, 연 1회 이상 주기적으로 갱신됩니다.'
