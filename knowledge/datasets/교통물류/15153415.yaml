description_portal: 이 데이터는 국가철도공단에서 KR전자조달시스템을 통하여 진행한 계약의 계약 방식에 대한 정보를 담고 있습니다.데이터는 계약을 구분하는 1)계약방법코드와 해당 코드가 의미하는 2)계약방법명(일반경쟁, 제한경쟁, 수의계약 등)으로 분류되어 있으며, 해당 계약이 공사, 용역, 물품구매 중 어떤 종류에 해당하는 계약인지를 명확히 구분하는 3)계약종류 정보를 함께 제공합니다.이 데이터를 통해 사용자는 공공기관의 다양한 계약 정보를 쉽게 확인할 수 있습니다. 또한 공공조달 시장 연구를 위한 기초자료로 활용할 수 있을 것입니다.
