summary_user: 대구경찰청으로 이관되어 대구광역시청(교통정보운영과)이 유지관리하는 바닥형 보행신호등 보조장치를 설치 교차로 한 곳당 한 행으로 담은 파일(csv, 약 3KB)로, 지역·교차로명·교차로 주소·설치일자를 기록한다. 보행자 안전 분석가나 시민이 '우리 동네 어느 교차로에 바닥신호등이 언제 설치됐는가'를 확인하거나 설치 지점 분포를 볼 때 쓴다. 전역 조인 키가 없어 교차로 주소나 교차로명을 기준으로 횡단보도·어린이보호구역·교통사고 다발지점 같은 다른 위치 데이터와 주소 매칭으로 이어 쓴다.
limits: 구·군이 설치해 아직 경찰청으로 이관되지 않은 바닥신호등(설치 후 2년간 설치기관이 관리)은 빠져 있어 대구 전체 설치 현황으로 볼 수 없다. 공통 코드나 좌표가 아닌 주소·교차로명으로만 다른 데이터와 연결되므로 표기 차이에 따른 매칭 누락에 주의한다.
