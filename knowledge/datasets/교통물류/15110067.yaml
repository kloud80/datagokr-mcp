summary_user: 대전광역시 도로관리시스템에 등재된 가로등 제어기를 한 대씩 담은 건별 원천 파일로, 행정읍면동·도로구간번호·부착방식·제어함 구분과 위도·경도 좌표를 포함한다(csv 약 15만 바이트). 구청·시설 관리자나 분석가가 "우리 동네 도로 구간에 가로등 제어기가 어디에 몇 대 있고 어떤 방식으로 설치됐나"를 확인하거나 유지보수 대상을 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 행정읍면동 이름이나 위도·경도 좌표로 다른 도로시설물·교통사고 위치 데이터와 공간적으로 맞춰 쓰고, 도로구간번호·도엽번호는 같은 대전시 도로관리시스템 자료끼리만 연결된다.
description_portal: 대전광역시 가로등제어기 현황 데이터는 대전광역시 도로관리시스템에 등재된 가로등 제어기의 위치, 종류, 설치 시기, 관리 상태 등 다양한 정보를 포함하고 있습니다. 이 데이터는 도시의 야간 조명 환경을 체계적으로 관리하고 도로 안전을 강화하는 데 필수적으로 활용됩니다. 가로등 제어기 현황을 파악함으로써 효율적인 에너지 관리와 유지보수 계획 수립이 가능하며, 도로시설물 관리 기준을 준수하여 작성되었습니다. 또한 이 데이터는 도시 인프라의 체계적 관리와 시설물 현황 파악, 야간 교통사고 예방, 시민 안전 증진 등 다양한 행정 및 정책적 목적에 활용될 수 있습니다..
