summary_user: 대구광역시 도로 구간(가로망)별로 고정식 주정차 단속카메라의 단속 여부와 평일·토요일·일요일 단속 시간, 노상 주차면·주차장 이름, 도로명, 구군, 경위도 좌표를 개별 위치 단위로 담는다. 운전자나 주차 안내 서비스 개발자가 "대구 수성구 이 도로에 지금 주차하면 단속되나, 주말에는 몇 시까지 단속하나" 같은 질문에 답할 때 쓴다. 전국 공통 조인 키는 없고, 구군 코드(ggucode, 01 중구~08 달성군)나 도로명·좌표로 대구시의 다른 교통 데이터와 이어 쓴다.
description_portal: 대구광역시의 도로망을 기반으로 주정차 관련 다양한 정보를 제공합니다. 주요 제공 정보로는 가로망을 중심으로 한 주정차 운영 현황, 시민들의 실제 이용 실태, 노상 주차면의 위치 및 상세 정보, 고정식 주차 단속 카메라의 설치 위치 및 운영 정보 등이 포함됩니다. 대구광역시 전역의 주차 공간 활용도 분석, 불법 주정차 단속 계획 수립, 교통 정책 수립 등에 필요한 데이터를 효율적으로 수집하고 활용할 수 있습니다. 스마트 교통 서비스 및 주차 안내 시스템 개발에도 활용 가능하며, 교통 혼잡 완화와 시민 편의 증진에 기여할 수 있습니다.
team:
  dept: 지능정보화담당관
