summary_user: 지방자치단체가 관리하는 자전거 대여소를 한 곳씩 한 행으로 담은 표준 데이터로, 검증 수신 기준 1,491행에 대여소명·주소·좌표·운영시간·요금·보유 대수·거치대 수·공기주입기와 수리대 설치 여부를 싣는다. 시민이나 분석가가 '우리 동네 가까운 자전거 대여소는 어디고 몇 시까지 운영하나' 같은 질문에 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)로 지도, 주소 지오코딩, 자전거도로·킥보드 주차구역 같은 다른 위치 데이터와 이어 쓴다.
limits: 실시간 잔여 자전거 수는 담지 않으며, 보유대수·거치대수는 등록 시점의 값이다. 검증 기준 범위는 미상이라 전국 모든 지자체를 포괄한다고 단정할 수 없고, 최신 행 날짜(2026-08-06)는 검증 시점 기준이므로 데이터가 오래됐다고 단정하지 않는다.
