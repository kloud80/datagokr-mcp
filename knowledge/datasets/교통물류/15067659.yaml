summary_user: NDSL·페이퍼서치·RISS 등에서 모은 철도산업 관련 논문을 한 편당 한 행으로 담은 목록 파일(CSV 약 30MB)로, 발행연도·발행기관·논문명·저자·초록·원문URL과 해외학술·국내학술·국내학위 구분(논문분류)을 담는다. 철도 분야 연구자나 정책 분석가가 "최근 몇 년간 국내외에서 고속철도·궤도 관련 논문이 어떤 주제로 얼마나 나왔나"처럼 기술·학계 동향을 파악할 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키는 없어, 논문명·저자명·발행기관 같은 이름 문자열로 맞추거나 원문URL로 원문을 따라가 쓴다.
description_portal: 철도산업 관련 논문 정보를 제공합니다. NDSL/페이퍼서치/RISS등의 사이트에서 수집된 철도산업 관련 논문 정보를 제공합니다. 발행사이트와 논문명/저자/초록 정보를 제공합니다. 논문의 상세내용은 원문URL을 통하여 확인가능합니다. 논문분류는 해외학술논문/국내학술논문/국내학위논문으로 나누어져 있습니다. 철도산업관련 기술동향 및 학계동향을 파악할 수 있습니다.(제공정보:발행년도, 글번호, 총페이지, 발행기관, 논문명, 발행사이트, 등록일, 초록, 저자명, 원문URL, 논문번호, 논문분류)
