summary_user: 서울시설공단이 운영하는 공영주차장별로 하루 동안의 입차대수·출차대수와 주차면수, 시간대, 피크시간을 담은 일별 집계 파일이다(포털 설명상 2026년 6월 1일~30일 수록, CSV 약 40KB). 주차장 운영자나 교통 분석가가 '어느 공영주차장이 어떤 요일·일자에 붐비고 몇 시가 피크인가'를 확인하거나 주차 수급 정책의 기초자료로 쓴다. 실측 컬럼에 주차장관리번호 같은 전역 조인 키가 없어, 전국주차장정보표준데이터(좌표·요금·면수 원장)와는 주차장명 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 주차장 데이터와 연결하려면 주차장명 문자열 매핑이 필요하다. 실시간 주차 가능 대수가 아니라 일별 집계이며, 위치·요금 같은 원장 정보는 담지 않는다. 메타상 범위는 '전국'으로 표기돼 있으나 실제 대상은 서울시설공단 관리 공영주차장이다.
