summary_user: 국내 등록 자동차의 1일 평균 주행거리를 용도·차종(승용·승합·화물·특수)·유형·규모로 나눈 행마다 전국과 17개 시도 값을 열로 담은 집계표로, 약 6KB 크기의 CSV 파일 한 개입니다. 교통·물류 분석가가 '경기 지역 사업용 대형 화물차는 하루 평균 몇 km를 달리나'처럼 차종·용도·지역별 운행 강도를 비교하거나 배출량·교통량 추정의 기초값으로 쓴다. 전역 조인 키가 없어 시도명 열을 다른 시도별 통계(자동차 등록대수 등)의 시도명과 이름으로 맞추거나 차종·용도 구분명을 매핑해 이어 쓴다.
limits: 차량별·건별 원천이 아닌 집계값이라 개별 차량이나 시군구 단위 분석은 할 수 없고, 다른 데이터와는 코드가 아닌 이름 매핑으로만 연결된다. 시도가 열로 펼쳐진 형태라 분석 전에 행 형태로 바꿔야 한다.
