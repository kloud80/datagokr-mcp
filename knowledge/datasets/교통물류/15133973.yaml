summary_user: 서울교통공사 지하철 역사와 상업시설·복합건물·공공건물 같은 외부 건물을 잇는 연결통로를 통로 한 건씩 담은 목록으로, 호선·역명·시설물명·연결형태(지하통로, 데크 등)·운영방법(관리주체)을 포함하며 약 11KB 분량의 CSV 파일이다. 도시계획·보행 네트워크 분석가나 시설 관리자가 '어느 역이 어떤 건물과 지하로 이어져 있고, 그 통로는 누가 관리하는가'를 확인하는 데 쓴다. 전역 공통 조인 키는 없으며, 외부역코드나 역명·호선을 매개로 서울교통공사의 다른 역 단위 데이터(역 정보, 승하차 인원 등)와 이름·코드를 맞춰 연결한다.
description_portal: 서울교통공사에서 제공하는 지하철과 외부 건물 간 연결통로 시설물 정보는 지하철 이용객의 편의성과 도시 내 보행 연계성 확보를 위한 핵심 자료입니다. 본 데이터는 2025년 8월 기준으로 작성되었으며, 항목에는 연번, 호선, 외부역코드, 역명, 연결통로시설물명, 연결형태(지하통로, 데크 등), 운영방법(관리주체 포함), 연결시기 등이 포함되어 있습니다. 이 데이터는 지하철 역사와 상업시설, 복합건물, 공공건물 등을 연결하는 시설의 운영현황 및 소유관리 정보를 파악할 수 있어, 도시계획, 시설관리, 민관 협력사업, 보행 네트워크 설계 등 다양한 분야에서 활용될 수 있습니다. 특히 연결형태나 운영주체 정보는 공공-민간 협업의 사례로 분석될 수 있으며, 향후 추가 개방 시 최신 통로 현황이 반영될 예정입니다.
