description_portal: "○ 통계개요* 통계명 : 자전거도로 현황* 통계종류 : 서울시 자전거도로 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 자전거 이용시설의 정비 및 자전거 이용자의 안전과 편의를 도모하는 등자전거 이용 활성화을 위한 종합적인 시책을 마련하기 위함* 조사체계 : 해당기관 및 자치구 → 서울특별시 자전거정책과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 자전거전용도로 및 자전거보행자겸용도로의구간 및 길이 현황○ 용어설명* 자전거전용도로 : 자전거만이 통행할 수 있도록 분리대.연석 기타 이와 유사한시설물에 의하여 차도 및 보도와 구분하여 설치된 자전거도로* 자전거보행자겸용도로 : 자전거외에 보행자도 통행할 수 있도록 분리대, 연석이와 유사한 시설물에 의하여 차도와 구분하거나 별도로 설치된 자전거도로* 자전거전용차로 : 차도의 일정 부분을 자전거만 통행하도록 차선 및 안전표지나노면표시로 다른 차가 통행하는 차로와 구분한 차로* 자전거우선도로 : 자동차의 통행량이 대통령령으로 정하는 기준보다 적은 도로의일부 구간 및 파로를 정하여 자전거와 다른 차가 상호 안전하게 통행할 수있도록 도로에 노면표시로 설치한 자전거도로('14.1.28. 신설)○ 기 타* 2011년까지 자전거전용도로에 자전거전용차로 포함* 도로변 자치구별 구간 및 길이는 중복된 연장 및 노선을 포함하여 전체계와 일치하지않을 수 있음○ 출 처 : 서울특별시 자전거정책과"
