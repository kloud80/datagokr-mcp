summary_user: 창원시 시내버스·마을버스·좌석버스의 요금표를 버스구분과 연령구분(일반·청소년·어린이)별로 담은 작은 집계 파일(CSV 464바이트)로, 연령별 나이구간과 현금요금·교통카드요금을 함께 싣는다. 창원 시민이나 방문객이 "청소년이 교통카드로 좌석버스를 타면 얼마인가"를 확인하거나, 분석가가 요금 조정 전후 또는 다른 시군과 요금을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 버스구분 이름이나 같은 기관(창원시)으로만 맞춰 이어 쓰며, 노선·정류장 원장이나 승하차 데이터와 직접 결합되지 않는다.
description_portal: 창원시 관내 시내버스 이용 시 적용되는 기본 요금,  연령별(성인·청소년·어린이) 요금, 교통카드 이용 시 추가 혜택 등의 요금체계를 상세히 제공함. 이 데이터는 시민들의 대중교통 이용 편의 증진과 요금에 대한 투명한 정보를 제공하기 위해 개방되었으며, 정책 수립 및 이용자 중심의 교통행정 구현에도 활용될 수 있음. 또한 현행 요금제 외에도 추후 조정 예정 요금 반영 시 비교·분석의 기준 자료로도 유용함.해당 데이터는 버스구분(시내버스, 마을버스, 좌석버스). 연령구분(일반/청소년/어린이), 연령별 나이구간, 현금지불시 요금, 교통카드 사용 시 요금에 대한 정보를 제공하고 있음
