summary_user: 서울교통공사 1~8호선 276개 역사의 건축 정보를 역 단위로 담은 파일로, 호선·역명·승강장 유형(섬식·상대식·복합식)·승강장 길이·층수·역사 면적·준공연도를 2025년 12월 31일 기준으로 정리했다. 분석가나 연구자가 "준공 30년이 넘은 지하철역은 어디이고 승강장 형식과 면적은 어떤가"처럼 역사 노후도와 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 역 좌표·승하차 데이터와는 호선과 역명을 맞춰 이름 매핑으로 연결해야 한다.
description_portal: '서울교통공의 1호선-8호선 역사 건축 정보 데이터입니다. 해당 데이터는 역명, 형식, 길이, 층수, 면적, 준공년도로 구성되어 있습니다.(2025년 12월 31일 기준)역사 건축 정보데이터는 1호선~8호선 총 276개 역사가 호선별로 정렬되어 있어 호선별로 각 역사별로 제공되는 각종 정보(호선, 역명, 승강장유형, 승강장 길이, 층수, 역사 면적, 준공년도)를 편리하게 확인할 수 있습니다.참고사항: 승강장 유형- 섬식: 승강장이 가운데에 있고 선로가 양 측면에 있는 경우- 상대식: 선로가 가운데에 있고 승강장이 양 측면에 있는 경우- 복합식: 섬식과 상대식을 함께 사용하는 경우'
