description_portal: 친환경선박 인증신청에 관한 내용으로, 친환경선박은 환경친화적 에너지 사용, 대기오염물질 저감기술, 선박에너지효율 향상기술 등을 적용한 것입니다. 또한, 친환경 기자재 인증이 추가됨에 따라 향후 인증 기자재를 통한 가산점을 부여받을 수 있습니다.선박의 종류는 국제항해에 사용하는 컨테이너선, 유조선, LNG운반선, 벌크선 등과 연안내수면에 사용하는 유선, 도선, 예선 등이 주로 친환경선박 인증을 신청하고 있습니다. 친환경선박은 탄소중립을 위한 핵심적 수단으로 국가온실가스 감축목표(NDC) 및 국제해사기구의 탈탄소화 전략과 맞물려 있습니다.
