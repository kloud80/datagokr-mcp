summary_user: 서울교통공사 관할 지하철 1~8호선 역사 안의 장애인 화장실을 화장실 한 곳 단위로 담은 파일(csv)로, 노선·역명, 도로명·지번 주소와 위도·경도, 역층·게이트 안팎·가까운 출입구 번호 같은 위치 정보와 대소변기 수, 기저귀교환대 설치 여부, 개방시간을 담는다. 휠체어 이용자나 보호자가 '이 역의 장애인 화장실은 개찰구 안에 있는지, 몇 번 출입구 근처인지'를 미리 확인하거나, 분석가가 노선별 장애인 화장실 설비 현황을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 역 데이터와는 역명·노선명을 이름으로 맞추거나 위도·경도 좌표로 위치를 맞춰 연결해야 한다.
description_portal: '지하철 1~8호선의 역사 내 장애인 화장실 데이터입니다.(기준일자: "26년 2월 12일)1호선에서부터 8호선까지 서울교통공사 관할 역사 내 장애인 화장실을 이용하는 고객 편의를 증진하기 위하여 제공되고 있는 자료이며,해당 데이터는 화장실명, 소재지도로명주소, 소재지지번주소, 상세위치, 전화번호, 개방시간, 대소변기 수량·기저귀교환대 · 비상벨 현황 등 화장실 내 시설물 정보에 대한 자료입니다.서울교통공사 역사 공중화장실 정보는 지하철 이용고객이 쉽게 화장실을 찾고 이용하는 등 고객 만족도 증진에 기여하고자 합니다.(수시, 1회성 데이터)'
