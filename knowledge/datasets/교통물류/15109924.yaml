summary_user: 전남 곡성군에 설치된 무인교통단속카메라를 한 대씩 담은 건별 데이터로, 설치장소·도로명·도로종류·주소와 위경도 좌표, 단속구분, 제한속도를 함께 제공한다. 운전자나 내비·지도 서비스 사업자가 '곡성군 어느 도로에 단속카메라가 있고 제한속도는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시도명·시군구명이나 주소로 다른 지역 단속카메라 데이터와 맞추거나 위경도로 도로·보호구역 데이터와 공간 결합해 쓰며, 무인교통단속카메라는 전국 통일 제공표준 형식이라 다른 시군구 데이터와 같은 형식으로 묶을 수 있다.
description_portal: 무인교통단속카메라관리번호, 설치장소, 단속구분, 제한속도 등의 무인교통단속카메라 데이터 정보를 제공하는 전라남도 곡성군 무인교통단속카메라 정보 데이터 조회 서비스
