summary_user: 전국 지정정비사업자(지정정비업체) 1,978곳을 업체 단위로 담은 파일 데이터로, 시도·시군구·업체명·주소와 정기검사·종합검사·종합(대형)·이륜차검사 가능 여부를 포함한다. 자동차 소유자가 내 지역에서 검사를 받을 수 있는 정비업체가 어디인지 찾거나, 분석가가 지역별 검사 인프라 분포를 파악하는 데 쓴다. 조인 키는 주소(address) 하나뿐이라 주소 기준으로 다른 지점·시설 자료와 이어 쓰며, 차량등록번호나 사업자번호 같은 키는 필드에 없다.
description_portal: 자동차관리법 및 자동차종합검사 시행 등에 관한 규칙에 따라 한국교통안전공단(KOTSA)에서 체계적으로 관리하는 자동차검사 자료 중 하나로, 전국 각 지역별 지정정비업체의 운영 현황을 정리한 데이터입니다. 본 자료에는 각 업체에서 수행 가능한 검사 항목(정기검사, 종합검사, 대형차 종합검사, 이륜차 환경검사 등)과 함께 지정정비업체의 주소등 기본 정보가 포함되어 있으며, 지역별 검사 가능 인프라의 분포를 파악하고 정책 수립, 민원 안내, 행정 효율성 제고 등의 목적으로 활용할 수 있습니다.
