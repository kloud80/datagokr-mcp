description_portal: 한국교통안전공단 자동차부품 자기인증 시스템에 접수된 제원통보 신청 현황 데이터입니다.부품제작자는 자동차관리법 시행령 제8조의2에 따른 13종의 부품(브레이크호스, 브레이크라이닝, 좌석안전띠, 창유리, 자동차휠, 전조등, 안전삼각대 등)에 대하여 제원통보를 수행해야합니다.제원통보를 하기 전 자체 시험시설 혹은 계약된 시험시설에서 자동차안전기준에 따른 부품자기인증 시험을 하고 성적서를 보유한 상태에서 제원통보를 해야합니다.이 데이터는 부품제작자의 제원통보 승인, 반려 내역 등을 담고 있습니다.
