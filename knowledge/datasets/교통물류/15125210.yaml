summary_user: 이천시 도로별·방향별로 출퇴근(7~9시)·점심(12시)·저녁(18~20시) 시간대의 소통 상태를 원활·서행·정체 등급으로 담은 시 단위 교통정보 API로, 일일 소통정보·시간대별 소통정보·주요구간 혼잡정보 세 가지 조회를 둔다. 이천시민이나 지역 분석가가 '오늘 아침 8시에 이천의 어느 도로가 어느 방향으로 정체였나'를 확인하는 데 쓰고, 매일 받아 쌓으면 상습 정체 구간을 분석하는 이력 자료가 된다. 전역 조인 키가 없어 다른 교통 데이터와는 도로명(roadName)과 방향을 이름으로 맞추거나 같은 기관 데이터끼리만 연결한다.
limits: 2026-10-04 실호출에서 세 오퍼레이션 중 하나만 응답했고, 일일 소통정보(/getDailyTrafInfo)와 시간대별 소통정보(/getTimeTrafInfo)는 최소 파라미터로는 응답이 없었다. 링크 ID 같은 공통 키가 없어 표준 노드·링크 체계나 다른 시군의 교통 데이터와 바로 붙이기 어렵다. 이천시 한 곳만 다루고 몇몇 시간대 등급만 제공하므로 전 시간대의 속도·통행시간 분석은 할 수 없다.
