description_portal: '서울시설공단에서 운영하는 공영주차장의 인터넷 정기권 판매현황 정보입니다. ※ 공영주차장 정기권 판매는 매달 18일 부터 판매가 시작되므로 18일까지 전월데이터가 출력됩니다제공데이터 : 기준년월, 주차장명, 정기권대수(소형),  정기권대수(대형), 현재판매량(소형),  현재판매량(대형)*용어정리- 노상주차장 : 도로변에 구획된 주차면. 단시간 이용 중심- 노외주차장 : 부지(지상·지하·건물) 형태. 장·단기 모두 가능, 주차면 수가 많고 월정기 운영 가능.- 환승주차장 : 지하철역·버스 환승 결합. 대중교통 이용 시 추가 할인/면제 혜택- 거주자우선주차 : 거주자에게 장기 배정하는 구역. 일시 주차는 사전예약제(시간제 개방)로 운영하는 곳도 있음.제공부서는 서울특별시 시설관리공단 주차시설운영처 주차정보팀(02-2290-6426)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
