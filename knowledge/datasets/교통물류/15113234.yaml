summary_user: 제주특별자치도 교통정보센터가 관리하는 교통신호기를 교차로 단위로 한 행씩 담은 파일로, 교차로명·주소·ITS번호와 최초설치일·기종변경 이력, 점멸운영 시작·종료시각, 제조사·모델, 보행자작동신호기 여부, 감응제어(루프식·영상식) 방식, 보호구역 구분 등을 기록한다. 교통 분석가나 지역 주민이 '야간에 점멸로 운영되는 신호 교차로는 어디이며 몇 시부터 몇 시까지인가', '설치된 지 오래된 신호기는 어느 지역에 몰려 있나' 같은 질문에 쓴다. 전국 공통 조인 키는 없으므로 주소·도로명·교차로명을 기준으로 어린이보호구역·무인교통단속카메라 같은 다른 규제 데이터나 제주 교통사고 자료와 이름·주소 매칭으로 잇는다.
description_portal: '제주특별자치도 교통정보센터에서 관리하는 교통신호기 운영 관련 데이터를 제공합니다.항목: 교차로명, ITS번호, 점면운영 정보 등*지능형교통체계(ITS) : ITS(Intelligent Transport Systems)가 구현하는 인간 중심의 신교통공간- 교통시설의 이용을 극대화하고 교통수단의 수송효율을 높이는 한편, 국민의 교통편의 증진과 교통안전을 도모할 수 있도록 교통체계의 운영ㆍ관리를 자동화ㆍ과학화하는 체계로서 도로ㆍ철도ㆍ공항 등 교통시설과 자동차ㆍ열차 등 교통수단 등 교통체계 구성요소에 교통ㆍ전자ㆍ통신ㆍ제어 등 첨단기술을 적용하여 교통시설ㆍ수단의 실시간 관리ㆍ제어와 교통정보의 실시간 수집ㆍ활용하는 환경 친화적 미래형 교통체계- 참고: 국토교통부 도로정책 (https://www.molit.go.kr/USR/policyData/m_34681/dtl?id=406) 자세한 사항은 제주특별자치도 교통정보센터 홈페이지에서 확인하시기 바랍니다.https://www.jejuits.go.kr/introduce/introduceView.do'
