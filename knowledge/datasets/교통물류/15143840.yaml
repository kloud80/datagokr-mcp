summary_user: 서울교통공사 지하철역별로 하차역 기준 계단·엘리베이터 등 이동 설비와 가장 가까운 열차 칸(문) 번호를 상하행·방면별로 담은 건별 조회 API입니다. 지하철 이용자나 교통약자 안내 서비스 개발자가 '이 역에서 엘리베이터로 가장 빨리 가려면 몇 번째 칸 몇 번 문에서 내려야 하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 역코드(stnCd)·역명·호선명을 서울교통공사의 다른 역·승하차 데이터와 이름·코드로 맞춰 이어 쓴다.
limits: 전역 공통 조인 키가 없어 다른 기관 데이터와는 역명·코드 매핑으로만 연결된다. 승하차 인원이나 혼잡도 같은 이용량 수치는 담지 않는다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
