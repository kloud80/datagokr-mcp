summary_user: 대전광역시 시내버스에 장착된 버스전용차로 단속카메라(EEB) 운영 현황을 노선번호별로 기점-종점과 카메라 대수로 정리한 소규모 집계 파일(csv, 885 bytes)이다. 시민이나 분석가가 어느 버스 노선에 단속카메라가 몇 대 달려 있는지, 전용차로 단속이 어느 구간에서 이뤄지는지를 확인할 때 쓴다. 전역 조인 키는 없어서, 대전시 버스 노선·정류장 정보와는 노선번호 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 대전광역시 버스전용차로 EEB 단속카메라 현황 자료는 대전광역시 내 버스전용차로에 설치된 EEB(버스장착형 단속시스템) 단속카메라의 운영 현황을 제공합니다. 이 자료는 노선번호, 기점-종점, 단속카메라 대수 등 주요 항목을 포함하고 있어, 버스전용차로 위반 단속의 효율성 제고, 불법 운행 방지, 교통법규 준수 유도 등 다양한 행정적·정책적 목적에 활용됩니다. 특히, EEB 시스템은 시내버스에 장착되어 실시간으로 전용차로 위반 차량을 자동 단속하며, 대중교통의 정시성 확보와 교통 흐름 개선, 시민 교통안전 강화에도 중요한 역할을 합니다.
