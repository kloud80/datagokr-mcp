description_portal: '○ 통계개요* 통계명 : 영업용자동차 업종별 수송* 통계종류 : 서울시 영업용 자동차의 수송인원 및 화물 현황을 제공하는 일반ㆍ조사통계* 작성목적 : 운수관련업체 규모와 여객ㆍ화물 수송실적 등 전반적인 현황을 파악하여운수관련 정책수립과 연구ㆍ분석 등을 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 각 운송조합, 버스회사 → 서울특별시 버스관리과, 택시물류과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 영업용자동차 업종별(버스, 택시 등) 여객 및 화물수송 현황○ 기 타* 시내버스 이외 수송인원은 신뢰성이 낮아 제외함* 2004년 7월부터 시내버스는 마을버스에서 시내버스로 전환된 노선의 이용객 포함'
