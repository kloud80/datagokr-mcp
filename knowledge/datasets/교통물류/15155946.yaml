summary_user: 전라남도 광양시 시내버스의 노선별 정류장 목록(정류장 ID·명칭·순번·좌표·구간 거리)과 노선 운행 정보(기점·종점, 방향, 회차지, 첫차·막차 시간)를 노선·정류장 단위로 담은 API다. 시민·관광객이나 앱 개발자가 '이 노선은 어느 정류장을 어떤 순서로 지나고 첫차·막차는 몇 시인가'를 확인하는 데 쓴다. 노선 ID(route_id)와 정류장 ID(stop_id)로 같은 API의 오퍼레이션끼리 잇지만 전역 조인 키는 없어, 다른 기관 데이터와는 정류장 이름이나 좌표로 맞춰 쓴다.
description_portal: 본 서비스는 전라남도 광양시에서 운행 중인 버스 노선의 정류소 ID, 정류장 명칭, 위·경도 좌표, 정류장 순번 등의 상세 정류장 정보와, 휴일·평일 배차 간격, 전체 정류장 수, 종점 정류소 ID, 노선 유형, 첫차·막차 시간 등 노선의 핵심 운행 정보를 통합 제공하는 공공데이터 서비스입니다. 이를 통해 이용자는 광양시 버스 노선의 구조와 운영 현황을 정확하고 편리하게 확인할 수 있습니다. 표준화된 광양시 버스 노선·정류장 정보를 제공함으로써 API 활용도를 높이고, 시민 및 관광객의 대중교통 이용 편의를 향상시킬 수 있습니다. 또한 교통 정책 수립에 필요한 기반 데이터를 확보하여 행정 효율성을 높이고, 민간 서비스 개발과 스마트시티 분야의 혁신을 촉진하는 효과가 기대됩니다.
