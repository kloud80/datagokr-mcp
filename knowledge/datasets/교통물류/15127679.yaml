summary_user: 김해시에 설치된 개인형 이동장치(PM, 전동킥보드 등) 전용 주차구역을 한 곳당 한 행으로 담은 파일로, 명칭·행정동·지번/도로명 주소·위도·경도·반경 100m 내 대중교통 연계 시설·설치일자·설치형태·설치면적을 담는다. 김해시민이나 공유 킥보드 사업자가 '이 정류장이나 역 근처에 킥보드를 세울 전용 구역이 있는가', '어느 동에 주차구역이 부족한가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 위도·경도로 버스정류장·지하철역 등 위치 데이터와 공간 결합하거나, 행정동 이름·주소로 다른 김해시 데이터와 맞춰 잇는다.
description_portal: '경상남도 김해시 PM 전용 주차구역 위치 현황에 대한 데이터로 연번, 명칭, 행정동, 지번주소, 도로명주소, 위도, 경도, 주변 대중교통 연계 시설(주변 반경 100m 내), 설치일자, 설치형태, 설치면적의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2026년 7월 28일로, 연간 주기로 관리하고 있습니다.* 데이터 미집계 등의 사유로 일부 공란이 존재합니다.데이터 담당부서 : 김해시 교통혁신과(055-330-2724)[데이터 변동 안내]1. 신규 주차구역 추가2. 데이터 설명 수정3. 데이터 기준일 변경'
