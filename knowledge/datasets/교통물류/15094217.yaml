summary_user: 서울 서초구에 설치된 불법주정차 단속 CCTV를 지점 한 곳당 한 행으로 담은 위치 목록이며, 설치 주소·위도·경도·단속지점명·현장구분(도로변, 교차로, 어린이보호구역 등)을 포함한다. 서초구에서 차를 세우려는 시민이나 내비·지도 앱 개발자가 '이 근처에 주정차 단속 카메라가 있는가'를 확인하는 데 쓰고, 분석가는 단속 지점 배치와 보호구역 분포를 비교하는 데 쓴다. 전역 조인 키는 없고, 시군구 코드(CGG_CD)와 지점명으로 같은 기관의 다른 데이터에 붙이거나 위도·경도로 공간 결합해 쓴다.
description_portal: '서울특별시 서초구 불법주정차 위반 단속 CCTV 위치정보에 대한 데이터로 위도, 경도, 단속지점명 등에 대한 정보 확인이 가능합니다.본 데이터는 서울특별시 서초구 내에서 불법주정차 위반 차량 단속을 위해 설치된 CCTV의 위치 정보를 체계적으로 제공하기 위해 구축되었습니다. 구내 교통질서 확립과 보행자 안전, 원활한 차량 흐름을 위해 CCTV 기반의 상시 모니터링이 점차 중요해짐에 따라, 관련 장비의 정보 접근성과 행정의 투명성 강화가 데이터 구축의 주요 목적입니다. 데이터에는 각 단속지점의 주소, 위도, 경도(좌표정보), 단속지점명(고유 식별명), 현장구분(예: 도로변, 교차로, 어린이보호구역 등) 등 필수 항목이 포함되어 있어 단속카메라의 정확한 위치와 운영 현황을 한눈에 파악할 수 있습니다. 서초구청 등 관할 행정기관이 주기적인 현장 점검 및 정보 갱신을 실시하여 데이터의 신뢰성과 최신성을 유지하고 있습니다. 본 데이터는 교통단속 정책효과 분석, 교통안전 대책 마련, 시민 안내 서비스, 실시간 위치기반 앱 개발, 연구 등 다양한 분야에서 활용 가능하며 모든 이해관계자에게 투명하고 신뢰할 수 있는 자료를 제공합니다. 데이터는 주기적으로 최신화됩니다.'
