summary_user: 한국도로공사가 고속도로 노선에 설치한 차량검지기(VDS) 지점별·차로유형별 교통량, 점유율, 평균속도를 1개월 단위로 집계한 전국 범위 통계 파일이다. 도로 분석가나 입지·상권 분석가가 '특정 고속도로 지점의 월별 교통량과 평균속도가 어떻게 변하는가'를 확인하거나 정체 지점을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 VDS 장비ID(차량검지기 장비 아이디)로 한국도로공사의 다른 VDS·노선 데이터와 맞춰 잇는 방식으로만 연결한다.
description_portal: '본 데이터는 한국도로공사가 운영하는 차량검지기(VDS: Vehicle Detection System)를 통해 수집한 고속도로 지점별 교통 소통 통계 정보이다.  전국 주요 지점에서 측정된 교통량, 평균 속도, 점유율 등의 정보를 월 단위로 집계하여 제공한다.  VDS는 차로에 설치된 센서를 통해 실시간으로 차량 흐름을 감지하며, 수집된 데이터는 구간별 교통 상태 분석에 활용된다.  본 데이터는 혼잡도 분석, 교통 정책 수립, 수요 예측 등 다양한 분야에서 유용하게 사용될 수 있다.  또한 정체 지점 파악, 도로 운영 효율화, 운전자 정보 제공 등의 목적으로도 활용이 가능하다.  데이터는 CSV 형식으로 구성되어 있으며, 원하는 기간의 정보를 조회하여 손쉽게 활용할 수 있도록 제공된다.고속도로 노선상에 설치된 차량감지장치(VDS)에 의해 VDS지점별, 차로유형별, 교통량 및 점유율, 평균속도에 대해 1개월 단위로 통계 생성된 교통 데이터* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000026'
