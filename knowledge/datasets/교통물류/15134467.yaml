description_portal: 한국교통안전공단에서 제공하는 자료입니다. 해당 자료는 각 지방자치단체에서 관리하는 자료를 수집하여 취합 제공하는 자료입니다. 지방자치단체별(시도, 시군구) 부설주차장 설치 의무 면제 현황 건수에 대해 제공하고 있으며, 주차장의 주소는 제공하고 있지 않습니다. 해당 정보는 부설주차장의 설치 의무 면제 건수와 주차면수, 납부금액 등을 제공합니다. 2023년도에 취합한 자료로 2022년 말 까지의 자료를 제공하고 있습니다. 시도 코드, 시군구 코드는 행안부의 행정표준코드를 준용합니다.
