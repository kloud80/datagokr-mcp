summary_user: 충주시 주요 교차로에 설치된 교통관제 웹카메라를 한 대씩 담은 현황 목록으로, 관리번호·설치위치명·지번주소·관리기관·위도·경도를 개별 지점 단위로 제공하는 작은 CSV 파일(약 2.7KB)이다. 충주 시내 어느 교차로에 교통 카메라가 있는지, 분석가가 교통량·사고다발 지점 분석에서 관측 지점의 위치를 확인하는 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표나 지번주소로 공간 매칭하거나 설치위치명(교차로명)으로 이름을 맞춰 이어 쓴다.
description_portal: 본 데이터는 충청북도 충주시 주요 교차로에 설치된 교통관제 웹카메라 현황을 제공하는 자료로, 관리번호, 소재지 지번주소, 설치위치명, 관리기관, 위도, 경도, 데이터 기준일자 등의 항목으로 구성되어 있음. 교통관제 웹카메라는 교차로 내 차량 흐름과 보행자 상황을 실시간으로 수집하여 교통 혼잡 관리, 사고 예방, 긴급 상황 대응 등에 활용됨. 해당 데이터는 교차로별 교통량 분석, 신호체계 최적화, 사고다발 지점 파악, 스마트 교통체계 구축 등 다양한 교통 행정 서비스에 기초자료로 활용될 수 있음. 또한 도시 교통 효율성 제고와 안전한 도로환경 조성을 위한 정책 수립에도 유용함.
