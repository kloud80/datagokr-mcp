description_portal: '이 데이터는 경기평택항만공사를 통해 개설된 컨테이너선 항로의 국가별 기항지 현황을 정리한 자료입니다. 주요 항목으로는 항로가 연결된 국가명, 기항 수, 국가코드, 해당 국가의 주요 기항 항만명이 포함되어 있으며, 각 항로가 어떤 항만을 경유하는지를 파악할 수 있습니다. 항만 운영 및 해운 물류체계 분석, 국제 물류 네트워크 이해, 신규 항로 기획 등에 유용하게 활용될 수 있습니다. 또한 국가 간 교역 흐름 분석과 항로 전략 수립 자료로도 가치가 높습니다.* 기항지: 선박이 정기적으로 정박하는 항만을 의미하며, 화물의 적재 및 하역이 이루어지는 장소입니다.'
