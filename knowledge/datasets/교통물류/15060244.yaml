summary_user: 인천광역시 서구(서해구) 안의 가로등 현황을 노선명·위치명·주소·관리주체별로 정리하고, LED·CDM·메탈할라이드 등 광원 종류와 용량별 수량을 열로 나눠 담은 파일(csv)입니다. 구청 시설 담당자나 분석가가 "어느 노선에 아직 LED가 아닌 구형 광원이 몇 개 남아 있어 교체 대상인가"를 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못했기 때문에, 다른 데이터와는 주소나 노선명을 이름 매핑해서 이어 씁니다.
description_portal: 본 공공데이터는 인천광역시 서구에 설치된 가로등의 현황에 대해 정리한 자료입니다. 본 자료는 인천광역시 서구 내 가로등의 위치, 설치 연도, 가로등 종류, 소재지 주소, 관리번호 등 정보를 수록하고 있습니다. 본 데이터는 인천광역시 서구 내 가로등 설치 및 관리 현황을 파악하여 도시 안전성과 야간 보행자의 편의향상에 기여하고, 가로등 유지보수 계획 수립, 노후 시설 교체 및 에너지 절감 정책 마련 등 다양한 행정적 자료에 활용될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
