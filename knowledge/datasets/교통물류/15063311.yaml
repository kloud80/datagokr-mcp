summary_user: 경상북도 영주시 시내버스 정류장을 한 줄에 하나씩 담은 정류장 원장 파일로, 정류장 고유 식별자(정류장ID)·정류장명·위도·경도를 담는다(CSV 약 36KB, 활용신청 없이 내려받음). 주민이나 분석가가 '우리 동네에서 가장 가까운 버스정류장은 어디인가', '정류장이 없는 지역은 어디인가'처럼 정류장 분포와 접근성을 따질 때 쓴다. 다른 데이터와 이어 줄 전역 조인 키는 없어서, 정류장명 매칭이나 같은 영주시 데이터의 정류장ID로 노선·도착 정보와 맞추고, 좌표로 주소·행정구역 같은 공간 데이터와 겹쳐 쓴다.
description_portal: 경상북도 영주시 버스정류장 현황은 지역 내 대중교통 서비스 제공의 핵심 거점인 버스정류장에 대한 기초 정보를 제공하는 공공데이터 입니다.영주시 시내버스에 대한 자세한 현황은 영주시 대표 홈페이지(https://www.yeongju.go.kr/open_content/main/page.do?mnu_uid=4098&)를 통해 확인 가능합니다.본 데이터는 공간좌표 기반의 위치 정보와 정류장 식별을 위한 고유 식별자 정보를 포함하고 있습니다. 이를 통해 각 정류장의 분포 현황, 노선 연계 관계, 이용자 접근성 등을 체계적으로 분석할 수 있으며 노선 조정, 정류장 통합신설등 대중교통 정책 수립의 기초자료로 활용할 수 있습니다.또한 GIS 기반 공간 분석, 교통약자 이동권 보장 등 다양한 공공행정과 민간 서비스 개발에도 활용 가능합니다.이 데이터는 교통 인프라의 효율적 운영과 지역 주민의 이동 편의성 증진에 기여할 수 있습니다.
