summary_user: 최근 5년간 전국 철도 건널목에서 일어난 사고를 한 건씩 담은 파일로, 발생일자·노선·발생장소·행정구역·주원인과 근본원인, 사망·중상 인원, 총 피해액(백만원)을 기록한다. 철도 안전 담당자나 분석가가 어느 노선·지역 건널목에서 어떤 원인의 사고가 반복되는지 따져 구조 개선이나 안전장치 보강 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정구역명·노선명 같은 이름 매핑으로만 이어 쓴다.
limits: 표준 행정코드나 건널목 식별 코드가 없어 다른 철도·지역 데이터와 정확히 조인하기 어렵고, 이름 표기를 맞추는 작업이 필요하다. 범위는 전국이며 좌표가 없는 비공간 자료라 지도에 바로 올릴 수 없다.
