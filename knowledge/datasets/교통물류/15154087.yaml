summary_user: 창녕군에 접수된 불법주정차 민원을 안전신문고에서 추출해 건별로 담은 파일로, 접수일시·신청경로·민원제목·발생지역·처리결과를 포함한다. 군 교통 담당자나 분석가가 어느 지역에서 어느 시기에 불법주정차 신고가 몰리고 처리(과태료 부과 등) 결과가 어떻게 나뉘는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 민원발생지역 이름을 매핑하거나 같은 기관(창녕군) 자료끼리만 이어 쓴다.
description_portal: 경상남도 창녕군 불법주정차 신고 및 과태료 부과 현황 자료입니다.1. 안전신문고에서 추출한 자료로 접수일시, 민원신청경로, 민원제목, 민원발생지역, 처리결과 데이터를 포함하고 있습니다.  ※ 안전신문고에서 추출한 데이터로 상세 위치는 추출 불가로 파일에 포함되어 있지 않습니다.2. 데이터 기준일은 2025년 11월 25일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 건설산업국 건설교통과 교통팀 055-530-1727로 문의 주시기 바랍니다.
