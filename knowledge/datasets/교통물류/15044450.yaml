summary_user: 서울교통공사가 보유한 변전·배전·제어 등 전력설비를 대분류·중분류·소분류로 나누고, 설비별 단위(개소·대·조 등)와 함께 1~8호선 각 노선의 보유 수량을 정리한 집계표로, 전체 파일 크기가 약 1.3KB인 소규모 CSV다. 분석가나 연구자가 '어느 호선에 변전소나 변압기가 상대적으로 많은가'처럼 호선별 전력 인프라 규모를 비교하는 질문에 쓴다. 전역 조인 키가 없어 노선 길이·역 수·수송 인원·전력 사용량 같은 다른 자료와는 호선 이름(1호선~8호선 열)을 기준으로 직접 맞춰 이어 써야 한다.
