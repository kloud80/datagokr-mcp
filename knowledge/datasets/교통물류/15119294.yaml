summary_user: 중랑구시설관리공단이 운영하는 거주자우선주차 구획을 한 행씩 담은 건별 원천 파일(CSV, 약 1.9MB)로, 구획번호·구역명·지번주소·위도·경도·면수와 사용시간대·사용기간·이용요금·결제방법·정기접수 기간을 담는다. 중랑구 주민이 우리 집 근처 거주자우선주차 구획의 위치와 요금, 다음 정기접수 기간을 확인하거나, 분석가가 구획 분포를 지도에 올려 주차 공급을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소나 좌표로 공간 매칭하거나 관리기관명으로 묶어야 하며, 주차장 원장 성격의 전국주차장정보표준데이터와 나란히 볼 때도 같은 방식으로 맞춘다.
description_portal: 중랑구시설관리공단은 「서울특별시 중랑구 시설관리공단 설립 및 운영에 관한 조례」에 따라 중랑구 권역 내 공영주차장, 거주자우선 주차장을 운영하고 있습니다. 해당 데이터는 중랑구시설관리공단이 관리하는 거주자우선주차 제도 운영에 대한 거주자우선주차장의 정보로 해당 주차구역 소재지의 위도, 경도 및 이용시간과 요금 등을 제공합니다. 거주자우선주차를 하기 위해서는 홈페이지(https://jungnang.park119.co.kr/userNew/index.aspx)에서 별도 신청 후 이용이 가능합니다.
