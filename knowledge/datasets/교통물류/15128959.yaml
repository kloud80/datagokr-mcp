description_portal: 2024년 주거이전비는 공익사업 시행에 따른 이주 대상자의 주거이전 비용을 산정하기 위한 기준 자료로, 국가철도공단의 보상업무 수행 시 적용됩니다. 해당 금액은 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 시행규칙」 제54조에 근거하여 산정되며, 특히 6인 이상 가구의 경우에는 통계청의 월평균 가계지출비 데이터를 기준으로 1인당 평균비용을 추가로 산출합니다. 산정 방식은 [(5인 가구 기준 비용 - 2인 가구 기준 비용) / 3]으로 계산된 1인당 금액을 추가하여 반영하며, 이는 다인 가구의 이전 부담을 합리적으로 보전하기 위한 방식입니다. 이 데이터는 보상 집행의 일관성과 형평성 확보, 공공사업 관련 주민 지원, 이주 계획 수립 등에 활용되는 중요한 간접비 보상 기준 정보입니다.
