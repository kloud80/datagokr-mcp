summary_user: 한국공항공사가 운영하는 전국 공항(인천공항 제외)의 운항편별 실시간 정보를 담으며, 편명·출발/도착 공항(IATA 코드)·계획/실제 시각·운항 상태(출발·지연·결항 등)와 함께 투입된 항공기의 기종(icaoApmCd)과 고유 등록번호(aplRegNo)를 편 단위로 제공한다. 오늘 김포발 특정 편에 어떤 기종·어느 등록번호의 기체가 투입됐는지, 공항·항공사별로 어떤 기종이 운항하는지를 확인하려는 여행객·항공 분석가가 쓴다. 전역 조인 키는 실측에서 확인되지 않아 출발·도착 공항 IATA 코드로 공항코드 정보와, 항공기 등록번호로 항공기 등록 정보와 이름·코드 매칭으로 이어 쓴다.
description_portal: 한국공항공사는 인천국제공항을 제외한 김포, 김해, 제주, 대구 등 전국 14개 공항을 통합 관리하고 운영하는 대한민국의 대표적인 공공기관입니다. 본 API는 한국공항공사가 관할하는 운영하고 있는 공항의 실시간 항공기 기종 및 등록번호를 제공합니다.제공되는 주요 데이터 항목으로는 항공기 기종, 고유등록 번호 등이 상세히 포함되어 있습니다. 이를 통해 공항 항공기  기종 분석 등 다양한 목적의 데이터 활용이 가능합니다.제공되는 데이터에 대한 추가적인 요구사항이 있으시거나, 기능 개선 및 데이터 오류 등에 대한 의견이 있으신 분은 한국공항공사 담당 부서(02-2660-4803)로 연락해 주시면 친절하게 안내해 드리겠습니다.
team:
  dept: 데이터융합부
services:
  - op: /info
    name: 전국공항 항공기 고유번호 및 기종정보 제공
    endpoint: https://apis.data.go.kr/B551178/flight-aircraft-status/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: schStTime
        required: false
        desc: 예정 출발시간 (샘플:202510140530)
      - name: schEdTime
        required: false
        desc: 예정 도착시간 (샘플:202510140530)
      - name: schAirCode
        required: false
        desc: 기준공항 코드 (샘플:GMP)
      - name: schFln
        required: false
        desc: 운항 편명 (샘플:KE1406)
      - name: Line
        required: false
        desc: D:국내선, I:국제선 (샘플:I)
      - name: schAPLno
        required: false
        desc: 항공기 고유 등록번호 (샘플:HL8314)
      - name: schAPM
        required: false
        desc: 항공기 기종 (샘플:B747)
      - name: type
        required: false
        desc: '응답 형식(JSON & XML), 기본값 : XML (샘플:xml)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 5000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
