summary_user: 대전도시철도 1호선 판암역~반석역의 무임승차 인원을 연도·역별로, 교통복지카드(선불·후불)와 우대권 등 승차권 종류와 경로·장애·유공·다자녀 대상별로 나눠 담은 집계 파일입니다. 지자체·분석가가 '어느 역에서 노인 무임승차가 많고 연도별로 어떻게 변했나'처럼 역별 무임수송 부담이나 고령 이용 수요를 따질 때 쓴다. 전역 조인 키가 없어 다른 역별 승하차·시설 데이터와는 역명(역명)을 이름으로 맞춰 연결해야 한다.
