summary_user: 창원시 5개 구 관내에 주사무소를 둔 특수여객업체(장의업)를 업체 한 곳당 한 행으로 정리한 목록으로, 관할 구청 구분, 업체명, 주소, 등록 차량 대수를 담고 있다(csv 약 2KB). 장례 운구차량 업체를 찾는 시민이나 구별 장의차량 공급 현황을 보려는 분석가가 '우리 구에 장의차 업체가 몇 곳이고 차량은 몇 대인가' 같은 질문에 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 주소를 지오코딩하거나 업체명·구 이름을 맞춰서 잇는다.
limits: 표준 코드나 사업자번호 같은 공통 키가 없어 다른 데이터와 자동으로 결합하기 어렵다. 실측 컬럼은 구분·업체명·주소·등록대수뿐이다. 포털 설명에 나오는 운송 허가 내역, 운행 구역, 운영 시간대는 실제 파일에서 확인되지 않는다.
