summary_user: 경주시 관내에 등록된 자동차를 연료별·용도별(사업용·비사업용)로 나누고 승용·승합·화물·특수 차종별 등록대수를 집계한 표로, 783바이트짜리 작은 CSV 파일입니다. 경주시의 전기차·하이브리드 등 친환경차 비중이나 사업용 화물차 규모를 알고 싶은 정책 담당자나 분석가가 연료별 점유율을 계산하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 같은 등록현황과는 연료·용도 이름을 맞춰서만 이어 붙입니다.
description_portal: 경상북도 경주시에서 제공하는 차량등록현황 데이터는 관내 등록된 자동차의 연료 유형, 용도, 차종(승용, 승합, 화물, 특수)별 등록대수를 집계한 파일데이터이다. 이 자료는 경유, LPG, CNG, 하이브리드, 전기차 등 다양한 연료방식과 사업용·비사업용 차량을 구분하여 제공하며, 자동차 등록 추이를 파악하고 교통 및 환경정책 수립에 활용된다. 또한 탄소배출 관리, 대중교통 인프라 확충, 친환경 차량 보급 정책 등과 연계하여 행정계획을 수립하는 데 필요한 기초자료로 활용 가능하다. 이용자는 특정 연료별 차량의 점유비율이나 용도별 등록 현황 등을 쉽게 분석할 수 있으며, 관련 통계는 정기적으로 갱신되어 최신 데이터를 반영한다.
