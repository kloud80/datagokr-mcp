summary_user: 경기도 버스운송관리시스템(BMS) 기준으로 노선ID별 노선번호(노선명)의 변경 이력을 이력ID 단위로 담은 시도 범위 데이터다. 교통 분석가나 행정 담당자가 특정 노선의 번호가 언제 바뀌었는지, 신규 노선이 생겼는지를 추적할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 BMS 데이터(노선별 차량운행정보, 행정처분 기록 등)와는 노선ID나 노선명 매핑으로만 이어 쓴다.
description_portal: '이 데이터는 경기도에서 운영하는 버스운송관리시스템(BMS)을 기반으로 노선ID와 노선번호의 변경 이력 정보를 제공합니다. 각 노선에 대한 고유 식별자인 노선ID와 함께 해당 노선의 번호가 이력 형태로 포함되어 있어, 시간에 따라 노선명이 변경되었는지 혹은 신규 노선이 생성되었는지를 확인할 수 있습니다. 데이터 항목에는 이력ID, 노선ID, 노선명이 포함되어 있으며, 이를 통해 대중교통 체계의 변화를 추적하거나 교통정책 수립, 행정정보 관리에 활용할 수 있습니다. 또한 다른 BMS 관련 데이터(예: 노선별 차량운행정보, 행정처분 기록 등)와 연계하여 분석할 경우 노선 운영의 변천사와 행정 대응 흐름까지 통합적으로 파악할 수 있습니다.'
