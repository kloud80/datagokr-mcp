description_portal: 이 데이터는 한국철도공사가 철도 운영 및 유지보수를 위해 사용하는 모든 물품(자재)에 대한 기술적 상세 명세를 담은 통합 정보입니다.1. 자재 속성 및 규격 정보 (TBMM_MAT_ATTR, TBMM_CABN)- 자재번호를 중심으로 G2B분류번호에 따라 부여된 개별 속성값을 제공하여 자재의 규격, 재질, 성능 등의 구체적인 기술적 특성을 명세합니다.- G2B분류속성을 통해 세부품명, 표준규격 등 해당 자재 분류에 필수적으로 요구되는 표준 속성 정의를 확인할 수 있습니다.2. 물품 분류 기준 정보 (TBMM_ZTMMY_0310)- 분류 번호와 이에 대한 G2B 품명, 품명 해설, 분류 레벨 등의 상세 정보를 제공하여 물품의 표준화 및 식별 기준을 명확히 합니다.3. 기술 문서 및 도면 정보 (TBMM_MAT_DOC, TBMM_DMS_DOC_FILES)- 자재번호와 관련된 기술 문서의 식별 정보(문서번호, 문서유형)를 연결하며, 자재문서정보를 통해 해당 문서의 실제 파일명을 파악할 수 있어, 자재의 설계 도면, 기술 규격서, 이미지 파일 등 관련 문서를 관리하는 데 활용됩니다.4. 대상 장비 연결 정보 (TBMM_MAT_TGEQP)- 특정 자재번호가 실제로 사용되는 대상 장비 코드를 연결합니다. 이를 통해 어떤 부품이 어떤 철도 차량, 선로, 전기 장치 등에 쓰이는지 역추적하거나, 특정 장비의 부품 목록을 확인할 수 있습니다.
