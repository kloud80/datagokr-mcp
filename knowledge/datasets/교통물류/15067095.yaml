summary_user: "강남구 관내에 설치된 바닥신호등을 한 곳씩 담은 파일로, 신호등명(예: 학교 앞 지명)·도로명/지번 주소·관리기관·위도·경도를 개별 위치 단위로 제공한다(CSV 약 8KB). 보행자 안전 분석가나 주민이 '우리 동네 어느 횡단보도 앞에 바닥신호등이 있는가', '초등학교 주변에 설치돼 있는가'를 확인하고 지도에 표시할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표나 주소 문자열로 공간 매칭해 이어 쓰며, 어린이보호구역·횡단보도 위치 데이터와 겹쳐 보는 방식이 현실적이다."
description_portal: 강남구 관내에 설치되어 있는 바닥신호등에 대한 데이터로  신호등명, 도로명주소,  지번주소, 관리기관 등의 항목을 제공합니다신호등명은 청담초교 앞, 포이초교앞처럼 특정지역명을 포함하고 있습니다. 도로명주소는 해당 바닥신호등이 설치되어 있는 곳의 공식적인 도로명을 기반으로 한 주소이며, 옆에 지번주소를 기재했습니다.위도와 경도 항목은 해당 신호등이 설치된 좌표의 소숫점까지 기록된 값으로, 지도상에 신호등의 정확한 위치를 표시하거나 위치 기반 서비스에 활용할 수 있습니다.
