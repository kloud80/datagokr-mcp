summary_user: 서울시 자치구에 설치된 횡단보도를 한 건씩 담은 시설 목록으로, 시도·자치구명, 소재지 지번, 관리번호, 횡단보도 종류, 신호등·보행자신호 설치 여부, 경도·위도 좌표를 포함한다. 보행환경을 점검하는 분석가나 위치 기반 서비스 사업자가 '이 동네 어느 횡단보도에 보행자 신호등이 없는가'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없어서, 자치구명으로 다른 데이터와 맞추거나 좌표로 교통사고 다발지역·어린이보호구역 같은 공간 데이터와 겹쳐 쓴다.
description_portal: 서울특별시 횡단보도 정보 데이터는 서울시 모든 자치구 내 설치된 횡단보도의 위치와 기본 현황을 수록한 자료입니다. 각 횡단보도별로 시도명, 시군구명, 소재지 지번을 통해 설치 위치를 확인할 수 있으며, 관리번호를 통해 개별 시설을 구분할 수 있습니다. 또한 횡단보도 종류 항목을 통해 일반횡단보도, 신호등 설치 여부 등 유형을 파악할 수 있고, 경도와 위도 좌표를 포함하여 지도 기반 위치 확인 및 공간 분석이 가능합니다. 본 데이터는 교통시설 관리, 보행환경 점검, 위치 기반 서비스 구축 등에 활용할 수 있습니다. 보행자 통행량 분석이나 교통사고 다발지역과의 연계 분석에도 활용 가능한 기초자료입니다.
