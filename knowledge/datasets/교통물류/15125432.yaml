summary_user: 부산광역시 사하구가 단속한 불법주정차 위반을 건별로 기록한 파일로, 위반일자·위반시간·위반장소명(건물명이나 행정동 중심 표기)을 담는다. 주민이나 분석가가 "사하구에서 불법주정차 단속이 어느 장소·시간대에 몰리는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장소명·행정동 이름을 맞추거나 같은 기관(사하구) 기준으로만 이어 쓴다.
limits: 위반장소가 상세 주소 대신 건물명·행정동 중심으로 적혀 있어 좌표 기반 지도화나 정밀한 위치 분석에는 한계가 있다. 범위는 사하구 한 곳이며 공간 좌표가 없는 비공간 자료다.
