summary_user: 물류 분야 전문 용어를 한 건씩 용어명·키워드·설명으로 정리한 용어사전 파일로, 운송·보관·포장·하역·통관·유통·정보시스템·공급망관리와 철도·항공·해양물류 용어까지 담으며 범위는 전국·비공간이다. 물류업 종사자나 학생, 일반인이 '크로스도킹이나 3PL 같은 물류 용어가 정확히 무슨 뜻인가'를 확인하거나 교육 자료·검색 서비스의 용어 설명을 만들 때 쓴다. 공통 코드나 전역 조인 키가 없어 다른 데이터와는 용어명(물류용어)이나 키워드 문자열을 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 물류용어사전은 물류 분야에 사용되는 다양한 전문 용어들을 체계적으로 정리한 온라인 사전 서비스로, 물류산업 종사자뿐만 아니라 일반 사용자들도 물류 개념을 쉽게 이해할 수 있도록 돕기 위한 서비스입니다. 물류용어 사전은 운송, 보관, 포장, 하역, 통관, 유통, 정보시스템, 공급망관리(SCM) 등 물류 전 분야에 걸친 용어를 포함하고 있으며, 각 용어에 대해 표준화된 정의, 관련 설명, 개념까지 함께 제공하여, 교육용이나 실무용으로도 활용도가 높습니다. 물류분야 외 철도물류, 항공물류, 해양물류용어까지 제공하고있습니다.
