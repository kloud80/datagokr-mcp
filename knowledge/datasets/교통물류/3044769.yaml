summary_user: 인천광역시가 장애인 이동 지원을 위해 위탁 운영하는 셔틀버스의 위탁기관, 차량 규격, 운영지역, 연락처, 홈페이지를 기관별로 정리한 소규모 현황 파일(약 1KB)이다. 장애인 당사자나 보호자가 내가 사는 지역에서 셔틀버스를 어느 기관이 운영하고 어디로 연락하면 되는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 운영지역 이름이나 위탁기관명을 직접 맞춰 연결해야 한다.
description_portal: 인천광역시 장애인 셔틀버스 위탁 운영 현황 공공데이터는 인천 지역 장애인들의 이동 편의 증진을 위해 운영되는 특별교통수단(셔틀버스)의 운영 주체 및 계약 정보를 담고 있습니다. 이 데이터는 셔틀버스 서비스의 운영 투명성을 확보하고, 서비스의 질을 관리하기 위한 목적으로 제공됩니다.이 자료를 통해 시민과 관련 기관은 셔틀버스 서비스가 어떤 주체를 통해, 어떤 규모로, 얼마나 장기적으로 운영되고 있는지 명확히 파악할 수 있습니다.해당 데이터는 인천시 홈페이지(복지)와 공공데이터포털에서 확인할 수 있습니다.
