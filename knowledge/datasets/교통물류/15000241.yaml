summary_user: 등기번호(13자리) 하나에 대해 EMS 국제우편물의 행방 목록(처리일시, 처리현황, 현재위치, 상세설명)을 건별로 돌려주는 조회 API이며, 범위는 전국·비공간입니다. 국제특급(EMS)을 보내거나 받는 국민·사업자가 '내 EMS가 지금 어디서 어떤 처리 단계에 있나'를 확인하거나, 쇼핑몰·물류 서비스가 송장 단위 배송 추적을 화면에 붙일 때 씁니다. 실측 컬럼에서 다른 데이터와 이을 전역 조인 키는 찾지 못했고, 같은 기관의 택배·국내우편물 종적 조회처럼 등기번호를 입력값으로 쓰는 송장 단위 조회 도구와 나란히 쓰는 정도로만 연결됩니다.
