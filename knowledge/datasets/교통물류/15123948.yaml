summary_user: 경기도버스운송관리시스템(BMS)에서 나온 일자별 버스 노선 운행 기록으로, 수집일자마다 어떤 운수업체(업체ID·업체명)가 어떤 노선(노선ID·노선명)을 운행했는지를 한 행씩 담는다. 교통 분석가나 지자체 담당자가 '특정 날짜에 이 노선을 운행한 업체는 어디였나', '업체별 운영 노선이 언제 바뀌었나' 같은 노선 운영 이력을 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 경기도 버스 데이터(정류장·노선 원장, 도착정보 등)와는 같은 기관의 노선ID(route_id)나 노선명·업체명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 일자별 버스 노선 운행 정보로, 특정 날짜에 각 노선을 운영한 운수업체 및 노선 정보를 포함합니다. 주요 항목으로는 '수집일자', '업체ID', '노선ID', '업체명', '노선명'이 있으며, 이를 통해 특정 날짜에 어떤 업체가 어떤 노선을 운행했는지 추적할 수 있습니다. 특히 '노선ID'와 '노선명'은 노선별 운행 현황을 파악하는 데 핵심적이며, '업체ID' 및 '업체명'을 통해 운행 주체 확인이 가능합니다. 이 데이터는 과거 노선 운영 기록 분석, 운수업체별 노선 운영 패턴 파악, 특정 일자의 노선운행 실태 점검 등에 활용될 수 있으며, 노선변경 이력, 노선별 민원 대응, 정류장 운영 최적화 등에도 중요한 자료로 쓰입니다.
