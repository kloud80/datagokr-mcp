summary_user: 서울 영등포구가 2017년 6~7월에 시행한 도로굴착·노후불량 도로 정비공사를 공사 위치(도로명주소)별로 한 건씩 담은 파일(csv, 약 94KB)로, 아스팔트·콘크리트·혼합포장·보도의 폭과 연장, 공사 시작·종료일을 포함한다. 구청 도로 담당자나 분석가가 '해당 기간 영등포구 어느 구간에서 어떤 포장재로 얼마만큼 굴착·재포장 공사가 있었나'를 확인하거나 향후 유지보수 계획의 기초 자료를 만드는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 위치(도로명주소) 문자열을 주소 매핑하거나 같은 기관(영등포구) 자료와 이름으로만 이어 쓴다.
description_portal: '- 서울특별시 영등포구에서 2017년 6월 1일부터 7월 31일까지 실시한 도로굴착공사 현황임- 본 정비 사업은 지역 내 노후화되고 파손된 도로의 안전성을 확보하고, 보행자와 차량의 통행 편의성을 높이기 위한 목적으로 추진됨- 공사 대상은 영등포구 전역의 중 보조간선도로 및 이면도로 등으로, 균열, 포트홀, 침하 등의 현상이 발생한 구간을 대상으로 시행됨- 도로의 재질은 주로 아스팔트 및 콘크리트로 구성되어 있으며, 각 도로의 상태에 따라 재포장, 보수, 표면 정비 등의 방식으로 작업이 진행됨.- 정비 구간과 위치는 도로명주소를 기준으로 세부적으로 나뉘며, 각 공사마다 착공일과 준공일이 명시되어 시행됨.- 본 자료는 해당 기간 동안의 공사 위치, 도로 재질, 공사 목적, 정비 일정 등 종합적인 정보가 포함된 현황 보고서로, 도로 관리 및 향후 유지보수 계획 수입을 위한 기초 자료로 활용될 수 있음- 각 항목명: 위치(노후불량 도로의 위치), 아스팔트포장폭(불량도로의아스팙느포장폭), 아스팔트포장연장(불량도로의 아스팔트포장연장), 콘크리트폭(불량도로의 콘크리트폭에 대한 항목), 콘크리트연장(불량도로의 콘크리트연장에 대한 항목), 혼합포장폭(불량도로의 혼합포장폭), 혼합포장연장(불량도로의 혼합포장연장), 보도폭(불량도로의 보도폭), 보도연장(불량도로의 보도연장), 공사시작(노후불량 도로 공사시작일자), 공사종료(노후불량 도로 공사종료일자), 데이터기준일자(데이터기준일자)'
