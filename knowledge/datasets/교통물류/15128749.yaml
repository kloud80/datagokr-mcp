summary_user: 증평군 관내에서 이사화물 중심의 화물자동차 운송주선업을 하는 업체를 업체별로 한 줄씩 담은 원천 목록으로, 업체명·업종·사업자·주소·연락처·데이터기준일자로 구성되며 실측 파일은 142바이트로 소수 업체만 담긴다. 증평군 주민이 이사를 앞두고 "이 이사업체가 등록된 주선업체인가, 연락처는 무엇인가"를 확인하거나, 분석가가 군 내 이사업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 업체명·주소를 이름 매칭하는 방식으로만 이을 수 있으며, 허가 여부의 기준 데이터인 전국화물자동차운송사업자표준데이터와 대조해 쓴다.
description_portal: 충청북도 증평군_화물자동차 운송주선사업(이사화물) 업체 현황은증평군 관내에서 이사화물 중심의 화물자동차 운송주선업을 운영하는 업체에 대한 정보를 제공하는 데이터입니다.이 데이터는 화물자동차 운수사업법에 따라 등록된 이사전문 주선업체를 대상으로 하며,주민들의 이사 편의성과 사업자의 합법적 영업 활동 보장을 위한 자료입니다.데이터는 업체명, 업종(운송주선업 유형), 사업자명, 주소,연락처(전화번호), 데이터기준일자로 구성되어 있으며,사업자 등록 상태, 소재지 구분, 최신 운영 여부 등을 파악할 수 있도록 구성되어 있습니다.해당 데이터는 이사화물 운송 수요 증가에 따른 생활물류 서비스 품질 향상,불법·무허가 업체 예방, 지역 내 운송업체 분포 분석,생활밀착형 물류정책 수립 등에 활용할 수 있습니다.또한 위치 기반 물류안내 서비스, 주민 이사정보 제공 서비스,이사 시 안전한 업체 선택 가이드 제공 등 다양한 공공 서비스의 기반자료로 쓰입니다.
