summary_user: 경기도 내 도로 위 교량 등 도로시설물을 시설물 한 건씩 담은 현황으로, 집계연도·시군·시설물명·유형·위치·준공연도·도로 종별·노선명을 기록한다. 지자체 담당자나 분석가가 '우리 시군에 준공 30년이 넘은 교량이 몇 개이고 어느 노선에 있는가' 같은 노후 시설물 분포 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·노선명 같은 이름 매핑으로만 잇고, 터널·교량·지하차도 제공표준 데이터와 항목을 맞춰 비교하는 방식으로 쓴다.
description_portal: 이 데이터는 경기도 내 도로 위에 설치된 교량을 중심으로 한 도로시설물의 기본 현황을 집계한 자료로, 도로 기반 시설물의 지역별 분포 및 관리 기준 설정에 활용됩니다. ‘집계년도’는 해당 정보가 수집된 기준 연도를 나타내며, ‘시군명’은 시설물이 위치한 행정구역입니다. ‘시설물명’은 교량 등 도로시설의 개별 명칭이며, ‘시설물구분명’은 교량 등 시설물의 유형, ‘시설물위치’는 실제 위치 정보, ‘시설물준공년도’는 해당 시설물이 완공된 연도를 의미합니다. ‘종별구분명’은 도로의 기능적 구분이며, ‘노선명’은 시설물이 연결된 도로의 번호 또는 명칭을 나타냅니다.
