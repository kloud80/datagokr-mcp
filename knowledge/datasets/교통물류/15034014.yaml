summary_user: 부산광역시 전역에 설치된 버스정보안내기(BIT)를 한 대씩 담은 현황으로, 정류장 번호 5자리, 정류장 위치명, 지번·도로명 주소, 위도·경도, 설치 또는 교체연도를 담는다. 교통 분석가나 시민이 '우리 동네 어느 정류장에 도착 안내 전광판이 있고 언제 설치·교체됐는가'를 확인하거나 안내기 설치 공백 지역을 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 부산 버스정류장·실시간 도착 정보와는 정류장 번호(stationNum)나 정류장 이름을 맞춰 보거나 좌표로 겹쳐 이어 쓴다.
description_portal: 부산광역시 전역에 설치되어 있는 버스정보안내기(BIT) 현황에 관한 자료입니다. 부산광역시 교통정보서비스센터에서 통합 관리하고 있으며 총 2,200여대 정도 설치되어 있고, 승객들에게 실시간 버스 도착 정보를 안내하여 시민들의 대중교통 이용 편리성을 크게 향상시키고 있으며, 교통정보의 신뢰성과 접근성을 높이는 중요한 역할을 하고 있습니다. 정류장 위치에 따른 정류장 번호 5자리와, 지번주소 또는 도로명주소, 좌표정보(위도, 경도), 설치연도 또는 교체연도를 조회할 수 있는 서비스입니다.
