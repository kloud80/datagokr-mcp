description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 시민편의 및 운영정보 데이터로, 도시철도 1호선 역사별 출구 위치 정보를 제공하는 공간정보 데이터입니다. 데이터에는 역명, 출구번호, 위도(Latitude), 경도(Longitude) 좌표 등의 주요 항목이 포함되어 있으며, 각 역사 출구의 위치 현황을 지도 기반으로 확인할 수 있는 자료입니다. 해당 데이터는 도시철도 이용자의 이동 경로 확인, 위치 기반 서비스 활용, 역사 접근성 분석 및 시설 운영 관리를 위한 기초자료로 활용할 수 있습니다. 또한 출구 위치 정보를 활용하여 도시철도 이용 편의 개선과 교통약자를 포함한 이용객의 접근성 향상을 위한 자료로 활용할 수 있습니다. 본 데이터는 출구 위치 변경 등 변동 사항 발생 시 갱신되며, 도시철도 시설 위치 정보를 반영합니다.'
