summary_user: 경상남도 시군별 어린이보호구역 개선사업을 사업 건별로 담은 파일로, 시군·시설명·사업내용과 집행금액·도비·시군비(백만원 단위)를 기록한다. 학부모나 지역 분석가가 "우리 시군의 어느 학교·시설 앞 보호구역에 어떤 개선사업이 얼마의 도비·시군비로 시행됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명과 시설명을 이름으로 맞춰 전국 어린이보호구역 표준데이터 등과 이어 쓴다.
limits: 공통 코드 형태의 조인 키가 없어 다른 데이터와는 시군·시설 이름 매핑으로만 연결된다. 범위는 경상남도 한 시도이며, 시군에서 취합되지 않은 내용은 빠져 있어 도 전체 사업을 빠짐없이 담았다고 보기 어렵다.
