summary_user: 전국 민간(사설) 구급차를 차량 한 대씩 기록한 파일 데이터로, 차번호·유형구분·최초등록일·제작년도·원동기형식·차령만료일자·삭제일자를 담는다. 응급의료 분석가나 지자체 담당자가 "차령 만료가 다가오는 사설 구급차가 얼마나 되고 어떤 유형인가"를 확인하거나 구급차 노후도를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 차번호 같은 이름·값 매칭이나 같은 기관(한국교통안전공단) 자동차 검사·등록 자료와의 연결로만 이어 쓴다.
description_portal: 이 데이터는 구급차 번호, 소유자(사설 앰뷸런스 업체), 연락처 정보 등을 포함하고 있습니다. 각 구급차의 차량 번호와 소유자에 따라 식별되며, 구급차등록일자 항목을 통해 등록된 날짜를 추적할 수 있습니다. 이 정보는 사설 앰뷸런스 업체와의 연락을 원활하게 하고, 구급차 관리에 중요한 기초 자료로 활용됩니다. 또한, 차령만료일 등 사설 앰뷸런스 업체가 법적 요구사항에 맞춰 정기적인 점검을 실시할 수 있도록 지원합니다. 이 데이터는 구급차 운영 효율성을 높이고, 응급 서비스의 품질을 유지하는 데 중요한 역할을 합니다.
