summary_user: 가해운전자 연령층별로 전국 교통사고의 사고건수와 사망자·중상자·경상자·부상신고자 수를 연간 단위로 집계한 통계 파일로, 경찰이 조사·처리한 인적 피해 사고만 담는다(csv 398바이트 규모의 소량 집계표). 고령 운전자나 초보 연령대 운전자가 일으키는 사고가 다른 연령층보다 많은지, 사고 대비 사망·중상 비율이 어느 연령층에서 높은지 따지는 정책 분석가·보험·언론의 질문에 쓴다. 실측 컬럼에 전역 조인 키나 지역 코드가 없어 다른 데이터와는 연령층 이름을 맞춰 붙이거나 같은 기관의 다른 교통사고 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '- 가해운전자 연령층별 교통사고 사고건수, 사망자수, 중상자수, 경상자수, 부상신고자수  * 부상자수 : 중상자수 + 경상자수 + 부상신고자수   ** "사망" 이란 교통사고 발생시로부터 30일이내에 사망한 경우 (99년까지는 72시간 이내)   ** "중상" 이란 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우   ** "경상" 이란 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우   ** "부상신고" 란 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우- 경찰에서 조사, 처리한 교통사고에 대한 통계 정보로 인적 피해가 있는 사고만 집계 됨 - 교통사고분석시스템(http://taas.koroad.or.kr)의 데이터를 바탕으로 함- 교통사고 통계는 연간 단위로 집계되어 당해년도 통계는 차년도에 제공'
