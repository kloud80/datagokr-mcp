summary_user: 서울 종로구 안에서 고정형 CCTV로 불법주정차를 단속하는 지점을 지점 한 곳당 한 행으로 담은 위치 목록이며, 지번 주소·위도·경도·자치구·단속지점명·현장구분을 포함한다. 주민·운전자는 특정 골목이나 도로에 단속 CCTV가 있는지 확인하는 데 쓰고, 분석가는 불법주정차 민원 다발 지점과 실제 단속 위치를 비교해 CCTV 배치가 비어 있는 곳을 찾는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 위도·경도 좌표나 지번 주소로 공간 매칭하거나 자치구 코드(CGG_CD)로 같은 구 단위끼리 묶어서 잇는다.
description_portal: 본 데이터는 서울특별시 종로구 내 고정형 CCTV를 이용한 불법주정차 단속 지점 정보를 정리한 자료입니다. 주요 항목으로는 CCTV 설치 지점의 지번 주소, 위도 및 경도 좌표, 자치구명, 단속지점명, 현장구분 등의 정보가 포함되어 있으며, 도로교통 질서 확립 및 도시 안전을 위한 주정차 단속 운영 현황을 확인할 수 있습니다. 본 자료는 위반 다발 지역의 공간적 분포를 파악하고, 행정처분의 사각지대 해소 및 교통 혼잡 완화 대책 마련에 활용될 수 있습니다. 또한 불법주정차 민원 발생 빈도와 실제 단속 위치를 비교하여 효율적인 CCTV 배치 조정, 단속 방식 개선, 무인단속 행정의 정합성 확보 등 교통 행정 전반에 대한 실효성 높은 분석 자료로 제공됩니다.
