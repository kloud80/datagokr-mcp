summary_user: 경기도 김포시에 설치된 버스정보안내단말기(BIT)를 단말기별로 정류소명·정류소번호·지번 주소·위도·경도·단말기종류·설치년도와 함께 담은 건별 원천 파일(csv)이다. 시민이나 교통 분석가가 '우리 동네 정류장 중 도착정보 안내기가 없는 곳은 어디인가', '설치가 오래된 단말기는 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 정류소번호·정류소명으로 김포시 정류장 원장이나 버스 도착정보와 맞추거나, 위도·경도로 지도·행정구역 자료와 공간 결합해 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 정류소번호·이름 매칭이나 좌표로만 연결된다. 범위는 김포시 한 곳뿐이라 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다.
