summary_user: 시흥도시공사가 운영하는 유료 노외·노상 공영주차장과 무료 나눔주차장을 주차장 한 곳당 한 행으로 담은 파일로, 구분·유료 여부·주차장명·주소·주차면수·운영시간·기준일자를 담는다. 시흥시 주민이나 방문객이 '목적지 근처에 무료로 쓸 수 있는 공영주차장이 있는지, 몇 면이고 몇 시까지 여는지'를 확인하는 데 쓴다. 실측 컬럼에 주차장관리번호 같은 전역 조인 키가 없어 전국주차장정보표준데이터 등 다른 데이터와는 주차장명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 좌표·요금·주차장관리번호가 없어 표준 원장(전국주차장정보표준데이터)과 바로 결합되지 않고, 실시간 주차 가능 대수는 담지 않는다. 연결은 주차장명·주소 문자열 매칭에 의존하므로 표기 차이에 주의해야 한다.
