summary_user: 국가교통정보센터가 관리하는 도시 간 구간의 기본 정보를 구간 단위로 담으며, 구간 식별자와 구간명, 시작·종료 도시명, 등록·수정 일시로 구성된 전국 범위의 비공간 기준 목록이다. 교통 분석가나 서비스 개발자가 "이 도시 구간 ID는 어느 도시에서 어느 도시까지인가"를 확인하거나, 구간 ID를 사람이 읽을 수 있는 이름으로 바꿀 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 도시 구간 ID(CTY_SCTN_ID)를 쓰는 국가교통정보센터 계열 데이터와 맞추거나 시작·종료 도시명을 이름으로 매핑하는 방식으로만 연결한다.
