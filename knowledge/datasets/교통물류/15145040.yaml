description_portal: '공항 유도로 조명정보는 공항 내 유도로(Taxiway)에 설치된 지상 유도 조명등의 종류, 위치, 좌표를 제공합니다.제공 항목은 공항식별자, 공항명, 유도로식별자, 조명위치, 좌표로 구성되어 있습니다.조명위치값은 국제민간항공기구(ICAO) AIXM 표준에 따라 다음과 같이 구분됩니다.EDGE: 유도로 가장자리를 따라 설치된 경계등CL: 유도로 중심선에 설치된 중심선등TWY_INT: 유도로와 유도로가 만나는 교차점 표시등RWY_INT: 유도로와 활주로 접속 지점을 표시하는 접속등좌표는 위도·경도 10진수(Decimal Degrees) 형식으로 제공되며,예) 37.4659370339301, 126.422218756108처럼 표기합니다.이 데이터는 항공기 지상이동 안전 확보와 야간·저시정 운항 지원을 위해 사용됩니다.'
