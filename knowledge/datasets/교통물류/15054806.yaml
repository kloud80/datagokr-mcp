summary_user: 울산광역시의 자동차 등록 현황을 용도(자가용·영업용·관용)와 차종(승용·승합·화물·특수)별 대수, 외국산 차량 현황, 민원별(신규·이전·말소·전입·전출·변경) 처리 건수로 묶은 집계 파일(zip)입니다. 울산 지역의 차량 등록 대수 추이나 신규 등록·말소 같은 민원 처리 규모를 확인하려는 분석가나 지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명이나 기관 코드로만 맞춰 이어 쓴다.
description_portal: 해당 자료는 매월 말일 기준으로 자료를 추출하여 생성되는 자료로서 익월 초에 자료를 등록할 예정입니다.울산광역시의 자동차(자가용, 영업용, 관용), 항목(승용, 승합, 화물, 특수), 대수  현황 정보를 제공하는 자료로 총 3가지 파일을 압축하여 등록이 될 예정 입니다.각각의 자료는 아래와 같이 구성됩니다. 1. 울산광역시 용도별 차량등록현황2. 울산광역시 외국산차량등록현황3. 울산광역시 민원별차량등록현황 3번 자료의 경우 비교 수치를 제공하기 위하여 이전의 자료들이 함께 첨부됩니다. * 편의를 위해 압축된 파일이 등록됩니다.
