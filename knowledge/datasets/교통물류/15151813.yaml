summary_user: 전국 철도역 안에 설치된 ATM을 한 대씩 기록한 현황 파일로, 운영기관·노선·역명과 함께 지상·지하 구분, 층, 출입구 방향 같은 상세 위치, 설치 금융기관, 이용 가능 시간을 담는다. 역 이용자나 편의시설 분석가가 "이 역 안에 어느 은행 ATM이 몇 층에 있고 몇 시까지 쓸 수 있나"를 확인하거나 역별 금융 편의시설 배치를 비교하는 데 쓴다. 전역 조인 키나 역 코드가 없어 다른 역 데이터와는 운영기관명·노선명·역명을 이름으로 맞춰 이어 쓴다.
description_portal: 「철도역 ATM기」 데이터는 전국 철도역 내 설치된 ATM기의 현황을 정리한 자료로, 총 485건의 레코드와 8개 필드(철도운영기관명, 노선명, 역명, 지상지하구분, 역층, 상세위치, 금융기관명, 이용가능시간)로 구성되어 있습니다. 각 역에 위치한 ATM기의 정확한 위치(층수, 출입구 방향 등), 설치 금융기관, 운영 시간 등을 포함하고 있어 이용자가 역 내에서 금융 서비스를 편리하게 이용할 수 있도록 돕습니다. 본 데이터는 철도역 내 편의시설 현황 조사, 역세권 서비스 품질 평가, 교통 이용자 편의성 분석, ATM기 운영 효율성 검토 등 다양한 분야에서 활용할 수 있으며, 특히 역별 금융 인프라 배치와 접근성을 체계적으로 파악하는 데 유용한 기초 자료를 제공합니다
