summary_user: 대구 도시철도 1·2·3호선 역마다 인근 지진 옥외 대피소의 시설명, 연결 출구번호, 역과 대피소 사이 거리(미터)를 한 행씩 담은 작은 파일(CSV 약 2.4KB)이다. 지하철 이용자나 역 안전관리 담당자가 '이 역에서 지진이 나면 몇 번 출구로 나가 어느 대피소로, 몇 미터를 가야 하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 호선·역명을 이름으로 맞춰 대구교통공사의 역 정보나 승하차 데이터에 붙여 쓴다.
description_portal: '[ESG-Social] 본 데이터는 대구교통공사의 ESG 사회(Social) 분야 안전·보건관리 데이터로, 도시철도 1·2·3호선 각 역사별 지진 옥외 대피소 현황 정보를 제공합니다. 데이터에는 역사명, 대피소 시설명, 연결된 출구번호, 역사와 대피소 간 거리(미터) 등의 주요 항목이 포함되어 있으며, 역사 인근 대피 시설의 위치와 접근 정보를 확인할 수 있는 자료입니다. 해당 데이터는 지진 등 재난 상황 발생 시 이용자의 대피 경로 확인, 역사별 안전관리 정보 제공, 재난 대응 계획 수립 및 관련 연구를 위한 기초자료로 활용할 수 있습니다. 또한 역사와 인접 대피소 간 위치 관계를 파악하여 도시철도 이용자의 안전 확보와 재난 안내 서비스 개선을 위한 자료로 활용할 수 있습니다. 본 데이터는 대피소 위치 및 시설 정보 변경 등 변동 사항 발생 시 갱신됩니다.'
