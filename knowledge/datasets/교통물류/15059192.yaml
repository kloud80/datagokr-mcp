summary_user: 경기도 시군별로 자동차 종합·소형·전문·원동기정비업, 매매업, 폐차업, 성능점검업, 택시미터업의 사업체 수와 종사자 수를 연도(SUM_YY) 단위로 집계한 자료이며, 개별 사업장 원장이 아닌 집계값이다. 정책 담당자나 지역 분석가가 '우리 시군에 폐차업체와 정비업체가 몇 곳이고 몇 명이 일하는지, 다른 시군과 비교하면 어떤지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 자료와는 시군명(SIGUN_NM)이나 경기도 자체 시군코드(SIGUN_CD)를 이름·코드 매핑해서만 이어 쓴다.
description_portal: 이 데이터는 자동차와 관련된 정비, 매매, 폐차 등 업종별 사업체 수와 종사자 수를 시군 단위로 집계한 자료로, 지역별 자동차 관련 산업의 규모와 고용 현황을 파악하는 데 활용됩니다. 주요 항목으로는 종합정비업, 소형정비업, 전문정비업, 원동기정비업, 매매업, 폐차업, 성능점검업, 택시미터업 등의 업체 수와 각 업종에 종사하는 인원 수가 포함되어 있으며, 이는 해당 지역의 자동차 산업 활동 정도를 반영합니다. 이 데이터는 자동차 관련 정책 수립, 산업분석, 지역 고용동향 파악, 정비 및 폐차업 인프라 분석, 지역별 교통 관련 서비스 수요 예측 등 다양한 분석과 행정적 활용에 적합합니다.
