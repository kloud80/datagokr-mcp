summary_user: 경상북도 영천시 버스정보시스템에 등록된 버스쉘터를 한 행에 한 곳씩 담은 원천 목록 파일(CSV 약 196KB)로, 쉘터·정류소 식별자와 법정동, 도로명·지번 주소, 온열의자·에어커튼·조명·공공와이파이·비상벨 설치 여부를 담는다. 영천시 주민이나 교통·도시계획 분석가가 '우리 동네 정류장 쉘터에 온열의자나 비상벨이 있는지', '편의시설이 부족한 쉘터가 어느 법정동에 몰려 있는지'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 영천시 정류소 목록·도착정보와는 정류소ID(정류소아이디)를 같은 기관 코드로 맞추거나 주소·법정동명으로 매핑해 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시 관내에서 운영 중인 버스정보시스템 내 버스쉘터 정보 현황입니다.데이터는 연번, 쉘터ID, 정류소ID, 법정동명, 도로명 주소, 지번 주소, 온열체어 유무, 에어커튼 유무, 조명등 유무, 공공와이파이 유무, 비상벨 유무에 대한 정보를 포함하고 있습니다.이 데이터는 교통 서비스 개선, 도시 계획 등에 활용할 수 있으며, 대중교통 효율성 증대와 시민 편의 향상에도 크게 기여합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으신 경우 영천시 교통행정과로 연락주시기 바랍니다.
