summary_user: 전국 도시철도 운영기관별 콜센터(고객센터) 이름과 유선 전화번호, 문자 신고 전화번호를 기관 한 곳당 한 행으로 담은 작은 목록 파일(csv, 754바이트)이다. 지하철 이용객이 열차 안 불편·분실물·민원을 신고하려 할 때 "이 노선 운영기관의 고객센터 번호나 문자 신고 번호는 무엇인가"를 찾는 데 쓰고, 안내 서비스나 챗봇의 연락처 참조표로도 쓴다. 공통 조인 키는 없어 다른 철도 데이터와는 콜센터명(기관명)을 운영기관 이름에 맞춰 이어 써야 한다.
limits: 기관별 운행 구간이 없어 이 파일만으로는 특정 역·노선의 담당 기관을 알 수 없고, 기관 홈페이지나 별도 노선 데이터로 확인해야 한다. 문자 신고 번호를 운영하지 않거나 일반 휴대전화 번호로 운영하는 기관은 '정보없음'으로 표기되어 있다. 기관 코드 같은 전역 키가 없어 다른 데이터와 연결할 때는 이름 매핑이 필요하다.
