description_portal: 이 데이터는 부산항만공사의 외내항 컨테이너 통합 집계 정보로, 연도와 월, 분기별로 수출입 구분과 선박 국적(아국선·외국선), 적공 상태(적컨·공컨)를 기준으로 컨테이너 처리 현황을 기록합니다. 10ft, 20ft, 40ft 등 규격별 컨테이너 개수와 전체 TEU 집계가 포함되어 항만 물류 흐름을 정량적으로 분석할 수 있습니다. 이를 통해 항만별, 부두별 컨테이너 수송량을 파악하고, 내항·외항 및 수출입 특성을 비교하여 물류 정책과 운영 전략을 수립할 수 있습니다. 또한 항만 이용 현황 분석, 선박별 적재 효율 평가, 물류 수요 예측 등 다양한 행정과 연구 분야에서 활용될 수 있는 중요한 기초 데이터입니다.
