summary_user: 인천도시철도 1호선 평일 하선(검단호수공원역→송도달빛축제공원역 방향) 열차마다 시발역·종착역·열차번호와 33개 역별 출발시각을 한 행으로 담은 시각표 파일(csv, 약 50KB)이다. 승객이나 분석가가 '평일 아침 계산역에서 송도 방향 열차가 몇 분 간격으로 오는가', '예술회관역 종착 열차는 언제 끊기는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 역 이름을 기준으로 상선·주말 시각표나 같은 기관의 역 단위 데이터와 맞춰 이어 쓴다.
description_portal: 인천교통공사에서 운영하는 인천도시철도 1호선 평일 하선(검단호수공원역에서 송도달빛축제공원역 방향) 열차운행시각표 입니다.해당데이터는 시발역, 종착역, 열차번호, 경유역별 열차출발시각 정보로 구성되어있습니다.인천지하철 1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역을 운영하고 있습니다.인천1호선 평일 하선 열차운행시각표의 시발역은 검단호수공원역, 박촌역, 예술회관역, 작전역입니다.또한 종착역은 국제업무지구역, 동막역, 송도달빛축제공원역, 예술회관역, 작전역입니다.대부분의 시발역과 종착역은 검단호수공원역과 송도달빛축제공원역입니다.인천1호선 평일 운행시간은 역별로 상이하나 전체적인 열차운행은 05시 30분에 시작하여 익일 00시 59분에 종료됩니다.이 자료는 2025년 6월 28일 개통한 인천 1호선 3개역(검단호수공원역, 신검단중앙역, 아라역)이 반영된 데이터입니다.
