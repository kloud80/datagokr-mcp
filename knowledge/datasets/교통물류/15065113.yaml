description_portal: 전국 18개 국토 관리 사무소 별로 수행한 자체 정비 내역에 대한 데이터로 각 국토의 사무소 명, 작업 일자, 작업 내용, 작업 시간(시작, 종료), 장비 번호, 장비 명 항목 등을 제공합니다.자체 정비 작업 일지에는 작업 정보, 정비 내역, 부속품 및 유류사용 내역 등 데이터가 있는데, 장비정비정보(자체) 파일 데이터에 미제공된 데이터 항목들이 있습니다.작업 정보에서 작업일자, 작업일지번호, 회계구분, 정비사 데이터가 있고, 정비 내역에 정비구분, 장비번호, 예비장비번호, 장비명, 운전원 명, 작업내용, 작업 시간(시작, 종료), 실작업시간(분) 데이터가 있습니다.부속품 및 유류사용 내역에는 장비번호, 장비명, 품명, 단위, 수량, 최종주행거리, 비고 등을 제공합니다.
