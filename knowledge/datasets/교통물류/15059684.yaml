description_portal: 광양항 항만도로 내 컨테이너 차량의 게이트별 도로 운행 데이터입니다. 차량정보(개인정보로 인한 마스킹처리), 진입게이트, 진입일시, 진출게이트, 진출일시, 작업시간으로 구성되어 있습니다. 데이터 갱신주기는 반기입니다.이 데이터는 항만도로 내 차량 이동 패턴을 분석해 물류 동선 최적화, 게이트 운영 효율화, 교통 혼잡 완화 등에 활용할 수 있습니다. 특히 진입과 진출 게이트 간 불균형은 교통 흐름 관리와 시설 개선 방향을 수립하는 근거 자료가 될 수 있으며, 출입 시간대와 작업시간 데이터를 연계하면 물류 처리량 분석 및 배후단지 운영 효율성 검토에도 유용합니다.
