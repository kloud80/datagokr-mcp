summary_user: 인천공항 제1여객터미널(T1) 단기주차장의 주차면별 현황을 담는 실시간 조회 API로, 주차면 번호·주차장·주차구역 구분과 함께 각 면의 점유 상태와 차량 입차 시간을 건별로 제공한다. 공항을 이용하는 여행객이나 주차 안내 서비스 개발자가 "지금 T1 단기주차장 어느 구역에 빈 면이 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 없으며, 터미널 구분(terno)이나 주차장·구역 이름을 기준으로 같은 기관의 다른 공항 데이터와 이름 매핑으로만 연결한다.
limits: 포털 설명상 현재 T1 단기주차장만 제공되며 T2 등은 포함되지 않고, 주차면 위치 도면은 API가 아닌 별도 PDF로 확인해야 한다. 다른 기관 데이터와 붙일 공통 코드가 없어 이름·코드 매핑이 필요하며, 개발계정은 일 1,000회 호출로 제한된다.
