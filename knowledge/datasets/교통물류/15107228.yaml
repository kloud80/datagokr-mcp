description_portal: 인천국제공항공사에서 제공하는 주차면 현황정보에 대한 데이터입니다. 인천국제공항 터미널 아이디를 검색 조건으로 하여 인천공항 주차면에 대해 차량 주차면 입차 시간, 주차면 상태,주차면 번호, 주차장 구분, 주차구역구분,터미널구분을 제공하는 서비스입니다. 개발계정 일 1000 트래픽, 운영계정 신청 시 일 10000 트래픽을 제공합니다. 데이터 포맷은 JSON 과 XML을 모두 제공합니다.T1 단기주차장만 제공되며 추후에 T2 단기주차장 등 추가될 예정입니다.도면 정보도는 PDF 파일로 제공되오니 참고 부탁드립니다.
