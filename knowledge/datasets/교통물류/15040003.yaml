description_portal: 여수시 시민 여객선 운임에 부과되는 터미널이용료 기초자료 정보입니다. 여객선터미널(대합실) 이용 시 부과되는 터미널 이용료 기준정보입니다.여수시민이 연안여객선 이용 시 부담하는 터미널 이용료(여객터미널 이용료, 여객시설사용료)에 대한 정보를 제공하여 이용 편의 증진 및 불필요한 민원 해소를 도모하기 위함입니다.여수시민 터미널 이용료는 여수연안 여객터미널과 거문도 여객터미널을 이용하고 있는 비용의 일부를 제공함으로써  각 터미널별 이용객수 징수액 통계 및 선사별 티켓 예매시 이용료 포함 여부를 안내하고 있습니다.여수시민 대상 터미널 이용료 감면함으로써 이용자에 대한 요금 할인 혜택을  부여하기 위함입니다.
legal_basis_portal: 여수시민 터미널 이용료는 여수연안여객터미널 거문도 여객터미널 에서 여수시민이 내고 있는 터미널 이용료를 한국해운조합과 여수광양항만공사에서 이용하고있는 이용자들에 대한 정보를 제공받아 보유함
