summary_user: 대구광역시 어린이보호구역별로 블랙박스 영상에서 식별한 이동체 위험요소를 날짜·시간·구간(시작·종료 좌표) 단위로 담은 파일 데이터로, 승용·승합차, 사람, 자전거, 버스, 트럭, 개인형 이동수단, 오토바이, 건설 중장비, 불법 적재물·이동식 홍보물 등의 유형별 개수를 기록한다. 교통안전 담당자나 분석가가 '어느 보호구역의 어느 구간, 어느 시간대에 위험 이동체가 많이 나타나는가'를 따져 시설 개선이나 단속 우선순위를 정하는 데 쓴다. 전역 조인 키는 없어서 보호구역명·주소·관할경찰서명을 이름으로 맞추거나 위경도 좌표로 공간 결합해 어린이보호구역 표준데이터나 단속카메라 위치와 이어 쓴다.
description_portal: 어린이 보호구역 내에서 시간대별, 구간별로 이동하는 차량 및 기타 이동체의 위험 요소를 분석한 자료입니다. 이 데이터는 2021년 기업매칭 지원사업을 통해 구축되었으며, 차량용 블랙박스 영상 기반으로 어린이 보호구역 내 위험 요소를 식별하고 기록한 결과물입니다. 위험 발생 시간, 위치 정보(위경도), 이동체 유형, 위험도 평가 등의 항목이 포함되어 있으며, 이를 통해 어린이 보호구역 내 교통 안전 개선을 위한 정책 수립에 활용될 수 있습니다. 어린이 보호구역 내 위험 요소가 높은 구간을 분석하여 교통 사고 예방과 안전한 보행 환경 조성을 위한 교통 시설 개선 및 단속 강화 등의 정책을 수립하는 데 기여할 수 있습니다.
