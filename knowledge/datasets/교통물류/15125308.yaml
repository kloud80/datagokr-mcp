summary_user: 경기도 용인시에서 이뤄진 불법 주정차 단속을 건별로 담은 CSV 파일(약 15MB)로, 집계년도·단속일시·단속장소·단속구분을 시군구 단위로 기록한다. 시민이나 교통 분석가가 '용인시에서 주정차 단속이 어느 장소와 시간대에 몰리는가'를 확인하거나 단속 집중 구간을 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군명 같은 행정구역 이름이나 단속장소 문자열 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 용인시 주정차 단속 현황을 체계적으로 관리하고 교통 질서 유지 실태를 파악하기 위해 구축된 자료이다. 집계년도와 시도명, 시군명은 단속이 이루어진 행정 구역과 통계 기준 시점을 명확히 제시하며, 단속일시는 실제 단속이 수행된 일자와 시간을 기록하여 단속 시기별 특성을 분석할 수 있도록 한다. 단속장소는 불법 주정차가 발생한 위치를 나타내어 지역별 단속 집중 구간과 교통 혼잡 요인을 파악하는 데 활용된다. 단속구분은 위반 유형이나 단속 방식의 차이를 구분하는 기준으로 사용되어 단속 정책의 효과성을 분석하는 근거가 된다. 본 데이터는 불법 주정차 예방 대책 수립, 단속 전략 개선, 시민 교통 안전 확보 및 효율적인 교통 행정 운영을 지원하는 기초 자료로 기능한다.
