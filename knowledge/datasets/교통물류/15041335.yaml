summary_user: 서울 지하철 9호선 각 역의 위치를 역 한 곳당 한 행으로 담은 작은 파일(약 2.4KB CSV)로, 철도운영기관·노선명·역명과 십진수 도(DD) 형식의 경도·위도를 담는다. 분석가나 사업자가 '이 건물·점포가 9호선 어느 역에서 가까운가', '9호선 역세권에 들어가는가'를 판정하거나 역을 지도에 찍을 때 쓴다. 전역 조인 키나 역 코드가 없어 다른 데이터와는 역명·노선명 같은 이름 매칭이나 좌표 기반 거리 계산으로 이어 쓴다.
description_portal: 서울시메트로9호선에서 운영하는 노선의 역 위치에 대한 데이터로, 철도운영기관명, 선명, 역명, 경도, 위도의 데이터가 있습니다.현재 제공되고 있는 역위치 표시는 십진수 형식 도(DD)  위도와 경도로 소수점을 이용한 좌표로 표현 되어 있습니다.위도와 경도는 지구본에서 특정 위치를 찾을 때 쓰는 점들입니다. 위도와 경도를 찍을 때는 형식에 맞게 따랐는지 그리고 알맞은 기호를 표시해 이해할 수 있게 하였는지 확인해야 합니다. 지도 위의 서로 다른 여러 개의 위도와 경도 위치를 확인해보고 이들을 표시 해보세요. 위도와 경도는 위도 한 줄과 경도 한 줄을 그려 나타낼 수 있습니다. 위도와 경도의 특정 위치는 도, 분, 시, 그리고 소수점을 이용한 좌표로 나타낼 수 있습니다.
