summary_user: 외항 선박의 입항 건별로 적하목록관리번호·BL·MSN 단위의 컨테이너 반입·반출 내역(컨테이너번호·규격·사이즈, 항구청, 입출항일시, 업체)을 담는 전국 범위의 건별 원천 데이터다. 분석가나 물류 사업자가 특정 항만에서 어떤 선박이 어떤 규격의 컨테이너를 얼마나 반입·반출했는지 집계해 항만별 물동량 흐름이나 해운 시황을 파악하는 데 쓴다. 호출부호(clsgn)를 선박 식별 키로 삼아 선박 등록 원장이나 입출항 데이터와 잇고, 항구청코드로 항만 단위 자료와 묶어 쓴다.
description_portal: 이 데이터는 해양수산부에서 외항 화물컨테이너 정보 제공을 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 항만명, 입항년도, 호출부호, 선박명, 적하목록관리번호, BL번호, MSN번호, 입출항일시, 반출입구분, 컨테이너번호, 컨테이너규격, 컨테이너사이즈 등으로 구성되어 있습니다.   본 데이터는 해양수산부 외항화물컨테이너정보를 분석하여 항만별 물동량 흐름, 선박별 이용 현황, 컨테이너 유형별 운송 규모를 파악하는 데 활용될 수 있습니다. 또한 수출입 물동량 예측, 항만 운영 효율성 제고와 관련된 연구, 항만 시설 규모 조정 등 정책 수립 자료로 쓸 수 있습니다.
