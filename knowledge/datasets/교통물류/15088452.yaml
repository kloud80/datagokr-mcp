description_portal: < 용도별 차종별 연료별 연간 자동차 주행거리 - 단위(천km)>국내에 등록되어 도로를 운행 중인 자동차의 용도별, 차종별, 연료별 시도별 연간 평균 자동차 주행거리 현황입니다.우리나라 전국과 시도(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)로 구분하고차종별 (승용차, 승합차, 화물차, 특수차)와 각 차종별의 연료별(휘발유, 경유, LPG, 기타) 로 구분하여 제공하고 있습니다. 구분된 기준을 바탕으로 연간 평균 주행거리를 제공하고 있습니다. 천km 단위로 제공하고 있습니다.
