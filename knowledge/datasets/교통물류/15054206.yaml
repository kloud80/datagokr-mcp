summary_user: 남양주시 읍면동별로 승용·승합·화물·특수 차종별 자동차 등록 대수를 집계한 통계 파일로, 차량 소유자 주소지 기준 읍면동 단위 집계이며 포털 설명상 2025년 12월 31일 기준입니다. 남양주시나 지역 분석가가 "어느 읍면동에 화물차·승용차 등록이 많아 주차·교통 인프라 수요가 큰가"를 따질 때 쓴다. 전역 조인 키(행정동 코드 등)가 없어 읍면동 이름을 행정구역 코드표나 같은 시의 인구·주차장 통계와 이름으로 맞춰 이어 써야 합니다.
limits: 읍면동 단위 집계라 개별 차량·차량번호·검사 이력 같은 건별 정보는 없고, 범위는 남양주시 하나에 한정됩니다. 행정동 코드가 없어 다른 데이터와 연결할 때 읍면동 이름 표기 차이를 직접 맞춰야 합니다.
