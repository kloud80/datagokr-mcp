summary_user: 인천교통공사가 운영하는 인천1호선(33개역)·인천2호선(27개역)·7호선 인천·부천구간(11개역) 총 71개 역의 자전거보관소를 역 단위로 정리한 2025년 6월 30일 기준 현황 파일로, 역명·위치·개소 수·보관가능대수·자전거 이동로가 설치된 출구를 담는다. 자전거로 지하철역까지 이동하려는 시민이 어느 역 몇 번 출구 쪽에 보관소가 있고 몇 대를 세울 수 있는지 확인하거나, 분석가가 역별 자전거 환승 수용력을 비교하는 데 쓴다. 전역 공통 조인 키가 없어 역 좌표·출입구 등 다른 역 데이터와는 역명(역 명)을 맞춰 연결해야 한다.
description_portal: 인천교통공사에서 운영 중인 도시철도 인천1호선, 인천2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준  역사별 자전거 보관소 현황자료입니다.해당 데이터는 역명, 위치, 개소, 보관가능대수, 이동로설치 출구 항목으로 구성되어있습니다.인천1호선 검단호수공원역에서 송도달빛축제공원역까지 33개역, 인천2호선 검단오류역에서 운연역까지 27개역, 7호선 인천·부천구간 까치울역에서 석남역까지 11개역으로총 71개역의 정보가 수록되어있습니다. 자전거보관소는 각 역에 1개소 이상 위치하고 있으나 자전거이동로가 없는 역도 존재합니다.
