summary_user: 대구광역시 도로를 국토교통부 표준 노드-링크 체계의 링크 구간 단위로 나눠, 링크마다 출발·도착 표준노드, 지도상 거리, 도로등급·유형, 도로명, 연결로·통행제한차량 유형, 적용시작일자를 담은 파일(csv, 약 390KB)이다. 교통 분석가나 도시계획 담당자가 "대구 시내 특정 도로명 구간이 어떤 링크들로 이뤄지고 길이와 등급은 어떤가"를 확인하고, 소통·통제·돌발 같은 링크 단위 교통정보를 도로망에 얹을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 표준링크ID·표준노드 값이나 도로명을 맞춰 국토부 ITS 표준노드링크 마스터나 같은 기관의 교통정보와 이어 쓴다.
limits: 검증된 전역 조인 키가 없어 다른 데이터와의 연결은 링크ID·노드 값이나 도로명 매칭에 의존하며, 일치 여부를 직접 확인해야 한다. 도형(좌표·선형)은 없는 비공간 표 자료라 지도에 그리려면 국토부 ITS 센터가 배포하는 표준노드링크 SHP가 따로 필요하다.
