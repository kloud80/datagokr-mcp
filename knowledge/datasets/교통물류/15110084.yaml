summary_user: 대구광역시 달서구 안에서 접수된 불법주정차 민원을 발생 장소(소재지)별로 정리해 누적 발생건수, 현장정보, 위도·경도 좌표와 함께 담은 1회성 CSV 파일(약 1.6MB)이다. 구청 교통 담당자나 분석가가 '달서구에서 불법주정차 민원이 반복적으로 몰리는 지점은 어디인가'를 찾아 단속·주정차 금지 구역 지정 같은 예방 대책의 기초자료로 쓴다. 전역 조인 키나 행정코드는 없으므로 위도·경도 좌표로 지도에 올리거나 주소(소재지) 이름을 맞춰 단속카메라·보호구역 등 다른 규제·단속 데이터와 공간적으로 겹쳐 본다.
description_portal: 대구광역시 달서구 내에 불법주정차 민원 정보에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.순번, 민원발생, 민원발생지, 누적발생건수, 현장정보, 위도, 경도 등으로 구성되어있으며, 해당 데이터는 엑셀(CSV) 형태로 제공하며 1회성으로 추가 업데이트하지 않습니다.지역 내 불법주정차 민원 정보을 파악하는데 유용하게 참고자료로 쓸수 있으며 교통 정책, 교통 질서 관리, 주정차 위반 예방 정책 수립의 등 다양한 행정업무에 기초자료로 쓰는데 활용 가능합니다.
