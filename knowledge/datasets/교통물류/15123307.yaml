summary_user: 경기도 도로대장 전산화 시스템에 등록된 통로박스(도로 하부·인근의 보행·차량 통행용 구조물)를 시설물 한 건씩 담으며, 노선번호·구간번호·위치지점, 가로·세로 규격, 재질, 설치목적, 배수시설, 연장, 설치일자, 위도·경도를 포함한다. 도로 관리자나 분석가가 '특정 노선 구간에 어떤 재질·규격의 통로박스가 언제 설치됐는가'를 확인해 시설물 점검 대상 선정이나 위치 기반 분석에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 노선번호(route_no)·구간번호로 같은 경기도 도로대장의 다른 시설물 데이터와 맞추거나 위도·경도로 표준노드링크 같은 도로망 공간 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 도로대장전산화시스템을 통해 수집된 통로박스(도로 하부나 인근에 설치된 보행자 및 차량 통행용 구조물)에 관한 정보로 구성되어 있습니다. 항목에는 노선번호, 구간번호, 위치지점, 규격정보(가로 및 세로), 재질, 설치목적, 배수시설, 연장, 설치일자, 공간정보(위도·경도), 비고 등이 포함되어 있으며, 주로 도로시설물의 관리, 안전진단, 유지보수 및 도시 인프라 설계 시 활용될 수 있습니다. 설치목적에는 ‘차도, 보행용’, ‘통로’, ‘진출입로’ 등 다양한 용도가 명시되어 있고, 재질은 ‘철근콘크리트’, ‘콘크리트’, ‘사암’ 등으로 분류되어 있습니다. 이 데이터는 시설물의 위치 및 설계정보 분석, 구조물 유지관리 시스템 구축 등에서 유용하게 활용될 수 있으며, 공간정보가 포함되어 있어 GIS 기반의 위치기반 분석에도 적용이 가능합니다.
