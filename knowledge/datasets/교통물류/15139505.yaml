summary_user: 포항시 안의 교통 이슈(돌발상황 등)를 건별로 담는 API로, 이슈마다 유형, 발생 일시, 내용, 처리 상태, 완료 일시, 지역명과 위경도 좌표를 제공한다. 운전자나 교통 분석가가 '지금 포항 시내 어디에 교통 이슈가 있고 처리됐는가'를 확인하는 데 쓰며, 이력을 쌓으면 상습 발생 지점 분석에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위경도 좌표나 지역 이름 매칭으로만 잇는다.
description_portal: 경상북도 포항시 교통 이슈 현황 리스트 지도에 대한 데이터로 위도,경도,지역, 상태, 내용, 일시 등의 항목을 제공합니다.
