summary_user: 교통영향평가정보지원시스템에 등록된 사업을 사업 단위로 담은 전국 범위 CSV 파일(약 11.9MB)로, 사업명·사업유형·시행자·위치·사업규모(건축연면적·부지면적·세대수 등)와 유사시설 조사 정보, 도로 사업의 연장·차로수·설계속도 같은 제원을 함께 담는다. 지역 분석가나 사업자가 "우리 동네 인근에 어떤 대형 개발·도로 사업이 교통영향평가를 받았고 규모는 얼마인가"를 확인해 교통 수요나 접근성 변화를 미리 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명·위치(주소·우편번호) 같은 이름 매칭이나 같은 기관 자료와의 대조로만 잇는다.
limits: 표준 행정구역 코드나 좌표 같은 공통 키가 없어 다른 데이터와 직접 결합하기 어렵고, 비공간 자료라 지도 분석에는 주소를 따로 변환해야 한다. 시스템에 입력되지 않은 항목은 공란일 수 있다.
