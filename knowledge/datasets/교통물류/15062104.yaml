summary_user: 인천광역시 비영업용 승용차의 승용차요일제 가입 현황을 군·구별로 방문 신청·인터넷 신청·총 발급·탈퇴·실발급 건수로 나눠 담은 집계 파일이며, 포털 설명상 2012년 1월 1일부터 추출 시점까지 누적된 값입니다. 인천시 교통 담당자나 분석가가 군·구별 요일제 참여 규모와 탈퇴 비중, 방문과 인터넷 신청 비율의 차이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 군·구 이름(구분)을 행정구역 코드에 직접 매핑해야 다른 인천 군·구 단위 통계(자동차 등록 대수 등)와 이어 쓸 수 있다.
description_portal: 본 자료는 인천광역시 승용차(비영업용)를 대상으로 승용차요일제 제도에 가압한  사용자(가입자) 현황 정보 입니다.자료수집 기간은 2012년 1월1일 부터 추출인(현재)까지 누적된 데이터입니다. 인터넷신청인 경우 인천광역시 승용차요일제 홈페이지에서 신청하고 승용차요일제 RFID 태그를 가까운 동 행정복지센터에서 발급 받아야 하나 신청 후 발급 절차를 이행하지 않은 건수는 총 발급 건수에서 제외됩니다.자료의 항목은 군구별로 방문 신청건수, 인터넷 신청 건수, 총 발급 건수, 탈퇴 건수, 실발급 건수로 구분한 정보입니다.
