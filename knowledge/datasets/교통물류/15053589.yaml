description_portal: 이 데이터는 광주교통공사 1호선의 연도별 환승 현황을 나타낸 것으로, 2020년부터 2025년까지 지하철과 버스 간 환승 인원수를 역별로 구분해 기록한 표입니다. 각 행은 ‘선탑(지하철)’과 ‘후탑(버스)’ 두 가지 환승 유형을 구분하며, 각 열에는 녹동(간이)역부터 평동역까지 1호선 전 구간의 역명이 포함되어 있습니다. 숫자는 해당 연도·유형·역에서 집계된 환승 인원수를 의미합니다. 이를 통해 특정 역의 환승 규모, 연도별 변화 추세, 지하철 선탑 대비 버스 후탑 환승 패턴 차이 등을 분석할 수 있습니다. 또한 혼잡도가 높은 역이나 환승 수요 증가 구간을 파악해 교통 운영 계획 수립이나 시설 개선에 참고할 수 있는 기초 자료로 활용 가능합니다.
