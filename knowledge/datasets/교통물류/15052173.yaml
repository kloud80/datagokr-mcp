description_portal: '- 신 기후체계 가동 및 국가 온실가스 감축 목표 달성을 위해 경제운전 생활화를 유도하여 교통부문 온실가스 배출 및 에너지 소비절감, 교통사고 감소 등에 기여하고자 정보를 제공하고 있습니다.- 개방데이터는 한국교통안전공단에서지속가능교통물류발전법에 따라 에코드라이브(경제운전) 연구성과에 대한 데이터 정보입니다.- 에코드라이브 경제운전 연구성과 관련하여 등록된 정보는 실천강령, 설명,연료절감,비용절감) (*업데이트예정없음) 데이터가 있습니다.※ 제공되는 데이터는 한국교통안전공단에서 별도 제공되는 데이터와 차이가 있을 수도 있음을 인지하여 주시기 바랍니다.'
