summary_user: 한국교통안전공단의 에코드라이브(경제운전) 연구성과를 실천강령별로 정리한 소규모 전국 단위 파일(csv 약 1KB)로, 각 실천강령의 설명과 승용차 연간 1만 5천km 주행 기준 연료·비용 절감효과를 담는다. 운전자나 교육·홍보 담당자가 '급가속을 줄이는 등 경제운전 수칙을 지키면 1년에 연료와 돈을 얼마나 아끼나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 다른 자료와는 실천강령 이름을 맞춰 보는 식으로만 연결한다.
