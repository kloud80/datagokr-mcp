summary_user: 대전도시철도 1호선의 출발역과 도착역 사이 이동 인원을 자동개집표기 집계로 월별로 담은 역간(OD) 집계 파일이다(CSV 약 14만 바이트). 분석가나 상권·교통 담당자가 "어느 역에서 탄 승객이 주로 어느 역에서 내리는가"처럼 구간별 수요 흐름과 혼잡 구간, 역세권 배후지를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 출발·도착역 이름이나 대전교통공사 자체 역코드(출발역코드·도착역코드)로 같은 기관의 역별 승하차 자료 등과 맞춰 이어 쓴다.
description_portal: 이 데이터는 대전도시철도 1호선의 역간 이동 인원 현황을 제공하는 공공데이터입니다.각 출발역과 도착역 간 통행량은 **자동개집표기(게찰구)**를 통해 집계되며, 이를 통해 승객의 실제 이동 경로와 수요 흐름을 파악할 수 있습니다.자료는 월별 단위로 구성되어 있으며,**열(column)**에는 연도별 월별 정보가 오름차순으로 정렬되어 있고,**행(row)**에는 출발역 기준으로 도착역별 이용 인원이 나열되어 있어 역 간 수송 실적을 직관적으로 확인할 수 있습니다.이 데이터는 출발지-도착지 기준 수요 예측, 혼잡 구간 분석, 환승 패턴 파악, 노선별 운영 전략 수립 등에 유용하게 활용됩니다.
