summary_user: "고속철도 SRT 전체 이용객 가운데 국가유공자 이용객 수를 연도별 행, 1~12월 열로 나눠 담은 전국 단위 월별 집계표(단위: 천명)이며, 파일 크기가 351바이트인 작은 CSV입니다. 국가유공자 철도 이용 지원 정책을 검토하는 분석가가 'SRT를 타는 국가유공자가 해마다, 달마다 어떻게 달라졌나'를 확인하는 데 쓴다. 역·노선·지역 코드 같은 조인 키가 없어서, 다른 SRT 이용객 통계와는 연도·월을 기준으로 맞춰 붙여 쓴다."
description_portal: 1. 고속철도 SRT 전체 이용객 중에서 국가유공자를 대상으로한 이용객 수를 별도로 구분하여 해당 대상자에 대한 이용객 수를 연간으로 구분하여 설명하는 자료입니다. 2. 연도별 월별 국가유공자 이용객수를 확인하실 수 있습니다.3. 데이터 내 0으로 적힌 수치는 "데이터 없음"을 안내드립니다.4. 2016년 12월 국가유공자 이용객 수는 4천명입니다 (단위:천명)* 해당 데이터는 연도별 주기성 데이터입니다.* 2025년 6월 말 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.
