summary_user: 서울시 공공자전거(따릉이)의 대여 실적을 날짜별로 담은 집계 데이터로, 필드상 대여소 위치·대여소명과 대여건수·반납건수가 함께 들어 있습니다. 시민이나 분석가가 "계절·요일에 따라 따릉이 대여량이 어떻게 달라지는가", "어느 대여소의 대여·반납이 많은가"를 볼 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대여소 이름 매핑이나 서울시 내 다른 따릉이 데이터(대여소 현황 등)와 이름 기준으로만 이어 씁니다.
limits: 서울시 열린데이터광장(data.seoul.go.kr)의 별도 인증키(KEY)가 필요하며 공공데이터포털 활용신청과는 별개입니다. 공통 코드 키가 없어 대여소 좌표·행정구역 데이터와 정확히 연결하려면 이름 매칭을 따로 해야 하고, 실시간 잔여 대수 정보는 이 데이터에 없습니다.
