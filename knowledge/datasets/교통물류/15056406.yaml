description_portal: '매년 광주광역시 주요 지점에 대한 차량 속더 정보를 조사하여 정보 제공- 공간적 범위 : 광주광역시 행정구역 전역- 시간적 범위 : 광주광역시에서 매년 추진하는 과업이므로 조사결과 비교․분석의 일관성과 연속성 확보를 위해 전년도와 동일한 시기인 2025년 9월 및 10월에 조사함- 조사결과를 토대로 지속적인 도로의 관리와 도로건설, 교통 기반시설 계획, 교통시설 확충, 교통운영 개선 등 도로 및 교통정책의 기초자료로 활용- 또한, 국토교통부의 「교통정보 통합관리방안」에 따라 조사자료를 국가교통DB에 제공하고 국책연구기관 등에서 광역교통계획, 지속가능교통계획 등 각종 계획수립 및 연구에 활용코자 함'
