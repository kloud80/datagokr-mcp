summary_user: 광주광역시 주요 구간별로 오전첨두(08~09시)·주간(12~13시)·오후첨두(18~19시)·야간(20~21시) 시간대 차량 속도와 일평균속도를 담은 연간 조사 집계표이며, 포털 설명상 2025년 9~10월에 조사한 결과를 xlsx 파일 한 개(약 13KB)로 제공한다. 교통 분석가나 시민이 '출퇴근 시간대에 어느 도로 구간이 가장 느린가'처럼 구간·시간대별 혼잡 정도를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 구간명·도로명을 이름으로 맞춰 연결해야 한다.
