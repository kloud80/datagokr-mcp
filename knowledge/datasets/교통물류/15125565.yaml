description_portal: 1. 국민철도SR에서 제공하는 SRT에 가입한 회원현황 통계데이터를 제공드리고 있습니다. 2. 해당 API서비스는 'SRT 가입회원 현황', 'SRT 휴면회원 현황', 'SRT 탈퇴회원 현황'로 구성되어 제공드리고 있습니다. 3. 각각 가입, 휴면, 탈퇴로 구분된 회원 수와 누적된 회원수를 제공드리고 있습니다. * 해당 데이터는 API로 제공됩니다. * 에스알은 해당 데이터를 무료로 제공드리고 있습니다. * 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.
