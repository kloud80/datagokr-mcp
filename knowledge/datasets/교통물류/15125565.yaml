status: active
summary_user: SRT 회원의 가입·휴면·탈퇴 현황을 통계 기준일자(STATS_CRTR_YMD)별 회원 수와 누적 회원 수로 담은 전국 단위 집계 통계이며, 세 개 오퍼레이션으로 나뉘어 있다. 철도 서비스 분석가나 연구자가 'SRT 가입 회원은 시기별로 얼마나 늘었고 휴면·탈퇴는 어떻게 변했는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 기준일자를 맞춰 같은 기관(에스알)의 승하차·이용 통계와 시점 단위로 나란히 보는 방식으로만 연결한다.
limits: 개인·지역별 정보가 없는 전국 단위 비공간 집계라서 지역·역별 회원 분포는 알 수 없다. 공통 조인 키가 없어 다른 데이터와는 날짜나 기관 기준으로만 맞춰 볼 수 있다. 호출 시 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
