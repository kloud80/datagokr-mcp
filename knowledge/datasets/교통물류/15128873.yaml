summary_user: 인천광역시 부평구에 등록된 화물자동차 운송주선업체를 업체별 한 행으로 정리한 원천 목록으로, 업체명·도로명주소·전화번호를 담은 작은 CSV 파일(약 5.6KB)이다. 화주나 물류 담당자가 "부평구 안에서 화물 운송을 중개해 줄 등록 주선업체가 어디이고 연락처는 무엇인가"를 확인하거나, 구청이 민원 응대와 지역 주선업체 현황 파악에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명주소를 맞춰 연결해야 하며, 허가 여부를 교차 확인할 때는 전국화물자동차운송사업자표준데이터가 기준이 된다.
description_portal: '화물자동차 운송주선사업 현황은 부평구에 등록된 화물 운송주선업체의 업체명, 소재지, 연락처 정보를 정리한 자료운송주선사업은 화물 운송을 필요로 하는 화주와 운송사업자 간의 운송계약을 중개하는 업종이며, 관련 업체 조회 및 행정 업무에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 지역 내 운송주선업체 현황 파악– 화물 운송 중개 관련 행정 자료 제공– 민원 응대를 위한 업체 정보 확인– 물류 인프라 관련 기초 현황 조사 활용주요 항목 설명● 업체명: 등록된 화물 운송주선업체의 명칭● 도로명주소: 업체의 도로명 기준 사업장 위치● 전화번호: 운송 중개 관련 문의를 위한 연락처'
