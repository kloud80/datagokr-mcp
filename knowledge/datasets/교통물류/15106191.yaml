summary_user: 세종시 공공자전거 어울링의 대여 한 건마다 자전거 고유번호, 대여·반납 대여소와 시각, 주행거리·주행시간, 환승 여부를 담은 건별 이용 기록으로, 포털 설명상 2020년 1월부터 2025년 12월까지 약 1,290만 건이 쌓여 있다. 교통 분석가나 시 담당자가 어느 대여소에서 언제 대여가 몰리는지, 출퇴근 시간대 대여소 간 이동 흐름이 어떤지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대여소 이름을 대여소 위치 목록과 맞추는 식으로만 이어 쓸 수 있다.
description_portal: '세종특별자치시 공공자전거(어울링) 이용현황입니다.(데이터 축적기간 : 2020. 1.~2025. 12.)*2024.10.10.기준, 2023년도 어울링 이용현황 데이터를 추가하였습니다.*2025.11.12.기준, 2024년 3분기부터 2025년 2분기까지의 어울링 이용현황 데이터를 추가하였습니다.*2026.03.30.기준, 공사 어울링 사업운영기간의 데이터를 추가하여 2020년 1월 ~ 2025년 12월 까지의 어울링 이용현황 데이터를 정리(총 12,903,600건)하였습니다. - 데이터 총량 78.4% 확대(723만건 → 1,290만건)  - 데이터 축적기간 111.8% 확대(34개월 → 72개월)행복도시의 쾌적한 도시 환경에 적합한 세종시 어울링원하는 곳에서 쉽게 대여하고 사용 후 가까운 곳에 편리하게 반납하는, 자전거를 이용한 대중교통으로,평일엔 출‧퇴근용으로 사용하고, 야간 및 휴일에는 호수공원 등에서 레저용으로 사용 할 수 있는 창조적인 녹색교통수단입니다.'
