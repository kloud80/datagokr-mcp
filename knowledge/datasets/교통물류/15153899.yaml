summary_user: 한국철도공사가 화물 품목마다 운송에 쓸 수 있는 화차 차종을 품목명·적용 시작 일자·차종 단위로 짝지어 둔 전국 단위 기준 파일(CSV, 약 88KB)이다. 화주나 물류 분석가가 "이 품목은 어떤 화차로 실을 수 있고, 그 기준은 언제부터 적용됐나"를 확인하거나 차종별로 운송 가능한 품목 범위를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 철도 화물 데이터와는 품목명이나 차종 코드를 이름·코드로 맞추는 방식, 또는 같은 한국철도공사 코드 체계를 통해서만 이어 쓴다.
description_portal: 이 데이터는 한국철도공사의 화물 품목별로 취급 가능한 화차 차종을 매핑한 철도 화물 운송 기준 데이터입니다. 품목명, 적용 시작 일자, 차종명을 기록하여 각 화물 품목이 어떤 유형의 화차로 운송될 수 있는지 명확한 기준을 제시합니다. 데이터는 1950년부터 현재까지의 적용 시작 일자를 포함하여 화물 운송 규정의 역사적 변천을 추적할 수 있으며, 품목 특성에 따른 차종 선택 기준을 체계적으로 정리할 수 있습니다. 이 데이터는 화물 품목별 적합 차종 선정 및 운송 계획 수립, 차종별 운송 가능 품목 범위 파악, 화차 배차 최적화 및 활용률 제고, 신규 품목 도입 시 차종 호환성 검토, 철도 화물 운송 안전 기준 및 규정 관리, 화물 운송 서비스 다양화 및 물류 정책 연구에 필수적인 운송 기준 데이터로 활용됩니다.
