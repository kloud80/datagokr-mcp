description_portal: 이 데이터는 서울시 각 자치구별 보도(보행도로) 현황을 **포장재 종류(투수, 반투수, 비투수)**로 구분하여 연장(m)과 면적(㎡) 단위로 집계한 통계입니다. 투수 포장은 빗물 침투가 가능한 친환경형, 반투수 포장은 일부만 투과 가능한 구조, 비투수 포장은 아스팔트·콘크리트처럼 전혀 침투가 불가능한 포장을 의미합니다. 이를 통해 자치구별 친환경 보도 비율, 도시 열섬 완화, 빗물 관리 및 도시계획 정책에 반영할 수 있으며, 특정 연도의 서울시 전체 보행도로 자원 분포와 관리 현황을 한눈에 파악할 수 있습니다. 또한 도로환경 개선, 보행 안전성, 환경정책(저탄소·친환경 도시) 수립을 위한 중요한 기초자료로 활용됩니다.
