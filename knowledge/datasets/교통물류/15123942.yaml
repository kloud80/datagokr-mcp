summary_user: 경기도버스운송관리시스템(BMS)에서 교통카드와 연계된 버스 차량별 정보를 차량 단위로 담는 원장성 데이터로, 차량번호·시스템상 차량ID·운송업체 구분 ID(EB사업자ID)·운수사명을 포함한다. 분석가나 행정 담당자가 "특정 차량에서 발생한 교통카드 승하차가 어느 운수사 차량의 것인가"를 확인하거나 운수사별 보유 차량 현황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 경기도 버스 교통카드 승하차 데이터 등 같은 기관 자료와 차량ID·차량번호 같은 같은 기관 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 제공하는 교통카드와 연계된 차량별 정보 데이터로, 실제 운영 중인 버스 차량의 고유 식별자, 차량번호, 운수업체 등의 정보를 포함합니다. 주요 항목은 '차량번호', '차량ID', 'EB사업자ID', '운수사명'으로 구성되어 있으며, 차량ID는 시스템 상에서 각 차량을 식별하기 위한 고유 번호입니다. EB사업자ID는 버스운송업체를 구분하는 ID로, 운수사명과 함께 운행 주체를 명확히 나타냅니다. 이 데이터는 교통카드 이용기록과 연결되어, 특정 차량에서 발생한 승하차 데이터 분석, 노선별 운행 차량 추적, 버스 수급 현황 파악, 운송업체 운영 실태 진단 등에 활용됩니다. 또한 교통 빅데이터 분석, 수요 기반 노선조정, 차량 운영 최적화, 교통민원 대응 등 다양한 행정 및 정책 수립에 기초 자료로 활용 가능합니다.
