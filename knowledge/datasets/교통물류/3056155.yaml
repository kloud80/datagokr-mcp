summary_user: 대구 승용차요일제 가입자가 쓸 수 있는 지역 할인가맹점을 점포 한 곳당 한 행으로 담은 파일로, 구분·업종명·상호·연락처·주소·할인내용이 들어 있다(약 47KB CSV). 요일제에 가입한 시민이 '우리 동네 식당·미용실·정비소 중 할인되는 곳이 어디고 몇 % 깎아 주나'를 찾을 때 쓴다. 전역 조인 키나 코드 필드는 없어서, 다른 데이터와는 주소를 지오코딩하거나 상호·업종명을 이름으로 맞춰 이어 쓴다.
description_portal: 대중교통이용 활성화와 탄소중립을 위한 시민 자발 참여 운동인 대구 승용차 요일제 가입자 대상으로 가맹점 할인 정보를 담고 있음. 승용차요일제 혜택으로는 대중교통 이용요금의 80% 마일리지 적립과 함께, 공영주차장 50%할인, 지역 가맹점 할인혜택 등이 있음.승용차 요일제 이용자 대상으로 할인가맹점 이용시 5~10% 할인받을 수 있는 쿠폰을 제공하고 있으며, 지역 내 식당, 미용실, 자동차 정비,  꽃집, 안경점 등의 점포 정보를 담고 있으며 핸드폰으로 쿠폰을 발급받아 어플을 통해 사용할 수 있음. (업종명/상호/연락처/주소/할인내용 등 명시)
