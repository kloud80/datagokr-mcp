summary_user: 해양수산부 항만시설 사용허가 정보를 선박 입항·고지 건별로 담으며, 호출부호·선박명·사용구분·계선장소·요금종류·총사용료·납기일시 등을 포함한다. 검증 호출(입항년도 2017) 기준 전국 범위 9건, 2017-08-03~2017-09-02 기간이 수신됐다. 해운·물류 기업이나 분석가가 특정 선박이 어느 항만의 어떤 계선장소를 언제 사용했고 사용료가 얼마였는지 확인하는 데 쓰며, 호출부호(clsgn)를 선박 키로 선박 등록 원장·입출항 데이터와 잇고 항구청코드는 항만코드 매핑표를 거쳐 다른 항만 데이터와 연결한다.
description_portal: 이 데이터는 해양수산부에서 항만시설 사용허가 정보(선석 및 정박지 사용순위, 사용방법 등)를 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 사용 선박 호출번호등 정보, 사용구분, 사용료, 할인율 등으로 구성되어 있습니다.  본 데이터는 항만 관련 행정기관이 선석 및 정박지의 효율적 운영을 위한 현황 파악, 향후 시설 배정 계획 수립, 그리고 항만시설 이용 절차의 투명성 제고에 활용될 수 있습니다. 또한 해운 및 물류 기업이 항만시설 이용현황을 분석하여 운송계획 수립, 물동량 예측 등에 참고자료로 활용할 수 있습니다.
