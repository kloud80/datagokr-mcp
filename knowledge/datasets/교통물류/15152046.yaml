description_portal: 한국공항공사(Korea Airports Cooperation)에서 운영하는 원주공항 실내공기질 측정정보를 표출합니다.해당 데이터는 연간 평균기준의 데이터이며, 구성은 연도, 미세먼지, 초미세먼지, 이산화탄소, 포름알데히드, 일산화탄소, 이산화질소, 라돈, 휘발성 유기화합물 정보로 구성되어 있습니다.단위는 한글컬럼명에 맞춰서 ppm, ug/m3 등을 한글로 변환하여 표시하고 있습니다.(공공데이터 활용지원센터 권고)공항 실내대기질은 실내공기질관리법을 준수하며, 해당 기준 이하로 대기질이 유지될 수 있도록 노력하고 있습니다.22년부터 24년 3개년 데이터를 포함하고 있으며, 원주공항 실내공기질 측정 정보에 대해서 궁금하시거나 추가적인 문의사항이 있으시면 02-2660-4807로 문의주시기 바랍니다.
