description_portal: 서울특별시 중랑구의 불법주정차 단속 현황 데이터입니다. 데이터의 카테고리는 교통및물류의 도로, 주정차입니다. 제공하는 주요 항목으로는 시군구명, 단속일시, 단속동, 단속장소가 있습니다. 중랑구 불법주정차 현황 분석, 단속결과 데이터 분석 등 다양한 분야에 활용될 수 있음을 안내드립니다. 중랑구 불법주정차 단속현황 데이터 기준은 2024년, 단속결과 부과된 경우, 안전신문고로 접수된 민원입니다. 자세한 사항은 엑셀 데이터를 다운로드 받아서 확인하여 주시기 바랍니다. 감사합니다.
