description_portal: '- 전라남도에서 시행하고 있는 어린이 보호구역 개선사업의  시군, 사업명, 사업비 등 현황 정보입니다.- 전라남도 내 어린이보호구역(스쿨존)은 어린이 안전 중심의 교통환경을 조성하기 위한 법적 지정 구역으로, 전라남도 조례와 다양한 개선사업이 시행되고 있습니다.- **전라남도 어린이 보호구역 교통안전 조례(2022.4 시행)**에 따르면, 도지사는 보호구역 개선, 교통안전시설 설치·관리, 등하굣길 교통지도 등 필요한 조치를 취해야 합니다.- ‘어린이 보호구역’은 만 13세 미만을 대상으로 도로교통법에 따라 지정되며, 시설·안전장치 설치 기준이 명시되어 있습니다.- 전라남도는 연도별로 보행 안전 도로, 과속방지턱, CCTV, 교통안전표지 설치 등의 보호구역 개선사업을 추진 중입니다.'
