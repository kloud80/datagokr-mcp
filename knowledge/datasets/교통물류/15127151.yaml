summary_user: 드론(무인비행장치) 조종자격 취득 건수를 기체구분(무인비행선·무인비행기·무인멀티콥터·무인헬리콥터)과 1~4종 구분별로, 2020년까지 합계·2021~2025년 연도별·2026년 6월분·누적으로 나눈 전국 단위 집계표이다. 드론 교육·자격 사업자나 정책 분석가가 "어떤 기체·종별 자격 취득자가 해마다 얼마나 늘었나"를 보고 조종 인력 규모와 드론 산업 저변을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 드론 신고·비행승인 데이터와는 기체구분·종 구분 이름을 맞추거나 같은 기관 자료끼리 연도 기준으로 나란히 놓아 비교한다.
description_portal: 드론을 사용하여 비행하려는 자는 항공안전 제125조(초경량비행장치 조종자 증명 등)에 따라 증명을 받아야 하고, 한국교통안전공단은 같은법 제135조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.드론 교육기관을 통해 드론 종류 및 최대이륙중량에 따라 충족하는 비행경력증명을 받은 후한국교통안전공단 국가자격(https://lic.kotsa.or.kr)를 응시자격 부여 신청을 할 수 있다.해당자료는 드론(무인비행장치) 조종자격 세분화에 따라 무인비행선, 무인비행기, 무인멀티콥터 및 무인헤릴콥터에 대한 1종 ~ 4종까지의 연도별 드론 조종자격 취득 현황에 대한 통계자료이다.
