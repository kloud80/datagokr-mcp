summary_user: 수도권 7호선 역사별 장애인 화장실의 위치를 역 단위로 담은 파일 데이터로, 운영기관·선명·역명과 함께 지상 구분, 역층, 개찰구 안팎, 가까운 출구번호, 상세위치를 담는다. 휠체어 사용자나 보호자가 '이 7호선 역에서 장애인 화장실이 개찰구 안에 있는지, 몇 층에 있는지'를 미리 확인하거나, 교통약자 편의시설 분석가가 역별 설치 위치를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 역 시설·승하차 데이터와는 역명(필요하면 선명)을 이름 매핑해 붙여 쓴다.
limits: 표준 역코드 같은 공통 조인 키가 없어 다른 데이터와 연결할 때 역명 표기 차이를 직접 맞춰야 한다. 범위가 '전국'으로 분류돼 있지만 비공간 데이터라 좌표가 없고, 위치는 층·출구번호·문장형 상세위치로만 알 수 있다.
