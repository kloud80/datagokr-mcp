description_portal: 중앙분리대란 도로에서 차들이 서로 마주 보며 달리는 차로를 갈라주는 시설을 말합니다.반대편 차랑 부딪히지 않게 막아 주는 경계선이라고 생각하면 됩니다.중앙분리대는 차량끼리 정면충돌할수있는 사고를 막기 위해, 또 자기 차로를 지키며 안전하게 달리게 하고 무단으로 차선을 넘어가는 걸 방지하는 역할을 해줍니다.종류로는 콘크리트나 철로 된 벽, 화단처럼 생긴 초록색 띠, 고속도로에서 보는 가드레일 등이 있습니다.간단한 예로, 왕복 4차선 도로에서 왼쪽으로 가는 차와 오른쪽으로 가는 차 사이에 있는 벽이나 화단을 중앙분리대라고 볼 수 있습니다.경기도 양평군 관내 중앙분리대 현황에 대한 데이터로 종류, 연장, 폭원, 높이, 위치 정보, 지형지물부호, 관리번호, 도로구간번호 등을 제공합니다.
