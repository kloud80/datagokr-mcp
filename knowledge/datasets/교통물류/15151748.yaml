summary_user: 수출입 물류 플랫폼에 선사 이용자가 직접 입력한 터미널 선석 일정을 선박 항차별로 담은 파일로, 터미널·선석번호, 추정·실제 입항·접안·출항 일시, 양하·적재 컨테이너 수량, 작업 크레인 수 등이 들어 있다. 항만 물류 분석가나 화주·포워더가 특정 터미널에 어떤 선박이 언제 접안할 예정이었고 실제로는 언제 접안했는지, 그 차이가 얼마나 나는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 국제해사기구번호(IMO)·선박명·선사코드·터미널코드를 이름·코드 매핑해 Port-MIS 입출항 신고나 선박 등록 정보와 맞춰 보는 방식으로만 연결한다.
description_portal: '수출입 물류 공공·민간 데이터 공유 플랫폼에서 제공 중인 터미널 선석 일정 데이터입니다.1. 데이터 개요: 수출입 물류 공공·민간 데이터 공유 플랫폼의 선사-항만 운영 정보 서비스에서 터미널 운영 최적화를 위한 정보 수집에 따라 형성된 데이터입니다.2. 데이터 내역: 터미널과 터미널에 접안하는 선박에 대한 정보(선석번호, 추정 입출항 일시, 실제 접안일시) 등 터미널 선석 이용에 대한 데이터가 포함되어 있습니다.3. 기타사항: 선박 총 톤수 등 부수정보 포함4. 유의사항: 각 선사의 이용자가 선석 일정을 직접 입력하여 생성하는 데이터로써, 모든 선박의 일정을 포함하지 않으니 활용 시 유의하여 주시기 바랍니다.'
