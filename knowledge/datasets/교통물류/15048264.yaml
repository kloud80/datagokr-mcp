description_portal: '인천광역시 시내버스 정류장별 이용승객 현황으로 정류소명, 정류소아이디, 총승차건수, 총하차건수,  카드승차건수, 현금승차건수, 카드하차건수,  일평균승하차건수 등을 제공합니다.<활용 목적>노선 및 배차 계획 수립: 정류장별 수요 집중도를 분석하여 버스 노선 조정, 배차 간격 최적화, 막차 시간 조정 등 효율적인 대중교통 운영 계획 수립에 활용됩니다.시설물 개선: 이용객이 많은 정류장을 파악하여 버스정보안내기(BIT) 설치, 쉘터 개선, 환승 시설 확충 등 시설 개선의 우선순위를 정하는 데 사용됩니다.교통 정책 분석: 현금 결제율 등을 분석하여 교통 약자 및 외국인 등의 이용 특성을 파악하고, 대중교통 이용 활성화 정책의 기초 자료로 활용됩니다.인천시 버스 노선의 효율적인 운영 및 시설 개선을 위한 핵심 기반 정보입니다'
