summary_user: 인천광역시 시내버스 정류장마다 승차·하차 인원과 카드·현금별 승차 인원, 일평균 승하차 인원을 담은 정류장 단위 집계 파일(CSV 약 39만 바이트)이다. 교통 분석가나 시 담당자가 '어느 정류장에 이용객이 몰리고 현금 승차 비중이 높은가'를 보고 노선 조정이나 쉘터·버스정보안내기 설치 우선순위를 정할 때 쓴다. 전역 조인 키는 없어서 다른 정류장 원장이나 도착정보 데이터와는 정류소 이름이나 정류소번호를 직접 대조해서만 이어 쓸 수 있다.
