summary_user: 고양시 관내 버스정류소를 한 곳씩 담은 파일로, 정류소번호·정류소명·경유노선(마을·시내버스 등)과 위도·경도 좌표를 정류소 단위로 제공한다. 시민이나 분석가가 '타려는 노선이 서는 정류소가 어디인가', '특정 지역 주변에 정류소가 얼마나 분포하는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 실시간 도착정보(TAGO·지자체 BIS) 등과는 정류소번호·정류소명 매핑이나 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 고양시 관내 버스정류소의 정류소 번호, 정류소명, 경유노선(마을, 시내 등), 위도와 경도를 포함한 자료를 제공합니다. 이를 활용하여 타고자 하는 버스 노선에 해당하는 정류소 위치를 확인할 수 있습니다.스마트쉘터는 표기하고 있지 않으며, 향후 AI기술을 접목시킨 스마트쉘터를 반영하여 업데이트하겠습니다. 자세한 경유노선은 노선버스 번호를 활용하여 인터넷 검색시 검색 사이트가 제공하는 지도에서 한눈에 확인하실 수 있으며, 정류소에 설치된 BIT와 모바일로 GPS를 통한 현재 버스 위치 또한 확인 가능하니 참고바랍니다.
