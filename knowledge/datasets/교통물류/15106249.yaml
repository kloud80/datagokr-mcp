summary_user: 전국 중소도시 버스정류장 54,848곳을 정류소 단위로 담은 파일 데이터로, 정류소노드 아이디·정류소명·경도·위도·지자체코드·지자체명을 싣는다. 지자체나 연구기관이 지역별 정류장 분포를 보고 버스노선 개편이나 대중교통 정보제공 방안을 검토할 때 쓴다. 경도·위도 좌표(coord)를 키로 다른 위치 데이터와 이어 쓰며, 정류장·노선 원장이므로 실시간 도착 정보와 함께 보는 용도에 맞다.
description_portal: -한국교통안전공단에서 운영하는 TS-BIS(버스정보시스템)는 중소도시 대중교통 이용자의 교통복지 향상과 교통정보 격차 개선을 위한 버스정보를 제공하고 있습니다.-제공 데이터는 정류소노드 아이디, 정류소명과 해당 정류장의 경도와 위도, 지자체코드, 지자체명 등을 공개하고 있습니다.(2026년 7월 기준)-데이터를 활용하여 학계, 연구기관, 지자체는 버스노선 개편, 대중교통 정보제공 알고리즘 고도화 및 정확성 향상, 노선 이탈률 감소 방안, 지역별 맞춤형 정보 제공 등 연구에 기여할 수 있습니다.
