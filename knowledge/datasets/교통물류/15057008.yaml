summary_user: 서울지하철 각 역사의 호선, 역명, 구주소, 도로명주소, 대표 전화번호를 역 단위로 담은 외부 API(서울시 열린데이터광장) 데이터이다. 길찾기·민원 안내 서비스 운영자나 분석가가 '이 역의 도로명주소와 문의 전화번호가 무엇인가'를 확인할 때 쓴다. 전역 조인 키는 확인되지 않아 역명·호선 이름 매핑이나 도로명주소 문자열로 다른 데이터와 잇는다.
description_portal: 서울교통공사의 역별 주소 및 전화번호 정보 API는 서울지하철 각 역사에 대한 위치 및 연락처 정보를 제공하는 서비스입니다.이 데이터는 호선 번호와 역명을 기준으로 조회할 수 있으며, 각 역의 구주소·도로명 주소·대표 전화번호를 표준화된 형태로 제공합니다.제공되는 항목에는 역이 속한 호선(SBWY_ROUT_LN), 역명(SBWY_STNS_NM), 행정구역 변경 이전의 구주소(OLD_ADDR), 법정 표준체계에 따른 도로명주소(ROAD_NM_ADDR), 그리고 민원·분실물 문의·안내 등에 활용할 수 있는 **대표 전화번호(TELNO)**가 포함됩니다.이 API는 기관에서 발급받은 인증키를 통해 접근하며, 조회 범위(START_INDEX, END_INDEX)를 지정해 대량 데이터도 분할 호출할 수 있습니다. 또한 특정 호선이나 역명을 조건으로 검색할 수 있어, 원하는 역만 선별적으로 조회하는 것이 가능합니다.활용 예시로는,대중교통 길찾기 서비스에서 승·하차역의 정확한 주소를 안내,민원·안내 서비스에서 역무실 전화번호를 연결(클릭투콜),지도·배달·상권분석 서비스에서 역세권 위치 정보를 표준화된 주소로 활용,안전 및 재난대응 시 관할 역의 연락처를 신속히 조회하는 등시민 생활과 밀접하게 연계될 수 있습니다.또한, 도로명주소 제공을 통해 다른 공공데이터(건축물대장, 상권정보 등)와 연계가 용이하며, 구주소도 함께 제공되어 과거 데이터와의 호환성을 보장합니다.
