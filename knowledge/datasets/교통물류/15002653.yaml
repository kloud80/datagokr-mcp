status: active
summary_user: 한국공항공사가 운영하는 공항에서 에어택시를 운항한 소형항공사업자의 수송실적을 연도·공항·상대공항·출도착별로 묶어 운항편수, 공급석, 성인·유아 여객, 탑승률로 담은 집계 파일이다(csv 1,386바이트의 작은 규모). 항공 정책 분석가나 연구자가 '특정 연도에 어느 공항 노선에서 에어택시가 몇 편 운항했고 탑승률은 얼마였나'를 확인하는 데 쓴다. 전역 조인 키는 없어 공항 이름을 공항코드표나 같은 기관의 공항별 항공통계와 이름으로 맞춰 이어 쓴다.
limits: 공항 컬럼이 코드가 아닌 이름이어서 다른 데이터와 붙일 때 이름 매핑이 필요하다. 포털 설명에 따르면 2024년 이후 에어택시 운영 사업자가 없어 새 실적이 나오지 않으므로, 최근 연도 수송 현황 파악에는 쓰지 못한다.
