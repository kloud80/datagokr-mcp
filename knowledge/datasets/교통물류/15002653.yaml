description_portal: 한국공항공사(Korea Airports Cooperation)는 인천국제공항을 제외한 전국 14개 공항을 운영하는 기관입니다.해당 데이터는 에어택시를 운영하는 소형항공사업자의 수송실적을 제공합니다.데이터 구성은 공항별 운항편, 공급석, 성인, 유아, 여객, 탑승률로 이루어져 있습니다.해당 데이터는 매년 업데이트 되고 있는 데이터였지만, 24년 이후로 에어택시를 운영하는 소형항공사업자가 없어서 실적이 나오지 않아 연간 업데이트 데이터를 수시성 데이터로 전환합니다. 추가 문의사항 있으시면 02-2660-4807로 문의주세요
