summary_user: 세종특별자치시 안의 횡단보도를 개소별로 담은 원천 목록으로, 주소·좌표와 함께 횡단보도 종류, 자전거 횡단도 겸용 여부, 차로 수·폭·연장길이, 보행자신호등·음향신호기 유무, 녹색·적색 신호 시간, 교통섬·보도턱낮춤·점자블록·집중조명시설 여부, 관리기관을 담는다. 보행 안전 분석가나 교통약자 이동 지원 서비스 사업자가 '세종시에서 점자블록이나 음향신호기가 없는 신호 횡단보도는 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없으므로 위경도(la, lo)나 도로명주소로 다른 교통·시설 데이터와 공간·주소 매칭해 이어 쓴다.
description_portal: 세종특별자치시 횡단보호 소재 주소, 종류 구분, 자전거 횡단도 겸용 여부, 연장길이, 보행자신호등 및 신호기 유무, 신호 시간, 교통섬 유무, 보도턱낮춤 여부, 점자블록 여부, 집중조명시설 유무, 관리기관 정보를 제공합니다.
