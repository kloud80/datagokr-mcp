summary_user: 인천국제공항에 도착하는 여객기의 하계 시즌 정기운항 스케줄을 운항편 단위로 담은 파일로, 운항요일·항공사·편명·도착 예정시각·운항 시작일과 종료일·출발지 도시를 담는다. 여행자나 항공·관광 분석가가 '이번 여름 특정 도시에서 인천으로 오는 정기편은 어느 항공사가 무슨 요일 몇 시에 운항하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 운항 데이터와는 편명·항공사명·출발지 도시명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 인천국제공항공사에서 제공하는 여객기 정기운항편 도착 정보입니다. 해당 데이터는 하계 시즌의 데이터를 제공하고 있습니다. 본 데이터는 인천국제공항에 도착하는 여객기의 상세운항 정보를 종합적으로 제공하고 있으며, 인천국제공항에 도착하는 하계 여객기의 운항요일, 항공사,운항편명,예정시각,시작일자,종료일자,출발지 도시명에 대한 정보을 제공하고 있습니다. 특히 여객기 운항요일,항공사,출발지에 대한 정보는 국문·영문·중문·일문으로 제공하고 있어 다국어로 데이터를 확인하실 수 있습니다.
