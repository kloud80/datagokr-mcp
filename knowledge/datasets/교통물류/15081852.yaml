summary_user: 의정부경전철 역들 사이의 거리(km)를 철도운영기관명·노선명·역명과 함께 역 구간별로 담은 작은 파일(CSV 694바이트)이다. 경전철 이용자나 교통 분석가가 의정부경전철의 특정 두 역 사이가 몇 km인지, 노선 구간별 거리 분포가 어떤지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 위치·승하차 데이터와는 역명이나 노선명을 맞춰 연결해야 한다.
description_portal: '의정부경전철을 구성하는 역들의 역간거리에 대한 철도운영기관명, 선명, 역명, 역간거리 데이터가 포함되어 있습니다.역간 거리란 역과 역사이의 거리(Km)를 말한다.참고로거리, 시간, 운행계통 등으로 구분 하자면거리  대경선 서대구역 ~ 왜관역: 23.3km   공항철도 청라국제도시역 ~ 영종역: 10.3km시간  대경선 서대구 ~ 왜관: 약 15분 50초  광역철도 제외 시 공항철도 청라국제도시역 ~ 영종역: 약 8분 30초운행계통  수도권 전철 1호선 서울역발 천안급행 서울역 ~ 금천구청역: 17.3km가장 역간거리가 긴 구간  대경선 서대구역 ~ 왜관역: 23.3km'
