description_portal: 본 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 도로구간별 미끄럼 방지시설 설치 현황을 공간 위치 정보와 함께 수록한 자료입니다. 각 시설에 대해 공간지리식별번호, 지형지물부호, 도로구간번호, 위치 구분 등의 속성과 더불어 TM 중부 GRS80 기준의 위도·경도 좌표가 포함되어 있으며, 해당 시설의 설치 유무나 특성 등도 함께 제공됩니다. 미끄럼 방지시설은 도로면 마찰력을 높여 차량 제동 거리 단축과 보행자 미끄럼 사고 예방에 기여하는 핵심 구조물로, 시설 분포를 시각적으로 파악함으로써 안전 사각지대를 분석하고 시설 보강 필요 지역을 식별할 수 있습니다. 이 데이터는 2022년 기준으로 일회성 수집된 자료로, 보행 안전 환경 평가 및 시각화 작업에 참고용으로 활용하는 것이 적합합니다.
