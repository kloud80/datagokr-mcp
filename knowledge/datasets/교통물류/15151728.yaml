summary_user: 인천국제공항 기준 항공편별 정기 스케줄(출발지·도착지, 출발·도착 일시, 비행시간, 편명, 항공사)을 건별로 담은 파일 데이터로, 국가·항공사 코드 정보가 함께 들어 있다. 수출입 화주나 포워더가 '인천에서 특정 국가·도시로 가는 항공편이 어느 항공사로 언제 뜨는가'를 확인해 항공화물 선적 일정을 잡는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공항·항공사·국가 코드나 이름을 맞춰 붙여야 하며, 파일 안의 코드 정보(항목명·코드·내용·참조항목명)를 코드표로 써서 편명과 항공사·국가 이름을 연결한다.
limits: 전역 조인 키가 없어 다른 운항·통계 데이터와 바로 결합되지 않고 이름·코드 매핑이 필요하다. 인천공항 기준 스케줄이어서 편 단위 실시간 출도착·결항·지연 같은 오늘의 운항 사실은 담지 않으며, 포털 설명대로 일부 정보가 누락돼 있을 수 있다.
