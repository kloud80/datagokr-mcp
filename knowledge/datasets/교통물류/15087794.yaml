summary_user: 드론 조종자격(무인멀티콥터·무인헬리콥터 등) 취득자 수를 종류별(구분)로 2013년부터 2021년 8월까지 연도별 열로 정리한 전국 단위 집계표이며, 파일 크기 275바이트의 작은 CSV입니다. 드론 산업 동향을 보는 분석가나 정책 담당자가 '드론 조종자격 취득자가 해마다 얼마나 늘었고 어떤 기체 종류에 몰렸는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 드론 종류 이름을 맞춰 붙여야 하며, 드론 신고 기체·비행승인 현황 같은 같은 기관의 드론 통계와 나란히 놓고 산업 규모를 읽는 용도에 맞다.
description_portal: 드론을 사용하여 비행하려는 자는 항공안전 제125조(초경량비행장치 조종자 증명 등)에 따라 증명을 받아야 하고, 한국교통안전공단은 같은법 제135조(권한의 위임·위탁)에 따라 해당 업무를 국토교통부로 부터 위탁받아 운영하고 있다.드론 교육기관을 통해 드론 종류 및 최대이륙중량에 따라 충족하는 비행경력증명을 받은 후한국교통안전공단 국가자격(https://lic.kotsa.or.kr)를 응시자격 부여 신청을 할 수 있다.해당자료는 무인멀티콥터, 무인헬리콥터 등 연도별 드론 조종자격 취득자 현황을 나타내며 향후 이를 통하여 취득자 현황 추이 분석 등에 활용 가능하다.
