summary_user: 인천광역시 버스정보시스템 서버가 정류소 버스정보안내기(BIT)로 보낸 도착예정정보를 가공일시별로 쌓은 건별 이력 파일로, 안내기·노선·버스별 잔여 정류소 수, 도착예정시간, 막차 여부, 혼잡도, 잔여좌석(광역버스만)을 담는다(CSV 약 2.8MB). 분석가가 '특정 정류소 안내기에 표시된 도착예정 정보가 실제로 어떻게 바뀌었고 막차·혼잡 정보가 언제 나갔는가'를 확인하거나 노선 운영 분석에 쓴다. 전역 조인 키는 없어서, 정류소안내기 ID·버스노선 ID를 인천시 버스정보시스템의 정류소·노선 원장과 같은 기관 코드로 맞춰 이어 쓴다.
