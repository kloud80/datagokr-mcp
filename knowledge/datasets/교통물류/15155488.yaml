summary_user: 부산 사하구에서 2024년 한 해 동안 접수된 불법주정차 신고를 건별로 담으며, 신고일시·지번주소·위도/경도·위반구분(횡단보도, 어린이보호구역, 소방시설 주변 등)·과태료 부과 여부를 기록한다. 교통안전 분석가나 구청 담당자가 '사하구에서 소방시설 주변·어린이보호구역 불법주정차 신고가 몰리는 지점은 어디이고 실제 과태료로 이어진 비율은 얼마인가'를 따질 때 쓴다. 전역 조인 키는 없어서 위도/경도나 지번주소를 기준으로 어린이보호구역·단속카메라 같은 위치 데이터와 공간으로 겹쳐 쓴다.
description_portal: 부산광역시 사하구 내에서 2024년 한 해 동안 접수된 불법주정차 신고 및 과태료 부과 현황 데이터를 제공합니다.본 데이터는 사하구 내 불법주정차 발생 지역의 패턴 분석, 교통안전 취약지점 파악, 주정차 단속 정책 개선 등에 활용할 수 있습니다.*주요 데이터 컬럼별 상세설명○ 신고일시 → 2024년 사하구 내 불법주정차 신고가 접수된 일시○ 신고위치 지번주소 → 2024년 사하구 내 불법주정차 신고 위치의 지번주소※ 도로명주소는 정확하게 나오지 않아 지번주소만 표시○ 위도/경도 → 2024년 사하구 내 불법주정차 신고 위치 위도/경도○ 위반구분 → 교통법규 위반구분(건널목,교차로,다리위,도로모퉁이,버스정류장 주변,보도위,어린이보호구역,소방시설 주변,횡단보도,주정차 금지구역)○ 과태료부과여부 → 불법주정차 신고 관련 과태료 부과 여부(Y,N)
