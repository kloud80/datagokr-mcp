summary_user: 서울교통공사 1~8호선 역별로 1회권 발매기·환급기·무인정산기·교통카드 키오스크 등 승차권 관련 장비의 설치 수량과 간단한 설치위치를 담은 파일 데이터이며, 포털 설명상 2025년 8월 기준입니다. 이용객이나 분석가가 "우리 역에 1회권 발매기·환급기가 몇 대 있고 어디에 있나", "호선별로 무인정산기가 어느 역에 몰려 있나"를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어, 고유역번호(외부역코드)나 역명·호선을 매핑해 같은 기관의 역 정보·승하차 데이터와 붙여 쓴다.
limits: 표준 역코드 같은 전역 조인 키가 없어 다른 데이터와는 역명·역번호 매핑으로만 연결된다. 환승역은 역명 뒤 괄호의 호선으로 구분되고 수량 빈칸은 0을 뜻하므로, 집계 전에 이를 처리해야 한다. 포털 설명상 신규 설비 도입에 따라 수량이 바뀔 예정이므로 시점을 확인하고 쓴다.
