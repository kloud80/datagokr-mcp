description_portal: 서울교통공사의 1-8호선 1회권 장비 시설물 현황입니다.  해당 데이터는 연번,호선,역사명,발매기,환급기,무인정산기 현황 및 설치위치를 포함하고 있습니다. 2025년 8월 기준 입니다.데이터는 역번호, 역명, 각  시설물의 수량정보로  환승역의 경우  역사 뒤 숫자로 호선을 구분합니다 예를들어 천호역은 5,8호선이 모두 있어 천호(5) 천호(8) 로 구분되어 있습니다.각 시설물의  수량은 숫자로 구분하면 되고, 빈칸은 0을 의미합니다 . 신규 설비 도입시 수량 변경 예정이라 25년 10월쯤 추가로 데이터 변경될 예정입니다. 고유역번호  앞자리 숫자는 호선을 의미합니다.  1-4호선에서는 예를들어 서울역 150은  1호선 서울역 을 의미합니다.  하지만 5-8호선은 25, 26, 27,28로 시작하도록 되어있어 4자리 숫자로 구성됩니다.설치위치는 간략히 설명으로 해두었습니다.
