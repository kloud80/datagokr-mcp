summary_user: 부천시 관내 지하차도를 시설 한 곳당 한 행으로 담은 작은 현황 파일(csv 1,360바이트)로, 지하차도명·위치·준공일·총연장·폭·통과높이·안전점검 내역·안전등급을 담는다. 높이 제한 차량의 우회 경로를 짜는 운송사업자나 노후·저등급 지하차도를 점검하려는 분석가가 "부천에서 통과높이가 낮거나 안전등급이 낮은 지하차도는 어디인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 지자체의 지하차도·터널·교량 현황 파일과는 시설명이나 위치 문자열로 맞춰 붙여야 하고, 같은 제공표준의 지자체 파일들과 묶어 쓰는 것이 기본이다.
