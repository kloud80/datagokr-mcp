description_portal: '- 부천시 관내 지하차도에 대한 데이터로 지하차도명, 위치, 준공일, 총연장,  폭, 높이,안전점검내역, 안전등급 등의  정보를 제공합니다.- 관내 지하차도는 총 14개소이며, 부천시 관리시설은 상동지하차도 등 8개소, 한국도로공사 관리시설은  경인고속도로 하부 지하차도 6개소로 구성되어있습니다. ※ 시설물은 연2회 정기안전점검 시행중이며, 2년에 1회 정밀안전점검을 시행- 본 공공데이터 자료는 지하차도 위치정보를 기반으로 교통체계 개선, 재난대응, 공간정보분석, 네비게이션 경로 설계 등 다양한 공공 및 민간 분야에서 기초자료로 활용될 수 있습니다.'
