description_portal: 드론, 동력비행장치 등 국토교통부령으로 정하는 초경량비행장치를 사용하여 비행하려는 사람은 국토교통부령으로 정하는 기관 또는 단체의 장으로부터 그가 정한 해당 초경량비행장치별 자격기준 및 시험의 절차ㆍ방법에 따라 해당 초경량비행장치의 조종을 위하여 발급하는 증명(이하 “초경량비행장치 조종자 증명”이라 한다)을 받아야 한다. 한국교통안전공단은 항공안전법 제135조(권한의 위임ㆍ위탁)에 따라 해당 업무를 국토교통부로부터 위탁받아 운영하고 있습니다.또한, 한국교통안전공단은 항공안전법 시행규칙 제307조(초경량비행장치 조종자 전문교육기관의 지정 등) 및 동법 시행규칙 제307조의2(초경량비행장치 조종자 육성 등)에 따라 초경량비행장치 조종교육교관과정 및 실기평가과정을 운영하여 지도조종자 및 실기평가조종자를 양성하고 있습니다.무인멀티콥터 조종자 증명 1~ 4종 취득자 수, 지도조종자 등록자 수, 실기평가조종자 등록자 수의 데이터가 있습니다.모든 단위는 (명) 입니다.조종자의 경우 1종~4종으로 분류되어 있습니다.지도조종자, 실기평가조종자의 경우 1종 취득 시 교육 수료가 가능합니다.
