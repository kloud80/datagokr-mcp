summary_user: 전라남도 영암군 관내에서 2024년 1월부터 12월까지 발생한 불법주정차 단속을 한 건씩 담은 원천 파일로, 포털 기준 2,125건에 단속일시·위반구분·단속장소·위경도·단속구분·과태료 부과여부가 들어 있다. 군청 교통 담당자나 분석가가 영암군 안에서 불법주정차 단속이 어느 장소·시간대에 몰리는지, 과태료로 이어진 비율이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위경도 좌표나 단속장소 주소를 공간·이름 매칭으로 잇거나 같은 기관 데이터끼리 묶어 쓴다.
