summary_user: 대구교통공사가 관리하는 대구 도시철도 1호선 역별 휴대폰충전설비를 역명·역층·상세위치·설비 수·이용요금·전화번호 단위로 담은 소규모 CSV 파일(약 2.5KB)이다. 지하철 이용객이 '이 역에 휴대폰 충전기가 어디 있고 요금은 얼마인지'를 확인하거나, 분석가가 역별 편의설비 현황을 정리하는 데 쓴다. 전역 조인 키는 없어 다른 역 시설·승하차 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 이어 써야 한다.
