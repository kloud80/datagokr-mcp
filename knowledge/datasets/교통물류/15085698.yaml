description_portal: 대구교통공사에서  관리하는 1호선 역들의 휴대폰충전설비에 대한 철도운영기관명,선명,역명,역층,충전설비,상세위치,충전설비수,이용요금,전화번호입니다.지하철 5호선 새 전동차에는 휴대전화를 충전할 수 있는 무선 급속충전 설비도 설치됐다. 휠체어석이 위치한 2칸과 중앙 2칸에서 무선 급속 충전을 이용할 수 있다. 충전이 완료될 때까지는 약 2시간이 소요되지만, 배터리가 없어 막막한 상황에서는 지하철을 이용하는 잠깐의 시간을 이용해 요긴하게 사용될 것 같다.특히 서울 지하철 5~8호선 지하철역에서 휴대용 휴대폰 충전기를 무료로 빌려준다. 3시간까지 무료이고, 원하는 지하철역에서 반납할 수 있다.
