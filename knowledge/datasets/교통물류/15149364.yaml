description_portal: 이 정보는 RSE 장비를 통해 15분 단위로 수집된 도로 구간별 속도 구간별 차량 통행량 통계로, 수집 시점(STAT_15MIN), 요일유형(DAY_TYPE), 구간 ID(DSRC_ROUTE_ID), 그리고 SPD_10부터 SPD_OVER까지의 속도 구간별 차량 수 항목으로 구성되어 있습니다. 각 속도 구간은 10km/h 단위로 분리되어 있으며, 특정 시간대·노선별 속도 분포와 저속 또는 고속 차량의 집중 구간을 파악하는 데 활용됩니다. 이 정보는 도로 교통 흐름 분석, 저속 구간 선제 관리, 스마트 교통 시스템 기반 예측 모델 개선, RSE 장비 성능 평가 등에 활용될 수 있습니다.【해당 데이터는 일정 기간에 한하여 샘플데이터로 제공하고 있습니다. 추가 데이터를 원하시면 기관에 문의주시기 바랍니다.】
