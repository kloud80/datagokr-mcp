summary_user: 전국 철도(지하철)역에 설치된 휠체어리프트를 기기 한 대당 한 행으로 담은 원천 목록으로, 운영기관·노선·역명·출입구 번호·상세 위치와 운행 시작·종료 층, 길이·폭(mm), 한계중량(kg), 승강기 일련번호를 포함한다(CSV 약 12.7KB). 휠체어 이용자나 교통약자 이동지원 서비스 개발자가 '이 역의 몇 번 출입구에 휠체어리프트가 있고 몇 층에서 몇 층까지 운행하는가'를 확인하거나, 분석가가 역별 이동편의시설 현황을 집계하는 데 쓴다. 전역 조인 키는 없어서 다른 역 데이터와는 운영기관 코드(철도운영기관코드)와 노선명·역명을 맞춰 연결해야 하며, 역 좌표·출입구 마스터와 이어 써야 위치 기반 활용이 된다.
limits: 실측 컬럼에 전역 조인 키가 없어 역 코드로 바로 붙일 수 없고, 노선명·역명 표기 매핑이나 같은 기관 코드로만 연결된다. 좌표가 없는 비공간 데이터라 지도 표시나 거리 계산에는 별도 역·출입구 위치 데이터가 필요하다.
