status: active
summary_user: 부산시설공단이 운영하는 공영주차장별로 주차장명, 최대 주차가능 대수, 현재 주차대수, 주차가능 대수와 그 최종 갱신일시를 담는 실시간 현황 API입니다. 시민·방문객이나 주차 안내 앱 개발자가 '지금 이 공단 주차장에 빈자리가 몇 면 남았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 주차장관리번호·좌표·요금이 있는 전국주차장정보표준데이터(원장)와는 주차장명 매핑이나 공단 자체 주차장구분코드(parkgcd)로만 이어 쓴다.
limits: 주차장 위치 좌표·요금·운영시간 같은 원장 정보는 없으므로 표준 주차장 데이터와 이름으로 맞춰 붙여야 하고, 이 매칭이 어긋날 수 있다. 값은 최종 갱신일시 기준 스냅샷이므로 갱신 시각을 함께 확인해야 하며, 개발계정은 하루 1,000회 호출 제한이 있다.
