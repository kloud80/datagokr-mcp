description_portal: 본 데이터는 부산시설공단이 운영·관리하는 공영주차장의 시설 현황 정보를 Open API 형태로 제공합니다. 주차장명, 주차가능 대수, 현재 주차대수, 최대 주차가능 대수, 최종 갱신일시, 최대 주차가능 대수 등 주차 현황 정보를 실시간으로 제공하며, 시민과 방문객이 주차시설을 편리하게 이용할 수 있도록 지원합니다.이를 통해 주차 정보의 투명성을 확보하고, 시민의 주차 편의성 향상, 불법 주정차 감소 유도 효과가 있습니다. 또한 내비게이션 및 주차 안내 앱 개발, 주차 안내 서비스 개발 및 교통 정책 수립을 위한 기초자료로 활용될 수 있습니다.
