description_portal: '○ 통계개요* 통계명 : 교량* 통계종류 : 서울시 교량설치 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도로법」에 의해 교량, 터널 등 도로에 설치되어 도로의 기능을 하는 시설물* 작성목적 : 서울시에서 설치ㆍ관리하는 도로시설물 현황을 파악하여, 도로시설물에 대한장래계획을 수립하고 구조물 유지관리 및 도로행정에 필요한 기본자료를 제공하는 것을 목적으로 함* 조사체계 : 도시기반시설본부 및 자치구 → 서울특별시 도로시설과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 도로시설물별(교량)ㆍ관리 주체별 연장 및 면적 현황 등○ 용어설명* 한강횡단교량 : 고유명사인 "한강"을 횡단하는 교량으로 정의하며, 공간적인 한계는북한강과 남한강의 합류지점인 팔당댐부터 임진강과 함류하는 지점임'
