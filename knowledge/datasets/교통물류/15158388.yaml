description_portal: '서울특별시 서초구에서 운영하는 수리센터는 총 세 곳입니다. 방배역, 사당역, 양재천에 위치하고 있습니다. 자전거 수리의 경우, 기본적으로 무상 수리 서비스를 제공하지만, 부품 교체가 필요한 경우 부품 비용을 납부하셔야 합니다. 각 수리센터 별 운영시간과 휴무일이 다르므로 방문 전 수리센터 운영 정보를 확인하셔야 합니다. 방배역 자전거 수리센터는 공간이 좁아서 세차서비스가 불가능합니다. 이용시간은 월요일~목요일 : 10시~19시이고,  일요일: 9시~17시에 운영을 합니다. 점심시간은 12시~13시입니다. 위치는 방배역 1번 출구에 있어서, 찾기가 쉽습니다. 휴무일은 금요일, 토요일, 공휴일입니다. 사당역 자전거 수리센터는 세차가 가능한데, 수리시간과 차이가 있습니다. 이용시간(수리)는 화요일~토요일 : 10시~19시입니다. 이용시간(세차)는 화요일~토요일 : 10시~17시입니다. 점심시간은 12시~13시​입니다. 위치는 사당역 13번 출구에 있습니다. 휴무일은 일요일, 월요일, 공휴일입니다. 양재천 자전거 수리센터도 세차서비스가 가능합니다. 이용시간은 화요일~토요일 : 9시~18시입니다. 이용시간(세차)은 화요일~토요일 : 10시~17시입니다. 점심시간은 12시~13시입니다. 위치는 매헌시민의숲 동측 주차장 옆에 위치해 있어서, 아이들과 나들이 하다가 들리시면 좋을것 같습니다. 휴무일은 일요일, 월요일, 공휴일입니다. 몇가지 유의 사항이 있습니다. 서초구 자전거 수리센터는 서초구민만 이용 가능합니다. 타이어/튜브등 타제품 부품은 교체 및 수리하지 않고, 전기자전거는 관련 부품 및 공구가 없는 관계로 수리하지 않음을 알려드립니다. 그리고, 간혹 녹이 슨 자전거 세차 후 녹을 닦아 달라는 분들이 계시는데, 이 과정은 센터에서 대신해 주지 않음을 알려 드립니다.'
