description_portal: 데이터 개요**「연도별 국내외 주요 항공일지」**는 1900년부터 현재까지의 국내외 항공 관련 주요 사건, 사고, 제도 도입, 기술 발전 등을 **연대기적(chronological)**으로 정리한 데이터로, 항공안전 교육자료, 정책수립 참고자료, 산업사 연구 등에 폭넓게 활용할 수 있습니다.데이터 제공 항목발생일자항공사건 또는 이슈가 발생한 날짜 (연-월-일 형식)분류사건의 지리적 범주 구분 (세계일지 / 국내일지)내용해당 일자의 항공사건, 기술발전, 정책도입 등 상세 설명활용 안내항공사고 및 제도 도입 사례 기반의 정책 분석항공 역사 및 제도 발전 과정에 대한 교육용 자료항공 기술 진보 및 시장 개방 시기 정량 검토국내외 항공 정책의 비교사례 자료 구축데이터 해석 시 유의사항본 데이터는 일지 형식으로 단문 또는 요약된 기술이 많아, 사건의 정확한 법적·기술적 맥락 확인을 위해 별도 원문자료 조사 병행 권장.동일 일자에 여러 사건이 있는 경우, 중요도 기준 선별 정리되었을 수 있습니다."세계일지"에는 주요 ICAO, IATA 회의, 사고, 신기술 등 국제 항공사건이 포함되며, "국내일지"는 한국 항공 역사 중심입니다.데이터 구성 예시발생일자분류내용1900-07-02세계일지페르디난드 폰 쩨펠린 경식비행선 LZ-1호 개발, 첫 비행 성공 (독일).1916-03-01국내일지서울 여의도에 한국 최초의 간이 비행기 착륙장 건설.1916-10-01국내일지일본인 오자끼, 용산 비행장에서 유료비행대회 개최.
