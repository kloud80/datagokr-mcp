description_portal: 본 자료는 한국도로공사가 제공하는 하이패스 단말기 보급 및 반납 현황 통계이다. 고속도로 통행료 자동 결제를 위한 하이패스 단말기의 연도별 보급 실적과 반납된 단말기 수량을 포함한다. 해당 정보는 하이패스 이용 확대 정책, 재고 관리, 단말기 재활용 계획 등 행정업무의 기초자료로 활용될 수 있다. 또한, 시계열적 분석이 가능하여 보급 추세를 파악하거나 향후 수요 예측에 참고할 수 있다. 본 데이터는 공공 및 민간 분야의 연구, 정책 수립, 서비스 개선에 기여하며, 한국도로공사의 정보공개 확대 및 데이터 기반 행정 구현을 목적으로 제공된다.
