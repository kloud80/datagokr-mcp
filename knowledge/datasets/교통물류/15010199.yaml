summary_user: 인천교통공사가 운영하는 인천1호선·인천2호선·7호선 인천·부천구간의 에스컬레이터를 호선·역명·호기·승강기번호·운행구간·설치위치 단위로 한 대씩 담은 설치현황 파일(csv)이다. 교통약자나 이동편의 분석가가 '어느 역의 어느 위치(층·출입구)에 에스컬레이터가 몇 대 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역·출입구·승강기 데이터와는 역명이나 승강기번호를 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: 인천교통공사에서 운영중인 도시철도 인천1호선, 인천2호선, 7호선 인천·부천구간의 2025년 6월 30일 기준 에스컬레이터 설치현황 정보입니다.해당 데이터는 호선,역명,장비종류,호기,승강기번호,운행구간,설치위치 항목으로 구성되어있습니다.인천1호선은 검단호수공원역에서 송도달빛축제공원역까지 총 33개역 중 31개역에 에스컬레이터가 설치되어있습니다.인천2호선은 검단오류역에서 운연역까지 총 27개역에 모두 설치되어있고,7호선 인천·부천구간도 까치울역에서 석남역까지 총 11개역에 모두 설치되어있습니다.
