summary_user: 원주시 읍면동별로 월(ym) 단위 전체·어린이·고령자 보행 교통사고 건수와 함께 전체·어린이·고령자 인구, 전월 인구, 인구 증감률을 담은 집계 통계이다. 원주시 교통안전 담당자나 분석가가 "고령자 인구가 늘어나는 읍면동에서 고령자 보행사고도 함께 늘고 있는가"처럼 인구 변화에 견준 취약계층 사고 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름 매핑으로만 이어 쓰며, 사고 다발지역 위치는 도로교통공단(TAAS) 다발지역 자료와 함께 보는 것이 맞다.
limits: 범위가 원주시 한 곳이고 읍면동 단위 집계라서 사고 지점·개별 사고 정보는 없다. 법정동·행정동 코드 같은 전역 조인 키가 없어 다른 지역·데이터와는 이름 매칭에 기대야 한다.
