summary_user: 인천국제공항의 시간대별 도착·출발 항공편·여객·화물 통계를 월 단위로 조회하는 집계 API로, 정기/부정기·화물기/여객기·국제선/국내선 조건으로 나눠 시간대(time)별 도착·출발·합계 수치를 담는다. 공항 운영·물류 분석가가 '특정 월 인천공항의 화물 도착·출발이 어느 시간대에 몰리는가'처럼 시간대별 혼잡과 물동량 흐름을 볼 때 쓰며, 여객 실적은 관광·출장 수요, 화물 실적은 수출입 물류 신호로 읽는다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시간대·월 같은 값이나 같은 기관(인천국제공항공사)의 다른 통계와 이름·코드 매핑으로만 이어 쓴다.
limits: 건별 운항 원천이 아니라 시간대별 집계이고 공간 단위가 없는 비공간 데이터라 지역·노선 단위 분석에는 바로 쓰지 못한다. 개발계정은 일 1,000회 호출 제한이 있다.
