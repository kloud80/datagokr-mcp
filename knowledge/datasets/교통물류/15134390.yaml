summary_user: 인천광역시 버스정보시스템(BIS)에서 관리하는 노선별 논리링크 목록이다. 노선마다 운행 경로를 이루는 링크를 순번대로 한 행씩 담고, 각 행에 진행방향 코드를 붙인 원장형 파일(CSV, 약 1.8MB)이다. 분석가가 '특정 인천 버스 노선이 어떤 도로 링크를 어떤 순서와 방향으로 지나가는가'를 확인해 노선 경로를 재구성하거나 구간별 노선 중복을 분석할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 같은 인천 BIS의 노선 정보와는 노선 아이디(버스노선)로, 링크 정보와는 논리링크 아이디로만 맞춰 이어 쓴다.
description_portal: 본 자료는 인천광역시 버스정보시스템(BIS) 내에서 관리되는 관련 데이터 파일 중 하나로, 노선별 논리링크 현황을 정리한 자료입니다.본 자료는 각 버스 노선을 기준으로 실제 운행 경로를 구성하는 논리링크 정보를 체계적으로 제공하기 위한 목적으로 구축되었습니다.자료의 항목 구성은 버스노선, 링크순번, 논리링크, 진행방향으로 이루어져 있으며, 버스노선 항목을 통해 노선별 구분이 가능하고 링크순번을 통해 해당 노선 내 논리링크의 운행 순서를 확인할 수 있습니다.논리링크 항목은 실제 버스 운행 경로를 구성하는 링크 단위를 나타내며, 진행방향 항목은 해당 논리링크에서의 차량 진행 방향 정보를 코드 형태로 제공하여 노선의 흐름과 방향성을 명확히 파악할 수 있도록 합니다.이를 통해 본 자료는 노선 경로 분석, 운행 정보 관리, 시스템 운영 및 데이터 검증 등 다양한 행정·기술적 업무에 활용될 수 있도록 구성되어 있습니다.
