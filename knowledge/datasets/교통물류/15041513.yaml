summary_user: 경의중앙선 각 역의 승강장별로 차량 순서와 출입문 번호마다 승강장과 차량 사이 이격(안전)거리를 담은 건별 CSV 파일(약 138KB)이다. 교통약자 이동 지원 단체나 철도 안전 분석가가 경의중앙선 어느 역, 몇 번째 칸, 몇 번 문에서 승강장 틈이 넓은지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역·노선 데이터와는 역명·노선명을 이름으로 맞추거나 같은 기관 자료와만 연결한다.
description_portal: 한국철도공사에서 운영하는 경의중앙선의 승강장 이격거리 정보를 포함하고 있으며, 철도운영기관명, 노선명, 역명, 승강장 번호, 차량 순서, 차량 출입문 번호, 안전 거리 등의 상세 데이터를 제공합니다. 이 데이터는 승강장과 차량 간 거리 정보를 정확히 파악하여 승객 안전 확보와 효율적인 승하차 관리를 지원합니다. 또한 승강장 이격거리 정보는 차량 운영 및 승강장 설계, 안전 관리, 비상 대응 체계 구축에 활용되며, 경의중앙선 운영기관의 안전 정책 수립과 대중교통 서비스 품질 향상에 기여하는 중요한 공공 안전 인프라 자료입니다.
