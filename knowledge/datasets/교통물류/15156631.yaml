        required: true
        example: '1'
        desc: 페이지번호
      - name: resultType
        required: true
        example: xml
        desc: JSON방식으로 호출 시 파라미터 resultType=json 입력
      - name: callsgn
        required: false
        example: '010511'
        desc: 호출부호
      - name: ptentYr
        required: false
        example: '2025'
        desc: 입항연도
      - name: vyg
        required: false
        example: '082'
        desc: 항차
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
