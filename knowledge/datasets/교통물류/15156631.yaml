summary_user: 울산항 항내에 있는 선박의 위치(위도·경도)와 대지속력·침로·선회율·흘수·운항상태를 선박별로 담은 건별 원천 데이터로, 호출부호·입항연도·항차와 갱신시각이 함께 붙는다. 항만 이용자나 물류 분석가가 특정 선박이 지금 울산항 안 어디에서 어떤 속도로 움직이는지, 정박 중인지 운항 중인지 확인하는 데 쓴다. 선박고유번호(imoNo)를 키로 선박 등록 원장이나 다른 항만공사 입출항 데이터와 잇고, 호출부호·입항연도·항차 조합으로 Port-MIS 입출항 신고 기록과 맞춰 쓴다.
description_portal: '본 데이터는 울산항 항내 선박위치정보를 국가중점데이터로 개방하여, 항만 이용자들의 편의성 제고 및 운영 투명성을 강화하고자 합니다.해당 데이터를 통해 울산항 항내 선박 위치정보(위도, 경도, 속도)를 확인하실 수 있습니다. - 호출부호, 입항연도, 항차, 선박명, 경도, 위도, 대지속력, 대지침로, 선회율, 선박흘수, 운항상태 등으로 구성 - 업데이트 주기: 일간 - 데이터 유형: 오픈API'
