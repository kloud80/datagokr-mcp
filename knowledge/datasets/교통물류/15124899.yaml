summary_user: 서울특별시에 접수된 불법주정차 신고를 건별로 담으며, 신고 일자·시각, 주소, 경위도 좌표를 포함한다(포털 설명상 2022년 11월~2023년 10월 기간). 분석가나 자치구 담당자가 '어느 동네, 어느 시간대에 불법주정차 신고가 몰리는가'를 지도와 시간대별로 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 주소 문자열 매칭이나 경위도 좌표를 이용한 공간 결합으로 행정구역·단속카메라·보호구역 데이터와 이어 쓴다.
limits: 외부 사이트(data.seoul.go.kr)에서 별도 인증키(KEY)를 받아야 호출되며, 포털 활용신청과는 별개다. 행정동·법정동 코드 같은 공통 키가 없어 다른 데이터와 바로 조인되지 않는다. 신고 건만 담으므로 실제 단속·과태료 부과 결과는 이 데이터로 알 수 없다.
