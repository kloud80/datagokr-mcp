summary_user: 부산 도시철도 4호선 역마다 화장실 한 곳을 한 행으로 담은 건별 목록으로, 운영기관·노선·역명·지상지하 구분과 화장실의 층·개찰구 안팎(게이트내외)·가까운 출구번호·상세위치를 적는다(CSV 약 2.3KB의 작은 파일). 부산 4호선 이용객이 '이 역 화장실이 개찰구 안에 있어 요금을 내고 들어가야 하는지, 몇 번 출구 쪽인지'를 확인하거나 분석가가 역사 편의시설 배치를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 역·시설 데이터와는 역명·노선명을 이름으로 맞춰 이어 써야 한다.
limits: 역 코드 같은 공통 키가 없어 다른 철도 데이터와 붙이려면 역명 표기를 직접 맞춰야 한다. 부산 4호선만 담으므로 다른 노선이나 환승역의 타 노선 화장실 위치는 이 파일로 알 수 없다.
