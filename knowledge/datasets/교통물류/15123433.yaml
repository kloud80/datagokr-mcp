summary_user: 서산시 도시계획정보시스템에서 방화지구 정보를 담는 테이블의 구조를 설명하는 메타데이터로, 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목을 컬럼 단위로 담은 작은 CSV 파일(2,556바이트)이다. 서산시 도시계획 데이터를 연계하거나 정보공개를 청구하려는 분석가·개발자가 '방화지구 테이블에는 어떤 컬럼이 있고 각 컬럼은 무슨 뜻인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명을 이름으로 맞추거나 같은 기관(서산시) 기준으로만 이어 쓴다.
