summary_user: 서울 서대문구 안의 가로등을 한 개씩 기록한 시설물 목록 파일(CSV, 약 19만 바이트)로, 건물유형·주소·위치 설명·관리번호를 담는다. 구청 담당자나 주민·분석가가 "우리 동네 어느 도로에 가로등이 설치돼 있고, 야간 조명이 부족한 구간은 어디인가"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소 문자열을 매칭하거나 같은 기관의 관리번호로만 이어 쓸 수 있다.
description_portal: '서울특별시 서대문구의 가로등에 대한 데이터로 연번, 건물유형, 주소, 관리번호, 위치의 정보를  제공합니다  제공형태 : 파일  데이터 기준일 : 2024년 1월 1일가로등 현황 데이터는 주로 도시의 야간 조명 환경을 파악하고 관리하는 데 사용됩니다.가로등 현황 데이터는 도시 관리, 에너지 효율 개선, 범죄 예방 등 다양한 분야에서 활용됩니다.이 데이터를 활용해 노후된 가로등을 교체하거나, 조명이 취약한 지역을 파악하여 추가 설치 계획을 수립할 수 있습니다. 이데이터는 CSV 형태로 제공되며 다운로드 가능합니다.'
