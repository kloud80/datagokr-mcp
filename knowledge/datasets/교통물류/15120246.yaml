description_portal: 한국교통안전공단 택시운송종사 데이터 및 CBT 관련 데이터 입니다.발급지역 시도별로 택시자격증 취득건수 컬럼명이 있습니다- 육상종사를 위한 자격은 해당 지역별로 취득하여야 하며, 신청은 홈페이지를 통해 가능함.- 예약 시 신청 양식에 개인정보(성함, 주소 등)를 기재하며, 해당 정보를 바탕으로 차후 지역별 택시 자격증 취득 현황정보를 추출할 수 있습니다.- 시도별 택시자격은 중복되지 않게 취득이 가능하며, 시험일 또한 중복되지 않도록 신청하시는 것을 추천함.- 시도별 택시자격시험은 무작위로 문제가 출제되며, 지리시험은 각 시도별 상이함.- 지역 시험장-본사 간 서버 통신을 통해 문제출제, 관리, 합격정보 등 데이터를 전송하며, 본사 서버 내 일괄 관리됩니다.- 해당 통계정보는 무단으로 반출되지 않으며, 본인정보의 열람 또는 타 법령에 따른 정보제공 시에 제공되는 통계자료입니다.
