summary_user: 서울시설공단이 관리하는 서울시 자동차전용도로 위 교량 124개소를 한 행에 한 교량씩 담은 시설물 원장 파일로, 노선·교량명·위치(소재지번)·시설물 종별·상부구조형식·연장·폭·차로수·준공년도·공용년수·안전등급을 담는다. 시민이나 도로·안전 분석가가 '내가 다니는 강변북로·올림픽대로 구간 교량 중 준공 30년이 넘었거나 안전등급이 낮은 곳은 어디인가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 교량명·노선명이나 소재지번 주소를 매칭해 서울시 도로·교량 관련 자료와 잇는다.
description_portal: '서울시설공단에서 관리하는 자동차전용도로 상 교량 정보입니다. 서울시설공단은 2015년부터 서울시의 위탁을 받아 자동차전용도로 시설물을 관리하고 있으며, 2026년을 기준으로 총 164개의 도로시설물을 관리하고 있습니다. 본 자료에서는 124개 교량의 정보를 제공하며,  교량명, 교량종류, 교량위치, 차로수, 시설물안전법에 따른 종별구분 및 안전등급, 교량 연장, 폭, 구조형식 등과 같은 교량 제원을 제공합니다. 연간 단위로 업데이트 할 예정입니다.- 제공대상: 교량 124개소 (연간 현행화 예정)- 제공정보: 노선, 교량명, 종류, 소재지번(위치), 시설물종별, 상부구조형식, 교량연장(미터), 교량폭(미터), 차로수, 준공년도, 공용년수, 안전등급- 제공부서: 서울시설공단 도로시설처'
