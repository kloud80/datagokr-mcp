summary_user: 울산항만공사가 제공하는 선박 하역 기록을 하역 건 단위로 담으며, 선박명·하역항과 적재항·제품 유형·선하증권 번호와 화물 수량, 준비통지서 제출·승인일, 하역·적재 시작과 완료 일시를 포함한다. 해운·물류 분석가가 특정 선박이 어느 항에서 실어 온 어떤 화물을 언제 준비통지 후 얼마 만에 하역했는지, 즉 선박별 하역 소요 시간과 대기 시간을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 입출항·물동량 데이터와는 선박명이나 항구명 같은 이름 매핑, 또는 같은 기관 코드로만 이어 쓴다.
limits: 공통 식별 키가 없어 다른 기관 데이터와 정확히 결합하기 어렵고, 선박명·항구명 문자열 매칭에 의존해야 한다. 이 데이터는 하역 건별 기록이어서 항만별 월간 물동량 같은 집계 지표는 따로 합산해 만들어야 한다.
