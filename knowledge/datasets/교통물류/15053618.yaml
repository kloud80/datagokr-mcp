summary_user: 한국철도공사가 철도통계연보에 싣는 연도별 철도차량 정비실적을 차종·검수종류(검종)별 정비량과 단위로 정리한 전국 단위 집계 파일(CSV)이다. 철도 정책 담당자나 연구자가 "고속철도·일반열차·화차 정비량이 해마다 어떻게 늘고 줄었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 연도와 차종 이름을 맞추거나 같은 기관(한국철도공사)의 다른 통계와 나란히 놓고 비교한다.
limits: 공통 조인 키가 없어 차량 보유현황 같은 다른 데이터와 자동으로 결합되지 않고, 이름 매핑을 직접 해야 한다. 전국 집계라서 지역별·차량 편성별 정비 내역은 담지 않는다.
