summary_user: 안산시 교차로별 월간 교통 통계를 담은 파일로, 통계일·교차로 아이디별로 교통량·용량·서비스 수준을 기록한 집계 데이터다(CSV 약 245KB). 시 교통 담당자나 분석가가 "어느 교차로가 어느 달에 용량 대비 교통량이 많아 서비스 수준이 떨어지는가"를 보고 신호 조정·혼잡 개선 대상을 고르는 데 쓴다. 전역 조인 키는 없어, 교차로 아이디나 교차로 이름을 안산시의 다른 교통·신호 자료와 직접 맞춰 이어 써야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 기관·전국 자료와는 이름·코드 매핑 없이 바로 연결되지 않는다. 범위는 안산시 한 곳이며 좌표가 없는 비공간 자료다. 포털 설명에 나온 평균속도·대기시간·신호위반·보행자 통계는 실제 필드에 없다.
