summary_user: 경기도 일반국도의 상시 조사 교통량을 연도·노선(호선명, 호선코드)별로 묶어 월요일부터 일요일까지 요일별 평균값으로 정리한 집계 통계를 담는다. 교통 분석가나 정책 담당자가 '이 국도 노선은 주말 교통량이 평일보다 얼마나 많은가'처럼 노선별 주중·주말 이용 패턴을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 교통량 데이터와는 호선명이나 호선코드(route_cd)를 이름·코드 매핑으로 맞추거나 같은 경기도 기관 코드 체계 안에서만 이어 쓴다.
description_portal: 이 데이터는 일반국도별로 요일에 따른 평균 교통량을 연도별로 정리한 통계로, 호선명, 호선코드, 월요일부터 일요일까지 각 요일의 평균 교통량 수치를 포함합니다. 이를 통해 도로 이용의 주중과 주말 간 패턴을 비교하거나 특정 요일에 집중되는 교통량 특성을 분석할 수 있습니다. 교통 흐름 최적화, 혼잡 시간대 관리, 대중교통 배분 조정 등 정책 수립의 기초자료로 활용 가능하며, 특히 장거리 운송 및 통근 교통에 대한 효율적 대응 전략 수립에도 도움이 됩니다. 호선별 분석이 가능하여 특정 노선에 대한 집중 분석 및 도로 유지보수 계획 수립에도 유용한 자료입니다.
