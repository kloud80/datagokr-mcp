summary_user: 지방자치단체가 관리하는 버스업체를 업체 한 곳씩 적은 표준데이터로, 업체명·소재지·운영구분·노선수·버스보유대수·총직원수 등을 담고 전체 372건이다. 지역별 버스업체가 몇 곳이고 노선과 보유 차량 규모는 어떤지 확인하려는 분석가나 사업자가 쓴다. 소재지도로명주소·소재지지번주소(address)를 키로 다른 주소 기반 데이터와 잇고, 노선·정류장·실시간 도착 데이터와는 공통 키가 확인되지 않아 업체명이나 지역명으로 맞춰 봐야 한다.
