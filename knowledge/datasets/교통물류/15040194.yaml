description_portal: 1. 해당 데이터는 고속철도  SRT의 경부선과 관련된 역간거리(영업거리, 공용선-수서, 동탄, 지제, 천안아산, 오송, 경부선-대전, 김천구미, 동대구, 신경주, 울산, 부산)에 대한 정보를 나타냅니다.2. 수서-동탄, 수서-지제 등 각 역별 역간거리(영업거리)를 확인하실수 있습니다.3. (예시)수서-동탄 역간거리는 32.4입니다. (단위 :KM)4. 데이터 내 0으로 , 적힌 수치는 '데이터 없음'을 안내드립니다.* 해당 데이터는 1회성 데이터입니다.* 2021년 1분기 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.
