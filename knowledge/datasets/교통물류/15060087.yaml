description_portal: 우체국물류지원단의 운송사업 중 우편물 운송을 담당하는 운송차량의 정보를 제공하는 데이터입니다 해당 정보는 국민에게 우편물은 운송하는 차량의 종류, 톤수 등의 정보를 제공하고 있습니다. 이 데이터는 우체국물류지원단이 운영하는 사업소의 2009년부터 현재까지의 연도별·톤수별 차량 종류와 댓수의 정보를 확인할 수 있습니다. 이 데이터는 우편물 운송에 적합한 자동차 차종, 톤수 등의 정보를 제공하여 상용차를 생산하고 있는 업체에 기초자료로 활용할 수 있으며, 학계·연구기관에서는 우편물 운송에 투입되는 자원(장비) 수준을 파악할 수 있습니다.
