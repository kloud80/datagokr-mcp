summary_user: 한국철도공사 간선열차와 광역철도의 이용인원을 객실·거리·노선·발권유형·요일·차량별, 그리고 역별 승하차로 나눠 운행일자나 운행연월 단위로 집계한 전국 범위 통계(포털 기준 10종 오퍼레이션)를 담는다. 분석가나 사업자가 특정 KTX·광역철도 역의 월별 승하차 인원이 어떻게 변했는지, 어느 노선·차종의 이용이 많은지를 확인하는 데 쓴다. 역코드(stn_cd)가 역 단위 조인 키(transit_node_cd)라 역 위치·시설 데이터나 다른 승하차 데이터와 역 기준으로 이어 쓰고, 노선코드·차종코드·거리구분코드는 포털이 함께 제공하는 코드정보 파일로 뜻을 풀어 쓴다.
description_portal: '한국철도공사 이동/발권유형 통계정보 데이터로, 간선열차 객실별 이용인원 통계, 간선열차 거리별 이용인원 통계, 간선열차 노선별 이용인원 통계, 간선열차 발권유형 통계, 간선열차 역별 승하차 통계 , 간선열차 요일별 이용인원 통계 , 간선열차 차량별 이용인원 통계 , 광역철도 노선별 이용인원 통계, 광역철도 역별 승하차 통계 , 간선열차 노선별 인거리 통계 항목이 있습니다.* "한국철도공사_발권/이동유형 통계정보.xlsx"는 "한국철도공사_발권/이동유형 통계정보 서비스"의 API의 코드정보입니다. 해당 API 이외의 철도공사가 제공하는 API와는 상이할 수 있으며, 실제 사용되는 코드정보가 아닙니다.* API 호출시, 페이지 당 건수를 제한하는 numOfRows는 최대 50건으로 권장합니다.* 참고자료 : 10종의 오퍼레이션을 사용하기 위한 코드정보* 통계데이터 갱신 주기는 각 API의 상세설명 참고'
