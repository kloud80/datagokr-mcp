description_portal: 본 데이터는 한국도로공사가 고속도로에서 실시한 적재불량 차량 단속 실적을 연도별로 정리한 통계자료이다. 구성 항목은 "구분", "상세구분" 및 2009년부터 2025년 6월까지의 단속 실적을 포함한다. 적재불량은 화물차량이 화물을 적절하게 고정하거나 덮개를 씌우지 않아 도로 위 위험 요소가 되는 경우를 의미하며, 본 데이터는 해당 위반 건수 및 세부 유형을 통해 안전관리 실태를 파악할 수 있도록 한다. 이를 통해 도로 이용자 안전 확보와 사고 예방, 단속 정책의 개선, 법규 위반 감소를 위한 정책 수립의 기초 자료로 활용할 수 있다. 또한, 연도별 추이를 분석함으로써 계절별 집중 단속 시기, 고위험 구간의 식별, 단속 강화 필요 등을 파악하는 데 기여한다.
