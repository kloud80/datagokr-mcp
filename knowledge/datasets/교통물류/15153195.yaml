summary_user: 한국건설기술연구원이 조사한 전국 도로 수시조사 지점의 교통량 통계로, 필드명으로 보아 조사연도·도로등급·지점 일련번호·시간대별로 전체 교통량과 13개 차종별 교통량을 담는 집계 자료다. 교통 분석가나 도로 계획 담당자가 특정 등급 도로 지점에서 시간대별 화물차·승용차 통행 비중이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 교통량·사고 데이터와는 조사연도나 지점번호(FPOTG_SN) 같은 값을 이름 기준으로 맞춰 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시지점통계 정보입니다.\""
