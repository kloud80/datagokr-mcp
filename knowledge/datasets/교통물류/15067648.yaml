summary_user: 국가철도공단이 보유한 철도 관련 사진을 한 장(첨부파일) 단위로 분류명·제목·등록일·다운로드 경로와 함께 담은 목록 파일입니다. 철도역·철도차량·철도시설·바탕화면·철도여행·기타일반·사진공모전 입상작으로 나뉘어 있어, 홍보물이나 교육자료를 만드는 사람이 '구형 철도차량이나 특정 역 사진을 어디서 받을 수 있나'를 찾는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 역명이나 차량명이 담긴 제목을 이름으로 맞춰 역·시설 데이터와 느슨하게 연결하는 정도로만 쓴다.
description_portal: 철도관련 사진 정보를 제공합니다.철도관련사진이 철도역/철도차량/철도시설/바탕화면/철도여행/기타일반/사진공모전입상작으로 구분되어 있습니다.관련 사진을 다운로드받을수 있도록 다운로드URL을 제공합니다.국내 및 해외의 철도차량 사진, 철도역의 사진. 철도 관련 각종 시설물 사진을 제공하고 있습니다.국내에서 현재는 운행되지 않는 구형 철도차량 사진 및 해외의 철도차량 사진도 제공하고 있습니다.철도관련 사진 공모전에서 수상한 사진도 제공하고 있습니다.첨부파일경로의 URL을 웹브라우져에 입력하면 다운로드 됩니다.(제공정보:분류명,등록일,첨부파일경로,파일순번,제목)
