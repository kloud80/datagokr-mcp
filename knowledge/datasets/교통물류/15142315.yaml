summary_user: 공단이 운항관리하는 연안여객선의 운항 실적을 운항월·권역 단위로 집계한 통계로, 계획 대비 운항선박수·운항건수, 운송인원수, 기상특보로 인한 운항취소 건수를 전국 범위로 담는다. 해운 분석가나 지자체 담당자가 "어느 권역에서 기상특보 때문에 결항이 많았고, 계획 대비 실제 운항률은 얼마였나"를 월별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 권역코드(sarea_cd)를 같은 기관의 다른 연안여객선 교통정보 데이터와 코드·이름으로 맞춰 이어 쓴다.
description_portal: "해당 데이터는 한국해양교통안전공단(KOMSA)에서 국가중점데이터로 개방한 \"연안여객선 교통정보\" 관련 데이터 중 하나로공단의 운항관리 대상 연안여객선의 월별 권역별 여객선 운항통계 정보를 포함하고 있습니다.운항월, 권역코드, 계획운항선박수, 운항선박수, 계획운항건수, 운항건수, 운송인원수, 운항취소기상특보건수 등이 포함된 정보 입니다.여객선의 대중교통 편입('20.12.)에 따라 도서민, 여행객 등 여객선 이용객의 교통편의 증진을 위해 연안여객선 교통정보를 활용할 수 있습니다. * (참고)국가중점데이터: 국민, 기업 등 수요 중심으로 개방의 효과성, 시급성 등이 높은 분야를 선정하고 민간에서 활용하기 용이한 형태로 정체, 가공하여 개방된 양질의 대용량 데이터를 제공합니다.* (유의사항) 해당 통계 정보는 참고용으로 제공되는 정보로 국가 통계 등 실제 데이터와 차이가 있을 수 있으니 사용에 유의하여 주시기 바랍니다."
