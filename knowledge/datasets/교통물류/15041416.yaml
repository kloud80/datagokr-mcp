description_portal: 수도권3호선에 포함된 도시광역철도역들의 철도운영기관명, 선명, 역명, 지상지하, 역층, 상세위치, 전화번호 데이터가 있습니다.지하철 관련 문의나 불편신고 등 지하철을 이용하면서 불편했던 부분을 문의해서 도움을 받을 수 있습니다.각 지하철 관할 별 전화번호는 아래와 같습니다.1. 서울지하철의 경우 서울교통공사 1~8호선 1577-1234   (문자신고 가능, 혹은  카카오톡 "서울교통공사"채널을 통해 실시간 상담 가능 )   - 서울교통공사 관할은 아래와 같아요.     1호선 서울역~청량리     2호선 전구간     3호선 지축~오금     4호선 남태령~불암산     5호선~8호선 전구간  - 일부구간은  코레일관할 입니다. 문자는 1544-7769 전화 1588-7788    예) 수리산역~선바위역 구간은 코레일 관할이라고 함 2. 신분당선 031-8018-77773. 9호선 02-2656-00094. 인천지하철 1,2호선  032-451-3650 (문자, 전화 가능) 5. 부산 지하철 1~4호선 051-640-7000 (문자신고 가능) 6. 대구 지하철 1~3호선 053-640-2114 7. 대전 지하철 042-539-31148. 광주지하철 062-600-8114
