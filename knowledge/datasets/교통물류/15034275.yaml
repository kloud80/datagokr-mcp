summary_user: 광진구 관내 학교 주변에 설치된 옐로우카펫을 설치 학교별로 한 행씩 담은 소규모 파일(csv 약 4.5KB)로, 설치학교명·도로명주소·설치년도·수량·관리기관 정보를 담는다. 주민이나 학부모가 '우리 아이 학교 앞에 옐로우카펫이 있는지, 언제 몇 개 설치됐는지'를 확인하거나, 분석가가 어린이보호구역 안전시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 학교명이나 도로명주소를 매칭해 어린이보호구역·학교 현황 데이터와 이어 쓴다.
description_portal: 서울특별시 광진구_옐로우카펫 설치 현황 데이터는 광진구 관내 어린이보호구역 및 횡단보도 주변에 설치된 옐로우카펫의 위치와 상세 정보를 제공합니다. 본 데이터는 시설명, 시설주소, 세부위치 등의 항목으로 구성되며, 어린이 보행자의 시인성을 높이고 교통사고를 예방하기 위한 안전시설 관리에 활용됩니다. 시설명은 설치된 옐로우카펫의 지정 명칭을 나타내며, 시설주소는 해당 위치의 도로명주소를 통해 정확한 위치 확인을 가능하게 합니다. 세부위치 항목은 설치된 구체적 지점을 표시하여 현장 점검 및 유지관리 효율성을 높입니다. 이 데이터는 광진구의 어린이 보호 정책 수립, 교통안전 인프라 강화, GIS 기반 지도 서비스 연계, 교통사고 예방 프로그램 운영 등에 중요한 기초자료로 사용됩니다. 주민과 행정기관이 협력하여 어린이 보행 안전을 강화하는데 기여할 수 있는 공공데이터입니다.
