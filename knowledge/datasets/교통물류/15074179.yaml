description_portal: 한국교통안전공단에서 대중교통 현황조사를 통해 조사한 광주광역시 지역의 최다 이용되는 정류장 정보입니다.해당 데이터는 교통카드 데이터를 이용하여 분석하여 추출된 데이터이며, 제공되는 정류장 정보는 지역, 정류장명, 총 이용인원입니다.단위는 명/일입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
