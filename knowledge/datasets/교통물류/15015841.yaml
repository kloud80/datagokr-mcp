description_portal: '서울시 어린이 보호구역 지정 현황에 대한 정보입니다.*용어설명어린이보호구역(스쿨존, School Zone)은 어린이의 안전을 보호하기 위해 학교, 유치원, 어린이집, 학원 등 어린이가 자주 다니는 시설의 주 출입문을 중심으로 일정 반경(주로 300m 이내) 도로를 지정한 구역대한민국에서는 「도로교통법」 제12조에 따라 지정·운영<주요 규제 및 시설>- 속도 제한 : 보통 시속 30km 이하로 제한, 일부 지역에서는 20km 제한도 시행.- 주·정차 금지 : 지정 구역 내에서는 원칙적으로 차량 주·정차가 금지, 위반 시 일반 도로보다 가중 과태료 부과.- 교통안전 시설물 : 과속단속 카메라, 방지턱, 노란색 신호등, 미끄럼 방지 도로 포장. 노란색 보도 블록, 횡단보도 안전 펜스, 옐로 카펫(어린이 대기 구역 표시)'
