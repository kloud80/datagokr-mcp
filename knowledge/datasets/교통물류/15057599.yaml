summary_user: 외항 입항 선박별 컨테이너 반출입 현황을 항구청·입항연도·입항횟수 단위로 담은 API이며, 반입·반출 구분과 적재·공 컨테이너 규격별 개수, TEU 합계를 필드로 둔다. 항만 물류 담당자나 분석가가 특정 선박의 입항 건에서 컨테이너가 얼마나 반출입됐는지 확인하는 질문에 쓴다. 호출부호(clsgn, vessel_id)로 선박 정보를 가진 다른 해운·항만 데이터와 이어 쓰며, 항구청코드·업체코드는 조회 조건으로 쓴다.
description_portal: 이 데이터는 해양수산부에서 외항에서의 컨테이너 반출입 현황 정보를 제공하기 위해 수집한 데이터입니다.  조회 대상 항만청코드, 선박 호출부호, 업체코드, 입항연도 및 입항횟수 파라미터 입력으로 데이터를 조회할 수 있으며, 본 데이터의 주요 내용은 항만명, 호출부호, 입항횟수, 수출입 구분, 컨테이너 번호 및 규격, 반출입 장소, 선하증권 번호, TEU 등으로로 구성되어 있습니다.  본 데이터는 항만에서 발생하는 컨테이너 물동량 관리, 수출입 흐름의 파악, 운송 및 물류 효율성 분석 등 실무적 업무에 적용될 수 있으며, 통계 작성, 항만 운영 개선, 물류업계의 처리 능력 평가 등에도 활용될 수 있습니다.
