summary_user: 구리시에서 이루어진 주정차 위반 단속을 단속일시·단속장소·단속방법 단위로 담은 건별 기록 파일로, 집계년도와 시군명이 함께 들어 있고 범위는 구리시 한 개 시군구다(CSV 약 22.6MB). 시민이나 분석가가 '구리시에서 불법 주정차 단속이 자주 이루어지는 장소와 시간대는 어디인가'를 확인하거나 단속 정책을 점검할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명이나 단속장소 이름을 매핑해 잇거나 같은 기관(구리시) 데이터끼리만 연결한다.
description_portal: 본 데이터는 주정차위반 단속이 이루어지는 위치에 대한 현황 정보를 제공한다. 단속 위치, 단속 방식, 관련 행정구역 등의 정보를 포함하여 불법 주정차 예방과 교통 질서 확립을 목적으로 구축되었다. 해당 데이터는 시민의 교통 편의 증진, 교통안전 정책 수립 및 민간 서비스 개발 등에 활용될 수 있다.
