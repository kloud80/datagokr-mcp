summary_user: 부산교통공사가 운영하는 부산 도시철도 2호선의 역별 승강장을 승강장 한 개 단위로 담은 파일로, 승강장번호·상하행·지상/지하 구분·역층과 스크린도어·안전발판 설치 여부가 들어 있다(CSV 약 4KB 규모). 교통약자나 안전 분석가가 '부산2호선 어느 역 승강장에 스크린도어나 안전발판이 없는지, 승강장이 몇 층에 있는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 역 좌표·출입구·승하차 데이터와는 운영기관명·선명·역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 부산교통공사에서 운영하는 부산2호선의 승강장에 대한 데이터로 철도운영기관명,선명,역명,승강장번호,상하행,지상구분,역층,승강장연결 여부,스크린도어 유무,안전발판 유무 등이 있습니다.승강장은 철도역·정류장 등에서 열차나 차량에 타고 내리기 위해 만든 시설·장소를 뜻합니다. 보통 승강장 길이는 열차 길이 이상이지만, 대구 도시철도 3호선처럼 짧은 경우도 있으며 이때는 일부 출입문만 열립니다. 지하역은 보통 지하 2~3층, 지상 고가역은 보통 2~3층, 지상 노반역은 1층에 승강장이 지어집니다. 승강장은 역세권 측정 시 승강장 경계부터라는 기준으로 중요한 의미를 지닙니다. 영어로는 플랫폼(platform), 일본어로는 폼·홈(ホーム)이라 부르며, 중국 대륙은 참대(站台), 대만·홍콩은 월대(月臺)라 합니다. 임시승강장은 철도 회사가 임시로 정해 열차를 정차하는 곳으로, 상시 여객·화물을 취급하지 않는 간이 시설입니다. 임시승강장은 지역 청원이나 행사 등으로 수송량 증가가 예상될 때 설치되며, 일정 기간만 여객을 취급하는 경우가 많습니다.
