summary_user: 인천국제공항공사가 인천공항의 항공사별 월별 운항 실적을 담는 집계 API로, 조회 시작·종료 월을 정해 정기/부정기, 화물기/여객기, 국제선/국내선 구분별로 항공사명·항공사코드와 도착·출발·합계 편수를 준다. 항공 분석가나 관광·물류 업계가 특정 기간에 어느 항공사가 인천공항에서 몇 편을 띄웠는지, 화물기 운항이 늘었는지 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항공사명이나 항공사코드(airlineCode)를 이름·코드로 맞춰 연결해야 한다.
description_portal: 인천국제공항공사에서 제공하는 항공사별 항공/여객 화물 통계에 대한 데이터입니다. 시작 월과 종료 월을 요청 파라미터로 받아 데이터를 구분합니다. 조회기간, 정기/부정기, 화물기/여객기, 국제선/국내선을 기준으로 항공사, 항공사코드 ,도착편수,출발편수,합계편수 등을 제공합니다. 월별 데이터를 제공하며 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 1000000 트래픽을 제공합니다. 개발 계정과 운영 계정 모두 자동 승인됩니다. 데이터 포맷은 JSON과 XML을 모두 제공하고 있습니다.
