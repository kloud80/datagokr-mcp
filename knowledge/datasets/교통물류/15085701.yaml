summary_user: 대구도시철도 2호선 역별로 휴대폰 충전설비가 있는 층·상세위치·설비 수·이용요금·전화번호를 담은 역 단위 목록 파일(csv, 약 2KB)이다. 대구 2호선 이용객이 '어느 역 몇 층 어디에서 휴대폰을 충전할 수 있고 요금은 얼마인가'를 확인하거나, 분석가가 역사 편의시설 현황을 정리할 때 쓴다. 공통 조인 키나 역 코드가 없어 다른 역·시설 데이터와는 역명·선명을 이름으로 맞춰 연결해야 한다.
description_portal: 대구교톻공사에서 관리하는 2호선 역들의 휴대폰충전설비에 대한 철도운영기관명,선명,역명,역층,충전설비,상세위치,충전설비수,이용요금,전화번호 정보입니다.지하철 5호선 새 전동차에는 휴대전화를 충전할 수 있는 무선 급속충전 설비도 설치됐다. 휠체어석이 위치한 2칸과 중앙 2칸에서 무선 급속 충전을 이용할 수 있다. 충전이 완료될 때까지는 약 2시간이 소요되지만, 배터리가 없어 막막한 상황에서는 지하철을 이용하는 잠깐의 시간을 이용해 요긴하게 사용될 것 같다.특히 서울 지하철 5~8호선 지하철역에서 휴대용 휴대폰 충전기를 무료로 빌려준다. 3시간까지 무료이고, 원하는 지하철역에서 반납할 수 있다.
