description_portal: 이 데이터는 광주교통공사 소속 역사 내 상가의 월별 임대료 현황 정보입니다. 주요 필드는 구분, 역명, 구역, 계약자, 월임대료, 계약기간입니다. 구분은 대부분 ‘점포’로 되어 있으며, 역명은 소태, 학동증심사, 남광주 등 다양한 역을 포함합니다. ‘구역’은 상가의 세부 위치를 나타내고, ‘계약자’는 상가를 임대한 업체 또는 개인 명칭이 기재되어 있습니다. ‘월임대료’는 원 단위로 표기되어 있으며 일부 항목은 공실로 인해 결측치가 존재합니다. ‘계약기간’은 임대 시작일과 종료일이 포함되어 상가 운영 기간을 명확히 확인할 수 있습니다. 이 자료는 광주도시철도 역사 내 상가의 임대 현황 분석, 공실 관리, 임대료 변동 추이 파악 등 상권 운영 및 재무 계획 수립에 활용될 수 있는 기초 데이터입니다.
