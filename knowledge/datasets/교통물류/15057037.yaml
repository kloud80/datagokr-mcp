summary_user: 경기도 31개 시군에서 인허가를 받은 이사화물운송업체를 업체 한 곳씩 담은 건별 목록으로, 인허가일자·영업상태·폐업일자·자본금·면허 유효기간과 도로명·지번 주소, 위경도 좌표를 포함한다. 분석가나 사업자가 '경기도 어느 시군에 영업 중인 이사화물업체가 몰려 있는가'처럼 업체 분포와 영업상태를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군 코드·이름(SIGUN_CD), 업체명, 주소·좌표 매핑으로 잇고, 허가받은 운송사인지는 전국화물자동차운송사업자표준데이터를 기준으로 대조한다.
description_portal: 이사화물업체 현황 데이터는 경기도 31개 시군에서 인허가를 받은 이사화물운송업체의 정보를 제공합니다. 데이터는 업체의 명칭, 인허가일자, 영업상태, 폐업일자, 소재지 면적, 등록일자, 소유형태, 업체유형, 자본금, 면허정보(발급일자, 유효기간), 지정정비업종코드 및 명칭, 도로명주소, 지번주소, 우편번호, 위도·경도 등의 항목으로 구성되어 있습니다. 이 데이터는 물류정책 수립, 시장분석, 이사화물업체 위치기반 서비스 개발 등에 활용될 수 있으며, 공공데이터포털 및 지방행정데이터개방시스템을 통해 제공됩니다. 다만, 본 데이터는 2018년 9월 6일 이후 갱신이 중단되었으며, 최신 정보는 별도의 데이터셋을 통해 확인해야 합니다.
