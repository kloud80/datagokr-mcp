summary_user: 천안시 안에 설치된 공유킥보드 등 개인형 이동장치(PM) 주차장을 한 곳씩 담은 CSV 파일로, 구·읍면동·번지·장소명과 위도·경도, 주차가능 대수를 기록한다. 시민이나 PM 이용자가 '내 주변 어디에 킥보드를 세울 수 있나'를 확인하거나, 시 담당자·분석가가 PM 주차 공간이 어느 동에 몰리고 어느 동에 부족한지 따지는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도로 공간 결합하거나 구·읍면동 이름을 맞춰 붙여야 하며, 일반 차량 주차장은 전국주차장정보표준데이터를 따로 봐야 한다.
description_portal: 충청남도 천안시 개인형 이동장치(PM) 주차장 현황입니다연번, 주차장 위치, 주차장 주소, 법정동, 설치일자 등의 정보가 포함되어 있습니다.본 데이터는 공유킥보드 등 개인형 이동장치의 무질서한 방치를 방지하고 안전한 주행 환경을 조성하기 위한 데이터입니다. 연번, 주차장 위치, 주차장 주소는 시민과 이용자가 정확한 주차 공간을 확인할 수 있도록 위치 기반 정보를 제공합니다. 설치연도는 기반시설 구축 시점과 유지·보수 주기를 판단하는 자료가 됩니다. 본 데이터는 도시 교통체계 개선, 보행자 안전 확보, PM 주차 질서 확립, 관련 정책 수립 등 여러 행정 업무에 기초 자료로 활용될 수 있습니다.
