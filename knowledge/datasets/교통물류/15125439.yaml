summary_user: 대전광역시 유성구 관내 불법주정차 단속을 건별로 담은 파일로, 포털 설명 기준 약 12만 1천 행이며 각 행에 시도명·시군구명·단속일시·단속장소가 들어 있다. 구민이나 분석가가 유성구에서 어느 장소·시간대에 주정차 단속이 몰리는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구명 같은 이름 매핑이나 단속장소 주소 문자열로만 이어 쓴다.
description_portal: 대전광역시 유성구 관내에서 발생한 불법주정차 단속현황에 대한 데이터를 제공합니다.해당 데이터는 시도명, 시군구명, 단속일시, 단속장소 등에 대한 항목을 포함하여 총 121,091행으로 구성되어 있습니다.해당 데이터는 지역별 교통잘서와 주차문제 발생 현황을 분석하는 데 활용할 수 있습니다.또한 교통안전 정책수립, 주차난 해소 방안 마련, 도로이용 환경 개선 등에 활용 가능합니다.이외에도 내비게이션 및 교통 정보 서비스 개발, 상권 및 유동인구 분석, 교통흐름 연구, 시각화 콘텐츠 제작 등 다양한 분야에 활용할 수 있습니다.
