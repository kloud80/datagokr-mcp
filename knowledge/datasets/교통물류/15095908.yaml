summary_user: 인천광역시 택시에 장착된 IoT 센서가 도로를 달리며 측정한 습도(%)를 센서명·측정 시간·위도·경도·지오해시·시·군구·동과 함께 건별로 기록한 원천 데이터이며, 약 269MB 규모의 zip 파일로 제공된다. 도시 기후·환경 분석가가 "인천 어느 동네 도로가 어느 시간대에 습도가 높은가"처럼 도로 주변 미기후를 시간·장소별로 비교하는 데 쓴다. 전역 조인 키는 없어서 위도·경도나 지오해시로 다른 공간 데이터와 위치를 맞추거나, 군구·동 이름을 매핑해 행정구역별 통계와 잇는다.
