description_portal: '서울특별시 공공자전거 따릉이 대여소별 이용정보입니다. 공공자전거 대여소별 이용정보는 서울시 공공자전거(예: 따릉이) 대여 시스템에서 수집된 각 대여소의 이용 현황 데이터를 의미합니다. 이 데이터는 도시 교통 정책 수립, 자전거 인프라 개선, 시민 편의 증진에 활용됩니다.자치구 별 설치 되어있는 대여소 별 대여 및 반납 정보를 월별 단위로 제공하고 있습니다.대여 및 반납 건수를 통하여 자치구 또는 대여소별 로 이용 추이를 쉽게 알 수 있습니다.대여소 이름, 대여소 그룹 이름, 대여건수, 반납건수 를 확인 하실 수 있습니다.'
