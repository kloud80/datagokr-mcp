description_portal: 이 데이터는 광주교통공사의 월별 에너지 사용량과 비용 현황을 기록한 자료입니다. 주요 항목은 구분(연월), 전기 사용량(kWh), 가스 사용량(Nm³), 전기 요금, 가스 요금입니다. ‘구분’은 2017년 1월부터 월 단위로 표시되며, 전기와 가스 사용량은 각각 실제 소비량을 나타냅니다. 요금 항목은 해당 월의 에너지 사용에 따른 금액으로, 계절 변화나 운영 조건에 따라 변동하는 추세를 확인할 수 있습니다. 이 자료는 역사·차량 운행에 따른 에너지 소비 패턴 분석, 비용 절감 방안 마련, 계절별 에너지 효율 비교, 온실가스 배출량 산정 등의 기초 자료로 활용할 수 있습니다. 또한 장기적인 에너지 절감 정책 수립과 친환경 교통 운영 전략을 설계하는 데에도 중요한 근거가 됩니다.
