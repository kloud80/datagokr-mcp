description_portal: 본 데이터는 한국도로공사가 수집한 고속도로 차종 분류 원시 데이터로, AVC(Automatic Vehicle Classification) 시스템을 통해 15분 단위로 집계된다.  AVC 시스템은 차량의 축수, 속도, 길이 등을 자동 검지하여 차량을 다양한 차종으로 분류한다.  데이터에는 수집 시각, 검지 지점, 차종 코드, 차량 통과 건수 등이 포함되어 있으며,  고속도로 교통량 분석, 이용 패턴 파악, 요금 정책 수립, 도로 설계 계획 수립, 교통 흐름 개선 등 다양한 분석에 활용될 수 있다.  시간대별·차종별 통행 현황을 정량적으로 분석할 수 있어, 정책 개발 및 학술 연구 등 다양한 분야에서 유용하다.  데이터는 CSV 형식으로 제공되며, 노선 및 기간 조건을 설정해 원하는 정보를 쉽게 조회할 수 있도록 구성되어 있다.* 기상 여건 등으로 차종분류장치(AVC)의 감지 데이터에 대한 오류 발생이 일부 있을 수 있습니다.* 제공되는 데이터는 샘플데이터로, 전체 데이터를 다운로드 받으시려면 아래 링크로 접속 부탁드립니다.  (로그인 후 전체 데이터 다운로드 가능)  - https://www.bigdata-transportation.kr/frn/prdt/detail?prdtId=PRDTNUM_000000000044
