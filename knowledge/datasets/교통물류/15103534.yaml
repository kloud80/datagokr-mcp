summary_user: 한국도로공사 고속도로 AVC(차종분류장치)가 축수·속도·길이로 검지한 차량을 15분 단위로 묶어, 수집일·검지 지점(위도·경도)·방향·차로·차종별로 담은 전국 범위 데이터이며 포털 파일은 569바이트짜리 샘플 CSV다. 교통 분석가나 연구자가 '특정 고속도로 구간에서 시간대별로 화물차 비중이 얼마나 되는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 AVC 위도·경도를 이용한 위치 매칭이나 같은 기관 코드(고유ID 등)로만 이어 쓴다.
