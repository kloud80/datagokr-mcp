description_portal: '데이터 개요국토교통부_세계항공종사자_현황 데이터는 국제항공운송협회(IATA) 자료를 기반으로, 전 세계 주요 항공사의 연도별 종업원 수 정보를 제공합니다. 항공사명, 항공사 코드, 연도, 종업원 수 등으로 구성되어 있으며, 항공사 간의 조직 구조, 아웃소싱 범위, 인력 운영 방식이 상이하므로 단순 비교보다는 항공사 특성을 고려한 분석이 필요합니다.데이터 제공 항목영문항공사명한글항공사명항공사코드 (IATA 2자리)년도 (2016년~)종업원수 (명)출처 및 갱신 주기국제항공운송협회(IATA)에서 매년 발간하는 자료를 기반으로 구성됨최신 연도 기준으로 업데이트 (예: 2024년 자료 포함)데이터 해석 시 유의사항항공사별로 직접 고용/외주 인력의 범위가 다르므로종업원 수 단순 비교는 왜곡된 해석을 초래할 수 있음예: 페덱스(FedEx)는 자사 화물 운송 및 지상조업 대부분을 자체 운영하여 타 항공사 대비 고용 규모가 큼활용 안내글로벌 항공 산업의 고용 규모 비교연도별 항공사 인력 변화 추이 분석코로나19 이후 항공산업 회복 수준 진단항공사 경영 전략(내부 인력 관리 구조 등) 분석의 기초자료예시 데이터영문항공사명한글항공사명항공사코드연도종업원수ABX AirABX 에어GB2024572Aer Lingus에어링구스EI20245322Aerolineas Argentinas아르헨티나 항공AR202410374Aeromexico아에로 멕시코AM202411608※항공사 고용 구조 해석에 필요한 추가 항목(운항 형태, 지상조업 외주 여부, 자회사 유무 등)은 해당 항공사의 기업공시 또는 IR 자료를 참고해야 함'
