description_portal: '전북특별자치도 전주시_주정차 단속현황 데이터는 전주시 내에서 이루어진 주정차 위반 단속 내역을 제공하는 데이터입니다. 이 데이터는 단속일시, 단속장소, 단속구분 필드로 구성되어 있습니다. ‘단속일시’는 해당 위반 행위 날짜와 시간을 나타내며, ‘단속장소’는 위반 위치를 제공합니다. 또한, ‘단속구분’은 단속 유형(예: 고정식, 이동식, 신문고 등)을 구분하는 항목입니다. 이 데이터는 교통 질서 유지, 행정 단속 정책 분석, 주정차 위반 현황 파악 및 교통 행정 서비스 개선에 활용될 수 있는 기초 자료입니다.데이터 해당기간 : 2024.1.~2025.6.데이터 항목 : 단속일자, 단속시간, 단속장소명, 단속구분데이터 제공부서 : 양구청 산업교통과'
