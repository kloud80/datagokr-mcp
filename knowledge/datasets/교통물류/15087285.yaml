summary_user: 2012년부터 2024년까지 연도별로 16개 시도별 도로부문 온실가스 배출량을 이산화탄소·메탄·아산화질소 가스별로 나눠 담은 집계 파일이다(단위 천톤CO2eq). 정책 담당자나 분석가가 "우리 시도의 도로 교통 이산화탄소 배출량이 최근 10여 년간 어떻게 변했고 다른 시도와 비교하면 어떤가" 같은 질문에 쓴다. 전역 조인 키는 없어 시도 이름(구분)과 연도로 맞춰 같은 기관의 지역별 차종별·연료별 도로부문 배출량 자료와 이어 쓴다.
description_portal: 개방 데이터는 2012년부터 2024년까지 연도별로 16개 시도에 따른 지역별 및 CO2, CH4, N2O 온실가스별 도로부문 온실가스 배출량을 표준화하여 등록하여 제공하고 있습니다.(단위:천톤CO2eq)해당 자료는 지역별, 온실가스별로 온실가스 배출량 산정 결과 비교 및 분석에 활용될 수 있습니다. 또한 연도별로 배출량 산정 결과를 비교할 수 있습니다.해당 자료와 유사한 자료로 지역별 차종별 도로부문 온실가스 배출량, 지역별 연료별 도로부문 온실가스 배출량 자료가 있습니다.
