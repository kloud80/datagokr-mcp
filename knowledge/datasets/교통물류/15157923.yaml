summary_user: 광주 시내버스 BIS의 노선(첫차·막차·배차간격·기종점), 정류소(정류소명·영문명·좌표·ARS 번호), 노선별 경유 정류소, 정류소 도착정보, 노선 버스위치를 다섯 개 오퍼레이션으로 담은 건별 원천 API이며, 범위는 광주 한 시도이고 정류소는 좌표 단위로 개별 제공된다. 시민이나 앱 개발자가 "이 정류소에 몇 번 버스가 언제 오는가", "이 노선의 첫차·막차와 배차간격은 얼마인가"를 확인하는 데 쓴다. 노선 ID(LINE_ID)와 정류소 ID(BUSSTOP_ID)로 이 API 안의 오퍼레이션끼리 잇고, 다른 데이터와는 전역 조인 키가 없어 정류소명·ARS 번호·좌표 매칭으로만 연결한다.
limits: 도착정보·버스위치·노선별 정류소 조회는 노선 ID나 정류소 ID를 필수로 요구하므로 노선·정류소 목록을 먼저 받아 코드를 넘겨야 한다. 실호출 검증에서는 5개 오퍼레이션 중 2개만 성공했고, 노선별 정류소·도착·버스위치 3개는 최소 파라미터로 응답이 없었다. 개발계정은 하루 100회로 제한된다.
