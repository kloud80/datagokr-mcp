description_portal: 이 데이터는 해양수산부 선박대기오염물질관리시스템을 통해 선박의 대기오염물질 관리를 위하여 수집된 코드정보를 제공합니다.  본 데이터의 주요 내용은 국제선박용도, 레저선항, 선박분류, 연안선박, 저감연료, 활동자료 등 선박 대기오염물질 관리와 관련된 다양한 코드 정보를 포함하고 있습니다.  본 데이터는 선박 대기오염물질의 관리 체계 구축, 정책 수립을 위한 분석자료, 선박의 분류 및 운영현황 파악, 저감연료 도입 현황 모니터링 등 해양환경 개선과 규제 준수를 위한 참고자료로 활용될 수 있습니다.
