summary_user: 인천광역시 관내 택시의 승차일별 승차·하차 행정동 쌍마다 이동횟수, 평균 이동시간(분), 평균 이동거리(km)를 담은 집계 통계로, 범위는 시도 단위이고 읍면동(행정동) 단위로 나뉜다. 교통 분석가나 정책 담당자가 '인천에서 어느 동에서 어느 동으로 택시 이동이 가장 많고, 평균 몇 분·몇 km를 가는가' 같은 택시 수요 흐름(O-D)과 승차 집중지역을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 승차·하차 행정동명(rideDongName)을 행정동 이름 매핑으로 맞추거나 같은 기관 데이터와만 연결해 쓴다.
description_portal: 인천광역시가 제공하는 택시 운행 통계 조회 서비스 API는 관내를 운행하는 택시의 운행 실적 및 관련 통계 데이터를 제공합니다. 이 API는 택시 운송 서비스의 운영 효율성을 분석하고, 수요-공급 예측 및 교통 정책 수립의 기초 자료로 활용되어 시민들의 택시 이용 편의를 개선하는 데 목적이 있습니다.택시 자치구별 이동패턴(O-D) TOP50, 택시 승차 집중지역 TOP50 등의 서비스를 제공합니다.교통 정보의 투명성을 높이고 도시 교통 효율성을 강화하는 핵심 데이터 소스로 활용됩니다.
