      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: YMD
        required: true
        example: '20220701'
        desc: 연월일
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
