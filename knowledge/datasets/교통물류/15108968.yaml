description_portal: 해당 자료는 보행안전지수 지도 시각화를 위한 중간 데이터로, 의왕시 도로구간 내 전주 설치 현황을 공간 기반 속성과 함께 정리한 자료입니다. 각 전주는 공간지리식별번호, 지형지물부호, 전주구분 등의 항목으로 유형을 구분하며 TM 중부 GRS80 기준 위도·경도 좌표를 포함하여 정확한 위치 정보를 제공합니다. 전주는 가로등, 통신선, 전력선 등을 지지하는 구조물로 교통안전 및 보행환경에 직간접적인 영향을 미치며, 특히 야간 보행 시 시야 확보와 사고 예방에 기여합니다. 데이터는 전주의 위치 분포·구분별 특성을 시각화하여 조명 취약 지역이나 시설 집중 지역을 분석하고 보행 안전취약지 진단 및 시설 보강의 우선순위 도출에 활용할 수 있습니다. 본 자료는 2022년 기준 1회성 수집된 정보로, 참고용 데이터로 활용하는 것이 적합합니다.
