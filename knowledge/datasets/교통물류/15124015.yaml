summary_user: 경기도버스운송관리시스템(BMS)에서 정류장 태그 기록 없이 운행되는 태그리스 버스노선을 노선별로 모은 목록으로, 각 노선에 부여된 버스노선아이디(bus_route_id)를 담는다. 교통 분석가나 행정 담당자가 경기도에서 정류장 태그 기준 추적이 되지 않는 노선이 어떤 것인지 확인하고, 비정상 운행 분석이나 대중교통 정책 검토의 기초 목록으로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 경기도 버스 노선·정류장 자료와는 버스노선아이디 같은 기관 내부 코드나 노선 이름을 맞춰 연결한다.
description_portal: 이 데이터는 경기도버스운송관리시스템(BMS)에서 수집한 태그리스(Tagless) 버스노선 정보입니다. '태그리스'란 정류장 태그 기록 없이 운행되는 노선으로, 일반적인 노선 추적과는 다른 방식의 관리가 필요한 노선을 의미합니다. 이 자료는 각 태그리스 버스노선에 고유하게 부여된 '버스노선아이디'를 포함하고 있으며, 교통체계 내 관리되지 않거나 운행경로 추적이 어려운 버스 노선에 대한 정보를 파악하고자 할 때 유용합니다. 특히, 대중교통 정책 수립, 비정상 운행 분석, 교통 인프라 개선 등의 연구와 행정적 판단을 위한 기초자료로 활용될 수 있습니다. 데이터는 BMS 시스템에서 도출되며, 정류장 태그를 기준으로 분석되지 않는 특수 노선에 해당하므로 분석 시 주의가 요구됩니다.
