summary_user: 울산광역시 남구에 설치된 무인단속시스템(불법주정차 단속) CCTV를 설치장소별 한 건씩 담은 현황 파일로, 도로명·지번주소, 카메라 대수, 단속시간, 설치연도를 함께 담는다. 주민·운전자가 "남구 어느 도로에서 몇 시에 주정차 단속 카메라가 작동하나"를 확인하거나, 분석가가 단속 카메라의 설치 분포와 연도별 확충 추이를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소·지번주소를 지오코딩하거나 주소 문자열을 맞춰 남구 내 다른 시설·단속 자료와 이어 쓴다.
