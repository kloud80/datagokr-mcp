summary_user: 대전시 버스정보시스템에 등록된 시내버스 차량별 등록 현황(차량 등록번호, 버스 종류, 운행 노선 등)을 차량 단위로 조회하는 API로, 범위는 대전광역시 한 시도입니다. 대중교통 분석가나 앱 개발자가 '이 노선에는 어떤 버스 차량이 몇 대 배정돼 있는가'를 확인할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 기관의 노선 조회 API에서 받은 노선 ID(busRouteId)를 넘겨 조회하거나 노선·정류소 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 대전광역시 차량등록정보 조회 서비스는 대전시 버스정보시스템의 핵심 데이터를 통합 제공하는 서비스로서, 버스 도착 예정 정보, 정류소 위치 및 상세정보, 각 노선별 경로, 차량별 등록 현황 등을 포함합니다. 이 데이터는 각 차량의 등록번호, 버스 종류, 운행 노선 등 세부 정보를 체계적으로 관리하여 대중교통 운영과 관련된 행정업무 신뢰성을 높이고 시민들에게 정확하고 실시간 교통 정보를 제공하는 데 중점을 두고 있습니다. 또한 대전시 내 버스 교통의 현황 분석 및 효율적인 운영 관리, 정책 수립에 필수적으로 활용될 수 있으며, 차량별 이동 경로와 노선 정보가 정확하게 반영되어 교통 흐름 예측 및 문제 대응에도 중요한 역할을 합니다.
