summary_user: 국가교통정보센터가 제공하는 고속도로 구간 상세 정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 담는 데이터로, 고속도로 ID·방향 코드·링크 순번·링크 ID와 시도·시군구 이름, 등록·수정 일시를 행 단위로 가진다. 교통 분석가가 '특정 고속도로의 상행·하행 구간이 어떤 링크 순서로 이어지고 어느 시군구를 지나는가'를 파악해 링크별 실시간 속도·돌발 정보를 노선 단위로 묶어 볼 때 쓴다. 링크 ID(LNK_ID)로 같은 체계의 실시간 소통 데이터와 맞춰 볼 수 있으나 실측상 전역 조인 키는 확인되지 않았고, 시도·시군구는 이름으로만 매핑된다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국토교통부 국가교통정보센터에서 제공하고 있는 정보입니다.
