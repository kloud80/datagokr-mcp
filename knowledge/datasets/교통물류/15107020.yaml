summary_user: 서울교통공사가 관리하는 1~8호선 계열 273개 역(9호선 제외)의 역별 호선·역번호·역명과 직원 수, 수송인원, 운수수입을 역 단위로 정리한 집계 파일이다. 역별 이용 규모와 수입, 인력 배치를 비교하려는 분석가나 연구자가 '수송인원 대비 직원이 적은 역은 어디인가' 같은 질문에 쓴다. 전역 공통 조인 키는 없어서 다른 역별 승하차·시설 데이터와는 역명이나 역번호를 맞춰 대조해 잇는다.
limits: 표준 역 코드 같은 전역 조인 키가 없어 다른 기관 데이터와는 역명·역번호 매핑으로만 연결된다. 통합환승역은 역무실 1곳으로 운영되어 일부 호선의 직원 수가 0명으로 표기되므로 역별 인력 비교 때 주의한다. 9호선 역은 포함되지 않는다.
