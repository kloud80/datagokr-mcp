summary_user: 광주 서구 관내 교통법규 위반 단속을 건별로 담은 원천 파일로, 단속일시·단속동·단속장소·차량구분·단속구분·과태료 원금·위반법규를 기록하며 CSV 한 건(약 14MB)으로 받는다. 구청 교통 담당자나 분석가가 '서구에서 어느 동·장소, 어느 시간대에 어떤 유형의 위반이 가장 많이 단속되는가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속동 이름이나 단속장소 문자열을 매핑해 행정동·보호구역·단속카메라 표준데이터 등과 이어 써야 한다.
description_portal: '본 데이터는 광주광역시 서구 관내에서 발생한 교통법규 위반 행위에 대한 단속 정보를 수록한 자료로, 연번, 차량구분, 단속일시,차량구분, 단속동, 단속장소, 단속구분, 단속원금(과태료), 위반규정 등의 항목으로 구성되어 있습니다.각 단속 건에 대한 차량 종류 및 위반유형, 발생 시간·위치 등의 세부 정보는 행정처분 근거자료로 활용될 뿐 아니라, 교통 위반 다발지역 및 시간대 분석, 위반유형별 통계 산출, 단속 집중 행정전략 수립에 활용됩니다. 특히 단속특별지역(예: 어린이보호구역, 소방도로 등)에 대한 정보를 통해 취약지역 중심의 교통안전 정책 기획이 가능합니다.해당 데이터는 반복 위반 방지 및 시민 계도 중심의 예방행정 기반을 마련하고, 교통사고 감소 및 도심 교통질서 확립을 위한 기반 통계로서도 유용합니다. 교통단속 정책의 효율성 평가나 단속 장비 및 인력 배치 전략 수립 등에도 폭넓게 활용될 수 있습니다.'
