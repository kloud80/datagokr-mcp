summary_user: 청주시 4개 구(상당·서원·흥덕·청원)에 설치된 불법주정차 단속카메라를 대수별로 한 행씩 담은 위치 목록으로, 관리번호·설치 위치·행정동·지번·위경도를 포함한 CSV 파일(약 41KB)이다. 청주 시민이나 사업자가 '우리 가게 앞이나 자주 가는 동네에 주정차 단속카메라가 있는가'를 확인하거나, 분석가가 행정동별 단속카메라 분포를 파악하는 데 쓴다. 전역 조인 키는 없으므로 행정동명·지번으로 주소를 매핑하거나 위도·경도로 다른 위치 데이터(무인교통단속카메라·어린이보호구역 표준데이터 등)와 공간 결합해 쓴다.
description_portal: 본 데이터는 충청북도 청주시에 위치하고 있는 불법주정차 단속카메라에 대한 공공데이터로 단속카메라의 설치구(상당구, 서원구, 흥덕구, 청원구), 관리번호, 행정동명, 지번, 비고사항을 포함하여 제공하고 있습니다.불법주정차는 도로교통법에 따라 금지된 장소나 방법으로 주차 또는 정차하는 것을 뜻하며, 해당 데이터는 텍스트 형식의 데이터파일(CSV)형식으로 제공하고 있으며, 제3자 권리 등에 따른 이용허락범위의 제한이 없으므로 각종 관련 분야 통계자료의 작성에 참고하시거나 관련 정보 수집 및 현황 파악 등에 활용하여 주시기 바랍니다.
