summary_user: 부산광역시 중구에 주사무소를 둔 일반화물자동차 운송사업자를 업체 한 곳당 한 행으로 담은 파일로, 업종·업체명·도로명 주소·연락처·운영여부·차량 보유대수가 들어 있다. 화물을 맡기려는 화주나 지역 물류를 분석하는 사람이 "중구에서 현재 영업 중인 일반화물 운송사는 어디이고 차량은 몇 대씩 가졌나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명이나 주소를 직접 맞춰 이어야 하며, 허가 여부는 기준 데이터인 전국화물자동차운송사업자표준데이터와 대조한다.
description_portal: 부산광역시 중구 일반화물자동차운송사업자 현황 데이터는, 화물자동차 운수사업법 등 관련 법령에 따라 등록된 운송사업자의 주요 정보를 체계적으로 제공하는 공공데이터입니다. 해당 자료는 부산광역시 중구에 주사무소를 둔 일반화물자동차 운송업체의 업종, 업체명, 주사무소 도로명 주소, 연락처, 운영여부, 차량 보유대수 등에 대한 기본 정보를 포함하며, 각 운송사업자의 영업 현황에 대한 현행 정보를 주기적으로 제공하고 있습니다. 이 데이터는 지역 물류 산업의 구조 분석, 운송시장 현황 파악, 행정 업무 지원 및 정책 수립 등에 활용될 수 있습니다.
