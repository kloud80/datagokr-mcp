summary_user: 대전광역시 도로관리시스템에 등재된 중앙분리대를 시설물 한 건씩 담은 파일로, 위치(WKT 지리정보), 종류, 연장, 소속 행정읍면동, 도로구간번호 등을 담는다. 도로관리 담당자나 교통안전 분석가가 '어느 동, 어느 도로 구간에 어떤 종류의 중앙분리대가 얼마나 설치돼 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 행정읍면동 이름이나 도로구간번호·관리번호 같은 대전시 내부 코드로 같은 기관의 다른 도로시설물 데이터와 이어 쓴다.
description_portal: 대전광역시 중앙분리대 현황 데이터는 대전광역시 도로관리시스템에 등재된 중앙분리대의 위치, 종류, 설치 구간, 관리 상태 등 다양한 정보를 포함하고 있습니다. 이 데이터는 도로의 차량 흐름을 분리하고 교통사고 예방, 도로 안전 강화 등 교통 관리에 중요한 역할을 합니다. 중앙분리대 현황 자료는 도로시설물의 유지보수, 교통안전 정책 수립, 도시 인프라 관리 등 다양한 행정적 목적에 활용될 수 있도록 구성되어 있습니다. 2022년 공공데이터 기업 매칭 지원사업을 통해 청년 인턴이 직접 구축하고 정비한 데이터로, 법적 효력이 없으므로 참고 목적으로만 활용하시기 바랍니다.
