summary_user: 운송용 항공기의 기종별 주요 제원(좌석수, 최대이륙중량, 전장·전폭·동체폭, 순항속도, 항속거리, 연료탑재량, 이륙·착륙 활주길이, 항공기등급)을 기종 한 줄씩 담은 참조표로, 1,720바이트 크기의 작은 CSV 파일이다. 분석가가 "이 노선에 투입된 기종의 좌석수로 공급석을 추정하면 얼마인가", "이 활주로 길이에서 뜰 수 있는 기종은 무엇인가" 같은 질문에 기준값으로 쓴다. 기종(aircraft_type)을 키로 삼아 운항 실적·운항 스케줄 데이터의 기종 필드와 이어 좌석 공급량이나 기종별 운항 특성을 붙이는 데 쓴다.
description_portal: 한국공항공사(Korea Airports Cooperation)가 운영하는 전국 공항 이용시설정보를 제공합니다.운송용 항공기의 제원에 대한 데이터로  기종별 좌석수, 중량, 속도 및 연료탑재량, 이륙활주길이, 착률활주길이 등 제공하고 있습니다.전국공항 기준은 김포공항, 김해공항, 제주공항, 대구공항, 청주공항, 무안공항, 양양공항, 광주공항, 울산공항, 여수공항, 포항경주공항, 사천공항, 군산공항, 원주공항 14개 공항이 대상입니다.추가 문의사항 있으시면 02-2660-4807로 문의주세요!
