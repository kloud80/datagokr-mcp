summary_user: 경기도 내 요소수를 파는 주유소를 한 곳씩 담은 자료로, 주유소명·전화번호·재고 여부·리터당 판매단가·결제(갱신) 일자와 시간·도로명/지번 주소·위경도를 포함한다. 화물차·버스 운전자나 물류업체가 가까운 주유소 가운데 요소수 재고가 있고 값이 싼 곳을 찾거나, 분석가가 시군별 요소수 가격 차이를 비교하는 데 쓴다. 전역 조인 키는 없어 주소 문자열이나 위경도(REFINE_WGS84_LAT/LOGT)로 다른 주유소·충전소 위치 데이터와 공간 매칭해 잇는다.
description_portal: 오피넷에서 게시하고 있는 요소수 판매 주유소 정보 중 경기도에 위치한 주유소 정보입니다.경기도 내 요소수 판매 주유소 및 주유소 별 판매 단가 정보를 제공합니다.이 데이터는 경기도 내 주유소에서 판매되는 차량용 요소수의 지역별 판매가격 정보를 수록한 자료로, 주유소명, 전화번호, 요소수 재고 여부, 판매단가(원/리터), 결제일자 및 시간, 주유소 주소(도로명 및 지번), 위도 및 경도 정보를 포함하고 있습니다. 주요 항목에는 ‘판매단가(원/리터)’, ‘정제도로명주소’, ‘결제일자’, ‘정제WGS84위도’, ‘정제WGS84경도’ 등이 있으며, 지역별 요소수 유통 현황 파악, 공급 안정성 분석, 가격 모니터링, 물류 경로 최적화 등에 활용될 수 있습니다. 재고유무는 실시간 공급 여부를 파악하는 데 중요한 지표이며, 위치 정보는 GIS 기반의 공간 분석에도 유용하게 사용됩니다. 요소수는 디젤 차량의 배출가스 저감을 위한 필수 소모품으로, 공공 운송 및 물류업계에서도 중요한 데이터입니다.
