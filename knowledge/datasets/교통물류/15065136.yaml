summary_user: 부천시 관내 고가교를 시설물 한 곳당 한 행으로 담은 시설물 대장으로, 시설물번호·명칭·종류·종별(1~3종)·주소·준공일·설계기간·설계자·관리주체·연락처를 담는다(포털 설명상 총 10개소, 1,559바이트 CSV 파일). 시민이나 분석가가 "부천시에 어떤 고가교가 있고, 언제 준공됐으며, 관리 주체가 어디인가"를 확인하거나, 시설물 종별에 따른 안전관리 대상을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 시설물명을 매핑하는 방식으로만 이을 수 있고, 표준노드링크(link_id·node_id)에 붙이려면 주소를 공간 위치로 바꾸는 별도 작업이 필요하다.
limits: 좌표나 표준 링크·노드 ID가 없어 도로망 데이터와 바로 결합할 수 없고, 주소 기반으로 직접 매칭해야 한다. 범위는 부천시 한 곳의 개별 시설물에 그쳐 다른 시군구와 비교하는 데는 쓸 수 없다.
