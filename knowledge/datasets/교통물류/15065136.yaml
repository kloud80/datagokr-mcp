description_portal: '- 부천시 관내의 고가교 데이터로 시설물번호, 시설물명, 시설물종류, 시설물종별, 주소, 준공일,설계기간, 설계자 등의 정보를 제공합니다.- 관내 고가교는 총 10개소 (원미구 4개소, 소사구 4개소, 오정구 2개소)로 구성되어 있으며, 시설물 종별 구분 시 1종 시설물 5 개소, 2종 시설물 3개소, 3종시설물 2개소로 구성되어있습니다.- 본 공공데이터 자료는 고가교 위치정보를 기반으로 교통체계 개선, 재난대응, 공간정보분석, 네비게이션 경로 설계 등 다양한 공공 및 민간 분야에서 기초자료로 활용될 수 있습니다.'
