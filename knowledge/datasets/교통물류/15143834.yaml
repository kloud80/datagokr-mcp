summary_user: 서울교통공사가 운영하는 시민초청 문화이벤트, 지하철 예술마당, 차량사업소 견학, 안전체험관 체험을 프로그램·회차 단위로 담은 API로, 이벤트 제목·기간·당첨인원과 견학 회차의 일자·시각·장소·정원·현재 예약인원을 제공한다. 시민이나 학교·단체 담당자가 "이번 달 차량사업소 견학이나 안전체험 회차 중 아직 자리가 남은 날은 언제인가"처럼 신청 가능 일정을 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했으며, 호선명(lineNm)이나 장소명·장소아이디 같은 이름·기관 내부 코드로만 서울교통공사의 다른 데이터와 맞춰 볼 수 있다.
description_portal: 서울교통공사 문화관람체험정보 API는 서울교통공사에서 운영하는 시민 문화·체험 프로그램에 대한 정보를 제공하는 API입니다. 시민초청문화이벤트, 지하철 예술마당, 차량사업소 견학, 안전체험관 체험에 대한 명칭, 운영 일자, 시간, 장소, 접수 여부 등의 항목을 포함하며, 수시로 갱신되는 정보를 Rest API 방식으로 제공합니다. 신청 가능 일정 확인 또는 체험 프로그램 조회 등에 활용될 수 있습니다. 데이터는 매일(시민초정문화이벤트, 지하철예술마당), 매 10분(차량사업소 견학, 안전체험관)마다 갱신됩니다.
