summary_user: 경기도 시군별로 매월 집계한 주정차위반 단속 건수와 과태료 부과 건수를 담은 집계 자료이며, 단속 한 건 한 건의 원천 기록은 아니다. 교통행정 분석가나 시군 담당자가 '우리 시의 월별 불법주정차 단속 대비 부과 건수가 인근 시군과 비교해 어떤가'처럼 지역 간 단속실적을 비교하고 정책을 평가할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군명이나 시군 코드(SIGUN_CD)를 이름·코드 매핑해 시군 단위로 붙여야 한다.
description_portal: 이 데이터는 시군별로 집계된 주정차위반 단속 실적에 대한 월별 현황을 담고 있습니다. 주요 항목으로는 집계년월, 시군명, 부과건수, 단속건수가 포함되어 있으며, 각 시군에서 해당 월 동안 발생한 주정차위반 단속 건수와 이에 따른 부과 건수를 파악할 수 있습니다. 이 자료는 교통질서 확립 및 불법주정차 예방 정책 수립, 단속 효율성 분석, 지역 간 단속실적 비교, 행정업무 개선 등 다양한 분야에서 활용될 수 있습니다. 특히, 지역별 교통 민원 분석, 단속 정책 평가, 민간 주차장 수요 예측 등의 교통행정 및 도시계획 수립에도 유용합니다.
