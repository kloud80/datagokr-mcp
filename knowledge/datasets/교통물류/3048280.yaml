summary_user: 자동차부품자기인증시스템에 등록된 자동차부품별 제원관리번호 부여 내역을 건별로 담은 전국 단위 파일(CSV 약 1MB)로, 신청·승인일자, 부품명, 부품제작자, 형식, 안전기준적용연도, 원산지, 장착 차종·대표차명 등을 담는다. 정비업체나 소비자가 특정 애프터마켓 부품에 제원관리번호가 부여됐는지, 어떤 제작자가 언제 승인받았는지를 확인하거나, 분석가가 부품 종류·원산지별 자기인증 동향을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 제작자등록번호나 부품제작자명, 장착차명 같은 이름·코드 매핑으로만 다른 데이터와 연결한다.
description_portal: 한국교통안전공단 자동차부품자기인증시스템에 등록된 부품제원관리번호 부여현황 데이터입니다.부품제작자는 자동차관리법 제30조의2에 따라 부품제작자 등록을 하고, 자동차부품을 판매하기 10일전까지 성능시험대행자에게 제원통보를 해야합니다.성능시험대행자는 제원표, 외관도 등 제원통보 내용을 검토하여 이상이 없을 시 해당 자동차부품에 제원관리번호를 부여해야합니다.제원관리번호는 제작자등록번호, 일련번호, 안전기준연도코드 등 7자리로 구성되어 있습니다.
