summary_user: 부산교통공사 도시철도 각 역의 편의시설 현황을 역 단위 한 행으로 집계한 파일(csv, 약 5KB)로, 만남의장소·물품보관함·유아수유실·무인민원발급기 같은 일반 편의시설과 휠체어리프트·엘리베이터·에스컬레이터·시각장애인 유도로·외부경사로 같은 교통약자 시설, 비상인터폰·기동순찰대 배치 여부를 담는다. 휠체어 이용자나 유아 동반 승객이 '내가 가려는 역에 엘리베이터나 수유실이 있는가'를 확인하거나, 분석가가 교통약자 시설이 부족한 역을 골라 개선 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어 다른 역 데이터와는 역명(역명)과 노선 구분(구분)을 이름으로 맞추거나 같은 기관의 역 코드로 매핑해 이어 써야 한다.
description_portal: 본 데이터는 부산교통공사 도시철도 각 역에 설치된 편의시설 현황을 집계한 자료입니다.역별로 만남의장소, 물품보관함, 유아수유실, 자동사진기, 무인민원발급기 등 일반 이용객을 위한 편의시설과 휠체어리프트, 시각장애인 유도블록, 엘리베이터, 외부경사로 등 교통약자를 위한 시설 정보가 포함되어 있습니다. 또한 비상인터폰 설치 여부, 에스컬레이터 개수, 기동순찰대 배치 여부 등 안전 및 치안 관련 항목도 함께 제공됩니다.해당 데이터는 이용자 편의성과 안전성을 높이기 위한 역사별 시설 분포 현황 파악, 교통약자 접근성 개선, 무장애 이동환경 조성, 공공시설 투자계획 수립 등을 위한 기초자료로 활용될 수 있습니다.
