description_portal: '서울시 자치구별 도로에 설치된 주행유도선의 위치 정보를 정리한 표입니다. 필드는 연번(식별용 순번), 자치구(행정구역), 도로구분(시도/구도), 구분(시설종류: 주행유도선), X좌표, Y좌표로 구성됩니다. 좌표는 수치 범위로 보아 국내에서 흔히 쓰는 평면 좌표계(예: UTM-K/국가TM 등)로 추정되며, 각 주행유도선의 중심 혹은 기준점을 나타냅니다. 같은 자치구·도로에서 몇 미터 단위로 비슷한 좌표가 반복되어 특정 구간에 다수의 유도선이 연속 설치되었음을 시사합니다. 이 데이터는 지도 시각화, 자치구별 설치 밀도 비교, 시도·구도 간 분포 차이 분석, 교통안전 취약 구간 파악, 유지보수 우선순위 선정 등에 활용할 수 있습니다. 결측치는 보이지 않으며 수치 형식은 소수 포함 실수형으로 저장하는 것이 적절합니다. 좌표계를 명확히 확인해 GIS에서 동일한 투영을 적용하고, 중복·근접 포인트는 거리 기반 클러스터링으로 정리하면 분석 품질을 높일 수 있습니다.'
