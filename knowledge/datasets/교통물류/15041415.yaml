summary_user: 수도권 2호선에 포함된 도시광역철도역별로 고객센터(안내센터)의 운영기관명, 노선명, 역명, 지상·지하 구분, 역층, 출구번호, 상세위치, 전화번호를 담은 역 단위 파일이며, 파일 크기는 약 3KB(csv)입니다. 지하철 이용객이 '2호선 ○○역 고객센터는 몇 층 어디에 있고 전화번호는 무엇인가'를 확인하거나, 안내 서비스 개발자가 역별 문의처 정보를 붙이는 데 쓴다. 공통 역 코드 같은 전역 조인 키는 없어서, 다른 역·시설 데이터와는 역명·노선명 이름 매칭이나 운영기관명으로 이어 쓴다.
