summary_user: 전라남도 시군별로 전기승용·전기화물·전기이륜·전기버스·전기굴착기의 보급(지원) 대수를 연도별 열로 나눠 담은 집계 파일이다(약 2.7KB CSV, 시군구 단위 행). 전남 어느 시군에서 전기차 보급이 빨리 늘었는지, 차종별로 언제 보급이 몰렸는지를 보려는 지자체 담당자나 분석가가 쓴다. 전역 조인 키가 없어 시군명을 행정구역 코드에 이름으로 매핑한 뒤 충전소 현황이나 인구 통계 같은 시군 단위 자료와 이어 쓴다.
description_portal: '- 전라남도내 시군별 전기자동차 보급 지원현황 (승용, 화물, 이륜, 굴착기, 버스 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도는 전기자동차 보급 확대를 위해 다양한 지원 사업을 운영하고 있습니다. 이는 환경 친화적인 교통수단으로의 전환을 촉진하고, 지역 주민들의 생활 편의성을 높이기 위한 노력의 일환입니다.- 보조금 지원: 전기자동차 구매 시 정부 및 지자체에서 제공하는 보조금을 지원- 충전 인프라 구축 지원: 전기차 충전소 설치를 위한 지원금 제공- 세제 혜택: 전기차 구매 시 취득세 및 등록세 감면 혜택- 전라남도의 전기자동차 지원 사업은 환경 보호와 에너지 절약을 동시에 실현할 수 있는 기회를 제공합니다. 자세한 사항은 전라남도청 또는 관할 시군청에 문의하시어 최신 정보를 확인하시기 바랍니다.'
