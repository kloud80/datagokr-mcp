description_portal: 본 데이터는 경상북도 경산시에 등록된 자동차 중 1톤 트럭의 폐차 현황을 확인할 수 있도록 구축한 자료입니다. 주요 제공 항목은 시군구, 자동차명(차명), 최초등록일, 주행거리, 폐차일이며, 차량별 등록 시점부터 폐차 시점까지의 기본 이력과 운행 정도를 파악할 수 있습니다. 본 자료는 경산시 내 1톤 화물자동차의 등록 및 폐차 추이 분석, 차량 사용 연한과 누적 주행거리 비교, 노후 차량 현황 파악, 교통·환경 정책 수립, 자동차 관련 행정업무 및 연구 자료로 활용할 수 있습니다. 차종별 폐차 시기와 주행 특성을 비교하거나 지역 단위의 차량 생애주기를 분석하는 데에도 활용할 수 있습니다. 다만 일부 차량은 폐차일 등 특정 항목이 데이터 미집계로 제공될 수 있으므로 통계 작성이나 분석 시 누락 값을 확인한 후 활용하시기 바랍니다
