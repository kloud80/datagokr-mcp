summary_user: 고속열차 SRT의 수송 수익을 2016~2025년 연도별·노선별(경부선·호남선, 2023년부터 경전선·동해선·전라선 추가)과 전체 합계로 담은 백만원 단위 집계 파일이며, 연도와 노선이 열로 펼쳐진 가로형 표(약 3KB CSV)이다. 철도 분석가나 교통 정책 담당자가 '코로나 시기 SRT 수익이 얼마나 줄었다가 회복됐는가', '신규 노선 개통 뒤 노선별 수익 비중이 어떻게 바뀌었는가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 노선명을 직접 맞추거나 같은 에스알의 수송 인원·승하차 자료와 함께 놓고 비교하는 방식으로 이어 쓴다.
description_portal: '1. 이 데이터는 고속열차 SRT에 대한 자료로, 2016년부터 2025년 까지 연도별 수송 수익 정보를 제공하는 데이터입니다.  (단위 : 백만원)2. SRT는 2023년 9월 1일부로 경전선, 동해선, 전라선 운행을 개시하였습니다.3. 다운로드 받으신 파일 데이터 내 비어있는 부분은 "데이터 없음"을 안내드립니다.* 해당 데이터는 연간 주기성 데이터입니다.* 2026년 4월 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.* 데이터값이 공란인 경우는 미운행 기간이라 미집계 되었습니다* 해당 데이터에 대한 문의사항은 공공데이터 실무담당자 연락처를 통해 답변드릴 수 있도록 하겠습니다.'
