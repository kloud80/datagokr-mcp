description_portal: 경기도 하남시가 운영하는 VMS(Video Management System) 또는 디지털사이니지 플랫폼에서 사용되는 VMS 영상메타데이터로, 다양한 시각콘텐츠의 등록·관리 현황을 체계적으로 보여줍니다. 비디오아이디와 파일경로는 시스템 내에서 콘텐츠를 불러오는 데 필요한 필수 참조값이며, 해상도(객체가로길이·객체높이)는 디스플레이 환경에 따라 적절한 영상이 자동 매칭되도록 하는 데 핵심적인 요소입니다.  사용여부(Y/N)는 현재 서비스 중인 콘텐츠와 미사용 콘텐츠를 구분하여 공공정보 플랫폼 운영 효율성을 높입니다. 이러한 영상 자료는 교통 안내, 도시브랜드 홍보, 스마트시티 주요 정책 홍보 등 스마트시티 시각콘텐츠로 활용되며, 시민 대상 정보 전달 품질 향상에 중요한 역할을 합니다.
