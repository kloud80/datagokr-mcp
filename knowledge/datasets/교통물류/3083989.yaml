summary_user: 경상남도 관할 시외버스 업체별로 회사명, 주소, 전화번호, 면허일자를 한 줄씩 담은 업체 목록 파일로, 포털 설명상 2019년 기준 20건입니다. 경남에서 시외버스를 운행하는 회사가 어디이고 언제 면허를 받았는지, 업체 연락처가 무엇인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 노선·정류장 등 다른 버스 데이터와는 회사명을 이름으로 맞춰 연결해야 한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 시외버스 업체 현황 데이터는 2019년 기준 경상남도 관할 시외버스 업체에 대한 정보입니다. 경상남도 소속의 시외버스 업체의 주소, 전화번호, 면허일자 등의 현황을 파악할 때 활용할 수 있습니다.(데이터 구성 및 세부항목) 경상남도 시외버스 업체 현황 데이터는 시외버스 회사이름, 업체 주소, 업체 전화번호, 면허일자로 구성됩니다. 데이터는 총 20건입니다. 미집계 데이터는 공란처리합니다. (데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다.
