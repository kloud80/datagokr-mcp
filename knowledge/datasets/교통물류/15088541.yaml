description_portal: '2025년도 항공종사자(운항관리사) 학과시험 응시자 별 세목에 대한 정답률 분석을 위해 해당자료(개인특정코드, 시험일자, 자격명, 항공기종류, 과목명, 세목명칭 및 정답여부)를 공개합니다. - 운항관리사의 시험과목(총 5과목) 및 과목별 범위는 다음과 같습니다. - 항공법규 : 국내항공법규, 국제항공법규 25문항 (30분) - 항공기 : 항공운송사업에 사용되는 항공기의 구조 및 성능에 관한 지식, 항공운송사업에 사용되는 항공기 연료 소비에 관한 지식, 중량분포의 기술원칙, 중량배분이 항공기 운항에 미치는 영향 25문항 (30분) - 항행안전시설 : 항행안전시설의 제원 및 기능에 관한 지식, 항행안전시설의 사용방법, 운항 상의 운용방법 ,공중항법에 관한 일반지식,  운항관리 분야와 관련된 인적수행능력에 관한 지식 25문항 (30분) - 항공통신 : 항공통신시설의 개요, 통신조작과 시설의 운용방법 및 절차, 항공교통관제업무의 일반지식, 항공통신 및 항공정보에 관한 지식, 조난·비상·긴급통신방법 및 절차 25문항 (30분) - 항공기상 : 풍계기류의 요란, 구름, 착빙, 공전 및 안개 등 항공기의 운항에 영향을 미치는 기상현상에 관한 지식, 기상관측의 방법, 기상통보 및 일기도 해독에 관한 지식 25문항 (30분)'
