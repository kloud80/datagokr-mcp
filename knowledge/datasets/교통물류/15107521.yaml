summary_user: 행정안전 통계연보 '지방행정/지역발전' 중 지역별 도로명 통계를 서울·부산·대구 등 시도 단위로 담은 집계 데이터를 오픈API로 제공한다. 지방행정 분석가나 연구자가 "시도별로 부여된 도로명이 얼마나 되는가"처럼 지역 간 도로명주소 현황을 비교하는 데 쓴다. 실측 응답에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 시도 이름 매핑으로만 연결하며 표준노드링크(link_id·node_id)와 직접 이어지지 않는다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '도로명주소', '지역별 도로명'에 관한 통계입니다. 서울, 부산, 대구, 인천, 대전, 세종, 충북, 충남 등을 기준으로 지역별 도로명을 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
