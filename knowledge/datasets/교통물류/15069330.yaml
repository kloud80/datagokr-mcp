description_portal: 이 데이터는 광주교통공사의 연도별 무임수송 현황을 기록한 자료로, 2008년부터 시작해 각 연도의 전체 수송 인원, 무임수송 인원, 그리고 무임수송 비율(%)이 포함되어 있습니다.무임수송은 경로, 장애인, 유공자 세 유형으로 구분되며, 각 인원 수와 전체 무임수송에서 차지하는 비율(%)이 함께 제시됩니다. 이를 통해 특정 연도의 무임수송 규모, 유형별 구성 비율, 그리고 장기적인 변화 추세를 분석할 수 있습니다. 예를 들어 경로 무임수송이 항상 79~80%를 차지하는 패턴, 장애인 비율의 점진적 증가, 유공자 비율의 안정적인 유지 등을 확인할 수 있습니다.이 자료는 고령화, 복지정책, 대중교통 이용 패턴 변화 분석뿐 아니라 향후 재정 계획과 요금 정책 수립에도 중요한 참고 자료가 될 수 있습니다.
