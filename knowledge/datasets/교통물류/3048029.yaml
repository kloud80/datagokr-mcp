description_portal: 물류창고업 등록정보를 제공하는 물류창고업현황 메뉴는 물류시설 개발 및 운영에 관한 법률에 따라 물류창고업으로 등록된 일정규모 이상의 영업용 창고 정보입니다. 국토교통부에 등록하는 일반 물류창고업(해양수산부 항만창고 포함) 외에 관세청의 보세창고, 환경부의 유해화학물질 보관창고, 식품의약품안전처의 (식품)냉동냉장창고, (축산)축산물보관창고, 해양수산부의 (수산물)냉동냉장창고의 정보를 함께 제공합니다. 보관장소(창고)의 면적, 동수, 위치, 대표자, 업체명, 취급품목, 종업원수, 시설장비 현황 등의 정보 제공으로 다양한 목적에서 중요한 기초자료로 활용됩니다.
