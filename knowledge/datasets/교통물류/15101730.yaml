summary_user: 경기도 파주시에 등록된 전기자동차 대수를 등록연도별로 승용·승합·화물·특수차 유형과 사업용·비사업용 구분에 따라 집계한 통계 파일(csv, 893바이트)이다. 파주시의 전기차가 해마다 얼마나 늘었는지, 차종별·사업용 전기차 도입 정도가 어떤지 보려는 지자체 담당자나 충전 인프라 수요를 가늠하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 등록연도나 기관명(파주시)을 기준으로 맞춰 이어 써야 한다.
description_portal: 경기도 파주시의 연도별로 등록된 전기자동차의 유형 및 용도별 통계를 제공하는 공공데이터로,  승용차, 승합차, 화물차, 특수차로 구분된 전기차 유형과 함께, 각 차량의 사업용, 비사업용 여부에 따른 등록 수치를 제시합니다. 본 데이터셋은 연도별 변화를 통해 전기차 시장 성장세 및 대체에너지 교통수단의 확대 흐름을 확인할 수 있고 전기차 보급률, 산업별 전기차 활용 현황, 친환경 정책에 따른 변화 등의 파악과 차량 종류별로 전기차 채택 속도에 차이가 있는지, 사업용 전기차 도입이 어느 정도인지 분석 가능하며, 정부·지자체의 전기차 지원정책 효과성 검토나 전기차 충전 인프라 수요 예측 등 다양한 행정·산업적 목적에 활용될 수 있습니다.
