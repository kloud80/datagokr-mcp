summary_user: 전북특별자치도 14개 시군의 횡단보도 위치와 신호등 유무·형태 같은 속성을 담은 파일 데이터로, 포털 설명상 2020년 기준 지도 로드뷰를 이용한 온라인 실측으로 구축했고 zip 파일(약 1.96MB)로 활용신청 없이 받는다. 교통안전 담당자나 분석가가 '사고가 잦은 구간 주변에 신호 없는 횡단보도가 몰려 있는가'처럼 보행 안전시설 배치를 점검하는 데 쓴다. 실측 컬럼에서 전국 공통 조인 키를 찾지 못해, 다른 데이터와는 시군 이름 매칭이나 같은 기관 자료끼리로만 잇는다.
limits: 실측 파싱된 컬럼이 순번·항목명·항목 설명·형식 단위·허용범위 규칙 같은 항목 정의 형태로 나와, 받은 파일에 횡단보도 건별 행이 들어 있는지 먼저 확인해야 한다. 공통 조인 키가 없어 교통사고·보호구역 데이터와의 결합은 이름 매핑에 의존한다. 범위 판정은 시도 단위·비공간으로 기록돼 있어 좌표 기반 공간 분석이 가능한지는 확인되지 않았다.
