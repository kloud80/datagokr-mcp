summary_user: 파주시 첨단교통관리시스템(ATMS) 현장시설물에서 월 단위로 집계한 구간 통계로, 시작·종료 노드의 아이디·이름·주소·위경도와 구간별 검지 기기수, 속도, 수집 시작·종료일자를 담은 파일(약 84KB csv)이다. 파주시 도로를 분석하는 연구자나 교통 담당자가 '어느 노드 구간의 월평균 속도가 낮아 상습 정체가 의심되는가'를 확인하고 월별 이력을 쌓아 정체 추세를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 노드명·주소나 위경도 좌표로 맞춰야 하고, 같은 파주시가 낸 노드아이디 기반 교통 데이터가 있을 때만 노드아이디(시작노드아이디)로 이어 쓸 수 있다.
description_portal: '경기도 파주시 교통현장시설물을 통해 월 단위로 생산되는 통계 정보로, 시작노드와 종료노드 각각의 노드아이디(ID), 노드명, 도로명주소, 지번주소, 위도와 경도좌표, 센서 설치 현황과 교통 흐름 특성을 동시에 파악할 수 있는 기기수와 속도 정보, 시계열 분석에 유용한 수집시작일자, 수집종료일자 등으로 구성되어 있습니다. 본 데이터셋은 교통 시뮬레이션 및 예측 모델 고도화, 도로 인프라 개선 및 최적화 연구, 자율주행·모빌리티 서비스 연구,  지역별 교통량 패턴 분석을 통한 생활권 재구성, 교통 정체 감소를 위한 친환경 교통 전략 수립 등에 활용될 수 있습니다.* 첨단교통관리시스템(ATMS, Advanced Traffic Management System): 도로의 차량 검지기, 감시 카메라 등을 통해 교통 정보를 수집하여, ​가변 전광 표지판, 운전자 내비게이션, 스마트폰 등에 수집한 다양한 정보를 제공하는 정보시스템'
