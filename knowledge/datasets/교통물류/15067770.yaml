summary_user: 서울교통공사 관할 지하철역에 설치된 승강기(엘리베이터 등 교통약자 이동편의시설)의 역명·호선·설치 위치·운행 구간과 사용 가능 여부를 승강기 한 대 단위로 담은 현황 데이터이며, 서울 열린데이터광장 API로 제공된다. 휠체어 이용자·노약자·유아동반 승객이 출발 전에 "오늘 이 역 엘리베이터가 운행 중인가"를 확인하거나, 분석가가 역별 승강기 설치·가동 현황을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 역 데이터와는 역 코드(STN_CD)나 역명을 이름·코드로 매핑하거나 같은 기관(서울교통공사) 데이터와 연결해야 한다.
description_portal: 서울교통공사_교통약자 이용시설 승강기 가동현황 데이터는 서울교통공사 관할 지하철역에 설치된  승강기(엘리베이터 등 교통약자 이동편의시설)의 실시간 가동 현황을 제공하는 서비스입니다.이 데이터는 역별로 설치된 승강기의 **위치(역명, 호선, 시설 구분)**와 함께, 현재 운행상태 등 상태 정보를 포함하고 있습니다. 이를 통해 시민들은 역을 이용하기 전 해당 시설의 이용 가능 여부를 확인할 수 있으며, 특히 교통약자·노약자·유아동반 승객 등 이동에 불편을 겪는 이용자들에게 실질적인 편의를 제공합니다.데이터는 API 형태로 제공되며, 역명이나 호선을 조건으로 특정 역의 승강기 현황을 조회할 수 있고, 전체 역의 가동 현황을 일괄적으로 확인할 수도 있습니다.
