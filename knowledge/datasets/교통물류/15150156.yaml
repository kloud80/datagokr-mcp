summary_user: 국가철도공단이 추진하는 철도개량·전철설비 공사를 공구 단위로 한 행씩 담은 CSV 파일로, 공구코드·공구명·계약명·발주처·사업명·소규모사업 여부·계약만료 관련 날짜와 내용을 담고 범위는 전국이다. 철도 정책 담당자나 지역개발 분석가가 '특정 복선전철 사업에 어떤 공구와 계약이 묶여 있고 발주처는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·공구명 같은 이름 매핑이나 같은 기관의 공구코드로만 연결한다.
description_portal: 국가철도공단에서 추진 중인 각종 철도개량 및 전철 설비 공사의 각 공구별 현황을 담은 데이터로, 철도 선로의 복선화 공사 등 주요 정비 사업 정보를 포함합니다. 해당 데이터는 2025년 9월 1일자로 생성되었으며, 주요 항목은 소규모사업여부, 공구코드, 공구명, 계약명, 발주처, 고구구분, 사명명, 계약만료시킨날짜, 계약만료시내용입력 등으로 구성되어 있으며, 각 사업의 준공 여부 및 추진 주체에 대한 종합적인 정보를 제공합니다. 이 데이터는 하나의 사업명에 각각의 공구에 대한 내용을 포함하고 있으며,  예를 들어 "의정부~동안 복선전철" 하나의 사업에 "경원선 의정부~북구역간 지장전철설비 이설기타공사", "경원선 복선전철 주내외 8개역사 전력설비 신설공사", "경원선 복선전철 지장군부대 전력설비 이설기타공사" 등 3개의 공구현황을 보여주고 있습니다. 이에 공구현황을 파악하고, 각 종 철도선로 정비 정책 수립지역개발 전략 수립에 활용할 수 있는 공공데이터입니다.
