summary_user: 경기도 파주시 관내 주정차 위반 단속을 건별로 담은 파일 데이터로, 차종·단속일시·단속지역·단속장소·단속방법(CCTV·현장·시민신고 등)을 기록하며 CSV 약 45MB 규모다. 파주시 교통 담당자나 분석가가 어느 지역·시간대·차종에서 주정차 위반이 많이 적발되는지, 단속 수단별 비중은 어떤지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속지역명·단속장소명 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 경기도 파주시 주정차 위반 차량 단속 현황에 대한 데이터로 승합/화물 등 위반 차량의 종류를 구분하여 위반 경향을 분석할 수 있게 하는 차종, 단속이 이루어진 정확한 날짜와 시간 정보를 제공하는 단속일시, 단속이 이루어진 행정구역과 구체적인 위치를 나타내어 특정 지역의 문제점을 파악하는 데 유용한 단속지역과 단속장소, CCTV, 현장 단속, 시민신고 등 다양한 단속 수단을 기록해 단속의 효율성과 유형을 평가하는 데 도움이 되는 단속방법 항목 등으로 구성되어 있습니다. 이는 관내 주정차 위반 사례를 체계적으로 수집하여 교통 단속 현황을 상세히 파악할 수 있도록 돕고, 교통 정책 수립과 단속 효율 개선, 시민 교통문화 향상에 중요한 기초 자료 역할을 합니다.
