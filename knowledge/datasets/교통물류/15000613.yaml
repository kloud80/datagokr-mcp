summary_user: 충청남도 서산시 관내 여객운송업체(택시·버스 등)를 업체 한 곳당 한 행으로 정리한 목록으로, 업종·업체명·소재지·대표자·전화번호·차량보유대수를 담은 작은 CSV 파일(약 1.6KB)이다. 시민이나 분석가가 "서산시에 택시·버스 회사가 몇 곳이고 각각 차량을 몇 대 보유하는가"를 확인하거나 업체 연락처를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 이름·주소 매칭으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 충청남도 서산시 관내에서 여객운송업을 운영하는 업체 정보를 정리한 공공자료이다. 항목은 업종, 업체명, 소재지, 대표자, 전화번호, 차량보유대수로 구성되며, 지역 운송서비스 현황 파악과 행정업무 지원을 목적으로 한다. 업종은 택시, 버스 등 운송 형태이며, 업체명은 등록된 상호이다. 소재지는 사업장 주소이며, 대표자는 업체의 운영 책임자이다. 전화번호는 민원 응대 및 문의용 연락처이고, 차량보유대수는 운행 가능한 차량 수를 의미한다. 이 자료는 대중교통 정책 수립, 교통자원 관리, 업체 현황 파악, 시민 정보 제공 등 다양한 분야에서 활용된다.
