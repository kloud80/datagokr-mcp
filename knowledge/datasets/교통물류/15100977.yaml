summary_user: 서울 성북구 관내 공영주차장별로 주차장명, 주소, 장애인전용 주차면수를 한 줄씩 담은 소규모 파일(csv 약 380바이트)이다. 장애인 운전자나 보호자가 성북구 안에서 장애인전용 주차구역이 있는 공영주차장과 그 면수를 찾거나, 구 담당자·연구자가 동네별 장애인 주차면 분포를 점검하는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 등 다른 주차장 자료와는 주차장명이나 주소를 맞춰 이어 써야 한다.
limits: 주차장관리번호 같은 공통 키가 없어 이름·주소 매칭으로만 다른 데이터와 연결되며, 매칭 오류에 주의해야 한다. 성북구 공영주차장만 다루므로 다른 시군구나 민영·부설 주차장의 장애인 주차면은 알 수 없고, 실시간 주차 가능 여부도 담지 않는다.
