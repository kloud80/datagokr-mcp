description_portal: "대전교통공사의 지하철 연단간격 및 교통약자 관련 좌석 위치 데이터입니다.대전교통공사 도시철도 역사 내 승·하차 시 발생 가능한 위험 요인을 분석하고, 교통약자의 안전한 이동권 확보를 위한 데이터입니다.월별로 상하행 구분과 문번호에 따른 연단 간격과 고무발판 여부, 휠체어 전용석 위치, 임산부 전용석 위치, 노약자 좌석 위치 데이터를 조회할 수 있습니다.문번호는 '문번호(대)-문번호(소)'의 형태로 이해하시면 됩니다.예시로 문번호(대)가 1이고 문번호(소)가 4인 경우 문번호 1-4 입니다.연단 간격은 좁음, 보통, 넓음으로 표현되어 있고 범위는 아래와 같습니다.좁음 : 10cm 이하보통 : 10cm 초과 ~ 15cm 이하넓음 : 15cm 초과"
