summary_user: 대전광역시 동구 학교 주변 횡단보도에 설치된 옐로카펫을 설치 건별로 담은 파일(csv, 약 5KB)로, 학교명·설치위치·설치연도·관리기관과 연락처를 포함한다. 학부모나 구청·학교 담당자가 '우리 아이 학교 앞 횡단보도에 옐로카펫이 언제 설치됐고, 파손 시 어디에 연락하나'를 확인하거나 추가 설치 대상을 검토하는 데 쓴다. 전역 조인 키나 좌표가 없어 학교명·설치위치 문자열로 학교 기본정보나 어린이보호구역 표준데이터와 이름 매칭해 이어 써야 한다.
limits: 좌표가 없는 비공간 자료여서 지도 위에 바로 올리려면 설치위치 주소를 별도로 지오코딩해야 한다. 표준 코드 키가 없어 다른 데이터와는 학교명 등 이름 매핑으로만 연결되며, 범위는 동구 한 곳에 한정된다.
