summary_user: SRT 호남선 구간의 수서·동탄·지제·천안아산·오송(공용선)과 공주·익산·정읍·광주송정·나주·목포 사이 역간 영업거리(km)를 기준역별 행과 역별 열로 담은 행렬형 파일(csv, 569바이트)입니다. 수서에서 광주송정까지 몇 km인지처럼 SRT 호남선 두 역 사이 거리를 확인하거나 운임·이동거리 분석에 기초값으로 쓰려는 이용자·분석가가 씁니다. 실측 컬럼에 전역 조인 키가 없어, 다른 철도 데이터와는 역명(기준역명) 매칭으로만 이어 씁니다.
description_portal: 1. 해당 데이터는 고속철도  SRT의 호남선과 관련된 역간거리(영업거리, 공용선-수서, 동탄, 지제, 천안아산, 오송, 호남선-공주, 익산, 정읍, 광주송정, 나주, 목포)에 대한 정보를 나타냅니다.2. 수서-동탄, 수서-지제 등 각 역별 역간거리(영업거리)를 확인하실수 있습니다.3. (예시)수서-동탄 역간거리는 32.4입니다. (단위 :KM)4. 데이터 내 0으로 , 적힌 수치는 '데이터 없음'을 안내드립니다.* 해당 데이터는 1회성 데이터입니다.* 2021년 1분기 기준 공공데이터입니다.* 에스알은 해당 데이터를 무료로 제공하고 있습니다.
