summary_user: 서울시 도로굴착 예정지를 한 곳씩 일련번호, 입력년도, X·Y 좌표(ITRF2000 좌표계)로 담은 건별 공간정보로, 범위는 서울시 한 개 시도이다. 시민·사업자·분석가가 '우리 동네 도로에 굴착 공사가 예정돼 있는가', '연도별 굴착 예정지가 어디에 몰려 있는가'를 확인하는 데 쓰고, 굴착은 지역 공사 이벤트의 신호로 볼 수 있다. 전역 조인 키는 없어 좌표를 기준으로 행정구역 경계·도로 공간정보와 공간 결합하거나 서울시 다른 데이터와 이름·코드 매핑으로만 이어 쓴다.
description_portal: '해당 데이터는 서울시 도로굴착 예정지 위치정보 (좌표계: ITRF2000) 데이터 입니다. 서울시 도로굴착 예정지의 공간정보로 예정지 일련번호, 입력년도, 좌표(X,Y)등의 정보를 제공하는 서비스 입니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2842)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
