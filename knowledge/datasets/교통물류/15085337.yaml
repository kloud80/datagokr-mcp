description_portal: '○ 통계개요* 통계명 : 자동차등록(월별,구별)* 통계종류 : 서울시 자동차 등록현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 : 통계법 제18조 규정에 의한 승인통계지정* 작성목적 : 서울시 등록된 자동차의 현황을 파악하여 교통행정, 교통정책, 교통연구,및 개발 등에 필요한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 시·도, 자치구 → 국토교통부* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자동차(승용차, 승합차, 화물차, 특수차, 이륜차) 등록현황○ 용어설명* 관용차 : 정부(중앙, 지방)기관이나 국립ㆍ공공기관 등에 소속되어 운행되는 자동차* 특수차 : 자동차관리법에서 지정한 다른 자동차를 견인하거나 구난작업 또는 특수한작업을 수행하기에 적합하게 제작된 자동차로써 승용, 승합자동차 또는 화물자동차가 아닌 자동차'
