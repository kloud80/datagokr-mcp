description_portal: 옐로우 카펫은 보행자, 특히 어린이들의 안전한 보행을 돕기 위해 설치되었습니다. 횡단보도 진입부에 설치된 옐로우 카펫을 통해 어린이들은 안전한 영역에서 신호를 기다릴 수 있고, 운전자는 어린이를 쉽게 인식 할 수 있어 교통사고를 예방 할 수 있습니다. 경기도 성남시 어린이 보호구역 전역에 위치한 옐로우 카펫 존의  위경도, 근처학교시설명, 관할경찰서명, 지오메트리 정보, 이미지 정보 등을 본 API로 제공합니다.‘경기도 성남시_옐로우 카펫’ 데이터는 성남시 관내 어린이보호구역과 학교 주변에 설치된 옐로우카펫의 현황을 체계적으로 관리하기 위해 구축된 자료입니다. 옐로우카펫은 어린이들이 횡단보도를 건널 때 운전자의 시야에 쉽게 인식되도록 노란색으로 표시한 안전구역으로, 보행자 특히 어린이의 교통사고 예방에 큰 효과가 있습니다. 본 데이터는 성남시의 어린이 교통안전 정책 추진과 스쿨존 환경 개선, 보행자 보호시설 확충 계획 수립 등에 활용될 수 있습니다. 또한 시민이 체감할 수 있는 안전도시 성남 실현을 위한 기초자료로서 행정적·사회적 가치가 높은 데이터입니다.
