summary_user: 성남시 어린이보호구역과 학교 주변에 설치된 옐로우 카펫을 한 곳씩 담은 시군구 범위의 개별 시설 데이터로, 위경도·근처 학교시설명·관할경찰서명·이미지 정보를 포함한다. 학부모나 교통안전 담당자가 우리 아이 학교 주변 횡단보도에 옐로우 카펫이 설치되어 있는지 확인하거나, 스쿨존 보행안전시설이 부족한 곳을 찾을 때 쓴다. 전역 조인 키는 없어서, 좌표(latitude·longitude)로 다른 공간 데이터와 겹쳐 보거나 학교시설명·경찰서명을 이름으로 맞춰 어린이보호구역·학교 현황 데이터와 잇는다.
limits: 다른 데이터셋과 바로 연결할 공통 코드가 없어서 이름 매칭이나 좌표 기반 공간 결합에 기대야 한다. 범위는 성남시 한 곳뿐이라 다른 시군구와 비교할 수 없다. 호출에는 포털 활용신청으로 받는 serviceKey가 필요하고, 개발계정은 하루 5,000회까지 호출할 수 있다.
