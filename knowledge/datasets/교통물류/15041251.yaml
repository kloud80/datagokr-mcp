summary_user: 경춘선 각 역의 화장실을 한 건씩 담은 목록으로, 역명·지상지하 구분·역층·개찰구 안팎·출구번호·상세위치·화장실 구분을 기록한 작은 CSV 파일(약 3KB)이다. 경춘선 이용객이 '이 역 화장실이 개찰구 안에 있는지, 몇 번 출구 쪽 몇 층에 있는지'를 확인하거나, 역 편의시설 안내를 만드는 분석가가 노선별 화장실 배치를 비교할 때 쓴다. 전역 조인 키나 역 코드가 없어서 다른 역·시설 데이터와는 역명·선명 같은 이름을 맞춰서만 이어 쓴다.
limits: 역 코드 같은 공통 키가 없어 다른 철도 데이터와 연결할 때 역명 표기 차이를 직접 맞춰야 한다. 범위는 전국으로 분류돼 있지만 좌표가 없는 비공간 데이터라 지도 위치 분석에는 바로 쓰지 못한다.
