summary_user: 경상남도 전체의 자동차 등록 대수를 2010~2018년 월별(1~12월, 12행)로 승용차·승합차·화물차·특수차·이륜자동차 차종별 열에 나눠 담은 시도 단위 집계표이며, 건별 차량 원장이 아니다. 분석가나 지자체 담당자가 '2010년대 경남에서 승용차와 화물차 등록이 매년 어떤 속도로 늘었나' 같은 차종별 추세를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 시도 등록현황이나 인구 통계와는 연·월과 차종 이름을 맞춰 수작업으로 이어 붙여야 한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 자동차 등록현황 데이터는 2021년을 기준으로 경상남도 내 자동차별 월별 등록 현황을 제공합니다. 자동차의 종류에 따른 등록현황을 연도별 월별로 분석할 때 활용할 수 있습니다.(데이터 구성 및 세부항목) 1월부터 12월까지 월별로 현황을 보여주며 2010년부터 2018년까지 승용차, 승합차, 화물차, 특수차, 이륜차의 현황을 제공합니다. 총 12건입니다. 데이터의 단위는 (건)입니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 하지 않습니다.
