summary_user: 충주시가 운영하는 교통관제 CCTV의 설치 현황을 대당 한 행으로 담은 파일(csv, 약 6KB)로, 관리번호·지번주소·설치위치명·위도·경도·관리기관을 개별 지점 단위로 담는다. 시민이나 분석가가 '충주시 어느 교차로·도로에 교통관제 CCTV가 있는가'를 지도에서 확인하거나 사고다발지점과 감시 공백을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 지번주소를 공간 매칭하거나 같은 기관(충주시) 기준으로만 이어 쓴다.
limits: CCTV 영상이나 실시간 소통 정보가 아니라 설치 위치 현황 목록이므로 실시간 교통상황 판단에는 쓰지 못한다. 범위는 충주시 한 곳뿐이고, 공통 코드 키가 없어 다른 시군 CCTV·교통 데이터와 붙일 때는 주소·좌표 매칭이 필요하다.
