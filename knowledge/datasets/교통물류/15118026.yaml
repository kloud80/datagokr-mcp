summary_user: 세종특별자치시 BRT 노선(B0·B2·B4·B5·B6·B7)별로 거치는 정류장을 정류장 한 곳당 한 행으로 담은 파일이며, 노선명·정류장 구분·고유번호·정류장명·노선 내 순번·위도·경도가 들어 있다. 세종 시민이나 분석가가 "반석역~오송역 BRT는 어느 정류장을 어떤 순서로 지나는가", "우리 동네에서 가장 가까운 BRT 정류장은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 버스 정류장·도착정보 데이터와는 정류장명이나 같은 기관의 정류장고유번호를 맞춰 보거나 위도·경도로 공간 매칭해 잇는다.
description_portal: 세종특별자치시 BRT 노선별 정류장 현황을 제공합니다.본 데이터는 노선명,정류장 구분, 정류장 고유번호, 정류장 명, 정류장 순번, 위도, 경도로 이루어져 있습니다.세종특별자치시의 BRT는 B0, B2, B4, B5, B6, B7 노선이 있으며  아래와 같습니다.B0(세종고속시외버스터미널~세종고속시외버스터미널), B2(반석역~오송역/세종고속시외버스터미널~오송역), B4(반석역~오송역), B5(세종고속시외버스터미널~세종고속시외버스터미널), B6(세종고속시외버스터미널~오송역), B7(반곡동 수루배마을~비하종점)
