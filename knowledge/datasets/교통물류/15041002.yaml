summary_user: 대전광역시 서구에서 진행 중이거나 계획된 도로건설 사업을 사업 한 건당 한 행으로 정리한 CSV 파일(약 11KB)로, 사업명과 위치, 사업기간, 공사 내용(신설·확장·보도정비·회전교차로 등), 사업비를 담는다. 서구 주민이나 부동산·상권 분석가가 '우리 동네 어느 도로가 언제까지 확장·신설되고 예산은 얼마인가'를 확인하거나, 도로 개통 계획을 지역 접근성 변화의 선행 지표로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명이나 위치 문자열(사업명(위치))을 이름으로 맞추거나 같은 기관(대전 서구) 자료끼리 묶어서 이어 쓴다.
limits: 범위는 대전 서구 한 개 시군구이고 좌표가 없는 비공간 자료여서 지도에 바로 올릴 수 없다. 명세상 연간·이벤트 주기로 만들어진 뒤 바뀌지 않는 파일이라 진행 단계 변화를 실시간으로 따라가지 못한다. 법정동 코드나 사업 코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 이름 매칭에 의존해야 한다.
