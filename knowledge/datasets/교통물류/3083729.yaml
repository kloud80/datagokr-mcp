summary_user: 제주특별자치도 안에 있는 화물자동차운송업 관련 단체의 이름, 설립일, 사업장 소재지, 연락처, 팩스번호와 데이터기준일자를 단체별 한 행으로 담은 551바이트짜리 소규모 CSV 파일입니다. 제주에서 화물운송 업계 단체에 연락하거나 단체의 소재지와 설립 시기를 확인하려는 사업자나 도민이 '제주의 화물운송 관련 단체는 어디에 있고 연락처가 무엇인가'를 알아볼 때 씁니다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 단체명이나 주소를 직접 대조해야만 이을 수 있습니다.
description_portal: '제주특별자치도 내에 소재하고 있는 화물자동차운송업과 관련한 데이터를 제공합니다.항목: 단체명, 설립일, 사업장소재지, 연락처, 팩스번호 등*「화물자동차 운수사업법」에 의거하여 관리됨- 화물자동차: 「자동차관리법」 제3조에 따른 화물자동차 및 특수자동차로서 국토교통부령으로 정하는 자동차- 화물자동차 운송사업: 다른 사람의 요구에 응하여 화물자동차를 사용하여 화물을 유상으로 운송하는 사업. 이 경우 화주(貨主)가 화물자동차에 함께 탈 때의 화물은 중량, 용적, 형상 등이 여객자동차 운송사업용 자동차에 싣기 부적합한 것으로서 그 기준과 대상차량 등은 국토교통부령으로 정함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1082'
