status: active
summary_user: 여수시 도로와 구간(구간명)별 통행속도를 일별·월별 통계와 패턴속도 통계로 집계해, 방면별 일 평균 속도와 0시~23시 시간대별 평균 속도를 담는다. 교통 분석가나 시민이 '여수 특정 도로의 출퇴근 시간대 평균 속도가 어느 정도이고 어느 시간대에 막히는가'를 확인하는 데 쓰며, 월별 결과를 쌓으면 상습 정체 구간 분석의 기초 자료가 된다. 전역 조인 키는 없어 다른 교통·도로 데이터와는 도로명·구간명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 여수시 한 시군구 범위의 집계 통계라 실시간 소통 정보나 다른 지역 비교에는 쓰지 못한다. 6개 오퍼레이션 중 월별 패턴속도(/RoadPatternMonth)는 최소 파라미터 호출에 응답이 없었으므로 호출 조건을 따로 확인해야 한다.
