summary_user: 부천시에서 버스전용차로 통행위반으로 과태료가 부과된 단속 건별 기록으로, 단속일시·단속장소·단속구분·위반법규·차량명·부과본세·부과일자·고지서 사진 매수를 담는다. 시민이나 교통 분석가가 부천시 안에서 어느 장소와 시간대에 버스전용차로 위반 단속이 많은지, 단속 수단별 부과액이 얼마인지 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 단속장소 이름이나 같은 기관(부천시) 기준으로만 맞춰 이어 쓴다.
description_portal: 건전한 교.통 질서 확립을 위하여 도로교통법 제15조에 따라 버스전용차로통행위반 차량을 단속하고 있습니다.해당 데이터는 부천시 버스전용차로통행위반 차량에 대한 과태료 정보로 2024.7 .~ 2025.7. 기간 동안의 단속일시, 위반법규, 단속구분, , 차명, 부과본세,, 부과일자, 고지서에 포함된 사진 매수 등을 제공합니다.해당 기간 동안 고정형 CCTV, 시민신고 등을 통해 총 11,020건 556,455,000원의 과태료가 부과되었습니다. 개인정보를 보호하기위해 본 정보는 차량소유주 , 차량번호를 포함하고 있지 않습니다
