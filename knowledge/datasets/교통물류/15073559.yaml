summary_user: 대전광역시에서 승용차요일제 참여차량에 요금 할인을 주는 공영주차장 목록을 시군구 단위로 담은 파일로, 주차장별 이름·위치·주차면수·할인내용·할인방법을 한 행씩 정리했다. 승용차요일제에 참여한 시민이 '우리 구에서 할인받을 수 있는 공영주차장이 어디이고 얼마나 깎아 주는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 전국주차장정보표준데이터 같은 주차장 원장과는 시군구명·주차장명 문자열 매칭으로만 이어 쓴다.
