summary_user: 부산광역시 관내 지하차도를 시설 1곳당 1행으로 담은 현황 파일로, 시설명·시도·시군구와 제원(총길이·총폭·높이)이 들어 있으며 포털 설명상 2025년 기준 58개소입니다. 운전자나 화물·물류 사업자가 "우리 구에 있는 지하차도 중 높이 제한이 낮은 곳은 어디인가"를 확인하거나, 분석가가 구군별 지하차도 분포와 규모를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군구 이름으로 다른 시군구 단위 통계와 맞추거나, 시설명으로 다른 도로 시설물(터널·교량) 자료와 대조해 이어 쓴다.
