summary_user: 서울교통공사가 운영하는 전동차 객실의 실내 공기질 측정 결과를 호선별로 담은 집계 파일로, 초미세먼지(PM-2.5) 농도와 혼잡·비혼잡 시간대 이산화탄소 농도를 연간 측정값으로 제공하며 파일 크기는 380바이트 수준으로 작다. 지하철 이용객이나 환경·교통 분석가가 '어느 호선 전동차의 초미세먼지·이산화탄소 농도가 높은가, 혼잡 시간대에 이산화탄소가 얼마나 오르는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 호선 이름을 기준으로 같은 기관의 호선별 혼잡도·승하차 데이터나 역사 공기질 자료와 이름 매칭으로 이어 쓴다.
limits: 호선 단위 집계값만 있어 개별 편성·차량·시간대별 원시 측정값은 알 수 없다. 공통 조인 키가 없어 다른 데이터와는 호선명 문자열을 맞춰야 연결된다. 범위가 '전국'으로 표기되어 있으나 실제 내용은 서울교통공사 운영 노선에 한정된다.
