description_portal: 서울교통공사에서 운영하는 전동차의 실내 공기질 측정 정보를 제공하는 공공데이터입니다. 본 자료는 「실내공기질관리법」 권고기준 항목을 대상으로 정기적으로 측정·관리된 결과를 포함하며, 초미세먼지(PM-2.5) 농도와 혼잡시간대 및 비혼잡시간대의 이산화탄소 농도 등 주요 공기질 지표의 연간 측정값을 제공합니다. 또한 전동차 객실 내 공기질 관리 수준을 확인할 수 있도록 시기별 측정 결과를 반영하고 있으며, 도시철도 이용 환경의 쾌적성 및 안전성 확보를 위한 기초 자료로 활용될 수 있습니다. 해당 데이터는 전동차 이용객의 건강 보호, 공기질 관리 정책 수립, 환경 개선 대책 마련, 학술 연구 및 통계 분석 등 다양한 공공 목적에 활용될 수 있습니다.
