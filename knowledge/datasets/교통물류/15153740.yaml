summary_user: 한국철도공사가 편성한 열차별로 차량 연결 순서, 연결역·해방역과 그 시각, 차종, 주행거리(km), 차량환산량수, 객차 차실 종류, 동차 여부를 담은 편성 단위 파일(CSV 약 1.2MB)로, 범위는 전국입니다. 철도 분석가나 운영 관심자가 '특정 편성 열차가 어느 역에서 어떤 객차를 연결·분리하고 몇 km를 달리는가'를 확인하거나 열차종별 편성 구성을 집계하는 데 쓴다. 전역 조인 키가 없어 다른 철도 데이터와는 역명(연결역명·해방역명)이나 편성번호 같은 같은 기관 내 코드를 이름 매핑해 이어 쓴다.
