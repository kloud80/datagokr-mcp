summary_user: 한국교통안전공단이 수집한 철도 사고·안전 관련 게시글(교육자료, 기술자료, 안전분석자료, 사고사례, 학술분석, 철도안전연차보고서 등)을 글 한 건 단위로 담고, 글제목·글유형·글내용·등록일과 첨부파일 다운로드 링크를 제공하는 전국 범위 목록 파일(CSV 약 22만 바이트)이다. 철도안전 교육 담당자나 연구자가 도시철도·고속철도·일반철도·해외 사고사례나 어린이용·일반인용 안전교육 자료를 찾아 원문 첨부파일을 내려받는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 철도 데이터와는 글제목의 철도 구분이나 기관명 같은 이름 매칭으로만 느슨하게 연결한다.
limits: 사고 건별 통계(일시·장소·피해 규모)를 담은 데이터가 아니라 자료 게시글 목록이라 사고 집계·추이 분석에는 바로 쓰기 어렵고, 실제 내용은 첨부파일을 따로 받아 확인해야 한다. 조인 키가 없어 역·노선 등 다른 데이터와 코드로 결합할 수 없다.
