summary_user: 한국교통안전공단 대중교통 현황조사로 집계한 지역 간 버스 이용인원을 시간대별(구분1)로 담은 전국 단위 집계 파일로, 고속버스와 시외버스 각각의 평일·토요일·일요일 이용인원(명)이 열로 나뉘어 있습니다(약 1KB CSV). 교통 정책 분석가나 운수사업자가 고속·시외버스 수요가 몰리는 시간대가 평일과 주말에 어떻게 다른지 파악해 배차·증편 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시간대 구분이나 수단(고속·시외) 이름을 맞춰 연결해야 한다.
description_portal: 한국교통안전공단에서 대중교통 현황조사를 통해 조사한 지역 간 대중교통 평일 시간대별 버스 이용인원 데이터입니다.해당 데이터의 수단은 고속버스와 시외버스이며, 평일과 주말(토요일, 일요일)별로 시간대별에 따라 이용인원을 세분화하여 제공하였습니다.단위는 명입니다.해당 데이터를 통해 대중교통 운행 및 이용실태를 파악할 수 있어 나아가 대중교통 서비스 개선, 정책 설계, 전략 수립 등에서 기초자료로 활용될 수 있습니다.더 나아가 교통체계 구축에도 중요한 역할을 하며 맞춤형 대중교통 제공 방안 등을 마련할 수 있습니다.
