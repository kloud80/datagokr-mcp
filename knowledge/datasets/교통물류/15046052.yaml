summary_user: 광주교통공사 도시철도 1호선 역에서 운영하는 무료 대여 자전거의 대여 건수를 월별·역별로 집계한 표로, 2015년 1월부터 한 행에 한 달, 열에 소태역부터 평동역까지 15개 역의 대여 횟수를 담는다(약 7KB 규모의 CSV). 정책 담당자나 분석가가 '어느 역에서 무료 자전거가 가장 많이 빌려지고, 봄·가을에 대여가 늘어나는가'를 확인해 역세권 자전거 인프라 개선이나 계절별 수요 예측에 쓴다. 전역 조인 키가 없어 다른 데이터와는 역 이름을 직접 맞추거나 같은 기관(광주교통공사)의 역별 승하차 등 자료와 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 광주교통공사에서 제공하는 무료 대여 자전거의 월별 대여 현황을 보여줍니다. 2015년 1월부터 시작하여 각 행은 특정 월의 역별 대여 건수를 나타내며, 소태역부터 평동역까지 1호선 주요 역들이 열로 구성되어 있습니다. 숫자는 해당 월에 해당 역에서 이루어진 자전거 대여 횟수를 의미합니다. 이를 통해 월별·계절별 대여 패턴, 역별 이용 편차, 특정 시기 대여 급증 여부 등을 분석할 수 있습니다. 예를 들어, 봄·가을철 대여 증가, 주거·상업 밀집 지역 역의 대여 집중 현상, 혹은 특정 역에서의 꾸준한 고이용량 등을 파악할 수 있습니다. 이 자료는 친환경 교통수단 이용 촉진 정책 평가, 역세권 자전거 인프라 개선, 계절·이벤트별 수요 예측 등에 활용 가치가 높습니다.
