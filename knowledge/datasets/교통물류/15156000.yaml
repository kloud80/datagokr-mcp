summary_user: 아산시 불법주정차 신고·단속 건을 한 건씩 담은 원천 파일로, 위반일시·주소·위도·경도·읍면동·처리결과를 시군구 범위의 개별 주소·좌표 단위로 담는다. 시민이나 교통 분석가가 '아산시에서 불법주정차 신고가 몰리는 동네와 시간대는 어디인가' 같은 다발지역 질문에 쓴다. 전역 조인 키는 없어서, 읍면동 이름을 매핑하거나 위도·경도 좌표로 보호구역·단속카메라 같은 다른 공간 데이터와 겹쳐 쓴다.
description_portal: ‘충청남도 아산시 불법주정차 신고 및 과태료 부과 현황’ 데이터는 아산시 내 불법주정차 행위에 대한 시민 신고 건수와 행정기관의 과태료 부과 내역을 투명하게 공개하기 위해 구축된 공공데이터이다. 본 자료에는 신고 일자, 신고 위치, 차량 정보, 위반 유형, 처리결과, 과태료 부과 금액 등 주요 정보가 포함되어 있으며, 안전한 교통환경 조성과 도로 질서 확립을 위한 기초자료로 활용된다. 이 데이터는 시민 참여형 교통단속의 현황을 파악하고, 불법주정차 다발지역 분석, 교통 정책 개선, 예방대책 수립 등에 중요한 근거자료가 된다. 아산시는 신고·처리 데이터를 정기적으로 갱신해 최신성을 유지하고 있으며, 공공데이터포털을 통해 누구나 열람·분석·활용할 수 있도록 제공하고 있다.
