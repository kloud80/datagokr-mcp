summary_user: 한국건설기술연구원이 조사한 수시 교통량 조사 결과를 조사연도·도로등급·노선·노선도(구간) 이름별로 묶어, 전체 교통량과 12개 차종별 교통량을 담은 집계 데이터로 범위는 전국이다. 도로 분석가나 교통안전 담당자가 '특정 노선 구간에서 화물차 등 대형 차종 비중이 연도별로 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선 번호·노선도 이름 같은 이름 매칭으로만 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국건설기술연구원에서 제공하는 수시노선도별차종통계 정보입니다.\""
