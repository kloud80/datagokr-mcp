summary_user: 경상북도 구미시 관내 버스 정거장을 한 건씩 담은 원장으로, 정거장 식별자·표준 식별자·정거장 유형·중앙차로 여부·한글 명칭·단축명과 위도·경도 좌표, 연결된 도로 링크 정보를 포함한다. 시민이나 앱 개발자가 '내 위치 근처 구미시 버스 정류장이 어디인가'를 찾거나, 분석가가 정류장 분포와 대중교통 접근성을 지도에서 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 정류장 이름 매칭이나 좌표(위도·경도) 기반 공간 결합으로 이어 써야 한다.
limits: 구미시 범위의 정류장 위치·속성만 담아 실시간 도착 정보나 노선별 운행 정보는 별도 데이터(TAGO·지자체 BIS 등)가 필요하다. 표준 조인 키가 확인되지 않아 타 기관 정류장 데이터와 연결할 때 이름·좌표 매핑 오류에 주의해야 한다. 호출에는 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
