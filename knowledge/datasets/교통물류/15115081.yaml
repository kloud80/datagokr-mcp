description_portal: '서울특별시 용산구 일반화물운송사업자 현황에 대한 데이터로 사업자 종류, 업체수, 면허상태, 관리기관, 관리기관 전화번호, 데이터기준일에 대한 데이터를 제공합니다. "화물자동차 운송사업"이란 다른 사람의 요구에 응하여 화물자동차를 사용하여 화물을 유상으로 운송하는 사업을 말합니다. (「화물자동차 운수사업법」 제2조제3호 전단).  화물자동차 운송사업의 종류는 다음과 같습니다. (「화물자동차 운수사업법」 제3조제1항 및 「화물자동차 운수사업법 시행령」 제3조제1항). 일반화물자동차 운송사업: 20대 이상의 화물자동차를 사용하여 화물을 운송하는 사업, 개인화물자동차 운송사업: 화물자동차 1대를 사용하여 화물을 운송하는 사업. ※ 일반·개인화물자동차의 구별 기준은 화물자동차 운송사업의 허가기준(「화물자동차 운수사업법 시행규칙」 별표 1)에서 확인할 수 있습니다. ※ "화물자동차"란 「자동차관리법」 제3조에 따른 화물자동차 및 특수자동차로서 「화물자동차 운수사업법」 제2조제1호, 「화물자동차 운수사업법 시행규칙」 제3조 및 「자동차관리법 시행규칙」 별표 1에서 확인할 수 있습니다.'
