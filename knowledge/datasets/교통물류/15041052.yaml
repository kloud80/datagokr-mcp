summary_user: 수도권 2호선 각 역에서 다른 노선으로 갈아탈 때의 환승 노선·운영기관과 환승에 가까운 차량 칸 순서·출입문 번호를 역·환승노선 단위로 담은 작은 CSV 파일(약 7KB)이다. 2호선 이용자나 길찾기 서비스 개발자가 "이 역에서 몇 번째 칸 몇 번 문에 타야 환승이 빠른가"를 안내할 때 쓴다. 전역 조인 키가 없어 다른 역·노선 데이터와는 역명·노선명·운영기관명을 이름으로 맞춰 연결해야 한다.
description_portal: 수도권 2호선 역사들의 환승정보 데이터로 철도운영기관명, 선명, 역명, 환승철도운영기관, 환승선명, 환승이후역명, 환승기점역명, 차량순서, 차량출입문번호의 데이터가 있습니다.도시철도 및 철도에서 다른 노선으로 열차를 갈아탈 수 있도록 만든 역을 말한다.대개 기존에 지어진 노선 근처에 역을 만들어 환승하는 경우에만 해당되지만, 넓은 의미에서 보면 철도의 경우는 급행에서 완행으로 다른 급의 열차를 타거나 도시철도와 마찬가지로 노선이 직결되지 않아서 어쩔 수 없이 갈아타는 경우가 있다. 또한 다른 교통수단으로 갈아타는 것이 가능한 역도 이 범주에 들어간다.환승역 사이를 오갈 때 개찰구를 통과하지 않고 다른 승강장으로 갈 수 있으면 직접환승이라고 하고, 반드시 하나 이상의 개표구를 통과 해야하면 간접환승이라고 한다. 환승통로의 유무는 직접환승-간접환승을 가리는 기준이 아니다. 두 승강장의 운임구역 분리가 간접환승의 기준이다. 환승통로가 있어도 두 역의 운임구역이 별개라 개찰구를 통과해야 하면 간접환승이다. 환승통로에 환승전용 개찰구가 있는 간접환승은 환승 게이트라고 한다. 즉, 환승게이트는 환승통로 양 쪽의 두 개표기를 하나로 통합한 것이다. 단, 환승 게이트 방식은 직접환승으로 보는 관점도 있다.
