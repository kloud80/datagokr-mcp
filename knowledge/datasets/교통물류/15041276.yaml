summary_user: 부산교통공사가 운영하는 도시철도 노선의 역별 전동휠체어 급속 충전설비를 한 행씩 담은 파일로, 노선·역명·지상지하 구분·역층·상세위치·충전설비 수·전화번호를 담는다(약 6KB 규모 CSV). 전동휠체어 이용자나 보호자가 '부산 지하철 어느 역 몇 층에 충전기가 있고 몇 대인가'를 확인하거나, 분석가가 노선별 이동약자 편의시설 배치를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 철도 역 데이터와는 운영기관명·선명·역명 문자열을 맞춰 연결해야 한다.
description_portal: 부산교통공사에서 운영하는 노선의 전동휠체어 충전설비에 대한 데이터로, 철도운영기관명, 선명, 역명, 지상지하구분, 역층, 상세위치, 충전설비수, 이용요금, 전화번호의 데이터가 포함되어 있습니다.1. 구성- 지하철에 설치되어 있는 전동휠체어 급속 충전기의 빨간색은 전원이고 노랑색은 레버, 분홍색은 휴대폰충전 케이블이다.- 전동휠체어 급속 충전기는 좌, 우에서 동시 2대가 충전 가능하며, 휴대폰 충전도 가능하다.2. 사용방법- 급속충전기의 충전잭을 잡아당기면 충전케이블이 나오는데, 이 충전 케이블을 전동휠체어의 충전단자에 연결한다.- 급속충전기의 전원 스위치를 켜면 충전이 시작되고, LED창에 불이 들어온다.- 충전이 완료되면 LED창이 녹색으로 바뀐다.- 전원을 끄고, 주황색 레버를 옆으로 밀면, 길게 나와 있던 충전선이 안으로 다시 들어간가.3. 장애인 전동휠체어 배터리 자동충전 요금은 무료이다.
