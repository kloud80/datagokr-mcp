summary_user: 경의중앙선에 속한 도시광역철도역을 역 한 곳당 한 행으로 담은 파일로, 운영기관명·선명·역번호·역명과 영문·로마자·일본어·중국어(간체·번체) 역명, 환승역 여부, 유실물 취급 여부, 신설일자를 담는다. 외국어 안내판이나 다국어 길찾기 서비스를 만드는 사업자가 '경의중앙선 각 역의 역번호와 외국어 표기가 무엇이고 어느 역이 환승역인가'를 확인하는 데 쓴다. 전역 공통 조인 키는 없어서, 다른 역 좌표·승하차 데이터와는 역명이나 역번호를 맞춰 보거나 같은 기관의 다른 노선 역번호 파일과 이름으로 이어 쓴다.
description_portal: 경의중앙선에 포함된 도시광역철도역들의 기관명, 선명, 역명, 영어명, 로마자, 일본어, 중국어간체, 중국어번체, 환승역여부, 신설일자의 데이터가 있습니다.도시철도나 광역철도 등에서 노선에 따라 역마다 번호를 부여하는 체계를 의미한다. 번호 등에 따라 역의 위치 등을 쉽게 알게 하거나, 그 지역의 언어가 익숙지 않은 외국인 관광객 등에게 보다 역을 쉽게 인식하기 쉽게 하기 위한 목적이 있다.역번호는 1983년 서울 지하철 2호선 서울대입구~을지로입구 구간이 개통될 때 세계 최초로 부여되기 시작했다. 그러나 아는 사람만 써먹는 등 활용은 잘 하지 않고 있다. 현재는 한국에서도 한국철도공사 노선들을 중심으로 새로 도입된 TTS 안내방송에서 역번호를 알려주기 시작했다. 또한 번호 변경이 자주 이루어져 영구적인 포인터 기능을 수행하지는 못하는 한국과는 달리, 비교적 번호 변경을 억제(신설역에 -1 등 가지 번호 사용)하는 경향이 있어 포인터로의 기능을 충실히 하는 편. 각 역들의 역번호를 외우고 다니면, 다른 사람에게 현재 역에서 목적지까지 몇 정거장이 걸리는지, 대략 시간이 얼마나 걸릴지 바로 알려줄 수 있다.
