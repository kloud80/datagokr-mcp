summary_user: 한국도로공사가 고속도로 이용자에게 보낸 문자 기반 교통정보 안내의 발송 이력을 건별로 담으며, 발송 일자·시각(oDate, oTime), 노선·방향·구간, 정체 길이, 메시지 유형·상태, 안내 문구가 들어 있고 범위는 전국 고속도로다. 분석가가 특정 노선·구간에서 사고나 정체 때 어떤 안내 문자가 언제 나갔는지 확인하고 긴급 알림 운영을 평가하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 표준노드링크 등 다른 교통 데이터와는 노선명·구간명 같은 이름 매핑이나 한국도로공사 자체 코드로만 이어 쓴다.
description_portal: 본 데이터는 한국도로공사에서 제공하는 문자 기반 교통 정보 안내 서비스의 발송 이력을 수록한 OpenAPI 서비스이다.고속도로 이용자에게 제공된 문자 정보의 발송 시각, 발송 수단, 제공 구간, 메시지 유형, 안내 내용 등이 포함되며 XML 및 JSON 형식으로 제공된다.본 데이터는 교통 정보 제공 이력 분석, 긴급 상황 알림 시스템 평가, 정보 서비스 품질 향상 등에 활용 가능하다.문자 발송 이력 정보는 이용자 중심의 서비스 개선과 고속도로 운영 효율성 제고에 기여한다.데이터는 정기적으로 갱신되며, 교통 상황 변화에 대한 실시간 대응과 국민 대상 정보 제공 체계의 투명성을 확보한다.공공기관의 정보 전달 모니터링, 민간 서비스 연계, 정책 수립을 위한 참고 자료로 다양하게 활용될 수 있다.
