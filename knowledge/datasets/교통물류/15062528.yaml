summary_user: 고속도로 영업소별로 주요 공휴일(1월 1일, 1월 29일, 3월 1일, 5월 5일, 6월 6일, 8월 15일, 10월 3일, 10월 6일, 12월 25일) 하루의 이용 차량 대수를 날짜별 열로 나란히 담은 전국 단위 집계 파일이다. 교통 분석가나 도로 운영 담당자가 "어느 영업소가 어느 공휴일에 차량이 가장 많이 몰렸나"를 비교하거나 연휴 혼잡 대책의 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 영업소 이름을 매핑해서만 이어 쓸 수 있다.
limits: 영업소 이름 외에 표준 코드가 없어 다른 고속도로·통행 데이터와 직접 조인되지 않는다. 지역 구분이 없는 전국·비공간 자료라 지도나 시군구 단위 분석에는 별도 위치 매핑이 필요하다.
