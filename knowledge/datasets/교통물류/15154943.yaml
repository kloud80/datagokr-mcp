description_portal: 광산구에서는 행정동별로 발생한 안전신문고 불법주정차 신고자료에 대한 데이터를  제공하고 있습니다.이 자료는 연번을 포함하여 단속이 이루어진 행정동(단속동), 구체적인 단속 행정동의 지번주소, 신고 일시로 구성되어 있습니다.광산구 내 각 행정동별 불법주정차 안전신문고 신고현황을 파악하고, 특정 지역이나 시간대에 집중된 단속 추이를 분석할 수 있으며, 원활한 차량 흐름을 위한 정책 수립에 참고 자료로 사용할 수 있습니다.또한 특정지역의 신고집중시간대 및 신고집중지역에 대해 분석하여 시민들의 신고경향에 대해 파악할 수 있으며 연구 및 문서작성을 위한 참고자료로 사용할 수 있습니다.
