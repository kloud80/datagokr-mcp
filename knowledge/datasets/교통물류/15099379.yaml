summary_user: 서울시 행정동별로 하루 단위 지하철 총 승차 승객수와 0시~23시 시간대별 승차 승객수를 담은 집계 데이터이며, 범위는 시도 단위 서울시이고 행정단위는 읍면동입니다. 분석가나 상권·교통 담당자가 특정 행정동에서 출근 시간대 지하철 승차가 얼마나 몰리는지 등을 확인하는 데 쓴다. 전역 조인 키는 확인되지 않았으며, 행정동 ID(DONG_ID)는 포털 설명대로 서울시 읍면동마스터 정보와 맞춰 행정동 이름·코드로 연결해 쓴다.
