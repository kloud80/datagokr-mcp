summary_user: 경기도 용인시가 대중교통 소외지역에서 운영하는 공공형 행복택시의 운영현황을 기준연도·출발 마을 단위로 담은 집계 파일로, 마을별 이용가능 시간대, 월 평균 이용횟수, 월 평균 이용요금·이용자부담금·지원금을 포함한다(약 3KB 규모의 작은 CSV). 용인시 교통취약 마을 주민이 우리 마을에서 몇 시부터 몇 시까지 행복택시를 탈 수 있고 본인 부담이 얼마인지 확인하거나, 분석가가 마을별 이용량 대비 지원금 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 마을명(출발지)을 행정리·법정동 이름에 문자열로 맞추거나 같은 기관(용인시) 자료끼리만 이어 쓸 수 있다.
description_portal: 본 데이터는 경기도 용인시에서 대중교통 소외지역 주민의 이동권 보장을 위해 운영하는 행복택시(공공형)의 연간 운영 현황을 정리한 자료이다. 주요 항목에는 이용 마을, 이용 가능 시간, 월 평균 이용 횟수, 이용 요금, 이용자 부담금, 지원금, 데이터 기준일자 등이 포함되어 있으며, 이를 통해 교통 취약 지역 주민들의 이동 서비스 실태를 구체적으로 확인할 수 있다. 본 자료는 교통 불편 해소와 지역 균형 발전을 위한 정책 수립에 기초 자료로 활용되며, 특히 교통 복지 확대와 예산 지원 효율성 검토에 유용하다. 행정기관은 이를 토대로 마을별 이용 패턴과 지원금 규모를 분석하여 사업 운영의 지속 가능성을 평가할 수 있으며, 연구자는 교통 복지와 지역 교통 인프라의 상관성을 분석하는 데 참고할 수 있다. 또한 시민은 본 데이터를 통해 행복택시 이용 여건을 파악하여 교통 편의성 향상을 체감할 수 있다. 본 데이터는 최신 기준일자를 반영하여 정기적으로 갱신되며, 대중교통 취약 지역 지원 정책의 투명성과 효과성을 높이고, 주민 맞춤형 교통 서비스 개선에 기여한다.
