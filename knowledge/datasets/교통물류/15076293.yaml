summary_user: 화성시 관내에 등록된 전세버스·특수여객 운송업체를 업체 한 곳당 한 행으로 담은 목록으로, 업종명·업체명·전화번호·도로명 주소·등록대수가 들어 있다(CSV 약 8.7KB, 시군구 범위). 화성시 주민이나 단체가 관내에서 전세버스를 빌릴 업체와 연락처를 찾을 때, 교통행정 담당자가 업종별 업체 수와 보유 차량 규모를 파악할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명이나 도로명 주소를 맞춰 보는 방식으로만 이을 수 있다.
limits: 전국 공통 사업자 코드 같은 조인 키가 없어 다른 등록·허가 데이터와 정확히 대조하기 어렵다. 범위가 화성시 한 곳뿐이라 다른 시군이나 전국 현황은 이 자료로 알 수 없다. 세부 부문은 화물운송업으로 분류돼 있지만 실제 내용은 여객(전세버스·특수여객) 업체이므로, 허가받은 화물 운송사인지 확인하려면 전국화물자동차운송사업자표준데이터를 기준으로 삼는다.
