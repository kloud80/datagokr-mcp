summary_user: 광주 시내버스 차량별로 차량번호, 저상버스 여부, 소속 운수회사명, 운행 노선명을 담은 원천 목록 파일(CSV)이다. 교통약자 단체나 정책 분석가가 "어느 노선·운수회사에 저상버스가 몇 대 배차돼 있나"를 확인하고 저상버스 확대 대상 노선을 고르는 데 쓴다. 전역 조인 키가 없어 노선명이나 운수회사명을 기준으로 정류장·노선 원장이나 버스 도착정보(BIS)와 이름 매칭해 이어 쓴다.
description_portal: 광주광역시 시내버스는 대창운수, 을로운수, 현대교통 등 10개 운송업체가 운영하고 있으며, 예비차량을 포함하여 총 1,044대가 운행 중입니다. 본 자료는 광주 시내버스의 운행 현황을 파악하기 위한 데이터로, 각 노선별 및 운송회사별로 운행 중인 저상버스의 대수 정보를 포함하고 있습니다. 저상버스는  바닥 높이가 낮고 출입구에 계단이 없어 휠체어, 유모차 사용자나 노약자, 장애인 등 교통약자가 편리하게 이용할 수 있는 버스로 교통약자의 이동편의 증진에 기여하고 있으며, 본 정보는 향후 저상버스 확대 보급, 교통정책 수립, 노선 운영 개선 등 대중교통 서비스 향상을 위한 기초자료로 활용됩니다.
