summary_user: 인천광역시 서구(제목은 서해구)의 불법주정차 과태료를 위반내용·위반차종·위반구역·근거법규·과태료 금액(원) 항목으로 담은 시군구 범위 파일이다. 실측 파일은 603바이트 CSV로 아주 작아, 개별 단속 건 원장보다는 위반 유형별 과태료 금액을 정리한 표에 가깝다. 주민이나 사업자가 승용차를 어린이보호구역 등 특정 구역에 세웠을 때 과태료가 얼마이고 근거 법규가 무엇인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위반내용·구역 이름을 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구에서 발생한 불법주정차에 대한 과태료 부과 내역을 담고 있습니다. 본 데이터는 위반금액, 위반유형, 위반장소 등의 항목으로 구성이 되어있습니다. 본 데이터를 통해 주차 질서 위한 현황을 파악할 수 있으며, 주차 행정 처리의 투명성 확보 및 주차 정책 수립에 기초 자료로 활용될수 있을것으로 판단이 됩니다. 또한 불법주정차 예방 대책 마련에도 활용이 가능할것으로도 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
