description_portal: '데이터 개요경량항공기의 등록 현황을 기령과 항공기 종류별로 분류하여 제공하는 공공데이터입니다. 이 데이터는 국내에 등록된 경량항공기를 기령 구간별로 나누고, 항공기 종류별(타면조종형, 체중이동형, 경량헬리콥터, 자이로플레인, 동력패러슈트 등) 등록 대수를 제공하여, 항공기 노후화 분석, 항공레저활동 관리, 안전정책 수립 등에 활용됩니다.데이터 제공 항목기령: 항공기 제작일로부터 경과된 연수를 기준으로 분류한 구간타면조종형: 조종간을 통해 날개의 조종면을 직접 조작하는 고정익 경량항공기의 등록 대수체중이동형: 조종자가 자신의 체중 이동으로 방향을 조절하는 항공기의 등록 대수경량헬리콥터: 소형 회전익 방식의 경량항공기 등록 대수자이로플레인: 자이로스코픽 회전익을 사용하는 회전익 비행기체의 등록 대수동력패러슈트: 낙하산과 동력을 이용한 초경량 비행장치의 등록 대수활용 안내경량항공기 보유 현황 분석 및 노후 기체 교체 주기 산정비행교육기관 및 항공레저사업자의 기체 운영계획 수립항공안전법 관련 정책 수립 및 기체 검사 주기 기준 마련항공기 제조사, 정비업체의 시장 수요 분석 기반 자료로 활용 가능데이터 해석 시 유의사항기령은 항공기 제작 기준이며 실제 등록일자 또는 운항개시일과는 다를 수 있음경량항공기의 분류는 「항공안전법 시행규칙」에 따른 분류 체계를 기반으로 함특정 기령 구간에서 항공기 수가 적은 경우, 연도별 변동성이 클 수 있음데이터 구성 예시기령타면조종형체중이동형경량헬리콥터자이로플레인동력패러슈트계3년 미만90002173년 이상 ~ 5년 미만6000175년 이상 ~ 10년 미만2602213110년 이상 ~ 15년 미만4113145015년 이상 ~ 20년 미만4421204920년 이상 ~ 25년 미만5210005325년 이상 ~ 30년 미만1600001630년 이상300003'
