summary_user: 광주 도시철도에서 접수된 유실물을 건별로 기록한 파일로, 관리번호·접수일·품명·수량·습득 일시와 장소·반환일·인계 경찰서·처리 결과를 담는다(CSV 약 461KB). 승객이 잃어버린 물건이 어느 역에서 습득돼 반환됐는지, 경찰서로 넘어갔는지 확인하거나, 분석가가 자주 분실되는 물품과 습득 장소를 집계해 안내·보관 개선 근거로 삼는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 습득장소의 역 이름이나 인계경찰서 이름을 텍스트로 맞춰 역 정보·경찰서 정보와 이어 쓴다.
description_portal: 광주 도시철도 내에서 승객이 분실한 물품의 접수, 보관, 반환, 폐기 등 처리 과정을 기록한 자료입니다. 주요 항목에는 유실물 접수일, 습득장소(역명), 물품 종류, 보관 기간, 반환 여부, 처리 결과 등이 포함됩니다. 이 데이터는 분실물 관리의 투명성을 높이고, 승객의 물품 반환 가능성을 높이기 위한 서비스 개선에 활용할 수 있습니다. 또한, 자주 분실되는 물품 유형이나 습득 장소를 분석해 분실 예방 캠페인, 안내 강화, 보관 시스템 개선 등 맞춤형 정책 수립에 활용할 수 있습니다. 나아가, 데이터 공개를 통해 시민의 신뢰도를 높이고, 분실물 처리 절차의 효율성을 높이는 데 기여할 수 있습니다.
