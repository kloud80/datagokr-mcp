summary_user: 서산시 도시계획정보시스템 중 용도구역(개발제한구역·수산자원보호구역 등) 관련 테이블의 구조를 담은 메타데이터로, 시스템명·데이터베이스명·테이블명·컬럼명(영문·한글) 7개 항목으로 된 작은 CSV 파일(약 3.8KB)이다. 용도구역 데이터를 받아 분석하거나 시스템을 연계하려는 개발자·분석가가 '이 시스템의 용도구역 테이블에는 어떤 컬럼이 있고 각 컬럼의 한글 뜻은 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 테이블명·컬럼명을 이름으로 맞추거나 같은 기관(서산시)의 도시계획 데이터와 묶어 쓴다.
