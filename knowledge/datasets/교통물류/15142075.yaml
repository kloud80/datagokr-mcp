status: active
summary_user: 전국 읍면동 단위로 대중교통 수단(버스, 지하철 등)별 발생 통행인원수를 담은 API로, 전체 2,053건 중 검증 시 1,036행을 받았다. 지자체 교통 담당자나 분석가가 특정 시군구에서 버스와 지하철이 이동 수요를 어떻게 나눠 맡는지 파악하는 데 쓴다. 시군구코드(sgg_cd)를 키로 같은 코드를 쓰는 다른 지역 데이터와 이어 쓰며, 정류장·노선·도착 정보 같은 버스 데이터와 함께 대중교통 검토에 쓴다.
limits: 오퍼레이션 3개 중 실호출에 성공한 것은 2개이고, 일간 분담률 오퍼레이션(/getDailyPublicTransportationModeShare)은 최소 파라미터로 응답이 없었다. 개발계정은 일 1,000회 호출로 제한되며 serviceKey가 필요하다.
