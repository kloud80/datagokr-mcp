summary_user: 서울시 도로구역 안에서 지하매설물 신설·변경·제거 등 굴착을 수반하는 공사를 허가 건별로 담으며, 착공계가 접수되어 허가가 승인된 공사만 들어 있다(허가번호, 공사명, 공사기간, 신청자, 처리상태, 도로 종류 등). 주민·사업자가 '우리 동네 도로에 언제까지 어떤 굴착공사가 진행되나'를 확인하거나, 분석가가 공사 이벤트를 지역 교통·접근성 변화와 견주어 보는 데 쓴다. 자치구·행정동 코드(ADSTRD_CD) 필드가 있으나 실측에서 전역 조인 키로 확인되지 않아, 다른 데이터와는 서울시 코드나 이름 매핑으로 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 별도 인증키가 필요하며 공공데이터포털 활용신청과는 별개다. 전역 조인 키가 없어 행정구역·도로 데이터와의 결합은 이름·코드 매핑에 의존한다. 갱신은 명세상 수시이므로 정기 주기를 가정하지 않는다.
