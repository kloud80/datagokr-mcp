description_portal: '"도로굴착관련사업"이란 공작물이나 물건, 그 밖의 시설(지하매설물에 한한다)을 신설, 개축, 변경 또는 제거등을 위하여 도로의 노면, 길어깨, 비탈면 및 지하공간 등의 도로구역 (도로예정지 및 준용도로를 포함한다) 안에서 굴착을 수반하는 공사를 말하며, 도로굴착 공사관리 및 진행현황 상호공유를 위해 주변지역 공사현황 정보를 제공합니다. 착공계가 접수되어 공사 허가가 승인된 데이터만 서비스합니다.제공부서는 서울특별시 재난안전실 도로기획관 도로관리과(02-2133-8173) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
