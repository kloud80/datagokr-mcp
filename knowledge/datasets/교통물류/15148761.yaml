description_portal: '항만 화물신고제약정보는 특정 항만에서 허용되지 않는 화물이나 위험물, 또는 특정 규정에 따라 반입이 제한되는 화물에 대한 정보를 의미합니다. 이는 해당 화물이 항만 운영에 위험을 초래하거나 관련 법규에 위반될 수 있기 때문에, 해양수산부 또는 각 항만공사의 홈페이지나 항만운영정보시스템(PORT-MIS)을 통해 확인할 수 있습니다.1. 위험물 반입 제한 : 방사성물질 등 특정 위험물은 반입 시 별도 신고 및 허가 절차가 필요할 수 있습니다. 2. 시설장비 사용 제한 : 항만 내 시설장비를 사용할 경우, 신고 절차를 거치지 않거나 허가받지 않은 장비를 사용하는 경우 제약이 따를 수 있습니다. 3. 컨테이너 화물 관련 규정 : 공컨테이너 환적 시 사용료 할인 내역과 같이, 특정 조건에 맞는 화물에 대한 규정이나 할인이 제공될 수 있습니다.'
