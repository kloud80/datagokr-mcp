summary_user: 대전광역시 서구에서 2024년 한 해 동안 안전신문고로 시민이 신고한 횡단보도 불법주정차 단속 건을 한 건씩 담은 파일(CSV, 약 3.7MB)로, 단속일시·단속동·단속장소·위반법규·좌표·과태료 부과 여부가 들어 있다. 구청 교통 담당자나 분석가가 '서구에서 횡단보도 불법주정차 신고가 어느 동, 어느 지점에 몰리고, 그중 실제 과태료로 이어진 비율은 얼마인가'를 볼 때 쓴다. 전역 조인 키는 없어서 시군구·단속동 이름이나 좌표(GPS_X, GPS_Y)를 매개로 다른 행정동·지도 데이터와 맞춰 이어 써야 한다.
