description_portal: 이 데이터는 2024년 동안 안전신문고를 통해 시민이 직접 신고한 횡단보도 불법주정차 사례만을 수집·정리한 자료입니다. 횡단보도 주변 정차는 보행자의 시야를 가리거나 이동 동선을 방해해 보행 안전을 위협하는 대표적 위반 유형으로, 신고 기반 단속을 통해 관리되고 있습니다.데이터에는 신고 건이 실제 단속으로 처리된 단속일시와 해당 위반이 발생한 단속동 정보가 포함되어 있으며, 신고자가 제출한 사진·영상 및 확인 절차를 통해 특정할 수 있는 단속장소가 기록됩니다. 단속 유형을 구분하는 단속구분 항목은 안전신문고 접수 건이라는 특성을 명확히 나타내며, 위치정보는 위반 장소를 좌표 등으로 세부 확인할 수 있도록 제공합니다.또한 과태료부과여부가 포함되어 있어 신고 건이 행정처분으로 이어졌는지 여부를 확인할 수 있습니다. 신고 후 현장 확인 및 법적 요건 충족 여부에 따라 과태료 부과 여부가 결정되므로, 안전신문고 신고 처리 결과를 전체 흐름 속에서 파악하는 데 도움이 됩니다.
