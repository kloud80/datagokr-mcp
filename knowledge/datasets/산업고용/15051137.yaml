summary_user: 광업등록사무소 통계집에 실린 2012년 이후 광업권 등록현황을 연도·광종분류(금속광·비금속광)·광종별로 집계한 전국 단위 통계로, 광업권·탐사권·채굴권 각각의 설정등록·회복·기타·소멸·총등록 건수를 담는다. 자원 분석가나 광업 관련 사업자가 "특정 광종의 채굴권은 해마다 얼마나 새로 등록되고 소멸되는가" 같은 추세를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 광업·토석채취 데이터와는 연도와 광종 이름을 맞춰 연결해야 한다.
