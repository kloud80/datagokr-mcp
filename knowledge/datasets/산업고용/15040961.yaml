description_portal: 이 데이터는 한국남부발전 해외사업 수행 과정에서 활용되는 주요 영문 건설 용어와 그 뜻을 정리한 자료입니다. 총 178개의 용어가 포함되어 있으며, 계약서 작성, 공사 시방서, 시공 관리, 위험 관리 등 다양한 분야에서 자주 쓰이는 전문 용어와 그 한국어 해석을 제공합니다. 예를 들어 mobilization, accepted risk, addendum 등과 같은 용어가 수록되어 있어 해외 건설 프로젝트 실무에 필요한 기본 지식을 쉽게 이해할 수 있습니다. 이 자료는 건설 및 발전 분야 종사자뿐만 아니라 국제 에너지사업, 해외 계약 관리, 학술 연구 등에도 활용할 수 있는 기초 자료로, 남녀노소 누구나 전문적인 영문 용어를 쉽게 파악하는 데 도움을 줄 수 있습니다.
