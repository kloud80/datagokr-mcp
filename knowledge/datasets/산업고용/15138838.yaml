summary_user: 2025년 1월 1일부터 12월 31일까지 제주지역의 연료원별(태양광, 풍력, 바이오중유, LNG) 발전량을 거래일 하루 한 행, 1시부터 24시까지 시간대별 열로 담은 집계 파일이며 단위는 MWh이다. 분석가나 에너지 사업자가 '2025년 제주에서 태양광·풍력 발전량이 어느 시간대에 몰리고, LNG 발전이 이를 어떻게 메웠나'처럼 재생에너지 변동과 출력 패턴을 볼 때 쓴다. 전역 조인 키는 없어서 거래일(날짜)과 시간대를 기준으로 같은 기관의 SMP나 제주 연료원별 전력거래량 같은 전력시장 데이터와 맞춰 붙인다.
description_portal: "ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 \"전력시장 운영 업무\"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 \"전력계통 운영 업무\"등을 전담하고 있습니다.ㅇ 2025년1월1일부터 12월31일까지 제주지역 연료원별(태양광, 풍력, 바이오중유, LNG) 시간대별 발전량 데이터입니다.유류발전기 연료전환으로 인하여, 제주지역 유류발전기 미존재로 25년도 연료원에서 제외되었습니다.해당 데이터는 향후 제주 연료원별 전력거래량 데이터로 통합될 예정입니다.(단위 : MWh)* 본 데이터는 '한국전력거래소_제주발전기 연료원 시간대별 전력거래량' 파일 데이터로 통합됨에 따라 추후 삭제될 예정입니다. (20260819 이후)"
