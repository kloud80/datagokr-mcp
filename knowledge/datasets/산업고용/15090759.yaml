summary_user: 인천광역시 서구 관내 근로자 100인 이상 기업체를 한 행에 한 곳씩 회사명·공장 대표 도로명주소·생산품·전화번호와 함께 담은 시군구 단위 목록 파일입니다(CSV 약 7KB). 지역 일자리를 찾는 구직자나 협력 업체를 찾는 사업자, 지역 산업 구조를 보는 분석가가 '서구에 있는 대규모 제조 사업장은 어디이고 무엇을 만드는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 다른 기업 데이터와는 회사명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 사업자번호나 법인번호 같은 공통 식별자가 없어 다른 기업 데이터와 정확히 매칭하기 어렵고, 회사명·주소 표기 차이로 매칭이 어긋날 수 있다. 범위는 서구 한 곳에 한정되며, 근로자 수 자체는 필드에 없다.
