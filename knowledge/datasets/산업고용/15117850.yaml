description_portal: 본 데이터는 주요국의 소매 전기요금 가격지수를 월별로 제공하는 정보입니다. HEPI(Household Energy Price Index), EIA(미국 에너지정보청) 등 국제적으로 신뢰성 있는 에너지 통계 자료를 가공하여 미국, 영국, 독일, 프랑스, 스페인 등 주요국의 소매 전기요금 가격지수를 생성하였습니다. 데이터 구성 항목으로는 연월일, 미국, 유럽연합 27개국, 독일, 스페인 등 국가별 가격지수가 포함됩니다.2020년 6월 가격을 100으로 설정한 기준지수로, 각국 간 상대적 가격 변동을 비교할 수 있습니다. 본 데이터를 활용하면 각국의 소매 전기요금 등락 정도와 추이를 국제적으로 교차 비교할 수 있으며, 국내 전기요금 정책 수립, 국제 에너지 가격 동향 연구, 에너지 전환 정책 효과 분석, 에너지 복지 정책 마련, 가격 안정화 방안 수립에 참고자료로 활용할 수 있습니다.
