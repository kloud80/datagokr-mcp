summary_user: 한국장애인고용공단 보조공학기기 지원사업에서 다루는 보조공학기기 제품을 제품 한 건당 한 행으로 담은 목록이며, 장애유형·기구구분·품목명·제품명을 전국 단위의 비공간 정보로 제공한다. 장애인 근로자나 이들을 고용한 사업주가 "시각장애 직원에게 지원받을 수 있는 보조공학기기에는 어떤 제품이 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 장애유형이나 품목명 같은 이름을 맞추는 방식으로만 이을 수 있다.
description_portal: 한국장애인고용공단 장애인 보조공학기기 지원사업은 장애인 보조공학기기 지원은 장애인 고용촉진과 직업생활 안정을 도모하기 위하여 직업생활에 필요한 맞춤형 보조공학기기, 보조공학기기 구입 및 대여 비용을 지원하는 제도입니다.  해당 사업에 대한 상세 정보는 한국장애인고용공단 대표홈페이지(www.kead.or.kr) 혹은 장애인서비스신청포털(hub.kead.or.kr)에서 확인 가능합니다.해당 데이터는 한국장애인고용공단  보조공학기기 제품에 대한 실시간 정보 데이터로 장애유형, 기구구분, 품목명, 제품명 등의 항목들을 포함하고 있습니다.
