description_portal: 본 데이터는 국가 에너지 정책의 효과성과 시계열적 변화를 축적 및 분석하기 위해 선정된 주요 100대 에너지 통계자료에 대한 기본 정보를 제공합니다.이 통계는 정부, 공공기관 및 연구기관 등 다양한 기관에서 생산 및 관리하고 있는 에너지 소비, 생산, 효율, 환경 관련 주요 지표를 종합한 것으로, 국가 에너지 현황 및 추세 분석에 핵심적인 자료로 활용됩니다. 제공되는 항목은 통계명, 지표값, 연도, 최종 업데이트 일자, 출처, 기관명이며, 정책입안자와 연구기관은 이를 통해 정책의 장기적 효과 분석 및 에너지 소비·생산 트렌드 파악, 미래 에너지 정책 수립 및 연구 기초자료로 폭넓게 활용할 수 있습니다.
