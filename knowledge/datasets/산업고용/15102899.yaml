summary_user: 한국가스공사가 천연가스를 공급하는 발전사별 대상발전소와 이를 맡는 공급관리소, 공급 시작 연월, 발전용량(MW), 시간당 공급량(톤)을 발전소 단위 목록으로 담은 전국 범위의 작은 파일(csv 약 2.7KB)이다. 특정 발전소가 어느 가스공사 공급관리소에서 언제부터 천연가스를 받았고 용량 대비 공급 규모가 어느 정도인지 확인하려는 에너지 분석가나 발전사업자가 쓴다. 관리소명(관리소)이 조인 키여서 가스공사의 공급관리소 현황, 최초 가스공급 현황, 주배관 관련 자료와 관리소 기준으로 이어 쓴다.
description_portal: 한국가스공사의 주요사업인 천연가스의 안전하고 안정적인 공급사업과 관련하여, 천연가스를 공급하는 전국 26개 발전사별 대상발전소(49개소), 한국가스공사 사업소별 공급관리소 40개소 및 발전용량 등 천연가스 공급 현황자료입니다.시군구 단위 공급관리소 현황, 광역기초단위 설치현황, 수요처(발전, 도시가스) 현황, 한국가스공사에서 운영중인 지역본부별 수요처(발전, 도시가스) 현황, 지역본부별 주배관 및 기능별 관리소 현황, 주배관 구간별 가스주입 현황, 공급관리소별 최초 가스공급 현황 등 추가 자료는공공데이터로 등록된 자료를 참고하여 확인 가능합니다.
