summary_user: 전북특별자치도 남원시 관내 철거·구조물 해체 및 비계공사 업체를 업체 한 곳당 한 행으로 업체명, 도로명·지번주소, 전화번호, 데이터기준일자와 함께 담은 작은 CSV 파일(1,513바이트)이다. 남원시에서 건물 철거나 해체 공사를 계획하는 시민·사업자가 '관내에 어떤 철거업체가 있고 연락처는 무엇인가'를 찾거나, 발주기관이 협력업체 후보를 조회할 때 쓴다. 사업자번호나 업체 코드 같은 전역 조인 키가 없어서 다른 데이터와는 업체명이나 주소를 직접 맞춰서만 이을 수 있고, 지방행정 인허가(LOCALDATA) 건설업 원장과 연결할 때도 이름·주소 매칭에 의존한다.
description_portal: 1. 데이터 주요 내용 및 목적전북특별자치도 남원시의 철거 및 구조물 해체 관련 업체 현황을 담은 데이터입니다.노후 건축물 증가와 도시 재생 사업 확대에 따라 철거·해체 공사의 수요가 지속되고 있으며, 시공업체 정보의 공개적 접근성 확보가 안전 관리와 행정 투명성 측면에서 요구되고 있습니다.본 데이터는 남원시 관내 철거 및 비계공사 업체의 기본 현황(명칭, 소재지, 연락처)으로 구성되어 있으며, 건설공사 발주·입찰 참고 및 민원 안내 목적으로 활용될 수 있습니다.2. 데이터 항목명업체명, 도로명주소, 지번주소, 전화번호3. 기대효과건물 철거 또는 구조물 해체 공사를 계획하는 시민·사업자가 관내 업체 정보에 직접 접근할 수 있어 별도 문의 없이 업체 탐색이 가능합니다. 공공 발주기관과 민간 건설사는 본 데이터를 입찰 참고자료나 협력업체 조회에 활용할 수 있으며, 지역 내 건설 관련 업체 분포 분석에도 이용될 수 있습니다.
