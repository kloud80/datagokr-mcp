summary_user: '가맹사업 관련 항목을 구분(시도·업종·산업·공통·설문·가맹본사정보·게시판 등)별로 코드와 한글 명칭으로 짝지은 기준 코드표로, 건별 사업 원장이 아니라 구분·코드·코드값 세 항목만 담는다. 가맹정보제공시스템의 다른 테이블을 분석하는 사람이 업종·시도·설문 응답 등의 코드값을 한글 명칭으로 풀어 읽을 때 쓴다(예: 이 업종 코드는 어떤 업종인가). 실측 컬럼에 전역 조인 키는 없어서, 같은 체계의 가맹사업 데이터와는 구분과 코드(cd)를 맞춰 붙이는 방식으로만 이어 쓴다.'
description_portal: 이 데이터는 가맹사업 관련 다양한 분야의 항목에 대해 코드화된 기준 정보를 제공하는 표준 코드 데이터입니다. "구분", "코드", "코드값"의 세 항목으로 구성되어 있으며, "구분" 항목은 데이터의 유형을 나타내며 시도, 업종, 산업, 공통, 설문, 가맹본사정보, 게시판 등으로 나뉘어 있습니다. "코드"는 항목별로 부여된 식별자이며, "코드값"은 이에 대응하는 한글 명칭입니다. 본 데이터는 가맹사업 운영 및 분석에 필요한 기준정보를 제공함으로써, 다양한 데이터 간의 연계 및 통합을 가능하게 하고, 데이터 활용의 일관성과 정확성을 높이는 데 기여합니다. 특히 업종별 분석, 가맹본사 통계, 설문지 구성, 지역별 사업 분포 조사, 게시판 분류 관리 등 다양한 행정 및 정책적 활용이 가능합니다. 가맹정보제공시스템의 다른 테이블을 분석하는데 이용할 수 있습니다.
