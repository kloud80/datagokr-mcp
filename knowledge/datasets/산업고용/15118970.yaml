summary_user: 한국석유관리원에 등록된 액화석유가스(프로판·부탄) 수출입업체를 업체별로 담은 등록 현황 파일로, 업소명·시도·시군구·세부주소·전화번호를 담으며 전국 범위이고 파일 크기는 393바이트로 매우 작다. LPG 수입·수출을 하는 등록 업체가 어디에 몇 곳 있는지, 특정 업체의 소재지와 연락처를 확인하려는 사업자나 분석가가 쓴다. 전역 조인 키는 없어서 시도·시군구 이름이나 업소명을 맞춰 다른 LPG·석유 사업자 현황과 이어 써야 한다.
limits: 업체 등록번호나 사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 업소명·지역명 문자열 매칭에 의존해야 한다. 수출입 물량이나 가격 정보는 없고 등록 업체 목록만 담는다.
