description_portal: 1. 액화석유가스란 프로판이나 부탄을 주성분으로 한 가스를 액화한 것으로 액화석유가스 수출입업을 등록하려는 자는 액화석유가스의 안전관리 및 사업법 제17조에 따라 산업통상자원부장관령으로 정하는 바에 따라 산업통상자원부장관에게 등록하여야 한다.2. 액화석유가스 수출입업을 하려는 자는 산업통상자원부령으로 정하는 바에 따라 산업통상자원부장관에게 등록하여야 하며, 액화석유가스의 최초 수입통관 예정일 30일 전에 별지제20호서식의 액화석유가스 수출입업 등록신청서에 사업계획서, 수입대행계약서를 첨부하여 석유 및 석유대체연료 사업법 제25조의2에 따른 한국석유관리원에 제출하여야 한다.
