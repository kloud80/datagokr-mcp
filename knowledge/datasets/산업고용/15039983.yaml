summary_user: 양평군 관내에서 태양광 발전사업 허가를 받은 발전소를 한 곳씩 담은 건별 원장 파일(csv, 약 79KB)로, 시설명·도로명/지번 주소·설비용량·공급전압·주파수·설치연도·허가기관·가동상태를 담는다. 양평군 안에서 어느 읍면에 태양광 발전소가 몰려 있고 설비용량 규모와 가동 여부가 어떤지 알아보려는 주민·발전사업자·에너지 정책 분석가가 쓴다. 전역 조인 키는 없어 주소를 기준으로 행정구역에 매핑하거나 전국태양광발전소전기사업허가정보표준데이터와 시설명·주소로 대조해 이어 쓴다.
description_portal: 양평관내 태양광발전소 위치 및 설비용량 등에 대한 데이터로 용도, 세부용도, 사업상태, 발전소명 등의 정보를 제공합니다.이 데이터는 태양광발전소 전기사업에 대해 허가받은 시설의 정보를 담고 있으며, 발전소 명칭, 설치 주소, 설비용량(KW), 공급전압(V), 주파수(Hz), 설치연도,  허가기관, 가동상태 등의 항목으로 구성되어 있습니다. 데이터는 각 발전소의 운영 현황을 파악하고, 에너지 공급 기반 구축, 재생에너지 확산 정책 수립, 발전소 입지 분석 등에 활용될 수 있습니다. 특히 위도 및 경도 정보는 위치 기반 시각화나 공간적 분포 분석에 적합하며, 설비용량 및 설치연도 정보는 발전소의 규모 및 최신성 평가에 활용됩니다. 본 데이터는 에너지 관련 산업계, 정책기관, 연구기관 등에서 신재생에너지 기반 확충과 관련된 다양한 의사결정 자료로 활용될 수 있습니다.
