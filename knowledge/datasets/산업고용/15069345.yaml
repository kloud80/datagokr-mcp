summary_user: 화력발전기(화석연료)의 전력시장 거래 발전량을 거래일자·광역시도·연료원별로 일별 집계해 MWh 단위로 담은 파일 데이터이며, 범위는 전국이다. 에너지 분석가가 특정 지역의 석탄·LNG 등 연료원별 화력발전량이 일별로 어떻게 달라지는지 확인하는 데 쓴다. 전역 조인 키는 없어서 지역명·연료원 이름을 맞춰 같은 기관의 다른 발전량·수급 데이터와 이어 쓴다.
description_portal: '해당 목록은 화력발전기 화석연료에 해당하는 발전기의 발전량(전력거래량)을 일별, 광역시도별로 제공하고 있습니다.- 항목 : 거래일자, 지역, 연료원, 발전량- 단위 : MWh※ 발전량(전력거래량)은 전력시장에 참여하는 전력거래량을 의미하며 전기사업법 시행령 제19조 제1항 제2호에 따라 한국전력공사와 직접 거래하는 발전기의 발전량은 포함되지 않습니다.발전량(전력거래량)은 소내용 및 주변압기 손실분 등을 제외한 송전단 기준 발전량입니다.본 자료는 확정되지 않은 잠정치를 포함하였으며, 추후 수정정산에 의해 변경될 수 있습니다.'
