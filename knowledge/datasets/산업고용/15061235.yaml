summary_user: 일반 건축물(내진2등급·1등급·특등급 시설물)과 한국수력원자력 원자력발전소(고리·월성·한빛·한울·신고리 3~6호기·신한울 1·2호기)의 설계지진력(g)과 설계개념을 구분·구조물 종류별로 나란히 정리한 소규모 비교표로, 605바이트 CSV 파일 한 개입니다. 원전 내진 안전성을 설명하려는 국민·교육자·기자가 '원자력발전소는 아파트나 병원보다 지진에 얼마나 강하게 설계되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소 이름이나 시설물 종류 이름을 손으로 맞춰 연결해야 합니다.
description_portal: 한국수력원자력㈜이 공개하는 일반시설물과 원자력발전소 내진설계 비교 데이터는 다양한 시설물의 내진 등급별 설계 기준과 원자력발전소의 내진 설계지진력을 비교할 수 있도록 구성된 자료입니다. 이 데이터에서는 내진2등급 시설물로 분류되는 4층 이하 숙박시설, 아파트, 오피스텔과 내진1등급 시설물인 5층 이상 숙박시설, 공연장, 전시장, 그리고 내진특등급 시설물에 해당하는 병원, 방송국, 소방서, 청사 등의 설계지진력을 확인할 수 있습니다. 또한 한국수력원자력이 운영 및 건설 중인 원자력발전소인 고리, 월성, 한빛, 한울, 신고리 3·4·5·6호기, 신한울 1·2호기의 내진설계 기준을 함께 제공하여 일반 건축물과 원자력발전소의 안전성 차이를 객관적으로 비교할 수 있습니다. 이 자료는 원자력발전소의 내진 안전성이 일반 시설물에 비해 얼마나 강화되어 있는지 이해하는 데 중요한 참고자료로 활용될 수 있습니다.
