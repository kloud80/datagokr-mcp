description_portal: 경상남도 남해군 공사대장 하자관리 현황 데이터입니다. 공사대장관리시스템에서 추출되는 데이터입니다.  개방 데이터항목으로는 공사명, 하자기간(년), 시작일자(준공검사일), 마지막일자, 보증율, 하자보증 공종에 대한 자료를 제공합니다. 현재 기준으로 추출된 계약년도 2024년의 대한 데이터 이오니 참고하시기 바랍니다. ‘공사명’은 해당 공사의 명칭을 나타내며, ‘하자기간(년)’은 공사 완료 후 하자보수 책임이 유지되는 기간을 연 단위로 표시합니다. ‘시작일자(준공검사일)’는 공사가 준공되어 검사를 통과한 날짜를 의미하며, ‘마지막일자’는 하자보증 기간이 종료되는 날을 나타냅니다. ‘보증율’은 계약금액 대비 하자보증금 비율을 의미하고, ‘하자보증 공종’은 보증이 적용되는 세부 공사 종류를 구분합니다. 이 데이터는 시설물 관리, 유지보수 계획 수립, 계약 관리 등 다양한 행정 및 관리 업무에 활용될 수 있습니다.
