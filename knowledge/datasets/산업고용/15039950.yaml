description_portal: 본 공공데이터는 인천광역시 서구에 소재한 계량기업의 정보를 수록한 자료입니다. 본 자료는 인천광역시 서구 내 계량기업의 상호명, 주소, 업종 분류 및 기준일자를 포함하고 있습니다. 계량기업은 산업 전반에 걸쳐 정밀 측정이 요구되는 분야에 중요한 역할을 하고 있습니다. 본 데이터를 통해 인천광역시 서구 내 계량기기 제조산업의 분포와 현황을 파악하는데 활용할 수 있습니다. 또한 관련 산업지원 대상 선별 등 행정적 근거자료로 쓰일 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
