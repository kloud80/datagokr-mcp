description_portal: '○ 통계개요* 승인통계명 : 서울특별시복지실태조사(Seoul Welfare Panel Study)* 통계종류 : 일반ㆍ조사통계(승인201013)* 작성목적 : 서울시민 삶의 질적 수준, 복지 수요, 복지서비스 이용실태 등을 파악하여 서울시 복지정책 수립을 위한 기초자료 제공* 조사대상 : 조사기준 현재 서울시 소재 일반주거시설에 거주하는 모든 가구(※ 기숙시설 및 사회시설 등 제외)* 조사방법 : 가구방문 면접조사* 표본추출 방법 : 등록센서스 조사구 추출? 2018년 등록센서스의 아파트 및 보통조사구만 대상으로 5개권역, 25개 구별 층화? 표본조사구(PSU) 추출 : 확률비례계통추출? 표본가구(USU)추출 : 계통추출* 조사내용 : 7개 항목 278개 문항? (A.가구일반사항) 이름 등 34개 항목? (B.경제활동) 근로능력 정도 등 26개 항목? (C.건강과 의료 이용) 건강상태 등 45개 항목? (D.식생활) 식생활 형편 등 7개 항목? (E.사회적 관계 및 활동) 만남 및 연락빈도 등 26개 항목? (F.복지서비스 이용) 기초생활보장급여 신청 경험 등 총 111개 항목? (G.복지의식 및 욕구) 생활만족도 등 29개 항목* 조사체계 : 서울시 ⇔ 서울연구원 ⇔ 용역기관 ⇔ 가구* 작성주기 : 2년* 통계간행물명 : 서울시 복지실태조사* 공표범위 : 서울시 25개 자치구별, 권역별* 공표방법 : 간행물, 인터넷 등○ 기타* 관련 URL : https://news.seoul.go.kr/welfare/?p=530461'
