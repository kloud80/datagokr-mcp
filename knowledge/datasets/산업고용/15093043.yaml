description_portal: 한국남동발전의 환경화학시스템 내 환경성과평가 지표 정보입니다. 지표그룹에 따른 지표내역, 지표내용 등의 데이터를 포함하고 있습니다.지표그룹은 4개로 구분되어 있으며 환경여건지표(ECI, Environmental Condition Indicator) 국가 혹은 범지구적 차원의 환경여건에 관한 정보를 제공하는 지표, 경영성과지표(MPI, Management Performance Indicator) 환경성과 개선을 위한 경영자의 노력, 의사결정 및 조치를 지원하는 지표, 운영성과지표(OPI, Operational Performance Indicator) 조직의 운영부문으로부터 발생하는 투입물 및 산출물과 관련한 지표, 기업성과지표(CPI) 등으로 구분되어 있습니다.각 지표별 단위와 상세 내용을 포함하여 기관의 다각적인 환경경영 노력을 종합적으로 분석하고 평가할 수 있습니다.
