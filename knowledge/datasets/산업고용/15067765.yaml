summary_user: 전국 폐광산 실태조사 결과를 조사년도·지역(시도 등)별로 묶어 폐광 개수와 운영상태를 담은 집계 파일이며, 건별 광산 원장이 아니라 약 3KB 규모의 CSV 총괄표다. 광해방지 정책 담당자나 지역 분석가가 '우리 지역에 폐광산이 몇 곳이고 상태는 어떤가'를 지역 간에 비교할 때 쓴다. 전역 조인 키가 없어 지역 이름을 행정구역 코드에 직접 맞추거나, 같은 기관의 폐광산·광해 관련 데이터와 지역명으로 이어 써야 한다.
description_portal: 한국광해광업공단은 광산개발 과정과 폐광 이후 2차 오염 등으로 발생하는 광해를 분석·예방하고 제거하는 광해방지 사업을 실시합니다. 폐석·광물찌꺼기 등 오염원을 차단하고 오염토양 복원, 수질개선, 지반침하 방지 등 광해복구로 자연환경을 깨끗하게 보전하는 동시에 지역주민의 삶의 질을 향상하는 것을 목표로 하고 있습니다.이와 관련, 전국 폐광산 실태조사 결과를 개방 및 공개합니다.또한, 본 데이터셋은 지역별로 분류되어 있어  폐광산의 실태를 상세히 파악할 수 있습니다. 이를 통해 지역별 특성에 맞는 맞춤형 광해방지 정책 수립에 활용될 수 있습니다.
