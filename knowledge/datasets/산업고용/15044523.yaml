summary_user: 한국동서발전 동해화력본부의 연도별 전기 판매 실적을 담은 소규모 집계 파일(csv, 317 bytes)로, 화력과 바이오매스 각각의 전기판매량과 판매수익을 연도 단위로 담는다. 연구자나 분석가가 동해화력의 화력 대비 바이오매스 발전의 판매량·수익 추이를 비교해 바이오매스 발전의 수익성을 따져볼 때 쓴다. 전역 조인 키는 없어 연도 기준으로 같은 기관(한국동서발전)의 다른 발전소 실적 자료나 전력시장 통계와 이름을 맞춰 연결해야 한다.
