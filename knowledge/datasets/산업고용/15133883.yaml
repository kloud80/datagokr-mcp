description_portal: 2019~2024년 성실경영평가 월별 평가현황 자료를 공공에 제공하여 재도전 기업 관련 통계 구축 및 재창업 활성화에 기여함이 목적인 데이터입니다.성실경영평가 제도는 재창업 전 분식회계, 고의부도, 부당해고 등을 하지 않고 성실하게 경영하였는지 여부를 평가하여 재창업 지원 대상자 선별에 활용하는 제도입니다.해당 데이터는 월별로 성실경영평가를 수행하여 신청인 등에게 평가결과를 통보한 평가일 기준으로 추출한 자료이며, 평가 신청일과는 상이한 내용이오니 자료활용에 참고 부탁드립니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.
