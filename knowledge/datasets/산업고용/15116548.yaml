summary_user: 한수원이 가동원전 구조물 보수공사(콘크리트 균열보수, Seismic Gap 보수, 방호도장 보수, 폼타이홀·볼트홀 보수, 선택과업 등) 예산 산정용으로 만든 자체 품셈을 업무구분별 단위·인력·수량으로 담은 작은 CSV 파일(약 3KB)이다. 원전 구조물 보수공사를 설계·발주하거나 입찰을 준비하는 사업자가 '균열 주입 보수 한 단위에 인력이 얼마나 드는가' 같은 공사비 산정 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업무구분 이름을 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 가동원전 구조물 보수에 적합한 표준품셈(건설기술연구원) 부재 대응 및 적절한 보수공사 예산산정 시 설계기준 공고 개방항목으로는 콘크리트 균열보수(주입, 충전, 표면처리, 단면복구), Seismic Gap 보수, 방호도장 보수(페이트면 긁어내기, 바탕만들기,에폭시페인트칠, CLP 표면처리 및 도장, CLP외 철재면 페인트칠), SLMS 입력, 폼타이홀 보수, 볼트홀 보수, 선택과업(뚜껑제거 및 설치, 실리콘제거 및 설치, 안전휀스 설치 및 설치, 밀폐환경 측정, 내부육안점검, 체인블럭 운용, 상태 및 위치점검, 방호교육 및 신체검사, 작업전회의 및 안전교육, 콘크리트 부직포 양생 등) 품질관리비 적용 한수원 자체 품셈으로 설계기준서 작성에 활용
