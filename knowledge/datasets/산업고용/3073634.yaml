description_portal: ‘사업장현황(전체)’ 통계는 고용보험에 가입된 성립 중인 전체 사업장의 월말 기준 현황을 집계한 자료로, 지역·규모·산업분류별 사업장 분포를 파악할 수 있는 기초 통계입니다. 해당 통계는 일괄유기 및 일괄계속 사업장을 제외하고, 고용보험 자격이 유지 중인 사업장만 포함되며, 시도·시군구별 소재지, 상시근로자 수에 따른 규모(중분류 포함), 산업의 대·중·소분류 항목을 기준으로 세분화됩니다. 수치는 해당 월 말일 기준으로만 활용해야 하며, 여러 달 수치를 단순 합산하는 것은 적절하지 않습니다. 본 통계는 지역별 고용 기반 분석, 산업 구조 변화 파악, 노동시장 안정성 평가 등에 활용되며, 최근 수치가 크게 증가한 점에 유의해 해석할 필요가 있습니다.
