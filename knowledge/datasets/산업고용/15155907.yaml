summary_user: 한국남동발전의 영흥·삼천포·분당·영동·여수 발전소에 속한 화력·복합 발전기와 태양광·풍력·소수력 등 신재생 발전기를 발전기 한 대당 한 행으로 정리한 목록으로, 최대용량·계량발전기명·연료·지역을 담는 소형 파일(약 3.8KB CSV)이다. 분석가나 에너지 연구자가 '남동발전의 어느 발전소에 어떤 연료의 발전기가 몇 MW 규모로 있고, 전력계량 자료에서는 어떤 이름으로 잡히는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 발전·계량 데이터와는 발전소명·발전기명·지역 같은 이름 매칭이나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: 한국남동발전 계량취득 발전기 현황 데이터입니다.영흥발전소, 삼천포발전소, 분당발전소, 영동발전소, 여수발전소 화력, 복합 발전기 및 각 발전소에 속해 있는태양광, 풍력, 소수력 등 신재생발전기에 대한 계량취득 발전기 현황 자료입니다.순번, 발전소명, 발전기명, 최대용량, 계량발전기명, 연료, 지역으로 컬럼이 구분되어 있으며각 발전소 당 발전기에 해당되는 최대용량 및 계량발전기명을 확인 할 수 있습니다.해당 자료를 통하여 발전소의 전력계량 자료를 참고할 수 있으며 지역별 전력계량 통계자료로 활용 할 수 있습니다.
