summary_user: 한국지역난방공사가 운영하는 배전설비에서 전기를 공급받는 사용자의 계약을 건별로 담은 파일로, 관리번호·계약 종류(주택용일반, 가로등 등)·공급 시작 일자·서비스 상태를 담는다(csv 약 7KB 규모). 분석가나 에너지 사업자가 지역난방공사 배전망의 전기사용자가 어떤 계약종별로 구성돼 있고 언제부터 공급이 시작됐는지 파악하는 데 쓴다. 이어 쓸 수 있는 키는 공사 내부 관리번호(elec_customer_mgmt_no)뿐이고 지역 정보가 없는 비공간 자료여서, 한전 계약종별 전력사용량 같은 지역×월 자료와는 계약 종류를 기준으로 느슨하게 비교하는 수준에 그친다.
