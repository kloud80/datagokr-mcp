description_portal: 본 데이터는 전북특별자치도 익산시에서 발행하는 다이로움 카드 발행 현황을 체계적으로 정리한 자료이다. 다이로움(익산사랑상품권)은 지역공동체 강화와 지역경제 활성화를 위해 익산시장이 발행하고 익산 내에서만 사용 가능한 익산사랑상품권으로, 해당 데이터는 연도별 가입자 수, 발행액, 결제이용액 등의 자료를 제공하고 있다. 해당 자료를 통해 지역 내 소상공인 및 중소기업 등 상권을 분석하는 기초 자료로 활용 가능하다. 또한, 데이터는 정기적으로 갱신되어 최신 현황을 반영하며, 익산시 지역화폐 이용자의 이용 패턴과 경제적 파급 효과에 관한 분석자료로도 이용가능하다.
