description_portal: '서울시 사업체조사 결과매년 서울 소재 종사자 1인 이상 전 사업체 조사하여 산업구조 및 변화 파악, 사업체 분야 통계조사의 모집단 정보 제공 - 법적근거 : 통계법 제15조, 제17조 및 제18조 (승인번호 제20105호) - 조사연혁 : 1994년에 제1회 조사를 실시하였으며, 2011년 조사는 제18회 조사 - 조사주기 : 연간조사로서 매년 조사를 실시 - 조사단위 : 일정한 물리적 장소에서 재화의 생산 및 판매, 서비스제공 등 산업활동을 영위하고 있는 종사자 1인 이상의 모든 사업체 - 조사방법 : 임시조사원이 사업체를 방문하여 응답자와 면접조사(인터넷조사 병행)'
