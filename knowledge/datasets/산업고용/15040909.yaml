description_portal: 에너지원별 에너지 소비량'은 한국가스공사의 에너지원별 에너지 소비량을 체계적으로 정리한 것입니다. 에너지 소비 구조 분석 및 에너지 전환 전략 수립, 탄소중립 로드맵 이행, 에너지 효율 개선을 목적으로 수집되었습니다. 데이터 구성항목은 연도, 에너지용도로 구매 및 소비된 비재생 에너지 연료(MWh), 비재생 구매 전력(MWh), 스팀/난방/냉방 및 기타 에너지 구매(MWh), 재생에너지 구매 또는 생산(MWh), 총 비재생 에너지 소비(MWh) 등으로 이루어져 있어 에너지원별 소비 구조를 상세히 파악할 수 있습니다. 본 데이터를 활용하면 에너지원별 소비 비중 분석, 재생에너지 전환율 추이 파악, 에너지 효율성 평가, 비재생에너지 의존도 분석이 가능합니다. 탄소중립 로드맵 이행 모니터링, ESG 보고 자료 작성, 에너지 비용 최적화 전략 수립, 친환경 에너지 전환 계획 수립에 활용되어 운영 효율 제고와 생산성 향상에 크게 기여합니다.
