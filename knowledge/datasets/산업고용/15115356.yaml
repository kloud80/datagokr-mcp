summary_user: 서울 강남구의 대형마트·백화점·쇼핑센터·복합쇼핑몰 등 대규모점포를 업소 1곳당 1행으로 담은 인허가 원장이며, 관리번호·인허가일자·영업상태(영업/폐업)·휴업·재개업일자·주소·사업장명·업태·좌표를 포함한다. 상권 분석가나 유통 사업자가 '강남구에서 현재 영업 중인 대규모점포는 어디이고 언제 인허가·폐업했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결하며, 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 원장과 대조하는 용도에 맞다.
