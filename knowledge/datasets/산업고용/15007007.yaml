summary_user: 부산광역시 강서구 관내에서 작성일 기준 영업 중인 공중위생업 업소를 한 곳씩 담은 목록으로, 업종명·업소명·도로명 영업소 주소·전화번호를 CSV 파일(약 64KB)로 제공한다. 강서구 주민이나 사업자가 '우리 동네에서 영업 중인 미용실·목욕장·세탁소 같은 공중위생업소가 어디 있고 연락처가 무엇인가'를 확인하거나, 분석가가 구 단위 업종별 업소 분포를 볼 때 쓴다. 전역 조인 키(사업자번호·관리번호 등)가 없어 다른 데이터와는 도로명 주소나 업소명 매칭으로만 잇고, 지방행정 인허가(LOCALDATA) 공중위생업 원장과 대조할 때도 같은 방식으로 맞춘다.
description_portal: '부산광역시 강서구 관내 공중위생업 업소 현황(업종명, 업소명, 영업소 주소(도로명), 소재지 전화) 자료를 제공합니다.(작성일 기준으로 영업중인 공중위생업 업소를 기준으로 합니다.)1. 업종명 : 부산광역시 강서구 관내 공중위생업 업소의 업종명입니다.2. 업소명 : 부산광역시 강서구 관내 공중위생업 업소의 업소명입니다.3. 영업소 주소(도로명) : 부산광역시 강서구 관내 공중위생업 업소의 영업소 주소(도로명 주소)입니다.4. 소재지전화 : 부산광역시 강서구 관내 공중위생업 업소의 영업소의 전화번호입니다.'
