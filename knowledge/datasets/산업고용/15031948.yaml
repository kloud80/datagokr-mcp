summary_user: 고용노동부·고용센터가 여는 채용행사(구인구직 만남의 날, 채용대행서비스, 동행면접, 채용박람회)를 행사 한 건 단위로 담으며, 목록과 상세(행사명·기간·장소·참여기업 구인정보·문의처 등)로 나눠 전국 범위를 제공한다. 구직자가 "우리 지역에서 이번 달 열리는 채용박람회나 만남의 날이 언제, 어디서 있고 어떤 기업이 참여하나"를 확인하거나, 지자체·취업지원기관이 행사 일정을 안내 서비스에 띄울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역코드(areaCd)·지역명이나 기업명 같은 이름 매핑으로만 느슨하게 연결하고, 행사 번호(eventNo)는 같은 API의 목록과 상세를 잇는 데만 쓴다.
description_portal: '[채용정보 API -  채용행사목록 및 상세정보] 채용행사 API를 활용해서 고용노동부/고용센터의 다양한 채용행사를 구성할 수 있습니다.고용노동부에서 제공하는 채용행사(구인구직 만남의날,채용대행서비스,동행면접,채용박람회)정보를 서비스로 제공합니다. 목록 및 상세 형태로 제공하고 있으며 채용행사는 워크넷에서도 확인이 가능합니다.2025년 2월 11일부터 개인도 신청 및 이용이 가능합니다.<API 사용법>인증키, 호출할 페이지 타입, xml 지정, 지역, 채용행사 번호 등을 파라미터로 받아 행사명, 행사기간, 행사장소, 참여기업구인정보, 부대사항, 문의전화, 팩스, 담당자, 이메일, 오시는길 등의 결과를 제공합니다.  * 유의사항:  문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
