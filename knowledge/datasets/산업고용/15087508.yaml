summary_user: 근로복지공단 관할지사별로 코로나19 관련 산재 신청의 전체·승인·불승인 건수와 사망 사건의 전체·승인·불승인 건수를 집계한 작은 CSV 통계(1,556바이트)다. 노동·보건 분석가가 지사별 코로나19 산재 승인율과 사망 승인율이 어떻게 다른지 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 관할지사 이름을 직접 맞추거나 같은 기관 자료와 이름으로만 이어 쓴다.
description_portal: 이 데이터는 근로복지공단에서 처리된 코로나19 관련 산업재해 현황을 지사별로 집계한 통계 자료입니다. 각 지사별로 전체 신청 건수, 승인 건수, 불승인 건수는 물론, 특히 중요한 지표인 전체 사망 건수, 사망 승인 건수, 사망 불승인 건수 정보를 제공합니다. 이 자료는 코로나19라는 특수하고 전례 없는 재난 상황에서 업무상 질병으로서의 산재 인정 현황을 투명하게 보여주며, 특히 의료 및 보건 종사자 등 감염 위험 직군에 대한 사회 안전망의 작동 실태를 파악하는 데 필수적인 근거 자료라고 판단됩니다.본 데이터는 감염병 대응 정책 및 공공 보건 안전망 연구에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 지역별, 직업별 코로나19 산재 승인율과 사망 승인율을 분석함으로써, 감염병 관련 재해의 주요 발생 원인과 취약 지역을 진단할 수 있습니다. 이를 통해 향후 신종 감염병 발생 시 근로자를 보호하기 위한 산재보험 제도의 보상 기준 및 행정 처리의 신속성을 개선하고, 의료 인력 등 필수 인력에 대한 안전 관리 지원책을 강화하는 데 활용할 수 있습니다. 또한, 이 통계는 공공기관의 재난 대응 행정의 공정성과 형평성을 평가하는 데 기여할 수 있다고 판단됩니다.
