summary_user: 전국 시군구별로 공용 급속충전기 설치 대수를 정격용량(50kW, 100kW, 100kW 듀얼, 200kW 듀얼, 300kW 이상)으로 나눠 집계하고, 지역별 충전 사용량(kWh)을 함께 담은 CSV 파일이다. 지자체·충전사업자·분석가가 '우리 시군구에는 고용량 급속충전기가 몇 대 있고 실제 사용량은 얼마인가'를 보고 충전기 증설 지역이나 신규 입지를 고를 때 쓴다. 전역 조인 키가 없어 광역지자체·시군구 이름을 행정구역 코드에 매핑해야 전기차 등록 현황이나 지역별 에너지 사용량 같은 시군구 단위 통계와 이을 수 있다.
description_portal: 본 데이터는 전기차 이용자의 편의성을 높이고 충전 인프라의 효율적 배치를 지원하기 위해 지역별로 공용 급속충전기 설치 현황을 상세하게 제공합니다. 충전기의 설치 위치는 광역지자체 및 시군구 단위로 구분하여 제공되며, 충전기의 정격용량별(50kW, 100kW, 100kW 듀얼, 200kW 듀얼, 300kW 이상) 설치 대수와 실제 충전기 이용량(킬로와트시)까지 포함하고 있습니다. 이를 통해 정부와 지자체는 지역별 전기차 충전 수요와 공급 실태를 파악하여 충전 인프라 확대 및 배치 전략 수립에 활용할 수 있으며, 기업 및 연구기관은 충전 인프라 분석과 신규 설치 최적 입지 선정, 충전 서비스 개선 전략 마련 및 효율적인 에너지 이용 연구 등의 기초자료로 활용할 수 있습니다.
