summary_user: 경상남도가 허가한 발전용량 1,000kW 초과 3,000kW 이하 태양광 등 발전사업을 사업 건별로 담은 파일(csv, 약 17KB)로, 허가일자·상호·설비용량·설치장소·사업개시일을 담는다. 경남 지역에 중규모 태양광 발전소가 어디에 얼마나 허가되고 언제 사업을 시작했는지 확인하려는 사업자·분석가가 쓴다. 전역 조인 키가 없어 설치장소 주소나 상호를 이름 매핑해 전국태양광발전소전기사업허가정보 표준데이터 등과 맞춰 쓴다.
description_portal: 경상남도는 발전용량이 1,000KW 초과 3,000KW 이하인 태양광 등 발전사업 허가 현황에 관한 데이터를 제공합니다. 이 데이터는 허가일자, 상호, 설비용량, 설치장소, 사업개시일 등의 정보를 포함하고 있습니다. 이를 통해 각 발전사업의 허가일자와 에너지원별 발전 용량을 파악할 수 있으며, 설치장소와 사업개시일을 통해 지역별 발전소 현황을 효율적으로 모니터링할 수 있습니다. 또한, 이 정보는 경상남도의 에너지 정책 수립과 발전사업 활성화에 중요한 기초 자료로 활용되어, 태양광 발전 확대 및 지역별 에너지 전환 전략에 기여할 수 있습니다.
