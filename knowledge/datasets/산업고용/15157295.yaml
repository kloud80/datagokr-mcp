summary_user: 전국 전기공사업 등록업체를 업체 한 곳당 한 행으로 담은 건별 목록으로, 등록번호·상호·대표자·우편번호·소재지·상세주소를 싣고 검증 시 22,181행을 받았다. 전기공사를 맡길 업체가 등록업체인지, 특정 지역에 어떤 업체가 있는지 확인하려는 발주자나 분석가가 쓴다. 소재지·상세주소(address) 키로 주소를 쓰는 다른 인허가·사업장 데이터와 이어 쓰며, 그 밖의 별도 업체 식별 키는 필드에 없다.
description_portal: 'ㅇ 전기공사업합정보시스템에서 전국 전기공사업 등록업체 리스트 확인가능ㅇ 전기공사업법에 제4조제1항에 따라 공사업을 하려는 자는 기후에너지환경부령으로 정하는 바에 따라 주된 영업소의 소재지를 관할하는 특별시장.광역시장.특별자치시장.도지사 또는 특별자치도지사에게 등록ㅇ 전기공사업 등록을 하려는 자는 법령에서 정한 기술능력 및 자본금 등을 갖추어야 함ㅇ 전기공사업을 등록하려는 자는 전기공사업법령에서 정한 다음 서류를 첨부하여 한국전기공사협회에 제출- 신청인의 인적사항이 적힌 서류- 기업진단보고서- 전기공사업법 시행령 제6조제1항제2호에 따른 확인서- 전기공사업법 제2조제9호에 따른 전기공사기술자(이하 “전기공사기술자”라 한다)의 명단과 제12조의2제6항에 따른 해당 전기공사기술자 경력증 사본- 사무실 사용 관련 서류: 임대차계약서 사본(임대차인 경우만 해당한다)- 외국인이 전기공사업의 등록을 신청하는 경우에는 해당 국가에서 신청인(법인의 경우에는 대표자를 말한다)이 법 제5조 각 호의 결격사유와 같거나 비슷한 사유에 해당되지 아니함을 확인한 확인서'
