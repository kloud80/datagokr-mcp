summary_user: 경상남도가 도내 중소기업과 농·수·축산업자의 우수상품을 추천상품(QC)으로 지정한 현황을 업체·지정품목별 한 행으로 담은 파일로, 시군·업체명·주소·연락처·지정번호·지정일자를 포함한다. 소비자나 유통·판로 담당자가 "우리 시군에 경남 추천상품으로 지정된 업체와 품목이 무엇인가"를 확인하거나, 분석가가 시군별·품목별 지정 분포를 볼 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명·주소나 시군 이름을 맞춰 연결해야 한다.
description_portal: '경상남도 추천상품(QC) 지정현황으로 시군, 품목, 업체명, 주소, 연락처, 지정품목, 지정번호, 지정일자 등에 대한 정보를 제공합니다.*기타유의사항 : 일반전화 항목의 데이터를 제공하지 경우는  휴대폰 번호로 개인정보로 제공하지 양해 바랍니다.경상남도에서는 도내 중소기업 및 농·수·축산업자가 생산한 우수상품을 경상남도 추천상품(QC)으로 지정·관리하여 생산자 소득 증대 및 국내·외 판로 개척에 기여하고자 합니다.매년 상·하반기 경상남도 추천상품(QC)을 지정하고 있으며 유효기간은 2년입니다.'
