description_portal: '○ 통계개요* 통계명 : 다단계 판매업체 현황* 통계종류 : 서울시 다단계 판매업체 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「방문판매등에관한법률」에 근거하여 다단계 판매로 등록된 업체* 작성목적 : 다단계 판매업체의 영업 현황을 조사하여 방문판매에 대한 정책입안 및 계획수립의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 서울특별시 민생경제과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 등록 다단계 판매업체의 영업 현황(영업중, 휴업, 폐업, 등록취소,타시도이관)○ 용어설명* 다단계판매 : 판매원의 가입이 단계적으로 이루어져 가입한 판매원의 단계가 3단계 이상이르고, 판매원을 단계적으로 가입하도록 권유하는데 있어서 판매 및 가입유치 활동에대한 경제적 이익의 부여가 유인으로 작용하여 이러한 다단계판매조직을 통하여 재화등을 판매하는 거래'
