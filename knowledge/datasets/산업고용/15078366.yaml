summary_user: 충청북도 고용동향 중 실업률을 연도(YEAR)·월(MT)·성별(SEXDSTN) 기준으로 조회하는 API로, 충청북도 한 개 시도의 월별 집계 실업률 값을 담는다. 분석가나 정책 담당자가 '충북의 남녀 실업률이 최근 몇 년간 월별로 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도 고용동향이나 같은 기관의 취업자·고용률 데이터와는 연도·월·성별 값과 시도명을 맞춰 붙여야 한다.
description_portal: 충청북도 고용동향 중 실업률을 연도·월·성별 기준으로 조회할 수 있는 Open API로, 특정 시기의 노동시장 내 미취업 인구 비중을 입력 파라미터를 통해 정량적으로 확인할 수 있습니다. 실업률은 지역의 경제 활력과 고용 환경의 안정성을 평가하는 핵심 지표로, 경기 변동, 산업 구조 변화, 인구 특성 등에 따른 노동시장 충격을 파악하는 데 중요한 자료로 활용됩니다. 행정기관은 실업률 추이를 활용해 고용안정 대책 수립, 취약계층 대상 맞춤형 지원방안 마련, 일자리 회복정책의 효과성 분석 등 근거 기반의 정책결정을 수행할 수 있으며, 연구자·민간에서는 지역별 고용환경 비교, 노동시장 불균형 진단, 실업 관련 서비스 개발 등 다양한 목적으로 데이터를 활용할 수 있습니다.
