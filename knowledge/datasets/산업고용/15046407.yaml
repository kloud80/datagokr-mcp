description_portal: '○ 통계개요* 통계명 : 청년(15~29세) 고용동향* 통계종류 : 청년인구(15~29세)의 경제활동 현황을 제공하는 지정·표본통계* 작성목적 : 취업, 실업 등의 경제적 특성을 조사하여 거시경제 분석과 인력자원의개발정책 수립에 필요한 정보를 제공하고 정부의 고용정책 입안 및 평가에필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 지방통계청 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 청년인구(15~29세) 경제활동인구, 실업자 및 고용률○ 용어설명* 청년층 생산가능인구란 경제활동을 할 수 있는 연령의 인구 중 청년층(15~29세)경제활동인구와 비경제활동 인구를 합한 수치임* 생산가능인구 : 생산가능인구란 경제활동을 할 수 있는 연령의 인구를 말하며,실제로는 통계청의 경제활동인구조사의 대상이 되는 만15세이상인구가 이에 해당된다(15세 이상 인구)* 경제활동인구 : 만15세 이상 인구 중 조사대상주간 동안 상품이나 서비스를 생산하기위하여 실제로 수입이 있는 일을 한 취업자와 일을 하지 않았으나구직활동을 한 실업자를 한다(취업자수+실업자수)* 실업률 : 실업자수/경제활동×100* 고용률 : 취업자수/생산가능인구×100* 경제활동참가율 : 경제활동인구/생산가능인구×100* 실업자 : 15세 이상 인구 중 조사대상 기간에 일할 의사와 능력을 가지고 있으면서도전혀 일을 하지 못하였으며 일자리를 찾아 적극적으로 구직활동을 하였던사람으로서 즉시 취업이 가능한 사람을 말한다* 취업자 : 조사대상주간에 소득,이익,봉급,임금 등의 수입을 목적으로 1시간이상 일한자,자기에게 직접적으로 이득이나 수입이 오지 않더라도 가구단위에서 경영하는농장이나 사업체의 수입을 높이는데 도와준 가족종사자로서 주당 18시간 이상일한 자, 직업 또는 사업체를 가지고 있으나 조사대상 주간에 일시적인 병,일기불순, 휴가 또는 연가, 노동쟁의 등의 이유로 일하지 못한 일시휴직자○ 기 타* 구직기간 4주'
