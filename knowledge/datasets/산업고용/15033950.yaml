summary_user: 충청북도 보은군에 허가된 태양광발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 발전소명·소재지 주소·허가 용량(kW)·허가일을 포함한다. 보은군에서 태양광 발전사업 허가를 신청하려는 사업자가 후보 부지 주변에 이미 허가된 발전소가 있는지, 그 용량이 얼마인지 사전조사하는 데 쓴다. 전역 조인 키가 없으므로 전국태양광발전소전기사업허가정보표준데이터와는 발전소명·소재지 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 보은군 태양광발전소 설치 현황(용량, 위치) 정보를 활용하여 태양광 발전사업의 위치를 알 수 있도록 한다. 건물, 토지등에 발전사업허가 신청을 하고 거리제한이 있기때문에 사전조사를 하여 발전사업을 하여야 한다.
