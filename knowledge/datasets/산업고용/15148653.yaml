description_portal: 한국노동패널조사는 비농촌지역에 거주하는 한국의 가구와 가구원을 대표하는 패널표본구성원 (5,000 가구에 거주하는 가구원) 을 대상으로 1년 1회 경제활동 및 노동시장 이동, 소득활동 및 소비, 교육 및 직업훈련, 사회생활 등에 관하여 추적 조사하는 종단면조사로 노동 시장 변화와 개인 삶의 흐름을 분석할 수 있는 기초 통계자료이다. 횡단면 조사의 단점을 보완하여 동적인 차원에서 가구와 개인의 장기간에 걸친 변화와 상태 간 이동과정을 보여줌으로써 횡단면 자료만 가지고는 불가능한 심도 있는 정책연구 및 정책평가를 가능하게 해주는 장점을 가지고 있다. 올바른 정책의 수립 및 시행, 평가를 위해서는 대표성 있고 신뢰할만한 기초자료의 뒷받침이 필수적인만큼 장기간에 걸쳐 성공적으로 구축될 경우 각종 노동정책의 수립 및 평가, 고용보험제도의 효율적인 운영과 장기적인 발전에 기여할 뿐만 아니라 노동관련 연구의 활성화를 위한 기초자료로 자리 잡을 것으로 기대된다.통합코드북은 한국노동패널조사(KLIPS)에서 수집된  설문조사 데이터를 통합정리하여 각 변수의 명칭, 값, 정의, 범주 등을 정리한 변수 해설서이다.
legal_basis_portal: '한국노동패널조사와 연구는 고용노동부의 예산 지원을 받고 있으며, 아울러 본 조사는 통계청의 공식 승인을 받아 수행되고 있음을 밝힌다. (통계청 승인번호 : 336001)'
