summary_user: 전라남도 내 주택관리업 등록 법인을 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록번호·등록일·영업구분·사무소명·전화번호·대표자명이 들어 있다(CSV 약 2.5KB 규모의 작은 목록). 아파트·오피스텔 관리업체를 찾는 입주자대표회의나 관리업체 현황을 보려는 분석가가 '전남에 등록된 주택관리업체는 어디이고 언제 등록했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소명·대표자명 같은 이름 매칭이나 같은 기관의 다른 업종 인허가(LOCALDATA) 자료와 나란히 놓는 방식으로만 잇는다.
limits: 사업자번호·좌표·주소 같은 공통 키가 실측 컬럼에 없어 다른 데이터와 정확히 조인되지 않고 이름 기반 매칭에 의존해야 한다. 범위는 시도(전라남도) 단위의 비공간 목록이라 지도화나 시군구별 집계에는 바로 쓰기 어렵다.
