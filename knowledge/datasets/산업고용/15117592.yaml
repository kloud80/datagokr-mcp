summary_user: 한국광해광업공단이 광물자원탐사로 확보해 국가기증에 동의한 시추공 한 공씩을 행으로, 입고·시공연도, 사업명, 광산명·광종·광구, 소재지와 시추공 좌표, 시공 심도·규격, 암추 보고서·주상도·분석결과·보관형태 같은 자료 보유 여부를 담은 전국 단위 CSV 파일이다. 탐사 기업이나 지질 연구자가 특정 광종·지역에서 이미 시추된 공이 어디에 있고 어떤 암추 자료(물성시험, 현미경사진 등)를 열람할 수 있는지 확인하는 데 쓴다. 광산명(komir_mine_nm)·광종(komir_mineral_type)·광구번호(mining_cadastre_no)를 키로 광업권·광산 현황 데이터와 잇고, 시추공 좌표로 지도·지질 정보와 겹쳐 본다.
description_portal: 한국광해광업공단은 전국에서 광물자원탐사를 통해 산출되는 시추암추 등 국가기증에 동의한 지질·광물정보의 통합보관을 추진 중에 있으며, 2029년까지 총 479.5km의 시추,암추 보관을 목표로 하고 있습니다.시추 정보의 데이터는 연도,사업명,시공연도,광종, 소재지,시추공번,시추공좌표,시공 심도,시공 규격, 암추 등 정보를 제공하고있습니다. 더 자세한 정보는 국가광물자원지리정보망( https://komir.kmrgis.or.kr/kmrgis/portal/index.do) 확인하실 수 있습니다.
