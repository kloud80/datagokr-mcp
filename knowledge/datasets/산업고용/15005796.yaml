summary_user: 한국농어촌공사 영암지사가 관리하는 전라남도 영암군 내 태양광 발전소(영암1차·영암2차·율치)의 발전량을 시설별·일별로 1시~24시 시간대 값과 일 합계(계)로 담은 CSV 파일(약 139KB)이다. 소규모 농어촌 태양광 설비의 시간대별 발전 패턴이나 계절별 일 발전량 변화를 살펴보려는 분석가·연구자가 '설비 규모 대비 하루 중 언제 얼마나 발전하는가'를 확인하는 데 쓴다. 전역 조인 키는 없고 시설명과 월·일만 있으므로, 다른 발전량·기상 데이터와는 날짜와 발전소 이름을 직접 맞춰 이어 쓴다.
limits: 표준 코드나 전역 조인 키가 없어 다른 데이터와는 시설명·날짜 수동 매핑으로만 연결된다. 영암군 내 3개 발전소만 담은 파일이므로 전국 단위나 실시간 전력 수급 분석에는 쓰지 못한다. 필드에 연도가 없어 월·일만으로는 기준 연도를 파일 자체에서 확인할 수 없다.
