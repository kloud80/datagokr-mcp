summary_user: 한국서부발전 발전소(태안·평택·서인천·군산·김포)의 호기별·월별 발전량(MWh)과 대기오염물질 배출량(황산화물·질소산화물·먼지, 톤)을 담은 집계 파일로, 포털 설명상 2002-01부터 2025년 6월까지를 다룬다. 분석가나 지역 주민이 '태안 석탄 호기의 발전량 대비 질소산화물 배출이 해마다 어떻게 변했나'처럼 발전소·호기 단위의 배출 추이와 배출 원단위를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전사 배출 데이터나 주변 대기질·기상 측정 자료와는 발전소명·날짜(연월)를 이름 매핑해 이어 쓴다.
description_portal: '한국서부발전 발전소 호기별 월별 대기오염물질 배출량 및 발전량 입니다.데이터 기간 : 2002-01 ~ 2022-07데이터 내용 : 발전소명, 호기명, 발전량(MWh), 황산화물(SOx ), 질소산화물(NOx), 먼지(TPS)                         - 대기오염물질 단위는 톤이며, 먼지는 TPS만 제공됩니다.데이터 요청에 의해 2022-07 이후 데이터가 포함 되었습니다. 현행화 데이터는 2025년 6월까지 이며,  김포발전소 정보가 추가 되었습니다.발전소는 태안, 평택, 서인천, 군산, 김포 입니다.발전소 호기 정보태안: 1~10호기, IGCC평택: 기력 1~4호기, 복합 1~2CC서인천: 복합 1~8CC군산: 복합 CC김포: 열병합'
