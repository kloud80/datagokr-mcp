summary_user: 한국남동발전의 발전소·발전기(호기)별로 유연탄, 무연탄, 유류, LNG, 고형연료, 우드펠릿 등 연료 종류별 소비량을 담은 실적 데이터이며, 필드상 기간 단위는 년월(ym)입니다. 에너지 분석가나 연구자가 '남동발전의 어느 발전소·호기가 석탄 대신 우드펠릿 같은 바이오매스를 얼마나 함께 태우는가'처럼 발전원별 연료 의존도와 혼소 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매칭이나 같은 기관(한국남동발전) 데이터로만 이어 쓴다.
description_portal: 이 데이터는 한국남동발전에서 제공하는 일자별 석탄화력 연료 소비 실적 현황입니다. 한국남동발전의 발전소별 일자별 연료 소비 실적에 관한 데이터를 제공하고 있습니다. 발전소의 각 발전기(호기)별 유연탄, 무연탄, 유류, LNG, 고형연료, 우드펠릿에 대한 연료량 데이터를 포함하고 있습니다. 해당 데이터는 기관의 연료 의존도를 파악하고 연료 수급의 안정성을 진단하는 중요한 데이터이며, 석탄과 함께 소비되는 바이오매스 연료의 소비량은 한국남동발전의 친환경 전환 노력을 보여주는 중요한 지표입니다.
