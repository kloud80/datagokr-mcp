description_portal: 본 데이터는 「전자상거래 등에서의 소비자보호에 관한 법률」에 따라 경기도 오산시에 등록된 통신판매업체 현황을 수록한 공공데이터이다. 제공 항목에는 업체의 상호명, 취급 품목, 도메인명 등의 정보가 포함되며, 개인정보 보호를 위해 휴대폰번호는 제외된다. 통신판매업체는 온라인 쇼핑몰, 홈쇼핑, 모바일 상거래 등 정보통신망을 통한 상품 판매를 주된 사업으로 하며, 본 데이터는 지역 내 등록된 온라인 기반 유통업체 현황을 파악하고자 하는 행정기관, 소비자, 민간 기업 등에게 유용한 기초자료로 제공된다. 본 자료는 오산시 관내의 전자상거래 사업 실태를 반영하며, 공정한 상거래 질서 확립 및 소비자 권익 보호에 기여하기 위해 주기적으로 갱신된다.
