summary_user: 전북특별자치도 안에서 정부 지원을 받는 골목슈퍼 '나들가게'를 점포 한 곳당 한 행으로 담은 파일로, 점포명·주소·전화번호·위도·경도가 들어 있다. 주민이 집 근처 나들가게를 찾거나, 분석가가 시군별 나들가게 분포와 골목상권 지원이 어디에 몰려 있는지 따져 볼 때 쓴다. 전역 조인 키는 없어서 주소 문자열이나 좌표를 기준으로 소상공인 상가업소 원장·전통시장 데이터와 공간 매칭해 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 내에 정부 지원을 받는 골목슈퍼인 '나들가게'의 현황을 상세히 담고 있는 자료입니다. 각 점포의 상호명, 소재지 주소, 그리고 연락처 정보를 포함하고 있습니다. 특히, 모든 나들가게의 위도와 경도 좌표값을 제공하여 지도 기반 서비스와의 연계 및 위치 기반 분석에 매우 유용합니다. 이 자료는 지역 주민들이 가까운 동네 슈퍼를 찾는 데 도움을 줄 뿐만 아니라, 소상공인 지원 정책의 분포와 효과를 파악하고, 지역 내 골목상권 활성화 전략을 수립하기 위한 핵심적인 기초 데이터로 활용될 수 있습니다.
