description_portal: 한국수력원자력㈜이 공개하는 행위개선포스터 데이터는 원자력발전소 운영 과정에서 발생할 수 있는 인적오류를 예방하고 안전문화를 강화하기 위해 제작된 자료입니다. 해당 포스터는 각 발전소에서 직원들에게 인적행위 향상을 유도하고 안전의식을 고취시키기 위해 게시되며, JPG 형식의 이미지 파일로 제공됩니다. 더불어 체계적인 관리와 활용을 위해 포스터 저장 파일명, 포스터 제목, 포스터 파일명, 등록일자 등의 항목을 정리한 CSV 파일도 함께 제공되어 포스터 자료를 효율적으로 검색하고 관리할 수 있습니다. 이 데이터는 원전의 안정적 운영을 위해 인적오류 예방 활동을 시각적으로 지원하는 동시에, 안전 중심의 조직 문화를 정착시키는 중요한 역할을 수행합니다.
