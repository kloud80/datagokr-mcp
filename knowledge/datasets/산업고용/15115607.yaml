description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 비디오물배급업 사업장의 인허가 현황을 체계적으로 관리하기 위해 구축된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 사업자구분, 제작취급품목, 시설면적, 층수 등의 항목이 포함되어 있어 각 사업장의 설립 및 운영 상태를 명확히 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관의 비디오물배급업 지도·감독 및 정책 수립에 활용될 수 있으며, 연구자와 시민은 배급시설 분포, 운영 유형, 안전관리 현황 분석 등 다양한 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 비디오물 배급업 - 영화유통 등 비디오물을 수입하거나 그 저작권을 소유 및 관리하여 판매하거나 대여하는 업소
