description_portal: 광주광역시 2022년 12월 기준 통계청 자료에 기반한 자동차 산업 관련 일반 현황 관련 자료입니다. 관련 제공 정보는 통계청에 매년 말 추출되며 우리시 자동차 관련 기업 육성을 위한 기초자료로 활용됩니다. 관련 내용은 자동차 산업, 뿌리산업 , 가전(제조로봇) 산업 등 기업수, 종사자수, 출하액, 부가가치에 관한 데이터 자료입니다.현재 자동차관련 기업 대상 미래차 대전환 을 위한 기업역량 강화를 위해 맞춤형 컨설팅(전문인력양성, 기업지원, 기반구축 등) 다양한 기업 지원을 진행 중에 있습니다.  ※ 2022년 기준 자료입니다.
