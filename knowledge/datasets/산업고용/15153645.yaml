description_portal: '광주광역시 남구 동행카드 가맹점 현황 및 정보(가맹점명, 업종, 소재지도로명주소 등)를 제공합니다. 무등시장 · 봉선시장 · 백운대성시장 내에 위치한 점포들은 비고에 명시하였으며, 그 외의 데이터들은 비고가 공란이므로 데이터 이용 시 참고하시기 바랍니다. 해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2715)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바라며, 해당 정보는 남구청 홈페이지에서도 확인 가능함을 알려드립니다. 링크 : https://www.namgu.gwangju.kr/menu.es?mid=a10505130401 ※ 광주광역시 남구 동행카드는 지역 주민의 소비 부담을 완화하고 지역경제 활성화를 지원하기 위해 발행되는 선불식 지역소비지원 카드입니다. 구매금액의 18%를 선할인해 제공하며, 5만·10만·50만원권으로 구성되어 누구나 부담 없이 활용할 수 있습니다. 해당 데이터는 주민들이 가까운 구매처를 신속하게 파악해 카드 구매 편의성을 높이는 데 활용될 뿐 아니라, 지자체가 구매현황·지점 분포 등을 분석해 발행 전략을 조정하거나 지역경제 지원 정책을 개선하는 데에도 유용하며, 민간에서는 금융·지역경제 분석 서비스, 지역 소비 촉진 캠페인, 지도 기반 안내 서비스 등으로 응용할 수 있어 공공·민간 모두에서 활용 가치가 높을 것으로 보입니다.'
