summary_user: 서울 금천구 관내 건축사사무소를 사무소 한 곳당 한 행으로 담은 파일로, 신고번호·사무소명·대표자·도로명/지번주소·위도·경도·전화번호·데이터기준일자를 포함하며 CSV 약 28KB 규모다. 주민이 집수리나 신축 설계·감리를 맡길 근처 건축사사무소를 찾아 연락처와 위치를 확인하거나, 분석가가 구 단위 건축사사무소 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 주소나 위도·경도로 다른 공간 데이터와 겹쳐 보거나, 사무소명·주소 매칭으로 지방행정 인허가(LOCALDATA) 건축사 업종 원장과 대조하는 방식으로만 이어 쓴다.
description_portal: '본 자료는 서울특별시 금천구 관내에서 운영 중인 건축사사무소의 기본 정보를 정리한 것입니다. 각 업소의 상호명, 주소, 전화번호가 포함되어 있어 주민 여러분께서 필요한 경우 가까운 건축사를 쉽게 찾고, 필요한 상담이나 문의를 편리하게 하실 수 있도록 구성되어 있습니다.건축사는 건축물의 설계와 공사, 감리 등의 업무를 수행할 수 있는 자격을 보유한 사람으로, 여러분께서 공사를 진행하실 때 이 자료를 활용하시면 지역 내 신뢰할 수 있는 건축사를 찾는 데 큰 도움이 될 수 있습니다. 등록된 전화번호를 통해  여러분이 진행하고 있는(또는 진행하고자 하는) 공사와 관련하여 전화로 상담을 하실 수 있으며, 필요하신 경우 주소를 통해 건축사사무소에 직접 찾아가실 수도 있습니다.우리 구는 앞으로도 주민 여러분의 편리한 생활을 지원하기 위해 건축사를 비롯하여 각종 업종 정보를 투명하게 공개하고, 누구나 쉽게 활용하실 수 있도록 지속적으로 노력하겠습니다.(담당부서 : 금천구 건축과)'
