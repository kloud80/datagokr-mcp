description_portal: 본 데이터는 한국산업기술진흥원에서 제공하는 기술은행 모바일 대분류 및 중분류 정보에 대한 것입니다. 이 정보를 토대로 산업기술 카테고리별로 체계적으로 분류된 대분류명과 그에 속하는 중분류의 세부 사항을 확인할 수 있습니다. 예를 들어, 기계 또는 소재와 같은 대분류와 각각의 대분류 아래에 포함된 중분류들이 어떤 것인지 자세히 알 수 있습니다. 이러한 데이터는 산업별 기술 개발 및 정책 수립에 유용하게 활용될 수 있습니다. 또한, 기업이나 연구 기관에서 기술 동향을 파악하는 데도 기여할 수 있는 자료입니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 대분류번호(숫자형), 대분류명(문자형), 중분류번호(숫자형), 중분류명(문자형), 표시여부(문자형)로 구성되어 있으며, 이를 통해 대분류와 중분류 간의 관계를 파악할 수 있습니다.
