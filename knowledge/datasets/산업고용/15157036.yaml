summary_user: 한국중부발전 발전소의 호기(발전기)별로 하루 단위 바이오매스 연료 사용량을 담는 API이며, 운전일자·호기코드·사용량으로 구성된 일자별 원천 기록이다. 발전사 바이오매스 연료 소비 추이를 살피는 분석가가 '특정 호기가 월별·연도별로 바이오매스를 얼마나 썼는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 호기코드 같은 기관 내부 코드나 이름 매핑으로만 연결한다.
limits: 전역 조인 키가 없어 지역·발전소 원장 등 외부 데이터와 바로 결합하기 어렵고, 공간 정보가 없는 비공간 데이터다. 호출에는 serviceKey가 필요하며 개발계정은 하루 1,000회로 제한된다.
