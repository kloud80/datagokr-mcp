description_portal: 이 데이터는 2014년부터 2020년까지 산업재해보상보험에 가입된 항만하역 작업 종사자 중 재해를 입은 근로자에 대한 보험급여 지급 상세 현황입니다. 통계 항목은 연번, 지급 연월, 재해 일자, 재해자 우편번호, 지급 금액(원)으로 구성되어 있습니다. 이 자료는 해운 및 물류의 주요 인프라인 항만 현장에서 발생하는 재해의 규모와, 이에 따른 보험급여 지출의 시간적, 지리적 분포를 명확하게 보여줍니다. 특히, 항만하역이라는 고위험 특수 직종의 안전 관리 실태와 산재 보상 지원 규모를 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 항만 안전 관리 정책 및 산재보험 재정 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 지급 금액이 높거나 재해 발생이 집중되는 특정 연월 및 지역(우편번호 기반)을 분석함으로써, 항만 작업 환경 개선을 위한 안전 감독을 강화하거나, 재해 예방 시설 투자를 집중해야 할 시기 및 지역을 정확하게 식별할 수 있습니다. 또한, 이 통계는 항만하역 근로자에 대한 재해 보상 제도의 효과성과 공공 재정 지출의 적정성을 평가하고, 고위험 직종 근로자의 안전권을 확보하는 데 기여할 수 있다고 판단됩니다.
