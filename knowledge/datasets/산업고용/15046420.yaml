description_portal: '○ 통계개요* 통계명 : 고용지표* 통계종류 : 서울시 남녀의 경제활동참가율, 실업률, 고용률을 제공하는 지정ㆍ표본 통계* 작성목적 : 취업, 실업 등의 경제적 특성을 조사하여 거시경제 분석과 인력자원의 개발정책 수립에 필요한정보를 제공하고 정부의 고용정책 입안 및 평가에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 지방통계청 → 통계청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 서울시 경제활동참가율, 실업률, 고용률 현황○ 용어설명* 경제활동참가율 : 만 15세 이상 인구 중 경제활동인구(취업자+실업자)가 차지하는 비율을 말함* 고용률 : 만 15세 이상 인구 중 취업자가 차지하는 비율을 말함* 실업률 : 실업자가 경제활동인구(취업자+실업자)에서 차지하는 비율을 말함○ 기 타* 2015년 인구총조사(등록센서스) 결과를 토대로 소급작성된 추계인구의 변경을 반영하여2018년 1월에 2000년 7월 ~ 2017년 12월까지의 자료를 변경 하였음'
