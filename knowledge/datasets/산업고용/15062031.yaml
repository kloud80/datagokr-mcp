summary_user: 대전광역시 서구 관내 담배도매업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명주소·허가일·영업상태(영업 중, 폐업 등)와 기준일자를 포함하며 범위는 서구 한 개 시군구의 개별 사업장 단위다. 서구에서 현재 영업 중인 담배도매업체가 어디에 몇 곳 있는지, 언제 허가를 받았는지 확인하려는 사업자·분석가가 지역 담배 유통망을 살피는 데 쓴다. 실측 컬럼에 사업자번호나 표준 코드 같은 전역 조인 키가 없어, 다른 데이터와는 업소명·주소 매칭으로만 잇고, 같은 업종 인허가 원천(LOCALDATA)의 담배소매업 등과 함께 볼 때 주소를 기준으로 맞춘다.
limits: 전역 조인 키가 없어 다른 기관 데이터와의 연결은 업소명·주소 문자열 매칭에 의존한다. 범위가 대전 서구 한 개 시군구라 다른 자치구나 전국 현황은 담지 않는다.
