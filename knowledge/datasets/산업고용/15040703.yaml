summary_user: 국내 안전기준에 따라 인증을 받은 제품을 제품 단위로 담은 원장 파일로, 2019-10-01~2022-07-29 기간의 전국 152,433건이다. 소비자나 유통업자가 특정 제품명·모델명이 안전인증을 받았는지, 어떤 업체가 제조·수입했는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 제품명·모델명, 제조사명 같은 이름 매핑이나 같은 기관의 인증·리콜 API 코드로만 이어 쓴다.
description_portal: '국가기술표준원에서 운영하고 있는 제품안전정보포털(센터)에서 제공하고 있는 제품안전 인증제품 정보를 공유합니다. 본 데이터는 국내 안전기준에 따라 인증을 획득한 제품의 기본 정보를 제공하는 데이터입니다. 제품명, 모델명, 제조수입업체 정보, 인증기관 등 주요 내용이 포함됩니다.* 다만, 해당 정보는 API(API 데이터 목록명: 산업통상자원부 국가기술표준원_제품 안전인증 및 리콜 정보)로 제공되고 있는 바, 최근 데이터 수정일 이후 최신 정보를 확인하시고자 하는 분들은 API 데이터를 활용해주시길 바랍니다.'
