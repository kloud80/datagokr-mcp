summary_user: 부산광역시 내 창업보육센터를 센터 한 곳당 한 행으로 정리한 현황 파일로, 도로명주소·전화번호·좌표와 함께 보육실 수, 입주업체 수, 입주사 직원·정규직 수, 벤처기업·졸업기업 수, 개소일자를 담는다(포털 설명 기준 14개소, 보육실 421개실, 입주업체 290개사, 2024.11.26. 기준). 부산에서 창업 공간을 찾는 예비창업자나 지역 창업 인프라를 분석하는 사람이 '내 사업장 근처에 입주 가능한 대학·연구소 보육센터가 어디이고 규모는 얼마인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 보육센터명이나 주소로 매칭하거나 위도·경도로 지도·상권 데이터에 겹쳐 쓴다.
