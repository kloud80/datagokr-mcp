summary_user: 경상남도 내 유통업 인허가 사업장을 한 행씩 담은 2023년 기준 현황 파일로, 사업장명·지번·도로명 주소, 인허가일자, 영업상태·상세영업상태, 업태구분, 판매방식으로 구성되며 포털 설명상 총 10,790건입니다. 경남 시군에서 영업 중인 유통업 사업장이 어디에 몰려 있고 업태·판매방식별로 몇 곳인지, 폐업 비중은 얼마인지 확인하려는 분석가나 창업 준비자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 사업장명을 매칭해 잇는다. 주소를 기준으로 행정구역을 붙이거나 소상공인 상가업소 원장과 대조하는 식이다.
description_portal: (데이터 수집목적 및 과정) 경상남도 인허가 유통업 데이터는 경남빅데이터허브플랫폼 데이터베이스에서 관리하고 있는 2023년 기준 인허가 유통업 현황입니다. 경상남도 인허가 유통업에 대한 현황 정보를 파악할 때 활용 할 수 있습니다.(데이터 구성 및 세부항목) 인허가 이용업 데이터는 사업장명, 지번주소, 도로명 주소, 인허가일자, 영업상태, 업태구분, 판매방식으로 구성됩니다. 총 10790건입니다. 미집계 데이터는 공란 처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터이며 현행화 되지 않습니다.
