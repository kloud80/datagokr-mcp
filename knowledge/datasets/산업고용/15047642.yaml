summary_user: 중소기업 특성화고 인력양성사업에 참여하는 전국 특성화고를 학교 단위로 정리한 파일로, 학교명·계열·소재지·전공·학생수·취업맞춤반 과정수를 담는다(csv 약 15KB). 진로 상담 교사나 학부모, 특성화고 졸업 인력을 찾는 중소기업이 '우리 지역에서 이 사업에 참여하는 학교와 전공은 어디이고, 취업맞춤반은 몇 개 과정이 운영되나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 학교 데이터와는 학교명이나 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 특성화고는 소질과 적성 및 능력이 유사한 학생을 대상으로 특정분야의 인재양성을 목적으로 하는 교육 또는 자연현장실습 등 체험위주의 교육을 전문적으로 실시하는 고등학교를 일컬으며, 특성화고 인력양성 프로그램은 이러한 특성화고의 학생에게 중소기업 맞춤형 직업교육(취업맞춤반, 중소기업 이해연수, 전공동아리 프로그램 등)을 통해 우수 기능인력 양성 교육을 제공하고 중소기업 취업연계를 이루어내는 것을 주 사업으로 하고 있습니다. 해당 데이터는 중소기업 특성화고 인력양성사업에 참여하고 있는 학교의 상세 현황 정보(참여학교, 계열, 소재지, 전공, 학생수, 취업맞춤반 과정수 등)을 제공합니다.
