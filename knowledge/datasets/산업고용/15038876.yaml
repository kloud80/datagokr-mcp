summary_user: 인천 서구(서해구) 관내 옥외광고사업자 업소를 한 행씩 담은 CSV 파일로, 업소명·영업장 전화번호·도로명주소·데이터기준일자로 구성된 시군구 범위의 개별 업소 목록이다. 간판·옥외광고물 설치를 맡길 업체를 지역 안에서 찾으려는 주민·사업자나, 관내 옥외광고업체가 어디에 얼마나 분포하는지 보려는 담당 공무원·분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 옥외광고 관련 사업체의 현황을 정리한 자료입니다. 본 공공데이터는 업소명, 전화번호, 영업장 도로명주소, 기준일자 등의 항목으로 구성되어 있습니다. 해당 데이터는 간판 및 각종 옥외 광고물 설치 관련 업체의 분포를 파악하고, 관련 인허가 업무, 시각 환경 관리 등의 행정 업무에 활용될 수 있을것으로 판단 됩니다. 또한 옥외매체 산업 동향 파악, 도시미관 개선 및 광고 정책 수립 등 관련 정책에 활용 할 수 있는 기초자료로 쓰일 수 있을것으로도 판단됩니다. 본 데이터는 매년마다 정기적인 갱신으로 최신정보를 반영하고 있습니다.
