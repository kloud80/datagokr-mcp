description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 2016년 기준 성별 및 외국인 이용객 수와 매출 현황을 나타낸 것입니다. 항목은 연도, 구분, 1월부터 12월까지의 월별 이용객 수와 순매출액으로 구성되어 있으며, 각 월별로 이용객 수가 먼저, 이어서 해당 월의 순매출이 배열된 형태입니다. ‘구분’ 항목은 성별(남자, 여자)과 내·외국인 여부에 따라 분류되어 있으며, 이를 통해 내국인 남성, 내국인 여성, 외국인 남성, 외국인 여성 등 다양한 고객층의 면세점 이용 실적을 비교할 수 있습니다. 이 데이터는 월별 이용 실적의 계절적 변화, 성별 및 국적별 구매 성향 분석, 외국인 관광객의 소비 트렌드 파악 등 JDC지정면세점의 전략적 운영 방향 설정에 있어 중요한 기초 자료로 활용될 수 있습니다.
