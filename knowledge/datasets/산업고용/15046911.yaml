description_portal: '○ 통계개요* 통계명 : 1인당 최종에너지 소비량* 통계종류 : 일반통계, 보고통계* 작성목적 : 에너지수요와 공급에 영향을 미치는 여러가지 요인을 비교·분석함으로써 에너지수요전망, 에너지효율분석 등 각종 에너지정책수립을 위한 기초자료를 제공하기 위함* 조사체계 : 관련기관 및 협회 → 에너지경제연구원* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 석탄, 석유, 가스 등 에너지원별 최종에너지 소비 등○ 용어설명* 최종에너지- 산업, 수송, 가정 및 상업부문 등 최종에너지 소비부문에서 사용하는 에너지로, 최종소비자가 직접 사용한1차에너지와 전환과정을 거친 2차에너지가 여기에 해당- 현 에너지수급통계에서 전력과 열에너지는 한전 및 지역난방 사업자가 공급하는 양만 최종에너지소비에 포함- 자가생산자가 생산한 전력과 열에너지는 생산부문 및 업종의 연료소비로 최종소비에 포함되나, 전력거래소에판매된 자가발전은 전력으로 최종소비에 포함* 에너지유 : 발전, 내연기관, 램프, 취사기구, 난방기구 등에 동력 및 열 등으로 사용되는 석유제품으로휘발유, 등유, 경유, 경질증유, 중유, 방카C유 등* 비에너지유 : 에너지유를 제외한 석유제품으로서, 주로 타제품의 원료로 사용되는 납사용제 아스팔트 등을 말함* 1인당 소비량 = 공급권역내 소비량/공급권역내 인구수*1000○ 기타* 단위 toe(Tonnage of Oil Equivalent)는 각종 에너지의 열량을 석유 1톤당 열량값인 107Kcal로 환산한 것임* 공급권역내 인구수는 장래추계인구임* 숫자의 단위미만은 사사오입에 의한 반올림을 원칙으로 하였으며 세부적인 내용의 합계가 총계란과 일치하지 않는 경우도 있음* 에너지법 시행규칙에 따른 에너지열량환산기준에 따라 작성된 것임○ 출 처 : 에너지경제연구원 「지역에너지통계연보」○ 담 당 : 서울특별시 스마트도시담당관'
