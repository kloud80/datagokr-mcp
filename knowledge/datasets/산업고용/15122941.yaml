description_portal: '이 데이터는 일자리 안정자금 지원 사업에서 주 40시간 미만 단시간 근로자에 대한 지급 기준 예시를 담고 있습니다. 통계 항목은 지원 연도, 지원 시작일, 지원 종료일, 주 소정 근로 시간, 월 소정 근로 시간 환산(시간), 최저임금의 100% 금액 및 최저임금의 120% 금액으로 구성되어 있습니다. 이 지급 기준은 시간급 정액 급여가 최저임금의 100% 이상 120% 미만인 경우 지원 대상이 되도록 정하였으며, 월 소정 근로 시간 환산식의 예시도 함께 제공합니다. 이 자료는 일자리 안정자금 제도가 단시간 근로자의 고용 안정과 소득 보장에 기여하기 위해 설정했던 구체적인 기준과 그 금액 수준의 변화를 명확하게 보여주는 근거 정보라고 판단됩니다.본 데이터는 단시간 근로자 및 최저임금 정책의 효과 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 연도별 지급 기준 금액의 변화를 분석함으로써, 최저임금 인상에 따른 정부의 재정 지원 규모와 정책 목표를 정량적으로 평가할 수 있습니다. 또한, 단시간 근로자의 소정 근로 시간 및 급여 수준을 기준으로 한 세부 지원 기준의 적정성을 검토하고, 유사한 형태의 저임금 근로자 지원 정책을 설계하는 데 활용할 수 있습니다. 이 통계는 노동 시장의 유연성 증가에 따른 비정규직 및 단시간 근로자의 고용 안정망을 강화하는 데 기여할 수 있다고 판단됩니다.※ 주 40시간 미만 단시간 근로자: 주소정근로시간과 정액급여를 기준으로 산정한 시간급 정액 급여가 최저임금의 100%이상 120%미만인 경우 지원※ 월소정근로시간 환산식 예시: [(주소정근로시간+유급주휴(8*주소정근로시간/40))/7*365]/12'
