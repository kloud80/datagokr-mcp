summary_user: 한국중부발전 각 사업소가 수행한 정비 공사를 공사 건별로 기록한 원천 자료로, 사업소·공사번호·공사구분·공사명·공사 시작/종료일·준공승인일·오더번호와 관련 설비·자재 정보를 담은 CSV 파일(약 16만 바이트)이다. 발전설비 유지보수를 분석하는 연구자나 공공기관 감시자가 "어느 사업소의 어떤 설비에 언제 어떤 공사가 이뤄졌고 어떤 자재가 들어갔는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업소명·설비명 같은 이름 매핑이나 같은 기관(한국중부발전) 내부 코드(설비번호·오더번호)로만 이어 쓴다.
description_portal: 본 데이터는 한국중부발전 각 사업소에서 수행한 공사에 대한 세부 이력 정보를 담은 자료로, 공사명, 공사기간, 준공 승인일, 관련 설비 및 자재 정보 등을 포함하고 있습니다. 항목은 사업소, 공사번호, 공사구분, 공사명, 공사시작일, 공사종료일, 준공승인일, 오더번호, 설비번호, 설비명, 자재구분, 자재명으로 구성되어 있습니다. 이 데이터는 발전설비 유지보수 이력 관리, 공사 일정 추적, 설비별 투입 자재 분석 등에 활용될 수 있으며, 공공기관의 시설관리 투명성 확보와 자산관리 최적화 전략 수립을 위한 기초자료로도 유용합니다.
