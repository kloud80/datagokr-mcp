summary_user: 국내 원자력발전소의 사용후핵연료 저장량을 원전본부·호기·저장방식(습식/건식)별 다발 수로 담은 전국 단위 파일로, 경수로/중수로 구분과 기준일이 함께 들어 있습니다. 원전별 사용후핵연료가 얼마나 쌓여 있고 건식 저장이 어느 호기에서 쓰이는지 궁금한 시민·연구자·정책 분석가가 저장 포화 논의나 방사성폐기물 관리 현황을 살피는 데 쓴다. 전역 조인 키는 없어서 다른 원전 가동·방사성폐기물 데이터와는 본부명·호기명을 이름으로 맞추거나 같은 기관(한국수력원자력) 자료끼리 연결해야 한다.
description_portal: '한국수력원자력㈜ 국내 원자력발전소의 사용후핵연료 (Spent Nuclear Fuel, SNF) 저장시설(습식, 건식)에 저장되어 있는 사용후핵연료 저장량(다발) 정보를 매분기마다 갱신하여 공개합니다. 공개 정보는 구분(경수로/중수로) 원전본부,  호기, 저장방식(건식/습식), 저장량(단위: 다발), 기준일 항목으로 구성되어 있습니다.사용후핵연료는 원자로에서 핵연료 주기를 거치고 쓰고 남은 핵연료로써 연료로 사용된 후 방사능이 남아있는 연료입니다. 그냥 버리면 고준위 방사성 폐기물이지만 재처리를 하면 핵연료와 귀금속 자원이 됩니다.'
