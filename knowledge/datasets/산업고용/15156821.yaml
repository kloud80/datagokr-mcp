description_portal: 한전KDN은 위험성 평가를 통해 사업장 안전을 지속적으로 관리하고 있습니다. 2022년부터 2024년까지의 평가 결과에 따르면, 위험성 평가 대상 사업장은 매년 15개소로 동일하며, 위험성 평가 결과에 따른 대책 수립 건수와 개선 완료 건수는 매년 증가하는 추세입니다. 건강 관리 측면에서는 일반검진, 특수검진, 종합검진을 포함한 다양한 건강검진 이용현황을 주기적으로 모니터링하고 있습니다. 2024년에는 특수검진과 종합검진 이용이 비교적 안정적이었으며, 건강검진 이용현황은 전체적으로 지속적으로 높은 수준을 유지하고 있습니다. 회사는 위험성 평가 후 개선 대책 수립과 건강검진 실시를 통해 직원들의 안전과 건강을 최우선으로 고려하고 있으며, 이를 바탕으로 지속 가능한 환경을 구축할 계획입니다.
