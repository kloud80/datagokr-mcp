summary_user: 경기도 마을노무사 수와 노동센터·마을노무사 상담 건수를 기준연도별로 집계한 자료로, 상담은 임금·해고·산재·직장 내 괴롭힘 등 사업장 관련·기타 유형별 건수로 나뉜다. 노동정책 담당자나 분석가가 경기도 노동 취약계층 상담 수요가 어떤 유형에서 늘고 줄었는지, 마을노무사 인원 대비 상담 실적이 어떻게 변했는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도(crtr_yr)를 맞춰 이름으로 붙이는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도에서 운영하는 마을노무사 수와 상담 실적을 집계한 자료입니다. 주요 항목에는 노동센터 상담 건수와 마을노무사 상담 건수가 포함되어 있으며, 상담 유형별 건수도 제공합니다. 이를 통해 노동 현장에서 발생하는 다양한 상담 수요를 유형별로 파악할 수 있으며, 시기별 변화 추세도 확인할 수 있습니다. 특히 노동 취약계층을 대상으로 한 지원 활동의 성과를 가늠할 수 있는 기초 자료로 활용될 수 있으며, 향후 노동정책 수립과 마을노무사 제도의 운영 개선에도 참고될 수 있습니다.※ 경기도 스마트 마을노무사 사이트를 통해 상담을 신청할 수 있습니다. → https://www.gg.go.kr/nodong/smart/main.do
