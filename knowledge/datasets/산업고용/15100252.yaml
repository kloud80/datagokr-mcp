summary_user: 중소벤처기업진흥공단 스마트제조기업 일자리 패키지사업에 참여한 기업을 참여년도별로 한 행씩 담은 파일로, 기업명·사업자번호·지역·업종·산업분류와 취업인원이 들어 있고 범위는 전국이다. 구직자나 분석가가 스마트공장을 도입한 중소기업 중 어느 기업이 이 사업으로 경력직 인력을 몇 명 채용했는지, 지역·업종별로 어떻게 분포하는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나 사업자번호(사업자번호)를 기준으로 벤처·이노비즈 등 기업 확인·인증 원장과 기업 단위로 이어 볼 수 있고, 그 밖에는 기업명·지역명 매핑으로 연결해야 한다.
description_portal: 스마트공장 구축기업과 경력직 구직자를 매칭하고 현장 맞춤교육을 통해 제조 실무인력으로 양성 및 공급하는, 중소벤처기업진흥공단의 스마트제조기업 일자리 패키지사업의 참여기업 정보입니다.사업에 대한 개요는 아래와 같으니 참조하시기 바랍니다. 해당 데이터는 참여기업명, 사업자등록번호, 소재지 등의 정보를 나타내고 있습니다.ㅇ 지원대상 및 규모- (기업) 스마트공장 도입 중소기업- (구직자) 경력 1년 이상의 실업자 또는 직무관련 자격증 소지자ㅇ 지원내용- (직무교육) 참여인력 대상 기초, 심화교육- (훈련수당) 현장실습 기간 중 훈련수당
