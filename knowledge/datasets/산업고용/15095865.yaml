summary_user: 한국서부발전이 운영하는 태양광·풍력 발전기별로 날짜마다 1시~24시 시간별 발전량과 일 합계를 담은 건별 원천 파일(csv, 약 1.6MB)이며, 발전기명·설비용량(MW)·주소지가 함께 들어 있다. 분석가나 사업자가 '특정 태양광 발전소의 시간대별 발전 패턴과 용량 대비 이용률이 계절에 따라 어떻게 달라지는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 발전기명이나 주소지를 이름 매핑으로 맞추거나, 같은 기관 자료끼리만 연결한다.
description_portal: 한국서부발전에서 운영하고 있는 신재생에너지(태양광, 풍력)  발전의 일일 시간별 발전량을 제공합니다. 태양광·풍력 발전소별 발전량을 시간 단위로 기록한 데이터는 재생에너지의 생산 특성을 정밀하게 분석할 수 있는 핵심 자료입니다. 이 데이터는 발전소별 위치와 설비 용량에 따른 실제 발전량을 시간대별로 구분하여 제공합니다. 특히 태양광은 일출·일몰에 따른 일변화가 뚜렷하고, 풍력은 시간대별 바람 세기와 방향 변화에 크게 영향을 받기 때문에 해당 데이터는 수급 예측, 전력 계통 안정화 대책 수립, 운영 효율화 방안 마련에 필수적입니다.
