summary_user: 경상남도 내 태양광 발전시설의 허가 내역을 발전소 한 곳씩 담은 건별 원장으로, 허가기관·허가일자·시설명·설비용량(kW)·소재지 주소·상태·설치연도를 포함한다. 사업자나 분석가가 "경남 어느 시군에 어떤 규모의 태양광 발전소가 언제 허가됐고 지금 어떤 상태인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 지역명을 매핑하거나, 전국태양광발전소전기사업허가정보표준데이터와 시설명·주소로 대조해 이어 쓴다.
description_portal: 경상남도청에서 관리하는 태양광발전 설치 현황입니다. 태양광 발전 설치의 허가일자, 상호, 설비용량, 설치장소, 사업개시일자 등에 관한 정보를 제공합니다.
