summary_user: 인천광역시 남동구에 있는 무료직업소개소를 기관 한 곳당 한 행으로 정리한 목록이며, 등록번호·소개소 명칭·소재지·전화·팩스·데이터기준일을 담은 작은 CSV 파일(약 3KB)이다. 남동구 주민이나 구직자가 '집 근처에서 수수료 없이 일자리를 소개받을 수 있는 곳이 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 지역 직업소개소 목록이나 고용복지플러스센터·일자리센터 자료와는 소재지 주소나 소개소 명칭을 맞춰 붙여 쓴다.
limits: 남동구 한 곳만 담고 있어 인천시 전체나 다른 시군구와 비교하려면 해당 지역 자료를 따로 모아야 한다. 공통 기관 코드가 없으므로 다른 데이터와 붙일 때 명칭·주소 표기 차이에 주의해야 한다.
