summary_user: 서울 강북구 관내에서 고압가스를 제조·저장·판매(용기 충전 포함)하는 업소의 인허가 원장을 업소 한 곳당 한 건으로 담으며, 영업 중인 곳과 폐업한 곳이 모두 들어 있고 인허가일·영업상태·폐업일·주소·중부원점TM 좌표가 포함된다. 주민이나 안전 담당자가 '우리 동네 근처에 영업 중인 고압가스 충전·판매소가 어디인가'를 확인하거나, 분석가가 지역 에너지 업종 인허가 현황을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 석유판매·LPG·도시가스 등 다른 에너지 업종 인허가 데이터와 같은 LOCALDATA 형식으로 나란히 쓴다.
description_portal: '서울특별시 강북구 고압가스업 인허가 정보 데이터는 강북구 관내에 위치한 용기에 충전하는 것을 포함하여 고압가스를 제조,저장 및 판매하는 업소정보 입니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
