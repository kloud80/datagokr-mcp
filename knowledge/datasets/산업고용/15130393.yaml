summary_user: 한국산업기술진흥원이 지원한 사업 수행으로 발생한 기술이전 성과를 건별로 담은 파일(csv, 약 51KB)로, 성과발생년도·접수번호·기술이전 순번·기술실시 내용·계약년도·대상 국가·실시 방식을 기록한다. 연구자나 정책 분석가가 "진흥원 지원 과제에서 나온 기술이전이 연도별로 어느 나라에, 어떤 계약 방식으로 이뤄졌나"를 살피는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 같은 기관 자료와 접수번호나 이름 매핑으로만 이어 붙인다.
description_portal: 한국산업기술진흥원에서 지원하는 사업 수행을 통해 발생한 기술이전 성과 데이터입니다. 이 데이터는 기술이전의 세부내용 및 성과를 기록하고 있으며, 기술이전의 개선 및 신규 사업 개발을 위한 기초 자료로 활용될 수 있습니다. 구체적으로는 기술실시 내용, 대상 국가, 계약 방식 등 다양한 정보를 포함하고 있습니다. 이를 통해 기업과 연구자들은 성공적인 기술이전 사례를 참고할 수 있으며, 산업 진흥을 위한 전략을 수립하는 데 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 성과발생년도(숫자형), 접수번호(문자형), 기술이전 순번(숫자형), 기술실시 내용(문자형), 계약년도(숫자형), 기술실시 대상 국가(문자형), 실시 방식(문자형), 등록일자(날짜형) 입니다. 이 정보를 통해 기술이전의 경과를 분석하고, 관련 정책 수립을 위한 기초 자료로 삼을 수 있습니다.
