summary_user: 광주광역시 관내 석유판매업소 가운데 품질검사에서 부적합 판정을 받은 업소별 행정처분 내역을 건별로 담은 작은 파일(csv 약 2KB)로, 소재 자치구·상호·위반내용·처분내용·처분일자를 담는다. 운전자나 사업자가 '우리 동네 주유소가 가짜·불량 석유로 고발이나 경고를 받은 적이 있나'를 확인하거나, 분석가가 자치구별 품질부적합 처분 이력을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호(업소명)나 소재 구 이름을 맞춰 LOCALDATA 석유판매업 인허가 원장이나 오피넷 주유소 정보와 이름 매칭으로만 이어 쓴다.
