summary_user: 에너지이용 합리화법에 따라 등록된 에너지절약전문기업(ESCO)을 업체별로 담은 전국 단위 등록 명부 API로, 검증 시 325건이 수신됐고 등록 기간은 1997-03-15부터 2026-09-13까지다. 에너지 절약 시설 개선을 추진하려는 기업이나 기관이 어느 ESCO가 등록돼 있고 어느 지역·분야에서 활동하는지 찾는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업체명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 본 데이터는 「에너지이용 합리화법」에 따라 등록된 에너지절약전문기업(ESCO; Energy Service COmpany)들의 상세 정보를 제공합니다. ESCO는 에너지 사용자가 노후화되거나 비효율적인 에너지 사용 시설을 고효율 시설로 개선하고 싶지만, 초기 투자비용이나 기술적 부담 때문에 망설이는 경우, ESCO가 직접 투자비를 조달하고(또는 에너지사용자가 조달하는 방식도 있음), 에너지 절약 시설의 설치, 운영 및 유지보수 등 포괄적인 서비스를 제공하며, 이를 통해 발생하는 에너지 절감액으로 투자비를 회수하는 사업을 수행하는 전문 기업입니다.이 데이터셋의 주된 목적은 에너지 절약 사업을 추진하려는 기업이나 기관이 신뢰할 수 있는 ESCO를 쉽게 찾고 선택할 수 있도록 정보를 투명하게 공개하는 것입니다. 이를 통해 ESCO 시장의 활성화를 돕고, 에너지 효율 향상 및 온실가스 감축 목표 달성에 기여합니다. 또한, 정부는 ESCO 산업의 현황을 파악하고 관련 지원 정책(자금 지원, 세제 혜택 등)의 효과를 평가하며, ESCO 산업의 건전한 성장을 유도하는 데 활용합니다.
