description_portal: 본 데이터는 경상북도 경주시에서 지정한 담배소매인 현황을 파일 형식으로 제공하는 공공데이터이다. 담배소매인은 「담배사업법」에 따라 관할 지자체장이 지정하는 담배 판매 업소로, 지역 내 담배 유통 질서와 소비자 접근성 등을 고려하여 선정된다. 본 자료에는 상호명, 주소, 지정일, 영업 형태, 업종 분류 등의 정보가 포함되어 있으며, 담배 판매점의 분포 분석, 상권 특성 파악, 공공 규제 정책 수립, 민원 대응 등 다양한 행정 목적에 활용될 수 있다. 경주시는 소매인 지정 현황을 투명하게 공개함으로써 지역 사회의 알권리를 보장하고, 정책 수립의 기초자료로 활용하고자 본 데이터를 주기적으로 갱신·개방하고 있다. 본 데이터는 공공기관, 연구기관, 일반 시민이 쉽게 활용할 수 있도록 접근성이 용이한 파일 형식으로 제공된다.
