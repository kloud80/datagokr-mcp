summary_user: 경주시가 지정한 담배소매인을 업소 한 곳당 한 행으로 담은 파일 목록으로, 업소명·소매인 구분·영업소 위치(주소)를 담는다(파일 약 81KB). 담배 판매점을 열려는 사업자나 분석가가 경주시 안에서 기존 소매인이 어느 동네에 몰려 있는지 확인하는 데 쓴다. 전역 조인 키(사업자번호·좌표·법정동코드 등)가 없어서 다른 데이터와는 업소명이나 주소 문자열을 맞추는 방식으로만 이을 수 있고, 지방행정 인허가(LOCALDATA) 담배소매 원장이나 소상공인 상가업소 데이터와 대조하는 용도에 맞다.
