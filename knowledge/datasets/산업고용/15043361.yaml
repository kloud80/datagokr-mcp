summary_user: 경상남도 함안군이 허가한 태양광발전소를 발전소 한 곳당 한 행으로 담은 허가 원장 파일로, 발전소명·설치장소 주소·설비용량(킬로와트)·공급전압·주파수·사업허가일·사업개시일·사업상태·소요부지면적·지목 등을 담는다. 함안군 안에서 어느 읍면에 어떤 규모의 태양광발전소가 허가됐고 실제 사업을 시작했는지 확인하려는 주민·사업자·에너지 분석가가 쓴다. 전역 조인 키가 없어 설치장소 주소나 발전소명으로 매칭해야 하며, 전국태양광발전소전기사업허가정보표준데이터 같은 다른 지역 허가 현황과는 같은 항목 구성을 기준으로 이어 붙여 비교한다.
description_portal: 경상남도 함안군에서 허가한 태양광발전소 현황으로 발전소명, 주소, 설비용량, 전압, 주파수, 사업허가일 등의 정보를 제공합니다.자가용 전기설비 소유자 또는 점유자는 전기설비로 인한 재해를 예방하고 안전을 확보하기 위하여 전기안전관리법 제11조, 제 43조 및 같은 법 시행규칙 제8조에 의거 정기적으로 전기 설비 검사를 받은 후 사용하도록 규정하고 있습니다.이에 같은 법 시행규직 제 9조에 의거 검사시기에 검사를 받지 아니하고 전기설비를 사용하는 고객은 정기검사를 필하도록 행정조치를 취하기시 바랍니다.
