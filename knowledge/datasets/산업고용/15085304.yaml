summary_user: '전국 풍력발전기 803기를 발전기 단위로 담은 설비 원장으로, 관리번호·발전소명·호기·용량(MW)·소재지(주소)를 건별로 싣는다. 지자체나 연구기관이 지역별 풍력 설비 분포와 발전 규모, 입지 분석이나 유지보수 계획에 쓴다. 조인 키는 소재지(address)뿐이라 주소 기준으로 다른 발전소·신재생 설비 자료(예: 태양광 발전사업 허가 표준데이터)와 이어 쓴다.'
description_portal: 본 데이터는 국내에 설치된 풍력발전기의 현황 및 지역별 위치를 제공하여 풍력에너지 설비의 효율적인 운영과 유지관리를 지원하기 위한 자료입니다.제공되는 데이터는 관리번호, 발전소명, 호기, 발전 용량(MW), 상세 소재지(주소) 등의 속성 정보로 구성되어 있어, 이용자는 각 지역별 풍력발전기의 설치 현황과 발전 규모를 직관적으로 파악할 수 있습니다.본 데이터는 정부 및 지자체의 신재생에너지 인프라 관리와 풍력자원 평가, 기업 및 연구기관의 입지 분석 및 유지보수 계획 수립을 위한 기초자료로 다양하게 활용 가능합니다.
