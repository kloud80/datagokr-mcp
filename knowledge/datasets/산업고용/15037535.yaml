summary_user: 창업진흥원 재도전성공패키지 지원사업의 주관기관을 기관 1곳당 한 행으로 담은 전국 단위 목록 파일로, 지역·주관기관명·기관유형(일반형, IP전략형 등)·기관구분(공공기관, 대학, 민간창업지원기관)·주소를 담는다. 재창업을 준비하는 사람이 '우리 지역에서 재도전성공패키지를 운영하는 기관은 어디인가'를 찾을 때 쓰고, 분석가는 재도전 창업지원 기관의 지역별 분포를 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주관기관명이나 주소(지역) 문자열을 맞춰 연결해야 한다.
description_portal: 해당 데이터는 창업진흥원이 운영하는 재도전성공패키지 지원사업의 주관기관 정보를 담고 있으며, 번호, 지역, 주관기관명, 기관유형(일반형, IP전략형 등), 기관구분(공공기관, 대학, 민간창업지원기관), 주소 및 상세주소 항목으로 구성되어 있습니다. 서울, 대구, 경기, 전북 등 전국 각지의 주관기관이 포함되어 있으며, 각 기관의 유형과 구분에 따라 창업 실패 이후 재도전 창업자에게 특화된 맞춤형 지원을 제공하고 있습니다. 이 데이터는 정책 수립 시 재도전 창업지원 인프라의 지역별 분포나 기관별 특화 전략을 분석하는 데 유용하며, 재도전자 입장에서는 본인의 상황에 적합한 기관을 탐색하고 상담·교육·멘토링 등 프로그램을 효과적으로 연계받는 데 활용될 수 있도록 구성되어 있습니다.
