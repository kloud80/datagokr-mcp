summary_user: 충청북도에서 도(1MW~3MW)와 시·군(1MW 미만)이 허가하고 사업을 개시한 발전사업용 태양광발전소를 발전소 한 곳당 한 행으로 담은 CSV 파일로, 설치장소·설비용량(kW)·상태·허가일자·사업개시일자를 포함한다. 사업자나 분석가가 "충북 어느 시·군에 소규모 태양광발전소 허가가 몰려 있고, 연도별로 얼마나 늘었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 설치장소의 시·군 이름을 기준으로 다른 지역 통계나 신재생 발전소 원장과 맞춰 붙여야 한다.
description_portal: 충청북도 태양광발전소 현황은 발전사업용 태양광발전소를 대상으로 하며, 도(1MW~3MW) 및 시·군(1MW 미만)에서 허가를 받고 사업을 개시한 발전소를 기준으로 구성된 자료입니다.공개되는 항목은 발전소명, 설치 장소, 설비용량(kW), 허가일자, 사업개시일자입니다.※ 본 자료는 자가소비용 태양광발전소는 포함되어 있지 않으며, 발전사업용 태양광발전소만을 대상으로 합니다.현재 업로드된 파일은 CSV 형식이므로, 다소 보기에 불편하실 수 있습니다.XLSX 파일이 필요하신 경우, 충청북도청 전기사업 담당자(043-220-3283)에게 문의해 주시기 바랍니다.
