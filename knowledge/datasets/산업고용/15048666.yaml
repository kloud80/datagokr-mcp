summary_user: 시흥시 공공청사에 설치된 자가용 태양광 발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 발전소명·지번/도로명 주소·위경도 좌표·설비용량(킬로와트)·데이터기준일을 포함한다(포털 설명상 52건). 지자체 에너지 담당자나 분석가가 '시흥시 공공건물 어디에 태양광이 얼마 규모로 깔려 있나'를 지도에 표시하거나 공공부문 재생에너지 설비 용량을 합산하는 데 쓴다. 전역 조인 키는 없어서 주소·좌표를 기준으로 공간 결합하거나 발전소명·주소 매칭으로 전국 태양광발전소 전기사업허가 표준데이터 같은 발전소 원장과 이어 쓴다.
limits: 시흥시 한 곳의 공공청사 자가용 설비만 담아 민간·사업용 발전소나 다른 시군구와는 비교할 수 없다. 공통 코드 키가 없어 다른 데이터와 연결하려면 이름·주소 매칭에 기대야 한다. 발전량 같은 운영 실적은 필드에 없다.
