summary_user: 경기도 내에 지정된 채석단지를 단지별로 담은 현황 데이터로, 시군명·시군코드, 신청자명, 지정일자(고시번호), 지정면적(㎡), 소재지 지번주소, 비고를 담는다. 산지 개발 계획이나 개발행위 검토를 하는 분석가·공무원이 "우리 시군에 채석단지가 어디에 얼마나 큰 규모로 지정돼 있고 운영주체는 누구인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명으로 경기도 기관의 다른 시군 단위 데이터와 잇거나, 지번주소를 주소 매핑해 토석채취 허가·국토 공간 규제 자료와 겹쳐 본다.
description_portal: 이 데이터는 경기도 내에 지정된 채석단지의 현황을 제공하며, 각 단지의 신청자명, 지정일자(고시번호), 지정면적(㎡), 소재지 지번주소 등으로 구성되어 있습니다. 채석단지는 토석 채취를 목적으로 일정 구역을 행정적으로 지정한 지역으로, 산지관리법 및 관련 시행령에 따라 관리됩니다. 데이터는 시군명 및 시군코드를 기준으로 분류되며, 산지의 합리적인 이용 및 환경 보전을 위한 토석채취 행위의 공간 분포와 규모를 파악하는 데 유용합니다. 특히 지정면적과 신청자 정보는 채석단지의 규모 및 운영주체를 확인할 수 있는 중요한 항목이며, 공간정보 기반의 개발행위 분석, 산지 개발 계획 수립, 산림 자원 관리 정책 등에 활용될 수 있습니다.
