description_portal: 데이터는 업력, 업종, 기업형태, 창업자 성별과 연령을 기준으로 고졸 창업자의 전공 계열별 분포를 제시하고 있습니다. 전공 계열은 인문계, 실업계, 예체능계, 기타로 구분됩니다. 업력 구간에서는 실업계 출신이 가장 높은 비율을 보이며, 업력이 증가할수록 인문계 출신 비율도 일부 증가하는 경향이 나타납니다. 업종별로는 운수 및 창고업, 수도 하수 및 폐기물 처리업, 숙박 및 음식점업 등에서 실업계 출신의 비율이 높고, 예체능계는 숙박 및 음식점업, 도매 및 소매업에서 다소 높은 비율을 보입니다. 기업형태별로는 개인 기업에서 실업계와 예체능계 출신 비율이 상대적으로 높습니다. 성별에 따라 여성은 예체능계 출신 비율이 높고, 연령대별로는 20대 이하에서 예체능계 비율이 가장 높게 나타납니다. 본 데이터는 고졸 창업자의 전공 계열별 특성과 업종 및 창업 형태 간의 연관성을 분석하는 데 활용할 수 있습니다.
