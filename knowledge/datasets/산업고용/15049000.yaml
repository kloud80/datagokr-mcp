summary_user: 고졸 창업자의 전공 계열(인문계·실업계·예체능계·기타) 분포를 업력, 업종, 기업형태, 창업자 성별·연령 구분별로 집계한 전국 단위 통계표로, 건별 기업 원장이 아닌 1KB 남짓(1,362바이트)의 작은 CSV 파일이다. 창업 정책 분석가나 연구자가 '어떤 업종·연령대의 고졸 창업자가 실업계 출신이 많은가', '여성·20대 이하 창업자의 예체능계 비중은 어느 정도인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명·연령대 같은 구분 이름을 맞춰 붙여야 하며, 같은 기관의 창업자 전공정보(대졸 등) 통계와 나란히 비교하는 용도가 현실적이다.
limits: 구분별 비율 집계표라 개별 창업기업이나 사업자번호 단위로 내려가 분석하거나 기업 인증 원장과 직접 연결할 수 없다. 공통 코드 없이 구분 이름으로만 다른 표와 맞출 수 있고, 지역별 분포 없이 전국 단위로만 제공된다.
