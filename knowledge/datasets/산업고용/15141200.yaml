summary_user: 한국전력거래소 수요자원거래시스템의 플러스DR(전기 사용을 늘려 신재생 출력제어를 줄이는 수요반응) 입찰량·낙찰량·이행량을 거래일자와 지역별로, 10시~18시 시간대별 MWh 단위로 담은 집계 데이터다. 에너지 분석가나 수요자원 사업자가 특정 거래일에 지역별로 플러스DR이 몇 시에 얼마나 낙찰되고 실제로 얼마나 이행됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 전력 수급·발전량 데이터와는 거래일자(tradeDay)와 지역명(areaNm)을 이름으로 맞춰 연결해야 한다.
limits: 표준 지역코드 같은 공통 키가 없어 다른 데이터와는 지역 이름 매핑으로만 붙일 수 있다. 개발계정은 하루 100회 호출로 제한된다.
