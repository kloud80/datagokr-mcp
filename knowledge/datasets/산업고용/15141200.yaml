description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.단위 : MWhㅁ 수요자원시장이란전기 사용자가 전기시장가격이 높을 때 또는 전력계통 위기시 아낀 전기를 전력시장에 판매하고 금전으로 보상받는 제도입니다. 수요반응자원 참여고객은 비상대응 의무감축과 자발적 수요감축을 통하여 수요자원시장에 참여 가능합니다.ㅁ 플러스 DR 이란자발적으로 전기사용량을 늘리고, 신재생 출력제어를 줄이는 수요반응제도 입니다.해당 데이터는 한국전력거래소 수요자원거래시스템 플러스DR 입낙찰량 현황을 시간별, 지역별로 구분한 데이터로 이행량을 함께 제공합니다.ㅇ 링크 : https://dr.kmos.kr/nx/nxIndex.doㅇ 갱신주기 : 1일 1회 (23시 00분)'
