description_portal: '도약프로그램 지역별 종업원 수별 선정 현황은 해당연도 지역별 종업원수별 도약프로그램 선정기업 수에 대한 데이터를 제공합니다.(행-지역, 열-종업원 수인 매트릭스 형태의 데이터)도약프로그램은 중소벤처기업진흥공단이 스케일업 의지 및 성장역량을 보유하고 중견기업으로의 도약을 추진 중인 중기업을 대상으로 전담 디렉터, 전략·기술 서포터가 협업하여 중견(후보)기업 도약(Jump-Up)을 위한 디렉팅을 제공하는 사업입니다.- 전략 서포터 : 신사업 추진 전략수립에 탁월한 컨설턴트를 활용하여 신사업 진출을 위한 비즈니스 모델 체계화·구체화 지원- 기술 서포터 : 5대 전략분야 관련 연구를 수행 중인 연구원을 활용하여 신기술 개발기획 및 기술 솔루션 등을 지원* 2025년 데이터부터 제공합니다.'
