description_portal: 이 데이터는 제주국제자유도시개발센터에서 제공하는 온라인 면세점 고객의 구매 내역에 대한 파일입니다. 성별, 연령대, 구매월, 물품 구매개수, 총구매금액을 포함한 온라인면세점 고객의 구매 내역에 대한 개인정보를 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 실제 고객 데이터의 구조와 통계적 특성을 반영하되, 개인식별정보를 제거하여 개인식별 위험성을 방지했습니다. 각 행은 가상의 고객 프로필을 표현하므로 개인 단위 분석이 가능하지만 원본 고객을 특정할 수 없도록 설계되었습니다. 이를 통해 시기별·연령대별 객단가 소비 성향을 파악하고 상품 판매 전략 수립, 프로모션 효과 검증, 신규 고객층 발굴 등 다양한 분석 목적으로 활용할 수 있으며, 나아가 온라인 면세점 운영 및 관광산업 정책 연구에도 기초자료로 활용할 수 있습니다.
