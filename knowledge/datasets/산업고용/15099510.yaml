summary_user: "전주시가 2017년부터 추진한 베란다형 태양광 보급사업의 설치 내역을 공동주택 단위로 담은 파일로, 공동주택명·주소·설치가구수·설비용량(킬로와트)·설치연도를 기록한다(csv 약 5KB). 전주시 시민이나 정책 분석가가 '어느 아파트 단지에 몇 가구가 베란다 태양광을 달았고 연도별 보급 용량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 공동주택 주소를 주소·이름 매핑으로 다른 데이터(예: 전국 태양광 발전사업 허가 표준데이터 등 발전소 단위 원장)와 맞춰 쓰는 방식으로만 이어 쓴다."
description_portal: '전북특별자치도 전주시 베란다형 태양광 설비 현황으로 2017년부터 진행한 베란다형 태양광 보급사업과 관련한 데이터를 제공하며 공동주택명, 공동주택주소, 설치가구수, 설비용량, 설치연도를 제공합니다.담당부서 : 맑은공기에너지과전주시민의 에너지 자립도와 신재생에너지 보급률을 분석 가능 , 설비용량 및 설치 위치를 통해 지역별 보급 현황 파악정책 연구, 환경영향 평가, 시민 참여형 에너지 프로그램 성과 분석에 활용 가능합니다.또한, 대규모 발전소가 아닌 생활 속 태양광 설비 보급 현황을 보여주며, 전주시가 추진하는 분산형 에너지 정책의 성과를 확인할 수 있는 중요한 자료입니다.'
