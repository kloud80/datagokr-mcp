description_portal: 한국가스공사 통영기지본부의 피뢰설비 현황 데이터 입니다.피뢰설비는 낙뢰로 인한 뇌격전류를 신속히 대지로 방전시켜 정전, 누전, 화재, 전기설비 손상, 열폭주 등의 피해로부터 구조물, 전기기계기구, 인명을 보호하는 핵심 안전 시설입니다. 본 데이터는 낙뢰 안전 관리 및 피뢰설비 운영 현황 파악을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 피뢰설비 구분, 피뢰설비명, 설치 위치, 수량 등의 정보가 포함되어 있습니다. 본 데이터를 활용하면 통영기지 피뢰설비 현황 파악 및 보호 범위 분석, 피뢰 취약 지점 도출 및 보완 계획 수립, 신규 피뢰설비 설치 시 중복성 및 공백 확인, 낙뢰 안전 대책 수립에 기초자료로 활용할 수 있어 LNG 생산기지의 낙뢰 안전사고 예방과 설비 보호 체계 강화에 기여할 것으로 기대됩니다.
