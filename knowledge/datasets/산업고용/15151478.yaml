description_portal: '한국지역난방공사의 지역난방 공급구역 및 허가세대수 현황 데이터를 정리한 자료로, 각 지사별로 관리하는 난방 공급 지역과 허가된 세대 수를 집계하여 지역난방 보급 규모 및 인프라 확충 현황을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 실적일자: 공급구역 및 세대수가 집계된 기준일(예시: 2023-12-31)■ 지사명: 지역난방 공급을 담당하는 지사 또는 사업소명(예시: 강남지사, 중앙지사, 고양사업소, 삼송지사, 용인지사)■ 공급구역명: 해당 지사가 관리하는 난방 공급지역의 명칭(예시: 수서, 일원, 상암, 덕은, 원흥, 용인 등)■ 허가세대수: 해당 지역에 지역난방 공급이 허가된 세대 수(예시: 227,533세대, 108,651세대, 202,008세대)3. 활용 예제:■ 지사별 지역난방 공급세대 현황을 분석하여 지역별 난방 보급률 및 서비스 범위 평가■ 공급구역 확장 및 신규 개발지 난방 인프라 구축 계획 수립 시 기초자료로 활용■ 세대수 데이터를 기반으로 지역난방 수요예측, 에너지 공급계획, 시설용량 산정 등에 활용'
