description_portal: 서울에너지공사의 월별 열 판매량 정보를 제공하는 공공데이터이다. 본 자료는 지역난방 열원의 상업적 공급 실적을 기반으로 하며, 열에너지의 실제 판매량과 관련된 정보를 포함한다. 주요 항목은 판매월, 지사명, 공급대상, 판매량(Gcal), 열단가, 총판매금액 등으로 구성된다. 열판매량은 각 지사별로 사용자에게 유상으로 공급된 열에너지의 양을 의미하며, 지사별 수익 구조, 지역별 수요 특성, 계절적 변동 요인 등을 분석하는 데 활용된다. 본 데이터는 공공기관의 에너지 판매 실적 분석, 열요금 책정 기준 검토, 지역별 판매 전략 수립 등의 실무적인 참고자료로 활용 가능하다. 또한 열에너지의 효율적 운영과 정책 수립을 위한 기초자료로서 활용도가 높다.
