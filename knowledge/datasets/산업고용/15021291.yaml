summary_user: 인천광역시 계양구에서 담배소매인으로 지정된 업소를 한 곳씩 담은 개별 목록으로, 상호와 소재지주소, 데이터기준일을 담는다. 예비 창업자나 분석가가 "계양구 안 특정 동네에 이미 담배소매점이 얼마나, 어디에 있나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지주소를 주소 정제·지오코딩하거나 상호명으로 맞춰 LOCALDATA 담배소매업 인허가 원장이나 소상공인 상가업소 정보와 이어 쓴다.
limits: 사업자번호·좌표·인허가 코드 같은 공통 키가 없어 다른 데이터와 바로 결합되지 않고, 주소·상호 매칭에 의존해야 한다. 범위는 계양구 한 곳뿐이라 인천시 전체나 다른 구와 비교하려면 별도 데이터를 모아야 한다.
