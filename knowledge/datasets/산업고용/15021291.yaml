description_portal: 이 데이터파일은 인천광역시 계양구 내 담배소매인 지정 현황을 체계적으로 정리한 자료입니다. 주요 항목으로는 각 소매인의 고유 순번, 상호명, 그리고 정확한 위치 파악을 위한 소재지주소가 포함되어 있습니다. 또한 데이터의 기준일자를 명시하여 최신 정보를 제공합니다. 본 데이터는 담배소매인의 분포 현황을 파악하고 관련 행정 업무 및 정책 수립에 중요한 기초 자료로 활용됩니다. 지역 경제 활성화 및 담배 판매 관리에 유용하며, 주민과 관계 기관의 편리한 정보 접근을 지원합니다.추가 문의사항은 **인천광역시 계양구 지역경제과(032-450-5485)**로 연락해 주시기 바랍니다.
