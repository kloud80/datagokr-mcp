summary_user: 경기도 포천시 관내 주유소를 한 곳씩 상호명, 도로명 소재지, 영업구분, 전화번호, 데이터기준일자로 담은 시군구 단위 개별 목록 파일(CSV 약 9KB)이다. 포천시 주민이나 물류·지역 분석가가 "포천시 안에서 영업 중인 주유소가 어디에 몇 곳 있나"를 확인하고 분포를 볼 때 쓴다. 전역 조인 키나 주유소 ID·좌표가 없어서 오피넷 유가나 전국 주유소 표준데이터와는 상호명·도로명주소를 맞춰 붙여야 하고, 행정구역 연계도 주소를 기준으로 한다.
description_portal: 경기도 포천시에서 제공하는 주유소 현황 데이터입니다. 본 데이터는 포천시 관내에서 운영 중인 주유소의 기본 현황을 제공하는 자료로, 사업장명, 사업장 지번주소, 사업장 도로명주소, 전화번호, 영업여부 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내 주유소의 위치와 분포, 운영 현황을 확인할 수 있으며, 에너지 공급시설 현황 분석, 교통 및 생활 인프라 분석, 지역경제 및 물류 관련 기초자료로 활용할 수 있습니다. 또한 사업장 주소 정보를 기반으로 행정구역, 교통, 도로망, 생활편의시설 등 다양한 공공데이터와 연계·분석이 가능하여 지역 기반시설 현황 분석에 활용할 수 있는 공공데이터입니다.
