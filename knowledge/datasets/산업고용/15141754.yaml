summary_user: 서울특별시 용산구 관내 고압가스업(제조·저장·판매) 인허가 업소를 업소 한 건씩 담은 원장으로, 인허가일자·영업상태·폐업일자·소재지 지번/도로명 주소·업소명·좌표(X, Y) 등을 포함한다. 주민이나 안전관리 담당자가 '우리 동네에 영업 중인 고압가스 판매·저장 업소가 어디에 있나'를 확인하거나, 분석가가 지역 내 고압가스 업소의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓰며, 같은 LOCALDATA 계열의 석유판매·LPG·도시가스 등 에너지 업종 인허가 원장과 나란히 비교하는 데 맞다.
description_portal: 서울특별시 용산구 관내 고압가스업 인허가 정보(연번, 업소명, 소재지, 대표자, 허가종류, 전화번호, 비고)를 제공하는 데이터입니다. 본 정보는 「고압가스 안전관리법」에 따라 허가·신고되어 관리되는 시설을 대상으로 하며, 세부 업종에는 △고압가스 제조업(가스를 생산·충전하여 공급하는 업소), △고압가스 저장업(대량으로 저장·보관하는 시설), △고압가스 판매업(산업체, 연구기관, 의료기관 등에 유통하는 업소) 등이 포함됩니다. 이 데이터는 지역 내 고압가스 유통 현황 파악, 안전관리, 정책 수립, 민원 대응에 활용되며, 산업과 생활 전반에 필수적인 에너지 공급망의 투명성과 안정성을 높입니다. 또한 행정안전부 공공데이터 개방 표준에 따라 정기적으로 현행화되어 시민, 기업, 연구자가 안전관리 계획, 시장 분석, 정책 연구 등 다양한 목적으로 활용할 수 있도록 지원합니다.
