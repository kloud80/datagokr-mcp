description_portal: '고용노동부의 다우리포털 내 소통·지식 기관 관리 데이터는 각 기관의 기본 정보와 활동 현황을 체계적으로 관리하기 위한 자료입니다. 이 데이터에는 기관코드, 기관명, 기관구분과 같은 식별 정보뿐만 아니라 청렴마일리지, 그룹명, 숨은일꾼찾기와 같은 활동 및 평가 지표도 포함되어 있습니다. 예를 들어, ‘기관코드: C102’, ‘기관명: 서울고용센터’, ‘기관구분: 지역기관’, ‘그룹명: 수도권그룹’, ‘청렴마일리지: 85점’, ‘숨은일꾼찾기: 참여중’으로 등록된 경우, 해당 정보는 기관별 청렴도 관리, 내부 소통 활성화, 지식 공유 활동 평가 등에 활용됩니다. 이를 통해 조직의 투명성과 협업 문화를 제고하고 효율적인 행정 운영을 지원할 수 있습니다.'
