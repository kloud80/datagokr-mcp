summary_user: 국가기술은행(NTB)에 모인 판매기술 정보(판매기술번호·기술명·산업/과학기술 분류·거래 정보)와 관련 연구과제 정보(과제번호·과제명·주관·연구기관·연구기간)를 건별로 조회하는 전국 범위의 API입니다. 기업이나 연구자가 "우리 분야에서 이전받을 수 있는 기술은 무엇이고, 어느 기관이 관련 과제를 수행했나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 기술이전·과제 데이터와는 기술명·기관명 같은 이름 매칭이나 같은 기관의 자체 코드로만 연결한다.
description_portal: 한국산업기술진흥원 기술시장정보 및 부가정보 DB 서비스는 국가기술은행(NTB)에 수집된 다양한 기술정보와 과제정보를 포괄적으로 제공하는 중요 서비스 입니다. 이 서비스는 판매기술번호와 판매기술명, 그리고 해당 기술이 속하는 산업 및 과학기술 분야의 분류 정보, 기술 거래 정보를 포함하고 있습니다. 이와 함께 제공되는 과제정보는 과제번호, 과제명, 주관기관명칭, 연구기관명칭, 연구 시작일 및 연구 종료일 등의 세부 정보를 포함하고 있어 기술 개발과 연구 프로젝트에 필요한 다양한 정보를 체계적으로 제공하고 있습니다. 이를 통해 사용자는 최신 기술 동향을 파악하고 적합한 기술 거래를 추진할 수 있는 유용한 정보를 얻을 수 있습니다. 본 API 데이터는 연구자, 기업, 정부기관 등에서 활용될 수 있으며 기술 혁신 및 산업 발전에 기여할 수 있습니다. 또한, 제공되는 서비스는 다양한 작업기능을 포함하고 있으며 기술은행 기술시장정보 및 부가정보 DB 서비스 조회를 통해 필요한 정보를 효율적으로 얻을 수 있습니다. 이 외에도 특별한 기술 매칭 서비스와 정보 제공 기능 등을 활용할 수 있습니다. 예를 들어, 특정 기술에 대한 세부 정보와 거래 가능성을 조사하거나 특정 주관기관에서 수행 중인 연구 과제를 확인하여 협력 가능한 연구 주제를 발굴할 수 있습니다.
