summary_user: 경상남도 창녕군 안의 태양광발전소를 발전소 한 곳당 한 행으로 담은 개별 원장으로, 상호·발전소 주소·설비용량(kW)·설치 위치·허가일자·사업개시일을 담는다. 주민이나 사업자, 에너지 분석가가 창녕군 어느 읍·면에 어느 규모의 태양광발전소가 언제 허가·가동됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소 주소나 상호를 매칭하는 방식으로만 잇는다. 전국태양광발전소전기사업허가정보표준데이터와도 같은 방식으로 대조한다.
description_portal: 경상남도 창녕군 내 태양광발전소 현황 정보입니다.1. 태양광발전소 상호, 발전소의 주소, 태양광 발전 용량(KW), 태양광 설치위치, 허가일자, 사업개시일 데이터를 제공하고 있습니다.2. 데이터 기준일은 2026년 5월 11일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 설치위치가 없는 자료가 있습니다.4. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 건설산업국 일자리경제과 에너지정책팀 055-530-1085로 문의 주시기 바랍니다.
