summary_user: 한국가스공사 대구경북지역본부가 보유한 전기차를 차량 단위로 적은 목록이며, 구분·제작사·모델명·도입 연월일·운용부서를 담은 183바이트짜리 작은 CSV 파일입니다. 공공기관의 친환경 차량 도입 실적을 살피는 분석가나 ESG 담당자가 '이 지역본부는 언제, 어떤 제작사의 전기차를 몇 대 들여와 어느 부서에서 쓰는가'를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제작사·모델명 같은 이름 매핑이나 같은 기관(한국가스공사) 기준으로만 이어 씁니다.
description_portal: 한국가스공사 대구경북지역본부의 전기차 운영 현황 데이터 입니다. 친환경 차량 도입현황 관리 및 ESG 경영성과 분석, 탄소저감 실적 평가, 차량 운영 효율화를 목적으로 수집되었습니다. 데이터 구성항목은 구분, 제작사, 모델명, 도입 연월일, 운용부서 등으로 이루어져 있어 전기차 보유 현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 전기차 도입 현황 분석, 제작사별/모델별 분포 파악, 도입시기별 추이 분석, 부서별 운용 현황 파악, 차량 노후도 분석이 가능합니다.또한 전기차 확대 도입 계획 수립, 차량 교체 계획 수립, ESG 경영성과 보고, 충전인프라 수요 분석, 운영비용 분석에 활용됩니다. 대구경북지역의 친환경 차량 운영 현황 관리에 기초자료로 활용되어 탄소중립 목표 달성과 친환경 경영 추진을 지원합니다.
