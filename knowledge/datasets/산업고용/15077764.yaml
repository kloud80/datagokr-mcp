description_portal: '[유통산업발전법] 제2조(정의)3. “대규모점포”란 다음 각 목의 요건을 모두 갖춘 매장을 보유한 점포의 집단으로서 별표에 규정된 것을 말한다.  가. 하나 또는 대통령령으로 정하는 둘 이상의 연접되어 있는 건물 안에 하나 또는 여러 개로 나누어 설치되는 매장일 것  나. 상시 운영되는 매장일 것  다. 매장면적의 합계가 3천제곱미터 이상일 것4. “준대규모점포”란 다음 각 목의 어느 하나에 해당하는 점포로서 대통령령으로 정하는 것을 말한다.  가. 대규모점포를 경영하는 회사 또는 그 계열회사(「독점규제 및 공정거래에 관한 법률」에 따른 계열회사를 말한다)가 직영하는 점포  나. 「독점규제 및 공정거래에 관한 법률」에 따른 상호출자제한기업집단의 계열회사가 직영하는 점포  다. 가목 및 나목의 회사 또는 계열회사가 제6호가목에 따른 직영점형 체인사업 및 같은 호 나목에 따른 프랜차이즈형 체인사업의 형태로 운영하는 점포제8조(대규모점포등의 개설등록 및 변경등록) ① 대규모점포를 개설하거나 제13조의3에 따른 전통상업보존구역에 준대규모점포를 개설하려는 자는 영업을 시작하기 전에 산업통상자원부령으로 정하는 바에 따라 상권영향평가서 및 지역협력계획서를 첨부하여 특별자치시장ㆍ시장ㆍ군수ㆍ구청장에게 등록하여야 한다. 등록한 내용을 변경하려는 경우에도 또한 같다.'
