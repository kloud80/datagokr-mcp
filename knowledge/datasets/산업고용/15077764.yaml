summary_user: 부산 해운대구에 등록된 대규모점포를 점포 한 곳당 한 행으로 담은 CSV 파일(약 3KB)로, 구분·시설명·소재지·매장면적·연락처·허가일·전통상업보존구역 해당 여부가 들어 있다. 해운대구에서 장사를 준비하는 사업자나 상권 분석가가 '이 동네에 매장면적 몇 제곱미터짜리 대형마트·백화점이 어디에 있고 언제 개설됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰 붙여야 하며, 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 원장과 이름·주소 기준으로 대조해 쓴다.
limits: 해운대구 한 곳의 점포만 담아 부산시 전체나 다른 구와 비교하려면 다른 기관 자료를 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와 연결할 때는 시설명·주소 문자열 매칭에 의존한다.
