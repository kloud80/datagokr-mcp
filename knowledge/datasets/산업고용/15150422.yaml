description_portal: 본 데이터는 공공데이터 포털에 개방중인 데이터를 대상으로 AI 친화여부를 자체점검한 결과와 점검결과 AI 활용가치가 높은 상위 9개 파일데이터를 직접 활용할 수 있도록 제공하는 학습데이터 9건입니다. 시계열성, 완결성, 신뢰성, 범용성, 데이터 규모를 기준으로 20점 만점 중 16점 이상의 상위 데이터는 직접 편집하여 제공합니다.제공 데이터는 자체 태양광 발전설비 전력판매 실적, 방사성동위원소 시설주기검사 측정기록, 화학물질 사용신청 정보, 원전 설비 단종품 목록유자격 공급자 현황, 별도공사 화학물질 정보, 원전 방사성폐기물 관리현황, 도암댐 방류량 시자료, 국내 물품(구매)계약 체결현황 등 입니다.
