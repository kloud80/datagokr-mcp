summary_user: 충청북도 진천군이 골재채취를 허가한 내역을 허가 건별로 담은 파일로, 허가번호·허가일자·토지소재지·지목과 채취장·반출로·야적장 면적, 채취량, 채취·반출 기한, 복구준공검사 신청일·원상복구 완료일·준공 여부를 기록한다(csv 약 1.9KB로 건수가 적다). 진천군에서 어느 필지에서 골재채취 허가가 났고 채취 기한이 지난 뒤 원상복구가 끝났는지를 확인하려는 주민·건설업자·분석가가 쓴다. 전역 조인 키는 없어, 토지소재지(주소)를 기준으로 지적·토지이용규제 등 국토 공간 데이터와 맞춰 보거나 다른 시군의 골재·토석채취 허가 자료와 이름 기준으로 묶어 쓴다.
description_portal: “골재”란 하천, 산림, 공유수면이나 그 밖의 지상ㆍ지하 등 자연상태에 부존(賦存)하는 암석[쇄석용(碎石用)에 한정한다], 모래 또는 자갈로서 콘크리트 및 아스팔트콘크리트의 재료 또는 그 밖에 건설공사의 기초재료로 쓰이는 것을 말하며, “채취”란 골재를 캐거나 들어내는 등 자연상태로부터 분리하여 내는 것을 말합니다.골재를 채취하려는 자는 대통령령으로 정하는 바에 따라 관할 시장ㆍ군수 또는 구청장의 허가를 받아야 합니다.충청북도 진천군의 골재채취허가정보는 골재채취를 위해 허가받은 내역을 정리한 자료로, 허가번호, 허가일자, 토지소재지, 지목, 채취장면적, 채취량, 반출로면적, 야적장면적, 허가(채취)기한, 반출기한, 복구준공검사신청일, 운상복구완료일, 준공여부 등 항목으로 구성되어 있습니다.본 데이터는 「골재채취법」 등 관련 법령에 따라 관할 지자체의 허가를 받은 내역을 바탕으로 수집된 자료로, 토지 이용 현황 분석, 건설 자원 관리, 환경 복구 상태 확인, 허가기간 관리 등 각종 행정업무 및 정책 수립의 기초자료로 활용될 수 있습니다.
