summary_user: 한국중부발전이 운영하는 발전설비를 본부·호기 단위로 한 줄씩 정리한 파일(csv, 약 2KB)로, 위치·설비용량(MW)·발전형식·사용연료·준공일을 담는다. 에너지 분석가나 연구자가 "중부발전 설비 중 석탄을 쓰는 호기는 몇 MW이고 준공한 지 얼마나 됐나"처럼 연료 구성과 설비 노후도를 따질 때 쓴다. 본부명과 호기를 묶은 키(komipo_plant_unit)로 같은 기관의 호기별 발전량·운영 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국중부발전이 운영 중인 발전 사업소별 사용연료 종류 및 발전형식 관련 정보를 정리한 자료입니다. 항목은 본부명, 호기, 위치, 설비용량(MW), 발전형식, 사용연료, 준공일로 구성되어 있으며, 발전설비별 에너지원 구성과 구조적 특성을 확인할 수 있습니다. 해당 자료는 발전소의 설비 규모, 연료 다변화 현황, 지역별 발전 포트폴리오, 설비 노후도 등을 종합적으로 파악하는 데 활용 가능합니다. 또한 탄소중립 대응 전략 수립, 연료 전환 타당성 검토, 발전형식별 운영 특성 분석 등 다양한 분야의 기초자료로 활용 가능합니다.
