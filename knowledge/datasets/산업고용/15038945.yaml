summary_user: 인천광역시 남동구에 영업신고된 세탁업소를 업소 한 곳당 한 행으로 담은 건별 목록으로, 업종명·업소명·도로명 주소·전화번호·데이터 기준일자를 담는다(CSV 약 18KB). 주민이나 창업 준비자가 '남동구 우리 동네 근처에 세탁소가 어디에 몇 곳 있나'를 확인하거나, 분석가가 구 안의 세탁업소 분포를 볼 때 쓴다. 전역 조인 키(사업자번호·좌표 등)는 실측 컬럼에 없어서, 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
limits: 사업자번호나 좌표 같은 공통 키가 없어 LOCALDATA 인허가 원장이나 상가업소 데이터와 바로 조인되지 않고, 주소·업소명 문자열 매칭이 필요하다. 범위는 남동구 한 곳이라 인천 전체나 다른 시군구 비교에는 별도 자료가 필요하다.
