summary_user: 한국지역난방공사가 도입한 연료량을 연도별로 집계한 작은 파일(csv 386바이트)로, 부생연료유·감압정제유(리터), 천연가스·매립지가스(백만입방미터), 우드칩(톤)을 전국 단위로 담는다. 분석가가 '지역난방 연료 구성이 해마다 어떻게 바뀌고 천연가스 비중은 얼마인가' 같은 연료 도입 추이와 연료별 비중을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도입년도(연도) 기준으로 맞추거나 같은 기관 자료와 이름으로 연결해 쓴다.
limits: 전국·비공간 연도 집계라 지사·열원시설별, 월별 도입량은 볼 수 없다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 연도나 이름 매핑으로만 연결된다. 포털 설명 첫 문장은 KOLAS 인증 기자재 내용으로 실제 컬럼과 맞지 않으니 컬럼 기준으로 해석한다.
