summary_user: '대전광역시 내 대한전문건설협회 소속 전문건설업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 100KB)로, 건설 업종·상호명·소재지·연락처를 담는다. 대전에서 특정 전문건설 업종(예: 철근콘크리트, 도장 등) 업체가 어느 구에 몇 곳 있는지, 협력·하도급 후보 업체 연락처가 무엇인지 찾는 사업자나 지역 건설산업 분포를 보는 분석가가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호명·주소(소재지)를 이름 매칭하거나 주소를 지오코딩해 지방행정 인허가(LOCALDATA) 건설업 원장 등과 맞춰 쓴다.'
description_portal: 대전광역시 대한전문건설협회 업체 현황 자료는 대전 지역 내 전문건설업체들의 상세 정보를 포함하고 있습니다. 이 자료는 각 업체의 건설 업종, 상호명, 소재지, 전화번호 등 기본 연락처 정보를 제공하여 지역 내 전문건설업체 분포와 특성을 파악할 수 있게 합니다. 또한, 업체 별 위치와 업종별 분류를 통해 건설 산업의 현황 및 시장 구조 분석이 가능하며, 지역 건설 산업 활성화, 협력 네트워크 구축, 공공 및 민간 건설 사업 참여 기회 탐색 등에 활용됩니다. 해당 자료는 대전광역시 주택정책과에서 관리하며, 연간 단위로 갱신 되어 최신 업체 정보를 반영합니다.
