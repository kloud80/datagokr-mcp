description_portal: 해당 자료는 용도별 월 공급량 자료 입니다. 용도의 구분은 도시가스,발전용이며 월별 사용량 자료 입니다.해당 데이터는 정산 시점에 따라 수치는 변동될수 있습니다.한국가스공사의 연도별 월별 전국 생산기지 천연가스(LNG) 용도별 월 공급량을 나타낸 자료이며, 해당 자료의 단위는 톤(ton)입니다. 해당 자료는 용도별 월 공급량 자료 입니다. 용도의 구분은 도시가스, 발전용이며 월별 공급량 자료 입니다. 공공데이터 공개 대상 자료는 2016년도 1월부터 현재까지의 약 10년간 한국가스공사 연도별 월별 전국의 생산기지 천연가스(LNG) 용도별 월 공급량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 데이터의 파일 형식은 csv 파일입니다.
