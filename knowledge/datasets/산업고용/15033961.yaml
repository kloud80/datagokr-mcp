summary_user: 충청북도 단양군에서 허가된 태양광발전시설을 한 행에 한 시설씩 담은 원장으로, 상호·설치장소 주소·설비용량(kW)·공급전압·주파수·허가일자·사업 준비기간을 담는다. 단양군 안에서 어느 지역에 어느 규모의 태양광 발전소가 언제 허가됐는지 확인하려는 주민·사업자·연구자가 쓴다. 전역 조인 키는 없어서, 설치장소 주소나 상호를 기준으로 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과 맞대어 이어 쓴다.
