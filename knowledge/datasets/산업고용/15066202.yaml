description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주혁신성장센터에 2020년 9월 기준으로 입주한 기업들의 현황을 나타낸 정보입니다. 각 데이터는 입주 기업에 대한 세부 정보를 담고 있으며, 주요 항목으로는 구분(분류), 구분(기수), 기업명, 업종, 사업내용, 대표자명으로 구성되어 있습니다. 구분(분류) 항목에는 ICT융합창업허브, 친환경스마트자동차연구센터, 드론산업 관련 공간 등 제주혁신성장센터 내 다양한 창업 및 기술 육성 공간이 포함되어 있으며, 구분(기수)는 입주 시기를 기준으로 1기, 2기, 3기 등으로 표시됩니다. 기업명과 업종 항목을 통해 각 기업이 어떤 산업 분야에 속하는지를 확인할 수 있으며, 사업내용 항목에는 각 기업이 수행 중인 주요 사업 및 제품, 서비스 설명이 기재되어 있어 기술이나 시장 특성을 파악하는 데 도움이 됩니다. 대표자명은 실질적인 경영 책임자를 확인할 수 있는 정보로, 입주 기업 현황 파악, 성과 분석, 창업 생태계 조성 현황 모니터링 등에 활용될 수 있습니다.
