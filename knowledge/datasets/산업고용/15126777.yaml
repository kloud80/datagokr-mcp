summary_user: 경상남도 하동군에 있는 건축 관련 제조 공장 업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 5KB)로, 업체명·업종·주력사업·설립일자·종업원수·도로명 주소와 위도·경도를 담는다. 지역 건설·건자재 업체를 찾는 사업자나 하동군 건축 관련 제조업 분포를 보는 분석가가 '하동군에 어떤 건축자재 공장이 어디에 있고 규모는 어느 정도인가' 같은 질문에 쓴다. 사업자등록번호(bizno)를 키로 다른 기업 현황·인허가(LOCALDATA) 데이터와 잇고, 위도·경도로 지도나 주변 상권 데이터와 겹쳐 본다.
