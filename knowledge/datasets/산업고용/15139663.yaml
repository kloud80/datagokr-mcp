summary_user: 한국동서발전이 운영하는 신재생에너지 발전소의 발전량을 기준일자·지역·발전소별로 담은 API 데이터이며, 범위는 전국이고 좌표 등 공간 정보는 없다. 연구자나 분석가가 '동서발전 신재생 발전소별 발전량이 날짜에 따라 어떻게 변하고 지역별로 얼마나 차이 나는가' 같은 시계열·지역 비교 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 전국태양광발전소 전기사업허가 표준데이터 같은 발전소 원장과는 발전소명·지역명을 이름으로 맞춰 이어 써야 한다.
description_portal: 한국동서발전에서 오픈API 형태로 제공하는 신재생에너지 현황 정보입니다. 해당 데이터는 기준일자, 지역, 발전소, 발전량(KWh) 등의 항목으로 구성되어 있으며, 자동화된 데이터 수집과 시스템 간 연계를 통해 다양한 응용 시스템과의 통합이 용이하고, 유연한 분석 환경을 제공합니다. 학계 및 연구기관에서는 신재생에너지 발전량의 시계열 분석, 지역별 에너지 생산 비교, 발전소 운영 효율성 평가, 정책 수립을 위한 재생에너지 공급 추이 분석, 공공에너지 분야의 디지털 연계 사례 연구 등에 활용할 수 있습니다.
