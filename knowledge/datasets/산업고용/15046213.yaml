description_portal: '한국장애인고용공단에서 실시하는 장애인 직업능력평가 도구 중 청각장애 청소년직업적성검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 합계점수, 백분위 등에 대한 정보를 제공합니다.* 청소년직업적성검사(청각장애): 직업생활에서 필요한 능력을 어느 정도 갖추고 있는지를 파악하기 위한 직업적성 검사로 KEAD 청소년직업적성검사(청각장애) 는 청각장애학생을 위한 직업적성검사로 직업생활에서 필요한 중요한 능력들이 어느 정도인지 알아보기 위한 검사입니다. 청각장애학생이 청소년 시기에 자신의 소질과 적성 영역을 보다 정확히 이해하고 객관적인 직업정보를 탐색하는데 도움을 줄 수 있습니다.'
