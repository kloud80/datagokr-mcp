summary_user: "한국가스기술공사가 운영하는 수소충전소별로 충전 실적(실적구분: 충전대수·충전량)을 2021년 6월부터 2024년 12월까지 월별 열로 펼쳐 담은 집계 CSV 파일(11,478바이트)이다. 수소차 이용자나 분석가가 '이 공사 운영 충전소 중 어느 곳의 월 충전량이 늘고 있나, 어느 달에 붐볐나'를 확인하는 데 쓴다. 충전소 ID·좌표 같은 전역 조인 키가 없어 다른 충전소 위치·실시간 데이터와는 충전소 이름을 직접 맞춰 이어야 한다."
limits: 충전소 ID나 공통 코드가 없어 다른 데이터와 자동으로 연결되지 않고 이름 매핑이 필요하다. 월별 누적 실적이라 실시간 혼잡도·대기시간·충전 가능 여부는 알 수 없고, 포털 설명과 달리 필드 목록에는 주소·좌표 열이 보이지 않으므로 받은 파일에서 위치 정보를 확인해야 한다.
