description_portal: '한국수력원자력이 전력거래시장에서 현재 운영중인 중앙급전 발전기 현황 자료입니다. 중앙급전 발전기란  전력거래소의 급전 지시에 따라 운전되는 발전기를 의미하며, 일반적으로 설비 용량이 20MW 이상인 발전기를 지칭합니다.○ 본 데이터는 아래와 같은 정보를 포함하고 있습니다. 1. 발전원 : 각 발전기의 발전원을 의미합니다. 현재 한수원에서 운영중인 중앙급전발전기의 발전원으로는 원자력, 수력, 양수가 있으며, 경우에 따라 추후 추가될 수 있습니다. 2. 호기명 : 해당하는 각 중앙급전 발전기의 개별 호기들 목록을 의미합니다.  3. 설비용량(단위: MW) : 중앙급전 발전기들 설비 용량을 의미하면 단위는 MW입니다.※ 본 데이터는 작성일 기준 전력거래소에 등록된 발전기 기준입니다.※ 신재생 발전기의 경우 대부분 설비용량이 20MW 미만이며 거래소의 급전지시를 따르지 못하므로 중앙급전발전기로 분류되지 않아 목록에선 제외됩니다.※ 본 데이터에서는 제주 VPP는 제외하였습니다.(소규모 설비를 묶어서 입찰 및 급전 수행하나 전통적인 형태의 중앙급전발전기로는 볼 수 없음)'
