description_portal: 한국동서발전의 사업소별 연간 소내전력량 정보는 각 발전소에서 자가 소비한 전력량을 연간 단위로 기록한 데이터로, 발전설비 운영의 에너지 효율성을 분석하는 데 활용되는 기초 자료입니다.해당 데이터는 사업소, 중분류(설비 또는 계통 구분), 호기(발전기 단위), 설비 용량(kW), 발전시간(HH), 소내전력량(kWh) 등의 항목으로 구성되어 있으며, 설비가 발전을 위해 자체적으로 소비한 전력량을 정량적으로 확인할 수 있습니다.소내전력은 펌프, 냉각장치, 제어설비 등 발전소 자체 운영에 필요한 전기 사용량을 의미하며, 발전소 전체 생산 전력 중 내부 소비 비중이 어느 정도인지를 분석할 수 있습니다.학계 및 연구기관에서는 이 데이터를 활용하여 발전소별 내부 소비 전력률 분석, 설비 효율성 비교, 소내전력 비중 변화 추이 파악, 발전소의 에너지 자립도 평가 등을 수행할 수 있습니다.또한 소내전력 사용량과 발전시간 간의 상관관계 분석, 에너지 절감 설비 도입 효과 평가, 공공기관의 에너지 효율 관리 전략 수립 등에도 실증 기반 자료로 활용될 수 있습니다.
