summary_user: 신재생에너지 설비 중 KS 인증을 받은 제품을 모델 단위로 담은 원장으로, 분야·품목·세부품목, 모델명, 기업명, 설비코드, 인증일자, 제조공장 소재국가를 전국 범위로 제공한다. 태양광 모듈 같은 설비를 구매·설치하려는 사업자나 소비자가 특정 모델이 KS 인증 제품인지, 어느 기업이 언제 인증받았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 모델명·기업명 같은 이름 매칭이나 같은 기관(한국에너지공단) 코드로만 연결한다.
limits: 전역 조인 키가 없어 발전소·신재생 설비 원장이나 다른 인증 데이터와 키로 바로 붙일 수 없고 이름 매칭에 의존해야 한다. 공간 정보가 없는 전국 단위 데이터라 지역별 분석에는 쓰지 못한다.
