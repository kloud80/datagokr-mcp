summary_user: 경기도 이천시에 지정된 담배소매인 사업장을 한 곳씩 담은 건별 목록으로, 업소명과 지번·도로명 주소, 위도·경도를 담는다(CSV 약 70KB). 담배소매점 신규 지정 시 기존 점포와의 거리를 검토하거나, 학교·공공건물 주변에 소매점이 얼마나 밀집해 있는지 확인하려는 공무원·사업자·분석가가 쓴다. 전역 조인 키는 없어 주소 문자열이나 좌표로 소상공인 상가업소 정보, 다른 LOCALDATA 업종 인허가 데이터와 공간·주소 매칭해 이어 쓴다.
description_portal: 경기도 이천시 내 담배소매인으로 등록된 사업장의 명칭과 위치 정보를 제공하는 데이터입니다. 항목은 순번, 업소명, 도로명 주소 등으로 구성되어 있으며, 지역 내 담배소매업체의 상호명과 소재지를 확인할 수 있습니다. 본 데이터는 담배소매업 등록현황 관리, 유통 인프라 분포 분석, 지역 상권 관리, 민원 대응, 허가제도 운영, 금연구역 지정 및 거리두기 기준 검토 등에 활용됩니다. 특히 주소 정보는 소매점의 밀집도 분석이나 공공건물 인근 흡연시설 관리 등에 유용하게 사용됩니다. 또한 본 데이터는 관할기관의 담배소매업 허가 기준 점검, 유통 시설의 거리 규제 이행 여부 확인, 정책 기반 상권 보호구역 설정 등 법적 기준 검토에도 활용됩니다.
