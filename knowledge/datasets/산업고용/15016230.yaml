summary_user: 인천 미추홀구 안의 고압가스·LPG·도시가스 충전소·가스용품 제조 등 가스 안전관리 대상 사업장을 한 곳씩 상호, 인허가 구분, 도로명주소, 전화번호, 위도·경도로 담은 사업장 단위 목록 파일(csv 약 4KB)이다. 구청 안전 담당자나 분석가가 '우리 동네 반경 안에 고압가스·LPG 취급 사업장이 어디에 몇 곳 있는가'를 확인하거나 재난대응 지도·점검 동선을 짤 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호·도로명주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓰며, LOCALDATA 에너지 업종 인허가 원장과 대조하는 용도에 맞다.
description_portal: 본 데이터는 인천광역시 미추홀구 내 ‘가스사업자 현황’으로, 고압가스 제조·충전·저장·판매 및 LPG 관련 사업체, 도시가스 충전소, 냉동가스 제조시설, 가스용품 제조업체 등 안전관리 대상 사업장을 포함한 정보입니다. 데이터에는 전화번호·주소·GPS(위도·경도) 정보가 포함되어 있어 긴급 대응 시 신속한 확인 및 관할 기관 연계가 가능합니다. 이 정보는 재난대응 지도 구축, 산업 안전관리, 가스 사고 예방 정책, 점검 일정 배치 등 행정 기반 자료로 활용되며, 미추홀구 내 에너지 공급 및 위험물 관리 체계를 파악하는 데 도움이됩니다. 지속적인 안전교육·규제·점검 강화 체계 구축이 요구됩니다.
