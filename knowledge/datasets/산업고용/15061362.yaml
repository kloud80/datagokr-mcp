description_portal: '"건설사업자란 건설산업기본법에 따라 건설업을 등록하고 건설업을 하는 자를 말한다. 본 서비스는 건설산업기본법에 의거하여 건설업을 등록한 건설사업자의 정보를 제공한다. 본 API는 공시기간(sDate, eDate), 지역(시·도/시·군·구), 페이지 번호 등 다양한 조회 조건으로 등록 및 공시된 건설사업자 정보를 체계적으로 조회할 수 있도록 한다. 제공되는 데이터는 행정적·학술적·산업적 활용에 적합하며, 예컨대 정책 수립을 위한 통계작성, 건설사업자 실태조사, 입찰 및 계약 적격성 검증, 시장분석 및 리스크관리, GIS기반 사업자 분포 분석 등에 활용할 수 있다. 또한 데이터는 JSON/XML 형식으로 제공되어 시스템 연동이 용이하다. 응답에는 페이지 정보(총건수, 현재페이지, 한페이지당 건수) 및 각 업체별 상세 공시 항목이 포함된다. 제공항목은 아래와 같으며, 서비스별 제공항목은 일부 차이가 있을 수 있다.출력결과(간단 나열): 업체명, 대표자명, 소재지(시도/시군구/상세주소), 등록일자, 공시구분(신규/정정/변경/철회), 업종명, 등록번호, 사업자등록번호, 연락처, 공시일자, 변경사유, 페이지정보(총건수/페이지번호/한페이지건수) 등이다."'
