description_portal: 본 데이터는 연도별로 RCMS(통합연구비관리시스템)가 적용된 연구의 연구수행기관 유형 분포를 집계한 CSV 통계 자료입니다. 연구를 수행한 기관을 유형별로 구분해 각 연도에 어떤 유형의 기관이 얼마나 연구를 수행했는지(규모)와, 전체 대비 어느 정도 비중을 차지하는지(비중 변화)를 비교할 수 있도록 구성되어 있습니다. 따라서 기관 유형별 연구 수행 형태를 연도 흐름에 따라 살펴보면서, RCMS 적용 범위가 어떤 유형의 기관에서 상대적으로 크게 나타나는지, 특정 시점에 비중 변화가 발생하는지 등을 확인하는 데 활용할 수 있습니다.이 자료는 RCMS 적용 연구관리 제도의 운영 현황을 정리하는 기초 통계로서 의미가 있으며, 기관 유형별로 제도 적용 수준을 비교하거나 연도별 분포 변화가 나타나는 영역을 점검하는 데 적합합니다. 정부 및 연구지원기관은 제도 확산 정도를 유형별로 파악하고, 운영·지원 정책을 검토할 때 참고할 수 있습니다. 연구기관과 정책 담당자, 학계 역시 기관 유형별 분포 정보를 바탕으로 연구관리 체계의 적용 범위와 변화 흐름을 정리하고, 연구비 관리 제도의 안정적 운영을 위한 근거 자료로 활용할 수 있습니다.
