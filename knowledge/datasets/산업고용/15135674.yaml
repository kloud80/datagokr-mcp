summary_user: 중소벤처기업부가 지원하고 중소기업기술정보진흥원이 운영하는 스마트서비스 지원사업(서비스 분야 중소기업의 빅데이터·AI 등 ICT 솔루션 신규 구축·고도화)의 공고를 연도별로 공고명·공고내용·데이터 기준일 단위로 담은 작은 CSV 파일(약 4.7KB)이다. 서비스업 중소기업이나 지원 컨설턴트가 '스마트서비스 사업은 해마다 어떤 내용으로 공고됐고 신규·고도화 지원이 어떻게 나뉘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 K-Startup·기업마당 등 다른 지원사업 공고와는 공고명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 중소기업 스마트서비스 지원사업은 중소기업 서비스(비제조) 분야에 빅데이터·AI 등 첨단 ICT를 접목하여 생산성 제고, 고부가가치화 및 新 사업 창출을 지원한다. 중소기업기술정보진흥원의 스마트서비스 사업 공고현황으로 중소벤처기업부에서 지원하는 스마트서비스 사업에 대한 공고 내용을 연도별로 확인할 수 있다(신규) BM 창출, 서비스 전달체계 개선을 위한 ICT 기반 스마트서비스 핵심 솔루션 구축 등 지원(고도화) 동 사업을 통해 기 구축한 솔루션의 기능 개선 또는 서비스 범위 확장 등 지원
