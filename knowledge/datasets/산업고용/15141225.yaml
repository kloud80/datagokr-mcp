summary_user: 서울 금천구 안 대규모점포의 인허가 내역을 점포 한 곳당 한 행으로 담은 건별 원장으로, 인허가·취소·폐업·휴업·재개업 일자, 영업상태, 사업장명, 지번·도로명 주소, 면적, 업태, 점포 구분, 위치 좌표(X·Y)를 포함한다. 금천구에서 지금 영업 중인 대형마트·백화점·복합쇼핑몰이 어디에 몇 곳 있는지 확인하려는 창업자, 입지 분석가, 상권 연구자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)로만 잇는다. 이런 방식으로 소상공인 상가업소 원장이나 전국 대규모점포 표준데이터와 대조한다.
description_portal: 대규모점포의 인허가 현황과 관련 정보를 체계적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등 기본 정보와 함께 점포 구분, 소재지 면적, 위치 좌표 등 다양한 항목을 포함하고 있습니다. 이를 통해 대형 유통업체의 분포와 현황을 분석하고, 창업 및 입지 선정, 정책 수립, 지역 상권 연구 등에 활용할 수 있습니다. 또한 해당 데이터는 상업시설의 공간적 분포와 시장 동향 파악, 유통 인프라 확충 계획, 소비 패턴 분석, 상권 경쟁력 강화 전략 마련 등 여러 분야에서 기초 자료로 유용하게 쓰입니다.
