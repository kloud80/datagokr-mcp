summary_user: 한국서부발전이 직접 투자하거나 지분을 보유한 신재생에너지 출자사·합작사를 회사 단위로 정리한 소규모 현황 파일(csv 약 1.6KB)로, 회사명·설립년도·비식별 대표자·매출년도별 매출액과 단위를 담는다. 에너지 정책 분석가나 공공기관 투자 성과를 살피는 사람이 '서부발전이 어떤 신재생 출자사를 갖고 있고 각 회사 매출 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전소·태양광 허가 데이터와는 회사명 매칭으로만 이어 쓸 수 있다.
description_portal: 한국서부발전에서 제공하는 신재생 출자사 현황입니다. 한국서부발전에서 제공하는 신재생 출자사 현황데이터는 한국서부발전이 직접 투자하거나 지분을 보유하여 운영에 참여하고 있는 신재생에너지 관련 회사 및 합작사의 현황을 정리한 자료입니다. 이 데이터에는 회사명, 설립년도, 비식별화 처리된 대표자 성명, 매출년도 매출액, 단위 등이 포함됩니다. 또한 각 출자사가 운영중인 발전소별 매출액등도 함께 기록되어 있어 한국서부발전의 신재생 에너지 투자 성과를 객관적으로 평가할 수 있습니다. 이를 통해 한국서부발전은 직접 건설·운영 뿐 아니라 출자 및 협력 방식으로 신재생 에너지 확대를 추진하고 있음을 보여주며, 향후 신규 투자 전략 수립과 에너지 전환 정책 이행 평가의 기초자료로 활용됩니다.
