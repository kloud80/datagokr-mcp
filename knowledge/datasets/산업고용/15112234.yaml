summary_user: 서울에너지공사 지사별로 하루 단위의 에너지 순수 사용량(공급량 중 손실을 뺀 실제 소비량)을 사용일자·지사·구분(waterClsfcNm)별로 담는 데이터다. 에너지 분석가나 공사 운영 담당자가 '어느 지사의 일별 사용량이 계절·요일에 따라 어떻게 달라지는가'처럼 지사별 수요 추이와 수요 예측 근거를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지사코드(branchCd)·지사명을 같은 기관 자료와 맞추거나 이름 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없고 비공간 자료여서, 지역 통계나 한전 지역×월 사용량 자료와 바로 결합할 수 없다. 개발계정은 하루 3,000회 호출로 제한된다.
