description_portal: '서울특별시 15세 이상 인구 중 경제활동인구 현황을 제공하는 지정ㆍ표본 통계입니다.서울특별시 15세 이상 인구 중 경제활동 인구수 (남녀별, 취업, 실업), 비경제활동 인구 수 등을 제공합니다.* 15세이상인구 : "15세이상인구 중 군인, 전투경찰, 공익근무요원, 형이 확정된 교도소 수감자" 등은 제외됨 * 경제활동인구 : 만 15세 이상 인구 중 취업자와 실업자를 말함* 비경제활동인구 : 조사대상 주간 중 취업자도 실업자도 아닌 만 15세 이상인 자. 즉 집안에서 가사와 육아를 전담하는 가정주부, 학교에 다니는 학생, 일을 할 수 없는 연로자와 심신 장애자, 자발적으로 자선사업이나 종교단체에 관여하는 자 등을 말함'
