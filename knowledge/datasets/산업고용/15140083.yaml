summary_user: 울산광역시에 등록된 승강기 유지관리업체를 업체별 한 행으로 담은 원장 파일로, 법인명·대표자·소재지·등록일자·영업상태·폐업일자·자본금·보수범위·책임/일반 기술인력 수를 포함한다(CSV 약 4KB의 소규모 파일). 승강기 소유자나 관리주체가 '울산에서 영업 중이고 기술인력이 충분한 유지관리업체가 어디인가'를 확인하거나, 분석가가 지역 유지관리업체의 영업·폐업 현황을 살피는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 지자체 인허가(LOCALDATA)·기업 현황 데이터와 업체 단위로 잇고, 소재지·도로명 주소로 지역별로 묶을 수 있다.
description_portal: 본 데이터는 관내에 등록된 승강기 유지관리업체의 현황 정보이다. 업체별 명칭, 소재지, 등록 번호, 관리 가능 승강기 종류, 기술 인력 등의 세부 내용을 포함한다. 승강기 유지관리업체는 엘리베이터 및 에스컬레이터의 정기 점검, 보수, 안전 관리를 담당하는 전문 사업자이다. 해당 자료는 승강기 안전 관리 정책 수립, 업체 관리 감독, 승강기 사고 예방 활동에 활용된다. 업체별 관리 능력 및 실적 평가를 통해 부실 관리 업체를 적발하고 관리 품질을 향상시킨다. 또한 승강기 소유자가 적합한 유지관리업체를 선정하는 데 필요한 정보를 제공한다. 정기 점검 및 안전 검사 이행 여부 확인을 통해 승강기 사고를 예방하며, 승강기 안전 기준 준수 및 기술 향상을 위한 업체 교육에 활용된다.
