description_portal: '한국수력원자력㈜이 추진하는 신규 양수발전소 건설사업의 주요 정보를 공개합니다. 공개 정보는 영동양수, 홍천양수, 포천양수의 시설용량, 주요시설 3종(상하부댐, 수로터널, 지하발전소 등), 건설기간(건설시작년도, 건설종료년도), 운영기간(운영시작년도, 운영종료년도) 항목으로 구성되어 있습니다. 시설용량의 단위는 MW입니다.※ 양수발전 : 수력 발전의 한 방식으로, 전력수요가 적은 심야의 저렴한 전력을 이용하거나, 주간시간대 태양광으로 발생하는 과잉 출력을 저장하였다가, 전력수요가 증가할 때 상부댐의 물을 하부댐으로 낙하시켜 전력을 생산하는 방식을 말합니다. 양수발전은 원자력발전소의 출력변동으로 인한 기기의 수명단축, 효율저하 등을 보완하여 이들 발전소의 열효율과 이용률 향상에 기여하며 대규모 정전시 최초 전력공급 역할을 수행합니다.'
