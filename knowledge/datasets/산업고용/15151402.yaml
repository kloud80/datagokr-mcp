summary_user: 경기도에서 가맹사업(프랜차이즈) 브랜드가 검색된 횟수를 데이터 기간(dat_perd_vl)과 브랜드명별로 묶은 집계 자료이며, 범위는 시도 단위의 비공간 데이터입니다. 창업 희망자나 분석가가 경기도에서 어떤 프랜차이즈 브랜드가 많이 검색됐는지, 연도별 관심도가 어떻게 바뀌었는지를 볼 때 쓴다. 전역 조인 키가 없어 다른 가맹·업종 데이터와는 검색브랜드명(srch_brnd_nm)을 이름으로 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 특정 연도 동안 경기도에서 검색된 가맹사업 관련 브랜드들의 검색 횟수를 수록한 자료로, 데이터기간, 검색브랜드명, 검색수로 구성되어 있습니다. 이를 통해 가맹사업에 대한 지역 내 브랜드 인지도나 관심도를 간접적으로 파악할 수 있으며, 연도별로 검색 수치의 변화 추이를 분석하여 프랜차이즈 시장의 트렌드 변화나 창업 수요 예측 등에 활용할 수 있습니다. 데이터는 창업 희망자의 관심 브랜드, 마케팅 전략 평가 및 브랜드 노출 효과 분석에도 유용합니다. 본 자료는 소비자의 브랜드 접근성과 인식 변화를 측정하는 기초 자료로도 활용될 수 있습니다.
