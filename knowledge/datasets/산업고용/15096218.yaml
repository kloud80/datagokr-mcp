description_portal: '한국남동발전의 500만원 이상 공사, 용역, 물품 등의 수의계약 현황에 대한 자료입니다. 월별 수의계약에 대한 사후공개 내역 데이터입니다. 단, 본사 제외 사업소 취합 내역입니다. - 데이터는 500만원 이상 계약 한정입니다.2014년부터 2025년까지 500만원 이상 수의계약 현황 데이터를 누구나 확인할 수 있는 xlsx형식으로 다운로드할 수 있습니다.공표 내용: 계약명, 계약일자, 계약금액, 계약업체, 수의계약사유, 담당부서 등담당 부서: 계약자재부공표 주기: 분기(1, 4, 7, 10월)* 한국남동발전 사이트 → 정보공개 → 사전정보공표 → 계약구매 분야에서도 확인할 수 있습니다.'
