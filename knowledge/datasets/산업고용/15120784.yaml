summary_user: 한국전력공사 전기요금 중 전기자동차 충전전력요금의 판매실적을 년월·시도·시군구·충전요금제별로 묶어 고객호수, 판매량, 판매수입을 담은 집계 파일로, 전국을 시군구 단위로 다룬다. 정책 담당자나 분석가가 "우리 시군구의 전기차 충전 전력 판매량과 요금 수입이 월별로 어떻게 늘고 있나" 같은 질문에 쓰며, 전기차 보급 동향을 지역별로 보는 데 쓴다. 전역 조인 키는 없어 시도·시군구 이름과 년월을 맞춰 다른 지역별 월 통계(전기차 등록, 충전소 현황 등)와 이어 쓴다.
description_portal: 한국전력공사의 전기요금제도 중 전기자동차 충전전력요금에 해당하는 판매실적 현황입니다.이 데이터에는  년월, 시도, 시군구, 충전요금제, 고객호수, 판매량, 판매수입이 포함되어 있습니다.이 자료는 전기자동차의 충전에 대한 요금정보를 제공하고, 고객들이 충전시 사용한 요금과 판매량 등을 확인할 수 있습니다. 이를 통해 전기자동차 시장의 동향을 파악하고 전기차 보급 정책에 대한 데이터를 분석할 수 있습니다. 현황자료를 통해 전기자동차 산업의 발전과 정책수립에 도움이 될 것으로 기대됩니다.
