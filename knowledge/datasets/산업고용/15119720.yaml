summary_user: 한국동서발전이 수행·지원하는 연구과제를 과제 건별로 담는 API로, 과제명, 1~3단계 과제분류, 주관·참여기관, 총 연구비와 동서발전·연구기관 분담금(천원), 연구 시작·종료일자, 진행상태를 제공한다. 연구자나 정책 분석가가 '동서발전은 어떤 발전 기술 분야에 연구비를 얼마나 쓰고, 어느 연구기관과 함께 수행하는가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주관·참여기관명이나 과제명을 이름 매핑해서만 이을 수 있다.
description_portal: 한국동서발전에서 오픈API 형태로 제공하는 연구과제 현황 정보 조회 서비스 데이터입니다. 이 데이터는 연구과제명, 과제분류(1~3단계), 주관기관, 참여기관, 총 연구비(천원), 동서발전 분담금(천원), 연구기관 분담금(천원), 연구 시작일자, 종료일자, 진행상태 등으로 구성되어 있으며, 표준화된 형식을 통해 다른 시스템과 원활하게 연계해 자동화된 데이터 활용과 실용적인 서비스 개발이 가능합니다. 이러한 데이터를 통해 학계 및 연구 기관은 발전 분야의 최신 기술 개발 흐름, 정부·공공기관과 민간·연구소 간 협업 사례, 연구 투자 비율 등을 분석해 에너지 기술 혁신과 정책 개발, 경제·산업연관 분석, 성과평가 체계 마련 등 다양한 학술·연구 목적에 활용할 수 있습니다.
