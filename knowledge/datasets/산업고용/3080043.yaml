summary_user: 경기도 양주시가 지정한 담배소매인을 업소 한 곳당 한 줄로 담은 건별 원천 파일로, 지정번호·업소명·지번/도로명 주소·영업구분·관리기관과 연락처·데이터기준일자를 담는다(CSV 약 125KB). 양주시에서 특정 동네에 담배를 파는 곳이 어디에 얼마나 몰려 있는지, 어떤 업소가 정식 지정을 받았는지 확인하려는 주민·창업 예정자·보건정책 분석가가 쓴다. 전역 조인 키는 없어 업소명이나 주소를 맞춰 소상공인 상가업소 정보나 LOCALDATA 인허가 자료와 잇고, 같은 기관의 다른 양주시 자료와는 기관 단위로 묶어 쓴다.
description_portal: '본 데이터는 경기도 양주시의 담배소매인지정현황을 담고 있으며, 담배소매업소의 관리와 유통 현황을 파악하기 위해 제공된다. 데이터는 연번, 지정번호, 업소명, 업소지번주소, 업소도로명주소, 영업구분, 관리기관명, 관리기관전화번호, 데이터기준일자 등으로 구성된다. 이를 통해 특정 업소의 지정번호 및 주소 정보를 확인할 수 있으며, 영업구분(예: 소매업, 판매점)과 관리기관의 명칭 및 연락처를 함께 제공함으로써 행정기관과 업소 간 관리 체계를 명확히 할 수 있다. 이 데이터는 담배소매업 허가 및 지정 현황을 공공에게 투명하게 공개하고, 불법 유통 방지 및 판매 관리 정책 수립에 활용될 수 있다. 또한, 지역 내 담배소매점의 분포 현황을 분석하여 보건·위생 정책 및 지역 상권 분석에도 중요한 기초자료로 쓰일 수 있다.'
