summary_user: 서울 성동구에서 게임물을 수입하거나 저작권을 관리하며 게임제공업자에게 공급하는 게임물배급업소의 인허가 내역을 업소 한 곳당 한 행으로 담는다(인허가·취소·폐업일자, 영업상태, 소재지 주소, 좌표 등). 성동구에 지금 영업 중인 게임물배급업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 언제 폐업했는지 알아보려는 사업자·분석가가 쓴다. 전역 조인 키는 없어 다른 지역·업종 인허가 데이터와는 같은 기관 코드(개방자치단체코드)나 주소·업소명 매칭으로만 잇고, 좌표(X, Y)로 지도나 상권 데이터에 겹쳐 본다.
description_portal: 본 데이터는 서울특별시 성동구에서 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업 사업자 등에게 게임물을 공급하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 첨단 콘텐츠 산업의 성장과 더불어 게임물 유통의 투명성과 저작권 보호, 공정한 게임유통질서 확립에 대한 사회적 필요성이 높아짐에 따라 본 데이터는 해당 업소의 관리와 시장 구조 파악을 위한 목적에서 수집되었습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등의 주요 항목이 포함되어, 각 업체의 인허가 내역, 영업 개시 및 종료, 저작권 소유 상태, 시장 내 유통현황 등을 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관에서 주기적으로 점검, 갱신하여 정보의 신뢰도와 시의성을 확보하였으며, 게임산업 정책 수립, 저작권 관리, 합법적 게임 유통질서 유지, 업계 동향 분석, 관련 연구 등 다양한 분야에서 효과적으로 활용될 수 있습니다. 데이터는 정기적으로 최신화됩니다.
