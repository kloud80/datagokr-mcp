summary_user: 경상남도에 등록된 석유판매업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 업소명·소재지 주소·등록일자·휴업 여부와 휴업기간을 담는다(파일 크기 871바이트의 작은 CSV). 경남 지역에서 특정 석유판매업체가 등록돼 있는지, 현재 휴업 중인지를 확인하려는 주민·사업자나 지역 석유 유통업체 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 소재지 주소를 맞춰 붙여야 하며, 같은 세부 부문의 LOCALDATA 에너지 업종 인허가 원장이나 오피넷 주유소 정보와 이름·주소 기준으로 대조하는 식으로 쓴다.
limits: 사업자번호나 인허가 관리번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하려면 업소명·주소 매칭에 의존해야 하고 불일치가 생길 수 있다. 범위는 경상남도 한 시도에 한정된다.
