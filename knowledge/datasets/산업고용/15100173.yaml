summary_user: 2019년 1월부터 10월까지 제주 지역의 5분 단위 시점별로 제주 총발전량과 신재생 통합 발전량(단위 MW)을 담은 시계열 파일이며, 건별 원천이 아니라 지역 합계 값입니다. 분석가나 연구자가 '2019년 제주에서 하루 중 신재생 발전 비중이 언제 가장 높았나'처럼 시간대별 수요와 신재생 출력 변동을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시각(년월일시분)을 맞추거나 같은 기관(전력거래소)의 발전량·수급 자료와 이름 기준으로 이어 쓴다.
