summary_user: 부산광역시에 등록된 전문건설업체를 업체 한 곳당 한 행으로 담고, 상호·업종(실내건축·방수·철근콘크리트 등)·소재지 주소·전화번호·위경도·구군·기준일을 제공한다. 발주처나 시민이 특정 구군에 있는 방수공사업체나 실내건축공사업체를 찾거나, 분석가가 업종별·구군별 전문건설업체 분포를 지도로 볼 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 구군명·주소·좌표나 상호 이름 매칭으로만 잇는다.
description_portal: 부산시에 등록된 전문건설업 현황 데이터를 개방합니다.개방 데이터에는 상호, 업종, 소재지 주소, 전화번호, 기관코드 위/경도가 포함되어 있습니다.등록된 업종은 실내건축공사업, 금속, 창호, 지붕, 건축물조립공사, 도장, 방수, 상하수도설비공사업, 가스, 난방공사업, 철근 콘크리트 공사업, 구조물해체, 비계공사업 등 많은 업종이 등록되어 있습니다.구군별 현황은 중구 45, 서구 62, 동구 108, 영도구 64, 부산진구 285, 동래구 313, 남구 263, 북구 225, 해운대구 368, 사하구 198, 금정구 520, 강서구 584, 연제구 249, 수영구 263, 사상구 268, 기장군 327 등 총 4,142개 업체가 등록되어 있습니다.*기준일 2025.5.21 현재
