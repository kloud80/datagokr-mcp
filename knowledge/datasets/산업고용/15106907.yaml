summary_user: 한국수력원자력이 국내에서 구매한 물품계약을 계약 한 건당 한 행으로 담은 원천 목록으로, 계약명·계약방법·분류·계약기간·계약일자·업체명·대표자명·예정가격·계약금액(원)이 들어 있다(CSV 약 596KB). 조달 참여를 검토하는 사업자나 공공기관 구매를 분석하는 사람이 '한수원은 어떤 물품을 어떤 방식으로, 어느 업체와 얼마에 계약했나', '예정가격 대비 낙찰 금액 비율은 어떤가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명 같은 이름 매칭이나 같은 기관의 다른 계약현황(공사·용역 등)과 나란히 놓는 방식으로만 잇는다.
description_portal: (본 데이터는 AI 친화 데이터입니다.)한국수력원자력 기관의 국내에서 구매한 물품계약의 상세 내역을 공개합니다. 국내 물품(구매)계약 체결현황 데이터는 데이터 제공일 기준일의 이전년도 1월부터 데이터 기준일 동안 계약한 국내 물품 관련 데이터를 제공하고 있으며, 제공항목은 순번,계약명,방법,분류,계약시작일,계약종료일,계약일자,업체명,대표자명,예정가격,계약금액 등 주요 정보를 포함합니다. 이 데이터는 한국수력원자력 전자상거래시스템을 기반으로 작성되었으며 데이터 갱신 주기는 1년을 기준으로 합니다. 예정가격과 계약금액의 단위는 원화이며 조달청 계약은 제외하였습니다.
