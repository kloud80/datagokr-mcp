summary_user: 한국동서발전이 액화천연가스·석탄·중유 연료원별로 생산해 거래한 전력량(MWh)을 일자 단위로 담은 파일이며, 발전소 구분 없이 회사 전체 합산 수치다. 분석가·연구자가 '한국동서발전의 하루 발전에서 석탄과 LNG 비중이 계절에 따라 어떻게 달라지는가' 같은 연료 믹스·수급 추세 질문에 쓴다. 전역 조인 키는 없어 일자를 기준으로 다른 발전사나 전력거래소의 일별 발전량·SMP 자료와 맞춰 이어 써야 한다.
description_portal: 한국동서발전의 연료원별 일별 전력거래량 정보 데이터입니다. 이 데이터는 일자별로 액화천연가스(LNG), 석탄, 중유 등 주요 연료원을 기반으로 생산된 전력의 거래량(MWh)을 기록한 자료입니다. 발전소 구분 없이 전체 합산 수치로 제공되며, 이를 통해 특정 연료원별 일일 발전 비중, 에너지 수급 추세, 계절적 패턴 등을 파악할 수 있습니다. 학계 및 연구기관에서는 전력 수요 분석, 연료전환 효과 추정, 에너지 시장의 일간 변동성 연구, 온실가스 배출 추정 및 탄소중립 시나리오 수립 등의 연구에 활용할 수 있습니다. 특히 국가 차원의 연료 믹스 전략 및 에너지 전환 정책 효과 분석 자료로 적합합니다.
