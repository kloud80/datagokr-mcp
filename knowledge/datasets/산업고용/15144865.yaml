description_portal: 한국노동연구원은 고용, 노동, 산업, 인적자원 등 다양한 정책 이슈를 심층적으로 다루기 위해 정기적으로 토론회 및 세미나를 개최하고 있으며, 행사 전체 프로그램 외에도 세션 단위의 구체적 논의 내용과 발표 주제를 함께 제공합니다. 각 세션은 특정 주제를 중심으로 전문가 발표와 토론이 이루어지며, 현안 분석, 정책 제안, 통계 해석 등 실질적인 내용이 집중적으로 다뤄집니다. 해당 공공데이터는 행사 내의 각 세션별 정보를 구조화된 데이터로 제공함으로써, 관심 있는 이용자(연구자, 정책 담당자, 언론 등)가 보다 세부적인 내용을 탐색하고 목적에 맞게 데이터를 활용할 수 있도록 하기 위함입니다. 개방 데이터에는 세션구분, 세션내용, 세션세부내용 등 이 포함됩니다.
