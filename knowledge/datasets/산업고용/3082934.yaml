summary_user: 고창군 관내 기업체를 한 행에 한 곳씩 담은 목록으로, 회사명·생산품·공장 대표 주소·전화번호·입주 단지명·데이터 기준일자를 담는다(CSV 약 26KB). 고창군에 입주하려는 사업자나 지역 분석가가 '고창군 어느 산업단지에 어떤 품목을 생산하는 기업이 있나'를 확인하는 데 쓴다. 전역 조인 키(사업자등록번호·법정동코드 등)는 없어 다른 데이터와는 회사명이나 공장 주소를 맞춰 붙이거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 전북특별자치도 고창군 기업정보 공공데이터는 고창군 내 기업체 현황을 제공하는 데이터입니다. 이 데이터에는 회사명, 생산품, 공장 대표 주소, 전화번호, 단지명, 데이터 기준일자 등의 정보가 포함됩니다. 이를 통해 지역 내 기업 분포를 파악하고, 산업 및 경제 분석에 활용할 수 있습니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다. 또한, 오픈 API를 통해 JSON/XML 형식으로 활용할 수도 있습니다. 해당 데이터는 고창군 행정지원과에서 관리하며, 연간 업데이트됩니다. 보다 자세한 내용은 전북특별자치도 빅데이터 허브에서 확인할 수 있습니다.
