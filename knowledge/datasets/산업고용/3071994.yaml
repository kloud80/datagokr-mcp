summary_user: 성평등가족부장관이 인증한 가족친화인증기업의 명단을 기업별 한 행으로 담은 파일 데이터로, 기업명·기업분류·지역·소재지를 싣고 전국 6,971건 전체를 받았다. 근로자가 가족친화인증 기업을 찾거나 지역별로 어떤 기업이 인증을 받았는지 살피는 질문에 쓴다. 소재지(address)를 키로 다른 지역 기업 현황이나 주소 기반 데이터와 이어 쓰며, 사업자번호 같은 별도 기업 식별 키는 없다.
description_portal: 근로자가 일과 가정을 양립할 수 있도록 가족친화제도를 모범적으로 수행하고 있는 기업 등에 대하여 성평등가족부장관이 인증한 가족친화기업 명단을 제공하는 파일형 개방데이터입니다.해당 개방데이터는 가족친화인증기업명, 기업분류, 지역, 기업의 소재지를 확인할 수 있습니다.가족친화인증을 받은 기업들의 정보를 공개함으로써, 근로자들에게 가족친화인증 기업을 찾는데 참고자료로 활용 될 수 있습니다.또한 기업에는 가족친화적 조직문화 도입을 장려하고 촉진하는데 활용될 수 있습니다.
