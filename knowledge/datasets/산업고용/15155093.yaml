summary_user: 전국 자치단체가 관리하는 유료직업소개소 인허가 정보를 업소 1곳당 1건으로 담은 원천 데이터로, API 전체 60,127건이며 사업장명·인허가일자·영업상태·폐업일자·주소·좌표를 포함한다. 구직자나 사업자, 분석가가 특정 지역에 영업 중인 유료직업소개소가 어디 있는지, 언제 인허가를 받았고 폐업했는지 확인하는 데 쓴다. 지번주소·도로명주소(address)와 관리번호(pnu) 키로 다른 주소 기반 데이터와 이어 쓰고, 개방자치단체코드(OPN_ATMY_GRP_CD)는 다른 데이터에서 먼저 받아 넘겨야 한다.
limits: 필수 파라미터인 기준일자(BASE_DATE)와 개방자치단체코드는 다른 데이터에서 받은 값을 넘겨야 하며, /history 오퍼레이션은 최소 파라미터로 응답이 없었다. 검증은 전체 60,127건 중 1,000행만 받았고, 전량 수집에는 페이지를 61회 이상 반복해야 한다. 확인된 데이터 기간은 2026-03-11~2026-10-01이다.
