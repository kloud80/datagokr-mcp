description_portal: 동 데이터는 석유화학 관련 주요 원자재의 가격동향을 파악할 수 있도록 관련 자료들의 데이트를 도표 형식으로 정리한 자료입니다. 주요 원자재는 총 6개로, 원유(Dubai 기준), 나프타, 에틸렌, 프로필렌, HDPE(고밀도폴리에틸렌), PP(프로필렌)입니다. 가격동향은 분기별로 제공이 되므로 동 데이터를 통해 석유화학 원자재의 국내외 가격비교를 할 수 있습니다. 이를 통해 석유화학 시황 파악을 할 수 있으며, 국내 수요기업(플라스틱 가공업계 등)의 원자재 구매시 참고자료로 활용이 가능할 것으로 판단됩니다.
