summary_user: 한국전력기술(주) 본사 구내에 설치된 전기차 충전소 15건을 한 행씩 담은 원천 목록으로, 주소·세부 위치(지하/지상 주차장)·이용 가능 시간·급속/완속 충전기 대수·충전기 타입·설치일자·정부보조금 지원 여부를 기록한다. 방문객이나 직원이 '한국전력기술 본사에서 어느 주차장에 급속 충전기가 몇 대 있고 몇 시까지 쓸 수 있나'를 확인하거나, 기관 내 충전 인프라의 설치 시기별 확대 현황을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키(충전소 ID·좌표 등)가 없어, 전국 충전소 데이터와는 주소 문자열 매칭으로만 이어 쓸 수 있다.
limits: 한 기관 본사 구내 15건에 한정된 자료라 전국 충전 인프라 분석에는 쓸 수 없고, 충전기 실시간 상태도 담지 않는다. 충전소 ID나 표준 코드가 없어 다른 충전소 데이터와 결합하려면 주소를 직접 맞춰야 한다.
