description_portal: 이 데이터는 한국탄소산업진흥원에서 제공하는 각종 사업공고 정보를 체계적으로 관리하기 위한 리스트 테이블이다. 사업공고 리스트 테이블에는 공고아이디, 공고코드명, 공고제목, 공고시작일, 공고종료일 등과 같은 핵심 항목이 포함되어 있으며, 이를 통해 이용자는 기관이 추진하는 지원사업, 연구개발 과제, 정책사업 등의 세부 내용을 신속히 확인할 수 있다. 또한 해당 데이터를 통해 진흥원이 추진하는 각종 사업 정보를 투명하고 제공하는데 목적이 있다.해당 데이터는 공공기관의 사업 공지 및 참여 기회를 투명하게 제공하는 데 목적이 있으며, 연구자, 기업, 일반 국민이 필요로 하는 사업 정보를 한눈에 파악하도록 돕는다.본 데이터는 공공자원의 효율적 활용과 산업 진흥 정책의 확산에 기여할 수 있는 기반 자료로 활용될 수 있다.
