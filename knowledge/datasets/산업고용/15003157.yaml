summary_user: 용인시 관내 대규모 점포(백화점·대형마트·쇼핑센터 등)를 점포 한 곳당 한 행으로 담은 소규모 CSV 파일(약 3KB)로, 업태·상호명·소재지·연락처·영업개시일·데이터기준일자를 담는다. 용인시에서 어느 지역에 대형마트나 백화점이 언제부터 영업 중인지 확인하려는 시민·창업자·상권 분석가가 입지 검토나 상업시설 분포 파악에 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 상호명·주소 문자열 매칭으로만 잇고, 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 원장과 대조해 보완하는 방식으로 쓴다.
description_portal: 경기도 용인시_대규모 점포 현황은 용인시 관내 대규모 점포의 업태, 상호명, 소재지(도로명·지번 주소), 영업개시일, 연락처 등 주요 항목을 종합적으로 제공하는 데이터다.백화점, 대형마트, 쇼핑센터 등 다양한 유형의 점포가 포함되어 있으며, 각 점포별 위치와 영업개시 시점 등 상세 정보를 체계적으로 수록하였다.이 데이터는 ① 행정기관·연구자에게는 상업시설 분포 분석과 지역 유통산업 동향 파악, ② 기업·창업자에게는 신규 입지 선정 및 상권 분석, ③ 시민에게는 생활 편의 시설 정보 제공 등 다방면에서 활용할 수 있다.정기적으로 갱신되어 최신 점포 현황을 반영하며, 지역 경제 연구, 상업정책 수립, 유통업계 동향 분석에 유용한 기초 자료로 쓰인다.
