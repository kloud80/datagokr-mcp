summary_user: 광주광역시 북구에 등록된 전문건설업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·마스킹된 대표자명·업종·전화번호·도로명주소·설립일이 들어 있다. 북구에서 특정 공종의 전문건설업체를 찾거나 지역 내 전문건설업체의 업종별 분포와 업력을 살펴보려는 주민·발주자·분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명이나 주소를 맞춰 보거나 같은 기관의 다른 인허가 자료와 나란히 놓고 비교하는 방식으로만 잇는다.
description_portal: 광주광역시 북구에 등록된 전문건설업체에 대한 데이터입니다.전문건설사 업체명, 대표자명, 업종, 전화번호, 주소(도로명주소), 설립일 정보를 제공합니다.대표자명은 개인정보보호를 위해 "*" 기호로 상세정보를 마스킹 처리하여 제공합니다.* 전문건설업체 전화번호는 개별 업체의 유선 전화번호를 확인할 수 있는 경우에만 표기하였습니다. 업체의 유선 전화번호를 명확히 확인할 수 없었거나, 무선 전화번호만 있어 공공데이터 파일 내 기재가 불가능한 경우 전화번호 열의 셀을 부득이하게 공란으로 두었습니다.
