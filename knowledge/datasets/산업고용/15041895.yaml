summary_user: 한국수력원자력의 수력발전과 양수발전 운영현황을 월 단위로 집계해 수력·양수 발전량(kWh)과 이용률(%)을 담은 전국 단위 파일로, 포털 설명상 2024년 12월부터 2025년 11월까지 12개월을 다룬다. 에너지 분석가나 전력 수급 담당자가 "수력·양수 발전량과 이용률이 계절에 따라 어떻게 달라지는가"를 살펴보는 데 쓴다. 발전소나 지역을 가리키는 공통 조인 키는 없으므로, 다른 전력 통계와는 기간(월)을 맞춰 나란히 놓는 방식으로만 이어 쓴다.
limits: 전국 합계의 월별 집계라 발전소별·지역별 비교는 할 수 없고, 실시간·일별 수급 값도 담지 않는다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 기간이나 이름 매핑으로만 연결된다.
