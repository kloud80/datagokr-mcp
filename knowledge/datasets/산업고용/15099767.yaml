summary_user: 전력시장에 참여하는 발전기를 건별로 담은 원장성 API로, 지역·회원사·급전방식·발전원·발전형식·연료원·설비용량(MW)을 제공하며 전국 16,268건 규모다. 발전회사나 분석가가 특정 지역·연료원별로 어떤 발전기가 얼마의 설비용량으로 시장에 참여하는지 확인하는 질문에 쓴다. 전역 조인 키는 없어 발전기명·회원사명 같은 이름 매핑이나 같은 기관 코드로만 다른 데이터와 잇고, 발전소 단위 주소·용량을 담은 태양광 발전사업 허가 표준데이터와는 이름 대조로 보완할 수 있다.
description_portal: ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다.ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다.ㅇ 해당목록은 전력거래소 전력시장에 참여하는 발전기의 정보를 지역, 지역구분(area, 지역), 회원사명(company, 회원사명), 급전방식(cent, 중앙급전여부), 발전기명(genNm, 발전기명), 발전원(genSrc, 발전원), 발전형식(genFom, 발전형식), 연료원(fuel, 연료원), 설비용량(pcap, 설비용량(MW))으로 구분하여 제공합니다.
