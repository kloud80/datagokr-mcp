summary_user: 부산광역시 서구에 신고된 옥외광고업 업체를 한 줄에 한 곳씩 담은 건별 현황 파일로, 업소명·대표자 성명·영업장 도로명주소·영업내용을 담는다(CSV 약 2KB 규모). 구민이나 광고주가 서구에서 간판·현수막 등 옥외광고를 맡길 업체가 어디에 있는지, 어떤 광고를 하는지 찾을 때와 행정·상권 분석가가 서구 옥외광고업 분포를 볼 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업소명·도로명주소를 맞춰 보는 방식으로만 잇고, 지방행정 인허가(LOCALDATA) 옥외광고업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조해 쓴다.
limits: 부산 서구 한 곳만 다루므로 다른 시군구와 비교하려면 지역별 파일을 따로 모아야 한다. 실측 컬럼에 사업자번호·좌표·인허가일 같은 키가 없어 다른 데이터와 정확히 연결되지 않고, 이름·주소 매칭에 의존해야 한다.
