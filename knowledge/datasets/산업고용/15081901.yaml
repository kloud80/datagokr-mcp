summary_user: 세종특별자치시 전기사업허가 자료를 바탕으로 시내 태양광발전소를 한 곳씩 상호, 설치장소 주소(지번·도로명), 영업구분, 설비용량(kW), 허가연도로 담은 건별 목록이다. 세종시에서 연도별로 태양광 허가가 얼마나 늘었는지, 특정 읍면동에 발전설비 용량이 얼마나 몰려 있는지 살피는 분석가나 발전사업 예정자가 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 주소를 지오코딩하거나 상호·지역명을 맞춰 이어 쓴다. 태양광 발전사업 허가 표준데이터나 에너지 업종 인허가 원장과 견줄 때도 같은 방식으로 맞춘다.
description_portal: 세종특별자치시에 있는 태양광발전소 정보를 제공합니다.데이터는 상호, 설치장소 주소지(지번, 도로명), 영업구분, 설비용량(kw), 허가연도로 구성되어 있습니다.전기사업허가 자료를 바탕으로 데이터를 제공합니다.세종특별자치시에 설치된 태양광은 전체 764개소로 총 설비용량은  137,214kw 입니다.  허가연도별로 보면 2025년 6월 현재  80개소, 2024년  121개소, 2023년 72개소로 점차 증가세를 보이고 있습니다.이자료는 세종특별자치시 경제정책과에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.
