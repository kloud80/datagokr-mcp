summary_user: 강북구 관내 대형마트·백화점·쇼핑센터·복합쇼핑몰 같은 대규모점포의 인허가 정보를 업소 한 건씩 담는다(사업장명, 인허가·폐업일자, 영업상태, 지번·도로명 주소, 중부원점TM 좌표 등). 강북구에서 영업 중이거나 폐업한 대형 점포가 어디에 있는지 확인하려는 상권 분석가나 출점을 검토하는 사업자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 상가업소·상권 데이터나 다른 구의 인허가 데이터와는 주소나 사업장명 매핑, 또는 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓴다.
