description_portal: '한국가스안전공사에서 수집한 국내로 수입되는 고압가스용기 검사여부를 통관단계에서 확인할 수 있는 수입가스용품 요건확인 시스템 구축에 따라, 관세청을 통해 수입되는 연도별 고압가스용기 현황 데이터를 공개합니다. 데이터 항목은 통관 업무 수행 기준 지역별 구분에 따른 고압가스용기 통관결과(합격수량) 정보가 수록되어 있습니다.해당 목록을 통해 지역별 고압가스용기에 대한 통관 업무에 참고 할 수 있습니다.※ 해당 목록은 메타데이터를 기반으로 제공되는 정보입니다.※ 2020년부터 2024년(최근 5년)까지의 통계가 수록되어 있습니다.(조회가능범위)※ 통관업무를 수행하지 않은 부서(지역) 및 검사실적이 없는 용기의 데이터는 제외※ 데이터 기준일 : 2024년 12월 31일'
