summary_user: 서울특별시 용산구에 등록된 유료직업소개소를 사업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 상호명(BPLCNM)·인허가일자·영업상태·폐업일자·전화번호·지번/도로명 주소·좌표를 포함한다. 구직자나 구인기업이 '용산구에서 지금 영업 중인 합법 유료직업소개소가 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 지역 직업소개소의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 붙이며, 좌표(X·Y)는 지도 위 위치 표시에 쓴다.
description_portal: 서울특별시 용산구 소재의 유료직업소개소 현황 데이터를 제공하는 자료로, 상호명, 사업소 전화번호, 사업소 도로명 주소, 인허가 일자 등의 주요 항목을 포함하고 있습니다. 본 데이터는 「직업안정법」제19조에 따라 적법하게 등록·관리되고 있는 직업소개소의 정보를 담고 있으며, 구민이 안심하고 이용할 수 있는 고용 서비스 환경을 조성하는 것을 목적으로 합니다. 용산구는 이러한 정보를 투명하게 공개함으로써 구직자와 구인기업 모두가 신뢰할 수 있는 채용 경로를 확보하도록 지원합니다. 구직자는 이 자료를 통해 지역 내 합법적인 직업소개소를 손쉽게 찾아 안전하게 취업 활동을 전개할 수 있으며, 구인기업은 해당 정보를 바탕으로 검증된 인력 중개 기관을 활용해 효율적으로 인재를 확보할 수 있습니다. 더 나아가, 해당 데이터는 고용 관련 정책 수립과 학술·연구 활동의 기초 자료로도 활용 가능하여, 데이터는 주기적으로 갱신되어 최신 정보를 반영합니다. 더 궁금하신 사항은 용산구 일자리정책담당관 02-2199-4514로 문의하시기 바랍니다.
