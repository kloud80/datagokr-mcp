summary_user: 중소벤처기업진흥공단이 관리 중인 워크아웃 중소기업을 기업 한 건씩 담은 목록으로, 소재 광역지자체(지역), 워크아웃 개시연월, 워크아웃 유형(채권은행자율협의회 또는 금융채권자협의회)을 담는다(전국 범위, 약 1KB 규모의 소량 CSV). 정책 분석가가 '어느 지역에서 언제 어떤 유형의 채무조정 워크아웃이 개시되었는가'를 보고 재도전·재기 지원 수요를 지역별로 가늠하는 데 쓴다. 사업자번호나 기업명 같은 전역 조인 키가 없어 개별 기업 단위로 다른 인증·지원 데이터와 연결할 수 없고, 광역지자체 이름을 기준으로 지역 단위 기업 현황 통계와 맞춰 보는 정도로만 이어 쓴다.
description_portal: '2025년 상반기인 07월 말 기준으로 중소벤처기업진흥공단에서 관리 중인 워크아웃 중소기업의 현황과 관련된 데이터입니다. 채무조정 관련 지역별 기업 수요 관련 정보 제공으로 워크아웃 기업 관련 공공통계 구축에 기여하기를 목적으로 두고 있습니다.파일데이터의 세부 내용은 다음과 같습니다.- 연번: 데이터 목록의 순번- 지역: 소재하고 있는 광역지자체 기준 추출- 개시연월: 해당 중소기업이 워크아웃을 개시한 일자- 워크아웃 유형: 채권은행자율협의회 유형 또는 금융채권자협의회 유형해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.'
