description_portal: 이 데이터는 한국남부발전이 운영하는 SPC(특수목적법인)의 일반 현황을 정리한 자료입니다. 각 출자회사의 명칭, 설립근거 법령, 최초 취득일, 설립 목적과 주주구성 정보가 포함되어 있으며, 발전소 건설·운영, 집단에너지 사업, 신재생에너지 공급의무화제도(RPS) 이행, 근로자 정규직 전환 등 다양한 설립 목적을 확인할 수 있습니다. 또한 한국남부발전의 지분율과 주요 민간·기관 투자자의 참여 비율도 함께 제시되어 있어 공기업과 민간의 협력 구조를 파악할 수 있습니다. 본 자료는 공공에너지 분야에서의 SPC 운영 방식과 투자 구조를 이해하고, 신재생에너지 및 집단에너지 사업 추진 현황을 살펴보는 데 유용한 기초 정보로 활용될 수 있습니다.
