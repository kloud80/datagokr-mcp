summary_user: 중소벤처기업진흥공단이 운영하는 자산거래중개장터(중고몰)에 기준일 현재 등록된 특허 등 무형자산을 건별로 담은 목록 파일로, 무형자산명·분류·키워드·국내/국제 여부·국제특허분류(IPC)·진행상태·개인/기업 구분·등록연도 등을 담는다(CSV 약 49KB, 전국 범위). 기술이전이나 특허 매입을 찾는 사업자가 '특정 기술분야(IPC)에서 지금 거래 중개에 나와 있는 무형자산은 무엇이고 누가 내놓았나'를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 벤처·이노비즈·창업기업 확인서 등 기업 인증 원장과 이어 등록 기업의 인증 현황을 함께 본다.
description_portal: '자산거래중개장터 등록 무형자산 목록은 중소벤처기업진흥공단에서 운영중인 자산거래중개장터(중고몰)에 기준일에 등록되어 있는 무형자산 데이터입니다.(제공 데이터 : 무형자산명, 특허 여부, 등록기관, 국내_국제여부, 국제특허분류(IPC), 메인노출여부, 진행상태, 개인_기업구분, 사업자등록번호, 등록연도 등)* IPC(International Patent Classification, 국제특허분류)는 발명의 기술분야를 나타내는 국제적으로 통일된 특허분류체계로 특허청에서 특허문헌의 분류, 검색을 용이하도록 국내의 모든 출원건에 대하여 부여자산거래중개장터(www.joonggomall.or.kr)는 중소기업에서 사용하는 기계설비의 신속한 거래중개 정보를 제공하는 온라인 종합 중개장터입니다.'
