summary_user: 전북특별자치도에 있는 여성기업을 제조업 중분류 업종(업종코드 C10~C34)별로 묶어 업체수와 종사자수를 담은 집계 파일로, 기업별 원장이 아니라 업종별 한 행씩 담은 소규모 CSV(911바이트)다. 지역 산업정책 담당자나 분석가가 "전북 여성기업은 어느 제조 업종에 몰려 있고 고용 규모는 어느 정도인가"를 확인할 때 쓴다. 전역 조인 키는 없어서, 업종코드를 한국표준산업분류 제조업 중분류 코드와 맞추거나 업종명으로 다른 지역·전국 업종 통계와 이어 쓴다.
description_portal: '해당 데이터는 전북특별자치도에 위치한 여성기업의 업종별 분포 현황을 보여주는 자료입니다. 각 행은 제조업 업종별로 구분되어 있으며, 업종 코드(C10~C34), 업종명, 해당 업종의 여성기업 수(업체수), 종사자 수 정보를 포함하고 있습니다. 이를 통해 전북 지역 내 여성기업이 주로 종사하는 산업군의 특징을 파악할 수 있으며, 여성기업이 많은 업종(예: 식료품, 금속가공제품, 비금속 광물제품 등)과 상대적으로 적은 업종(예: 담배 제조업, 가죽제품 등)을 구분할 수 있습니다. 정책 수립 시 여성기업의 산업적 특성과 인력 분포를 고려한 맞춤형 지원 방안 도출에 활용될 수 있는 기초 자료입니다.'
