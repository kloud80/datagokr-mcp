summary_user: 한국남부발전 남제주 발전소 인근에서 약 5분 단위로 측정한 기온·습도·기압·풍향·풍속·강수량을 발전소명(saupso)과 측정 시각별로 담은 건별 측정 데이터로, 조회할 기간을 연-월-일로 지정해 받는 API다. 에너지 분석가가 "남제주 발전소 주변의 기온·풍속 변화가 해당 발전소 발전량과 어떤 관계가 있나" 같은 질문에 발전량 자료와 맞춰 보는 기초 자료로 쓴다. 전역 조인 키는 없어서 발전소명과 측정 시각을 기준으로 같은 기관의 발전량·배출 측정 자료나 기상청 관측 자료와 맞춰 이어야 한다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전소주변기상정보 서비스_GW 입니다.해당 서비스를 통해 사용자는 원하는 기간(연도-월-일)을 지정하여 한국남부발전(주)의 남제주 발전소 인근의 기상정보를 조회할 수 있습니다.조회 가능한 정보는 약 5분 단위로 측정된 기온, 기압, 풍향, 풍속과 같은 주변 기상 정보입니다.해당 데이터를 발전량 데이터와 결합하여 기상이 발전량에 미치는 영향 등을 분석하는데 기본자료로 활용될 수 있습니다.
