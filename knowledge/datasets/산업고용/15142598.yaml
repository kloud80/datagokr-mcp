summary_user: 서울 마포구의 대형마트·백화점·쇼핑센터·복합쇼핑몰 같은 대규모점포를 점포 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·업태·중부원점TM 좌표(X, Y)를 담는다. 마포구 안에서 지금 영업 중인 대규모점포가 어디에 있고 언제 허가·폐업했는지 확인하려는 주민, 상권 분석가, 출점을 검토하는 사업자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드나 사업장명·주소 매칭으로만 잇는다. 상권 기준 원장인 소상공인 상가업소 데이터나 전국 대규모점포 표준데이터와 붙일 때도 같은 방식으로 맞춘다.
description_portal: '서울특별시 마포구의 대형마트, 백화점, 쇼핑센터,복합쇼핑몰 등 다수의 사업자로부터 납품받아 판매하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 점포를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 대규모점포의 위치, 취급 품목과 운영 현황을 파악하고, 지역 상권 현황 분석과 소비자 안전 강화에 기여할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
