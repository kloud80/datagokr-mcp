summary_user: 서울 마포구에서 반려동물을 사들여 판매·알선·중개하는 동물판매업소의 인허가 원장을 업소 한 곳당 한 행으로 담으며, 인허가일·영업상태·폐업일·주소·중부원점TM 좌표 등이 들어 있다. 반려동물을 분양받으려는 주민이 집 근처에 정상 영업 중인 등록 판매업소가 어디인지 확인하거나, 분석가가 마포구 동물판매업소의 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OGDP_INST_CD) 같은 기관 코드로만 이어 쓰며, 같은 LOCALDATA 계열의 다른 업종 인허가 데이터와 같은 구조로 묶어 볼 때 쓴다.
description_portal: '서울특별시 마포구의 가정에서 반려의 목적으로 사육하는 동물을 구입하여 판매, 알선 또는 중개하는 업소 정보입니다. 이 데이터에는 업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 축산업무구분명, 권리주체일련번호 등의 세부 정보가 포함되어 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
