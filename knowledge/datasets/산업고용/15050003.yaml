summary_user: 한국광해광업공단이 폐광지역 경제 활성화를 위해 지자체·㈜강원랜드와 공동 출자한 대체법인의 법인명, 설립일, 자본금(억원), 출자기관, 지분율, 주요사업을 법인별로 담은 소규모 현황 파일(csv, 약 1.6KB)이다. 폐광지역 지원 정책을 살피는 분석가나 지역 주민이 "공단이 어느 회사에 얼마의 지분으로 출자했고 그 회사는 무슨 사업을 하나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 법인명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 한국광해광업공단은 석탄산업 사양화로 인해 침체된 폐광지역 경제 활성화를 위해 ‘폐광지역 개발지원에 관한 특별법(1995.12.)’ 과 ‘2단계 폐광지역 투자계획(2002.11., 산업통상자원부)’에 근거하여 대체법인을 설립·관리하고 있으며, 공단은 강원랜드 이익금 일부를 출자하여 해당지자체 및 ㈜강원랜드와 공동으로 대체법인을 설립하여 지역발전과 함께 지역주민의 삶의 질 향상에 기여하고 있습니다.공단 출자회사 법인명, 설립일, 출자기관, 자본금, 주요 사업 등의 현황 정보를 개방 및 공개합니다.
