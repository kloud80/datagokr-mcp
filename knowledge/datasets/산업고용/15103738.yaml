description_portal: 한국가스공사의 지역별·용도별 도시가스 수요의 기온반응함수에 관한 자료입니다. 기온반응함수는 기온이 도시가스 수요에 미치는 영향을 각 기온대별로 정량화한 함수로, 기온 분포에 따른 수요 변화를 측정하는 핵심 분석 도구입니다. 본 데이터는 기온-수요 관계 분석 및 수요 예측 모델 개발을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 기온대, 수도권 순수 기온반응도, 수도권 시간 기온반응도, 지방권 순수 기온반응도, 지방권 시간 기온반응도 등이 포함되어 있습니다. 본 데이터를 활용하면 기온대별 수요 반응 특성 분석, 지역별 기온 민감도 비교, 수요 예측 모델 파라미터 설정, 기상 변화에 따른 수급 대응에 기초자료로 활용할 수 있어 도시가스 수요 예측 고도화와 선제적 수급 관리에 기여할 것으로 기대됩니다.
