description_portal: 이 데이터는 제주국제자유도시개발센터에서 제공하는 온라인 면세점 고객의 구매예약 내역에 대한 파일입니다. 성별, 예약월, 예약상품군, 구매예정금액을 포함한 온라인면세점 고객의 구매예약 내역에 대한 개인정보를 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 실제 고객 데이터의 구조와 통계적 특성을 반영하되, 개인식별정보를 제거하여 개인식별 위험성을 방지했습니다. 각 행은 가상의 고객 단위 정보를 표현하므로 예약 패턴 및 금액 분포를 개인·집단별로 분석할 수 있으며, 원본 고객을 특정할 수는 없도록 설계되었습니다. 이를 통해 관광객의 예약 동향을 정밀하게 파악하고 시기별 수요 예측, 물류 및 재고 관리 정책 수립, 프로모션 기획, 관광산업 운영 전략 마련 등 다양한 분석 목적으로 활용할 수 있습니다.
