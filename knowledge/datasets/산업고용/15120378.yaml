description_portal: 지식재산보호종합포털 해외지재권법령정보 데이터는 국외(미국, 중국, 프랑스, 독일, 영국, 네덜란드) 지재권 법령 데이터입니다.해외지재권 법령정보에는 크게 2가지 목록인 국가별법령집과 권리구분코드로 구성되어 있습니다.국가별법령집에는 1332건의 데이터로 이루어져있고, 항목은 일련번호 국가구분 권리구분 권리구분 권리구분코드설명 목차구분 목차설명 제목 내용 정렬순서 사업연도 등록일시 수정일시로 이루어져있습니다.권리구분코드는 9건의 데이터로 이루어져있으며 국가별법령집의 권리구분 코드에 대한 설명이 첨부되어있습니다. 미국, 중국, 프랑스, 독일, 네덜란드, 영국의 법령을 번역하여 전달하는 데이터입니다.
