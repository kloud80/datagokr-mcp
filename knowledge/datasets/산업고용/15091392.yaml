summary_user: 인천광역시가 유망 중소기업으로 선정한 업체를 업체별 한 행으로 정리한 목록으로, 지정연도·시군·기업명·대표·주생산품·지정기간 시작일과 종료일을 담은 CSV 파일(약 17.8KB)이다. 투자자나 협력사를 찾는 사업자가 '인천에서 특정 제품을 만드는 유망 중소기업은 어디이고 지정기간이 아직 유효한가'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 기업명·대표자명 매칭이나 시군 이름으로만 이어 쓸 수 있다.
description_portal: 인천광역시가 제공하는 유망 중소기업 선정 업체 현황 공공데이터는 시에서 성장 가능성이 높고 기술력 및 사업성이 우수한 것으로 평가되어 "유망 중소기업"으로 선정된 업체들의 상세 정보를 집계한 목록 자료입니다. 이 데이터는 지역 경제 활성화, 중소기업 육성 정책의 효과 측정, 투자 유치 정보 제공 등의 기초 자료로 활용됩니다.*주요 구성 항목으로는 지정연도, 기업명, 대표, 주생산품, 지정기간 시작일, 지정기간 종료일, 비고 등으로 이루어져 있습니다.해당 데이터는 공공데이터포털에서 CSV파일로 제공하고 있습니다.
