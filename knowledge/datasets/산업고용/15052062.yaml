summary_user: 한국가스공사가 수행 중이거나 수행했던 연구과제를 과제 한 건당 한 행으로 담은 목록 파일(CSV, 약 80KB)이며, 국문·영문 과제명, 수행부서, 연구책임자, 연구 시작일·종료일을 담는다. 연구기획 담당자나 에너지 R&D 분석가가 '가스공사에서 수소·LNG 관련 과제를 이미 했는지, 어느 부서가 언제 수행했는지' 확인해 신규 과제의 중복 여부를 검토하거나 연도별·부서별 연구 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 과제명·부서명 같은 이름 매칭으로만 연결하며, 지역 정보가 없어서 에너지 사용량 지역×월 데이터와는 직접 이어지지 않는다.
description_portal: 한국가스공사에서 수행 중이거나 수행했던 연구과제 목록을 체계적으로 정리한 데이터 입니다. 연구과제 현황 관리 및 R&D 포트폴리오 분석, 연구성과 추적, 중복과제 방지를 목적으로 수집되었습니다. 데이터 세부 항목은 연번, 국문과제명, 영문과제명, 수행부서, 연구책임자, 연구시작일, 연구종료일 등으로 이루어져 있어 각 연구과제의 상세 정보를 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 연도별 연구과제 수행 현황 분석, 부서별 연구 분포 파악, 연구분야별 투자 동향 분석, 연구책임자별 과제 현황 파악, 과제 수행기간 분석이 가능합니다. 또한 신규 연구과제 기획 시 중복 방지, 연구 연속성 확보, 연구성과 추적, 유사과제 연계 검토에 활용됩니다. R&D 전략 수립 및 연구관리 업무에 기초자료로 활용되어 체계적인 연구개발 관리와 연구 생산성 향상을 지원합니다.
