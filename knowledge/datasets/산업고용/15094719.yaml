summary_user: 서울시 상권(상권 코드) 단위로 기준 년·분기(STDR_YYQU_CD)별 유동인구를 집계해 총·성별·연령대별(10대~60대 이상)·시간대별(6구간)·요일별 인원 수로 담는다. 창업 예정자나 자영업자가 '이 상권에는 어느 연령층이 몇 시, 무슨 요일에 많이 다니는가'를 따져 입지·영업시간·업종을 정할 때 쓰고, 지자체·연구자는 분기별 상권 유동인구 변화 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상권 코드·상권명(TRDAR_CD_NM) 매핑이나 같은 서울시 상권분석서비스의 상권 코드로만 이어 쓴다.
limits: 전역 조인 키가 없어 소상공인 상가업소 원장 등 다른 기관 데이터와 바로 결합되지 않고, 이름·코드 매핑을 따로 해야 한다. 서울 열린데이터광장(data.seoul.go.kr) 외부 사이트에서 별도 인증키(경로 파라미터 KEY)를 받아 호출해야 하며, 공공데이터포털 활용신청과는 별개다. 범위는 서울시 상권 단위이며 좌표 같은 공간 정보는 담기지 않는다.
