summary_user: 서울특별시 중랑구의 무료직업소개소를 업소 한 곳당 한 건으로 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·전화번호·사업장명과 중부원점TM(EPSG:5174) 좌표를 포함한다. 중랑구에 사는 구직자나 구인 사업주가 지금 영업 중인 무료직업소개소가 어디에 있는지 찾을 때, 분석가가 지역 고용서비스 기관의 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 무료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
