summary_user: REC 현물시장의 체결 결과를 거래일별로 담은 파일로, 체결 수량·평균가·체결총액과 시작가·종가·기준가·최고가·최저가(원)를 전국 단위로 제공한다. 신재생 발전사업자나 에너지 분석가가 '최근 REC 현물 가격이 어떻게 움직였고 거래량은 얼마였나'를 확인하는 데 쓴다. 전역 조인 키가 없어 지역·발전소 데이터와 직접 결합되지 않으며, 거래일(날짜)을 기준으로 SMP 등 같은 기관의 전력시장 시계열과 나란히 놓아 비교하는 방식으로 이어 쓴다.
limits: REC 현물시장 체결 기준 집계라 계약시장·고정가격 계약 거래나 개별 거래 건, 지역·발전원별 구분은 담지 않는다. 공간 정보가 없는 전국 단위 자료이며 다른 데이터와 묶을 공통 코드가 없어 날짜·이름 매핑에 의존해야 한다.
