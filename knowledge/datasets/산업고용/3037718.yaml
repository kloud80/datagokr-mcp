summary_user: 세종특별자치시 안의 인쇄·출판 사업체를 업소 한 곳당 한 행으로 담은 파일로, 사업체명·도로명 소재지·업종·전화번호·신고일자를 포함한다(CSV 약 80KB). 세종시에서 인쇄소나 출판사를 찾거나, 지역 인쇄·출판업체가 어디에 몇 곳 모여 있는지 알아보려는 시민·사업자·분석가가 쓴다. 공통 조인 키가 없어서 다른 데이터와는 사업체명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다. 대상은 지방행정 인허가(LOCALDATA) 업종 원장이나 소상공인 상가업소 정보 같은 데이터다.
description_portal: '출판 및 인쇄산업 관련 현황(업소명, 전화번호, 주소, 소재지)을 제공합니다.출판 및 인쇄산업 관련 현황 중 예시로는 북세종인쇄사, 광일인쇄사,중앙인쇄사, 한국법제연구원, 산업연구원, 금강인쇄사, (주)미래엔, 하나로출판사, 명현디자인기획, 알파오피스, 세종출판사, (주)휴먼에듀피아, 세종아이콘(주),  한밭출판사, 한라기획주식회사, 시타델북스, 성원기획, 세종시대,  선진기획, 천호기획인쇄, 천일사, 한솔기획 등이 있습니다.이자료는 세종특별자치시에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다. ※ 문의 : 문화예술과  문화산업팀 044-300-3423'
