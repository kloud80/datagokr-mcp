summary_user: 경기도 내 석유제품·석유대체연료 판매업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태(영업/폐업 등)·폐업일자·도로명/지번주소·WGS84 좌표·자본금을 포함한다. 분석가나 지자체 담당자가 '우리 시군에서 지금 영업 중인 석유·대체연료 판매업체는 몇 곳이고 어디에 몰려 있나'를 파악하거나, 사업자가 경쟁 업체 분포를 지도로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·주소·사업장명 매칭이나 좌표 기반 공간 결합으로 이어 쓰고, 같은 LOCALDATA 계열의 고압가스·LPG·도시가스 등 에너지 업종 인허가 데이터와 나란히 비교한다.
description_portal: 본 데이터는 경기도 내 석유제품 및 석유대체연료를 판매하는 사업장의 정보를 수록한 자료로, 석유제품 연소 설비의 구조 변경 없이 대체 가능한 연료를 포함한 판매업체 현황을 확인할 수 있습니다. 항목으로는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘소재지도로명주소’, ‘소재지지번주소’, ‘WGS84위도’, ‘WGS84경도’, ‘자본금’ 등이 포함되며, 인허가 이력과 소재지 정보, 영업상태(영업/폐업/취소 등), 자본금 등 다양한 정보를 제공하여 사업체 운영현황을 종합적으로 파악할 수 있습니다. 이 데이터는 석유 및 대체연료 관련 업계 동향 분석, 친환경 에너지 전환 추진 전략 수립, 지역 내 에너지 인프라 분포 조사, 환경 규제 대상 파악 등에서 유용하게 활용될 수 있습니다. 또한, 각 업체의 좌표 정보를 활용하여 지도 기반의 시각화 및 접근성 분석도 가능합니다.
