summary_user: 광업권 등록현황 통계집에 실린 2012년 이후 가행광구 수를 연도·광종분류(금속광·비금속광)·광종별로 한 행씩 두고, 시도를 열로 펼쳐 담은 전국 단위 집계표(CSV)입니다. 자원 정책 분석가나 지역 연구자가 "어느 시도에서 어떤 광물을 캐는 가행광구가 해마다 얼마나 늘거나 줄었나"를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 연도와 시도 이름, 광종 이름을 맞춰 붙여야 하고, 시도가 열로 펼쳐져 있어 행으로 바꾼 뒤 시도 단위 통계와 잇는다.
