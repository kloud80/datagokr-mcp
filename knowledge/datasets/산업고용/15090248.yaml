summary_user: 한국서부발전 태안발전소 주변에서 측정한 기온·상대습도·기압·풍향·풍속·강수량을 측정일시와 측정 위치별로 기록한 건별 기상 관측 파일(CSV 약 60KB)이다. 발전소 인근 주민이나 환경 분석가가 특정 날짜에 태안발전소 주변 바람이 어느 방향으로 불어 대기오염물질이 어디로 퍼졌을지 확인하는 데 쓴다. 전역 조인 키가 없어 같은 기관의 태안발전소 대기오염물질·수질 측정 자료와는 측정일시와 발전소명을 맞춰 붙이고, 기상청 관측 자료와는 날짜·지역 이름으로 연결해야 한다.
