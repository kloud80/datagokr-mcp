description_portal: 등유의 품질기준은 석유 및 석유대체연료 사업법 제24조에 따라 석유제품 품질기준과 검사방법 및 검사수수료에 관한 고시에서 정하고 있습니다.등유는 등불, 난방, 취사 등의 용도에 적합한 연료로서 물과침전물을 함유하지 아니하고 다음의 품질기준에 적합하여야 합니다.등유의 품질기준 항목은 인화점, 증류성상, 황분, 연점, 동판부식, 색(세이볼트색도), 식별제 첨가량 등이 있습니다.인화점의 시험방법은 태크밀폐식 시험방법을 적용합니다.품질기준에서 규정하는 식별제(이하 "법정 식별제"라 한다)는 한국석유관리원의 식별제 적합성평가 요령에 따른 식별제의 석유제품 적용 검증 및 평가절차 등을 거쳐 적합 판정을 받은 제품 중 산업통상자원부장관이 선정합니다.
