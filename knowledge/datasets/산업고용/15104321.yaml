description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2017년 ~ 2021년까지의 충청남도 시군별 신재생에너지 연료원별 전력거래량 및 설비용량을 나타냅니다.*단위 : 전력거래량(MWh), 설비용량(MW)※ 전력거래량 및 설비용량은 수정정산으로 인해 값이 변경될 수 있습니다.'
