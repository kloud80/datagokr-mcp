description_portal: '한국지역난방공사의 지역냉방 보급 및 판매현황 데이터를 정리한 자료로, 용도별(주택용·업무용·공공용 등) 지역냉방 사용자 수와 연도별 판매량(Gcal)을 통해 냉방에너지 보급 확대 추세와 수요 변화를 분석할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 구분: 데이터의 항목 구분으로 사용자 수 또는 판매량을 구분(예시: 사용자(건물수), 판매량(Gcal))■ 용도(종별): 지역냉방이 공급되는 주요 수요처 유형(예시: 주택용, 업무용, 공공용, 냉수용)■ 2020년~2024년: 각 연도별 냉방 공급 건물 수 및 판매량(Gcal) 수치(예시: 주택용 사용자수 13→24, 판매량 3,065→9,063)3. 활용 예제:■ 연도별 지역냉방 보급 추이를 분석하여 에너지 효율 개선 및 냉방 수요 예측 모델 구축■ 용도별 냉방 판매량 비교를 통해 공공·업무·주택 분야의 냉방 에너지 소비 패턴 파악■ 지역난방 및 냉방 통합 에너지 관리정책 수립, 탄소저감형 냉방 기술 개발 및 보급 전략 수립에 활용'
