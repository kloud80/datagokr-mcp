description_portal: 본 데이터는 「에너지이용합리화법」에 의거하여 연간 에너지 사용량이 2,000toe 이상인 에너지다소비사업자가 에너지 사용량신고 사업에 의무적으로 신고한 에너지 사용 현황을 상세히 제공합니다. 전국의 각 17개 광역시도별로 연도별, 산업 및 상업 등 주요 부문별 다소비사업자들의 에너지 사용량을 세부적으로 공개하여 지역 및 부문 간의 에너지 소비 특성과 트렌드를 명확히 파악할 수 있습니다. 이를 통해 정부와 지방자치단체는 에너지 수요 관리와 효율적인 에너지 정책을 수립할 수 있는 기초자료로 활용 가능하며, 기업 및 연구기관에서는 본 데이터를 바탕으로 에너지 효율 개선 전략 수립, 에너지 소비 패턴 분석, 온실가스 저감 방안 연구 및 지속 가능한 에너지 관리 모델 구축 등 다방면의 활용이 가능합니다.
