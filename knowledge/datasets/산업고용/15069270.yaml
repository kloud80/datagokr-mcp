summary_user: 한국지역난방공사의 열생산량을 기준연도·사업소(지사)·생산 구분별로 한 행에 담고 1월~12월 값을 열로 펼친 월별 집계 파일(CSV)이다. 에너지 분석가가 지사별·연도별 총 열생산량 추이나 생산 구분별 월간 패턴을 보고, 같은 공사의 열판매량과 비교해 생산 대비 판매 실적을 따지는 데 쓴다. 전역 조인 키가 없어 사업소명과 기준연도를 이름으로 맞춰 같은 기관의 열판매량·열공급 자료와 이어 쓴다.
