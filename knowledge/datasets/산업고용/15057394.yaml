summary_user: 경기도 내 방문판매업체를 사업장 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태(정상영업·폐업 등)·폐업일자·도로명/지번 주소·WGS84 좌표·전화번호와 일부 사업장의 자산·부채·자본금 규모를 담는다. 우리 동네에서 정상 영업 중인 방문판매업체가 어디이고 최근 폐업이 늘었는지를 확인하려는 소비자·지자체 담당자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 사업장명·주소 매칭, 좌표 기반 공간 결합으로 소상공인 상가업소 등 다른 LOCALDATA 업종 인허가 자료와 이어 쓴다.
description_portal: 이 데이터는 판매업자가 소비자를 직접 방문하여 재화나 용역을 판매하는 방문판매업체의 현황을 정리한 자료입니다. 각 업체의 인허가일자, 영업상태(정상영업·폐업 등), 폐업일자, 사업장 주소 및 좌표, 전화번호와 같은 기본 정보가 포함되어 있으며, 일부 사업장은 자산·부채·자본금 규모도 제공됩니다. 도로명·지번주소 및 WGS84 위·경도 좌표를 통해 업체의 공간적 분포를 분석할 수 있으며, 영업상태 변화를 통해 지역 내 방문판매업 운영 현황과 추세를 파악할 수 있습니다. 이 데이터는 방문판매업 관리·감독, 소비자 보호 정책 마련, 지역 상권 분석, 판매업의 재무적 건전성 검토 등 다양한 행정 및 연구 목적에 활용될 수 있습니다.
