description_portal: 한국장애인고용공단 고용개발원(EDI)은 국내 장애인 고용 사업의 지속적인 발전을 위해서 급변하는 고용 환경 변화에 따른 요구들에 대해 이론적, 실증적 해결방안을 모색하는 연구개발 사업을 수행하고 있습니다. 한국장애인고용공단_장애인 고용 연구보고서 목록은 고용개발원에서 수행한 장애인 고용 정책 관련  연구보고서 목록(기본과제, 현안과제)입니다. 본 연구서에는 장애인 고용 정책과 관련한 다양한 내용들을 담고 있으며, 연구보고서 및 자료 원문 데이터는 고용개발원 홈페이지(edi.kead.or.kr > EDI Report > 각 보고서 카테고리별 분류에서 검색)에서 확인할 수 있습니다.
