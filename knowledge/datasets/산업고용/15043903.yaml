summary_user: 광주광역시 동구 관내 석유판매업(주유소)을 한 곳당 한 행으로 담은 파일로, 상호·주소·상표·전화번호 같은 기본 정보만 있으며 파일 크기는 609바이트로 작다. 동구 주민이나 운전자가 '동구에 어떤 주유소가 어디 있고 어느 정유사 상표인가'를 확인하거나, 분석가가 지역 내 주유소 분포를 볼 때 쓴다. 주유소 ID나 좌표 같은 전역 조인 키가 없어 오피넷 유가·전국주유소표준 데이터와는 상호·주소를 맞춰 보는 방식으로만 이어 쓴다.
