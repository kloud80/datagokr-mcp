description_portal: 재생에너지 사용확인제도(한국형 RE100)는 국내 기업이 사용하는 전력의 100%를 태양광, 풍력 등 재생에너지로 전환하도록 장려하여 ESG 경영 확산과 온실가스 감축 목표를 달성하기 위한 제도입니다.본 데이터는 재생에너지 사용 확인제도 참여 기업의 현황을 상세하게 제공하며, 주요 항목은 거래일자, 계약형태, 거래건수, 거래물량(MWh 및 REC 기준), 평균단가(원/MWh, 원/REC)로 구성되어 있습니다.기업과 연구기관은 본 데이터를 통해 재생에너지 사용 현황과 이행 추이를 파악하여 에너지 전략 수립, ESG 평가 대비 및 친환경 경영 연구개발에 활용할 수 있습니다.또한 정부 및 관련 기관은 제도 참여 기업 현황과 재생에너지 거래 추이를 분석하여 정책 수립 및 제도 개선을 위한 기초자료로 활용할 수 있습니다.
