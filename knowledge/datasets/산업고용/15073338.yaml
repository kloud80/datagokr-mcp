summary_user: 중소벤처기업진흥공단이 운영하는 청년창업사관학교의 운영사별 권역, 사관학교명, 운영사, 상세주소, 창업사무실 수용가능 인원(명)을 사관학교 한 곳당 한 행으로 담은 전국 단위 목록 파일이다. 창업 3년 이내·대표자 만 39세 이하 청년 창업자가 가까운 지역 사관학교가 어디에 있고 창업공간을 몇 명까지 받는지 확인하거나, 분석가가 권역별 창업공간 수용 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 사관학교명·운영사 이름을 맞춰 연결해야 한다.
description_portal: 중소벤처기업진흥공단의 청년창업사관학교 운영사 소재지, 상세주소 및 지역 청년창업사관학교별 창업사무실 수용가능 인원 수를 확인하실 수 있는 데이터 입니다.2011년부터 중소벤처기업진흥공단에서 운영하고 있는청년창업사관학교는 창업 3년 이내이며 대표자가 만 39세 이하인 청년 스타트업을 대상으로 지원하는 청년창업지원사업입니다. 청년창업사관학교 입교시 사업화지원금과 창업코칭 및 교육, 창업공간, 공단사업 연계지원 등 창업에 필요한 다양한 지원을 제공받을 수 있습니다.
