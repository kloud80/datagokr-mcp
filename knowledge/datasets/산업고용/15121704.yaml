description_portal: 최근 7개년간의 전체 구매액과 중소기업제품 구매 실적 및 그 비율에 대한 데이터는 공공기관의 구매 활동에서 중소기업 지원 수준과 조달 구조의 변화를 파악할 수 있는 중요한 지표입니다. 이 정보는 연도별 전체 구매액 대비 중소기업제품 구매액이 차지하는 비율을 통해 정부의 중소기업 육성 정책 이행 여부를 평가하는 데 활용되며, 공공기관의 사회적 책임 이행 수준을 보여주는 자료로도 의미가 큽니다. 또한 해당 데이터는 향후 구매계획 수립, 중소기업과의 상생협력 확대, 구매 다변화 전략 마련 등에 활용될 수 있으며, 정책기관의 모니터링 및 평가 자료로도 제공됩니다. 기관의 지속가능경영 실천 여부를 진단하는 기초자료로도 중요합니다.
