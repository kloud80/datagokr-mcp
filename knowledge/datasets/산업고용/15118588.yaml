description_portal: 본 데이터는 전력거래소에서 공개하는 전력수요 부하지속곡선 정보를 한국가스공사에서 가공하여 제공합니다. 전력수요 패턴 분석과 발전용 천연가스 수요예측을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 시간별 확률, 육지 및 제주 지역의 정규화부하지속곡선(%), 부하율, 최대수요, 평균수요, 첨두부하시간 등이 포함되어 있습니다. 본 데이터는 발전사업자, 에너지 연구기관, 전력시장 분석가, 수급계획 담당자, 전력거래 담당자, 한국전력거래소가 전력수요 패턴 분석 및 발전계획 수립에 필수적으로 활용할 수 있습니다. 전력-가스 연계 분석과 효율적인 에너지 수급계획 수립, 발전 최적화에 기여할 것으로 기대됩니다.
