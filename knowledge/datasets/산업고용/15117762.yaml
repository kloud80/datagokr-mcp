description_portal: 본 데이터는 중국, 일본, 대만 관세청에서 매월 업데이트 중인 각 국가의 월간 LNG 수입량과 수입대금 자료를 기반으로 한국을 제외한 아시아 3개국의 LNG 수입단가 산출하여 제공하는 정보입니다. 각국 관세청에서 매월 업데이트하는 LNG 수입량과 수입대금 공식 자료를 기반으로 한국을 제외한 아시아 주요 3개국의 LNG 수입단가를 체계적으로 산출하였습니다. 데이터 구성 항목으로는 연월일, 일본물량(Ton), 일본수입대금(1000달러), 일본단위가격(MMBtu당달러), 중국물량(Ton), 중국수입대금(1000달러), 중국단위가격, 대만 관련 수입 정보 등이 포함됩니다. 본 데이터를 활용하면 아시아 주요국의 LNG 수입단가 동향을 시계열로 비교 분석할 수 있습니다. 이를 통해 에너지 기업 및 정책기관의 LNG 도입가격 협상 전략 수립, 장기 수급계획 수립, 국제 LNG 시장 동향 분석, 에너지 정책 의사결정에 핵심 참고자료로 활용할 수 있으며, 에너지 안보 강화 방안 마련에도 크게 기여할 수 있습니다.
