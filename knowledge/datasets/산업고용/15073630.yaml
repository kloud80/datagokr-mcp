description_portal: '중소벤처기업진흥공단에서 관리하는 상생협력형 내일채움공제의 연도별 참여기관 및 신규 선정 기업수입니다. 참여기관명, 기관유형별 2015년~2025년간 각 년도별 참여기업 수를 집계합니다. 참여 기관 유형으로는 지방자치단체, 민간기업(대기업), 공공기관(공기업), 특수법인으로 나뉘어집니다. *상생협력형 내일채움공제 : 대외기관이 가입자의 납입금을 지원하는 상품입니다. 각 참여 기관과의 협약을 통하여 진행되며, 참여 기관은 내일채움공제 홈페이지상 공고를 통해 공모를 받습니다.'
