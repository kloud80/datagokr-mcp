description_portal: 대전광역시 2016년부터 2020년까지 가스 안전장치인 타이머 콕 연간 보급 설치 현황 자료는 도시가스 및 LPG를 사용하는 취약 계층의 가구, 경로당, 사회복지시설 등을 대상으로 설치된 가스 자동 차단 장치(타이머 콕)의 연도 별 보급수 등 핵심 내용을 포함하고 있습니다. 해당 자료는 잠금 장치 보급을 통해 가스 취급 부주의, 과열 사고, 노인 및 장애인 등 취약 계층 가구의 화재 및 중독 사고 예방 효과를 높이고, 안전 사각지대 해소 및 시민 생명·재산 보호를 목표로 추진된 사업의 실질적 성과를 파악할 수 있게 합니다.  본 자료는  2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
