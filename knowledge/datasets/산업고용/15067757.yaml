description_portal: 한국광해광업공단은 국가기술자격의 질적 수준 향상과 현장성 강화를 위해 광업자원분야(광해, 자원) 자격 검정 업무를 전문기관으로서 수행하고 있습니다. 이러한 검정은 광산피해의 방지 및 복구에 관한 법률에 따라 전문사업자 등록 시 필수 요건으로, 자격 취득자는 실무 인재로서 현장에 투입됩니다. 공단은 자격 취득자를 대상으로 지속적인 사후 관리 교육을 실시하여, 전문성과 역량을 강화하고 있습니다. 이와 관련된 국가기술자격 검정 현황은 공공데이터포털을 통해 개방되어 있으며, 관심 있는 기업 및 개인은 이를 통해 자격 취득 현황과 교육 이력을 확인하고 활용할 수 있습니다.
