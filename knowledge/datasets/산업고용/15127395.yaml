description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 연도별 연료원별 시간대별 설비용량 및 전력거래량 정보입니다.본자료는 전력시장에서 거래하는 발전기의 정보만 포함하고 있습니다.전력거래량(발전량)은 소내용 및 주변압기 손실분 등을 제외한 송전단 기준 발전량입니다.추후 수정정산 등에 의해 수치는 변경될 수 있습니다.
