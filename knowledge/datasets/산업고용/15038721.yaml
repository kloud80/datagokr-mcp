description_portal: 한국수력원자력㈜이 공개하는 표준중수로 용어집은 중수로형 원자력발전소에서 사용되는 전문 용어를 한글과 영문으로 체계적으로 정리한 데이터셋입니다. 총 6,531개의 용어가 수록되어 있으며, 원전의 설계, 운전, 유지보수 등 중수로형 원전의 다양한 분야에서 실제로 활용되는 표준 용어들을 폭넓게 포함하고 있습니다. 이 용어집은 원자력 산업 현장에서 근무하는 실무자는 물론, 연구자와 번역가, 학생 등 여러 이용자들이 중수로형 원전 분야의 전문 용어를 명확히 이해하고 올바르게 사용할 수 있도록 지원합니다. 또한 용어의 표준화와 일관성을 제공함으로써 기술 문서 작성, 연구 활동, 국제 협력 및 교육 과정에서 유용한 참고 자료로 활용될 수 있습니다. 이는 원자력 산업의 전문성과 신뢰성을 높이는 데 기여하는 중요한 공개 데이터입니다.
