summary_user: 국내 상업용 원자력발전소에서 발생한 사고·고장(보고대상사건) 건수를 연도별로 1차 계통·2차 계통·기타로 나눠 담은 전국 단위 집계 파일로, 내려받은 CSV가 101바이트에 불과한 작은 표다. 원전 안전에 관심 있는 국민이나 분석가가 "원자로 쪽(1차 계통)과 발전 설비 쪽(2차 계통) 중 어디에서 고장이 더 자주 나고, 연도별로 줄어드는 추세인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 원전 가동·안전성능 데이터와는 연도(년도) 기준으로 맞춰 붙여 쓴다.
description_portal: 국내에서 발생한 원자력이용시설(상업용 원자력발전소)의 사고 및 고장 현황 데이터를 원자력발전소 계통(1차계통, 2차계통, 기타 등)에 따라 구분하고 이를 연간 주기로 갱신하여 제공합니다. 1차 계통은 원자로를 포함하여 열을 생산하고 생산된 열을 2차 계통에 전해주는 부분이며, 2차 계통은 1차 계통에서 얻은 열에 의해 발생된 증기를 이용하여 전기를 생산하는 부분입니다. 발전소 계통에 따라 구분된 사고·고장 데이터를 기반으로 연도별 발생추이를 확인할 수 있는 통계그래프 또한 공개하고 있으며 이를 통해 정보이용자로 하여금 계통별 보고대상사건 발생 추이를 직관적으로 열람할 수 있도록 정보 공개를 수행하고 있습니다.
