summary_user: 전라남도 담양군 안 태양광 발전시설을 시설 한 곳씩 담은 원장 파일로, 시설명·도로명/지번 주소·위도·경도·설비용량·공급전압·주파수·설치연도를 담는다. 담양군 읍면별로 태양광 발전소가 어디에 얼마나 들어서 있고 설비용량이 어느 정도인지 파악하려는 지역 에너지 분석가나 주민이 쓴다. 전역 조인 키는 없어서, 전국태양광발전소전기사업허가정보표준데이터 같은 다른 발전소 원장과는 주소·시설명 대조나 좌표로 이어 쓴다.
description_portal: '전라남도 담양군 태양광시설의 발전소시설명, 도로명주소, 지번주소, 위도, 경도, 설비용량, 공급전압, 주파수, 설치연도 등 주요 항목에 대한 정보를 제공하고 있으며, 제공데이터는 무료로 활용이 가능합니다.전라남도 담양군에서 수집한 이 데이터는 재생에너지 보급 현황을 파악하고, 지역별 에너지 자립도 분석, 탄소중립 정책 수립, 신재생에너지 수요 예측 등에 활용될 수 있습니다.* 읍면기준 담양읍 : 170건, 창평면 : 115건, 무정면 109건 순서로 가장 많은 발전소 가동* 데이터 변경 안내 : 시설 목록 추가 및 내용 현행화'
