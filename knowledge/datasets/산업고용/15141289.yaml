summary_user: 서울 금천구의 사료제조업 사업장을 한 곳씩 담은 인허가 원장으로, 인허가·취소·휴업·폐업 일자와 영업상태, 사업장명, 지번·도로명 주소, 좌표, 업태와 축산 관련 구분을 사업장 단위로 담는다. 축산 관련 연구자나 행정 담당자가 금천구에서 현재 영업 중인 사료제조업체가 어디에 몇 곳 있는지 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 바로 맞물리는 전역 조인 키를 찾지 못해, 같은 지방행정 인허가(LOCALDATA) 계열 데이터와는 기관 코드(OGDP_INST_CD)·관리번호나 사업장명·주소 매칭으로, 지도 데이터와는 좌표로 연결한다.
description_portal: 금천구 내 사료제조업체의 인허가 현황을 제공하는 데이터로, 인허가 일자, 영업상태, 취소 및 폐업·휴업 이력, 사업장명, 소재지, 전화번호, 업태 구분, 축산 관련 구분, 사업장 면적, 좌표 정보, 총 인원 등 다양한 항목을 포함하고 있습니다. 이를 통해 신규 및 기존 사료제조업체의 영업 현황을 종합적으로 파악할 수 있으며, 축산업 관련 정책 수립, 산업 동향 분석, 지역 내 사료 제조업체 현황 조사, 사업장 위치 확인 등에 활용할 수 있습니다. 또한 행정기관, 연구기관, 민간 기업 등에서 축산 자원 관리, 공급망 분석, 산업 지원 계획 수립 등 다방면에서 유용하게 사용할 수 있는 기초 자료입니다.
