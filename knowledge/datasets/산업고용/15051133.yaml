summary_user: 광업등록사무소 통계집에 실린 개발 광업권 등록현황을 연도·광종(금속광/비금속광 분류 포함)별로 묶고, 시도를 열로 펼쳐 건수를 담은 전국 단위 집계표(CSV 약 12KB)이며 포털 설명상 2012년 이후 자료다. 연구자나 지역 정책 담당자가 '강원·경북에서 석회석 같은 특정 광종의 개발 광업권이 해마다 늘었나 줄었나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 광업·토석채취 자료나 시도 통계와는 연도와 시도 이름, 광종 이름을 맞춰서만 이어 쓴다.
description_portal: 광업권 등록현황 - 광종별 시도별 개발 광업권 현황 공공데이터는 산업통상자원부 광업등록사무소에서 매년 발간하는 광업권 설정출원 및 등록현황 통계집에 수록된 광업권 등록현황 중 2012년 이후 광종별, 시도별 개발 광업권 현황에 대한 데이터로 연도, 광종분류(금속광, 비금속광), 광종(광업법 제3조에 규정된 법정광물), 시도(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남) 등의 항목을  기계 판독이 가능한 형태(소프트웨어로 데이터의 개별내용 또는 내부구조를 확인하거나 가공할 수 있는 상태)로 정비하고 CSV 오픈포맷으로 공공데이터포털(www.data.go.kr)을 통하여 누구나 쉽게 활용할 수 있도록 제공하고 있습니다.
