summary_user: 국가기술표준원 제품안전정보센터가 관리하는 제품 위해사고 정보를 사고 건별로 담은 전국 단위 파일로, 품명·제품분류·제조국가·위해부위·치료비용·사고발생일을 포함하며 포털 설명상 2018년부터 2025년 8월까지를 다룹니다. 소비자나 분석가가 어떤 제품분류나 제조국가의 제품에서 신체 어느 부위의 사고가 자주 나고 치료비가 얼마나 드는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 리콜·안전인증 등 다른 제품안전 데이터와는 품명·제품분류 같은 이름 매칭으로만 이어 쓴다.
