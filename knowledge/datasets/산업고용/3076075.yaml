summary_user: 한국서부발전 발전소의 호기(발전기)별·연도별 설비용량, 발전량, 이용률을 담은 연 단위 실적 데이터로, 포털 설명상 2014년부터 2020년까지를 다룹니다. 에너지 분석가가 서부발전의 특정 발전소·호기가 연도별로 얼마나 가동됐고 이용률이 어떻게 변했는지 비교할 때 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키가 없어, 발전소명(gennm)·호기명·연도를 이름으로 맞춰 다른 발전사 실적이나 발전소 원장과 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매핑으로만 연결된다. 전력거래소의 실시간·일별 수급 정보가 아닌 연간 실적이므로 오늘의 수급이나 시간별 발전량 확인에는 맞지 않는다. 개발계정은 하루 10회 호출로 제한된다.
