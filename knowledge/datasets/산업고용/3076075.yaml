description_portal: 한국서부발전 발전기,발전원별 설비용량 및 발전량 데이터 정보입니다. 발전기별 및 발전원료별 설비용량, 발전량, 열효율, 이용률 데이터를 종합하면 각 발전기의 성능과 운영효율성을 다각도로 파악할 수 있습니다. 설비용량은 해당 발전기가 최대 출력으로 생산할 수 있는 이론적 전력규모를 의미하며, 실제 발전량은 일정 기간 동안 생산된 전력량을 보여줍니다. 열효율은 투입된 연료 에너지가 전력으로 얼마나 전환되었는지를 나타내는 지표로, 설비의 기술수준과 운영 조건을 반영합니다. 이용률은 설비용량 대비 실제 운전 비율을 보여주어 발전기가 얼마나 안정적이고 지속적으로 가동되는지를 알 수 있습니다.데이터 기준은 2014년 부터 2020년까지의 데이터 입니다.제공데이터는 발전량, 운용율운전, 발전원, 발전소명, 년, 호기, 용량 입니다.
