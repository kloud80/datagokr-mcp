description_portal: '한국지역난방공사의 정보자원 장애 대응 체계에서 장애 유형별 목표 처리시간을 정의한 데이터로, 장애 등급·영향도·긴급도에 따른 대응 기준을 설정하여 IT 서비스의 신속한 복구와 품질 관리 수준을 확보하기 위한 기준 자료입니다.1. 형식: CSV2. 내용 요약:■ 장애명: 장애 영향도와 긴급도를 조합한 유형 정의(예시: 영향도(상) * 긴급도(B))■ 장애 영향도: 서비스 또는 업무에 미치는 영향의 수준(예시: 상(High), 중(Medium), 하(Low))■ 장애 긴급도: 장애 발생 시 즉시 조치가 필요한 정도(예시: 상, 중, 하, 해당없음)■ 장애 등급: 장애의 영향도에 따른 관리 등급(예시: 1등급~5등급)■ 목표처리시간분: 해당 장애를 복구해야 하는 목표 시간(단위: 분)(예시: 30, 120, 480)3. 활용 예제:■ 장애 유형별 목표 복구시간(SLT) 기반의 서비스 수준 협약(SLA) 관리 및 성과 평가 지표로 활용■ 장애 대응 우선순위 설정 및 자동 알림 시스템 구축을 통한 신속 대응 체계 마련■ 장애 발생 패턴 분석을 통해 IT 인프라 안정성 향상 및 예측형 유지보수 정책 수립에 활용'
