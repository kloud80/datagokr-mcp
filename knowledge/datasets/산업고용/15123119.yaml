description_portal: '이 데이터는 산재보험 급여 지급 현황을 의료기관 종별(상급종합병원, 종합병원, 병원, 의원, 치과, 한방 등)로 집계한 통계 자료입니다. 수급자 수, 총 지급일 수, 진료비 지급 총액 등 기본적인 지급 현황뿐만 아니라, 1인 평균 지급일 수, 1인 평균 지급액, 1인 1일 평균 진료비와 같은 주요 분석 지표를 계산하여 제공합니다. 이 자료는 산재 근로자들이 재해 후 치료를 위해 주로 어떤 종별 의료기관을 이용하는지, 그리고 각 종별 의료기관에서 발생하는 진료비 규모와 요양 기간의 효율성을 파악하는 데 필수적인 근거 자료입니다.본 데이터는 산재보험 의료 서비스의 질과 효율성을 평가하고 개선하는 데 중요한 자료입니다. 이 자료를 활용하여 의료기관 종별로 1인 1일 평균 진료비의 차이를 분석함으로써, 각 기관의 진료 행태와 비용 구조의 적정성을 비교 검토할 수 있습니다. 또한, 상급종합병원 등 대형 병원에서의 1인 평균 지급일 수가 상대적으로 짧은 점 등을 분석하여, 중증 재해자에 대한 집중 치료 후 조기 퇴원과 지역 병원 연계 재활 시스템의 효율성을 진단하고 강화 방안을 모색하는 데 기여할 수 있다고 판단됩니다.- 1인 평균 지급일 수 = 총 지급일 수/수급자 수- 1인 평균 지급액 : 지급 총액/수급자 수            - 1인 1일 평균 지급액: 1인 평균 지급액/1인 평균 지급일 수'
