summary_user: 충청남도 공주시가 허가한 토석채취 사업을 허가 건별로 담은 파일로, 수허가자 상호·사무실 연락처·허가지 주소·채취 용도·허가면적·허가량·허가 시작일과 종료일을 담는다(파일 크기 863바이트의 소규모 목록). 골재 수급이나 지역 개발을 검토하는 사업자·분석가가 '공주시 어디에서 어떤 용도로 언제까지 토석채취가 허가돼 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어 허가지 주소를 주소·좌표로 바꾸거나 업체명을 이름으로 매핑해 국토 공간 규제·필지 데이터와 겹쳐 본다.
description_portal: 지역 개발, 공공 인프라 건설, 산업단지 조성 등에 필요한 골재(모래, 자갈, 흙 등)를 확보하기 위한 공주시 토석채취 사업 현황 및 골재관련 정보에 관한 데이터로 충청남도 공주시 토석채취현황에 대한 데이터로 (사무실 연락처, 허가지 주소, 토석채취용도, 허가면적, 허가시작일) 등의 항목을 제공합니다. 토석채취의 인허가 신청은 산지관리법 25조에 따라 국유림이 아닌 산림의 산지에서 토석을 채취하려는 자는 대통령령으로 정하는 바에 따라 다음 각 호의 구분에 따라 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장에게 토석채취허가를 받아야 합니다.
