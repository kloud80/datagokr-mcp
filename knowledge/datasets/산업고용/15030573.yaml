description_portal: 본 데이터는 경기도 광주시에 위치한 음식물 자원화 시설 정보를 제공합니다. 음식물쓰레기를 수거하여 퇴비, 사료 등으로 재활용하는 자원화 시설의 정보를 담고 있습니다. 시설명과 시설유형은 각 시설의 명칭과 처리 방식을 나타내며, 소재지 도로명주소와 지번주소는 시설의 위치를 제공합니다. 위도와 경도는 지리 좌표 정보이고, 관리기관명과 연락처는 시설 운영 주체와 문의처를 안내합니다. 본 데이터는 2024년 8월 기준 자료이며, 광주시 음식물 자원화시설은 2025년 5월에 폐쇄되어 이후 운영하고 있지 않음을 알려드립니다.
