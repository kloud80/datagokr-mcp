summary_user: 한국고용정보원이 펴낸 보고서·브리프·매뉴얼 등 발간물을 한 건씩 제목·저자·등록일·열람 URL로 담은 전국 단위 목록 파일이다(csv, 약 70KB). 연구자나 진로상담사가 '신직업 개발이나 청년 고용 관련 고용정보원 보고서가 무엇이 있고 어디서 원문을 볼 수 있나'를 찾을 때 쓴다. 실측 컬럼에 직업분류 코드 같은 전역 조인 키가 없어, 다른 직업·고용 데이터와는 제목 속 주제어나 기관명으로만 느슨하게 연결한다.
description_portal: 「한국고용정보원_발간물_목록」 데이터는 한국고용정보원이 제작·제공한 각종 보고서, 브리프, 매뉴얼 등 발간물의 제목과 열람용 URL을 수록한 자료다. 사용자는 이 파일을 통해 다양한 고용 관련 정보를 손쉽게 검색·활용할 수 있다. 발간물은 크게 △고용동향 및 노동시장 변화 △직업 및 신직업 연구 △재취업·직무 활용 △지역 고용 및 인력수급 △청년·여성·고령층 등 대상별 고용이슈 △코로나19 관련 고용영향 등 여섯 가지 주제로 분류된다. 특히 고용동향 브리프, 직업정보 비교, 신직업 개발, 일자리 전망, 노동시장 특성 분석 등 다양한 정책·통계 기반 보고서를 포함하고 있어 정책 수립, 학술 연구, 진로 상담 등에 폭넓게 활용될 수 있는 데이터이다.
