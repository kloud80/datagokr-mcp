summary_user: 녹색인증 평가를 맡는 기관의 목록으로, 기관별 한 행에 발급 부처명·평가기관명·담당부서·기관 형태·설립년도·대표자·소관 행정기관·본사 우편번호와 주소를 담는다(포털 설명상 9개 부처 11개 기관, CSV 약 1.8KB). 녹색기술 인증을 준비하는 기업이 자기 기술 분야를 어느 부처 소관 평가기관에 신청해야 하는지, 그 기관의 담당부서와 소재지가 어디인지 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없고, 평가기관명이나 부처명을 이름으로 맞추거나 같은 기관의 평가기관코드를 쓰는 데이터와만 연결된다.
description_portal: 녹색인증은 녹색기술에 대한 법정 인증으로서 녹색산업 성장 기반을 조성하며, 산업부를 포함한 9개 부처의 11개 평가기관의 목록입니다. 이 데이터는 정부와 기업이 녹색산업에 대한 정보를 참고하고, 각 기관의 역할과 기능을 이해하는 데 도움이 됩니다. 녹색 인증은 환경친화적 산업 발전을 위해 필수적인 요소로, 이를 통해 기업들은 환경 규정을 준수하고 지속 가능한 발전을 이룰 수 있는 기반을 마련할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  평가기관코드(문자형), 부처명(문자형), 평가기관명(문자형), 담당부서(문자형), 평가기관 형태(숫자형), 평가기관 설립년도(숫자형), 대표자(문자형), 소관 행정기관(문자형), 본사우편번호(숫자형), 본사주소(문자형), 데이터 등록일자(숫자형) 입니다. 이 정보를 통해 사용자는 각 평가기관에 대한 기초적인 정보를 수집하고 분석하여, 녹색인증을 취득하거나 이를 활용하여 사업 전략을 수립하는 데 활용할 수 있습니다.
