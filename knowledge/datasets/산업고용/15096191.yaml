description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 목록은 전력거래소 연간 교육일정(교육유형, 교육과정명, 연도, 기수, 신청시작일, 종료일, 수강시작일, 종료일, 교육대상, 수강료)을 제공합니다.ㅇ 향후 여건에 따라 교육일정이 변경될 수 있습니다.
