summary_user: 한국남부발전(주)이 운영하는 발전소별로 거래일자 하루 단위의 설비용량, 공급능력, 금일·전일 공급능력과 전일 대비 증감을 담는 조회형 API이며, 범위는 전국·비공간입니다. 에너지 분석가가 '특정 날짜에 남부발전 각 발전소의 공급능력이 전날보다 얼마나 줄거나 늘었나'를 확인하거나 일별 공급능력 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 전력 수급·발전량 데이터와는 발전소명(statioinnm)이나 거래일자로 이름·날짜를 맞춰 연결하고, 발전소 인덱스는 같은 기관 데이터 안에서만 연결에 쓴다.
limits: 표준 행정코드나 전역 발전소 코드가 없어 다른 기관 데이터와 붙일 때는 발전소명 수동 매핑이 필요하다. 개발계정은 하루 10,000회 호출로 제한되며 serviceKey를 쿼리로 넘겨야 한다.
