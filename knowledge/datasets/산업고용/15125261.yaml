description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전소별 공급능력 조회 서비스_GW 서비스입니다.해당 API를 통해 사용자는 조회를 원하는 날짜의 발전소별 공급능력을 조회할 수 있습니다.조회 결과는 각 날짜별로 발전소별 세부 발전량을 확인할 수 있습니다. 해당 내용을 바탕으로 일별 발전량 추이 분석 등을 수행할 수 있습니다.또한, 발전원별 전력생산량 비교 등 다른 데이터와 결합하여 다양한 분석의 기초자료로 활용 가능합니다.
