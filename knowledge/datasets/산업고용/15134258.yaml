description_portal: 중소벤처기업진흥공단에서 청년의 창업을 지원하고자 운영하는 창업성공패키지의 청년창업사관학교 입교생을 대상으로 진행한 청년창업사관학교사업에 대한 설문 정보 데이터 입니다. 2011년부터 중소벤처기업진흥공단에서 운영하고 있는청년창업사관학교는 창업 3년 이내이며 대표자가 만 39세 이하인 청년 스타트업을 대상으로 지원하는 청년창업지원사업입니다. 청년창업사관학교 입교시 사업화지원금과 창업코칭 및 교육, 창업공간, 공단사업 연계지원 등 창업에 필요한 다양한 지원을 제공받을 수 있습니다. 해당 "청년창업사관학교 설문 정보" 설문제목, 설문설명, 교육/코칭명, 설문응대기간, 설문대상 수를 확인하실 수 있습니다.
