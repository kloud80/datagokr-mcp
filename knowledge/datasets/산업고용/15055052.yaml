description_portal: '인천광역시가 제공하는 교육정도별 취업자 현황 공공데이터는 인천 시민의 취업자 현황을 성별과 **교육 정도(학력)**를 기준으로 세분화하여 분기별로 집계한 통계 자료입니다. 이 데이터는 지역 노동 시장의 학력별 인력 구조와 교육 수준에 따른 고용 분포를 객관적으로 파악하고, 인적 자원 개발 정책, 직업 훈련 및 교육 투자 계획, 청년층 고용 대책 등의 기초 자료로 활용되는 것을 목적으로 합니다.<주요 구성 항목>*성별: 취업자를 남자와 여자로 구분합니다. * 분기별: 데이터가 1/4분기부터 4/4분기까지 분기별로 제공되어 계절적 고용 변화를 학력별로 파악할 수 있습니다.*교육 정도(학력)별 구분: 취업자 수를 최종 학력에 따라 다음과 같이 분류하여 제공합니다.'
