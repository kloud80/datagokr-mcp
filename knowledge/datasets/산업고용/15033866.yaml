description_portal: 충청남도 금산군에 위치한 태양광 발전소 설치현황 데이터입니다. 총 1882개의 설비에 대해 발전소명, 소재지, 설비용량(kW), 공급전압(V), 주파수(Hz), 최초허가일, 사업개시일의 정보가 수록되어 있습니다. 지역 에너지 자립도 향상과 탄소중립 정책 수립을 위한 핵심 데이터이며, 이를  기반으로 신재생에너지 보급률을 분석하여 보급 정책을 수립하는데 활용될 수 있습니다. 또한 에너지 수급 계획, 전력망 연계 분석 등에도 활용 가능합니다. 시설 주소 정보도 제공되어 공간 기반의 전력 수급 전략 수립에도 유용합니다. 해당 데이터는 연간 업데이트 됩니다.
