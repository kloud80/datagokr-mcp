summary_user: 충청북도가 선정한 일자리 우수기업의 인증현황을 기업 단위 건별로 담으며, 인증번호·시군·기업체명·대표자·주요 생산품·인증기간을 제공한다. 구직자가 충북 특정 시군에서 일자리 우수기업으로 인증받은 회사와 그 생산품·인증기간을 확인하거나, 분석가가 시군별 인증기업 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기업체명이나 시군명을 매핑하는 방식으로만 이어 쓴다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 고용보험·재무 등 다른 기업 데이터와 정확히 연결하기 어렵고, 이름 매칭에 의존해야 한다. 범위는 충청북도 시군 단위로 한정된다.
