summary_user: 경기도 내 지하수 시공업체를 사업장 한 곳당 한 행으로 담은 인허가 현황으로, 업체명·인허가일자·인허가취소일자·영업상태, 지번·도로명 주소와 WGS84 좌표, 자본금·전문인력 수·시설장비 정보가 들어 있으며 폐업·취소된 업체도 포함한다. 지하수 관정 공사를 맡길 업체를 찾는 주민이나 사업자가 '우리 시군에서 지금 영업 중인 지하수 시공업체는 어디인가'를 확인하는 데 쓰고, 분석가는 시군별 업체 분포와 폐업 추이를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)나 업체명·주소 매칭, 좌표를 통한 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 지하수 시공업체의 사업장 현황을 정리한 자료로, 각 업체의 명칭, 시군명, 인허가일자, 영업상태, 소재지 주소, 도로명 및 우편번호, 전문인력 수, 자본금, 시설장비 등의 정보를 포함하고 있으며, 위치정보(WGS84 좌표) 및 지리정보도 함께 제공됩니다. 현재 영업 중인 업체 외에도 폐업 및 인허가 취소 이력 등을 포함하고 있어 지하수 관련 산업의 변화 흐름을 파악할 수 있습니다. 이 데이터는 지역별 지하수 자원 개발 인프라 분석, 수자원관리 계획 수립, 건설산업 구조 분석, 중소 건설업체 통계 구축, 환경영향평가 등 다양한 분야에서 활용될 수 있습니다.
