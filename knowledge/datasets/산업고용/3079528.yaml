summary_user: 안양시에서 담배소매인으로 지정된 소매점을 업소별로 한 건씩 담은 파일로, 상호명(업소명)과 도로명·지번 주소를 담는다. 편의점 창업이나 담배소매인 지정 신청을 앞둔 사업자가 예정 점포 근처에 이미 지정된 소매점이 있는지(일반 소매점 간 100m 거리 제한) 확인하거나, 분석가가 시 안의 담배 판매점 분포를 지도로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 맞춰 잇거나 주소를 좌표로 바꿔 상가업소 정보·LOCALDATA 인허가 원장과 겹쳐 본다.
description_portal: '안양시 담배소매인  지정된(업소명, 업소 주소) 데이터 정보입니다.업소명-담배소매인으로 지정된 소매점의 상호명업소주소-도로명주소 및 지번주소**지정 기준 요약**- 거리 제한: 일반 소매점 간의 거리는 100m 이상 유지해야 함- 지정 대상 건물:- 역·버스터미널 등 교통시설- 공공기관·공장·군부대·운동경기장- 유원지·공원 등 입장료 지불 시설- 6층 이상, 연면적 2,000㎡ 이상 건물 내 점포- 백화점·쇼핑센터 등 대규모 점포- 거리 제한 예외: 위 건물 내 구내소매인은 거리 제한 적용 안 됨- 부적합 장소:- 야간 영업 위주 또는 자주 폐점하는 곳- 소매업이 아닌 업종- 독립된 외관·시설이 없는 점포안양시의 담배소매인 지정 정보 현황은 「담배사업법」에 따라 담배를 판매할 수 있도록 지정된 소매점들의 정보를 정리한 공공데이터입니다. 이 데이터는 담배 유통 질서 확립과 지역 내 소매점 관리에 활용됩니다.이 데이터는 지역 상권 분석, 담배 유통 정책 수립, 지도 기반 시각화 등에 유용하게 활용할수 있습니다.'
