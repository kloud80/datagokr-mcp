summary_user: 한국남동발전이 운영하는 발전소의 호기별·월별 대기오염물질 배출 농도값을 담은 API 데이터로, 발전소명·호기명·년월·오염물질 농도 구분(airCode)과 농도값을 행 단위로 제공한다. 연구자나 지역 주민이 '우리 지역 남동발전 발전소 몇 호기의 월별 대기오염물질 농도가 어떻게 변해 왔나'를 확인하거나 저감 성과를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매핑이나 같은 기관의 발전소 코드로만 연결하며, 주변 기상·환경 측정 데이터와 발전소 단위로 맞춰 쓴다.
limits: 전역 조인 키가 없어 다른 기관·부문 데이터와 자동으로 결합되지 않고, 이름 매핑이 필요하다. 개발계정은 하루 1,000회 호출로 제한된다. 범위는 전국이지만 위치 좌표가 없는 비공간 데이터라 지도 기반 분석에는 별도 위치 정보가 필요하다.
