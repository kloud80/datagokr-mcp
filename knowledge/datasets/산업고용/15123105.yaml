description_portal: '* 중소벤처기업부 규제자유특구(rfz.o.kr)에서 제공하는 데이터입니다.* 규제자유특구 내용을 다룬 언론기사 리스트입니다. * 규제자유특구는 지역을 단위로 지역과 기업이 직면한 신사업 관련 덩어리 규제를 패키지로 완화해 주는 제도로서, 이를 통해 지역으로의 투자와 양질의 일자리를 창출하여 지역의 혁신성장과 균형발전을 도모합니다. - 지역특구법 제75조 제3항 및 제4항에 따라 중소벤처기업부장관이 지정ㆍ고시한 구역* 수도권을 제외한 시·도지사는 지역의 여건과 특성에 따라 지역혁신성장사업 또는 지역전략산업을 육성하기 위해 특구계획을 수립하고 규제자유특구의 지정을 신청할 수 있다. 이 때 기업들은 시·도지사에게 사업계획을 제안하거나 시·도지사가 수립하는 계획에 참가하여 특구에서 사업 참여자가 될 수 있다. 규제자유특구로 지정되면 메뉴판식 규제특례와 규제혁신 3종 세트(규제샌드박스)등 혁신적인 규제특례가 적용되며, 지역혁신성장사업 등이 성공할 수 있도록 재정·세제·각종 부담금 감면 등도 지원 받을 수 있게 된다.* 데이터 구성요소 : 게시글번호, 등록일자, 제목, 기사링크 순'
