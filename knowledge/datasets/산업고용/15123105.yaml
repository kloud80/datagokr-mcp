summary_user: 규제자유특구를 다룬 언론기사 목록을 기사 한 건당 한 행(게시글번호, 등록일자, 제목, 기사링크)으로 담은 작은 CSV 파일(약 3.7KB)이며, 범위는 전국·비공간이다. 규제자유특구 제도나 특정 특구가 언론에 어떻게 다뤄졌는지 기사 원문을 빠르게 찾아보려는 연구자·기자·지자체 담당자가 쓴다. 실측 컬럼에 사업자번호나 지역 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 기사 제목 속 특구명·지역명을 이름으로 맞춰 연결하는 수밖에 없다.
limits: 기업·특구·지역을 식별하는 키가 없어 기업 인증 원장이나 특구 지정 현황과 바로 결합할 수 없다. 기사 본문은 없고 제목과 외부 링크만 담기므로 내용 분석에는 링크를 따라가야 한다. 이 부문에서 보조 등급, 판정 보류(defer)로 분류된 데이터다.
