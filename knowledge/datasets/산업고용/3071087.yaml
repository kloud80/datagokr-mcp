summary_user: 워크넷 직업정보를 직업 단위로 담는다. 직업분류코드·직업분류명·직업코드·직업명을 키워드·조건·분류 카테고리로 검색해 받는 전국 범위의 비공간 코드 마스터 성격 데이터다. 구직자나 진로 상담자가 '이 직업은 어느 분류에 속하고 상세 정보는 무엇인가'를 확인하는 데 쓰고, 분석가는 채용·훈련·자격 데이터를 직업분류 기준으로 묶는 기준표로 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 직업분류코드(jobClcd)·직업코드나 직업명 같은 같은 기관 코드 또는 이름 매핑으로 이어 쓴다.
description_portal: '[직업정보 API - 직업정보] 직업정보 키워드 검색, 조건별 검색, 분류별 카테고리 정보로 직업명을 검색할 수 있고, 직업상세에 대한 정보를 직업정보 API를 통해 이용할 수 있습니다. 인증키, 리턴타입, 구분자, 직업명키워드, UTF-8인코딩 등을 파라미터로 받아, 총건수, 직업분류코드, 직업분류명, 직업코드, 직업명 등의 결과를 제공합니다. * 유의사항: 문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
