description_portal: '거창군의 연도별 도시가스 공급량 정보입니다. 연도, 도시가스 공급량 으로 구분되어 있으며 거창군은 2013년부터 도시가스 공급이 시작되었습니다.○ 데이터 기준일 : 2025. 11. 01.○ 도시가스는 주로 액화천연가스(LNG)를 원료로 하여 정제 및 압축 과정을 거친 후, 지하 배관망을 통해 가정, 상업시설, 산업체 등에 공급되는 청정 에너지원입니다. 주로 난방, 취사, 온수 공급 등에 사용되며, 연소 시 이산화탄소와 질소산화물 등의 배출이 적어 환경 친화적인 에너지로 평가받습니다. 또한, 자동화된 검침 시스템과 안전장치를 통해 효율적이고 안전한 관리가 가능하며, 정부의 에너지 정책과 밀접한 관련이 있습니다.'
