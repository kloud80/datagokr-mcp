summary_user: 성남시 안에 지정된 벤처기업 집적시설을 시설 한 곳당 한 행으로 담은 목록 파일(약 4KB CSV)로, 시설명·지정번호·준공일·지정일·지번/도로명 주소·사업자명·연락처·전체 입주기업 수·입주 벤처기업 수·지정면적을 담는다. 창업자나 벤처기업이 판교·정자동 등 성남시에서 입주할 만한 벤처 집적시설이 어디에 있고 벤처기업이 얼마나 모여 있는지 확인할 때, 또는 지역 산업 분석가가 시설별 벤처 집적도를 비교할 때 쓴다. 전역 조인 키나 사업자등록번호가 없어 다른 데이터와는 시설명·주소를 맞춰 붙이는 방식으로만 연결되고, 주소를 기준으로 성남시 내 다른 기업·상권 데이터와 위치를 겹쳐 본다.
description_portal: 「벤처기업육성에 관한 특별조치법」에 따라 지정된 성남시 내 벤처기업 집적시설 현황으로, 시설명, 지정번호, 준공일, 지정일, 주소, 사명자명, 연락처, 전체입주기업수, 입주벤처기업수, 면적 항목을 포함하고 있습니다. 성남시는 경기도 내에서도 벤처기업 및 스타트업의 집적도가 높은 지역으로, 특히 분당구 정자동, 판교 테크노밸리, 수정구 시흥동 일대 등에 벤처기업 집적시설이 다수 분포하고 있습니다. 이들 시설은 기술창업과 IT 중심 기업의 성장을 지원하기 위한 공간으로 다양한 지원이 제공됩니다. 대표적인 시설로는 경기창조경제혁신센터, 판교 스타트업 캠퍼스, 킨스타워 등이 있으며, 이들은 정부, 경기도, 성남시의 협력 하에 조성되어 지역 경제와 고용 창출에 중요한 역할을 하고 있습니다.
