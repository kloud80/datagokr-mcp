summary_user: 녹색인증 3가지 대상 중 녹색전문기업 확인을 받은 기업을 한 건씩 담은 전국 단위 현황 파일로, 기업명(신청기관명)·발급 부처·확인번호·확인일자·확인만료일자를 담는다. 녹색 관련 지원사업 담당자나 투자·조달 분석가가 특정 기업이 녹색전문기업 확인을 받았는지, 그 확인이 언제 만료되는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 기업 데이터와는 기업명 매칭으로만 잇고, 같은 기관의 녹색기술 인증·녹색기술제품 확인 현황과 나란히 본다.
