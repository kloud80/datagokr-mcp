description_portal: 녹색인증은 녹색기술 인증, 녹색기술제품 확인, 녹색전문기업 확인 3가지의 인증대상이 있으며 그 중에서 녹색전문기업 확인 인증현황 입니다. 녹색전문기업 확인 대상 및 인증기준은 창업 후 1년이 경과된 기업 중 각 인증받은 녹색기술에 의한 신청 직전년도 매출액의 합이 해당기업 총 매출액의 20% 이상인 기업입니다. 인증받은 녹색기술에 의한 매출액은 인증받은 녹색기술의 라이선스 또는 기술이전 수입 및 공사수주액 등과 같은 매출액과 녹색기술제품 확인을 받은 제품의 매출액의 합으로 산출합니다. 해당 데이터에서는 녹색전문기업명, 발급 부처, 확인번호, 확인일자, 만료일자 등을 제공합니다.
