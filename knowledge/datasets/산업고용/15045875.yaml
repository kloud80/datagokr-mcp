summary_user: 제주특별자치도 안의 유원시설업체를 업소 한 곳당 한 행으로 담은 소규모 목록 파일(CSV 약 8KB)로, 종합·일반·기타 구분과 상호명, 소재지, 연락처, 비고, 데이터기준일자를 담는다. 관광객이나 관광 분야 사업자·분석가가 '제주에서 영업 중인 놀이·유기시설 업체는 어디에 몇 곳 있고 종합·일반·기타 중 어디에 해당하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드가 없어 다른 데이터와는 상호명·소재지 주소를 맞춰 보는 방식으로만 이어 쓰며, 업종 인허가(LOCALDATA) 원장이나 상가업소 데이터와 대조할 때도 이 방식을 쓴다.
