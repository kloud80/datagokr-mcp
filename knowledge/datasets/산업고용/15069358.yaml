summary_user: 한국산업기술진흥원이 관리하는 소재·부품·장비 신뢰성 인증을 인증 건별로 담은 파일(CSV, 약 157KB)로, 분야·평가기관·인증번호·품목·제품·업체명·등록일자를 한 행에 기록한다. 부품을 조달하려는 기업이나 분석가가 '이 업체의 이 제품이 신뢰성 인증을 받았는지, 어느 평가기관이 언제 인증했는지'를 확인할 때 쓴다. 인증번호(reliability_cert_no)가 조인 키로 확인돼 같은 인증번호를 쓰는 다른 인증 자료와 맞대어 볼 수 있으며, 사업자번호 같은 기업 식별 키는 없어 기업 정보와는 업체명 문자열로만 이어야 한다.
description_portal: "본 데이터는 한국산업기술진흥원에서 제공하는 소재, 부품, 장비에 대한 신뢰성 인증 정보를 포함하고 있습니다. 소재와 부품과 관련된 다양한 제품들이 신뢰성을 인정받기 위해 평가기관에서 인증을 받으며 그와 관련된 데이터입니다. 이 데이터를 통해 산업계에서는 인증 과정과 결과를 확인할 수 있으며, 신뢰성 있는 부품 및 소재 선택을 위해 활용될 수 있습니다. 나아가, 해당 인증 정보는 기업의 품질 보증 및 관련 법규 준수에 중요한 역할을 할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  '번호' (숫자형) : 각 인증 정보를 구분하기 위한 고유 번호  '분야' (문자형) : 제품 분야를 나타내는 데이터  '평가기관' (문자형) : 인증을 수행한 기관의 이름  '인증번호' (문자형) : 해당 제품의 인증 번호  '품목' (문자형) : 인증을 받은 제품의 세부 품목  '제품' (문자형) : 인증받은 최종 제품의 이름  '업체명' (문자형) : 제품을 생산하는 회사의 이름  '등록일자' (날짜형) : 인증 정보가 등록된 날짜"
