description_portal: 한국가스기술공사는 천연가스 설비의 설치, 유지보수 및 긴급 복구 작업을 위해 다양한 중장비를 보유하고 있습니다. 이에는 크레인, 굴삭기, 지게차 등 주요 건설 및 복구 장비가 포함되며, 각 장비의 보유 수량과 운영 현황은 체계적으로 관리되고 있습니다. 중장비의 정기적인 점검과 유지보수를 통해 장비의 성능을 최적화하고, 작업의 효율성과 안전성을 확보하고 있습니다. 이러한 중장비 운영은 설비의 신속한 설치와 복구에 중요한 역할을 합니다.또한 이 자료를 통해 공공기관의 자산보유현황과 관련하여 조사하는데 도움이 될 수 있습니다.
