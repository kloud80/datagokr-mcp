summary_user: 서울 양천구 관내 관광식당(일반음식점 허가를 받고 특정 국가 음식을 전문으로 제공하는 업소)의 인허가를 업소 한 곳당 한 행으로 담은 건별 원장으로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 전화번호, 좌표(X, Y), 영문 상호·주소, 시설 면적 등을 포함한다. 양천구에서 지금 영업 중인 관광식당이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 알고 싶은 주민·관광 정책 담당자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 업소명·주소 매칭, 같은 기관 코드(OPNSFTEAMCODE), 좌표를 통한 공간 결합으로 이어 쓰며, 다른 업종의 지방행정 인허가(LOCALDATA) 데이터와 같은 컬럼 구조를 공유한다.
description_portal: 본 데이터는 서울특별시 양천구 관내에서 관광객을 대상으로 음식 서비스를 제공하는 사업자가 관련 법령에 따라 신청하고 승인받은 인허가 사항을 체계적으로 관리한 데이터이다. 해당 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분 등의 항목이 포함된다. 이를 통해 지역 내 관광식당의 운영 현황을 종합적으로 파악할 수 있으며, 정책 수립, 영업자 지원, 위생 관리 강화, 관광객 안전 보호 등 공공 목적의 의사결정에 활용된다.* 관광식당 - 일반음식점영업의 허가 받은 자가 관광객이 이용하기 적합한 음식 제공시설을 갖추고 특정 국가의 음식을 전문적으로 제공하는 업소
