description_portal: 본 데이터는 공사가 보유하거나 출원한 지식재산권의 관리 현황을 체계적으로 정리한 자료입니다.특허, 디자인 등 산업재산권의 유형별로 명칭, 출원번호, 출원인, 등록번호, 등록일 등의 항목을 포함하고 있습니다. 이를 통해 공공부문의 창의적 성과물 보호 실태를 객관적으로 파악할 수 있으며, 기술 기반 행정서비스 확대 및 기관 역량 분석에 활용될 수 있습니다. 또한 민간기업 및 연구기관은 본 데이터를 바탕으로 공공기관의 기술력 수준과 공동연구 가능성, 기술이전 협력기반 등을 종합적으로 분석할 수 있습니다. 나아가 공사의 창출 역량 제고 및 지식재산의 전략적 활용을 위한 정책자료, 공공자산 보호 수단으로도 활용 가치가 높습니다.
