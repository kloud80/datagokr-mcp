description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2021년도 제주 연간 신재생에너지(태양광, 풍력) 예측치와 실적을 보여주는 자료입니다.ㅇ 항목 : 예측최대출력, 실적최대출력, 예측평균출력, 실적평균출력*단위 : MW※운영발전계획기준'
