summary_user: 인천광역시 중소기업육성자금의 지원 기준을 기업 구분(일반기업, 여성·장애인 기업, 시 선정 우수기업 등)과 지원항목별로 정리한 2,990바이트 크기의 소형 CSV 파일이며, 항목마다 지원한도와 우대지원율을 담는다. 인천 소재 중소기업이나 지원 담당자가 '여성기업이나 장애인기업이면 육성자금 한도와 우대율이 어떻게 달라지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기업 유형·지원항목 이름을 맞추거나 같은 기관(인천광역시) 기준으로만 이어 쓴다.
description_portal: 인천광역시 중소기업육성자금 지원현황 공공데이터는 지역 내 중소기업의 경영 안정과 성장을 돕기 위해 마련된 금융 지원 정보를 체계적으로 제공하는 자료입니다. 데이터는 기업 유형별로 구분(일반기업, 여성·장애인 기업, 인천시 선정 우수기업 등)을 명시하여 지원 대상의 특성을 구분합니다. 지원항목으로는 제조업 및 제조관련업, 여성기업, 여성친화기업, 장애인기업, 유망중소기업 등 정보를 제공하고 있습니다. 이 자료는 맞춤형 지원 전략을 수립하는 데 중요한 기초 자료로 활용되며, 인천시의 중소기업 육성 정책 투명성과 효율성을 높이는 데 기여합니다.해당 데이터는 사전정보공개(중소기업자금 정보)와 공공데이터포털에서 확인할 수 있습니다.
