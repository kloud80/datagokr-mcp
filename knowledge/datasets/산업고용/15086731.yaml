description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 에너지 소비량 2000toe 이상인 에너지다소비사업자가 신고한 ‘로(爐)’ 설비의 에너지 사용 현황을 상세히 제공합니다. 전국 광역시별, 연도별, 그리고 산업 및 상업 등 부문별로 구분된 이 데이터는 사업장 내 주요 열공정 설비인 "로"가 사용하는 에너지 소비량과 사용패턴을 명확히 보여줍니다. 이를 통해 정부와 지자체는 지역 및 산업별 "로" 설비의 에너지 소비 특성을 분석하여 효율적이고 지속 가능한 에너지 정책 수립 및 에너지 관리방안을 마련할 수 있습니다. 또한 기업과 연구기관은 설비 효율성 분석, 에너지 절감 방안 연구 및 온실가스 감축 전략 수립을 위한 기초자료로 폭넓게 활용 가능합니다.
