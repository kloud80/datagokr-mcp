description_portal: 본 데이터는 한국가스공사의 도시가스 피크수요 기온효과 분석 정보를 제공합니다. 1997년부터 2023년까지의 분석 결과로, 기온이 피크수요에 미치는 영향을 정량화하기 위해 수집되었습니다. 데이터의 세부 항목으로는 연도, 수도권·충청권·대경권·호남권·동남권 지역별 기온효과 계수 등이 포함되어 있습니다. 기온반응함수와 피크수요의 기온분포를 이용하여 도시가스 피크수요의 계절성을 모형화한 결과입니다. 본 데이터는 수요예측 담당자, 에너지경제연구원, 기상연구기관, 도시가스사업자, 정책 연구자, 한국에너지공단이 기온변화에 따른 수요 변동 분석에 활용할 수 있습니다
