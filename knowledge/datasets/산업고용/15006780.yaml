summary_user: 대구 달성군 관내 기업체를 한 업체당 한 행으로 담은 원천 목록으로, 업체명·소재지 주소·좌표·생산품목·대표자·종업원 수·연락처를 포함하며 CSV 파일(약 11KB)로 받는다. 달성군에서 특정 품목을 생산하는 업체나 종업원 규모가 큰 기업이 어디에 있는지 찾으려는 구직자·거래처 발굴 사업자·지역 산업 분석가가 쓴다. 전역 조인 키는 없어서 업체명이나 소재지 주소로 맞추거나 X·Y좌표로 지도·공간 데이터에 겹쳐 쓰며, 다른 시군구 기업 현황 파일과는 같은 항목끼리 이어 붙인다.
description_portal: 기업체의 기본 현황 정보를 정리한 자료로, 기업체 명칭, 위치, 업종 유형, 사업체 규모 등 기업 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 기업체의 분포 현황과 산업별 사업체 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 기업체 현황에 대한 체계적인 관리를 통해 지역 산업 구조와 경제 활동 실태를 분석하고, 기업 지원 정책 수립 및 지역 경제 활성화를 위한 행정적 의사결정을 지원한다. 본 자료는 기업체에 대한 행정 관리, 기업 지원 및 민원 대응 업무 수행과 함께 관련 통계 산출 및 산업 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 지역 내 기업 활동 여건을 파악하고 지속 가능한 산업 발전 기반을 마련하기 위한 정책 추진의 기초자료로 활용되며, 고용 창출과 지역 경제 활성화를 지원하는 산업·경제 행정 업무 수행을 위한 행정자료로 활용된다.
