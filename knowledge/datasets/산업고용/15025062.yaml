description_portal: '경상남도 사천시 자동차정비업체 현황 안내경상남도 사천시에 등록되어 현재 영업 중인 자동차정비업체 현황은 다음과 같은 항목으로 구성되어 있습니다.자동차정비업체명: 사업체의 공식 상호명자동차정비업체 종류: 공업사, 종합정비업체, 소규모 정비업체 등 사업의 형태 구분소재지 도로명 주소: 사업장이 위치한 도로명 기반 주소소재지 지번 주소: 토지대장 및 건축물대장 기준 지번 주소위도·경도 좌표: 지도 상의 위치 확인을 위한 GPS 좌표사업 등록일자: 해당 업체가 정식으로 등록된 날짜면적: 사업장 부지 또는 시설의 총 면적영업 상태: 현재 영업 중인지, 휴업 또는 폐업 상태인지 여부운영 시작시간 및 종료시간: 업체의 하루 영업 개시 및 종료 시각지정일자: 지정정비업체로 선정된 경우, 그 지정이 이뤄진 날짜전화번호: 고객 문의 및 연락 가능한 대표 번호데이터 기준일자: 본 자료가 기준으로 삼은 날짜 (2025년 9월 22일 기준)보다 구체적인 정보나 업체별 상세 현황은 사천시청 교통행정과(☎ 055-831-3374) 로 문의하시면 확인할 수 있습니다.'
