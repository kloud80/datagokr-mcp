description_portal: '한국지역난방공사의 연구개발(R&D) 활성화를 위해 매년 시행되는 연구과제 공모 현황 데이터로, 연도별 공모 분류와 공모 기간을 체계적으로 관리하여 기술 혁신 및 에너지 효율화 연구 추진 현황을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 기준년도: 연구과제 공모가 시행된 연도(예시: 2025, 2024, 2023)■ 공모분류명: 공모의 유형 또는 구분(예시: 정기공모, 수시공모)■ 공모제목: 연구과제 공모의 제목 또는 사업명(예시: 2025년도 연구과제 공모(2차))■ 접수시작일자: 연구과제 제안서 접수가 시작된 일자(예시: 2025-08-05)■ 접수마감일자: 제안서 접수가 종료되는 마감일자(예시: 2025-08-14)3. 활용 예제:■ 연도별 연구과제 공모 일정 및 분류를 분석하여 R&D 추진 계획 및 예산 집행 관리에 활용■ 공모 주기 및 시기 데이터를 기반으로 산학연 협력체계 구축 및 연구 참여기관 모집 전략 수립■ 연구개발 분야별 공모 추세를 파악해 기술혁신 로드맵 수립 및 공공 R&D 정책 평가에 활용'
