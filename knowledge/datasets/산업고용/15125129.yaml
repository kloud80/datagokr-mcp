summary_user: 경기도에 본사를 둔 가맹사업본부(프랜차이즈 본부)를 본부 한 곳당 한 행으로 담은 현황 목록으로, 기준연도·법인명·대표자명·전화번호·정제 지번/도로명 주소·우편번호·WGS84 좌표를 포함한다. 창업 희망자나 상권 분석가가 '경기도 내 프랜차이즈 본사가 어느 시군에 몰려 있는가'를 확인하거나, 정책 담당자가 지역 프랜차이즈 기업 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자등록번호 등)가 없어 다른 데이터와는 법인명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내에 본사를 두고 있는 가맹사업본부의 현황을 나타내며, 프랜차이즈 산업의 지역 분포와 주요 브랜드 운영 정보를 파악하는 데 유용합니다. 업종은 ‘외식’과 ‘서비스’ 등으로 구분되며, ‘업종대분류명’과 ‘업종중분류명’ 항목을 통해 보다 구체적인 프랜차이즈 산업군 정보를 제공합니다. ‘정제지번주소’, ‘정제도로명주소’, ‘WGS84경도’, ‘WGS84위도’ 항목은 위치기반 분석에 활용 가능하며, 입지 특성, 창업 밀집도, 고객 접근성 등을 판단하는 데 기여할 수 있습니다. 데이터는 경기도 지역 프랜차이즈 기업 현황 분석, 정책 수립, 창업 지원, 상권 분석 등 다양한 행정적·산업적 목적에 활용될 수 있습니다.
