description_portal: 한국서부발전의 전력거래 관련 일별 검침내역을 기록한 자료입니다. 각 발전소별로, 특히 호기별로 해당 일자에 계획된 발전량과 실제 검침량 데이터를 확인할 수 있습니다. 이는 발전량 계획과 실제 생산량 간의 차이를 분석하고, 전력 수급 상황을 분석/예측 가능한 데이터로 이용할 수 있습니다. 일자별 데이터를 통해 발전소 운영 현황을 모니터링하고, 발전 효율을 개선하기 위한 방안을 모색할 수 있습니다. 또한, 예상치 못한 발전량 감소 또는 증가에 대한 원인을 분석할 수 있는 데이터로 활용할 수 있습니다.제공항목은 일자,발전소명,호기,계획발전,검침량합계 데이터를 제공합니다.
