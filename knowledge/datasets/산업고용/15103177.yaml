summary_user: 창업진흥원이 지정한 창업중심대학 주관기관을 기관 한 곳당 한 행으로 담은 목록이며, 지역·주관기관명·기관구분·주소·상세주소로 구성된 801바이트 규모의 작은 CSV 파일입니다. 예비창업자나 지원기관이 '우리 지역에서 창업중심대학으로 지정된 대학은 어디이고 창업 공간은 어디에 있나'를 확인할 때 쓰고, 권역별 대학 창업 거점 분포를 볼 때도 쓴다. 전역 조인 키가 없어서 다른 데이터와는 대학명(주관기관명)을 이름으로 맞추거나 주소를 지오코딩해 위치 기반으로 잇는다.
description_portal: 해당 데이터는 창업진흥원이 관리하는 ‘창업중심대학 주관기관 현황’ 자료로, 전국 주요 대학을 중심으로 한 창업 지원 기관 정보를 담고 있습니다. 연번, 지역, 주관기관명, 기관구분, 주소, 상세주소 항목으로 구성되어 있으며, 각 대학의 구체적 위치와 창업보육 공간 정보까지 포함하고 있어 실제 창업 공간 확보나 창업 인프라 지도 작성에 유용하게 활용될 수 있습니다. 이를 통해 창업 수요자는 지역 내 접근 가능한 대학 창업 지원체계를 탐색할 수 있으며, 유관기관은 권역별 창업 허브로서의 대학 분포를 분석하거나 협업 기반을 마련하는 데 참고자료로 사용할 수 있도록 구성되어 있습니다.
