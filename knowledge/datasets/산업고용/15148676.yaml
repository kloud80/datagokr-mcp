description_portal: 이 데이터는 국내 유가 가격 자유화가 시행되기 전, 주요 정유사들의 연도별 제품별 공급 가격 정보입니다. 이 데이터는 과거 제도하의 가격 체계가 어떤 영향을 미쳤는지를 보여주는 귀중한 기준선 자료로서, 정책평가, 연구, 산업분석에 광범위하게 활용될 수 있습니다. 특히 석유제품 가격 구조에 대한 정량적 분석을 통해 에너지 시장 규제 효과를 검토하거나, 유가 자유화 전후의 소비자 가격 영향 등을 비교하는 연구에 도움이 됩니다. 아울러 공공기관의 에너지 관련 백서 및 보고서 작성 시 근거 자료로 활용 가능하며, 장기 통계 기반의 시계열 분석 자료로도 적합합니다.
