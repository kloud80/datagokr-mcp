description_portal: 서울시 도시가스 사용량(용도별,구별) 통계는 서울시 통계정보시스템에서 제공하는 공식 통계 자료로, 2023년 한 해 동안 서울시 각 자치구에서 도시가스가 어떻게 소비되었는지를 용도별로 세분화하여 제공합니다. 이 통계는 자치구별 총 사용량뿐만 아니라, 가정용, 일반용, 업무용, 산업용, 열병합, 수송용 등 다양한 용도로 분류된 도시가스 소비량을 포함하고 있어, 지역별 에너지 소비 패턴을 분석하는 데 유용합니다. 특히 ‘합계’와 ‘소계’ 항목을 통해 전체적인 사용량과 구별 데이터를 함께 비교할 수 있으며, 도시가스 수요 예측, 에너지 정책 수립, 환경 계획 수립 등 여러 공공 및 연구 목적에 활용될 수 있습니다. 이 자료는 서울시의 에너지 사용 실태를 정량적으로 이해할 수 있는 기반 자료로서의 가치가 큽니다.
