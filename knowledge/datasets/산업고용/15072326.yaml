summary_user: 인천광역시 미추홀구에 등록된 결혼중개업체를 업체 한 곳당 한 행으로 담은 소규모 파일(CSV 884바이트)로, 국내·국제 구분, 업체명, 동 단위 이상 도로명주소, 위도·경도를 포함한다. 결혼중개업체를 이용하려는 주민이 '우리 구에 등록된 국제결혼중개업체는 어디인가'를 확인하거나, 분석가가 구내 업체 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 업체명·주소 문자열 매칭이나 위도·경도 좌표 기반으로 LOCALDATA 업종 인허가나 상가업소 데이터 등과 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 내에서 등록·운영 중인 결혼중개업체에 대한 현황 정보를 제공합니다. 데이터는 연번, 업체수, 구분(국내, 국제), 시군구명, 업체명, 대표자, 도로명주소, 위도 및 경도 좌표로 구성되어 있습니다. 이를 통해 지역 내 결혼중개 서비스의 분포 및 유형별 운영 실태를 파악할 수 있으며, 위치 기반 분석을 통해 접근성과 밀집도를 평가하는 데도 활용됩니다. 행정기관의 관리·감독은 물론, 소비자의 중개업체 이용 시 참고자료로도 유용합니다. 데이터는 정기적으로 갱신되며, 건전한 중개서비스 환경 조성을 위한 기초자료로 제공됩니다.
