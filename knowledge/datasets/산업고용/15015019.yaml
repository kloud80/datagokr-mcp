description_portal: '본 데이터는 국가 신재생에너지 정책 목표 달성을 지원하기 위해 정부가 규정한 한국산업표준(KS)과 인증심사기준을 충족하여 KS인증을 획득한 중대형 풍력터빈 제품에 대한 상세 정보를 제공합니다. 이는 보조금 투입 또는 의무 설치의 필요성이 있는 풍력터빈의 품질과 안전성을 국가가 보증하는 임의 인증제도의 결과물입니다.궁극적인 목적은 풍력발전 시장에서 신뢰할 수 있는 제품의 보급을 확대하고, 국내 풍력 산업의 건전한 성장과 경쟁력 강화를 도모하는 데 있습니다.제공 항목은 다음과 같습니다. 번호: 데이터 내의 순번인증번호: KS인증서에 부여된 고유 번호인증일자: KS인증이 발급된 날짜업체명: 풍력터빈 제조 또는 판매 기업의 명칭모델명: 풍력터빈의 제품 모델명정격출력(MW): 해당 모델의 최대 발전 용량 (메가와트 단위)제조국: 해당 풍력터빈의 제조 국가증속기: 증속기(기어박스) 유무 또는 종류육_해상: 해당 터빈이 육상용인지 해상용인지 구분설비등급: 풍력터빈의 설계 조건 및 바람 등급 (예: IEC Class I, II, III 등)'
