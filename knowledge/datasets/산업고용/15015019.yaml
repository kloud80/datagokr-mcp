summary_user: KS인증을 받은 중대형 풍력터빈을 모델 한 건씩 담은 제품 원장으로, 인증번호·인증일자·업체명·모델명과 정격출력(MW)·제조국·증속기 유무·육상/해상 구분·설비등급을 담으며 전국 범위의 비공간 CSV 파일(약 5.8KB)로 제공된다. 풍력단지 개발사나 분석가가 "국내에서 KS인증을 받은 해상용 터빈 가운데 정격출력이 가장 큰 모델은 어느 업체 제품인가"처럼 인증 모델을 고르거나 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명·모델명을 이름으로 맞추거나 같은 기관의 인증 데이터와 인증번호로 연결해야 한다.
limits: 인증 제품 목록이라 실제 설치 위치·설치 대수·발전량은 담지 않고, 지역 단위 분석에도 쓸 수 없다. 표준 조인 키가 없으므로 발전소·신재생 원장과 붙이려면 업체명·모델명 표기를 직접 맞춰야 한다.
