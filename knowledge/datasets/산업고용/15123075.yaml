description_portal: 한국서부발전은 친환경 에너지 생산을 위해 석탄회 호기별 운전 현황과 미연탄소 측정 결과를 꾸준히 관리하고 있습니다. 발전소 설비의 안정적인 운영과 더불어 환경 규제 준수를 위해 각 호기의 운전 모드와 미연탄소 배출량 데이터를 모니터링합니다. 일자별, 사업소별, 호기별 측정 결과는 석탄회 연소 효율을 분석하고 배출량을 예측하는 자료로 활용될 수 있습니다. 미연탄소 측정 데이터는 탄소 배출 감축을 위한 지표가 될수 있으며, 설비 개선 및 운전 전략 수립에 활용 가능합니다.제공항목은 일자,사업소,호기,운전 모드,미연 탄소(퍼센트) 데이터를 제공합니다.
