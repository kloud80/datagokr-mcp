summary_user: 한국서부발전 발전기별·발전원별 역일이용률(실제 발전량을 최대설비용량 기준 이론 발전량으로 나눈 비율, 퍼센트)을 연도 단위로 담은 집계 파일이며, 파일 크기는 약 8.5KB로 작다. 분석가가 서부발전의 특정 발전기나 석탄·가스 등 발전원별 가동률이 해마다 어떻게 달라졌는지 비교할 때 쓴다. 전역 조인 키는 없어 다른 발전 데이터와는 발전기명·발전원 이름을 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: 한국서부발전 발전기별 발전원별 역일이용률 정보입니다. 발전기별, 발전원별 역일이용률 데이터는 각 발전기가 실제로 얼마나 효율적으로 가동되고 있는지를 보여주는 주요 성능 지표입니다. 역일이용률은 일정 기간동안 실제 발전량을 동일 기간 최대설비용량으로 가동했을 때의 이론적 발전량으로 나눈 값으로 산출되며, 주로 퍼센트 단위로 표현됩니다. 이 데이터는 발전기의 운영 효율성과 활용도를 직관적으로 비교할 수 있게 해주며, 발전원별 특성과 계통 내 역할에 따라 차이를 나타냅니다. 발전기별로 연속적인 데이터를 분석하면 설비 노후화, 정비 주기, 연료 수급 상황 등이 역일이용률에 어떤 영향을 미치는지 파악할 수 있으며, 이는 전력시장 운영 전략과 장기적 설비 투자 계획 수립에 중요한 기초자료로 활용됩니다.
