description_portal: 이 데이터는 전남개발공사의 2017년부터 2024년까지 연도별 장애인기업제품 및 중증장애인기업제품의 구매 실적에 대한 정보를 담고 있습니다.이는 사회적 약자인 장애인 기업을 지원하는 정책 이행 상황을 투명하게 공개하고, 관련 기업들의 안정적인 경제 활동을 돕는 것을 목적으로 합니다.데이터는 연간 구분, 구매합계금액(원), 구매비율(%) 등의 항목으로 구성되어 있으며, 내부 구매 기록을 집계하여 작성되었습니다.활용 기대 효과로는 구매 실적 분석을 통해 장애인기업 제품 구매 활성화 정책의 효과를 평가할 수 있습니다.또한, 장애인기업들이 공공 부문의 시장 참여 기회를 파악하는 데 유용한 자료로 활용될 것입니다.이는 사회적 약자 지원을 위한 공공기관의 노력을 보여줌으로써 대국민 신뢰를 높이는 데도 기여할 것으로 기대됩니다.
