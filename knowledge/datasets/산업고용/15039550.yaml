summary_user: 한국전력공사가 운영하는 전기차 충전기를 모델 단위로 정리한 목록으로, 모델명·용량·충전방식(급속·완속 등)·충전타입·제조사를 담은 전국 범위의 비공간 파일(csv, 약 10KB)이다. 분석가나 사업자가 '한전 충전기에는 어느 제조사의 어떤 용량·충전방식 모델이 쓰이는가'를 확인하거나 제조사별·충전방식별 모델 구성을 비교하는 데 쓴다. 전역 조인 키나 코드표가 없어 충전소 현황 등 다른 데이터와는 모델명·제조사 이름을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: 한국전력공사에서 운영중인 전기차 충전기 모델 및 현황 정보를 제공합니다.데이터는 모델명,용량,충전방식,충전타입,제조사 항목으로 구성되어 있습니다.해당 데이터를 통해 충전기별 성능 비교나 제조사별 시장 점유 분석, 급속 및 완속 등 충전방식별 효율성을 연구하는 등 다양한 활동에 기초 자료로 활용할 수 있습니다.또한 충전 인프라 확충 정책을 설계하거나, 제조업체 경쟁력을 평가할 때 관련 자료로 도움을 줄 수 있으며민간에서는 소비자의 자차에 맞는 충전기 선택이나 설치 계획 등에 관련된 사업에도 좋은 자료로 활용 할 수 있습니다.
