description_portal: 한국동서발전의 네트워크 트래픽 현황 정보는 각 사업소에서 발생하는 네트워크 사용량을 일자 및 시간 단위로 기록한 데이터입니다.해당 데이터는 망구분, 사업소, 이벤트 별칭(입력/출력 사용량), 시간, 값, 단위 등의 항목으로 구성되며, 공공기관 내 네트워크 흐름과 트래픽 집중 구간을 실시간으로 분석할 수 있는 기반 정보를 제공합니다.이 데이터를 통해 망 유형별(내부망, 외부망 등) 사용 패턴, 사업소별 네트워크 부하, 특정 시간대의 트래픽 급증 현상 등을 확인할 수 있어 정보자산 운영의 효율성을 분석하거나 보안 위협 탐지의 기초자료로 활용될 수 있습니다.학계 및 연구기관에서는 본 데이터를 기반으로 △시간대별 네트워크 사용량 추이 분석 △사업소 간 트래픽 편차 비교 △망구분별 자원 사용 집중도 평가 △이벤트 기반 트래픽 이상징후 탐지 모델 연구 등 다양한 정량적 분석이 가능합니다.특히 공공기관의 정보통신 인프라 효율성 분석, 보안 관제 시스템 설계, IT 인프라 예측 모델링, 디지털 전환 수준 평가 등에도 실증 자료로써 활용 가치가 높습니다.또한 이상 트래픽 탐지를 위한 AI 기반 데이터 학습용 자료로 활용되거나, 공공기관 내 IT 자산 최적화 계획 수립을 위한 기초자료로도 적용될 수 있습니다.
