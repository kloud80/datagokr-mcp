summary_user: 인천광역시 연수구에 등록된 행정사 사무소를 한 행에 한 곳씩 담은 원천 목록으로, 사무소 명칭·행정사 종류·행정사 성명·소재지 주소·전화번호를 담는다(8.7KB 규모의 CSV 파일). 연수구 주민이나 사업자가 '우리 동네에서 일반·외국어번역 등 특정 종류의 행정사 사무소가 어디 있고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소 소재지 주소나 사무소 명칭을 맞춰 붙여야 하며, 다른 지역 행정사 현황이나 지방행정 인허가(LOCALDATA) 행정사 업종 자료와는 이름·주소 기준으로만 연결한다.
limits: 사업자번호·좌표·공통 코드 같은 전역 조인 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 주소·이름 매칭에 의존해야 한다. 범위는 연수구 한 곳뿐이라 인천시 전체나 전국 현황은 이 파일만으로 알 수 없다.
