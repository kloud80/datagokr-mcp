description_portal: 본 데이터는 2014년 12월말 기준으로 국내 방사선 안전관리 대행기관의 지역별(수도권, 충청권, 영남권, 호남권)분포 현황을 나타낸 데이터입니다.본 데이터를 통해 전국 방사선 안전 관리 체계의 지역적 커버리지를 한눈에 파악할 수 있습니다. 본 데이터에서 제공하는 방사선 안전관리 대행기관은 총 10개로, 각 기관은 병원, 연구기관, 산업시설 등 방사선 사용 기관의 안전관리 업무를 대행합니다.  또한, 위 데이터와 연관된 데이터로 다음의 데이터를 참고할 수 있습니다.  - 연도별 판독특이자 발생 현황- 원인별·연도별 방사선사고 발생 수- 최근 5년간 업종별 종사자 수 및 피폭선량 현황
