summary_user: 충청남도 서천군 관내 고압가스 저장소로 지정된 업체를 한 행에 한 곳씩 담은 목록으로, 업체명·주소·취급가스·저장설비 규모와 단위, 데이터제공일자를 담는다(포털 설명상 2025년 7월 6일 기준 11개소, 파일 957바이트). 주민이나 안전관리 담당자가 '우리 동네 어디에 어떤 고압가스를 얼마나 저장하는 시설이 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 업체명을 대조해 잇고, LOCALDATA 고압가스 인허가 원장 같은 에너지 업종 인허가 자료와 이름·주소 기준으로 맞춰 본다.
limits: 서천군 한 곳의 시군구 범위 자료라 다른 지역과 비교하려면 별도 자료가 필요하다. 사업자번호나 인허가번호 같은 공통 키가 없어 다른 데이터와 붙일 때 업체명·주소 매칭 오류에 주의해야 한다.
