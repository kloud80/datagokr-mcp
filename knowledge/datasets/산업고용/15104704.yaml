description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업 중 중소 및 중견기업에 대한 지원 현황을 집약한 공공 데이터입니다.제공되는 정보는 각 사업의 성격(예: 신규, 계속 등)과 기업 구분(중소기업, 중견기업)에 따라 지원된 정부 지원금 현황을 포함합니다. 이를 통해 사용자들은 특정 사업 분야에서 중소·중견기업에 대한 지원금 규모가 어떻게 배분되고 있는지를 파악할 수 있습니다. 이 데이터는 중소·중견기업에 대한 에너지 R&D 정책의 효과성을 분석하고, 이들의 기술 혁신을 촉진하기 위한 맞춤형 지원 전략을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다.'
