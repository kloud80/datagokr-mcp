description_portal: 서울 에너지공사 월별 열판매량 정보는 특정 년월을 기준으로 업종별 난방·냉방 에너지 사용 규모를 파악할 수 있는 통계 데이터입니다. 업종코드와 업종 항목을 통해 주거, 상업, 공업 등 어떤 유형의 수요처에서 에너지가 사용되었는지 구분할 수 있습니다. 난방 판매량과 냉방 판매량은 각각 열원 사용량을 수치로 제공하여 계절별·용도별 에너지 소비 패턴 분석에 활용됩니다. 총 판매량은 난방과 냉방 사용량을 합산한 값으로, 전체 에너지 수요 수준을 종합적으로 보여줍니다. 작업일시는 해당 데이터가 생성·갱신된 시점을 나타내어 자료의 최신성과 관리 이력을 확인하는 기준이 됩니다. 이 데이터는 에너지 수요 예측, 요금 정책 수립, 온실가스 감축 전략 마련 등 도시 에너지 정책과 경영 의사결정에 중요한 기초 자료로 활용될 수 있습니다.
