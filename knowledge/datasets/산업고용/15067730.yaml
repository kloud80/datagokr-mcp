description_portal: 한국서부발전 연구과제수행기관 공모관련 정보입니다. 주요 공모내용으로는 석탄 컨베이어벨트 자동 습식 낙탄 회수 Robot Cleaning System 기술 개발, 태안 IGCC 가스화기 고온고압부 누설 조기감지 시스템 개발, 발전데이터 공유 플랫폼 개발, 가스터빈 압축기＆터빈 디스크 대체소재 국산화 개발 등, 터빈 제어유 펌프(HFP) 성능시험 장치 개발, 1000MW급 보일러 Long Soot Blower Lancer 및 Feed Tube 인양장치 개발, IoT기반 빅데이터를 이용한 작업자 안전 Tracking 시스템 개발, 자원순환 그린뉴딜을 위한 석탄재 활용 해양 구조물 개발 등이 있습니다.
