summary_user: '한국수력원자력이 운영하는 5개 원자력본부(고리·한빛·월성·한울·새울)별로 실시간 대기안정도를 A(심한 불안정)부터 G(심한 안정)까지 7등급으로 담으며, 항목마다 태그명과 갱신 시각이 붙는 실시간 측정값이다. 원전 주변 주민이나 환경·방재 분석가가 지금 특정 원전 주변 대기가 확산에 불리한 안정 상태인지 확인하는 데 쓴다. 전역 조인 키는 없으며, 발전소 구분 코드(genName: 월성·고리·한빛·한울·새울)를 기준으로 같은 기관의 다른 원전 측정 데이터나 주변 기상 데이터와 발전소 이름으로 맞춰 이어 쓴다.'
description_portal: '위 API는 한국수력원자력(주)_원자력발전소 실시간 대기 안정도 현황 API입니다.한국수력원자력에서 운영중인 원자력발전소(고리원자력본부, 한빛원자력본부, 월성원자력본부, 한울원자력본부, 새울원자력본부)의 실시간 대기안정도 조회 API입니다.○ genName : 발전소 구분 WS : 월성 KR : 고리 YK : 한빛 UJ : 한울 SU:새울○ name : 아이템 고유 태그명, time: 실시간 갱신 시간, value: 안정도 A : 심한 불안정 B : 불안정 C : 약한 불안정 D : 중립 E : 약한 안정 F : 안정 G : 심한 안정'
