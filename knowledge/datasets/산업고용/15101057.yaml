description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 실시간 전력수급 현황을 나타내는 데이터입니다. 5분 단위로 공급능력, 현재부하, 공급예비력, 공급예비율, 온도를 나타냅니다.단위 : 공급능력(MW), 현재부하(MW), 공급예비력(MW), 공급예비율(%),  온도(°C)ㅇ 해당데이터는 육지와 제주 전체를 포함한 데이터이며, 한전PPA 및 자가용설비를 미포함한 데이터입니다.'
