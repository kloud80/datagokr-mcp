description_portal: '○ 통계개요* 통계명 : 석유판매소 현황* 통계종류 : 서울시 지역에너지 통계를 제공하는 일반·보고통계(승인번호35003)* 작성목적 : 서울시 에너지 관련 기초 통계 자료 제공하기 위해 작성* 조사체계 : 서울시* 공표주기 : 정기(매년)* 공표범위 : 지역 ? 서울시, 자치구내용 ? 석유판매소 현황(주유소, 용제판매소, 일반판매소, 항공유판매업)○ 용어설명* 주유소 : 석유정제업자, 석유수출입업자, 일반대리점 또는 다른 주유소로부터휘발유·등유 또는 경유를 공급받아 이를 점포(「위험물안전관리법」 제9조에따라 완공검사를 받은 제조소등의 설치장소를 말함* 용제판매소 : 석유정제업자, 석유수출입업자, 부산물인 석유제품 생산판매업자 또는용제대리점으로부터 용제를 공급받아 이를 용기 또는 수송장비(적재용량이8킬로리터 이하인 수송장비만 해당한다)를 이용하여 실소비자에게 판매하는소매업자인 석유판매업자를 말함* 일반판매소 : 석유정제업자, 석유수출입업자, 일반대리점 또는 다른 일반판매소로부터등유 또는 경유를 공급받아 이를 점포에서 다른 일반판매소나 실소비자에게 직접판매하는 소매업자인 석유판매업자를 말함* 항공유판매업 : 경비행기 연료 또는 이와 유사한 용도로 사용하는 것만 해당'
