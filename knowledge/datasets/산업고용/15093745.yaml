description_portal: '본 데이터는 전국을 기준으로 에너지 판매량의 비중에 따라 가중치를 부여한 냉방도일(Cooling Degree Day, CDD) 및 난방도일(Heating Degree Day, HDD) 정보를 제공합니다. 냉난방도일은 특정 지역의 냉난방 부하를 추정하고 에너지 소비량을 예측하는 데 사용되는 지표로, 기준 온도(예: 18℃)보다 기온이 높거나 낮은 정도를 누적하여 나타냅니다. 이 데이터의 핵심은 단순히 기온만을 고려하는 것이 아니라, 실제 에너지가 많이 판매되는 지역에 더 큰 가중치를 부여함으로써, 실제 에너지 소비량 변화를 더욱 정확하게 반영한다는 점입니다. 이 데이터셋은 국가 에너지 소비량 변화의 주요 원인인 기후 요인을 정량적으로 분석하고, 에너지 수요 예측 및 효율적인 수급 관리를 위한 핵심 근거 자료를 제공하는 데 목적이 있습니다. 또한, 에너지 정책 수립 시 기후 변화의 영향을 고려한 합리적인 의사결정을 돕는 데 기여합니다.'
