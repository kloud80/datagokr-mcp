summary_user: 전국 기준으로 전력·가스·열 각 에너지원의 판매량 비중을 가중치로 적용한 냉방도일과 난방도일을 월(YYYYMM) 단위로 담은 집계 데이터이다. 에너지 분석가나 수요예측 담당자가 "올해 겨울 전력·가스 소비가 늘어난 것이 추운 날씨 때문인가"처럼 에너지 소비 변화에서 기후 요인을 분리하는 질문에 쓴다. 전역 조인 키는 없고, 월(YYYYMM)을 기준으로 전국 단위 월별 전력·가스·열 판매량 통계와 맞춰 이어 쓴다.
