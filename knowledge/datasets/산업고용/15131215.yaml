description_portal: 이 데이터는 충북혁신도시에 소재한 공공기관인 한국고용정보원, 한국소비자원, 한국가스안전공사에서 일반 시민들에게 개방하고 있는 시설물에 대한 정보를 담고 있습니다. 각 기관이 제공하는 회의실, 강당, 주차장 등 다양한 공공자원에 대해 자원 유형, 수용 인원(또는 주차대수), 이용 가능 시간, 사용료, 담당자 연락처, 참고사항 등의 상세 항목으로 구성되어 있으며, 주민이나 단체가 공공자원을 효율적으로 이용할 수 있도록 돕습니다. 해당 정보는 지역 주민의 편의 증진과 공공자원 공유 활성화를 목적으로 제공되며, 데이터 기준일은 2025년 8월 6일입니다.
