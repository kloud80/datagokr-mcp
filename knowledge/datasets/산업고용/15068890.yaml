summary_user: 한국가스기술공사의 부서 507개를 부서 한 건당 한 행으로 담은 조직 원장 파일로, 부서코드·상위부서코드·부서명·정렬 순서로 구성된다. 공사의 본부·팀 소속 관계를 파악하거나 조직도를 그리려는 분석가가 "이 팀은 어느 본부 아래에 있나" 같은 질문에 쓴다. 부서코드(kgt_dept_cd)를 상위부서코드와 자기 조인하면 계층 구조가 나오고, 같은 부서코드를 쓰는 공사의 다른 인사·업무 데이터와 이어 쓴다.
description_portal: 이 데이터는 총 507개의 부서 정보를 포함하고 있으며, 부서코드, 상위부서코드, 부서명, 정렬 값의 네 가지 항목으로 구성되어 있다. 부서코드는 각 부서를 고유하게 식별할 수 있는 코드이며, 상위부서코드를 통해 부서 간의 계층 구조를 확인할 수 있다. 부서명은 조직 내에서의 명칭을 나타내며, 정렬 값은 화면 출력 또는 보고서 구성 시 부서 순서를 조정하는 데 활용된다. 이를 통해 조직의 구조적 흐름과 본부·팀 단위의 소속 관계를 쉽게 파악할 수 있으며, 조직도 시각화, 인사 정보 연계, 부서별 업무 분석 등의 목적으로 활용할 수 있다.
