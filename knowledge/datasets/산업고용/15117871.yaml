summary_user: 인천 부평구 주차시설·상업시설에 설치된 전기차 충전기를 충전기 한 대 단위로 운영기관, 충전소명, 충전기 유형(급속·완속), 시설 종류, 주소, 이용 가능 시간, 충전 용량(kW)과 함께 담은 시군구 범위의 파일 데이터다. 주민이나 전기차 운전자가 '부평구 마트·쇼핑몰 주차장 중 급속 충전기를 쓸 수 있는 곳과 이용 시간은?'을 확인하거나, 분석가가 부평구 상업시설 충전 인프라 분포와 용량을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 충전소 데이터와는 주소·충전소명 매칭이나 같은 기관 기준으로만 이어 쓸 수 있다.
description_portal: '상업시설에 설치된 전기차 충전소의 운영기관, 위치, 충전기 정보, 이용 가능 시간 등을 수록한 데이터.쇼핑몰, 마트, 오피스빌딩 등 상업시설 내 충전 인프라 현황을 파악하고, 전기차 이용 편의 증진, 친환경 교통 확산, 상권 활성화 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 상업시설 내 전기차 충전소 분포 현황 분석– 충전기 타입·용량별 설치 현황 파악– 주소·시설구분 기반 상업권 접근성 및 편의성 평가– 친환경 교통 인프라와 상권 활성화 정책 자료 활용주요 항목 설명● 운영기관: 충전소를 설치·운영하는 기관 명칭● 충전소: 전기차 충전소의 명칭 또는 위치● 충전기ID: 충전기를 구분하는 고유 식별번호● 충전기타입: 급속·완속 등 충전기 유형● 시설구분: 충전소가 설치된 상업시설의 종류● 주소: 충전소 소재지 주소● 이용가능시간: 충전소 운영 가능 시간대● 충전용량: 해당 충전기의 최대 충전 용량(kW)'
