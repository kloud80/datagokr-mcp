summary_user: 서울 지역 소상공인 사업체 중 2017년 6월 1일부터 10월 16일 사이에 개업한 업체를 한 줄에 한 곳씩 담은 건별 목록으로, 상호명·주소·업종 대·중·소분류로 구성된 CSV 파일(약 1.5MB)이다. 분석가나 창업 준비자가 '2017년 하반기 서울 어느 자치구에서 어떤 업종(분식, 일반한식, 제과제빵 등)의 개업이 많았나'를 살펴보는 데 쓴다. 실측 컬럼에 사업자번호·좌표 같은 공통 조인 키가 없어서, 소상공인 상가업소 원장이나 지방행정 인허가(LOCALDATA)와는 상호명·주소 문자열 매칭이나 업종 분류명 대응으로만 이어 쓴다.
description_portal: 서울 지역 내 소상공인 사업체 중 2017년 6월 1일부터 10월 16일까지 개업한 업체들을 대상으로 한 개업 현황 정보입니다. 각 항목은 상점명, 주소, 인증업종 분류, 인증업종 세부유형 등으로 구성되어 있으며, 서울특별시 강남구, 중구, 광진구 등 다양한 자치구에 위치한 소매·음식점·서비스업 등의 정보가 포함되어 있습니다. 인증업종 분류는 제조, 음식, 소매 등으로 세분화되며, 인증 세부 유형도 분식, 제과제빵제조, 일반한식 등으로 세밀하게 분류되어 있어 업종별 분석이 가능합니다. 서울시 내 소상공인 창업동향, 업종 분포 현황, 행정 정책 수립의 기반자료로 활용할 수 있습니다.
