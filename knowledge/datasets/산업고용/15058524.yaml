summary_user: 경기도 내 노숙인 상담·보호센터를 시설 한 곳당 한 행으로 담은 현황 자료로, 시군 이름·코드, 사업장명, 인허가일자, 영업상태, 폐업일자, 정원·종사자 수, 지번·도로명 주소와 위경도 좌표가 들어 있다. 복지 담당자나 분석가가 '우리 시군에 운영 중인 노숙인 상담센터가 어디에 있고 정원은 몇 명인가'처럼 지역별 보호 인프라와 접근성을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 시군 코드(SIGUN_CD)나 시군명, 주소·좌표를 기준으로 다른 경기도 시군 단위 자료나 지도 자료와 이름·위치로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 운영 중인 노숙인 상담 및 보호센터에 대한 현황을 정리한 자료로, 센터의 명칭, 인허가일자, 위치정보, 운영상태 등 기본적인 행정 정보가 포함되어 있습니다. 해당 센터는 거리노숙인 및 주거취약계층을 대상으로 상담을 지원하는 센터 정보를 제공하며, 상담센터는 긴급보호, 의료 연계, 자립 지원 등 종합적인 복지 서비스를 제공합니다. 이 자료는 노숙인 보호정책 수립, 사회복지 인프라 분석, 지역별 서비스 접근성 평가 및 위기가구 조기개입 체계 구축을 위한 기초자료로 활용될 수 있습니다.
