description_portal: 한국방송광고진흥공사가 조사하는 광고경기전망지수(KAI) 사업의 동향 및 전망 추이 데이터로 년도, 월, 동향, 전망, 전년 동월 대비 항목을 제공합니다. 우리나라 주요 광고주들을 대상으로 매체별 광고비 집행현황을 주기적으로 조사하여 국내 광고산업의 실물경기를 진단할 수 있는 지표역할을 하고있습니다.국가, 지방자치단체, 공공기관은 연간 광고경기 전망을 통해 경기대응책과 지원시책 수립에 필요한 기초 자료로 활용하실 수 있으며, 광고주 등 유관기업의 국내 주요 매체의 광고경기 변동 파악에 기여할 수 있습니다.
