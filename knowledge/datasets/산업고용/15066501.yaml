description_portal: 한국가스공사가 제공하는 월별 시간당 최대 총 공급량 현황은 국내 천연가스 수급 현황을 파악할 수 있는 기초자료입니다. 본 공공데이터는 월별 시간당 공급량이 가장 큰 일자 및 공급량(ton)을 나타내며, 이를 통해 계절별, 월별 피크 수요 현황, 에너지 소비 패턴 등을 파악할 수 있습니다.해당 데이터의 월별 시간당 최대공급량 현황으로 공급량 기준 내림차순으로 정렬되어 있습니다. 해당 월 시간당 공급량이 가장 큰 시점의 데이터입니다. 공공데이터 공개 대상 자료는 2020년 1월부터 현재까지의 기간동안 한국가스공사 월별 시간당 최대공급량(LNG)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 데이터의 파일 형식은 csv 파일입니다.
