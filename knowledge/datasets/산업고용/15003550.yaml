summary_user: 한국남부발전(주)의 사업소(빛드림본부)별로 사업소명, 도로명주소 위치, 발전형식과 설비용량(MW), 사용연료(유연탄·LNG 등), 준공일을 한 행씩 담은 소규모 목록 파일(csv 약 1.2KB)이다. 에너지 분야 분석가나 지역 주민이 '우리 지역의 남부발전 발전소는 어떤 연료로 얼마만큼의 용량을 돌리는가'를 확인하는 데 쓴다. 사업소명(kospo_saupso_cd)이 조인 키여서 남부발전의 다른 사업소별 데이터와 사업소명으로 잇고, 위치 주소를 기준으로 지역별 전력사용량 같은 지역 단위 에너지 통계와 맞춰 본다.
description_portal: 본 데이터는 한국남부발전(주)의 사업소(빛드림본부) 현호아 정보 파일데이터입니다.본 데이터는 한국남부발전(주)의 사업소명, 위치(도로명주소), 발전형식(기력발전, 복합사이클, 열병합 등 세부 발전방식 및 발전용량(MW)), 사용연료(유연탄, LNG 등), 준공일로 구성되어 있습니다.해당 데이터를 활용하여 한국남부발전의 세부 발전소의 위치 뿐만 아니라 발전형식을 세부적으로 파악할 수 있으며, 이를 바탕으로 우리나라 지역별 발전현황 파악 등 다양한 분야에 활용할 수 있습니다. 또한, 각 지역별 발전방식(석탄, LNG, 바이오 등)에 따른 특성 파악을 위한 기초자료로 활용될 수 있습니다.
