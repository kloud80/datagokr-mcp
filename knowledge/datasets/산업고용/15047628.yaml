summary_user: 중소벤처기업진흥공단이 2016년 기준으로 선정한 글로벌시장개척전문기업(GMD)을 기업 한 곳당 한 행으로 담은 소규모 파일(csv 약 4.6KB)로, 기업명·창업자, 대표자, GMD 구분(신흥시장·선진시장 전문 등), 전문분야, 주력품목이 들어 있다. 수출지원사업 담당자나 분석가가 '2016년에 어떤 중소기업이 어느 시장·품목 분야의 해외 개척 전문기업으로 선정됐나'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 인증·확인 데이터와는 기업명·대표자명을 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 「글로벌시장개척전문기업(GMD) 목록」은 중소기업진흥공단이 2016년 기준으로 선정한 글로벌시장개척전문기업 현황을 제공하는 데이터입니다. 기업별 명칭, 창업자 및 대표자, GMD 구분(신흥시장 전문, 선진시장 전문 등), 전문분야, 주력품목을 포함하고 있으며, 국내 중소기업의 해외시장 진출 역량과 글로벌 전문성을 파악하는 기초자료로 활용할 수 있습니다. 본 데이터는 정부 정책 연구, 해외시장 진출 지원사업 기획, 기업 간 매칭, 수출지원 프로그램 개발, 글로벌 파트너십 확대 등 다양한 분야에서 활용 가능하며, 산업별·지역별 글로벌 전문기업 분포를 분석하는 데도 유용합니다.
