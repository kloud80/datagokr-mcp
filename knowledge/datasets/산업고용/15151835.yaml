description_portal: 중소기업 전략기술 로드맵은 대기업에 비해 연구개발 역량이 부족한 중소기업의 기술역량 강화를 위해 유망기술 신성장 아이템 제시 및 중소기업 미래 먹거리 발굴, 전략적이고 지속적인 미래기술개발 가이드라인을 제시해주는 것으로, 정부의 중소기업 육성정책과 기술의 미래성장 방향성을 고려, 타 부처 기술 로드맵과 달리 중소기업의 수요조사 및 공급망 분석 등을 통해 중소기업 맞춤형 단기(3년 이내) 상용화 기술로드맵이다.중소기업 전략기술 로드맵 전략품목 및 핵심 요소기술은 기술테마(중점투자분야), 전략분야(세부분야), 전략품목, 핵심 요소기술 등 4개 항목에 대한 것으로  2025년 데이터로 구성되어 있다.
