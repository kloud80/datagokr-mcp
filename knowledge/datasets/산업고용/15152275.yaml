description_portal: '평택기지본부 1,2부두에서 사용하는 방충설비(펜더)에 대한 데이터입니다. 방충설비(펜더)는 LNG선이 부두로 입항하면서 배와 부두 구조물 사이의 충격을 방지해 주는 설비입니다. 1,2부두는 Rubber Fender CELL type이며, 1부두는 21년도에 전량(4ea) 교체, 2부두는 07년도에 접안능력을 향상시키면서 4ea를 설치하였으며, 15년도에 BD #1,4 교체,  25년도 BD#3 교체하였습니다. 접안능력은 1부두 70,000DWT, 2부두 127,000DWT로 대형선은 2부두로 입항 중입니다.'
