summary_user: 인천 영종구(포털 설명상 옛 중구 관내) 주유소를 한 곳당 한 행으로 상호·주소·전화번호와 데이터기준일을 담은 소규모 목록 파일(csv 약 1KB)이다. 영종도 주민이나 방문객이 근처 주유소 이름과 연락처, 위치 주소를 확인하는 데 쓴다. 실측 컬럼에 주유소 ID나 좌표 같은 전역 조인 키가 없어, 오피넷 유가나 전국 주유소 표준 데이터와는 상호·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 주유소 ID·좌표·유가 정보가 없어 가격 비교나 지도 표시에 바로 쓸 수 없고, 다른 데이터와 붙이려면 상호·주소 문자열 매칭이 필요하다. 범위는 한 시군구에 한정되며, 포털 설명상 기준일이 2025-05-26이라 현재 영업 현황과 다를 수 있다.
