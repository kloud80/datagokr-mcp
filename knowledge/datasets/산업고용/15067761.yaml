description_portal: 한국광해광업공단은 광산 개발 과정과 폐광 이후 발생하는 2차 오염 등으로 인한 광해를 분석하고 예방하며 제거하는 광해방지 사업을 실시하고 있습니다. 이를 통해 폐석·광물찌꺼기 등 오염원을 차단하고, 오염토양 복원, 수질개선, 지반침하 방지 등 광해복구를 통해 자연환경을 깨끗하게 보전하며, 지역 주민의 삶의 질 향상을 목표로 하고 있습니다. 또한, 광산별 광종별 통계 현황을 제공하여 광해방지 사업의 효율적 추진을 지원하고 있으며, 이를 통해 정책 수립 및 사업 평가에 활용할 수 있는 기초 자료를 제공합니다.
