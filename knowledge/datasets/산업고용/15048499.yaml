description_portal: 바이오디젤의 품질기준은 석유 및 석유대체연료 사업법 제31조에 따라 석유대체연료의 품질기준과 검사방법 및 검사수수료에 관한 고시에 규정되어 있습니다.바이오디젤(BD100)은 자동차용 경유 또는 바이오디젤연료유(BD20)를 제조하는데 사용하는 원료로서 다음의 품질기준에 적합하여야 합니다.바이오디젤의 품질기준 항목은 지방산메틸에스테르함량, 인화점, 동점도, 잔류탄소분, 황분, 회분, 동판부식, 필터막힘점, 밀도, 수분, 고형불순물, 전산가, 총 글리세롤, 모노글리세라이드, 디글리세라이드, 트리글리세라이드, 유리글리세롤, 산화안정도, 메탄올, 알칼리 금속, 인 등이 있습니다.
