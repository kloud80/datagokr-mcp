summary_user: 중소벤처기업진흥공단이 해외 유관기관과 맺은 양해각서(MOU) 기반 글로벌 협력선을 협력기관 1건당 1행으로 정리한 파일로, 국가명·기관명·체결일·유효기간을 담는다(약 12KB 규모의 소형 CSV). 해외 진출을 준비하는 중소기업이나 분석가가 '공단이 어느 나라 어떤 기관과 협력 관계를 맺고 있고 언제 체결했는가'를 확인하거나, 협력선의 국가별 분포와 체결 시기별 추이를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명·기관명을 이름으로 맞춰 붙여야 하며, 사업자번호 같은 기업 식별자는 들어 있지 않다.
description_portal: 본 데이터는 중소벤처기업진흥공단이 글로벌 유관기관과의 협력 강화를 위해 체결한 양해각서(MOU)를 기반으로 구축한 글로벌 협력선 현황을 정리한 자료입니다. 국가명, 기관명, 체결일 등의 기본 정보를 포함하고 있으며, 이를 통해 국제 협력 네트워크의 범위와 주요 파트너 기관 현황을 한눈에 파악할 수 있습니다. 본 데이터는 해외 시장 진출을 지원하는 국제 비즈니스 네트워크 분석, 신규 협력국가 및 기관 발굴, 국제 교류 확대 전략 수립 등에 활용될 수 있으며, 협력선의 지역적 분포와 체결 시기별 변화 추이를 분석하는 데에도 유용한 기초자료로 제공됩니다.
