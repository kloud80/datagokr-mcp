summary_user: 부산광역시 중구 관내 전문건설업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 상호·업종·소재지·전화번호와 위도·경도 좌표를 포함한다. 건설사업자나 발주자가 '중구에 있는 철근콘크리트·실내건축 등 특정 업종 전문건설업체가 어디에 있는가'를 찾거나, 분석가가 업종별 업체 분포를 지도에 올릴 때 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 상호·소재지 주소 매칭이나 좌표 기반 공간 결합으로만 잇고, 같은 계열의 지방행정 인허가(LOCALDATA) 건설업 자료와 대조할 때도 이름·주소 매핑이 필요하다.
