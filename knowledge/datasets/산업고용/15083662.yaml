summary_user: 충청북도 청주시에 등록된 전문건설업체를 업체 단위로 담은 파일 데이터로, 업체명·대표자·업종·우편번호·도로명주소·전화번호를 포함하며 검증 시 2,233행을 받았다. 시민이나 분석가가 청주시 전문건설업체가 어느 지역에 몇 곳 있고 어떤 업종을 보유했는지 확인하는 질문에 쓴다. 영업소재지(도로명주소)를 조인 키로 삼아 주소 기반의 다른 지역·상권 데이터와 이어 쓴다.
description_portal: 충청북도 청주시에  등록된 전문건설업체 현황을 제공하는 데이터로 업체명, 대표자, 보유 전문건설업종, 소재지 (도로명주소), 전화번호에 대한 정보를 제공합니다.해당 정보로 청주시 전문건설업체 분포 현황에 대하여 파악할 수 있습니다.전문건설업은 건설산업기본법에 따라 전문건설업 등록을 한 사업자가 건설공사의 각 공종별 전문공사를 직접 도급 또는 하도급 받아 해당 전문분야의 시공기술을 가지고 공사를 수행하는 업을 말하며,일반건설업에서 수립한 종합적인 관리계획을 토대로 시공을 담당하는 핵심적인 생산주체로서의 역할을 수행하고 있습니다.
