description_portal: 한국가스공사가 중소기업 기술경쟁력 제고를 위해 무상 기술이전하는 지식재산권 목록에 관한 자료입니다. 기술나눔 사업은 공사가 보유한 특허, 실용신안 등의 지식재산권을 중소기업에 무상으로 이전하여 기술 혁신과 사업화를 지원하는 대표적인 사회공헌 활동입니다. 본 데이터는 기술나눔 사업 홍보 및 참여 기업 확대를 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 일련번호, 지식재산권명, 등록 구분(특허/실용신안), 등록번호가 포함되어 있습니다. 본 데이터를 활용하면 기술나눔 대상 지식재산권 현황 파악, 중소기업의 필요 기술 탐색 및 선정, 기술이전 신청 절차 진행, 기술 활용 가능성 및 사업화 타당성 평가에 기초자료로 활용할 수 있어 중소기업 기술 역량 강화와 공사의 사회적 가치 실현에 기여할 것으로 기대됩니다.* 본 기술나눔 목록은 2025년에 추가된 지식재산권의 목록입니다.* 본 기술나눔 목록의 보다 자세한 기술내용은 한국특허정보시스템 키프리스(kipris.or.kr)에서 등록번호 검색을 통하여 확인하실 수 있습니다.
