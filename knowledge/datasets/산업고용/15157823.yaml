summary_user: 경상북도 영천시가 허가한 태양광 발전사업을 발전소(허가건) 단위로 담으며, 허가일·상호·읍면동·리동·지번 위치·발전원·발전용량·설치면적을 기록한다. 지역 에너지 담당자나 분석가가 영천시 어느 읍면동에 얼마 규모의 태양광 발전소가 허가됐는지, 허가 시점별로 용량이 어떻게 늘었는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 주소(읍면동·지번)나 이름 매칭으로만 다른 데이터와 연결하며, 전국태양광발전소전기사업허가정보 표준데이터와 견줘 보는 용도가 자연스럽다.
limits: 허가 현황이라 실제 준공·가동 여부나 발전량은 담지 않는다. 포털 설명상 2014년 8월 1일 소규모 전기사업허가 업무가 시군구로 위임되기 이전 허가건은 누락될 수 있다. 공통 코드 키가 없어 다른 데이터와는 주소 문자열 매칭에 의존해야 한다.
