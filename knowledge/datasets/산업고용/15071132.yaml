summary_user: JDC지정면세점에 상품을 공급하는 협력업체별로 브랜드·상품군(수입·국산·환급대상)·품종, 최초 입점일자와 입점일자, 거래·결제조건, 공급·결제통화, 세무코드, 선적지, 운송수단(선박·항공기)을 한 행씩 담은 CSV 파일(약 54KB)이다. 면세점 입점을 검토하는 공급업체나 분석가가 '어떤 브랜드가 어느 선적지에서 어떤 운송수단과 통화로 들어오는가'처럼 공급망·계약 조건을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 협력업체명·브랜드명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 물류 및 에이전트 관련 정보를 정리한 자료입니다. 각 데이터 항목은 협력업체명, 상품군, 품종, 브랜드명, 최초 입점일자, 입점일자, 거래조건, 결제조건, 공급통화, 결제통화, 세무코드, 선적지, 운송수단으로 구성되어 있으며, 협력업체명은 면세점에 상품을 공급하는 업체의 명칭, 브랜드명은 해당 업체가 취급하는 상표명을 의미합니다. 상품군은 수입, 국산, 환급대상상품으로 분류되어 있어 면세점 내 유통되는 상품의 유형을 파악할 수 있으며, 품종은 브랜드 내 상품의 세부 유형을 나타냅니다. 최초 입점일자와 입점일자는 상품이 처음 면세점에 입점한 시점과 이후 실제 입점일을 구분해 기록합니다. 거래조건과 결제조건은 공급 및 정산 방식에 대한 계약적 내용을 설명하며, 공급통화와 결제통화는 각각의 거래에서 사용되는 화폐 단위를 나타냅니다. 세무코드는 세무 관련 분류 코드를, 선적지는 상품 출발지를, 운송수단은 물류 수단으로 선박과 항공기로 구분됩니다. 본 데이터는 공급망 분석, 계약 관리, 물류 최적화, 상품 유형별 유통 경로 이해 등 면세점 운영 전반의 효율성을 높이기 위한 기초자료로 활용될 수 있습니다.
