summary_user: 한국서부발전이 전력생산에 쓴 유연탄(소비탄)의 사용량과 총수분·수분·휘발분·회분·고정탄소·유황률·인수식발열량·미연탄소분율 같은 성분 분석 결과를 담은 API이며, 필드명으로 보아 발전소(orgnm)·호기·연도 단위로 구분되는 것으로 보인다. 에너지·환경 분석가가 서부발전 발전소별로 연료탄의 발열량과 황·회분 함량이 어떻게 다른지, 미연분이 어느 수준인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 표준 코드 형태의 조인 키가 없어 발전량·배출 측정 데이터와 붙이려면 발전소·호기 이름을 직접 맞춰야 한다. 개발계정은 하루 10회로 호출이 제한되고, 범위는 전국 단위의 비공간 자료여서 지역 단위 분석에는 맞지 않는다.
