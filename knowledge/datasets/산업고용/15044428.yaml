description_portal: 한국서부발전의 전력생산을 위한 유연탄 성분 정보를 제공하는 오픈API 입니다. 전력생산을 위한 소비탄 성상정보 데이터는 발전소에서 사용되는 석탄의 품질 특성과 물리·화학적 속성을 기록한 자료로, 안정적인 전력 생산과 효율적 연료 관리에 중요한 역할을 합니다. 이 데이터에는 석탄 사용량, 총수분율, 수분, 휘발분, 회분, 고정탄소, 건식유황률, 인수식발열량, 미연탄소분율, 인수유황률 등 주요 성분 분석 결과가 포함됩니다. 발열량은 전력 생산 효율에 직접적인 영향을 주며, 회분과 황 함량은 환경오염 물질 배출과 관련된 중요한 지표입니다. 또한 수분과 휘발분은 연소 안정성과 보일러 효율에 영향을 주기 때문에 운영 전략 수립에 활용됩니다.
