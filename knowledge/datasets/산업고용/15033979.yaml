summary_user: 충청북도 괴산군에서 허가한 100kW 이하 신재생에너지(태양광·풍력 등) 발전사업의 허가 및 사업개시 현황을 발전소 한 건씩 담은 파일로, 발전소명·사업장소·허가용량(kW)·허가일·사업개시일이 들어 있다. 괴산군 안에서 소규모 태양광 발전소가 어느 지역에 얼마나 허가됐고 실제로 가동을 시작했는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장소 주소나 발전소명을 맞춰 보거나, 전국태양광발전소전기사업허가정보표준데이터처럼 발전소 단위로 주소·용량을 담은 데이터와 대조해 이어 쓴다.
limits: 범위는 괴산군 한 시군구로, 다른 지역이나 100kW 초과 설비는 포함하지 않는다. 공통 코드나 고유 식별자가 없어 다른 데이터와 연결하려면 이름·주소를 직접 맞춰야 한다.
