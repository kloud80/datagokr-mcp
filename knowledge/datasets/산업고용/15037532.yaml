summary_user: 창업도약패키지 지원사업의 특화프로그램을 주관기관별·프로그램 단위로 정리한 전국 범위 파일로, 주관기관명·프로그램명·간략 소개를 담는다(약 9KB 규모의 CSV). 창업기업이나 분석가가 "어느 주관기관이 투자·글로벌 진출·R&D·판로개척 같은 특화프로그램을 운영하는가"를 비교하고 지원기관을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지원사업 공고나 기관 데이터와는 주관기관명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 중소벤처기업부와 창업진흥원이 추진하는 「창업도약패키지 지원사업」의 특화프로그램 운영정보를 정리한 자료로, 전국 주관기관별 프로그램명, 지원내용, 운영 목적 등을 포함하고 있다. 프로그램 유형은 투자·글로벌 진출·R&D·ESG·판로개척·멘토링 등으로 구분되며, 각 기관의 전략적 기획과 연계된 세부 프로그램들이 포함되어 있어, 지역별 또는 유형별 지원 패턴 분석, 사업 성과 비교, 정책 수요 예측 등 창업기업 지원사업의 전략 수립을 위한 기반 자료로 활용 가능하다.이 데이터는 프로그램 단위의 비교 분석, 유사 프로그램 간 차별성 도출, 주관기관별 운영방식 특성화 등을 위한 실무적 근거 자료로서 유의미하다.
