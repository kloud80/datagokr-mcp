summary_user: 한국장애인고용공단이 위탁약정을 맺은 민간훈련기관의 훈련과정을 과정 단위로 담은 연도별 파일로, 공단 관할기관·훈련기관명·주소·과정명·업종 분류·훈련 시작·종료일·총훈련시간 등을 전국 범위로 기록한다. 장애인 구직자나 상담 인력이 '우리 지역에서 어떤 민간기관이 어떤 직종의 장애인 훈련과정을 언제, 몇 시간 운영하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 직업훈련·고용 데이터와는 훈련기관명·주소나 관할기관 이름을 맞춰 연결해야 한다.
description_portal: 민간훈련기관 사업이란, 한국장애인고용공단의 훈련기관(직업능력개발원, 디지털훈련센터, 발달장애인훈련센터 등) 외 지역이나, 훈련과정을 제공하기 위해 민간훈련기관과의 위탁약정을 체결하여장애인에게 훈련기회를 제공하는 사업입니다.2026년에 선정된 민간훈련기관에 대한 데이터로 공단 관할기관별, 소재지, 훈련기관명, 훈련과정명, 훈련개시일, 훈련종료일, 총 훈련시간에 대한 정보를 제공합니다.해당데이터는 한국장애인고용공단(www.kead.or.kr)에서도 확인하실 수 있습니다.
