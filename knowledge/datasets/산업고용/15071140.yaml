summary_user: "한국지역난방공사가 신재생에너지로 생산한 에너지량을 연도별 연간 합계(연간생산량과 단위, 예: kWh)로 담은 전국 단위 집계 파일로, 크기 254바이트의 작은 CSV입니다. 분석가가 '공사의 신재생에너지 생산량이 해마다 어떻게 늘거나 줄었나'를 보는 추이 분석과 그래프 작성에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 해당년도를 기준으로 맞추거나 같은 기관의 다른 공개 데이터와 이름으로 대조해 이어 쓴다."
