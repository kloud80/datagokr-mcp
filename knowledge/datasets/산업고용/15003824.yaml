summary_user: 한국서부발전이 신재생에너지공급인증서(REC) 현물시장에서 거래한 내역을 거래일(ymd)별 체결수량과 평균가격으로 담은 전국 단위·비공간 데이터다. 발전사업자나 분석가가 특정 기간 서부발전의 REC 체결 규모와 가격이 어떻게 움직였는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 REC·SMP 시세 데이터와는 날짜를 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국서부발전의 신재생에너지 거래 현황 정보제공 오픈API입니다.  태양광, 풍력, 연료전지, 바이오매스 등 다양한 신재생 설비에서 생산된 전력을 전력시장에 거래한 내역을 정리한 자료입니다. 이데이터에는 체결수량 및 평균가격이 포함되어 있습니다. 또한 월별 및 연도별 추이를 통해 신재생 전력의 시장 참여 규모와 가격 변동을 파악할 수 있으며, 의무공급비율(RPS) 충족 여부를 확인하는 근거자료로도 활용됩니다. 거래현황데이터는 한국서부발전이 단순히 신재생 전력을 생산하는 것을 넘어 전력시장 내에서 어떤 경제적 가치를 창출했는지를 보여주며, 에너지 전환 정책의 실질적 성과를 평가하는 기준이 됩니다.
