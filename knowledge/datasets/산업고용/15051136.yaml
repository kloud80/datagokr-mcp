summary_user: 광업등록사무소 통계집에 수록된 2012년 이후 광업권 등록현황을 연도·광종(금속광·비금속광 분류 아래 법정광물)별로 묶고, 시도별 등록 건수를 열로 펼친 전국 집계표(CSV, 약 12KB)입니다. 분석가나 자원개발 사업자가 '특정 광종의 광업권이 어느 시도에 몰려 있고 연도별로 어떻게 변했나'를 확인하는 데 씁니다. 전역 조인 키나 행정코드가 없어, 다른 시도 단위 통계와는 시도 이름을 행정코드로 매핑해서만 이어 쓰고, 광종도 이름으로만 맞춥니다.
description_portal: 광업권 등록현황 - 광종별 시도별 총 광업권 등록현황 공공데이터는 산업통상자원부 광업등록사무소에서 매년 발간하는 광업권 설정출원 및 등록현황 통계집에 수록된 광업권 등록현황 중 2012년 이후 광종별, 시도별 총 광업권 등록현황에 대한 데이터로 연도, 광종분류(금속광, 비금속광), 광종(광업법 제3조에 규정된 법정광물), 시도(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남) 등의 항목을  기계 판독이 가능한 형태(소프트웨어로 데이터의 개별내용 또는 내부구조를 확인하거나 가공할 수 있는 상태)로 정비하고 CSV 오픈포맷으로 공공데이터포털(www.data.go.kr)을 통하여 누구나 쉽게 활용할 수 있도록 제공하고 있습니다.
