summary_user: 충청남도에서 허가받은 전기(발전)사업을 허가 건별로 담은 원장이며, 허가번호·발전소명·상호·설치장소·사업허가일자·사업개시일자·허가용량·원동력(태양광·풍력·바이오 등)을 포함하고 활용신청 없이 CSV 파일(약 74KB)로 받는다. 에너지 분석가나 지역 주민이 충남 어느 지역에 어떤 에너지원의 발전소가 얼마나 허가됐고 실제 사업개시까지 얼마나 걸렸는지 확인하는 데 쓴다. 전역 조인 키는 없어서 설치장소 주소 문자열이나 발전소명·상호를 기준으로 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 원장과 이름·주소 매칭으로 이어 쓴다.
limits: 실측 컬럼에 법정동코드나 사업자번호 같은 공통 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 용량 필드는 킬로와트 단위로 표기돼 있어, 포털 설명의 MW와 섞어 쓰지 않도록 주의한다.
