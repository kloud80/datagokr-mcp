description_portal: '본 데이터는 고용노동부에서 매년 고시하는 연도별 최저임금 현황을 수록한 것으로, 근로자 보호와 생활 안정, 노동시장의 공정한 근로조건 보장을 위해 활용된다. 최저임금 제도는 최저임금법에 따라 모든 사업 또는 사업장에 적용되며, 매년 최저임금위원회의 심의·의결을 거쳐 고용노동부장관이 고시한다. 해당 데이터에는 연도별 최저임금액, 적용기간 등이 포함되어 있어 학계 연구, 정책 수립, 기업의 인건비 관리 및 근로자 권익 보호를 위한 기초자료로 유용하다* 연도별 공표되는 최저임금: 「최저임금법」제10조제1항에 따라 매년 1월 1일부터 12월 31일까지 적용되는 시간급 최저임금'
