summary_user: 한국남부발전이 개발선정품으로 등록한 제품을 건별로 담은 파일로, 등록번호·선정 과제명·개발 업체명·품명과 선정 유효기간(시작일자·종료일자)을 행마다 기록한다(csv 약 7.5KB의 소규모 목록). 발전 분야 공공 시장 진출을 준비하는 중소기업이나 조달 컨설턴트가 '남부발전에 어떤 업체의 어떤 제품이 언제까지 개발선정품으로 등록돼 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·품명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 본 파일데이터는 한국남부발전(주)_개발선정품 등록정보에 대한 데이터입니다. 데이터는 제품의 고유 식별을 위한 순번 및 등록번호, 선정된 과제명, 제품을 개발한 업체명, 품명 등의 핵심 정보를 포함합니다. 또한, 해당 선정품의 시작일자와 종료일자를 제공하여 유효 기간을 명확히 확인할 수 있습니다.본 데이터는 공공 시장 진출을 희망하는 기업의 경쟁 제품 분석, 정책 연구기관의 중소기업 기술 개발 성과 분석, 그리고 조달 관련 컨설팅 및 연구에 활용될 수 있습니다. 발전분야와 관련된 기술 제품의 개발현황을 파악하는데 도움을 줄 수 있습니다.
