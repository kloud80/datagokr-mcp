description_portal: 이 데이터는 전북특별자치도 내에서 중질유(B-C유, 정제유 등)를 연료로 사용하는 대기 배출 시설의 현황을 보여주는 목록입니다. 각 사업장의 명칭, 소재지, 생산품과 같은 기본 정보와 함께, 사용하는 연료의 종류와 일일 사용량을 구체적으로 명시하고 있습니다. 중질유는 연소 시 다량의 대기오염물질을 배출할 수 있어 특별 관리가 필요한 연료입니다. 따라서 이 자료는 지역 내 주요 대기오염 배출원을 파악하고, 미세먼지 등 대기 질 개선을 위한 환경 규제 및 관리 정책을 수립하는 데 있어 핵심적인 기초 데이터로 활용됩니다.
