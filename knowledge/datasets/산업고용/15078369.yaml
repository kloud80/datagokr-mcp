summary_user: 충청북도의 실업자 규모를 연도·월·성별 단위로 담은 집계 데이터로, 시도 단위 월별 격자 형태다. 분석가나 지자체 담당자가 "최근 충북의 남녀별 실업자 수가 월별로 어떻게 변했나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도 고용동향이나 같은 기관의 취업자·고용률 데이터와는 연도·월(YEAR, MT)과 성별을 맞춰 이름 기준으로 이어 쓴다.
description_portal: 충청북도 고용동향 중 실업자 규모를 연도·월·성별 기준으로 조회할 수 있는 Open API로, 특정 시점에서 일할 능력과 의사는 있으나 일자리를 얻지 못한 인구의 현황을 입력 파라미터를 통해 정확하게 확인할 수 있습니다. 실업자 데이터는 지역 노동시장의 불균형 정도를 보여주는 핵심 지표로, 경기 변동, 산업 구조 변화, 인구 특성에 따른 고용 취약성을 분석하는 데 중요한 기초자료로 활용됩니다. 행정기관은 이를 바탕으로 실업률 변동에 따른 정책 대응, 취약계층 맞춤형 고용지원 전략 수립, 일자리 회복정책의 효과 분석 등 근거 기반의 의사결정을 수행할 수 있으며, 연구자·민간에서는 지역노동시장 진단, 경제동향 분석, 고용·복지 연계 서비스 개발 등 다양한 분야에서 활용 가능합니다.
