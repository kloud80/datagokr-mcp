summary_user: 성남시 관내 태양광 발전소를 한 곳씩 담은 건별 목록으로, 발전소명·지번/도로명 주소·위도·경도·설비용량(kW)·사업허가일·사업개시일·허가기관을 수록한다(CSV 약 6.8KB 규모). 성남시 어느 동네에 태양광 발전소가 얼마나, 어떤 용량으로 들어섰는지 확인하려는 주민·사업자나 지역 신재생 보급 현황을 보는 분석가가 쓴다. 전역 조인 키는 없어 주소·좌표나 발전소명으로 전국태양광발전소전기사업허가정보 표준데이터 등 다른 발전소 원장과 맞춰 이어 쓴다.
description_portal: 성남시 태양광발전소 현황 데이터는 관내에 설치된 태양광 발전시설의 위치, 용량, 유형, 운영 주체 등 신재생에너지 인프라 정보를 종합적으로 수록한 자료로, 지역 에너지 자립도 향상과 탄소중립 정책 수립을 위한 핵심 기반 데이터입니다. 성남시는 이 데이터를 기반으로 신재생에너지 보급률을 분석하고, 향후 확대 대상지를 선정하거나, 지역별 발전 효율성을 진단하여 사업 타당성 평가 및 인센티브 정책에 활용합니다. 또한 건물옥상 등 유휴공간을 활용한 태양광 확대, 공공기관 자가발전시설 설치, 에너지 취약계층 지원형 발전소 구축 등 다양한 정책기획의 근거 자료로 활용됩니다.
