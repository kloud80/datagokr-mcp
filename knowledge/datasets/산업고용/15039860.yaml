summary_user: 한국전력공사가 적용한 월별 통합 SMP(계통한계가격) 단가를 연도·월 단위로 담은 집계 파일로, 순번·연도·월·금액(수기금액) 네 항목으로 구성되며 전국 단위·비공간 자료입니다. 에너지 분석가나 기업이 "국제 유가·원자재 가격이 오른 달에 SMP가 얼마나 올랐나" 또는 "다음 달 전력 구매비용을 어느 수준으로 잡아야 하나"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·월을 맞춰 붙이는 방식으로만 이어 쓰며, 상세 시간별 값은 전력거래소 전력통계정보시스템(EPSIS)에서 따로 확인한다.
