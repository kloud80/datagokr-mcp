summary_user: 현재 운영 중인 전국 직업훈련기관을 기관 한 곳당 한 행으로 담은 목록으로, 기관명·시군구 지역·우편번호 포함 주소·주소 기준 변환 위도·경도를 포함한다. 구직자나 지자체·분석가가 '우리 시군구에는 어떤 직업훈련기관이 있고 지도상 어디에 있나'를 확인하거나 지역별 훈련기관 분포를 지도로 그리는 데 쓴다. 전역 조인 키나 기관 코드가 없어 다른 데이터와는 훈련기관명 문자열이나 시군구명·좌표로만 맞춰 붙여야 하며, 직업훈련 과정 데이터와는 기관명 매칭으로 잇는다.
description_portal: 현재 운영중인 직업훈련기관의 기관목록 정보입니다. 자료는 훈련기관명, 훈련기관이 위치하고 있는 소재지의 지역(시군구 기준)정보, 훈련기관의 주소정보(우편번호 포함), 해당 소재지를 기준으로 전환처리 한 위도 경도 정보 입니다. 지역별로 위치하고 있는 훈련기관의 정보를 확인 할 수 있으며, 전환처리 한 위도와 경도의 정보가 존재하여 지도상에 해당 훈련기관의 정보를 표기할 수 있습니다.본 자료는 1년의 주기로 갱신되어 자료의 현행화와 지속적인 관리를 진행하며, 추가 개방이 필요한 경우 추가하도록 하겠습니다.
