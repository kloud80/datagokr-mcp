description_portal: '신재생에너지 제조업,건설업,공급업,서비스업 등 전 산업에 대한 업종별 사업체수, 종사자수, 매출액 등의 산업현황 데이터ㅇ사업체수(기업체수) : 수직계열화가 되어있는 업체의 경우 최종 산출 품목에서만 집계 // 사업체수 합계는 2개 이상 신재생에너지원의 산업을 영위하는 사업체 및 동일 에너지원 상의 2개 이상 품목을 영위하는 기업체의 중복을 제외한 수치로 에너지원별 사업체수의 단순합과 일치하지 않음ㅇ국내사업장매출 : 매출액은 신재생에너지 품목의 출하액 합계로 부가가치를 의미하지 않으며, 내수와 수출매출로 구성 // 단, 수직계열화가 되어있는 업체의 경우 최종 산출 품목에서만 집계 ㅇ해외공장매출 : 특정 기업의 비밀보호를 위해 품목별 해외공장매출을 공개하지 않음 // 국내 업체의 해외 소재 공장이 있는 경우, 해당 공장에서 발생한 매출액을 의미 // 매출은 신재생에너지 품목의 출하액 합계로, 부가가치를 의미하지 않음ㅇ태양광 장비 : 계측기기, 모듈 테스터 및 메모리 컴포넌트 테스터, 와이어쏘 장비 등 포함ㅇ태양광 부품/소재 : 필름, 글라스, 메탈페이스트, 슬림로드, 트래커, 백시트, EVA 필름 등 포함ㅇ발전시스템 : 에너지생산이 가능한 상태의 시스템 제조로, 건설 산업활동(건설, 설치, 시공)은 제외ㅇ풍력 부품 : 풍력계기, 터빈, 베어링(메인샤프트, 선회베어링, 요베어링 등), 기어박스(증속기) 등 포함ㅇ연료전지 부품/소재 : 분리판, 가스확산층(Gas Diffusion Layer, GDL), 가스켓 등 포함ㅇ폐기물 : 근거법령 개정에 따라 2019년 실적부터 폐기물에너지 중 비재생폐기물은 조사대상에서 제외ㅇ특정 항목에 해당하는 기업체수가 2개 이하 또는 연관관계로 인해 특정 기업체를 식별할 수 있는 경우, 비밀보호를 위해 해당항목 및 연관관계에 있는 항목을 합산ㅇ통계작성변경에 따라 19년 실적부터 비상시 고용인원(임시 및 일용근로자) 포함'
