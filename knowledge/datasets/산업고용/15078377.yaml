summary_user: 충청북도 주민의 경제활동참가율(%)을 연도(YEAR)·월(MT)·성별 단위로 담은 시도 수준 집계 지표 API다. 지역 고용정책 담당자나 분석가가 "충북의 남녀 경제활동참가율이 월별로 어떻게 변해 왔나"처럼 지역 노동공급 수준을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 충청북도 고용동향의 취업자·실업률·고용률 자료와는 연도·월·성별 값을 맞춰 이어 쓴다.
description_portal: 충청북도 지역 주민이 노동시장에 참여하는 비율을 나타내는 경제활동참가율을 연도·월 단위로 조회할 수 있는 Open API로, 성별 기준의 경제활동참가율(%)을 입력 파라미터를 활용해 상세하게 확인할 수 있습니다. 해당 데이터는 지역의 노동공급 수준과 경제활동 흐름을 파악하는 핵심 지표로서, 취업자·실업자 등 다른 고용지표와 함께 분석할 때 지역경제의 구조적 특징을 명확히 파악할 수 있습니다. 행정기관은 이를 토대로 취약계층 맞춤형 고용지원 전략 마련, 노동시장 활성화 정책 검토, 지역별 인력수급 판단 등 근거 기반의 정책 결정을 수행할 수 있으며, 연구자와 민간에서도 노동참여도 분석, 지역 간 경제여건 비교, 사회경제 구조 변화 연구 등에 폭넓게 활용할 수 있습니다.
