description_portal: 한국서부발전의 발전소별, 발전원별 연간 온실가스 배출량과 발전량을 담은 자료입니다. 온실가스 배출량은 만톤 단위로, 발전량은 GWh 단위로 제공됩니다. 이 정보를 통해 어떤 발전 방식이 더 많은 온실가스를 배출하는지, 그리고 전체 발전량 대비 온실가스 배출량은 어느 정도인지 파악할 수 있습니다.발전원별 배출량 비교를 통해 효율이 낮은 발전 방식을 줄이고, 친환경 에너지원 투자를 확대하는 전략 수립에 활용될 수 있습니다. 또한, 발전량 증감 추이와 온실가스 배출량 변화를 함께 분석하여 탄소 배출량 감축 분석에 기초 자료로 이용할 수 있습니다. 제공되는 정보는 연간 발전소 발전원별 온실가스배출량 및 발전량 정보 입니다.- 온실가스배출량 단위 (만톤)- 발전량 단위 (GWh)
