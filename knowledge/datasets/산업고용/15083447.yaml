summary_user: 산업통상부 장관이 방위사업법에 따라 방산업체로 지정한 업체의 명단을 업체 한 곳당 한 줄(연번·업체명)로 담은 전국 단위 파일이며, 크기는 약 2KB의 작은 CSV입니다. 방산 협력사를 찾는 사업자나 분석가가 '어느 기업이 정부 지정 방산업체인가'를 확인할 때 쓴다. 실측 컬럼에 사업자번호 같은 공통 조인 키가 없어, 다른 기업 데이터와는 업체명을 직접 맞춰 이어 써야 한다.
description_portal: 방위사업법 제35조에 따라 방산물자를 생산하고자 하는 자는 대통령령이 정하는 시설기준과 보안요건을 갖추어 산업통상부 장관으로부터 방산업체의 지정을 신청하면, 방위사업청과 협의를 거쳐 방산업체로 지정하고 있습니다.방산업체의 시설기준은 방위사업법 시행령 제42조, 보안요건은 제44조 등에 따라 산업통상부장관이 정하도록 규정하고 있습니다.위와 같은 규정에 따라 산업통상부장관이 지정한 방산업체의 현황을 매년 5월31일을 기준으로 확인하여 그 업체명단을 공개하고 있는 자료입니다.
