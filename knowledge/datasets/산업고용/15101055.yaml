description_portal: '현재 건설중인 원자력발전소의 프로젝트별(신한울1,2호기, 신한울3,4호기 및 새울3,4호기) 보조기기(BOP, Balance of Plant) 계약현황을 정리한 자료입니다.보조기기는 원자력발전소를 구성하는 설비중 원자로, 증기발생기, 터빈발전기 등 주기기를 제외한 모든 구성 설비를 총칭하는 개념입니다. 모든 품목들은 품질등급에 따라 분류되고, 적용되는 분야는 토목, 건축, 기계, 배관, 전기, 계측 등이 있고, 대표적인 품목으로는 격납건물 철판(CLP : Containment Liner Plate)이 있습니다.'
