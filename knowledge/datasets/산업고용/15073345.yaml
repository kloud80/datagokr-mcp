summary_user: 중소벤처기업진흥공단 수출지원사업에 2017년 이후 참여한 중소기업을 기업 1곳·사업 1건 단위로 담은 원천 파일로, 전국 11,760행이다. 분석가나 정책 담당자가 수출지원사업 참여기업의 지원 전년도와 지원 연도 재무(자산·매출·영업이익·순이익)가 어떻게 달라졌는지, 업종·지역별 지원 분포가 어떤지 확인하는 데 쓴다. 이어 쓸 수 있는 키는 소재지(address)뿐이며, 사업자번호 필드는 있으나 조인 키로 확인된 것은 아니므로 지역 단위 기업 현황·지원사업 공고와 소재지 기준으로 맞춰 본다.
description_portal: 「중소벤처기업진흥공단 수출지원사업 참여 중소기업 현황」은 2017년 이후 중소기업이 참여한 다양한 수출지원사업의 현황을 정리한 데이터입니다. 참여 기업의 사업자번호, 지원사업명, 지원년도, 업종, 소재지, 종업원 수, 업력과 함께 지원 전년도 및 해당 연도의 자산, 매출, 영업이익, 순이익 등의 재무 정보를 포함하고 있습니다. 본 데이터는 사업별 참여기업의 성과를 분석하고, 지원 전후의 재무 변화를 비교하여 정책 효과성을 검증하는 데 유용합니다. 또한 업종별·지역별 지원 분포를 확인하고, 향후 수출지원사업 개선 및 맞춤형 지원 전략 수립, 중소기업 글로벌 경쟁력 강화 연구에 기초자료로 활용될 수 있습니다.
