summary_user: 서울시 행정동별·서비스업종별로 점포 수, 유사업종 점포 수, 프랜차이즈 점포 수, 개업률·개업 점포 수, 폐업률·폐업 점포 수를 담은 집계 데이터로, 기준 분기(STDR_YYQU_CD) 단위로 제공된다. 창업 예정자나 상권 분석가가 '이 행정동에서 미용실은 몇 곳이고 최근 폐업률은 얼마인가' 같은 업종 경쟁·창폐업 동향 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 행정동 코드·이름(ADSTRD_CD)과 서비스업종 코드로 같은 서울시 상권분석서비스의 다른 데이터(매출·유동인구 등)나 행정동 경계와 매핑해 이어 쓴다.
description_portal: 이 데이터는 서울시 행정동 단위에서 업종별 점포 수와 영업 현황을 상세히 제공하는 자료입니다. 일식음식점, 호프·간이주점, 예술학원, 미용실, 스포츠 강습 등 다양한 업종별로 점포 수를 확인할 수 있으며, 유사 업종과 비교한 점포 수, 신규 개업률 및 개업 점포 수, 폐업률 및 폐업 점포 수, 프랜차이즈 점포 수까지 함께 제공합니다. 이를 통해 특정 행정동 내 업종별 상권의 규모와 변화를 분석할 수 있으며, 지역별 창업·폐업 동향, 업종 경쟁 현황, 프랜차이즈 비중을 종합적으로 파악할 수 있습니다. 또한 지역 경제의 활력도와 소상공인 창업 정책, 상권 활성화 전략 수립 등 공공 및 민간에서 다양하게 활용 가능한 상권 기초 데이터로 유용합니다.
