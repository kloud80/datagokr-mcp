description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 수행하는 "에너지기술기업실태조사"의 결과 중, 국내 에너지 기술 기업들의 기술 개발 조직 현황에 대한 정보를 집약한 공공 데이터입니다.제공되는 정보는 조사 연도별로 에너지 기술 분야별(예: 태양광, 풍력, 수소 등)로 분류된 기업들의 기업부설 연구소 및 기술개발 전담부서의 보유 유무에 대한 정보를 포함합니다. 이 데이터는 에너지 기술 분야의 R&D 인프라 구축 현황을 파악하고, 기술 개발 조직이 기업의 규모나 기술 분야에 따라 어떻게 분포되어 있는지를 분석하는 데 유용합니다. 궁극적으로 국내 에너지 산업의 기술 혁신 역량 강화 및 지속 가능한 성장에 기여할 것으로 기대됩니다.'
