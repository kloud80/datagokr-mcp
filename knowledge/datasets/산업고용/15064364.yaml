summary_user: 서귀포시가 추진하는 지역공동체일자리사업을 세부사업 단위로 정리한 작은 파일(CSV 약 2KB)로, 사업 시기·유형·담당부서·사업장·세부사업명·참여 인원·자격요건을 담는다. 서귀포 주민이 올해 어떤 공동체 일자리에 어떤 자격으로 참여할 수 있는지 확인하거나, 분석가가 사업 유형별 배정 인원을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 일자리사업 데이터와는 사업명·부서명 같은 이름 매핑이나 같은 기관(서귀포시) 기준으로만 이어 쓴다.
description_portal: 이 자료는 서귀포시에서 추진 중인 지역공동체 일자리 사업들의 운영 현황을 정리한 공공데이터로, 사업시기, 유형, 담당부서, 사업장, 세부사업명, 참여 인원, 자격요건 등이 포함돼요. 특히 취업취약계층 및 지역 주민의 생활안정과 고용 증대를 목적으로 다양한 공동체 일자리가 제공되며, 사업 유형마다 구성이 다르기 때문에 인원 배치 및 자격요건 비교가 가능해요. 행정기관은 이 데이터를 활용하여 사업 예산 계획, 대상자 맞춤 프로그램 설계, 일자리 균형 배송(지역 간/시기 간), 참여율 추이 분석 등에 활용할 수 있고, 주민은 참여 가능한 사업을 파악하거나 지역 일자리 기회를 탐색하는 데 유용합니다. 또한, 사회복지 및 고용 정책 연구자 입장에서는 공동체 기반 고용 활성화 효과, 생활지원과의 연계, 동일 사업 유형 간 인원 대비 효과 비교 등의 분석에 기반 자료로 쓸 수 있어요.
