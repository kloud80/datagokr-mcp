summary_user: 공공연구기관의 기술이전·사업화로 생긴 기술료 수입을 연도별로 공공연구소, 대학, 전체로 나눠 백만원 단위로 담은 전국 단위 집계표이며, 파일 크기는 539바이트로 작다. 기술이전 정책 담당자나 분석가가 "대학과 공공연구소의 기술료 수입이 해마다 어떻게 달라졌나"를 확인하는 데 쓴다. 연도 외에 공통 조인 키나 기관 코드는 없어 다른 기술이전 통계와는 연도를 기준으로 나란히 놓고 비교하는 식으로만 이어 쓴다.
