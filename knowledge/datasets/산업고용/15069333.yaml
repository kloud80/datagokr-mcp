description_portal: 동데이터는 성장공유형 대출을 통해 보유하고 있는 주식의 취득일자, 종류, 주식수, 전환금액, 지뷴률 등의 자료를 제공합니다.성장공유형 대출은 미래 성장 가치가 우수하고 향후 IPO 가능성이 있는 중소벤처기업에 대해 자금을 지원하여 창업활성화 및 성장단계 진입을 도모하는 것을 목적으로하며, 전환사채, 신주인수권부사채, (상환)전환우선주를 직접 인수하는 방식으로 지원하고 있습니다. 성장공유형 대출의 지원 범위는 운전자금 및 시설자금(토지구입, 건축 제외)이며, 기업당 20억원 내외로 지원하고 있습니다.
