summary_user: 전국 도시가스 공급량을 연도별로 가정용 취사·가정용 난방·일반용(상업용)·업무용·산업용·열병합발전·집단에너지·수송용 용도별로 나눈 집계 통계로, 단위는 천 제곱미터이며 2,563바이트 분량의 작은 CSV 파일입니다. 에너지 분석가나 정책 담당자가 '지난 수십 년간 가정용 난방과 산업용 도시가스 수요가 각각 어떻게 변했나'처럼 용도별 장기 추세를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 기준으로만 맞춰 쓰며, 전력 수급이나 에너지 사용량 통계 같은 다른 에너지 지표와 연도별로 나란히 비교하는 정도로 연계한다.
description_portal: 본 데이터는 국가 에너지 중 도시가스 수급과 관련된 통계 정보입니다.통계에는 도시가스 가정용 취사/가정용 난방(1987~), 일반용(상업용)/ 업무용 /산업용(1985~), 열병합발전용(1993~), 집단에너지(2005~), 수송용(2001~)이 있으며 그에 대한 정보를 제공하고 있습니다.단위는 천 제곱미터이며 본 데이터는 24.12.31을 기준으로 작성되었습니다. * 에너지법 시행규칙 별표에 의해 도시가스(LNG)는 1Nm3당 42.7MJ과 10,190kcal의 총 발열량과 38.5MJ과 9,190의 순발열량을 가집니다.
