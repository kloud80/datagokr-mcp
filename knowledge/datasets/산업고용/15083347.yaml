description_portal: 서부발전 발전소별 발전설비 열효율 정보입니다. 발전소별, 연도별, 발전원별 열효율 데이터는 각 발전소가 사용하는 에너지원(유연탄, 중유, LNG 등) 에 따라 투입된 연료 대비 실제 전력으로 변환된 비율을 연도 단위로 기록한 자료입니다. 열효율은 발전설비의 성능과 운영 효율을 평가하는 핵심지표로, 동일한 연료를 사용하더라도 설비의 연식, 운영방식, 환경설비 적용 여부 등에 따라 차이가 발생합니다. 연도별 데이터를 통해 발전소별 효율향상 추이, 설비 개선효과, 노후화에 따른 성능 저하를 파악할 수 있으며, 에너지 절감 및 온실가스 감축효과를 정량적으로 분석하는 근거자료로 활용됩니다.
