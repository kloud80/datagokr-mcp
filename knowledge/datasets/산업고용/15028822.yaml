summary_user: 부산광역시 금정구 관내에 등록된 행정사 사무소를 한 곳당 한 행으로 담은 파일로, 업체명·주소·전화번호·개업신고일을 담는다(약 2KB 규모의 CSV). 주민이나 사업자가 금정구 안에서 인허가 신청 대리나 서류 작성을 맡길 행정사 사무소를 찾을 때, 분석가가 지역별 행정사 사무소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·업체명 매칭으로만 잇고, 지방행정 인허가(LOCALDATA) 행정사 업종 원장과 대조하는 보조 자료로 쓴다.
description_portal: 부산광역시 금정구에 관내에 등록된 행정사 사무소 현황( 업체명,주소,전화번호,개업신고일) 입니다. 행정사는 행정기관에 제출하는 서류의 작성, 권리·의무나 사실증명에 관한 서류의 작성, 행정기관의 업무에 관련된 서류의 번역과 작성된 서류의 제출 대행, 인허가 및 면허 등을 받기 위하여 행정기관에 하는 신청, 청구 및 신고 등의 대리 등의 업무를 수행하는 자격사입니다. 행정사가 수행할 수 있는 업무는 행정사법에 근거하며 그 범위는 매우 다양합니다. 금정구 관내 행정사 사무소 현황에 대한 자세한 내용은 파일 내 내용을 참고해주시기 바랍니다.
