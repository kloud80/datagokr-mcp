limits: 부안군 한 시군구만 다루므로 다른 지역이나 전국 비교에는 다른 지자체 자료를 따로 모아야 한다. 주유소·충전소 ID나 좌표가 없어 오피넷 유가나 충전소 실시간 정보와 키로 바로 붙지 않는다.
