description_portal: '○ 통계개요* 통계명 : 도시가스 보급률* 통계종류 : 서울시 도시가스 보급률을 제공하는 일반ㆍ보고통계* 작성목적 : 도시가스를 더욱 편리하고 안전하게 공급하고, 에너지 자원을 효율적으로관리하고 에너지관련 정책수립에 필요한 기초자료를 제공하기 위함* 조사체계 : 한국도시가스협회* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 수요가수, 주민등록세대수, 보급률 등○ 용어설명* 도시가스 보급률 : 도시가스 수요가수/공급권역 총 세대수*100* 가정용 수요가수 기준* 공급권역 총세대수는 주민등록인구 세대수를 기준으로 함* 수요가수 : 가스요금 청구서의 발행부수를 말한다. 다만, 동일계량기에 대해서는1개월에 2회이상 조정한 경우에 있어서도 요금청구서의 발행매수는 1로간주함* 도시가스 : 도시의 중앙공급원에서 도관에 의하여 각 수요자에게 보여지는연료가스. 근년에는 액화기술의 발전에 의해 천연가스를 공급함○ 기타* 월보는 매월의 가매출실적을 잠정 집계한 것으로 연말결산에 따라 조정될 수 있음'
