description_portal: 2026년 1월 31일 기준으로 작성된 데이터입니다. 전라남도 나주시 관내 토석채취허가 및 산림 골재채취업체에 관한 정보입니다. 전라남도 나주시 산림 내에서의 토석채취허가 업체명, 채취허가지역, 허가면적, 허가량, 허가시작종료일 등에 관한 정보가 제공됩니다. 토석채취 허가는 산림 자원의 효율적 이용을 위해 필수적입니다.  국유림이 아닌 산지에서 토석을 채취(가공하거나 산지 이외로 반출하는 경우를 포함한다)하려는 자는 산지관리법 제25조에 따라 관할 행정청에 토석채취허가를 받아야 합니다.
