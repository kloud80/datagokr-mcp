summary_user: 전라남도 나주시 관내 산림 토석채취허가 업체를 업체별 한 줄로 담은 허가 원장 파일로, 업체명·소재지 도로명주소·채취허가지역·허가면적·허가량·허가 시작/종료일·용도·전화번호를 담는다(csv 약 1KB로 건수가 적은 편). 사업자나 주민이 '나주시에서 지금 토석채취 허가가 유효한 곳은 어디이고 허가량과 기간은 얼마인가'를 확인하거나, 분석가가 지역 채석·골재 공급 현황을 파악하는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소나 채취허가지역을 지번·좌표로 바꿔 국토 공간 규제·토지이용 데이터와 겹쳐 보거나, 업체명으로 다른 시군의 같은 성격 허가 데이터와 이름 매칭해 잇는다.
limits: 업체·필지를 잇는 공통 코드가 없어 다른 데이터와는 주소·이름 매칭으로만 연결되며, 범위는 나주시 한 시군구에 한정된다. 포털 설명상 2026년 1월 31일 기준 시점 자료이므로 이후 허가 변동은 반영되지 않았을 수 있다.
