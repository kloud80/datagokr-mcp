summary_user: 충청북도 제천시에 등록된 골재채취업체와 골재선별·파쇄업체를 업체 한 곳당 한 행으로 담은 명부로, 업체명·등록 유형·업종·등록번호·법인번호·전화·팩스·도로명주소를 싣고 있으며 파일 크기는 1,383바이트의 작은 CSV이다. 제천 지역에서 골재를 구하려는 건설 사업자나 담당 공무원이 "제천에서 골재 채취·선별파쇄로 등록된 업체는 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 이름 매칭이나 법인번호 대조로만 연결하며, 광업·토석채취 허가 원장 같은 공간 규제 데이터와 맞춰 보려면 주소를 따로 정제해야 한다.
description_portal: 본 데이터는 충청북도 제천시에 등록되어 있는 골재선별파쇄 및 채취업의 기본정보를 정리한 자료입니다. 본 자료는 골재채취등록업 및 골재선별 파쇄업체의 업체명, 등록업의 유형, 법인번호, 업종, 등록번호, 전화번호, 도로명주소, 팩스번호 등의 항목으로 구성되어 있습니다. 해당 자료는 제천시에 등록된 골재채취업체의 전화번호와 주소등이 포함되어 있어 최신정보 및 골재업체의 현황파악 및 안내서비스에 활용될 수 있습니다. 또한 골재채취업에 관한 행정 및 민간 활용 목적에 기초자료로 사용될 수 있습니다.
