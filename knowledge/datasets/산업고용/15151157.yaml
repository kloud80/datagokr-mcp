summary_user: 한국전력공사 지역본부(경기북부·남서울·서울·인천 등 사업소 구분 단위)별로 일자·시간 단위 전력사용량(MWh)과 합산 고객호수를 담은 원격검침 기반 집계 파일로, 범위는 전국이다. 에너지 분석가나 연구자가 '특정 지역본부의 하루 중 전력 사용이 몰리는 시간대는 언제인가' 같은 전력사용패턴 질문에 쓴다. 전역 조인 키가 없어 본부명 이름 매핑이나 기준일자·기준시를 맞춰 날씨·전력수급 등 시간 데이터와 이어 쓴다.
description_portal: 한국전력공사에서 관리하고 있는 지역본부 관할구분별 시간별 전력사용량 데이터 입니다.시간별 전력사용량 데이터는 원격검침을 통하여 수집된 데이터이므로 전체 전력사용량의 합계가 공식 통계자료와 상이한 부분이 있을 수 있습니다.전력사용패턴 등을 확인하시는 용도로 활용하여 주시기 바랍니다.지역본부를 구분할 때는 한국전력공사 사업소 구분 단위로써 경기북부, 남서울, 서울, 경기, 인천 등으로 구분되어 있습니다.(보다 자세한 사업소 구분의 지역범위를 확인하시기 위해서는 "한전 ON(online.kepco.co.kr)" 또는 "한국전력공사 홈페이지(kepco.co.kr)"를 참고하여 주시기 바랍니다.전력사용량은 MWh 단위의 값이며, 고객호수는 지역본부별 합산된 고객 호수로, 이사 또는 검침환경 등에 따라 시간별 변동이 있을 수 있습니다.
