description_portal: 본 데이터는 2014년 12월 기준으로 원자력안전연구 수행 주체별 참여 인력 현황을 정리한 데이터입니다.본 데이터에서는 연구기관, 대학, 민간연구소 등에서 연구 프로젝트에 투입한 인력 수와 비율 정보를 제공하고 있습니다. 이를 통해 각 기관 유형별 인력 규모를 비교할 수 있어, 어느 주체가 연구 인력을 얼마나 투입했는지를 파악할 수 있습니다. 원자력안전연구는 고도의 전문 지식과 기술이 요구되는 분야이므로, 연구기관과 대학, 민간연구소의 인력 투입 현황은 연구 성과의 질적 수준과 직결됩니다. 본 데이터는 기관 유형별 인력 참여 추이를 비교·분석할 수 있어 다양한 연구·정책적 목적에도 활용할 수 있습니다.
