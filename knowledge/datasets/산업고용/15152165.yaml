description_portal: 모태펀드는 정부주도로 벤처투자의 마중물 역할을 하는 펀드입니다. 이러한 모태펀드가 출자하여 개별투자 목적으로 조성되는 것이 펀드이며 벤처투자조합의 형태를 가집니다. 펀드조성금액은 자펀드가 모집한 총자금 규모로 벤처투자의 실탄이 됩니다. 자펀드 기준정보는 자펀드 조성금액인 결정총액의 핵심 단위로 활용되며 자펀드의 기준년월  이후 표기에 적용합니다. 결정총액은 자펀드 운용을 위해 확정된 최종투자총액이며 이 기준정보는 모태펀드 출자조합의 펀드규모 결정총액에 대한 주요통계의 기초자료를 제시하는데 도움이 되며 벤처투자시장의 규모와 흐름을 파악하는데 필수적입니다.
