summary_user: 워크넷 직업정보 가운데 직업별 향후 전망 서술을 직업 코드(KNOW직업코드)와 순번 단위로 담은 전국 단위 파일이며, 활용신청 없이 zip 파일로 받는다. 진로 상담자나 구직자가 '이 직업은 앞으로 일자리가 늘어날까 줄어들까'를 확인할 때, 그리고 분석가가 직업 추천·진로 콘텐츠에 전망 문구를 붙일 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 KNOW 직업코드를 쓰는 직업사전·직업정보 데이터와 코드 또는 직업명 매핑으로만 이어 쓴다.
description_portal: 본 자료는 한국고용정보원 워크넷에서 제공하는 직업정보 콘텐츠 데이터로, 특정 직업에 대한 향후 직업전망, 필요한 교육훈련 수준, 학력 및 전공 분포, 그리고 KNOW 기준 유사직업명 정보를 종합적으로 제공합니다.각 직업 항목은 고용 및 산업 변화에 따른 수요 전망, 입직에 필요한 교육 수준 및 이수 경로, 실제 종사자의 학력별·전공별 분포 현황, 그리고 유사한 직무나 활동영역을 가지는 직업 리스트와 함께 제공됩니다.이 데이터는 진로탐색, 커리어 컨설팅, 교육과정 설계, 직무 역량 비교, 인공지능 기반 직업 추천 알고리즘 구축 등 다양한 분야에서 활용 가능하며, 고용전망과 훈련 연계 정보를 함께 제공함으로써 수요자 맞춤형 경로 설정이 가능합니다.
