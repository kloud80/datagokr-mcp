summary_user: 경상북도 고령군 관내 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 업소명·지번주소·도로명주소·우편번호·지정일자를 담는다(CSV 약 27KB). 고령군에서 어느 동네에 담배 판매점이 몰려 있는지, 특정 업소가 언제 소매인으로 지정됐는지를 확인하려는 주민·창업자·행정 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업소명 매칭으로만 잇고, 같은 계열의 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식으로 쓴다.
