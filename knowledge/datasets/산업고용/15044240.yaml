summary_user: 용인시에 등록된 가스사업자를 한 줄에 한 사업자씩 담은 파일 원장으로, 구분·사업종류·법인명(상호)·사업소 소재지·데이터기준일자를 담는다(CSV 약 56KB, 시군구 범위의 개별 주소 단위). 주민이나 사업자가 '우리 동네 근처에 LPG 판매나 고압가스 사업소가 어디에 있는가', 분석가가 '용인시 가스사업자가 사업 종류별로 어떻게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명이나 소재지 주소로 맞추거나, LOCALDATA 에너지 업종 인허가 원장 같은 데이터와 이름 기준으로 대조해 이어 쓴다.
limits: 용인시 한 곳만 다루므로 다른 시군과의 비교에는 다른 기관 자료가 필요하다. 사업자번호나 행정코드 같은 공통 키가 없어 다른 데이터와 연결할 때 이름·주소 매칭 오차를 감안해야 한다.
