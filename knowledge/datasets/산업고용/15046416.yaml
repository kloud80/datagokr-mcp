description_portal: '○ 통계개요* 통계명 : 산업별 취업자* 통계종류 : 경제활동참가자 중 취업자 현황을 산업별로 제공하는 지정ㆍ표본통계* 작성목적 : 국민의 경제활동 즉 국민의 취업, 실업 등과 같은 경제적 특성을 조사하여거시 경제분석과 인력자원의 개발정책 수립에 필요한 기초자료인 노동공급,고용구조, 가용노동시간 및 인력자원 활용정도를 제공하고 정부의 고용정책입안 및 평가에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사담당자 → 지방통계청(사무소) → 통계청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 서울시 경제활동참가자 중 취업자의 산업별, 성별 현황○ 용어설명* 산업 : 산업이란 조사대상 주간 중 취업자가 속한 사업체의 주된 경제활동을 의미함* 산업별 :- 전기·운수·통신·금융 = 전기,가스,증기 및 수도사업(D) + 운수업(H) + 출판,영상,방송통신 및 정보서비스업(J) + 금융 및 보험업(K)- 사업·개인·공공서비스 및 기타 = 하수·폐기물처리,원료재생 및 환경복원업(E) +부동산업 및 임대업(L) + 전문,과학 및 기술서비스업(M) + 사업시설관리 및사업지원 서비스업(N) + 공공행정,국방 및 사회보장행정(O)+교육서비스업(P) +보건업 및 사회복지서비스업(Q) + 예술,스포츠 및 여가관련 서비스업(R) +협회 및 단체, 수리 및 기타 개인서비스업(S) + 가구내 고용활동 및 달리 분류되지않은 자가소비 생산활동(T) + 국제 및 외국기관(U)○ 기 타* 한국표준산업분류 10차개정(2017년) 기준* 통계수치는 십단위에서 반올림되었으므로 전체 수치와 표내의 합계가 일치되지 않는경우도 있을 수 있음* 2015년 인구총조사(등록센서스) 결과를 토대로 소급작성된 추계인구의 변경을 반영하여2018년 1월에 2000년 7월 ~ 2017년 12월까지의 자료를 변경 하였음* 2014년 이후는 성별자료가 있으나 이전자료는 통계청의 요구 또는 자료구축이 안될 수있음○ 출 처 : 통계청 사'
