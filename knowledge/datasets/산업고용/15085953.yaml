description_portal: 'ㅇ 에너지이용합리화법 제22조에 따른 2012년부터의 고효율에너지기자재(22개 품목)의 인증 통계 현황ㅇ 고효율에너지기자재 인증 제도는 에너지 효율이 우수한 기자재의 생산 및 보급을 촉진하여, 불필요한 에너지 낭비를 줄이고 국가 전체의 에너지 절약과 온실가스 감축에 기여하는 데 핵심적인 역할을 합니다. 이 데이터셋은 각 품목별, 연도별 등 인증된 고효율 제품의 현황을 수치로 제시함으로써, 정부와 관련 기관이 에너지 효율 정책의 효과성을 평가하고, 향후 시장 동향을 예측하며, 효율 개선 목표를 설정하는 데 필수적인 근거 자료를 제공합니다.ㅇ 제공 항목 : 산업및건물용가스보일러, 펌프, 원심식 및 스크류 냉동기, 무정전전원장치, 인버터, 직화흡수식 냉온수기, 원심식 송풍기, 터보압축기, LED유도등, 항온항습기, 고기밀성 단열문, 가스히트펌프, 전력저장자치(ESS), 최대수요전력제어장치, 문자간판용LED모듈, 냉방용 창유리필름, 가스진공온수보일러, 중온수 흡수식 냉동기, 전기자동차 충전장치, 등기구, LED램프, 스마트LED 조명시스템'
