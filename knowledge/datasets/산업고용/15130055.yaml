summary_user: 한국가스공사가 지분을 가진 해외사업 출자회사별로 연도마다 자산총액·부채총액·매출액·당기순이익(백만원 단위)과 공사지분율, 연결·지분법 구분, 종속·공동·관계기업 구분을 담은 집계 파일이다(약 11KB CSV). 재무분석가나 감사기관이 특정 해외 가스사업 출자회사가 해마다 이익을 내는지, 부채가 자산 대비 얼마나 큰지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 출자회사명·사업명을 이름으로 맞추거나 같은 기관(한국가스공사) 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 한국가스공사 해외사업 출자회사의 재무현황 정보를 제공합니다. 해외 출자회사의 재무 투명성 확보와 사업성과 공개를 목적으로 수집되었습니다. 데이터의 세부 항목으로는 출자회사명, 자산, 부채, 매출액, 당기순이익, 출자비율, 연결대상 여부, 지분법 적용 여부 등이 포함되어 있습니다. 본 데이터는 해외사업 투자자, 재무분석가, 에너지정책 연구기관, 감사기관, 주주, 기획재정부가 출자회사 평가 및 사업계획 검토에 활용할 수 있습니다. 공공기관 해외투자의 투명성 향상과 출자회사 경영관리 강화에 기여할 것으로 기대됩니다.
