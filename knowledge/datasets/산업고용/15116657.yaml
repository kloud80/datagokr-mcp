summary_user: 구로구 동물판매업(반려동물 판매) 업소의 인허가 원장으로, 업소별로 인허가일자·영업상태·폐업일자·소재지 주소·사업장명·중부원점TM 좌표(XCRD·YCRD)를 건별로 담는다. 주민이나 분석가가 '구로구에서 현재 영업 중인 반려동물 판매업소는 어디이고 언제 인허가를 받았나'를 확인하거나, 구청이 무허가·폐업 업소를 점검할 때 쓴다. 전역 조인 키는 없어서, 다른 지자체의 같은 LOCALDATA 인허가 데이터와는 기관코드(OGDP_INST_CD)·관리번호로 묶고, 상가·상권 데이터와는 주소나 사업장명을 맞춰 잇는다.
description_portal: 동물판매업 인허가 정보는 구로구에서 반려동물 판매를 수행하는 업소의 인허가일자, 영업상태명, 소재지주소, 업종분류 등 동물복지 및 판매기준 준수를 확인하기 위한 행정정보로 구성된 자료이다. 동물판매업은 생명체를 취급하는 업종으로 법적 관리·감독이 엄격히 요구되므로, 이 데이터는 동물학대 방지, 유통 투명성 확보, 소비자 보호 정책의 핵심 자료로 활용된다. 자료는 중부원점TM(EPSG:2097) 좌표계로 위치가 제공되고, 위경도 좌표는 제공되지 않으며, GIS 활용 시 좌표 변환을 요구한다. 또한 3일 전 최신 자료 제공 방식은 불법 영업 단속, 유통 관리, 민원 대응에 매우 유용하다.
