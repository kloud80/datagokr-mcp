description_portal: 'ㅁ 전력시장 개요한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅁ 석탄발전제상한제: 국가 온실가스 감축목표 달성을 위해 석탄의 발전량을 물리적으로 제한하는 제도 ㅇ (배경) : 발전부문 온실가스 감축 목표 달성을 위해, 전원별 발전량 상한 설정을 통한 직접적 규제 방안 도입 추진   * 3차 국가 배출권 할당계획(안)("20.9월) 및 제9차 전력수급기본계획 ("20.12월)ㅇ (내용) : 전면 석탄상한제 도입("22.上)을 위한 사전 시범사업으로 전환 부문 온실가스 감축을 위해 자발적 석탄상한제 한시적 선제 도입 - 발전공기업 대상 매년 4~11월에 대한 자발적 석탄상한제 시행 ("21.4) - "22년 이후 LNG 가격 급등에 따라 수급안정을 위해 완화하여 운영해오다 "24년 단일BM 제도가 도입됨에 따라 자발적 석탄상한제 종료ㅁ (감축입찰 실적) 자발적 석탄상한제에 따른 석탄 감축 입찰 실적※ 단위 : MWh'
