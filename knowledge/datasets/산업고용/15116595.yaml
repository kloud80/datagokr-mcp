summary_user: 한국산업안전보건공단이 제·개정한 기술지원규정(KOSHA GUIDE)을 지침 한 건당 한 행으로 담은 목록 파일로, 전국 대상이며 위원회(분야)·분류기호와 분류내용·지침번호·명칭·등록일·년도를 담는다. 사업장 안전보건 담당자나 컨설턴트가 '우리 공정(기계·화공·건설·보건 등)에 참고할 안전보건 기술지침이 무엇이고 언제 등록됐는가'를 찾을 때 쓴다. 지침번호(kosha_guide_no)를 키로 지침 원문이나 재해사례·위험성평가 자료 등 같은 번호를 인용하는 자료와 이어 쓴다.
description_portal: '한국산업안전보건공단에서 제공하는 기술지원규정(KOSHA GUIDE) 목록으로 분야, 지침번호, 명칭, 등록일, 분류내용을 확인하실 수 있습니다.- 기술지원규정은 산업안전보건법령에서 정한 최소한의 수준이 아니라, 사업장의 자기규율 예방체계 확립을 지원하고, 좀 더 높은 수준의 안전보건 향상을 위해 참고할 수 있는 기술적 내용을 기술한 자율적 안전보건가이드입니다.- 기술지원규정은 산업안전보건법과 같은 강제적인 법률이 아닌 권고 기술수준으로써 한국산업안전공단에 의해서 제·개정되고 있는 지침입니다.- 기술지원규정은 사업장의 안전·보건을 확보하기 위하여 위험설비 공정, 작업에 대한 선진 각국의 기술수준 및 국제표준을 참고하여 우리나라 실정에 맞게 일반, 기계, 화공, 건설, 보건 등 전문분야별로 세분화하여 안전보건기술지침(기술지원규정)으로 제정 공표하여 사업장에 보급 활용되고 있습니다.- 기술지원규정의 법적효력 : 기술지원규정은 법적 기준이 아닌 사업장의 이해를 돕기 위해 작성된 기술적 권고 지침으로써, 법적 구속력(효력)은 없습니다.'
