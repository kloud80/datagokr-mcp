summary_user: 서울시 전체를 대상으로 공공기관·은행·병원·약국·학교·대학·백화점·슈퍼마켓·극장·숙박시설·공항·철도역·버스터미널·지하철역·버스정류장 같은 집객시설의 개수를 기준 분기(STDR_YYQU_CD)별로 담은 집계 데이터이며, 실측 범위는 시도 단위입니다. 상권 분석가나 창업 준비자가 '서울의 지하철역·버스정류장·병원 수가 분기마다 어떻게 변했나'처럼 유동인구를 끌어들이는 기반시설 규모의 추이를 볼 때 쓴다. 전역 조인 키는 없고, 기준 분기 코드와 시도 코드·이름(MEGA_CD)을 맞춰 같은 기관의 서울시 상권분석서비스 다른 데이터(점포·매출 등)와 이어 쓴다.
description_portal: 이 데이터는 서울시 전체를 대상으로 공공기관, 금융기관, 의료시설, 교육시설, 교통시설 등 주요 기반 시설 현황을 분기별로 제공합니다. 공공기관(시·구청 등)과 은행, 종합병원 및 일반병원, 약국, 유치원·초중고교·대학교와 같은 교육시설, 영화관·공연장과 같은 문화시설, 숙박시설, 공항·철도·버스터미널, 지하철역, 버스정류장 등 다양한 생활 기반 인프라의 개수를 확인할 수 있습니다. 이를 통해 시민 생활과 밀접한 편의시설의 분포를 분석하고, 도시 계획 수립, 교통 정책 개선, 의료·교육 인프라 확충 등 다양한 공공 정책에 활용할 수 있습니다. 또한 지역별 비교 분석을 통해 생활 접근성과 도시 경쟁력을 평가하는 데에도 중요한 기초자료로 활용됩니다.
