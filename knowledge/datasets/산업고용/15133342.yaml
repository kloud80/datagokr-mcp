summary_user: 수소유통정보시스템(하잉)으로 모은 전국 수소충전소별 판매단가와 할인 여부·할인 상세 내용을 충전소 한 곳당 한 행으로 담은 파일(CSV, 약 18KB)이다. 수소차 운전자나 분석가가 "어느 충전소가 수소를 얼마에 팔고 할인을 하는지", "지역·충전소 간 수소 가격 차이가 얼마인지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 충전소 데이터와는 충전소 관리번호나 충전소명으로 맞춰 이어야 하며, 같은 기관의 코드 체계를 쓰는 데이터와만 직접 연결된다.
