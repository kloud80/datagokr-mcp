summary_user: 포천시 관내에 등록된 대부업체를 업체 한 곳당 한 줄로 담은 원천 목록으로, 등록 사업 종류·등록증번호·상호·도로명 소재지·등록일자를 담는다(CSV 751바이트의 작은 파일). 포천시에 등록된 대부업체가 어디에 있고 언제 등록됐는지, 특정 상호가 정식 등록업체인지 확인하려는 주민·분석가가 쓴다. 전역 조인 키가 없어 소재지 도로명주소나 상호를 기준으로 주소 정제·좌표 변환을 거쳐 행정구역·상권 데이터나 다른 지역의 LOCALDATA 인허가 데이터와 맞춰 쓴다.
description_portal: 경기도 포천시에서 제공하는 대부업 현황 데이터입니다. 본 데이터는 포천시 관내에 등록된 대부업체의 기본 정보를 제공하는 자료로, 등록사업, 등록증번호, 상호, 대표자, 소재지도로명주소, 등록일자 등의 항목으로 구성되어 있습니다. 이를 통해 등록 대부업체의 현황과 분포를 확인할 수 있으며, 지역 금융업 현황 분석, 등록업체 관리, 소비자 보호 및 금융 관련 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 소재지 도로명주소를 기반으로 행정구역, 지역경제, 상권 등 다양한 공공데이터와 연계·분석이 가능하여 지역 금융서비스 현황 분석에 활용할 수 있는 공공데이터입니다. 본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
