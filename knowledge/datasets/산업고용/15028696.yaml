summary_user: 인천광역시 서해구(포털 설명상 서구)에 있는 행정사 사무소를 한 곳씩 담은 목록으로, 신고연월일·사무소명·소재지·전화번호를 사무소별로 제공한다(csv 약 6.5KB의 소규모 파일). 주민이 "우리 동네에서 가까운 행정사 사무소는 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 구 내 행정사 사무소의 분포와 신고 시기를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 소재지 주소나 사무소명을 맞춰 연결하거나, 같은 기관이 낸 다른 업종 인허가(LOCALDATA) 목록과 나란히 놓고 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구에 소재한 행정사 사무소의 현황울 정리한 데이터입니다. 본 공공데이터는 인천광역시 서구에 위치한 행정사사무소의 신고연월일, 사무소명, 소재지, 전화번호 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 주민들은 지역 내 행정사사무소의 위치 및 분포를 손쉽게 파악할 수 있어, 기술행정 등 행정업무서비스를 이용하는데에 편의성을 제공할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
