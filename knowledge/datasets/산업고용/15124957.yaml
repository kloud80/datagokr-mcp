summary_user: 경기도 행정구역(동 단위까지) 별로 기준년도·분기마다 운영 중인 점포와 폐업한 점포의 평균 영업기간, 그리고 상권변화지표 구분(정체·상권축소·다이나믹 등)을 담은 집계 데이터다. 창업 예정자나 지역경제 분석가가 '우리 동네 상권이 축소 중인지, 점포가 오래 버티는 안정 상권인지'를 확인하는 데 쓴다. 전역 조인 키는 없어 행정구역코드(admzone_cd)나 행정구역명을 매핑해 상가업소 원장 등 다른 상권 데이터와 이어 붙여야 한다.
description_portal: 이 데이터는 경기도 내 행정구역 단위의 상권 변화 추이를 파악할 수 있는 자료로, 기준년도, 기준분기, 행정구역코드, 행정구역명, 운영 중인 점포의 평균 영업기간, 폐업한 점포의 평균 영업기간, 상권변동지표구분 및 그 명칭(정체, 상권축소, 다이나믹 등)으로 구성되어 있습니다. 상권의 안정성, 축소 또는 변화 추이를 파악할 수 있는 핵심 지표들이 포함되어 있으며, 시군구 내 동 단위까지의 세분화된 공간 정보를 바탕으로 지역경제의 상권 활력도를 분석할 수 있습니다. 이 데이터는 상권 밀도 분석, 창업 입지 선정, 정책 기반 지역경제 진단, 상권 안정성 예측 모델 구축 등 다양한 분석 및 정책수립 자료로 활용될 수 있습니다.
