summary_user: 대구광역시 남구 관내 담배소매인 지정 업소를 건별로 담은 파일로, 관리번호·민원구분·업소명·지번/도로명 주소·지정일자·영업구분을 업소 단위로 제공한다(CSV 약 54KB). 남구에서 담배소매인 지정을 신청하려는 사업자가 예정 영업소 주변에 기존 소매인이 있는지, 영업소 간 거리 기준(50미터 이상)을 맞출 수 있는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 매칭으로 이어야 하며, 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 방식이 현실적이다.
description_portal: '대구광역시 남구 관내에 담배소매인 지정을 신청하려는 자에게 대구 남구 담배소매인 지정규칙을 준수할 수 있도록담배소매인 지정현황에 대한 데이터로 관리번호, 민원구분, 업소명, 업소지번·도로명주소, 지정일자, 영업구분 등의 정보를 제공합니다. *참고 : 대구 남구 담배소매인 지정규칙 제4조(소매인의 지정기준 등) ① 시행규칙 제7조의3제2항에 따라 소매인 영업소 간 거리는 50미터 이상으로 일정하게 유지하여야 한다.최신파일을 원하시는 분은 남구청 홈페이지(https://nam.daegu.kr)에서 확인하시기 바랍니다.'
