summary_user: 전국에서 온누리상품권을 쓸 수 있는 가맹점을 한 곳씩 담은 건별 목록으로, 가맹점명·소속 시장(상점가)명·소재지 주소·취급품목·지류형/디지털형 가맹 여부·가맹 등록년도를 담는다(CSV 약 17MB). 소비자가 "우리 동네 어느 시장 가게에서 모바일 온누리상품권을 쓸 수 있나"를 찾거나, 분석가가 지역별 가맹점 분포로 전통시장 상권 현황을 비교하는 데 쓴다. 전역 조인 키(사업자번호·시장 코드 등)는 없어서, 상가업소·전통시장 데이터와는 시장명이나 소재지 주소를 이름·주소 매칭으로 이어 써야 한다.
description_portal: 전국 온누리상품권 가맹점 현황은 전국에서 온누리상품권을 사용할 수 있는 가맹점에 대한 정보로, 가맹점명, 소속 시장명, 소재지, 취급 품목, 충전식카드/지류/모바일 취급 여부 등 다양한 항목이 포함되어 있습니다. 온누리상품권의 실제 사용처를 확인할 수 있어, 소비자의 구매 편의성 확보 측면에서 유용합니다. 또한 가맹점의 분포 현황을 통해 지역 상권 활성화 정도를 분석할 수 있으며, 정책적 지원 대상을 선정하는 데에도 참고자료로 활용할 수 있습니다. 향후 유사 사례 발굴 및 정책 설계의 참고 자료로도 활용될 수 있습니다.
