summary_user: 부산광역시 동래구 관내에 등록된 대부업체를 업체 한 곳당 한 줄로 담은 등록 현황 파일로, 등록번호·상호·소재지주소·사업내용·전화번호를 제공하는 4KB 남짓의 작은 CSV입니다. 동래구 주민이나 분석가가 '거래하려는 대부업체가 구에 정식 등록된 곳인가', '동래구 안 어디에 대부업체가 모여 있는가'를 확인할 때 씁니다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 상호·주소 문자열 매칭이나 지방행정 인허가(LOCALDATA) 대부업 원장과의 대조로만 이어 씁니다.
description_portal: 부산광역시 동래구에 소재한 대부업 등록 현황에 대한 데이터로 등록번호, 상호, 소재지주소, 사업내용  전화번호  항목을 제공합니다.데이터 항목 설명  1.등록번호2.상호3.소재지주소4.사업내용5.전화번호본 파일 데이터는 부산광역시 동래구 관내 소재 대부업 등록 현황 업체의 사정에 따라 데이터 항목이 변경되거나 삭제될 수 있으니,이에 유의해 주시기 바랍니다.사정 상 직접 확인이 어려우신 경우에는 부산광역시 동래구 일자리경제과 담당자(☎ 051 550 4917)에게 직접 문의 전화를 주시면 친절히 안내해 드리겠습니다.대단히 감사합니다.
