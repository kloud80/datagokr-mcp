summary_user: 한국서부발전이 운영하는 전남 화순풍력발전소의 SCADA 기록을 1시간 단위·발전 호기별로 담은 파일 데이터(CSV 약 79MB)로, 나셀 풍속과 계통 유효 전력 같은 실측값에 주소·위경도(십진수)와 제조사·발전용량·허브높이·로터직경·발전기 모델명 같은 터빈 제원이 함께 들어 있다. 풍력 분석가나 연구자가 "이 터빈은 풍속별로 실제 출력이 얼마나 나오며, 어느 시간대에 출력이 비정상적으로 낮았는가"를 따지거나 발전량 예측·이상 탐지 모델의 학습 데이터로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전단지명·주소·위경도 같은 이름·좌표 매칭으로만 이어 쓰며, 같은 위치의 기상 관측 자료나 발전소 원장류와 좌표로 맞춰 붙이는 방식이 현실적이다.
description_portal: 본 데이터는 한국서부발전에서 운영 중인 전남 화순풍력발전소의 SCADA(감시 제어 및 데이터 취득) 시스템을 통해 수집된 1시간 단위의 정밀 발전 정보입니다.주요 내용으로 시간대별·발전 호기별 나셀 풍속과 계통 유효 전력 등 실시간 발전 성능 데이터를 제공하며, 이와 함께 발전소의 정확한 위치(주소, 위경도) 및 제조사, 발전용량, 허브 높이, 로터 직경, 발전기 모델명 등 터빈의 상세 하드웨어 제원 정보를 포함하고 있습니다.위·경도 정보는 도분초(DMS) 방식이 아닌 십진수(Decimal Degrees) 데이터로 제공됩니다.본 데이터는 풍속에 따른 발전 효율 분석, 전력 생산량 예측 모델 개발, 신재생 에너지 설비 운영 최적화 연구 및 AI 기반의 이상 징후 탐지 학습 데이터로 활용하기에 적합하도록 구성되었습니다.
