summary_user: 제주국제자유도시개발센터(JDC)가 2012~2014년에 게시한 옥외광고를 건별로 담은 작은 파일(약 1.7KB CSV)로, 연도 구분·광고명·광고사·게시 시작일과 종료일을 기록한다. JDC 시설에 어떤 광고사가 어떤 광고를 언제부터 언제까지 걸었는지, 연도·시즌별로 광고가 몰린 시기가 언제인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 광고사 이름 매칭이나 같은 기관 자료로만 이어 쓴다.
