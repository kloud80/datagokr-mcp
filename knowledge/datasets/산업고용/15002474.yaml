description_portal: '제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)가 2012년부터 2014년까지 게시한 옥외광고 현황정보입니다. 이 데이터는 각 옥외광고의 구분, 광고명, 광고사, 게시 시작일, 게시 종료일 등으로 구성되어 있으며, 구분 항목에는 해당 연도(예: 2012년)가 명시되어 있습니다. 게시 시작일과 종료일은 연월일 형태로 기록되어 있어, 예를 들어 ‘2012.12.1’과 같이 구체적인 날짜 단위까지 확인할 수 있습니다. 시즌 단위로 진행된 옥외광고의 경우에는 해당 연도와 함께 시즌 시작일과 종료일이 함께 표시되어 있어 기간별 광고 게시 현황을 명확하게 파악할 수 있도록 되어 있습니다. 이 자료는 제주 지역 내 광고 집행 현황과 기간별 집중도, 광고사별 운영 현황 등을 분석하는 데 유용하며, 옥외광고 효과 평가 및 향후 광고 전략 수립에 활용될 수 있는 중요한 기초 자료로 활용됩니다.'
