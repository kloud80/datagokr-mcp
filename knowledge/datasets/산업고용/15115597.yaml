summary_user: 서울 양천구 관내 PC방 등 인터넷컴퓨터게임시설제공업소를 업소별 한 건씩 담은 인허가 원장으로, 인허가·취소·폐업일자, 영업상태, 소재지 주소, 좌표, 시설면적, 층수, 주변환경, 건물용도 등을 담는다. 창업 예정자가 양천구에서 영업 중인 PC방이 어디에 몇 곳 있는지, 최근 폐업한 곳은 어디인지 확인하거나, 분석가가 게임시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(지번·도로명)나 좌표(X, Y), 업소명으로 매핑하거나, 같은 LOCALDATA 체계의 다른 업종 인허가 데이터와 관리번호(MGTNO)·자치단체 코드 기준으로 맞춰 이어 쓴다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 인터넷컴퓨터게임시설제공업체의 인허가 현황을 종합적으로 관리하기 위해 수집된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 사업자구분, 총층수, 주변환경, 시설면적, 건물용도 등 핵심 항목이 포함되어 있어 각 사업장의 설립 및 운영 실태를 체계적으로 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관에서 인터넷컴퓨터게임시설제공업체 관리, 감독, 정책 수립, 안전 점검 등에 활용할 수 있으며, 연구자와 시민은 지역별 게임시설 분포 및 서비스 유형 분석 등 다양한 목적으로 이용할 수 있는 신뢰성 있는 정보 자원이다.* 인터넷컴퓨터게임시설제공업 - PC방과 같이 컴퓨터 등 게임물을 이용하는데 필요한 기자재를 갖추거나 그 밖의 정보제공물을 이용할 수 있도록 제공하는 업소정보
