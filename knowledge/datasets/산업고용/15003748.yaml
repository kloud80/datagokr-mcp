summary_user: 한국중부발전(주) 각 사업소가 체결한 입찰 계약을 건별로 담은 원천 파일로, 사업소·계약명·계약일자·계약금액(원)·조달방법을 기록하며 포털 설명상 2020년부터 2025년 2월까지의 계약을 포함한다. 조달 분석가나 입찰 참여를 검토하는 사업자가 '어느 사업소가 어떤 조달방법으로 얼마 규모의 계약을 주로 맺는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소 이름이나 계약명 같은 텍스트 매핑, 또는 같은 기관 기준으로만 이어 쓸 수 있다.
description_portal: '본 입찰 정보 데이터는 한국중부발전(주)의 각 사업소에서 체결한 입찰 계약 현황을 정리한 자료로, 구분, 일련번호, 사업소, 계약명, 계약일자, 계약금액(단위: 원), 조달방법 등의 항목으로 구성되어 있습니다. 데이터는 2020년부터 2025년 2월까지의 계약 건을 포함하며, 계약일자를 통해 시점별 세부 내용을 파악할 수 있습니다. 이 데이터는 공공계약 집행 내역의 투명성 확보, 계약 건별 금액 및 조달 유형 비교, 사업소별 조달 패턴 분석 등에 활용될 수 있으며, 기관의 조달정책 이행 실태와 계약 규모 추이를 확인하는 데에도 유용합니다'
