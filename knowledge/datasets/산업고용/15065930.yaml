description_portal: 한국가스공사의 월간 민수용 도시가스 판매량 가중평균 전국 기온 데이터 입니다.민수용 도시가스 수요예측에 적합한 기온 데이터 제공 및 수요분석 지원, 난방수요 분석을 목적으로 수집되었습니다. 데이터 구성항목은 일자와 민수용 도시가스 판매량 기준 전국 가중평균 기온으로 이루어져 있습니다. 통계청 시군 단위 기온데이터를 주요 5개 광역시의 민수용 도시가스 공급량으로 가중평균하여 산출한 데이터입니다. 본 데이터를 활용하면 기온과 민수용 수요의 상관관계 분석, 민수용 수요예측 모델 개발, 난방수요 패턴 분석, 기온 변화에 따른 가정용 수요 변동 예측, 동절기 수요 분석이 가능합니다. 또한 민수용 공급계획 수립, 동절기 피크 수요 예측, 난방용 수요 관리에 활용됩니다. 민수용 도시가스 수요예측의 정확도 향상에 기초자료로 활용되어 안정적인 공급을 지원합니다.
