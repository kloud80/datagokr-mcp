summary_user: 통계청 시군 단위 기온을 주요 5개 광역시의 민수용 도시가스 공급량으로 가중평균한 전국 단일 기온을 월 단위(일자·기온 두 항목)로 담은 집계 파일이다. 가스 공급사나 에너지 분석가가 "이번 겨울 기온이 평년보다 낮으면 가정용 도시가스 수요가 얼마나 늘까"처럼 기온과 민수용 수요의 관계를 분석하거나 수요예측 모델을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 월별 도시가스 판매량 같은 다른 시계열과는 일자(연월)를 맞춰 이어 쓴다.
