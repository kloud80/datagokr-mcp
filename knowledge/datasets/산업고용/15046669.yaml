description_portal: '○ 통계개요* 통계명 : 중소기업·소상공인 사업체수* 통계종류 : 서울시 중소기업·소상공인 사업체 현황을 제공하는 지정·조사통계* 작성목적 : 서울시에 등록된 종사자1인 이상의 사업체 및 종사자 현황을 파악하여,산업활동과 관련된 각종 정책의 수립 및 평가, 기업의 경영계획 수립 및학계, 연구소 등의 학술연구를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울시 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 ? 서울시 중소기업·소상공인, 대기업 사업체수 및 종사자수○ 용어설명* 중소기업 : 중소기업기본법 제2조 및 같은 법 시행령 제3조에 따라 영리를 목적으로사업을 영위하는 기업(상법상 회사 및 법인이 아닌 개인사업자)으로 규모기준 및독립성 기준을 모두 충족해야 중소기업* 소상공인 : 중소기업기본법 제2조제2항의 규정에 의한 소기업 중 상시근로자 10인미만의사업자로서 업종별 상시근로자수 등이 대통령령이 정하는 기준에 해당하는 자* 대기업 : 중소기업 외* "15년부터 중소기업 기준 변경(종사자=>매출액)됐으므로, "14년 이전 자료와 비교 시 주의 필요함* 중소기업은 중기업과 소기업(업종별 평균매출액이 10~120억원 이하인 기업)으로 다시 구분됨* 소상공인은 소기업 중 상시근로자가 10인 미만(광업, 제조업, 건설업, 운수업) 또는 5인 미만(기타업종)인 기업을 의미함'
