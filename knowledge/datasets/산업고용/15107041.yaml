description_portal: 'KGS CODE는 가스관계 법령에서 정한 기술적인 사항(시설, 기술 등)을 상세기준으로 정하여 코드화 한 것으로 가스기술 기준위원회에서 심의, 의결 후 산업통상자원부에서 승인한 가스안전 분야의 기술 기준입니다. 코드는 5개 분야(공통, 고압가스, LP가스, 도시가스, 수소)로 구분되어 제공하고 있습니다.해당 데이터는 "수소" 부문으로 개정 현황에 관한 내용(분류, 주요내용, 코드명, 개정일자)을 공개하여 가스 업계 종사자분들에게 도움이 되고자 제공하는 데이터입니다.※ 상세 원문 내용은 가스기술기준정보시스템 홈페이지에서 확인할 수 있습니다.(URL : cyber.kgs.or.kr/kgscode.Index.do)'
