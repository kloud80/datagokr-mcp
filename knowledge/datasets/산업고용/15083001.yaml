summary_user: 한국남부발전 하동·남제주 발전소에서 나온 탈황석고의 반출량(톤)과 판매액(백만원)을 연도별(포털 설명상 월별)로 집계해 담은 작은 CSV 파일(약 3.9KB)이다. 석탄화력 부산물 재활용 연구자나 환경경영 분석가가 '하동과 남제주 발전소의 탈황석고 반출·판매가 해마다 어떻게 달라졌나'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 발전소 이름, 같은 기관 기준으로만 맞춰 이어 써야 한다.
description_portal: 이 데이터는 한국남부발전에서 발전소 운영 과정에서 발생하는 부산물인 탈황석고의 월별 처리 현황을 제공하는 자료입니다. 하동과 남제주 지역 발전소를 중심으로 탈황석고의 반출량(톤)과 판매액(백만원) 정보를 포함하고 있으며, 2013년부터 여러 해에 걸쳐 기록되어 있습니다. 이를 통해 석탄 화력발전의 부산물 관리 현황을 파악할 수 있고, 자원 재활용 및 환경경영 활동의 효과를 분석하는 데 활용할 수 있습니다. 또한 지역별·시기별 차이를 비교하여 자원순환 정책 수립, 친환경 에너지 산업 육성, 지속가능경영 성과 분석 등 다양한 연구와 행정에 기초 자료로 활용될 수 있습니다.
