description_portal: 이 데이터는 자영업자의 고용보험 임의 가입 제도와 관련하여 산업별로 적용 현황을 집계한 통계 자료입니다. 제조업, 도매 및 소매업, 숙박 및 음식점업 등 주요 산업 분류별로 가입자수 합계와 사업장수 합계를 제공하며, 한 해 동안 새롭게 보험이 적용된 신규 적용(가입자, 사업장) 수와 보험 적용이 소멸된 신규 소멸(가입자, 사업장) 수를 1월부터 12월까지 누적 수치로 제공합니다. 이 자료는 고용 안전망이 자영업자 영역으로 확장되는 추이를 명확하게 보여주며, 산업 구조 변화 속에서 자영업자들의 고용보험 가입 및 유지 상태를 파악하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 자영업자를 위한 고용 정책 및 사회보장 연구에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 신규 소멸 비율이 높게 나타나는 특정 산업 분야를 분석함으로써, 해당 업종 자영업자의 사업 안정성이 낮음을 진단하고 맞춤형 창업 지원이나 사업 전환 지원 정책을 수립하는 데 활용할 수 있습니다. 또한, 이 통계를 바탕으로 고용보험 가입이 의무가 아닌 자영업자들의 자발적인 사회보장 수요를 파악하고, 제도의 실효성을 높여 고용 안전망을 강화하는 데 기여할 수 있다고 판단됩니다.
