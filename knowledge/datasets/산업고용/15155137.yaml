summary_user: 전국 자치단체가 관리하는 계량기 수입업 인허가 업소를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 전체 357건이며 인허가일자는 1962-12-06부터 2026-09-15까지 걸쳐 있다. 사업자나 분석가가 계량기 수입·판매 업소가 어디에 있고 영업 중인지 폐업했는지를 확인하는 질문에 쓴다. 지번주소·도로명주소(address 키)와 관리번호(MNG_NO, pnu 키)로 다른 인허가·주소 데이터와 잇고, 좌표(X·Y)로 지도 데이터에 붙인다.
description_portal: '자원환경_계량기수입업 데이터는 계량을 하기 위한 기계·기구 또는 장치를 수입하여 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 계량기수입업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 국가기술표준원 계량측정제도과 / 043-870-5512 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
