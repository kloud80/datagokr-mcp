summary_user: 부산 사상구 관내에 등록된 유료·무료 직업소개소를 사업장 한 곳당 한 행으로 담은 파일(csv, 약 14KB)로, 인허가·폐업·휴업 일자, 영업상태, 주소와 좌표를 포함한다. 구직자나 구인 사업자가 사상구에서 현재 영업 중인 직업소개소가 어디 있는지 확인하거나, 분석가가 관내 소개소의 개업·폐업 추이를 살펴볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 사업장명으로 맞춰 이어야 하며, 다른 시군구의 같은 형식 등록현황과는 열 이름이 같아 그대로 이어 붙여 쓴다.
description_portal: 부산광역시 사상구 관내에 소재하는 유료(무료)직업소개소 등록현황에 관한 데이터임(직업소개란 구인 또는 구직의 신청을 받아 구직자 또는 구인자를 탐색하거나 구직자를 모집하여 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 것으로, 유료직업소개사업은 소개대상이 되는 근로자가 취업하려는 장소를 기준으로 하여 국내 유료직업소개사업과 국외 유료직업소개사업으로 구분하되, 국내 유료직업소개사업을 하려는 자는 주된 사업소의 소재지를 관할하는 특별자치도지사ㆍ시장ㆍ군수 및 구청장에게 등록하여야 하고, 국외 유료직업소개사업을 하려는 자는 고용노동부장관에게 등록하여야 한다.)
