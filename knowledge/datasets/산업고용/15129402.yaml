description_portal: '본 데이터는 한국산업기술진흥원에서 통합사업 관리를 위해 구축된 산업기술개발 관련 연구장비 도입 정보를 포함하고 있습니다. 이는 다양한 산업 분야에서 연구개발을 지원하고 혁신을 촉진하는 데 기여하기 위해 설계된 데이터입니다. 이 데이터는 구축된 장비명과 그 장비의 사용 용도, 활용 건수 등을 기록하고 있으며, 연구자나 기업들이 장비를 효과적으로 활용할 수 있도록 돕습니다. 이러한 정보를 통해 연구개발 활동의 효율을 높이고, 산업계에서의 기술 진흥을 도모할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 순번(숫자형), 성과발생년도(숫자형), 기반구축순번(숫자형), 장비명(문자형), 활용건수(숫자형), 등록일시(문자형), 장비검색여부(문자형)입니다. 이 데이터를 활용하여 연구개발 과정에서 필요한 장비를 보다 쉽게 찾아보고, 기회를 포착할 수 있으며, 연구 결과 및 성과를 분석하는 데 유용하게 사용될 수 있습니다.'
