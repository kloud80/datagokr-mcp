summary_user: 경기도 내 건축사사무소의 신고·등록 정보를 사무소 한 곳당 한 행으로 담으며, 시군명, 신고구분(개인·법인), 사무소명, 대표자명, 도로명·지번 주소, 우편번호, WGS84 위도·경도, 데이터 기준일자를 포함한다. 건축주나 사업자가 '우리 시군에 등록된 건축사사무소가 어디에 몇 곳 있는가'를 찾거나, 분석가가 시군별 건축서비스 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD) 매핑이나 주소·좌표 기반 공간 결합으로 잇고, 같은 LOCALDATA 계열 업종 인허가 데이터와 나란히 비교하는 용도에 맞다.
description_portal: 건축사사무소 현황 데이터는 경기도 내 운영 중인 건축사사무소의 신고 및 등록 정보를 포함하고 있으며, 시군명, 신고번호, 신고일자, 신고구분(개인·법인), 사무소명, 소재지 주소(도로명·지번), 우편번호, 대표자명, WGS84 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 이 데이터는 건축서비스 제공 기관의 분포를 지역별로 파악할 수 있도록 하며, 건축사사무소의 설립 시기 및 운영 현황을 분석하는 데 유용합니다. 또한 도로명주소와 지번주소가 함께 제공되어 행정적·지리적 분석 모두 가능하며, 위치 좌표를 활용해 GIS 기반 공간분석에도 활용할 수 있습니다. 본 데이터는 건축산업 정책 수립, 지역별 건축 서비스 접근성 연구, 건축 관련 종사자 분포 파악 등 다양한 분야에서 기초자료로 사용될 수 있습니다.
