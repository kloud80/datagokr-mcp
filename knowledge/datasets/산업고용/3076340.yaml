summary_user: 광주광역시에 있는 환경 측정대행업체를 업체 한 곳당 한 행으로 담은 작은 현황 파일(CSV 약 1.6KB)로, 업체명·도로명 소재지·전화번호와 대기·수질·소음진동·실내공기질·악취 분야별 등록 여부를 담는다. 배출시설을 운영하는 사업자가 대기나 수질 자가측정을 맡길 광주 지역 대행업체를 분야별로 찾고 연락처를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업체명이나 도로명주소로 직접 맞춰 연결해야 한다.
description_portal: 광주광역시 내에 소재하는 측정대행업체 현황입니다.측정대행업체는 환경 관련 법령에 따라 사업장 등에서 발생하는 대기오염물질, 수질오염물질, 소음, 진동, 악취 등을 전문적으로 측정해주는 업체입니다. 일반적으로 환경오염물질의 배출허용기준을 초과하지 않도록 정기적으로 측정하고, 그 결과를 관련 기관에 보고하는 업무를 수행합니다.ㅁ결과 분석 및 보고서 작성 - 측정 데이터를 분석하여 관련 법 기준에 적합 여부 판단ㅁ측정 결과는 환경청 또는 지자체 등에 보고 - 환경기술 자문 - 오염물질 배출을 줄이기 위한 개선방안 제시 - 환경 인허가 관련 상담
