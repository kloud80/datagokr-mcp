description_portal: '전북특별자치도 전주시 내 지역경제 관련단체를 제공하며  단체명, 도로명주소, 지번주소, 위도,경도, 개설일 등을 제공합니다.담당부서 : 일자리청년정책과전주시 지역경제 관련단체 데이터는 지역 내 경제 활성화와 산업 발전을 위해 활동하는 각종 단체들의 현황을 보여주는 공공데이터입니다.이 데이터는 전주시의 지역경제 네트워크와 지원 체계를 보여주는 중요한 기초자료입니다.활용 포인트전주시 내 경제 관련 단체 분포 현황을 파악 가능단체별 활동분야를 통해 지역경제 지원 구조 분석정책 담당자는 지역경제 활성화 및 기업 지원 정책 수립에 활용시민과 기업은 관련 단체 연락처 및 위치 정보를 통해 협력 기회 확보'
