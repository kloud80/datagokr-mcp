description_portal: 한국전력공사에서 제공하는 전국 시군구별 계약종별 전력사용량 데이터 입니다.사용자가 원하는 정보를 직접 설정하여 추출할 수 있습니다. 행정구역, 기간, 추출정보를 설정하여 고객호수, 사용량, 전기요금, 평균 판매단가 데이터를 제공받을 수 있습니다.기본적으로 조회는 가능하나 다운로드시에는 회원가입 및 로그인이 필요한 서비스 입니다.특정 시기의 산업용 전력 사용량 변화를 분석하여 경기 변동을 파악하거나, 주택용 전력 사용량을 지역별로 비교하여 가구 소비 특성의 차이를 연구하는 등 관련 활동에 기초자료로 활용할 수 있습니다.장기간의 시계열 정보를 포함하고 있어 과거 에너지 정책이 각 부문별 전력 소비에 미친 영향을 파악하고 미래전력 수요를 예측하는 모델을 구축하는 등의 연구에 도움을 줄 수 있습니다.
