summary_user: 경기도 화성시 관내 여행업체(국내·국외·종합여행업)를 업체 한 곳당 한 행으로 업종, 상호, 도로명·지번 주소, 기준일자와 함께 담은 시군구 단위 목록 파일이다. 화성시에서 어떤 여행사가 어느 동네에 있는지, 종합여행업 등록 업체가 몇 곳인지 확인하려는 주민·관광 사업자·지역 관광정책 담당자가 쓴다. 전역 조인 키(사업자번호·인허가 코드 등)가 없어 다른 데이터와는 상호명이나 주소 문자열 매칭으로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 여행업 원장과 대조할 때도 같은 방식이다.
limits: 사업자번호·좌표 같은 공통 식별 키가 실측 컬럼에 없어 다른 데이터와 정확히 연결하기 어렵고, 상호·주소 매칭 시 표기 차이에 주의해야 한다. 범위는 화성시 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하다.
