summary_user: 서울 광진구 관내 동물판매업 인허가 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·취소일, 영업상태(SALS_STTS_NM)와 폐업·휴업 일자, 지번·도로명 주소, 중부원점TM 좌표를 포함한다. 반려동물 판매업소 관리나 동물복지 정책을 맡은 담당자와 분석가가 '광진구에서 지금 영업 중인 펫숍은 어디이고, 최근 몇 곳이 폐업했나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 구의 같은 업종 인허가 데이터와는 같은 컬럼 구조와 기관 코드(OGDP_INST_CD)로 묶어 쓰고, 다른 데이터와는 주소·업소명 매칭이나 좌표 변환 뒤 위치 기준으로 잇는다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 동물판매업 인허가를 받고 운영 중인 업소 현황 정보를 제공합니다. 동물판매업은 가정에서 반려의 목적으로 사육하는 동물(개, 고양이, 소형 포유류, 조류, 파충류 등)을 판매하거나, 이를 알선·중개하는 업종으로, 동물보호법에 따라 일정 요건을 충족한 업소에 한해 허가됩니다. 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등 주요 항목이 포함되어 있으며, 반려동물 유통 관리, 동물복지 증진, 불법판매 단속, 지역 내 동물산업 현황 파악 등의 행정 및 민간 목적에 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되지 않아 지도 기반 활용 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준으로 최신화된 정보이며 정기적으로 갱신되어, 광진구 내 동물판매 관련 정책 수립과 업소 관리에 유용한 기반 자료입니다.
