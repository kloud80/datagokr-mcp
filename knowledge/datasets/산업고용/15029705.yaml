summary_user: 충청남도 부여군 관내 고압가스 시설을 설치 기관·업체 단위로 한 줄씩 정리한 소규모 파일(csv 415 bytes)로, 업체명·설치위치 주소·사용가스 종류·데이터기준일자를 담는다. 주민이나 안전관리 담당자가 '우리 읍·면 근처에 어떤 고압가스를 쓰는 시설이 있나'를 확인하거나 점검 대상 목록을 만들 때 쓴다. 전역 조인 키는 없어 설치위치 주소를 지오코딩하거나 업체명으로 맞춰 LOCALDATA 에너지 업종 인허가 원장, 다른 시군의 고압가스 현황과 이어 쓴다.
