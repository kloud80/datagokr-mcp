summary_user: 전국 장애인 표준사업장 877곳을 사업장 한 곳당 한 행으로 담은 건별 현황 파일이며, 인증번호·사업체명·관할지사·대표자·소재지·인증일자·업종 및 주요생산품 등을 싣고 인증일자는 2013-06-19부터 2025-12-23까지다. 장애인 표준사업장 인증을 받은 업체가 우리 지역 어디에 있고 무엇을 생산하는지 찾으려는 구직자·구매 담당자·분석가가 쓴다. 사업자등록번호(bizno)와 소재지(address)를 키로 다른 사업체·사업장 데이터나 지도·주소 자료와 이어 쓰며, 코드표가 있는 필드는 없다.
description_portal: 해당데이터는 장애인표준사업장 현황입니다. 장애인표준사업장제도는 일정조건을 갖춘 표준사업장을 인증하여 혜택을 주는 제도입니다. 장애인근로자 10명이상, 장애인근로자 30%이상(중증장애인은 장애인고용촉진 및 직업재활법 시행규칙 참조), 편의시설, 최저임금이상지급하는 조건을 갖춘 사업장을 장애인 표준사업장으로 인증합니다.해당 데이터는 한국장애인고용공단 홈페이지(www.kead.or.kr)에서도 확인하실 수 있으며, 데이터의 갱신주기는 연1회입니다.해당데이터는 사업체명, 소재지, 대표자 등을 공개하고 있습니다.
