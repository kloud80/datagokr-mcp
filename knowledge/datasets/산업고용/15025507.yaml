summary_user: 울산광역시 중구에 있는 옥외광고업체를 업체 한 곳당 한 행으로 담은 등록 목록 파일(csv, 약 10KB)로, 업소명·대표자 성명·영업장 소재지·영업내용·등록연월일을 담는다. 시민이나 상점 개업 준비자가 '중구에서 간판이나 현수막을 맡길 수 있는 업체가 어디에 있나'를 찾을 때 쓰고, 분석가는 구 안 옥외광고업체의 분포와 등록 시기를 볼 때 쓴다. 전역 조인 키나 사업자번호는 없어서, 다른 지역의 옥외광고업 현황이나 LOCALDATA 업종 인허가 자료와는 업소명·주소를 직접 맞춰 이어 써야 한다.
