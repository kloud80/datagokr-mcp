summary_user: 골재자원조사 중 시추조사 지점을 건별로 담은 파일 데이터로, 시추지점의 주소·위경도와 시추심도, 점토·모래·사력·연암 등 층별 값과 골재부화율을 싣는다. 전국 2,547건이 확인되며, 분석가나 골재 개발 기초조사 담당자가 특정 지역 지하의 기반암·퇴적층 분포가 어떤지 가늠하는 데 쓴다. 주소코드(address)와 위도·경도(coord)를 키로 다른 공간 데이터나 광업·토석채취 허가 같은 규제 자료와 지도상에서 겹쳐 볼 수 있다.
description_portal: 골재자원조사에서 기반암의 분포특성 및 부존량 조사를 위해서는 반드시 시추조사가 병행되어야함, 지표 하부의 기반암 및 퇴적층의 분포를 확인하는 시추조사 결과는  지표지질조사와 같이 다회성으로 조사하기 어려움, 또한, 시추조사 결과는 시추지점을 기준으로 주변의 기반암 및 퇴적층의 분포특성을 파악하는데 중요한 자료임, 따라서 정밀한 시추지점의 위치정보표시는 주변의 지질분포 현황 및 기반암의 분포특성을 파악하는데 많은 도움이 되며, 골재자원 개발시 기초자료로 유용하게 활용됨
