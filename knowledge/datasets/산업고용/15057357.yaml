summary_user: 한국장애인고용공단의 지역본부·지사, 직업능력개발원, 훈련센터 등 관련 기관을 기관 1곳당 1행으로 담은 목록으로, 시군명·기관명·지번/도로명 주소·우편번호·위경도 좌표·전화번호·홈페이지 주소를 포함한다. 장애인 구직자나 가족이 "가까운 장애인고용공단 지사나 훈련센터가 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 지역별 장애인 고용 서비스 기관의 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드·시군명(SIGUN_NM)이나 기관명 매칭, 또는 위경도 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 한국장애인고용공단의 전국 지역본부 및 지사, 직업능력개발원, 훈련센터 등 관련 기관의 현황을 정리한 자료입니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 포함되어 있으며, 기관별 위치와 연락처를 확인할 수 있습니다. 해당 데이터는 장애인 고용 촉진과 직업 재활을 위한 정책 수립, 지역별 서비스 접근성 평가, 복지 인프라 분석 등에 활용될 수 있으며, 공공기관 및 연구기관에서 장애인 고용 관련 정책 지원 자료로도 사용될 수 있습니다.
