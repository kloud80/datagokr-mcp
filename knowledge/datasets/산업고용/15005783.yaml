summary_user: 세계 각국의 주요 방사성폐기물 처분장을 한 행씩 담은 2020년 기준 소규모 정리표(csv 698바이트)로, 국가·처분장 이름·처분용량·운영기간·처분방식(지층·천층 등)을 담는다. 연구자나 정책 담당자가 "다른 나라 처분장은 어떤 방식으로 얼마나 큰 용량을 언제부터 운영하는가"를 비교할 때 쓴다. 전역 조인 키가 없어 국가명이나 처분장 이름을 기준으로 다른 국제 원자력 통계나 국내 방사성폐기물 현황 자료와 수작업으로 맞춰 쓴다.
description_portal: 세계 방사성 폐기물 관리 및 처리 현황 데이터입니다.본 데이터는 각국의 주요 방사성폐기물 처분장 운영 정보를 제공하는 데이터셋입니다. 제공 항목은 국가별 방사성폐기물 처분장치의  총 처분용량, 운영 시작 및 종료 시점 등 운영기간, 그리고 지층처분·천층처분 등 처분방식이 포함됩니다.이를 통해 국가별 방사성 폐기물 시설 운영 현황을 비교·분석할 수 있으며, 국제적 방사성폐기물 관리 동향 파악에 활용될 수 있습니다.또한 연구기관·정책입안자·산업계가 안전한 폐기물 관리 전략을 수립하는 데 참고자료로 활용할 수 있습니다.
