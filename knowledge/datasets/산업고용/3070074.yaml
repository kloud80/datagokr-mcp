summary_user: 한국수력원자력이 국내에 건설한 APR1400 노형 원자력발전소를 호기 단위로 정리한 소규모 현황표(CSV 623바이트)로, 위치·시설용량·노형·준공(예정)일·주설비 시공업체·주요공사현황을 담는다. 운영 중인 4개 호기와 건설 중인 새울3·4호기, 신한울3·4호기의 준공 예정 시기나 시공사를 확인하려는 국민·분석가·건설업계가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전설비·전력 데이터와는 발전소 이름(구분)이나 위치를 직접 맞춰야 이어 쓸 수 있다.
description_portal: 국내 원자력건설 기술 60년 노하우가 집약된 최신형인 한국형 신형경수로 APR(Advanced Power Reactor) 1400이 적용되어 아래와 같이 국내에서 한국수력원자력이 건설한 원자력 발전소의 주요 정보로 구성됩니다.1. 원자력발전소 설치 위치2. 원자력발전소 시설용량3. 원자력발선소 노형4. 원자력발전소  준공(예정)일5. 원자력발전소 주설비공사에 참여한 시공업체6. 원자력발전소 주요공사현황현재 국내에 설치된 APR1400 노형의 원자력발전소는  총 4개호기가 있고, 건설중인 발전소는 총  4개호기(새울3,4호기 및 신한울3,4호기)가 있습니다.
