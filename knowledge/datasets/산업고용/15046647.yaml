description_portal: '○ 통계개요* 통계명 : 폐업자현황(폐업사유별)* 통계유형 : 일반통계* 법적근거 : 국세기본법 제85조의 6* 통계목적 : 국세의 세목별 징수내용 등에 관한 사항을 체계적으로 작성하여 세입구조 실태, 변동 등에 따른 대책수립, 경제효과 분석 등을 위한 기초자료 제공* 조사체계 : 세무서→지방국세청→국세청* 보고대상 범위 : 납세자 신고자료, 국세청에서 부과 징수한 자료* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 폐업사유별 폐업자 현황○ 용어설명* 법인사업자 : 지점을 포함한 법인수를 의미함* 일반사업자 : 개인사업자 중 간이사업자를 제외한 과세사업자* 간이사업자 : 직전 연도의 공급대가의 합계액이 48백만원 미달하는 개인과세사업자* 면세사업자 : 개인사업자 중 부가가치세가 면제되는 사업을 영위하는 자* 양도인수 : 사업장을 타인에게 양도한 경우* 법인전환 : 개인으로 사업을 영위하던 거주자가 당해 사업용 자산을 현물출자하여 새로운 법인을 설립하는 것* 행정처분 : 행정기관이 행하는 공법상의 단독적 법률행위* 면세포기·적용 : 부가가치세가 면제되는 재화 또는 용역의 공급에 대하여 소정의 경우에는 당해 사업자가 면세포기신고를 함으로써부가가치세의 면세를 받지 아니하고 과세사업자가 될 수 있도록 하고 있는데 이를 면세포기라 하고, 부가가치세가 면제되는재화 또는 용역을 공급하는 사업자(면세사업자)가 일정한 요건에 해당하여 이를 포기한 후에 다시 면세를 적용받고자 신고한자를 면세적용이라 한다* 해산·합병 : 해산은 법인격(法人格)소멸의 원인은 되지만 법인격이 소멸하는 것은 아니며, 영업능력은 잃게되나청산목적의 범위 내에서는 권리능력이 있는 것으로 하고, 청산절차가 종료됨으로써 비로소 법인격이 소멸된다합병이란 2개 이상의 회사가 신회사 설립의 방법(신설합병) 또는 한 회사가 타 회사를 흡수하는방법으로(흡수합병) 하나의 회사가 되는 것을 말한다○ 기타* 모든 자료수치는 세부 항목과 합계가 각각 반올림되었으므'
