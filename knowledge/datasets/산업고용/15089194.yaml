description_portal: 중소기업기술정보진흥원에서 제공하는 '클라우드기반 솔루션개발사업 지원 현황' 데이터는 클라우드 기술을 활용한 솔루션 개발 사업에 대한 실제 지원 및 수행 기록을 정리한 자료입니다. 이 데이터는 지원연도를 명시하여 사업이 시행된 시점을 보여주며, 과제구분을 통해 지원된 사업의 유형을 파악할 수 있게 합니다. 특히, 대표도입기업과 공급기업 정보를 포함하여 어떤 기업들이 클라우드 솔루션을 도입하고 개발 및 제공했는지 수요-공급 관계를 명확히 보여줍니다. 지원 과제 명 컬럼을 통해 구체적인 기술 개발 내용을 확인할 수 있으며, 참여기업 수는 해당 과제에 협력한 기업 규모를 가늠하게 합니다.
