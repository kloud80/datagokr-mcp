summary_user: 한국전력기술(주) 본사 한 곳에서 생산한 신재생에너지를 생산기간별로 지열·태양광 발전량, 총 생산량(메가와트), 신재생에너지 비율로 기록한 24건짜리 소규모 집계 파일이다. 공공기관 에너지 담당자나 분석가가 이 기관 본사의 지열·태양광 발전 규모와 신재생에너지 비중이 기간에 따라 어떻게 변했는지 확인할 때 쓴다. 다른 데이터와 이을 전역 조인 키는 없어 기관명이나 생산기간을 직접 맞춰 다른 기관 사옥 에너지 자료와 비교하는 정도로만 연결한다.
