summary_user: 고용24에서 안내하는 고용정책·지원제도를 제도 한 건당 한 행으로 정리한 전국 단위 목록 파일(CSV, 약 180KB)로, 제도명·정책구분·시행 여부(제도상태)·분류·재정구분·담당부서·구성목차·업데이트일자를 담는다. 구직자나 사업주가 "지금 시행 중인 청년 고용지원금 제도는 무엇이고 담당부서는 어디인가"를 찾거나, 분석가가 정책구분·재정구분별 제도 현황을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 정부지원 일자리사업·직업훈련 과정 등 다른 데이터와는 제도명이나 담당부서 이름을 맞춰 연결해야 한다.
description_portal: 「고용24 고용정책 제도정보 자료」는 고용노동부의 통합 서비스인 고용24 플랫폼에서 제공하는 각종 고용정책·지원제도·노동관계 법령 정보를 한눈에 이해할 수 있도록 정리한 안내 자료입니다. 이 자료는 구직자, 근로자, 기업, 사업주가 필요로 하는 정책 정보를 주제별로 구분해 제공하며, 고용지원금, 직업훈련, 취업지원 프로그램, 청년·중장년 지원정책, 장애인 고용제도, 외국인 고용허가제 관련 정보, 노동관계 법·제도 안내 등 폭넓은 내용을 포함합니다. 제도에 대한 정책구분, 제도상태(시행 여부), 재정구분, 담당부서 등의 자료가 표함되어 있습니다.
