summary_user: 전국 지자체가 관리하는 계량기증명업(계량기 정상작동 검사 업소) 인허가 정보를 업소 단위로 담으며, API 전체 3,334건에 인허가일자·영업상태·휴폐업일자·주소·좌표가 들어 있고 기간은 2014-10-23부터 2026-10-01까지다. 사업자는 물론 분석가나 국민이 우리 지역에 영업 중인 계량기 검사 업소가 어디인지 확인하는 질문에 쓴다. 지번주소·도로명주소(address) 키로 다른 주소 기반 데이터와, 관리번호(MNG_NO, pnu 키로 실측)로 다른 인허가 자료와 이어 쓰고, 필수 파라미터인 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
