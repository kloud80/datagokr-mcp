summary_user: 부산광역시 수영구 관내에서 현재 영업 중인 출판업·인쇄업 업체를 한 곳씩 담은 등록 현황 파일로, 업체명·업종 구분·도로명 소재지를 담는다. 수영구에서 인쇄소나 출판사를 찾는 주민·사업자, 또는 구 단위 인쇄·출판 업체 분포를 보려는 분석가가 '수영구에 영업 중인 인쇄업체는 어디에 몇 곳 있나' 같은 질문에 쓴다. 전역 조인 키나 사업자번호·좌표가 없어 다른 데이터와는 업체명이나 도로명 주소 매칭으로만 이어 쓰며, 지방행정 인허가(LOCALDATA)나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식이다.
limits: 수영구 한 구만 다루고 현재 영업 중인 업체만 담아 폐업 이력이나 다른 시군구와의 비교에는 쓸 수 없다. 공통 식별 키가 없어 다른 데이터와 연결하려면 상호·주소 문자열 매칭에 의존해야 한다.
