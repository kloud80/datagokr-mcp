summary_user: 충청남도에 본사나 공장을 둔 중소수출기업을 기업 한 곳당 한 행으로 담은 목록 파일(csv)로, 기업명·본사 주소·공장 주소·수출품목을 담는다. 기업지원 부서나 연구자가 '도내 어느 시군에 어떤 품목을 수출하는 중소기업이 모여 있는가'를 파악할 때 쓴다. 전역 조인 키는 없어 사업자번호 같은 공통 코드로 다른 기업 데이터와 잇지 못하고, 기업명이나 주소 문자열을 맞춰 연결해야 한다.
limits: 사업자등록번호 같은 전역 키가 없어 다른 기업 원장과 정확히 매칭하기 어렵고, 기업명·주소 대조로만 이어 쓸 수 있다. 범위는 충청남도 한 곳이다.
