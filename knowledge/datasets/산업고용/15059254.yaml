summary_user: 청년취업인턴제를 운영하는 기관을 한 행씩 담은 기관 목록으로, 시군명·관할 고용센터·운영기관명·대표전화·팩스·지번/도로명 주소·우편번호·위도·경도를 포함한다. 청년 구직자나 정책 분석가가 "우리 시군에서 청년인턴제를 운영하는 기관은 어디이고 어느 고용센터 관할인가"를 확인하거나 지역별 운영기관 분포를 지도로 그릴 때 쓴다. 실측상 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 관할 고용센터명 같은 이름 매핑으로만 다른 고용 서비스 기관·지역 고용동향 데이터와 이어 쓴다.
description_portal: 이 데이터는 청년취업인턴제를 운영하는 전국의 기관 현황을 제공하며, 각 기관의 위치, 관할 고용센터, 운영기관명, 연락처, 주소, 위도·경도 정보 등을 포함합니다. 청년취업인턴제는 청년들의 취업역량 강화를 목적으로 고용노동부와 연계된 운영기관이 청년 구직자에게 실무 경험 기회를 제공하는 제도로, 해당 데이터를 통해 지역별 인턴제 운영 기반의 분포와 접근성을 파악할 수 있습니다. 특히 시군명과 운영기관명을 기준으로 지역별 지원 네트워크를 시각화하거나, 청년 고용정책의 지역 적용 범위를 분석하는 데 활용할 수 있으며, 기업-청년-기관 간 연계 구조 파악, 정책 수립, 고용 서비스 개선 등의 다양한 행정 및 연구 목적에도 유용합니다.
