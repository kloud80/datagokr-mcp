summary_user: 2021~2022년 중소벤처기업진흥공단 기업진단 사업에서 약식 비대면진단을 받은 기업을 한 행씩 담은 전국 단위 파일이며, 수진연도·기업명·지역·업종과 구성 요소별·기능별 역량 강점을 기록한다. 지원기관이나 분석가가 '어느 지역·업종 기업이 비대면진단을 많이 받았고, 어떤 역량을 강점으로 진단받았나'를 살펴볼 때 쓴다. 사업자번호 같은 공통 조인 키가 없어 다른 기업 데이터와는 기업명이나 지역·업종 이름을 맞춰서만 이을 수 있다.
description_portal: 비대면 진단은 고객 참여형 기업진단 모델"로 온라인에서 자발적으로 경영상태를 점검하고,기업의 현재 수준 파악 및 문제점 분석 등을 통해 최적의 솔루션을 제시하는 방식입니다.기업고객이 온라인에서 매출액, 영업이익, 고용인원, 지적재산권 등 기업현황 정보를 입력하면,중진공 내부데이터와 정부 및 공공기관, 민간 등 외부 데이터를 활용해 기업역량에 대한 진단이 진행됩니다.관련 분야에서 유사한 규모를 가진 기업군과의 비교를 통해기업의 성장 가능성과 전략방향 등을 분석한 보고서를 제공하여 기업고객들이 원하고 필요로 하는 진단결과를 제공합니다.동 데이터는 2021~2022년 기업진단 사업 수진기업 중 약식 비대면진단을 받은 기업의 현황(지역, 업종 등)에 대한 현황 자료입니다.
