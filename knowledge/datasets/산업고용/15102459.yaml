summary_user: 한국전력공사 전기차운영시스템에 등록된 전기차 충전기를 한 행씩 담은 전국 단위 파일로, 본부·사업소·충전소명·충전기ID·충전기용량·충전소 용도 구분·충전방식을 기록한다. 분석가나 지자체가 '우리 지역 한전 충전소는 어떤 용도이고 급속·완속 충전기가 얼마나 있나'처럼 지역별 충전 인프라의 유형과 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어, 다른 충전소·전기차 등록 데이터와는 충전소명 매칭이나 한전 본부·사업소 단위로만 이어 쓴다.
