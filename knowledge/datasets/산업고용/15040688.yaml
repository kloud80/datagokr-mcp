description_portal: 산업통상자원부 국가기술표준원, 환경부, 식품의약품안전처는 시중에 유통되는 상품을 수거하여 유해물질 포함 여부와 같은 위해성 여부를 판정한 후 위해상품으로 확인된 경우 해당 내용을 공표합니다. 대한상공회의소 유퉁물류진흥원에서 운영 중인 이 시스템은 해당 상품정보를 유통사에 전달하기 위해 등록 및 전송하는데 활용되며, 유통사로 전달된 정보는 이 시스템과 연계된 전국 매장에서는 위해상품의 유통을 차단하는 역할을 수행합니다. 이 데이터는 위해상품판매차단시스템에서 제공되는 위해 및 불법 제품에 관련한 업체 정보로 업체명, 업체구분, 사업자번호 등으로 구성됩니다.
