description_portal: '"연간 온실가스 배출량"은 한국가스공사의 연간 온실가스 배출량을 체계적으로 정리한 데이터 입니다. 온실가스 배출현황 관리 및 탄소중립 목표 달성, 환경규제 대응, 저탄소 경영전략 수립을 목적으로 수집되었습니다. 데이터 구성항목은 연도, 총 온실가스 배출(tCO2eq), 직접 배출(tCO2eq, Scope 1), 간접 배출(tCO2eq, Scope 2)로 이루어져 있어 배출원별 기여도를 상세히 분석할 수 있습니다. 본 데이터를 활용하면 연도별 온실가스 배출 추이 분석, 배출원별 기여도 파악, 감축 목표 대비 실적 평가, 직접/간접 배출 비중 변화 분석이 가능합니다. 또한 온실가스 감축 로드맵 수립, 탄소배출권 관리, 환경규제 대응 전략 수립, 감축 투자 우선순위 결정에 활용됩니다. ESG 경영성과 보고, 국가 온실가스 감축 정책 이행, 저탄소 경영전략 수립 등 온실가스 배출 저감 정책에 대한 의사결정을 효과적으로 지원하고 환경경영 목표 달성에 기여합니다.'
