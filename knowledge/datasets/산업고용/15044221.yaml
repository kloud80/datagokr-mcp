summary_user: 한국지역난방공사 대구지사와 광주전남지사(신안태양광) 태양광발전소의 발전량을 시간대별로 기록한 운영 실적 파일로, 실적일시마다 두 지사의 발전량(kWh)을 한 행에 담는다. 분석가가 "신안 태양광은 하루 중 몇 시에, 어느 계절에 발전량이 가장 많은가" 같은 시간대·요일·월별 패턴을 보거나 시계열 예측 모델을 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 실적일시(날짜·시간)나 지사·발전소 이름으로 맞춰 이어야 하며, 발전소 주소·용량은 전국태양광발전소전기사업허가정보 표준데이터에서 이름으로 찾아 붙인다.
