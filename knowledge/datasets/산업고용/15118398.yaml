summary_user: 한국서부발전 태안·평택·서인천 발전소 주변에서 측정한 기온·습도·기압·풍향·풍속·강수량을 발전소명·호기별, 측정일자 단위로 담은 API 데이터다. 발전소 인근 주민이나 환경 분석가가 '특정 날 태안발전소 주변 바람이 어느 방향으로 얼마나 불었고 비가 얼마나 왔나'를 확인해 대기오염물질 확산 방향을 가늠하는 데 쓴다. 전역 조인 키는 없어 발전소명(genNm)과 일자로 같은 기관의 발전소 배출·수질 측정 데이터나 기상청 관측 자료에 이름·날짜 매칭으로 이어 쓴다.
limits: 표준 지역코드 같은 공통 조인 키가 없어 다른 데이터와는 발전소명·일자 매칭으로만 연결된다. 범위는 전국·비공간으로 분류돼 좌표 기반 공간 분석에는 바로 쓰기 어렵고, 개발계정은 하루 100회 호출로 제한된다.
