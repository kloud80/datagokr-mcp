description_portal: 이 데이터는 한국남부발전이 출자하여 운영 중인 국내 신재생에너지 발전회사의 현황을 정리한 자료입니다. 각 출자회사의 명칭, 적용된 신재생에너지원, 사업지역, 설비용량과 상세 설비 구성 정보가 포함되어 있습니다. 주로 강원도 태백, 평창, 정선 지역에 설치된 풍력발전소를 중심으로 하며, 발전 용량과 개별 터빈 구성 등 세부적인 운영 현황을 확인할 수 있습니다. 이를 통해 우리나라 육상풍력 자원의 활용 현황을 파악할 수 있으며, 신재생에너지 확대 정책 및 에너지 전환 과정에서의 성과를 이해하는 데 도움이 됩니다. 또한 친환경 발전사업이 지역사회와 경제에 미치는 기여를 분석하는 기초 자료로 활용할 수 있습니다.
