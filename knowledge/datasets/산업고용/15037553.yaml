description_portal: 데이터는 업력, 업종, 기업형태, 성별, 연령에 따른 국내 판매와 수출 비중을 백분율로 나타내고 있습니다. 전반적으로 국내 판매 비중이 매우 높은 가운데, 수출 비중은 모든 항목에서 1% 미만 또는 0% 수준으로 낮게 나타납니다. 업력 구간에서는 4년차를 제외하고 모두 수출 실적이 0.1~0.3% 수준이며, 업종별로는 사업시설관리업에서 유일하게 1.5%의 수출 비율을 기록하고 있습니다. 법인 기업은 개인 기업보다 수출 비율이 다소 높게 나타나며, 성별 기준으로는 남성 창업자가 여성보다 약간의 수출 실적을 보이고 있습니다. 연령별로는 30대 창업자에서 0.5%로 가장 높은 수출 비율이 확인됩니다. 본 데이터는 창업자의 기업 활동에서 내수 중심 구조가 강하게 나타남을 보여주며, 수출 확대를 위한 정책적 지원 필요성을 시사합니다.
