summary_user: 한국지역난방공사 플랜트관리시스템에 등록된 예방점검 항목을 설비 단위로 담은 파일(CSV, 약 94KB)로, 설비번호·설비명·점검명·점검주기·지사명·담당 보수부서를 행마다 기록한다. 설비 유지관리 분석가나 안전관리 담당자가 '어느 지사의 어떤 설비가 주간·월간·분기 중 어떤 주기로 점검되고, 어느 부서가 맡는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키는 없으므로, 지사명이나 설비명을 이름으로 맞추거나 같은 기관의 다른 공개자료와 연결해서 쓴다.
description_portal: '한국지역난방공사의 플랜트관리시스템 예방점검 내역 데이터를 정리한 자료로, 각 사업소의 주요 설비에 대해 주기적인 점검을 수행한 결과를 기록하여 설비의 안정적 운영과 사고 예방을 위한 유지관리 현황을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 설비번호: 점검 대상 설비를 식별하기 위한 고유번호(예시: 11064430, 10030470 등)■ 설비명: 점검이 수행된 설비의 명칭(예시: PLB AREA ELECTRIC HEAT TRACING PANEL, DH AREA ELECTRIC HEAT TRACING PANEL)■ 점검명: 수행된 예방점검의 구체적 명칭(예시: 전기열추적 패널 주간 점검, 가압장 구조물 및 배출수 처리설비 점검)■ 점검주기: 점검이 수행되는 주기(예시: 주간, 월간, 분기별)■ 지사명: 설비가 위치한 사업소 또는 지사(예시: 광교지사, 삼송지사, 파주지사 등)■ 보수부서명: 점검 및 유지관리를 담당하는 부서명(예시: 기계부 HRSG & DH, 계전부 전기 등)3. 활용 예제:■ 설비별 점검 주기 및 이력 데이터를 분석하여 예방정비 체계 고도화 및 설비 신뢰성 향상■ 점검 결과를 기반으로 주요 설비의 고장 예측 및 보수 우선순위 도출■ 사업소별 점검 수행 현황을 비교하여 유지보수 인력 효율화 및 안전관리 수준 평가에 활용'
