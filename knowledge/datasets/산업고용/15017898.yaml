summary_user: 충청남도 홍성군에서 허가된 토석채취 건별 현황으로, 수허가자 상호, 허가지 주소(세부지번), 채취 용도(쇄골재용·토목용 등), 허가면적·허가량, 허가 시작일·종료일을 담은 작은 CSV 파일(958 bytes)이다. 홍성군 안에서 어느 필지에 누가 언제까지 토석채취 허가를 받았는지 확인하려는 주민·사업자나, 채취지와 국토 공간 규제의 겹침을 살피는 분석가가 쓴다. 전역 조인 키가 없어 허가지 주소(지번)를 주소·필지 정보와 맞추거나 같은 기관 자료와 이름으로 매칭해 이어 쓴다.
description_portal: 충청남도 홍성군 내 토석채취 허가 현황을 관리하기 위한 자료입니다. 본 데이터는 채취가 이루어지는 위치, 허가 면적, 채취 수량, 허가 시작일 및 종료일 등의 정보를 포함하여 구성되어 있습니다. 이를 통해 자원 이용 현황을 체계적으로 파악할 수 있으며, 토지 관리 및 환경 보전과 관련된 행정 업무에 활용 가능합니다.
