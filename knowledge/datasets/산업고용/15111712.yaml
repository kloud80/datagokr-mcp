summary_user: 한국전력공사 청구 원장에서 나온 상계거래(자가발전 전력을 사용량에서 차감하는 거래) 고객의 전력사용량을 전국 법정동(읍면동) 단위로 연·월별 집계해, 고객 호수(전체호수)와 함께 담은 파일이다. 지역 에너지 분석가나 지자체 담당자가 '우리 동네 상계거래 고객 수와 전력사용량이 월별로 어떻게 변해 왔는가'를 확인하는 데 쓴다. 전역 조인 키(법정동코드 등)는 없어 시도·시군구·법정동 이름을 행정구역 코드표와 매핑해야 다른 지역 통계와 연결된다.
description_portal: 한국전력공사에서 관리하고 있는 법정동별 상계거래 고객 대상 전력사용량 현황 입니다. 시도, 시군구, 법정동, 년도, 월, 전체호수, 전력사용량(상계거래고객 사용량)을 제공합니다.이 데이터는 연도와 월별로 구분되어 있어, 특정 시기의 전력사용량을 확인하는 데 도움이 됩니다. 전체 호수와 그에 따른 전력사용량(상계거래 고객 사용량)을 함께 제공하여, 이를 통해 시간에 따른 전력사용량의 변화 추이를 분석할 수 있습니다.다만, 개인정보보호법 제28조에 따라, 5호 미만의 데이터는 제거되어 있음을 알려드립니다. 비어있는 항목은 해당 법정동의 대상고객 호수가 5호 미만인 지역이며, 개인정보를 보호하기 위하여 해당 데이터는 제거 후 제공드리고 있습니다.
