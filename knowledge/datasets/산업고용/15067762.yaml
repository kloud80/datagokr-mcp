summary_user: 광해방지사업을 실시한 폐광산의 실태조사 결과를 조사년도·지역·운영상태별 광산 수로 묶은 전국 단위 집계표이며, 건별 광산 원장이 아니라 1.5KB 남짓의 작은 CSV 파일입니다. 지자체·정책 분석가가 "우리 지역에 광해방지사업 대상 폐광산이 몇 곳이고 운영상태는 어떤가"를 연도별로 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름이나 조사년도를 맞춰 연결해야 하며, 같은 기관의 광해·광업 데이터와 지역명 기준으로 이어 쓴다.
description_portal: 한국광해광업공단은 광산개발 과정과 폐광 이후 2차 오염 등으로 발생하는 광해를 분석·예방하고 제거하는 광해방지 사업을 실시합니다. 폐석·광물찌꺼기 등 오염원을 차단하고 오염토양 복원, 수질개선, 지반침하 방지 등 광해복구로 자연환경을 깨끗하게 보전하는 동시에 지역주민의 삶의 질을 향상하는 것을 목표로 하고 있습니다.이와 관련, 전국 폐광산 실태조사 결과를 개방 및 공개합니다.또한, 본 데이터셋은 지역별로 분류되어 있어 각 지역에 따른 폐광산의 실태를 상세히 파악할 수 있습니다. 이를 통해 지역별 특성에 맞는 맞춤형 광해방지 정책 수립에 활용될 수 있습니다.
