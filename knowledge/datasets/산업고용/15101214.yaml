description_portal: 안전보건경영시스템은 최고경영자가 기업경영 방침에 안전보건정책을 선언하고 이에 대한 실행계획을 수립·실행·점검해 지속적인 개선이 이루어지도록 하는 체계적인 안전보건활동 인증제도다. 한국수력원자력은 안전보건경영시스템 도입을 통하여 무사고·무재해를 실현하고, 안전보건 위험요소를 제거하여 근원적으로 안전사고를 예방하고 있습니다. 안전보건경영시스템 구축 및 적용을 통하여 근로자의 안전보건 마인드 및 역량을 제고하고 안전한 근로환경을 조성하고 있습니다. 또한 안전보건 협락, 법규·규제의 요구사항을 준수함으로써 지속적인 안전관리 개선을 실천하고 있으며, 이를 통해 이해관계자들에게 신뢰성을 제공하고 있습니다.
