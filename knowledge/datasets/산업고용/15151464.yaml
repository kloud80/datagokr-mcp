description_portal: '한국지역난방공사의 우선구매 대상 업체 정보를 정리한 데이터로, 중증장애인생산품 등 사회적경제기업 제품을 우선 구매하여 사회적 가치 실현과 공공조달의 포용적 성장을 촉진하기 위한 자료입니다.1. 형식: CSV2. 내용 요약:■ 구매종류: 우선구매 대상의 구분(예시: 중증장애인생산품, 사회적기업제품, 여성기업제품 등)■ 업체명: 우선구매 대상 물품을 공급하는 기관 또는 업체명(예시: 가나안근로복지관, 구세군장애인재활작업장, 엘림보호작업장)■ 품목명칭: 공급 가능한 주요 제품 또는 서비스 항목(예시: 재생토너카트리지, 인쇄물, 가구류, 사무용지류)■ 기준일자: 데이터가 기준이 되는 날짜(예시: 2025-06-30)3. 활용 예제:■ 공공조달 시 우선구매 대상기업 목록을 활용하여 사회적경제 활성화 및 공공구매 정책 실현■ 품목별·업체별 우선구매 비중을 분석해 사회적 가치 중심의 구매체계 개선 방안 수립■ 중증장애인생산품 및 사회적기업 제품 판로 확대를 위한 협력 및 성과 모니터링 자료로 활용'
