summary_user: 중소벤처기업진흥공단 융복합기술교류촉진사업으로 열린 해외기술교류 상담회의 참가 업체별 기록을 담은 파일(CSV, 약 59KB)로, 국가·개최도시·회차·시작일과 종료일, 업종, 1:1 상담한 외국기업 수와 상담 후 현지 방문 횟수가 들어 있습니다. 분석가나 정책 담당자가 '어느 국가 상담회에서 중소기업 한 곳당 외국기업을 몇 곳 만나고 실제 현지 방문까지 몇 번 이어졌는가'를 보는 데 씁니다. 사업자번호 컬럼이 있지만 실측에서 전역 조인 키로 확인되지 않아, 다른 기업 데이터와는 업종·국가 같은 이름 매핑이나 같은 기관 자료 기준으로만 연결합니다.
description_portal: '본 데이터는 중소벤처기업진흥공단이 추진하는 융복합기술교류촉진사업의 일환으로 개최된 해외기술교류 상담회의 개최 현황을 정리한 자료입니다. 본 데이터에는 상담회명, 개최국가 등의 정보가 포함되어 있습니다. * 상담 외국기업 수 : 해외기술교류상담회 1:1 미팅을 진행한 외국 기업 수* 현지 방문기업 수 : 상담회 이후, 미팅에서 만났거나 사전에 방문하기로 협의했었던 해당 외국기업에 방문한 횟수* 회차 : 국가별 상담회 차수다만, 중소벤처기업진흥공단의 해외 기술교류센터 운영 사업은 2023년을 마지막으로 종료되었으며, 본 데이터는 사업 종료 시점까지의 누적 정보를 제공하는 기록 자료로서 의미를 가집니다.'
