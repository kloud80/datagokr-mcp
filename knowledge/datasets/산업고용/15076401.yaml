summary_user: 한국남부발전이 운영하는 한경풍력의 호기별 일일 발전량(kWh)을 2018년 1월 1일부터 2025년 2월 28일까지 날짜별 한 행, 호기별 한 열로 담은 집계 파일이다. 풍력 분석가나 연구자가 '한경풍력 각 호기의 일별·계절별 발전 실적이 어떻게 달라졌나'를 확인하거나 발전량 예측 모델의 기초 실적 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 날짜(구분) 기준으로 기상·풍속 자료나 같은 기관의 다른 발전소 실적과 이름·날짜를 맞춰 붙여 쓴다.
description_portal: 본 데이터는 한국남부발전(주)의 한경풍력 일별 발전량 파일데이터입니다.본 데이터는 한국남부발전(주)에서 운영하는 한경풍력의 2018년 1월 1일부터 2025년 02월 28일까지의 일일별 발전량을 KWh 단위로 나타낸 데이터입니다.한경풍력의 1호기부터 9호기까지의 데이터의 일별 발전량을 포함하고 있습니다.본 데이터를 활용하여 풍력발전의 각 호기별 세부 발전 실적을 파악할 수 있으며, 타 데이터(풍력, 위치정보 등)와 결합하여 풍력발전 실적 예측 등 다양한 분야에 기초자료로 활용될 수 있습니다.
