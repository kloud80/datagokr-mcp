summary_user: 전북특별자치도 남원시에서 토석채취 허가를 받은 업체별로 소재지·상세주소, 용도, 허가면적(㎡), 허가 시작·종료일을 한 줄씩 담은 허가 목록(CSV 약 1.2KB의 소규모 파일)이다. 인근 주민이나 환경 연구자가 '우리 동네 어디에서 언제까지 토석 채취가 허가돼 있나'를 확인하거나, 건설·공공기관이 지역 골재 공급원을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(소재지·상세주소)나 업체명으로 맞춰 이어 써야 하며, 주소를 지번·좌표로 바꾸면 토지이용규제 등 국토 공간 규제 정보와 겹쳐 볼 수 있다.
description_portal: 1. 데이터 주요 내용 및 목적  본 데이터는 전북특별자치도 남원시에 위치한 토석채취 허가업체의 현황과 허가 내역을 정리한 목록입니다.하천 및 토지에서 이뤄지는 토석 채취는 골재 수급과 하상 변화 등 지역 환경에 직접적인 영향을 미칩니다. 이에 따라 허가 구역, 기간, 면적 등 관련 정보를 행정적으로 관리하고 환경 영향을 모니터링하기 위해 체계적인 데이터 기록이 필요합니다.데이터에는 채취 허가를 받은 업체의 소재지, 용도, 허가 면적, 허가 기간 등이 포함되어 있으며, 허가 현황 파악과 채취 구역의 체계적인 행정 관리에 활용할 수 있습니다.2. 데이터 항목  업체명, 소재지, 상세주소, 용도, 허가면적(㎡), 허가시작일, 허가종료일3. 기대효과  토석채취 허가 정보가 공개되면 인근 주민, 환경 연구자, 시민단체가 채취 구역과 허가 기간을 손쉽게 확인할 수 있어 환경 변화 감시가 한층 수월해집니다. 또한, 골재 수급 계획이 필요한 건설 및 공공기관, 하상 변동 관련 연구를 수행하는 기관 등이 본 데이터를 기초 자료로 활용할 수 있습니다.
