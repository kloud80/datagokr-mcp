description_portal: 한국남부발전(주)의 석탄화력발전소 설비가 수명에 도달함에 따라 이를 대체하기 위한 계획을 정리한 자료입니다. 기존 사업소와 발전기별 용량, 준공 및 허가 연월을 비롯하여, 대체 발전 방식으로 LNG복합발전이 주로 채택되고 있음을 확인할 수 있습니다. 또한 호기 단위 대체, 용량 대체 등 구체적 방식을 명시하고 있으며, 실제 대체가 이루어질 예정 시점과 관련 전력수급계획과의 연계 여부도 함께 제공됩니다. 이 자료는 국민이 석탄 중심 발전에서 친환경 LNG 발전으로의 전환 과정을 이해하는 데 도움을 주며, 에너지 정책 연구자, 산업계, 정책 입안자에게는 전력 설비 전환 전략과 친환경 에너지 전환 추진 현황을 분석하는 중요한 자료로 활용될 수 있습니다.
