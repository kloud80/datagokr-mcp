summary_user: 서울시 골목상권 배후지별로 분기(STDR_YYQU_CD)마다 관공서·은행·병원·약국·학교·대학·백화점·슈퍼마켓·극장·숙박시설·철도역·지하철역·버스정류장 등 집객시설 수를 집계해 담는다. 예비 창업자나 상권 분석가가 '이 상권 배후지에 학교와 지하철역, 병원이 얼마나 모여 있어 방문객을 끌어들이는가'를 비교하는 데 쓴다. 전역 조인 키는 없고, 상권코드(TRDAR_CD)와 상권구분코드로 같은 기관(서울시 우리마을가게 상권분석서비스)의 다른 상권 데이터와 이어 쓴다.
