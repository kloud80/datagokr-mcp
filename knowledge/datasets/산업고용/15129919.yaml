summary_user: 평택시 대표홈페이지 DB에 등록된 관내 기업체를 한 행에 한 업체씩 담은 목록 파일(CSV, 약 316KB)로, 회사명·단지명·공장 대표주소·생산품·종업원수·전화번호·등록일을 담는다. 평택시 산업단지별로 어떤 업체가 입주해 무엇을 생산하는지 파악하려는 분석가나 협력업체·거래처를 찾는 사업자가 쓴다. 전역 조인 키는 없으므로 공장대표주소를 주소·좌표로 변환해 공간 데이터와 붙이거나, 회사명·단지명을 이름으로 매핑해 다른 기업·산업단지 목록과 잇는다.
description_portal: '경기도 평택시 대표홈페이지 DB의 기업체현황으로 종업원수, 전화번호, 생산품, 등록일, 회사명 등의 항목을 제공합니다.해당 데이터는 지역 내 산업구조 분석, 업종 분포 현황 파악, 산업단지 관리, 기업 입지 특성 연구 등 다양한 행정 및 정책 수립의 기초자료로 활용할 수 있습니다. 또한 기업 지원 정책 수립, 경제 활성화 방안 마련, 민간의 상권 분석 및 입지 타당성 조사 등에도 실질적인 자료로 활용 가능합니다. 위치 기반 정보와 결합하여 GIS 기반의 공간 분석 자료로도 활용할 수 있으며, 산업 동향 모니터링 및 기업 성장 전략 수립 등에도 도움이 됩니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)'
