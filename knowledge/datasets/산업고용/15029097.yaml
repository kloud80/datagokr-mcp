summary_user: 경기도 내 행정사사무소를 사무소 단위로 담은 현황 자료로, 사무소명(OFC_NM), 행정사 종류, 자격증 번호, 신고일자, 운영상태, 관리기관명, 데이터 기준일자를 담는다. 시민이나 분석가가 특정 시군에 운영 중인 행정사사무소가 몇 곳이고 어디가 관할하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방행정 인허가(LOCALDATA) 업종 자료와는 관리기관명이나 사무소명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 경기도 내 행정사사무소의 운영 현황을 기준으로 정리한 자료로, 각 사무소의 명칭, 행정사 종류, 자격증 번호, 신고일자, 운영상태, 소재지 관할기관 등을 포함하고 있습니다. 행정사란 행정기관에 제출하는 서류 작성, 인허가 신청, 외국인 출입국 업무 등 다양한 행정 행위를 대행할 수 있는 자격자로, 해당 데이터는 일반행정사를 중심으로 제공됩니다. 주요 항목에는 사무소명, 행정사종류, 행정사자격증번호, 운영상태, 관리기관명과 최근 데이터 기준일자 등이 포함되어 있어, 특정 지역 내 행정사무소 분포 및 운영 실태를 파악하는 데 유용합니다. 이 데이터는 시민의 행정 서비스 접근성 분석, 행정사 자격자 수요 예측, 법률행정 대행 시장 분석 등에 활용될 수 있습니다.
