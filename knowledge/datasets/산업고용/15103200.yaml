summary_user: 대전팁스타운에 입주한 기업·투자사·지원기관을 한 행씩 담은 목록 파일로, 번호·기업명·분야·입주호수만 있으며 파일 크기는 약 1.3KB의 소규모 원천 목록입니다. 창업자나 투자 관계자가 대전팁스타운에 어떤 분야의 창업기업과 팁스 운영사가 몇 호에 입주해 있는지 확인할 때 쓴다. 전역 조인 키(사업자등록번호 등)가 없어 다른 기업 데이터와는 기업명 매칭으로만 이어 쓸 수 있다.
description_portal: 해당 데이터는 창업진흥원이 관리하는 입주기업 현황 자료로, 항목은 번호, 기업명, 분야, 입주호수로 구성되어 있습니다. 대전팁스타운에는 다양한 기술 분야의 창업기업과 팁스운영사인 투자사, 창업지원기관 등이 입주해 있습니다. 해당 데이터는 26년 6월 4일을 기준으로 업데이트 되었습니다.  (주)페블러스, (주)디앤씨바이오테크놀로지, 엘엔디전자(주), 그린다에이아이(주), (주)심투리얼 등의 다양한  분야의 업체가 입주해 있습니다. 팁스 운영사로는 (재)카이트창업가재단, 주식회사 리벤처스 등이 있습니다.
