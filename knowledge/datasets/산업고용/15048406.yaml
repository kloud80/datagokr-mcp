summary_user: 전라남도 해남군이 허가한 신재생에너지 발전소를 발전소 한 곳당 한 행으로 담은 원장으로, 법인·발전소명, 설비허가 용량(kW), 설치 주소, 최초허가일, 완공·개시일을 담는다. 해남군 안에서 어느 읍면에 발전소가 몰려 있는지, 특정 연도에 허가가 얼마나 났는지 알아보려는 주민·사업자·에너지 분석가가 쓴다. 공통 조인 키는 없어서 전국태양광발전소전기사업허가정보표준데이터 같은 다른 발전소 원장과는 발전소명·주소를 맞춰 이어 쓴다.
description_portal: 전라남도 해남군 신재생에너지발전허가현황에 대한 데이터입니다.이 데이터에는 발전소명, 설비허가 용량, 설치장소, 최초허가일, 개시일 등의 항목으로 26년 1월 기준 1,883건의 데이터를 제공합니다. 읍면 기준으로 황산면이 471건으로 가장 많으며, 문내면 334건, 송지면 170건, 현산면 130건, 화산면 117건 등의 순입니다. 연도 기준으로 2017년 560건으로 가장 많으며, 2014년 294건, 2018년 291건, 2013년 192건, 2016년 181건 등의 순입니다.
