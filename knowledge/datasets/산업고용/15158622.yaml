summary_user: 한국원자력환경공단이 RI 불용선원 재활용서비스로 신청할 수 있는 선원의 현황 목록을 핵종 또는 연도로 조회해 담는 API이며, 범위는 전국 단위이고 지역을 구분하지 않습니다. 방사성동위원소를 쓰는 기관이나 사업자가 "필요한 핵종의 불용선원 가운데 지금 재활용 신청이 가능한 것이 있는가"를 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 잇는 공통 조인 키는 찾지 못했으므로, 같은 기관의 방사성폐기물 데이터와는 핵종 이름이나 연도로 맞춰 연결한다.
description_portal: '본 데이터는 핵종 또는 연도조회를 통하여 한국원자력환경공단 RI 불용선원 재활용서비스 신청이 가능한 현황목록 조회 서비스를 제공합니다. - 기준일 : 2022.08.23. 해당 데이터 포맷은 JSON+XML이며 데이터 타입은 PUBC입니다. 개발단계의 경우 별도 승인 없이 신청 후 사용이 가능하지만 운영 단계 및 상업적 이용의 경우 한국원자력환경공단의 별도 승인이 필요하며 한국원자력환경공단과의 별도 협의가 필요합니다. 개발단계 활용 시 사용자에게 별도의 비용 부과는 없습니다.'
