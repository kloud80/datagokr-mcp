summary_user: 골재자원조사 정밀조사 단계의 야외조사에서 수집한 시료를 시료 한 건 단위로 담은 원천 목록으로, 시료일련번호·골재종류·위도·경도·주소·시료지점명을 전국 범위의 개별 지점 수준으로 기록한다. 골재 개발을 검토하는 사업자나 분석가가 특정 지역에서 어떤 골재 시료가 어디서 채취됐는지 확인하고 시추·물리탐사 후보 지점을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 다른 데이터와는 위도·경도나 주소로 공간 매칭하고, 같은 골재자원조사 계열 파일과는 조사지역일련번호·시추일련번호로 이어 보는 방식이 현실적이다.
limits: 전역 조인 키가 없어 광업권·토석채취허가 등 다른 기관 데이터와 코드로 바로 연결되지 않고 이름·좌표 매칭이 필요하다. 이 파일은 시료 위치·식별 정보만 담아 시료의 시험 결과나 골재 품질 판정은 들어 있지 않다.
