description_portal: '- 데이터명 : 한국중소벤처기업유통원 판판셀러 상품 원산지 정보- 데이터 설명 :본 데이터는 통합 쇼핑몰 관리 시스템인 판판셀러를 통해 유통되는 상품들의 원산지 정보를 제공합니다. 기준연, 기준월, 함량, 원재료명, 제조국 등의 항목을 포함하며, 중소기업 제품의 구성 성분과 생산지를 명확히 파악할 수 있도록 구성되어 있습니다.* 판판셀러 : 중소기업을 위한 국내 대표 통합 쇼핑몰 연동 관리 시스템으로, 상품관리·재고·주문 등을 일괄 지원 (https://fanfanseller.kr)<데이터 항목 정보>- 기준연도: 데이터 수집 기준 연도 (예: 2020년)- 기준월 : 데이터 수집 기준 월 (예: 9월)- 함량 : 주요 성분의 함유 비율 또는 함량 정보- 원재료명 : 상품에 포함된 주요 원재료 이름- 제조국 : 해당 상품이 실제로 제조된 국가 정보'
