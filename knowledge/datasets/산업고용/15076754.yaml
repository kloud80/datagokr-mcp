summary_user: 전남 담양군에 있는 직업소개소를 한 곳당 한 행으로 상호명, 지역, 사업장 주소, 전화번호, 유료·무료 여부와 함께 담은 시군구 단위 목록이며, 파일 크기는 371바이트로 아주 작다. 담양에서 일자리를 찾는 주민이나 인력이 필요한 사업자가 근처 직업소개소와 연락처, 유료 여부를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호명을 맞춰 보거나 같은 기관의 다른 데이터와 묶어서만 연결한다.
limits: 전역 조인 키가 없어 다른 시군구 목록이나 고용 통계와 자동으로 결합하기 어렵다. 담양군 한 곳만 다루므로 전남 전체나 전국 현황은 이 파일로 알 수 없다.
