description_portal: 미국, EU, 영국, 독일, 스페인, 프랑스 등 주요국과 우리나라의 주택용 천연가스 상대가격에 관한 자료 입니다. 주택용 가스 상대가격은 각국의 에너지 가격 정책, 세금 구조, 시장 경쟁 상황을 반영하는 핵심 비교 지표로서, EIA, HEPI, 한국도시가스협회 자료를 기반으로 산출됩니다. 본 데이터는 국제 가스가격 비교 분석 및 가격 정책 수립을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연도별 각국의 주택용 천연가스 가격 및 우리나라 대비 상대 비중이 포함되어 있습니다. 본 데이터를 활용하면 국제 가스가격 수준 비교 분석, 국내 가스요금 경쟁력 평가, 가격 정책 방향 검토, 에너지 복지 정책 연구, 요금 제도 개선 검토에 기초자료로 활용할 수 있어 국제 가스시장 이해와 합리적인 가격 정책 수립에 기여할 것으로 기대됩니다.
