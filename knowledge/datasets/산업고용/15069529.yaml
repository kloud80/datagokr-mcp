summary_user: 중소벤처기업진흥공단 정책자금의 중점지원분야로 쓰이는 지역별 주력산업 목록을 지역·주력산업 두 항목으로 담은 작은 참조표(CSV 930바이트)입니다. 중소기업 대표나 분석가가 '우리 지역의 주력산업은 무엇이고 내 업종이 정책자금 중점지원 대상인가'를 확인할 때 씁니다. 전역 조인 키가 없어 지역명을 행정구역 이름으로 맞추거나 업종명을 직접 매핑해 지역 기업 현황·지원사업 공고 데이터와 이어 씁니다.
limits: 사업자번호나 표준 지역·업종 코드가 없어 기업 단위 데이터와 바로 결합할 수 없고, 이름 기반 매핑이 필요합니다. 지역별 주력산업 종류만 담은 목록이라 매출·고용 같은 산업 규모 수치는 없습니다.
