description_portal: 경기도 고양시 일산동구는 급속한 고령화 사회를 맞이하여 어르신들에게 이용 요금 할인 혜택을 제공하는 어르신 우대업소를 운영하여 어르신 이용자 분들의 경제적 부담을 완화하고 나눔의 문화를 조성하여 더불어 사는 지역사회 구현을 위한 사업을 진행 중입니다. 어르신 우대업소는 경기도 고양시 일산동구에 소재한 50개의 업소들로 만 65세 이상 어르신께 업소별 할인 혜택을 제공합니다. 업종(이용업, 미용업, 음식점, 보청기, 안경점) 업소 상호,  업소 소재지, 업소  전화번호를 첨부와 같이 공개 하오니 이용에 참고하시기 바랍니다.
