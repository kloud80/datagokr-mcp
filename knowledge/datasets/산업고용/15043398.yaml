description_portal: 이 데이터는 한국남부발전의 연도별 REC(신재생에너지 공급인증서) 기준가격 현황을 정리한 자료입니다. 연도별로 자체건설, 자체계약, 현물시장뿐만 아니라 석탄혼소, 중유혼소와 같은 다양한 공급 방식별 가격이 포함되어 있어, 신재생에너지 공급 의무화 제도의 운영 상황과 시장 변동성을 확인할 수 있습니다. 이를 통해 특정 연도의 가격 변동 추이를 분석할 수 있으며, 에너지 정책 변화나 시장 수급 여건이 가격에 미친 영향을 파악하는 데 유용합니다. 본 자료는 신재생에너지 보급 확대를 위한 정책 평가, REC 거래 전략 수립, 전력시장 분석 등 다양한 활용이 가능하며, 에너지 전환과 탄소중립 실현을 위한 기초 자료로서 의미가 있습니다.
