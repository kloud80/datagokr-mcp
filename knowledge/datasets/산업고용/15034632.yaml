description_portal: 강원특별자치도 철원군에 소속되어 있는 건축사사무소 현황입니다.현재 철원군에 등록되어있는 건축사사무소는 9개소입니다. 건축사사무소의 주요 업무는 건축물의 신축, 증축, 개축, 재축, 대수선, 용도변경, 표시변경, 건축감리, 가설건축물축조신고, 건축물 해체허가(신고) 등 전반적인 건축행위를 건축주로부터 위임받아 업무를 수행합니다.아울러, 건축사는 국토교통부장관이 시행하는 자격시험에 합격한 사람으로서 건축물의 설계와 공사감리 등의 업무를 수행하는 사람을 말하며, 건축주의 의뢰에 따라 일정한 보수를 받고 전반적인 건축업무를 수행합니다건축사사무소의 사무소명, 대표건축사명, 주소지와 대표번호를 확인하실 수 있습니다.
