summary_user: 경상남도 거제시에 신고된 이용·미용업소를 업소 한 곳당 한 행으로 담은 파일(CSV 약 130KB)로, 업종명·신고일자·업소명·도로명/지번 주소·데이터기준일자를 담는다. 거제시에서 미용실·이발소가 어느 동네에 몰려 있는지, 최근 몇 년 사이 신규 신고가 늘었는지 확인하려는 창업 예정자나 지역 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열을 맞추거나 주소를 지오코딩해 상가업소·LOCALDATA 인허가 자료와 이어 쓴다.
