summary_user: 한국가스공사가 전국에 공급한 천연가스(LNG) 총량을 연도별 행에 1월~12월 열로 펼쳐 담은 월별 집계표로, 포털 설명상 2018년 1월부터의 공급량을 톤 단위로 담는다. 분석가나 에너지 사업자가 '올해 겨울철 가스 공급량이 작년 같은 달보다 얼마나 늘었나' 같은 전년 대비·계절별 수요 변동을 확인하는 데 쓴다. 지역 구분이 없는 전국 단위 자료이고 전역 조인 키도 없어, 다른 에너지 통계와는 연도·월을 기준으로 맞춰 붙여 쓴다.
description_portal: 한국가스공사가 제공하는 전년대비 월별 총 공급량 현황은 국내 천연가스 수급현황을 파악할 수 있는 기초자료입니다. 본 데이터는 월 단위로 집계된 전국 천연가스 수요를 나타내며, 이를 통해 계절별, 월별 수요 변동, 에너지 소비 패턴 등 천연가스(LNG) 수요 패턴을 파악할 수 있는 자료입니다. 해당 공공데이터는 월별 천연가스(LNG) 총 공급량을 나타낸 자료이며, 공개된 자료의 단위는 톤(ton) 단위입니다. 공공데이터의 공개 대상 자료는 2018년도 1월부터 현재까지의 기간동안 한국가스공사 월별 전국의 천연가스(LNG) 공급량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 해당 공공데이터의 파일 형식은 csv 파일입니다.
