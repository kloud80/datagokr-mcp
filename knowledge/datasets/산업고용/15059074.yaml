summary_user: 경기도 내 기부식품 제공 사업장(푸드뱅크·푸드마켓)을 사업장 한 곳당 한 행으로 담은 현황 목록으로, 시군명·주소·위경도·등록일자·운영단체·사업자등록번호·신고구분·운영법인 유형 등 행정 정보를 담는다. 복지 담당자나 주민이 '우리 시군에서 가까운 푸드뱅크·푸드마켓은 어디이고 어느 단체가 운영하나'를 확인하거나, 분석가가 시군별 식품 나눔 기반시설 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서 시군명이나 사업자등록번호(BIZREGNO)·주소를 이름 매핑해 다른 복지·사업자 데이터와 잇고, 위경도로는 지도상 위치를 맞춘다.
description_portal: 이 데이터는 경기도 내 기부식품 제공 사업장에 대한 현황 자료로, 푸드뱅크와 푸드마켓 형태의 운영기관 정보를 포함합니다. 각 사업장의 위치, 등록일자, 운영단체, 사업자등록번호, 신고구분, 연락처, 운영법인 유형 등 조직 운영과 관련된 다양한 행정 정보가 포함되어 있으며, 취약계층에 대한 식품 지원 활동을 수행하는 사회복지 기반시설의 운영 실태를 파악할 수 있습니다. 이 데이터는 공공 식품 나눔 정책 수립, 민간 협력 네트워크 분석, 복지 사각지대 해소 및 기부 활성화 방안 마련 등 복지 행정 및 사회안전망 구축에 유용하게 활용됩니다.
