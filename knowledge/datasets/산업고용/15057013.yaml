summary_user: 경기도 내 의료기관 세탁물 처리업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 업체명·인허가일자·영업상태·폐업일자·주소·전화번호·총시설규모·위경도 좌표가 들어 있다. 보건·위생 담당자나 분석가가 '우리 시군에서 지금 영업 중인 병원 세탁물 처리업체는 어디에 몇 곳 있나' 같은 질문에 쓴다. 전역 조인 키는 없어서 같은 경기도 데이터와는 시군 코드(SIGUN_CD)로, 다른 인허가·상가 데이터와는 업체명·주소 매칭으로 잇는다.
description_portal: 이 데이터는 경기도 내 의료기관 세탁물 처리업체에 대한 사업장 정보를 포함하고 있으며, 업체명, 인허가일자, 영업상태, 주소, 전화번호, 위치좌표(WGS84 기준), 총시설규모 등 다양한 항목으로 구성되어 있습니다. 영업 중인 업체와 폐업 업체가 혼합되어 있으며, 각 사업장의 위생관리 및 공공보건 측면에서의 역할을 이해하는 데 도움을 줍니다. 이 데이터는 감염병 예방 차원의 세탁물 위생관리 정책 수립, 의료지원 인프라 분석, 공공보건 기반 마련, 환경 및 안전관리 기준 수립, 지역 기반 위생산업 분포 조사 등에 활용될 수 있습니다.
