description_portal: 지표지질조사(물리탐사)를 수행하여 작성한 조사보고서로, 공단 국가광물자원지리정보망(KMRGIS)에 구축된 물리탐사보고서 목록임. 이 데이터는 국내 다양한 광산에서 수행된 물리탐사 결과를 체계적으로 정리한 것으로, 각 보고서에는 탐사 목적, 방법, 대상 지역, 주요 결과 등이 포함되어 있습니다. 물리탐사는 지하 구조, 광상 분포, 오염 및 광해 현황 파악 등 광산 환경의 안전성과 자원 개발 가능성을 평가하는 데 중요한 역할을 합니다. 특히, 지하수 흐름, 지반 안정성, 오염물질 이동 경로 등 다양한 환경 요소를 비파괴적으로 조사할 수 있어 친환경적이고 효율적인 탐사 방법으로 활용되고 있습니다. 해당 데이터는 연구자, 정책 입안자, 기업 등이 광산 개발 및 환경 관리에 필요한 기초자료로 활용할 수 있으며, 공공데이터포털을 통해 누구나 무료로 접근할 수 있습니다
