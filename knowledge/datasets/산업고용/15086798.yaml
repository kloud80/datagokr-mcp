description_portal: 한국서부발전 태안화력에서 사용중인 유기성 고형연료의 최근 3년간 총 사용량 입니다. 석탄 대체 연료로 활용되는 바이오매스 기반 유기성 고형연료의 월별 투입현황을 보여주는 자료입니다. 유기성 고형연료는 목재 부산물, 농업 폐기물, 음식물류 폐자원 등을 가공하여 고형화한 것으로, 화석연료 사용을 줄이고 탄소 배출을 저감하기 위한 친환경 연료입니다. 해당 데이터는 연료전환 정책과 온실가스 감축 효과 분석의 근거자료로 활용됩니다. 또한 계절별 및 기간별 사용 추이를 통해 안정적인 연료 공급망 확보 여부와 친환경 발전 운영 성과를 평가할 수 있습니다.
