description_portal: '한국지역난방공사의 전자계약 제안기술평가위원 현황을 정리한 데이터로, 주요 사업 입찰 시 구성된 평가위원의 내외부 구분 및 선정 진행상황을 통해 공정한 기술평가 체계 운영 현황을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 입찰공고번호: 평가가 이루어진 입찰 공고의 고유 번호(예시: 100354-20163)■ 공고명: 기술평가가 실시된 사업명(예시: 데이터 관리체계 수립 및 표준화시스템 구축사업)■ 사후관리부서: 평가를 담당하는 내부 관리 부서명(예시: 정보시스템처 정보기획부)■ 내외부구분: 평가위원의 소속 유형(예시: 내부, 외부)■ 평가위원 선정 진행상태: 평가위원 구성 및 선정 여부(예시: 선정완료, 진행중)■ 위원명(익명화): 개별 평가위원 식별을 위한 익명화된 번호(예시: 1, 2, 3, 4, 5)3. 활용 예제:■ 입찰공고별 평가위원 구성 현황을 분석하여 기술평가의 공정성 및 외부전문가 참여 비율 평가■ 평가위원 내외부 비중 데이터를 기반으로 투명한 평가체계 확립 및 계약관리 개선방안 수립■ 공공입찰 기술평가 운영절차의 객관성 강화 및 평가위원 데이터베이스(DB) 관리 효율화 자료로 활용'
