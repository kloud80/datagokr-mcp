summary_user: 경상남도 창원시가 지정한 담배소매인을 업소 한 곳씩 담은 건별 원장으로, 지정번호·업소명·도로명주소·지정일자·영업구분 등을 담은 CSV 파일(약 356KB)이다. 창원시 안 특정 동네에 담배 판매점이 어디에 몇 곳 있는지, 언제 지정됐는지 확인하려는 주민·예비 사업자나 소매점 분포를 보는 분석가가 쓴다. 전역 조인 키가 없어 업소도로명주소로 주소·좌표를 매칭하거나 업소명으로 지방행정 인허가(LOCALDATA) 다른 업종 원장·상가업소 데이터와 이어 쓴다.
description_portal: 지방자치단체에서 허가·지정한 담배소매인의 현황을 담은 자료입니다. 본 자료는 지정된 소매인의 업종, 운영지역, 지정 시점, 금연구역 준수 여부, 관련 행정정보 등을 종합하여 제공하며, 민원처리, 단속·지도, 통계분석, 정책 수립 등 다양한 공공행정에 활용할 수 있습니다.본 자료는 지정 소매인의 분포와 변화 추이를 살펴볼 수 있어, 보건·금연 정책 수립, 지역사회 통계 분석, 민원 응답, 지도점검 업무 등에 유용합니다.데이터 양이 많아 일반 뷰어에서 일부만 표시될 수 있으므로 분석 전용 소프트웨어(R, Python, GIS 등) 사용을 권장합니다.세부 항목 및 정의는 제공기관의 메타데이터 설명서나 공공데이터포털 기술문서를 참고해주세요.
