description_portal: '본 데이터는 「에너지이용합리화법」 제15조에 따라 신고된 효율관리기자재의 연도별·품목별 신고 현황을 제공합니다.효율관리기자재는 총 33개 품목으로 구성되어 있으며, 2012년부터 현재까지 신고된 제품 현황을 연도별로 제공합니다.본 데이터를 통해 소비자는 고효율 제품 선택 시 참고할 수 있으며, 기업 및 연구기관에서는 품목별 시장 현황 분석, 효율 기준 강화 및 에너지 효율 향상 정책 수립에 유용하게 활용할 수 있습니다.-품목(33개) : 전기세탁기, 전기냉온수기, 전기밥솥, 전기진공청소기, 선풍기, 공기청정기, 백열전구, 형광램프, 안정기내장형램프, 삼상유도전동기, 가정용가스보일러, 어댑터및충전기, 전기냉난방기, 상업용전기냉장고, 가스온수기, 변압기, 창세트, 텔레비전 수상기, 전기온풍기, 전기스토브, 멀티전기히트펌프시스템, 제습기, 전기레인지, 셋톱박스, 컨버터 내장형 LED 램프, 컨버터 외장형 LED 램프, 냉동기, 사이니지디스플레이, 공기압축기, 의류건조기'
