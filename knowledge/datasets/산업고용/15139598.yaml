summary_user: 독성가스 등 고위험 가스 용기 누출 시 용기를 밀봉해 중화처리 시설까지 옮기는 비상대응장비(ERCV)를 보유한 국내 업소를 업소 한 곳(장비 한 건)씩 정리한 전국 범위의 작은 파일(csv 약 1.5KB)로, 업소명·주소·장비명·수용 용량(L)을 담는다. 독성가스 사고 대응 담당자나 가스 안전관리자가 '사고 지점 근처에서 이 용기 크기를 담을 수 있는 ERCV를 가진 업체가 어디인가'를 찾는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 업소명이나 주소 문자열 매칭으로만 이을 수 있고, 고압가스 업종 인허가 원장(LOCALDATA 에너지 업종)과 대조하는 보조 자료로 쓴다.
