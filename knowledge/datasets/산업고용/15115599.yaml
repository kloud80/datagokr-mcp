summary_user: 서울 양천구 관내 청소년게임제공업소(인형뽑기방·오락실 등 전체이용가 게임물 제공 업소)의 인허가 정보를 업소별로 담은 원장 자료로, 인허가일자·폐업일자·영업상태·소재지(지번·도로명)·시설면적·층수·좌표(X, Y) 등을 담는다. 구청 담당자나 연구자·시민이 '양천구에 현재 영업 중인 인형뽑기방·오락실은 어디에 몇 곳이고 언제 생기고 문을 닫았나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓰며, 다른 지자체 LOCALDATA 업종 인허가 자료와 같은 형식으로 묶어 볼 때 쓴다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 청소년게임제공업체의 인허가 정보를 종합적으로 관리하고 활용하기 위해 수집된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 업종구분, 시설면적, 층수,  총게임기수, 제공게임물명 등 핵심 항목이 포함되어 있어 각 사업장의 설립과 운영 실태를 체계적으로 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관에서 청소년게임제공업체 관리, 감독, 정책 수립, 안전 점검 등에 활용할 수 있으며, 연구자와 시민은 지역별 게임시설 분포, 서비스 유형 분석 등 다양한 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 청소년게임제공업 - 인형뽑기, 오락실 등 전체이용가 게임물을 설치하여 제공하는 업소정보
accrual_periodicity: 수시
