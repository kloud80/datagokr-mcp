summary_user: 충청남도 보령시 관내 고압가스저장설비를 사업소 한 곳당 한 행으로 담은 원장형 파일로, 상호·사업 종류·소재지 주소·영업구분·허가일자·취급가스와 저장 용량·단위를 담는다. 소방서·안전관리 담당자나 주민이 '우리 동네 근처에 어떤 가스를 얼마나 저장하는 시설이 있는가'를 확인하거나 시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소 소재지 주소나 상호를 기준으로 맞춰 이어 쓰고, 다른 시군의 고압가스·LPG 등 에너지 업종 인허가 현황과는 같은 항목끼리 붙여 비교한다.
description_portal: 산업화 진전과 도시가스 공급 확대로 고압가스 사용량이 증가하고, 가스 사고 예방 및 안전관리 강화를 위한 체계적인 정보 관리 필요성이 대두되며, 시민의 안전권 보장과 투명한 위험시설 정보 공개에 대한 요구가 높아짐에 따라 충청남도 보령시는 관내 고압가스저장설비의 사업자 정보, 취급가스 종류, 허가현황 등 종합적인 안전관리 정보를 제공하고 있습니다.개방 데이터는 고압가스저장설비의 법인명-상호, 사업종류, 사업소 소재지, 영업구분, 허가일자, 취급가스정보 등 총 6개 항목 16건의 상세 정보를 포함하고 있습니다.안전관리기관·소방서는 고압가스시설 현황 파악을 통해 안전점검 및 사고 대응 계획 수립에 활용하고, 시민·지역주민은 거주지 인근 고압가스시설 정보 확인을 통해 안전 위험요소 인지 및 대비에 활용하며, 연구기관·학계는 지역별 위험시설 분포 분석 및 산업안전 정책 연구에 활용할 수 있습니다.
