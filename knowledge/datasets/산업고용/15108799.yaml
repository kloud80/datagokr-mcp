summary_user: 수원시를 100m×100m 격자(그리드아이디) 단위로 나눠 2019~2021년 월별·연간 전기에너지 사용량(kWh)의 최소·최대·합계·평균을 담은 집계 파일이다. 도시계획·에너지 분석가가 '수원시 안에서 어느 블록의 월별 전력 사용이 가장 많고 계절에 따라 어떻게 달라지는가'를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 격자 식별자(그리드아이디)를 같은 격자 체계를 쓰는 다른 격자 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
