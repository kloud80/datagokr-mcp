summary_user: 고용24·워크넷에 쌓인 구인공고를 분석해 구인 기업이 등록 때 고른 직종별로 표준 직무내용, 요구 직무능력, 전공, 자격증을 정리한 전국 단위 직무기술서 파일입니다(포털 설명상 3,662건). 구직자나 진로·훈련 담당자가 '이 직종에 지원하려면 기업이 어떤 전공과 자격증을 요구하나'를 확인할 때 쓴다. 실측 컬럼에 고용직업분류 코드 같은 전역 조인 키가 없어서, 채용공고·직업훈련·직업사전 데이터와는 직종 이름을 맞춰 매핑해야 이어 쓸 수 있습니다.
description_portal: ‘한국고용정보원_구인표준직무기술서’는 고용노동부로부터 한국고용정보원이 위탁 받아 운영하고 있는 고용24 또는 워크넷 시스템에 그간 축적된 구인 기업들의 구인 공고 데이터를  분석 및 가공하여 직종, 직무내용, 직무능력내용, 직무전공내용, 직무자격증내용으로 분류한 데이터 입니다. 구인 기업들이 구인 공고 등록 시 선택한 직종을 기준으로 자격증, 전공 내용, 직무 내용, 직무능력내용, 직무자격증내용으로 구성 되어 있습니다. 이 데이터의 중요 내용은 구인 기업이 직무 내용에 따라 구직자에게 요구 하는 자격증, 전공 내용이고 관련 구인표준직무기술서의 데이터는 3662건으로 구성되어 있습니다. 사용자는 해당 데이터를 직접 다운로드하여 분석 할 수 있으며, 직종별 기업이 요구 하는 인재의 전공, 자격증 내용을 분석하여 활용 가능 합니다.
