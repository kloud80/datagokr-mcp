description_portal: '창업진흥원이 제공한 기업 생애주기별 통계자료로, 업종 및 기업형태에 따라 1년차부터 7년차까지 연차별 기업 수를 나타냅니다. 구성 항목은 구분별 항목(업종 또는 기업형태), 세부 분류(예: 제조업, 법인 등), 전체 기업 수, 연차별 기업 수(1~7년)로 이루어져 있습니다. 업종에는 도소매업, 제조업, 건설업, 정보통신업 등 주요 산업군이 포함되며, 기업형태는 개인과 법인으로 구분됩니다. 따라서 이 자료는 업종별 창업 후 지속 생존 비율과 기업군의 성장 흐름을 연도별로 분석할 수 있어, 창업정책 수립, 산업분석, 행정계획 수립 등 다양한 분야에 활용될 수 있습니다.'
