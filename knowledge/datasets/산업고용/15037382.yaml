summary_user: 직업훈련 과정 검색에 쓰는 훈련지역·훈련분야·KECO·NCS·훈련종류 같은 공통코드를 코드값·코드명·사용여부 단위로 돌려주는 전국 범위의 코드 마스터 API다. 훈련과정 조회 API를 붙이는 개발자나 분석가가 '이 훈련분야 코드는 어떤 이름이며 지금도 쓰이는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 훈련과정 데이터에 나오는 코드값과 코드값(rsltCode)·코드명을 직접 맞춰 이어 쓴다.
description_portal: '검색조건이나 검색 결과에 필요한 각종 코드에 대한 정보를 제공합니다. *훈련지역이나 훈련 분야와 같은 코드성 정보 제공훈련지역이나 훈련 분야와 같은 코드성 정보에 대한 정보를 제공하며, 각 화면단에서 코드값을 제공한 경우에는 이 API에서는 제외됩니다.검색조건 및 검색 결과에 필요한 각종 코드에 대한 정보를 제공합니다. 공통코드 구분, 공통코드 구분에 따른 검색값1, 공통코드 구분에 따른 검색값2 등을 파라미터로 받아 검색된 총 건수, 공통코드명칭, 코드값, 코드명, 사용여부 등의 결과를 제공합니다. * 유의사항:  문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
