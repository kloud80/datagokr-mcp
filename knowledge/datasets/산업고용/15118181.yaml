description_portal: 본 데이터는 주별 부피단위 산업용 천연가스 및 경쟁연료(액화석유가스, 벙커씨유)의 가격 정보입니다.산업용 연료 가격의 주별 동향 분석 및 연료 전환 정책 수립 지원을 목적으로 수집됩니다. 데이터 구성 항목으로는 연월(주차 포함), 액화천연가스 가격(원), 벙커씨유 가격(원), 액화석유가스 가격(원) 등이 포함되며, normal cubic meter당 원단위로 기재됩니다. 벙커씨유는 황함량 0.3퍼센트 기준입니다. 본 데이터를 활용하면 주별 연료 가격 변동 추이를 세밀하게 분석할 수 있습니다. 이를 통해 단기 연료 스위칭 현상 분석, 실시간 에너지 비용 관리, 산업용 연료 조달 시점 결정, 가격 변동성 분석에 참고자료로 활용할 수 있으며, 에너지 시장의 단기 동향 연구, 가격 예측 모델 개발, 기업의 연료 조달 의사결정 지원, 시장 변동성 연구에도 유용한 기초자료가 됩니다.
