description_portal: 청년근로자의 중소기업 유입과 자산형성을 목적으로 하는 "청년내일채움공제" 가입기업 소재지별 청년근로자(핵심인력) 현황(가입자수, 비율)입니다.* 청년내일채움공제 사업은 2023년 12월을 마지막으로 가입자를 받고 사업이 일몰되어 관련하여 더이상 데이터가 업데이트 되지 않습니다.** 가입 청년근로자 비율은 2016년-2023년 전체 총 가입인원인 580,924명 대비 지역별 가입 청년근로자 수를 뜻합니다.*** 해당 데이터의 기업 소재지는 청년내일채움공제 가입시에 기업과 근로자가 제출하였던 서류를 기반으로 작성되었으므로, 가입기간 중 기업의 소재지 변경 등이 반영되어있지 않습니다.
