description_portal: 한국가스공사에서 운영 중인 생산기지에 적용되는 기자재의 국산화율 현황 정보입니다.LNG 터미널의 기술자립도 향상 현황 파악 및 국산화 정책 수립 지원을 목적으로 수집되었습니다. 데이터 구성 항목으로는 기준일자, 국산화율(퍼센트), 국산화 대상 품목 수, 국산화 완료 품목 수 등 국산화 추진 현황에 관한 핵심 지표가 포함됩니다. 본 데이터를 활용하면 액화천연가스를 인수하고 저장하여 전국배관망으로 송출하기 위한 LNG 터미널 기자재의 국산화 척도와 추진 현황을 체계적으로 파악할 수 있습니다. 이를 통해 LNG 터미널 기자재 국산화 정책 수립, 관련 중소기업의 기술개발 방향 설정 및 시장 진출 전략 수립에 참고자료로 활용할 수 있으며, 에너지 산업 핵심설비 국산화 연구, 산업 경쟁력 분석, 공급망 안정화 전략 수립에도 기초자료가 됩니다.
