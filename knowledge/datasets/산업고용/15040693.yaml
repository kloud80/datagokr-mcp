summary_user: 위해상품판매차단시스템이 유통사(업체코드)별로 보낸 검사결과 정합성(대사) 체크 요청을 요청 건 단위로 담으며, 요청일자·전송상태·전송일자·최종 수신일자·재송신건수가 들어 있다. 위해상품 정보가 연계 유통사 매장에 제대로 전달·수신됐는지, 재송신이 얼마나 일어났는지 확인하려는 시스템 운영자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 시스템의 다른 데이터와는 업체코드를 맞추는 방식으로만 이을 수 있다.
description_portal: 산업통상자원부 국가기술표준원, 환경부, 식품의약품안전처는 시중에 유통되는 상품을 수거하여 유해물질 포함 여부와 같은 위해성 여부를 판정한 후 위해상품으로 확인된 경우 해당 내용을 공표합니다. 대한상공회의소 유퉁물류진흥원에서 운영 중인 이 시스템은 해당 상품정보를 유통사에 전달하기 위해 등록 및 전송하는데 활용되며, 유통사로 전달된 정보는 이 시스템과 연계된 전국 매장에서는 위해상품의 유통을 차단하는 역할을 수행합니다. 이 데이터는 위해상품판매차단시스템에서 제공되는 검사결과 정합성 정보입니다.
