description_portal: 'ㅁ 해당 데이터는 26년 2분기(6월) 기준의 데이터로, 데이터가 없는 날짜는 출력제어 실적이 없는 기간입니다.제주 태양광 제어횟수, 제주 풍력 제어량 및 제어횟수 데이터는 신규 실적이 없는 관계로, 과거 주기성 데이터를 참고하시기 바랍니다. *제주지역 단위 : 건, MWh ㅁ 2024.8.14 신규생성 (아래 두 목록 통합을 위해 생성) ㅇ 한국전력거래소_시간별 제주 태양광 풍력 제어량 및 제어횟수 ㅇ 한국전력거래소_시간별 지역별 육지 태양광 제어횟수 ㅇ 두 목록은 해당 목록에 과거 데이터 업데이트 후 삭제 될 예정입니다.※발전제어량은 제어대상 설비의 차단시점 발전량을 차단시간으로 환산한 값으로 기상상황, 지리적 위치, 설비의 성능에 따라 유동적이므로 단순 참고 사항임을 알려드립니다.※태양광 제어량은 별도 산정하고 있지 않습니다.※날짜가 비어있는 부분은 데이터 누락이 아닌 제어가 발생하지 않은 것입니다.'
