summary_user: 전국 태양광·풍력 발전의 출력제어 횟수와 제주 풍력 제어량(MWh)을 일자·제어지역별로 1시~24시 시간대 칸에 담은 집계 파일이며, 범위는 전국이고 지점 좌표 같은 공간 정보는 없다. 분석가나 신재생 사업자가 어느 지역에서 언제, 몇 시간대에 출력제어가 몰렸는지 확인하는 데 쓴다. 전역 조인 키는 없어서 제어지역 이름을 기준으로 지역별 태양광 발전사업 허가 표준데이터 같은 신재생 설비 원장과 이름 매핑으로 이어 쓴다.
limits: 전역 조인 키가 없어 발전소 단위 연결은 하지 못하고, 지역 이름 매핑으로만 다른 데이터와 붙일 수 있다. 포털 설명에 따르면 날짜가 비어 있는 것은 누락이 아니라 제어가 없었던 기간이다. 또 태양광 제어량은 산정하지 않고, 제주 풍력 제어량은 차단시점 발전량을 환산한 참고값이다.
