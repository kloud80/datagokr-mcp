summary_user: 소재부품 신뢰성 인증을 인증 건별로 담은 전국 단위 파일(csv, 약 162KB)로, 분야·평가기관·인증번호·품목·제품·업체명·등록일자를 기록한다. 부품 구매 담당자나 분석가가 '이 업체의 이 제품이 신뢰성 인증을 받았는지, 어느 평가기관에서 언제 받았는지'를 확인하는 데 쓴다. 인증번호(reliability_cert_no)가 실측 조인 키이며, 사업자번호나 좌표 같은 다른 공통 키는 없어서 다른 기업·인허가 데이터와는 업체명으로만 느슨하게 맞춰 볼 수 있다.
description_portal: '본 데이터셋은 소재부품의 신뢰성 인증현황 정보를 제공하는 데이터입니다. 신뢰성 인증 정보는 특정 분야별, 평가기관, 인증번호, 품목, 제품 등의 세부 정보를 통해 체계적으로 구성되어 있습니다. 이 데이터는 관련 산업 및 기업의 인증 현황을 모니터링하고 분석하는 데 유용하게 활용될 수 있습니다. 이를 통해 기업들은 자사의 제품이나 업체의 인증 현황을 쉽게 확인할 수 있으며, 신뢰성 있는 소재부품에 대한 수요에 부응할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 번호(숫자형), 분야(문자형), 평가기관(문자형), 인증번호(문자형), 품목(문자형), 제품(문자형), 업체명(문자형), 등록일자(날짜형)로 구성되어 있습니다. 이러한 세부 정보는 데이터를 사용하는 다양한 이해관계자들에게 신뢰성 인증의 현황을 명확히 전달하는 데 기여할 것입니다.'
