summary_user: 광주광역시도시공사가 운영하는 태양광 발전소를 발전소 한 곳당 한 행으로 정리한 소규모 원장 파일(CSV 약 1.2KB)로, 구분·주소·설비용량(kW)·공급전압(V)·준공일·추진형태를 담는다. 광주 지역 공공 태양광 설비가 어디에 얼마 규모로 언제 준공됐는지, 어떤 방식으로 추진됐는지 확인하려는 분석가·주민의 질문에 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과는 주소나 발전소 이름을 맞춰 붙여야 한다.
description_portal: 광주광역시도시공사에서 운영 중인 태양광 발전소의 주요 정보를 정리한 데이터입니다. 본 데이터는 구분, 주소, 설비용량(kW), 공급전압(V), 준공일, 추진형태, 데이터기준일자 항목으로 구성되어 있습니다. 발전소별 위치와 발전 설비의 규모, 전력 공급 조건 및 준공 시점을 파악할 수 있어 신재생에너지 인프라의 현황을 이해하는 데 유용합니다. 또한, 설치 방식이나 운영 주체 등 추진 형태에 대한 정보도 포함되어 있어 사업 모델 분석에도 활용할 수 있습니다. 각 항목은 표준화된 형식으로 구성되어 있으며, 공공데이터 이용자가 내용을 쉽게 비교하고 활용할 수 있도록 설계하였습니다. 이 데이터는 친환경 에너지 정책 수립, 에너지 생산량 예측, 환경 관련 연구 등 다양한 분야에 기초자료로 활용 가능합니다. 검색 편의를 고려하여 설명과 키워드를 구성하였습니다.
