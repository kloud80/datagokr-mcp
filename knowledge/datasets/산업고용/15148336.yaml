description_portal: 우리나라는 탄소중립기본법에 따라, 2030년까지 수송부문 온실가스 를 2018년 대비 37.8% 감축하는 것을 목표로 하고 있고, 이에 따라, 업체의 온실가스 배출량 관리를 위해 목표관리제와 배출권거래제를 시행하고 있습니다.KOTEMS 시스템과 파일을 통해, 교통부문 온실가스 목표관리제 및 배출권거래제 지정 업체 현황을 제공하고 있으며, 목표관리제의 개요 및 지정 기준, 절차 등 제도의 전반적인 정보와 프로세스를 파악할 수 있습니다.목표관리제의 전체적인 흐름은 (1) 관리업체 선정 (2) 명세서 제출 (3) 감축목표 설정 (4) 이행게획 제출 (5) 이행실적보고서 제출의 5단게로 이행되며, 업체기준 50,000톤 이상/사업장기준 15,000톤 이상의 온실가스를 배출할 경우 목표관리 업체로 지정됩니다.
