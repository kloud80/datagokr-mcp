summary_user: 서울특별시 금천구의 게임물배급업 인허가 대장을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·주소·사업장명·시설면적·좌표(X, Y) 등을 포함한다. 창업 준비자나 상권 분석가가 '금천구에 영업 중인 게임물배급업체가 어디에 몇 곳 있고 언제 인허가·폐업했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 공통 원천의 다른 업종 데이터와 같은 형식으로 묶어 볼 수 있다.
description_portal: 금천구에서 운영되는 게임물배급업의 인허가 및 영업 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명, 시설면적, 업종 구분, 총게임기수, 편의시설, 소방시설, 청소년실 여부 등 다양한 세부 항목을 포함하고 있습니다. 이를 통해 게임 산업 관련 창업 계획 수립, 지역 내 게임업체 분포 분석, 시설 안전 점검, 업계 현황 조사 등 여러 분야에서 활용할 수 있습니다. 또한 해당 데이터는 게임물 유통 구조 파악, 안전관리 강화, 청소년 보호 정책 마련, 지역 상권 분석 등에도 유용한 기초 자료로 쓰이며, 행정기관·연구기관·민간기업 모두에서 참고할 수 있는 실효성 높은 정보입니다.
