summary_user: "육지·제주·통합 계통한계가격(SMP)을 연도·월 단위로 집계한 표로, 전국 범위의 비공간 데이터이며 3.7KB 남짓한 CSV 파일 한 개로 제공된다(단위: 원/kWh). 발전사업자나 에너지 분석가가 '최근 몇 년 사이 제주 SMP가 육지보다 얼마나 높았고 월별로 어떻게 움직였나' 같은 도매 전력가격 추이를 비교할 때 쓴다. 지역 코드 같은 전역 조인 키는 없어서, 다른 전력 수급·발전량·REC 데이터와는 연도·월을 맞춰 붙여 쓴다."
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 육지, 제주, 통합 월별 계통한계가격 데이터를 제공합니다.ㅇ 해당데이터는 전력정보앱에서도 확인가능하며 연 1회 갱신됩니다.ㅇ 링크 : https://www.kpx.or.kr/nationalPowerForecastYear.es?mid=a30503000000&device=mbl__생성 및 수집목적__전기사업법 및 전력시장 운영규칙에 따라 안정적인 전력시장 및 계통운영을 위해 데이터를 생성, 수집하고 있습니다.__활용성__ㅇ 육지 제주 통합 월별 계통한계가격의 데이터를 확인가능합니다.ㅇ 년도, 월, 육지계통한계가격, 제주계통한계가격, 통합계통한계가격 데이터를 제공합니다.(단위:원/kWh)'
