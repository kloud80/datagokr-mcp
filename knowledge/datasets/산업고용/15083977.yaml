summary_user: 서울 서대문구 관내 사료제조업 사업장을 한 곳씩 담은 인허가 원장으로, 사업장명·지번/도로명 주소·전화번호·인허가일자·영업상태·폐업일자·중부원점TM(EPSG:5174) 좌표를 담는다. 사업자나 지자체·분석가가 "서대문구에서 지금 영업 중인 사료제조업체는 어디이고 언제 허가를 받았나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 지역·업종의 지방행정 인허가(LOCALDATA) 데이터와는 같은 컬럼 구조와 기관 코드(OGDP_INST_CD)·관리번호로, 다른 데이터와는 주소나 사업장명 매칭으로 이어 쓴다.
description_portal: '서울특별시 서대문구 관내 위치한 사료제조업 현황(사업장명, 주소, 전화번호, 좌표 등)에 대한 데이터를 제공합니다.서대문구 사료제조업 데이터는 서대문구내 사료 업소의 위치와 영업 상태 파악에 유용하며 사료 안전 관리, 지역 농업 지원 정책 수립 등에 활용할 수 있습니다.서대문구 사료제조업 현황 데이터의 주요항목은 사업장명, 주소, 영업상태, 좌표, 인허가일자 등이 포함되어있습니다.이 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.  좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보'
