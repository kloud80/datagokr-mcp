summary_user: 로컬크리에이터 사업을 주관하는 전국 창조경제혁신센터의 지역, 기관명, 주소를 기관 한 곳당 한 행으로 담은 소규모 명단 파일(CSV 612바이트)이다. 지역 창업기업이나 예비 로컬크리에이터가 '우리 지역의 로컬크리에이터 주관기관은 어디이고 주소는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 지역명이나 기관명을 기준으로 다른 창업지원 기관·공고 데이터와 이름 매칭으로만 연결한다.
limits: 공식 조인 키가 없어 다른 데이터와는 지역명·기관명 문자열 매칭에 의존해야 한다. 명세상 수시·이벤트성으로 한 번 생성된 뒤 바뀌지 않는 자료이므로, 현재 주관기관 지정 현황이나 이번 달 지원사업 공고는 별도로 확인해야 한다.
