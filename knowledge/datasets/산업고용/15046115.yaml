description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 발전설비를 연료원에 따라 분류한 정보(원자력,유연탄,무연탄,유류,LNG,양수,신재생,기타) *단위 : MWㅇ 작성주기 : (비정기) 중앙발전기 상업운전시 또는 비중앙 계통병입일기준 100MW증가시※ 구역전기사업설비, 자가용전기설비는 설비용량 산정 제외'
