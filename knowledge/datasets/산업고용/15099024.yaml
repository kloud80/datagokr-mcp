summary_user: 경상남도 사천시에 등록된 전문건설업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 36KB)로, 상호·업종·도로명주소·등록일자·데이터기준일자를 담는다. 발주처나 시민이 '사천시 안에서 특정 전문건설 업종으로 등록된 업체가 어디에 있고 언제 등록했는가'를 확인하거나, 지역 건설업체 분포와 등록 시기를 분석하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호·도로명주소를 이름 매칭하거나 같은 기관의 데이터와 대조하는 방식으로만 이어 쓴다.
description_portal: '경상남도 사천시 관내에 등록된 건물 건설업체에 대한 상세 현황 정보를 공공데이터로 제공하고 있습니다. 이 자료는 사천시의 건설 산업 동향을 파악하고, 발주처 및 시민들에게 신뢰성 있는 정보를 제공하기 위해 마련되었습니다.제공되는 주요 데이터 항목은 다음과 같습니다:상호: 건설업체의 공식 명칭업종: 등록된 건물 건설업의 구체적인 분류 (예: 일반건축공사업, 전문건설업 등)도로명주소: 업체의 소재지를 정확히 파악할 수 있는 도로명 주소등록일자: 해당 업체가 사천시에 건설업으로 정식 등록된 날짜이 데이터를 통해 지역 건설 시장의 규모, 업체 분포, 등록 시기 등을 분석할 수 있으며, 건설 프로젝트 관련 정보 검색 및 지역 경제 연구의 기초 자료로 유용하게 활용될 수 있습니다.'
