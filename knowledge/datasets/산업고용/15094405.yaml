summary_user: 서울특별시 서초구 내 고압가스업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·휴폐업 일자·사업장명·지번/도로명 주소·제조구분·업태·좌표를 포함한다. 서초구에서 현재 영업 중인 고압가스 제조·판매 업소가 어디에 있고 언제 허가받았는지 확인하거나, 안전 점검 대상 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 시군구의 같은 업종 인허가 파일과 묶어 지역 비교에 쓴다.
description_portal: '서울특별시 서초구 내 고압가스업체의 인허가 및 영업 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 폐업 및 휴업 정보, 사업장명, 소재지 주소, 전화번호, 제조구분, 사업장 부지용도, 업태 구분, 좌표 정보 등 다양한 항목을 포함하여 고압가스 관련 업소의 현황을 체계적으로 확인할 수 있습니다. 이를 통해 고압가스 안전 관리 체계를 강화하고, 관련 업계의 현황이나 동향을 분석하는 데 활용할 수 있습니다. 또한 사업장 위치와 용도 구분에 대한 정보가 함께 제공되어 지도 기반 서비스 개발, 위험물 관리, 행정 업무 지원, 안전 점검 계획 수립 등 여러 방면에서 유용합니다. 나아가 정책 수립, 연구, 지역 사회 안전망 구축 등 다양한 목적에 기여할 수 있는 가치 높은 공공 데이터입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
