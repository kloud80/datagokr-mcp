limits: 업소 단위 상호·업종·위치만 있어 매출이나 유동인구는 이 데이터로 알 수 없다. 업종분류는 표준산업분류(10차) 기반이며 정제에 따라 상권업종분류 연계표와 다를 수 있다. 갱신 주기는 근거 자료에서 확인되지 않았다.
