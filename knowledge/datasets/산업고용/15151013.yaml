description_portal: 한국동서발전에서 제공하는 경주 풍력발전 스카다(SCADA) 데이터는 풍력발전기의 운전 상태, 성능, 환경 요인을 실시간으로 수집·기록한 자료입니다. 데이터에는 발전기별 일시, 가동시간, 정지시간, 전력 생산량, 풍속, 풍향, 온도, 압력, 피치각, 로터 회전속도 등 세부 운전 정보를 포함하고 있어, 풍력발전 설비의 효율성과 안정성을 평가하는 데 활용됩니다. 해당 데이터는 발전기의 이상 징후 탐지, 고장 예측, 유지보수 주기 최적화 등 운영 효율 향상뿐 아니라, 기상 조건에 따른 발전량 변화 분석에도 유용합니다. 학계와 연구기관에서는 이를 기반으로 풍력 터빈 제어 알고리즘 개선, 풍황 예측 모델 연구, 에너지 생산 최적화, 설비 성능 비교분석 등 다양한 실증 연구를 수행할 수 있습니다.
