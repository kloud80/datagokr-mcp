summary_user: 서울시 행정동별 유동인구를 기준 분기(STDR_YYQU_CD) 단위로 집계한 데이터로, 총·남녀·연령대(10대~60대 이상)·시간대(6구간)·요일별 유동인구 수를 담는다. 창업을 준비하는 사업자나 상권 분석가가 '이 행정동은 어느 시간대·요일에 어떤 연령층이 많이 다니는가'를 따져 입지와 영업시간을 정하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 행정동 코드·이름(ADSTRD_CD, ADSTRD_CD_NM)을 매핑하거나 같은 서울시 상권분석서비스의 다른 행정동 단위 자료와 기관 코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 서울시 행정동 단위의 유동인구 현황을 분기별로 제공하는 공공데이터입니다. 각 행정동별 총 유동인구 수와 남성·여성 인구 수, 그리고 10대부터 60대 이상까지 연령대별 인구 분포를 포함하고 있습니다. 이를 통해 특정 지역의 성별 및 연령별 인구 구조를 세밀하게 파악할 수 있으며, 인구 유입과 분포 특성을 분석할 수 있습니다. 본 자료는 지역 상권의 규모와 소비층을 이해하는 데 유용하며, 행정동별 특성을 반영한 상권분석, 도시계획, 생활SOC 배치, 복지·교육 정책 수립 등 다양한 공익적 활용이 가능한 기초 통계 데이터입니다.
