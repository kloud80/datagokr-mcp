summary_user: 서울시 행정동별 가계 소비 지출을 분기(STDR_YYQU_CD) 단위로 집계한 자료로, 총지출액과 식료품·의류신발·생활용품·의료·교통·교육·오락·여가문화·기타·외식 등 항목별 지출액을 담는다. 상권 분석가나 창업 준비자가 '이 동네 주민은 외식이나 교육에 얼마를 쓰는가'처럼 행정동 간 소비 구조를 비교하는 데 쓴다. 행정동 코드(ADSTRD_CD)·행정동명과 기준 분기로 같은 기관의 상권분석서비스 다른 데이터와 맞춰 쓰지만, 실측상 전역 조인 키는 없어 이름·코드 매핑이 필요하다.
description_portal: 이 데이터는 서울시 각 행정동 단위의 가계 평균 소득과 소비 지출 현황을 분기별로 제공하는 자료입니다. 각 행정동의 월평균 소득과 소득구간을 제시하며, 총지출액을 비롯해 식료품비, 의류·신발, 생활용품, 의료비, 교통비, 교육비, 오락 및 여가, 문화 관련 지출, 기타 지출, 외식비 등의 항목별 지출 규모가 포함됩니다. 이를 통해 생활수준, 소비구조, 지역별 차이를 비교·분석할 수 있으며, 도시 내 복지정책 수립, 맞춤형 생활지원 서비스 설계, 소비 트렌드 분석 등에 활용될 수 있습니다. 특히 행정동 단위로 세분화된 정보이므로 자치구나 시 단위에서 보이지 않는 세밀한 생활 경제 상황을 파악하는 데 유용한 기초자료로 활용될 수 있습니다.
