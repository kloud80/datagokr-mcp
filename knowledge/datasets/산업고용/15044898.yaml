description_portal: 고효율 인증제도를 통해 인증에 통과하여 고효율 기자재마크를 받은 고효율 에너지기자재 인증 제품에 대한 상세 정보를 제공합니다.품목, 산업건물용가스보일러, 펌프, 원심식스크류냉동기, 무정전전원장치, 인버터, 직화흡수식 냉온수기, 터보압축기, 유도등(LED), 항온항습기, 가스히트펌프, ESS  등 다양한 항목별로 상세한 데이터를 제공하고 있습니다.소비자와 기업 및 연구기관은 이를 통해 에너지 효율이 좋은 고효율 에너지기자재를 선택할 수 있으며,고효율에너지기자재 데이터를 에너지 효율 연구·정책 개발에 활용할 수 있습니다.
