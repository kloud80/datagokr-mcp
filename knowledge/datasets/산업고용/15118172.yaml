description_portal: 혁신제품은 기존 시장에 없던 신기술을 바탕으로 문제를 해결하거나 효율을 높인 제품으로 정부부처가 기업혁신을 장려하고 시장확대 필요성을 인정하여 판로지원을 하고 있는 제품입니다.또한, 공공기관이 관리하는 구매지표 중 하나로 중소기업 제품 구매중 일정부분을 혁신제품으로 구매해야하는 목표가 있습니다. 본 자료는 공공혁신조달플랫폼 관리시스템에 등록되어있는 최근 3년 한국가스공사 혁신제품 구매실적으로 실적유형, 구매제품명, 구매금액, 등록일자가 기재되었습니다.혁신 중소기업의 신규 제품 개발 방향 설정, 공사 납품을 위한 제품 기획, 공공조달 시장 진출 전략 수립에 참고자료로 활용할 수 있습니다. 또한 혁신제품 구매 정책 효과 분석, 공공기관의 혁신조달 연구, 기술혁신 동향 파악, 중소기업 지원 정책 수립, R&D 투자 방향 설정에도 유용한 기초자료가 됩니다.
