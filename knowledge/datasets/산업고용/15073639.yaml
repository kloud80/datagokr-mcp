summary_user: 중소벤처기업진흥공단이 '존경받는 기업인'으로 선정한 중소기업을 한 행에 한 곳씩 담은 전국 단위 목록 파일로, 상호·사업자번호·대표자·주소·주생산품·선정연도가 들어 있으며 CSV 크기는 약 3.7KB입니다. 성과공유·인재육성 등 사람 중심 경영으로 선정된 모범 기업이 어디이고 몇 년도에 뽑혔는지를 알아보려는 구직자, 거래처를 찾는 사업자, 포상 이력을 조사하는 분석가가 쓴다. 사업자번호 열이 있어 같은 부문의 벤처·이노비즈 등 확인·인증 원장과 기업 단위로 대조하는 데 쓰지만, 실측에서는 전역 조인 키로 확인되지 않아 상호·주소 매칭을 함께 써야 한다.
description_portal: "'존경받는 기업인' 이란 성과공유, 인재육성 등 기업과 근로자가 함께 성장하는 상생과 혁신, 그리고 사람 중심의 기업 경영을 적극 실천함으로써, 우수한 경영성과와 좋은 일자리를 창출하여 국민경제에 기여하는 모범 중소기업인을 뜻합니다. 존경받는 기업인은 평소 기업 활동을 통해 직원의 복지 증진과 사회 공헌 등을 적극 실천하여 사회의 모범이 될 만한 기업으로 선정된 기업입니다. 해당 데이터는 이와 같은 존경받는 기업인의 상호, 사업자번호, 대표자, 주소, 주생산품, 선정연도의 정보를 포함하고 있습니다."
