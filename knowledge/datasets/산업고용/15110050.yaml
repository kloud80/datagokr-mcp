description_portal: 이 데이터는 한국남부발전이 출자한 풍력발전소의 국산 풍력기 설치 현황을 정리한 자료입니다. 각 발전소별 설치 일자, 총 설비용량(MW), 제작사 및 설치된 제품명이 포함되어 있으며, 현대중공업, 효성중공업, 유니슨 등 국내 주요 제작사가 공급한 풍력기가 설치된 내역을 확인할 수 있습니다. 태백, 창죽, 평창, 정암, 귀네미 등 다양한 지역의 풍력발전소가 포함되어 있어 지역별 재생에너지 설비 현황과 국산 풍력기 보급 추이를 파악할 수 있습니다. 본 자료는 국내 풍력발전 기술의 활용 수준을 보여주며, 국산 설비 확대와 에너지 전환 정책의 성과를 분석하는 데 유용하게 활용할 수 있는 기초 데이터입니다.
