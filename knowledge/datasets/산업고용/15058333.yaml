summary_user: 경기도 시군별·기준년도별로 장애인 택시운전원 취업 인원을 장애 정도(심한 장애·심하지 않은 장애)와 성별로 나눠 담은 집계 통계다. 장애인 고용·교통복지 담당자나 분석가가 "우리 시군에서 장애인 택시운전원으로 취업한 사람은 몇 명이고, 중증 비율과 여성 비율은 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키는 없고, 시군 코드(SIGUN_CD)나 시군명을 기준으로 경기도의 다른 시군 단위 통계와 이름·코드를 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 시군별로 장애인 택시운전원의 취업현황을 장애 정도(심한장애, 심하지 않은 장애) 및 성별 기준으로 구분하여 제공하는 통계자료입니다. 주요 항목은 ‘기준년도’, ‘시군명’, ‘총계(명)’, ‘심하지않은장애 총계(명)’, ‘심하지않은장애 여성(명)’, ‘심하지않은장애 남성(명)’, ‘심한장애 총계(명)’, ‘심한장애 여성(명)’, ‘심한장애 남성(명)’ 등으로 구성되어 있습니다. 이를 통해 장애 유형 및 성별에 따른 취업 현황을 시군 단위로 파악할 수 있어, 장애인 고용 정책 수립, 교통복지 정책 강화, 장애인 대상 직업 지원 및 맞춤형 일자리 확대 전략 마련에 유용하게 활용될 수 있습니다. 또한 장애인의 사회참여 확대와 관련된 실태 분석, 지역별 격차 해소 방안 마련 등에 필요한 기초 자료로 기능할 수 있습니다.
