description_portal: '한국소방산업기술원에서 매년 주관하는 소방산업대상 데이터입니다.  고부가가치 산업기반 조성을 위해 실시한 소방산업대상 공모전의 공모 분야별 수상작 목록(수상구분, 년도, 제목 등)을 제공합니다.수상작 관련 수상업체(수상자)등 자세한 정보는 한국소방산업기술원 홈페이지(https://kfi.or.kr) >자료실> 수상작관람 메뉴에서 확인할 수 있습니다.참고사항 : 공모분야 및 수상부분은 매년 달라질 수 있습니다.공모분야는 기술진흥, 신기술 실용화, 기술혁신, 제품디자인 수상부분는 대통령, 국무총리, 행정안전부장관, 소방청장, 한국소방산업기술원장, 한국발명진흥회상'
