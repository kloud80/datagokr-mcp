description_portal: '본 데이터는 충청북도 진천군 관내 등록된 통신판매업자의 관리번호, 상호, 운영상태, 법인구분, 사업자번호, 취급품목, 취급품목세부사항, 데이터기준일을 제공합니다.(데이터 기준일자: 2026. 5. 6.)등록된 통신판매업자에 대한 정보는 "공정거래위원회" 홈페이지에서도 확인하실 수 있습니다.통신판매업 신고 면제 대상은 「통신판매업 신고 면제 기준에 대한 고시」제2조 각 호와 같습니다.1. 직전년도 동안 통신판매의 거래횟수가 50회 미만인 경우 2. 부가가치세법 제2조제4호의 간이과세자인 경우관련법으로 "전자상거래 등에서의 소비자 보호에 관한 법률"이 있으며, 더 자세한 사항은 진천군 경제과로 문의하실 수 있습니다.'
