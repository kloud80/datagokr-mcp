summary_user: 한국가스공사가 공급한 전국 천연가스(LNG)의 일평균 공급량을 월별로 집계한 표로, 한 행이 한 해이고 1월~12월 열에 톤 단위 값을 담는다(csv 895 bytes 규모의 작은 파일). 에너지 분석가나 사업자가 '겨울철과 여름철 가스 공급량이 해마다 얼마나 달라지나' 같은 월별·계절별 수요 변동을 볼 때 쓴다. 전역 조인 키나 지역 코드가 없는 전국 단일 값이라, 다른 에너지 통계와는 연도·월을 맞춰 붙여 쓴다.
description_portal: 한국가스공사가 제공하는 월별 전국 천연가스 일평균 공급량 데이터로, 국내 천연가스 공급현황을 파악할 수 있는 기초자료입니다. 본 데이터는 월 단위로 집계된 일평균 공급량을 통해 월별 수요 변동, 에너지 소비패턴 등을 파악하는데 활용하는 등 다양한 분야에 참고 지표로 사용될 수 있습니다. 해당 데이터는 전국 천연가스(LNG) 일평균 공급량을 나타낸 자료이며, 데이터의 단위는 톤(ton) 단위 입니다. 공공데이터의 공개 대상 자료는 2017년도 1월부터 현재까지의 기간동안 한국가스공사 월별 일평균 전국의 천연가스(LNG) 총 공급량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 주기적으로 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일입니다.
