summary_user: 제주특별자치도 안에 있는 신재생에너지 발전시설을 시설 한 곳씩 담은 원장 파일로, 허가일자·상호·설비용량(kW)·설치장소·원동력 종류(태양광·풍력 등)·사업개시일을 담는다. 에너지 분석가나 사업자가 '제주에서 태양광·풍력 발전시설이 언제 얼마나 허가됐고 용량은 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·설치장소 같은 이름·주소 매칭으로만 잇고, 전국태양광발전소전기사업허가정보 표준데이터와 대조할 때도 같은 방식으로 맞춘다.
description_portal: '제주특별자치도 내에 소재하고 있는 신재생 에너지 발전시설 현황 데이터를 제공합니다.항목: 발전시설의허가일자,상호,설비용량(KW),설치장소,원동력종류,사업개시일 등*「신에너지 및 재생에너지 개발ㆍ이용ㆍ보급 촉진법」에 의거하여 관리됨- 신에너지: 기존의 화석연료를 변환시켜 이용하거나 수소ㆍ산소 등의 화학 반응을 통하여 전기 또는 열을 이용하는 에너지→ 수소에너지, 연로전지, 그 밖에 석유ㆍ석탄ㆍ원자력 또는 천연가스가 아닌 에너지 등- 재생에너지: 햇빛ㆍ물ㆍ지열(地熱)ㆍ강수(降水)ㆍ생물유기체 등을 포함하는 재생 가능한 에너지를 변환시켜 이용하는 에너지→ 태양에너지, 풍력, 수력, 해양에너지, 지역에너지, 생물자원을 변환시켜 이용하는 바이오에너지, 폐기물에너지(비재생폐기물로부터 생산된 것은 제외) 등자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1099'
