description_portal: '본 데이터는 한국산업기술기획평가원의 통합사업관리 체계에서 관리되는 사업공고 현황을 CSV 형태로 정리한 자료입니다. 공고는 한국산업기술기획평가원 자체 공고뿐 아니라 산업통상자원부 산하의 다른 전담기관이 발표한 연계 공고도 함께 포함될 수 있어, 동일 체계 안에서 공고 정보를 폭넓게 확인할 수 있도록 구성되어 있습니다. 각 항목에는 공고가 발표된 연도와 전담기관 명칭이 포함되어 공고의 관할 주체를 식별할 수 있으며, 공고명(정식 제목)과 공고일자를 통해 공고 내용을 구분하고 발표 시점을 확인할 수 있습니다. 또한 진행 상태(예: 접수중, 마감, 변경 등)가 제공되어 이용자가 공고의 현재 처리 단계나 갱신 여부를 파악하는 데 도움이 됩니다.이 자료는 산업기술 R&D 및 지원사업 공고를 탐색하는 이용자에게 기본 목록으로 활용될 수 있습니다. 기업·연구기관·개인 연구자는 전담기관과 공고일자 정보를 기준으로 관심 공고를 선별하고, 진행 상태를 참고해 접수 준비나 일정 관리를 수행할 수 있습니다. 또한 연도별로 공고 목록을 정리하면 공고 게시의 흐름을 파악하거나, 전담기관별로 공고 현황을 묶어 확인하는 데 활용할 수 있어, 공고 정보 접근성과 비교 가능성을 높이는 기반 데이터로 기능합니다.'
