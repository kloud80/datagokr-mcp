description_portal: '이 데이터는 한국환경산업기술원이 지정한 녹색매장 업체 및 매장 현황 정보를 담고 있습니다. 데이터는 총 451개의 지정 매장 정보를 포함하며, 다음과 같은 5개의 컬럼으로 구성되어 있습니다:구분: 매장의 규모나 유형을 나타냅니다(예: 대형, 중소형 등).지정번호: 녹색매장으로 공식 지정된 순서대로 부여된 고유 번호입니다.업체명: 녹색매장으로 지정된 업체의 이름입니다.매장명: 업체가 운영하는 개별 매장의 이름입니다.지정기간: 녹색매장으로 공식적으로 지정된 유효기간을 나타내며, 시작일과 종료일이 포함된 형태로 표기됩니다.이 데이터는 소비자에게 친환경 제품 소비를 촉진하고 친환경 경영을 실천하는 매장을 안내하는 목적을 가지고 있습니다. 정부 및 관련 기관은 이 데이터를 통해 녹색매장 정책의 성과를 평가하고 향후 정책을 수립하는 데 활용할 수 있습니다'
