summary_user: 부산광역시 사상구 안의 가스사업자를 사업장 한 곳당 한 행으로 담은 목록 파일(약 10KB CSV)로, 상호, 사업 종류(액화석유가스·고압가스·도시가스)와 세부 종류, 소재지 주소, 전화번호가 들어 있다. 구청·안전 담당자나 주민이 '사상구에서 고압가스 충전·저장 사업장은 어디에 있고 연락처는 무엇인가'를 확인하거나, 가스 시설 점검 대상과 재난 대응 지도를 만드는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업소 소재지 주소나 상호를 맞춰 붙여야 하고, 같은 구의 다른 에너지 업종 인허가 목록과도 이 방식으로 이어 쓴다.
limits: 사업자등록번호나 인허가번호 같은 고유 키가 없다. 따라서 다른 기관 데이터나 전국 인허가 원장과 정확히 매칭하기 어렵고, 주소·상호 문자열로 맞춰야 한다. 범위는 사상구 한 곳뿐이므로 다른 구나 부산 전체 현황은 따로 모아야 한다.
