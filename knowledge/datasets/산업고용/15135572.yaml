summary_user: KOTRA가 정리한 한국의 정상외교 행사(정상회담·고위급 회담 등)를 건별로 담은 CSV 파일(약 310KB)로, 행사 유형, 행사명, 상대국, 시작·종료일, 관련 소식을 담는다. 수출기업이나 연구자가 특정 국가와 언제 어떤 정상외교가 있었는지 확인하고, 이를 그 나라와의 무역·투자 협력 기회를 따져 보는 데 쓴다. 전역 조인 키는 없으므로 상대국 이름(외교상대국가)을 국가코드나 국가명에 직접 맞춰 국가별 무역·투자 통계와 이어 쓴다.
description_portal: 코트라(KOTRA)에서 공공데이터 포털에 개방하고 있는 정상외교 개최현황 데이터는 국가 간 정상 회담, 고위급 외교 회담, 혹은 정상 간 회의와 관련된 정보를 제공하는 데이터 입니다. 이 데이터는 주로 한국과 다른 국가들 간의 외교적 상호작용을 보여주는 자료로, 다양한 무역, 투자, 외교적인 협력 기회를 파악하는 데 유용합니다. 이 데이터는 주로 한국과 다른 국가들 간의 정상 회담을 통해 이루어진 외교적, 경제적 합의와 그 성과를 추적하고 분석하는 데 유용합니다. 기업들이나 연구 기관들은 이를 통해 특정 국가와의 무역, 투자 협력 기회를 식별하거나, 향후 외교 관계에 따른 경제적 영향을 예측할 수 있습니다.
