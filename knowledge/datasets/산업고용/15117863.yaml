summary_user: 인천 부평구 근린생활시설에 설치된 전기차 충전기를 충전기 한 대 단위로 담은 파일로, 운영기관·충전소명·충전기 유형(급속·완속)·충전용량(kW)·시설 종류·주소·이용가능시간을 수록한다. 부평구 주민이나 정책 담당자가 '우리 동네 생활시설 중 어디에 급속 충전기가 있고 몇 시까지 쓸 수 있나'를 확인하거나 생활권별 충전 인프라 분포를 분석하는 데 쓴다. 전역 조인 키가 없어 다른 충전소 데이터와는 주소나 충전소명 매칭으로만 이을 수 있고, 충전기ID가 다른 데이터의 ID 체계와 같은지는 확인되지 않았다.
description_portal: '근린생활시설에 설치된 전기차 충전소의 운영기관, 위치, 충전기 정보, 이용 가능 시간 등을 수록한 데이터.주민들이 일상적으로 이용하는 생활편의시설 내 충전 인프라 현황을 파악하고, 생활밀착형 친환경 교통정책 수립 및 전기차 이용 편의 증진에 활용 가능하다.활용 목적 및 특징– 근린생활시설 내 전기차 충전소 분포 현황 분석– 충전기 타입·용량별 인프라 구성 파악– 주소·시설구분 기반 생활권 접근성 및 이용 편의성 평가– 생활SOC 연계형 친환경 교통정책 수립 근거 자료 활용주요 항목 설명● 운영기관: 충전소를 설치·운영하는 기관 명칭● 충전소: 전기차 충전소의 명칭 또는 위치● 충전기ID: 충전기를 구분하는 고유 식별번호● 충전기타입: 급속·완속 등 충전기 유형● 시설구분: 충전소가 설치된 근린생활시설의 종류● 주소: 충전소 소재지 주소● 이용가능시간: 충전소 운영 가능 시간대● 충전용량: 해당 충전기의 최대 충전 용량(kW)'
