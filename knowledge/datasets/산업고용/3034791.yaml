summary_user: 기업마당에 올라온 정부부처·지자체·공공기관의 중소기업 지원사업 공고를 공고 한 건당 한 행으로 담은 전국 단위 파일로, 분야(금융·기술·인력·수출·내수·창업·경영·기타), 공고명, 신청 시작·종료일, 소관·수행기관, 등록일, 상세 URL을 포함한다. 중소기업·소상공인이나 창업자가 '지금 신청할 수 있는 수출·자금 지원사업이 무엇이고 마감이 언제인가'를 찾을 때 쓰며, 신청기간 필드로 접수 중인 공고를 골라내는 데 쓴다. 전역 조인 키가 없어 K-Startup·중소벤처24 공고나 기업 인증 데이터와는 공고명·기관명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: '* 데이터 개방 목적 : 중소기업의 길잡이로써 사업정보 이용 편리성 향상 및 중소기업, 소상공인의 정책 활용도 향상 및 경쟁력 제고* 데이터 출처 : 기업마당에서 제공하는 지원사업 공고 데이터입니다.* 접속경로 : 기업마당(www.bizinfo.go.kr) > 정책정보 > 지원사업공고  (https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/list.do)* 정부부처, 지방자치단체 공공기관에서 진행하는 중소기업 지원사업 DB 정보를 제공* 구성요소 : 분야, 사업명, 신청시작일자, 신청종료일자, 소관기관, 수행기관, 접수기관, 등록일자, 상세URL - 분야 : 금융, 기술, 인력, 수출, 내수, 창업, 경영, 기타 8종  - 소관기관 : 중앙행정기관, 지자체 등'
