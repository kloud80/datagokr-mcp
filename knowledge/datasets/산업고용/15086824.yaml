summary_user: 2024년 기준 경상남도 창원시에 있는 건설기계 관련 업체를 업체 한 곳당 한 행으로 담은 목록이며, 상호·사업 유형·주소로 구성된 약 17KB 분량의 CSV 파일입니다. 창원시에서 건설기계 대여·정비 등 업체가 어느 지역에 몇 곳 있는지 알고 싶은 사업자나 분석가가 업체 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어서, 다른 데이터와는 상호명이나 주소 문자열을 매핑해야 이어 쓸 수 있고, 지방행정 인허가(LOCALDATA) 업종 데이터와도 이 방식으로 대조한다.
limits: 사업자번호나 좌표 같은 공통 키가 없으므로 다른 인허가·기업 데이터와 정확히 결합하려면 상호·주소 문자열 매칭에 의존해야 한다. 범위는 창원시 한 곳이고 공간 좌표가 없으므로, 지도에 표시하려면 주소를 따로 지오코딩해야 한다.
