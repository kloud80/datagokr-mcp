description_portal: 한국전력공사에서 제공하는 전국 시군구별 신재생에너지 현황 데이터입니다.조회는 가능하나 다운로드시에는 회원가입 및 로그인이 필요합니다.기간(2005년부터), 지역, 추출정보(태양광, 소수력, 풍력, 연료전지 등)를 설정하여 지역별 설비용량과 추이그래프를 제공받을 수 있습니다.해당 데이터를 활용하여 특정 지역이 어떤 종류의 신재생 에너지를 주로 도입하고 있는지 파악할 수 있어 해당 지역의 잠재력을 평가하는 등 관련 연구에 도움을 줄 수 있습니다.또한 에너지 정책이 신재생에너지 보급에 미친 영향을 분석하는 등 다양한 활동에 기초자료로 활용할 수 있습니다.
