summary_user: 경상북도 청도군 관내 태양광발전소를 발전소 한 곳당 한 행으로 담은 파일로, 발전소명·주소·설비용량(kW)·사업허가일이 들어 있습니다. 청도군 안에서 어느 읍·면에 어느 규모의 태양광발전소가 언제 허가됐는지 알고 싶은 주민·사업자·분석가가 입지 분포나 연도별 허가 추이를 볼 때 씁니다. 전역 조인 키는 없어서, 전국태양광발전소전기사업허가정보표준데이터 같은 다른 자료와는 발전소명·주소를 맞춰 보는 방식으로만 이어 쓸 수 있습니다.
