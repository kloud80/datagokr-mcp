description_portal: 한국수력원자력㈜이 공개하는 방사성물질 용어집은 방사성물질과 관련된 핵심 개념과 용어를 체계적으로 정리한 전문 자료입니다. 방사성물질은 방사선을 방출할 수 있는 능력을 가진 물질을 의미하며, 이는 원자나 원자핵의 에너지 준위가 불안정한 상태에서 자연스럽게 방사선을 방출하는 ‘방사성 핵종’ 또는 ‘방사성 동위원소’를 포함합니다. 이러한 방사성 핵종을 일정 비율 이상 함유하고 있는 물질을 통틀어 ‘방사성물질’이라 부릅니다. 한국수력원자력이 제공하는 이 용어집은 원자력 발전 및 방사선 관련 업무에서 사용되는 다양한 방사성물질 관련 용어와 그 정의를 한글과 함께 정리하여, 현장 실무자뿐 아니라 연구자, 학생, 정책 담당자, 번역가 등 다양한 이용자가 방사성물질의 개념을 명확히 이해하고 올바르게 활용할 수 있도록 돕습니다. 나아가 방사선 안전관리, 법규 해석, 교육 및 연구 활동 등 여러 분야에서 중요한 참고자료로 활용될 수 있는 가치 있는 데이터입니다.
