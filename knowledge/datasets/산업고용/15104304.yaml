summary_user: 전라남도의 연도별 전력거래량(GWh)과 전력거래금액(억원)을 2017~2021년 5개 연도로 정리한 소규모 집계 파일(csv, 179바이트)이다. 에너지 분석가가 전남 지역의 전력거래 규모와 금액이 해마다 어떻게 달라졌는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역·연도별 전력 통계와는 연도와 지역명을 직접 맞춰서만 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2017년 ~ 2021년도까지의 전라남도 전력거래량 및 전력거래금액을 나타냅니다.*단위 : 전력거래량(GWh), 전력거래금액(억원)※전력거래량 및 전력거래금액은 수정정산으로 인해 값이 변경될 수 있습니다.'
