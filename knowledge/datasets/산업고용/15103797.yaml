summary_user: 한국동서발전 발전소별로 연월마다 취수원(하천·호수·지하수 등)과 용수 사용량(톤)을 기록한 집계 파일이며, 약 17KB 크기의 CSV로 제공된다. 연구자나 환경·에너지 분석가가 '어느 발전소가 어떤 취수원에서 계절별로 물을 얼마나 쓰는가'처럼 발전소 수자원 부담과 물-에너지 연계를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소명 이름 매칭으로만 발전소 원장·발전량·배출 데이터 등 같은 기관 데이터와 연결한다.
