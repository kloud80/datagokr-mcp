summary_user: 한국동서발전이 기상청 단기예보(14시 발표)를 바탕으로 다음 날 전국 시도별 태양광 발전량을 예측한 값을 기준일자·예측시각 단위로 담는다. 기온·습도·풍속·일사량 예측값, 설비용량·이용률, 발전 방식별 예측 발전량과 총합이 함께 들어 있다. 내일 우리 지역 태양광 발전이 얼마나 나올지, 기상조건과 발전량이 어떻게 연결되는지를 보려는 분석가·자가발전 사업자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 전력·기상 데이터와는 시도명과 날짜·시각을 맞춰 붙여야 한다.
description_portal: 한국동서발전은 기상청 단기예보(14시 발표)를 기반으로 하루 전 전국 시도별 태양광 발전량을 예측한 데이터를 API로 개방합니다. 이 데이터는 기온, 풍속, 습도, 일사량 등의 기상요소와 계량·BTM·PPA 설비용량 및 이용률을 반영해 발전 방식별 예측 발전량과 총합을 산출합니다. 이 데이터는 국민이 전력 수급 상황을 이해하고, 자가발전 계획에 활용할 수 있으며, 연구자들은 기상조건과 발전량의 상관관계 분석, 에너지 수급 예측 모델 개발 등에 활용할 수 있습니다.기준일자, 기준시각, 시도명, 윤년여부, 예측일자, 예측시각, 대기권밖일사량 계산값, 하늘상태, 기온, 습도, 풍속, 일사량 예측값, 태양광 설비 이용율, 태양광 설비용량, 태양광 발전량 예측값 등의 정보를 제공합니다.참고로, 타기관의 단기예보 데이터 연계 오류로  2025년8월24~26일(3일간)의 데이터가 누락되어 있으니 이용하시는 분께서는 이점 유의하여 주시기 바랍니다.
