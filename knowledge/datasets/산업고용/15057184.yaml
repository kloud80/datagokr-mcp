summary_user: 경기도 내 태양광 발전사업 허가를 받은 발전소를 한 곳씩 담은 건별 원장으로, 발전소명·도로명/지번 주소·위경도·설비용량(KW)·공급전압·주파수·설치연도·허가일자·가동상태 등을 담는다. 에너지 분석가나 지자체 담당자가 '우리 시군에 가동 중인 태양광 발전소가 어디에 몇 곳 있고 설비용량 합계는 얼마인가'를 확인하거나 입지 분포를 지도에 그릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·발전소명 매칭이나 위경도 기반 공간 결합으로만 이어 쓰며, 전국 단위는 전국태양광발전소전기사업허가정보표준데이터와 견주어 쓴다.
description_portal: 이 데이터는 태양광발전소 전기사업에 대해 허가받은 시설의 정보를 담고 있으며, 발전소 명칭, 설치 주소, 위도·경도 좌표, 설비용량(KW), 공급전압(V), 주파수(Hz), 설치연도, 허가일자, 허가기관, 가동상태 등의 항목으로 구성되어 있습니다. 데이터는 각 발전소의 운영 현황을 파악하고, 에너지 공급 기반 구축, 재생에너지 확산 정책 수립, 발전소 입지 분석 등에 활용될 수 있습니다. 특히 위도 및 경도 정보는 위치 기반 시각화나 공간적 분포 분석에 적합하며, 설비용량 및 설치연도 정보는 발전소의 규모 및 최신성 평가에 활용됩니다. 본 데이터는 에너지 관련 산업계, 정책기관, 연구기관 등에서 신재생에너지 기반 확충과 관련된 다양한 의사결정 자료로 활용될 수 있습니다.
