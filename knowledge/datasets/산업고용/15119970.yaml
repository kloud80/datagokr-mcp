description_portal: 본 데이터는 서울특별시 성동구 내에서 담배를 매입한 후 다른 도매업자 또는 소매인에게 판매하는 담배 도·소매 유통업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 담배 유통 구조의 투명성 및 건전성 확보를 위해 관련 업소의 영업 현황과 행정관리 이력을 정확하게 파악하는 것이 중요하며, 본 데이터는 이를 지원하기 위한 목적으로 수집·정리됩니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드가 포함되어, 각 업소의 허가·관리 이력과 영업 상태, 폐업 이력 등 주요 행정정보를 확인할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 정보 점검과 갱신을 실시하여 데이터의 신뢰성과 최신성을 확보하고 있습니다. 이 데이터는 담배 유통업에 대한 정책 수립, 업계 동향 분석, 유통 질서 관리, 불법 유통 및 탈세 방지, 업소 선정, 관련 연구 등에 유용하며, 관계 기관, 업계 종사자, 연구자, 소비자 등 다양한 사용자가 공정하고 객관적인 정보를 활용할 수 있습니다. 데이터는 주기적으로 최신화됩니다.
