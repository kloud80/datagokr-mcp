description_portal: 'ㅇ 단위 : 년, 명, 여부ㅇ 시간선택제(하루 4시간 혹은 6시간 근무) 채용이 있는 경우 전일제로 환산(4시간 근무 0.5명, 6시간 근무 0.75명)하므로 소수점 발생 가능ㅇ 청년, 여성, 장애인, 지역인재, 고졸은 중복이 될 수 있으므로(예 : 청년이면서 여성) 청년, 여성, 장애인 등 단순합계가 총 신규채용과 일치하지 않을 수 있음ㅇ 친인척 채용(여부)는 2019년 3분기부터 집계ㅇ 정원외직원 신규채용 항목은 2022년도 데이터부터 공개ㅇ 신입직원 채용관련 항목(필기시험일, 1차 면접일, 2차 면접일, 필기 선발인원, 1차면접 선발인원, 2차면접 선발인원)은 2020년도 데이터부터 공개ㅇ 년간 2회(상반기, 하반기) 신입직원 선발한 해에도 하반기 채용 기준으로 데이터 작성ㅇ 1차 면접일 항목은 면접 첫째날  공개(통상 3일간 면접진행)ㅇ 선발인원의 경우 종합직원과 사무서무직원(고졸) 선발인원 더한 값임'
