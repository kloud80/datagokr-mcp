summary_user: 월드잡플러스의 해외인턴 사업을 사업명, 기수(차수)명, 기수별 접수 시작·종료일, 시행연도 단위로 담은 사업 목록 정보로, 범위는 전국이며 공간 정보는 없다. 해외 인턴을 준비하는 청년·구직자가 "올해 어떤 해외인턴 사업이 있고 접수는 언제까지인가"를 확인하거나, 분석가가 연도별 사업 운영 현황을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 일자리사업·채용 데이터와는 사업명 매칭이나 같은 기관(한국산업인력공단) 데이터 기준으로만 이어 쓴다.
limits: 참여 기업, 국가, 모집 인원 같은 세부 조건이나 참가자 정보는 필드에 없어 알 수 없다. 공통 코드나 조인 키가 없어 다른 데이터와 붙이려면 이름 매핑이 필요하다. 갱신은 사업 이벤트 단위로 생성된 뒤 바뀌지 않는 성격으로 분류돼 있다.
