description_portal: '창업진흥원이 제공한 기업 통계자료로, 업력 및 업종별로 구분된 기업 수 현황을 포함하고 있습니다. 구성 항목은 구분별 항목(업력 또는 업종), 세부 구분값(예: 1년, 제조업 등), 전체 기업 수, 개인 사업자 수, 법인 수로 이루어져 있습니다. 업력은 1년부터 7년까지 연차별로 나뉘며, 업종은 농업, 제조업, 정보통신업, 금융업, 교육서비스업, 예술 여가 서비스업 등 총 18개 분야로 구성되어 있습니다. 해당 데이터는 기업군 특성과 업종별 분포 파악, 창업 추세 분석, 정책 대상군 선별, 산업별 성장 가능성 평가 등 다양한 행정 및 정책 분석에 활용될 수 있는 기초자료로서 정책적 활용도가 높습니다.'
