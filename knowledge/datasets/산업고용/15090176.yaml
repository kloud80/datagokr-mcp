description_portal: '한국원자력안전재단에서 제공하는 방사선안전교육 운영현황으로, 수시로 제공되는 1회성 데이터입니다. 방사선안전교육 운영현황에 대한 데이터는 구분, 대상, 2018~2025년도 횟수(회), 수료자수(명)과 같은 항목으로 구성되어 있습니다.구분은 방사선작업종사자, 방사선안전관리자, 방사투과검사 분야 조장, 방사선 면허자 보수교육으로 나뉘며, 대상은 신규(일반/방사선투과검사), 정기(산업/의료/교육연구/방사선투과검사), 허가(일반/방사선투과검사), 신고, 신규, 정기로 구분됩니다.해당 데이터는 2025년 12월 기준으로, 2018년도부터 2025년도까지의 데이터를 제공합니다.(2021년 4월부터 방사선투과검사분야 조장교육은 폐강되었습니다.)데이터명 : 한국원자력안전재단_방사선안전교육 운영현황_20251231파일명 : 방사선안전교육 운영현황.csv'
