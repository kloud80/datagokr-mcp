summary_user: 국내 원자력발전소를 부지(발전소)별로 묶어 발전소 명칭, 호기 수, 발전용량(MWe)을 담은 소규모 집계 파일로, 포털 설명상 2023년 12월말 기준이며 전국 범위입니다. 지역별 원전 규모를 비교하거나 "어느 원전 부지에 몇 기가 있고 설비용량이 얼마인가"를 확인하려는 분석가·연구자가 전력 생산 구조 분석의 기초 자료로 쓴다. 전역 조인 키가 없어 다른 발전설비·전력 데이터와는 발전소 명칭을 직접 맞춰 이어 써야 한다.
description_portal: 본 데이터는 국내 원자력발전소 운영 현황을 제공하기 위해 구성된 데이터입니다. 데이터 항목은 국내 원자력 발전소 명칭, 발전소별 호기 수, 원전 부지별 발전용량 정보를 포함하고 있으며, 데이터 기준일은 2023년 12월말 기준입니다. 이를 통해 발전소 단위의 규모와 설비 구성 특징을 한눈에 파악할 수 있으며, 지역별 원전 운영 현황 비교나 전력 생산 구조 분석의 기초 자료로 활용할 수 있습니다. 또한 원전 운영 현황을 투명하게 공개함으로써 관련 정책 수립 및 연구에 참고할 수 있는 기반 정보를 제공합니다.
