summary_user: 전라남도 고흥군에서 태양광 발전소가 매매(양도·양수)된 건을 발전소 단위로 담은 파일 데이터로, 발전소명·주소·발전용량(kW)·양수인가일·발전원을 담는다. 태양광 발전소 매입을 검토하는 사업자나 분석가가 고흥군에서 어느 지역·어느 용량대의 발전소가 언제 거래 인가를 받았는지 확인하는 데 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과는 발전소명·주소를 맞춰 이어 써야 한다.
limits: 공통 코드나 고유 식별자가 없어 다른 데이터와 붙일 때 발전소명·주소 문자열 매칭에 기대야 한다. 범위는 고흥군 한 개 시군구로 한정된다. 포털 설명에는 양도인·양수인이 있다고 하나 필드 목록에는 보이지 않으므로 받아서 실제 컬럼을 확인해야 한다.
