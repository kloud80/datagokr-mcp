summary_user: 고용노동부의 허가를 받은 근로자파견 사업체를 업체별로 담은 파일로, 허가번호·사업체명·소재지·관할 지방관서가 들어 있고 범위는 전국이다. 파견업체를 이용하려는 사업주나 구직자가 어떤 업체가 정식 허가를 받았는지, 우리 지역 관할관서에 등록된 파견업체가 어디인지 확인하는 데 쓴다. 허가번호(worker_dispatch_permit_no)를 키로 다른 파견사업 관련 자료와 잇고, 소재지 주소로 지역 단위 집계나 지도화에 연결한다.
description_portal: 매반기 근로자파견사업체의 반기별 실적보고에 따라 2024년 12월 31일 기준의 2024년 하반기 근로자파견사업 허가업체 현황이 추가되었습니다.따라서 현재 기준의 현황자료가 아니므로 현 시점과 현황이 다를 수 있습니다.고용노동부의 허가를 받은 파견업체, 소재지, 관할관서 등의 정보가 포함되어 있는 데이터 입니다. 근로자파견사업 허가업체의 현황은매반기 별로 공표되고 있으며 자세한 사항은 고용노동부 홈페이지(정보공개 - 사전정보공표목록)를 참고해 주시기 바랍니다. 향후 데이터 업데이트는 2025년 상반기 기준으로 작성될 예정입니다.예정입니다.
