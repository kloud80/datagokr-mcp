description_portal: 이 데이터는 근로복지공단이 최저임금 인상에 따른 사업주 경영 부담 완화와 근로자 고용 안정을 위해 2018년부터 2022년 6월 30일까지 지원했던 일자리 안정자금의 근로시간별 지급 기준을 담고 있습니다. 통계 항목은 지원 연도별로 근로자의 주 소정 근로 시간에 따라 월평균 보수 상한액과 월 지급액을 세분화하여 제공합니다. 근로시간은 40시간 이상, 30시간 이상-40시간 미만, 20시간 이상-30시간 미만, 10시간 이상-20시간 미만, 10시간 미만 등 5개 구간으로 나누어 기준을 제시합니다. 이 자료는 정부의 저임금 근로자 및 소규모 사업장 지원 정책이 근로자의 근로 시간 및 소득 수준에 따라 어떻게 차등적으로 설계되었는지 명확하게 보여주는 근거 정보라고 판단됩니다.본 데이터는 최저임금 정책의 부작용 완화 효과 및 고용 지원 정책의 형평성 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 연도별 월평균 보수 상한액과 월 지급액의 변화를 분석함으로써, 최저임금 인상률 대비 재정 지원 수준의 적정성을 평가할 수 있습니다. 또한, 근로 시간 구간별 지원 기준과 실제 지급액을 분석하여 단시간 근로자 등 취약 계층의 고용 안정 및 소득 보장에 대한 정책적 기여도를 진단하고, 향후 유사한 고용 유지 지원 정책을 설계하는 데 활용할 수 있습니다. 이 통계는 노동 시장의 변화에 따른 공공 재정 지원의 효율성과 공정성을 검토하는 데 기여할 수 있다고 판단됩니다.※ 근로복지공단에서 최저임금 인상에 따른 사업주의 경영 부담을 완화하고 근로자의 고용안정을 위하여 일자리 안정자금을 지원하였으며, 2022년 6월 30일 기준으로 종료
