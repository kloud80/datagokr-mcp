summary_user: 경기도 안에서 광고물 제작·표시·설치와 옥외광고 대행을 하는 사업장을 한 곳씩 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·WGS84 좌표·업태를 사업장 단위로 담는다. 옥외광고 사업자나 상권 분석가가 '우리 시군에서 지금 영업 중인 옥외광고업체는 어디에 몇 곳이고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드·시군명이나 주소·좌표를 기준으로 맞춰 붙여야 하며, 같은 지방행정 인허가(LOCALDATA) 계열의 다른 업종 현황과 시군 단위로 나란히 놓고 비교하는 식으로 쓴다.
description_portal: 「경기도광고업현황」 데이터는 경기도 내에서 광고물 제작, 표시, 설치 및 옥외광고 대행을 수행하는 사업체의 현황을 제공하는 자료입니다. 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태구분코드(BSN_STATE_DIV_CD), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지시설전화번호(LOCPLC_FACLT_TELNO), 소재지면적정보(LOCPLC_AR_INFO), 도로명우편번호(ROADNM_ZIP_CD), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), WGS84위도(REFINE_WGS84_LAT), WGS84경도(REFINE_WGS84_LOGT), 업태구분명정보(BIZCOND_DIV_NM_INFO), 좌표값(X_CRDNT_VL, Y_CRDNT_VL) 및 영업내용(BSN_CONT)이 포함되어 있습니다. 이를 통해 경기도 내 옥외광고업체의 등록 및 운영 상태, 위치, 업태 현황을 확인할 수 있습니다. 데이터는 옥외광고산업 정책 수립, 불법 광고물 관리, 지역경제 연구 및 상권 분석 등 다양한 분야에서 활용 가능하며, Open API(https://openapi.gg.go.kr/Outhousadver)를 이용하면 시군명, 영업상태 조건별 조회가 가능합니다. 본 자료는 산업경제 분야 데이터로 상업적 활용과 가공이 허용되어, 행정기관, 연구기관, 민간기업 모두 폭넓게 활용할 수 있습니다.
