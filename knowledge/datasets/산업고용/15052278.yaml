summary_user: JDC지정면세점에 입점한 브랜드를 협력업체별로 한 줄씩 담은 파일로, 최초 입점일자·입점일자·퇴점일자와 연락처가 함께 들어 있으며 원본은 약 50KB 크기의 CSV다. 면세점 입점을 준비하는 공급업체나 분석가가 "어떤 협력업체가 어떤 브랜드를 언제부터 공급했고 언제 빠졌는가"를 확인하는 데 쓴다. 협력업체명(jdc_dfs_partner)과 브랜드명(jdc_dfs_brand)이 조인 키여서, 같은 이름을 쓰는 다른 면세점·유통 데이터와 업체 또는 브랜드 단위로 이어 볼 수 있다. 다만 사업자등록번호 같은 공식 식별 코드는 없다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터 JDC에서 운영하는 JDC지정면세점의 입점업체 현황을 정리한 자료로, 각 브랜드의 입점 및 퇴점 이력과 기본 정보를 포함하고 있습니다. 데이터 항목은 협력업체명, 브랜드명, 최초 입점일자, 입점일자, 퇴점일자, 연락처1, 연락처2로 구성되어 있으며, 협력업체명은 정우 INT, 더유통 등 면세점에 브랜드를 공급하는 기업의 명칭으로 기재되어 있습니다. 브랜드명은 각 협력업체가 운영하는 개별 브랜드명을 나타내며, 이를 통해 면세점 내 브랜드 구성을 확인할 수 있습니다. 최초 입점일자와 입점일자, 퇴점일자는 각각 해당 브랜드가 처음 입점한 시점과 이후 재입점 또는 운영 종료 시점을 날짜 형식으로 기록하고 있으며, ‘2002-12-24’와 같은 연월일 형식으로 표현됩니다. 연락처1과 연락처2에는 업체의 대표전화나 영업담당자의 번호 등이 입력되어 있어 연락이 가능한 기본 정보로 활용됩니다. 본 데이터는 면세점 입점 브랜드 운영 이력 파악, 협력사 관리, 브랜드 구성 전략 수립, 공급계약 현황 분석 등 다양한 실무적·행정적 목적에 활용될 수 있습니다.
