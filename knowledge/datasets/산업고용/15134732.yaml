description_portal: 골재자원으로 활용되는 기반암들은 지질학적인 개별 암종특성을 갖고 있으며, 이는 골재자원으로 활용함에 있어 적합도를 보다 정밀하게 알 수 있음, 기반암의 암종 특성은 암석을 구성하는 광물조성에 따라 확연하게 달라짐, 이를 파악함으로써 과거와 달리 골재자원으로 활용하기 적합한 암종을 선택할 수 있으며, 골재자원의 품질향상에 기여할 수 있음, 지표시료의 육안관찰과 현미경을 통한 미세광물관찰로 1차적인 광물조성을 파악하고, XRD, XRF 지화학분석으로 구성광물의 종류 및 함량을 파악하는 과정을 수행함, 이에 따라 골재에 악영향을 끼칠수 있는 원소 또는 광물을 파악하고, 골재자원의 활용여부를 판단하는 기초 자료로 활용함
