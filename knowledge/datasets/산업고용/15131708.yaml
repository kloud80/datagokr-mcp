description_portal: 한국디자인진흥원(KIDP)은 디자인산업 발전을 위한 국가 주도 전문기관으로, 정책 개발, 기업 지원, 인력 양성, 해외 진출 등 다양한 사업을 수행하고 있습니다. 기관 홈페이지의 ‘사전정보공표’ 코너에서는 투명한 행정 운영을 위해 수의계약 내역을 공개하고 있습니다. 제공되는 데이터에는 순번, 계약명, 계약일, 계약기간, 계약금액, 계약업체명, 계약상대자, 계약내용, 수의계약 근거 및 사유 등이 포함되어 있으며, 이를 통해 기관의 계약 현황과 집행 내역, 근거 등을 확인할 수 있습니다. 본 데이터는 2021-12-31 기준으로 수집·정리한 925개의 행으로 구성된 자료이며, 이후 내용은 변경되었을 수 있습니다. 최신 내역과 세부 사항은 한국디자인진흥원 사전정보공표 수의계약 목록에서 직접 확인하시기 바랍니다. (https://kidp.or.kr/?menuno=937)
