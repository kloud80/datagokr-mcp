summary_user: 충청남도 내 전문건설업체를 업체 한 곳당 한 건으로 담으며, 상호(CONM)·업종명·대표자명·우편번호·상세주소·제공기관명·기준일자를 제공한다. 공사 발주처나 주민이 특정 시·군에 어떤 업종의 전문건설업체가 등록돼 있는지, 거래하려는 업체가 실제로 등록돼 있는지를 상호나 주소로 확인할 때 쓴다. 전역 조인 키가 없으므로 다른 업종 인허가(LOCALDATA)나 기업 현황 데이터와는 상호·주소 같은 이름 매칭으로만 이어 쓴다.
description_portal: 상호, 업종명, 기관상세주소 등의 입력 파라미터를 이용하여 충청남도 내에 있는 전문건설업체의 정보를 조회 할 수 있는 API
