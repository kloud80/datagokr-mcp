summary_user: 한국전력공사가 배전공사 전문회사와 맺은 계약을 계약 건별로 담은 전국 단위 원장 파일로, 계약체결사업소·계약일자·공사구분·계약방법·낙찰자결정방법·공사명과 추정공급가액·순공사원가·산업안전보건관리비 같은 금액 항목을 포함한다(CSV 약 476KB). 배전공사 입찰을 준비하는 시공사나 분석가가 '어느 사업소에서 어떤 방식으로 얼마 규모의 배전공사 계약이 체결됐는가'를 확인하는 데 쓴다. 계약번호(kepco_cntrct_no)가 조인 키이므로 같은 번호를 쓰는 한전의 다른 계약·입찰 자료와 이어 쓰고, 지역 비교는 계약체결사업소명을 기준으로 한다.
description_portal: 한국전력공사에서 제공하는 배전공사 전문회사 계약대장 데이터입니다.배전공사 관련 계약 현황을 제공하며 계약체결사업소명, 계약일자, 공사구분, 공사명, 추정공급가액 등의 항목으로 구성되어 있어, 주요 공사의 규모와 방식을 확인할 수 있습니다.데이터 이용자는 에너지 인프라 확충 과정에서 어떤 공사들이 진행되고 있는지 이해할 수 있으며, 계약 추이나 공급가액 변화를 분석해 전력사업 투자 방향과 지역별 발전 상황을 파악할 수 있습니다.또한 전력 인프라의 건설과 유지보수가 이떻게 이루어지고 있는지 확인할 수 있습니다.
