description_portal: 고용부담금은 장애인을 고용해야 할 의무가 있는 사업주가 의무고용률에 못 미치는 장애인을 고용한 경우 납부해야 하는 공과금입니다. 의무고용률에 따라 고용하여야 할 장애인 총수에서 매월 상시 고용하고 있는 장애인 수를 뺀 수에 고용 수준별 적용 부담기초액을 곱한 금액의 연간 합계액을 납부합니다. 고용부담금의 신고 대상은 월 평균 상시 100명 이상의 근로자를 고용하는 사업주, 국가 및 지방자치단체(교육청 포함)의 장입니다. 고용부담금 발생 현황 데이터는 기준년도 고용상황에 따라 발생한 부담금으로 고용계획 및 실시상황 보고서를 제출하지 않고 부담금만 신고 납부한 경우는 미포함된 데이터입니다.
