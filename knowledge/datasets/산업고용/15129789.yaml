description_portal: 본 데이터는 한국가스공사 평택기지본부에서 운용 중인 LNG 저압펌프 설비 현황 정보를 제공합니다. LNG 기화 공정의 핵심 설비인 저압펌프의 체계적 관리와 정보 공개를 목적으로 수집되었습니다. 데이터의 세부 항목으로는 제조사, 모델명, 설치년도, 유량, 전양정, 운전온도, 설비번호, 정격출력, 운전상태 등이 포함되어 있습니다. 본 데이터는 펌프 제조업체, 정비사업자, 유사시설 운영기관, 입찰참여 희망업체, 에너지설비 연구기관, 산업통상자원부가 LNG 펌프 설비 현황 파악 및 입찰 사전정보로 활용할 수 있습니다. LNG 시설의 안정적 운영과 설비 국산화 연구개발에 기여할 것으로 기대됩니다.
