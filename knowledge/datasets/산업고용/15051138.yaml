summary_user: 2012년 이후 연도별·시도별 총 광업권 등록 광구 수를 담은 집계 데이터로, 광업등록사무소 통계집의 등록현황을 전국 시도 단위로 정리한 작은 CSV 파일(약 3.6KB)이다. 지역 자원정책 담당자나 분석가가 "어느 시도에 광업권 광구가 많고 최근 몇 년 사이 늘었나 줄었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 시도 이름을 행정구역 코드에 직접 매핑해야 다른 시도별 통계(인구·산업·토석채취 허가 등)와 이어 쓸 수 있다.
description_portal: 광업권 등록현황 - 시도별 총 광업권 등록현황 공공데이터는 산업통상자원부 광업등록사무소에서 매년 발간하는 광업권 설정출원 및 등록현황 통계집에 수록된 광업권 등록현황 중 2012년 이후 시도별, 연도별 총 광업권 등록현황에 대한 데이터로 연도, 시도(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남), 광구수의 항목을  기계 판독이 가능한 형태(소프트웨어로 데이터의 개별내용 또는 내부구조를 확인하거나 가공할 수 있는 상태)로 정비하고 CSV 오픈포맷으로 공공데이터포털(www.data.go.kr)을 통하여 누구나 쉽게 활용할 수 있도록 제공하고 있습니다.
