summary_user: 서울특별시 금천구의 복합유통게임제공업 사업장을 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일·주소·좌표(X, Y)·시설면적·층수·방 수·비상계단 등 시설 항목을 담는다. 창업 준비자나 상권 분석가가 '금천구에서 지금 영업 중인 복합유통게임제공업소가 어디에 몇 곳 있고, 시설 규모는 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없어 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 다른 데이터와 연결하며, 다른 지역·업종의 지방행정 인허가(LOCALDATA) 데이터와는 같은 원장 구조로 나란히 비교한다.
description_portal: 복합유통게임제공업의 인허가 및 영업 현황을 상세히 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명, 시설면적, 총게임기수, 편의시설, 소방시설, 청소년실 여부 등 다양한 항목을 포함하고 있습니다. 복합유통게임제공업은 여러 종류의 게임기와 오락시설을 함께 제공하는 업종으로, 해당 데이터는 창업 준비, 업계 동향 분석, 정책 수립, 지역 내 시설 분포 파악 등에 유용하게 활용됩니다. 또한 시설 안전 점검, 청소년 보호 관리, 지역 상권 분석, 오락산업 발전 전략 마련 등 다양한 분야에서 기초 자료로 쓰이며, 행정기관·연구기관·민간 부문 모두에서 실효성 있는 참고 자료가 됩니다.
