title: 창업진흥원_창업공간플랫폼(창업공간)_조회서비스
sector: 산업고용/산업·중소기업일반/sme-certification
agency:
  id: B552735
  name: 창업진흥원
kind: API
channel: portal
portal_url: https://www.data.go.kr/data/15125365/openapi.do
synonyms:
  - 입주공간
  - 입주지원
  - 공간지원
  - 창업공간플랫폼
  - 창업공간
  - 창업진흥원
  - 창업보육센터
  - 공유오피스
  - 회의실 예약
  - 창업지원 센터
  - 창업 사무공간
  - 창업진흥원 공간
summary_user: 전국 정부 지원 창업공간(센터)을 센터·건물·공간 단위로 담은 조회 API로, 주소·좌표와 공간유형, 면적, 보증금·임대료, 예약가능구분, 홈페이지를 제공한다. API 전체 건수는 100건이다. 예비창업자나 창업기업이 "내 지역에서 예약 가능한 사무실·회의실 공간이 어디이고 임대 조건은 얼마인가"를 찾는 데 쓴다. 주소(addr)와 위경도(latde)가 조인 키라서 지도 표시나 지역 기반 창업지원 데이터와 이어 쓰며, 사업자번호 키는 없다.
description_portal: 해당 정보는 정부에서 지원하는 전국의 창업공간에 대한 정보를 통합 제공하는 서비스로, 예비창업자 및 창업기업이 사무실, 회의실 등의 공간을 검색하고 이용할 수 있도록 지원합니다. 이용자는 지역, 공간 유형, 제공 서비스 등을 기준으로 공간을 탐색할 수 있으며, 각 센터별로 입주 조건, 예약 가능 시설, 위치, 연락처, 운영기관 등 상세한 정보를 확인할 수 있습니다. 또한 공간별로 입주기업 현황, 제공 편의시설, 이용 요금 등의 부가 정보도 함께 제공되어 창업자가 필요에 맞는 창업공간을 쉽게 비교하고 선택할 수 있도록 돕습니다. 이 서비스는 창업공간 수요자와 공급자 간의 효율적인 연결을 통해 공간 이용률을 높이고, 창업 초기의 정착 지원을 위한 기반 인프라로 활용됩니다.
team:
  dept: 디지털AI실
services:
  - op: /getCenterSpaceList
    name: 등록센터 공간 정보
    endpoint: https://apis.data.go.kr/B552735/kisedSlpService/getCenterSpaceList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: page
        required: false
        desc: 페이지
      - name: perPage
        required: false
        desc: 한 페이지 결과 수
      - name: returnType
        required: false
        desc: json/xml(default:xml)
      - name: cond[spce_id::EQ]
        required: false
        desc: 공간 ID
      - name: cond[spce_nm::LIKE]
        required: false
        desc: 공간명
      - name: cond[cntr_nm::LIKE]
        required: false
        desc: 센터명
      - name: cond[rsvt_psbl_clss::EQ]
        required: false
        desc: 예약가능여부
      - name: cond[rent::GTE]
        required: false
        desc: 임대료 이상
      - name: cond[rent::LTE]
        required: false
        desc: 임대료 이하
      - name: cond[guam::GTE]
        required: false
        desc: 보증금 이상
      - name: cond[guam::LTE]
        required: false
        desc: 보증금 이하
      - name: cond[addr::LIKE]
        required: false
        desc: 주소
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getCenterList
    name: 등록센터 목록 정보
    endpoint: https://apis.data.go.kr/B552735/kisedSlpService/getCenterList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: page
        required: false
        example: '1'
        desc: 페이지
      - name: perPage
        required: false
        example: '10'
        desc: 한 페이지 결과 수
      - name: returnType
        required: false
        example: json
        desc: json/xml(default:xml)
      - name: cond[cntr_nm::LIKE]
        required: false
        example: 한국농수산대학 창업보육센터
        desc: 센터명
      - name: cond[regin_clss::LIKE]
        required: false
        example: 전라북도
        desc: 지역구분
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
