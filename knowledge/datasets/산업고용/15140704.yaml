summary_user: 광진구 관내 대형마트·백화점·쇼핑센터·복합쇼핑몰 같은 대규모점포를 점포 한 곳당 한 건으로 담은 인허가 원장으로, 인허가일자·폐업일자·영업상태·소재지 주소·면적·업태·중부원점TM 좌표를 포함한다. 상권 분석가나 유통업 관계자가 '광진구에서 현재 영업 중인 대규모점포는 어디이고 언제 인허가·폐업했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 점포명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 이을 수 있고, 상가업소 원장이나 전국 대규모점포 표준데이터와 함께 상권 분석에 쓴다.
description_portal: 서울특별시 광진구_대규모점포 인허가 정보는 광진구 관내의 대형마트, 백화점, 쇼핑센터, 복합쇼핑몰 등 다양한 형태의 대규모 유통시설에 대한 인허가 현황을 제공합니다. 해당 업소는 복수의 납품업체로부터 상품을 공급받아 일반 소비자에게 판매하는 형태의 점포로, 유통규모와 판매시설이 일정 기준 이상인 유통업체가 포함됩니다. 데이터에는 점포명, 사업장 소재지, 인허가일자, 운영여부, 업종구분 등 다양한 컬럼이 포함되어 있어 상업시설 운영 현황을 파악하고 유통산업 관련 정책 수립에도 활용 가능합니다. 좌표는 중부원점TM(EPSG:2097) 기준의 위치정보가 제공되며, 위경도 좌표는 포함되어 있지 않습니다. 본 데이터는 최근 3일 전 기준의 인허가 상태 정보를 바탕으로 제공됩니다
