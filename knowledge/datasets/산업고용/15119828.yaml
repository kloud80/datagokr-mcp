summary_user: 경기리서치연구소가 2017년 11월 22일부터 12월 28일까지 수도권(서울·경기·인천) 거주 만 20세 이상 소비자를 대상으로 중소기업 제품 AS 이용실태를 조사한 설문 응답을 응답자 1명당 1행(rspdnt_id)으로 담고, 성별·연령대·거주지·직업·학력과 문항별 응답을 함께 싣는다. 중소기업 지원 정책 담당자나 연구자가 '중소기업 제품 AS를 이용한 소비자가 어떤 점에 불만을 느끼고, 연령대나 거주지에 따라 차이가 있는가'를 따져 보는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키가 없어 외부 데이터와는 바로 결합하지 못하고, 거주지·연령대 같은 범주 이름을 맞추거나 연구보고서 '경기도 중소기업 A/S지원 및 산업 생태계 육성방안'과 대조하는 식으로만 이어 쓴다.
description_portal: '경기리서치연구소에서 2017년 11월 22일부터 12월 28일까지 만20세 이상의 수도권에 살고 있는 소비자들을 대상으로 중소기업 제품에 대한 AS이용실태를 조사한 결과입니다.※ 설문 문항은 File 탭의 설문지 파일을 참고하시기 바랍니다.※ 중복응답의 경우, 응답 간의 구분자는 "+"입니다.※ 조사 결과를 토대로 한 연구보고서명 : 경기도 중소기업 A/S지원 및 산업 생태계 육성방안(http://library.gri.re.kr/download.do?gs_gubun=pms&filename=2/5663/F2017-90.pdf)* 항목설명(성별) 1 : 남자, 2 : 여자(연령) 1 : 20대, 2 : 30대, 3 : 40대, 4 : 50대 이상(거주지) 1 : 서울, 2 : 경기, 3 : 인천(직업) 1 : 자영업자, 2 : 사무직군, 3 : 노무직군, 4 : 서비스직군, 5 : 전업주부, 6 : 학생, 7 : 무직/은퇴, 8 : 기타(학력) 1 : 고졸 이하, 2 : 대졸, 3 : 대학원졸'
