summary_user: 충청북도 소재 여성기업 등록 현황을 업체별 한 행으로 담은 파일 데이터로, 검증 시 2,559행을 받았고 사업자등록번호·업체명·대표자·상시근로자·소재지·주업종·주요 생산품목 등을 포함한다. 도내 여성기업 인증 업체의 업종과 위치, 생산품목을 찾으려는 분석가나 공공구매 담당자, 지원사업 기획자가 쓴다. 사업자등록번호(bizno)로 다른 기업 확인·인증 자료와 기업 단위로 잇고, 소재지(address)로 주소 기반 지역 데이터와 이어 쓴다.
