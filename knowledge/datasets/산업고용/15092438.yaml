description_portal: '우리나라 교통 부문을 포함한 여러 산업 분야에서 사용되는 연료의 연간 소비량을 연료 종류별로 분류하여 제공한 데이터입니다. 에너지 정책 수립, 온실가스 감축 분석, 수송 연료 구조 파악 등에 활용됩니다.형식: CSV내용 요약■ 구분: 데이터의 항목 유형(예: "에너지소비량(TJ)"로 총 소비량을 의미)■ 합계: 모든 연료를 포함한 총 에너지 소비량■ 휘발유(Gasoline): 자동차·이륜차 등에서 주로 사용되는 휘발유 소비량■ 경유(Diesel): 트럭, 버스, 건설기계 등에서 사용되는 경유 소비량■ 프로판: 가정용·상업용·일부 차량용으로 사용되는 액화석유가스 소비량■ 부탄: LPG차량, 난방 등에 쓰이는 액화석유가스 소비량■ LNG: 액화천연가스 소비량■ 바이오디젤: 친환경 바이오 연료 소비량■ 등유(Kerosene): 난방 및 항공용 연료로 쓰이는 등유 소비량■ 경질중유(B-A), 중유(B-B), 방카C유(B-C): 산업체 및 선박용 연료 소비량■ 용제: 석유화학 공정 등에 사용되는 휘발성 용매류■ 항공유(Jet Kerosene): 항공기에 사용되는 제트 연료 소비량■ 기타제품(Other Oil): 그 외 석유계 연료 제품 소비량활용 예제■ 산업별·연료별 소비 비중을 분석하여 에너지 수요 구조 및 변화 추세를 파악하고, 탄소 중립 시나리오 수립에 기초자료로 활용■ 친환경 에너지 전환 정책(예: 바이오디젤 확대, LNG 전환 등)의 수립 및 성과 평가■ 국가 온실가스 인벤토리 작성 및 국제보고(UNFCCC 등)에 필요한 연료 소비 자료로 활용'
