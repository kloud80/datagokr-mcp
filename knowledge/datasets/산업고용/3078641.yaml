summary_user: 부산광역시 서구 안의 석유판매업 사업장(일반판매소·주유소 등)을 한 곳씩 담은 건별 목록으로, 사업장 구분·개인/법인 여부·상호·소재지 주소를 담으며 파일 크기는 약 2KB 규모의 소량 CSV다. 서구 주민이나 상권 분석가가 '서구에 주유소와 일반판매소가 어디에 몇 곳 있고 법인 운영 비중은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호를 이름 매칭해 오피넷 주유소·유가 정보나 LOCALDATA 에너지 업종 인허가 원장과 이어 쓴다.
limits: 서구 한 개 구만 담아 부산 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다. 사업자번호·인허가번호 같은 공통 키가 없어 다른 데이터와의 연결은 주소·상호 매칭에 의존한다.
