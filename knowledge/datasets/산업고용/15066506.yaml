description_portal: 한국가스공사 광주전남지역본부의 수소차 운행현황 및 운행실적 데이터 입니다. 수소차 운영현황 관리 및 친환경 차량 도입 성과 분석, 수소경제 활성화 기여도 평가, 탄소저감 성과 측정을 목적으로 수집되었습니다. 데이터 구성항목은 차량, 사용처, 1회 주행거리(km), 평균속력(km), 주행구간, 총주행거리(km), 총 연료 충전량(kg) 등으로 이루어져 있어 수소차의 운행 성과를 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 차량별 운행실적 분석, 연료효율 평가, 주행패턴 분석, 충전량 대비 주행거리 분석, 운행비용 분석이 가능합니다. 또한 수소차 확대 도입 계획 수립, 충전인프라 수요 분석, ESG 경영성과 보고, 탄소저감 실적 산정에 활용됩니다. 친환경 차량 운영 성과 관리에 기초자료로 활용됩니다.
