summary_user: 한국전력공사 전기차 충전서비스운영시스템 고객센터의 상담 기록을 상담 1건당 1행으로 담은 원천 파일로, 상담일·시작·종료시간, 민원인 구분, 3단계 민원분류, 고객 성별·나이 등을 포함한다(CSV 약 4.5MB, 전국 단위·비공간). 충전 서비스 운영자나 분석가가 '어느 요일·시간대에 상담이 몰리고, 어떤 유형의 충전 불편 민원이 많은가'를 따져 상담 인력 배치와 서비스 개선점을 찾는 데 쓴다. 충전소 ID·좌표 같은 전역 조인 키가 없어 충전소 실시간 상태나 충전소 목록과 직접 연결되지 않고, 민원분류 명칭이나 날짜를 기준으로 느슨하게 맞춰 볼 뿐이다.
limits: 충전소·지역 정보가 없는 비공간 데이터라 특정 충전소나 지역의 민원을 집계할 수 없다. 다른 데이터와 붙일 공통 키가 없어 이름·코드 매핑이나 같은 기관 데이터로만 연결된다.
