summary_user: 한국전력공사가 운영하는 전기차 충전기 수를 연도별·사용용도별(업무용·공용·아파트용·전기버스용)로 집계한 전국 단위 비공간 파일로, 775바이트 크기의 작은 CSV입니다. 충전 인프라 연구자나 충전기 제조사가 "한전 충전기 보급이 어떤 용도에 얼마나 몰려 있고 연도별로 어떻게 바뀌었나"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 용도 이름을 맞추는 방식으로만 잇고, 충전소 ID·좌표를 담은 한전 충전소 현황과 함께 볼 때도 이 방식을 쓴다.
description_portal: '한국전력공사에서 운영중인 사용용도별 전기차 충전기 현황정보 입니다.사용용도 : 업무용/공용/아파트용/전기버스용해당 데이터를 활용하여 충전 인프라의 전반적인 구조를 한눈에 파악 할 수 있어 충전 인프라 투자 방향이나 관련 연구에 기초 자료로 활용 할 수 있습니다.또한 충전기 보급 비중을 알 수 있어 관련 제조사 및 기업에서 제품 전략 수립에 참고 할 수 있고 정책 연구에 있어 충전 인프라 지원 방향에 도움을 줄 수 있을 것 입니다.한전에서 제공하는 충전소 현황 등의 다른 정보와 결합해서 사용하면 더 좋은 자료로 활용 가능 합니다.'
