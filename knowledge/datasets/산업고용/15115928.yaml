summary_user: 서울특별시 중구에서 반려동물을 구입해 판매·알선·중개하는 동물판매업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일·영업상태(영업·폐업 등)·휴업·폐업일·주소·좌표를 포함한다. 반려동물 판매업 창업을 준비하는 사업자가 중구에 현재 영업 중인 판매업소가 몇 곳이고 어디에 몰려 있는지 확인하거나, 시민이 거래하려는 업체가 등록·영업 중인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OGDP_INST_CD)로 잇고, 같은 LOCALDATA 계열의 다른 업종 인허가 원장과는 같은 구조로 나란히 비교한다.
description_portal: '서울특별시 중구의 가정에서 반려의 목적으로 사육하는 동물을 구입하여 판매, 알선 또는 중개하는 업소 정보를 제공합니다. 각 등록업체에 부여된 관리번호, 현재의 영업 상태(개설, 폐쇄 등), 상세 위치정보 등의 주요 항목들로 구성되어 있습니다. 이 자료는 반려동물 관련 산업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 유통경로 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 동물보호 관리기준을 충족하며 위탁관리를 포함한 반려동물 거래를 진행하는 등록업체를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
