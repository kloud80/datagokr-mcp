summary_user: 석유사업법상 산업통상자원부장관에게 등록하는 '부산물인 석유제품 생산판매업' 등록 업소의 명단을 업소별로 담은 전국 단위 파일로, 업소명·시도·시군구·세부주소·전화번호가 들어 있다(CSV 525바이트 규모의 소량 명단). 정유 부산물 석유제품을 생산·판매하는 등록 업체가 어디에 있는지, 특정 업체가 등록돼 있는지 확인하려는 사업자나 석유유통 분석가가 쓴다. 사업자번호 같은 전역 조인 키는 없어서, 다른 인허가(LOCALDATA)·업체 데이터와는 업소명이나 시도·시군구 이름을 맞춰서만 이어 쓴다.
description_portal: 1. 석유판매업을 하려는 자는 산업통상자원부령으로 정하는 바에 따라 특별시장‧광역시장‧특별자치시장‧도지사‧특별자치도지사 또는 시장‧군수‧구청장에게 등록을 하여야 하며, 부산물인 석유제품을 생산하여 석유판매업을 하려는 자는 산업통상자원부장관에게 등록하여야 한다.2. 석유사업법 제10조제1항 단서에 따른 부산물인 석유제품 생산판매업의 등록을 하려는 자는 별지 제9호서식의 석유판매업(부산물인 석유제품 생산판매업) 등록신청서에 사업계획서, 투자내용 확인 서류(개인사업자의 경우)를 첨부하여 한국석유관리원에 제출하여야 한다.
