summary_user: 광진구에 등록된 사료제조업 업소의 인허가 내역을 업소별로 담은 원장 데이터로, 사업장명·인허가일자·영업상태(영업/폐업 등)·휴업 기간·지번/도로명 주소·중부원점TM 좌표(XCRD·YCRD)를 포함한다. 광진구에서 현재 영업 중인 사료 제조·판매 업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 폐업했는지를 확인하려는 사업자나 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 다른 지방행정 인허가(LOCALDATA) 업종 데이터와 같은 항목 구조를 공유한다.
description_portal: 서울특별시 광진구_사료제조업 인허가 정보는 광진구 지역 내에서 동물에게 필요한 영양 성분을 포함한 사료를 제조하거나, 이를 수입·판매하는 업소에 대한 인허가 현황을 담고 있는 데이터입니다. 「사료관리법」에 따라 등록된 이들 업소는 축산용 또는 반려동물용 사료를 제조하고 있으며, 사료의 품질과 안전성 확보를 위한 시설 및 관리기준을 충족한 업체만이 허가를 받을 수 있습니다. 본 데이터에는 업체명, 업종 구분, 소재지, 인허가일자, 영업상태 등 핵심 항목들이 포함되어 있으며, 광진구의 축산 및 반려동물 산업에 종사하는 사업체 현황을 파악하는 데 유용합니다.※ 좌표정보는 중부원점TM(EPSG:2097) 기준으로 제공되며, 위도·경도는 포함되어 있지 않습니다. 데이터는 수집일 기준 3일 전 정보를 기준으로 제공됩니다.
