summary_user: 부산광역시 수영구 관내 동물병원·동물약국·동물판매업·동물미용업·동물위탁관리업·동물전시업 등 반려동물 관련 업소를 한 행에 한 곳씩 담은 목록 파일(csv, 약 20KB)로, 업종·업소명·도로명 주소·전화번호를 담는다. 수영구 주민이 집 근처 동물병원이나 미용·위탁 업소를 찾거나, 분석가가 구 안의 반려동물 업종 분포를 주소 기준으로 살펴보는 데 쓴다. 실측 컬럼에 사업자번호·관리번호 같은 공통 조인 키가 없어, 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 수영구 관내에 위치한 다양한 반려동물 관련 업체들의 정보를 제공합니다. 이 데이터에는 동물병원, 동물약국, 동물판매업, 동물미용업, 동물위탁관리업, 동물전시업 등 여러 업종이 포함됩니다. 각 업체의 업종 분류뿐만 아니라 업소명, 정확한 주소, 그리고 연락 가능한 전화번호 등의 상세한 정보를 함께 안내하여, 수영구 내에서 반려동물 관련 서비스를 이용하려는 분들이 편리하게 참고할 수 있도록 돕습니다. 이를 통해 반려동물의 건강과 복지를 위한 맞춤형 서비스를 쉽게 찾아볼 수 있습니다.
