summary_user: 제주 한림읍 상명풍력발전소(설비용량 21MW)의 발전 실적을 기준일·호기(풍력발전기)별 한 행에 1시~24시 시간대별 송전량(kWh)으로 담은 원천 시계열 파일이다(CSV 약 215KB). 신재생에너지 분석가가 '상명풍력의 호기별 발전량이 시간대·계절에 따라 어떻게 달라지는가'처럼 풍력 발전의 일·시간 변동 패턴을 확인하는 데 쓴다. 전역 조인 키는 없어, 다른 데이터와는 기준일(날짜)·시간대를 맞춰 같은 지역의 기상 관측이나 전력시장 시간별 자료와 수동으로 이어 쓴다.
description_portal: 한국중부발전(주)의 해상풍력 발전 실적 정보입니다. 현재는 제주도 한림읍에 위치한 상명목장에 설치된 상명풍력발전소는 수평축 프로펠러형으로 총 21MW의 설비용량을 통해 발전량을 제공합니다. 목록명은 "기준일", "호기", "1시" ~ "24시"로 구성됩니다.각각 일자, 풍력발전기 호기의 구분 그리고 발전 시간을 나타내며 발전시간별 컬럼은 송전량(kWh)를 단위로 합니다.일평균 8만 KWh 이상을, 매년 3천만 KWh 이상의 진기를 생산하고 있으며,2022년 이후 매년 일자별/시간별 시계열 데이터를 제공하기 때문에 신재새에너지 발전량 분석에 효율적인 데이터 입니다.※ 발전량이 0인 시간대는 값의 오류가 아니며, 실재 기상환경에 따라 발전기가 가동되지 않아 발전하지 않은 결과입니다.
