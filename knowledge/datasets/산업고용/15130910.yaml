description_portal: '- 섬섬옥수란 다자간(한국장애인고용공단, 한국철도공사, 국가철도공단, 참여기업(기관))의 협업으로 네일케어 매장을 개소하여 열차 이용 고객에게 네일케어 서비스를 제공하는 장애인 일자리 플랫폼 사업이며 섬섬옥수 운영 사업체 명단 데이터 입니다.- 섬섬옥수는 장애인 직업재활과 일자리 창출을 위해 운영되는 사업체 목록 데이터입니다. 사업체별 운영 현황, 장애인 근로자 지원 내용, 고용 규모 등이 포함되어 있으며, 장애인의 경제활동 참여 확대와 자립 지원을 위한 중요한 자료입니다. 세부 문의사항은 한국장애인고용공단 고용컨설팅부로 부탁드립니다.'
