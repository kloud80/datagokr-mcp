description_portal: '이 데이터는 조경, 원예, 조경공사, 녹지관리, 조경시공 등 다양한 분야에서 활동하는 관내 조경업체의 현황을 정리한 자료입니다. 각 업체의 상호, 사업장 주소, 연락처 등 기본 정보를 포함하고 있어 조경 관련 공사나 녹지 관리 사업 추진 시 참고자료로 활용할 수 있습니다. 또한 조경업계 종사자, 발주기관, 일반 시민이 필요 시 신속하게 업체 정보를 확인할 수 있도록 구성되었습니다. 데이터에는 일련번호, 업체명, 주소, 전화번호, 데이터 기준일이 포함되어 있으며, 이를 통해 관내 조경업체의 분포와 운영 실태를 한눈에 파악할 수 있습니다. 본 데이터의 기준일은 2025년 8월 4일입니다.순번: 데이터에 기록된 업체의 일련번호입니다.업체명: 등록된 조경업체의 상호명입니다.주소: 해당 업체의 사업장 주소입니다.전화번호: 업체의 대표 연락처입니다.데이터기준일: 데이터가 집계된 기준일로, 2025년 8월 4일로 명시되어 있습니다.'
