summary_user: 경기도 가평군의 축산업 사업장을 농가(사업장) 단위로 한 줄씩 담은 원천 목록으로, 사업장명칭·주사육업종(한우·돼지·닭 등)·도로명/지번 주소·사육두수·데이터기준일자가 들어 있다. 방역 담당자나 분석가가 '가평군 어느 읍면에 어떤 축종 농가가 얼마나 몰려 있고 사육 규모는 얼마인가'를 확인하거나, 가축 질병 발생 시 주변 농가를 추리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 사업장명칭으로 맞춰 이어 써야 하며, 같은 지역 LOCALDATA 업종 인허가 원장과도 이름·주소 매칭으로만 연결된다.
description_portal: 본 데이터는 경기도 가평군 축산업 현황을 수록한 자료로, 항목에는 사업장명칭, 주사육업종, 소재지 도로명주소 및 지번주소, 사육두수, 데이터기준일자 등이 포함되어 있습니다. 본 자료는 한우, 돼지, 닭 등 다양한 축종에 대한 사육 현황을 포함하고 있으며, 개별 농가 단위로 사육 규모와 위치 정보를 상세히 제공합니다. 이를 통해 가평군 내 축산업 분포, 사육 밀도, 업종별 현황을 파악할 수 있으며, 방역정책 수립, 축산업 관리, 가축 질병 대응 등 행정 업무의 기초자료로 활용됩니다. 또한 위치정보는 공간분석, 축산물 유통 경로 관리, 지역 축산 정책 수립 등에도 활용되며, 해당 데이터는 공공데이터포털 및 가평군 대표홈페이지 사전정보공표를 통해 제공됩니다.(가평군 대표홈페이지 사전정보공표 URL:https://www.gp.go.kr/portal/contents.do?key=641)
