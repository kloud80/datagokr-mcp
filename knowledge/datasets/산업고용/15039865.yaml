summary_user: 서울 중랑구 안에 설치된 태양광발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 설치년월·사업명·도로명/지번 주소·설비용량(kW)·연간 발전량(kWh)·관리기관을 담는다. 주민이나 분석가가 "중랑구 공공·민간 태양광 설비가 어디에 얼마 규모로 깔려 있나"를 확인하는 데 쓴다. 전역 조인 키가 없으므로 주소를 기준으로 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 맞춰 보거나 다른 자치구 파일과 이어 붙여 쓴다.
description_portal: 서웉특별시 중랑구의 태양광발전소 현황 데이터입니다. 설치년월은 2009년부터 2025년까지 데이터를 제공합니다.사업명, 주소, 설비용량(킬로와트), 연간전력발전량(킬로와트시), 관리기관에 대해서 정보를 제공하며 연간전력발전량(킬로와트시)의 경우 관리기관이 중랑구청인 경우만 정보를 제공합니다.해당 정보는 신에너지 및 재생에너지 개발·이용·보급 촉진법 제12조 제2항 및 동법 시행령 제15조,  신·재생에너지 설비의 지원 등에 관한 규정에 근거하고 있습니다. 자세한 사항은 파일 정보를 확인하여 주시기 바랍니다.
