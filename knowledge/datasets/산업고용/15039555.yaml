summary_user: 한국전력공사가 운영하는 전기차 충전기 수를 전국 행정구역 단위로 집계한 작은 CSV 파일(273바이트)이며, 지역 이름과 2025년 수량 두 컬럼만 담는다. 정책 담당자나 분석가가 '어느 지역에 한전 충전기가 상대적으로 적은가'를 확인해 충전 인프라 취약 지역을 고를 때 쓴다. 공통 조인 키가 없으므로 지역 이름을 기준으로 지역별 전기차 등록 통계나 한전의 다른 충전소 데이터와 맞춰 이어 쓴다.
limits: 지역별 합계만 있어 개별 충전소의 위치·좌표·충전기 상태는 알 수 없고, 수량 컬럼이 2025년 하나뿐이라 연도별 추이는 볼 수 없다. 포털 설명상 한전이 운영하는 충전기만 집계하므로 전국 전체 충전기 수로 해석하면 안 된다. 코드 키가 없어 다른 데이터와 붙일 때는 지역 이름 표기를 직접 맞춰야 한다.
