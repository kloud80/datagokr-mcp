summary_user: 한국남부발전(주) 소속 발전소·호기별로 1시간 단위 발전량과 송전량을 조회 시작월~종료월 범위로 돌려주는 건별 시계열 API다. 발전사업 분석가나 연구자가 '특정 남부발전 발전소 호기가 시간대별로 얼마나 발전하고 실제로 얼마나 송전했는가'를 확인하거나 시계열 분석에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 발전소·호기 코드(참고자료 코드표)나 발전소 이름 매핑으로만 이어 쓴다.
description_portal: 본 API는 한국남부발전(주)의 시간대별 발전량 및 송전량 정보조회를 위한 API GW(Gateway) 서비스입니다.공공데이터포털을 통해 인증키를 발급 받으신 후, 조회 시작월, 조회 종료월, 발전소 코드와 호기 코드를 입력하시면 시간대별(1시간 단위) 해당 발전소와 호기의 세부 발전량과 송전량을 확인하실 수 있습니다. 각 발전소 및 호기 코드는 참고자료를 통해 확인 가능합니다. 해당 API를 통하여 시간대별 발전량 및 송전량 정보를 확인하여 국내 발전현황 및 송전현황을 확인할 수 있으며 시간대별 시계열 자료 분석을 통해 다양한 학습 및 분석에 활용 가능합니다.
