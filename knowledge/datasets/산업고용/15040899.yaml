summary_user: 한국가스공사가 참여 중인 해외자원개발 사업을 사업 한 건씩 정리한 작은 목록 파일(csv 약 1.7KB)로, 구분·사업명·사업 시작·종료 연도·지분율·주요 내용을 담는다. 분석가나 정책 담당자가 '가스공사가 어느 해외 사업에 몇 퍼센트 지분으로 언제까지 참여하는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명이나 국가명을 직접 맞춰 이어야 하며, 같은 기관의 다른 해외사업 자료와 이름으로 대조하는 정도로 연결한다.
description_portal: 해외자원개발 진행사업 현황'은 한국가스공사가 진행하는 해외자원개발 사업의 현황을 상세히 정리한 데이터 입니다.해외자원개발 사업의 포트폴리오 관리 및 투자 현황 파악, 신규 사업 발굴, 사업 리스크 관리를 목적으로 수집되었습니다. 데이터 구성항목은 사업명, 사업시작연도, 사업종료연도, 지분율(%), 위치(국가/지역), 사업내용 등으로 이루어져 있어 각 사업의 핵심 정보를 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 사업별 투자현황 분석, 지역별/국가별 사업 분포 파악, 사업 진행단계별 현황 검토, 지분율 변동 이력 관리가 가능합니다. 또한 사업별 리스크 분석, 국가별 투자 집중도 평가, 사업 종료 시점 관리, 투자 포트폴리오 최적화에 활용됩니다. 신규 해외자원개발 사업 발굴, 기존 사업 확대 또는 철수 결정, 국가별 투자전략 수립 등 해외사업 기획 및 연구개발 업무에 기초자료로 활용되며, 에너지 자원 확보 전략 수립을 지원합니다.
