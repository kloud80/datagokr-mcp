summary_user: 한국모태펀드가 출자한 자조합(벤처투자조합)별로 대표 운용사 이름, 운용사 구분, 자조합 규모(백만원)를 담은 전국 단위 파일(csv, 약 50KB)이며, 포털 설명상 공백은 미수집 값이다. 벤처기업이나 분석가가 '모태펀드 자조합을 운용하는 VC는 어디이고 조합 규모는 얼마인가'를 확인하거나 운용사별 결성 규모를 비교하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 VC·투자 데이터와는 운용사 이름을 맞춰 연결해야 한다.
description_portal: 한국벤처투자가 운용하는 한국모태펀드의 자조합 구조와 대표 운용사(GP)의 현황을 상세히 보여주는 자료입니다. 시장의 수요를 반영한 회수재원의 재순환 방식을 통해 안정적인 벤처투자 자금 공급체계를 마련하고자 하는 목적 아래, 모태펀드가 출자한 펀드를 기반으로 설립된 각각의 벤처투자조합에 대한 정보를 담고 있습니다. 해당 데이터에는 각 조합을 운용하는 대표 운용사의 명칭, 대표자 정보, 연락처, 그리고 운용 중인 자조합의 규모 등 핵심적인 항목들이 포함되어 있어, 자조합 운용사들의 운영 상황 및 사업 역량을 종합적으로 파악하는 데 유용합니다. 이를 통해 국내 벤처캐피털 시장의 동향을 분석하거나, 전략적인 투자 계획 수립 및 정책 설계 시 참고할 수 있는 자료로 활용될 수 있습니다.※ 공백은 미수집 데이터 입니다.
