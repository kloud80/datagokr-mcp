summary_user: 창업기업 창업자의 남녀 비율을 업력(1~7년), 업종, 기업형태(개인·법인), 연령대 구분별로 집계한 1KB 남짓의 작은 전국 단위 CSV 파일입니다. 정책 분석가나 연구자가 '보건·사회복지 서비스업이나 20대 이하 창업에서 여성 창업자 비중이 얼마나 높은가'처럼 업종·연령·형태별 창업자 성별 분포를 확인할 때 쓴다. 전역 조인 키가 없고 구분명(구분별(1)·(2)) 텍스트만 있어, 다른 창업기업 통계와는 업종명·업력 구간 같은 이름을 맞춰서만 이어 쓴다.
