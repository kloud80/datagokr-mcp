description_portal: 데이터는 업력, 업종, 기업형태, 창업자 성별과 연령을 기준으로 남성과 여성의 비율을 제시하고 있습니다. 업력 구간은 1년부터 7년까지로 구성되며, 전반적으로 남성 비율이 여성보다 높은 경향을 보입니다. 업종별로는 제조업, 건설업, 운수업 등에서 남성 비율이 높은 반면, 교육 서비스업, 보건업 및 사회복지 서비스업에서는 여성 비율이 높게 나타납니다. 특히 보건업 및 사회복지 서비스업은 여성 비율이 80% 이상으로 가장 높습니다. 기업형태별로는 법인에 비해 개인 사업체에서 여성 비율이 더 높은 편입니다. 성별 기준에서는 여성 창업자가 남성보다 적지만, 20대 이하 연령대에서는 여성 비율이 크게 높게 나타납니다. 본 데이터는 업력 및 업종에 따른 성별 분포 특성과 창업 형태별, 연령대별 성별 차이를 분석하는 데 유용한 자료입니다.
