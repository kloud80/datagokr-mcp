summary_user: 경기도 시군별 목재수입유통업 사업장 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·자본금·취급 목재제품·연간 생산량·인력 보유 현황과 도로명·지번 주소, WGS84 좌표가 들어 있다. 목재 관련 창업을 검토하는 사업자나 분석가가 "우리 시군에서 영업 중인 수입목재 유통업체는 어디에 몇 곳이고, 주로 어떤 제품을 다루나"를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 시군명, 주소·좌표 같은 이름·위치 기준으로만 다른 LOCALDATA 업종 인허가나 상권 데이터와 맞춰 쓴다.
description_portal: '이 데이터는 수입산 목재 유통을 주요 사업으로 하는 목재수입유통업체에 대한 인허가 현황을 담고 있으며, 시군 단위로 분류된 사업장별 정보가 포함되어 있습니다. 제공되는 세부항목으로는 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 폐업일자(CLSBIZ_DE), 자본금(CAPTL_AMT), 취급목재제품설명(TRTMNT_TIMBER_PROD_DESC), 연간생산량정보(FYR_OUTTURN_INFO), 인력보유현황(MANPWR_HOLD_STUS), 목재생산종류명(TIMBER_PRODCTN_KIND_NM) 등이 있으며, 각 사업장의 소재지 도로명주소(REFINE_ROADNM_ADDR)와 좌표 정보도 수록되어 있습니다.이 데이터는 수입산 목재의 유통 구조, 유통업체의 사업 형태 및 시장 규모 분석 등에 활용될 수 있으며, 산업정책, 유통물류 개선, 환경·에너지 분야(예: 바이오에너지, 참숯 활용 등) 정책 수립에도 활용 가능합니다. 또한, 목재 관련 중소기업 현황을 파악하거나 새로운 사업 진출 시 업계 동향을 확인하는 데 유용한 기초 자료로 사용될 수 있습니다.'
