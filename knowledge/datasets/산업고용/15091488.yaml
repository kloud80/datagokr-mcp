description_portal: '수소법 시행에 따라 2022년 2월 이후 수행될 수소용품 법정검사 대상 제조업체 목록현황을 제공하여 수소용품 산업 진행 현황을 알려드리고자 제공하는 데이터입니다.해당 데이터는 분류(수소추출설비, 수전해설비, 고정형/이동형 연료전지), 업체명, 대표자, 주소로 구성되어 있습니다.수소분야 산업의 발전에 따른 수소산업 관련 기술의 발전 및 업체명 현황을 조회하여 정책 수립 및 통계 수집, 협업 과제 발굴 등에 활용할 수 있습니다.※ 해당 데이터는 공사가 안전관리 업무 활용을 위해 수집, 관리하는 정보로, 타 유관기관이 제공하는 정보와 상이할 수 있으니 참고바랍니다.※ 해당 데이터는 연간 주기로 업데이트 됩니다.- 데이터기준일 : 2026. 7. 10.'
