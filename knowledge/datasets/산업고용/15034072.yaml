summary_user: 부산일자리 정보망(busanjob.net)에 등록된 부산시 부서·공공기관·공사공단·출자출연기관·대학 등 공공부문 채용 공고를 공고 단위로 담으며, 제목·채용기관명·담당부서·근무형태·근무지역·접수기간(reqDate_s~reqDate_e)·접수방법 등이 들어 있다. 부산에서 공공부문 일자리를 찾는 구직자나 상담 기관이 "지금 접수 중인 부산 공공기관 기간제·공무직·청년인턴 공고가 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 채용·고용 데이터와는 채용기관명 같은 이름을 매핑하거나 같은 기관 기준으로만 이어 쓴다.
limits: 공고 단위 원천 정보라서 채용 인원 통계나 지역 고용동향 같은 집계는 바로 나오지 않는다. 표준 기관 코드나 공통 키가 없어 워크넷(고용24) 등 다른 채용 데이터와 자동으로 결합하기 어렵다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
