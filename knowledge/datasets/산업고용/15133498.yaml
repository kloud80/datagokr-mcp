summary_user: 2025년 전력시장에 등록된 발전기의 전력거래량(MWh, 송전단 기준)을 거래일·거래시간·지역별로 집계한 CSV 파일(약 5.5MB)로, 활용신청 없이 내려받는다. 분석가가 '어느 지역에서 어느 시간대에 전력거래량이 몰리는가'처럼 지역별 시간대 패턴과 계절·요일 변동을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름 매핑이나 거래일·시간을 맞춰서만 이어 쓰며, 같은 전력거래소의 시간별 발전량·SMP 자료와 날짜·시간 기준으로 맞춰 본다.
description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2025년의 지역별 시간대별 전력거래량을 제공합니다..ㅇ 개별 발전기의 전력거래량, 주소 등은 해당 사업자의 영업정보이므로 정보공개법(제9조)에 따라 제 3자에게 제공하지 않고 있습니다.ㅇ 전력거래량은 한전 전력수급계약(PPA) 등 전력시장에 미등록한 발전기의 발전량은 포함하지 않습니다. ㅇ 우리나라 총발전량은 “한국전력통계”(한전발간)의 공식 자료 참조하시기 바랍니다.ㅇ 거래량은 송전단 기준이며, 한전 전력수급계약(PPA)등은 포함하지 않습니다.ㅇ 단위 MWh
