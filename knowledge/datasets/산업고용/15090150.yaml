summary_user: 고용노동부가 공표한 2019~2020년 중대재해 발생 사업장 가운데 재해율이 규모별 동종업종 평균재해율 이상인 곳을 사업장 한 곳당 한 행으로 담은 소규모 공표 명단 파일(csv, 약 2.6KB)로, 재해발생 연도·지역·업종 중분류·규모·사업장명과 소재지·재해자수·근로자수·재해율·동종업종 평균재해율이 들어 있다. 구직자나 거래처를 검토하는 사업자가 "이 회사(현장)가 중대재해가 났고 동종업계 평균보다 재해율이 높은 곳으로 공표됐는가"를 확인하거나, 분석가가 지역·업종별 공표 사업장 분포를 살펴보는 데 쓴다. 전역 조인 키(사업자등록번호 등)가 없어 다른 산업재해·사업장 데이터와는 사업장명·소재지 주소나 업종명을 맞춰 연결해야 한다.
limits: 사업자번호 같은 식별 코드가 없어 사업장명·주소 매칭에 의존해야 하므로 동명 사업장이나 표기 차이로 연결이 어긋날 수 있다. 공표 대상만 담은 명단이라 전체 사업장의 재해율 비교나 개별 재해 경위 파악에는 쓸 수 없다.
