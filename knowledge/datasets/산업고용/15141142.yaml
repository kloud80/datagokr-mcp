summary_user: 은평구 내 반려동물을 구입해 판매·알선·중개하는 동물판매업소의 인허가 내역을 업소 한 곳당 한 행으로 담은 원장으로, 업소명·지번/도로명 주소·인허가일자·영업상태·휴폐업일자·중부원점TM 좌표(XCRD·YCRD)를 포함한다. 주민이나 분석가가 '우리 동네에서 지금 영업 중인 펫숍은 어디이고 언제 허가받았나', 구청이 '관내 동물판매업소 중 폐업·휴업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 같은 LOCALDATA 인허가 계열의 다른 업종 데이터와 같은 형식으로 나란히 쓴다.
description_portal: '은평구의 가정에서 반려의 목적으로 사육하는 동물을 구입하여 판매, 알선 또는 중개하는 업소 정보입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.본 데이터는 은평구 내 동물판매업소에 대한 인허가 정보를 제공하며,  업소명, 주소, 인허가일자, 영업형태, 관리기관, 주요 판매동물 종류 등의 정보를 포함합니다.  동물판매업은 반려동물 문화 확산과 직결되며, 동물복지, 소비자 보호,  불법 유통 방지 등의 다양한 사회적 쟁점과 연결됩니다.  이 데이터는 관내 영업장 현황 파악, 유기동물 문제 예방,  위법행위 점검 등의 행정 목적에 활용됩니다.  또한, 동물등록제와 연계하여 관리체계를 정비하고,  반려동물 산업의 윤리성과 지속가능성 확보를 위한 기초자료로 사용됩니다.'
