summary_user: 전국 폐광산을 광산 한 곳당 한 행으로 담은 파일로, 광산명·광산유형·가행광 여부와 시도·시군구·읍면동·리 단위 소재지를 기록한다(범위 전국, 행정단위 읍면동). 지자체·환경 복구 담당자나 분석가가 '우리 읍면동에 어떤 폐광산이 있고 어떤 유형인가'를 확인하거나 광해 복구 대상 지역을 추릴 때 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 시도·시군구·읍면동 이름을 행정구역 코드로 매핑하거나 광산명으로 맞춰 붙여야 한다.
limits: 좌표나 표준 행정코드가 없어 지도 위 정확한 지점 표시나 코드 기반 자동 조인은 바로 되지 않고, 행정구역 이름 매칭이 필요하다. 다른 데이터와의 연결은 이름·코드 매핑 또는 같은 기관 코드로만 가능하다.
