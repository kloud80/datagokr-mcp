description_portal: 한국광해광업공단의 "전국 폐광산 위치 정보" 데이터는 전국에 위치한 폐광산의 지리적 위치를 시군구 단위로 정리한 자료입니다. 이 데이터는 5년 주기로 정기적으로 갱신되며, 폐광산의 정확한 위치를 지도 기반으로 확인할 수 있어, 정책 수립, 환경 복구, 자원 개발 등 다양한 분야에서 활용됩니다. 또한, 해당 데이터는 한국광해광업공단의 공식 홈페이지와 MiReGIS 포털을 통해 제공되며, 사용자는 이를 통해 폐광산의 위치 정보를 손쉽게 열람하고 활용할 수 있습니다.  MiReGIS 포털( https://miregis.komir.or.kr/)에서는 GIS 기반의 다양한 자원 정보를 제공하므로, 폐광산 위치 정보와 함께 다른 관련 정보를 통합적으로 확인할 수 있습니다.
