description_portal: 본 데이터는 「에너지이용합리화법」에 따라 의무적으로 에너지 사용량을 신고해야 하는 에너지다소비사업자(연간 에너지 사용량 2,000toe 이상)의 석유 사용현황 정보를 제공합니다. 전국 광역시별로 구분된 데이터를 통해 다소비사업자의 연도별, 부문별 석유 소비량과 사용 패턴을 체계적으로 파악할 수 있으며, 산업 및 상업 시설 등 주요 에너지 소비처의 석유 기반 에너지 이용 현황을 정확하게 분석할 수 있습니다. 본 데이터는 정부와 지자체의 에너지 소비 관리 및 효율화 정책 수립, 석유 의존도 감축 전략 마련 및 온실가스 배출량 저감을 위한 기초자료로 활용 가능하며, 기업과 연구기관에서도 석유 소비 분석과 에너지 전환 연구를 위한 참고자료로 폭넓게 사용할 수 있습니다.
