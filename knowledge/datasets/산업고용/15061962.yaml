summary_user: 대전광역시 서구에 옥외광고업으로 등록된 업소를 한 업소당 한 행으로 담은 원장 파일로, 업소명·영업장 주소·허가(등록)일자·영업상태(정상·폐업 등)·기준일자를 수록한다. 서구 안에서 영업 중인 간판·광고물 제작업체를 찾거나, 지역별 옥외광고업 분포와 연도별 등록·폐업 추이를 보려는 사업자·분석가가 쓴다. 실측 컬럼에 사업자번호나 법정동코드 같은 전역 조인 키가 없어서, 다른 데이터와 붙이려면 업소명이나 주소를 맞춰 보거나 같은 지자체 자료끼리만 연결해야 한다.
description_portal: 본 자료는 「옥외광고물 등의 관리 및 옥외광고산업 진흥에 관한 법률」에 근거하여 대전광역시 서구 관내에서 등록된 옥외광고업체 현황을 수록한 공공데이터입니다.해당 자료는 서구청에 옥외광고업으로 정식 등록된 업소들의 기본 정보를 제공하며, 업소명, 소재지 주소, 허가(등록)일자, 현재 영업상태(정상 영업, 폐업 등) 등의 항목으로 구성되어 있습니다.옥외광고업은 옥외광고물의 제작, 설치, 유지 및 관리와 관련된 전문업종으로, 관련 법률에 따라 관할 지방자치단체에 등록해야 영업이 가능합니다.본 자료는 해당 업소의 등록 이력 및 현재 운영 상태를 파악할 수 있도록 정리되어 있으며, 서구 지역 내 옥외광고업의 분포 현황, 업종 활성도, 허가 추이 분석 등 정책 수립, 산업 분석, 행정업무 기초자료 등 다양한 용도로 활용될 수 있습니다.또한, 옥외광고물의 안전성 확보와 불법 광고물 단속, 광고산업 육성을 위한 행정 기반 자료로도 참고될 수 있습니다.
