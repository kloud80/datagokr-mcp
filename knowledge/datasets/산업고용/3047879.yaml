summary_user: 한국수력원자력이 관리하는 원자력발전소를 호기 단위로 한 행씩 담은 설비 목록으로, 호기명·위치·원자로형·설비용량(MW)·상업운전일과 영구정지·전기설비폐지신고 여부 및 그 일자를 담는다(포털 설명 기준 28개 호기, 전국 범위). 에너지 분석가나 기자가 '국내 원전 중 가동 중인 호기와 영구정지된 호기는 무엇이고 설비용량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전설비 데이터와는 호기명이나 위치(발전소 이름)를 직접 맞춰 이어 써야 한다.
description_portal: 한국수력원자력이 공개하는 원자력발전소 호기별 일반현황 데이터입니다. 한국수력원자력㈜은 2019년부터 원자력발전소의 일반현황에 관한 자료를 공개해 왔습니다. 이 자료는 한국수력원자력㈜이 관리하고 있는 원자력 발전소의 28개 호기의 명칭, 위치, 원자로형, 설비용량, 상업운전일, 비고(영구정지 또는 전기설비폐지신고), 비고 상세일(영구정지 또는 전기설비폐지신고일이 존재할 경우 상세일자)항목으로 구성되어 있습니다. 국내 원자력발전소의 기본적이고 핵심적인 정보를 파악할 수 있는 자료입니다. 설비용량의 단위는 MW입니다.
