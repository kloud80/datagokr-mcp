summary_user: 부산지역 신재생에너지(태양광·태양열·풍력·연료전지 등)의 연도별 생산량을 에너지원 구분별로 집계한 소규모 CSV 파일(614 bytes)로, 발전소 단위 원장이 아닌 연도×에너지원 집계표다. 부산의 태양광이나 연료전지 생산량이 해마다 얼마나 늘었는지 확인하려는 시민·연구자·정책 담당자가 신재생 보급 추이 분석의 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 에너지원 이름을 맞춰 연결해야 하며, 발전소 단위 정보는 전국태양광발전소전기사업허가정보표준데이터 같은 별도 원장을 참고한다.
description_portal: 본 개방데이터는 화석연료 사용을 줄여 급변하는 기후 위기 대응을 위한 이산화탄소 등 온실가스 배출 감소, 에너지 수급 안정성 확보 및 에너지 자립 강화 등을 위한 신재생에너지(태양광,태양열,풍력,지열,바이오,연료전지 등) 보급현황에 대한 데이터로 구성, 부산지역의 신재생에너지 보급현황에 대한 정보를 제공하고 있습니다.   개방데이터는 부산지역의 신재생에너지인 태양광,태양열,풍력, 연료전지 등에 대한 연도별 생산량으로 신재생에너지 보급 확대를 위한 기초자료에 활용될수 있으며, 연구 분석 자료에 활용되어, 신재생에너지 보급 확대에 기여할 수 있습니다.  * 본 개방 자료는 2024년 12월말 기준 신재생에너지 보급 통계 자료로 2025년 기준 자료는 2027년 3월 확정될 예정입니다.
