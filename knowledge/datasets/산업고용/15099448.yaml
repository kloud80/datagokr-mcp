summary_user: 연료전지 연료원의 REC(신재생에너지 공급인증서) 현물시장 거래금액(원)과 거래량을 연도별로 묶은 전국 단위 집계 파일로, 포털 설명상 2017~2021년을 담는다(163바이트 CSV). 신재생 발전사업자나 에너지 분석가가 연료전지 REC 현물 거래 규모가 해마다 어떻게 변했는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 기관의 다른 연료원 REC 거래대금 데이터와는 연도 기준으로 맞춰 비교한다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 데이터는 2017년~2021년까지의 연료전지 연료원의 현물시장 REC 거래대금을 보여줍니다.ㅇ 항목 : 연도, 거래금액(원), 거래량'
