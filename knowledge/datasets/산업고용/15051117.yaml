summary_user: 국내 완성차 7개사(현대차, 기아, 한국지엠, 르노코리아, KG모빌리티, 타타대우, 대우버스)의 기간별 생산수량, 내수판매수량, 수출수량(대)을 기업 단위로 집계한 전국 범위 파일 데이터로, 한국자동차모빌리티산업협회 자료를 출처로 합니다. 산업 분석가나 투자자가 특정 완성차 기업의 내수·수출 비중이 기간에 따라 어떻게 바뀌었는지 비교하는 데 쓴다. 전역 조인 키는 없어 기업명과 기간(기간)을 기준으로 다른 자동차 산업 통계나 기업 공시자료와 이름 매핑으로 연결한다.
description_portal: '(공통) 국내 완성차기업 7개사(현대차, 기아, 한국지엠, 르노코리아, KG모빌리티, 타타대우, 대우버스)의 내수 및 수출 실적, 생산량 등을 제공합니다.* 내수는 국내 판매 차량의 출고 기준입니다.* 수출은 통관 또는 선적 기준으로 회사 공시자료와 일부 상이합니다.* 출처 : 한국자동차모빌리티산업협회(기업별 자동차 산업현황) 국내 완성차 7개사의 기업별 실적을 제공합니다.* 기업별 주요 변경사항· 2011년 : 지엠대우 → 한국지엠· 2022년 : 대우버스 폐업("21년부터 실적 미입수)· 2022년 : 르노삼성 → 르노코리아· 2023년 : 쌍용 → KG모빌리티'
