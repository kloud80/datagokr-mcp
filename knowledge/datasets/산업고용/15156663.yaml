description_portal: 동절기 12월~익년2월 대상으로 도시가스 월별 공급량으로 전국과 5개 광역 지역, 수도권, 충청권, 대경권, 호남권, 동남권, 단위로 생성한다. 도시가스 공급량 자료는 가스공사에서 지역 도시가스사로 보내는 공급량을 의미한다. 따라서 용도 구분은 되지 않고 도시가스 총량기준으로 집계된다. 위 자료는 도시가스 피크수요 전망에서 추세변수로 활용 가능하다. 도시가스 피크수요는 전반적인 도시가스 수요증가로 인해 우상향하는 추세가 있으며, 동절기 기온변화에 따른 수요변화를 보인다. 동절기 공급량은 도시가스 피크수요의 장기적 추세를 모델링한다.
