description_portal: '○ 통계개요* 통계명 : 외국인고용 현황* 통계종류 : 조사통계, 지정통계* 조사목적 : 한국에 거주하는 이민자(외국인과 귀화허가자)의 한국생활실태, 취업 및 실업현황을파악하여 이민자관련 사회통합정책, 인력정책 등의 수립에 필요한기초자료 제공* 조사주기 : 매년(정기)* 조사대상 : 만15세이상 외국인과 최근 5년 이내 귀화허가자 중 최근 5년 이내 귀화허가를 받은 자* 조사체계 : 조사원 → 지방청(사무소) → 통계청(고용통계과)* 공표범위 : 지역 - 서울시내용 - 15세 이상 이민자의 경제활동인구, 취업자, 고용률 등○ 용어설명 :* 이민자 : 외국인과 귀화허가자를 총칭* 외국인 :「출입국관리법」제2조 제2항에서 대한민국의 국적을 가지지 아니한 사람으로정의하며, 외국인은 체류자격과 체류기간의 범위내에서 국내에 체류할 수 있음* 귀화허가자 : 한국 국적을 취득한 사실이 없는 외국인이었다가 법무부장관의 귀화허가를받아 한국 국적을 취득한 사람* 경제활동인구 : 만 15세 이상 인구 중 조사대상기간 동안 상품이나 서비스를 생산하기위하여 실제로 수입이 있는 일을 한 취업자와 일하지 않았으나 구직활동을한 실업자의 합계* 취업자 :** 조사대상주간에 수입을 목적으로 1시간 이상 일한 자** 동일 가구 내 가족이 운영하는 농장이나 사업체의 수입을 위하여 주당 18시간 이상일한 무급가족종사자** 직업 또는 사업체를 가지고 있으나 일시적인 병 또는 사고, 연가, 교육, 노사분규 등의사유로 일하지 못한 일시휴직자* 비경제활동인구 : 만 15세 이상 인구 중 조사대상기간에 취업도 실업도 아닌 상태에 있는 자* 경제활동참가율 : (경제활동인구÷15세이상인구)×100* 고용률 : (취업자÷15세이상인구)×100○ 기타 :* 통계표에 수록된 숫자는 반올림하였으므로 전체 수치와 표내의 합계가 일치하지 않을 수 있음* 2017년부터「이민자체류실태 및 고용조사」는 만 15세 이상인 이민자 중 한국에 91일 이상 계속 거주한 상주인'
