summary_user: 한국남동발전 발전소(사업소·호기) 단위로 일자별 온도·습도·풍향·풍속·강수량·기압·대기안정도·증발량·일조시간·전일강수량 등 주변 기상 측정값을 담는 API 데이터다. 발전소 인근 기상 조건이 화력발전 효율이나 함께 설치된 풍력·태양광 발전량과 어떻게 관련되는지 보려는 분석가가 "특정 발전소의 풍속·일조시간이 일별로 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 사업소코드(orgNo)·호기코드와 날짜(ym)를 기준으로 같은 기관의 발전량·배출 측정 데이터와 이름·코드 매핑으로 이어 쓰고, 기상청 관측자료와는 날짜·발전소 위치를 수동으로 맞춰 비교한다.
description_portal: 한국남동발전에서 제공하는 일자별 발전소 기상 정보 현황에 대한 데이터입니다. 온도, 습도, 풍향, 풍속, 강수량, 기압, 대기 안정도, 증발량, 일조시간, 전일 강수량, 60분 강수량, 금일 강수량 등의 기상정보 데이터를 제공합니다. 데이터에 포함된 풍속, 풍향, 일조시간 정보는 해당 발전소에 설치된 풍력 및 태양광 발전소의 발전량을 예측하는 데 가장 중요한 변수로 사용되며, 온도와 습도는 화력발전소의 효율과 전력 생산량에 직접적인 영향을 미치므로, 전력 수요 예측의 정확도를 높이는 데 활용될 수 있습니다.
