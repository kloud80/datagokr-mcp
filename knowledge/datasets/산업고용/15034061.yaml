description_portal: 기업인력애로센터는 중소벤처기업 지원사업(정책자금, 수출마케팅, 바우처 등)의 기업 현장 실사 과정에서 우수 중소기업을 발굴하고, 인력 수요를 파악하여 구인 등록을 지원합니다. 이후 매칭지원센터의 전문 상담사가 1:1 매칭 시스템을 통해 맞춤형 인재를 매칭하고, 채용 이후에도 사후관리를 수행함으로써 중소기업의 인력애로를 해소합니다.또한 특성화고, 전문대, 대학교, 직업전문학교 등 인력양성기관과 국방부·고용노동부 등 정부 부처와의 실시간 연계를 통해 상시적인 인력 매칭을 지원하고 있으며, 이러한 기능 역시 전국에 분포된 기업인력애로센터를 통해 수행되고 있습니다.
