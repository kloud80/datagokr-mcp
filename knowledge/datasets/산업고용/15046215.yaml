summary_user: 한국장애인고용공단이 실시한 직업기능스크리닝검사의 평가결과를 검사 건별로 담은 파일 데이터로, 검사일자·장애유형과 직업기능·인지문제해결·신체자립 세 영역의 문항별 점수, 영역별 원점수·T점수·준거점수, 직업적 장애 판정과 고용형태별 대상자 구분을 포함하며 범위는 전국이다. 직업재활 분석가나 연구자가 '장애유형별로 직업기능·인지·신체자립 점수 분포와 직업적 장애 판정이 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 이름 매핑이나 같은 기관(한국장애인고용공단)의 다른 데이터와 항목 이름으로만 느슨하게 연결한다.
description_portal: 한국장애인고용공단에서 실시하는 장애인 직업능력평가 도구 중 직업기능스크리닝검사의 평가결과에 대한 데이터로 검사일자, 장애유형, 문항별 점수 등에 대한 정보를 제공합니다.* 직업기능스크리닝검사는 장애인의 근로능력을 측정하기 위한 검사로 고용 및 직업재활서비스를 제공하기 위한 초기 단계에서 주로 실시하는 검사입니다. 직업재활을 수행하는 기관에서 관련 서비스를 받고자 하여 방문한 장애인, 그리고 취업을 목적으로 의뢰된 장애인에 대하여 직업적 장애를 평가하기 위한 도구로서 활용할 수 있으며 대상 장애인에게 적합한 고용 및 직업재활서비스를 선택하는데 도움을 제공할 수 있습니다.
