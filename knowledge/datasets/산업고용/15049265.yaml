summary_user: 인천광역시가 지정한 시 우수기업 명단을 기업 한 곳당 한 행으로 담은 파일(csv, 약 6KB)로, 지정연도·시군구·기업명·대표자·주생산품·지정기간을 기록한다. 거래처나 투자 대상을 찾는 기업·투자자가 '인천 어느 군구에 어떤 품목을 만드는 우수기업이 있고 지정이 언제까지 유효한가'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 인증·현황 데이터와는 기업명이나 시군구 이름을 맞춰 연결해야 한다.
