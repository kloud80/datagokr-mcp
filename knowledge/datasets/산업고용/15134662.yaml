description_portal: 골재자원조사는 안정적인 골재수급 및 골재자원 확보에 목적을 갖고 다양하고 구체적인 단계를 거쳐 수행함, 일정기준에 따라 선정된 6~8개 시군을 대상으로 1개의 시군을 기준으로 1. 조사계획수립, 2. 기본현황조사, 3. 골재자원 정밀조사 4. 종합평가 단계를 거쳐 수행함, 계획수립단계는 목적에 맞는 결과도출을 위한 수행일정 및 조사방법 등을 계획하고, 기본현황조사단계는 인문사회, 지형지질, 골재개발여건, 기존 조사현황 등의 자료를 검토 및 확보하며, 정밀조사단계에서는 해당시군 및 유통망 해석에 따른 근교 골재수급현황과 육상, 하천 및 산림과 같은 골재원별로 지질조사, 시추조사 및 광물암석학적 정밀조사를 수행하고, 마지막으로 골재자원 확보 및 개발을 위한 종합평가결과를 제시함
