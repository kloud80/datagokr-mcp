description_portal: (데이터 수집목적 및 과정)경상남도 시군별 노동조합수 및 조합원수 데이터는 2013년 부터 2017년 까지의 경상남도 및 시군별 노동조합 현황을 조회할 때 참고하실 수 있습니다. 해당 데이터는 링크데이터로 접속하여 파일을 조회 및 다운로드 하실 수 있습니다.(데이터 구성 및 세부항목) 시군별 기간별 노동조합별 노동조합 및 조합원 수로 구성됩니다. 노동조합은 한국노총, 민주노총, 전국노총, 미가맹으로 분류됩니다. 미집계 데이터는 공란처리됩니다.(데이터 현행화 시기) 해당 데이터는 통계DB에서 자동으로 갱신됩니다.
