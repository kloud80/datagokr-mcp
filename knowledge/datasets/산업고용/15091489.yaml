description_portal: '충북혁신도시 이전기관(한국가스안전공사, 한국소비자원, 한국고용정보원)과의 협업 과제 발굴을 통해 생성된 데이터로, 이전기관의 사회공헌활동 현황을 공개합니다.사회취약계층, 유관단체, 아동청소년, 노인시설, 농촌시설 등 다양한 계층을 대상으로 상생과 가스 안전 문화 확산 및 지역사회 안전관리 지원 목적으로 추진된 사회공헌 활동 내역입니다.기관, 활동연도, 구분, 활동명, 활동내역에 관한 내용을 파일데이터 형식으로 제공합니다.- 활동 범위는 2017년부터 2025년까지며 연도 기준으로 제공합니다.- 수시 주기성 데이터로, 향후 추가 업데이트 예정입니다.- 데이터기준일 : 2025년 9월 18일'
