summary_user: 전력거래소 전력시장에서 경제성 수요반응(DR)자원이 발전자원과 가격 경쟁 입찰해 낙찰된 뒤 부하를 감축한 실적을 담으며, 입찰량·낙찰량·감축량·이행률을 D-2월 정산 기준으로 월별 합산한 전국 단위 집계다. 에너지 분석가나 DR 사업자가 "최근 몇 달간 경제성 DR 낙찰량 대비 실제 감축량과 이행률이 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 SMP·전력수급 등 같은 기관의 다른 전력시장 데이터와는 거래일(tradeDay) 같은 날짜 기준으로만 맞춰 붙인다.
description_portal: ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다. ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다.발전자원과 경쟁적으로 가격을 입찰하여 발전가격보다 저렴한 경우 낙찰되며 자발적으로 낙찰된 부하를 감축한 실적을 조회할 수 있는 서비스.입찰량, 낙찰량, 감축량, 이행률 등 월별 경제성 수요반응자원 거래실적을 D-2월 정산기준으로 월별 합산하여 제공합니다.
