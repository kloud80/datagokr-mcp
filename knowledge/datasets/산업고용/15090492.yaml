description_portal: 본 정보화사업 대한 수요예보 데이터는 한국중부발전의 차년도 정보화사업에 대한 수요예보 조사 자료입니다. 향후 발주 예정인 정보시스템 구축 및 IT기기(하드웨어·소프트웨어) 구매에 대한 계획을 담고 있습니다. 엑셀 파일 형식으로 구성되어 있으며, 사업 유형별로 시트가 구분되어 정보시스템 구축, 하드웨어 구매, 소프트웨어 구매 등 각 영역의 수요를 구체적으로 확인할 수 있습니다. 각 시트에는 구매품목, 구매시기, 구매예산, 구매정보 등의 항목이 포함되어 있어 기업 및 공급업체 입장에서는 차년도 발주 방향을 미리 예측하고 대응 전략을 수립하는 데 매우 유용합니다.
