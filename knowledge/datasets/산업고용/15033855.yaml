summary_user: 한국남부발전이 추진하는 신재생에너지 사업(태양광·풍력·소수력 등)의 개발계획을 사업 건별로 담은 소규모 파일(csv 821바이트)로, 사업명·착수/준공일자·설비용량(MW)·위치(시·도)·사업구조(SPC·자체사업 등)를 기록한다. 에너지 정책 연구자나 재생에너지 투자 분석가가 '남부발전이 어느 지역에 어떤 방식으로 몇 MW 규모의 신재생 사업을 언제 준공하려 하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명·시도 이름 매핑으로만 잇고, 발전소 단위 주소·용량이 있는 전국태양광발전소전기사업허가정보 표준데이터와 이름·지역 기준으로 대조하는 정도로 쓴다.
description_portal: 이 데이터는 한국남부발전이 추진 중인 신재생에너지 사업의 개발계획 정보를 정리한 자료입니다. 사업명, 착수일자, 준공일자, 설비용량(MW), 위치(시·도), 사업구조 등이 포함되어 있으며 태양광, 풍력, 소수력 등 다양한 에너지원이 망라되어 있습니다. 예를 들어 산업단지 태양광, 고속도로 태양광, 오미산 풍력, 금성산 풍력, 안동보 소수력 등 주요 프로젝트의 추진 일정과 규모를 확인할 수 있습니다. 이를 통해 신재생에너지 보급 확대 현황, 지역별 발전소 분포, 사업 구조별 추진 방식(SPC 사업·자체사업 등)을 비교할 수 있습니다. 이 자료는 친환경 에너지 전환 정책 연구, 재생에너지 투자 전략 수립, 지역사회 개발 계획 수립 등 다양한 분야에서 기초자료로 활용될 수 있습니다.
