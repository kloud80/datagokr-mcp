summary_user: 경기도가 제공하는 가맹사업 관련 홍보영상의 목록을 영상 한 건 단위로 담는다. 항목은 제목, 게시 시작·종료일시, 등록일시, 관련 설문 수이고, 영상 주제는 정보공개서 등록 절차, 과태료·행정처분 안내, 공정거래 제도 등이다. 예비창업자나 가맹사업자가 "정보공개서 등록이나 과태료를 안내하는 경기도 교육영상이 무엇이 있고 언제 게시됐나"를 확인하는 데 쓰고, 담당자는 콘텐츠 게시 현황과 설문 연계 정도를 볼 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어서, 연결은 영상 제목 같은 이름 매핑이나 같은 기관 기준으로만 한다.
description_portal: 이 데이터는 경기도에서 제공하는 가맹사업 관련 홍보영상 자료에 대한 정보를 담고 있으며, 각 영상의 제목, 게시 시작일시와 종료일시, 등록일시, 관련 설문 수 등의 항목으로 구성되어 있습니다. 영상 주제는 정보공개서 등록 절차, 과태료 및 행정처분 안내, 공정거래 제도 등 가맹사업자 및 예비창업자 대상의 행정정보 전달과 교육을 위한 내용을 포함하고 있습니다. 이 데이터는 행정 홍보 콘텐츠 활용 현황 분석, 정책 교육자료 수요 파악, 이용자 관심도 조사 등에 활용될 수 있습니다. 해당 영상 정보는 정책 홍보뿐 아니라 가맹사업 관련 법령 및 제도 교육 자료에 대한 목록을 확인하는데도 활용 가능합니다.
