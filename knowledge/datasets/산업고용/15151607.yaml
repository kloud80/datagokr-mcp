description_portal: "「중소벤처기업진흥공단_자연재해 중소기업 지원 현황」은  자연재해 자금 지원 업체에 대한 정보를 전달하고 있습니다. 긴급경영안정자금 재해중소기업지원자금은 '재해 중소기업 지원지침(중소벤처기업부 고시)'에 따라 '자연재난' 및 '사회재난'으로 피해를 입은 중소기업을 대상으 지원하는 자금이며, 해당 데이터는 2024년 자연재해 중소기업 지원 업체에 대한 업력, 업종, 지원금액 등을 파악하는데 활용할 수 있습니다.칼럼명 : 순번, 업력, 업종, 지원일자, 지원금액관심 분야 : 자연재해 대응, 중소기업 지원 정책, 재해 피해 복구, 피해기업 지원, 정책자금 지원, 중소기업 금융 지원, 재난 복구 자금, 공공데이터 개방, 재해 복구 지원, 중소기업 경영 지원, 자연재해 예방, 기업 재난 대응, 중소기업 피해복구, 재난 대응 정책, 중소기업 창업 지원, 기업 안전관리, 재해 대출 지원, 지역 경제 활성화, 중소기업 정책 개발, 정부 재난 지원 등"
