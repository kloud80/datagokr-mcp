summary_user: 인천광역시 남동구가 추진하는 기업지원사업을 사업 한 건당 한 행으로 정리한 목록으로, 구분·지원업무명·지원내용·진행사업 확인 경로·남동구청 담당부서와 연락처를 담는다(csv 약 2.7KB 규모의 소량 파일). 남동구 소재 중소기업·창업자가 '우리 구에서 받을 수 있는 지원사업은 무엇이고 어느 부서에 문의하나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 K-Startup·기업마당 등 다른 지원사업 공고 데이터와는 지원업무명이나 담당부서 이름으로만 대조해 이어 쓴다.
