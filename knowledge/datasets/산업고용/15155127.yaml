summary_user: 전국 지자체가 관리하는 계량기수리업 인허가 원장으로, 업소 1곳을 1건으로 담으며 API 전체 1,169건, 인허가일자 1998-12-17부터 2026-09-24까지 범위다. 계량기 수리업소가 어디에 있고 영업 중인지, 폐업·휴업했는지 확인하려는 분석가나 지자체 담당자가 쓴다. 지번주소·도로명주소(address) 키로 다른 주소 기반 데이터와, 관리번호(pnu 키로 실측됨)로 필지 단위 데이터와 이어 쓴다.
description_portal: '자원환경_계량기수리업 데이터는 계량을 하기 위한 기계·기구 또는 장치를 수리하는 업소 데이터로 인허가번호, 인허가일자, 영업상태, 소재지주소, 사업장명 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 계량기수리업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 국가기술표준원 계량측정제도과 / 043-870-5512 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
