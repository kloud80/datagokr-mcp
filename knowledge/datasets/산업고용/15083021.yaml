summary_user: 전국 ESCO(에너지절약전문기업) 등록 업체를 한 곳씩 건별로 담은 파일 데이터로, 업체명·대표자·주소·지역·주요투자분야·등록일자를 포함하며 299행, 1997-03-15부터 2026-04-20까지의 등록을 다룬다. 에너지 사용자가 시설 개선을 맡길 지역 내 ESCO 업체를 찾거나, 분석가가 지역별 ESCO 등록 분포를 보는 질문에 쓴다. 사업자등록번호(bizno)와 주소(address)를 키로 다른 사업자·인허가 데이터나 주소 기반 지역 자료와 이어 쓴다.
description_portal: ESCO(에너지절약전문기업) 사업은 에너지 사용자가 기존의 노후화되거나 저효율로 운전되는 시설을 고효율 에너지 사용시설로 교체 또는 개선하고자 하나, 기술적·경제적 부담으로 추진하기 어려운 경우 전문 기업이 시설 설치에 필요한 투자비를 조달하고, 시설 설치 및 성과를 보증하는 사업입니다. 본 데이터는 전국 ESCO 사업 참여 기업의 업체명, 주소, 소재지역 등 상세 현황을 제공하며, 에너지 사용자가 ESCO 기업의 지역별 현황을 파악하여 효율적인 시설 개선을 계획하고 사업 참여기업을 선택하는 데 활용할 수 있습니다. 또한 정부 및 연구기관은 ESCO 시장 현황 분석, 에너지절약시설 보급 현황 평가, 정책 수립과 성과 분석에 유용하게 활용할 수 있습니다.
