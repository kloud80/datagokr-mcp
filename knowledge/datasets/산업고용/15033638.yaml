summary_user: 울산광역시 안의 전기사업체(발전사업자 등)를 사업체 한 건씩 담은 파일로, 상호·설치장소·허가일자·사업개시일·원동력종류·설비용량(킬로와트)·영업 상태를 수록한다. 에너지 분석가나 지역 주민이 '울주군에 허가된 태양광 등 발전설비는 몇 곳이고 총 용량은 얼마인가'처럼 구군별 발전 인프라 분포와 허가 추이를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전소·신재생 원장과는 상호나 설치장소 주소를 이름·주소 매칭으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 구군별 전기사업체 현황을 제공한다. 지역 내 전력 생산 및 공급을 담당하는 발전사업자와 전기시설 운영 정보를 포함한다. 상호, 설치장소, 설비용량 등의 항목을 수록한다. 상호는 전기사업 영위 사업자 명칭이며, 설치장소는 발전설비나 전기시설이 위치한 주소이다. 설비용량은 발전설비의 최대 전력 생산량을 의미하며 메가와트 단위로 표시된다. 전기사업은 전기사업법에 따라 발전사업 등으로 구분된다. 북구, 남구, 중구, 울주군 등 행정구역별로 구분되어 지역별 전력 생산 인프라 분포를 파악할 수 있다. 본 데이터로 지역 에너지 생산 현황과 전력 인프라를 확인할 수 있으며, 에너지 정책 수립 및 전력 수급 계획 기초 자료로 활용된다.
