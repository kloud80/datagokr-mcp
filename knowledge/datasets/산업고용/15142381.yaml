description_portal: 'ㅁ (개요) 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅁ (계절관리제) 미세먼지 특별법(19.2월 시행)에 따라 매년 12월~3월을 미세먼지 계절관리 시간으로 정하고, 수송.산업.발전 등 부문별 대책을 추진ㅇ 계절관리제 기간인 매년 12월~이듬해 3월 동안 발전부문 미세먼지 저감 조치로서 석탄발전 감축운영을 실시  * 공공석탄 53기를 대상으로 일부 가동정지 또는 최대출력 80% 이내에서 제약운전ㅁ (석탄감축 실적) 가동정지 및 상한 제약 목표 수립 및 달성해당 데이터는 1~5차 계절관리제 운영 실적입니다.※ 단위 : 기※  ex) 8-15 → 8~15기'
