summary_user: 서울시에 소재한 유료직업소개소를 사업장 한 곳씩 담은 인허가 원천 데이터로, 인허가일자·폐업일자·영업상태와 상세영업상태, 지번·도로명주소, 좌표, 사업장명, 전화번호, 법인구분을 담는다. 구직자가 우리 동네에서 현재 영업 중인 허가 직업소개소를 확인하거나, 분석가가 자치구별 직업소개소 분포와 휴·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)·관리번호로만 연결하며, 좌표(X·Y)로 지도 위 다른 시설 데이터와 겹쳐 본다.
description_portal: 서울시 유료직업소개소 인허가 정보는 서울시에 소재한 유료직업소개소의 인허가 이력과 영업 현황을 담은 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 각 소개소가 언제 허가를 받고 현재 영업 중인지, 휴업·폐업 등 행정 변동이 있었는지 파악할 수 있습니다. 지번·도로명주소, 우편번호, 좌표, 사업장명, 전화번호는 위치와 기본 정보를 제공해 권역별 직업소개소 분포 분석에 활용됩니다. 업태구분명은 직업소개 관련 업종 특성을, 법인구분명과 구분명은 개인·법인 여부 등 사업자 형태를 나타내어 고용서비스 공급 구조를 분석하는 데 도움을 줍니다.
