description_portal: 한국산업기술기획평가원에서 매월 정기적으로 발간하는 종합 R&D 성과 정보지인 ‘이달의 신기술’은 산업기술 연구개발(R&D) 성과의 확산과 활용을 촉진하기 위해 기획된 매거진 형태의 정보지입니다. 발간 현황은 발행년도, 발행제목, URI 등의 구성으로 제공되어 이용자가 손쉽게 접근할 수 있도록 정리되어 있습니다. ‘이달의 신기술’은 전 기술 분야를 아우르는 전문가 칼럼과 인터뷰, 글로벌 정책과 시장 트렌드, 최신 기술 동향과 산업 전망, 사회적 이슈와 연결된 기술 성과 등 다양한 정보를 포함하고 있으며, 기술혁신과 사업화에 참고할 수 있는 실제 우수 기업의 R&D 수행 사례와 경영 전략 등의 콘텐츠도 함께 담고 있습니다. 이를 통해 연구자, 기업인, 정책 관계자 등에게 R&D 성과를 실질적으로 접하고 응용할 수 있는 폭넓은 정보를 제공하여 산업기술 발전과 혁신 생태계 조성에 기여하고 있습니다.
