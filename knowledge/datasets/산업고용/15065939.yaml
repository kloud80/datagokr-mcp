description_portal: 한국가스공사의 도시가스 용도별 권역별 중기 수요전망(5개년) 데이터 입니다. 권역별 중기 수요예측 및 광역 공급계획 수립, 권역간 수급 균형 분석, 투자 우선순위 결정을 목적으로 수집되었습니다. 데이터 구성항목은 용도별, 권역별(강원권, 수도권, 영남권, 제주, 중부권, 호남권), 연도별 수요전망(천㎥ 단위)으로 이루어져 있어 향후 5개년간 권역별 수요 변화를 종합적으로 예측할 수 있습니다. 본 데이터를 활용하면 권역별 중기 수요 증가율 분석, 용도별 수요 전망 비교, 권역간 수요 격차 분석, 수요전망 대비 공급능력 평가, 고성장 권역 식별이 가능합니다. 또한 권역별 공급 인프라 확충 계획 수립, 권역간 공급망 연계 방안 검토, 광역 수급계획 수립, 권역별 투자 배분에 활용됩니다. 천연가스 중기 수급계획 수립과 권역별 투자 의사결정에 기초자료로 활용됩니다.
