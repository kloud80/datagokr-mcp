description_portal: 서울특별시 광진구_지하수영향조사기관 인허가 정보는 광진구 지역 내 지하수 개발·이용 행위가 인근 지역에 미치는 영향을 과학적으로 분석하고 예측하는 전문 조사기관의 인허가 현황을 포함한 데이터입니다. 지하수영향조사는 수질 오염, 수위 변화, 생태계 교란 등 개발행위로 인한 환경적 영향을 사전에 파악하고 방지하기 위한 법정 절차이며, 조사기관은 관련 법령에 따라 등록 및 인허가를 받아야 합니다. 본 데이터에는 기관명, 사업장 주소, 허가일자, 업종 구분, 운영상태 등의 정보가 포함되어 있으며, 환경영향평가나 수자원 보전 정책 수립, 민원 대응 등의 목적으로 활용될 수 있습니다. 좌표 정보는 중부원점TM(EPSG:2097) 기준으로 제공되며, 위도 및 경도 정보는 포함되지 않습니다. 데이터는 3일 전 기준으로 최신 정보가 반영되어 있습니다.
