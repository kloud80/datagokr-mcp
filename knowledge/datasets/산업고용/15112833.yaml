summary_user: 중소벤처기업진흥공단이 운영하는 중고설비 거래 사이트 자산거래중개장터에 기준일 현재 등재된 매물을 한 건씩 담은 파일 데이터로, 제품명·카테고리·모델명·제조사·제조년월·수량·희망가격·판매상태·물건위치 등을 담는다(전국 범위, CSV 약 3.3MB). 중고 기계설비를 사거나 팔려는 중소기업이나 분석가가 '특정 종류 설비의 중고 매물이 어느 지역에 얼마의 희망가격으로 나와 있나'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 제조사명·지역명 같은 이름 매핑으로만 느슨하게 연결한다.
description_portal: '자산거래중개장터 매물정보는 중소벤처기업진흥공단에서 운영하는 중고설비 거래 사이트인 자산거래중개장터에 등재된 기준일의 매물정보 데이터 입니다.(제공 데이터 : 가동여부,문의갯수,판매상태,제품명,조회수,카테고리,모델명,키워드,수량,희망가격,가격협의가능,사용여부,제품상태,제조년월,제조사,제조국,거래가능지역,물건위치,수리가능여부 등)자산거래중개장터(www.joonggomall.or.kr)는 중소기업에서 사용하는 기계설비의 신속한 거래중개 정보를 제공하는 온라인 종합 중개장터입니다.'
