summary_user: 경상북도 시군이 내준 토석채취 허가를 건별로 담은 파일로, 허가 1건마다 수허가자·소재지·지번·채취 용도(쇄골재용·토목용 등)·허가면적(천㎡)·허가량(천㎥)·허가 시작일과 종료일이 들어 있습니다. 골재 수급을 검토하는 분석가나 사업자가 '경북 어느 시군에서 어떤 용도로 얼마만큼의 토석채취가 허가돼 있고 언제 만료되는가'를 확인하는 데 씁니다. 행정코드 같은 공통 조인 키는 없으므로 소재지·지번 문자열을 주소나 필지 정보에 맞춰 붙여야 하고, 산지·국토 공간 규제 자료와 겹쳐 볼 때도 같은 방식으로 연결합니다.
description_portal: 지역 개발, 공공 인프라 건설, 산업단지 조성 등에 필요한 골재(모래, 자갈, 흙 등)를 확보하기 위한 경상북도 토석채취 사업 현황 및  골재관련 정보에 관한 데이터로 경상북도 시군의 허가내역(수허가자,소재지,지번,토석채취용도(쇄골재용-토목용 등),허가면적(천제곱미터),허가량(천세제곱미터),허가시작일,허가종료일,데이터기준일자)에 관한 현황 자료를 제공합니다. 토석채취의  인허가 신청은 산지관리법 25조에 따라  국유림이 아닌 산림의 산지에서 토석을 채취하려는 자는 대통령령으로 정하는 바에 따라 다음 각 호의 구분에 따라 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장에게 토석채취허가를 받아야 합니다. 관련문의)산림정책과 054-880-3607
