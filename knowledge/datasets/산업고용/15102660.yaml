summary_user: 인천 부평구에 등록된 전문건설업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·업종·도로명 소재지주소·전화번호가 들어 있다(CSV 약 44KB). 부평구 안에서 특정 전문건설 업종의 업체가 어디에 얼마나 모여 있는지, 시공을 맡길 지역 업체 연락처가 무엇인지 확인하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어서 다른 데이터와는 업체명·주소 문자열 매칭으로만 잇고, 지방행정 인허가(LOCALDATA) 건설업 자료와는 같은 방식으로 대조한다.
description_portal: '전문건설업체의 명칭, 업종, 소재지 주소, 전화번호 등을 수록한 데이터.지역 내 건설산업 기반 현황을 파악하고, 업종별 전문건설업 분포 분석, 건설 경기 동향 파악, 행정 관리 및 건설 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 전문건설업 등록 현황 및 업종별 분포 분석– 소재지 주소 기반 입지 특성 및 지역 건설업 밀집도 파악– 건설산업 정책 수립 및 행정 관리 자료 활용– 지역 경제 활성화 및 건설 인프라 확충 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 업체명: 등록된 전문건설업체의 명칭● 업종: 업체가 수행하는 전문건설업 업종 구분● 소재지주소: 업체의 도로명 주소● 전화번호: 업체의 공식 연락처'
