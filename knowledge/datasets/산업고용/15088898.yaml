summary_user: 중앙정부·지자체·공공기관이 운영하는 고용 관련 사업과 정책을 정책 1건당 1행으로 모은 관리목록 파일(csv, 약 526KB)로, 정책명·정책분야·지원대상·지원유형·생애주기·대상지역·예산·근거규정·신청 필요 여부 등을 담는다. 연구자나 행정 담당자가 "청년 대상 고용장려금 성격의 정책이 부처별로 얼마나 겹치는가" 같은 중복성 검토나 신규사업 기획에 쓰고, 구직자 맞춤 정책 안내의 기초자료로도 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 정책명이나 정책분야·지원유형·생애주기 등 자체 코드를 매핑해 정부지원 일자리사업 등 같은 기관 자료와 연결한다.
description_portal: 본 자료는 산재된 고용정책 관련 정보를 통합하여 관리하는 고용정책 관리 리스트로, 정책 기반 데이터를 표준화된 구조로 정리함으로써 고용정보의 유통 효율성과 행정 연계성을 강화하는 것을 목적으로 합니다.중앙정부 및 지방자치단체, 공공기관 등에서 운영 중인 고용 관련 사업과 정책들을 하나의 목록체계로 통합하여, 정책명, 소관 부처, 정책 유형, 지원 대상, 주요 내용, 사업 기간, 추진 기관 등의 정보를 포함합니다.이 리스트는 정책 간 중복성 검토, 신규사업 기획, 수요자 맞춤형 정책 설계 등 행정 및 연구 분야에서 폭넓게 활용될 수 있으며, 일자리정책 통합관리시스템 구축과 같은 데이터 유통 기반 인프라 마련에 중요한 기초자료로 기능합니다.
