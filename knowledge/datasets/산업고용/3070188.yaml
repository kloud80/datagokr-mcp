summary_user: 부산 영도구에 등록된 옥외광고업 업소를 한 곳씩 담은 건별 현황 파일로, 등록연월일·업소명·영업장 전화번호·도로명주소·작업장 면적·종업원 수를 담는다(약 1.7KB 규모의 소량 CSV). 간판·현수막 제작을 맡길 영도구 내 등록 옥외광고업체를 찾는 주민이나 사업자, 또는 구 단위 옥외광고업 분포와 규모를 보려는 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명주소나 업소명으로 맞춰 잇거나, 다른 지자체의 같은 LOCALDATA 업종 인허가 현황과 나란히 놓고 쓴다.
description_portal: 영도구 옥외광고업 현황은 옥외광고 업소명, 주소, 영업장 전화번호, 작업장 면적, 종사자수 등을 포함한 공공데이터로 구성됩니다. 예를 들어, 영도구 내 간판, 현수막, 벽보, 디지털사이니지 등 다양한 광고물 설치할 수 있는 옥외광고업  현황을 데이터화하여 시민과 기업이 활용할 수 있도록 공개합니다. 또한 정보를 표준 형식으로 관리해 데이터의 신뢰성과 활용성을 높입니다. 이를 통해 행정 효율성 향상, 도시 미관 개선, 안전한 광고물 관리가 가능해지며, 민간에서도 상권 분석, 위치 기반 서비스 개발 등 다양한 분야에 활용할 수 있습니다. 이러한 데이터는 주기적으로 업데이트되어 영도구 옥외광고 환경을 체계적으로 관리하는 데 중요한 역할을 합니다.
