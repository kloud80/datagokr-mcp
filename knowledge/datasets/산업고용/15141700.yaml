summary_user: 하남시 관내 태양광 발전사업 허가를 발전시설 한 곳당 한 행으로 담은 건별 원장 파일(CSV)로, 시설명·도로명/지번 주소·위경도·설비용량·공급전압·허가일자·사업개시일자·가동상태를 포함한다. 주민이나 발전사업 검토자가 '우리 동네에 허가된 태양광 발전소가 어디에 몇 kW 규모로 있고 실제 가동 중인가'를 확인하거나, 분석가가 시 단위 태양광 허가 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·위경도나 시설명으로 맞춰 이어야 하며, 전국 태양광 발전사업 허가 표준데이터나 에너지 업종 인허가 원장과 같은 항목 구성으로 나란히 비교하는 데 쓴다.
description_portal: 경기도 하남시 태양광 전기사업 허가현황 정보는 관내 태양광 발전사업의 인허가 및 운영 현황을 체계적으로 파악할 수 있도록 다양한 세부 항목을 제공합니다. 주요 제공 항목으로는 태양광발전소명, 소재지 주소(도로명주소 및 지번주소), 설비용량(kW), 공급전압(V), 주파수(Hz), 설치연도, 허가일자, 사업개시일자 등이 있으며, 이를 통해 각 발전소의 규모와 위치, 전기적 특성, 인허가 진행 경과 및 실제 운영 개시 여부 등을 종합적으로 확인할 수 있습니다. 또한 행정적 관리, 정책 수립, 통계 분석 및 민원 대응을 위한 기초자료로도 활용 가능하며, 관련 부서 간 업무 협조 및 정보 공유 공동데이터 자료로도 유용하게 폭넓게 활용될 수 있습니다.
