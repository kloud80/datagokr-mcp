summary_user: 경기도 부천시에 있는 LPG 판매소·충전소, 도시가스 충전소 등 가스사업자를 시설 한 곳당 한 행으로 담은 소규모 CSV 파일(약 1.7KB)로, 시설 유형·시설명·소재지 주소·전화번호를 담는다. 부천 시민이 "우리 동네에서 가까운 LPG 충전소나 판매소가 어디이고 연락처는 무엇인가"를 찾거나, 담당자가 관내 가스시설 목록을 점검·민원 응대에 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 소재지 주소나 시설명을 맞춰 붙이는 방식으로만 이어 쓰며, 주소를 좌표로 바꿔 지도에 올리거나 LOCALDATA 에너지 업종 인허가 원장과 시설명·주소로 대조하는 데 쓴다.
description_portal: 경기도 부천시에 위치한 각종 가스사업자에 대한 상세하고 체계적인 정보를 제공하는 공공데이터로, 액화석유가스(LPG) 판매소, 액화석유가스 충전소, 도시가스 충전소 등 다양한 유형의 가스 관련 시설의 현황을 폭넓게 포함하고 있습니다. 본 데이터는 각 시설의 정확한 명칭, 소재지 주소, 시설 유형(판매소, 충전소 등), 그리고 연락 가능한 전화번호 등의 항목으로 구성되어 있으며, 이를 통해 시민들은 가까운 가스시설을 손쉽게 찾고 이용할 수 있습니다. 또한 해당 데이터는 지자체나 관련 기관의 가스시설 안전 관리, 점검, 정책 수립 및 민원 응대 등에 효율적으로 활용될 수 있으며, 업계 종사자나 일반 기업에서도 상업적 목적이나 수요 분석 등 다양한 분야에서 유용하게 활용할 수 있는 공공자원입니다.
