summary_user: 중소벤처기업진흥공단이 성장공유형 대출(전환사채·신주인수권부사채·전환우선주 인수 방식)로 2024년에 지원한 기업을 업체 단위로 담은 파일로, 업종·지역·종업원규모·매출규모·업력·지원금액(백만원)을 제공하며 범위는 전국이다. 정책자금 분석가나 창업기업이 성장공유형 대출이 어떤 업종·지역·규모·업력의 기업에 얼마씩 돌아갔는지 확인할 때 쓴다. 조인 키는 공단 내부 업체번호(sbc_fund_company_no) 하나라서 같은 업체번호를 쓰는 공단의 다른 정책자금 지원 현황과 묶어 볼 수 있고, 사업자등록번호는 없어 외부 기업 원장과 바로 연결하지는 못한다.
description_portal: 동 데이터는 중소벤처기업진흥공단 정책자금 방식 중 하나인 성장공유형대출이며, 2024년 지원기업의 지원현황(업종, 지역, 종업원규모, 매출규모 등)을 제공합니다.성장공유형 대출은 미래 성장 가치가 우수하고 향후 IPO 가능성이 있는 중소벤처기업에 대해 자금을 지원하여 창업활성화 및 성장단계 진입을 도모하는 것을 목적으로하며, 전환사채, 신주인수권부사채, (상환)전환우선주를 직접 인수하는 방식으로 지원하고 있습니다. 성장공유형 대출의 지원 범위는 운전자금 및 시설자금(토지구입, 건축 제외)이며, 기업당 20억원 내외로 지원하고 있습니다.
