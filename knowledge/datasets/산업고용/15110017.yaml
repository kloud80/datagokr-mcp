description_portal: 이 데이터는 한국남부발전 본사와 각 사업소에서 연도별로 사용한 에너지 사용량을 정리한 자료입니다. 본사, 하동빛드림본부, 신인천빛드림본부, 부산빛드림본부, 남제주빛드림본부 등 주요 사업소를 대상으로 2016년부터 2023년까지의 에너지 사용량(TJ, 테라줄 단위)을 제공하고 있습니다. 이를 통해 사업소별 에너지 소비 추이를 확인할 수 있으며, 특정 시기별 변화와 감소·증가 요인을 비교 분석할 수 있습니다. 또한 발전소 운영 효율성 진단, 에너지 절감 정책 수립, 탄소중립 추진 전략 마련 등에 기초자료로 활용할 수 있습니다. 공공기관의 에너지 관리 현황을 객관적으로 제공하여 남녀노소 누구나 쉽게 이해하고 접근할 수 있는 환경경영 데이터로서 활용될 수 있습니다.
