description_portal: 한전KPS 야외 전기차 충전소는 친환경 교통 수단 이용 확대와 탄소중립 실현을 지원하기 위해 조성된 공공 인프라입니다. 본 충전소에는 100kW급 충전기가 2대 설치되어 있으며, 각 충전기는 50kW 용량의 충전 포트를 2개씩 갖추고 있어 4대의 차량을 동시에 충전할 수 있습니다. 충전기는 24시간 무료로 이용이 가능하며 안내 표지판을 설치하여 이용자의 접근성을 높였습니다. 전기차 이용자의 접근성 제고 및 친환경 교통환경 조성에 활용하실 수 있습니다. (참고로, 한전KPS는 부지만 제공하고 충전기는 외부 업체가 운영 관리하고 있음을 알려드립니다.)
