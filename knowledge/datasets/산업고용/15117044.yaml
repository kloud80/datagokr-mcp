description_portal: 한국산업기술진흥원의 사업 과제 지원을 통한 기관 및 기업 대상 국내외 학술, 기술, 장기, 단기 등의 연수지원 현황 정보입니다. 이 데이터는 연수 지원의 다양한 형태와 세부 내역을 체계적으로 정리하여 제공하고 있으며, 관련 기관과 기업이 연수 프로그램을 보다 쉽게 이해하고 활용하는 데 기여할 수 있습니다. 또한, 이 데이터를 활용하면 기초적인 연수 지원 통계 및 경향을 분석하여 향후 사업 계획 수립에 필요한 기초 자료로 사용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 구분번호(숫자형), NTIS 순번(문자형), 성과발생년도(숫자형), 세부사업명(문자형), 내역사업명(문자형), 성과제출대상 사업부처(문자형), 성과제출대상사업명(문자형), 과제년도(숫자형), 부처명(문자형) 등입니다. 이 데이터는 연구개발 및 인력 양성 첫 단계의 중요한 정보를 제공하여 공공 및 민간 분야에서의 기술 인력 양성에 기여할 수 있을 것입니다.
