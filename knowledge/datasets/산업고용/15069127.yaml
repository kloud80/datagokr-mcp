summary_user: 구례군 내 업체를 한 행에 하나씩 업체명·주소·전화번호·개업신고일·데이터기준일자로 담은 건별 목록이며, 필드 구성으로 보아 포털 설명의 '진행 중인 행정 사업'이 아니라 행정사 사무소 현황으로 보입니다(CSV 429바이트의 작은 파일). 구례에서 영업 중인 행정사 사무소가 어디에 있고 언제 개업했는지 확인하려는 주민이나, 지역 업종 분포를 보는 분석가가 쓴다. 전역 조인 키는 없으므로 지방행정 인허가(LOCALDATA) 행정사 업종 원장이나 다른 구례군 업체 목록과는 업체명·주소를 맞춰 이어 쓴다.
description_portal: '"행정사업현황" 공공데이터는 구례 지역 내에서 진행 중인 행정 사업에 관한 정보를 제공합니다. 이를 통해 지역 주민들은 현재 진행 중인 행정 사업에 대한 정보를 얻을 수 있으며, 지역의 발전 방향과 행정 정책에 대한 이해를 높일 수 있습니다. 또한, 이 데이터는 행정 사업의 효율성을 평가하고 정책의 효과를 분석하는 데에도 사용됩니다.'
