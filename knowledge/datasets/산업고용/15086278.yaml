summary_user: 대구광역시가 직접 구축·운영하는 전기차 충전기의 현황을 충전기 한 대 단위로 담은 파일(CSV 약 35KB)로, 충전소명·주소·충전기 아이디·충전기 형태(급속/완속)·충전기 용량을 포함한다. 대구 시민이나 분석가가 "우리 동네 시 운영 공공 충전소 위치와 급속 충전기 보유 여부는 어떤가"를 확인하거나 구·군별 공공 충전 인프라 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 충전소·행정구역 데이터와는 주소를 기준으로 이름 매칭하거나 지오코딩해 연결해야 한다.
description_portal: 대구광역시에서 직접 구축하여 운영하고 있는 전기자동차 충전시설의 현황이며  충전소 명칭, 충전소 내의 충전기 아이디, 충전기 타입(급속, 완속), 설치 위치의 내용을 포함합니다. 또한 다음 어느 하나에 해당하는 경우에는 충전 요금의 50%를 감면합니다.( 장애인 소유의 자동차, 국가유공자 소유의 자동차, 고엽제후유증환자 소유의 자동차, 병역명문가로 선정된 예우대상자 소유의 자동차). 참고로 대구광역시  관내에  설치 운영 중인 민간 충전시설의 현황은 환경부에서 운영하는 웹사이트인 무공해차통합누리집에서 확인할 수 있습니다.
