description_portal: 한국가스공사의 연도별 폐기물 배출량 데이터 입니다. 폐기물 배출현황 관리 및 환경경영 성과 분석, 폐기물 저감 정책 수립, 환경규제 대응을 목적으로 수집되었습니다. 데이터 구성항목은 2014년부터 2019년까지의 연도별 천연가스 판매량(기준), 일반폐기물, 지정폐기물, 건설폐기물 배출량(ton 단위)으로 이루어져 있어 폐기물 유형별 배출현황을 파악할 수 있습니다. 본 데이터를 활용하면 연도별 폐기물 배출 추이 분석, 폐기물 유형별 배출 비중 파악, 판매량 대비 폐기물 원단위 산정, 환경목표 대비 실적 평가, 폐기물 저감 효과 측정이 가능합니다. 또한 폐기물 저감 계획 수립, 재활용률 향상 방안 도출, 환경규제 대응 전략 수립, 폐기물 처리비용 분석에 활용됩니다. ESG 경영성과 보고, 환경경영시스템 운영에 기초자료로 활용되어 환경친화적 기업경영과 지속가능한 발전을 지원합니다.
