summary_user: 대구광역시와 구·군이 행정안전부 공모로 추진하는 지역주도형 청년일자리사업의 세부사업을 사업 한 건당 한 행으로 담은 271바이트짜리 작은 CSV 파일로, 시도·시군구·담당부서·사업명·사업기간·지원기간·지원대상·지원내용을 적는다. 대구에 사는 청년이나 미래신산업·창업 기업이 우리 구·군에서 인건비나 창업지원비를 주는 청년일자리사업이 무엇이고 누가 대상인지 확인할 때 쓴다. 전역 조인 키가 없어서, 다른 정부지원 일자리사업 목록이나 지역 고용동향과는 시도·시군구 이름 또는 사업명을 맞춰 붙여야 한다.
description_portal: '청년에게 적합한 일자리 제공 및 청년의 지역정착을 위해 시, 구군이 주도적으로 설계하여 추진하는 지역주도형 청년일자리사업(행정안전부 공모 사업)의 세부사업내역 ○ 사업유형별 지원내용   - 지역혁신형(1유형, 취업지원) : 미래신산업 분야 기업에서 만39세이하 청년 신규채용 시 최대 2년간 인건비 지원   - 상생기반대응형(2유형, 창업지원) : 신규 창업 청년에게 1~2년간 창업지원비 지급 및 청년직원 신규 채용 시 최대 1년간 인건비 지원   - 유형 공통 : 참여 청년에게 교육 및 참여자간 네트워킹 활동, 자기계발비 지원'
