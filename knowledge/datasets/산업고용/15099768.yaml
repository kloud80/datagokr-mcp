summary_user: 한국동서발전이 운영하는 발전소의 호기별·월별 발전용량(MW), 발전량(MWh)과 먼지(TSP)·황산화물(SOx)·질소산화물(NOx) 배출실적을 담은 CSV 파일로, 활용신청 없이 내려받는다. 연구자나 환경 분석가가 '어느 발전소 어느 호기가 발전량 대비 질소산화물을 많이 내는가'처럼 발전량당 배출량(배출계수)이나 오염저감 효과를 따질 때 쓴다. 전역 조인 키가 없어 다른 발전사 배출 데이터나 주변 대기질·기상 측정 자료와는 발전소명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 한국동서발전에서 운영 중인 각 발전소의 월별 대기오염물질 배출실적 및 발전량 정보 데이터입니다. 이 데이터는 발전소명, 호기, 날짜, 발전용량(MW), 발전량(MWh), 그리고 주요 대기오염물질인 먼지(TSP), 황산화물(SOx), 질소산화물(NOx) 배출량으로 구성되어 있습니다. 발전소별 전력 생산량과 오염물질 배출 간의 상관관계를 분석할 수 있으며, 오염저감 기술의 도입 효과나 환경규제 준수 현황 검토 등에도 활용 가능합니다. 학계 및 연구기관에서는 에너지 생산의 환경적 영향을 정량적으로 평가하거나, 배출계수 산정, 환경정책 수립을 위한 기초자료로서 이 데이터를 활용할 수 있습니다. 또한 발전소 운영 효율성과 배출량 간의 비교 분석, 지역별 오염 기여도 평가에도 유용합니다.
