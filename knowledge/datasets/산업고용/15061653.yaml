description_portal: 이 자료는 IAEA PRIS, NRC, world nuclear industry status report 자료를 기반으로 하고 있으며, 전 세계 원전의 현재 상황을 확인 할 수 있는 자료들을 찾기가 힘들어 세계원전 운전현황 데이터를 자체적으로 조사하여 한 눈에 볼 수 있게 만든 파일이며, 전 세계 원자력 발전소의 가동원전, 계속운전, 영구정지, 해체완료 원전 등 엑셀표로 만들어서 누구나 쉽게 볼 수 있는 데이터파일 입니다. 매년 전 세계원전의 운전 현황을 업데이트 하고 있으며, 해체완료가 발생한 발전소가 있을 시 에는 즉시 업데이트를 한 데이터를 등록하고 있으니 참조 바랍니다.
