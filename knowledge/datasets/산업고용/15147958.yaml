description_portal: 「전자상거래 등에서의 소비자보호에 관한 법률」에 따라 경기도 고양시에 통신판매업 등록된 업체 중 정상 영업 상태의 업체 현황에 대한 데이터로  관리 번호, 신고 일자, 대표자명, 법인구분, 사업자번호로 구성된 데이터입니다. (고양시 덕양구, 일산동구, 일산서구)소재지 주소는 공정거래위원회의 정보 공개 기준에 맞춰 부분공개하였습니다.  덕양구, 일산동구, 일산서구 순으로 정보가 기입되어 있습니다. 약 5만 건의 업체가 조회 되었으며, 상세 내용은 파일 참고해주시기 바랍니다.상세품목 등의 자료는 고양시청 홈페이지, 통신판매업 등록 현황 조회 및 자료 다운로드는 공정거래위원회 홈페이지에서도 가능합니다.
