description_portal: '인천광역시가 제공하는 종사자 규모별 사업체수 및 종사자수 공공데이터는 관내 군/구별로 사업체의 종사자 규모에 따른 사업체 수와 총 종사자 수를 상세히 집계한 통계 자료입니다. 이 데이터는 지역 산업 구조의 특성과 고용 분포를 객관적으로 파악하고, 특히 중소기업 및 소상공인 지원 정책, 지역별 일자리 창출 계획, 경제 활성화 정책 수립에 필수적인 기초 자료로 활용되는 것을 목적으로 합니다.<주요구성항목>-군구별: 데이터가 집계된 인천광역시 내 군/구별로 분류됩니다 (강화군, 옹진군, 중구, 동구, 미추홀구, 연수구, 남동구, 부평구, 계양구, 서구).-종사자 규모별: 사업체를 1~4명, 5~9명, 10~19명, 20~49명, 50~99명, 100~299명, 300~499명, 500~999명, 1,000명 이상 등 세부적인 종사자 수 규모 구간으로 분류합니다.'
