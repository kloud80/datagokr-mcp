description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 연도별 과제지원 및 기획평가비 지원 현황을 집약한 공공 데이터입니다.제공되는 정보는 각 연도별로 에너지기술개발사업에 지원된 총 과제지원비와 기획평가비의 규모(예: 금액)를 포함합니다. 과제지원비는 연구 개발 과제 수행에 직접적으로 투입되는 비용을 의미하며, 기획평가비는 사업의 기획, 과제 공고, 선정 평가, 중간/최종 평가 등 사업 관리 전반에 소요되는 비용을 의미합니다. 이 데이터는 에너지 R&D 예산이 연구 개발과 사업 관리 분야에 어떻게 배분되고 있는지를 객관적으로 보여줍니다.'
