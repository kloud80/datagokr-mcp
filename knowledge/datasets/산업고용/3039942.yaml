summary_user: 엔지니어링사업자를 주된 기술부문별로 묶어 사업자 수, 기술사 보유·미보유 사업자 수, 보유 비율을 담은 전국 단위 집계 통계로, 431바이트짜리 작은 CSV 파일입니다. 정책 담당자나 연구자가 '어느 기술부문 엔지니어링사업자가 기술사를 덜 보유하고 있나'를 비교해 인력 수급이나 부문별 지원 사업을 기획할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 다른 엔지니어링 통계와는 기술부문 이름(주된_기술부문)을 맞춰 연결해야 합니다.
description_portal: 본 데이터는 엔지니어링사업자의 주된 기술부문별 기술사 보유 현황을 나타내는 통계자료이다.-기술부문은 「엔지니어링산업진흥법 시행령」 별표1(제3조 관련)에 따른 분류를 적용하였다.- 업체 수는 해당 기술부문을 주된 기술부문으로 신고한 엔지니어링사업자 를 의미한다.- 보유 업체는 기술사를 기술인력으로 보유한 업체를 말하며, 주된 기술부문의 기술사를 보유하지 않고 다른 기술부문의 기술사를 신고 인력으로 보유한 경우에도 보유 업체로 포함하였다.이 자료는 우리나라 엔지니어링산업의 현재 위치를 객관적으로 보여주며, 정부 정책 수립 및 연구를 위한 기초 통계자료로 활용될 수 있다. 또한 산업 경쟁력 평가, 인력 수급 계획, 기술 분야별 지원 사업 기획 등 다양한 분야에서 폭넓게 활용 가능하다.
