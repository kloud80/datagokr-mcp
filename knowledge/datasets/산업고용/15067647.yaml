description_portal: 온누리상품권은 전통시장과 지역 상점가의 활성화를 위해 정부에서 발행하는 상품권입니다. 2015년부터 2019년까지의 온누리상품권 연도별 발행금액과 누적 합계를 제공하는 데이터입니다. 본 데이터는 시계열성 데이터로 온누리 상품권의 연도별 발행 추이를 통해 정책 효과성과 소비 변화를 분석하는 데 활용할 수 있습니다. 또한 온누리상품권 발행금액을 통해 온누리상품권 시장의 규모를 추정할 수 있으며, 이를 통해 전통시장과 지역 상점가 활성화를 위한 정책 및 홍보 방향에 대해 논의할 수 있습니다.
