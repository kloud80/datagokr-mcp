summary_user: 한국수력원자력이 국내에서 원화로 체결한 공사계약을 계약 건별로 담은 원천 데이터로, 계약명·계약방법·계약구분·최종계약일자·계약기간·계약상대자와 대표자·부가세 포함 예정가격과 계약금액을 기록한다. 건설·전기공사 사업자나 조달 분석가가 '한수원 공사계약은 어떤 방법으로 어느 업체와 예정가격 대비 얼마에 체결됐나'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 계약상대자명 같은 이름 매칭이나 같은 기관의 다른 계약현황(용역·물품 등)과 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 한국수력원자력㈜은 국내 공사계약 체결현황 데이터를 공개합니다. 해당 데이터는 한국수력원자력㈜이 국내에서 원화로 계약한 공사계약의 상세 내역을 공개하는 데이터로 데이터 기준일 해당연도 한 해 동안 계약한 국내 공사 관련 정보를 제공하고 있으며, 제공항목은 순번,계약명,방법,계약구분,최종계약일자,계약시작일,계약종료일,계약상대자명,계약자대표,부가세 포함 예정가격,부가세 포함 계약금액 등 주요 정보를 포함합니다. 이 데이터는 한국수력원자력 전자상거래시스템을 기반으로 작성되었으며 데이터 갱신 주기는 1년을 기준으로 합니다. 금액의 단위는 원화이며 제공항목과 같이 부가세가 포함되어있습니다.
