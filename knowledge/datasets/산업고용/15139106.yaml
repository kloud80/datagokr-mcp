description_portal: 본 데이터는 전라남도 장성군 관내에서 이루어진 '태양광 발전소 매매 및 거래(양도·양수) 현황 데이터'입니다. 기후 변화 대응과 친환경 신재생에너지 보급 확대 정책에 따라, 장성군 지역 내에서도 태양광 발전 사업권 및 시설물의 민간 거래가 활발히 진행되고 있습니다.본 데이터는 에너지 관련 기업의 사업 타당성 분석 및 발전소 매입 투자 지표로 활용될 수 있으며, 학계의 지역별 태양광 시장 연구, 지자체의 신재생에너지 보급 현황 파악 및 관련 행정 정책 수립을 위한 핵심 기초 통계로써 활용 가치가 매우 높습니다.[이용 시 유의사항]양도인 및 양수인이 개인(개인사업자)인 경우, 「개인정보 보호법」에 따라 성명의 일부 또는 전체가 비식별화(마스킹) 처리되어 제공될 수 있습니다.
