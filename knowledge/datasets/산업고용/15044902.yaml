description_portal: 에너지진단은 에너지 사용 또는 공급 시설의 이용실태 및 손실요인을 파악하고, 효율 개선방안을 제시하는 절차입니다. 연간 에너지 사용량이 2천 TOE 이상인 진단대상자는 산업통상자원부장관이 지정한 진단기관으로부터 정해진 주기에 따라 진단을 받아야 하며, 진단기간에는 사전조사, 현장진단, 분석 및 보고서 작성이 포함됩니다. 진단비용은 기술지도 및 이행실태 확인 비용도 포함되며, 진단대상자는 에너지관리기준에 따라 효율적 에너지 관리를 수행해야 합니다. 관련하여 연도별 에너지진단결과, 해당연도 에너지진단결과, 진단등급별 진단결과, 업종별 진단결과, 설비별 진단결과, 개선요인별 진단결과, 투자비 회수기간별 진단결과 등의 데이터가 있습니다.
