status: active
summary_user: 한국중부발전 풍력 발전소의 호기별 발전실적을 운전일자 단위로 담으며, 한 행에 1시~24시 시간대별 발전량과 일합계·일평균·최대·최소 발전량이 들어 있다. 에너지 분석가가 특정 날짜에 중부발전의 어느 풍력 호기가 몇 시에 얼마나 발전했는지, 하루 중 발전 변동이 어땠는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전소명·호기 이름 매핑이나 같은 기관(중부발전) 코드로만 연결한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 발전소 원장이나 전력거래소 데이터와 바로 붙일 수 없고 이름·코드 매핑이 필요하다. 범위는 전국·비공간으로 분류돼 있어 행정구역 좌표 기반 분석에는 맞지 않으며, 개발계정은 하루 1,000회 호출로 제한된다.
