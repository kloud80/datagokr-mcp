summary_user: 광업등록사무소 통계집에 실린 2012년 이후 개발 광업권 현황을 연도·광종분류(금속광·비금속광)·광종별로 집계한 전국 단위 CSV 파일(약 8KB)이다. 광업 정책 분석가나 연구자가 '특정 광종에서 채광계획인가나 생산실적인정을 받은 광업권 수가 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 광업권·광종 통계와는 연도와 광종 이름을 맞춰 연결해야 한다.
