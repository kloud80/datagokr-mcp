summary_user: 서울특별시 강북구에서 인허가를 받은 무료직업소개소를 업소 한 곳당 한 행으로 담은 건별 인허가 원천 데이터로, 영업 중인 곳과 폐업한 곳이 함께 들어 있습니다. 구직자나 구인 사업자가 강북구에서 지금 영업 중인 무료직업소개소의 이름·주소·전화번호를 찾거나, 분석가가 인허가일과 폐업일로 소개소의 개업·폐업 추이를 볼 때 씁니다. 전역 조인 키는 없어서 다른 데이터와는 도로명·지번 주소, 업소명, 또는 같은 기관 코드(OGDP_INST_CD)로 맞춰 잇고, 중부원점TM 좌표(XCRD·YCRD)로 지도 데이터와 겹쳐 봅니다.
