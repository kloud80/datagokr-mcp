summary_user: 한국수력원자력이 맺은 500만원 이상 공사·용역·물품 수의계약을 계약 한 건당 한 행으로 담은 원천 목록 파일(CSV, 약 41만 바이트)로, 계약명·분류·계약일·착수·종료일·계약상대자명·부가세 포함 계약금액(원)을 담는다. 공공조달 연구자나 감시 단체가 '한수원이 어떤 업체와 어떤 분야에서 경쟁 없이 얼마나 큰 계약을 맺었는가'를 확인하는 데 쓴다. 기관 내부 계약번호(khnp_contract_no)가 행을 구분하는 키이며, 사업자번호 같은 외부 공통 키가 없어 다른 조달·기업 데이터와는 계약상대자명으로 맞춰 봐야 한다.
description_portal: 본 데이터는 한국수력원자력의  500만원 이상 공사, 용역, 물품 수의계약 현황 데이터로, 수의계약 제도의 투명한 운영과 계약 과정의 공정성 확보를 위한 수의계약 현황 자료입니다. 제공항목은 순번,계약번호,계약명,분류,계약일,계약착수일,계약종료일,계약상대자명,계약금액으로 구성되어있으며 계약금액 제공항목의 경우 부가가치세(VAT)가 포함된 금액으로 단위는 "원"입니다. 계약 현황 분석. 공공조달 정책 연구, 적정성 검토분석, 기관경영 모니터링 등의 기초자료 연구에 활용할 수 있습니다.
