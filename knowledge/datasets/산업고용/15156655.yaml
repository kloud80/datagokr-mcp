description_portal: 아시아에서 천연가스 다소비 국가인 한국, 일본, 대만, 중국 등 4개국의 천연가스 자급률을 나타낸다. 자국에서 생산되는 천연가스 양을 천연가스 수요로 나누어 계산한다. 한국, 일본, 대만, 중국 등은 전 세계 천연가스를 LNG 형태로 가장 많이 수입하는 국가이다. 최근 중국의 천연가스 자국 생산이 증가하고 있기는 하나 여전히 4개국의 천연가스 수입비중은 놓게 나타난다. 자료기간은 2010년 1월부터 2024년 12월까지이다. 원자료의 출처는 JOD(Joint Organization Data Intiative)이며, 공개자료로 누구나 접근가능하다. 아시아 주요국 천연가스 자급률 자료를 통해  국가별 상호교차비교 가능하며, 관련 연구에 광범위하게 사용가능하다.
