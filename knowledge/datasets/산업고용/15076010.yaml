summary_user: 서울 서초구에 있는 유료직업소개소의 인허가 정보를 사업장 한 곳당 한 건으로 담는 원천 목록이며, 상호명·전화번호·지번/도로명 주소·인허가일자·영업상태·폐업일자·좌표(X, Y) 같은 항목을 포함한다. 구직자나 구인기업이 서초구에서 지금 영업 중인 등록 직업소개소가 어디인지 확인하거나, 분석가가 인허가·폐업 시점으로 소개소 개업과 폐업 추이를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 자치구의 같은 형식 인허가 데이터와는 관리번호·자치단체코드로 맞추고 다른 데이터와는 주소나 좌표를 매칭해 연결한다.
description_portal: 서울특별시 서초구 소재의 유료직업소개소 현황 데이터를 제공하는 자료로, 상호명, 사업소 전화번호, 사업소 도로명 주소, 인허가 일자 등의 주요 항목을 포함하고 있습니다. 본 데이터는 「직업안정법」제19조에 따라 적법하게 등록·관리되고 있는 직업소개소의 정보를 담고 있으며, 구민이 안심하고 이용할 수 있는 고용 서비스 환경을 조성하는 것을 목적으로 합니다. 용산구는 이러한 정보를 투명하게 공개함으로써 구직자와 구인기업 모두가 신뢰할 수 있는 채용 경로를 확보하도록 지원합니다. 구직자는 이 자료를 통해 지역 내 합법적인 직업소개소를 손쉽게 찾아 안전하게 취업 활동을 전개할 수 있으며, 구인기업은 해당 정보를 바탕으로 검증된 인력 중개 기관을 활용해 효율적으로 인재를 확보할 수 있습니다. 더 나아가, 해당 데이터는 고용 관련 정책 수립과 학술·연구 활동의 기초 자료로도 활용 가능하여, 데이터는 주기적으로 갱신되어 최신 정보를 반영합니다.* 본 데이터는 3일전 자료를 제공합니다.
