description_portal: '본 자료는 서울특별시 금천구에서 운영 중인 직업소개소의 기본 정보를 정리한 것입니다. 각 직업소개소의 상호명과 소재지 주소, 전화번호를 비롯하여, 운영 주체가 개인인지 법인인지에 대한 구분, 그리고 이용 시 비용이 발생하는 유료 서비스인지 여부(유료/무료)에 대한 정보가 포함되어 있습니다.이 자료는 일자리를 구하고자 하는 구직자분들께 신뢰할 수 있는 직업소개소 정보를 제공함으로써, 보다 안전하고 효율적으로 취업 활동을 하실 수 있도록 돕고자 마련되었습니다. 구직 중이신 분들께서는 본 자료를 참고하시어 가까운 소개소를 직접 방문하거나 전화로 상담을 받아보실 수 있으며, 이용료 여부도 미리 확인하실 수 있어 불필요한 혼선을 줄이는 데에 도움이 됩니다.또한 구인업체 입장에서도 필요한 인력을 연결받기 위한 소개소 정보를 확인하실 수 있어, 인력 채용 시 참고자료로 활용이 가능합니다. 운영 주체 유형에 따라 서비스 방식이나 취급 직종 등이 다를 수 있으므로, 사전에 비교·검토하시는 데에도 유용합니다.앞으로도 우리 구는 구직자와 구인업체 모두에게 실질적인 도움이 되는 고용 관련 정보를 지속적으로 제공함으로써, 보다 활기차고 안정적인 지역 일자리 환경 조성을 위해 노력하겠습니다.(담당부서 : 금천구 일자리청년과)'
