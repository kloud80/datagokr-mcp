summary_user: 국민내일배움카드 훈련과정을 과정 한 건(회차)씩 담은 전국 범위 원천 목록이다. 과정명, 훈련기관과 주소·전화, 훈련 시작·종료일, 훈련비, 정원·등록 인원, 취업률·만족도 관련 항목이 들어 있다. 구직자가 '우리 지역에서 곧 시작하는 NCS 분야 훈련 중 취업률이 높은 과정은 무엇인가'를 찾거나, 분석가가 분야별 훈련 공급을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 NCS 코드(ncsCd)를 NCS 코드 마스터와 맞추거나, 과정 ID·훈련기관 ID 같은 같은 기관 코드로 고용노동 분야의 다른 훈련 데이터와 이어 쓴다.
description_portal: 국민내일배움카드(일반)급격한 기술발전에 적응하고 노동시장 변화에 대응하는 사회안전망 차원에서 생애에 걸친 역량개발 향상 등을 위해 국민 스스스로 직업능력개발훈련을 실시할 수 있도록 훈련비 등을 지원합니다.K-디지털 트레이닝청년들이 선호하는 민간의 혁신 훈련기관, 디지털 분야 선도 기업, 우수대학 등이 훈련기관으로 참여하여 AI, 빅데이터 등 기반 기술과, 이를 활용한 핀테크, 클라우드, 스마트제조 등 응용기술을 배우고 실전에서 활용할 수 있도록 다양한 훈련 과정을 제공하는 직업훈련사업K-디지털 기초역량훈련청년, 중장년 등이 디지털 역량 부족으로 노동시장 진입 및 적응에 어려움을 격지 않도록 디지털 분야 기초역량 개발을 지원하는 정부지원 훈련입니다. * 「디지털 기초역량훈련과정」은 언제·어디서나 수강할 수 있는 100% 인터넷 원격훈련입니다.
