summary_user: 대전광역시 서구 관내에서 행정사 업무를 신고한 사무소를 한 줄에 한 곳씩 담은 건별 목록으로, 사무소명·주소·우편번호·전화번호·신고연월일을 포함한다(CSV 약 9KB). 주민이 서구에서 서류 작성이나 인허가 대행을 맡길 행정사 사무소를 찾거나, 분석가가 서구 내 행정사 사무소의 동별 분포와 신고 시기를 파악하는 데 쓴다. 전역 조인 키는 없어서, 다른 업종 인허가(LOCALDATA) 자료나 상가업소 자료와는 주소·사무소명을 맞춰 연결해야 한다.
description_portal: 본 자료는 대전광역시 서구 관내에서 행정사 업무를 신고한 사무소의 현황을 수록한 공공데이터입니다.행정사는 「행정사법」에 따라 행정기관에 제출하는 서류의 작성, 번역, 인허가 절차 대행, 행정 상담 등의 업무를 수행하는 전문 자격사로, 관련 사무소를 설치하고자 할 경우 관할 지자체에 업무 신고를 해야 합니다.이 데이터에는 사무소명, 소재지 주소, 우편번호, 연락처(전화번호), 신고 연월일 등의 기본 정보가 포함되어 있으며,서구 지역 내에서 활동 중인 행정사 사무소의 분포 및 운영 현황을 파악할 수 있는 기초 자료입니다.해당 정보는 주민 민원 지원 체계의 이해, 행정 서비스 접근성 평가, 유사업종 분포 현황 조사 등에 활용될 수 있으며,업무 범위상 주민과의 접점이 많은 행정사 제도 운영의 실태 파악 및 정책 수립에도 참고 자료로 제공됩니다.
