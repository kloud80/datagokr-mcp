summary_user: 서울특별시 광진구에서 고압가스를 제조·저장·충전 판매하는 업소의 인허가 정보를 업소 한 곳당 한 건으로 담으며, 사업장명·인허가일자·영업상태·폐업일·휴업기간·소재지 주소·중부원점TM 좌표 등을 포함한다. 광진구 주민이나 안전 담당자가 '우리 동네에 영업 중인 고압가스 업소가 어디에 있고 언제 허가받았나'를 확인하거나, 분석가가 지역 내 고압가스 유통 업소의 영업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리 코드(개방자치단체코드·관리번호)로만 잇고, 같은 LOCALDATA 계열의 석유판매·LPG·도시가스 등 다른 에너지 업종 인허가 원장과 나란히 놓고 볼 수 있다.
description_portal: 이 데이터는 서울특별시 광진구 내 고압가스를 제조, 저장 또는 용기에 충전하여 판매하는 업소에 대한 인허가 정보를 제공합니다.고압가스는 일반적으로 산업용, 의료용, 가정용으로 사용되며, 산소, 아세틸렌, 질소, 헬륨, 이산화탄소 등 압축 또는 액화된 상태의 가스를 포함합니다.데이터에는 사업장명, 업종 구분, 소재지, 인허가 일자, 영업 상태 등이 포함되어 있어 지역 내 고압가스 유통 현황을 파악하는 데 유용합니다.해당 업소는 고압가스 안전관리법에 따라 지정된 안전 기준을 충족해야 하며, 본 데이터는 시설관리, 위험물 안전정책 수립, 관련 업종 점검 업무 등에 활용될 수 있습니다.※ 위치 정보는 중부원점TM(EPSG:2097) 좌표계로 제공되며, 위도 및 경도는 포함되지 않습니다.※ 본 데이터는 3일 전 기준 최신 현황을 반영합니다.
