summary_user: 충청남도 공주시 관내 고압가스 저장설비를 갖춘 사업소를 한 곳씩 법인명(상호)·사업소 소재지·전화번호로 담은 개별 목록이며, 파일 크기가 740바이트로 몇 건 안 되는 소규모 자료다. 주민이나 안전 담당자가 '우리 동네 근처에 고압가스를 저장하는 사업소가 어디 있고 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소 문자열을 맞춰 보거나, 같은 공주시의 다른 에너지 업종 인허가 목록과 나란히 놓고 쓴다.
limits: 사업자번호나 인허가번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 공주시 한 곳만 다루므로 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다.
