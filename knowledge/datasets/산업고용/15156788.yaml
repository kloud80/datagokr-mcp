description_portal: 본 데이터는 핵연료물질 취급자·감독자 면허 보수교육 이수자 현황을 정리한 자료로, 원전 안전운영에 필수적인 면허 보유 인력의 법정 보수교육 이수 여부를 체계적으로 관리·점검할 수 있도록 제공됩니다. 제공항목은 순번, 종류(취급자/감독자), 취득연도(면허취득연도), 소속, 처실, 부파트, 직위이며, 성명·사번 등 개인식별정보는 포함하지 않습니다. 본 자료는 면허종류, 조직 및 직위별 이수 현황 분석, 교육 대상자 관리, 일정 수립 및 이력관리, 내부점검 및 대외 보고자료 작성, 인력 운영 및 승계 계획 수립 등에 활용할 수 있으며, 부서별 교육수요 산출과 차년도 교육과정 편성 및 콘텐츠 개선에도 참고할 수 있습니다.
