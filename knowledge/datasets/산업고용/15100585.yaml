description_portal: 본 데이터는 경상남도 의령군 관내에서 벙커C유를 사용하는 업체들의 현황 정보를 제공합니다. 벙커C유는 산업용 연료로 사용되며, 대기오염물질 배출과 관련된관리 대상 물질 중 하나입니다. 본 데이터는 업체명, 주소, 생산품, 연료사용량, 데이터기준일 등으로 구성되어 있으며, 지역 내 에너지 사용 실태를 파악하고 환경관리 정책 수립에 활용할 수 있습니다. 또한 고위험 연료 사용에 대한 감시 체계 구축과 배출 절감 대책 마련에 필요한 자료로 활용할 수 있습니다. 데이터는 주기적으로 갱신되어 최신성을 유지하며, 공공기관과 일반인 모두에게 개방되어 있습니다.
