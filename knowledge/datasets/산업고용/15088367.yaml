description_portal: 한국가스공사 창립연도인 1987년부터 2020년까지의 발전용 천연가스 국가 수요실적 및 비중에 관한 시계열 통계자료입니다.발전용 수요는 천연가스 발전소의 연료 소비량을 나타내며, 전력 수급과 연계된 에너지 정책의 핵심 지표로 활용됩니다. 본 데이터는 발전용 가스 시장 분석 및 전력-가스 연계 수급 전망을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연도별 공사 공급량, 직수입사 공급량, 총 국가 수요량, 공사 시장점유 비중 등이 포함되며, 단위는 만 톤입니다. 본 데이터를 활용하면 발전용 가스 수요 장기 추세 분석 및 성장률 파악, 에너지 전환 정책에 따른 수요 변화 연구, 발전용 가스 수급 계획 수립, 전력시장 연계 분석에 기초자료로 활용할 수 있어 에너지 전환 시대의 가스발전 역할 정립과 수급 안정에 기여할 것으로 기대됩니다.
