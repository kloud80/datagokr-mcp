summary_user: 부산시설공단이 운영하는 부산 지하도상가의 점포별 임대 현황을 한 행씩 담은 파일(csv, 약 138KB)로, 상가명·점포호수·상호·업태·업종·임대/전용/공용면적과 최초계약일·계약시작일·계약종료일을 포함한다. 지하도상가에 입점을 검토하는 소상공인이나 상권 분석가가 '어느 지하도상가에 어떤 업종 점포가 얼마 면적으로, 언제까지 계약돼 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상가명·상호 같은 이름 매칭으로만 연결되며, 소상공인 상가업소 원장 같은 상권 기준 데이터와 이름 대조해 보완하는 방식으로 쓴다.
description_portal: 부산 지하도상가 점포 현황은 공공자산으로 운영되는 상가 공간의 임대 정보를 정리한 자료로, 상가명, 점포 호수, 상호, 업태, 업종, 임대면적, 전용면적, 공용면적, 최초계약일, 계약시작일, 계약종료일 등의 항목을 포함합니다. 해당 데이터는 상권 분석, 임대 관리, 정책 수립 등에 활용되며, 점포 운영 현황을 시민에게 투명하게 제공하는 데 목적이 있습니다. 특히 최근에는 공정한 임대 절차와 청년 창업 지원, 지역상권 회복과 같은 사회적 이슈와 맞물리며, 공공상가 운영 정보의 중요성이 더욱 부각되고 있습니다. 이 자료는 공공기관의 자산 운영 실태를 확인하고, 효율적인 공간 활용과 정책 개선의 근거로 사용될 수 있습니다.
