summary_user: 중증장애인 근로자를 채용하거나 배치·직무를 바꾼 사업주가 받은 근로지원비용(구 고용관리비용) 지원 건을 접수 건별로 담은 전국 단위 파일로, 사업장명·사업자등록번호·접수일자·신청금액·결정일자·결정금액·관할 지사·산업분류를 포함한다. 사업주가 근로지원비용 신청을 준비하면서 어떤 업종의 사업장이 얼마를 신청해 얼마를 결정받았는지 확인하거나, 분석가가 지사별·산업별 지원 규모를 비교하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 정보나 장애인 고용 관련 다른 사업주 데이터와 이어 쓴다.
description_portal: 근로지원비용(구 고용관리비용) 지원 사업은 사업주가 중증장애인 근로자를 새로 채용하거나 배치장소 또는 직무 등을 변경한 지 90일 이내에 근로지원비용 수급자격을 인정받고 해당 사업장에 배치된 작업지도원을 통하여 작업지도를 실시한 경우, 사업주에게 고용관리에 드는 비용의 일부를 지급하는 사업주지원 제도입니다. 이 데이터는 근로지원비용을 지급받았거나 신청하고자 하시는 사업주에게 관련 정보를 제공하고자 공개하고 있습니다. 데이터 내용은 사업장 정보, 지원 결정 일자 및 금액, 공단 관할 지사 등의 정보를 포함하고 있습니다.
