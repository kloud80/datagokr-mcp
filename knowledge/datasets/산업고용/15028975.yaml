summary_user: "경산시가 내준 토석채취 허가를 건별로 담은 파일로, 업체명·소재지·허가 면적(m2)·용도·허가 시작일과 종료일을 담는다(파일 크기 307바이트로 건수는 소수다). 지역 주민이나 개발 사업자가 '우리 동네 근처에서 지금 허가기간 안에 토석을 캐는 업체가 어디이고 면적은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 소재지 주소나 업체명을 맞춰 보는 방식으로만 잇는다(예: 같은 지역의 필지·국토 공간 규제 정보)."
