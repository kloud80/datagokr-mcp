description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 에너지 사용량이 2,000toe 이상인 에너지다소비사업자들이 에너지 절감 활동을 위해 투자한 비용 현황(백만원 단위)을 제공합니다. 지역(지자체)별, 연도별, 산업 및 상업 부문 등 부문별로 구분된 데이터를 통해 다소비사업자들의 에너지 효율 향상과 에너지 절약을 위한 투자 규모와 활동 추이를 정확히 파악할 수 있습니다. 본 데이터는 정부 및 지자체가 지역별 에너지 효율 개선 실태를 평가하고, 에너지 절감 정책 및 지원사업을 효율적으로 수립하기 위한 기초자료로 활용할 수 있습니다. 또한 기업과 연구기관에서는 투자 현황 분석을 통해 에너지 절감 성과를 비교·평가하고, 향후 효율적 투자전략 마련 및 지속가능한 에너지 경영방안 연구에 활용할 수 있습니다.
