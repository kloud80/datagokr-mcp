description_portal: '경기도 평택시 관내에 있는 착한가격업소에 대한 데이터로 착한가격업소명, 업종, 소재지도로명주소, 메뉴(가격), 데이터기준일자 등의 정보를 제공합니다.착한가격업소는 물가상승으로 어려운 상황에서도 원가절감 등 경영효율화 노력을 통해 저렴한 가격으로 양질의 서비스를 제공하고 있는 업소 가운데 행정안전부 기준에 따라 지방자치단체장이 지정한 업소입니다. 선정기준은 지역의 평균적인 가격보다 저렴한 가격으로 판매하는 개인서비스(외식업, 이·미용업, 세탁업, 목욕업 등) 업소로서 종사자 친절도, 영업장 청결도, 이용고객 만족도입니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※문의 : 평택시 일자리경제과(031-8024-3514)'
