summary_user: 경기도 내 승강기 유지관리업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·폐업일자, 영업상태, 소재지 주소와 좌표, 자본금, 보수범위, 기술인력·관리책임인력·직무별 종업원 수가 들어 있다. 건물 관리자나 분석가가 "우리 시군에서 영업 중인 승강기 유지관리업체는 어디이고 기술인력은 몇 명인가" 같은 질문에 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 사업장명·주소 매칭이나 경기도 공통 시군 코드(SIGUN_CD)로 잇고, 위경도 필드로 지도 위에 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 승강기 유지관리업체의 인허가 및 운영현황을 수록하고 있으며, 사업장명, 인허가일자, 영업상태, 소재지, 기술인력수, 보수범위, 자본금, 관리책임인력수 등 다양한 정보를 포함합니다. 주요 항목으로는 ‘사업장명’, ‘영업상태명’, ‘소재지도로명주소’, ‘기술인력수’, ‘관리책임인력수’, ‘자본금’, ‘보수범위정보’ 등이 있으며, 이를 통해 승강기 안전관리에 대한 업체 역량을 평가하거나 지역별 유지관리 업체 분포를 파악할 수 있습니다. 해당 데이터는 건축물 안전관리, 정비업체 분석, 산업인력 통계 작성 및 정책 수립 등의 용도로 활용될 수 있습니다.
