summary_user: 서울시 상권분석서비스의 골목상권(생활권 단위 상권 영역) 배후지를 상권 한 곳당 한 행으로 담은 원천 목록으로, 상권 코드·이름, 위치 좌표, 자치구·행정동, 면적(RELM_AR)을 제공한다. 창업 예정자나 상권 분석가가 '특정 행정동 안에 어떤 골목상권이 있고 각각 면적이 얼마인가'를 확인하거나 상권 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 같은 서울시 상권분석서비스의 다른 데이터와는 골목상권 코드로, 다른 기관 데이터와는 자치구·행정동 코드나 이름 매핑으로 이어 쓴다.
limits: 외부 사이트(서울 열린데이터광장) 인증키가 따로 필요하며 포털 활용신청과는 별개다. 범위는 서울시 단위이며, 다른 기관 데이터와 바로 붙일 공통 키가 없어 이름·코드 매핑이 필요하다.
