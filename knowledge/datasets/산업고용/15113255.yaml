summary_user: 대전광역시 안의 백화점·대형마트·쇼핑센터 같은 대규모점포를 점포 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 자치구·업태·상호·소재지·실제 영업 개시일·면적을 기록한다. 지역 상권 분석가나 유통 사업자가 '대전 어느 자치구에 대형마트·백화점이 몰려 있고 매장 면적은 얼마나 되는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 자치구명(기초지자체명)이나 소재지 주소를 매핑해 소상공인 상가업소·전국 대규모점포 표준데이터 같은 상권 자료와 잇는다.
