summary_user: 전국 기초지자체(광역·기초 이름)별로 태양광·풍력·수력·바이오·폐기물 등 신재생에너지원별 생산량(toe), 발전량(MWh), 신규·누적 보급용량(kW)을 담은 집계 파일로, 발전소 단위 원천 기록이 아니다. 지역 에너지 정책 담당자나 분석가가 '우리 시·군·구의 태양광 누적 보급용량과 발전량은 다른 지자체와 비교해 어느 수준인가' 같은 질문에 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 지역 통계와는 광역·기초 지자체 이름을 매핑해 붙여야 하며, 발전소 단위 정보가 필요하면 전국태양광발전소전기사업허가정보 표준데이터(주소·용량)와 함께 본다.
description_portal: 본 데이터는 전국 기초지자체별 신재생에너지 보급 실태를 종합적으로 보여주는 자료로서, 각 지역에서 생산되는 신재생에너지원별 생산량(toe), 발전량(MWh) 및 신규보급용량·누적보급용량(kW)에 대한 정보를 제공합니다.신재생에너지는 태양광, 풍력, 수력(양수발전 제외), 바이오에너지, 폐기물에너지(SRF 등) 등을 포함하며, 에너지지원 및 발전 설비 현황도 포함되어 있어, 지역별 신재생에너지 확산 추이를 체계적으로 분석할 수 있습니다.본 데이터는 지역 에너지 자립률 향상, 기후변화 대응 및 온실가스 감축을 위한 지역 에너지 정책 수립에 필수적이며, 정부 및 연구기관은 물론 민간 기업이 지역 맞춤형 신재생에너지 사업 개발과 에너지전환 전략 수립을 위한 기초자료로 폭넓게 활용할 수 있습니다.
