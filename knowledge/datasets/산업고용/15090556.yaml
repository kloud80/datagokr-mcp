summary_user: 신재생에너지공급인증서(REC) 현물시장의 거래일별 거래 결과를 육지와 제주로 나눠 거래량(REC)과 평균·최고·최저가, 장 종가(원/REC)로 담은 집계 파일이다. 신재생 발전사업자나 분석가가 'REC 현물 가격이 최근 어떻게 움직였고 육지와 제주 사이 가격 차이는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 SMP 등 다른 전력시장 일별 자료와는 거래일(날짜)을 기준으로 맞춰 붙여 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 신재생에너지공급인증서(REC) 현물시장의 장운영 거래일별 거래가 정보를 제공합니다.REC 현물시장의  ~ 2026년 3월 데이터가 제공됩니다.- 항목 : 육지 거래량, 육지 평균가, 육지 최고가, 육지 최저가, 제주 거래량, 제주 평균가, 최고가, 최저가, 장 종가- 단위 : 거래량(REC), 거래가(원/REC)'
