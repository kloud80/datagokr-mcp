description_portal: 한국가스공사가 제공하는 역대 일일 천연가스 최대생산량 순위(1위~25위) 자료입니다. 이를 통해 전국의 일별 LNG터미널에서 생산한 천연가스 양 중 가장 많은 날 상위 25건을 나타낸 자료로, 월별, 계절별 천연가스 생산 특성을 파악할 수 있는 자료입니다.한국가스공사의 역대 일일 최대생산량 순위(Top25)로 해당 날짜별 생산량(톤, ton)의 정보이며 생산량을 기준으로 내림차순으로 정렬되어 있습니다. 공공데이터의 공개 대상 자료는 2018년 01월부터 현재까지의 기간동안 한국가스공사 역대 일일 천연가스(LNG) 최대 생산량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 연간 단위이며, 매년 1월달에 전년도 자료의 업데이트를 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일입니다.
