summary_user: 한국동서발전 발전소의 탈황 설비에서 나오는 부산물(석고 등)의 연도별 발생량·재활용량(만 톤)과 재활용률, 재활용 방법을 구분별로 담은 집계 자료로, 범위는 전국이며 공간 단위가 없는 형태다. 연구자나 환경 분석가가 "동서발전 발전소별 탈황 부산물 재활용률이 해마다 어떻게 달라졌나"를 확인하는 데 쓴다. 전역 조인 키는 없어 연도(year)와 발전소 구분 이름을 맞춰 같은 기관의 대기오염물질·석탄재 등 배출 측정 자료와 이어 쓴다.
limits: 실측 컬럼에 공통 조인 키가 없어 다른 기관 데이터와는 이름 매핑으로만 연결된다. 공간 좌표나 행정구역 단위가 없어 지도 분석에는 바로 쓰기 어렵다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
