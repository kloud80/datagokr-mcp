description_portal: 본 데이터는 2021년 9월 기준으로 국내 방사능 감시소(환경방사선 준위 연속감시)와 지방방사능측정소(환경방사선·능 분석ㆍ감시) 현황을 나타낸 데이터입니다.  본 자료를 통해 국내 방사선 환경 감시체계의 안정성과 대응 능력을 이해할 수 있습니다. 또한 방사능 비상 대응 정책 수립, 환경 안전관리 강화, 지역별 방사선 영향 평가 등 다양한 연구 및 행정적 목적에 필수적인 기초자료로 기능합니다.다음의 연관데이터와 함께 활용 가능합니다.  2020년 세계 원자력 및 방사선 방재현황- 국내원전 종사자 및 인근주민 피폭방사선량- 국가 환경방사능 감시기 현황- 국내원전 주변지역과 일반지역의 방사선준위 현황- 전국 주요지역 환경방사선 선량률 현황- 지방방사능측정소 환경감시 프로그램
