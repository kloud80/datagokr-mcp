summary_user: 전국 지자체가 관리하는 석탄(무연탄)·연탄 제조업소의 인허가 정보를 업소 건별로 담으며, 검증 수신 기준 전국 69건(인허가일 2007-05-08~2026-08-11)이다. 분석가나 지자체 담당자가 특정 지역에 영업 중인 연탄 제조업소가 어디인지, 언제 인허가를 받았고 폐업했는지 확인하는 데 쓴다. 지번주소·도로명주소(address)와 관리번호(pnu 키)로 다른 주소 기반 데이터와 잇고, 개방자치단체코드와 기준일자는 다른 데이터에서 먼저 받아 넘겨야 한다.
