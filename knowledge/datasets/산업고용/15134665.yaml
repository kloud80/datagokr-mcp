summary_user: 골재자원조사 대상 시군구에서 확인된 육상·하천·산림 골재 부존지역별로 위치명, 관련 유역, 주소, 부존면적(제곱미터)과 부존량·개발가능량·채취가능량(세제곱미터)을 담은 조사결과 파일로, 범위는 전국이고 지역은 개별 주소 단위로 적혀 있다. 골재 수급 계획을 세우는 지자체 담당자나 골재 채취 사업자가 "우리 시군구 안에서 실제로 채취할 수 있는 골재가 어디에 얼마나 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소나 위치명을 행정구역 이름에 맞춰 붙이는 방식으로만 이어 쓰며, 골재부존지역·조사지역 일련번호는 이 파일 안에서만 쓰는 번호다.
description_portal: 골재자원조사의 결과로 골재부존지역, 조사지역, 골재위치명, 관련유역, 해당주소, 부존면적, 부존량, 개발가능량, 채취가능량을 수치로 표시골재부존조사결과는 조사 대상지로 선정된 시군구 행정구역 내에 존재하는 육상, 하천 및 산림 골재를 대상으로 하며 단계별로 골재자원의 분포현황을 파악하는데 목적이 있음, 먼저, 개발제한지 분석, 부존현황, 입지현황 및 주변 인프라 등 다양한 사전조사를 실시하여 정밀 조사지를 선정함, 이후 지질조사, 시추조사, 지화학분석 및 부존량등을 조사하여 활용할 수 있는 골재자원의 종합적인 골재자원 분포현황을 제시함
