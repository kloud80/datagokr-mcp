summary_user: 경기도 내 국제회의기획업 인허가 사업장을 한 행에 한 곳씩 담은 건별 원장으로, 사업장명·인허가일자·영업상태·폐업일자·주소·좌표·자본금·회의실 동시수용인원 등을 포함하며 범위는 경기도(시도 단위)다. 지자체·연구자·MICE 관련 사업자가 '경기도 어느 시군에 영업 중인 국제회의기획업체가 몇 곳이고 언제 인허가됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 경기도의 다른 업종 인허가(LOCALDATA) 데이터나 지역 통계와 이름·코드 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 내 국제회의 기획업 인허가 현황을 제공하는 자료로, 국제회의의 기획·준비·진행을 대행하는 업체 정보를 담고 있습니다. 국제회의 기획업은 대규모 관광 수요를 창출하고 지역 경제 활성화에 기여하는 산업으로, 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지전화번호(LOCPLC_FACLT_TELNO), 소재지면적정보(LOCPLC_AR_INFO), 도로명주소(REFINE_ROADNM_ADDR), 지번주소(REFINE_LOTNO_ADDR), 좌표값(X_CRDNT_VL, Y_CRDNT_VL), 자본금(CAPTL_AMT), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM), 건물용도명(BULDNG_PURPOS_NM), 객실수(ROOM_CNT), 건축연면적(BUILD_TOT_AR), 좌석수(SEAT_CNT), 회의실 동시수용인원수(MTNGRM_SMTM_ACEPTNC_PSN_CNT), 시설규모(FACLT_SCALE) 등이 포함됩니다.이 데이터는 국제회의 기획업체의 분포와 운영 현황을 파악하는 데 유용하며, 지역별 국제회의 인프라 분석, MICE(Meeeting, Incentive, Convention, Exhibition) 산업 정책 수립, 관광산업 활성화 전략 마련 등에 활용될 수 있습니다. 또한 연구기관·지자체·기업은 해당 데이터를 바탕으로 회의 기획업의 시설 규모, 인허가 상태, 운영 특성을 종합적으로 분석할 수 있습니다.
