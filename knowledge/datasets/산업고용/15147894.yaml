summary_user: 한국남부발전 태양광발전소 21곳의 발전소명·호기·위도·경도를 발전소 단위로 담은 전국 범위의 좌표 목록 파일이다. 재생에너지 입지 분포를 지도에 찍어 보려는 분석가나 연구자가 남부발전 태양광이 어디에 있는지 확인하는 질문에 쓴다. 위도·경도(coord) 키로 다른 좌표 기반 데이터와 겹쳐 볼 수 있고, 주소·용량이 담긴 전국태양광발전소전기사업허가정보표준데이터와 함께 보는 용도가 검토되었으나 공통 식별 키는 확인되지 않았다.
description_portal: 이 데이터는 국내에 설치된 한국남부발전 태양광발전소의 위치 정보를 정리한 자료입니다. 발전소명, 호기, 위도, 경도 값이 포함되어 있으며, 이를 통해 각 발전소의 정확한 지리적 위치를 확인할 수 있습니다. 예를 들어 감우리 태양광, 무릉리 태양광, 백사면 태양광, 부산 신항 태양광 등 다양한 지역의 발전소 좌표가 수록되어 있어 지도를 통해 시각화하거나 지역별 분포를 비교할 수 있습니다. 이 자료는 태양광발전의 보급 현황을 이해하고, 재생에너지 입지 분석, 지역별 전력망 연계 연구, 에너지 정책 수립, 학술 연구 등 다양한 분야에서 활용할 수 있는 기초 자료입니다. 특히 남녀노소 누구나 지도를 통해 쉽게 접근할 수 있는 데이터로서 공공성과 활용도가 높습니다.
