summary_user: 은평구에 등록된 유료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 상호명·인허가일·영업 상태(영업중·폐업 등)·폐업일·소재지 지번/도로명 주소·전화번호·중부원점TM 좌표를 포함한다. 구직자나 구인 업체가 이용하려는 직업소개소가 은평구에 정식 등록되어 지금도 영업 중인지 확인하는 데 쓰고, 분석가는 구 안의 소개소 분포와 개·폐업 추이를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고, 다른 자치구의 같은 인허가 데이터와 이어 붙여 서울 전체 현황을 만든다.
description_portal: '은평구의 유료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 구직자와 구인 업체로부터 수수료를 받고 고용을 알선하는 유료직업소개소의 인허가 현황을 담고 있습니다. 데이터에는 각 소개소의 상호명, 소재지 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등), 대표자 정보 등 민간 고용 시장 관리를 위한 핵심 행정 정보가 포함되어 있습니다 .이 데이터를 통해 구직자나 구인 기업은 정식으로 등록된 합법적인 직업소개소를 확인하고 이용할 수 있어, 부당한 수수료 요구 등 피해를 예방할 수 있습니다 . 또한, 정부와 지자체는 소개소의 지역별 분포와 운영 실태를 파악하여 민간 고용 서비스 시장을 체계적으로 관리·감독하고, 등록 기준 준수 여부를 점검하여 건전한 고용 질서를 확립하는 데 필수적인 기초 자료로 활용합니다 .'
