summary_user: 국내 방사성폐기물 처분시설과 저장·처리시설을 시설 한 곳당 한 행으로 정리한 2023년 기준 현황표로, 시설구분·시설명·운영기관·위치·주요시설·허가용량·건설 및 운영 허가월·운영 개시월을 담은 932바이트의 작은 CSV 파일이다. 국내 방사성폐기물을 어느 기관이 어디에서 얼마의 허가용량으로 처분·저장하고 있는지, 각 시설이 언제 허가받아 운영을 시작했는지 확인하려는 국민·연구자·정책 분석가가 쓴다. 공통 조인 키나 코드가 없어, 사용후핵연료 저장 현황이나 중·저준위 폐기물 저장 현황 같은 연관 파일과는 시설명·운영기관 이름을 직접 맞춰 이어 쓴다.
description_portal: '2023년 기준의 국내 방사성 폐기물 관리 및 처리현황 데이터입니다. 본 데이터의 제공 항목은 다음과 같습니다 : 시설구분(처분시설 및 저장처리시설), 시설명, 운영기관, 위치, 주요시설, 허가용량, 건설 및 운영 허가시기, 시설 운영 개시월, 비고 설명 등 연관데이터는 다음의 개별파일데이터를 참고하세요 시설별 사용후핵연료 저장가능 연도, 연도별·시설별 사용후핵연료 저장 현황,  연도별·시설별 중·저준위 방사성폐기물 저장 현황, 연도별·업종별 개봉선원 폐기물 수거 현황, 연도별·업종별 밀봉선원 폐기물 수거 현황'
