description_portal: KOTRA에서 공공데이터 포털에 제공하는 해외진출 한국기업 디렉토리 데이터는 해외에 진출한 한국 기업들의 상세 정보를 포함한 데이터입니다. 이 디렉토리는 국가별 진출한 기업들을 진출형태와 투자형태로 세분화하여 정보 제공 동의를 받은 기업에 한 해 기업 연락처를 제공하는 데이터 입니다. 주요 데이터 항목은 기업명, 업종 및 제품군, 진출 국가, 현지 법인 및 지사, 설립 연도 및 규모 등입니다. 이 데이터는 성공적으로 해외 시장에 진출한 기업들의 사례를 통해, 다른 기업들이 해외 진출을 위한 전략을 세울 때 유용한 정보와 인사이트를 제공할 수 있습니다.
