description_portal: 한국가스공사가 제공하는 연도별 일일 최대 천연가스 생산량(ton) 데이터는 국내 천연가스 수급 현황을 체계적으로 파악할 수 있는 기초 자료입니다. 본 공공데이터는 일 단위로 집계된 천연가스 생산량 데이터에서 연중 최대 값을 나타냅니다. 해당 공공데이터는 한국가스공사의 생산기지 천연가스(LNG) 생산량이며, 데이터의 단위는 톤(ton)입니다. 한국가스공사의 연도별 일일 최대 생산량에 대한 데이터로, 연월일별 최대 생산량 데이터를 제공합니다. 공공데이터 공개 대상 자료는 2008년도 1월부터 현재까지의 기간동안 한국가스공사 연도별 일일 최대 생산량(LNG)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 연 단위이며, 매년 1월달에 지난연도 데이터 업데이트를 시행합니다. 공개된 데이터의 파일 형식은 csv 파일입니다.
