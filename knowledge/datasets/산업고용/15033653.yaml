summary_user: 전라남도 영광군 관내 LPG 충전소와 판매소를 업소 한 곳당 한 행으로 담은 현황 파일로, 업소명·유형(충전소/판매소)·도로명주소·연락처·데이터기준일자로 구성된다(CSV 약 1.6KB 규모). 영광군 주민이나 사업자가 '우리 동네 가까운 LPG 판매소 연락처가 어디인가'를 찾거나, 행정·분석가가 군내 LPG 공급시설 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명주소·업소명 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 전라남도 영광군 관내에 위치한 LPG(액화석유가스) 충전소 및 판매소에 대한 현황 정보를 제공하는 데이터입니다. 각 업소의 명칭, 영업 유형(충전소 또는 판매소), 도로명 주소, 연락처 등으로 구성되어 있으며, 지역 내 연료 공급시설의 공간 분포와 공급망 구조를 파악할 수 있도록 체계화되어 있습니다. 해당 데이터는 연료 수급 안정성 분석, 화재 및 안전관리 계획 수립, 민원 대응, 에너지 관련 정책 수립, LPG 수요 예측 및 도시가스 전환 검토 등 다양한 행정·정책 분야에서 활용 가능합니다. 또한 긴급 재난 시 대체 연료 공급망 확보, 에너지 취약계층 지원, 친환경 연료 인프라 계획 수립 등 민간 및 공공부문 모두에서 실효성 높은 기초자료로 제공됩니다.
