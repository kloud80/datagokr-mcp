summary_user: SRT 전용역인 수서역·동탄역·평택지제역의 전기에너지 사용량을 반기 단위로 역별·합계로 담은 소규모 집계 파일(csv, 919 bytes)이다. 철도역 에너지 관리나 탄소 배출을 분석하는 사람이 '수서역 전력 사용량이 반기마다 어떻게 변했나', '세 역 가운데 어느 역이 전기를 가장 많이 쓰나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 붙일 공통 조인 키가 없어서, 다른 데이터와는 반기(구분)와 역 이름을 직접 맞춰 연결한다.
limits: 역 3곳의 반기별 합계만 담고 있어 월별·용도별 사용량이나 다른 철도역과의 비교는 이 데이터만으로 하지 않는다. 행정구역 코드 같은 공간 키가 없는 비공간 데이터라, 한전 지역별 전력사용량과 연결하려면 역 소재지를 직접 대응시켜야 한다.
