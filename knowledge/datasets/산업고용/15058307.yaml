summary_user: 자립형 노인일자리 사업에서 쓰는 행정구역 코드 목록을 담는 코드 마스터 API로, 행정구역코드와 대·중·소분류 코드, 행정구역명이 한 행씩 들어 있고 범위는 전국이다. 한국노인인력개발원의 자립형 노인일자리 관련 다른 API를 호출하는 개발자나 분석가가 '이 지역의 일자리·사업 정보를 조회하려면 어떤 지역코드를 넣어야 하나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 행정구역코드(dstrCd)를 같은 기관 자립형 노인일자리 API의 요청변수로 넣거나 행정구역명으로 다른 데이터와 이름 매핑해 연결한다.
description_portal: 한국노인인력개발원에서 운영하는 노인일자리 업무시스템의 코드 정보 중 자립형 노인일자리 사업 관련 행정구역 코드 목록을 조회하는 OpenAPI 서비스이며, 데이터 항목은 행정구역코드, 대분류코드, 중분류코드, 소분류코드, 행정구역명 등으로 구성되어 있습니다.  요청변수 입력을 통해 설정한 조건의 데이터를 조회할 수 있으며, 조회된 데이터는 자립형 노인일자리 사업과 관련된 한국노인인력개발원의 타 OpenAPI 및 오퍼레이션에서 요청변수로써 원하는 데이터의 조회에 사용될 수 있습니다.
