description_portal: '한국남동발전의 시간대별 태양광 발전실적입니다.경상대 태양광, 고흥만 수상태양광, 구미 태양광 등의 지역에서 발전한 태양광 발전량 데이터입니다.시간대별 발전량 뿐만아니라 일별 총량 데이터, 평균값, 최대값, 최소값 등의 데이터를 포함하고 있습니다.○ 발전구분 : 삼천포, 구미, 여수, 경상대태양광 등○ 호기 : 1,2,3,4○ 일자(YYYY-MM-DD)○ 시간대별 발전량 : 1시 발전량, 2시 발전량 ~ 24시 발전량으로 총 24개 컬럼으로 구성 (단위 : MWh)○ 각 일자별 발전총량(MW), 평균 발전량(MW), 시간별 최대/최소 발전량※ 본 데이터는 최대 1개월만 조회 가능합니다.'
