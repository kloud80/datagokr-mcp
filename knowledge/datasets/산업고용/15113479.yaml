summary_user: 남원시 안의 태양광발전소 개발행위허가 사업부지를 부지(주소) 단위로 한 건씩 담은 파일로, 지목·지적면적·용도지역·허가면적·허가일자·허가내용·준공 여부가 들어 있습니다. 남원시에서 어느 땅에 언제 얼마만큼의 태양광 개발행위허가가 났고 준공까지 갔는지 확인하려는 주민, 발전사업자, 토지·입지 분석가가 씁니다. 전역 조인 키나 코드표는 없어서, 전국 태양광 발전사업 허가 표준데이터 같은 발전소 원장과는 주소 문자열을 맞춰 연결해야 합니다.
description_portal: 신재생 에너지에 대한 수요가 증가함에 따라 풍력 발전, 조력 발전, 태양광 발전 등 여러 발전시설이 늘어나고 있습니다. 이에 따라 전북특별자치도 남원시에서 태양광 발전소 개발행위허가 사업부지를 관리하기 위해 부지에 대한 주소, 지목, 지적(제곱미터), 용도지역, 허가면적(제곱미터), 허가일자, 허가내용, 준공여부를 제공하고 있습니다. 태양광 발전소가 증가함에 따라 남원시에서는 철저한 인허가와 관리와 태양광 외 다양한 발전시설을 구축하여 자체 전기생산을 하면 환경적, 경제적 효과를 볼 것이라 기대합니다.
legal_basis_portal: <전남 남원시 내 태양광발전소에 대한 전기사업허가 및 개발행위허가 완료 사업부지 목록> 신청 건에 대한 제공임.
