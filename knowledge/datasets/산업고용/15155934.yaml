description_portal: 한국남동발전 전력거래 입찰 정보 현황 데이터입니다.2024년 1월 1일부터 2024년 12월 31일까지 전력거래 입찰 발전기에 대한 현황 자료입니다.일자, 구분, 1시~24시까지 컬럼으로 구성되어 있으며 해당 일자에 따른 육지계통 시간대별 입찰 발전기 현황을 포함합니다.영흥, 삼천포, 분당, 영동, 여수 발전소를 운영하는 한국남동발전을 포함한 5개 발전그룹사, 민간발전사 등 우선순위에 따라입찰을 하는 데이터를 표현합니다. 해당 데이터를 통하여 일자별, 시간대별 입찰 현황 정보를 확인할 수 있습니다.
