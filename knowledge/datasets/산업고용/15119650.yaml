description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업에 참여하는 기관들의 유형별 통계 정보를 집약한 공공 데이터입니다. 제공되는 정보는 각 연도별로 에너지기술개발 과제에 참여한 기관들을 대기업(공기업), 중견기업, 중소기업, 비영리기관(대학, 연구소 등)으로 상세히 분류하여 그 수를 제공합니다. 이를 통해 기관별 참여 동향이 어떻게 변화하는지를 쉽게 파악할 수 있습니다. 이 데이터는 정부의 에너지 R&D 정책이 산업 생태계에 미치는 영향을 분석하고, 특정 기관 유형에 대한 지원 전략을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다.
