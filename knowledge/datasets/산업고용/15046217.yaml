description_portal: '한국장애인고용공단에서 실시하는 직업능력평가 도구 중 자기개념검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 원점수, 퍼센타일 등에 대한 정보를 제공합니다.* 자기개념검사: 자신에 대한 느낌, 판단 그리고 장애에 대한 영향정도와 극복의지를 파악하기 위한 검사로, 자신에 대한 자신감을 측정하여 앞으로의 사회생활, 직업생활에 있어 장점은 더욱 부각시키고 단점은 보완할 수 있는 방법을 알아보기 위한 검사입니다. 본 검사는 자신의 자존감, 자신감 등을 파악하고 이를 통해 자신의 장점은 개발하고 단점은 보완하여 직업생활에 도움을 드릴 수 있습니다.'
