summary_user: 한국장애인고용공단이 실시한 자기개념검사의 결과를 검사 1건 단위로 담은 파일로, 검사일자·장애유형과 자기확신·직업생활·가족관계·대인관계·계획수립·직업적영향·상대적영향·장애극복 8개 영역별 원점수와 퍼센타일, 1~26번 문항 응답이 들어 있다. 장애인 직업재활 연구자나 상담 담당자가 '장애유형에 따라 장애극복 의지나 직업생활 자기개념 점수가 어떻게 다른가' 같은 질문을 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 장애유형 이름이나 검사일자 기준으로만 느슨하게 이어 쓸 수 있다.
limits: 전역 조인 키가 없어 개인·사업장·직업분류 코드 단위로 다른 고용 데이터와 정확히 연결할 수 없다. 범위는 전국이며 지역 구분이 없는 비공간 데이터라 지역별 분석에는 쓰지 못한다.
