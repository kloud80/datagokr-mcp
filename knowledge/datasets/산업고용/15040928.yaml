description_portal: 본 '생산기지 건설공사 종합공정율'은 한국가스공사 국내 생산기지의 사업별 종합 공정현황을 체계적으로 정리한 데이터 입니다. 생산기지 건설공사의 공정관리 및 진도율 모니터링, 일정 관리, 공정 위험 조기 식별을 목적으로 수집되었습니다. 데이터 구성항목은 생산기지명, 사업명, 전년도말 실적, 당해연도말 계획, 당해연도 월별 계획, 당해연도 실적, 월별 실적률, 누계 계획, 누계 실적, 누계 실적률, 달성률, 비율 등으로 이루어져 있어 공정 진행상황을 상세하게 파악할 수 있습니다. 본 데이터를 활용하면 사업별 공정 지연/선행 현황 파악, 계획 대비 실적 분석, 공정 위험요인 조기 식별, 월별 공정률 추이 분석이 가능합니다. 공정 지연 사업에 대한 대응방안 수립, 자원 재배분 의사결정, 준공일정 관리, 공정 만회 대책 수립, 성과분석 및 평가 등 건설사업 관리 업무를 효과적으로 지원합니다.
