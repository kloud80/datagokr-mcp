summary_user: 골재자원조사 결과 중 산림골재 부분으로, 부존지역별 부존량·개발가능량·개발량(세제곱미터)과 암종을 행 단위로 담은 전국 범위 조사 결과 파일(CSV, 약 47KB)이다. 골재 수급 계획을 세우는 분석가나 채석 사업자가 '어느 지역에 어떤 암종의 산림골재가 얼마나 남아 있고 개발 여지가 얼마인가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 부존지역 이름을 행정구역명이나 토석채취 허가 자료의 지역명과 맞춰 이어 써야 한다.
description_portal: 골재자원조사의 결과 중 산림골재 부존량 부분의 상세내용으로 부존지역에 따라 산림골재의 부존량, 개발가능량, 개발량, 암종, 부존량 등을 수치로 표시산림골재의 매장량은 간소화된 2차원 단면을 사용하여 평균 단면법을 사용하여 계산된 체적을 의미함, 정밀지질조사를 수행하여 채석 대상암의 분포위치 및 부존범위(평면, 심도), 암석의 특성, 표토량, 풍화양상, 지질구조 등의 종합적인 지질여건, 지형적 요소 그리고 관련법규 등을 종합적으로 검토하여 산출함, 산림골재의 매장량은 체적 계산을 기본으로 함, 중량으로 환산할 필요가 있을 때에는 주 채석 대상이 되는 암종의 평균 비중(밀도)을 곱하여 추산함
