description_portal: 한국전력공사에서 제공하는 요금 청구방식 변동 추이 데이터 입니다.사용자가 원하는 정보를 설정하여 추출할 수 있는 시스템으로 행정구역, 기간, 추출정보를 설정하여 테이블, 월별 추이그래프, 연도별 추이그래프를 제공받을 수 있습니다.사용자는 시간의 흐름에 따른 소비자들의 요금 청구 방식 선호도 변화를 분석할 수 있습니다.기본적으로 조회는 가능하나 다운로드시에는 회원가입 및 로그인이 필요한 서비스 입니다.우편에서 모바일이나 이메일과 같은 디지털 방식으로의 전환속도를 지역별로 비교하거나, 스마트폰 보급률 데이터와 결합해 디지털 서비스 수용 행태를 연구하는데 활용할 수 있습니다.
