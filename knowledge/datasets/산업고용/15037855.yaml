summary_user: 한국남동발전이 진행한 발전소 건설사업을 사업 한 건당 한 행으로 담은 소규모 목록 파일(csv, 약 2.9KB)로, 위치·설비용량(MW)·호기 수·설비형식·건설공기·총사업비·연간발전량(GWh)과 설계용역사·주기기공급사·시공사를 함께 싣는다. 발전설비 시장을 보는 분석가나 사업자가 '남동발전 신규 발전소 건설에 어떤 시공사와 주기기 업체가 참여했고 사업비 규모는 얼마인가' 같은 질문에 쓴다. 전역 조인 키나 코드표가 없어 다른 발전소 원장과는 사업명·위치·업체명 같은 이름을 맞춰 연결해야 한다.
description_portal: 해당 데이터는 한국남동발전에서 진행한 건설사업에 대한 현황을 보여주는 자료입니다. 사업명, 위치, 설비용량(Mw), 개수, 설비형식, 건설공기, 총사업비, 연간발전량(GWh), 설계기술용역사, 주기기공급사, 시공사 등 내용을 포함하고 있습니다. 이 데이터는 단순한 사업 목록을 넘어, 에너지 정책사업의 실행 과정을 보여주고 관련 산업 생태계 동향을 파악할 수 있는 중요한 정보 자산입니다. 세부 내용으로 설계기술용역사, 주기기공급사, 시공사 정보는 발전소 건설 시장의 주요 참여자를 확인할 수 있습니다.
