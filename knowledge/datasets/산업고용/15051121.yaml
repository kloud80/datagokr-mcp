description_portal: 'ㅇ 제공 자료는 제조업 및 섬유패션산업의 해외직접투자 현황에 대한 데이터입니다.ㅇ 연도별로 1. 제조업 및 섬유패션산업의 신규 법인수, 2. 신고금액 및 투자금액,  3. 섬유패션산업의 신규법인수 및 투자금액 비중 등 정보를 제공합니다.* 제공 자료는 한국수출입은행의 해외투자통계(중분류 : 섬유제품제조업, 의복, 의복 액세서리 및 모피제품 제조업 + 소분류 : 합성섬유 제조업, 재생섬유 제조업)을 기반으로 합니다. * 섬유패션산업의 국가별 해외투자 상세현황(신규법인수 및 투자금액)은 한국수출입은행의 해외투자통계를 통해 확인 가능합니다.'
