summary_user: 군산시 관내에서 허가된 태양광 발전시설을 시설 단위로 한 줄씩 담은 원천 목록으로, 2,413건에 2007-11-14부터 2026-06-05까지의 허가·설비 정보(설비용량, 설치연도, 가동상태, 설치면적 등)가 들어 있다. 지역 분석가나 사업자가 군산시에 어느 주소에 얼마 용량의 태양광 시설이 언제 허가됐는지 확인하는 질문에 쓴다. 도로명주소·지번주소(address)를 키로 다른 주소 기반 자료와 이어 쓰고, 전국 태양광 발전사업 허가 표준데이터와 같은 발전소 단위 원장과 짝지어 볼 수 있다.
limits: 범위가 군산시 한 곳이므로 다른 시군구나 전국 합계는 이 파일만으로 알 수 없다. 명세상 갱신 주기는 연간이며, 필드에 코드표나 의미 설명이 없어 가동상태·세부용도 값은 원본 표기를 그대로 확인해야 한다.
