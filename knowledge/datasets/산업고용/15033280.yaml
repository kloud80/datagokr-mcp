summary_user: '부산광역시 강서구에서 담배소매인으로 지정된 영업소를 한 곳당 한 행으로 담은 건별 목록 파일(CSV)로, 업소명과 지번·도로명 주소를 담는다. 담배소매업 지정을 신청하려는 사업자가 원하는 위치 50m 안에 기존 소매인이 있는지 확인하거나, 분석가가 강서구 안 담배 판매점 분포를 살펴볼 때 쓴다. 전역 조인 키나 사업자번호·좌표 컬럼이 없어, 다른 데이터와는 주소를 지오코딩하거나 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다(예: 소상공인 상가업소 정보, 다른 업종 인허가 목록).'
description_portal: '부산광역시 강서구 내 담배 소매인 지정 현황 관리정보로서 다음과같은 정보를 포함하고 있습니다.(업소명,  업소도로명주소)※ 상호명 미기입 영업소 정보는 추후 보완될 예정입니다.      - 대상영업소:  1998년 당시 상호명 없이 등록된 영업소, 전자담배판매 영업소(전자담배영업소는 소매인 지정 후 사업자등록이 가능하여, 상호를 추후 보완해야하나 누락되었음)        - 보 완  방 법: 개별 소매인에 대한 연락을 통해 직권취소 또는 상호명 보완을 지속적으로 할 예정임.    (해당 영업소 50M 이내에 담배 소매업 지정신청을 원하는 경우 부산광역시 지역경제과 담배업무 담당자 051-970-4476 로 연락바랍니다.)'
