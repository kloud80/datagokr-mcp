summary_user: 한국전력공사가 GIS(가스절연개폐장치) 부분방전 진단에 쓰는 검출장치별 기술 사양(최소검출신호, 입력채널, 프로세서, 데이터전송방식, 제작사, 삭제여부, 등록일자)을 장비 한 대당 한 행으로 담은 전국 단위 비공간 파일이며, 파일 크기는 712바이트로 매우 작다. 전력설비 유지보수 담당자나 연구자가 '한전이 운용하는 부분방전 진단장비는 어느 제작사 것이고 데이터를 어떤 방식으로 전송하는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 검출장치 아이디나 제작사 이름을 직접 맞추거나, 같은 기관의 GIS 부분방전진단관리시스템 데이터와 기관 코드 기준으로만 이어 쓴다.
description_portal: 한국전력공사에서 제공하는 GIS 부분방전 진단 장비 및 케이블 정보 데이터입니다.검출장치ID, 최소검출신호, 입력채널, 프로세서, 데이터전송방식, 삭제여부, 제작사 등의 항목으로 구성되어 있습니다.해당 데이터를 통해 한전이 운용하는 GIS의 부분방전진단에 사용되는 장비들의 기술적 특성을  파악할 수 있어 전력설비 유지보수 관련 장비현황을 분석하거나 유지보수 계획을 수립하는데 기초자료로 활용할 수 있습니다.또한 제조사별 장비의 성능비교나 새로운 진단 기술 개발 연구 및 장비 자산관리시스템을 구축하는 등 관련 활동에 도움을 줄 수 있습니다.
