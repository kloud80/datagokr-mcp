summary_user: 울산광역시 관내 대형마트·백화점·복합쇼핑몰 등 대규모 점포를 점포 한 곳당 한 행으로 담은 파일(csv, 약 5.7KB)로, 상호명·소재지·구군·위도·경도와 영업시간·휴무일·영업개시일·전화번호 등을 포함한다. 소비자가 집 근처 대형마트의 휴무일과 영업시간을 확인하거나, 분석가가 울산 구·군별 대규모 점포 분포와 전통시장 인접 여부를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·소재지 주소나 구군 이름을 맞추거나 좌표(위도·경도) 기반 공간 결합으로 이어 써야 하며, 전국대규모및준대규모점포표준데이터·소상공인 상가업소 데이터와 대조할 때도 같은 방식으로 연결한다.
description_portal: 본 데이터는 관내에 소재한 대규모 소매점포의 현황 정보이다. 유통산업발전법에 따라 등록된 대형마트, 백화점, 복합쇼핑몰 등의 명칭, 소재지, 영업 면적, 개설 일자, 운영 업체 등의 세부 사항을 포함한다. 대규모 점포는 지역 상권 형성과 소비 패턴에 큰 영향을 미치는 유통 시설로서 해당 정보는 유통 산업 정책 수립 및 상권 분석에 활용된다. 전통시장과의 상생 방안 마련, 중소 유통업체 지원 정책 개발 등에 필요한 기초 자료를 제공한다. 또한 소비자들이 가까운 대형 쇼핑 시설을 찾는 데 유용하며, 지역별 유통 시설 분포 현황 파악을 통해 균형 잡힌 유통망 구축 계획 수립에 기여한다. 본 정보는 정기적으로 업데이트되어 최신 점포 현황을 반영한다.
