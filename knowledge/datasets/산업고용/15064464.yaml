description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지 분야 인력양성사업의 주요 성과 중 하나인 인턴쉽 활동 정보를 집약한 공공 데이터입니다. KETEP은 미래 에너지 산업을 이끌어갈 인재들이 실무 역량을 강화하고 산업 현장을 경험할 수 있도록 인턴쉽 프로그램을 적극적으로 지원하고 있습니다. 본 데이터는 이러한 인턴쉽 활동의 결과를 투명하게 공개하여 에너지 분야 인턴쉽 기회 탐색 및 교육 프로그램 개발에 활용될 수 있도록 합니다. 제공되는 정보는 재원, 프로그램, 과제명, 업무내용 등을 포함합니다.
