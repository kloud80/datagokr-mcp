description_portal: 한국산업기술기획평가원에서 기획·평가·관리하는 산업기술 연구개발 과제의 상세 메타정보를 체계적으로 정리하여 제공하는 공공데이터입니다. 연구개발 과제별로 연구목표, 추진 배경, 연구기간, 예산 규모, 정부지원금, 수행기관 및 참여기업 정보 등 과제 수행에 필요한 핵심 내용을 포함하고 있으며, 과제의 진행 상태나 성과와 연계된 기대효과도 함께 확인할 수 있습니다. 이를 통해 산업기술 분야별 연구개발 현황을 한눈에 파악할 수 있고, 기업·연구기관·정책 담당자 등이 연구 동향 분석, 기술개발 전략 수립, 협력 파트너 탐색 등에 활용할 수 있습니다. 특히 연구과제번호, 기술분야, 사업명, 개발목표와 범위, 주요 키워드 등 세부 항목을 구조화하여 제공함으로써 연구개발 성과의 투명성을 제고하고, 산업기술 혁신 생태계 전반에 걸친 데이터 기반 정책 지원과 민간 활용을 촉진하는 데 기여합니다.
