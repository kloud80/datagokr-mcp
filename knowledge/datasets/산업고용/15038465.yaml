description_portal: 중소기업기술정보진흥원에서 제공하는 '중소기업기술개발사업 동영상 강의정보' 데이터는 중소기업 R&D 지원사업에 대한 이해를 돕고 사업 참여 역량을 강화하기 위해 제작된 온라인 교육 콘텐츠 목록입니다. 이 자료는 연도 컬럼을 통해 강의의 제작 시점과 최신성을 명확히 파악할 수 있도록 구성되어 있습니다. 각 강의 콘텐츠의 동영상 강의명은 해당 강의가 다루는 구체적인 주제나 사업 분야를 나타내어 사용자가 필요한 정보를 쉽게 검색할 수 있게 합니다. 특히, 해당 강의 영상에 직접 접근할 수 있는 링크 컬럼을 제공함으로써, 중소기업 관계자들이 R&D 지원사업의 신청 절차, 규정 해설, 사업 계획서 작성 방법 등 실무적인 지식을 시간과 장소에 구애받지 않고 학습할 수 있도록 접근성을 높였습니다.
