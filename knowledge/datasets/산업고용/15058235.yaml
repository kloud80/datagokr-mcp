summary_user: 경기도 내 국민건강보험공단 지사를 한 곳씩 담은 기관 목록으로, 기관명·시군명·지번/도로명 주소·우편번호·전화번호·홈페이지·위도·경도를 담는다. 주민이 우리 시군에서 가장 가까운 건강보험공단 지사와 연락처를 찾거나, 분석가가 시군별 지사 분포와 대민 접점 공백을 살피는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 다른 경기도 시군 단위 자료나 지도 데이터와 이어 쓴다.
description_portal: 국민건강보험공단에서 제공하는 경기도 내 국민건강보험공단(지사) 현황입니다. 기관명, 소재지지번주소, 소재지도로명주소, 홈페이지URL 등의 정보를 제공합니다.이 데이터는 경기도 내 국민건강보험공단 각 지사의 정보를 정리한 것으로, 기관명, 시군명, 소재지 주소(지번 및 도로명), 우편번호, 전화번호, 위도·경도 좌표, 홈페이지 URL 등의 항목으로 구성되어 있습니다. 건강보험 관련 민원 처리, 보험료 납부 및 징수, 자격관리 등의 서비스를 제공하는 지역별 지사에 대한 기본 정보를 담고 있으며, 이를 통해 국민의 건강보험 접근성과 공단의 서비스 분포를 파악할 수 있습니다. 각 지사의 위치정보는 행정구역별 서비스 범위 분석, 대민 접점 위치 선정, 건강보험정책 실행 기반 자료로 활용이 가능합니다.
