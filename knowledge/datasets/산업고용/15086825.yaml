summary_user: 창원시 내 골재채취업체를 업체 한 곳당 한 행으로 정리한 현황 파일로, 등록업종·사업체명·소재지·데이터기준일자를 담으며 파일 크기는 1,346바이트로 작다. 지역 주민이나 분석가가 창원시 어느 곳에 골재채취업체가 있고 어떤 업종으로 등록돼 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 인허가(LOCALDATA) 자료나 지도 데이터와는 사업체명·소재지 주소를 맞춰 붙여야 한다.
description_portal: 2021년 창원시 골재채취업체현황입니다.자료출처는 각 구청 안전건설과 골재관련 담당자로 매월 생산 현황자료에서 추출하였음.채석장ㆍ골재 채취업체의 위치, 영업허가 현황, 채취 방식 및 규모 정보를 정리한 자료입니다. 본 데이터는 업체 분포 파악, 채취량 통계, 환경영향 모니터링, 인허가 점검, 민원·산지정책 수립 등에 활용될 수 있습니다.다수 업체 정보로 인해 일반 뷰어에서 일부 항목만 확인될 수 있으므로 R, Python, GIS 등 분석 전용 도구 사용을 권장합니다.채취 허가 기준, 채취량 단위, 허가 기간, 복토 계획 등 세부 정의는 제공기관의 메타데이터나 기술문서를 참고해 주세요.
