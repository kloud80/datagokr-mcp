summary_user: 한국전력공사가 관리하는 시스템에 등록된 전기차를 제조사와 모델명 단위로 나열한 목록으로, 1,975바이트 크기의 작은 CSV 파일 한 개다. 전기차 충전 서비스나 차량 선택 화면을 만드는 개발자·분석가가 한전 시스템에 어떤 제조사의 어떤 모델이 등록돼 있는지 확인할 때 쓴다. 코드형 조인 키가 없어 다른 차량·충전 데이터와는 제조사명·모델명 같은 이름을 맞춰서만 이어 쓴다.
limits: 한전 시스템에 등록된 차량만 담고 있어 국내 전기차 전체 모델 목록이 아니다. 2024년 말 시스템 개편 뒤 확인 가능한 제조사·모델명만 남아 있으므로 배터리 용량, 최대거리, 충전시간, 충전방식 같은 제원은 과거 데이터를 따로 찾아야 한다.
