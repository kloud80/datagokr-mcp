summary_user: 한국서부발전 발전소의 호기별 운전 태그 값을 생성 시각 단위로 담은 건별 운전 데이터로, 발전소명·호기명·태그명·태그 설명·단위·태그 값과 함께 사전 정의 범위 대비 이탈 여부를 나타내는 FLAG(-1 하한 미만, 0 정상, 1 상한 초과)를 제공한다. 발전 설비 성능 예측이나 이상 탐지 모델을 만드는 분석가가 특정 호기의 어느 태그가 허용 운전 범위를 벗어났는지 확인하고, 학습 전에 이상값을 걸러내는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매핑이나 같은 기관 자료로만 연결한다.
description_portal: 한국서부발전에서 제공하는 플랜트 성능 예측 및 AI 검증용 플랜트 발전 운전 정보 조회 서비스는 발전 설비의 운전 상태를 데이터 기반으로 확인하고, AI 학습 및 검증에 활용할 수 있도록 구성된 서비스입니다. 제공되는 데이터 항목은 호기 코드, 분류 코드, 태그명, 태그 데이터 생성 시간, 태그 값, FLAG로 구성됩니다.각 태그 값은 사전에 정의된 TAG 정보의 최소값과 최대값 범위를 기준으로 비교됩니다. 태그 값이 최소값보다 작으면 FLAG는 -1, 최대값보다 크면 FLAG는 1, 정상 범위 내에 있으면 FLAG는 0으로 표시됩니다. 이를 통해 개별 태그 데이터가 허용 가능한 운전 범위 안에 있는지 쉽게 판단할 수 있습니다.이러한 FLAG 정보는 비정상 데이터나 이상 징후를 식별하는 데 활용될 수 있으며, 데이터 정제 및 품질 검증 과정에서도 유용합니다. 특히 AI 모델 학습 전 데이터의 신뢰성을 확인하고, 이상값을 사전에 분류함으로써 보다 안정적인 AI-Ready 학습용 데이터를 구축하는 데 기여할 수 있습니다.
