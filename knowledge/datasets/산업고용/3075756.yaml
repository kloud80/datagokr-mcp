summary_user: 부산 해운대구에 등록된 담배소매인을 업소 한 곳당 한 행으로 담은 원장 파일로, 관리번호·소매인 구분·업소명·도로명 주소·지정일자·영업 상태를 개별 주소 단위로 담는다. 해운대구에서 담배를 파는 곳이 어디에 있는지, 어떤 가게가 지금 영업 중인지 확인하려는 주민·창업 예정자, 그리고 담배소매점 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소(업소도로명주소)를 맞춰 붙여야 하며, 소상공인 상가업소 정보나 다른 LOCALDATA 업종 인허가 자료와 주소 기준으로 대조하는 방식으로 쓴다.
limits: 사업자번호나 표준 코드 같은 공통 조인 키가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵다. 범위가 해운대구 한 곳뿐이라 부산 전체나 다른 구와 비교하려면 별도 자료가 필요하다.
