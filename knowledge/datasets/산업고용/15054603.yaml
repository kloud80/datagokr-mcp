description_portal: 이 데이터는 국내 산업별로 소비한 석유제품의 현황을 정리한 자료입니다. 항목에는 산업분류명, 석유제품명, 소비월, 소비량(천배럴 단위) 등이 포함되어 있으며, 산업 부문별 석유제품 수요 특성을 파악하는 데 활용됩니다. 이를 통해 각 산업군의 에너지 사용 구조와 소비 집중도를 분석할 수 있으며, 특정 산업의 연료 전환 추이, 수요 예측 등에 유용한 정보를 제공합니다. 또한 정유사와 정책 수립 기관이 산업 맞춤형 공급 전략을 수립하거나, 에너지 절감 정책 및 탄소 배출량 추계 등에도 기초자료로서 활용도가 높습니다.
