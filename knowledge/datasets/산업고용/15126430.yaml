summary_user: 제주 지역의 기상청 종관기상관측 자료(기온·강수량·습도·적설·전운량·일조·일사량)와 전력거래소 시장 참여 태양광 설비용량(MW)·발전량(MWh)을 1시간 간격으로 연계해 가공한 시계열 집계 파일이다. 연구자·분석가가 '제주에서 일사량과 구름양에 따라 시간대별 태양광 발전량이 어떻게 달라지는가'를 분석하거나 발전량 예측 모델을 학습시키는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 일시(시간)만 공통 축이므로, 다른 기상·전력 시계열과는 시간을 맞춰 이어 쓰고 발전소 단위 원장(태양광 발전사업 허가 표준데이터 등)과는 직접 연결되지 않는다.
description_portal: 한국동서발전의 제주 기상관측 및 태양광 발전 현황 데이터는, 제주 지역의 태양광 발전량 예측을 목적으로 1시간 간격으로 수집된 기상청의 종관기상관측 자료와 전력거래소의 시장 참여 태양광 설비 및 발전량 데이터를 연계하여 가공한 것입니다.해당 데이터는 일시, 기온, 강수량, 일사량, 태양광 설비용량, 태양광 발전량 등의 항목으로 구성되어 있습니다.학계 및 연구기관에서는 이 데이터를 활용하여 제주 지역의 태양광 발전량을 시간대별로 분석할 수 있으며, 제주 지역과 타 지역 간의 태양광 발전 현황을 비교·분석하는 데에도 활용이 가능합니다.
