summary_user: 한국동서발전이 운영하는 울산시민가상발전소(VPP)의 발전 실적을 발전소별·연월 단위로 정리한 집계 파일로, 설비 용량(MW)·발전량(kW)·이용률(%)·비고를 담는다. 분산에너지 연구자나 지역 에너지 정책 분석가가 "시민 참여형 가상발전소의 월별 이용률이 계절에 따라 얼마나 달라지는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전량·신재생 데이터와는 발전소명이나 연월을 직접 맞춰 이어 쓰거나, 같은 기관(한국동서발전) 자료끼리만 묶어 쓴다.
