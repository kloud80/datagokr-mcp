description_portal: 해당 통계는 한국고용정보원에서 제공하는 ‘유효구인구직현황(전체)’에 대한 월별 자료로, 노동시장 내 구직자와 구인자의 실시간 수급 현황을 종합적으로 파악할 수 있도록 구성되어 있습니다. 유효구인인원은 마감되지 않은 구인 건의 모집인원을 기준으로 하며, 유효구직자수는 아직 구직 중인 이들의 신청 건수를 집계한 수치입니다. 통계는 근무지역(시도, 시군구), 사업장 소재지, 직종(중분류·소분류), 산업, 고용형태, 사업장 규모, 구직자의 성별·연령·학력 등을 기준으로 분석됩니다. 본 자료는 구인·구직 간 불균형 해소, 지역별 고용정책 수립, 인력 수요 예측 등의 정책적 판단을 위한 기초 자료로 활용됩니다. 특히 동일 시점의 유효 수치를 기반으로 해야 하며, 여러 월의 데이터를 단순 합산할 경우 통계 오류가 발생할 수 있으므로 월 단위 활용이 원칙입니다.
