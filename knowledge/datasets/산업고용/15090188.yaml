description_portal: '한국원자력안전재단에서 제공하는 업종별 피폭선량 구간별 종사자 분포현황으로, 수시로 제공되는 1회성 데이터입니다. 업종별 피폭선량 구간별 종사자 분포현황에 대한 데이터는 업종구분, 기관수, 0.1 미만부터 50 이상까지의 7개의 구간으로 나뉜 항목으로 구성되어 있습니다.업종구분은 일반산업체, 방사선투과검사, 의료기관, 연구기관, 교육기관, 공공기관, 군사기관, 원자력발전소와 같은 8개의 업종으로 구분되며, 피폭선량의 단위는 mSv 입니다.해당 데이터는 2025년도의 데이터를 제공하며, 피폭선량평가위원회 결과 등에 따라 데이터가 변동될 수 있음을 참고부탁드립니다.데이터명 :  한국원자력안전재단_업종별 피폭선량 구간별 종사자 분포현황_20251231파일명 : 업종별 피폭선량 구간별 종사자 분포현황.csv'
