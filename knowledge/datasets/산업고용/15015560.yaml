summary_user: 경상남도가 선정한 고용우수기업을 기업별로 한 행씩 담은 목록 파일로, 선정연도·기업명·도로명/지번 주소·우편번호·대표자명·전화번호·주요생산품을 포함한다(약 6KB CSV). 구직자가 "경남에서 고용우수기업으로 선정된 제조업체가 우리 동네 어디에 있나"를 찾거나, 분석가가 연도별 선정 기업의 지역·업종 분포를 살펴보는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 기업명이나 주소 문자열을 맞춰 연결해야 하며, 주소를 행정구역으로 변환하면 시군 단위로 묶어 볼 수 있다.
description_portal: 경상남도내 고용우수기업 현황에 대한 데이터입니다. 기업체명, 기업의 소재지, 기업의 주생산품 데이터를 포함하고 있습니다.
