summary_user: 충청북도 제천시 관내 토석채취허가를 허가 건별로 담은 파일로, 행정처분 종류, 수허가자 상호, 허가지 주소, 채취 용도, 허가면적·허가량, 허가 시작·종료일이 들어 있다(csv 736바이트의 소규모 파일). 제천시에서 어느 업체가 어느 위치에서 어떤 용도로 언제까지 토석채취 허가를 받았는지 확인하려는 주민·건설사업자·인허가 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 허가지 주소나 업체 상호를 이름으로 맞추거나 시군명으로 다른 지자체의 같은 현황과 묶는 식으로만 잇는다.
description_portal: '충청북도 제천시의 토석채취허가 현황입니다.행정처분 종류, 사업자상호, 토석의 채취용도, 허가 면적, 허가 시작일과 종료일에 대한 정보가 포함되어 있습니다.토석채취허가는 사업 추진 과정에서 공사지연, 여건 변화 등 연장이 불가피한 사유가 발생하는 경우, 산지관리법 등 관계법령에 따른 기간연장허가 절차를 거쳐 허가기간이 조정될 수 있습니다. (산지관리법 제25조2항)토석채취허가 : 국유림이 아닌 산림의 산지에서 토석을 채취(가공하거나 산지 이외로 반출하는 경우 포함)하려는 자는 대통령령으로 정하는 바에 따라 시,도지사 또는 시장,군수,구청장에게 토석채취허가를 받아야합니다.'
