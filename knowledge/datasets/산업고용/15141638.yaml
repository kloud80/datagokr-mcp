description_portal: 서울특별시 용산구에 등록된 방문판매업체에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 전화번호, 지번주소, 사업장명, 최종수정일자, 데이터갱신구분, 데이터갱신일자 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 방문판매업체의 위치 및 운영 현황을 파악하고, 「방문판매 등에 관한 법률」상 소비자 보호 관련 정책을 효율적으로 수립할 수 있습니다. 또한 방문판매업체의 분포, 사업자 규모 등을 파악하는 데 참고할 수 있으며, 지역 경제 분석 등 다양한 목적으로 활용할 수 있습니다.* "방문판매"란 재화 또는 용역의 판매를 업으로 하는 자가 방문을 하는 방법으로 그의 영업소, 대리점, 그 밖에 총리령으로 정하는 영업 장소 외의 장소에서 소비자에게 권유하여 계약의 청약을 받거나 계약을 체결하여 재화 또는 용역을 판매하는 것을 말합니다. 우리구에서는 주로 건강식품, 화장품/미용용품, 컴퓨터/사무용품 등을 취급하는 업체들이 중심이 됩니다.
