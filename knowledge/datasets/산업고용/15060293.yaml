description_portal: 우리나라 선용품의 산업발전 전략 수립 및 마케팅 전략 수립 등을 지원하기 위해 선용품 관련 무역통계입니다.전국항구와 부산권항구(부산항/부산신항)로 나누어 산출한 통계자료 및 전체선박(크루즈선 포함)과 크루즈선박으로 나누어 집계하였습니다. 관세법 제2조(정의) 제10호에 따라 "선박용품"이란 음료, 식품, 연료, 소모품, 밧줄, 수리용 예비부분품 및 부속품, 집기, 그 밖에 이와 유사한 물품으로서 해당 선박에서만 사용되는 것을 말하며, "외국선박용품"이란 선박용품 및 항공기용품 등의 관리에 관한 고시 제2조 제1호에 따라 국제무역선에 공급하는 외국물품으로 「관세법」(이하 "법"이라 한다) 제2조제10호에 따른 선박용품을 말합니다. "내국선박용품"이란 국제무역선에 공급하는 내국물품으로 법 제2조제10호에 따른 선박용품을 말합니다.(선박용품 및 항공기용품 등의 관리에 관한 고시 제2조 제3호)2018년 1월부터 2026년 7월까지의 월별 통계자료이고, 품목은 주류, 담배류, 육류 등 대분류 기준으로 대분류 수집하였으며, 국내선용품 금액 단위는 천원이며, 외국선용품 금액 단위는 US달러입니다.
