summary_user: 전국 광산에서 발생한 재해를 낙반·붕락, 운반, 화약, 가스, 출수, 추락·전석, 기계·전기, 기타의 8개 원인으로 나눠 연도별 재해자 수와 사망자 수를 담은 집계 통계로, 건별 사고 기록이 아닌 전국 단위 연도 합계다. 광산 안전 담당자나 정책 분석가가 '어떤 유형의 광산 사고가 해마다 반복되고 사망으로 이어지는 비율이 높은가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 기준으로 이름을 맞춰 붙여야 한다.
description_portal: '해당 데이터는 1980년부터 현재까지 전국 광산에서 발생한 재해를 원인 별로 분류하여, 재해자 수와 사망자 수를 연도 별로 정리한 통계입니다.각 재해 유형은 광산 작업 중 자주 발생하는 사고 원인을 기준으로 나누었으며, 아래와 같은 주요 항목이 포함되어 있습니다:낙반·붕락: 암석이나 토사가 갑자기 무너져 내리는 사고로, 갱내 작업 중 가장 많이 발생하는 유형 중 하나입니다.운반: 자재나 광물을 운반하는 과정에서 발생하는 사고로, 운반기기와 인력의 충돌이나 전도 등이 포함됩니다.화약: 발파 작업 중 발생하는 사고로, 폭발물의 오작동이나 잔류 폭약에 의한 사고가 주요 원인입니다.가스: 메탄가스 누출 또는 유독가스 중독 등, 광산 내 가스 환경으로 인한 사고를 의미합니다.출수: 지하수나 갱내 수분이 갑자기 유입되어 발생하는 사고로, 익사 또는 붕락과 복합 재해가 될 수 있습니다.추락: 높은 곳에서 떨어지는 사고로, 채굴 장비 사용 중 또는 지하 작업장에서 자주 발생합니다.기계·전기: 채굴 장비나 전기설비에서 발생하는 감전, 끼임, 충돌 등의 사고를 포함합니다.기타: 위 항목에 포함되지 않는 기타 원인에 의한 사고로, 환경, 인적 요인, 예외적 상황 등을 포함합니다.우리나라 광산 산업 현장 발생하는 재해의 유형과 각 유형 별로  몇 명이 다치거나 목숨을 잃었는지, 어떤 사고가 반복되고 있는지, 어떤 위험에 더 철저히 대비해야 하는 지를 살펴볼 수 있는 자료입니다.'
