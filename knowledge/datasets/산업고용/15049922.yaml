description_portal: 한국가스공사가 제공하는 연도별 일일 최대 공급량 데이터는 국내 천연가스 피크수요 현황을 파악할 수 있는 기초자료입니다. 본 공공데이터는 일 단위로 집계된 일일 총 천연가스 공급량(ton) 중 연중 가장 큰 값을 포함하고 있습니다. 이를 통해 계절별, 월별 피크수요 특성, 수요 패턴 파악 등에 활용할 수 있습니다.한국가스공사의 연도별 발전 일일 최대 공급량과 도시가스 일일 최대공급량이며, 총 공급량의 합산은 발전용 공급량,도시가스공급량의 합산의 결과 값 입니다. 해당 자료의 단위는 톤(ton)입니다. 공공데이터 공개 대상 자료는 2009년도 1월부터 현재까지 기간의 자료를 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 연 단위이며, 매년 1월 전년도 실적 업데이트를 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일입니다.
