description_portal: 「한국고용정보원_일자리지원사업_직업능력개발_실업자훈련취업률현황(년)」 통계는 고용보험 직업훈련사업의 효과성을 평가하기 위한 지표로, 연도별 실업자훈련 과정 수료자들의 취업률을 제공합니다. 이 통계는 고용정보통합분석시스템(HRD-Net)을 통해 제공되며, 훈련직종(KECO 기준 중분류), 국가기간전략산업직종 대분류, 훈련과정구분(내일배움카드, 국가기간전략산업직종 등)에 따라 구분된 데이터를 바탕으로 수료 후 6개월 이내의 취업 여부를 기준으로 산정됩니다. 특히, 훈련직종별 취업률은 해당 훈련 종료 연도의 다음 해 7월 말까지의 데이터를 기준으로 산정되어 8월 말부터 제공됩니다. 단, 여러 연도의 취업률을 합산해 활용하는 것은 통계 왜곡 우려가 있으므로 주의가 필요합니다. 이 자료는 직업훈련정책의 성과 분석 및 향후 훈련과정 개선 방향 수립에 기초 자료로 활용됩니다.
