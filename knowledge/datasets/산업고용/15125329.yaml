summary_user: 한국남부발전(주)이 낸 입찰공고를 공고 한 건 단위로 담으며, 조회 기간을 정해 공고명·공고일·입찰신청 시작·마감 일시·추정가격·납품기한·지역제한·담당자 연락처를 받는 API다. 발전설비 자재나 공사·용역 입찰에 참여하려는 사업자가 '이번 달 남부발전이 낸 공사 입찰의 추정가격과 신청 마감일은 언제인가'를 확인하거나, 분석가가 이 공기업이 추진하는 사업 동향을 살필 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 공고번호(announceno)·구매계획번호(planno)나 공고명 같은 이름 매칭, 또는 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 입찰공고현황_GW 서비스입니다.해당 API를 통해 사용자는 조회를 희망하는 기간을 설정하여 해당 기간의 한국남부발전(주)에서 실시한 입찰공고 세부사항을 조회할 수 있습니다.조회 시 표출되는 자료로는 공고명, 공고일, 시작일, 마감일, 용역구분, 담당자 및 연락처 등의 세부 정보입니다. 해당 내용을 바탕으로 한국남부발전(주)에서 추진하는 주요 사업을 파악할 수 있습니다.
