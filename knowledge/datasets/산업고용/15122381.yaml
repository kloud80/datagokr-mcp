description_portal: '청년내일카드: 청년근로자의 복지지원 및 근속장려를 위하여 관내 기업에 신규 채용된 아산 청년들을 대상으로 발급하는 150만원 상당의 지역화폐카드입니다.신청대상: ① 참여신청일 기준 만 18세부터 39세 이하인 자② 인정 신청일(초본제출일) 기준 아산시에 주소를 둔 자③ 입사일로부터 5개월 이내 참여 신청 한 자④ 기준 중위소득 150% 이하 월평균 보수액이 3,343,000원 이하인 자⑤ 주 소정 근로시간이 36시간 이상인자※청년내일채움공제’ 중복허용 ※ 생애 1회로 지원제한⑥ 가구 중위소득 150% 이하인 쉼표(고립·은둔) 청년23~25 공공데이터 중장기개방계획에 따른 청년내일센터홈페이지 내 내일카드 월별 지급액에 대한 자료로서 구성컬럼으로 지급연월,지급건수,지급액의 자료를 포함합니다.'
