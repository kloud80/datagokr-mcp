description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 에너지 소비량이 2,000toe 이상인 에너지다소비사업자들이 의무적으로 신고한 연료 사용량 현황을 상세히 제공합니다. 데이터는 전국 각 지자체별, 연도별, 산업 및 상업 등 주요 부문별로 세분화되어 있어 지역적 특성과 산업별 에너지 소비패턴 및 연료별 사용량 분석에 효과적으로 활용할 수 있습니다. 정부와 지자체는 본 데이터를 기반으로 효율적인 에너지 수급 관리, 지역 에너지 정책 수립, 온실가스 배출량 저감 방안 마련 등 정책결정의 기초자료로 활용 가능하며, 기업 및 연구기관에서도 연료 소비 트렌드 분석, 에너지 효율화 전략 수립, 연료 전환 및 친환경 에너지 사용 촉진을 위한 연구자료로 활용할 수 있습니다.
