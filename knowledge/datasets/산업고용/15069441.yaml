description_portal: '중소벤처기업진흥공단(KOSME)에서 제공하는 연수원홈페이지 연수원 지역특화 연수과정 정보입니다.해당 데이터가 보유한 컬럼은 아래와 같습니다.컬럼명 : 부서명,과정명,환급구분,기간,연수비,장소,1월,2월,3월,4월,5월,6월,7월,8월,9월,10월,11월,12월중소벤처기업진흥공단 연수원의 지역특화 연수과정은 각 지역 산업 특성과 수요에 맞춘 맞춤형 직무교육을 제공합니다. 최근 지역소멸위기, 청년 인구유출, 디지털 전환 등 사회적 이슈에 대응하여 현장 밀착형 교육을 강화하고 있습니다. 지역별 주력 산업과 연계해 AI 스마트제조 ESG 경영 등 미래 핵심 역량을 배울 수 있도록 합니다. 이를 통해 중소기업은 지역 내에서 필요로 하는 인재를 확보하고, 청년은 지역 정착형 일자리를 경험할 수 있습니다.'
