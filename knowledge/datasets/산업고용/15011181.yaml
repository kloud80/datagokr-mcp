summary_user: 경기도 다중이용업소 가운데 안전관리 우수업소로 지정된 업소를 업소 한 곳당 한 행으로 담는다. 행마다 시군, 업종, 지정연도, 업소명, 영업허가일자, 도로명·지번 주소와 위경도가 들어 있다. 시민이 우리 동네 영화관·음식점·학원 중 안전관리 우수업소가 어디인지 찾거나, 분석가가 시군별·연도별 지정 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명, 업소명·주소 매칭, 좌표 기반 위치 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 다중이용업소 중 안전관리 기준을 충족하여 ‘우수업소’로 지정된 업체들의 현황을 정리한 자료입니다. 업소명, 업종명, 지정연도, 그리고 도로명주소·지번주소·우편번호·WGS84 위도·경도와 같은 위치 정보가 포함되어 있어 지역별 분포를 확인할 수 있습니다. 영화관, 음식점, 학원 등 다양한 업종이 포함되며, 지정연도를 통해 해마다 새롭게 선정된 안전관리 우수업소를 파악할 수 있습니다. 이 데이터는 다중이용업소의 안전 관리 실태 모니터링, 지역별 안전 우수사례 분석, 공공안전 정책 수립, 시민들의 안전한 업소 이용 선택 등에 유용하게 활용될 수 있습니다.
