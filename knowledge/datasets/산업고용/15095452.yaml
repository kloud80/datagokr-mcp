summary_user: 인천광역시 미추홀구가 신재생에너지 확대기반 조성사업으로 행정복지센터·어린이집·경로당 같은 공공시설에 설치한 신재생 설비를 시설(건물) 한 건씩 담은 원장이며, 건물명·도로명주소·에너지원·발전용량을 포함한다. 주민이나 분석가가 "미추홀구 어느 공공시설에 태양광이 몇 kW 설치됐나"를 확인하거나 구 단위 공공시설 신재생 보급 규모를 파악할 때 쓴다. 전역 조인 키는 없으므로, 전국 태양광발전소 전기사업허가 표준데이터 등 다른 설비 원장과는 도로명주소나 건물명을 맞춰 연결해야 한다.
description_portal: 본 데이터는 인천광역시 미추홀구의 신재생에너지 확대기반 조성사업 추진 현황 정보를 담고 있습니다. 연번, 건물명, 도로명주소, 에너지원, 발전용량(킬로와트), 발전용량(제곱미터) 등의 데이터를 포함하고 있습니다. 미추홀구에 설치된 모든 태양광 발전설비에 대한 데이터가 아닌, 신재생에너지 확대기반 조성사업으로 인해 설치된 태양광 발전설비에 한정된 데이터임을 알려드립니다. 행정복지센터, 어린이도서관, 복지관, 보건소, 어린이집, 경로당 등 공공시설에 설치된 신재생에너지 설비 현황을 확인할 수 있으며, 태양광, 태양열, 지열, 연료전지 등 다양한 에너지원이 활용되고 있습니다. 각 시설별 발전용량 정보를 통해 에너지 생산 규모를 파악할 수 있습니다. 이 데이터는 지역 내 신재생에너지 보급 현황 파악, 공공시설 에너지 자립도 분석, 친환경 에너지 정책 효과 평가 등에 활용될 수 있습니다.
