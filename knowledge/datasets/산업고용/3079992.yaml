description_portal: 담배소매업 관련 데이터는 담배 제품을 소비자에게 직접 판매하는 소매업체들의 현황 정보를 포함합니다담배소매업 데이터는 세수 확보와 정책 수립, 시장 동향 분석에 활용되며, 청소년 흡연 예방과 관련된 규제 효과를 평가하는 데 중요한 역할을 합니다. 이와 함께 불법 담배 유통 단속 및 건전한 담배 시장 조성을 위한 기초 자료로도 활용되며, 지역과 연령별 구매 특성을 파악하는 지표가 됩니다.전라남도 여수시 관내 담배소매업 지정 현황으로 민원구분, 업소명, 업소도로명주소, 지정일자, 영업구분에 관련한 데이터를 제공합니다.
