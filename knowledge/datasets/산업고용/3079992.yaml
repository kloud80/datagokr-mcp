summary_user: 전라남도 여수시 관내 담배소매업 지정 업소를 한 행에 한 곳씩 담은 건별 현황 파일로, 민원구분·업소명·도로명주소·지정일자·영업구분을 담는다(CSV 약 64KB, 시군구 범위·업소별 주소 단위). 여수시에서 담배를 팔 수 있게 지정된 가게가 어디에 있고 언제 지정됐는지, 특정 동네에 신규 소매점 지정이 가능한지 살펴보려는 예비 사업자나 상권 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·도로명주소를 맞춰 잇거나, 같은 성격의 지방행정 인허가(LOCALDATA) 담배소매업 원장 및 소상공인 상가업소 정보와 주소 기준으로 대조해 쓴다.
limits: 사업자번호·좌표 같은 공통 식별자가 없어 다른 데이터와 정확히 연결하려면 업소명·주소 문자열 매칭에 의존해야 한다. 범위는 여수시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
