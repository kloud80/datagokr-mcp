description_portal: 한국가스공사의 도시가스 산업용 월별 상대가격지수 데이터 입니다. 산업용 도시가스 수요분석 및 가격경쟁력 평가, 대체연료 전환 분석, 산업 에너지 정책 지원을 목적으로 수집되었습니다. 데이터 구성항목은 2007년 1월부터 2022년 9월까지의 연월일, 가스가격, 오일가격, 상대가격으로 이루어져 있어 도시가스와 유류의 가격 경쟁력을 비교 분석할 수 있습니다. 본 데이터를 활용하면 월별 상대가격 추이 분석, 가스가격과 유가의 변동 비교, 상대가격 변화에 따른 산업수요 영향 분석, 유가변동시 연료전환 패턴 파악, 산업용 연료 경쟁력 분석이 가능합니다.또한 가격경쟁력 평가, 산업용 수요예측 모델 개발, 요금정책 수립 기초자료, 연료간 대체효과 분석에 활용됩니다. 산업용 도시가스의 가격경쟁력 분석에 기초자료로 활용됩니다.
