summary_user: 한국가스공사가 산출한 산업용 도시가스의 월별 상대가격지수를 전국 단위 시계열로 담은 집계 파일이며, 포털 설명상 2007년 1월부터 2022년 9월까지 월별 가스가격·비교 연료 가격·상대가격을 담는다. 에너지 분석가나 산업체 담당자가 '유가가 오를 때 산업용 도시가스의 가격경쟁력이 어떻게 변했고 연료 전환 유인이 생겼는가'를 따질 때 쓴다. 전역 조인 키는 없으므로 연월일 필드를 기준으로 다른 월별 유가·산업용 가스 판매량 시계열과 날짜를 맞춰 이어 쓴다.
limits: 전국 단일 비공간 집계라서 지역별·업종별·사용자별 가격 차이는 볼 수 없다. 포털 설명은 오일가격이라 적었지만 실제 필드명은 LPG가격이므로, 비교 대상 연료와 단위는 원문에서 확인한 뒤 해석해야 한다. 공통 코드 키가 없어 다른 데이터와는 날짜로만 맞춰 연결한다.
