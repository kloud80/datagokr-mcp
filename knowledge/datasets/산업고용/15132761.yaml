summary_user: 대구창업허브(DASH) 홈페이지에 게시된 창업지원사업 공고를 공고 한 건당 한 행으로 담은 CSV 파일로, 사업명·지원분야·대상·지원기관·접수기간·업력·연령 조건과 간단소개·등록일을 포함한다. 예비창업자나 초기 창업자가 '지금 내 업력과 나이로 신청할 수 있는 사업화 자금·멘토링·공간 지원 공고가 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 사업명 같은 이름 매칭으로만 연결하며, K-Startup·기업마당 등 다른 지원사업 공고 목록과 사업명 기준으로 대조해 쓴다.
description_portal: 대구창업허브(DASH) 홈페이지 지원사업공고 목록입니다.  각 창업지원기관에서 공고하는 다양한 창업지원사업 정보(사업명, 지원분야, 지원대상, 지원기관 등)를 제공합니다.창업을 준비하는 예비창업자 지원사업, 시제품 제작 및 마케팅 등 활용 가능한 사업화 자금 지원, 전문가 경영·기술 지도와 관련된 멘토링/컨설팅 지원, 창업에 필요한 교육 프로그램, 창업보육을 위한 시설/공간 관련 창업지원사업을 안내하고 있습니다. 그밖에 판로 해외진출, 정책자금, 네트워크 행사, 공모전 등의 지원사업도 안내합니다.
