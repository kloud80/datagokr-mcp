description_portal: '한국남동발전의 1천만원 이상 계약현황 및 대가지급 데이터 입니다.매년 4월 작년에 체결된 계약명, 계약금액, 낙착율, 업체명, 계약 방법 등의 정보를 포함하고 있습니다.○ 구분 : 공사, 구매, 용역○ 계약명, 업체명, 대표자, 담당부서○ 계약일자(YYYY-MM-DD)○ 계약금액(단위 : 원)(VAT 포함)○ 낙찰율 : 예산대비 낙찰율(단위 : %)해당 데이터를 활용하여 공사, 용역, 물품 등 계약 분류별 낙찰률을 통해 경쟁 입찰에 따른 예산 집행의 효율성과 투명성을 파악할 수 있습니다.* 한국남동발전 사이트 → 정보공개 → 사전정보공표 → 계약구매 분야에서도 확인할 수 있습니다.※ 단, 1천만원 이상 공사, 용역, 물품 계약현황 중 수의계약 제외'
