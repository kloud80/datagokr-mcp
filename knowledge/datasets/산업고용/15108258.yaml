description_portal: 「해상운임 보전사업 지원기업 현황」은 2021년 12월 기준으로 해상운임 보전사업을 통해 지원받은 국내 중소기업의 현황을 정리한 데이터입니다. 기업의 소재지, 업종, 주요 수출품목 정보 등을 포함하고 있으며, 코로나19 등 물류비 부담이 급증한 상황에서 정부가 추진한 해상운임 보전을 통해 수출기업의 물류비 절감과 해외시장 진출을 지원한 사례를 담고 있습니다. 본 데이터는 업종별·품목별 지원기업의 분포를 확인하고, 해상 물류지원 정책의 효과성을 분석하는 데 활용할 수 있습니다. 또한 정책 담당자와 연구자는 이를 토대로 해상운임 지원의 파급효과를 검증하고, 중소기업 수출활동 촉진 및 국제 물류정책 개선 방향을 마련하는 데 유용한 기초자료로 쓰일 수 있습니다.
