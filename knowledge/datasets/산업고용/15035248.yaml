summary_user: 경상남도 의령군 안의 세탁업소를 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·소재지 주소·전화번호·영업장 면적·영업개시일·영업시간·데이터기준일을 담는다(파일 크기 825바이트의 소규모 목록). 주민이나 창업 예정자가 '의령군에 세탁소가 어디에 몇 곳 있고 언제 문을 열며 규모는 어느 정도인가'를 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 세탁업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 데 쓴다.
limits: 사업자번호·좌표·업종코드 같은 공통 키가 없어 다른 데이터와 정확히 연결하려면 업소명·주소 문자열 매칭에 의존해야 한다. 범위가 의령군 한 곳뿐이라 시군 간 비교에는 다른 지자체 자료를 따로 모아야 한다.
