summary_user: 2016~2021년 기간의 전력거래량을 연도와 시간대(시간)별 평균값(MWh)으로 집계한 전국 단위 파일로, 건별 거래 원천이 아니라 연도×시간 평균표이며 csv 용량은 약 2.6KB로 작다. 에너지 분석가나 연구자가 '하루 중 어느 시간대에 전력거래량이 가장 많고, 그 패턴이 연도별로 어떻게 달라졌나'를 볼 때 쓴다. 전역 조인 키가 없어 다른 전력 수급·SMP·시간별 발전량 데이터와는 연도·시간 값을 직접 맞춰 붙여야 한다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2016~2021년도의 시간대별 평균 전력거래량을 나타냅니다.*단위 : MWh※ 전력거래량은 수정정산으로 인해 값이 변경될 수 있습니다.'
