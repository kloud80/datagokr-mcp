summary_user: '인천광역시 관내 석유판매업소 가운데 품질검사에서 위반이 확인된 업소의 행정처분 현황을 업소별 건 단위로 담은 파일(CSV, 약 24KB)이다. 상호, 판매업 구분(회사구분), 시료 채취일자, 제품 종류, 판정결과를 담고 있어, 시민이나 분석가가 "인천에서 가짜·품질부적합 석유로 적발된 주유소·판매소는 어디이고 어떤 제품에서 걸렸나"를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 인허가번호 같은 공통 조인 키가 없어서, 다른 데이터와는 상호 이름 매칭으로만 붙인다(예: LOCALDATA 석유판매업 인허가 원장이나 오피넷 주유소 정보).'
limits: 전역 조인 키가 없다. 그래서 다른 업소 원장과 연결하려면 상호 이름을 맞춰 보는 방식에 기대야 하고, 동명 업소가 섞여 오매칭될 수 있다. 위반업소 목록만 담고 있어 검사받은 전체 업소나 적합 판정 건수는 알 수 없다.
