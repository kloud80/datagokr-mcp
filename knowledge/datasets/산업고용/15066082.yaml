summary_user: 한국가스공사가 평년기온(1991~2020년, 서울 기준) 대비 기온이 변할 때 도시가스 수요가 얼마나 반응하는지를 1월부터 12월까지 월별 민감도(%)로 담은 작은 집계표(CSV 745바이트)로, 범위는 전국·비공간이다. 가스 공급사나 에너지 분석가가 '이번 겨울 평년보다 기온이 낮으면 몇 월의 도시가스 수요가 얼마나 늘어날까'를 따질 때 수요예측 모델의 기온변수 보정값으로 쓴다. 전역 조인 키가 없어 다른 데이터와는 월(1~12월) 기준으로 기상청 기온 편차나 월별 가스 공급·판매량 자료와 맞춰 붙여 쓴다.
description_portal: 한국가스공사의 도시가스 수요 월별 기온 민감도 데이터 입니다.기온변화에 따른 도시가스 수요 변동 분석 및 수요예측 모델 개발, 기상리스크 관리, 공급계획 수립을 목적으로 수집되었습니다. 데이터 구성항목은 1월부터 12월까지 월별 기온 민감도(% 단위)로 이루어져 있으며, 평년기온(1991~2020년, 서울 기준) 대비 기온이 변동됨에 따라 도시가스 수요가 반응하는 정도를 나타냅니다. 본 데이터를 활용하면 월별 기온 민감도 패턴 분석, 계절별 수요 변동성 파악, 이상기온시 수요 영향 예측, 기온민감도 기반 리스크 분석, 난방/냉방 시즌별 민감도 비교가 가능합니다. 또한 수요예측 모델의 기온변수 보정, 피크 수요 예측, 공급계획 수립, 기상시나리오별 수요 전망에 활용됩니다. 도시가스 수요예측의 정확도 향상에 기초자료로 활용됩니다.
