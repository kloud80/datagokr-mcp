description_portal: '국민 실생활에 도움이 되는 데이터를 제공하고자, 소비자에게 우수하고 안전한 제품선택이 가능하도록 KGS 제품 인증 현황을 제공합니다.해당 데이터는 인증업체명, 사업자번호, 품명(타이머부착콕개폐기, 가스용금속플렉시블호스보호관, 신속이음쇠부착호스), 모델명, 인증번호, 최초 인증일, 인증기간 등으로 구성되어 있습니다.※ KGS제품인증 : 국가기술표준원의 한국제품인정기구(KOLAS)로부터 공인제품인증기관으로 인정받아 운영하는 인증제도로서, KS Q ISO/IEC 17065에 따라 법정검사대상 이외의 가스관련 제품에 대해 적합성 평가를 통해 제품인증 업무-데이터 기준일자: 2021년 9월 30일'
