summary_user: 전국 지자체가 관리하는 계량기제조업 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 전체 963건이 1967-04-28부터 2026-09-23까지의 인허가일자를 포함한다. 계량기 제조업소의 영업 상태(영업·휴업·폐업)와 소재지를 확인하려는 분석가나 사업자가 특정 지역에 어떤 업소가 등록돼 있는지 찾을 때 쓴다. 지번주소·도로명주소(address 키)와 관리번호(pnu 키)로 다른 주소 기반 데이터와 이어 쓰고, 좌표(X·Y)는 지도 표시에 쓴다.
description_portal: '자원환경_계량기제조업 데이터는 계량을 하기 위한 기계·기구 또는 장치를 제작하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 계량기제조업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상자원부 국가기술표준원 계량측정제도과 / 043-870-5512 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
