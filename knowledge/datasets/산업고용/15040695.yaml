summary_user: 국가기술표준원 제품안전정보센터에서 안전성 결함이나 기준 위반으로 국내 리콜 조치된 제품 사례를 건별로 모은 CSV 파일(약 216KB)로, 안전기준 위반 내용·표시사항 부적합 내용·사고사례 내용을 담는다. 소비자나 유통 사업자가 '내가 쓰거나 파는 제품이 어떤 안전기준 위반이나 사고 때문에 리콜됐나'를 확인하거나, 분석가가 리콜 사유 유형을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제품명·업체명 같은 이름 매칭으로만 이어 쓸 수 있고, 최신 리콜은 같은 기관의 '제품 안전인증 및 리콜 정보' API와 함께 본다.
description_portal: '국가기술표준원이 운영하고 있는 제품안전정보포털(센터)에서 제공되는 제품안전과 관련된 국내리콜 보고서 정보를 제공합니다. 국내리콜 보고서 데이터는 시중에 유통되는 각종 제품 중 안전성 결함이나 기준 위반 등이 확인되어 리콜 조치가 이루어진 사례를 종합한 자료입니다. 해당 데이터에는 국내 리콜 정보가 포함되어 있으며, 소비자가 위험 제품을 신속히 파악하고 사용을 중단하거나 교환, 수리를 받을 수 있도록 지원합니다.* 다만, 해당 정보는 API(API 데이터 목록명: 산업통상자원부 국가기술표준원_제품 안전인증 및 리콜 정보)로 제공되고 있는 바, 최근 데이터 수정일 이후 최신 정보를 확인하시고자 하는 분들은 API 데이터를 활용해주시길 바랍니다.'
