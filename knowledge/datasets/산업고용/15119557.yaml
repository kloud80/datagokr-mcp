description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 연도별, 세부사업별 사업비 지원 현황을 집약한 공공 데이터입니다. KETEP은 국가 에너지 기술 혁신을 선도하는 기관으로서, 다양한 세부 사업을 통해 에너지 R&D 과제를 지원하고 있습니다. 본 데이터는 이러한 사업별 투자 규모를 객관적인 수치로 보여줌으로써, 에너지 R&D 정책 및 동향 분석에 필요한 기초 자료를 제공합니다.제공되는 정보는 2012년부터 2022년까지 11년간 KETEP이 관리한 세부사업들을 대상으로, 각 사업별로 연도별 지원된 총 사업비(단위: 억원)를 포함합니다.'
