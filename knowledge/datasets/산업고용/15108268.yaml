summary_user: 제주 지역 태양광·풍력 발전의 출력제어 횟수와 풍력 제어량(MWh)을 2024년 6월 30일까지 일자별로 집계한 파일이며, 받은 CSV는 56바이트로 일자와 횟수 두 컬럼만 담고 있다. 제주에서 신재생 발전사업을 하거나 검토하는 사업자, 계통 분석가가 '제주에서 출력제어가 언제, 얼마나 자주 발생했나'를 확인할 때 쓴다. 전역 조인 키는 없어 일자를 기준으로 전력 수급·시장 데이터와 날짜 단위로 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 24년6월30일까지의 제주 태양광 제어횟수, 제주 풍력 제어량 및 제어횟수 데이터입니다. * 단위 : 건, MWh※발전제어량은 제어대상 설비의 차단시점 발전량을 차단시간으로 환산한 값으로 기상상황, 지리적 위치, 설비의 성능에 따라 유동적이므로 단순 참고 사항임을 알려드립니다.※태양광 제어량은 별도 산정하고 있지 않습니다.※날짜가 비어있는 부분은 데이터 누락이 아닌 제어가 발생하지 않은 것입니다.※24년 6월의 경우 풍력은 출력제어가 발생하지 않았습니다.'
