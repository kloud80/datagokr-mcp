summary_user: 전라남도 강진군에서 허가받은 태양광 발전소를 한 건씩 담은 원장으로, 허가일자·상호·설비용량(킬로와트)·설치장소(지번, 건물 위·토지 위 구분)·사업개시일을 기록한다(CSV 약 113KB). 군 안에서 언제, 어디에, 어느 규모의 태양광 발전소가 늘었는지 알아보려는 주민·사업자·지역 에너지 분석가가 쓴다. 전역 조인 키는 없으므로 전국 태양광발전소 전기사업허가정보 표준데이터 같은 발전소 단위 원장과는 상호·설치장소 주소를 직접 맞춰 이어 써야 한다.
description_portal: '전라남도 강진군의 태양광 발전 설치 현황은 다음과 같은 항목별로 정리된 데이터로 제공됩니다: 허가일자, 상호, 설비용량(킬로와트), 설치장소, 사업개시일, 그리고 데이터 기준일자입니다.허가일자는 각 태양광 발전소의 설치 허가가 공식적으로 이루어진 날짜 및 고유번호를 포함하고 있습니다상호는 태양광 발전소의 명칭을 나타냅니다.**설비용량(킬로와트)**는 각 발전소의 태양광 설비가 생산 가능한 전력량을 킬로와트 단위로 표시하며, 10kW 미만의 소규모 발전소부터 45kW 규모의 발전소까지 다양합니다.설치장소는 강진군 내의 실제 위치로, 구체적인 지번 정보까지 포함되어 있습니다. 일부는 ‘건물 위’, 일부는 ‘토지 위’로 설치 형태까지 구분되어 기재되어 있습니다.사업개시일은 해당 태양광 발전소가 실제로 운영을 시작한 날짜입니다.이 데이터를 활용하면 강진군 내 태양광 사업의 성장 추이, 지역별 분포, 규모별 투자 흐름 등을 파악할 수 있으며, 재생에너지 정책 수립이나 지역경제 분석에도 활용 가능합니다.'
