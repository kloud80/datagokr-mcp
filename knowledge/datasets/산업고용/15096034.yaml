summary_user: 충청남도 계룡시 관내에 등록된 당구장 업소를 업소 한 곳당 한 건씩 담은 원천 목록으로, 시군명·구분·업종·상호·시설 주소를 담는다. 시민이나 상권 분석가가 계룡시 안에 당구장이 어디에 몇 곳 있는지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 이름으로 맞추거나 같은 기관 코드로만 연결한다.
limits: 계룡시 한 곳의 업소 개별 목록이라 다른 시군구와 비교하려면 지역별 데이터를 따로 모아야 한다. 사업자번호나 표준 코드 같은 공통 키가 없어 인허가·상가 데이터와 붙일 때는 주소·상호 매칭에 기댄다.
