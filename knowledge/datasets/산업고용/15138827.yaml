summary_user: 경상남도 김해시에 소재한 승강기 유지관리업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·유지관리업 구분·연락처·지번/도로명 주소·위도·경도를 포함한다(CSV 968바이트의 소규모 목록). 김해시의 아파트 관리사무소나 건물주가 "우리 동네에서 승강기 유지보수를 맡길 수 있는 업체가 어디인가"를 찾을 때, 또는 분석가가 지역 승강기 관리업체 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 업체명·주소로 맞추거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: '경상남도 김해시에 소재한 승강기 유지관리업체 현황 데이터로 업체명, 유지관리업 구분, 연락처, 지번주소, 도로명주소, 위도, 경도의 항목으로 구성되어있습니다.해당 데이터의 데이터 기준일자는 2025년 11월 21일로, 연간 주기로 관리하고 있습니다.* 해당 데이터는 개인정보 보호 및 데이터 미집계 등의 사유로 공란이 많으니 참고 부탁드립니다.데이터 담당부서 : 김해시 시민안전과(055-330-0975)[데이터 변동 안내]1. 승강기 유지관리업 구분 추가2. 승강기 유지관리업 정보 최신화'
