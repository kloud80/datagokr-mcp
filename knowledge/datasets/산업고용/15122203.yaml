description_portal: 이 데이터는 산업재해 보상 보험을 운영하는 공공기관이 보험 적용 범위를 관리하기 위해 집계한 연도별 산재보험 사업종류(대분류) 적용 현황에 대한 통계 자료입니다. 2015년부터 2025년까지 11개년 간의 데이터를 포함하며, 금융 및 보험업, 광업, 제조업, 건설업 등 주요 산업 분류별로 산재보험이 적용되는 사업장 수를 제공합니다. 이 자료는 국내 산업 구조 변화에 따른 산재보험 가입 현황의 추이를 명확하게 보여주며, 어떤 산업 분야에서 사회보험 적용 대상이 확대되거나 축소되고 있는지 파악하는 데 중요한 기초 정보를 제공합니다.본 데이터는 공공 정책 수립 및 학술 연구에 광범위하게 활용될 수 있습니다. 정책 입안자는 산업별 사업장 수의 변화와 고용 지표를 결합하여 산재보험의 사각지대를 해소하기 위한 정책 목표를 설정하고, 산업 안전 관리의 우선순위를 정하는 데 활용할 수 있습니다. 또한, 연구자는 이 자료를 바탕으로 특정 산업의 성장 및 위축이 사회보험 시스템에 미치는 영향을 분석하고, 산업별 노동 시장의 안정성을 평가하는 데 기여할 수 있다고 판단됩니다.
