summary_user: 전국 시도별로 주유소 가운데 정유사 직영과 자영 주유소가 차지하는 비율을 담은 집계 통계 파일(csv, 388바이트)로, 건별 주유소 원천이 아니라 지역 단위 요약값이다. 분석가나 사업자가 '우리 시도는 정유사 직영 주유소 비중이 다른 지역보다 높은가'처럼 지역별 석유 유통 구조를 비교하는 질문에 쓴다. 전역 조인 키가 없어 시도명(구분)을 기준으로 다른 시도별 통계와 이름 매핑으로만 이어 쓰며, 주유소 ID·좌표가 있는 전국주유소표준이나 오피넷 유가 데이터와는 직접 연결되지 않는다.
description_portal: 이 데이터는 전국 시도별로 운영되는 주유소 가운데 직영 주유소가 차지하는 비율을 체계적으로 제시한 통계 자료입니다. 제공 항목은 시도명과 직영 주유소 비율(%)이며, 이를 통해 지역별 석유 판매 구조의 차이를 구체적으로 파악할 수 있습니다. 해당 데이터는 에너지 산업의 유통 구조 분석, 지역 간 유가 차이 원인 규명, 정유사의 직영 운영 전략 평가와 같은 연구에 활용할 수 있으며, 공공기관의 합리적인 에너지 정책 수립, 민간 기업의 입점 전략 및 마케팅 기획, 소비자의 주유소 선택 판단 근거 등 다양한 영역에서 실질적 참고자료로 기능합니다. 또한 지역별 시장 구조의 불균형 해소, 직영 확대 정책의 효과 검토, 나아가 지속 가능한 유통 체계 마련에도 중요한 기초자료가 될 수 있습니다.
