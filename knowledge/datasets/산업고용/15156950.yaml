summary_user: 한국중부발전 발전소의 온배수 배출량을 연월·발전소·호기 단위로 담은 집계 데이터로, 발전소명(pptnm)·호기명·사용량 항목을 제공한다. 발전소 주변 수질이나 해양 환경을 살피는 분석가가 특정 발전소 호기에서 어느 달에 온배수가 얼마나 나왔는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매핑이나 같은 기관의 다른 배출 측정 데이터와만 이어 쓰며, 주변 기상·환경 데이터와 발전소 단위로 맞대어 볼 수 있다.
