summary_user: 중소벤처기업진흥공단의 투자조건부융자를 받은 업체를 업체 한 곳씩 담은 전국 단위 파일로, 지원연도·업종·지역·종업원규모·매출규모·업력·지원금액(백만원)이 들어 있다. 정책 분석가나 투자 유치 기업이 '선투자를 받은 중소기업 중 어떤 업종·지역·업력의 기업이 얼마를 융자받았나'를 확인하는 데 쓴다. 공단 내부 업체번호(sbc_fund_company_no)가 유일한 키이며, 사업자번호는 없어서 다른 기업 인증·확인 데이터와 바로 연결하기는 어렵고 같은 업체번호를 쓰는 공단 정책자금 현황 자료와 주로 이어 쓴다.
description_portal: 동 데이터는 2025년 투자조건부융자 지원 업체의 업종, 지역, 매출규모, 지원금액 등의 지원 현황 자료를 제공합니다.투자조건부융자는 전무투자기관(조합)으로부터 신청일 이전 24개월이내 1억원 이상 선투자 받은 중소기업을 대상으로 신주인수권부 융자를 지원하는 상품이며, 운전자금을 연간 20억원 이내 한도로 지원하고 있습니다. 지원받은 기업은 후속투자 유치 시 투자유치금의 20%(최대 대출금의 20%)를 3개월 내 조기상환 해야 합니다. 신주인수권의 취득규모는 융자 총액의 5%이며, 대출금이 전액 상환된 후 신주인수권은 소멸됩니다.
