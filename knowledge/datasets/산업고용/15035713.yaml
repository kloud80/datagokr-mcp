description_portal: 서울특별시 중랑구의 건설현장시공정보 데이터입니다. 주요 항목으로는 대지위치, 대지면적, 허가일, 착공처리일, 착공예정일, 주용도, 설계사무소,  등이 있습니다. 데이터는 허가일 기준으로 1990년대부터 2025년까지 있습니다. 데이터기준은 2025년 6월입니다. 데이터 내용의 대지위치는 주소이며 대지면적, 건축면적, 연면적은 제곱미터로 제공됩니다. 주용도의 경우 단독주택, 문화및집회시설, 공동주택, 제1종근린생활시설, 제2종근린생활시설, 위험물저장및처리시설, 창고시설, 교육연구및복지시설, 판매및영업시설 등이 있습니다. 자세한 내용은 파일을 다운로드 받아 확인하여 주시기 바랍니다. 감사합니다.
