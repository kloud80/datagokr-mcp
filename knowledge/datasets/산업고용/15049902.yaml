summary_user: 한국가스공사 지역본부(서울·경기·강원·대전충청·전북·광주전남·대구경북·부산경남)별로 발전용과 도시가스용 천연가스(LNG) 공급량을 연·월 단위 톤으로 집계한 csv 파일이다. 분석가가 "어느 지역본부에서 발전용 대비 도시가스용 공급 비중이 커졌는가" 같은 지역별 가스 수요 구조와 추이를 볼 때 쓴다. 전역 조인 키는 없어 년도·월과 지역본부 이름을 맞춰 다른 에너지 사용량·지역 통계와 붙여야 한다.
description_portal: 각 년도별 지역본부의 용도별(발전공급량,도시가스공급량)가스 공급량을 보여주는 자료이며, 전국에 편재한 각 지역본부 별 가스공급 점유율을 표시한 자료 입니다.해당 지역은 서울, 경기, 강원, 대전충청, 전북, 광주전남, 대구경북, 부산경남 (공사 소재 지역본부 기준)으로 분류하였습니다.한국가스공사의 지역본부별 용도별 전국 천연가스(LNG) 공급량을 나타낸 자료이며, 해당 자료의 단위는 톤(ton)입니다. 공공데이터 공개 대상 자료는 2019년도 1월부터 현재까지의 기간동안 한국가스공사 지역본부별 용도별 전국의 천연가스(LNG) 공급량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일입니다.
