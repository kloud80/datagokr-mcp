summary_user: 한국수력원자력이 운영했던 강릉수력(도암댐)의 2020~2024년 수질 측정 결과를 분석날짜·측정지점(댐 1·2·3 지점과 하류)별로 담은 CSV 파일(약 40KB)로, 수온·pH·용존산소·전기전도도·부유물질·BOD·COD·총유기탄소·클로로필a·총질소·총인 수치를 담는다. 도암댐과 그 하류의 수질이 연도·계절에 따라 어떻게 변했는지, 부영양화 지표(총질소·총인·클로로필a)가 높아지는 시기가 언제인지 확인하려는 지역 주민·환경 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 수질·기상 자료와는 측정 날짜(수질분석날짜)와 지점명을 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 한국수력원자력㈜이 공개하는 강릉수력(도암댐) 수질자료에 대한 데이터입니다. 한국수력원자력에서 운영했던 강릉수력(도암댐)의 수질에 관한 2020년도부터 2024년도의 자료입니다. 해당 데이터는 도암댐의 1,2,3 및 하류 검사 결과를 보여주고 있으며 수질분석날짜에 따른 수온, pH, 용존산소량(BOD), 전기전도도(EC), 부유물질(SS), 생물학적 산소요구량(BOD), 화학적 산소요구량(COD), 총유기탄소량(TOC), 클로로필에이(Chla), 총질소(TN), 총인(TP)들의 다양한 수치 정보 또한 포함하여 개방하고 있습니다.
