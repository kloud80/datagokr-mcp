description_portal: '본 데이터는 한국가스공사의 동절기(12월~익년 2월) 도시가스 공급량 정보를 제공합니다. 동절기 난방수요 분석과 피크수요 전망을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 연도, 전국 공급량, 수도권·충청권·대경권·호남권·동남권 지역별 공급량(단위: ton) 등이 포함되어 있습니다. 동절기는 난방수요 증가로 천연가스 피크수요가 발생하는 시기입니다. 본 데이터는 도시가스사업자, 수급계획 담당자, 에너지경제연구원, 기상연구기관, 정책 연구자, 산업통상자원부가 연별 도시가스 피크수요 전망의 추세분석에 활용할 수 있으며, 안정적 동절기 가스 공급에 기여합니다.'
