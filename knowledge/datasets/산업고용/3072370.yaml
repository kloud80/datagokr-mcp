description_portal: 해당 데이터는 「장애인고용촉진 및 직업재활법」 제33조, 제33조의 2에 따라 월 평균 상시근로자 100명 이상을 고용하는 장애인고용의무 사업주가 의무고용 미이행 시 신고납부한 데이터로, 지역별·업종별 장애인고용의무 사업주의 장애인고용부담금 신고 현황을 연도별로 제공하고 있습니다. 장애인고용부담금은 민간사업주, 국가기관 및 지방자치단체의 장, 교육감, 공공기관 및 지방공기업의 장 모두 신고 대상이며 특정 월의 상시근로자 수가 100명 미만이더라도 월 평균 상시근로자가 100명 이상이면 신고 대상입니다. 상시근로자란 매월 임금지급의 기초가 되는 날이 16일 이상인 근로자로 소정근로시간이 60시간 미만인자(중증장애인 제외)는 제외됩니다.
