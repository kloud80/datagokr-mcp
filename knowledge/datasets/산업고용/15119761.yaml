summary_user: 만 15세 이상 취업자를 응답자 단위로 조사한 근로환경조사의 원시자료로, 응답자 한 명이 한 행이며 가중치·지역·성별·연령, 고용형태, 근무일 수·출퇴근 시간·야간·일요일 근무, 유해요인 노출, 건강 문제, 업종(ind)·직업(occ) 응답을 담는다(전국 범위, zip 약 12.5MB). 연구자나 정책 분석가가 "야간·장시간 근무를 하는 노동자에게 수면 문제나 근골격계 통증 같은 건강 문제가 더 많은가"처럼 근로조건과 건강의 관계를 가중치를 적용해 분석하는 데 쓴다. 실측 컬럼에서 다른 데이터와 바로 붙는 공통 조인 키는 찾지 못했으며, 업종·직업 코드를 분류표와 이름·코드로 맞추는 방식으로만 다른 데이터와 연결한다.
description_portal: 근로환경조사는 노동자의 안전과 건강 문제를 해결하고, 근로환경 개선을 위한 정책 수립의 기초자료를 마련하기 위해 도입되었습니다. 산업안전보건연구원은 만 15세 이상 취업자의 다양한 고용․노동 환경에 대한 자료를 수집하고자 근로환경조사를 3년마다 실시하고 있습니다.해당 자료는 통계청의 승인을 거쳐 실시되는 조사입니다.근무일 수, 출퇴근 시간, 밤 근무 여부, 일요일 근무 여부 등에 대한 칼럼을 제공하고 있습니다.자료이용 설명서와 문항목록표를 활용하여 사용하시기 바랍니다.
