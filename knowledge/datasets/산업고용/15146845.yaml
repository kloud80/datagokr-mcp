summary_user: 한국가스기술공사 연구관리시스템에 등록된 연구개발 제안을 제안 1건당 한 행으로 담은 원천 파일(csv, 약 7.5KB)로, 제안연도·제안명·상위/하위 연구분야 코드·제안일자·종료일자·총예산·민간부담을 담는다. 공사 R&D 동향을 보는 분석가가 연도별로 어떤 연구분야에 제안이 몰렸고 총예산과 민간부담 규모가 어느 정도였는지 확인하는 데 쓴다. 제안고유번호와 시스템제안번호가 같은 제안 식별 키(kgt_rnd_proposal_no)로 잡혀 있어, 같은 공사의 다른 연구관리시스템 파일(과제·성과 등)과 이 번호로 잇는다.
description_portal: 이 파일은 한국가스기술공사의 연구개발 제안(R&D Proposal) 정보를 정리한 자료로, 각 제안의 기본정보와 예산현황, 추진상태 등을 연도별로 확인할 수 있다. PROPSE_ID는 제안 고유식별번호이고 PROPSE_YR은 제안이 이루어진 연도이다. PJT_NM은 연구 또는 개발 프로젝트의 명칭이며 RSCH_REALM_UPR_CD와 RSCH_REALM_CD는 상위 및 세부 연구분야 코드이다.  TOT_BUDGT와 PRTINT_BUDGT는 총예산 및 민간분담금 등 예산규모를 보여준다. 이 데이터는 제안현황 분석, 연구분야별 예산배분, 과제추진 현황 파악 등 다양한 내부경영 및 전략수립 목적에 활용될 수 있다.
