description_portal: 본 데이터는 연도와 부처를 기준으로 연구개발 및 관련 사업의 예산 현황과 재원 분담 구조를 함께 집계한 CSV 통계 자료입니다. 각 부처별로 투자 규모가 어떻게 형성되는지 확인할 수 있으며, 같은 항목 내에서 정부지원금과 민간부담금, 지자체부담금이 구분되어 제공되어 재원의 구성 비율과 변화 양상을 비교할 수 있습니다. 즉, ‘얼마를 집행(또는 편성)했는지’뿐 아니라 ‘어떤 주체가 어떤 방식으로 부담했는지’를 연도별로 함께 파악할 수 있도록 설계된 자료입니다.이 자료를 활용하면 부처별 예산 규모의 증감과 더불어 정부·민간·지자체 분담금이 어떤 방향으로 변하는지 살펴볼 수 있어, 공공 재정 투입의 흐름과 협력 구조를 점검하는 데 도움이 됩니다. 정책 담당자는 부처별 재원 구조를 비교해 부담 주체 간 역할 분담이 어떻게 나타나는지 참고할 수 있고, 예산 운용 평가에서는 분담금 항목의 변화가 특정 정책 기조나 사업 운영 방식과 함께 나타나는지 검토하는 기초 통계로 활용할 수 있습니다. 연구자·분석가는 연도별 수치를 기반으로 부처 간 투자 규모 차이, 민간 참여 수준의 변화, 지자체 재정 참여의 추이 등을 정리할 수 있으며, 필요한 경우 분담금 비중(구성비)이나 부처별 총액 대비 부담 구조 같은 파생 지표를 산출해 비교 분석을 확장할 수 있습니다.
