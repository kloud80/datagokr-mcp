summary_user: "한국수력원자력이 운영하는 연료전지 출자회사 8곳(인천연료전지, 경기그린에너지 등)과 자체사업(포항에너지파크, 숲 발전소)의 발전설비별 시설용량(MW)과 2021~2025년 연간 발전량(MWh)을 담은 설비 단위 집계 파일입니다(CSV 647바이트 규모의 소형 표). 에너지 분석가나 연구자가 '한수원 연료전지 발전소별 설비용량 대비 연간 발전량이 어떻게 변해 왔나'를 확인할 때 씁니다. 전역 조인 키가 없어 다른 발전소 원장(예: 전국태양광발전소전기사업허가정보 표준데이터)과는 발전설비 이름을 직접 맞춰 이어 써야 합니다."
description_portal: '한국수력원자력(주)의 운영 중인 연료전지 출자회사 및 자체사업의 발전설비 시설용량과 연도별 생산실적(2021년~2025년) 정보를 제공합니다.각 항목별 데이터는 매년 1월 1일부터 12월 31일 까지 측정된 연간 총 발전량 실적 데이터를 차년도에 검증 이후 제공하는 데이터입니다.○ 측정단위: 발전소의 시설용량은 MW, 발전량은 MWh ○ 대상연도: 2021년~2025년○ 대상회사  - 출자회사: 인천연료전지(주), 경기그린에너지(주), 노을그린에너지(주), 부산그린에너지(주), 창원에스지에너지(주), 고덕청정에너지(주), 강릉사천연료전지(주), 춘천그린에너지(주)  - 자체사업: 포항에너지파크, 숲 발전소'
