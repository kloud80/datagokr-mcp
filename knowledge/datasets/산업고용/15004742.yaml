description_portal: 본 데이터는 2010년부터 2020년까지 연도별 소량핵물질 국내 이용기관 수 추이를 나타낸 데이터입니다. 소량핵물질은 연구, 의료, 산업용 등 다양한 분야에서 사용되며, 이를 활용하는 기관의 수 변화를 통해 국내 핵물질 이용 환경과 안전 관리 현황을 파악할 수 있습니다. 데이터는 각 연도별로 소량핵물질을 사용하는 기관 수를 기록하고 있어, 이용 기관의 증감 추이, 특정 기간의 이용 집중도, 신규 이용 기관의 도입 현황 등을 분석할 수 있습니다.연관데이터는 다음과 같습니다. - 소량핵물질 이용기관 현황- CTBTO IMS 구축 현황- 국내 안전조치 대상시설 현황- 핵실험탐지 국내 관측소 및 장비 현황- 연도별 사전판정 신청건수 대비 전략물자 판정비율- 연도별 사전판정, 수출허가, 핵물질수출입요건 확인 심사 현황- 연도별 사찰량 및 국가검사량 추이- 연도별 원자력통제교육 이수자 현황- 핵물질 종류별 연도별 운반검사 건수
