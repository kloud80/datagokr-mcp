description_portal: 한국전력공사와 기상청이 공동주택 부하관리관련 연구개발 활성화를 목적으로 제공하는 데이터셋입니다. 데이터셋은 기상청 동네예보 격자단위 시간대별 공동주택 전력부하와 기상관측값을 포함하고 있습니다.공동주택 전력부하는 각 연도별 결측치가 없는 단지에 한하여 합계한 통계값이며, 격자내 공동주택이 10개 이상인 격자에 대해서만 제공하고 있습니다. 본 자료는 한전과 기상청이 공동개발한 기상변화에 따른 공동주택 전력부하예측지수 「전력기상지수」 개발에 활용된 데이터셋이며, 향후 전력기상지수도 함께 제공될 예정입니다.
