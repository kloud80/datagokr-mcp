description_portal: 본 데이터는 한국남부발전(주) 사업소별 발전실적 파일데이터입니다.본 데이터는 한국남부발전(주)의 각 사업소별(하동, 영월, 안동, 신인천, 삼척, 부산, 남제주 빛드림본부 등)로 2021년부터 2025년까지 각 연도별과 발전원별(석탄, 복합, 중유 등) 세부 발전량(kWh 단위)을 포함하고 있습니다.해당 데이터를 활용하여 발전소의 세부 호기별 용량 대비 발전량을 분석할 수 있고, 각 발전원별 한국남부발전(주)의 발전량 비율을 파악하는데 활용할 수 있습니다.추가적으로 전력거래소 등의 자료와 결합하여 세부적인 분석을 위한 기초자료로 활용할 수 있습니다.
