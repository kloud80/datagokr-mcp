summary_user: 한국남부발전(주)의 하동·영월·안동·신인천·삼척·부산·남제주 빛드림본부 등 사업소(플랜트)별·호기별로 2021년부터 2025년까지 연도별 발전원(석탄·복합·중유 등), 설비용량, 발전량(kWh)을 담은 연간 집계 파일(CSV, 약 6KB)이다. 에너지 분석가가 "남부발전 삼척 석탄 호기의 용량 대비 연간 발전량은 몇 년 사이 어떻게 바뀌었나"나 "남부발전 전체 발전량 중 석탄과 복합의 비율은 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 전력거래소 등 다른 발전 자료와는 발전소명·호기명·연도를 직접 맞춰 이어 써야 한다.
