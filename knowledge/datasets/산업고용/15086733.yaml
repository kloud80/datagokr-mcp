description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 에너지 사용량이 2000toe 이상인 에너지다소비사업자들이 신고한 ‘요(窯)’ 설비의 에너지 사용현황을 지역별, 연도별, 부문별로 구분하여 제공합니다. ‘요(窯)’ 설비란 산업 현장에서 공정 가열 및 열처리 등을 목적으로 사용하는 열 설비로, 높은 에너지를 소비하는 설비를 지칭합니다. 해당 데이터는 다소비사업자가 보유한 요 설비의 에너지 사용량을 종합적으로 나타내고 있으며,이를 통해 정부와 지자체는 지역별 에너지 소비 특성 파악, 에너지 효율 향상 정책 수립 및 에너지 수요 관리에 활용할 수 있습니다.기업과 연구기관은 에너지 소비 트렌드 분석, 설비 효율 개선 및 비용 절감 전략 마련에 기초자료로 활용 가능합니다.
