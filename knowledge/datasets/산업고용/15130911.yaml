description_portal: '- 트루컴퍼니란 한국장애인고용공단과 연계하여 장애인고용 확대를 위하여 성실히 노력한 기업(관)에게 고용노동부 장관상을 수여하는 포상제도입니다.- 트루컴퍼니 포상 기업 명단은 장애인 고용에 모범적인 성과를 낸 기업들의 정보를 포함합니다. 장애인 고용 촉진을 위한 우수 사례와 기업의 사회적 책임 실천 현황을 보여주며, 장애인 근로환경 개선에 기여하는 기업들을 인증하고 포상합니다. 이를 통해 장애인 일자리 확대와 기업의 사회적 가치 증진을 장려합니다. 세부 문의사항은 한국장애인고용공단 고용컨설팅부로 부탁드립니다.'
