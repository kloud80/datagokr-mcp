summary_user: 서울 종로구에 있는 대규모점포의 인허가 정보를 점포(관리번호) 한 건씩 담은 원천 목록이다. 인허가일자·취소일자, 영업상태와 상세 상태, 폐업일자, 휴업 기간, 재개업일자, 소재지·도로명 주소, 사업장명, 업태명, 면적, 좌표를 함께 담는다. 상권 분석가나 소상공인이 '종로구에서 영업 중이거나 최근 폐업한 대규모점포는 어디인가'를 확인할 때 쓰고, 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어 지자체 코드(OPNSFTEAMCODE)·주소·사업장명 매칭이나 좌표로 소상공인 상가업소 등 상권 자료와 연결한다.
description_portal: 본 데이터는 서울특별시 종로구에 소재한 대규모점포의 인허가 정보를 정리한 공공데이터입니다. 수록 항목에는 지방자치단체 코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 유통산업발전법 제2조에 따른 대규모점포로 등록된 기업형 슈퍼마켓(SSM), 전문점, 복합상업시설 등에 대한 인허가 현황을 확인할 수 있습니다. 종로구는 대형마트나 백화점보다는 소규모 지역상권을 기반으로 한 전문 유통시설이 주를 이루고 있으며, 본 자료는 해당 업종의 등록 이력, 개설·폐업 현황, 영업상태 변동 등을 파악하는 데 활용됩니다. 또한 지역 내 유통질서 유지, 생활편의시설 균형 배치, 소상공인 상권 보호 등과 관련된 정책 수립을 위한 기초자료로 제공됩니다.
