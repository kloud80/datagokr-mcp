description_portal: 동 데이터는 2024년 ESG자가진단을 수행한 업체의 산업별(제조, 도소매, 서비스, 정보처리, 건설, 물류)로 참여기업 수, 비중(전체 대비), ESG수준(E,S,G 평균)을 나타내는 자료입니다.산업별 구분에 따라 ESG자가진단 수준을 확인할 수 있습니다.표준산업분류코드에 따라 업종이 분류되어 있으며 총 6개 지표로 구성됨(ESG 자가진단) ESG 자가진단 수행 기업에 대한 기업별 세부 현황에 대한 데이터로 제조업 세분류, 참여기업, 비중, ESG수준, 산업분류코드 등을 포함하고 있습니다.해당 조사는 2024.1.1부터 2024.12.31까지 중소벤처기업진흥공단의 ESG통합플랫폼을 통해 중소벤처기업들을 대상으로 자가진단을 수행하여 해당 내용을 조사한 내용입니다.
