description_portal: '월별 시도별 냉난방도일 통계현황은 1999년부터 2019년까지의 서울, 대전, 대구, 광주, 부산의 냉방도일(Cooling Degree Day) 및 난방도일(Heating Degree Day)을 정리한 데이터입니다.매일의 일평균기온과 기준 온도의 차이를 일별로 누적하여, 일평균기온이 기준 온도보다 높은 경우는 냉방도일로, 낮은 경우는 난방도일로 계산합니다.* 냉방도일 기준 온도: 24도, 난방도일 기준온도: 18도해당 자료는 천연가스 수요에 영향을 미치는 주요 요인인 기온 정보를 통해 월별 시도별 냉난방도일에 따른 천연가스 수요의 흐름을 파악하는 자료로 활용될 수 있습니다.'
