description_portal: 본 API는 한국남부발전(주) 연료도입실적조회 서비스_GW 입니다.한국남부발전(주)에서 도입하는 연료(석탄, LNG, 바이오 등)별 도입 실적을 조회할 수 있습니다. 월 단위로 종합된 자료를 제공하며 한국남부발전(주)_연료도입실적조회 서비스에 대한 데이터로 한국남부발전 발전소의 월별 연료도입실적 정보를 제공합니다.월별 도입실적 조회를 통하여 매월 한국남부발전(주)에서 전력생산을 위해 소비하는 연료별 양을 유추할 수 있습니다.또한 항목별(석탄, LNG 등) 도입량의 추이와 추세를 분석할 수 있습니다.
