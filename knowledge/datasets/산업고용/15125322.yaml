summary_user: 한국남부발전 발전소가 도입한 연료량을 월(년월) 단위로 집계해 담으며, 유연탄(인도네시아·호주산과 합계), LNG, B.C유, 등경유, 우드펠릿 등 연료 종류별 도입량을 한 행에 나란히 둔다. 에너지 분석가나 연구자가 '남부발전의 석탄 도입은 줄고 LNG 도입은 늘고 있는가'처럼 발전 연료 구성의 월별 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 년월(ym)을 기준으로 맞추거나 같은 기관 이름으로만 이어 쓴다.
limits: 도입 실적이므로 실제 연료 소비량이나 발전량을 직접 보여주지 않고, 발전소별로 나뉘지 않은 회사 전체·비공간 자료다. 전역 조인 키가 없어 다른 발전사나 전력 데이터와 결합하려면 기간이나 기관명으로 직접 맞춰야 한다.
