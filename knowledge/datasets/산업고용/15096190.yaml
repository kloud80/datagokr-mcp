summary_user: 한국전력거래소가 낸 입찰공고를 공고 한 건당 한 행으로 담은 파일(CSV, 약 20KB)로, 공고명·공고부서·입찰종류·입찰방법·낙찰자선정 방식·입찰신청마감일·투찰 시작·종료일·공고일·진행상태를 기록한다. 전력거래소 조달에 참여하려는 사업자가 '어떤 입찰이 언제 마감되고 어떤 방식으로 낙찰자를 고르는가'를 확인하거나, 분석가가 기관의 발주 유형과 시기를 살펴보는 데 쓴다. 다른 데이터와 이어 쓸 공통 키는 공고번호(kpx_bid_ntce_no) 하나뿐이고 지역·코드표 키가 없는 전국 단위 비공간 자료여서, 같은 공고번호를 쓰는 조달 공고 자료와만 맞춰 볼 수 있다.
description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 목록은 한국전력거래소의 입찰공고 내역을 제공합니다.(공고번호, 공고부서, 공고명, 입찰종류, 입찰방법, 낙찰자선정, 입찰신청마감일자, 투찰시작일자, 종료일자, 공고일자)ㅇ 한전SRM 전자조달시스템에서도 확인 가능합니다.
