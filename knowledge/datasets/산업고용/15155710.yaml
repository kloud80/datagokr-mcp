summary_user: 전국 나들가게의 매장 주소와 위도·경도 좌표를 점포 한 곳당 한 행으로 담은 건별 위치 파일(CSV)입니다. 골목상권 연구자나 지자체 분석가가 '우리 동네 주민이 걸어서 갈 수 있는 거리에 나들가게가 있는가' 같은 생활편의시설 접근성이나 점포 분포를 지도에서 확인할 때 씁니다. 전역 조인 키가 없어 다른 상가·상권 데이터와는 매장주소를 맞추거나 좌표를 공간 결합하는 방식으로만 이어 씁니다.
description_portal: 소상공인시장진흥공단_나들가게 GPS 현황정보 데이터는 나들가게 GPS 현황정보 데이터는 전국 각 지역에 위치한 나들가게의 주소, 위도와 경도 좌표 등 위치 기반 현황을 제공하는 데이터셋입니다. 본 데이터는 소상공인 지원 정책 수립, 지역 생활편의시설 접근성 분석, 골목상권 활성화 연구 등 다양한 분야에서 활용될 수 있습니다. 또한 지도 서비스, 내비게이션, 상권 분석 플랫폼과 연계하여 이용자가 가까운 나들가게를 쉽게 찾을 수 있도록 지원합니다. 이를 통해 지역경제 활성화와 소비자 편의 증진에 기여할 수 있는 공공 데이터입니다.
