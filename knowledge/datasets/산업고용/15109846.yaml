summary_user: 대구광역시 북구 전통시장 28곳의 현황(시장유형·개설주기·점포 수·빈 점포 수·편의시설·좌표)과 각 시장에 속한 상점별 정보(업종·대표품목·온누리상품권·카드단말기·택배 여부·종업원 수·좌표)를 건별로 담는다. 주민이나 소상공인이 '북구에서 온누리상품권과 카드를 받는 전통시장 점포는 어디인가', 분석가가 '시장별 빈 점포 비율은 얼마인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·위경도(lat, lot)나 시장명·상점명 매칭으로만 잇는다.
description_portal: '대구 북구 전통시장 총 28종의 현황정보를 페이징하여 조회할 수 있고, 각 전통시장의 상점정보를 페이징하여 조회할 수 있는 서비스입니다.현황 정보 : 시장코드, 전통시장명, 시장유형, 소재지 도로명 주소, 소재지 지번 주소, 시장개설주기, 영업시간,개설년도, 점포 수, 빈 점포 수, 취급품목,전통시장 홈페이지 주소, 공중화장실 보유 여부, 주차장 보유 여부, 전통시장 대표 전화번호, 위도, 경도 정보를 제공합니다.상점 정보 : 상점코드, 상점명, 소재지 도로명 주소, 소재지 지번주소, 상점업종분류, 대표품목, 전통시장 상가번영회 가입유무, 온누리 상품권 사용유무, 문화상품권 사용유무, 전자상품권 사용유무, 카드단말기 유무, 택배서비스 유무, 종업원 수, 상점 홈페이지 주소, 위도, 경도'
