summary_user: 한국가스공사가 공휴일 등 특수일이 총발전량에 미치는 영향을 반영해 산정한 월별 유효일수를 연·월 단위로 담은 전국 단위 집계 파일(csv 약 2.6KB)이며, 포털 설명상 2021년 6월까지의 값을 담는다. 발전용 천연가스 수요예측이나 전력수급 계획을 다루는 분석가가 '연휴가 낀 달의 발전량을 일평균으로 환산하면 얼마인가' 같은 질문에서 월 발전량을 유효일수로 나눠 보정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 월별 발전량·수요 통계와는 연·월 값을 맞춰 붙여 쓴다.
description_portal: 한국가스공사의 총발전량 월별 유효일수 데이터 입니다. 발전용 천연가스 수요예측 모델 개발 및 공휴일 등 특수일의 발전량 영향 분석, 전력수급 계획 지원을 목적으로 수집되었습니다. 데이터 구성항목은 2021년 6월까지의 연, 월, 유효일수로 이루어져 있으며, 공휴일 등 특수일이 총발전량에 미치는 영향을 산정한 지표입니다. 본 데이터를 활용하면 월별 유효일수 추이 분석, 특수일의 발전량 영향 파악, 유효일수와 발전량의 상관관계 분석, 연도별 유효일수 변화 분석, 연휴 기간 발전량 예측이 가능합니다. 또한 발전용 천연가스 수요예측 모델의 정확도 향상, 전력수급 계획 수립, 일평균 발전량 산정, 특수일 전력수요 패턴 분석에 활용됩니다. 발전용 천연가스 수요예측의 정교화에 기초자료로 활용됩니다.
