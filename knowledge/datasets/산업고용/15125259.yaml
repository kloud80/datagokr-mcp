summary_user: 한국남부발전 발전소 주변 측정 지점의 황산화물·질소산화물·먼지·초미세먼지 농도를 발전소·지역·시간 단위로 담은 측정값 API이며, 기간(연-월-일)과 발전소·지역을 지정해 조회하고 범위는 전국 시군구 단위로 정리돼 있다. 발전소 인근 주민이나 환경 분석가가 "특정 남부발전 발전소 주변의 일자별 대기오염 농도가 어떻게 변했나" 같은 질문에 쓰고, 발전소 주변 환경 조사·계획의 기초자료로 쓴다. 전역 조인 키가 없어 발전소명(saupso)·지역명 같은 이름 매핑이나 같은 기관의 지역코드로만 다른 데이터와 잇고, 대기질·기상 같은 환경 데이터와 교차해 쓴다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전소주변농도(일별)_GW 입니다.해당 서비스를 통해 사용자는 원하는 기간(연도-월-일)과 조회를 희망하는 발전소와 지역을 지정하여 해당 발전소 주변의 대기상태를 조회할 수 있습니다.조회 가능한 정보로는 질소산화물과 황산화물, 미세먼지 등을 매 시간 단위(한시간 간격)로 조회할 수 있습니다.해당 데이터를 활용하여 발전소 주변 환경 조사 및 관련 계획 수립의 기초자료로 활용할 수 있습니다.
