summary_user: 서울 강남구에 등록된 행정사사무소를 사무소 한 곳당 한 행으로 담은 목록 파일로, 사무소명·주소·데이터기준일자를 담는다. 강남구에서 인허가·민원 서류 대행을 맡길 행정사사무소가 어디에 있는지 찾는 주민이나, 지역별 행정사 분포를 보는 분석가가 쓴다. 실측 컬럼에 사업자번호나 행정코드 같은 공통 조인 키가 없어, 다른 데이터와는 주소나 사무소명을 매칭해 잇고, 지방행정 인허가(LOCALDATA) 행정사 업종 데이터와 대조하는 용도로 쓴다.
limits: 공통 조인 키가 없어 다른 데이터와 정확히 연결하려면 주소·이름 매칭에 기대야 한다. 범위가 강남구 한 곳뿐이라 서울 전체나 전국 행정사 현황은 이 파일만으로 알 수 없다.
