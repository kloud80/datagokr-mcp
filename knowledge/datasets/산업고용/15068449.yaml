summary_user: 국가기술은행(NTB) 기술이전 설명회에 올라간 관심기술 발표 영상 파일의 목록을 영상 한 건당 한 행으로 담은 파일 데이터(CSV, 약 46KB)로, 설명회·관심기술 일련번호, 발표기관, 파일명·확장자·크기, 다운로드 횟수, 등록·수정일 등을 포함한다. 기술이전을 검토하는 기업이나 연구자가 '어느 기관이 어떤 기술 설명회 영상을 올렸고, 어떤 영상이 많이 내려받아졌나'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으며, 같은 기관의 NTB 설명회 관련 데이터와는 설명회코드·관심기술일련번호 같은 내부 번호나 발표기관 이름 매칭으로만 연결할 수 있다.
limits: 영상 자체가 아니라 파일 메타정보(파일명·저장경로·크기 등) 목록이며, 전역 조인 키가 없어 다른 기술·기업 데이터와 바로 결합하기 어렵다. 지역 구분이 없는 전국·비공간 자료라 지역별 분석에는 쓸 수 없다.
