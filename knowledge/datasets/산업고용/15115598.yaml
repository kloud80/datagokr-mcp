summary_user: 서울특별시 양천구 관내 일반게임제공업소(성인게임장·오락실 등)의 인허가 정보를 업소 한 곳당 한 행으로 담은 지방행정 인허가(LOCALDATA) 원장이며, 인허가일자·폐업일자, 영업상태, 소재지 주소, 업소명, 주변환경, 시설면적, 건물 층수, 비상계단·조명·방음 시설 여부 등을 포함한다. 주민이나 분석가가 '양천구에서 지금 영업 중인 성인게임장·오락실은 어디에 몇 곳 있고, 학교 주변 등 어떤 환경에 있는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓴다. 좌표(X·Y)는 지도 위에 위치를 표시하는 데 쓴다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 일반게임제공업체의 인허가 정보를 종합적으로 관리하고 활용하기 위해 수집된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지 사업자구분, 주변환경, 시설면적 등 핵심 항목이 포함되어 있어 각 사업장의 설립과 운영 실태를 체계적으로 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관에서 일반게임제공업체 관리, 감독, 정책 수립, 안전 점검 등에 활용할 수 있으며, 연구자와 시민은 지역별 게임시설 분포, 서비스 유형 분석 등 다양한 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 일반게임제공업 - 성인게임장, 오락실 등 청소년이용불가의 게임물과 전체이용가의 게임물을 설치하여 제공하는 업소
