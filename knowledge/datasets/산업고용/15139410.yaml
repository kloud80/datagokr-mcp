summary_user: 경기도 가족친화 일하기 좋은기업 인증을 받은 도내 기업을 기업 단위로 담은 인증 현황으로, 인증구분(신규·재인증), 인증취득연도, 시군명, 기업명, 대표자명, 주생산품목, 홈페이지 주소를 담는다. 구직자는 '우리 시군에서 가족친화 인증을 받은 기업이 어디인가'를 찾을 때 쓰고, 분석가는 시군별·연도별 인증 기업 분포를 볼 때 쓴다. 사업자등록번호 같은 전역 조인 키가 없어서 다른 기업 데이터와는 기업명·시군명을 맞춰 붙여야 한다.
description_portal: 경기도 가족친화 사회 환경 조성 및 지원 조례에 의거, 경기도내 기업의 가족 친화적 직장문화 조성을 위해 진행하는 “경기도 가족친화 일하기 좋은기업 인증” 현황입니다주요 항목으로는 ‘인증구분’을 통해 신규 인증 또는 재인증 여부를 구분하고, ‘인증취득연도’를 통해 해당 기업이 인증을 받은 시점을 확인할 수 있습니다. ‘시군명’은 기업의 지역 위치, ‘기업명’과 ‘대표자명’은 기업 식별 정보, ‘주생산품목명’은 기업의 주요 생산 품목 또는 업종 정보를 나타냅니다. 또한 ‘홈페이지주소’ 항목을 통해 기업의 웹사이트 접근이 가능하도록 구성되어 있어, 정보 활용 편의성이 높습니다. 이
