summary_user: 경기도 화성시 관내 대규모점포와 준대규모점포를 점포 한 곳당 한 행으로 정리한 파일로, 상호·법인명·구분·도로명 소재지·매장면적·영업개시일·휴점일과 준대규모점포 등록 여부, 전통상업보존구역 해당 여부를 담는다(zip 약 3.4KB의 소규모 목록). 시민이 집 근처 대형마트의 정기 휴점일을 확인하거나, 분석가·담당 공무원이 전통상업보존구역 안 준대규모점포 분포와 매장면적 규모를 살펴 유통업·소상공인 정책을 검토하는 데 쓴다. 전역 조인 키는 없으므로 전국 대규모점포 표준데이터나 소상공인 상가업소 원장과는 상호·도로명주소를 맞춰 이어 쓰고, 좌표가 없어 지도에 올리려면 주소를 따로 변환해야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭으로만 연결된다. 범위가 화성시 한 곳에 그치므로 시군구 간 비교에는 전국 표준데이터 등 다른 자료가 필요하다.
