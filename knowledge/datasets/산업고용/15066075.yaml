summary_user: 한국가스공사가 집계한 민수용 도시가스의 월별 가스가격·전기가격과 둘의 상대가격지수를 전국 단위 월별 시계열로 담은 CSV 파일이며, 포털 설명상 기간은 2007년 1월부터 2022년 9월까지다. 에너지 분석가나 정책 담당자가 '가정용 난방·취사에서 도시가스가 전기보다 얼마나 가격 경쟁력이 있었고 그 추이가 어떻게 변했나'를 확인하거나 수요예측 모델의 가격 변수로 쓰는 데 활용한다. 전역 조인 키는 없어 다른 데이터와는 연월(연월일) 기준으로 월별 도시가스 공급량이나 에너지 사용량 시계열과 맞춰 붙이는 방식으로 이어 쓴다.
description_portal: 한국가스공사의 도시가스 민수용 월별 상대가격지수 데이터 입니다. 도시가스 수요분석 및 가격경쟁력 평가, 대체에너지 전환 분석, 요금정책 수립 지원을 목적으로 수집되었습니다. 데이터 구성항목은 2007년 1월부터 2022년 9월까지의 연월일, 가스가격, 전기가격, 상대가격으로 이루어져 있어 도시가스와 전기의 가격 경쟁력을 비교 분석할 수 있습니다. 본 데이터를 활용하면 월별 상대가격 추이 분석, 가스가격과 전기가격의 변동 비교, 상대가격 변화에 따른 수요 영향 분석, 계절별 가격 패턴 파악, 에너지간 대체효과 분석이 가능합니다. 또한 가격경쟁력 평가, 수요예측 모델 개발, 요금정책 수립 기초자료, 소비자 행태 분석에 활용됩니다. 민수용 도시가스의 가격경쟁력 분석과 수요예측 정확도 향상에 기초자료로 활용되어 에너지 정책 의사결정을 지원합니다.
