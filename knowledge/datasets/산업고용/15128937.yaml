description_portal: 이 데이터는 한국석유공사가 제공하는 국내 에너지 사용량 통계로, 연도별로 석유, 전기, 가스 등 주요 에너지원의 사용 규모를 정리한 자료입니다. 각 에너지원별 소비량을 통해 국가 전체의 에너지 소비 구조를 파악할 수 있으며, 이는 에너지 효율화 정책, 탄소중립 계획, 산업별 에너지 수요 예측 등의 기초자료로 활용됩니다. 특히 이 자료는 산업, 가정, 운송 등 다양한 부문에서의 에너지 소비 경향을 파악하는 데 유용하며, 정부와 지자체의 에너지 정책 수립, 기업의 수요 분석, 연구기관의 통계 분석 등에 널리 활용될 수 있습니다. 데이터는 연도별로 구조화되어 제공되며, 시계열 분석과 시각화 작업에도 적합하여 공공성과 활용도가 높은 에너지 관련 통계 자료입니다.
