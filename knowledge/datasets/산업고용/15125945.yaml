description_portal: 서울특별시 강남구 공공태양광 발전량 데이터입니다. 관리부서명, 설치연도, 기관명, 주소, 설비용량, 월별발전량 등을 포함하고 있습니다.  강남구에 위치한 공공시설에서 생산된 태양광 발전의 실적에 관한 정보입니다.설비용량은 해당 발전소가 최대한 적절한 조건에서 생산해낼 수 있는 전력의 용량, 즉 발전 가능 규모를 수치로 나타낸 것으로 kW단위로 표기됩니다.철거되어 더 이상 운영하지 않는 비운영상태 태양광발전은 철거로 기재해 놓았습니다. 데이터 활용 및 기타 문의사항은 강남구 환경과(02-3423-6230)으로 문의주시기 바랍니다.
