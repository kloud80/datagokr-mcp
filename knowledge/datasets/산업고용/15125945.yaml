summary_user: 서울 강남구 공공시설에 설치된 태양광 발전설비를 시설별로 한 행씩 담고, 관리부서·설치연도·기관명·주소·설비용량·건물면적과 월별 발전량(실측 컬럼은 2024년 1월)을 기록한 소규모 파일(csv 약 1.4KB)이다. 강남구 공공건물 중 어느 시설이 태양광을 얼마 규모로 운영하고 실제로 얼마를 발전했는지 확인하려는 주민·지자체 담당자·에너지 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 기관명으로 직접 맞춰 이어야 하며, 같은 강남구 자료나 태양광 발전사업 허가 원장과 이름·주소 기준으로 대조하는 정도로 연결한다.
limits: 강남구 한 곳, 시설 단위의 개별 자료라서 실시간·일별 전력 수급이나 시간별 발전량은 담지 않는다. 표준 조인 키가 없어 다른 데이터와는 이름·주소 매칭에 의존해야 한다. 철거된 설비도 '철거'로 표기된 채 남아 있으므로 운영 중인 설비만 집계할 때는 걸러야 한다.
