summary_user: 경기도 시군별로 지정된 벤처기업집적시설을 시설 한 곳당 한 행으로 담으며, 시설명·지정번호·지정일자·지정면적·대지·건축면적과 도로명·지번 주소, 위경도 좌표를 포함한다. 창업기업이나 입지 담당자가 '우리 시군에 지정된 벤처기업집적시설이 어디에 있고 면적은 얼마인가'를 확인하거나, 분석가가 경기도 내 벤처 산업공간 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)로 같은 기관의 경기도 시군 단위 데이터와 묶고, 주소·좌표로 다른 공간 데이터와 위치 기준으로 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 시군별로 지정된 벤처기업 집적시설에 대한 정보를 제공하며, 각 시설의 명칭, 지정번호, 지정일자, 지정면적, 대지면적, 건축면적, 소재지 주소(도로명 및 지번), 우편번호, 위도·경도 좌표(WGS84 기준) 등의 항목으로 구성되어 있습니다. 벤처기업 집적시설은 도심 내 기업 입주공간 확보를 위해 일정 요건을 갖춘 건축물로, 세제감면 등의 혜택을 받을 수 있습니다. 본 데이터는 경기도의 벤처 및 스타트업 육성 정책 기반 자료로 활용되며, 지역별 산업공간 분포, 기업입지 전략 수립, 관련 행정정책 기획 등에 유용하게 사용될 수 있습니다. 수시로 갱신되며 Open API로 접근 가능해 실시간 데이터 분석이 가능합니다.
