description_portal: '한국서부발전 발전소 배출 수질 정보 API 입니다. 한국서부발전 발전소 배출 수질정보 데이터는 발전소 운영 과정에서 사용된 냉각수과 공정수 등이 외부로 방류될 때의 수질 특성을 기록한 환경관리 자료입니다. 이 데이터에는 연도,사업소,방류량(톤),pH,COD기준(㎎/ℓ),COD평균(㎎/ℓ),SS기준(㎎/ℓ),SS평균(㎎/ℓ),광유 기준(㎎/ℓ),광유 평균(㎎/ℓ),T-N기준(㎎/ℓ),T-N평균(㎎/ℓ),T-P기준(㎎/ℓ),T-P평균(㎎/ℓ) 등이 포함됩니다. 측정결과를 통해 법적 배출 기준 준수 여부를 확인하고, 환경오염 방지 설비의 성능을 평가할 수 있습니다.- pH : 수소이온농도- COD: 화학적산소요구량- SS: 부유물질량- T-N : 총질소- T-P : 총인'
