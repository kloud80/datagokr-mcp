summary_user: 한국서부발전 발전소별로 냉각수·공정수 방류 시 방류량(톤), pH, COD·SS·총질소·총인의 기준치와 측정 평균을 담은 연도 단위 집계 자료다. 지역 주민이나 환경 분석가가 "우리 지역 서부발전 발전소의 방류수 COD·총질소가 배출 기준 안에 있는가"를 확인할 때 쓴다. 전역 조인 키는 없어 발전소명(genNm)을 이름으로 맞춰 같은 기관의 대기오염물질·석탄재·주변 기상 측정 자료와 이어 쓴다.
limits: 표준 코드 같은 공통 조인 키가 없어 다른 기관 데이터와는 발전소명 매핑으로만 연결된다. 행정구역 단위 공간 정보가 없는 비공간 자료다. 개발계정은 하루 100회로 호출이 제한된다.
