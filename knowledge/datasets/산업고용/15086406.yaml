description_portal: 본 데이터는 한국에너지공단의 온누리상품권 구매 및 활용 현황에 대한 자료로, 공단의 지역상권 활성화 및 사회적 책임 실천의 일환으로 추진된 온누리상품권 구매 내역을 상세히 제공합니다. 주요 항목으로는 온누리상품권의 구입일자, 상품권의 종류(지류형, 전자형 등), 상품권을 구매한 부서명, 구입 금액(원), 상품권의 구입 목적(직원 포상, 행사 지원 등) 및 상품권의 배부처 등이 포함되어 있습니다. 본 데이터는 공공기관의 지역경제 활성화 기여도를 분석하고, 정부와 관련 기관이 상품권 구매정책의 효과성을 평가하며, 지역상권 활성화 및 경제적 파급효과 연구를 위한 기초자료로 활용할 수 있습니다. 또한 타 공공기관 및 기업들도 온누리상품권 구매와 관련된 의사결정 및 예산 계획 수립 시 참고자료로 사용할 수 있습니다.
