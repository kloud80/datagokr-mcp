description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전실적 급전속보 조회 서비스_GW 입니다.해당 조회 서비스를 통하여 일일별 실시간으로 발전실적과 관련된 급전속보를 조회할 수 있습니다.발전실적 급전속보로는 최대부하(시간), 일평균 발전량, 월누계평균 등의 정보가 있습니다. 해당 데이터를 활용하여 한국남부발전(주)의 일일단위 발전실적을 확인할 수 있습니다. 이를 활용하여 발전량 예측, 분석 등의 기초자료로 활용 가능합니다.
