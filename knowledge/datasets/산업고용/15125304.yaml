summary_user: 한국남부발전(주)의 일일 발전실적 급전속보를 거래일자별로 담으며, 최대부하·일평균 발전량·월누계평균 같은 항목(섹션)마다 금년 수치와 작년 수치, 증감율을 함께 제공하는 집계 데이터다. 에너지 분석가가 특정 날짜에 한국남부발전의 발전량이 작년 같은 시점보다 얼마나 늘거나 줄었는지 확인하거나, 발전량 예측의 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 거래일자(tradedt)를 기준으로 날짜를 맞추거나 항목명을 매핑해서만 이어 쓴다.
