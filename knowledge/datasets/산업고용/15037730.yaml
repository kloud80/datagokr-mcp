summary_user: 경기도 이천시 관내 고압가스 저장시설을 사업장 한 곳당 한 줄로 담은 파일 데이터로, 상호명·소재지 주소·저장 가스 종류·인허가 연도·데이터 기준일자를 담는다(csv 약 6.7KB). 지역 주민이나 안전관리 담당자가 "우리 동네 근처에 어떤 고압가스 저장소가 있고 무슨 가스를 저장하는가"를 확인하거나, 위험시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없으므로 소재지 주소를 지오코딩하거나 상호명·주소를 맞춰 LOCALDATA 에너지 업종 인허가 원장 등 다른 자료와 이어 쓴다.
description_portal: 경기도 이천시 관내 고압가스 저장시설의 위치 및 인허가 현황을 정리한 데이터입니다. 항목은 사업장 상호명, 소재지(상세주소), 저장 중인 고압가스 종류, 인허가 연도, 기준일자 등으로 구성되어 있으며, 각 시설의 행정구역 단위 위치와 저장물질의 특성을 파악할 수 있습니다. 본 데이터는 가스안전관리, 위험물 취급시설 점검, 재난 예방대책 수립, 인허가 이력 관리, 산업안전 기반 분석 등 행정안전 및 환경 분야의 기초자료로 활용됩니다. 특히 저장소 위치 정보는 GIS 기반 위험시설 밀집도 분석이나 이격거리 기준 검토 등에도 유용하게 쓰이며, 연도별 인허가 현황은 정책적 허용기준 변화나 업종별 확산 경향을 분석하는 데 도움을 줍니다.
