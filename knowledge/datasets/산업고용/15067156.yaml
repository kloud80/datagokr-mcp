summary_user: 대구광역시가 직접 설치해 민간 위탁으로 운영하는 전기자동차 충전기별로 일자마다 이용횟수와 충전량을 담은 파일이며, 충전소 위치(위도·경도)와 급속·완속 충전기 타입이 함께 들어 있다(대구 시 단위, 개별 좌표 수준, CSV 약 11MB). 대구에서 어느 공영 충전소·충전기가 많이 쓰이는지, 급속과 완속의 일별 충전량 차이가 어떤지 확인하려는 분석가나 충전 인프라 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 충전소 데이터와는 충전소 명칭·좌표 매칭이나 같은 기관 코드로만 연결한다.
description_portal: 대구광역시에서 직접 설치하여 민간 위탁 방식으로 운영하고 있는 전기자동차 충전시설의 위치(위도, 경도), 충전기 타입별(급속, 완속) 현황, 충전기별 일일별 충전량, 이용횟수 등의 데이터를 포함합니다. 또한 다음 어느 하나에  해당하는 경우에는 충전 요금의 50%를 감면합니다.( 장애인 소유의 자동차, 국가유공자 소유의 자동차, 고엽제후유증환자 소유의 자동차, 병역명문가로 선정된 예우대상자 소유의 자동차). 참고로 대구광역시 관내에  설치 운영 중인 민간 충전시설 현황은 환경부가 운영하는 웹사이트인 무공해차통합누리집에서 확인할 수 있습니다.
