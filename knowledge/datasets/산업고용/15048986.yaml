summary_user: 창업진흥원 사내벤처 육성 프로그램에 참여하는 운영기업을 기업 단위로 담은 전국 범위의 파일 데이터로, 기업명·지역·상세 주소·주력 지원 기술 분야를 수록한다. 예비창업자나 사내벤처 담당자가 "우리 지역에서 바이오·핀테크 같은 특정 분야의 사내벤처를 지원하는 운영기업은 어디인가"를 찾을 때 쓰고, 분석가는 기술 분야별·지역별 분포를 파악하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어서, 다른 데이터와는 기업명이나 주소·지역 이름을 맞춰 연결해야 한다.
description_portal: 데이터는 전국의 운영기업을 대상으로 기업명, 소재 지역, 상세 주소, 주력 지원 기술 분야에 대한 정보를 포함하고 있습니다. 수록된 기업들은 IT, AI, 바이오, 핀테크, 헬스케어, 콘텐츠, 에너지, 스마트제조, 물류, 관광 등 다양한 산업 분야에서 사업화 지원 역량을 보유하고 있으며, 수도권 중심의 지역 분포가 특징적으로 나타납니다. 대기업, 중견기업, 스타트업, 공공기관 등 기업의 형태도 다양하며, 일부 기업은 특정 분야에 국한되지 않고 자유로운 주제의 기술 창업 아이디어도 수용 가능한 구조를 갖추고 있습니다. 본 데이터는 기업별 기술 역량과 지역 특화산업 간 연계성을 분석하고, 창업지원 정책 수립 및 협업 프로그램 설계 등에 활용될 수 있습니다.
