summary_user: KOTRA가 해외에서 구인 중인 기업을 연도·국가·무역관별로 정리한 구인처 목록으로, 기업명과 업종·세부업종을 행 단위로 담은 CSV 파일(약 306KB)이다. 해외 취업을 준비하는 구직자가 "특정 국가에서 어떤 업종의 어떤 기업이 한국인을 구인했는가"를 찾거나, 분석가가 국가별 구인 업종 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명·업종명·기업명 같은 이름을 맞추는 방식으로만 이어 쓴다.
limits: 공고 단위 채용 상세(직무·모집 인원·급여·마감일 등)는 필드에 없어 개별 채용 조건 확인에는 쓰지 못한다. 공통 코드 키가 없어 워크넷(고용24) 등 다른 채용 데이터와 결합하려면 이름 매핑이 필요하다.
