summary_user: 글로벌 전시 플랫폼(GEP)에 등록된 2020~2026년 개최 예정 해외 전시회를 전시회 한 건당 한 행으로 담은 파일로, 개최 기간·주기, 개최 국가·도시·전시장, 산업분야, 참가업체·참관인 규모, 담당 무역관을 포함한다. 해외 진출을 준비하는 중소기업이 '우리 업종으로 내년에 어느 나라 어떤 전시회에 나가야 하나'를 고르고 참가 계획을 세우는 데 쓴다. 전역 조인 키는 없어서 개최국가명·담당무역관 같은 이름으로 KOTRA 국가·무역관 정보나 수출 지원사업 공고와 맞춰 이어 쓴다.
description_portal: 글로벌 전시 플랫폼(GEP)에 등록되어 있는 2020~2026년 내 개최 예정인 해외 전시회 데이터로, 전시회명, 개최 국가, 개최 도시, 개최 주기 등의 정보를 포함합니다.전시회 개최 기간 및 개최 주기를 기준으로 원하는 전시를 검색하고, 필터링 할 수 있어 해외 진출 및 전시 참가를 준비하는  기업이 글로벌 시장에 적합한 전시회를 찾고, 참가 계획을 수립하는데 활용할 수 있습니다. 또한, 데이터를 분석해 해외 전시회의 트렌드나 참가 기회를 파악하는 데도 유용하며, 담당 무역관 정보를 같이 제공해 현지 시장 정보 탐색의 기회도 제공합니다.
