summary_user: 대구광역시 달서구에 등록된 장애인기업을 업체 한 곳당 한 행으로 정리한 파일로, 업체명·대표자명·전화·팩스·주소·주업종·데이터기준일자를 담는다(CSV 약 11KB). 달서구 안에서 장애인기업 제품·서비스를 구매하거나 협력할 업체를 찾는 공공기관 구매 담당자나 사업자가 '달서구에 있는 장애인기업은 어디이고 어떤 업종인가'를 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어서, 다른 기업 인증·현황 데이터와는 업체명이나 주소를 맞춰 보는 방식으로만 연결한다.
limits: 사업자번호 등 공통 키가 없어 장애인기업 확인서 원장이나 다른 기업 데이터와 정확히 매칭하기 어렵고, 업체명·주소로 대조해야 한다. 범위는 달서구 한 곳뿐이라 대구시 전체나 다른 시군구 비교에는 쓰지 못한다.
