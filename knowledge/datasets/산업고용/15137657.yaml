description_portal: 계열별, 학과별, 대학교 유형별로 졸업 이후 첫 일자리에 진출하는 데 걸리는 소요기간과 해당 시점까지 취업을 이룬 졸업자 비율(%)을 나타낸 데이터입니다.이 자료는 졸업 전, 3개월 이내, 6개월 이내, 1년 이내, 1년 이상 등 시간 구간별로 분류된 취업률(측정값)을 제공하여, 전공 계열 및 대학 유형에 따른 첫 취업 시점의 경향과 차이를 파악하는 데 활용됩니다.또한, 각 학과별로 졸업 전후 일정 기간 내 첫 일자리에 진출한 비율을 통해 ① 조기 취업 가능성, ② 전공별 취업시장 특성, ③ 학교급(대학교·전문대학) 간 차이를 비교할 수 있도록 구성되어 있습니다. 이는 구직을 앞둔 학생이나 진로·취업지도 담당자에게 유용한 참고자료가 됩니다.
