summary_user: 전국 지자체가 관리하는 일반도시가스업체(배관으로 가스를 공급하는 업소)의 인허가 정보를 사업장 단위로 담으며, 검증 시 전체 86건, 인허가 기간은 2007-11-25부터 2026-09-04까지다. 도시가스 공급업체가 어디에 있고 영업 중인지, 가스종류와 배관길이는 어떤지 확인하려는 분석가나 사업자가 쓴다. 지번주소·도로명주소(address 키)로 다른 주소 기반 데이터와 이어 쓰며, 사업장 좌표(X·Y)도 함께 담는다.
description_portal: '자원환경_일반도시가스업체 데이터는 가스도매사업자 등으로부터 공급받거나 스스로 제조한 석유가스, 나프타부생가스 등 일반의 수요에 따라 배관을 통하여 공급하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 일반도시가스업체 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 가스산업과 / 044-203-5237 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
