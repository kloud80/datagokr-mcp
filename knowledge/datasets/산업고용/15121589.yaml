description_portal: '산업기술 연구개발 유망기술 발표회를 통해 소개된 주요 유망기술에 대한 상세 정보를 제공합니다. 본 데이터는 산업통상자원부와 한국산업기술기획평가원 등 관련 기관이 주관한 기술 발표회를 기반으로 수집되었으며, 기술이 실제 산업현장에 적용되거나 사업화될 수 있도록 기술 수요자와의 연결을 촉진하기 위한 목적을 갖고 있습니다. 데이터는 유망기술이 속한 기술분야(예: 소재·부품·장비, 미래차, 전기/전자, 제조기반, 반도체, 로봇, 도심항공모빌리티(UAM), 디스플레이, 바이오, 헬스케어, 모빌리티 등)를 비롯해, 기술명, 기술 요약, 보유기관(대학, 연구소, 기업 등), 연구자 정보, 기술완성도(TRL 등급 또는 적용단계), 거래조건(추후 협의, 추의 안내, 기술 양도 등)으로 구성되어 있습니다. 이 정보는 유망기술 발굴 및 기술이전·사업화를 위한 기초 자료로 활용되며, 기술 수요기업, 투자자, 연구기관 등의 실질적인 협력 기반 형성에 기여합니다. 특히 각 기술의 산업적 활용 가능성과 기술성숙도를 함께 제공함으로써 기술 상용화 가능성을 판단하는 데 중요한 판단 자료로 사용됩니다.'
