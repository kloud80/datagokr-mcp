description_portal: 이 데이터는 상용근로자에게 부과된 고용보험료의 합계를 업종(대분류) 및 사업장 규모(상시근로자수 기준)별로 집계한 통계 자료입니다. 건설업 등 자진 신고 사업장을 제외한 상용근로자(월별보험료 부과 사업장)를 대상으로 합니다. 업종 분류는 2017년 이후 기준으로 제10차 한국표준산업분류가 적용되었으며, 사업장 규모 정보가 미기재되었거나 상시근로자 수가 0명인 사업장은 통계에서 제외되었습니다. 이 자료는 국내 산업 구조 및 기업 규모 변화에 따른 고용보험료 납부 현황을 상세하게 파악하는 데 매우 중요한 정보를 제공한다고 판단됩니다.본 데이터는 노동 시장 연구 및 산업 정책 수립에 필수적인 기초 자료입니다. 특정 업종 또는 소규모 사업장에서 고용보험료 부과액이 증가하거나 감소하는 추이를 분석함으로써, 산업별 고용 변동성과 소규모 기업의 고용 유지 상태를 진단할 수 있습니다. 이를 기반으로 특정 산업 분야나 규모의 기업을 대상으로 한 맞춤형 고용 안정 지원 정책이나 사회보험료 지원 방안을 수립하는 데 기여할 수 있다고 판단됩니다.
