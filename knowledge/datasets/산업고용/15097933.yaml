summary_user: 에너지이용 합리화법에 따라 정기 검사·관리 대상인 보일러·압력용기 등 검사대상기기의 전국 설치 현황을 담으며, 필드명으로 보아 기기별로 지역·업종·용도·기기 구분·용량과 단위·고압 여부·연료·설치연도·운영상태를 기록하는 것으로 보인다. 안전관리·에너지효율 분석가가 '어느 지역·업종에 오래된 고용량 보일러가 몰려 있어 효율 개선 사업이나 검사 계획의 우선 대상이 되는가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지역명(RGN)이나 업종명 같은 이름 매핑으로만 이어 쓴다.
description_portal: "본 데이터는 '에너지이용 합리화법' 제34조에 의거하여 정기적인 검사 및 관리가 필요한 특정 열사용기자재(이하 검사대상기기)의 전국적인 설치 현황을 제공합니다. 검사대상기기에는 보일러, 압력용기, 열교환기 등 에너지 소비량이 많거나 안전과 직결되는 설비들이 포함됩니다. 이러한 기기들은 효율적인 에너지 이용을 도모하고, 동시에 잠재적인 안전사고(폭발, 누출 등)를 예방하기 위해 설치 및 운영 단계에서 철저한 관리가 요구됩니다.이 데이터셋의 주된 목적은 국내에 설치된 검사대상기기의 규모, 종류, 위치 등을 파악하여 체계적인 관리 및 검사 계획을 수립하는 데 필요한 기초 정보를 제공하는 것입니다. 이를 통해 정부와 관련 기관(예: 한국에너지공단)은 법적 의무 이행 여부를 감독하고, 안전 관리 정책을 수립하며, 에너지 효율 개선 사업의 대상을 발굴하는 데 활용할 수 있습니다. 또한, 사업장에서는 자사의 기기 현황을 확인하고 법적 기준 준수 여부를 점검하며, 관련 산업계는 시장 규모와 수요를 파악하는 데 기여합니다."
