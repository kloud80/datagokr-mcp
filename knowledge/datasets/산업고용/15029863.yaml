summary_user: 경기도 가평군 관내 고압가스저장소를 업소(상호) 단위로 한 줄씩 담은 원천 목록으로, 도로명·지번 주소와 위경도, 취급 고압가스 종류, 데이터기준일자를 포함합니다(CSV 376바이트의 소규모 파일). 지역 주민이나 안전·재난 담당자가 '우리 동네 근처에 어떤 고압가스를 다루는 저장소가 어디 있는가'를 지도에 표시하거나 현장 점검 대상을 확인할 때 쓴다. 전역 조인 키는 없어 주소·좌표를 기준으로 공간 결합하거나 상호명·시군명으로 다른 에너지 업종 인허가 자료(LOCALDATA 등)와 맞춰 이어 쓴다.
description_portal: 본 데이터는 경기도 가평군 관내 고압가스저장소 현황을 수록한 자료입니다. 항목에는 시군명, 상호명, 소재지 도로명주소 및 지번주소, 위도, 경도, 고압가스 종류, 데이터기준일자 등이 포함되어 있으며, 저장소별 위치와 취급 가스 종류를 확인할 수 있습니다. 본 자료는 고압가스 안전관리, 위험물 취급 시설 분포 분석, 재난 대응계획 수립 등에 활용됩니다. 특히 위경도 및 상세주소 정보를 기반으로 지도 서비스, 공간 분석 시스템, 현장 점검 지원 등에 유용하게 사용됩니다. 단, LPG(액화석유가스)는 별도 법률에 따라 관리되어 본 데이터에는 포함되지 않습니다. 데이터는 수시로 갱신되며, 공공데이터포털에서 다양한 형식(CSV, XML, JSON)으로 무료 제공됩니다.
