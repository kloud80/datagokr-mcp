description_portal: 중소벤처기업진흥공단에서 운영하는 성과보상공제사업의 내일채움공제 가입을 지원하는 외부 가입기관의 연도별 신규 참여 현황 데이터입니다.내일채움공제는 중소기업 핵심인력의 장기재직을 유도하고 근로자의 자산 형성을 지원하기 위한 제도로, 본 데이터는 외부 가입기관의 참여 현황을 연도별로 제공합니다.데이터에는 참여연도, 기관명, 기관유형의 정보가 포함되어 있으며, 기관유형은 금융권과 비금융권으로 구분되어 있습니다.이를 통해 연도별 외부 가입기관의 참여 추이와 기관 유형별 현황을 분석하는 데 활용할 수 있습니다.
