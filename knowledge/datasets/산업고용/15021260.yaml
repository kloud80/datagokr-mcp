summary_user: 부산광역시 기장군에 소재한 담배소매인(업소)을 한 곳씩 담은 파일로, 상호·도로명 주소·지정일자·운영상태를 업소 단위로 담는다(시군구 범위, 개별 주소 단위). 기장군에서 특정 동네에 담배를 파는 곳이 어디 있는지, 언제 지정된 소매점인지 확인하려는 주민·예비 창업자나 담배소매점 분포를 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·좌표·행정코드 등)가 없어, 다른 데이터와는 상호·주소 문자열 매칭이나 지방행정 인허가(LOCALDATA) 담배소매 원장과의 대조로만 잇는다.
limits: 사업자번호·좌표·코드 같은 조인 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 주소·상호 매칭에 의존해야 한다. 범위는 기장군 한 곳뿐이라 부산 전체나 다른 시군구 비교에는 별도 데이터가 필요하다.
