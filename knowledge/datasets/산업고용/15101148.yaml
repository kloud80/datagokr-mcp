summary_user: 가동 중인 국내 원전 격납건물에 적용된 방호도장 시스템을 발전소·적용부위별로 정리하고, 각 시스템의 1차~6차 도장 층에 쓰인 도료를 담은 현황표 파일(CSV, 약 6KB)이다. 원전 정비·도장재 공급 사업자나 안전성 분석가가 '어느 발전소의 어느 부위에 어떤 설계기준사고(DBA) 시험 통과 도장 시스템과 도료가 쓰였는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 원전 데이터와는 발전소 이름을 맞춰 연결하거나 같은 한국수력원자력 자료끼리 이어 쓴다.
limits: 발전소 코드 같은 표준 조인 키가 없어 다른 데이터와 결합하려면 발전소명을 직접 매핑해야 한다. 범위는 전국이지만 위치 정보가 없는 비공간 자료라 지도 분석에는 바로 쓰지 못한다.
