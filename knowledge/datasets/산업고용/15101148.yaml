description_portal: 한국수력원자력㈜이 공개하는 가동원전 격납건물 방호도장 시스템 현황 데이터는 국내에서 가동 중인 원자력발전소 격납건물에 적용된 방호도장 시스템과 그에 사용된 도료 정보를 담고 있습니다. 원전 격납건물의 방호도장은 원자로 및 관련 설비를 보호하고 사고 시 안전성을 확보하기 위해 필수적으로 적용되며, 각 노형별 시스템에 적합한 도장재는 DBA(Design Basis Accident, 설계기준사고) 시험을 통해 검증됩니다. 이 데이터는 DBA 시험을 통과해 원전에 적용이 승인된 시스템과 도장재의 현황을 설명하고 있으며, 원전 안전성 확보를 위한 재료 선택 기준과 적용 현황을 확인할 수 있는 자료로 활용됩니다.
