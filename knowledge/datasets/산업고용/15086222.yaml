summary_user: 월드잡플러스에 등록된 해외기업을 기업 단위로 담은 API로, 기업명·국가명·업체구분·업종(표준산업분류명)·직원 수·설립연도·등록일과 채용 관련 건수 항목을 제공한다. 해외 취업을 준비하는 구직자가 "지원하려는 해외기업이 어느 나라, 어떤 업종이고 규모는 어느 정도인가"를 미리 확인하거나, 분석가가 국가별·업종별 해외기업 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 데이터와는 기업명·국가명·업종명 같은 이름을 맞춰서만 연결한다.
description_portal: 한국산업인력공단 월드잡플러스에서는 해외 취업을 준비하는 구직자나 해외 진출을 고려하는 개인 및 기관이 해외기업에 대한 정보를 효율적으로 파악할 수 있도록, 해외기업 정보를 공공데이터 형태로 제공합니다. 이 데이터는 기업명, 업종, 업체구분,직원 수 등의 항목으로 구성되어 있으며, 사용자는 이를 통해 관심 있는 해외기업의 기본 정보와 채용 가능성 등을 사전에 확인할 수 있습니다. 특히 해외 구직 활동 시 신뢰할 수 있는 기업 정보를 확보하는 데 유용하며, 기업의 산업 분야나 국가별 분포를 분석하는 데에도 활용됩니다. 이 데이터는 해외취업 지원뿐 아니라 국제 인력수요 조사, 구직자-기업 매칭 서비스 등 다양한 목적으로 활용 가능한 핵심 자료입니다.
