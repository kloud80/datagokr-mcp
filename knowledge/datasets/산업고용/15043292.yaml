status: active
summary_user: 전북특별자치도 내 태양광 발전사업 허가를 발전소 한 곳당 한 행으로 담은 건별 원장으로, 허가일·시군·사업장소·설치구분(건물상부/야지 등)·허가면적·설비용량·공급전압·사업개시신고일을 시군구 단위로 기록한다. 지역 에너지 분석가나 지자체 담당자가 '전북 어느 시군에 어떤 규모의 태양광 허가가 언제 몰렸는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군 이름이나 사업장소 주소를 매핑해 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 이어 쓴다.
limits: 표준 행정코드나 발전소 고유번호 같은 공통 키가 없어 다른 데이터와 붙일 때는 시군명·주소·발전소명칭 문자열 매칭에 의존해야 한다. 범위는 전북특별자치도 한 시도의 허가 건으로 한정되며, 실제 가동이나 발전량 정보는 담지 않는다.
