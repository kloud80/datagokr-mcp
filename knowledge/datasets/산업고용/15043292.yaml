description_portal: 이 데이터는 전북특별자치도 내 태양광발전사업에 대한 허가 현황을 담고 있는 자료로, 2005년부터 최근까지의 허가 정보를 포함하고 있습니다. 각 행은 하나의 태양광발전소에 해당하며, 허가일, 에너지원 종류, 발전소 명칭, 시군 위치, 사업 장소, 설치 구분(건물상부/야지 등), 허가 면적(㎡), 설비용량(kW), 공급 전압(V), 준비 기간, 사업 개시 신고일, 비고 등의 항목으로 구성되어 있습니다. 이 데이터를 통해 전라북도 내 태양광발전소의 분포, 설비 규모, 설치 유형 및 시기별 허가 동향을 분석할 수 있으며, 신재생에너지 보급 정책 수립이나 지역별 에너지 인프라 분석에 유용하게 활용하실 수 있습니다.
