description_portal: '본 데이터는  연도별로 발전원(예: 원자력, 수력, 기력, 대체 에너지 등)별 전력 설비용량 현황을 정리한 자료입니다. 연도별 설비 규모 변화를 통해 국내 에너지 추이를 파악할 수 있습니다. - 연도 : 2010~2025년도  - 발전원 : 원자력, 수력, 기력(무연탄, 유연탄, 중유, LNG), 복합, 내연력, 대체 에너지, 기타로 분류 됩니다.     ( ※ 대체 에너지 :  태양광, 풍력 등 신재생에너지(일반수력, 소수력은 데이터 일관성 유지를 위해 수력으로 별도 구분)    ( ※ 기타 :  내연력, 증류탑폐열, 여열회수, 천연가스압터빈, 부생가스, 폐기물에너지("20.1 이후 신재생에서 기타로 분류)) -  공란 : 별도 데이터 미집계(신재생에너지에 포함)'
