summary_user: 경상남도 내 창업보육센터를 센터 한 곳당 한 행으로 담은 소규모 파일 목록(csv 약 2.5KB)으로, 시군구·센터명·주소·전화번호·개업일자·전문분야를 포함합니다. 예비 창업자가 '우리 시군에서 내 업종 전문분야를 둔 창업보육센터는 어디이고 연락처는 무엇인가'를 찾을 때나, 분석가가 도내 시군별 보육센터 분포를 파악할 때 씁니다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 시군구명·센터명 같은 이름 매칭이나 주소 기반 위치 결합으로만 이어 씁니다.
limits: 사업자번호 등 공통 키가 없어 기업 확인·인증 원장이나 입주기업 데이터와 직접 연결되지 않습니다. 범위는 경상남도 한 곳의 센터별 주소 수준이며, 입주 현황·지원 실적 같은 운영 정보는 담겨 있지 않습니다.
