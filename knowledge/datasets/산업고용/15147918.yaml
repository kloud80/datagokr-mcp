description_portal: '- 한국방송광고진흥공사에서는 국내 광고주를 대상으로 6대 매체의 광고비를 주기적으로 조사하여 월별 광고비 증감 전망 등을 제공하며, 국내 광고산업의 전반적인 동향 관측 및 경기를 진단합니다.* 6대 광고매체는 "지상파TV, 케이블TV, 종합편성TV, 라디오, 신문, 온라인-모바일" 입니다.- 개방데이터는 매체별 광고경기전망지수 및 동향지수 추이데이터로, 년도, 월, 매체, 동향지수, 전망지수 총 5가지 항목으로 이루어져 있습니다.- 국가, 지방자치단체, 공공기관은 월별 광고경기 전망을 통해 경기대응책과 지원시책 수립에 필요한 기초 자료로 활용하실 수 있으며, 광고주 등 유관기업의 국내 주요 매체의 광고경기 변동 파악에 기여할 수 있습니다.'
