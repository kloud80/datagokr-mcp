description_portal: 본 데이터는 특정 일자를 기준으로 이용자 규모 변동을 파악하기 위해 일별 이용자 관련 수치를 정리한 구조로 구성되어 있습니다. 각 일자별로 신규 이용자 증가량, 이용 종료 형태별 건수, 전체 이용자 누적치를 함께 제공하며, 날짜별 기록 단위로 정렬된 형태입니다. 제공 항목은 일자, 신규 증가량에 해당하는 수치, 이용 종료 처리 방식에 따른 구분값, 전체 누적치를 포함하고 있습니다. 이 데이터는 동일한 기준에 따라 반복 수집된 값으로, 특정 시점에서 이용자 규모가 어떻게 변하고 있는지를 직접 확인할 수 있는 구조입니다. 또한 항목 간 합산 관계나 변화량을 확인할 수 있는 값들이 포함되어 있어 전체 추이를 비교하는 데 활용할 수 있습니다.
