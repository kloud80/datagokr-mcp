summary_user: 춘천시에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 지정번호·업소명·업소 주소·지정일자·데이터 기준일을 가진다. 담배 판매점을 새로 내려는 사업자가 예정지 주변에 기존 소매인이 얼마나 있는지 확인하거나, 분석가가 시내 담배 판매업소 분포를 살펴볼 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 업소 주소나 업소명으로 맞춰 연결하며, 같은 지방행정 인허가(LOCALDATA) 계열 업종 원장이나 상가업소 정보와 주소 기준으로 대조하는 방식이 현실적이다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어 다른 데이터와 정확히 1:1로 묶기 어렵고, 주소·업소명 문자열 매칭에 의존한다. 범위는 춘천시 한 곳뿐이라 다른 시군구와 비교하려면 지역별 파일을 따로 모아야 한다. 파일 다운로드(CSV) 형태로만 제공된다.
