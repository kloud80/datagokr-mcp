summary_user: 창업기업 창업자의 창업 전 취업상태 비율과 평균 근무경력(개월)을 업력·업종·기업형태·성별·연령대 같은 구분별로 묶은 전국 단위 집계표이며, 파일 크기가 1KB 남짓인 소규모 CSV입니다. 창업 지원정책 담당자나 연구자가 '연령대나 업종에 따라 창업자의 이전 근무경력이 얼마나 다른가'를 비교할 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업종명·연령대 같은 구분 이름을 맞춰 연결해야 하고, 같은 기관의 창업기업 실태 통계와 나란히 보는 용도에 맞습니다.
limits: 개별 창업자나 기업 단위 원장이 아닌 구분별 집계라서 특정 기업을 찾거나 사업자번호로 기업 정보와 잇는 데는 쓰지 못한다. 지역 구분 없이 전국 단위만 담고, 활용신청 없이 파일로 받는다.
