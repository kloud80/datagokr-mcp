summary_user: 한국남부발전(주)이 운영하는 성산풍력의 1호기부터 10호기까지 호기별 일일 발전량(kWh)을 날짜(구분) 한 행씩 담은 파일 데이터로, 포털 설명상 2018년 1월 1일부터 2026년 3월 31일까지를 다룬다. 풍력 분석가나 에너지 연구자가 "성산풍력의 어느 호기가 계절·연도별로 발전 실적이 떨어졌는가"를 확인하거나 풍력 발전량 예측 모델의 학습 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 날짜와 발전소 이름을 기준으로 기상(풍속) 자료나 전력거래소 발전원별 실적과 직접 맞춰 이어 써야 한다.
limits: 표준 코드 형태의 조인 키가 없어 다른 데이터와는 날짜·이름 매핑으로만 연결된다. 실시간 수급이 아닌 단일 발전단지의 일별 집계 파일이라 시간대별 출력이나 전국 풍력 현황은 알 수 없다.
