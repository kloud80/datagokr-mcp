summary_user: 2017~2023년 REC(신재생에너지 공급인증서) 현물시장의 거래를 날짜·체결시간대별로 집계해 육지와 제주의 평균 낙찰가와 거래량을 담은 파일 데이터다(zip 약 68KB). 신재생 발전사업자나 에너지 분석가가 '육지와 제주의 REC 현물가격이 연도·시간대별로 어떻게 움직였나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 전력시장 데이터(SMP 등)와는 날짜 기준으로만 맞춰 붙인다.
description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2017 ~ 2023년까지의 REC 현물시장 일별 시간대별 거래데이터ㅇ 육지와 제주의 시간대별 거래량 거래낙찰가와 일별 거래량 거래낙찰가 관련 데이터를 제공합니다.
