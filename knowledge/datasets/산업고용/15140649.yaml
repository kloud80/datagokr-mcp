description_portal: '은평구의 소비자를 직접 방문하여 화장품 등 재화 또는 용역을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구에 사업장을 두고, 영업소 외의 장소에서 소비자를 직접 만나 상품을 판매하는 방문판매업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같은 특수거래 분야 소비자 보호를 위한 핵심 행정 정보가 포함되어 있습니다 .이 데이터를 통해 소비자는 자신이 거래하는 업체가 정식으로 신고된 합법적인 방문판매업체인지 확인할 수 있어, 불법 다단계나 과장 광고, 강매 등의 피해를 예방하는 데 중요한 역할을 합니다. 또한, 지자체는 이를 기반으로 관내 방문판매업체의 현황을 파악하고 관리·감독하며, 건전한 상거래 질서를 확립하고 소비자 권익을 보호하는 정책을 수립하는 데 필수적인 기초 자료로 활용합니다.'
