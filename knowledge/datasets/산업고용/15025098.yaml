summary_user: 부산광역시 연제구에 등록된 자동차매매업 등 자동차 관리업체를 업체 한 곳당 한 행으로 담은 파일로, 상태정보·관리사업유형·상호·전화번호·사업장 주소가 들어 있다. 연제구에서 중고차 매매업체나 정비 등 관리업체를 찾는 주민이나, 구 안의 자동차 관리업체가 어디에 몰려 있는지 보려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호명이나 사업장 주소로 맞춰 이어야 하며, 지방행정 인허가(LOCALDATA) 자동차 관련 업종 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 정도로 쓴다.
description_portal: 부산광역시 연제구_자동차 관리업체 현황은 매매업 등의 자동차관리법에  따라 부산광역시 연제구에 등록되어있는 매매업에 대한 현황 정보로 구성된 데이터입니다.제공항목으로는 등록신청사업, 상호, 사업장 전화번호,  소재지(도로명)이 있습니다.사업장 전화번호가 공란인 경우는 개인정보(휴대폰 번호)가 포함되어 있어 공란으로 처리하였습니다.자동차매매업은 중고자동차를 직접 판매하거나 그 거래를 알선하는 사업으로, 「자동차관리법」 제53조에 따라 등록된 사업자만이 운영할 수 있습니다.
