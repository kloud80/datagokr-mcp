summary_user: 경기도 파주시 공공시설·공공청사에 설치된 태양광발전소를 시설 단위로 한 줄씩 담은 원장 파일(csv, 약 6.5KB)로, 설치시설명·도로명/지번 주소·위도·경도·설비용량(kW)·설치연도·용도(자가소비 또는 임대 등)를 담는다. 파주시 공공부문에 태양광이 어느 시설에 얼마 규모로 언제 들어섰는지, 연도별로 보급이 어떻게 늘었는지 확인하려는 시민·연구자·정책 담당자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 시설명으로 맞춰 이어야 하며, 발전소 단위로 주소·용량을 담은 전국태양광발전소전기사업허가정보 표준데이터와 대조하는 용도로 쓴다.
description_portal: '경기도 파주시 공공시설/공공청사에 설치된 태양광발전소의 설치 및 운영 현황에 대한 공공데이터로, 태양광설비가 설치된 공공기관 또는 시설의 명칭을 나타내는 설치시설명,  위치정보를 통해 공간분석 및 시각화를 가능하게 하는 소재지도로명주소, 소재지지번주소, GIS 기반의 위치기반분석을 지원하는 위도, 경도, 발전소의 발전 가능 전력량(kW)을 나타내어 에너지 생산 규모 파악에 활용될 수 있는 설비용량, 연도별 보급추세 분석에 기여하는 설치연도, 해당 설비가 사용되는 목적을 명시하는 용도[예: (자가소비 또는 상업용 임대)] 등의 항목으로 구성되어 있습니다. 본 데이터셋은 지역별 태양광 에너지 분포, 설치 추세, 정책효과 평가, 재생에너지 확대방안 도출, 공공부문에서의 신재생 에너지 도입현황과 에너지 자립률 정량 분석, GIS기반 지도 시각화, 설비별 효율 분석, API연계 서비스 개발, 지역별 설치패턴, 정책 도입 효과, 탄소 저감 기여도 평가, 시계열 분석 및 기능별 에너지 수요 예측, 지속가능 도시계획, 에너지 전환 정책 연구 등에 활용될 수 있습니다.'
