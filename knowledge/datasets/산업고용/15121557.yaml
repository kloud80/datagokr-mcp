summary_user: 산재보험 최초 요양 신청이 승인된 외국인 근로자를 승인 건별로 한 행씩 담은 파일로, 재해발생형태(사고·질병·출퇴근), 산재업종 대분류, 사업장 규모, 관할 지역본부를 기록하며 범위는 전국입니다. 정책 담당자나 연구자가 '외국인 근로자 산재는 어떤 업종·규모의 사업장에서, 어느 지역본부 관할에서 주로 승인되는가'를 집계해 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명·지역본부명 같은 이름 매핑이나 근로복지공단의 다른 산재 통계와 항목명을 맞춰서만 이어 쓴다.
