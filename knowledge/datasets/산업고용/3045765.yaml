summary_user: 부산광역시 사하구 관내에 여행업으로 등록해 영업 중인 업소를 한 행씩 담은 건별 현황 파일로, 업종 구분(종합·국외·국내여행업 등)·상호·우편번호·도로명 소재지·전화번호를 담는다. 사하구에서 국외여행을 취급하는 여행사가 어디에 있는지 찾는 주민이나, 구 단위 여행업 분포를 보려는 분석가가 쓴다. 전역 조인 키(사업자번호·인허가번호 등)가 없어 다른 데이터와는 상호·도로명 주소 매칭으로만 잇고, 같은 계열의 지방행정 인허가(LOCALDATA) 여행업 자료와 대조할 때도 같은 방식으로 맞춘다.
description_portal: 부산광역시 사하구 관내에서 여행업으로 등록하여 영업중인 업소 현황 데이터를 제공합니다.*전화번호에 휴대폰번호 등 개인정보가 있을 경우 공백으로 처리합니다. -> 비공개*전화번호가 명확하지 않은 경우 공백으로 처리합니다.*주요 데이터 컬럼별 상세설명○ 업종 → 여행업종의 구분(종합여행업/국외여행업/국내여행업 등)○ 상호 → 부산광역시 사하구 관내에서 여행업으로 영업 활동을 할 때 업소명○ 우편번호 → 부산광역시 사하구 관내에서 여행업 업소에 우편물을 쉽게 분류하기 위하여 과학기술정보통신부에서 지역마다 매긴 우편번호○ 소재지(도로명) → 부산광역시 사하구 관내 해당 여행업 사업장의 위치의 도로명 주소○ 전화번호 → 부산광역시 사하구 관내 해당 여행업 사업장의 전화번호
