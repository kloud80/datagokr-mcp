description_portal: 본 데이터는 한국중부발전의 각 발전기별 열효율을 연월 단위로 정리한 자료입니다. 열효율은 발전소별로 설치된 호기(발전기 단위)의 운전 성능을 나타내며, 연료를 전기에너지로 얼마나 효율적으로 전환했는지를 백분율(%)로 나타냅니다. 항목은 발전소, 호기, 연월, 열효율로 구성되어 있으며, 본 데이터는 설비별 에너지 전환 효율 분석, 연료 사용량 대비 출력 성능 평가, 탄소배출과의 상관 분석 등에 활용될 수 있습니다. 또한 발전설비의 성능 개선 여부, 유지보수 효과 검토, 장기 투자계획 수립 등 전략적 설비 운영 의사결정을 위한 기초자료로 유용합니다.
