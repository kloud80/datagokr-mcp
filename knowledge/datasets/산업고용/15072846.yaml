summary_user: 대전광역시 중구 관내 가스사업자를 사업장 한 곳당 한 행으로 담은 명부 파일(CSV, 약 1.9KB)로, 사업 구분(LPG 저장소·충전사업·판매사업 등), 상호, 도로명 사무소주소, 연락처, 데이터 기준일자를 담는다. 주민이나 사업자가 중구에서 LPG를 사거나 충전할 수 있는 업소가 어디이고 연락처가 무엇인지 확인할 때, 분석가가 구 단위 에너지 업종 인허가 현황을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명주소를 맞추는 방식으로만 연결할 수 있으며, 다른 지자체의 에너지 업종 인허가 원장과 묶어 볼 때도 같은 방식을 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 관내에 위치한 가스사업자 현황 ( 연번, 구분, 상호, 사무소주소, 연락처, 데이터 기준일자) 정보를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 구분은 LPG 저장소, LPG 충전사업, LPG 판매사업 등으로 구성되어 있습니다.데이터 컬럼 중 사무소주소는 도로명주소를 기준으로 작성되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우에는 담당부서로 연락주시기 바랍니다.
