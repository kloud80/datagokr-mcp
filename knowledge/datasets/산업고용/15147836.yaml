description_portal: 이 데이터는 창업진흥원 홈페이지에 게시된 롤링배너 정보를 모아 제공하는 자료입니다. 롤링배너란 홈페이지 상단이나 주요 화면에 위치하여 방문자에게 중요한 소식을 알려주는 안내 영역을 말합니다. 데이터에는 배너 제목, 게시 시작일자, 종료일자, 관련 링크 주소(URL), 사용 여부, 등록 일시 등의 세부 항목이 포함되어 있습니다. 현재 사용 중인 배너뿐 아니라 게시기간이 종료된 배너까지 함께 제공하므로 과거부터 현재까지의 홍보 현황과 변화를 확인할 수 있습니다. 이를 통해 이용자는 기관이 추진하는 사업 공고, 정책 안내, 행사 홍보 등 다양한 정보를 파악하고 분석 자료로 활용할 수 있습니다.
