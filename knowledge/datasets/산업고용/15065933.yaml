summary_user: 한국가스공사가 통계청 시군 단위 기온을 주요 5개 광역시의 산업용 도시가스 공급량으로 가중평균해 산출한 전국 월간 기온을 일자별 한 값씩 담은 집계 데이터이며, 범위는 전국 단일 값(비공간)이다. 에너지 분석가나 도시가스 사업자가 '기온이 1도 내려가면 산업용 도시가스 수요가 얼마나 늘어나는가' 같은 기온-산업수요 상관 분석과 수요예측 모델 입력에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 월간 판매량·공급량 통계와는 일자(연월)를 맞춰 붙여 쓰는 방식으로만 연결한다.
description_portal: 한국가스공사의 월간 산업용 도시가스 판매량 가중평균 전국 기온 데이터 입니다. 산업용 도시가스 수요예측에 적합한 기온 데이터 제공 및 수요분석 지원, 산업활동 연관 분석을 목적으로 수집되었습니다. 데이터 구성항목은 일자와 산업용 도시가스 판매량 기준 전국 가중평균 기온으로 이루어져 있습니다. 통계청 시군 단위 기온데이터를 주요 5개 광역시의 산업용 도시가스 공급량으로 가중평균하여 산출한 데이터입니다. 본 데이터를 활용하면 기온과 산업용 수요의 상관관계 분석, 산업용 수요예측 모델 개발, 산업활동과 기온의 연관성 분석, 기온 변화에 따른 산업용 수요 변동 예측, 계절별 산업수요 패턴 분석이 가능합니다. 또한 산업용 공급계획 수립, 산업부문 에너지 수요 전망, 산업활동 지표 분석에 활용됩니다. 산업용 도시가스 수요예측의 정확도 향상에 기초자료로 활용됩니다.
