description_portal: 산업기술 연구개발(R&D) 사업의 세부 및 내역사업별 성과조사에 대한 정보를 제공합니다. 본 데이터는 산업통상자원부와 한국산업기술기획평가원이 주관한 R&D 사업의 성과를 정량적으로 분석한 자료로, 진행된 각 사업을 기준으로 성과년도, 세부사업명, 내역사업명, 전체 과제 수, 논문 실적 건수(SCI/비SCI 구분 포함), 특허 실적 건수(출원 및 등록), 기술수준향상률 등의 항목으로 구성되어 있습니다. 이 정보는 R&D 투자에 따른 성과 수준을 종합적으로 파악하기 위한 목적으로 활용되며, 개별 사업의 연구 성과뿐만 아니라 기술의 발전 정도와 사업의 효율성 등을 객관적으로 분석할 수 있도록 지원합니다. 특히 정책 수립, 예산 평가, 기술사업화 전략 수립 등 다양한 분야에서 핵심 기초자료로 활용될 수 있으며, 연구기관과 기업 등 과제 수행 주체들에게는 자사의 성과를 객관적으로 비교하고 개선 방향을 모색하는 데 유익한 기준이 됩니다.
