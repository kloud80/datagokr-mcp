summary_user: 경상남도 고성군에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 업소명·지정일자·주소·전화번호·기준일자가 들어 있고 시군구 범위의 개별 주소 단위다. 주민이 고성군에서 합법적으로 담배를 파는 가게가 어디인지 확인하거나, 행정·분석가가 지역 내 담배 판매업소 분포와 지정 시기를 살필 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명·주소 문자열을 맞춰 보거나, 같은 기관 기준으로만 연결하며, 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 매칭으로 대조하는 방식이 현실적이다.
description_portal: 경상남도 고성군_담배소매인지정현황 데이터는 고성군 내 담배 소매업소의 업소명, 주소, 전화번호 등 기본 정보를 제공합니다. 이 데이터는 지역 내 담배 판매업소의 분포 및 현황을 체계적으로 관리하고, 불법 판매 방지, 담배 유통질서 확립, 청소년 보호, 지역사회 건강 정책 지원, 민원 안내 등 다양한 행정 및 공공 서비스에 활용됩니다.또한 시민들이 합법적으로 담배를 구입할 수 있는 매장을 신속하게 확인할 수 있도록 생활정보 제공에도 활용되며, 데이터는 사회적 변화와 행정 수요에 맞춰 정기적으로 갱신되어 최신 현황을 반영합니다.
