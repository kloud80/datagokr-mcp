summary_user: 국내에서 제조·수입되어 판매되는 자동차용 타이어 가운데 에너지소비효율 등급 인증을 받은 제품을 모델 단위로 담은 원장으로, 제품명·업체명·모델 패턴·규격·종류와 회전저항 등급, 젖은 노면 제동력 등급을 전국 범위로 제공한다. 타이어를 사려는 운전자가 '내 차 규격에 맞는 타이어 중 연비(회전저항)와 젖은 노면 제동 등급이 모두 높은 제품은 무엇인가'를 비교하거나, 분석가가 제조사별 등급 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·제품명·타이어 규격 같은 이름 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 자동차 연비 등 다른 효율등급 데이터와 붙이려면 업체명·모델명 문자열 매칭에 의존해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 판매·보급 분석에는 쓸 수 없다. 개발계정은 하루 10,000회 호출로 제한된다.
