description_portal: '한국지역난방공사의 플랜트관리시스템 공량산출용 직종 단가 데이터를 정리한 자료로, 공사 및 유지보수 작업에 투입되는 주요 직종별 인건비 기준을 제공하여 공사비 산정 및 예산계획 수립의 표준화에 활용할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 직종코드: 직종을 구분하기 위한 코드값(예시: C002)■ 직종명: 인력 투입 직종명(예시: 건축목공)■ 직종설명: 해당 직종의 주요 업무 내용(예시: 건축물의 축조 및 실내 목구조물의 제작·설치 또는 해체작업 수행)■ 인력구분코드: 투입 인력의 구분(예시: 공사부문, 유지보수부문 등)■ 적용연도: 단가가 적용되는 연도(예시: 2023, 2024, 2025)■ 적용구분: 단가가 적용되는 기간(예시: 상반기, 하반기)■ 단가: 해당 직종의 기준 인건비 단가(예시: 277,894원)3. 활용 예제:■ 플랜트 유지보수 및 공사비 산정 시 직종별 단가 데이터를 기반으로 예산 계획 및 견적서 작성■ 연도별 단가 추이를 분석하여 인건비 상승률 및 공사비 변동요인 분석■ 공사·유지보수 표준단가 데이터베이스(DB) 구축을 통한 원가관리 및 프로젝트 수익성 평가에 활용'
