summary_user: 부산광역시 해운대구에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 상호·시군구명·도로명 소재지·법인 여부를 포함한다. 해운대구 주민이나 금융 소비자가 거래하려는 대부업체가 구에 정식 등록된 곳인지, 어느 주소에 있는지 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호·도로명 주소를 맞춰 보는 방식으로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 대부업 자료와 같은 기관 기준으로 대조하는 데 쓴다.
description_portal: '2025년 9월 12일자 기준  해운대구 대부업(대부업 종류, 대부업 상호, 대부업 주소, 대부업 새주소) 등 현황에 대한 정보입니다.현재 해운대구 등록 대부업체수: 70개해당 자료에 포함된 정보: 1. 등록된 대부업체수, 2. 시군구명, 3. 소재지(도로명), 4. 상호, 5. 법인여부해운대구에 등록된 대부업체 등 위 자료에 궁금한 사항이 있으시면 해운대구청 일자리경제과 051-749-4474로 문의하시면 안내해드리겠습니다. 또한 해운대구에 등록된 모든 대부업체는 금융감독원 사이트에서도 확인 가능함을 알려드립니다.'
