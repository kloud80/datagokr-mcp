summary_user: 위해상품판매차단시스템에 가입한 매장의 사용자 정보를 매장 단위로 담은 파일로, 매장 사업자등록번호·매장명·등록일시·아이디유형을 전국 범위로 담는다(csv 약 867KB). 유통업계 분석가가 위해상품 판매차단에 참여한 매장이 어느 업체이고 언제 가입했는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으며, 매장 사업자등록번호나 매장명을 이름·코드 매핑해 같은 기관의 위해상품·리콜 데이터와 맞춰 보는 정도로만 연결한다.
description_portal: 산업통상자원부 국가기술표준원, 환경부, 식품의약품안전처는 시중에 유통되는 상품을 수거하여 유해물질 포함 여부와 같은 위해성 여부를 판정한 후 위해상품으로 확인된 경우 해당 내용을 공표합니다. 대한상공회의소 유퉁물류진흥원에서 운영 중인 이 시스템은 해당 상품정보를 유통사에 전달하기 위해 등록 및 전송하는데 활용되며, 유통사로 전달된 정보는 이 시스템과 연계된 전국 매장에서는 위해상품의 유통을 차단하는 역할을 수행합니다. 이 데이터는 위해상품판매차단시스템에 가입하여 시스템에 등록된 사용자 정보(업종, 업체) 입니다.
