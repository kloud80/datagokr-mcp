summary_user: 방사성 핵종별로 A형 운반물 허용 최대 방사능(A1·A2값), 면제물질 방사능농도(g당Bq)와 면제 방사능 제한치(Bq), 감마상수를 한 행씩 정리한 참조용 표로, 약 18KB 크기의 전국 단위·비공간 CSV 파일이다. 방사성물질 운반·폐기물 처리·해체 실무자나 방사선안전 분석가가 '특정 핵종을 A형 운반물로 보낼 때 허용 한도는 얼마이고 면제 기준 이하인가'를 확인하거나 감마 선량률을 계산할 때 쓴다. 전역 조인 키가 없어 다른 방사능 측정·폐기물 데이터와는 핵종 이름(핵종)을 직접 맞춰 붙여야 한다.
description_portal: 방사성물질 핵종정보 데이터는  방사성 핵종의 물리적, 방사선학적 특성을 정리한 자료로, 방사선안전관리, 방사성폐기물 처리, 운반, 해체 등 다앙한 원자력 및 방사선 관련 분야에서 사용되며, 본 데이터는 번호, 핵종구분, 핵종, A1값_특정 형태의 방사성물질에 대해 A형 운반물에 허용되는 최대 방사능 값, A2값_A1에 해당하지 않는 다른 방사성물질에 대해 A형 운반물에 허용되는 최대 방사능 값, 면제물질에 대한 방사능농도_단위_g당Bq, 면제물질에 대한 방사능 제한_단위_Bq,감마상수_방사선원에서 방출되는 감마선의 선량률을 계산하는 데 사용로 구성되어 있다.
