summary_user: 한국서부발전이 발전용으로 해외에서 들여온 연료량을 월(년월)별로 국가·유종(호주, 남아공, 두바이, 벙커씨유) 열로 나눠 기록한 집계 파일로, 5,450바이트 규모의 작은 CSV입니다. 에너지 분석가가 서부발전의 연료 도입이 특정 국가에 얼마나 몰려 있는지, 월별로 어떻게 바뀌었는지를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 년월 기준으로 나란히 놓거나 같은 기관(한국서부발전) 자료끼리만 이어 쓴다.
description_portal: 한국서부발전의 전력생산을 위한 연료정보입니다. 연료정보지는 오스트레일리아(호주), 남아프리카공화국(남아공), 두바이 등에서 수입되는 연료량 데이터로 발전소 운영을 위한 해외 연료 도입 현황을 국가별로 구분하여 기록한 자료입니다. 이 데이터는 연료 다변화 전략, 국제 연료 가격 변동 대응, 공급망 리스크 관리에 중요한 지표로 활용됩니다. 또한 국가별 의존도를 파악하여 장기적 수급계획을 수립하고, 탄소중립 목표 달성 및 신재생 에너지 전환 정책과의 연계성을 평가하는 근거 자료로 활용됩니다.
