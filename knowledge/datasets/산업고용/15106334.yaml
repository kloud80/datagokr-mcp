summary_user: 한국동서발전 석탄화력 발전소별·연도별 석탄재(비회·저회)의 발생량과 재활용량을 만톤 단위 집계로 담는다. 연구자나 정책 분석가가 '어느 발전소의 비회 재활용률이 해마다 어떻게 변했나' 같은 자원순환 실적 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전소 이름(pwrSta)과 연도를 맞춰 붙이거나 같은 기관의 대기오염물질·수질 측정 데이터와 이어 쓴다.
description_portal: 한국동서발전에서 오픈API 형태로 제공하는 발전소별 석탄재 재활용 현황 데이터입니다. 이 데이터는 연도별, 발전소별로 비회 발생량·재활용량(만톤), 저회 발생량·재활용량(만톤) 등을 포함하고 있으며, 표준화된 형식을 통해 다양한 시스템과 연계하여 자동화된 데이터 수집·분석이 가능합니다. 이러한 구조를 통해 학계 및 연구기관은 발전소별 자원순환 실적, 연도별 재활용 추이, 발전 부산물의 활용 효율 등을 종합적으로 분석하고, 자원 재활용 정책 개발, 발전소 폐기물 최소화 방안 도출, 에너지 산업의 지속 가능성 제고를 위한 기초 자료로 활용할 수 있습니다.
