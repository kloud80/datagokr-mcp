summary_user: 경기도 내 자동차 배출가스 전문정비 사업장을 한 곳당 한 행으로 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·전화번호·WGS84 좌표를 포함한다. 차량 소유자가 우리 동네에서 영업 중인 배출가스 정비업체를 찾거나, 분석가가 시군별 정비사업자 분포와 폐업 추이를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 주소·좌표 같은 이름·위치 매핑으로만 이어 쓰며, 같은 지방행정 인허가(LOCALDATA) 계열 업종 데이터와 나란히 비교하는 용도가 맞다.
description_portal: 이 데이터는 자동차에서 발생하는 배출가스의 전문 정비를 수행하는 정비사업자에 대한 현황을 정리한 자료입니다. 각 정비사업장의 명칭, 위치, 인허가일자, 영업상태명 등을 포함하고 있으며, 사업장 운영 여부와 환경관리 업무의 특성을 파악할 수 있는 정보를 제공합니다. 주요 항목에는 시군명, 사업장명, 인허가일자, 영업상태구분코드 및 명칭, 폐업일자, 도로명우편번호, 도로명주소, 지번주소, 전화번호 등이 있습니다. 이 데이터는 지역별 배출가스 정비사업자 분포 파악, 환경규제 이행 점검, 정비업체 관리 정책 수립, 자동차 배출가스 저감 정책의 기초자료로 활용될 수 있습니다.
