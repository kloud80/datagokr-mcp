summary_user: 서울시 상권별 상주인구(주거 인구)와 가구 수를 분기 단위로 집계한 데이터로, 포털 설명 기준 상권 1,638개·2019년 4분기~2025년 1분기 22개 분기에 대해 성별·연령대별 인구와 아파트/비아파트 가구 수를 담는다. 예비 창업자나 상권 분석가가 '이 골목상권 주변에 30~40대 주거 인구와 아파트 가구가 얼마나 사는가'처럼 점포 입지의 주거 기반 고객층을 가늠하는 데 쓴다. 전역 조인 키는 없고, 서울시 우리마을가게 상권분석서비스의 다른 데이터(점포·매출·유동인구 등)와는 상권 코드(TRDAR_CD)와 기준 년분기 코드로 같은 기관 코드 체계 안에서 이어 쓴다.
description_portal: 'ㅇ 데이터 개요: 서울시 상권 단위의 상주인구(주거 인구)와 가구 특성을 분기별로 제공하는 집계형 공공데이터입니다. 총합·성별·연령대별(10·20·30·40·50·60+) 인구와 가구수(아파트/비아파트)를 포함합니다.ㅇ 수록 기간: 2019년 4분기(20194) ~ 2025년 1분기(20251), 총 22개 분기.ㅇ 공간 단위: 상권 1,638개(상권_코드 기준). 상권 구분은 4종(골목상권, 전통시장, 발달상권, 관광특구)으로, 건수 기준 분포는 골목상권 23,950, 전통시장 6,466, 발달상권 5,365, 관광특구 132입니다.ㅇ 주요 변수: 총_상주인구_수, 남성/여성 상주인구 수, 연령대별(남녀 합 및 성별 세분) 상주인구 수, 총_가구_수, 아파트_가구_수, 비_아파트_가구_수. ‘기준_년분기_코드’로 시계열 분석이 가능합니다.ㅇ 데이터 품질: 본 파일에서 결측치는 확인되지 않았으며, 총_상주인구_수=남성+여성, 총_가구_수=아파트+비아파트 등 기본 합산관계가 일관됩니다.ㅇ 형식/인코딩: CSV(EUC-KR).ㅇ 활용 예시: 상권별 주거 기반 고객풀 규모 추정, 연령·성별 구조 분석, 상권 유형별(시장·골목·발달·관광특구) 인구 특성 비교, 점포 입지 타겟팅, 도시·상권 활성화 정책 수립 및 모니터링.ㅇ 유의 사항: 상주인구(주거 인구) 중심 데이터로, 유동·직장 인구와는 개념이 다릅니다. 상권 경계 정의 및 분기 기준을 해석에 반영해야 하며, 소지역 소규모 값 해석 시 변동성에 주의가 필요합니다.'
