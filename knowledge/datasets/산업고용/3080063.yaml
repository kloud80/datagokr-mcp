description_portal: 경기도 양주시에서 운영하는 ‘착한가격업소’ 데이터는 지역 소상공인·외식업소 중 착한가격 인증을 받은 업소 정보를 한눈에 확인할 수 있도록 제공한다. 인증 기준은 정가 대비 저렴한 가격을 유지하고, 품질·위생·서비스를 동시에 만족시키는 점포에 부여되며, 해당 업소명, 지정연도, 주소, 연락처 등을 포함하고있다.이 데이터는 소비자가 합리적인 가격에 안전한 식사를 선택하도록 돕고, 착한가격 인증업소의 홍보 효과를 확대함으로써 지역 경제 활성화와 소상공인 경쟁력 강화를 목표로 한다. 또한, 정책 담당자는 인증 현황을 파악해 지원 정책을 설계하고, 연구자는 가격 정책·소비자 행동 분석 등에 활용할 수 있다.  데이터는 CSV·JSON 등 다양한 형식으로 제공되며, 연간 업데이트를 통해 신규 인증업소와 변동 정보를 최신 상태로 유지한다. 이용자는 API를 통해 실시간 검색·필터링이 가능하며, 키워드(착한가격, 소상공인, 외식업소, 인증업소)를 활용해 맞춤형 서비스 개발이나 지역 마케팅에 활용할 수 있다.
