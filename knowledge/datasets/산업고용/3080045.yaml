summary_user: 경기도 양주시에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 건별 원장 파일로, 등록증번호·상호·법인여부·도로명 소재지·등록일자·관리기관을 포함한다. 주민이 거래하려는 대부업체가 양주시에 정식 등록된 곳인지, 관내 어느 동네에 대부업소가 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 붙이거나 같은 기관의 다른 업종 인허가(LOCALDATA) 자료와 나란히 보는 방식으로만 연결한다.
description_portal: 「대부업현황」 데이터는 경기도 양주시 내에서 등록된 대부업체(대부업소)에 관한 정보를 체계적으로 제공하는 공공데이터입니다.대부업은 개인이나 기업에 일정한 이자를 받고 돈을 빌려주는 사업으로 관내 대부업 현황 및 위치정보, 등록일자, 유효기간만료일자 등에 대한 데이터를 포함합니다. 주요 목적은 대부업 시장의 투명성 확보, 소비자 보호, 금융감동, 정책수립 등에 활용됩니다.
