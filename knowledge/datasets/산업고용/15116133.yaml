summary_user: 서울 강남구에서 무료로 구인·구직을 알선하는 직업소개소의 인허가 정보를 업소 한 곳당 한 건으로 담으며, 관리번호·인허가일자·영업상태·폐업일자·주소·전화번호·사업장명·좌표 등을 포함한다. 구직자나 구인 사업자가 강남구 안에서 현재 영업 중인 무료직업소개소의 위치와 연락처를 찾거나, 분석가가 소개소의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
