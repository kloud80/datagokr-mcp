description_portal: 본 데이터는 「에너지이용합리화법」 제31조에 따라, 대통령령으로 정한 기준인 연간 에너지사용량 2,000toe 이상을 소비하는 에너지다소비사업자가 매년 의무적으로 신고하는 에너지 사용 현황을 제공합니다.신고 의무 대상자는 사업장의 소재지를 관할하는 시·도지사에게 매년 초 한국에너지공단이 정한 기준일까지 에너지 사용량을 제출해야 하며, 제공 데이터는 신고한 사업자의 에너지 소비량과 사업장 지역, 사용시설 종류 등을 포함하고 있습니다.본 데이터를 통해 정부 및 지방자치단체는 지역별 에너지 소비 현황을 파악하고 효율적 에너지 정책 수립과 관리·감독에 활용할 수 있으며, 연구기관과 기업은 에너지 소비 패턴 분석 및 효율화 방안 마련에 기초자료로 활용 가능합니다.
