description_portal: '전체 사업체를 단독사업체, 공장·지사·영업소, 본사·본점 등으로 유형 구분하여 사업체 수와 종사자 수를 집계한 자료.사업체의 공간적 분포와 조직 구조를 파악할 수 있어, 지역경제 및 상권 구조 분석 등에 유용하다.활용 목적 및 특징– 단독사업체 중심 지역인지, 본사·지사 분포가 많은 상업중심지인지 등 지역특성 분석 가능– 대형법인의 입지 현황 파악 및 본점·지사 간 고용 분포 비교– 상권 다핵화 여부 및 산업구조 다양성 분석의 기초자료– 도시계획, 창업지원, 유통망 설계 등에도 참고자료로 활용 가능주요 항목 설명● 분류별: 사업체 구분(단독, 지사/영업소, 본사 등)● 단독사업체_사업체 / 종사자: 독립적으로 운영되는 소규모 사업체● 공장_지사_영업소_사업체 / 종사자: 본점 외 지점 형태로 운영되는 사업체● 본사_본점 등_사업체 / 종사자: 지점·영업소 등을 관리하는 본사(본점)'
