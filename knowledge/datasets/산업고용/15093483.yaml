summary_user: 소상공인 교육시스템에서 운영 중인 온라인·오프라인 교육과정의 개설 차수를 한 행씩 담은 건별 목록으로, 차수명·등록일·운영방식(기간과정/상시운영)·교육대상·수료기준·교육환경 등을 전국 단위로 제공한다. 소상공인이나 지원기관 담당자가 '지금 어떤 과정이 어떤 대상과 수료기준으로 열려 있고, 기간제인지 상시운영인지'를 확인하거나 분석가가 과정별 차수 개설 빈도를 살피는 데 쓴다. 개설코드(sbiz_edu_open_cd)가 차수 식별자이고 과정코드(sbiz_edu_course_cd)가 과정 마스터를 가리키는 외래키이므로, 같은 교육시스템의 교육과정 데이터와 과정코드로 이어 쓴다.
description_portal: 교육시스템 운영중인 교육과정 차수(개설) 데이터는 소상공인 교육시스템에서 운영되는 온라인 및 오프라인 교육 과정의 개설 차수별 정보를 제공하며, 과정코드, 차수명, 등록일자, 기관과정명, 학습유형, 교육대상 등 다양한 항목을 포함합니다. 해당 데이터는 교육 차수별 개설 경향을 분석하고, 소상공인의 학습 참여 패턴과 학습환경 특성을 파악하는 데 유용합니다. 또한 교육기관별 운영 전략, 연간 개설 빈도, 맞춤형 커리큘럼 구성 상태를 평가할 수 있어, 소상공인 역량강화 정책 수립이나 현장 중심 교육체계 개선에 활용 가능한 실무 기반 자료입니다.
