description_portal: 한국가스공사 평택기지에서 구축·운영 중인 민간활용 가능 가상체험 훈련설비 현황에 관한 자료입니다. 가상체험 훈련설비는 국내 동종업계에서 공통 사용하는 산업설비에 대해 안전하게 체험훈련할 수 있는 시뮬레이션 환경을 제공합니다. 본 데이터는 훈련설비 현황 공개 및 유관기관 훈련 지원을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 훈련설비명, 훈련설비 상세 내용, 구축일, 설치장소, 훈련대상, 훈련내용 등이 포함되어 있습니다. 본 데이터를 활용하면 민간 활용 가능 훈련설비 현황 파악, 유관기관 체험훈련 프로그램 기획 및 운영, 안전교육 협력 체계 구축, 공사 대국민 홍보에 기초자료로 활용할 수 있어 산업안전 역량 강화와 사회공헌 활동 확대에 기여할 것으로 기대됩니다.
