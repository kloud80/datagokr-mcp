summary_user: 한국남부발전이 지분을 가진 자회사·출자회사 현황을 회사 한 곳당 한 행으로 정리한 소규모 CSV 파일(약 2KB)로, 출자회사명·지분율·소재 국가(또는 시도)·취득가액(백만원)·사업내용·종속회사 여부를 담는다. 국민이나 공공기관 경영 분석가가 "남부발전이 해외 발전소·광산·연료 사업에 어느 회사에 얼마의 지분으로 투자했는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 공기업 출자회사 자료나 기업 정보와는 출자회사명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 한국남부발전이 보유한 자회사 및 출자회사의 현황을 정리한 자료입니다. 각 회사별로 출자회사명, 지분율, 위치한 국가(또는 지역), 취득가액, 사업내용, 종속회사 여부를 포함하고 있어 공기업의 투자 구조와 운영 범위를 투명하게 확인할 수 있습니다. 사업 분야에는 해외 발전소 운영, 광산 개발, 연료 확보, 발전소 개발 투자 등이 포함되어 있으며, 이를 통해 한국남부발전이 글로벌 에너지 산업에서 어떠한 역할을 수행하는지 알 수 있습니다. 본 데이터는 국민이 공공기관의 해외 투자 현황을 쉽게 파악할 수 있도록 하며, 연구자와 정책 담당자는 기업의 지분 구조, 투자 성과, 에너지 산업의 국제적 확장성을 분석하는 데 활용할 수 있습니다. 또한 기업 지배구조의 투명성을 높이고, 지속가능한 발전 전략 수립과 공공기관 경영 평가에도 중요한 기초 자료로 쓰일 수 있습니다.
