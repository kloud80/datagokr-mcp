summary_user: 서울 행정동별로 분기마다 상권 변화 유형(정체·상권축소·상권확장·다이나믹)과 운영·폐업 점포의 평균 영업개월을 담은 집계 지표로, 포털 설명 기준 2019년 1분기~2025년 1분기 25개 분기, 425개 행정동, 10,625건이다. 창업 예정자나 소상공인 정책 담당자가 '우리 동네 상권이 확장 중인지 축소 중인지, 가게들이 서울 평균보다 오래 버티는지'를 확인하는 데 쓴다. 행정동 코드(ADSTRD_CD)와 기준 년분기 코드로 같은 서울시 상권분석서비스의 다른 행정동 단위 지표와 이어 쓰며, 실측에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 행정동 이름·코드 매핑으로 연결해야 한다.
description_portal: 'ㅇ 데이터 개요: 「서울시 상권분석서비스(상권변화지표-행정동)」 CSV로, 2019년 1분기부터 2025년 1분기까지 25개 분기, 서울 425개 행정동의 분기별 상권 변화 유형과 영업개월 지표를 제공합니다(총 10,625건, 첨부 파일 기준).ㅇ 주요 필드: 기준_년분기_코드(예: 20251=2025년 1분기), 행정동_코드/명, 상권_변화_지표·명, 운영_영업_개월_평균, 폐업_영업_개월_평균, 서울_운영/폐업_영업_개월_평균.ㅇ 지표 분류: 상권_변화_지표 코드는 HH=정체, HL=상권축소, LH=상권확장, LL=다이나믹으로 매핑됩니다(파일 열 ‘상권_변화_지표_명’ 참조).ㅇ 활용 목적: 행정동 단위의 상권 변화 모니터링, 소상공인 지원·정책 대상 지역 선별, 창업 입지 진단, 분기별 서울 평균 대비 지역의 영업 지속성(운영·폐업 영업개월) 비교 등에 활용할 수 있습니다.ㅇ 통계 요약(전체): 10,625건 기준 분포는 다이나믹 38.1%, 정체 27.9%, 상권축소 18.7%, 상권확장 15.3%입니다(첨부 CSV 산출).ㅇ 통계 요약(최신 분기): 2025년 1분기(코드 20251) 425개 행정동 기준 다이나믹 38.1%, 정체 27.1%, 상권축소 17.9%, 상권확장 16.9%입니다.ㅇ 주의 사항: 본 데이터는 분기·행정동 단위 지표 중심이며 업종별 매출 등 세부 상거래 데이터는 포함되어 있지 않습니다'
