description_portal: 한국수력원자력(주) 원자력발전소의 한 주기 무고장 운전 현황을 알려드립니다. 한 주기 무고장 운전 현황이란 이전 계획예방정비 준공 이후 당해 계획예방정비를 위한 계통 분리까지 발전소 귀책의 설비고장이나 인적실수에 의한 발전정지 없이 운영된 주기를 뜻합니다.
