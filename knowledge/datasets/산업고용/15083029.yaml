summary_user: KS 인증을 받은 신재생에너지 설비를 모델 단위로 담은 파일 데이터로, 전국 7,482건(인증만료일 기준 2012-12-14~2029-11-27)에 업체명·모델명·제조국·제조사·기술기준규격·인증만료일을 싣는다. 설비를 고르는 사업자나 시장을 분석하는 연구자가 특정 제조사·모델의 KS 인증 보유 여부와 만료 시점을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·모델명 이름 매핑이나 같은 기관 코드로만 잇고, 발전소 단위 주소·용량이 필요하면 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 원장을 별도로 찾아 이름으로 대조한다.
description_portal: 신재생설비인증제도는 신재생에너지 보급 및 국가 에너지정책 목표 달성을 위해 국가 보조금 지원 대상이거나 의무 설치가 필요한 신재생에너지 설비의 품질과 성능을 정부가 엄격히 심사하여 KS(한국산업표준) 인증을 부여하는 국가인증제도입니다. 정부가 규정한 인증심사기준과 제품의 성능 및 품질 기준을 모두 충족한 설비에 대해서만 인증서를 발급하고 KS마크 표시를 허용합니다.본 데이터는 KS 인증을 획득한 신재생에너지 설비의 상세정보를 제공하며, 주요 항목으로는 번호, 업체명, 모델명, 제조국, 제조사, 기술기준규격, 인증만료일, 비고 등이 있습니다. 본 데이터는 신재생에너지 설비 선택, 정책 평가, 연구 및 시장분석의 기초자료로 폭넓게 활용 가능합니다.
