summary_user: 서울시 전체를 대상으로 기준 분기(STDR_YYQU_CD)별 아파트 단지 수, 전용면적 구간별·가격대별(1억 미만~6억 이상) 가구 수, 가구당 평균 전용면적과 평균 시세를 담은 집계 데이터이며, 단지·가구 단위 원천 자료가 아니라 시도 단위 요약이다. 상권 분석가나 창업 준비자가 "서울 아파트 가구의 면적·가격 구조가 분기마다 어떻게 바뀌어 상권 배후 수요에 영향을 주는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준 분기와 시도 코드·이름(MEGA_CD, MEGA_CD_NM)을 맞춰 같은 서울시 상권분석서비스 계열 데이터와 이어 쓴다.
description_portal: 이 데이터는 서울시 전체를 대상으로 아파트 세대수와 가구 특성을 면적 및 가격 구간별로 구분하여 제공합니다. 아파트 단지 수(HSMP), 전용면적 기준(66㎡ 이하, 66㎡, 99㎡, 132㎡, 165㎡ 이상)별 가구 수, 가구당 평균 전용면적, 평균 시세(거래가격) 등의 주거지표가 포함되어 있습니다. 또한 가격대별 가구 분포(1억 미만, 1억대, 2억대, 3억대, 4억대, 5억대, 6억 이상) 정보를 통해 서울 아파트 시장의 가격 구조를 파악할 수 있습니다. 이를 통해 주택 시장 분석, 부동산 정책 수립, 가구 특성 연구 등 다양한 공익적 활용이 가능하며, 서울시 아파트 시장의 변화 추이를 모니터링하는 데 중요한 기초 자료가 됩니다.
