summary_user: 서울시에 있는 전통시장을 시장 한 곳당 한 행으로 담은 목록으로, 시장명과 시·구·동 행정구역명을 영어로 표기하고 시장 웹주소와 중심좌표(X·Y)를 함께 싣는다. 외국인 대상 관광 안내나 영어 지도 서비스를 만드는 사업자가 '서울의 어느 구·동에 어떤 전통시장이 있고 위치가 어디인가'를 영문으로 보여줄 때 쓴다. 실측 컬럼에 다른 데이터와 바로 묶을 공통 코드 키가 없어서, 구·동 영문명이나 시장명을 매핑하거나 좌표를 공간 결합해 국문 전통시장 현황이나 상가업소 데이터와 이어 쓴다.
description_portal: 서울시 전통시장 현황(영어) 데이터는 서울시에 위치한 전통시장의 기본 정보를 영문으로 제공하는 자료입니다. 시장명을 비롯해 행정시, 행정구, 행정동을 영어 표기로 제공하여 외국인 방문객, 영어 기반 서비스, 국제 관광 콘텐츠 제작 등에 활용하기 적합합니다. 각 전통시장별 웹주소 정보가 포함되어 있어 상세 안내, 행사, 점포 정보 등 추가 정보를 연계해 확인할 수 있습니다. 또한 중심좌표 X, 중심좌표 Y 항목을 통해 WGS84 좌표계 기반의 위치 정보를 제공하므로, 지도 서비스, 내비게이션, 위치기반 관광 안내 시스템 등과 연동하여 전통시장 분포 분석 및 접근성 검토에 활용할 수 있는 데이터입니다.
