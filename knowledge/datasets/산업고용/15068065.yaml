description_portal: 한국광해광업공단은 석탄산업의 생산 기반 유지와 연탄의 안정적인 공급을 위해 석·연탄산업 지원 사업을 실시하고 있습니다.이 데이터는 무연탄의 부분별 소비 실적을 상세히 기록하여, 각 부문별 소비 패턴을 분석하고 정책 수립에 활용할 수 있는 중요한 기초 자료를 제공합니다. 특히, 연탄 제조 및 수송업체, 발전소, 산업용 등 다양한 부문별 소비 데이터를 통해 무연탄의 수요 구조를 명확히 파악할 수 있습니다.이러한 정보는 무연탄 수급 안정성을 높이고, 에너지 정책 및 산업 구조 조정에 필요한 실증적 근거를 제공하며, 폐광지역의 고용 창출 및 자원 효율적 활용 방안을 모색하는 데에도 기여합니다.
