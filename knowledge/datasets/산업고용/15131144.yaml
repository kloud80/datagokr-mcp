description_portal: '한국산업기술진흥원의 사업 추진과정에서 구축된 정보시스템 및 활용실적입니다. 본 데이터는 한국산업기술진흥원에서 수행한 다양한 사업들의 진행 과정에서 수집된 정보시스템의 구축 현황 및 이 시스템의 활용 결과를 구체적으로 보여줍니다. 제공되는 정보에는 각 정보시스템명, 시스템의 구체적인 구축내용, 시스템을 통해 발생된 정보건수 등이 포함되어 있습니다. 이러한 데이터는 공공기관의 투명성을 높이고, 데이터 기반의 정책 수립 및 의사 결정에 기여할 수 있습니다. 또한, 연구 개발 및 기업의 성장 지원을 위하여 상시 활용될 수 있으며, 진흥원이 지원하는 사업에 대한 시각화를 통해 관련자들이 쉽게 이해할 수 있도록 돕습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다."번호"(숫자형) : 데이터 항목의 고유 번호"성과발생년도"(숫자형) : 성과가 발생한 연도"정보시스템명"(문자형) : 구축된 정보시스템의 이름"구축내용"(문자형) : 시스템의 세부 구축 내용"수혜자수"(숫자형) : 해당 시스템의 수혜자 수"정보건수"(숫자형) : 생성된 정보의 수"등록일"(날짜형) : 데이터가 등록된 일자이와 같은 데이터를 통해 연구자나 기업들은 과거의 사례를 분석하여 현재와 미래의 사업 방향을 설정하는 데에 유용하게 활용할 수 있습니다.'
