summary_user: 대전광역시 서구 관내 석유판매업 영업소를 한 곳씩 담은 건별 목록으로, 영업소마다 주유소·일반판매소 구분(사업구분), 상호, 도로명 소재지를 담는다. 주민이나 분석가가 서구 안 주유소와 일반판매소가 어디에 얼마나 있는지, 업종별 분포를 확인할 때 쓴다. 전역 조인 키가 없어 다른 자료와는 상호나 도로명주소를 맞춰 붙여야 하며, 오피넷 주유소 가격 정보나 LOCALDATA 에너지 업종 인허가 원장과 이렇게 대조해 쓴다.
description_portal: 이 데이터는 대전광역시 서구 관내 석유판매업 영업소의 현황을 정리한 자료입니다. 석유판매업은 주유소와 일반판매소 등으로 구분되어 관리되는 업종으로, 안전관리와 유통 질서 유지를 위해 관련 정보의 체계적인 관리가 필요합니다.데이터에는 사업구분 항목을 통해 해당 영업소가 주유소인지 일반판매소인지를 구분할 수 있으며, 각 영업소의 상호명과 영업소소재지(도로명주소)가 함께 제공되어 위치 확인과 업종별 분포 파악이 가능하도록 구성되어 있습니다. 이 자료는 관내 석유판매업소의 관리 및 현황 파악을 위한 기초 정보로 활용됩니다.
