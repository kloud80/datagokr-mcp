description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 물류 및 에이전트 관련 정보를 2018년 8월 기준으로 정리한 자료입니다. 각 데이터 항목은 협력업체명, 상품군, 품종, 브랜드명, 최초 입점일자, 입점일자, 퇴점일자, 조건변경일, 조건기준, 거래조건, 결제조건, 공급통화, 결제통화, 세무코드, 선적지, 운송수단 등으로 구성되어 있으며, 협력업체명은 상품을 공급하는 기업의 명칭을, 브랜드명은 취급 브랜드를 나타냅니다. 상품군은 수입, 환급대상상품, 국산으로 나뉘며, 품종 항목은 브랜드 내 제품의 세부 분류를 의미합니다. 최초 입점일자와 입점일자, 퇴점일자는 브랜드의 입점 및 퇴점 이력을 나타내며, 조건변경일과 조건기준은 계약 조건이 변경된 시점과 관련 기준을 포함합니다. 거래조건 및 결제조건은 제품 공급 및 대금 정산 방식, 공급통화와 결제통화는 각각 거래 시 사용되는 통화 종류를 나타냅니다. 세무코드는 세금 처리와 관련된 항목이며, 선적지와 운송수단은 물류 출발지와 운송 방식을 뜻합니다. 이 데이터는 면세점의 공급망 구조, 물류 흐름, 거래 조건의 변동 사항 등을 종합적으로 파악하는 데 유용하며, 계약 관리, 품목별 운영 효율성 분석, 물류 전략 수립 등 실무 및 정책 목적에 폭넓게 활용될 수 있습니다.
