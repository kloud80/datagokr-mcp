summary_user: JDC지정면세점에 상품을 공급하는 협력업체별로 브랜드·상품군(수입·환급대상·국산)·품종, 입점·퇴점 이력, 거래·결제 조건, 공급통화, 선적지·운송수단을 한 행씩 담은 2018년 8월 기준 원천 목록 파일(CSV 약 75KB)이다. 유통·물류 분석가가 "제주 지정면세점에 들어온 수입 브랜드는 어느 선적지에서 어떤 운송수단으로 들어오고, 어떤 통화로 거래하는가" 같은 공급망 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 협력업체명·브랜드명 같은 이름을 맞춰서만 이어 쓴다.
