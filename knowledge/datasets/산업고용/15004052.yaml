description_portal: 한국동서발전의 국내외 신규에너지 개발 정보 데이터입니다. 데이터는 구분, 사업명, 설비용량(MW), 설비수량, 건설기간, 특수목적법인(SPC) 구성, 위치 등의 항목으로 구성되어 있습니다. 본 데이터는 동서발전이 국내외에서 추진 중인 신재생에너지 및 신사업 관련 프로젝트의 전반적인 규모와 구조를 파악할 수 있게 해줍니다. 설비용량과 수량, 건설기간 등의 정보를 통해 사업의 기술적·경제적 특성을 분석할 수 있으며, SPC 구성 정보를 통해 민간 및 공공의 협력 구조도 이해할 수 있습니다. 학계 및 연구기관에서는 이 데이터를 활용하여 국가별 또는 에너지원별 사업 특성 분석, 신재생에너지 보급 속도 비교, 에너지정책 효과성 검토, 민간투자 모델 평가 등에 유용하게 활용할 수 있습니다.
