summary_user: 경기도 시군별로 건설기계 종합·부분·원동기·유압·타워크레인 정비업과 일반·개별 대여업, 매매업, 폐기업 등록 업체 수를 집계한 표로, 업체 건별 원장이 아니라 시군 단위 집계다. 건설장비 업계나 지자체 분석가가 '우리 시군에 타워크레인 정비업체나 건설기계 대여업체가 몇 곳 등록돼 있나'를 확인하고 지역 간 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 시군명(SIGUN_NM)이나 시군코드(SIGUN_CD)로 같은 경기도 시군 단위 통계와 이름·코드 매핑해 연결한다.
description_portal: 이 데이터는 경기도 내 시군별 건설기계 관련 정비 및 대여 사업자의 등록 현황을 집계한 자료로, 건설기계관리법에 따라 등록된 정비업 및 매매업체 등의 분포를 파악할 수 있습니다. 주요 항목으로는 시군명, 종합정비업, 부분정비업, 원동기정비업, 유압정비업, 타워크레인정비업, 일반대여업, 개별대여업, 매매업, 폐기업 수 등이 있으며, 각 정비 유형별로 등록된 업체 수를 제공합니다. 이 데이터는 건설장비 산업 구조 분석, 지역별 건설기계 인프라 현황 파악, 정비업체 분포도 시각화, 중장비 관련 정책 수립 등에 활용될 수 있는 공공산업 데이터입니다.
