summary_user: 경기도 내 토양전문기관과 토양정화업체를 기관 한 곳당 한 행으로 담은 현황 목록으로, 집계 연도·시군·구분(정화업 구분 등)·기관명·대표자·소재지 주소·연락처·주요 점검사항·반입정화시설 소재지·위경도 좌표를 포함한다. 토양오염 조사나 정화가 필요한 사업자나 지자체 담당자가 '우리 시군 근처에 어떤 토양정화업체가 있고 반입정화시설은 어디에 있는가'를 찾을 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명이나 기관명·주소를 이름 매칭해 다른 경기도 시군 데이터와 연결하고, 위경도 좌표로 지도에 올려 쓴다.
description_portal: 이 데이터는 경기도 내 토양환경 관리와 관련된 전문기관 및 정화업체에 대한 현황을 제공하며, 기관명, 대표자명, 소재지(도로명 및 지번 주소), 연락처, 주요 점검사항, 반입정화시설 소재지, 위경도 좌표(WGS84 기준) 등의 항목으로 구성되어 있습니다. 해당 기관들은 토양 오염 조사, 정화사업 수행, 환경 점검 등의 업무를 담당하며, 지역별 분포 현황을 바탕으로 토양오염 대응 역량을 파악할 수 있습니다. 정화업 구분에 따라 업무범위가 달라지며, 반입정화시설 주소 정보는 토양 반입처리 및 정화작업 수행 위치를 확인하는 데 활용됩니다. 본 데이터는 연간 갱신되며, Open API를 통해 시군별 기관정보 접근이 가능하여 환경 정책 및 정화사업 기획에 실질적인 근거자료로 활용됩니다.
