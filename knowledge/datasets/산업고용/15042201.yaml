description_portal: 한국동서발전의 장애인 생산제품 구매 현황 정보는 공공기관으로서 장애인 기업 및 보호작업장 등에서 생산한 제품에 대한 구매 실적을 정리한 데이터입니다.데이터는 연도, 장애인 생산물 유형, 전체 물품 구매액(천 원), 장애인 생산품 구매액(천 원), 장애인 생산품 구매비율 등의 항목으로 구성되어 있으며, 연도별로 전체 구매 금액 중 장애인 생산품이 차지하는 비중을 확인할 수 있습니다.이 데이터는 공공기관의 사회적 가치 실현 노력과 장애인 기업에 대한 경제적 지원 수준을 정량적으로 파악하는 데 유용하며, 장애인 생산품의 구매 확대를 통한 사회적 포용 정책의 실천 현황을 반영합니다.학계 및 연구기관에서는 이 데이터를 활용하여 공공조달에서의 사회적 배려 계층 지원 실태 분석, 구매 비율 변화에 따른 정책 이행 평가, 장애인 생산물 유형별 수요 구조 분석 등을 수행할 수 있습니다.또한 타 공공기관과의 비교 연구, ESG 경영 관점에서의 사회적 책임 이행 사례 분석, 장애인 고용 및 자립 기반 강화 정책과의 연계 효과 분석에도 폭넓게 활용될 수 있습니다.
