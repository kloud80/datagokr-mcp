summary_user: 서울특별시 양천구에 있는 비디오물제작업소(영화 같은 비디오물을 만들거나 복제하는 업소)의 인허가 내역을 업소 한 곳당 한 행으로 담는다. 업소명, 인허가일·취소일, 영업상태와 폐업·휴업 일자, 지번·도로명 주소, 전화번호, 좌표(X·Y), 시설면적, 제작취급품목, 건물 층수 같은 항목이 들어 있다. 사업자나 이용자는 '양천구에서 지금 영업 중인 비디오물제작업체가 어디 있고 언제 인허가를 받았나'를 확인할 때 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없어서, 다른 데이터와는 업소명·주소를 맞추거나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구 내 비디오물제작업체의 인허가 현황을 체계적으로 수집하고 공개하기 위해 제공되는 자료이다. 데이터에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 제작취급품목 등의 항목이 포함되어 있다. 이를 통해 이용자와 관계자는 제작업체의 적법성을 확인할 수 있으며, 행정기관은 인허가 관리와 정책 수립에 활용할 수 있다. 자료는 주기적으로 갱신되어 최신 정보를 제공하며, 표준화된 형식으로 정리되어 있어 사용자가 이해하기 용이하다. 본 데이터는 투명한 영상 제작 환경 조성과 건전한 콘텐츠 산업 활성화에 기여한다.* 비디오물제작업 - 영화제작과 같은 비디오물을 제작하거나 복제하는 업소
