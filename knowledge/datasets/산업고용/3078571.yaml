description_portal: “공중위생영업”이라 함은 다수인을 대상으로 위생관리서비스를 제공하는 영업으로서 숙박업ㆍ목욕장업ㆍ이용업ㆍ미용업ㆍ세탁업ㆍ건물위생관리업을 말합니다.공중위생관리법 제2조의 공중위생영업소(다수인을 대상으로 위생관리서비스를 제공하는 영업으로서 숙박업, 목욕장업, 이용업, 미용업, 세탁업, 건물위생관리업을 말함) 현황 리스트 데이터입니다. 충청남도 천안시에 등록되어있는 일반숙박업, 생활숙박업, 목욕장업, 이·미용업소, 세탁업소 및 건물위생관리업에 대한 영업장 정보를 개인정보를 제외하고 각 항목별로 작성한 리스트입니다. 천안시 관내 공중위생업소에 대한 데이터(업종명, 업소명, 소재지주소(도로명&지번), 소재지 전화번호 등)가 필요하실 경우 해당 자료를 참조하여 주시면 감사하겠습니다. 업종명은 업소의 종류, 업소명은 등록된 상호, 주소는 도로명 기준 위치 정보를 의미합니다. 정기적인 연간 업데이트를 통해 최신 정보가 반영되며, 민원 대응, 정책기획, 위생 점검 대상 선정 등 보건행정 및 도시서비스 개선의 기초자료로서 유용한 공공데이터입니다. 이 자료는 주민과 방문객이 필요한 생활편의 서비스를 손쉽게 찾을 수 있도록 지원하며,  공공정책 추진에 근거자료로 활용됩니다. 또한, 관광숙박시설이나 외국인전용민박 업소는 해당 자료에 포함되어 있지 않으니 별도의 자료를 찾아 주시기 바랍니다. 감사합니다.
