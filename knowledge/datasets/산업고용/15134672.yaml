summary_user: 국토교통부 골재자원조사에서 조사한 지역을 건별로 담으며, 지역마다 골재 종류, 조사면적·부존면적(제곱미터), 부존량·개발가능량(세제곱미터)과 조사 범위를 나타내는 최소·최대 위경도가 들어 있다(전국 범위, 11,818바이트 CSV 파일). 골재 수급을 검토하는 지자체·분석가나 골재채취 사업자가 '어느 시군에 어떤 골재가 얼마나 묻혀 있고 실제로 개발 가능한 양은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 조사지역 이름을 행정구역명과 맞추거나 위경도 범위를 토석채취 허가 구역·국토 공간 규제 같은 공간 데이터와 겹쳐 보는 방식으로 이어 쓴다.
description_portal: 골재자원 확보는 국가적 과제로 설정되어 정부에서는 1992년부터 골재의 안정적인 수 급과 기초조사 등을 총괄하는 골재채취법 제정을 하여 국토교통부 주관으로 매 5년 주기의 골재수급계획을 수립하여 추진하고 있으며, 매년 골재수급계획을 수립하여 골재수급의 안정화를 추진하고 있음, 이를 뒷받침 하기 위해 전국 시, 군 단위로 수급동향, 골재 개발 필요성 및 지자체 요청 등 우선순위에 따라 2007년부터 매년 6~8개 시군을 대상을 선정함 ※ 22~25년(3개년) 골재자원정보관리시스템 고도화 추진 중으로 해당 목록은 변경 될 수 있음
