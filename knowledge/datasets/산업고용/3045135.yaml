summary_user: 경기도 안양시 관내에 등록된 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 목록으로, 상호·도로명 소재지·전화번호만 들어 있으며 파일은 약 6KB 크기의 CSV입니다. 시민이 거래하려는 대부업체가 안양시에 정식 등록된 곳인지 상호와 전화번호로 확인하거나, 분석가가 시내 대부업체 분포를 주소 기준으로 살펴보는 데 쓴다. 사업자번호나 공통 코드 같은 조인 키가 없어서 다른 데이터와는 상호명이나 도로명 주소를 맞춰 보는 방식으로만 잇고, 연결 대상으로는 같은 업종 인허가 계열인 지방행정 인허가(LOCALDATA) 대부업 원장이나 소상공인 상가업소 데이터를 생각할 수 있다.
description_portal: 안양시 관내  대부업체 현황(상호,소재지,전화번호 제공) 데이터 정보입니다.항목설명대부업체 상호명-등록된 대부업 또는 대부중개업체의 공식 명칭소재지-업체의 위치 정보전화번호-업체 대표 연락처본 데이터는 경기도 안양시 관내에 등록된 대부업 및 대부중개업체의 현황 정보를 제공합니다.「대부업 등의 등록 및 금융이용자 보호에 관한 법률」에 따라 등록된 업체의 상호명, 소재지, 전화번호 등의 기본 정보를 포함하며, 지역 내 금융서비스 현황 파악, 소비자 보호 정책 수립, 불법 대부업 예방 등을 위한 행정 및 민간 활용에 유용한 자료입니다.데이터는 연 1회 갱신되며, CSV 및 오픈 API 형식으로 제공됩니다.
