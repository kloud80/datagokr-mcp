summary_user: 중소벤처기업진흥공단 신성장기반지원자금의 내역 사업인 스케일업금융(P-CBO 방식)으로 2024년에 지원받은 업체를 업체 단위로 담은 파일로, 포털 설명상 112개사이며 업종·지역·종업원규모·매출규모·업력·기업형태·지원차수·지원금액(백만원)을 담는다. 정책 분석가나 중소기업 지원 담당자가 '대규모 자금이 필요한 중기업 지원이 어떤 업종·지역·규모에 몰렸는가'를 확인하는 데 쓴다. 조인 키는 공단 자체 업체번호(sbc_fund_company_no)뿐이라 같은 업체번호를 쓰는 공단 정책자금 데이터와만 직접 이을 수 있고, 사업자번호가 없어 벤처·이노비즈 같은 기업 확인·인증 원장과는 바로 연결되지 않는다.
description_portal: 동 데이터는 중소벤처기업진흥공단 정책자금 중 하나인 신성장기반지원자금의 내역 사업인 스케일업금융(자산유동화증권, PCBO 지원형태) 2024년 지원업체의  업종, 지역, 종업원규모, 매출규모, 업력, 지원금액 등의 정보를 제공합니다. 스케일업금융은 혁신성장 가능한 중기업의 대규모 자금조달 애로를 해소하여 스케일업을 지원(P-CBO 방식) 함으로써 중견기업으로의 도약을 지원하는 사업이며, 중소기업진흥에 관한 법률 제66조에 근거하고 있습니다. 2024년 스케일업금융의 예산은 1,000억이며, 총 112개사를 지원했습니다.
