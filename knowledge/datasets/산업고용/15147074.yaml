description_portal: 서울시 강서구 내 담배도매업 허가 현황을 담고 있으며, 담배를 공급하거나 타 소매업자에게 유통하는 도매업체에 대한 행정 정보를 포함합니다. 해당 업종은 「담배사업법」에 따라 규제되며, 허가 및 폐업, 취소, 직권취소 등 다양한 상태의 업체들을 포함하고 있어 유통 구조 분석, 공공 건강 정책 수립, 지역별 담배 유통량 추정 등에 활용될 수 있습니다. 데이터에는 관리번호, 인허가일자, 인허가취소일자, 영업상태명, 상세영업상태명 등의 항목이 포함되어 있으며, 도매업체의 변화 추세 및 지속성 분석에도 유용한 자료입니다. 또한 흡연률 감소 정책과 관련한 민간 유통업의 동향 파악, 담배 소비와 공급망 구조 이해, 공공의 건강을 위한 정책 평가 등에도 활용 가능합니다.
