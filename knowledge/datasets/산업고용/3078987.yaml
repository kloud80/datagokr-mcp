summary_user: 경기도 고양시 관내에서 허가·등록을 마치고 영업 중인 가스 사업자(고압가스 제조, LPG 충전·판매 등)를 사업자 한 곳당 한 행으로, 구분·상호·소재지·전화번호를 담은 소규모 CSV 파일(3,408바이트)이다. 고양시 주민이나 사업자가 '우리 동네 LPG 판매·충전소가 어디에 있고 연락처가 무엇인가'를 확인하거나, 분석가가 시 관내 가스 공급 주체의 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·소재지 주소를 기준으로 맞춰 이어야 하며, LOCALDATA 에너지 업종 인허가 원장과 대조할 때도 이름·주소 매칭에 의존한다.
description_portal: 경기도 고양시 관내에서 「고압가스 안전관리법」, 「액화석유가스의 안전관리 및 사업법」 등 관련 법규에 따라 정식으로 허가 또는 등록을 마치고 가스 관련 사업을 운영하고 있는 모든 사업자들의 기본 정보를 체계적으로 수집 및 정리하여 제공하는 공공 데이터입니다.제공되는 정보는 크게 고압가스(수소) 제조 사업자, 액화석유가스(LPG) 충전 및 판매 사업자 등 고양시의 에너지 인프라를 구성하는 핵심 주체들을 포함합니다. 이 자료는 고양시의 가스 공급 안정성 확보, 지역 에너지 정책 수립, 가스 시설물에 대한 효율적이고 정기적인 안전 점검 계획 수립에 필수적인 기초 자료로 활용됩니다.더 나아가, 시민 및 민간 기업은 이 데이터를 통해 지역 내 가스 공급 및 유통 구조를 파악하고, 비상 상황 발생 시 신속한 안전 관리 체계를 구축하며, 관련 산업의 동향 분석 및 사업 기회 모색 등 다방면으로 활용할 수 있도록 고안되었습니다. 궁극적으로는 고양 시민의 안전과 편익 증진에 기여하는 것을 목표로 합니다.
