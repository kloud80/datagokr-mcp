description_portal: 한국가스공사의 연도별 월별 전국 천연가스(LNG) 시설이용 공급량을 나타낸 자료이며, 해당 자료의 단위는 톤(ton) 단위 입니다. 공공데이터의 공개 대상 자료는 2009년도 1월부터 현재까지의 기간동안 한국가스공사의 연도별 월별 전국의 천연가스(LNG) 시설이용 공급량(ton)을 포함하고 있습니다. 민간 직도입자가 가스공사 배관망을 이용하여 전국의 각 수요처에 공급한 천연가스(LNG) 월별 총 공급량(ton) 입니다. 직도입자가 해외로 부터 가스를 구매하여 가스공사 배관망 이용료를 지불하고 사용한 가스 사용량(ton) 이며 월별 사용량 자료 입니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일 형식입니다.
