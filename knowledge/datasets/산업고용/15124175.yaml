summary_user: "한국지역난방공사 사업장의 배출시설별 온실가스 배출활동을 기준연도·사업장·배출시설·배출활동 순번 단위로 담은 파일로, 배출활동 종류(예: 기체연료연소), 사용 연료, 규정·적용 산정등급, 산정식, 바이오매스 관련 여부를 기록한다. 에너지·환경 분석가가 '지역난방 사업장은 어떤 연료를 어떤 산정방식으로 태우며, 연도별로 대체 연료 전환 여지가 있는가'를 따질 때 쓴다. 연료코드(kdhc_fuel_cd)와 산정식ID(ghg_formula_id)를 키로 같은 기관의 온실가스 배출량·연료 사용량 자료와 이어 쓰고, 발전소 단위 측정 자료라 주변 환경·기상 데이터와 교차 분석에 쓴다."
