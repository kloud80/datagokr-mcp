summary_user: 한국서부발전 석탄화력발전소에서 나온 석탄재의 발생량과 재활용량을 발전소별·석탄회 유형별·월별(년월)로 정리한 집계 파일(CSV, 약 36KB)이다. 발전소 환경관리 분석가나 자원순환 정책 담당자가 '서부발전 발전소별 석탄재 재활용률이 월별로 어떻게 변했나' 같은 질문에 쓴다. 전역 조인 키는 없어 발전소명·년월로 맞춰 다른 발전공기업(남동·남부·동서·중부)의 같은 표준 석탄재활용 현황이나 같은 기관의 발전소 배출 측정 데이터와 이어 쓴다.
