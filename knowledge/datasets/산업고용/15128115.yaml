description_portal: 해당 데이터는 한국가스공사 평택기지본부의 최근 5개년 동안의 월별 천연가스 송출량을 분석한 자료입니다. 기간, 송출량으로 구분되어 있으며, 송출량은 톤 단위로 기재하였습니다.해당 자료는 주배관 송출량과 발전소 직공급, 탱크로리 출하량, 실험용 충전설비, LNG 충전소 물량을 합산한 값입니다.(24년 12월 이후 발전소 직공급 중단)최근 5개년 간의 송출량 추이 및 경향성을 분석할 수 있고, 계절성 등을 분석 가능한 자료입니다.타 기지 송출량 데이터와 연계하여 송출분담률 등을 분석할 수 있습니다.
