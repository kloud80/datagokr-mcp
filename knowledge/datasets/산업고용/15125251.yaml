summary_user: 한국남부발전 발전소(빛드림본부)의 호기별로 황산화물·질소산화물·먼지의 배출 기준값과 월 평균 배출농도를 년월(ym) 단위로 담는 API이다. 지역 주민이나 환경 분석가가 특정 발전소 호기의 월별 대기오염물질 배출농도가 기준 대비 어느 수준인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소명(orgNm)·호기명 같은 이름 매핑으로만 발전소 현황 자료나 다른 발전사 배출 데이터, 주변 환경기상 측정과 연결한다.
limits: 표준 시설 코드 같은 조인 키가 없어 다른 데이터와 붙이려면 발전소명·호기명을 직접 맞춰야 한다. 행정구역 단위의 공간 정보가 없는 비공간 데이터라 지도·지역별 집계에 바로 쓰기 어렵다. 개발계정은 하루 10,000회로 호출이 제한된다.
