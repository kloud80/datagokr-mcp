description_portal: 본 API는 한국남부발전(주) 대기오염물질배출농도조회서비스_GW 입니다.한국남부발전(주)의 발전소(빛드림본부)의 각 호기(1호기, 2호기 등)별로 대기오염물질 배출농도를 실시간으로 조회할 수 있는 서비스를 제공합니다.대기오염물질로는 질소산화물, 황산화물, 먼지 등이 포함되어 있습니다. 해당 데이터를 활용하여, 한국남부발전(주)에서 운용하는 발전소에서 배출하는 대기오염물질의 농도를 파악할 수 있으며 발전소현황 자료 등과 결합하여 발전원별(석탄, LNG 등) 배출농도 비교 등에 활용할 수 있습니다.
