summary_user: 전국 의료기관 상가업소 91,335건을 업소 단위(상호·업종 분류·주소·좌표)로 담은 전수 원장 파일이다. 상권 분석가나 창업 예정자가 특정 지역에 병원·의원·치과가 얼마나 몰려 있는지, 의료 접근성이 낮은 곳이 어디인지 따지는 데 쓴다. 시도코드·시군구코드·법정동코드와 지번·도로명 주소, 경도·위도 좌표로 다른 지역 데이터나 상가업소 데이터와 이어 쓰며, 업소를 식별하는 상가업소번호는 조인 키로 명시되어 있지 않다.
description_portal: 이 데이터는 상가정보 기반의 의료기관 현황을 제공하며, 의료기관의 명칭, 주소, 업종 소분류, 진료과목 등의 항목으로 구성되어 있습니다. 상권 내 입지한 병원, 의원, 치과 등 다양한 의료시설의 밀집도를 파악할 수 있어 상권 분석, 창업 입지 선정, 지역 보건정책 수립 등에 활용도가 높습니다. 특히 의료 접근성 분석과 공공의료 인프라 부족 지역 도출에 유용하며, 소상공인·자영업자의 업종 다변화 전략 수립에도 기초자료로 활용할 수 있습니다. 해당 정보는 생활밀착형 시설의 공간 분포를 파악하여 지역균형발전 및 커뮤니티 기반 데이터 분석에 기여합니다.
