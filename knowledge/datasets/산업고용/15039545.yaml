summary_user: 한국전력공사가 관리하는 전기차 충전소의 ID·이름·주소·위도·경도·이용가능시간·연락처·등록일자를 충전소 한 곳당 한 행으로 담은 파일 데이터이며, 전국 4,394행(등록일 2016-10-27~2025-12-18)이다. 운전자나 지도·경로추천 서비스 개발자가 한전 충전소가 어디에 있고 언제 이용할 수 있는지 찾는 질문에 쓴다. 충전소주소·상세주소(address)와 위도·경도(coord)를 키로 다른 충전소·주유소 위치 데이터와 주소나 좌표로 맞춰 잇고, 충전소 ID를 공통으로 쓰는 코드표는 명세에 없다.
description_portal: 한국전력공사에서 운영하는 전기차 충전소에 대하여 충전소ID, 충전소명, 충전소주소, 위도, 경도, 이용가능시간, 연락처, 등록일자 정보 확인 할 수 있습니다.한전이 관리하는 각 충전소의 위치 기반 정보와 운영시간등을 한눈에 파악 할 수 있습니다.업로드된 데이터를 통해 충전소의 위치를 지도 기반 서비스에 적용하거나, 충전소 설치 시기에 따른 경로추천 시스템 등 다양한 목적의 연구에 도움이 될 수 있습니다.전기차와 관련된 인프라 연구, 서비스 개선, 정책 수립 등에도 실질적인 참고 자료로써 사용 될 수 있습니다.
