summary_user: 대한석탄공사가 판매한 무연탄의 연도별 가격을 탄종·등급·발열량별로 정리한 전국 단위 집계 파일로, 포털 설명상 2015~2023년을 다루는 작은 CSV(약 7.7KB)입니다. 연탄·발전용 무연탄 수요처나 에너지 분석가가 등급·발열량별 무연탄 공급가격이 해마다 어떻게 바뀌었는지 확인할 때 쓴다. 전역 조인 키는 없어 연도·탄종 이름을 기준으로 다른 연료 가격·에너지 통계와 맞춰 붙여 쓴다.
limits: 지역별·거래처별 가격이나 건별 판매 기록은 없고 전국 단일 기준의 연도별 가격만 담는다. 공통 코드가 없어 다른 데이터와는 연도·탄종 이름으로만 연결된다. 세부 부문이 주유소·유가로 분류돼 있으나 실시간 유가나 주유소 ID·좌표 같은 값은 들어 있지 않다.
