description_portal: 중소벤처기업진흥공단에서 청년의 창업을 지원코자 운영하는 청년창업사관학교의 우수기업 사례입니다.해당 청년창업사관학교 우수기업 사례 데이터를 통해 입교연도, 일련번호, 기수, 업종, 과제내용을 확인하실 수 있습니다.2011년부터 중소벤처기업진흥공단에서 운영하고 있는청년창업사관학교는 창업 3년 이내이며 대표자가 만 39세 이하인 청년 스타트업을 대상으로 지원하는 청년창업지원사업입니다. 청년창업사관학교 입교시 사업화지원금과 창업코칭 및 교육, 창업공간, 공단사업 연계지원 등 창업에 필요한 다양한 지원을 제공받을 수 있습니다.
