summary_user: 서울 양천구 관내 비디오물감상실업(DVD방·영화방 등) 사업장의 인허가 정보를 사업장 단위로 담으며, 인허가·취소·폐업 일자, 영업상태, 소재지(지번·도로명 주소, 좌표), 시설면적·층수·방 수, 비상계단·비상구 등 시설 항목을 포함한다. 시민이나 분석가가 '양천구에 지금 영업 중인 DVD방은 어디에 몇 곳 있고 안전시설은 갖추었나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역·업종의 지방행정 인허가(LOCALDATA) 자료와는 업체명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 비디오물감상실업 사업장의 인허가 정보를 체계적으로 관리하기 위해 작성된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 업종구분, 주변환경, 시설면적, 층수, 방수 등의 항목이 포함되어 있어 각 사업장의 설립 및 운영 상태를 명확히 확인할 수 있도록 구성되어 있다. 본 자료는 관할 행정기관의 비디오물감상실업 지도·감독 및 정책 수립에 활용할 수 있으며, 연구자와 시민은 시설 분포, 운영 유형, 안전관리 현황 분석 등 다양한 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 비디오물감상실업 - DVD방, 영화방 등 다수의 시청실과 시청기자재를 갖추어 비디오물의 시청을 제공하는 업소정보
accrual_periodicity: 수시
