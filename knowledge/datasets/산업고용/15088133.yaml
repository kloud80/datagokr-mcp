description_portal: 해당 데이터는 창업진흥원이 운영하는 초기창업패키지 지원사업의 주관기관 정보를 담고 있으며, 연번, 지역, 주관기관명, 기관구분(대학, 민간, 공공 등), 주소 항목으로 구성되어 있습니다. 서울, 경기, 대전, 제주 등 전국 주요 지역의 대학 및 창조경제혁신센터, 공공기관 등이 포함되어 있으며, 각 기관은 창업 3년 이내 기업을 대상으로 보육, 교육, 멘토링, 사업화 자금 등을 종합 지원하고 있습니다. 이 데이터는 지역별 초기창업 지원 인프라 분포 분석, 주관기관 특성별 비교 분석, 정책 수립 및 제도 설계 시 참고 자료로 활용될 수 있으며, 창업 기업이나 유관기관이 적합한 지원 기관을 탐색하고 협업 대상 발굴에 활용할 수 있도록 구성되어 있습니다.
