description_portal: '부품소재 생산통계 산업현황 지역별현황은 소재부품산업에 대한 현황을 파악하고, 소재부품산업의 육성정책 근거 마련하기 위한 통계17개 광역단체별 사업체수, 종업원수, 부가가치세금액, 생산금액, 출하금액, 재고금액 생산통계 제공(단위 : 백만원)- 제조업 중 부품과 소재의 품목을 선정하여 부품소재 12대 업종으로 분류- 중간재, 부품, 소재 등의 산업현황을 파악하기 위한 통계※ 기존 소재부품 통계가 소재부품장비로 전면 개편됨에 따라 2021년(20191231기준) 이후 데이터는 산업통상자원부_소재부품장비 생산통계 지역별 산업현황 목록에서 소재부품장비 기준으로 제공됩니다.'
