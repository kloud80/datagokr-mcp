description_portal: 중소벤처기업진흥공단은 정책자금 집행의 투명성을 확보하고 장기적인 정책 효과를 분석하기 위해, 최근 5개년도에 걸친 직접대출 잔액 현황 데이터를 공공데이터 포털을 통해 공개하고 있습니다. 이 데이터는 연도별로 대출 잔액의 변화를 추적할 수 있도록 구성되어 있으며, 각 연도별 잔액과 함께 해당 대출을 받은 업체수 정보도 포함하고 있습니다.이 자료를 통해 사용자는 지난 5년간 중소벤처기업에 대한 정책자금 지원 규모가 어떻게 변화해 왔는지, 그리고 지원받은 기업의 수가 늘었는지 줄었는지를 종합적으로 파악할 수 있습니다. 이는 과거의 정책이 시장에 미친 영향을 분석하고, 미래의 정책 방향성을 설정하는 데 중요한 근거 자료로 활용됩니다.
