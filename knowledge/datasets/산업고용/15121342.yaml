description_portal: 본 데이터는 국가의 에너지 정책 효과성을 평가하고 장기적인 시계열 변화를 체계적으로 분석하기 위해 선정한 100대 에너지 통계에 대한 상세 정보를 제공합니다.정부, 공공기관 및 연구기관 등 여러 기관에서 생산하고 있는 에너지 소비, 생산, 효율, 온실가스 배출량, 신재생에너지 보급 등 다양한 분야의 에너지 통계자료를 종합한 세부정보입니다.제공 항목은 물리정보, 논리정보로 물리정보 예시로는 ITEM, YEAR, NO이며 논리정보는 국가, 지역, 산업별로 구분된 상세 데이터를 포함하고 있습니다.본 데이터는 정책 입안자와 연구기관이 에너지 현황 분석, 정책 효과 평가, 에너지 트렌드 연구 및 미래 정책 수립을 위한 기초자료로 활용할 수 있습니다.
