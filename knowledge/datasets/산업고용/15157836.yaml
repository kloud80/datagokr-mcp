summary_user: 한수원에 등록된 유자격 공급자 가운데 단독공급자를 품목 단위로 담는다. 각 건에는 품목역무, 운용구분, 품질등급, 품목코드·품목명, 공급사명, 유자격만료일이 들어 있으며 범위는 전국·비공간이다. 원전 기자재·용역 입찰을 준비하는 사업자나 조달 분석가가 '이 품목은 어느 업체가 단독 공급하고 자격이 언제 끝나는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목명·공급사명 같은 이름 매핑이나 같은 기관의 코드로만 잇는다.
limits: '호출할 때 품목역무 구분(itemKind: 보조기기·예비품·정비공사·용역·기기수리)을 반드시 넘겨야 하고, 이 값은 다른 코드표에서 먼저 받아야 한다. 전국 단위 비공간 목록이라 지역별 분석에는 쓰지 못하며, 세부 부문이 에너지 사용량으로 분류돼 있지만 전력·에너지 사용량 수치는 담지 않는다.'
