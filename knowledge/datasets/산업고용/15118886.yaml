summary_user: 기술거래기관·사업화 전문회사·기술평가기관·공공연구기관 등 기술이전과 사업화 관련 기관을 기관 한 곳당 한 행으로 담은 전국 단위 목록으로, 분류·기관명·홈페이지·대표번호·분야·소재지를 담는다. 기술을 가진 기업이나 연구소가 '우리 기술 분야를 다루는 기술거래기관이나 기술평가기관이 어디 있고 연락처는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 소재지 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 한국산업기술진흥원_기술이전 사업화 네트워크는 기술의 이전과 기술의 사업화 촉진을 위해 기술이전 및 사업화와 관련된 다양한 기관 리스트를 제공하는 데이터입니다. 이 데이터에는 기술거래기관, 사업화 전문회사, 기술평가기관 및 공공연구기관의 정보가 포함되어 있어, 기술이전 및 사업화에 대한 전반적인 이해를 도울 수 있습니다. 특히 기술력을 가진 기업이나 연구소가 본 데이터베이스를 활용하여 적합한 기술거래기관을 신속하게 찾고, 사업화를 위한 협력 파트너를 모색하는 데 유용합니다. 이를 통해 기업이나 연구소가 보유한 기술의 시장 진입을 촉진하고, 사업화 성공률을 높이는 데 기여할 수 있습니다. 해당 데이터는 다음과 같은 구조로 이루어져 있습니다. 각 기관의 분류번호, 분류명, 기관명, 홈페이지, 대표번호, 분야 및 소재지와 같은 정보를 포함하고 있습니다. 이러한 정보는 특히 기술이전과 사업화 과정을 지원하고자 하는 모든 분들에게 유익한 자료가 될 것입니다.
