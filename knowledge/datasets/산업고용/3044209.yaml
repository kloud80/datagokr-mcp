summary_user: 인천광역시 서구(서해구)에 등록된 담배소매업소를 업소 한 곳당 한 행으로 담은 파일 데이터로, 상호와 도로명 주소 등을 담는 건별 인허가 원장이다. 지역 상권 분석가나 보건 담당자가 "우리 동네에 담배소매점이 어디에 얼마나 몰려 있나"를 확인하거나 금연 정책 대상 지역을 정할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명 주소를 맞춰 붙이거나, 같은 LOCALDATA 업종 인허가 계열 자료 및 소상공인 상가업소 정보와 주소 기준으로 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구에 등록된 담배소매업소의 현황을 정리한 자료입니다. 본 공공데이터는 인천광역시 서구 내 각 판매점의 상호명과 도로명 주소, 인허가일자 등의 정보를 포함하고 있습니다. 본 데이터는 담배소매업소의 위치와 현황을 분석함으로서 지역 내 유통구조를 파악할 수 있으며, 상권 현황 모니터링, 금연 정책 수립 등 다양한 행정,정책 수립의 기초자료로도 활용될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
