description_portal: 한국디자인진흥원이 운영하는 디자인 데이터 플랫폼(https://www.designdb.com/?menuno=668)에 등록된 디자인 교육기관 목록 데이터입니다.해당 데이터는 등록번호, 교육기관명, 등록일시, 누리집주소, 지역으로 구성되어 있으며, 교육기관 및 교육과정 운영 주체의 민감한 고유 정보와 이용자가 활용하기에 포함된 정보가 미미한 칼럼을 제외하여 일부 항목만 공개하였습니다. 또한 등록된 교육기관 중 null 등 오류열 3개 이하 우수 데이터만 선별하여 정제된 데이터입니다. 이 데이터는 디자인 관련 교육기관 및 과정 파악, 홈페이지 방문 등에 활용할 수 있습니다.본 자료는 2025년 7월 25일 기준으로 산출되었습니다.
