description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 지역별 에너지저장장치(ESS)의 일단위 충전량 및 방전량 합계정보를 제공합니다.ㅇ 해당 데이터는 통계를 목적으로 가공된 데이터이며, 수정정산 시 데이터 변경이 있을 수 있습니다.○ 기간 : 2023년 6월 ~ 2024년 09월○ 항목 : 연료원, 지역, 거래일, 방전량 합계, 충전량 합계○ 충방전단위 : Wh * ESS : Electric power Storage System, 전기저장장치'
