summary_user: 한국남동발전 풍력발전소의 호기별 일별 발전 실적을 1시부터 24시까지 시간대별 발전량과 하루 총량·평균·최대·최소로 담은 데이터로, 날짜·발전소코드·호기코드 단위의 행으로 제공된다. 분석가나 연구자가 '남동발전 풍력단지의 시간대별 발전량이 계절·날씨에 따라 어떻게 달라지는가' 같은 발전 패턴 분석이나 풍력 발전량 예측 모델 학습에 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키는 없으므로, 발전소명이나 같은 기관의 발전소코드를 매핑하고 날짜(dgenYmd)를 기준으로 기상 관측 자료 등과 맞춰 붙인다.
description_portal: 한국남동발전에서 제공하는 시간대별 풍력 발전 실적 현황입니다. 한국남동발전의 각 발전소별 시간대별로 풍력발전 실적에 관한 데이터를 제공합니다. 총량, 평균발전량, 시간대별 최대/최소발전량, 일별 최대/최소발전량 등을 확인할 수 있으며, 해당 데이터는 기상 데이터와 연계하여 기상별 장기적인 발전 패턴 분석을 통한 에너지 정책 연구 등에 활용할 수 있습니다. 이를 통해 AI 예측 등 신산업을 활성화하고 전력망 안정에 기여하며 합리적 에너지 정책 수립을 통해 국민 생활 안정에 기여할 수 있습니다.
