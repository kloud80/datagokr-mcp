summary_user: 경상북도 봉화군의 토석채취 허가를 허가 건별로 담은 원천 목록으로, 업체 상호명·허가지 주소·채취 용도·허가면적(㎡)·허가 시작일과 종료일을 담고 파일 크기가 194바이트에 불과해 수록 건수가 매우 적다. 봉화군 안에서 어떤 업체가 어디서 어떤 용도로 언제까지 토석채취 허가를 받았는지 확인하려는 주민·건설업자·인허가 분석가가 쓴다. 전역 조인 키가 없어 허가지 주소를 지오코딩해 필지·용도지역 등 국토 공간 규제 자료와 겹쳐 보거나, 다른 시군의 토석채취허가현황과 상호명·주소 기준으로 이어 쓴다.
limits: 법정동코드·필지번호 같은 표준 키가 없어 다른 데이터와는 주소·이름 매칭으로만 연결된다. 범위가 봉화군 한 곳에 한정되고 수록 건수가 매우 적어 지역 간 비교나 추세 분석에는 맞지 않는다.
