description_portal: '이 데이터는 경상북도 봉화군에서 이루어진 토석채취에 대한 허가 현황을 정리한 자료입니다. 해당 데이터는 허가된 채취업체의 상호명, 허가 면적, 채취 용도, 허가 시작일과 종료일 등 정보를 포함하고 있으며, 채취 용도에 따라 주거지, 도로, 건설 사업 등에 필요한 자재를 채취하는 작업을 관리합니다. 또한 각 허가에 대한 정확한 위치와 면적 정보도 제공되어 관리 및 규제를 목적으로 활용됩니다. 본 데이터는 총 8개 컬럼으로 구성되어 있으며순번: 데이터에 기록된 각 토석채취 허가의 일련번호입니다.상호명: 허가된 업체의 상호명입니다.허가지주소: 토석채취가 허가된 구체적인 주소입니다.채취용도: 허가된 채취의 용도입니다. 예: 봉화댐 심벽재료원(점토).허가면적: 허가된 토석채취 면적(㎡)입니다.허가시작일: 토석채취가 시작된 날짜입니다.허가종료일: 토석채취가 종료되는 날짜입니다.데이터기준일자: 본 데이터가 집계된 기준일'
