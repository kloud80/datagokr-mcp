summary_user: 충청남도 금산군 안에 설치된 고압가스 저장소를 사업장 한 곳당 한 행으로 담은 건별 목록으로, 상호(법인명)·사업소 소재지·취급 가스 정보와 데이터 기준일을 담는다. 지역 주민이나 소방·안전 담당자가 '우리 동네 근처에 어떤 가스를 다루는 고압가스 저장시설이 있나'를 확인하거나 위험시설 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 에너지 업종 인허가 원장(LOCALDATA)이나 타 시군 현황과는 상호·소재지 주소를 맞대어 이어 쓴다.
description_portal: 충청남도 금산군 내의 고압가스저장소 설치현황 자료입니다.  법인명(상호), 사업소 소재지, 취급 가스정보 등의 자료를 제공합니다. 금산군 내 총 9건의 사업장 데이터가 수록되어 있으며, 각 사업소별로 취급하는 가스 정보도 제공됩니다. 해당 데이터는 공공기관 및 관련 업계에서도 위험시설 분포도 및 대응전략 수립을 위해 참고할 수 있는 실용적인 정보입니다. 이 데이터는 관련 정보의 구조적 제공을 통해 이용자의 이해를 돕고, 정책 수립, 행정 분석, 서비스 개선 등 다양한 공공 목적에 활용될 수 있습니다.
