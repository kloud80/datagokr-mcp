summary_user: 광주광역시 관내 LPG 판매업소를 업소 한 곳당 한 행으로 정리한 원천 목록으로, 자치구(동·서·남·북·광산구)별 상호·도로명주소·대표자·전화번호를 담는다(CSV 약 3KB 규모). 주민이나 사업자가 '우리 구에서 LPG 가스를 배달·판매하는 업소가 어디이고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키나 업소 코드가 없어, 다른 데이터와는 시군구 이름이나 도로명주소를 문자열로 맞춰 연결해야 한다.
description_portal: 본 데이터는 광주광역시 관내 LPG 판매업소의 현황을 정리한 자료로, 시군구, 상호, 도로명주소, 대표자, 전화번호 항목으로 구성되어 있습니다. 동구에는 (유)청기와예향에너지, 하이가스, 동산가스 등 여러 업체가 있으며, 서구는 서부에너지, 청기와가스판매소, 동아광일가스, 시민가스 등이 포함되어 있습니다. 남구는 대창가스, 아주산소㈜, (유)동양가스 등이 있으며, 북구는 (주)광주한길가스, (주)대산가스, (유)광임신성가스 등이 등록되어 있습니다. 광산구에는 예향에너지, 제일가스, 광주에너지, 광산LPG, 보배가스, 한국종합가스 등 다양한 업체가 위치해 있습니다. 각 업소는 대표자명과 연락처가 함께 제공되어 있어 관내 LPG 판매업소의 기본 정보를 확인할 수 있습니다
