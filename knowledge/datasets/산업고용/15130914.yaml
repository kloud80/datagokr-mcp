description_portal: 중증장애인의 안정적, 지속적인 직업생활을 돕는 근로지원인으로서 활동을 계속하기 위하여 수강해야 하는 근로지원인 보수교육의 연간 일정에 관한 정보입니다. 이 데이터는 보수교육 대상자(근로지원인 양성교육 수료 후 3년이 경과된 활동 중인 근로지원인) 분들에게 교육에 관한 정보를 제공하고자 공개하고 있습니다. 데이터 내용은 근로지원인 보수교육의 회차, 상세 교육일정, 교육 세부내용 등을 포함하고 있습니다. 보수교육에 관한 사항은 소속 중인 근로지원인 지원 사업 수행기관, 한국장애인고용공단에도 문의하실 수 있습니다.
