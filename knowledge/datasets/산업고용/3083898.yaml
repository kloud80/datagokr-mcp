summary_user: 경상남도가 허가한 발전용량 1,000kW 초과 3,000kW 이하 태양광 등 발전사업의 허가 현황을 발전소(허가) 한 건씩 담은 파일 데이터로, 허가번호·허가일자·상호·설비용량·설치장소·원동력 종류·상태가 들어 있다. 사업자나 분석가가 경남의 어느 지역에 어떤 에너지원의 중규모 발전소가 언제 허가됐고 지금 어떤 상태인지 확인할 때 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보표준데이터 등 다른 발전소 원장과는 상호·설치장소 주소·용량을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 경상남도는 발전용량이 1,000KW 초과 3,000KW 이하인 태양광 등 발전사업 허가 현황에 관한 데이터를 제공합니다. 이 데이터는 연번, 허가번호, 허가일자, 상호, 설비용량, 설치장소, 상태  등의 정보를 포함하고 있습니다. 이를 통해 각 발전사업의 허가일자와 에너지원별 발전 용량을 파악할 수 있으며, 설치장소와 현재 상태를 통해 사업 진행 상황과 지역별 발전소 현황을 효율적으로 모니터링할 수 있습니다. 또한, 이 정보는 경상남도의 에너지 정책 수립과 발전사업 활성화에 중요한 기초 자료로 활용되어, 태양광 발전 확대 및 지역별 에너지 전환 전략에 기여할 수 있습니다.
