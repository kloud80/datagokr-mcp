summary_user: 한국전력공사 수요관리정보시스템이 관리하는 고효율인버터 승인기기를 승인 건(모델) 단위로 담은 전국 범위 원장 파일로, 승인번호·모델명·절감전력·적용예정일·만료예정일·사용여부를 포함한다. 수요관리 지원사업 담당자나 설비 구매 사업자가 특정 인버터 모델이 현재 고효율 승인 대상인지, 승인 기간이 언제 끝나는지, 모델별 절감전력이 얼마인지 확인하는 데 쓴다. 승인번호(kepco_dsm_approval_no)와 업체코드(kepco_dsm_vendor_cd)가 조인 키라서, 같은 키를 쓰는 한전 수요관리정보의 다른 승인기기·업체 데이터와 연결한다.
description_portal: 한국전력공사 수요관리정보시스템에서 관리하고 있는 고효율인버터 승인기기 데이터 입니다. 승인번호, 모델명, 적용 및 만료예정일 등의 데이터를 확인하실 수 있습니다.승인번호, 기기식별코드, 업체코드, 기기고유번호, 모델명, 절감전력, 적용예정일, 만료예정일, 사용여부 항목으로 이루어져 있습니다.해당 데이터를 통해 절감 전력 수치를 비교하여 각 설비 효율을 정량 평가할 수 있어 에너지 효율 분석, 보급 효과 검증 할 수 있다.또한 사용 여부를 기반으로 실제 설치율이나 가동 상태를 파악하고 향후 고효율 설비 확대를 위한 기초 통계로도 활용 할 수 있습니다.
