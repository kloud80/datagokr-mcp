summary_user: 한국남부발전이 운영하는 발전소(빛드림본부)의 호기별로 시간 단위 대기 측정값을 담는 API로, 황산화물·질소산화물·먼지·일산화탄소 농도와 산소·유량·온도를 제공한다. 지역 주민이나 환경 분석가가 특정 발전소 호기에서 시간대별로 질소산화물이나 먼지가 얼마나 배출되는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명(saupso)·호기 이름 매핑이나 같은 기관 코드로만 연결되며, 주변 환경기상 데이터와 교차해 보는 용도가 있다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.본 API는 한국남부발전(주) 발전소주변대기정보_GW입니다.해당 API를 통해 한국남부발전(주)에서 운영하는 발전소(빛드림본부)의 각 호기별(1호기, 2호기 등) 코드를 입력하여 해당 호기 주변의 대기 정보(탄소발생량, 먼지 발생량 등)를 조회할 수 있습니다. ESG경영의 일환으로 해당 조회 서비스를 통하여 대기정보를 투명하게 공개하고 있으며,공개된 대기정보를 통하여 환경과 관련된 정책 수립 등의 기초 자료로 활용할 수 있습니다.
