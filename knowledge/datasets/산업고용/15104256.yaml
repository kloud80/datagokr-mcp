summary_user: 직장 내 장애인 인식개선 교육 강사지원 사업을 수행하는 기관을 기관 1곳당 1행으로 정리한 전국 단위 목록이다. 기관마다 기준년도, 교육기관 지정번호, 기관명, 대표자, 사업수행이력, 교육구분, 강사수, 관할지사를 담는다. 상시근로자 50인 이상 300인 미만 사업장의 인사 담당자가 무료로 강사를 보내 줄 수 있는 정식 수행기관이 어디이고 관할지사가 어디인지 확인할 때 쓰며, 교육기관 지정번호(kead_awareness_edu_inst_no)를 키로 같은 공단의 다른 인식개선 교육기관 자료와 연결한다.
description_portal: 2018.5.29일 부터 직장 내 장애인 인식개선 교육 의무가 전체 사업주 및 근로자로 확대됨에 따라 사업주에게 직장 내 장애인 인식개선 교육 강사를 지원하여 사업주 부담 해소할 수 있도록 무료교육지원 사업인 직장 내 장애인 인식개선 교육 강사지원 사업의 수행기관 데이터 입니다.※ 강사지원사업은 직장 내 장애인 인식개선 교육 의무 이행을 위한 정부의 지원사업이며, 교육 강사 파견 등에 따른 일체의 사업주 비용 부담은 없습니다.※ 상시근로자 수 50인 이상 ~ 300인 미만의 사업장은 해당 데이터의 강사 지원 사업 수행기관을 통해 교육 강사를 무료로 지원받아 직장 내 장애인 인식개선 교육을  진행할 수 있습니다.※ 무료 교육을 빙자하여 직장 내 장애인 인식개선 교육에 대해 잘못된 안내를 하고 있는 불법 홍보 및 유사 업체(금융, 상조 후원 교육) 주의
