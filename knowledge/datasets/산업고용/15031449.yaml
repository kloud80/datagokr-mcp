summary_user: 경상북도 성주군 관내 담배소매인 지정 업소를 한 곳씩 담은 건별 원천 목록으로, 지정번호·업소명·주소·데이터기준일자가 들어 있다(CSV 약 22KB). 창업 예정자나 상권 분석가가 성주군 안에서 담배를 파는 소매점이 어디에 얼마나 몰려 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 업소명을 맞춰 소상공인 상가업소 정보나 다른 시군구 담배소매인 현황과 이어 쓴다.
description_portal: 본 데이터는 성주군에서 관리하는 담배 판매업 소매 지정 현황 정보를 체계적으로 정리한 자료이다. 관내 영업소의 위치, 담배소매인 지정번호, 업소명, 상세주소, 데이터기준일자를 포함하여 지역 내 소매업 운영 현황을 한눈에 파악할 수 있도록 구성하였다. 이를 통해 성주군의 상권 분포를 분석하고 인허가 절차의 투명성을 확보하며, 정책 수립과 행정 의사결정에 필요한 기초자료로 활용할 수 있다. 또한 대국민 정보 접근성을 제고하기 위해 정기적으로 갱신되며, 지역경제 동향 파악과 공정한 행정서비스 제공을 지원하는 공공데이터이다.
