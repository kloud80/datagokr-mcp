description_portal: 내일채움공제 고객센터 월별 운영현황은 인입호, 요청호, 응답호, 카카오톡 상담요청호 월별 건수로 입력된 데이터입니다. 해당 데이터는 내일채움공제 고객센터(내일채움공제 1588-6259, 우대저축공제 1588-6259, 청년내일채움공제 국번없이1350)으로 연락이 온 경우와 그에 대한 응답 및 카카오톡 채널을 통한 상담요청의 경우를 집계합니다.  인입호는 수신 여부와 상관없이 전화온 모든 건수, 요청호는 서비스를 요청하기 위한 요청 건수, 응답호는 실제 전화를 받고 응대가 이루어진 건수입니다.* 해당 데이터는 2024년 1월 1일 ~ 2024년 12월 31일까지의 데이터입니다.
