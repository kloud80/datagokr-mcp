summary_user: 충주시에 등록된 실내건축공사업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 업체명·업종·등록현황·도로명주소·전화번호를 담는다(csv 약 2.7KB 규모의 소규모 목록). 충주에서 인테리어 공사를 맡길 업체가 정상 등록 상태인지 확인하려는 시민이나, 관내 실내건축 업계 분포를 살피는 분석가가 쓴다. 전역 조인 키(사업자번호·법정동코드 등)가 없어 다른 데이터와는 업체명이나 도로명주소를 맞춰 붙이거나 같은 기관의 다른 업종 인허가 목록과 나란히 보는 방식으로만 이어 쓴다.
description_portal: 충청북도 충주시에 등록된 실내건축공사업체 현황을 제공하는 데이터입니다.해당 데이터는 업체명, 업종명, 등록 상태, 도로명주소, 전화번호 등으로 구성되어 있으며, 충주시 관내 인테리어 및 실내건축 관련 업계의 영업현황을 파악할 수 있습니다.- 등록현황 항목은 건설산업기본법에 따른 상태 기준(정상, 말소 등)으로 표기되어 있으며, 실제 영업 여부와는 다를 수 있습니다.- 사업장 주소는 도로명주소 기준이며, 지번주소는 포함되어 있지 않습니다.- 실내건축공사업은 일정 요건에 따라 등록 관리되므로, 관련 허가 조건이나 기술자 자격 등은 충주시청 건축과 또는 관련 부서에 확인이 필요합니다.- 최신 등록일 기준으로 데이터가 관리되며, 일부 업체 정보는 변경되었을 수 있습니다.※ 본 데이터는 인허가 확인, 민원 대응, 관련 업계 분석, 사업자 현황 관리 등 행정 및 민간 활용에 적합합니다.
