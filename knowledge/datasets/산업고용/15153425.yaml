description_portal: '「외국인 기숙사 및 주거실태조사표 번역 자료」는 사업장 내 외국인 근로자의 숙소·주거환경을 체계적으로 파악하기 위해 제작된 설문서의 다국어 번역본입니다. 기숙사 제공 여부, 방 구조(1인실·다인실), 수용 인원, 공용시설(주방·화장실·세탁실) 이용 현황, 난방·환기·소음 등 주거환경, 안전·위생 관리 상태, 임대료 수준과 공제 방식, 불편사항 및 개선 요구 등을 항목별로 묻도록 구성되어 있습니다.번역 자료이기 때문에 한국어 원문 문항과 대상 언어(예: 영어, 베트남어, 네팔어 등) 문항이 대응되도록 배열되어 있으며, 외국인 근로자가 설문 문항을 오해 없이 이해할 수 있도록 용어를 평이하게 조정한 것이 특징입니다. 이를 통해 설문 결과의 왜곡을 줄이고, 실제 거주환경을 정확히 진단하여 기숙사 기준 준수 여부 점검, 환경 개선계획 수립, 행정 보고용 통계 작성 등에 활용할 수 있습니다.'
