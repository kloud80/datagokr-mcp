description_portal: 이 자료는 충청남도개발공사의 에너지 사용현황으로, 연도별 전기와 집단에너지(지열) 사용량을 월 단위로 제공하며 에너지 관리 및 절감 정책 수립에 활용될 수 있다. 단, 세부 건물별·부서별 사용 내역은 미제공된다.키워드별 상세설명○ 에너지사용량 → 공사에서 일정 기간 동안 실제로 사용한 에너지 총량을 의미하며, 연도별·월별 단위로 집계됨○ 전기소비 → 해당 연도와 월에 사용된 전력량을 의미하며, 전기요금 산정 및 에너지 절감 지표로 활용됨○ 집단에너지 → 지역난방 및 지열을 포함한 집단에너지 사용량을 나타내며, 건물 난방·냉방 등에서 활용됨○ 지열에너지 → 집단에너지 중 지열 기반 에너지 사용량을 세부적으로 분리하여 제공함○ 연도별 비교 → 2016년부터 2024년까지 연도별 에너지 사용 변화를 확인할 수 있으며, 추세 분석에 활용 가능함○ 월별 통계 → 1월부터 12월까지 월별 사용량을 제공하여 계절별·기간별 소비 패턴을 확인할 수 있음○ 증감량 → 특정 연도 대비 직전 연도의 사용량 증감 차이를 표시하여 증가·감소 추세를 수치로 제공함○ 에너지관리 → 수집된 사용현황을 통해 효율적 에너지 관리와 절감 정책 수립에 활용할 수 있는 지표로 제공됨
