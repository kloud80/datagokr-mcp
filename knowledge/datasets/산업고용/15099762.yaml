summary_user: 신재생에너지공급인증서(REC) 현물시장의 장운영일(bzDd)별 거래건수·평균가·최고/최저가·상하한가 등 장운영실적을 육지와 제주로 나누어 담는 API이며, 종가와 거래금액은 육지·제주 통합 체결기준 값이다. 발전사업자나 분석가가 오늘 REC 현물시장에서 육지와 제주의 평균 거래가가 얼마인지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 이름·코드 매핑이나 같은 기관(한국전력거래소) 코드로만 이어 쓴다.
limits: 검증 호출에서 전체 건수 1, 수신 1행이라 장기 시계열이나 과거 이력 분석용인지는 확인되지 않았다. 필드 명세에 의미와 코드표가 없어 각 가격·수량 필드의 단위는 별도 확인이 필요하다. 개발계정은 일 100회 호출 제한이 있다.
