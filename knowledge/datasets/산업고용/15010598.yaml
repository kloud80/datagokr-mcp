description_portal: 중소벤처기업진흥공단에서는 중소벤처기업 지원을 위한 다양한 정책사업을 추진 중에 있습니다.중진공 HIT500 사업은 중소벤처기업진흥공단이 주관하여 우수한 중소기업 제품을 발굴하고, 소비자 및 전문가 심사를 거쳐 매년 500개의 히트 상품을 선정하여 홍보 및 마케팅을 지원하는 사업입니다. 이 사업은 선정된 제품들을 대중에 알리고 판매를 촉진하는 것을 목표로 하며, 특히 창업 초기 중소기업의 성장과 제품 판로 개척에 기여합니다. 중소기업 우수제품 정보는 2018년에 선정된 중소기업 우수제품 HIT 500에 대한 데이터로 제품 구입 시 원하는 제품에 대한 정보를 리스트에서 확인 가능합니다.동 데이터는 아래와 같은 항목을 포함하고 있습니다. * 선정년도, 업체명, 제품명, 홈페이지, 제조국, 사업자번호
