summary_user: 2018년에 선정된 중소기업 우수제품 HIT 500을 제품 단위로 나열한 파일 데이터로, 선정년도·업체명·제품명·홈페이지·제조국·사업자번호를 담고 검증 시 352행을 받았다. 소비자나 구매 담당자가 어떤 중소기업 제품이 우수제품으로 선정됐고 어느 업체가 만드는지 확인하는 질문에 쓴다. 사업자번호(bizno)를 키로 벤처·이노비즈·창업기업·공공구매 인증서 등 다른 기업 확인·인증 데이터와 기업 단위로 이어 쓴다.
