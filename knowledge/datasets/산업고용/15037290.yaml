description_portal: 본 데이터는 고용정보통합분석시스템(고용보험시스템)을 기반으로 한 고용장려금 순 인원 현황(월별) 통계자료로, 사업주 또는 근로자가 고용안정지원금을 수급한 인원을 중복 없이 집계한 정보를 제공한다. 통계는 마감연월을 기준으로 정리되며, 사업장 규모, 시도·시군구 지역, 산업별(대·중·소분류)로 세분화되어 있어 다양한 수준의 지역·산업 분석이 가능하다. 특히 한 명의 근로자가 같은 지원금을 동일 월에 여러 번 신청한 경우에도 1명으로 계산되어 통계의 중복 오류를 방지하며, 월 단위 자료이므로 여러 월의 단순 합산은 금지된다. 이 데이터는 고용정책 수립, 지역별 산업 지원 효과 분석, 고용 유지 실태 파악 등에 유용하게 활용될 수 있다.
