summary_user: 공공기관이 수시공시로 올린 채용공고를 공고 단위로 담는 전국 범위 API로, 실측에서 확인된 필드는 공고에 딸린 첨부파일의 파일명·유형·다운로드 주소 같은 메타정보이며 검증 호출에서는 2행을 받았다. 구직자가 특정 공공기관 채용공고의 공고문이나 지원서 양식을 바로 내려받으려 할 때, 또는 분석가가 공공부문 채용공시 자료를 모을 때 쓴다. 전역 조인 키가 없어 서비스 안에서는 채용공시 첨부파일번호(recrutAtchFileNo)로 공고와 파일을 묶고, 워크넷(고용24) 등 다른 채용 데이터와는 기관명 매핑으로만 잇는다.
limits: 공고 목록 오퍼레이션(/list)은 최소 파라미터로 호출했을 때 응답이 없어서, 공고 제목·접수기간·채용인원 같은 본문 항목은 실측으로 확인하지 못했다. 검증 수신이 2행뿐이라 전체 규모는 판단할 수 없다. 개발계정은 하루 1,000회까지 호출할 수 있다.
