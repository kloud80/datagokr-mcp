summary_user: 한국동서발전 발전소의 2019년 이후 연료소비 현황을 연월·발전소·연료 종류별 사용량(톤)으로 담은 API 데이터입니다. 분석가나 연구자가 '동서발전 어느 발전소가 어떤 연료를 매달 얼마나 썼는가'를 확인해 연료 원가나 탄소 배출 추이를 추정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소 이름·연료 이름 매핑이나 같은 기관(한국동서발전) 데이터끼리만 연결한다.
limits: 전역 조인 키가 없어 전력거래소 발전량·배출 측정 데이터와 붙이려면 발전소명을 직접 맞춰야 합니다. 범위는 전국·비공간으로 표시돼 있어 지역 단위 분석에는 발전소 위치를 따로 확보해야 하며, 한국동서발전 소속 발전소만 담깁니다.
