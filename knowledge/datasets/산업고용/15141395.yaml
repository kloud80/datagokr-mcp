description_portal: 본 데이터는 서울특별시 종로구 관내에서 담배도매업을 영위하기 위해 등록된 사업체의 인허가 현황을 정리한 자료입니다. 주요 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 담배사업법에 따라 허가를 받은 도매업체의 행정적 이력을 확인할 수 있습니다. 해당 자료는 담배 유통 질서 확립, 담배판매업 관리, 폐업 및 휴업 현황 파악, 시장 유통 안정성 확보 등을 위한 기초자료로 활용됩니다. 또한 종로구 내 도매업소의 영업상태별 통계를 통해 관련 산업의 규모, 유통 구조, 법적 등록 실태 등을 파악하고, 정책 수립 및 인허가 업무 처리의 참고자료로 제공될 수 있습니다.
