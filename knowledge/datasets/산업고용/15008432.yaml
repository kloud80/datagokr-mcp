summary_user: 전라남도 나주시 관내 주유소와 LPG 충전소를 업소 한 곳당 한 행으로 담은 원천 목록이며, 업소명·주유소/충전소 구분·지번주소·운영상태·휴점일·영업 시작·종료 시각·전화번호를 담는다(CSV 약 6.5KB). 나주 주민이나 방문자가 '지금 영업 중이고 휴무가 아닌 가까운 주유소·LPG 충전소는 어디인가'를 확인하거나, 분석가가 시군 단위 연료 공급 거점 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 지번주소를 이름·주소 매칭해서 이어야 하며, 오피넷 유가나 전국주유소 표준데이터와도 이 방식으로만 연결된다.
description_portal: 전라남도 나주시에 소재한 주유소와  LPG 충전소의 영업 현황을 정리한 데이터입니다나주시 관내에 소재한 주유소와 LPG 충전소의 현재 영업 상태, 휴점일, 이용 시작시간과 종료시간(영업시간), 위치(주소) 및 전화번호를 제공합니다. 데이터 이용자로 하여금 나주 주유소 및 LPG주유소 영업 현황을 쉽게 알 수 있도록 관련 정보를 제공합니다. 다만 기재되어있지 않은 정보 또는 변경된 정보가 있습니다(위치 또는 연락처를 공개하여  변화된 정보를  쉽게 제공 받을 수 있도록 데이터를 현행화 하였습니다.)
