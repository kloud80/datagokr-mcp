description_portal: 해당 데이터는 2024년 환경방사선감시기(ERMS)에 의한 공간감마선량률 데이터로 1시간 평균값을 기본 자료로 사용하여 산출하였으며 단위는 uSv/h를 사용하였음.처분시설 부지주변 공간감마선량률은 환경방사선감시기에 의해 연속측정을 시행하며 부지 내 5개지점과 부지 외 2개 지점에 설치하여 운영함.측정지점 중 2단계 경비실은 2단계 처분시설 운영 전 조사지점으로 2019년 1월부터 운영되었음.해당 데이터는 연간 발생하는 데이터이나 행 및 열의 구성에 따라 누적 파일로 관리되고 있지 않아서 일회성 데이터로 등록됨.데이터기준일은 2025년 8월 31일임
