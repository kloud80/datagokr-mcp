summary_user: 경기도가 유망중소기업으로 선정한 업체를 기업 한 곳씩 담은 건별 원장으로, 지정 연도·시군·인증번호·기업명·주생산품목·표준산업분류 업종·인증유효기간을 기록한다. 지자체 담당자나 분석가가 "우리 시군의 유망중소기업은 어떤 업종에 몰려 있고, 인증이 아직 유효한 곳은 어디인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD), 업종 분류, 기업명 매칭으로만 연결하고, 다른 기업 인증 데이터와 사업자번호로 잇는 방식은 이 필드 목록에서 쓸 수 없다.
description_portal: 이 데이터는 경기도 내 유망 중소기업으로 선정된 업체들의 정보를 담고 있으며, 기업명, 주소, 주생산품목, 업종명, 사업자등록번호, 인증번호, 인증유효기간 등 주요 항목으로 구성되어 있습니다. 각 기업은 지정 연도별로 구분되어 있으며, 표준산업분류에 따른 업종 정보와 인증현황을 포함하여 기업의 기술력과 성장 가능성을 파악할 수 있도록 구성되어 있습니다. 이 데이터는 지역 산업 기반 강화, 정책 지원 대상 기업 발굴, 기업성장 모니터링 및 중소기업 육성정책 수립 등에 활용될 수 있으며, 연간 단위로 갱신되어 최신 기업 현황 파악에 적합합니다. Open API를 통해 시군별 검색 및 기업별 조회가 가능하여 유연한 정보 접근을 지원합니다.
