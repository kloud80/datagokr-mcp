summary_user: 인천광역시 부평구에 등록된 실내건축공사업체를 업체별로 한 행씩 담은 원천 목록으로, 업체명·업종·도로명주소·전화번호를 담는다(CSV 약 6KB 규모). 부평구에서 인테리어·실내건축 시공을 맡길 등록 업체를 찾거나, 구 안에서 이런 업체가 어느 동네에 몰려 있는지 살피는 데 쓴다. 사업자번호나 행정코드 같은 공통 조인 키는 없으므로, 다른 데이터와는 업체명이나 도로명주소를 맞춰 보거나 같은 부평구 인허가 자료와 나란히 놓고 이어 쓴다.
description_portal: '실내건축공사업체의 업체명, 주소, 연락처 등을 수록한 데이터.지역 내 인테리어 및 실내 건축 시공 업체 현황을 파악하고, 주거·상업 공간 개선, 도시환경 질적 향상, 건설산업 지원 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 실내건축공사업 등록 업체 현황 분석– 업체 분포를 통한 인테리어·건축산업 기반 파악– 도로명주소 기반 업체 입지 특성 분석– 주거환경 개선, 상업시설 활성화, 건설산업 지원 자료 활용주요 항목 설명● 업체명: 등록된 실내건축공사업체의 명칭● 도로명주소: 해당 업체의 도로명 주소● 전화번호: 업체 연락을 위한 전화번호'
