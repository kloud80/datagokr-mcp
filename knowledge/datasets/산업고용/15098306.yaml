summary_user: 세종특별자치시에 등록된 건설업체를 업체별로 한 건씩 담은 원천 목록으로, 상호(mtlty)·대표자·업종·주소·전화번호를 제공한다. 세종시에서 특정 업종의 건설업체를 찾거나 공사 발주·하도급 전에 업체의 등록 여부와 연락처를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 같은 기관 자료로만 이어 쓴다.
