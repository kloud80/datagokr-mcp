summary_user: 전국 동물병원(수의업) 상가업소를 한 곳씩 상호명·업종명·지번 주소(구주소)·도로명 주소(신주소)로 담은 건별 목록 파일(CSV 약 30만 바이트)이다. 특정 지역에 동물병원이 몇 곳 있고 어디에 몰려 있는지 확인하려는 예비 창업자나 상권 분석가가 입지를 검토할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와 붙일 때는 주소나 상호명 문자열로 맞추거나, 같은 기관의 상가업소 정보와 이름으로 대조해야 한다.
limits: 사업자번호·좌표·코드 같은 공통 키가 없어 다른 인허가·상권 데이터와 정확히 조인하기 어렵다. 주소는 개별 업소 단위이므로 행정구역별 집계는 주소를 직접 파싱해서 만들어야 한다.
