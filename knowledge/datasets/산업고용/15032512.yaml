summary_user: 성남산업진흥원이 낸 창업지원·입주기업 모집 등 사업공고를 공고 한 건씩 담은 목록으로, 공고제목·모집시작일·모집마감일·등록일을 담는다(CSV 약 154KB). 성남 지역 창업자나 중소기업이 지금 모집 중이거나 곧 마감되는 진흥원 지원사업이 무엇인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 K-Startup·기업마당 등 다른 지원사업 공고와는 공고제목이나 기관명으로만 맞춰 이어 쓴다.
