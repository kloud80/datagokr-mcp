summary_user: 충청남도에서 대·중소기업 동반성장 협약에 참여한 기업을 연도별로 한 줄씩 기록한 건별 목록으로, 기업명·대표자·소재지(주소)·주생산품과 대기업·중소기업 구분을 담은 4KB 남짓의 작은 CSV 파일이다. 충남 산업 정책 담당자나 분석가가 '어느 해에 어떤 기업이 협약에 참여했고 어느 시군에 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어서, 다른 기업 현황·인증 데이터와는 기업명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 충청남도 내 대기업과 중소기업 간 동반성장 협약에 참여한 기업 현황을 기록한 행정 자료입니다. 주요 항목에는 기업명, 소재지, 업종, 협약 체결일, 협약 형태(예: 상생협력, 기술협력, 판로지원 등), 참여 구분(대기업·중소기업), 관리기관 등이 포함됩니다. 이를 통해 충남에서 어떤 기업들이 협약에 참여했는지, 업종별·지역별 분포가 어떻게 되는지를 파악할 수 있으며, 대·중소기업 간 협력 구조의 특성을 분석할 수 있습니다. 또한 협약 형태별 분류를 통해 기술 이전, 공동 연구, 자금 지원, 판로 개척 등 협력의 구체적인 내용을 확인할 수 있습니다. 이 자료는 충청남도의 산업 정책 수립, 기업 지원 전략, 지역경제 활성화 방안 마련에 중요한 기초 자료로 활용될 수 있습니다. 특히 협약 기업 현황을 시계열로 비교하면 상생협력 정책 효과를 측정할 수 있으며, 특정 업종이나 지역에서 협약이 집중되는 현상을 분석해 향후 정책 우선순위를 설정하는 데에도 유용합니다.'
