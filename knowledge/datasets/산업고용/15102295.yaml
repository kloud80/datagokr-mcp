description_portal: 한국수력원자력(주) 원전본부 운영변경허가 관련 고리원자력본부 2025년 호기별(고리1, 고리2, 고리3, 고리4, 신고리1. 신고리2) 운영변경허가 사항, 변경사유, 허가일입니다.- 한국수력원자력(주) 발전본부 규제협력처는 원자력안전위원회에 운영변경허가 사항 발생시 회의체 구축을 통해 심의를 받고 있으며, 발전소 안전운영을 위해 해당 데이터를 제공하고있습니다.- 개방 데이터는 발전소, 대상호기, 허가일, 변경사항, 변경사유, 담당자를 제공하고 있습니다.- 정부기관은 각 연도별 운영변경허가 데이터를 통해 의결된 심의내용을 제공받을 수 있고, 해당 데이터 공유를 통하여 각 발전소의 변경허가 이력을 확인할 수 있습니다.- 2025년 고리본부 운영변경허가 건수는 총 16건이며, 2024년 대비 12건의 운영변경허가 건수가 증가하였음을 알 수 있습니다.
