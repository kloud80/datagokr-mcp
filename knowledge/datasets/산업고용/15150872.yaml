summary_user: 경기도가 제공하는 신기술·특허 공고에 쓰이는 기술 분류표로, 분류코드(class_cd)별 등급과 대·중·소·세·세세분류명, 상위부터 전체 계층을 한 줄로 이은 전체분류명을 담는 코드 사전형 데이터입니다. 기술이전이나 지원사업을 준비하는 사업자·분석가가 '도시철도차량이나 냉장냉동창고 같은 기술이 분류체계의 어느 계층·등급에 속하는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 신기술·특허 공고 데이터와는 분류코드나 분류명을 직접 매핑하거나 같은 기관(경기도) 데이터끼리만 이어 쓴다.
description_portal: "이 데이터는 신기술에 대한 공고 분류 정보를 수록하고 있으며, 신기술 분류코드, 등급, 분류명, 대분류명, 중분류명, 소분류명, 세분류명, 세세분류명, 전체분류명 등의 항목으로 기술의 성격과 속성을 세분화하여 제공합니다. '전체분류명'은 상위 대분류부터 세세분류까지의 기술 계층구조를 일괄적으로 표기한 항목으로, 기술 분류의 체계적 분석과 기술 동향 파악에 활용될 수 있습니다. 데이터는 기술개발 및 기술이전 전략 수립, 산업별 기술 수요 예측, 정책연구 등 다양한 분야에서 활용 가능하며, 특히 기술분류체계를 기반으로 기술 등급(예: 3등급, 4등급 등) 정보도 포함되어 있어 기술의 분류 수준을 비교 분석하는 데 유용합니다. 기술명이나 분류는 도시철도차량, 냉장냉동창고, 통신관제시설 등과 같이 다양한 산업영역을 포괄합니다."
