description_portal: 본 데이터셋은 한국고용노동교육원이 운영하는 각 교육과정별 평가 구성 현황을 체계적으로 정리한 자료입니다. 개별 과정에서 사용되는 평가(퀴즈·시험·진단평가 등)에 대해 평가명, 전체문항수, 출제문항수, 보기수, 등록일자 정보를 제공합니다. 이를 통해 과정별 평가의 문항 규모와 출제 범위(전체 대비 실제 출제 비율), 문항 형태(보기수), 평가 등록 시점을 한눈에 파악할 수 있습니다.교육 운영자는 본 데이터를 활용해 평가 적정성 점검(문항 수 과다/과소), 교수설계 개선(문항 수·보기 수 표준화), 학습 성과 분석(출제 비율 대비 학습 난이도 조정)에 활용할 수 있습니다. 또한 연구자·정책 담당자는 과정 유형별 평가 표준모형 수립, 난이도 수준의 질 관리 기준 마련, 평가 고도화(적응형 평가)에 필요한 기초자료로 사용할 수 있습니다.
