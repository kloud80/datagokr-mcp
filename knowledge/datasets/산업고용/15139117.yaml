description_portal: '중소벤처기업진흥공단은 정책자금 집행의 투명성을 높이고 정책 수립을 지원하기 위해 "직접대출 산업분류코드별 잔액 현황" 데이터를 공공데이터 포털에 공개하고 있습니다. 이 데이터는 대출 잔액을 **한국표준산업분류코드(KSIC)**에 따라 세분화하여 제공합니다.사용자는 제조업, 건설업, 서비스업 등과 같이 대분류는 물론, 제조업 내의 세부 산업(예: 의복 제조업, 자동차 제조업)별로 대출 잔액과 대출을 받은 업체수를 파악할 수 있습니다. 이를 통해 어떤 산업 분야에 정책자금이 집중적으로 지원되었는지, 그리고 해당 산업의 자금 수요가 얼마나 되는지를 구체적으로 분석할 수 있어, 산업별 특성을 고려한 맞춤형 지원 정책을 마련하는 데 중요한 자료로 활용됩니다.'
