summary_user: 인천 서구 관내 고압가스사업자를 업체 한 곳당 한 행으로 담은 원천 목록 파일(csv, 약 10KB)로, 구분·상호·도로명 주소·전화번호와 데이터기준일자를 담는다. 안전점검 담당자나 인근 주민·사업자가 '서구 안에서 고압가스를 취급하는 업체가 어디에 있고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 붙여야 하며, 같은 부문의 LOCALDATA 에너지 업종 인허가 원장과는 이름·주소 매칭으로 연결한다.
