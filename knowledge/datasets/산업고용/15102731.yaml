description_portal: '한국수력원자력㈜의 신규양수 건설 관련 양수토건분야의 계약 추진 현황을 설명한 자료를 공개합니다. 공개 정보는 구분(양수토건분야-1/2/3), 계약 주요계약 내용, 추진 단계(발주 준비/계약/진행 중/준공)의 총 계약건수 항목으로 구성되어 있습니다. 추진단계의 수량 단위는 건 수입니다.현재 공개된 정보의 대상 양수토건분야는 영동양수 도로공사_인허가_건설사업관리, 홍천양수 인허가_실시설계_감리 용역 및 도로 공사. 건설사무소 신축공사(3개 지점) 입니다.※ 양수발전 : 수력 발전의 한 방식으로, 전력수요가 적은 심야의 저렴한 전력을 이용하거나, 주간시간대 태양광으로 발생하는 과잉 출력을 저장하였다가, 전력수요가 증가할 때 상부댐의 물을 하부댐으로 낙하시켜 전력을 생산하는 방식을 말합니다. 양수발전은 원자력발전소의 출력변동으로 인한 기기의 수명단축, 효율저하 등을 보완하여 이들 발전소의 열효율과 이용률 향상에 기여하며 대규모 정전시 최초 전력공급 역할을 수행합니다.'
