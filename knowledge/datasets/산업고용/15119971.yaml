description_portal: 본 데이터는 서울특별시 성동구 내에서 담배를 매입하여 일반 소비자에게 직접 판매하는 담배소매업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 담배 소매업은 공공 보건과 유통질서 유지, 청소년 보호 등 사회적으로 다양한 관심 분야와 연계되어 있어 업소의 행정 현황 관리가 매우 중요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드가 포함되어, 각 업소의 인허가 이력, 영업 개시 및 종료, 폐업여부 등 행정 및 운영 현황을 구체적으로 확인할 수 있습니다. 본 데이터는 성동구청 등 관할 행정기관에서 지속적인 점검과 정기적 갱신을 통해 데이터의 신뢰성과 최신성을 확보하고 있습니다. 데이터는 지역 내 담배소매업 현황 파악, 정책 수립, 불법 영업 예방, 상권 분석, 관련 업계 시장 동향 파악 등에 활용될 수 있습니다. 소매업체 선정, 소비자 보호, 상권 개발 등 다양한 목적으로 관계 기관, 업계 종사자, 연구자, 일반 시민에게 투명하고 신뢰할 수 있는 정보를 제공합니다. 데이터는 정기적으로 최신화됩니다.
