summary_user: 충청남도 예산군 관내 태양광 발전사업을 사업장 한 곳당 한 행으로 담은 건별 원장 파일로, 상호명·설치장소·설치대상·허가일자·설비용량·가동상태·공급전압·주파수·설치연도를 포함한다(CSV 약 150KB). 예산군에서 어느 지역에 어떤 규모의 태양광 발전소가 언제 허가되어 가동 중인지 알아보려는 주민·사업자·재생에너지 보급 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치장소 주소나 상호명을 맞춰 붙여야 하며, 전국태양광발전소전기사업허가정보표준데이터와 같은 발전소 단위 원장과 주소·용량 기준으로 대조하는 방식으로 이어 쓴다.
description_portal: 충청남도 예산군 내 태양광설치 현황에 대한 정보를 제공하는 데이터로 상호, 설치장소소재지, 영업구분, 설비용량KW, 공급전압V,주파수Hz, 허가일자, 준비기간종료일을 포함하고 있습니다.이 데이터는 충청남도 예산군 관내에서 설치되거나 운영 중인 태양광 발전시설의 현황을 정리한 공공데이터입니다.태양광 발전사업은 태양에너지를 전기로 변환해 한국전력 등과  전력거래를 하거나 자가소비 목적으로 설치되는 발전시설로,재생에너지 보급률 분석, 발전 인허가 정책 수립, 민간 투자 검토, 환경·경관 영향 분석 등 다양한 분야에서 활용됩니다.
