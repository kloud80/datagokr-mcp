description_portal: 이 자료는 고용보험에서 제공하는 모성보호 제도 관련 연도별 지급현황 데이터로, 출산·육아로 인한 경제활동 중단을 최소화하고 일·가정 양립을 지원하기 위한 제도 실적을 수치로 나타낸 것입니다.제공되는 주요 지표에는 출산전후휴가 수급자 수, 육아휴직 수급자 수, 육아기 근로시간 단축 수급자 수가 포함되며, 각 지표는 다양한 분석 항목별로 분류됩니다.분석 항목은 지역(시도 및 시군구), 사업장 규모(상시근로자 수 기준), 산업 분류(대분류~소분류), 연령대, 통상임금 수준, 성별 등으로 구성되어 있어, 모성보호 정책의 실효성 진단과 정책 대상별 맞춤 분석이 가능합니다.이 데이터는 고용노동정책 수립, 연구기관 분석, 기업 내 제도 설계 시 기초자료로 활용되며, 연도별 추세 비교 및 지역 간 격차 분석 등에도 유용합니다.
