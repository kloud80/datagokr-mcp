description_portal: '중소벤처기업 재직자의 역량강화를 위해 연수사업을 담당하는 중소벤처기업연수원의 서비스 이용편의를 위해 제공 중인 중소벤처기업연수원 홈페이지(sbti.kosmes.or.kr)에서 요청된 카드결제 현황입니다. 해당 목록에서 아래의 칼럼명에 해당하는 데이터를 확인해 주십시오.- 컬럼명 : 기준년(2011년~2024년), 1~12월, 누적 결제건수데이터를 통해 중소벤처기업연수원의 연도별 월별 카드결제 현황을 확인할 수 있습니다.* 중소벤처기업연수원 홈페이지는 중소벤처기업-숲(ssup.kosmes.or.kr)으로 변경되었습니다.* 2024년 데이터는 5월 3일까지의 카드결제정보 데이터입니다.'
