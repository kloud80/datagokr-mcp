description_portal: '2000년~2007년 통계 데이터○ 통계개요* 통계명 : 노동조합 현황* 통계종류 : 서울시 노동조합 조직현황을 제공하는 일반ㆍ보고통계* 작성목적 : 전국노동조합 조직현황을 파악하여 노동정책 수립의 기초 자료 및 노동조합운영?활동 분석 등의 참고 자료로 활용함을 목적으로 함* 조사체계 : 지방노동관서 및 지방자치단체 → 고용노동부* 집계대상 : 행정관청(고용노동부, 지방자치단체)에 설립 신고된 노동조합* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 노동조합수, 노동조합원수 등○ 용어설명* 노동조합 : 근로자가 주체가 되어 자주적으로 단결하여 근로조건의 유지ㆍ개선기타 근로자의 경제적ㆍ사회적 지위의 향상을 도모함을 목적으로 조직하는단체 또는 그 연합단체- 한국노총 : 한국노동조합총연맹, 한국의 각 기관 ·산업체에 조직되어 있는노동조합의 연합단체- 민주노총 : 전국민주노동조합총연맹, 노동자의 권익을 도모하기 위해 설립된노동조합의 연맹체- 국민노총 : 국민노동조합총연맹○ 기 타* 초기업노조의 경우 주된 사무소 소재지를 기준으로 조합원수 산정** 초기업노조 : 산별노조, 지역별·업종별 노조를 포함하는 개념.다만, 여기에서 초기업노조수를 계산할 때는 총연맹수, 연맹수도 포함* 자치구별 자료는 노동조합 조직현황 명부를 기준으로 작성되어 단체조합 및 조합원수의누락 등으로 인해 전체합계와 일치하지 않을 수 있음* 2018년부터 시도단위로 축소(시군구별 자료는 공개대상 정보에 해당하지 않음)○ 출 처 : 고용노동부 노사관계법제과 「전국노동조합 조직현황」'
