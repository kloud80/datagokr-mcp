summary_user: 전국 폐광산을 광산 한 곳씩 담은 파일 자료로, 광산명·광산유형·대표 주소(시도·시군구·읍면동·리)와 폐광일자를 담는다(범위 전국, 행정단위 읍면동). 광해 복구나 지역 정책을 다루는 분석가·지자체 담당자가 '우리 시군구에 언제 문을 닫은 폐광산이 몇 곳 있는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 자료와는 시도·시군구·읍면동 이름이나 광산명을 맞춰 연결해야 한다.
description_portal: 한국광해광업공단의 "지역별 폐광별 폐광일자" 데이터는 전국의 폐광산 현황을 지역별로 정리한 자료로, 폐광산의 위치, 폐광 일자, 광산명, 주소 등의 정보를 포함하고 있습니다. 이 데이터는 광해실태조사에 기반하여 제공되며, 주소는 광산 대표 주소를 기준으로 제공됩니다. 단, 해당 자료는 조사 당시의 데이터로 현재의 광산 현황과 차이가 있을 수 있으므로, 최신 정보는 한국광해광업공단의 공식 홈페이지나 관련 기관을 통해 확인하시기 바랍니다. 이 데이터는 광산 환경 복구, 자원 개발, 정책 수립 등 다양한 분야에서 활용될 수 있습니다.
