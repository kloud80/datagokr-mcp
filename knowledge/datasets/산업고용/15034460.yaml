summary_user: 전라남도 무안군에서 허가된 태양광 발전설비를 업체(상호)별 한 건씩 담은 원장 파일로, 영업구분·발전유형·원동력 종류·설비용량(kW)·허가일자·사업구역을 포함한다. 무안군 안에서 어느 지역에 태양광 허가가 몰려 있고 설비용량이 시기별로 얼마나 늘었는지 확인하려는 지자체 담당자나 에너지 분석가가 쓴다. 전역 조인 키가 없어 사업구역 이름이나 상호로 맞춰야 하며, 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 허가 원장과 견줄 때도 이름 매핑에 기대야 한다.
limits: 표준 조인 키(행정코드·사업자번호 등)가 없어 다른 데이터와는 이름·코드 매핑으로만 연결된다. 무안군 한 시군구 범위의 허가 현황이라 실제 발전량이나 다른 지역 설비는 담지 않는다.
