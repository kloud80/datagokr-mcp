description_portal: 광주광역시 동구 도시가스 연도별 공급량입니다.(2004~2025)데이터는 연별, 합계, 가정용, 난방, 영업용, 업무용, 산업용, 수송용, 데이터기준일자로 구성되어 있습니다.이 자료를 통해 광주광역시 동구 관내의 용도별 주민들의 도시가스 사용량 및 영업용 도시가스 사용량 등을 알 수 있습니다.우리는 이 자료를 통해 도시가스에 대한 다양한 정보를 유추하고 미래의 도시가스 발전의 비전으로 활용할 수 있습니다.친환경에너지의 발전 및 미래 대체 자원의 개발에 중요한 자료가 될 것입니다.해당 자료는 (주)해양에너지의 제공 자료를 토대로 작성된 자료입니다.
