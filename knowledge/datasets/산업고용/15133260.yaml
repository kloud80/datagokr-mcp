description_portal: '장애인기업종합지원센터는 지속가능한 발전과 환경보전을 위한 친환경 경영 실천의 일환으로, 또한 공공기관으로서의 환경 관련 법적 책무를 이행하기 위해, 저공해 자동차의 도입과 운행을 점진적으로 확대하고 있습니다. 이는 단순한 차량 운용의 효율화를 넘어, 국가 온실가스 감축 목표에 기여하고, 미세먼지 등 대기오염물질 저감을 통한 쾌적한 생활환경 조성에 이바지하고자 하는 실천적 노력의 일환입니다.장애인기업종합지원센터의 2020년부터 2024년 까지의 저공해 자동차 보유현황 차종을 구분하여 연도별로 데이터를 제공합니다.데이터: 저공해차(1종), 저공해차(2종), 저공해차(3종), 일반차량, 제외차량'
