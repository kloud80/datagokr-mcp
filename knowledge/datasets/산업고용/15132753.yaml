description_portal: 신용보증재단중앙회가 지역신용보증재단의 보증을 재보증한 상품들의 목록입니다. 기업(개인)을 특정하지 못하도록 고유문자로 치환하여 제공합니다.재보증이란, 신용보증재단중앙회(재보증기관)가 지역신용보증재단(원보증기관)이 소상공인에 대하여 보증한 금액의 일정비율을 재보증하고, 원보증기관이 금융기관에 대위변제 후 회수하지 못한 채권에 대하여 재보증비율에 해당하는 금액을 신용보증재단중앙회(재보증기관)가 지역신용보증재단(원보증기관)에 지급하는 제도입니다.재보증접수 상품 정의와 통지 정보를 포함하는 데이터로 상품명, 상품순번, 상품보증유형, 주상품여부 등의 내용이 포함되어 있습니다.
