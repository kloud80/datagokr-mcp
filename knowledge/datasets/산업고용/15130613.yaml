status: active
summary_user: 한국남동발전의 연료전지 발전소·호기별 하루 발전실적을 일자 단위로 담고, 1시부터 24시까지 시간대별 발전량과 총량·평균·최대·최소를 한 행에 제공하는 건별 원천 데이터입니다. 분석가나 에너지 사업자가 '남동발전 연료전지 발전기가 하루 중 어느 시간대에 얼마나 고르게 발전하는가'처럼 연료전지의 기저부하 운전 패턴과 호기별 가동 실적을 확인하는 데 쓴다. 전역 조인 키는 없어 발전소코드·호기코드·발전소명과 일자(dgenYmd)를 기준으로 같은 기관의 다른 발전실적 데이터나 발전소 이름 매칭으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 전력거래소 등 다른 기관 데이터와는 발전소명·코드 매핑을 직접 만들어야 연결된다. 한국남동발전 소속 연료전지 설비만 담으므로 전국 연료전지 발전량 전체로 해석하지 않는다. 개발계정은 일 10,000회 호출 한도가 있다.
