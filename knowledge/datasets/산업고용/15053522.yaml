summary_user: 한국수력원자력 원전 5개 본부(고리·새울·월성·한빛·한울)의 저장시설에 영구처분 전까지 보관 중인 중저준위 방사성폐기물 드럼 저장량을 날짜(월)별로 본부별 열과 합계 열로 정리한 집계 파일(csv, 약 7KB)이다. 원전 소재 지역 주민이나 에너지·환경 분석가가 "어느 원전 본부에 중저준위 폐기물 드럼이 얼마나 쌓여 있고 시간에 따라 어떻게 늘거나 줄었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜(연도-월-일)나 본부 이름을 맞추는 방식으로만 이어 쓰며, 원전 가동·환경방사선 등 같은 기관의 원전 데이터와 본부명으로 대조하는 정도가 현실적이다.
limits: 본부 단위 드럼 수 집계라 개별 폐기물의 종류·방사능량·발생 원인은 담지 않으며, 공통 코드 키가 없어 다른 데이터와 자동 조인이 어렵다. 범위는 전국 단위의 비공간 데이터로 시설 위치 좌표는 없다.
