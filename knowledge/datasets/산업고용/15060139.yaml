summary_user: '부산 사하구 관내에 옥외광고업으로 등록해 영업 중인 업체를 한 줄에 한 곳씩 담은 건별 현황 파일(csv, 약 6.7KB)로, 등록연월일·업소명·전화번호·도로명주소·영업내용(간판제작, LED조명 등)이 들어 있다. 사하구에서 간판이나 광고물 제작을 맡길 등록 업체를 찾는 주민·사업자, 또는 구 단위 옥외광고업 등록 추이를 보려는 분석가가 쓴다. 실측 컬럼에 사업자번호나 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다(예: LOCALDATA 옥외광고업 인허가 원장, 소상공인 상가업소 데이터).'
limits: 사하구 한 곳만 다루므로 부산 전체나 다른 시군구와 비교하려면 각 구의 파일을 따로 모아야 한다. 전화번호는 개인 휴대폰번호이거나 미집계인 경우 공백으로 처리돼 있고, 조인 키가 없어 다른 데이터와 연결할 때는 이름·주소 매칭 오류에 주의해야 한다.
