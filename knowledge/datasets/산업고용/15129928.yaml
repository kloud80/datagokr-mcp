description_portal: '창업보육실이란, 우수한 창업아이템을 보유한 창업 초기 기업 또는 예비창업자들이 안정적으로 사업을 시작하고 성장할 수 있도록 다양한 자원과 서비스를 지원하는 공간입니다. ‘보육’이라는 단어 그대로, 창업의 초기 단계에 있는 기업들이 외부 환경에 적응하고 자립할 수 있도록 체계적으로 돕는 것이 핵심 목적입니다.특히, 장애인기업 또는 장애인 예비창업자들을 대상으로 한 창업보육실은 창업 여건이 상대적으로 어려운 이들에게 공간적·경제적 부담을 줄여주고, 전문적인 창업 지원을 제공함으로써 자립형 기업으로의 성장 가능성을 높이는 데 중점을 두고 운영되고 있습니다.데이터: 구분, 주소, 연락처'
