summary_user: 한국수력산업협회에 등록된 회원사를 기업 한 곳당 한 행으로 담은 명부 파일(CSV, 약 14KB)로, 구분·기업명·주요분야·업종·웹사이트·본사 전화번호를 담는다. 수력발전 설비·정비 협력업체를 찾는 사업자나 국내 수력산업 기업 현황을 파악하려는 분석가가 '수력 분야에서 어떤 업종의 기업이 활동하나'를 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 기업·발전소 데이터와는 기업명 매칭으로만 이어 쓴다.
description_portal: 한국수력원자력㈜이 공개하는 한국수력산업협회 회원사 명부 데이터입니다. 한국수력산업협회에 등록된 114개 회원사들에 관한 주요 정보를 제공하는 공공 데이터입니다. 해당 데이터는 협회에 가입한 기업의 명칭, 주요 분야, 업종, 웹사이트, 본사 전화번호 등 한국수력산업협회 회원사들의 기본 정보를 포함하고 있습니다. 이 공개데이터를 통해 국내 수력산업 분야의 기업 현황을 파악할 수 있습니다.본사전화번호 또는 웹사이트의 공란은 미수집 데이터로 지속적으로 수집을 진행하고 있습니다.
