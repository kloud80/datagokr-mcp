description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 국민DR일란 특정요건 발생시(수급비상, 미세먼지 예보 나쁨 등) 국민들의 자발적 전력소비 감축 유도를 통한 수요관리 확대 및 에너지절약 확산 도모를 위해 가정, 소형점포 등 소규모 전기사용자가 참여가능한 수용반응 제도입니다. - 대상고객 : 가정, 점포 등 소규모 전기사용자 - 고객요건 : 계약전력 200kW이하, 주택용 전기사업자, 집합건물 내 개별 세대-  거래절차 : 수요감축요청 -> 감축 -> 평가 -> 보상순서 - 거래기간 : 2년단위 - 발령 : )준비) 30분 전 발령 고지, (지속) 1시간, 2회/일, (가용) 제한 없음ㅇ 국민DR 발령내역에 대한 정보를 제공하는 API 입니다.ㅇ 발령일시, 시작시간, 감축시간, 종료시간의 값을 제공합니다.'
