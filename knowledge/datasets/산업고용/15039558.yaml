summary_user: 한국전력공사 전기차충전서비스시스템이 관리하는 충전소별 이용 부가정보를 충전소 한 곳당 한 행으로 담은 전국 범위 파일(CSV 약 41만 바이트)로, 충전소이름·이용가능시간·자세한 위치·주차비·등록일자를 담는다. 전기차 운전자나 지도·내비게이션 서비스 개발자가 "이 한전 충전소는 몇 시까지 쓸 수 있고 주차비는 얼마인가"를 확인하는 데 쓴다. 충전소 ID나 좌표 같은 공통 조인 키가 없어, 다른 충전소 목록·충전기 상태 데이터와는 충전소이름 매칭으로만 이어 쓴다.
description_portal: 한국전력공사 전기차충전서비스시스템에서 에서 관리하고 있는 충전소 이용 정보 데이터 입니다. 데이터는 충전소이름, 이용가능시간, 자세한 위치, 주차비, 등록일자 항목으로 구성되어 있으며 설치한 충전소 이용을 위한 부가정보에 대한 데이터 입니다.해당 데이터를 활용하여 사용자가 편리하게 충전소 정보를 확인할 수 있도록 지도 기반의 서비스나 네비게이션에 접목할 수 있습니다.또한 위치적 접근성을 분석해 충전소 편의성에 따른 다양한 연구를 진행하는데 기초 자료로 활용할 수 있습니다.
