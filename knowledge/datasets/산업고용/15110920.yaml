summary_user: 영주시 관내 태양광 발전사업 허가 건을 발전소 단위로 담으며, 허가번호·발전소명·설치 장소와 위치·허가 용량(MW)·허가일자를 제공한다. 지자체 정책 담당자나 태양광 시공·금융 사업자가 영주시 안에서 어느 지역에 어느 정도 규모의 태양광 허가가 언제 났는지 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 설치 장소 주소나 발전소명을 이름으로 맞추거나 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 주소·용량으로 대조해 이어 쓴다.
limits: 공통 코드나 조인 키가 없어 다른 데이터와의 연결은 주소·이름 매칭에 의존한다. 범위는 영주시 한 곳이라 다른 시군구나 전국 현황은 표준데이터 등 별도 데이터가 필요하며, 좌표가 없는 비공간 데이터다.
