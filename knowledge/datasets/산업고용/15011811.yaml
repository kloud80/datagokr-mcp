summary_user: 광주 서구 관내에 등록된 대규모점포를 점포 한 곳당 한 행으로 정리한 파일로, 적용대상 유형(대형마트·복합쇼핑몰 등), 사업장명, 매장면적(㎡), 도로명 주소, 연락처를 담는다. 상권 분석가나 골목상권 정책 담당자가 "서구에 대형마트·쇼핑몰이 어디에 얼마나 큰 규모로 있는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 도로명 주소를 맞춰 붙이고, 전국대규모및준대규모점포표준데이터·소상공인 상가업소 데이터와는 같은 방식으로 대조해 쓴다.
description_portal: '이 데이터는 광주광역시 서구 관내에 등록된 대규모점포의 주요 현황을 정리한 자료로,점포별로 적용대상 유형(예: 대형마트, 복합쇼핑몰 등), 사업장명, 매장면적(㎡), 도로명 주소, 연락처 정보가 포함되어 있습니다.특히,적용대상은 점포의 업태 또는 유형을 분류한 항목으로, 유통산업발전법상 등록 기준에 따라 분류됩니다.매장면적은 점포의 규모를 수치화한 항목으로, 대규모점포로서의 등록 요건 판단 및 공간 활용 분석에 활용됩니다.도로명주소는 해당 점포의 정확한 위치를 파악할 수 있는 정보로, 위치 기반 행정이나 지도 서비스 연계 시 활용도가 높습니다.연락처는 사업체의 민원 대응이나 행정 연락에 활용할 수 있는 기본 정보입니다.이 데이터는 유통산업 정책 수립, 대규모점포 분포 분석, 도시계획 수립, 지역상권 영향평가, 골목상권 보호 정책 설계,또는 상업시설 입지 분석 등에 기초자료로 유용하게 활용될 수 있습니다.또한, 민간 기업 및 상권분석 플랫폼 등에서 활용 시 입지 경쟁력 평가나 상업시설 분포도 분석에도 도움이 됩니다.'
