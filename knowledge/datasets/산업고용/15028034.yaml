description_portal: 고용서비스 우수기관 인증제는 구인.구직자에 대한 고용서비스 향상에 기여하는 기관을 우수기관으로 인증.공표하는 제도로서 고용서비스 품질향상 촉진 및 구인.구직자의 합리적인 선택지원(2024년 고용서비스 우수기관 인증제에는 48개 기관이 최종 인증)(인증대상) 고용서비스 우수기관 인증대상은 다음 각 호의 어느 하나에 해당하는 자로 한다, 다만, 관련법에 따라 해당 사업을 등록 또는 신고한 날부터 3년이 경과하고 최근 3년간 사업정지 이상의법령위반 처분을 받은 사실이 없는 자로 한정한다.1. 유로 및 무료직업소개업자, 직업정보제공업자, 그 밖에 관련 사업주단체, 근로자단체 또는 각각이 그 연합체2. 초.중등학교법 제2조제4호에 따른 고등학교, 고등기술학교3. 고등교육법 제2조에 따른 학교4. 비영리민간단체지원법에 따른 비영리민간단체로서 고용노동부장관이 정하여 고시하는 조직 및 인력기준을 갖춘 단체(선정) 1단계 서류심사 -> 2단계 현장실사 및 발표심사 후 노사정전문가로 구성된 인증위원회에서 선정(유효기간 3년)* 인증받은 48개 기관 중 우수한 성과를 거둔 7개 기관* 2024년 민간고용서비스 우수시관 대상은 (주)사람인, 최우수상은 잡코리아, (주)제이비커리어, 은평여성인력개발센터 수상(사업절차) 사업공고->사업신청->서류심사->법령위반 등 행정처분 확인->평가(현장실사 및 발표심사)->인증위원회 심의->우수기관 선정->사후관리  * 2024년에는 48개 기관 중 우수서비스 창출에 성과를 거둔 7개 기관을 대상, 최우수상, 우수상으로 차등 시상하여 기관의 브랜드 가치를 높임  (효과) 고용서비스 우수기관 인증 신청 과정은 자사의 서비스 품질을 진단하고 개선할 수 있는 기회 부여(인세티브) 고용서비스 우수기관으로 인증받은 기관은 인증서와 인증패가 수여되고 인증마크를 3년간 사용, 기업은행, 농협 등 시중은행 금리우대, 지도단속 면제, 고용 관련 민간위탁사업 선정 시 가점 부여, 직업안정법 행정처분 감경 가능 등
