summary_user: 경상북도 경주시 관내에 등록된 행정사사무소를 사무소별로 한 줄씩 담은 원천 목록 파일로, 사무소 명칭과 소재지 주소를 담는다(CSV 약 2.3KB의 작은 파일). 경주에서 민원서류 작성이나 인허가 신청 대행을 맡길 행정사사무소가 어디에 있는지 찾는 시민, 또는 읍·면·동별 행정사 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 사무소명으로 맞춰 이어 쓰며, 같은 업종 인허가(LOCALDATA) 계열의 행정사 데이터와는 이름·주소 매칭으로만 연결한다.
description_portal: 본 데이터는 경상북도 경주시 관내에서 등록·운영 중인 행정사사무소의 현황을 정리한 파일 형식의 공공데이터이다. 행정사사무소는 주민의 각종 민원서류 작성, 인허가 신청 대행, 출입국 관련 문서 처리 등 다양한 행정업무를 대행하며, 국민의 행정 서비스 접근성을 높이는 데 기여하는 전문 기관이다. 데이터에는 사무소 명칭, 소재지 등의 항목이 포함되어 있으며, 민원 처리 효율성 분석, 지역 서비스 분포 파악, 행정사 수요 조사 등 다양한 행정목적에 활용할 수 있다. 경주시는 본 데이터를 주기적으로 갱신하여 최신 정보를 반영하고 있으며, 투명하고 신뢰받는 민원행정 실현을 위하여 해당 정보를 개방하고 있다.
