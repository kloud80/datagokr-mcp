summary_user: 성남시 중앙지하도상가 안 점포를 한 행씩 담은 파일로, 점포 위치(동·열·호수·상가 호수)와 상호명, 취급업종, 전화번호가 들어 있다(CSV 약 46KB). 지하도상가에 어떤 업종 점포가 어디에 몰려 있는지, 특정 업종의 빈자리나 경쟁 점포가 있는지 알아보려는 창업 준비자나 상권·공유재산 담당자가 쓴다. 전역 조인 키가 없어서 소상공인 상가업소 원장 같은 다른 데이터와는 상호명·업종명을 직접 맞춰야만 이어 쓸 수 있다.
