summary_user: 한국에너지공단이 인증한 급수처리시설 제품을 모델 단위로 담은 원장 API로, 업체명·모델명·종류·인증번호·인증일·인증 종료일·상태·제조국 등을 제공한다. 정수장·상수도·건물 급수 설비 제품을 고르는 기관이나 업체가 "이 모델이 인증을 받았고 지금도 유효한가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·모델명 같은 이름 매칭이나 같은 기관의 인증번호로만 이어 쓴다.
description_portal: 본 데이터는 수처리 분야에서 사용되는 급수처리시설 및 관련 제품 중 「환경기술 및 환경산업 지원법」 또는 「수도법」 등 관련 법규에 따라 정부가 지정하거나 공인된 인증을 획득한 인증제품들의 상세 정보를 제공합니다. 깨끗하고 안전한 물 공급은 국민 건강과 직결되는 중요한 공공 서비스이며, 이를 위해서는 급수처리시설의 성능과 안전성이 확보되어야 합니다. 이 데이터셋은 공신력 있는 인증을 받은 급수처리시설 제품의 정보를 투명하게 공개하여, 제품의 신뢰도를 높이고 시장의 건전한 발전을 도모하는 데 목적이 있습니다. 이를 통해 정수장, 상수도 시설, 건물 내 급수 시스템 등에 사용되는 제품을 선정하는 기관이나 기업은 검증된 제품을 쉽게 찾을 수 있으며, 제조사들은 친환경적이고 고품질의 제품 개발을 유도받아 국민에게 안전한 물을 공급하는 데 기여합니다.
