summary_user: 한국가스안전공사가 관리하는 전국 LPG 충전소를 업소별 한 행씩(업소명·행정구역·관리구분·전화번호·주소·위도·경도) 담은 현황 API이다. 가까운 LPG 충전소가 어디 있는지 찾거나, 지역별 충전소 입지를 분석하려는 국민·사업자·분석가가 쓴다. 위도·경도(LAT, LOT)와 주소(ADDR)를 키로 지도·GIS 데이터나 다른 주소 기반 데이터와 이어 쓰며, 충전소 ID 같은 별도 식별 키는 필드에 없다.
description_portal: '한국가스안전공사가 수집 및 관리하는 전국 LPG 충전소의 현황 정보를 제공합니다. LPG 충전소 소재, 충전소 대표 전화번호, 관리유형, 상세위치(위도,경도) 등의 정보를 api 형태로 제공합니다.충전소 운영 현황, 입지 선정, GIS 서비스 등에 활용할 수 있습니다.※ 해당 정보는 타 유관기관에서 자체 수집, 관리를 통해 제공하는 정보와 일부 상이할 수 있음을 참고 바랍니다.※ 전화번호의 경우, 개인정보 또는 확인이 불명확한 정보에 대해서는 공란으로 처리되어 있으니 참고 바랍니다.-데이터 기준일자: 실시간 반영됩니다.'
team:
