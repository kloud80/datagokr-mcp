description_portal: 한국동서발전에서 제공하는 드론탐지로그 데이터는 발전소 주변에서 탐지된 미확인 비행체(드론 등)에 대한 탐지 정보를 기록한 자료입니다. 데이터는 최초탐지시간, 최종탐지시간, 미확인비행체모델, 하드웨어식별자, 탐지방법, 탐지기번호, 탐지위치(위·경도 및 정밀좌표) 등으로 구성되어 있으며, 드론의 비행 패턴과 침입 경로를 분석하거나 보안 취약 구역을 식별하는 데 활용할 수 있습니다. 해당 데이터는 발전소와 같은 중요시설의 보안체계를 강화하고, 무인기 탐지 기술 및 대응체계 고도화 연구에도 기초자료로 유용합니다. 학계와 연구기관에서는 본 데이터를 활용하여 드론 탐지 알고리즘 개발, 비행체 식별 기술 연구, 공공안전 관리체계 분석, 인공지능 기반 위협 예측 모델 구축 등 다양한 실증 연구를 수행할 수 있습니다.
