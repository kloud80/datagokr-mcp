summary_user: 부산광역시 사하구에서 담배소매인으로 지정된 업소를 한 건씩 담은 원천 목록으로, 업소명·소재지 주소·지정일자·폐업일을 담고 영업 중인 업소는 폐업일이 비어 있다. 사하구에서 담배 판매점을 새로 내려는 사업자가 주변에 이미 지정된 소매점이 어디에 있는지, 언제 지정되거나 폐업했는지 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 업소명이나 주소를 맞춰 잇고, 같은 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 데이터와 대조할 때 쓴다.
limits: 표준 조인 키나 좌표 컬럼이 없어 다른 데이터와 연결하려면 업소명·주소 문자열을 맞추거나 주소를 좌표로 바꾸는 작업이 필요하다. 범위는 사하구 한 곳뿐이다. 포털 설명에 따르면 업소명이나 도로명 주소가 불명확한 업소는 목록에서 빠져 전수 목록이 아니다.
