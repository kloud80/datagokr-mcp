description_portal: 본 데이터는 경상남도 합천군 관내에 설치된 전기사업(태양광발전소) 양수인가에 관한 자료를 제공하고 있습니다.「전기사업법」 제28조에 따라 기존 전기사업자가 보유한 사업권을 타 사업자에게 양도하거나, 이를 승계하는 과정에서 산업통상자원부 또는 관할 지방자치단체의 인가를 받은 발전소 현황에 관한 자료입니다.해당 데이터는 발전소명, 소재지, 원동력의 종류, 설비용량(KW), 인가일자의 자료로 구성되며, 본 데이터를 통하여 경상남도 합천군 관내에 인가받은 태양광 발전소 현황을 분석하고 이해하는데 기초자료로 활용할 수 있습니다.
