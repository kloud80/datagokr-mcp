summary_user: 한국수력원자력이 운영하는 고리·한빛·월성·한울·새울 원자력본부별로 원자로 출력(%)과 발전기 출력(MWe)을 갱신 시각과 함께 담은 실시간 조회 API이며, 건별 원장이 아니라 본부별 현재 상태값이다. 에너지 분석가나 언론, 국민이 '지금 특정 원전 본부의 원자로가 정상 출력으로 가동 중인가, 몇 MWe를 내고 있나'를 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 맞물리는 전역 조인 키가 없어서, 발전소 이름이나 본부 구분 코드(genName)를 다른 발전소·전력 수급 데이터의 이름과 직접 대응시켜 이어 쓴다.
description_portal: '위 API 는 한국수력원자력(주)_원자력발전소 실시간 발전 현황 API입니다.한국수력원자력에서 운영중인 원자력발전소(고리원자력본부, 한빛원자력본부, 월성원자력본부, 한울원자력본부, 새울원자력본부)의 실시간 발전소 출력량(원자로 및 발전기 출력량) 조회 API입니다.○ serviceKey: 공공데이터포털에서 받은 인증키○ genName : 발전소 구분 WS : 월성 KR : 고리 YK : 한빛 UJ : 한울 SU:새울○ expl: 아이템 설명○ name :아이템 설명○ time : 갱신 시간○ value : 발전기 출력(MWe),원자로 출력(%)'
