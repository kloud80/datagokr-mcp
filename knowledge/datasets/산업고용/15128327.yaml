description_portal: KOTRA에서 공공데이터포털에 제공하는 해외취업 자문변호사 자문내역 데이터는 해외 취업을 희망하거나 이미 취업 중인 국민들이 현지 법률 이슈에 대해 자문을 받을 수 있도록 운영된 상담 내용을 정리한 데이터입니다. 각 해외무역관 소속 자문변호사가 부당해고, 비자문제, 근로계약 해지, 임금체불 등 상담자가 겪고 있는 법률 문제에 대해 자문한 내용을 문의유형별로 분류하여 반영하였습니다. 이 데이터는 해외취업 희망 구직자 및 기존 근로자들이 현지 법률 환경과 리스크를 사전에 파악할 수 있도록 도움을 주고, 아울러 관련 기관 및 기업이 해외 인재 파견 시 고려해야 할 법적 사항에 대한 인사이트를 확보할 수 있는것에 의의가 있는 데이터 입니다.
