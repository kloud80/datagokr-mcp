summary_user: 경기도 가맹사업 관련 시스템 이용자를 대상으로 한 설문조사의 메타정보를 설문 1건당 1행으로 담으며, 설문 번호·제목·목적·응답자 수로 구성된 집계성 목록이다. 경기도 가맹사업 정보서비스를 운영·평가하는 담당자나 분석가가 어떤 주제(만족도, 시스템 점검, 서비스 개선)의 설문이 몇 명의 응답을 받았는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 설문명 같은 이름 매핑이나 같은 기관 자료로만 연결된다.
description_portal: 이 데이터는 경기도 가맹사업 관련 시스템 사용자들을 대상으로 실시된 다양한 설문조사의 메타정보를 담고 있는 자료입니다. 주요 항목은 "설문순번", "설문제목", "설문목적", "응답자수"로 구성되어 있으며, 각각 설문조사의 식별번호, 설문명, 조사의 의도 및 목적, 응답자의 수를 나타냅니다. 설문 제목은 사용자 만족도 평가, 시스템 점검 의견, 서비스 개선 방안 도출 등 다양한 주제로 구성되어 있고, 이는 공공서비스 품질 향상 및 사용자 중심 정보제공체계 개선에 활용됩니다. 본 데이터는 정성적 피드백을 수집하고, 이용자 반응을 정량화하여 정책적 의사결정과 시스템 기능 개선에 반영하는 데 기초자료로 활용될 수 있습니다.
