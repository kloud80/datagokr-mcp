summary_user: 노무제공자·특수형태근로종사자의 산재보험 신청 건수와 승인 건수를 직종별(보험 모집인, 건설기계 조종사, 방문 강사, 골프장 캐디, 택배 기사 등)로 2018~2024년 연도별로 집계한 전국 단위 통계 파일(csv, 약 1.8KB)이다. 정책 담당자나 노동 연구자가 '택배 기사나 골프장 캐디 같은 특고 직종에서 산재 신청과 승인이 해마다 얼마나 늘었고 승인율은 직종별로 어떻게 다른가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 산재·고용 통계와는 직종 이름을 맞춰 연결해야 한다.
description_portal: '이 데이터는 산업재해보상보험에 가입된 노무제공자 및 특수형태근로종사자(특고)의 산재보험 신청 건수와 승인 건수를 직종별로 상세하게 집계한 통계 자료입니다. 통계 항목은 보험 모집인, 건설기계 조종사, 학습지·교육교구 방문 강사, 골프장 캐디, 택배 기사 등 주요 특고 직종별로 연도에 따른 신청 및 승인 현황을 제공합니다. 이 자료는 노동 환경 변화에 따라 법적 보호 대상이 확대된 특수형태근로종사자들의 재해 발생 규모와 산재 인정 실태를 명확하게 보여줍니다. 특히, 직종별로 산재 위험도와 보험 적용의 포괄 범위를 파악하는 데 필수적인 근거 정보라고 판단됩니다. (※ 단, 2023. 7. 1. 이후로 노무제공자 산재보험 특례 가입에 대한 법이 시행된 이후로, 특수형태근로종사자 법 조항은 삭제되었습니다. [법률 제18928호, 2022. 6. 10., 일부개정])본 데이터는 특수형태근로종사자 보호 정책 및 노동 시장 연구에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 직종(예: 택배 기사, 골프장 캐디 등)에서 산재 신청 및 승인 건수가 급격히 증가하는 추이를 분석함으로써, 해당 직종의 업무 환경 개선과 재해 예방을 위한 맞춤형 정책을 시급히 수립할 수 있습니다. 또한, 직종별 승인율의 차이를 분석하여 특고 직종별 업무상 재해 인정 기준의 적정성을 검토하고, 노동 관계 법령 및 사회 안전망의 사각지대를 해소하는 데 기여할 수 있다고 판단됩니다.'
