summary_user: 전통시장 시장경영지원사업(구 시장경영패키지지원사업)의 지원 내역을 시장·상인회 단위 건별로 담으며, 지원연도·지원기간·광역/기초 지자체·시장명·지원금액(백만원)·상인회 이름과 연락처를 수록한 전국 범위 파일이다. 정책 분석가나 지자체 담당자가 "어느 지역 전통시장에 연도별로 얼마가 지원됐고 사업 주체 상인회는 어디인가"를 비교·평가하는 데 쓴다. 전역 조인 키가 없어 다른 전통시장·상권 데이터와는 광역·기초 지자체명과 시장명을 이름 매칭해 이어 써야 한다.
description_portal: 소상공인시장진흥공단 시장경영지원사업(구.시장경영패키지지원사업) 데이터는 전통시장 활성화를 위한 시장경영지원사업의 지원 현황을 연도별로 제공하며, 서울시를 포함한 각 시장에 대해 지원연도, 지원기간, 관할 지자체, 시장명, 지원금액(백만원), 상인회 이름 등의 정보가 수록되어 있습니다. 해당 지원내역은 각 시장 상인회를 중심으로 배정, 상인회가 사업 주체로 명시되어 있다는 점이 특징입니다. 전통시장 육성 정책의 지역별 배분 및 행정 효율성 분석, 사업성과 평가 및 지역별 시장 지원 비교 분석 등에 정책분석의 기초자료로 활용될 수 있는 데이터 입니다.
