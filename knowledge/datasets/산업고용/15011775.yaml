summary_user: 부산광역시 남구 관내에서 영업 중인 대규모점포와 준대규모점포를 점포별로 한 행씩 담은 소규모 현황 파일(CSV 약 1.9KB)로, 점포 구분·상호·도로명 소재지·전화번호를 담는다. 남구에 어떤 대형마트·기업형 슈퍼마켓이 어디에 있는지 확인하거나, 상권 분석에서 지역 내 대형 유통점 분포를 파악하려는 주민·소상공인·분석가가 쓴다. 공통 조인 키나 코드가 없어 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 정보와는 상호·주소를 맞춰 이어 쓴다.
description_portal: 현재(2026. 6. 18. 기준) 부산광역시 관내 영업하고 있는 (준)대규모점포의 현황 파일입니다. 전통상업보전구역 내 및 외에 위치한 영업소(개설등록 대상 여부 포함)를 고려하였습니다. 각 사업장의 점포 구분, 상호, 사업장 소재지 주소(도로명 주소), 사업장 연락처를 모두 포함하였습니다.유통산업발전법 제2조(정의)제3호 및 같은 법 [별표1] 에 명시된 6가지 대규모점포 종류 중 제6호인 "그 밖의 대규모점포" 에 등록된 전통시장의 경우, 전통시장 및 상점가 육성을 위한 특별법에 따른 전통시장과 구분하기 위해 상기 현황에서 제외하였습니다.
