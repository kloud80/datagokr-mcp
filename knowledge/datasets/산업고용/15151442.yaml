summary_user: 경기도 내 프랜차이즈 가맹사업 정보를 연도별 행으로 담으며, 상호·프랜차이즈명·주소, 업종 대·중분류, 자산액·안전등급, 신규 가맹점 수·임직원 수, 관심도·체험 신청 건수, 각종 정보의 최신 등록일을 포함한다. 예비 창업자나 분석가가 "경기도에서 어떤 업종의 프랜차이즈가 신규 가맹점을 늘리고 있는가"를 연도별로 비교하는 데 쓴다. 전역 조인 키는 없고, 시도·시군구 코드(sido_cd, signgu_cd)나 프랜차이즈명·상호 이름 매칭으로 상가업소·인허가(LOCALDATA) 같은 지역 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 프랜차이즈 가맹사업 관련 정보를 종합적으로 제공하는 자료로, 각 가맹점의 상호명, 프랜차이즈명, 주소, 연도별 정보 등록일, 업종분류(대분류 및 중분류), 임직원 수, 관심도 및 체험 신청 관련 항목들로 구성되어 있습니다. 프랜차이즈 본사의 최신 등록일 정보와 가맹점 관련 정보의 변동 이력도 포함되어 있어, 프랜차이즈의 성장 여부나 운영 상태를 파악하는 데 유용합니다. 이 데이터는 지역 내 창업 트렌드 분석, 업종별 시장 구조 파악, 프랜차이즈 정책 수립 등에 활용될 수 있습니다. 데이터는 연도별로 갱신된 정보 이력을 포함하고 있어 시간에 따른 프랜차이즈 변화 추적이 가능합니다.
