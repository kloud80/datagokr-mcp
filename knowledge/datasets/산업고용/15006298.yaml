summary_user: 한국중부발전이 전력시장에 판매한 전력량(MWh)과 판매수익(억원)을 일자별로 정리한 회사 단위 집계 파일로, 약 11KB 크기의 CSV입니다. 에너지 분석가나 연구자가 '중부발전의 일별 판매량과 수익이 계절에 따라 어떻게 변하고, 판매량당 수익으로 본 단가 추이는 어떤가'를 살피는 데 쓴다. 전역 조인 키는 없고 일자(일자)만 공통 축이므로, 같은 날짜 기준으로 전력거래소의 SMP·수급 데이터나 다른 발전사의 판매 실적과 맞춰 붙여 쓴다.
