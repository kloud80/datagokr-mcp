summary_user: 전국 도시가스 보급률을 시도와 도시가스 회사 단위로 묶어 2015~2024년 연도별 열로 담은 집계 통계 파일이다. 지역별 도시가스 보급 수준이 어떻게 달라졌는지, 어느 시도·공급회사 권역의 보급률이 낮은지를 비교하려는 분석가나 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도명·회사명을 이름으로 맞춰 다른 지역 통계나 도시가스 사업자 인허가 원장과 연결해야 한다.
description_portal: '한국가스안전공사에서 보유 및 관리하고 있는 전국 도시가스의 보급률 현황에 대한 정보를 제공합니다. 해당 데이터는 시도별, 회사별, 연도별 전국의 도시가스 보급률 현황으로 구성되어 있습니다.※ 2015~2024년 까지 집계된 통계 자료입니다.※ 참고 : 강원-명성 : 2015~2016년 데이터는 미집계에 따른 공란입니다.※ 해당 데이터는 공사가 안전관리 업무 수행을 목적으로 수집, 관리하고 있는 데이터이며 타 유관기관 데이터와 일부 상이할 수 있습니다.-데이터 기준일자 : 2025년 11월 28일'
