summary_user: 근로복지공단이 산업재해 신청 건수와 승인 건수, 승인율(퍼센트)을 금융·보험업, 광업, 제조업, 건설업, 운수업 등 업종별·연도별로 집계한 전국 단위 통계 파일(csv)이다. 정책 담당자나 분석가가 '건설업이나 광업의 산재 신청·승인 건수가 해마다 어떻게 변했고, 업종별 승인율은 얼마나 차이 나는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산재·고용 통계와는 업종명과 연도를 직접 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 산업재해 신청 및 승인 현황을 사업 종류별(업종)로 집계한 통계 자료입니다. 통계 항목은 금융 및 보험업, 광업, 제조업, 건설업, 운수업 등 주요 산업 분류별로 신청 건수, 승인 건수, 그리고 승인율(퍼센트)을 연도별로 제공합니다. 이 자료는 국내 산업재해 발생의 주요 특징 중 하나인 업종별 재해 취약성을 명확하게 보여줍니다. 특히, 각 산업 분야의 위험도와 산재 인정 실태를 파악하는 데 필수적인 근거 정보이며, 산업 안전 관리의 우선순위를 정하는 데 중요한 기초 자료가 된다고 판단됩니다.본 데이터는 산업 안전 정책 수립 및 위험도 평가에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 광업이나 건설업 등 고위험 산업군에서 발생하는 산재 신청 및 승인 건수 추이를 분석함으로써, 해당 업종에 대한 특별 안전 점검 및 관리 감독을 강화할 수 있습니다. 또한, 금융 및 보험업 등 상대적으로 저위험군으로 분류되는 업종의 승인율을 분석하여 산재보험 제도의 포괄 범위와 인정 기준의 적정성을 검토할 수 있습니다. 이 통계는 산업별 특성을 반영한 맞춤형 예방 정책을 수립하고, 모든 근로자의 안전과 건강권을 확보하는 데 기여할 수 있다고 판단됩니다.
