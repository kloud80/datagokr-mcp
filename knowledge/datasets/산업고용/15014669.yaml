description_portal: 본 데이터는 2024년 기준(2025년 공표) 국내 신·재생에너지 보급 및 생산 현황을 다각도로 분석한 통계 자료입니다.  이 통계는 국내 신·재생에너지 정책 수립과 보급 현황 분석, 연구 및 시장 분석의 핵심 기초자료로 폭넓게 활용됩니다.제공되는 파일은 분석의 편의를 위해 크게 세 가지 세부 통계로 구성되어 있습니다. 우선 연도별 지역별 현황은 최근 3개년(2022년~2024년) 간의 전국 및 17개 광역지자체를 대상으로 에너지생산량, 발전량, 보급용량 등을 교차 비교할 수 있도록 수록했습니다. 또한 세부 에너지원별 현황은 태양광, 풍력, 수소, 폐기물에너지 등 총 25개로 세분화된 에너지원 단위의 구체적인 생산 및 보급 데이터를 시트별로 제공합니다. 마지막으로 기초지자체별 현황은 전국 시·도 산하의 시·군·구 단위까지 들어간 상세 수치를 포함하고 있어 더욱 미시적인 지역별 에너지 보급 현황 파악이 가능합니다.
