summary_user: 전북특별자치도 순창군 관내 태양광발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 상호·소재지 주소·영업 상태·설비용량(kW)·허가일자·사업개시일이 들어 있다. 군 안에서 태양광 설비가 어느 읍면에 얼마나 몰려 있는지, 언제 허가받아 가동을 시작했는지를 확인하려는 주민·사업자·에너지 정책 분석가가 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보표준데이터 등 다른 자료와는 상호명·소재지 주소를 맞춰 붙여야 한다.
description_portal: 전북특별자치도 순창군 관내에 위치한 태양광발전소 설치 현황 및 정보(상호명, 소재지 주소, 설비용량, 사업허가일, 사업개시일) 데이터를 제공합니다.태양광 발전소란 태양 전지를 사용하여 태양의  빛을 직접 전기 에너지로 바꾸는 시설이 설치되어 있는 발전소로, 전 세계적으로 재생에너지 전환의 핵심축으로자리잡고 있습니다.본 데이터는 신재생에너지 보급현황 파악, 지역 내 에너지 자립도 분석, 에너지 인프라 구축 계획 수립 등 다양한 행정 및 정책 수립에 유용하게 활용될 수 있습니다.또한 설비규모와 설치현황 정보는 민간 사업자나 연구기관에서도 활용도가 높습니다.
