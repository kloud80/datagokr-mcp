summary_user: 안양시 관내 LPG·CNG 가스충전소를 한 곳씩 담은 목록으로, 시설명·허가구분(LPG/CNG)·도로명주소 세 항목만 있으며 파일 크기가 394바이트로 몇 건 안 되는 작은 시군구 단위 현황이다. 안양시에서 LPG 차량이나 CNG 버스를 충전할 수 있는 곳이 어디인지 찾는 시민, 관내 가스충전 인프라 분포를 보는 도시계획·에너지 담당자가 쓴다. 전역 조인 키는 없어 다른 충전소·주유소 데이터와는 도로명주소나 시설명을 맞춰 연결해야 한다.
