description_portal: '한국산업기술진흥원의 원내 과제 지원을 통한 기관간의 국제기술협력 관련 성과 데이터 자료로서 참여국가, 과제명, 주관기관 등의 다양한 관련 자료를 제공합니다. 본 데이터는 국제적으로 기술협력 프로젝트를 진행한 과제의 성과를 정리하여 관계기관 또는 연구자들이 활용할 수 있도록 기획되었습니다. 이를 통해 연구개발(R&D) 분야에서의 새로운 협력 기회를 모색하거나, 특정 국가와의 기술협력 현황을 비교 분석하는 데 유용할 것입니다. 이 데이터는 기본적인 과제 정보 이외에도 해당 과제가 진행된 년도, 주관기관명, 시작 및 종료일자 등 각종 정보를 포함하고 있어, 연구자는 물론 기업체에서도 해외시장 진출 전략을 수립하는 데 필요한 기초 자료로 활용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 성과발생년도(숫자형), 기술개발과제명(문자형), 주관기관(문자형), 시작일자(날짜형), 종료일자(날짜형), 해외참여기관(문자형), 해외참여국가(문자형), 해외참여연구원수(숫자형), 국가과학기술정보서비스(NTIS)순번(숫자형), 등록일자(날짜형) 등으로 구성되어 있어, 각 정보가 체계적으로 정리되어 있습니다.'
