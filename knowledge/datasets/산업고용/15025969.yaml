summary_user: 부산광역시 동래구 관내 액화석유가스(LPG) 판매업소를 업소별로 한 줄씩 담은 원천 목록으로, 상호(법인 또는 상호)·소재지주소·전화번호를 담는다(파일 크기 약 1KB). 동래구 주민이나 사업자가 '우리 동네에서 LPG 가스를 배달·판매하는 업체가 어디이고 연락처가 무엇인가'를 찾을 때 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 주소를 지오코딩하거나 상호명을 맞춰 보는 방식으로만 이어 쓴다.
limits: 동래구 한 개 시군구만 다루므로 부산 전체나 전국 LPG 판매업소 현황은 다른 구·기관 데이터를 따로 모아야 한다. 업소 ID·좌표·인허가 코드가 없어 오피넷 충전소나 인허가 데이터와 키로 바로 연결되지 않는다.
