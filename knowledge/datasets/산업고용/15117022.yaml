description_portal: '한국산업기술진흥원의 과제지원을 통한 교육연수활동 관련 고객만족도 자료 현황으로 조사기관, 년도, 평점 등의 데이터를 제공합니다. 이 데이터는 교육 연수 프로그램의 질을 평가하고 개선하는 데 중요한 자료로 활용될 수 있습니다. 또한, 기업이나 연구기관에서 교육 연수 프로그램에 대한 고객의 피드백을 분석하여 정보 기반의 의사결정을 할 수 있는 기초 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형): 해당 연도에 성과가 발생한 연도접수번호(문자형): 각 조사에 대한 고유한 식별번호교육연수고객만족도순번(숫자형): 고객만족도 조사의 순번조사명(문자형): 실시된 조사의 명칭조사기관명(문자형): 조사를 수행한 기관의 이름조사년도(숫자형): 조사가 실시된 연도조사결과 만점(숫자형): 조사에서의 총 평가 점수조사결과평점(숫자형): 고객이 평가한 만족도국가과학기술정보서비스(NTIS)순번(숫자형): 해당 데이터가 등록된 NTIS의 고유한 식별 번호 등록일자(날짜형): 데이터가 시스템에 등록된 날짜'
