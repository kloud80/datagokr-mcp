description_portal: '고용노동부는 「산업안전보건법」 제57조 및 고용노동부 고시 산업재해조사표 작성지침에 따라 재해자의 직업 정보를 직업분류 맞춰 분류하고 있습니다.직업은 통계청의 통계분류 항목에서 한국표준직업분류를 참조하여 세세분류(5자리)를 적습니다. 다만, 한국표준직업분류 세세분류를 알 수 없는 경우 알고 있는 직업명을 적고, 재해자가 평소 수행하는 주요 업무내용 및 직위를 추가로 적습니다.[예 : 토목감리기술자, 전문간호사, 인사 및 노무사무원, 한식조리사, 철근공, 미장공, 프레스조작원, 선반기조작원, 시내버스 운전원, 건물내부청소원 등]'
