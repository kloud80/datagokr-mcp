summary_user: 도시가스법에 관련된 KGS Code(가스안전 분야 시설·검사·기술 상세기준)의 목록을 코드 한 건당 한 행으로 담은 현황 파일로, 분류·코드번호·코드명·최신버전·내용쪽수로 구성되며 전국 단위의 비공간 데이터이고 파일 크기는 약 2KB(1,979바이트)로 작다. 도시가스 사업자나 설비 설계·시공 담당자가 '도시가스 시설에 적용되는 상세기준 코드는 무엇이고 현재 최신 버전은 몇 판인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 코드번호·코드명 같은 이름·코드 매핑으로만 연결하며, 고압가스·LPG 등 같은 기관의 다른 KGS Code 현황 파일과는 코드번호 체계로 나란히 대조한다.
limits: 코드 목록과 버전·쪽수만 담고 기준 본문 내용은 없으며, 사업장·시설 단위 정보나 지역 구분이 없어 인허가 원장과 직접 결합하지 못한다. 활용신청 없이 포털에서 CSV 파일로 받는 방식이다.
