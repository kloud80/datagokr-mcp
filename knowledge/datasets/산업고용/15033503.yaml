summary_user: 대구광역시 군위군에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 업소명·지번주소·도로명주소·지정일자를 담는다(CSV 파일 약 9.7KB). 군위군에서 특정 가게가 담배소매인으로 지정됐는지, 어느 지역에 소매점이 몰려 있는지를 확인하려는 주민·사업자·행정 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 맞춰 붙이거나, 같은 지방행정 인허가(LOCALDATA) 계열 데이터와 기관 단위로 이어 쓴다.
description_portal: 대구광역시 군위군의 담배소매인 지정현황에 대한 데이터로 업소명, 업소지번주소, 업소도로명주소, 지정일자의 항목을 제공합니다. 담배사업법 제16조(소매인의 지정)에 의합니다. 국가 또는 지방자치단체가 특정 영업점에 대해 담배소매권을 부여한 내역을 기록한 공공행정 데이터입니다. 이 데이터는 담배 유통 질서의 관리, 영업환경 분석, 공정 경쟁 유지, 보건정책 수립, 생활 인프라 관리 등 다양한 행정 및  상업 목적에 활용됩니다. 거리 제한, 입지 제한 등을 확인하여 공정한 소매환경을 조성하고, 특정 지역의 소매인 밀도를 분석하여 과밀 여부 및 신규 지정을 판단하고, 청소년 유해시설 인근 담배소매점 위치 분석 및 조정을 검토하고, 지정일 기반의 연차관리, 유효성 점검, 해제 대상 점검 등에 사용하고, 무단 담배판매 신고시 지정 여부 확인용으로 활용하고, 프랜차이즈 본사의 입점 전략, 담배 매출 경향 파악 등에 활용됩니다.
