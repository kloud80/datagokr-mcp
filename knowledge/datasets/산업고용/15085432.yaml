description_portal: FEMS(공장에너지관리시스템)는 공장의 에너지 사용 효율을 높이기 위해 센서와 계측장비, 분석 소프트웨어 등을 활용하여 에너지 사용 현황을 실시간 모니터링하고 관리할 수 있는 통합관리 시스템입니다. 한국에너지공단은 중소·중견 제조업 사업장의 에너지 소비 절감과 효율 개선을 목적으로 FEMS 설비 설치를 지원하는 보급 지원사업을 수행하고 있으며, 본 데이터는 해당 사업에 참여한 사업장의 명단을 제공합니다.제공되는 주요 항목은 사업장명과 참여연도이며, 이 데이터를 통해 기업과 연구기관은 FEMS 도입 현황 및 산업별·연도별 보급 추세 분석, 에너지 관리 효율화 사례 연구 및 정책개발을 위한 기초 자료로 활용할 수 있습니다.
