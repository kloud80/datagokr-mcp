summary_user: '소재부품장비산업의 품목별 생산통계를 통계년도·품목(소재부품장비코드) 단위로 집계해 사업체수, 종업원수, 부가가치, 생산·출하·재고금액(백만원)을 담은 전국 단위 집계 파일이다. 정책 분석가나 업계 연구자가 "특정 소부장 분야(예: 정밀가공장비)의 생산금액과 사업체수가 연도별로 어떻게 변했나"를 확인하는 데 쓴다. 소재부품장비코드(sobujang_item_cd)를 키로 같은 분류체계를 쓰는 다른 소부장 통계와 이어 쓰며, 지역 코드나 사업자번호는 없어 지역·개별 기업 데이터와는 직접 연결되지 않는다.'
description_portal: '산업통상자원부_소재부품장비 생산통계 품목별 산업현황은 소재부품장비산업에 대한 현황을 파악하고 소재부품장비산업 육성정책의 근거를 마련하기 위한 통계소재부품장비산업의 품목별 생산통계에 관한 데이터로 품목별 사업체수, 종업원수, 부가가치세금액,  생산금액, 출하금액, 재고금액  생산통계 제공(단위 : 백만원)소재부품장비를 17개 분야로 나누어 코드화(소부장 통계 분류체계가 기존 16개분야에서 17개 분야로 개편됨에 따라, 23년 품목별 산업현황부터 17개 분야로 재분류하여 제공)o 품목 : 소재부품장비산업, 소재, 부품, 장비, 각 품목별(섬유제품, 고무 및 플라스틱제품, 금속가공제품, 정밀가공장비, 광학기기장비 등)'
