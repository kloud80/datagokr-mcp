summary_user: 한국가스안전공사가 관리하는 전국 가스제품 제조업소를 업소별로 한 행씩 담은 현황 파일로, 행정구역·업소명·소재지·생산품목·영업상태·법구분을 담는다. 가스보일러나 안전밸브 같은 특정 가스제품을 어느 지역의 어떤 업체가 만드는지 찾으려는 사업자·분석가가 쓴다. 전역 조인 키가 없어 행정구역 이름이나 업소명·주소 매칭으로만 다른 인허가·기업 현황 데이터와 이어 쓴다.
description_portal: '한국가스안전공사에서 관리하는 가스제품 제조업소에 대한 현황 정보입니다.전국 행정구역을 기준으로 가스제품별 제조업체에 대한 소재지 정보가 수록되어 있습니다.생산품목은 탱크로리, 안전밸브, 가스보일러, 소형탱크 등 총 47가지 항목으로 구분되어 있습니다.해당 목록은 데이터 분석 업무 및 가스제품 생산활동 지원을 위해 개방됨을 안내드립니다. ※ 데이터기준일 : 2025년 9월 30일※ 데이터 기준일 영업 현황을 기준으로 반영되어 있으나, 실제 운영 현황에 대해서는 별도 확인을 권장드립니다.'
