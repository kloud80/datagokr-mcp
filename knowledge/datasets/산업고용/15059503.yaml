summary_user: 경기도 내 주유소·일반판매소 등 석유판매업체의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 면적, WGS84 좌표, 업태구분을 포함한다. 분석가나 사업자가 '우리 시군에서 최근 폐업한 주유소는 어디이고 남은 주유소는 어떻게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·주소 같은 이름·코드 매핑이나 좌표로 다른 데이터와 맞추고, 같은 기관의 다른 에너지 업종 인허가 데이터(고압가스·LPG·도시가스 등)와 나란히 쓴다.
description_portal: 이 데이터는 전국 석유판매업체(주유소 및 일반판매소 등)의 인허가 및 영업 현황을 기록한 자료입니다. 주요 항목에는 시군명, 사업장명, 인허가일자 및 취소일자, 영업상태구분코드와 영업상태명(신규등록·폐지 등), 소재지 주소,면적 정보, WGS84 좌표, 업태구분명 정보 등이 포함되어 있습니다. 이 데이터는 주유소 및 석유판매소 분포 현황을 분석하여 지역별 에너지 공급망 연구, 상권 분석, 교통량과의 상관관계 연구 등에 활용될 수 있으며, 에너지 정책 수립 및 석유 관련 안전 관리 체계 구축에도 기여할 수 있습니다.
