description_portal: '(재)장애인기업종합지원센터는 장애인의 경제적 자립을 도모하고, 더 나아가 이들의 적극적인 사회 참여를 촉진하기 위해 다양한 창업지원 사업을 운영하고 있습니다. 특히 장애인들이 창업이라는 구체적인 목표를 실현해 나가는 과정에서 실질적인 도움을 받을 수 있도록, 전문 교육기관에 대한 정보를 체계적으로 제공하는 데에 중점을 두고 있습니다.이러한 정보 제공은 단순히 교육기관의 명칭이나 위치에 대한 소개에 그치지 않고, 예비 창업자들의 눈높이에 맞춘 실질적이고 종합적인 안내로 구성되어 있습니다. 창업을 준비하는 초기 단계부터 사업을 실제로 실행에 옮기는 실행 단계, 그리고 창업 이후의 사후관리 단계에 이르기까지, 전 주기에 걸쳐 필요한 교육 프로그램과 기관을 상세히 안내함으로써, 예비 창업자들이 단계별로 필요한 역량을 차근차근 갖출 수 있도록 돕고 있습니다.데이터: 기관명, 교육분류, 교육내용, 신청일'
