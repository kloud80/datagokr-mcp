description_portal: '공인노무사 자격시험은 근로관계, 사회보험, 노동법 분야의 전문 인력을 양성하기 위해 매년 실시되는 국가전문자격시험입니다. 본 데이터는 매년 공고되는 공인노무사 자격시험 결과를 기반으로, 시험 시행 회차, 응시 인원, 1차 및 2차 합격자 수, 최종 합격자 수 등의 현황과 합격률(%)을 종합적으로 정리한 것입니다. 이를 통해 합격률 변화, 응시자 규모 등을 파악할 수 있으며, 노동전문가 수급 현황 및 정책 수립에 참고자료로 활용 가능합니다.* 매년 공표되는 공인노무사 자격시험 현황: 회차, 접수, 응시(A), 1차 합격자, 2차 합격자, 3차 합격자(B), 합격률(B/A,단위:%)'
