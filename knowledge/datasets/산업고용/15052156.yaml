summary_user: 한국가스공사가 보유한 천연가스 관련 물품·설비 규격표준을 표준 한 건당 한 행으로 담은 2020년 기준 목록 파일(csv, 약 14KB)이며, 구분·번호·표준명·적용범위·제정일자·개정일자를 담는다. 가스설비 협력업체나 설계·구매 담당자가 "특정 설비에 적용되는 KOGAS 규격이 무엇이고 언제 개정됐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 표준명이나 규격 번호를 이름으로 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 한국가스공사의 천연가스 관련 물품 및 설비 규격표준 현황 데이터 입니다. 천연가스 설비 규격기준 관리 및 표준화 현황 파악, 품질관리 지원, 설비 안전성 확보를 목적으로 수집되었습니다. 데이터 구성항목은 구분, 번호, 표준명, 주요내용(적용범위), 제정일자, 개정일자 등으로 이루어져 있어 각 규격표준의 상세 정보를 종합적으로 파악할 수 있습니다.본 데이터를 활용하면 보유 규격표준 현황 파악, 규격별 적용범위 확인, 제정 및 개정 이력 관리, 표준화 수준 분석, 규격 체계 검토가 가능합니다. 또한 설비 구매 시 규격 적합성 검토, 품질관리 기준 수립, 협력업체 기술지원, 설계기준 참조에 활용됩니다. 천연가스 산업의 표준화 촉진과 설비 품질 향상에 기초자료로 활용되어 안전하고 효율적인 천연가스 공급체계 구축을 지원합니다.
