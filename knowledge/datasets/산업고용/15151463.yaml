summary_user: 한국지역난방공사 본사와 각 지사가 맺은 수의계약을 계약 한 건당 한 행으로 담은 CSV 파일로, 사업소·수의계약 여부·계약명·계약번호·계약일자가 들어 있다. 예산감시 활동가나 내부 감사 담당자가 "어느 지사가 어떤 용역·공사를 수의계약으로 많이 맺었나"를 확인할 때 쓴다. 계약번호(kdhc_contract_no)가 유일한 조인 키라서 같은 공사의 다른 계약·입찰 공개 자료를 계약번호로 맞춰 볼 때 쓰고, 지역 코드나 업체 식별자는 없다.
description_portal: '한국지역난방공사의 수의계약 정보를 정리한 데이터로, 본사 및 각 지사의 계약명·계약일자·계약번호 등을 통해 기관의 소규모 계약 및 용역 집행 현황을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 사업소: 계약이 체결된 사업소 또는 지사명(예시: 본사, 강남지사, 대구지사, 동탄지사)■ 수의계약 업체구분: 해당 계약이 수의계약(Y/N)인지 여부(예시: Y)■ 계약명: 계약의 명칭 또는 대상 사업명(예시: 2025년 강남지사 청소용역, CCUS 실증설비 접지 공사, 2025년 외부회계감사 용역)■ 계약번호: 계약을 구분하기 위한 고유번호(예시: 제202100-2024-S-033호, 제100354-2024-S-142호)■ 계약일자: 계약이 체결된 날짜(예시: 2024-12-30, 2024-12-31)3. 활용 예제:■ 본사 및 지사별 수의계약 현황을 분석하여 계약 집행의 투명성 및 공정성 제고 방안 수립■ 계약유형별(용역, 공사, 물품 등) 수의계약 비중을 평가하여 예산 효율성 및 경쟁입찰 확대 전략 마련■ 공공기관 계약정보 공개, 청렴도 평가, 내부 감사 및 예산감시 활동의 근거자료로 활용'
