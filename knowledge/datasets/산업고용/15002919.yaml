description_portal: 이 데이터는 한국남부발전의 제주도 지역 연도별 REC(신재생에너지 공급인증서) 기준가격 현황을 정리한 자료입니다. 연도별로 자체건설, 자체계약, 현물시장 등 다양한 거래 방식별 가격 정보가 포함되어 있으며, 가중치 값과 비고란을 통해 세부적인 참고 사항도 확인할 수 있습니다. 이를 통해 제주도의 전력시장 내 REC 가격 변동 추이를 파악할 수 있으며, 신재생에너지 확대 정책과 시장 수급 상황이 가격에 미친 영향을 분석할 수 있습니다. 본 자료는 신재생에너지 보급 현황을 이해하고 향후 탄소중립 실현 및 에너지 전환 정책 수립을 위한 기초자료로 활용될 수 있는 중요한 데이터입니다.
