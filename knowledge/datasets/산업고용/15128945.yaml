description_portal: 이 데이터는 세계 석유소비량의 연간 추이 자료로, 연도별로 세계 전체의 석유 소비량 변화를 수치로 정리하고 있습니다. 석유 소비량은 글로벌 에너지 수요의 흐름을 파악할 수 있는 핵심 지표로, 이를 통해 에너지 수급 계획, 탄소 배출량 관리, 국제 유가 예측 등 다양한 정책 수립 및 시장 분석에 활용할 수 있습니다. 또한 산업별, 지역별 석유 수요 패턴을 간접적으로 유추할 수 있는 근거 자료로 활용되며, 정부·에너지기업·연구기관 등 다양한 수요자에게 실질적인 참고자료가 됩니다. 데이터는 구조화된 연도별 형식으로 제공되어 시계열 분석, 소비 추이 시각화, 예측 모델링 등에 활용하기에 적합하며, 글로벌 에너지 정책 수립 및 ESG 경영 분석의 기초자료로 활용도가 높습니다.
