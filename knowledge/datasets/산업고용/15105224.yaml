description_portal: 본 자료는 사업주 또는 근로자에게 지급된 고용안정지원금 중 고용장려금과 관련하여 등록된 수혜자의 중복을 제거한 순수 지원 인원 현황을 분기 단위로 제공합니다. 통계 수치는 실제로 혜택을 받은 고유 인원을 기반으로 하며, 이는 동일한 대상자가 여러 차례 지급받았더라도 1명으로 집계되어 지원 효과의 과대 추정을 방지합니다. 제공 항목은 기업의 규모별, 지역별(시도 및 시군구 기준), 산업별(한국표준산업분류 기준)로 세분화되어 있어 다양한 기준에서 고용안정정책의 수혜 분포를 파악할 수 있습니다. 특히 분기 단위 집계는 시계열적 비교 및 정책 반응 분석에 유리하며, 특정 산업군 또는 지역에서의 정책 수요 및 실효성 평가에도 유용하게 활용될 수 있습니다. 이 통계는 고용노동부 정책의 방향성과 효과 측정을 위한 기초자료로 활용됩니다.
