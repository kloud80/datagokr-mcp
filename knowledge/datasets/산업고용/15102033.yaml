summary_user: 한국전력공사가 2020년 한 해 인천광역시 동구에 공급한 전력 판매량을 부문과 용도업종(가정용, 국군용, 기타 공공용, 수도 등)별로 집계한 파일로, 건별 원천이 아닌 용도별 합계(약 6KB CSV)를 담는다. 지역 에너지 분석가나 지자체 담당자가 '동구 전력 사용량 가운데 가정용과 산업·공공용이 각각 몇 퍼센트인가'처럼 지역 소비 구조를 파악하는 데 쓴다. 전역 조인 키는 없어서, 시도·시군구 이름을 행정구역 코드에 매핑하거나 같은 한전의 다른 지역별 전력사용량 파일과 이름 기준으로 이어 쓴다.
description_portal: 한국전력공사에서 2020년 한 해 동안 인천광역시 동구 지역에 공급한 전력 사용량을 용도별(가정용, 국군용, 기타 공공용, 수도 등)로 집계한 데이터 입니다.조회기간, 시도, 시군구, 부문, 용도업종, 판매량 항목으로 구성되어 있습니다.전력의 최종 소비 목적에 따라 상세하게 분류되어 있어 인천광역시 동구지역의 에너지 소비 구조를 한눈에 파악할 수 있습니다.사용자는 전체 전력 사용량 중 각 부문이 차지하는 비율을 계산하여 지역 경제 및 인구 구조를 간접적으로 파악할 수 있습니다.더 나아가 향후 인구 및 산업구조 변화에 따른 전력 수요 증가를 예측할 수 있어 신규 주택단지 건설 시 필요한 전력량을 추정하고 이에 맞춰 송배전망 등 전력 인프라 확충 계획을 수립하는데 활용할 수 있습니다.
