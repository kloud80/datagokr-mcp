summary_user: 한국예술종합학교가 게시한 채용공고를 공고(게시글) 단위로 담으며, 포털 설명상 게시글 고유번호·게시여부·최초게시일·최종수정일·접수마감일·제목·게시글 URL을 제공한다. 구직자가 '한국예술종합학교에 지금 접수 중인 교직원·강사 채용이 있는지, 마감일은 언제인지'를 확인하거나, 취업지원 서비스가 공공기관 채용공고를 모을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관명이나 공고 제목·날짜 같은 이름 매핑으로만 연결한다.
description_portal: 한국예술종합학교에서 제공하는 채용정보를 체계적으로 정리한 데이터입니다. 게시글 고유번호, 게시여부, 최초게시일, 최종수정일, 접수마감일, 게시글 제목, 게시글  URL  등 다양한 항목을 포함하고 있어 학교의 최신 채용공고를 신속하게 확인할 수 있습니다. 이를 통해 지원 일정 관리, 채용 동향 파악, 일자리 정보 탐색에 유용하며, 인사관리, 취업지원, 경력 개발 등 다양한 분야에서 활용할 수 있습니다. 학교 채용정보의 통합관리와 공개, 맞춤형 채용 안내 서비스 개발에도 효과적으로 쓰일 수 있습니다.
