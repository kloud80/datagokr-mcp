summary_user: 부산광역시 동구에서 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 파일로, 민원구분·상호·지번주소·도로명주소를 기재한다. 담배소매인 지정을 신청하려는 사업자가 예정 점포 주변에 기존 소매인이 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 맞춰 잇고, 같은 계열의 지방행정 인허가(LOCALDATA) 담배소매업 원장과 대조하는 식으로 쓴다.
description_portal: 부산광역시 동구 담배소매인 지정 현황입니다. (민원구분,업소명,업소지번주소, 업소도로명주소 가 기재되어있습니다.)민원구분에 대한 설명은 담배사업법 시행규칙 제7조의3을 참고바라며, 담배사업법은 담배소매인 간 50m 거리제한을 두고 있습니다.(담배사업법 시행규칙 제7조의2제2항)본 자료는 2026. 7. 20. 기준 담배소매인 지정 현황이며, 본 데이터를 확인하는 시점에 따라 현황이 달라질 수 있습니다. 담배소매인 지정 신청 시 본 자료를 활용하여 담배소매인 지정 신청바랍니다.
