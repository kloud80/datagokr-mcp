summary_user: 창업기업 창업자의 창업 전 직업 유형(경영관리직·연구기술직·일반사무직·기능생산직·영업판매직·단순노무직) 분포를 업력·업종·기업형태·성별·연령 구분별로 집계한 전국 단위 통계표로, 약 1.9KB 크기의 CSV 파일 한 건입니다. 창업 지원 정책 담당자나 연구자가 '법인과 개인 창업자, 또는 업종별로 창업 전 어떤 직무 출신이 많은가'를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명·기업형태·성별 같은 구분 이름을 맞춰서만 연결할 수 있고, 창업기업 확인서 원장처럼 사업자번호로 기업 단위에 붙이는 것은 불가능하다.
description_portal: 데이터는 업력, 업종, 기업형태, 창업자 성별과 연령을 기준으로 창업자의 이전 직업 유형을 제시하고 있습니다. 직업 유형은 경영관리직, 연구기술직, 일반사무직, 기능생산직, 영업판매직, 단순노무직으로 구분됩니다. 업력 구간에서는 기능생산직과 영업판매직 출신 비율이 상대적으로 높으며, 시간이 지남에 따라 일반사무직 비율은 다소 감소하는 경향을 보입니다. 업종별로는 제조업, 전기·가스·공기조절업, 정보통신업, 전문과학기술업 등에서 경영관리직 및 연구기술직 출신 비율이 높게 나타납니다. 반면, 운수업이나 건설업에서는 기능생산직 및 영업판매직 출신의 비율이 높게 나타납니다. 기업형태별로는 법인 창업자에게서 경영관리직과 일반사무직 출신이 많은 반면, 개인 창업자는 기능생산직 및 영업판매직 비율이 높습니다. 성별에 따라 여성은 일반사무직과 기능생산직 비율이 높고, 남성은 경영관리직 및 영업판매직의 비율이 높습니다. 본 데이터는 창업자의 경력 기반 직업 유형 분포를 분석하는 데 활용할 수 있습니다.
