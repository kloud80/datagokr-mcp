summary_user: 한국수력원자력이 통합연구개발로 확보한 산업재산권을 건별로 담으며, 각 건에 출원국가, 발명명칭, 권리종류(특허·실용신안·상표 등), 등록일, 등록번호가 들어 있다. 기술이전이나 협력을 검토하는 기업과 분석가가 "한수원이 어느 나라에 어떤 종류의 권리를 연도별로 얼마나 등록했나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 특허 데이터와는 등록번호(regNo)나 발명명칭 같은 이름·번호 매핑으로만 맞춰 쓴다.
limits: 지역·행정코드가 없는 전국 단위 비공간 데이터라서 지역별 분석에는 쓰지 못한다. 세부 부문은 에너지 사용량으로 분류돼 있지만 전력사용량과 무관한 지식재산 목록이다. 개발계정은 하루 10,000회까지 호출할 수 있다.
