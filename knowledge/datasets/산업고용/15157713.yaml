description_portal: “통합연구개발 산재권 현황 조회 서비스” API는 한국수력원자력㈜이 제공하는 공공데이터 서비스입니다. 이 API는 한국수력원자력이 통합연구개발 활동을 통해 확보한 산업재산권의 출원국가, 발명 명칭, 권리종류(특허, 실용신안, 상표 등), 등록일자, 등록번호 정보를  XML 형식으로 제공합니다. 이 API를 통해 한국수력원자력 통합연구개발 산업재산권의 연도별, 국가별, 권리종류별 등록 추이, 출원 현환 등 다양한 분석이 가능합니다. 개발계정 기준으로 10,000회 호출이 가능합니다. 운영계정은 활용 사례 등록을 통해 트래픽 증가가 가능합니다.
