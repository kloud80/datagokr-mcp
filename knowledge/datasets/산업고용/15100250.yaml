summary_user: 중소벤처기업진흥공단 기업인력애로센터가 운영하는 대·중소기업 상생 일자리 프로그램에 참여한 기업을 기업 단위로 담은 파일로, 참여년도·기업명·사업자번호·지역구분·업종·산업분류·취업인원이 들어 있고 범위는 전국이다. 구직 청년이나 분석가가 '이 프로그램으로 청년을 채용한 협력 중소기업이 어느 지역·업종에 몇 명을 뽑았나'를 확인할 때 쓴다. 실측에서 전역 조인 키는 찾지 못했으나 사업자번호 컬럼이 있어 이를 매개로 벤처·이노비즈 등 다른 기업 확인·인증 원장과 기업 단위로 맞춰 볼 수 있고, 그 밖에는 기업명이나 지역·업종 이름으로 매핑해야 한다.
description_portal: 중소벤처기업진흥공단 기업인력애로센터에서 인력지원 사업의 일환으로 운영 중에 있는 대·중소기업 상생 일자리 프로그램 참여기업 정보입니다. 참여기업의 기업명, 지역구분, 취업인원 등의 데이터를 포함하고 있습니다.대·중소기업 상생 일자리 프로그램은 대기업과 중견기업의 우수한 교육·훈련 인프라를 활용하여 청년 구직자에게 직무교육을 실시하고 그 이후 대·중견기업 협력 중소기업에 취업연계를 지원하는 사업입니다. 참여 사업단에게는 교육과정 운영 및 취업연계 소요비용을, 교육에 참여한 구직자는 교육기간 내 훈련수당을 지원합니다.
