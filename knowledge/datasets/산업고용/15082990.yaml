description_portal: '석탄재 현황은 한국남부발전(주)에서 운영하는 석탄발전소에서 발생하는 석탄재의 연도별 처리 현황을 기록한 자료로, 비산재(Fly Ash) 및 바닥재(Bottom Ash)의 발생량, 재활용량, 재활용률, 그리고 매립량 등의 정보를 포함하고 있습니다. 각 항목은 천톤 단위로 표시되며, 연도와 사업소(예: 하동)에 따라 분류되어 있습니다. 비산재와 바닥재는 석탄을 연소한 후 발생하는 부산물로, 시멘트 원료, 복토재, 매립재 등으로 재활용이 가능하며 환경 관리 측면에서 중요한 자원입니다. 해당 데이터는 석탄재의 자원화 수준을 가늠하고, 발전소의 친환경 경영성과를 분석하는 데 유용하게 활용될 수 있습니다. 특히, 재활용률 변화 추이와 매립량 증감은 환경정책 수립과 자원순환 관련 연구에 참고자료로 활용될 수 있습니다.'
