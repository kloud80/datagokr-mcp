summary_user: 전국의 타이어 판매업체를 업체 한 곳당 한 행으로 담은 명단 파일로, 지역·업체명·전화·팩스·주소·주력 판매제품을 담는다. 운전자가 집이나 현재 위치 근처에서 타이어를 살 수 있는 판매점과 연락처를 찾을 때 쓰고, 분석가는 지역별 판매업체 분포를 볼 때 쓴다. 공통 조인 키나 코드표가 없으므로, 다른 데이터와는 주소를 지오코딩하거나 지역명을 행정구역과 맞추는 방식으로만 잇는다.
description_portal: 산업통상자원부에서 제공하는 전국 타이어 판매업체 현황에는 국내에서 타이어를 판매하고 있는 업체의 현황을 파악할 수 있도록 정보가 포함되어 있습니다. 제공하는 정보는 타이어 판매업체의 소재지역, 업체이름, 전화번호, 주소, 주요 판매제품 등입니다. 전국 타이어 판매업체 현황에서 제공하는 데이터를 통해 거주지 등 인근에 있는 타이어 판매업체의 소재지와 연락처를 쉽게 파악할 수 있으며, 평상시 또는 비상시에 타이어 구매가 필요할 경우 해당 데이트러를 활용할 수 있을 것으로 기대됩니다.
