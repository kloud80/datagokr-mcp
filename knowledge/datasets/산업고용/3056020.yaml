summary_user: 부산광역시 수영구에 등록된 옥외광고업체를 업체 한 곳당 한 행으로 담은 파일 데이터로, 상호·소속 행정동·도로명 소재지 주소를 담는다(약 3KB CSV 한 개 분량). 구민이나 광고주가 "간판·현수막을 맡기려는 업체가 수영구에 정식 등록된 곳인가"를 확인하거나, 분석가가 행정동별 옥외광고업체 분포를 볼 때 쓴다. 전역 조인 키나 사업자번호·좌표가 없어서, 다른 데이터와는 상호명·주소 문자열을 맞추거나 행정동 이름으로 묶어서만 연결하고, 전국 지방행정 인허가(LOCALDATA) 옥외광고업 원장과 대조할 때도 같은 방식으로 이어 쓴다.
limits: 실측 컬럼에 사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 데이터와 붙이려면 상호·주소 문자열 매칭에 기대야 한다. 범위가 수영구 한 곳이라 부산 전체나 타 지역 업체는 다루지 않는다.
