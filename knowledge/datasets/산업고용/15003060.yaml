summary_user: 한국동서발전이 운영하는 석탄화력 발전소별로 탈황석고 발생량·재활용량(톤)과 재활용률(%)을 년월 단위로 정리한 집계 파일이며, 발생 방식과 재활용 방법도 함께 담는다(CSV 약 4KB 규모). 연구자나 ESG 분석가가 '동서발전 발전소별 탈황석고 재활용률이 어떻게 변해 왔고 어떤 재활용 방법이 쓰이는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전공기업 표준 데이터(석탄재 등)와는 발전소명·기관명 같은 이름 매칭이나 년월 기준으로만 이어 붙인다.
