summary_user: 위해상품판매차단시스템을 설치·운영하는 유통사 매장 정보를 매장(영업장) 단위로 담은 전국 범위 파일로, 사업자번호, 설치·승인일자, 소프트웨어 버전, 스케줄러 주기, 테스트 여부 등을 담는다. 유통 정책 담당자나 분석가가 어느 매장이 위해상품 판매차단 시스템에 연계돼 있는지, 시스템 설치·승인 시점과 운영 상태가 어떤지 확인하는 데 쓴다. 전역 조인 키는 없어 영업장 사업자번호로 사업자 정보와 맞춰 보거나 같은 기관의 위해상품·리콜 제품 데이터와 이름 기준으로 이어 쓴다.
description_portal: 산업통상자원부 국가기술표준원, 환경부, 식품의약품안전처는 시중에 유통되는 상품을 수거하여 유해물질 포함 여부와 같은 위해성 여부를 판정한 후 위해상품으로 확인된 경우 해당 내용을 공표합니다. 대한상공회의소 유퉁물류진흥원에서 운영 중인 이 시스템은 해당 상품정보를 유통사에 전달하기 위해 등록 및 전송하는데 활용되며, 유통사로 전달된 정보는 이 시스템과 연계된 전국 매장에서는 위해상품의 유통을 차단하는 역할을 수행합니다. 이 데이터는 위해상품판매차단시스템을 운영하는 유통사의 매장 정보 등을 포함합니다.
