description_portal: 민관협력 중소벤처 스마트혁신지구 조성사업 선정 현황(선정연도, 광역지차체, 기초지자체, 선정지역, 대표협력기관) 관련 데이터 자료입니다.스마트혁신지구 조성사업이란 낙후 중소기업 밀집지역에 기업이 개별적으로 구축하기 어려운 공동활용 스마트플랫폼(*) 조성을 지원하여 지역기업의 경쟁력을 강화하기 위한 사업입니다.(*) 스마트 제조, 스마트 물류 등 스마트화 공동시설, 친환경(그린) 인프라 등 지역기업에 필요한 플랫폼 조성 지원신청대상은 광역자치단체-민간 컨소시엄 (필수), 광역지자체별로 신청 가능하며, 신청 지역이 기초지자체 단위인 경우 광역-기초지자체 간 공동주관기관으로 참여 가능합니다.
