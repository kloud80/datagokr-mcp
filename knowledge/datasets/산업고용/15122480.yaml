description_portal: 이 데이터는 2018년부터 2022년까지 일자리 안정자금 지원 사업에서 고용위기지역 및 산업위기 대응지역으로 지정되어 취약계층 종사자에게 자금이 지원된 현황을 담고 있습니다. 일자리 안정자금은 최저임금 인상으로 인한 사업주 경영 부담을 완화하고 근로자의 고용 안정을 위해 지원되었으며, 이 위기지역 종사자에게는 일반 기준과 달리 30인 이상 사업장에도 지원되었습니다. 통계 항목은 지원 연도, 시도, 시군구 등 위기지역의 행정 구역 정보를 제공합니다. 이 자료는 정부가 지역 산업 침체로 인해 어려움을 겪는 특정 지역의 고용 안정을 위해 재정적 지원을 집중했던 정책적 노력을 명확하게 보여주는 근거 정보이며, 지역 경제의 위기 대응 실태를 분석하는 데 중요한 기초 자료라고 판단됩니다.본 데이터는 지역 경제 및 고용 위기 대응 정책의 효과 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 위기지역 지정 기간 동안 일자리 안정자금 지원이 해당 지역의 고용 유지에 미친 영향을 분석할 수 있습니다. 이를 통해 향후 지역 기반의 산업 구조 변화나 경제적 충격 발생 시 맞춤형 고용 유지 지원 정책의 대상을 설정하고, 지원 방식 및 규모의 적정성을 검토하는 데 활용할 수 있습니다. 또한, 이 통계는 지역별 산업 재편 과정에서 근로자의 고용 안정을 위한 사회 안전망의 작동 실태와 공공 지원의 효과를 평가하는 데 기여할 수 있다고 판단됩니다.※ 일자리 안정자금 취약계층 중심(고용위기지역, 산업위기 대응지역 종사자)으로 30인 이상도 지원※ 근로복지공단에서 최저임금 인상에 따른 사업주의 경영 부담을 완화하고 근로자의 고용안정을 위하여 일자리 안정자금을 지원하였으며, 2022년 6월 30일 기준으로 종료
