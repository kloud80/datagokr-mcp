summary_user: 충청남도 예산군 내 고압가스 저장소를 업체(사업소) 한 곳당 한 행으로 담은 건별 목록으로, 상호·허가번호·사업 종류·소재지 주소·영업 구분·허가일자·취급 가스를 포함하며 파일 크기는 약 2.6KB로 작다. 예산군 주민이나 소방·안전 담당자가 '우리 동네 근처에 어떤 고압가스 저장소가 있고 어떤 가스를 다루는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 상호·주소 문자열 매칭이나 허가번호로 이어야 하고, 같은 부문의 LOCALDATA 에너지 업종 인허가 원장이나 다른 시군의 고압가스 현황과 나란히 놓고 비교하는 식으로 쓴다.
limits: 예산군 한 곳만 다루므로 충남 전체나 전국 분포 분석에는 다른 시군 자료를 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 의존해야 하고, 좌표 필드가 따로 없어 지도에 올리려면 주소를 좌표로 바꾸는 작업이 필요하다.
