summary_user: 전력시장에 참여하는 신재생에너지 발전기의 전력거래량(MWh)을 월별로 집계해, 신에너지(연료전지·석탄가스화)와 재생에너지(태양·풍력·수력·해양·바이오·폐기물) 발전원별 열로 담은 전국 단위 파일이다. 에너지 분석가나 사업자가 '최근 몇 년 사이 태양광과 풍력의 월별 전력거래량이 어떻게 변했나'처럼 발전원별 거래량 추이와 비중을 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기간(월)을 맞추거나 발전원 이름을 매핑해 같은 기관의 발전원별 발전량·SMP·REC 자료와 이어 쓴다.
limits: 전국 합계만 담아 지역별·발전소별 거래량은 알 수 없다. 월별 집계 파일이라 실시간·일별 수급 확인에는 쓰지 못하고, 다른 데이터와 붙일 공통 코드가 없어 기간·발전원 이름으로 직접 맞춰야 한다.
