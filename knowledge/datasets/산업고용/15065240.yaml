summary_user: 태양광 발전의 계량값을 광역시도별·거래일·시간대별로 5분 단위(0분~55분 열)로 담은 집계 파일이며, 단위는 Wh이고 한 시간의 5분 값을 더하면 그 시간의 계량값이 된다. 에너지 분석가나 발전사업자가 '특정 지역의 태양광 발전량이 하루 중 어느 시간대에 몰리는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역 이름(지역)과 거래일·시간을 맞춰 다른 전력수급·기상 데이터와 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2025.12.31 태양광 일별 시간대별 5분 단위 계량자료입니다.ㅇ 항목 : 연료원, 지역(광역시도별), 거래일, 시간, 계량값*단위 : Wh(시간별 5분 계량값을 합산 시 Wh의 계량값이 됩니다.)'
