summary_user: 한국전력거래소가 전력시장에 참여하는 태양광·풍력 발전기의 전력거래량(MWh, 송전단 기준)을 거래일·거래시간·지역·연료원별로 담은 집계 파일이며, 태양광은 시도별, 풍력은 육지/제주로 구분합니다. 에너지 분석가나 사업자가 '특정 시도의 태양광 발전량이 하루 중 어느 시간대에 몰리는가', '제주 풍력은 계절별로 어떻게 달라지는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역 이름(시도명)이나 거래일·시간을 맞춰 다른 시간별 전력수급·SMP 자료나 시도별 통계와 이어 쓴다.
description_portal: 'ㅁ 25년도 태양광 및 풍력 데이터를 업데이트 했습니다.ㅇ 내용 : 지역별 시간대별 태양광 및 풍력 전력거래량(MWh)ㅇ 지역구분 : (태양광) 시도별, (풍력) 육지/제주 * 지역별 풍력발전기 수 검토 결과 일부 지역은 3대 이하만 존재합니다. 해당자료를 통해 특정 법인의 영업정보가 공개될 위험이 있어 육지/제주로 구분하여 제공합니다. (23년 12월 이후 변경된 사항) * 본 자료는 향후 수정정산에 따라 변경될 수 있습니다.항목 : 거래일자, 거래시간, 지역, 연료원, 발전량단위 : MWh* 본 데이터는 전력시장에 참여하는 발전기의 전력거래량으로, 전기사업법 시행령 제19조 1항 2호에 따라 한국전력공사와 직접 거래하는 발전기, 자가용 등은 포함하지 않습니다.   전력거래량은 소내용 및 주변압기 손실분 등을 제외한 송전단 기준 발전량이며, 수정정산 등에 의해 값이 변동될 수 있습니다.* 태양광, 풍력 발전량은  ESS 충방전량이 포함되어 있는 수치로 심야시간대 발전량은 ESS 방전에 의해 소량 발생할 수 있습니다.'
