summary_user: 한국서부발전이 운영하는 태양광·풍력 등 신재생 발전설비의 장치(설비 아이디)별 측정 시각 단위 운전값을 담는 건별 원천 데이터로, 상전류·DC 전압·전류·전력, 순시전력, 누적 발전량(보정값 포함), 설비 상태를 제공한다. 발전설비 운영자나 에너지 분석가가 특정 신재생 설비가 지금 정상 가동 중인지, 측정 시점별 출력과 누적 발전량이 어떻게 변하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 설비 아이디나 설비 이름을 같은 기관 자료와 직접 대조해야만 연결할 수 있다.
description_portal: 한국서부발전에서 제공하는 신재생 설비운전·발전량/태양광·풍력 발전량 정보 조회 서비스는 장치아이디, 절대시간, 로컬시간, 온도, 전압(R, S, T), 전류(R, S, T), 역률(R, S, T), 주파수, 순시전력, 무효전력(지상, 진상), DC전압, DC전류, DC전력, 누적발전량, 설비상태, 알람상세, 최대출력상한값으로 구성됩니다. 각 항목은 발전설비의 전기적 상태와 운전 정보를 나타내며, 절대시간과 로컬시간을 통해 측정 시점을 확인할 수 있습니다. 전압과 전류, 역률, 주파수, 순시전력, 무효전력, DC 관련 값은 설비 운전 상태와 성능을 모니터링하는 데 활용되며, 누적발전량은 생산된 전력량을 나타냅니다. 설비상태, 알람상세, 최대출력상한값은 장치 운영과 안전 관리를 위한 정보를 제공합니다.
