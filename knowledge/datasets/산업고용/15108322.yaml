summary_user: 온라인수출플랫폼(고비즈코리아)에 접수된 수출 관련 질의응답을 한 건씩 담은 파일로, 질의 대분류·중분류·제목·등록일·답변일·만족도(선택 항목)를 담는다. 수출지원 담당자나 분석가가 '수출 기업들이 어떤 분야의 질문을 많이 하고, 답변까지 며칠이 걸리는가'를 살펴보는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업·인증 데이터와 직접 이을 수 없고, 분류명 매핑이나 같은 기관 데이터와 함께 보는 수준으로만 연결한다.
description_portal: 온라인수출플랫폼(Gobizkorea)에서 제공하는 질의응답 리스트 데이터를 제공합니다.제공하는 데이터는 질의응답 대분류와 질의일자, 응답일자, 만족도 등의 항목이 제공되며, 만족도의 경우 선택 항목입니다.본 데이터는 온라인수출플랫폼(Gobizkorea)를 활용하여 수출을 진행하거나, 일반적인 수출 업무 진행 과정에서 발생하는 자문내용, 고비즈코리아가 제공하는 교육과정에 대한 질문 등 수출업무 전반에 걸친 질의내용을 접수하고 있으며 자문단 등을 통해 답변 내용을 등록하고 있습니다.
