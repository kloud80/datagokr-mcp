summary_user: 서울 성동구 무료직업소개소의 인허가 정보를 업소 한 곳당 한 행으로 담는 건별 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·사업장명·주소·전화번호·좌표 등을 포함한다. 구직자나 구인 사업자가 성동구 안에서 지금 영업 중인 무료직업소개소가 어디 있는지 찾을 때, 분석가가 업소의 인허가·폐업 이력을 살펴볼 때 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 전역 조인 키가 없어서, 다른 자료와는 사업장명·주소를 맞춰 보거나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 무료로 구인 및 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 원활히 성립될 수 있도록 알선하는 무료직업소개소 및 관련 업소의 정보를 체계적으로 제공하기 위해 마련되었습니다. 취업 및 인력 수급의 효율성 제고와 함께 공정한 노동시장 조성, 구직자의 권익 보호, 일자리 창출 촉진에는 정확하고 투명한 알선업소 현황 관리가 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 각 업소의 인허가 이력, 폐업 및 영업상태 변동 내역 등 핵심적인 행정정보를 명확하게 파악할 수 있습니다. 본 데이터는 성동구청 등 관할 행정기관에서 정기적으로 점검과 갱신을 거쳐 최신성과 신뢰성을 보장합니다. 무료직업소개소의 효율적 관리, 인력 중개 서비스 개선, 사회적 일자리 정책 수립, 구직자 및 구인자 정보 제공, 관련 업계 동향 분석 등 다양한 분야에서 적극적으로 활용될 수 있습니다. 데이터는 정기적으로 최신화됩니다.
