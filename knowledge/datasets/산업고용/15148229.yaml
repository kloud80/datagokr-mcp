summary_user: 한국에너지공단 신재생에너지센터 누리집에 실린 국내외 관련 기관 사이트 목록을 기관 한 곳당 한 행으로 담은 작은 CSV 파일(8,577바이트)이며, 국가, 국문·영문 기관명, 사이트 주소(URL)가 들어 있다. 신재생에너지 분야의 국내외 기관·단체 누리집을 찾는 연구자나 사업자가 '이 나라의 신재생에너지 관련 기관 사이트는 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 국가명을 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 신재생에너지센터는 한국에너지공단 산하 기관으로, 태양광·풍력·수력·지열·바이오 등 다양한 신재생에너지 보급과 확산을 지원하는 역할을 합니다. 관련 사이트에서는 신재생에너지 정책과 제도, 보급 통계, 기술 현황 등 최신 정보를 제공하며, 국민이 활용할 수 있는 보조금 및 지원사업 안내도 확인할 수 있습니다. 또한 사업자와 연구자에게는 인증 제도, 설비 기준, 교육 자료 등을 제공하여 에너지 산업 발전을 돕습니다. 이를 통해 일반 국민은 생활 속에서 신재생에너지를 이해하고 활용할 수 있으며, 기업과 정부는 데이터와 제도를 기반으로 효율적인 정책을 추진할 수 있습니다. 사이트는 에너지 절약과 친환경 전환을 위한 중요한 소통 창구로 기능합니다.
