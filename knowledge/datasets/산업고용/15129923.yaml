summary_user: 전국 광산의 기본조사(지표지질조사) 보고서를 보고서 한 건씩 담은 목록으로, 보고서 종류·작성연도·보고서명·광산명·광종·소재지·광업지적·보고서번호를 CSV 한 파일(약 100KB)로 제공한다. 탐광·광산 개발을 검토하는 사업자나 연구자가 '특정 광산이나 광종에 대해 어떤 조사보고서가 언제 작성됐는가'를 찾을 때 쓴다. 광산명·광종·광업지적번호·보고서번호가 조인 키여서 공단의 다른 광산·광업권 자료나 보고서 원문과 이어 쓴다.
description_portal: 이 데이터는 국내 광산의 지표지질조사 결과를 포함하며, 광체의 부존규모와 광황 파악을 위해 활용됩니다. 조사 항목으로는 광산명, 소재지, 조사연도, 보고서번호, 보고서명 등이 포함되어 있으며, 각 항목은 CSV 파일로 제공되어 데이터베이스 구축 및 분석에 용이합니다. 이를 통해 광산 탐광 및 개발을 위한 기초자료로 활용되며, 정책 수립, 연구, 교육 등 다양한 분야에서 사용될 수 있습니다. 또한, 해당 데이터는 수시로 업데이트되어 최신 정보를 반영하며, 공공데이터포털을 통해 누구나 접근할 수 있습니다
