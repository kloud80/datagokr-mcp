description_portal: '본 데이터는 오픈API를 중저준위방사성폐기물 처분시설에 저장되어 있는 방사성폐기물에 대한 데이터로서 중저준위방사성폐기물 저장현황을 제공합니다 - 기준일 : 2021.09.01. 해당 데이터 포맷은  XML이며 데이터 타입은 PUBC입니다. 개발단계의 경우 별도 승인 없이 신청 후 사용이 가능하지만 운영 단계 및 상업적 이용의 경우 한국원자력환경공단의 별도 승인이 필요하며 한국원자력환경공단과의 별도 협의가 필요합니다. 개발단계 활용 시 사용자에게 별도의 비용 부과는 없습니다.'
