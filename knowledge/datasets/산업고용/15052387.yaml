description_portal: '연도별 국내 무연탄* 수급 동향 데이터입니다. 국내 석탄(무연탄)의 연도별 생산(천톤), 소비(천톤), 연탄용 소비(천톤), 발전용 소비(천톤), 산업용 소비(천톤), 재고(천톤), 정부비축(천톤)에 관한 수급 동향 정보를 제공합니다. 매년 데이터를 업데이트 하고 있으며, 현재 1996년부터 2024년까지의 국내 무연탄 수급 동향을 제공하고 있습니다.* 무연탄: 탄화가 가장 잘되어 연기를 내지 않고 연소하는 석탄입니다. 국내에서 생산되는 석탄은 모두 무연탄으로 휘발분이 적으며 저열량이지만 점결성이 있어 주로 연탄용으로 사용하고 있습니다.'
