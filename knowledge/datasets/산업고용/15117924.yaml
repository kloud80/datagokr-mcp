summary_user: 인천 부평구에 등록된 상하수도설비공사업체를 업체별 한 행으로 담은 파일이며, 업체명·업종·도로명주소·전화번호가 들어 있다(CSV 약 2.6KB 규모의 소량 목록). 부평구에서 상수도·하수도 배관 공사를 맡길 수 있는 등록 업체가 어디에 있고 연락처가 무엇인지 찾는 주민이나, 구 안의 상하수도 시공업체 분포를 보려는 분석가가 쓴다. 전역 조인 키(사업자번호·코드)가 없어서 다른 데이터와는 업체명이나 도로명주소를 맞춰 붙여야 하며, 같은 부평구의 다른 업종 인허가 현황과 나란히 놓고 쓴다.
