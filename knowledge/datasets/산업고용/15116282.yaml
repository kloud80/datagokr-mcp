summary_user: 중소벤처기업진흥공단이 원전 협력기업에 수출지원사업을 지원한 실적을 기업별 한 행씩 담은 작은 파일(약 1.3KB CSV)로, 기업명·지원사업명·지원연도·소재지·수출규모를 담는다. 정책 분석가나 원전 공급망 연구자가 어느 지역의 어떤 원전 협력기업이 언제 어떤 수출지원을 받았고 수출 규모가 얼마였는지 확인할 때 쓴다. 전역 조인 키(사업자번호 등)가 없어서 다른 기업 데이터와는 기업명이나 소재지 이름을 맞춰 붙이는 방식으로만 연결한다.
description_portal: 「원전협력기업 지원현황」은 국내 원전 관련 산업에서 활동하는 협력기업들을 대상으로 추진된 지원 현황을 정리한 데이터입니다. 기업명, 지역, 주요 협력 분야, 지원유형 및 규모 등 정보를 포함하고 있으며, 원전 산업 생태계 내 중소·중견기업의 기술 역량 강화와 글로벌 시장 진출 지원 실적을 파악할 수 있습니다. 본 데이터는 원전 협력기업 지원사업의 정책성과 분석, 산업별·지역별 기업 분포 연구, 글로벌 원전시장 진출 전략 수립, 공급망 관리 및 위험 대응 정책 마련 등 다양한 목적으로 활용될 수 있습니다. 또한 정부와 유관기관이 원전산업 경쟁력 강화 및 수출 기반 확대를 위한 기초자료로 활용할 수 있습니다.
