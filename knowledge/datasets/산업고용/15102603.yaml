summary_user: 인천광역시 부평구에 등록된 옥외광고업체를 업소 한 곳당 한 행으로 담은 파일로, 업소명·영업장 도로명주소·영업내용(간판·현수막 등 광고물 종류와 업무 범위)을 수록한다. 구청 담당자나 분석가가 '부평구 안 어느 동네에 간판·현수막 제작업체가 몰려 있나', '간판개선사업에 참여할 지역 업체는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 행정코드 같은 전역 조인 키가 없어, 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 부평구 한 곳만 담은 업소별 목록이라 다른 시군구와 비교하려면 지역별 파일을 따로 모아야 한다. 사업자번호·좌표·업종코드가 없어 다른 인허가·상가 데이터와 자동으로 결합되지 않고, 주소 정제나 업소명 대조가 필요하다.
