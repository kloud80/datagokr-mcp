description_portal: '부평구 내 등록된 옥외광고업체의 상호, 영업장 주소, 영업 내용 등을 수록한 자료간판, 현수막, 벽면 광고 등 다양한 옥외광고물의 제작·설치·관리 업소 현황 파악에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 옥외광고 관련 사업체 분포 현황 및 영업범위 분석– 광고물 설치·관리 대상지 행정지도 기초자료– 불법 광고물 단속, 미관 개선 사업 등 정책 수립– 간판개선사업, 상권활성화사업 등과의 연계 활용주요 항목 설명● 업소명: 등록된 옥외광고업체의 명칭● 영업장도로명주소: 해당 업체의 영업소 소재지● 영업내용: 간판, 벽보, 입간판, 현수막 등 광고물 종류 및 업무 범위'
