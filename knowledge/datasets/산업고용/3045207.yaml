summary_user: 제주특별자치도 안에 있는 창업보육센터를 센터 한 곳당 한 행으로 정리한 소규모 현황표(csv 316바이트)입니다. 센터 구분, 개소일, 보육실, 입주기업, 특화분야를 담습니다. 예비창업자나 초기 창업자가 "제주에서 내 분야에 특화된 보육센터는 어디이고 보육실·입주 규모는 어느 정도인가"를 확인할 때 쓰고, 지역 창업지원 인프라를 정리할 때도 쓴다. 전역 조인 키가 없어서 다른 창업·기업 데이터와는 센터 이름이나 지역명으로 직접 맞춰 이어야 한다.
description_portal: '제주특별자치도 내 소재하고 있는 창업보육센터와 관련한 데이터를 제공합니다.항목: 구분, 보육실, 입주기업, 특화분야 등*예비창업자 및 창업초기 기업을 입주(기본 3년)시켜 기술개발에 필요한 범용기기 및 공간 제공, 기술 및 경영지도 등 지원을 통하여 창업 기업 성장 도모*제주도 내 4개의 창업보육센터에 약 99개사 입주 (24. 8월말 기준)자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1251'
