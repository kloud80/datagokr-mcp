summary_user: '한국서부발전 4개 발전본부(태안·서인천·평택·군산)가 보유한 정비용 자재예비품을 품목별로 담은 목록으로, 사업소·자재유형(설비화·전기·기계 등)·상태(신품·사용품)·품명및규격·보유수량을 한 행에 기록한 CSV 파일(약 2.6MB)이다. 발전설비 부품 공급업체나 정비 분석가가 특정 부품(예: 가스터빈 노즐)을 어느 본부가 몇 개 보유하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소명이나 품명 문자열 매칭, 또는 같은 기관 자료끼리만 연결한다.'
description_portal: '"한국서부발전은 안정적인 발전소 운영을 위해 태안, 서인천, 평택, 군산 발전본부에서 정비용 자재 예비품을 체계적으로 관리하고 있습니다. 확보된 예비품은 설비화, 전기, 기계 등 다양한 자재 유형으로 분류되며, 신품, 사용품 등 자재 상태에 따라 관리됩니다.각 사업소별 품명 및 규격, 보유 수량 정보는 상세하게 기록되어 있으며, “노즐[매인]”과 같이 구체적인 품목 정보까지 확인할 수 있습니다. 방대한 데이터 양상으로 인해 엑셀이나 분석 소프트웨어를 활용하여 데이터 확인 및 분석을 권장합니다.데이터는 한국서부발전 4개 본부(태안발전본부, 서인천발전본부, 평택발전본부, 군산발전본부) 에서 보유하고 있는 자재예비품 리스트 입니다.데이터 예) 사업소명,자재유형,상태,품명및규격,보유수량 군산발전본부,설비화,신품,"노즐[매인],NOZZLE[MAIN],NOZZLE ASSEMBLY,고온부품",31"'
