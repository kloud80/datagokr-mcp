summary_user: 서울시 자치구별 소비 지출을 분기(기준 년분기 코드) 단위로 집계한 자료로, 총지출액과 식료품·의류신발·생활용품·의료비·교통·교육·유흥·여가문화·기타·음식 지출 금액을 담는다. 창업 예정자나 상권 분석가가 '어느 자치구에서 외식이나 여가 지출 규모가 크고, 분기마다 어떻게 변하는가'를 비교할 때 쓴다. 자치구 코드와 자치구명(SIGNGU_CD_NM)은 있지만 전역 조인 키로 확인되지 않아, 다른 데이터와는 자치구 이름·코드 매핑이나 같은 서울시 상권분석서비스 계열 코드로 연결한다.
limits: data.go.kr 활용신청과 별도로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 경로에 넣어 호출해야 한다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와 붙일 때는 이름·코드 매핑이 필요하다. 포털 설명은 월평균 소득을 담는다고 하지만 필드 목록에는 소득 항목이 없고, 자치구 단위 집계라 상가·가구 단위 분석에는 쓸 수 없다.
