description_portal: 이 데이터는 서울시 각 자치구별 평균 소득과 소비 지출 현황을 분기별로 제공하는 자료입니다. 자치구별 가구 월평균 소득과 함께 총지출액, 식료품비, 의류·신발, 생활용품, 의료비, 교통비, 교육비, 오락·여가, 문화 관련 지출, 기타 지출, 외식비 등 항목별 세부 소비 규모가 포함되어 있습니다. 이를 통해 지역별 생활 수준과 소비 성향의 차이를 비교·분석할 수 있으며, 도시민의 생활패턴, 소비구조 변화, 정책 수립 및 복지 연구 등에 활용할 수 있습니다. 특히 자치구 단위로 제공되므로 서울시 내 지역 간 불균형 해석이나 맞춤형 정책 마련에 중요한 기초자료가 됩니다.
