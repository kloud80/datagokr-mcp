summary_user: 2024년 산재근로자 직업훈련 지원 사업에서 2023년 훈련 인원 상위 10% 기관을 평가해 선정한 최우수·우수 훈련기관의 이름과 소재지를 기관 한 곳당 한 행으로 담은 목록이며, 파일 크기는 485바이트에 불과한 소규모 자료다. 산재노동자나 재활 상담 담당자가 "우리 지역에서 평가가 좋은 산재 직업훈련기관은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 직업훈련 과정·기관 데이터와는 훈련기관명이나 소재지 주소를 맞춰 보는 방식으로만 연결한다.
