description_portal: 이 데이터는 한국수력원자력㈜의 가동원전 인허가 사항에 대한 원안위 심의사항 자료입니다. 가동원전 인허가 사항에 대한 원안위 심의사항 자료를 제공함으로써 한국수력원자력㈜의 투명성과 신뢰성을 높이고 책임성을 강화하기 위해 해당 데이터를 공개합니다.  이 데이터의 항목은 회의 차수, 본부, 발전소, 대상호기, 일시, 장소, 안건, 심의의결로 구성되어 있으며 데이터 형식은 CSV 파일 형식입니다.이 공개데이터가 제공하는 한국수력원자력 원안위 심의 안건 및 의결 사항에 관한 정보는 전력 및 원자력산업 관련 정책 수립과 연구 등을 위한 기초자료로 활용될 수 있습니다. 또한 공정한 절차를 거친 심의결과 제공을 통해 원자력 발전의 안전성 제고와 사회적 수용성 확대에도 기여할 것으로 기대됩니다.
