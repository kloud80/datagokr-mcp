description_portal: 이 데이터는 한국남부발전의 안전보건경영시스템(ISO 45001) 인증 현황을 정리한 자료입니다. 본사와 하동, 신인천, 부산, 남제주 등 주요 사업장이 획득한 인증 내역을 포함하고 있으며, 최초 인증일과 유효기간을 확인할 수 있습니다. ISO 45001은 국제적으로 인정받는 안전보건경영 표준으로, 사업장에서 발생할 수 있는 위험을 예방하고 근로자의 안전과 건강을 보호하기 위한 체계를 마련하는 것을 목표로 합니다. 본 자료는 한국남부발전이 전력 생산 과정에서 안전을 최우선으로 고려하며, 국제 표준에 부합하는 관리 체계를 도입하고 있음을 보여줍니다. 이를 통해 공기업의 안전보건 정책 이행 수준을 파악할 수 있으며, 향후 안전경영 성과 평가와 산업안전 관리 체계 연구에 기초 자료로 활용될 수 있습니다.
