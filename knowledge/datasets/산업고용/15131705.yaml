description_portal: '한국디자인진흥원(KIDP)은 디자인 인력 양성·교육, 연구 및 정책 개발, 문화 확산 및 해외 진출, 기업 지원, 서비스디자인 및 제조 혁신, 플랫폼 구축과 정보 제공 등 디자인 산업 전반을 포괄적으로 지원합니다. ‘보도자료’ 페이지에서는 정부 디자인 정책, 전람회 및 국제 협력사업, 우수 디자이너·기업 발굴, 국민 디자인 인식 제고 목적의 공식 발표 자료들이 게시됩니다. 본 데이터는 2024-07-29 기준으로 해당 페이지에서 수집한 보도자료 목록을 공공데이터 형식으로 정리한 것으로, 개방 당시 상태를 기준으로 구성되어 있습니다. 이후 관련 정보(게시 내용, 조회수, 첨부파일 등)는 변동될 수 있으므로, 최신 정보는 해당 페이지를 직접 확인해주시기 바랍니다.(https://kidp.or.kr/?menuno=1019) (데이터 기준일: 2024-07-29)'
