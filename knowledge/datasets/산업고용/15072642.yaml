summary_user: 기업지원플러스(G4B)에서 사업내용을 일괄변경할 수 있는 기관과 변경 항목을 업무그룹·상위코드·코드·코드명·코드설명으로 정리한 전국 단위 코드표 파일(CSV 약 8KB)로, 기업 건별 원천이 아닌 항목 목록이다. 사업자가 '사업장 주소나 대표자 등 사업내용을 G4B에서 한 번에 바꾸면 어느 기관의 어떤 항목까지 함께 반영되나'를 확인하거나, 분석가가 기관 간 기업정보 연계 범위를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 코드·코드명을 이름으로 맞추거나 같은 G4B 계열 코드로만 이어 쓸 수 있고, 기업 확인·인증 원장처럼 사업자번호로 기업 단위에 연결되지는 않는다.
description_portal: 기업지원플러스 G4B (https://www.g4b.go.kr) 는 중소벤처기업부 산하 중소기업연구원에서 운영관리합니다.G4B는 기업의 창업부터 운영 전반에 이르기까지 기업지원에 관한 모든 민원서비스를 한 곳에서 처리하는 행정포털 서비스입니다.개방정보는 사업내용 일괄변경 항목정보로서 G4B를 이용하여 일괄변경할수 있는 기관과 항목을 개방합니다.-정부,공공기관 등 국내 여러 기관에 분산되어 있는 기업지원 IT인프라를 연계한 기업경쟁력 지원 단일창구(Single Gateway) 구현-온라인을 통한 기업업무 일괄처리 지원 서비스를 비롯한 기업 중심의 실질적 체감 서비스를 제공-활기찬 시장경제 유도 및 산업체의 지속 가능한 성장동력화 견인차 역할
