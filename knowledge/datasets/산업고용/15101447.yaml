description_portal: 태백시에서 사용가능한  전기차 충전시설의 설치장소와, 구분(완속,급속), 주소, 설치대수(기기대수), 운영기관, 운영시간, 개방여부 이 등이 기록되어 있음. 각 시설물은 별도의 관리자 및 충전사업자가 운영 중이며, 해당 데이터는 전기차 충전시설 관련 법 담당 부서에서 보유 데이터를 기반으로 작성하였음. 전기차 충전시설은 관련 법에 의해 설치 신고 및 책임보험 가입이 의무화 되어있으며, 주차면수 및 건축물 용도에 따라 의무설치 대상으로 규정하고 있음.기축시설의 경우 주차면수의 2%, 신축시설의 경우 주차면수의 5%를 의무 설치 수량으로 정하고 있으며, 이에 충족하지 않을 경우 시정명령, 이행강제금 부과 등 행정처분이 발생함.
