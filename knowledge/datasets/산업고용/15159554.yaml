summary_user: 전라남도 일자리 정보망에 등록된 지역산업맞춤형 일자리사업 접수관의 사업별 목록(제목·접수 기간·분야·지역·썸네일)을 사업 단위로 담는 API이며, 범위는 시도 단위·비공간이다. 전남 거주 구직자나 청년이 지금 접수 중인 전남형 일자리사업이 무엇이고 언제까지 신청하는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했다. 그래서 다른 데이터와는 지역명·분야명 같은 이름으로 매핑하거나 같은 기관 코드로만 연결하며, 사업 고유번호(jobDeskId)는 목록과 상세·첨부파일 조회를 잇는 내부 키로 쓴다.
limits: 상세·첨부파일 오퍼레이션(/getJobDeskInfoDetail, /getJobDeskInfoFile)은 사업 고유번호(jobDeskId)를 필수로 받으므로, 목록에서 이 값을 먼저 받아 넘겨야 한다. 최소 파라미터로 호출했을 때 이 두 오퍼레이션은 응답이 없었고, 실호출에 성공한 것은 3개 중 1개다. 개발계정은 하루 1,000회로 제한된다.
