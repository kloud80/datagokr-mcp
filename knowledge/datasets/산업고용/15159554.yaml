description_portal: '- 입력 파라미터를 이용하여 전라남도 일자리 정보망에 등록되어있는 지역산업맞춤형 일자리사업 접수관의 목록 및 상세정보를 조회 할 수 있는 서비스 - 전남형 청년 희망일자리 사업: 18~45세 전남 거주 청년 대상 중소·사회적기업 취업 지원 모집 중 - 광양시 일자리창출 우수 시군 평가: 도내 22개 시군 중 ‘대상’ 수상 - 전남 중소기업일자리경제진흥원: 2025년 정책자금 4,400억 원 운영, 전년 대비 500억 원 증액 - 2022 지자체 일자리대상(대통령상): 전남도, ‘전국 종합대상’ 수상: 4,248명 고용창출과 예산 33.7% 확대, 해상풍력단지·디지털 전환 기반 마련 - 청년 유입 전략 및 지역 맞춤형 채용 정책이 핵심. 특히 전남형 청년 프로젝트, 디지털 전환 등 기반 마련이 돋보입니다. - 지역 기업 지원 확대: 플랫폼 통한 상담·역량교육, 지역 혁신기업 중심 정책자금 지원'
