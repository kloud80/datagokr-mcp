description_portal: 경기도 포천시에서 제공하는 토석채취허가 및 채석신고 현황 데이터입니다. 본 데이터는 포천시 관내에서 토석채취에 대한 허가 또는 신고가 이루어진 사업장의 정보를 포함하고 있으며, 상호명, 허가시작일, 허가종료일 등의 항목으로 구성되어 있습니다.해당 데이터는 토석채취 사업장의 허가 기간과 위치 정보를 파악하는 데 활용할 수 있습니다. 또한 환경영향 검토, 개발사업 관리, 토지 이용 현황 분석, 인허가 이력 관리 등의 업무를 위한 기초자료로 활용되고 있습니다. 본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
