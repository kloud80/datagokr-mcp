summary_user: 포천시 관내에서 토석채취 허가를 받거나 채석 신고를 한 사업장을 한 행씩 담은 원장 파일로, 상호명, 채석·반출 시작일과 종료일, 채취 석재의 용도, 산지 주소(도로명·지번)와 위도·경도가 들어 있습니다. 주민이나 개발사업 검토자가 "우리 동네 인근에서 지금 허가 기간 중인 채석장이 어디이고 언제까지 운영되나"를 확인할 때 쓰고, 환경영향 검토와 토지 이용 현황 분석의 기초자료로도 씁니다. 전역 조인 키는 없어서 다른 데이터와는 산지 지번주소나 위도·경도로 필지·공간 규제 데이터에 겹쳐 보거나, 상호명으로 다른 인허가 원장과 맞춰 이어 써야 합니다.
limits: 사업장 코드나 허가번호 같은 공통 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되므로 매칭 누락에 주의해야 합니다. 범위는 포천시 한 곳에 한정되고, 다운로드 파일 크기가 작아 수록 사업장 수가 많지 않을 수 있습니다.
