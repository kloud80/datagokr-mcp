description_portal: 서울특별시 용산구에 등록된 통신판매업체에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소, 사업장명, 최종수정일자, 데이터갱신구분, 데이터갱신일자, 업태구분명, 좌표정보(X, Y), 판매방식명 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 통신판매업체의 위치 및 운영 현황을 파악하고, 「전자상거래 등에서의 소비자보호에 관한 법률」상 소비자 보호 관련 정책을 효율적으로 수립할 수 있습니다.* "통신판매"란 우편, 전기통신, 그 밖에 총리령으로 정하는 방법으로 재화 또는 용역의 판매에 관한 정보를 제공하고 소비자의 청약을 받아 재화 또는 용역을 판매하는 것을 말합니다. 우리구에서는 주로 컴퓨터/사무용품, 의류/패션/잡화/뷰티, 건강/식품 등을 취급하는 업체들이 중심이 됩니다.
