summary_user: 제주지역의 일자·시각별 기상 요소(기온, 강수량, 습도, 적설, 풍속, 전운량, 일조, 대기권 밖·지표면 일사량)와 태양광 설비용량, 태양광 발전량 합계(MWh), 이용률을 한 행에 함께 담은 학습용 CSV 파일(약 3.5MB)로, 활용신청 없이 내려받습니다. 연구자나 분석가가 "일사량과 운량이 이만큼일 때 제주 태양광 발전량은 얼마나 나오는가" 같은 질문에 답하는 발전량 예측 모델을 학습·검증할 때 씁니다. 전역 조인 키는 없으므로, 다른 기상·전력 데이터와는 시도명과 일자·시각을 이름·시간 기준으로 맞춰 연결합니다.
description_portal: 한국동서발전의 제주지역 태양광 발전량 예측 학습용 데이터셋 정보입니다. 이 데이터는 제주지역의 기상 정보와 태양광 설비 정보를 기반으로 발전량을 예측하기 위한 학습용 자료로, 항목은 시도명, 태양광설비용량(MW), 일자 및 시각, 기온, 강수량(mm), 습도, 적설(cm), 풍속, 전운량(10분위/3분위), 일조(hr), 대기권 밖 일사량, 지표면 일사량, 태양광 발전량 합계(MWh), 이용률, 윤년여부 등으로 구성되어 있습니다. 다양한 기상 요소와 발전 결과가 함께 제공되어 기계학습 기반 발전량 예측 모델의 학습과 검증에 활용될 수 있습니다. 학계 및 연구기관에서는 이 데이터를 활용해 딥러닝 기반의 발전량 예측 모델 개발, 기후 요소와 발전 성능 간의 상관분석, 재생에너지 수급 예측 시뮬레이션, 기상데이터 전처리 연구, 또는 에너지 수요-공급 최적화 연구 등에 활용할 수 있습니다.
