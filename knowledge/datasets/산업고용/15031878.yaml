description_portal: '전북 특별자치도 진안군의 태양광 발전 사업 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 연번, 허가자, 발전소 명, 태양광사업 위치, 용량(단위: kW), 설치 면적(단위: 제곱미터), 허가 일자, 사업개시일 정보를 제공합니다. 이 자료를 통해 진안군에서 설치된 발전소 수와 발전소 명 및 허가자를 확인할 수 있으며, 용량과 설치 면적도 알아볼 수 있습니다. 면적이 넓을수록 용량도 크다는 것을 알 수 있습니다. 또한 허가일이 언제인지 파악할 수 있으며, 어느 위치에 설치되어 있는지도 확인할 수 있습니다. 이 자료는 9월 중순 이후에 현행화하여 제공합니다.'
