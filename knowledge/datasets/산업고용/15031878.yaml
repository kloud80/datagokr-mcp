summary_user: 전북특별자치도 진안군에서 허가된 태양광 발전사업을 발전소 한 곳당 한 행으로 담은 원장 파일로, 허가자·발전소명·설치위치·용량(kW)·설치면적(㎡)·허가일·사업개시일이 들어 있다. 진안군에 태양광 발전소가 몇 곳, 어디에 얼마 규모로 들어섰고 언제 허가·가동됐는지 확인하려는 주민·사업자·에너지 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 등 다른 자료와는 발전소명·주소 문자열 매칭으로만 이어 쓴다.
limits: 범위는 진안군 한 곳뿐이라 다른 시군이나 전국 비교에는 별도 자료가 필요하다. 행정코드·좌표 같은 공통 키가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 기대야 하고, 매칭 오류를 따로 확인해야 한다.
