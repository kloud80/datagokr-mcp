summary_user: 괴산군에서 사업을 개시한 발전사업을 사업장 한 곳당 한 행으로 담은 원천 목록으로, 포털 설명상 2019년 12월 9일 기준이며 인허가번호·상호·설치장소 주소·영업구분·원동력 종류(태양광 등)·설비용량(kW)·공급전압·주파수·허가일자를 담는다. 괴산군 안에서 어느 지역에 어떤 종류·규모의 발전소가 언제 허가되어 가동 중인지 확인하려는 주민·사업자·에너지 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 설치장소 주소나 상호 같은 이름으로 맞춰 이어야 하며, 전국 단위 비교는 발전소 단위로 주소·용량을 담은 전국태양광발전소전기사업허가정보표준데이터와 이 방식으로 대조한다.
limits: 괴산군 한 곳의 사업개시 발전사업만 담아 다른 시군이나 전국 현황은 알 수 없다. 법정동코드 같은 공통 키가 없어 주소·상호 매칭으로만 연결되므로 표기 차이에 따른 누락에 주의한다. 내용은 포털 설명상 2019년 12월 9일 기준 시점이다.
