summary_user: (재)장애인기업종합지원센터 창업넷에서 운영한 장애인 대상 창업 일반강좌를 강좌 한 건당 한 행으로 담은 CSV 파일(약 43KB)이며, 교육년도·온오프라인 구분·교육제목·교육 및 신청 기간·모집·신청·수료 인원·교육기관을 포함한다. 장애인 예비·초기 창업자가 "올해 신청 가능한 온라인 창업 강좌가 무엇이 있나"를 찾거나, 분석가가 강좌별 모집 대비 신청·수료 인원을 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 교육기관명·교육제목 같은 이름 매핑이나 같은 기관(장애인기업종합지원센터)의 다른 데이터셋 기준으로만 이어 쓴다.
limits: 사업자번호 같은 기업 식별 키가 없어서 수강자나 기업 단위의 창업 성과 추적이나 인증 데이터와의 직접 연결은 하지 못한다. 범위는 전국이고 지역 구분이 없는 비공간 데이터라 지역별 분석에는 맞지 않는다.
