description_portal: (재)장애인기업종합지원센터에서는 장애인의 창업 역량 강화를 목적으로 다양한 온·오프라인 교육 과정을 운영하고 있으며, 해당 강좌에 대한 자세한 정보는 교육년도, 교육 방식(온·오프라인), 교육 구분, 교육 제목, 교육 시작일과 종료일, 교육 시간, 모집 인원, 신청 시작일과 종료일, 교육을 주관하는 교육기관, 신청 인원 및 수료 인원 등의 항목으로 구성되어 제공됩니다.이러한 정보를 통해 예비 창업자 및 초기 창업자들은 본인의 일정과 관심 분야에 맞는 교육을 선택할 수 있으며, 체계적인 학습을 통해 실질적인 창업 역량을 키우고 성공적인 창업 기반을 마련할 수 있도록 지원하고 있습니다.
