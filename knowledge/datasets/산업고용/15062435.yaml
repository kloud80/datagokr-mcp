summary_user: 울산광역시 중구 관내 공장(기업체)을 한 업체당 한 행으로 담은 목록으로, 기업명·대표자명·주소·전화·팩스·종업원 수·업종·생산품을 시군구 범위에서 개별 주소 단위로 제공한다. 지역 산업 분석가나 구직자·거래처를 찾는 사업자가 '중구에 어떤 업종의 제조업체가 어디에 몇 명 규모로 있나'를 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 다른 데이터와는 기업명·주소 문자열 매칭이나 업종명 매핑으로만 이어 쓴다.
description_portal: 울산광역시 중구 기업체 현황에 대한 자료로, 울산광역시에 소재한 공장(기업체) 정보를 제공합니다.본 데이터는 기업명, 대표자명, 주소, 전화번호, 팩스번호, 종업원 수, 업종, 생산품 등의 현황을 확인할 수 있습니다.데이터 출처는 울산광역시 중구 일자리정책과 기업지원계(052-290-4460)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 1월 1일입니다. 다음 업데이트는 2027년 1~2월 중 제공됩니다.본 자료는 업종별·지역별 공장 분포 파악, 산업 현황 분석 등의 기초자료로 활용할 수 있습니다.
