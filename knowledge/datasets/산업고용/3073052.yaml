description_portal: '* 데이터 개요 : 벤처기업의 인수합병(M&A) 중개 기관 정보 - 한국벤처캐피털협회 (중소벤처기업 M&A 정보망, https://www.smes.go.kr/mna) 제공 데이터* 데이터 구성항목 : 기업명, 소재지, 전화번호 순* 자문기관 등록(신청자격) 법무법인,세무법인,회계법인,투자기관(VC, PEF), 컨설팅사 등 M&A 중개업무를 전문적으로 수행할 수 있는 적합한 역량과 경험을 보유한 기관(신청방법) M&A 정보망 자문기관 등록신청서(붙임3) 및 첨부서류를 운영기관(한국벤처캐피탈협회)에 제출(선정기준) 최근 3년 내 중소기업 대상 M&A 실적, 전문인력 보유 현황 등을 평가(주요역할) M&A 정보망에 등록된 중소기업 대상 M&A 거래 및 전문가 자문서비스 제공, M&A 인식 개선 관련 행사 참여 등  - 등록 후 활동이 미비한 자문기관은 지정 취소'
