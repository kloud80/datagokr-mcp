description_portal: 이 데이터셋은 서울특별시와 서울경제진흥원이 지원하는 하이서울 인증기업 현황을 정리한 자료로, 2024년 기준 총 1,107개 기업의 정보를 포함하고 있습니다. 각 기업의 기본 정보인 업체명, 대표자 성명, 설립일자와 함께, 하이서울 인증을 받은 지정년도와 주력 품목, 그리고 소재지 주소가 포함되어 있습니다. 이를 통해 서울시가 인증한 우수 중소기업들의 산업 분야, 성장 연혁, 지역적 분포를 한눈에 파악할 수 있으며, 기업 네트워킹, 산업 분석, 정책 지원 및 연구 목적으로 유용하게 활용할 수 있는 데이터입니다.
