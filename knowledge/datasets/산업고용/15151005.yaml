description_portal: 한국동서발전에서 제공하는 전국 태양광 발전량 예측 학습데이터는 기상요인과 발전설비 특성을 기반으로 발전량을 예측하기 위해 구축된 데이터입니다. 시도명, 설비용량(MW), 발전일자, 기온, 강우량(mm), 습도, 적설량(mm), 풍속, 적운량(10분위·3분위), 일조(hr), 일사량, 발전량(MWh) 등의 항목으로 구성되어 있으며, 태양광 발전 효율 분석 및 예측 모델 고도화에 활용될 수 있습니다. 학계와 연구기관에서는 해당 데이터를 활용하여 기후변화에 따른 재생에너지 발전량 예측, AI 기반 발전 예측 알고리즘 개발, 지역별 일사량 영향 분석, 국가 에너지 수급 안정성 연구 등 다양한 실증 연구를 수행할 수 있습니다. 또한 공공부문에서는 탄소중립 정책 및 신재생에너지 확대 전략 수립의 근거자료로 활용 가능합니다.
