summary_user: 전력시장에 참여하는 신재생에너지 발전기의 전력거래량을 거래일·거래시간별로 태양광·풍력·수력·연료전지·IGCC·해양·바이오·폐기물 연료원별과 신재생 합계로 집계한 전국 단위 파일(CSV, 약 8.8MB)이며, 포털 설명상 단위는 MWh, 기간은 2012년~2022년 3월이다. 분석가가 "태양광 거래량이 하루 중 몇 시에 가장 많고, 연도별로 시간대 패턴이 어떻게 바뀌었나" 같은 신재생 발전 비중·시간대 변화를 볼 때 쓴다. 전역 조인 키는 없고 날짜·시간 기준으로 같은 기관의 시간별 전력수요·SMP 등 전력시장 자료와 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 목록은 전력시장에 참여하는 신재생에너지 발전기의 전력거래량 합계를 제공합니다.- 항목 : 날짜/시간, 태양광, 폐기물, 풍력, 해양, 바이오- 단위 : MWh- 기간 : 2012~2022년 3월'
