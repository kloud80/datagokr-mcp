summary_user: 한국남부발전이 운영하는 한경풍력발전소의 풍력발전기별(한경1~3호기, 5~9호기) 일평균 풍속을 날짜(구분) 단위로 담은 CSV 파일(약 130KB)로, 발전기에 탑재된 풍속계 측정값입니다. 풍력 연구자나 에너지 분석가가 "한경풍력 단지의 호기별 풍속은 계절에 따라 어떻게 달라지는가"처럼 평균 풍속과 변화 추이를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 같은 기관의 한경풍력 발전량 자료와 날짜·호기 이름을 맞춰 연결해 풍속-발전량 상관 분석에 쓴다.
limits: 표준 코드나 공통 조인 키가 없어 다른 데이터와는 날짜와 발전기 이름을 직접 맞춰야 한다. 범위가 '전국·비공간'으로 표시되어 있지만 실제 내용은 한경풍력 한 단지의 호기별 값이므로, 지역 풍황이나 전국 풍속 분석에는 쓰지 않는다.
