description_portal: 본 데이터는 한국남부발전(주)의 한경풍력 일평균 풍속데이터 파일데이터입니다.한국남부발전(주)에서 운영하는 한경풍력발전소의 일평균 풍속데이터를 측정한 자료입니다.해당 풍속자료는 풍력발전기에 탑재된 풍속 측정기에서 측정된 값입니다.해당 데이터를 활용하여 풍력발전소의 평균 풍력 및 변화 추이를 분석할 수 있습니다.또한, 발전량 데이터와 결합하여 풍속의 변화에 따른 풍력발전량 상관관계 분석 및 기상에 따른 발전량 예측 등 다양한 연구를 위한 기초자료로 활용될 수 있습니다.
