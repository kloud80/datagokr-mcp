summary_user: 중소기업이 발간한 사회적책임(CSR)·지속가능경영 보고서를 보고서 한 건 단위로 모은 목록으로, 기업명·보고서 명칭·발간년도·GRI 적용 여부·검증 여부·보고서 주소(URL)를 담은 약 11KB 규모의 CSV 파일이다. 분석가나 ESG 담당자가 'GRI 기준을 적용하고 외부 검증을 받은 중소기업 CSR 보고서는 어느 기업 것이며 원문은 어디서 보나'를 확인할 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 인증·확인 데이터와는 기업명 매칭으로만 이어 쓸 수 있다.
limits: 사업자등록번호 등 공통 키가 없어 기업 단위 데이터와 정확히 연결되지 않으며, 기업명 표기 차이로 매칭 오류가 생길 수 있다. 보고서 목록일 뿐이라 CSR 성과 지표나 보고서 내용 자체는 담지 않는다.
