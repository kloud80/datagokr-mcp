summary_user: 서울시 상권배후지 영역별로 기준 연도·분기(STDR_YYQU_CD)와 서비스 업종마다 점포 수, 유사업종 점포 수, 프랜차이즈 점포 수, 개업·폐업 점포 수와 개업률·폐업률을 담은 집계 데이터이며, 개별 점포 단위 원장은 아니다. 예비 창업자나 상권 분석가가 '이 동네 배후지에서 커피전문점이 분기마다 얼마나 새로 생기고 문을 닫는가, 프랜차이즈 비중은 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 상권 코드·상권명이나 서비스 업종 코드처럼 서울시 우리마을가게 상권분석서비스 안에서 같은 기관이 쓰는 코드로 다른 지표(매출·유동인구 등)와 이어 쓴다.
description_portal: '서울시 상권배후지 영역 내의 점포 정보 및 개/폐업, 프랜차이즈 정보를 제공합니다.*용어설명- 상권분석은 다양한 데이터를 기반으로 상권(상업지역)의 특성, 소비자 행동, 경쟁 환경 등을 분석하는 기법으로 목적은 창업, 점포 입지 선정, 마케팅 전략, 투자 판단 등 의사결정을 지원하는 것- 입지 선정, 마케팅, 창업 전략, 투자 판단에 활용- 공공·민간·모바일 데이터를 활용하며, GIS·통계·AI 분석 기법과 결합※ 제공부서 : 서울특별시 서울신용보증재단 빅데이터팀(02-2174-5075)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
