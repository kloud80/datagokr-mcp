summary_user: 광진구 관내 공공시설에 설치된 태양광 발전 설비를 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 3KB)로, 시설명·용량(kW)·주소·설치연월·발전유형·설치위치·설치면적·건축물 연면적·층수·연락처를 담는다. 구청 에너지 담당자나 분석가가 광진구 공공건물 중 어디에 몇 kW 태양광이 언제 설치됐는지, 건물 규모 대비 설치 면적은 어느 정도인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 시설명을 맞춰 붙이거나, 전국태양광발전소전기사업허가정보표준데이터처럼 주소·용량을 가진 발전소 원장과 주소 기준으로 대조하는 방식으로 이어 쓴다.
description_portal: 서울특별시 광진구_공공시설태양광설치현황 데이터는 광진구 관내 공공시설에 설치된 태양광 발전 설비의 현황을 제공하는 행정 데이터입니다. 이 데이터는 “시설명”, “용량”, “주소”, “연락처”, “데이터기준일” 필드로 구성되어 있습니다. ‘시설명’은 태양광 설비가 설치된 공공시설의 명칭을 나타내며, ‘용량’은 해당 설비의 발전 용량을 제공합니다. ‘주소’는 태양광 설비가 위치한 장소를 명시하고, ‘연락처’는 시설 관리 및 문의를 위한 전화번호를 제공합니다. 또한 ‘데이터기준일’은 제공되는 정보의 최신화 기준일을 표시합니다. 이 데이터는 신재생에너지 설비 현황 분석, 공공시설 에너지 관리, 친환경 정책 수립 및 에너지 인프라 계획 수립의 기초 자료로 활용될 수 있습니다.
