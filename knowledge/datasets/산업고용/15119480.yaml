description_portal: 한국전력공사에서 제공하는 산업용 계약전력 구간별 현황 자료 입니다.조회기간, 시도, 계약전력구간, 계약종별(대), 고객호수, 판매량, 판매수입 항목으로 구성되어 있습니다.지역별 산업 전력 수요의 규모와 특성을 파악할 수 있으며, 계약전력 구간에 따른 전력 사용 패턴 차이를 분석해 산업체의 에너지 소비 구조를 비교하는데 도움을 줄 수 있습니다.효율적인 전력공급 및 수요관리 전략을 수립할 수 있고 유사 규모 사업장의 평균 전력 소비 특성을 참고하여 에너지 효율화 방안을 모색할 수 있습니다.전력 수요 예측 산업구조 변화 분석, 친환경 에너지 전화 정책 수립 등에도 활용 가치가 높습니다.
