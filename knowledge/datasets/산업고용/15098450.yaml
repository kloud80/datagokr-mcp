summary_user: 세종특별자치시에 등록된 음악산업시설을 시설 한 곳 단위로 담으며, 시설 명칭, 도로명 주소(roadNmAddr), 업종(induty)을 제공한다. 세종시 안에서 음반·음악 관련 업소가 어디에 어떤 업종으로 등록돼 있는지 찾으려는 시민이나 지역 음악산업 분포를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설명·주소 문자열 매칭으로만 이어 쓰고, 지방행정 인허가(LOCALDATA) 업종 원장이나 소상공인 상가업소 데이터와 주소 기준으로 대조하는 정도에 쓴다.
limits: 사업자번호나 공통 코드 같은 조인 키가 없어 다른 데이터와의 연결은 이름·주소 매칭에 의존한다. 범위는 세종시 한 곳이며, 개발계정은 하루 5,000회 호출로 제한된다.
