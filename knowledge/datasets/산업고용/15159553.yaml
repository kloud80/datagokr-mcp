summary_user: 전라남도 일자리 정보망에 등록된 전남 기업의 홍보 영상을 기업 한 곳당 영상 한 건 단위로 담고, 목록 조회와 상세 조회 두 가지 오퍼레이션으로 제공한다. 상세 조회에는 기업 이름, 업종, 주력상품, 소재지, 구인직종, 영상 URL이 들어 있어, 구직자가 '이 전남 기업은 무엇을 만들고 어떤 직종을 뽑는지 영상으로 먼저 보고 싶다'는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기업 이름이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '- 입력 파라미터를 이용하여 전라남도 일자리 정보망에 등록되어있는 전남기업의 영상 목록 및 상세정보를 조회 할 수 있는 서비스- 전남형 청년 희망일자리 사업: 18~45세 전남 거주 청년 대상 중소·사회적기업 취업 지원 모집 중- 광양시 일자리창출 우수 시군 평가: 도내 22개 시군 중 ‘대상’ 수상- 전남 중소기업일자리경제진흥원: 2025년 정책자금 4,400억 원 운영, 전년 대비 500억 원 증액- 2022 지자체 일자리대상(대통령상): 전남도, ‘전국 종합대상’ 수상: 4,248명 고용창출과 예산 33.7% 확대, 해상풍력단지·디지털 전환 기반 마련- 청년 유입 전략 및 지역 맞춤형 채용 정책이 핵심. 특히 전남형 청년 프로젝트, 디지털 전환 등 기반 마련이 돋보입니다.- 지역 기업 지원 확대: 플랫폼 통한 상담·역량교육, 지역 혁신기업 중심 정책자금 지원'
