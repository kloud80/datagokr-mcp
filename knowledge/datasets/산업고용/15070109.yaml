description_portal: '자산거래중개장터 등록 원자재 목록은 중소벤처기업진흥공단에서 운영중인 자산거래중개장터 사이트에 등록된 원자재 물건 정보 데이터 자료입니다.(제공 데이터 : 원자재명, 모델명, 규격, 제조사, 원산지, 단가, 수량, 희망가격, 게시기간, 메인노출여부, 진행상태, 개인/기업구분, 등록자명, 등록일 등)2014년부터의 데이터를 제공하였으며 기준일 기준 자산거래중개장터 사이트에 등록된 원자재 목록입니다.자산거래중개장터(www.joonggomall.or.kr)는 중소기업에서 사용하는 기계설비의 신속한 거래중개 정보를 제공하는 온라인 종합 중개장터입니다.'
