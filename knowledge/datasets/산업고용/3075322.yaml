summary_user: 부산광역시 해운대구에 등록된 직업소개소를 업체 한 곳당 한 행으로 담은 건별 등록현황 파일이며, 상호(법인명)·대표자명·유료/무료 구분·운영상태(운영·휴업·폐업 등)·지번 및 도로명 주소가 들어 있다. 구직자나 구인 사업자가 해운대구 안에서 지금 운영 중인 무료 직업소개소가 어디 있는지 확인할 때, 또는 분석가가 구 단위 직업소개소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소 주소를 지오코딩하거나 상호·대표자명으로 맞춰 잇는 방식으로만 연결한다.
description_portal: 부산광역시 해운대구 관내에 등록된 직업소개소의 등록현황입니다. 등록현황에는 직업소개소명(공식적인 상호), 소재지(각 직업소개소의 사무실이 등록되어있는 위치), 대표자명(개인 또는 법인의 대표자), 수수료여부(무료 직업소개소인지 유료직업소개소인지 구분), 운영여부(운영, 휴업, 폐업 등)의 정보가 포함되어있습니다. 각 정보들은 직업소개소의 신규등록 및 소재지 이전 따위 등을 이유로 한 변경 등록시 해당업체에서 제공한 정보이며 번호 변경, 소재지 이전, 폐업 등의 사유로 변경될 수 있음을 알려드립니다.
