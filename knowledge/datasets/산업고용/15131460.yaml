summary_user: 한국전력공사 사옥 가운데 K-BEMS(건물에너지관리시스템)가 구축된 건물을 사옥 한 곳당 한 행으로 담은 전국 단위 파일로, 본부·사업소·주소와 계약종별·계약전력·구축연월을 함께 싣는다. 에너지 효율 정책 연구자나 스마트빌딩 사업자가 'BEMS가 어떤 계약 규모·용도의 건물에, 어느 지역에서 언제 도입됐는가'를 살펴볼 때 쓴다. 전역 조인 키는 없어서 주소를 행정구역으로 매핑하거나 계약종별 이름을 기준으로 한전 계약종별 전력사용량 같은 지역·월 통계와 이어 쓴다.
description_portal: 한국전력공사에서 제공하는 K-BEMS 사옥정보 관련 데이터 입니다.본부, 사업소, 주소, 계약종별, 계약전력, 구축연월 항목으로 구성되어 있습니다.해당 데이터를 활용해 K-BEMS가 적용된 건물의 유형과 전력계약 특성을 파악할 수 있으며, 지역별 시기별 보급 현황을 살펴보는데 도움을 줄 수 있습니다.계약종별 및 계약전력 정보는 건물 규모나 용도별 에너지 수요 특성과 맞물려 분석할 수 있어 에너지 효울화 정책 연구나 스마트빌딩 환산 전략을 수립하는데 참고자료로 활용할 수 있습니다.구축시점을 통해 제도적/기술적 보급 흐름을 추적함으로써 민간 부문에서 BEMS 도입 방향을 모색하는데 도움을 줄 수 있습니다.
