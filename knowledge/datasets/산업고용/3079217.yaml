summary_user: 경상남도 거제시에 등록된 목욕업소를 업소 한 곳씩 담은 현황 파일로, 업종명·업소명·도로명/지번 주소·위도·경도·전화번호·영업시작일·기준일자를 담는다(시군구 범위, 약 6KB CSV). 거제시에서 목욕탕·사우나가 어디에 몰려 있고 언제부터 영업했는지 확인하려는 주민·사업자·상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 업소명 매칭으로 잇고, 지방행정 인허가(LOCALDATA) 목욕업 원장이나 소상공인 상가업소 정보와 대조하는 식으로 쓴다.
description_portal: 'ㅇ 데이터기준일: 2025-10-29경상남도 거제시에 등록된 목욕업소의 현황 정보를 제공합니다. 업종명, 업소명, 주소, 위도·경도 좌표, 전화번호, 영업 시작일자, 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내 목욕업소의 분포 및 영업 현황을 파악할 수 있으며, 목욕업 관련 정책 수립, 업종별 지원 사업 계획 수립, 지역 상권 분석 등에 활용할 수 있습니다. 특히, 좌표 정보를 활용하면 목욕업소의 밀집 지역을 시각적으로 분석하여 상권 분석, 교통 인프라 계획, 생활권역 설정 등에 유용하게 활용할 수 있습니다. 또한, 영업 시작일자 정보는 업소의 운영 기간을 파악하는 데 도움이 되며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다.'
