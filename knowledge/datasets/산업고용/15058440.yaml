summary_user: 경기도 안에서 특정고압가스를 사용하는 사업장을 한 곳씩 담은 인허가 원장으로, 시군·사업장명·인허가일과 폐업일·영업상태·지번과 도로명 주소·위경도·사용목적·월 사용량을 포함하며 LOCALDATA 에너지 업종 원장 계열에 속한다. 지자체 안전 담당자나 분석가가 '우리 시군에서 영업 중인 특정고압가스 사용 사업장이 어디에 몰려 있고 어떤 목적으로 쓰는가'를 확인할 때 쓴다. 전역 조인 키는 없고, 시군 코드(SIGUN_CD)나 사업장명·주소를 매핑해 같은 경기도 에너지 업종 인허가 데이터(고압가스·LPG·도시가스 등)와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 특정 고압가스를 사용하는 사업장 현황을 집계한 자료로, 고압가스 안전관리법에 따라 관리되는 주요 가스를 사용하는 업체들의 인허가 및 운영 현황을 포함합니다. 항목에는 시군명, 사업장명, 인허가일자 및 취소일자, 영업상태, 소재지 주소(지번·도로명), WGS84 위도·경도 좌표, 사용목적, 수용정원수 등이 포함됩니다. 이 데이터는 특정 고압가스를 사용하는 사업장의 분포와 안전관리 실태를 분석하는 데 활용될 수 있으며, 산업안전 점검, 위험물 관리 정책 수립, 지역별 산업 특성 분석, 가스 사용 시설에 대한 안전 규제 및 응급대응 체계 마련 등 다양한 방면에서 중요하게 사용됩니다.
