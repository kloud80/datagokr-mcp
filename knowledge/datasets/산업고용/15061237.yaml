description_portal: 한국수력원자력(주)이 가입한 국제협력기구 현황을 제공합니다. 해당 데이터에는 가입한 기관명, 설립년도, 설립목적, 가입연도가 세부적으로 나타나있습니다.최초로 가입한 국제기구는 미국원자력협회(NEI)였으며 이후 국제기구 설립에 맞춰 순차적으로 세계원자력협회(WNA), 세계원전사업자협회(WANO), 가압경수로소유자그룹(PWROG), 중수로소유자그룹(COG), 프라마톰소유자그룹(FROG) 등 국제협력기구에 가입하였습니다.국제협력기구의 설립목적은 해당 기구별로 상이하나 원자력 에너지 이용 진흥, 세계 원전 산업계 지원 및 정보교류 등을 위함이 공통점이라고 볼 수 있습니다.
