summary_user: 구례군에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록이며, 업소명·대표자·소재지·연락처와 데이터기준일자를 포함한다(약 14KB 규모의 CSV 파일). 구례군 안에서 담배를 파는 가게가 어디에 있는지 확인하려는 주민, 신규 담배소매인 지정을 검토하는 사업자, 지역별 담배 판매처 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없어서 소재지 주소나 업소명을 매칭하거나 같은 기관 코드로만 다른 데이터와 잇는다. 이렇게 이은 상대로는 지방행정 인허가(LOCALDATA) 담배소매 원장이나 소상공인 상가업소 정보를 쓴다.
description_portal: '"담배 소매인 지정현황"은 특정 지역 내에서 담배 소매인이 지정되어 있는 상태를 보여주는 공공데이터입니다. 이 데이터셋은 해당 지역의 담배 소매인의 명칭, 위치, 업태, 등록일 등의 정보를 포함하고 있습니다. 이 데이터는 보건 및 규제 담당 기관이나 관련 당국에 의해 관리되며, 담배 소매인의 등록 및 인증 절차를 투명하게 제공함으로써 공공의 건강 및 안전을 유지하는 데 도움이 됩니다. 또한, 담배 소매인이 위치한 지역의 흡연 행태와 관련된 데이터를 분석하는 데 활용될 수 있습니다. 이 데이터셋은 공공정책 수립, 보건정책 개선, 담배 규제 강화 등 다양한 분야에서 유용하게 활용될 수 있습니다.'
