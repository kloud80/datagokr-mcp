description_portal: '한국산업기술진흥원에서 주관하는 케이걸스데이 행사는 이공계 분야에 관심이 있는 여학생들에게 다양한 진로 체험 기회를 제공하기 위한 목적으로 개최되는 행사입니다. 본 행사의 체험 프로그램 정보 데이터를 통해 각 프로그램의 구체적인 실행 시간, 내용 및 대상 정보 등을 상세히 제시하고 있으며, 이 정보는 참가자들이 자신의 관심 분야와 맞는 프로그램을 선택하는 데 큰 도움이 될 수 있습니다. 또한, 데이터는 이공계 분야에 대한 여학생들의 진입 장벽을 완화하고, 더 많은 이공계 인재를 양성하는 데 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 순번(숫자형), 지역(문자형), 기관(문자형), 기업구분(문자형), 체험프로그램명(문자형), 체험시작시간(문자형), 체험종료시간(문자형), 대상(문자형) 등으로 구성되어 있습니다. 각 컬럼은 체험 프로그램의 기본적인 정보와 실행 관련 사항을 포괄적으로 담고 있어 활용도가 높습니다.'
