summary_user: 대구광역시 동구가 지정한 지역 우수기업을 기업 한 곳당 한 건으로 담으며, 등록번호·업체명·생산품 내용·전화번호를 제공한다. 지역 기업과 협력하거나 납품처를 찾는 사업자, 동구 산업 현황을 보는 분석가가 '동구 우수기업은 어디이고 무엇을 생산하는가'를 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 확인·인증 데이터와는 업체명 매핑으로만 연결한다.
limits: 사업자등록번호가 없어 벤처·이노비즈 등 다른 기업 인증 원장과 정확히 연결할 수 없고, 업체명 매칭에 의존해야 한다. 범위는 대구 동구 한 시군구에 한정되며 위치 정보가 없어 지도 분석에는 쓰기 어렵다. 포털 활용신청은 자동 승인되며 개발계정은 하루 10,000회까지 호출할 수 있다.
