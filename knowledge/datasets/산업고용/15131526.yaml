description_portal: '한국남동발전의 화력발전 발전 실적 데이터입니다. 한국남동발전에서 운영하고 있는 분당, 영흥, 삼천포 화력발전의 시간대별 발전량 데이터(MWh)입니다.각 발전소의 시간대별 발전량(MWh)뿐만 아니라, 일별 총 발전량(kW), 평균·최대·최소 발전량 데이터를 함께 제공하여 단기적인 운영 패턴과 일일 실적을 동시에 파악할 수 있습니다.데이터는 최대 1개월 단위로 조회 가능하며, 시간대별 상세 데이터는 분석이 용이하도록 엑셀 또는 CSV 파일로 다운로드할 수 있습니다.* 활용방안 예시:  시간대별 발전량 데이터를 통해 전력 수요가 높은 피크타임과 낮은 시간대의 운영 패턴을 분석할 수 있습니다.'
