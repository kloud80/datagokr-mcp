summary_user: 인천광역시가 2025년에 일자리창출 우수기업으로 인증한 기업 명단을 기업 한 곳당 한 행으로 담은 소규모 CSV 파일(1,788바이트)로, 기업명·대표자·주업종(주생산품)·소재지 주소가 들어 있다. 구직자가 인천에서 고용을 늘리고 고용환경이 좋은 기업을 찾거나, 분석가가 인증기업의 업종·지역 분포를 살피는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 인증·지원사업 데이터와는 기업명이나 소재지 주소를 맞춰 붙여야 한다.
description_portal: 2025년 인천광역시 일자리창출 우수기업 인증 현황입니다.고용창출 및 고용환경 개선 우수 기업을 적극 발굴하여 기업의 지속성장과 양질의 일자리 창출을 통한 고용안정을 도모하고자 시행합니다. 그동안 추진경과는 2013년 도입이래 총 215개 기업을 인증하였습니다. 연 20개 기업 내외를 인증목표를 두고 있으며, 인증기간은 인증일로부터 2년입니다. 신청자격은 인천소재(본사, 지점 등) 2년 이상 정상 운영중인 기업으로 제조업, 제조업관련 서비스업, 지식기반 서비스업, MICE업 중 1개 이상 충족하는 기업입니다. 전년도 12월말 대비 근로자 증가인원이 5명이상 근로자 증가율이 5%이상 증가하여야 하며, 상시근로자 50인 미민 기업은 3명이상, 증가하여야 합니다. 추진절차는 2025년 5월 1일부터 23일까지 온라인 접수를 통해 6월까지 서류심사, 현장실사를 거쳐 심사위원회를 거쳐 최종적으로 선정됩니다. 심사항목은 기업경영상태, 근로자 증가수와 증가율, 평균퇴사율, 지역인재 우선고용, 취약계층 고용 등과 어르신일자리창출기업, 가족친화인증기업, 청년고용우수기업에 가점이 부여됩니다. 선정된 인증기업에게는 중소기업 경영안정자금 55억까지 이차보전 0.5% 우대 적용과, 보험료 할인, 인증서 및 현판 수여 등 28개 인센티브를 지원합니다. 2025년 7월 1일 21개기업 선정되어 공고하였으며, 7월 21일 인증서 및 현판 수여식이 있었습니다.
