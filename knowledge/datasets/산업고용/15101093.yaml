summary_user: 국내 판매 자동차의 모델별 연비와 에너지효율등급(1~5등급) 정보를 제조사·모델명·배기량·연비·등급·연간 유류비 등으로 담은 모델 단위 원장이며, 범위는 전국이다. 차량 구매를 앞둔 소비자나 분석가가 '이 모델의 연비 등급과 연간 연료비는 얼마인가', '같은 배기량대에서 등급이 높은 모델은 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제조사명·모델명(modelname) 같은 이름 매칭으로만 잇는다.
description_portal: 본 데이터는 국내 판매되는 자동차(승용차, 승합차, 화물차 등)의 에너지 소비 효율(연비) 및 온실가스 배출량에 따라 1등급(최고 효율)부터 5등급(최저 효율)까지 등급을 부여하고 이를 표시하도록 하는 '자동차 에너지소비효율 및 등급표시 제도'의 관련 정보를 제공합니다. 이 제도는 소비자가 우수한 연비의 자동차를 쉽게 식별하고 구매할 수 있도록 투명한 정보를 제공함으로써, 고효율 자동차의 개발 및 판매를 촉진하고, 연비 향상을 통한 국가 에너지 절약을 도모하는 데 목적이 있습니다. 특히, 2023년 12월부터는 전기차에도 전비(전기차 연비)에 따른 에너지 효율 등급 표시가 의무화되어, 내연기관차뿐만 아니라 전기차 시장에서도 소비자의 합리적인 선택을 돕고 제조사의 고효율 기술 개발을 유도하고 있습니다. 궁극적으로는 수송 부문의 에너지 소비 효율을 높여 온실가스 감축 목표 달성에 기여합니다.
