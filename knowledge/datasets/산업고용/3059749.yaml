summary_user: 경영혁신플랫폼(smplatform.go.kr)의 중소기업 정보화 지원 사업(클라우드기반솔루션개발)에 참여한 중소기업을 업체 한 곳씩 지원연도·내역사업·업체명·소재지·주소로 담은 전국 단위 파일(CSV 약 11KB)입니다. 분석가나 지자체 담당자가 "어느 지역 중소기업이 어느 해에 클라우드 솔루션 개발 지원을 받았나"를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 인증·지원 데이터와는 업체명이나 주소를 맞춰 대조해서 이어 쓴다.
limits: 사업자등록번호 등 공통 키가 없어 벤처·이노비즈 확인서 같은 기업 원장과 정확히 연결하기 어렵고, 업체명·주소 매칭에 기대야 합니다. 이 데이터는 지원 참여 현황만 담아 지원 금액이나 사업 성과는 알 수 없다.
