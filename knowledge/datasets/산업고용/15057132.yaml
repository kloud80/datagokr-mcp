summary_user: 경기도 시군별 고용복지플러스센터를 센터 한 곳당 한 행으로 담은 기관 목록으로, 시군 코드·시군명, 기관명, 전화번호, 홈페이지, 지번·도로명 주소, 우편번호, 위경도 좌표를 포함한다. 구직급여·직업훈련이나 복지 상담을 받으려는 도민이 '우리 시군에서 가장 가까운 고용복지플러스센터는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시군별 센터 접근성을 따지는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군명·시군 코드(SIGUN_CD) 이름 매핑이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 고용복지플러스센터의 운영 현황을 담고 있습니다. 고용복지플러스센터는 기존 고용센터 기능(구직급여, 직업훈련)에 더해 기초생활보장, 긴급복지, 자활지원 등 복지서비스를 통합 제공하는 기관입니다. 데이터에는 각 센터의 기관명, 도로명/지번 주소, 우편번호, 전화번호, 홈페이지 URL, 위도/경도 좌표 등의 정보가 포함되어 있어, 지역별 접근성과 인프라를 분석할 수 있습니다. 이 자료는 복지 사각지대 해소, 고용-복지 연계 정책 수립, 취업취약계층 지원 방안 마련에 유용하게 활용될 수 있습니다. 해당 데이터는 경기도장애인복지종합지원센터(누림센터)에서 연 1회 갱신하며, 행정 및 정책 활용뿐만 아니라 민간 연구 및 서비스 기획에도 참고 가능합니다.
