summary_user: 전남개발공사가 태양광 발전소를 직접 건립하며 거친 업무 절차를 사업성 검토부터 운영 개시까지 단계별로 정리한 절차 안내표로, 단계 구분·사업절차·추진내용·인허가 제출서류를 담은 약 7KB 분량의 소형 CSV 파일이다. 태양광 발전사업을 준비하는 사업자나 공공기관 담당자가 '발전소를 짓기까지 어떤 인허가를 어떤 순서로 밟고 어떤 서류를 내야 하나'를 미리 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 기계적으로 결합되지 않으며, 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과는 절차명·인허가 명칭을 기준으로 참고해 나란히 읽는 정도로 쓴다.
limits: 개별 발전소나 지역별 실적이 아닌 비공간 절차 안내 자료라서 발전소 위치·용량·허가 현황 분석에는 쓰지 못한다. 조인 키가 없어 다른 데이터셋과 직접 연결되지 않는다.
