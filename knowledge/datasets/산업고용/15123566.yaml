summary_user: 원자력안전위원회가 측정한 국내 표층 해수의 방사능 농도를 연도·해역 구분(동해·서해·남해 등)·조사정점별로 담은 소규모 집계 파일(csv 약 3.5KB)로, 세슘 최소·최대 농도(mBq/kg)와 삼중수소 농도(Bq/L)를 기준연도 2019~2022년에 걸쳐 제공한다. 연구자나 시민이 '최근 몇 년 사이 우리 바다 해역별 세슘·삼중수소 농도가 어느 수준이고 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 해양·환경방사능 자료와는 연도와 해역명·조사정점 이름을 맞춰 연결해야 한다.
description_portal: '이 데이터는 원자력안전위원회에서 수행하는 국내 표층 해수의 방사능 농도 관측 결과를 제공하는 자료로, 연도별로 동해‧서해‧남해 등 해역 구분에 따라 조사 정점에서 측정된 주요 방사성 물질 농도를 포함합니다. 특히 세슘(Cs)의 최소·최대 농도와 삼중수소(H-3) 농도를 제시하여 해역별 방사능 수준의 변화와 환경 안전성을 평가할 수 있도록 구성되었습니다. 이를 통해 해양 방사능 모니터링, 환경영향 분석, 정책 수립 등 다양한 연구·행정 분야에서 활용 가능한 기반 정보를 제공합니다.※ 기준연도 : 2019-2022년[ 단위 ]※ 세슘의 농도(mBq/kg), 삼중수소의 농도(Bq/L)'
