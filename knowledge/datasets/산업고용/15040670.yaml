summary_user: 충청남도 도내 벤처기업을 기업 한 곳당 한 행으로 담은 파일(csv, 약 165KB)로, 업체명·벤처확인 유형·확인기관·간략주소·업종분류·주생산품을 담는다. 창업지원 담당자나 지역 산업 분석가가 '충남 어느 시군에 어떤 업종의 벤처기업이 몰려 있고, 주로 무엇을 생산하나'를 파악하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 다른 인증·기업 데이터와는 기업명이나 주소, 업종명(10차 표준산업분류명) 매칭으로만 잇는다.
limits: 사업자번호 등 공통 키가 없어 이노비즈·창업기업 인증 등 다른 기업 원장과 정확히 연결하기 어렵고, 기업명 매칭 시 동명·표기 차이에 주의해야 한다. 주소는 간략주소 수준이라 정밀한 위치 분석에는 한계가 있다.
