summary_user: 세종특별자치시 안 대형마트(쇼핑몰)를 점포 한 곳당 한 행으로 담은 작은 파일(csv 693바이트)로, 법인명·상호·업태·소재지·전화번호·건물연면적·영업장면적·판매면적·영업개시일·전통상업보존구역 여부를 담는다. 세종시에서 대형마트를 열려는 사업자나 상권 분석가가 '시내 대형마트가 어디에 몇 곳 있고 판매면적은 얼마인가'를 확인하는 데 쓴다. 공통 조인 키가 없어 소상공인 상가업소 원장이나 전국 대규모점포 표준데이터와는 상호·소재지 주소를 맞춰 이어 쓴다.
description_portal: 세종특별자치시에 있는 쇼핑몰(대형마트)에 대한 정보입니다.본 데이터는 연번, 광역자치단체명, 법인명, 대표자성명, 상호, 업태, 소재지, 전화번호, 건물연면적, 영업장면적, 판매면적, 영업개시일 등으로 구성되어 있으며2025년 8월31일 기준 세종특별자치시 내 대형마트는 2008년 영업을 시작한 조치원 홈플러스(세종특별자치시 조치원읍 허만석로 60), 2014년 영업을 시작한 절재로 홈플러스(세종특별자치시 절재로 154),  2015년 영업을 시작한 이마트(세종특별자치시 금송로 687), 2018년 영업을 시작한 코스트코(세종특별자치시 종합운동장1로 14) 총 4개가 있습니다.본 데이터는 세종특별자치시 경제산업국 소상공인과에서 관리하는 데이터입니다.
