description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 지원하는 인력양성사업의 연구 성과물인 논문을 검증하고 관리하는 과정에 대한 정보를 담은 공공 데이터입니다. KETEP은 미래 에너지 산업을 이끌어갈 전문 인력을 양성하는 과정에서 창출되는 학술적 성과물의 신뢰성을 확보하고, 연구윤리를 강화하기 위해 논문 검증 시스템을 운영하고 있습니다. 제공되는 정보는 인력양성사업 과제에 참여한 연구자들이 KETEP의 "인력양성시스템"에 업로드한 논문들의 학술지 명칭, 논문명, 국제표준자료번호 등을 포함합니다.
