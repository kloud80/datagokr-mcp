summary_user: 한국남부발전(주)에 등록된 통합 기자재 가운데 신뢰성이 중요한 시설에서 정해진 성능목표를 충족해 유자격으로 지정된 품목을 품목번호·품목한글명·운용구분(건설, 기계 등)·사용구분·지정일 단위로 담은 건별 목록 파일(csv, 약 4.8KB)이다. 발전 기자재 공급업체나 분석가가 "남부발전 발전소에서 어떤 품목이 언제 유자격으로 지정됐는가"를 확인해 납품 준비나 기술 개발 대상 파악에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명 매핑이나 같은 기관(남부발전) 자료의 품목번호로만 이어 쓴다.
description_portal: 본 데이터는 한국남부발전(주) 통합 기자재 유자격 정보 파일데이터입니다.본 데이터는 한국남부발전(주)에 등록된 통합 기자재 중 유자격(신뢰성이 중요한 시설에서 활용되는 기자재가 정해진 성능목표를 충족한 경우) 항목에 대한 정보입니다. 본 데이터는 품목번호와 품목한글명, 운용구분(건설, 기계 등)과 지정일로 구성되어 있습니다. 본 데이터를 활용하여 발전소 내에서 사용되는 다양한 세부 유자격 장비의 현황을 파악할 수 있습니다. 또한, 발전사업과 관련된 장비의 기술 개발 등에도 활용할 수 있습니다.
