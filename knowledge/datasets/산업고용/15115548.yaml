summary_user: 강원특별자치도 정선군이 전기사업법에 따라 허가한 태양광 등 발전사업의 허가 현황을 허가 건별로 담은 원천 목록(CSV 약 42KB)으로, 허가번호·허가일자·상호·설비용량(kW)·공급전압·원동력 종류·설치장소·상태·사업개시 신고·처리일을 포함한다. 정선군에서 어느 곳에 어느 규모의 태양광 발전소가 허가됐고 실제 사업을 개시했는지 확인하려는 주민·발전사업자·에너지 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치장소 주소나 상호를 이름 기준으로 맞춰 이어야 하며, 전국태양광발전소전기사업허가정보표준데이터와 견주어 쓰는 것이 자연스럽다.
description_portal: 정선군 전기사업(발전사업) 허가 현황에 대한 데이터로 공공데이터 목록 등재 요청에 따라 이를 제공하여 해당하는 민원 편의를 제공하고자 데이터를 등록합니다.(허가번호, 허가일자, 상호,  설비용량(KW), 공급전압,  원동력 종류, 설치 장소, 설치 구분, 상태, 사업개시신고일, 사업개시처리일 등)으로구성된 데이터입니다.전기사업법과 전기사업법 시행력, 전기사업법 시행규칙에 근거하여 수집된 정보이며 해당정보에 개인정보 등은 제외하고 제공하는 자료입니다.해당정보에 일부 오타 및 오류사항이 있다면 해당 담당자에게 연락 주시면 수정 하여 재등록 할 수 있도록 조치하겠습니다.
