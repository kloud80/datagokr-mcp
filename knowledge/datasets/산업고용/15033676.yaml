summary_user: 강원특별자치도에 등록된 골재업 업체를 한 행씩 담은 파일로, 업체명·대표자명·업종명·연락처·소재지주소와 위도·경도를 시군구 단위로 제공한다. 건설·레미콘 사업자나 지역 분석가가 "우리 시군 근처에서 모래·자갈을 공급하는 골재업체는 어디인가" 같은 질문에 쓴다. 전역 조인 키는 없어 시도명·시군구명이나 주소 문자열, 좌표로 다른 지역 데이터(인허가·지도 레이어 등)와 맞춰 이어 쓴다.
description_portal: 하천골재는 하천 바닥에 쌓여 있는 모래, 자갈, 돌을 의미합니다. 하천 바닥에서 채취한 모래나 자갈을 건설 자재(콘크리트 등) 및 구조물 개설에 쓰입니다. 함부로 골재  채취를 하게 될 경우 홍수 발생 위험이 있기에, 법적으로 등록된 업체에서 국가 및 해당 지자체에서 허가를 받고 채취 할 수 있습니다. 따라서 위 자료는 강원특별자치도 골재업 정보(업체명, 대표자명, 사업장업종명, 소재지주소, 위치의 위도 및 경도 등) 데이터를 제공합니다. 자세한 사항은 파일 및 관련 법 참고하여 주시기 바랍니다.  *골재채취법 제14조 및 22조 참조
