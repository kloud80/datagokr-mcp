summary_user: 경기도 내 급수공사 대행업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·위경도·허가기간을 포함한다. 수도 설비 공사를 맡길 업체를 찾는 시민이나 상수도 관련 민간업체 분포를 보는 지자체·분석가가 '우리 시군에서 지금 영업 중인 급수공사 대행업체는 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 맞춰 잇고, 같은 지방행정 인허가(LOCALDATA) 계열 업종 데이터와는 같은 구조로 나란히 비교한다.
description_portal: 이 데이터는 경기도 내에서 급수공사(상수도 관련 시설 설치 및 관리)를 대행하는 업체들의 인허가 현황을 제공하는 자료입니다. 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태구분코드(BSN_STATE_DIV_CD), 통합영업상태명(UNITY_BSN_STATE_NM), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지시설전화번호(LOCPLC_FACLT_TELNO), 소재지면적정보(LOCPLC_AR_INFO), 도로명주소(REFINE_ROADNM_ADDR), 지번주소(REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 위도(REFINE_WGS84_LAT), 경도(REFINE_WGS84_LOGT), 업태구분명정보(BIZCOND_DIV_NM_INFO), 종업원수(EMPLY_CNT), 허가시작일자(PERMISN_BEGIN_DE), 허가종료일자(PERMISN_END_DE)가 포함됩니다.이 데이터는 지역별 급수공사 대행업체의 분포, 허가 및 영업 현황을 파악하는 데 활용되며, 상수도 관리, 건설업체 운영 평가, 산업 인프라 현황 분석 등에 유용합니다. 또한 지자체와 공공기관은 상수도 관련 민간업체 관리 및 정책 수립 근거로 활용할 수 있고, 기업 및 연구기관은 지역 기반의 수도 설비 관련 산업 현황 파악에 참고할 수 있습니다.
