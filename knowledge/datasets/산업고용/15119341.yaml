summary_user: 중소벤처기업부에 등록된 신기술창업전문회사(대학·연구기관 보유 기술의 사업화와 창업 촉진을 주된 업무로 하는 회사)를 회사 1곳당 1행으로 담은 전국 목록 파일로, 법인명·최초등록일·주소만 들어 있습니다. 기술이전·기술사업화 협력처를 찾는 창업자나 연구자가 "우리 지역에 대학·연구기관 기술을 사업화하는 신창사가 어디 있고 언제 등록됐나"를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 인증·확인 데이터와는 법인명 대조나 주소 기반 지역 매핑으로만 이어 쓴다.
