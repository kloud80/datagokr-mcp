description_portal: 전기차 충전소현황 데이터는 지역 내 전기자동차 이용자의 충전 편의를 제공하기 위해 설치·운영되고 있는 전기차 충전시설의 정보를 제공하는 공공데이터로서 운영기관, 충전소명, 소재지주소, 이용가능시간, 충전기타입, 규격, 비고 등의 항목으로 구성되어 있다. 본 데이터는 전기차 이용자가 충전소 위치와 운영기관, 충전 가능 시간, 충전 방식 및 규격 등을 사전에 확인할 수 있도록 정보를 제공하여 전기차 충전 인프라 접근성을 높이고 원활한 충전 서비스 이용을 지원하기 위한 목적으로 활용된다. 또한 지역 내 전기차 충전 인프라 구축 현황을 파악하고 친환경 교통정책 수립, 전기차 보급 확대, 관련 연구 및 행정업무 수행을 위한 기초자료로 활용될 수 있다. 비고 항목을 통해 단독형 충전기 여부 또는 2대 동시충전 가능 여부 등 충전시설 운영 특성을 함께 확인할 수 있다.
