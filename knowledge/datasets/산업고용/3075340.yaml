summary_user: 부산광역시 해운대구에 있는 직원 100인 이상 기업체를 업체별로 한 행씩 정리한 목록으로, 업체명·사업장 주소·대표업종·연락처를 담는다(2.4KB 규모의 소형 CSV). 해운대구 관내에 어떤 중대형 기업이 어디에 있고 어떤 업종에 몰려 있는지 확인하려는 지역 정책 담당자나 기업 연계를 찾는 사업자가 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 부산광역시 해운대구에 위치하고 있는 직원 100인 이상 기업체에 대한 정보를 정리한 자료입니다. 기업체의 명칭, 사업장 소재지 주소, 주요 생산품, 전화번호 등이 포함되며, 관내 중대형 기업 분포와 산업군 특성을 파악할 수 있도록 구성되어 있으며, 지역경제 활성화 방안 마련, 산업 육성 전략 수립, 기업지원 정책 수립 등에 유용하게 활용될 수 있으며, 고용창출 효과 분석, 기업유치 전략 수립, 산업 인프라 조성, 민간투자 유치 등 정책 기획 및 의사결정 과정의 기초자료로 제공될 수 있습니다. 또한 지역 내 산업생태계 구조 분석 및 중견·대기업과의 상생협력 기반 마련에도 기여할 수 있습니다.
