description_portal: '한국지역난방공사의 사업장별 환경법규 위반 현황을 정리한 데이터로, 연료·수질·폐기물 등 환경관리 분야별 점검 결과와 행정조치 내역을 포함하여 법규 준수 수준을 평가하고 개선 이력을 관리할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 지사아이디: 환경 점검이 실시된 사업장 또는 지사명(예시: 광주전남지사, 대구지사, 파주지사)■ 환경코드: 점검 항목이 속한 환경 관리 분야(예시: 연료, 수질, 폐기물)■ 점검결과내용: 환경법규 위반 내용 및 행정조치 결과(예시: 고형연료제품 품질기준 초과(개선명령), 배출구 수질오염도 기준 초과(개선명령))■ 점검기관명: 해당 점검을 수행한 기관명(예시: 나주시, 대구지방환경청, 파주시청)■ 점검일자: 점검이 실시된 날짜(예시: 2023-04-05)3. 활용 예제:■ 환경법규 위반 이력 데이터를 분석하여 지사별 주요 위반 유형 및 재발 방지 대책 수립■ 점검기관 및 항목별 법규 준수율을 평가해 환경경영 리스크 관리 체계 강화■ 연료·수질·폐기물 등 분야별 환경 성과를 종합적으로 검토하여 지속가능경영(ESG) 보고서 작성 및 정책 개선 자료로 활용'
