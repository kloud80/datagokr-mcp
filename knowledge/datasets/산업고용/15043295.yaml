description_portal: 한국남동발전 여수발전본부의 연료소비실적 현황 데이터입니다.여수발전본부는 1977년 중유전소 발전소로 건설되었으나, 에너지 환경변화에 대응하고 효율적인 설비운영을 위하여 저렴하고 다양한 연료를 사용하는 순환유동층 발전소로 전환하였습니다. 해당 데이터는 여수발전본부의 2017-01-01 부터 2017-12-31까지 일자별 유연탄(톤), 부생원료유(L), 우드팰릿(톤) 실적 정보를 포함하고 있습니다. 이 데이터는 연료 사용의 효율성을 분석하고, 발전원별 연료 소비 패턴 및 계절적·환경적 요인을 고려한 최적의 연료 운영 전략 수립에 활용할 수 있습니다.
