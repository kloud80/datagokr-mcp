summary_user: 순천시 관내 기업을 한 행씩 담은 목록 파일로, 업체명·사업자번호·대표자·연락처·법정동/행정동·도로명주소·설립일자·본사 여부를 기업 단위로 담는다(CSV 약 457KB). 지역 창업·산업 분석가가 "순천시 어느 동에 최근 설립된 기업이 몰려 있고 본사로 등록된 곳은 얼마나 되나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 사업자번호나 업체명·주소를 직접 맞춰 기업 인증·지원사업·상가업소 데이터와 연결하고 법정동·행정동 이름으로 지역 통계와 붙인다.
