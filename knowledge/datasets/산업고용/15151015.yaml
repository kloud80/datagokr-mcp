description_portal: 한국동서발전에서 제공하는 양양 및 영덕 풍력발전 스카다(SCADA) 데이터는 두 지역의 풍력발전 설비에서 수집된 실시간 운전 정보를 포함한 자료입니다. 데이터는 수집시각, 지역, 풍속(초속미터), 풍향(도), 풍력터빈 식별번호 등 주요 항목으로 구성되어 있으며, 풍력발전기의 성능 평가와 운전 효율 분석, 풍황 특성 연구에 활용할 수 있습니다. 해당 데이터는 각 지역의 기상 변화와 터빈 작동 특성 간의 상관관계를 분석하거나, 풍력자원 잠재력 평가 및 발전량 예측 모델을 구축하는 데 중요한 근거자료가 됩니다. 학계와 연구기관에서는 이를 기반으로 풍황 시뮬레이션, 설비 성능 검증, 예측 알고리즘 개발, 지역별 풍력 발전 최적화 등 다양한 연구를 수행할 수 있습니다.
