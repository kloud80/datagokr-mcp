summary_user: 한국동서발전이 운영하는 양양·영덕 풍력발전기의 스카다(SCADA) 운전 기록을 수집시각·터빈 식별번호별로 풍속(m/s)·풍향(도)과 함께 담은 건별 시계열 파일로, zip 압축 약 8.9MB 규모입니다. 연구자나 풍력 사업자가 '양양과 영덕 단지에서 시간대별 풍속·풍향이 어떻게 달라지고 터빈별 운전 특성은 어떤가'를 따져 풍황 분석이나 발전량 예측 모델의 입력으로 쓴다. 다른 데이터와 바로 묶을 전역 조인 키는 없어, 지역명(양양·영덕)과 수집시각을 기준으로 기상 관측 자료 등과 맞춰 붙여 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 발전소 허가 원장 등 다른 데이터와는 지역명이나 같은 기관 기준으로만 연결된다. 범위는 전국으로 표시되어 있지만 실제 내용은 양양·영덕 두 단지에 한정되며 좌표가 없는 비공간 자료다.
