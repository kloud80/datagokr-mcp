description_portal: 한국가스공사의 도시가스 중기 수요전망(5개년) 기준 용도별 TDR(Top Down Ratio) 데이터 입니다. TDR은 상위 수준(전체) 전망치를 하위 용도별로 배분하는 비율로서, 수요 전망 모델의 핵심 파라미터이며 용도별 수요 구조를 반영합니다. 본 데이터는 용도별 수요 전망 및 수급 계획 수립을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 가정용, 산업용, 수송용, 열병합용, 일반용, 연료전지용 수요의 연도별 TDR 값이 포함되어 있습니다. 본 데이터를 활용하면 용도별 수요 구성비 분석 및 변화 추이 파악, 수요 전망 모델 파라미터 설정 및 보정, 용도별 성장률 비교, 수급 계획 수립 지원에 기초자료로 활용할 수 있어 도시가스 수요 전망의 정확도 향상과 용도별 맞춤 전략 수립에 기여할 것으로 기대됩니다.
