summary_user: 서울특별시 중구에서 사료를 제조·수입·판매하는 업소를 업소별 한 건씩 담은 인허가 원장으로, 관리번호, 인허가일·폐업일, 영업상태, 지번·도로명 주소, 중부원점TM 좌표(XCRD·YCRD), 축산 업무 구분 등을 포함한다. 사료 관련 창업을 준비하는 사업자나 축산 공급망 분석가가 '중구에서 현재 영업 중인 사료제조·판매 업소는 어디이고 언제 인허가·폐업했는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 지방행정 인허가(LOCALDATA) 공통 형식이라 다른 업종 인허가 데이터와 같은 구조로 나란히 비교한다.
description_portal: '서울특별시 중구의 사료를 제조하거나 수입 및 판매하는 업소 정보를 제공합니다. 각 등록업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 축산물안전 관련 산업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 공급체계 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 축산 농가 및 관련 공급체계 관계자들에게는 품질인증 기준을 충족하며 위생관리가 철저하게 이루어지는 배합사료 등록업체를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
