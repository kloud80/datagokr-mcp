description_portal: 본 데이터는 글로벌 LNG 시장에서 북미 대륙의 LNG 수입 물량 및 원산지별 거래 현황을 연도별로 체계적으로 정리한 국제 에너지 무역 통계 자료입니다. Energy Institute에서 매년 발표하는 세계 에너지 통계 리뷰 데이터를 기반으로 북미 지역 LNG 거래 흐름을 분석하여 독립적인 데이터셋으로 가공 및 제공합니다. 데이터 항목으로는 연도, 원산지국, 수입량, 전체 대비 수입 비중 등이 포함됩니다. 글로벌 천연가스 및 LNG 거래 시장이 지속적으로 확대되면서 대륙별 수입물량과 원산지 분석의 중요성이 크게 증가하고 있습니다. 이 데이터를 통해 북미 LNG 시장의 거래 흐름 변화와 주요 공급국 현황, 연도별 시장 규모 추이를 종합적으로 파악할 수 있으며, 국제 에너지 정책 수립 및 글로벌 LNG 시장 동향 연구에 핵심 참고자료로 활용될 수 있습니다.
