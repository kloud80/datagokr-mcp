description_portal: "* 중소벤처기업부에서 기술혁신형(이노비즈) 인증을 받은 기업들의 주생산품 정보입니다.* 이노비즈란? Innovation(혁신)과 Business(기업)의 합성어로 기술 우위를 바탕으로 경쟁력을 확보한 '기술혁신형' 중소기업을 지칭합니다. - 중소기업기술혁신촉진법에 근거, 「오슬러 매뉴얼」에 의한 2단계에 걸친 혁신성 평가를 통과하여 중소벤처기업부로부터 Inno-Biz인증을 받은 핵심 기업군 - 오슬로 매뉴얼 : 1) 기술혁신능력, 2) 기술사업화능력, 3) 기술혁신 경영능력, 4) 기술혁신 성과를 평가* 데이터 구성요소 : 번호, 지역, 회사명, 대표자명, 주 생산품, 이노비즈 유효기간 시작일, 이노비즈 유효기간 종료일, 홈페이지 주소 순"
