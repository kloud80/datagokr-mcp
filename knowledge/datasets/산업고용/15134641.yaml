summary_user: 이노비즈(기술혁신형 중소기업) 인증을 받은 기업의 지역, 업체명, 대표자, 주생산품, 인증 확인서 유효기간 시작·종료일, 홈페이지를 기업 단위로 담은 전국 범위 파일(CSV 약 2.4MB)이다. 공공구매 담당자나 거래처를 찾는 사업자가 특정 품목을 만드는 기술혁신형 중소기업이 어느 지역에 있고 인증이 아직 유효한지 확인할 때 쓴다. 사업자번호 컬럼이 있어 벤처·창업기업 확인 등 다른 기업 인증 원장과 기업 단위로 붙여 볼 여지가 있지만, 실측에서는 전역 조인 키가 확인되지 않아 업체명 매칭으로 잇는 것을 전제로 해야 한다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와의 연결은 업체명 등 이름 매칭에 의존해야 하며, 사업자번호의 형식과 실제 사용 가능 여부는 직접 확인이 필요하다. 지역은 전국·비공간 단위라 좌표나 행정코드 기반의 공간 분석에는 바로 쓰지 못한다.
