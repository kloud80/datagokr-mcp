summary_user: 국가기술은행(NTB)에 등록된 기부기술·나눔기술 정보를 건별로 조회하는 전국 범위 API이며, 확인된 응답 필드는 페이지 정보(결과 수·페이지번호·전체 건수)와 기술 목록(items)뿐입니다. 기업이 "무상으로 이전받을 수 있는 기부·나눔 기술 중 우리 사업에 맞는 것이 있는가"를 찾을 때 쓴다. 실측 컬럼에서 다른 데이터와 잇는 공통 조인 키는 찾지 못했으므로, 기술명 같은 이름 매칭이나 같은 기관(한국산업기술진흥원)의 기술은행 계열 데이터와의 대조로만 연결한다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 코드로 바로 붙일 수 없고 이름 매핑에 의존해야 한다. 지역 단위 구분이 없는 비공간 데이터라 지역별 분석에는 쓰기 어렵다. 개발계정은 하루 1,000회 호출 제한이 있다.
