description_portal: 이 데이터는 근로복지공단이 최저임금 인상에 따른 사업주의 경영 부담을 완화하고 근로자의 고용 안정을 지원하기 위해 시행했던 일자리 안정자금 지원 사업의 지원 대상 업종 현황을 담고 있습니다. 이 자료는 지원 연도별로 자동차 및 부품 판매업, 도소매 및 중개업, 숙박업, 음식점 및 주점업, 농업, 임업, 어업 등 자금 지원을 받은 구체적인 업종명을 제공합니다. 이 자료는 정부의 사회 경제 정책이 중소기업 및 소상공인에게 미치는 영향을 파악하는 데 필수적인 근거 정보이며, 특히 최저임금 인상과 같은 정책 변화에 취약한 산업 분야를 진단하는 데 중요한 기초 자료라고 판단됩니다.본 데이터는 정부 지원 사업의 정책 효과 분석 및 미래의 유사 재정 지원 정책 수립에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 지원을 받은 업종의 특성을 분석함으로써, 경영 여건 변화에 민감하게 반응하는 취약 산업군을 명확하게 식별할 수 있습니다. 이를 통해 향후 경제 위기나 정책 변화 시기에 고용 유지 및 경영 안정화를 위한 정부의 지원 대상을 설정하고, 지원 방식의 효율성을 개선하는 데 활용할 수 있습니다. 또한, 이 통계는 일자리 안정자금이 종료된 이후 해당 업종의 고용 추이를 분석하여 정책의 장기적인 영향을 평가하는 데 기여할 수 있다고 판단됩니다.※ 일자리 안정자금 지원은 2022년 6월 30일을 기준으로 종료되었습니다.
