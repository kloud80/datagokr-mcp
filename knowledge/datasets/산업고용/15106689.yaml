description_portal: 저소득층효율개선 사업통계는 기후변화에 취약한 에너지 소외계층의 생활환경 개선을 위한 지원 현황을 보여주는 공공데이터입니다.해당 통계 데이터의 기초가 되는 에너지효율개선사업은 한파와 폭염 등 극한 기후에 대응하기 위해 단열, 창호 시공, 고효율 냉·난방기 교체 등의 사업을 통해 저소득층의 주거환경을 개선하고, 기후위기 적응력을 높이는 데 목적이 있습니다.연도별 및 광역지자체별로 지원된 금액과 수혜 가구 수를 포함하고 있어 지역별 정책 효과 분석이나 향후 예산 편성에 유용한 자료로 활용될 수 있습니다.특히 에너지 복지 실현과 탄소중립 사회로의 전환을 위한 기반 자료로서 중요한 의미를 지닙니다.
