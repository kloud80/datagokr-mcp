summary_user: 전국 지자체가 관리하는 옥외광고업 인허가 정보를 업체(사업장) 단위로 담은 건별 원천 데이터로, 전체 56,501건이며 인허가일자·영업상태·사업장명·주소·좌표를 포함한다. 사업자나 분석가가 특정 지역에 영업 중인 옥외광고업체가 어디에 몇 곳 있는지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)는 주소 키로, 관리번호(MNG_NO)는 pnu 키로 다른 지역·상권 데이터와 이어 쓴다.
description_portal: '기타_옥외광고업 데이터는 광고물이나 게시시설을 제작, 표시 및 설치하거나 옥외광고를 대행하는 업체 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 옥외광고업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 행정안전부 주소정보혁신과 / 044-205-3544 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
