description_portal: 기업 및 개인으로부터 식품 및 생활용품을 독거노인, 결식아동 등에게 제공해줘 저소득 소외계층에게 아주 중요한 자료입니다.세종특별자치 내에 있는 푸드뱅크 및 마켓의 현황을 csv 파일로 제공하고 있습니다.총 1곳이며 구분, 사업 주체, 소재지 주소, 대표자, 전화번호 구성되어 있어 쉽게 위치와 운영하고 있는 주체를 파악할 수 있습니다.구분은 사랑 나눔 푸드뱅크 및 마켓으로 되어있고, 사업 주체는 세종특별자치시 사회복지협의회입니다.위치는 조치원읍 터미널안길 60 6층에 위치해 있습니다.이 데이터는 세종특별자치시 보건복지국 복지정책과에서 관리하고 있습니다. 문의사항은 044-300-3342로 연락해주시기 바랍니다.
