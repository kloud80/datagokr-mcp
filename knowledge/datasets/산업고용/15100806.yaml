summary_user: 경기도 광교비즈니스센터에 입주한 기업을 한 행씩 담은 목록으로, 기업명·설립년도·사업자등록번호·업종·기업규모·인증 구분·주요생산품·인원·입주년도·입주목적·입주공간 인원 등을 포함한다. 창업지원 담당자나 분석가가 "광교비즈니스센터에는 어떤 업종의 기업이 언제, 어떤 목적으로 입주했는가"를 파악하거나 센터 입주기업 구성을 평가하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 기업명이나 사업자등록번호(bizregno) 같은 값을 이름·코드로 맞춰 다른 기업 확인·인증 자료와 연결해야 한다.
description_portal: 이 데이터는 광교비즈니스센터에 입주한 기업들의 현황을 종합한 자료로, 해당 센터를 기반으로 한 기업 성장과 창업 지원 정책 수립에 활용될 수 있습니다. 주요 항목에는 ‘기업명’과 ‘설립년도’, ‘사업자등록번호’를 통해 기업의 정체성을 확인할 수 있으며, ‘업종’과 ‘주요생산품’은 각 기업의 산업 영역과 주력 생산 또는 연구 품목을 나타냅니다. ‘입주년도’ 및 ‘입주목적’은 센터 내 입주의 시기와 목적을 나타내며, 기업의 성장 단계와 지원 필요성을 분석하는 데 활용됩니다. 본 데이터는 창업기업 육성, 기업군 분석, 산업 클러스터 정책, 비즈니스센터의 성과평가 등에 기초자료로 활용될 수 있습니다.
