summary_user: 완주군에 등록된 대부업체·대부중개업체를 업체 한 곳당 한 행으로 담은 원장 파일로, 상호·대표자·소재지(도로명)·등록증번호·등록일자·유효기간 만료일·영업상태가 들어 있다(파일 크기 446바이트로 건수가 매우 적음). 주민이나 분석가가 '완주군에서 등록이 유효한 대부업체는 어디이고 언제 등록이 만료되는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 시군 대부업 현황이나 LOCALDATA 인허가 자료와는 상호·소재지 주소로 맞춰 이어 써야 한다.
limits: 사업자등록번호나 표준 코드 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 범위는 완주군 한 곳에 한정된다. 갱신 주기는 확인되지 않았으므로 기준일자(데이터기준일자)를 보고 최신 여부를 판단해야 한다.
