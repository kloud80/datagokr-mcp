description_portal: '해당 api는 한국수력원자력(주)_원자력발전소 실시간 기상 정보 API입니다.한국수력원자력에서 운영중인 원자력발전소(고리, 한빛, 월성, 한울, 새울)의 실시간 기상정보(온도, 습도, 강우량, 풍속, 풍향)를 제공중에 있습니다.요청 메시지 정보내에 발전소 구분값은 아래 내용을 참조하시면 됩니다. 그리고 응답값중 expl은 아이템 설명, name은 아이템 고유 태그명, time은 갱신시간,  value값은 온도(℃), 습도(%), 강우량(mm), 풍속(m/s), 풍향(방위각 ex) 0:N, 90:E, 45:NE)로 표기됨을 안내드립니다.○ 발전소 구분 WS : 월성 KR : 고리 YK : 한빛 UJ : 한울'
