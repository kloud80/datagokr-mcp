summary_user: "한국수력원자력이 운영하는 원자력발전소(고리·한빛·월성·한울·새울)별로 측정한 실시간 기상값(온도, 습도, 강우량, 풍속, 풍향)을 항목 설명·태그명·갱신시간과 함께 담는다. 원전 인근 주민이나 환경·안전 분석가가 '지금 특정 원전 주변의 풍향과 풍속은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 발전소 구분값(예: 월성 WS, 고리 KR)이나 발전소 이름으로 맞춰 기상청 관측자료 등 환경기상 데이터와 함께 쓴다."
limits: 요청할 때 발전소 구분 코드(genName)를 필수로 넘겨야 하므로 코드값을 먼저 확인해야 한다. 공통 조인 키가 없어서 다른 데이터와는 이름이나 코드를 직접 매핑해야 연결된다.
