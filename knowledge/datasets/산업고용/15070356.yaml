summary_user: 한국수력원자력이 보유한 고정형·휴대용·개인선량계 등 방사선(능) 측정장비를 장비 한 대(행)마다 분류, 장비명(모델명), 사용 여부로 담은 목록 파일(csv, 약 9KB)이다. 원전 안전·방사선 감시에 관심 있는 분석가나 국민이 '한수원은 어떤 종류의 방사선 측정장비를 몇 대 운용하고, 그중 현재 사용 중인 것은 얼마나 되는가'를 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어, 장비명이나 장비분류 같은 이름 매핑 또는 같은 기관(한수원) 기준으로만 실시간 환경방사선량 등 다른 원자력 데이터와 함께 본다.
description_portal: 이 데이터에는 고정형, 휴대용 및 개인선량게 방사선(능) 측정 장비의 모델명, 사용 가능 여부  등이 포함되어 있습니다. 이를 통해 장비의 전체 현황을 파악하고, 정기적인 점검과 유지보수를 통해 정확한 측정이 가능하도록 관리하고 있습니다. 또한, 사용 여부를 지속적으로 모니터링하여 필요 시 신속하게 장비를 활용하거나 교체할 수 있으며, 방사선 안전과 관련된 규제 준수 여부를 확인하는 데도 중요한 자료로 활용됩니다. 이 자료는 방사선 안전관리와 품질 확보, 사고 예방을 위해 매우 중요한 역할을 합니다.
