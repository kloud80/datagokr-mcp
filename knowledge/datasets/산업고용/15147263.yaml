summary_user: 서울시 행정동별로 코드(ADSTRD_CD)·명칭, 중심 좌표(X·Y), 면적(㎡)을 한 행씩 담은 공간 영역 기준 자료입니다. 상권 분석가나 창업 준비자가 "이 상권이 속한 행정동은 어디이고 면적 대비 점포·인구 밀도는 얼마인가"를 따질 때 지도 표시와 밀도 계산의 기준으로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 서울시 상권분석서비스의 다른 자료와 행정동 코드로 맞추거나 명칭 매핑으로 이어 쓴다.
limits: 행정동 단위의 위치·면적만 담고 있어 점포 수나 매출 같은 상권 지표는 다른 데이터와 결합해야 한다. 전국 표준 행정코드와 바로 맞는다는 근거가 없어, 다른 기관 자료와 붙일 때는 이름·코드 매핑을 직접 해야 한다. 호출에는 포털 활용신청과 별도로 서울 열린데이터광장(data.seoul.go.kr) 인증키가 필요하다.
