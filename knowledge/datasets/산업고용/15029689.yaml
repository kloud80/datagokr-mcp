summary_user: 충청북도 증평군에 허가·신고된 고압가스 저장설비 사업장을 사업장 1건당 1행으로 담은 원천 목록으로, 법인명(상호), 사업의 종류, 사업소 소재지, 허가일자, 취급 가스 정보, 데이터 기준일자를 담는다(파일 약 1.7KB 규모의 소량 데이터). 군청 안전·방재 담당자나 주민이 '우리 동네 어느 사업장이 어떤 고압가스를 저장하고 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 에너지 업종 인허가(LPG·도시가스 등) 목록이나 LOCALDATA 원장과는 상호명·소재지 주소를 맞춰 이어 쓴다.
description_portal: 「고압가스 안전관리법」 제3조 및 「고압가스 사업 허가 및 신고에 관한 규정」에 따라,고압가스 제조·저장·판매 등의 사업을 영위하는 사업자는 관할 자치단체장의 허가 또는 신고를 받아야 하며,이에 따라 증평군에 등록된 고압가스 저장설비 현황을 정리한 데이터입니다.해당 데이터는 고압가스 저장시설을 운영하는 법인 및 사업장의 기본정보,설비 위치(지번/도로명/좌표), 허가일자, 취급 가스 종류,기준일자 등 행정목적·안전관리·방재활동에 활용 가능한 정보를 포함하고 있습니다.※ 제공된 데이터는 해당 연도 기준의 공식 인허가 정보로, 이후 변경사항(폐업, 이전, 가스종 변경 등)은 반영되지 않을 수 있습니다.
