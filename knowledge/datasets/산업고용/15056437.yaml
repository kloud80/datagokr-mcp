summary_user: 경상남도에 등록된 측량업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 업종·등록번호·업체명·대표자명·사업자등록번호·소재지·전화번호를 개별 주소 단위로 담는다. 측량을 맡길 업체를 찾는 도민이나 사업자가 '우리 시군에 등록된 지적·측량업체는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 도내 측량업체의 지역 분포를 볼 때 쓴다. 사업자등록번호(bizno)가 실측 조인 키여서 지방행정 인허가(LOCALDATA) 등 다른 업종 인허가 원장이나 기업 현황 자료와 사업자 단위로 이어 쓴다.
limits: 범위는 경상남도 한 개 시도뿐이라 다른 시도의 측량업체나 전국 비교에는 쓰지 못한다. API가 아닌 포털 파일(csv)로만 받으므로 실시간 조회는 안 되고, 기준 시점은 파일의 데이터기준일자로 확인해야 한다.
