description_portal: 남해군 2024년도, 2025년도  공사대장 준공연기 현황 데이터로, 공사대장관리시스템테서 추출한 데이터입니다. 항목명으로는 공사명, 준공연기결정일자, 준공연기일수, 준공변경기한, 준공기한 연기사유에 대한 정보를 포함하고 있습니다  이 데이터는 공사 진행 과정에서 준공기한이 연기된 사례를 기록한 ‘공사대장 준공연기’ 관련 정보입니다. ‘공사명’은 해당 공사의 명칭을 나타내며, ‘준공연기결정일자’는 준공기한 연기를 공식적으로 결정한 날짜를 의미합니다. ‘준공연기일수’는 기존 준공기한에서 연장된 일수를 나타내고, ‘준공변경기한’은 연기 후 새롭게 확정된 준공 마감일입니다. 마지막으로 ‘준공기한 연기사유’는 기상 악화, 자재 수급 문제, 설계 변경 등 연기 결정의 원인을 구체적으로 기록한 항목입니다. 이 데이터는 공사 관리 및 일정 조정, 계약 이행 평가, 공공 건설사업의 투명성 제고에 중요한 자료로 활용될 수 있습니다.
