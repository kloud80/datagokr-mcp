summary_user: 국내 원자력발전소(호기 묶음)별로 원자로형, 정격용량, 노심출력, 연료·감속재·냉각재, 증기발생기·가압기·터빈 배열 같은 주요 사양을 항목(행)×발전소(열) 형태로 정리한 소규모 표 파일(약 1.3KB CSV)이다. 특정 원전의 원자로형이나 설비용량이 무엇인지, 발전소 간 냉각재 루프 수나 터빈 구성이 어떻게 다른지 비교하려는 분석가·연구자·일반 국민이 참고 자료로 쓴다. 전역 조인 키가 없어 다른 발전소 데이터와는 발전소 이름(고리·한빛·한울·월성·새울·신고리 등)을 맞춰 연결해야 한다.
description_portal: 국내 원자력발전소별 주요사양 데이터입니다. 원자력발전소별 주요 설비와 기술적 특성을 종합적으로 제공하는 데이터로, 발전소의 원자로형, 정격용량, 노심출력 등 핵심 성능 정보를 포함합니다. 또한 사용되는 원전연료의 종류, 감속재와 냉각재의 구성, 연료집합체와 연료봉 피복재, 제어봉집합체 등 핵연료계통의 상세 사양을 제공합니다. 아울러 냉각수펌프와 증기발생기 구성, 냉각재 루프수, 가압기 사양, 고압·저압터빈 배열 등 주요 기계·계통 장치 정보를 함께 제공하여 각 발전소의 구조적·운전적 특성을 체계적으로 이해할 수 있는 기반 정보를 제시합니다.
