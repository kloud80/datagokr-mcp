description_portal: 승강기 안전부품 및 승강기 자체에 대한 안전인증제도는 「승강기 안전관리법」에 근거하여 시행되는 법적 강제인증제도입니다. 해당 제도에 따라 승강기를 제조, 수입, 설치하고자 하는 경우에는 반드시 법 제11조(승강기 안전인증) 및 **제17조(승강기안전부품 안전인증)**에 따라 안전인증을 받아야 합니다.이 제도는 승강기의 사용자가 승강기를 안전하게 이용할 수 있도록 보장하기 위해 마련된 것으로, 인증기관이 제품의 구조 및 기능에 대한 시험, 제조·검사설비에 대한 평가, 품질관리체계 적합성 확인 등의 절차를 통해 승강기의 안전성을 검증하게 됩니다.본 제도를 통해 설비 및 부품의 불량으로 인한 사고를 예방하고, 제조업체의 생산관리 역량을 향상시킬 수 있으며, 공공 및 민간 건물 내 승강기 설치·운영 시 중요한 기술적 기반자료로 활용됩니다. 아울러 국제 기준과의 조화를 통해 수출 관련 인증 취득 시에도 활용될 수 있는 공신력 있는 인증 체계입니다.
