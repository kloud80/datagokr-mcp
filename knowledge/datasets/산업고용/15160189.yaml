summary_user: 전력시장에 참여하는 태양광 발전설비의 전력거래량(MWh)을 거래일자·거래시간·시도별 지역 단위로 담은 파일 데이터로, 전국을 범위로 한다. 분석가나 에너지 사업자가 '특정 시도의 시간대별 태양광 거래량이 어떻게 달라지는가'처럼 지역·시간별 태양광 발전 패턴을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역명 매핑이나 거래일자·시간 기준으로 같은 기관의 SMP·발전원별 발전량 데이터와 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 내용 : 지역별 시간대별 태양광 전력거래량(MWh)ㅇ 지역구분 : (태양광) 시도별* 본 자료는 향후 수정정산에 따라 변경될 수 있습니다.항목 : 거래일자, 거래시간, 지역, 연료원, 전력거래량단위 : MWh* 본 데이터는 전력시장에 참여하는 발전기의 전력거래량으로, 전기사업법 시행령 제19조 1항 2호에 따라 한국전력공사와 직접 거래하는 발전기, 자가용 등은 포함하지 않습니다.전력거래량은 소내용 및 주변압기 손실분 등을 제외한 송전단 기준 발전량이며, 수정정산 등에 의해 값이 변동될 수 있습니다.* 태양광 전력거래량은 ESS 충방전량이 포함되어 있는 수치로 심야시간대 전력거래량은 ESS 방전에 의해 소량 발생할 수 있습니다.'
