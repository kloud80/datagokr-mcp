summary_user: 울산광역시 중구에서 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업소명·지번주소·도로명주소·지정일자를 담는다. 창업 예정자나 상권 분석가가 '중구의 어느 동네에 담배소매점이 몰려 있고 언제 지정됐나'를 확인할 때 쓴다. 전역 조인 키는 없어서 주소(지번·도로명)를 지오코딩하거나 업소명으로 맞춰 소상공인 상가업소 정보나 LOCALDATA 인허가 자료와 이어 쓴다.
description_portal: 울산광역시 중구 담배소매인 지정 현황에 대한 자료로, 울산광역시 중구 담배소매인 지정 현황 정보를 제공합니다. 본 데이터는 담배소매인 업소명, 업소주소(지번, 도로명), 지정일자 등의 현황을 확인할 수 있습니다. 데이터 출처는 울산광역시 중구 경제정책과 지역경제계(052-290-3310)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 3월 6일입니다. 다음 업데이트는 2027년 2~3월 중 제공됩니다.본 자료는 울산광역시 중구 담배소매인의 업소별·지역별 분포 현황 파악, 담배 판매 관리 및 지역 경제 분석, 관련 정책 수립 등을 위한 기초자료로 활용할 수 있습니다.
