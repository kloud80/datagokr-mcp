description_portal: 본 데이터는 구직급여 수급기간 중의 재취업률을 나타내는 지표입니다. 해당 재취업률 수치는 구직급여 수급기간 내에 실제로 재취업한 사람의 수를 구직급여 지급이 종료된 전체 사람의 수로 나눈 뒤 백분율(%)로 환산하여 계산됩니다. 산출 대상은 상용직 및 일용직을 포함하는 임금근로자, 예술인, 노무제공자를 기준으로 하며, 자영업자는 대상에서 제외됩니다. 여기서 통계에 사용되는 "지급종료자"는 다음 세가지 분류로 구성됩니다. (1) 소정급여일수를 모두 소진한 자, (2) 지정된 수급기간이 만료되어 지급이 종료된 자, (3) 수급기간 중 재취업한 자입니다.
