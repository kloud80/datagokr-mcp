summary_user: 전국 수소충전소의 실시간 운영 현황을 충전소 단위로 담은 API로, 검증 시 246행이 수신됐고 운영상태, 튜브트레일러 압력, 대기 차량 수, 혼잡 상태를 포함한다. 수소차 운전자가 지금 가려는 충전소가 운영 중인지, 얼마나 붐비는지 확인하는 질문에 쓴다. 충전소 관리번호(chrstn_mno)와 충전소명이 있으나 전역 조인 키는 없어, 다른 충전소 데이터와는 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 타 기관 데이터와 바로 결합되지 않는다. 검증 수신분은 2026-10-02 하루 기준 현재 상태 246행이라 과거 이력 분석에는 맞지 않으며, 완충가능대수 필드는 명세상 미사용이다.
