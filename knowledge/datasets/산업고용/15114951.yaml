description_portal: 2011년 ~ 2025년 원자력발전소 호기별 계획예방정비 현황 자료입니다. - 해당 자료는 2011년 이후부터 시작된 원자력발전소 계획예방정비에 대하여 착수연도, 호기별, 차수, 시작일, 종료일, 총일수 자료가 작성되어 있습니다. - 해당 자료는 매년 공공데이터 개방주기에 맞추어 전원전 계획예방정비 현황자료로 갱신하여 공개할 예정입니다. - 해당 자료는 2026. 6. 9. 기준으로 작성되었습니다. - 해당 자료는 국민의 알권리 보장, 유관기관 및 민간에서 공공데이터를 활용한 서비스 개발 지원을 위하여 정부의 공공데이터 운영실태평가(2020년) 시행 이전 과년도 원전 계획예방정비 현황에 대해 국민, 언론 및 유관기관 등 정보공개청구로 다수 요청되어 공개하는 자료로서 유관기관 및 민간의 세부자료로 활용에 기여할 수 있습니다.
