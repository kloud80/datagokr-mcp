summary_user: 서울 강서구 담배소매업 영업장을 건별로 담은 인허가 원장으로, 인허가일자·취소일자·영업상태·폐업일자·전화번호·지번/도로명 주소·업소명·좌표(X, Y)를 담는다. 동네 편의점·담배 가게가 아직 영업 중인지, 언제 허가받고 언제 폐업했는지를 확인하거나 강서구 내 담배소매점 분포를 살펴보려는 사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있고, 다른 자치구·업종의 지방행정 인허가(LOCALDATA) 데이터와 같은 구조로 묶어 쓴다.
description_portal: 서울특별시 강서구에서 제공하는 담배 소매업 인허가 정보를 다룬 공공데이터입니다.각 영업장의 인허가일자, 인허가 취소일자, 영업상태명, 전화번호, 지번주소 및 도로명주소 등 주요 항목을 포함하고있습니다.이를 통해 강서구 내 담배 소매업자의 영업 현황을 정확하게 파악할 수 있으며, 행정기관은 이를 기반으로 영업 허가 관리, 영업 취소 처리 추적, 영업 상태 모니터링, 민원 대응 및 신고 처리, 지역 내 소매점 분포 분석, 위생 및 규제 준수 점검, 안전·소비자 보호 정책 수립, 행정 투명성 강화 등에 폭넓게 활용할 수 있습니다. 인허가 일자 기준 최신자료로 구성되어 있어 현행성을 갖추고 있으며, 공공행정 서비스 품질 향상과 지역 상권 규제 체계 구축의 기초자료로도 활용될 수 있습니다.
