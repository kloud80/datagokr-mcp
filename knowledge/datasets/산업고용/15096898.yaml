summary_user: 서귀포시에 있는 전통시장을 시장 한 곳당 한 행으로 정리한 목록으로, 시장명·구분·도로명 주소·개설년도·대지와 매장 면적·점포 수·주차 대수·화장실·개장일·데이터 기준일을 담는다. 관광객이나 소상공인, 상권 분석가가 "서귀포시 전통시장 중 주차 공간과 점포 수가 넉넉한 곳은 어디인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시장명이나 주소를 문자열로 맞춰 이어 써야 하며, 소상공인 상가업소 원장이나 전국 전통시장 데이터와 비교할 때도 이 방식을 쓴다.
description_portal: 이 데이터셋은 2021년을 기준으로 제주특별자치도 내 서귀포시에 위치한 모든 전통시장들의 기본 정보를 체계적으로 정리한 공공 통계자료이다. 각 시장의 명칭, 도로명 주소, 매장 면적, 주차장 대수, 화장실 수 등 물리적 인프라 정보가 포함되어 있어, 시장 규모와 편의시설 현황, 접근성, 이용 환경을 종합적으로 파악할 수 있다. 이 자료는 지역 경제 활성화, 관광 및 상권 분석, 전통시장 현대화 정책 수립, 주차시설 확보와 화장실 등 공공 편의시설 보강 계획, 전통시장 기반 상권 분포 분석 등 다양한 행정 및 연구 목적의 기초 자료로 활용될 수 있다. 또한 민간 연구자나 시민, 소상공인들도 제주 남부 전통시장 인프라 현황을 객관적으로 비교·분석하는 데 유용한 데이터이다. 제공기관은 제주특별자치도이며, CSV 형식으로 누구나 다운로드할 수 있다.
