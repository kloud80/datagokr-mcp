summary_user: 한국가스안전공사에 신고된 고압가스 수입 건을 가스종류, 압축·액화 수입량, 수출국, 공급처, 용도, 신고연도별로 담은 전국 단위 파일 데이터로, 포털 설명상 2017~2023년 기간을 다룬다. 가스 업계 사업자나 분석가가 '어떤 고압가스를 어느 나라에서 얼마나 수입하고 어떤 용도로 쓰는가'를 연도별로 파악하거나 가스 안전관리 대상 수입 동향을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 가스종류·국가명 같은 이름 매핑으로만 연결한다.
description_portal: '한국가스안전공사에 신고되어 관리하고 있는 고압가스 수입신고 내역에 대한 데이터 입니다. 가스 산업계 지원을 목적으로 고압가스 수입과 관련한 가스종류, 수입량, 수출국가, 용도 등에 대한 정보를 제공합니다.고압가스 수입 관련 통계성 정보 및 가스 안전관리 업무 등에 활용할 수 있습니다. ※ 2017년부터 2023년 기간 동안 집계된 정보입니다. 공급처는 확인된 정보에 대해서만 기재되어 있습니다.※ 수시성 데이터로 현행화를 위해 추후 업데이트 예정입니다.- 데이터 기준일자 : 2023년 12월 31일'
