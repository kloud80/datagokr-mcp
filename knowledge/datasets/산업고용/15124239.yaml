description_portal: '동 데이터는 K닥터 시스템에서 이용 가능한 AI진단 사업의 매출액규모(A~F) 및 등급별 지원 현황을 나타내는 자료로, 매출액규모에 따른 AI등급별 AI진단을 완료한 기업 수를 나타내는 데이터입니다.AI진단은 재무제표 및 중소기업의 데이터를  기반으로  해당기업을 분석한 내용으로  동 데이터에서는 각 등급별로 AI진단을 완료한 기업 수를 나타낸 통계를 보여주고 있습니다.각 등급별 중소기업 수에 대해 알 수 있으며 조사기간은 2024년 1월 1일 부터 2024년 12월 31일까지의 데이터입니다.매출액규모A : 20억 미만B : 50억 미만C : 80억 미만D : 120억 미만E : 200억 미만F : 200억 이상'
