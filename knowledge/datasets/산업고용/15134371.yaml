description_portal: '중소벤처기업연구원에서 제공하는 ‘중소기업 세미나 프로그램정보’는 중소기업·벤처·소상공인 대상 교육·네트워킹 행사의 일정·주제·주최기관 등을 체계적으로 정리한 공공데이터입니다. 중소벤처기업연구원에서 주관한 최신 세미나 현황을 한눈에 파악할 수 있도록 설계되었습니다.  본 데이터셋은 중소벤처기업연구원(KOSI)에서 개최, 주관, 참여하는 중소·벤처기업 및 소상공인 관련 세미나, 포럼, 워크숍 등의 프로그램 정보를 제공합니다.국내외 중소기업 정책 트렌드, 경제 동향 분석, 규제 혁신 등 중소벤처 생태계 발전을 위한 학술 행사 데이터가 체계적으로 축적되어 있습니다.■ 주요 제공 항목  - 세미나/포럼 명칭 및 회차  - 개최 일시 및 장소 (온·오프라인 여부 포함)  - 주요 논의 주제 및 세부 세션 프로그램 구성 내용  - 발표자, 토론자 등 참여 전문가 정보  - 관련 안내 및 첨부파일(발표 자료집 등) 링크 경로 정보■ 데이터 활용성 및 기대효과  - 연구 및 학술 분야 : 중소기업 정책 연구자 및 대학(원)생들의 학술 동향 분석 및 시계열 연구 기초 데이터로 활용 가능  - 산업 및 기업 분야 : 스타트업, 중소기업 관계자들이 최신 경영 트렌드, 정부 정책 방향성, 기술 세미나 정보를 빠르게 파악하여 비즈니스 전략에 반영 가능  - 서비스 개발 분야 : 민간의 학술/행사 큐레이션 플랫폼, 매치메이킹 서비스 등과 연계하여 고부가가치 비즈니스 모델 창출 가능※ 본 정보는 중소벤처중소벤처기업연구원 대표 홈페이지(알림마당 > 세미나) 내용을 바탕으로 주기적으로 현행화됩니다.'
