summary_user: 전력시장 비용평가위원회가 의결한 발전비용 평가자료를 기준으로, 연료원별 열량단가를 월 단위로 집계해 담은 API이며 전국 범위 25건이 확인된다. 발전 연료비 수준이나 연료원별 단가 비교가 필요한 분석가나 전력시장 참여자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 연료원 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
