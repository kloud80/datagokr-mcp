description_portal: ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다. ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다.비용평가 위원회에서 심의·의결한 발전비용 평가자료를 기준으로 전월 통계치를 매월 초 갱신한 연료비용 정보월간 연료원별 열량단가 자료를 제공(비용평가위원회에서 의결한 발전비용평가자료, 비중앙급전발전기는 산정하지 않음)
