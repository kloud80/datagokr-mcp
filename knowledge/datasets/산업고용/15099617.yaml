summary_user: 전북특별자치도에 설립 신고된 노동조합을 조합 한 건씩 담은 목록으로, 행정관청·노동조합명·사업장명·설립일·조합원수·상급단체(한국노총·민주노총 등)를 담는다(CSV 파일 약 16KB). 지역 노동정책 담당자나 연구자가 '전북 지역 노동조합은 어느 상급단체에 얼마나 소속돼 있고 조합원 규모는 어떤가'를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 시도 노동조합 현황이나 전국노동조합표준데이터와는 노동조합명·사업장명 같은 이름 매칭으로만 이어 쓴다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어 사업장·산업 통계와 정확히 결합하기 어렵고, 이름 매칭에 의존해야 한다. 활용신청 없이 받는 단일 파일이며, 범위는 전북특별자치도 한 시도에 한정된다.
