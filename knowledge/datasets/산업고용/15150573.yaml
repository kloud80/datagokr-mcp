description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다__생성 및 수집목적__전기사업법 및 전력시장 운영규칙에 따라 안정적인 전력시장 및 계통운영을 위해 데이터를 생성, 수집하고 있습니다.__활용성__ㅇ 해당 데이터는 지역별 연료원별 발전설비의 설비용량정보를 확인하는데 활용 가능합니다.ㅇ 그래프와 포료 데이터를 제공하며, 데이터를 시각적으로 확인하는데 용이합니다.ㅇ 데이터를 엑셀파일 및 CSV파일로 다운로드 가능해, 원하는 포멧에 맞게 활용이 용이합니다.작성주기 : (비정기) 중앙발전기 상업운전시 또는 비중앙 계통병입일기준 100MW증가시※ 구역전기사업설비, 자가용전기설비는 설비용량 산정 제외※ 출처 : 전력거래소 수급계획팀 발전설비용량변경문서'
