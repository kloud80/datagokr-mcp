summary_user: 부산광역시 중구에서 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 파일로, 업소명·구분·도로명 주소·지정일자를 포함한다. 담배소매인 지정을 준비하는 예비 창업자가 예정지 주변에 기존 소매점이 어디에 있는지 확인하거나, 분석가가 중구 내 담배 판매점 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이을 수 있으며, 소상공인 상가업소 정보나 다른 LOCALDATA 업종 인허가 자료와 함께 보는 것이 자연스럽다.
description_portal: 「담배사업법」에 따라 지정된 부산광역시 중구 내 담배소매인의 현황을 투명하게 공개하는 데이터입니다. 본 데이터는 담배소매업의 건전한 유통 질서를 확립하고, 관련 정보를 필요로 하는 구민과 사업자에게 정확한 현황을 제공하고자 구축되었습니다.데이터에는 각 소매점의 상호명, 소재지(도로명 주소) 등의 정보를 포함하고 있어, 신규로 담배소매인 지정을 신청하려는 예비 창업자가 거리 제한 등 지정 기준을 사전에 검토하는 데 유용하게 활용할 수 있습니다.또한, 지역 내 담배 판매점의 밀집도와 분포를 분석하여 상권의 특성을 연구하거나, 청소년 보호 및 금연 정책 수립을 위한 기초자료로도 활용 가치를 지닙니다. 정기적인 정보 갱신을 통해 데이터의 최신성을 유지하여, 신뢰도 높은 참고 자료가 될 수 있도록 관리하고 있습니다.
