summary_user: 한수원이 운영하는 양수발전소 7곳(청평·삼랑진·무주·산청·양양·청송·예천)의 상·하부댐 수위, 수문 개도, 강수량 같은 수문 항목을 발전소별로 측정시간과 값으로 담는 실시간 조회 API이다. 특정 양수발전소의 현재 상·하부댐 수위나 강수량을 확인하려는 분석가·인근 주민이 "지금 이 발전소 댐 수위와 수문 개도는 어떤가"를 묻는 데 쓴다. 전역 조인 키는 없으며, 발전소 구분 코드(genName)나 발전소 이름으로 다른 발전소 원장·기상 자료와 직접 매핑해 이어 쓴다.
limits: 호출 시 발전소 구분 코드(genName)가 필수이므로 7개 발전소 코드(CP·SR·MJ·SC·YY·CS·YC)를 먼저 정해 넘겨야 한다. 다른 데이터와 공통 키가 없어 연계는 이름·코드 수작업 매핑에 의존한다. 개발계정은 하루 10,000회로 호출이 제한된다.
