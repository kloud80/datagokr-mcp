description_portal: 지하수 시공업체는 지하수 개발, 이용, 보수, 폐공 등의 업무를 전문적으로 수행하는 업체로, 「지하수법」에 따라 시·도지사 또는 시장·군수·구청장에게 등록된 전문 사업자입니다. 주요 업무는 지하수 관정(우물) 굴착, 양수 장치 설치, 관정 세척 및 보수, 지하수 수질·수량 개선, 그리고 사용이 끝난 관정의 폐공(폐쇄) 시공 등입니다. 시공 과정에서는 지하 지질 구조, 수위, 수질 특성 등을 고려하여 적절한 굴착 심도와 관재(관정재료)를 선정하며, 굴착 장비와 펌프, 배관 등의 설치를 포함합니다. 지하수 시공업체는 안전한 시공을 위해 전문 인력과 장비를 보유하고 있어야 하며, 시공 후에도 지하수의 위생과 지속 가능성을 위해 수질 검사 및 사후 관리 서비스를 제공하는 경우가 많습니다. 또한, 무허가·비전문 시공으로 인한 지하수 오염, 수량 고갈, 지반 침하 등의 문제를 예방하기 위해 법적으로 정해진 기술 기준과 환경 보호 지침을 준수해야 합니다. 이러한 업체는 농업용·공업용·생활용 등 다양한 수요에 맞춰 지하수를 안정적으로 공급하는 데 필수적인 역할을 담당합니다.
