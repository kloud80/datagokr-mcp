summary_user: 한국동서발전이 운영하거나 투자한 신재생에너지 설비를 사업 1건당 1행으로 담은 원장 파일로, 에너지원·사업명·용량(kW)·착공·준공년월·위치·투자유형을 기록하며 범위는 전국이다. 연구자나 분석가가 '동서발전의 태양광·풍력 사업은 언제, 어느 지역에, 어떤 투자 방식으로 얼마만큼의 용량이 들어섰나'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어, 다른 발전공기업의 같은 표준 데이터나 전국 태양광 발전사업 허가 표준데이터와는 사업명·위치 텍스트를 대조해 이어 쓴다.
description_portal: '한국동서발전에서 운영 중인 신재생에너지 설비(예: 당진태양광, 울산태양광, 영광지산풍력 등)에 대한 발전설비 정보 데이터입니다. 해당 데이터는 순번, 발전사명, 에너지원, 사업명, 용량(kW), 착공년월, 준공년월, 위치, 투자유형 등으로 구성되어 있으며, 각 설비의 기본 제원과 구축 시기 및 지역 분포에 대한 정보를 포함합니다.이 데이터는 신재생에너지 설비의 보급 현황, 사업 추진 시기별 패턴 분석, 지역별 투자 유형 비교 및 전력 생산 인프라 배치 연구 등에 활용할 수 있습니다. 특히 학계 및 연구기관에서는 신재생 정책 효과 평가, 발전원별 사업성 비교, 투자유형별 성과 분석 등 실증연구에 필요한 기초 데이터를 확보하는 데 유용합니다.'
