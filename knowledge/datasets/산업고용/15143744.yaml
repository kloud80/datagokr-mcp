description_portal: '본 데이터는 전통시장 실태조사를 기반으로 시도별 연도별 전통시장 상권(개소) 현황자료입니다.칼럼구성 : 지역, 2021년 ,2022년, 2023년(개소)으로 되어 있으며 전국 전통시장에 대한 연도별 실태조사 결과를 기반으로, 지역별 상권 규모와 변화 추이를 종합적으로 파악할 수 있도록 구성되어 있습니다.특히 개설 시도별 시장 개수와 개설연도,  점포 수 등의 주요 통계지표를 통해 각 지역의 상권 활성화 현황과 정책 효과 등을 비교·분석할 수 있습니다.데이터는 2021년부터 2023년까지의 시점별 전통시장 수(개소)를 포함하며, 전통시장 정책 수립, 도시재생 사업, 소상공인 지원 전략 마련 등에 활용될 수 있는 기초자료입니다.'
