summary_user: 한국가스안전공사 가스안전교육원이 운영하는 안전관리자 교육과정별 과목 목록을 담은 파일로, 과목 한 건마다 교육종류(양성·전문·특별)·법구분·과정명·총 강의일수·교육비·합격기준과 이론/실습 구분·강의시간·교육내용이 붙어 있다(csv 약 55KB, 전국 단위·비공간). 가스 안전관리자로 선임될 사람이나 사업자가 "법정 전문교육(신규·보수) 과정은 며칠이고 교육비와 합격기준은 무엇이며 어떤 과목을 몇 시간 듣는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육과정명·법구분 같은 이름을 맞춰서만 연결할 수 있다.
description_portal: '한국가스안전공사 가스안전 교육원에서 실시하는 안전관리자 교육 과정의 과목 정보를 제공합니다.(2024년 기준)교육 과정(강의 일수, 교육비, 합격기준)별 교육 과목에 대한 목록과 이론/실습 구분, 강의시간, 교육내용 정보가 수록되어 있습니다.- 2024년 기준 정보로, 교육과정 및 과목은 매년 상이할 수 있습니다.- (참고) 양성교육 : 자격증 과정, 전문교육 : 안전관리자 법정교육(신규는 최초선임 후 6개월 내, 보수는 3년 마다), 특별교육 : 관련법에 따른 별도 자격 과정- 실제 운영중인 과목에 대해서만 정보를 제공하고 있으며 업데이트는 수시 주기로 등록됩니다.- 교육과정에 관한 세부 문의는 가스안전교육원 홈페이지(kgs.or.kr/gse/index.do)를 통해 확인할 수 있습니다.- 데이터기준일 : 2024년 9월 19일'
