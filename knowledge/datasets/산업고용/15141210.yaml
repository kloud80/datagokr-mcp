description_portal: '본 데이터는 포항시 소상공인 정책자금 대출잔액 및 직접대출 부실금액 관련 자료로, 자세한 내용은 아래와 같이 안내드립니다.- 대리대출은 대출취급기관(은행)에서 채권 관리함에 따라 부실 관련 자료가 부재함을 알려드립니다. - 대리대출 및 직접대출은 누적 기준 - 부실금액(당해연도 기준) : 사고발생액 – 정상화금액 – 원금상환금액* 포항시 지역의 소상공인을 대상으로 지원된 정책자금 직접대출 관련 정보를 연도별로 정리한 자료입니다. 직접대출은 정부 또는 공공기관이 직접 대출을 지원하는 방식입니다. 각 연도의 지원 실적을 통해 소상공인 금융지원 규모의 추세를 파악할 수 있으며, 이를 기반으로 향후 정책 방향 설정이나 지역경제 분석에 활용 가능합니다. 특히 지역 내 자영업자 및 소상공인의 생존율과 자금 수요 변화를 이해하는 데 매우 유용한 통계적 자료입니다.'
