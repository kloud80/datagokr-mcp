summary_user: 경기도 하남시 안에서 사업을 개시한 태양광 발전시설을 발전소 한 곳당 한 행으로 담은 파일입니다. 상호명, 소재지 주소, 영업 구분, 원동력 종류(태양광), 데이터 기준일자가 들어 있습니다. 도시계획·조경 연구자나 시민이 '하남시 어느 동에 태양광 발전소가 몰려 있는가'처럼 시 안의 재생에너지 시설 분포를 살펴볼 때 씁니다. 전역 조인 키는 없으므로, 전국태양광발전소전기사업허가정보표준데이터 같은 다른 자료와는 상호명이나 소재지 주소를 맞춰 보는 방식으로만 연결합니다.
description_portal: '서울대학교 조경계획연구실에서 요청하신 하남시 태양광발전기 설치현황 정보를 제공합니다.본 데이터는 경기도 하남시 내 태양광 발전시설의 사업 개시 현황을 보여주는 자료로, 총 55개소의 발전소에 대해 명칭, 주소, 원동력(태양광), 데이터 기준일 등을 포함합니다. 발전소들은 감북동, 광암동, 초이동 등지에 밀집되어 있으며, 일부는 공공시설(예: 체육관, 마을회관) 옥상에 설치된 형태도 있습니다. 해당 정보는 하남시의 재생에너지 분포, 에너지 자립도 수준 분석, 저탄소 도시계획 수립, 에너지 취약지역 개선 등을 위한 기초자료로 활용 가능합니다.'
