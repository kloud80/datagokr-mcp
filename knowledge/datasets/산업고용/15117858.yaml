summary_user: 인천 부평구 관광시설에 설치된 전기차 충전기를 한 줄씩 담은 파일로, 운영기관·충전소명·충전기ID·급속/완속 구분·시설구분·주소·이용가능시간·충전용량(kW)을 기록한다(CSV 636바이트의 소규모 시군구 단위 원천 목록). 부평구 관광지를 찾는 전기차 이용객이 어느 시설에서 몇 시에 급속 충전이 가능한지 확인하거나, 구 담당자가 관광시설별 충전 인프라 분포를 점검하는 데 쓴다. 전역 조인 키는 없어서, 다른 충전소·관광지 데이터와는 주소나 충전소명 매칭으로만 잇는다.
limits: 충전기 실시간 상태나 이용 실적은 없고 설치 현황만 담는다. 부평구 관광시설만 대상으로 하는 아주 작은 파일이라 지역 전체 충전 인프라를 대표하지 않는다. 공통 식별 키가 없어 전국 충전소 데이터와 연결하려면 이름·주소를 직접 맞춰야 한다.
