description_portal: 집단에너지란 열병합발전소, 열전용보일러, 자원회수시설 등 집중된 대규모 시설에서 열 또는 열과 전기를 생산하여 다수의 사용자에게 효율적으로 일괄 공급하는 방식의 에너지 공급사업입니다.개별 사용자는 별도의 개별 에너지 생산설비를 설치하지 않고, 이러한 집중된 시설로부터 생산된 에너지를 공급받아 난방, 냉방, 급탕 등의 목적으로 활용할 수 있습니다.본 데이터는 집단에너지 공급 현황과 시설 정보, 지역별 사업자 및 공급 범위, 생산 및 소비량 등 집단에너지 사업에 대한 주요 통계를 제공하여, 연구기관과 정책 입안자는 물론 관련 기업과 지역사회에서 에너지 효율성 제고, 지역 에너지 정책 수립 및 에너지 이용 현황 분석을 위한 기초자료로 폭넓게 활용할 수 있습니다.편람의 목차는 집단에너지사업의 개요, 추진현황, 운영실적, 현황자료, 관련통계, 공급대상 지정현황 및 주소록으로 구성되어 있습니다.
