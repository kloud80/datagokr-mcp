description_portal: 중소기업기술정보진흥원에서 제공하는 '중소기업기술개발지원사업 사업화성과 정의 및 증빙자료 정보' 데이터는 R&D 지원사업을 통해 달성된 사업화 성과를 측정하고 검증하는 데 필요한 기준과 절차를 안내하는 핵심 자료입니다. 이 데이터는 성과를 사업화성과 대구분과 사업화성과 소구분으로 체계적으로 분류하여, 다양한 유형의 성과를 명확하게 정의합니다. 특히 사업화성과 정의 컬럼은 각 성과 항목이 구체적으로 무엇을 의미하는지 설명하여 평가 기준의 일관성을 확보합니다. 또한, 기업들이 성과를 인정받기 위해 제출해야 하는 증빙자료의 목록과 해당 자료를 확인하는 방법에 대한 구체적인 지침을 제공합니다.
