description_portal: '○ 통계개요* 통계명 : 취업시간별 취업자* 통계종류 : 취업자 현황을 취업시간별로 제공하는 조사·지정통계(승인번호 10104)* 작성목적 : 국민의 경제활동 즉, 국민의 취업, 실업 등과 같은 특성을 조사하여거시경제분석과 인력자원의 개발정책 수립에 필요한 기초자료를 제공* 조사체계 : 조사원 →지방통계청(사무소)→통계청* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울시 취업시간별 취업자수 및 평균취업시간○ 용어설명* 취업자 : ① 조사대상주간에 수입을 목적으로 1시간 이상 일한 자② 동일가구내 가구원이 운영하는 농장이나 사업체의 수입을 위하여 주당 18시간이상 일한 무급가족종사자③ 직업 또는 사업체를 가지고 있으나 일시적인 병 또는 사고, 연가, 교육, 노사분규등의 사유로 일하지 못한 일시휴직자* 일시휴직 : 직업 또는 사업체를 가지고 있으나 조사대상 주간에 일시적인 병,일기불순, 휴가 또는 연가, 노동쟁의 등의 이유로 전혀 일하지 못한 경우일시휴직 사유가 해소되면 즉시 복귀 가능하여야 함○ 기 타* 통계표에 수록된 자료는 반올림되었으므로 전체 수치와 표내의 합계가 일치되지않는 경우도 있을 수 있음'
