description_portal: 본 자료는 우리나라 플랫폼종사자의 규모를 추정하고 이들의 근무 실태를 파악하기 위해 2021년 8월 실시된 「2021년 플랫폼종사자 규모추정과 근무실태」 조사 결과 중 마이크로데이터에 해당합니다. 본 조사는 전국의 15세에서 69세 인구 약 5만 명을 표본으로 무작위 추출하여 실시되었으며, 그 중 플랫폼을 매개로 노무를 제공하는 것으로 식별된 976명의 응답 데이터를 공개하였습니다. 해당 마이크로데이터는 플랫폼 종사자의 일 배정 방식, 소득 구조, 노동시간, 안전 및 보호 제도 등의 기초 근무환경을 분석하는 데 활용될 수 있습니다. 수치는 조사 방식에 따라 타 기관 자료나 언론 보도와 차이가 있을 수 있으며, 자세한 분석 내용은 한국고용정보원 누리집에 게시된 연구보고서 「플랫폼종사자 규모와 근무실태」를 통해 확인할 수 있습니다.
