description_portal: 전북특별자치도 정보통신공사업체 등록현황을 개방하여 데이터 수요자에게 제공하고자 합니다.    이 데이터는 정보통신공사업체로 등록된 업체의 상호명, 주소, 등록일자, 최종수정일 항목으로 구성되어 있습니다. 정보통신공사업이란 정보통신 설비의 설치, 유지, 보수 및 운영을 담당하는 사업을 의미하며, 네트워크구축, 방송통신 시설, 데이터 센터 인프라 구축 등 다양한 분야를 포함하며, 정보통신망의 안전성과 신뢰성을 확보하기 위해 국가에서 일정한 등록 기준을 요구하고 있습니다. 자세한 사항은 도 행정정보과 280-3133으로 문의하여 주시기 바랍니다.
