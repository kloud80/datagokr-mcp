summary_user: 태양광 대여사업에 참여하는 민간 대여사업자별로 사업자명, 협력사명, 전화번호, 지역을 담은 전국 단위의 작은 명부 파일(CSV 약 4.7KB)이다. 초기 비용 없이 지붕 태양광을 대여로 설치하려는 주민이 '우리 지역에서 상담할 수 있는 대여사업자와 협력사는 어디인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업자명이나 지역명을 직접 맞춰 이어야 하며, 발전소 단위 원장인 전국태양광발전소전기사업허가정보표준데이터와는 이 방식으로만 대조할 수 있다.
description_portal: 신재생에너지 태양광 대여사업은 소비자가 초기 투자 비용 부담 없이 민간기업이 직접 태양광발전설비를 설치, 운영 및 관리하는 민간주도의 신재생에너지 보급 사업입니다.이를 통해 소비자는 합리적인 비용으로 친환경 에너지를 사용할 수 있으며, 국가적으로는 신재생에너지 산업 육성 및 온실가스 감축 목표 달성에 기여합니다.본 데이터는 해당 사업에 참여하는 민간기업의 대여사업자명, 협력사명, 전화번호, 지역 정보를 제공하며,소비자와 연구기관, 기업 등 다양한 이해관계자가 사업 참여기업을 파악하고 에너지 관련 시장분석과 정책 연구에 활용할 수 있습니다.
