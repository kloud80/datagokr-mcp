description_portal: '○ 통계개요* 통계명 : 경력단절여성* 통계종류 : 서울시 경력단절여성 현황를 제공하는 일반?조사통계* 통계목적 : 경력단절 여성의 경력단절 방지 및 재취업지원정책 수립에 기초자료로 활용* 조사체계 : 조사대상→ 지방통계청(사무소) → 통계청* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 미취업여성 및 경력단절여성 비율 등○ 용어설명* 경력단절여성 : 15~54세의 기혼여성 중 현재 비취업인 여성으로 결혼, 임신 및 출산,육아, 자녀교육(초등학교), 가족돌봄 때문에 직장을 그만둔 여성- 육아 : 미취학 자녀를 돌보는 일- 자녀교육 : 초등학생 자녀 교육에 한함- 가족돌봄 : 가족(부모, 배우자, 자녀, 배우자의 부모)의 병간호를 의미함* 비취업여성 : 현재 일을 하고 있지 않은 여성으로 실업자와 비경제활동인구를 말함○ 기 타* 매년 상반기(4월)에 실시하는 지역별고용조사로, 경력단절여성 현황은 15-54세의기혼여성 중 현재 취업 중이 아닌 직장을 그만둔 경력단절여성을 조사한 결과임* 2014년부터 경력단절 사유에 "가족돌봄"이 포함되어 2013년(가족돌봄 제외) 자료와비교시 유의* 2015년 인구총조사(등록센서스) 결과를 토대로 소급작성된 추계인구의 변경을 반영하여2011년부터 2017년까지의 자료를 변경하였음'
