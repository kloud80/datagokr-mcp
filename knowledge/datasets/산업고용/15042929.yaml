summary_user: 경상남도 시·군별로 전체 가구수, 도시가스를 공급받는 보급 가구수, 보급률(퍼센트)을 데이터 기준일과 함께 담은 시군구 단위 집계 파일(csv, 684바이트)이다. 경남의 어느 시·군이 도시가스 보급률이 낮아 배관망 확충이 필요한지 비교하려는 분석가나 행정 담당자가 쓴다. 전역 조인 키가 없어 시군명을 행정구역 코드나 다른 시군별 통계(인구·에너지 사용량 등)의 지역명과 이름으로 맞춰 연결해야 한다.
description_portal: 경상남도 내 도시가스 보급 현황은 시·군별로 가구 규모와 공급률을 한눈에 파악할 수 있도록 정리된 통계 정보입니다. 각 시·군의 전체 가구수와 실제로 도시가스를 공급받는 보급 가구수를 기준으로 보급 비율을 산출하여 지역별 에너지 이용 수준을 비교할 수 있도록 구성됩니다. 또한 이러한 자료는 최신성을 확보하기 위해 데이터 기준일을 명시하여 제공되며, 이를 통해 정책 수립, 기반시설 확충 계획, 지역 간 불균형 해소 등을 위한 기초 자료로 활용됩니다. 이러한 시·군별 도시가스 보급 통계는 경상남도 에너지 행정의 중요한 참고 지표로서, 주민 생활 여건 개선과 안전한 도시가스 공급 체계 구축을 지원하는 데 기여합니다.
