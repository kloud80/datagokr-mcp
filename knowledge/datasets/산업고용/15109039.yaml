summary_user: 제주지역 플러스 DR(전력 수요 증대 요청)의 2021~2023년 실적을 증대일별로 담은 파일로, 기준출력 제어량·증대시간·입찰량·낙찰량·증대량(MWh)·제주SMP·증대 이행률이 들어 있다. 에너지 분석가나 수요자원 사업자가 '제주에서 재생에너지 출력제어를 줄이려고 수요를 늘린 날, 낙찰량 대비 실제 증대량과 이행률은 얼마였나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·월일 같은 날짜 값이나 같은 기관(전력거래소)의 제주 SMP·출력제어 자료와 날짜로 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 2021~2023년까지의 제주지역 플러스 DR 기준출력 제어량, 증대일, 요일, 증대시간, 입찰량, 낙찰량, 증대량, 제주SMP, 증대 이행률을 보여줍니다.증대량은 계량값 오류 정정 등으로 인한 수정정산 발생 시 변경될 수 있습니다.단위 : MWh'
