summary_user: 대구광역시 남구 관내에서 공장등록증을 보유한 제조업체 47곳의 회사명·도로명 주소·연락처·위도·경도를 업체 한 곳당 한 행으로 담은 목록 파일이다. 지역 구직자나 거래처를 찾는 사업자가 '남구에 공장 등록된 제조업체는 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 관내 제조업체 분포를 지도에 찍어 보는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자등록번호 등)가 없어 다른 데이터와는 회사명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 해당 데이터는 대구광역시 남구 관내 주요 기업체(제조업을 영위하며 공장 등록 허가를 통해 공장등록증을 보유한 업체)에 대한 자료입니다. 해당 자료는 회사명, 소재지(도로명 주소), 사업장 연락처, 위도 그리고 경도 등의 항목을 제공합니다. 해당 자료에 등록된 기업체 수는 총 47개이며 모든 업체가 공장 등록 처리가 되어 있는 제조업체들 입니다. 관내 모든 제조업을 영위하는 사업장 리스트는 아니며 제조업체 중 등록 요건을 갖춰 공장 등록 신청을 통해 등록 허가를 받아 공장등록증을 보유한 업장만을 포함하는 자료입니다.
