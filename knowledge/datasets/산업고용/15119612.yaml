summary_user: 한국남동발전이 운영하는 발전소의 수질오염물질 배출 실적을 사업소·호기·오염물질 항목별 평균값으로 담는 API이며, 범위는 전국 비공간 데이터다. 환경단체나 연구자가 '특정 발전소의 방류수 오염물질 농도가 기간별로 어떻게 변했는가'를 확인하거나 규제 준수 여부를 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 사업소코드(orgNo)와 항목코드를 기준으로 같은 기관의 대기오염물질·석탄재 배출 데이터나 주변 기상 측정 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 해당 데이터는 한국남동발전이 운영하는 각 발전소에서 배출하는 수질오염물질의 일일 실적 현황을 제공하는 공공 데이터입니다. 발전소의 냉각수나 폐수를 정화 처리한 후 방류하는 과정에서 발생하는 오염물질의 농도를 공개한 자료이며, 기관의 친환경 상태를 보여주는 중요한 지표입니다. 사업소별, 오염물질 항목 코드별로 배출 실적을 제공하여 환경 단체나 연구 기관에서는 이 데이터를 활용하여 발전소가 주변 수생태계에 미치는 영향을 모니터링하고, 정부의 환경 규제 준수 여부를 감독하는 데 활용될 수 있습니다.
