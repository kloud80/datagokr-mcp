summary_user: 인천 서구(서해구)에 등록된 중고자동차 매매업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 상호명·소재지(주소)·전화번호와 데이터기준일자를 담는다. 중고차를 사려는 주민이 동네 매매상사를 찾거나, 분석가가 서구 안 중고차 매매업체가 어디에 몰려 있는지 상권 분포를 볼 때 쓴다. 전역 조인 키가 없어 상호명이나 주소 문자열로 맞춰야 하며, 주소를 지오코딩해 지방행정 인허가(LOCALDATA) 자동차매매업 자료나 소상공인 상가업소 정보와 이어 본다.
description_portal: 본 공공데이터는 인천광역시 서구에 등록된 중고자동차 매매업체 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 중고자동차 매매업체의 상호명, 소재지, 전화번호 항목을 제공하고 있습니다. 본 공공데이터를 통하여 인천광역시 서구 내 중고자동차 매매업체의 현황을 알아볼 수 있으며 이를 통하여 지역 자동차 산업의 규모 분석, 상권 분포 파악 등 관련 정책 수립에도 활용 가능할것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
