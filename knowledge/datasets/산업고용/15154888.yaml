description_portal: 본 데이터셋은 지원교육 제도의 운영·관리 현황을 체계적으로 기록한 관리 데이터로, 지원교육의 기준, 대상, 교육 진행 방식, 필수 이수 체계, 강사 운영 및 만족도 등 제도 운영 전반을 포괄하고 있습니다. 지원교육관리기준 항목을 중심으로 각 지원교육이 어떤 기준과 절차에 따라 운영되는지 확인할 수 있으며, 교육대상 및 교육분류 정보를 통해 지원교육 참여자의 범위와  교육 진행방식을 파악할 수 있습니다.또한 과정·과목 단위의 필수수강 여부를 포함하여 지원교육 강사의 교육 이수 구조와 의무 수준을 관리할 수 있게 하며, 강사풀 정보는 지원교육 수행을 위한 강사 자원 구성 및 배치 현황을 나타냅니다. 아울러 최소교육만족도 데이터를 통해 평균 만족도 점수가 지원교육 최소 기준을 초과하는 강사만 교육을 진행할 수 있도록 관리함으로써, 지원교육의 질을 안정적으로 확보할 수 있습니다.본 데이터는 지원교육 제도의 운영 실태를 투명하게 공개하고, 지원교육 정책의 적정성 검토, 대상별 지원 체계 개선, 강사 자원 관리 및 교육 서비스 품질 향상 등 제도 기반의 교육 운영 고도화에 필요한 핵심 참고자료로 활용될 수 있습니다.
