summary_user: 한국가스공사 5개 LNG 생산기지(평택·인천·통영·삼척·제주)의 생산능력과 설비용량을 항목(구분)별로 기지 열에 나란히 정리한 소규모 현황표(CSV 약 1KB)로, 건별 원천이 아닌 요약 집계다. 에너지 분석가나 정책 담당자가 '어느 기지의 저장·기화 설비용량이 가장 크고, 기지 간 생산능력 균형은 어떤가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 가스 공급·판매량 데이터와는 기지 이름을 직접 매핑하거나 같은 기관(한국가스공사) 데이터끼리만 이어 쓴다.
description_portal: 한국가스공사 생산기지의 종합 현황을 체계적으로 정리한 데이터 입니다.생산기지 인프라 현황 파악 및 설비 운영 계획 수립, 생산능력 관리, 설비 투자 계획 수립을 목적으로 수집되었습니다. 데이터 구성항목은 평택기지, 인천기지, 통영기지, 삼척기지, 제주기지별 생산능력 및 설비용량 등의 정보로 이루어져 있어 각 기지의 인프라 현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 기지별 생산능력 비교 분석, 설비용량 대비 가동률 평가, 설비 확충 필요성 검토, 예비 생산능력 확보 현황 파악이 가능합니다.또한 기지간 생산능력 균형 분석, 노후설비 교체 계획 수립, 수요 증가 대비 설비 확충 계획, 설비 현대화 우선순위 결정에 활용됩니다. 생산기지 증설 계획 수립, 기지간 생산량 배분 최적화, 설비투자 우선순위 결정 등 생산기지 운영 기획 및 평가에 직접 활용되어 안정적인 천연가스 공급체계 구축을 지원합니다.
