summary_user: 장애인 고용 현장에서 수행되는 직무를 고용노동부 취업알선직업분류를 바탕으로 정리한 표준 분류 코드 마스터로, 직종 단위로 직종코드·직종명·직종레벨을 담으며 범위는 전국·비공간이다. 장애인 채용을 검토하는 사업주나 취업지원 담당자가 '이 직종이 장애인 적합직무로 분류되는지, 어느 수준의 분류인지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 장애인 구인 공고·직업훈련·직업사전 같은 다른 데이터와는 직종코드나 직종명을 매핑해야 이어 쓸 수 있다.
description_portal: 장애인 고용직무분류체계 데이터는 산업별·특성별 장애인 적합직무를 개발하고 , 개발된 직무의 확산을 통해 장애인의 일자리를 확대 도모하기 위해 장애인 고용 현장에서 수행되는 직무를 체계적으로 정리한 표준 분류 정보입니다.장애인 고용직무는 고용노동부 취업알선직업분류를 바탕으로 만들어졌으며, 장애인 고용직무분류는 직종코드, 직종명, 직종레벨, 수행업무, 유사직무명,주의사항 등의 항목이 포함되어 있습니다.상세한 장애인 적합 직무개발 사업에 관한 내용은 공단 대표홈페이지(www.kead.or.kr)에서 확인 가능합니다.
