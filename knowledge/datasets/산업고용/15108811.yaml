summary_user: 수원시 행정동별로 전기에너지 사용량(kWh)의 월별 최소·최대·합계·평균을 정리한 집계 파일이며, 포털 설명상 2019~2021년을 다룬다. 수원시 연구자나 정책 담당자가 '어느 행정동에서 여름철 전력 사용이 가장 많이 늘었나' 같은 동별·월별 비교 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동명·행정동코드를 이름이나 코드로 맞춰 행정동 단위 인구·건물 통계 등과 이어 쓴다.
description_portal: '수원시의 2019년, 2020년, 2021년 전기에너지에 대한 행정동 단위 월별 및 연간 최소, 최대, 합계, 평균 에너지 사용량(단위 : kwh) 데이터를 제공합니다.'
