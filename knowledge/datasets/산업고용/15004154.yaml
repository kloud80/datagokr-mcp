summary_user: 한국남부발전이 추진 중이거나 완료한 발전소 건설 프로젝트를 사업별로 한 행씩 정리한 소규모 파일(csv 445바이트)로, 프로젝트명·사업명·위치·설비용량·착수연월·준공연월을 담는다. 국민이나 에너지 정책 분석가가 '남부발전의 신규 복합화력 발전소가 어느 지역에 몇 MW 규모로 언제 준공되는가'를 확인하는 데 쓴다. 공통 조인 키는 없으므로 위치(지역명)나 사업명을 기준으로 태양광 발전사업 허가 표준데이터 등 다른 발전설비 원장과 이름 매칭으로 이어 쓴다.
description_portal: 이 데이터는 한국남부발전이 추진 중이거나 완료한 발전소 건설 현황을 정리한 자료입니다. 각 프로젝트별로 사업명, 위치, 설비용량(MW), 착수 시기, 준공 예정일 또는 완료일이 포함되어 있어 발전소 건설의 전반적인 진행 상황을 확인할 수 있습니다. 신세종복합, 하동복합, 안동복합 등 주요 프로젝트들이 포함되어 있으며, 이는 국가 전력 수급 안정과 에너지 인프라 확충에 중요한 역할을 합니다. 본 데이터를 통해 국민은 대규모 에너지 인프라 사업이 어느 지역에서 언제 진행되는지를 이해할 수 있고, 연구자와 정책 담당자는 발전소 건설 일정, 설비 용량 변화, 전력 공급 확대 효과 등을 분석하는 데 활용할 수 있습니다. 또한 향후 에너지 정책 수립과 전력 인프라 투자 전략 마련에도 기초 자료로서 활용 가치가 큽니다.
