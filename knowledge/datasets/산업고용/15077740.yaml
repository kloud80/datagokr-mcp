summary_user: 근로복지공단 경인지역본부 관할(경기·인천) 소속기관(지사)별로 2020년 업무상 질병 산재의 총 신청·승인 건수와 근골격계·뇌심혈관·정신질병·직업성암·기타질병 5개 유형별 신청·승인 건수를 집계한 통계 파일이다. 산업보건 분석가나 정책 담당자가 '경기·인천 어느 지사 관할에서 근골격계나 정신질병 산재 승인 건수와 승인 비율이 높은가'를 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 지사명(구분)을 이름으로 맞추거나 같은 기관의 다른 지역본부 자료와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
limits: 지사 단위 연간 집계라서 개별 재해 건, 업종, 사업장 단위 분석은 할 수 없다. 범위 메타데이터는 '전국·비공간'으로 되어 있지만, 실제 내용은 경기·인천 관할 지사에 한정된 2020년 한 해 자료다. 표준 행정코드가 없으므로 지역 통계와 연결할 때는 지사 관할 구역을 직접 매핑해야 한다.
