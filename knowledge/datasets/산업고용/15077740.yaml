description_portal: '이 데이터는 2020년 기준으로 근로복지공단 경인지역본부 관할 지역(경기 및 인천) 내 각 지사별로 집계된 업무상 질병 산재 승인 현황 통계 자료입니다. 통계 항목은 총 신청 건수 및 승인 건수는 물론, 질병 유형별로 근골격계 질병, 뇌심혈관계 질병, 정신 질병, 직업성 암, 기타 질병 등 5가지 주요 질병 항목에 대한 신청 및 승인 건수를 상세하게 제공합니다. 이 자료는 수도권의 주요 산업 지역인 경기·인천 지역 근로자들이 겪는 업무상 질병의 발생 패턴과 공단 지사별 산재 인정 실태를 명확하게 보여줍니다. 특히, 근골격계 질병이나 정신 질병과 같은 주요 질병의 지역별 취약성을 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 지역별 산업 보건 정책 및 근로자 건강 증진 사업의 효과 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 지사 관할 지역(예: 제조업 밀집 지역)에서 근골격계 질병이나 직업성 암 승인 건수가 높게 나타나는 이유를 분석할 수 있습니다. 이를 통해 해당 지역의 사업장을 대상으로 한 특화된 직업병 예방 교육 및 관리 감독을 강화할 수 있습니다. 또한, 정신 질병 승인 건수를 분석하여 근로자의 심리적 건강 문제에 대한 공공 지원의 필요성을 진단하고, 지사별로 산재 행정 처리의 일관성을 점검하는 데 기여할 수 있다고 판단됩니다.'
