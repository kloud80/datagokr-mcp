description_portal: '이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터 JDC에서 운영하는 JDC지정면세점의 물류 및 에이전트 관련 정보를 2016년 4월 기준으로 정리한 자료입니다. 각 데이터 항목은 협력업체명, 상품군, 품종, 브랜드명, 최초 입점일자, 입점일자, 퇴점일자, 조건변경일, 조건기준, 거래조건, 결제조건, 공급통화, 결제통화, 세무코드, 선적지, 운송수단 등으로 구성되어 있으며, 협력업체명은 면세점 내 상품을 공급하는 기업명, 브랜드명은 각 업체가 취급하는 상표명을 나타냅니다. 상품군은 수입, 환급대상상품, 국산으로 구분되어 있어 면세점 내 상품의 유형을 파악할 수 있으며, 조건변경일과 조건기준, 거래조건, 결제조건 항목은 상품 거래 및 정산 방식과 관련된 주요 기준을 설명합니다. 공급통화와 결제통화는 각 계약의 통화 단위를 나타내며, 세무코드는 세무 구분을 위한 코드값, 선적지는 물류 출발지, 운송수단은 상품 이동 방식(예: 해상, 항공 등)을 의미합니다. 이 데이터는 면세점 운영과 공급망 관리, 거래관계 분석, 물류 프로세스 점검 등 다양한 행정적, 실무적 활용에 적합한 자료입니다.'
