summary_user: 한국중부발전의 발전소별 개별 호기 단위로 설비용량(킬로와트)과 연간발전량을 정리한 집계 파일로, 데이터 기준일·발전소·호기·설비용량·연간발전량 다섯 항목을 담은 작은 CSV(약 3KB)다. 분석가나 에너지 정책 담당자가 "중부발전의 어느 호기가 설비용량 대비 실제 발전량이 낮은가" 같은 설비 활용률·가동률 비교 질문에 쓴다. 전역 조인 키가 없어 다른 발전공기업의 같은 표준 발전실적 파일이나 발전소 원장과는 발전소명·호기 이름을 맞춰서만 이어 쓴다.
description_portal: 본 데이터는 (발전공기업 표준)발전실적 정보 한국중부발전의 발전소별 개별 호기 단위로 설비용량과 연간 발전량을 정리한 자료입니다. 항목은 발전소, 호기, 설비용량, 연간발전량으로 구성되어 있으며, 설비용량의 단위는 킬로와트, 연간발전량의 단위는 메가와트입니다. 설비용량은 발전기가 낼 수 있는 최대 전력량을 의미하며, 연간발전량은 실제 운전 결과에 따른 연간 총 발전 전력을 나타냅니다. 이 (발전공기업 표준)발전실적 정보 데이터는 발전설비의 활용 효율 분석, 가동률 비교, 설비운영 계획 수립, 에너지 생산 능력 진단 등에 활용 가능합니다.
