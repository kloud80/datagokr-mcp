summary_user: 1989년 1월부터 2019년 11월까지 서울·경기·부산 등 17개 시도의 도시가스 판매량을 월별로 집계한 파일 데이터로, 단위는 천㎥이며 연월 한 행에 시도별 값이 열로 나열된다. 에너지 분석가나 지역 정책 담당자가 '우리 시도에 천연가스가 언제부터 공급됐고, 판매량이 계절·연도별로 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 지역 통계와 이으려면 시도 이름을 행정구역 코드에 직접 매핑하고 연월로 맞춰 붙인다.
