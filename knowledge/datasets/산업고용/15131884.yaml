summary_user: 한국전력공사 수요관리정보시스템에 등록된 고효율 LED 승인기기를 모델 단위로 담은 원장으로, 승인번호·업체코드·모델명·용량·기기종류상세를 담는 전국 범위 CSV 파일(약 500KB)이다. 조명 교체 사업을 기획하는 사업자나 분석가가 "설치 환경에 맞는 용량의 승인된 고효율 LED 모델이 무엇인가"를 확인하거나 절감 효과·비용 비교의 후보 목록을 만들 때 쓴다. 업체코드(kepco_dsm_vendor_cd)와 승인번호(kepco_dsm_approval_no)가 조인 키로 확인되어, 같은 한전 수요관리정보의 업체 정보나 승인 내역 데이터와 이어 쓴다.
description_portal: 한국전력공사 수요관리정보시스템에서 관리하고 있는 고효율LED 승인기기 종류 데이터 입니다. 고효율 LED 모델명, 용량 및 기기종류 세부사항 등을 확인하실 수 있습니다.파일은 기기식별코드, 업체코드, 승인번호, 모델명, 용량, 기기종류상세 항목으로 이루어져 있습니다.해당 데이터를 통하여 에너지 절감 계획 수립이나 조명 교체 사업을 기획하는 등에서 설치 환경과 용량을 고려하는데 도움을 줄 수 있습니다.또한 에너지 절감 효과 시뮬레이션이나 비용 효율 비교에 활용 할 수 있을 것이라고 생각합니다.
