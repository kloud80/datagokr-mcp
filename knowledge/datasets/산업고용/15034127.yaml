summary_user: 광주 남구 관내 태양광발전소를 발전소 한 곳당 한 행으로 담은 허가 원장 파일로, 허가일자·사업개시일자·상호·소재지·용량(kW)·공급전압·설치면적·지목·설치위치를 담는다(CSV 약 15KB, 범위는 시군구 단위의 개별 주소). 남구에 어떤 태양광발전소가 어디에 얼마 용량으로 허가돼 가동 중인지, 아직 사업 준비 단계인 곳은 어디인지 확인하려는 주민·투자 검토자·지자체 담당자가 쓴다. 전역 조인 키는 없으므로 전국태양광발전소전기사업허가정보표준데이터 등 다른 원장과는 상호명·소재지 주소를 맞춰 이어 쓴다.
description_portal: 광주광역시 남구 관내에 위치한 태양광발전소 설치 · 허가 현황 및 정보(발전소명, 허가일자, 사업개시일자, 설비허가 용량, 발전소 소재지, 공급전압, 설치면적 및 위치 등)의 정보를 제공합니다. 사업 준비 중인 태양광 발전소들의 경우, 사업개시일자에 '사업준비중' 명시하였음을 알려드리오니, 데이터 이용 시 참고하시기 바랍니다. 해당 데이터는 광주광역시 남구청 탄소중립과(☎062-607-3664)에서 제공합니다. 아울러, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 태양광발전소란 태양 전지를 사용하여 태양의 빛을 직접 전기 에너지로 바꾸는 시설이 설치되어 있는 발전소로, 전 세계적으로 재생에너지 전환의 핵심축으로 자리 잡고 있습니다. 해당 데이터는 지자체가 발전사업 인허가 관리, 지역별 발전 가능 용량 분석, 탄소중립 관련 정책 수립 등에 활용할 수 있으며, 민간에서는 투자 검토, 발전소 위치 기반 지도 서비스, 전력 생산량 예측 모델링의 기초자료로 응용될 수 있어 공공·민간 모두에서 활용 가치가 높은 정보가 될 것으로 보입니다.
