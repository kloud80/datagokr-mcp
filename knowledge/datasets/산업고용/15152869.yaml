description_portal: 동 데이터는 중소벤처기업진흥공단 정책자금 중 하나인 신성장기반지원자금의 내역 사업인 스케일업금융(자산유동화증권, PCBO 지원형태) 2025년 지원업체 중 초격차, 신산업 분양에 해당되는 기업에 대한 지원금액, 건수 비중 등의 데이터를 제공합니다. 스케일업금융은 혁신성장 가능한 중기업의 대규모 자금조달 애로를 해소하여 스케일업을 지원(P-CBO 방식) 함으로써 중견기업으로의 도약을 지원하는 사업이며, 중소기업진흥에 관한 법률 제66조에 근거하고 있습니다. 2024년 스케일업금융의 예산은 1,000억이며, 총 112개사를 지원했습니다.
