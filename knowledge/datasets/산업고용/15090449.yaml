description_portal: 본 데이터는 (주)한국가스기술공사의 소상공인 고용보험료 지원 내역을 연도별로 정리한 자료입니다. 대전광역시를 지원대상 지역으로 하여 2020년부터 2023년까지 매년 동일하게 50개 기업을 선정·지원하였으며, 각 기업은 3개월간 고용을 유지하는 조건으로 기업당 500,000원의 고용보험료 지원을 받았습니다. 지원기업수, 고용유지인원, 지원금액 등 항목이 포함되어 있어, 연도별 지원 규모와 정책의 지속성을 확인할 수 있습니다. 해당 자료는 소상공인 경영 안정, 고용 유지율 제고, 지역 경제 활성화를 위한 정책 효과 분석, 향후 지원사업 계획 수립, 예산 편성 근거 마련 등에 활용될 수 있습니다.
