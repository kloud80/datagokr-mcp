summary_user: 서울 강서구에 있는 대형마트·백화점·복합쇼핑몰 같은 대규모점포의 인허가 내역을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터이다. 인허가·취소·폐업·휴업 일자, 영업상태, 사업장명, 지번·도로명 주소, 전화번호, 면적, 업태, 좌표(X·Y)가 들어 있다. 강서구 안에서 현재 영업 중인 대규모점포가 어디에 있고 언제 문을 열거나 닫았는지 알고 싶은 상권 분석가나 창업 예정 사업자가 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 사업장명·주소로 매칭하거나 같은 기관 코드(OPNSFTEAMCODE)와 관리번호(MGTNO)로만 다른 인허가 데이터와 이어 쓴다.
description_portal: 서울특별시 강서구에 위치한 대규모점포에 대한 인허가 정보를 포함하는 데이터로, 주로 대형마트, 백화점, 복합쇼핑몰과 같이 일정 규모 이상으로 운영되는 유통매장을 대상으로 합니다. 이 데이터에는 인허가일자, 사업장명, 주소, 전화번호, 영업상태 등의 주요 항목이 포함되어 있으며, 유통산업발전법에 따라 일정 기준을 충족한 업체에 한해 인허가를 받아 운영됩니다. 대규모점포는 지역경제 및 소비자 생활에 큰 영향을 미치는 유통 거점으로, 해당 데이터는 상권 분석, 유통정책 수립, 도시계획, 소비 패턴 분석 등에 활용될 수 있습니다. 또한 중소상공인 보호 정책 수립 시 참고자료로도 유용하며, 유통 구조의 변화와 지역 내 상업시설의 분포를 이해하는 데 필요한 기초자료로 쓰입니다. 강서구청 및 관련 행정기관의 상권 관리 정책 수립에도 활용됩니다.
