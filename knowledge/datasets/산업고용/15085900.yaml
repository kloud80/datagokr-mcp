summary_user: 월드잡플러스에 등록된 해외연수 과정을 과정 단위로 담으며, 과정명(strnCrseNm)·운영기관·연수 국가와 장소·연수 기간·모집 시작과 종료일·합격자 발표일·연수 업종과 직종·연수 목적을 포함하고 범위는 전국·비공간입니다. 해외취업을 준비하는 구직자가 '지금 모집 중인 특정 국가·직종 해외연수 과정이 무엇이고 언제 신청하나'를 확인하거나, 분석가가 국가·직종별 연수 과정 현황을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명·직종명 같은 이름 매핑이나 같은 기관(한국산업인력공단) 데이터로만 이어 쓴다.
description_portal: 한국산업인력공단 월드잡플러스에서는 해외진출 및 취업 지원을 위해 해외연수 과정 정보를 제공합니다. 이 데이터는 각 연수 과정의 명칭, 과정 기간, 모집 일정, 연수 대상, 연수 장소 등 세부 항목을 포함하고 있어, 구직자들이 자신에게 적합한 해외연수 프로그램을 쉽게 확인하고 선택할 수 있도록 돕습니다. 또한, 연수 과정별로 제공되는 내용과 지원 조건이 명확하게 정리되어 있어, 연수 준비와 신청에 필요한 정보를 한눈에 파악할 수 있습니다. 이러한 데이터는 연수 프로그램의 현황을 체계적으로 관리하고, 맞춤형 지원 정책 수립 및 참여자 안내에 활용됩니다.
