description_portal: 한국가스공사가 제공하는 월별 일평균 천연가스 생산량 데이터는 국내 천연가스 생산량 현황을 파악할 수 있는 기초 자료입니다. 본 데이터는 월 단위로 집계된 전국의 LNG터미널에서 생산한 천연가스 생산량을 일 단위 평균한 값으로, 계절별 또는 월별 생산 패턴을 파악할 수 있는 자료입니다. 해당 데이터는 월별 전국 천연가스(LNG) 일평균 생산량을 나타낸 자료이며, 데이터의 단위는 톤(ton)입니다. 공공데이터 공개 대상 자료는 2017년도 1월부터 현재까지의 기간동안 한국가스공사의 월별 일평균 전국의 천연가스(LNG) 생산량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일입니다.
