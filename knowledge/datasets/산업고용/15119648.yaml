summary_user: 한국동서발전이 운영하는 발전량을 일자별로 액화천연가스(LNG)·석탄·중유 연료원별 MWh 값으로 집계해 담는 API 데이터입니다. 에너지 분석가나 연구자가 '동서발전의 하루 발전량 가운데 석탄과 LNG 비중이 계절에 따라 어떻게 바뀌는가' 같은 연료 믹스 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자(date)를 기준으로 맞추거나 같은 기관 자료와 이름으로 연결해 쓴다.
description_portal: 한국동서발전에서 오픈API 형태로 제공하는 ‘연료원별 일별 발전량 현황 정보’ 데이터는 일자, 액화천연가스(LNG)(MWh), 석탄(MWh), 중유(MWh) 등 핵심 속성을 통해 발전소별 연료 종류별 발전 실적과 에너지 믹스를 일별로 파악할 수 있도록 구성된 자료입니다. 이러한 데이터는 다른 시스템과 연계해 자동화된 연산과 시계열 분석이 가능하고, 에너지 정책 설계, 발전 효율화, 원가 절감, 연료별 탄소배출량 추산 등 다양한 분야에서 활용될 수 있습니다. 학계 및 연구 기관에서는 연료별 발전 패턴과 계절별 변화 추이를 통해 에너지 경제 모델 개발, 발전소별 성능 비교, 연료 다변화 정책 수립, 대기환경 변화 예측, 탄소중립 실천 성과 측정 등 다양한 실증연구를 진행하는 기초 자료로 삼을 수 있으며, 정부·산업계·연구 기관 간 협업과 기술 개발 과정에도 폭넓게 기여할 수 있습니다.
