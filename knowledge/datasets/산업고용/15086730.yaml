description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 2,000toe 이상의 에너지를 사용하는 에너지다소비사업자가 의무적으로 신고한 수전(受電) 전력 사용량 현황(MWh 단위)을 제공합니다. 수전 전력은 전력 공급자로부터 전력을 인입받아 사용하는 전력량으로, 이 데이터를 통해 지자체별, 연도별, 산업 및 상업 등 주요 부문별 사업장들의 전력 사용 특성과 소비 규모를 명확히 분석할 수 있습니다. 정부 및 지방자치단체는 본 데이터를 활용하여 지역별 에너지 수요 관리, 전력수급 안정화 정책 수립 및 에너지 효율화를 위한 전략 마련이 가능하며, 기업 및 연구기관은 전력 사용 패턴 분석, 효율적 에너지 관리 방안 연구 및 지속가능한 에너지 소비 전략 수립을 위한 기초자료로 활용할 수 있습니다.
