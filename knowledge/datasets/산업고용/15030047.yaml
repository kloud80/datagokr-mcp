summary_user: 구례군 안의 신재생 발전사업 인허가를 사업장 한 건씩 담은 원장 파일로, 상호·소재지 주소·원동력의 종류·설비용량(kW)·허가일자·사업개시일 등을 담는다. 구례군에서 어떤 원동력의 발전소가 어디에 몇 kW 규모로 허가됐고 언제 사업을 시작했는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소나 상호 이름을 맞추는 방식으로 잇고, 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 비교할 때도 이 방식을 쓴다.
description_portal: '"신재생 에너지 현황" 공공데이터는 특정 지역 또는 국가에서 생성되고 사용되는 신재생 에너지의 현황을 제공합니다. 이 데이터는 주로 에너지 원별 발전 현황, 설비 용량 및 설치 현황, 에너지 생산량 및 사용량, 정부 정책 및 지원 현황, 그리고 시장 동향 및 통계 등을 포함합니다. 이 데이터는 에너지 정책 수립, 에너지 시장 분석, 환경 보호 등 다양한 분야에서 활용됩니다.'
