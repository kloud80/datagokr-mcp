summary_user: 한국가스공사가 총발전량에 기온이 미친 영향을 월 단위 지표(기온효과)로 정리한 전국 단위 집계 파일로, 포털 설명상 2007년 1월부터 2021년 6월까지의 연·월·기온효과 세 항목으로 되어 있다. 분석가가 "여름 냉방·겨울 난방철에 기온 때문에 발전량이 얼마나 늘거나 줄었나"를 따져 발전용 천연가스 수요를 예측하거나 연도별 기온 민감도 변화를 볼 때 쓴다. 전역 조인 키는 없고, 연·월을 기준으로 월별 발전량·가스 수요·기온 같은 다른 월별 시계열과 맞춰 붙여 쓴다.
description_portal: 한국가스공사의 총발전량에 기온이 영향을 미친 정도를 나타내는  월별 기온효과를 나타낸 자료입니다. 발전용 천연가스 수요예측 모델 개발 및 기온과 발전량의 상관관계 분석, 전력수급 분석 지원, 발전연료 수급계획 수립을 목적으로 수집되었습니다. 데이터 구성항목은 2007년 1월부터 2021년 6월까지 약 15년간의 연, 월, 기온효과 지표로 이루어져 있으며, 기온이 총발전량에 영향을 미치는 정도를 정량적으로 나타냅니다. 본 데이터를 활용하면 월별 기온효과 추이 분석, 발전량의 기온 민감도 파악, 냉방/난방 수요에 따른 발전량 변동 분석, 연도별 기온효과 변화 분석, 전력피크와 기온의 상관관계 분석이 가능합니다. 또한 발전용 천연가스 수요예측 모델 개발, 전력피크 예측, 발전연료 수급계획 수립, 계절별 발전량 분석에 활용됩니다. 발전용 천연가스 수요예측의 정확도 향상에 기초자료로 활용됩니다.
