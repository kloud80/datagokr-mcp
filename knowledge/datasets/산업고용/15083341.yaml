summary_user: 한국서부발전이 보유한 산업재산권(특허 등)을 건별로 나열한 목록으로, 발명명칭·출원일자·출원번호·등록일자·등록번호·만료일자·소유구분을 담으며 석탄화력 보일러 정비방법, 이산화탄소 흡수제, 발전기 가스누설 방지구조 같은 발전설비 관련 기술이 들어 있다. 발전설비 기술 협력이나 기술이전을 검토하는 사업자·연구자가 '서부발전이 보일러·탈황·터빈 분야에서 어떤 등록 특허를 갖고 있고 언제 만료되는가'를 확인하는 데 쓴다. 출원번호(kipo_appl_no)와 등록번호(kipo_rgst_no)를 키로 특허청 특허정보와 이어 서지·청구항·권리 상태를 확인하거나, 다른 발전공기업 보유 특허 목록과 비교한다.
description_portal: 한국서부발전의 산업재산권 보유목록입니다. 석탄화력 보일러 운전중 송풍기 팬 조절 구동장치 고장의 정비방법, 슬러리 재순환 배관의 오리피스 개폐장치, 물질이동탑내 방사형 분사관의 설계방법, 비표준 석탄화력 발전소의 보일러 연소상태 판정방법, 고강도 건식 재생용 이산화탄소 흡수제, 발전기 케이싱의 가스누설 방지구조, 터빈 터닝기어 축 밀봉구조, 전원공급장치, 재질 열화도 평가를 위한 전기비저항 측정장치 , 난연성 및 불연성 ＦＲＰ 미스트 엘리미네이터 , 증기 감압계통 폐압회수용 전력 생산설비를 구비한 발전플랜트 등이 있습니다.
