summary_user: 경상남도가 지정한 고용우수기업을 기업 한 곳당 한 행으로 담으며, 기업체명·대표자·도로명 소재지·주생산품과 위도·경도 좌표를 제공한다. 구직자나 일자리 상담자가 '경남에서 고용 여건이 좋다고 인정받은 기업이 어디에 있고 무엇을 만드는가'를 확인하거나, 분석가가 우수기업의 지역 분포를 지도로 그리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기업체명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 사업자등록번호 같은 공통 식별자가 없어 기업 재무·고용보험 등 다른 기업 데이터와 정확히 연결하기 어렵고, 이름 매칭 시 동명 기업 오류에 주의해야 한다. 범위는 경상남도 한 시도에 한정된다.
