description_portal: 한국전력공사에서 제공하는 전국 업종별 전력사용량입니다.이 데이터는 사용자가 원하는 정보를 직접 설정하여 추출할 수 있는 시스템으로, 행정구역, 기간(2007.1 ~ 2025.6), 업종별(농업 및 임업, 어업, 금속비금속, 가정용, 수도, 기타공공용 등)을 설정하여 고객호수, 사용량, 전기요금, 평균판매단가를 추출할 수 있습니다.이 데이터를 활용하여 특정 지역의 어업이나 제조업 전력 사용량 추이를 분석하여 해당 지역의 특정 산업 동향을 파악하고 지역별 맞춤형 산업 지원 정책을 수립할 수 있습니다.산업군별 전기 소비 특성을 분석해 특정 업종에 대한 에너지 효율 개선 방안과 전력 수요 예측 모델을 개발할 수 있습니다.
