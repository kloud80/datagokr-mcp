summary_user: 한국서부발전 신재생 발전설비의 장치(장치아이디)별·측정 시점별 전기 운전 기록으로, 3상(R·S·T) 전압·전류·역률, 주파수, 유효·무효전력, 설비상태·알람·개폐 여부를 절대시간과 로컬시간과 함께 담는 시계열 원천 데이터다. 디지털트윈·AI 모델을 개발하는 분석가가 "이 설비의 상별 전압·역률이 언제 흔들렸고 그때 알람이나 개폐 동작이 있었나" 같은 운전 상태·성능 이상 탐지 질문에 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어 장치아이디 이름 매핑이나 같은 기관 코드로만 연결할 수 있고, 태양광 발전사업 허가 표준데이터 같은 발전소 원장과도 직접 키로 붙지 않는다.
description_portal: 한국서부발전에서 제공하는 AI 디지털트윈 솔루션 개발용 신재생 데이터 정보 조회 서비스는 장치아이디, 절대시간, 로컬시간, 설비상태, 알람상세, 전압(R, S, T), 전류(R, S, T), 역률(R, S, T), 주파수, 유효전력, 무효전력(지상, 진상), 계폐여부로 구성됩니다. 각 항목은 발전설비의 전기적 상태와 운전 정보를 나타내며, 절대시간과 로컬시간을 통해 측정 시점을 확인할 수 있습니다. 전압, 전류, 역률, 주파수, 유효전력, 무효전력 값은 설비 운전 상태와 성능 평가에 활용되며, 설비상태, 알람상세, 계폐여부 정보는 장치 운전 및 안전 관리에 사용됩니다
