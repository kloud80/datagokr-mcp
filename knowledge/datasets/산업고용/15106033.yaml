summary_user: 한국수력원자력이 데이터 기준일 한 해 동안 국내에서 체결한 용역계약을 계약 한 건당 한 행으로 담은 원천 목록으로, 계약명·계약방법·분류·계약기간·계약일자·업체명·대표자명·예정가격·계약금액(원)을 담는다. 사업자나 분석가가 한수원이 어떤 용역을 어느 업체와 얼마에 계약했는지, 예정가격 대비 계약금액 비율이 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명 같은 이름 매칭이나 같은 기관의 다른 계약 데이터와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 한국수력원자력㈜은 회사가 국내에서 계약한 용역계약의 상세 내역을 공개합니다. 국내 용역계약 체결현황 데이터는 데이터 기준일 한 해 동안 계약한 국내 용역 관련 데이터를 제공하고 있으며, 제공항목은 순번,계약명,방법,분류,계약 시작일,계약 종료일,계약일자,업체명,대표자명,예정가격,계약금액 등 주요 정보를 포함합니다. 이 데이터는 한국수력원자력 전자상거래시스템을 기반으로 작성되었으며 데이터 갱신 주기는 1년을 기준으로 합니다. 제공항목 중 예정가격과 계약금액의 단위은 원화입니다.
