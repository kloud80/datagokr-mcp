description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅁ 수요자원시장이란  전기 사용자가 전기시장가격이 높을 때 또는 전력계통 위기시 아낀 전기를 전력시장에 판매하고 금전으로 보상받는 제도입니다. 수요반응자원 참여고객은 비상대응 의무감축과 자발적 수요감축을 통하여 수요자원시장에 참여 가능합니다. ㅁ 플러스DR 이란전력부하증대량 거래를 목적으로 하며, 전기사용자가 판매사업자 또는 구역전기사업자와 체력한 전기사용계약 종별에 대한 제한 없이 모든 계약 종별 전기사용자를 참여 고객을 하는 수요반응자원을 말합니다.ㅇ 링크 : https://dr.kmos.kr/nx/nxIndex.do ㅇ 갱신주기 : 1일 1회 (23시 00분)'
