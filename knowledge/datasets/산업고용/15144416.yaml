summary_user: 한국전력거래소가 육지 지역 플러스DR(전력부하증대 수요반응) 운영에 쓰는 기준 태양광 이용률과 기준수요를 지역별 값으로 담은 API이며, 범위는 전국·비공간 데이터입니다. 수요자원 사업자나 에너지 분석가가 플러스DR 참여 시 부하증대량 산정의 기준이 되는 태양광 이용률과 기준수요가 지역별로 얼마인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 전력 수급·DR 데이터와는 지역명(areaNm) 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 표준 행정코드 등 전역 조인 키가 없어 다른 데이터와 붙일 때는 지역명 문자열 매칭에 의존해야 한다. 개발계정은 일 100회 호출 제한이 있다.
