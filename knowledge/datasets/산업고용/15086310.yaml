summary_user: 한국에너지공단이 검사하는 보일러·압력용기 등 열사용기자재(검사대상기기)의 설치현황을 기기 한 대씩 담은 전국 단위 파일로, 지역·설치년도·업종·사용용도·기기명·용량·최고사용압력·사용연료·가동상태를 기록한다. 지자체·정책 분석가가 '우리 지역에 오래된 보일러가 업종별로 얼마나 가동 중인가'처럼 노후 설비 분포와 연료 구성을 파악해 안전관리나 에너지 정책을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름이나 업종·연료 명칭을 맞춰 매핑하는 방식으로만 이어 쓴다.
limits: 사업장명·주소·좌표가 없는 비공간 데이터라 개별 설비 위치를 특정하거나 지도에 올리는 데는 쓰지 못하고, 지역 단위 집계로만 활용한다. 공통 코드 키가 없어 다른 데이터와 결합하려면 지역·업종 이름을 직접 대조해야 한다.
