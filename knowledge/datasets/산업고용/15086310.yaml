description_portal: 본 데이터는 한국에너지공단의 열사용기자재 검사 업무와 관련하여 검사대상기기의 설치현황을 체계적으로 제공합니다.우리 공단은 보일러, 압력용기 등 열사용기자재의 안전성과 에너지 효율성을 관리하기 위해 설치 현황을 파악하고 정기적인 검사를 시행하고 있으며, 이를 통해 사고 예방과 에너지 절약 및 효율 향상에 기여합니다.검사대상기기 설치현황 데이터의 제공 항목으로는 검사대상기기가 설치된 지역, 설치년도, 해당 설비가 속한 업종, 사용 용도, 기기의 명칭, 용량과 용량단위, 최고사용압력(MPa), 사용연료 및 현재 가동상태를 포함하고 있습니다.본 데이터를 통해 정부와 지자체는 지역별·업종별 설비 현황 분석 및 에너지 정책 수립을 위한 자료로 활용할 수 있으며, 기업과 연구기관은 열사용기자재의 관리 실태 분석 및 안전관리 방안 수립의 기초자료로 활용할 수 있습니다.
