summary_user: 서울특별시 중구에서 고압가스를 제조·저장·판매(용기 충전 포함)하는 업소를 한 곳씩 담은 인허가 원장으로, 관리번호·인허가일·영업 상태와 상세 상태·폐업일·소재지 주소·중부원점TM 좌표 등을 업소 단위로 제공한다. 고압가스업 창업을 준비하는 예비 사업자나 안전 담당자가 '중구에 현재 영업 중인 고압가스 업소가 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있고, LPG·도시가스·석유판매 등 다른 에너지 업종 인허가 원장과 같은 틀로 나란히 놓고 본다.
description_portal: '서울특별시 중구의 용기에 충전하는 것을 포함하여 고압가스를 제조,저장 및 판매하는 업소 정보입니다. 데이터는 각 고압가스업체에 부여된 관리번호, 현재의 영업 상태(허가, 취소 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 고압가스업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 특정설비 위험물 취급 업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
