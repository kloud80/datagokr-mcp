summary_user: 서울특별시 중랑구에서 고압가스를 제조·저장·판매(용기 충전 포함)하는 업소를 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표를 포함한다. 중랑구 안에서 영업 중이거나 폐업한 고압가스 업소가 어디 있고 언제 허가받았는지 확인하려는 주민·사업자·안전 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 자치단체 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 시군구의 같은 LOCALDATA 에너지 업종 인허가 데이터와 같은 컬럼 구조로 묶어 쓴다.
description_portal: '서울특별시 중랑구의 용기에 충전하는 것을 포함하여 고압가스를 제조,저장 및 판매하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
