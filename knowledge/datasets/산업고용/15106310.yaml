description_portal: '데이터 개요본 데이터는 대덕특구에 위치한 정부출연연구기관(출연연) 현황을 정리한 자료입니다.데이터는 2021년 연구개발특구 통계조사 결과를 기반으로 하며, 실제 조사는 2020년 기준으로 수행되었습니다.데이터 항목본 데이터가 보유한 주요 칼럼은 다음과 같습니다.구분 : 기관의 유형이나 분류 체계기관명 : 대덕특구에 위치한 출연연구기관의 명칭활용 방법대덕특구 내 출연연구기관 분포 현황 파악에 활용 될 수 있습니다.유의사항본 데이터는 2020년 기준 조사 결과를 2021년에 집계한 것으로, 이후 변동사항은 반영되지 않을 수 있습니다.'
