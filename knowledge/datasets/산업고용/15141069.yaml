summary_user: 서울 마포구에서 인허가를 받은 지하수정화업체를 사업장 단위로 담은 건별 인허가 원장으로, 인허가·취소일자, 영업상태, 지번·도로명 주소, 좌표, 전문인력 수, 자본금, 시설장비 등을 포함한다. 환경·수질 관리 담당자나 지하수 정화를 맡길 업체를 찾는 사업자가 '마포구에 현재 영업 중인 지하수정화업체는 어디이고 인력·자본 규모는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 같은 지방행정 인허가(LOCALDATA) 계열의 다른 업종 원장과 나란히 놓고 보는 방식이 현실적이다.
description_portal: 서울특별시 마포구에서 인허가를 받은 지하수정화업체에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 전문인력총수, 자본금, 시설장비, 타이관이전여부 등의 세부 정보가 포함되어 있습니다.  이 데이터는 환경 보호와 수질 관리, 안전한 생활 환경 조성을 위해 지하수 정화 사업 현황을 확인하고 관리하는 데 활용됩니다.
