description_portal: 본 데이터는 한국중부발전이 월별로 기록한 에너지원별 발전 실적을 정리한 자료입니다. 항목은 발전연월과 함께 에너지원별 설비용량(kW) 및 발전량(kWh)으로 구성되어 있으며, 에너지원에는 복합, 석탄, 소수력, 기타, 중유, 태양광, 풍력이 포함됩니다. 이 데이터는 중부발전의 월별 발전 성과와 에너지믹스 구성, 설비 가동률 분석, 신재생에너지 비중 추이 등을 파악하는 데 활용 가능합니다. 전력 생산 효율성 비교, 에너지원별 공급 안정성 평가, 에너지정책 수립 시 참고자료로도 유용하게 활용될 수 있습니다.
