summary_user: 한국장애인고용공단이 실시한 손기능작업표본검사의 검사 1건당 결과를 한 행으로 담은 파일로, 검사일자·소요시간·장애유형·우세손과 소·중·대 작업별 1·2차 손 측정값, 비장애인·장애인 전체 및 성별 대비 백분위 점수를 담는다. 직업재활 분석가나 연구자가 '장애유형별로 정밀 작업이나 큰 물품 조립 작업에서 손기능 백분위가 어떻게 분포하는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 이름 매핑 정도로만 느슨하게 이어 쓴다.
description_portal: '한국장애인고용공단에서 실시하는 장애인 직업능력평가 도구 중 손기능작업표본검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 백분위 점수 등에 대한 정보를 제공합니다.* KEAD 손기능 작업표본검사: 눈과 손의 협응능력, 손가락 민첩성, 손끝집기(tip pinch) 등 손기능 수준을 알 수 있고, 작업유형(큰 물품 조립 및 사물 취급, 작은 부품 조립 작업, 정밀 작업)에 따른 수준을 평가하는 도구로 15~55세까지의 비장애인과 장애인 대상으로 실시하며 검사시간은 약 30분 정도 소요됨'
