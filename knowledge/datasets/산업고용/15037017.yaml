summary_user: 성남시 관내에 등록된 비료생산업체를 업체(제조장) 단위로 한 줄씩 담은 등록 원장으로, 상호명·제조장 도로명주소·전화번호·비료 종류와 명칭·일일생산능력(톤)·제조원료 및 투입비율·위도·경도를 포함하며 파일 크기가 1.7KB 남짓인 소규모 CSV이다. 성남시 안에서 어떤 업체가 어떤 비료를 어떤 원료로 하루 몇 톤까지 만드는지 확인하려는 농업인·사업자·지역 농정 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·주소 문자열 매칭이나 위도·경도 좌표로 공간 결합해 이어 쓰고, 다른 지자체의 비료생산업 등록현황과는 같은 컬럼 구성끼리 합쳐 비교하는 방식이 된다.
description_portal: 성남시 비료생산업 등록현황 데이터는 「비료관리법」에 따라 성남시 관내에서 비료를 제조·가공하여 유통하기 위해 등록된 비료생산업체의 인허가 및 운영 실태를 수록한 자료입니다. 해당 자료는 비료 유통 관리, 토양 환경 보호, 농가 대상 비료 품질 정보 제공, 불법·무등록 비료 제조 단속 등 행정적 용도로 활용되며, 특히 친환경농업 확대, 지역 내 유기농 자원순환 체계 구축을 위한 정책 수립에 기초자료로 사용됩니다. 또한, 비료 품목의 등록 여부 및 생산 이력관리와 연계되어 농업인의 안전한 비료 사용과 농산물 품질관리에도 중요한 역할을 합니다. 이 데이터는 성남시청 농정 관련 부서 또는 농림축산식품부 비료관리정보시스템을 통해 관리되며, 일부는 공공데이터포털을 통해 공개될 수 있습니다.
