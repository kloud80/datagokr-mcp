summary_user: 민간 부문 인적자원개발 우수기관으로 인증받은 기업을 인증 건별로 담은 파일로, 인증번호·기업명·기업규모 구분(대기업·중소기업·선취업후학습기업)·신규/재인증 여부를 담는다. 구직자나 훈련 담당자가 "이 회사가 인적자원개발 우수기관 인증을 받았는가, 신규인가 재인증인가"를 확인할 때 쓴다. 인증번호(hrd_cert_no)가 키이지만 사업자등록번호 같은 기업 식별 키는 없어, 채용·훈련 데이터와는 기업명 문자열로만 맞춰 볼 수 있다.
description_portal: '민간 부문 연도별 인적자원개발 우수기관의 인증 현황에 대한 데이터입니다.제공 정보는 인증 번호, 인증 기업명, 기업규모(대기업, 중소기업, 선취업후학습기업)*, 신규/재인증 여부로 구성되어 있습니다. ㅇ 고용보험 제8조에 따른 고용보험 가입 사업장   - 대기업 : 고용보험법 시행령 제12조 규정에 의한 우선지원대상기업이 아닌 기업   - 중소기업: 고용보험법 시행령 제12조 규정에 의한 우선지원대상기업   - 선취업후학습기업: 능력중심 고졸자 채용, 고졸근로자 진학, 국가자격증 취득 등 후학습에 대한 지원 우수기업인적자원개발 우수기관 인증 현황 데이터는 기준일로부터 3년인 점을 참고하여 주시기 바랍니다.자세한 사항은 HRD4U의 인적자원개발 우수기관 인증 누리집을 확인해주시기 바랍니다.https://www.hrd4u.or.kr/hrdcert/apply/certConfirm.do?menuNo=0104'
