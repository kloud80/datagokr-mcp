summary_user: 세종특별자치시 자동집하시설의 집하장별(제1~제10집하장) 음식물 폐기물과 일반 폐기물 처리 용량을 날짜(ymd) 기준으로 담는 시 단위 데이터입니다. 세종시 주민이나 환경 분석가가 '우리 동네 집하장에서 하루에 음식물·일반 쓰레기가 얼마나 처리되는가'를 확인하거나 집하장 간 처리량을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 날짜나 집하장 이름을 직접 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 다른 폐기물·행정 데이터와 자동 연결이 되지 않고, 이름이나 같은 기관 코드로만 맞출 수 있다. 실측 필드에는 제4·제9·제10집하장 열이 보이지 않으므로 포털 설명의 집하장 10곳이 모두 담겼다고 보면 안 된다. 부문은 발전소 배출로 분류돼 있지만 실제 내용은 생활폐기물 처리 현황이다.
