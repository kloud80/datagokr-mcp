description_portal: 본 데이터느 장애인일자리사업 운영 현황을 관리, 분석하기 위한 공공데이터로 장애인일자리 사업의 다양한 정보를 제공하고있다.배치기관, 근무형태, 근무시간, 사업유형 등의 항목을 포함하고 있으며 유형별 장애인일자리 현황 파악이 가능하다.(업종, 회사명, 전화번호, 도로명주소, 지번주소, 위도, 경도, 일자리직무, 사업시작일자, 사업종료일자, 배정일자리수, 데이터기준일 등)해당 데이터는 장애인 고용정책 수립, 지역별 장애인 일자리 수요 분석, 사업성과 평가 등의 목적에 활용할 수 있다. 본 데이터를 통해 장애인의 경제활동 참여 확대를 지원하고, 장애인 고용정책 수립 및 일자리사업 운영 효율성 제고를 휘한 기초자료로 활용할 수 있다.또한 지역별, 유형별 장애인일자리 분포 현황을 분석하여 정책 개선 및 신규 사업 발굴에 기여한다.
