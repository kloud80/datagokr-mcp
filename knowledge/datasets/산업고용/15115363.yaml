summary_user: 서울 강남구에서 용기 충전을 포함해 고압가스를 제조·저장·판매하는 업소를 사업장 한 곳씩 담은 인허가 목록으로, 인허가일자·영업상태(영업/폐업)·휴업·재개업일자·주소·좌표·업태명 등을 담는다. 사업자나 분석가가 '강남구에서 현재 영업 중인 고압가스 업소가 어디에 있고 언제 허가받았나'를 확인하거나, 지역 내 에너지 업종 인허가 현황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로 이어 쓰며, 같은 원장 계열인 석유판매·LPG·도시가스 등 다른 에너지 업종 인허가 목록과 나란히 비교하는 데 쓴다.
