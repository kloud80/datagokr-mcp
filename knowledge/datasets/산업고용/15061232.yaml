description_portal: 한국수력원자력이 공개하는 세계 원자력발전소 내진설계 현황에 대한 데이터입니다. 이 공개 데이터는 한국수력원자력 원전 내진설계 현황 및 세계원전(대한민국, 미국, 일본, 중국, 대만, 프랑스, 스페인, 스웨덴, 이탈리아, 독일, 루마니아) 내진설계 현황에 대한 정보를 담고 있습니다. 국가별, 원자력발전소별로 내진설계값을 보여줍니다. 이 데이터를 통해 세계 주요 원자력발전소의 내진설계 수준 비교해 볼 수 있습니다. 내진설계 제공항목의 단위는 g입니다. g는 최대지반가속도를 나타내는 단위로, 중력가속도를 사용합니다. 이는 지진으로 인해 특정 지점이 받는 가속도를 의미하며, 지진의 세기를 나타내는 지표로 활용됩니다.
