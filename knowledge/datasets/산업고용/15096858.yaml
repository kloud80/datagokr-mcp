description_portal: '제주특별자치도 내 최종 에너지 소비량 정보 데이터를 제공합니다.항목: 연도, 시도, 에너지 소비량 등* 제주특별자치도 내에서 연도별로 집계된 최종 에너지 소비량을 나타낸 자료입니다. 단위는 1,000 TOE(톤 석유 환산 단위, ‘톤 오일 이퀴벌런트’)이며, 산업, 상업, 가정, 운송 등 모든 부문의 최종 소비량을 포함한 전체적인 에너지 사용 규모를 보여줍니다.* 활용 분야 : 에너지 정책 및 계획 수립, 탄소 배출 및 환경 영향 예측, 산업 및 운송 부문 에너지 절감 기회 탐색, 지역 에너지 수요 예측 및 인프라 투자 우선순위 등- 데이터 제공처: KOSIS 국가통계포털'
