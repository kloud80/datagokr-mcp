summary_user: 대전광역시 동구에 있는 인쇄소·출판업 사업체를 한 곳씩 담은 목록으로, 사업체명·소재지 주소·전화번호·업종을 담는다(csv 약 78KB). 인쇄·출판 업체를 찾는 주민이나 사업자가 '동구 안 어느 동네에 인쇄소가 몰려 있나'를 주소로 지도에 찍어 보는 데 쓴다. 실측 컬럼에 사업자번호·좌표 같은 전역 조인 키가 없어, 다른 데이터와는 사업체명이나 주소 문자열을 맞춰서만 연결한다.
description_portal: '이 데이터는 대전광역시 동구에 위치한 인쇄출판업 현황 정보를 제공하고 있으며, 세부 내용으로는 인쇄소 및 출판업종에 해당하는 사업체명, 사업체 주소, 전화번호를 포함하고 있습니다.이 자료를 통해 인쇄출판업소 주소 기반 매핑 혹은 지역 비교 연구 등에도 활용할 수 있으며, 산업별 통계 분석, 출판 관련 마케팅 자료 제작 등에도 유용하게 사용될 수 있습니다.일부 개인정보는 공란으로 처리됨을 알려드립니다.해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2025. 8. 4.'
