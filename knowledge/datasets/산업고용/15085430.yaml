summary_user: 한국에너지공단의 에너지효율 우수사업장 인증제도(에너지챔피언, 자발적 에너지효율목표제 등)로 선정된 사업장을 업체명·사업장명·참여연도·인증사업명 단위로 한 줄씩 담은 전국 범위의 소규모 목록 파일(CSV 약 8KB)이다. 정책 담당자나 연구자가 '어떤 기업 사업장이 어느 해에 어떤 에너지효율 인증사업에 참여했는가'를 확인하거나 모범사례를 찾을 때 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명·사업장명 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 본 데이터는 한국에너지공단이 운영하는 에너지효율 우수사업장 인증제도를 통해 우수사업장으로 선정된 사업장의 정보를 제공합니다. 인증제도는 탁월한 에너지 절감 실적과 효율적인 에너지관리를 실천하는 사업장을 발굴하여 모범사례로 인증하는 제도로, 대표적으로 "에너지챔피언"과 "자발적 에너지효율목표제"가 있습니다. 제공 항목으로는 인증을 받은 업체명과 사업장명, 인증사업 참여연도 및 인증사업명 등이며, 이를 통해 우수사업장의 에너지 관리 및 절감 성과를 효과적으로 홍보하고 확산할 수 있습니다. 정부와 연구기관은 이 데이터를 활용하여 에너지 효율 개선 정책 평가, 기업의 에너지 관리 수준 분석 및 모범사례 발굴 연구에 활용할 수 있고, 기업은 에너지 절약 및 효율성 향상 전략 수립 시 참고할 수 있습니다.
