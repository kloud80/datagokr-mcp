summary_user: 한국남부발전 한 회사의 발전실적을 월(발전년월) 단위로 집계한 파일로, 복합·석탄·소수력·연료전지·중유·태양광·풍력 7개 에너지원별 설비용량(kW)과 발전량(kWh)을 한 행에 담는다(약 10KB 규모의 csv). 에너지 분석가나 연구자가 '남부발전의 석탄 발전량은 줄고 태양광·풍력 비중은 얼마나 늘었나' 같은 발전사 단위 에너지 믹스 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전년월 같은 기간 값이나 같은 기관 이름으로만 맞춰 붙인다.
description_portal: 이 데이터는 한국남부발전의 에너지원별 발전실적을 월별로 정리한 자료입니다. 복합, 석탄, 소수력, 연료전지, 중유, 태양광, 풍력 등 다양한 에너지원별 설비용량(kW)과 실제 발전량(kWh)이 포함되어 있습니다. 예를 들어 석탄은 대규모 기저부하 전원으로 높은 발전량을 차지하며, 태양광과 풍력은 점진적으로 확대되는 신재생에너지 비중을 보여줍니다. 또한 연료전지와 소수력은 친환경 분산전원으로서의 역할을 확인할 수 있습니다. 이 자료는 한국남부발전의 에너지 믹스와 발전량 추이를 한눈에 파악할 수 있게 하며, 에너지정책 연구, 탄소중립 실현 전략, 신재생에너지 확대 효과 분석 등 다양한 분야에서 기초자료로 활용될 수 있습니다.
