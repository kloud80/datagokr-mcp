description_portal: 본 데이터는 국내 법무 소송 통계를 연도별로 정리한 자료이다. 제공 기간은 2015년부터 현재까지이며, 각 연도별로 소송건수, 제소건수, 피소건수, 직접수행건수, 소송위임건수를 포함한다. 제소는 기관이 원고로 제기한 사건, 피소를 기관이 피고로 대응한 사건을 의미하며, 직접수행을 내부에서 수행한 건수, 소송위임은 외부 소송대리인에게 위임한 건수를 의미한다. 이를 통해 연도별 소송 규모와 유형 분포, 수행 방식 변화 추이를 확인할 수 있으며, 소송 관리 현황 파악과 통계 분석 및 업무 참고 자료로 활용할 수 있다.
