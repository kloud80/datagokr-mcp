summary_user: 충청남도 청양군에 있는 LPG 가스충전소와 고압가스저장소를 시설 1곳당 1행으로 담은 원천 목록으로, 사업의 종류·상호명·도로명/지번주소·위도·경도·가스의 종류·전화번호를 담는다(파일 크기 약 1KB의 소규모 CSV). 주민이나 사업자가 청양군 안에서 LPG를 충전할 곳이나 고압가스 저장시설의 위치를 확인하고, 분석가가 가스 시설 분포를 지도에 표시하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 상호명으로 맞춰 이어 쓴다.
description_portal: 충청남도 청양군에 소재하는 가스충전소 및 고압가스저장소 설치현황에 관한 데이터로  사업의 종류, 사업장명, 소재지주소, 경도, 위도, 연락처 등에 대한 데이터를 나타냅니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.데이터는 1년 단위로 업데이트 됩니다가스충전소는 LPG가스를 충전하는 시설을 의미합니다. 고압가스 저장소는 각종 고압 가스를 저장하는 시설을 의미합니다. 추가 문의사항이 있을 경우 청양군청 사회적경제과 에너지팀으로 연락 바랍니다.
