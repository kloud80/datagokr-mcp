description_portal: 충청북도 증평군 토석채취현황 데이터는 「산지관리법」 및 관련 규정에 따라 토석(흙, 모래, 자갈 등)을 채취하기 위한 허가를 받은 사업장에 대한 정보를 제공하는 자료입니다.해당 데이터는 충청북도 증평군의 토석채취 허가 내역으로,대표 수허가자인 블랙스톤에듀팜리조트의 토석채취 행위에 대한 허가 구역, 수량, 용도, 기간 등 행정 정보가 포함되어 있습니다.이 정보는 지역개발에 따른 토지훼손 관리, 환경영향 사전 대응, 자원관리 및 개발행위 감시 등의 목적으로 활용됩니다.📌 자세한 생산내역, 채취수량, 관련 도면 등은 첨부된 별도 파일을 통해 확인할 수 있습니다.
