description_portal: 중소벤처기업진흥공단은 중소기업의 정책자금을 효율적으로 지원하기 위해 직접대출의 산업구조별 및 담보별 잔액 현황을 관리하고 있습니다.다양한 산업구조와 담보 유형에 따른 대출 현황을 파악할 수 있습니다. 이를 통해 중소기업의 산업별, 담보별 자금 활용 현황을 분석하고, 맞춤형 지원 정책을 수립하는 데 중요한 기초 자료로 활용됩니다.산업구조 구성은 건설업, 경공업, 도소매업, 서비스업, 정보처리업, 중공업으로 구성되어 있습니다.담보유형은 신용 담보, 보증서 담보, 부동산 담보로 구성되어 있습니다.
