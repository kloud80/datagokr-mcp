summary_user: 행정구역 × 월 단위로 전력거래량·전기사용량·열판매량·가스공급량을 사용량 구분과 세부용도별로 합친 집계 파일로, 전국을 범위로 하며 공간 좌표는 없다. 지자체 에너지 담당자나 분석가가 "우리 시도의 월별 전기·가스·열 사용량이 어떻게 변했나" 같은 지역별 에너지 소비 비교에 쓴다. 전역 조인 키가 없어 행정구역 이름을 다른 지역 통계의 이름·코드와 직접 매핑해 연결한다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당데이터는 에너지 유관기관의 통합데이터로, 한국전력거래소, 한국전력공사, 지역난방공사, 한국도시가스협회 4개사의 데이터를 합친 결합데이터입니다.__활용성__ㅇ 행정구역별 에너지(전기, 가스, 열) 사용량 및 전력거래량을 조회하는데 사용 가능합니다.ㅇ 데이터 범위 (전력거래량(한국전력거래소), 전기사용량(한국전력공사), 열판매량(지역난방공사), 가스공급량(한국도시가스협회)ㅇ 해당데이터는 한국전력공사 데이터 안심구역에서도 활용가능합니다.ㅇ 갱신주기 : 매년 1회, 6월경 직전년도 1년치 데이터를 통합 제작하여 업로드'
