description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 첨단과학기술단지 내 주요 건물들의 에너지 사용 현황을 기록한 자료입니다. 항목은 건물명, 에너지구분, 연월, 사용량으로 구성되어 있으며, 건물명에는 세미양 빌딩, 스마트 빌딩, 엘리트 빌딩이 포함되어 있습니다. 에너지구분은 전기(kWh), 수도(㎥), 가스(㎥)로 나뉘며, 각 건물의 연료 및 설비 이용 형태에 따라 구분됩니다. 연월은 2025-01-01, 2025-02-01, 2025-03-01 등과 같이 연,월,일을 나타낸 형식입니다. 사용량은 각 항목별 실사용 수치로 기록되며, 이를 통해 월별, 건물별 에너지 소비 추이 분석이 가능합니다. 본 데이터는 건물별 에너지 효율성 평가, 탄소배출량 모니터링, 에너지 절감 계획 수립, 운영비용 예측 등 다양한 행정 및 환경적 목적의 의사결정에 활용될 수 있는 실무 중심의 자료입니다.
