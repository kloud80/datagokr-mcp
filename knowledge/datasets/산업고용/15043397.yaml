summary_user: 한국남부발전 안동빛드림본부 안에 설치된 태양광 설비 2기의 발전량(kWh)을 월별 합계로 담은 집계 파일로, 행마다 년월과 설비별 월 발전량이 들어 있다(파일 크기 약 2KB의 소규모). 발전소 운영자나 분석가가 '안동 사업소 내 태양광 두 설비의 월별 발전량이 계절·연도에 따라 어떻게 달라지고 서로 차이가 나는가'를 볼 때 쓴다. 전역 조인 키는 없어 년월을 기준으로 같은 기관의 다른 소내 태양광 실적이나 기상(일조량) 자료와 이름·기간으로 맞춰 이어 쓴다.
