description_portal: 대구광역시에서는 기업애로사항에 대해 신속하고 정확하게 해결하여 기업의 경쟁력을 높이고자 하는 목적으로 지역에서 활동하고 있는 각 분야별 전문가를 기업애로 자문관으로 위촉하여 기업애로 자문단을 운영 중입니다. 대구시에 있는 기업들이 애로사항 발생 시 자문단을 적극 활용할 수 있도록 대구기업애로119 홈페이지에 기업애로 자문단 정보를 제공합니다. 기업애로 자문단 소속의 자문관에 대하여 이름, 컨설팅 분야, 소속, 사무실 번호 등의 정보를 제공합니다. 기업애로신청을 통해 애로사항에 대한 전문적인 지식을 가진 자문관과 매칭되며 컨설팅을 지원받을 수 있습니다.
