summary_user: 육지 계통의 SMP(계통한계가격)를 일자별 한 행으로 정리한 CSV 파일로, 하루의 최소·최대 가격, 산출평균·가중평균과 1시~24시 시간대별 가격을 담는다. 발전사업자나 에너지 분석가가 "특정 기간 육지 전력도매가격이 시간대별로 어떻게 움직였고 하루 중 언제 가장 비쌌나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 전력 수급·발전량 데이터와는 일자(및 시간대)를 맞춰 붙여 쓴다.
description_portal: 이 데이터는 한국남부발전이 제공하는 육지 지역의 SMP(System Marginal Price, 계통한계가격) 정보를 정리한 자료입니다. 일자별 최소·최대 가격, 산출평균 및 가중평균과 함께 1시간 단위의 세부 전력도매가격이 포함되어 있어 전력 시장의 가격 변동을 체계적으로 확인할 수 있습니다. 이를 통해 특정 시기의 전력 수급 상황과 가격 변동성을 분석할 수 있으며, 에너지 수요·공급 불균형에 따른 시장 반응을 이해하는 데 도움이 됩니다. 또한 전력거래소의 전력시장 운영 원리를 학습하거나, 전력 수요 예측, 가격 정책 수립, 에너지 경제 연구 등 다양한 분야에서 기초자료로 활용될 수 있는 중요한 공공 데이터입니다.
