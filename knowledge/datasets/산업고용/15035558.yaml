summary_user: 강원특별자치도 홍천군에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 업소명·도로명주소·우편번호·전화번호·지정일자·영업 상태를 담는다. 담배 판매점을 열려는 사업자나 주민이 홍천군 안에서 어느 주소에 이미 담배소매인이 지정돼 있는지, 언제 지정됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열로 맞추거나, 같은 담배소매 업종의 지방행정 인허가(LOCALDATA) 원장과 주소 기준으로 대조해 쓴다.
description_portal: 강원특별자치도 홍천군의 2025년 04월 22일 기준으로 작성된 담배소매인 지정 현황입니다. 각 구성 항목으로는 연번, 업소명, 업소도로명주소, 업소주소우편번호, 업소전화번호, 지정일자, 영업구분, 기타로 구성되어 있습니다. 연번 항목은 1부터 121까지로 구성되어 있고 지정일자 항목은 2025-01-16과 같이 날짜 형식으로 작성되어 있습니다. 영업구분 항목은 정상영업으로 구성되어 있고 기타 항목은 데이터 없음(업소전화번호), 국군복지단 요청에 따른 주소 비공개 등으로 구성되어 있습니다.업소도로명주소 항목은 강원특별자치도 홍천군 뒤로 각 업소의 상세주소가 나타나 있습니다.
