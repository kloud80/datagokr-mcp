description_portal: '본 데이터는 한국산업기술기획평가원이 운영하는 실시간연구비관리시스템(RCMS)에서 집계한 연구비 이용 항목별 계상(예산 편성) 통계를 CSV 형태로 제공하는 자료입니다. 여기서 계상은 연구비를 사용할 때 적용되는 항목을 기준으로 예산금액을 산정·기록한 결과를 의미하며, 실제 집행 실적이 아니라 예산이 어떤 항목으로 편성되었는지를 항목 단위로 확인할 수 있도록 구성되어 있습니다. 데이터에는 연도, 전문기관, 기관분류, 연구비 이용 항목명과 함께 예산금액이 현금·현물로 구분되어(단위: 천원) 제공되며, 필요한 경우 해석에 참고할 수 있는 비고 정보도 포함됩니다.이 자료를 활용하면 연구비 예산이 어떤 항목에 얼마나 배분되는지, 현금과 현물 구성 비율이 항목별로 어떻게 나타나는지 등을 비교할 수 있어 예산 편성 구조를 점검하는 데 도움이 됩니다. 또한 전문기관과 기관분류 정보가 함께 제공되므로, 기관 유형별로 예산이 어떤 항목에 집중되는지, 항목 구성에 차이가 있는지 등 배분 특성을 분석하는 데 유용합니다. 연구비 관리 실무에서는 항목별 예산 편성 경향을 파악해 지침 안내, 사전 점검, 내부 검토 자료 작성 등에 참고할 수 있으며, 정책·분석 업무에서는 연구비 배분의 구조적 특징을 정리하는 기초 통계로 활용할 수 있습니다.'
