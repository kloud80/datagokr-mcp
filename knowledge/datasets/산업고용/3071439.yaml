description_portal: 한국동서발전에서 운영 중인 각 발전소 주변의 대기환경 정보 데이터는, 발전소 인근 지역의 대기 질 현황을 연도별로 정리한 자료입니다.해당 데이터는 연도, 기준항목(발전소 주변 대기환경 기준 측정 지점), 미세먼지(PM10), 초미세먼지(PM2.5), 오존(O₃, ppm), 이산화질소(NO₂, ppm), 아황산가스(SO₂, ppm), 일산화탄소(CO, ppm) 등으로 구성되어 있어 발전소 주변의 공기 질을 정량적으로 파악할 수 있도록 설계되었습니다.학계 및 연구기관에서는 이 데이터를 일반 지역의 대기환경 정보와 비교 분석함으로써 발전소 인근의 대기 질 특성을 규명할 수 있으며, 오염물질별로 어떤 유형의 대기환경이 주로 나타나는지에 대한 통계적 분포와 경향성을 분석하는 데에도 활용할 수 있습니다.나아가 발전소 운영이 지역 대기환경에 미치는 영향을 과학적으로 평가하거나 환경정책 수립을 위한 기초 자료로도 유용하게 사용될 수 있습니다.
