summary_user: 경상북도 울진군 관내 담배소매인을 업소 한 곳당 한 행으로 담은 파일로, 업소명·소매인 구분·지번/도로명 주소·지정일자·법인 여부·영업 상태(영업구분)를 담는다. 울진군에서 담배를 파는 곳이 어디에 있고 언제 지정됐는지, 지금 영업 중인지 확인하려는 주민·예비 창업자나 소매점 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업소명으로 맞춰 이어야 하며, 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식으로 쓴다.
limits: 실측 컬럼에 사업자번호 같은 공통 조인 키가 없어 다른 데이터와 연결할 때 주소·업소명 매칭에 의존해야 한다. 범위는 울진군 한 곳뿐이라 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다.
