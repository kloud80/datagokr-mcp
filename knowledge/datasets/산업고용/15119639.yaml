description_portal: 본 데이터는 한국중부발전의 RPS(신재생에너지 공급의무화 제도) 이행 실적을 정리한 자료입니다. 항목은 연도, 의무량(kREC), 이행량(kREC), 이행률(퍼센트)로 구성되어 있으며, 발전용량 500MW 이상인 발전사업자가 신재생에너지로 일정 비율 이상 발전해야 하는 제도 이행 결과를 나타냅니다. kREC는 탄소감축 기여도를 반영한 신재생에너지 인증서 단위로, 일반 REC 대비 환경 기여도가 높다는 특징이 있습니다. 본 데이터는 신재생 공급 의무 충족 현황, 제도 이행 수준, 온실가스 감축 실적 등의 정량적 분석 자료로 활용 가능합니다.
