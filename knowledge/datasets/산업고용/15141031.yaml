summary_user: 서울 마포구에서 인허가를 받아 사료를 제조·수입·판매하는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 포함한다. 사료 사업을 준비하는 사업자나 분석가가 마포구 안에 현재 영업 중인 사료 제조·판매 업소가 어디에 몇 곳 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 다른 업종의 지방행정 인허가(LOCALDATA) 데이터와 같은 구조로 함께 쓴다.
description_portal: '서울특별시 마포구에서 인허가를 받은 사료를 제조하거나 수입 및 판매하는 업소 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표 등의 세부 정보가 포함되어 있습니다. * 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
