summary_user: 경기도경제과학진흥원이 인증한 경기도 소재 착한기업을 기업 1건씩 담은 인증 현황 목록으로, 인증구분(신규/재인증)·최초지정년도·재인증년도·시군명·기업명·인증번호·주생산품목·홈페이지주소로 구성된다. 사업자나 지역 분석가가 '우리 시군에서 착한기업 인증을 받은 기업은 어디이고 무엇을 생산하나'를 확인하거나 시군별 인증 기업 수를 비교하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 다른 기업 인증·지역 기업 현황 데이터와는 기업명이나 시군명(sigun_nm) 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도경제과학진흥원에서 제공하는 자료로, 경기도에 소재한 착한 기업의 인증현황을 수록한 것입니다. 착한기업은 지역사회와 상생하고 사회적 책임을 실천하는 기업을 대상으로 선정되며, 해당 데이터는 인증구분(신규/재인증), 최초지정년도, 재인증년도, 시군명, 기업명, 인증번호, 주생산품목, 홈페이지주소로 구성되어 있습니다. 인증 유효기간은 최초 인증일로부터 3년이며, 이후 재인증 심사를 통해 유효기간이 연장될 수 있습니다. 재인증을 받지 않은 경우 ‘재인증년도’ 항목에 최초지정년도가 그대로 표기됩니다.
