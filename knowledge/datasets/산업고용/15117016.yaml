description_portal: 한국산업기술진흥원에서 제공하는 DB 구축 및 활용 현황에 관한 데이터는 기업지원사업 등 외부 기업 및 기관을 대상으로 한 DB 구축에 대한 지원 현황을 상세하게 나타내고 있습니다. 이 데이터는 DB의 구축 내용 및 데이터 건수를 포함하고 있으며, 이를 통해 관계기관 및 연구자들은 중소기업 참여 현황 및 데이터 활용 상황을 파악할 수 있습니다. 또한, 본 데이터는 기업의 DB 활용도를 높이고, 관련 정책 수립 및 예산 배분에 대한 기초 자료로 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 성과발생년도(숫자형), 접수번호(문자형), DB구축활용순번(숫자형), DB명칭(문자형), 데이터 건수(숫자형), 구축년도(숫자형), 활용년도(숫자형), 활용건수(숫자형), 활용수입액(숫자형), 국가과학기술정보서비스(NTIS)순번(숫자형), 등록일자(날짜형)으로 구성되어 있습니다. 이 데이터를 활용하면 중소기업의 DB 구축 및 활용 현황을 깊이 있게 분석하고, 이를 통해 기업 지원 방안을 마련하는 데 유용할 것입니다. 또한, 기업과 기관이 어떻게 DB를 활용하고 있는지를 이해하는 데도 도움을 줄 수 있습니다.
