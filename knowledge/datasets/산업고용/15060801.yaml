summary_user: 2026년도에 착수했거나 착수 예정인 가동원전 계획예방정비를 호기별로 한 행씩 담은 파일로, 정비 차수, 시작일, 종료일, 총일수, 주요 정비항목을 기록한다. 원전 인근 주민이나 전력·에너지 분석가가 특정 원전 호기가 올해 언제부터 며칠간 정비로 멈추는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 원전 가동·고장 데이터와는 호기 이름을 맞춰서만 이을 수 있다.
description_portal: 2026년도 가동원전 호기별 계획예방정비 현황 자료 입니다. - 해당 자료는 2026년도 착수 및 착수예정인 원자력발전소 계획예방정비에 대하여 호기별, 차수, 시작일, 종료일, 총일수, 주요 정비항목 자료가 작성되어 있습니다. - 해당 자료는 매년 공공데이터 개방주기에 맞추어 원전 계획예방정비 현황자료로 갱신하여 공개할 예정입니다. - 해당 자료는 국민의 알권리 보장, 유관기관 및 민간에서 공공데이터를 활용한 서비스 개발 지원을 위하여 정부의 공공데이터 운영실태평가(2020년)와 관련하여 원전 계획예방정비 현황에 대해 국민, 언론 및 유관기관 등 정보공개청구로 다수 요청되어 공개하는 자료로서 유관기관 및 민간의 세부자료로 활용에 기여할 수 있습니다. - 해당자료는 2026. 6. 9. 기준으로 작성되었고 현안등으로 인해 일정이 변경될 수 있음을 참고하시기 바랍니다. - 보다 자세한 자료는 한국수력원자력 홈페이지 열린원전운영정보포털의 계획예방정비에서 발전소별 관련 자료를 확인 할 수도 있습니다.
