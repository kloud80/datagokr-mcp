description_portal: 이 문서는 한전케이피에스주식회사가 현장작업자의 안전의식 향상과 재해 예방을 위해 제작한 교육자료로, 산업안전보건의 기본 개념과 실천 사항을 종합적으로 정리한 실무중심의 교안이다. 본 교안은 산업안전보건법의 기본 취지와 함께, 작업자의 3대 기본 수칙(보호구 착용, TBM 실시, 안전수칙 준수), 안전보건관리체계의 구성요소, 주요 사고유형 및 예방 대책 등을 시각 자료와 함께 명확하게 제시한다. 특히 추락, 감전, 협착, 낙하 등 중대사고 유형에 대해 발생 원인과 현장 조치사항을 사례 중심으로 설명하고 있으며, 위험성 평가의 목적과 절차, 작업 전 점검 사항, 비상시 대피요령까지 포함되어 있어 실질적인 교육 효과를 높이고 있다. 이 자료는 신규 채용자 교육은 물론 정기 안전교육, TBM, 현장 관리자 브리핑 자료 등 다양한 안전관리 활동에 유용하게 활용될 수 있으며, 작업자 스스로의 안전책임 인식을 강화하는 데 효과적인 도구이다.
