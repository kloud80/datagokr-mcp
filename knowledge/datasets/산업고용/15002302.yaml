description_portal: 한국수력원자력㈜이 공개하는 국내 원자력발전소 호기별 발전량 및 이용률 데이터는 상업운전 중인 각 원자력발전소 호기의 실적을 정리한 공개자료입니다. 이 데이터는 2014년부터의 연도별 발전량과 이용률로 구성되어 있으며, 고리, 월성, 한빛, 한울 등 국내 주요 원자력발전소가 포함되어 있습니다. 이를 통해 각 원전 호기가 실제로 생산한 전력량과 해당 설비를 얼마나 효율적으로 활용했는지를 객관적으로 확인할 수 있습니다. 해당 자료는 원자력발전소의 운영 성과와 효율성을 분석하는 데 중요한 근거 자료로 활용될 수 있으며, 원전별 장기적인 운영 추세와 발전 효율을 비교·평가하는 데 기여할 수 있습니다.
