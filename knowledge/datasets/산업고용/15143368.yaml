status: active
summary_user: 전라남도 지역 공공일자리 공고를 공고 한 건 단위로 담으며, 제목·구분·내용·접수 시작일과 종료일·접수상태·담당자 연락처·첨부파일 주소를 목록, 상세, 첨부파일 조회로 나눠 제공한다. 구직자나 일자리 안내 서비스 운영자가 '지금 전남에서 접수 중인 공공일자리 공고는 무엇이고 마감일은 언제인가'를 확인하는 데 쓴다. 다른 데이터와 맞물리는 전역 조인 키는 없고, 공고 관리번호(jobKey)는 목록·상세·첨부파일 조회를 서로 잇는 내부 키로만 쓴다.
limits: 워크넷(고용24) 채용공고나 직업·직무 코드와 바로 잇는 키가 없어서, 다른 채용 데이터와 합치려면 제목·기관명 같은 이름으로 맞춰야 한다. 범위는 시도 단위이며, 개발계정은 하루 1,000회까지 호출할 수 있다.
