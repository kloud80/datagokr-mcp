description_portal: '이 데이터는 2016년부터 2022년까지 7개년 동안 산업재해보상보험 요양급여가 종결된 근로자의 상세한 상병 정보를 담고 있습니다. 통계 항목은 요양 종결 건별로 주상병코드, 주상병명, 산재 당시의 성별 및 연령 정보, 그리고 요양 총 일수(요양/재요양 기간)를 제공합니다. 이 자료는 산재 인정 후 치료를 마치고 종결된 재해 근로자들의 가장 흔한 질병 및 부상 유형과 그에 따른 평균 요양 기간을 명확하게 보여줍니다. 주상병코드 및 상병명에서 발생할 수 있는 이상값(Null 포함) 은 제거되어 데이터의 분석 정확도가 높으며, 이는 국내 산업재해의 실제 발생 패턴과 의료 수요를 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산재 예방 정책의 우선순위 설정 및 의료 재활 서비스의 효율성 평가에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 주상병(예: 요추부 추간판 장애, 특정 골절)에 대한 요양 총 일수의 평균 변화 추이를 분석할 수 있습니다. 이를 통해 과잉 진료나 불필요한 장기 요양의 발생 여부를 진단하고, 효율적인 재활 및 치료 가이드라인을 수립하는 데 활용할 수 있습니다. 또한, 성별, 연령별 주상병 분포를 분석하여 특정 인구 집단의 재해 취약성을 진단하고 맞춤형 예방 대책을 마련하며, 재활 프로그램의 성과를 평가하는 데 기여할 수 있다고 판단됩니다.'
