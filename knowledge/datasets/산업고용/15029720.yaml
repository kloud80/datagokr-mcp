summary_user: 충주시에서 고압가스 저장설비 설치 허가를 받은 사업장을 한 행에 하나씩 담은 건별 목록으로, 업체명·도로명주소·허가일자와 사용가스별(최대 4종) 저장설비 용량·단위를 담는다. 소방·안전 부서나 인근 주민·분석가가 '우리 지역 어디에 어떤 고압가스가 얼마나 저장되어 있는가'를 확인해 점검 계획이나 재난 대응 범위를 잡는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 맞춰 붙여야 하며, 주소를 지오코딩해 지도나 다른 에너지 업종 인허가 목록과 겹쳐 본다.
description_portal: 충청북도 충주시에 허가된 고압가스 저장설비 설치 현황을 제공하는 데이터입니다.업체명, 소재지 주소, 허가일자, 사용가스 종류별 저장설비의 용량 및 단위(톤 등) 정보를 포함하고 있으며, 고압가스 안전관리 및 관련 행정업무의 기초자료로 활용됩니다.본 데이터는 「고압가스 안전관리법」에 따라 허가된 사업장을 대상으로 하며, 가스별 저장설비 정보는 최대 4종까지 제공됩니다.주소 항목은 도로명주소 기준이며, 일부 업체의 경우 등록 당시 주소가 누락되었거나 변동이 있을 수 있습니다.저장설비 용량은 허가 기준치이며, 실제 운영 중인 저장량과 차이가 있을 수 있습니다.사용가스 종류는 대표적 산업용 고압가스를 기준으로 기입되며, 혼합가스 또는 특수가스는 별도 표기되지 않을 수 있습니다.※ 본 데이터는 소방·안전관리 부서의 점검계획 수립, 위험물 유관기관 간 협업, 재난 대응 체계 구축, 고위험 산업시설 분석 등에 활용됩니다.※ 상세 가스 성상 및 저장방법 등은 충주시청 관련 부서 또는 사업체로 문의 바랍니다.
