summary_user: 서울 영등포구 공공건축물에 설치된 태양광 발전시설을 시설 한 건씩 담은 소규모 파일(CSV 약 3.4KB)로, 시설명·소재지·설치일·설비용량·설치면적과 건물 연면적·층수, 2022년 연간발전량을 담는다. 구민이나 에너지 정책 분석가가 영등포구 공공건물 중 어느 곳에 태양광이 얼마나 설치됐고 실제로 얼마나 발전하는지 확인할 때 쓴다. 전역 조인 키가 없어 소재지 주소나 시설명을 매칭해 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과 이어 쓴다.
description_portal: 서울특별시 영등포구 내 공공건축물에 설치된 태양광 발전시설의 상세 현황 및 운영 실적을 기록한 데이터셋입니다. 이 정보는 지자체의 신재생에너지 보급 확대 노력과 에너지 자립 목표 달성 현황을 투명하게 공개하고, 에너지 효율 개선 성과를 평가하는 데 중요한 자료로 활용됩니다.데이터셋에는 시설물을 식별하는 시설명과 정확한 주소 및 설치 시점인 설치일 정보가 포함되어 있습니다. 시설의 규모를 나타내는 설비용량(kW 등)과 설치면적 정보가 명시되어 있으며, 건물의 특성을 파악할 수 있는 연면적, 지하층수, 지상층수 속성도 제공됩니다.특히, 발전 시스템의 실제 운영 효과를 보여주는 연간발전량 정보가 포함되어 있어, 각 시설의 환경 기여도를 정량적으로 분석할 수 있습니다. 이 데이터는 공공 부문의 에너지 전환 계획 수립 및 관련 인프라 관리에 필수적입니다.
