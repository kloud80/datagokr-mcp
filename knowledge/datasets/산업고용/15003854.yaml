summary_user: 한국서부발전이 유연탄·복합화력 발전소를 건설하며 거친 인허가를 건별로 담으며, 인허가 구분(classification)·내용·대상기관·소요 기간을 전국 범위의 비공간 정보로 제공한다. 발전소 건설 사업자나 분석가가 "화력발전소 하나를 지으려면 어떤 법에 따라 어느 기관에서 어떤 인허가를 받아야 하고 기간은 얼마나 걸리나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법령명·기관명 같은 이름 매핑으로만 이을 수 있고, 같은 부문의 태양광 발전사업 허가 표준데이터 등과는 주제 수준에서 함께 본다.
limits: 전역 조인 키가 없어 발전소 원장이나 다른 인허가 데이터와 코드로 직접 결합할 수 없다. 전국 범위지만 주소·좌표가 없는 비공간 데이터이고, 개발계정은 하루 10회 호출로 제한된다.
