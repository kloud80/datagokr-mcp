description_portal: 산학연협력R&D 관련 중소기업 기술개발 지원사업에서 공동연구개발 대학 또는 연구기관 현황이다. 산학연협력R&D 공동연구기관은 중소기업의 기술 혁신을 돕기 위해 참여하는 대학, 정부출연연구기관, 또는 비영리 연구개발 법인 등의 조직을 말한다. 이들 기관은 주관연구개발기관인 중소기업과 함께 연구개발 과제를 분담하여 수행하며, 연구개발비를 별도로 수령하고 연구 성과를 공유할 수 있다. 동 자료는 산학연협회에서 관리, 감독하는 것으로 2025년 8월 6일 이후 자료는 산학연협회 문의하면 된다.
