summary_user: 대전광역시에 등록된 소방시설 관련 업체를 업체 한 곳당 한 행으로 담은 목록 파일(CSV, 약 16KB)로, 업종·상호명·소재지·연락처를 담는다. 공공사업 발주 담당자나 건물 관리자가 '대전에서 소방시설 시공·유지관리 업체는 어디에 있고 어떻게 연락하나'를 찾거나, 분석가가 업종별·지역별 업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 소재지 주소를 맞춰 지방행정 인허가(LOCALDATA) 업종 원장 등과 이어 써야 한다.
