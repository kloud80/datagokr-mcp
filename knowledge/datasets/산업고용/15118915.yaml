description_portal: '각 행에는 과제명, 참여 공급기업(협력사) 명칭, 과제 수행 기간 등이 명시되어 있습니다. 성과공유제는 공공기관과 중소기업 간 협력을 통해 기술·공정 개선 등의 공동성과를 창출하고, 그 성과를 참여 기업과 나누는 제도로, 이 파일은 해당 제도의 실질적 운영현황을 파악하는 데 유용합니다. 공사는 이를 통해 협력 중소기업의 경쟁력을 강화하고, 지속 가능한 상생협력 체계를 구축하고자 합니다. 해당 자료는 내부 경영관리뿐만 아니라 공공기관의 상생협력 성과를 외부에 투명하게 공개하기 위한 목적으로도 활용되며, 정부기관(예: 중소벤처기업부) 보고, 성과평가, 연구개발 실적 정리에 활용됩니다.'
