description_portal: '노무제공자의 산재보험료를 산정하는 직종별 산재보험료율 데이터입니다.2023.7.1.부터 노무제공자의 산재보험료는 ‘보험료 부과기준이 되는 월 보수액’에 ‘산재보험료율’을 곱하여 매월 산정합니다. - 노무제공자 직종별 평균 재해율을 기초로 직종별로 고용노동부 장관이 고시 - 산재보험료율=직종별 요율+출퇴근재해요율*  * 2023년 출퇴근재해요율 1‰, 2024년 출퇴근재해요율 0.6‰[참고] 2023.7.1. 이전 특수형태근로종사자 보험료 산정:  보험료= 고용노동부 장관이 고시한 월 단위 보수액(기준보수) * 해당 사업의 산재보험료율'
