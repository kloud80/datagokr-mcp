description_portal: 이 데이터는 서울특별시 자치구 단위의 공간 정보와 면적 현황을 제공하는 자료입니다. 각 자치구는 고유 코드(SIGNGU_CD)와 명칭(SIGNGU_NM)으로 구분되며, 중심 좌표값(X좌표, Y좌표)과 구 전체 면적(RELM_AR, 단위㎡)이 포함되어 있습니다. 이를 통해 종로구, 중구, 용산구, 성동구, 광진구 등 서울시 25개 자치구의 위치와 면적을 확인할 수 있습니다. 본 자료는 행정구역 경계 파악, GIS 기반 지도 제작, 도시 공간 분석, 인구 및 생활권 연구, 상권·교통계획 등 다양한 정책 수립에 활용할 수 있는 기초 데이터입니다. 또한 시계열 비교를 통해 자치구별 변화 추이를 분석하는 데에도 유용합니다.
