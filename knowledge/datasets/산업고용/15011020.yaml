summary_user: 경기도 내 대학·연구소 등에 있는 창업보육센터를 센터 한 곳당 한 행으로 담으며, 센터명·대표자·전화번호·보육실 수(CHLDCR_ROOM_CNT)·지정일·개소일·지번/도로명 주소·위경도를 포함한다. 예비창업자나 초기 창업기업이 "우리 시군에서 입주할 수 있는 창업보육센터는 어디이고 보육실은 몇 개인가"를 찾거나, 분석가가 시군별 보육 인프라 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표, 센터명 매핑으로 다른 지역 창업·기업 현황 데이터와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 대학 및 연구소 등에 위치한 창업보육센터의 현황을 제공합니다. 창업보육센터는 참신한 아이디어와 우수한 기술을 보유한 예비창업자 및 창업 초기 기업에게 사무 공간을 제공하고, 경영 및 기술에 대한 지도와 각종 정보를 지원하여 성공적인 창업을 돕습니다. 이를 통해 중소기업과 벤처기업의 창업 성공률을 높이고 지역 경제 활성화에 기여하는 전문 보육기관으로 기능합니다. 데이터에는 센터의 명칭, 위치, 지원 서비스 등이 포함되며, 창업 관련 정책 수립, 입주 기업 지원, 투자유치 및 창업 생태계 조성 등의 목적으로 활용될 수 있습니다. 사용 시 수록 정보의 최신성 여부를 확인하는 것이 중요합니다.
