description_portal: 광주광역시 북구에 소재한 모든 사업체의 산업별·지역별 분포와 고용실태·생산활동 등을 수록하여 지역발전 계획 수립 및 연구 등에 기초자료를 제공합니다.광주광역시 북구 통계정보 페이지에서 매 연도별 광주광역시 북구 사업체조사보고서 파일을 다운로드 하실 수 있습니다. 광주광역시 북구 사업체조사보고서 파일은 2024년도(2023년 기준) 부터 연 단위로 제공하고 있습니다.각 연도별 사업체조사보고서 압축파일은 산업세세분류별총괄, 산업소·중·대분류별 종사자, 사업체구분, 조직형태 등에 따른 사업체 통계 정보를 포함하고 있습니다.
