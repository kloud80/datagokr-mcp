description_portal: '한국지역난방공사의 구역전기 사업 중 태양광 주거용 저압 고객의 일평균 전력량(역방향)을 측정한 데이터로, AMI(지능형 원격검침시스템)를 통해 역송전(전력 판매 또는 잉여 발전량) 흐름을 일 단위로 분석할 수 있는 에너지 관리 자료입니다.1. 형식: CSV2. 내용 요약:■ 발생일자: 전력량이 측정된 날짜(예시: 2024-10-19)■ 피상전력량: 유효 및 무효전력을 모두 포함한 일평균 총전력량(kVA)(예시: 3,230.29)■ 유효전력량: 실질적으로 외부로 송전된 유효전력량(kW)(예시: 2,692.82)■ 지상무효전력량: 지상 전력 성분의 무효전력량(kvar)(예시: 768.51)■ 진상무효전력량: 진상 전력 성분의 무효전력량(kvar)(예시: 211.67)3. 활용 예제:■ 태양광 자가발전 잉여전력의 역송전 규모를 분석하여 재생에너지 거래 및 정산 효율성 향상■ 역방향 전력 흐름 데이터를 활용해 배전망 설계, 전력 역류 방지 및 안정성 확보 정책 수립■ AMI 기반 에너지 모니터링을 통해 주거용 태양광의 발전 효율, 수익성, 탄소절감 효과 분석에 활용'
