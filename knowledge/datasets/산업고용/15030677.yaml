summary_user: 경상북도 봉화군에 개업 신고된 행정사 사무소를 사무소 1곳당 1행으로 담은 건별 현황 파일로, 사무소명(업체명)·도로명주소·전화번호·개업신고일·데이터기준일자를 담는다(파일 크기 763바이트의 소규모 목록). 민원 대행이나 인허가 신청을 맡길 봉화군 내 행정사 사무소가 어디에 있고 연락처가 무엇인지 찾는 주민·사업자, 또는 지역 행정서비스 인프라를 살피는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명주소나 사무소명으로 맞추거나 같은 기관(봉화군) 기준으로만 이어 쓴다.
description_portal: '이 데이터는 경상북도 봉화군에 개업 신고된 행정사 사무소의 현황을 정리한 자료입니다. 각 사무소에 소속된 행정사의 이름, 사무소명, 소재지, 연락처, 개업 신고일 등의 정보를 포함하고 있으며, 지역 내 행정사 자격 보유자의 분포와 활동 기반을 파악할 수 있습니다. 본 자료는 민원 대행, 인허가 신청, 출입국 업무 등 행정사 관련 수요 분석과 지역 행정서비스 인프라 현황을 이해하는 데활용할 수 있습니다.본 데이터 기준일은 2026년 1월 13일입니다. [컬럼별 항목 설명] - 행정사 이름: 행정사 자격을 가진 개인의 실명으로, 대부분 한글 성명으로 구성됨. - 사무소명: 행정사가 운영하는 사무소의 명칭으로, 일반적으로 ‘○○행정사사무소’ 형태로 표기됨. - 도로명 주소: 사무소가 위치한 주소로, 도로명 기반 주소 체계에 따라 봉화군 내 읍·면·리 단위까지 포함됨. - 전화번호: 사무소 연락용 유선전화번호이며, 일부는 공란 또는 누락된 경우가 있음(휴대폰번호의 경우 개인정보). - 개업 신고일: 행정사가 해당 사무소 개업을 행정기관에 신고한 날짜로, 과거부터 최근까지의 다양한 연도 포함.'
