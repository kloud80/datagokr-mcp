description_portal: 본 데이터는 국내 법무 소송 사건의 현황을 종결일 기준으로 정리한 자료이다. 제공 범위는 종결일 기준 2022년부터 현재까지 진행되는 사건이며, 각 사건별로 발생일, 종결일, 사건명, 원고, 피고, 진행사항을 제공한다. 진행사항은 사건의 종결 사항을 나타내는 것으로 승소, 패소, 화해, 소취하 등 사건의 결과를 나타낸다. 이를 통해 연도별 종결 사건 추이와 주요 당사자 구성 및 진행사항을 확인할 수 있으며, 소송 관리 현황 파악, 통계 작성 및 업무 참고 자료로 활용할 수 있다. 데이터는 종결일 기준으로 누적 제공된다.
