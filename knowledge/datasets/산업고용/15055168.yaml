summary_user: 인천광역시 관내 군·구별 광구(광업권 설정 구역) 수를 금속광·비금속광·석탄광·기타광으로 나누고, 각각 가행(실제 채굴 중)과 미가행으로 구분해 집계한 통계 파일입니다(CSV 353바이트의 소규모 표). 지역 자원 개발 정책 담당자나 분석가가 "인천 어느 군·구에 어떤 광종의 광구가 몰려 있고, 그중 실제 가동 중인 곳은 몇 개인가"를 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 군구명(이름) 매핑으로만 연결할 수 있고, 이 방식으로 다른 인천 군·구 단위 통계나 광업권·토석채취 허가 자료와 나란히 봅니다.
description_portal: 인천광역시가 제공하는 광종별 광구수 현황 공공데이터는 관내 군/구별로 설정된 **광구(鑛區, 광업권 설정 구역)**의 수를 **광물의 종류(광종)**에 따라 세분화하여 집계한 통계 자료입니다. 이 데이터는 지역 지하자원 개발 활동의 현황과 특정 광물의 잠재적 개발 집중도를 파악하고, 지역 자원 개발 정책 및 산업 육성 계획 수립의 기초 자료로 활용되는 것을 목적으로 합니다.해당 데이터는 통계청(KOSIS)에서 참고하였습니다. 공공데이터포털에서 CSV 파일로도 무료로 확인할 수 있습니다. 참고하시길 바랍니다.
