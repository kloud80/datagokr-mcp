summary_user: 서울 서초구에 있는 무료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 사업장명·인허가일자·영업상태·폐업일자·전화번호·지번/도로명 주소·좌표를 포함한다. 구직자나 구인 사업자가 서초구에서 지금 영업 중인 무료직업소개소가 어디이고 언제 인허가를 받았는지 확인할 때 쓰며, 분석가는 개설·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호 기준으로만 이어 쓴다.
description_portal: 서울특별시 서초구 무료직업소 현황에 대한 데이터로 지번주소, 도로명주소, 우편번호 등에 대한 정보 확인 우선 가능합니다.서울시 서초구 무료직업소개소 인허가 정보(http://data.seoul.go.kr/dataList/OA-20198/S/1/datasetView.do)데이터 입니다.서초구의 무료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다. 서초구는 구민이 안심하고 무료직업소개서비스를 이용할 수 있도록, 무료직업소개소의 인허가 정보를 체계적으로 공개하고 있습니다.해당 페이지에서는 기관의 개설, 변경, 폐업 등 인허가 현황을 정확하고 신속하게 확인하실 수 있습니다.서초구 무료직업소개소 인허가 정보 페이지를 통해 신뢰할 수 있는 취업·고용 환경을 함께 만들어 가고자 합니다.
