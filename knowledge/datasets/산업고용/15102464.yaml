summary_user: 인천광역시 부평구에 등록된 고압가스사업자를 업체 한 곳당 한 행으로 담은 파일(csv, 약 3.7KB)로, 사업구분(제조·저장·판매 등), 상호, 도로명 주소, 전화번호를 수록한다. 부평구 안에서 어떤 고압가스 제조·저장·판매 업체가 어디에 있는지, 우리 동네 주변 업체의 연락처는 무엇인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 주소를 좌표로 바꾸는 방식으로만 잇는다. 같은 세부 부문인 LOCALDATA 에너지 업종 인허가 원장(석유판매·LPG·도시가스 등)과 함께 쓸 때도 같은 방식으로 연결한다.
description_portal: '고압가스사업자의 상호, 사업구분, 주소, 전화번호 등을 수록한 데이터.고압가스의 제조, 저장, 판매 등 사업 유형별 현황을 파악하고, 안전 관리, 산업 자원 관리, 에너지 정책 수립 및 주민 안전 확보 등에 활용 가능하다.활용 목적 및 특징– 고압가스사업자 등록 현황 및 사업구분별 분포 분석– 업체 주소 기반 입지 특성 및 안전 관리 필요 지역 파악– 산업 안전·에너지 자원 관리 정책 자료 활용– 주민 생활 안전 및 산업 기반 강화 정책 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 사업구분: 고압가스 제조, 저장, 판매 등 사업 유형● 상호: 등록된 고압가스사업자의 명칭● 주소: 사업자의 도로명 주소● 전화번호: 사업자 문의 및 안전 관리 연락처'
