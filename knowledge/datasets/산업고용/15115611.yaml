description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 숙박업 사업장의 인허가 현황을 종합적으로 관리하기 위해 구축된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 업태구분, 층수, 객실수  등의 항목이 포함되어 있어 각 숙박업소의 설립과 운영 상태를 명확히 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관의 숙박업 지도·감독 및 정책 수립에 활용될 수 있으며, 시민과 연구자는 숙박시설 분포, 영업 형태, 안전관리 현황 등 다양한 분석 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 숙박업 - 여관, 여인숙, 호텔 등 잠을 자고 머물수 있도록 시설 및 설비 등의 서비스를 제공하는 업소
