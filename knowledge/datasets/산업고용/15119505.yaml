summary_user: 한국남동발전 태양광 발전소의 발전기(호기)별 일별 발전실적을 담으며, 하루 1시~24시 시간대별 발전량과 총량·평균·최대·최소를 한 행에 넣는다. 에너지 분석가나 신재생 사업자가 특정 발전소의 시간대별 출력 패턴을 보고 "맑은 날 정오 무렵 출력이 하루 총량에서 얼마를 차지하나" 같은 질문에 답하거나 태양광 발전량 예측의 참고 자료로 쓴다. 전역 조인 키는 없고, 발전소코드(ippt)·호기코드·발전소명과 날짜로 같은 기관의 다른 발전 데이터나 기상 자료에 이름·날짜 매칭으로 이어 쓴다.
description_portal: 이 데이터는 한국남동발전에서 제공하는 시간대별 태양광 발전 실적 현황입니다. 한국남동발전의 발전소별 시간대별로 태양광 발전 실적에 관한 데이터를 제공하고 있습니다. 발전소의 각 발전기(호기)별로 총량(KW), 평균(KWh), 최대(KWh), 최소(KWh) 등의 핵심 데이터를 포함하고 있습니다. 해당 데이터는 기상에 따라 변동성이 큰 태양광 발전량을 정확히 예측하기 위한 참고 자료로 활용될 수 있으며, 안정적인 전력 계통 운영 계획 및 신재생에너지 정책을 수립하는 데 중요한 핵심 자료로 활용될 수 있습니다.
