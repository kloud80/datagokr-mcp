summary_user: 제주특별자치도가 조례에 따라 선정한 성장유망 중소기업을 업체 한 곳당 한 행으로 담은 목록으로, 구분·업체명·주소지·업종·품목과 데이터기준일자가 들어 있으며 파일 크기는 768바이트에 불과한 소규모 명단이다. 도내 협력업체나 납품처를 찾는 사업자, 또는 제주 지역 대표 중소기업이 어떤 업종·품목에 몰려 있는지 살펴보려는 분석가가 '제주도가 성장유망기업으로 지정한 회사는 어디인가'를 확인하는 데 쓴다. 사업자등록번호 같은 공통 조인 키가 없어서, 벤처·이노비즈 인증이나 지역 기업 현황 같은 다른 기업 데이터와는 업체명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '제주특별자치도에서 선정하는 성장유망 중소기업에 대한 데이터를 제공합니다.항목: 구분, 업체명, 주소, 업종, 품목, 종업원 수*기술･경영･판매력･고용환경이 우수하여 경영실적이 뛰어나고 근로자 복지 및 사회공헌을 실천하는 성장 잠재력이 있는 중소기업을 선정, 지역경제를 선도할 도내 대표기업으로 육성･지원- 근거: 제주특별자치도 기업·기업인 예우 및 기업활동 촉진에 관한 조례- 선정 기간: 2년 (1회에 한하여 재선정 2년 연장) 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1194'
