summary_user: 충청남도 부여군이 담배소매인으로 지정한 업소를 한 곳당 한 행으로 담은 건별 목록으로, 업소명·지번주소·도로명주소·지정일자·소매인 구분(일반소매인 등)을 담는다(포털 설명 기준 2026년 5월 8일 현재 261개소). 담배 판매점을 열려는 사업자나 상권 분석가가 '부여군의 어느 읍·면에 담배 소매점이 몰려 있고, 최근 몇 년 사이 새로 지정된 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키(사업자번호·좌표·행정코드)가 없으므로 다른 데이터와 잇려면 주소를 지오코딩하거나 업소명·주소 문자열로 소상공인 상가업소 정보나 LOCALDATA 업종 인허가 데이터와 대조해야 한다.
description_portal: 본 데이터셋은 「담배사업법」 제16조에 의거하여 충청남도 부여군청으로부터 정식으로 지정받은 담배 소매인들의 최신 현황 정보를 제공합니다.데이터의 주요 구성 항목으로는 담배를 판매하는 업소의 명칭(업소명), 해당 업소의 위치를 정확히 파악할 수 있는 지번 주소 및 도로명 주소, 담배 소매인으로 최초 지정받은 날짜(지정일자), 그리고 소매인의 자격 유형(일반소매인 등)이 포함되어 있습니다.이 자료는 2026년 5월 8일 기준으로 작성되었으며, 부여군 관내 총 261개소의 업체 정보를 수록하고 있습니다. 지역별 담배 판매점의 밀집도나 분포 현황을 파악하는 데 용이하며, 소상공인 상권 분석, 지역 유통망 연구, 인허가 행정 서비스의 투명성 제고 등 다양한 공공 및 민간 분야에서 기초 자료로 활용할 수 있습니다. 특히 도로명 주소와 지번 주소를 병행 제공함으로써 공간 정보 분석 및 지도 시각화 작업에도 높은 활용도를 가집니다.
