description_portal: 해당 통계는 고용보험에서 제공하는 월별 피보험자 관련 현황 정보를 담고 있으며, 고용보험의 취득 및 상실 추이를 다양한 기준으로 파악할 수 있는 기초 자료입니다. 제공되는 지표는 ‘취득상실현황’이며, 통계 항목은 고용형태(상용직, 자영업), 직종(대·중·소분류), 연령, 성별, 취득구분, 사업장 소재지(시도 및 시군구), 사업장 규모, 산업분류(대·중·소분류), 상실사유 및 채용일 기준 근속년수 등을 포함합니다. 피보험자 수는 해당 월 말일 기준 자격을 유지한 인원을 기준으로 하며, 취득자와 상실자는 각각 월간 단위로 집계됩니다. 특히 주의할 점은 통계가 월 기준으로만 사용되어야 하며, 여러 달을 합산할 경우 수치가 왜곡될 수 있다는 점입니다. 이 자료는 노동시장 변화 파악, 고용안정성 평가, 정책 수립 및 고용보험 제도 개선 등에 중요한 기초 자료로 활용됩니다.
