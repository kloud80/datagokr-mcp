summary_user: 경기도 동두천시가 허가한 태양광발전소 중 아직 준공되지 않았거나 개발행위허가를 받은 사업부지를 발전소(부지) 한 건씩 담은 원장 파일로, 시설명·도로명/지번 주소·전력량·허가일자·준공여부를 담는다. 동두천시 안에서 허가는 났지만 아직 준공되지 않은 태양광 부지가 어디에 있는지 확인하려는 주민, 또는 해당 지역의 태양광 입지와 진행 상황을 살피는 사업자·분석가가 쓴다. 전역 조인 키는 없어서 전국태양광발전소전기사업허가정보표준데이터 같은 다른 자료와는 주소나 시설명을 맞춰 대조하는 식으로 이어 쓴다.
description_portal: 민원인의 공공데이터 제공 요청에 따라 경기도 동두천시에서 허가받은 태양광발전소 미준공 또는 개발행위허가 사업부지 현황에 대한 정보를 제공하고자 합니다.공공데이터 제공항목으로는 태양광발전시설명, 소재지 도로명주소, 소재지 지번주소, 전력량, 허가일자, 준공여부의 정보입니다.데이터의 기준일자는 2025년 2월 3일입니다. 데이터에 대한 추가적인 문의사항이 있으실 경우 동두천시청 일자리경제과 에너지팀 031-860-2329으로 문의주시기 바랍니다.대표홈페이지에서 신재생에너지 정보 및 지원사업 등 다양한 정보를 제공하고 있으니 참고하시기 바랍니다. (https://www.ddc.go.kr/ddc/contents.do?key=685)
