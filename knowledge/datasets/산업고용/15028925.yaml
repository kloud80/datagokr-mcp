summary_user: 광양시의 개발행위에 따른 토석채취 허가를 건별로 담은 파일(csv, 약 630바이트)로, 허가구분·수허가자·업체명·용도지역·소재지·채취목적·허가면적(㎡)·허가량(천㎥)·허가기간을 담는다. 주민이나 사업자가 '광양시 어느 곳에서 누가 어떤 목적으로 얼마만큼 토석채취 허가를 받았는가'를 확인하거나, 분석가가 용도지역별 채취 허가 분포를 살피는 데 쓴다. 전역 조인 키가 없어 소재지 주소를 지오코딩하거나 업체명·용도지역 이름을 맞춰 토지이용규제·개발행위허가 등 국토 공간 규제 데이터와 이어 쓴다.
description_portal: 이 데이터는 개발행위에 따른 토석채취 허가 현황을 제공하는 자료로, 허가구분, 수허가자, 업체명, 용도지역, 소재지, 채취 목적, 허가면적(㎡), 허가량(천㎥), 허가기간 등의 정보를 포함하고 있습니다. 이를 통해 국민은 지역 내 토석채취 허가 현황을 확인할 수 있으며, 행정기관은 개발행위 관리, 환경영향 평가, 자원 이용 정책 수립에 기초 자료로 활용할 수 있습니다. 특히 토지 이용 및 개발 행위와 관련된 투명한 정보 제공을 통해 환경보호와 지속 가능한 자원 관리에 기여할 수 있습니다. 또한 데이터 기준일을 명시하여 최신성과 신뢰성을 보장하며, 연구기관과 지자체는 이를 활용해 개발행위 모니터링, 토지 관리 정책 개선, 환경 영향 분석 등에 참고할 수 있습니다.
