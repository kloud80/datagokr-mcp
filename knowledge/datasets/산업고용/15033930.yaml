summary_user: 경상남도 거창군에 설치된 태양광발전소를 발전소 한 곳씩 행으로 담은 목록이며, 발전소명·설비용량(kW)·설치장소·데이터기준일로 구성된다. 거창군 안에서 태양광발전소가 어디에 얼마 규모로 들어서 있는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치장소 주소나 발전소명을 맞춰 보는 방식으로만 이어 쓰며, 전국 단위는 전국태양광발전소전기사업허가정보표준데이터와 비교해 쓴다.
description_portal: 경상남도 거창군의 2020년 기준 태양광발전소 설치 현황에 대한 데이터로, 태양광발전소명, 설비용량(kw), 설치장소 정보를제공합니다.○ 2020. 04. 06. (일회성 데이터)○ 태양광발전소는 태양광 모듈을 이용해 태양 에너지를 전기에너지로 변환하고, 이를 한국전력공사(한전)에 판매하거나 자가 소비하는 방식의 신재생에너지 발전 시설입니다. 「신에너지 및 재생에너지 개발·이용·보급 촉진법」에 따라 일정 규모 이상의 발전소는 발전사업 허가를 받아야 하며, 전력 판매 시에는 계통 연계와 함께 한국형 FIT(고정가격계약) 제도나 REC(신재생에너지 공급인증서) 거래를 통해 수익을 창출할 수 있습니다. 정부는 탄소중립과 에너지 전환을 위해 태양광 발전 확대를 적극 지원하고 있으며, 농지·건축물·수상 등 다양한 형태로 설치가 가능합니다.
