summary_user: 소상공인시장진흥공단 로컬크리에이터 육성사업에 선정된 크리에이터(소상공인) 1,353건을 업체별 한 행으로 담은 전국 단위 목록이다. 지역 특화 창업 사례를 찾는 분석가나 예비 창업자가 특정 지역에 어떤 로컬크리에이터가 어느 분야로 선정됐는지 확인하는 데 쓴다. 세부 주소(address)를 키로 상가업소·상권 자료와 이어 쓰며, 사업자번호 같은 기업 식별 키는 필드에 없다.
description_portal: '* 데이터 개요 : 중소벤처기업부 소상공인시장진흥공단에서 지원하는 "로컬크리에이터 육성사업" 선정 크리에이터(소상공인) 리스트 현황 - 중소벤처기업부 소상공인시장진흥공단(semas.or.kr)에서 제공하는 데이터입니다.* 데이터 구성항목 : 크리에이터명, 아이템명, 주관기관, 지자체 지역, 지자체 세지역, 세부주소, 선정연도, 7대분야 순 - 7대분야 : 1) 지역가치, 2) 로컬푸드, 3) 지역기반제조, 4) 지역특화관광, 5) 거점브랜드, 6) 디지털문화체험, 7) 자연친화활동 * 로컬크리에이터란 "지역의 자연/문화 특성과 아이디어를 결합해 사업적 가치를 창출하는 기업"입니다. - 로컬크리에이터는 지역 고유의 특성과 자원을 기반으로 혁신적인 아이디어를 접목하여 지역경제 활성화에 기여하는 "지역가치 창업가"로 7대 유형의 비즈니스모델로 분류됩니다.'
