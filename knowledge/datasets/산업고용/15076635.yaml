summary_user: 전국 알뜰주유소 1,328곳을 한 곳당 한 행으로 담은 건별 목록 파일이며, 상호·주소·상표·셀프 여부를 싣는다. 가까운 알뜰주유소가 어디 있고 셀프로 운영되는지 찾으려는 국민이나, 지역별 분포를 보려는 분석가가 쓴다. 주소(address)를 키로 다른 주유소 위치·표준 데이터와 이어 쓰며, 유가나 실시간 상태는 오피넷 계열 데이터와 따로 붙여야 한다.
description_portal: 이 데이터는 전국 알뜰 주유소의 지역별 분포 현황을 정리한 자료입니다. 주유소명, 소재지 주소, 상표명, 운영형태 등을 포함하고 있습니다. 해당 데이터는 공공부문 주유소 운영 현황을 분석하고 유류비 절감 효과를 평가하는 데 활용될 수 있습니다. 일반 국민은 주유소 위치와 연락처를 확인하여 실생활에 활용할 수 있으며, 정책담당자는 지역별 수급 현황 분석, 민간 유통망과의 비교, 유류정책 수립을 위한 기초 자료로 활용 가능합니다. 이 데이터는 정기적으로 갱신되어 정확하고 신뢰도 높은 정보를 제공합니다.
