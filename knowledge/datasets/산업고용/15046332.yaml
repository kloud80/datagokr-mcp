description_portal: '○ 통계개요* 통계명 : 건설수주동향* 통계종류 : 건설공사 건설수주동향 현황을 제공하는 지정ㆍ표본통계* 작성목적 : 일반건설업체의 국내건설공사 수주액 및 기성액을 발주자 및 공사종류별로 조사하여 국내건설경기 동향을 파악하는데 필요한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 조상대상업체 → 통계청 지방청(사무소) → 통계청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 건설수주액수의 발주자별(공공, 민간), 공종별(건축, 토목) 현황○ 용어설명* 건설수주액 : 일반적으로 건설업체가 발주자와 체결한 공사계약액임- 본 조사의 수주액은 공사계약금액 뿐만 아니라 매출부가가치세액(10%)과발주자 공급원자재비를 포함한 금액을 말함(토지보상비는 제외)- 최종계약일을 기준으로 조사함○ 기 타* 건설수주조사결과를 공사지역(시·도)별로 구분하여 집계한 것임* 발주자별 수주액은 국내외국기관 수주액은 제외된 수치임* 최근 2개월 수치는 잠정치가 포함되어 있으며 추후 수정될 수 있음* 매년 1월분 통계 공표(2월말 또는 3월초)시에는 연간보정으로 인해 최근 몇 개년 자료가 수정될 수 있음'
