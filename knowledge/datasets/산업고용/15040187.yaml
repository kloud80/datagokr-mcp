description_portal: 한국남동발전의 대규모(100억 이상) 공사 정보 데이터입니다. 해당 데이터는 한국남동발전 계약자재부에서 매년 공표 중으로, 총 11건의 대규모 (100억 이상) 공사 정보를 EXCEL 형식으로 다운로드 할 수 있으며 본사, 영흥, 삼천포, 영동, 여수, 분당, 전문원센터, 고성, 강릉, 신재생운영처 공사 정보를 확인할 수 있습니다. 데이터 상세 내용으로는 100억 이상 대규모 공사의 사업명, 사업내역, 예산(백만원 단위), 추진실적 및 계획, 담당부서, 전화번호 등 정보가 포함되어 있습니다.*한국남동발전홈페이지 → 사전정보공개 → 사전정보공표목록 → 계약구매에서도 확인할 수 있습니다.
