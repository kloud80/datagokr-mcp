description_portal: 장애인보호작업장은 중증장애인 등 일반 노동시장에서 취업이 어려운 장애인에게 보호된 환경에서 직업활동을 할 수 있도록 지원하는 시설입니다. 단순한 일자리 제공을 넘어 직무훈련, 작업능력 향상 교육, 사회적응 훈련 등을 함께 제공하여 궁극적으로는 자립과 일반 고용시장으로의 전이를 목표로 합니다.주로 수공예품 제작, 임가공, 세탁, 포장, 농산물 가공 등 비교적 신체적·인지적 부담이 적은 직무가 운영되며, 작업지도원이나 직업훈련교사가 상시 배치되어 장애인의 작업 수행을 지원한다. 또한 근로기준법상 일반 사업장과 달리 보호된 근로환경이 적용되며, 장애인의 능력과 특성을 고려해 작업량과 속도가 조정됩니다.운영 목적은 단순한 생산성이 아니라 장애인의 사회참여 확대, 소득 보장, 직업재활이며, 이를 통해 장애인이 지역사회 안에서 경제적·사회적으로 독립할 수 있도록 돕는 역할을 합니다.
