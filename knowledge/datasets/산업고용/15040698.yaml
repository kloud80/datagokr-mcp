summary_user: 국가기술표준원 제품안전정보센터에 올라온 국내 리콜 건의 증빙 첨부파일 정보를 파일 단위로 담은 CSV이며, 각 행은 첨부파일의 저장 경로·저장파일명·확장자로 구성된다. 리콜 공지의 원문 증빙 자료가 어디에 어떤 형식으로 있는지 확인하려는 분석가나 사업자가 리콜 원문 문서를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 제품 안전인증·리콜 정보와는 파일명이나 경로 같은 이름 매핑으로만 이어 쓴다.
limits: 첨부파일의 경로·파일명·확장자만 있고 리콜 제품명·사유·일자 같은 내용은 없어, 이 파일만으로 리콜 내용을 파악할 수 없다. 리콜 원장과 바로 잇는 공통 키가 없어 매칭이 불확실할 수 있으며, 수정일 이후의 최신 정보는 포털 설명대로 API(제품 안전인증 및 리콜 정보)에서 확인한다.
