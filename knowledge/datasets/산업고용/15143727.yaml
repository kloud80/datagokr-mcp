description_portal: '본 데이터는 지역상권법에 따라 "23년부터 시작한 지역상권 실태조사로, 전국 지역상권 현황 데이터를 제공합니다.칼럼구성 : 지역, 상권 실태조사 결과를 기반으로 제공되며, 전국 단위의 상권분석과 지역상권 활성화를 위한 기초자료로 활용됩니다.데이터는 2023년 상권 개수(개소)를 지역 단위로 정리하고 있으며, 상권분류 기준에 따라 다양한 유형의 상권 통계를 파악할 수 있습니다.특히 지역별상권의 분포, 상권별 변화 추이, 주요상권의 성장세 등 상권통계 전반을 한눈에 확인할 수 있도록 구성되어 있어 상권 활성화 정책 수립, 도시재생 전략 수립,민간 투자 분석 등 실무적인 활용도가 높습니다. 지역상권의 특성과 비교 지표를 제공하여, 소상공인 지원 정책의 효과 분석이나 상권 경쟁력 진단에도 효과적으로 활용될 수 있습니다.'
