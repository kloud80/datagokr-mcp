description_portal: 충청남도 계룡시의 '석유판매업소 API' 데이터는 관내에 등록되어 운영 중인 석유 판매 업소들의 상세 현황 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 석유판매업소 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 업소의 종류를 분류하는 구분 정보와 공식 명칭인 상호, 그리고 업소의 정확한 주소가 포함됩니다. 더불어, 판매하는 기름 종류와 보유 기름 양 등 영업 상세 정보가 기록되어 있으며, 특이 사항을 기재하는 비고 항목도 제공합니다.
