summary_user: 충청남도 계룡시 관내 석유판매업소를 업소 한 곳당 한 행으로 담은 API로, 업소 구분·상호·주소·판매 유종·보유량·비고를 시군구 범위에서 개별 주소 단위로 제공한다. 주민이나 사업자가 '계룡시에 어떤 석유판매업소가 어디에 있고 어떤 기름을 다루는지'를 확인하거나, 분석가가 지역 에너지 업종 인허가 현황을 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매칭이나 같은 기관 기준으로만 연결하며, 주소를 좌표로 바꿔 주유소·유가 데이터와 겹쳐 보는 방식이 현실적이다.
limits: 업소 고유 식별 코드나 표준 인허가 번호 같은 공통 키가 없어 LOCALDATA 등 다른 원장과 정확히 맞추려면 이름·주소 매칭에 기대야 한다. 계룡시 한 곳만 다루므로 시도·전국 단위 비교에는 다른 지자체 데이터를 따로 모아야 한다.
