description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 주요 연구 성과인 논문 및 특허에 대한 정보를 집약한 공공 데이터입니다. KETEP은 에너지 R&D 전문기관으로서, 다양한 기술개발 과제를 지원하고 있으며, 이 과정에서 창출되는 학술적, 기술적 성과를 투명하게 공개하고자 합니다.제공되는 정보는 각 기술개발 과제별로 도출된 논문 게재 및 특허 등록/출원 성과에 관한 정보를 포함합니다. 구분, 구분상세, 국내외여부, 세부항목, 연도, 논문 건 수 등을 제공합니다. 이 데이터는 기술 개발의 질적 수준을 객관적으로 평가하는 데 중요한 기초 자료로 활용될 수 있습니다.
