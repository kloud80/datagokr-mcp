summary_user: 중소벤처기업진흥공단 정책자금 이차보전 지원 건을 지역구분·업력구분·사업·자금명·업종·자산규모·매출규모 같은 구분값과 함께 신청·추천·공급금액(백만원)과 대출금리로 담은 전국 단위 파일(CSV, 약 634KB)이다. 중소기업 정책 분석가가 "어느 지역·업종·업력 구간 기업에 이차보전 자금이 얼마나 신청되고 실제로 공급됐는가", "신청 대비 공급 비율과 금리는 어떤가"를 살필 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 기업 단위 인증·확인 데이터와 직접 잇지 못하고, 지역명·업종명·산업품목코드명 같은 이름 매핑으로만 다른 지역·업종 통계와 맞춰 쓴다.
