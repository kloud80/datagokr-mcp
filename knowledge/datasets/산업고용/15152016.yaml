description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 연도별 국가전력 수급전망 데이터를 제공합니다.ㅇ 해당데이터는 전력거래소 홈페이지에서도 확인 가능합니다.ㅇ 링크 : https://new.kpx.or.kr/powerinfoSubmain.es?mid=a10606030000__생성 및 수집목적__전기사업법 및 전력시장 운영규칙에 따라 안정적인 전력시장 및 계통운영을 위해 데이터를 생성, 수집하고 있습니다.__활용성__ㅇ 최근 5년간의 최대전력실적 데이터를 확인가능합니다.ㅇ 연도, 월, 일, 공급능력, 최대수요, 예비전력, 예비율 데이터를 제공합니다.(단위:MW,%)'
