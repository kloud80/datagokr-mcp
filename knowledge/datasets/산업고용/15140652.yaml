description_portal: '은평구의 지하수개발·이용을 위한 시설을 시공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 「지하수법」에 따라 지하수 개발·이용을 위한 시설(관정, 집수정, 방사정 등)을 전문적으로 시공하는 업체의 인허가 현황을 담고 있습니다. 데이터에는 각 지하수시공업체의 상호명, 소재지 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등)와 같이 지하수 개발 관리의 핵심적인 정보가 포함되어 있으며, 정확한 위치 파악을 위한 좌표 정보도 함께 제공됩니다.지하수시공업은 지하수 개발허가를 받은 개인이나 기업을 대신하여 실제 지하수 시설을 설치하고 시공하는 전문적인 기술 서비스업입니다. 이 업종은 관할 구청에 등록해야 하며, 지하수 시공에 필요한 전문 장비와 기술 인력, 그리고 일정한 시설 기준을 갖춰야 합니다. 특히, 지하수는 중요한 수자원이므로 시공 과정에서 지하수 오염 방지와 안전한 개발이 필수적입니다.이 데이터는 지하수 개발을 필요로 하는 개인이나 기업이 정식으로 등록된 신뢰할 수 있는 전문 시공업체를 확인하고 선택하는 데 도움을 줍니다. 또한, 지자체는 이를 기반으로 지역 내 지하수 개발 현황을 파악하고, 지하수 보전과 적정 이용을 위한 관리·감독을 실시하는 등 수자원 보호 정책을 수립하는 데 핵심적인 기초 자료로 활용합니다.'
