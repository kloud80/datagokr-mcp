description_portal: 이 데이터는 한국남부발전의 유연탄 전자입찰 시 적용되는 스펙 일반정보를 정리한 자료입니다. 각 공고번호별로 석탄의 총수분, 순발열량, 회분, 휘발분, 고정탄소, 유황분, 질소 등 화학적 특성과 함께 회융점, 분쇄도, 50mm 이상 및 2mm 이하 입도 비율, 주요 산화물 성분(산화철, 산화나트륨, 산화칼륨, 이산화규소) 등의 물리적 특성이 포함되어 있습니다. 이를 통해 유연탄의 품질 기준을 객관적으로 확인할 수 있으며, 발전소 연료로 적합한 석탄을 조달하기 위한 필수 검증 요소로 활용됩니다. 본 자료는 석탄 연료의 품질 관리, 발전 효율성 확보, 환경 오염 저감 및 국제 입찰 과정에서의 투명성을 높이는 데 중요한 기초 정보를 제공합니다.
