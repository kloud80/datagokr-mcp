summary_user: 성남시 관내에 등록된 유료·무료 직업소개소(인력사무소 포함)를 사업장 한 곳당 한 행으로 담은 파일로, 유무료 구분·사업장명·인허가일자·지번/도로명 주소·전화번호·법인 구분을 수록한다. 구직자나 일용직 노동자가 "우리 동네에 등록된 직업소개소가 어디 있고 유료인지 무료인지"를 확인하거나, 분석가가 성남시 내 민간 고용서비스 업소의 분포와 인허가 시기를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소를 매칭하거나 주소를 좌표로 바꿔 고용복지플러스센터·일자리센터 등 다른 고용 서비스 기관 목록과 겹쳐 보는 방식으로 이어 쓴다.
limits: 성남시 범위만 담고 있어 다른 시군구나 전국 비교에는 다른 지자체 자료를 따로 모아야 한다. 사업자등록번호 같은 공통 키가 없어 다른 데이터와의 연결은 이름·주소 매칭에 의존하므로 표기 차이로 누락이 생길 수 있다.
