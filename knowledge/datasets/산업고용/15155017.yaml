summary_user: 한국서부발전 신재생(주로 태양광) 발전소별 발전량을 발전기명·연월일·시분초 단위 시계열로 담은 파일 데이터이며, 2022-01-01~2022-12-31 기간 52,560행 전체를 전국 개별 발전소(주소·좌표) 기준으로 수록한다. 분석가가 시간대별 발전 효율을 보거나 출력 예측 모델을 학습할 때 쓴다. 주소(address)를 조인 키로 발전소 위치 기반 자료와 잇고, 일사량·SMP 같은 외부 변수는 날짜·시간으로 맞춰 결합한다.
description_portal: 한국서부발전의 신재생에너지 발전소(특히 태양광 발전소)의 발전량을 중심으로 구성된 AI 활용 친화형 고가치 데이터입니다.각 발전소의 주소, 설비용량, 시계열 발전량 정보 등을 포함하며, 시간·기상 조건에 따른 발전 효율 분석과 출력 예측 모델 개발에 활용할 수 있습니다.또한 일사량, 운전시간, 전력거래시장(SMP) 등 외부 변수와 결합할 경우, 인공지능 기반의 에너지 수급 예측·운영 최적화 연구에도 기초자료로 유용합니다.데이터 구조는 시계열 기반으로 정규화되어 있어, 학습·분석·시각화 등 다양한 목적에 쉽게 연계 가능합니다.
