description_portal: 「고용서비스 우수기관 자료」는 고용노동부가 매년 실시하는 고용서비스 우수기관 인증평가 결과를 정리한 자료로, 전국의 공공·민간 고용서비스 제공 기관 가운데 일정 기준을 충족한 기관을 ‘우수기관’으로 선정해 공개하는 내용으로 구성됩니다. 평가 기준은 일자리 매칭 성과, 구직자 상담 품질, 취업지원 프로그램 운영 능력, 취약계층 고용지원 실적, 기관 운영의 투명성·전문성, 서비스 접근성 개선 노력 등 다면적 요소를 포함합니다. 본 자료에는 인증년도, 기관명, 지역정보, 인증유효시작일자, 인증유효종료일자, 홈페이지 주소 등의 자료가 있습니다.
