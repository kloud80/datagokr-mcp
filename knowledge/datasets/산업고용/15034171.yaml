description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘경제활동별 지역내총생산(GRDP) 현황’ 데이터는 서귀포시 내 다양한 산업 분야(농림어업, 제조업, 건설업, 서비스업 등)의 부가가치 및 총생산액을 2013년부터 2021년까지 연도별로 추계한 공공 통계 자료입니다.데이터 항목으로는 연도, 산업별 생산 금액, 단위당 생산량, 물가 기준 등의 항목이 포함되며, 이를 통해 지방 경제 구조 분석, 산업별 성장 추이 탐색, 시계열 경제 지표 비교 등이 가능합니다.해당 데이터는 연간 단위로 갱신되며 CSV, XML, JSON 형식으로 공개되어 있어 지방재정 계획, 지역산업 정책 수립, 경제성장률 분석, 연구 및 학술 목적 등 다각도로 활용할 수 있는 기반 자료입니다.
