description_portal: 한국노동연구원은 국내 고용 및 기업 구조의 동태를 심층적으로 파악하기 위해 사업체패널조사(Workplace Panel Survey)를 정기적으로 수행하고 있습니다. 이 조사는 다양한 산업 및 규모의 사업체를 추적하며, 고용관계, 임금구조, 인적자원관리, 기업 경영환경 등에 대한 종합적인 데이터를 수집합니다. 이에 따라 기술변화나 인적자원관리 전략, 노사관계 변화 등의 성과를 분석하는 데 핵심적인 자료입니다.현재 공개하는 데이터는 한국노동연구원 사업체패널 1-9차년도 조사자료 통합설문지(version 1.81)로 사전설문, 인사담당자 응답용 설문, 근로자대표 응답용 설문, 부가조사설문 등으로 구성되어 있습니다. 사업체패널조사 통합설문지는 고용·노동시장 및 기업 조직구조의 변화에 대한 정밀 분석을 위해 다양한 주제를 체계적으로 설계한 질문 항목들을 연도별로 통합·정리한 문서입니다. 설문지는 실제 조사항목을 기준으로 구성되어 있으며, 각 질문 항목은 사업체의 인사관리, 노동시간, 임금 및 복지, 채용과 퇴직, 교육훈련, 노사관계, 재무 및 경영 환경, 기술변화 대응 등 여러 영역을 아우릅니다.
