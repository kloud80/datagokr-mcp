summary_user: 해외에서 리콜된 제품의 위해 내용을 리콜 건별로 담은 파일 데이터로, 리콜 종류·공표기관·리콜대상국 등이 기록되며 범위는 전국·비공간이다. 소비자나 수입·유통 사업자가 "해외에서 어떤 제품이 어느 나라 기관에 의해 어떤 위해로 리콜됐는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 리콜·안전인증 데이터와는 제품명·국가명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '국가기술표준원에서 운영하고 있는 제품안전정보포털(센터)에서 제공하고 있는 제품안전 국외리콜 위해내용 정보를 공유합니다. 제품안전 국외리콜 위해내용 데이터는 해외에서 리콜된 제품과 관련해 발생한 구체적인 사고 사례, 위해 유형, 등을 제공하는 데이터입니다.* 다만, 해당 정보는 API(API 데이터 목록명: 산업통상자원부 국가기술표준원_제품 안전인증 및 리콜 정보)로 제공되고 있는 바, 최근 데이터 수정일 이후 최신 정보를 확인하시고자 하는 분들은 API 데이터를 활용해주시길 바랍니다.'
