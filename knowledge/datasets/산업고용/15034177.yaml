summary_user: 창업진흥원 창업에듀의 일반 창업강좌 목록을 강좌 한 건당 한 행으로 담은 파일(CSV 약 99KB)로, 강좌 분류(청소년·기업가정신·아이디어 도출·사업모델 구축 등 창업 준비 단계), 강좌명, 강사, 온라인 강의 주소를 담는다. 예비창업자나 창업교육 담당자가 '사업모델을 짜는 단계에서 들을 무료 온라인 강좌는 무엇이고 어디서 보나'를 찾을 때 쓴다. 다른 데이터와 잇는 전역 조인 키나 코드표가 없어서, 연결하려면 강좌명·분류 이름을 직접 맞춰야 한다.
description_portal: 해당 데이터는 창업진흥원의 창업강좌 관련 자료로, 항목은 강좌 분류, 강좌명, 강사, 강좌 경로로 구성되어 있습니다. 강좌 분류 항목에는 청소년, 기업가정신, 아이디어 도출, 사업기회 포착, 아이템 개발 및 검증, 사업모델 구축, 사업전략 수립 등 다양한 창업 준비 단계가 포함되어 있으며, 각 분류별로 강좌명이 연결되어 있습니다. 강의명 예시로는‘청소년 기업가정신 교육’,‘아이디어 발상법’,‘시장 기회 발굴 전략’,‘아이템 개발 실무’,‘비즈니스 모델 분석’,‘전략적 창업 마케팅’등이 수록되어 있고, 해당 강의를 담당한 강사명과 온라인 강의 경로(URL) 정보도 함께 제공됩니다. 이를 통해 사용자는 관심 있는 창업 단계에 맞는 강좌를 선택하고 접근할 수 있습니다.
