summary_user: 한국전력공사가 제공하는 부산시 전기차 충전소의 충전 건별 기록으로, 충전구분(급속·완속), 충전소명, 주소, 충전기용량, 충전량, 충전 시작·종료 시각과 충전시간을 담으며 포털 설명상 2021년 1월~2022년 3월 기간을 다룬다. 충전 사업자나 지자체 분석가가 '부산에서 어느 시간대·요일에 충전 수요가 몰리고, 급속과 완속 충전기의 이용 시간은 얼마나 다른가'를 따져 충전소 운영·신규 설치 타당성을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 충전소 데이터와는 충전소명이나 주소를 매핑해 이어 써야 한다.
description_portal: 한국전력공사에서 제공하는 부산시 전기차 충전소 충전량 데이터입니다.2021년 1월부터 2022년 3월까지의 기간을 다루며, 충전구분(급속, 완속), 충전소명, 주소, 충전기용량, 충전량, 충전시작시각, 충전종료시각 등의 칼럼으로 구성되어 있습니다.이 데이터를 활용하여 시간대별, 요일별 충전량 변화를 분석하여 피크타임을 예측하거나, 급속 충전기와 완속 충전기의 활용 빈도 및 충전 시간을 비교할 수 있습니다.이러한 분석은 충전 인프라의 효율적인 운영 방안을 모색하거나, 신규 충전소 설치의 사업 타당성을 평가하는 데 활용할 수 있습니다.
