summary_user: 서울 종로구에 등록된 대규모점포를 점포 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.4KB)로, 사업장명·전화번호·소재지면적(㎡)·도로명주소·업태구분명과 데이터 기준일이 들어 있습니다. 종로구 안에 어떤 대형마트·백화점·쇼핑센터 같은 대규모점포가 어디에 얼마나 큰 면적으로 있는지 확인하려는 상권 분석가나 주변 입점을 검토하는 사업자가 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 도로명주소나 사업장명을 맞춰 붙이거나 전국대규모및준대규모점포표준데이터·소상공인 상가업소 데이터와 주소 기준으로 대조해 쓴다.
description_portal: 본 데이터는 서울특별시 종로구에 등록된 대규모점포의 현황을 정리한 자료로, 유통산업발전법에 따라 일정 규모 이상의 판매시설을 보유한 사업체에 대한 정보를 제공합니다. 수록 항목에는 사업자명, 전화번호, 소재지면적, 지번주소, 도로명주소, 업태구분명 등이 포함되어 있으며, 등록된 점포의 입지 특성 및 업태 유형을 분석할 수 있도록 구성되어 있습니다.해당 자료는 지역 내 유통시설 현황을 파악하고 상권 구조 분석, 유통정책 수립, 유통업체 관리, 소비자 편의 개선 등의 기초자료로 활용됩니다. 특히 유사 업종 간의 경쟁 분석, 지역경제 활성화 전략 마련, 대규모점포 관련 민원 대응, 건축 및 도시계획 수립 등 다양한 행정적·정책적 목적에 참고자료로 제공됩니다.
