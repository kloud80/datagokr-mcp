summary_user: 한국가스기술공사가 수행한 과거 프로젝트를 프로젝트 1건당 1행으로 담은 건별 이력 파일로, 프로젝트명·발주자·계약일·준공일·위치·진행여부·구분 등을 담는다(포털 설명 기준 203건, 전국 범위). 가스 배관 설계·감리나 LNG 저장탱크 설계 같은 용역을 검토하는 사업자나 분석가가 "이 공사가 어떤 발주처와 어느 시기에 어떤 유형의 사업을 수행했나"를 확인하는 데 쓴다. 공사 내부 식별자인 프로젝트코드(kgt_project_cd)가 유일한 키이고, 다른 기관 데이터와 바로 맞물리는 표준 코드(행정구역·사업자번호 등)는 없어 위치나 발주자명을 문자로 맞춰 이어 써야 한다.
description_portal: 이 파일은 한국가스기술공사의 과거 프로젝트 이력을 담고 있는 데이터로, 총 203건의 프로젝트 정보가 포함되어 있습니다. 각 프로젝트는 고유의 코드와 명칭, 발주자 정보, 계약 및 준공 일자, 위치, 진행 여부, 등록일, 조회수, 그리고 분류 구분 등의 항목으로 구성되어 있습니다.이 데이터는 프로젝트 관리, 이력 분석, 공정 계획, 또는 성과 분석 등의 용도로 활용될 수 있으며, 특히 특정 시기나 지역의 프로젝트 흐름을 파악하는 데 유용합니다. 예를 들어 러시아 PNG 사업, 국내 배관 설계·감리 용역, LNG 저장탱크 설계 등 다양한 사업 유형이 포함되어 있으며, 등록일 기준 2016년부터 2020년 사이에 다수의 과거 프로젝트가 정리된 것으로 보입니다.
