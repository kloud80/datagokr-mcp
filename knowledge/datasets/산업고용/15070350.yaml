description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 2016년 12월 31일 기준 연령별 매출 현황을 정리한 자료입니다. 데이터 항목은 연도, 연령대, 이용객수(남자, 여자, 외국인), 매출액(남자, 여자, 외국인)으로 구성되어 있으며, 이를 통해 각 연령대별 성별 및 외국인 방문객 수와 그에 따른 매출 기여도를 비교 분석할 수 있습니다. 연령대 구분은 00대부터 시작해 10단위로 구분되며, 70대 이상의 고연령층은 ‘70대 이상’으로 통합되어 있습니다. 이용객수 항목은 남자, 여자, 외국인으로 나뉘어 해당 연령대의 면세점 방문 규모를 나타내고, 매출액 항목은 각 인구군의 소비 실적을 금액으로 제시하고 있어, 연령대 및 성별, 국적별 소비 성향을 세밀하게 파악할 수 있습니다. 이 데이터는 고객군별 마케팅 전략 수립, 연령별 인기 상품 기획, 맞춤형 서비스 제공 등 면세점 운영의 의사결정 기반 자료로 활용될 수 있으며, 관광 소비 패턴 분석 및 정책적 판단에도 유의미한 정보를 제공합니다.
