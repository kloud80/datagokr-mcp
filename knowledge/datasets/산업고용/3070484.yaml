summary_user: 부산광역시 금정구 관내 LP가스 판매·충전 업체를 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·소재지와 판매업 세부 내역을 적은 비고로 구성된다(포털 설명상 2025년 8월 기준 17개 업체). 금정구 주민이나 사업자가 '우리 동네에서 LP가스를 배달·판매하거나 충전하는 업체가 어디 있나'를 확인하거나, 분석가가 구 단위 LPG 취급업소 분포를 볼 때 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 소재지 주소를 지오코딩하거나 업소명으로 맞춰 오피넷 충전소 정보나 다른 시군구의 같은 현황 파일과 이어 쓴다.
description_portal: 부산광역시 금정구 관내 소재 LP가스 판매 및 LP가스 충전 업체 현황에 관한 정보입니다.2025년 8월 기준으로 총 17개 업체가 영업 중이며, 부산광역시 금정구 내 LP가스를 취급하는 업체명과 업체 주소를 포함하고 있습니다.기타 자세한 사항은 금정구 대표 누리집 내 사전정보게시판(https://www.geumjeong.go.kr) 참고 부탁드립니다.가스판매업 및 가스충전사업 등록에 관해서는 자격을 갖추어 주시고 법제 처 내 서식을 작성하여 전화 후 구청을 방문하여 주시기 바랍니다.개방된 데이터 외의 정보는 개인정보보호법으로 제공이 어려운 점 양지하여 주시기 바랍니다.가스판매업의 상세 내역에 관해서는 비고란 참고 부탁드립니다.
