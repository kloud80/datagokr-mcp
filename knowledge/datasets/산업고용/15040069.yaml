summary_user: 서울 관악구 안 어린이집·주민센터·청사·체육·문화시설 등에 설치된 태양광발전시설을 시설 한 곳당 한 행으로 담은 소규모 원장(csv 약 2KB)으로, 시설명·소재지·발전용량·설치연도를 기록한다. 관악구 공공시설 태양광이 언제 어느 규모로 들어섰는지 확인하거나, 구내 시설별 설치용량을 비교해 재생에너지 확대 계획을 검토하려는 주민·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 시설명을 맞춰 연결해야 하며, 전국 태양광발전소 전기사업허가 표준데이터와 주소·용량 기준으로 대조하는 정도가 현실적이다.
description_portal: 본 데이터는 서울특별시 관악구 내 태양광발전시설의 설치 현황을 정리한 자료로, 시설명, 소재지, 발전용량, 설치연도를 통해 각 시설이 언제 설치되었으며 어느 규모(용량)로 운영되고 있는지를 확인할 수 있습니다. 어린이집, 주민센터, 청사, 체육시설, 문화시설 등 공공·생활 기반 시설에 태양광 설비가 분포해 있으며, 설치연도는 2008년부터 2025년까지로 관악구의 태양광 도입이 단계적으로 확대되었음을 보여주는 기초 정보입니다. 또한 발전용량 수치는 시설별 설치 규모를 비교하거나 향후 에너지 효율 및 재생에너지 활용 계획을 검토하는 데 참고할 수 있는 자료로 활용될 수 있습니다. 이 데이터는 시설 존재와 설치용량 중심의 현황 파악용 자료이며, 운영 방식이나 발전량 등 세부 정보는 포함되어 있지 않습니다.
