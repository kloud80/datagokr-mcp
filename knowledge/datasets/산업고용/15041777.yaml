summary_user: 한수원 원자력 품질 요건(Q·A등급)이 적용되는 기자재 구매·정비공사·용역·기기수리 분야의 유자격 공급자를 공급자×품목 단위로 담은 명부 파일(CSV)로, 품목역무·운용구분·품질등급·품목코드·품목명·유자격만료일·공급자명·본사주소·대표전화를 담는다. 사업자가 특정 원전·수력 품목 입찰에 어떤 업체가 자격을 갖고 있고 그 자격이 언제 만료되는지 확인하거나, 분석가가 원전 공급망 업체의 지역 분포를 파악하는 데 쓴다. 품목코드(khnp_qvd_item_cd)를 키로 한수원 품목 기준의 다른 자료와 잇고, 본사주소를 행정구역으로 변환하면 지역 단위 자료와 연결한다.
description_portal: 원자력 품질 요건이 적용(Q,A등급)되는 기자재 구매(보조기기 및 예비품), 정비공사, 용역 및 기기수리 등 유자격 공급자의 순번, 품목역무, 운용구분, 품질등급, 품목코드, 품목명, 유자격만료일, 공급자명, 본사주소, 연락처 현황 관련 자료입니다.한수원 유자격 품목(원자력 및 수력/양수)이 적용되는 특정한 입찰에 참가하기 위해서 필요한 자격이며, 경영/기술/품질 심사를 거쳐 발급됩니다.자세한 내용은 한수원 공급자관리지침을 참조바랍니다.해당 정보는 입찰에 관한 충분한 정보제공 또는 행정관청의 기업지원 정책수립 등 공적인 목적으로 제공되고 있음을 충분히 인지하시고, 이 정보를 활용한 영리활동 등은 유의하시기 바랍니다.
