summary_user: 한국가스안전공사 가스안전연구원이 직무발명으로 보유한 지식재산권의 기술이전 계약을 건별로 담은 파일로, 협약일·시작일·종료일·종료여부·계약건명(기술)·이전기업·유상여부를 기록하며 포털 설명상 2011년부터 2025년까지를 다룬다. 가스 안전 분야 기업이나 기술사업화 분석가가 어떤 가스안전 기술이 어느 기업에 유상 또는 무상으로 이전됐는지, 계약이 아직 유효한지를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 기술이전·기업 데이터와는 기업명이나 기술명을 직접 맞춰 이어 써야 한다.
description_portal: '가스안전연구원에서 직무발명을 통해 보유하고 있는 지식재산권에 대한 기술이전 현황을 공유하여 기술이전 홍보 및 공공-민간의 상생 도모하기 위한 데이터입니다.해당 데이터는 협약일, 시작일, 종료일, 종료여부, 계약건명(기술), 기술이전기업, 유상여부로 구성되어 있습니다.기술이전 홍보, 민간과 공공의 상생에 대한 정책 수립 및 통계 수집 등에 활용할 수 있습니다.※ 데이터 집계범위 : 2011년부터  2025년까지※ 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.- 데이터기준일 : 2025년 12월 31일'
