summary_user: 경기도 가맹사업 서비스 실태조사의 평가 문항을 문항 하나당 한 행으로 담고, 문항 번호·문항 내용·등급코드값을 짝지은 문항 정의 데이터다. 가맹·창업지원 정보 서비스의 만족도 조사를 설계하거나 비교하는 분석가가 메뉴 구성이나 정보 이해 용이성 같은 항목을 어떤 문항과 등급으로 평가했는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 문항 내용이나 등급코드를 직접 맞춰야 하며, 같은 세부 부문인 지방행정 인허가(LOCALDATA) 업종 원장과도 바로 이어지는 키는 없다.
description_portal: '이 데이터는 가맹사업과 관련된 시스템 및 서비스에 대해 이용자들이 인식하고 평가한 실태를 조사하기 위해 구성된 서비스 실태조사의 항목 문항 데이터입니다. "평가항목번호", "평가항목내용", "등급코드값"으로 구성되어 있으며, 서비스의 구체적인 만족도 측정을 위한 질문(예: 메뉴의 구성 적정성, 정보의 다양성, 이해 용이성, 정보수집 시간 절약 여부 등)에 대한 등급코드가 매칭되어 있습니다. 본 데이터는 고객의 실제 서비스 경험을 기반으로 한 정성적 평가 항목을 코드화한 것으로, 시스템 품질 개선, 고객중심 서비스 설계, 창업지원 정보 플랫폼 고도화 등에 활용될 수 있습니다. 또한 정기적인 피드백 수집 및 비교분석을 통해 공공서비스의 신뢰도와 만족도 향상에 기여할 수 있는 기초 자료로 활용 가능합니다.'
