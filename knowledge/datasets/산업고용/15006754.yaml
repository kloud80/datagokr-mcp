summary_user: 한전KPS가 보유한 발전설비 정비 분야 지식재산권을 건별로 담은 파일 데이터로, 발명의 명칭·출원번호·출원일·등록번호·등록일·권리존속기한을 한 행씩 기록한다(CSV 약 23KB). 기술 분석가나 협력 희망 기업이 한전KPS가 어떤 정비 기술을 특허로 확보했고 그 권리가 언제까지 유지되는지 확인하는 데 쓴다. 출원번호(kipo_appl_no)와 등록번호(kipo_rgst_no)가 특허청 번호 체계의 키이므로, 특허청 출원·등록 정보와 이어 붙여 청구항·출원인·법적 상태를 보강한다.
description_portal: 한전KPS(주)에서 보유하고 있는 발전설비정비 지식재산권 현황에 대한 정보를 정리한 데이터로 발명의 명칭, 출원번호, 출원일, 등록번호, 등록일, 권리존속기한 등의 정보를 제공합니다. 주요 활용처로는 기술 동향 분석, 기술 범위 분석, 협업 현황 파악, 지식재산권 관리, 산업재산권 전략 수립, 기업 기술 경쟁력 분석, 에너지 기술 개발 성과 검토 등에 활용될 수 있습니다. 해당 자료는 회사정보보호규정(정보등급분류기준) 및 기술정보관리지침(기술정보등급분류기준)에 의거 사외공개 가능한 기술자료로 데이터 변동이 있을 시에 현황 자료로 갱신하여 공개할 예정입니다.
