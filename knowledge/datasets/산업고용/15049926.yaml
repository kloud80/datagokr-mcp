summary_user: 한국가스공사의 일 단위 천연가스 공급량 가운데 역대 최대 25일을 공급량 내림차순으로 정리한 전국 단위 순위 집계로, 발전용과 도시가스용의 날짜·공급량(톤)을 담은 작은 csv 파일(974 bytes)입니다. 에너지 분석가나 수급 담당자가 '역대 천연가스 피크 수요는 어느 날 얼마였고, 발전용과 도시가스용이 각각 얼마였나'를 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 날짜 값을 맞춰 일별 기상·전력 수급 자료와 나란히 놓고 보는 방식으로만 잇습니다.
description_portal: 한국가스공사가 제공하는 역대 일일 최대 공급량 순위 데이터는 국내 천연가스 피크 수요 현황을 파악할 수 있는 자료입니다. 본 데이터는 일 단위로 집계한 총 천연가스 공급량 데이터 중 가장 큰 공급량을 기록한 상위 25건의 데이터를 내림차순으로 정리하였습니다.해당 데이터는 한국가스공사의 역대 일일 최대공급량 순위 이며, 일별 총 공급량 기준일로 각 해당일의 도시가스,발전 공급량을 나타낸 자료 입니다. 데이터는 총공급량을 기준으로 내림차순으로 정렬되어 있습니다. 해당 자료의 단위는 톤(ton)입니다. 공공데이터 공개 대상 자료는 2021년도 1월부터 현재까지 기간의 자료를 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 연간 단위이며, 매년 1월에 전년도 자료 업데이트를 시행합니다. 공개된 데이터의 파일 형식은 csv 파일입니다.
