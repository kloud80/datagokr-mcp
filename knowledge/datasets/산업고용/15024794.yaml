summary_user: 경상남도 의령군에서 담배소매인으로 지정된 업소를 한 행에 한 곳씩 담은 건별 원천 파일로, 업소명·지번주소·도로명주소·지정일자·영업구분(상태)을 담는다. 의령군에서 편의점·슈퍼 창업을 검토하는 사람이나 상권 분석가가 '이 동네에 영업 중인 담배소매인이 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업소명·주소를 맞춰 보거나 지방행정 인허가(LOCALDATA) 담배소매업 원장·소상공인 상가업소 정보와 이름·주소로 대조해 이어 쓴다.
description_portal: 본 데이터는 경상남도 의령군에서 담배를 판매할 수 있도록 지정된 소매인에 대한 정보로, 업소명과 업소의 지번주소, 도로명주소, 지정일자, 현재 영업구분(상태)을 제공합니다. 본 데이터는 지역 내 담배소매인 지정 현황을 투명하게 공개함으로써 담배 유통 관리, 신규 지정 검토, 상권 분석 등의 행정 업무 및 민간 활용을 지원합니다. 담배소매인은 「담배사업법」에 따라 군수의 지정을 받은 자로, 본 데이터는 누구나 자유롭게 열람할 수 있도록 공개되어 있으며, 공정한 유통구조 형성과 지역상권 이해를 위한 기초자료로 활용됩니다. 또한, 편의점·슈퍼마켓 운영자, 창업 희망자, 정책 입안자 등 다양한 수요자가 활용할 수 있는 유용한 공공데이터입니다. 본 데이터는 정기적으로 갱신되어 최신 현황을 제공합니다.
