description_portal: BSI 지수란 사업체의 실적과 계획 등에 대한 주관적 의견을 수치화하여 전반적인 경기동향을 파악하는 경기 예측 지표를 의미합니다. 본 데이터는 전통시장의 경기전반, 매출, 영업, 구매고객 수 등의 체감지수를 바탕으로 시장 경기동향을 수치화한 자료입니다. 정기적으로 조사되어 시계열 분석이 가능하며, 소상공인 정책 방향 설정 및 경기 회복 지표 모니터링 자료로 활용할 수 있습니다. 특히 전통시장 운영 환경 변화나 소비현황 진단을 위한 참고지표로 유의미하며, 정부의 맞춤형 지원 및 대응 정책 수립에 필요한 기초 통계로 활용할 수 있습니다. 향후 유사 사례 발굴 및 정책 설계의 참고 자료로도 활용될 수 있습니다.
