summary_user: 서울 강남구 안의 태양광 발전소를 설치장소별로 한 행씩 정리한 소규모 원장 파일(csv 약 2KB)로, 도로명·지번 주소, 건물 높이(지상·지하 구분)와 면적, 설비용량(kW), 발전유형, 최초허가일과 사업개시일을 담는다. 강남구 주민이나 에너지 분석가가 '강남구에서 어느 건물에 몇 kW 규모의 태양광이 언제부터 운영되고 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 전국태양광발전소전기사업허가정보표준데이터 같은 다른 데이터와는 소재지 주소나 시군구명을 맞춰 이어 써야 한다.
description_portal: 강남구 태양광 발전소 현황(발전소, 건물높이, 건물면적, 설비용량, 소재지도로명, 소재지지번주소, 최초허가일, 사업개시일, 발전유형)해당 설치장소별로 정리되어 있으며, 건물 높이는 지상과 지하를 구분해서 표시해 놨습니다. 태양광 패널이 실제로 어느 층에, 어떤 높이에 설치되어 있는지 파악하는 데 유용하게 참고될 수 있습니다. 용량(kw단위)과  발전유형을 기재해 놨습니다. 최호허가일, 사업개시일, 데이터 기준일자는 YYYY-MM-DD형태입니다.데이터 기준일은 2021-04-19이며, 데이터 이용시 참고하시기 바랍니다.
