summary_user: 인천광역시 부평구 안에서 공공·관광·교육문화·근린생활시설이 아닌 기타시설에 설치된 전기차 충전기를 충전기 한 대 단위로 담은 파일로, 운영기관·충전소명·충전기 유형·용량(kW)·이용가능시간·주소를 수록한다(CSV 약 40KB). 부평구 주민이나 전기차 이용자가 '집 근처 기타시설에 급속 충전기가 있고 몇 시까지 쓸 수 있나'를 확인하거나, 분석가가 시설 종류별 충전 인프라 분포를 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 충전소 데이터와는 주소나 충전소명·충전기ID를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: '기타시설에 설치된 전기차 충전소의 운영기관, 위치, 충전기 정보, 이용 가능 시간 등을 수록한 데이터.공공·관광·교육문화·근린생활시설 외 기타 다양한 시설에 설치된 충전 인프라 현황을 파악하고, 전기차 충전 수요 분산, 친환경 교통 인프라 확충, 이용자 편의 증진 등에 활용 가능하다.활용 목적 및 특징– 기타시설 내 전기차 충전소 분포 현황 분석– 충전기 타입·용량별 인프라 구성 파악– 시설구분·주소 기반 충전소 입지 특성 확인– 친환경 교통 활성화 및 충전 인프라 정책 수립 근거 자료 활용주요 항목 설명● 운영기관: 충전소를 설치·운영하는 기관 명칭● 충전소: 전기차 충전소의 명칭 또는 위치● 충전기ID: 충전기를 구분하는 고유 식별번호● 충전기타입: 급속·완속 등 충전기 유형● 시설구분: 충전소가 설치된 기타시설의 종류● 주소: 충전소 소재지 주소● 이용가능시간: 충전소 운영 가능 시간대● 충전용량: 해당 충전기의 최대 충전 용량(kW)'
