summary_user: 부산광역시 영도구가 허가한 액화석유가스(LPG) 판매업소를 업소 한 곳당 한 행으로 담은 작은 CSV 파일(약 1.4KB)로, 업소명·소재지·대표자·전화번호·허가일을 담는다. 영도구에서 LPG를 사려는 주민이나 지역 연료 공급망을 조사하는 분석가가 '영도구 안에 허가받은 가스 판매소가 어디에 있고 언제 허가됐나'를 확인하는 데 쓴다. 전역 조인 키나 좌표·사업자 ID가 없으므로, 다른 구의 같은 현황이나 인허가 데이터와는 업소명·주소 문자열을 맞춰 이어 쓴다.
description_portal: 액화석유가스 판매소 현황은 부산광역시 영도구에서 허가 받은 액화석유가스 판매업소에 대한 데이터로 업소명, 소재지, 대표자, 전화번호 등 기본정보로 구성된 데이터입니다.(※ 액화석유가스 판매업을 하려는 자는 액화석유가스의 안전관리 및 사업법에 따라 관할 구청 등에 허가를 받아야 함)액화석유가스의 안전관리 및 사업법에 따라 변경사항이 있는 경우에도 주기적으로 데이터를 업데이트 하여 정보를 제공하고 있습니다.해당 자료는 연구를 위한 자료 수집 또는 액화석유가스를 구매를 원하시는 분들이 인터넷 검색을 통하여 부산광역시 영도구 내 허가받은 액화석유가스 판매 사업자 현황을 제공하고 있습니다.
