description_portal: 한국산업기술진흥원의 사업 수행을 통해 성과발생년도 기준으로 2022년도부터 발생한 특허 등록 및 출원 현황을 담고 있습니다. 본 데이터는 기관명, 발명 명칭, 출원 국가 등의 내용을 포함하고 있으며, 기업이나 연구 기관들이 연구개발 결과물을 지식재산권으로 보호하는 데 필수적인 정보입니다. 이러한 데이터는 연구자, 기업, 정부기관이 혁신적인 기술 개발을 추적하고, 산업의 발전 가능성을 분석하는 데 활용될 수 있습니다. 또한, 특허 등록 및 출원의 경향성을 파악하여 향후 연구 및 개발 전략을 수립하는 데에도 매우 유용한 자료입니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 성과발생년도(숫자형), 순번(숫자형), 기관명(문자형), 출원등록국가명(문자형), 출원등록구분명(문자형), 출원등록번호(문자형), 발명명칭(문자형), 출원등록기관(문자형) 등으로 구성되어 있습니다.
