summary_user: 서울특별시 양천구 관내 이용업(이발소 등) 사업장의 인허가 내역을 사업장 한 곳당 한 건으로 담으며, 인허가일자, 영업상태와 폐업일자, 소재지 지번·도로명 주소, 좌표(X·Y), 시설 면적, 건물 층수, 종사자 수 같은 항목이 들어 있다. 양천구에서 현재 영업 중인 이발소가 어느 동에 몇 곳 있는지, 최근 몇 년간 폐업이 늘었는지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 좌표를 이용해 지도·상권 데이터에 공간적으로 겹쳐 쓴다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 이용업 사업장의 인허가 현황을 체계적으로 관리하기 위해 구축된 자료이다. 데이터는 사업장명, 허가번호, 업종구분, 소재지, 허가일자, 유효기간, 관할관청, 안전관리 사항 등 주요 정보를 포함하고 있어 각 사업장의 운영 상태와 인허가 적법 여부를 정확히 확인할 수 있도록 구성되어 있다. 본 자료는 지방자치단체의 행정 관리, 산업 지도, 정책 수립 등에 활용 가능하며, 시민과 연구자는 이용업 분포, 사업장 운영 실태, 안전관리 현황 등을 분석하는 데 있어 신뢰성 있는 정보 자원으로 활용할 수 있다.* 이용업 - 이발소와 같이 머리 또는 수염을 깎거나 다듬는 등의 방법으로 용모를 단정하게하는 업소
