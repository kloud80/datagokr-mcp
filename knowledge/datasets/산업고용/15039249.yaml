summary_user: 전국 창업보육센터 247곳을 센터 단위 한 행씩 담은 목록으로, 지역·시군구·센터명·운영주체·연락처·주력보육분야·우편번호·주소를 싣는다. 창업을 준비하는 사람이 내 지역에 어떤 센터가 있고 주력 보육분야가 무엇인지 찾는 질문이나, 분석가가 지역별 센터 분포를 보는 데 쓴다. 주소와 상세주소가 조인 키라서 주소 기반으로 다른 지역 데이터와 이어 쓰며, 사업자번호 같은 기업 식별 키는 필드에 없다.
limits: 센터 위치와 기본 정보만 있어 입주 기업 목록, 모집 여부, 지원 내용의 세부는 알 수 없다. 사업자번호 필드가 없어 인증서 등 기업 단위 원장과는 바로 연결되지 않고 주소로 맞춰야 한다. 포털 파일 다운로드는 2026-10-02에 확인된 것이며 이후 갱신 주기는 근거가 없다.
