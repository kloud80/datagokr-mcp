description_portal: '한국산업기술진흥원의 글로벌테크코리아 행사 안내입니다. 본 데이터는 2019년부터 한-세계 간의 산업기술 협력을 도모하기 위해 시행되는 다양한 GT온라인 행사와 세미나에 대한 정보를 제공합니다. 이 데이터는 연구자 및 산업체가 세계 각국과의 기술 협력을 통해 새로운 기회를 모색하는 데 있어 유용하게 활용될 수 있습니다. 데이터는 행사명, 개최일자, 종료일, 장소, 주최자, 주요 내용 등을 포함하고 있으며, 각 항목은 행사에 대한 상호 참조가 가능하도록 구성되어 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.행사명(문자형): 행사 제목시작일(날짜형): 행사가 시작되는 날짜종료일(날짜형): 행사가 종료되는 날짜개최장소(문자형): 행사가 개최되는 장소주최자(문자형): 행사를 주최하는 기관의 이름주요내용(문자형): 행사의 핵심 주제 및 내용 이를 통해 사용자는 행사 일정을 파악하고, 산업기술 관련 정보에 대한 통찰을 얻을 수 있습니다.'
