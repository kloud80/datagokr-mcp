summary_user: 제주 지역 주유소 면세유(휘발유·경유·등유 등)의 월평균 판매 가격을 연월과 제품 구분별 원/리터 단가로 담은 집계 자료이며, 포털 설명상 기간은 2016년 1월부터 2021년 10월까지입니다. 농어업인이나 분석가가 "제주에서 농업용 면세 경유 가격이 어느 달에 급등했나"처럼 면세유 비용 추이와 계절 변동을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 유가·물가 데이터와는 연월과 유종 이름을 맞춰서만 연결한다.
description_portal: 이 데이터셋은 제주특별자치도가 공개한 ‘주유소 면세유 월평균 판매 가격’ 정보로, 2016년 1월부터 2021년 10월까지 제주 지역 내 주유소에서 판매된 면세유(휘발유, 경유, 등유 등)의 월별 평균 단가를 집계한 자료이다. 각 월의 평균 가격은 해당 기간 내 모든 주유소의 면세유 판매가격을 합한 뒤 전체 주유소 수로 나누어 산출한 값이며, 데이터는 CSV 형식으로 제공되어 누구나 활용 가능하다. 이 자료는 제주 지역의 유류비 변동 추이 분석, 물가 및 생활비 연구, 운송비·물류비용 산정, 농업·어업 등 면세유 사용 비중이 높은 분야의 비용 예측, 대중교통 및 농어업 보조정책 설계, 연료비 부담 변화에 따른 사회경제적 영향 분석 등 다양한 행정·연구 목적으로 활용 가능한 기초 통계다. 또한 월별 가격 흐름을 통해 계절별 유가 변동 패턴, 유가 급등락 시점 파악, 연료 보조정책 타이밍 설정, 비용 대비 효율성 분석 등의 정책 기획 근거로서 의미가 있다.
