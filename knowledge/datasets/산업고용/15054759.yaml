description_portal: 이 자료는 2023년 기준 문화체육관광부가 실시한 콘텐츠산업조사를 토대로 광주광역시의 콘텐츠산업 현황을 정리한 통계 데이터입니다. 출판, 만화, 음악, 영화, 게임 등 주요 산업 분야별 전국 대비 광주의 사업체 수, 매출액, 종사자 수를 비교할 수 있도록 구성되어 있습니다. 예를 들어 출판업은 광주에 897개 사업체가 존재해 전국의 2.8%를 차지하며, 매출은 3,993억 원으로 전국의 1.7% 수준입니다. 영화산업은 전국 대비 건수 비율은 낮지만 매출 비중이 3.1%로 상대적으로 높아 특화된 성과를 보여주고 있습니다. 이 데이터는 지역 콘텐츠산업의 규모와 경쟁력을 객관적으로 파악하고 향후 정책 수립과 투자 전략 수립에 기초자료로 활용될 수 있습니다. 본 자료의 작성 기준일은 2023년 12월이며, 공식 발표일은 2025년 3월입니다.
