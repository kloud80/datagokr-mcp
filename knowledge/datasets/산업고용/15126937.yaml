summary_user: 근로복지공단 고용보험 가입 사업장별로 사업장명·사업자등록번호(일부)·소재지(시도·시군구·행정동), 상시근로자수, 부과월 기준 피보험자 수, 12월 월보험료 부과액을 담은 사업장 단위 연간 파일로, 포털 설명상 2021년 12월~2023년 12월분을 전국 범위로 제공한다. 구직자나 분석가가 "우리 지역에서 상시근로자 규모가 큰 사업장은 어디이고 고용보험료는 얼마나 부과되는가" 같은 질문에 사업장 규모와 고용 현황을 가늠하는 데 쓴다. 사업자등록번호(bizno)를 키로 국민연금 가입사업장·기업정보 등 사업자번호를 가진 데이터와 잇고, 시도·시군구 주소로 지역 고용동향과 묶어 쓴다.
description_portal: '근로복지공단 고용보험 가입 사업장의 고용보험료 부과내역입니다.(제공 기간: 2021년 12월~2023년 12월)- 사업장명, 사업자등록번호(일부제공), 사업장 소재지,  상시근로자수, 12월 피보험자 수 및 12월 순수 월보험료 부과액 정보 제공* 단, 개인사업장 및 상시근로자수 1인 이하 사업장, 피보험자 1인 이하 법인사업장 정보 미제공* 건설업, 벌목업 등 자진신고 사업장 제외※도로명 주소 도입으로 인해 "사업장 주소 행정동"에 공란인 데이터가 있을 수 있습니다. 활용에 참고하여 주시기 바랍니다.'
