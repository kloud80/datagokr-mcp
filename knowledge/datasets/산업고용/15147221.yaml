summary_user: 서울시 행정동별 직장인구를 분기 단위로 집계한 데이터로, 총 직장인구와 남녀별·연령대별(10대~60대 이상) 인원, 성별×연령대 교차 인원을 담는다. 창업 예정자나 상권 분석가가 '이 행정동에서 평일 낮에 일하는 30~40대 직장인이 얼마나 되나'를 따져 점심 장사나 업종 입지를 판단할 때 쓴다. 전역 조인 키는 없으며, 행정동 코드·이름(ADSTRD_CD)과 기준 연도분기 코드로 같은 서울시 상권분석서비스 계열 데이터나 행정동 이름·코드 매핑을 거쳐 소상공인 상가업소 데이터와 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 인증키가 따로 필요하며 공공데이터포털 활용신청과는 별개다. 포털 설명은 '상주인구'라고 적고 있으나 필드는 직장인구 항목이므로 상주인구 자료로 해석하지 않도록 주의한다. 전역 조인 키가 없어 다른 기관 데이터와는 행정동 이름·코드 매핑으로만 연결된다.
