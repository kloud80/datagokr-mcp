summary_user: 중소벤처기업진흥공단의 수출두드림 등 수출지정제도로 인증받은 기업을 기업 한 곳당 한 행으로 담은 명단 파일(csv, 약 47KB)로, 구분·지정연도·기업명·유효기간을 담는다. 수출지원 정책 담당자나 분석가가 '어느 해에 어떤 기업이 수출지정 기업으로 지정됐고 인증이 아직 유효한가'를 확인하거나 연도별 지정 추이를 볼 때 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 인증·지원 데이터와는 기업명 매칭으로만 연결한다.
