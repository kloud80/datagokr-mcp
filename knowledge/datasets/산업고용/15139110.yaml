description_portal: 중소벤처기업진흥공단은 정책자금 집행의 투명성을 확보하고 중소벤처기업의 규모별 자금 수요를 분석하기 위해, "직접대출 규모별 잔액 현황" 데이터를 공공데이터 포털을 통해 공개하고 있습니다. 이 데이터는 대출 잔액을 억원 단위로 세분화하여 제공하며, 다양한 규모별 구간으로 분류되어 있습니다.이를 통해 사용자는 소액 대출을 받은 기업의 규모나 고액 대출을 받은 기업의 수를 파악할 수 있습니다. 각 대출 규모별 잔액과 함께 해당 대출을 받은 업체수 정보도 포함하고 있어, 기업의 자금 수요가 주로 어느 구간에 분포하는지를 구체적으로 분석하고, 기업 규모에 맞는 맞춤형 금융 지원 정책을 수립하는 데 중요한 자료로 활용됩니다.
