description_portal: 한국수력원자력(주)은 공공기관으로서 국민의 알 권리와 공공기관의 투명성을 실현하기 위하여 해외 사채 발행 현황에 대한 데이터를 공개합니다. 당사에서 공개하는 해외사채 발행현황 데이터는 회사가 타인자금을 조달하기 위해 발행한 해외 회사채 관련 주요정보를 담고있습니다.해외 회사채는 글로벌 금융시장에서 자금을 조달한 회사채를 의미합니다. 이 공개 데이터는 2025년 9월 10일을 기준으로 상환되지 않은 잔여 해외 회사채를 발행일, 금액, 이자율, 잔액, 상환일과 만기에 관한 정보를 제공하고 있습니다.
