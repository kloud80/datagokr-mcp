description_portal: 해당 데이터는 서울시 여성경영사업체 종사자수 통계(종사상 지위별·성별·동별)로, 서울 전역의 여성 대표 사업체에서 근무하는 종사자 규모와 구성 특성을 세부적으로 파악할 수 있도록 정리된 자료입니다. 각 동을 단위로 상용근로자, 임시·일용근로자 등 종사상 지위별 인력 분포를 확인할 수 있으며, 남녀 구성을 함께 제시해 지역별 노동 구조의 차이를 비교할 수 있습니다. 이를 통해 여성 경영인의 활동이 어느 지역에서 활발한지, 여성 종사자 비중이 어떤 패턴을 보이는지 등 정책·연구·지역 경제 분석에 유용한 기초 정보를 제공합니다.
