summary_user: 한국남부발전 신인천 주차장 부지 태양광 설비의 발전실적을 일자·호기별 한 행으로 담는 파일(csv, 약 376KB)로, 일 총량·평균·최대·최소와 1시부터 24시까지 시간대별 발전량(kW)을 기록한다. 분석가가 '이 주차장 태양광은 계절·시간대에 따라 발전량이 어떻게 달라지나'를 보거나 발전 성능 평가·발전량 예측 모델의 학습 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 날짜(년월일)를 기준으로 같은 기간의 기상·전력수급 자료와 맞대어 쓰거나 같은 기관의 다른 발전실적 파일과 이름으로만 연결한다.
description_portal: 본 파일 데이터는 한국남부발전(주)의 신인천 주차장 태양광발전실적입니다. 이 데이터는 신인천 지역의 주차장 부지에 설치된 태양광 발전 설비의 일별, 시간별 전력 생산량에 대한 자료입니다.본 파일 데이터는 년월일, 호기, 총량(kw), 평균(kw), 최대(kw), 최소(kw), 최대(시간별_kw), 최소(시간별_kw), 그리고 시간대별 발전량(kw)으로 구성되어 있습니다. 데이터는 일자별로 일간 총 발전량과 평균, 최대, 최소 발전량을 기록합니다. 1시부터 24시까지의 매 시간대별 발전량을 상세하게 제공하여 정밀한 분석이 가능합니다.이 데이터는 태양광 발전 시스템의 성능 평가, 발전 효율에 영향을 미치는 환경 요인 분석, 그리고 전력 수요-공급 예측 모델 구축에 활용될 수 있습니다.
