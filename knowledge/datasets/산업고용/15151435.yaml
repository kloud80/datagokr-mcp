summary_user: 한국지역난방공사 소속·연계 발전소별로 일자마다 전일 공급능력(전일생산량)과 금일 공급능력(금일계획량)을 MW 단위로 기록한 건별 CSV 파일(약 2.7MB)이다. 에너지 분석가나 수급 담당자가 특정 발전소의 공급능력이 전일 대비 줄었는지 확인해 정비·고장 등 운전상태 변화를 추적하거나 설비 가동 추이를 볼 때 쓴다. 전역 조인 키(발전소 코드 등)가 없어 다른 발전설비 원장이나 태양광 발전사업 허가 표준데이터와는 발전소명 매핑으로만 연결한다.
description_portal: '한국지역난방공사의 발전소별 열·전력 공급능력 현황 데이터로, 주요 발전소의 일자별 공급용량 변동을 기록하여 에너지 생산 및 공급 효율성을 모니터링할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 실적일자: 공급능력을 측정한 기준 일자(예시: 2024-01-01)■ 발전소명: 열·전력을 공급하는 발전소의 명칭(예시: GS당진 C/C1, GS당진 C/C4, 강릉)■ 전일공급능력(전일생산량): 해당 발전소의 전일 기준 공급 가능 용량(MW)(예시: 200, 286, 700)■ 금일공급능력(금일계획량): 당일 기준 공급 가능 용량(MW)(예시: 200, 286, 700)3. 활용 예제:■ 발전소별 공급능력 변동 데이터를 활용하여 에너지 생산 효율 및 설비 가동률 분석■ 전일 대비 공급능력 증감 추이를 통해 정비·고장·운전상태를 실시간으로 모니터링■ 지역별 발전소 공급용량 데이터를 기반으로 전력·열 수급 안정성 분석 및 에너지 수급계획 수립'
