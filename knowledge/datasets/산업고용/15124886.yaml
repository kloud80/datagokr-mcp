description_portal: 전자파 적합성(EMC, Electromagnetic Compatibility)은 전자기기가 주위 다른 기기와 조화롭게 작동할 수 있도록 설계되었는지를 평가하는 시험입니다. EMC 시험은 크게 두 가지 항목으로 구성되며, 하나는 해당 기기에서 방출되는 전자기 노이즈가 일정 수준 이하로 억제되었는지를 확인하는 전자기간섭(EMI) 시험이고, 다른 하나는 외부에서 유입되는 강한 전자파 환경 속에서도 기기가 정상적인 성능을 유지하는지를 확인하는 전자기내성(EMS) 시험입니다. 전자기 장해(EMI)를 일으킬 수 있는 제품은 반드시 EMC 적합등록을 거쳐야만 국내 및 국제 시장에서 제조·판매가 가능하므로, EMC 시험은 제품의 상용화에 있어 필수적입니다. 따라서 전자파 적합성 시험 데이터는 품목별로 어떤 규격과 시험방법이 적용되는지를 이해하고, 과거 시험 부적합 사례를 분석해 제품 설계나 생산 공정에 반영함으로써 제품의 안정성과 품질 향상을 도모하는 데 유용한 기반 자료로 활용됩니다.
