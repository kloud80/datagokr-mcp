description_portal: '서울에너지공사 월별 열생산량 정보는 특정 년월을 기준으로 지사·지역·설비별 열에너지 생산 현황을 파악할 수 있는 통계 데이터입니다. 지사코드와 지사명, 지역코드와 지역명 항목을 통해 어느 지사와 어느 공급 권역에서 생산이 이루어졌는지 구체적으로 구분할 수 있는 구조입니다. 설비코드와 설비명은 열을 생산한 개별 설비(예: 열병합발전소, 보일러 등)의 종류와 특성을 나타내는 정보입니다. 열생산량 합계는 각 조건별로 집계된 총 열 생산량을 의미하며, 단위 항목을 통해사용된 계량 단위를 확인할 수 있습니다. 작업일시는 해당 데이터가 산출·등록된 시점을 보여주는 값으로, 자료의 최신성 및 관리 이력을 판단하는 기준이 됩니다. 이 데이터는 지사별·설비별 효율 분석, 공급 능력 평가, 설비 운영 계획 수립, 에너지 수급 안정성 검토 등 에너지 운영·정책 의사결정에 중요한 기초 자료로 활용될 수 있습니다.'
