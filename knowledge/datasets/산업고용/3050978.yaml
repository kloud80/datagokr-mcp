summary_user: 제주국제자유도시개발센터(JDC)가 발주한 입찰 사업을 한 건씩 담은 파일(CSV, 약 29KB)이며, 사업명·등록부서·발주(게시)일·입찰(개찰)일·계약기간을 담는다. 포털 설명상 2015년 시설관리·면세점 마케팅·박물관 물품 구매 등 13개 부서의 용역·구매 사업이 들어 있어, 사업자나 분석가가 'JDC는 어느 부서가 어떤 용역을 언제 발주하고 계약기간은 얼마나 되나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명이나 부서명을 직접 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)가 2015년 한 해 동안 진행한 주요 사업의 입찰 정보를 정리한 자료로, 각 사업의 등록 부서, 입찰 연도, 사업명이 포함되어 있습니다. 참여 부서는 시설관리처, 정보관리실, 관광사업처, 박물관사업처, 영업처, 면세기획처, 통관물류팀, 교육도시처, 의료사업처 등 총 13개 부서로 구성되어 있으며, JDC 내 다양한 기능 조직들이 추진한 각종 용역 및 구매 사업이 포함되어 있습니다. 대표적인 사업명으로는 제주첨단과학기술단지 시설종합관리용역, JDC면세점 온라인 통합 마케팅, 제주항공우주박물관 과학교구 구매, 제주항공우주박물관 프로젝터램프 구매 등이 있으며, 사업의 내용은 운영관리, 마케팅, 전시기획, 시설물 구매 등 각 부서의 고유 기능과 연계된 업무 범위를 반영하고 있습니다. 이 데이터는 JDC의 연도별 사업 추진 현황과 부서별 사업영역 분포를 파악할 수 있는 기초 자료로 활용되며, 입찰 및 계약의 행정적 투명성 확보, 향후 사업계획 수립, 유사사업 비교분석 등의 목적으로도 유용하게 활용될 수 있습니다.
