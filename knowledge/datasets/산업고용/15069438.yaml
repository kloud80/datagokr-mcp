summary_user: "중소벤처기업연수원이 운영하는 이러닝연수 과정을 과정 한 건씩 담은 목록 파일로, 구분(경영일반·직무역량향상·현장개선 등)·산업 분야·과정명·연수기간·연수비·환급 여부·신규과정 여부를 담는다. 중소기업 재직자나 인사담당자가 '우리 업종(예: 반도체, 뿌리산업)에 맞는 온라인 연수 과정이 있고, 비용과 환급 가능 여부는 어떤가'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 산업명이나 과정명 같은 이름 매칭으로만 이어 쓸 수 있다."
description_portal: '중소벤처기업진흥공단(KOSME)에서 제공하는 이러닝연수 정보입니다.해당 데이터가 보유한 컬럼은 아래와 같습니다.컬럼명 : 구분,산업,과정명,기간,연수비,환급여부,비고,신규과정 여부데이터를 통해 중소벤처기업연수원에서 운영하는 이러닝연수의 구분(기계, 경영일반, 글로벌비즈니스역량, 직무역량향상, 경영혁신, 현장개선), 산업(기계산업, 메카트로닉스, 반도체, 비즈니스스킬, 뿌리산업, 창업, 특수직무, 멀티미디어 디자인 등), 과정명, 연수기간, 연수비용, 모바일 강의 여부, 개강 예정일정 등을 확인할 수 있습니다.'
