summary_user: 비대면 서비스 바우처 플랫폼에 등록된 판매 상품을 상품코드 단위로 한 행씩 담은 원천 목록으로, 공급기업명·사업자등록번호·옵션 포함 상품명·이용기간·상품분야·가격이 들어 있고 범위는 전국이며 지역 구분이 없습니다. 바우처 수요기업이 "화상회의·협업툴 같은 분야에서 같은 이용기간 기준으로 어느 공급기업 상품이 더 싼가"를 비교하거나, 분석가가 공급기업별 등록 상품 수와 가격대를 살피는 데 쓴다. 사업자등록번호(bizno)로 기업 확인·인증 정보나 업종 인허가 등 사업자번호를 가진 다른 기업 데이터와 잇고, 상품코드(voucher_product_cd)는 같은 플랫폼의 다른 바우처 데이터와 잇는 키로 쓴다.
description_portal: 해당 데이터는 비대면 서비스 바우처 플랫폼에 등록된 상품 리스트에 대한 정보로, 상품코드, 사업자등록번호, 공급기업명, 상품명(옵션 포함), 옵션여부, 이용기간, 상품분야, 가격 항목으로 구성되어 있습니다. 각 상품은 고유한 상품코드를 통해 식별되며, 이를 통해 해당 상품을 공급하는 기업의 사업자등록번호와 공급기업명을 확인할 수 있습니다. 상품명은 옵션이 포함된 형태로 제공되며, 옵션 여부는 별도로 기입되어 있으나 일부 항목은 공란일 수 있습니다. 또한, 상품의 이용 가능 기간이 명시되어 있어 사용자가 기간별 비교가 가능하고, 상품 분야는 type2, type3 등으로 분류되어 있어 카테고리별 탐색이 용이합니다. 가격 정보도 함께 제공됨에 따라 수요자는 가격 대비 기능을 비교하며 원하는 서비스를 선택하는 데 활용할 수 있도록 구성되어 있습니다.
