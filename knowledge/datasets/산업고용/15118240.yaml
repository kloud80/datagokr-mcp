description_portal: 한국가스공사가 보유하고 있는 258종(공통  46/ 생산 103/공급 102/자원 및 해외사업 5/미래에너지 2)의 기술 및 규격표준에 적용되고 있는 국내외 표준 현황 정보를 제공합니다. 천연가스 및 LNG 관련 기술 표준의 체계적 관리와 국제 표준과의 정합성 확보를 목적으로 수집되었습니다. 데이터의 세부 항목으로는 국내외구분, 표준구분(KS/ISO/API/ASME 등), 표준번호, 표준명, 최신발행년도, 적용분야, 관련기술영역, 개정이력, 적용설비 등이 포함되어 있습니다. 본 데이터는 가스 산업 종사자, 연구기관, 설비 제조업체, 품질관리 담당자, 안전관리 기관, 표준화 정책담당자가 기술표준 준수 및 품질관리를 위한 필수 참고자료로 활용할 수 있습니다. 국내 가스 산업의 기술 표준화 현황을 종합적으로 파악하고, 국제 표준과의 비교분석 및 기술 경쟁력 강화에 기여할 것으로 기대됩니다.
