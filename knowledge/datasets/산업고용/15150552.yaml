summary_user: 한국동서발전 발전소·호기별로 날짜와 시간 단위의 연료 사용량을 공급사별(최대 6곳)로 나눠 담고, 발열량(인수식·기건식·건식)·수분·휘발분·회분·고정탄소·황 같은 연료 성상을 함께 담은 CSV 파일(약 258KB)이다. 연구자나 분석가가 "어느 발전소 호기가 어떤 공급사 연료를 얼마나 썼고, 그 연료의 발열량·황 함량이 어땠는가"를 보고 연료 품질 변동이나 탄소 배출량을 추정하는 데 쓴다. 발전소 식별 키(power_plant_id)가 있어 발전소 원장, 발전량, 발전소 배출 측정 데이터와 발전소 단위로 이어 쓴다.
description_portal: 한국동서발전에서 운영하는 발전소별 연료 사용 현황 정보는 날짜, 발전소, 호기, 공급사명, 사용량, 총사용량, 시간, 발열량(인수식·기건식·건식), 고유수분, 휘발분 등의 항목으로 구성되어 있으며, 각 발전소에서 실제 사용된 연료 특성과 효율성을 체계적으로 파악할 수 있는 데이터입니다. 이를 통해 발전소별 연료 소비량과 품질 변동을 세밀하게 분석할 수 있으며, 연료 관리 효율성 및 발전 성능과의 상관관계를 검증하는 데 활용될 수 있습니다. 학계 및 연구기관에서는 본 데이터를 기반으로 에너지 효율성 연구, 연료 특성별 발전 효율 분석, 탄소 배출량 추정, 장기적인 연료 수급 안정성 평가 등 다양한 연구를 수행할 수 있으며, 나아가 국가 에너지 정책 및 지속가능한 발전 전략 수립에 기초자료로 제공할 수 있는 가치가 큽니다.
