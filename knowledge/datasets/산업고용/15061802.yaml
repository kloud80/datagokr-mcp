description_portal: 한국수력원자력(주) 유연근무(시차출퇴근, 근무시간선택, 탄력근무, 재택근무 등) 인원 현황_2018년~2024년본 데이터는 한국수력원자력(주)이 공개하는 유연근무 현황(알리오 공시 기준)에 대한 데이터입니다. 유연근무제는 근로자가 일과 생활의 균형을 맞출 수 있도록 근무시간, 근무장소, 근무방식을 자율적으로 선택하게 할 수 있는 제도입니다. 한국수력원자력(주)에서 제공하는 해당 데이터는 2018년도부터 2024년까지 유연근무제를 이용한 임직원의 인원수를 유연근무형태에 따라 연도별로 집계하고 있습니다. 한국수력원자력의 유연근무 형태로는 시차출퇴근형, 근무시간선택형, 집약근무형, 재량근무형, 재택근무형, 스마트워크근무형 등이 있습니다.
