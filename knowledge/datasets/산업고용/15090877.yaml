summary_user: 인천광역시 서구 관내 공공시설 중심으로 설치된 태양광 발전설비를 설비(설치장소)별로 담은 건별 원장 파일로, 설치장소명·도로명주소·설치연도·발전유형·설비용량을 담는다(파일 크기 약 2.9KB 소규모). 주민이나 재생에너지 사업자가 서구 안에서 어느 공공시설에 태양광이 얼마 규모로 설치돼 있는지 확인할 때 쓴다. 전역 조인 키는 없어 도로명주소나 설치장소명을 매칭해 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 공공시설을 중심으로 설치된 태양광 발전설비 현황을 정리한 자료입니다. 본 데이터는 인천광역시 서구 내 태양광 발전설비 시설의 설치장소명, 소재지도로주소, 설치연도, 발전유형, 설비용량 등의 정보를 제공하고 있습니다. 본 공공데이터를 통해 생활권 내 친환경 에너지 인프라 분포를 확인할수 있으며, 민간 부문에서 재생에너지 활용 사업의 가능성을 검토하는데 기초자료로써 활용할수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
