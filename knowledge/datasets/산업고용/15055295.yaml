summary_user: 서울 강북구 관내에 등록된 석유판매업소(주유소·대리점·용제판매소 등)를 업소 1곳당 1행으로 담은 원천 목록 파일로, 상호·도로명주소·위도·경도·전화번호·데이터기준일을 담는다. 주민이나 사업자가 강북구 안의 주유소·석유판매업소 위치와 연락처를 확인하거나, 분석가가 구 단위 석유판매업소 분포를 지도에 올려 볼 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 상호·주소를 맞추거나 좌표로 공간 결합하는 방식으로 잇고, LOCALDATA 에너지 업종 인허가 원장이나 오피넷 주유소 가격 정보와 대조할 때도 이 방식을 쓴다.
description_portal: 석유판매업이란 1. 석유제품을 판매하는 일반대리점 2. 용제를 판매하는 대리점 3. 휘발유, 등유, 경유 등을 판매하는 주유소 4. 용제판매소 5. 부산물 석유제품 생산판애업 6. 부생연료유판매소를 이야기하며 석유사업법 제10조 제1항, 석유사업법 시행규칙 제12조제1항제3호에 따르면 석유판매업을 하려는 자는 등록하여야 합니다서울특별시 강북구 관내 석유판매업 현황에 관련한 자료는 연번, 상호, 도로명주소, 위도, 경도, 전화번호, 데이터기준일로 이루어져있습니다.현재 강북구 소재의 석유판매업소는 9개소가 있습니다
