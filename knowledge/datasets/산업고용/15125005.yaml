summary_user: 경기도 가평군에 등록된 대부업·대부중개업체를 업체별로 담은 원천 목록으로, 등록번호·업체명·도로명/지번주소·위도·경도·등록일·만료일·영업내용을 포함하며 파일 크기가 386바이트에 불과해 수록 업체는 소수다. 주민이나 소비자가 "가평군에서 거래하려는 대부업체가 정식 등록돼 있고 등록이 아직 유효한가"를 확인하거나, 담당 부서가 현장 점검 대상을 지도에 표시할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소 문자열로 맞추거나 위도·경도 좌표로 공간 결합해야 하며, 다른 업종 인허가(LOCALDATA) 자료와 같은 방식으로 이어 쓴다.
description_portal: '본 데이터는 경기도 가평군에 등록된 대부업 및 대부중개업체의 현황 정보를 수록한 자료입니다. 항목에는 등록번호, 업체명, 도로명주소, 지번주소, 위도, 경도, 등록일, 등록 만료일, 영업내용, 데이터기준일자 등이 포함되어 있으며, 관내 대부업체의 분포 및 영업 실태를 확인할 수 있습니다. 본 자료는 서민금융관리, 소비자 보호, 불법 대부업 방지 정책 수립 등에 기초자료로 활용됩니다. 특히 위치정보는 지도 기반의 대부업체 검색 서비스, 민원 응대, 현장 점검 계획 수립 등에 유용하게 사용됩니다. 관련 정보는 가평군 대표홈페이지 사전정보공표를 통해 정기적으로 확인할 수 있으며, 금융 분야의 행정 투명성과 정보 접근성 향상에 기여합니다.(가평군 대표홈페이지 사전정보공표 URL : https://www.gp.go.kr/portal/contents.do?key=641)'
