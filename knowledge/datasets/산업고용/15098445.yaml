summary_user: 세종특별자치시 안의 영화상영관 등 영화산업시설을 시설 한 곳씩 담으며, 시설 명칭, 소재지 주소, 우편번호, 관람정원, 영업 상태를 제공한다. 세종시에서 운영 중인 영화관이 어디에 있고 몇 석 규모인지 알고 싶은 시민이나 지역 문화시설 분포를 보는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소를 맞춰 붙여야 하며, 지방행정 인허가(LOCALDATA) 업종 원장이나 소상공인 상가업소 데이터와 주소 기준으로 대조하는 식으로 이어 쓴다.
