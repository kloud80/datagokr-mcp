summary_user: 서울특별시 중랑구에서 사료를 제조·수입·판매하는 업소의 인허가 원장으로, 업소별로 관리번호, 인허가일자, 영업상태와 폐업·휴업 일자, 주소, 사업장명, 중부원점TM 좌표를 담는다. 사료 업체를 찾는 사업자나 중랑구 안에서 영업 중이거나 폐업한 사료제조업소의 분포와 변동을 확인하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 다른 지자체의 같은 LOCALDATA 인허가 데이터와 같은 컬럼 구조로 합쳐 쓴다.
description_portal: '서울특별시 중랑구의 사료를 제조하거나 수입 및 판매하는 업소 정보입니다. 영업상태명, 전화번호, 주소, 사업장명 등의 정보를 포함합니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 주소, 사업자명, 좌표정보 등이 있습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
