description_portal: 1. 석유정제업(신고)이란 석유제품 중 윤활유 등 대통령령으로 정하는 제품의 석유정제업을 하려는 자로 아스팔트, 윤활기유 또는 윤활유를 제조하는 석유정제업을 말한다. 2. 석유정제업을 신고하려는 자는 석유 및 석유대체연료 사업법 시행규칙 제5조에 따라 석유정제업 신고서, 사업계획서를 첨부하여 한국석유관리원에 제출하여야 한다.3. 석유정제업 변경신고를 하려는 자는 영 제8조제2항 각 호의 사항이 변경된 날부터 30일 이내에 별지 제2호서식의 석유정제업 변경신고서에 변경내용을 증명하는 서류를 첨부하여 한국석유관리원에 제출하여야 한다.
