summary_user: 중소벤처기업진흥공단 기업인력애로센터 일자리매칭플랫폼에서 성사된 구인기업과 구직자 간 취업매칭 실적을 매칭 건별로 담은 전국 단위 파일(csv)이며, 참여년도·기업명·사업자번호·지역·업종과 구직자 이름·성별을 포함한다. 분석가나 지원기관이 '어느 지역·업종의 중소기업이 이 플랫폼으로 몇 명을 채용했나'를 연도별로 파악하는 데 쓴다. 사업자번호(bizno)를 조인 키로 기업 확인·인증 원장(벤처·이노비즈·창업기업 등)이나 다른 기업 단위 데이터와 이어 쓴다.
description_portal: 중소기업 인력지원사업의 일환으로 중소기업-구직자 간 일자리 매칭을 지원해주는, 중소벤처기업진흥공단 기업인력애로센터 일자리매칭플랫폼에서 성사된 구인기업과 구직자 간의 취업매칭 실적입니다. 중소기업이 채용공고를 게시하여 구직자를 모집하고, 구직자는 이력서를 작성하여 입사지원을 하는 방식을 통해 매칭이 이루어집니다. 중소기업의 지역별, 업종별 채용 실적을 파악하시는데 활용하시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등으로 확인하기 어려울 수 있기 때문에 원활한 파악을 위해서는 분석 전용 소프트웨어를 이용하시기 바랍니다.
