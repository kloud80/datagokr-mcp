description_portal: 「수출용원재료에 대한 관세 등 환급에 관한 특례법」의 규정에 따라 산정·관리되는 석유정제업자의 원유 소요량(즉, 원료로 투입된 원유의 양과 이를 통해 실제로 산출된 제품의 양) 및 윤활기유 생산업자의 윤활기유 소요량(원료 투입량과 제품 생산량을 포함한 수치) 자료입니다.이 자료는 환급 제도의 정확성과 투명성을 확보하기 위해 반드시 필요한 기초 데이터로서, 원재료의 투입량과 산출량을 명확히 확인함으로써 환급 신청 시 합리성과 적정성을 판단하는 근거가 됩니다. 특히 석유정제업자의 경우 수입 원유가 다양한 정제 과정을 거쳐 여러 석유제품으로 전환되므로, 각 제품별 생산 수량을 면밀히 산정하는 것이 중요합니다. 또한 윤활기유 생산업자에 대해서도 원료로 투입된 기유와 그로부터 생산된 윤활기유의 실제 산출량을 정확히 반영하여, 환급액의 산정 및 법령 준수 여부를 객관적으로 검증할 수 있도록 하고 있습니다.
