summary_user: 창원시에서 행정사 업무를 신고하고 영업 중인 사무소를 한 곳씩 담은 목록으로, 업체명·주소·전화번호·개업신고일을 담는다. 서류 대행이나 인허가 신청을 맡길 시민이 집이나 회사 근처의 창원시 행정사사무소와 연락처를 찾는 데 쓰고, 분석가는 개업신고일로 지역 행정사 사무소가 언제 문을 열었는지 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업체명을 맞춰 붙이거나, 지방행정 인허가(LOCALDATA) 행정사 업종 자료와 이름·주소로 대조해 이어 쓴다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어서 다른 데이터와 정확히 1:1로 연결하기 어렵고, 주소·업체명 문자열 매칭에 기대야 한다. 범위는 창원시 한 곳뿐이어서 경남 전체나 전국 현황은 이 파일만으로 알 수 없다.
