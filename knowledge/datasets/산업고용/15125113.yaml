description_portal: 'ㅁ 26년도 6월 30일까지의 제주전력수급현황 데이터를 업데이트 했습니다.ㅇ 포함 데이터 : 제주 계통수요, 제주 공급능력, 제주 공급예비력, 제주 예측수요, 제주 운영예비력ㅇ 제주 전력수급현황은 1시간 단위로 제공됩니다.(최소단위)ㅇ 공급예비력 및 운영예비력은 2023.7.22 를 기준으로 분리되었으며, 이전 데이터는 데이터값이 동일합니다.ㅇ 제공 데이터는 단순 참고용, 추이분석 정도로만 활용하시길 권장드립니다.(중요 정책, 의사결정에 대한 결과는 전력거래소에서 책임지지 않습니다)ㅇ 데이터 단위 : MW'
