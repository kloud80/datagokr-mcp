description_portal: '○ 통계개요* 통계명 : 사업체 평균연령(동별)* 통계종류 : 서울시 사업체 현황을 구ㆍ동별로 제공하는 지정ㆍ조사통계* 작성목적 : 서울시에 등록된 종사자1인 이상의 사업체 및 종사자 현황을 파악하여,산업활동과 관련된 각종 정책의 수립 및 평가, 기업의 경영계획 수립 및학계, 연구소 등의 학술연구를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울특별시 데이터전략과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구, 행정동내용 - 서울시 사업체수 및 종사자수, 평균종사자, 사업체 평균연령 현황○ 용어설명* 사업체 : 영리ㆍ비영리를 불문하고 개개의 상점, 사무소, 영업소, 은행, 학교, 병원,여관, 식당, 학원, 교회, 사찰, 공공기관, 사회복지시설 등과 같이 일정한 장소에서단일소유권 또는 단일통제 하에 제화의 생산ㆍ판매, 서비스 제공 등 산업활동을영위하고 있는 모든 경영단위* 평균종사자 = 종사자수/사업체수* 사업체 평균연령 = {각세 연령별 사업체수 *(연령+0.5)}의 총합을 관내 총 사업체수로 나눈 값○ 기 타* 조사공표주기(12.31)과 조사시점(익년도 조사기간 중)사이에 폐업되어 조사되지못한 사업체는 직전년도 실적으로 결측치를 대체하였음'
