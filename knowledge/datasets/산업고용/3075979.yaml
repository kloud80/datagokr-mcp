summary_user: 주요 광물의 세계 매장량을 광종별로 부존국가 상위 10개 내외씩 나열한 국가별 집계 파일(csv 약 17KB)로, 광종·단위·국가·매장량을 담는다. 자원 확보나 공급망 다변화를 검토하는 분석가가 '이 광물은 어느 나라에 얼마나 묻혀 있고 상위국 집중도가 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명이나 광종명을 이름 기준으로 맞춰 이어 쓴다.
description_portal: 한국광해광업공단의 "광종별 매장량" 데이터셋은 주요 광물자원의 세계 매장량을 각 광종별로 부존국가 상위 10개 내외의 매장량 목록으로 제공합니다. 이 데이터는 각 광물의 세계 매장량과 주요 부존국가를 파악하는 데 유용하며, 자원 확보 전략 수립 및 국제 자원 시장 분석에 활용될 수 있습니다.공단은 이 데이터를 통해 자원안보를 강화하고, 국내 자원 개발 및 공급망 다변화 전략 수립에 기여하고 있습니다. 또한, 이 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, 다양한 분석 도구를 활용하여 심층적인 분석이 가능합니다.이러한 정보를 통해 자원 수급의 안정성을 높이고, 에너지 정책 및 산업 구조 조정에 필요한 실증적 근거를 제공하며, 대체 자원 개발 및 공급망 다변화 전략 수립에도 기여할 수 있습니다.
