description_portal: 본 데이터는 한국가스공사에서 제공하는 사회적배려대상자 도시가스요금 경감 현황을 정리한 에너지복지 정책 자료입니다. 에너지 취약계층의 난방비 부담 경감과 에너지 복지 실현을 위해 도시가스요금 할인 지원 실적을 연도별, 대상별로 제공합니다. 데이터 항목으로는 연도, 장애인, 국가유공자, 독립유공자, 생계급여수급자, 의료급여수급자, 주거급여수급자, 교육급여수급자, 차상위계층 등 대상 유형별 경감 수혜가구수가 포함됩니다. 2017년부터 2020년까지의 시계열 데이터를 제공합니다. 이 데이터를 통해 도시가스요금 경감 혜택의 실제 수혜 현황과 연도별 확대 추이를 파악할 수 있습니다. 또한 에너지 복지정책의 효과성 분석 및 향후 지원대상 확대 방안 수립에 기초자료로 활용될 수 있습니다.
