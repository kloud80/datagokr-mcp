description_portal: 국가기술은행(NTB)에서 서비스하는 모든 기술정보를 조회하는 기능을 제공하며 등록되는 기술정보는 이전을 원하는 공공연구기관 및 기업의 기술소개 정보를 포함하고 있습니다. 기술은행의 등록기술 조회 서비스를 통해 사용자는 다양한 기술 정보를 손쉽게 접근하고 활용할 수 있습니다. 이 데이터는 기업의 기술 이전 및 협력에 유용하게 활용될 수 있으며 연구개발 및 혁신을 촉진하는데 기여할 수 있습니다. API는 기관 및 기업이 보유한 기술의 세부정보를 정확히 파악하고 이를 통해 상호협력 방안 및 비즈니스 기회를 모색할 수 있도록 돕습니다. 본 서비스에는 기술등록 정보 조회 기능 , 이전 및 상용화를 위한 기술소개정보 조회 기능이 포함됩니다. 이러한 서비스는 공공연구기관과 기업 간의 기술이전 및 연구개발 협력을 증진시키는 역할을 합니다.
