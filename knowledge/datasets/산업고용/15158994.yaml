summary_user: 국가기술은행(NTB)에 등록된 기술정보, 곧 이전을 원하는 공공연구기관과 기업의 기술소개 정보를 건별로 조회하는 전국 범위 API다. 기업이나 기술사업화 담당자가 "우리 제품에 들여올 만한 공공연구기관 보유 기술이 무엇이고 어디에 있나"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관명·기술명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 다른 데이터셋과 바로 묶을 공통 키가 없어 연계 시 이름 매칭에 의존한다. 개발계정은 일 1,000회로 호출이 제한되고 serviceKey가 필요하다. 지역 단위 정보가 없는 비공간 데이터라 지역별 분석에는 맞지 않는다.
