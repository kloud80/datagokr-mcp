description_portal: 중소벤처기업진흥공단은 정책자금 집행의 투명성을 높이고 효율적인 분석을 돕기 위해 직접대출에 대한 다양한 데이터를 공공데이터 포털에 공개하고 있습니다. 이 중 "대출잔여기간별 직접대출 잔액현황" 데이터는 대출 잔액을 남은 기간에 따라 분류하여 제공합니다.이 데이터는 대출 잔여기간이 1년 이하, 1~2년, 2~3년 등 세분화된 구간으로 나누어져 있어, 장단기 대출의 비중을 한눈에 파악할 수 있습니다. 또한, 각 구간별 대출 잔액과 함께 해당 대출을 받은 업체수 정보도 포함하고 있습니다. 이를 통해 사용자는 대출 만기가 임박한 기업의 수나 장기 자금을 지원받은 기업의 규모 등을 분석하여 중소벤처기업의 자금 운용 상황을 종합적으로 이해할 수 있습니다.
