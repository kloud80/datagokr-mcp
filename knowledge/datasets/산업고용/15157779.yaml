summary_user: 한국수력원자력이 운영하는 수력발전소(화천·춘천·의암·청평·팔당·괴산·칠보(구 섬진강)·보성강·안흥)별로 측정일 기준 일일발전량, 강우량, 방류량, 사용수량, 유하량, 저수위, 대기평균온도 같은 수문·운전 값을 조회하는 API입니다. 하천·댐 하류 관리자나 분석가가 '특정 수력발전소의 그날 방류량과 저수위, 발전량은 얼마였나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소 이름·코드(발전소 구분 코드 genName) 매핑이나 같은 기관 코드로만 다른 발전소 원장·수문 데이터와 연결한다.
