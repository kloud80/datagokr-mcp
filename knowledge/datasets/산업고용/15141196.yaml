summary_user: 한국전력거래소 수요자원거래시스템의 자발적 수요감축(경제성DR·피크수요DR·미세먼지DR) 입찰량과 낙찰량을 거래일자·거래시간별로 담는 전국 단위 비공간 데이터다. 수요자원 사업자나 에너지 분석가가 특정 날짜·시간대에 자발적 DR이 얼마나 입찰되고 낙찰됐는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 거래일자(tradeDay)·거래시간(tradeTm)을 기준으로 같은 기관의 SMP·전력수급 등 시간별 데이터와 맞춰 쓴다.
description_portal: 'ㅁ 수요자원시장이란전기 사용자가 전기시장가격이 높을 때 또는 전력계통 위기시 아낀 전기를 전력시장에 판매하고 금전으로 보상받는 제도입니다. 수요반응자원 참여고객은 비상대응 의무감축과 자발적 수요감축을 통하여 수요자원시장에 참여 가능합니다.ㅁ 자발적 수요감축 (자발적 DR 이란)전력거래소의 수요감축요청 없이 참여고객이 자발적으로 경제성DR, 피크수요DR, 미세먼지DR에 참여하여 수요를 감축합니다.해당 데이터는 한국전력거래소 수요자원거래시스템 자발적 DR 입낙찰량 현황과 동일한 데이터이며,경제성DR, 피크수요DR, 미세먼지DR의 데이터를 모두 포함한 데이터입니다.ㅇ 링크 : https://dr.kmos.kr/nx/nxIndex.doㅇ 갱신주기 : 1일 1회 (02시 10분)'
