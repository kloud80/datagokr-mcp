description_portal: '대전광역시 대전공공구매플랫폼 기준 업종 대분류 별 구별 기업수 자료는 대전공공구매플랫폼에서 제공하는 기업 정보를 표준산업분류체계의 대분류 업종 기준으로 정리하여, 대전시 각 구별로 중소기업 수를 집계한 자료입니다. 이 자료는  공공데이터 기업매칭지원사업의 일환으로 구축되었으며, 대전광역시 홈페이지 및 공공데이터포털에서 제공됩니다. 자료에는 구별로 산업 대분류(예: 제조업, 도매 및 소매업, 서비스업 등)별 기업 수가 포함되어 있어, 지역 내 업종별 중소기업 분포 현황을 한눈에 파악할 수 있습니다. 이를 통해 대전시의 산업 구조 분석, 구별 기업지원 정책 수립, 공공구매 정책 설계 등 다양한 행정적·정책적 활용이 가능합니다.'
