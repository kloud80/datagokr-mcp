summary_user: 강원특별자치도 정선군에 등록된 골재채취업 사업체를 업체 한 곳당 한 행으로 담은 등록 원장으로, 사업자등록번호·업종등록번호·등록일자·대표자·상호·도로명주소를 포함하며 파일은 878바이트 규모의 소량 CSV입니다. 정선군에서 골재채취업으로 등록된 업체가 어디이고 언제 등록했는지를 확인하려는 건설사·주민·인허가 분석가가 쓴다. 전역 조인 키는 없어 사업자등록번호나 상호·주소 이름 매칭, 시도·시군구·읍면동 행정구역으로 다른 광업·토석채취 허가 자료나 사업자 정보와 이어 쓴다.
limits: 업체 등록 현황만 담고 포털 설명에 나오는 채취 유형·허가번호·채취 장소는 실측 필드에 없으므로 채취 구역이나 필지 단위 분석에는 쓰지 못한다. 범위가 정선군 한 곳이라 다른 시군과 비교하려면 지자체별 파일을 따로 모아야 하고, 공통 코드 키가 없어 연계는 이름·주소 매칭에 의존한다.
