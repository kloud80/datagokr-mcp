summary_user: 한국동서발전이 운영하는 당진 옥내저탄장 지붕 태양광 설비 한 곳의 월별 발전량(MWh)을 설비명·날짜와 함께 담은 소규모 CSV 파일(약 3KB)로, 포털 설명상 2017년 6월부터 2023년 12월까지를 다룬다. 분석가나 연구자가 '지붕형 태양광의 계절별·연도별 발전량은 어떻게 변하고 장기적으로 성능이 유지되는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전소·신재생 데이터와는 설비명이나 날짜(연월)를 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 한국동서발전에서 운영 중인 당진 옥내저탄장 지붕 태양광 설비의 2017년 6월부터 2023년 12월까지의 월별 발전량 정보를 제공합니다. 본 데이터는 해당 기간 동안의 태양광 설비별 실질 발전 실적을 확인할 수 있도록 구성되어 있으며, 항목은 설비명, 날짜, 발전량(MWh)으로 구성됩니다.해당 데이터는 지붕형 태양광 발전의 계절별, 연도별 에너지 생산 추이 분석에 유용하며, 장기적인 발전 설비의 성능 안정성 평가, 설비별 발전 효율 비교, 발전량 예측 모델링 등에 활용될 수 있습니다. 또한, 도시형 신재생에너지 확대 정책 수립이나 지붕형 태양광 설치 기준 검토에 필요한 기초 자료로도 적합하여 학계 및 연구기관의 에너지 기술, 환경 정책 연구 등에 효과적으로 활용 가능합니다.
