summary_user: 서울특별시 소재 주유소를 한 행에 한 곳씩 자치구명, 주유소명, 주소(도로명주소)로 담은 목록 파일(csv, 약 34KB)이다. 시민이나 분석가가 '우리 자치구에 주유소가 몇 곳이고 어디에 있나'처럼 자치구별 주유소 분포와 위치를 확인하는 데 쓴다. 전역 조인 키가 없어 오피넷 유가나 전국주유소표준데이터와는 주유소명·주소 문자열 매칭으로 잇고, 자치구명으로 자치구 단위 통계와 묶는다.
limits: 주유소 ID·좌표·유가가 없어 가격 비교나 실시간 정보에는 쓰지 못하고, 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 서울특별시 한 곳이며, 좌표가 없으므로 지도 표시에는 주소 지오코딩을 거쳐야 한다.
