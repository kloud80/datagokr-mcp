description_portal: '산재요양신청서에서는 재해자의 산업재해로 인해 발생한 상병(질병)의 상병명과 코드를 작하며 산업재해로 인한 치료가 필요한 질병을 분류하고 있습니다.상병코드는 산재 요양 신청 시 재해로 인해 발생한 질병의 성격과 범위를 명확히 하기 위해 사용되며, 고용노동부, 근로복지공단 등은 이 정보를 바탕으로 요양급여 승인 여부를 판단하고, 질병 유형별 통계 작성, 산재 다빈도 질환 분석, 치료비 지급 기준 설정 등에 활용됩니다.상병코드 예: E134, E135 등상병명 예 : 예: ‘신경학적 합병증을 동반한 기타 명시된 당뇨병’ 등'
