summary_user: 한국지역난방공사 지사별로 난방을 공급하는 지역 이름과 그 지역의 건물 수를 담은 집계 표이며, 포털 설명상 2023년 9월 기준으로 작성된 2.7KB 남짓의 작은 CSV 파일입니다. 도시계획·에너지 분석가가 '어느 지사, 어느 택지지구에 지역난방 공급 건물이 몰려 있는가'를 확인하거나 개발지구와 지역난방 보급의 관계를 볼 때 쓴다. 이어 쓸 키는 난방지역 이름(heating_area_id) 하나뿐이고 행정구역 코드나 좌표가 없으므로, 지도나 다른 지역 통계와 붙이려면 지역명을 직접 맞춰야 한다.
