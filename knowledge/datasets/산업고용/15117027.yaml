summary_user: 한국전력공사 전기차충전서비스운영시스템의 충전기 단위 원장으로, 충전소 아이디·충전기 아이디·사용여부·등록일시·변경일시를 담으며 전국 4,196건이 2016-12-23~2025-12-31 기간에 걸쳐 있다. 분석가나 지자체 담당자가 전기차 충전기가 언제 등록·변경됐고 지금 사용 가능한 상태인지, 지역별 충전 인프라가 어떻게 늘었는지를 확인하는 데 쓴다. 충전소 아이디·충전기 아이디로 같은 기관의 충전소·충전기 데이터와 이어 쓸 수 있지만, 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
description_portal: 한국전력공사 전기차충전서비스운영시스템에서 관리하는 충전기 정보 데이터입니다.충전소ID, 충전기ID, 사용여부, 등록일시, 변경일시 항목으로 구성되어 있으며, 개별 충전기의 운영 현황과 설치 이력을 확인할 수 있습니다.데이터 이용자는 특정 충전소 내 충전기 활용 가능 여부를 파악하고, 신규 설치·운영중단·교체 등 변동 사항을 추적할 수 있습니다.또한, 충전기의 등록·변경 이력을 바탕으로 충전 인프라 유지보수 주기를 예측하거나, 지역별 충전소 확대 추일르 비교하는 등 전기차 충전 인프라 정책 수립에 활용할 수 있습니다.
