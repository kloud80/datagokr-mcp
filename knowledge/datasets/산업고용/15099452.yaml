summary_user: 전국 지역별 풍력 발전량을 거래일·시간대별로 한 행에 두고, 0분부터 55분까지 5분 단위 계량값(Wh)을 열로 담은 계량 데이터이다(약 18MB CSV 파일). 전력 분석가나 풍력 사업자가 '특정 지역의 풍력 출력이 하루 중 어느 시간대에 몰리고 5분 사이에 얼마나 출렁이는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 지역 이름이나 거래일·시간을 맞춰 같은 전력거래소의 시간별 발전량·SMP·수급 자료와 붙여 쓴다.
limits: 실측 컬럼에 표준 지역코드 같은 공통 키가 없어 다른 기관 데이터와는 지역 이름 매핑으로만 연결된다. 계량값은 5분 단위 값이므로 시간별 발전량을 구하려면 한 행의 5분 값을 합산해야 한다.
