summary_user: 한국남부발전 소속 발전소의 발전실적을 날짜·발전소·설비·호기 단위로 담으며, 설비용량, 역일 설비용량, 발전량(qvodgen), 송전량을 함께 제공한다. 분석가가 특정 기간 남부발전 석탄·LNG 발전소의 호기별 일별 발전량과 송전량 추이를 확인하거나, 국내 전체 발전량과 비교하는 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전실적 조회_GW 입니다.해당 서비스를 통해 사용자는 원하는 기간(연도-월-일)과 조회를 희망하는 발전소를 지정하여 해당 발전소의 발전실적을 조회할 수 있습니다.해당 데이터를 활용하여 한국남부발전(주)의 세부 일별 발전현황을 파악할 수 있으며, 발전원(석탄, LNG) 정보가 포함되어 발전원별 발전실적 분석 자료로 활용 가능합니다.타 기관 및 국내 전체 발전량과 비교 등에 기초자료로도 활용 가능합니다.
