summary_user: 서울특별시 양천구 관내 게임물 배급업체를 업소 한 곳당 한 행으로 담은 지방행정 인허가(LOCALDATA) 원장으로, 인허가일자·취소일자, 영업상태와 상세상태, 폐업·휴업 기간, 사업장명, 지번·도로명 주소, 좌표, 시설면적·층수 등을 포함한다. 양천구에서 현재 영업 중인 게임물 배급업체가 어디에 몇 곳 있는지, 언제 인허가를 받거나 폐업했는지 확인하려는 사업자·분석가·행정 담당자가 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있고, 다른 업종의 LOCALDATA 인허가 데이터와는 같은 컬럼 구조로 나란히 비교한다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 게임물 배급업체의 인허가 현황과 관련된 정보를 체계적으로 수집·정리한 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 사업자구분명 등 핵심 항목이 포함되어 있어  각 업체의 설립 및 운영 실태를 종합적으로 파악할 수 있도록 구성되어 있다. 본 자료는 행정기관에서 배급업체 관리, 감독, 정책 수립 및 안전 점검 등에 활용 가능하며, 연구자와 시민은 지역별 게임물 배급 현황과 사업 규모 분석 등 다양한 목적으로 활용할 수 있는 신뢰성 있는 정보 자원이다.*게임물 배급업 - 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소
