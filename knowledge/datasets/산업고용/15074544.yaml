summary_user: 국내 상업용 원자력발전소에서 발생한 사고·고장 건수를 연도별로 인적오류·기계결함·전기결함·계측결함·외부영향·기타 원인으로 나눈 전국 단위 집계표이며, 파일 크기가 169바이트로 행 수가 매우 적다. 원전 안전을 살피는 국민이나 분석가가 '최근 몇 년간 원전 고장은 사람 실수와 설비 결함 중 어느 쪽 비중이 큰가' 같은 원인별 추이를 보는 데 쓴다. 전역 조인 키가 없어 연도(년도)를 기준으로 같은 기관의 원전 가동·사고고장 데이터와 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 국내에서 발생한 원자력이용시설(상업용 원자력발전소)의 사고 및 고장 현황 데이터를 원인(인적오류, 기계결함, 전기결함, 계측결함, 외부영향, 기타 등)에 따라 구분하고 이를 연간 주기로 갱신하여 제공합니다. 각 원인에 따라 사고 및 고장 데이터가 분류되어 있어 정보이용자로 하여금 사고 및 고장 발생원인에 따른 열람 및 자료수집이 용이하도록 정보 공개를 수행하고 있습니다.
