summary_user: 광주광역시가 조례에 따라 지정한 명품강소기업을 기업별로 한 행씩 담은 목록 파일로, 지정기수·기업명·대표자·본사 주소·지정 시작일과 종료일을 담는다. 지역 유망 중소기업과 거래처나 협력사를 찾는 사업자, 또는 지역 기업 지원정책 대상 기업이 어디에 분포하는지 보려는 분석가가 '현재 지정 기간 중인 광주 명품강소기업은 어디인가' 같은 질문에 쓴다. 전역 조인 키(사업자번호 등)는 없으므로 다른 기업 인증·인허가 데이터와는 기업명이나 주소를 맞춰 이어야 한다.
description_portal: 광주광역시 명품강소기업 지정 현황광주광역시 명품강소기업 선정 및 지원조례에 근거하여 지역경제 활성화에 기여하고자 성장잠재력이 높은 관내 소재 유망 중소기업을 선정하고 지원합니다.명품강소기업 대상업종은 제조업과 지식서비스산업이며 지정기간은 3년이며 1회 연장 가능하며 현재 80개사 총량으로 관리하고 있습니다.성장성(매출액 등), 성장목표와 전략, 혁신역량 및 잠재력 등을 기준으로 서류심사, 발표 및 현장평가, 최종선정위원회를 거쳐 선정하고 있습니다.광주광역시 명품강소기업에 대한 데이터로 명품강소기업 지정기수, 기업명, 대표자, 주소, 지정기간 등의 항목을 제공합니다.
