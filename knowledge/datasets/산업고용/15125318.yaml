summary_user: 한국남부발전이 운영하는 태양광 발전소별·호기별로 하루 1시부터 24시까지 1시간 단위 발전량과 일 총량·평균·최대·최소를 담는 건별 실적 API다. 분석가가 '남부발전 특정 태양광 발전소의 계절별·시간대별 발전량은 어떻게 달라지나'를 따지거나 기상 자료와 엮어 날씨와 발전량의 관계를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 발전소코드(gencd)·발전소명·날짜를 이름·코드 매핑하거나 같은 기관 자료끼리 연결해 쓴다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 시간대별 태양광발전실적 정보조회 서비스_GW 서비스입니다.해당 API를 통해 사용자는 조회를 희망하는 날짜 및 기간의 태양광 발전소를 선택하여 00시부터 24시까지 1시간 단위로 세부 발전량을 확인할 수 있습니다. 해당 내용을 바탕으로 태양광 발전량 계절별 추이 분석 등을 수행할 수 있습니다.또한, 기상정보 등과 결합하여 날씨와 태양광 발전의 상관관계 등 다양한 분석의 기초자료로 활용 가능합니다.
