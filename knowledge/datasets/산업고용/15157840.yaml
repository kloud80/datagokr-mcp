summary_user: 한국수력원자력이 건설 중인 신고리 5·6호기와 신한울 1·2호기의 착공일, 준공(예정)일, 현재 공정 현황을 발전소 단위로 담은 API다. 원전 건설 일정이 어디까지 진행됐는지, 특정 호기의 준공 예정 시점이 언제인지를 확인하려는 국민·에너지 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 발전소 코드(genName)나 발전소 이름을 기준으로 다른 발전소 원장과 수작업으로 맞춰 이어 쓴다.
limits: 조회할 때 발전소 코드(genName)를 반드시 넣어야 하므로, 신고리5·6, 신한울1·2에 해당하는 코드를 먼저 알고 있어야 한다. 전국 단위의 비공간 데이터라서 지역별 분석이나 좌표 기반 연결에는 쓰지 못한다. 다른 데이터와 연결하는 공통 키가 없어 이름이나 코드를 직접 매핑해야 한다.
