description_portal: 이 데이터는 업무상 질병 중에서도 주요 사망 원인인 뇌심혈관계질병 및 과로사 관련 산업재해 신청 및 승인 현황을 업종별(광업, 제조업, 건설업, 운수업 등)로 집계한 통계 자료입니다. 각 연도별로 업종에 따른 신청 건수와 실제 승인 건수를 제공하여, 특정 산업군에서 과로 관련 질병이 발생하는 빈도와 산재로 인정받는 비율을 명확하게 보여줍니다. 이 자료는 고위험 산업군에서 근로자들의 건강권을 위협하는 심각한 업무상 질병의 발생 추이와 규모를 파악하는 데 필수적인 근거 자료라고 판단됩니다.본 데이터는 근로 시간 단축 및 근로 환경 개선 정책의 실효성을 평가하는 데 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 제조업, 건설업 등 육체적·정신적 부담이 높은 업종에서 승인 건수가 높게 나타나는 이유를 분석할 수 있습니다. 이를 통해 해당 업종을 대상으로 한 근로 시간 관리 감독을 강화하고, 업무 환경 개선을 위한 맞춤형 예방 지원 사업을 수립하는 데 활용할 수 있습니다. 또한, 이 통계는 뇌심혈관계 질병에 대한 산재 인정 기준의 적정성을 논의하고, 근로자의 건강권 보호를 위한 사회적 합의를 도출하는 데 기여할 수 있다고 판단됩니다.
