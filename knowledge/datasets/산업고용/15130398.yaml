description_portal: 한국산업기술진흥원에서 제공하는 기술지도 컨설팅 성과는 사업 및 과제를 수행하는 다양한 기관과 기업이 겪는 애로 기술 문제를 해결하기 위해 실시된 기술지도 컨설팅의 결과를 담고 있습니다. 이 데이터셋은 각 컨설팅의 내용과 수행기관에 대한 상세 정보를 포함하고 있어, 관련 기업들이 해당 데이터의 활용을 통해 저희의 기술적 문제를 파악하고 해결책을 모색하는 데 큰 도움이 될 수 있습니다. 또한, 이 데이터를 활용하면 산업별 기술 문제를 보다 체계적으로 분석하고, 각 분야에 적합한 해결방안을 제시하는 데 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 성과발생년도(숫자형), 컨설팅 순번(숫자형), 컨설팅 내용(문자형), 컨설팅 수행기관명(문자형), 지원년도(숫자형), 컨설팅 수행 인력수(숫자형), 지원대상 기업수(숫자형), 지원건수(숫자형), 지원대상 인력수(숫자형), 등록일자(날짜형) 등으로 구성되어 있습니다. 이를 통해 관련 분야에 대한 심층적 이해를 도모할 수 있습니다.
