description_portal: 본 연도별 청사 에너지 관리 현황은 한국중부발전 본사사옥에서 사용된 연도별 에너지 사용량을 정리한 자료입니다. 항목은 연월을 기준으로 일반전기 전력사용량(kWh), 심야전기 전력사용량(kWh), 난방 및 냉방용 지열히트펌프 생산에너지(Mcal), 도시가스를 활용한 난방 및 급탕 에너지 사용량(㎥), 수도 사용량(㎘) 등으로 구성되어 있습니다. 연도별 청사 에너지 관리 현황은 본사사옥 운영에 따른 에너지 소비 구조와 효율성을 분석하고, 냉난방 방식 및 에너지 원별 사용 경향을 파악하는 데 유용합니다.
