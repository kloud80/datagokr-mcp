summary_user: 경기도가 운영하는 일자리 우수기업 인증제의 인증 기업을 기업 한 곳씩 담은 목록으로, 포털 설명상 선정일자·시군명(SIGUN_NM)·기업명·사업장 주소를 담는다. 구직자나 청년이 우리 시군에서 일자리 우수기업으로 인증받은 회사가 어디인지 찾거나, 분석가가 시군별 인증 기업 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명이나 기업명을 이름으로 맞춰 이어야 한다.
description_portal: 이 데이터는 각 지자체에서 고용 창출 및 일자리 질 개선에 기여한 기업을 대상으로 시행하는 ‘일자리 우수기업 인증제’의 운영 현황을 제공하며, 선정일자, 시군명, 기업명, 사업장 주소 등의 정보를 포함하고 있습니다. 일자리 우수기업 인증은 고용 확대, 근로조건 개선, 청년 채용 활성화 등 일자리 중심의 경영을 실천하는 기업에 부여되는 제도로, 기업에 대한 인센티브 제공 및 대외 신뢰도 향상을 목적으로 운영됩니다. 본 데이터를 통해 지역별 우수 기업의 분포를 확인하거나, 일자리 창출 역량이 높은 산업군 분석, 정책 효과 평가 등에 활용할 수 있습니다. 또한 인증 기업 리스트는 청년·구직자에게 양질의 일자리를 찾는 기준 자료로 활용될 수 있습니다.
