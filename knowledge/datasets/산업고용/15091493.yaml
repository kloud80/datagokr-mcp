summary_user: 수소가스법 관련 KGS Code(가스안전 분야 시설·검사·기술 상세기준)의 목록을 코드 한 건당 한 행으로 담은 전국 단위 현황 파일로, 분류·코드번호·코드명·최신버전·내용쪽수로 구성된다. 수소충전소나 수소 설비를 설치·검사하려는 사업자와 안전관리 담당자가 '내 시설에 적용되는 수소 KGS 코드가 무엇이고 최신 버전이 몇인가'를 확인하는 데 쓴다. 코드번호(kgs_code_no)가 조인 키라서 고압가스·LPG·도시가스 등 다른 법령별 KGS Code 현황이나 코드 원문과 코드번호로 맞춰 쓴다.
description_portal: 'KGS Code는 정부에서 승인한 가스안전분야 시설,검사,기술 상세기준으로, 한국가스안전공사에서 보유하고 있는 수소가스 코드 현황 데이터입니다.해당 데이터는 분류, 코드번호, 코드명, 최신버전, 내용쪽수로 구성되어 있습니다.수소가스 관련 KGS코드 최신정보를 쉽게 확인 할 수 있습니다.※ KGS Code : 가스 관계 법령에서 정한 시설·기술·검사 등의 기술적인 사항을 상세기준으로 정하여 코드화한 것으로, 가스기술 기준위원회에서 심의·의결하고 산업통상자원부에서 승인한 가스안전 분야의 기술기준입니다.※ 해당 데이터는 연간 주기로 업데이트 됩니다.※ 2025년 데이터기준일 기준 현황입니다.- 데이터기준일 : 2025년 9월 15일'
