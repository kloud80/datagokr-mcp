description_portal: '충청남도 당진시 토석채취 허가현황 안내(데이터 기준일자: 2026년 7월 16일)충청남도 당진시는 자연환경 보전과 개발행위의 균형을 위해 토석채취 행위에 대한 허가 현황을 체계적으로 관리하고 있습니다.본 자료는 당진시 관내에서 허가받은 토석채취지에 대한 기본 정보를 정리한 것으로, 다음 항목들을 포함하고 있습니다:수허가자연락처허가지 주소면적허가 시작일 / 종료일토석채취용도본 자료는 개발행위 관리, 자원 이용 모니터링, 환경 영향 검토,행정 인허가 업무, 대시민 정보 제공 등 다양한 목적으로 활용될 수 있습니다.'
