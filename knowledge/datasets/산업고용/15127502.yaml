summary_user: 제주지역 전력시장참여 태양광·풍력 발전설비의 발전량을 날짜별 행에 1시~24시 시간대 열로 펼쳐 담은 집계 파일(단위 MWh)이다. 에너지 분석가가 제주의 재생에너지 발전이 하루 중 어느 시간대에 몰리고 날짜별로 얼마나 달라지는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜·시간대를 맞추거나 같은 기관(전력거래소)의 수급·SMP 자료와 이름으로 대조해 이어 쓴다.
limits: 전력시장참여설비의 발전량만 담으므로 시장에 참여하지 않은 설비의 발전은 빠져 있고, 개별 발전소·읍면 단위로는 나눌 수 없다. 포털 파일(zip) 다운로드 방식이라 실시간 조회용 API가 아니며, 조인 키가 없어 다른 데이터와의 연결은 날짜 기준 수동 매핑이 필요하다.
