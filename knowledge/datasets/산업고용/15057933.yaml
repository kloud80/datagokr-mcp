summary_user: 경기도 내 계량기 증명업(검정업) 등록 사업장을 한 곳씩 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·도로명/지번 주소·위경도 좌표·전화번호를 담는다. 분석가나 사업자가 '우리 시군에서 지금 영업 중인 계량기 증명업체는 어디이고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·주소·사업장명으로 맞춰 쓰며, 같은 지방행정 인허가(LOCALDATA) 계열의 다른 업종 현황과 시군 단위로 묶어 비교한다.
description_portal: 이 데이터는 경기도 내 계량기 증명업(검정업) 등록 사업장의 인허가 및 운영 상태를 정리한 자료로, 계량기기의 정밀성과 정확성을 법적 기준에 따라 검정·증명하는 업체에 대한 정보를 포함하고 있습니다. 주요 항목은 시군명, 사업장명, 인허가일자, 인허가취소일자, 영업상태(영업중·폐업), 주소정보(도로명주소, 지번주소), 전화번호, 위경도 좌표(WGS84), 업태구분명, 면적정보 등으로 구성되어 있으며, 계량기의 신뢰성과 유통관리, 소비자 보호를 위한 기초 데이터로 활용됩니다. 해당 자료는 계량산업 기반 정책 수립, 지역별 계량검정 서비스 접근성 분석, 폐업 사업장 추적, 공공서비스 연계계획 수립 등에 유용하게 쓰일 수 있습니다.
