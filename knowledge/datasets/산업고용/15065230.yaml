description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2021년 10월 서울시 연료원별 일별 전력거래량 자료입니다.* 개별 발전기의 전력거래량, 주소 등은 해당 사업자의 영업정보이므로 정보공개법(제9조)에 따라 제 3자에게 제공하지 않고 있습니다.*전력거래량은 한전 전력수급계약(PPA) 등 전력시장에 미등록한 발전기의 발전량은 포함하지 않습니다. 우리나라 총발전량은 “한국전력통계”(한전발간)의 공식 자료 참조하시기 바랍니다.* 거래량은 송전단 기준이며, 한전 전력수급계약(PPA)등은 포함하지 않아 서울의 전체 발전량을 의미하지 않음.단위 : MWh'
