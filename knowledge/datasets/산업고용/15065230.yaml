summary_user: 2021년 10월 서울시의 연료원별 일별 전력거래량(MWh, 송전단 기준)을 지역·연료원·거래일 단위로 담은 집계 파일입니다. 서울에서 특정 연료원으로 하루에 얼마만큼의 전력이 전력시장에서 거래됐는지 확인하려는 에너지 분석가나 연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 전력거래소 자료와는 지역명·연료원 이름이나 거래일로 맞춰 이어 써야 한다.
limits: 한전 전력수급계약(PPA) 등 전력시장에 등록하지 않은 발전기의 발전량은 빠져 있어 서울의 전체 발전량을 뜻하지 않으며, 개별 발전기 단위 거래량은 담지 않는다. 범위가 2021년 10월 한 달이라 실시간·최신 수급 파악에는 맞지 않고, 공통 코드 키가 없어 이름 매핑으로만 연결된다.
