summary_user: 지체장애인협회 자료를 바탕으로 경기도 장애인 택시운전원 취업자 수를 기준년도와 시군 단위로 집계해 합계와 지체·뇌병변·시각·청각·자폐성 등 15개 장애유형별 인원으로 담는다. 장애인 일자리 담당자나 분석가가 "어느 시군에서 어떤 장애유형의 택시운전원 취업이 많은가"를 확인할 때 쓴다. 전역 조인 키는 없고, 시군 코드·시군명(SIGUN_NM)을 이름·코드 매핑하거나 같은 경기도 데이터의 시군 코드로 연결해 지역 고용동향이나 장애인 구인 데이터와 함께 본다.
description_portal: 이 데이터는 지체장애인협회에서 제공하는 경기도 내 장애인 택시운전원의 취업 현황을 기준년도 및 시군 단위로 분류하여 제공하며, 장애 유형별로 세분화된 취업자 수를 남성과 여성으로 나누어 제시하고 있습니다. 포함된 장애유형은 지체, 뇌병변, 시각, 청각, 언어, 안면, 신장, 심장, 간, 호흡기, 장루·요루, 뇌전증, 지적, 정신, 자폐성 등 총 15가지이며, 각각에 대해 남녀 성별 통계를 별도로 제공합니다. 이를 통해 지역별 장애인 고용 분포와 성별, 장애 특성에 따른 취업 현황을 종합적으로 파악할 수 있으며, 장애인 일자리 정책 수립, 택시 운송업 내 포용적 고용 전략 마련, 맞춤형 직업훈련 정책 기획 등 다양한 행정·정책 수립의 기초자료로 활용될 수 있습니다.
