summary_user: 한국수력원자력(주)이 본사와 원전 본부 주변 지역 상권을 위해 시행한 지원사업 실적을 연도·지원구분별 지원금액(원)으로 담은 소규모 집계 파일(csv 약 280바이트)이다. 공기업의 지역상생·사회공헌 성과를 살피는 분석가나 지역상권 지원 정책 담당자가 '한수원이 해마다 전통시장 장보기 같은 상권 지원에 얼마를 썼나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 지원구분 이름으로 맞추거나 같은 기관의 다른 공개자료와 나란히 놓고 본다.
description_portal: 한국수력원자력㈜이 공개한 지역상권활성화 지원사업 실적 데이터는 본사 및 각 원전 본부 인근 지역사회의 경제 활성화를 위해 추진된 다양한 지원사업의 성과를 담고 있습니다. 한국수력원자력㈜은 경주 본사를 비롯해 월성, 고리, 한울, 한빛, 새울 본부 주변 지역의 상권을 활성화하고 지역경제 발전에 기여하기 위해 전통시장 장보기 행사 등 여러 지원사업을 꾸준히 시행해 왔습니다. 해당 자료에는 2019년부터 2024년까지 최근 6년간의 연도별 지원 구분과 지원 금액이 포함되어 있어, 한국수력원자력㈜이 지역사회와의 상생을 위해 얼마나 지속적이고 체계적으로 노력을 기울였는지를 확인할 수 있습니다. 이 데이터는 공기업이 수행하는 사회공헌활동의 구체적인 성과를 보여주는 동시에, 향후 지역상권 지원 정책과 프로그램을 기획하는 데도 유용한 참고 자료로 활용될 수 있습니다. 나아가 한국수력원자력㈜의 지역경제 기여도와 사회적 책임 이행을 객관적으로 입증하는 자료로서, 공공기관의 투명성과 신뢰성을 높이는 데 중요한 의미를 지니고 있습니다.
