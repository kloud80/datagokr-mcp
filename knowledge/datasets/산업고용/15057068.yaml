summary_user: 경기도 안에서 운영되는 마이홈센터(임대주택·주거급여·행복주택 등 주거복지 상담기관)를 센터 한 곳당 한 행으로 담은 목록이며, 기관명·시군·도로명/지번 주소·우편번호·전화번호·홈페이지와 WGS84 위경도를 포함한다. 주거복지 상담이 필요한 도민이 '우리 시군에서 가장 가까운 주거복지 상담 창구는 어디인가'를 찾거나, 분석가가 시군별 상담기관 분포와 사각지대를 지도로 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 경기도의 다른 시군 단위 데이터나 인구·주거 통계와 매핑해 잇는다.
description_portal: 이 데이터는 마이홈포털을 통해 운영되는 경기도 내 마이홈센터의 정보를 제공하며, 각 센터의 기관명, 시군명, 도로명주소 및 지번주소, 우편번호, 전화번호, 홈페이지 URL 등의 항목으로 구성되어 있습니다. 마이홈센터는 임대주택 입주 안내뿐 아니라 뉴스테이, 주거급여, 행복주택 등 다양한 주거복지 정책에 대한 상담을 지원하는 주거복지상담기관입니다. 공간정보 기반 활용을 위해 WGS84 좌표계 기반의 위도 및 경도 정보가 함께 제공되며, 지도 기반의 서비스 위치 시각화 및 지역별 상담 서비스 접근성 분석 등에 활용될 수 있습니다. 이 데이터는 지역 내 주거정책 서비스 인프라의 분포 현황 파악, 주거복지정책 안내 채널 분석, 서비스 사각지대 발굴 등에 유용합니다.
