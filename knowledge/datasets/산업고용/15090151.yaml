description_portal: 이 데이터는 전남개발공사의 2017년부터 2024년까지 연도별 기술개발제품 및 친환경녹색제품 구매현황을 제공합니다.친환경 및 기술 혁신 제품에 대한 공공기관의 구매 실적을 투명하게 공개하고, 관련 기업의 성장을 지원하는 것을 목적으로 합니다.데이터는 연간 구분, 구매합계금액(원), 구매비율(%) 등의 항목으로 구성되어 있으며, 전남개발공사의 내부 구매 기록을 집계하여 작성되었습니다.활용 기대 효과로는 구매 실적을 통해 공공 부문의 환경 및 기술 투자 동향을 파악하고, 관련 시장에 참여하고자 하는 기업들에게 유용한 시장 정보로 활용될 수 있습니다.이를 통해 기업의 판로 개척에 도움을 주고, 공공기관의 사회적 책임을 명확히 보여줌으로써 대국민 신뢰도를 향상시키는 데 기여할 것으로 기대됩니다.
