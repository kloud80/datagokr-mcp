summary_user: 전남 장흥풍력발전소의 SCADA에서 수집한 호기별 나셀 풍속과 계통 유효 전력 시계열에 발전기 제원(제조사, 용량, 허브높이, 로터직경)과 위치를 붙인 파일 데이터로, 2022-01-01~2025-12-31 기간 979,324행을 담는다. 분석가나 연구자가 풍속 변화에 따른 발전 효율이나 풍력 발전량 예측 모델 학습 질문에 쓴다. 주소(address)와 위경도(coord) 키로 다른 발전소 원장이나 지역 기반 자료와 이어 쓴다.
description_portal: 본 데이터는 한국서부발전의 전남 장흥풍력발전소에서 운용 중인 SCADA(Supervisory Control and Data Acquisition) 시스템을 통해 수집된 발전소의 실시간 운용 및 설비 정보 파일 데이터입니다.2022년부터 2024년까지는 10분 단위 데이터로, 2025년 데이터는 1시간 단위 데이터로 제공됩니다.주요 내용은 고해상도 시계열 데이터로 구성되어 있으며, 각 발전 호기별 나셀(Nacelle) 풍속과 계통 유효 전력량을 포함하고 있어 풍속 변화에 따른 발전 효율 분석이 가능합니다. 또한, 발전기의 제조사, 모델명, 정격 용량, 허브 높이, 로터 직경과 같은 상세 제원 정보와 발전소의 정확한 지리적 위치(주소, 위경도) 정보가 함께 제공됩니다.위·경도 정보는 도분초(DMS) 방식이 아닌 십진수(Decimal Degrees) 데이터로 제공됩니다.본 데이터는 AI 기반의 풍력 발전량 예측 모델 학습, 신재생에너지 발전 효율 최적화 연구, 지역별 풍력 자원 분석 및 에너지 관리 시스템(EMS) 개발 등 다양한 데이터 분석 및 인공지능 모델링 분야에서 핵심 기초 자료로 활용될 수 있도록 최적화되어 제공됩니다.
