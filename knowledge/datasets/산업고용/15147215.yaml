summary_user: 서울시 상권분석서비스의 점포 현황을 기준 분기(STDR_YYQU_CD)·자치구·서비스 업종별로 집계한 자료로, 점포 수, 유사 업종 점포 수, 프랜차이즈 점포 수, 개업·폐업 점포 수와 개업률·폐업률을 담는다. 창업 예정자나 상권·자영업 정책 분석가가 '이 자치구에서 이 업종의 점포가 최근 분기에 늘었나 줄었나, 폐업률은 다른 구보다 높은가'를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 자치구 코드·이름(SIGNGU_CD)과 서비스 업종 코드를 이름·코드 매핑하거나 같은 서울시 상권분석서비스 계열 자료와 같은 코드 체계로 맞춰 잇는다.
limits: 자치구 단위 집계라 개별 점포(상호·좌표)나 자치구보다 작은 상권 단위의 분포는 알 수 없다. 호출에는 포털 활용신청과 별도로 서울 열린데이터광장(data.seoul.go.kr) 인증키가 필요하다. 전국 공통 조인 키가 없어 다른 기관 데이터와 붙일 때는 자치구·업종 코드를 직접 매핑해야 한다.
