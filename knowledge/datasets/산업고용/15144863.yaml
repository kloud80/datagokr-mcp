description_portal: 한국노동연구원은 노동시장 및 고용정책과 관련된 주요 이슈를 논의하고 사회적 합의를 모색하기 위한 토론회 및 세미나를 정기적으로 개최하고 있습니다. 이러한 공개 토론의 목적은 연구 성과의 사회 환원, 정책 수요자와의 소통 강화, 현장 전문가 및 시민과의 교류 확대에 있으며, 이를 위해 연구원 대표홈페이지의 ‘토론세미나’ 게시판을 통해 행사 일정을 안내하고 참가 등록 정보를 제공합니다. 공공데이터 개방은 해당 게시판에 게재된 행사 정보의 메타데이터를 포함하고 있으며 행사명, 주최 및 후원, 개최 일시, 장소, 발표자 및 토론자 정보, 사전 등록 정보 등을 포함하고 있습니다.
legal_basis_portal: 연구성과의 공표 및 정보 제공을 위해 토론회 및 세미나를 정기적으로 개최하고 대표 홈페이지를 통해 안내하며 이에 따라 발생하는 메타데이터를 보관한다.
