summary_user: 경기도 남양주시 전역의 주유소와 LPG충전소를 사업장 한 곳당 한 행으로 담은 파일로, 업종구분(주유소/충전소), 사업장명, 도로명·지번 주소, 위도·경도, 부지면적(제곱미터), 데이터기준일을 담는다. 남양주시 안에서 주유소·LPG충전소가 어디에 몇 곳 있고 부지 규모가 어느 정도인지 지도로 확인하려는 주민·사업자·입지 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경기도 남양주시 주유소 및 LPG충전소 현황 데이터로 업종구분, 사업장명, 소재지주소, 위도 및 경도, 부지면적 정보를 제공합니다.경기도 남양주시 주유소 및 LPG충전소 현황 데이터는 업종구분(충전소/주유소), 소재지(시전역), 부지면적(제곱미터), 위경도, 데이터기준일과 관련한 정보를 제공합니다."주유소 및 LPG충전소 현황 데이터"란, 특정 지역이나 국가 내에서 운영 중인 **주유소(휘발유, 경유 등 공급)**와 **LPG 충전소(액화석유가스 충전소)**에 대한 다양한 정보를 담고 있는 데이터를 말합니다.(기본정보, 위치정보 등 제공)
