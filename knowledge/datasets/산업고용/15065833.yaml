description_portal: 한국가스공사 발간 '천연가스산업 연구' 학술지의 논문 현황을 체계적으로 정리한 데이터 입니다.산학협동 및 학문간 교류 증진, 천연가스 산업 연구 활성화, 연구성과 확산을 목적으로 수집되었습니다. 데이터 구성항목은 2017년부터 2019년까지 3개년간 발간된 논문의 발간연도와 제목으로 이루어져 있어 연도별 연구주제 동향을 종합적으로 파악할 수 있습니다.본 데이터를 활용하면 연도별 발간 논문 현황 파악, 연구주제별 동향 분석, 학술활동 성과 평가, 산학협력 연구 현황 파악, 연구분야별 논문 분포 분석이 가능합니다. 또한 관련 연구 수행 시 선행연구 검토, 산학협력 과제 기획, 연구자 네트워크 구축, 공동연구 주제 발굴에 활용됩니다. 천연가스 산업 관련 학술연구 활성화와 산학연 협력 강화에 기초자료로 활용되어 천연가스 산업의 학문적 발전과 기술혁신에 기여합니다.
