summary_user: 창업진흥원 글로벌 기업 협업 프로그램의 주관기관 목록을 기관 단위로 담은 소규모 파일(csv 478바이트)로, 기관별 지역·기관명·주력 지원 기술분야(인공지능, 클라우드, 제약·바이오 등)·주소를 담는다. 창업자가 "우리 지역에서 인공지능이나 헬스케어 분야를 주력으로 지원하는 주관기관은 어디인가"를 찾거나, 분석가가 지역별 기술분야 특화 현황을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주관기관명이나 주소·지역명을 매핑해 이어야 한다.
description_portal: 해당 데이터는 창업진흥원이 제공한 창업 지원 관련 주관기관 정보로, 번호, 지역, 주관기관명, 주력지원기술분야, 주소 항목으로 구성되어 있습니다. 각 기관은 모바일 앱 및 게임, 인공지능, 클라우드, 양자컴퓨팅, 제약·바이오, 헬스케어, 스마트 모빌리티, 전자·전기 등 다양한 기술 분야를 중심으로 한 지원 역량을 보유하고 있으며, 해당 기술분야별 기관 현황을 통해 지역 내 기술 특화도 및 역량 집중도를 파악할 수 있습니다. 또한 상세 주소 정보를 포함하고 있어, 창업 기업의 네트워킹, 기술 협업, 멘토링 연계, 사업화 지원처 탐색 등에 실질적으로 활용될 수 있도록 구성되어 있습니다. 정책 수립 및 기관 간 협업 구조 기획 시에도 유용한 참고 자료입니다.
