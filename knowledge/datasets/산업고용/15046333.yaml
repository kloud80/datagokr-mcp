description_portal: '○ 통계개요* 통계명 : 건축물 통계* 통계종류 : 서울시 건축물 현황을 제공하는 보고통계, 일반통계* 작성대상 : 건축법령에 의거 합법적으로 건축된 전국의 건축물* 작성목적 : 건축물에 대한 용도별, 층수별 등에 관한 구체적인 현황을 파악하여 건축경기 예측을 위한 정책수립의 기초 자료로 활용* 조사체계 : 시군구 → 시도 → 국토교통부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 용도별, 층수별, 면적별 건축물 현황○ 용어설명* 건축물 : 토지에 정착하는 공작물중 지붕과 기둥 또는 벽이 있는 것과 이에 부수되는 시설물, 지하 또는또는 고가의 공작물에 설치하는 사무소, 공연장, 점포, 차고, 창고, 기타 대통령령이 정하는 것* 용도별** 주거용 : 단독주택(단독, 다중, 다가구주택 등), 공동주택(아파트, 연립, 다세대주택 등)** 상업용 : 근린생활시설, 판매시설, 운수시설, 업무시설, 숙박시설, 위험물저장및처리시설, 자동차관련시설, 야영장시설** 공업용 : 공장, 위험물제조소** 교육및사회용: 묘지관련시설, 관광휴게시설, 장례시설, 문화및집회시설, 종교시설, 의료시설, 교육연구시설, 노유자시설, 수련시설, 운동시설** 기타 : 동식물관련시설, 교정및군사시설, 방송통신시설, 발전시설, 공공업무시설, 창고시설, 분뇨및쓰레기처리시설, 가설건축물, 자원순환관련시설○ 기 타* "건축물대장"에 등재되어 있는 적법한 건축물의 현황 자료를 기초로 국토교통부내의 "인터넷건축행정시스템"을 통해 조사* 한 건축물에 여러 용도가 포함되어 있는 경우, 각 층별 용도 중 가장 넓은 면적을 차지하는 용도를 대표용도로 선정하여 동수를 집계'
