description_portal: "이 자료는 석유·석탄·천연가스·태양광 등 자연상태에서 얻을 수 있는 '1차 에너지'가 세계 각국에서 얼마나 공급되고 있는지를 보여주는 통계입니다. 전체 에너지 소비량 중 ‘교통 분야’가 얼마나 차지하는지도 연도별로 함께 비교할 수 있습니다.1. 형식: 웹 그래프(시각화) + 엑셀 다운로드2. 내용 요약■ 대상 국가: 우리나라를 포함해 미국, 중국, 일본, 독일, 프랑스 등 주요 국가와 전 세계, OECD 국가 등■ 기간: 1990년부터 2022년까지 매년 자료 제공3. 활용 예제■ 우리나라가 다른 나라에 비해 에너지를 얼마나 많이 쓰는지, 특히 자동차나 비행기처럼 교통수단에서 에너지를 얼마나 쓰는지 비교해 볼 수 있습니다.■ 정부나 기업이 전기차·수소차 같은 친환경 교통정책을 세울 때 참고할 수 있는 중요한 자료입니다.■ 학생이나 일반 시민도 쉽게 그래프를 통해 나라별 에너지 소비 흐름을 살펴보고, 환경과 에너지에 대한 이해를 높일 수 있습니다."
