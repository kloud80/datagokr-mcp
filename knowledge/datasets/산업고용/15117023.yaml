summary_user: 한국전력공사 전기차충전서비스운영시스템에서 쓰는 휴일 달력으로, 날짜별로 휴일명과 휴일 여부를 담은 작은 CSV 파일(469 bytes)이며 포털 설명상 2025년 1~12월을 다룬다. 충전 사업자나 분석가가 "설·추석 같은 휴일 전후로 충전 수요가 달라지는가"를 볼 때 날짜에 휴일 표시를 붙이는 보조 자료로 쓴다. 전역 조인 키는 없고, 충전 이용량·전력 수요 같은 일별 데이터와 일자 값을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 한국전력공사에서 운영하는 전기차충전서비스운영시스템의 휴일관리 데이터입니다.일자, 휴일명, 휴일여부 항목으로 구성되어 있어, 2025년 1월부터 12월까지의 휴일 일정을 확인할 수 있습니다.이 데이터는 각 휴일에 대한 날짜 정보를 담고 있어, 충전 서비스 제공 일정과 고객 이용 패턴을 비교·분석하는 데 유용합니다. 특정 휴일 전후의 충전 수요 증가 여부를 예측할 수 있고, 충전 인프라 운영 계획을 보다 정밀하게 조정할 수 있습니다. 또한, 휴일별 이용량 추세를 파악함으로써 전력 수요 예측 모델에 반영할 수 있습니다.
