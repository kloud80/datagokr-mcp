summary_user: 광주광역시에 소재한 대기업을 업체별로 한 행씩 담은 목록 파일로, 업종 분야·소재 구·생산품목·고용인원·2024년 매출액(억원)을 담는다. 지역 산업 분석가나 구직자가 '광주 어느 구에 어떤 업종의 대기업이 있고 고용 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 기업 데이터와는 업체명이나 구 이름으로 맞춰 연결해야 한다.
description_portal: '광주광역시에 소재하고 있는 대기업현황 자료입니다.본 자료는 광주광역시 소재하고 있는 대기업 현황을  정리해서, 지역 내 주요 산업구조와 경제활동의 흐름을 파악하는데 활용할 수 있습니다.자료조사는 기업별로 기업공시 및 전화조사를 통해 데이터를 확보하고 매년 업데이트 하고 있습니다.본 자료에 포함된 데이터는 아래와 같습니다.- 업종분야 : 각 기업이 속한 산업 분야- 소재지(구단위) : 기업이 소재한 지역- 생산품목 : 기업별로 주요 생산 제품 및 서비스- 고용인원 : 기업별 고용인원- 매출액 : 기업의 연간 매출 규모본사와 지사가 다른 경우에는 광주(지사) 기준으로 작성했습니다.'
