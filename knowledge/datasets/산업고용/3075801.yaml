summary_user: RPS 제도에서 설치확인된 발전소와 REC 발급 현황을 구분 항목별로 태양광·풍력·수력·바이오·폐기물·조류·연료전지·석탄가스화 에너지원 열로 나눠 담은 전국 단위 집계 파일(zip 약 3.4KB)이다. 분석가나 정책 담당자가 'RPS에서 에너지원별로 설치확인과 REC 발급이 어느 쪽에 몰려 있나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 에너지원 이름을 맞추거나 같은 기관(한국에너지공단) 자료끼리만 이어 쓴다.
description_portal: 신재생에너지 공급의무화(RPS)는 500MW 이상의 발전설비(신재생에너지 설비 제외)를 보유한 발전사업자에게 총 발전량의 일정 비율 이상을 신·재생에너지로 공급하도록 의무화하여, 신재생에너지 확대와 온실가스 감축을 촉진하는 제도입니다.의무 이행을 입증하기 위해 신재생에너지 설비 설치 확인 후 REC(신재생에너지 공급인증서)를 발급하며, 공급의무자는 이를 통해 의무 이행 실적을 증명합니다.본 데이터는 RPS 제도하에 설치확인된 발전소 및 REC 발급 현황 정보를 제공하여 정부와 기업이 신재생에너지 보급 현황 분석, 시장동향 파악 및 에너지 정책 수립과 관련한 기초자료로 활용할 수 있도록 지원합니다.
