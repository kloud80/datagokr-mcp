summary_user: 서울시 행정동별 아파트 현황을 기준 분기(STDR_YYQU_CD) 단위로 집계해, 단지 수, 전용면적 구간별·가격대별 가구 수, 평균 전용면적과 평균 시세를 담는다. 상권 분석가나 창업 준비자가 '이 행정동 배후 주거지의 아파트 규모와 가격 수준은 어느 정도인가'를 비교할 때 쓴다. 행정동 코드(ADSTRD_CD)와 행정동명이 있으나 실측상 전역 조인 키로 확인되지 않아, 서울시 상권분석서비스의 다른 행정동 데이터와는 같은 기관 코드나 이름 매핑으로 이어 쓴다.
description_portal: 이 데이터는 서울시 각 행정동별 아파트 현황을 세부적으로 제공하는 자료입니다. 행정동 단위로 아파트 단지 수(HSMP), 전용면적 구간별 가구 수(66㎡ 이하, 66㎡, 99㎡, 132㎡, 165㎡ 이상)와 가격대별 가구 수(1억 미만, 1억대, 2억대, 3억대, 4억대, 5억대, 6억 이상) 현황이 포함됩니다. 또한 평균 전용면적(㎡)과 평균 시세(거래가격)를 함께 제공하여 지역별 주거 특성을 세밀하게 파악할 수 있습니다. 이를 통해 행정동 단위의 주택 규모 분포, 가격 구조, 주거 수준 등을 비교·분석할 수 있으며, 도시계획, 부동산 시장 조사, 주거복지 정책 수립 등 다양한 분야에서 활용 가능한 기초 자료로 제공됩니다.
