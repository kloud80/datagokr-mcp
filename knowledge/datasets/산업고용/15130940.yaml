description_portal: 한국광해광업공단의 "연탄쿠폰 코드정보" 데이터는 디지털연탄시스템의 사용을 용이하게 하기 위해 연탄쿠폰 코드정보, 쿠폰발행유형, 지원대상 구분 등의 코드를 제공합니다. 이 데이터는 연탄쿠폰의 관리와 운영을 체계적으로 지원하기 위한 표준화된 코드 정보를 담고 있으며, 연탄쿠폰의 발급, 사용, 관리 등 다양한 행정 절차를 전산화하는 데 활용됩니다. 특히, 디지털 연탄쿠폰 시스템은 종이쿠폰의 분실, 미수령 등 기존 문제를 해결하고, 저소득층을 위한 에너지 복지 지원의 투명성과 효율성을 높이기 위해 도입되었습니다.  그리고, 누구나 무료로 다운로드하여 활용할 수 있습니다. 또한, 연탄쿠폰 지원사업의 대상자 선정, 쿠폰의 발급·사용 내역 관리, 관련 통계 분석 등 다양한 행정 및 연구 목적으로 활용되고 있습니다.
