summary_user: 전력거래소가 낸 전국 단위 전력수급 예보를 날짜(fcDate)별로 담은 API로, 예보 시작·종료 시간과 최대예측수요, 예측예비력, 경보단계가 함께 나온다. 사업자나 분석가가 오늘·가까운 날의 전력수요가 얼마나 높고 예비력이 넉넉한지, 수급 경보가 예상되는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 전력 수급·시장 데이터와는 날짜·시간을 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: ㅇ 전력거래소는 정부의 장단기 전력수급기본계획 수립, 수요예측모형개발 등 정부지원업무를 담당함으로써 국민에게 질 좋은 전기를 안정적으로 공급하며, 전력산업의 미래와 국가경제에 이바지하고 있습니다.ㅇ 전력수급기본계획은 수요예측, 발전설비계획, 수요관리계획, 송변전설비계획, 신재생설비계획 등 전력수요와 공급을 일치시키기 위한 종합적인 계획을 말하며, 경기변동과 미래 불확실성에 따른 수요예측 오차에 대비하고 있습니다.ㅇ 아울러 안정적으로 전기가 항시 공급될수 있도록 일정규모의 예비력을 보유하고 있습니다.ㅇ 해당목록은 전력수요 예측 및 수요전망 관련 정보를 제공합니다.
