summary_user: 녹색인증 가운데 녹색기술인증을 받아 기준일 현재 유효한 기술을 인증 건별로 담은 전국 단위 파일로, 기술명칭·분류·신청기관·발급부처·인증확정일과 만료일이 들어 있다(CSV 약 354KB). 특정 기업이 유효한 녹색기술인증을 보유했는지 확인하려는 사업자·투자자, 그리고 분야별 녹색기술 인증 분포를 보려는 정책 분석가가 쓴다. 사업자등록번호(bizno)로 기업 정보·다른 인증기업 목록과 잇고, 인증번호(green_cert_no)로 녹색인증 관련 다른 자료와 대조한다.
description_portal: 한국산업기술진흥원의 녹색기술인증현황 데이터는 녹색인증 중 하나인 녹색기술인증에 해당하는 자료로서, 인증받은 녹색기술의 유효한 목록들을 제공합니다. 데이터는 인증 기준일 현재 활성 상태에 있는 녹색기술을 포함하고 있으며, 각 기술의 세부 내용을 확인할 수 있습니다. 본 데이터는 기업의 친환경 기술 개발과 관련된 연구, 정책 수립 및 시장 조사를 위한 기반 자료로 활용될 수 있습니다. 이 데이터는 다음과 같은 구조로 이루어져 있습니다. 순번(숫자형), 인증번호(문자형), 기술명칭(문자형), 분류코드(문자형), 분류코드명(문자형), 신청기관명(문자형), 사업자등록번호, 발급부처(문자형), 인증확정일(날짜형), 인증만료일(날짜형) 등으로 구성되어 있습니다. 각 기술의 순번은 데이터의 고유 식별자로 작용하며, 인증번호는 해당 기술의 인증을 공식적으로 나타냅니다. 기술명칭은 구체적인 기술의 이름을, 분류코드는 기술의 유형을 나타내고, 신청기관명은 인증을 요청한 기관의 명칭을 포함합니다. 발급부처는 인증을 담당한 정부 기관을 나타내며, 인증확정일과 인증만료일은 인증의 유효기간을 명시합니다.
