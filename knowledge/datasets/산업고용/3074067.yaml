description_portal: '공공연구기관(대학, 연구소)의 기술이전.사업화 현황을 조사함으로써 기술이전.사업화 촉진사업의 성과 평가지표로 활용하고, 연구개발 성과의 효과적인 확산과 활용을 지원할 과제를 발굴함으로써 공공연구기관의 연구개발 생산성을 제고- 주요내용 : 공공기술이전사업화현황(기관, 사례수, 기술양도(매매), 기술이전_계약체결_건수 등)<조사개요> - 조사대상 : 「기술의 이전 및 사업화 촉진에 관한 법률」 제2조 6호에 규정된 공공연구기관을 대상으로 공공 기술이전 및 사업화를 조사한 결과 - 조사방법 : 이메일, 웹 등을 이용한 조사지 회수 및 온라인 조사 시스템을 이용한 입력 - 조사주기 : 1년 - 조사내용 : 일반현황, 기술확보 및 관리활용, 기술이전 및 사업화 관련 활동 및 성과, 기술이전 및 사업화 성과의 관리, 기술이전 및 사업화 지원제도 및 인식의 5가지 영역으로 구분'
