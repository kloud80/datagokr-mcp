summary_user: 공공연구기관(대학·연구소)의 기술이전·사업화 현황을 기관 구분별로 집계한 연간 조사 결과로, 이전 방식(양도·무상양도·유상/무상 라이선스·옵션 등)과 이전 대상(대기업·중견·중소·해외기업 등)별 계약 체결 건수와 기술료 수입(백만원)을 담은 작은 CSV 파일(약 2KB)이다. 정책 분석가나 연구기관 기술사업화 담당자가 '공공기술은 주로 어떤 방식으로, 어느 규모의 기업에 이전되고 기술료 수입은 얼마인가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관 구분 이름을 맞추는 방식으로만 연결한다.
limits: 전국 단위의 비공간 집계라서 지역별 분석이나 개별 기술·개별 계약 단위 조회에는 쓰지 못한다. 기관 코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 기관명을 직접 매핑해야 한다.
