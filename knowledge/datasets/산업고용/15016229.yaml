summary_user: 인천광역시 미추홀구 안의 백화점·대형마트·쇼핑센터·준대규모점포를 점포 한 곳당 한 행으로 담은 원천 목록으로, 업종명·상호명·도로명주소·휴점일·운영시간·전화번호·위경도를 포함하며 파일 크기는 약 2.6KB로 작다. 주민이 집 근처 대형마트의 의무휴업일과 영업시간을 확인하거나, 분석가가 미추홀구 대규모 유통시설의 분포와 소비자 접근성을 지도 위에서 살피는 데 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 상권·상가업소 데이터와는 상호명·도로명주소 문자열 매칭이나 위경도 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구의 대규모점포 정보를 담고 있습니다. 연번, 업종명, 상호명, 도로명주소, 휴점일, 운영시간, 전화번호, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 대규모점포의 위치와 운영 정보를 파악할 수 있으며, 백화점, 대형마트, 쇼핑센터, 준대규모점포 등 다양한 유형의 유통시설 현황을 확인할 수 있습니다. 각 점포의 휴점일과 운영시간 정보를 통해 이용 가능 시간을 파악할 수 있으며, 대부분 매월 둘째, 넷째 일요일에 의무휴점을 시행합니다. 위경도 좌표를 통해 정확한 위치를 확인할 수 있습니다. 이 데이터는 지역 내 유통시설 분포 현황 파악, 소비자 접근성 분석, 상권 구조 연구 등에 활용될 수 있습니다.
