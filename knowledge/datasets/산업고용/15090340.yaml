summary_user: 한국지역난방공사가 지역난방을 공급하는 건물을 한 건씩 담은 파일로, 기준일·용도(공공용·아파트 등)·건물명·주소를 기록하며 범위는 전국, 위치는 개별 주소 단위다. 우리 동네나 특정 아파트가 지역난방을 받는지, 지역·용도별로 공급 건물이 어떻게 분포하는지 알아보려는 주민·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 건물명을 매핑해서만 이어 쓸 수 있다.
description_portal: '(한국지역난방공사) 건물별 지역난방 공급현황 정보1. 주의 사항 : 2020년 6월 ~ 2022년 12월까지 자료 제공2. 컬럼 내용(일부 항목 기재)■ 기준일(varchar)(예시 : 2020-06-30, 2022-12-31)■ 용도(varchar)(예시 : 공공용, 아파트)■ 건물명(varchar)(예시 : 화정고등학교, 청주가경아이파크4차아파트)■ 주소(varchar)(예시 : 경기도 고양시 덕양구, 충청북도 청주시 흥덕구)3. 활용 예제■ 지역별 지역난방 공급현황 시각화 맵 작성■ 연도별 지역난방 공급 현황 변화 분석■ 건물 용도별 지역난방 공급 비중 현황 분석'
