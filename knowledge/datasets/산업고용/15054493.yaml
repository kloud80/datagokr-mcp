description_portal: 이 문서는 한전케이피에스주식회사가 고소작업 및 개구부 인근 작업에서의 추락재해 예방을 위해 제작한 교안으로, 추락 사고의 위험성과 주요 발생 요인, 예방 대책을 간결하면서도 명확하게 전달한다. 문서에는 작업발판, 개구부 덮개, 안전난간 등 추락방지시설의 설치 기준과 사용 시 유의사항이 도식과 함께 제시되어 있으며, 개인 보호구(안전벨트, 안전모 등)의 올바른 착용법도 강조된다. 특히 고소작업 전 위험성 평가 실시, 작업계획서 작성, 작업자 교육 및 TBM 시행의 필요성을 강조하면서, 추락사고가 발생할 수 있는 전형적인 사례와 그에 따른 조치사항이 병기되어 있다. 또한 관리자와 작업자가 반드시 점검해야 할 체크포인트와, 작업 환경별 추락위험요소(사다리, 비계, 개구부, 지붕 작업 등)별 대응 방안을 구체적으로 소개함으로써 실질적인 현장 활용도를 높였다. 이 교안은 신규 채용자 교육뿐만 아니라, 고소작업 전 브리핑, 정기 안전교육, 위험성평가 자료로도 적합하며, 전사적 추락사고 예방 활동에 효과적으로 기여하는 자료이다.
