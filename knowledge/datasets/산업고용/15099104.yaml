summary_user: 한국수자원공사가 관리하는 전국 다목적댐 발전소의 운영현황을 발전소 단위로 담으며, 확인된 필드는 발전소 코드(elcpwstnCd)와 발전소명 정도다. 에너지 분석가나 연구자가 '수자원공사 다목적댐에는 어떤 수력발전소가 있는가'를 확인하고 발전소 목록을 정리할 때 쓴다. 전역 조인 키가 없어 다른 발전설비 데이터와는 발전소 이름 매핑이나 같은 기관(한국수자원공사)의 발전소 코드로만 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 태양광 발전사업 허가 표준데이터 등 다른 기관의 발전소 원장과 바로 결합할 수 없다. 데이터는 전국 범위의 비공간 자료라 좌표 기반 지도 분석에는 별도 위치 정보가 필요하다. 개발계정은 하루 100회 호출로 제한된다.
