description_portal: 동남아대양주 지역 소재 다양한 국가들 간의 수출 유사도를 분석한 데이터 입니다. 동남아대양주 지역본부 내 국가 중 3개년 (21년-23년)간 전체 품목으로 수출한 기업 수를 집계, 국가별/품목별 수출 기업 수를 기준으로 국가별 수출 유사도를 코사인 유사도로 산정하였습니다. 코사인 유사도는 두 벡터 간의 유사성을 측정하는 방법으로, 주로 벡터 공간 모델에서 사용됩니다. 이 데이터는 특정 국가들이 다른 국가들과 비교해 얼마나 비슷한 수출 구조를 가지고 있는지, 즉 어떤 산업이나 제품군에서 유사한 수출 경향을 보이는지를 분석하는 데 활용할 수 있습니다. 국제무역을 하고 있는 기업들에게 수출 전략 수립, 마케팅, 시장 분석 등에 중요한 역할을 합니다.
