summary_user: 대전광역시 서구 관내 대형마트와 준대규모점포(기업형 슈퍼마켓)를 점포 한 곳당 한 행으로 상호·주소·면적(제곱미터)·전화번호·점포 구분을 담은 소규모 목록 파일(약 2.4KB CSV)이다. 서구 안에 대형마트나 기업형 슈퍼마켓이 어디에 몇 곳 있고 규모가 어느 정도인지 알고 싶은 주민·소상공인·상권 분석가가 입지 검토나 상권영향 파악에 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 맞춰 붙여야 하며, 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 원장과 주소 기준으로 대조해 쓴다.
limits: 대전 서구 한 개 구만 담아 다른 시군구나 전국 비교에는 다른 지자체 자료나 전국 표준데이터가 따로 필요하다. 공통 코드 키가 없어 연계 시 주소·상호 문자열 매칭에 의존하며, 좌표는 실측 필드에 없어 지도 표시에는 주소 변환이 필요하다.
