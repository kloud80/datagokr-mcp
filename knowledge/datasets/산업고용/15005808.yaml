description_portal: 본 데이터는 2014년 12월 말 기준으로 방사성동위원소를 내장한 기기의 국가별 수입 현황을 정리한 자료입니다. 본 데이터는 국가명, 방사성동위원소 내장기기의 대수, 수입액 등으로 구성되어 있어, 각 국가로부터 국내로 수입된 관련 기기 규모와 경제적 가치를 확인할 수 있습니다. 이를 통해 특정 국가에서의 수입 의존도, 수입량 변화, 시장 규모 등을 분석할 수 있으며, 방사선 활용 산업 및 의료·연구 장비 수급 현황을 파악하는 기초자료로 활용될 수 있습니다.본 데이터와 함께 활용할 수 있는 연관데이터로는 방사선발생장치의 국가별 수입현황, 방사성동위원소 국가별 수입현황, 방사성물질 종류별․국가별 운반용기 설계승인 현황 등이 있습니다.
