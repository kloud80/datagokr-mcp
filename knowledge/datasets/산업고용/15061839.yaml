description_portal: 한국수력원자력에서 공개하는 연도별 홍보자료 현황 데이터입니다. 한국수력원자력㈜은 회사의 사업과 행사 등에 대한 대국민 홍보를 위하여 홍보용 보도자료를 작성하여 언론매체에 발송하고 있습니다. 한국수력원자력㈜이 제공하는 연도별 홍보자료 현황 데이터는 2019년 1월부터 회사 관련 사업, 행사 등과 관련된 언론 홍보용 보도자료 제목 정보를 포함하고 있습니다. 제공항목은 연월, 홍보자료로 구성되어 있습니다. 연월의 경우 과거 연도와 월이 나누어져 있는것을 데이터 가공을 통해 연도와 월이 합쳐진 YYYY-MM 형식으로 제공됩니다.
