summary_user: 전라남도 구례군에서 허가받은 태양광발전소를 발전소 한 곳씩 담은 원장 파일로, 인허가번호·상호·소재지(도로명·지번)·설치장소·설비용량(kW)·공급전압·주파수·허가일자가 들어 있다. 구례군 안에서 어느 지역에 태양광 설비가 몰려 있고 언제 얼마만큼의 용량이 허가됐는지 알아보려는 주민·사업자·에너지 분석가가 쓴다. 전역 조인 키는 없으므로 주소나 상호·인허가번호를 기준으로 전국태양광발전소전기사업허가정보 표준데이터나 다른 시군의 태양광 현황과 맞대어 쓴다.
description_portal: 전라남도 구례군 태양광발전소현황에 대한 내용으로 인허가번호, 상호, 소재지(도로명). 소재지(지번) 설치장소소재지, 영업구분, 원동력의종류, 설비용량, 공급전압, 주파수, 허가일자 등을 제공합니다.
