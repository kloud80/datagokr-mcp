summary_user: 전기차 모델별로 어떤 충전방식을 쓰는지를 차량명·충전방식·등록일 세 항목으로 정리한 전국 단위 비공간 목록 파일(약 3.4KB CSV)이다. 충전 사업자나 정책 담당자가 '특정 충전 규격을 쓰는 차량 모델이 무엇인가'를 확인해 충전기 규격 구성이나 호환성 계획을 세울 때 쓴다. 전역 조인 키가 없어 충전소 현황 등 다른 데이터와는 충전방식 이름이나 차량명을 직접 맞춰 이어 써야 한다.
description_portal: 한국전력공사에서 제공하는 전기차량별 충전방식 및 현황 데이터 입니다.차량명, 충전방식, 등록일 항목으로 구성되어 있어 전기차별로 어떤 충전 인프라가 사용되는지 확인할 수 있습니다.사용자는 차량 모델과 충전방식별 현황을 정량적으로 비교할 수 있어, 전기차 충전 인프라 정책 수립 및 충전소 배치 전략에 활용할 수 있습니다.특정 충전 방식에 대한 수요가 높은 차량을 분석하여 지역별 충전소 구축에 우선순위를 정하는 등 내부 의사 결정을 하는데 기초자료로 활용 할 수 있습니다.충전 표준별 보급현황을 기반으로 향후 충전기 호환성 개선 및  신기술 도입 계획을 세울 수 있습니다.
