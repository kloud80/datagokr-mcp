description_portal: 주식회사한국중소벤처기업유통원은 시장 경쟁 속에서 판로개척에 어려움을 겪고 있는 우수한 중소벤처기업 및 소상공인 제품의 역량 강화부터 인프라 지원, 시장 진출까지의 전주기적 판로지원을 통해 중소벤처기업 및 소상공인의 경쟁력 향상과 경영안정에 기여하는 공공기관입니다.우리기관의 지원관리하는 사업은 동반성장몰, TV홈쇼핑 방송판매 대행, 백화점 운영, 직접생산확인제도, 공공구매제도, 소상공인 기반구축, 소모성자재납품 중소기업 지원 등 총 17개의 사업을 운영중에 있습니다.이 중 중소기업전용판매장 및 홈쇼핑판매대행 지원사업의 카테고리별 매출비정 정보를 2015년부터 2019년까지의 데이터를 제공합니다.
