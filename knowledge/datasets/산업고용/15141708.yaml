summary_user: 충청북도 단양군에서 준공되지 않았거나 개발행위허가를 받은 태양광발전소 사업부지를 필지(지번) 단위로 한 줄씩 담은 원천 목록으로, 허가일자·읍면·리·지번·지목·면적·용도지역·준공여부·허가내용·설비용량(킬로와트)을 포함한다. 주민이나 연구자가 우리 마을 어느 필지에 태양광 허가가 났고 아직 준공되지 않았는지, 읍면별로 허가 용량이 얼마나 몰려 있는지 확인하는 데 쓴다. 전역 조인 키(법정동코드·PNU 등)는 없으므로 읍면·리·지번을 조합한 주소로 전국태양광발전소전기사업허가정보 표준데이터나 토지 정보와 이름 매칭해 이어 쓴다.
description_portal: 충청북도 단양군의 태양광발전소 미준공 또는 개발행위허가 사업부지에 대한 현황을 정리한 데이터입니다. 각 연도별 허가일자, 읍면, 리, 지번, 지목, 면적(제곱미터), 용도지역, 준공여부, 허가내용, 전력량(킬로와트), 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 지역 태양광발전소 미준공 또는 개발행위허가 현황 파악, 분석 및 연구자료로 매우 유용하게 활용 될 수 있습니다. 데이터기준일자는 2025년 2월 6일입니다. 담당부서는 단양군청 관광건설국 경제과이며 문의주시면 최신의 충청북도 단양군 태양광발전소 미준공 또는 개발행위허가 사업부지 현황 내역을 열람하실 수 있게 도와드립니다
