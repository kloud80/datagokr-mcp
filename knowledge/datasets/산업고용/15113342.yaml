summary_user: 익산시에 설치된 태양광발전시설을 발전소 한 곳당 한 행으로 담은 원장 파일로, 발전소 명칭·설치위치·설비용량·허가일·사업개시신고일을 포함한다. 익산시의 태양광 발전소가 어느 지역에 얼마의 용량으로 들어서 있는지, 언제 허가받고 사업을 시작했는지 확인하려는 주민·사업자·지역 에너지 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전소명이나 설치 주소를 맞춰 붙여야 하며, 전국태양광발전소전기사업허가정보 표준데이터와 대조하는 용도가 대표적이다.
description_portal: 본 데이터는 전북특별자치도 익산시 내 설치된 태양광발전시설의 현황을 체계적으로 수집하여 제공한다. 친환경 에너지를 일반 가정에 활용한 태양광발전시설을 이용하여 부족한 에너지를 한전으로 보내지면서 에너지를 효율적으로 생산 하는 태양광발전 시설 현황 자료로, 발전소의 명칭, 설치위치, 설비용량, 허가일, 사업개시신고일 등 다양한 정보를 포함하고 있어 지역 내 재생에너지 현황 파악에 유용하다. 본 데이터는 지속적으로 갱신되며, 사용자 편의성 증대를 위하여 상세한 설명과 정확한 키워드를 부여하여 익산시의 태양광 발전시설 관련 현황을 신속하고 명확히 이해할 수 있도록 지원한다.
