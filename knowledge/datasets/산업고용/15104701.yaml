description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 최근 5년간 연도별 예산 현황을 집약한 공공 데이터입니다. 본 데이터는 이러한 예산 정보를 투명하게 공개하여, 에너지 R&D 정책 및 재정 운용의 효율성을 객관적으로 분석할 수 있도록 돕고자 합니다.제공되는 정보는 각 세부사업별로 최근 5년간 연도별로 편성된 총 예산 규모(예: 금액)를 포함합니다. 이를 통해 사용자들은 특정 에너지 기술 분야에 대한 정부의 예산 배분 추이를 파악하고, 에너지 R&D 정책의 우선순위 변화를 분석할 수 있습니다.'
