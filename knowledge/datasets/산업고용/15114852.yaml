summary_user: 충청북도 단양군 관내 일반화물 운송업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·사무실 주소·운영여부(운영중·휴업·폐업)·데이터 기준일자를 담는다(csv 약 2.3KB 규모). 단양군에서 영업 중인 화물 운송업체가 어디에 몇 곳 있고 그중 휴업·폐업한 곳은 어디인지 확인하려는 화주·사업자·지역 분석가가 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 업체명이나 사무실 주소를 맞춰 보는 방식으로만 연결하며, 주소를 좌표로 바꿔 지역 인허가(LOCALDATA) 업종 자료나 상가업소 정보와 겹쳐 볼 수 있다.
