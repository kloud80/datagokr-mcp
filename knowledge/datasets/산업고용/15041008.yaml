summary_user: 인천 계양구의 사업체 수와 종사자 수를 산업분류별로 집계한 표로, 구 전체 합계와 효성·계산·작전·계양 등 12개 동별 값을 열로 나란히 담는다(건별 사업체 목록이 아닌 집계, csv 약 40KB). 지역 경제·고용 분석가나 구 정책 담당자가 '계양구에서 어떤 업종이 어느 동에 사업체와 일자리가 몰려 있는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 산업분류 코드(코드)나 동 이름을 매핑해야 다른 통계와 이을 수 있다.
description_portal: 인천광역시 계양구 관내 사업체 현황 데이터는 지역 내 산업분류별 전체 사업체 수와 전체 종사자 수를 상세히 수록하고 있습니다. 또한 각 동별 사업체 수와 종사자 수 현황도 함께 제공하여 계양구의 산업 구조와 고용 현황을 종합적으로 파악할 수 있도록 구성되어 있습니다. 이 데이터는 지역 경제 및 고용 정책 수립에 중요한 기초자료로 활용됩니다. 특히, 세부 동별 통계는 맞춤형 지역발전 전략을 수립하는 데 매우 유용합니다. 데이터와 관련한 추가 문의는 인천광역시 계양구 기획예산실(032-450-5035)로 연락하시면 안내받을 수 있습니다.
