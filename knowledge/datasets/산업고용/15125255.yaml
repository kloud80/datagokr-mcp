summary_user: 한국남부발전(주)이 제공하는 전국 단위 전력수급현황을 지정한 날짜(연도-월-일) 기준으로 담으며, 공급능력·현재부하·공급예비력·공급예비율·운영예비율 같은 수급 지표가 들어 있다. 에너지 분석가나 사업자가 "특정 날의 공급예비율이 얼마였고 예비력이 빠듯했나"처럼 일별 전력수급 상태와 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜(ymd)를 맞추거나 같은 기관 데이터끼리만 이어 쓴다.
