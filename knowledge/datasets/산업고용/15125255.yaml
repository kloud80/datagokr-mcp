description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 실시간 발전량 및 전력수급현황 서비스_GW 입니다.해당 서비스를 통해 사용자는 원하는 기간(연도-월-일)을 지정하여 한국남부발전(주)의 실시간 발전량과 전력수급현황을 파악할 수 있습니다.해당 데이터를 활용하여 한국남부발전(주)의 일일별 발전량 추세를 분석할 수 있으며,연료 소비현황 등 다른 공공데이터와 결합하여 다양한 분석의 기본자료로 활용될 수 있습니다.
