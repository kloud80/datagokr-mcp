summary_user: 경상남도에 소재한 건설기계 대여업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 상호·등록상태·사업유형·등록종별(종합 대여업, 특정 기종 대여업 등)·주소를 담는다. 건설 현장 담당자나 사업자가 경남 특정 시군에서 영업 중인 건설기계 대여업체를 찾거나, 분석가가 지역별 대여업체 분포와 등록종별 구성을 파악하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어, 다른 데이터와는 주소에서 시군을 뽑아 맞추거나 상호 이름으로 대조해 이어 쓴다.
description_portal: '본 정보는 경상남도 내에 소재한 건설기계 대여업체에 대한 분기별 현황 데이터를 제공합니다. 이 데이터에는 각 대여업체의 업체명, 현재 등록상태, 사업의 등록종별 (예: 종합 건설기계 대여업, 특정 기종 대여업 등), 그리고 업체의 주소지 등 핵심적인 등록 정보가 포함되어 있습니다.이 현황 자료는 경상남도 지역의 건설 관련 산업 동향을 파악하고, 필요한 건설기계 대여 서비스를 찾는 데 유용한 참고 자료가 될 수 있습니다. 데이터의 정확성과 최신성을 유지하기 위해 매 분기별로 내용을 업데이트하고 있습니다. 단, 정보 제공 과정에서 미집계된 항목이나 개인정보 보호를 위한 조치로 인해 일부 항목이 공란으로 처리되었을 수 있음을 참고해 주시기 바랍니다. 이 점 양해 부탁드립니다.'
