summary_user: 경기도 광주시에 등록된 건설기계 관련 사업체를 한 업체당 한 행으로 담은 파일 데이터로, 상호·전화번호·주소·데이터기준일자를 제공하며 범위는 광주시 한 곳입니다(CSV 약 12.6KB). 광주시에서 건설기계 대여·정비·매매 업체를 찾는 사업자나 시민, 지역 건설기계 업체 분포를 보려는 분석가가 '광주시 안에 어떤 건설기계 업체가 어디에 있나'를 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호·주소를 직접 맞춰 잇거나, LOCALDATA 업종 인허가 원장 등 같은 기관 자료와 이름 기준으로 대조해 쓴다.
limits: 사업자번호·좌표·업종 구분 코드 같은 조인 키가 실측 컬럼에 없어 다른 데이터와 자동으로 연결되지 않고, 상호·주소 문자열로 맞춰야 한다. 범위는 경기도 광주시 한 곳뿐이어서 다른 시군과의 비교에는 따로 자료가 필요하다.
