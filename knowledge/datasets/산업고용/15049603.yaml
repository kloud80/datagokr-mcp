description_portal: 산업재해조사표는 「산업안전보건법」 제57조 제3항에 따라 산업재해의 발생 개요, 원인, 보고 시기, 재발방지 계획 등을 고용노동부에 보고하기 위해 작성하는 문서입니다. 이 조사표에는 재해자의 인적사항이 포함되며, 그중 하나가 재해자의 체류자격 정보입니다.체류자격 정보는 총 3개의 항목으로 구성되어 있습니다. 첫 번째 항목인 ‘연번’은 총 37개의 체류자격 코드에 순차적으로 부여된 일련번호입니다. 두 번째 항목인 ‘코드’는 고용노동부 내부 시스템에서 사용하는 고유 식별번호로, 행정 처리를 위한 내부용 코드입니다. 세 번째 항목인 ‘체류자격’은 외국인의 체류 목적에 따라 분류된 체류유형을 의미하며, 「출입국관리법 시행령」 별표 1에 근거하여 부여됩니다.출입국관리법 시행령 별표 1은 외국인의 체류 목적에 따라 체류자격을 분류하고 있으며, 산업재해조사표에는 해당 법령에서 정한 체류자격명과 코드가 함께 기재됩니다. 예를 들어, ‘외교(A-1)’, ‘공무(B-1)’, ‘문화예술(D-1)’ 등이 이에 해당합니다.해당 체류자격 정보는 산업재해조사표 내 ‘재해자 정보’란에 작성되며, 재해자의 법적 체류 상태를 확인하고 분류하는 데 활용됩니다. 체류자격명과 체류자격코드는 법령에 따라 부여되며, 산업재해 통계 작성과 행정 처리의 정확성을 높이는 데 기여합니다.
