description_portal: '행정사법 제10조 및 행정사법 시행령 제20조, 행정사법 시행규칙 제7조의 규정에 따라 부천시 관내에 행정사 업무신고를 한 행정사 사무소 등록 현황자료로 행정사 종류(일반, 외국어번역), 행정사 사무소 명, 사무소 소재지(도로명) 등의 정보입니다. 제공되는 정보는  2025년 5월 23일 현재 부천시청에 신고된 행정사 사무소 중  영업중인 행정사의 정보이며,  행정사 사무소 신규 신고,  사무소 휴업 또는 영업재개, 사무소 폐업 등 영업상태 변경신청에 따라 제공되는 정보는 달라질 수 있음을 알려드립니다. * 행정사의 업무 내용과 범위  1. 법 제2조제1항제1호의 사무: 행정기관에 제출하는 다음 각 목의 서류를 작성하는 일가. 진정ㆍ건의ㆍ질의ㆍ청원 및 이의신청에 관한 서류나. 출생ㆍ혼인ㆍ사망 등 가족관계의 발생 및 변동 사항에 관한 신고 등의 각종 서류2. 법 제2조제1항제2호의 사무: 개인(법인을 포함한다. 이하 이 호에서 같다) 간 또는 국가나 지방자치단체와 개인 간의 다음 각 목의 서류를 작성하는 일가. 각종 계약ㆍ협약ㆍ확약 및 청구 등 거래에 관한 서류나. 그 밖에 권리관계에 관한 각종 서류 또는 일정한 사실관계가 존재함을 증명하는 각종 서류3. 법 제2조제1항제3호의 사무: 행정기관에 제출하는 각종 서류를 번역하는 일4. 법 제2조제1항제4호의 사무: 다른 사람의 위임에 따라 행정사가 제1호부터 제3호까지의 규정에 따라 작성하거나 번역한 서류를 행정기관 등에 제출하는 일5. 법 제2조제1항제5호의 사무: 다른 사람의 위임을 받아 인가ㆍ허가ㆍ면허 및 승인의 신청ㆍ청구 등 행정기관에 일정한 행위를 요구하거나 신고하는 일을 대리하는 일6. 법 제2조제1항제6호의 사무: 행정 관계 법령 및 제도ㆍ절차 등 행정업무에 대하여 설명하거나 자료를 제공하는 일7. 법 제2조제1항제7호의 사무: 법령에 따라 위탁받은 사무의 사실을 조사하거나 확인하고 그 결과를 서면으로 작성하여 위탁한 사람에게 제출하는 일'
