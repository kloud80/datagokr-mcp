summary_user: 한국동서발전이 운영하는 국내 사업소별 발전설비를 설비 한 건씩 담은 목록으로, 발전소명·사용연료·설비구분·설비용량(MW)·위치·준공일자·주연료를 담는다(파일 약 3KB 규모의 소량 원장). 에너지 분석가나 연구자가 '동서발전의 석탄·LNG 등 연료별 설비용량은 얼마이고 언제 준공된 설비가 많은가'를 확인하는 데 쓴다. 발전소명(power_plant_id)을 키로 다른 발전소 원장이나 발전소 배출 측정 자료와 이어 쓰며, 위치는 명세상 행정코드가 아니어서 지역 통계와는 이름 기준으로 맞춰야 한다.
description_portal: 한국동서발전의 국내 사업소별 발전설비 현황 정보 데이터입니다. 이 데이터는 각 발전소의 명칭, 사용 연료 종류, 설비 구분, 설비용량(MW), 위치, 준공일자, 주연료 등의 항목으로 구성되어 있으며, 번호 순으로 정리되어 있습니다. 본 데이터는 발전소별 설비 규모와 운영 특성, 연료 다양성 및 준공 시점 등의 정보를 체계적으로 제공함으로써 발전 인프라의 구조적 분석이 가능합니다. 학계 및 연구기관에서는 설비별 에너지 전환 효율성 분석, 연료별 발전 비중 연구, 탄소중립 목표와의 부합성 평가, 지역별 발전설비 집중도 분석 등에 활용할 수 있습니다. 또한 에너지정책 수립과 전력 수급 안정성 연구, 발전소 투자 우선순위 설정 등 실증 기반 연구의 주요 자료로 활용 가치가 큽니다.
