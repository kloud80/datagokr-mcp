summary_user: 경기도 31개 시군에서 인허가된 제재업체(원목을 가공하는 목재 가공업체)를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·주소·좌표와 함께 목재생산구분·생산종류·취급 목재제품·인력 보유·연간생산량·자본금이 들어 있다. 목재산업 정책 담당자나 분석가가 '경기도 어느 시군에 영업 중인 제재업체가 몰려 있고, 생산 규모는 어느 정도인가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)·시군명·주소 같은 이름·코드 매핑이나 위경도 좌표로만 붙이며, 다른 LOCALDATA 업종 인허가 데이터와 같은 방식으로 나란히 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군에서 인허가된 제재업체들의 현황을 수록한 자료로, 벌채 또는 수입 원목을 가공하는 목재 가공업체들의 사업 정보와 생산 특성을 제공합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 소재지 정보(도로명주소, 좌표 등), 목재생산구분, 생산종류, 취급목재제품, 인력 보유 현황, 연간생산량, 자본금 등으로 구성되어 있습니다. 이 데이터는 산림자원 활용 현황 파악, 원자재 가공업의 지역별 분포 분석, 정책적 목재산업 육성 기반 마련, 그리고 지역산업 구조 분석 등에 활용될 수 있으며, 산업경제 분야에서 주요한 통계자원입니다. Open API를 통해 실시간 또는 주간 단위로 업데이트된 정보를 자동 수집하여 최신 인허가 현황을 분석할 수 있습니다.
