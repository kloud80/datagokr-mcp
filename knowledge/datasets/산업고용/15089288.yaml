summary_user: 경기주택도시공사에 업체가 직접 등록한 건축·토목·기계·전기 분야 신기술·제품을 한 건씩 담으며, 공종·적용분야·기술명·용도·업체명·사업자등록번호·인증현황(특허제품, 건설신기술 등)·인증 시작·종료일·등록일로 구성된다. 공공건설 발주 담당자나 설계자가 '특정 공종에 쓸 수 있는 인증 신기술·제품이 무엇이고 인증이 아직 유효한가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 사업자등록번호(bizregno)나 업체명으로 다른 기업·인증 데이터와 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기주택도시공사에서 제공한 건축, 토목, 기계, 전기 분야의 신기술 및 제품 정보를 담고 있으며, 각 업체에서 직접 등록한 정보입니다. 항목은 공종, 적용분야, 기술명, 용도, 업체명, 사업자등록번호, 인증현황, 인증 시작 및 종료일, 등록일로 구성되어 있습니다. 기술명은 해당 신기술이나 제품의 명칭을 나타내며, 용도 항목에는 건설현장에서의 구체적인 활용 목적이 서술되어 있습니다. 인증현황은 특허제품, 건설신기술 등 해당 기술의 인증 여부와 유형을 명시하고 있으며, 인증 기간도 포함됩니다. 이 데이터는 신기술 도입 검토, 공법 개선, 기술검증, 납품 기준 마련, 공공건설 기획 등에 참고자료로 활용될 수 있습니다. 상세한 정보는 경기주택도시공사 홈페이지(https://www.gh.or.kr/gh/new-technologyproduct-promotion-room-list.do)에서 확인가능합니다
