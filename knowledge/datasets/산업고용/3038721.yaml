summary_user: 구리시 관내에서 담배소매인으로 지정받은 편의점·슈퍼마켓 등 담배 판매 업소를 한 행에 한 곳씩 담은 건별 목록으로, 업소명·도로명 주소·지정일자를 담는다(CSV 약 32KB). 예비 창업자나 상권 분석가가 '이 동네에 담배를 파는 가게가 어디에 얼마나 있는가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호·좌표는 없어서, 도로명주소를 지오코딩하거나 업소명으로 맞춰 소상공인 상가업소 정보나 LOCALDATA 담배소매 인허가 자료와 이어 쓴다.
description_portal: 본 데이터 자료는 관내에서 적법하게 담배 소매인 지정을 받아 담배를 판매하고 있는 편의점, 동네 슈퍼마켓 등 모든 담배 판매 업소의 상세 현황을 담고 있습니다. 각 판매처의 상호명(업소명)을 비롯하여 담배소매인으로 지정된 업소의 도로명 주소, 그리고 담배 소매인으로 지정된 일자 등의 핵심 정보를 종합적으로 제공합니다.
