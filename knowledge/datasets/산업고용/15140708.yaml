description_portal: 서울특별시 광진구 석유판매업 인허가 정보는 관내에서 석유제품을 판매하는 업소에 대한 인허가 현황을 제공하는 공공데이터입니다. 이 데이터는 광진구 지역의 주유소, 용제판매소 등에서 휘발유, 경유, 등유, 액화석유가스(LPG)와 같은 석유제품을 일반 소비자 및 기업에 공급하는 업소의 상세 정보를 포함합니다. 각 업소에 대한 인허가일자, 업소명, 주소 등 기본적인 식별정보와 함께 중부원점TM(EPSG:2097) 기준의 좌표가 제공되며, 위치 기반 활용을 위한 공간정보 분석에 유용합니다. 해당 자료는 광진구 내 에너지 유통 및 공급망 파악, 연료 수급 관리, 유류안전관리 등 행정과 민간 활용 목적에 맞게 사용될 수 있습니다. 본 데이터는 최신 기준으로부터 3일 전 정보가 제공됩니다.
