description_portal: 한국가스공사의 도시가스 용도별 중기 수요전망(5개년) 데이터 입니다.용도별 중기 수요예측 및 공급계획 수립, 에너지 정책 수립 지원, 인프라 투자계획 수립을 목적으로 수집되었습니다. 데이터 구성항목은 가정용, 일반용, 산업용, 열병합, 수송용, 연료전지용의 2022년부터 2026년까지 5개년 수요전망(천㎥ 단위)으로 이루어져 있어 용도별 수요 변화를 종합적으로 예측할 수 있습니다. 본 데이터를 활용하면 용도별 중기 수요 증가율 분석, 용도간 수요 비중 변화 파악, 고성장 용도 식별, 수요전망 대비 공급능력 평가, 용도별 성장 패턴 분석이 가능합니다. 또한 용도별 공급계획 수립, 설비투자 우선순위 결정, 요금정책 수립 기초자료, 에너지 전환 정책 분석, 신규 수요처 발굴에 활용됩니다. 천연가스 중기 수급계획 수립과 에너지 정책 의사결정에 기초자료로 활용됩니다.
