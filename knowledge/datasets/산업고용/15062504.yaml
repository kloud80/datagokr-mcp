summary_user: 경상남도 내 노동조합을 조합 한 곳당 한 행으로 담은 현황 데이터로, 조합명·상급단체·조합 형태·대표자·연락처·조합원 수·도로명주소·위경도 좌표를 포함한다. 노동자나 연구자가 '경남 ○○시에 있는 노동조합은 어디이고 조합원은 몇 명이며 어느 상급단체에 속하는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 조합명·주소 같은 이름 매칭이나 좌표(latitude·longitude) 기반 위치 결합으로만 잇고, 전국노동조합표준데이터와는 조합 단위로 대조해 쓴다.
