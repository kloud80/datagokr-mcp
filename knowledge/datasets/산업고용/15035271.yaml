description_portal: 전라남도 함평군은 축산분뇨의 자원화 및 친환경 농업 실현을 위해 관내 가축분 비료생산업체에 대한 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군에 등록된 3개소의 가축분 기반 비료생산업체에 대한 현황을 포함하고 있으며, 업체명, 대표자 성명, 연락처, 생산 중인 비료의 종류(퇴비, 액비 등) 항목으로 구성되어 있습니다. 해당 데이터는 축산자원 순환 이용 현황 파악, 비료 유통망 분석, 지역 내 친환경 농업 기반 마련을 위한 행정 자료로 활용될 수 있으며, 비료 수요자와 생산업체 간의 연계 촉진, 지속가능한 농업 시스템 구축, 환경오염 예방 등 다양한 분야에서 실질적인 공공 활용 가치를 지닌 정보입니다.
