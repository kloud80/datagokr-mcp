summary_user: 워크넷(고용24) 강소기업으로 선정된 중소기업을 기업 한 곳당 한 행으로 담으며, 선정연도·강소기업 브랜드(일자리 친화·글로벌역량·기술력우수·지역선도·재무건전성·사회적가치 등)·기업명·사업자등록번호·대표자·업종·지역·주소·주요 생산품목·상시 근로자 수가 들어 있고 범위는 전국이다. 구직자가 '우리 지역에서 상시 근로자 규모가 어느 정도인 기술력우수 강소기업이 어디인가'를 찾거나, 분석가가 지역·업종별 강소기업 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 사업자등록번호(busiNo)·업종코드·지역코드 같은 이름·코드 매핑이나 같은 기관(한국고용정보원) 코드로만 이어 쓴다.
description_portal: 이 API는 기업 소재 지역 등을 조건으로 하여 강소기업 정보를 조회할 수 있도록 지원합니다.  강소기업 API를 이용하여 '규모는 작지만 강한 경쟁력을 가진 우수기업(고용유지율과 신용평가 등급이 높고 사업장에 산재 사고율이 낮은 규모는 작지만 강한 경쟁력을 가진 우수한 중소기업)' 목록을 활용 하실 수 있습니다.  강소기업의 유형은 6개로 일자리 친화, 글로벌역량, 기술력우수, 지역선도기업, 재무건전성, 사회적가치로 나뉩니다.기업소재지역 등을 파라미터로 받아,  선정연도 또는 등록연도, 강소기업 브랜드명 (※ 공통코드 API에서 확인한 코드값을 사용), 기업명, 사업자등록번호, 대표자, 업종코드(상위), 업종명(상위), 업종코드(중위), 업종명(중위), 사업장 연락처, 지역코드, 지역명, 주소, 주요 생산품목, 회사 홈페이지, 상시 근로자 수, 강소기업 브랜드명 코드와 같은 정보를 결과로 제공합니다.
