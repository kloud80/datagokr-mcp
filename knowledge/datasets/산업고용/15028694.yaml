summary_user: 군산시에 신고된 행정사 사무소를 한 행에 한 곳씩 담은 명부로, 사무소 명칭·주소·전화번호·신고일자를 담는다(csv 약 3.7KB 규모의 소량 파일). 군산에서 인허가·민원 서류 대행을 맡길 행정사 사무소가 어디에 있고 연락처가 무엇인지 찾는 시민이나, 시내 행정사 분포를 보려는 분석가가 쓴다. 전역 조인 키(사업자번호·코드)가 없어 다른 데이터와는 사무소 주소를 지오코딩하거나 이름으로 맞춰 이어 써야 하며, 지방행정 인허가(LOCALDATA) 행정사 업종 원장과 대조하는 용도로 쓴다.
description_portal: 이 데이터는 전북특별자치도 군산시에 등록된 행정사 사무소의 현황을 정리한 자료로, 각 행정사 사무소의 명칭(행정사 사무소명), 위치를 나타내는 주소(사무소 주소), 민원인들이 문의하거나 방문 예약 시 사용할 수 있는 전화번호(사무소 전화번호), 그리고 해당 사무소가 공식적으로 군산시에 신고된 날짜(사무소 신고일자) 등의 정보를 포함하고 있습니다. 본 데이터는 군산시 지역 내 행정서비스 제공자 현황을 파악하고자 하는 연구자, 시민, 행정기관, 또는 법률 민원 해결을 원하는 일반인에게 유용하게 활용될 수 있습니다. 특히, 행정사 자격자 분포나 민원 서비스 접근성, 지역별 법률 서비스 분포 현황을 분석하는 데 기초 자료로 활용 가능합니다.
