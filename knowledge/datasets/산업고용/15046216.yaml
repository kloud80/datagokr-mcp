summary_user: 한국장애인고용공단이 실시한 장애청소년진로성숙도검사의 평가결과를 검사 1건 단위로 담은 파일로, 검사일자·장애유형과 진로태도·진로능력·진로행동 영역별 원점수·T점수·백분위, 총점·환산점수·단계·작업기능수준, 문항별 응답(1~26)을 포함하며 전국 범위의 비공간 자료다. 진로교육·직업재활 분석가가 '장애유형별로 발달장애학생의 진로성숙 수준과 영역별 점수 분포가 어떻게 다른가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 같은 이름 매핑이나 같은 기관 자료로만 느슨하게 이어 쓴다.
description_portal: '한국장애인고용공단에서 실시하는 장애인 직업능력평가 도구 중 장애청소년진로성숙도검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 총점, 환산점수 등에 대한 정보를 제공합니다.* 장애청소년 진로성숙도 검사: 기존 장애청소년 진로성숙도검사(2014)의 측정 영역 및 문항을 보완하여 개정한 검사로 고등학교, 전공과, 대학교에 재학 중인 발달장애학생이 스스로 진로를 탐색하는 데 필요한 태도, 능력, 행동을 평가하여 진로성숙 수준을 확인하는 검사입니다. 해당 검사는 장애학생의 직업 준비 정도를 평가하는 기초자료로서 향후 진로교육 및 관련 서비스의 제공 방향을 결정하는 데 활용할 수 있습니다.'
