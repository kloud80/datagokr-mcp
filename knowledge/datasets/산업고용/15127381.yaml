description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 24년 6월 까지의 시간별 지역별 육지 태양광발전 제어횟수 데이터입니다.(육지지역 태양광의 연도별 시간별 지역별 제어횟수가 포함된 정보입니다.)※날짜가 비어있는 부분은 데이터 누락이 아닌 제어가 발생하지 않은 것입니다.
