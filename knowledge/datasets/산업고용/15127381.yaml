summary_user: 육지 지역 태양광 발전의 출력제어가 언제, 어느 지역에서 몇 번 있었는지를 기준일·제어지역·연도별 시행회차 단위로 1시~24시 시간대별 횟수로 담은 집계 파일이며, 2024년 6월까지의 자료가 2.3KB 남짓한 CSV 한 건에 들어 있다. 태양광 사업자나 에너지 분석가가 '내 발전소가 있는 지역에서 어느 계절·어느 시간대에 출력제어가 몰렸는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과는 제어지역 이름을 손으로 맞춰 이어 써야 한다.
limits: 날짜가 비어 있는 행은 데이터 누락이 아니라 그날 제어가 없었다는 뜻이므로 0으로 해석해야 한다. 지역 코드나 발전소 식별자가 없어 개별 발전소 단위의 제어 내역은 알 수 없고, 다른 데이터와는 지역명 매핑으로만 연결된다. 포털 설명상 2024년 6월까지의 자료만 담겨 있다.
