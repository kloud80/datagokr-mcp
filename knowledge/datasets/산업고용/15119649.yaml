description_portal: 해당 데이터는 한국남동발전에서 제공하는 일자별 발전소 주변 농도 현황입니다. 한국남동발전의 발전소별 일자별로 발전소 주변 농도 현황에 관한 데이터를 제공하고 있습니다. 발전소의 각 발전기(호기)별로 아황산가스(SO₂), 이산화질소(NO₂), 미세먼지(PM10), 초미세먼지(PM2.5) 등 물질에 대한 평균농도값 데이터를 포함하고 있습니다. 해당 데이터는 발전소의 환경 영향을 과학적으로 분석하고, 지자체 및 연구 기관이 지역 주민의 건강 영향을 연구하는 데 필수적인 기초자료로 활용될 수 있습니다.
