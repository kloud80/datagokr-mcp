summary_user: 한국남동발전의 발전소 사업소·호기별로 아황산가스·이산화질소·미세먼지·초미세먼지 등 주변 대기오염물질의 평균 농도값을 측정 항목(itemCode)별로 담은 측정 데이터다. 지자체·연구기관·지역 주민이 특정 발전소 주변의 대기오염 농도가 어느 수준이고 시기별로 어떻게 달라졌는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 사업소코드(orgNo)를 발전소 이름과 매핑하거나 같은 기관의 다른 발전소 데이터와 기관 코드로 이어 쓰고, 환경·기상 측정 데이터와는 이름 매핑으로 교차 분석한다.
limits: 다른 기관 데이터와 바로 붙일 공통 조인 키가 없어 사업소코드를 발전소명·위치로 직접 매핑해야 한다. 범위는 전국이지만 비공간 데이터라 좌표·행정구역 단위 분석에는 별도 위치 정보가 필요하다. 개발계정은 하루 1,000회 호출로 제한된다.
