description_portal: 한국서부발전 발전설비운영의 진동제어 태그데이터에 대한 합성데이터 입니다.이 데이터는 한국서부발전의 주요 발전설비에서 측정된 진동제어 관련 태그데이터를 기반으로 생성된 합성 시계열 데이터입니다. 회전기기의 진동값의 운전데이터를 포함하며, 설비 이상탐지 및 예지정비(AI 기반 Predictive Maintenance) 연구에 활용할 수 있습니다. 진동값의 변동 패턴을 분석하면 설비의 초기 결함이나 불균형 상태를 조기에 탐지할 수 있으며, 설비운영 효율성과 안정성을 높이는 데 기여합니다. 데이터는 태그 단위로 정규화되어 있으며, 시간 동기화 및 결측값 처리를 거쳐 AI 학습 및 시각화에 적합한 형태로 구성되었습니다.
