summary_user: 희망이음 프로젝트에 참여한 기업을 한 행에 한 곳씩 담은 파일로, 지역·기업명·대표자·설립년도·기업규모·종업원수·사업장 주소·홈페이지와 기업소개·주력사업·비전 같은 서술형 소개를 담으며 범위는 전국이다. 지역 청년 구직자나 취업 상담기관이 '우리 지역에서 희망이음에 참여한 중소기업 중 종업원 규모가 어느 정도이고 무슨 사업을 하는 곳이 있나'를 찾는 데 쓴다. 전역 조인 키(사업자등록번호·법인번호 등)가 없어 다른 기업 데이터와는 기업명이나 사업장 주소를 맞춰 이어 써야 한다.
description_portal: 희망이음 프로젝트는 지역의 우수 기업과 지역의 우수 인재를 연결하는 소통 창구 프로그램으로, 청년 인재들에게는 미래의 직장 탐색 기회를 제공하고, 기업들에게는 우수한 인재를 발굴할 수 있는 기회를 마련합니다. 이 프로젝트에 참여한 기업 정보는 취업 및 인재 개발을 위한 중요한 자료로 활용될 수 있으며, 지역 경제 활성화와 청년 고용 증대에 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 번호(숫자형), 지역(문자형), 기업명(문자형), 대표자(문자형), 설립년도(숫자형), 기업규모(문자형), 대표번호(문자형), 종업원수기준년도(숫자형), 종업원수(숫자형), 홈페이지(문자형), 사업장 주소(문자형), 기업소개(문자형), 주력사업(문자형), 사업방향및비전소개(문자형), 사업영역및제품상세설명(문자형)입니다. 이 데이터를 활용하여 기업 탐방, 취업 상담 서비스, 그리고 일자리 연계 프로그램 등이 개발될 수 있을 것입니다.
