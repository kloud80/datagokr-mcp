summary_user: 제주특별자치도에 소재한 사료업체를 업체 한 곳당 한 행으로 담은 목록으로, 사료종류(단미·보조·배합·수입 등), 업체명, 주소, 데이터기준일자를 담는다. 축산농가나 사료 관련 사업자가 '제주에서 배합사료나 보조사료를 다루는 업체가 어디에 있나'를 찾을 때, 분석가가 도내 사료업체의 종류별·지역별 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명이나 주소를 맞춰 붙여야 하고, 지방행정 인허가(LOCALDATA) 업종 원장이나 소상공인 상가업소 정보와 이런 방식으로 대조한다.
description_portal: '제주특별자치도에 소재하고 있는 사료업체와 관련한 데이터를 제공합니다.항목: 사료종류(단미 / 보조 / 배합 / 수입 등), 업체명, 주소 등*「사료관리법」- 사료: 「축산법」에 따른 가축이나 그 밖에 농림축산식품부장관이 정하여 고시하는 동물ㆍ어류 등에 영양이 되거나 그 건강유지 또는 성장에 필요한 것- 단미사료: 식물성ㆍ동물성 또는 광물성 물질로서 사료로 직접 사용되거나 배합사료의 원료로 사용되는 것- 배합사료: 단미사료ㆍ보조사료 등을 적정한 비율로 배합 또는 가공한 것- 보조사료: 사료의 품질저하 방지 또는 사료의 효용을 높이기 위하여 사료에 첨가하는 것자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1537'
