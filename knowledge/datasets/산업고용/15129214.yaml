description_portal: '학생연구자*에  대한 산재보험 특례 관련, 산재보험료 산정의 기준이 되는 월 보수액 및  평균임금 데이터입니다. 학생연구자의 산재보험료는 고용노동부장관이 고시한 월 보수액에 대학·연구기관 등의 산재보험료율을 곱하여 매월 산정·부과합니다. * 학생연구자: 「연구실 안전 환경 조성에 관한 법률」에 따른 연구활동종사자 중 대학·연구기관 등이 수행하는 연구개발과제에 참여하는 학생연구자 - 과학기술분야의 연구개발과제에 참여(신규 또는 후속 연구개발과제 참여 활동 포함)하는 재학생뿐만 아니라 휴학생, 수료생 및 상위 학위과정 진학이 확정된 졸업생을 포함'
