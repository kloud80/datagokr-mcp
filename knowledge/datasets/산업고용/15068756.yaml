description_portal: 매년 공표되는 산업재해장례비 보상 기준해당 년의 1월 1일부터 12월 31일까지 효력을 가진 장례비 최고금액과 장례비 최저금액(고용노동부고시) 기준입니다.산업재해보상보험법 제71조제2항 및 같은 법 시행령 제66조에 따라 장례비 최고 금액 및 최저 금액을 고시합니다.산업재해보상보험법 제71조 제1항에 따라 장례비는 근로자가 업무상의 사유로 사망한 경우에 지급하되, 평균임금의 120일분에 상당하는 금액을 그 장례를 지낸 유족에게 지급합니다. 다만, 장례를 지낼 유족이 없거나 그 밖에 부득이한 사유로 유족이 아닌 사람이 장례를 지낸 경우에는 평균임금의 120일분에 상당하는 금액의 범위에서 실제 드는 비용을 그 장례를 지낸 사람에게 지급합니다.제1항에 따른 장례비가 대통령령으로 정하는 바에 따라 고용노동부장관이 고시하는 최고 금액을 초과하거나 최저 금액에 미달하면 그 최고 금액 또는 최저 금액을 각각 장례비로 합니다.
