summary_user: 충주시에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 민원구분·업소명·지번 및 도로명 주소·지정일자를 포함한다. 시청 담당자나 창업 예정자가 "특정 동네나 학교 주변에 담배소매점이 몇 곳 있고 언제 지정됐나"를 확인할 때 쓴다. 전역 조인 키나 코드가 없으므로 다른 데이터와는 업소명과 주소를 맞춰 붙여 쓴다. 예를 들어 소상공인 상가업소 정보나 다른 지자체의 LOCALDATA 인허가 목록과 연결할 수 있다.
description_portal: 본 데이터는 충청북도 충주시의 담배소매인 지정 현황을 제공하는 자료로, 민원구분, 업소명, 업소 지번주소, 업소 도로명주소, 지정일자, 데이터 기준일자 등의 항목으로 구성되어 있음. 담배소매업은 일정 요건을 충족한 업소에 한해 지정·운영되며, 해당 데이터는 지역 내 담배소매점의 분포와 지정 현황을 체계적으로 파악할 수 있도록 함. 이를 통해 담배소매점 관리, 신규·폐업 현황 분석, 지역별 유통망 파악, 청소년 보호구역 내 판매업소 점검 등 행정적 활용이 가능함. 또한 장기적 추세 분석을 통해 담배소매업 운영 변화와 지역 상권 특성을 진단하는 기초자료로도 활용될 수 있음.
