description_portal: 한국동서발전에서 운영 중인 각 발전소의 연도 및 월별 대기오염물질 배출량 정보는 발전소별 환경관리 수준을 정량적으로 파악할 수 있는 기초 데이터입니다.해당 데이터는 먼지(TSP), 황산화물(SOx), 질소산화물(NOx)의 항목으로 구성되어 있으며, 연도 및 월 단위로 오염물질 배출량을 기록하여 시기별 추이와 배출 패턴을 확인할 수 있습니다.이 자료는 발전소별 배출 특성과 오염물질 저감 설비의 효과, 계절별·지역별 대기환경 영향을 평가하는 데 유용합니다.학계 및 연구기관에서는 본 데이터를 활용해 △발전소 유형별 대기오염물질 배출 특성 분석 △환경정책 효과 검증 △기후 및 대기 모델링을 위한 배출 계수 산정 △국가 온실가스 및 대기오염 저감 목표 달성을 위한 기초 통계 △전력 생산과 환경영향 간 상관관계 연구 등에 활용할 수 있습니다.또한 환경부, 지자체, 국제기구의 환경보고서 작성 및 규제 수립을 위한 참고자료로도 활용될 수 있으며, 국내외 에너지산업의 친환경 전환 흐름 속에서 환경 영향을 객관적으로 비교하는 데도 의미 있는 지표가 됩니다.
