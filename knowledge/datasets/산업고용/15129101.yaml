description_portal: 비즈니스연속성경영시스템(BCMS, Business Continuity Management System)은 조직에 대한 잠재적 위협과 그 위협이 실제로 발생할 경우 야기될 수 있는 비즈니스 운영 위협에 대한 영향을 파악하고, 비즈니스 운영이 중단되는 상황에 대한 예방, 발생가능성 감소, 대비 등 효과적인 대응능력을 갖고 조직 회복력을 구축하는 총체적 관리 프로세스입니다. BCMS는 국제표준화 기구 규정 경영시스템인 ISO22301을 기반으로 하며, 개방데이터는 한국수력원자력의 사업소별 비즈니스연속성경영시스템 인증현황 정보를 제공합니다.
