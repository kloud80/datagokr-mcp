description_portal: '고용노동부 소속기관인 산업재해보상보험재심사위원회 홈페이지 내 FAQ(자주 묻는 질문) 관련 데이터입니다.* 산업재해보상보험재심사위원회: 재심사청구를 심리재결하기 위해 고용노동부에 소속되어 운영되며, 심사결정에 불복이 있는 경우 이를 구제하기 위한 기관, 산재보험급여와 관련한 근로복지공단의 심사결정에 불복하여 제기되는 재심사청구에 대하여 심리, 재결하는 특별행정심판기관입니다. 산재재심사위원회의 재결은 산업재해보상보험법 제109조의 규정에 따라 해당 사건에 있어 원처분기관인 근로복지공단을 기속하는 행정심판의 효력을 가집니다.'
