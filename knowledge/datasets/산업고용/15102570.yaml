summary_user: "한국가스기술공사 본사에 설치된 전기차 충전기를 충전기(호기) 단위로 나열한 소규모 원천 목록(CSV 235바이트)으로, 급속·완속 구분, 충전기 용량, 무료충전 여부, 개방일자, 차데모·AC3상·DC콤보 커넥터 지원 여부를 담는다. 공사 본사를 방문하는 전기차 이용자가 '내 차 충전 방식(예: DC콤보)으로 급속충전이 되는지, 무료인지'를 확인하는 데 쓴다. 실측 컬럼에 충전소 ID·좌표 같은 전역 조인 키가 없어, 전국 충전소 실시간 정보 등 다른 데이터와는 기관명·충전기 종류 이름을 맞춰 붙여 쓰는 방식으로만 연결한다."
description_portal: 'CSV 파일에는  다음과 같은 네 가지 주요 항목으로 구성되어 있습니다:구분: 충전기 종류 (급속충전기, 완속충전기)호기: 충전기의 번호충전기용량: 급속충전은 100kwh, 완속은 7kwh개방일자: 충전기가 건설되어 공공에 개방된 날짜충전기(DC차데모) : 차데모형식의 충전기 사용유무. 차데모는 일본이나 초창기 전기차에서 많이 사용한 충전기 형식으로, 현재는 많이 사용하지 않음.충전기(AC3상) : AC3상 형식의 충전기 사용유무. 르노에서 개발한 충전 방식이며, 급속충전과 완속충전을 위해서 각각 다른 어뎁터를 사용할 필요가 없다. 공사에서는 완속충전기에 이같은 충전기를 사용하고 있다. 특히 테슬라가 AC3상 형식을 사용한다.충전기(DC콤보) ; DC형식의 충전기 사용유무, 가장 높은 점유율을 차지하는 충전기로, 공사 급속충전기에 이를 사용하고 있다.'
