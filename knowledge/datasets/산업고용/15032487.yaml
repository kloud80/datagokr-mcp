summary_user: 성남시에 소재한 벤처기업을 업체 한 곳당 한 행으로 담은 확인서 단위 목록으로, 업체명·대표자(가명)·벤처확인유형·업종·주생산품·유효기간·확인기관을 포함한다. 성남시 벤처기업이 어떤 업종에 몰려 있는지, 특정 업체의 벤처 확인이 언제까지 유효한지 확인하려는 지역산업 분석가나 투자·협력처를 찾는 사업자가 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 업체명이나 업종명을 맞춰 이어야 한다.
description_portal: 시군명, 업체명, 대표자(가명), 확인유형, 업종분루, 업종명, 주생산품, 유효시작일, 유효만료일, 확인기관 항목으로 구성되어 있습니다.※ "벤처확인종합관리시스템" 내 공시된 성남시 벤처기업 현황 자료에서 성남시 자료만을 추출한 데이터입니다.벤처기업현황 데이터는 국내 벤처기업의 업종, 연구개발 활동 등 다양한 지표를 종합적으로 수록한 통계 자료입니다. 이 데이터는 중소벤처기업부에서 수집하며, 주로 연도별 또는 분기별로 갱신됩니다. 주요 항목으로는 벤처기업 인증기업 수, 지역별·업종별 분포 등이 있으며, 정책 수립 및 연구, 민간 투자 분석, 지역산업 전략 수립의 기초자료로 활용됩니다.
