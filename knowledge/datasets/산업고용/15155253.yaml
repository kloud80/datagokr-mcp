summary_user: 전국 지자체가 관리하는 석유판매업(주유소·용제판매소 등) 인허가 정보를 사업장 건별로 담은 원천 데이터로, 전체 29,630건이며 인허가일자·영업상태·휴폐업일자·주소·좌표를 포함한다. 분석가나 사업자가 특정 지역에 영업 중인 석유판매 사업장이 어디에 있고 언제 인허가를 받았거나 폐업했는지 확인하는 질문에 쓴다. 지번주소·도로명주소(address) 키로 다른 주소 기반 데이터와 잇고, 관리번호(MNG_NO)는 pnu 키로 실측되었으며, 개방자치단체코드는 다른 데이터에서 받아 넘겨야 한다.
description_portal: '자원환경_석유판매업 데이터는 주유소, 용제판매소 등에서 원유, 휘발유, 등유 등 석유제품을 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 석유판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 석유산업과 / 044-203-5226 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
