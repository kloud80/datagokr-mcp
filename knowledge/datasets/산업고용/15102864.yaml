description_portal: 한국가스공사의 도시가스 중기 수요전망(5개년) 기준 전국 보급률 데이터 입니다. 보급률은 당해 가정용 수요가수를 가정용 공급 세대수로 나눈 값으로, 전국 단위의 도시가스 보급 수준과 시장 성숙도를 나타내는 핵심 지표입니다. 본 데이터는 도시가스 보급 현황 분석 및 중기 전망을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연도별 수요가수, 세대수, 보급률이 포함되어 있습니다. 본 데이터를 활용하면 전국 도시가스 보급 추세 분석 및 성장률 파악, 보급률 목표 달성도 평가, 미보급 지역 파악 및 확대 전략 수립, 중장기 사업 계획 및 투자 계획 수립에 기초자료로 활용할 수 있어 도시가스 보급 정책 수립과 에너지 접근성 향상에 기여할 것으로 기대됩니다.
