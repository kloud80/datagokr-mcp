description_portal: ■ 플랜트 산업 개념  - 플랜트란 발전.담수, 정유, 석유화학, 원유 가스처리, 해양설비, 환경설비 시설 등과 같은 산업 기반시설 및 산업기계, 공작 기계, 전기 통신기계 따위의 종합체로서의 생산시설이나 공장을 말함  - 해외 플랜트 수주액은 해외발주처로부터 국내기업이 수주하는 금액 및 해외플랜트 프로젝트에 플랜트 기자재를 수출하는 실적을 포함한 금액임  - 국내기업이 해외플랜트를 수주하였다 할지라도 외국 현지인 인건비, 외국의 플랜트 기자재 사용, 외국의 용역 및 엔지니어링 사업, 외국 수주업체에 국내 기자재 납품 등으로 해외플랜트 수주가 곧 수출 실적은 아님■ 플랜트 수주의 경제적 효과   - 플랜트 수주는 상세 설계(E), 구매(P), 시공(C) 등이 복합된 산업으로 산업 연관 효과가 높고 산업 구조의 고도화에 기여■ 데이터 설명  - 수주액은 전체적으로 연도별 총액과 당해연도 월까지의 실적을 표시하였으며, 주요 지역별로도 분류하여 트랜드를 파악할 수 있도록 함
