description_portal: 한국가스공사의 발전용 천연가스 수요 월별 기온 민감도 데이터 입니다. 기온변화에 따른 발전용 천연가스 수요 변동 분석 및 수요예측 모델 개발, 전력수급 분석 지원, 발전연료 계획 수립을 목적으로 수집되었습니다. 데이터 구성항목은 1월부터 12월까지 월별 기온 민감도(% 단위)로 이루어져 있으며, 평년기온(1991~2020년, 서울 기준) 대비 기온이 변동됨에 따라 발전용 천연가스 수요가 반응하는 정도를 나타냅니다. 본 데이터를 활용하면 월별 기온 민감도 패턴 분석, 냉방/난방 시즌별 수요 변동성 파악, 이상기온시 발전수요 영향 예측, 전력피크와 기온의 상관관계 분석, 도시가스 대비 민감도 비교가 가능합니다. 또한 발전용 수요예측 모델의 기온변수 보정, 전력피크 예측, 발전연료 수급계획 수립에 활용됩니다.
