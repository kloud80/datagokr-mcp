summary_user: 전남광주통합특별시 신안군에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 원장으로, 지정번호·업소명·지번/도로명 주소·지정일자·법인 여부·사업자번호·장애인·유공자 여부를 담는다. 신안군에서 담배를 팔 수 있는 가게가 어디에 있고 언제 지정됐는지, 우선지정 대상 업소가 얼마나 되는지를 확인하려는 주민·예비 창업자·행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업자번호나 주소·업소명 매칭으로 이어야 하며, 지방행정 인허가(LOCALDATA) 담배소매 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식으로 쓴다.
description_portal: 담배소매인지정현황은 담배소매인으로 지정된 업소의 정보를 수록한 데이터로, 연번, 지정번호, 관리번호,소매인구분, 업소명, 업소지번주소, 업소도로명주소, 업소주소우편번호, 업소전화번호, 장애인유무, 유공자유무, 지정일자, 법인구분, 사업자번호, 법인번호, 영업구분, 비고 등으로 구성되어 있습니다. 본 데이터는 담배를 판매할 수 있도록 행정기관의 지정 승인을 받은 업소에 대한 정보를 담고 있으며, 지정일자와 법인·개인 여부, 사업자 정보 등을 통해 영업 형태와 운영 주체를 파악할 수 있습니다. 또한, 장애인 또는 유공자 여부 등 우선지정 대상 여부를 확인할 수 있어 공정한 유통관리와 복지정책 집행에 기초자료로 활용됩니다. 주소 정보와 전화번호는 민원 대응 및 행정 점검에 활용되며, 민원구분을 통해 신규 지정, 폐업, 이전 등 변동 이력을 관리할 수 있습니다. 데이터는 기준일자에 따라 정기적으로 갱신되어 최신성을 유지합니다.
