description_portal: 이 데이터는 제주국제자유도시개발센터 면세점 구매 고객 현황을 기반으로 인공지능 생성모델을 적용해 산출된 합성데이터입니다. 국적, 성별, 연령대, 구매상품, 구매금액을 포함하여 실제 고객 데이터의 구조와 통계적 특성을 반영하면서도 개인식별정보를 제거하여 안전성을 확보했습니다. 합성데이터는 개인 단위 추적은 불가능하지만 관광객 소비 패턴과 집단별 구매 성향을 정밀하게 분석할 수 있는 장점을 지니고 있습니다. 이를 통해 면세점 고객층의 특성에 따른 맞춤형 마케팅 전략 수립, 관광산업 활성화를 위한 정책 연구, 시장 수요 기반 상품 기획 등 다양한 분석 및 의사결정 과정에 활용할 수 있습니다.
