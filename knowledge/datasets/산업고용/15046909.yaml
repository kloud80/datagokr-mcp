description_portal: '○ 통계개요* 통계명 : 전력사용량(계약종별)* 통계종류 : 한국전력공사의 서울시 용도별 전력사용량 현황을 제공하는 일반통계* 근거법령 :「전기사업법」제41조에 전력시장에 관한 정보를 공개* 작성목적 : 전력사용량 현황을 파악하여, 전력시장 운영을 효율적으로 관리하고전력관련 정책 수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 한국전력공사* 공표주기 : 정기(매월)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 및 자치구의 계약종별 전력사용량○ 용어설명* 계약종별 : 전기사용계약단위의 경제활동에 따라 전기요금 및 공급조건을 달리하기위하여 분류한 기준* 전기공급약관의 기준에 따라 주택용전력, 일반용전력, 교육용전력, 산업용전력,농사용전력, 가로등전력, 심야전력(주택용에서 분리게시, 12.10.09)으로 분류'
