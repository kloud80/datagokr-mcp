summary_user: 한국서부발전이 신고·관리하는 국내외 산업재산권을 건별로 담은 파일(csv, 약 62KB)로, 발명 명칭·발명자·발명의 종류·진행 상태와 출원·등록 번호, 일자, 출원·등록 국가를 포함한다. 발전 분야 기술 동향을 보는 분석가나 기술 협력을 검토하는 기업이 '서부발전이 어떤 기술을 특허로 출원·등록했고 어느 나라에 권리를 갖고 있는가'를 확인하는 데 쓴다. 출원번호(kipo_appl_no)와 등록번호(kipo_rgst_no)를 키로 특허청 출원·등록 정보와 이어 쓰고, 기술이전 여부는 포털이 안내하는 같은 기관의 산업재산권 기술이전목록과 함께 본다.
description_portal: 한국서부발전은 에너지 기술 혁신을 선도하기 위해 연구개발 성과의 산업재산권 정보입니다. 국내외 산업재산권 신고 현황은 소유 구분, 발명자 정보, 발명 명칭, 출원 및 등록 정보 등을 포함하며, 이를 통해 기술 경쟁력 강화 및 미래 에너지 시장 선점을 위한 기반을 마련합니다. 데이터는 발명의 종류, 진행 상태, 출원/등록 번호 및 일자, 출원/등록 국가 등 상세 정보를 담고 있어 체계적인 재산권 관리를 지원합니다. 기술 보호와 더불어 기술 이전 관련 자료는 한국서부발전(주)_산업재산권 기술이전목록을 참조하시기 바랍니다.제공항목은 소유구분,발명자영문이름,발명명칭,발명명칭_영문,주소,발명의 종류,발명신고서진행상태,출원번호,출원완료일자,출원명,등록번호,등록명,산재권등록일,등록권자,등록일자,국내외구분,출원국가,등록국가 데이터를 제공합니다.
