summary_user: 서울특별시 중구의 지하수정화업체 인허가 정보를 업소 1곳당 1행으로 담은 지방행정 인허가(LOCALDATA) 원장으로, 관리번호·인허가일자·영업상태(등록·폐업 등)·지번·도로명 주소·사업장명·중부원점TM 좌표·자본금·시설장비 등을 포함한다. 중구에서 지하수정화업 창업을 검토하는 예비 사업자나 분석가가 '중구에 영업 중인 지하수정화업체는 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 개방기관코드(OGDP_INST_CD)나 주소·업체명 매핑으로만 잇고, 같은 LOCALDATA 계열의 다른 업종 인허가 데이터와 같은 구조로 묶어 쓴다.
description_portal: '서울특별시 중구의 지하수에 함유된 오염물질을 제거·분해 또는 희석하여 지하수의 수질을 개선하는 업소 정보입니다. 데이터는 각 지하수정화업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 지하수정화업체 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 오염 복원 처리시설 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
