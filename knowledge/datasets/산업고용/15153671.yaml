description_portal: 본 데이터는 한국남부발전(주) 하동 7호기 보일러 튜브 누수 탐지를 위한 계측값 합성데이터입니다.보일러 튜브 누수 탐지를 위해 내부에 설치된 계측기들의 계측값을 합성데이터로 변환하였으며, 발전량, 유량, 복수기/급수 전체 유량, 보일러 노내 압력, 과열기 1~9의 온도, 보일러 구역1~38의 데시벨, SOOTBLOWER의 운전상태까지 총 55개의 컬럼으로 구성되어 있습니다.본 데이터는 기간별로 총 5개의 데이터로 구성되어 있습니다. 모두 컬럼 정보는 동일하며 한 파일 당 약 10일간의 계측값 합성데이터로 구성하였습니다.
