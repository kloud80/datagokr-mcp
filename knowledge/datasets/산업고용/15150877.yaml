summary_user: 경기도가 제공하는 신기술·특허 기술 목록으로, 기술 한 건마다 기술분류, 기술명칭과 축약명, 요약 설명, 등록번호, 등록업체, 인증 여부, 인증기간 시작·종료일을 담는다. 건설·토목·방재 분야 기술을 검토하는 발주 담당자나 분석가가 "이 업체의 신기술은 지금도 인증기간 안에 있는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 등록업체명(reg_entrps_nm)이나 등록번호를 이름·번호 대조로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 신기술 또는 특허 기술에 대한 기본 정보를 포함하고 있으며, '기술분류명', '기술명칭', '기술정보', '인증여부', '등록번호', '등록업체', '기술축약명', '인증기간시작일', '인증기간종료일' 등의 항목으로 구성됩니다. 각 기술은 건설, 토목, 방재 등 다양한 기술영역에 걸쳐 있으며, 기술의 명칭과 요약명, 그리고 실제 등록된 업체명이 함께 제공됩니다. 특히 인증 여부와 인증기간은 해당 기술이 신기술로서 유효한지 여부를 판단하는 데 중요하며, 기술 요약 설명을 통해 기술의 핵심 기능을 간단히 파악할 수 있도록 구성되어 있습니다. 이 데이터는 기술선정평가, 기술이전 검토, 인증기한 관리, 기술 동향 분석 등 다양한 정책 및 실무 영역에서 유용하게 활용될 수 있습니다.
