summary_user: 서울특별시 성동구 안의 대형마트·백화점·쇼핑센터·복합쇼핑몰 같은 대규모점포를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·취소일자·영업상태·폐업일자·휴업기간·소재지 주소·좌표·사업장명·업태 등을 포함한다. 성동구에서 지금 영업 중인 대규모점포가 어디에 몇 곳 있고 언제 허가나 폐업이 났는지 확인하려는 상권 분석가나 유통업 사업자의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE)·관리번호를 통한 같은 기관 데이터 연결로만 이어 쓰며, 전국대규모및준대규모점포표준데이터 같은 상가·상권 데이터와 함께 본다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 대형마트, 백화점, 쇼핑센터, 복합쇼핑몰 등 다양한 유형의 대규모 유통판매업소 정보를 수집·제공하기 위해 구축되었습니다. 이 데이터는 다수의 사업자로부터 식품 및 생활필수품을 납품받아 판매하는 영업장의 현황을 체계적으로 관리하고 소비자에게 안전하고 신뢰도 높은 정보를 제공하기 위해 목적을 두고 있습니다. 데이터에는 업소별 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 있어 해당 영업장의 행정적 관리 상태와 인허가 이력, 운영 현황을 명확히 파악할 수 있도록 설계되었습니다. 데이터는 정기적으로 행정기관에서 엄격하게 점검하여 최신성을 유지하며, 유통·판매업 환경 분석, 영업 허가 및 폐업 현황 파악, 정책 수립 근거 자료로서 신뢰성이 높습니다. 소비자, 관련 기관, 업계 종사자 및 연구자가 대형 유통업 환경의 변화와 시장 동향을 이해하고, 상권 분석이나 위생관리 정책 수립, 합리적 소비를 위한 정보제공 등 다양한 목적에 활용할 수 있습니다.
