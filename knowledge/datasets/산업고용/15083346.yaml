summary_user: 한국서부발전이 운영하는 발전기별로 연도·발전원과 함께 설비용량(MW), 발전량(MWh), 발전열효율, 이용률을 담은 연 단위 실적 파일(CSV, 약 14KB)이다. 에너지 분석가나 연구자가 서부발전 소속 발전기 중 어느 발전원·호기의 이용률과 열효율이 높거나 낮은지, 연도별로 어떻게 변했는지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전기명·발전원 이름을 맞춰 매핑하거나 같은 기관(한국서부발전) 데이터끼리만 이어 쓴다.
limits: 전력거래소식 실시간·시간별 수급 데이터가 아니라 발전기별 연도 단위 실적이므로 오늘의 수급이나 시간대별 발전량 질문에는 쓰지 못한다. 발전소 코드 같은 공통 키가 없어 타 발전사·전력거래소 데이터와 결합할 때는 이름 매핑 오류에 주의해야 한다.
