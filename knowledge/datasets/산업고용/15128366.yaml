description_portal: 신용보증재단중앙회의 개인보증(햇살론, 근로자햇살론)에 대한 데이터로, 개인보증 업무의 중점관리지표별 KPI(핵심성과지표)를 관리합니다. 개인정보보호를 위해 개인을 특정할 수 없도록 고유문자로 변환해 제공합니다신용보증재단중앙회가 설정한 개인보증에 대한 중점 관리 정보를 담은 기본 데이터로 중점관리목표건수, 중점관리목표금액, 중점관리실적건수, 중점관리실적금액 등의 정보가 포함되어 있습니다. 개인보증이란 사업자가 아닌 금융취약계층의 개인을 대상으로 보증을 제공해 대출 접근성을 높이는 제도로 2016년 9월에 서민금융진흥원으로 이관되었습니다.
