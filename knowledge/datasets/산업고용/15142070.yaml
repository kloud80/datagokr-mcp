description_portal: 매년 고용노동부고객상담센터에서 처리하는 전화상담, 인터넷 상담, 스마트폰 상담 처리 건수 1. 전화통계(전화상담 고용 및 노동분야, 2021년~2025년)    - 전국 단일 번호(1350) 및 각 지역 고객센터 대표번호로 유입된 전화 고용노동상담전화 총량을 기반으로, 실제 고용노동부고객상담센터 응답처리한 상담 전화의 비율과 처리 건수를 산출 2. 인터넷통계(국민신문고 및 사이버상담 등, 2021년~2025년)   - 국민신문고 등 온라인 청구를 통해 접수된 고용노동 관련 질의를 기준,고용,산업안전 총 3가지 분야로 구분하여, 각 분야별 상담 건수와 전체 대비 비중을 산출 3. 스마트폰통계(1350모바일상담, 2021년~2025년)   - 고용노동부 공식 홈페이지의 빠른인터넷 상담 서비스와 모바일 기반 간편 상담 서비스를 통해 접수된 상담 문의에 대하여 신속하게 회신한 상담 건수를 산출
