summary_user: 전라남도 지역에서 벙커C유를 연료로 쓰는 사업장 목록으로, 사업장별로 이름·소재지 주소·종별을 한 줄씩 담는 건별 현황이며 파일 크기는 435바이트로 소규모입니다. 주민이나 환경·에너지 분석가가 '우리 지역에서 벙커C유를 쓰는 사업장이 어디에 있고 어떤 종별인가'를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업장명이나 주소를 직접 맞춰 이어 쓴다.
description_portal: '- 전라남도 벙커C유 사용업체 현황에 대하여 데이터를 제공하고자 합니다.(사업장명,  사업장 주소, 종별에 대한 현황 제공 )- 벙커C유(Bunker C oil)는 중질유(重質油)의 한 종류로, 선박 연료나 산업용 보일러 연료로 많이 사용되는 잔사유(residual fuel oil)입니다.- 용도- 선박 연료: 대형 화물선·유조선 등에서 주로 사용 (해상운송 연료의 주류였음)- 산업용 보일러: 대형 발전소, 제철소, 시멘트 공장 등에서 연료로 사용- 비상 발전기: 일부 국가에서 정전 대비용 비상 발전 연료로 사용- 국제해사기구(IMO)는 2020년부터 선박 연료의 황 함량을 0.5% 이하로 제한하는 IMO 2020 규제를 시행함으로써 벙커C유의 사용은 크게 줄었습니다. 이에 따라 선박 업계는 저유황유(LSFO)나 LNG, 암모니아 등 대체 연료로 전환 중입니다.'
