summary_user: 엔지니어링사업자를 주된 기술부문(기계·선박·항공우주·전기·정보통신·건설·환경·원자력 등 15개 부문)별로 나눠 연도별 업체 수를 전국 단위로 집계한 소형 통계 파일(csv, 878 bytes)이다. 정책 담당자나 분석가가 '최근 몇 년 사이 정보통신·환경 부문 엔지니어링 업체 수가 얼마나 늘었나' 같은 기술 분야별 산업 규모 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 기술부문 이름을 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 본 데이터는 엔지니어랑사업자의 주된 기술부문별 사업자 현황을 연도별로 집계한 통계자료이다.-기술부문은 「엔지니어링산업진흥법 시행령」 별표 1(제3조 관련)에 따른 분류를 적용하였다.- 업체수는 해당 기술부문을 기술부문으로 신고한 엔지니어링사업자이다.(업체당 1개만 해당)이 자료는 우리나라 엔지니어링산업의 현재 위치를 객관적으로 보여주며, 정부 정책 수립 및 연구를 위한 기초 통계자료로 활용될 수 있다. 또한 산업 경쟁력 평가, 인력 수급 계획 수립, 기술 분야별 지원 사업 기획 등 다양한 분야에서 폭넓게 활용 가능 하다.
