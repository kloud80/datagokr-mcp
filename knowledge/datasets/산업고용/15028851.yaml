summary_user: 부산광역시 사하구 관내에 등록해 영업 중인 행정사 사무소를 한 행에 한 곳씩 담은 건별 목록으로, 사무소명·도로명 소재지·대표 전화번호·행정사 종류(일반·해사·외국어번역)를 담는다(CSV 약 2.7KB 규모). 사하구 주민이나 사업자가 '우리 동네에서 외국어번역 행정사 사무소는 어디에 있나'를 찾거나, 분석가가 구 단위 행정사 분포를 볼 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 소재지 주소나 사무소명을 맞춰 붙이거나 LOCALDATA 행정사 인허가 자료와 이름·주소 기준으로 대조해 쓴다.
limits: 범위가 사하구 한 곳이라 부산 전체나 다른 구와 비교하려면 구별 자료를 따로 모아야 한다. 사업자번호나 표준 코드 같은 공통 키가 없어 다른 데이터와 자동으로 연결하기 어렵다. 휴대폰번호 등 개인정보가 들어간 전화번호는 공백(비공개)으로 처리돼 있다.
