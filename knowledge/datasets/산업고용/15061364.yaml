summary_user: 한국수력원자력이 판매한 전력량을 연월별로 원자력·수력·양수·신재생 발전원으로 나누고 합계를 붙인 월간 집계 표이며, 값은 해당 월 송전량 합계(GWh)이고 범위는 전국 단위입니다. 에너지 분석가가 '한수원의 월별 원자력 판매량은 어떻게 변해 왔고, 신재생 비중은 얼마나 늘었나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 전력 수급·판매 통계와는 연월(연월)을 기준으로 맞추거나 기관명으로만 이어 쓴다.
