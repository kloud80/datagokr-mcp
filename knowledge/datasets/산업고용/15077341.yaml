summary_user: 대구광역시 달서구 안의 여성기업을 업체 한 곳당 한 행으로 담은 파일로, 업체명·상시근로자 수·소재지·주업종·주요 생산품목·전화번호와 위도·경도 좌표를 포함한다(CSV 약 86KB). 지역 담당자나 분석가가 '달서구에 어떤 업종의 여성기업이 어디에 몰려 있나'를 파악하거나 거래·지원 대상 업체를 찾는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 업체명·주소를 맞추거나 좌표로 위치를 겹쳐 이어 써야 한다.
description_portal: 여성기업이란 여성이 소유, 경업하는 기업으로 법령으로 정하는 기준에 해당하는 기업입니다.대구광역시 달서구에서 운영하는 여성기업에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 번호, 업체명, 상시근로자, 소재지, 주업종, 전화번호, 주요 생산품, 담당부서, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 여성 기업을 파악하는데 유용하게 참고자료로 쓸 수 있으며  행정업무에  활용 가능합니다.
