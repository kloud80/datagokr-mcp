summary_user: 경기도 가맹사업 정책·상권 분석용으로 기준년도별 시도·시군구 단위의 전체·남자·여자 인구수와 유동인구수를 담은 집계 통계다. 예비 가맹점주나 상권 분석가가 '경기도 어느 시군구가 유동인구가 많아 가맹점 입지로 유리한가'를 비교할 때 쓴다. 시도코드(sido_cd)·시군구코드(signgu_cd)로 지역을 구분하지만 실측상 전역 조인 키는 확인되지 않아, 상가업소·인허가(LOCALDATA) 데이터와는 행정코드나 지역명 매핑으로 이어 써야 한다.
description_portal: 이 데이터는 가맹사업 관련 정책 수립 및 상권 분석을 위해 수집된 자료로, 경기도 내 시도 인구 수와 각 시군구 단위의 유동인구 통계를 제공하고 있습니다. 데이터는 기준년도별로 구성되며, 시도코드 및 시군구코드를 통해 지역을 식별할 수 있습니다. 항목에는 전체 인구수, 남자인구수, 여자인구수, 유동인구수가 포함되어 있어 성별 및 지역별 유동 인구의 특성을 파악할 수 있습니다. 이 데이터는 창업 입지 선정, 유동 인구 기반 마케팅 전략 수립, 지역경제 활성화 방안 마련 등의 목적으로 활용될 수 있습니다. 데이터 활용 시 행정코드에 대한 이해가 필요하며, 분석 시 시군구 단위 비교 분석이 유용합니다.
