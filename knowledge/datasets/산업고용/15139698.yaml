description_portal: 본 데이터는 (주)한국가스기술공사의 각 사업소별 KOSHA-MS(안전보건경영시스템) 인증 현황을 정리한 자료입니다. 사업소명, 소재지, 인증 유효기간, 인증기관 정보를 포함하고 있으며, 본사 및 전국 지사 단위의 안전보건경영 인증 상태를 확인할 수 있습니다. 이를 통해 각 사업장의 안전관리 체계 유지 현황, 인증 주기 및 갱신 시기, 지역별 안전경영 수준을 분석할 수 있습니다. 해당 자료는 산업안전보건법 준수 여부 점검, 위험 예방 및 안전관리 수준 향상, 인증 만료에 따른 사전 대응 계획 수립 등에 활용 가능하며, 장기적으로는 지속가능 안전경영 기반 강화를 위한 핵심 기초 데이터로 가치가 높습니다.
