summary_user: 전북특별자치도 부안군 관내에서 담배소매인으로 지정된 업소를 한 건씩 담은 원천 파일로, 지정번호·업소명·도로명/지번 주소·지정일자·데이터 기준일자를 담는다. 부안군 안에 담배를 파는 가게가 어디에 얼마나 있는지, 특정 지역에 신규 지정이 언제 이뤄졌는지 확인하려는 주민·예비 사업자·상권 분석가가 쓴다. 전역 조인 키는 없어 소상공인 상가업소 정보나 다른 지자체 LOCALDATA 인허가 자료와는 주소나 업소명을 맞춰 이어 써야 한다.
limits: 실측 컬럼에 사업자번호 같은 공통 식별 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 부안군 한 곳의 개별 업소이므로 시군 간 비교에는 다른 지자체 파일을 따로 모아야 하고, 일부 업소명은 개인정보 보호로 비어 있다.
