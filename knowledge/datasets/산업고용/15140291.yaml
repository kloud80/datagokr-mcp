description_portal: ‘미래직업탐구’는 한국고용정보원 미래직업연구팀에서 격월로 발행하는 웹진으로, 변화하는 일자리 환경 속에서 다양한 직업 세계를 소개하고자 기획된 콘텐츠입니다. 각 호마다 하나의 직업을 선정하여 현직 전문가와의 인터뷰를 중심으로 직무 내용, 직업의 탄생 배경, 필요한 역량, 전망 등을 심층적으로 탐색합니다. 특히 일반적으로 잘 알려지지 않은 신직업 또는 특수직업에 대한 이해를 넓힐 수 있도록 구성되어 있어 진로 탐색 단계에 있는 청소년, 구직자, 직업지도 전문가들에게 유용한 정보를 제공합니다. 직업에 대한 고정관념을 깨고, 시대 흐름에 맞춘 직업세계의 다양성과 유연성을 체감할 수 있는 디지털 콘텐츠로, 미래 사회를 살아갈 이들에게 실질적인 직업 탐색 가이드를 제시합니다.
