description_portal: '국내 방사선 비상진료기관 현황 데이터입니다. (데이터 기준 : 2023년 12월 말) 이 데이터는 국내 방사선 비상 상황에 대비하기 위해 지정된 비상진료체계의 현황을 권역별로 정리하여 제공하는 자료입니다. 각 권역 내 원자력 및 방사선 시설과 연계된 비상진료기관의 구성 정보를 포함하며, 기관명과 지정연도, 권역별 비상진료센터 현황을 함께 제공합니다. 또한 1차 비상진료기관 수, 2차 비상진료기관 수, 전체 합계 등을 포함하여 지역별 대응능력과 의료지원 체계를 파악할 수 있습니다. 이를 통해 방사선 사고 대응 계획 수립, 자원 배치, 정책 평가 등에 활용 가능한 기초 정보를 제공합니다.연관데이터는 다음 개별 데이터파일을 참고하세요 - 방사선비상진료요원 현황, 세슘 치료제(프루시안 블루) 보유량,  갑상선 방호약품(안정화요오드 KI) 보유 현황,  방사선비상진료기관 현황, 주요국별 갑상선방호약품 배포현황'
