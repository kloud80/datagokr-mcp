description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 에너지 사용량이 2,000toe 이상인 에너지다소비사업자가 의무적으로 신고한 발전전용 설비 보유 현황을 제공합니다. 발전전용 설비는 오직 전기 생산만을 목적으로 운영되는 발전 설비로서, 본 데이터는 전국 지자체별, 연도별, 그리고 산업 및 상업 등 주요 부문별로 발전전용 설비의 설치 용량 및 운영 실태를 상세히 나타내고 있습니다. 이를 통해 정부 및 지자체는 지역별 발전 설비 현황 및 전력 공급능력을 정확히 분석하여 전력수급 안정화 정책과 에너지 효율 향상 전략을 수립할 수 있습니다. 또한 기업 및 연구기관은 발전 설비 효율성 평가, 전력 소비패턴 분석, 에너지 정책 연구 및 지속 가능한 에너지 계획 수립의 기초자료로 활용할 수 있습니다.
