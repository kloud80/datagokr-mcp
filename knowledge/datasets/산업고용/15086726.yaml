summary_user: '에너지다소비사업자(연간 2,000toe 이상)가 신고한 발전전용 설비 보유 현황을 연도·부문(산업·상업 등)별 행으로, 17개 시도를 열로 펼쳐 총합계와 함께 담은 집계표이며 파일 크기는 약 6KB로 작다. 에너지 정책 분석가가 "어느 시도에서 어느 부문 다소비사업자의 발전전용 설비가 연도별로 늘었나"를 비교하는 데 쓴다. 전역 조인 키가 없어 시도 이름과 연도를 맞춰 다른 지역별 에너지 통계(예: 지역×월 에너지 사용량, 태양광 발전사업 허가 표준데이터의 주소 기반 시도 집계)와 붙여 쓴다.'
