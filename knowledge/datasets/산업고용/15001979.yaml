summary_user: 중소기업 기술개발제품이 성능을 확보했음을 확인한 성능인증확인서의 발급 건별 목록으로, 2016-03-31부터 2026-09-01까지 전국 3,610행을 담는다. 공공기관 납품을 준비하는 사업자나 분석가가 특정 업체가 어떤 품목으로 성능인증을 받았고 유효기간이 언제인지 확인하는 질문에 쓴다. 사업자등록번호(bizno)를 조인 키로 벤처·이노비즈·창업기업 등 다른 기업 확인·인증 데이터와 기업 단위로 이어 쓴다.
description_portal: '* 공공구매종합정보망(www.smpp.go.kr)에서 제공하는 데이터입니다. * 성능인증 제도소개 : 중소기업 기술개발제품이 성능을 확보하였음을 확인ˑ증명하여 공공기관의 기술개발제품 구매유도 및 중소기업의 R&D를 촉진하는 제도 - 성능인증 제품은 우선구매지원 대상이 될 수 있으며, 국가계약법 등에 따라 공공기관과 수의계약을 체결할 수 있는 자격 부여※ 성능인증서 유효기간 : 인증일로부터 4년(1회에 한해 최대 4년까지 연장 가능) - 법적근거 : 중소기업제품 구매촉진 및 판로지원에 관한 법률 제15조, 중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령 제13조 내지 제16조, 중소기업제품 구매촉진 및 판로지원에 관한 법률 시행규칙 제10조 내지 제14조, 중소기업기술개발제품 우선구매제도 운영등에 관한 시행세칙* 기술개발제품 중 하나인 성능인증확인서를 발급받은 중소기업 및 인증품목 현황* 데이터 구성요소 : 신청구분, 신청번호, 차수, 발급일자, 사업자등록번호, 업체명, 신청품목, 유효기간'
