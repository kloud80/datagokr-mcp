description_portal: '중소벤처기업진흥공단 재도전종합지원센터에서 신청한 상담 신청 건수에 대한 자료입니다.해당 자료는 2025년 10월까지의 데이터로 구성되었으며, 9가지 상담유형을 연도별, 월별 접수건수로 분류하여 나타냅니다.- 상담유형: 개인회생및파산, 경영애로전반, 구조개선전용자금, 기타, 신용회복, 재기컨설팅, 재창업교육, 재창업자금, 회생컨설팅재도전종합지원센터의 재기지원 상담 카테고리를 통해 (예비)재창업기업의 재기상담을 접수, 관리하고 있으며 가까운 지역본지부 담당자를 통해 상담이 진행됩니다.상담 신청에 대한 보다 자세한 내용은 재도전종합지원센터를 통해 확인해주시길 바랍니다.'
