summary_user: 한국남동발전이 운영하는 발전소의 굴뚝에서 측정한 대기오염물질 배출 농도 평균값을 사업소·호기·연월·오염물질 항목별로 담은 집계 자료이며, 범위는 전국이다. 연구자나 환경단체가 "특정 발전소 호기의 오염물질 배출 농도가 달마다 어떻게 변했고, 배출허용기준을 지켰는가"를 확인하는 데 쓴다. 전역 조인 키는 없다. 그래서 같은 기관의 다른 발전소 측정 데이터(수질·석탄재·주변 기상)와는 사업소코드(orgNo)나 발전소 이름을 맞춰 붙이고, 오염물질 항목코드는 별도 매핑으로 해석해야 한다.
description_portal: 해당 데이터는 한국남동발전이 운영하는 각 발전소에서 배출하는 대기오염물질의 일일 실적 현황을 제공하는 공공 데이터입니다. 발전소 굴뚝에서 측정된 대기오염물질의 배출 농도를 공개한 자료이며, 기관의 환경 관리 수준을 보여주는 중요한 지표입니다. 데이터는 발전소별, 대기오염물질 코드별 평균 배출 실적을 제공합니다. 연구기관은 이 데이터를 활용하여 발전소의 배출허용기준 준수 여부를 분석하고 정책 효과를 평가합니다. 또한, 환경단체는 발전소의 환경 영향을 객관적으로 감시하고 기업의 사회적 책임을 요구하는 근거 자료로 활용할 수 있습니다.
