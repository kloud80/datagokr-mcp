summary_user: 경기도 내 승강기 제조·수입업체의 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·지번/도로명 주소·우편번호·좌표가 들어 있는 지방행정 인허가(LOCALDATA) 계열 원장이다. 지역 승강기 업계 분석가가 "경기도에서 현재 영업 중인 승강기 제조·수입업체는 어느 시군에 몰려 있는가"를 확인하거나, 산업안전 점검 대상 업체 목록을 뽑는 데 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙일 전역 조인 키가 없어서, 사업장명·주소를 매칭하거나 좌표(X_CRDNT_VL·Y_CRDNT_VL)로 공간 결합해 상가업소·지역 기업 현황 같은 다른 LOCALDATA 업종 인허가 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 승강기 제조 및 수입업체에 대한 인허가 정보를 담고 있으며, 각 사업장의 명칭, 인허가 일자, 영업상태, 소재지 주소, 우편번호, 위도·경도 좌표 등의 정보를 제공합니다. 데이터 항목에는 ‘사업장명’, ‘영업상태명’, ‘인허가일자’, ‘소재지도로명주소’, ‘WGS84위도’, ‘WGS84경도’ 등이 포함되어 있으며, 이를 통해 승강기 제조 및 수입업체의 공간적 분포와 운영 현황을 파악할 수 있습니다. 이 데이터는 산업안전 점검, 지역별 제조업체 분석, 수입업 관리, 공공정책 수립 등에 활용될 수 있습니다.
