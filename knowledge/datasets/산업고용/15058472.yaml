summary_user: 경기도 내 지하수 영향조사기관의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자와 자본금·전문인력 수·보유 장비, 주소와 좌표를 포함한다. 지자체나 기업이 지하수 영향조사 용역을 맡길 때 "우리 시군에 영업 중이고 전문인력과 장비를 갖춘 영향조사기관이 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명(SIGUN_NM)이나 주소·좌표로 맞춰 다른 지방행정 인허가(LOCALDATA) 업종 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 영향조사기관의 인허가 현황을 제공하는 자료로, 지하수 개발 및 이용이 주변 환경과 지하수에 미치는 영향을 조사하는 전문 기관의 정보를 담고 있습니다. 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지면적(LOCPLC_AR), 자본금(CAPTL_AMT), 시설장비보유내역(FACLT_EQUP_HOLD_DTLS), 타기관이전여부(OTRINST_TRANSFR_YN), 전문인력총수(SPECLTY_MANPWR_TOT_CNT), 도로명주소(REFINE_ROADNM_ADDR), 지번주소(REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 위도(REFINE_WGS84_LAT), 경도(REFINE_WGS84_LOGT)가 포함됩니다.이 데이터는 지하수 이용에 따른 환경적 영향을 평가하거나 환경오염 예방 정책을 수립하는 데 활용될 수 있으며, 환경영향평가 연구, 지하수 관리 계획 수립, 지역별 환경 조사기관 분포 파악 등에 유용합니다. 또한 지자체, 환경 연구기관, 기업 등에서 영향조사기관의 역량(보유 장비 및 전문인력)을 확인하여 조사 및 용역 발주에 참고할 수 있습니다.
