description_portal: 국내 수출 중소기업의 소비재, 산업재 등 우수 제품의 구매를 희망하는 해외 바이어의 구매오퍼 정보(인콰이어리)를 제공합니다.제공하는 데이터로는 구매오퍼 내용(요약된 제목형태), 상품 카테고리, 국가명 등의 정보를 제공합니다.*온라인수출플랫폼(Gobizkorea)는 해외 판로개척에 어려움을 겪는 국내 중소벤처기업들이 온라인을 통해 수출을 할 수 있도록 도와주는 플랫폼으로, 해외바이어를 대상으로 상품(영문 상품페이지, 영문 미니사이트)을 홍보하고 수출거래 협상(인콰이어리)을 진행할 수 있는 B2B 플랫폼입니다.
