summary_user: 온라인수출플랫폼(Gobizkorea)에 해외 바이어가 올린 구매오퍼(인콰이어리)를 건별로 담은 CSV 파일로, 요약 제목·상품 카테고리·바이어 국가명·신청 시작일과 종료일을 담는다. 수출 중소기업이나 지원기관 분석가가 '어느 나라 바이어가 어떤 품목을 찾고 있는가'를 확인할 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 기업 확인·인증 데이터와는 카테고리명·국가명 같은 이름 매핑으로만 연결한다.
