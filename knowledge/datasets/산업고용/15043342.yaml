summary_user: 나주시 관내에서 전기사업(발전사업) 허가를 받은 태양광 발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 상호·소재지 주소·위도·경도·상태·설비용량(kW)·공급전압·주파수·허가일자·사업개시일을 담는다. 나주시 어느 지역에 태양광 발전소가 몰려 있는지, 허가 시점별로 설비용량이 얼마나 늘었는지를 살피는 지역 에너지 분석가나 입지를 검토하는 사업자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 상호 이름으로 맞춰 이어 쓰고, 전국 태양광발전소 전기사업허가 표준데이터와는 발전소 단위·주소·용량 항목을 기준으로 비교한다.
limits: 표준 코드 같은 공통 식별 키가 없어 다른 데이터와 연결하려면 이름·주소 매칭에 기대야 한다. 범위는 나주시 한 곳뿐이라 다른 시군구나 전국 현황을 보려면 별도 데이터가 필요하다.
