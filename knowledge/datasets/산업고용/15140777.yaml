summary_user: 서울 은평구의 백화점·대형마트·쇼핑센터·복합쇼핑몰 등 대규모점포 인허가를 점포별 한 행으로 담으며, 사업장명·인허가일자·영업상태(영업/폐업)·소재지 주소·면적·중부원점TM 좌표(X, Y)가 들어 있다. 상권 분석가나 소상공인이 '은평구에서 지금 영업 중인 대형마트·백화점은 어디이고 언제 허가·폐업했나'를 확인하거나 골목상권 영향을 분석할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·사업장명 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 이어 쓰며, 같은 세부 부문의 소상공인 상가업소 원장이나 전국 대규모점포 표준데이터와 주소 기준으로 대조한다.
description_portal: '은평구의 대형마트, 백화점, 쇼핑센터,복합쇼핑몰 등 다수의 사업자로부터 납품받아 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.대규모점포 인허가 정보는 일정 규모 이상의 판매시설을 운영하기 위해서 반드시 받아야 하는 인허가 현황을 기록한 데이터입니다. 이 업종은 백화점, 쇼핑몰, 대형마트, 창고형마트, 복합문화매장 등 광범위한 소비공간을 포함하며, 지역 경제·교통·소비 패턴·소상공인 보호 등과 연계성이 크기 때문에 사전 인허가 절차가 중요합니다. 본 데이터는 해당 점포의 명칭, 영업자, 소재지, 허가일자, 영업상태(영업중·폐업 등), 면적 규모 등 핵심 정보를 포함하고 있으며, 대규모 상업 공간이 지역 공동체 및 골목상권에 어떤 영향을 미치는지를 분석하는 데 유용합니다. 최근 유통산업의 온라인 전환, ESG경영, 소비자 행동 변화, 스마트유통 혁신, 지역상생 정책 등이 주요 사회적 트렌드로 자리 잡으면서 대규모점포의 입지 및 운영 정보는 도시 계획과 지역경제 정책 수립 시 필수적인 자료로 사용되고 있습니다. 또한 주차·교통혼잡·소상공인 상생방안 연구와 같은 주택지 인근 주민의 생활환경 영향 평가, 세제·영업시간 규제 설계에도 기초 자료로 활용될 수 있습니다.'
