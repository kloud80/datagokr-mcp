description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 2,000toe 이상의 에너지를 소비하는 에너지다소비사업자들이 신고한 에너지 절감 실적 현황을 제공합니다. 전국의 각 지자체별로 연도별, 산업 및 상업 등 부문별로 구분된 데이터는 다소비사업자들이 자발적 또는 정책적으로 추진한 에너지 절감 활동의 실질적 성과를 나타내고 있습니다. 정부와 지자체는 본 데이터를 통해 지역 및 부문별 에너지 절감 성과를 정확하게 파악하고, 이를 기반으로 효과적인 에너지 관리 정책 및 에너지 효율화 지원 방안을 수립할 수 있습니다. 또한 기업 및 연구기관에서는 해당 데이터를 활용하여 에너지 절감 전략 평가, 효율적 에너지 관리 모델 연구, 지속 가능한 에너지 경영계획 수립 등의 기초자료로 사용할 수 있습니다.
