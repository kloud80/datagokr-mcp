summary_user: '한전KPS가 정비를 맡고 있는 전국 화력·원자력·민자발전소를 발전기(호기) 단위로 정리한 기준정보 파일로, 사업소명·발전사명·발전유형·연료원·설계용량을 담는다(CSV 약 7KB의 소규모 원장). 에너지 분석가나 발전사업 검토자가 "한전KPS가 정비하는 발전기는 연료원별로 몇 기이고 설계용량은 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전소·신재생 원장(예: 태양광 발전사업 허가 표준데이터)과는 발전소명·발전사명 같은 이름 매핑으로만 이어 쓴다.'
description_portal: 한전KPS가 정비를 수행하고 있는 화력발전소, 원자력발전소, 민자발전소의 정비 현황입니다. 국내 발전소 기준정보를 토대로 한전KPS가 정비를 수행중인 발전소의 발전유형, 연료원, 설계용량, 발전소명 등의 정보를 제공하고 있습니다. 해당 데이터를 통해 정비·운영·투자 전략 수립, 최신 설비 현황 기초 자료로 활용, 신규 발전사업・투자 검토 자료, 에너지・환경 연구에서 전력공급 기여도 분석 기초 자료 활용, 탄소중립 전략의 기초자료, 정부의 전략수립의 기초 자료 등 다양한 분야에서 활용될수 있습니다.
