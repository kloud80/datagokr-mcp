description_portal: 골재채취법과 골재수급 5개년 기본계획을 기준으로 전국 시군단위별 채취실적에 해당함, 지역별 또는 골재원별(육상, 하천, 산림 및 바다 골재)로 지자체에 신고된 골재채취실적으로 국가단위 또는 지역별 골재 수급현황, 유통현황 및 골재업체 운영현황 등을 파악할 수 있음, 이는 매년 수행하는 골재자원조사의 지역별 조사시 해당시군 및 주변 시군과의 골재유통망 분석 및 수급의 안정성 확보에 관한 기초자료로 활용됨연차별 골재채취현황 등을 테이블로 서비스함. 허가사항인 바다골재, 하천골재, 산림골재, 육상골재 등 4개 골재원에 대한 연도별 허가실적 및 채취실적을 수치화함
