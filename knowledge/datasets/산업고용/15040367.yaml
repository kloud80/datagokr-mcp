summary_user: 중소벤처기업진흥공단이 온라인수출플랫폼(Gobizkorea)에서 운영한 외국어홈페이지 제작사업의 지원 건별 현황을 지원일자·지역·업태·수출품목명·신청언어 단위로 담은 약 5KB 규모의 CSV 파일이다. 수출 지원 정책 분석가가 과거 이 사업이 어느 지역·업종·품목의 기업에 어떤 외국어로 홈페이지 제작을 지원했는지 살펴보는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 기업 데이터와는 지역명·업태명 같은 이름 매칭으로만 느슨하게 이어 쓴다.
