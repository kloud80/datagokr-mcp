description_portal: 온라인수출플랫폼(Gobizkorea)에서 확인할 수 있는 외국어홈페이지 제작사업의 현황 자료를 제공합니다.(본 사업의 데이터는 19년도 이후 사업이 종료함에 따라 더 이상 생성되는 추가 데이터는 없습니다.)*온라인수출플랫폼(Gobizkorea)는 해외 판로개척에 어려움을 겪는 국내 중소벤처기업들이 온라인을 통해 수출을 할 수 있도록 도와주는 플랫폼으로, 해외바이어를 대상으로 상품(영문 상품페이지, 영문 미니사이트)을 홍보하고 수출거래 협상(인콰이어리)을 진행할 수 있는 B2B 플랫폼입니다.
