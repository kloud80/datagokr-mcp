summary_user: 장애인고용부담금 감면 대상이 되는 연계고용 사업장(장애인 표준사업장·직업재활시설 등)을 연도별로 사업장명, 유형, 지역, 도급품목, 상시근로자수, 장애인·중증장애인 근로자수 단위로 담은 전국 범위의 사업장 목록 파일입니다. 부담금을 내는 사업주가 '어느 지역의 어떤 사업장에 어떤 품목을 도급하면 연계고용으로 부담금을 감면받을 수 있나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명이나 지역(주소) 문자열 매칭으로만 이어 쓴다.
description_portal: 해당 데이터는 「장애인고용촉진 및 직업재활법」 제33조제4항, 「연계고용에 따른 부담금 감면 기준」에 따른 장애인고용부담금 감면 관련 데이터로, 부담금 사업주가 연계고용 계약을 진행하는 대상사업장의 정보를 제공하는 것에 그 목적이 있습니다. "장애인고용 부담금감면 연계고용사업장 정보"는 연도별로 연계고용 대상사업장명, 시설구분, 사업장소재지, 도급품목, 상시근로자수, 장애인근로자 수 정보를 제공하고 있으며, 본 데이터 제공을 통해 연계고용 제도 활성화, 제도 활용도를 제고하고자 합니다.
