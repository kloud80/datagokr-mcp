summary_user: 한국중부발전이 해외에서 추진 중이거나 완료한 신재생에너지 사업을 사업 한 건당 한 행으로 정리한 소규모 파일(csv 588바이트)로, 국가·사업명·발전 종류·설비용량(MW)·지분율·투자금액(억 원)·사업 시작·종료연도를 담는다. 분석가나 ESG 담당자가 '중부발전은 어느 나라에 어떤 신재생 발전소를 얼마의 지분과 투자로 운영하고 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명이나 사업명 같은 이름 매핑, 또는 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 한국중부발전이 해외에서 추진 중이거나 완료한 신재생에너지 사업의 현황을 정리한 자료입니다. 항목은 순번, 국가, 사업명, 종류, 설비용량(MW), 지분율(%), 투자금액(억 원), 사업시작연도, 종료연도, 총사업년수로 구성되어 있습니다. 국가별 신재생 발전소의 용량, 투자 비율, 사업 기간 등을 통해 중부발전의 해외 진출 전략 및 글로벌 신재생 포트폴리오 현황을 파악할 수 있습니다. 이 데이터는 친환경 에너지 확대 추세, ESG경영 실천, 해외 투자 리스크 관리, 국제 협력 사례 등 다양한 측면에서 활용될 수 있는 전략적 가치가 높은 자료입니다.
