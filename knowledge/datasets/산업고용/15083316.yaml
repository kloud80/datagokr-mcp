summary_user: 한국동서발전이 운영하는 발전소의 호기별·월별 발전실적을 담은 파일 데이터로, 발전소명·호기·발전원·연월 단위로 설비용량(MW), 발전량(MWh), 열효율, 이용률을 기록한다. 에너지 분석가나 연구자가 "동서발전의 석탄 호기와 LNG 호기 중 어느 쪽 이용률이 최근 떨어졌나"처럼 발전원별·호기별 운영 성과와 효율 추이를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 발전공기업의 같은 표준 데이터와는 발전소명·발전원 이름과 연월을 맞춰 이어 붙여야 한다.
description_portal: 한국동서발전에서 운영 중인 각 발전소의 월별 발전실적 정보 데이터입니다. 데이터 항목에는 발전소명, 호기, 발전원, 연월, 설비용량(MW), 발전량(MWh), 열효율(비율), 이용률(비율), 열효율(송전), 이용률(일수 기준)이 포함되어 있습니다. 특히 발전공기업 표준 지표 외에도 열효율(송전), 이용률(일수 기준) 정보가 추가되어 있어 실질적인 운전 효율과 가동 상태를 더 세밀하게 파악할 수 있도록 구성되어 있습니다. 이 데이터는 발전소별 설비 운영 성과 분석, 에너지 효율 개선 전략 수립, 발전원별 성능 비교, 정비주기 최적화 등에 활용될 수 있습니다. 학계 및 연구기관에서는 전력산업의 운영 효율성 분석, 에너지 믹스 전략 수립, 재생에너지 전환 시나리오 수립, 탄소중립 달성 시 활용 가능한 열효율 및 이용률 변화 예측 연구 등에도 유용하게 활용될 수 있습니다.
