description_portal: 한국수력원자력㈜이 공개하는 양수건설 경제유발 효과 데이터는 기존 양수발전소 건설 및 운영에 따른 지역경제 파급 효과를 보여주는 자료입니다. 해당 데이터는 양수건설 사업이 단순히 전력 생산 기능에만 그치지 않고, 부가가치 창출과 지역경제 활성화에도 중요한 역할을 한다는 점을 정량적으로 설명합니다. 데이터는 구분, 생산(산출)효과, 고용효과(명), 소득효과, 부가가치효과, 지방세수효과(최근 3년간 평균 납세액) 항목으로 구성되어 있으며, 이를 통해 양수건설이 지역 내 고용 창출과 소득 증대, 세수 증가에 미치는 긍정적인 효과를 확인할 수 있습니다. 이 공개자료는 양수발전소 건설의 경제적 당위성을 설명하는 근거자료로 활용될 수 있으며, 지역사회와의 상생과 협력, 정책적 의사결정 과정에서도 중요한 참고자료가 됩니다.
