summary_user: "창업진흥원의 신산업 스타트업 육성(BIG3) 지원사업 주관기관을 기관 한 곳당 한 행으로 정리한 소규모 파일(csv 약 1KB)로, 지역·주관기관명·기관구분(대학·공공·연구·민간 등)·주력지원기술분야·주소를 담는다. 기술 기반 창업자가 '내 기술 분야(예: 바이오·의료)에 특화된 주관기관이 우리 지역 어디에 있나'를 찾거나, 분석가가 분야별·지역별 창업지원 인프라 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주관기관명 같은 이름이나 주소의 지역명을 맞춰서만 이어 쓸 수 있다."
description_portal: 해당 데이터는 창업진흥원이 관리하는 「신산업 스타트업 육성 지원사업」의 주관기관 정보를 정리한 자료로, 연번, 지역, 주관기관명, 기관구분(대학, 공공기관, 연구기관, 민간 등), 주력지원기술분야, 주소 및 상세주소로 구성되어 있습니다. 전기·전자, 정보·통신, 바이오·의료·생명, 에너지·자원 등 4차 산업혁명 핵심 분야를 중심으로 구성된 기관들의 분포를 보여주며, 기술 기반 스타트업의 육성 인프라를 파악할 수 있도록 설계되었습니다. 각 기관의 기술 분야별 전문성과 지원 위치를 확인함으로써, 창업 정책 수립 시 유망 신산업 분야의 생태계 조성 현황을 파악하거나, 분야별 창업지원 역량 진단, 지역 간 협력 네트워크 기획 등에 유의미한 기초자료로 활용될 수 있습니다. 또한 기술 기반 창업자의 입장에서는 특정 기술 분야에 특화된 지원기관을 탐색하는 데 실질적인 정보로 기능합니다.
