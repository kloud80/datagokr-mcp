summary_user: K-RE100(한국형 재생에너지 100% 사용) 캠페인에 참여한 기업의 등록 정보를 기업별 등록 건 단위로 담으며, 목표연도(TARGET_YYYY)와 등록일 등이 함께 제공되고 범위는 전국·비공간입니다. ESG 분석가나 투자자가 '이 기업이 K-RE100에 등록했는지, 언제 등록했고 목표연도는 언제인지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 기업·재생에너지 데이터와는 기업명 같은 이름 매칭이나 같은 기관(한국에너지공단) 데이터의 코드로만 이어 쓴다.
description_portal: 본 데이터는 한국형 RE100(K-RE100) 캠페인에 참여하는 기업들의 등록 정보를 제공합니다. RE100(Renewable Electricity 100%)은 기업이 사용하는 전력량의 100%를 재생에너지로 충당하겠다는 자발적인 글로벌 이니셔티브로, 기후변화 대응 및 ESG(환경·사회·지배구조) 경영의 핵심 요소로 부상하고 있습니다. K-RE100은 국내 기업들이 국내 상황에 맞춰 재생에너지를 구매하고 사용하는 것을 지원하기 위해 마련된 제도로, 이 데이터는 국내 기업들의 재생에너지 전환 노력과 그 현황을 투명하게 공개하는 데 목적이 있습니다. 이를 통해 정부는 K-RE100 제도의 활성화 및 정책 효과를 평가하고, 기업들은 재생에너지 사용 현황을 파악하여 ESG 경영을 강화하며, 투자자들은 기업의 친환경 경영 노력을 평가하는 데 중요한 근거 자료를 활용할 수 있습니다.
