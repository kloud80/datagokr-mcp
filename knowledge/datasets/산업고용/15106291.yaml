description_portal: '- 전라남도 내에 있는 뿌리산업  현황으로 뿌리산업의 공정별(주조, 금형, 소성가공, 용접 등) 업체 수, 종사원 수, 매출액 현황을 조회할 수 있습니다.- "금형"이란 제품을 일정한 형상과 크기로 정밀하게 만들어내기 위해 사용하는 형틀을 말합니다. 주조, 프레스, 사출, 단조, 압출 등 다양한 제조 공정에서 사용되며, 제조업의 꽃이라고도 불릴 만큼 매우 중요한 기술입니다.- "주조(鑄造, Casting)"는 녹인 금속(용탕)을 틀(주형)에 부어 넣고 굳힌 후 제품을 만드는 금속 성형 기술입니다. 아주 오래된 제조 방식이지만, 현재도 자동차, 조선, 항공, 기계, 중장비, 전력산업 등에서 필수적인 핵심 기술입니다.- "용접(溶接, Welding)"은 금속과 금속을 고열이나 압력으로 녹이거나 눌러 붙여서 하나로 접합하는 기술입니다. 구조물, 기계, 배관, 자동차, 선박, 항공기 등 거의 모든 제조 산업에서 필수적인 금속 접합 기술 중 하나입니다.'
