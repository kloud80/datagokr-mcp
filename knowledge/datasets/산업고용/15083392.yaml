summary_user: 한국서부발전이 들여온 발전용 연료의 도입 실적을 월(년월)·연료(자재번호·연료명)별 수량과 단위로 담은 파일로, 예시 행은 2021년 1월 유연탄 112,169톤(MT) 형태이며 csv 약 31KB 규모입니다. 에너지 분석가나 연구자가 한국서부발전의 유연탄 등 연료 도입량이 월별·연도별로 어떻게 변했는지, 국제 연료가격이나 공급망 이슈 시기에 도입량이 달라졌는지를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전사 연료 실적이나 연료가격 자료와는 년월과 연료명을 이름 매핑해 맞춰 이어 쓴다.
description_portal: 한국서부발전 연료도입 현황 정보입니다. 한국서부발전의 연료 도실적 데이터는 발전소 운영에 필요한 주요 연료의 월별 및 연도별 도입 현황을 기록한 자료로, 안정적인 전력 생산을 위한 연료 수급 구조를 보여줍니다. 이 데이터는 년월,자재번호,수량(톤),단위,연료명등이 포함됩니다. 또한 발전소별 투입 계획과 실제 도입 실적을 비교해 수급 안정성을 평가할 수 있으며, 국제 연료 가격 변동이나 공급망 이슈에 따른 영향을 정량적으로 파악할 수 있습니다.- 데이터 예) 2021-01,10011,112169,MT,유연탄
