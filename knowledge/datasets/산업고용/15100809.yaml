summary_user: 경기도경제과학진흥원이 선정한 도내 우수 여성기업을 기업 한 곳당 한 행으로 담은 경기도 범위의 선정 현황이며, 기업명·대표자·시군·본사 주소·홈페이지·업종·업태·주요 생산품·설립일을 포함한다(포털 설명상 업력 3년 이상 기업 중 5개사 선정). 정책 담당자나 분석가가 "경기도 우수 여성기업은 어느 시군·업종에 몰려 있고 업력은 얼마나 되나"를 확인하거나, 여성기업 지원사업 대상과 롤모델 기업을 찾을 때 쓴다. 명세에 사업자등록번호(bizregno) 필드가 있어 벤처·이노비즈 등 다른 기업 확인·인증 원장과 기업 단위로 맞춰 볼 여지가 있으나, 실측에서는 전역 조인 키가 확인되지 않아 기업명·시군명 매칭으로 연결해야 할 수 있다.
description_portal: '경기도경제과학진흥원에서 인증한 우수 여성 기업 선정 현황 입니다.‘홈페이지주소’를 통해 각 기업의 온라인 정보 접근이 가능하며, 기업의 주요 사업영역 및 생산활동 내용과 기업의 업력을 확인할 수 있는 정보가 포함됩니다. 본 데이터는 경기도 내 여성 창업 및 기업 활동 현황을 파악하고, 여성기업 대상 지원정책 수립, 우수기업 홍보 및 롤모델 제시, 산업별 여성기업 분포 및 성장 가능성 분석 등에 활용될 수 있으며, 여성기업 성장지원 사업의 기초자료로도 활용됩니다.※ 우수 여성 기업 : 도내 소재 여성기업 중 업력 3년 이상인 기업(단, 우수창업가 분야는 3~7년 이내 기업)중에서 5개사를 선정'
