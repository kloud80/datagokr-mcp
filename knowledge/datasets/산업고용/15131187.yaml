description_portal: '한국산업기술진흥원이 수행한 다양한 사업(과제) 중에서 취득한 인증취득심사 성과 내용을 제공합니다. 이 데이터는 인증을 취득한 기관 및 인증명, 그리고 해당 기술의 제품에 대한 정보를 포함하고 있습니다. 각 기관은 다양한 기술 연관 제품의 인증을 통해 그 신뢰성과 품질을 인정받고 있으며, 이 데이터를 통해 특정 기관의 인증 획득 내역을 확인할 수 있습니다. 이를 활용하여 기업들은 자사의 기술력과 경쟁력을 더욱 강조할 수 있으며, 연구 기관이나 정부는 산업 기술의 발전 상황을 모니터링하고 정책 수립에 활용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형) : 성과가 발생한 연도번호(숫자형) : 데이터 항목의 고유 번호기관명(문자형) : 인증을 취득한 기관의 이름취득심사연도(숫자형) : 인증을 취득한 연도인증명(문자형) : 취득한 인증의 이름인증번호(문자형) : 인증 고유 번호해당기술제품명(문자형) : 인증이 부여된 기술의 제품 이름인증기관(문자형) : 인증을 수행한 기관의 이름'
