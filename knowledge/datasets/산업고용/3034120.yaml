description_portal: 한국언론진흥재단이 2010년부터 매년 시행하는 신문산업 실태조사는 문화체육관광부 정기간행물 리스트를 기반으로 발행이 확인된 신문 사업체를 모집단으로 하며, 전수 조사 및 모집단 추정 모델 방식으로 진행됩니다. 이 조사는 국내 언론 사업체의 현황을 체계적으로 파악하고 이를 토대로 언론 산업 진흥 정책을 수립하는 데 필요한 기초 자료를 제공하는 데 그 목적이 있으며, 2012년부터 통계청 국가승인통계로 지정됐습니다. 신문산업의 규모, 매출액, 종사자 수 등 기초 통계와 더불어 매체 운영과 관련된 다양한 조사 결과를 확인해볼 수 있습니다. 이 자료는 언론산업통계 언론산업 사업체 수 및 종사자 수 관련 데이터입니다. 자세한 내용은 재단 홈페이지에서 확인 부탁드립니다.
