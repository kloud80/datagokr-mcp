description_portal: '한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 목록은 한국전력거래소_발전원별 발전량 현황조회에 대한 데이터로 총 수요(추계) 데이터를 제공합니다.※ 해당 자료는 육지와 제주를 포함한 데이터 입니다.ㅇ 아래 정보를 확인하실 수 있습니다. 수력(fuelPwr1, 단위 : MW), 유류(fuelPwr2, 단위: MW), 유연탄(fuelPwr3, 단위: MW), 원자력(fuelPwr4, 단위: MW), 양수(fuelPwr5, 단위: MW), 가스(fuelPwr6, 단위: MW), 국내탄(fuelPwr7, 단위: MW), 태양광(시장)(fuelPwr8, 단위: MW), 풍력(fuelPwr9, 단위: MW), 신재생(fuelPwr10, 단위: MW), ppa 추정(pEsmw, 단위: MW), btm 추정(bEmsw, 단위: MW), 시장수요(현재)(fuelPwrTot, 단위: MW)'
