summary_user: 서울 용산구에 개설·이전 신고된 건축사사무소를 사무소 한 곳당 한 행으로 담은 파일(csv, 약 11KB)로, 신고구분·사무소명·도로명주소·전화번호를 담는다. 용산구에서 설계나 건축 인허가를 맡길 구민이 신고된 건축사사무소인지 확인하고 연락처를 찾거나, 업계·분석가가 구 안의 건축사사무소 분포를 보는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 사무소명·도로명주소를 맞춰 보거나 같은 지방행정 인허가(LOCALDATA) 원장 계열 자료와 이름 기준으로 이어 쓴다.
description_portal: 서울특별시 용산구 건축사사무소개설신고 현황(건축사사무소개설 신고구분, 사무소명, 도로명주소, 전화번호)에 대한 데이터를 제공합니다.본 데이터는 서울특별시 용산구에 개설 신고된 건축사사무소 현황을 제공한다. 「건축사법」 제23조에 의거하여 건축사사무소의 개설 또는 이전 시 용산구에 신고하도록 되어 있으며, 본 데이터는 이러한 신고 정보를 바탕으로 구축되었다. 주요 정보는 건축사사무소의 명칭, 대표자명, 주소 등으로 구성된다. 용산구는 투명한 건축 행정 구현과 건전한 건축 시장 조성을 위해 본 데이터를 개방한다. 건축 관련 업무를 진행하려는 구민들은 본 데이터를 활용하여 합법적으로 등록된 건축사사무소를 확인하고 선택할 수 있다. 또한, 건축 관련 업계 종사자들은 시장 동향 파악 및 협업을 위한 정보를 얻을 수 있다. 본 데이터는 건축 관련 정책 수립의 기초 자료로 활용될 수 있으며, 건축 서비스의 질 향상 및 불법 건축 행위 예방에 기여할 것으로 기대한다. 용산구는 정기적으로 데이터를 갱신하여 최신 정보를 유지하며, 구민들의 건축 관련 편의를 증진하는 데 노력할 것이다.
