summary_user: 경상북도 김천시가 허가한 태양광 발전사업을 허가 건별로 담은 파일로, 상호·설치장소 주소·영업구분·원동력 종류·설비용량·공급전압·주파수·허가일자를 담는다. 김천시에 태양광 발전소가 어디에 얼마나 들어섰는지, 허가 시기별로 설비용량이 어떻게 늘었는지 보려는 발전사업 투자자·지역 에너지 분석가가 쓴다. 전역 조인 키가 없어 설치장소 주소나 상호로 맞춰 이어 쓰며, 전국태양광발전소전기사업허가정보 표준데이터와는 발전소 단위 주소·용량으로 대조한다.
description_portal: 경상북도 김천시 태양광 발전 허가 현황으로 상호명, 설치장소소재지, 영업구분, 설비용량(KW), 공급전압(V), 주파수(Hz), 허가일자 정보를 제공합니다.발전사업 현황 분석과 관리에 유용하게 활용가능하며 본자료는 신재생에너지 정책수립, 에너지수급계획, 대기질 및 환경영향 분석, 발전사업 투자검토, 관련제도 개선등 공공행정 및 민간연구에 필수적인 근거자료로 활용될 수 있습니다. 발전사업에 참고자료로 활용가능하며  변동사항이 있을 수 있으니 정확한 사항은 김천시청 일자리경제과로 확인하시기 바랍니다.
