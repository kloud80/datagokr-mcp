description_portal: 규모별 고용장려금 지급현황은 장애인의 고용촉진 및 고용안정을 도모하기 위해 장애인 의무고용률(민간기업 3.1%, 공공기관 및 지방공기업 3.8%)을 초과하여 장애인을 고용한 사업주에게 지급하는 장려금에 대한 데이터입니다. 장애인 고용장려금은 의무고용률을 초과하여 장애인을 고용한 사업주가 신청할 수 있으며 사업체 본사 소재지를 관할하는 공단 지역본부 및 지사에 신청해야 합니다. 규모별 고용장려금 지급현황은 고용장려금을 지급받은 사업체의 규모별(5인 미만, 5~30인 미만, 30~50인 미만, 50~100인 미만, 100~300인 미만, 300~500인 미만, 500~1000인 미만, 1000인 이상)데이터를 사업체수, 지원금액, 지급연인원, 지급순인원의 형태로 제공합니다. 해당 데이터의 업데이트 주기는 연간입니다.
