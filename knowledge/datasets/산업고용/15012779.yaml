description_portal: 이 데이터는 한국남부발전이 운영하는 풍력발전소의 풍황계측기 설치 현황을 정리한 자료입니다. 발전소별 준공년도, 발전소명, 설비용량(MW), 위치, 추진현황 등이 포함되어 있으며, 사용 후 철거된 계측기 정보까지 확인할 수 있습니다. 풍황계측기는 바람의 세기와 방향, 기상 조건 등을 측정하여 풍력발전소 설계와 운영에 필수적인 자료를 제공합니다. 본 자료를 통해 각 지역 풍력발전소의 풍황 계측 활동과 운영 현황을 파악할 수 있으며, 재생에너지 발전 가능성 평가와 기후자원 분석에 활용할 수 있습니다. 또한 풍력발전 사업의 경제성 검토 및 향후 신규 사업 부지 발굴에도 중요한 기초자료로 사용될 수 있는 데이터입니다.
