summary_user: 한국서부발전이 추진한 태양광·풍력·연료전지 등 신재생에너지 사업을 사업 한 건당 한 행으로 담은 소규모 파일(csv 약 4KB)로, 에너지원·사업명·설비용량(MW)·준공일자·소재지를 기록한다. 분석가나 지역 주민이 '서부발전이 어느 지역에 어떤 신재생 설비를 몇 MW 규모로 언제 준공했는가'를 확인하거나 에너지원별 용량을 합산하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 전국태양광발전소전기사업허가정보 표준데이터 등 다른 발전소 원장과는 사업명·소재지 주소를 이름으로 맞춰 연결해야 한다.
limits: 사업 코드나 발전소 고유번호 같은 공통 키가 없어 다른 설비·허가 데이터와 자동으로 결합되지 않고, 이름·주소 매칭에 의존한다. 한 기관의 사업 목록이라 전국 신재생 설비 현황을 대표하지 않는다.
