description_portal: 정부법무공단은 공공기관의 중소기업제품 구매 촉진 및 판로 지원에 관한 법률에 따라 중소기업 생산품의 구매 실적을 관리하고 있습니다. 이에 따라 우리 공단은 매년 정부 및 유관기관의 정책 목표에 부합하도록 전체 물품 구매액 중 중소기업에서 생산한 제품의 구매 비율을 산정하고 있으며, 이를 통해 의무구매비율 달성 여부를 점검하고 있습니다. 해당 데이터는 2018년부터 현재까지 연도별로 집계하고 있으며, 연 1회 이상 최신 실적으로 업데이트됩니다. 집계된 자료는 총 구매액 대비 중소기업 생산품의 구매 실적을 기반으로 하며, 공단에서 운영 중인 물품을 대상으로 각 연도별로 정리된 통계 형식의 데이터 파일로 제공됩니다. 또한 이와는 별도로, 공공기관 경영정보 공개시스템(알리오)을 통해 분기별 구매 실적을 기준으로 한 통계도 별도로 산출하여 비교·분석 자료로 활용하고 있습니다. 본 데이터는 공단의 중소기업 지원 이행 현황을 외부에 투명하게 공개하고, 정책 수립 및 경영 평가 등에도 활용될 수 있도록 제공하는 공공 통계 자료입니다.
