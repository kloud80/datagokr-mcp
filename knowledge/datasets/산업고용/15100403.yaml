description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 ~20260630 까지의 제주 일별 시간대별 연계선 수전전력(HVDC) 정보를 제공합니다.ㅇ 제주-완도 3연계선 완공에 따라 해당 데이터가 추가되었습니다. (20250122) ㅇ 제주 일별 시간대별 연계선 수전전력(HVDC)을 보여주는 자료입니다.ㅇ 구분 : HVDC #1(제주~해남), HVDC #2(제주~진도), HVDC #3(제주~완도)(단위 : MW)ㅇ 한국전력거래소_제주 일별 시간대별 연계선 수전전력(HVDC)_20221231 이전 데이터의 단위는 kw 입니다.'
