summary_user: 워크넷(고용24)에서 고용센터 등록 공고와 별도로 기업이 공개채용으로 진행하는 공채속보를 공고 단위로 담으며, 범위는 전국(비공간)이다. 구직자가 지금 접수 중인 대기업·공기업 공채의 채용제목, 기업구분, 접수 시작·마감일, 고용형태를 확인하거나, 분석가가 공채 공고의 시기별 분포를 살피는 데 쓴다. 전역 조인 키는 없으며, 목록의 채용공고순번(empSeqno)으로 상세정보를 다시 조회하고 다른 데이터와는 기업명 등 이름 매칭으로만 잇는다.
description_portal: '[채용정보 API - 공채속보 및 상세정보]공채속보 API를 이용하여 빠르게 공채속보를 확인 할 수 있습니다.   워크넷의 정보 중 고용센터에서 등록되는 정보와는 별개로 기업에서 공개 채용을 통하여 진행되는 채용 정보들을 제공합니다. <API 사용법>인증키, 반환형식, 호출유형, 채용공고순번, 자기소개서제공여부, 전형단계제공여부, 모집공고제공여부 등을 파라미터로 받아,채용기업번호, 채용제목, 채용업체명, 기업구분명, 채용시작일자, 채용종료일자, 고용형태, 제출서류, 접수방법, 합격자발표일, 문의사항, 기타사항 등의 결과를 제공합니다.  * 유의사항:  문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
