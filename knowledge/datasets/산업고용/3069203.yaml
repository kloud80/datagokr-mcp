summary_user: 경상남도 합천군 관내 기업체를 한 업체당 한 행으로 담은 목록 파일로, 회사명·대표자명·공장 주소·전화번호·생산품을 포함하며 포털 설명상 기준일은 2020년 9월 21일이다. 합천군에서 특정 품목을 생산하는 업체가 어디에 있고 연락처가 무엇인지 찾는 사업자나, 군내 기업 분포와 주요 생산품을 살피는 지역경제 분석가가 쓴다. 전역 조인 키(사업자등록번호·법인번호 등)가 없어 다른 기업 데이터와는 회사명이나 공장 주소를 맞춰 이어야 한다.
description_portal: 해당 자료는 경상남도 합천군 기업체 현황에 관한 자료입니다.본 데이터는 경상남도 합천군의 기업체 회사명, 대표자명, 공장대표 주소, 전화번호, 생산품 등의 데이터를 포함합니다.현황 자료를 통하여 합천군 내 기업의 분포와 주요 생산 품목을 파악하는 데 활용할 수 있으며, 이 자료를 통하여 합천군 산업 현황 및 경제활동을 이해하고, 지방자치단체에서 기업 지원 정책 수립과 지역 경제 활성화를 위한 기초자료로 활용할 수 있습니다.기업체 현황 집계 자료의 데이터 기준일은 2020년 9월 21일 입니다.
