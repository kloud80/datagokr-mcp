description_portal: 'KPX교육연구원은 전력시장 및 전력계통의 안정적 운영과 업무발전을 위한 교육업무를 전담하고 있습니다. 에너지신산업, 에너지 전환시대를 대비한 다양한 교육과정을 운영하며, 전력산업 환경변화에 대응한 교육과정을 적극 개발∙운영함으로써 ‘친환경 미래를 선도하는 전력 비즈니스 융합 플랫폼’ 구현에 적극 노력하는 한국전력거래소의 교육전문 연구원입니다.ㅇ24년의 교육설문 및 문항별 사용자의 설문응답 결과를 제공합니다.ㅇ 해당목록은 사용자의 아이디를 비식별 조치하여 제공한 가명처리 데이터입니다.__생성 및 수집목적__KPX 교육 연구원의 개설과정별 사용자들의 성취도와 만족도를 분석하기 위해 생성되었으며, 더 나은 교육제공을 위해 데이터를 수집하고 있습니다.사용자 아이디는 식별되지 않도록 비식별화하여 제공합니다.__활용성__교육설문별 설문문항, 설문응답을 제공합니다.문항별 수강생들의 답변을 통해 교육수강생들의 업종, 직무등 조사내용 파악에 활용 가능합니다.출처 :  KPX 교육연구원'
