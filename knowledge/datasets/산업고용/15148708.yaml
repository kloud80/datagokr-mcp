summary_user: 고용24에 신고·관리되는 국외 직업소개소 현황을 소개소 한 곳당 한 행으로 담은 전국 단위 파일로, 소개소명·유료/무료 여부·구분만 들어 있고 주소 같은 위치 정보는 없다. 해외 취업을 알아보는 구직자나 상담 기관이 '이 업체가 신고된 국외 직업소개소인지, 유료인지 무료인지'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 고용 서비스 기관 데이터와는 소개소명 문자열을 맞춰서만 이어 쓸 수 있다.
limits: 표준 조인 키가 없어 사업자등록번호나 기관 코드로 다른 데이터와 정확히 연결할 수 없고, 이름 매칭에 기대야 한다. 공간 정보가 없는 전국 단위 자료라 지역별 분포는 알 수 없다. 포털 설명은 국내외 소개소를 표방하지만 실제 등록 자료는 국외 직업소개소 현황이다.
