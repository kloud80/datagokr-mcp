description_portal: 고용24에 관리되고 있는 국내외 직업소개소 정보입니다. 각 직업소개소는 직업안정법에 따라 신고 및 관리되고 있습니다.  등록된 자료는 국외 직업소개소 현황 자료입니다. *직업안정법 제18조제1항*제18조(무료직업소개사업) ① 무료직업소개사업은 소개대상이 되는 근로자가 취업하려는 장소를 기준으로 하여 국내 무료직업소개사업과 국외 무료직업소개사업으로 구분하되, 국내 무료직업소개사업을 하려는 자는 주된 사업소의 소재지를 관할하는 특별자치도지사･시장･군수 및 구청장에게 신고하여야 하고, 국외 무료직업소개사업을 하려는 자는 고용노동부장관에게 신고하여야 한다. 신고한 사항을 변경하려는 경우에도 또한 같다.
