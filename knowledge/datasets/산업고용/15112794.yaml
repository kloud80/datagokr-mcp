summary_user: 논산시 관내 태양광 발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 발전소명·설비용량(kW)·설치 주소·허가일·사업개시일·영업구분(자가용·판매용 등)을 담는다. 분석가나 지역 주민이 '논산시 어느 지역에 어떤 규모의 태양광 발전소가 언제부터 가동 중인가'를 확인하거나 신재생 보급 추이를 집계할 때 쓴다. 전역 조인 키는 없어서 전국태양광발전소전기사업허가정보표준데이터 같은 다른 자료와는 발전소명·설치 주소를 맞춰 대조하는 방식으로만 잇는다.
