description_portal: 한국원자력통제기술원(KINAC)에서 주관하는 원자력통제교육 이수 현황에 대한 한국수력원자력㈜의 공개 데이터는 핵연료주기 연구책임자 분야와 특정핵물질의 계량관리 분야를 대상으로 직원들의 교육 이수 현황을 정리한 자료입니다. 이 정보는 반기별로 제공되며, 소속, 부서명, 직위, 성명, 교육분야, 교육구분, 교육일정, 담당업무 항목으로 구성되어 있습니다. 특히 개인정보 보호를 위해 이수자 성명은 비식별화를 적용하여 일부 문자를 ‘*’ 처리한 형태로 공개됩니다. 이 데이터를 통해 한국수력원자력㈜ 직원들의 원자력 안전과 보안 역량 강화를 위한 교육 참여 현황을 확인할 수 있으며, 기관의 안전관리 체계 및 전문인력 양성 노력을 객관적으로 파악할 수 있는 근거 자료로 활용될 수 있습니다.
