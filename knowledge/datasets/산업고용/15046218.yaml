description_portal: '한국장애인고용공단에서 실시하는 직업능력평가 도구 중 다차원양손협응검사의  평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 수행도 등에 대한 정보를 제공합니다.* KEAD 다차원 양손협응검사: 양손과 양팔을 동시에 사용하는 대근육 작업을 중점으로 다양한 형태의 부품(기둥, 볼트와 너트, 판, 연결핀)을 조립하여, 입체구조물을 완성하는 능력을 평가하기 위한 검사도구로, 15~55세까지의 비장애인과 장애인을 대상으로 하며 검사 소요시간은 약 10분 내외임. 장애인의 양손·양팔 작업능력을 평가하여 현재 작업수행수준을 평가하고, 향후 직업능력을 예측하는데 활용함'
