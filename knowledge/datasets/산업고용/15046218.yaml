summary_user: 한국장애인고용공단이 실시한 다차원양손협응검사(양손·양팔로 부품을 조립해 입체구조물을 완성하는 검사)의 결과를 검사 1건 단위로 담은 CSV 파일(약 143KB)로, 검사일자·소요시간·장애유형·우세손과 비장애인·장애인 전체 및 성별 대비 백분위, 원통결합·볼트·너트·판·고정핀 등 부품별 수행 결과를 담는다. 직업재활 실무자나 연구자가 '장애유형별로 양손 협응 작업 수행도와 소요시간이 어떻게 다른가'를 살펴보는 데 쓴다. 다른 데이터와 잇는 전역 조인 키가 없어, 장애유형 같은 항목을 이름으로 맞추거나 같은 기관의 다른 직업능력평가 데이터와 나란히 비교하는 방식으로만 이어 쓴다.
