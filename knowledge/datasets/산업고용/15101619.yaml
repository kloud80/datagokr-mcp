summary_user: 한국수력원자력이 운영하는 수력발전소 7곳과 양수발전소 7곳, 총 14개 발전소별로 설비용량(MW)과 2017~2025년 연도별 이용률(설비용량 대비 실제 발전에 쓰인 비율)을 담은 집계 파일입니다. 에너지 분석가나 연구자가 특정 수력·양수발전소의 이용률이 해마다 어떻게 변했는지, 양수발전이 전력계통에 얼마나 기여하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전량·설비 데이터와는 발전소명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 수력양수 이용률 데이터는 한국수력원자력(주)에서 보유하고 있는 전국에 분포한 7개 수력발전소(화천, 춘천, 의암, 청평, 팔당, 강릉 및 칠보) 및 7개 양수발전소(청평, 삼랑진, 무주, 산청, 양양, 청송 및 예천), 총 14개 발전소별로 전체 설비용량 대비 실제 발전에 사용된 비율을 나타낸 데이터입니다. 수력양수 이용률은 연간 발전소별 발전량과 실제 운전시간 데이터를 근거로 하여 산출식에 의해 계산된 관련 자료 항목을 제공합니다. 이용률 자료를 통해 수력양수발전소가 전력계통에 기여하고 있는 정도를 확인 할 수 있습니다.
