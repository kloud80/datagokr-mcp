summary_user: 안동시 안의 담배소매인 지정 업소를 한 행씩 담은 파일(csv 약 81KB)로, 업소명·지번/도로명 주소·지정일자·민원구분·데이터기준일자를 담는다. 사업자나 분석가가 "안동시 어느 동네에 담배 소매점이 몰려 있고, 언제 지정됐나"를 확인하거나 새 소매인 지정 전 주변 업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 업소 주소를 기준으로 지오코딩하거나 업소명·주소 매칭으로 LOCALDATA 담배소매업 인허가 원장이나 소상공인 상가업소 정보와 이어 쓴다.
description_portal: 해당 데이터는 경상북도 안동시 내 담배 소매인 업소에 대한 관리 현황을 담고 있다. 주요 항목으로는 각 업소의 관리번호, 업소명, 업소 주소, 지정일자, 데이터 기준일 등이 포함된다. 이 자료는 안동시 내 담배 판매업소들의 등록 및 운영 상태를 체계적으로 파악할 수 있게 하며, 담배 소매업소의 분포와 운영 현황을 분석하는 데 유용하다. 또한, 정책적 차원에서 담배의 유통 관리, 규제 및 세금 정책 수립, 공공보건을 위한 관리 체계 강화 등에 중요한 기초 자료로 활용될 수 있다. 이를 통해 담배 관련 법규 준수 여부와 유통의 효율성을 높이는 데 기여할 수 있다.
