description_portal: 한국가스공사 평택기지본부 월별 역률 데이터 입니다.2016년 1월 부터 2025년 11월까지의 지상역률과 진상역률 데이터 입니다. 역률이란 교류 전기회로에서 공급된 전체 전력(피상전력) 대비 실제로 일을 하는 데 사용되는 유효전력의 비율을 뜻하며 지상 역률(Lagging Power Factor)은 유도성 부하(모터 등)에서 전류가 전압보다 위상이 뒤처지는 현상이고, 진상 역률(Leading Power Factor)은 용량성 부하(콘덴서 등)에서 전류가 전압보다 위상이 앞서는 현상입니다. 한국가스공사 평택기지는 효율적 전력관리를 통하여 역률 값을 관리하고 있습니다.
