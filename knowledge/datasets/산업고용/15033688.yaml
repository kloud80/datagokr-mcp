description_portal: 강원특별자치도 내 가스사업자에 관한 상세한 정보를 제공합니다. 시도명과 시군구명, 그리고 사업자의 구분 항목이 포함되어 있으며, 고압가스 제조업체, 고압가스 저장업체, LPG 판매 및 충전업체, 그 외 기타 관련 사업자 등이 있습니다. 또한 업체명과 취급 품목에 대해서도 액화석유가스, 프레온가스, 질소, 암모니아, 수소, 산소 등 다양한 가스 종류별로 구체적인 데이터를 제공합니다. 허가일자, 연락처, 그리고 사업장의  소재지(도로명주소) 정보도 포함되어 있습니다. 또한 각 사업장의 위치를 나타내는 위도와 경도 정보까지 함께 수록되습니다.
