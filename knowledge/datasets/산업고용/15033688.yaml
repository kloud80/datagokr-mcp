summary_user: 강원특별자치도 내 가스사업자(고압가스 제조·저장, LPG 판매·충전 등)를 업체 한 곳당 한 행으로 담은 파일 목록으로, 시군구·구분·업체명·취급 가스 품목·허가일자·연락처·도로명주소·위경도를 포함한다. 강원도에서 수소·산소·LPG 같은 특정 가스를 다루는 허가 업체가 어느 시군에 있는지 찾거나, 가스시설 안전 점검 대상을 지도에 표시하려는 지자체 담당자·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·업체명 같은 이름 매칭이나 위경도 좌표로만 붙일 수 있으며, 같은 세부 부문의 LOCALDATA 에너지 업종 인허가 원장과 대조해 쓰는 용도가 적합하다.
limits: 표준 코드(사업자번호·행정코드 등) 조인 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름 표기 차이에 주의해야 한다. 범위는 강원특별자치도 한 시도에 한정되므로 전국 비교에는 다른 시도 자료나 LOCALDATA 원장이 따로 필요하다.
