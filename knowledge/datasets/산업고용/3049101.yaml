summary_user: 2012년 이후 광업권에 대한 행정처분(의무 불이행에 따른 등록취소·소멸등록, 취소 전 청문, 개발의무 이행촉구) 공고를 광업권 등록번호별 건 단위로 담은 전국 범위 파일 데이터다. 광업권자나 광산 투자·인수 검토자가 특정 광구(소재지·지적·호수)의 광업권이 취소·소멸되었거나 이행촉구를 받은 이력이 있는지 확인하는 데 쓴다. 전역 조인 키는 없어서 광업권 등록번호나 소재지·지적 같은 이름·주소 매핑으로 광업권 원부나 토석채취·채석단지 허가 자료와 이어 쓴다.
description_portal: 광업권 행정처분 현황 공공데이터는 2012년 이후 광업법 제35조의 규정에 따른 의무사항이 이행되지 아니한 광업권의 등록취소 및 소멸등록, 광업법 제35조의 규정에 따른 광업권 취소처분에 앞서 광업법 제99조 및 행정절차법 제21조 등 관련 규정에 따른 청문 실시, 광업법에 규정된 제반 의무이행 사항을 숙지하지 못하여 광업권자가 받게 될 불이익을 사전에 예방하고자 광업법 시행령 제68조 규정에 따른 개발의무 이행촉구 현황에 대한 데이터로 공고구분, 광업권분류, 등록번호 등의 항목을 제공합니다.
