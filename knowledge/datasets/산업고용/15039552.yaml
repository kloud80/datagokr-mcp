summary_user: 한국전력공사 전기차충전서비스시스템이 관리하는 아파트형 전기차 충전기의 계시별 충전 단가를 충전구분(완속·급속)과 계절별로 나누어 경부하·중간부하·최대부하 단가로 담은 398바이트 분량의 작은 전국 단위 단가표입니다. 아파트 관리주체나 충전사업자가 "우리 단지 완속 충전기의 여름철 최대부하 시간대 요금은 한전 기준으로 얼마인가"를 확인하고 요금 정책을 세우거나 다른 충전요금과 비교할 때 쓴다. 전역 조인 키가 없어 충전소 위치·상태 데이터와 직접 결합되지 않으며, 충전구분·계절구분 같은 이름을 기준으로 다른 요금표나 충전 이력 데이터에 매핑해 쓴다.
