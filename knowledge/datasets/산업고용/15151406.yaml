summary_user: 국내 가맹사업(프랜차이즈) 가맹점 매출 총액을 기준연도·시도별로 묶은 집계 통계로, 범위는 전국 시도 단위이며 좌표 같은 공간 정보는 없다. 창업 희망자나 지역 정책 담당자가 "어느 시도의 프랜차이즈 매출 규모가 크고, 해마다 어떻게 변했나"를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 시도코드(sido_cd)나 시도명을 다른 시도 단위 통계와 이름·코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 국내 가맹사업의 연도별, 시도별 매출 규모를 나타낸 통계 자료입니다. 구성 항목은 "기준연도", "시도코드", "시도명", "매출금액"이며, 각각 매출 발생 연도, 지역 식별을 위한 코드, 시도 행정명칭, 해당 시도의 가맹점 매출 총액을 의미합니다. 이 데이터는 프랜차이즈 시장의 지역별 성장 현황을 분석하고, 창업 수요자의 지역 선택 판단에 도움을 줄 수 있으며, 지역 상권의 경제 규모 추정에도 활용 가능합니다. 또한 시도별 가맹사업 정책 수립, 투자 유치 전략 수립, 소상공인 지원 정책 평가 등에 필요한 기초자료로 사용될 수 있습니다. 연도별 데이터를 포함하고 있어 시간에 따른 매출 추세 및 변화를 분석하는 데 유용합니다.
