description_portal: 한국가스공사 공급본부 산하 지역본부 및 지사의 전기차 충전설비 설치 현황 데이터 입니다. 전기차 충전 인프라는 친환경 교통수단 확산의 필수 요소로서, 공사의 ESG 경영 실천과 탄소중립 실현에 기여하는 친환경 인프라입니다. 본 데이터는 전기차 충전 인프라 현황 파악 및 확충 계획 수립을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 지역본부명, 지사명, 주차면수, 전기차 충전설비 수, 설치 비율(%) 등이 포함되어 있습니다. 본 데이터를 활용하면 전국 사업장별 충전 인프라 현황 파악, 충전설비 확충 우선순위 결정, 민간기업 및 수요처 정보 제공, 친환경 경영 성과 평가 및 ESG 보고에 기초자료로 활용할 수 있어 전기차 충전 인프라 확대와 국민 편익 증진에 기여할 것으로 기대됩니다.
