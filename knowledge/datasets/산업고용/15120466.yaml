description_portal: 경력단절여성등의 경제활동 촉진법 제13조 제1항과 관련하여 e새일의 직업교육 및 직업훈련과정의 직종 코드 정보를 제공하는 오픈 API형 데이터입니다. 해당 개방데이터는 대분류와 중분류로 나뉘어져 있으며 대분류 및 중분류의 코드와 명칭, 코드값, 예시 직종 정보를 확인할 수 있습니다.경력단절여성 대상 직업교육 및 직업훈련 과정의 체계적인 분류와 관리를 가능하게 하여 교육 과정의 표준화 및 효율적인 운영에 기여하며, 데이터 기반의 정책 수립과 수요 맞춤형 프로그램 개발에도 효과적으로 활용될 수 있습니다.
