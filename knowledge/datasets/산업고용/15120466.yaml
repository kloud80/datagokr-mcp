summary_user: e새일(경력단절여성 대상 직업교육·직업훈련)의 훈련 직종 분류를 대분류와 중분류 단위로 코드와 명칭으로 담은 전국 단위 코드표 API이다. 경력단절여성 훈련과정을 다루는 분석가나 개발자가 '이 훈련과정의 직종 코드는 어떤 분야에 속하는가'를 풀어 쓸 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관(e새일)의 훈련과정 데이터에 있는 직종 코드(대분류코드·중분류코드)나 이름 매칭으로만 이어 쓴다.
limits: 훈련과정·수강생·개설 현황 같은 실적은 담지 않고 분류 코드만 담으며, NCS·KECO 같은 다른 직업분류와 직접 연결되는 키가 없다. 한 번 만들어진 뒤 바뀌지 않는 이벤트성 데이터로 분류되어 있어 수시 갱신을 기대하기 어렵다.
