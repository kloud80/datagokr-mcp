description_portal: '한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.해당 목록은 5분 단위 발전원별 발전량을 조회할 수 있는 서비스입니다.fuelPwr1 : 수력, fuelPwr2 : 유류, fuelPwr3:유연탄, fuelPwr4 : 원자력, fuelPwr5 : 양수, fuelPwr6: 가스, fuelPwr7:국내탄, fuelPwr8 : 신재생, fuelPwr9:태양광※ 해당 자료는 데이터 스케일, 취득 상황 등에 따라 일부 차이가 발생할 수 있으니 참고용으로만 사용하시길 바랍니다.※ 해당 자료는 육지+제주 데이터 입니다.'
