description_portal: '한국지역난방공사의 사업장별 환경경영시스템(ISO 14001) 인증 현황을 정리한 데이터로, 각 사업장의 인증번호, 인증범위, 유효기간 등을 통해 환경경영체계 구축 수준과 지속가능경영 실천 현황을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 사업장명: 인증을 받은 사업장 또는 본사·지사 구분(예시: 본사, 지사)■ 인증번호: 부여된 환경경영시스템 인증 식별번호(예시: EMS-0213)■ 환경경영시스템인정규격명: 인증받은 국제표준 규격명(예시: KS I ISO 14001:2015)■ 인증범위: 환경경영시스템이 적용되는 사업 활동의 범위(예시: 지역 냉난방 및 전력의 생산, 공급 및 부가서비스)■ 유효기간(시작): 인증 효력 시작일(예시: 2020-12-18)■ 유효기간(종료): 인증 효력 만료일(예시: 2023-12-17)■ 인증일: 인증이 최초 발급된 일자(예시: 2020-11-04)3. 활용 예제:■ 공공기관의 환경경영시스템 인증 현황을 분석하여 지속가능경영 및 ESG 평가 지표로 활용■ 인증 유효기간 관리 및 갱신 일정을 기반으로 환경경영 성과 모니터링 체계 구축■ 사업장별 인증 적용 범위를 바탕으로 환경 목표 설정, 내부 감사 및 정책 개선 근거자료로 활용'
