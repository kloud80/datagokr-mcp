description_portal: 중소벤처기업진흥공단이 경영애로 기업 대상으로 지원하는 컨설팅 프로그램인 진로제시컨설팅의 지역 별 지원 실적 현황 자료입니다.("13~"25년 8월)진로제시컨설팅을 수혜받은 기업들을 권역 별로 추출하여 연도별 지원기업 수를 확인할 수 있는 데이터입니다.25년 자료의 경우 데이터 업데이트 직전 월인 08월까지의 지원 실적이오니 데이터 활용 시 참고 부탁 드립니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.
