summary_user: 광주광역시 관내에 자동차관리법에 따라 등록된 자동차종합정비업 사업자를 사업장 한 곳당 한 행으로 담은 등록현황 파일로, 2025년 12월 31일 기준 209개소의 정비형태·상호·주소(도로명 또는 구주소)가 들어 있다. 차주가 가까운 종합정비공장을 찾거나, 분석가가 자치구별로 종합정비업소가 어떻게 분포하는지 파악하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 같은 기관이 따로 올린 소형·전문정비업 현황과는 정비형태 항목으로 합치고, 다른 데이터와는 상호명이나 주소를 맞춰 잇는다.
description_portal: '광주광역시 관내 자동차"종합"정비업 등록현황입니다.자동차관리법에 따라 등록된 자동차관리사업자 중 자동차종합정비업 등록현황 자료이며, 각 사업자별 정비형태, 상호명, 사업자주소(소재지 도로명 또는 구주소) 항목을 제공합니다.* 정비형태 구분 : 종합,소형,전문정비업(각 정비형태 구분별로 공공데이터가 별도 등록되어 있습니다.)* 등록기준일 : 2025년 12월 31일* 등록사업자 수 : 총 209개소* 자동차관리사업 등록은 등록소재지 관할 자치구청에서 등록/변경 등이 가능함을 알려드립니다.'
