summary_user: 워크넷(고용24) 공채속보에 올라온 공채기업을 기업 한 곳 단위로 담으며, 목록에서는 회사명·기업구분(대기업·공기업·공공기관·중견기업·외국계)·사업자등록번호·위경도·소개·홈페이지·주요사업을, 상세에서는 복리후생·연혁·인재상까지 제공하고 범위는 전국이다. 구직자나 취업 지원 서비스가 '공채를 진행하는 공기업·대기업은 어디이고 인재상과 복리후생은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 목록과 상세는 채용기업번호(empCoNo)로 잇고 다른 기업 데이터와는 사업자등록번호(busino)나 회사명 매칭으로 연결을 시도해야 한다.
description_portal: '[채용정보 API - 공채기업목록 및 상세정보]공채기업정보 API를 이용하여 보다 정확한 공채기업정보를 확인 할 수 있습니다.워크넷에서 제공하는 공채속보의 기업정보를 서비스로 제공합니다. 목록 및 상세 형태로 제공하고 있으며 공채기업의 목록정보는 워크넷에서도 확인이 가능합니다.<공채기업목록 API 사용법>인증키, 호출할 페이지 타입, xml 지정, 검색 시작위치, 출력건수, 기업 구분코드(대기업, 공기업, 공공기관, 중견기업, 외국계기업), 등록일, 회사명 등을 파라미터로 받아 총건수, 기본값 1, 출력건수, 채용기업번호, 회사명, 기업구분명, 사업자등록번호, 좌표:위도, 좌표:경도, 채용기업로고, 기업소개요약, 기업소개상세, 홈페이지, 주요사업 등의 결과를 제공합니다.<공채기업 상세정보 API 사용법>인증키, 호출할 페이지 타입, xml 지정, 채용기업번호 등을 파라미터로 받아 채용기업번호, 회사명, 기업구분명, 로고, 홈페이지, 사업자등록번호, 좌표:위도, 좌표:경도, 주요사업, 기업소개 요약, 기업소개 상세, 카테고리, 복리후생내용, 연혁년도, 연혁월, 연혁내용, 인재상키워드, 인재상내용 등의 결과를 제공합니다.   * 유의사항:  문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
