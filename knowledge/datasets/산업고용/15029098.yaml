summary_user: 경기도 시군이 허가한 토석채취업체를 업체별로 담은 허가 현황 목록으로, 시군명·업체명·허가기간 시작·종료일·허가면적·채취용도·도로명/지번 주소·위경도를 담는다. 특정 시군에서 어느 업체가 언제까지 어떤 용도로 산지 토석채취 허가를 받았는지, 또는 개발행위 심의·환경 검토 대상지 주변에 채취장이 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 시군명이나 주소로 다른 자료와 맞추고, 위경도(refine_wgs84_lat·logt)로 산지·토지이용 규제 같은 공간 자료와 겹쳐 본다.
description_portal: 이 데이터는 각 지자체에서 허가한 토석채취업체들의 기본 정보를 담고 있으며, 업체명, 허가기간, 허가면적, 채취용도, 위치정보 등을 포함하고 있습니다. 토석채취는 주로 토목 및 건축 자재 공급을 위해 이뤄지며, 해당 자료는 자원 채취에 따른 지역 내 산업 활동 현황을 파악하고, 환경영향 평가나 개발행위 심의 등에 필요한 기초 자료로 활용됩니다. 또한 행정기관의 자원관리 효율화, 건설수요 대응 분석, 환경보호 정책 수립 등의 다양한 목적에 활용될 수 있는 공공 데이터입니다.* 산지 안에서 석재를 굴취ㆍ채취하기위하여 토석채취허가를 취득한 현황입니다.
