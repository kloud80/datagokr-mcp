summary_user: 영광군에서 담배사업법에 따라 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 파일로, 업소명·업소주소·지정일자·구분과 데이터기준일을 담는다. 영광군에서 담배소매점이 어느 지역에 몰려 있는지 확인하려는 지자체·보건기관이나, 신규 지정을 검토하는 사업자가 주변 기존 소매인 현황을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 업소명·주소 문자열 매칭이나 같은 기관 기준으로만 다른 자료와 연결하며, 같은 업종의 지방행정 인허가(LOCALDATA) 원장과 대조할 때도 이 방식을 쓴다.
description_portal: 이 데이터는 영광군 내 담배사업법에 따라 지정된 담배소매인의 명칭, 사업장 주소, 지정일자 등을 포함한 현황자료입니다.담배소매인은 지역 내 담배 제품의 소매 유통을 담당하며, 공중위생 및 유통 질서 유지 측면에서 규제 대상이기도 합니다.본 자료는 지역별 담배 유통망의 구조를 분석하고 신규 지정 또는 폐지 요청 시 기초 자료로 활용할 수 있습니다.특히 청소년 보호, 불법 유통 방지, 소매점 밀집도 조사 등과 관련된 정책 수립 시 유의미한 기준 정보를 제공합니다.사업자, 지자체, 보건기관 등 다양한 이해관계자가 참고할 수 있습니다.
