description_portal: 한국가스공사의 가구·세대 전환비율 데이터 입니다.전환비율은 주민등록세대수를 일반가구수로 나눈 값으로, 통계청의 가구 기반 통계를 주민등록 세대 기반으로 변환하는 데 활용되는 핵심 환산 지표입니다. 본 데이터는 도시가스 수요 전망 및 보급률 산정을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연도별 일반가구수, 주민등록세대수, 전환비율이 포함되며, 일반적으로 세대수가 가구수보다 많아 전환비율은 1보다 큰 값으로 산출됩니다. 본 데이터를 활용하면 통계청 추계가구수를 주민등록세대수로 정확하게 변환, 도시가스 보급 대상 세대수 산정, 가정용 수요 전망 모델 개발 및 파라미터 설정에 기초자료로 활용할 수 있어 도시가스 수요 예측 정확도 향상과 보급 계획 수립에 기여할 것으로 기대됩니다.
