description_portal: 창업진흥원이 제공한 이 자료는 창업자의 학력 수준을 업력, 업종, 기업형태, 성별, 연령대에 따라 정량적으로 분류하고 시각화한 통계이다. 항목은 중졸 이하부터 박사까지 총 6단계로 나뉘며, 각 구간의 비율을 통해 업종별 고학력 창업자 분포, 연령대별 학력 특성, 성별 간 학력 편차, 업력 증가에 따른 학력 구성 변화를 한눈에 파악할 수 있다. 특히 정보통신업, 교육 서비스업, 전문기술 서비스업 등 지식집약 산업군에서 대졸 이상 비율이 높게 나타나며, 여성 창업자보다 남성 창업자의 박사 이상 비율이 상대적으로 높다. 이러한 분석은 정책 설계, 인재 육성, 직무 연계 프로그램 기획 등 다양한 영역에서 활용도가 높고, 학력 수준이 창업 지속성과 성과에 미치는 영향을 평가하는 기초자료로도 의미가 크다.
