description_portal: 한국서부발전 발전소별 연료 소비실적 정보입니다. 발전기별 및 연료별 연료사용량 데이터는 각 발전기가 전력을 생산하기 위해 투입한 연료의 종류와 사용량을 구체적으로 기록한 자료입니다. 이 데이터에는 유연탄, 중유, LNG 등 다양한 연료 유형별 소모량이 발전기 단위로 구분되어 집계되며, 전력 생산 과정에서의 에너지 효율성과 연료 의존도를 분석하는데 활용됩니다. 또한 동일 연료를 사용하는 발전기간 비교를 통해 설비 효율성, 운전 특성, 정비 상태 등에 따른 연료 소비 차이를 파악할 수 있습니다.연료사용량의 단위는 Ton 입니다.
