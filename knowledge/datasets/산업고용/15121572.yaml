summary_user: 한국서부발전 발전소(발전기)별로 일자마다 주연료원(유연탄·중유·LNG 등)과 그 연료사용량(톤)을 담은 집계 자료다. 에너지 분석가나 연구자가 '같은 연료를 쓰는 발전기 가운데 어느 곳이 연료를 더 많이 쓰는가', '서부발전의 석탄 의존도는 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명이나 같은 기관(한국서부발전) 자료를 기준으로 이름을 맞춰 이어 붙여야 한다.
limits: 발전소 코드 같은 공통 키가 없어 발전량·배출량 등 다른 데이터와 붙일 때 발전소명 매핑이 필요하다. 지역 단위가 아닌 전국·비공간 자료라서 지역별 에너지 사용량 분석에는 바로 쓸 수 없다. 개발계정은 하루 100회까지 호출할 수 있다.
