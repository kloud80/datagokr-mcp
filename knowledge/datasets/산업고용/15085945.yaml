description_portal: 공단은 대기전력저감 프로그램에 따라 대기전력저감 우수기준을 충족한 제품에 대해 신고를 받고 있습니다. 신고된 제품은 ‘대기전력저감 우수제품’으로 지정되며, 소비자에게 에너지 절약 효과가 높은 제품 선택을 유도하고 기업에는 저전력 기술 개발을 촉진하는 효과가 있습니다. 지정 제품은 에너지소비효율등급라벨 또는 별도 스티커 등을 통해 확인할 수 있습니다. 에너지이용합리화법 제18,19조 및 20조에 따른 대기전력저감대상제품의 연도별(2012년~), 품목별 (21개) 제품 신고 현황컴퓨터, 모니터, 프린터, 팩시밀리, 복사기, 스캐너, 복합기, 자동절전제어장치, 오디오, DVD플레이어, 라디오카세트, 전자레인지, 도어폰, 유뮤선전화기, 비데, 모뎀, 홈게이트웨이, 손건조기, 서버, 디지털컨버터, 유무선공유기 등이 있고, 고시 변경 등 다양한 사유로 인하여 품목은 변경될 수 있습니다.
