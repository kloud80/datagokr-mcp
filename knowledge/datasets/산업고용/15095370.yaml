description_portal: 이 데이터는 한국남부발전이 출자한 국내 집단에너지 회사들의 연도별 공급가구 수 현황을 정리한 자료입니다. 각 출자회사의 위치, 지분율, 사업내용, 설비용량, 사용 연료, 대상 지구 정보와 함께 2018년부터 2025년까지의 연도별 가구 공급 실적을 확인할 수 있습니다. 주요 공급 지역으로는 대구혁신도시, 양주신도시, 내포신도시 등이 있으며, LNG를 연료로 사용하는 집단에너지 사업을 중심으로 지역난방 및 전력 공급이 이루어지고 있습니다. 본 자료는 집단에너지 사업의 성장 추세를 파악하고, 에너지 공급 안정성 및 지속가능한 에너지 정책 수립을 위한 기초자료로 활용할 수 있는 유용한 정보입니다.
