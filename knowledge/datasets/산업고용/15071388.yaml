summary_user: 서울시 관내 고압가스 제조·저장·판매 사업장을 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소·휴업·폐업·재개업 일자와 영업상태, 주소·좌표, 소재지면적, 제조구분, 부지용도구분을 포함한다. 안전관리 담당자나 도시계획 분석가가 '우리 구에서 영업 중인 고압가스 사업장은 어디에 있고, 상업지역 안에 있는 곳은 몇 곳인가' 같은 질문에 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 코드(개방자치단체코드, 관리번호)로만 잇는다. 같은 LOCALDATA 계열의 석유판매·LPG·도시가스 등 다른 에너지 업종 인허가 원장과 함께 보는 용도로 쓴다.
limits: data.seoul.go.kr의 별도 인증키(경로 파라미터 KEY)가 있어야 호출되며, 공공데이터포털 활용신청과는 따로 받아야 한다. 전역 조인 키가 없어 사업자번호 등으로 다른 데이터와 정확히 연결하는 일은 이 데이터만으로는 하지 못한다.
