description_portal: 서울시 고압가스업 인허가 정보는 서울시 관내 고압가스 제조·저장·판매 사업장의 인허가 현황과 운영 특성을 제공하는 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자, 영업상태 및 상세영업상태를 통해 사업장의 설립과 운영 변동 이력을 파악할 수 있습니다. 사업장명, 전화번호, 소재지면적, 지번·도로명주소, 우편번호, 좌표(X·Y) 정보를 통해 사업장의 위치와 규모, 입지 특성을 분석할 수 있습니다. 제조구분명은 해당 사업장이 어떤 형태로 고압가스를 취급하는지 보여주며, 사업장부지용도구분명은 공업지역, 상업지역 등 토지이용 특성을 나타내어 안전관리·도시계획 측면의 분석에 활용됩니다. 관리번호, 데이터갱신구분·갱신일자, 최종수정일자는 개별 사업장 식별과 정보 최신성 검증을 위한 메타데이터로 활용됩니다.
