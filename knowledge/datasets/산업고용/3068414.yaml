summary_user: 전라남도 강진군 내 주유소를 업소 한 곳당 한 행으로 담은 원천 목록 파일로, 상호·대표자·도로명 소재지·전화번호·데이터기준일자를 담는다(포털 설명상 24건). 강진군 주민이나 지역 분석가가 "군내 어느 읍·면에 주유소가 있고 연락처는 무엇인가"를 확인하거나 도로명 주소로 주유소 분포 지도를 그리는 데 쓴다. 주유소 ID 같은 전역 조인 키가 없어서 오피넷 유가나 전국주유소표준데이터와는 상호·주소 문자열 매칭으로만 잇는다.
description_portal: 이 데이터는 전라남도 강진군 내 주유소 현황을 담고 있습니다. 총 24개의 레코드가 있으며, 각 주유소의 기본적인 운영 정보를 제공합니다. 주요 컬럼은 상호(주유소 이름), 대표자이름(사업주 성명), 영업소소재지(도로명)(정확한 주소), 영업소전화번호(연락처), 데이터기준일자(정보가 수집된 날짜)로 구성되어 있습니다.이 데이터는 강진군 내 주유소 분포와 운영 현황을 파악하는 데 유용하며, 지역별 석유 판매소의 접근성, 편의성, 행정 관리 등에 활용될 수 있습니다. 특히 주소 정보가 도로명으로 제공되어 지도 시각화, 위치 기반 분석에도 적합합니다.
