summary_user: 한국중부발전이 정리한 글로벌 석탄 가격지수를 기준일자별로 담은 파일로, 호주 뉴캐슬·유럽 ARA·남아공 리차드베이·인도네시아 ICI3·ICI4 지수를 톤당 미화달러로 담는다(전국·비공간 단위, CSV 약 1.9KB의 작은 표). 발전·에너지 분석가가 "최근 수입 석탄 가격이 지역별로 어떻게 움직였고 발전연료비에 어떤 영향을 줬나"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준일자를 맞춰 SMP나 발전량 같은 일별 전력시장 자료와 나란히 놓는 식으로만 이어 쓴다.
description_portal: 본 데이터는 글로벌 석탄시장 시황을 반영하는 주요 석탄 가격지수를 기준일자별로 정리한 자료입니다. 항목은 기준일자, 뉴캐슬, 에이알에이, 리차드베이, 아이씨아이3, 아이씨아이4로 구성되어 있으며, 각 지수는 호주(뉴캐슬), 유럽(에이알에이), 남아프리카공화국(리차드베이), 인도네시아(아이씨아이) 지역에서 측정된 표준 석탄 품질 기반의 가격지수를 의미합니다. 지수 단위는 톤당 미화달러이며, 이 자료는 글로벌 연료시장 동향 파악, 연료 구매 전략 수립, 석탄 수입단가 예측, 발전연료 비용 추이 분석 등에 활용 가능합니다.
