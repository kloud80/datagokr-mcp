summary_user: 전국 지자체가 관리하는 전력기술감리업체의 인허가 정보를 업체(사업장) 단위 건별로 담으며, 전체 2,323건에 인허가일자·영업상태·사업장명·주소·좌표 등이 있고 기간은 2017-05-25부터 2026-10-01까지다. 전기시설물 공사감리를 맡길 업체가 영업 중인지, 어느 지역에 있는지 확인하려는 발주자나 분석가가 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 키로 같은 주소 기반 다른 데이터와 이어 쓰며, 사업자번호 같은 별도 식별 키는 없다.
description_portal: '자원환경_전력기술감리업체 데이터는 전력기술감리업 정보 전기시설물의 설치·보수 공사에 대한 공사감리업무를 수행하는 업소 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 전력기술감리업체 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 전력산업정책과 / 044-203-3896 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
