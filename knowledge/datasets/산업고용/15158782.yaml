summary_user: 한국원자력환경공단이 중저준위방사성폐기물 처분시설에서 따로 관측하는 기상값을 측정시간(envRadDate)별로 담으며, 주변지역 평균 온도·습도·강우량·풍향·풍속을 제공한다. 처분시설 주변 주민이나 분석가가 '특정 시점에 처분장 부근 바람이 어느 방향으로 얼마나 불었나'처럼 방사선 감시값을 기상 조건과 함께 해석할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관의 환경방사선 실시간 데이터나 기상청 관측자료와는 측정시간과 지점 이름을 맞춰 연결해야 한다.
description_portal: '한국원자력환경공단은 중저준위방사성폐기물 처분시설 운영을 위하여 환경감시설비를 통해 별도의 기상관측을 상시적으로 시행하고 있습니다. 해당 데이터는 오픈api를 통하여 한국원자력환경공단에서 운영하고있는 중저준위방사성폐기물 처분시설 기상정보를 제공합니다. - 기준일 : 2014.12.23. - 해당 데이터 포맷은 JSON+XML이며 데이터 타입은 PUBC입니다. - 개발단계의 경우 별도 승인 없이 신청 후 사용이 가능하지만 운영 단계 및 상업적 이용의 경우 한국원자력환경공단의 별도 승인이 필요하며 한국원자력환경공단과의 별도 협의가 필요합니다. - 해당 데이터는 공공저작물로 제3자 권리를 포함하고 있지 않습니다. - 개발단계 활용 시 사용자에게 별도의 비용 부과는 없습니다.'
