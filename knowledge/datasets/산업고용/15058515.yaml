summary_user: 경기도 내 세탁업(기타 부문) 사업장을 한 곳씩 담은 인허가 원장으로, 사업장명·시군·인허가일자·영업상태·폐업일자·면적·세탁기 수·회수건조 수·주소·WGS84 좌표를 포함한다. 세탁소 창업을 준비하는 사람이 특정 시군에 영업 중인 세탁업소가 몇 곳이고 어디에 몰려 있는지 입지를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 상가업소·상권 자료 등 다른 지역 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 세탁업(기타 부문)에 해당하는 사업체의 현황을 수록한 자료로, 2025년 3월 12일 기준의 정보를 담고 있으며 주간 단위로 갱신됩니다. 주요 항목은 사업장의 명칭(BIZPLC_NM), 시군명(SIGUN_NM) 및 코드, 사업장의 인허가일자(LICENSG_DE)와 영업상태(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지면적(LOCPLC_AR), 세탁기수(WHM_CNT), 회수건조수(RETRVL_DRY_CNT), 건물의 소유형태, 다중이용업소 여부, 위생업종명 및 업태명, 주소정보, WGS84 좌표 등이 포함됩니다. 특히 세탁기수나 회수건조수는 시설 규모를 간접적으로 파악할 수 있어 업소 현황 분석, 서비스 품질 관리, 위생환경 점검 등에 활용됩니다. 데이터는 시군별 인허가를 기반으로 수집되며, 세탁업 현황을 파악해 지역별 서비스 인프라 수준을 비교하고 신규 진입 및 정책 수립에 기초자료로 제공될 수 있습니다. 예를 들어, 창업 예비자에게는 세탁업 입지 분석에 유용하고, 행정기관에는 업소 현황 및 위생업 관리 체계 수립에 근거자료로 활용됩니다. 또한 주소 정보와 GPS 좌표는 공간정보 분석과 연계되어 다양한 행정·민간 응용이 가능하며, Open API 형태로 공개되어 데이터 접근성이 뛰어납니다.
