summary_user: 진도군 관내 담배소매인 지정업소를 업소 한 곳씩 담은 원천 목록으로, 지정번호·소매인구분·업소명·지번/도로명 주소·지정일자·영업구분을 담는다. 신규 담배소매인 지정을 검토하는 사업자나 행정 담당자가 '특정 읍·면 주변에 이미 지정된 담배소매점이 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업소명으로 맞춰 붙이며, 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조한다.
description_portal: 전남광주통합특별시 진도군 담배소매인 지정현황 공공데이터는 진도군 관내에서 담배소매인으로 지정되어 영업 중이거나 관련 행정관리가 이루어지고 있는 업소의 기본 현황을 확인할 수 있도록 제공하는 자료입니다. 본 데이터에는 연번, 지정번호, 소매인구분, 업소명, 업소지번주소, 업소도로명주소, 지정일자, 영업구분 등의 항목이 포함되어 있어 담배소매인 지정업소의 유형과 소재지, 지정 시기 및 영업상태 등을 종합적으로 파악할 수 있습니다. 지정번호를 통해 개별 담배소매인 지정 건을 구분할 수 있으며, 소매인구분 항목을 활용하면 소매업소의 지정 유형을 확인할 수 있습니다. 업소명과 주소 정보를 통해 담배소매업소의 명칭과 위치를 확인할 수 있으며, 지번주소와 도로명주소를 함께 제공하여 이용자가 필요한 주소체계에 따라 해당 사업장의 위치를 보다 편리하게 확인할 수 있습니다. 또한 지정일자 정보를 통해 해당 업소가 담배소매인으로 지정된 시점을 파악할 수 있고, 영업구분 항목을 활용하면 업소의 영업 관련 상태를 확인하는 데 참고할 수 있습니다. 해당 데이터는 담배소매인 지정 및 관리, 신규 지정 검토, 사업장 현황 점검, 관련 민원처리 등 담배사업 관련 행정업무의 기초자료로 활용할 수 있습니다. 또한 지역별 담배소매업소의 분포를 분석하여 특정 지역의 소매업소 현황을 파악하거나, 지정업소의 변동사항과 영업상태를 지속적으로 관리하는 데 활용할 수 있습니다. 연도별 자료가 축적될 경우 신규 지정이나 영업상태 변화 등 담배소매업소의 변동 추이를 분석하는 데에도 도움이 됩니다. 아울러 관련 기관과 사업자, 군민 등이 진도군 내 담배소매인 지정업소의 기본 현황을 확인하고 관련 행정정보를 활용할 수 있도록 공공데이터로 제공함으로써 행정정보의 투명성과 접근성을 높일 수 있습니다. 본 데이터는 진도군 담배소매인 지정 및 관리업무를 체계적으로 지원하고, 관련 정책수립과 민원서비스 개선을 위한 기초자료로 활용하는 데 목적이 있습니다.
