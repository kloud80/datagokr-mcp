description_portal: 에너지다소비사업자 보유 발전설비 현황(열병합용) 데이터는 「에너지이용합리화법」에 따라 연간 에너지 사용량이 2,000toe 이상인 에너지다소비사업자가 신고한 열병합 발전설비 보유 현황을 상세히 제공합니다. 열병합 발전설비는 전기와 열 에너지를 동시 생산하여 에너지 효율을 극대화할 수 있는 설비로, 본 데이터는 전국 지자체별로 연도별 및 산업·상업 등 주요 부문별로 해당 발전설비의 설치 용량과 운영 현황을 체계적으로 나타내고 있습니다. 이를 통해 정부 및 지자체는 지역 내 발전설비 보유 현황을 파악하고 에너지 수급 계획 및 효율적인 에너지 관리 정책 수립에 기초자료로 활용 가능하며, 기업과 연구기관은 설비 운용효율 평가, 열병합 발전의 보급 확대 및 에너지 절약 전략 수립을 위한 연구자료로 폭넓게 활용할 수 있습니다.
