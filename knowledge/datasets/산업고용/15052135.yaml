summary_user: 전국 석유정제업 등록 사업장을 업소 단위로 담은 파일 데이터로, 업소명·시도·시군구·세부주소·전화번호 필드가 있고 전체 26건이다. 에너지 사업 인허가 현황을 찾는 분석가나 사업자가 국내 정제업 등록 업체가 어디에 있는지 확인하는 데 쓴다. 세부주소(address)를 조인 키로 삼아 주소 기준의 다른 사업장·입지 데이터와 이어 쓰며, 코드표는 없다.
description_portal: 1. 석유정제업(등록)이란 석유(친환경정제원료를 혼합한 것을 포함)를 정제하여 석유제품(부산물인 석유제품은 제외)을 제조하는 사업을 말한다.2. 석유정제업을 등록하려는 자는 산업통상자원부령으로 정하는 바에 따라 산업통상자원부장관에게 등록하여야 한다. 등록한 사항 중 정제능력 등 대통령령으로 정하는 사항을 변경하려는 경우에도 또한 같다.3. 석유정제업의 시설기준 등 등록 요건은 상압증류시설, 감압증류시설, 개질시설, 탈황시설, 분해시설 중 하나 이상의 시설과 사업개시연도 석유 내수판매계획량의 40일분에 해당하는 양을 저장할 수 있는 저장시설을 말한다.
