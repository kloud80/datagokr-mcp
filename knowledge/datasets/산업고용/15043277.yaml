summary_user: 한국남동발전이 추진·운영하는 신재생에너지 사업을 사업 한 건당 한 행으로 담은 파일(약 3.6KB의 소규모 CSV)로, 에너지원·사업명·설비용량(kW)·착공·준공년월·위치·투자유형(자체투자 또는 SPC)을 기록한다. 분석가나 사업자가 '남동발전이 어느 지역에서 어떤 에너지원으로 얼마 규모의 신재생 사업을 자체투자 또는 SPC 방식으로 진행하는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 발전공기업(남부·동서·서부·중부)의 같은 표준 데이터와는 같은 컬럼 구조로 이어 붙이고, 태양광 발전사업 허가 표준데이터 등과는 사업명·위치 같은 이름 매칭으로만 연결한다.
limits: 사업이나 발전소를 식별하는 공통 코드가 없어 다른 설비 원장과 정확히 조인되지 않고, 위치·사업명 문자열로 맞춰야 한다. 위치는 텍스트로 주어지며 공간 좌표는 없다.
