description_portal: 한국남동발전의 올바로시스템 처리계획서 정보입니다.사업소(영흥, 삼천포)에서 배출되는 폐기물을 올바로시스템으로 송신하고 있는 데이터 입니다.연계업체, 배출업체, 처리업체, 처리량, 운반업체 등의 정보를 포함하고 있습니다.1,2차 계량시간(24시간제, 시/분 까지 제공)과 계량 중량값을 확인할수 있습니다실제 측정값을 기반으로 운송업체와 처리업체명을 확인할 수 있으며 진행단계의 컬럼을 통해 올바로시스템으로 전송결과를 포함하고 있습니다※ 올바로시스템이란 사업장폐기물의 배출부터 운반 최종처리까지의 전 과정을 종이인계서 대신 인터넷 실시간으로 폐기물의 전 생애를 확인하기 위한 시스템 입니다.
