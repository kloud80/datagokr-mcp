description_portal: ㅇ 전자파 적합성(EMC, Electromagnetic Compatibility)이란 전자기기에서 방출되는 전자기노이즈로 인해 다른 전자기기에 간섭을 주지 않도록 전자기노이즈의 방출량을 규격에서 정한 레벨 이하로 관리하고(EMI, 전자기간섭), 외부의 강한 전자기노이즈 환경에서도 전자기기의 성능이 유지될 수 있도록 관리하여(EMS, 전자기내성) 전자기적합성을 확보하기 위한 시험입니다.ㅇ 전자기 장해를 발생하는 제품은 EMC 적합등록을 통과해야만 국내시장이나 국제시장에서 판매나 제조가 가능하기 때문에 필수적인 사항입니다. 따라서 전자파 적합성 시험 데이터를 통해 품목별 해당하는 규격 및 시험방법을 알 수 있고, 시험 부적합 사례를 분석하여 제품 제조에 있어 안전성을 높이는 데 도움이 될 수 있습니다.
