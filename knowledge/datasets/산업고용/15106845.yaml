description_portal: '구조개선의 필요가 있는 부실징후기업을 지원하는 2024년 구조개선전용자금의 지원기업 별 자금 지역, 업종, 업력에 관한 데이터입니다.본 자료로 구조개선기업 관련 공공데이터 구축에 기여하는 것을 목적에 두고 있습니다.세부내용은 다음과 같습니다.- 연번: 2024년도 구조개선전용자금 지원 현황의 순번입니다.- 지역: 광역지자체 기준으로 접수건별 추출하였습니다.- 업종1, 2: 접수건의 업종을 분류하였습니다.- 업력: 1/3/5/7/10/15/20년 미만 및 20년 이상으로 업력을 구분하였습니다.해당 자료에는 부실징후 기업 지원 내용에 관한 정보가 포함되어 있어, 중소기업의 구조개선 지원 및 기업 재도전 정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 구조개선 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.'
