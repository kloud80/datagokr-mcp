summary_user: 경기도 시군별 건축사사무소를 사무소 한 곳당 한 행으로 담은 신고 원장으로, 신고번호·신고일자·개인/법인 구분·사무소명·대표자명·도로명/지번 주소·우편번호·WGS84 위도/경도를 포함한다. 공공사업 발주 담당자나 건축주가 "우리 시군에 등록된 건축사사무소는 어디에 몇 곳 있나"를 확인하거나, 분석가가 지역별 설계 인력 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)·주소 문자열 매핑이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군에 위치한 건축사(건설업)사무소의 현황을 담고 있으며, 사무소별 신고번호, 신고일자, 신고구분(개인/법인), 사무소명, 소재지 주소(도로명, 지번), 우편번호, 대표자명, 위도/경도 좌표(WGS84 좌표계) 등으로 구성되어 있습니다. 각 건축사무소는 시군별로 정리되어 있으며, 행정적 위치정보와 건축사 대표자의 정보까지 포함되어 있어 지역 건축 전문 인력 분포 파악, 건축업계 네트워크 분석, 지도기반 위치 시각화, 공공사업 입찰을 위한 설계사무소 조회 등에 활용할 수 있습니다. 특히 위치정보(WGS84 위도/경도)를 활용하면 GIS 시스템과 연계한 공간 분석 자료로도 유용하게 쓰일 수 있습니다.
