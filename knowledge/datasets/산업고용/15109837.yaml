summary_user: 인천시 기업 지원 플랫폼 BizOK에 가입한 재직인원 20인 이상 기업을 한 행에 한 업체씩 기업명·주소·업태·업종명·직원수로 담은 인천광역시 범위의 개별 기업 목록(CSV 파일)이다. 지역 정책 담당자나 분석가가 '인천에서 직원 20명 이상인 제조업체는 어느 지역에 몰려 있고 규모는 어떤가'처럼 산업별·규모별 기업 분포를 확인하는 데 쓴다. 전역 조인 키(사업자등록번호 등)가 없어 다른 기업 데이터와는 기업명이나 주소 문자열 매칭으로만 이을 수 있다.
description_portal: 인천광역시 BizOK 가입 재직 인원 20인 이상 기업체 현황 공공데이터는 인천시 기업 지원 플랫폼인 BizOK에 등록된 중소기업의 규모와 산업 분포를 보여주는 자료입니다. 주요 항목은 기업명, 기업주소, 업태(제조, 제조업, 부동산 등), 업종명, 직원수로 구성되어 있습니다. 이를 통해 기업의 기본 정보와 위치, 산업 활동 유형, 세부 업종을 확인할 수 있으며, 직원 수 항목은 기업 규모를 판단하는 핵심 지표로 활용됩니다. 이 데이터는 인천 지역 내 기업 지원 정책의 효율성을 높이고, 중소기업의 성장 단계에 맞는 맞춤형 지원을 제공하는 데 중요한 기초 자료가 됩니다. 또한 산업별·규모별 기업 분포를 파악해 지역 경제 활성화와 정책 수립에 활용할 수 있습니다.
