description_portal: 휘발유의 품질기준은 석유 및 석유대체연료 사업법 제24조에 따라 석유제품 품질기준과 검사방법 및 검사수수료에 관한 고시에서 정하고 있습니다.자동차용 휘발유는 자동차 또는 이와 비슷한 내연기관의 연료로서 다음 품질기준에 적합하여야 합니다.자동차용 휘발유 품질기준항목으로는 옥탄값(리서어치법), 증류성상, 물과 침전물, 동판부식, 증기압, 산화안정도, 세척현존검, 황분, 색(육안식별), 납 함량, 인함량, 방향족화합물 함량, 벤젠함량, 올레핀함량, 산소함량, 메탄올함량 등이 있습니다. 산소합량은 MTBE, ETBE, TAME 및 바이오에탄올에 함유되어 있는 산소량을 말합니다.
