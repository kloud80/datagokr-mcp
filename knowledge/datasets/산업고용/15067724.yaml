description_portal: 한국서부발전 연도별 신재생에너지 의무공급량 정보입니다. 신재생 에너지 연도별 의무 공급량 및 비율 데이터는 정부가 시행하는 "신재생에너지공급의무화제도(RPS,Renewable Portfolio Standard)"에 따라 한국서부발전이 매년 충족해야 하는 목표치를 정리한 자료입니다. 이 데이터에는 연도별 총 전력 판매량 대비 신재생에너지로 공급해야 하는 의무비율과 이에 해당하는 의무 공급량이 기록됩니다. 예를 들어 12.56%의 의무비율이 설정되었다면, 한국서부발전에서는 해당 전력 판매량의 12.56%를 태양광, 풍력, 바이오매스, 연료전지 등 신재생 설비로 충당해야 합니다. 따라서 본 자료는 한국서부발전의 에너지 전환 성과를 정량적으로 보여주는 지표이자, 국가 온실가스 감축 목표와 탄소중립 정책이행의 핵심 관리 수단으로 활용됩니다.- 2025년도 확정 후 업데이트될 예정입니다.
