summary_user: 국내 원자력발전소에서 보고 대상이 된 사고·고장(원자로 정지와 정지 외 사건 포함)을 연도별로 집계해, 발생 계통(1차·2차·기타)별 건수와 원인(인적·기계적·전기적·계측제어·외부 영향)별 건수를 담은 전국 단위 소용량 파일(csv 479바이트)이다. 연구자나 시민이 '최근 원전 사건은 어느 계통에서, 어떤 원인으로 많이 생기며 인적 실수 비중은 해마다 어떻게 바뀌었나'를 볼 때 쓴다. 전역 조인 키는 없고 연도 컬럼뿐이라, 다른 원전 운영·사건 통계와는 연도를 맞춰 붙여 쓴다.
description_portal: '국내 원자력발전소 사건 관련 원인을 분류한 연도별 데이터입니다. (2011~2025년)- 본 데이터는 원자력발전소의 사건 원인을 발생 위치에 따른 계통별(1,2차로 분류) 분류와, 발생 원인별(인적실수, 기계적 , 전기적, 계측제어, 외부 영향)로 분류한 현황을 나타내고 있습니다.    (※ 1차 계통 :  원자로를 포함하여 열을 생산하고 생산된 열을 2차 계통에 전해주는 부분, 2차 계통 : 1차 계통에서 얻은 열에 의해 발생된 증기를 이용하여 전기를 생산하는 부분)- 또한 본 데이터는 원자력안전위원회  고시에 따른 보고 대상 사고 및 고장 통계이며, 원자로 정지 및 정지 외 사건을 포함하였습니다.'
