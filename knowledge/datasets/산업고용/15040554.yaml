summary_user: 중소기업과 근로자가 경영성과를 나누기로 약정했거나 이미 나누고 있는 성과공유 기업을 기업 한 곳당 한 행으로 담은 전국 단위 명단 파일(CSV)이다. 기업명, 최초승인일자와 유효일자, 협약유형과 도입유형별 해당 여부(성과급·내일채움 등 성과보상·임금상승·우리사주·스톡옵션 등)가 들어 있다. 구직자나 분석가가 '이 회사가 성과공유기업으로 승인됐는지, 어떤 방식으로 성과를 나누는지'를 확인하는 데 쓴다. 실측 컬럼에는 사업자등록번호 같은 공통 조인 키가 없어서, 벤처·이노비즈 등 다른 기업 확인·인증 명단과는 기업명을 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 중소기업=근로자 간 성과공유제란, 사업주와 근로자가 함께 혐력하여 수익을 향상시키고 '기업의 경영성과'를 근로자와 공유하는 제도를 말합니다.성과공유기업이란, 성과급지급, 성과보상공제, 임금수준의 상승, 우리사주제도 운영, 복지기금 운영, 주식매수선택권 부여 등의 방법으로 근로자와 성과를 공유하고 있거나, 공유하기로 약정한 중소기업입니다.해당 데이터는 그러한 성과공유 기업 리스트이며 기업명, 대표자, 승인일, 협약유형 등의 내용을 포함하고 있으므로 관련 정보를 확인하시는데 활용하시기 바랍니다.
