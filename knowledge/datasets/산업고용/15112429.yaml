summary_user: 중소벤처기업부가 지정·고시한 지역특화발전특구를 특구 한 곳당 한 행으로 담은 전국 단위 파일(CSV, 약 15KB)로, 특구명·시도·시군구·상세 위치 주소를 담는다. 지자체 담당자나 지역 투자를 검토하는 사업자가 '우리 시·군·구에는 어떤 특구가 지정돼 있고 위치가 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 시도·시군구 이름이나 특구명을 문자열로 맞춰 이어 써야 한다.
description_portal: '* 중소벤처기업부 규제자유특구(rfz.o.kr)에서 제공하는 데이터입니다.* 지역별 지역특화발전특구 현황 정보에 대해 지역별 세부 구 ,군별 상세 특구명을 나타내며지역 상세주소 위치 등을 제공하는 정보로 민원인과 직접 통화하여 데이터 내용에 대해 재차 확인하여 관련 정보를 제공함* 규제자유특구는 지역을 단위로 지역과 기업이 직면한 신사업 관련 덩어리 규제를 패키지로 완화해 주는 제도로서, 이를 통해 지역으로의 투자와 양질의 일자리를 창출하여 지역의 혁신성장과 균형발전을 도모합니다. - 지역특구법 제75조 제3항 및 제4항에 따라 중소벤처기업부장관이 지정ㆍ고시한 구역* 데이터 구성요소 : 특구명, 지역구분1, 지역구분2(시, 군, 구), 상세주소 순'
