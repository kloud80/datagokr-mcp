description_portal: 이 데이터는 한국남부발전이 참여한 국내 화력발전 출자회사의 기본 정보를 정리한 자료입니다. 각 출자회사의 명칭, 사업부지 위치, 설비용량, 주주구성, 사용 연료 및 상업운전 개시 시기를 포함하고 있으며, LNG를 중심으로 한 발전 설비 현황을 확인할 수 있습니다. 울산, 대구, 경기, 충남 등 다양한 지역에 위치한 발전소가 수록되어 있어 국내 주요 화력발전 출자회사의 분포와 운영 특성을 한눈에 파악할 수 있습니다. 본 자료는 화력발전 분야의 투자 구조와 에너지 공급 현황을 이해하는 데 도움을 주며, 향후 에너지 정책 수립과 발전설비 운영 전략을 분석하는 데 유용한 기초자료입니다.
