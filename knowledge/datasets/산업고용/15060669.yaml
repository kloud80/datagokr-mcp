summary_user: 한국수력원자력이 사들인 현물 REC(신재생에너지공급인증서)를 구매월 단위로 모아 구매 수량과 평균 단가를 담은 월별 집계 파일입니다. 신재생 발전사업자나 에너지 분석가가 'REC 현물 가격이 최근 몇 년간 어떻게 움직였고 한수원의 월별 구매 규모는 얼마였나'를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 다른 REC·SMP 시세 자료와는 구매월(연월)을 기준으로 맞춰 붙여 씁니다.
limits: 한 기관(한수원)의 구매 내역만 담은 전국 단위 비공간 집계라서 지역별·발전원별 REC 가격이나 개별 거래 건은 알 수 없습니다. 파일 크기가 약 2.5KB인 작은 월별 표이며, 다른 데이터와 이어 붙일 공통 코드가 없습니다.
