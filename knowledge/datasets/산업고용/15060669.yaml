description_portal: 한국수력원자력㈜이 공개한 REC 현물단가 데이터는 신재생에너지공급인증서(REC, Renewable Energy Certificate) 거래 현황을 구체적으로 보여주는 자료입니다. REC는 신재생에너지 전력을 1MWh 생산할 때 발급되는 인증서로, 신재생에너지 발전사업자는 「신재생에너지공급의무화(RPS) 제도」에 따라 보유한 REC를 의무공급사업자인 발전공기업 등에게 판매할 수 있습니다. 한국수력원자력㈜이 제공하는 이 데이터는 2018년도부터 현재까지 회사가 구매한 현물 REC의 세부 내역을 담고 있으며, REC 구매월, 구매 수량, 평균 단가 등의 항목으로 구성되어 있습니다. 이를 통해 특정 시점별 REC 거래 규모와 가격 변동 추이를 확인할 수 있으며, 신재생에너지 시장의 수급 상황과 가격 흐름을 분석하는 데 유용합니다. 해당 자료는 신재생에너지 정책 연구자, 에너지 산업 종사자, 투자자 등에게 중요한 참고 자료가 될 수 있으며, 나아가 국가 에너지 전환 정책과 탄소중립 실현을 위한 신재생에너지 보급 확대 전략을 평가하는 데 활용될 수 있습니다. 또한 공공기관의 REC 구매 현황을 투명하게 공개함으로써 에너지 거래 시장의 신뢰성과 공정성을 제고하는 데 기여하는 의미 있는 공개 데이터입니다.
