description_portal: 신재생에너지 설치현황'은 한국가스공사에 설치된 신재생에너지 설비현황을 체계적으로 정리한 데이터 입니다.한국가스공사의 신재생에너지 도입 현황 관리 및 탄소중립 목표 달성, ESG 경영성과 관리, 에너지 전환 전략 수립을 목적으로 수집되었습니다.데이터 구성항목은 신재생에너지 설치현황, 용량, 용량 단위, 개소(개) 등으로 이루어져 있으며, 태양광발전, 태양열 온수시스템, 지열에너지(냉방 및 난방), 풍력발전, 연료전지에 대한 상세 정보를 제공합니다. 본 데이터를 활용하면 신재생에너지 설비 확대 계획 수립, 에너지원별 발전효율 분석, 탄소배출 저감량 산정, 재생에너지 발전 비중 계산이 가능합니다. 또한 재생에너지 전환율 추이 파악, 설비 운영현황 모니터링, 설비별 가동률 분석, 투자효과 평가에 활용됩니다.ESG 경영성과 보고, 에너지 전환 정책 수립, 신재생에너지 투자 우선순위 결정 등 정책 의사결정을 지원합니다.
