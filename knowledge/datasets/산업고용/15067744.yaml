description_portal: 한국광해광업공단에서는 국내 광해방지사업을 효율적으로 시행하고 해외시장에서 선진국과의 치열한 경쟁에서 우위를 점하기 위해서는 이를 뒷받침하는 고효율 광해관리기술이 전제되어야 합니다. 공단은 현장맞춤 실용화 기술개발을 통해 효율적인 광해방지사업 추진을 도모하고, 비교우 위 기술의 확보로 친환경 광산개발 및 해외 광해관리시장에서 국제적 경쟁 우위를 확보하고 광해관리 분야 신성장 동력을 창출하는데 앞장서고 있습니다.이와 관련, 산림복구 및 토지복구, 토양개량, 오염수질개선, 지반침하방지, 광물찌꺼기 유실방지, GIS 등 광해방지기술개발 논문발표 실적 현황에 관한 정보를 제공합니다.
