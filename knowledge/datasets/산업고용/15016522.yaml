description_portal: '경상남도 사천시 관내에 등록된 골재채취업체에 대한 상세 현황 정보를 공공데이터로 제공하고 있습니다. 이 자료는 지역 내 골재 수급 현황을 파악하고, 건설 및 자원 산업 분야의 투명성을 제고하는 데 활용됩니다.제공되는 주요 데이터 항목은 다음과 같습니다:순번: 자료의 관리 및 식별 번호등록업종: 해당 업체가 등록한 골재채취업의 세부 업종업체명: 해당 골재채취업체의 공식 상호명대표자: 업체를 대표하는 인물의 성명소재지: 업체 사무실의 정확한 주소전화번호: 업무 관련 문의를 위한 연락처이 현황 데이터는 사천시의 지역 산업 구조 분석과 건설 자재 수급 계획 수립을 위한 기초 자료로써, 누구나 자유롭게 이용할 수 있도록 개방되어 있습니다.'
