summary_user: 경기도 동두천시 안의 태양광발전시설을 발전소 한 곳당 한 행으로 담은 건별 원장 파일로, 발전소명·도로명/지번 주소·위도·경도·설치위치(건물·토지·산지)·용량(kW)·허가일을 담는다. 동두천시에서 산지에 들어선 태양광 설비가 어디에 얼마나 되는지, 허가 시기별 설치 용량이 어떻게 늘었는지를 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키는 없어 전국태양광발전소전기사업허가정보표준데이터 같은 다른 자료와는 발전소명·주소 문자열 매칭이나 위도·경도 좌표로만 이어 쓴다.
description_portal: 경기도 동두천시의 태양광발전시설현황에 대한 정보를 제공하고자합니다.데이터는  발전소명, 도로명주소, 지번주소, 위도, 경도, 설치위치, 용량, 허가일, 관리기관명, 관리기관전화번호, 등록일자로 구성되어있습니다.설치 위치는 건물, 토지, 산지 데이터 이며, 용량은의 단위는 KW입니다.데이터 등록일자는 2025년 12월 24일입니다.데이터에 대하여 추가 문의사항 및 수정사항이 있으실 경우 경기도 동두천시청 일자리경제과 에너지팀(031-860-2329)으로 문의주시기 바랍니다.
