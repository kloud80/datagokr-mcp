description_portal: 본 자료는 2021년부터 2022년까지의 중장년층 워크넷 서비스 이용 실태를 분석하기 위한 웹 서버 로그 기반 통계 데이터로, 중장년 구직자 및 경력전환 희망자의 워크넷 내 서비스 접근량과 이용 행태를 파악할 수 있도록 구성되어 있습니다.해당 데이터는 중장년 전용 서비스 페이지에 대한 방문 수(Visit)와 페이지뷰 수(Page View)를 중심으로 집계되며, 이는 사용자 브라우저 단위 서버 접속 이력을 바탕으로 한 자동 기록값입니다.기간별 추이, 일자별 또는 시간대별 집중도, 콘텐츠별 이용 빈도 등을 분석할 수 있으며, 중장년층의 취업지원 콘텐츠 수요 파악, 정책별 홍보 효과 분석, 디지털 서비스 접근성 개선 등의 근거 자료로 활용됩니다.특히 워크넷 내 중장년 일자리 서비스, 교육훈련, 취업상담 페이지 등 핵심 카테고리별로 분리된 페이지뷰 분석이 가능하면 더 정교한 수요 맞춤형 정책 설계가 가능합니다.
