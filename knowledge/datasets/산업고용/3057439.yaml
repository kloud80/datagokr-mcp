description_portal: '본 데이터는 부산교통공사 도시철도 역사 내 광고시설물에 대한 관리 정보를 정리한 자료입니다.광고 매체의 종류는 역구내 광고, 사각기둥 광고, 디지털 사이니지 광고, 출입구 벽면 조명 광고 등으로 구성되며, 광고가 설치된 위치(대합실, 승강장, 출입구 등)와 광고대행사 정보가 함께 제공됩니다. 해당 데이터는 도시철도 역사 내 광고시설물의 공간별 분포와 운영현황을 파악할 수 있어 광고 매체의 효율성 분석, 상업시설 기획, 공공자산 활용도 제고 등 다양한 목적에 활용될 수 있습니다.또한 민간 기업과의 협업 기반 조성, 광고 수익 구조 개선, 공공공간의 시각적 쾌적성 확보 등 정책 수립과 운영 전략 마련에 도움이 되는 실무중심의 자료입니다.* 광고대행사의 연락처는 공사 홈페이지를 참고하시기 바랍니다.접속 주소 : https://www.humetro.busan.kr/homepage/default/page/subLocation.do?menu_no=1001040701'
