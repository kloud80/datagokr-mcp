summary_user: 한국중부발전이 추진 중인 신규 LNG 발전소를 사업 단위로 정리한 소규모 목록(CSV 343바이트)으로, 사업명·위치·설비용량(MW급)·착수연월·준공연월을 담는다. 에너지 분석가나 지역 주민이 중부발전의 신규 LNG 발전소가 어디에 몇 MW급으로 언제 준공되는지 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 발전설비 데이터와는 사업명·위치 문자열 매칭이나 같은 기관 자료로만 이어 쓴다.
limits: 실측 컬럼에 표준 조인 키가 없어 태양광 발전사업 허가 표준데이터 등 다른 발전소 원장과 자동으로 연결되지 않는다. 위치는 좌표 없는 비공간 정보이며, 한국중부발전 한 기관의 LNG 건설사업만 담아 전국 발전설비 현황을 대신하지 못한다.
