description_portal: 본 데이터는 한국중부발전이 추진 중인 신규 LNG발전소의 건설 현황을 정리한 자료입니다. 항목은 번호, 사업명, 위치, 설비용량(MW급), 착수연월, 준공연월로 구성되어 있으며, 해당 목록에 포함된 모든 발전소는 LNG를 연료로 사용하는 설비입니다. 설비용량은 숫자로 표기되며, 예를 들어 500은 500MW급 설비임을 의미합니다. 해당 자료는 신규 발전설비 투자 현황, 지역별 건설계획, 발전 용량 확장 수준 등을 파악하는 데 활용 가능합니다. 또한 전력 수급 계획 수립, 에너지 전환 정책 대응, 설비 준공 시기 예측 등의 기초 자료로도 활용 가능합니다.
