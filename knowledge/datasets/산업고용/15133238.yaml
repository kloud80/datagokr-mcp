description_portal: '중증장애인생산품 구매 실적은 공공기관 및 지방자치단체가 일정 비율 이상 중증장애인이 직접 생산에 참여한 제품을 의무적으로 구매하도록 하는 제도에 따라 매년 집계되는 중요한 지표입니다.중증장애인생산품 구매실적 현황에 대한 데이터로 구분, 총구매액, 중증장애인 생산품 구매액, 비율 항목을 제공합니다. 1. 총 구매액: 총 구매액이란, 해당 연도 기준으로 모든 공공기관(중앙부처, 지방자치단체, 공기업 등)이 물품 및 서비스를 구매한 전체 금액 2. 중증장애인 생산품 구매액: 중증장애인생산품 구매액은 다음과 같은 조건을 만족하는 생산품을 구입한 금액 3. 비율 : 중증장애인 생산품 구매 비율'
