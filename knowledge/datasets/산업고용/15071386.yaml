summary_user: "서울에너지공사가 운영하는 발전소의 전기생산량을 지점(branchNm·branchCd)과 일자별로 담은 생산 실적 데이터이며, 측정 단위와 생산량 값이 함께 제공된다. 에너지 분석가나 정책 담당자가 '서울에너지공사 발전소별 전기생산량이 기간에 따라 어떻게 달라졌는가'처럼 발전량 추이와 설비 가동 수준을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 발전소 원장(예: 전국 태양광 발전사업 허가 표준데이터)이나 전력 수급 데이터와는 발전소명 매칭이나 같은 기관 코드(지점코드)를 통해서만 연결한다."
description_portal: 서울에너지공사의 발전소별 전기생산량 정보를 제공하는 공공데이터이다. 본 자료는 발전소 단위로 측정된 전력 생산 실적을 기반으로 하며, 주요 항목은 발전소명, 생산일자, 생산량(kWh), 설비용량, 가동률 등으로 구성된다. 전기생산량은 각 발전소에서 일정 기간 동안 생산된 전기의 총량을 의미하며, 발전설비의 운영 효율성과 전력 생산 구조를 분석하는 데 활용된다. 본 데이터는 발전량 추이 분석, 설비 가동 수준 평가, 생산 계획 수립 및 전력 수급 대응 전략 마련 등에 유용하다. 또한 에너지 수급 균형 확보, 탄소배출 저감 노력, 친환경 발전 설비 투자 타당성 검토 등 공공기관의 전력 운영 및 에너지 정책 수립에 있어 핵심적인 기초자료로 활용될 수 있다.
