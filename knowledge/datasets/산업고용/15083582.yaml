summary_user: 충청남도 벤처기업 수를 연도 등 구분별로 벤처투자·연구개발·기술평가보증·기술평가대출·혁신성장·예비벤처 유형과 합계로 나눠 담은 집계표로, 포털 설명상 2016년부터 2024년까지를 다루며 파일 크기는 363바이트입니다. 충남의 벤처기업이 어떤 확인 유형 중심으로 늘거나 줄었는지, 2019년 전후 유형 체계 변화가 지역 벤처 구성에 어떻게 나타났는지 보려는 지역 정책 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 유형 이름을 맞춰 연결해야 하며, 개별 기업 명단이나 사업자번호는 들어 있지 않다.
limits: 기업 단위 원장이 아닌 유형별 건수 집계라서 특정 기업의 벤처 확인 여부를 조회하거나 사업자번호로 다른 기업 데이터와 붙이는 용도에는 쓸 수 없다. 메타데이터의 범위는 '전국'으로 표시되지만 제목상 내용은 충청남도에 한정되고, 시군 단위 구분이 없는 비공간 자료다.
