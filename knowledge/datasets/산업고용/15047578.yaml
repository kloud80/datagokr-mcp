description_portal: 중소기업 컨설팅지원사업은 중소벤처기업의 경쟁력 강화를 위해 중소벤처기업진흥공단(중진공)이 수행한 맞춤형 컨설팅 지원 사업입니다. 중소기업의 경제·정책 환경 변화에 대응하고, 체질 개선 및 경쟁력 강화를 위한 맞춤형 컨설팅 지원이 목적이며, 주요 지원내용은 체질 개선 및 경쟁력 강화를 위한 맞춤형 컨설팅 지원입니다.정보보안 및 화학물질관리 등 다양한 분야를 통해 컨설팅을 지원하는 사업입니다.동 데이터는 중소기업 컨설팅 지원 사업의 매출액별 지원현황 통계자료로 자료를 개방하여 중소기업 컨설팅 산업기반 강화를 지원합니다.
