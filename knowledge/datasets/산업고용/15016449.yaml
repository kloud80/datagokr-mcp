summary_user: 경상남도 창녕군에서 골재채취업 허가를 받은 업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·주 영업소 소재지(도로명주소)·허가 업종(수중·육상·산림·선별·파쇄)과 데이터기준일을 담으며 파일 크기는 307바이트로 작다. 창녕군 안에서 어떤 업체가 어떤 업종으로 골재채취업 허가를 받았는지 확인하려는 건설·골재 수요 사업자나 지역 인허가 현황을 보는 분석가가 쓴다. 전역 조인 키가 없어 다른 시군의 골재채취업 현황이나 광업·토석채취 허가 자료와는 상호명이나 주소로 맞춰 이어 써야 한다.
description_portal: 경상남도 창녕군에서 허가를 받은 골재채취업 현황입니다.1. 골재채취를 허가받은 업체의 상호명, 업체의 주 영업소 소재지(도로명주소), 골재채취업 허가를 받은 업종(수중, 육상, 산림, 선별, 파쇄)에 대한 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일 기준이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 건설산업국 안전치수과 낙동강관리팀 055-530-1864로 문의 주시기 바랍니다.
