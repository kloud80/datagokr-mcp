description_portal: '한국산업기술진흥원의 사업(과제) 추진을 통해 사업화한 제품 정보가 포함된 데이터입니다. 이 데이터는 사업화한 제품의 명칭, 제품의 유형 등에 대한 구체적인 정보를 제공합니다. 실제로 이 데이터를 활용하면 기업이나 연구기관이 산업 기술 발전을 위한 참조 자료로 활용할 수 있으며, 제품화 단계의 성공 사례를 분석하거나 새로운 기술 트렌드를 파악하는 데에 유용합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형): 사업화 성과가 발생한 연도접수번호(숫자형): 각 제품의 고유 접수 번호제품명(문자형): 사업화된 제품의 이름제품유형(문자형): 제품의 분류를 위한 코드제품유형명칭(문자형): 제품 유형의 상세 명칭이를 통해 사용자는 쉽게 특정 제품에 대한 정보를 검색하고, 관련 데이터를 편리하게 활용할 수 있습니다.'
