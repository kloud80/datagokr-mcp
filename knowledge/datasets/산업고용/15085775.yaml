description_portal: 본 데이터는 인천광역시 미추홀구에서 운영 중인 공공일자리사업 현황을 정리한 자료로, 사업명, 신청자격, 사업기간, 선발 인원, 근로 내용, 임금 및 근무시간 정보를 포함하고 있습니다. 주요 사업 유형은 공공근로사업, 지역공동체일자리사업, 지역방역일자리사업, 희망근로사업 등으로 구성되며 환경정화, 행정업무 지원, 마을공간 활용 등 다양한 공익 목적의 업무가 포함됩니다.신청 자격은 연도와 사업별 기준에 따라 차이가 있으며, 주로 만18세 이상 근로능력이 있는 주민 중 기준중위소득 조건 또는 특정 취약계층을 대상으로 하고 있습니다. 본 데이터는 지역 일자리 정책 비교, 연도별 고용지원 추이 분석, 취약계층 고용수요 파악, 사업성과 검토 및 향후 일자리정책 개선에 활용될 수 있는 행정 기반자료입니다.
