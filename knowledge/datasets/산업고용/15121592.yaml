summary_user: 한국서부발전이 운영하는 태양광·풍력 발전기별로 일자마다 설비용량(MW)과 1시부터 24시까지 시간별 발전량을 한 행에 담은 건별 운영 기록이다. 분석가나 에너지 사업자가 '서부발전 태양광 발전기의 시간대별 발전 패턴과 설비용량 대비 이용률은 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전·기상 데이터와는 발전기명(genNm)과 일자를 이름 매핑해 이어 써야 한다.
description_portal: 한국서부발전의 신재생에너지 발전량 데이터 입니다. 한국서부발전에서 운영하고 있는 신재생에너지(태양광, 풍력) 발전의 일일 시간별 발전량을 제공합니다. 태양광·풍력 발전소별 발전량을 시간 단위로 기록한 데이터는 재생에너지의 생산 특성을 정밀하게 분석할 수 있는 핵심 자료입니다. 이 데이터는 발전소별 위치와 설비 용량에 따른 실제 발전량을 시간대별로 구분하여 제공합니다. 특히 태양광은 일출·일몰에 따른 일변화가 뚜렷하고, 풍력은 시간대별 바람 세기와 방향 변화에 크게 영향을 받기 때문에 해당 데이터는 수급 예측, 전력 계통 안정화 대책 수립, 운영 효율화 방안 마련에 필수적입니다.제공데이터는 일별, 발전기명 , 설비용량, 24시 발전량 입니다.일자검색은 월단위로 하시기 바랍니다.예) startDate=20230101, endDate=20230131
team:
  dept: 디지털운영부
services:
