summary_user: 서울시 상권분석서비스의 상권변화지표를 기준 연도·분기(STDR_YYQU_CD)와 자치구별로 집계한 데이터로, 자치구 상권의 변화 단계(지표 코드와 명칭), 운영 중인 업소와 폐업 업소의 평균 영업 개월 수, 같은 항목의 서울 전체 평균을 담는다. 창업 예정자나 상권 분석가가 '우리 자치구 상권이 활성화 단계인지 쇠퇴 단계인지, 폐업 업소가 서울 평균보다 일찍 문을 닫는지'를 분기별로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 자료와는 자치구 코드·자치구명과 분기 코드를 맞춰 붙이거나 같은 서울시 상권분석서비스 계열 자료와 연결한다.
description_portal: 서울시 상권분석서비스(상권변화지표-자치구) 데이터는 자치구 단위로 상권의 변화 추세를 파악할 수 있는 정보를 제공하는 자료입니다. 기준 연도와 분기를 나타내는 코드와 자치구 코드 및 자치구 명을 통해 시기별·지역별 상권 변화를 비교 분석할 수 있습니다. 상권 변화 지표와 그 명칭을 통해 각 자치구의 상권이 활성화 단계인지 쇠퇴 단계인지 등 변동 상황을 한눈에 파악할 수 있습니다. 운영 영업 개월 평균과 폐업 영업 개월 평균은 해당 자치구에서 신규로 영업을 지속하는 기간과 폐업 업소의 평균 영업 지속 기간을 보여 주어 상권의 안정성과 지속 가능성을 판단하는 데 도움을 줍니다. 또한 서울 전체 기준의 운영 영업 개월 평균과 폐업 영업 개월 평균을 함께 제공하여, 특정 자치구 상권의 성과와 특성을 서울시 평균과 직접 비교 분석할 수 있는 기초 자료로 활용할 수 있습니다.
