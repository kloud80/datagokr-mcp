summary_user: 한국남동발전이 공개한 계통한계가격(SMP) 파일로, 거래일자별로 구분(육지·제주 등 SMP/BLMP 구분으로 보이는 '구분' 필드)과 SMP 가중평균을 담으며 포털 기준 1,610건의 전국 단위 비공간 데이터다. 발전사업자나 에너지 분석가가 '최근 몇 년간 계절·시기별로 전력 도매가격(SMP)이 어떻게 변했나'를 확인하거나 발전 수익·전기요금 추세를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 거래일자(날짜)를 기준으로 발전량·전력수급·REC 가격 같은 일별 전력시장 데이터와 맞춰 쓴다.
description_portal: '한국남동발전의 SMP관련 데이터입니다. 해당 데이터는 총 1,610건의 데이터가 존재하며 거래일자, 구분, SMP(에스엠피) 가중평균 등의 정보를 포함하고 있습니다.* 계통한계가격(SMP, System Marginal Price): 전력을 구매하는 기준 가격- SMP는 전력 수요를 충족시키기 위해 가동되는 발전기 중 가장 발전 단가가 비싼 발전기의 비용으로 결정되며, 모든 전력 거래의 기준점이 됩니다.해당 데이터는 전력 수급 패턴 파악(계절별 시간대별 변동추이)에 활용될 수 있습니다.'
