description_portal: 한국서부발전은 안정적인 전력 공급과 효율적인 설비 운영을 위해 발전설비의 발전실적을 데이터를 관리하고 있습니다. 연월별 운전시간, 발전량, 소내 소비량, 역일 평균 전력, 발전 열효율, 소내 소비 전력율, 역일 이용율, 발전단 연소비율 등의 데이터를 종합적으로 분석하여 발전소 운영의 효율성을 예측할 수 있습니다. 발전량 데이터는 전력 수요 예측과 공급 계획 수립에 기초 자료로 활용되며, 운전 시간을 분석하여 설비의 수명 연장 및 예방 정비 계획을 수립하는 데 기여할 수 있습니다.제공항목은 연월,운전시간,발전량,소내소비,역일평균전력,발전 열효율,소내소비전력율,역일이용율,발전단 연소비율 입니다.
