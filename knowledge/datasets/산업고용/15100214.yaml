summary_user: 2024년 제주 지역 전력시장에 참여하는 발전기의 전력거래량 합계를 일별·시간대별, 연료원별(태양광, 풍력, LNG, 유류, 기타 신재생, 기타)로 MWh 단위로 담은 집계 파일입니다. 분석가가 제주에서 시간대마다 태양광·풍력과 LNG·유류 발전의 거래량 비중이 어떻게 바뀌는지 볼 때 쓴다. 전역 조인 키는 없으므로, 거래일자·거래시간과 연료원 이름을 맞춰 같은 기관(한국전력거래소)의 시간대별 거래량·SMP 자료와 이어 쓴다.
description_portal: "ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 \"전력시장 운영 업무\"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 \"전력계통 운영 업무\"등을 전담하고 있습니다.ㅇ 해당목록은 2024년 제주 지역의 전력시장에 참여하는 발전기의 연료원별(신재생(태양광), 신재생(풍력), LNG, 유류, 신재생(기타), 기타) 일별 시간대별 전력거래량 합계 자료입니다.단위 : MWh* 해당목록은 한국전력거래소_지역별 시간대별 전력거래량에서 연간으로 제공합니다.* 본 데이터는 전력시장에 참여하는 발전기의 전력거래량으로, 전기사업법 시행령 제19조 1항 2호에 따라 한국전력공사와 직접 거래하는 발전기, 자가용 등은 포함하지 않습니다.전력거래량은 소내용 및 주변압기 손실분 등을 제외한 송전단 기준 발전량이며, 수정정산 등에 의해 값이 변동될 수 있습니다.* 본 데이터는 '한국전력거래소_제주발전기 연료원 시간대별 전력거래량' 파일 데이터로 통합됨에 따라, 추후 삭제될 예정입니다. (20260819 이후)"
