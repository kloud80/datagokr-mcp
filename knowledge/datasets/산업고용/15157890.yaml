summary_user: 한국지역난방공사가 운영하는 태양광 발전소의 인버터별 발전 실적을 일자·작업시간 단위로 담는 건별 원천 API이며, 응답에는 발전소 이름과 인버팅 후 누적발전량(kWh)이 들어 있다. 에너지 분석가가 "판교 가압장 같은 공사 소유 태양광 설비의 시간대별·계절별 발전량은 어떻게 변하는가"를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 기상 관측이나 전력수급 데이터와는 일자·시간을 기준으로 맞추거나 발전소 이름을 직접 매핑해 이어 쓴다.
limits: 다른 기관 데이터와 공통으로 쓰는 코드 키가 없으므로 발전소 이름이나 같은 기관의 코드로만 연결된다. 개발계정은 하루 1,000회로 호출이 제한되어 있고, 공간 좌표가 없는 비공간 데이터라서 위치 기반 분석에는 따로 매핑 작업이 필요하다.
