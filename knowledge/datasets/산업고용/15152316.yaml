summary_user: KPX교육연구원이 2024년에 개설한 교육과정별로 수강생 한 명 한 명의 수료 여부와 취득점수를 담은 건별 파일(CSV 약 886KB)이며, 사용자 아이디는 가명 처리돼 있다. 교육 담당자나 분석가가 "어느 과정에 수강생이 많고 수료율·평균 점수는 어떤가"처럼 인기 강좌와 성취도를 확인하는 데 쓴다. 이어 쓸 키는 가명 사용자 아이디(kpx_edu_user_id) 하나로, 같은 연구원의 다른 교육 데이터에 같은 키가 있으면 수강생 단위로 연결한다. 지역 코드나 표준 코드표는 없다.
description_portal: 'KPX교육연구원은 전력시장 및 전력계통의 안정적 운영과 업무발전을 위한 교육업무를 전담하고 있습니다. 에너지신산업, 에너지 전환시대를 대비한 다양한 교육과정을 운영하며, 전력산업 환경변화에 대응한 교육과정을 적극 개발∙운영함으로써 ‘친환경 미래를 선도하는 전력 비즈니스 융합 플랫폼’ 구현에 적극 노력하는 한국전력거래소의 교육전문 연구원입니다.ㅇ24년의 개설과정별 수강생들의 수료여부와 취득점수를 제공합니다.ㅇ 해당목록은 사용자의 아이디를 비식별 조치하여 제공한 가명처리 데이터입니다.__생성 및 수집목적__KPX 교육 연구원의 개설과정별 사용자들의 성취도와 만족도를 분석하기 위해 생성되었으며, 더 나은 교육제공을 위해 데이터를 수집하고 있습니다.사용자 아이디는 식별되지 않도록 비식별화하여 제공합니다.__활용성__교육과정별 수강생들의 수, 취득점수, 수료여부 파악을 통해 인기강좌를 확인하고, 수료율 및 성취도 파악에 활용가능합니다.출처 :  KPX 교육연구원'
