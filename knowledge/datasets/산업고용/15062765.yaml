description_portal: 대구광역시 군위군 아이군위 홈페이지내 입점업체 현황(공급사명, 대표자명, 전화번호, 제공상품)입니다. 아이군위 입점업체는 군위군의 농산물 온라인 쇼핑몰인 아이군위(igunwi.gunwi.go.kr)에 입점하여 상품을 판매하는 업체를 의미합니다. 아이군위는 군위군에서 운영하는 쇼핑몰로, 지역 농산물 판매를 통해 농가 소득 증대와 지역 경제 활성화, 생산자와 소비자 모두를 만족시키는 것을 목표로 합니다. 입점업체로는 군위축협 등이 있으며, 8개 읍면에 위치하고 있습니다. 베스트상품으로는 돼지감자, 딸기, 대추스낵, 깐호두, 쌀, 생삼겹살 등이 있습니다.
