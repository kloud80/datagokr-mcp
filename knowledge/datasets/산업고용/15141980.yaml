summary_user: 서울특별시 마포구의 무료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록이며, 인허가일자·영업상태·폐업일자·전화번호·지번/도로명 주소·좌표를 포함한다. 마포구에서 지금 영업 중인 무료직업소개소가 어디에 있고 연락처가 무엇인지 확인하려는 구직자·구인 사업자, 또는 지역 고용서비스 기관의 분포와 개·폐업 추이를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 연결한다.
description_portal: 서울특별시 마포구의 무료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소에 대한 정보에 대한 설명입니다. 이 데이터에는 각 소개소의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 소개소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 구직자, 구인 기업 및 행정기관은 공신력 있는 무료직업소개소의 위치와 운영 현황을 쉽게 확인하고, 일자리 지원 및 취업 정책 수립에 효과적으로 활용할 수 있습니다.
