description_portal: 대전광역시 수요자원 거래시장 자료는 기관 및 일반 소비자가 평소보다 전력을 절약하겠다고 중계업자(수요관리사업자)와 사전에 계약을 맺고, 실제로 절약한 전기량을 시장에 판매할 수 있도록 한 제도를 다루고 있습니다. 참여자는 전기를 아낀 만큼 그 절감분을 전력 거래소에 판매해 금전적으로 보상 받을 수 있으며, 수요관리사업자는 이 절감량을 여러 고객으로부터 모아 전력 시장에 입찰합니다. 제도는 전력피크시간대 부하를 줄이고, 발전 설비와 송전 설비 추가 투자를 억제하며, 에너지기업·산업시설·일반가정 등 다양한 주체의 수요 자원 발굴과 자발적 참여를 활발하게 유도합니다. 대형 사업장에서 가정에 이르기까지 참여 영역이 지속적으로 확대되고 있고, 운영 프로그램도 다양화됨에 따라 시장 경쟁성과 에너지 효율, 경제·환경 효과 등이 증대됩니다.
