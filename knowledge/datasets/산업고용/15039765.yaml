summary_user: 한국전력공사가 운영하는 전기차 충전소 수량을 지역별로 2016년부터 2025년까지 연도 열로 나란히 담은 집계표로, 개별 충전소 위치나 ID가 아닌 지역×연도 합계이며 파일 크기는 883바이트로 작다. 지역별 한전 충전소가 해마다 얼마나 늘었는지, 지역 간 설치 편차와 증가율은 어떤지를 보려는 분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 지역명(지역)을 시도 이름 매핑으로 맞춰 전기차 등록 대수 같은 다른 지역별 통계와 이어 쓴다.
description_portal: 한국전력공사에서 운영중인 지역 및 연도별 전기차 충전소 현황 정보 입니다.2016년부터 2025년까지 집계된 연도마다 지역별로 설치되어있는 전기차 충전소 수량에 대한 데이터입니다.해당 데이터를 통하여 각 지역의 충전소 수, 수량의 증가 추이를 통해 전기차 보급 확대와 관련하여 인프라 구축의 흐름을 파악하는데 기여할 수 있을 것입니다.또한 지역간의 충전소 설치 편차나 성장률을 비교함으로써  내부 의사 결정 또는 인프라 투자 방향 설정에 실질적인 참고 자료로 활용 할 수 있습니다.
