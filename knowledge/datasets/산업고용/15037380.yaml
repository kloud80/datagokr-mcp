summary_user: 국가인적자원개발 컨소시엄(중소기업 재직자 공동훈련 등) 훈련과정을 과정·회차 단위로 담은 목록 API로, 과정명·훈련기관·주소·연락처·훈련 시작·종료일·훈련대상·정원과 실제 참여 인원·NCS 코드 등을 전국 범위로 제공한다. 중소기업 재직자나 인사담당자가 "우리 지역에서 언제 시작하는 어떤 컨소시엄 공동훈련 과정에 직원을 보낼 수 있나"를 찾는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않아, NCS 코드(ncsCd)를 NCS 코드 마스터에 맞추거나 훈련과정 ID·훈련기관 코드로 같은 기관(고용24)의 다른 직업훈련 과정 데이터와 이름·코드로 연결해 쓴다.
description_portal: '[국가인적자원개발 컨소시엄 훈련과정 API - 목록]국가인적자원개발 컨소시엄 훔련과정을 대상으로 실시하는 훈련과정 API를 이용할 수 있습니다. 국가인적자원개발 컨소시엄중소기업 재직근로자의 직업훈련 참여 확대와 신성장동력분야, 융복합분야 등의 전략산업 전문인력육성, 산업계 주도의 지역별 직업훈련기반 조성 등을 위해 다수의 중소기업과 훈련 컨소시엄(협약)을 구성한 기업 등에게 공동훈련에 필요한 훈련 인프라와 훈련비 등을 지원하는 사업입니다지역산업맞춤형 인력양성 사업지역·산업계 중심의 지역인적자원개발위원회(RSC)를 설치하고 RSC별로 훈련수급조사를 실시 → 훈련수요·공급 현황 분석 → 지역인력양성기본계획 수립 → 지역공동훈련센터를 통한 공동훈련 → (채용예정자)취업 연계 등에 이르는 지역·산업 맞춤형 인력양성체계를 구축합니다.산업계 주도 청년 맞춤형 훈련산업별 협회·단체가 주도하여 훈련 전과정에 대해 기업의 수요를 반영하고 산업계에서 필요로 하는 훈련을 제공하여 양질의 일자리를 얻을 수 있도록 지원합니다대중소공동 훈련중소기업과 협약을 체결하여 이들 중소기업에 대한 체계적이고 지속적인 직업능력개발 지원을 목적으로 하는 컨소시엄 사업 입니다.'
