description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 추진한 에너지기술개발사업의 연도별, 세부사업별, 과제유형별 통계 정보를 집약한 공공 데이터입니다. 본 데이터는 이러한 사업의 규모와 특징을 객관적인 수치로 보여줌으로써, 에너지 R&D 정책 및 동향 분석에 필요한 기초 자료를 제공합니다.제공되는 정보는 2012년부터 2022년까지 11년간 수행된 에너지기술개발사업의 전체 과제를 대상으로 하며, 각 과제를 연도, 세부사업명, 그리고 과제유형(예: 중장기, 장기, 단기)별로 분류하여 그 수를 제공합니다.'
