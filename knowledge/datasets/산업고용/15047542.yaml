description_portal: 중소벤처기업진흥공단에서 운영 중인 회생컨설팅 지원현황을 지역별로 나타낸 데이터로 본 데이터를 통해 회생지원사업 현황을 참고할 수 있습니다.세부사항은 다음과 같습니다.1) 2013년~2024년 연간 지원현황 자료가 포함되어있습니다. 2) 지역 단위는 광역 지자체 단위 기준입니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.
