description_portal: 본 데이터는 연구개발(R&D) 지원사업을 대상으로 연도별 연구비 예산 금액과 참여 기업 수를 집계해 제공하는 CSV 통계 자료입니다. 각 연도에 대해 연구비 예산이 총액 기준으로 정리되어 있어 정부·공공기관의 R&D 재정 투입 규모가 어떻게 구성되는지 확인할 수 있으며, 같은 기준에서 해당 연도에 과제 또는 사업에 참여한 기업 수가 함께 제공되어 산업계 참여 수준을 동시에 파악할 수 있습니다. 즉, 예산 규모(재원 투입)와 기업 참여(수요·참여 기반)를 한 표에서 비교할 수 있어 연도별 변화 흐름을 읽는 데 유용합니다.이 자료는 정책·기획 업무에서 연도별 예산 증감과 참여 기업 수의 동반 변화 여부를 점검하거나, 예산 확대가 기업 참여 확대로 연결되는지 같은 기초적 관계를 살펴보는 데 활용할 수 있습니다. 연구자·분석가는 연도별 수치를 기준으로 투자 방향성 변화나 참여 기반의 확대·축소를 정리할 수 있으며, 산업계 관점에서는 공공 R&D 참여 환경의 규모감과 참여 추이를 파악하는 참고자료로 사용할 수 있습니다. 또한 예산 총액과 참여 기업 수가 함께 제공되므로, ‘기업 1곳당 평균 예산 수준’처럼 파생 지표를 계산해 연도별 비교를 수행하는 등 추가 분석의 출발점 자료로도 활용 가능합니다.
