description_portal: 본 데이터는 한국중부발전이 국내외에서 운영 중인 신재생에너지 기반 신사업 현황을 정리한 자료입니다. 항목은 구분, 사업명, 설비용량(MW), 지분율(%), 투자금액으로 구성되어 있으며, 설비용량은 메가와트 단위, 지분율은 퍼센트 단위로 제공됩니다. 투자금액은 국내의 경우 억 원, 해외의 경우 백만 달러 단위로 구분되어 기록됩니다. 해당 자료는 풍력 및 태양광 중심의 발전사업 현황, 지역별 사업 포트폴리오, 중부발전의 재생에너지 투자전략을 파악하는 데 활용합니다. 또한 민관협력 구조, 사업별 참여 비율, 에너지 자산 확대 전략 분석 등에도 활용 가능합니다.
