description_portal: 중소벤처기업진흥공단 기업인력애로센터에서 인력지원 사업의 일환으로 운영 중에 있는 대·중소기업 상생 일자리 프로그램 입교생 현황입니다. 사업단은 대기업 및 중견기업으로 이루어져 있으며, 사업단명, ㅛ육시작일, 교육종료일 등의 데이터를 포함하고 있습니다.대·중소기업 상생 일자리 프로그램은 대기업과 중견기업의 우수한 교육·훈련 인프라를 활용하여 청년 구직자에게 직무교육을 실시하고 그 이후 대·중견기업 협력 중소기업에 취업연계를 지원하는 사업입니다. 참여 사업단에게는 교육과정 운영 및 취업연계 소요비용을, 교육에 참여한 구직자는 교육기간 내 훈련수당을 지원합니다.
