description_portal: '세계 각국의 원전 운영 현황을 보여주는 데이터입니다.IAEA(International Atomic Energy Agency) 발표기준 국가별 원전의 운영(운영 중 원자로, 설비용량), 건설(건설 중 원자로, 설비용량) 및 폐쇄 현황(폐쇄된 원자로, 설비용량) 등을 포함하고 있는 데이터 입니다.(단위 개수, MW)해당 자료는 2025년 7월 1일 기준으로 작성되었습니다.[전세계 원전 현황 요약("25.7.1 IAEA Pris 기준)]1. 운영현황 : 32개 국가에서 416기의 원자로가 운영 중(설비용량 : 376 GW)2. 건설현황 : 62기 원전 건설 중(설비용량 : 65GW)*건설 착수 시점은 최초 콘크리트 타설 기준입니다.3. 영구정지 현황 : 209기 원전 영구정지(설비용량 : 104GW)자세한 사항은 IAEA 홈페이지(https://pris.iaea.org/pris/) 참고 바랍니다.'
