summary_user: 전주시 안에 설치된 태양광 발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 발전소명·설치장소·설비용량(kW)·허가일·사업개시일을 담는다. 에너지 정책 담당자나 연구자가 전주시 어느 지역에 어느 규모의 태양광 발전소가 언제 허가되고 가동을 시작했는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 전국태양광발전소전기사업허가정보 표준데이터 같은 다른 자료와는 발전소명이나 설치장소 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '전주시내에 설치된 태양광 발전설비 및 발전량에 대한 데이터입니다전북특별자치도 전주시 태양광발전소 현황으로 발전소명, 설치장소, 설비용량, 허가일, 사용개시일을 제공합니다.제공부서 : 기후변화대응과전주시 내 태양광 발전소의 설치 현황 및 운영 시점을 파악 가능하며,  설비용량 및 위치 정보를 통해 에너지 정책, 도시계획, 환경 연구 등에 활용가능함.이 데이터는 전주시의 신재생에너지 인프라 현황을 체계적으로 보여주는 자료로, 정책 수립이나 연구 분석에 중요한 기반이 될 수 있습니다'
