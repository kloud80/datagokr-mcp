description_portal: '제주특별자치도에 소재하고 있는 승강기 유지관리 업체와 관련한 데이터를 제공합니다.항목: 사업장명, 주소, 전화번호, 인허가일자 등*「승강기 안전관리법」에 의거하여 승강기가 그 설계에 따른 기능 및 안전성을 유지할 수 있도록 주기적인 점검, 승강기 또는 승강기부품의 수리, 승강기부품의 교체, 그 밖에 행정안전부장관이 승강기의 기능 및 안전성의 유지를 위하여 필요하다고 인정하여 고시하는 안전관리 활동을 행함자세한 사항은 지방행정인허가 데이터개방에서 확인하시기 바랍니다.https://www.localdata.go.kr/data/dataView.do'
