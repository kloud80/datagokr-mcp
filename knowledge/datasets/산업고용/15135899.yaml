summary_user: 골재자원조사 중 굴착장비로 일정 구간을 파내 단면을 조사한 트렌치조사 지점을 지점별로 담은 전국 범위 파일(csv, 약 20KB)로, 일련번호·조사지역명·주소·위도·경도·조사지점명을 담는다. 골재 채취 후보지를 검토하는 사업자나 분석가가 '어느 지역에서 트렌치조사가 이뤄졌고 그 지점이 정확히 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 골재자원조사(시추조사 등)나 토석채취 허가 자료와는 조사지역명·주소 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
