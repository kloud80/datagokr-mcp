description_portal: 트렌치조사는 육상 또는 산림 골재자원조사 시에 수행하며, 조사대상지를 굴착장비를 이용하여 일정한 구간을 파내어 2차원적인 단면정보를 정밀하게 조사하는데 목적이 있음, 시추조사는 깊은 심도를 대상으로 하나 조사면적이 코어구경으로 제한되나, 트렌치조사는 심도는 낮으나 넓은 면적을 한번에 확인할 수 있는 장점이 있음, 이러한 트렌치조사는 기반암의 지질구조를 정밀하게 파악하여 기반암의 연장성 및 방향성을 확인하여 기반암의 규모를 보다 정밀하게 제시할 수 있음, 또한 심도에 따른 퇴적층의 구성성분 및 입도변화를 파악할 수 있어 채석대상 심도를 파악하는데 유리함
