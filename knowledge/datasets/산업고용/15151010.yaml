summary_user: 한국동서발전이 시도별·예측시각별로 산출한 태양광 발전량 예측값을 담은 파일로, 기준일자·기준시각마다 기온·습도·풍속·일사량 예측값과 계량·소비자발전·전력구매계약별 설비용량(MW)·발전량 예측값(MWh)을 함께 담는다. 전력 분석가나 연구자가 '내일 특정 시도의 시간대별 태양광 발전량이 얼마나 될까'를 가늠하거나 기상 조건과 발전량의 관계를 분석하는 데 쓴다. 전역 조인 키는 없어서 시도명과 일자·시각을 이름으로 맞춰 전력거래소 수급·발전원별 발전량이나 기상 자료와 이어 쓴다.
description_portal: 한국동서발전에서 제공하는 전국 태양광 발전량 예측값 공개용 데이터는 지역별, 시간대별 태양광 발전량을 예측하기 위해 구축된 자료입니다. 데이터는 기준일자·기준시각을 중심으로 시도명, 예측일자, 기온, 습도, 풍속, 일사량 예측값, 설비용량(MW), 발전량 예측값(MWh) 등의 항목으로 구성되어 있으며, 실시간 기상 조건과 설비 특성을 반영해 예측 정확도를 향상시킨 것이 특징입니다. 해당 데이터는 재생에너지 발전 예측, 전력 수급 계획 수립, 에너지 시장 수요 분석 등에 활용될 수 있습니다. 학계와 연구기관에서는 AI 기반 에너지 예측모델 연구, 기상·발전 상관성 분석, 지역별 재생에너지 분포 연구, 전력계통 안정성 평가 등 다방면의 실증적 연구에 적용할 수 있으며, 국가 에너지 정책 수립의 기초자료로도 가치가 높습니다.
