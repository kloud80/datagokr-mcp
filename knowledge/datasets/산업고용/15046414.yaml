description_portal: '○ 통계개요* 통계명 : 종사상지위별 취업자* 통계종류 : 서울시 경제활동참가자 중 종사상지위별 취업자 현황을 제공하는 지정통계* 작성목적 : 국민의 경제활동 즉 국민의 취업, 실업 등과 같은 경제적 특성을 조사하여거시 경제분석과 인력자원의 개발정책 수립에 필요한 기초자료인 노동공급,고용구조, 가용노동시간 및 인력자원 활용정도를 제공하고 정부의 고용정책입안 및 평가에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 지방통계청 → 통계청* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울시 경제활동참가자 중 취업자의 종사상 지위별, 성별 현황○ 용어설명* 종사상지위 : 취업자가 실제로 일하고 있는 신분 또는 지위상태를 말함- 자영업자 : 고용원이 있는 자영업자 및 고용원이 없는 자영업자를 합친 개념임- 무급 가족종사자 : 동일가구내 가족이 경영하는 사업체, 농장에서 무보수로 일하는사람을 말하며, 조사대상 주간에 18시간 이상 일한 사람은 취업자로 분류- 상용근로자 : 고용계약설정자는 고용계약기간이 1년 이상인 경우이며, 고용계약미설정자는 소정의 채용절차에 의해 입사하여 인사관리 규정을 적용받는 사람- 임시근로자 : 고용계약설정자는 고용계약기간이 1개월 이상 1년 미만인 경우이며,고용계약 미설정자는 일정한 사업(완료 1년 미만)의 필요에 의해 고용된 경우- 일용근로자 : 고용계약기간이 1개월 미만인 자 또는 매일매일 고용되어 근로의대가로 일급 또는 일당제 급여를 받고 일하는 자 등'
