summary_user: 서울시 상권분석서비스의 직장인구를 분기(STDR_YYQU_CD)별·시도 단위로 집계해, 총 직장인구와 남녀별, 10대부터 60대 이상까지의 연령대별, 성별×연령대별 인원수를 담는다. 상권 분석가나 창업 준비자가 서울 전체 직장인구에서 특정 성별·연령대가 분기마다 어떻게 늘고 줄었는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 기준 년분기 코드와 시도 코드(MEGA_CD)를 같은 기관의 상권분석서비스 계열 데이터와 이름·코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 서울시에 거주하거나 종사하는 외국인 근로인구 현황을 분기별로 수집하여 제공하는 공공데이터입니다. 전체 근로인구 규모와 함께 남성과 여성 인구를 구분하고, 10대부터 60대 이상까지 연령대별 세부 분포를 포함하고 있어 다양한 관점에서 분석이 가능합니다. 이를 통해 특정 시점의 외국인 근로인구 변화 추이를 확인할 수 있으며, 노동시장 구조, 산업별 인력 수요, 지역사회 내 외국인 비중 등을 파악할 수 있습니다. 또한 외국인 근로자를 대상으로 한 정책 수립, 복지 및 지원 서비스 마련, 도시계획 및 사회통합 전략 수립 등에 활용될 수 있는 중요한 기초 자료입니다.
