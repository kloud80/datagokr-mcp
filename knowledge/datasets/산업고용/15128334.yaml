description_portal: '한국디자인진흥원이 심사 및 선정하는 글로벌생활명품 선정기업과 선정제품의 정보입니다. 2014년부터 2024년까지 선정제품에 대한 선정년도, 분야, 기업명, 대표상품명, 주소 및 폐업여부 정보를 제공합니다.한국디자인진흥원은 수출 역량을 갖춘 국내 중소·중견기업의 프리미엄 소비재 상품을 집중 발굴, 마케팅·유통, 해외 진출 등 지원을 통해 세계적인 명품으로 육성하기 위해 2014년부터 디자인, 수출 마케팅, 유통, 홍보·해외 진출 등 다양한 지원을 통해 국내 우수 디자인·생활 소비재를 세계적인 명품으로 육성하고자 글로벌 생활명품을 선정함. 선정기업에는 상품 특성 및 기업 수요를 반영한 국내외 유통과 해외 마케팅 사업과 연계한 수출 마케팅 등을 지원하고 있습니다. *대상 품목: 15대 소비재(가구, 가방, 주얼리, 문구, 미용 기기, 소형가전, 시계, 신발, 악기, 안경,  완구, 운동 레저용품, 위생용품, 의류, 주방용품)'
