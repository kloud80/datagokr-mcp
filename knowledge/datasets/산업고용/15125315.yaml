summary_user: 한국남부발전(주)이 가입한 신재생에너지분야 협회 목록을 연도별로 조회하는 API로, 협회 한 곳당 한 건씩 가입연도·협회명·법적근거·협회성격·홈페이지를 담는다. 한국남부발전이 어느 해에 어떤 신재생 관련 협회·단체에 어떤 자격으로 참여하고 있는지 확인하려는 분석가나 기관 대외활동을 살펴보는 사용자가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 협회명 같은 이름 매칭이나 같은 기관(한국남부발전) 기준으로만 연결한다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 신재생에너지분야 협회 가입현황 정보조회 서비스_GW 서비스입니다.해당 API를 통해 사용자는 조회를 희망하는 연도(year)를 입력하고 해당 연도의 한국남부발전(주)이 가입한 신재생에너지분야 협회 가입정보를 조회할 수 있습니다. 조회 가능한 정보로는 가입연도, 가입한 협회명, 협회 홈페이지, 협회 자격(정회원 등) 등 세부사항을 조회할 수 있습니다.
