summary_user: 한전KPS가 국내에서 정비를 맡고 있는 발전설비를 발주사와 발전호기 단위로 한 줄씩 나열한 전국 현황 목록으로, 번호·발주자·호기명만 담은 작은 CSV 파일(약 14.6KB)이다. 발전정비 사업자나 분석가가 "어느 발전사의 어떤 호기가 한전KPS 정비 대상인가"를 확인하고, 예방·긴급정비 수요를 가늠하는 데 쓴다. 실측 조인 키는 호기명(kps_unit_nm) 하나이며, 이를 매개로 발전기 종류·용량·제조사 같은 발전소 설비 원장과 이어 쓴다. 다만 코드표는 없어 표기 일치를 직접 맞춰야 한다.
description_portal: 한전KPS(주) 국내에 위치한 발전정비 현황에 관한 데이터입니다. 발주사명과 발전호기명 등의 정보를 포함하고 있으며, 국내 발전 정비 사업 현황을 한눈에 파악할 수 있습니다. 이를 통해 예방정비 및 긴급정비 수요를 예측할 수 있으며, 해당 데이터를 활용해 발전기 종류, 용량, 제조사 정보과 연계하면 성능개선 또는 친환경 전환 필요 설비 대상 선정, 부품 표준화, 기술 호환성 분석 등에 활용할 수 있습니다.해당 자료는 회사정보보호규정(정보등급분류기준) 및 기술정보관리지침(기술정보등급분류기준)에 의거 사외공개 가능한 기술자료로 데이터 변동이 있을 시에 현황 자료로 갱신하여 공개할 예정입니다.
