description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터 JDC에서 운영하는 JDC 지정면세점의 국적별 이용객 수 및 매출 현황을 월별로 집계한 자료입니다. 데이터 항목은 구분, 1월부터 12월까지의 이용객 수, 1월부터 12월까지의 순매출로 구성되어 있으며, 각 월별로 이용객 수 다음에 해당 월의 순매출이 나열되는 구조입니다. 구분 항목은 내국인, 일본인, 중국인, 동남아, 기타, 대만, 미국인, 러시아인, 태국인, 홍콩인, 필리핀인, 해외교포 등으로 국적별로 세분화되어 있으며, 이를 통해 다양한 국가 및 지역 방문자의 소비 성향을 비교 분석할 수 있습니다. 본 데이터는 면세점 이용 패턴을 국적별로 파악하고, 국가별 마케팅 전략 수립, 관광객 소비 트렌드 분석, 국적별 매출 기여도 산출 등 다양한 행정 및 마케팅 목적으로 활용될 수 있는 유용한 자료입니다.
