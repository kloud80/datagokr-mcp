summary_user: 대구광역시 서구 관내 가스사업자를 업소 한 곳당 한 줄로 담은 명부 파일(csv, 약 2.5KB)로, 업종(가스판매소·충전소 구분), 상호, 소재지, 전화번호, 취급 가스종류(LPG·고압가스·CNG 등)를 담는다. 주민이나 사업자가 '서구에서 LPG를 파는 판매소나 충전소가 어디에 있고 연락처가 무엇인지' 찾을 때, 또는 분석가가 구 단위 가스 업종 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호를 이름 매칭해서 잇는다. 같은 대상을 다루는 LOCALDATA 에너지 업종 인허가 원장이나 다른 구의 가스사업자 현황과도 같은 방식으로 맞춰 본다.
description_portal: 대구광역시 서구의 가스 사업자 현황입니다. 가스 사업 업소명, 소재지, 전화번호, 취급가스의 종류 등의 데이터를 포함하고 있습니다.본 데이터는 대구광역시 서구 관내에서 운영 중인 가스사업자의 현황을 상세히 수록한 자료이다. 순번, 업종, 상호, 소재지, 전화번호 및 가스종류 항목으로 구성되어 있으며, 각 사업자의 위치와 연락처, 취급하는 가스종류를 명확히 확인할 수 있다. 해당 자료는 가스판매소 및 가스충전소를 구분하여 제공하며, LPG, 고압가스, CNG 등 다양한 가스 종류를 포함하고 있어 지역 내 가스 관련 사업 현황 파악에 유용하다. 이 데이터는 공공서비스 개선과 지역 안전관리, 산업분석 및 민원처리 지원을 목적으로 개방되었으며, 이용자가 쉽게 검색하고 이해할 수 있도록 상세한 설명과 키워드를 포함하였다. 대구광역시 서구 가스사업자 정보를 체계적으로 제공함으로써 관련 부서 및 시민에게 신속하고 정확한 정보를 전달하는 데 기여한다.
