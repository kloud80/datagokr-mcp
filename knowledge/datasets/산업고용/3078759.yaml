summary_user: 부산광역시 사상구 관내 임대사업자의 등록 건을 담는 파일로, 등록번호·사업자구분·임대주택구분·유형·면적과 임대물건의 도로명주소를 개별 주소 단위로 수록한다. 사상구에서 개인·법인 임대사업자 등록 임대주택이 어느 지역에 어떤 유형과 면적으로 분포하는지 보려는 주거정책 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 도로명주소를 주소·좌표로 매핑하거나 같은 기관(사상구) 자료로만 연결한다.
description_portal: 이 데이터는 부산광역시 사상구 관내 임대사업자에 대한 유형별 현황(사업자구분, 등록번호, 임대물건소재지, 유형 현황 등)을 수록한 통계자료입니다. 해당 데이터를 통해 임대주택 공급 및 시장 구조를 분석하고, 공공임대주택 정책 및 민간 임대사업자 관리의 기초자료 등으로 활용될 수 있습니다. 해당 자료는  공급 유형별 현황 파악에 유용하며, 법적 유형에 따라 분류된 정보는 행정 관리와 정책 평가의 핵심 지표로 활용 가능합니다.해당 자료는 주거복지 실현과 임대주택 안정화 정책 수립에 기여할 수 있으며, 정기적으로 갱신할 예정으로 최신 현황을 반영하고자 합니다.
