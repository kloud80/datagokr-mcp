description_portal: '- 재직인원 20인 이상 기업 중 전라남도에서 지정한 일자리 우수기업(2022년 지정, 2020년 지정 후 2022년 재인증) 현황- 전라남도는 고용 안정과 일자리 창출에 기여한 기업을 대상으로 일자리 우수기업 인증사업을 운영하고 있습니다. 이 사업은 2015년부터 시행되어, 근로자 수 증가, 청년 근로자 비율, 고용 유지율, 정규직 비율, 복리후생 등 다양한 기준으로 기업을 평가하여 인증합니다.- 전라남도의 일자리 우수기업 선정 기준은 다음과 같습니다. - 일자리 창출 분야: 최근 1년간 근로자 수 증가, 청년 근로자 증가율, 추가 고용 계획 등- 고용 안정 분야: 최근 2년간 고용 유지율, 정규직 비율, 직원 복리후생, 근로기준법 준수 등- 이러한 기준을 통해 근로자의 고용 안정과 일자리 창출에 이바지한 우수한 기업을 지원하고 있습니다.'
