summary_user: 부산광역시 수영구에 등록된 직업소개소를 한 곳당 한 행으로 담은 파일로, 유료·무료 구분, 상호(법인명), 대표자명, 사업소 연락처, 도로명주소가 들어 있다. 수영구에서 구직이나 구인을 하려는 주민·사업자가 근처의 무료 직업소개소나 연락 가능한 소개소를 찾을 때 쓰고, 분석가가 구 단위 고용 서비스 기관 분포를 볼 때도 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 상호명이나 도로명주소를 맞춰 보는 방식으로만 연결한다.
description_portal: '부산광역시 수영구에 등록된 직업소개소 현황으로, 등록 직업소개소의 명칭, 등록 직업소개소의 주소, 등록 직업소개소의 대표자 성명, 등록 직업소개소 연락처 등의 자료를 제공합니다.1. 유/무료 구분 : 직업소개소 운영 방식(무료/유료)2. 직업소개소명 : 직업소개소 상호명3. 대표자명 : 직업소개소 대표자의 성명4. 사업소 전화번호 : 연락가능한 직업소개소 전화번호5. 도로명주소 : 직업소개소 소재지 주소* 일부 사업소 전화번호는 개인정보 포함으로 미기재하였습니다.* 공공데이터 현행화 및 업데이트 주기는 1달입니다.'
