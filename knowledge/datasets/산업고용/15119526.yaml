summary_user: 한국서부발전 석탄화력발전소의 탈황설비에서 부산물로 나오는 석고의 발생량·재활용량(톤)과 재활용률을 월별·발전소별로 집계한 파일(CSV, 약 9KB)이다. 발전소 환경관리 분석가나 자원순환 정책 담당자가 '서부발전 발전소별 탈황석고 재활용률이 월마다 어떻게 변하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 발전공기업(남동·남부·동서·중부)의 같은 표준 데이터나 발전소 배출 측정 자료와는 년월·발전소명 이름을 맞춰 이어 붙인다.
description_portal: 한국서부발전의 (발전공기업 표준) 탈황석고 현황  데이터 입니다. 석탄화력발전소에서 배출되는 황산화물을 저감하기 위해 운영되는 탈황설비에서 부산물로 발생하는 석고의 발생 및 활용 현황을 집계한 자료입니다. 이 데이터에는 월별 및 발전소별 탈황석고 발생량 및 재활용량, 재활용률 등이 포함됩니다. 탈황석고는 주로 시멘트 원료, 석고보드, 건축자재 등으로 재활용되며, 자원순환 차원에서 중요한 가치를 지닙니다. 현황 데이터를 분석하면 발전소의 환경관리 성과, 자원활용 효율, 순환경제 기여도를 정량적으로 평가할 수 있습니다.- 발전공기업(남동, 남부, 서부, 동서, 중부) 표준 데이터 입니다.
