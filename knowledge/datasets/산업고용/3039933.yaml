description_portal: 'ㅇ경기 동향에 대한 기업가들의 판단.예측.계획의 변화추이를 관찰하여 지수화한 지표 (업종분류, 매년 각 분기별 현황 및 전망 등)- 조사항목: 산업별 시황과 개별 기업들의 경영 실적(매출, 국내시장출하 수출 등) 및 경영활동(재고, 설비투자 설비 가동률, 고용), 외부여건(원자재가격, 자금사정, 제품가격) 등 - 주요목적:  국내 제조업의 업종별/지역별 경기 판단 및 관련 동향 분석 업무를 수행하는데 일조하기 위하여 국내 사업체들의 체감경기 변화를 신속하고 정확하게 파악하는데 있음 ㅇ 궁극적으로 제조업경기조사는 국내 제조업체들을 대상으로  구조화된 표본 집단을 구축하고, 국내 제조업 주요 업종들의 경기 동향을 정기적으로 파악하기 위한 조사 수행 및 통계, 정보 자료의 분석과 제공 등을 목적으로 수행함'
