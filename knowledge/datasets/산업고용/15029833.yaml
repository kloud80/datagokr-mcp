summary_user: 경기도 광주시에 있는 고압가스 저장소를 업체(상호명)별로 한 건씩 담은 원천 목록으로, 소재지 주소·저장 가스 종류·인허가 연도·데이터 기준일자를 담는다(파일 크기 약 1KB의 소규모 CSV). 주민이나 안전관리 담당자가 '우리 동네 근처에 어떤 고압가스 저장소가 있고 무슨 가스를 저장하나'를 확인하거나, 재난 대응 계획에서 위험시설 위치를 파악할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소나 상호명을 맞추거나 같은 시군(시군명) 단위로만 이어 쓰며, 다른 시군의 고압가스·LPG 인허가 현황과 지역 단위로 견주는 데 쓴다.
description_portal: 본 데이터는 경기도 광주시에 위치한 고압가스 저장소의 현황 정보를 제공합니다. 산업 및 생활용으로 사용되는 고압가스를 저장하는 시설의 위치와 관리 정보를 담고 있어 안전 관리에 활용됩니다. 상호명은 저장소 운영 업체의 명칭이며, 소재지는 저장소의 위치를 제공합니다. 고압가스 종류는 저장되는 가스의 유형을 나타내고, 인허가 년도는 저장소 설치 허가 시점을 표시합니다. 데이터 기준일자는 정보의 최신성을 확인할 수 있습니다. 본 데이터는 위험물 안전 관리, 가스 시설 감독, 안전사고 예방, 재난 대응 계획, 산업 안전 정책 수립 등에 활용됩니다.
