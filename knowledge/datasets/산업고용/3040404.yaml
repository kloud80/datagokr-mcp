summary_user: '경상남도 양산시에서 담배소매업으로 신규 지정되거나 폐업한 영업소를 건별로 담은 파일(csv, 약 67KB)로, 업소명·소재지 주소·기준일을 담는다. 양산시 안에서 담배 판매점이 어느 동네에 새로 생기거나 문을 닫았는지, 학교 주변 등 특정 지역에 점포가 몰려 있는지를 보려는 분석가·행정 담당자가 쓴다. 실측 컬럼에 사업자번호나 표준 코드 같은 공통 조인 키가 없어, 다른 데이터와는 소재지 주소를 지오코딩하거나 업소명·주소를 맞춰 보는 방식으로 이어 쓴다(예: 지방행정 인허가 담배소매업 원장, 소상공인 상가업소 정보).'
description_portal: 양산시에 등록되어 운영중인 담배소매업 신규지정 및 폐업현황 공공데이터입니다. 업소명, 업소 소재지 현황을 확인할 수 있습니다.이 데이터는 담배소매업으로 신규 지정된 영업소의 기본 정보를 제공하는 행정·통계 기반 자료로서, 각 점포의 영업소명과 소재지 정보를 포함한다. 신규 점포의 위치 및 증가 현황을 통해 특정 지역의 소매업 밀집도 변화, 신규 상권 형성 여부, 지역별 담배 판매점 분포의 편중 여부 등을 분석할 수 있다. 또한 교육시설 보호구역(학교 주변) 내 점포 분포 검토, 취약지역 관리, 인근 지역의 인구·상권 변화에 따른 신규 지정 건수 추정, 민원 발생 지역의 신규 점포 집중 여부 파악 등 정책적 활용이 가능하다. GIS 기반 지도분석과 연계할 경우 지역별 지정 현황을 직관적으로 파악할 수 있으며, 각종 도시계획·상권관리 업무의 기초자료로 활용될 수 있다.
