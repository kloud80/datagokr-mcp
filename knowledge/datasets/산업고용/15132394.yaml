description_portal: 신용보증재단중앙회의 재보증기업의  손익계산서에서 매출원가를 구성하는 내용을 재료비, 노무비, 제조경비등으로 구분하여 당기 완성품의 제조원가를 나타냅니다. 기업을 특정할 수 없도록 일부 정보를 삭제하면서 임의의 고유번호를 부여하여 비식별처리 하였습니다.기초원재료재고금액, 기말원재로재고금액, 당기원재료매입금액 등의 정보가 포함되어 있으며 제조업 등록 기업에 한해 존재하는 정보로, 재보증 심사 관련 목적으로 수집된 통지용 제조원가명세서 데이터입니다.재보증이란, 신용보증재단중앙회(재보증기관)가 원보증기관인 지역신용보증재단이 소상공인에 대하여 보증한 금액의 일정비율을 재보증하고, 원보증기관이 금융기관에 대위변제 후 회수하지 못한 채권에 대하여 재보증비율에 해당하는 금액을 신용보증재단중앙회(재보증기관)가 지역신용보증재단(원보증기관)에 지급하는 제도입니다.
