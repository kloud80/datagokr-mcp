summary_user: 워크넷이 운영하는 직업지도 시범학교로 지정된 학교를 한 행씩 담은 CSV 파일로, 기관코드·학교명·주소·선정일자와 순번·담당 상담원 ID·지도 대상 학년(텍스트)·대상 인원 수·시범학교 구분코드를 담는다. 진로교육 담당자나 정책 분석가가 '우리 지역에서 직업지도 시범학교로 지정된 학교는 어디이고 몇 학년 몇 명을 대상으로 하는가'를 확인하거나 지역·학교 유형별 시범운영 현황을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학교명·주소 매칭이나 같은 기관 내부 코드(기관코드)로만 연결한다.
description_portal: 본 자료는 워크넷에서 운영하는 직업지도 시범학교의 기본 정보를 제공합니다. 시범학교로 지정된 교육기관에 대한 고유 코드, 학교명, 주소, 선정일자 및 순번, 담당 상담원 ID 등 식별 정보와 함께, 실제로 직업지도를 시행하는 학년 정보 및 대상 인원 수가 포함되어 있습니다. 특히 지도대상학년은 텍스트로 제공되어 학교별 맞춤형 진로지도 범위를 파악할 수 있습니다. 자료는 기관별로 수집된 데이터를 기반으로 하며, 시범학교 구분코드를 통해 운영 형태나 목적별 분류가 가능합니다. 직업교육 정책 기획, 시범운영 성과 분석, 지역·학교 유형별 진로지도 확산 전략 수립 등에 기초자료로 활용될 수 있습니다. 행 단위 데이터로서, 다양한 차원의 통계 분석 및 현황 파악에 적합한 구조를 가지고 있으며, 공공 직업지도 정책의 체계적 추진에 기여합니다.
