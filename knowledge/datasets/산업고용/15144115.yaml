description_portal: '본 데이터는 중소벤처기업진흥공단이 운영하는 해상운송 지원사업의 지원 실적을 기반으로, 참여기업의 회차선적연도, 주요 수출제품, 신청연도 등 주요 정보를 정리한 자료입니다.해상운송 지원사업은 글로벌 물류환경 변화와 선복 부족, 해상운임 상승 등으로 물류 부담이 증가한 수출 중소기업을 대상으로 안정적인 해상운송을 지원하여 수출 애로를 해소하고, 지속적인 해외시장 진출을 지원하기 위한 사업입니다.본 데이터는 사업 참여기업의 지원 현황과 수출 품목 특성을 분석할 수 있는 기초자료로서, 연도별 지원 추이, 주요 수출품목 현황 및 정책 수혜기업 특성 분석을 통해 사업 성과를 평가하고 향후 물류 지원정책 수립 및 지원 대상 발굴을 위한 근거자료로 활용될 수 있습니다. 또한 중소기업의 물류 경쟁력 강화와 안정적인 수출 기반 조성에 기여하는 것을 목적으로 합니다.[제공정보]- 업체명- 회차선적연도(2023~2025년)- 주요 수출제품(예: COSMETICS, LAVER, CONSOL 등)- 신청연도※ 사업 관련 정보는 고비즈코리아(GobizKOREA) 홈페이지에서 확인할 수 있습니다.'
