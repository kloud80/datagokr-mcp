description_portal: 한국산업안전보건공단에서 제공하는 안전검사 불합격 정보 자료로대상품, 용량 단위, 불합격 사유내용, 조치사항지시내용 등의 칼럼을 제공합니다. (완료일자 기준 2022년 1월 1일 ~ 12월 31일)*산업안전보건법 제93조(안전검사) ① 유해하거나 위험한 기계ㆍ기구ㆍ설비로서 대통령령으로 정하는 것(이하 “안전검사대상기계등”이라 한다)을 사용하는 사업주(근로자를 사용하지 아니하고 사업을 하는 자를 포함한다. 이하 이 조, 제94조, 제95조 및 제98조에서 같다)는 안전검사대상기계등의 안전에 관한 성능이 고용노동부장관이 정하여 고시하는 검사기준에 맞는지에 대하여 고용노동부장관이 실시하는 검사(이하 “안전검사”라 한다)를 받아야 한다. 이 경우 안전검사대상기계등을 사용하는 사업주와 소유자가 다른 경우에는 안전검사대상기계등의 소유자가 안전검사를 받아야 한다.② 제1항에도 불구하고 안전검사대상기계등이 다른 법령에 따라 안전성에 관한 검사나 인증을 받은 경우로서 고용노동부령으로 정하는 경우에는 안전검사를 면제할 수 있다.③ 안전검사의 신청, 검사 주기 및 검사합격 표시방법, 그 밖에 필요한 사항은 고용노동부령으로 정한다. 이 경우 검사 주기는 안전검사대상기계등의 종류, 사용연한(使用年限) 및 위험성을 고려하여 정한다.
