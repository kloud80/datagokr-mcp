description_portal: 본 데이터는 한국남부발전(주) 해외발전소 운영정보 파일데이터입니다.본 데이터는 한국남부발전(주)에서 운영하고 있는 해외 발전소의 현황으로, 사업국가(칠레, 요르단, 미국)별 사업명과 사업종류(복합화력, 태양광, 풍력 등)와 설비용량(MW), 사업시작일과 완료일 및 준공년월 자료를 포함하고 있습니다. 해당 데이터를 통해 한국남부발전의 해외사업 진행현황을 파악할 수 있으며, 이를 바탕으로 해외 진출 정책 및 전략 수립, 발전량 데이터와 함께 분석을 통한 설비 이용률 비교 등 다양한 분석에 활용할 수 있습니다.
