summary_user: 한국남부발전이 운영하는 해외 발전소를 사업 단위로 담은 작은 현황 파일(약 496바이트 csv)로, 사업국가(칠레·요르단·미국)별 사업명, 사업종류(복합화력·태양광·풍력 등), 설비용량(MW), 사업 시작·완료년월과 준공년월을 담는다. 공기업 해외사업 현황을 살피는 분석가나 정책 담당자가 '남부발전은 어느 나라에 어떤 발전소를 얼마 규모로 짓고 언제 준공했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전소·발전량 데이터와는 사업명이나 국가명을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 공통 조인 키가 없어 국내 발전소 원장이나 발전량 데이터와 자동으로 연결되지 않고, 사업명·국가명으로 수작업 매핑해야 한다. 파일 자체에는 발전량이나 이용률이 없으므로 설비 이용률을 비교하려면 별도 발전량 자료가 필요하다.
