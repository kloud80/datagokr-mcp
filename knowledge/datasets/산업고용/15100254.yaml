summary_user: 중소벤처기업진흥공단 기술사관 육성사업(특성화고 2년+전문대 2년 연계 4년과정)에 참여하는 특성화고와 전문대를 사업년도·지역별로, 학교와 학과 단위로 정리한 전국 범위 목록 파일(csv, 약 10KB)이다. 진학·취업을 고민하는 학생·학부모나 진로 담당자가 '우리 지역에서 기술사관 과정에 참여하는 특성화고·전문대와 연계 학과는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 학교명이나 지역명을 기준으로 다른 학교 정보 데이터와 이름 매칭으로만 이어 쓴다.
description_portal: 특성화고(2년)+전문대(2년) 연계 교육을 통해 중소기업 현장기술 인력 양성(4년과정) 및 중소기업 취업연계하는 기술사관 육성사업 참여 특성화고 및 전문대 목록입니다. 기술사관 육성사업에 대한 내용은 아래와 같습니다. - (지원대상) 특성화고등학교와 전문대학 간 교육과정을 연계하여 기술 및 산업의 융복합화, 고도화된 산업에 필요한 인력 양성이 가능한 사업단(컨소시엄) - (지원내용) 참여 학생은 직업교육 수강, 졸업 후 협약기업 취업, 연계 대학 진학 등의 기회를 제공받으며, 협약 기업은 우수 기술인력 확보, 병역지정업체 우선 선정 등의 혜택을 지원받음. 이외에도 참여 사업단(특성화고 및 전문대)에는 학생활동 지원비, 실습재료비, 운영비 등 관련 비용이 지원
