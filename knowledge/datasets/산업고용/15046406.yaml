description_portal: '○ 통계개요* 통계명 : 구인·채용인원(직종별)* 통계종류 : 통계법 제18조에 따라 승인된 지정통계* 작성목적 : 사업체의 정상적인 경영활동에 필요한 부족인원의 규모 등을 산업별, 규모별, 직종별로조사하여 인력 미스매치 해소를 위한 고용정책 기초 자료로 제공하는 것을 목적으로 함* 조사체계 : 고용노동부* 공표주기 : 정기(반기)(조사기준일: 상반기: 4.1., 하반기: 10.1.)* 공표범위 : 지역 - 서울시내용 - 직종별 구인인원, 채용인원, 미충원인원 등○ 기 타* 2021년 이후 조사대상 사업체의 확대(상용근로자 5인 이상→종사자 1인 이상)* 2020년부터 한국고용직업분류2018을 적용. 2019년 이전자료(한국고용직업분류2007 적용)와 비교시 유의* 수록된 통계자료의 공표범위는 산업중․직종소분류이므로 하위분류별 통계자료는 통계적으로 유의하지 않을 수 있음'
