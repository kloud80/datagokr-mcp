description_portal: 한국에너지공단의 대중소기업 협력사업은 대기업과 중소기업 간 상생협력을 통해 에너지 효율을 높이고 온실가스를 감축하는 것을 목적으로 추진되는 사업입니다.특히 대기업이 보유한 기술과 노하우를 활용하여 중소기업의 에너지 관리 역량 강화 및 효율화 설비 설치를 지원하는 기업협력군 에너지동행사업과 온실가스 감축 실적을 크레디트화하여 활용하는 그린크레디트 사업 발굴 지원 등을 포함합니다. 본 데이터는 이러한 협력사업에 참여한 대기업의 명단을 제공하며, 주요 제공 항목으로는 참여 업체명, 참여연도, 참여사업명 등이 있습니다. 본 데이터를 통해 정부 및 연구기관은 대기업의 협력사업 참여 현황을 분석하고, 기업은 참여사업 발굴 및 에너지 협력전략 수립에 활용할 수 있습니다.
