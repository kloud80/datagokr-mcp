summary_user: 한국서부발전이 운영하는 발전소의 호기별 운전일 단위 발전 실적을 담은 파일로, 사업소명·호기·설비용량과 그날의 최대·최소 발전량, 총발전량을 한 행에 기록한다. 에너지 분석가나 설비 담당자가 '태안 1호기의 일별 총발전량이 시간이 지나며 떨어지고 있는가'처럼 호기별 발전량 추이와 설비 성능 저하를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명·호기명을 이름으로 맞추거나 같은 기관 자료끼리만 연결하고, 날짜는 운전일 기준으로 전력거래소 일별 수급 자료와 나란히 볼 수 있다.
description_portal: 한국서부발전은 안정적인 전력 공급을 위해 각 발전소별 발전량 데이터를 관리하고 있습니다. 발전소별 호기별 운전일, 용량, 최대/최소 발전량, 총 발전량 데이터는 에너지 정책 수립에 기초 자료로 활용될 수 있습니다. 특히, 호기별 발전량 변화 추이를 분석하여 설비의 성능 저하를 예측하고, 예방 정비 계획을 수립하는 데 활용가능 합니다. 제공항목은 운전일,사업소명,호기명,용량,최대 발전량,최소 발전량,총발전량 데이터를 제공합니다.예) 운전일,사업소명,호기,용량,최대 발전량,최소 발전량,총발전량       2022-12-01,태안,1,500,441000,335000,9285269.467
