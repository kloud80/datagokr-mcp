description_portal: 이 데이터는 연구개발 현황과 기술이전 및 통상실시권에 대한 현황을 포함하여 공공 연구 성과를 체계적으로 관리하기 위한 자료입니다.해당 CSV 파일에는 총 68개의 연구(R&D) 수행현황과 19개의 특허권에 대한 기술이전 및 통상실시권에 대한 두가지 항목으로 구성되어있습니다.연구개발 현황에는 연구과제명, 과제의 시작일과 종료일, 연구책임자 정보가 포함되어있으며, 이를 통해 특정 연구 프로젝트의 진행상황과 책임자를 확인할 수 있습니다. 기술이전 현황에는 특허등록일, 등록번호, 출원의 명칭, 계약일자, 계약상대자 정보가 포함되어 있어, 연구성과의 상용화 및 기술이전 과정에 대한 정보를 제공합니다. 이를 통해 연구 성과의 사업화 현황을 파악할 수 있습니다.
