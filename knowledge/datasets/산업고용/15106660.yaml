summary_user: 서울특별시 중구에 등록된 대규모점포를 점포 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 상호·대표자·업태·소재지·영업장 및 매장 면적·임대/분양/직영 점포수·개설일 등을 포함한다. 중구의 상권을 분석하거나 유통 정책을 검토하는 사람이 "중구에 어떤 대형마트·백화점·쇼핑센터가 언제 문을 열었고, 매장 규모와 임대·직영 구성은 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 상호명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓰며, 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 원장과 대조하는 용도로 활용한다.
description_portal: 서울특별시 중구 내 대규모점포 등록 현황을 제공하는 데이터입니다.본 데이터는 해당 지역에서 운영 중인 대형 상업시설의 등록 정보를 포함하며, 이를 통해 지역 내 상권 형성과 경제활동에 대한 기초 자료로 활용될 수 있습니다.주요 내용으로는 점포별 등록 여부, 사업 유형, 매장 규모, 판매 품목 등이 포함되며, 이를 통해 대규모점포의 운영 특성과 지역 경제에 미치는 영향을 분석할 수 있습니다.또한, 점포의 분포 현황과 업종별 구성 비율을 제공하여 유통 및 상업 정책 수립에 기여할 수 있도록 구성되어 있습니다.해당 데이터는 서울특별시 중구 내 상업시설 운영 현황을 객관적으로 전달하여 유통업 발전과 소비자 편익 증대를 목표로 합니다.
