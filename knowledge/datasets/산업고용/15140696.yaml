summary_user: 서울 은평구 안에서 수수료 없이 구인·구직을 알선하는 무료직업소개소의 인허가 현황을 업소 한 곳당 한 행으로 담는다. 상호명, 지번·도로명 주소, 인허가일, 영업상태와 폐업일, 전화번호, 중부원점TM 좌표가 들어 있다. 일자리를 찾는 은평구 주민이 "집 근처에서 지금 영업 중인 무료 직업소개소가 어디인가"를 확인하거나, 분석가가 소개소의 분포와 개업·폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어 주소(행정구역)나 기관 코드(OGDP_INST_CD)를 기준으로 다른 시군구 인허가 데이터나 고용 서비스 기관 데이터와 맞춰 쓴다.
description_portal: '은평구의 무료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 구직자와 구인 업체 간의 고용이 성사되도록 수수료 없이 알선하는 무료직업소개소의 인허가 현황을 담고 있습니다. 데이터에는 각 소개소의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같은 고용 서비스 기관 운영의 핵심 정보가 포함되어 있습니다 .이 데이터를 통해 취업에 어려움을 겪는 주민, 특히 취약계층은 비영리법인이나 공익단체가 운영하는 신뢰할 수 있는 공공 고용 지원 서비스를 파악하고 도움을 요청할 수 있습니다 . 또한, 소개소의 지역적 분포를 분석하여 고용 서비스의 접근성을 평가하고, 인허가 및 폐업 현황의 시계열 분석을 통해 지역 고용 시장의 동향과 사회 안전망의 작동 현황을 파악할 수 있습니다. 이는 지자체가 지역 주민을 위한 맞춤형 일자리 정책을 수립하고, 관련 기관을 관리·감독하는 데 필수적인 기초 자료로 높은 활용 가치를 지닙니다.'
