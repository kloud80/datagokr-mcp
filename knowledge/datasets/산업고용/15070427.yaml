description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 외부데이터와 분석자료를 기반으로 도출된 품종별 연관 키워드 데이터입니다. 본 데이터는 고객의 검색 행동 및 관심도를 분석하여 주요 품목별로 어떤 키워드가 연관되어 나타나는지를 순위별로 정리한 자료로, 마케팅 전략 수립이나 고객 맞춤형 서비스 기획에 활용될 수 있습니다. 각 구성 항목은 순위, 품목, 키워드로 구성되어 있으며, 순위는 1위부터 10위까지로 각 품목별로 분류되어 있습니다. 품목 항목에는 화장품, 담배, 식품/건강, 패션잡화, 주류, 향수, 액세서리 등이 포함되어 있고, 각 품목과 연관된 키워드는 소비자의 관심사, 시즌별 트렌드, 브랜드 선호도 등을 반영한 단어로 구성되어 있어, 품목별 마케팅 타깃 설정과 키워드 기반 홍보 전략 설계에 참고 자료로 활용 가능합니다.
