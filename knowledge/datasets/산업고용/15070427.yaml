summary_user: 제주국제자유도시개발센터가 운영하는 JDC지정면세점의 2016년 외부데이터·분석자료를 바탕으로, 화장품·담배·주류·향수·패션잡화 등 품목별로 연관 키워드(브랜드 언급)를 1~10위 순위로 정리한 집계 표입니다(CSV 1,336바이트의 소량 파일). 면세점 입점 브랜드나 마케팅 담당자가 '2016년 JDC면세점에서 화장품 품목과 함께 가장 많이 언급된 브랜드는 무엇인가' 같은 질문에 답하거나 품목별 홍보 키워드를 고를 때 참고합니다. 실측 컬럼은 순위·품목·키워드뿐이라 전역 조인 키가 없으며, 다른 JDC 면세점 분석 자료와는 품목명을 맞춰서만 이어 봅니다.
limits: 2016년 한 시점의 순위만 담고 언급 횟수 같은 수치나 기간 추이는 없어, 최근 트렌드나 규모 비교에는 쓰지 못합니다. 세부 부문이 업종 인허가(LOCALDATA)로 분류돼 있지만 사업자번호·좌표 같은 영업 원장 항목은 없고, 공통 코드가 없어 다른 데이터와는 이름 매핑으로만 연결됩니다.
