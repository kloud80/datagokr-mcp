description_portal: 부산정보산업진흥원은 2002년에 설립된 이래 부산 지역의 정보통신(IT) 및 문화콘텐츠(CT) 산업을 전문적으로 육성하고 지원해 온 핵심 기관입니다. 이 진흥원이 부산광역시 시내에 구축하고 운영·관리하는  IT지원센터들은 이러한 목표 달성을 위한 중요한 인프라 역할을 수행하고 있습니다.대표적으로는 해운대구 센텀동로 41에 위치하여 많은 기업들의 보금자리가 되어주는 부산센텀벤처타운과 영도구 절영로에 자리한 부산멀티미디어지원센터 등이 있습니다. 이들 센터는 IT 기업들이 저렴한 비용으로 입주할 수 있는 공간을 제공하며, 지역 IT 산업 생태계 활성화에 크게 기여하고 있습니다.
