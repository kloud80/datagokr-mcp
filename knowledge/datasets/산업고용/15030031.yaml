summary_user: 세종특별자치시가 내준 토석채취허가를 허가 건별로 담은 파일로, 업체 상호·상태·허가지 주소·채취 용도·허가면적(㎡)·허가량(㎥)·허가 시작일과 종료일을 행마다 기록한다. 인근 주민이나 건설·골재 사업자가 "우리 동네(전동면·전의면·장군면 등)에서 어느 업체가 언제까지 얼마만큼 토석을 캐도록 허가받았나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 지역 토석채취·채석 허가 자료와는 업체명·허가지 주소를 맞춰 잇고, 주소를 지번·좌표로 바꾸면 토지이용규제 같은 공간 자료와 겹쳐 볼 수 있다.
limits: 세종시 한 곳의 허가 원장이며 다른 시도 자료와 공통 코드가 없어 업체명·주소를 직접 맞춰야 한다. 파일 크기가 약 1KB에 불과한 소규모 자료라 추세나 통계 분석에는 맞지 않는다.
