description_portal: 세종특별자치시의 토석채취허가 현황을 제공합니다.데이터는 번호, 시군명(세종특별자치시) 상호,  상태, 사무실연락처 ,허가지주소, 토석채취용도, 허가면적, 허가량, 허가시작일, 허가종료일로 구성되어 있습니다.세종특별자치시 토석채취허가 현황은 총 5건으로, 세종벤처밸리산업단지㈜, ㈜강산환경, 아세아산업개발㈜,㈜대현종합건설에서 전동면, 전의면, 장군면에 토목용(부수적 토석채취), 쇄골재, 도로공사성토용 토사 용도로 허가된 내역이 있으며, 허가면적은 총 388855제곱미터, 허가량은 총 10251757세제곱미터입니다.이 데이터는 환경녹지국 산림자원과에서 관리하고 있는 데이터입니다. 044-300-4432로 연락해주시기 바랍니다.
