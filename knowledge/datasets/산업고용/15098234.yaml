summary_user: 경기도 과천시 관내 태양광 발전소를 발전소 한 곳당 한 행으로 담은 원장으로, 용도·세부용도, 사업상태, 도로명·지번 주소와 위경도, 설비용량(KW), 공급전압·주파수, 사업허가일·개시일, 소요부지면적을 포함하며 파일 크기는 약 2KB(1,955바이트)로 작다. 과천시에서 어느 위치에 어떤 용량의 태양광 발전소가 언제 허가·가동됐는지 확인하려는 주민·에너지 사업자·지역 분석가가 쓴다. 전역 조인 키는 없어 주소나 위경도, 발전소명으로 다른 데이터와 맞춰 쓰며, 같은 항목 구조를 가진 전국태양광발전소전기사업허가정보 표준데이터와 견주어 쓰기에 적합하다.
description_portal: 경기도 과천시 관내에 위치한 태양광 발전소의 현황 정보로 용도, 세부용도, 발전소명, 설치장소(도로명 및 지번)주소, 설치용량, 공급전압, 주파수, 사업허가일, 사업개시일 등의 항목을 포함하여 상세히 작성하였으며, 관련 키워드는 에너지, 태양광, 친환경, 태양광발전소, 전압으로 5가지로 구성하였습니다 . 위 내용을 반영하여 과천시 관내 태양광 발전소의 현황정보를 제공합니다.※태양광발전소란 태양의 빛에너지를 태양광 패널을 통해 전기에너지로 변환하여 전력을 생산·공급하는 친환경 발전 시설입니다.
