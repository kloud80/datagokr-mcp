summary_user: 구조혁신지원사업 신청기업 가운데 해당연도에 구조혁신 진단을 마친 기업을 한 행씩 담아 지역, 표준산업분류 업종명·코드, 주요제품을 기록한 전국 범위 파일(CSV)이다. 정책 분석가나 지원기관이 '구조혁신 진단을 받은 기업은 어느 업종·지역에 몰려 있고 주로 무엇을 만드는가'를 파악하는 데 쓴다. 산업분류코드(classification_code)를 키로 표준산업분류 코드표나 업종별 기업·고용 통계와 이어 쓰고, 사업자번호는 없어 개별 기업 단위 인증·확인 원장과 직접 연결하지는 못한다.
description_portal: 구조혁신 진단기업 산업분류 현황은 해당연도에 구조혁신지원사업의 신청기업 중 구조혁신 진단을 완료한 기업의 산업분류, 산업분류코드 및 주요제품 현황을 제공합니다.구조혁신지원사업은 산업 구조전환 과정에서 발생되는 구조적 애로를 통합 지원하여 기업·근로자가 지속적인 성장동력을 창출 하도록 구조혁신 유형별(사업전환, 산업·일자리전환, 디지털전환) 전문가를 활용하여 진단 및 컨설팅, 정부 지원사업 연계를 수행하는 사업입니다.* 2023년 지원현황부터 제공하고 있으며, 업종구분은 표준산업분류(ksic)를 따릅니다.
