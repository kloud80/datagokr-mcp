summary_user: 중소벤처기업부 창업기업 확인서를 발급받은 기업을 확인서 한 건 단위로 담으며, 기업명·기업 구분·대표자·확인서 발급번호·발급일·만료일이 들어 있다(검증 호출 기준 전국 100건, 발급·만료일 범위 2023-10-10~2027-11-20). 유통사나 투자·지원기관 담당자가 거래·지원 대상 기업이 현재 유효한 창업기업 확인서를 가졌는지, 언제 만료되는지 확인하는 데 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)를 키로 벤처·이노비즈 등 다른 기업 인증 원장이나 지원사업 공고·기업 현황 데이터와 기업 단위로 잇는다.
limits: 제품 정보 오퍼레이션(/getProductInformation01)은 최소 파라미터로 호출했을 때 응답이 없었으므로 기업 목록 외 제품 정보는 별도 확인이 필요하다. 2027년 날짜는 확인서 만료일 같은 미래 값이고, 실측 최신 날짜는 발급·만료일 조건을 건 검증 호출 기준이므로 데이터 최신성으로 단정하지 말고 적재 시점을 따로 보아야 한다.
