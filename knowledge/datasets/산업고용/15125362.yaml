        required: false
        desc: 창업기업확인서 발급 번호
      - name: cond[ntrp_type_nm::EQ]
        required: false
        desc: 기업 구분(개인기업,법인기업)
      - name: cond[ntrp_nm::LIKE]
        required: false
        desc: 기업 명
      - name: cond[brno::EQ]
        required: false
        desc: 사업자등록번호
      - name: cond[crno::EQ]
        required: false
        desc: 법인등록번호
      - name: returnType
        required: false
