      - name: cond[confmdoc_isu_dt::GTE]
        required: false
        desc: 창업기업확인서 발급 일시 이상(yyyyMMdd)
      - name: cond[confmdoc_expr_dt::LTE]
        required: false
        desc: 창업기업확인서 만료 일시 이하(yyyyMMdd)
