description_portal: ㅇ 세계 섬유 수출 현황에 대한 데이터로서  주요 섬유 및 의류 수출국의 수출실적을 제공하는 데이터입니다.ㅇ 세계 섬유 수출 현황은 연도별로 1. 전세계, 2. 중국, 3. EU, 4. 베트남, 5. 방글라데시, 6. 인도 7. 미국 등 섬유류 관련 세계 주요 국가들의 수출실적을 내림차순으로 정렬한 데이터입니다.* 해당 데이터는 WTO Statistics Database를 기준으로 세계 섬유 수출 현황 정보 제공* 중국은 홍콩 및 마카오를 포함, 한국은 EU 통합 집계시 11위이나 분할시 17위 * EU 분할시 순위권 내 주요국가로는 독일(3위), 이탈리아(4위), 튀르키예(7위) 등 존재
