description_portal: 서울특별시 용산구 담배도매업 인허가 정보는 용산구 지역 내에서 담배를 매입한 후 이를 소매업자 또는 타 도매업자에게 공급하는 도매업체들의 인허가 관련 현황을 담고 있는 데이터입니다. 본 데이터에는 도매업소의 사업장명, 영업소재지, 인허가일자, 인허가번호, 영업상태, 폐업일자, 취급 품목 등 주요 정보가 포함되어 있으며, 도매 유통망 분석, 상권 흐름 파악, 행정 관리 등에 활용될 수 있습니다. 특히 담배 유통의 중간 단계에서 중요한 역할을 하는 업체들을 식별하고, 도매 유통 구조를 이해하는 데 유용한 자료입니다. 좌표정보는 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며, 위경도 좌표는 포함되어 있지 않습니다. 본 데이터는 3일 전 기준의 최신 정보를 바탕으로 제공됩니다.
