description_portal: '서울특별시 마포구에 등록된 담배도매업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 담배도매업소의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 합법적으로 등록된 담배도매업체의 위치와 운영 현황을 쉽게 확인하고, 담배 유통 질서 관리, 청소년 보호, 조세 및 유통 정책 수립 등에 효율적으로 활용할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
