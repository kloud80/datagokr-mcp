summary_user: 철원군 안에서 준공된 태양광발전소를 발전소 한 건씩 담은 파일로, 허가번호·허가일자·상호·설비용량(kW)·공급전압·설치장소·지목·설치면적·상태가 들어 있다. 철원군에 태양광 설비가 어디에, 어떤 땅(지목)에, 얼마나 큰 용량으로 들어섰는지 알고 싶은 주민·사업자·분석가가 지역 태양광 입지와 규모를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 허가번호나 설치장소 주소를 이름 매핑해 붙여야 하고, 전국태양광발전소전기사업허가정보 표준데이터와 대조할 때도 같은 방식으로 맞춘다.
