summary_user: 전라남도 장흥군의 토석채취 허가와 채석신고 현황을 허가 건별로 담은 파일 데이터로, 수허가자 상호·허가지 주소·채취 용도·허가면적·허가량·허가 시작일과 종료일을 포함한다(약 2KB 규모의 소량 CSV). 지역 주민이나 연구자가 '장흥군 어느 곳에서 누가 언제까지 토석을 채취하도록 허가받았는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 허가지 주소나 업체 상호를 매칭하는 방식으로만 이어 쓰며, 같은 성격의 다른 시군 토석채취 허가 현황이나 토지이용 규제 정보와 주소 기준으로 겹쳐 보는 용도에 맞다.
description_portal: 토석 채취 및 토석 채취허가 현황에 관한 데이터는 관련 산업의 운영 실태와 개발 행위를 체계적으로 파악하기 위해 제공됩니다. 해당 자료에는 허가업체명, 허가지 소재지 주소, 허가 면적, 허가 기간 등 기본적인 허가 정보가 포함되어 있으며, 이를 통해 토석 채취 활동의 범위와 기간, 사업 주체 등에 대한 구체적인 현황을 확인할 수 있습니다. 이러한 데이터는 행정기관의 관리와 감독을 강화하는 데 활용될 수 있을 뿐 아니라, 연구기관이나 일반 국민들이 토석 채취와 관련된 지역적·환경적 영향까지 살펴보는 데에 유용한 자료로 제공됩니다.
