description_portal: '※ 본 데이터는 한국전력공사 데이터안심구역(서울/나주)에서 이용 가능한 데이터입니다. (제공 데이터의 샘플 확인 후 이용신청 부탁드립니다.)- 안내 링크 : https://bigdata.kepco.co.kr/cmsmain.do?scode=S01&pcode=000473&pstate=L&redirect=Y한국전력공사에서 제공하는 설비관리 자료 중 공용설치 사업자 현황 데이터 입니다.배전전주 및 지중관로에 통신케이블과 각종 설비를 설치해 운영하는 방송통신사업자의를1차 사업소 단위로 분류한 데이터 입니다.본부, KEPCO, 기간통신사업자, 종합유선사업자, 중계유선사업자, 행정기관, 전송망사업자 항목으로 구성되어 있습니다.해당 데이터를 활용하여 전력설비 기반 공동 인프라 활용 현황 분석, 사업자별 설치 비중 파악, 통신망 및전송망의 지역별 분포 검토 등을 할 수 있습니다.'
