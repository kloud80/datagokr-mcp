summary_user: 전국 전통시장 1,403곳을 시장 단위로 담은 파일 자료로, 시장명·유형·주소(지번·도로명)와 아케이드·엘리베이터·화장실 등 편의시설 보유 여부를 항목별로 싣는다. 지자체 담당자나 분석가가 우리 지역 시장의 편의·안전시설이 어디가 부족한지 가려내는 질문에 쓴다. 지번주소·도로명주소를 조인 키로 삼아 소상공인 상가업소 원장 등 주소 기반 자료와 이어 쓰며, 시도·시군구 필드로 지역별 집계도 한다.
description_portal: 소상공인, 편의시설전국 전통시장의 위치, 시장유형, 보유 시설 정보를 포함한 자료로, 아케이드, 엘리베이터, 에스컬레이터, 고객지원센터, 화장실 등 편의시설 보유 여부를 항목별로 확인할 수 있습니다. 시장별 편의 인프라 구축 상태를 파악함으로써 향후 시설 개선 계획이나 지역별 균형 발전 정책 수립에 활용할 수 있으며, 현장 중심의 지원 방안을 마련하는 데에도 기초자료로 유익합니다. 특히 접근성과 이용 편의성 평가에 있어 실질적 기준으로 참고될 수 있습니다. 향후 유사 사례 발굴 및 정책 설계의 참고 자료로도 활용될 수 있습니다.
