description_portal: 본 데이터는 서울특별시 양천구에서 관내 학교, 복지시설, 기업체 등 다양한 기관에서 운영되는 집단급식소의 인허가 현황을 체계적으로 관리하기 위하여 구축한 행정자료이다. 각 급식시설의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 주요 정보를 포함하여 지역 내 급식 안전관리 실태를 종합적으로 파악할 수 있도록 구성되어 있다. 또한 신규 설치 신고, 변경허가, 행정처분, 휴·폐업 등 인허가 절차의 이력 정보를 제공함으로써 급식 위생수준 향상과 지도점검 계획 수립에 활용될 수 있다. 본 데이터는 관내 급식 운영기관의 안전관리 체계를 투명하게 공개하여 공공 급식서비스의 신뢰성 제고에 기여하며, 정책 수립과 위험 예방 활동에 필요한 근거자료로 활용된다. 아울러 정기적인 정보 갱신을 통해 최신 자료의 정확성을 유지하여 민원 대응 및 행정업무 효율 향상에도 도움을 준다.* 집단급식소- 병원,학교,어린이집 등 집단급식소를 운영하는 업소 및 기관
