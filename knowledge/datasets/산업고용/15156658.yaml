summary_user: 전국과 일부 광역시(서울·부산·대구·광주·대전)의 월별 가구당 도시가스 소비량(㎥)을 연월 단위로 담은 집계 파일로, 월 도시가스 소비량을 수요가수로 나눈 값이다. 분석가가 가정의 도시가스 사용 효율 추이를 보거나, 가구수 전망치와 곱해 앞으로의 가정용 도시가스 수요를 예측하는 데 쓴다. 전역 조인 키는 없고 연월과 지역 이름(열 이름)으로 다른 월별·지역별 통계와 맞춰 써야 한다.
description_portal: 월별 가구당 도시가스 소비량은 월별 도시가스 소비량을 수요가수로 나눈 값을 의미한다. 기본적으로 전국과 5대 광역 지역(수도권, 충청권, 대경권, 호남권, 동남권) 단위로 생성한다. 가구당소비량은 두 가지 측면에서 활용가능하다. 가정의 도시가스 에너지 효율을 측정하는 지표로 활용 가능하다. 가구당 도시가스 소비량은 2000년 이후 점진적으로 하락 추세를 보이고 있다. 두번째 용도는 가정용 도시가스 소비량 예측에 활용된다. 미래의 가구당 소비량을 예측하고 가구수 전망치가 있으면 가정용 도시가스를 예측할 수 있다. 단위는 m3이다.
