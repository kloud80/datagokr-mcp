summary_user: 함평군에 등록된 제조업체를 업체 한 곳당 한 행으로 담은 파일로, 회사명·대표자명·공장 도로명주소·업종명·전화번호·생산품·데이터 기준일을 담는다. 지역 분석가나 사업자가 '함평군에서 특정 품목을 생산하는 제조업체가 어디에 몇 곳 있나'를 확인하거나 군 단위 제조업 분포를 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없으므로, 다른 데이터와는 회사명 매칭이나 공장 도로명주소를 지오코딩·주소 매칭해서 잇는다.
description_portal: 전라남도 함평군은 지역 산업 구조 분석 및 중소기업 지원정책 마련을 위해 관내 제조업체 등록현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군에 등록된 제조업체의 기본 현황을 포함하고 있으며, 회사명, 대표자 성명, 전화번호, 사업장 주소, 업종명, 주요 생산품 등의 항목으로 구성되어 있습니다. 해당 데이터는 지역 제조업 분포 현황 분석, 산업 육성 및 창업 지원 정책 수립, 기업체 맞춤형 행정서비스 제공 등에 활용될 수 있으며, 산업단지 조성계획, 청년 일자리 연계, 제품 유통 및 마케팅 자료로도 유용하게 활용됩니다. 또한, 함평군의 산업경제 기반을 파악하고 민·관 협력형 지역경제 활성화 전략 수립에 기여할 수 있는 핵심 공공정보입니다.
