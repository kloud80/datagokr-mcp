description_portal: 이 데이터는 산업통상자원부 국가기술표준원(KATS)에서 관리하는 계량기 10종(LPG미터, 가스미터, 수도미터, 온수미터, 오일미터, 요소수미터, 전력량계, 주유기, 분동, 접시/판지시저울)의 검정 이력 및 기술 규격 상세 정보를 통합한 자료입니다.검정순번 및 검정상세순번을 통해 고유 이력을 제공하며, 모델 정보, 형식 코드 등 법적 형식 승인 관련 정보와 정확도 등급, 최대 유량/용량, 환경 조건 등 측정의 공정성과 신뢰성을 보장하는 핵심 사양을 상세히 담고 있습니다.이 자료는 국가 계량 표준의 투명성을 높이고, 공정한 상거래 질서 확립을 위한 정책 수립 및 산업계의 품질 보증 및 기술 개발에 활용되는 중요한 기반 데이터입니다.
