summary_user: 충청남도 계룡시 관내 골프연습장 업소를 한 곳씩 담은 목록으로, 시군명·영업 구분·업종·상호·도로명 시설주소를 업소 단위로 제공하며 포털 설명상 2021년 9월 1일 기준 현황이다. 계룡시 주민이나 창업 검토자가 "계룡시에 골프연습장이 어디에 몇 곳 있는가"를 확인하거나 지역 체육시설 분포를 살필 때 쓴다. 공통 조인 키는 없어 다른 데이터와는 상호·도로명 주소를 이름 매칭하거나 같은 시군 단위로만 이을 수 있고, 지방행정 인허가(LOCALDATA) 체육시설 업종 원장과 대조하는 용도가 적합하다.
limits: 실측 컬럼에 사업자번호·인허가번호 같은 전역 조인 키가 없어 다른 데이터와 정확히 연결하려면 상호·주소 문자열 매칭이 필요하다. 범위는 계룡시 한 곳뿐이라 다른 시군과의 비교에는 별도 데이터가 필요하다.
