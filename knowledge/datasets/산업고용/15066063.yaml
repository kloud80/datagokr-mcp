description_portal: 한국가스공사의 도시가스 산업용 월별 가스수요산업지수 데이터 입니다. 산업용 도시가스 수요예측 모델 개발 및 산업활동과 가스수요의 상관관계 분석, 경기변동 분석을 목적으로 수집되었습니다. 데이터 구성항목은 2007년 1월부터 2021년 6월까지 약 15년간의 연, 월, 가스수요산업지수로 이루어져 있으며, 산업활동 수준이 도시가스 수요에 미치는 영향을 정량적으로 나타내는 지표입니다. 본 데이터를 활용하면 월별 산업지수 추이 분석, 산업활동과 가스수요의 상관관계 파악, 경기변동에 따른 수요 영향 분석, 연도별 산업지수 변화 분석, 업종별 수요 기여도 분석이 가능합니다.또한 산업용 수요예측 모델 개발, 경기전망에 따른 수요 예측, 산업부문 에너지 정책 수립, 업종별 수요 분석에 활용됩니다. 산업용 도시가스 수요예측의 정확도 향상에 기초자료로 활용됩니다.
