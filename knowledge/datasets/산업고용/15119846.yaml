summary_user: 경기도 시군별 일반 정비구역(재개발·재건축 등) 한 곳을 한 행으로, 정비유형·사업단계·위치·구역면적, 기존 주택의 준공연도·동수·면적대별 세대수, 신축 분양·임대 세대 계획, 용적률, 토지소유자·조합원 수, 정비구역 지정·추진위 승인·안전진단·조합설립·사업시행인가 등 단계별 일자를 담는다. 도시계획·주거정책 담당자나 분석가가 "우리 시군의 재건축 구역 가운데 조합설립을 마치고 사업시행인가 단계에 있는 곳은 어디이고 세대 수 변화는 얼마인가" 같은 질문에 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명(sigun_nm)이나 소재지 주소, 정비구역명 같은 이름을 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 일반정비사업 추진현황을 정비유형(재개발, 재건축 등), 사업단계(예정구역, 조합설립, 착공, 준공 등)별로 정리한 자료입니다. 주요 항목으로는 시군명, 정비구역명, 위치, 구역면적, 기존주택 현황(준공연도, 동수, 세대수), 사업추진일정(조합설립인가, 사업시행인가, 착공, 준공일자 등), 현추진상황, 담당자 정보 등이 포함됩니다. 재건축이나 재개발과 같은 도시정비사업의 전반적인 진행 단계와 물리적 현황을 확인할 수 있어 주거환경 개선 사업의 진척도를 지역별로 비교·분석할 수 있으며, 도시계획, 주거환경 개선 정책, 인허가 일정 관리, 주민협의 절차 분석, 사업성과 평가 등 다양한 용도로 활용 가능합니다.
accrual_periodicity: 일간
team:
  dept: AI미래행정과
