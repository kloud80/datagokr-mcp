description_portal: 본 데이터는 한국에너지기술평가원(KETEP)의 에너지기술개발사업을 통해 개발된 기술의 사업화 성과를 집약한 공공 데이터입니다. KETEP은 에너지 R&D 투자의 실질적인 경제적 효과를 측정하고, 기술 상용화를 촉진하기 위해 과제 종료 후 5년간 매년 성과활용조사를 실시하고 있습니다.제공되는 정보는 사업화 실적(매출액, 비용 절감, 수입 대체 효과, 기술 이전 등)이 발생한 과제 목록을 포함합니다. 이 데이터는 KETEP이 발간하는 '성과활용조사분석보고서' 및 '성과 통계집'의 주요 내용을 기반으로 하며, 사용자들은 ETIC(에너지기술성과확산시스템, www.etic.kr)에서 더 상세한 정보를 확인할 수 있습니다.
