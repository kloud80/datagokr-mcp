summary_user: 2021년 상반기 전력시장의 하루 단위 전력거래금액을 거래일별로 담은 전국 집계 파일로, 금액 단위는 천원이다. 에너지 분석가나 연구자가 2021년 상반기 동안 전력시장 일일 거래 규모가 날짜별로 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키는 없고, 거래일을 기준으로 같은 기관의 일별 SMP·발전량 같은 전력시장 자료와 날짜로 맞춰 쓴다.
