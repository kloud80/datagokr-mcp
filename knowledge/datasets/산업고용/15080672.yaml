description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 태양광, 풍력 발전기에 연계되어 있는 전기저장장치(ESS)의 월별 지역별 설비용량(PCS*용량) 자료입니다.ㅇ 값은 변동될 수 있으며, 전력시장에 참여하는 발전기만을 대상으로 합니다.(PPA, 자가용 제외)ㅁ 24년 7월부터 목록의 제공항목이 변경됩니다.   ○ 기간 : 2024년 7월 ~    ○ 항목 : 연도,월,지역,태양광,풍력,전기저장장치(태양광),전기저장장치(풍력)   ○ 단위 : MW   ○ 기간 : 2025년 6월 ~ 2026년 06월   ○ 항목 : 연도, 월, 지역(광역시도), 태양광 전체 설비용량, 풍력 전체 설비용량, 전기저장장치 연계 태양광 설비용량, 전기저장장치 연계 풍력 설비용량, 태양광연계 전기저장장치 설비용량, 풍력연계 전기저장장치 설비용량   ○ 단위 : MW     * ESS : Electric power Storage System, 전기저장장치    ＊ PCS : Power Conversion System,  전력변환장치'
