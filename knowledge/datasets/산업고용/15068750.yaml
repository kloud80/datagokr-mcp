description_portal: 매반기 근로자파견사업체의 반기별 실적보고에 따라 2025년 12월 31일 기준의 2025년 하반기 근로자파견사업 현황이 추가되었습니다. 따라서 현재 기준의 현황자료가 아니므로 현 시점과 현황이 다를 수 있습니다.고용노동부의 허가를 받은 파견업체수, 파견근로자수, 사용업체수 등의 정보가 포함되어 있는 데이터 입니다.  근로자파견사업의 현황은매반기 별로 공표되고 있으며 자세한 사항은 고용노동부 홈페이지(정보공개 - 사전정보공표목록)를 참고해 주시기 바랍니다. 향후 데이터 업데이트는 2026년 상반기 기준으로 작성될 예정입니다.
