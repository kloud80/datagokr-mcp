description_portal: 본 자료는 충북혁신도시로 이전한 한국고용정보원, 한국소비자원, 한국가스안전공사가 수행한 사회공헌사업 활동내역을 통합하여 제공하는 데이터입니다. 각 기관이 지역사회 발전과 사회적 가치 실현을 위해 진행한 다양한 프로그램과 활동 정보가 포함되며, 기관명,  활동년도, 활동명, 활동 주기 구분, 활동 내용 등의 항목으로 구성됩니다. 이를 통해 충북혁신도시 유관기관의 사회공헌 노력과 성과를 한눈에 파악할 수 있으며, 지역사회 공헌 사례 분석, 기관별 사회책임경영 이행 수준 평가, 향후 유사 사업 기획 등에 활용 가능합니다. 데이터는 연도별·기관별로 비교 분석이 가능하도록 설계되어 있으며, 공공정책 수립, 지역 협력 사업 발굴, 홍보 콘텐츠 제작 등에도 기초자료로 쓰입니다.
