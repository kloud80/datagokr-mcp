summary_user: 충청북도 고용동향 가운데 직업별 취업자 수를 연도·월과 직업 대분류·세분류별로 담은 집계 데이터이다(취업인구 EMPYMN_POPLTN). 충북 지역 일자리 정책 담당자나 연구자가 '충북에서 서비스직·생산직·전문직 취업자 비중이 최근 어떻게 바뀌었나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 시도 고용동향이나 직업 코드 마스터와는 연·월과 직업명을 이름으로 맞춰 이어 써야 한다.
description_portal: 충청북도 고용동향의 직업별 취업자 현황을 연도·월 단위로 조회할 수 있는 Open API로, 직업 대분류와 세분류 기준에 따라 취업 인구 규모를 입력 파라미터로 세밀하게 확인할 수 있습니다. 직업별 취업자 데이터는 특정 시점의 산업·직업 구조를 반영하는 대표적인 노동시장 지표로, 산업 변화에 따른 직업 수요 변동, 지역의 기술·서비스 직종 비중, 전문직·생산직·서비스직 등 직업군 간 분포 차이를 분석하는 데 활용 가능합니다. 행정기관은 이를 기반으로 지역 일자리 정책 설계, 직종별 인력수요 파악, 중장기 고용전략 수립 등 근거 기반의 정책결정을 수행할 수 있으며, 교육기관·연구자·민간에서도 직업수요 예측, 직업별 임금·고용 안정성 분석, 직종별 맞춤형 경력관리 서비스 개발 등 다양한 분야에서 활용도가 높습니다.
