summary_user: 경상남도 창녕군이 수행하는 노인일자리 사업을 사업 단위로 정리한 파일로, 수행기관명·사업명·사업유형(공익형·사회서비스형·시장형)·사업량과 활동비·부대비·합계 예산(원)을 담는다. 창녕군 노인일자리에 참여하려는 주민이나 지역 노인복지 예산을 살피는 분석가가 "어느 기관이 어떤 유형의 사업을 몇 개, 얼마의 예산으로 운영하는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군구의 같은 현황 파일과는 기관명·사업유형 이름을 맞춰 붙여야 한다.
description_portal: 경상남도 창녕군의 노인일자리 사업 현황입니다. 1. 기관명, 사업명, 사업유형(공익형, 사회서비스형, 시장형, 공익형), 사업량(개수), 활동비 예산(원), 부대비 예산(원), 예산 합계(원), 데이터기준일 정보를 포함하고 있습니다.2. 데이터기준일은 2025년 8월 31일 기준이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 부대비 예산이 0원인 데이터가 있습니다.4. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 행정복지국 노인여성아동과 노인복지팀 055-530-1404로 문의 주시기 바랍니다
