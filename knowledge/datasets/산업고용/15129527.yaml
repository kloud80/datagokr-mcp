description_portal: 이 데이터는 산재보험에 임의 가입한 중소기업 사업주에 대한 산재보험 보험급여 지급 현황을 사업 종류별(업종)로 집계한 통계 자료입니다. 각 사업 종류별로 보험급여를 받은 수급자 수(명)와 지급된 총 금액(백만 원) 정보를 연도별로 제공합니다. 이 자료는 일반 근로자와 동일하게 재해 보상 혜택을 받는 중소기업 사업주 임의 가입 제도의 운영 실태를 투명하게 보여주며, 특히 사업주들의 재해 취약도가 높은 산업 분야와 보험 지원 규모를 파악하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 중소기업 경영자의 안전 및 복지 정책 수립에 중요한 자료입니다. 이 자료를 활용하여 제조업, 건설업 등 특정 사업 종류에서 수급자 수와 지급액이 높게 나타나는 이유를 분석할 수 있습니다. 이를 통해 해당 업종의 소규모 사업장에서 발생하는 재해의 특성을 진단하고, 사업주를 대상으로 한 맞춤형 산업 안전 교육이나 재해 예방 지원 정책을 수립하는 데 활용할 수 있습니다. 또한, 이 통계는 중소기업 경영 안정과 근로 환경 개선을 위한 사회보장 제도의 효과성과 재정 지원의 적정성을 검토하는 데 기여할 수 있다고 판단됩니다.
