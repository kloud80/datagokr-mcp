description_portal: 본 데이터는 「녹색건축물 조성 지원법」에 따라 건축물의 에너지 성능을 평가하고, 그 효율성에 따라 등급(1+++등급부터 7등급까지)을 부여하는 '건축물 에너지 효율등급 인증제도'를 통해 인증받은 건축물들의 상세 정보를 제공합니다. 이 제도는 건축물의 에너지 낭비를 줄이고, 에너지 성능에 대한 객관적인 정보를 시장에 제공함으로써 건물의 가치를 높이며, 궁극적으로 국가적인 에너지 절약과 온실가스 배출량 감축에 기여하는 데 그 목적이 있습니다.이 데이터셋은 건축주, 건물 사용자, 건설 사업자, 투자자 등 다양한 이해관계자들이 건축물의 에너지 성능을 쉽게 파악하고, 에너지 효율이 높은 건축물을 선택하거나 개발하도록 유도합니다. 또한, 정부는 이 데이터를 활용하여 건물 부문 에너지 정책의 효과를 평가하고,
