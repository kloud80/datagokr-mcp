description_portal: 구조혁신 진단기업 지역별 업종 현황은 해당연도에 구조혁신지원사업의 신청기업 중 구조혁신 진단을 완료한 기업 대상으로 지역별 업종별 현황에 대한 데이터를 제공합니다.(행 - 지역, 열 - 업종인 매트릭스 형태의 데이터)구조혁신지원사업은 산업 구조전환 과정에서 발생되는 구조적 애로를 통합 지원하여 기업·근로자가 지속적인 성장동력을 창출 하도록 구조혁신 유형별(사업전환, 산업·일자리전환, 디지털전환) 전문가를 활용하여 진단 및 컨설팅, 정부 지원사업 연계를 수행하는 사업입니다.*  2022년 지원현황부터 제공하고 있으며, 업종구분은 표준산업분류(ksic)를 따릅니다.
