summary_user: 제주특별자치도 안의 전기차 AS(정비) 업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 구분·제조판매사·AS현황·주소·전화번호·데이터기준일자를 담고 크기는 약 1.3KB로 작다. 제주에서 전기차를 타는 운전자가 '내 차 제조사의 AS를 받을 수 있는 곳이 어디이고 연락처가 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 제조사 이름을 맞춰 연결해야 하며, 자동차365의 정비가능 업체 조회나 충전소 데이터와 지역 단위로 함께 본다.
limits: 표준 업체 ID나 좌표가 없어서 다른 데이터와 키로 바로 붙일 수 없고, 주소·이름을 맞추는 방식으로만 연결된다. 제주도 안의 업체만 담고 있어 전국 단위 정비망 분석에는 쓰지 못한다.
