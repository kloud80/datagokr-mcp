summary_user: 한국지역난방공사 지사별(수원·분당·강남·고양 등)로 열 설비용량(Gcal/h)과 전기 설비용량(MW), 준공연도를 한 행씩 담은 소규모 집계 파일(csv 683바이트)이다. 집단에너지 분석가가 지사별 열병합발전(CHP) 설비 규모와 노후 정도를 비교해 수도권 열·전기 공급 여력이나 계통유연성 자원으로서의 가치를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지사명(구분)을 지역명으로 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
