summary_user: 전력시장에 회원으로 가입한 태양광 발전설비의 발전량을 일자·광역시도·거래시간 단위로 집계해 MWh로 담는다. 에너지 분석가나 발전사업자가 특정 날짜에 어느 시도에서 몇 시에 태양광 발전량이 많았는지 비교할 때 쓴다. 전역 조인 키는 없고, 시도 이름(regionNm)과 일자·시간을 맞춰 같은 기관의 시간별 수급·SMP 데이터나 다른 지역 통계와 이어 쓴다.
limits: 전력시장 회원 태양광만 포함하므로, 한전과 직접 거래하는 1,000kW 이하 설비의 발전량은 빠진다. 검증 호출에서 실제로 받은 행은 0건이라 응답 내용과 적재 범위는 아직 확인되지 않았다. 개발계정은 하루 100회까지만 호출할 수 있다.
