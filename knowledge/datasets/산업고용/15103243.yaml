description_portal: 'ㅇ 신·재생에너지 발전사업자는 전력거래를 위해 발전설비용량 1,000kW 이하는 전력시장을 통하지 않고 전기판매업자(한전)와 전력거래를 하거나 전력거래소의 회원으로 가입하여 전력시장에서 전력거래를 할 수 있고, 발전설비용량 1,000kW를 초과할 경우 전력거래소 회원으로 가입하여 전력시장에서 전력거래를 하여야 합니다.ㅇ 해당목록은 전력시장에 회원으로 가입한 태양광의 지역별 시간별 발전량을 보여주는 서비스입니다.일자, 광역시/도 별 지역, 거래시간, 발전량을 제공합니다.단위 : MWh'
