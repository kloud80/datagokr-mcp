description_portal: 신용보증재단중앙회의 재보증 기업의 기업 재무정보 통지 데이터 중 하나로 기업이 결산 후 이익을 어떻게 배분했는지를 보여주는 이익이여금처분계산서 통지 내역의 기초 정보를 담고 있습니다.개인정보 보호를 위해 기업을 특정할 수 없도록 일부 정보를 삭제하면서 임의의 고유번호를 부여하여 비식별처리 하였습니다.재보증 관련 목적으로 수집된 통지용 이익잉여금처분계산서 데이터입니다. 결산기준일자, 처분확정일자, 미처분이익잉여금액, 임의적립금이입금액 등의 정보가 포함되어 있습니다.재보증이란, 신용보증재단중앙회(재보증기관)가 원보증기관인 지역신용보증재단이 소상공인에 대하여 보증한 금액의 일정비율을 재보증하고, 원보증기관이 금융기관에 대위변제 후 회수하지 못한 채권에 대하여 재보증비율에 해당하는 금액을 신용보증재단중앙회(재보증기관)가 지역신용보증재단(원보증기관)에 지급하는 제도입니다.
