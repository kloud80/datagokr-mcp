description_portal: '○ 통계개요* 통계명 : 시장현황(구별)* 통계종류 : 서울시에 등록된 시장현황을 자치구별로 제공하는 일반ㆍ조사통계* 근거법령 :「전통시장 및 상점가 육성을 위한 특별법」에 의한 시장 및 상점가 실태조사* 작성목적 : 시장으로서 등록 및 인정된 시장의 현황을 파악하여, 지역상권의 활성화와유통산업의 균형있는 성장을 도모하는 정책수립을 위한 기초자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 소상공인정책담당관* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 등록ㆍ인정시장ㆍ상점가의 개소수, 점포수, 면적 등○ 용어설명* 등록시장 : 유통산업발전법 제2조 규정에 의한 대규모점포의 요건을 갖추고 동법 제8조규정에 따라 대규모점포로 등록된 시장* 인정시장 : 등록시장과 같은 기능을 하고 있으나 대규모점포의 요건은 갖추지 못한곳으로서 시장ㆍ군수ㆍ구청장이 인정한 시장* 상점가 : 2천제곱미터 이내의 가로 또는 지하도에 50 이상(인구 30만 이하인 시ㆍ군ㆍ자치구의 상점가 경우에는 30 이상)의 도매점포ㆍ소매점포 또는 용역점포가 밀집하여있는 지구를 말함○ 기 타* 2009년부터 시장(등록시장)중에서 하나 또는 대통령령이 정하는 둘 이상의 연접매장으로 설치되어 있고 상시적으로 운영되며 연접매장 총면적이 3,000㎡인 경우대규모점포로 분류되나, 시장(등록시장)으로 분류 관리함○ 출 처 : 서울특별시 소상공인정책담당관'
