summary_user: 경상남도 함안군 관내에 지정된 담배소매인 업소를 한 행에 한 곳씩 담은 파일로, 업소명·지번주소·도로명주소·법인구분·영업구분을 포함한다. 함안군에서 담배소매인 신규 지정을 준비하는 소상공인이 예정 입지 주변에 기존 소매인이 어디에 있는지, 거리 제한 요건에 걸리는지를 미리 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이을 수 있으며, 같은 업종 인허가 원천(LOCALDATA)의 영업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조해 쓴다.
description_portal: 본 데이터는 함안군 관내 담배소매인으로 지정된 업소의 상호, 도로명 및 지번 주소, 영업 상태 등 핵심 행정 정보를 제공합니다.특히 신규 지정을 준비하는 소상공인이 관련 법령에 따른 소매인 간 거리 제한 요건을 사전에 확인하고, 창업 입지를 분석하는 기초 자료로 활용될 수 있습니다. 지역 상권의 정보를 투명하게 공개하여 공정한 영업 환경을 조성하고자 합니다.  특정 시점의 행정 기록을 추출한 것으로서 변경 사항과는 차이가 있을 수 있으므로, 상세한 내용은 반드시  최종 확인하시기 바랍니다.
