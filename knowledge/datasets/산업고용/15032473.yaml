legal_basis_portal: 본 데이터는 담배사업법 및 동법 시행규칙에 의거하여 함안군 관내 담배소매인의 지정과 관리에 관한 법정 사무를 수행하는 과정에서 생성된 행정 자료입니다. 특히 함안군 담배소매인 지정기준에 관한 규칙에서 정한 소매인 간 거리 제한 및 부적당 장소 해당 여부 등 법적 요건을 검토하고 확인하기 위한 기초 판단 근거로 활용됩니다. 아울러 공공기관의 정보공개에 관한 법률의 취지에 따라 군민의 알 권리를 보장하고, 투명한 담배 유통 질서 확립과 소상공인의 공정한 영업 환경 조성을 위해 상시 관리 및 보유하고 있습니다.
