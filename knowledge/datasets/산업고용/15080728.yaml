summary_user: 경주시에 있는 풍력발전기 중 전력시장에 참여하는 사업자의 발전량 합계(MWh)를 거래일자·시간별로 담은 집계 파일이며, 포털 설명상 기간은 2015년부터 2021년 2월까지입니다. 에너지 분석가나 지자체 담당자가 경주 지역 풍력 발전량이 계절·시간대별로 어떻게 달라졌는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 전력거래소 발전량 자료와는 거래일자·시간·지역명·연료원 이름을 맞춰 붙여야 한다.
description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 2015~2021년 2월까지의 경주시 풍력발전기 발전량 합계 자료입니다.ㅇ 해당 자료는 전력시장에 참여하고 있는 사업자만 포함한 자료로, 경주시 전체 풍력발전기 발전량을 의미하지 않습니다.ㅇ 또한 값이 수정정산 등에 의해 변동될 수 있습니다.ㅇ 해당 자료는 공공기관의 정보공개에 관한 법률 제9조에 따라 발전기 보유 법인의 권리를 침해하지 않는 범위에서 공개 가능합니다.
