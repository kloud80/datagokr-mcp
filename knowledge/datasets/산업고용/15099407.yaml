summary_user: 전북특별자치도 진안군에 소재한 건설 철거 업체를 업체 한 곳당 한 행으로 담은 목록으로, 업체명·업종·도로명주소·전화번호·데이터기준일자를 담는다(파일 크기 1,230바이트의 소규모 CSV). 진안군에서 건물 철거를 맡길 업체를 찾는 주민이나, 군 단위 건설 철거 업체 분포를 확인하려는 사업자·분석가가 어느 업체가 어디에 있고 어떻게 연락하는지 확인하는 데 쓴다. 사업자번호나 행정코드 같은 공통 조인 키가 없어 다른 데이터와는 업체명·도로명주소를 맞춰 보는 방식으로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 건설업 원장이나 다른 업종 인허가 현황과 이름·주소 기준으로 대조할 수 있다.
limits: 전역 조인 키가 없어 다른 데이터와의 연결은 업체명·주소 매칭에 의존하므로 표기 차이에 따른 누락·오매칭에 주의해야 한다. 범위는 진안군 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하다. 포털 설명상 휴대전화 번호는 개인정보로 빠져 있어 전화번호가 빈 업체가 있다.
