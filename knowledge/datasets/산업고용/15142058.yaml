summary_user: 서울 마포구 관내 유료직업소개소의 인허가 내역을 업소 한 건씩 담은 원천 목록으로, 인허가일자·영업상태(영업/폐업)와 폐업일자, 전화번호, 지번·도로명 주소, 좌표를 포함한다. 구직자나 구인 사업자가 '마포구에서 지금 영업 중인 유료직업소개소는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 관내 소개소의 개업·폐업 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 같은 개방자치단체코드(OPNSFTEAMCODE)로만 연결하며, 좌표(X·Y)로 지도 위에 겹쳐 볼 수 있다.
description_portal: 서울특별시 마포구의 유료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소 정보에 대한 설명입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 관내 유료직업소개소의 위치, 서비스 제공 현황 및 운영 상태를 파악하고, 고용 정책을 효율적으로 수립할 수 있습니다.
