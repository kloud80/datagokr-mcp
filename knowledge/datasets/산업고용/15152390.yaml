description_portal: 중소벤처기업진흥공단은 중소기업의 정책자금을 효율적으로 지원하기 위해 직접대출의 용도별 및 담보별 잔액 현황을 제공합니다. 이 자료는 대출 용도와 담보 등 다양한 유형으로 대출잔액을 세분화하여 제공합니다.이를 통해 중소기업의 자금 사용 목적과 담보 유형에 따른 대출 현황을 파악하고, 맞춤형 정책을 수립하여 자금 지원의 효율성을 높이는 데 중요한 기초 자료로 활용됩니다.직접대출 용도 구분은 시설자금, 운전자금으로 구성되어 있습니다.직접대출 담보 구분은 신용담보, 보증서담보, 부동산담보로 구성되어 있습니다.
