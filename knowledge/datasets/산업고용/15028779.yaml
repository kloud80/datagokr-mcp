summary_user: 충청남도 당진시에서 영업 중인 직업소개소를 한 곳당 한 행으로 담은 파일로, 상호와 도로명주소만 들어 있다(csv 약 8KB). 구직자나 구인업체가 당진시 안에서 이용할 수 있는 직업소개소가 어디 있는지 찾거나, 담당 공무원이 관내 소개소 현황을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 도로명주소를 문자열로 맞추거나 주소를 지오코딩해 지도·행정구역 자료와 겹쳐 쓰는 방식으로만 잇는다.
description_portal: '충청남도 당진시 직업소개소 현황 안내(데이터 기준일자: 2026년 7월 10일)충청남도 당진시는 구직자와 구인업체 간의 원활한 연계를 지원하고 건전한 고용시장 환경을 조성하기 위해 관내 직업소개소 운영 현황을 관리하고 있습니다.본 자료는 2026년 7월 10일 기준, 당진시에서 현재 영업 중인 직업소개소의 현황을 정리한 것으로 다음 항목들을 포함하고 있습니다:상호명주소본 자료는 고용 관련 행정업무, 노동시장 분석, 구직자 안내 자료 제공,민원 대응, 대시민 고용정보 서비스 구축 등 다양한 목적에 활용될 수 있습니다.'
