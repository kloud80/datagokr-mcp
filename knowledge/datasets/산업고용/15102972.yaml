description_portal: 한국무역협회(KITA) 통계를 기반으로 산출한 한국의 북아메리카 대륙산 LNG 월별 수입현황 및 비용에 관한 자료입니다. 북아메리카(미국, 캐나다 등)는 셰일가스 생산 확대로 LNG 수출이 급증한 지역으로, 수입처 다변화의 핵심 대상입니다. 본 데이터는 대륙별 LNG 수입 동향 분석 및 조달 전략 수립을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연월일, 환율(원/달러), 금액(백만달러), 중량(톤), 단위가격(톤당 달러), 단위가격(MMBtu당 달러) 등이 포함되어 있습니다. 본 데이터를 활용하면 북아메리카산 LNG 수입량 및 가격 추이 분석, 수입처 다변화 전략 수립, 가격 경쟁력 비교, 신규 사업 기획 및 정책 의사결정 지원에 기초자료로 활용할 수 있어 LNG 조달 전략 수립과 에너지 안보 강화에 기여할 것으로 기대됩니다.
