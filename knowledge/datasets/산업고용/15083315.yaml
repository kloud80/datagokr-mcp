summary_user: 에너지소비효율등급 라벨이 부착된 전자·전기·가정용 기기를 모델명 단위로 담은 제품 원장으로, 품목명·효율등급(1~5등급)·최대소비전력량·용량·이산화탄소 배출량·연간 에너지비용을 담는다. 소비자가 같은 품목에서 연간 전기요금이 적은 1등급 모델을 고르거나, 연구자가 품목별 등급 분포와 소비전력을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 모델명·품목명 같은 이름 매칭이나 같은 기관(한국에너지공단)의 고효율기자재 등 인증 제품 데이터와 이름 기준으로만 이어 쓴다.
limits: 전역 조인 키가 없어 제조사 코드나 판매·보급 실적 데이터와 정확히 연결되지 않으며 이름 매칭에 의존해야 한다. 전국 범위의 비공간 제품 목록이라 지역별 보급이나 실제 사용량 분석에는 쓰지 못한다.
