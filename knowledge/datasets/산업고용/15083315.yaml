description_portal: 에너지소비효율등급제도는 1992년부터 도입되어 전력소비가 크고 보급률이 높은 전자·전기제품 및 가정용 기기 등을 대상으로 제품의 에너지소비 효율성을 1등급(최고 효율)부터 5등급(최저 효율)으로 구분하여 에너지소비효율등급라벨을 부착하도록 하는 정부의 대표적인 에너지 관리정책입니다.기기부문 제품 데이터는 에너지소비효율등급 라벨이 부착된 제품별로 세부 등급과 소비전력량, 용량, 연간 이산화탄소 배출량 및 예상 연간 에너지 비용 등 소비자의 제품 선택과 연구기관의 에너지 효율 분석에 필수적인 상세 항목을 포함하고 있습니다. 본 데이터는 효율적인 에너지 소비문화 확산과 에너지 절약형 제품 생산 촉진을 위한 정책연구 및 소비자 홍보에 폭넓게 활용됩니다.
