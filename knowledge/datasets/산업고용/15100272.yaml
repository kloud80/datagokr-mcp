summary_user: 한국전력공사 제주본부의 PPA(전력구매계약) 고객 발전량을 기간·에너지 종류(태양광·풍력·바이오에너지)별 구입량 발전량(kWh)으로 담은 집계 파일이며, 포털 설명상 2022년 12월~2024년 6월 기간을 다루고 파일 크기는 약 2.4KB로 작다. 분석가나 연구자가 '제주에서 PPA로 들어오는 재생에너지 발전량이 기간별로 어떻게 변했고 태양광·풍력·바이오 중 어느 쪽 기여가 큰가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기간(월)과 에너지원 이름을 맞춰 제주 지역 발전원별 통계 등과 나란히 비교하는 방식으로만 이어 쓴다.
limits: 표준 코드형 조인 키가 없어 이름·기간 매핑으로만 연결된다. 실시간·일별 수급 데이터가 아니라 과거 기간 집계 파일이므로 오늘의 수급 판단에는 쓰지 못한다. 메타데이터상 범위는 전국으로 표기돼 있으나 내용은 제주본부 PPA 고객에 한정된다.
