summary_user: 한국농어촌공사 진도지사가 관리하는 진도 태양광 발전소(전남 진도군 지산면) 한 곳의 발전량을 날짜·발전기별로 01시~24시 시간대별 값과 일 합계로 담은 파일(csv, 약 52KB)이다. 이 발전소의 하루 중 발전 패턴이나 날짜별 발전량 변화를 보고 기상 조건과의 관계나 태양광 발전 효율을 분석하려는 연구자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜나 발전기명을 맞춰 붙이는 방식으로만 이어 쓴다.
limits: 단일 발전소의 자료라 지역·전국 단위 발전량이나 전력 수급 상황을 대표하지 못한다. 발전소 코드 등 공통 키가 없어 발전소 원장이나 다른 발전 데이터와의 연결은 이름·날짜 수작업 매핑에 의존한다.
