summary_user: 중소벤처기업부와 창업진흥원이 운영한 대학기업가센터의 주관기관(대학)별 기관명과 소재지를 담은 목록 파일로, 전국 범위이며 파일 크기가 122바이트에 불과한 소규모 자료다. 지역 창업생태계를 분석하는 연구자나 정책 담당자가 '어느 지역 어느 대학이 대학기업가센터를 운영했는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대학명(주관기관)이나 소재지 문자열을 직접 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 중소벤처기업부와 창업진흥원이 공동으로 운영하는 「대학기업가센터」의 주관기관 정보를 정리한 자료로, 전국 주요 대학을 중심으로 창업문화 확산과 창업 교육 내재화를 추진하고 있는 센터별 운영 현황을 포함합니다. 각 항목은 대학기업가센터를 운영하는 주관기관의 기관명과 소재지로 구성되어 있으며, 지역별 창업거점 대학의 분포를 확인하고 창업 인프라 및 프로그램 운영 주체에 대한 정보를 파악할 수 있습니다. 본 데이터는 향후 권역별 창업교육 수요 분석, 지역 창업생태계 연계 강화, 창업지원정책의 지역균형 발전 전략 수립 등에 기초자료로 활용될 수 있습니다.
