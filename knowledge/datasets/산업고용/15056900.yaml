summary_user: 경기도 31개 시군에서 인허가된 노동조합을 조합 한 곳당 한 행으로 담은 원장으로, 조합명·인허가일·영업상태·폐업일·조합원 수(남녀별)·소속 연합단체·주소와 좌표를 포함한다. 노동 분야 연구자나 지자체 담당자가 '경기도 어느 시군에 노동조합이 많고, 어느 상급단체 소속이며 조합원 규모와 성비는 어떤가'를 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시군 코드·시군명이나 주소·조합명 매핑으로만 전국노동조합표준데이터 등 다른 노동조합 데이터와 연결한다.
description_portal: 경기도 내 노동조합 현황입니다. 근로조건의 유지·개선, 기타 근로자의 경제적·사회적 지위의 향상을 도모하는 것을 목적으로 조직된 단체의 정보를 제공합니다.※ 경기도 31개 시군의 인ㆍ허가 데이터입니다.※ 지방행정데이터개방시스템(http://www.localdata.kr) 전면 개편(데이터 통합 및 데이터 개방 중단)에 따라 데이터 갱신이 2018년 9월 6일자로 중지되었습니다.경기도 내 노동조합 현황 데이터는 근로자들이 자발적으로 조직한 단체에 대한 정보로, 이들 단체는 주로 근로조건의 유지 및 개선, 그리고 근로자의 경제적·사회적 지위 향상을 목적으로 활동합니다. 이 데이터는 경기도에 속한 31개 시군에서 인허가된 노동조합들의 정보를 포함하고 있으며, 지역 내 노동조합의 분포와 특성을 이해하는 데 유용한 자료입니다. 다만, 본 데이터는 지방행정데이터개방시스템(http://www.localdata.kr)의 전면적인 개편 작업—데이터 통합 및 기존 데이터 개방 중단 조치—으로 인해 2018년 9월 6일 이후로는 더 이상 갱신되지 않고 있습니다. 따라서 최신 정보를 필요로 하는 경우에는 별도의 채널을 통해 확인이 필요합니다.
