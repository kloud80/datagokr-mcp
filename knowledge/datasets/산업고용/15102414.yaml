description_portal: 산업통상자원부(한국에너지공단)의 사업과 연계하여 인천광역시에서 시행하고 있는 신재생에너지 주택지원사업의 추진실적에 대한 정보입니다. 해당 사업은 인천소재의 단독주택을 대상으로 신재생에너지(태양광, 태양열, 지열, 연료전지)의 설치 비용 중 일부를 지원하고 있습니다. 신청자는 국비, 시비, 군구비 지원을 받아 최소한의 자부담으로 신재생에너지원을 설치할 수 있습니다. 기 설치된 가구에 중복 지원은 되지 않으며, 설치용량 제한은 매년 동일하나 총 공사비는 변동됨으로 이에 따라 보조금도 매년 변동되고 있습니다. 또한 보조금 가산 도서지역 구분이 있어 강화군, 옹진군은 보조금을 추가로 지원받게 됩니다. 해당 데이터는 사업을 통해 설치된 신재생에너지원의 종류 및  설치 가구수, 보급용량, 소요예산 등에 관한  항목을 제공하고자 합니다.
