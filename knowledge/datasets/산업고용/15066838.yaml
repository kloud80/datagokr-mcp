description_portal: '한국가스안전공사에서 수집, 관리하는 수소충전소 운영 현황정보입니다. 전국에 소재한 수소충전소 시설 현황에 대한 충전소명, 공급방식, 상세주소, 충전기 수, 상세위치(위도, 경도)에 대한 정보가 수록되어 있습니다. 수소 안전관리 또는 수소 자동차에 대한 원활한 연료 수급이 가능하도록 도움을 목적으로 개방된 데이터입니다. - 해당 데이터는 공사가 수소 안전관리 업무수행을 위해 관리되는 데이터로, 타 유관기관이 수집하는 충전소 정보와는 일부 상이할 수 있으니 참고바랍니다.- 데이터기준일 : 2026년 5월 31일'
