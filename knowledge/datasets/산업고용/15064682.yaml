summary_user: '부산광역시 영도구 관내 전문건설업 등록업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·등록업종·소재지·전화번호와 위도·경도 좌표를 포함한다. 영도구에서 특정 공종(예: 실내건축, 철근콘크리트)을 맡길 전문건설업체를 찾는 발주자나, 지역 건설업 공급 현황을 파악하려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호·소재지 이름 매칭이나 좌표 기반 공간 결합으로 잇고, 같은 지방행정 인허가(LOCALDATA) 계열의 다른 구군 건설업 파일과는 구군명으로 묶어 쓴다.'
description_portal: 부산광역시 영도구 전문건설업 현황입니다.부산광역시 영도구 전문건설업 현황에 대한 데이터로 관내 전문전문건설업 상호, 소재지, 등록업종등의 항목을 제공합니다.업체 정보(상호, 업종, 소재지, 전화번호 등) 포함되어 있으며 매월 등록사항(신규, 변경, 폐업 등)을 현행화하여 데이터 수정하고 있습니다. 영도 지역 내 위치한 건설업체의 정보를 제공함으로써 건설산업 내 공급자 및 수요자들이 정보를 활용할 수 있으며, 지역 건설업 상황을 보여주는 지표로 사용할 수 있습니다. 자료에 대한 구체적 문의는 건설과 담당자에게 연락하시기 바랍니다.
