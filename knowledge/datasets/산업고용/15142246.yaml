summary_user: 군포시 내 공공기관이 설치한 태양광발전소를 시설 한 곳당 한 행으로 담은 원장 파일로, 시설명·도로명/지번 주소·위경도·설비용량·설치연월·용도(발전사업 또는 자가소비)를 담는다. 군포시 공공건물에 태양광이 어디에 얼마만큼 설치돼 있는지, 언제 설치됐는지를 확인하려는 시민·에너지 정책 분석가가 쓴다. 전역 조인 키는 없어 주소나 위경도로 지도·건물 정보와 겹쳐 보거나, 시설명·주소를 맞춰 전국 태양광발전소 전기사업허가 표준데이터와 대조하는 방식으로 이어 쓴다.
description_portal: 경기도 군포시의 공공기관 태양광발전소 설치 현황은 다양한 항목으로 구성되어 있습니다. 이 항목들은 태양광발전소명, 소재지 주소, 위경도, 설비 용량, 설치 연월, 용도(발전사업 또는 자가소비), 데이터 기준일자 등으로 나뉘어 있습니다. 이러한 정보는 군포시 내의 태양광 발전소가 어디에 위치하고 있는지, 얼마나 많은 전력을 생산할 수 있는지를 이해하는 데 큰 도움이 됩니다. 각 발전소의 설치 시기와 용도에 대한 정보는 태양광 발전소의 운영 방식과 효율성을 파악하는 데 중요한 역할을 하며, 이를 통해 군포시의 에너지 정책과 지속 가능한 발전 방향을 이해할 수 있습니다.
