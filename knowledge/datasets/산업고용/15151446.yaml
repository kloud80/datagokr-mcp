summary_user: 경기도 데이터포털(data.gg.go.kr)에서 제공하는 프랜차이즈 가맹사업 자료로, 연도·상호(브랜드)별로 자산 규모, 신규 개점 수, 계약 종료 수를 집계해 담는다. 예비 창업자나 상권 분석가가 '이 브랜드는 해마다 새로 여는 가맹점보다 계약이 끝나는 가맹점이 많은가'를 따져 창업 안정성을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 상호명이나 시도코드(sido_cd)를 이름·코드 매핑으로 맞춰야 이어진다.
description_portal: 이 데이터는 경기도에 등록된 프랜차이즈 가맹점들의 연도별 개점 및 폐점 현황을 보여주는 자료로, 상호명, 시도코드, 자산 규모, 신규 개점 건수, 계약 종료 건수 등의 항목으로 구성되어 있습니다. 각 연도에 해당 프랜차이즈 브랜드의 성장 또는 축소 경향을 파악할 수 있으며, 업종별 시장 동향이나 브랜드별 성과 분석에 활용할 수 있습니다. 특히 신규 개점 및 계약 종료 건수는 프랜차이즈 사업의 안정성과 시장 반응을 판단하는 주요 지표로 사용됩니다. 이 자료는 창업 안정성 분석, 업종별 시장 진입 및 이탈 패턴 파악 등 정책 및 경영 전략 수립에 기초 자료로 활용됩니다.
