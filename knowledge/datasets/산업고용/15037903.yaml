summary_user: 한국남부발전과 상생협력 관계를 맺은 협력사를 기업 한 곳당 한 행으로 정리한 목록으로, 기업명·소재지역·설립년도·주생산품과 매출액·수출액·자산총액(억원), 종업원수를 담은 소규모 CSV 파일(약 5KB)이다. 중소기업 정책 분석가나 연구자가 '발전 공기업의 협력사는 어느 지역에 있고 매출·고용 규모가 어느 정도인가'를 확인할 때 쓴다. 사업자등록번호 같은 공통 조인 키가 없어서 다른 기업 데이터(벤처·이노비즈 인증 등)와는 기업명이나 소재지역 이름을 맞춰서만 연결한다.
description_portal: 이 데이터는 한국남부발전과 협력 관계를 맺고 있는 상생협력사 목록을 정리한 자료입니다. 각 기업의 명칭, 소재 지역, 설립년도, 주요 생산품을 비롯해 매출액, 수출액, 자산총액, 종업원 수 등의 정보가 포함되어 있습니다. 이를 통해 협력사의 경영 현황과 주요 생산 역량을 파악할 수 있으며, 지역 기반 기업의 참여 현황과 성장 수준을 객관적으로 확인할 수 있습니다. 본 자료는 공공기관이 지역기업과의 동반 성장을 위해 어떤 협력 네트워크를 구축하고 있는지를 보여주며, 상생협력 정책의 성과를 분석하는 기초 자료로 활용될 수 있습니다. 또한 중소기업 지원 정책 수립, 산업 생태계 연구, 공기업-민간기업 협력 강화 방안 마련에도 의미 있는 데이터를 제공합니다.
