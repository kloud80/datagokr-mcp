summary_user: 부산광역시 연제구에서 지정한 담배소매인을 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 소매인 구분·업소명·도로명/지번 주소·지정일자를 담는다. 동네에서 담배를 파는 곳을 찾거나, 새 소매인 지정을 검토하는 사업자·분석가가 기존 영업소 위치(50미터 거리 기준)를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭으로만 잇고, 지방행정 인허가(LOCALDATA) 담배소매업 자료나 소상공인 상가업소 정보와 주소 기준으로 대조해 쓴다.
description_portal: 부산광역시 연제구 담배소매인 지정 현황(사업장명, 도로명주소, 지정일자)에 대한 데이터로 아래와 같이 제공합니다.“담배”란 연초(煙草)의 잎을 원료의 전부 또는 일부로 하여 피우거나, 빨거나, 증기로 흡입하거나, 씹거나, 냄새 맡기에 적합한 상태로 제조한 것을 말합니다.담배사업법 시행규칙 제7조의3제4항 및 부산광역시 연제구 담배소매인 지정 등에 관한 규칙 제7조에 따른 소매인의 지정기준은 아래와 같습니다.1. 소매인 영업소 간 거리를 50미터 이상으로 일정하게 유지할 것 2. 다음 각 목을 포함하여 법 제16조제2항제2호의 부적당한 장소에 해당하지 않을 것 <개정 2020.10.5.>가. 약국, 병·의원 등 보건의료 관련 장소. 나. 게임장·문구점·만화방 등 청소년(「청소년보호법」제2조제1호에 따른 청소년을 말한다)이 주로 이용하는 장소 다. 부동산중개사무실·인력사무실·유흥업소·여관·목욕장업·세차장 및 세탁소 등 비판매시설 라. 야간에 주로 영업하거나 자주 폐점하여 소비자의 불편을 초래 할 수 있는 영업장
