summary_user: 충청남도 아산시에 신고된 행정사사무소를 사무소 한 곳당 한 행으로 담은 파일로, 신고연월일·행정사 종류(일반·외국어·해사)·대표자 성명·상호·소재지 주소·영업상태를 제공한다(CSV 약 5.6KB 규모). 아산시에서 외국어행정사 등 특정 종류의 행정사사무소가 어디에 있고 현재 영업 중인지 찾는 시민이나, 지역 행정사 업종 분포를 보는 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소나 상호명을 맞춰 붙이거나, 다른 지자체의 행정사사무소 현황·지방행정 인허가(LOCALDATA) 행정사 업종 자료와 같은 항목끼리 이어 쓴다.
description_portal: 행정사는 타인의 선임에 의하여 보수를 받고 행정기관에 제출하는 서류나 권리 및 의무사항, 사실증명에 관한 서류의 작성 및 제출을 업으로 하는 자를 말하며 소관 업무에 따라 일반행정사, 외국어행정사 및 해사행정사로 나뉜다. <행정사법 제4조>행정사는 행정기관에 제출한 서류를 다룬다는 점에서 사법기관(법원·검찰청)에 제출할 서류의 작성을 업으로 하는 법무사와 구별되며, 법무사 제도를 대법원에서 관장하는 것과 달리, 행정사 제도는 행정안전부가 관장하고 있다.충청남도 아산시 소재 행정사사무소 현황으로  신고년월, 행정사종류, 대표자성명, 상호명, 소재지 데이터를 제공합니다.
