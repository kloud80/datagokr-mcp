description_portal: 본 데이터는 한국중부발전이 추진한 연료전지 발전설비 구축 현황을 정리한 자료로, 항목은 구분, 용량(MW), 형식, 위치, 시공사, 공사 시작일, 공사 종료일로 구성되어 있습니다. 연료전지 형식에는 PAFC(인산형 연료전지)와 SOFC(고체산화물 연료전지)가 있으며, PAFC는 안정적인 장시간 운전이 가능한 저비용 기술이며, SOFC는 고온에서 작동하고 다양한 연료를 사용할 수 있는 고효율 기술입니다. 주요 사업 중 하나인 "빛고을에코에너지"는 중부발전이 29%의 지분을 보유하고 있고, SK가스, 두산건설, FI가 나머지 지분을 분산 보유하고 있습니다. 본 데이터는 민관합작 투자현황, 연료전지 기술 분포 분석 등에 활용될 수 있습니다.
