summary_user: 중소기업중앙회가 모은 중소기업 해외전시회 정보를 전시회 건별로 담은 CSV 파일(약 79만 바이트)로, 포털 설명상 2007~2025년 개최분과 2025년 개최 예정분의 개최국가·도시·건물, 전시 분야·품목, 개최·모집 기간, 한국참가 주관단체를 포함한다. 수출을 준비하는 중소기업이 '우리 품목으로 참가할 만한 해외전시회가 어느 나라에서 언제 열리고, 한국관 참가 모집은 언제까지이며 어느 단체가 주관하나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 개최국가명·전시 분야·주관단체명 같은 이름을 기준으로 다른 수출·해외시장 자료와 맞춰 이어 쓴다.
description_portal: '* 중소기업중앙회의 중소기업해외전시회정보 자료입니다.* 자세한 정보는 SOEP 중소기업 해외전시포탈에서 확인하여 주시기 바랍니다.(smes.go.kr/sme-expo)* 2007~2025년 기간동안 개최되었고, 기개최 및 2025년 개최 예정인 중소기업 해외전시회 정보에 대해 알 수 있습니다.* 데이터 구성은 전시회 개최년도, 한글명, 영문명(약칭, 전체), 개최주기, 개최국가, 개최도시, 개최건물, 전시분야, 전시 품목, 전시 시작일, 종료일, 한국참가 주관단체명, 한국참가 주관단체 주소, 전시회 모집기간 시작일, 종료일 순입니다.'
