summary_user: 부산광역시 북구 관내 LP가스 판매업소를 업소 한 곳당 한 행으로 담은 건별 원장 파일로, 판매 구분·업소명·소재지 주소·허가일자·전화번호를 담는다(CSV 약 1KB 규모의 소량 파일). 북구 주민이나 사업자가 '우리 동네 가까운 LP가스 판매점이 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 관내 판매업소의 허가 시기 분포를 살펴보는 데 쓴다. 전역 조인 키(사업자번호·좌표 등)가 없어 다른 데이터와는 업소명·소재지 주소를 맞춰 보는 방식으로만 이어 쓰며, 같은 업종을 다루는 지방행정 인허가(LOCALDATA) 원장과 주소 기준으로 대조하는 정도가 현실적이다.
limits: 사업자번호·좌표 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵고 이름·주소 매칭에 의존해야 한다. 범위는 부산 북구 한 곳뿐이라 부산 전체나 다른 시군구 비교에는 쓰지 못한다.
