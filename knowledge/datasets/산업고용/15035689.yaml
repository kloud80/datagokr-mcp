summary_user: 대전광역시 중구 관내 석유판매업소(주유소·일반판매소)를 업소 한 곳당 한 행으로 담은 파일로, 사업구분·상호·도로명 영업소 소재지를 제공하며 포털 설명상 2025년 7월 1일 기준 자료다. 중구 주민이나 사업자가 '우리 동네에 등록된 주유소와 일반판매소가 어디 있나'를 확인하거나, 분석가가 시군구 단위 석유판매업 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·도로명 주소 매칭으로만 잇고, 유가는 오피넷 주유소 가격 데이터와 상호·주소로 대조해 붙인다.
description_portal: 대전광역시 중구 관내에 위치한 석유판매업(주유소, 일반판매소)에 대한 데이터입니다.자료항목은 사업구분, 상호, 영업소 소재지(도로명)를 제공합니다.2025년 7월 1일 기준으로 작성된 자료이며, 기준 날짜 이후 「석유 및 석유대체연료 사업법」 제10조3항에 따라 석유판매업 변경등록 되었을 수 있습니다.이에 따라 데이터 내 정보와 다를 경우, 자세한 사항은 일자리경제과 에너지팀(☎042-606-7253)으로 연락주시면 안내해 드리겠습니다.  * 주유소 내 휘발유, 경유, 실내등유의 판매금액이 궁금하신 경우 오피넷 홈페이지(https://www.opinet.co.kr/)에서 확인 가능하오니 참고하여 주시기 바랍니다.
