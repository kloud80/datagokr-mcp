summary_user: 증평군 관내에 등록된 행정사 사무소를 한 행에 하나씩 담은 파일로, 행정사 종류·대표자·사무실명·주소·대표전화를 수록한다(CSV 628바이트의 소규모 목록). 증평군 주민이 인허가나 출입국 서류 대행을 맡길 근처 행정사 사무소와 연락처를 찾을 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사무실 주소나 이름을 매핑하거나 같은 기관(증평군) 기준으로만 이어 쓰며, 다른 시군의 행정사 현황이나 지방행정 인허가(LOCALDATA) 업종 자료와 나란히 놓고 비교하는 정도로 연결한다.
limits: 사업자번호·좌표·코드 같은 공통 키가 없어 다른 데이터와 자동으로 결합하기 어렵다. 범위가 증평군 한 곳이라 전국이나 다른 지역 행정사 현황은 각 기관 자료를 따로 받아야 한다.
