summary_user: 서울에너지공사 지사별로 측정한 시수 사용량을 날짜(dates)와 지사 단위로 담은 건별 API 데이터이며, 지사 코드·지사명, 구분명(waterClsfcNm), 사용량 항목으로 구성된다. 지역난방 운영을 분석하는 사람이 어느 지사에서 어느 날 시수 사용량이 크게 늘었는지 확인하고 사용 패턴을 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 지사 코드(branchCd)나 지사명을 기준으로 같은 기관 자료끼리만 이어 쓴다.
limits: 전역 조인 키가 없어 행정구역 코드 기반의 다른 지역 통계와 바로 결합할 수 없고, 비공간 데이터라 위치 정보가 없다. 호출에는 serviceKey가 필요하며 개발계정은 하루 3,000회로 제한된다.
