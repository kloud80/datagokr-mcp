summary_user: 세종특별자치시 안의 음식물류폐기물 다량배출사업장을 사업장 한 곳당 한 행으로 담으며, 상호·주소·전화번호·사업장 종류·운영방식·처리용량(prcsCpcty)을 제공한다. 사업자나 분석가가 세종시에서 음식물쓰레기를 많이 내는 사업장이 어디에 있고 어떤 방식으로 얼마만큼 처리하는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주소·사업장명을 매핑하거나 같은 기관 코드로만 이어 쓴다.
limits: 범위가 세종시 한 시도에 한정되어 다른 지역과 비교하려면 별도 데이터가 필요하다. 공통 식별 코드가 없어 주소·이름 매칭으로 연결해야 하고, 그 과정에서 매칭 오류가 생길 수 있다. 포털 분류는 발전소 배출 측정 부문이지만 실제 내용은 폐기물 배출사업장 목록이므로 발전소 측정값은 들어 있지 않다.
