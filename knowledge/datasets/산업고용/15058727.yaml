summary_user: 근로복지공단 지사별·연도별로 산재보험 장애급여 수급자 수와 지급액(백만원)을 전체·연금·일시금으로 나눠 담은 집계 자료다. 정책 분석가가 "어느 지사에서 장애급여를 연금보다 일시금으로 받는 비중이 높은가, 연도별로 어떻게 바뀌는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)와 지사명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 산재보험에 따른 장애급여 수급 현황을 연도별·지사별로 집계한 자료입니다. 주요 항목에는 기준년도, 지사명, 전체 수급자수, 전체 지급 금액(백만원), 연금 수급자수와 연금 지급액, 일시금 수급자수와 일시금 지급액이 포함되어 있습니다. 이를 통해 각 지사별 산재보험 장애급여 지급 규모와 수급 형태(연금·일시금)를 확인할 수 있으며, 연도별 추이를 분석하여 제도의 효과성을 검토할 수 있습니다. 해당 데이터는 지역별 산재보상 정책 평가, 장애급여 재정 관리, 사회보험 운영 효율성 분석 등에 활용될 수 있으며, 특히 연금과 일시금 지급 방식의 비중 차이를 통해 제도적 개선 방향을 도출하는 근거로 활용될 수 있습니다.
