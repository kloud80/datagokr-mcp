summary_user: 한국남부발전 발전소 주변의 수질을 발전소별·1시간 단위로 측정한 결과(수소이온농도, 화학적산소요구량, 부유물질, 총질소, 총인, 적산유량)를 담는 건별 측정 API로, 기간(연-월-일)과 발전소를 지정해 조회한다. 지역 주민이나 환경 분석가가 '특정 남부발전 발전소 인근 수질이 기간에 따라 어떻게 변했나'를 확인하는 데 쓴다. 다른 데이터와 잇는 공통 조인 키는 없으며, 발전소명(saupso)으로 같은 기관의 대기오염물질·주변 기상 측정 데이터나 환경·기상 데이터와 이름 매핑해 연결한다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전소주변수질정보_GW 입니다.해당 서비스를 통해 사용자는 원하는 기간(연도-월-일)과 조회를 희망하는 발전소를 지정하여 해당 발전소 주변의 수질정보를 조회할 수 있습니다.발전소 주변의 수질정보를 한시간 단위로 측정한 결과값을 조회할 수 있습니다.해당 데이터를 활용하여 한국남부발전(주) 발전소 인근의 수질의 현황과 변화추이 등을 종합적으로 판단할 수 있습니다.
