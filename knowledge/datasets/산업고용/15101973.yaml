summary_user: 울산광역시 울주군에 있는 직업소개업체(인력사무소·가사원 등)를 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·사업소 주소·유료/무료 구분이 들어 있고 범위는 울주군 한 곳입니다. 구직자나 일손이 필요한 사업자가 울주군 내 어느 동네에 어떤 인력사무소가 있는지, 소개 비용을 받는 곳인지 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 문자열로 맞춰 이어야 하며, 지방행정 인허가(LOCALDATA) 직업소개업 원장과 대조할 때도 같은 방식으로 연결합니다.
description_portal: 울산광역시 울주군에 소재한 직업소개업(인력사무소, 가사원) 현황 자료는 지역 내 다양한 직업소개소 및 인력사무소, 그리고 가사원 업체들을 대상으로 사업소명, 주소와 같은 기본 정보를 포함하여 제공하고 있습니다. 이 자료는 정보공개 신청을 통해 제공되는 형태로서, 해당 데이터의 일부 항목이나 형식이 공공데이터 포털 등에서 제공하는 표준 데이터와 다를 수 있습니다. 따라서 이용 시 이 점을 양해하여 주시기 바랍니다.[데이터 세부항목 변경 안내]1. 업소 전화번호 삭제2. 직업소개비용유무 추가
