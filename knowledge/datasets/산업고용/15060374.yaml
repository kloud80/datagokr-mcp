summary_user: 경상남도 함양군 관내에서 사업장폐기물 배출자로 신고된 사업장을 한 행씩 담은 건별 원천 목록으로, 포털 설명상 41건이며 상호·폐기물 종류·처리 방식(위탁·자가 재활용·자가 매립)·도로명주소·신고기준년도를 담는다. 함양군에서 어떤 사업장이 어떤 폐기물을 내고 위탁과 자가 처리 중 어느 쪽으로 처리하는지 확인하려는 주민·폐기물 처리업체·환경 분석가가 쓴다. 사업자등록번호(bizno)로 사업자 상태·인허가 데이터와 잇고, 도로명주소로 지도 위치나 다른 시군구 단위 데이터와 맞춰 쓴다.
description_portal: 관내 사업장폐기물 배출자 신고현황으로 폐기물관리법 제17조(사업장폐기물배출자의 의무 등) 및 폐기물관리법 시행규칙 제18조(사업장폐기물배출자의 신고)에 따라 신고된 41개 자료입니다. 생활계구분, 상호명, 폐기물종류, 사업자등록번호, 전화번호, 처리구분, 사업장도로명주소, 신고기준년도, 데이터 기준일자로 구성되어 있으며, 생활계구분은 배출시설계와 비배출시설계로 구분되며, 폐기물종류는 처리구분은 위탁, 자가(재활용), 자가(매립)으로 나누어져 있습니다. 폐기물 종류에 따른 통계분석, 주소 기반 GOS 시각화, 시설 입지 및 환경 인프라 분석 등의 자료로 활용할 수 있습니다.
