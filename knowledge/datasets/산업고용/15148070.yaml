summary_user: 서울 구로구의 고압가스업 인허가 사업장을 한 건씩 담은 원장으로, 인허가일자·영업상태·폐업일·사업장명·지번/도로명 주소·좌표(X, Y)·업태 등을 사업장 단위로 기록한다. 구로구에서 현재 영업 중인 고압가스 사업장이 어디에 있는지, 언제 허가받았거나 폐업했는지 확인하려는 주민·안전관리 담당자·분석가가 쓴다. 전역 조인 키는 없어서 같은 LOCALDATA 계열의 다른 에너지 업종 인허가(석유판매·LPG·도시가스 등)나 다른 자치구 데이터와는 사업장명·주소 매칭이나 기관 코드(OPNSFTEAMCODE)로만 잇는다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 고압가스업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 고압가스업 시설의 안전관리 사항, 업태구분 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 안전 관리, 정책 수립, 연구 분석, 민원 처리 등 다양한 분야에서 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계하여 활용할 수 있어 행정 투명성과 지역사회 정보 접근성을 높이는 기반 자료로 기능한다. 또한 데이터 항목이 표준화되어 비교와 통계 작성이 가능하며, 허가 변경 이력과 상태 값이 포함되어 행정 지도와 점검에 유용하다.
