summary_user: 대전 지역에 등록된 한국정보통신공사협회 회원 정보통신공사업체를 업체 한 곳당 한 행으로 담은 파일로, 등록번호·상호·대표자 성명·주소와 시공능력평가액(천원 단위)을 싣는다. 공공 정보통신공사를 발주하거나 입찰을 검토하는 담당자가 '대전에서 시공능력평가액이 일정 규모 이상인 정보통신공사업체는 어디인가'를 확인하거나, 지역 업체끼리 시공 규모를 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매핑으로만 붙일 수 있고, 업종 인허가(LOCALDATA) 계열 원장과도 같은 방식으로 대조한다.
limits: 사업자번호나 좌표 같은 공통 키가 없어 다른 기업·인허가 데이터와 정확히 조인하기 어렵고, 상호·주소 문자열 매칭에 의존해야 한다. 협회 회원사 현황이므로 대전 지역 정보통신공사업체 전체를 담는다고 단정할 수 없다.
