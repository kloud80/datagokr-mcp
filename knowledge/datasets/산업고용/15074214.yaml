description_portal: 이 데이터는 한국남부발전이 출자한 태양광 발전회사의 발전 설비 현황과 연도별 발전 실적을 정리한 자료입니다. 각 발전소별 총 설비용량(MW), 모듈 제조사, 인버터 제조사 정보와 함께 2022년부터 2024년까지의 월평균 발전량(kWh)이 포함되어 있습니다. 이를 통해 발전소별 설비 특성과 운영 효율성을 비교할 수 있으며, 태양광 모듈 및 인버터 제조사의 다양성과 기술 활용 현황도 확인할 수 있습니다. 본 자료는 재생에너지 확대를 위한 태양광 발전의 기여도를 분석하고, 설비 운영 성과를 평가하며, 향후 에너지 전환 정책 수립과 친환경 발전 전략 마련에 기초 자료로 활용될 수 있습니다.
