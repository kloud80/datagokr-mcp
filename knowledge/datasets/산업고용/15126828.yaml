description_portal: 본 데이터는 경상북도 내 상시근로자 100인 이상 기업의 현황 정보를 제공합니다. 데이터는 년도별 정보를 포함하며, 각 기업의 사업체명을 기준으로 수집되었습니다. 주요 내용은 기업의 정확한 위치 확인을 위한 지번주소 및 도로명주소를 포함하고 있으며, 필요시 응답자와의 연락을 위해 응답자전화지역번호, 응답자전화국번호, 응답자전화일련번호 등의 전화번호 정보도 함께 수록되어 있습니다. 이 데이터는 지역 고용 통계 및 대규모 사업체의 분포 파악, 그리고 지역 산업 현황 연구 등에 활용될 수 있는 중요 자료입니다. 사용자 여러분의 데이터 검색 편의와 이해를 높이기 위해 컬럼명을 기반으로 상세히 서술하였습니다.
