summary_user: 경상북도 안 상시근로자 100인 이상 기업을 연도별로 사업체 한 곳당 한 행씩 담은 목록 파일로, 사업체명과 지번·도로명 주소, 응답자 전화번호를 담는다. 지역 고용 분석가나 기업 유치·일자리 담당자가 '도내 대규모 사업체가 어느 시군에 몰려 있는가'를 파악하는 데 쓴다. 전역 조인 키(사업자등록번호 등)가 없어 다른 데이터와는 사업체명이나 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
