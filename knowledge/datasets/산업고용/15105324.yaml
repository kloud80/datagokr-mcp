description_portal: 한국가스공사가 지원하는 053마켓 참여기업 리스트에 관한 자료입니다. 053마켓은 대구지역 소상공인, 전통시장 상인, 사회적경제기업 등이 온라인 시장에 진출할 수 있도록 공사가 지원하는 온라인 판매 플랫폼입니다. 본 데이터는 참여기업 현황 관리 및 온라인 판로 지원을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 제품번호, 업체명, 기업유형(소상공인/사회적기업 등), 제품명, 판매가(최저/최대) 등이 포함되어 있습니다. 본 데이터를 활용하면 053마켓 참여기업 현황 파악, 신규 참여 기업 접수 및 관리 지원, 기업별 제품 정보 확인, 온라인 판로 지원 사업 성과 분석에 기초자료로 활용할 수 있어 지역 소상공인 온라인 판로 확대와 공사의 사회적 가치 실현에 기여할 것으로 기대됩니다.
