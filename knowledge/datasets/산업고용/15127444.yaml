description_portal: '해당 데이터는 한국기상산업기술원에서 자체 생산한 데이터로, 신재생에너지(태양광) 발전량 예측을 위해 생성한 데이터입니다.1. 데이터 생성가. 생성 목적: 머신러닝 기반의 기상예측 보정모델 성능 개선을 위한 학습 데이터로 수치모델을 활용하여 기후시나리오 4종(FNL1~4)에 대한 변수 추출나. 생성 변수/단위 - 지표면 부근 고도 기온(TEMP) - 하향 단파복사(SWDOWN)다. 활용 모델: WAF(Weather Research and Forcasting Model) v.4.2.1라. 대상 지역: 서울 관측소(종로구 송월동)마. 모의 기간: 2021. 1. 1. ~ 2022. 6. 30.바. 모의 영역: 한반도사. 출력 기간: 2021년 1월, 4월, 7월, 10월 (각 계절의 중간 기간)아. 변수 단위- 기온: Kelvin (K)- 하향 단파복사: Watt per Square Meter (W/m^2)2. 기후시나리오 목록가. 적운모수화(공통): Kain_Fritcsh나. 미세물리 모수화- 기후시나리오1(FNL1) 및 기후시나리오3(FNL3): WSM5- 기후시나리오2(FNL2) 및 기후시나리오4(FNL4): WSM6다. 대기복사 모델- 기후시나리오1(FNL1) 및 기후시나리오2(FNL2): RRTM- 기후시나리오3(FNL3) 및 기후시나리오4(FNL4): GODDARD'
