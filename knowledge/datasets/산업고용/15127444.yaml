summary_user: 서울 관측소(종로구 송월동) 한 지점에 대해 WRF 수치모델로 모의한 기후시나리오 4종(FNL1~4)의 지표 부근 기온(K)과 하향 단파복사(W/m²)를 관측값과 나란히 시간별로 담은 약 10KB 규모의 CSV 파일이다. 출력 기간은 2021년 1·4·7·10월이다. 머신러닝 기반 기상예측 보정모델이나 태양광 발전량 예측 모델을 만드는 연구자가 '미세물리·복사 모수화 조합에 따라 일사량 모의 오차가 얼마나 달라지는가'를 따지는 학습·검증 자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 시간 컬럼을 맞추는 방식으로만 이어 쓰며, 같은 시기 서울 지역 기상관측이나 태양광 발전량 자료와 시각 기준으로 대조하는 정도다.
limits: 전력거래소 실시간 수급·발전량 자료가 아니라 과거 특정 4개월의 모의 학습용 자료다. 오늘의 수급이나 발전량은 이 파일로 알 수 없다. 공간 범위는 서울 한 지점뿐이어서 다른 지역의 일사량을 추정하는 데 쓸 근거가 없고, 다른 데이터와 직접 붙일 공통 키도 없다.
