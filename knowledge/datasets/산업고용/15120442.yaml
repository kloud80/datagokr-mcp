summary_user: e새일 교육의 일정을 강의 한 건 단위로 담으며, 교육일·시작시각·종료시각·강의명을 전국 범위로 제공한다. 경력단절여성이나 재취업 상담 실무자가 "이번 달 언제 어떤 e새일 강의가 열리는가"를 확인하거나, 서비스 개발자가 교육 일정 안내 화면을 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 직업훈련·일자리 데이터와는 강의명 같은 이름 매칭으로만 느슨하게 이어 쓴다.
limits: 지역 정보가 없는 비공간 데이터라 지역별 교육 현황을 나눠 보는 데는 쓸 수 없다. 공통 코드나 키가 없어 훈련과정·수강 실적과 정확히 연결하기 어렵다. 개발계정은 하루 10,000회까지만 호출된다.
