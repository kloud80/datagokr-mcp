description_portal: 경력단절여성등의 경제활동 촉진법 제13조 제1항과 관련하여 e새일 교육 일정 정보를 조회할 수 있도록 관련 서비스를 제공하는 오픈 API형 데이터입니다.  해당 개방데이터는 e새일 교육일자, 교육 시작시각, 교육 종료시각, 강사, 강의명 등을 조회할 수 있습니다.경력단절여성의 재취업 지원 및 고용 연계를 위한 정보로 활용 가능하며, 일자리 정책 수립 및 관련 서비스 개발 등에 기여할 수 있습니다. 나아가 지역 사회의 고용 활성화는 물론이고 맞춤형 취업 지원 정책 마련에도 활용될 수 있습니다.
