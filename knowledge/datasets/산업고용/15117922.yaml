description_portal: '도장·습식·방수·석공공사업체의 업체명, 주소, 연락처 등을 수록한 데이터.건축 마감 및 유지관리 분야 업체 현황을 파악하고, 건물 안전성 확보, 환경 개선, 건설산업 지원 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 도장·습식·방수·석공공사업 등록 업체 현황 분석– 업체 분포를 통한 건축 마감 및 유지관리 산업 기반 파악– 도로명주소 기반 업체 입지 특성 분석– 건축물 안전관리, 생활환경 개선, 건설정책 자료 활용주요 항목 설명● 업체명: 등록된 도장·습식·방수·석공공사업체의 명칭● 도로명주소: 해당 업체의 도로명 주소● 전화번호: 업체 연락을 위한 전화번호'
