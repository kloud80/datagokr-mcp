summary_user: 경상남도 창녕군에 있는 행정사사무소를 한 곳씩 담은 현황 파일로, 사무소명·도로명주소·위도·경도·전화번호·개업신고일을 사무소 단위로 담는다. 군민이 창녕군 안에서 가까운 행정사사무소와 연락처를 찾거나, 분석가가 군내 행정사사무소의 분포와 개업 시기를 살펴볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소를 맞추거나 위도·경도 좌표로 지도·상권 데이터에 겹쳐 쓰고, 지방행정 인허가(LOCALDATA) 업종 원장과는 이름 매칭으로 잇는다.
description_portal: 경상남도 창녕군에 있는 행정사사무소 현황입니다.1. 행정사사무소의 명칭, 행정사사무소의 주소(도로명주소), 위도, 경도, 전화번호(일반전화번호), 개업신고일 데이터를 포함하고 있습니다.2. 데이터 기준일은 2025년 9월 1일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 전화번호 없는 사무소가 자료에 존재합니다.(일반전화가 없거나 휴대전화번호로 공개가 불가한 경우)4. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 행정복지국 행정과 후생복지팀 055-530-1215로 문의 주시기 바랍니다.
