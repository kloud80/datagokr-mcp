summary_user: 한국가스공사가 맺은 계약을 건별로 담으며, 계약번호·차수, 계약명, 업무구분, 계약체결형태·방법, 계약일, 계약금액, 계약업체명과 사업자등록번호를 계약명 또는 업체명으로 조회한다. 사업자나 분석가가 '특정 업체가 한국가스공사와 언제 어떤 방식으로 얼마짜리 계약을 맺었나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 데이터와는 업체명·사업자등록번호(C_CODE로 추정) 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 계약명 또는 계약업체명을 이용하여 계약번호, 업무구분, 계약체결형태, 계약체결방법, 계약일, 계약금액, 사업자등록번호 등을 조회하는 계약정보 조회 서비스
