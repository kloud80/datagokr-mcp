description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 목록은 제주도 ESS 시간대별 계량데이터 정보를 제공합니다.*주의. 해당 데이터는 계량데이터이므로, 전력거래량과는 약간의 차이가 있을 수 있습니다.ㅇ 단위 : MWh, ㅇ 순방향이 방전량, 역방향이 충전량 입니다.ㅇ 해당데이터는 계량데이터 이기 때문에 발전하여 충전된 양에 약간의 한전 수전전력량이 포함될 수 있습니다.'
