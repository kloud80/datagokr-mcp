summary_user: KOTRA 수출바우처사업에서 기업이 고를 수 있는 제공서비스를 서비스 한 건씩 담은 목록이며, 서비스명·대상국가·사용언어·산업분야·등록일자를 담는다(전국 범위·비공간, CSV 약 800KB). 수출을 준비하는 중소기업이나 지원기관 담당자가 '특정 국가·언어·산업에 맞는 수출 마케팅·조사 서비스가 바우처로 제공되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대상국가명·산업분야명 같은 이름 매핑이나 같은 기관(KOTRA) 데이터 기준으로만 이어 쓴다.
description_portal: KOTRA에서 공공데이터포털에 제공하는 수출바우처사업 제공서비스 데이터는 수출바우처사업을 통해 기업들이 받을 수 있는 다양한 서비스에 대한 정보를 제공합니다. 수출바우처사업은 KOTRA가 주관하는 프로그램으로, 중소기업들이 해외 시장에 진출할 수 있도록 다양한 마케팅 지원, 시장 조사, 전시회 참여, 수출 상담 등 맞춤형 서비스를 제공합니다. 이 데이터는 수출을 희망하는 중소기업들이 수출 지원 프로그램을 이용할 수 있도록 돕는 중요한 자료입니다. 각 기업은 자신에게 필요한 수출 관련 서비스를 확인하고, 해당 서비스의 세부 사항을 바탕으로 참여할 수 있습니다.
