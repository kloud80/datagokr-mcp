description_portal: 한국광해광업공단은 광산개발 과정과 폐광 이후 2차 오염 등으로 발생하는 광해를 분석·예방하고 제거하는 광해방지 사업을 실시합니다. 폐석·광물찌꺼기 등 오염원을 차단하고 오염토양 복원, 수질개선, 지반침하 방지 등 광해복구로 자연환경을 깨끗하게 보전하는 동시에 지역주민의 삶의 질을 향상하는 것을 목표로 하고 있습니다.이와 관련, 전국 폐광산 실태조사 결과를 개방 및 공개합니다.또한, 본 데이터셋은 광해유형별로 분류되어 있어 각 광해에 따른 폐광산의 실태를 상세히 파악할 수 있습니다. 이를 통해 광해 특성에 맞는 맞춤형 광해방지 정책 수립에 활용될 수 있습니다.
