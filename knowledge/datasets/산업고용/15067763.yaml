summary_user: 전국 폐광산 실태조사 결과를 조사년도·광해유형·운영상태별 건수로 묶은 집계표로, 건별 광산 원장이 아니고 1,905바이트 크기의 작은 CSV 파일이다. 광해방지 정책 담당자나 분석가가 '어떤 광해 유형의 폐광산이 몇 건이며 운영상태는 어떤가'를 파악해 광해 유형별 대응 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 조사년도나 광해유형 이름을 맞춰 붙이거나, 같은 기관의 폐광산 관련 데이터와 이름 기준으로 이어 써야 한다.
