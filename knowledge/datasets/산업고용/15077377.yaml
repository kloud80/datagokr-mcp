summary_user: 장성군 안에서 토석채취 허가를 받은 사업장을 건별로 담은 파일로, 상호·사업자 주소·연락처·허가지 주소·용도·사업면적·허가 시작일과 종료일이 들어 있다(CSV 191바이트로 몇 건 안 되는 소규모 원장). 주민이나 인근 사업자가 '우리 동네 어느 필지에서 누가 언제까지 토석을 캘 수 있는가'를 확인하거나, 분석가가 허가 구역과 국토 공간 규제가 겹치는지 살피는 데 쓴다. 전역 조인 키나 코드는 없으므로 허가지 주소를 지오코딩해 필지·용도지역 자료와 맞추거나, 다른 시군의 토석채취 허가 현황과 이름으로 맞춰 이어 쓴다.
