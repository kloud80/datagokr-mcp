description_portal: '2006년 이후 서울시 사업체 현황을 조직형태별, 산업대분류별로 제공하는 지정ㆍ조사통계입니다. 서울시 전체 사업체수 및 여성대표자 현황, 성별 종사자수, 구별ㆍ조직형태별(개인, 회사법인, 회사이외의 법인, 비법인단체)ㆍ 산업대분류별(단독, 공장ㆍ지사, 본사ㆍ본점) 사업체수 및 종사자수 현황을 제공합니다.* 제10차 개정「한국표준산업분류」를 적용하였음* 조사기준시점(12.31)과 조사시점 사이에 폐업된 사업체는 그 장소에 입주한 사업체로 대체하였으며, 조사기준시점(12.31)과 조사시점(익년도 조사기간 중)사이에 폐업되어 조사되지 못한 사업체는 직전년도 실적으로 결측치를 대체하였음* ×: 사업체가 2개 이하인 경우 그 사업체의 비밀보호를 위해 그 수치대신 ×로 표시하였음'
