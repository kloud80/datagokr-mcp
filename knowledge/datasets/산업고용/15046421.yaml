description_portal: '○ 통계개요* 통계명 : 교육정도별 취업자* 통계종류 : 경제활동참가자 중 취업자 현황을 교육정도별로 제공하는 지정ㆍ표본통계* 작성목적 : 국민의 경제활동 즉 국민의 취업, 실업 등과 같은 경제적 특성을 조사하여거시 경제분석과 인력자원의 개발정책수립에 필요한 기초자료인 노동공급,고용구조, 가용노동시간 및 인력자원 활용정도를 제공하고 정부의 고용정책입안 및 평가에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사담당자 → 지방통계청(사무소) → 통계청* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울시 경제활동참가자 중 취업자의 교육정도별, 성별 현황○ 용어설명* 취업자 : ① 조사대상 주간 중 수입을 목적으로 1시간 이상 일한 자② 자기에게 직접적으로는 이득이나 수입이 오지 않더라도 자기가구에서경영하는 농장이나 사업체의 수입을 높이는 데 도운 가족종사자로서 주당18시간이상 일한 자(무급가족종사자)③ 직장 또는 사업체를 가지고 있으나 조사대상 주간 중 일시적인 병, 일기불순,휴가 또는 연가, 노동쟁의 등의 이유로 일하지 못한 일시휴직자'
