description_portal: 이 데이터는 세계 주요국 석유 매장량의 연간 통계 자료로, 국가별 석유 보유 자원의 규모를 수치로 나타냅니다. 석유 매장량은 해당 국가의 석유 공급 능력과 미래 자원 확보 가능성을 평가하는 핵심 지표로 활용되며, 이 자료를 통해 글로벌 석유 자원의 분포 현황을 파악할 수 있습니다. 특히 에너지 안보 전략 수립, 자원 외교, 석유 수급 정책 마련, 국제 유가 예측 등 다양한 정책 분석과 연구 목적으로 유용하게 사용됩니다. 데이터는 연도별, 국가별로 정리되어 있으며, 구조화된 형태로 제공되어 통계 분석, 시계열 비교, 시각화 등에도 적합합니다. 정부 부처, 에너지 기업, 연구기관 등 다양한 수요자가 활용할 수 있는 공공성과 활용성이 높은 자료입니다.
