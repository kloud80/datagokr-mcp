description_portal: '○ 통계개요* 통계명 : 노사분규 발생현황* 통계종류 : 서울시 노사분규 성격에 따른 발생건수를 제공하는 일반ㆍ보고통계* 근거법령 :「노동조합 및 노동관계 조정법」에 의한 노동쟁의조정 및 노사분규발생 현황* 작성목적 : 개별기업과 국민경제에 영향을 미치는 노사분규 발생현황을 조사하여 노사분규에 대한 체계적이고 정확한 분석을 통해 노사분규의 사전예방과 사회통합적노사관계 구축에 기여하기 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 지방노동관서 → 고용노동부 노사관계지원과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 노사분규(쟁의 발생신고, 쟁의 행위신고, 분규발생, 직장폐쇄신고) 발생건수 현황○ 용어설명* 노동쟁의 : 노동관계 당사자(노동조합과 사용자 또는 사용자 단체)간에 임금·근로시간·복지·해고·기타 대우 등 근로조건의 결정에 관한 주장의 불일치로 인하여 발생한 분쟁상태를 말함* 노동쟁의 조정 : 노동관계 당사자간에 근로조건의 결정에 관한 주장의 불일치로 노동쟁의가발생한 경우 당해 노동쟁의를 신속·공정하게 해결하여 쟁의행위로 인한 노동관계 당사자의손실을 방지하고 국민경제의 안정과 발전에 기여하기 위해 노조법 및 노동위원회법에 의해행해지는 일련의 절차를 말함* 노사분규 발생 : 노동조합과 사용자(사용자단체)간 근로조건의 결정에 관한 의견의불일치로 인해 노조측이 작업 거부 등에 돌입함으로써 1일 근로시간(8시간) 이상 작업이중단된 경우 노사분규 발생사업장으로 봄○ 기 타○ 출 처 : 고용노동부 노사관계지원과'
