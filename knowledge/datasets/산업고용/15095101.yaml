summary_user: 근로복지공단이 산재 신청·승인 현황을 사업장 규모(상시근로자수 구간)별·연도별로 집계한 전국 단위 통계 파일로, 신청 건수·승인 건수·승인율(퍼센트)을 담는다(CSV 약 2KB의 소규모 집계표). 정책 분석가나 연구자가 '5인 미만·30인 미만 영세 사업장의 산재 신청 건수와 승인율이 대규모 사업장과 비교해 어떻게 다르고 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 산재·고용 통계와는 연도와 사업장 규모 구간 이름을 맞춰 붙여 쓴다.
description_portal: '이 데이터는 산업재해 신청 및 승인 현황을 사업장 규모별(상시근로자수 기준)로 집계한 통계 자료입니다. 통계 항목은 사업장 규모별(예: 5인 미만, 5~30인 미만, 1000인 이상 등) 신청 건수, 승인 건수, 그리고 승인율(퍼센트)을 연도별로 제공합니다. 이 자료는 국내 산업재해 발생의 주요 특징 중 하나인 규모별 재해 취약성을 명확하게 보여줍니다. 특히 영세 사업장일수록 상대적으로 산재 발생 빈도가 높거나, 행정 처리 과정에서의 특이점을 파악하는 데 필수적인 근거 자료라고 판단됩니다.본 데이터는 산업 안전 정책의 우선순위를 설정하고 영세 사업장 근로자 보호 방안을 마련하는 데 매우 중요한 자료입니다. 이 자료를 활용하여 5인 미만 또는 30인 미만 사업장의 승인율 및 신청 건수 추이를 분석함으로써, 소규모 사업장의 안전 관리 실태와 산재보험 적용의 사각지대를 진단할 수 있습니다. 이를 통해 영세 사업장을 대상으로 한 맞춤형 안전 지원 사업이나 재해 예방 교육을 집중적으로 시행하는 방안을 수립할 수 있습니다. 또한, 이 통계는 기업 규모에 따른 산재보험 제도의 형평성과 포괄성을 평가하는 데 기여할 수 있다고 판단됩니다.'
