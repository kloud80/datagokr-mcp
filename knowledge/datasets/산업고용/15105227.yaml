description_portal: 본 자료는 사업주 또는 근로자에게 지급된 고용안정지원금 중 고용장려금 지급 현황을 연도별로 정리하여 제공합니다. 지원 인원 통계는 중복 지원을 제외한 순 지원 인원 기준으로 작성되었으며, 기업 규모별, 시도 및 시군구별, 산업 분류 기준(한국표준산업분류)에 따라 세분화되어 있습니다. 이를 통해 정책 대상별 지원 성과를 정량적으로 확인할 수 있으며, 특정 지역 또는 산업군에 대한 지원 편중 여부 및 정책 효과를 파악하는 데 활용됩니다. 자료는 일자리지원사업의 성과 분석, 고용안정지원금의 실질적 효과 검증, 향후 고용 정책 수립의 기초 자료로 쓰일 수 있습니다.
