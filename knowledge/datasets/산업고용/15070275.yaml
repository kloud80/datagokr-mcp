summary_user: 한국수력원자력 사업소별 방사성동위원소 저장시설에 누가(출입자구분) 언제, 어느 장소에, 무슨 목적으로 출입했는지를 건별로 기록한 출입 원천 데이터로, 약 451KB 분량의 CSV 파일이며 범위는 전국 단위의 비공간 자료다. 원전 사업소별 저장시설 출입 빈도와 목적(점검·반입 등)이 어떻게 분포하는지 살펴보려는 분석가나 시민이 시설 출입 통제 현황을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 방사성폐기물·원전 데이터와는 사업소 이름을 맞추는 방식으로만 이어 쓴다.
