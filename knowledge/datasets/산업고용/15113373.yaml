description_portal: '경상남도 거창군 주유소의 데이터로 경상남도 거창군 주유소의  업소명, 경상남도 거창군 주유소의  소재지도로명주소, 경상남도 거창군 주유소의  소재지지번주소, 경상남도 거창군 주유소의  상표, 경상남도 거창군 주유소의  전화번호, 경상남도 거창군 주유소의  위도, 경상남도 거창군 주유소의  경도 등의 항목을 제공합니다.○ 주유소(注油所, 문화어: 연유공급소, 영어: filling station, gas station, petrol station)는 휘발유나 경유 등의 각종 자동차 엔진용 연료를 판매하는 장소이다. LPG(액화석유가스)를 연료로 이용하는 자동차를 위해서 LPG를 충전하는 곳은 LPG 충전소라고 하며, 보통 주유소와는 별도로 둔다. 전기자동차에 전기를 충전하는 전기차 충전소도 있다.'
