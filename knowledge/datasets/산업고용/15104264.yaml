description_portal: 한국광해광업공단의 "수급안정화지수_리튬" 데이터셋은 4차 산업의 핵심 원료광물인 리튬의 국내 수급 리스크를 평가하는 표준척도로, 수급위기(01 및 위기 발생), 수급불안(05), 수급주의(520), 수급안정(2080), 공급과잉(80~100) 등 5단계 지수를 제공합니다. 이 지수는 광종별 중장기 가격 리스크, 세계 수급 비율(공급/소비), 세계 공급(매장) 편중도, 국내 수입 증가율, 국내 수입국 편중도 등을 종합적으로 반영하여 산출됩니다. 이를 통해 리튬의 수급 안정성을 평가하고, 정책 수립 및 산업계 대응 전략 수립에 활용할 수 있습니다. 데이터는 공공데이터포털에서 무료로 제공되며, 다양한 분석 도구를 활용하여 심층적인 분석이 가능합니다.
