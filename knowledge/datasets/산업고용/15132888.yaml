description_portal: 본 데이터는 한국중부발전이 사용하는 BC유의 월별 재고 및 사용 현황을 정리한 자료입니다. 항목은 기간, 월초 재고량, 1호기 사용량, 2호기 사용량, 사용 합계, 입고량, 월말 재고량으로 구성되어 있으며, 모든 수치는 킬로리터(kL) 단위로 표시됩니다. BC유는 고점도·고탄소 성분의 중유로, 가격이 저렴해 대형 산업시설에서 주로 연료로 사용됩니다. 이 데이터는 보일러 가동에 따른 연료 수급 계획 수립, 재고 소진 및 입고량 비교 분석, 월별 연료 효율성 점검 등에 활용 가능합니다. 또한 발전 설비 운용에 따른 중유 소비 추이 모니터링, 연료비 예측, 에너지 운영 효율화 자료로도 활용 가능합니다.
