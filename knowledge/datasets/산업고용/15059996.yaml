summary_user: 서울에너지공사가 지역난방 열원 설비에서 실제로 생산한 열에너지 실적을 월·지역·지사·설비 단위로 담은 API로, 생산량은 Gcal 단위의 집계값이다. 지역난방 운영이나 에너지 정책을 분석하는 사람이 '겨울철 어느 지사·설비의 열 생산이 얼마나 늘었는가' 같은 계절별·지역별 생산 격차와 설비 가동 수준을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 지역명·지사명·설비명이나 공사 자체 코드(지역·지사·설비 유형 코드)로 같은 기관의 열 공급·판매량 데이터와 이름 매핑해 잇는다.
description_portal: 서울에너지공사의 월별, 지역별, 지사별, 설비별 열 생산량 정보를 제공하는 공공데이터이다. 본 자료는 지역난방을 위한 열원 설비에서 생산된 열에너지의 실적을 기반으로 하며, 주요 항목은 생산월, 지역명, 지사명, 설비명, 생산량(Gcal) 등으로 구성된다. 열생산량은 각 설비에서 실제로 생산된 열에너지의 양을 의미하며, 에너지 공급 안정성 확보와 설비 운영 효율성 분석에 활용된다. 본 데이터는 지역 간 생산 격차, 계절적 수요 변화, 설비 가동 수준 등을 평가하는 데 유용하며, 에너지 정책 수립, 열공급 계획 마련, 친환경 설비 도입 검토 등의 기초자료로 제공될 수 있다. 또한 공공기관의 지역난방 운영 전략 수립과 온실가스 감축 대응 측면에서도 활용도가 높다.
