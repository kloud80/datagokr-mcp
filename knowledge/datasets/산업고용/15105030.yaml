summary_user: '산재보험 행정 처분(예: 불승인)에 불복해 제기된 심사 청구를 연도별로 집계한 전국 단위 통계로, 해당 연도의 결정 건수와 원처분이 취소된 건수를 담는다(파일 크기 150바이트의 소규모 CSV). 정책 담당자나 노동 분야 분석가가 "해마다 산재 심사 청구에서 원처분이 취소되는 비율이 어떻게 변했는가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키는 없어, 연도(구분) 값을 기준으로 산재 판례·질병판정 등 같은 기관 통계와 맞춰 보는 방식으로만 연결한다.'
description_portal: '이 데이터는 산업재해보상보험 관련 행정 처분에 불복하여 제기된 심사 청구의 결정 및 취소 현황을 연도별로 집계한 통계 자료입니다. 통계 항목은 해당 연도의 결정 건수(심사 결과가 나온 전체 건수)와 심사 청구를 통해 원처분이 취소된 건수를 제공합니다. 이 심사 청구는 산재보험 행정 처분(예: 불승인 처분)에 대한 근로자의 1차 불복 절차로서, 이 자료는 산재보험 행정의 적정성 및 재심사 제도의 운영 실태를 평가하는 데 필수적인 근거 자료라고 판단됩니다.본 데이터는 산재보험 행정의 투명성과 근로자 권익 보호 수준을 분석하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 연도별 심사 청구 결정 건수와 취소 건수의 변화 추이를 분석함으로써, 특정 시기에 심사 청구가 증가하거나 취소율이 높아지는 원인을 심층적으로 진단할 수 있습니다. 이를 통해 산재보험의 최초 처분 단계에서 발생하는 오류를 사전에 식별하고, 심사 청구 제도 운영의 효율성과 공정성을 강화하는 방안을 모색할 수 있습니다. 또한, 이 통계는 근로자의 재해 보상 권익 구제 시스템의 효과를 평가하고, 행정 처분의 신뢰도를 높이는 데 기여할 수 있다고 판단됩니다.'
