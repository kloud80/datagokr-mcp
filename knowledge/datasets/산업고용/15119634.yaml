summary_user: 한국남동발전이 도입한 발전 연료(유연탄, 무연탄, 유류, LNG, 고형연료, 우드펠릿 등)의 실적을 연월 × 연료 × 도입국가 단위로 묶어 연료량과 기본단위를 담은 집계 데이터이며, 지역 구분이 없는 전국·비공간 자료다. 연구기관이나 분석가가 '남동발전의 유연탄 도입이 특정 국가에 얼마나 몰려 있고, LNG·우드펠릿 비중은 어떻게 변해 왔나' 같은 공급망 의존도·연료 전환 추세 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 연월(ym)과 도입국가명·연료명 같은 이름 매핑으로 이어 붙여야 한다.
limits: 전역 조인 키가 없어 수입 통계나 국제 가격 데이터와 결합하려면 국가명·연료명을 직접 매핑해야 한다. 지역 단위가 없는 전국 자료여서 발전소별·지역별 연료 사용을 나눠 보는 데는 쓸 수 없다.
