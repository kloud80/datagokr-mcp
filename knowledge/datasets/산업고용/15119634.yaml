description_portal: '이 데이터는 한국남동발전에서 제공하는 연료 도입 실적 현황입니다. 연월별 연료 도입 실적에 관한 데이터를 제공하고 있습니다. 유연탄, 무연탄, 유류, LNG, 고형연료, 우드펠릿 등에 대한 도입국가, 도입물량 데이터를 포함하고 있습니다. 해당 데이터는 연구기관에서 국제 원자재 가격 변동이 국내 경제에 미치는 영향을 분석하며, 에너지 전환 정책의 이행 과정을 모니터링하는 데 중요한 기초자료로 활용할 수 있습니다. (예시: 특정 국가에 대한 연료 수입 의존도를 파악하여 공급망 리스크를 관리하고, 유연탄 도입량 감소와 LNG 및 신재생 연료 도입량 증가 추세를 통해 탄소중립 정책의 실질적인 성과를 측정)'
