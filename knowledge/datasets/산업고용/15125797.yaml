description_portal: 한국전력공사와 전력공급계약을 체결한 종합병원(86101), 일반병원(86102),노인요양복지시설(87111)의 계약 현황을 월별로 집계한 데이터입니다.2022년 1월부터 2023년 11월까지의 데이터를 포함하고 있으며, 년월, 시도, 산업분류, 고객호수, 계약전력합계 항목으로 구성되어 있습니다.(5호 미만의 소규모 데이터는 개인정보보호를 위하여 비식별화 처리되었음을 참고부탁드립니다.)해당데이터를 통하여 시도별 의료 및 복지 시설의 규모와 에너지 수요를 파악하여 지역별 전력 인프라 현황을 분석할 수 있습니다.특정 지역의 계약전력합계를 계산해 지역사회 복지시설의 에너지 사용량 증가 추이를 예측하고 에너지 효율 개선이 필요한 시설을 파악하는데 활용할 수 있습니다.또한 한전 ON홈페이지에서 전기요금 계산서비스를 이용하여 예상 전기요금을 산출해보는 등 효율적인 에너지 관리 계획을 수립할 수 있습니다.
