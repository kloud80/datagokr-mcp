summary_user: 한국전력공사가 판매한 전기차 충전전력을 월별로 묶어 충전요금 구분(자가용·사업자용)과 선택요금의 조합별로 경부하·중부하·최대부하 시간대의 판매량과 사용량단가, 전체 판매량을 담은 전국 단위 집계 파일이다. 에너지 분석가나 충전사업자가 '자가용과 사업자용 충전 전력이 어느 시간대에 얼마나 팔리고 시간대별 단가는 어떻게 다른가'를 월별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 충전소 실시간·위치 데이터와는 바로 결합되지 않고, 월(구분)과 요금 구분 이름을 맞춰 다른 한전 전력 판매·사용량 통계와 나란히 놓고 쓴다.
description_portal: 한국전력공사의 전기차 충전 전력에 대한 월별. 계시별(경부하, 중부하, 최대부하), 사용량과 판매단가를 보여주는 데이터입니다.구분, 충전요금(자가용/사업자용), 선택요금(대상아님, 선택요금1~4), 판매량, 사용량단가. 판매단가 항목으로 구성되어 있으며, 충전요금과 선택요금의 조합으로 월별 총 10가지의 계시별 데이터가 제공됩니다.해당 데이터를 사용하여 전기차 충전시장의 월별 전력 소비 패턴과 요금제에 따른 판매 현황을 상세하게 파악하는데 유용합니다.자가용과 사업자용 충전패턴과 선택요금별 사용량을 비교하여 요금제에 따른 사용자별 행동 특성을 연구하는데 도움을 줄 수 있습니다.
