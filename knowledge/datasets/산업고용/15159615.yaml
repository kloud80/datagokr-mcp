summary_user: 산업재해보상보험 업무상 사고 신청 중 승인된 사례를 한 건당 한 행으로 담은 전국 단위 파일로, 재해일자·결재일자, 직종, 재해발생형태, 업종, 사업장규모, 성별, 재해 당시 연령대를 포함한다. 정책 분석가나 산재 예방 담당자가 '어떤 직종·연령대·사업장 규모에서 어떤 형태의 사고가 많이 승인되는가'를 따져 취약 집단을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 직종코드·직종명이나 업종명을 이름·코드 매핑으로 맞춰 직업분류 사전 등과 이어야 한다.
description_portal: 이 데이터는 산업재해보상보험 업무상 사고 신청 건 중 승인된 사례에 대한 상세한 정보를 담고 있는 핵심 통계 자료입니다. 각 레코드는 하나의 승인된 산재 건을 나타내며, 재해일자부터 직종코드, 직종명, 업종명, 사업장규모, 성별, 재해당시 연령대 등 다각적인 정보를 포함합니다. 특히, 연령대는 연령별 취약도를 분석하는 데 유용합니다. 이 자료는 국내 산업재해의 발생 양상을 심층적으로 파악하고, 재해 근로자의 특성과 부상/질병 유형 간의 상관관계를 규명하는 데 필수적인 근거 자료입니다.본 데이터는 산재 예방 정책 및 의료 서비스 개선에 실질적으로 기여할 수 있습니다. 정책 입안자는 특정 직종이나 연령대, 또는 특정 지역 및 사업장 규모에서 빈번하게 발생하는 재해 유형을 분석하여, 가장 취약한 그룹에 대한 맞춤형 예방 대책과 집중 관리 방안을 수립할 수 있습니다. 또한, 보건 및 재활 전문가는 이 자료를 활용하여 지역별/업종별 상병 발생 패턴에 맞는 전문 재활 프로그램이나 의료 서비스 제공 체계를 구축하는 데 기여할 수 있습니다.
