summary_user: 중소벤처기업부 중소기업 기술개발사업에 지원한 과제를 과제 1건당 1행으로 담은 전국 단위 파일(CSV 약 48만 바이트)로, 과제명·사업명·공고명·사업년도·주관기관·관리기관·전문기관·산업기술분류(기계/소재, 정보통신, 바이오/의료 등 7개 주요분야)를 포함한다. 분석가나 사업자가 '특정 연도에 어떤 기술분야·사업에서 어떤 기관이 과제를 수행했나'처럼 분야별·연도별 지원 과제 분포를 살피는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 기업·인증 데이터와는 주관기관명이나 산업기술분류 이름을 맞춰 연결해야 한다.
limits: 사업자번호 등 공통 키가 없어 기업 단위로 정확히 연결하기 어렵고, 기관명 매칭에 의존한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓸 수 없다.
