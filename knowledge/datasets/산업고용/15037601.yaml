summary_user: 글로벌 액셀러레이팅 지원사업에 참여하는 해외 액셀러레이터·스타트업 보육기관 목록을 기관 한 곳당 한 행으로 담은 소규모 CSV 파일(약 2KB)로, 기관명·국가·보육 분야(AI, 핀테크, 바이오 등)·홈페이지·주소가 들어 있다. 해외 진출을 준비하는 스타트업이나 유관기관이 "특정 국가에서 디지털 헬스케어를 보육하는 기관은 어디인가"처럼 협력·접촉 대상을 고를 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 기관명·국가명을 이름으로 맞춰야만 이어 쓸 수 있다.
description_portal: 해당 데이터는 해외 주요 액셀러레이터 및 스타트업 보육기관에 대한 정보로 구성되어 있습니다. 각 항목은 기관명, 국가, 보육 분야, 홈페이지, 주소 등으로 구분되어 있으며, 보육 분야에는 AI, 디지털 헬스케어, 스마트시티, 핀테크, 모빌리티, 에듀테크, 바이오테크 등 다양한 분야가 포함되어 있습니다. 이를 통해 해외 진출을 모색하는 스타트업이나 유관기관에서 국가별 보육기관의 전문 분야를 파악하고, 협력 가능성 및 네트워킹 기반을 마련하는 데 활용될 수 있도록 구성되어 있습니다. 각 기관의 공식 홈페이지와 주소 정보도 포함되어 있어, 실질적인 접촉 및 교류 기반을 제공하고 있습니다.
