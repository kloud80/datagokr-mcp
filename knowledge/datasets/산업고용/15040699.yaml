summary_user: 국내에서 제품 안전성을 심사하고 인증을 부여하는 공식 지정 인증기관의 기본 현황을 기관 한 곳당 한 행(기관아이디·기관명·홈페이지)으로 담은 전국 단위 목록 파일이며, 파일 크기는 596바이트로 작다. 사업자가 자기 제품의 안전인증을 어느 기관에 신청할 수 있는지, 그 기관의 홈페이지가 어디인지 확인할 때 쓴다. 전역 조인 키가 없어 제품 안전인증·리콜 정보 같은 다른 데이터와는 인증기관 이름을 맞추거나 같은 기관 체계의 기관 코드로만 이어 쓴다.
