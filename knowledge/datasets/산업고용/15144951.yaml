summary_user: 한국산업기술진흥원 사업관리시스템에 입력된 연구개발 과제별 성과 기록으로, 성과발생년도·접수번호별로 논문·특허 성과의 발생 여부와 특허 등록기탁번호를 담은 건별 원천 파일(CSV 약 63만 바이트, 전국 범위)이다. 분석가가 '진흥원 지원 과제 중 특허나 논문 성과가 난 비율이 연도별로 어떻게 변했나'를 따질 때 쓴다. 접수번호(kiat_perf_rcpt_no)로 진흥원의 과제·접수 정보와, 국가과학기술지식정보서비스 순번(ntis_sn)으로 NTIS 성과 정보와 이어 쓴다.
description_portal: '이 파일은 한국산업기술진흥원의 사업관리시스템에서 관리하는 성과 정보 자료로써, 연구개발 성과의 발생 여부를 입력한 정보 입니다. 주요 항목에는 성과가 발생한 연도(성과발생년도(int)(예: 2018)), 기술 접수번호(접수번호(str)(예: "18")), 입력 시점 구분(시점구분(str)(예: "성과입력")), 논문 성과 발생 여부(발생여부_논문(str)(예: "발생", "미발생")), 특허 성과 발생 여부(발생여부_특허(str)(예: "발생", "미발생")), 특허 관련 등록기탁번호(등록기탁번호(특허)(str)(예: "10-2017-0148109")), NTIS 성과 고유 식별번호(국가과학기술지식정보서비스 순번(int)(예: 2617)), 자료 등록 또는 수정일(등록일자 및 수정일자(date)(예: "2019-01-22")), 데이터 기준일자(데이터 기준일자(date)(예: "2025-07-16")) 등이 포함되어 있습니다. 이 데이터는 특허 및 논문 중심의 연구성과 관리, 기술기탁 이력 추적, 성과 발생률 통계 산출 등에 활용될 수 있습니다.'
