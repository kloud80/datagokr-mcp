summary_user: 경기도 내 빨래방(무인·셀프 세탁)업 사업장을 한 곳씩 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·세탁기 수·회수건조 수와 지번·도로명 주소, WGS84 좌표를 담는다. 예비 창업자나 상권 분석가가 '우리 시군에 영업 중인 빨래방이 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 소상공인 상가업소 정보 등 다른 상권·인허가(LOCALDATA) 데이터와 맞춰 잇는다.
description_portal: 이 데이터는 2025년 3월 12일 기준으로 경기도 내에서 운영 중인 빨래방업 관련 사업장의 인허가 현황을 수록한 자료입니다. 빨래방업은 고객이 직접 자동세탁기를 이용해 동전이나 카드로 세탁 및 건조 작업을 수행하는 업종으로, 일반 세탁업과는 달리 무인·셀프 방식의 운영 형태가 특징입니다. 데이터에는 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 세탁기수(WHM_CNT), 회수건조수(RETRVL_DRY_CNT), 위생업종명(SANITTN_INDUTYPE_NM), 위생업태명(SANITTN_BIZCOND_NM) 외에도 소재지 정보 및 WGS84 좌표 등이 포함되어 있으며, 다중이용업소 여부와 건물소유구분 등의 항목도 제공됩니다.해당 데이터는 주간 단위로 갱신되며, 경기도 31개 시군 전체의 인허가 데이터를 포함하여 지역별 빨래방 시설 분포 현황을 파악할 수 있습니다. 이를 통해 창업 입지분석, 무인세탁업 시장 규모 예측, 공공위생관리 정책 수립 등 다양한 분야에서 활용이 가능합니다. 특히 자동화된 무인 세탁 서비스는 1인 가구 증가 및 편의성 수요 증가에 따라 확산 중이며, 본 데이터는 해당 산업의 확산 경로 및 지역 편중 여부를 분석하는 데 유용한 근거 자료가 됩니다. 행정기관은 이를 통해 위생 점검 대상을 체계적으로 관리하고, 민간에서는 상권분석 및 시설운영 효율화 전략 수립에 기초자료로 활용할 수 있습니다. 본 데이터는 Open API 형식으로 제공되어 상시 접근이 가능하며, 실시간 데이터 연계를 통해 실효성 있는 정책 및 사업기획이 가능합니다.
