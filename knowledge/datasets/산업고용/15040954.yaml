description_portal: 이 데이터는 한국남부발전의 RPS(신재생에너지 공급의무화제도) 고정가격계약 현황을 정리한 자료입니다. 연도별 총 계약 건수와 총 계약 용량(kW)을 포함하고 있어, 신재생에너지 확대를 위한 고정가격계약의 추진 추세를 한눈에 파악할 수 있습니다. RPS 제도는 발전사업자가 일정 비율 이상의 신재생에너지를 공급하도록 의무화하는 제도로, 해당 자료를 통해 태양광 등 재생에너지 발전사업과의 계약 확대 현황을 확인할 수 있습니다. 본 데이터는 신재생에너지 보급 정책 성과를 평가하고, 향후 에너지 전환 및 탄소중립 목표 달성을 위한 전략 수립에 유용한 기초 자료로 활용될 수 있습니다.
