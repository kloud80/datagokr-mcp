summary_user: 국토안전관리원이 등록한 안전진단전문기관을 업체별 1행으로 담은 파일 데이터로, 전국 1,549건에 업체명·대표자·등록일자·등록분야·소재지·전화번호와 연도별 매출액(2021~2025, 천원 단위)이 있다. 시설물 안전점검·정밀안전진단을 맡길 업체를 지역별·등록분야별로 찾거나 업체 규모를 비교하려는 발주자와 분석가가 쓴다. 이어 쓸 키는 소재지(address)뿐이라 주소 기준으로 다른 지역·업종 데이터와 맞춰야 하며, 사업자번호 같은 별도 키는 필드에 없다.
description_portal: 국토안전관리원에서 제공하는 데이터이며 시설물의 안전관리에 관한 특별법에서 규정한 광역시/도의 안전진단전문기관에 대한 정보를 제공합니다.2025년 3월 31일 기준 데이터임을 알려드립니다.안전진단전문기관은  교량·터널·항만 등 건설공사를 통해 만들어진 시설물의 구조적 안전성과 기능적 위험요인을 조사하고 평가하여 보수·보강 등의 대책을 제시하는 업무를 대행하는 외부 전문기관 입니다.업무내용은 시설물의 안전점검 및 정밀안전진단을 수행하여 물리적, 기능적 위험요인과 결함을 발견하고, 그 원인을 파악하여 신속하고 적절한 보수·보강 방법을 제시합니다.매출액 단위는 천원입니다.
