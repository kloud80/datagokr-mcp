summary_user: 경상남도에서 허가한 3,000kW 미만 태양광 발전사업을 사업 한 건당 한 행으로 담은 CSV 파일로, 상호·에너지원·허가용량·설치장소와 진행 상태(인허가·공사진행·사업개시)를 기록한다. 지역 주민이나 태양광 사업자, 에너지 분석가가 '우리 시군에서 허가받은 소규모 태양광 중 실제로 발전을 시작한 곳은 얼마나 되나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치장소 주소나 상호를 이름으로 맞춰 이어야 하며, 전국태양광발전소전기사업허가정보표준데이터와 대조하는 용도로 쓴다.
limits: 표준 행정코드나 발전소 고유번호 같은 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 경상남도 한 시도만 다루고 3,000kW 이상 사업은 포함하지 않는다.
