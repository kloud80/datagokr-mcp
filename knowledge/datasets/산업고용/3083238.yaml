summary_user: 경상남도 내 자동차대여업체(렌터카 업체)를 업체 한 곳당 한 행으로 담은 현황 파일로, 소재 시군·업체명·전화번호·주소를 담는다(CSV 약 13.6KB). 경남에서 렌터카 업체를 찾는 국민이나 시군별 대여업체 분포를 파악하려는 분석가가 '우리 시군에는 어떤 렌터카 업체가 있고 연락처는 무엇인가' 같은 질문에 쓴다. 사업자번호나 행정코드 같은 전역 조인 키가 없어서, 다른 데이터와는 시군명·업체명·주소를 문자열로 맞춰 이어 써야 한다.
limits: 조인 키가 없어 LOCALDATA 인허가 원장 등과 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 포털 설명에 따르면 전화번호는 기관이 보유한 업체만 기입되어 빈 값이 있을 수 있다. 범위는 경상남도에 한정된다.
