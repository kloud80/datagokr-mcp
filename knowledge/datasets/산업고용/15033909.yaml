summary_user: 광양시 안의 태양광 발전설비를 설치 장소별로 한 줄씩 적고 발전용량(kW)과 데이터기준일을 붙인 원장성 목록이며, 파일 크기가 444바이트로 수록 건수는 적다. 광양시에 태양광 설비가 어디에 얼마 규모로 있는지 보려는 시민이나 지역 신재생에너지 현황을 정리하는 분석가가 쓴다. 공통 조인 키나 코드표가 없어 다른 데이터와는 설치장소 이름을 직접 맞춰 붙여야 하고, 전국 단위 비교는 발전소별 주소·용량을 담은 전국태양광발전소전기사업허가정보표준데이터와 함께 쓴다.
