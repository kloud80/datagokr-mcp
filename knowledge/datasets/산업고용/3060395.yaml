summary_user: 전국 전통시장이 받은 정부 지원사업 내역을 시장·사업 건별로 담은 파일 데이터로, 사업명·지원연도·지원기간·광역/기초 소재지·시장명·지원금액(백만원)·상인회명과 연락처를 담는다. 지역별로 어느 전통시장이 어떤 지원사업(디지털 전통시장, 문화관광형시장 등)을 얼마나 받았는지 비교하거나, 특정 시장의 지원 이력과 운영 상인회를 확인하려는 분석가·지자체 담당자·상인이 쓴다. 전역 조인 키가 없어 다른 전통시장·상권 데이터와는 시장명과 광역·기초 지역명을 이름으로 맞춰 연결해야 한다.
limits: 표준 코드(시장 코드·행정구역 코드) 같은 조인 키가 없어 다른 데이터와 붙이려면 시장명·지역명 매칭이 필요하고, 좌표가 없어 지도 분석에는 바로 쓰지 못한다. 지원 실적만 담고 있어 지원 효과나 시장 매출 같은 성과는 이 파일만으로 알 수 없다.
