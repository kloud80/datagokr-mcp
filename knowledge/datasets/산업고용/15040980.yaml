description_portal: 본 데이터는 한국가스공사 생산기지에서 송출하는 천연가스의 열량 및 압력 정보를 제공합니다. 천연가스 품질관리 및 공급 안정성 확보, 도시가스사 공급 품질 관리, 요금 산정을 목적으로 수집되었습니다. 데이터 구성항목은 평택, 인천, 통영, 삼척, 제주 등 각 생산기지별 송출가스의 열량과 압력 데이터로 이루어져 있으며, 제주기지는 2019년 11월부터 데이터가 존재합니다. 본 데이터를 활용하면 기지별 송출가스 품질 모니터링, 열량 변동 추이 분석, 압력 안정성 평가, 기지간 열량 편차 분석이 가능합니다. 또한 계절별 열량 변화 패턴 파악, 품질 이상 조기 감지, 공급 안정성 지표 산정, 열량 품질 기준 충족 여부 평가에 활용됩니다. 기상데이터와 연계한 수요예측 모델 개발, 도시가스사 공급 품질 관리, 요금 산정 기초자료, 품질관리 기준 수립 등으로 활용됩니다.
