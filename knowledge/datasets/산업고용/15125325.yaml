summary_user: 한국남부발전 발전소(빛드림본부)의 호기별 월간 연료 소비량을 석탄(유연탄)·LNG·중유(B.C)·등경유·우드펠릿 연료별로 담은 실적 데이터이며, 년월과 발전소를 지정해 조회한다. 에너지 분석가나 연구자가 '특정 발전소의 석탄·LNG 소비가 월별로 어떻게 변했는가'를 확인하거나 발전원별 연료 사용 추이를 볼 때 쓴다. 전역 조인 키가 없어 같은 기관의 발전실적 데이터와 발전소명(orgNm)·호기명·년월을 이름으로 맞춰 연료 대비 발전량을 계산하는 식으로 이어 쓴다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 연료소비실적 정보_GW 서비스입니다.해당 API를 통해 사용자는 조회를 희망하는 해당 년/월의 발전소(빛드림본부)를 선택하여 월별 연료 소비량을 확인할 수 있습니다.해당 내용을 바탕으로 한국남부발전(주)의 각 발전소별 월별 연료 소비 추이 분석 등을 수행할 수 있습니다.또한, 발전실적 등과 결합하여 연료대비 발전량 분석 등 다양한 분석의 기초자료로 활용 가능합니다.
