description_portal: 본 자료는 한국고용정보원이 워크넷을 통해 제공하는 국민취업지원제도 관련 참여현황을 월 단위로 수집·정리한 통계입니다. 해당 제도는 저소득 구직자, 청년, 경력단절 여성 등을 대상으로 맞춤형 취업지원 서비스를 제공하는 제도로, 본 자료에서는 실제 제도에 참여한 인원 현황을 중심으로 정보를 제공합니다. 분석 항목은 시도 및 시군구 단위의 지역 구분, 성별, 연령대에 따라 세분화되어 있어 참여자 분포를 다각도로 파악할 수 있으며, 지역별·인구집단별 수요 특성이나 정책 도달 효과 등을 확인할 수 있는 근거자료로 활용됩니다. 특히 월 단위 시계열 구성으로 인해 시점별 변화 추이를 비교하거나 정책 시행 전후의 참여 패턴 분석에도 적합합니다. 본 통계는 고용서비스 정책 효과 측정, 지역 일자리 지원 전략 수립, 취약계층별 맞춤 지원 방안 마련 등 실무적 활용도가 높은 기초자료입니다.
