description_portal: '부산광역시 서구에 위치한 다양한 개인서비스업소 중 착한가격업소에 대한 자세한 정보를 제공합니다.착한가격업소는 지역 주민과 방문객 모두에게 합리적인 가격으로 양질의 서비스를 제공하기 위해 선정된 업소들로서,이들 업소의 업종, 업소명, 도로명주소, 판매 품목, 가격, 영업시간, 배달 유무, 주차장 유무 등 세부 정보가 포함되어 있습니다.해당 정보는 고객이 합리적 소비를 할 수 있도록 도움을 주며 지역 경제 활성화에도 기여합니다.* 현황: 착한가격업소 74개소(2026.6.11.기준)자세한 사항은 홈페이지를 참고하시기 바랍니다.  https://www.goodprice.go.kr/'
