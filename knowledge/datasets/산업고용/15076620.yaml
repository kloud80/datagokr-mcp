summary_user: 전라남도 해남군에 등록된 유료직업소개소를 한 곳당 한 행으로 담은 목록으로, 소개소명·도로명/지번 주소·등록일자·허가 여부가 들어 있다(시군구 범위, 개별 사업장 주소 단위). 구직자나 구인 사업주가 해남군 안에서 허가받은 유료직업소개소가 어느 읍면에 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 소개소명으로 맞춰 이어 쓴다.
description_portal: 전라남도 해남군 유료직업소개소 데이터입니다.이 데이터에는 연번, 직업소개소 명, 사업소 주소, 등록일자, 허가여부 총 5가지 정보로 구성되었습니다.해남군에는 69개의 직업소개소가 있으며 14개의 읍면 중 10개의 읍면에 위치해 있습니다.해남읍이 37개소로 가장 많으며 그 다음으로 황산면 11개소,  산이면, 문내면, 화원면은 각각 4개소, 송지면은 3개소, 화산면, 북일면은 각각 2개소, 마지막으로 북평면과 옥천면은 각각 1개소가 있습니다. 해당 데이터는 2025년 8월 기준 데이터이며 변동될 수 있습니다.
