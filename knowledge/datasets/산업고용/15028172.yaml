summary_user: 대전광역시 대덕구 관내에 등록된 민간 직업소개소를 한 곳당 한 행으로 담은 파일(약 6.5KB CSV)로, 유료·무료 구분, 법인명, 사업소명, 인허가번호, 운영상태, 주소, 등록일자를 싣는다. 구직자나 구인 사업자가 대덕구에서 지금 영업 중인 무료 직업소개소가 어디에 있는지 찾을 때, 분석가가 등록일자로 지역 소개소 설립 추이를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 시군구의 직업소개소 현황이나 고용 서비스 기관 데이터와는 사업소 주소나 법인명·인허가번호를 기준으로 이름 매칭해 이어 쓴다.
limits: 대덕구 한 개 시군구만 담으므로 대전시 전체나 다른 지역과 비교하려면 별도 파일을 모아야 한다. 공통 코드 키가 없어 다른 데이터와는 주소·이름 매칭으로만 연결된다.
