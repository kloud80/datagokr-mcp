description_portal: '- 노동시장의 변화와 근로자 권익보호에 대한 사회적 관심 증대, 노사관계 개선을 위한 정책 수립 필요성에 따라 보령시는 관내 등록된 노동조합의 체계적인 관리와 투명한 정보 공개를 통해 건전한 노사관계 조성과 근로자 권익 증진에 기여하고자 합니다. 이에 따라 보령시에 정식으로 등록된 노동조합들의 기본정보를 종합하여 조합명, 소재지, 연락처, 위치정보 등을 포함한 노동조합 현황정보를 제공하고 있습니다.- 개방 데이터는 보령시 관내 등록된 노동조합 15개소의 기본정보로 연번, 노동조합명, 소재지 도로명주소, 소재지 지번주소, 위도, 경도, 전화번호, 데이터기준일 등 총 8개 항목 10건의 정보를 제공합니다.- 노동관련 연구기관은 지역별 노동조합 분포와 노사관계 연구에 활용하고, 정책기관은 노동정책 수립과 노사관계 개선방안 마련에 활용하며, 근로자들은 인근 노동조합 정보 확인과 권익보호 상담에 활용할 수 있습니다. 또한 기업과 사업주는 건전한 노사관계 구축과 노동관련 협의체 구성에 기여할 수 있습니다.'
