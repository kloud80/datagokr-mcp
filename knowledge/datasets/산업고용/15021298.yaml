summary_user: 인천광역시 옹진군에 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 파일(약 20KB CSV)로, 업소명과 지번·도로명 주소, 데이터기준일자를 개별 업소 단위로 기록한다. 옹진군에서 담배를 파는 소매점이 어디에 있는지 확인하려는 주민이나, 섬 지역 담배소매점 분포를 살피는 분석가가 쓴다. 실측 컬럼에 사업자번호·행정코드 같은 전역 조인 키가 없어서, 다른 데이터와는 업소명이나 주소 문자열을 맞추거나 같은 옹진군 자료끼리만 이어 쓴다.
limits: 공통 조인 키가 없어서 LOCALDATA 담배소매업 원장이나 상가업소 데이터와 붙이려면 업소명·주소를 직접 맞춰야 한다. 범위는 옹진군 한 곳뿐이므로 인천시 전체나 다른 시군구와 비교하려면 별도 파일이 필요하다.
