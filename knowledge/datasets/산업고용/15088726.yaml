description_portal: 원자력안전위원회_방사선인허가 민원처리 현황 (2010-2020)- 본 데이터는 방사선인허가의 민원처리 연도별 현황데이터로, 총 민원접수 건수와 우편 및 전자민원 접수 건수로 구성되어 있습니다. - 전자민원 시스템은 2009년에 개발을 시작하여, 2010년 6월에 통합정보망을 통한 전자민원 접수 및 허가증 발급 서비스를 개시하였습니다.    이에 따라 민원접수의 편의성 및 신속성이 크게 향상되었고, 민원업무의 처리 과정과 허가증을 비롯한 민원의 처리결과 또한 통합정보망을 통해 실시간으로 조회할 수 있게 되어,     통합정보망을 통해 접수된 전자민원은 2010년 전체 민원(5,368건) 중 3.5%(189건)에 불과하였지만, 매년 증가하여 2020년에는 전체 민원(21,273건) 중 71.3%(15,178건)에 이르는 민원이    전자민원으로 접수될 만큼 높은 이용률을 달성하였습니다.
