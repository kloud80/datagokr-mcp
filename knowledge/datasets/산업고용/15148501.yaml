summary_user: 경상북도 김천시 관내 개별 기업을 한 행씩 담은 원천 목록으로, 회사이름·전화번호·생산품·주소·위도·경도·산업 분류와 데이터기준일자를 담는다(파일 약 47KB CSV). 김천시에서 특정 품목을 만드는 거래처를 찾거나, 산업 분류별로 관내 기업이 어디에 몰려 있는지 지도에 찍어 보려는 사업자·분석가가 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 회사이름·주소 매칭으로만 잇고, 위도·경도로 상가·상권이나 산업단지 위치 자료와 공간적으로 겹쳐 쓴다.
description_portal: 본 데이터는 지역 내 개별 기업의 현황을 체계적으로 제공하기 위한 자료로, 기업명, 전화번호, 주요 생산품, 주소, 위도·경도 좌표, 산업 분류 등의 정보를 포함하고 있습니다. 이를 통해 기업의 기본 정보를 쉽게 파악할 수 있으며, 산업별·지역별 기업 분포 현황 분석에 활용할 수 있습니다. 행정기관은 정책 수립 및 기업 지원 업무에 참고할 수 있고, 민간에서는 산업 동향 파악, 거래처 발굴, 연구·통계 분석 등 다양한 목적으로 활용 가능합니다. 나아가 지역경제 활성화와 공공·민간 협력 기반 마련에 기초 자료로 기여할 수 있습니다.
