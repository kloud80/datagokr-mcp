description_portal: 한국가스공사 배관시설을 통해 이송되는 직수입 천연가스의 일일 이용량을 열량(GJ), 중량(TON), 부피(NM3) 단위로 제공합니다.직수입 가스란, 한국가스공사를 제외하고 도시가스사업법 제10조의9(자가소비용직수입 천연가스 대상물량)에 따라 자가소비를 위하여 직수입한 천연가스(LNG,NG)를 의미합니다.직수입자는 도시가스사업법 제39조의6(가스공급시설의 공동이용)에 따라 한국가스공사에 요금을 납부하고 배관시설을 이용하여 직수입 천연가스를 이송할 수 있습니다.해당 데이터는 거래용 계량기로 계량된 실적데이터이며, 배관시설이용규정 [별표4] 제3조(정산대상 물량과부족량)에 따른 물량과부족 정산은 반영되어 있지 않습니다.
