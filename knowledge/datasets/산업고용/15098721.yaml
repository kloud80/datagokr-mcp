summary_user: 수요자원시장에서 경제성DR(수요반응)의 시간별 입찰량과 낙찰량을 거래일·거래시간 단위로 담은 전국 집계 파일(단위 MWh)이다. 전력시장 분석가나 수요자원 사업자가 특정 날짜·시간대에 경제성DR이 얼마나 입찰되고 실제로 낙찰됐는지, 낙찰 비율이 어떻게 변하는지 확인하는 데 쓴다. 전역 조인 키는 없고, 거래일·거래시간을 기준으로 같은 기관의 SMP·시간별 전력수급·발전량 데이터와 시간축으로 맞춰 이어 쓴다.
