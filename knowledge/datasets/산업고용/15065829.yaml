description_portal: 한국가스공사 발간 '학생참여연구 e-소논문집'의 논문 현황을 체계적으로 정리한 데이터 입니다.대학생들의 천연가스산업 이해 증진 및 연구 지원, 미래인재 양성, 산학협력 강화를 목적으로 수집되었습니다. 데이터 구성항목은 번호, 구분(발간연도), 구분(상/하반기), 논문 제목 등으로 이루어져 있어 발간 논문의 기본 정보를 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 연도별 발간 논문 현황 파악, 연구주제별 동향 분석, 학생 참여 연구 성과 평가, 반기별 발간 추이 분석, 연구주제 트렌드 파악이 가능합니다. 또한 대학생 연구 지원 프로그램 기획, 산학협력 강화 방안 수립, 미래인재 발굴, 연구주제 확대 방향 검토에 활용됩니다.천연가스 산업에 대한 학생들의 관심 제고와 미래 전문인력 양성에 기초자료로 활용되어 산학협력 생태계 발전에 기여합니다.
