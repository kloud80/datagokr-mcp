description_portal: '철강원자재 가격동향 통계는 철강산업의 원가구조 분석과 시장 변화 대응을 지원하기 위해 산출된 기초자료로 활용되며, 해당 통계는 다음과 같이 주요 항목으로 구분된다.-국제 원자재 가격: 철광석(달러/톤), 유연탄(달러/톤), 철스크랩(달러/톤, 엔/톤)-국내 철강재 가격: 철근(천원/톤), 열연(천원/톤), 후판(천원/톤), 냉연(천원/톤)  각 항목은 월별 평균가격과 변동 추세를 집계하여 원자재 수급 불안정, 국제 시황 변화, 환율 및 무역 규제와 같은 외부 요인의 영향을 분석하는 데에 활용할 수 있다본 통계는 정부의 정책 수립, 산업계의 구매 전략 및 투자계획 마련을 위한 핵심 자료로 활용되며, 향후 사회적 이슈 반영과 표준화된 용어 사용, 정기적 업데이트를 통해 활용성을 제고할 예정이다.'
