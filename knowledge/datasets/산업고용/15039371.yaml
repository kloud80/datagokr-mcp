description_portal: 해당공공데이터는자투리시간거래소의일별접속자현황을기록한자료로,플랫폼이용추이와시민관심도를파악하기위한기초통계자료이다.자투리시간거래소는근로자,구직자,소상공인,기관등이짧은시간단위의일거리나인력수요를효율적으로연결할수있도록지원하는서비스로,남는시간을활용해일을하려는이용자와단시간인력이필요한수요처를연계하는생활밀착형일자리플랫폼의성격을가진다.즉전일제또는장기고용중심의전통적고용방식과달리,시간단위·단기성·유휴시간활용이라는특성을바탕으로지역내노동수요와공급을신속하게매칭하는기능을수행한다.본데이터의주요내용은일자별접속자수로구성되며,각일자에플랫폼에접속한이용자규모를집계하여제공한다.비록컬럼구성이단순하더라도,일별접속자수는서비스활성화정도,정책홍보효과,특정시기이용집중현상,계절·요일별이용패턴등을분석할수있는핵심지표로활용될수있다.또한신규사업시행,이벤트운영,구인공고집중등록,지역일자리정책추진등과연계하여이용자유입변화를파악할수있으며,플랫폼운영성과평가와향후서비스개선방향설정에도기초자료가된다.이자료는자투리시간거래소의운영현황을객관적으로확인하고,지역일자리플랫폼의이용실적과정책효과를투명하게공개하기위한공공데이터로서,행정의책임성과데이터기반정책수립에기여한다.
