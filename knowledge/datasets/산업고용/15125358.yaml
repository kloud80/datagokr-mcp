        required: false
        example: LCTR_MCLSS_CD_02
        desc: 강좌 중분류 코드
      - name: cond[lctr_sclss_cd::EQ]
        required: false
        example: NLTYPE_006
        desc: 강좌 소분류 코드
      - name: cond[lctr_nm::LIKE]
        required: false
