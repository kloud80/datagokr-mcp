summary_user: 창업에듀 사이트에 등록된 온라인 창업 강좌를 강좌 한 건 단위로 담으며, 강좌명·설명·대/중/소분류 코드·재생 시간·조회 수·추천 여부·강좌 페이지 주소·등록/수정 일시가 들어 있고 지역 구분 없이 전국 대상이다. (예비)창업자나 창업 지원 담당자가 '사업계획서 작성이나 자금 조달을 무료 온라인 강좌로 배우려면 어떤 과정을 들으면 되나'를 찾을 때 쓴다. 다른 데이터와 맞춰 쓸 전역 조인 키는 없어서, K-Startup 지원사업 공고 같은 창업진흥원 데이터와는 강좌명·키워드나 같은 기관의 분류 코드로만 느슨하게 연결한다.
description_portal: 해당 정보는 중소벤처기업부와 창업진흥원이 운영하는 ‘창업에듀’ 사이트에 등록된 온라인 창업 교육 콘텐츠로, (예비)창업자의 성공 창업을 지원하기 위해 제공되는 단계별 맞춤형 창업 강좌 정보를 담고 있습니다. 아이디어 발굴부터 사업계획 수립, 마케팅 전략, 자금 조달, 법률·세무 교육 등 창업 전 과정에 걸쳐 필수적으로 알아야 할 내용을 체계적으로 안내하며, 창업 준비 수준과 필요에 따라 초급부터 고급까지 다양한 과정이 마련되어 있어 자기주도적 학습이 가능하도록 구성된 것이 특징입니다. 이 서비스는 창업자가 시간과 장소에 구애받지 않고 학습할 수 있도록 온라인 기반으로 제공되며, 교육 수료 이력도 관리할 수 있어 실질적인 창업 역량 강화를 위한 교육 지원 체계를 제공합니다.
