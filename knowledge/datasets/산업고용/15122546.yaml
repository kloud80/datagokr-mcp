description_portal: 구조혁신지원사업 정책매니저 지원현황은 해당연도에 구조혁신지원사업의 산업·일자리 컨설팅 완료업체 사후관리 밀착지원 및 강화를 위한 정책매니저 사업 지원 현황을 제공합니다.구조혁신지원사업은 산업 구조전환 과정에서 발생되는 구조적 애로를 통합 지원하여 기업·근로자가 지속적인 성장동력을 창출 하도록 구조혁신 유형별(사업전환, 산업·일자리전환, 디지털전환) 전문가를 활용하여 진단 및 컨설팅, 정부 지원사업 연계를 수행하는 사업입니다.* 2023년 지원현황부터 제공하고 있으며, 업종구분은 표준산업분류(ksic)를 따릅니다.
