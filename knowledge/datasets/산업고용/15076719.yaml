summary_user: 서울시 상권배후지별 상주인구와 가구 수를 분기 단위로 집계한 통계로, 성별·연령대별 인구와 아파트·비아파트 가구 수를 담는다. 점포 입지를 고르는 사업자나 정책 분석가가 '이 골목상권 배후에 어떤 연령층이 얼마나 사는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 서울시 상권분석서비스의 유동인구·매출 등 다른 파일과는 기준 분기와 상권 코드(TRDAR_CD)로만 이어 쓴다.
description_portal: 'ㅇ 데이터 개요: 「서울시 상권분석서비스(상주인구-상권배후지)」로, 분기별 상권배후지 단위의 상주인구 및 가구 통계를 제공합니다. 각 행은 ‘기준_년분기_코드 × 상권배후지_코드’ 조합으로 식별되며, 배후지의 거주 기반 수요 구조를 파악하는 데 활용됩니다.ㅇ 기간·규모: 2019년 4분기부터 2025년 1분기까지 총 22개 분기, 23,980건(행)·29개 변수(열) 구성입니다. 상권배후지는 1,090개로 확인되며, 이 파일의 상권 구분은 ‘골목상권’으로 표기되어 있습니다.ㅇ 공간 단위: ‘상권배후지_코드/명’으로 세분화된 상권 배후지 단위 통계를 제공하여 역세권·주거지 등 미시적 생활권 분석이 가능합니다.ㅇ 주요 변수: 총_상주인구_수, 성별(남성·여성) 및 연령대(10·20·30·40·50·60이상)별 상주인구, 성별×연령대 교차 집계, 총_가구_수와 주거유형(아파트/비아파트) 가구 수를 포함합니다.ㅇ 데이터 일관성: 성별 합계와 연령대 합계가 총_상주인구_수와 일치(±1 이내 반올림 차)함을 확인하여 내부 합계의 무결성이 확보되었습니다.ㅇ 활용 예시: 점포 입지 선정, 상권 육성 정책 타깃팅, 고령·청년 비중이 높은 배후지 식별, 생활SOC 배치 검토, 유동인구·매출·임대료 등과의 결합 분석을 통한 상권 특성 진단 등에 유용합니다.ㅇ 형식·인코딩: CSV 형식이며 EUC-KR 인코딩입니다. 핵심 식별 컬럼은 ‘기준_년분기_코드, 상권배후지_코드/명’입니다.ㅇ 유의 사항: 본 파일에는 ‘골목상권’만 포함되어 있어 타 상권 유형과의 직접 비교는 제한될 수 있습니다. 추정 방식·표본 설계 등 생산 메타데이터는 파일 외부 문서 확인이 필요합니다(확실하지 않음). 계절성·분기 경계 효과를 해석에 반영하시기 바랍니다.'
