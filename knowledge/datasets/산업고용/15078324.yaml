summary_user: 충청북도 고용동향을 종사상지위(상용·임시·일용 등 임금근로자 지위)별로 나눠 연도·월 단위 취업인구를 담은 집계 Open API이며, 범위는 시도(충청북도) 단위의 비공간 통계다. 지역 일자리 정책 담당자나 연구자가 '충북에서 상용직 대비 임시·일용직 비중이 월별로 어떻게 변했나' 같은 고용 형태 변화 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 고용동향과는 연도·월과 시도 이름을 맞춰 이어 써야 한다.
description_portal: 충청북도 고용동향을 종사상지위 기준으로 세분화하여 제공하는 Open API로, 연도·월·종사자 지위·세분류·취업인구 구분 등 입력 파라미터를 활용해 지역 임금근로자의 구조와 변화 흐름을 상세하게 조회할 수 있습니다. 본 데이터는 지역 노동시장의 안정성, 직종별 인력 수급 상황, 고용 형태의 변화 등을 정량적으로 파악하는 데 유용하며, 행정기관의 일자리 정책 수립, 고용서비스 개선, 연구자의 지역경제 분석 등 다양한 공공·민간 활용을 지원합니다. 공공 개방을 통해 지역 기반 정책의 근거자료 확보와 노동시장 진단의 접근성 향상에 도움이 될 수 있습니다.
