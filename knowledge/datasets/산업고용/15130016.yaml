description_portal: 본 데이터는 유럽 주요국 주택용 천연가스가격의 구성비 정보를 제공합니다. 천연가스 요금 구조의 국제 비교분석을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 국가명, 연도, 원료비 비중, 공급비 비중, 세금 비중, 부가가치세 비중, 기타 비용 비중 등이 포함되어 있습니다. 데이터 원천은 Household Energy Price Index입니다. 본 데이터는 에너지 요금 정책 담당자, 에너지경제연구원, 가격분석 연구자, 도시가스사업자, 소비자단체, 기획재정부가 유럽 주요국의 가스요금 구성 분석 및 국내 요금체계 개선에 활용할 수 있습니다. 합리적인 가스요금 체계 구축에 기여할 것으로 기대됩니다
