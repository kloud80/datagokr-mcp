summary_user: 울산광역시 중구에 있는 태양광발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 상호·설비용량·도로명주소·허가일자·사업개시일이 들어 있다(csv 약 1KB의 소규모 파일). 중구 주민이나 분석가가 "우리 동네 어디에 어느 규모의 태양광발전소가 언제 허가·가동됐는가"를 확인하거나 발전소별 용량을 비교할 때 쓴다. 전역 조인 키가 없어서 도로명주소나 상호로 이름을 맞춰 붙여야 하며, 전국태양광발전소 전기사업허가정보 표준데이터와 주소·용량 기준으로 대조하는 방식으로 이어 쓴다.
description_portal: 울산광역시 중구에 위치한 태양광발전소 현황 자료입니다. 각 발전소의 명칭과 설치용량, 그리고 도로명 주소가 기재되어 있습니다. 발전소별 설치용량은 14.87kW에서 최대 99.82kW까지 다양하며, 주거지 및 상업지구에 분포해 있습니다. 특히 평동 태양광발전소는 99.82kW로 가장 큰 규모를 보유하고 있습니다.이 자료는 태양광발전소의 위치를 파악하고 발전 용량을 비교하는 데 유용하게 활용될 수 있습니다. 또한, 지역별 재생에너지 활용 현황을 이해하는 기초자료로도 의미가 있습니다.
