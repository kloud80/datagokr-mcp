summary_user: 창업진흥원이 제공하는 메이커스페이스 주관기관 목록으로, 기관 한 곳을 한 행으로 연번·지역·기관명·주소를 담는 CSV 파일이며 전국 163행이 확인된다. 창업자나 분석가가 내 지역에 메이커스페이스 주관기관이 어디 있는지, 협력·방문할 기관이 어디인지 찾을 때 쓴다. 주소(address)가 조인 키라서 주소 기준으로 다른 지역·기관 데이터와 이어 쓰며, 별도의 코드표나 기관 식별 코드는 없다.
description_portal: 해당 데이터는 중소벤처기업부 산하 창업진흥원이 제공하는 메이커스페이스 주관기관 정보로, 연번, 지역, 기관명, 주소 항목으로 구성되어 있습니다. 각 주관기관이 위치한 지역별 정보와 함께 기관명 및 주소가 상세하게 제공되어 있어, 사용자는 해당 기관의 지리적 분포를 확인하고 실제 위치를 파악하거나 방문, 협력 등을 위한 정보 탐색에 활용할 수 있습니다. 특히 전국 각지에 분포한 메이커스페이스 주관기관의 명칭과 소재지를 구조화된 형태로 정리하고 있어, 향후 지역 기반 창업 인프라 정책 수립이나 사업 연계 기관 탐색 시 유용하게 활용될 수 있도록 구성되어 있습니다.
