summary_user: 한국석유관리원과 품질관리 협약을 맺은 전국 주유소를 주유소 한 곳당 한 행으로 담은 파일로, 관할 본부·협약 연도·주유소명·주소·전화번호·상표·품질검사 적합 여부가 들어 있다. 소비자가 "우리 동네에 석유관리원이 품질을 관리하는 협약주유소가 어디 있고 품질검사에 적합했나"를 확인하거나, 분석가가 지역·상표별 협약주유소 분포를 볼 때 쓴다. 전역 조인 키(주유소 ID·좌표)가 없어 오피넷 유가나 전국주유소표준 데이터와는 주유소명·주소 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 석유사업자 품질관리 지원사업이란 한국석유관리원이 주유소가 판매하는 석유제품의 품질관리를 지원함으로써 소비자가 믿고 이용할 수 있는 주유소를 활성화하여 국내 석유시장의 건전한 유통질서 확립에 기여하기 위한 제도입니다.품질관리 협약주유소란 소비자가 믿고 이용할 수 있도록 한국석유관리원과 협약을 맺고 석유제품의 품질에 대해 수시로 관리를 받고 있는 주유소입니다.해당 데이터는 품질관리 협약주유소 관련 데이터로 주유소명, 관할 본부, 협약 연도, 지역, 주소, 전화번호, 상표, 품질검사 적합 여부 등의 정보 확인이 가능합니다.
