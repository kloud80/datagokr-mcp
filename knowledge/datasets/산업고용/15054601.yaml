description_portal: 이 데이터는 국내에서 생산한 석유제품의 연도별 생산 실적을 정리한 자료입니다. 항목에는 석유제품명, 생산량(천배럴 단위) 등이 포함되어 있으며, 석유제품별 생산 규모와 생산 추세를 분석할 수 있습니다. 이를 통해 연도별 생산 변동, 주요 제품의 생산 집중도, 공급 능력의 변화 등을 확인할 수 있으며, 국내 정유산업의 운영 전략 및 생산계획 수립, 공급망 분석 등에도 활용됩니다. 이 데이터는 정부의 에너지 수급 정책, 산업별 에너지 수요 대응 전략, 정제시설 운영 최적화 등에 기초 자료로 유용하게 쓰일 수 있습니다.
