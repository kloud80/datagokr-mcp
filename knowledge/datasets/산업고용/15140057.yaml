description_portal: 이 데이터는 한국남부발전에서 운영 중인 유연근무제 활용 현황을 정리한 자료입니다. 시간선택제근로형, 시차출퇴근형, 근무시간선택형, 집약근무형, 재량근무형 등 다양한 유연근무 유형별로 남성과 여성 직원의 참여 인원이 구분되어 제공됩니다. 또한 기준연도와 기준월 정보를 함께 수록하여 시기별 변화를 추적할 수 있도록 구성되어 있습니다. 이를 통해 기업 내 일·생활 균형 지원 정책의 효과를 확인할 수 있으며, 성별별 참여율을 비교해 근로 문화 변화와 조직 내 다양성 확대 정도를 파악할 수 있습니다. 연구자와 정책 담당자는 근로 형태의 변화를 분석하거나 제도 개선 방향을 도출하는 데 활용할 수 있으며, 일반 국민도 공공기관에서 실제 운영 중인 근무 제도를 이해하는 데 도움을 받을 수 있는 데이터입니다.
