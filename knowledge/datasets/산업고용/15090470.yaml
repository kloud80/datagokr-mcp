summary_user: 서울 용산구 관내에 정식 등록된 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록신청사업·영업구분·등록증번호·상호·법인여부·사업장 전화번호·도로명 소재지를 포함한다(CSV 약 4KB). 대부업체를 이용하려는 주민이 '이 업체가 용산구에 정식 등록된 곳인가, 불법사금융은 아닌가'를 확인하거나, 분석가가 용산구 내 대부업체 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호·도로명 주소 매칭이나 같은 시군구명으로만 연결하며, 다른 자치구의 대부업 등록현황이나 LOCALDATA 업종 인허가 자료와 주소 기준으로 이어 쓴다.
description_portal: 「대부업 등의 등록 및 금융이용자 보호에 관한 법률」에 의거 서울시 용산구 관내 대부업 및 대부중개업 등록현황 정보를 제공합니다. 대부업 및 대부중개업체별 등록유형, 등록번호, 상호, 법인여부, 사업장 전화번호, 소재지 주소 등 정보로 구성되어 있습니다. 대부업 및 대부중개업 이용 시, 정식 등록여부를 확인할 수 있도록 하여, 불법사금융업자를 판별할 수 있도록 합니다.기준일자(2025.07월말) 현재 정식등록된 업체들에 대한 정보이며, 실시간 등록현황은 금융위원회나 금융감독원 홈페이지에서 전국 지자체에 등록된 업체를 조회하실 수 있습니다.
