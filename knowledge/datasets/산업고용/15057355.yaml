summary_user: 경기도 내 운동화 전문 세탁업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 시군명·인허가일자·영업상태·폐업일자·세탁기와 회수건조기 수·정제 주소와 WGS84 좌표를 포함한다. 소상공인이나 분석가가 "우리 시군에서 운동화 세탁업이 언제 생기고 얼마나 문을 닫았나"처럼 업종의 개폐업 흐름과 지역 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 지역 통계나 LOCALDATA 업종 인허가 자료와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 운동화 전문 세탁업체의 사업장 현황을 수록하고 있으며, 인허가일자, 영업상태, 세탁기 및 회수건조기 수, 주소 및 위치정보(WGS84 좌표), 위생업종 분류 등의 정보를 포함하고 있습니다. 대부분의 데이터는 폐업된 업체 중심으로 구성되어 있어, 해당 업종의 운영 지속성 및 지역적 분포의 변화를 파악하는 데 유용합니다. 이 데이터는 생활밀착형 위생서비스 현황 분석, 지역 기반 소상공인 업종 분포 분석, 특수 위생업 관리 기준 수립, 서비스 산업 정책 수립, 지역 소비패턴 연구 등에 활용될 수 있습니다.
