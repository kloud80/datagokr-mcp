summary_user: 서울특별시 양천구에서 식용얼음을 제조·보관·판매하는 영업소의 인허가 내역을 업소 1건 단위로 담은 원장 자료로, 인허가일자·영업상태·폐업일자·주소·면적·업태·종사자수·급수시설 등을 포함한다. 양천구에서 현재 영업 중인 식용얼음 판매업소가 어디에 있고 언제 허가·폐업했는지 확인하려는 주민·사업자·위생 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 좌표(X, Y)로 상권·상가 자료와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: 본 데이터는 서울특별시 양천구에서 식용얼음을 제조하거나 보관·판매하는 영업시설을 대상으로 인허가 처리 현황을 정리한 자료이다. 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수, 급수시설구분 등 행정 관리에 필요한 정보가 포함된다. 또한 정기 위생점검 결과와 개선 필요 사항 등을 함께 제공함으로써 지역 내 식용얼음 유통의 안전성과 관리 체계를 객관적으로 파악할 수 있다. 이 데이터는 식품안전 정책 수립, 지역 위생관리 강화, 영업자 행정 서비스 제공, 소비자 안전 확보 등 공공 행정의 효율성을 높이기 위한 기초 자료로 활용된다.
