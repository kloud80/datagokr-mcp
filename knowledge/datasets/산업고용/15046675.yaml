description_portal: '○ 통계개요* 통계명 : 1인당 지역내 총생산 및 지출* 통계종류 : 지정, 가공통계* 작성목적 : 지역경제의 생산 규모 및 지출수준, 소득수준, 산업구조 등을 파악하여 지역경제분석 및 정책수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 1인당 지역내총생산, 개인소득, 민간소득 등○ 용어설명* 지역소득 : 생산, 소비, 물가 등의 기초통계를 바탕으로 추계한 해당지역의소득자료로서 시.도 단위의 종합 경제지표임○ 기 타* 1인당 지표는 통계청 시도별 장래인구추계결과(2017.06 공표)로 산출하였음* 2010년 기준개편'
