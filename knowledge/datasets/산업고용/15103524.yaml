summary_user: 한국남동발전이 운영하는 태양광 발전소와 연계 ESS를 발전소 단위로 한 줄씩 담은 설비 목록으로, 발전소명·설비용량·소재지 주소·ESS 용량·PCS 용량을 전국 범위로 담는다(파일 약 1.5KB의 소규모 목록). 분석가나 지역 에너지 담당자가 "남동발전 태양광 발전소가 어느 지역에 얼마나 몰려 있고, ESS가 붙은 곳의 용량은 얼마인가"를 지도에 올려 확인하는 데 쓴다. 전역 조인 키는 없으므로, 소재지 주소를 지오코딩하거나 발전소명·주소를 맞춰 전국 태양광발전소 전기사업허가 표준데이터나 지역별 일사량 자료와 이어 쓴다.
description_portal: 한국남동발전에서 운영 중인 태양광 및 연계ESS 발전소 정보입니다.해당 데이터는 발전소 소재지의 설비 용량 목록을 제공하며, 설비용량, 주소, 에너지저장시스템(ESS), 전력변환장치(PCS) 용량을 포함하고 있습니다. 해당 데이터를 활용하여 전국에 분포된 한국남동발전의 태양광 발전소 위치를 GIS 기반 시각화할 수 있습니다. 이를 통해 발전소의 지역별 밀집도와 입지 선정 전략을 파악하고, 지역별 일사량 데이터와 연계 및 비교하여 발전 효율을 예측하는 등 심층적인 분석이 가능합니다.
