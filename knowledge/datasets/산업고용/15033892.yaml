summary_user: 서울 강북구 안 공공시설에 설치된 신재생에너지(태양광 등) 발전설비를 발전소 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 2.7KB)로, 발전소명·설비용량(kW)·설치장소·설치년도·데이터기준일을 담는다. 강북구 공공시설 태양광이 어디에 몇 kW 규모로 언제 설치됐는지 확인하려는 주민·분석가가 구 단위 공공 재생에너지 보급 현황을 볼 때 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 등 다른 설비 원장과는 설치장소·발전소명 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 재생 에너지는 인간의 시간 척도(human timescale) 내에서 자연적으로 다시 보충되는 자원을 활용해 생산되는 에너지다. 녹색 에너지 또는 그린 에너지라고도 합니다.가장 널리 사용되는 재생 에너지원으로는 태양 에너지, 풍력, 수력이 있으며, 일부 국가에서는 바이오에너지나 지열 에너지도 중요한 역할을 하고 있습니다서울특별시 강북구에 신재생에너지 현황 데이터는 강북구내 설치된 공공시설의 신재생 에너지(태양광 등) 발전소 현황자료이며 자료의 구성은 연번, 발전소명, 설비용량, 설치장소, 설치년도, 데이터기준일로 구성되어 있습니다
