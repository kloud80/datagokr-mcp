summary_user: 경기콘텐츠진흥원의 권역별 센터가 보유하거나 도내 기업에 대여하는 공간을 한 행에 한 곳씩 담은 시설 목록으로, 시군명·센터명·공간명·위치·지원 장비·예약 방법·전화번호·수용인원과 도로명·지번 주소, 위도·경도, 우편번호를 포함한다. 창업자나 콘텐츠 제작자가 '우리 시군 근처에서 촬영 장비가 갖춰진 10인 이상 회의·작업 공간을 어디서 어떻게 예약하나'를 찾는 데 쓴다. 전역 조인 키는 없어 시군명 이름 매칭이나 좌표(위도·경도)·주소를 이용한 지도 결합으로만 다른 데이터와 잇는다.
description_portal: 경기콘텐츠진흥원 각 지역(권역)별 센터에서 보유한 공간 및 도내기업에게 대여하는 공간(시설)으로 지역별 공간 운영 현황과 이용 방법에 대한 정보를 포함하고 있습니다.주요 항목은 시군명, 센터명, 공간명, 위치명, 지원사항, 예약방법, 전화번호, 수용인원수, 주소정보(도로명 및 지번), 위도·경도, 우편번호로 구성되어 있으며, 공간별 특화된 지원장비(스마트TV, 카메라, 화이트보드 등)도 명시되어 있습니다. 이 자료는 창업자, 콘텐츠 제작자, 스타트업 등이 지역 기반의 창작 인프라를 파악하고 이용 계획을 수립하는 데 활용됩니다. 또한 공간예약 및 대여 운영 효율성 분석, 시설 수요 예측, 콘텐츠산업 기반 구축 정책 수립 등에 활용될 수 있으며, 지도 기반 시각화나 접근성 평가에도 유용합니다.
