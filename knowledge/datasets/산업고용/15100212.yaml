summary_user: 2021년 1월 1일부터 2022년 3월 31일까지 서울시 내 한국전력공사 전기차 충전소의 충전 기록을 충전 건 단위로 담은 파일(xlsx, 약 38MB)로, 급속·완속 구분, 충전소명, 주소, 충전기 용량, 충전량, 충전 시작·종료 시각이 들어 있다. 분석가나 지자체 담당자가 '출퇴근·심야 등 시간대별 충전 수요가 어떻게 다른가', '서울 어느 충전소와 지역에 충전 이용이 몰리는가'를 따질 때 쓴다. 충전소 ID나 행정구역 코드 같은 공통 조인 키가 없어서 다른 충전소 현황 데이터와는 충전소명이나 주소 문자열을 맞춰 이어 써야 한다.
description_portal: 2021.1.1-2022.3.31 기간의 서울시 내 한국전력공사 전기차 충전소의 충전량에 대한 상세 데이터입니다. 충전구분(급속, 완속), 충전소명, 주소, 충전기용량, 충전량, 충전시작시각 및 충전종료시각 등 충전의 모든 과정을 정밀하게 파악할 수 있는 정보로 구성되어 있기에 전기차 이용자들의 실제 충전 패턴과 에너지 소비 동향을 분석할 수 있습니다. 예를 들어, 충전시작시각과 충전종료시각을 기반으로 출퇴근 시간대나 심야 시간대의 충전 수요를 파악하거나, 주소 칼럼을 활용해 충전소별 이용량의 편차를 분석하여 서울시 내 전력수요 집중 지역을 식별할 수 있습니다.
