description_portal: 이 데이터는 근로복지공단이 산재보험 업무를 위해 관리하고 있는 장해등급 관련 정보를 모은 데이터셋입니다. 장해등급 정보, 장해계열 정보, 중증요양상태 등급 정보 세 개의 파일로 구성되어 있으며, 각각의 파일은 상호 보완적인 역할을 수행합니다. 이 파일들 중에 "장해등급 정보" 파일은 장해등급, 장해계열 ID, 장해 내용, 장해 부위 코드 및 부위명 등 장해등급의 세부적인 기준을 담고 있는 핵심 자료입니다. 여기에 "장해계열 정보"와 "중증요양상태 등급 정보" 파일은 각각 장해계열 ID, 중증요양상태 등급 코드 등의 참조 테이블입니다. 이 세 파일을 결합하여 사용함으로써 산업재해로 인한 신체 장해의 종류와 등급을 파악할 수 있습니다.※ 「산업재해보상보험법」 제5조에서는 "장해" 와 "중증요양상태" 를 다음과 같이 정의하고 있습니다. - 5. “장해”란 부상 또는 질병이 치유되었으나 정신적 또는 육체적 훼손으로 인하여 노동능력이 상실되거나 감소된 상태를 말한다. - 6. “중증요양상태”란 업무상의 부상 또는 질병에 따른 정신적 또는 육체적 훼손으로 노동능력이 상실되거나 감소된 상태로서 그 부상 또는 질병이 치유되지 아니한 상태를 말한다.본 데이터는 국민의 삶과 직결된 중요한 사회적 정보를 제공하며, 다양한 분야에서 가치 있는 분석 자료로 활용될 수 있습니다. 예를 들어, 정책 연구자는 이 데이터를 활용하여 특정 유형의 산업재해 발생 추이를 분석하고, 산업 안전 정책의 실효성을 평가하는 기초 자료로 삼을 수 있습니다. 또한, 장해의 종류와 등급 분류 기준을 심층적으로 연구하여 재활 프로그램 개발 및 재해 근로자들의 사회 복귀를 돕는 데 활용할 수 있으며, 이와 함께 관련 사회복지 서비스와의 연계 방안을 모색하는 데에도 기여할 수 있습니다.
