summary_user: '창업진흥원 비대면 스타트업 육성사업의 주관기관을 기관 한 곳당 한 행으로 정리한 전국 목록으로, 지역·기관명·공공/민간 구분·주력 지원 기술분야·주소를 담는다(CSV 772바이트 규모의 작은 파일). 예비·초기 창업자가 "우리 지역에서 내 기술분야(예: 헬스케어, 교육)를 지원하는 비대면 육성사업 주관기관은 어디인가"를 찾거나, 분석가가 지역별 주관기관 분포와 기술분야 특성을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주관기관명이나 주소(지역명) 문자열을 맞춰 연결해야 한다.'
description_portal: 해당 데이터는 창업진흥원에서 관리하는 비대면 스타트업 육성사업 주관기관 현황 관련 자료로, 전국 주요 주관기관의 정보를 포함하고 있습니다. 각 데이터는 연번, 지역, 주관기관명, 기관구분(공공/민간), 주력지원기술분야, 주소 항목으로 구성되어 있으며, 창업지원 정책 수립 및 지역 기반 창업 인프라 파악에 활용될 수 있습니다. 특히 지역별 창업 유관기관의 기술분야 특성과 분포를 비교하거나, 네트워크 연계 및 협업체계 기획의 기초자료로서 유의미하게 사용할 수 있도록 구성되어 있습니다. 창업 수요자 입장에서는 지역 내 지원 가능 기관을 탐색하고, 기술 분야별로 특화된 지원 기관을 찾는 데 도움이 됩니다.
