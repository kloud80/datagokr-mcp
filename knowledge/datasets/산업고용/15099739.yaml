summary_user: 강원특별자치도 태백시에서 현재 정상영업 중인 담배 소매인을 업소 한 곳당 한 행으로 담은 등록대장으로, 지정번호·업소명·도로명주소를 담는다. 태백시 안에서 담배를 파는 가게가 어디에 있는지, 특정 주소 근처에 이미 지정된 소매점이 있는지 확인하려는 주민·예비 사업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 연결하며, 지방행정 인허가(LOCALDATA) 담배소매 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 용도가 현실적이다.
limits: 사업자번호나 좌표 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵고, 주소·업소명 문자열 매칭에 의존해야 한다. 범위는 태백시 한 곳의 개별 업소로 한정된다.
