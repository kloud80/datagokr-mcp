summary_user: 한국전력공사가 운영하는 이동형 충전기의 검침일자별 검침내역으로, 계약전력과 사용전력량계의 경부하·중부하·최대부하 지침, 최대수요전력계의 중부하·최대부하 지침, 전력사용량을 검침 건별로 담은 전국 범위 CSV 파일(약 3MB)이다. 공사·재난·산업 현장의 임시 전력 공급 장치를 운영하는 분석가가 "시간대별 부하 중 최대부하 구간 사용량이 얼마이고 계약전력 대비 최대수요는 어느 수준인가" 같은 피크관리 질문에 쓴다. 실측 컬럼에 충전기 ID·위치·행정코드 같은 전역 조인 키가 없어 다른 충전소·전력 데이터와는 검침일 기준 시계열 비교나 같은 기관 자료와의 수동 매핑으로만 이어 쓴다.
description_portal: 검침일자별 계약전력 사용전력량계, 최대수요전력계에 대한 이동형 충전기 검침내역에 대한 데이터 입니다.검침일, 계약전력, 사용전력량계 경부하지침, 중부하지침, 최대부하지침, 최대수요전력계 중부하지침, 최대부하지침, 전력사용량 항목으로 구성되어 있습니다.해당 데이터를 공사, 재난, 산업 현장에서의 임시 전력 공급 장치 운영 효율을 분석하거나, 피크관리 전략 수립에 활용할 수 있습니다.또한 전력 수요 예측, 임시 전원 배치 최적화, 친환경 전력 전환 검토 등 다양한 분야에서 기초자료로 활용할 수 있습니다.
