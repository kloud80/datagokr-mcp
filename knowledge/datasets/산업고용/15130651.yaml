description_portal: 복지넷은 한국사회복지협의회에서 운영하는 사회복지 관련 정보 포털로, 다양한 복지 정보와 서비스를 제공합니다. 이 플랫폼은 자원봉사 인증 관리, 구인구직 정보 제공 등 다양한 기능을 통해 구직자와 구인자에게 유용한 리소스를 제공합니다. 복지넷에서는 복지 혜택, 지원 사업, 관련 기관 정보 등을 한눈에 확인할 수 있으며, 최신 복지 정책 업데이트와 지역별 정보 검색 기능을 지원합니다. 또한, 복지넷을 통해 다양한 복지 서비스를 신청하고, 필요한 경우 해당 기관에 직접 문의할 수 있습니다.사회복지포털 복지넷을 통해 등록한 구인등록 정보의 연간 통계 데이터로 시설 분류별 근무형태별 등록건수, 시설 분류별 경력별 등록건수를 제공합니다.
