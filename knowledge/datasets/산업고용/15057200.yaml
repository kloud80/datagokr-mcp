summary_user: 노인일자리 업무시스템의 자립형 노인일자리 사업 모집공고를 공고 1건 단위로 담은 API로, 전국 36,592건이 있고 목록 조회와 공고일련번호(projNo)로 보는 상세 조회로 나뉜다. 어르신이나 지원기관 담당자가 우리 시군구에서 지금 모집 중인 자립형 일자리 공고가 무엇인지, 모집인원과 공고 기간은 어떤지 찾는 데 쓴다. 목록에서 얻은 projNo로 상세 조회를 이어 쓰며, 시도·시군구 행정구역명과 운영기관명은 이름 기준으로만 다른 데이터와 맞출 수 있고 전역 조인 키는 없다.
