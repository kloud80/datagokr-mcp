description_portal: 한국노인인력개발원에서 운영하는 노인일자리 업무시스템의 자립형 노인일자리 사업 관련 모집공고를 조회하는 OpenAPI이며, 자립형 일자리 사업 모집공고 목록 조회 서비스와 모집공고 상세정보 조회 서비스로 구성되어 있습니다. 자립형 일자리 사업 모집공고 목록 조회 서비스는 공고일련번호(projNo), 운영기관명, 사업년도, 광역자치단체(시도) 행정구역명, 기초자치단체(시군구) 행정구역명, 구인상태, 모집인원, 공고일정(시작일, 종료일) 등의 전반적인 공고 현황에 대한 정보를 제공하며, 자립형 일자리 사업 모집공고 상세정보 조회 서비스는 공고일련번호(projNo)를 필수 요청변수로 하여 공고일련번호, 운영기관명, 운영기관 우편번호 및 상세주소, 운영기관 연락처, 업무 배치 및 인원, 사업세부내용, 모집인원, 자격사항, 직무교육, 근무조건, 근무시간, 모집연령대, 임금, 근무기간 등 세부 공고 정보를 제공합니다.
