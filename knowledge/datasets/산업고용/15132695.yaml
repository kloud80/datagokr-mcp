summary_user: 전국 백년가게 지정 업체 1,511곳을 업체 단위로 담은 파일 데이터로, 업체명·주소·연락처를 행마다 싣는다. 지역별 백년가게 분포를 보거나 지역 관광·상권 활성화 기획에 쓸 업체 목록을 찾는 분석가·지자체 담당자가 쓴다. 업체주소(address)를 키로 상가업소 단위 상권 원장 등 주소 기반 데이터와 이어 쓴다.
description_portal: 본 데이터는 오랜 기간 동안 동일한 업종에서 지속적으로 운영되며 우수한 품질과 서비스를 제공한 전국 백년가게의 업체명, 주소, 연락처 등을 포함한 지정 현황 정보입니다. 소상공인시장진흥공단과 중소벤처기업부에서 선정한 업체를 바탕으로 작성된 데이터는 백년가게 운영현황, 지역별 백년가게 분포 정도, 지역 관광사업 기획 등의 기초자료로 활용될 수 있습니다. 또한, 백년가게 지정정보는 소상공인 정책, 지역상권 활성화 방안, 우수 소상공인 지원 사업 등 다양한 행정 목적에 참고자료와 정책 수립에 필요한 기초자료로 활용될 수 있으며 효율성 및 실효성을 분석하는 데에도 기초 자료로 쓰일 수 있습니다.
