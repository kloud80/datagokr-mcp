description_portal: '○ 통계개요* 통계명 : 여성경영사업체(조직형태별)* 통계종류 : 서울시 여성경영사업체 현황을 조직형태별로 제공하는 일반ㆍ조사통계* 작성목적 : 서울시에 등록된 여성기업에 대한 정확한 현황자료를 수집하여, 정부기관 및유관단체, 학교, 연구소 등 관련기관에서의 여성기업관련 연구를 위한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울특별시 데이터전략과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 여성경영사업체의 조직형태별(개인사업체, 회사법인,회사이외법인 등)ㆍ종사자규모별 사업체수 및 종사자수 현황○ 용어설명* 사업체 : 영리ㆍ비영리를 불문하고 개개의 상점, 사무소, 영업소, 은행, 학교, 병원,여관, 식당, 학원, 교회, 사찰, 공공기관, 사회복지시설 등과 같이 일정한 장소에서단일소유권 또는 단일통제 하에 제화의 생산ㆍ판매, 서비스 제공 등 산업활동을 영위하고있는 모든 경영단위* 개인사업체 : 법인 또는 단체가 아닌 개인이 독립적으로 운영하는 사업체* 회사법인 : 상법상의 주식·유한·합자·합명회사* 회사이외법인 : 사립학교, 사립의료법인, 특수법인(법무·회계법인, 공사, 공단), 종교·재단·사단법인 등* 비법인 단체 : 법인격이 없는 종교단체, 종친회, 동창회, 후원회 등○ 기 타* 2007년부터 조사공표주기(12.31)과 조사시점(익년도 조사기간 중)사이에 폐업되어조사되지 못한 사업체는 직전년도 실적으로 결측치를 대체하였음(2007년이전 해당장소에입주한 사업체로 대체함)'
