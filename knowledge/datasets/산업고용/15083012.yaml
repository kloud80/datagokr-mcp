summary_user: 한국중부발전이 추진한 신재생에너지 발전사업을 사업 한 건씩 담은 소규모 파일(csv 약 6KB)로, 에너지원·사업명·용량·착공/준공년월·위치·투자유형·지분반영용량(kW)을 담는다. 분석가가 중부발전의 에너지원별 개발 실적, 직접투자와 지분투자 같은 투자 형태, 사업지 분포, 지분 기준으로 확보한 발전용량이 어느 정도인지 파악하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 사업명·위치 같은 이름을 맞추거나 같은 발전사(발전사명) 기준으로만 잇는다. 예를 들어 전국태양광발전소전기사업허가정보표준데이터의 주소·용량과 대조하는 방식이다.
description_portal: 본 데이터는 한국중부발전이 추진한 신재생에너지 발전설비의 건설 및 개발 현황을 정리한 자료입니다. 항목은 순번, 발전사명, 에너지원, 사업명, 용량, 착공년월, 준공년월, 위치, 투자유형, 지분반영용량으로 구성되어 있으며, 용량과 지분반영용량은 모두 킬로와트(kW) 단위로 제공됩니다. 해당 자료는 기존 신재생에너지 운영사업 현황 데이터를 통합하여, 개발부터 운영까지의 전주기적 사업 흐름을 확인할 수 있도록 구성되어 있습니다. 이를 통해 중부발전의 에너지원별 개발 실적, 투자 형태, 사업지리적 분포, 지분 기준 발전자산 확보 수준을 분석하는 데 활용 가능합니다.
