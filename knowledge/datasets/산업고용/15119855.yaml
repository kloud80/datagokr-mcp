summary_user: 경기도가 바이오·첨단소재·AI 등 주요 핵심 산업에 시행한 지원사업을 사업 단위로 담은 목록으로, 사업개시년도·사업명·사업내용·지원구분(국가직접지원 또는 도 자체)·지원내용·예산액(천원)을 담는다. 분석가나 도내 중소기업·연구기관이 '경기도가 어떤 전략산업에 어떤 방식(R&D·사업화·산학연 협력·인프라)으로 얼마의 예산을 썼는가'를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 주요 핵심 산업에 대한 지원사업 정보를 수록한 자료로, 산업별로 시행되는 연구개발(R&D), 사업화, 산학연 협력, 인프라 구축 등의 다양한 정책 지원 내용을 포함합니다. 주요 항목은 사업개시년도, 사업명, 사업내용, 지원구분명(국가직접지원 또는 도 자체), 지원내용, 예산액(천원) 등으로 구성되어 있으며, 각 사업은 경기테크노파크, 바이오센터, GRRC(경기도지역협력연구센터) 등 전문기관을 중심으로 수행됩니다. 본 자료는 도내 중소기업과 연구기관의 기술개발 및 사업화를 유도하고, 바이오, 첨단소재, AI 등 전략산업의 경쟁력 강화를 목표로 하는 정책 기반 마련에 활용될 수 있습니다. 예산액 정보는 사업별 규모와 정책 우선순위 파악에 유용하며, 정책 성과 평가나 예산 배분 계획 수립에도 활용됩니다.※ 경기도 2022년 조직개편으로 과학기술과 부서 폐지에 따라 갱신이 중단되었습니다.
