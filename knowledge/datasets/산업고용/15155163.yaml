summary_user: 전국 지자체가 관리하는 고압가스업(제조·저장·판매, 용기 충전 포함) 인허가 업소를 사업장 단위로 담은 건별 원천 데이터로, 전체 30,537건이며 인허가일자·영업상태·휴폐업일자·주소·좌표 필드를 둔다. 분석가나 지자체 담당자가 특정 지역에 영업 중인 고압가스 업소가 어디에 있고 언제 인허가를 받았는지 확인하는 데 쓴다. 지번주소·도로명주소(address) 키로 다른 주소 기반 데이터와, 관리번호(MNG_NO, pnu 키)로 필지 기반 자료와 잇고, 호출에 필요한 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
description_portal: '자원환경_고압가스업 데이터는 용기에 충전하는 것을 포함하여 고압가스를 제조,저장 및 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 고압가스업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 에너지안전과 / 044-203-3983 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
