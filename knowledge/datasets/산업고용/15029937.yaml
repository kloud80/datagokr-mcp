summary_user: 전라남도 영광군 관내에서 운영 중인 신재생에너지 발전시설을 발전소 한 곳당 한 행으로 담은 건별 원장이며, 발전소명·설비용량·주소·발전사업 허가일·상업운전 시작일을 포함한다(CSV 약 69KB). 영광군에서 태양광·풍력 발전소가 어디에 얼마 규모로 언제 허가받아 가동을 시작했는지 확인하려는 사업자나 지역 에너지 분석가가 신규 입지 검토, 지역 발전량 추세 분석에 쓴다. 전역 조인 키가 없어 발전소명이나 주소를 매칭해야 하며, 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 이 방식으로 대조해 쓴다.
limits: 표준화된 발전소 식별 코드가 없어 다른 데이터와는 발전소명·주소 문자열 매칭으로만 연결된다. 영광군 한 시군구만 다루므로 다른 지역과 비교하려면 별도 자료가 필요하다.
