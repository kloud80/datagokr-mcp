summary_user: 전남광주통합특별시 자치구에 신고(등록)된 직업소개소를 한 곳씩 담은 파일 데이터로, 관할 행정관청·소개소명·대표자·도로명 소재지 주소·데이터 기준일자를 담는다. 구직자나 구인 사업자가 우리 구에 등록된 직업소개소가 어디에 있는지 확인하거나, 분석가가 자치구별 직업소개소 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정관청명(자치구 이름)이나 도로명 주소를 매핑해 이어 써야 한다.
description_portal: 직업소개소는 사람들에게 일자리를 소개하거나, 고용주에게 적합한 인재를 연결해주는 중개기관임. 일부는 유료, 일보는 무료 공공서비스로 제공됨.공공직업소개소에는 워크넷, 고용복지플러스센터, 일자리센터 등이 존재함. 민간 직업소개소는 사설 직업소개소, 온라인 취업포털 등이 있음. 혹은 직업휸련 연계형 기관인 한국폴리텍대학 등이 있음.직업소개소를 운영하려고 할 경우 직업안정법에 따라 직업소개사업을 각 자치구에 신고(등록)해야 함. 해당 데이터는 직업소개소 등록 관련 자료를 바탕으로 직업소개소 현황을 관리하고 있음.
