description_portal: 본 공공데이터는 인천광역시 서구에서 추진 중인 기업지원사업의 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 추진 중인 기업지원사업의 지원업무 구분, 지원업무명, 지원내용, 사업 담당자, 사업 담당자 전화번호 등 항목을 제공을 하고 있습니다. 본 공공데이터를 통하여 지역 내 중소기업을 대상으로 하는 다양한 지원 정책의 운영 현황을 손쉽게 파악할 수 있습니다. 이를 통하여, 창업 지원, 판로 확대 등 세부 전략 수립에 도움이 될것으로 판단이 됩니다. 본 공공데이터는 연마다 정기적 갱신을 통하여 최신정보를 반영하고 있습니다.
