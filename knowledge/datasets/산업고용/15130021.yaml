description_portal: 본 데이터는 한국가스공사의 도시가스 피크수요 기온반응함수 정보를 제공합니다. 도시가스 피크수요와 기온 간의 비선형 관계를 함수 형태로 추정한 결과입니다. 데이터의 세부 항목으로는 5대 지역별(수도권·충청권·대경권·호남권·동남권) 기온반응함수 계수, 기준온도, 반응강도, 함수형태 등이 포함되어 있습니다. 본 데이터는 수요예측 담당자, 에너지경제연구원, 기상연구기관, 도시가스사업자, 수리모형 연구자, 한국에너지공단이 기온변화에 따른 피크수요 예측 모델 개발에 활용할 수 있습니다. 정확한 수요예측을 통한 안정적 가스 수급관리와 에너지 정책 수립에 기여할 것으로 기대됩니다.
