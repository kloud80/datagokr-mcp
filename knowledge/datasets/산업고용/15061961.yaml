summary_user: 대전광역시 서구 관내 목재수입유통업체를 업소 한 곳당 한 행으로 담은 소규모 현황 파일(csv 350바이트)로, 업소명·허가일·영업상태(영업 중·폐업 등)·기준일자를 담는다. 서구에서 목재수입유통업 허가를 받은 업체가 어디이고 지금도 영업 중인지 확인하려는 주민·사업자·행정 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명 매칭이나 같은 기관(대전 서구) 기준으로만 이어 쓰고, 지방행정 인허가(LOCALDATA) 업종별 원장과 대조하는 용도가 대표적이다.
description_portal: 본 자료는 대전광역시 서구 관내에 등록되어 운영 중인 목재수입유통업체에 대한 현황 정보를 수록한 공공데이터입니다.해당 자료에는 서구 지역에 사업장을 두고 있는 목재수입유통업체의 사업장명, 허가일자, 그리고 현재의 영업상태(영업 중, 폐업 등)에 관한 항목이 포함되어 있으며, 이를 통해 해당 업종에 속한 업체들의 등록 및 운영 실태를 종합적으로 파악할 수 있도록 구성되어 있습니다.본 데이터는 대전광역시 서구를 기준으로 수집된 것이며, 각 업체의 명칭과 위치, 허가 시점, 그리고 영업 지속 여부 등을 일목요연하게 확인할 수 있도록 정리되어 있어, 관내 목재수입유통업체의 분포와 행정 등록 현황을 파악하는 데 유용한 자료입니다.
