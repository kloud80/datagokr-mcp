summary_user: 한국지역난방공사가 관리하는 열수송관을 지사·읍면동별로 정리한 전국 범위의 CSV 파일로, 관리 지사명, 위치 읍면동, 열공급 유형(온수·냉수), 준공년도, 배관 길이(m)를 담는다. 지자체나 분석가가 "우리 동네에 깔린 지역난방 배관은 언제 준공됐고 얼마나 길며, 노후 배관이 많은 지역은 어디인가"를 따져 유지보수 우선순위를 잡는 데 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어, 다른 데이터와는 읍면동명이나 지사명을 이름으로 맞춰 연결해야 한다.
description_portal: '한국지역난방공사의 지역별 공급관별 열수송관 현황 데이터를 정리한 자료로, 전국 각 지역본부 및 사업소의 열수송관 구성과 구간별 주요 특성을 체계적으로 관리하여 안정적인 지역난방 공급망 운영을 지원하기 위한 자료입니다.1. 형식: CSV2. 내용 요약:■ 지사명: 해당 열수송관을 관리하는 지사명(예시: 강남, 고양 등)■ 읍면동:  해당 열수송관이 위치한 읍면동명(예시: 강남구, 서초구 등)■ 배관정보명: 해당 열수송관의 열공급 유형 구분(예시: 온수, 냉수)■ 준공년도: 핸드홀이 시공된 연도(예시:1987, 1988 등)■ 열배관길이(m): 해당 열수송관의 전체 길이(예시: 166.35 등)3. 활용 예제:■ 지역별 열수송관 현황을 분석하여 열공급 인프라의 확충 계획 및 유지보수 우선순위 수립■ 공급구간별 설비 규모 및 관경 데이터를 활용해 열수송 효율성 및 에너지 손실률 평가■ 열수송 네트워크의 구조적 안정성 분석 및 사고 예방을 위한 위험관리 데이터베이스 구축'
