summary_user: 경기도 용인시에 등록된 비료생산업 업체를 업체 한 곳씩 담은 등록 원장으로, 업체명·업체등록번호·비료 종류와 명칭·등록일자·대표자명·지번/도로명 주소를 담는다(CSV 약 15KB). 용인시 안에서 어떤 업체가 어떤 비료를 생산하도록 등록돼 있고 어디에 있는지 확인하려는 농업인·사업자·정책 담당자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소 매칭이나 같은 기관의 다른 인허가(LOCALDATA) 자료와 이름 기준으로만 이어 쓴다.
description_portal: '본 데이터는 경기도 용인시 관내에서 비료생산업을 영위하는 업체의 등록 현황을 제공한다. 주요 항목은 인허가등록관리번호, 인허가구분, 업종구분, 업체등록번호, 업체명, 비료종류 및 명칭, 등록일자, 대표자명, 주소 등으로 구성되어 있다. 이를 통해 용인시 내 비료생산업 등록 업체의 기본 정보, 업종 유형, 비료 종류 및 명칭, 위치 정보, 등록 현황 등을 종합적으로 파악할 수 있다. 자료는 비료생산업 관리, 인허가 업무 지원, 관련 산업 현황 조사, 농업 정책 수립, 업종별 통계 분석, 사업자 관리 등 다양한 목적으로 활용될 수 있다. 시민, 정책 담당자, 연구자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 등록 현황을 반영하여 정기적으로 갱신된다. 공공데이터 개방을 통해 정보의 신뢰성과 활용도를 높이고, 농업 및 관련 산업 발전, 행정 효율성 제고에 기여하는 것을 목표로 한다.※ 데이터기준일자 : 2025-06-18'
