summary_user: 경상남도 창원시에 있는 수소충전소를 충전소 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.4KB)로, 충전소명·주소·위경도·운영시간·휴무일·충전대상 차량(승용차·버스 등)·운영주체·연락처를 담는다. 창원 시민이나 수소차 운전자가 '집 근처에서 버스도 충전되는 수소충전소가 어디고 언제 문을 여는가'를 확인할 때 쓰고, 분석가는 충전 인프라 위치 지도화에 쓴다. 전역 조인 키는 없어서 다른 충전소 데이터와는 충전소명·주소로 맞추거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: '본 자료는 경상남도 창원시에 위치한 수소충전소의 운영 현황에 대한 상세 정보를 제공하기 위한 것입니다.각 충전소별로 주소, 운영시간, 정기 휴무일, 이용 가능한 차량 종류(승용차, 버스 등), 연락 가능한 전화번호 등의 주요 정보가 포함되어 있습니다.충전소의 운영시간은 현장 상황, 설비 점검, 기상 조건, 혹은 기타 운영상의 사유에 따라 변동될 수 있으므로, 사전에 확인 후 이용하시는 것을 권장드립니다.전국 수소충전소의 실시간 운영 현황과 관련된 보다 정확하고 종합적인 정보는 수소정보유통시스템 ‘하잉(H2nBiz)’ 웹사이트를 통해 확인하실 수 있습니다.해당 사이트에서는 충전소별 운영 여부, 현재 상태, 위치 안내 등 다양한 정보를 제공합니다.접속 경로는 다음과 같습니다: https://www.h2nbiz.or.kr/index.do'
