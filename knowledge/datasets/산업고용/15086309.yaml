description_portal: 본 데이터는 열사용기자재의 안전과 효율성을 확보하기 위해 법정 의무사항으로 시행되는 검사 대상기기의 검사 실적 정보를 제공합니다. 국에너지공단이 수행하는 열사용기자재 검사는 보일러, 압력용기 등 열을 사용하는 설비에 대해 법정 기준에 따라 안전성 및 에너지 효율성을 점검하고 관리하는 업무로, 이를 통해 사고 예방과 에너지 절약 및 효율 향상에 기여합니다.본 데이터는 검사년월, 검사 종류, 지역, 공단업종코드, 사용용도, 기기명, 기기의 용량 및 용량의 단위, 최고사용압력, 사용 연료에 대한 항목을 포함하고 있습니다.정부와 공공기관은 본 데이터를 활용하여 에너지 사용 설비의 안전 및 효율성 관리 현황을 분석하고 에너지 정책 및 규제 강화를 위한 기초자료로 활용할 수 있으며,기업은 설비 안전관리를 위한 참고자료로 활용 가능합니다.
