summary_user: 2024년 성실경영평가 신청 건마다 평가일, 신청자 대표자의 만 나이 기준 연령대, 최종 통과·탈락 결과를 한 행으로 담은 전국 단위 파일(CSV)이다. 재창업 정책 분석가가 '2024년 성실경영평가에서 대표자 연령대별 통과율은 어떻게 다른가'나 월별 평가 건수 추이를 볼 때 쓴다. 기업명·사업자번호 같은 조인 키가 없어 다른 기업 데이터와 행 단위로 잇지 못하며, 같은 기관의 재도전 지원 통계와 연령대·연도 기준으로 나란히 비교하는 정도로만 쓴다.
description_portal: '2024년 성실경영평가 사업의 현황자료(평가일, 대표자 연령대, 성실경영평가 통과여부)를 공공에 제공하여 재도전 기업 관련 통계 구축 및 재창업 활성화에 기여함을 목적에 두고 있습니다.세부 내용은 다음과 같습니다.- 연번: 평가일 기준으로 오름차순 하였습니다.- 평가일: 2024년도 성실경영평가가 이루어진 날짜입니다.- 연령대: 만 나이 적용하여 신청자의 연령대를 추출한 데이터입니다.- 통과여부: 성실경영평가의 최종 통과/탈락 결과 데이터입니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.'
