description_portal: '한국가스안전공사에서 제공하는 해외업무협력(MOU) 체결 내역 목록입니다.한국가스안전공사가  가스 기술 정보 교류, 수소 협력, 국제표준화 정립, 교육훈련 등 해외 주요 국가의 유관기관 및 민간 협력을 위해 체결한 업무협약(MOU) 현황 정보를 제공합니다.본 목록은 협약명(영문), 약자, 체결년도, 협약내용, 협업기관, 지역에 대한 데이터가 수록되어 있습니다.가스 안전 기술과 관련된 해외 협력 확대를 위해 참고자료로 활용할 수 있습니다.※ 데이터기준일 : 2025년 6월 30일(상반기)※ 목록은 연간 주기로 업데이트 제공 됩니다.'
