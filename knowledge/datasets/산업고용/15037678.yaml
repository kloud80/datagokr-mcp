summary_user: 경기도 김포시 안 태양광발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 상호·설치장소 소재지(주소)·영업구분·설비용량(킬로와트)·사업개시일·데이터기준일을 담는다(csv 약 130KB). 김포시 안에서 태양광발전소가 어느 지역에 몰려 있고 규모가 어느 정도인지, 특정 시기 이후 사업을 시작한 발전소가 몇 곳인지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 맞추는 방식으로만 이을 수 있고, 전국태양광발전소전기사업허가정보표준데이터와 대조할 때도 같은 방식으로 맞춘다.
