description_portal: 한국노동연구원은 한국노동패널조사(KLIPS)를 통해 우리나라 가구와 개인의 고용, 소득, 직업, 교육, 가족구성 등의 변화를 장기적으로 관찰할 수 있는 데이터를 축적·공급하고 있습니다. 이와 함께 연구자 및 일반 이용자의 이해를 돕고, 데이터의 활용을 확대하기 위해 학술대회, 데이터 설명회, 발표자료 모집 등과 관련한 주요 공지를 홈페이지에 정기적으로 게시하고 있습니다. 이번에 개방하는 공공데이터는 한국노동패널조사 홈페이지 메인화면에 올라오는 공지사항의 메타데이터를 중심으로 구성됩니다. 주요 항목에는 행사명, 행사일자, 행사장소 등이 포함됩니다. 대부분은 KLIPS 학술대회, 데이터 설명회 정보이며, 이 데이터를 통해 연구자·학생·통계활용기관 등이 보다 효율적으로 행사 및 자료 활용 일정을 파악할 수 있습니다.
legal_basis_portal: 노동패널 조사의 원활한 활용을 위해 정기적으로 학술대회 및 데이터설명회를 개최하고 이를 대표홈페이지에 공개하며 이에 따른 메타데이터를 보관한다.
