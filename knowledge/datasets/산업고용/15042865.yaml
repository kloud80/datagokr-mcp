summary_user: 함평군에서 허가된 토석채취장을 허가 건별로 담은 파일로, 수허가자 상호·연락처, 허가지 주소, 채취 용도, 허가면적(제곱킬로미터)·허가량(세제곱미터), 허가 시작·종료일을 담는다(파일 크기 255바이트로 몇 건 수준). 건설자재 업체나 주민이 '함평군 안에서 지금 허가기간 중인 채석장은 어디이고 누가 운영하나'를 확인하거나, 산지 개발·불법 채취 모니터링의 기초 목록으로 쓴다. 전역 조인 키는 없으므로 허가지 주소를 지번·좌표로 바꿔 토지이용규제·산지 정보와 겹쳐 보거나, 다른 시군의 토석채취 현황과 같은 항목명으로 맞춰 이어 쓴다.
description_portal: 전라남도 함평군은 토석자원의 체계적인 관리와 환경 보전을 위해 관내 토석채취 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군에서 허가 또는 신고를 통해 이뤄진 토석채취 관련 정보를 포함하고 있으며, 채취장 위치, 채취 면적, 채취량, 허가일자, 허가기간, 채취자 정보, 허가 또는 신고 여부 등 기본정보로 구성되어 있습니다. 해당 데이터는 토석 자원 관리, 환경영향평가, 불법 채취 예방, 산지 개발 행위 모니터링 등에 활용될 수 있으며, 국토이용계획 수립, 건설자원 수급계획, 개발사업 인허가 검토 등 행정적 활용뿐만 아니라 관련 업계·연구기관의 자원분포 분석 및 정책 제안에도 유용한 공공자원입니다.
