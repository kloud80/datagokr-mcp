description_portal: 한국산업기술진흥원에서 개최하는 케이걸스데이 행사는 여학생들이 공학계열로 진학하고 산업현장에 사회 진출하는 것을 유도하기 위해 기획된 프로그램입니다. 본 데이터는 이 행사에서 조직된 공모전의 정보를 담고 있으며, 행사 참가자들의 경험을 바탕으로 한 의견과 후기를 수집하기 위한 자리를 마련하고 있습니다. 이 공모전은 여학생들이 공학 분야에 대한 진로 의식을 높이는 데 도움이 되도록 설계되었으며, 참가학생들에게는 이를 통해 진로 개발의 기회를 제공하고 있습니다. 데이터는 공모전의 진행 년도 및 차수, 시작일과 종료일, 참가조건, 개요, 발표일자 등으로 구성되어 있습니다. 이러한 데이터는 공공기관 및 교육기관에서 여성의 이공계 진출 활성화를 위한 자료로 활용될 수 있으며, 향후 행사의 개선 방향성을 제시하는 데에 기여할 수 있는 유용한 데이터로 볼 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있으며, 컬럼명은 "행사년도", "행사차수", "공모전 시작일", "공모전 종료일", "참가조건", "공모전 개요", "발표일자", "내용", "등록일자"입니다.
