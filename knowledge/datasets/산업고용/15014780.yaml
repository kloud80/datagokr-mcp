description_portal: 한국장애인고용공단은 장애인에 대한 취업지원을 강화하기 위하여 각 지역의 장애인 고용 유관기관과 협력하고 있으며, "공동수행기관" 약정을 맺어 공동 취업알선 사업을 운영하고 있습니다.본 데이터는 공동수행기관이나 무료직업소개소 등 일정 자격을 갖춘 기관이 장애인을 알선하여 취업시켰을 때 지급하는 "장애인 취업알선지원금"에 관한 데이터입니다.장애인취업알선 지원금 지원 기관, 사업장 및 참여자 정보(신청기관명, 최초등록인원, 중경증여부, 신청일자,신청금액, 결정일자, 결정금액, 취소일자, 취소금액, 취소사유, 관할지사) 등의 필드가 포함되어 있습니다.
