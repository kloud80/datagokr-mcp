summary_user: 부산광역시 연제구 관내에서 가스 법령에 따라 허가받은 액화석유가스·도시가스 등 가스충전소를 한 곳당 한 행으로 담은 소규모 목록 파일(csv 477바이트)로, 사업종류·상호·사업소주소·전화번호·허가일자를 담는다. 연제구 주민이나 차량 운전자가 근처 LPG 충전소의 위치와 연락처를 찾거나, 분석가가 구 단위 가스충전소 분포와 허가 시기를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 충전소·주유소 데이터와는 상호명이나 주소(사업소주소)를 맞춰 연결해야 한다.
description_portal: '연제구 관내 액화석유가스 및 도시가스 등 가스충전소에 관한 데이터로서, 가스충전소 위치, 전화번호 등 정보가 제공되는 데이터 입니다.액화석유가스의 안전관리 및 사업법 제5조(사업의 허가 등), 고압가스안전관리법 제4조(고압가스의 제조허가 등), 도시가스사업법 제3조(사업의 허가)에 의거하여 인허가받은 충전소의 정보입니다.각 항목별 설명으로는 다음과 같습니다.- 사업종류: 가스 법령에 따라 허가받은 사업의 종류를 나타냅니다- 상호: 상호명을 나타냅니다- 사업소주소: 사업소의 주소를 나타냅니다- 전화번호: 사업소의 전화번호를 나타냅니다- 허가일자: 사업소별 허가받은 일자를 나타냅니다'
