description_portal: 본 데이터는 2013년 기준 경기도 용인시 산업 중분류별로 종사상지위와 읍·면·동별 종사자 수를 집계한 현황을 제공한다. 주요 항목은 산업중분류, 종사상지위, 읍·면·동, 종사자 수로 구성되어 있으며, 상용직, 임시직, 일용직, 자영업자 등 다양한 고용 형태별 인력 분포를 세부적으로 확인할 수 있다. 이를 통해 지역별 산업 구조와 고용 특성을 종합적으로 파악할 수 있으며, 종사상지위별 고용 안정성, 산업별 인력 구조, 지역별 노동시장 특성 분석에 활용할 수 있다. 자료는 노동시장 구조 연구, 일자리 정책 수립, 고용 형태별 현황 비교, 창업 및 자영업 동향 분석 등 다양한 분야에서 유용하다. 단일 연도(2013년) 기준으로 제공되는 통계 자료로 주기적 갱신은 이루어지지 않지만, 당시 용인시의 고용 구조를 이해하는 중요한 기초 자료로 활용 가치가 크다. 공공데이터 개방을 통해 노동시장 정보의 투명성과 활용성을 강화하고, 지역 맞춤형 고용 정책 마련 및 산업별 인력 수급 관리에 기여하는 것을 목표로 한다.
