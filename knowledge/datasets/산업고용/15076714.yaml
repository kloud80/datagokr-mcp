summary_user: 서울시 상권 영역별로 분기(STDR_YYQU_CD)마다 관공서·은행·병원·약국·학교·대학·백화점·슈퍼마켓·극장·숙박시설·철도역·지하철역·버스정류장 등 집객시설 수를 세어 둔 집계 데이터입니다. 창업 예정자나 상권 분석가가 '이 상권 주변에 지하철역·학교·병원 같은 사람을 모으는 시설이 얼마나 있나'를 상권끼리 비교할 때 씁니다. 전역 조인 키는 없고, 상권 코드(TRDAR_CD)와 상권 구분 코드를 기준으로 같은 서울시 상권분석서비스의 다른 상권 데이터와 이름·코드 매핑으로 연결합니다.
description_portal: '서울시 상권 영역 내 집객시설 정보를 제공합니다.1년중 4분기에 한번 데이터를 업데이트 하여 다음 해 1, 2, 3 분기의 값이 동일합니다.*용어설명- 집객시설이란 많은 사람들이 방문하도록 유도하는 시설(상업, 관광, 문화, 전시, 오락 등 다양한 목적으로 사람들이 모이는 장소를 포함)(특징)대규모 방문객 유치 가능- 주변 상권·지역 경제와 밀접- 교통, 주차, 편의시설과 함께 시설 관리가 중요- 상권·집객력 분석 시 유동인구, 접근성, 주변 경쟁시설 고려※ 제공부서 : 서울특별시 서울신용보증재단 빅데이터팀(02-2174-5075)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
