description_portal: '○ 통계개요* 통계명 : 비정규직 근로자 비율* 통계종류 : 서울시 임금근로자 중 비정규직 근로자의 비율을 제공하는 지정ㆍ조사 통계* 작성목적 : 임금근로자의 다양한 근로형태에 대한 실태 및 규모를 파악하여 노동 관련 정책 및 연구에 활용* 조사체계 : 조사원(면접조사 PDA입력)→지방통계청(사무소)→통계청* 공표주기 : 반기* 공표범위 : 지역 - 서울시내용 - 서울시 정규직, 비정규직 근로자의 비율○ 용어설명* 임금근로자 : 자신의 근로에 대해 임금, 봉급, 일당 등 어떠한 형태로든 일한 대가를 지급받는 근로자로서 통상 상용, 임시, 일용근로자로 구분됨* 정규직 : 고용기간의 종료를 미리 정하지 않고 전일제로 근무하며 사용자와 근로자가 직접 고용계약을 맺고 일하는 근로자* 비정규직 : 1차적으로 고용형태에 의해 정의되는 것으로 한시적근로자, 시간제근로자,비전형근로자 등으로 분류됨** 한시적근로자 : 근로계약기간을 정한 근로자(기간제근로자) 또는 정하지 않았으나 계약의 반복 갱신으로 계속 일할 수 있는 근로자와비자발적 사유로 계속 근무를 기대할 수 없는 근로자(비기간제근로자)를 포함** 시간제근로자 : 직장(일)에서 근무하도록 정해진 소정의 근로시간이 동일 사업장에서 동일한 종류의 업무를 수행하는 근로자의 소정근로시간보다 1시간이라도 짧은 근로자로, 평소 1주에 36시간 미만 일하기로 정해져 있는 경우가 해당됨** 비전형근로자는 파견근로자, 용역근로자, 특수형태근로종사자, 가정내(재택, 가내) 근로자, 일일(단기)근로자를 말함'
