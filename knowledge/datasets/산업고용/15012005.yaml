summary_user: 소상공인 상가업소 한 곳마다 상호·지점명, 상권업종 대·중·소분류와 표준산업분류, 시도·시군구·행정동·법정동, 지번·도로명 주소와 층·호, WGS84 경위도를 담은 건별 원장이며, 전국 범위로 API 전체 건수는 22,739건으로 확인됐다. 창업 예정자나 상권 분석가가 '이 동네 반경 안에 같은 업종 가게가 몇 곳 있나'처럼 지역·업종별 점포 분포와 밀집도를 따질 때 쓴다. 상가업소번호(bizesId)로 업소를 식별하고, 시도·시군구·법정동 코드와 PNU(lnoCd)·도로명주소·좌표를 키로 행정구역 통계, 토지·건물 정보, 인허가 데이터와 이어 쓴다.
description_portal: '안녕하십니까.소상공인시장진흥공단입니다.공공데이터포털(data.go.kr)을 통해서 개방 중인 소상공인시장진흥공단_상가(상권)정보 데이터 안내드립니다.1. 데이터 출처 : 국세청/카드사2. 업종 분류 1) (상권업종분류) 표준산업분류 기반 업종분류 2) (업종분류 체계) 대분류(10개), 중분류(75개), 소분류(247개) 3) (업종코드) 대분류(2자리), 중분류(4자리), 소분류(6자리) * 표준산업분류(10차)  -표준산업분류는 업종분류 정제에 따라 상권업종분류 연계표와 상이할 수 있습니다.   예시) 표준산업분류(제조업 - 떡류 제조업)  vs  상권업종분류(음식점업 - 떡/한과)3. 제공방식 1) 구분자 : 콤마(,) 2) 인코딩 : utf-8 4 주요 제공항목  상가업소번호, 상호명, 주소, 상권업종명, 표준산업분류명, 경도, 위도 등 URL: https://bigdata.sbiz.or.kr/#/notice/384818589907726336'
