summary_user: 경상남도 내 노동조합 설립신고 현황을 조합 한 곳당 한 행으로 담은 파일로, 조합명·조합 형태·주사무소 도로명주소·전화번호·설립일·소속 연합단체·조합원수를 담는다. 노무 담당자나 연구자가 경남 지역에 어떤 노동조합이 있고 어느 상급단체에 속하며 조합원 규모가 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 조합명·소속연합단체명 같은 이름 매칭이나 도로명주소(소재지도로명주소)를 통한 지역 연결로만 이어 쓰며, 전국노동조합표준데이터의 조합 단위 원장과 나란히 비교하는 용도가 맞다.
description_portal: 경상남도 내 노동조합 설립신고 현황으로, 행정관청명, 노동조합명, 주사무소 소재지, 설립일, 전화번호, 조합원수, 상급단체 등에 대한 정보를 제공합니다.※ 전화번호 항목은 보유한 데이터만 기재, 미제출 사유1 항목은 해당사항이 있는 경우만 기재되었음을 안내 드립니다.
