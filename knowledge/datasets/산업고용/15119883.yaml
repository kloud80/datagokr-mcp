description_portal: 이 데이터는 산재보험 개별실적요율제도의 적용 현황을 사업 종류별(업종)로 집계한 통계 자료입니다. 개별실적요율제도는 재해 방지 노력을 기울인 사업주와의 형평성을 위해, 당해 사업장의 보험료 대비 보험급여액 비율이 일정 기준에 해당할 경우 산재보험료율을 인상 또는 인하하는 제도입니다. 통계 항목으로는 징수 대상 사업장 수, 개별실적요율 적용 사업장 수, 적용 비율, 그리고 요율이 인상, 인하, 또는 불변으로 조정된 사업장 수와 최고/최저 요율 정보를 제공합니다. 이 자료는 각 산업 분야에서 사업주의 안전 관리 노력과 그에 따른 보험료율 차등 적용 실태를 투명하게 보여주는 핵심 지표라고 판단됩니다.본 데이터는 산업 안전 투자와 보험료율 간의 관계를 분석하고, 개별실적요율제도의 실효성을 평가하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 산업에서 요율이 인상된 사업장 수를 분석함으로써, 해당 업종의 산업 안전 관리 수준이 미흡한 사업장 비율을 파악하고 집중적인 안전 관리를 유도할 수 있습니다. 또한, 최고/최저 요율의 격차와 조정 비율을 분석하여 사업주의 재해 예방 투자 유인을 높일 수 있는 요율 제도의 적정성을 검토하고, 제도의 운영 효율성을 개선하는 데 기여할 수 있다고 판단됩니다.
