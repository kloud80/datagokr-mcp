description_portal: 본 데이터는 중국의 월간 PNG(Pipeline Natural Gas, 파이프라인 천연가스) 수입단가를 산출하여 제공하는 정보입니다. 중국 관세청에서 매월 업데이트하는 PNG 수입량과 수입대금 공식 자료를 기반으로 중국의 월간 PNG 수입단가를 체계적으로 산출하였습니다. 데이터 구성 항목으로는 연월일, 물량(Ton), 수입대금(1000달러), 단가(MMBtu당달러) 등 PNG 수입의 핵심 지표가 포함됩니다. 본 데이터를 활용하면 중국의 파이프라인 천연가스 수입 동향과 가격 추이를 상세히 분석할 수 있습니다. 특히 LNG와 PNG 간 가격 비교 분석, 아시아 천연가스 시장 전반의 동향 파악, 한중 에너지 협력 관련 연구, 국내 에너지 수급 정책 수립 시 참고자료로 활용할 수 있으며, 천연가스 도입 다변화 전략 수립과 에너지 안보 정책 연구, 국제 가스 시장 분석에도 유용한 기초자료가 됩니다.
