summary_user: 제주특별자치도 내 주유소의 휘발유·경유 등 유종별 판매 가격을 연도 단위로 집계한 자료로, 포털 설명상 2000년부터 2020년까지 도내 전체 주유소 가격의 산술평균(원/리터)을 담는다. 분석가나 정책 담당자가 '지난 20년간 제주 휘발유·경유 가격이 어떻게 변했고, 운송·관광·농어업의 연료비 부담은 얼마나 늘었나' 같은 장기 추세를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 유가·물가 통계와는 연도와 유종 이름(제품 구분)을 맞춰 연결한다.
description_portal: 이 데이터셋은 제주특별자치도 내 주유소의 연간 평균 판매 가격 정보를 정리한 공공데이터로, 2000년부터 2020년까지 연도별로 집계된 휘발유, 경유 등 주요 유종의 평균 판매 가격을 제공한다. 평균가격은 도내 모든 주유소의 개별 가격을 합산한 뒤 전체 주유소 수로 나눈 산술평균값이다. 이 자료는 제주 지역 유류비의 장기적 흐름을 분석하고, 생활비 변화, 운송비·물류비용 산정, 농어업 및 관광업 등 연료 의존 산업의 비용 구조 분석, 연료비 보조 정책 설계, 에너지 소비 동향 분석, 지역경제 여건 비교, 유류 가격 안정성 및 소비자 부담 변화 추적 등 다양한 행정·연구 목적으로 유용한 기초 통계 자료로 활용될 수 있다.
