summary_user: 밀양시 관내 신재생에너지 전기사업 발전소를 한 곳씩 담은 허가 원장으로, 발전소명·용량·설치장소·최초허가일·사업개시일을 담는다(포털 CSV 약 14만 바이트). 지역 주민이나 에너지 분석가가 '밀양시 어느 지역에 태양광 등 발전소가 언제 허가되어 얼마나 들어섰나'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 시군의 신재생 발전 허가 현황이나 태양광 발전사업 허가 표준 데이터와는 발전소명·설치장소 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 발전소를 다른 데이터와 묶을 고유 식별 코드가 없어 이름·주소 매칭에 의존해야 한다. 범위는 밀양시 한 곳이며 발전량이나 실제 가동 실적은 담지 않는다.
