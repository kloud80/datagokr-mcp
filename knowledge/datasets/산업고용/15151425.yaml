description_portal: '한국지역난방공사 ‘경영공시 목록정보’는 기관운영·ESG운영·경영성과·대내외평가 등 공시분야별로 개별 공시항목의 명칭, 담당부서, 공시주기, 공시방법(ALIO/공사)을 표준화해 정리한 메타데이터입니다. 어떤 항목을 누구(어느 부서)가 언제(주기·도래시점)에 어떤 채널로 공개해야 하는지를 한눈에 파악할 수 있어 공시 캘린더 구축, 준법·투명경영 관리, 외부평가 대응의 기반 자료로 바로 활용할 수 있습니다.1. 형식: CSV2. 내용 요약:■ 공시분야코드: 공시 항목의 분류(예시: 기관운영, ESG 운영, 경영성과, 대내외 평가 등)■ 경영공시명: 공개 대상 항목명(예시: 일반현황, 임직원수, 정관 및 내부규정, 공개입찰)■ 공시부서명: 소관 책임부서(복수 표기 가능)(예시: 기획처 기획부, 경영지원처 인사부, 감사실 감사운영부)■ 공시주기: 공개 주기·시점(예시: 수시공시, 연4회(분기), 매년 4월, 자료변동시)■ 공시방법: 공개 채널 구분(예시: ALIO, 공사)3. 활용 예제:■ 공시 캘린더·알림: 공시주기 기준 도래 예정 항목 자동 추출·알림으로 마감 누락 방지■ 책임부서 매핑·성과관리: 공시부서별 항목·마감 현황 대시보드로 제출율·지연 사유 관리■ 외부평가·준법 대응: ALIO/공사 채널별 공개 현황 비교로 투명성 제고 및 점검 자료 신속 준비'
