summary_user: "한국지역난방공사가 운영하는 RPS(신재생에너지 공급의무화) 태양광 발전소별로 연도, 설비용량(kWp), 사업구분(예: 발전차액지원), 추적 형식(고정·단축·양축), 연간 발전량을 담은 소규모 파일(csv 약 10KB)이다. 에너지 분석가나 연구자가 '이 공기업 태양광 설비는 형식별·연도별로 용량 대비 발전량이 얼마나 되나' 같은 설비 효율 비교에 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 등과는 발전소 이름(구분)을 맞추는 방식으로만 이어 쓴다."
limits: 표준 코드나 주소 같은 조인 키가 없어 다른 발전소 원장과 자동 연결되지 않고 이름 매칭에 의존해야 한다. 한 기관 소유 설비만 담고 있어 전국 태양광 현황을 대표하지 않으며, 용량·발전량이 문자형이고 단위가 별도 컬럼(용량단위·발전량단위)에 있으니 계산 전에 단위를 확인해야 한다.
