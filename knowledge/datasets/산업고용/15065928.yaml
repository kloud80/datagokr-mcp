summary_user: 한국가스공사가 통계청 시군 단위 기온을 주요 5개 광역시의 도시가스 공급량으로 가중평균해 만든 전국 단일 기온을 월 단위로 담은 집계 파일이다(일자, 가중평균 기온 2개 항목, 약 4KB 규모 CSV). 에너지 분석가나 도시가스 사업자가 "기온이 1도 내려가면 도시가스 판매량이 얼마나 늘어나는가" 같은 기온-수요 상관관계나 수요예측 모델을 만들 때 쓴다. 전역 조인 키나 지역 코드는 없어서, 같은 기관의 월별 도시가스 판매량 자료 등과 일자(연월)를 맞춰 이어 쓴다.
