description_portal: 한국가스공사의 월간 도시가스 판매량 가중평균 전국 기온 데이터 입니다.도시가스 수요예측에 적합한 기온 데이터 제공 및 수요분석 지원, 기온-수요 상관관계 분석을 목적으로 수집되었습니다. 데이터 구성항목은 일자와 도시가스 총 판매량 기준 전국 가중평균 기온으로 이루어져 있습니다. 통계청 시군 단위 기온데이터를 주요 5개 광역시의 도시가스 공급량으로 가중평균하여 산출한 데이터입니다.본 데이터를 활용하면 기온과 도시가스 수요의 상관관계 분석, 수요예측 모델 개발, 계절별 수요 패턴 분석, 기온 변화에 따른 판매량 변동 예측, 이상기온시 수요 영향 분석이 가능합니다. 또한 공급계획 수립, 피크 수요 예측, 요금정책 수립, 수급 안정성 분석에 활용됩니다. 도시가스 수요예측의 정확도 향상에 기초자료로 활용되어 안정적인 천연가스 수급 관리를 지원합니다.
