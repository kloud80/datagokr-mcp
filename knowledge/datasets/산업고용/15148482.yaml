description_portal: '인천광역시 강화군 관내 통신판매업 현황 데이터입니다.본 데이터에는 연번, 업체명, 사업자등록번호, 대표자명, 소재지주소(도로명주소), 신고일자, 업종(상품군) 정보가 포함되어 있으며,개인정보 보호를 위해 휴대폰번호는 제외하였고 대표자명, 상세주소의 경우 마스킹 처리하였습니다.※ 사업자등록번호는 강화군에서 보유하지 않은 경우 공란으로 표시되었습니다.해당 데이터는 통신판매업 현황 파악, 온라인 유통 구조 분석, 지역 상권 및 산업정책 수립 등 다양한 행정 및 연구 목적의 기초자료로 활용할 수 있습니다.데이터와 관련된 추가 문의사항은 데이터 제공부서로 연락주시기 바랍니다.○ 제공부서 : 일자리경제과 지역경제팀'
