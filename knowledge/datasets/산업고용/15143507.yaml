description_portal: 지속 가능한 경제 성장과 일자리 양극화 해소를 위한 인적 자원의 효율적 배분과 고용 및 인적자원개발 정책에 대해 요구사항이 증대되는 바 향후 10년 동안 지속적인 경제 성장을 뒷받침해 줄 인구 및 취업자수를 전망하여 미래에 노동공급 및 노동수요가 안정적으로 유지될 것인가에 대한 가이드라인을 제시합니다.  지속가능한 경제성장에 필요한 국가 인적자원의 양성과 효율적 배분을 위한 기초자료를 제공합니다. 광역지역(17개 시도 및 전국)별, 남녀성별로 구분하여 2012년도부터 2032년도까지의 생상가능인구수, 경제활동인구수 항목이 포함되어 있는 인력수급 전망 자료입니다.
