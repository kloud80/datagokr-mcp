description_portal: '한국산업기술진흥원에서 주관하는 신뢰성 바우처 사업은 소재부품장비의 글로벌 경쟁력을 강화하기 위한 목적을 가지고 있습니다. 이 사업은 중소기업 및 중견기업이 연구개발기관의 인프라(인력, 장비 등)를 활용하여 자신의 제품의 신뢰성과 소재 성능을 향상하는 데 필요한 지원을 제공합니다. 이러한 바우처 사업의 공고 내용은 기업들이 적합한 지원을 받을 수 있도록 돕기 위한 중요한 정보를 담고 있습니다. 특히, 해당 데이터는 중소기업이 연구개발을 통해 기술력 향상과 경쟁력 강화를 위한 필수적인 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.연도(숫자형): 사업이 시행된 연도구분(문자형): 사업의 형태를 구분공고명(문자형): 구체적인 공고의 이름사업기간 시작일(문자형): 사업의 시작일사업기간 종료일(문자형): 사업의 종료일신청 시작일(문자형): 지원 신청의 시작일신청 종료일(문자형): 지원 신청의 종료일평가 및 선정 시작일(문자형): 참여 기업의 평가 및 선정 시작일평가 및 선정 종료일(문자형): 평가 및 선정의 종료일예산(지원규모)(숫자형): 지원을 위해 책정된 예산중견기업 부담금 비율(숫자형): 중견기업이 부담하는 비용의 비율중소기업 및 부담금 비율(숫자형): 중소기업이 부담하는 비용의 비율대기업 분담금 비율(숫자형): 대기업의 부담금 비율상담신청 시작일(문자형): 상담 신청의 시작일상담신청 종료일(문자형): 상담 신청의 종료일'
