description_portal: '한국지역난방공사 ‘열수송 분야 보수 내역(2024-12-28)’은 지사별 열수송 설비의 보수 완료 기록을 표준화해 수록한 데이터로, 설비대분류(배관·밸브·감시·구조물 등)와 설비소분류(직관·볼밸브·테스트포인트 등), 공사명, 보수완료일, 보수책임(한난·하자·제3자 등)을 포함합니다. 현장별 보수 이력과 시기, 책임 주체를 빠르게 파악해 반복 고장 유형 진단, 계획정비·자재 수급, 공급중단 리스크 관리 등 열수송 유지관리 의사결정에 직접 활용할 수 있습니다.1. 형식: CSV2. 내용 요약:■ 지사명: 보수가 수행된 지사 명칭(예시: 분당, 고양, 강남)■ 설비대분류: 보수 대상 설비의 상위 분류(예시: 배관, 밸브, 감시, 구조물)■ 설비소분류: 상세 부위·부품 유형(예시: 직관, 볼밸브, 테스트포인트, 티이)■ 공사명: 해당 보수의 공사 명칭 또는 사업명(예시: 2024년 ○○지사 열수송시설 유지보수공사)■ 보수완료일: 보수 작업의 실제 완료일(YYYY-MM-DD)(예시: 2024-12-28)■ 보수책임: 비용·책임 주체 구분(예시: 한난, 하자, 제3자, 미확인)3. 활용 예제:■ 반복 고장 진단: 설비분류·소분류별 빈도 분석으로 취약 부위 선별■ 계획·자재 최적화: 보수완료일 추세로 월간 물량·인력·자재 배치 계획 수립■ 리스크 커뮤니케이션: 장기·고빈도 보수 지점을 지도화해 공지·민원 대응 개선'
