description_portal: 한국디자인진흥원 공식 홈페이지 ‘사업부 전체소식’ 게시판에 게시된 정보를 공공데이터로 제공합니다. 본 데이터는 2024년 7월 29일을 기준으로 수집된 내용을 포함하고 있으며, 이후 게시물은 포함되지 않습니다. 게시판에는 학생, 일반 국민, 기업 등을 대상으로 한 각종 지원사업 공고와 교육 프로그램 안내, 성과 공유, 보도자료, 공시자료, 문화시설 휴관 공지 등 폭넓은 정보가 게시됩니다. 데이터는 게시글의 순번, 제목, 본문, 작성일, 작성자 등의 항목으로 구조화되어 제공되어, 이용자는 다양한 사업 소식을 손쉽게 검색·활용할 수 있습니다. 보다 자세한 내용은 한국디자인진흥원 사업부 소식 게시판에서 직접 확인 가능합니다. (https://kidp.or.kr/?menuno=1202)
