summary_user: 에너지이용 합리화법에 따라 지정된 에너지진단 전문기관의 목록을 기관 한 곳당 한 행으로 담은 파일로, 지정번호·기관명·지정구분·지정일·주소를 전국 범위로 제공한다. 에너지다소비사업자나 건물 소유자가 '우리 지역에서 에너지진단을 맡길 수 있는 지정기관은 어디인가'를 확인하거나, 분석가가 지정 시기별·지역별 진단기관 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명이나 주소(지역)를 기준으로 맞춰 이어야 하며, 주소를 지역 단위로 바꾸면 지역별 에너지 사용량 자료와 나란히 볼 수 있다.
description_portal: 본 데이터는 에너지이용 합리화법 제32조에 의거하여 산업통상자원부장관으로부터 지정을 받은 에너지진단 전문기관(진단기관)의 현황을 제공합니다. 에너지진단은 에너지다소비사업자의 에너지 절약 및 효율 향상을 위해 필수적인 과정으로, 전문성과 객관성을 갖춘 기관에 의해 수행되어야 합니다. 이 데이터는 이러한 진단 업무를 수행할 수 있는 공인된 기관의 정보를 투명하게 공개함으로써, 에너지 진단을 필요로 하는 기업 및 건물 소유자들이 신뢰할 수 있는 전문기관을 쉽게 선택하고 활용할 수 있도록 돕는 데 그 목적이 있습니다. 또한, 정부는 이 데이터를 활용하여 에너지 진단 시장의 동향을 파악하고, 관련 정책 수립 및 제도 개선의 기초 자료로 활용할 수 있습니다.전문기관의 지정번호, 지정일, 지정 구분 등의 항목을 제공합니다.
