summary_user: 충청남도 태안군 안의 태양광발전시설을 발전소 한 곳씩 담은 원장으로, 발전소명·설비용량·발전소주소·최초허가일·사업개시일을 담는다(약 33KB CSV 파일). 태안군 안에서 어느 지역에 얼마만큼의 태양광 설비가 언제 허가되고 가동을 시작했는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 발전소명이나 주소를 기준으로 전국태양광발전소전기사업허가정보 표준데이터 등과 맞춰 이어 쓴다.
limits: 표준 코드나 고유 식별자가 없어 다른 데이터와 붙일 때는 발전소명·주소 문자열 매칭에 의존해야 한다. 범위는 태안군 한 곳의 개별 시설에 한정되며 발전량 실적은 담지 않는다.
