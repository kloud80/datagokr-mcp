summary_user: 대구광역시 서구 관내에 등록된 대부업·대부중개업 사업장을 한 곳씩 담은 목록으로, 등록 업종(등록신청사업), 등록증번호, 상호, 도로명 소재지를 담는다(csv 약 3KB의 작은 파일). 시민이 거래하려는 대부업체가 서구에 정식 등록된 업체인지 상호와 등록증번호로 확인하거나, 분석가가 서구 안 대부업소의 분포를 살펴보는 데 쓴다. 실측 컬럼에는 사업자번호나 표준 코드 같은 공통 조인 키가 없어서, 다른 데이터와는 상호·도로명 주소를 맞추거나 시군구명으로 지방행정 인허가(LOCALDATA) 대부업 자료 등과 이어 쓴다.
description_portal: 대구광역시 서구 대부업 현황 데이터입니다. 서구내 대부업 등록신청사업, 등록증번호, 상호, 소재지 데이터입니다.본 데이터는 대구광역시 서구 관내에서 등록된 대부업 및 대부중개업 사업장의 현황을 상세히 수록한 자료이다. 각 사업장의 등록증 번호, 상호명, 그리고 도로명 주소를 포함하여 사업장의 위치와 등록 상태를 명확히 파악할 수 있도록 구성하였다. 이를 통해 지역 내 대부업 관련 사업장 분포 현황을 효율적으로 분석할 수 있으며, 관련 행정 및 민원 업무의 투명성 제고에 기여한다. 본 데이터는 대부업 및 중개업의 공정한 영업 환경 조성과 시민의 알 권리 보장을 목적으로 제공된다. 해당 정보를 활용하여 정책 수립 및 산업 동향 파악에 활용할 수 있다.
