summary_user: 경기도 기업SOS넷으로 접수·처리한 기업 애로 상담 건수를 시군별로 집계해, 공장설립·자금지원·판로수출·인사노무·특허·불공정거래 등 지원 분야별 처리 건수와 전체 합계를 담은 자료다. 정책 담당자나 분석가가 "어느 시군에서 어떤 분야의 기업 애로가 많이 접수됐나"를 비교하고, 지역별 기업 지원 수요를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(locplc_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도에서 운영하는 기업SOS넷을 통해 기업의 애로사항을 접수 및 처리한 현황을 시군별로 정리한 자료입니다. 주요 항목은 소재지명(시군), 전체 합계, 공장설립, 주변인프라, 창업벤처, 자금지원, 판로수출, 기술인증, 세무회계, 인력교육, 인사노무, 마케팅, 법률, 특허, 불공정거래, 지원사업, 기타 등으로 구성되어 있으며, 기업이 요청한 지원 분야별 상담 처리 건수를 나타냅니다. 이 자료는 지역별 기업 수요 분석, 행정 지원 성과 평가, 향후 정책 수립 및 지원 전략 마련에 활용됩니다. 각 항목은 실제 처리된 상담 건수를 기준으로 하며, 기업지원 서비스의 접근성과 효과성을 확인하는 지표로도 사용됩니다.
