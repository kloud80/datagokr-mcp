summary_user: 한국가스공사가 전국 단위로 집계한 발전용 천연가스(LNG)의 일별 공급량(톤)을 담은 CSV 파일로, 지역 구분 없이 전국 합계를 날짜별로 제공한다. 에너지 분석가나 사업자가 계절·월에 따라 발전용 가스 수요가 어떻게 변하는지, 예컨대 겨울철 공급량이 여름보다 얼마나 늘어나는지를 확인하는 데 쓴다. 실측 컬럼(구분·날짜·공급량)에 전역 조인 키가 없어 다른 데이터와는 날짜 기준으로 맞추거나 같은 기관 자료와 이름으로 대조해 이어 쓴다.
description_portal: 한국가스공사가 제공하는 일일 전국 발전용 천연가스 공급 실적 자료입니다. 이를 통해 계절별, 월별 발전용 천연가스 수요 패턴을 파악할 수 있습니다. 일 단위로 집계된 발전용 공급량 데이터를 통해 에너지 소비 패턴, 수요 변동 파악 등에 활용할 수 있습니다. 해당 데이터는 일별 전국 발전용 천연가스(LNG) 공급량을 나타낸 자료이며, 데이터의 단위는 톤(ton)입니다. 공공데이터 공개 대상 자료는 2021년도 1월부터 현재까지의 기간동안 한국가스공사 일일 전국 발전용 천연가스(LNG) 공급량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 데이터의 파일 형식은 csv 파일입니다. 집계된 일일 발전용 천연가스 공급량 이며 판매물량 정산 등에 의해 수치는 변동이 있을수 있습니다.
