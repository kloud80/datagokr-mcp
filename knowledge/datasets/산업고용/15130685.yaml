summary_user: 경기도 시군별 일자리센터의 연도별 고용지원 실적을 집계한 자료로, 기준연도·시군명별로 구인등록 건수, 구직등록 건수, 취업자 수, 일자리 알선 건수를 담는다. 지역 고용정책 분석가나 시군 담당자가 "우리 시군 일자리센터의 알선 대비 취업 성과가 다른 시군보다 높은가" 같은 시군 간 비교와 연도별 추이 확인에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명(sigun_nm)과 기준연도를 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 각 시군에서 운영 중인 일자리센터의 연도별 고용지원 실적을 집계한 자료로, 구인등록수(건), 구직등록수(건), 취업자수(명), 일자리알선수(건) 등으로 구성되어 있습니다. ‘구인등록수’는 구인 기업이 일자리센터에 등록한 채용 건수를 의미하며, ‘구직등록수’는 구직자가 일자리를 찾기 위해 등록한 건수입니다. ‘취업자수’는 실제 취업에 성공한 인원 수, ‘일자리알선수’는 일자리센터가 기업과 구직자 간 매칭을 시도한 건수를 나타냅니다. 본 자료는 연 단위로 제공되며, 시군 단위의 고용서비스 성과를 정량적으로 비교하거나, 지역 간 취업지원 효과 분석, 고용환경 변화 모니터링, 정책 수립 및 효과 측정 등의 활용이 가능합니다.
