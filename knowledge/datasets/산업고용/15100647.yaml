summary_user: 에너지소비효율 등급표시 제도 대상 품목의 모델명·제품 단위 상세 정보를 API로 담은 원장 데이터이며, 효율은 1등급(최고)부터 5등급(최저)으로 구분된다. 소비자가 가전·사무기기를 살 때 어떤 모델이 에너지 효율이 높은지 확인하거나, 분석가가 제품별 효율등급 분포를 살피는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 제품명·코드 매핑이나 같은 기관(한국에너지공단) 코드로만 이어 쓴다.
description_portal: 본 데이터는 「에너지이용 합리화법」에 따라 도입된 '에너지소비효율 등급표시 제도'의 대상 품목에 대한 상세 정보를 제공합니다. 이 제도는 전력 소비가 많고 보급률이 높은 가전제품 및 사무기기 등을 대상으로, 제품의 에너지 소비 효율을 1등급(최고 효율)부터 5등급(최저 효율)까지 구분하여 라벨로 표시하도록 의무화하는 정부의 대표적인 에너지 관리 정책입니다. 또한, 5등급 기준 미달 제품에 대해서는 생산 및 판매를 금지하는 최저소비효율기준(MEPS)을 적용합니다.이 데이터셋의 주된 목적은 소비자들이 에너지 효율이 높은 제품을 쉽게 식별하고 구매할 수 있도록 투명한 정보를 제공하여 현명한 소비를 유도하는 것입니다. 이를 통해 제조(수입)업체는 원천적으로 에너지 절약형 제품을 생산 및 판매하도록 유도받고, 국가 전체의 에너지 소비를 절감하며, 온실가스 배출량을 줄이는 데 기여합니다. 궁극적으로는 가계의 전기 요금 부담을 경감하고 지속 가능한 에너지 소비를 촉진하는 데 목적이 있습니다.
