summary_user: 부산광역시가 지역 일자리 창출에 기여한 중소·중견기업을 선정해 인증한 고용 우수기업 목록을 기업 한 곳당 한 행으로 담은 파일(약 6KB CSV)로, 기업명·주업종·도로명주소·위도·경도·인증연도가 들어 있다. 구직자나 지역 분석가가 "부산에서 고용 우수기업으로 인증받은 회사는 어디이고 어느 업종·지역에 몰려 있나"를 확인하거나 지도에 표시할 때 쓴다. 사업자등록번호 같은 공통 조인 키가 없어 다른 기업 인증·현황 데이터와는 기업명이나 주소 매칭으로만 이어 쓰고, 위도·경도로 상권·지역 데이터와 공간 결합에 쓴다.
description_portal: 부산광역시는 지역 내 양질의 일자리 창출에 기여한 중소·중견기업을 대상으로 매년 ‘고용 우수기업’을 선정하여 인증하고 있다. 인증 기업에 대해서는 기업명, 주업종, 도로명 주소, 위도, 경도, 인증연도 등의 정보가 포함된 데이터가 제공되며, 인증일로부터 3년간 그 효력이 유지된다. 인증을 받은 기업은 부산시로부터 인증서와 현판을 수여받고, 근로환경 개선을 위한 최대 4,000만 원의 보조금, 신규 사업용 부동산 취득세 면제, 지방세 세무조사 유예, 신용보증 수수료 감면 등의 행정적·재정적 혜택을 받을 수 있다. 이 제도는 기업의 고용 안정성과 지역경제 활성화를 동시에 도모하는 정책으로 평가된다.
