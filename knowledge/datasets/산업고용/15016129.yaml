description_portal: 경기도 군포시 관내 착한가격업소 현황으로 연번, 업종, 업소명, 소재지(도로명), 전화번호, 데이터기준일자 항목을 제공합니다. ※ 착한가격업소는 저렴한 가격으로 질 높은 서비스를 제공하고 위생적인 면까지 고려된 업소들로 매년 담당자가 업소를 방문하여 점검착한가격업소 저희 군포시의 지정기준은 ① 가격수준이 지역의 평균가격 미만이고 가격안정노력으로 최근 1년 간 가격 인하 또는 동결 여부, 물가대비 낮은 수준의 가격 인상 여부 등을 판단하며 ② 영업장(주방, 매장, 화장실 등) 위생, 청결도와 종사자 친절도 등과 ③ 봉사활동, 사회적 약자 배려, 정부시책(옥외가격 표시제 및 원산지 표시제) 이행 여부, 표창 여부 등을 종합적으로 판단하여 선정합니다. 그리고 이를 위해 담당 공무원이 가격 및 서비스 수준, 원산지 표시이행 여부 등 착한가격업소 적격 여부를 심사하게 됩니다. 그런데 만약 지역의 평균가격을 초과하는 업소이거나 최근 2년 이내 행정처분이 있는 경우 신청할 수 없습니다. 뿐만아니라 최근 1년 이내 휴업한 사실이 있거나 지방세를 3회 이상 및 100만 원 이상 체납하고 있는 업소(신청일 기준) 또는 영업 개시 후 6개월이 경과하지 않은 업소 이거나 프랜차이즈 업소는 전국 / 지역단위 불문 선정에서 배제되오니 참고하시면 좋을듯 합니다.
