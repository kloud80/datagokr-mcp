description_portal: '산업, 가정/상업, 교통, 공공 등 주요 부문별 연도별 에너지 사용량 추이를 수록한 자료로, 국가의 에너지 소비 구조 및 변화를 한눈에 파악할 수 있도록 구성되어 있습니다.1. 형식: 웹 페이지 내 조회 및 XLSX (엑셀)2. 내용 요약■ 부문: 산업, 가정/상업, 교통, 공공/기타, 합계■ 1990~2022년: 연도별 에너지 소비량(단위: 1,000 TOE)3. 활용 예제■ 에너지 정책 수립 및 부문별 절감 대책 마련을 위한 기초자료로 활용■ 학계 및 연구기관에서 탄소배출량 추정, 부문별 온실가스 영향도 분석 시 활용■ 산업계에서 특정 부문의 에너지 효율화 전략 수립 및 에너지 수요 예측에 활용'
