description_portal: 한국남동발전의 시간대별 풍력 발전실적입니다.군위 화산풍력, 삼천포풍력, 어음풍력, 영흥 풍력 등의 지역에서 발전한 풍력 발전량 데이터입니다. 풍력발전소별로 매시간 생산되는 발전량(MWh)을 구체적인 수치로 제공합니다.시간대별 발전량(MWh) 뿐만아니라 일별 발전 총량(KW), 평균값(KW), 최대값, 최소값 등의 데이터를 포함하고 있으며, 데이터를 활용하여 날씨와 계절 등 외부 요인에 따른 풍력 발전의 변동성과 패턴을 분석할 수 있습니다.* 시간대별 상세데이터는 엑셀 또는 CSV파일로 다운로드 가능합니다.* 최대 1개월 단위로 조회 가능합니다.
