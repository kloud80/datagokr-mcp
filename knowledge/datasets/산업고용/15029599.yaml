summary_user: 부산광역시 서구 관내에서 영업 중인 담배소매인을 업소 한 곳당 한 행으로 담은 지정 현황 파일로, 지정번호·소매인 구분·상호·도로명주소·지정일자를 포함한다. 서구에서 담배를 팔 수 있는 지정 업소가 어디에 있는지, 특정 업소가 언제 지정됐는지 확인하려는 주민·예비 창업자·행정 담당자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명주소(업소도로명주소)나 상호를 매칭해 붙이며, 지방행정 인허가(LOCALDATA)의 담배소매업 원장이나 상가업소 정보와 주소 기준으로 대조하는 방식으로 이어 쓴다.
description_portal: 부산광역시 서구 담배소매인 지정현황은 서구 관내에서 정상적으로 영업 중인 담배소매인의 지정 정보를 한눈에 확인할 수 있도록 제공하는 자료입니다. 이 자료에는 각 담배소매인의 지정번호, 업소명, 소매인 구분, 소재지 주소, 지정일자, 대표자명 등 기본 정보가 포함되어 있어, 관내 담배소매 현황을 파악하거나 관련 업무에 참고할 수 있습니다. 이러한 지정 현황은 「담배사업법」에 근거하여 관리·운영되며, 법령에 따라 지정된 업소만이 담배를 합법적으로 판매할 수 있습니다. 해당 정보는 지역 주민과 행정기관이 담배 판매업 현황을 정확히 인지하고, 공정한 유통질서 및 합법적 영업 환경을 유지하는 데 활용됩니다.
