summary_user: 인천 남동구 관내 공공시설에 설치된 태양광 발전 설비를 시설 단위로 한 줄씩 담은 원장 파일(약 5KB CSV)로, 설치장소명·도로명주소·설치연도·발전유형·설비용량·위경도를 포함한다. 남동구의 에너지·탄소중립 담당자나 분석가가 "구 공공시설 중 어디에 언제 몇 kW 규모의 태양광이 들어갔나"를 지도로 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소·좌표나 시설명으로 전국태양광발전소전기사업허가정보 표준데이터 등과 맞춰 이어 쓴다.
description_portal: 이 데이터는 관내 공공시설을 대상으로 추진된 신재생에너지 보급 사업 중 태양광 발전 설비 설치 현황을 정리한 자료입니다. 포함된 항목으로는 시설명, 도로명 기준 주소, 시공 연도, 에너지 생산 방식, 장비 용량, 위·경도 좌표, 기준일 등이 있으며, 이를 통해 태양광 인프라의 공간적 분포와 기술적 특성을 확인할 수 있습니다. 해당 정보는 친환경 에너지 전환 정책 수립, 온실가스 감축 전략, 에너지 자립도 향상 등에 유용하게 활용될 수 있으며, 향후에는 스마트 에너지 관리, 탄소중립 도시 구현, 지속가능한 발전 계획의 기초 자료로서 그 중요성이 더욱 커질 전망입니다.
