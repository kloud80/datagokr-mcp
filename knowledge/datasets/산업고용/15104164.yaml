summary_user: 인천 부평구 소재 청년창업기업을 기업 한 곳당 한 행으로 정리한 파일(csv, 약 8KB)로, 기업명·업종 분류·기업소개·대표 제품/서비스·소재지 주소·연락처를 담는다. 부평구에서 어떤 업종의 청년창업기업이 어디에 모여 있고 무엇을 만드는지 알고 싶은 창업지원 담당자나 협업처를 찾는 사업자가 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 기업명이나 소재지 주소를 맞춰 이어야 한다.
description_portal: '청년창업기업의 기업명, 업종 분류, 주요 제품 및 서비스, 소재지, 연락처 등을 정리한 자료.창의적인 아이디어 기반의 청년 기업 현황을 파악하고, 지역 내 창업 생태계 분석, 맞춤형 창업 지원정책 수립 등에 활용됨.활용 목적 및 특징– 청년창업기업의 업종 분포 및 사업 아이템 유형 분석– 기업소개 및 대표 제품·서비스 정보 제공으로 사업역량 파악– 소재지 기반으로 창업 클러스터 및 입지특성 분석 가능– 창업지원센터, 투자기관 등과의 연계를 통한 정책지원 활용주요 항목 설명● 기업명: 등록된 청년창업기업의 명칭● 분류: 기업의 업종 또는 사업 분야 분류● 기업소개: 기업의 설립 취지, 운영 내용, 비전 등 간략 소개● 대표제품_서비스: 주요 상품 또는 핵심 서비스 항목● 소재지: 기업이 위치한 주소 정보● 연락처: 기업 문의를 위한 전화번호 또는 이메일 등 연락 수단'
