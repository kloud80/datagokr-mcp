description_portal: 노사발전재단 홈페이지에 게시된 사업 리플렛 자료를 수집하여 제공하는 공공데이터입니다.리플렛의 카테고리, 제목, 작성부서, 작성일자, 첨부파일 수, 조회수 등 기본 정보를 포함하고 있으며, 각 홍보자료의 분류 및 관리 항목이 체계적으로 정리되어 제공됩니다.ㅇ 재단의 다양한 사업(중장년일자리, 전직지원, 통합홍보 등)에서 발간된 리플렛 정보를 포함하며, 리플렛 제목, 카테고리, 발간연도 등 주요 정보를 항목별로 구분하여 제공ㅇ 국민 누구나 기관의 사업 안내자료를 쉽게 확인할 수 있도록 노사발전재단 홈페이지를 통해 1차적으로 공개 중ㅇ 연구자, 정책기관, 민간기업 등이 재단의 사업 현황 분석, 대상자 맞춤형 서비스 제공, 통계자료 작성 등 다양한 목적으로 활용 가능ㅇ 본 데이터는 재단의 홍보·사업안내 정보의 투명성과 접근성을 제고하기 위한 자료로, 최신 리플렛 반영을 위해 지속적으로 갱신할 예정ㅇ 이를 통해 국민의 정보 접근 편의 향상뿐만 아니라 공공부문의 홍보자료 개방 확대 및 기관 신뢰도 제고에 기여할 계획임
