description_portal: 한국전력공사에서 제공하는 전국 시군구별 가구평균 전력사용량 데이터 입니다.조회는 가능하나 다운로드시에는 회원가입 및 로그인이 필요합니다.행정구역, 기간(2013년부터), 추출정보(대상가구수, 평균사용량, 평균 전기요금)를 설정하여 테이블, 그래프, 추이그래프를 제공받을 수 있습니다.데이터 이용자는 전국 시도별 가구 전력 소비 패턴을 시계열로 분석할 수 있습니다.특정 지역의 월별 평균 사용량을 파악하여 계절에 따른 전력 수요 변화를 연구하거나, 다른 지역과의 비교를 통해 지역별 전력 소비 특성을 파악할 수 있습니다.
