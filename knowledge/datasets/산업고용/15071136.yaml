description_portal: '한국산업기술진흥원 통합사업관리시스템에 등재되는 정보입니다. 이 데이터는 NTIS 지식재산권 정보로, 성과발생년도, 지식재산권 종류구분, 출원방법, 출원국, 출원구분, 출원등록일자, 출원등록기관 및 사업자등록번호, 공개여부, 사업화 활용 여부, 발명의 명칭 등을 포함합니다. 이 정보는 기업 및 연구기관에서 보유한 지식재산권 현황을 파악하고, 연구개발 성과와 사업화 가능성을 평가하는 데 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형) : 지식재산권이 발생한 연도지식재산권종류구분(문자형) : 등록된 지식재산권의 종류(특허, 실용신안 등)출원방법(문자형) : 해당 지식재산권의 출원 방식출원국(문자형) : 지식재산권이 출원된 국가출원구분(문자형) : 출원 방식의 구분(특허출원, 실용신안 출원 등)출원등록일자(숫자형) : 출원을 등록한 일자출원등록기관(문자형) : 출원을 등록한 기관사업자등록번호(숫자형) : 출원등록기관의 사업자등록번호공개여부(문자형) : 정보 공개 여부사업화 활용여부(문자형) : 사업화가 이루어졌는지 여부발명의명칭(문자형) : 발명의 이름'
