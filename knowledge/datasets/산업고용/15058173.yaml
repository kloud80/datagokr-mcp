summary_user: 경기도 시군별 어르신 자립형 일자리 모집 공고를 한 행에 한 건씩 담은 건별 자료로, 사업연도·시군·업체명·일자리 유형(인턴형 등)·운영기관·공고 시작/종료일·모집인원·구인상태가 들어 있다. 구직 중인 어르신이나 가족이 '우리 시군에서 지금 모집 중인 자립형 일자리가 어디고 몇 명을 뽑나'를 확인하는 데 쓰고, 분석가가 시군별 모집 규모와 운영기관 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)를 이름·코드 매핑해 다른 경기도 시군 통계와 잇는다.
description_portal: '한국노인인력개발원에서 제공하는 경기도 내의 시군별 근무사업장에서 어르신 자립형 일자리 사업에 대한 업체명, 임금(공임, 노임 등)정보, 모집인원수 등의 현황입니다. 데이터는 경기도에서 시행된 어르신 자립형 일자리사업의 운영 현황을 담고 있는 자료로, 주요 항목에는 사업연도, 시군명, 업체명, 일자리유형(예: 인턴형), 구인상태(모집중/완료), 운영기관명, 공고 시작 및 종료일자, 모집인원수, 임금정보 등이 포함되어 있습니다. 각 행은 개별 일자리 모집 공고를 나타내며, 운영기관은 고양상공회의소, 시니어클럽, 대한노인회 등 지역별로 다양하게 분포되어 있습니다. 이 자료는 어르신의 사회참여 확대 및 경제적 자립을 위한 고용정책의 실행 현황을 분석하는 데 활용되며, 노인 고용 창출 효과 분석, 지역별 수요-공급 현황 파악, 정책 개선방향 도출에 유용한 근거 자료가 됩니다. ‘인턴형’과 같은 일자리 유형 구분을 통해 다양한 고용 형태의 실태도 파악할 수 있으며, 임금정보는 대부분 ‘기관문의’로 기재되어 있어 실제 분석 시 주의가 필요합니다. 본 자료는 지방자치단체 및 복지 관련 공공기관에서 수집·관리된 공식 통계입니다.'
