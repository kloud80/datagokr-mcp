summary_user: 전북특별자치도 내 태양광 발전소를 발전소 한 곳당 한 행으로 담은 인허가·설치 원장으로, 인허가일자·사업개시일·사업자(법인·상호)명·발전소 주소·원동력 종류·설비용량(kW)을 포함한다(CSV 약 5.4MB). 분석가나 사업자가 '전북 시군별로 태양광 허가 건수와 설비용량이 연도별로 어떻게 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 자치단체코드나 지역명·주소를 행정구역 코드와 맞추거나 전국태양광발전소전기사업허가정보표준데이터와 주소·용량을 대조해 이어 쓴다.
