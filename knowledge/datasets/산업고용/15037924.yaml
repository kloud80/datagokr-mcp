summary_user: 인천 계양구 관내 주유소를 한 곳씩 담은 파일(csv, 약 3.5KB)로, 상호·주소·상표·전화번호·셀프 여부와 고급휘발유·휘발유·경유·실내등유의 리터당 가격을 담는다. 계양구 주민이 집 근처에서 휘발유가 가장 싼 셀프 주유소를 찾거나, 분석가가 상표·셀프 여부에 따라 가격이 얼마나 다른지 비교하는 데 쓴다. 주유소 ID나 좌표 같은 전역 조인 키가 없어서 오피넷 유가나 전국주유소표준 데이터와는 상호·주소를 직접 맞춰 이어야 한다.
description_portal: 본 데이터파일은 인천광역시 계양구 관내 주유소에 대한 상세 정보를 제공하는 자료입니다. 주요 항목에는 상호명, 주소, 상표(브랜드명), 전화번호, 셀프여부, 휘발유 가격, 경유 가격, 등유 가격 등이 포함되어 있으며, 이를 통해 지역 내 주유소의 위치와 가격 정보를 종합적으로 파악할 수 있습니다. 본 자료는 주민들의 합리적인 주유소 선택을 돕고, 에너지 관련 정책 수립 및 유류 가격 모니터링에 활용될 수 있습니다. 또한, 셀프 여부와 브랜드에 따른 가격 차이 분석 등 소비자와 행정기관 모두에게 유익한 정보를 제공합니다. 해당 데이터에 대한 구체적인 문의는 인천광역시 계양구 **지역경제과(032-450-5485)**로 연락해 주시기 바랍니다.
