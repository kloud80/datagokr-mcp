summary_user: 전력시장에 참여하는 발전기의 전력거래량을 연료원별·거래일별·거래시간별로 합산한 전국 단위 집계 파일로, 단위는 MWh이며 2023년 12월까지의 데이터를 담는다. 에너지 분석가나 연구자가 원자력·석탄·LNG·신재생 등 연료원별 시간대 거래량 비중이 어떻게 바뀌어 왔는지 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 전력 수급·SMP 데이터와는 거래일·거래시간과 연료원 이름을 맞춰 연결해야 한다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 2023년 12월 까지의 전력거래량 데이터를 업데이트해서 제공합니다.※ 주의사항해당목록은 1회성 데이터로, 이후 데이터는 "한국전력거래소_연료원별 시간대별 설비용량 및 전력거래량" 목록에서 연간 갱신하여 제공합니다.해당 목록은 추후 데이터 정비계획(중복제거)에 따라 삭제될 수 있으며, 향후 해당데이터의 확인은 "한국전력거래소_연료원별 시간대별 설비용량 및 전력거래량" 에서 참고 바랍니다.ㅇ 전력시장에 참여하는 발전기의 연료원별 일별 시간대별 전력거래량 합계 자료입니다.ㅇ 단위 : MWh* 본 데이터는 전력시장에 참여하는 발전기의 전력거래량으로, 전기사업법 시행령 제19조 1항 2호에 따라 한국전력공사와 직접 거래하는 발전기, 자가용 등은 포함하지 않습니다.   전력거래량은 소내용 및 주변압기 손실분 등을 제외한 송전단 기준 발전량이며, 수정정산 등에 의해 값이 변동될 수 있습니다.'
