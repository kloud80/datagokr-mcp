description_portal: 글로벌 혁신 규제자유특구 사업 관련하여 글로벌 혁신 규제자유특구명과 법령규제(법 조항) 목록, 고시일자에 대한 데이터 입니다.글로벌 혁신 규제자유특구는 AI, 딥테크 등 글로벌 기술 경쟁 심화에 따른 환경 변화에 신속•탄력적 대응을 위해 과감한 규제혁신 전략 추진 필요에 따라 추진된 사업입니다.해당 특구는 ①전면적 네거티브 규제특례가 적용되고 ②혁신기업의 글로벌화•해외진출을 지원하는 보다 고도화된 혁신 클러스터이며,  육성분야는 ①경제적 파급효과가 기대되고, ②역량 있는 다수의 중소기업이 존재하며, ③제도 정비가 미진한 첨단 미래기술 분야를 우선 지원하게 됩니다.
