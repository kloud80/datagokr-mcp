description_portal: 이 데이터는 근로복지공단이 최저임금 인상에 따른 사업주의 경영 부담을 완화하고 근로자의 고용 안정을 지원하기 위해 운영했던 일자리 안정자금 지원 사업과 관련하여, 근로복지공단 관할 지사와 해당 사업장을 관리하는 고용노동부 지방고용노동관서(지청) 간의 협력 및 관리 관계를 보여주는 목록 자료입니다. 통계 항목은 근로복지공단 관할 지사명과 해당 지사 관할 지역의 사업장을 관리하는 관리지청명을 매칭하여 제공합니다. 이 자료는 일자리 안정자금 사업의 원활한 운영과 행정 효율성 증진을 위해 공단과 고용노동관서 간의 업무 분장 및 협력 체계를 명확하게 보여주는 근거 정보라고 판단됩니다.본 데이터는 공공기관 간의 업무 협력 체계 분석 및 민원 서비스 안내 시스템 구축에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 지역별로 근로복지공단 지사와 고용노동부 지청 간의 관할 구역 매칭 현황을 분석함으로써, 일자리 안정자금과 같은 정부 지원 사업의 행정 절차가 효율적으로 이루어지도록 협력 체계를 점검하고 개선하는 방안을 모색할 수 있습니다. 또한, 민간 개발자는 이 정보를 활용하여 소규모 사업주나 근로자가 사업장 소재지를 기반으로 정확한 공단 관할 지사와 노동 지청을 찾을 수 있도록 돕는 민원 안내 서비스를 개발하는 데 기여할 수 있다고 판단됩니다.* 근로복지공단에서 최저임금 인상에 따른 사업주의 경영 부담을 완화하고 근로자의 고용안정을 위하여 일자리 안정자금을 지원하였으며, 2022년 6월 30일 기준으로 종료
