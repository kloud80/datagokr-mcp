summary_user: 예금보험공사의 정규직·비정규직 채용공고를 공고 한 건당 한 행으로 담은 목록 파일로, 공고명과 공고 시작일·마감일, 시작일 기준 연번만 들어 있다. 구직자나 취업 분석가가 예금보험공사가 언제, 얼마나 자주 채용공고를 냈는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고명이나 기관명으로만 맞춰 쓰며, 채용 인원·자격 같은 세부 내용은 잡알리오 공고와 공고명으로 대조해 확인한다.
