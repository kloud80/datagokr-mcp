summary_user: 인천광역시 미추홀구 관내에 등록된 옥외광고업 업체를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명주소·위도·경도를 담는다(csv 약 11KB). 주민이나 상공인이 '미추홀구 안에서 간판을 제작·설치해 줄 옥외광고업체가 어디에 있나'를 찾거나, 분석가가 구 단위 광고업체 분포를 지도에 표시할 때 쓴다. 전역 조인 키(사업자번호·기관 코드 등)가 없어 다른 데이터와는 업소명·도로명주소 문자열 매칭이나 위경도 좌표 기반 공간 결합으로만 잇는다.
description_portal: 본 데이터는 인천광역시 미추홀구 관내 옥외광고업 등록 업체 현황을 수록한 자료입니다. 데이터에는 각 업체의 업소명, 도로명주소, 위도와 경도 좌표가 포함되어 있으며, 일부 업체는 좌표 정보가 누락될 수 있습니다. 옥외광고업은 간판 제작과 설치, 각종 옥외 광고물 제작을 담당하는 업종으로 지역 내 상권 홍보와 도시 경관 형성에 중요한 역할을 합니다. 해당 자료는 행정기관이 옥외광고업체를 체계적으로 관리하고, 위생·안전 점검이나 인허가 관리 등의 행정업무를 수행하는 데 기초자료로 활용될 수 있습니다. 또한 주민과 상공인은 업소명과 주소를 통해 업체를 손쉽게 찾고 필요한 광고 서비스를 제공받을 수 있습니다. 좌표 데이터는 지도 기반 시스템과 연계하여 업체의 위치를 직관적으로 확인할 수 있어 활용성이 높습니다. 이 데이터는 정기적으로 갱신되어 최신 업체 현황을 반영하며, 지역 광고 산업의 현황을 파악하고 정책 수립 및 지원사업을 추진하는 데 중요한 기반 자료로 제공됩니다.
