summary_user: 전북특별자치도 부안군이 관리하는 옥외광고물업 인허가 업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 인허가번호·등록연월일·업소명·영업장 주소와 데이터 기준일자가 들어 있으며 파일 크기는 약 3.6KB(csv)로 작다. 부안군에서 간판·현수막 제작을 맡길 등록 업체가 어디에 있는지, 특정 업체가 언제 등록했는지 확인하려는 군민·사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 영업장 주소를 맞춰 연결해야 하며, 지방행정 인허가(LOCALDATA) 옥외광고업 자료나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식으로 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 부안군에서 관리하는 옥외광고물업 관련 인허가 업소 현황을 체계적으로 제공하기 위하여 구축된 행정자료이다. 옥외광고물업은 도시 미관과 공공안전 확보를 위하여 법적 규제와 행정적 관리가 이루어지는 업종으로, 허가 및 등록 과정을 통해 해당 업소의 기본 정보를 수집하고 이를 기록·관리하는 절차가 필요하다. 부안군은 이러한 관리 과정을 데이터화하여 투명성을 제고하고 군민과 민간의 활용 편의성을 높이고자 한다.데이터는 옥외광고물업체의 행정적 인허가 과정을 기반으로 수집되며, 세부 항목으로는 업소별 구분을 위한 인허가번호, 최초 행정처리 시점을 확인할 수 있는 등록연월일, 광고업을 영위하는 업소명, 사업장의 실제 소재지를 나타내는 영업장 주소가 포함된다. 또한 데이터 최신성을 보장하기 위하여 특정 시점 기준의 수집 현황을 나타내는 데이터 기준일자가 함께 제공된다. 이와 같은 세부 항목은 행정관리의 근거자료가 될 뿐만 아니라 민간 활용자가 해당 업소의 현황을 직관적으로 이해할 수 있도록 돕는다.본 데이터는 행정업무 효율화와 대민 서비스 개선을 동시에 달성하는 데 목적이 있다. 행정기관은 본 자료를 근거로 허가업체 현황을 신속히 파악하고 관리 업무를 수행할 수 있으며, 정책 수립 과정에서도 업종별 분포나 영업 지속성을 확인하는 기초자료로 활용할 수 있다. 연구기관과 기업은 본 데이터를 분석하여 지역 상업 활동의 흐름을 파악하거나 광고물 업종의 분포 특성을 연구하는 데 활용 가능하다. 또한 군민은 해당 자료를 통해 관내 옥외광고물업체 현황을 손쉽게 확인할 수 있어 정보 접근성이 크게 향상된다.결과적으로 본 데이터는 도시환경 관리와 지역경제 활성화를 동시에 지원하는 행정기반 자료로서 의의가 크다. 부안군은 본 데이터를 개방함으로써 행정정보의 투명성을 강화하고, 공공데이터 이용자의 이해를 높이는 동시에 정책 활용과 민간 재사용 가치를 확대하는 효과를 기대한다.
