description_portal: 중소기업기술정보진흥원이 진행 중인 국가기술개발지원사업 중 지역혁신 선도기업으로 선정된 기업의 기업명, 지역, 해당 산업명 등의 정보를 제공한다. 선도기업으로 선정되기 위한 조건은 아래와 같다.(대상) 해당 소재지 지역주력산업을 영위하는 중소기업 중 지역혁신 선도기업의 요건을 충족하는 기업(협업) 초광역권 기술협력, 거래관계 활성화를 통한 지역경제(고용창출, 매출 증대 등) 파급효과 및 혁신성과(특허, 기술수준 향상, 국산화율 증대 등) 창출 가능성이 우수한 기업(혁신) 출액 대비 R&D 투자비중, 연구개발 기반확보, 등록특허 보유 및 증가율 등 혁신성이 우수한 기업
