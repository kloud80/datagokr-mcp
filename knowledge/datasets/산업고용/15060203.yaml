description_portal: 현재 국내에서 건설중인 원자력발전소의 주설비공사에 대한 현황으로 각 프로젝트 및 연도별 투입된 지역장비(금액)로 구성이 됩니다.지역장비 선정기준은 신한울원자력 1,2호기 및 신한울원자력 3,4호기는 건설현장이 속해있는 울진군에 등록되어 있는 업체를 대상으로 하고,새울원자력 3,4호기는 건설현장이 속해있는 울산광역시와 인근 부산광역시에 등록되어 있는 업체를 대상으로 합니다.건설현장에 투입된 주요 지역장비는 굴삭기, 덤프트럭, 지게차, 카고, 크레인, 펌프카 등이 있습니다.건설 시기에 따른 장비의 투입현황 관련 데이터는 지역경제의 발전에 이바지 할 것으로 예상됩니다.
