description_portal: 동 데이터는 투자조건부융자 전환권 행사 관련 기업정보, 전환금액 등의 데이터를 제공합니다.투자조건부융자는 전무투자기관(조합)으로부터 신청일 이전 24개월이내 1억원 이상 선투자 받은 중소기업을 대상으로 신주인수권부 융자를 지원하는 상품이며, 운전자금을 연간 20억원 이내 한도로 지원하고 있습니다. 지원받은 기업은 후속투자 유치 시 투자유치금의 20%(최대 대출금의 20%)를 3개월 내 조기상환 해야 합니다. 신주인수권의 취득규모는 융자 총액의 5%이며, 대출금이 전액 상환된 후 신주인수권은 소멸됩니다.
