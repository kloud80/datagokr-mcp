description_portal: 이 데이터는 산재보험에서 지급된 이종요양비의 연도별 현황을 담고 있습니다. 이종요양비는 최초 요양급여, 추가 상병, 재요양 등 승인 결정 전에 산재 근로자가 업무상 재해로 요양을 받고 부담한 비용, 또는 요양 담당 산재의료기관 외 다른 기관에서 응급 진료를 받고 부담한 비용 등을 포함합니다. 통계 항목은 수급자수, 수급건수, 지급액(백만원)으로 구성되어 있으며, 세부적으로는 간병료, 의지 및 보조기, 이송료, 진료료 등 네 가지 항목으로 구분하여 제공됩니다. 이 자료는 산재 근로자가 보험급여 결정 및 요양 과정에서 일시적으로 부담하는 비정형적 의료 비용의 규모와 유형을 파악하는 데 필수적인 정보를 제공한다고 판단됩니다.본 데이터는 산재보험 제도의 사각지대 및 근로자 비용 부담 실태를 분석하는 데 중요한 자료입니다. 이 자료를 활용하여 산재 승인 지연으로 인한 간병료, 이송료 등의 비용 발생 추이를 분석하고, 산재 행정 처리 과정의 신속성을 제고하여 근로자의 초기 경제적 부담을 완화할 수 있는 방안을 모색할 수 있습니다. 또한, 진료료 항목의 규모를 분석하여 응급 상황 등에서 발생하는 비용 처리의 적정성을 검토하고, 의료 서비스 접근성을 향상시키는 데 기여할 수 있다고 판단됩니다.
