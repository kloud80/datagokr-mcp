description_portal: 한국자산관리공사에서 개최한 데이터 분야 공모전의 연도별 민간 참가현황 자료입니다.한국자산관리공사는 민간의 공공데이터 활용 및 창업 지원을 위해 2021년부터 데이터 분야 공모전을 개최하고 있으며,예비창업자 및 스타트업의 데이터 활용 아이디어 및 서비스를 발굴하고 있습니다. 본 데이터는 공모전의 개최년도, 대회명, 참가현황(개인 참가자 수, 기업 참가팀 수, 전체 참가팀 수), 수상현황(수상팀 수, 경쟁률)에 대한 항목으로 제공하며,해당자료를 통해 데이터 공모전의 민간 참여 현황 및 경쟁률에 대한 정보를 파악할 수 있습니다.
