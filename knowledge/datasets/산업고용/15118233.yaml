summary_user: 전국 주유소에서 파는 요소수의 평균 판매가격을 기간별로, 전국과 17개 시도 열로 나눠 담은 집계 표(CSV 약 8KB)다. 화물·디젤차 운전자나 물류 사업자가 "지금 우리 지역 요소수 값이 다른 시도보다 비싼가, 최근 가격이 오르고 있나"를 확인하거나, 분석가가 요소수 수급 불안 시기의 지역별 가격 변동을 비교하는 데 쓴다. 전역 조인 키는 없고, 시도 이름 열과 기간 열을 기준으로 오피넷 유가 등 같은 기관의 지역별·시점별 데이터와 이름 매칭으로 이어 쓴다.
description_portal: 이 데이터는 전국 각 지역 주유소에서 판매되는 요소수의 평균 판매가격 정보를 담고 있습니다. 요소수는 디젤 차량의 질소산화물 저감장치(SCR)에 사용되는 필수 소모품으로, 수급과 가격 변동이 국민 생활과 물류 산업에 직결되는 중요한 자원입니다. 본 데이터는 날짜별로 구분된 각 지역의 평균 판매가격을 제공함으로써, 지역 간 가격 차이를 비교하거나 특정 시점의 가격 변동 추이를 파악하는 데 활용될 수 있습니다. 이를 통해 소비자는 요소수 구매 시 가격 정보를 참고할 수 있으며, 정책 수립자나 연구자는 요소수 가격의 지역별 격차나 변동 패턴을 분석하여 수급 안정 대책 수립 등에 활용할 수 있습니다. 특히 가격 정보가 정량적 수치로 제공되므로, 다양한 시계열 분석 및 시각화에도 유용하게 활용될 수 있습니다.
