summary_user: 전력 비상 시 감축하기로 수요관리 사업자와 사전 약정한 신뢰성 수요반응(DR) 자원의 감축요청량, 감축이행량, 이행률을 D-2월 정산 기준으로 월별 합산해 전국 단위로 담는 집계 데이터다. 에너지 분석가나 수요관리 사업자가 "최근 몇 달 동안 신뢰성 DR 감축 요청에 실제로 얼마나 이행했는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 거래일(tradeDay) 같은 날짜나 DR 유형 이름을 맞추는 방식으로 같은 기관의 전력수급·SMP 데이터와 이어 쓴다.
description_portal: ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다. ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다.전력 비상 상황에 감축 가능한 전력용량을 수요관리 사업자와 약정을 통해 사전에 확보하여 감축 실행한 실적을 조회할 수 있는 서비스감축요청량, 감축이행량, 이행률 등 월별 신뢰성 수요반응자원 거래실적을 D-2월 정산기준으로 월별 합산하여 제공합니다.
