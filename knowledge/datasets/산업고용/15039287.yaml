description_portal: 한국전력공사에서 제공하는 전국 시군구별 산업분류별 전기사용 고객 증감 데이터 입니다.해당 데이터는 사용자가 원하는 정보를 직접 설정하여 추출할 수 있는 시스템으로 행정구역, 기간, 산업분류를 설정하여 각 산업분류별 신설, 증설, 해지 고객의 전력 사용량을 제공받을 수 있습니다.기본적으로 조회는 가능하나 다운로드시에는 회원가입 및 로그인이 필요합니다.사용자는 산업별/지역별 전력 소비량의 변화를 분석하여 지역 경제 동향을 파악할 수 있습니다.특정 지역의 신설 및 증설 고객의 전력 사용량 추이를 분석해 성장하는 산업을 식별하거나, 해지 고객의 전력 사용량 변화를 통해 쇠퇴하는 산업을 예측하는 등 기초자료로 활용할 수 있습니다.
