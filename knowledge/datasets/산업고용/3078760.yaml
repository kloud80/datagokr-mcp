summary_user: 부산광역시 사상구에 등록된 옥외광고물 업체를 한 업체당 한 행으로 담은 파일로, 업소명과 영업장 도로명주소만 있는 소규모 CSV(약 7.6KB)다. 사상구 안에서 간판·현수막 제작을 맡길 등록 광고업체가 어디에 있는지, 동네별로 얼마나 몰려 있는지 알아보려는 주민·사업자·분석가가 쓴다. 전역 조인 키나 사업자번호·좌표가 없어서 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 잇고, 지방행정 인허가(LOCALDATA) 옥외광고업 원장이나 소상공인 상가업소 정보와 대조할 때도 같은 방식을 쓴다.
description_portal: 해당 데이터는 부산광역시 사상구 관내 옥외 광고물 업체의 현황 데이터 항목을 제공하고 있습니다.옥외광고물은 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」 에 근거하여 등록된 업체 현황을 제공하고 있습니다. 이 데이터는 지역 경제 활동 및 관련 분야의 통계를 파악하는 데 유용하게 활용될 수 있습니다. 제공되는 주요 항목으로는 각 업체를 식별할 수 있는 업소명과 해당 업체의 구체적인 위치를 확인할 수 있는 업소 도로명주소 정보가 포함되어 있습니다. 이를 통해 사용자는 업체의 소재지를 쉽게 파악하고 지역별 분포 현황을 분석할 수 있습니다. 해당 데이터는 누구나 접근하고 활용할 수 있도록 제공하고 있습니다.
