summary_user: 창업진흥원 혁신창업스쿨의 주관기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 분야(IT/서비스·바이오·헬스케어·일반제조·딥테크 등)·소재지·주관기관명·주소를 담는다(csv 474바이트의 소규모 파일). 예비창업자나 유관기관이 '우리 지역에서 딥테크 분야 혁신창업스쿨을 운영하는 기관은 어디인가'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주관기관명이나 주소(소재지) 문자열 매칭으로만 이어 쓴다.
description_portal: 해당 데이터는 창업진흥원이 관리하는 혁신창업스쿨 주관기관 정보로, 분야별·지역별 주관기관 현황을 담고 있으며, 순번, 분야, 소재지, 주관기관명, 주소 항목으로 구성되어 있다. 서울, 제주, 충북 등 다양한 지역의 주관기관별 위치 정보와 함께 IT/서비스, 바이오·헬스케어, 일반제조, 딥테크 등 기술 분야에 따른 전문 지원체계를 확인할 수 있다. 이를 통해 창업 기업이나 유관기관이 지역 및 기술 분야별 특화 지원 기관을 탐색하고, 맞춤형 협업 대상을 발굴하거나 정책 수립 시 지역 기반 기술지원 인프라를 분석하는 데 기초 자료로 활용될 수 있으며, 기관 간 네트워크 형성과 지역 균형 발전 전략 마련에도 중요한 기반이 된다.
