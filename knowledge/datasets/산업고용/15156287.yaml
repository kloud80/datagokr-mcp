description_portal: 이 데이터는 근로복지공단이 직장어린이집 설치 운영 한자리 서비스를 통해 직장어린이집을 설치하고자 하는 사업주에게 맞춤형 상담을 실시하고 어린이집 설치 비용과 운영의 일부를 지원하면서 우수 보육프로그램을 발굴 및 보급하는 등 종합 보육서비스를 제공하기 위해서 운영하고 있는 직장보육지원센터가 전국의 직장어린이집을 대상으로 우수사례 발굴과 확산을 통해 직장보육 발전에 앞장서고자 실시한 2025년 THE자람 보육공모전 심사결과 데이터 입니다.공모분야와 수상작품 수는 보육프로그램(적용과 개발) 18개 작품, 우수 보육실천활동 8개 작품, 우수 설치 운영사례 8개 작품으로 수상등급, 어린이집(사업장명), 수상분야와 작품명 데이터 항목으로 구성되어 있습니다.공모전에서 선정된 우수사례 데이터가 전국의 민간 어린이집으로 벤치마킹을 통해 확산되어 어린이와 학부모가 행복해하는 보육환경 조성에 기여할 수 있다고 판단됩니다.
