description_portal: 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.해당목록은 일별 시간별로 발전원별 발전량을 보여주는 서비스입니다.※ 해당 자료는 전력거래 정산데이터로 향후 수정 정산에 따라 데이터 및 수치 등이 일부 변동될 가능성이 있음.
