summary_user: 전력거래 정산 기준으로 일자·시간별 발전원별 발전량을 담은 전국 단위 API로, 검증 호출에서 2022-09-04 하루치 192행이 수신됐다. 전력 수급 분석가나 에너지 사업자가 특정 날짜에 어떤 발전원이 시간대별로 얼마나 전력을 생산했는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관의 코드로만 잇고, 같은 부문의 수급예보·SMP·REC 등 전력거래소 자료와 함께 본다.
limits: 포털 설명상 정산 데이터라 수정 정산에 따라 수치가 일부 바뀔 수 있다. 확인된 최신 행 날짜(2022-09-04)는 검증 호출 조건(tradeYmd=20220904) 기준이라 데이터 자체가 오래됐다고 단정할 수 없으며, 날짜를 바꿔 호출해야 한다. 개발계정은 일 100회 호출로 제한되고 serviceKey가 필요하다.
