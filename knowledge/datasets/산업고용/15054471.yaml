summary_user: 충청북도 보은군 관내에 소재한 기업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 회사명·소속 산업단지명·공장 도로명주소·전화번호·생산품을 담는다(CSV 약 22KB). 보은군에서 특정 품목을 생산하는 업체나 특정 산업단지에 입주한 기업이 어디인지 찾으려는 사업자·구직자·지역 분석가가 쓴다. 전역 조인 키(사업자등록번호 등)가 없어 다른 데이터와는 회사명이나 공장 도로명주소를 텍스트로 맞춰 이어 써야 한다.
limits: 사업자번호 같은 공통 식별 코드가 없어 다른 기업·인허가 데이터와 정확히 매칭하기 어렵고, 이름·주소 매칭에 의존해야 한다. 보은군 한 곳만 다루므로 다른 시군과 비교하려면 별도 파일을 모아야 한다.
