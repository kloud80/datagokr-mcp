summary_user: 광주광역시 지역에 등록된 대규모점포(대형마트·전문점·백화점·쇼핑센터 등)를 점포 한 곳당 한 행으로 담은 원천 목록 파일로, 상호명·소재지·전화번호·매장면적(제곱미터)·데이터기준일자를 제공하며 포털 설명상 총 21개소입니다. 광주에서 대형 유통시설이 어느 자치구에 얼마나 큰 규모로 있는지 확인하려는 상권 분석가나 출점을 검토하는 사업자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호명이나 소재지 주소를 맞춰 연결해야 하며, 전국 대규모·준대규모점포 표준데이터나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식으로 이어 쓴다.
description_portal: 2026년 1월 30일 기준 현재 광주광역시 지역에 등록된 대규모 점포 현황에 관한 데이터로 상호명, 소재지, 전화번호, 매장면적을 제공합니다.유통산업발전법에 따른 대규모점포 종류는 대형마트, 전문점, 백화점, 쇼핑센터, 복합쇼핑몰, 그밖의 대규모 점포로 구분됩니다.광주광역시에 등록된 대규모점포는 총 21개소로 대형마트 3개소, 대형마트 9개소, 전문점 2개소, 쇼핑센터 5개소, 그밖의대규모점포 1개소 입니다.  자치구별로는 동구 3개소, 서구 8개소, 남구 2개소, 북구 3개소, 광산구 5개소입니다.
