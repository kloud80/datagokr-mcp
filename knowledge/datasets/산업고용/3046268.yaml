description_portal: 본 자료는 연천군과 전곡 지역에서 판매되고 있는 생활필수품의 가격 정보를 한눈에 확인할 수 있도록 정리한 것이다. 농산물, 축산물, 수산물, 가공식품, 공산품 등 일상생활과 밀접한 품목들을 품목별 규격, 판매 단위와 함께 제시하고 있으며, 전곡재래시장과 각종 마트 등 여러 판매처에서 확인된 가격을 동일한 기준일에 맞춰 기재하고 있다. 농산물 항목에는 쌀, 배추, 무, 감자, 오이, 상추 등 기본적인 식재료가 포함되며, 규격과 단위가 명시되어 있어 품목의 형태와 용량을 쉽게 파악할 수 있다. 축산물은 소고기, 돼지고기, 닭고기 등 가정에서 자주 사용되는 육류를 중심으로 구성되어 있으며, 제시된 중량 기준을 통해 실제 구매 시 확인해야 할 정보를 함께 제공한다. 수산물 항목은 고등어, 갈치, 동태 등 생선류가 포함되어 있어 계절 및 조리 특성에 맞는 정보를 담고 있다. 가공식품은 두부, 간장, 라면, 식용유, 커피 등 일반적으로 소비되는 품목들이 제시되어 있으며, 제조사와 용량 등의 정보가 함께 기재되어 있다. 공산품은 화장지, 치약, 비누, 섬유유연제 등 생활용품을 포함하며, 규격 및 포장 형태를 통해 제품의 구성과 특성을 확인할 수 있다. 이 자료는 지역 내 생활물가 현황을 체계적으로 기록해 관리·활용할 수 있도록 구성되어 있으며, 생활비 분석, 정책 자료 활용, 소비자 안내 등 다양한 목적으로 활용 가능한 기초 자료이다.
