summary_user: 2026년 심의를 통과한 벤처기업을 기업 단위로 담은 전국 파일 데이터로, 검증 시 39,668행이며 업체명·벤처확인유형·업종·주생산품·유효기간·확인기관·신규/재확인 구분을 싣는다. 투자기관이나 분석가가 '어느 지역·업종에 어떤 유형의 벤처확인 기업이 있는가'를 확인하는 데 쓴다. 조인 키는 주소(address)뿐이라 주소 기준으로 지역 기업 현황 등과 잇고, 사업자번호 같은 키는 필드에 없다.
