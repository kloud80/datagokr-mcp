description_portal: 부한국가스공사 부산경남지역본부의 UPS 및 축전지 설치 현황 데이터 입니다. 비상전원설비 현황 관리 및 전력 안정성 확보, 재난대응 역량 분석, 설비 유지보수 계획 수립을 목적으로 수집되었습니다. 데이터 구성항목은 관리소, UPS 3상(KVA), UPS 1상(KVA), UPS AVR(1상 KVA), BATTERY CELL, BATTERY 용량(AH)으로 이루어져 있어 비상전원설비의 상세 현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 관리소별 UPS 설비용량 분석, 축전지 용량 현황 파악, 비상전원 공급능력 평가, 설비 노후도 분석, 예비전원 확보 현황 파악이 가능합니다. 또한 비상전원설비 교체 계획 수립, 정전 대응능력 평가, 재난안전 관리 계획 수립, 설비 투자 우선순위 결정에 활용됩니다. 부산경남지역의 비상전원설비 관리에 기초자료로 활용됩니다.
