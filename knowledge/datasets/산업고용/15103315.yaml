summary_user: 한국가스기술공사가 운영하는 서울 강서 수소충전소 한 곳의 월별 충전대수(대)와 충전량(kg)을 연도·월 단위로 집계해 충전소 위치와 함께 담은 소용량 CSV 파일(약 2KB)이다. 수소차 이용자나 에너지 분석가가 '강서 수소충전소의 월별 이용량이 어떻게 변해 왔나'를 확인하거나 지역 수소차 보급·충전소 혼잡 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키(충전소 ID·좌표 등)가 없어 다른 충전소·유가 데이터와는 충전소 이름이나 위치 문자열, 같은 기관 기준으로만 이어 붙인다.
description_portal: CSV 파일에는 한국가스기술공사에서 운영중인 곳으로 신재생에너지인 수소를 기반으로 운행되는 수소차량에 수소충전서비스를 제공하는 수소충전소의 운영현황 및 위치를 포함하고 있습니다. 위 데이터에 수소충전소 위치 및 월별 충전대수 및 충전량 데이터가 명시되어 있어 각 수소충전소별 위치와 해당 지역별 수소차 보급 현황 및 모니터링에 활용할 수 있습니다. 또한 충전량을 기반으로 충전소 혼잡도 및 대기시간, 충전 가능 여부 등을 파악하여 이용자들의 편의성 향상에 활용될 수 있습니다.
