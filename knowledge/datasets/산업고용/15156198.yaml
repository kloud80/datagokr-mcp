description_portal: 경기도 양평군의 비료생산업등록업체에 관한 데이터입니다. 상호, 주소, 전화번호 등의 항목을 제공합니다.  비료관리법 제11조(비료생산업의 등록)에 따라 비료를 생산하여 판매하거나 무상으로 유통, 공급하는 것을 업으로 하려는자는 대통령령으로 정하는 바에 따라 비료의 종류별로 제조 원료, 보증성분등을 시장, 군수,구청장에게 등록하여야 합니다. 비료를 수입하여 판매하거나 무상으로 유통, 공급하는 것을 업으로 하려는 자는 비료관리법 제12조(비료수입업의 신고)에 따라 비료의 종류별로 제조 원료, 보증성분등을 시장, 군수, 구청장에게 신고하여야 합니다.
