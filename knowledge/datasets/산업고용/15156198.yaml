summary_user: 경기도 양평군에 등록된 비료생산업 업체를 업체 한 곳당 한 행으로 담은 파일(CSV, 약 3KB)로, 상호·도로명/지번 주소·전화번호·데이터기준일자를 담는다. 양평군에서 비료를 생산하는 업체가 어디에 있고 연락처가 무엇인지 찾는 농업인·유통 사업자, 또는 지역 비료 생산업체 분포를 살피는 분석가가 쓴다. 전역 조인 키(사업자번호·업체 코드 등)는 없어서, 다른 데이터와는 상호·주소를 맞춰 보거나 시군구 단위로 붙여 쓴다.
