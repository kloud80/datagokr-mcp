summary_user: "성남시 관내 주유소와 LPG·CNG 충전소를 시설 한 곳당 한 행으로 담은 파일로, 구분(주유소/충전소), 상호명, 허가일자, 지번·도로명 주소, 전화번호, 셀프 여부를 수록한다. 시민이나 분석가가 '성남시 어느 동네에 셀프 주유소나 LPG 충전소가 있는가', '주거 밀집지역 대비 연료 공급시설 분포가 고른가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호명을 매칭해 잇는다(예: 오피넷 유가 정보, 전국 주유소 표준데이터)."
description_portal: 성남시 관내 주유소 및 CNG LPG 충전소에 대한 데이터로, 구분(충전소/주유소), 시설명, 허가일자, 주소, 전화번호 등의 항목으로 구성되어 있습니다. ※ 주유소별 유가정보 확인은 오피넷(https://www.opinet.co.kr/) 또는 성남시청 홈페이지(https://www.seongnam.go.kr/oil/oilPrice.do?menuIdx=1001179)를 확인해주시기 바랍니다.성남시 주유소 및 충전소 현황 데이터는 관내에서 운영 중인 내연기관 차량용 주유소(휘발유·경유·LPG)의 정보를 수록한 자료입니다. 성남시는 이 데이터를 바탕으로 도시 내 에너지 공급 기반의 균형 분포를 분석하고, 충전 인프라 확대 정책의 기초자료로 활용합니다. 특히 입지 적정성, 인프라 설치 필요 지역, 주거 밀집지역과의 거리 등을 고려한 정량적 분석에 활용되고 있습니다.
