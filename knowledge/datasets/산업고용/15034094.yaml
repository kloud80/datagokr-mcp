summary_user: 서울 송파구 안의 태양광 발전소를 한 곳씩 담은 건별 목록으로, 발전소명·설비용량(kW)·연간발전량·도로명/지번 주소·최초허가일·사업개시일·발전유형을 담는다. 주민이나 지역 에너지 분석가가 '송파구에 태양광 발전소가 어디에 얼마 규모로 언제부터 운영되고 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 발전소명으로 맞춰 이어 써야 하며, 전국태양광발전소전기사업허가정보표준데이터와 주소·용량 기준으로 대조하는 용도가 대표적이다.
limits: 송파구 한 곳만 다루므로 다른 지역과 비교하려면 전국 표준데이터가 따로 필요하다. 공통 코드 키가 없어 연계는 주소·이름 매칭에 의존한다. 파일이 6.7KB 정도의 작은 CSV라 담긴 발전소 수가 많지 않다.
