summary_user: 한국장애인고용공단이 구직 장애인에게 실시한 구직준비도 검사(기존 구직욕구진단검사 개정판)의 결과를 검사 1건 단위로 담은 파일로, 검사일자·장애유형·원점수·백분위점수·구직욕구수준과 구직활동의 적극성·일자리 수용 자세·경제적 어려움·장애 수용 정도 같은 하위 영역 점수, 34개 문항별 응답을 포함한다. 고용서비스 연구자나 분석가가 '장애유형별로 구직욕구 수준이나 보완이 필요한 영역이 어떻게 다른가'를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 이름 매핑이나 같은 기관 자료 기준으로만 느슨하게 이어 쓴다.
description_portal: '한국장애인고용공단에서 실시하는 직업능력평가 도구 중 장애인 구직준비도 검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 원점수, 백분위점수 등에 대한 정보를 제공합니다.* 장애인 구직준비도 검사: 기존 장애인 구직욕구진단검사의 측정 영역 및 문항을 보완하여 개정한 검사로 구직을 희망하는 장애인에게 고용서비스를 제공하기 전 구직욕구가 어느 정도인지 확인하기 위해 실시하는 검사입니다. 구직 장애인의 구직욕구 수준, 보완할 영역 등을 사전 탐색함으로써 효과적인 고용서비스 제공이 이루어질 수 있도록 지원합니다.'
