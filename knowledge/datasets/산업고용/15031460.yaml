description_portal: 해당 내용은 「석유 및 석유대체연료 사업법」 등에 따라 액화석유가스(LPG)의 품질기준, 시험방법, 검사수수료, 검사 소요경비 지원 등에 관한 사항을 규정함을 목적으로 합니다.LPG 품질검사업무는 **한국석유관리원(검사기관)**에 위탁됩니다. 검사기관은 품질기준 및 시험방법(별표)에 따라 품질시험을 실시하며, 검사의뢰자 및 가스유통사업자를 대상으로 시료채취 및 보관을 진행합니다. 검사수수료는 국내판매물량(kg당 0.027원) 기준으로 검사의뢰자가 검사기관에 납부하며,  한국석유관리원은 검사결과를 사업자 및 관할 행정기관에 통지해야 하며 , 사업자는 결과 통보 후 15일 이내에 1회에 한하여 이의시험을 신청할 수 있습니다.
