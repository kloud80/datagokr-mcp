description_portal: 본 데이터는 연도별로 부처별 적용사업 현황을 집계한 CSV 통계 자료로, 각 부처가 추진·운영한 연구개발 활동의 규모를 여러 지표로 함께 제공합니다. 항목에는 부처 단위로 과제 수, 사업 수, 연구기관 수가 포함되어 있어, 한 부처가 같은 연도에 얼마나 많은 과제를 수행했는지(과제 수), 얼마나 많은 사업 단위를 운영했는지(사업 수), 그리고 그 과정에 참여한 기관의 수가 어느 정도인지(연구기관 수)를 동시에 확인할 수 있습니다. 이렇게 서로 다른 성격의 지표가 함께 제공되기 때문에, 단순히 ‘과제 건수’만 보는 것이 아니라 사업 운영 단위와 참여 기반(기관 참여 규모)을 함께 놓고 부처별 특징을 비교할 수 있습니다.활용 측면에서 이용자는 연도별 증감 추이를 통해 특정 부처의 과제·사업 운영 규모가 확대 또는 축소되는 흐름을 점검할 수 있고, 부처 간 지표 수준 차이를 비교해 연구개발 활동의 분포를 정리할 수 있습니다. 또한 과제 수와 사업 수, 연구기관 수를 함께 보면, 동일한 과제 규모라도 사업 단위가 더 촘촘한지 또는 참여 기관 기반이 넓은지 같은 운영 특성을 간접적으로 파악하는 데 도움이 됩니다. 정책 담당자는 부처별 연구개발 활동 현황을 요약·비교하는 기초자료로 활용할 수 있으며, 성과 관리와 연구개발 생태계 분석에서는 참여 기관 수의 변화를 포함해 참여 기반의 확장·축소 흐름을 점검하는 데 참고할 수 있습니다.
