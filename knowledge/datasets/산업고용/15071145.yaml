description_portal: '한국산업기술진흥원에서 구축한 통합사업관리 시스템에 수록된 정보는 연구자와 기업 모두에게 상당한 가치를 제공합니다. 이 데이터는 NTIS 논문 정보로 구성되어 있으며, 연구성과를 기반으로 한 의사결정이나 연구 방향 설정에 도움을 줄 수 있습니다. 데이터는 성과발생년도, 학술지명, 논문명, 주저자명, SCI 구분코드 등의 다양한 항목에 대한 정보를 포함하고 있습니다. 이를 통해 연구자들은 특정 분야에서의 연구 동향을 파악하고, 기업은 최신 연구 성과를 바탕으로 혁신적인 개발을 추진할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형) : 논문이 발표된 연도학술지명(문자형) : 논문이 게재된 학술지의 이름논문명(문자형) : 연구 논문의 제목주저자명(문자형) : 논문의 주저자 이름국제과학논문 색인 구분코드(문자형) : 논문의 SCI 등재 여부에 따른 코드이러한 데이터는 연구 결과 분석 및 학술지 선택에 유용하게 활용될 수 있습니다.'
