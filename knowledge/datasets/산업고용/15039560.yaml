description_portal: '한국전력공사 지역별 PPA 계약 현황 데이터 입니다.시군구별 발전원별 계약수(개수) 및 용량(kw), 지역개수(지역별 합산값), 지역용량(kw단위, 지역별 합산) 항목으로 이루어져 있습니다.지역별로 발전원, 개수 및 용량 합산 값을 알 수 있기 때문에 재생에너지 기반 형성에 대한 지역별 비교 분석이 가능하고이를 통해 공장, 데이터센터, 물류센터 등 대규모 전력 사용이 필요한 시설의 입지 선정 등에 기초 자료로 활용할 수 있습니다.특정 지역은 계약 건 5건 미만인 경우, 개인정보 보호를 위하여 비식별화 처리 하였습니다. 공란은 비식별화 한 건이므로 참고 부탁드립니다.해당 데이터는 한국전력공사 에너지마켓플레이스 홈페이지에서 세부 현황을 확인하실 수 있습니다.* 접속메뉴 : 에너지마켓플레이스(포털사이트 검색 등) - 재생에너지거래 - 신재생에너지거래정보 - 발전량통계'
