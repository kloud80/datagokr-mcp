description_portal: '한국지역난방공사의 지역별 공급유형별 핸드홀 설치현황 데이터를 정리한 자료로, 열수송관망 내 핸드홀(Handhole) 설치 위치와 유형별 분포 현황을 체계적으로 관리하여 열공급 설비의 유지보수 및 긴급복구 효율성을 높이기 위한 자료입니다.1. 형식: CSV2. 내용 요약:■ 지사명: 핸드홀이 설치된 지사명(예시: 강남, 고양 등)■ 읍면동: 핸드홀이 위치한 읍면동명(예시: 강남구, 서초구 등)■ 공급유형: 해당 핸드홀이 설치된 열공급 유형 구분(예시: 온수, 냉수)■ 설치년도: 핸드홀이 시공된 연도(예시: 2015, 2019, 2023)■ 관리상태: 핸드홀의 유지관리 현황(예시: 정상, 점검중, 교체예정)3. 활용 예제:■ 지역별 핸드홀 설치현황 데이터를 기반으로 열수송관망 유지보수 계획 및 복구 접근성 개선■ 공급유형별 핸드홀 분포를 분석하여 열공급망의 구조적 효율성 및 안전성 평가■ 핸드홀 설치 연도 및 관리상태를 바탕으로 노후시설 교체계획 및 장기 설비관리 전략 수립'
