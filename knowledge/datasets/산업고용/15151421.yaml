description_portal: '한국지역난방공사의 직무정보 데이터로, 사무·기술·관리 등 직무그룹별로 관련 역량 체계와 직무 정의를 정리하여 인사관리 및 직무교육 체계 수립에 활용할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 직무그룹: 직무가 속한 그룹의 구분(예시: 사무, 기술, 관리)■ 관련역량대분류: 해당 직무와 관련된 주요 역량의 대분류(예시: 경영회계사무, 기술엔지니어링)■ 관련역량중분류: 대분류 내 중간 수준의 세부역량 분류(예시: 기획사무, 총무인사)■ 관련역량소분류: 중분류 아래의 세부 전문 역량(예시: 경영기획, 자산관리, 홍보광고)■ 직무아이디: 각 직무를 식별하기 위한 코드 또는 명칭(예시: 경영기획, 경영평가, 자산관리)■ 바람직한직무상(목적): 해당 직무 수행의 목적 및 기대성과(예시: 재무·예산관리의 효과성 제고 및 대외기관 대응력 강화)■ 직무정의: 직무 수행의 구체적인 내용 및 역할 정의(예시: 경영기획은 경영목표 달성을 위한 전략 수립 및 자원 배분의 최적화를 수행함)3. 활용 예제:■ 직무별 역량체계 분석을 통해 인사·교육·평가 연계형 직무역량모델(HRM/HRD) 구축■ 직무정의 데이터를 활용한 직무기술서(JD) 자동화 및 인사평가 지표 개발■ 직무그룹별 핵심역량 도출을 통한 맞춤형 직무교육 프로그램 및 승진 역량평가 체계 설계'
