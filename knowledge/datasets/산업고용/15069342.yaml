summary_user: 전력시장에 참여하는 대전·세종 지역 발전기의 발전량 합계를 거래일·시간별로 5분 간격(0~55분 열) 값으로 담은 2016년 파일 데이터이며, 단위는 Wh입니다. 분석가가 2016년 대전·세종 지역 발전량이 하루 중 어느 시간대에 많고 적었는지, 계절에 따라 어떻게 달라졌는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 발전량이나 수급 데이터와는 지역명과 거래일·시간을 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 전력시장에 참여하는 대전, 세종지역 발전기의 발전량 합계를 제공합니다.- 항목 : 지역, 날짜, 시간, 발전량- 단위 : Wh(0~55분 데이터 합산 시)- 기간 : 2016년'
