summary_user: 서울특별시 용산구 관내 대규모점포(매장면적 3천㎡ 이상)와 준대규모점포(기업형 슈퍼마켓 등)의 인허가 내역을 점포 한 곳당 한 행으로 담으며, 인허가·취소 일자, 영업상태, 휴업 기간, 소재지(지번·도로명), 매장면적, 업태, 좌표 등을 포함한다. 용산구 상권 분석가나 소상공인이 '용산구에 영업 중인 대형마트·SSM이 어디에 있고 언제 인허가됐는가'를 확인하는 데 쓴다. 전역 공통 조인 키는 없어 다른 데이터와는 상호·주소 같은 이름 매핑이나 같은 기관의 관리 코드(개방자치단체코드·관리번호)로만 연결하며, 좌표(X·Y)는 주변 상가업소·전통시장 위치와 공간 비교에 쓴다.
description_portal: 서울특별시 용산구 관내 대규모 및 준대규모 점포 관련입니다. 속성은 번호, 상호, 분류, 소재지, 전화번호, 휴점일, 영업시간, 비고로 구성되어 있습니다. 대규모점포란 매장면적이 3천제곱미터 이상인 대형마트, 백화점, 쇼핑센터, 복함쇼핑몰 등을 의미하며, 준대규모점포는 매정면적 1천제곱미터 이상 3천제곱미터 미만의 기업형 슈퍼마켓(SSM) 등이 해당됩니다. 이들 업체는 유통산업잘전법에 따라 등록 의무가 있으며, 영업시간 제한과 의무휴업일 규제를 받는 경우가 있습니다.  용산구는 유통기업상생발전 및  전통상업보존구역 지정 등에 관한 조례를 운영하여 지역 상권과의 상생을 도모하고 있으며, 이 데이터는 대형 유통업체 분포 현황 파악과 지역 상권 보호 정책 수립에 기초 자료로 활용됩니다. 용산구 주요 업체 현황은 다음과 같습니다.  ○ 이마트 용산점, 롯데슈퍼(원효로점, 한남점, 갈월점), 홈플러스익스프레스(한남점), 고메이494 한남, GS THE FRESH(용산해링턴점, 용산이촌점)  ※ 농협하나로클럽용산점, 롯데슈퍼 한남점의 경우 법제12조의2 1항단서조항에 의거 농수산물의 매출액비중이 55%이상되어 규제대상 제외
