summary_user: 전북특별자치도 장수군 7개 읍면에 설치·운영 중인 전기차 충전소를 충전소 1곳당 한 행으로 담은 파일(CSV)로, 충전소명·소재지와 도로명주소·충전기 대수·급속/완속 구분·관리기관·외부인 출입제한 여부·데이터기준일자를 담는다. 장수군 주민이나 방문객이 "장계면에서 외부인도 쓸 수 있는 급속충전기가 어디 있나"를 확인하거나, 분석가가 읍면별 충전 인프라 분포를 살필 때 쓴다. 전역 조인 키(충전소 ID·좌표·법정동 코드)가 없어 다른 충전소 데이터와는 충전소명이나 주소 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 장수군에 소재지하고 운영중인 전기차 충전시설 현황에 대한 데이터를 제공하고자 합니다.데이터의 구성은 충전소명, 설치위치소재지, 설치위치도로명주소, 충전기대수, 급속충전여부, 관리기관, 출입제한여부, 데이터기준일자로 구성되어 있습니다.급속충전여부는 급속, 완속으로 구분되어 있습니다.출입제한의 경우 외부인출입이 불가한 장소가 있으니 데이터 사용시 참고하시기 바랍니다.이 데이터의 경우 장수군 전체 7개읍면(장수읍, 산서면, 번암면, 장계면, 천천면, 계남면, 계북면)에서 현황입니다.추가적인 데이터가 필요한 경우 공공데이터포털(data.go.kr) 누리집의 데이터 제공 신청을 통해 신청하여 주시기 바랍니다.
