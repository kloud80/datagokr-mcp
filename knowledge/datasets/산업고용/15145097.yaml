summary_user: 수소유통정보시스템(하잉)으로 수집한 전국 수소충전소별 월평균 판매가격을 충전소관리번호·충전소명·지역명·기준연월 단위로 담는 API이다. 수소차 운전자나 분석가가 '우리 지역 수소충전소 중 어디가 싸고, 월별로 가격이 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 충전소·유가 데이터와는 충전소명·지역명 매핑이나 같은 기관의 충전소관리번호(chrstn_mno)로만 연결한다.
limits: 좌표나 표준 충전소 ID가 없어 지도화나 타 기관 충전소 원장과의 직접 결합은 이름 매칭에 의존해야 한다. 값은 월평균 가격이라 실시간·일별 가격 변동은 알 수 없다. 개발계정은 일 10,000회 호출 제한이 있다.
