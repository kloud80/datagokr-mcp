description_portal: 코트라 홈페이지 [국가지역정보] 항목에 게시된  해당 국가의 일반/무역/투자/참고정보를 링크정보로 제공합니다.[일반] 정보는 한국과의 관계(국교 수립 및 교민수), 최근 양국간 현안이슈, 주요 경제지표, 경제동향, 경제전망, 정치체계, 최신동향, 대외관계 및 사회적 특징, 주요 산업별 현황 등으로 구성되어 있습니다.[무역] 정보는 국가별수출입, 품목별수출입, 한국의 주요 수출입 품목, 수출 유망품목(상품/서비스), 무역협정 체결현황, 논의 중 협정, 관세제도, 물류정보, 통관제도 등으로 구성되어 있습니다.[투자] 정보는 투자유치제도, 투자입지여건, 대내 외국인직접투자 현황, 대외 직접투자 현황, 한국기업 투자 통계, 업종별 투자 현황, 한국기업 진출현황, 투자진출시 유의사항, 임금 수준, 조세제도 등으로 구성되어 있습니다.[참고] 정보는 시장 특성, 소비자 특성, 상거래 유의사항, 상담 유의사항, 성공 및 실패사례, 비자, 휴대품 통관, 대사관 및 한국기관, 현지정부 및 언론기관, 물가정보표, 환전, 교통, 통신, 관광명소, 현지공휴일, 무역관 위치 등으로 구성되어 있습니다.
