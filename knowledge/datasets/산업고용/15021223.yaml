summary_user: '광주 동구에서 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 건별 원장으로, 업소명·도로명주소·전화번호·지정일자·법인구분을 포함하며 범위는 동구 한 개 시군구다. 동네 주민이 근처의 정식 등록 담배 판매처를 찾거나, 분석가·창업 예정자가 동구 안 담배소매점 분포와 지정 시점을 살펴볼 때 쓴다. 실측 컬럼에 사업자번호나 표준 코드 같은 전역 조인 키가 없어, 다른 데이터(예: 소상공인 상가업소 정보, 다른 시군구 담배소매인 파일)와는 업소명·도로명주소를 맞춰 보는 방식으로만 이어 쓴다.'
description_portal: 담배사업법 제13조에 따라 담배를 판매하려는 업소는 반드시 소재지 관할 구청에 등록해야 하며, 이에 따라 광주광역시 동구에서도 지역 내 담배소매인을 지정해 관리하고 있습니다. 동구의 담배소매인 지정 현황 정보에는 각 업체의 상호명, 주소, 전화번호 등이 포함되어 있으며, 이는 해당 업소가 정식 절차를 통해 등록된 합법적인 담배 판매업소임을 확인할 수 있는 기본 자료입니다.이 정보는 지역 주민들에게 신뢰할 수 있는 판매처를 안내하는 역할을 하며, 행정기관에서는 신규 지정·변경·이전 신청 처리나 위생·청소년 보호 관련 점검 시 중요한 근거자료로 활용합니다. 또한 담배 판매 인허가 관리 체계를 유지하고 불법 판매를 예방하는 데에도 기여합니다. 담배소매인의 위치 정보와 연락처를 공개함으로써 지역 상권 구조를 이해하고, 주민 편의 향상을 위한 정책 수립에도 도움이 되는 자료로 활용됩니다.
