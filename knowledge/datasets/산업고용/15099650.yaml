summary_user: 한국동서발전 태양광 발전기별로 날짜마다 1행씩, 설비용량(MW)·경도·위도·발전기명과 01시~24시 시간대별 발전량(kWh)을 담은 파일 데이터로, 2022-04-01~2026-06-30 기간 7,728행이다. 에너지 분석가나 연구자가 발전기별 시간대 출력 패턴과 날씨에 따른 출력 변동, 지점 간 발전 특성 차이를 따질 때 쓴다. 경도·위도 좌표가 조인 키라서 좌표 기준으로 기상 관측 지점이나 다른 발전소 위치 자료와 이어 쓰고, 발전기 코드나 행정구역 코드 같은 별도 키는 없다.
description_portal: 한국동서발전의 일일 시간대별 각 발전기 태양광 발전량 정보 데이터입니다. 본 데이터는 발전일자별로 각 발전기의 설비용량(MW), 설치 위치(경도, 위도), 발전기명, 시간대별(01시~24시) 발전량(kWh), 일일 총 발전량(합계)으로 구성되어 있으며, 세부적인 발전 성과를 시간 단위로 정밀 분석할 수 있습니다. 해당 정보는 시간대별 발전 패턴, 기상 영향에 따른 출력 변동성, 지역별 발전 특성 비교 등 신재생에너지 효율 분석에 매우 유용합니다. 학계 및 연구기관에서는 태양광 출력의 시간대별 예측 정확도 검증, 에너지 수급 계획 시뮬레이션, 재생에너지 보급 효과 연구 등 다양한 분야에서 이 데이터를 활용할 수 있습니다.
