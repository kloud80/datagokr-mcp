summary_user: 부산광역시 도시가스 요금을 용도별(주택용·업무용 등 용도 구분)로 정리한 작은 요금표 파일로, 도매요금과 소매공급비용, 조정 전후 소비자요금을 기준일자와 함께 담는다. 가정이나 사업자가 부산에서 용도별 도시가스 단가가 얼마이고 조정으로 얼마나 바뀌었는지, 소비자요금 중 도매요금과 소매공급비용이 각각 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용도 이름이나 기준일자를 맞춰 연결해야 한다.
description_portal: 2026년 8월 기준 용도별 부산광역시 도시가스 요금표로 산업통상부에서 승인하는 도시가스 도매요금과 부산시에서 승인하는 도시가스 소매공급비용의 합으로 소비자요금이 결정됨. 산업통상부에서 승인하는 도매요금의 경우 원료비와 도매공급비용의 합으로 산정되며 도매공급비용은 매년 5월 조정하고 원료비는 매월 연동제로 소비자 요금에 반영됨. 부산광역시에서 승인하는소매공급비용은 도시가스사업자의 총괄원가를 보상하는 수준에서  연1회 조정함. 소비자 요금은 도매요금 약90%, 소매공급비용 약10%로 구성됨. 해당 데이터는 부산광역시 홈페이지에서도 열람할 수 있음
