description_portal: 이 데이터는 2018년부터 2025년까지 8개년 동안 고용보험료를 구성하는 요소 중 고용안정·직업능력개발사업의 보험료율 적용 현황을 연도별로 집계한 통계 자료입니다. 고용안정·직업능력개발사업 보험료율은 실업급여 보험료율과 함께 고용보험료율을 구성하며, 이 보험료율은 당해 사업주가 행하는 모든 사업의 규모(법인, 단체, 기업 등)를 기준으로 결정됩니다. (단, 국외 현지에서 급여가 지급되는 사업은 제외됩니다.) 통계는 각 보험연도별로 적용되는 보험료율(천분율)에 따른 적용 사업장 수를 제공합니다. 이 자료는 기업 규모에 따라 달라지는 고용보험료율의 적용 실태를 투명하게 보여주며, 국가의 고용 안정 및 직업 능력 개발 사업의 재원 확보 기반을 파악하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 고용 정책 및 중소기업 지원 정책의 효율성을 평가하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 높은 요율이 적용되는 사업장의 규모 및 변화 추이를 분석함으로써, 고용 안정 및 직업능력개발 지원이 필요한 고위험 기업군을 식별하고 이들을 위한 맞춤형 지원 정책의 대상을 정교하게 설정할 수 있습니다. 또한, 이 통계는 고용보험료율 구조의 적정성을 검토하고, 보험 재정의 안정성을 확보하면서도 기업의 부담을 최소화할 수 있는 합리적인 요율 조정 방안을 모색하는 데 기여할 수 있다고 판단됩니다.※ 고용보험의 보험료율은  고용안정, 직업능력개발사업의 보험료율 및 실업급여의 보험료율로 구분, 결정※ 고용안정, 직업능력개발사업의 보험료율은 “사업단위”로 결정되는 것이므로 당해 사업주가 행하는 “모든 사업”의 규모(법인, 단체, 기업 등)로 결정(단, 국외 현지에서 급여가 지급되는 사업은 제외)
