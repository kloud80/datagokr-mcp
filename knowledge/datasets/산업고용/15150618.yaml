description_portal: 이 데이터는 제주국제자유도시개발센터에서 제공하는 온라인 면세점 고객의 활동 내역에 대한 파일입니다. 성별, 연령대, 가입연월, 총 구매수량, 가입후 활동개월수를 포함한 온라인면세점 고객의 활동 내역에 대한 개인정보를 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 실제 고객 데이터의 구조와 통계적 특성을 반영하되, 개인식별정보를 제거하여 개인식별 위험성을 방지했습니다. 각 행은 가상의 고객 프로필을 표현하고 있어 개인 단위의 활동 내역 분석이 가능하지만, 실제 고객을 특정할 수는 없도록 설계되었습니다. 이를 통해 연령대별·활동기간별 장기적 구매 패턴을 분석하고, 고객 충성도 수준을 평가하여 맞춤형 회원제 정책을 설계하거나 장기 고객 유지를 위한 마케팅 전략을 수립하는 등 다양한 분석 목적으로 활용할 수 있습니다.
