description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2020-2025 년도 비중앙 발전기의 연료원별 일별 시간대별 전력거래량 데이터 입니다.ㅇ 항목 : 거래일, 시간, 연료원, 설비용량(MW), 전력거래량(MWH)※ 해당데이터는 정기적으로 갱신되지 않으며 일회성으로 제공되는 데이터입니다.'
