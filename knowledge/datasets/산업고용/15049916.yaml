description_portal: 한국가스공사의 연간 대기오염물질 배출량 데이터 입니다.대기오염물질 배출현황 관리 및 환경경영 성과 분석, 배출 저감 정책 수립, 환경규제 대응을 목적으로 수집되었습니다. 데이터 구성항목은 연도별 천연가스 판매량(천톤), NOx 배출량(kg) 및 원단위(kg/천톤), SOx 배출량(kg) 및 원단위(kg/천톤), 먼지 배출량 및 원단위로 이루어져 있어 오염물질별 배출현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 연도별 대기오염물질 배출 추이 분석, 오염물질별 배출 현황 파악, 판매량 대비 원단위 변화 분석, 환경목표 대비 실적 평가, 저감 효과 측정이 가능합니다. 또한 대기오염물질 저감 계획 수립, 환경설비 투자 우선순위 결정, 환경규제 대응 전략 수립에 활용됩니다. ESG 경영성과 보고, 대기환경 관리에 기초자료로 활용되어 청정에너지 기업의 환경경영을 지원합니다.
