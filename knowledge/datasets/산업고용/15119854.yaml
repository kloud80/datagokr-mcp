summary_user: 경기도와 도 산하 공공기관이 추진하는 정보화사업을 사업 한 건씩 담당부서·기관명(dept_nm), 사업명, 사업비(천원)로 정리한 경기도 단위 비공간 목록이다. 분석가나 도민이 '경기도시장상권진흥원·경기도일자리재단 같은 기관이 소상공인 플랫폼이나 지역화폐 홍보 같은 디지털 사업에 얼마를 배정했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 부서·기관명이나 사업명을 이름으로 맞춰서만 연결한다.
description_portal: 이 데이터는 경기도 및 도 산하 공공기관이 추진 중인 정보화사업의 세부 내역을 예산과 함께 정리한 자료로, 기관별 정보시스템 운영, 디지털 인프라 구축 및 유지관리, 교육 및 홍보 플랫폼 개발 등 디지털 행정 서비스 확대를 위한 사업들을 포함합니다. 주요 항목은 담당부서/공공기관, 사업명, 사업비(천원)이며, 경기도시장상권진흥원, 경기도일자리재단 등 다양한 기관이 포함되어 있습니다. 사업명에는 소상공인 지원 플랫폼, 상권영향분석시스템, 지역화폐 홍보, 디지털 백오피스 구축, 평생일자리앱 운영 등 구체적인 사업 내용이 기술되어 있어 행정 디지털화 전략, ICT 기반 민관 협력사업, 데이터 기반 정책 도입, 예산 집행 우선순위 결정 등에 유용합니다.
