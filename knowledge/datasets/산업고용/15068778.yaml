description_portal: <매년 공표되는 국내 무료 직업소개사업소 현황>직업안정법 제18조에 따라 지방자치단체에 신고된 국내 무료직업소개사업소 현황입니다. 지방자치단체에 신고된 자료로 새올행정시스템으로부터 연계받은 자료입니다. *직업안정법 제18조제1항*제18조(무료직업소개사업) ① 무료직업소개사업은 소개대상이 되는 근로자가 취업하려는 장소를 기준으로 하여 국내 무료직업소개사업과 국외 무료직업소개사업으로 구분하되, 국내 무료직업소개사업을 하려는 자는 주된 사업소의 소재지를 관할하는 특별자치도지사･시장･군수 및 구청장에게 신고하여야 하고, 국외 무료직업소개사업을 하려는 자는 고용노동부장관에게 신고하여야 한다. 신고한 사항을 변경하려는 경우에도 또한 같다.
