summary_user: 광주광역시에 소재한 고압가스 검사기관(전문·공인)을 기관 1곳당 1행으로 담은 소규모 목록 파일(csv 396바이트)로, 업체명·사무소와 사업소 소재지·대표자·검사구분·(재)지정일자·전화번호를 담는다. 저장탱크나 차량 고정 탱크 같은 특정설비의 재검사를 맡길 지역 검사기관을 찾는 사업자나, 검사기관 지정·재지정 시점을 확인하려는 담당자가 쓴다. 전역 조인 키가 없어 다른 에너지 업종 인허가 원장과는 업체명이나 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 광주광역시 소재 고압가스 검사기관(전문,공인) 현황으로 업체명, 소재지, 대표자, 검사구분, (재)지정일자, 전화번호를 제공하는 데이터입니다고압가스전문검사기관은 고압가스의 안전한 사용과 관리를 위해 지정을 받아, 고압가스 관련 설비 및 용기의 검사, 시험, 점검 등의 업무를 수행하는 전문 검사기관입니다.고압가스안전관리법 제36조(권한의 위임, 위탁) 2항 규정에 의하여 행정관청으로부터 전문검사기관에 위탁된 특정설비(저장탱크 및 그 부속품, 차량에 고정된 탱크 및 부속품, 기화 장치)에 대한 재검사 업무를 실시하며 고압가스 안전관리법 시행규칙  제58조의 3(검사기관 지정의 유효기관)에 따라 검사기관 지정의 유효기간은 5년임 ,고압가스안전관리법 시행령 제24조(검사기관의 지정재지정)에 따라 검사기관의 지정 또는 재지정을 받으려는 자는 그 신청서에 산업통상자원부령으로 정하는 서류를 첨부하여 시도지사에게 제출하여야함시·도지사는 제1항에 따라 검사기관을 지정하는 때에는 산업통상자원부령으로 정하는 유효기간을 정하여 지정하여야 하며, 검사기관이 그 유효기간의 만료 전에 재지정을 신청하는 경우에는 제4항에 따른 재지정 기준에 미달하지 아니하는 한 재지정을 하여야 한다.광주광역시 소재 전문검사기관1. 신일가스(주)2. 호남가스검사기관(주)
