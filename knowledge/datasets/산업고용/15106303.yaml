description_portal: 한국수력원자력㈜이 공개하는 태양광 대여사업(REP) 계약 현황 데이터는 한수원이 참여한 태양광 대여사업(REP)의 운영 및 계약 내역을 확인할 수 있는 자료입니다. 이 데이터는 연도별 계약 현황을 중심으로 주택의 종류, 단가(REP), 예상 매수량(년/REP) 등의 세부 항목으로 구성되어 있으며, 태양광 대여사업의 진행 과정과 성과를 객관적으로 보여줍니다. 특히 이 사업은 한국에너지공단이 주관하여 사업자를 모집한 뒤, 차년도에 발전사업자와 계약을 체결하는 구조로 운영되기 때문에 계약년도와 실제 모집년도 간에 1년의 시차가 발생한다는 특징이 있습니다. 또한 태양광 대여사업 신규 사업자 모집이 2021년을 끝으로 종료됨에 따라 이후에는 새로운 데이터가 추가되지 않으며, 따라서 해당 자료는 2021년까지의 계약 현황을 종합적으로 정리한 마지막 데이터로서 의의를 가집니다. 이 데이터를 통해 태양광 대여사업의 추진 경과와 주택 유형별 계약 추세를 파악할 수 있으며, 신재생에너지 확산 정책의 효과를 분석하는 데에도 활용될 수 있습니다.
