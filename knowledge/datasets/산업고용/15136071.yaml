description_portal: "중소벤처기업진흥공단이 내일채움공제 홈페이지 및 모바일 앱 사용자들을 대상으로 진행한 오류찾기 이밴트 설문조사입니다.* 해당 데이터는 2020년 4월 6일부터 4월 10일까지 진행된 이벤트 참여와 관련된 데이터로, 더 이상 업데이트 되지 않습니다.** 칼럼 상세 설명  - 설문조사명 : 내일채움공제 홈페이지 및 모바일 앱 오류찾기 EVENT(4.6~4.10.)으로 고정입니다. - 질문내용 : 설문조사 질문 문항입니다. - 답안내용 : 질문별 답안의 내용을 정리한 내용입니다. - 주관식 답안내용 : 해당 질문내용에 따른 주관식 답안으로, '내용없음' 의 경우 주관식 질문이 없는 경우입니다. - 응답수 : 해당 질문에 대한 답안내용을 선택한 인원수입니다. - 응답비율 : 해당 질문에 대한 답안 내용에 따른 응답비율입니다. 즉, 동일한 질문에 대한 각기 다른 답안의 응답비율을 합하면 소수점 아래 2째 자리 반올림으로 인하여 99~100의 수치가 나오게 됩니다."
