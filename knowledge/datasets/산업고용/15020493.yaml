summary_user: 전국 도시가스사업자별로 수요자 수, 누계공급량(천㎥·천MJ), 배관 길이를 한 행씩 담은 집계 현황 파일(CSV, 약 1.7KB)이다. 에너지 분석가나 사업자가 지역 도시가스사별 공급 규모와 배관망 크기를 비교하는 질문, 예컨대 어느 회사가 수요자 1명당 배관을 얼마나 깔고 있는지 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 도시가스사업자 이름을 매핑해서만 이어 쓸 수 있으며, 지역 코드나 좌표가 없어 행정구역 단위 결합은 어렵다.
description_portal: '한국가스안전공사에서 안전관리 업무 수행 등을 위해 수집, 관리하는 전국 34개 도시가스사별 가스공급 현황 정보 입니다.해당데이터는 전국 도시가스사업자의 수요량, 누계공급량(세제곱미터, 메가줄), 배관길이 등의 현황 정보를 제공합니다. 도시가스 업계 현황 파악이 가능 및 공급수요에 대한 정보를 제공하기 위해 개방된 데이터입니다.연간 주기로 현황정보가 업데이트 되며 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고바랍니다.- 데이터기준일 : 2025년 9월 19일'
