description_portal: 중소벤처기업진흥공단 2023년 재창업자금 수혜 기업 중 초기 재창업 기업(1년 미만)의 지역, 업종, 업력에 대한 데이터. 본 자료를 통해 재창업 기업 관련 공공데이터 구축에 기여하기를 소망함.중소벤처기업진흥공단 정책자금 중 하나인 재창업자금에서, 재창업기간이 초기에 해당하는 중소기업 대상 2024년 지원 현황입니다.※초기기업의 기준은 업력1년 미만 여부로 추출하였습니다.당해(2024)년 재창업자금 초기 기업의 지역, 업종 및 업력에 대한 데이터를 신청내역 건별로 데이터화 하였습니다.상세 내용으로는 광역지자체 단위, 업종(업종1-업종2) 및 1년 이내 업력 여부 등 지원 상세 항목을 제공합니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.
