description_portal: 한국남동발전의 신재생에너지 공급의무화 제도(RPS) 이행 실적 데이터입니다.2014년 1월 부터 2014년 11월 사이 태양광, 연료전지, 소수력, 풍력의 월별 데이터를 포함하고 있습니다.RPS는 발전사업자가 총발전량의 일정 비율을 신재생에너지로 공급하도록 의무화하는 제도로, 이 데이터는 태양광, 연료전지, 소수력, 풍력 등 에너지원별 월간 공급인증서(REC) 발급량을 포함합니다. 이를 통해 한국남동발전의 RPS 의무 이행 현황과 에너지원별 실적 추이를 파악하여, 국가 신재생에너지 정책 연구 및 시장 동향 분석에 활용할 수 있습니다.
