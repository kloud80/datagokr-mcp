summary_user: 전북특별자치도 진안군에서 담배 소매인으로 지정된 업소를 한 곳씩 담은 건별 원장으로, 업소명·지번주소·전화번호·지정일자·법인구분·사업자번호·폐업일을 담는다. 진안군에서 지금 영업 중인 담배 판매점이 어디인지, 새 소매점을 열 자리 주변에 기존 지정 업소가 얼마나 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 사업자번호나 주소·업소명 매핑으로 다른 지자체 인허가(LOCALDATA) 자료나 상가업소 정보와 이어 쓴다.
description_portal: 전북특별자치도 진안군에 있는 담배 소매인 지정에 대한 공공데이터 자료입니다. 이번 자료에서는 순번, 지정된 업소들 명칭, 지정 업소 지번 주소 정보, 업소 전화번호(휴대전화번호 제외), 지정 일자, 법인 구분, 사업자번호, 폐업 일자 등의 정보를 제공합니다. 이 자료 중 업소 전화번호 열에서 공란으로 되어 있는 칸은 개인 휴대폰 전화번호로 제외처리하였습니다. 지정된 업소들이 개인인지 법인인지 확인할 수 있습니다. 그리고 법인구분 열과 사업자번호 열에서 공란으로 되어 있는 칸은 오래 전 자료라 파악하기 어려워 빈 칸으로 표시하였습니다.
