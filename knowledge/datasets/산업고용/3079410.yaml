summary_user: 부산광역시 동구 관내 직업소개소를 한 곳씩 담은 목록으로, 유료·무료 구분, 법인명, 사업소 전화번호와 도로명주소를 담는다. 동구에서 일자리를 찾는 구직자나 사람을 구하는 사업주가 가까운 직업소개소의 위치와 연락처를 확인할 때 쓰고, 분석가는 관내 직업소개소의 유료·무료 비중을 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 법인명을 매칭해 이어 쓰며, 다른 시군구의 직업소개소 현황과 합쳐 지역별 분포를 비교할 수 있다.
description_portal: 「직업안정법」 상 직업소개사업을 위한 신고,등록을 한 자가 해당 사업자에게 신청한 구인자,구직자를 대상으로 자격 있는 직업상담원으로 하여금 직업상담을 통해 구인조건에 적합한 구직자를 알선하여 고용계약이 성립되도록 하는 부산 동구 관내 직업소개소 현황(직업소개소명, 주소, 전화번호)을 제공합니다.
