summary_user: 글로벌 성장 의지와 잠재력을 갖춘 중소·중견기업으로 선정된 월드클래스 300 기업을 한 기업당 한 행으로 담은 명단 파일이며, 기업명·업종·주력제품·신청일·소재지가 들어 있고 범위는 전국이다. 지역 산업정책 담당자나 분석가가 '우리 지역에 어떤 업종의 월드클래스 300 기업이 있고 주력제품은 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 다른 기업 데이터와는 기업명 매칭이나 소재지 주소 기반으로만 이어 쓴다.
description_portal: '월드클래스 기업으로 육성하기 위해 글로벌 기업으로의 성장 의지와 성장 잠재력을 갖춘 중소, 중견기업 300개를 선정하는 이 데이터는, 국가와 산업의 발전을 도모하고 기업 생태계를 활성화하는 데 기여하고자 합니다. 선정된 기업들은 다양한 산업군에서 활동하며, 혁신적인 기술과 제품 개발을 통해 해외 시장에 도전하고 있습니다. 이 데이터는 기업의 성장 가능성과 경쟁력을 한눈에 확인할 수 있는 귀중한 자료로, 정책 입안자들 및 관련 기관에서 산업 정책 수립이나 지원 방안 마련에 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.번호(숫자형): 기업을 식별하는 고유 번호기업명(문자형): 각 기업의 공식 명칭업종(문자형): 기업의 산업 분야주력제품(문자형): 기업의 주요 제품군신청일(날짜형): 선정 신청일자소재지(문자형): 기업의 소재 지역이 데이터는 중소기업의 글로벌 경쟁력을 높이기 위한 정책 수립 및 기업 지원 방향에 활용될 수 있습니다.'
