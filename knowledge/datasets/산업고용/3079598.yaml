summary_user: 경기도 광주시에 등록된 전문건설업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·전문 업종(철근·콘크리트, 도장 등)·영업소재지·전화번호·데이터기준일자를 담는다. 공사를 맡기려는 발주자나 주민이 광주시 안에서 특정 공종을 등록한 업체가 어디에 있고 연락처가 무엇인지 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관(광주시) 단위로만 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시에 등록된 전문건설업체의 현황 정보를 제공합니다. 철근, 콘크리트, 조적, 미장, 방수, 철물, 도장 등 특정 건설 공종을 전문으로 시공하는 업체의 등록 정보를 담고 있습니다. 상호는 업체의 명칭이며, 업종은 전문으로 하는 건설 분야를 나타냅니다. 영업소재지는 업체의 사업장 위치를 제공하고, 전화번호는 업체 연락처를 안내합니다. 데이터 기준일자는 정보의 최신성을 확인할 수 있습니다. 본 데이터는 건설 산업 관리, 적법 업체 확인, 공사 발주 참고, 건설 업체 선정, 건설 통계 분석 등에 활용됩니다.
