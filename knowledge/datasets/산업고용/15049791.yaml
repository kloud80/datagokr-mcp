description_portal: '[창업지원기업의 누적 경영성과] 자료 데이터는 중소벤처기업진흥공단의 청년창업사관학교에 입교하여 창업지원사업 수혜 기업의 대표자 수, 매출, 고용 등 경영성과 현황을 확인할 수 있는 자료입니다.청년창업사관학교는 39세 이하이며, 창업 3년 이내인 청년창업기업을 대상으로 지원하는 청년창업지원사업이며, 입교시 사업화지원금, 창업코칭 및 교육, 글로벌진출지원 등을 지원합니다.항목별 성과는 당해연도 기준이 아닌 조사시점별 성과로 누적된 경영성과이니 활용에 유의하시기 바랍니다.'
