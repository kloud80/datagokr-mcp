description_portal: '국가기술표준원에서 운영하고 있는 제품안전정보포털(센터)에서 제공하고 있는 제품안전 관련 국내리콜 정보를 공유합니다. 이 데이터는 국내에서 안전성 문제로 리콜 조치가 이루어진 제품의 상세 현황을 제공하는 데이터입니다. 리콜 대상 제품명, 모델명, 제조수입사, 리콜 정보 등 필수 정보가 포함됩니다.* 다만, 해당 정보는 API(API 데이터 목록명: 산업통상자원부 국가기술표준원_제품 안전인증 및 리콜 정보)로 제공되고 있는 바, 최근 데이터 수정일 이후 최신 정보를 확인하시고자 하는 분들은 API 데이터를 활용해주시길 바랍니다.'
