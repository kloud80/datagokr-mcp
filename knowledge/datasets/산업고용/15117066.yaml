summary_user: 경기도 중소기업 판로개척 전시회인 G-FAIR에 참가한 기업을 참여년도별로 한 행씩 담은 명단으로, 업체명·대표자명·주소·홈페이지 주소 등을 담고 범위는 시도 단위 비공간 자료다. 지역산업 분석가나 지원사업 담당자가 '어느 해 G-FAIR에 어떤 지역 기업이 참가했고 온라인 홍보 창구가 있는가'를 확인하거나 박람회 참가기업 추적조사에 쓴다. 전역 조인 키가 없어 다른 기업 데이터(인증기업 목록, 지역 기업 현황 등)와는 업체명·주소를 문자열로 맞춰 이어 쓴다.
description_portal: '이 데이터는 G-FAIR에 참여한 기업들의 연도별 참가 현황을 정리한 자료로, 참여년도, 업체명, 업종명, 소재지(광역지자체), 세부 주소, 홈페이지 URL 등의 항목으로 구성되어 있습니다. 대부분 제조업 기반 중소기업들이 참여하며, 각 기업의 위치 및 온라인 접속 정보가 함께 제공되어 지역별 산업 분포, 온라인 기반 마케팅 수준 등을 파악할 수 있습니다. 해당 데이터는 G-FAIR의 기업 참여 현황 분석, 지역산업 활성화 기초자료, 박람회 성과 평가 및 참가기업 추적조사, 공공 지원 사업 타당성 검토 등의 자료로 활용할 수 있습니다. 또한 홈페이지 URL을 통해 기업의 제품 정보와 홍보 현황 파악이 가능해 전시회 후속 성과 측정에도 기여할 수 있습니다.* G-FAIR : 해외 바이어, 국내 유통업체 구매 담당자, VC 투자사 등 다양한 비즈니스 미팅을 제공하는 대한민국 대표 중소기업 판로개척 전문 무역 전시회)'
