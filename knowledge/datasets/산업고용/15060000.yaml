summary_user: 서울에너지공사가 지역난방으로 공급한 열에너지 공급량을 공급일자·지역·지사별로 담은 집계 데이터로, 공급량은 Gcal 단위(heatSupAmt)로 제공된다. 지역난방 운영 담당자나 에너지 분석가가 '어느 지역·지사에서 겨울철 열공급이 얼마나 늘어나는가'처럼 지역 간 공급 편차와 계절별 수요 변동을 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 실측에서 확인되지 않았으므로, 지역명·지사명(또는 지역코드·지사코드)을 이름·코드 매핑해 다른 에너지 사용량이나 지역 데이터와 연결해야 한다.
limits: 표준 행정코드 같은 전역 조인 키가 확인되지 않아, 다른 데이터와 붙이려면 지역명·지사명을 직접 매핑해야 한다. 개발계정은 하루 3,000회 호출로 제한된다.
