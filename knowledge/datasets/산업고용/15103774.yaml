description_portal: 한국수력원자력(주)이 공개하는 해외신재생사업 추진 현황에 대한 데이터입니다.한국수력원자력(주)는 국내 신재생발전 경험을 토대로 해외에서도 육상풍력, 태양광 등 신재생사업을 추진하고 있습니다.해당 데이터는 한국수력원자력(주) 수소융복합처에서 운영 중인 해외신재생사업 관련 데이터 입니다.한수원(주)은 육상풍력인 Bishop Hill, California Ridge, Prairie Breeze, Rattlesnake 사업(미국)을 운영하고 있으며 태양광인 Guadalupe 사업(칠레)을 운영 중에 있습니다. 이 데이터는 사업별 에너지원, 국가, 사업명, 용량, 추진현황, 운영기간에 관한 데이터를 포함하고 있습니다.
