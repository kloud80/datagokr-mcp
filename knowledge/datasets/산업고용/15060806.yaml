description_portal: 한국수력원자력㈜이 공개하는 4차 산업혁명기술 적용 자동예측진단 기술개발 현황 데이터는 원전 핵심설비를 대상으로 한 예측진단 알고리즘 개발 현황을 정리한 자료입니다. 이 데이터는 번호, 기기명, 기능위치, 진단기법, 열화상, 발전소, 완료연도 항목으로 구성되어 있으며, 자동예측진단 기술을 적용하여 설비의 상태를 실시간으로 분석하고 고장을 사전에 예측하는 데 활용됩니다. 특히 진동 분야와 열화상 분야의 예측진단 알고리즘 개발이 집중적으로 추진되고 있으며, 이를 통해 원전 설비의 안정성 및 효율성을 높이는 것이 목적입니다. 해당 자료는 4차 산업혁명기술을 활용한 설비관리 혁신 사례로서 연구개발 및 운전·정비 분야에서 활용도가 높습니다.
