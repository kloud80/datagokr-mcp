description_portal: 중소기업 기술개발 지원사업의 수행을 통해 우수한 성과를 창출한 기업인 "우수성과 50선" 선정 현황이다. 사업화, 전략기술, 한계재도전, 공공혁신 등 4개 분야를 선정하며 각 분야별 선정 기분은 다음과 같다.(사업화) 기술의 완성도와 기술사업화를 통한 과제매출액, 매출액 성장률 등 사업성을 검토(전략기술) 국가전략기술, 에너지·환경 분야 부합성 및 독보적인 기술력 보유 여부, 산업적 파급효과를 검토(한계재도전) 경영상 위기를 극복하고 재도전에 성공한 기업의 성공스토리의 차별성 등 검토(공공혁신) 공공 서비스 개선 및 국민생활 향상 등의 사회적 기여도가 높은 조달 혁신 성과 검토
