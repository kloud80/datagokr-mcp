summary_user: 충청북도 단양군에 설치된 고압가스저장설비를 시설 한 곳당 한 행으로 담은 파일로, 시설명·주소·저장 가스 종류·관리기관(업체명)을 기록하며 파일 크기는 약 1.9KB 규모의 소량 목록이다. 주민이나 안전 담당자가 '우리 동네 어디에 어떤 가스를 저장하는 고압가스 설비가 있고 누가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 시설·업체명을 맞춰 보거나 시군구 이름으로만 이어 쓴다.
description_portal: 충청북도 단양군 고압가스저장설비 설치 현황을 정리한 데이터입니다. 순번, 시도, 시군구, 시설명, 주소, 사용(저장)가스 종류, 관리기관 또는 업체명, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 고압가스저장설비 설치 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 11일입니다. 담당부서는 단양군 관광건설국 경제과이며 문의주시면 최신의 충청북도 단양군 고압가스저장설비 설치 현황을 열람하실 수 있게 도와드립니다.
