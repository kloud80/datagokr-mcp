summary_user: 서울특별시 양천구 관내 단란주점 영업 인허가를 업소 한 곳당 한 행으로 담은 원천 원장으로, 사업장명·인허가일자·영업상태와 폐업일자·지번/도로명 주소·좌표·소재지면적·업태·종사자수·급수시설 등을 포함한다. 구청 위생 담당자나 상권 분석가가 '양천구에서 지금 영업 중인 단란주점은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 좌표(X, Y)를 활용해 소상공인 상가업소 같은 상권 자료와 위치 기준으로 비교한다.
description_portal: 서울특별시 양천구 관내에서 주류를 제공하며 단란주점으로 영업하는 사업자가 법령에 따라 신청하고 승인받은 인허가 사항을 체계적으로 정리한 데이터이다. 본 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수, 급수시설명 등의 항목이 포함된다. 이를 통해 지역 내 단란주점 운영 현황을 객관적으로 확인할 수 있으며, 영업자의 행정 서비스 제공과 정책 수립, 안전·위생 관리 강화 등의 공공 목적 의사결정에 활용된다* 단란주점영업 - 주류와 함께 음식류를 조리 및 판매하는 곳으로 손님이 노래를 부르는 행위가 허용되는 업소
