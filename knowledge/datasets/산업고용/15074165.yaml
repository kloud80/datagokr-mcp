description_portal: 이 데이터는 한국남부발전의 RPS(신재생에너지 공급의무화제도) 이행 현황을 연도별로 정리한 자료입니다. 각 연도의 공급 의무량(kREC), 실제 이행량(kREC), 이행률(%)을 포함하고 있으며, 남부발전이 신재생에너지 의무공급 제도를 얼마나 충실히 수행했는지를 수치로 확인할 수 있습니다. 이를 통해 연도별 재생에너지 보급 성과와 정책 목표 달성 수준을 평가할 수 있으며, 나아가 탄소중립과 에너지 전환을 위한 공기업의 노력을 살펴볼 수 있습니다. 본 자료는 재생에너지 정책 이행 실적을 분석하고, 향후 신재생 보급 확대 전략 수립에 기초 자료로 활용할 수 있는 유용한 데이터입니다.
