summary_user: 월드잡 플러스의 해외취업 모집공고를 공고 한 건 단위로 담은 API로, 전국 기준 564건 전체가 수신되며 국가·직종·경력 요건·모집 인원·모집 기간·필수 언어·비자 유형 등을 포함한다. 해외취업을 준비하는 구직자가 원하는 국가와 직종에서 지금 모집 중인 공고가 무엇인지 찾거나, 분석가가 국가·직종별 모집 수요를 살피는 데 쓴다. 전역에서 통하는 조인 키가 없어 다른 채용·직업 데이터와는 직종명·국가명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 한국산업인력공단 월드잡 플러스에서는 해외취업을 원하는 구직자들을 위해 다양한 국가와 직종, 업종, 경력 수준에 따른 모집공고 정보를 공공데이터로 제공합니다. 이 데이터는 각 해외취업 공고의 국가명, 직종명, 업종명, 경력 요건, 모집 인원 수, 모집 기간, 필수 언어, 비자 유형, 알선 기관명 등의 상세 정보를 포함하고 있습니다. 이를 통해 구직자들은 자신에게 적합한 해외취업 기회를 손쉽게 탐색하고, 지원 여부를 결정하는 데 필요한 정보를 확보할 수 있습니다. 또한, 이 데이터는 해외취업 시장의 동향을 분석하거나, 특정 국가나 직종에 대한 취업 수요를 파악하는 데에도 유용하게 활용될 수 있습니다.
