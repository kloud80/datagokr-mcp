summary_user: 노인일자리 업무시스템에서 쓰는 코드 마스터로, 시도·시군구 코드와 명칭을 담은 지역코드 목록과 수행기관 코드·기관명을 담은 기관코드 목록을 전국 시군구 단위로 제공한다. 노인일자리 관련 다른 OpenAPI를 호출하려는 개발자·분석가가 '우리 시군구의 지역코드나 노인일자리 수행기관 코드가 무엇인가'를 확인해 요청변수로 넣는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 노인일자리 API와는 기관코드(orgCd)·시도/시군구 코드로, 다른 데이터와는 시도·시군구 명칭 매핑으로 연결한다.
description_portal: 한국노인인력개발원에서 운영하는 노인일자리 업무시스템의 코드 정보 중 지역코드와 기관코드를 조회하는 OpenAPI 서비스입니다. 지역코드 목록 조회 서비스는 광역자치단체인 시도 코드, 시도 명칭, 기초자치단체인 시군구 코드, 시군구 명칭 등 전반적인 지역 현황 정보를 제공하며, 기관코드 목록 조회 서비스는 기관 코드, 기관 명칭 등 전반적인 기관 현황 정보를 제공합니다. 조회된 데이터는 노인일자리와 관련된 한국노인인력개발원의 타 OpenAPI 및 오퍼레이션에서 요청변수로써 원하는 데이터의 조회에 사용될 수 있습니다.
