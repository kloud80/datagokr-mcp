summary_user: 한국서부발전이 운영하는 발전소의 호기별·발전원별 설비용량(MW), 발전량(MWh), 열효율, 이용률을 일자 단위로 담은 발전 실적 API이며, 범위는 전국·비공간입니다. 에너지 분석가가 서부발전의 특정 발전소·호기가 일정 기간 얼마나 가동되고 효율이 어땠는지, 석탄·가스 등 발전원별 실적이 어떻게 다른지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명(genNm)·발전원 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 필수 파라미터 mode에는 다른 데이터에서 받은 코드를 먼저 조회해 넘겨야 한다. 개발계정은 하루 100회로 호출이 제한된다. 전역 조인 키가 없어 전력거래소 수급·SMP 등 타 기관 데이터와는 이름 기준으로만 맞춰야 한다.
