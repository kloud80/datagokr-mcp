description_portal: 이 데이터셋은 서울 강서구 마곡지구에 입주한 기업들의 현황을 정리한 자료입니다. 각 기업의 기본 정보로 기업명, 업종, 업종코드, 주요 사업 분야, 기업 규모, 대표자명, 소재지 주소가 포함되어 있으며, 마곡지구를 중심으로 조성된 바이오·연구개발(R&D)·첨단산업 클러스터의 산업 생태계를 파악할 수 있습니다. 이를 통해 기업의 산업별 분포, 대기업과 중견·중소기업 간 규모 차이, 그리고 지역 기반의 산업 특성을 분석할 수 있으며, 정책 수립, 기업 지원, 연구 및 네트워킹 등 다양한 공익적 목적으로 활용 가능한 데이터입니다.
