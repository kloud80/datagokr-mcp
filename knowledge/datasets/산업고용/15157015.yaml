summary_user: 한국중부발전 사업소별로 석탄재 등 폐기물을 계량한 일시마다 폐기물명과 실중량을 담은 계량 건별 데이터로, 년·월·일과 발전소를 조건으로 조회한다. 발전소 부산물 관리나 자원순환을 분석하는 사람이 특정 발전소에서 어느 날 석탄재가 얼마나 재활용 반출됐는지를 확인하는 데 쓴다. 전역 조인 키는 없고 사업소 코드(plantCd)로 같은 기관의 다른 발전소 배출·측정 데이터와 이어 쓰며, 타 기관 데이터와는 발전소 이름 매핑으로만 연결된다.
description_portal: 년, 월, 일, 발전소를 기준으로 계량일자별 폐기물명, 실중량을 조회 하는 중부발전 일자별 석탄재활용 정보 조회 서비스 입니다.
