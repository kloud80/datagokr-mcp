summary_user: 고용24 직업정보 OPEN API의 고유 직업코드(KONET)와 직업명을 한국고용직업분류(KECO)·한국표준직업분류(KSCO) 코드·명칭에 연결한 전국 단위 코드 매핑 파일(CSV)이다. 고용24 직업정보 API를 호출할 직업코드를 찾거나, 특정 직업이 KECO·KSCO 어느 분류에 속하는지 확인해 채용·훈련·자격 데이터와 맞추려는 개발자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, KECO·KSCO 코드나 직업명 매핑으로 같은 분류 체계를 쓰는 채용공고·직업훈련·고용통계 데이터와 이어 쓴다.
description_portal: '한국고용정보원_고용24_직업코드 직업분류코드 매핑정보본 자료는 한국고용정보원에서 제공하는 고용24 OPEN API(직업정보)의 고유 직업코드(KONET)와 범용 직업분류 체계를 연결한 기준 매핑 데이터입니다. 직업코드 및 직업명을 중심으로, 데이터 결합과 통계 분석에 필요한 한국고용직업분류(KECO) 및 한국표준직업분류(KSCO) 정보를 연계하여 제공합니다.제공되는 직업코드는 고용24 OPEN API를 활용한 직업정보 수집 및 연동 서비스 개발 시 검색 파라미터로 활용됩니다. 또한, 본 매핑 데이터는 범용 직업분류 체계와의 연계를 통해 다양한 고용·노동 데이터와의 원활한 결합을 지원하므로 직업·일자리 데이터 융합 분석, 고용 동향 통계 산출, 맞춤형 채용 추천 AI 모델링 및 일자리 플랫폼 개발 등의 기초 자료로 유용하게 활용할 수 있습니다.*유의사항: 직업코드와 범용 직업분류 체계 간에는 1:1 및 1:N(다중) 매핑 관계가 혼재되어 있으며, 매칭이 불가한 일부 신생·특수 직업은 한국표준직업분류(KSCO) 항목이 공란으로 제공될 수 있으므로 유의하시기 바랍니다.'
