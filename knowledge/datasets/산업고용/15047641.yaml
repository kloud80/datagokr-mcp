summary_user: 중소벤처기업진흥공단 특성화고 인력양성 사업에 참여한 특성화고별로 참여년도, 학교명, 소재지, 전공, 교육 시작·종료일, 참여인원, 교육내용을 담은 전국 단위 사업 참여 명단 파일(CSV, 약 47KB)이다. 우리 지역 특성화고 중 어느 학교가 어떤 전공으로 중소기업 맞춤형 직업교육에 몇 명이 참여했는지 확인하려는 교육·취업 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 학교명이나 소재지 주소를 매칭해 이어 써야 한다.
description_portal: 특성화고는 소질과 적성 및 능력이 유사한 학생을 대상으로 특정분야의 인재양성을 목적으로 하는 교육 또는 자연현장실습 등 체험위주의 교육을 전문적으로 실시하는 고등학교를 일컬으며, 특성화고 인력양성 프로그램은 이러한 특성화고의 학생에게 중소기업 맞춤형 직업교육(취업맞춤반, 중소기업 이해연수, 전공동아리 프로그램 등)을 통해 우수 기능인력 양성 교육을 제공하고 중소기업 취업연계를 이루어내는 것이 목표입니다. 해당 데이터는 사업에 참여한 특성화고의 명단, 참여년도, 소재지, 전공, 시작일, 종료일, 참여인원, 교육내용  등의 상세정보를 포함하고 있습니다.
