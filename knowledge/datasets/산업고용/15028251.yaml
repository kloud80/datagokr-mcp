summary_user: 세종특별자치시에 등록된 직업소개소를 업소 한 곳당 한 행으로 담은 목록 파일로, 법인명·사업소 주소·전화번호·등록일자가 들어 있다(포털 설명 기준 84개소). 구직자나 구인 사업자가 세종시 안에서 가까운 직업소개소를 찾아 연락하거나, 분석가가 지역별 직업소개소 분포와 등록 시기를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 법인명이나 주소 문자열로 맞춰 이어야 하며, 주소를 지오코딩하면 다른 고용 서비스 기관 위치와 함께 지도에 올릴 수 있다.
description_portal: 세종특별자치시 직업소개소 현황을 제공합니다.데이터는 상호, 주소, 전화번호로 구성되어 있습니다. 세종특별자치시에는 총 84개소의 직업소개소가 있으며세종믿음인력,강남인력개발, 전동인력, 휴먼커리어네트워크, 주식회사 중소기업키움센터, 유한회사 세종인력개발, OK인력, 재단법인 세종일자리경제진흥원, 스마트전기인력, 청룡, 제이엔에스티(주) 알밤인력 등의 데이터가 있습니다.이자료는 세종특별자치시 기업지원과에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.
