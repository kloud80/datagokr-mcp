summary_user: 충청남도 아산시에 설치된 태양광발전 설비를 한 행에 한 곳씩 담은 원장형 파일로, 설치년도·설비용량·설치장소·지번/도로명 주소·최초허가일·사업개시일·허가취소일을 포함한다(CSV 약 47만 바이트). 아산시 안에서 어느 지역에 얼마만한 용량의 태양광이 언제 허가되고 가동을 시작했는지, 허가가 취소된 설비는 얼마나 되는지를 보려는 분석가나 주민의 질문에 쓴다. 전역 조인 키는 없으므로 주소(지번·도로명)를 기준으로 전국 태양광발전소 전기사업허가 표준데이터 등 다른 발전소 원장과 이름·주소 매칭으로 이어 쓴다.
description_portal: '가정용 태양광 발전은 태양광 패널을 설치하여 태양 에너지를 전기로 변환하는 시스템입니다. 이를 통해 전기요금을 절감하고 친환경 에너지를 사용할 수 있습니다.가정용 태양광 발전 설치 후 기대 효과1. 전기요금 절감:  월평균 3kW 태양광 설치 시 전기요금 약 4~5만 원 절약, 누진세 부담 완화2. 친환경 에너지 사용: 온실가스 감축 효과, 전력 생산 시 CO₂ 배출 없음3. 정부 보조금 및 세제 혜택: 태양광 보조금 지원으로 설치비 절감, 신재생에너지 사용 가정에 대한 추가 혜택 가능본 데이터는 충청남도 아산시 태양광발전 설치 현황으로 설치년도, 설비용량, 발전소주소, 설치위치, 최초허가일, 사업개시일 의 내용을 포함합니다.'
