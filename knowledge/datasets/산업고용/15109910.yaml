summary_user: 대구 북구 칠성상가시장 안 상점 하나하나를 한 행으로 담은 건별 원장으로, 상호·업종·대표품목, 도로명·지번 주소와 위도·경도, 온누리·전자상품권과 카드단말기 사용 여부, 택배 서비스, 종업원 수를 담는다. 시장을 찾는 시민이나 상권 분석가가 '칠성상가시장에서 온누리상품권을 받고 택배가 되는 가게는 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없으므로 소상공인 상가업소 정보나 전통시장 현황 같은 다른 데이터와는 상호·주소 매칭이나 좌표(위도·경도) 근접으로만 이어 쓴다.
description_portal: 먼저 해당 데이터는 2022년 공공데이터 기업매칭 사업 완료시 구축된 1회성 데이터이며, 더이상 업데이트가 진행되지않음을 말씀드립니다.대구광역시 북구 전통시장 28개 중 하나인 칠성상가시장의 상점정보에 대한 데이터로 상점코드, 상점명, 소재지 도로명주소, 소재지 지번주소, 상접업종분류, 대표품목, 전통시장 상가번영회 가입유무, 온누리 상품권 사용유무, 문화상품권 사용유무, 전자상품권 사용유무, 카드단말기 사용유무, 택배서비스 유무, 종업원 수, 상점홈페이지 주소, 위도, 경도 등의 항목을 제공합니다.
