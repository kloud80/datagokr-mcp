summary_user: 대전에 주사업장을 둔 대한주택건설협회 소속 건설업체를 업체 한 곳당 한 행으로 담은 명단 파일(CSV, 약 22KB)로, 상호명·등록지 주소와 우편번호·배달지 주소와 전화를 담는다. 협력사나 시공 업체를 찾는 사업자, 지역 주택건설업체가 어느 구에 몰려 있는지 보려는 분석가가 대전에서 협회 소속 주택건설업체와 연락처를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서 다른 데이터와는 상호명이나 주소 문자열을 맞춰 연결해야 하며, LOCALDATA 건설업 인허가 원장과 견줄 때도 같은 방식으로 붙인다.
description_portal: 대전광역시 대한주택건설협회 업체 현황 자료는 대전지역에 주사업장을 둔 대한주택건설협회 소속 건설업체를 대상으로 상호명, 소재지 주소, 등록지 우편번호, 전화번호를 비롯해 업체 개별 정보와 업종 분류 등 세부적인 업체 정보를 체계적으로 포함하고 있어, 지역 내 주택 건설업체 현황에 대한 종합적 파악과 더불어 업체 별 위치·규모·연락망 등 건설 자원의 분포를 정확하게 이해할 수 있게 해줍니다. 이는 지역 건설 산업의 구조적 특성 분석, 민간·관공서 대상 정책 지원 및 협력 체계 수립, 업계 네트워크 형성, 신규 사업자·협력사 발굴, 공공 발주 및 민원 대응 등 폭넓은 행정 활용에 기초 자료로 제공 될 수 있습니다.
