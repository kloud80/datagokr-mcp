description_portal: 이 데이터는 대구광역시에 위치한 노사평화의 전당에서 진행되는 노사관련 교육, 행사의 일정에 관한 정보를 포함한 데이터 입니다. 노사평화의 전당은 전국 최초, 유일 상생의 노사관계 상징 공간으로, 시민들에게 노사관계의 역사와 가치에 대해 알릴 수 있는 전시, 체험, 교육 프로그램 등을 운영하고 있습니다. 해당 데이터에는 교육/행사명, 시작일, 종료일, 교육/행사 장소, 주최·주관 기관, 등 다양한 항목이 포함되어 있어 시민들이 쉽게 정보를 확인 할 수 있습니다. 데이터는 csv 형식으로 제공되며 총 225개의 일정 정보가 포함 되어있습니다. 업데이트 주기는 수시입니다.
