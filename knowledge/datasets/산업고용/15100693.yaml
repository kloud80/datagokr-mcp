summary_user: 경기도 여주시 관내 고압가스 저장소를 사업장 한 곳당 한 행으로 담은 파일로, 상호명·소재지 주소·저장 고압가스 종류·인허가 연도·데이터 기준일자를 담는다(파일 크기 약 1.3KB의 소규모 목록). 지역 안전 담당자나 분석가가 '여주시 어느 곳에 어떤 고압가스 저장시설이 있고 언제 인허가됐는가'를 확인하거나 위험시설 위치를 지도에 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호명을 맞춰 보는 방식으로만 연결한다.
description_portal: 경기도 여주시 관내 고압가스 저장시설의 위치 및 인허가 현황을 정리한 데이터입니다. 항목은 사업장 상호명, 소재지(상세주소), 저장 중인 고압가스 종류, 인허가 연도, 기준일자 등으로 구성되어 있으며, 각 시설의 행정구역 단위 위치와 저장물질의 특성을 파악할 수 있습니다. 본 데이터는 가스안전관리, 위험물 취급시설 점검, 재난 예방대책 수립, 인허가 이력 관리, 산업안전 기반 분석 등 행정안전 및 환경 분야의 기초자료로 활용됩니다. 특히 저장소 위치 정보는 GIS 기반 위험시설 밀집도 분석이나 이격거리 기준 검토 등에도 유용하게 쓰이며, 연도별 인허가 현황은 정책적 허용기준 변화나 업종별 확산 경향을 분석하는 데 도움을 줍니다.
