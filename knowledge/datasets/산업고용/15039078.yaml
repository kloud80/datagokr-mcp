description_portal: 중소기업기술정보진흥원, 국가과학기술연구회, 중소기업융합중앙회, 한국테크노파크진흥회가 공동으로 운영하고 있는 중소기업기술혁신센터가 선정한 협력기관 현황이다. 중소기업의 기술애로 해결 및 연구개발(R&D) 지원을 위해 협력하는 공공연구기관, 대학, 공공기관 등으로 구성되어 있다. 협력기관의 주요 역할은 1. 기술 혁신 사업의 수요 발굴 및 조사·분석, 2. 중소기업의 기술 애로사항 해결 지원, 3. R&D 과제 해결을 위한 협력 및 기술 교류 등이다. 연구기관과의 협력 R&D 촉진을 목표로, 기업과 연구자간 상시 대면교류를 통한 협력 네트워크 구축 지원, 센터를 거점으로 참여기관 등과 협력하여 R&D과제 및 기술애로 해결 등을 위한 개방형 사무공간 및 영상회의실 등을 제공한다.
