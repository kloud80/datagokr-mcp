description_portal: '○ 통계개요* 통계명 : 착한가격업소* 작성목적 : 효율적인 경영을 통해 가격이 저렴하지만 양질의 서비스를 제공하는 곳을정부가 지정해 전반적 개인서비스 물가안정에 기여하기 위해* 공표주기 : 매년* 조사체계 : 자치구* 공표범위 : 지역 : 서울시내용 : 외식업 및 기타개인서비스업의 착한가격업소 수○ 용어설명* 2011년부터 물가안정을 위해, 효율적인 경영을 통해 소비자에게 저렴한 가격으로양질의 서비스를 제공하는 곳을 정부와 지방자치단체가 지정, 관리하는 업소* 착한가격업소로 지정되면 금리혜택, 정책자금대출우선지원, 업소운영 컨설팅지원,업소 홍보 및 각 지자체별 다양한 지방공공요금감면 등 다양한 혜택 제공함* 착한가격업소제도 : 지속적인 가격상승에도 원가절감 노력을 통해 저렴한 가격으로질 높은 서비스를 제공하는 가게를 국가가 인증하는 제도○ 기 타* 2012년은 2013년 5월29일 기준* 행정자치부 착한가격업소 정보서비스(goodprice.go.kr) 참고'
