summary_user: 한국가스공사가 운영하는 천연가스 공급관리소별 소속 본부와 주소(시군구 단위)를 관리소 한 곳당 한 행으로 담은 전국 범위 파일(csv)이다. 특정 지역에 가스 공급설비가 어디에 얼마나 있는지, 어느 지역본부 관할인지 확인하려는 분석가나 지역 에너지 정책 담당자가 쓴다. 관리소 이름(관리소)을 키로 가스공사의 다른 관리소·주배관·수요처 현황 데이터와 잇고, 주소의 시군구를 기준으로 지역별 가스 공급·판매량 같은 지역 단위 통계에 연결한다.
description_portal: 한국가스공사의 주요사업인 천연가스의 안전하고 안정적인 공급사업과 관련하여, 천연가스를 공급하는 공급관리소의 전국 시 / 군 / 구별 현황자료입니다.해당 자료를 통해 전국에 걸쳐 설치되어있는 공급설비 현황을 파악할 수 있습니다.해당 자료는 지역별 천연가스 공급설비를 나타낸 것으로 광역기초단위 설치현황, 수요처(발전, 도시가스) 현황, 한국가스공사에서 운영중인 지역본부별 수요처(발전, 도시가스) 현황, 지역본부별 주배관 및 기능별 관리소 현황 자료는 공공데이터로 등록된 자료를참고하여 확인 가능합니다.
