summary_user: 정부부처와 지방자치단체가 시행하는 중소기업 지원사업을 세부사업 단위로 나열하고, 사업마다 소관 기관명과 예산(백만원)을 담은 전국 단위 파일(xlsx)이다. 중소기업·소상공인이나 정책 분석가가 "올해 어느 부처·지자체가 어떤 지원사업에 예산을 얼마나 배정했나"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 지원사업 공고 데이터와는 소관명이나 사업명을 이름으로 맞춰 이어 써야 한다.
description_portal: '* 데이터 개방 목적 : 중소기업의 길잡이로써 사업정보 이용 편리성 향상 및 중소기업, 소상공인의 정책 활용도 향상 및 경쟁력 제고* 데이터 출처 : 기업마당에서 제공하는 지원사업 공고 데이터입니다.* 접속경로 : 기업마당(www.bizinfo.go.kr) > 정책정보 > 지원사업공고  (https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/list.do)* 정부부처, 지방자치단체 공공기관에서 진행하는 중소기업 지원사업 DB 정보를 제공* 구성항목 : 중앙부처, 지자체로 구분 - 소관명, 세부사업병, 예산(백만원) 순'
