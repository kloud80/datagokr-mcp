summary_user: 코로나19 방역조치에 따른 소상공인 손실보상금 신청내역을 개별 사업체·보상년도·분기·차수 단위로 담은 건별 행정자료이며, 범위는 전국이고 포털 CSV 파일(약 20KB)로 활용신청 없이 받는다. 정책 분석가가 집합금지·영업제한 일수와 일매출 감소액, 영업이익·인건비·임차료 비율이 월별 손실보상금 산정에 어떻게 반영됐는지, 업종(세부시설분류)별 피해 규모가 어떤지 확인하는 데 쓴다. 사업자번호(bizno)를 조인 키로 지방행정 인허가(LOCALDATA) 업종별 영업 원장이나 소상공인 상가업소 데이터와 이어 사업체의 업종·위치·영업상태를 붙여 본다.
description_portal: 이 데이터는 소상공인 손실보상금 신청내역으로,  매출감소 및 영업제한 피해를 보상하기 위해 수집된 행정자료이다. 각 행은 개별 사업체 단위의 신청정보를 나타내며, 보상년도와 분기, 차수별 지급대상자 내역ID를 통해 관리된다. 주요 항목으로는 사업자번호, 개업일자, 시도코드·시군구코드 등의 지역정보, 방역조치위반여부 및 공동대표자여부, 매출감소액, 집합금지·영업제한일수, 월별 손실보상금액과 합계금액 등이 포함된다. 이 데이터는 손실보상금 산정근거 분석, 지원정책 효과 검증, 업종별 피해규모 파악 등에 활용될 수 있는 핵심 통계자료이다.
