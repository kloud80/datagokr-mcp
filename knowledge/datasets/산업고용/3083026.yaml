summary_user: 경기도 시군별 고압가스 저장소를 시설 한 곳당 한 행으로 담은 인허가 현황 자료로, 시군명·상호·소재지·저장 가스 종류(질소·수소·암모니아·인화성가스 등)·인허가 연도·데이터 기준일자를 담는다. 지자체 안전 담당자나 분석가가 '우리 시군에 암모니아 같은 위험 가스를 저장하는 시설이 어디에 몇 곳 있고, 인허가된 지 오래된 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명이나 소재지 주소를 기준으로 다른 에너지 업종 인허가 원장(LPG·도시가스 등)이나 행정구역 자료와 이름을 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 고압가스 저장소의 위치, 저장 가스 종류, 인허가 연도 등 안전관리 대상 시설의 현황을 정리한 자료입니다. 주요 항목으로는 시군명, 상호명, 소재지, 고압가스종류, 인허가연도, 데이터기준일자 등이 있으며, 질소, 수소, 암모니아, 인화성가스 등 다양한 위험 가스를 저장하고 있는 시설 정보를 제공합니다. 해당 정보는 고압가스 저장 및 사용에 대한 법적 관리대상 시설의 공간 분포, 위험물질 관리 대상 확인, 안전점검 계획 수립, 인허가 연도별 시설 노후도 분석, 재난 대비 시설 현황 파악 등에 활용될 수 있습니다. 특히 소재지가 도로명주소로 제공되어 위치기반 분석 및 안전지도 구축에도 활용이 가능합니다.
