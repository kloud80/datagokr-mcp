summary_user: 한국가스공사 부산경남지역본부 사업소별 태양광 등 신재생 발전설비의 설치위치·타입·설비용량(kW)과 연도별 1~4분기 발전실적(kWh)을 담은 작은 집계 파일(CSV 475바이트)이다. 가스공사 사업소의 연간·분기별 발전량 추이, 설비용량 대비 발전효율, ESG·탄소저감 실적 산정 같은 질문에 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 등 다른 설비 원장과는 사업소명·설치위치를 이름으로 맞춰 대조해야 한다.
description_portal: 한국가스공사 부산경남지역본부의 신재생에너지 생산 실적 데이터 입니다.신재생에너지 발전현황 관리 및 ESG 경영성과 분석, 에너지 전환 실적 평가, 탄소저감 성과 관리를 목적으로 수집되었습니다. 데이터 구성항목은 사업소명, 설치위치, 타입, 설비용량(kW), 년도, 분기별 발전실적(kWh)으로 이루어져 있어 태양광 발전설비의 운영 현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 사업소별 발전실적 분석, 분기별 발전량 추이 파악, 설비용량 대비 발전효율 평가, 계절별 발전 패턴 분석, 목표 대비 달성률 분석이 가능합니다. 또한 신재생에너지 확대 계획 수립, 설비 투자효과 분석, ESG 경영성과 보고, 탄소저감 실적 산정에 활용됩니다. 부산경남지역의 신재생에너지 발전 성과 관리에 기초자료로 활용됩니다.
