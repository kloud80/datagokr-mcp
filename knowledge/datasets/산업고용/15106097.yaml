summary_user: 한국수력원자력 원전본부 발전소별(고리·새울·월성·한빛·한울)로 자체처분허용농도 미만 방사성폐기물을 규제기관 승인을 받아 소각·매립·재활용 등으로 처분한 내역을 폐기물 종류, 수량, 처분일, 처분방법 단위로 담은 작은 CSV 파일(약 1.6KB)이다. 주민·환경단체·분석가가 "어느 원전에서 어떤 방사성폐기물을 얼마나, 어떤 방법으로 일반폐기물로 처분했나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 원전 데이터(가동·환경방사선·방폐물 저장 현황 등)와는 발전소 이름을 맞춰 연결해야 한다.
description_portal: 한국수력원자력의 원자력발전소에서 발행되는 자체처분허용농도 미만의 방사성폐기물에 대하여 원자력안전법 시행령 제107조(방사성폐기물 자체처분의 절차 및 방법), 동법 시행규칙 제95조 및 관련고시 제2023-7호에 따라 원전본부 발전소별(고리, 새울, 월성, 한빛, 한울) 및 방사성폐기물 종류별로의 자체처분계획서를 규제기관의 승인을 받아 방사성폐기물이 아닌 폐기물로 소각, 매립 또는 재활용 등의 방법으로 처분한 정보(발전소, 폐기물종류, 폐기물수량 ,처분일자, 처분방법)를 제공합니다.
