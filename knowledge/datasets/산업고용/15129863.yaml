summary_user: 춘천시에서 운영 중인 노인일자리 사업을 사업 단위로 정리한 파일로, 수행기관·사업 유형·사업명·사업내용·배정인원·연락처를 담는다. 춘천에 사는 어르신이나 가족이 어느 기관에서 어떤 노인일자리 사업을 하고 몇 명을 뽑는지 확인하거나, 분석가가 유형별 배정인원 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 수행기관명·사업 유형 같은 이름을 맞추거나 같은 기관(춘천시) 자료끼리만 이어 쓴다.
