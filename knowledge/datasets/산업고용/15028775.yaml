description_portal: 본 데이터는 인천광역시 동구 관내에 위치한 행정사사무소에 대한 현황 정보를 제공한다. 수록 항목은 연번, 업체명, 도로명주소, 전화번호, 기준일로 구성되어 있으며, 행정사 등록 현황을 기준으로 정리되었다. 업체명에는 행정사사무소의 명칭이, 도로명주소에는 위치한 주소 정보가 포함되며, 전화번호를 통해 시민이 직접 연락 가능한 정보도 함께 제공된다. 본 데이터는 행정사법에 따라 등록된 사무소의 기본 정보를 제공하여 지역 내 민원 업무 수행 기관에 대한 접근성을 높이고자 한다. 또한 행정사 자격 제도에 기반한 민원대행 서비스의 제공 실태를 파악할 수 있는 기초자료로 활용될 수 있으며 시민의 행정 편의 제고와 함께 행정사 관련 통계·분석 자료로도 응용 가능하다.
