summary_user: 한국서부발전이 운영하는 태양광 발전기별로 하루 단위 행에 01시~24시 시간대별 인버터 출력 발전량(Wh)과 설비용량(MW)을 담은 파일 데이터이다. 분석가나 발전 사업자가 "설비용량 대비 시간대별 발전량이 어떻게 변하고, 특정 발전기의 출력이 떨어지는 날이 있는가"를 확인하거나 태양광 발전량 예측 모델을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장과는 발전기명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 한국서부발전 태양광 발전 시설의 시간별 인버터출력 태양광 발전 정보 입니다. 태양광 발전정보 데이터는 태양광 설비에서 발생한 전력을 실시간에 가깝게 기록하여 발전 효율과 운영 상태를 분석할 수 있도록 정리한 자료입니다. 이 데이터에는 발전설비별 시간대별 발전량 등이 포함되며, 일사량과 기상 조건에 따른 발전 변동성을 직접적으로 보여줍니다. 인버터 출력 데이터는 태앙광 설비의 성능 저하 여부나 이상징후를 조기에 발견할 수 있는 근거가 되며, 시간대별 전력 패턴을 분석하여 예측 모델을 정교화하는데도 활용됩니다.- 데이터 단위는 Wh 입니다.
