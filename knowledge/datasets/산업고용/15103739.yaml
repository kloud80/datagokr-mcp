description_portal: 한국가스공사의 지역별·용도별 도시가스 수요의 기온효과에 관한 자료입니다.기온효과는 기온반응함수와 기온 분포함수를 적분하여 산출한 값으로, 특정 기간 동안 기온이 도시가스 수요에 미친 총 영향을 정량화합니다. 본 데이터는 기온에 의한 수요 변동 분석 및 수요 예측을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 수도권 기온효과 날짜 및 값, 지방권 기온효과 날짜 및 값, 동남권 등 권역별 기온효과 등이 포함되어 있습니다. 본 데이터를 활용하면 기온이 수요에 미친 실제 영향 측정, 지역별·권역별 기온효과 비교 분석, 수요 예측 모델 검증 및 보정, 이상기온 시 수급 대응에 기초자료로 활용할 수 있어 도시가스 수요 예측 정확도 향상과 기상 변화 대응력 강화에 기여할 것으로 기대됩니다..
