summary_user: 전국 단위의 현재 전력수급 현황을 기준일시별로 담는 API로, 현재수요·공급능력·최대예측수요와 공급·운영 예비력 및 예비율을 제공한다. 사업자나 분석가가 "지금 전력 예비율이 얼마이고 수급이 빠듯한가"처럼 오늘의 실시간 수급 상황을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, SMP·발전원별 발전량 등 같은 기관의 다른 전력 데이터와는 기준일시를 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.해당 데이터는 현재의 전력수급 현황을 제공합니다.*전력계통수요, 예비력, 공급능력 등ㅇ 2026.06.30 기존 PUBC 방식에서 GW방식으로 API를 전환했습니다.ㅇ 해당 데이터는 하기 링크에서 파일형태로 다운로드 가능합니다 (3개월 단위 조회 후 저장 가능)ㅇ 링크 : https://openapi.kpx.or.kr/sukub.do'
