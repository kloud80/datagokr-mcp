description_portal: 이 데이터는 산재 근로자의 원활한 직장 복귀를 지원하기 위한 사업주 직장복귀계획서 제출 제도의 운영 현황을 담고 있습니다. 통계는 사업주가 제출한 계획서의 결과를 복귀 예정, 복귀 미정, 기타로 구분하고, 근로자가 공단에 요청한 상담 지원 현황(직장복귀지원금, 대체인력지원금)을 희망/미희망 여부로 세분화하여 제공합니다. 이 제도는 일하다 다친 산재 근로자가 원래 근무하던 직장으로 돌아갈 수 있도록 사업주가 계획을 작성하여 제출하도록 하는 것으로, 이 자료는 재해 근로자의 직장 복귀 과정에서 사업주의 참여 수준과 필요한 지원 서비스 수요를 파악하는 데 필수적인 근거 자료라고 판단됩니다.본 데이터는 산재 근로자의 직장 복귀율을 높이기 위한 정책 설계에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 사업주가 제출한 계획서 중 복귀 미정이나 기타로 분류되는 비율을 분석함으로써, 사업주가 직장 복귀 과정에서 겪는 어려움과 제도적 지원이 필요한 부분을 파악할 수 있습니다. 또한, 근로자들이 직장 복귀 지원금이나 대체 인력 지원금 등 어떤 상담 지원을 필요로 하는지 분석하여, 수요자 중심의 맞춤형 지원 서비스를 강화하고 사업주의 제도 참여 유인을 높이는 정책을 수립하는 데 기여할 수 있다고 판단됩니다.
