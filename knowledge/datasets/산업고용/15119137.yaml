summary_user: 한국산업안전보건공단 홈페이지 사고사망 게시판에 올라온 사망사고 속보를 게시글 단위로 담으며, 게시 번호(arno)와 속보 내용, 속보 이미지 링크를 제공한다. 산업안전 담당자나 분석가가 최근 어떤 작업에서 어떤 원인으로 사망사고가 났는지 사례를 훑어보고 현장 안전교육 자료로 쓴다. 실측 컬럼에서 다른 데이터와 이을 전역 조인 키가 없어, 공단의 국내재해사례·건설업 일별 중대재해 같은 산업재해 데이터와는 사고 내용·이름 매핑으로만 맞춰 본다.
limits: 게시글 번호 외에 업종·지역·사업장 코드 같은 표준 키가 필드에 없어 다른 통계와 기계적으로 결합하기 어렵다. 사고 일자·장소·사상자 규모는 별도 필드가 아니라 속보 내용 텍스트와 이미지 안에 있어 집계하려면 텍스트를 직접 풀어야 한다. 호출 때 callApiId=1040을 고정값으로 넣어야 하며 개발계정은 하루 1,000회로 제한된다.
