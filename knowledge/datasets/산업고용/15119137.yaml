description_portal: 한국산업안전보건공단 홈페이지에서 제공 중인 사고사망 게시판 정보를 실시간으로 조회하실 수 있도록 제공하는 데이터입니다.사망사고 일자, 장소, 사고개요(원인 등), 사망자 및 부상자 규모 등이 제공됩니다.※ 한국산업안전보건공단은 일하는 사람들의 생명과 건강을 보호하기 위해 설립된 산업재해 예방 전문기관입니다.공단은 일터의 안전보건 활동을 돕기 위해 유해·위험요인을 개선하기 위한 기술지원, 작업시설과 환경을 바꿔주는 비용지원, 연구개발 및 안전인증, 안전보건 교육과 자료 개발, 국제협력, 홍보 등다양한 활동으로 안전하고 건강한 일터 만들기에 앞장서고 있습니다.※ callApiId = 1040 (고정값으로 필수 입력)
