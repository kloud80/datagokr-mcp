summary_user: 한국수력원자력 AIMD(인공지능 통합예측진단) 센터가 감시하는 가동원전 설비 현황을 노형·호기별로 감시대상 설비, 진동감시, 열화상감시 항목으로 담은 소규모 집계 파일(CSV 773바이트)이다. 원전 설비 예지정비나 AI 기반 설비감시 도입 수준을 살피는 분석가·연구자가 '어느 호기에서 어떤 설비를 진동·열화상으로 감시하고 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 원전 운영·고장 데이터와는 호기 이름을 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 다른 데이터와는 호기·노형 이름 매핑으로만 이어 붙일 수 있다. 전국 범위의 비공간 데이터라 지역·좌표 단위 분석에는 쓰지 못한다.
