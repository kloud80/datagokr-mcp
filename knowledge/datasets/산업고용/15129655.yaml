description_portal: 한국수력원자력㈜이 제공하는 가동원전 통합예측진단(AIMD) 현황에 관한 공개데이터입니다. 한국수력원자력㈜은 빅데이터와 인공지능(AI) 기술을 적용한 원전 설비 자동예측진단 시스템을 운영하고 있습니다. 해당데이터는 한국수력원자력㈜의 AIMD(AI Monitoring & Diagnosis) 센터에서 운영 중인 감시 대상 설비 운영 현황에 관한 데이터로 노형, 호기, 감시대상 설비, 진동감시, 열화상감시 항목으로 구성되어 있습니다. AIMD는 Artificial Intelligence Monitoring Diagnosis의 약자로 통합예측진단 시스템이라는 의미입니다.
