summary_user: 서울특별시 중랑구에 있는 유료직업소개소의 인허가 정보를 업소별로 담는다. 관리번호, 인허가일자, 영업상태, 폐업일자, 전화번호, 지번·도로명주소, 사업장명, 중부원점TM(EPSG:5174) 좌표가 포함된다. 구직자나 구인 사업자가 '중랑구에서 지금 영업 중인 유료 직업소개소는 어디이고 연락처는 무엇인가'를 확인할 때 쓰고, 다른 데이터와는 전역 조인 키가 없어 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중랑구의 유료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
