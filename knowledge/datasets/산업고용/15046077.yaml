summary_user: 국내 원자력발전소(고리·신고리·새울·월성·신월성·한빛·한울·신한울 8개 발전소)의 호기별 연간 발전량(2019~2025년)과 계통연결 이후 누계 발전량을 MWh 단위로 담은 연도별 집계 파일(CSV, 약 2KB)이다. 에너지 분석가나 연구자가 "특정 원전 호기의 연간 발전량이 최근 몇 년간 어떻게 변했고, 원자력이 전력 공급에 얼마나 기여했는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전·전력수급 데이터와는 발전소명·호기 이름을 맞춰 연결해야 한다.
description_portal: '본 데이터는 국내 원자력발전소의 호기별 발전 실적을 연도별로 정리한 자료입니다.대상 연도: 2019년 ~ 2025년발전소 구분: 고리, 신고리, 새울, 월성, 신월성, 한빛, 한울, 신한울 등 8개 제공 항목: 연간 발전량 (단위: MWh), 누적 발전량 (단위: MWh), (※ 1MWh는 1,000kWh에 해당합니다.)본 데이터로 각 발전소 내 개별 호기별 전력 생산 실적을 확인할 수 있으며, 국가 전력 수급 상황 분석, 원자력발전소의 가동 현황 및 전력공급 기여도 분석, 에너지 정책 수립, 학술 연구 등 다양하게 활용할 수 있습니다.'
