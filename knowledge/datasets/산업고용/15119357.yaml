summary_user: "전북특별자치도에서 허가받은 신재생에너지 발전소를 발전소 단위로 담은 목록으로, 발전소명·시군·주소, 에너지원(원동력: 태양광·풍력·소수력 등), 허가용량, 허가일과 상업운전을 시작한 사업개시일을 기록한다(CSV 파일, 약 2.4MB). 지역 주민이나 사업자·분석가가 '우리 시군에 허가된 태양광 발전소는 몇 곳이고 그중 아직 상업운전을 시작하지 않은 곳은 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없으므로 시군명이나 발전소 주소를 기준으로 전국 태양광발전소 전기사업허가 표준데이터 등과 이름·주소 매칭으로 이어 쓴다."
description_portal: 이 데이터는 전북특별자치도 내에 허가받은 신재생에너지 발전소의 현황을 보여주는 목록입니다. 각 발전소의 명칭, 주소, 허가 용량과 같은 기본 정보와 함께, 에너지원(원동력)이 태양광, 풍력, 소수력 등 어디에 해당하는지를 명확히 구분하고 있습니다. 또한, 발전 사업의 진행 상태를 파악할 수 있도록 허가일과 실제 상업 운전을 시작한 사업 개시일 정보를 포함하고 있어, 아직 운영 전인 시설까지 확인할 수 있습니다. 이 자료는 지역 내 신재생에너지 보급 현황과 에너지 전환 정책의 이행 과정을 파악하고, 전력 수급 계획 및 관련 산업을 분석하는 데 중요한 기초 데이터입니다.
