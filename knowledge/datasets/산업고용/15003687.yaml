summary_user: "한국남부발전(주)이 운영하는 신재생에너지 발전설비를 발전소 한 곳당 한 행으로 담은 원장 파일로, 에너지원(풍력·태양광·ESS·연료전지·소수력·바이오), 자체구축·SPC 구분, 발전소명, 용량(MW), 준공년도를 담는다. 분석가나 에너지 정책 담당자가 '남부발전의 신재생 설비 용량이 에너지원별로 얼마이고 연도별로 어떻게 늘었는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전소 원장(예: 전국 태양광 발전사업 허가 표준데이터)과는 발전소명 같은 이름 매칭으로만 이어 쓴다."
description_portal: 본 데이터는 한국남부발전(주)의 에너지원별 신재생에너지 발전설비 현황 파일데이터입니다.한국남부발전(주)에서 운영하고 있는 다양한 신재생에너지원별(풍력, 태양광, ESS, 연료전지, 소수력, 바이오발전) 구분(자체구축 혹은 SPC), 발전소명, 용량, 준공년도 및 비고 항목으로 구성되어 있습니다.본 파일데이터를 활용하여 한국남부발전(주)에서 운용하고 있는 다양한 신재생에너지 발전설비의 현황을 파악할 수 있으며, 준공년도가 포함되어 있어 연도별 신재생에너지 발전설비의 증가사항을 세부적으로 확인할 수 있습니다.
