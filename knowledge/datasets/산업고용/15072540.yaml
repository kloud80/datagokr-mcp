summary_user: 「산업안전보건법」을 위반한 근로자에게 부과되는 과태료 기준을 위반내용과 세부 위반상황별로 코드화해 과태료 금액과 함께 담은 소규모 코드표 파일(csv 약 1.9KB, 전국 공통)이다. 사업장 안전관리자나 근로자가 '유해·위험작업에서 보호구를 착용하지 않으면 과태료가 얼마인가'처럼 위반 유형별 근로자 과태료 금액을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 위반내용코드·위반내용상세코드를 같은 기관의 코드 체계와 맞추거나 위반내용 명칭을 매핑해 잇는다.
description_portal: 해당 데이터는  「산업안전보건법」을 위반한 근로자에게 부과되는 과태료 기준을 코드화하여 정리한 목록입니다. 항목은 위반내용코드, 위반내용, 위반내용상세코드, 위반내용상세, 과태료금액으로 구성되어 있으며, 세부 위반 상황별로 구체적인 내역이 제시되어 있습니다. 예를 들어, 개인보호구 미착용(코드 00)의 경우에는 세부 상황이 여러 유형으로 세분화되어 있습니다. 유해·위험작업 시 해당 작업 조건에 적합한 보호구를 착용하지 않은 경우, 인체에 해로운 가스·분진·소음·진동 등이 발생하는 장소에서 보호구를 미착용한 경우, 그리고 특정 화학물질을 제조하거나 취급할 때 호흡용 보호구를 착용하지 않은 경우 등이 포함됩니다.
