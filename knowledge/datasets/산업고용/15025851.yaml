summary_user: 부산광역시 동래구 관내에서 영업 중인 석유판매업장을 업소 한 곳당 한 행으로 담은 목록 파일(csv, 약 3KB)로, 구분·상호명·전화번호·도로명/지번주소·위도·경도를 포함한다. 동래구 주민이나 사업자가 '우리 동네 주유소·석유판매소가 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 구 단위 석유판매업소 분포를 지도에 찍어 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓰며, 에너지 업종 인허가 원장(LOCALDATA)이나 오피넷 주유소 유가 정보와 대조할 때도 이 방식을 쓴다.
limits: 동래구 한 개 시군구만 다루므로 부산 전체나 타 지역 비교에는 다른 구 자료를 따로 모아야 한다. 인허가번호 같은 공통 키가 없어 인허가 원장·유가 데이터와 연결할 때 상호명·주소 매칭 오류에 주의해야 한다.
