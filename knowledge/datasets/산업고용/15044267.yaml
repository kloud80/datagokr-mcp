summary_user: 2014년 12월 기준 경기도 용인시 내 전세버스·특수여객 운송업체를 업체 한 곳당 한 행으로 담은 현황표로, 업체 구분·업체명·소재지·보유 차량 대수·전화번호를 담는다(파일 약 2.8KB). 단체 관광·행사·통근 버스를 구하려는 시민이나 단체, 혹은 당시 용인시 전세버스 업체의 규모와 분포를 보려는 분석가가 '용인시에 어떤 전세버스 업체가 있고 각각 몇 대를 보유했나'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 문자열 매칭으로만 이어 쓰며, 같은 지방행정 인허가(LOCALDATA) 계열 자료와 대조할 때도 이름 기준으로 맞춰야 한다.
description_portal: 본 데이터는 2014년 12월 기준 경기도 용인시 내 전세버스 및 특수여객업체의 현황을 제공한다. 주요 항목은 업체 구분, 업체명, 소재지, 보유대수, 전화번호로 구성되어 있으며, 지역 내 전세버스 및 특수여객업체의 운영 규모와 분포를 체계적으로 파악할 수 있다. 이를 통해 단체 이동, 관광, 행사, 통근·통학 등 다양한 교통 수요에 대응할 수 있는 업체별 차량 보유 현황을 확인할 수 있으며, 연락처 정보를 통해 시민과 단체 이용자가 직접 업체를 활용할 수 있다. 자료는 교통 정책 수립, 업체 관리, 운수업 지원, 대중교통 인프라 분석 등 행정적·정책적 활용뿐만 아니라, 지역 교통 서비스 접근성 향상에도 기여한다. 본 데이터는 특정 시점 기준으로 제공되며, 당시 용인시 전세·특수여객업체의 운영 실태와 교통 서비스 현황을 이해하는 중요한 기초 자료로 활용될 수 있다. 공공데이터 개방을 통해 교통 정보의 투명성과 활용성을 높이고, 시민 편의 증진 및 지역 교통 체계 개선에 기여하는 것을 목표로 한다.
