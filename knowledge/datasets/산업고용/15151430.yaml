description_portal: '이 자료는 공공기관이 사전에 국민에게 공개하기로 정한 정보(사전공표정보)에 대한 현황을 정리한 자료입니다. 이 데이터를 통해 어떤 정보가 얼마나 자주, 어떤 방식으로 국민에게 공개되고 있는지 확인할 수 있으며, 정보공개 수준을 진단하거나 투명성 강화 정책의 기초자료로 활용될 수 있습니다.1. 형식: CSV2. 내용 요약:■ 공표분야: 사전공표한 정보의 분야명(예시: 감사.윤리, 경영일반 등)■ 사전공표명: 해당 정보를 사전공표한 정보명(예시: 청렴계약 및 윤리서약 등)■ 공표부서명: 해당 정보를 사전공표한 부서명(예시: 경영관리처 경영관리부 등)■ 공표주기: 해당 정보를 사전공표하는 주기(예시: 수시, 매년 등)■ 공시방법: 해당 정보를 공시하는 방법(예시: 게시판, 알리오 등)3. 활용 예제:■ 공표분야별 공개 현황을 분석하여 정보공개의 편중 여부 진단 및 균형적 공시 체계 마련■ 공표주기와 공시방법 데이터를 기반으로 사전공표 정보의 최신성 및 접근성 개선 전략 수립■ 공표부서별 정보공개 실적을 평가하여 기관 내 책임성과 투명성 제고를 위한 내부 관리체계 강화'
