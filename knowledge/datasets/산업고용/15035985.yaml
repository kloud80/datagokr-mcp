summary_user: 문경시 관내에 설치된 신재생에너지 설비를 사업장 한 곳씩 담은 원장으로, 상호·설치장소 주소·영업구분·원동력 종류·설비용량(kW)·허가일자·사업개시일을 담는다(CSV 약 105KB). 문경시에 어떤 종류의 발전설비가 어느 지역에 얼마만큼의 용량으로 들어서 있고 언제 허가·가동됐는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 설치장소 주소나 상호로 맞춰야 하며, 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 주소·용량을 기준으로 대조해 쓴다.
description_portal: 경상북도_문경시_신재생에너지현황 공공데이터는 관내에 설치된 신재생에너지 설비 현황에 대한 자료로, 순번, 상호, 설치장소소재지, 영업구분, 원동력의종류, 설비용량(킬로와트), 허가일자, 사업개시일, 데이터기준일자 등의 항목을 포함하고 있습니다. 본 데이터는 문경시 신재생에너지 설비의 설치 및 운영 현황을 체계적으로 관리하고, 신재생에너지 보급 실태 분석, 관련 행정업무 수행 및 정책 수립을 위한 기초자료로 활용할 수 있고, 해당 데이터는 문경시청 일자리경제과 녹색에너지팀에서 관리하고 있습니다.
