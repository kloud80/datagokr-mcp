description_portal: 해당 데이터는 창업진흥원이 수집한 창업 기업의 입지 특성에 관한 자료로, 구분별(1), 구분별(2), 대학·연구기관, 산업단지, 일반상업지역, 일반주택지역, 기타지역 항목으로 구성되어 있습니다. 업력, 업종, 기업형태, 창업자 성별, 창업자 연령 등 다양한 기준에 따라 창업 입지의 비율이 백분율로 나타나 있으며, 예를 들어 업력 1년 기업은 일반상업지역에 71%, 일반주택지역에 22.2% 분포하고, 정보통신업은 일반상업지역에 78.3%, 금융업은 91.5%가 일반상업지역에 위치한 것으로 나타났습니다. 또한 창업자 연령별로 20대 이하는 일반주택지역(29.8%), 30대는 일반상업지역(74.5%)에 상대적으로 많이 분포하고 있습니다. 이를 통해 창업 기업의 입지 경향을 연령, 업종, 업력 등 기준에 따라 비교·분석할 수 있습니다.
