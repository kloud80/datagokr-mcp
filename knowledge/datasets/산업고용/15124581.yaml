description_portal: 노인일자리 사업 정책에 적합한 대상자를 분석하기 위한 정보로 통계청의 가계금융복지조사 원자료(RAS)를 분석하여 작성된 기초연금 수급 노인 중 연금 합계액이 월 60만원 미만인 고령자 수에 대한 데이터를 제공하며, 연령대를 66세~70세, 71세~75세, 76세~80세, 81세~85세, 86세 이상으로 구분하고 2016년~2020년까지 연도별로 구분하여 천명 단위로 작성되었습니다. 국민연금에 가구원 중 1인만 가입하는 경우가 있었으므로, 가구 단위에서의 소득수준을 고려하기 위해 연금 합계액은 개인 단위의 기초연금 수급액, 가구 단위의 공적연금 수급액을 합산하였으며, 기초연금 수급 노인 중 연금합계액이 60만원 미만이면서, 근로, 사업소득이 있는 경우만 산정하였습니다.
