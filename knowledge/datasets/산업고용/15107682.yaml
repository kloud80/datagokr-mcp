summary_user: '2021년 1월부터 12월까지 하루 단위로 연료원별 전력거래량(MWh)을 육지와 제주로 나눠 담은 집계 파일이다. 에너지 분석가나 연구자가 2021년 한 해 동안 제주와 육지의 발전 연료 구성(예: 신재생·LNG·석탄 비중)이 날짜별로 어떻게 달랐는지 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자·지역(육지/제주)·연료원 이름을 맞춰 연결해야 하며, 같은 기관의 SMP·발전량 데이터와 일자 기준으로 이어 쓴다.'
limits: 2021년 한 해치 고정 파일이라 오늘의 수급이나 최근 거래량은 담지 않는다. 지역은 육지·제주 두 구분뿐이라 시도·발전소 단위 분석에는 쓸 수 없고, 다른 데이터와 붙이려면 연료원·지역 이름을 직접 매핑해야 한다.
