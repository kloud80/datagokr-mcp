description_portal: 한국광해광업공단은 1978년부터 시행한 해외자원개발 조사사업의 목록을 연도별, 대륙별, 국가별, 광산 이름, 광종 정보로 정리하여 제공합니다. 이 데이터는 한국광물자원공사 시절부터 이어져 온 사업의 전반적인 현황을 파악할 수 있는 중요한 자료로 활용됩니다. 제공되는 정보는 각 사업의 진행 시기, 대상 국가 , 개발된 광산의 종류, 자원  등을 포함하고 있어, 해외 자원 개발 전략 수립 및 정책 분석에 필수적인 기초 자료로 활용됩니다. 또한, 해당 정보는 공공데이터포털을 통해 공개되어 있어 누구나 자유롭게 접근하고 활용할 수 있습니다. 이를 통해 과거 자원 개발 사업의 성과와 교훈을 분석하고, 향후 전략을 수립하는 데 기여하고 있습니다.
