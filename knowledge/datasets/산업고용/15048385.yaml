summary_user: 경상남도 지방산지관리위원회 심의를 거친 도내 채석단지 신고 현황을 필지 단위 건별로 담는 파일로, 소재지·지번·용도·면적(제곱미터)·수량(세제곱미터)·허가 시작일과 종료일·수허가자를 기록한다. 사업자나 분석가가 경남의 어느 지번에서 누가 언제까지 토석채취 허가를 받았는지, 허가 기간이 곧 끝나는 채석장이 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어 소재지·지번 문자열을 주소·필지 데이터와 맞추거나 광업·토석채취 허가 원장과 이름으로 매핑해 이어 쓴다.
