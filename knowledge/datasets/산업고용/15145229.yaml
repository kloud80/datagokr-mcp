summary_user: 규제자유특구·실증특례 제도로 규제 적용을 유예받은 기업과 과제를 한 행씩 담은 건별 목록 파일(CSV, 약 39KB)로, 회사명·과제명·특례허용일·데이터 기준일을 담고 범위는 전국이다. 신산업 분야 사업자나 정책 분석가가 "공유미용실 같은 서비스로 실증특례를 받은 기업이 어디이고 언제 허용됐나"를 확인하거나 특례 활용사례를 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 회사명·과제명을 이름으로 맞춰 이어 써야 한다.
