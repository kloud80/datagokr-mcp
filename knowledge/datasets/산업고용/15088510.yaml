description_portal: 중유의 품질기준은 석유 및 석유대체연료 사업법 제24조에 따라 석유제품 품질기준과 검사방법 및 검사수수료에 관한 고시에서 정하고 있습니다.중유는 내연기관용, 보일러용 및 각종 노(furnace)용 등의 연료로서 다음의 품질기준에 적합하여야 한다.소비자가 이해하기 쉽도록 중유의 품질기준과 그 기준항목에 대한 설명을 담았습니다.중유의 품질기준 항목은 인화점, 동점도, 유동점, 잔류탄소분, 물과침전물, 회분, 황분 등이 있습니다.주) 저황유의 공급지역 및 사용시설의 범위는「대기환경보전법」시행령 제40조 및 별표 10의2에 따른다.
