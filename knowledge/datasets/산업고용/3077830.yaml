summary_user: 전국 폐광산 실태조사 결과를 조사년도·광종별·운영상태별로 광산 수를 집계한 소규모 통계 파일(CSV 415바이트)로, 건별 광산 원장이 아닌 전국 단위 비공간 집계입니다. 광해방지 정책 담당자나 분석가가 "금속·비금속·석탄 등 광종별로 폐광산이 몇 곳이며 운영상태는 어떤가"를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 광종 이름이나 조사년도를 기준으로 같은 기관의 폐광산·광해 관련 자료와 수작업으로 맞춰 이어 쓴다.
description_portal: 한국광해광업공단은 광산개발 과정과 폐광 이후 2차 오염 등으로 발생하는 광해를 분석·예방하고 제거하는 광해방지 사업을 실시합니다. 폐석·광물찌꺼기 등 오염원을 차단하고 오염토양 복원, 수질개선, 지반침하 방지 등 광해복구로 자연환경을 깨끗하게 보전하는 동시에 지역주민의 삶의 질을 향상하는 것을 목표로 하고 있습니다. 이와 관련, 전국 폐광산 실태조사 결과를 개방 및 공개합니다.또한, 본 데이터셋은 광종별로 분류되어 있어 각 광종에 따른 폐광산의 실태를 상세히 파악할 수 있습니다. 이를 통해 지역별 특성에 맞는 맞춤형 광해방지 정책 수립에 활용될 수 있습니다.
