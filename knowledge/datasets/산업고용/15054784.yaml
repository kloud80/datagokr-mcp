summary_user: 한국서부발전 발전소별 연료 소비실적을 담은 API로, 필드명상 발전소명(orgnm)과 연월(ym)별로 LNG·유류·석탄·목재 등 연료 종류별 사용량이 집계된 것으로 보인다(필드 의미는 명세에 없음). 에너지 분석가가 '서부발전의 어느 발전소가 월별로 석탄과 LNG를 얼마나 썼고, 연료 의존도가 어떻게 바뀌었나'를 볼 때 쓴다. 전역 조인 키가 없어 다른 발전량·배출 데이터와는 발전소 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 한국서부발전 발전소별 연료 소비실적 조회서비스 오픈API 입니다. 발전기별 및 연료별 연료사용량 데이터는 각 발전기가 전력을 생산하기 위해 투입한 연료의 종류와 사용량을 구체적으로 기록한 자료입니다. 이 데이터에는 유연탄, 중유, LNG 등 다양한 연료 유형별 소모량이 발전기 단위로 구분되어 집계되며, 전력 생산 과정에서의 에너지 효율성과 연료 의존도를 분석하는데 활용됩니다. 또한 동일 연료를 사용하는 발전기간 비교를 통해 설비 효율성, 운전 특성, 정비 상태 등에 따른 연료 소비 차이를 파악할 수 있습니다.
