summary_user: 제주 지역 LNG·유류(바이오중유·중유·경유) 발전량을 날짜별 1~24시 시간대 열로 담은 집계 파일로, 포털 설명상 2023년 5월부터 2024년 3월까지를 MWh 단위로 제공한다. 에너지 분석가가 제주 화력(LNG·유류) 발전이 하루 중 어느 시간대에 얼마나 돌았는지, 계절별로 어떻게 달라졌는지 살펴보는 데 쓴다. 전역 조인 키는 없어 날짜와 시간대를 기준으로 같은 기관(한국전력거래소)의 제주 수급·신재생 발전량 자료와 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당 목록은 2023년5월부터 2024년3월 까지의 LNG, 유류 시간대별 발전량을 제공합니다. - 단위 : 유류 합계(MWh), LNG 합계(MWh) - LNG, 유류(바이오중유, 중유, 경유)'
