summary_user: 한국동서발전이 운영하는 신재생·ESS 설비의 발전량을 일자×발전기 단위로 01시~24시 시간대별로 담은 건별 원천 파일(CSV, 약 754KB)이며, 발전기명·설비용량(MW)·위치·방식이 함께 들어 있다. 연구자나 분석가가 "동서발전 ESS 설비는 하루 중 어느 시간대에 주로 방전하며, 설비용량 대비 출력은 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전기명·위치 같은 이름 매핑이나 같은 기관(한국동서발전) 기준으로만 연결하며, 전력거래소 시간별 발전량·SMP와는 일자·시간대를 맞춰 비교한다.
limits: 표준 발전소 코드 같은 전역 조인 키가 없어 다른 발전 원장과 붙일 때는 발전기명 문자열 매핑에 의존해야 한다. 한국동서발전 운영 설비만 담고 있어 전국 신재생 발전량 전체를 대표하지 않으며, 포털 설명상 '방식' 값은 모두 '방전'으로 표기되어 순수 발전 설비와 ESS 방전을 구분하는 데 주의가 필요하다.
