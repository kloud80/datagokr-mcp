summary_user: 직장 내 장애인 인식개선 교육을 실시하도록 지정된 교육기관의 목록으로, 기관별로 교육기관명·교육종목·활동지역·보유강사·지정일자·전화번호를 한 행씩 담은 전국 범위의 파일(csv, 약 40KB)이다. 사업주나 인사 담당자가 "우리 지역에서 법정 장애인 인식개선 교육을 맡길 수 있는 지정기관이 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육기관명이나 활동지역 이름을 맞춰 연결해야 한다.
description_portal: 장애인고용촉진 및 직업재활법 제5조의2에 따라 직장 내 장애인 인식개선 교육을 실시할 수 있는 직장 내 장애인 인식개선 교육 지정기관의 목록입니다.본 데이터에 존재하는 교육기관을 통해 직장 내 장애인 인식개선 교육을 실시하면 교육을 적합하게 실시한 것으로 인정됩니다.다만, 교육기관 지정 취소사유의 발생 등으로 인하여 데이터의 변동이 있을 수 있으니 주의하여 주시기 바랍니다.문의사항이 있으신 경우, 한국장애인고용공단 인식개선부(1588-1519)로 연락하여 주시기 바랍니다.
