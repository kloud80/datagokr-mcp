summary_user: 경기도 내 고압가스 저장소를 업소 한 곳당 한 행으로 담으며, 시군, 상호, 지번 소재지, 저장 고압가스 종류(질소·암모니아 등), 인허가연도, 데이터 기준일자를 포함한다. 지자체 안전관리 담당자나 분석가가 '우리 시군에 독성·인화성 고압가스 저장소가 어디에 몇 곳 있는가'를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시군 코드·시군명이나 상호·주소를 매핑해 같은 경기도의 다른 에너지 업종 인허가 데이터와 잇는다.
description_portal: 경기도 내 고압가스 저장소 현황입니다. 시군별 고압가스의 종류 및 저장소 위치 정보 등을 제공합니다.※ 고양시는 제외된 데이터 입니다.※ 고압가스는 고압가스 안전관리법의 적용을 받습니다.이 데이터는 경기도 내 고압가스 저장소의 현황을 정리한 자료로, 시군별 저장소 위치와 주요 저장가스 종류, 인허가연도, 데이터 기준일자 등의 정보를 포함합니다. 주요 항목은 시군명, 상호명, 소재지 주소, 고압가스 종류(질소, 암모니아, 인화인 등의 액화 및 압축가스 포함), 인허가연도 및 데이터 기준일자입니다. 본 자료는 고압가스 저장시설의 지역 분포, 주요 가스 취급 종류, 사용 기관의 특성 등을 파악하는 데 유용하며, 산업단지 안전관리, 화학물질 취급 규제, 환경위험 요소 평가 등의 정책 수립에 활용될 수 있습니다. 특히 인화성·독성 물질 저장 여부와 위치 정보는 재난안전관리 및 유해물질 대응 체계 마련 시 필수적인 데이터입니다.
