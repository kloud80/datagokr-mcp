description_portal: 유화연료유  품질기준은 석유 및 석유대체연료 사업법 제31조에 따라 석유대체연료의 품질기준과 검사방법 및 검사수수료에 관한 고시에 규정되어 있습니다.유화연료유는 보일러(가정용을 제외한다) 또는 노(furnace)의 연료로 사용하기 위하여 석유제품인 중유에 물 및 유화제와 혼합한 연료로서 품질기준에 적합하여야 합니다.유화제는 어떤 액체 중에서 그것과 혼합되지 않는 다른 액체를 미립자상태로 균일하게 분산시키기 위해 첨가하는 물질로서, 첨가비율은 3.0부피% 이하이어야 하며 유해물질과 악취 등을 발생시키거나 배관 등을 부식시키지 않고 석유제품, 석유대체연료 등을 포함하지 않아야 합니다.
