summary_user: 서울시 무료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호·사업장명·지번/도로명 주소·좌표·법인구분·영업상태와 인허가·폐업 일자 등 행정 이력을 포함한다. 구직자나 구인 사업자가 '우리 동네에 지금 영업 중인 무료 직업소개소가 어디 있나'를 찾거나, 분석가가 자치구별 개업·폐업 추세를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하고, 좌표(XCRD·YCRD)로 고용센터·상권·교통 등 공간 데이터와 겹쳐 본다.
description_portal: '무료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보ㅇ 데이터 개요: 서울시 무료직업소개소의 인허가 현황으로 인허가, 변경, 폐업 등 행정 이력이 포함됩니다.ㅇ 최신성·관리: 원본이 수시로 갱신되며 메타데이터에 갱신 정보와 제공 형태가 기재됩니다.ㅇ 공간정보: 지번·도로명 주소와 좌표가 포함되어 지도 기반 분석과 행정구역 단위 시각화가 가능합니다.ㅇ 기본 필드: 관리번호, 사업장명, 소재지, 전화, 법인구분, 영업상태, 인허가·폐업 일자 등이 제공됩니다.ㅇ 활용: 허가 추세 파악, 지역 분포 비교, 민원 대응, 점검 우선순위 설정, 정책 수립 근거로 활용 가능합니다.ㅇ 연계: 점검·민원, 고용서비스, 상권·교통 등 외부 공공데이터와 결합 분석에 적합합니다.ㅇ 유의: 일부 결측·서식 차이가 있어 주소 정제, 좌표 검증, 상태값 표준화 등 전처리가 필요합니다.'
