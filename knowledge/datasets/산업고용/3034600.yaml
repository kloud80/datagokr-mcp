summary_user: 광주광역시 동구 관내의 LPG 용기 가스공급업소와 LPG·CNG 자동차충전업소를 업소 한 곳당 한 행으로 담은 소규모 파일(csv 883바이트)로, 구분·업소명·도로명주소·전화번호를 담는다. 동구 주민이나 운전자가 'LPG 용기를 어디서 사거나 문의하나', '근처 LPG 충전소 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 충전소·주유소 데이터와는 업소명이나 도로명주소를 맞춰서만 이을 수 있다.
description_portal: 광주광역시 동구 관내에 있는 가스 공급업소 및 가스 판매업소 데이터 현황입니다. 가스공급업소 및 자동차충전업소가 구분되어 있으며,업소명, 소재지도로명주소, 전화번호를 알 수 있습니다. 가스공급의 경우에는 LPG용기를 구입 및 문의할 수 있는 업체에 대한 정보이며, 자동차 충전소의 경우에는 차량의  LPG충전이 가능한 업소에 대한 정보입니다. CNG충전소는 시내버스 등 버스의 가스 충전에 대한 정보입니다. 가스 공급과 자동차 충전에 대해 관내에 해당하는 업소만 표시되어 있습니다.
