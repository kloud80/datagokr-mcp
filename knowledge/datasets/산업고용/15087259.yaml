summary_user: 경기신용보증재단이 대표자 성별별로 집계한 보증지원 현황으로, 기준연도마다 보증 발급(기한연장 포함) 건수·금액, 사고(원리금 연체 등 부실) 건수·금액, 대위변제 이행 건수·금액을 담은 연도별 집계 자료다. 여성기업 정책 담당자나 분석가가 "경기도 여성 대표 기업이 받은 신용보증 규모와 사고율·대위변제율이 남성 대표 기업과 비교해 어떤가"를 따질 때 쓴다. 전역 조인 키는 없고 기준연도(crtr_yr)와 성별 구분만 있으므로, 다른 연도별 여성기업 통계나 같은 기관 자료와는 연도·이름으로 맞춰 붙인다.
description_portal: '이 데이터는 경기신용보증재단을 통해 여성기업에 제공된 보증지원 현황을 정리한 자료로 대표자 또는 임원의 성별이 여성인 보증업체 현황입니다. 특정 연도를 기준으로 보증 발급 건수와 금액, 기한 연장 여부, 사고 발생 및 이행 실적 등을 포함하여 여성기업의 금융지원 규모와 안정성을 파악할 수 있습니다- 기준일자 : 기준이 되는 연도- 대표자성별 : 남여로 구분되는 대표자의 성별(미확인 제외)- 보증_기한연장 : 기한연장을 포함한 보증서 발급- 사고 : 원리금 연체 등으로 인한 부실발생- 이행 : 피보증업체가 채무를 이행하지 않을 때 보증기관이 대신하여 변제'
