summary_user: KOTRA 수출바우처사업의 모집공고를 공고 건별로 담은 파일 데이터로, 공고명과 사업 시작·종료일자를 담는다(전국 단위, CSV 약 31KB). 수출을 준비하는 중소기업이 지금 신청할 수 있는 수출바우처 모집공고가 무엇이고 사업 기간이 언제인지 확인하는 데 쓴다. 전역 조인 키가 없어 K-Startup·중소벤처24 등 다른 지원사업 공고 데이터와는 공고명·기간을 기준으로 맞춰 보거나 같은 기관 자료끼리만 연결한다.
description_portal: KOTRA에서 공공데이터포털에 개방하는 수출바우처사업 모집공고 데이터는 수출바우처사업에 참여하고자 하는 기업들을 위한 모집 공고와 관련된 정보를 제공합니다. 수출바우처사업은 KOTRA가 주관하는 프로그램으로, 중소기업들이 해외 시장에 진출할 수 있도록 맞춤형 지원을 제공하는 사업입니다. 이 프로그램은 기업이 해외 전시회에 참가하거나, 시장 조사, 마케팅, 수출 상담회 등을 지원 받을 수 있도록 돕습니다. 이 데이터는 수출을 희망하는 중소기업들이 수출 지원 프로그램에 대한 자세한 정보를 얻고, 사업에 신청할 수 있도록 돕는 중요한 자료입니다.
