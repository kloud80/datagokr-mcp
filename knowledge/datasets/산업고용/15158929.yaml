summary_user: 기술은행(NTB)에 등록된 수요기술을 건별로 담으며, 수요기술번호·수요기술명·기술개요·도입목적·구매희망시기·기술이전계약형태·정액/경상기술료 조건·권역명 등을 제공하는 전국 범위의 비공간 데이터다. 기술을 보유한 대학·연구소·중소기업이 '내 기술을 사려는 수요처가 어떤 조건(계약형태·기술료·희망시기)으로 기술을 찾고 있는가'를 확인해 기술이전 상대를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수요기술명·키워드 같은 이름 매핑이나 같은 기관(한국산업기술진흥원)의 기술은행 계열 데이터와 수요기술번호(dmdtchNo)로만 느슨하게 연결한다.
limits: 표준 조인 키(사업자번호·법정동코드 등)가 없어 기업·지역 통계와 직접 결합할 수 없고 이름·코드 매핑이 필요하다. 권역명 외에 공간 정보가 없어 지도 분석에는 맞지 않으며, 개발계정은 하루 1,000회로 호출이 제한된다.
