description_portal: 한국수력원자력(주)는 개인의 권리보호와 개인정보의 유통경로의 투명한 관리를 위해 매년 개인정보 제3자 제공내역을 공개하고 있습니다. 개인정보 제3자 제공은 개인정보보호법 제 17조 1항에 의거하여 정보주체의 동의를 받은 경우, 법률에 특별한 규정이 있는 경우, 공공기관이 소관 업무를 수행하기 위해 불가피하게 수집한 개인정보를 제공하는 경우 등에 개인정보를 제공할 수 있습니다.데이터 내에 개인정보 제공 파일명, 제공일자, 제공목적, 제공기관, 제공항목, 제공형태, 근거 등의 정보가 포함되어 있습니다.
