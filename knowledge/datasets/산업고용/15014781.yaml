summary_user: 장애물 없는 생활환경(BF) 인증을 받은 건축물·시설을 인증 건별로 담은 파일로, 인증구분(예비·본)·인증등급·인증일자와 만료일·시군구·용도·면적·인증기관을 전국 시군구 단위로 싣는다. 장애인·보호자나 지자체 담당자가 우리 시군구에서 BF 본인증을 받았고 아직 만료되지 않은 공공시설이 어디인지 확인하는 데 쓴다. 인증번호(bf_cert_no)가 건별 키이고 지역코드·시군구로 행정구역 단위 통계나 다른 시설 데이터와 이어 쓰며, 직업분류 코드와 잇는 키는 없다.
description_portal: 장애물 없는 생활환경(BF, Barrier Free)인증을 받은 건축물의 정보를 제공합니다. 해당데이터는 인증 발급일, 인증대상, 인증구분(예비, 본) , 인증등급, 지역코드 및 시군구, 인증만료일, 사업장 구분 등 항목을 포함하고 있습니다. 해당 데이터는 한국장애인고용공단의 대표홈페이지(www.kead.or.kr)에서 확인하실 수 있습니다. 한국장애인고용공단의 BF인증 데이터는 분기별로 업로드 하고 있으며, 추가적으로 전체인증기관의 BF인증데이터는 반기별로 업로드 하고 있습니다.
