summary_user: 국내 원자력발전소를 본부·호기별로 나눠 내진설계기준과 보강 후 내진성능 향상값을 최대지반가속도 단위(g)로 담은 소규모 파일(csv 933 bytes)이며, 범위는 전국이고 비공간 데이터다. 국민이나 분석가가 "우리 지역 원전 호기는 설계 기준 대비 내진성능이 얼마나 높아졌나"를 확인하거나 원전별 보강 효과를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 원전·발전설비 데이터와는 본부명·호기명을 직접 맞춰 이어 써야 한다.
description_portal: 한국수력원자력㈜이 공개하는 원자력발전소 내진성능 향상값에 대한 데이터입니다. 국내 원자력발전소의 호기별 내진설계기준 및 내진성능 향상값을 보여주는 공개 데이터로, 구조물, 기기 및 계통에 대한 해석을 통하여 원자력 발전소가 가지고 있는 내진성능값을 확인하고 이를 보강하여 향상시킨 결과에 관한 데이터입니다. 국내 원전별 내진성능 수준 및 보강 효과를 분석하는 데 사용할 수 있습니다. 내진설계 기준과 내진성능향상값의 제공항목의 단위는 g입니다. g는 최대지반가속도를 나타내는 단위로, 중력가속도를 사용합니다. 이는 지진으로 인해 특정 지점이 받는 가속도를 의미하며, 지진의 세기를 나타내는 지표로 활용됩니다.
