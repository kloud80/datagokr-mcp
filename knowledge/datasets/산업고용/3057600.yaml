description_portal: '대구광역시 동구청이 제공하는 ‘주요소(주유소) 현황’ 공공데이터는 사업자명, 소재지지번주소, 소재지도로명주소, 소재지면적, 전화번호, 데이터기준일이 포함되어 있습니다. 해당 데이터는  지역 내 석유 유통망 분포를 지도 기반으로 확인해 응급 대응 체계 및 사고 예방 계획 수립이 가능합니다. 또한 특정 지역 주유소 밀집도 분석을 통해 도로환경 개선, 교통혼잡 완화 및 대체 연료 충전소 설치 시점 선정에 활용 가능합니다. 사업장명: 주유소 또는 석유판매업소의 공식 명칭사업장 소재지: 지번 및 도로명 주소를 모두 포함하여 정확한 입지 정보를 제공전화번호: 각 주유소의 대표 연락처'
