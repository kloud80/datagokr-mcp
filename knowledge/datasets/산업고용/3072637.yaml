summary_user: 한국장애인고용공단에 장애인 채용을 신청한 사업체의 구인신청을 공고 단위로 담은 전국 범위 파일로, 모집직종·고용형태·임금·요구경력·요구학력·자격증·사업장 주소 등을 건별로 기록한다. 장애인 구직자나 취업지원 담당자가 "우리 지역에서 장애인을 뽑는 사업장은 어디이고 어떤 직종·임금 조건인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 채용·사업체 데이터와는 사업장명이나 사업장 주소, 모집직종 이름을 매핑해 이어 써야 한다.
limits: 사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 파일 내려받기 형태라 실시간 구인 현황이 아니며, 받은 시점의 신청 목록만 반영한다.
