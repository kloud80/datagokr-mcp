summary_user: 오늘 전국 전력계통의 수급 현황을 기준일시(년월일시분초)별로 담으며, 공급능력·현재수요·최대예측수요(MW)와 공급예비력·운영예비력(MW) 및 각 예비율(%)을 제공한다. 국민·사업자·분석가가 '지금 전력 예비율이 얼마나 되고 오늘 최대수요 대비 여유가 충분한가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준일시로 시간을 맞추거나 같은 전력거래소의 수급예보·SMP·발전원별 발전량 데이터와 이름 매핑으로 연결한다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다. 해당 데이터는 현재의 전력수급 현황을 제공합니다. *전력계통수요, 예비력, 공급능력 등 ㅇ 2026.06.30 기존 PUBC 방식에서 GW방식으로 API를 전환했습니다ㅇ 기준일시(년월일시분초), 공급능력(단위: MW), 현재수요(단위: MW), 최대예측수요(단위: MW), 공급예비력(단위: MW), 공급예비율(단위: %),운영예비력(단위: MW), 운영예비율(단위:%) 컬럼으로 구성ㅇ 전력계통수요, 예비력, 공급능력 등 데이터와 OpenAPI 제공'
