description_portal: 한국토지주택공사 기술혁신파트너몰 홈페이지 내 토목, 건축, 기계, 전기, 조경 각 공종의  LH 인증 신기술 현황 데이터를 제공합니다. 기술혁신파트너몰은 당사에서 운영중인 중소기업의 혁신 기술과 제품을 보다 쉽고 공정하게 도입하기 위해 마련된 온라인 플랫폼입니다. 2014년부터 특허 정보를 제공하고 있으며 적용유형은 취소, 시범적용, 인증만료, 우수신기술로 나뉘어집니다. 종류는 기술,자재로 나뉘어지며 적용현장의 보기 버튼을 통해 적용년도 및 사업지구에 대해 알 수 있습니다. 25년 27개의 특허가 추가 됐습니다.
