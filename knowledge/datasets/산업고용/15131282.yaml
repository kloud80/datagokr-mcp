summary_user: 한국장애인고용공단의 근로지원인 사업 수행기관을 기관별 1행으로 담은 API로, 전국 165건(검증 수신 165행)에 기관명·전화·팩스·주소·시도구분이 들어 있다. 근로지원인 도움이 필요한 중증장애인 근로자나 사업주가 자기 지역에서 연락할 수행기관이 어디인지 찾는 질문에 쓴다. 조인 키는 주소(excInstnAddr, address)뿐이라 주소 기준으로 다른 지역·기관 데이터와 잇고, 고용 서비스 기관 계열 데이터와 함께 지역별 지원 창구를 살피는 데 쓴다.
description_portal: 근로지원인 서비스 제도는 업무에 필요한 핵심 업무 수행능력을 보유하고 있으나 장애로 부수적인 업무를 수행하는데 어려움을 겪고 있는 중증장애인 근로자가 근로지원인의 도움을 받아 업무를 수행할 수 있도록 지원하는 제도 입니다. 근로지원인 상세 정보는 한국장애인고용공단 대표홈페이지(www.kead.or.kr) 혹은 장애인서비스신청포털(hub.kead.or.kr)에서 확인 가능 합니다.해당 데이터는 한국장애인고용공단 근로지원인 수행기관 실시간 정보 데이터로서 근로지원인 사업을 수행하는 수행기관명, 연락처, 팩스번호, 주소 등의 데이터 항목들을 포함하고 있습니다.
