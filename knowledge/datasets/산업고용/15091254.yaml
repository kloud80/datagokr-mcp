summary_user: 인천광역시 서구 관내에 운영 중인 직업소개소를 한 곳당 한 행으로 정리한 개별 기관 목록으로, 소개소명·유무료 구분·도로명 주소·전화번호·데이터 기준일자를 담는다. 구직자나 구인업체가 서구에서 가까운 유료·무료 직업소개소를 찾을 때, 또는 분석가가 지역 민간 고용서비스 기관의 분포를 파악할 때 쓴다. 전역 조인 키나 기관 코드는 없어 다른 데이터와는 도로명 주소(소재지)나 소개소명으로만 이어 붙인다.
limits: 공통 식별 코드가 없어 다른 직업소개소·고용기관 데이터와 정확히 매칭하기 어렵고, 이름·주소 기반 매칭에 의존한다. 범위가 서구 한 시군구로 한정돼 인천 전체나 타 지역 비교에는 다른 구의 자료가 필요하다.
