summary_user: 2014~2024년 산재보험급여 신청·승인 건수를 연도별 한 행으로 집계한 전국 단위 통계 파일(csv, 640바이트)로, 전체 건수와 사고성·질병성·출퇴근 재해별 신청·승인 건수를 담는다. 분석가나 정책 담당자가 "질병성 재해 승인 건수가 사고성에 비해 해마다 얼마나 늘었고, 출퇴근 재해 승인은 어떻게 변했나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 컬럼을 기준으로 다른 연도별 통계(교통·고용 지표 등)와 나란히 놓고 비교하는 식으로만 이어 쓴다.
description_portal: 이 데이터는 2014년부터 2024년까지 발생한 산업재해 관련 보험급여의 신청 및 승인 건수를 연도별로 집계한 통계 자료입니다. 전체 신청 및 승인 건수는 물론, 재해 유형을 사고성, 질병성, 출퇴근 재해로 세분화하여 각 항목별 신청 및 승인 현황을 상세하게 제공합니다. 특히, 2018년부터는 「산업재해보상보험법」 개정에 따라 출퇴근 재해가 산재보험 적용 대상에 포함되면서 해당 데이터가 별도로 제공되고 있어, 노동 환경 변화에 따른 산재 인정 범위의 확대 추이를 분석하는 데 중요한 기초 자료가 됩니다. 본 자료는 국내 산업재해 발생 및 인정 추이를 종합적으로 이해하고, 사회보험 시스템의 운영 효율성과 형평성을 평가하는 데 유용하게 활용될 수 있습니다.본 데이터는 공공 정책 수립 및 학술 연구에 다방면으로 기여할 수 있습니다. 정책 입안자는 사고성 재해와 질병성 재해의 승인 건수 변화를 비교 분석하여, 산업 안전 정책의 초점을 기존의 "사고 예방"에서 "직업성 질병 예방 및 관리"로 어떻게 전환해야 할지 전략을 수립하는 데 활용할 수 있습니다. 또한, 연구자는 출퇴근 재해 승인 현황을 대중교통 이용률이나 교통 환경 데이터와 결합하여 분석함으로써, 출퇴근 안전 강화 정책의 필요성을 과학적으로 입증하거나 새로운 정책 방향을 제시하는 데 활용할 수 있다고 판단됩니다.
