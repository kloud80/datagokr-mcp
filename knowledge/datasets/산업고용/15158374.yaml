summary_user: 환경표지 인증을 받은 기업의 기업명·연락처·주소와 인증제품명, A/S·판매처 정보를 업체 단위로 담은 전국 범위 조회 API이며, 위치는 개별 주소 수준으로 제공한다. 공공구매 담당자나 소비자가 "이 제품을 만든 회사가 환경표지 인증업체인지, 연락처와 판매처는 어디인지"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기업명·주소 같은 이름 매핑으로만 이어 쓴다.
limits: 사업자번호 같은 공통 키가 확인되지 않아 인허가·기업 데이터와 정확히 연결하기 어렵고, 이름 매칭 시 오류에 주의해야 한다. 개발계정은 하루 100회로 호출이 제한된다.
