description_portal: 환경표지 인증기업명, 연락처, 주소, 인증제품명, A/S 정보, 판매처 정보 등 환경표지 인증기업 정보를 제공합니다. (환경표지인증이란? 환경표지제도는 「환경기술 및 환경산업 지원법」 제17조(환경표지의 인증)에 근거해 국가(기후에너지환경부)가 시행하는 인증제도로서 1992년 4월 첫 출범 이래 제품 전과정에서의 종합적 환경성뿐만 아니라 품질․성능이 우수한 친환경 제품(서비스 포함)을 선별하여 환경표지를 인증하고 있습니다. 환경표지제도는 동일 용도의 제품·서비스 가운데 전과정 각 단계에 걸쳐 에너지 및 자원의 소비를 줄이고 오염물질의 발생을 최소화 할 수 있는 친환경 제품을 선별해 정해진 형태의 로고(환경표지)와 간단한 설명을 표시토록 하는 자발적 인증제도입니다.)
