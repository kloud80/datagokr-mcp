summary_user: 고용24에 등록된 직업정보제공사업자를 사업장 단위로 담은 전국 현황 파일로, 전체 1,484건이 모두 수신되었고 사업장명·소재지·년도 필드로 구성된다. 구직자나 분석가가 특정 지역에 어떤 직업정보제공사업체가 신고되어 있는지 확인하는 질문에 쓴다. 소재지(address)를 조인 키로 삼아 주소 기준의 다른 지역 데이터와 이어 쓰며, 그 밖의 코드표나 사업자등록번호 같은 키는 없다.
description_portal: <매년 공표되는 직업정보제공사업자 현황>직업안정법 제23조에 따라 고용노동부에 신고된 직업정보제공사업체 현황입니다.동 자료는 고용노동부에 신고되어  고용24에 등록되어 있는 직업정보제공사업자 현황입니다. * 직업안정법 제23조*제23조(직업정보제공사업의 신고) ① 직업정보제공사업을 하려는 자(제18조에 따라 무료직업소개사업을 하는 자와 제19조에 따라 유료직업소개사업을 하는 자는 제외한다)는 고용노동부장관에게 신고하여야 한다. 신고 사항을 변경하는 경우에도 또한 같다.
