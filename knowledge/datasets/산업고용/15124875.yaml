summary_user: 한국남부발전이 운영하는 풍력발전소의 연간 발전량을 연도별로 강원도·전라도·제주도 세 지역 열과 평균발전량 열로 정리한 소형 집계 파일(CSV, 359바이트)이다. 신재생에너지 분석가나 지역 에너지 정책 담당자가 '남부발전 풍력은 어느 지역에서 해마다 얼마나 발전했고 지역 간 차이는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 지역 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 한국남부발전이 운영하는 풍력발전소의 연도별·지역별 발전량 현황을 정리한 자료입니다. 강원도, 전라도, 제주도의 풍력발전소에서 생산된 연간 발전량(MWh)과 이를 기반으로 한 평균 발전량이 포함되어 있습니다. 예를 들어 전라도 지역은 상대적으로 높은 발전량을 기록하며, 제주도와 강원도는 지역적 특성에 따라 발전량의 변동을 보입니다. 이 자료는 지역별 풍력자원의 활용 현황과 발전 효율성을 비교할 수 있도록 제공되며, 신재생에너지 보급 현황 파악, 지역별 에너지 정책 수립, 기후변화 대응을 위한 친환경 발전 연구 등 다양한 분야에서 기초 자료로 활용될 수 있습니다.
