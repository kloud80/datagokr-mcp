description_portal: '본 데이터는 국내 부품소재에 대한 국제 비교 평가 내용으로, 평가기관, 분야, 부품명, 평가 내용, 검색 키워드 등의 상세한 데이터를 포함하고 있습니다. 이 데이터는 국내 산업 발전을 위한 기초 자료로 활용될 수 있으며, 기업이나 연구기관에서 부품소재의 성능을 검토하고 개선 방안을 모색하는 데 유용하게 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.평가기관(숫자형) : 평가를 실시한 기관의 고유 아이디분야(숫자형) : 부품소재가 속하는 산업 분야 코드부품명(문자형) : 평가 대상이 되는 부품의 이름내용(문자형) : 부품에 대한 자세한 평가 내용검색키워드(문자형) : 부품을 검색하기 위한 키워드'
