summary_user: 인천광역시 부평구에 있는 담배소매인을 업소 한 곳당 한 행으로 담은 지정 현황 파일로, 업소명·지번주소·도로명주소·지정일자를 개별 주소 단위로 싣는다. 담배소매인 신규 지정을 심사하는 담당자나 창업 예정자가 "예정지 근처에 이미 지정된 담배 판매점이 있는가"를 확인하거나, 분석가가 구 안의 판매점 밀집도를 볼 때 쓴다. 전역 조인 키나 사업자번호 컬럼이 없어 다른 데이터와는 업소명·주소를 맞춰 붙여야 하며, 소상공인 상가업소 정보나 LOCALDATA 업종 인허가 원장과 주소 기준으로 이어 쓴다.
description_portal: '인천광역시 부평구 소재 담배소매인 현황입니다.지역별 담배 판매점 분포 확인, 신규 지정 시 거리 제한 규정 검토, 불법 유통 방지 및 행정 구역 내 상권 분석 등에 활용할 수 있습니다.활용 목적 및 특징○ 신규 지정 심사 기초: 기존 소매인과의 거리(예: 50m~100m 등) 제한 규정 준수 여부 검토○ 유통망 관리 및 지도 점검: 무허가 판매 방지 및 청소년 보호를 위한 정기 점검 대상 선정○ 지역 상권 분석: 편의점 및 소매점 밀집도 파악을 통한 유통 산업 동향 분석○ 행정 데이터 현행화: 폐업, 승계, 위치 변경 등에 따른 인허가 정보의 실시간 관리주요 항목 설명○ 연번: 데이터의 고유 식별 번호○ 업소명: 담배를 판매하는 사업장의 공식 명칭 (상호명)○ 업소지번주소: 소매점이 위치한 필지의 지번 주소○ 업소도로명주소: 건물의 공식 도로명 주소○ 지정일자: 관할 지자체로부터 담배소매인으로 최종 승인받은 날짜○ 데이터기준일자: 해당 통계 자료가 추출되거나 업데이트된 시점'
