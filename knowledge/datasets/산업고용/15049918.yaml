description_portal: 한국가스공사의 연간 화학물질 사용량 데이터 입니다.화학물질 사용현황 관리 및 안전관리, 환경경영 성과 분석, 화학물질 저감 정책 수립을 목적으로 수집되었습니다. 데이터 구성항목은 2016년부터 2020년까지의 연도별 화학물질 사용량(kg), 천연가스 판매량(천톤), 원단위(kg/천톤)로 이루어져 있어 화학물질 사용의 효율성을 종합적으로 평가할 수 있습니다. 본 데이터를 활용하면 연도별 화학물질 사용 추이 분석, 판매량 대비 원단위 변화 분석, 화학물질 사용 효율성 평가, 저감 목표 대비 실적 평가, 물질별 사용현황 파악이 가능합니다. 또한 화학물질 저감 계획 수립, 대체물질 도입 검토, 안전관리 강화 방안 수립, 취급 절차 개선에 활용됩니다. 화학물질 관리법 대응, ESG 경영성과 보고, 안전보건경영시스템 운영 등에 기초자료로 활용되어 안전하고 환경친화적인 사업장 운영을 지원합니다.
