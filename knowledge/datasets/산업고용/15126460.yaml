summary_user: 부산광역시 영도구에 소재한 실내건축업 등록업체를 업체 한 곳당 한 줄로 담은 파일로, 상호·업종·소재지·전화번호·위도·경도·데이터기준일을 담는다(csv 344바이트의 작은 원장). 1,500만원 이상 인테리어 공사를 맡길 때 계약하려는 영도구 업체가 실내건축업에 등록돼 있는지, 어디에 있는지 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호·주소 이름 매칭이나 위경도 좌표로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 건설업 원장이나 다른 구의 실내건축업 현황과 맞춰 보는 식으로 쓴다.
description_portal: 부산광역시 영도구에 소재한 실내건축업체의 현황에 대한 데이터로 상호, 소재지, 전화번호 등의 정보를 제공합니다. 건설산업기본법에 의거한 건문건설업종인 실내건축업에 등록한 업체로 1500만원 이상의 인테리어 공사를 진행할 시에 등록된 업체 확인을 위한 자료입니다. 등록업체에 대한 등록여부 확인은 건설업 등록증이나 등록수첩을 제시받아 확인할 수 있으며, 업체가 소재한 관할 구청 건설업 등록 담당자를 통해서도 확인할 수 있습니다. 큰 규모의 인테리어 공사를 진행할 시에 계약 업체에 대한 조회가 중요합니다.
