summary_user: 서울 양천구 관내 사료제조업소(사료를 제조·수입·판매하는 업소)의 인허가 원장을 업소 한 곳당 한 건으로 담으며, 인허가일·폐업일·휴업기간·영업상태·지번/도로명 주소·좌표·업태구분·축산업무 구분 등을 포함한다. 시민이나 분석가가 '양천구에서 현재 영업 중인 사료제조업체는 어디이고 언제 인허가를 받았나'를 확인하거나 폐업·휴업 추이를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 LOCALDATA 업종 인허가 데이터와는 같은 기관 코드(OGDP_INST_CD)나 업소명·주소 매칭으로 잇고, 좌표(XCRD·YCRD)로 지도 위에 겹쳐 본다.
description_portal: 서울특별시 양천구가 제공하는 본 데이터는 관내 사료제조업체의 인허가 정보를 종합적으로 수집·정리한 자료이다. 데이터에는 인허가 날짜, 업체명, 영업상태, 소재지, 업태구분, 축산업무 구분 등 핵심 항목이 포함되어 있어 각 사료제조업체의 설립과 운영 실태를 체계적으로 파악할 수 있도록 구성되어 있다. 해당 자료는 행정기관에서 업체 관리, 감독, 안전 점검, 정책 수립 등 행정 업무에 활용할 수 있으며, 연구자와 시민은 지역별 제조업체 분포, 생산 현황, 유통 실태 분석 등 다양한 목적에 활용 가능한 정보 자원이다.서울시 양천구 사료제조업 인허가 정보, 양천구의 사료를 제조하거나 수입 및 판매하는 업소 정보입니다.사업자명, 소재지주소, 영업상태, 인허가일자 등의 정보를 포함하고있습니다.
