summary_user: 고용센터가 운영하는 구직자 취업역량 강화프로그램을 과정 단위로 담으며, 고용센터명·프로그램명·과정명·대상자·교육 시작일과 종료일·시작 시간·운영 시간·교육 장소를 전국 범위로 제공한다. 구직자가 "우리 지역 고용센터에서 다음 달에 시작하는 취업 준비 프로그램이 무엇이고 언제, 어디서 열리나"를 확인하거나, 상담사·분석가가 센터별 프로그램 운영 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 고용센터명(orgNm) 같은 이름 매핑이나 같은 기관(한국고용정보원·고용24)의 고용센터 코드로만 이어 쓴다.
description_portal: 구직자의 취업 의욕을 높이고 자신감을 회복하며, 자기 이해를 증진하고 숨겨진 강점을 발견할 수 있도록 다양한 실효성 있는 프로그램을 지속적으로 운영하고 있습니다. 본 오픈API는 이러한 프로그램에 대한 정보를 제공하여 구직자가 성공적인 취업을 준비할 수 있도록 돕습니다. 과정 시작일, 고용센터 관할 청 코드, 고용센터 코드 등을 파라미터로 입력하면, 고용센터명, 프로그램명, 과정명, 대상자, 교육 시작일 및 종료일, 시작 시간, 운영 시간, 교육 장소 등의 상세 정보를 조회할 수 있어 체계적인 취업 역량 강화에 활용 가능합니다.
