summary_user: 대구광역시에 지정된 벤처기업 집적시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 포털 설명 기준 9개소의 지정번호·준공일·최종 지정일·소재지·입주 전체 기업수와 벤처 기업수·대지·건축·지정 면적·연락처를 담는다. 대구에서 벤처기업이 입주할 수 있는 집적시설이 어디에 있고 각 시설에 벤처기업이 몇 곳 들어가 있는지 알아보려는 창업자·입주 희망 기업이나 지역 산업 분석가가 쓴다. 전역 조인 키나 사업자번호 같은 기업 식별 필드가 없어 다른 데이터와는 시설명·소재지 주소를 기준으로 맞춰 이어 쓴다.
description_portal: 대구광역시 소재의 벤처기업 집적시설 지정현황에 대한 자료로서 벤처기업 집적시설은 총 9개소입니다. 소개하는 시설로는 대구테크노파크대구벤처센터, 소프트웨어벤처타워, 경북대학교테크노빌딩, CT IDEA HUB, SW융합테크비즈센터, 대구테크노파크벤처공장, 대구테크노파크대구지식서비스센터, 대구테크노파크 벤처공장2호관, 대구테크노파크 대구융합RD센터 등 입니다.자료에는 각 시설별로  시설명, 지정번호, 준공일, 최종 지정일, 소재지, 사업자명, 전체 기업수, 벤처 기업수, 대지 면적, 건축 면적, 지정 면적, 전화번호, 팩스번호 등에 대한 상세  내용이 소개되어 있습니다. 벤처기업 집적시설 입주를 희망하는 분들에게 유용한 자료입니다.
