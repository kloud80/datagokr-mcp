description_portal: '본 데이터는 국내에서 발생한 방사선 비상 발생 현황 정보를 제공합니다. 이를 통해 방사선 관련 긴급상황의 발생 경향을 분석할 수 있으며, 관련 기관 및 일반 국민이 방사선 비상 대응 역량을 강화하고, 신속하고 투명한 정보공유를 통해 국민의 안전을 확보할 수 있습니다.- 데이터 항목 : 방사선 비상 발생 시설명, 비상 종류, 비상 발생 일자 및 시간, 비상 해제 일자 및 시간, 비상 발령 사유 - 백색 비상 : 가장 낮은 비상 단계로, 방사선 영향이 시설 건물 내부에 국한될 것으로 예상되는 비상사태    (* 청색 비상 :  방사선 영향이 원자력발전소 부지 내부에 국한될 것으로 예상되는 비상사태,  적색 비상 : 방사선 영향이 원자력발전소 부지 밖으로까지 미칠 것으로 예상되는 비상사태)'
