description_portal: 에너지공사 월별 열공급량 정보는 특정 년월을 기준으로 지사 및 지역별 열에너지 공급 현황을 파악할 수 있는 통계 데이터입니다. 지사코드와 지사명, 지역코드와 지역명 항목을 통해 어느 지사에서 어떤 공급 권역을 대상으로 열을 공급했는지 구체적으로 구분할 수 있습니다. 열공급량 항목은 각 지사·지역별로 실제 사용자에게 전달된 열에너지의 규모를 나타내며, 단위 항목을 통해 사용된 계량 단위를 확인할 수 있습니다. 작업일시는 해당 데이터가 생성·등록된 시점을 의미하여 자료의 최신성과 관리 이력을 판단하는 기준이 됩니다. 이 데이터는 열공급 설비 운영계획 수립, 수요·공급 균형 분석, 열수송 손실 검토, 에너지 효율 향상 및 온실가스 감축 정책 수립 등 에너지 공기업의 경영 및 정책 의사결정에 중요한 기초 자료로 활용될 수 있는 정보입니다.
