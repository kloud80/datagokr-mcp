description_portal: 한국디자인진흥원(KIDP)이 운영하는 DKaward 사이트에서는 기관이 주관하는 주요 디자인 관련 공모전의 공지사항을 제공합니다. 해당 페이지에서는 우수디자인 상품선정(GOODDESIGN), 대한민국디자인전람회, 대한민국디자인대상 등 국가적 위상을 지닌 주요 상격과 관련된 안내를 한 곳에서 확인할 수 있습니다. 제공되는 데이터는 공모전 분류, 제목, 내용, 파일명, 게시일로 구성되어 있으며, 공모전 참여자와 업계 종사자들이 필수적으로 확인해야 하는 공식 정보가 포함됩니다. 이를 통해 KIDP가 주관하는 디자인 어워드의 주요 일정, 제출 지침, 결과 공지 등을 체계적으로 확인할 수 있어 공정성과 투명성을 확보하는 데 의미가 있습니다. 본 데이터는 2024-08-20 기준으로 수집·정리된 자료이며, 이후 게시 내용은 변경될 수 있습니다. 최신 정보와 세부 사항은 DKaward 공지사항 페이지에서 직접 확인하시기 바랍니다. (https://award.kidp.or.kr/Notice/notice.do?tp_awards=1&page=1)
