summary_user: 한국남부발전(주)이 출원한 산업재산권을 건별로 담으며, 연도·월을 넣어 조회하면 해당 기간의 발명명칭, 종류(특허·실용신안·상표·디자인 등), 진행상태(등록완료·출원의뢰 등), 등록일을 돌려준다. 분석가나 기술 협력을 찾는 사업자가 남부발전이 어떤 연구개발 분야에서 특허를 확보하고 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발명명칭 같은 이름 매핑이나 같은 기관(한국남부발전) 기준으로만 이어 쓴다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 산업재산권 현황_GW 서비스입니다.해당 API를 통해 사용자는 조회를 희망하는 연도(year)와 월(month)을 입력하고 해당기간 동안의 한국남부발전(주)에서 출원한 산업재산권의 현황을 조회할 수 있습니다.조회 결과는 항목명, 구분(실용신안, 특허, 상표, 디자인권 등), 등록상태(등록완료, 출원의뢰 등) 및 등록일자로 구성되어 있습니다.해당 데이터를 통해 한국남부발전(주)의 연구 개발 분야 등을 파악할 수 있습니다.
