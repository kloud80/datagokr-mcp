summary_user: 워크넷 채용정보에 쓰이는 지역·직종·자격면허·전공·학과계열·산업단지·지하철·언어·강소기업분류 등의 공통코드를 코드 단위(코드값·이름·상위코드)로 담는 전국 범위의 코드 마스터다. 채용공고 API나 직업훈련·자격 데이터를 다루는 개발자·분석가가 '공고에 찍힌 지역코드나 직종코드가 어느 지역·어떤 직종인가'를 풀어 읽는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 지역코드(regionCd)와 상위코드(superCd) 같은 같은 기관 코드값으로 워크넷 채용 데이터와 맞추거나 이름 매핑으로 연결한다.
description_portal: '[공통코드 API - 채용(지역,직종,종류 등)]워크넷에서 제공하는 채용관련 정보 중에서 지역, 직종, 자격면허, 전공, 학과계열, 강소기업 정보 등의 채용정보 전반에 걸쳐 제공되는 공통코드 정보를 제공합니다.<API 사용법>인증키,  공통코드정보 상세구분(지역코드, 직종코드, 자격면허코드,  산업단지,  지하철코드, 전공코드, 언어코드, 학과계열코드 강소기업분류코드 등을 파라미터로 받아,총 건수, 공통코드 분류명, 지역코드, 지역명, 산업단지코드, 산업단지명 등의 결과를 제공합니다.  * 유의사항:  문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
