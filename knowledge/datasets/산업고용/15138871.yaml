summary_user: 한국가스공사가 도시가스회사별·연월별로 공급한 가스의 발열량 실적을 담으며, 고위·저위 발열량을 각각 MJ/Nm3와 Kcal/Nm3 단위로 제공하는 전국 범위의 집계 데이터입니다. 에너지 분석가나 도시가스 사용 사업자가 "우리 지역 도시가스회사가 특정 달에 공급한 가스의 실제 열량이 얼마였나"를 확인하거나, 사용량을 열량으로 환산할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도시가스회사 이름(splcalCpnm)과 대상년도·대상월을 맞춰 연결해야 한다.
limits: 표준 기관코드나 지역코드 같은 조인 키가 없어 지역별 사용량·인허가 원장과는 회사명 매핑으로만 붙일 수 있다. 행정구역 단위가 아닌 전국·비공간 데이터라 지도나 시군구 단위 분석에는 바로 쓰기 어렵다.
