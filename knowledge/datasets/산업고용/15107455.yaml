summary_user: 한국동서발전이 운영하는 신재생에너지 발전소별 발전 실적을 기준일자(ymd), 지역, 발전소명, 발전량(kWh) 단위로 담은 API로, 포털 설명상 2016년 이후 자료를 전국 범위로 제공한다. 연구자나 분석가가 동서발전 신재생 발전소별·지역별 발전량이 연도별로 어떻게 변했는지, 어느 지역의 발전 비중이 큰지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명·지역명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 발전소·지역 표준 코드가 없어 다른 기관 데이터와 정확히 조인하기 어렵고, 이름 매핑 때 표기 차이에 주의해야 한다. 한국동서발전 소속 설비 실적만 담으므로 전력거래소의 전국 실시간 수급이나 발전원별 전체 발전량을 대신하지 못한다. 호출은 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
