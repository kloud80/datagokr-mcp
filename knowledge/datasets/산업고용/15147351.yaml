summary_user: 서울시 상권분석서비스의 상권별 소비 지출 집계 데이터로, 분기(STDR_YYQU_CD)와 상권 단위로 지출 총금액과 식료품·의류신발·생활용품·의료비·교통·여가·문화·교육·유흥 부문별 지출 금액을 담는다. 창업 예정자나 상권 분석가가 특정 상권에서 어떤 부문의 소비가 많은지, 분기별로 어떻게 달라지는지 확인하는 데 쓴다. 전역 조인 키는 없고, 상권코드(TRDAR_CD)와 상권구분코드를 기준으로 같은 서울시 상권분석서비스의 다른 데이터(점포·매출·유동인구 등)와 코드 또는 상권명 매핑으로 연결한다.
description_portal: 이 데이터는 서울특별시 행정동별 유동인구 현황을 분기 기준으로 제공하는 통계 자료입니다. 각 동마다 전체 인구, 성별 인구, 연령대별 인구, 시간대별 인구, 요일별 인구가 포함되어 있어 지역별 생활 패턴을 세밀하게 분석할 수 있습니다. 예를 들어 창5동은 여성과 60대 이상 인구 비중이 높고, 쌍문1동은 심야 시간대 인구가 두드러집니다. 이를 통해 행정동 단위의 인구 구조와 이동 특성을 파악할 수 있으며, 교통 운영, 상권 분석, 복지·교육 정책 수립 등 다양한 분야에 활용할 수 있는 중요한 기초자료입니다.
