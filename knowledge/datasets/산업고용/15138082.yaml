description_portal: 신용보증재단중앙회의 개인보증(햇살론, 근로자햇살론)에 대한 데이터로, 개인보증과 관련하여 보건복지부에 의해 정산된 내역(보증료, 정산액 등)을 일별로 관리합니다.개인정보보호를 위해 개인을 특정할 수 없도록 고유문자로 변환해 제공합니다.정산시작, 종료일, 보증료수납금액 , 보증료계산일자, 보증료계산수납금액, 대출금액, 해지금액등 상세정보를 포함하고 있습니다.개인보증이란 사업자가 아닌 금융취약계층의 개인을 대상으로 보증을 제공해 대출 접근성을 높이는 제도로 2016년 9월에 서민금융진흥원으로 이관되었습니다.헤당 데이터는 개인보증업무 종료 전 건에 대한 정산 내역으로 2015년 이전 데이터만 포함하고 있어 과거 보증 운영 통계 분석 및 보증료 관련 정산 흐름 분석 등에 활용 가능합니다.
