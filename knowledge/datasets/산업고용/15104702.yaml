description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 정부지원금 및 민간부담금 현황을 집약한 공공 데이터입니다.제공되는 정보는 각 사업의 성격(기술개발, 기반조성 등)에 따라 지원된 정부 지원금과, 과제 참여 기관들이 부담한 민간 부담금의 규모를 포함합니다. 기술개발 사업은 신기술 및 제품 개발에 집중하며, 기반조성 사업은 연구 인프라 구축이나 전문 인력 양성 등 기술 개발의 토대를 마련하는 데 중점을 둡니다. 이 데이터를 통해 사용자들은 사업 성격에 따른 정부와 민간의 투자 비중을 파악하고, 에너지 R&D 투자의 재정적 특성을 분석할 수 있습니다.
