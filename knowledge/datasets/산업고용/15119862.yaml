summary_user: 경기도 각 시군의 채석신고 자료를 모은 것으로, 업체별 신고 건마다 시군명·상호, 채석·반출 기간과 입목벌채 기간, 채석장 면적(㎡), 석재 용도(쇄골재·건축용·토목용 등), 총 매장량과 가채매장량(㎥), 산지 주소와 위도·경도 좌표를 담는다. 사업자나 분석가가 "우리 시군 인근에서 지금 신고 기간 안에 있는 골재용 채석장은 어디이고 가채매장량이 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명이나 지번·도로명 주소, 좌표로 토석채취 허가나 국토 공간 규제 자료와 이름·위치를 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 채석업체들의 신고 현황을 정리한 자료로, 시군명, 상호명, 채석 및 반출 시작일자와 종료일자, 입목벌채 기간, 업체 전화번호, 채석장 면적(㎡), 채취 석재의 용도, 총 매장량 및 가채매장량(㎥), 벌채구역 면적, 산지의 도로명 및 지번 주소, 위도·경도 좌표, 비고사항, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 채취용도는 쇄골재, 건축용, 토목용 등으로 나뉘며, 공간 정보가 포함되어 있어 위치기반 분석 및 시각화에도 유용합니다. ※ 본 데이터는 경기도 내 각 시군 자료를 취합한 것으로, 채석신고 및 현황에 대한 문의사항은 해당 시군으로 문의해주시기 바랍니다.
