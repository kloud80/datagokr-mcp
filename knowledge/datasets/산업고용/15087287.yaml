summary_user: 발전5사(남부·서부·중부·동서·남동발전)가 기자재 유자격 인증을 운용하는 품목을 품목번호별로 한 행씩 담은 목록 파일로, 품목한글명·운용구분과 발전사별 인증·운용 여부를 함께 담는다(csv 약 3.9KB의 소규모 전국 단위 비공간 자료). 발전소에 기자재를 납품하려는 업체가 "우리 품목이 유자격 인증 대상인지, 어느 발전사에서 운용하는지"를 확인하거나, 분석가가 발전사 간 인증 품목이 얼마나 겹치는지 비교하는 데 쓴다. 이어 쓸 키는 품목번호(ewp_qualified_item_no) 하나뿐이며, 지역 코드나 표준 품목 코드표가 없어 같은 품목번호 체계를 쓰는 동서발전 기자재 자료와만 연결된다.
description_portal: 한국동서발전의 발전5사 기자재 유자격 인증 품목 정보 데이터입니다. 이 데이터는 발전 기자재의 자격 인증과 관련된 품목별 정보를 담고 있으며, 항목으로는 품목번호, 품목한글명, 운용구분, 그리고 발전5사(한국남부발전, 한국서부발전, 한국중부발전, 한국동서발전, 한국남동발전)의 인증 여부 또는 운용현황 등이 포함됩니다. 이를 통해 품목별로 어떤 발전사에서 해당 기자재를 운용하거나 인증했는지를 확인할 수 있습니다.해당 데이터는 기자재 운용 표준화와 공공기관 간 기자재 공동 활용 여부 분석, 기자재 인증 제도 개선 연구, 발전설비 운영의 품질관리 등과 관련된 학술적 및 정책적 연구에 활용될 수 있습니다. 특히 기자재 품목별 운용 현황 비교, 발전사 간 기자재 수급 체계 분석, 국산화 기자재 도입률 등과 같은 산업 정책 및 설비 신뢰성 분석에 유의미한 기초자료로 사용될 수 있습니다.
