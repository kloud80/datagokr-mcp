summary_user: 서울 강북구에서 인허가된 유료직업소개소를 업소 한 곳당 한 행으로 담는다. 영업 중인 곳과 폐업한 곳이 모두 들어 있고, 인허가일자·영업상태·폐업일자·주소·전화번호·좌표(중부원점TM, EPSG:5174)가 함께 있다. 구직자나 구인 사업자가 "강북구에서 지금 영업 중인 유료직업소개소가 어디 있나"를 확인할 때 쓰고, 분석가는 지역 고용서비스 기관의 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 자치구의 같은 인허가 데이터와는 개방서비스 코드(OPNSFTEAMCODE)·관리번호 같은 기관 코드로 묶고, 그 밖의 데이터와는 주소나 업소명 매핑으로 연결한다.
description_portal: '서울특별시 강북구 유료직업소개소 인허가 정보 데이터는 강북구의 유료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간에 고용계약이 성립되도록 알선하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
