description_portal: '인천광역시가 제공하는 연령별 취업자 현황 공공데이터는 인천 시민의 취업자 현황을 성별과 연령대별로 세분화하여 분기별로 집계한 통계 자료입니다. 이 데이터는 지역 노동 시장의 인력 구조와 연령별 고용 동향, 성별 노동 참여율 등을 객관적으로 파악하고, 세대별 맞춤형 일자리 정책, 고용 안정화 대책, 인력 수급 예측 등의 기초 자료로 활용되는 것을 목적으로 합니다.<주요항목>-성별: 취업자를 남자와 여자로 구분합니다.-분기별: 데이터가 1/4분기부터 4/4분기까지 분기별로 제공되어 계절적 고용 변화를 파악할 수 있습니다.-연령별 구분: 취업자 수를 세부적인 연령 구간별로 분류하여 제공합니다.'
