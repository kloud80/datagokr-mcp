summary_user: 부산광역시 연제구 관내 숙박업소(호텔·모텔·여관·생활숙박시설 등)를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·도로명 주소를 담고 있으며 파일 크기는 약 4KB로 작습니다. 연제구에서 묵을 곳을 찾는 시민이나 관내 숙박업 분포를 살피려는 분석가가 '연제구에 어떤 숙박업소가 어디에 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·관리번호 등)가 없어 다른 데이터와는 업소명이나 도로명 주소로 맞춰 이어야 하고, 지방행정 인허가(LOCALDATA) 숙박업 원장과는 이름·주소 매칭으로 대조한다.
description_portal: 공중위생관리법 제2조의 공중위생업종 중 숙박업소(호텔, 모텔, 여관, 생활숙박시설 등) 현황. 공중위생관리법 제2조의 공중위생업종 중 숙박업소(호텔, 모텔, 여관 등의 손님이 잠을 자고 머물 수 있도록 시설 및 설비 등의 서비스를 제공하는 영업) 업종의 부산광역시 연제구 관내 전체 업소현황으로 영업장 이용에 필요한 기본적인 정보(업체명, 주소, 전화번호)를 개인정보를 제외하여 제공합니다. 관내 공중위생업소 숙박업소(호텔, 모텔, 여관, 생활숙박시설 등) 이용에 도움이 되시기를 바랍니다.(2025.11월 기준)
