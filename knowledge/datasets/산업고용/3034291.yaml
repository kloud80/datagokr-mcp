summary_user: 남양주시에서 허가받은 분뇨·정화조 청소업체를 업체별로 한 줄씩 담은 소규모 파일(약 1KB CSV)로, 업체명·소재지·전화번호·수거지역과 데이터기준일을 담는다. 정화조 청소 의무가 있는 남양주시 건물 소유자나 관리자가 "우리 동네를 수거하는 공인 업체는 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭으로만 연결하며, 지방행정 인허가(LOCALDATA) 업종 원장과 이름·주소로 대조하는 정도로 이어 쓴다.
