summary_user: 한국중소벤처기업유통원이 운영하는 MRO(중소소모성자재) 납품업 종합지원센터에 등록된 공급사를 업체 한 곳당 한 행으로 담은 마스터 목록으로, 상호·우편번호·주소·업태·회사규모·기준일을 전국 범위의 개별 주소 단위로 제공한다. 공공기관이나 기업 구매담당자가 "우리 지역에서 소모성자재를 납품하는 중소 공급사는 어디이고 규모는 어떤가"를 확인하거나, 분석가가 MRO 공급사의 지역·업태 분포를 살펴보는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없으므로 다른 기업 데이터와는 상호명·주소 매칭으로만 이어 쓸 수 있고, 주소를 지오코딩하면 상권·지역 기업 현황 데이터와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: 한국중소벤처기업유통원은 다양한 지원사업을 운영하는 가운데 중소소모성자재 MRO사업을 운영중에 있습니다. 중소소모성자재 납품업 공급사에 대한 데이터는 업체명, 업체주소, 업태, 우편번호, 데이터기준일 등의 정보를 제공합니다.이 데이터는 각 공급사의 상세 정보를 파악할 수 있게 도와주며, 사업 운영과 관련된 중요한 요소들을 포함하고 있습니다.업체명과 업태는 공급사의 기본 정보를 제공하고, 업체주소와 우편번호를 통해 위치를 확인할 수 있습니다.데이터기준일을 통해 제공된 정보의 유효성을 확인할 수 있으며, 이를 바탕으로 효율적인 공급망 관리와 유통 전략 수립이 가능합니다.
