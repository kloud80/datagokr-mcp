description_portal: 사업장별 에너지사용량'은 한국가스공사 사업장별 에너지 사용량을 체계적으로 정리한 데이터 입니다. 사업장별 에너지 소비현황 관리 및 에너지 효율화 정책 수립, 온실가스 배출량 산정, 에너지 비용 관리를 목적으로 수집되었습니다. 데이터 구성항목은 연도, 지역사업장(본사, 강원, 경기, 광주전남, 대구경북, 대전충청, 부산경남, 삼척, 서울, 인천, 전북, 정선, 통영, 평택, 제주), 에너지사용량(TOE) 등으로 이루어져 있어 전사적인 에너지 소비 현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 사업장별 에너지 사용 추이 분석, 에너지 다소비 사업장 식별, 에너지 절감 목표 설정, 사업장간 에너지 효율 비교가 가능합니다. 또한 에너지 효율화 투자 우선순위 결정, 에너지 비용 관리, 절감 실적 평가에 활용됩니다. 온실가스 배출량 산정 기초자료, 에너지 관리시스템 운영, 사업장별 효율화 방안 수립 등 의사결정을 효과적으로 지원합니다.
