summary_user: 경기도 내 전화권유판매업 사업장을 한 곳씩 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·WGS84 좌표와 자산·부채·자본금 규모를 함께 담는다. 소비자가 전화로 판매를 권유한 업체가 정상 영업 중인지 폐업했는지 확인하거나, 분석가가 시군별 텔레마케팅 판매업체 분포와 폐업 추이를 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군 코드(SIGUN_CD)·사업장명·주소 매칭이나 좌표 기반으로만 이어 쓰며, 같은 LOCALDATA 계열의 다른 업종 인허가 현황과 나란히 비교하는 데 쓴다.
description_portal: 본 데이터는 경기도 내 전화권유판매업(텔레마케팅 기반 통신판매) 사업장의 현황을 집계한 자료로, 소비자 보호 및 통신판매업 관리 등을 위해 제공됩니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘소재지지번주소’, ‘도로명우편번호’, ‘WGS84 위도·경도’ 등이 포함되어 있으며, 운영 중인 업체와 폐업 업체를 구분하여 확인할 수 있습니다. 이 데이터는 전화권유를 통한 상거래 형태에 대한 감시 및 관리, 폐업업체 이력 확인, 영업현황 분석, 소비자 피해 예방 등의 정책적 활용이 가능하며, 위치 기반 사업 분석과 통신판매업체 등록관리 실태 파악에도 유용하게 활용될 수 있습니다.
