summary_user: 한국남부발전 행원소수력 태양광 설비의 발전실적을 일자·호기별로 담은 파일로, 하루 총량·평균·최대·최소 발전량과 1~24시 시간별 발전량(kW)을 함께 기록한 건별 운영 실적이다. 분석가가 이 발전소의 계절·일조 변화에 따른 시간대별 발전 패턴을 보거나 태양광 발전량 예측 모델의 학습 데이터를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜(년월일)나 발전소 이름으로 맞춰 붙여야 하며, 기상 관측이나 다른 발전소 실적과 비교할 때도 같은 방식으로 연결한다.
limits: 표준 지역·설비 코드가 없어 다른 데이터셋과 키로 바로 조인되지 않고, 이름이나 같은 기관 코드로만 연결된다. 실시간 전력수급 데이터가 아니라 단일 발전소의 파일 실적이므로 전국 수급이나 시장가격 판단에는 쓰지 않는다.
