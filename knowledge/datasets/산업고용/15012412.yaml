summary_user: 한국가스기술공사의 가스시설물 긴급복구 장비를 사업장별로 정리한 목록으로, 한 행에 사업장명·주소·전화번호·장비명(카고크레인, 굴삭기 등)·수량·보유장소를 담는다. 전국 범위의 개별 주소 단위 자료다. 재난 대응 담당자나 분석가가 '가스시설 사고가 났을 때 가장 가까운 사업장에 크레인이나 굴삭기가 몇 대 있는가'를 확인하거나 장비 배치를 점검하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업장명이나 주소 문자열을 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 (주)한국가스기술공사의 가스시설물 긴급복구 장비 보유 현황을 사업장별로 정리한 자료입니다. 평택기지지사 등 각 사업장의 주소, 연락처, 장비명, 수량, 보유장소 정보가 포함되어 있으며, 카고크레인, 험지크레인, 지게차, 굴삭기, 고소작업차 등 다양한 복구장비가 명시되어 있습니다. 해당 자료는 가스시설물에서 발생할 수 있는 사고나 재해에 신속히 대응하기 위한 장비 운영 현황을 파악하는 데 활용되며, 장비 배치 최적화, 재난 대응 훈련 계획 수립, 장비 유지보수 관리, 긴급복구 역량 강화 등의 기초 정보로 유용합니다.
