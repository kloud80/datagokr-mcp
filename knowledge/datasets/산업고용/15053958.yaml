summary_user: 한국장애인고용공단이 지원하는 상용 보조공학기기를 제품 한 건씩 담은 전국 단위 목록으로, 기기의 대·중·소분류, 제품명, 지원 가능한 장애유형, 제한연수, 사후관리 연수, 판매업체명을 담는다. 장애인 근로자나 이를 고용한 사업주가 "시각장애 근로자에게 지원되는 기기는 무엇이고 몇 년마다 다시 신청할 수 있나"를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 공단 내부 제품코드나 장애유형·업체명 같은 이름을 맞춰서만 연결한다.
description_portal: 해당 데이터는 한국장애인고용공단에서 지원하는 상용 보조공학기기 지원 제품 현황에 관한 정보로, 장애인의 직업 활동 참여를 촉진하고 자립 및 고용 기회를 확대하기 위한 정책의 일환으로 제공됩니다. 이 데이터는 보조공학기기의 대분류, 중분류, 소분류는 물론, 각 기기가 지원 가능한 장애 유형, 제한 연수 및 사후관리 연수, 그리고 판매업체명 등의 세부 정보를 포함하고 있어, 실제로 어떤 기기가 누구에게 어떻게 지원되는지를 구체적으로 확인할 수 있습니다. 해당 데이터는 연 1회 정기적으로 갱신됩니다.
