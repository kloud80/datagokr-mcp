summary_user: 전북특별자치도 부안군 관내에서 허가된 태양광·풍력 등 신재생에너지 발전사업을 사업 건별로 담은 원장 파일로, 인허가관리번호·상호·설치장소 소재지·원동력의 종류·설비용량·공급전압·허가일자 등을 수록한다. 부안군 안에서 어느 지역에 어떤 종류·용량의 발전소가 언제 허가됐는지 알고 싶은 주민·발전사업자·에너지 정책 분석가가 지역 재생에너지 보급 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치장소 소재지 주소나 상호를 매칭해 이어야 하며, 전국태양광발전소전기사업허가정보표준데이터 등 발전소 단위 원장과 주소·용량을 기준으로 대조하는 방식으로 쓴다.
description_portal: 본 데이터는 전북특별자치도 부안군 관내에서 허가된 신재생에너지 발전사업의 허가 및 상업운영 현황을 수록한 공공자료이다. 주요 항목은 인허가관리번호, 상호, 소재지, 설비용량, 공급전압, 허가일자 등으로 구성되어 있으며, 태양광·풍력 등 신재생에너지 설비의 추진 경과와 운영 실태를 종합적으로 파악할 수 있도록 되어 있다. 해당 자료는 행정계획 수립, 에너지 수급 분석, 탄소중립 정책 지원 등 다양한 행정 및 민간 분야에서 활용 가능하며, 지역 내 재생에너지 기반 확대 및 정책 수립에 필요한 기초자료로 사용된다. 데이터는 정기적으로 갱신되며, 부안군의 에너지 전환 추진 현황과 재생에너지 운영 실태를 체계적으로 제공하는 데 목적이 있다.
