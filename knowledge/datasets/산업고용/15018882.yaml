summary_user: 중소벤처기업진흥공단이 운영하는 대학연계 중소기업 인력양성사업에 참여한 대학 명단을 대학 단위로 담은 소규모 파일(csv 538바이트)로, 대학명·구분·지역·참여유형·선정연도를 담는다. 구직자나 진학 희망자가 '우리 지역에서 중소기업 취업 연계형 학위과정을 운영하는 대학이 어디인가'를 확인하거나, 분석가가 연도별·지역별 참여대학 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대학명이나 지역명을 이름으로 맞춰 연결해야 한다.
limits: 대학 코드나 사업자번호 같은 공통 키가 없어 대학 정보·기업 데이터와 자동으로 이어 붙이기 어렵고, 이름 매칭에 의존해야 한다. 협약기업이나 취업 실적은 담지 않으며, 행정 검토상 이 부문의 보조 등급 데이터로 분류돼 있다.
