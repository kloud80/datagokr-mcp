description_portal: 중소기업 협단체(또는 중소기업)와 협약을 체결하고 기술인력 교육 및 양성 후 협약기업에 취업을 연계 중에 있는 대학연계 중소기업 인력양성 사업 참여대학 명단입니다.중소기업 현장에서 필요한 전문기술인력을 체계적으로 양성하는 것을 목표로 하고 있으며 , 이를 위해 대학에서 산업계 수요를 반영한 학위과정 운영을 통해 핵심인력 양성 및 인력유입을 촉진합니다.주로 첨단산업(반도체, 바이오 등) 및 지역 전략산업 등 미래 유망 분야가 중점적으로 운영되고 있습니다.해당 데이터는 참여대학, 구분, 지역, 참여유형, 선정연도의 내용을 포함하고 있습니다.
