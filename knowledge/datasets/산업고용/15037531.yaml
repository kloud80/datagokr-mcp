summary_user: 창업진흥원 창업도약패키지 지원사업의 주관기관을 기관 한 곳당 한 행으로 정리한 목록으로, 지역·기관명·기관구분(공공기관·대학·민간기관)·주력 지원 기술분야·주소를 담으며 범위는 전국이고 파일 크기는 약 1.4KB의 소규모 CSV다. 도약단계 창업기업이 "우리 지역에서 바이오·의료 분야를 주력으로 지원하는 창업도약패키지 주관기관은 어디인가"를 찾을 때나, 분석가가 지역·기술분야별 주관기관 분포를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주관기관명이나 주소(지역명)를 기준으로 이름 매칭해 이어 써야 한다.
description_portal: 해당 데이터는 창업진흥원이 관리하는 「창업도약패키지 지원사업」의 주관기관 현황을 정리한 자료로, 연번, 지역, 주관기관명, 기관구분(공공기관·대학·민간기관), 주력지원기술분야, 주소 및 상세주소 항목으로 구성되어 있습니다. 이 데이터는 정보·통신, 기계·소재, 바이오·의료·생명 등 다양한 기술 분야에서 창업도약단계 기업을 지원하는 전국의 기관 분포를 보여주며, 각 기관의 역할과 전문 영역을 파악하는 데 활용될 수 있습니다. 지역 기반 창업지원 인프라의 현황을 분석하거나, 기술 분야별 특화된 지원 역량을 비교 분석하고, 협업 대상 기관을 발굴하는 데에 유의미한 기초자료로 활용 가능합니다. 또한 창업 정책 수립 및 실행과정에서 도약단계 기업에 대한 맞춤형 지원 전략을 기획할 때 참고 지표로도 활용될 수 있습니다.
