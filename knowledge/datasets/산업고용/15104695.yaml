description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 과제 규모별 지원 현황을 집약한 공공 데이터입니다.제공되는 정보는 과제별 사업비 규모에 따라 분류된 최근 5년간의 연도별 과제 수 및 정부 지원금 현황을 포함합니다. 예를 들어, 30억 이상, 15~30억, 5~15억, 5억 미만으로 사업비 규모를 구분하여 각 규모별로 몇 개의 과제가 수행되었고, 얼마나 많은 정부 지원금이 투입되었는지 상세히 파악할 수 있습니다. 이 데이터는 에너지 R&D 예산이 어떤 규모의 과제에 주로 배분되고 있는지, 그리고 규모별 과제 수가 어떻게 변화하는지를 분석하는 데 유용합니다.
