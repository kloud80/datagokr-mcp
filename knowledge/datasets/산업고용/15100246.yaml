summary_user: 중소벤처기업진흥공단 일자리매칭플랫폼에 등록된 구인기업을 공고 단위로 담은 파일 데이터로, 기업명·사업자번호·지역구분·종업원수·공고명·고용형태·공고등록일을 싣고 2018-07-23~2026-03-06 기간의 전국 84,860행이다. 분석가나 정책 담당자가 중소기업의 채용 경향, 예를 들어 지역별·고용형태별 구인 공고가 어떻게 분포하는지 볼 때 쓴다. 사업자번호(bizno)가 조인 키라서 벤처·이노비즈 등 기업 확인·인증 데이터와 기업 축으로 이어 쓴다.
description_portal: 중소기업 인력지원사업의 일환으로 중소기업-구직자 간 일자리 매칭을 지원해주는, 중소벤처기업진흥공단 기업인력애로센터 일자리매칭플랫폼에 등록된 구인기업 목록입니다. 기업명, 사업자번호, 지역구분, 종업원수, 공고명, 고용형태, 공고등록일의 데이터를 포함하고 있습니다. 구인공고를 게시한 구인기업에 관련한 정보이므로 전반적인 구인기업의 채용 경향을 파악하시는데 활용하시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등으로 확인하기 어려울 수 있기 때문에 원활한 파악을 위해서는 분석 전용 소프트웨어를 이용하시기 바랍니다.
