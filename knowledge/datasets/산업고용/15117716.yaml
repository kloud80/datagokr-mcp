summary_user: 한국수력원자력이 자체 운영하는 태양광 발전설비별로 거래일·시간 단위의 계량전력량, 전력판매매출, 단가를 담은 건별 판매 실적 파일(csv 약 25MB)이다. 에너지 분석가가 "한수원 태양광 설비의 시간대별 발전 판매량과 매출, 단가는 어떻게 변하는가"를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 태양광 설비명(발전기)을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 한국수력원자력㈜에서 공개하는 자체 태양광 발전설비 전력판매 실적에 관한 AI친화 데이터입니다. 이 데이터는 한국수력원자력의 자체 태양광 발전설비에서 생산된 전력의 판매 실적을 시간 단위로 제공합니다. 거래일, 발전기, 시간, 태양광명, 계량전력량, 전력판매매출, 단가 등의 정보를 제공합니다. 설비장애로 인한 수기등록의 경우, 시간 항목이 "0" 으로 표기되어 있는 점을 유의해주시기 바랍니다. 제공항목의 계량전력량은 메가와트시(MWh)이며 전력판매매출 단위는 원, 단가는 킬로와트당 원입니다.※ 시간항목값이 공란인 경우 구분항목이 수정인 경우 시간데이터가 확정되지 않아 공란으로 처리됩니다.
