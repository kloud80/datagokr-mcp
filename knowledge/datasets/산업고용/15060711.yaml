description_portal: ‘모성보호 초회수급자 및 지급현황(월)’ 통계는 고용보험제도 내에서 모성보호와 관련된 각종 급여의 첫 수급자 수와 지급금액 현황을 월 단위로 집계한 자료입니다. 출산전후휴가, 유사산휴가, 육아휴직, 육아기 근로시간 단축, 배우자출산휴가급여 등 대분류별로 처음으로 급여를 받은 인원(초회수급자)을 기준으로 하며, 지급일자에 따라 집계됩니다. 통계는 사업장 위치(시도/시군구), 규모, 산업분류, 수급자의 연령, 성별, 통상임금 등 다양한 속성으로 세분화되어 제공됩니다. 본 통계는 여성 및 가족 친화 고용정책의 실효성 평가, 출산·육아 지원정책 수립, 지역별 고용복지 격차 분석 등에 유용하게 활용됩니다.
