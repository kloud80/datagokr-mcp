description_portal: ‘모성보호지급자현황(월)’ 통계는 고용보험제도에 따라 해당 월에 모성보호 관련 급여를 실제 지급받은 수급자 수를 항목별로 집계한 자료입니다. 출산전후휴가, 육아휴직, 육아기근로시간단축, 배우자출산휴가, 유사산휴가, 난임치료휴가 등 6가지 급여 유형별 순수 지급자 수를 제공하며, 동일인이 중복 지급을 받은 경우는 제거한 후 고객번호, 출생일자, 처리기관 기준으로 집계됩니다. 통계는 사업장 위치, 규모, 산업분류, 수급자의 연령, 성별, 통상임금 등에 따라 세분화되며, 월 단위 합산 시 주의가 요구됩니다. 이 데이터는 육아 및 출산과 관련된 실질적 정책 수혜 범위를 파악하고, 여성 고용환경 개선을 위한 기초 자료로 활용됩니다.
