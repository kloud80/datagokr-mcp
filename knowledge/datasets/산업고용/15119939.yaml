summary_user: 서울 성동구에서 고압가스를 제조·저장·판매(용기 충전 포함)하는 업소를 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·좌표(X, Y)를 포함한다. 구청 안전관리 담당자나 인근 주민·사업자가 '성동구에 현재 영업 중인 고압가스 업소가 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 에너지 업종 원장(석유판매·LPG·도시가스 등)과 나란히 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 고압가스를 제조, 저장 및 판매하는 업소 정보를 체계적으로 제공하기 위해 구축되었습니다. 여기에는 용기에 충전하는 방식까지 포함하여 고압가스의 생산, 보관과 함께 최종 소비자나 주요 수요처에 판매하는 영업장에 대한 정보가 망라되어 있습니다. 주요 항목으로는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드가 포함되어 있어 각 업소의 인허가 절차, 영업 개시 및 중단, 관리상태를 명확하게 파악할 수 있습니다. 본 데이터는 성동구청 등 관할기관의 정기적인 현장점검 및 행정절차에 따라 수집, 갱신되어 높은 신뢰성과 최신성을 유지합니다. 고압가스 산업은 안전성과 관련 법규 준수가 중요한 분야로, 본 데이터는 사고 예방, 안전관리, 정책 수립, 업계 동향 분석 등 다양한 목적에 활용이 가능합니다. 또한 연구자, 산업 종사자, 행정 기관 및 시민 모두에게 유용한 기초 정보를 제공함으로써 지역사회 안전과 효율적 산업관리에 기여할 것입니다.
