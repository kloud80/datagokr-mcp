summary_user: 서울시설공단이 관리하는 지하도상가의 점포를 한 줄에 하나씩 담은 파일로, 권역·상가명·점포명·호수·업종을 담는다(CSV 약 105KB). 지하도상가를 찾는 시민이나 입점을 검토하는 사업자가 '어느 권역의 어떤 지하도상가에 어떤 업종 점포가 몇 호에 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 상가·상권 데이터와는 상가명·점포명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 해당 데이터는 서울시설공단이 관리하는 권역별 지하도상가 점포명과 업종, 위치 등에 대한 정보를 제공하고 있습니다.서울시설공단이 관리하는 지하도상가는 그 위치가 여러곳에 분포하고 있습니다. 해당 데이터를 활용한다면, 특정 지하도상가 권역과 상가명, 해당 점포가 어디에 위치하고 있는지 자세히 확인할 수 있습니다.따라서 공개된 데이터를 이용하면 서울시설공단이 관리하는 다양한 권역별 지하도상가의 운영 현황을 한눈에 파악할 수 있습니다.자세한 사항은 서울시설공단으로 문의주시면 성심성의껏 도와드리겠습니다.
