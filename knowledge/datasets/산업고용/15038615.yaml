summary_user: 한국중소벤처기업유통원 MRO 중소소모성자재납품업종합지원센터가 지원하는 중소 납품업체를 업체 한 곳당 한 행으로 담은 명단 파일로, 업체분류·업체명·기준일만 들어 있다(전국 범위, CSV 약 14KB). 공공기관 구매 담당자나 MRO 조달을 검토하는 기업이 사무용품·산업용재 같은 간접재를 납품하는 지원 대상 중소업체를 찾을 때 쓴다. 사업자등록번호 같은 공통 조인 키가 없어 다른 기업 확인·인증 데이터와는 업체명 대조로만 이어 쓸 수 있다.
description_portal: 한국중소벤처기업유통원의 지원사업 중 MRO사업에 대한 데이터를 제공합니다.MRO사업이란 중소 소모성자재 납품업 종합지원센터 통하여 MRO를 납품하는 중소기업을 전문적으로 지우너 및 육하는 사업이며, 생산에 직접 소요되는 원자재를 제외한 사무용품 또는 다른 제품이나 서비스를 생산하기 위하여 기업 등에 의하여 구매되는 산업용재 등 모든 간접재를 의미합니다.본 파일데이터에는 업체분류, 업체명, 기준일 등 데이터를 파일로 제공하며, 엑셀 등 전용 소프트웨어를 통한 작업을 권고드립니다.
