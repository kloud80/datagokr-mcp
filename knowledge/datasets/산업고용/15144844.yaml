description_portal: 한국노동연구원은 노동시장, 고용, 인적자원 개발 등 다양한 노동 분야의 정책 수립과 사회적 대화를 지원하기 위해 각종 연구결과를 담은 발간물을 꾸준히 제작·공개하고 있습니다. 이러한 발간물들은 연구보고서, 간행물, 통계자료 등으로 구성되어 있습니다. 정기 간행물에는 매월 발간되는 노동리뷰와 격월 발간되는 국제노동브리프 그리고 계간으로 발간되는 노동정책연구가 있습니다. 그 외에도 KLI 고용노동브리프, 임금정보브리프, 패널프리프, 고용영향평가브리프와 같은 이슈페이퍼도 발간하고 있습니다. 개방 대상 데이터는 대표홈페이지에 게시된 주요 발간물의 메타 데이터를 중심으로 구성됩니다. 대표홈페이지 발간물 파일의 메타데이터에는 발간물 파일명, 파일 유형 등의 정보가 포함됩니다.
legal_basis_portal: 연구성과의 공표 및 정보 제공 기능을 위해 대표 홈페이지에 발간물을 업로드 하고 이에 따른 대표홈페이지 발간물 자료의 메타데이터를 보관한다.
