summary_user: 수원시 건축물 한 동 단위로 시설군·용도 등 건축물 정보와 도시가스 월별 사용량(단위 MJ)·연합계·월평균을 담은 원천 파일이며, 포털 설명상 2019~2021년을 다루고 필드 목록에는 2021년 1~12월 컬럼이 있다. 분석가나 지자체 담당자가 '수원시에서 어떤 용도의 건축물이 겨울철 도시가스를 가장 많이 쓰는가'를 따지는 데 쓴다. 필지고유번호(PNU)·지번주소·시설물 고유등록번호(UFID)·건축물 용도코드가 있어 건축물대장이나 토지 정보와 필지 단위로 맞춰볼 여지가 있으나, 실측 검사에서는 전역 조인 키로 확인되지 않아 이름·코드 매핑으로 연결해야 한다.
description_portal: '수원시의 2019년, 2020년, 2021년 도시가스에너지에 대한 건축물 단위 건축물 시설군 및 용도 등의 건축물 정보와 월별 에너지 사용량(단위 : MJ) 데이터를 제공합니다.'
