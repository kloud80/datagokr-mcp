summary_user: 산재보험이 적용되는 사업장 수(개소)와 근로자 수(명)를 연도별·사업종류(대분류)별로, 상시근로자 규모 10개 구간(5인 미만~1000인 이상)에 나눠 담은 전국 단위 집계 파일(CSV, 약 1.8KB)이다. 정책 분석가가 "5인 미만 영세 사업장의 산재보험 적용 사업장과 근로자가 업종별로 어떻게 변해 왔나"를 볼 때 쓴다. 전역 조인 키가 없어 다른 산재·고용 통계와는 연도와 업종명(구분)을 이름으로 맞춰 이어 쓴다.
description_portal: '이 데이터는 산재보험이 적용되는 사업장의 현황을 연도별, 사업 종류별(대분류), 사업장 규모별(상시근로자수 기준)로 상세하게 집계한 통계 자료입니다. 각 연도 및 산업 분류 내에서 상시근로자 수(예: 5인 미만, 1000인 이상)에 따른 적용 사업장 수(개소)와 근로자 수(명) 정보를 제공합니다. 업종 분류는 한국표준산업분류(KSIC)를 따릅니다. 이 자료는 국내 산업 구조와 기업 규모의 변화 추이를 명확하게 보여주며, 산재보험의 적용 범위와 포괄하는 근로자 집단의 특성을 다각도로 분석하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 산업 안전 및 고용 정책의 사각지대를 해소하는 데 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 산업 분류 내에서 영세 사업장(예: 5인 미만)의 사업장 수와 근로자 수가 어떻게 변화하는지 분석할 수 있습니다. 이를 통해 규모가 작은 사업장에서의 산재보험 적용 및 관리의 취약성을 진단하고, 해당 사업장을 대상으로 한 맞춤형 산재 예방 및 안전 관리 지원 정책을 수립하는 데 활용할 수 있습니다. 또한, 이 통계는 거시적인 산업 구조 변화와 고용 인구의 이동 추이를 파악하여 사회보험 시스템 전반의 지속 가능성 및 효율성을 검토하는 데 기여할 수 있다고 판단됩니다.'
