summary_user: 구미시 관내 토석채취허가를 업체별로 담은 파일로, 업체명·연락처·소재지·용도·면적(m2)·수량(m3)·허가 시작·종료일을 개별 사업장(주소) 단위로 기록한다. 주민이나 사업자가 '우리 동네 근처에 허가된 토석채취장이 어디이고 허가 기간이 언제까지인가'를 확인하거나, 행정·분석가가 시 관내 채취 면적과 수량을 파악하는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 소재지 주소나 업체명으로 맞춰 이어야 하며, 허가 구역이 국토 공간 규제와 겹치는지 보는 용도로 토지이용 규제 자료와 주소 기준으로 대조한다.
limits: 파일 크기가 216바이트에 불과해 수록 건수가 극히 적고, 구미시 한 곳만 다룬다. 코드형 조인 키가 없어 다른 데이터와 연결할 때 주소·업체명 매칭에 의존해야 한다.
