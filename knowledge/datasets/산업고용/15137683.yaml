description_portal: 남해군 공사계약 하도급관리 현황 데이터는 관내에서 이루어지는 각종 공사계약의 하도급 현황 데이터입니다. 주요 항목에는 공사년도, 공사구분, 업체명, 공종, 업태, 종목, 계약 및 신고 관련 날짜, 하도급 계약 및 변경 금액, 하도비율, 지급방법, 공사 시작 및 마감 기간, 지급보증서와 직불합의서 유무 등이 포함됩니다. 이 데이터를 통해 군민과 행정기관은 공공공사에서의 하도급 관행을 투명하게 파악할 수 있습니다. 예를 들어, 과도한 하도급 비율, 반복 계약 변경 여부, 지급보증 및 직불합의서 발급실태 등 감시가 가능해 부실시공 예방과 건설업체의 권익 보호에 활용될 수 있습니다. 연구자와 개발자는 하도급 구조 분석, 행정보고 자동화, 하도급 정보 지도화 등 다양한 응용 서비스를 구축할 수 있습니다.
