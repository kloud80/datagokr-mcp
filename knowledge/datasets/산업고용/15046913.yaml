description_portal: '○ 통계개요* 통계명 : 가스공급량* 통계종류 : 서울시 가스공급량 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도시가스사업법」「액화석유가스의안전관리및사업법」에 근거한가스판매량* 작성목적 : 각종 에너지의 공급 및 수급 현황 등을 파악하여, 에너지 자원을효율적으로 관리하고 에너지 관련 정책수립에 필요한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 도시가스 및 한국가스안전공사 → 서울특별시 녹색에너지과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 도시가스, 프로판, 부탄의 판매소 및 판매량 현황○ 용어설명* 도시가스 : 도시의 중앙공급원에서 도관에 의하여 각 수요자에게 보여지는 연료가스.근년에는 액화기술의 발전에 의해 천연가스를 공급함* 프로판 : 주로 가정에서 취사나 난방에 사용하는 LPG로 천연가스가 공급되지 않는지역에서는 도시가스로 사용됨○ 기 타* 프로판과 부탄은 동일장소에서 판매함○ 출 처 : 서울특별시 녹색에너지과'
