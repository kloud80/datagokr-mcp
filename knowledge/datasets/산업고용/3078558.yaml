summary_user: 충청남도 천안시에 등록된 직업소개소를 한 곳당 한 행으로 담은 파일로, 사업소명·소재지·전화번호·데이터기준일자가 들어 있으며 범위는 천안시 한 개 시군구다. 천안에서 구인·구직을 맡길 직업소개소가 어디에 있고 연락처가 무엇인지 찾는 구직자·구인 사업주, 또는 지역 직업소개소 분포를 보려는 고용 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명이나 소재지 주소를 맞춰 잇는 방식으로만 연결하며, 지방행정 인허가(LOCALDATA) 직업소개소 원장과 대조하는 용도에 쓴다.
limits: 사업자번호·인허가번호 같은 공통 식별 키가 없어 다른 데이터와 정확히 조인하기 어렵고 이름·주소 매칭에 의존해야 한다. 좌표가 없으므로 지도 표시에는 주소 지오코딩이 따로 필요하다.
