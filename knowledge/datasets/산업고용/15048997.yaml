description_portal: 데이터는 업력, 업종, 기업형태, 성별, 연령에 따른 창업자의 취업 상태와 소속 기관 유형을 세분화하여 보여주고 있습니다. 취업 상태는 국내 중소기업, 대기업, 외국계 기업, 공공기관, 학교, 대학, 정부 및 단체, 무소속 등으로 구분됩니다. 전반적으로 국내 중소기업에서 창업 이전에 근무한 비율이 가장 높으며, 업력이 증가해도 중소기업 비중이 유지되는 경향이 나타납니다. 업종별로 정보통신업, 제조업 등에서는 대기업 근무 경험이 두드러지며, 보건복지업은 공공기관과 정부 소속 비율이 높습니다. 성별에 따라 여성은 중소기업 외에도 학교와 정부기관 소속 경험이 다소 높게 나타납니다. 본 데이터는 창업자 배경에 따른 취업 경로 분석에 활용될 수 있습니다.
