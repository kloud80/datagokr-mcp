summary_user: 전국 17개 시도별로 등록된 전기차 대수를 기준일마다 집계한 작은 파일(csv 약 1.5KB)로, 시도가 행이 아니라 열로 펼쳐진 가로형 집계표입니다. 지자체 담당자나 충전 사업자가 "어느 시도에 전기차가 많고 기준일 사이에 얼마나 늘었는가"를 비교해 충전 인프라 우선 지역을 고르는 데 쓴다. 전역 조인 키가 없고 시도 이름이 열 이름으로만 들어 있으므로, 충전소·인구 등 다른 시도 단위 데이터와는 시도명을 행정코드로 직접 매핑해 이어 쓴다.
description_portal: 한국전력공사에서 제공하는 지역별 전기차 현황정보 데이터로 전국 각 지역에 등록된 전기차 대수를 집계한 자료입니다. 기준일, 지역별 등의 항목으로 구성되어 있어, 지역별로 전기차 보급 현황과 그 증가 추이를 명확히 확인할 수 있습니다. 이 데이터를 활용해 정부·지자체 전기차 보급정책 수립 시 지역 간 격차를 파악하고 충전 인프라 우선 구축 지역을 선정할 수 있습니다. 또한 기업은 전기차 시장 확대 가능성이 높은 지역을 선제적으로 분석해 사업 전략을 수립하는 데 활용할 수 있으며, 전기차 보급 속도와 친환경 교통수단 확산 현황을 객관적으로 비교·분석할 수 있습니다.
