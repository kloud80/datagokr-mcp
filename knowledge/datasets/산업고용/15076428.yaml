description_portal: 'ㅇ 데이터 개요: 서울시 상권 단위×서비스 업종 단위로 점포 수·개·폐업 지표·프랜차이즈 현황을 분기별로 제공합니다.ㅇ 공간/분류 체계: 상권 구분은 관광특구·골목상권·발달상권·전통시장 4종이며, 상권 식별을 위해 상권_코드, 상권_코드_명을 함께 제공합니다. 상권 명칭은 1,650개 수준으로 확인됩니다.ㅇ 업종 분류: 서비스_업종_코드(명)로 업종을 구분하며, 업종 종류는 100개가 포함되어 있습니다.ㅇ 핵심 지표(컬럼):점포_수, 유사_업종_점포_수(해당 상권 내 유사 업종과의 비교),개업_율·개업_점포_수, 폐업_률·폐업_점포_수,프랜차이즈_점포_수 등으로 상권-업종 단위의 출점·이탈·프랜차이즈 비중 파악이 가능합니다.ㅇ 지표 값 범위(참고): 전수 기준 대략 점포_수 0~12,409, 개업_율 0~200, 폐업_률 0~450, 프랜차이즈_점포_수 0~150 수준으로 확인됩니다. 율/률은 비율형(%) 수치로 해석하는 것이 타당해 보이나, 산식 정의는 파일 내에서 직접 확인되지 않아 “확실하지 않음”.ㅇ 활용 목적: 상권별 업종 포화도 및 경쟁도 진단, 개·폐업 추이 모니터링, 프랜차이즈 비중 분석, 출점 입지선정과 골목상권·전통시장 정책 타깃팅 등 의사결정에 활용할 수 있습니다.ㅇ 데이터 구조(대표 컬럼):기준_년분기_코드 / 상권_구분_코드(명) / 상권_코드(명) / 서비스_업종_코드(명) / 점포_수 / 유사_업종_점포_수 / 개업_율 / 개업_점포_수 / 폐업_률 / 폐업_점포_수 / 프랜차이즈_점포_수'
