summary_user: 서울시 상권(관광특구·골목상권·발달상권·전통시장 4종, 약 1,650개)과 서비스 업종(100종)을 조합한 단위로 점포 수, 유사 업종 점포 수, 개·폐업 점포 수와 비율, 프랜차이즈 점포 수를 분기별로 집계해 담는다. 예비 창업자나 상권 분석가가 '이 골목상권에서 커피전문점은 이미 포화인지, 최근 분기 폐업이 늘었는지'를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 같은 서울시 상권분석서비스의 다른 데이터와 상권 코드(TRDAR_CD)·분기 코드(STDR_YYQU_CD)·업종 코드로 맞춰 잇거나 상권·업종 이름으로 매핑해 쓴다.
limits: 개별 점포의 상호·좌표가 없는 상권×업종 집계라서 점포 단위 분석은 하지 못하고, 다른 기관 데이터와는 공통 코드 없이 이름 매핑으로만 연결된다. 호출에는 포털 활용신청과 별개인 서울 열린데이터광장(data.seoul.go.kr) 인증키가 필요하다. 개업률·폐업률은 산식이 파일에 명시되지 않아 비율 해석에 주의한다.
