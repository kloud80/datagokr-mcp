summary_user: 근로복지공단 업무상질병판정위원회의 판정 결과를 위원회 지역(서울남부·서울북부·부산·경남·대구·경인북부·경인남부·광주·대전)별 열과 전체 합계로 정리한 집계표로, 뇌심혈관·근골격계·기타 질병별 인정(일부인정 포함)·불인정 건수와 비율을 담는다. 산재 신청을 준비하는 노동자나 노무 분석가가 '내 질병 유형이 지역 판정위원회에서 얼마나 인정되는가'처럼 질병 유형·지역별 인정률을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 산재 통계와는 위원회 지역명이나 질병 구분명을 직접 맞춰 이어 써야 한다.
description_portal: '- 근로복지공단 업무상질병판정위원회 지역별 판정현황 데이터입니다. 지역별(서울남부, 서울북부, 부산, 경남, 대구, 경인, 광주, 대전) 뇌심혈관, 근골격계, 기타 질병의 업무상질병 관련 인정(일부인정 포함), 인정률, 불인정, 불인정률 데이터를 제공합니다.- 본 자료는 2020. 1. 1.~2025. 12. 31. 기간의 데이터를 제공하며, 1년에 한번 갱신됩니다. 과거자료는 근로복지공단 누리집 > 정보공개 > 사전정보공표(https://www.comwel.or.kr/comwel/info/docu.jsp)에서 확인하실 수 있습니다.'
