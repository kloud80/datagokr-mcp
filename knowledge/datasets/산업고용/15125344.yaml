summary_user: 한국남부발전(주)이 수행하는 중소기업 지원사업 공고를 공고 단위(공고ID·사업이름·공모이름·공모 시작일·종료일·작성일·상세정보)로 담은 전국 범위의 원천 API다. 중소기업이나 지원기관 담당자가 '지금 신청할 수 있는 남부발전 협력·지원사업이 무엇이고 마감이 언제인가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키가 없어, K-Startup·기업마당 등 다른 기관 공고와는 사업명·공모명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전공기업입니다. 본 API는 한국남부발전(주) 중소기업지원사업 정보_GW 입니다.해당 API를 통하여 한국남부발전(주)에서 수행하는 중소기업 지원사업 정보를 사용자가 원하는 기간에 대하여 조회가 가능합니다.데이터 조회 시, 지원사업의 유형, 시작일자, 종료일자, 신청방법 등 세부내용을 조회할 수 있습니다. 본 데이터를 활용하여 중소기업에게는 지원사업 정보를 효과적으로 전달할 수 있고, 타 기관에서는 기업지원 사업 계획 수립 등에 참고할 수 있습니다.
