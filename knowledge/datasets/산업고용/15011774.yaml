summary_user: 제주특별자치도에 소재한 측량업체를 업체 한 곳당 한 행으로 담은 파일로, 업종(공공측량·일반측량 등), 업체명, 소재지, 데이터기준일자를 제공한다. 측량 의뢰처를 찾는 도민·사업자나 제주 지역 측량업체 분포를 보려는 분석가가 '제주시 내 공공측량업 등록 업체는 어디인가' 같은 질문에 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 연결해야 한다.
limits: 사업자번호·좌표 같은 공통 식별자가 없어 다른 인허가·기업 데이터와 정확히 매칭하기 어렵고, 업체명·주소 문자열로 맞출 때 오차가 생길 수 있다. 범위가 제주특별자치도에 한정돼 전국 비교에는 쓸 수 없다.
