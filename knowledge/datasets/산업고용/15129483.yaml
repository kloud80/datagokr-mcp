summary_user: 한국산업기술진흥원이 정리한 산업기술개발장비의 6T 분야별 세부기술 분류표로, 기술코드·세부기술코드·구분명·기술명·분류 기준을 한 행씩 담은 코드 목록 파일(csv, 약 19.6KB)이다. 연구자나 장비 담당자가 "이 연구장비는 6T 중 어느 세부기술 분야에 속하는가"를 확인하거나, 장비·과제 자료에 붙은 기술코드를 기술명으로 풀어 읽는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 기관의 장비·기술 데이터에 있는 기술코드(세부기술코드)나 기술명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 한국산업기술진흥원_산업기술개발장비 6T 세부기술정보는 다양한 산업기술 연구개발 프로젝트에 필요한 연구장비의 세부기술정보를 체계적으로 제공합니다. 이 데이터는 특히 산업기술 연구자들과 개발자들이 특정 기술을 탐색하고 필요한 장비를 선택하는 데 있어 필수적인 자원으로 활용될 수 있습니다. 데이터에는 각 기술 분야별로 구분된 코드와 함께 기술명 및 그에 대한 구체적인 분류 기준이 포함되어 있어, 관련 기술의 깊이 있는 이해를 돕습니다. 이는 연구자들이 기술 관련 정보를 효율적으로 검색하고 활용할 수 있게 함으로써, 연구개발의 효율성을 높이는 데 기여할 수 있습니다. 또한, 데이터는 다음과 같은 구조로 이루어져 있습니다. 기술코드(문자형), 세부기술코드(숫자형), 구분명(문자형), 기술명(문자형), 분류 기준(문자형). 이러한 정보는 연구 장비 및 기술의 체계적인 정리를 지원하며, 다양한 기술 분야의 발전을 위한 기반이 될 수 있습니다.
