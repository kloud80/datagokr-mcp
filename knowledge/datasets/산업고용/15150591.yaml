description_portal: 이 데이터는 창업자의 성별, 학력, 연령대, 업종과 사업장 입지, 매출액 정보를 포함하여 인공지능 생성모델로 산출된 합성데이터입니다. 실제 창업자 개인정보 데이터와 통계적 특성을 반영하되, 개인식별정보를 제거하여 안전성을 확보했습니다. 합성화된 각 행은 창업자 성과를 표현하고 있어 개인 단위의 매출 분석이 가능합니다. 이를 통해 창업자의 배경과 성과 간의 상관관계를 연구할 수 있으며, 공공부문에서는 창업자의 성과를 고려한 맞춤형 지원정책을 설계할 수 있습니다. 민간에서는 대출심사, 투자 적격성 판단, 성장 잠재력 평가 지표로도 활용할 수 있습니다.
