description_portal: '○ 통계개요* 통계명 : 소기업·소상공인 체감경기조표(상시종업원 수준)* 작성목적 : 풀뿌리 경제의 근간인 서울시 소기업ㆍ소상공인 현장체감경기 실적과 전망등을 지수화하여 정기적으로 모니터링하고, 현장 경영애로를 파악* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 소기업, 소상공인의 기업규모별, 업종별 체감경기지표(S-BSI)○ 용어설명* 소기업 : 중소기업기본법 시행령에서 정한 소기업(상시근로자수 기준)① 광업, 제조업, 건설업, 운수업 등 : 50인 미만② 이외 업종 : 10인 미만* 소상공인 : 소기업 및 소상공인 지원에 관한 특별법에서 정한 소상공인(상시근로자수 기준)① 광업, 제조업, 건설업, 운수업 : 10인 미만② 이외 업종 : 5인 미만○ 기타* 상시종업원수준 : 사업체 내 임금근로자로 임원, 대표자, 일용근로자, 3개월 미만근로자 및 기업부설연구소 연구전담요원 등을 제외한 인력 수준을 나타냄* 2013. 2/4분기 고용 관련 조사항목은 "고용여력"으로 문항 대체하였으며,2013. 3/4분기부터는 "상시종업원수준"및"고용여력" 2개문항으로 세분화하여 조사 실시'
