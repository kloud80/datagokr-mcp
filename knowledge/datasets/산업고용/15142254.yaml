description_portal: 이 데이터는 의왕시 관내 공공기관에 설치된 태양광 발전소의 현황을 정리한 자료입니다. 태양광 발전소의 명칭, 위치를 도로명 주소와 지번 주소로 구분해 제공하며, 위도와 경도 정보가 포함되어 있어 위치 기반 분석이 가능합니다. 또한 각 발전소의 설비용량(KW), 설치연도, 주요 용도까지 함께 수록되어 있어 설비 규모나 도입 시기 등을 파악할 수 있습니다. 본 자료는 의왕시의 친환경 에너지 정책 추진 현황을 이해하거나 공공시설의 에너지 자립도 분석에 활용할 수 있으며, 시민과 연구자, 행정기관 모두에게 유용한 정보입니다. 데이터를 통해 지역 내 태양광 에너지 이용의 확산 정도와 공공 부문의 에너지 절감 노력을 가늠할 수 있습니다.
