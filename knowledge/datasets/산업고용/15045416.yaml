description_portal: 이 데이터는 한국석유공사가 수집한 국내 주요 석유정제업자의 원유 정제투입량과 대한석유협회에서 발표하는 정제업자별 정제능력을 바탕으로 연간 정제가동률을 계산한 자료입니다. 정제가동률은 정유시설이 설계된 기준 생산능력 대비 실제로 어느 정도 가동되고 있는지를 백분율로 나타낸 수치로, 국내 석유 정제산업의 운영 효율성과 생산성 수준을 파악하는 중요 지표로 활용됩니다. 이 데이터는 에너지 수급 계획 수립, 석유제품 생산량 예측, 국제유가 및 수출입 흐름과의 비교 분석 등 다양한 산업 및 정책 연구에 기반 자료로 활용될 수 있습니다. 데이터는 연간 주기적으로 갱신되며, 신뢰도 높은 국가 기반 에너지 통계자료로 기능합니다.
