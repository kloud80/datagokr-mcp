description_portal: 한국산업기술진흥원의 원내 과제 지원을 통한 기관의 사업수행 시, 추진한 홍보사항 관련 자료로 홍보내용, 홍보기관 등의 내용을 제공합니다. 본 데이터는 한국산업기술진흥원이 운영하는 다양한 지원 사업과 관련하여 기업 및 기관에서 수행한 홍보활동에 대한 상세한 기록을 포함하고 있으며, 연구 개발 성과를 외부에 알리는 데 활용될 수 있습니다. 또한, 해당 데이터는 기업의 마케팅 전략 수립이나 성과 분석, 향후 지원 사업 기획에 유용하게 쓰일 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 성과발생년도(숫자형), 접수번호(문자형), 홍보활동순번(숫자형), 홍보내용(문자형), 홍보유형(문자형), 홍보기간(숫자형), 홍보매체명(문자형), 성과년도(숫자형), 등록일자(날짜형)로 구성되어 있습니다. 해당 기관과 사업 관련된 정보를 종합적으로 제공하여 보다 효과적인 정보 활용이 가능하도록 돕고 있습니다.
