summary_user: 경상북도 구미시에 등록된 LPG 충전소를 한 곳씩 담은 건별 목록으로, 상호명·도로명주소·전화번호·비고를 수록한 작은 CSV 파일(2,278바이트)이다. 구미에서 LPG 차량을 모는 시민이 가까운 충전소의 주소와 연락처를 찾거나, 행정·업계가 시내 LPG 충전 인프라 분포를 확인하는 데 쓴다. 충전소 ID·좌표 같은 전역 조인 키가 없어 다른 충전소·유가 데이터와는 상호명이나 도로명주소를 맞춰 붙여야 한다.
limits: 전역 조인 키가 없어 오피넷 유가 등 다른 데이터와 자동으로 연결되지 않고, 이름·주소 매핑에 의존한다. 범위는 구미시 한 곳뿐이며 좌표나 가격·운영 상태 같은 실시간 정보는 담지 않는다.
