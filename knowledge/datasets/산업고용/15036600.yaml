summary_user: 김포시 안의 일자리센터·행정복지센터 상담창구 등 고용 상담 장소를 한 곳당 한 행으로 담은 목록이며, 장소명·구분·도로명주소·이용시간·대상범위·전화번호를 담는다(csv 약 2.5KB의 소규모 파일). 김포에 사는 구직자나 4대 보험 가입 사업주가 '가까운 취업 상담 창구가 어디이고 몇 시까지 여는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 고용 서비스 기관 목록과는 장소명이나 주소를 맞춰 연결해야 한다.
description_portal: 경기도 김포시 일자리센터 현황 정보에 대한 데이터로 장소명, 소재지주소, 이용시간, 대상범위, 전화번호 등의 항목을 제공합니다. 김포에는 9개의 행정복지센터 내 상담창구가 마련되어 있으며 공휴일을 제외한 평일에 9시부터 17시까지 운영합니다. 이외에도 공휴일을 제외한 평일에 9시부터 18시까지 운영하는 김포시 일자리센터, 노동권익센터, 김포여성새로일하기센터까지 총 12개의 일자리 센터가 있습니다. 취업 상담과 일자리 알선이 필요한 구직자, 4대 사회보험 의무가입한 사업장 대상입니다.
