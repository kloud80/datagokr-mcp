description_portal: 본 데이터는 서울특별시 종로구 관내에서 담배소매업을 운영하기 위해 등록된 사업체의 인허가 정보를 수록한 자료입니다. 주요 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 담배사업법에 따른 소매업 허가의 행정적 이력을 확인할 수 있습니다. 해당 자료는 편의점, 슈퍼마켓, 일반소매점 등에서 담배를 판매하는 업소의 영업상태, 허가 취소 여부, 지역별 분포 등을 파악하는 데 활용됩니다. 이를 통해 담배소매업 유통망 관리, 허가지 통계 분석, 소매점 운영 실태 파악 및 정책적 규제 수립 등의 기초자료로 제공되며, 지역 내 유통 질서 유지 및 공공보건 측면에서의 대응 체계 마련에도 기여할 수 있습니다.
