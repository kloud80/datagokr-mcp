description_portal: 한국광해광업공단은 석탄산업 사양화로 인해 침체된 폐광지역 경제 활성화를 위해 ‘폐광지역 개발지원에 관한 특별법(1995.12.)’ 과 ‘2단계 폐광지역 투자계획(2002.11., 산업통상자원부)’에 근거하여 대체법인을 설립·관리하고 있습니다.공단은 강원랜드 이익금 일부를 출자하여 해당지자체 및 ㈜강원랜드와 공동으로 대체법인을 설립하여 지역발전과 함께 지역주민의 삶의 질 향상에 기여하고 있습니다.공단 출자회사의 자산, 자본, 부채, 매출액, 영업손익, 당기손익액 등 실적 현황 정보를 제공합니다.
