description_portal: 이 데이터는 한국수력원자력(주)의 한빛본부 연도별 신재생설비 발전현황 자료입니다. 한빛본부 태양광 설비의 월별 발전 현황 데이터를 공개함으로써, 발전소의 운영 상황과 성과를 국민에게 투명하게 전달하고자 개방합니다. 이 데이터는 한빛본부의 호기별(1-6호기, 본관주차장) 신재생설비 발전현황에 대한 정보로 구성되어 있으며 CSV 형식으로 제공됩니다. 데이터 단위는 MWh입니다. 기후학, 에너지공학 등 다양한 학문 분야의 연구와 태양광 등 신재생 산업 기업들의 시장동향 분석, 제품 개발 및 마케팅 전략 수립에 활용 가능합니다.
