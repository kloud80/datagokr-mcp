summary_user: 제품안전정보센터의 안전인증 제품에 딸린 첨부파일(주로 이미지) 정보를 파일마다 저장경로·파일이름·확장자로 담은 전국 단위 CSV 파일이다. 인증제품의 사진이나 부속 자료가 어디에 어떤 이름으로 저장돼 있는지 찾으려는 분석가나 서비스 개발자가 인증제품 정보 화면에 첨부 이미지를 붙일 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 인증제품·리콜 정보와는 파일명이나 경로 문자열 매핑으로만 이어 쓸 수 있다.
limits: 첨부파일의 위치와 이름만 담고 있어 인증번호·제품명 같은 제품 식별 정보로 바로 연결하기 어렵다. 최근 수정일 이후 정보는 포털 설명대로 '제품 안전인증 및 리콜 정보' API에서 확인해야 한다.
