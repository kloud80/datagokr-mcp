description_portal: '국가기술표준원에서 운영하고 있는 제품안전정보포털(센터)에서 제공하고 있는 제품안전 인증제품 첨부파일 정보를 공유합니다. 본 데이터는 안전 인증을 받은 제품과 관련된 부속 자료를 포함한 정보를 제공하는 공공데이터입니다. 이를 통해 소비자, 기업, 관계 기관 등은 첨부파일 정보를 활용하여 제품의 안전성 검증, 인증 이력, 사후 관리 업무 등을 수행할 때 효율적으로 이용할 수 있습니다.* 다만, 해당 정보는 API(API 데이터 목록명: 산업통상자원부 국가기술표준원_제품 안전인증 및 리콜 정보)로 제공되고 있는 바, 최근 데이터 수정일 이후 최신 정보를 확인하시고자 하는 분들은 API 데이터를 활용해주시길 바랍니다.'
