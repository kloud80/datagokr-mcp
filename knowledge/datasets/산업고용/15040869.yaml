summary_user: 서귀포시 읍·면·동별로 등록된 사업체 수를 연도별로 정리한 집계 통계로, 한 행이 한 해이고 서귀포시 합계와 대정읍·남원읍·중문동 등 17개 읍면동이 열로 나열된 작은 CSV 파일(1,424바이트)이다. 지역 분석가나 시 정책 담당자가 '최근 몇 년 사이 사업체가 가장 많이 늘어난 서귀포 읍면동은 어디인가' 같은 지역 경제 규모 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름을 행정구역 코드에 직접 매핑하거나 같은 서귀포시 자료끼리만 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘읍면동별 사업체 현황’ 데이터는 2010년부터 2021년까지의 기간 동안 각 읍·면·동에 등록된 사업체 수를 연도별로 정리한 통계 자료입니다.읍면동 단위로 세분화된 통계는 해당 지역의 경제 활력 지표 파악, 산업 분포 분석, 지역별 비즈니스 밀집도 비교 등에 활용될 수 있습니다.CSV뿐만 아니라 XML/JSON 오픈API로도 제공되어, 지속적 업테이트 분석, 지역 경제 규모 변화 추이, 비지니스 전략 수립, 지방자치단체 재정·정책 기획 등에 적합한 기초 자료입니다.또한, GIS 시스템 연동 시 공간경제지도, 사업체 밀집도 시각화, 인구·산업 연계 연구 등 다양한 융복합 분석에도 활용될 수 있습니다.
