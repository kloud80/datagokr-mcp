summary_user: 고용노동부가 선정한 강소기업을 고용노동부·한국고용정보원이 취재해 등록한 현장탐방기를 기업 한 곳당 한 건씩 목록과 상세 형태로 담으며, 기업명·사업자등록번호·지역명·업종명·기업특징·취재일이 들어 있고 범위는 전국이다. 구직자나 취업 상담사가 '우리 지역의 특정 업종 강소기업은 실제로 어떤 곳인가'를 확인할 때나, 강소기업 소개 콘텐츠를 만드는 서비스에 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 강소기업·채용 데이터와는 기업명이나 사업자등록번호(busiNo)로 직접 대조해 잇는 방식으로 쓴다.
description_portal: '[강소기업 API - 강소기업현장탐방기]고용노동부에서 선정하는 강소기업에 대해 고용노동부,한국고용정보원에서 등록하는 강소기업현장탐방기 정보를 제공합니다. 목록 및 상세 형태로 제공하고 있으며 강소기업현장탐방기는 워크넷에서도 확인이 가능합니다. 강소기업현장탐방기 API를 활용하여 작지만 강한 강소기업의 진솔하고 생생한 탐방기를 구성할 수 있습니다.호출할 페이지 타입, 출력건수, 지역, 업종, 기업명 코드(선택) 등을 파라미터로 받아 총건수, 출력건수, 사업자등록번호, 기업명, 지역명, 업종명, 기업특징, 취재일 등의 결과를 제공합니다.  * 유의사항:  문자열로 입력되는 항목의 경우 공백이나 오탈자가 포함되면 검색 결과가 제대로 나오지 않을 수 있으므로 주의해야 합니다. 대부분의 파라미터는 선택적으로 입력할 수 있으며, 필요한 조건만 입력해도 조회는 가능합니다.'
