summary_user: 한국가스기술공사가 운영하는 수소충전소별로 하루 단위 수소 판매량(kg)을 담은 건별 일일 기록 파일이며, 총 판매량과 함께 승용(6kg 이하)·상용(6kg 초과) 충전량을 나눠 담는다. 분석가나 정책 담당자가 '어느 지역 충전소에서 요일·계절에 따라 수소 판매량이 어떻게 달라지고 상용차 충전 비중은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 충전소 목록·위치 데이터와는 충전소 이름(수소충전소)이나 위치 텍스트를 맞춰서만 이어 쓴다.
limits: 충전소 ID·좌표 같은 공통 키가 없어 다른 충전소·수소차 데이터와 연결하려면 이름 매핑이 필요하다. 이 기관이 운영하는 충전소만 담으므로 전국 전체 수소충전소 판매 현황으로 보면 안 되며, 실시간 충전기 상태 정보도 없다.
