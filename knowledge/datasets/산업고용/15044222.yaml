description_portal: 한국도로교통공단이 시행하는 도로교통사고감정사 자격시험의 직종별 자격 취득 인원을 연도 단위로 정리한 통계 데이터이다. 제공 대상 기간은 2013년부터 2017년까지이며, 연도, 직종 구분, 취득 인원 등의 항목으로 구성된다. 직군별 수요 추세 파악, 교육·양성 정책 수립, 시험 운영 개선, 교통사고 조사 전문인력 배치 계획 수립 등 근거 자료로 활용한다. 개인정보는 포함하지 않으며, CSV 형식으로 제공된다. 데이터의 산정 기준은 한국도로교통공단의 자격검정 행정자료를 바탕으로 하며, 과거 통계로서 정적 자료이다. 자료는 동일 기준으로 집계되어 연도간 비교가 가능하다. 이용자는 직종 범주 재분류, 비율 환산, 시계열 지표 작성 등의 2차 가공도 수행할 수 있다.
