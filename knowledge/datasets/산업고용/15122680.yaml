summary_user: 경상남도의 동물 관련 인허가 업소(동물병원·동물판매업 등 업무구분별) 현황을 사업장 한 곳당 한 행으로 담은 2023년 기준 1회성 파일로, 사업장명·지번/도로명 주소·인허가일자·영업상태·업무구분을 담는다. 반려동물 사업을 준비하는 사업자나 분석가가 "경남 어느 시군에 동물 관련 업소가 몰려 있고 그중 몇 곳이 영업 중인가"를 확인하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키는 없어, 다른 데이터와는 사업장명·주소 문자열 매칭으로만 잇는다.
description_portal: (데이터 수집목적 및 과정) 경상남도 인허가 동물 관련 기관 데이터는 경남빅데이터허브플랫폼 데이터베이스에서 관리하고 있는 2023년 기준 인허가  동물 관련 기관  현황입니다. 경상남도 인허가  동물 관련 기관에 대한 현황 정보를 파악할 때 활용 할 수 있습니다.(데이터 구성 및 세부항목) 인허가  동물 관련 기관  데이터는 사업장명, 지번주소, 도로명 주소, 인허가일자, 영업상태, 업무구분으로 구성됩니다. 총 2104건입니다. 미집계 데이터는 공란 처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터이며 현행화 되지 않습니다.
