summary_user: 경기도 도로·구조물 유지보수사업에 신기술·특허공법을 적용한 사례를 사업 한 건 단위로 담으며, 사업명·사업개요·사업비·설계용역비·발주부서와 담당자·기술분류·선정공법명·기술등록번호(reg_no)·공법선정위원회 개최일을 포함한다. 건설업체나 발주 담당자가 "교량 보수에 어떤 신기술 공법이 얼마의 사업비로 선정됐는가"를 확인하고 유사 사업 계획이나 기술 실적 분석에 쓴다. 전역 조인 키는 없으며, 기술등록번호나 공법명을 문자열로 맞춰 신기술·특허 등록 정보와 연결하거나 발주부서명으로 같은 기관 자료와 잇는 방식으로만 연결한다.
description_portal: 이 데이터는 도로 및 구조물 유지보수사업에 신기술·특허공법이 적용된 사례에 대한 정보를 포함하고 있으며, ‘사업명’, ‘사업개요’, ‘기술분류명’, ‘선정공법명’, ‘등록번호’, ‘사업비’, ‘설계용역비’, ‘공법선정위원회 개최일’ 등의 항목으로 구성되어 있습니다. 각 사업은 발주기관(부서 및 담당자)과 발주 시기, 적용된 기술 공법, 기술등록번호 등 실무적 활용에 필요한 세부정보를 포함하고 있습니다. ‘기술분류명’은 건설 > 토목 > 교량 등으로 기술의 적용 영역을 분류하며, ‘선정공법명’은 해당 기술의 상용 명칭을 나타냅니다. 이 데이터는 신기술의 실제 적용사례를 기반으로 기술 실적 분석, 유사 사업 계획 수립, 기술 확산 전략 마련 등에 활용될 수 있으며, 공공기관 및 건설업체의 신기술 도입 근거 자료로도 유용합니다.
