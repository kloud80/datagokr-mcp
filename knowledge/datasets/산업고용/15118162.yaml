description_portal: '한국가스공사 인천기지본부 내 경유 저장탱크에 보유 중인 비상설비용 경유(디젤 오일)의 월 별 보유 현황을 확인할 수 있는 자료입니다.경유는 재고량에 따라 약 연 1회 구매하고 있으며 기지 내 비상 상황시 비상발전기 및 소화해수펌프 설비에 사용됩니다. 첨부 데이터는 월 단위로 기록되었으며 기지 내 경유 탱크의 총 운영 용량은 200㎥ 입니다.저장탱크 레벨의 단위는 밀리미터(mm)이며 보유량의 단위는 세제곱미터(㎥)로 작성되었습니다.* 작성대상기간 : 2023년 5월 ~ 2026년 2월* 첨부된 데이터의 파일형식은 CSV파일입니다.'
