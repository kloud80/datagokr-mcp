description_portal: 이 데이터는 「석유 및 석유대체연료 사업법」에 따라 국내 정유사와 석유화학사가 분기별로 제출하는 석유화학 원자재 물질수지 자료를 기반으로 구축된 공공데이터입니다. 각 업체가 나프타를 비롯한 주요 원료를 어느 시점에 얼마나 구매했는지, 그리고 이를 개별 공정과 생산 단계에서 어떤 방식으로 투입하고 활용했는지를 세부적으로 정리하여 원료 흐름과 사용 구조를 명확히 파악할 수 있도록 구성되어 있습니다. 산업 전반의 원료 수급 동향 분석, 공업원료용 사용량 산정, 정책 검토 및 통계 활용 등 다양한 공공 목적에 참고할 수 있는 핵심 자료로 제공됩니다.
