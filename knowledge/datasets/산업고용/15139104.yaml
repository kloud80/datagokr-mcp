description_portal: 중소벤처기업진흥공단은 정책자금 집행의 투명성을 높이고 다양한 정책 연구를 지원하기 위해 직접 및 대리대출의 잔액 현황을 사업별로 분류하여 공개하고 있습니다. 이 데이터는 매년 말 기준으로 집계되어 제공되며, 창업기반자금, 신성장기반자금, 경영안정자금 등 주요 사업 유형별로 대출 잔액을 파악할 수 있도록 구성되어 있습니다.이러한 정보는 특정 시점에 어떤 사업 분야에 자금이 집중적으로 투입되었는지, 그리고 전반적인 정책자금의 흐름이 어떻게 변화했는지를 분석하는 데 유용합니다. 정책 당국은 물론, 연구자나 일반 대중도 이 데이터를 활용하여 중소벤처기업 지원 정책의 효과와 방향성을 다각적으로 평가할 수 있습니다.
