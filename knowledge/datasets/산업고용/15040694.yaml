summary_user: 위해상품판매차단시스템에 등록된 위해상품 검사결과를 건별로 담은 전국 단위 파일(csv, 약 4MB)로, 검사기관·제품유형·제조일자·원산지·수거일시와 부적합 시험항목의 기준(규격)·결과를 한 행에 담는다. 소비자나 유통 사업자가 '어떤 유형의 제품이 어떤 시험항목에서 기준을 넘어 부적합 판정을 받았나'를 확인하거나, 분석가가 제품유형·원산지별 부적합 경향을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 제품안전·리콜 데이터와는 문서번호나 제품유형명·검사기관명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 산업통상자원부 국가기술표준원, 환경부, 식품의약품안전처는 시중에 유통되는 상품을 수거하여 유해물질 포함 여부와 같은 위해성 여부를 판정한 후 위해상품으로 확인된 경우 해당 내용을 공표합니다. 대한상공회의소 유퉁물류진흥원에서 운영 중인 이 시스템은 해당 상품정보를 유통사에 전달하기 위해 등록 및 전송하는데 활용되며, 유통사로 전달된 정보는 이 시스템과 연계된 전국 매장에서는 위해상품의 유통을 차단하는 역할을 수행합니다. 이 데이터는 위해상품판매차단시스템에서 제공되는 검사기관, 제품유형명, 제조일자, 부적합사항 등 검사결과 정보입니다.
