summary_user: 통영시청 홈페이지에 등록된 구인 공고를 공고 한 건당 한 행으로 담은 원천 파일로, 구인제목·채용기관명·모집 분야·등록일자·상세 공고 URL로 구성되며 내려받은 CSV는 약 3.4KB의 작은 규모입니다. 통영에서 일자리를 찾는 시민이 복지관·자활센터 등 지역 공공·비영리기관의 사회복지·사무행정 채용 공고를 확인하거나, 분석가가 지역 기관의 모집 분야 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 채용 데이터(워크넷·공공기관 채용 등)와는 회사명·분야 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 자료는  통영시청 홈페이지에 공식 등록된 구인 정보를 수록하고 있으며, 각 데이터는 구인제목, 채용 기관명, 모집 분야(사무·관리직, 전문·특수직 등), 공고 등록일자, 상세 공고 내용을 확인할 수 있는 홈페이지 URL로 구성되어 있습니다. 주요 채용 기관으로는 통영지역의 복지관, 통합지원센터, 지역자활센터, YWCA 등 공공 및 비영리기관이 다수를 차지하고 있으며, 모집 분야는 사회복지, 사무행정, 전문치료사 등 지역 사회복지와 행정서비스를 담당할 다양한 직무가 포함되어 있습니다. 본 자료는 통영시민에게 최신 구인 정보를 제공하고 구직 활동을 지원하는 것은 물론, 지역 고용 현황 분석과 일자리 정책 수립 시 기초 통계자료로 활용할 수 있어 실효성 높은 지역 맞춤형 일자리 대책 수립에 기여할 수 있습니다.
