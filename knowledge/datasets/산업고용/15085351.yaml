description_portal: '○ 통계개요* 통계명 : 실질임금 상승률* 통계종류 : 사업체노동력조사의 실질임금상승률 현황을 제공하는 지정ㆍ조사통계* 작성목적 : 고용노동부에서 고용, 임금 및 근로시간에 관한 사항을 조사, 그 변동추이를파악하여 임금상승률 등 거시경제지표 산정 및 임금ㆍ고용 관련 정책의기초자료를 제공하는 것을 목적으로 함* 조사체계 : 지방고용노동관서 → 고용노동부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 임금총액, 월급여액정액, 초과급여, 실질월급여액 등의전년동월대비 증감률○ 용어설명* 임금총액 = 정액급여+초과급여+특별급여* 월급여액 = 정액급여+초과급여(상여금, 성과급 등을 포함한 특별급여는 제외)* 실질임금= (명목임금/4월 소비자물가지수) x 100* 정액급여 : 근로계약, 단체협약 또는 취업규칙 등으로 소정근로시간에 대하여미리 정한 기본급과 통상적수당, 기타수당(연차수당 포함)으로 지급한 총액* 초과급여 : 근로기준법 제56조에 따라 연장(연장야간 포함) 및 휴일근로에 대한수당으로 지급한 총액* 특별급여 : 급여지급관계규정에 명시되었는지의 여부와 관계없이 정기 또는비정기적으로 근로자에게 지급되는 급여로서 상여금, 성과급, 임금인상소급분,학자금(대출금 제외) 등으로 지급한 총액'
