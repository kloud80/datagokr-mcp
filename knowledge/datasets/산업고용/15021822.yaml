summary_user: 전라남도 함평군 관내에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 대표자명·업소명·영업 주소·우편번호·전화번호·지정일자가 들어 있으며 범위는 함평군 한 시군구입니다. 군청 인허가·청소년 유해환경 점검 담당자나 창업 준비자가 '함평군 어느 동네에 담배 판매점이 몰려 있고, 언제 지정됐나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소나 업소명을 맞춰 연결하며, LOCALDATA 담배소매업 인허가 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조해 쓴다.
description_portal: 전라남도 함평군은 담배소매업 관리의 투명성과 유통 질서 확립을 위해 관내 담배소매인 지정 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 담배소매업 허가를 받은 업소에 대한 기본 현황을 포함하고 있으며, 대표자명, 업소명, 영업 주소, 우편번호, 전화번호, 지정일자 등의 항목으로 구성되어 있습니다. 해당 데이터는 담배소매인 분포 현황 파악, 지역별 허가 기준 관리, 청소년 유해환경 점검, 영업허가 및 민원 업무 대응 등에 활용될 수 있으며, 편의점·소매점 운영현황 분석, 담배유통 정책 수립, 상권 내 담배판매업 관리 체계 구축을 위한 기초자료로서의 활용 가치도 높습니다. 또한 지역 내 공정한 유통질서와 담배 판매 환경 조성을 위한 행정적 기반으로 유용한 공공정보입니다.
