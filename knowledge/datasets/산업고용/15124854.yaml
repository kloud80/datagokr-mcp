description_portal: 이 데이터는 한국남부발전의 전사 차원에서 집계된 바이오중유 사용 실적을 기록한 자료입니다. 항목에는 날짜별 사용량, 사용 플랜트와 호기, 사용 단위(Liter)가 포함되어 있어 월별·연도별 연료 사용 추이를 쉽게 확인할 수 있습니다. 바이오중유는 식물성 자원 등을 활용한 친환경 연료로, 화석연료 대비 온실가스 배출을 줄이고 에너지 전환에 기여하는 중요한 자원입니다. 본 데이터를 통해 발전소별 바이오중유 사용 현황을 분석할 수 있으며, 친환경 연료 보급 확대 효과, 탄소 저감 기여도, 설비별 운영 효율성 등을 평가하는 데 활용할 수 있습니다. 연구자와 정책 담당자는 에너지 정책 수립과 신재생에너지 확대 전략을 검토하는 데 유용하게 활용할 수 있으며, 일반 국민은 공공기관이 실제로 친환경 에너지 사용을 늘려가는 과정을 이해할 수 있습니다. 또한 이 데이터는 ESG 경영 실천과 기후변화 대응 성과를 확인하는 중요한 기초 자료로 활용될 수 있습니다.
