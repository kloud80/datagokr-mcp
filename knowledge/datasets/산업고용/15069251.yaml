summary_user: 한국서부발전 석탄화력 발전소에서 쓴 석탄(소비탄)의 사용량과 품질 성상을 연도·호기 단위로 담은 집계 파일로, 총수분·휘발분·회분·고정탄소·유황률·인수식 발열량·미연탄소분율 등 성분 분석값이 들어 있다(csv 약 8KB). 에너지·환경 분석가가 "호기별로 쓰는 석탄의 발열량과 황·회분 함량이 연도에 따라 어떻게 달라졌나" 같은 연료 품질과 배출 관련 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 발전량·배출 측정 자료와는 연도와 호기 이름을 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 코드로 바로 붙일 수 없고, 호기명·연도 매핑에 기대야 한다. 위치 정보가 없는 비공간 자료라 지역별 분석에는 쓰기 어렵다. 실시간·일별 전력 수급 정보가 아니라 연도 단위 연료 성상 자료다.
