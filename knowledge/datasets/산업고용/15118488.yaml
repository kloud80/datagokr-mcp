description_portal: 본 자료는 고용노동부의 청년일자리올인원지원서비스 정책에 따라 워크넷을 통해 제공되는 대학일자리센터(청년취업진로지도지원기관) 정보를 수록하고 있습니다. 이 센터는 청년을 대상으로 한 진로지도, 취업상담, 일자리 연계 서비스를 통합 제공하는 기관으로, 대학 내에 설치되어 있으며 재학생뿐 아니라 지역 청년에게도 서비스를 제공합니다. 데이터는 각 기관의 고유 코드, 명칭, 소재지 주소, 연락처 등 기본 정보와 함께, 센터의 설립 목적과 주요 기능, 서비스 제공 범위 등을 포함합니다. 이 정보는 고용정책 기획, 청년지원사업 운영 실적 분석, 지역 기반 청년고용 서비스 체계 구축을 위한 기초자료로 활용됩니다.
