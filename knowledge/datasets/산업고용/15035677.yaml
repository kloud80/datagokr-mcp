summary_user: "광주광역시 남구 관내에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 업소명·도로명주소·전화번호·지정일자·데이터기준일자를 담는다(CSV 약 37KB). 창업 예정자나 상권 분석가가 '남구 어느 동네에 담배 판매점이 몰려 있고, 최근 언제 지정됐나'를 확인하거나 신규 지정·이전 후보지를 검토할 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업소명·도로명주소를 맞춰 붙여야 한다(예: LOCALDATA 담배소매업 인허가 원장, 소상공인 상가업소 정보)."
description_portal: 광주광역시 남구 관내의 담배소매인 지정 현황 및 정보(업소명, 주소, 전화번호, 지정일자 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2714)에서 제공합니다. 대표 전화번호가 없거나 개인정보가 포함되어 있는 경우, 미기재하였으니 데이터 이용 시 참고하시기 바라며, 또한 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 담배소매인은 법령에 따라 지정된 장소에서 담배를 판매할 수 있는 권한을 가진 소매점을 말합니다. 주로 편의점, 슈퍼마켓, 전담점 등이 해당하며, 지정은 관할 지자체에서 처리합니다. 해당 데이터를 통해 상권 분석, 담배 판매점 분포 파악, 신규 지정 또는 이전 검토, 청소년 보호구역 내 판매점 관리 등 다양한 행정 업무에 활용할 수 있습니다. 이를 통해 합법적이고 체계적인 담배 유통 질서 확립과 지역 상권 관리에 기여할 수 있을 것으로 보입니다.
