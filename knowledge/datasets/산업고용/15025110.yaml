summary_user: 부산광역시 연제구에 등록된 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 파일로, 등록신청사업 구분·상호·사업장 전화번호·지번 및 도로명 소재지를 포함한다. 주민이나 금융이용자가 연락해 온 대부업체가 연제구에 정식 등록된 업체인지, 동네에 어떤 대부업체가 어디에 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소 문자열 매칭으로만 잇고, 지방행정 인허가(LOCALDATA) 대부업 원장이나 다른 구의 같은 현황 파일과 붙여 지역 비교에 쓴다.
description_portal: 부산광역시 연제구_대부업 등록 현황은 대부업 등의 등록 및 금융이용자 보호에 관한 법률에 따라 부산광역시 연제구에 등록되어있는 대부업 및 대부중개업에 대한 현황 정보로 구성된 데이터입니다.제공항목으로는 등록신청사업, 상호, 사업장 전화번호, 소재지(지번), 소재지(도로명)이 있습니다.대부업 등의 등록 및 금융이용자 보호에 관한 법률 제2조에 따르면,“대부업”이란 금전의 대부(어음할인ㆍ양도담보, 그 밖에 이와 비슷한 방법을 통한 금전의 교부를 포함한다. 이하 “대부”라 한다)를 업(業)으로 하거나 다음 각 목의 어느 하나에 해당하는 자로부터 대부계약에 따른 채권을 양도받아 이를 추심(이하 “대부채권매입추심”이라 한다)하는 것을 업으로 하는 것을 말합니다.“대부중개업”이란 대부중개를 업으로 하는 것을 말합니다.사업장 전화번호가 공란인 경우는 개인정보(휴대폰 번호)가 포함되어 있어 공란으로 처리하였습니다.
