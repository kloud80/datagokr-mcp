description_portal: "한국가스안전공사에서 추진한 가스안전장치(타이머콕) 보급사업에 대한 현황 정보 입니다.공사는 고령자, 장애인, 한부모가정 등 사회 취약계층의 가스렌지 취급부주의 과열화재사고 예방을 위한 타이머콕 보급 사업을 수행해 왔습니다. 해당 목록은 행정구역(시군구), 추진지사, 보급건수, 기타 정보가 수록되어 있습니다.본 데이터를 활용하여 가스안전장치 보급현황 통계 분석, 사전 예방, 안전관리 강화 등을 위한 참고자료 등으로 활용 가능합니다.※ 데이터 범위는 2011년부터 2025년 9월 까지 보급된 현황 총계입니다.※ '기타'의 경우, 공사 자체 보급 건수 외 협업사항에 대한 건수로 '연도'는  기타건수의 최대실적에 대한 연도입니다.(참고용)※ 해당 지역의 기타 실적이 없는 경우 '기타' 및 '연도'는 공란으로 처리되어 있습니다.※ 데이터 기준일 : 2025년 9월 30일"
