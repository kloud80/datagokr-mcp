summary_user: 고용24(work24)에서 제공하는 일학습병행 훈련과정 목록으로, 과정별로 과정명·훈련기관·주소·연락처·훈련 시작·종료일·훈련대상·정원과 실제 인원·NCS 코드·지역 코드를 담는 건별 데이터이며 범위는 전국입니다. 구직자·학생이나 학습기업 담당자가 우리 지역에서 열리는 단독기업형·공동훈련센터형·도제학교·IPP 등 일학습병행 과정과 모집 일정을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고, NCS 코드(ncsCd)를 NCS 코드 마스터와, 훈련기관 코드(instCd)·과정 ID(trprId)를 같은 기관의 다른 직업훈련 과정 데이터와 맞춰 잇는다.
description_portal: 단독기업형도제식 현장 교육훈련과 사업장 외 교육훈련을 개별 기업이 독립적으로 수행하는 학습기업 참여형태(50인 이상)입니다아우스빌둥특성화고 학생(3학년 2학기 졸업예정자)이 독일차 한국 딜러사(학습기업)을 통해 전문대학위를 취득하면서 3년간의 교육(군복무 기간 제외)으로 학교에서의 이론교육과 기업현장에서의 실무교육이 결합된 독일식 일학습병행 모델입니다.공동훈련센터형도제식 현장 교육훈련은 학습기업이 수행하고 사업장 외 교육훈련은 학습기업과 협약을 체결한 공동훈련센터가 수행하는 학습기업 참여형태(20인 이상)입니다도제학교특성화고 및 일반고(직업계열) 학생이 학교(이론 및 기초실습) 와 기업(심화실습)을 오가며 NCS 기반 교육훈련을 받는 훈련 모델입니다IPP일학습병행과 장기현실습을 수행하는 사업으로 기업의 근로자로 채용되어 훈련을 받거나 전공분야 기업의 실습을 지원하는 훈련 모델입니다유니테크특성화고 재학생을 학습근로자로 채용하여 2년간 훈련진행 후, 졸업한 학습근로자를 전문대학으로 진학시켜 훈련 진행하는 장기간의 훈련과정입니다P-Tech산학일체형 도제학교 훈련 졸업생 등을 대상으로 폴리텍·전문대 등과 연계하여 실시하는 중·고급 수준의 기술훈련과정입니다전문대-재학생단계능력중심기반 맞춤형 실용 기술인재 양성을 위하여 전문대 최종학년을 대상으로 실시하는 NCS 학사체계 기반의 훈련 모델입니다. ※ 남자의 경우 군필 또는 면제자민간자율형기업이 주도하는 새로운 형태의 일과 학습을 병행하는 훈련 모델로 지역,산업별 훈련수요를 반영한 훈련과정을 자유롭게 설계(NCS 자율적용)할 수 있는 훈련입니다.
