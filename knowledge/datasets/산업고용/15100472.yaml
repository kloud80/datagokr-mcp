summary_user: 인천 미추홀구 안에서 영업 중인 동물수입업·동물전시업 업체를 한 곳씩 담은 건별 목록으로, 업종 유형·상호명·도로명주소·전화번호를 담는다(파일 크기 507바이트의 소규모 CSV). 반려동물을 수입·판매하거나 동물을 전시하는 업체가 우리 동네 어디에 있는지 확인하려는 주민이나, 관내 동물 관련 영업 현황을 살피는 분석가가 쓴다. 공통 조인 키가 없어 다른 데이터와는 상호명·도로명주소를 맞추거나 같은 기관(미추홀구) 기준으로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 동물 관련 업종 자료와 대조하는 용도에 쓴다.
description_portal: '인천광역시 미추홀구의 동물수입 및 전시업 현황 데이터로 동물서비스업 관련 유형, 상호명, 도로명주소, 영업장 정보 등의 데이터를 포함하고 있습니다.영업자의 성명은 개인정보 보호를 위해 제공하지 않습니다. 2025. 6. 17. 기준 동물수입업은 2개소, 동물전시업은 3개소의 업체가 운영 중에 있습니다.동물수입업:  반려동물을 수입하여 판매하는 영업. 관내 2개소 영업 중. 동물보호법 제69조에 의한 허가 후 영업.동물전시업:  반려동물을 보여주거나 접촉하게 할 목적으로 영업자 소유의 동물을 5마리 이상 전시하는 영업. 관내 3개소 영업 중. 동물보호법 제73조에 의한 신고 후 영업.'
