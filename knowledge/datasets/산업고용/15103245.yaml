summary_user: 전력시장 회원사가 입찰한 전력량을 회원사(회원사명)별·거래년월별로 월 합산한 집계 데이터로, 단위는 GWh이며 범위는 전국·비공간이다. 전력시장 분석가나 에너지 사업자가 특정 발전회사가 월별로 얼마나 입찰했는지, 회원사 간 입찰 규모가 어떻게 달라지는지를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 회원사명 이름 매핑이나 거래년월(YYYYMM) 기준으로만 이어 쓴다.
description_portal: 'ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다.ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다.ㅇ 해당목록은 전력시장 회원사에서 입찰한 전력량 자료를 월별로 합산하여 제공되는 서비스입니다. 소속 회원사별로 구분합니다.  * 단위 : GWh'
