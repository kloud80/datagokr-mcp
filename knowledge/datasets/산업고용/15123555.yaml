summary_user: 한국모태펀드가 출자한 자조합(벤처투자조합)을 조합 한 건당 한 행으로 담은 목록으로, 조합명·대표 운용사(GP)·결성일·결성총액(백만원)이 들어 있으며 활용신청 없이 받는 전국 단위 CSV 파일(약 13만 바이트)이다. 벤처캐피털 분석가나 창업기업이 '어느 운용사가 모태펀드 자조합을 몇 개, 어떤 규모로 운용하는가', '특정 연도에 결성된 조합의 총액은 얼마인가'를 확인하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어서, 다른 벤처투자·운용사 데이터와는 조합명이나 운용사명(대표GP)을 이름으로 맞춰 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 기업·인증 데이터와 사업자번호로 연결하지 못하고 이름 매칭에 의존해야 한다. 포털 설명에는 대표자 성함·연락처가 있다고 하나 실측 필드는 연번·조합명·대표GP·결성일·결성총액뿐이며, 지역 정보도 없는 전국·비공간 데이터다.
