description_portal: '○ 통계개요* 통계명 : 전력사용량(제조업 중분류별)* 통계종류 : 한국전력공사의 서울시 제조업종별 전력사용량 현황을 제공하는 일반통계* 근거법령 :「전기사업법」제41조에 의거 전력시장에 관한 정보를 공개* 작성목적 : 전력사용량 현황을 파악하여, 전력시장 운영을 효율적으로 관리하고전력관련 정책 수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 한국전력공사* 공표주기 : 정기(매월)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 전력사용량의 제조업종별(음식료품및담배제조업·섬유의복 및가죽산업ㆍ목재및 나무제품 등) 현황○ 용어설명* 용도별 : 계약종별과 관계없이 용도 및 산업분류에 의한 분류* 한국표준산업분류에 따라 신규접수시 고객별로 부여한 용도코드에 의해 분류* 제조업 : 표준산업분류 대분류 제조업'
