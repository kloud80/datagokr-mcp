description_portal: 한국서부발전의 재난관리 업무협약 체결현황 정보 입니다. 평택발전본부에서는 한국가스공사 평택기지본부 / 한국석유공사 평택지사 / SK가스(주) 평택기지 / SPTT㈜ 평택운영본부 등과 함께 재난·안전 교류협약을 체결하였으며, 서인천발전본부에서는 인천 서구보건소 / 청라3동 행정복지센터 / 신현·원창 행정복지센터 / 포스코에너지 인천발전소 / 청라 119안전센터 / 신현 119안전센터 / 100연대 3대대 등과 인천 서구지역 재난 예방·대응을 위한 업무협약을 체결하였습니다. 본사는 한국농어촌공사(서산·태안지사)/ 한국소방안전원 등과 재난관리자원 공동활용을 위한 업무협약, 소방안전관리 업무 협약 등을 체결하였습니다.
