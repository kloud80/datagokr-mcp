summary_user: 한국전력공사의 대용량 전력고객을 고객(설비)별로 한 행씩 담은 원천 목록으로, 설비 용량, 장비·점검·유무상·순환 기준, 공급분류, 업종분류, 변전소 분류와 시도·군구·번지·우편번호 같은 위치 정보를 전국 범위로 담는다(CSV 약 9.3MB). 에너지 분석가나 전력망 정책 담당자가 "어느 시도·업종에 대용량 수전 설비가 몰려 있고 점검 기준은 어떻게 다른가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시도·군구 이름이나 우편번호를 행정구역 코드와 매핑하거나, 업종분류를 산업분류와 대조하는 식으로 한전 지역별 전력사용량 등 다른 데이터와 잇는다.
description_portal: 한국전력공사에서 제공하는 전력고객주요정보의 대용량고객일반정보 데이터로 대규모 전력 수요 고객의 기본 속성과 관리 기준을 종합적으로 정리한 자료입니다.오류정보, 생성연도, 장비기준, 점검기준, 유무상기준, 용량, 등록일자 등의 칼럼으로 구성되어 있어, 고객별 설비 용량, 운영·점검 기준, 업종 분류와 지역 위치를 한눈에 파악할 수 있습니다.데이터 이용자는 고객별 전력 공급 안정성을 평가하거나, 지역·업종별 전력 수요 특성을 분석하는 데 활용할 수 있습니다.또한 설비 기준과 점검 방식을 비교해 관리 체계를 표준화하고, 전력망 안정성 강화 정책 수립에도 쓰일 수 있습니다.
