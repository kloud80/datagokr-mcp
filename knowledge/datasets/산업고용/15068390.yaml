description_portal: 한국가스공사의 수의계약 내역을 기록한 경영공개 자료 입니다. 수의계약은 경쟁입찰 없이 특정 업체와 직접 계약하는 방식으로, 긴급한 상황이나 특수한 기술이 필요한 경우 등에 활용되며, 공기업 경영 투명성 확보 차원에서 그 내역이 공개됩니다. 본 데이터는 공사의 계약 투명성 제고 및 국민의 알권리 실현을 목적으로 수집 관리되고 있습니다. 데이터의 세부 항목으로는 계약명, 계약일자, 계약 시작 및 종료 일자, 계약 금액(원), 계약 상대자, 대표자, 계약 내용, 수의계약 근거, 사유, 예정 가격(원) 등이 포함되어 있습니다.본 데이터를 활용하면 공사의 계약 현황 분석 및 적정성 검토, 투명 경영 모니터링, 공공조달 정책 연구에 기초자료로 활용할 수 있어 공기업 경영 투명성 향상과 국민 신뢰 제고에 기여할 것으로 기대됩니다.
