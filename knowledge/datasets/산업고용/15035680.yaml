summary_user: 경상북도 봉화군 안에서 담배를 소매 판매하는 업소를 한 곳당 한 행으로 담은 건별 목록으로, 소매인 구분·업소명·지번 및 도로명 주소·전화번호(없으면 미보유 사유)를 담는다(CSV 약 15KB). 주민이나 분석가가 '봉화군 어느 읍면에 담배소매점이 몇 곳 있고 어디에 있나'를 확인하거나, 편의점·소매점 입지를 살필 때 쓴다. 실측 컬럼에 사업자번호나 행정코드 같은 공통 조인 키가 없어 다른 데이터와는 주소 문자열(지번·도로명)이나 업소명으로만 맞춰 이어 쓰며, 다른 시군의 LOCALDATA 담배소매업 인허가 자료나 소상공인 상가업소 정보와는 주소 매칭으로 대조한다.
description_portal: '이 데이터는 경상북도 봉화군 내에서 담배를 소매 판매하는 업소들의 정보를 제공하는 자료입니다. 각 업소의 명칭, 위치(주소 및 도로명 주소), 전화번호 등의 정보를 포함하고 있으며, 담배소매인 사업자의 관리, 유통, 세금 부과 등의 행정 업무에 활용될 수 있습니다. 이 데이터는 소매인 구분에 따라 ‘일반’ 및 기타 구분으로 나뉘며, 전화번호 미보유 사유도 함께 제공되어 보다 정확한 관리와 민원 대응이 가능합니다. 본 데이터는 총 7개 항목으로 구성되어 있으며, 기준일은 2026년 4월 9일입니다.소매인구분: 소매인의 유형을 구분하며, "일반"으로 표시됩니다.업소명: 담배를 소매 판매하는 업소의 상호명입니다.소재지지번주소: 업소의 지번 주소입니다.소재지도로명주소: 업소의 도로명 주소입니다.업소전화번호: 해당 업소의 연락처입니다.전화번호미보유사유: 전화번호가 비공개인 경우 그 사유가 명시됩니다.데이터기준일자: 데이터가 집계된 기준일로, 2026년 4월 9일로 명시되어 있습니다.'
