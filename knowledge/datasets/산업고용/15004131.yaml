description_portal: 한국동서발전에서 운영 중인 각 사업소의 연도 및 월 단위 우드펠릿 사용현황 정보는 바이오에너지 연료로 활용되는 우드펠릿의 소비 내역을 정량적으로 기록한 데이터입니다. 이 데이터는 연월, 사업소, 국내산 사용량, 수입산 사용량, 총사용량 등의 항목으로 구성되어 있으며, 사업소별 우드펠릿 소비 규모와 연료의 공급 출처(국내·해외)를 구분하여 파악할 수 있도록 설계되어 있습니다. 우드펠릿은 신재생에너지 확대와 탄소중립 실현을 위한 주요 바이오매스 연료 중 하나로, 해당 데이터를 통해 에너지 자립도, 친환경 연료 전환 속도, 수입 의존도 등의 정책적 지표 분석이 가능합니다. 학계 및 연구기관에서는 이 데이터를 활용하여 국내산과 수입산 우드펠릿 사용 비중 비교, 월별·사업소별 소비 추이 분석, 바이오매스 연료 사용의 계절성과 수급 안정성 연구를 수행할 수 있습니다. 또한, 재생에너지 확대 정책 효과 검토, 발전소 연료 다양화 수준 평가, 지속가능한 연료 공급 체계 설계 등 실증 기반의 에너지 전환 연구에도 폭넓게 활용될 수 있습니다.
