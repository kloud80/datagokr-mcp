summary_user: 에너지효율시장 조성사업으로 정부 보조금을 받은 사업장별 지원 실적을 관리번호 단위로 담은 전국 범위 파일(csv)로, 총사업비·정부보조금(백만원)과 교체한 설비 종류·수량·총용량(kW)을 최대 3개 설비까지 기록한다. 기업·기관 담당자나 정책 분석가가 "어떤 고효율 설비에 보조금이 얼마나 지원됐고 사업비 대비 보조 비율은 어느 정도인가"를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명이나 설비명을 기준으로 이름 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: 에너지효율시장 조성사업으로 지원된 연간 실적을 관리번호별로 제공합니다.에너지효율시장 조성사업은 고효율 에너지 설비의 시장 활성화와 보급 확대를 목적으로 정부에서 보조금을 지원하는 사업입니다.이를 통해 기업 및 기관의 에너지 비용을 절감하고 국가적으로는 에너지 절약 및 온실가스 감축 목표를 달성하는 데 기여합니다본 데이터는 관리번호, 지원사업장, 총사업비(백만원), 정부보조금(백만원), 설비합계, 개채별(1~3개체) 설비와 수량 등의 항목으로 구성되어 있습니다.본 데이터를 통해 기업 및 기관은 정부의 에너지 효율 관련 보조금 현황과 설비 지원 실적을 분석할 수 있으며, 정책 연구, 시장조사, 에너지 효율성 개선을 위한 전략 수립 및 관련 사업 추진 시 유용하게 활용할 수 있습니다.
