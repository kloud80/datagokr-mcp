summary_user: 경기도 김포시에 허가된 고압가스 저장소를 사업소 한 곳당 한 행으로 담은 목록으로, 법인명(상호), 사업의 종류와 세부종류, 사업소 소재지 주소, 허가일자, 취급가스 정보가 들어 있다. 김포시 안에서 어떤 업체가 어디에서 어떤 가스를 저장·취급하는지 확인하려는 주민, 안전 점검 담당자, 가스 업종 분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 상호명이나 사업소 주소로 맞춰 이어 붙이고, 다른 시군의 같은 고압가스 현황이나 LOCALDATA 에너지 업종 인허가 원장과도 같은 방식으로 이어 쓴다.
description_portal: 경기도 김포시의 고압가스저장소현황에 대한 정보를 제공합니다. 제공 항목으로는 순번, 법인명(상호), 사업의종류, 세부종류, 사업소소재지, 허가일자, 취급가스정보, 데이터기준일자로 구성되어있습니다. 본 데이터를 통해 사업종류 및 세부종류에 따른 취급가스 정보 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 기후에너지과로 연락주시기 바랍니다.
