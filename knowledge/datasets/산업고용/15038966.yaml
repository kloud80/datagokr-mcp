summary_user: 제주관광공사 온라인면세점에 입점한 브랜드를 한 건씩 담은 목록으로, 브랜드 한글명·영문명·설명, 사용 여부, 비회원 할인 사용 여부, 등록·수정 일자로 구성되며 포털 설명상 1,224건입니다. 면세점 운영자나 유통·관광 분석가가 '제주 온라인면세점에 어떤 브랜드가 입점해 있고 그중 비회원 할인이 적용되는 브랜드는 무엇인가'를 확인하는 데 쓴다. 조인 키는 브랜드아이디(jto_dfs_brand_id) 하나뿐이어서 같은 아이디를 쓰는 온라인면세점 자료와만 이을 수 있고, 사업자번호나 좌표가 없어 업종 인허가(LOCALDATA) 원장과는 직접 연결되지 않는다.
description_portal: 온라인면세점 시스템의 브랜드명 데이터는 면세점에 입점한 다양한 브랜드 정보를 효율적으로 관리하기 위해 생성·운영되는 자료입니다. 데이터는 브랜드아이디, 브랜드명, 브랜드한글명, 브랜드영문명, 브랜드설명, 브랜드사용여부, 비회원할인사용여부, 등록일시, 수정일시 항목으로 구성되며 총 1,224건이 제공됩니다. 이를 통해 고객은 원하는 브랜드를 한글과 영문으로 쉽게 검색할 수 있고, 운영자는 브랜드별 판매 현황과 관리 효율성을 높일 수 있습니다. 또한 브랜드명 데이터는 상품 전시의 체계적 운영, 마케팅 전략 수립, 비회원 할인 정책 관리, 온라인면세점 경쟁력 강화 및 관광객 만족도 향상에 활용될 수 있습니다.
