description_portal: 「고용허가제 민원서식별 업종별 필요서류 자료」는 외국인 근로자를 고용하려는 사업장이 제출해야 할 서류를 업종별·민원유형별로 체계화한 안내 자료입니다. 고용허가제(E-9·H-2 등)의 특성상 제조업·건설업·농축산업·어업·서비스업 등 업종마다 요구되는 증빙이 다르기 때문에, 해당 자료는 사업주가 어떤 민원을 진행할 때 어떤 서류를 빠짐없이 준비해야 하는지 명확히 확인하도록 구성되어 있습니다. 본 자료에는 ▲고용허가 신청 ▲재고용 신청 ▲외국인근로자 근로개시 신고 ▲사업장 변경 승인 ▲특례업종 신청 등 주요 민원 절차별 필수서류와 선택(상황별) 제출서류가 구분되어 표기됩니다.
