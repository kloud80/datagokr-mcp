summary_user: 대전광역시 중구에 있는 준대규모점포(기업형 슈퍼마켓 등)를 점포 한 곳당 한 행으로 담은 목록 파일로, 점포명·전화번호·도로명 소재지·월~목과 금~일로 나눈 영업시간·휴무 정보·관리기관을 담는다. 중구 주민이나 인근 소상공인이 '우리 동네 준대규모점포가 어디에 있고 언제 쉬는가'를 확인하거나, 분석가가 중구 상권의 대형 유통 점포 분포를 살펴보는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소나 점포명으로 소상공인 상가업소 정보나 전국 대규모·준대규모점포 표준데이터와 맞춰 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 소재 준대규모점포 현황(연번, 점포명, 전화번호, 소재지, 요일별 영업시간, 휴무정보, 관리기관 정보 등) 데이터를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 소재지는 도로명주소 기준으로 작성되었습니다.영업시간은 월~목 영업시작 시간 및 영업종료 시간, 금~일 영업시작 시간 및 영업종료 시간으로 되어 있으며, 휴무일은 별도로 구분하여 작성되었습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
