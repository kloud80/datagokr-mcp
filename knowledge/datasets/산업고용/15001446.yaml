summary_user: 부가통신서비스 신고 사업자를 건별로 담은 전국 원천 파일로, 14,833건이 1990-12-03부터 2026-02-26까지의 신고일자 범위에 걸쳐 있다. 분석가나 사업자가 신고 연도별 신규 진입 추이, 관할 전파관리소별 사업자 분포 같은 질문에 쓴다. 사업자등록번호(bizno)와 지번·도로명주소(address)가 조인 키라서 다른 인허가 원장이나 사업자 단위 기업 데이터, 주소 기반 상권·지역 데이터와 이어 쓴다.
description_portal: 해당 데이터는 신규 등록된 부가통신서비스 제공 사업자들의 정보를 수록한 현황 자료입니다. 각 기업의 사업자명,지번주소,도로명주소,관리기관(관할 전파관리소)등의 항목으로 구성되어 있으며, 이를 통해 최근 시장에 진입한 사업자들의 규모와 분포를 파악할 수 있습니다. 등록일자를 기준으로 등록 추이 및 시점 분석이 가능하고, 전파관리소별 관리 건수를 통해 지역별 사업자 집중도도 확인할 수 있습니다. 또한, 기업 유형이나 서비스 개시 시점 등의 부가 정보와 함께 분석하면, 통신서비스 산업의 변화 방향, 신규 사업자 특성 및 시장 진입 동향을 다각도로 해석할 수 있습니다.
