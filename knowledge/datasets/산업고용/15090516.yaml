description_portal: 본 자료는 경기도 부천시에 있는 직업소개소의 정보를 정리한 것으로, 각 업체의 명칭, 유료·무료 여부, 전화번호, 소재지(도로명 기준) 등 기본 정보를 포함하고 있습니다.구직자와 구인처가 직업소개소를 쉽고 편리하게 이용할 수 있도록 필요한 정보를 한눈에 확인할 수 있게 구성하였으며,고용 관련 서비스를 더욱 효율적으로 활용하는 데 도움이 되도록 하였습니다.또한, 이 자료를 제공함으로써 직업소개소 운영 현황에 대한 정보를 시민들에게 투명하게 알리고, 고용서비스 이용 시 공공성과 접근성을 한층 높이고자 합니다.※ 전화번호가 빈칸인 경우는 휴대전화 등 개인 번호이거나, 관내에서 확인되지 않은 정보임을 알려드립니다.
