summary_user: 경기도 부천시에 있는 직업소개소를 업체별로 한 행씩 정리한 파일로, 업체명·유료/무료 구분·전화번호·도로명 소재지를 담는다(약 13KB 규모의 CSV). 부천에서 일자리를 찾는 구직자나 사람을 구하는 사업주가 "우리 동네에 무료로 이용할 수 있는 직업소개소가 어디 있고 연락처는 무엇인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명 주소를 맞춰 붙여야 하며, 주소를 좌표로 바꾸면 지도·상권 데이터와 겹쳐 볼 수 있다.
limits: 부천시 한 곳만 다루므로 다른 시군구나 전국 현황은 이 파일로 볼 수 없다. 사업자번호 같은 공통 식별 코드가 없어 등록·인허가 데이터와 정확히 연결하기 어렵다. 전화번호가 빈 칸이면 개인 번호이거나 시에서 확인하지 못한 경우이다.
