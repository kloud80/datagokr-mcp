description_portal: "본 데이터는 사업이나 과제 수행 시 필수적으로 요구되는 절감에너지 종류에 대한 정보를 제공합니다. 제공되는 정보는 절감에너지의 명칭뿐만 아니라 코드명, 단위, 그리고 상위 에너지 코드에 대한 정보를 포함하고 있습니다. 이러한 데이터는 에너지 관리 및 효율성을 증대시키기 위한 다양한 분야에서 활용될 수 있으며, 특히 산업계에서는 에너지 절약과 관련된 정책 수립 및 효율적인 에너지 사용 분석에 유용한 자료로 쓰일 수 있습니다. 이를 통해 기업 및 기관은 보다 체계적이고 전략적인 에너지 관리 방안을 마련할 수 있을 것으로 기대됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. '절감에너지코드'(숫자형): 절감에너지의 고유 코드, '절감에너지코드명'(문자형): 절감에너지의 명칭, '단위명'(문자형): 절감에너지의 측정 단위, '상위절감에너지코드명'(문자형): 해당 절감에너지의 상위 코드명, '등록일자'(날짜형): 데이터 등록 일자."
