summary_user: 군산시 관내에서 담배 판매를 지정받은 소매인을 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업소명·지번주소·도로명주소·지정일자·법인구분을 포함한다. 시민이나 상권 분석가가 '우리 동네 어디에 담배소매점이 있고 언제 지정됐는가'를 확인하거나, 지자체가 청소년 보호·불법 판매 감시를 위해 판매점 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소나 업소명 매칭으로만 잇고, 같은 지방행정 인허가(LOCALDATA) 계열의 업종 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조하는 식으로 쓴다.
description_portal: 본 데이터는 전북특별자치도 군산시 관내에서 담배를 판매할 수 있도록 공식적으로 지정된 담배소매인의 현황을 정리한 자료로, 업소명, 지번 주소 및 도로명 주소, 지정일자, 법인구분 등의 정보를 포함하고 있습니다. 이 데이터는 담배소매업소의 위치 분포 및 지정 시기 등을 파악함으로써, 지자체의 유통 질서 관리, 담배 관련 정책 수립, 불법 판매 감시 등의 행정 업무에 활용될 수 있습니다. 또한 청소년 보호 및 건강권 증진을 위한 정책 수립의 기초 자료로 활용되며, 공정한 소매업 환경 조성과 함께 지역 내 상권 분석, 민원 대응, 규제 완화나 강화에 필요한 근거자료로도 유용하게 활용됩니다. 자료는 주기적으로 갱신되어 최신 지정 현황을 반영합니다.
