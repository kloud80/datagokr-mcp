summary_user: 서울 종로구 관내 공공시설에 설치된 태양광 설비를 시설 한 곳당 한 행으로 정리한 파일로, 설치연도·설치장소·도로명주소·설비용량(kW)·설치비와 2016~2025년 연도별 발전량(kWh)을 담는다(csv 약 4KB 규모의 소량 원장). 구청 담당자나 연구자가 '종로구 공공 태양광은 설비용량 대비 연간 얼마나 발전하고 해마다 어떻게 변했나'를 시설별로 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 도로명주소를 지오코딩하거나 시설명을 매칭해 이어 쓴다.
limits: 연도 단위 발전량만 담고 있어 실시간·시간별 발전량이나 전력 수급·SMP 같은 시장 정보를 얻는 데는 쓰지 못한다. 범위가 종로구 공공시설로 한정되며 표준 코드 키가 없어 다른 데이터와는 주소나 이름 매칭으로만 연결된다.
