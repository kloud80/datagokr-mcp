summary_user: 중소벤처기업진흥공단 호남연수원이 운영하는 연수과정을 과정 단위로 담은 연간 운영계획 목록으로, 대·중·소 분류, 과정명, 기간, 운영횟수, 정원과 1~12월 월별 운영 정보를 담는다(CSV 파일 약 5KB 규모). 중소기업 임직원이나 교육 담당자가 '올해 호남연수원에서 생산관리·국제인증 같은 직무역량 연수를 몇 월에 몇 명 정원으로 여는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 기관코드 같은 전역 조인 키가 없어 다른 데이터와는 과정명·분류명 같은 이름으로만 맞대어 볼 수 있다.
limits: 조인 키가 없어 기업 확인·인증 원장 등과 사업자번호로 연결할 수 없다. 개별 수강생이나 실제 수료 실적이 아니라 과정별 운영계획(횟수·정원·월별 일정)만 담는다. 이 세부 부문에서 핵심 원장이 아닌 보조 자료로 분류돼 있다.
