description_portal: 본 자료는 한국고용정보원에서 제공하는 워크넷 직업분류표로, 직업정보 체계의 일관된 분류를 위해 정의된 기준 분류 데이터입니다.이 자료는 총 35개 직업 중분류 항목을 기준으로, 세분화된 총 537개의 직업 분류 항목을 포함하며, 각 직업은 KNOW직업명(표준직업명칭)을 중심으로 직업대분류, 직업중분류, 직업소분류, 직업세분류, 직업세세분류의 다단계 계층 구조로 정리되어 있습니다.이 직업분류체계는 워크넷의 직업정보 콘텐츠 구성, 취업정보 서비스, 직무역량 연계 분석, 교육훈련 매칭, 통계자료 코딩 등에 폭넓게 활용되며, 통계청의 한국표준직업분류(KSOC) 체계와의 연계 가능성도 고려되어 설계되었습니다.직업 탐색, 직무 데이터베이스 구축, 직업정보 시각화 플랫폼 개발 등의 기초 자료로 유용합니다.
