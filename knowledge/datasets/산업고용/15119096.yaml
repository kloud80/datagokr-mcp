summary_user: 워크넷 직업정보 체계에서 쓰는 직업분류표로, 직업 하나(표준직업명칭인 KNOW직업명)마다 대·중·소·세·세세분류의 다단계 계층을 한 행에 담은 기준 코드 마스터 파일이다(포털 설명상 중분류 35개, 직업 537개). 직업정보 서비스나 직무 데이터베이스를 만드는 분석가·개발자가 '이 직업명은 어느 직업군 계층에 속하는가'를 정리하거나 통계자료의 직업을 코딩할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 채용공고·직업훈련·직업사전 등 다른 데이터와는 직업명이나 분류명을 이름으로 맞추거나 같은 기관 코드로만 잇는다.
limits: 분류 코드 없이 분류명·직업명 텍스트만 있어 다른 데이터와 정확히 조인하기 어렵고, 이름 매핑이 필요하다. 지역·공간 정보가 없는 전국 단위 기준표라 지역별 분석에는 직접 쓰지 못한다.
