description_portal: 시민참관단은 새울원자력 3,4호기의 공론화 후속조치로 원자력발전소 안전성에 대한 국민 신뢰도 향상을 위해 새울원자력본부에서 운영하고 있습니다.새울원자력3,4호기에 관심있는 전국민(기 참여자는 제외) 누구나 지원가능하며, 시민참관단의 주요활동은 아래와 같습니다.1. 원자력 관련 지식 사전 습득   - 원자력 및 에너지 관련분야 전문가 특강   - 건설 및 시운전 분야에 대한 온라인 교육과정 수강2. 원자력발전소 운전 및 비상대응 시스템 경험   - 주제어실과 동일하게 만들어진 시뮬레이터실에서 주요 기기를 직접 조작 등3. 원자력발전소 핵심설비 현장 견학   - 원자로, 증기발생기, 터빈발전기 등4. 시운전 현장에서 각종 시험 참관 등
