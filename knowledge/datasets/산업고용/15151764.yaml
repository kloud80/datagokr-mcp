description_portal: '본 데이터는 탄소섬유 테이프의 폭을 정밀 측정하여 품질 관리 및 공정 개선에 활용하기 위해 구축된 측정 데이터입니다. 광학 센서 및 영상 분석 장비를 통해 생산 라인에서 실시간으로 수집된 폭 측정값, 온도·습도 등 환경 변수, 측정 일시 등이 포함되어 있습니다. 탄소섬유 복합재의 균일성 확보와 생산 품질 향상을 위한 기초 자료로 활용될 수 있습니다.* 컬럼 의미Bandwidth-top / Bandwidth-middle / Bandwidth-down : Slitting(6.35mm 폭 절단) 후 Rewinding 과정에서 테이프 폭(Bandwidth)을 정밀 측정한 값으로, 단위는 mm임. 기존에는 1000m 구간을 시작·중간·끝 3지점만 버니어캘리퍼스로 측정하였으나, 본 데이터는 비전 센서를 활용하여 초당 3회(3point/s) 측정한 정밀 데이터임.* 데이터 출처소재 : Thermoplastic CF-PA6 Sheet(폭 300mm → Slitting → 폭 6.35mm Tape)공정 단계 : Slitting 후 Traverls 방식으로 보빈에 Rewinding하는 과정에서 Bandwidth 측정* 활용 목적 : AFP(Automated Fiber Placement) 공정에서 시제품 제작 시 제품의 완성도 확보에 활용'
