summary_user: 한국중부발전 발전소의 발전기·호기별로 월 단위(배출년월) 이산화황·질소산화물·먼지의 허용기준과 평균농도를 담은 측정 결과 파일이다(CSV 약 16KB). 지역 주민이나 환경 분석가가 특정 발전소 호기의 월평균 배출 농도가 통합환경허가 허용기준 안에 있었는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전공기업의 같은 표준 배출량 데이터나 주변 기상·수질 측정 데이터와는 발전기명·호기명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 본 대기오염물질 배출현황 데이터는 발전소의 각 발전설비에서 배출되는 주요 대기오염물질의 측정 결과를 정리한 자료입니다. 항목은 발전기명, 호기명, 배출년월, 이산화황(SOx), 질소산화물(NOx), 먼지 등의 허용기준(ppm 또는 mg/㎥)과 평균농도로 구성되어 있으며, 대기오염물질 허용기준은 통합환경허가 기준을 적용하였습니다. 이 데이터는 발전 설비별로 실제 배출 농도와 환경 기준 준수 여부를 비교할 수 있도록 제공되며 환경 규제 준수 확인, 설비별 오염물질 관리 성과 분석, 공공 환경정보 공개 등을 위한 기반 자료로 활용될 수 있습니다.
