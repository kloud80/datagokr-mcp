summary_user: 중소벤처기업진흥공단이 운영하는 중고설비 거래 사이트 자산거래중개장터에 등록된 중고 기계설비를 매물 한 건씩 담은 파일이며, 기계 구분·제목·모델명·수량·희망가격·가격 협의 여부·사용 여부·판매상태 등을 포함하고 범위는 전국(약 730KB CSV)입니다. 중고 설비를 사거나 팔려는 중소기업이나 분석가가 '특정 모델의 중고 기계가 얼마에, 몇 대나 매물로 나와 있고 아직 판매 중인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 모델명·기계명·키워드 같은 이름 매칭으로만 느슨하게 연결한다.
limits: 매물에 판매 기업의 사업자번호나 지역 코드가 없어 기업 인증·현황 데이터와 기업 단위로 붙이기 어렵고, 지역별 분석도 할 수 없다(행정단위 전국·비공간). 데이터 기준일 시점에 등록된 매물 목록이므로 실제 거래가가 아닌 희망가격이며, 판매상태는 기준일 이후 바뀌었을 수 있다.
