summary_user: 전주시 안의 대규모·준대규모 점포를 점포 한 곳당 한 행으로 담은 파일로, 구분·업체명·주소·전화번호·개업일시·면적(제곱미터)·데이터기준일을 싣는다(csv 약 3.6KB 규모의 소량 목록). 시민이나 상권 분석가가 '전주시 어느 동네에 대형마트·준대규모 점포가 있고, 언제 문을 열었으며 매장 면적은 얼마인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 업체명·주소를 매칭해 잇는다. 예를 들어 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 원장과 주소 기준으로 대조한다.
description_portal: '전주시 내에 존재하는 대규모, 준대규모 점포들(구분, 업체명, 주소, 전화번호, 개업일시, 면적)에 관한 현황을 제공합니다.자료: 민생사회적경제과활용 포인트전주시 내 대규모 유통시설 분포 현황을 파악 가능점포유형별 현황을 통해 지역 상권 구조 분석정책 담당자는 유통산업 관리 및 지역경제 활성화 정책 수립에 활용연구자나 시민은 생활권 내 대형 유통시설 접근성을 확인 가능 이 데이터는 전주시의 유통산업 인프라와 상권 구조를 보여주는 중요한 기초자료입니다.전주시 착한가격업소 데이터는 물가 안정과 서민 생활 지원을 위해 지정된 착한가격업소의 현황을 보여주는 공공데이터입니다. 이 자료는 지역 내 소비자들이 합리적인 가격으로 외식·서비스를 이용할 수 있도록 돕고, 행정기관이 물가 관리 정책을 추진하는 데 중요한 기반이 됩니다.'
