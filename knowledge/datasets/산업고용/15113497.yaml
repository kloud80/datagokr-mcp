summary_user: 전라남도 지역 태양광 발전시설(설비용량 1,000~3,000kW 규모)을 허가 건별로 담은 원장 파일로, 허가번호·허가일·상호·설비용량·설치장소·사업개시일을 담는다. 사업자나 분석가가 전남 어느 지역에 중규모 태양광 발전소가 얼마나, 언제 허가·가동되었는지 파악할 때 쓴다. 전역 조인 키가 없어 설치장소 주소 문자열이나 상호로 매핑해 전국태양광발전소전기사업허가정보 표준데이터 등과 연결해야 한다.
description_portal: '- 전라남도 태양광 발전시설(1000~3000kw)에 대한 설치장소 및 설비용량 등 설치현황에 대한 정보를 제공합니다.- 한국은 태양광 발전이 꾸준히 확대되는 중이며, 2025년부터 본격적인 태양광 입찰을 통해 산업 안정화를 추진 중입니다.- 정부 목표 달성을 위해 연간 약 4~4.5 GW 이상 설치가 필요하다는 분석도 나오고 있어 입찰 및 정책 지원 확대가 예정되어 있습니다.- 농업, 건축, 수상 등을 활용한 다양한 발전 모델이 떠오르고 있으며, 분산형 소규모 태양광 중심으로 확산될 것으로 보입니다.- 영농형 태양광은 농지와 태양광을 병행 활용하는 방식으로, 농민 소득 증대와 식량 안보를 함께 달성하려는 대표 모델입니다.'
