summary_user: 서울특별시 양천구 관내 일반유원시설업(안전성 검사대상 놀이기구를 한 종류 이상 설치해 운영하는 업소) 사업장의 인허가 정보를 업소 한 건씩 담은 원장으로, 인허가일자·폐업일자·영업상태·업체명·소재지·좌표·놀이기구 수·의무실 유무·보험 기간 등을 포함한다. 양천구에서 현재 영업 중인 유원시설이 어디에 있고 놀이기구를 몇 대 운영하는지 확인하거나, 지도 감독·안전관리 현황을 살펴보려는 시민·연구자·행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 좌표(X, Y)를 쓰면 위치 기반으로 겹쳐 볼 수 있다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 일반유원시설업 중 기타 유형으로 분류되는 사업장의 인허가 정보를 종합적으로 수집하고 관리하기 위해 작성된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 업종구분, 놀이기구수, 의무실 유무 등 핵심 항목이 포함되어 있어  각 시설의 설립과 운영 상태를 명확히 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관에서 유원시설업 지도 감독, 안전 점검, 정책 수립에 활용할 수 있으며, 연구자와 시민은 시설 분포, 운영 유형, 안전관리 현황 분석 등 다양한 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 일반유원시설업 - 테마파크 등 안전성 검사대상의 놀이기구를 한 종류 이상 설치하여 운영하는 업소정보
