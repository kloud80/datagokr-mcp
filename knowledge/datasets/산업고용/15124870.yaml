description_portal: 이 데이터는 한국남부발전의 연도별 전력구매량을 본사와 각 발전본부별로 정리한 자료입니다. 2018년부터 2024년까지의 전력구매량(MWh)을 기록하고 있으며, 하동빛드림본부, 신인천빛드림본부, 부산빛드림본부, 남제주빛드림본부 등 주요 사업소별 현황을 비교할 수 있습니다. 예를 들어 하동빛드림본부는 2020년 95,287MWh에서 2023년 151,977MWh로 증가하는 등 발전소별 전력구매량 변화를 한눈에 파악할 수 있습니다. 본 자료는 각 발전본부의 전력 수요와 운영 특성을 이해하는 데 도움이 되며, 전력구매량 변화 추이를 통해 에너지 수요 관리와 효율적 전력 운영 전략 수립에 기초자료로 활용될 수 있습니다. 또한 공기업의 에너지 사용 현황을 투명하게 공개함으로써 대국민 이해 증진과 에너지 정책 연구에도 유용한 정보를 제공합니다.
