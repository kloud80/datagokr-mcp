summary_user: 한국산업기술시험원(KTL)이 안전인증을 한 제품을 제품 단위로 담은 파일 데이터로, 2020-01-02~2021-12-31 기간 전국 17,927행이 인증번호·인증일자·판정·제품명·모델명·제조사별로 들어 있다. 소비자나 유통업자가 특정 제품·모델이 안전인증을 받았는지 확인하거나, 분석가가 인증 제품 분류별 현황을 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 제품명·제조사명 매핑이나 같은 기관 코드로만 잇고, 제품안전정보센터 계열 제품 원장과 함께 본다.
description_portal: 이 데이터는 한국산업기술시험원(KTL)에서 제공하는 안전인증 제품 정보로, 법정 안전기준에 따라 인증을 받은 제품에 대한 상세한 정보를 담고 있습니다. 주요 항목은 인증정보(인증기관, 인증구분, 인증일자, 인증번호, 판정결과), 제품정보(제품분류, 제품명, 모델명), 제조사정보(제조사명) 등으로 구성되어 있어, 소비자와 기업이 인증 여부를 정확히 확인할 수 있도록 지원합니다. 해당 정보는 제품의 안전성 확보뿐 아니라, 유통 전 단계에서의 법적 기준 준수 여부를 판단하는 데 활용되며, 인증번호 기반의 추적 또한 가능해 불량 제품 식별이나 리콜 대응에도 활용됩니다. 또한 산업 현황 분석, 인증 통계 자료, 제품 트렌드 파악 등 공공 및 민간 분야에서 폭넓게 응용될 수 있는 데이터입니다.* 원천 데이터 생산이 중단됨에 따라 기존 연간 단위로 수행되던 데이터 업데이트를 수시 업데이트 체계로 전환함.
