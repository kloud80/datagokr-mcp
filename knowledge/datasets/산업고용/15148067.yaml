summary_user: 서울 구로구 안의 대규모점포를 사업장 한 곳당 한 행으로 담은 인허가 원장이다. 인허가일자·폐업일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표, 면적, 업태(UPTAENM)가 행마다 들어 있다. 구로구에 지금 영업 중인 대형마트·백화점이 어디에 있는지 확인하거나, 대형 유통시설 입점·폐업 추이를 보려는 상권 분석가·소상공인이 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 사업장명·주소를 맞추거나 좌표로 공간 결합해 소상공인 상가업소 정보나 전국 대규모점포 표준데이터와 이어 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 대규모점포 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 대규모점포의 면적, 업태구분, 입점 현황 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 유통 관리, 정책 수립, 연구 분석, 민원 처리 등 다양한 분야에 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계하여 활용할 수 있어 지역사회 정보 접근성과 행정 투명성을 강화하는 기반 자료로 기능한다. 또한 데이터 구조가 표준화되어 비교와 통계 작성이 가능하며, 허가 변경 이력과 상태 값을 근거로 행정 점검과 지도에 유용하다.
