summary_user: 대전광역시 서구에 등록된 전문건설업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 업체명·업종·우편번호·도로명/지번주소·전화번호를 담는다. 건설 발주자나 주민이 '서구에 있는 특정 공종의 전문건설업체가 어디이고 연락처는 무엇인가'를 찾을 때 쓰고, 분석가는 구 단위 업종별 업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 맞춰 보는 방식으로만 연결된다.
description_portal: '요약주요 항목: 순번, 업체명, 우편번호, 도로명주소, 지번주소, 전화번호제공 기관: 대전광역시 서구청. 파일 데이터는 건설과, API는 공공데이터활용지원센터가 관리.행 수: 총 651건.업데이트 주기: 연간 1회 이용 조건: 무료 제공, 이용 제한 없음.데이터.go+1상세 설명1. 제공 방식 및 형식파일데이터(CSV) 제공을 통해 로그인 없이 자유롭게 다운로드하여 활용 가능.데이터.go오픈API(JSON/XML) 형태는 공공데이터포털을 통해 제공되며, API 명세는 Swagger UI 기반으로 확인 가능한 REST API 형태입니다. 활용을 위해서는 포털 회원가입 및 활용 신청이 필요합니다.데이터.go+12. 데이터 항목 구성파일 및 API 양식에는 다음과 같은 정보가 포함되어 있습니다:순번, 업체명, 업종우편번호, 도로명주소, 지번주소행정동명, 행정동코드, 법정동명, 법정동코드전화번호데이터.go3. 운영 및 관리제공기관: 대전광역시 서구파일데이터 관리 부서: 건설과API 관리 및 지원: 공공데이터활용지원센터에서 담당하며, API 관련 문의는 해당 센터로 하면 됩니다.데이터.go+14. 데이터 규모 및 주기등록·수정일: 2025년 8월 5일전체 데이터 건수: 651건업데이트 주기: 연간 1회, 다음 등록 예정일은 2026년 8월 26일'
