description_portal: '○ 통계개요* 통계명 : 산업생산지수* 통계종류 : 서울시 산업생산지수를 제공하는 일반ㆍ가공통계* 작성목적 :광공업 생산·출하지수 및 제조업 재고·생산능력·가동률 지수를 작성·제공하여 국내경기 동향을 판단하는 기초자료로 활용* 조사체계 : 시도 → 통계청 산업동향과* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 서울시 광·공업 및 제조업에 관한 생산지수, 생산자 제품출하지수, 생산자제품재고지수 현황○ 용어설명* 광공업생산지수 : 광업, 제조업 및 전기.가스업에 대한 생산활동의 수준과 그 변동을측정하기 위해 작성하는 지수 ※ 광업제조업동향조사에서 생산은 사업체의 자체생산과위탁생산만 광공업생산지수에 포함하여 조사* 생산자제품출하지수 : 생산자의 판매활동과 광공업 및 전기.가스제품의 출하동향을나타내는 지수* 생산자제품재고지수 : 광업 및 제조업체가 보유하고 있는 제품 재고의 변동을 파악하는지수로서 생산자가 보관하고 있는 반제품, 제공품과 유통업자의 재고는 제외(매월, 분기,연말을 기준으로 작성)'
