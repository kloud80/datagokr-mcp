summary_user: 제주 전력계통의 시점별(연월일시분 기준일시) 운영 현황으로 공급능력, 발전단수요, 송전단수요, 신재생 합계와 그중 태양광·풍력 발전량을 MW 단위로 담는 실시간 계열 데이터다. 에너지 분석가나 사업자가 '지금 제주의 전력 수요 대비 공급 여유는 얼마이고 태양광·풍력이 그중 얼마를 차지하나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 기준일시(시간축)를 맞추거나 같은 기관(전력거래소)의 수급·발전량 데이터와 이름으로 대응시켜 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.기존 PUBC 의 제주계통운영정보 API를 GW 방식으로 전환한 데이터 입니다.*변경사항 : 송전단수요 데이터(컬럼) 이 추가되었습니다.'
