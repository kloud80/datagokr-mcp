description_portal: 한국디자인진흥원(KIDP)이 운영하는 ‘디자인 러닝 플랫폼(디자인 그라운드)’의 온라인 교육 콘텐츠 목록, 목차, 세부 내용을 제공하고 있습니다. 제공 항목은 순번, 강의명, 목차, 세부 내용, 업로드 일자 등의 구조로 구성되어 있으며, 총 447건 이상의 과정 정보가 CSV 형식 파일 안에 담겨있습니다. 카테고리는 플랫폼 내에서 '유료', '무료', '온라인학습', '특강' 등으로 분류되어 있고, 검색 시 과정명·키워드·강사 기준으로 필터하거나, ‘최신순’, ‘인기순’, ‘평점순’, ‘추천순’으로 정렬해 조회할 수 있습니다. 본 데이터는 2024-08-27 기준으로 수집·정리된 목록이며, 이후 내용은 변동되었을 수 있습니다. 최신 정보 및 상세 항목은 디자인 러닝 플랫폼 온라인 교육 목록 페이지에서 직접 확인하시기 바랍니다. (https://designground.designdb.com/onlineCos/list?menuSeq=1063&topMenuSeq=1061)
