description_portal: 본 데이터는 경기도 광주시 공공시설에 설치된 태양광 발전소의 현황 정보를 제공합니다. 시청, 학교, 체육관 등 공공 건물에 설치된 태양광 발전 설비의 위치와 규모 정보를 담고 있습니다. 설치시설명은 태양광 발전소가 설치된 건물이나 시설의 명칭이며, 소재지 주소는 시설의 위치를 제공합니다. 설비용량은 발전 가능한 전력량을 나타내고, 설치일은 태양광 발전소 구축 시점을 표시합니다. 용도는 생산된 전력의 사용 목적을 나타내며, 경도와 위도는 정확한 지리 좌표를 제공합니다. 본 데이터는 신재생에너지 정책 관리, 에너지 자립도 분석, 환경 시설 현황 파악, 탄소 배출 감축 계획, 에너지 전환 정책 수립 등에 활용됩니다.
