description_portal: 해당 파일데이터는 한국남부발전(주)의 사업소(빛드림본부)별 네트워크 트래픽 양에 대한 정보입니다.한국남부발전의 본사 및 하동, 남제주, 인천, 영월, 안동, 삼척, 부산, 세종 사업소(빛드림본부)에서 2022년 05월 01일 이후부터 측정된 일일별 네트워크 평균 트래픽과 일일 최대 트래픽의 값을 Mbps 단위로 제공합니다.해당 데이터를 활용하여 일자별 시계열 데이터 분석에 활용할 수 있으며, 대략적인 네트워크 사용량을 유추하여 향후 시스템 설계 및 네트워크 관련 장비 구매 등에 활용될 수 있는 자료입니다.
