summary_user: 한국동서발전이 발전소 건설에 쓰도록 사전에 자격을 부여한 기자재 품목 목록을 품목 1건당 1행(품목번호·품목명·운용구분)으로 담은 작은 CSV 파일(약 2.7KB)이며, 전국 단위의 비공간 목록이다. 발전소 건설 기자재 납품을 준비하는 사업자가 '내 품목이 동서발전 유자격 품목 대상에 들어가는가, 건설(기계)·건설(제어) 중 어느 운용구분인가'를 확인하거나, 연구자가 발전 기자재 조달·표준화 현황을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명 매핑이나 같은 기관(한국동서발전) 기준으로만 이어 쓸 수 있다.
description_portal: '한국동서발전의 발전소 건설 기자재 유자격 품목 현황 정보 데이터입니다. 해당 데이터는 한국동서발전이 발전소 건설에 사용하기 위해 사전에 자격을 부여한 기자재 품목 목록을 포함하고 있으며, 데이터 항목은 품목번호, 품목명, 운용구분(예: 건설(기계), 건설(제어) 등)으로 구성되어 있습니다. 각 품목은 기술적 기준을 만족한 경우에만 유자격으로 분류되며, 발전소 건설 시 사용 가능한 품목 리스트로 관리됩니다. 학계 및 연구기관에서는 이 데이터를 기반으로 공공조달 및 기자재 표준화 연구, 발전 설비의 기술 사양 분석, 산업 안전 및 품질관리 체계 연구 등에 활용할 수 있습니다. 또한 기자재 인증 기준이나 국내외 기자재 비교 분석 자료로도 유용하며, 발전 설비 설계 및 시방서 작성 시 참고자료로 활용될 수 있습니다.'
