summary_user: 경상남도에 등록된 전기안전관리대행 업체를 업체 한 곳당 한 행으로 담은 파일로, 등록번호·등록일자·상호·주소·업종·영업 상태가 들어 있으며 범위는 경상남도 전역이고 위치는 개별 주소 단위다. 전기설비 소유자나 사업자가 '우리 시군에서 영업 중인 전기안전관리대행 업체는 어디인가'를 찾거나, 분석가가 시군별 업체 분포와 등록 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·주소를 이름으로 맞춰 붙여야 하고, 지방행정 인허가(LOCALDATA) 계열 업종 원장과 나란히 놓고 보는 보조 자료로 쓴다.
limits: 사업자번호나 표준 코드 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 상호·주소 문자열 매칭에 의존해야 한다. 좌표 필드는 없어 지도에 올리려면 주소를 따로 위치 정보로 바꿔야 한다.
