description_portal: 본 데이터는 연도와 기관을 기준으로 연구개발(R&D) 과제 수행 규모와 참여 연구인력 규모를 함께 집계한 CSV 통계 자료입니다. 각 기관이 해당 연도에 수행한 과제 건수(과제수)가 제공되어 기관별 연구개발 활동의 양적 수준을 확인할 수 있으며, 동일 기준에서 과제 수행에 실제 참여한 연구원 수가 함께 제시되어 인력 투입 규모를 동시에 파악할 수 있습니다. 두 지표가 한 자료에 포함되어 있어, 기관별로 과제 수행량과 인력 참여 수준이 어떤 관계로 나타나는지 비교하거나, 동일 기관의 연도별 변화를 통해 과제 추진과 인력 규모의 증감 흐름을 점검하는 데 활용할 수 있습니다.이 자료는 연구개발 정책·운영 관점에서 기관별 연구 수행 현황을 정리하는 기초 통계로 활용될 수 있습니다. 예를 들어 기관 간 과제수 분포를 비교해 연구 수행 집중도를 확인하거나, 참여 연구원 수의 변화로 인력 수요의 확대·축소를 점검할 수 있습니다. 또한 과제수 대비 참여 연구원 수를 결합해 인력 투입의 상대적 수준을 살펴보는 등(파생 지표 산출) 후속 분석의 출발점 자료로도 유용합니다. 결과적으로 본 데이터는 기관별 연구개발 활동 규모와 인력 참여 현황을 연도 단위로 구조화해 제공함으로써, 연구현황 파악과 비교 분석에 필요한 기반 정보를 제공합니다.
