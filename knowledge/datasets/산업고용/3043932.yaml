summary_user: 중소벤처기업부 인력지원사업(기술사관·특성화고·계약학과 등)에 참여하는 학교를 학교 한 곳당 한 행으로 담은 전국 단위 목록 파일로, 사업명·사업년도·지역·학교구분·계열·주소와 학년별 현원을 담는다. 구직자·학부모나 중소기업 인사담당자가 '우리 지역에서 중소기업 인력지원사업에 참여하는 특성화고는 어디이고 학년별 학생 수는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 학교 정보와는 학교명·주소(우편번호) 이름 매칭으로만 이어 쓴다.
limits: 표준 학교코드 같은 공통 키가 없어 다른 학교·교육 데이터와 붙이려면 학교명·주소 매칭이 필요하다. 명세상 연 단위로 만들어지는 파일이라 이번 달 공고나 모집 일정 같은 시의성 정보는 담지 않는다.
