description_portal: 한국남동발전 SMP(계통한계가격) 수요예측 정보 데이터입니다.SMP(계통한계가격)은 전력량에 대해 전력거래 시간대별로 적용되는 전력시장 가격입니다.2024년 1월부터 12월까지 월별 데이터이며 월별 기준은 매달 1일입니다.기준일자, 최소값, 최대값, 평균값, 가중평균치, 1시~24시 계통한계가격 수요 예측 데이터로 구성되어 있으며2024년 계통한계가격 수요예측 정보를 통하여 전력거래에 필요한 전력수요를 예측하는 자료로 활용 될 수 있습니다.또한 해당자료를 통하여 전력거래 시장 가격의 추이분석 등 통계정보제공을 위한 자료로 활용 할 수 있습니다.
