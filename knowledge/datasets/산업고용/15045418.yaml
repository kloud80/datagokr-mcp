description_portal: 산업기술혁신사업 통합 시행계획을 기반으로 한 본 정보는 산업기술 연구개발(R&D) 및 관련 사업의 정책 이해도를 높이기 위해 구성된 정책용어 사전입니다. 이 데이터는 산업기술혁신사업에 참여하거나 관심 있는 연구자, 정책 담당자, 기업 관계자들이 사업 운영체계와 관련된 용어를 정확히 이해하고 활용할 수 있도록 돕는 것을 목적으로 하며, 각 정책용어의 명칭과 이에 대한 정의 및 해설을 제공합니다. 주요 용어에는 사업구조, 수행기관 유형, 평가방식, 기술수준지표, 사업비 구성 등 R&D 행정과 절차 전반에서 빈번하게 사용되는 용어들이 포함되어 있으며, 실제 정책자료 해석, 과제 신청서 작성, 사업참여 준비 과정 등에 있어 실질적인 참고 자료로 활용될 수 있습니다. 이 용어 해설은 제도적 정의뿐 아니라기술수준지표나 관련 제도와의 연계성 등을 함께 담고 있어 산업기술 R&D에 대한 통합적 이해를 지원합니다.
