summary_user: 서울시 상권분석서비스의 점포 집계 자료로, 기준 분기(STDR_YYQU_CD)와 시도·서비스업종별로 점포 수, 유사업종 점포 수, 프랜차이즈 점포 수, 개업률·개업 점포 수, 폐업률·폐업 점포 수를 담는다. 창업 예정자나 상권 분석가가 '서울에서 중식 음식점은 이번 분기에 몇 곳이 열고 닫았으며 프랜차이즈 비중은 얼마인가' 같은 업종별 경쟁·창폐업 동향을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 업종명·업종코드 매핑이나 같은 서울시 상권분석서비스 계열의 코드로만 이어 쓴다.
description_portal: 이 데이터는 서울시 전역을 대상으로 업종별 점포 수와 영업 현황을 제공하는 자료입니다. 스포츠 강습, 중고차 판매, 중식 음식점, 일반의원, 오락장 등 다양한 업종의 총 점포 수와 유사 업종 점포 수를 비교할 수 있으며, 분기별 창업률(개업률)과 폐업률, 실제 개업·폐업 점포 수, 프랜차이즈 점포 수까지 확인할 수 있습니다. 이를 통해 특정 업종의 시장 규모와 변화 추이를 파악할 수 있고, 업종별 경쟁 강도, 창업·폐업 동향, 프랜차이즈 비중을 종합적으로 분석할 수 있습니다. 특히 지역별 상권 특성과 업종별 성장 가능성을 판단하는 데 활용도가 높으며, 창업 지원 정책 수립, 상권 분석 서비스, 산업별 변화 모니터링 등 공공과 민간에서 폭넓게 활용 가능한 데이터입니다.
