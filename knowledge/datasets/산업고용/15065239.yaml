description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2026년 6월까지  제주지역 일별 시간별 발전단 수요 실적 데이터입니다.- 항목 : 일자, 1~24시 전력수요량- 단위 : MWh* 수정정산 등 사유로 값이 변동될 수 있습니다.* 전력시장에 참여하는 태양광 발전량을 포함한 데이터입니다.* 23년 9월 이전 데이터의 단위는 KWh 입니다.* 23년 9월 이후 데이터의 단위는 MWh 입니다.'
