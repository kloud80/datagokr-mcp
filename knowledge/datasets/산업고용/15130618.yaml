status: active
summary_user: 한국남동발전 화력 발전소의 발전기(호기)별 하루 발전실적을 일자 단위로 담고, 1시~24시 시간대별 발전량과 일 총량·평균·최대·최소를 한 행에 펼쳐 둔 데이터다. 특정 화력 호기가 어느 시간대에 얼마나 발전했는지, 하루 중 출력이 언제 정점이었는지를 확인하려는 에너지 분석가나 연구자가 쓴다. 전역 조인 키는 없고 발전소코드(ippt)·호기코드·발전소명과 일자로 같은 기관의 다른 발전실적 데이터와만 이어 붙인다.
limits: 실측 컬럼에서 다른 기관 데이터와 공통으로 쓰는 조인 키를 찾지 못해 이름 매칭이나 남동발전 자체 코드로만 연결된다. 포털 설명에 태양광 문구가 섞여 있으나 제목·필드 기준으로는 화력 호기별 실적으로 보고 해석해야 하며, 개발계정은 일 10,000회 호출 제한이 있다.
