description_portal: '한국가스공사의 에너지성과지표 상세 현황에 관한 자료입니다. 에너지성과지표는 조직 내부 에너지 절감 목표 달성을 위한 정량적 성과 측정 수치로서, 에너지경영시스템(ISO 50001)의 핵심 관리 요소입니다. 본 데이터는 에너지 성과 관리 및 절감 목표 달성 지원을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 대상연도, 사업소명, 성과지표명, 단위, 영향인자 등이 포함되어 있습니다. 본 데이터를 활용하면 사업소별 에너지 성과 현황 분석, 성과지표 달성도 평가 및 개선점 도출, 에너지 절감 방안 연구, 에너지경영 전략 수립에 기초자료로 활용할 수 있어 공사의 에너지 효율 향상과 탄소중립 목표 달성에 기여할 것으로 기대됩니다.참고로 지역분류코드(002 : 통영기지본부, 003 : 인천기지본부. 004 : 평택기지본부, 005 : 서울지역본부, 006 : 경기지역본부, 007 : 강원지역본부, 008 : 대전충청지역본부, 009 : 전북지역본부, 010 : 광주전남지역본부, 011 : 대구경북지역본부, 012 : 부산경남지역본부, 017 : 인천지역본부, 018 : 삼척기지본부, 019 : 제주LNG본부) 입니다.'
