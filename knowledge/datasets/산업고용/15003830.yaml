summary_user: 한국서부발전 유연탄 발전소에서 나온 석탄재(바닥재·비산재) 발생량과 재활용·매립 처리 내역을 연월(ym) 단위로 집계해 담는다. 발전사의 석탄재 자원순환율이 어떻게 변해 왔는지, 재활용되지 못하고 매립된 양은 얼마인지 확인하려는 환경 분석가나 순환경제 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월이나 같은 기관(한국서부발전) 기준으로만 맞춰 이어 쓰며, 발전소 대기오염물질·수질 측정이나 주변 기상 데이터와 함께 보는 용도에 맞는다.
description_portal: 한국서부발전의 유연탄 발전 연소 후 발생하는 석탄회의 발생량 및 재활용량 정보제공 오픈API입니다. 이 데이터에는 석탄재의 발생량, 재활용 처리량, 최종 매립량이 구분되어 있으며, 재활용 분야로는 시멘트 원료, 콘크리트 혼합재, 토목·매립 복토재, 친환경 건축자재 활용 등이 포함됩니다. 월별 및 연도별로 집계된 내역을 통해 석탄재 자원순환율과 환경부담 저감 성과를 정량적으로 파악할 수 있습니다. 또한 재활용 내역 데이터는 환경 규제 준수 여부 확인 뿐 아니라, 순환경제 활성화 및 폐기물 제로화 정책 추진에 기초자료로 활용됩니다. 이를 통해 한국서부발전은 단순한 폐기물 처리 차원을 넘어 친환경 자원 관리와 ESG 경영 실천에 기여하고 있으며, 지역 산업과 연계한 순환자원 활용 확대에도 도움을 주고 있습니다.
