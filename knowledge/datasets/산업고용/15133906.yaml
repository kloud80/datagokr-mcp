description_portal: '2024년 성실경영평가 재심 신청자의 연령대 별 평가 현황 자료를 공공에 제공하여 재도전 기업 관련 통계 구축 및 재창업 활성화에 기여함이 목적인 데이터입니다.중소벤처기업진흥공단에서 수행한 2024년 성실경영평가 신청자 접수 경로 및 통과 여부 자료입니다.성실경영평가 재심이란, 성실경영평가 제도를 신청했으나 "탈락" 통보를 받은 대상자 중, 탈락 사유 및 재심 의사를 확인하여 해당 건에 대해 심의 위원회를 통해 소명 하는 절차입니다.경찰청-중기부 조회자료에서 범죄 이력이 발견되어 성실경영평가에서는 탈락하였으나, 이력이 과거 폐업기업 영업과 관련해 일어난 경영상의 범죄가 아닌 경우 등에 한해 재심을 통해 성실경영평가 통과처리가 가능합니다.세부 데이터는 다음과 같습니다..- 연번: 데이터의 순서로, 신청 일자 기준으로 나열하였습니다.- 신청 일자: 재심을 신청한 날짜입니다.- 연령대: 신청인의 연령대를 나타내는 인적사항입니다.- 결과:  재심 결과(성실경영평가 최종결과)를 나타냅니다.- 생년월일: 신청인의 연령 등을 확인할 수 있는 세부 정보인 생년월일입니다.- 유형: 최초에 성실경영평가가 홈페이지 등을 통한 외부 경로로 신청되었는 지(외부), 재창업 자금 신청 등을 통해 중진공 본 지부 등으로부터 접수된 건인지(내부) 나타냅니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 성실경영 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.'
