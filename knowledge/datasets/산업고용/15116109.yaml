description_portal: 방문판매업은 소비자의 가정이나 사무실 등으로 직접 방문하여 상품이나 서비스를 판매하는 영업 형태로, 주로 화장품, 건강식품, 생활용품 등이 대상이 됩니다. 인허가 정보는 업체명, 대표자, 사업장 주소, 전화번호, 판매 품목, 등록(휴업,폐업)일, 영업상태(영업/정상, 폐업, 취소말소/만료/정지/중지), 자산규모 등이 포함됩니다.해당 데이터는 소비자 보호와 불법 다단계 예방을 위한 기초 자료로 사용되며, 공정거래위원회와 지방자치단체에서 불공정 행위를 감시하고, 건전한 상거래 질서를 유지하는 데 활용됩니다.
