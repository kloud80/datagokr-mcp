description_portal: 이 자료는 청년일자리올인원지원서비스의 일환으로 제공되는 국민취업지원제도 일경험 프로그램의 모집정보(DB)로, 청년 구직자의 실무 적응력 향상과 경력 형성을 위한 현장 중심형 프로그램 참여 기회를 안내하기 위한 데이터입니다.본 데이터베이스는 사업장명, 본사지사구분, 참여시작일자, 참여기간종료일, 모집시간시작일자, 모집시간종료일자, 선발기간시작일자, 선발기간종료일자, 모집인원 등의 필드를 포함하고 있으며, 각 참여처별로 모집 일정과 조건이 구체적으로 기록되어 있어 청년 구직자 및 취업지원 기관이 활용하기에 적합합니다.이 자료는 워크넷과 국민취업지원제도 시스템을 통해 연동·관리되며, 참여자 맞춤형 프로그램 추천, 지역별 모집현황 파악, 취업상담 현장 활용 등에 유용하게 활용될 수 있습니다.
