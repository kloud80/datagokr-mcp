description_portal: 한국광해광업공단은 광산 개발 과정과 폐광 이후 발생하는 2차 오염 등으로 인한 광해를 분석하고 예방하며 제거하는 광해방지 사업을 실시하고 있습니다. 이를 통해 폐석·광물찌꺼기 등 오염원을 차단하고, 오염토양 복원, 수질개선, 지반침하 방지 등 광해복구를 통해 자연환경을 깨끗하게 보전하며, 지역 주민의 삶의 질 향상을 목표로 하고 있습니다. 또한, 비금속 광산에 대한 전국광산 통계 현황을 개방 및 공개하여, 광해방지 사업의 효과적인 추진과 정책 수립을 위한 기초 자료로 활용하고 있습니다. 이러한 통계는 광해방지 사업의 우선순위 설정과 자원 배분에 중요한 역할을 합니다.
