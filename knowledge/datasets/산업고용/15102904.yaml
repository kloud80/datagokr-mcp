summary_user: 한국가스공사 지역본부(관리소)별로 천연가스를 공급받는 발전소와 그 발전사를 정리한 전국 단위 현황표로, 건별 원천이 아닌 작은 목록 파일(csv 약 2KB)이다. 발전 사업자나 에너지 분석가가 '어느 지역본부·관리소에서 어떤 발전소에 천연가스를 공급하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전소 원장이나 가스공사 공급설비 자료와는 발전소명·관리소명 같은 이름 매칭으로만 연결한다.
description_portal: 한국가스공사의 주요 사업인 천연가스의 안전하고 안정적인 공급사업과 관련하여, 천연가스를 공급하는 공급관리소(정압관리소)의 전국 지역별 현황자료 입니다.해당 자료를 통해 전국에 걸쳐 설치되어 있는 공급설비 현황을 파악할 수 있으며, 총 26개사 39개 관리소에서 평택LT, 목감 및 POSCO는 자체수급으로 제외 합니다.해당자료는 지역별 천연가스 공급설비를 나타낸 것으로 광역기초단위 설치현황, 수요처(발전, 도시가스) 현황, 한국가스공사에서 운영중인 지역본부별 수요처(발전, 도시가스) 현황, 지역본부별 주배관 및 기능별 관리소 현황, 주배관 구간별 가스주입 현황 등추가 자료는 공공데이터로 등록된 자료를 참고하여 확인 가능합니다.
