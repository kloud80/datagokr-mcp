summary_user: 경기도 남양주시 관내 고압가스 저장소를 한 곳당 한 행으로 담은 원천 목록으로, 상호명·도로명/지번 주소·위도·경도·취급 고압가스 종류·인허가 일자와 번호를 포함한다(CSV 약 2.5KB의 소규모 파일). 주민이나 안전·재난 담당 분석가가 '우리 동네 근처에 어떤 고압가스 저장소가 있고 어떤 가스를 다루는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 주소나 위도·경도로 다른 위치 데이터와 공간적으로 겹쳐 보거나, 같은 시의 다른 에너지 업종 인허가 목록과 상호명·인허가 번호로 맞춰 쓴다.
