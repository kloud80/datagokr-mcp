description_portal: 한국수력원자력㈜이 공개하는 가동원전 극한재해 대비용 롤업도어 성능기준 및 성능입증기준 데이터는 기후변화로 인해 발생 빈도와 강도가 증가할 것으로 예상되는 지진, 화재 등 극한재해 상황에서 원전 시설과 인명을 보호하기 위해 마련된 자료입니다. 지진 발생 시 화재 등 2차 피해가 이어질 수 있는 점을 고려하여, 기존 롤업도어보다 강화된 성능요건이 요구되며 이를 충족할 수 있는 성능기준 및 입증기준을 제시하고 있습니다. 이 데이터는 가동 중인 원전의 극한재해 대비 안전성 확보를 목적으로 하며, 롤업도어 성능검증 결과와 관련된 기준을 공개함으로써 국내외 산업계 전반에서 롤업도어 기술의 역량 강화와 재해 대응력 향상에 기여하는 자료로 활용될 수 있습니다.
