description_portal: 지역특화프로젝트(레전드 50플러스 1.0)에  선정된 광역지차체 지역, 프로젝트명, 참여기업수, 주관기관에 대한 데이터 자료입니다.지역특화프로젝트(레전드 50플러스)란 지역 고유의 특색과 강점을 살린 지역산업 육성을 위해 지자체와 정부가 함께 지원하는 프로젝트로 지자체가 주도적으로 지역산업에 맞춰 기획한 프로젝트에 대해 중기부의 정책수단(정책자금, 바우처 등)을 3년간 패키지로 집중지원하는 프로젝트입니다.기관별 역할은 다음과 같으며, 선정된 기업 대상 합동공고 후 지원기관별 연계지원이 이루어집니다.- 중기부(프로젝트 총괄), 전담기관(기정원), 지역과제운영(TP 및 경제진흥원), 정책지원(중진공, 창진원 등) 등
