summary_user: 제조기업·공장·모델별로 탄소검증 인증번호, 검증코드, 모듈 출력, 탄소배출량, 검증방식, 인증일·유효기간을 담은 건별 인증 원장이며, 범위는 전국이고 위치 정보는 없습니다. 제품 구매자나 사업자가 '이 제조사 모델의 탄소배출량 검증이 받아졌고 아직 유효한가'를 확인할 때 쓰고, 분석가는 제조사·공장별 배출량과 출력 분포를 비교하는 데 씁니다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 제조기업명·모델명(MDL_NM) 같은 이름 매칭으로만 제품·업체 데이터와 연결합니다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑으로만 이어지며, 표기 차이로 매칭이 틀릴 수 있습니다. 전국 단위 비공간 데이터라 지역별 분석에는 쓰지 못하고, 발전소 단위 대기·수질 측정값은 담지 않습니다. 호출은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한됩니다.
