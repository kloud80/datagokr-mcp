description_portal: 본 데이터는 국내 기업 및 기관의 온실가스(탄소) 배출량을 검증하는 데 필요한 관련 시스템 정보, 즉 검증기관 및 검증심사원 등에 대한 제조기업명, 공장명, 모델명, 탄소배출량, 출력, 탄소검증 코드 등의 정보를 제공합니다. 정부는 온실가스 배출권거래제, 목표관리제 등 탄소 중립 사회로의 전환을 위한 다양한 제도를 운영하고 있으며, 이러한 제도의 핵심은 기업의 정확하고 투명한 온실가스 배출량 산정과 검증입니다. 이 데이터셋은 탄소 배출량 검증 시스템의 투명성과 신뢰성을 확보하고, 검증 시장의 건전한 발전을 지원하는 데 목적이 있습니다.배출량 검증을 필요로 하는 기업들은 공신력 있는 검증기관과 전문 심사원을 쉽게 찾을 수 있으며, 정부는 검증 시장의 동향을 파악하고, 관련 제도의 효과성을 평가하며, 불필요한 비용 발생을 줄이는 데 기여합니다.
