description_portal: 이 데이터는 한국남부발전이 해외에 출자하여 운영하는 태양광 발전 사업의 실적을 정리한 자료입니다. 각 연도별로 1월부터 12월까지의 월별 발전량(MWh), 설치 용량(MW), 발전소 위치, 연간 평균 발전시간(hr), 연간 발전량(MWh) 정보를 포함하고 있습니다. 이를 통해 해외 태양광 발전소의 계절별 발전 특성과 운영 효율을 확인할 수 있으며, 발전소의 연간 성과를 종합적으로 파악할 수 있습니다. 본 자료는 국제 에너지 협력 사례로서 해외 재생에너지 투자 현황을 이해하는 데 도움이 되며, 글로벌 에너지 전환 및 탄소중립 정책 추진에 참고할 수 있는 중요한 기초 데이터입니다.
