summary_user: 중소벤처기업진흥공단 온라인수출플랫폼(고비즈코리아)의 해외 구매오퍼 게시판을 통해 해외바이어와 국내 공급기업이 매칭된 거래알선(BMS) 건수를 국가별·품목 카테고리별로 집계한 파일입니다. 수출을 준비하는 중소기업이나 분석가가 "어느 나라 바이어가 어떤 품목에서 국내 기업과 많이 매칭되었나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았습니다. 따라서 다른 데이터와는 국가명이나 품목 카테고리명을 이름으로 맞춰 이어 써야 한다.
description_portal: 온라인수출플랫폼(Gobiz Korea)의 해외 구매오퍼 게시판을 활용하여 매칭된 거래알선(BMS) 통계정보를 제공합니다.BMS(Business Matching Service)란 해외바이어가 구매를 희망하는 한국 기업의 제품을 고비즈코리아 해외 구매오퍼 게시판을 통해작성하면, 무역전문가의 도움을 통해 국내 공급사와 매칭을 지원하는 프로그램입니다.제공되는 정보는 BMS 프로그램을 통해 연간 매칭된 거래성사 건수로 국가명, 품목명(카테고리), 매칭 건수로 집계되어 있습니다.
