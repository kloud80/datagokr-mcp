summary_user: 충청남도 부여군 관내 신재생에너지 설비(주로 태양광)를 발전시설 한 곳당 한 행으로 담은 건별 원장으로, 상호·설치 주소·원동력 종류·설비용량·허가일자·사업개시일을 수록한 CSV 파일(약 27만 바이트)이다. 부여군의 어느 읍면에 태양광 발전소가 몰려 있고 연도별로 허가·가동 용량이 얼마나 늘었는지 보려는 지자체 담당자·분석가·주민이 쓴다. 전역 조인 키가 없어 설치 주소를 지오코딩하거나 이름·주소를 맞춰 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 자료와 이어 쓴다.
description_portal: '이 데이터는 충청남도 부여군 관내에 설치·운영 중인 신재생에너지 설비(주로 태양광 발전시설)의 현황을 정리한 자료입니다. 각 행은 하나의 발전시설을 나타내며, 상호(발전시설 명칭), 설치장소 소재지(주소), 원동력의 종류(예: 태양광), 설비용량, 허가일자, 사업개시일, 데이터기준일자 등의 정보가 수록되어 있습니다. 이를 통해 부여군 지역 내 신재생에너지 설비의 설치 규모와 입지 분포, 허가 및 가동 시점 등을 파악할 수 있으며, 지방자치단체와 관계 기관은 재생에너지 보급 현황 분석, 에너지전환 및 탄소중립 정책 수립, 전력 인프라·계통 연계 계획, 환경·경관 영향 검토 등의 행정·정책 업무에 기초 자료로 활용할 수 있습니다.'
