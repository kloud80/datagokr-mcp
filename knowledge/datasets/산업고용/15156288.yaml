description_portal: 이 데이터는 공공기관으로서 2024년말 기준 근로복지공단의 연봉제 적용대상자와 공무직을 제외한 직원의 호봉별 직급별 기본급 데이터로 항목은 호봉과 각 직급, 기본급으로 구성되어 있습니다.공공기관의 호봉별 직급별 데이터는 기관의 운영 투명성과 효율성, 그리고 내부직원의 근무만족도 확보를 위해서 매우 중요하며, 이는 단순히 급여 정보를 넘어 기관의 인력운용, 예산집행, 임금체계 개편 등의 핵심적인 경영 및 정책결정의 기초자료가 됩니다.특히 본 데이터를 활용하여 3백3십여개가 넘고 있는 우리나라의 공공기관(기획재정부 지정)간 보수체계 비교(각 기관의 변동 추이 포함), 입퇴사율과의 상관관계 등을 비교 분석할 수 있으며, 고령화에 따른 정년연장, 임금체계 개편 등 사회적 이슈 대응에 유용하게 사용될 것으로 판단됩니다.기본급 단위는 원 입니다.
