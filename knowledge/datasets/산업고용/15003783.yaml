summary_user: 한국동서발전이 운영하는 발전소별 신재생에너지(태양광·풍력·바이오 등) 발전량을 기준일자·지역·발전소 단위로 일별 기록한 파일 데이터로, 활용신청 없이 CSV(약 56만 바이트)로 받는다. 연구자나 분석가가 특정 지역 동서발전 신재생 설비의 계절·날씨에 따른 일별 발전량 변동을 살펴보거나 기상자료와 엮어 발전량 예측모델을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소 이름이나 지역명 매핑, 또는 같은 기관 데이터로만 연결한다.
limits: 표준 발전소 코드나 행정구역 코드가 없어 태양광 발전사업 허가 표준데이터 같은 설비 원장과 바로 결합되지 않고, 이름 매칭에 의존해야 한다. 한국동서발전 운영 발전소만 담고 있어 전국 신재생 발전량 전체를 대표하지 않는다. 발전량 단위가 포털 설명은 kWh, 필드명은 Wh로 서로 달라 사용 전에 확인해야 한다.
