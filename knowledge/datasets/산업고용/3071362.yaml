summary_user: 구미시에 설치된 태양광발전소를 발전소 한 곳당 한 행으로 담은 파일(csv, 약 380KB)로, 발전소명·설치장소·설비용량(kW)·허가기관·허가일자·사업개시일자를 담는다. 분석가나 사업자가 '구미시 어느 지역에 언제 허가된 태양광 설비가 얼마만큼의 용량으로 들어서 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 설치장소 주소나 발전소명을 매핑해 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 대조하는 방식으로만 이어 쓴다.
