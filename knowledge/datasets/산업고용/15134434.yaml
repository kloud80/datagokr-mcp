description_portal: 이 데이터는 경상북도 김천시가 2015년부터 매년 1개씩 선정하여 발표하고 있는 ‘내고장 우수기업’에 대한 연도별 선정 현황을 제공하는 자료입니다.우수기업 선정은 김천시 내에서 3년 이상 지속적으로 가동 중인 기업 중, 연간 총매출액이 30억 원 이상인 중견·중소기업을 대상으로 하며,지속가능한 성장성과 지역경제 기여도, 고용창출, 기술력 등을 종합적으로 평가하여 매년 1개 기업을 선정합니다.선정된 기업에 대해서는 김천시청 홈페이지 및 시정홍보 채널을 통해 공개되며,해당 데이터셋은 기업의 명칭, 주력 생산제품, 사업장 소재지 주소, 기업 홈페이지 주소, 선정일자 등의 정보를 포함하고 있어기업 홍보, 지역경제 정책자료, 산업현황 분석, 우수사례 연구 등 다양한 목적으로 활용될 수 있습니다.
