summary_user: 인천광역시 영종구(구 중구)가 신재생에너지 보급사업으로 공공시설에 설치한 태양광 발전설비를 설비 한 곳당 한 행으로 담은 원장이며, 설치장소명·주소·설비용량(kW)·설치시기를 제공하는 작은 CSV 파일(약 2.5KB)이다. 지역 주민이나 에너지 분석가가 "우리 동네 경로당·공공청사 중 어디에 태양광이 몇 kW 설치돼 있나"를 확인할 때 쓴다. 전역 조인 키는 없어 주소나 설치장소명을 기준으로 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 원장과 맞춰 보거나, 같은 기관명으로만 연결한다.
description_portal: '인천광역시 중구에서 신재생에너지 보급사업(확대기반조성사업, 융복합지원사업 등)을 통해 설치한 태양광 발전설비의 현황으로 설치장소명, 주소, 용량, 설치시기 등을 제공합니다.해당 태양광 발전설비의 현황은 공공시설에 설치되어 있는 것으로, 지역별로 공공시설에  설치된 태양광 발전설비를 확인할 수 있으며 매년 공공시설 태양광 보급을 추진하고 있어 지속적으로 업데이트 될 예정입니다.추가 자료가 필요한 경우 담당부서에 문의하여 주시기 바랍니다.○ 변경사항 - 2025. 5. 27. 업데이트: 동화마을 경로당 태양광 발전설비 현황 추가'
