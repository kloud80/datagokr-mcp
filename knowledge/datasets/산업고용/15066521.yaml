summary_user: 한국가스공사 대구경북지역본부가 설치한 태양광 발전설비를 설비(설치장소)별로 담은 원장 파일로, 구분·설치장소·용량(kW)·모듈 출력(W)·모듈 개수·설치 연월일을 담으며 CSV 290바이트의 소규모 자료다. 공기업 ESG·신재생 투자 현황을 보는 분석가가 '이 본부가 어느 장소에 몇 kW 태양광을 언제 설치했고 설비가 얼마나 노후했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 설치장소 이름 매칭으로만 붙일 수 있으며, 발전소 단위 주소·용량을 담은 전국태양광발전소전기사업허가정보 표준데이터와 나란히 비교하는 정도로 쓴다.
description_portal: 한국가스공사 대구경북지역본부의 신재생에너지(태양광) 발전설비 현황 데이터 입니다. 태양광 발전설비 현황 관리 및 신재생에너지 투자 성과 분석, 설비 확충 계획 수립, ESG 경영성과 관리를 목적으로 수집되었습니다. 데이터 구성항목은 구분, 설치장소, 용량(kW), 모듈 출력(W), 모듈 개수(EA), 연월일 등으로 이루어져 있어 태양광 발전설비의 상세 현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 설치장소별 설비용량 분석, 모듈 성능 현황 파악, 설치시기별 추이 분석, 총 발전용량 산정, 설비 노후도 분석이 가능합니다. 또한 태양광 설비 확충 계획 수립, 노후설비 교체 계획, 발전효율 분석, ESG 경영성과 보고, 유지보수 계획 수립에 활용됩니다. 대구경북지역의 신재생에너지 설비 관리에 기초자료로 활용됩니다.
