description_portal: '공산품 및 서비스 등 품목의 품질관리와 산업진흥 등을 위해 산업표준화법에 따라 제정된 국가표준 현황 목록 데이터를 제공합니다. 한국산업표준(KS : Korean Industrial Standards)은 산업표준심의회의 심의를 거쳐 국가기술표준원장이 고시함으로써 확정되는 국가표준으로서 약칭하여 KS로 표시한다. 한국산업표준은 기본부문(A)부터 정보부문(X)까지 21개 부문으로 구성되며 크게 다음 세 가지 국면으로 분류할 수 있다. (1) 제품표준 : 제품의 형상ㆍ치수ㆍ품질 등을 규정한 것 (2) 방법표준 : 시험ㆍ분석ㆍ검사 및 측정방법, 작업표준 등을 규정한 것 (3) 전달표준 : 용어ㆍ기술ㆍ단위ㆍ수열 등을 규정한 것'
