description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 수행하는 "에너지기술기업실태조사"의 결과 중, 에너지 기술 기업들이 정부 지원에 대해 느끼는 필요도를 집약한 공공 데이터입니다. 제공되는 정보는 조사 연도를 기준으로, 에너지 기술 분야별(예: 태양광, 풍력, 수소 등)로 분류된 기업들이 기술 사업화 지원, 전문 인력 채용 지원, 금융 및 세제 지원 등 다양한 정부 지원 항목에 대해 응답한 필요도 점수를 담고 있습니다. 이 점수는 5점 만점 척도로, 점수가 높을수록 해당 분야의 기업들이 정부의 지원을 더욱 절실하게 필요로 한다는 것을 의미합니다.'
