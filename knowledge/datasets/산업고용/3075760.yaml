summary_user: 부산 해운대구에 있는 가스사업자(액화석유가스 판매·충전, 고압가스 판매·수소 충전 등)를 사업소 한 곳당 한 행으로 담은 소규모 목록 파일입니다. 업소명, 사무소·사업소 주소, 전화번호, 업종, 근거 법령, 영업 여부가 들어 있습니다. 해운대구 주민이나 사업자가 '동네에서 LPG를 배달받거나 고압가스를 살 수 있는 업체가 어디이고 연락처가 무엇인가'를 확인하는 데 씁니다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소 문자열을 맞추는 방식으로만 이을 수 있으며, LOCALDATA 에너지 업종 인허가 원장과 대조하는 보조 자료로 쓰입니다.
description_portal: 부산광역시 해운대구 가스사업자 현황입니다.액화석유가스”란 프로판이나 부탄을 주성분으로 한 가스를 액화한 것을 말하며 액화석유가스 판매사업이란 용기에 충전된 액화석유가스를 판매하거나 자동차에 고정된 탱크(탱크의 규모 등이 산업통상자원부령으로 정하는 기준에 맞는 것만을 말한다)에 충전된 액화석유가스를 산업통상자원부령으로 정하는 규모 이하의 저장 설비에 공급하는 사업을 말합니다. 액화석유가스법에 따른 액화석유가스판매사업 11개소, 액화석유가스충전사업 1개소 고압가스는 고압가스법 시행령 제 2조에 따른 종류와 범위가 정해져 있습니다.고압가스법에 제4조에 따른  고압가스 판매사업 2개소, 고압가스(수소) 충전사업 1개소입니다.각 사업소 별로 사업자명,전화번호, 소재지를 확인하실 수 있습니다.데이터 내용은 첨부물을 확인해주시기 바랍니다.
