summary_user: 한국전력공사 한전ON에 등록된 전국 본부·사업소의 부서별 현황을 담은 파일로, 본부명·사업소명·주소·우편번호·관할구역·부서·업무내용·전화·팩스·문자번호를 행 단위로 담는다(CSV 약 1.17MB, 활용신청 없이 내려받음). 국민이나 사업자가 '우리 동네를 관할하는 한전 사업소는 어디이고, 신규 전기공급 같은 업무는 어느 부서에 전화해야 하나'를 찾을 때 쓰고, 분석가는 지역별 사업소 분포를 정리하는 데 쓴다. 전역 조인 키나 행정구역 코드는 없으므로 주소·우편번호나 관할구역 이름을 행정구역 코드로 매핑해야 한전 지역별 전력사용량 같은 지역 데이터와 이어 쓸 수 있다.
description_portal: 한국전력공사 한전ON에서 관리하고 있는 사업소정보 데이터 입니다.전국 각 지역 본부 및 사업소의 현황을 파악할 수 있는  본부명, 사업소명, 주소, 우편번호, 관할구역, 부서, 업무내용, 전화번호 등 항목으로 이루어져 있습니다.이용자는 해당 데이터를 통해 지역 사업소의 위치와 연락처를 쉽게 파악할 수 있으며, 필요에 따라서 지역별 사업소 분포 현황이나 부서별 업무 특성 정리 등 다양한 방식으로 활용할 수 있습니다.또한 한전ON 홈페이지에서 전국의 사업소를 지도로 간편하게 조회할 수 있습니다.
