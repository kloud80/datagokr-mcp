description_portal: 'ㅇ 조사목적- 국내 신재생에너지 이용시설의 보급실적을 파악하여 신재생에너지의 기술개발 및 보급을 촉진하기 위한 신재생에너지 기본계획 및 신재생에너지 실행계획 등 신재생에너지 관련 시책을 효과적으로 수립, 시행하고 관련 시책의 성과 확인을 위해 활용함ㅇ 조사근거- 신재생에너지법 제25조(관련 통계의 작성 등)ㅇ 통계종류- 조사통계ㅇ 조사주기 및 공표시기- 1년 주기로 매년 12월 경 공표ㅇ 통계체계에 따른 에너지원 분류- 신재생에너지법 상 정의에 따라 총 11개의 에너지원에 대해 세부 28개 분야 분류- 에너지원 분류: 태양에너지(태양열, 태양광,), 풍력, 수력, 해양에너지, 지열에너지, 수열에너지, 바이오에너지(바이오가스, 매립지가스, 바이오디젤, 우드칩, 성형탄, 임산연료, 목재펠릿, 폐목재, 흑액, 하수슬러지고형연료, Bio-SRF, 바이오중유), 폐기물에너지(폐가스, 산업폐기물, 생활폐기물, 시멘트킬른보조연료, SRF, 정제연료유), 연료전지, IGCCㅇ 조사대상 및 조사방법- 신재생에너지를 생산, 이용, 판매하는 사업체, 기관, 개인 등 대상으로 한국에너지공단 신재생에너지 지원사업 시스템, 유관기관 협조, 외부 전문기관 위탁조사 진행ㅇ 공공데이터 제공자료- 신재생에너지원별로 각 에너지원이 변환이나 가공을 거치지 않고 보유한 에너지 양인 1차 에너지 생산량을 석유 1톤을 연소 시킬 때 발생하는 에너지 단위(toe)로 환산하여 집계한 에너지량을 제공함- 19년 신재생에너지법 개정으로 화석연료 기원 비재생 폐기물은 재생에너지에서 제외되어 비재생폐기물은 제외한 생산량 자료임- 제공자료 원 자료는 한국에너지공단 신재생에너지센터 누리집에서 확인할 수 있음'
