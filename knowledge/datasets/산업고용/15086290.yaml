description_portal: 한국에너지공단 신재생에너지센터 보급사업 및 RPS사업을 통해 설치된 신재생에너지 설비에 대한 용량 데이터를 제공합니다. 신재생에너지 보급 확대는 기후변화 대응, 에너지 안보 강화, 지속 가능한 발전이라는 국가적 과제를 해결하는 핵심 수단입니다. 이 데이터셋은 태양광, 풍력, 지열 등 다양한 신재생에너지원의 신규 설비가 매년 얼마나 보급되었는지 구체적인 수치로 제시함으로써, 정부와 관련 기관이 신재생에너지 보급 정책의 효과를 평가하고, 향후 목표 달성을 위한 전략을 수립하는 데 필수적인 근거 자료를 제공합니다. 또한, 국민들에게 국내 신재생에너지 보급 현황을 투명하게 공개하여 에너지 전환에 대한 이해와 참여를 유도하는 데 기여합니다.주1) 2022년 신재생에너지 보급통계 보급용량(발전-신규) 기준주2) 신에너지 및 재생에너지 개발·이용·보급 촉진법 개정("19.10.1. 시행)에 따라 폐기물에너지 중 비재생폐기물은 제외주3) "17년부터 "19년까지 재생/비재생폐기물 분리 산정 비중("19년 기준) 일괄 적용
