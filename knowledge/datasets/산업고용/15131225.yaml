summary_user: 육지와 제주의 1시간 단위 계통한계가격(SMP)과 예측수요(육지·제주·총합)를 하루 단위로 담는 API로, 검증 시 2026-10-01 하루치 전국 48행을 받았다. 발전사업자나 전력 분석가가 내일 시간대별 SMP가 얼마이고 수요가 어느 수준인지 살필 때 쓴다. 날짜(date)·시간(hour)·지역(areaName) 값으로 같은 기관의 다른 전력 수급·시장 데이터와 맞춰 볼 수 있지만, 전역 조인 키는 없다.
description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.육지 와 제주의 1시간 단위 계통한계가격 정보 및 수요예측 값을 제공합니다.각 시간은 그 단위기간의 끝점으로 표시됩니다(즉, 거래시간 06시는 05:00 직후부터 시작하여 06:00에 종료하는 기간을 표시합니다)하루에 1번 갱신되는 데이터이며, 23시경 갱신됩니다.기존 계통한계가격조회 API는 추후 삭제될 예정입니다.
