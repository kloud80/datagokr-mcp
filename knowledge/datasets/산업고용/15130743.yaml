summary_user: 충주시 관내 제조업체 중심 기업을 업체 한 곳당 한 행으로 담은 목록 파일로, 회사명·주요 생산품·업종·회사 전화번호를 담는다. 지역 기업지원 담당자나 거래처를 찾는 사업자가 '충주에서 특정 제품을 만드는 업체는 어디이고 연락처는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 다른 기업 데이터와는 회사명이나 업종명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 충청북도 충주시 소재 기업의 주요 생산품 및 업종 정보를 제공하는 데이터입니다.해당 데이터는 기업명, 주요 생산품, 업종, 전화번호 등의 항목으로 구성되며, 지역 내 등록된 제조업체 중심으로 정리되어 있습니다.기업의 업종은 표준산업분류에 따라 분류되며, 주요 생산품 항목에는 실제 생산 및 출하되는 대표 제품명이 수록됩니다.전화번호는 기업 문의 및 산업통계 활용을 위한 기본 정보로 포함됩니다.이 데이터는 충주시 산업 기반 파악, 지역 기업 네트워크 구축, 산업단지 입주 기업 분석, 기업체 홍보 자료 등 다양한 행정 및 민간 활용에 적합합니다.※ 등록된 정보는 기업 자체의 변경 사항(이전, 폐업 등)에 따라 상이할 수 있으므로 최신 정보 확인은 해당 기업 또는 관련 부서를 통해 확인해야 합니다.
