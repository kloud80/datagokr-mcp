summary_user: 2025년 기준 수출바우처사업 수행기관으로 지정된 기업·기관을 기관별로 정리한 전국 단위 파일로, 수행기관명과 서비스 대분류·중분류(해외마케팅, 통번역, 법률·회계·세무, 특허, 인증, 디자인, 물류 등), 협약 시작·종료일을 담는다. 해외진출을 준비하는 중소기업이 '통번역이나 해외인증 서비스를 바우처로 받으려면 어느 수행기관을 고를 수 있나'를 찾거나, 분석가가 서비스 분야별 수행기관 분포와 협약 기간을 살피는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 수행기관명 문자열 매칭으로만 이어 붙일 수 있다.
limits: 실측 컬럼에 사업자번호·기관코드 같은 공통 키가 없어 기업 인증·확인 원장 등과 정확히 연결하기 어렵고, 이름 매칭 시 동명·표기 차이에 주의해야 한다. 데이터 범위는 전국이며 지역(시군구) 단위 위치 정보는 없다.
