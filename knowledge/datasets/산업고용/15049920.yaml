description_portal: 한국가스공사의 연간 환경활동 비용 데이터 입니다.환경투자 현황 관리 및 환경경영 성과 분석, 환경예산 계획 수립, 투자 효율성 평가를 목적으로 수집되었습니다. 데이터 세부 항목은 연도별 오염처리활동, 오염예방활동, 이해관계자활동, 법규대응활동에 소요된 비용(백만원 단위)과 환경활동비용 합계로 이루어져 있어 활동유형별 투자현황을 파악할 수 있습니다. 본 데이터를 활용하면 연도별 환경투자 추이 분석, 활동유형별 비용 비중 파악, 환경투자 효과 분석, 예산 대비 집행 실적 평가, 투자 대비 환경성과 분석이 가능합니다. 또한 환경투자 계획 수립, 투자 우선순위 결정, 환경성과 대비 투자효율성 분석, 벤치마킹 자료 활용에 기여합니다. ESG 경영성과 보고, 환경회계 관리, 환경경영시스템 인증 등에 기초자료로 활용되어 체계적인 환경경영과 지속가능한 기업 운영을 지원합니다.
