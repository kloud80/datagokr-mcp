summary_user: 한국전력공사 계통보호통합지원시스템에 등록된 계통보호 장치를 장치 한 건 단위로 담은 전국 범위 파일(CSV, 약 61KB)로, 장치유형·제조사·생산년도·등록일시·장치상태·대여여부를 담는다. 전력설비 자산관리 분석가가 "생산년도가 오래된 보호 장치가 얼마나 되고 특정 제조사에 얼마나 몰려 있는가" 같은 노후화·공급망 의존도 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 제조사명 같은 이름 매칭이나 같은 기관 데이터의 업체아이디·장치아이디로만 이어 쓴다.
description_portal: 한국전력공사의 계통보호통합지원시스템에 등록된 장비 업체정보를 담고 있는 데이터입니다.제작사, 제조연월, 등록일시, 임대여부 항목으로 구성되어 있으며 직접적인 전력량 통계가 아닌 전력 인프라 자산관리와 관련된 상세 정보입니다.해당 데이터를 통해 전력설비의 노후화 현황을 분석할 수 있습니다.제조연월을 기반으로 장비들의 평균 수명이나 교체 주기 도래 여부를 파악하고, 이에 따른 전력계통의 잠재적 위험을 평가하는데 사용할 수 있습니다.제작사와 임대여부 항목을 활용해 장비 공급망 의존도를  파악하거나, 장비 조달 및 자산관리 전략에 대한 인사이트를 얻을 수 있습니다.
