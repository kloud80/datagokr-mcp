description_portal: 본 데이터는 글로벌 LNG 시장에서 유럽 대륙의 LNG 수입 물량 및 원산지별 거래 현황을 연도별로 체계적으로 정리한 국제 에너지 무역 통계 자료입니다. Energy Institute에서 매년 발표하는 세계 에너지 통계 리뷰 데이터를 기반으로 유럽 지역 LNG 거래 흐름을 분석하여 독립적인 데이터셋으로 가공 및 제공합니다. 데이터 항목으로는 연도, 원산지국, 수입량, 전체 대비 수입 비중 등이 포함됩니다. 유럽은 에너지 안보 강화와 러시아 의존도 탈피를 위해 LNG 수입을 급격히 확대하고 있는 전략적 시장입니다. 이 데이터를 통해 유럽 LNG 시장의 거래 흐름과 주요 공급국 변화 추이, 연도별 수입 규모 확대 현황을 종합적으로 파악할 수 있으며, 글로벌 LNG 시장 동향 분석 및 국제 에너지 정책 연구에 핵심 참고자료로 활용될 수 있습니다.
