summary_user: 한국서부발전 신재생 발전설비의 장치(장치아이디)별·측정 시점(절대시간·로컬시간)별 운전 계측값을 담은 건별 시계열 데이터로, 3상(R·S·T) 전압·전류·역률, 주파수, 유효·무효전력, 누적 유효·지상·진상 전력량, 설비상태와 알람 상세가 들어 있다. 분석가가 특정 설비의 출력·전력 품질이 시간에 따라 어떻게 변했는지, 이상 알람 전후로 전압·전류가 어떻게 움직였는지를 보고 성능 예측이나 AI 모델 검증용 학습 데이터로 쓴다. 실측 컬럼에서 다른 데이터와 맞출 전역 조인 키는 확인되지 않았으므로, 태양광 발전사업 허가 표준데이터 같은 발전소 원장과는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 한국서부발전에서 제공하는 플랜트 성능 예측 및 AI 검증용 신재생 정보 조회 서비스는 장치아이디, 절대시간, 로컬시간, 설비상태, 전압(R, S, T), 전류(R, S, T), 역률(R, S, T), 주파수, 유효전력, 무효전력(지상, 진상), 누적유효, 누적지상, 누적진상, 알람상세로 구성됩니다. 각 항목은 발전설비의 전기적 상태와 운전 정보를 나타내며, 절대시간과 로컬시간을 통해 측정 시점을 확인할 수 있습니다. 전압, 전류, 역률, 주파수, 유효전력 및 무효전력 값은 설비 운전 상태와 성능 평가에 활용되며, 누적유효, 누적지상, 누적진상 값은 생산된 전력량을 나타냅니다. 설비상태와 알람상세 정보는 장치 운전 및 안전 관리를 위해 사용됩니다.
