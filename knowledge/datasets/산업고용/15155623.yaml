summary_user: 한국중부발전 발전소별로 월마다 연료 종류별 전월 재고, 입고·출고·기타 입출고, 당월 재고 수량과 단위를 담은 집계 파일(CSV)이다. 발전 연료 수급을 분석하는 연구자나 에너지 분석가가 "특정 발전소의 석탄·가스 재고가 어느 달에 줄었고 입고가 출고를 따라갔는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소명과 연월을 기준으로 다른 발전소 원장이나 발전량 자료에 이름 매핑해 이어 붙여야 한다.
description_portal: 이 데이터는 한국중부발전의 발전소별 월 단위 연료 입출고 현황과 재고량을 기록한 자료입니다. 발전소명, 연월, 구분, 연료종류, 전월 재고 수량, 입고 수량, 출고 수량, 기타 입출고 수량, 당월 재고 수량, 단위 항목으로 구성되어 있습니다. 이를 통해 발전소의 연료 수급 흐름과 재고 변동을 한눈에 파악할 수 있으며, 연료 사용 효율 분석, 발전량 대비 연료비 산정, 공급 안정성 확보를 위한 계획 수립 등에 활용됩니다. 본 데이터는 에너지 조달 관리, 비용 정산, 재무 분석 등 발전 운영 전반의 의사결정에 필수적인 데이터입니다.
