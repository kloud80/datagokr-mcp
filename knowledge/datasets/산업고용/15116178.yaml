description_portal: '서울특별시 중구의 담배를 매입하여 다른 도매업자 또는 소매인에게 판매하는 업소 정보입니다. 해당 데이터에는 사업명, 영업 상태, 주소, 좌표정보, 취급제품, 공급업 등이 포함되어 있습니다. 이를 통해 시민과 관계 기관은 담배 유통 구조를 파악하고, 불법 유통 방지 및 시장 질서 유지를 위한 정책 수립에 활용할 수 있습니다. 변경 이력은 업체의 이전, 명의 변경 등 행정 변동 사항을 확인하는 데 유용하며, 영업 상태와 폐업 정보는 시장 동향 분석과 상권 변화 연구에 중요한 자료입니다. 도매 거래망 정보는 공급 경로와 유통 범위를 이해하는 데 도움을 줍니다. 본 데이터는 정기적으로 갱신되어 최신 정보를 반영하며, 누구나 공공데이터포털을 통해 열람하고 활용할 수 있습니다. 이를 통해 지역사회 유통 관리와 공중 보건 향상에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
