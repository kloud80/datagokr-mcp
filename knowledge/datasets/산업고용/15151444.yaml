summary_user: 가맹정보제공 시스템에서 쓰는 시도·시군구·행정동 3단계 행정구역 코드와 명칭을 한 행정동당 한 행으로 담은 기준표로, 범위는 전국 시도부터 읍면동 단위까지다. 가맹사업 분석가가 '지역별 가맹점 분포나 상권 데이터를 행정동 단위로 묶으려면 어떤 코드를 써야 하나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(admdong_cd)나 시군구·행정동 명칭을 매핑해 같은 체계의 가맹·상권·유동인구 데이터와 이어 쓴다.
description_portal: 이 데이터는 가맹정보제공 시스템에서 사용되는 전국 시도, 시군구, 행정동 단위의 행정구역 코드와 명칭을 포함한 정보로 구성되어 있으며, 가맹사업 관련 데이터와의 연계를 위한 지역 식별 기준으로 사용됩니다. 각 행정동은 고유한 행정동코드를 가지고 있으며, 시도코드 및 시군구코드와 함께 지역을 계층적으로 구분할 수 있습니다. 본 자료는 상권 분석, 유동인구 데이터와의 매칭, 지역별 가맹점 분포 분석 등 다양한 데이터 간 결합을 위한 기초 지리정보로 활용됩니다. 데이터는 전체 시도와 시군구, 행정동까지 포함되어 있어 전국 단위의 지역 분석에도 활용이 가능합니다.
