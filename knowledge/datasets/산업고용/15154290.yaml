summary_user: NCS(국가직무능력표준) 코드, 국가기간훈련직종 코드, 한국고용직업분류(KECO) 코드를 한 행에 짝지어 각 코드명과 함께 담은 전국 단위 분류 매핑표(CSV 파일, 약 148KB)입니다. 훈련기관·정책 분석가가 "이 KECO 직업에 해당하는 NCS 직무와 국가기간훈련직종은 무엇인가"를 확인해 훈련과정 설계나 인력수급 분석에 쓴다. 세 코드 열이 모두 직업분류 키(job_code)이므로 KECO 기반 채용공고·직업정보, NCS 기반 자격·직무데이터, 국가기간훈련직종 기반 직업훈련 과정 데이터를 서로 잇는 연결표로 쓴다.
description_portal: NCS코드, 국가기간훈련직종코드, KECO코드 매핑자료는 직업·훈련·산업 분류 체계를 상호 연계하기 위해 만들어진 기준 정보 세트입니다. 먼저 **NCS코드(국가직무능력표준)**는 직무 수행에 필요한 능력 단위를 기준으로 세분화된 직무 중심 분류이며, 교육훈련과 자격 설계의 핵심 기준으로 활용됩니다. 국가기간훈련직종코드는 고용노동부에서 운영하는 훈련과정 분류 체계로, 산업·직무 수요 기반의 훈련직종을 체계적으로 관리하는 데 사용됩니다. **KECO코드(한국고용직업분류)**는 한국고용정보원에서 관리하는  직업 분류체계로 구직 및 취업알선 정보제공 등 행정목적으로 활용토록 고용직업분류를 특수목적분류로 지정하여 운영합니다.. 이 매핑자료는 서로 다른 기준 간의 직무–훈련–산업 연계 구조를 명확히 해주는 데이터로, 예를 들어 특정 산업(KECO)에서 필요한 직무(NCS)가 무엇인지, 그 직무를 위한 적정 훈련과정(국가기간훈련직종)이 무엇인지 연결할 수 있게 해줍니다. 이를 통해 훈련과정 설계, 고용정책 분석, 산업별 인력수급 연구, 직업정보 제공 시스템 구축 등 다양한 행정·정책 업무에서 활용도가 높습니다. 또한 중복 영역 점검, 미스매치 진단, 신규 직종 개발 등에서도 핵심 기반 자료로 기능합니다.
