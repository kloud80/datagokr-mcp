description_portal: 본 데이터는 한국중부발전이 석탄 연료 조달과 관련해 주요 시장지표를 바탕으로 예측한 연료조달비 정보를 정리한 자료입니다. 항목은 예측 기간, 환율 평균 지수, 저위발열량 평균 지수, 예측 호주탄 가격, 예측 인니탄 가격, 발틱운임 지수로 구성되어 있으며, 가격 단위는 톤당 USD입니다. 발틱운임지수는 주요 원자재의 국제 해상운송 비용을 반영한 글로벌 운임지표입니다. 해당 자료는 연료비 예산 편성, 수입탄 가격 전망, 물류비용 변동성 분석 등 에너지 조달 전략 수립에 활용 가능합니다. 또한 발전단가 예측, 정책 리스크 대응, 조달계획 조정 등 실무 의사결정 자료로도 활용 가능합니다.
