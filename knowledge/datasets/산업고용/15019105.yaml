description_portal: 한국서부발전의 탈황석고 발생량 및 계약량 정보입니다. 태안발전소 및 평택발전소의 탈황석고 발생량 및 계약량을 월별로 집계한 데이터는 발전소의 대기오염 저감설비 운영 결과와 부산물 자원화 현황을 함께 보여주는 중요한 자료입니다. 탈황석고는 석탄화력발전 과정에서 배출되는 황산화물을 제거하기 위해 설치된 탈황설비에서 부산믈로 발생하는 석고로, 시멘트 원료나 건축 자재 등으로 재활용됩니다. 데이터에는 월별 탈황설비 가동에 따라 실제로 발생된 석고의 총량과 이를 활용하기 위해 시멘트사나 건설사 등과 체결한 계약량이 구분되어 기록됩니다. 이를 통해 발전소 운영 과정에서의 환경 관리 성과와 자원순환 활용도를 정량적으로 파악할 수 있습니다.
