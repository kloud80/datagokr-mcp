description_portal: '중진공 동반성장 네크워크론 정책자금 지원 받은 발주기업과 수주기업의 업력별 분포 현황(기업수와 비중) 데이터 자료입니다.동반성장 네트워크론은 중소기업의 생산자금을 대․중견․우량중소기업과 협력하여 발주금액의 80% 까지 365일 이내 단기자금 방식으로 지원하는 관계형 정책금융입니다.중소기업이 납품 계약 이행을 위한 생산 단계부터 단기 생산자금을 확보할 수 있습니다.중진공과 동반성장 협약을 체결한 발주기업이 추천하는 수주기업에 납품계약 이행을 위한 생산자금을 대출하며 수주기업의 납품 및 채권양수도 후 발주기업이 납품대금 지급을 통해 대출금 상환(납품 미이행 시 수주기업이 상환)이 이루어집니다. * 물품・용역 등 납품기한이 발주일로부터 1년 이내인 납품 발주서를 근거로 지원 * 수주기업 : 계약(발주서)에 근거하여 발주기업에 물품 또는 용역을 제공하는 기업 * 발주기업 : 수주기업으로부터 물품 또는 용역을 제공받음으로써 매출채권에 대하여 상환의무를 부담하는 기업'
