description_portal: 이 데이터는 수입한 원유를 유질별로 분류하여 정리한 자료입니다. 유종명과 함께 수입국, 수입연도, 수입량(천배럴), 수입금액(천달러) 등의 항목이 포함되어 있으며, 원유의 품질 특성에 따른 수입 현황을 연도별로 확인할 수 있습니다. 이를 통해 특정 유질의 수입 비중이나 특정 국가로부터의 특정 유질 수입 집중도를 분석할 수 있으며, 국내 정유산업의 수입 다변화 전략, 원유 정제 최적화, 에너지 수급 전략 수립 등에 활용될 수 있는 기초 자료입니다. 또한 유가 변동, 공급망 위험 분석, 국제 유가 정책 대응 등 에너지 정책 및 산업 전략 수립에도 유용한 정보를 제공합니다.
