summary_user: 강원특별자치도 홍천군의 토석채취 허가를 허가 1건당 1행으로 담은 원장 파일로, 포털 설명상 2024년 8월 20일 기준 연번 1~12번 허가의 수허가자·허가지역·용도(골재용, 농경지 객토·수해복구용 등)·허가량·허가면적·허가기간을 담는다. 홍천군에서 지금 어떤 업체가 어느 지역에서 어떤 용도로 토석을 캐도록 허가받았고 그 허가가 언제 끝나는지를 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어서, 다른 시군 토석채취 현황이나 국토 공간 규제 자료와는 허가지역 주소·지명을 맞춰 보거나 같은 기관 기준으로만 이어 쓴다.
limits: 홍천군 한 곳만 다루고 좌표가 없는 비공간 표라 지도에 바로 겹쳐 볼 수 없으며, 필지 단위 공간 분석에는 허가지역 주소를 따로 매핑해야 한다. 표준 코드나 공통 키가 없어 다른 지자체 자료와 합칠 때는 이름 기반 매칭이 필요하다.
