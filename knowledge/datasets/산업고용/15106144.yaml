description_portal: "중소기업기술정보진흥원에서 제공하는 '기술집약도에 따른 중위기술 해당 업종표' 데이터는 국내 산업을 기술 수준별로 분류하고, 특히 중위기술(Medium-High Technology)에 해당하는 업종 정보를 상세하게 제공합니다. 이 데이터는 한국표준산업분류(KSIC) 체계를 활용하여 산업을 대분류, 중분류, 소분류의 세밀한 단계로 구분합니다. 각 컬럼에는 코드(예: 대분류 코드)와 해당 항목명(예: 대분류 항목명)이 명시되어 있어, 사용자가 특정 산업 부문이 기술집약도 측면에서 중위기술 범주에 속하는지 정확하게 파악하고 분석하는 데 도움을 줍니다."
