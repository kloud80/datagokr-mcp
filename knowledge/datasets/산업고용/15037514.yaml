summary_user: 창업진흥원 창업에듀의 패키지 교육과정을 운영기관별로 정리한 목록 파일(CSV, 약 13.6KB)로, 한 행에 운영기관 유형·기관명·패키지명·운영기간·인정시간·학습내용·패키지 주소·사용 여부를 담는다. 예비 창업자나 창업 교육 담당자가 '어느 기관이 어떤 창업 교육 패키지를 몇 시간 인정으로 운영하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 창업지원 데이터와는 기관명 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 데이터는 전국 각지에 분포한 창업지원센터의 기본 정보를 포함하고 있습니다. 각 센터는 운영기관 유형, 기관명, 패키지명, 운영기간, 인정시간, 학습내용, 패키지 주소, 사용유무 항목으로 구성되어 있으며, 창업자 및 예비 창업자가 접근 가능한 공공 창업 인프라로 활용됩니다. 수록된 센터들은 대학, 공공기관, 진흥원, 민간기업, 비영리재단 등 다양한 주체가 운영하는 것으로 나타나며, 수도권·광역시·지방 중소도시까지 고르게 분포해 있습니다. 이를 통해 지역 균형 발전 및 창업 접근성 향상을 지원할 수 있으며, 창업공간 확보 및 거점별 창업자 네트워크 구축에도 활용 가능성이 큽니다. 본 데이터는 창업 수요자에게 지역별 지원 거점 위치를 제공하는 지도 기반 서비스 설계, 창업 정책의 공간적 확산 효과 분석, 지역 중심 창업지원 전략 수립 등에 활용될 수 있습니다.
