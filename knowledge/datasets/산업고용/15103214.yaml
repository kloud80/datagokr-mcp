summary_user: 전력시장에서 거래시간별 시장가격(SMP)을 어느 연료원(LNG·유류·유연탄·무연탄·원자력) 발전기가 결정했는지 그 횟수를 거래일별로 합산한 집계 데이터로, 육지와 제주를 구분해 담는다. 에너지 분석가나 발전사업자가 '최근 SMP를 주로 LNG가 결정했는지 석탄이 결정했는지'처럼 가격결정 연료 구성의 변화를 확인하는 데 쓴다. 전역 조인 키는 없으며 거래일자(tradeDay)와 지역(육지/제주)을 기준으로 같은 전력거래소의 일별 SMP·발전원별 발전량 데이터와 맞춰 쓴다.
description_portal: 전력시장의 연료원별 시장가격을 결정한 횟수를 일별로 합산하여 제공합니다. LNG, 유류, 유연탄, 무연탄, 원자력 항목을 제공합니다.ㅇ SMP란 거래시간별로 적용되는 전력량에 대한 전력시장가격(원/kWh)을 말하며, 육지 및 제주지역으로 구분ㅇ SMP 결정이란 가격결정발전계획 수립 시 발전기별 발전계획 누적량이 전력수요량에 해당하는 발전기의 발전비용으로 거래시간별로 적용되는 전력량에 대한 전력시장가격 결정을 의미ㅇ 2024년 8월 20일 부터 제주와 육지의 연료원별 SMP 결정횟수를 구분하여 API를 제공합니다.
