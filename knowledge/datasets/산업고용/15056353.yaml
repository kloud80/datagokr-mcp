summary_user: 서귀포시 관내에 설치된 지정 벽보판을 한 곳씩 담은 개별 시설 목록으로, 읍·면·동, 도로명 주소, 상세 설치 위치, 벽보판 규격(가로·세로), 위도·경도를 담는다(CSV 파일 약 18KB). 선거 벽보나 공공 게시물을 붙일 벽보판이 우리 동네 어디에 있는지, 읍면동별로 벽보판이 고르게 배치됐는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 읍면동 이름으로 행정구역 자료와 맞추거나 위도·경도 좌표로 지도·GIS 자료에 겹쳐 쓴다.
description_portal: 이 데이터는 서귀포시 관내에 설치된 지정 벽보판의 위치와 설치 상세 정보를 담고 있습니다. 각 데이터에는 읍·면·동 행정 구분, 도로명 주소, 상세 설치 위치, 벽보판 규격(가로·세로), 위도·경도 좌표 등이 포함되어 있어 정확한 공간 식별이 가능합니다.이를 활용하면 지역 홍보시설 배치 최적화, 벽보판 관리 및 유지보수 계획, GIS 기반 홍보망 분석, 정보 접근성 평가, 홍보 효율과 시각적 가시성 향상 방안 수립 등에 유용합니다. 도시 미관 조정, 재난 공지 설계, 커뮤니티 정보 전달 기반 구축에도 활용 가능하며, 주민 안내 서비스 강화에도 기여합니다.
