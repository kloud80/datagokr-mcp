summary_user: 대전광역시가 유망중소기업으로 선정한 관내 기업을 업체별 한 행으로 담은 목록으로, 선정년도·업체명·주생산품을 담는다(파일 크기 약 1KB의 소규모 CSV). 대전 지역 유망중소기업으로 어떤 업체가 선정됐고 주로 무엇을 생산하는지 확인하려는 사업자·분석가가 쓴다. 사업자등록번호 같은 공통 조인 키가 없어 다른 기업 데이터와는 업체명으로만 맞춰 이어 쓴다.
description_portal: 대전광역시 유망 중소기업 선정 현황 자료는 2022년 성장 가능성과 기술력을 인정받아 선정된 관내 중소기업의 기본 정보(기업명,  선정 년도, 주요 생산 품목)등 다양한 기업 정보를 포함하는 자료입니다. 선정 대상은 대전 내에서 일정 기간 이상 정상 영업 중인 중소기업으로, 선정 평가 기준에 따라 경영 능력, 재무 현황, 기술 혁신 노력, 생산 품목, 성장 잠재력 등을 심사해 결정되며, 선정된 기업은 중소기업 육성 자금, 세무조사 유예, 정보 제공, 특화 지원 등 지원 혜택을 받게 됩니다. 해당 자료는 지역 경제 활성화 및 일자리 창출, 기업 지원 정책 수립, 산업군 별 분포 및 성장 추이 분석, 맞춤형 육성 전략 수립 등 다양한 행정 및 정책 자료로 활용될 수 있습니다.
