description_portal: 한국광해광업공단은 석탄산업의 생산 기반 유지와 연탄의 안정적인 공급을 위해 석·연탄산업 지원 사업을 실시하고 있으며 이를 통해 자원안보와 서민생활보호 및 폐광지역 고용창출 등에 이바지하고 있습니다. 공단에서 시행하는 석연탄지원사업에 대하여 1958년부터 그간 지원한 무연탄 수급내역을 연도별로 제공합니다.이 데이터셋은 연도별 무연탄의 공급량, 소비량, 재고량 등 상세한 수급 정보를 포함하고 있어, 무연탄의 수급 동향을 파악하고 정책 수립에 활용할 수 있는 중요한 기초 자료를 제공합니다. 특히, 석탄산업의 생산 기반 유지와 연탄의 안정적인 공급을 위한 정책 효과를 분석하는 데 유용합니다.이러한 정보를 통해 무연탄 수급의 안정성을 높이고, 에너지 정책 및 산업 구조 조정에 필요한 실증적 근거를 제공하며, 폐광지역의 고용 창출 및 자원 효율적 활용 방안을 모색하는 데에도 기여합니다.
