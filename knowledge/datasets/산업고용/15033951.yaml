summary_user: 경상남도 고성군 안의 태양광 발전시설을 시설 한 곳당 한 행으로 담은 파일로, 상호명·설치장소 소재지·설비용량·허가일자·기준일자를 기록한다. 고성군에서 어느 지역에 태양광 시설이 얼마나 들어섰고 언제 허가됐는지 확인하려는 주민·행정 담당자·에너지 분석가가 쓴다. 전역 조인 키가 없어 소재지 주소나 상호명으로 맞춰야 하며, 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 주소·용량을 기준으로 대조해 쓴다.
