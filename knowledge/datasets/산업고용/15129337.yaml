description_portal: '한국산업기술진흥원에서 제공하는 연수지원 정보 데이터는 주관기관이 추진하는 다양한 사업에서의 연수 현황을 세부적으로 기록한 데이터입니다. 이 데이터는 연수의 명칭, 유형 및 학술, 기술, 학위 취득과 관련된 정보를 포함하고 있습니다. 특히, 연수의 목적과 형태에 따라 장기 및 단기 국내외 연수의 수행현황을 자세히 제공합니다. 이 데이터를 통해 연구 시설 및 기업들은 연수의 진행 상황을 분석하고, 향후 연수 프로그래밍이나 정책 수립에 유용하게 활용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다."년도"(숫자형) : 해당 기록의 연도"순번"(숫자형) : 데이터의 순번"기관명"(문자형) : 연수를 실시한 기관의 이름"연수명"(문자형) : 진행된 연수의 명칭"학술연수_장기국내"(숫자형) : 장기국내 학술연수의 수"학술연수_단기국내"(숫자형) : 단기국내 학술연수의 수 "기술연수_단기국내"(숫자형) : 단기국내 기술연수의 수"논문건수"(숫자형) : 연수와 관련하여 발표된 논문의 수"학위취득_석사"(숫자형) : 석사 학위를 취득한 인원 수등의 컬럼을 포함하고 있습니다.'
