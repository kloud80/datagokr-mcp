description_portal: 전북특별자치도 전주시 제조업 현황 데이터는 전주시 관내 제조업체의 업종 및 생산 활동 현황 정보를 체계적으로 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 연번, 업종, 사업체명, 주생산품, 주소, 지번주소, 위도, 경도, 전화번호, 팩스번호, 홈페이지 등의 정보를 포함하여 제조업체의 기본 현황과 위치 정보를 종합적으로 확인할 수 있도록 구성되었습니다.특히 업종 및 주생산품 정보를 함께 제공함으로써 지역 산업 구조와 생산 특성을 파악할 수 있도록 하였으며, 위치정보(위도·경도)를 통해 산업 분포 분석, 기업 입지 검토, 투자 유치 기초자료, 지역 산업 생태계 연구 등 다양한 분야에서 활용할 수 있도록 설계되었습니다. 또한 기업, 연구자, 창업자 및 관련 기관이 협력 네트워크 구축, 거래처 발굴, 산업 정책 분석 자료로 활용할 수 있습니다.전주시는 본 데이터를 통해 지역 제조업 정보의 공공성과 활용성을 강화하고 기업 지원 정책의 기반 자료로 활용하는 것을 목표로 하며, 신규 등록, 변경 및 휴·폐업 등 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 기업지원과에서 제공·관리합니다.
