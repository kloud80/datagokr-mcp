summary_user: 경기도 안산시에 설치된 신재생에너지 발전원(태양광·풍력·연료전지·소수력 등)을 연도와 발전원 구분별로 개수와 발전용량(kW)을 묶어 담은 집계 파일이며, 450바이트 크기의 소규모 CSV입니다. 지역 에너지 정책 담당자나 분석가가 '안산시에서 태양광 설비 용량이 해마다 얼마나 늘었고 연료전지와 비교하면 어떤가'처럼 발전원별 보급 추세를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명·연도를 이름으로 맞추거나 발전원 이름을 매핑해 이어 써야 하며, 발전소 단위 주소·용량이 필요하면 전국태양광발전소전기사업허가정보 표준데이터를 함께 본다.
description_portal: '이 데이터는 특정 지역에서 설치된 신재생에너지 발전원의 연도별 현황을 정리한 자료입니다. 연도, 시군명, 발전원 구분명(예: 태양광, 풍력, 연료전지, 소수력 등), 발전원 개수, 발전 용량(kW) 항목으로 구성되어 있으며, 연도별로 주요 에너지원의 확산 추세와 발전 설비 규모를 파악할 수 있도록 정리되어 있습니다. 태양광 발전은 설치 건수가 많고 급격한 용량 증가를 보여주며, 연료전지나 풍력 등은 상대적으로 개수가 적지만 고용량 특성이 두드러집니다. 해당 자료는 지역 신재생에너지 보급률 분석, 에너지 전환 정책 효과 측정, 에너지원 다변화 계획 수립, 온실가스 감축 이행 시나리오 설정 등 다양한 행정 및 정책 기획 분야에 활용하실 수 있습니다.'
