summary_user: 광물자원 조사 보고서(굴진효과조사·기본조사·기술조사·물리탐사·시추결과·정밀조사 6종)의 목록을 보고서 한 건당 한 행으로 담은 전국 범위 파일(CSV 약 1MB)로, 보고서 종류·작성연도·광산명·광종·소재지·광업지적·보고서번호를 담는다. 광산 개발을 검토하는 사업자나 연구자가 특정 지역이나 광종에 대해 어떤 조사가 언제 이뤄졌고 원 보고서 번호가 무엇인지 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 광업권·토석채취허가 등 다른 데이터와는 광업지적·광산명·소재지 같은 이름·주소 매칭으로만 이어 쓴다.
description_portal: 산업통상자원부에서는 광물 자원의 효율적 개발과 체계적 관리를 위해 다양한 조사 보고서를 목록 형태로 제공하고 있습니다. 이에는 굴진효과조사, 기본조사, 기술조사, 물리탐사, 시추결과, 정밀조사 등 여섯 가지 유형이 포함되며, 각 보고서에는 광종, 광산명, 소재지, 광업지적, 보고서번호, 작성연도 등의 주요 정보가 담겨 있습니다. 이러한 자료는 광산 개발의 기초 데이터를 확보하고 국가 정책 수립, 산업 전략 마련, 학술 연구 등에 폭넓게 활용될 수 있도록 구성되어 있습니다.* 총 6종류의 보고서의 목록을(광종, 광산명, 소재지, 광업지적, 보고서번호, 작성연도 등) 제공
