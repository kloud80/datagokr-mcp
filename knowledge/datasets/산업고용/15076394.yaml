summary_user: 서울시 상권 하나당 한 행으로 상권 구분·상권 코드와 이름, 대표 좌표(엑스·와이좌표), 소속 자치구·행정동, 영역 면적을 담는 상권 영역 기준 자료다. 상권분석가나 창업 준비자가 "이 행정동에는 어떤 상권이 있고 면적은 얼마인가"를 확인하거나 상권을 지도에 표시할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 서울시 상권분석서비스의 매출·유동인구·점포 자료와는 상권 코드(TRDAR_CD)로, 행정구역 자료와는 자치구·행정동 코드나 이름 매핑으로 잇는다.
description_portal: 서울시 상권분석서비스(영역-상권) 데이터는 서울시 내 개별 상권의 위치와 행정구역 정보를 공간적으로 분석할 수 있도록 구성된 자료입니다. 상권 구분 코드와 상권 코드, 각 코드 명을 통해 상권의 유형과 이름을 식별할 수 있으며, 엑스좌표 값과 와이좌표 값 정보로 지도 기반의 위치 시각화와 공간 분석이 가능합니다. 자치구 코드, 자치구 코드 명, 행정동 코드, 행정동 코드 명을 통해 상권이 속한 행정구역을 정확하게 파악할 수 있어 자치구별·행정동별 상권 특성 비교와 정책 수립에 활용할 수 있습니다. 또한 영역 면적 항목을 통해 상권의 공간적 규모를 정량적으로 측정할 수 있어 상권 규모에 따른 매출, 유동인구, 점포 수 등 다른 지표와의 연계 분석이 용이합니다. 이 데이터는 상권 현황을 지리정보시스템과 연계해 분석하거나 상권 지도, 상권 비교 서비스 등 다양한 상권 분석 서비스 구축에 활용하기에 적합한 기초 공간 데이터입니다.
