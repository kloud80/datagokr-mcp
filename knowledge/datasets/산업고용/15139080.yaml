description_portal: 이 데이터는 경상북도 영양군 관내에 설치된 풍황계측기(Wind Monitoring System)의 위치와 허가 관련 정보를 담고 있습니다.풍황계측기는 풍력자원의 조사 및 분석을 위한 장비로, 지역의 바람 세기, 방향, 빈도 등의 정보를 장기적으로 측정합니다. 본 데이터는 계측기의 지번주소, 면적, 허가일과 만료일, 설치 목적, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 계측기는 재생에너지 개발을 위한 기초 자료 확보, 풍력발전 적지 분석, 기후 관측 보조 등 다양한 공공 목적을 위해 설치되며, 본 데이터를 통해 영양군 내 관련 활동의 공간 분포와 관리 현황을 파악할 수 있습니다.
