summary_user: 한국서부발전의 발전소 운영 과정에서 쓰고 처리한 발전용수 현황을 담는 API로, 용수 사용량, 폐수 발생량·처리량, 재이용량, 외부 수계 방류량을 구분해 제공하며 범위는 전국·비공간입니다. 환경 분석가나 발전사 관계자가 '서부발전 발전소가 쓴 용수 중 얼마가 재이용되고 얼마가 방류되는가'처럼 수자원 이용·처리 실적을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 사업소·기관 이름(orgnm으로 추정) 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 한국서부발전의 전력생산을 위한 발전용수 현황 정보 오픈API입니다. 한국서부발전 발전용수 방지시설별 데이터는 발전소 운영 과정에서 발생하는 수자원 이용과 처리 현황을 종합적으로 보여주는 자료 입니다. 이 데이터에는 발전 설비 냉각 및 보조 공정에 사용된 용수 사용량, 사용후 발생한 폐수 발생량, 환경기준에 맞추어 처리된 폐수 처리량이 포함됩니다. 또한 처리된 폐수 중 일부를 재이용하여 자원 활용도를 높인 재이용량과 최종적으로 외부 수계에 방류된 방류량이 구분되어 기록됩니다. 이 데이터는 정부 환경 규제 준수, 수질보호 대책 수립, 친환경 발전소 운영 전략 마련에 있어 필수적입니다.
