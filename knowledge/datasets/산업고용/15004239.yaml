summary_user: 한국중부발전이 보유한 발전소별 신재생에너지 설비의 일일 설비용량(kW)과 발전량(kWh)을 2023년 11월부터 2025년 8월까지 일 단위로 담은 CSV 파일이다. 에너지 분석가나 연구자가 "중부발전의 태양광·풍력 등 신재생 설비가 하루에 실제로 얼마나 발전했고, 설비 규모 대비 효율은 어떤가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 발전설비 이름을 직접 매핑하거나 날짜(연월일) 기준으로 전력거래소 수급·발전량 자료와 맞춰 보는 식으로 이어 쓴다.
description_portal: 본 데이터는 한국중부발전이 보유한 발전소별 신재생에너지의 2023년도 11월부터 2025년도 8월까지 일일 발전설비 용량과 발전량을 정리한 자료입니다. 항목은 연월일, 발전설비, 설비용량, 발전량으로 구성되어 있으며, 설비용량은 킬로와트(kW), 발전량은 킬로와트시(kWh) 단위로 제공됩니다. 해당 자료는 발전소별 재생에너지 설비 규모와 실제 발전 실적을 일간 기준으로 확인할 수 있으며, 에너지 생산효율 분석, 발전원별 실적 비교, 설비 운영 최적화 전략 수립 등에 활용합니다. 또한 재생에너지 이행률 분석, 온실가스 감축 실적 산정, 에너지 수급 계획 수립의 기초 자료로도 활용 가능합니다.
