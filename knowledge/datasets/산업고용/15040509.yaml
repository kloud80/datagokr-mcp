summary_user: 광진구 관내 반려동물 등록 현황을 법정동별로 집계한 파일로, 등록 주체(구청·대행업체·2009년 이전 등록)별 건수, 등록 방식(내장형·외장형·인식표)별 건수, 등록 품종 수, 동물 소유자 수를 담는다(약 522바이트의 작은 CSV). 구청 담당자나 분석가가 광진구 동네별 반려동물 등록 규모와 내장형 칩 비중이 어떤지 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 법정동명(읍면동) 이름을 맞춰 연결해야 한다.
description_portal: 서울특별시 광진구_반려동물 등록현황 데이터는 광진구 관내에서 등록된 반려동물의 현황을 법정동 단위로 제공하는 행정 데이터입니다. 이 데이터는 “법정동명”, “태그형태”, “등록현황”, “데이터기준일” 필드로 구성되어 있습니다. ‘법정동명’은 반려동물 등록이 이루어진 법정동의 명칭을 나타내며, ‘태그형태’는 반려동물에게 부착된 등록식별 태그의 형태를 구분합니다. ‘등록현황’은 각 법정동별 반려동물 등록 수량과 현황을 제공하며, ‘데이터기준일’은 제공되는 정보의 최신화 기준일을 명시합니다. 이 데이터는 반려동물 등록제 운영 현황 분석, 지역별 동물 보호 정책 수립, 유실·유기 동물 관리 및 반려동물 복지 향상을 위한 기초 자료로 활용될 수 있습니다.
