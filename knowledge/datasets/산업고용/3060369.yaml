summary_user: 대전광역시 대덕구에 지정된 담배소매업소를 업소 단위로 한 줄씩 담은 원천 목록으로, 민원구분·업소명·소재지 주소·지정일자를 담는다. 상권 분석가나 편의점·담배소매 창업 예정자가 특정 동네에 담배소매업소가 어디에 얼마나 몰려 있는지 확인하는 데 쓴다. 공통 조인 키는 없어서, 다른 데이터와 이으려면 주소나 업소명으로 맞추거나 소상공인 상가업소 정보 같은 상권 원장과 주소 기준으로 대조해야 한다.
description_portal: 본 데이터는 대전광역시 대덕구에 등록된  담배소매업 업체의 상세 현황을 제공하는 공공데이터입니다.데이터 주요 구성 항목으로는 민원구분, 업소명, 도로명주소, 지정일자 등의 주요 정보가 포함되어 있습니다.해당 자료는 관내 담배소매업 업체들의 분포와 등록 실태를 파악하는 데 활용됩니다.정기적으로 갱신되는 본 데이터는 최신 정보를 반영하여 행정의 투명성과 효율성을 높이는 데 기여합니다.이용자는 이를 통해 지역 내 상권 분석과 공공기관의 인허가 정보를 한눈에 확인하고 활용할 수 있습니다.
