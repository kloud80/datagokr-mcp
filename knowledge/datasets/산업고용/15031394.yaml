summary_user: 충청남도 보령시 관내 현수막 지정게시대를 게시대 한 곳당 한 행으로 담은 파일로, 읍면동·위치·규격(미터)·상업용과 행정용 게시면수를 기록한다(읍면동 단위, 약 7.9KB CSV). 현수막을 걸려는 사업자나 시민이 '우리 동네 어느 게시대에 상업용 현수막을 걸 수 있고 몇 면이 있는가'를 확인하거나, 분석가가 읍면동별 게시공간 배분을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름을 맞춰 연결하는 정도로만 이어 쓴다.
description_portal: 도시미관 개선과 깨끗한 거리환경 조성을 위한 현수막 설치 질서 확립 필요성 증대, 상업적 홍보와 행정홍보의 균형있는 공간 배분 요구, 그리고 옥외광고물법 개정에 따른 현수막 관리 체계 강화 정책 추진에 따라 보령시는 관내 설치된 현수막 지정 게시대 현황을 체계적으로 관리하고 있습니다. 무분별한 현수막 설치로 인한 도시미관 훼손 방지와 시민들의 홍보 및 광고 수요 충족을 위해 읍면동별로 지정된 게시대를 운영하고 있습니다. 각 게시대별로 상업용과 행정용 게시면수를 구분하여 공공성과 상업성의 조화를 추구하며, 현수막 규격을 표준화하여 일관성 있는 거리환경을 조성하고 있습니다. 위치 정보를 통해 시민과 사업자들이 쉽게 접근할 수 있도록 하며, 효율적인 게시공간 활용과 관리를 위한 기초자료로 활용하고 있습니다.
