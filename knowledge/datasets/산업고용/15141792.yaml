description_portal: 서울특별시 용산구 관내 특정고압가스업 인허가 정보(연번, 업소명, 소재지, 대표자, 허가종류, 전화번호, 비고)를 제공하는 데이터입니다. 본 정보는 「고압가스 안전관리법」에 따라 허가·신고된 특정고압가스업 시설을 대상으로 하며, △제조업(산소, 질소, 아세틸렌, 수소 등 특정고압가스를 생산·충전하는 업소), △저장업(대량으로 저장·보관하는 시설), △판매업(산업체, 연구기관, 의료기관 등에 공급하는 업소)으로 구분됩니다. 특정고압가스는 폭발·화재 위험성이 높아 일반 고압가스보다 강화된 안전관리 기준이 적용되며, 시설 요건, 기술 인력, 안전검사 등이 엄격히 요구됩니다. 본 데이터는 지역 내 특정고압가스 유통 현황 파악, 안전관리, 정책 수립, 민원 대응에 활용되며, 행정안전부 공공데이터 개방 표준에 따라 정기적으로 현행화됩니다. 이를 통해 시민, 기업, 연구자가 안전계획 수립, 위험물 취급 연구, 시장 분석 등 다양한 목적으로 활용할 수 있습니다.
