summary_user: 글로벌 혁신 규제자유특구에 참여한 특구사업자를 한 행씩 담은 건별 명부로, 특구명·지정 차수·특구 위치와 사업자명·대표자명·등록 형태·기업규모·주소를 전국 범위로 담는다. 특정 글로벌 혁신 특구에 어떤 기업이 어떤 규모와 등록 형태로 참여하는지 확인하려는 사업자·정책 분석가가 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어서, 다른 기업 데이터와는 특구사업자명이나 주소를 이름·문자열로 맞춰 이어 써야 한다.
description_portal: 글로벌 혁신 규제자유특구 관련 특구명, 차수, 위치, 특구사업자명, 특구사업자 등록형태, 기업규모, 주소 등에 대한 데이터입니다.글로벌 혁신 규제자유특구 사업 관련하여 글로벌 혁신 규제자유특구명과 법령규제(법 조항) 목록, 고시일자에 대한 데이터 입니다.글로벌 혁신 규제자유특구는 AI, 딥테크 등 글로벌 기술 경쟁 심화에 따른 환경 변화에 신속•탄력적 대응을 위해 과감한 규제혁신 전략 추진 필요에 따라 추진된 사업입니다.해당 특구는 ①전면적 네거티브 규제특례가 적용되고 ②혁신기업의 글로벌화•해외진출을 지원하는 보다 고도화된 혁신 클러스터이며,  육성분야는 ①경제적 파급효과가 기대되고, ②역량 있는 다수의 중소기업이 존재하며, ③제도 정비가 미진한 첨단 미래기술 분야를 우선 지원하게 됩니다.
