summary_user: 한국가스공사 10개 지역본부(서울·인천·경기·강원·충청·전북·광주·대구·부산·제주)의 천연가스(LNG) 공급량을 월별로 집계한 표로, 한 행이 한 달이고 지역본부별 공급량이 톤 단위로 열에 들어 있는 전국 범위 자료다. 에너지 분석가나 지역 정책 담당자가 '겨울철 지역본부별 가스 공급량이 해마다 어떻게 변했나'처럼 지역별 계절·연도별 수급 추이를 비교할 때 쓴다. 표준 행정코드 같은 전역 조인 키가 없어서 다른 데이터와는 연월과 지역본부 이름을 시도 이름에 직접 맞춰야 연결되며, 같은 지역×월 형태의 전력·열 사용량 자료와 나란히 놓고 쓰는 경우가 많다.
description_portal: '한국가스공사가 제공하는 월별 지역본부별 천연가스 공급량 데이터는 전국에 편재한 지역본부의 천연가스 수급현황을 파악할 수 있는 자료입니다.각 지역본부의 각 월별 천연가스 공급량을 나타낸 데이터로 연월,서울,인천,경기,강원,충청,전북,광주,대구,부산,제주의 월별 천연가스 공급량 속성정보를 포함하고 있습니다.(단위 : ton)* 제주지역의 경우 2019년 9월부터 데이터가 집계됨한국가스공사의 월별 지역본부별 천연가스(LNG) 공급량을 나타낸 자료이며, 해당 자료의 단위는 톤(ton)입니다. 공공데이터 공개 대상 자료는 2016년도 1월부터 현재까지의 한국가스공사 월별 지역본부별 천연가스(LNG) 공급량(ton)을 포함하고 있습니다. 해당 공공데이터의 자료 업데이트 주기는 분기 단위이며, 매 분기 마지막 월의 다음달에 자료 업데이트를 시행합니다. 공개된 공공데이터의 파일 형식은 csv 파일입니다.'
