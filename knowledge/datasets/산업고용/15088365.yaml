description_portal: 본 자료는 공사 창립연도인 1987년부터 2020년까지의 연간 도시가스 국가 수요실적 및 비중(공사, 직수입사)을 포함한 자료입니다. 단위는 만 톤입니다.한국가스공사 창립연도인 1987년부터 2020년까지의 도시가스 국가 수요실적 및 비중에 관한 시계열 통계자료 입니다.도시가스 수요는 가정용, 상업용, 산업용 등 도시가스 분야의 천연가스 소비량을 나타내며, 국가 에너지 수급 정책 수립의 핵심 지표로 활용됩니다.본 데이터는 도시가스 시장 분석 및 장기 수요 전망을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연도별 공사 공급량, 직수입사 공급량, 총 국가 수요량, 공사 시장점유 비중 등이 포함되며, 단위는 만 톤입니다. 본 데이터를 활용하면 도시가스 수요 장기 추세 분석 및 성장률 산출, 공사 시장점유율 변화 추이 파악, 도시가스 수급 계획 수립, 에너지 정책 연구 및 사업 전략 수립에 기초자료로 활용할 수 있어 천연가스 산업 발전 방향 도출과 에너지 정책 의사결정 지원에 기여할 것으로 기대됩니다.
