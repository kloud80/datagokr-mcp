description_portal: '본 데이터는 1993년부터 에너지절약전문기업(ESCO: Energy Service Company)이 수행하는 에너지 절약 투자사업에 대한 정부의 지원 실적을 통계적으로 제공합니다. ESCO 사업은 에너지 사용자가 노후되거나 비효율적인 설비를 고효율 에너지 설비로 교체하고자 할 때, ESCO 기업이 초기 투자비를 조달하고 시설 설치 및 성과를 보증하며, 절감된 에너지 비용으로 투자비를 회수하는 방식입니다. 이 데이터셋은 정부의 에너지 효율 향상 목표 달성을 위한 ESCO 사업의 지원 현황과 그 성과를 정량적으로 파악하는 데 목적이 있습니다. 이를 통해 정부는 에너지 효율 시장의 활성화 정도를 평가하고, 자금 지원의 효과를 분석하여 향후 에너지 정책 방향을 설정하고 예산을 효율적으로 배분하는 데 중요한 근거 자료로 활용합니다. 또한, ESCO 기업 및 관련 업계는 시장 동향과 정부 지원 규모를 파악하여 사업 전략을 수립하는 데 활용할 수 있습니다.'
