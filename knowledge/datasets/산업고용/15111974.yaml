summary_user: 강원도내 수출을 희망하는 중소기업을 기업·상품 단위로 정리한 파일(xlsx)로, 기업명·사업자번호·매출·임직원 수 같은 기업정보와 수출희망국가·수출실적, 상품명·HS 코드·인증·특허 현황까지 30개 항목을 담는다. 수출 바이어나 지원기관이 '강원도에서 특정 HS 품목을 수출하려는 중소기업은 어디이고 어느 나라를 원하는가'를 찾을 때 쓴다. 실측에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 사업자번호·기업명 매핑이나 HS 코드(6자리) 기준 품목 대조로 이어 쓴다.
description_portal: 강원도내 수출을 희망하는 중소기업의 기업정보, 상품정보, 특허/인증 정보입니다.데이터 항목은 기업명, 사업자 번호, 기업유형, 대표자명, 매출금액(단위 백만원), 주소지, 임직원수, 수출희망국가, 수출실적 여부, 수출실적(일자), 수출실적(국가),  상품명(영문), 모델명, HScode, 상품키워드, 인증현황, 특허현황 등 30개 항목으로 구성되어 있습니다.
