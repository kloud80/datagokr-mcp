summary_user: 수출바우처사업에서 코로나19 대응용으로 등록된 비대면 서비스를 서비스 한 건씩 정리한 목록으로, 수행기관명·서비스명·상세내용·가격·홈페이지·연락처·대상국가·대상언어·대상산업·등록일을 담은 전국 범위의 소규모 CSV 파일(약 22KB)이다. 수출을 준비하는 중소기업이 '특정 국가나 산업을 대상으로 온라인수출·바이어 매칭·원격 상담을 해주는 수행기관이 어디이고 비용은 얼마인가'를 찾을 때 쓰고, 분석가는 코로나19 시기 비대면 수출지원 서비스의 구성을 살펴보는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 수행기관명이나 대상국가·산업 이름을 매핑해서만 연결된다.
description_portal: 「코로나19 전용 비대면 서비스 리스트」는 감염병 확산기에 중소기업과 소상공인을 지원하기 위해 마련된 다양한 비대면 지원 프로그램 정보를 체계적으로 정리한 데이터입니다. 수행기관별 서비스명, 상세내용, 대상국가·언어·산업, 지원유형 및 등록일 등을 포함하고 있으며, 중소기업의 온라인수출, 공동물류, 글로벌 바이어 매칭, 원격 비즈니스 상담, 디지털 전환 지원 등 정책 활용의 기초자료로 활용 가능합니다. 코로나19 대응 정책성과 분석, 비대면 산업 활성화, 국제 협력 현황 파악 등에 유용합니다.
