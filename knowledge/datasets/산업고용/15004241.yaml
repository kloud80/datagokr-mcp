summary_user: 한국중부발전이 보유하거나 출원한 산업재산권을 권리 한 건당 한 행으로 담은 원천 목록으로, 구분·등록번호·등록일자·출원번호·출원일자·존속일자·발명명칭·소유형태가 들어 있다(CSV 약 52KB). 기술이전 담당자나 분석가가 '중부발전이 어떤 발전·친환경 기술 특허를 갖고 있고, 단독 소유인지 공동 소유인지, 언제까지 존속하는지'를 확인하는 데 쓴다. 등록번호(kipo_rgst_no)와 출원번호(kipo_appl_no)를 키로 특허청 특허정보나 다른 발전공기업의 산업재산권 목록과 이어 쓴다.
description_portal: 본 데이터는 한국중부발전이 보유하거나 출원한 산업재산권에 대한 정보를 정리한 자료입니다. 항목은 구분, 등록번호, 등록일자, 출원번호, 출원일자, 존속일자, 발명명칭, 소유형태로 구성되어 있습니다. 산업재산권은 발전 설비 기술, 친환경 운영기술, ICT 시스템 등 기술자산의 보호를 위한 핵심 수단으로, 본 데이터는 기술혁신 활동의 결과물과 이를 제도적으로 관리하는 현황을 파악하는 데 유용합니다. 또한 기술이전 가능성 평가, 지식재산 전략 수립, 기술경쟁력 분석 등에도 활용될 수 있으며, 기관의 기술자산 확보 노력 수준을 판단할 수 있는 근거 자료가 됩니다.
