summary_user: 2016년 10월부터 2017년 10월까지 전국 발전설비 용량을 월별로 원자력·유연탄·무연탄·유류·LNG·양수·기타 연료원별 MW 단위로 집계한 소형 파일(csv, 980 bytes)이다. 에너지 분석가가 해당 기간 동안 석탄·LNG·원자력 등 전원별 설비용량 구성이 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기간(월)과 연료원 이름을 맞춰 연결해야 하며, 발전소 단위 주소·용량이 필요하면 태양광 발전사업 허가 표준데이터 같은 설비 원장을 따로 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 2016년 10월 ~ 2017년 10월 발전설비 현황을 제공합니다.ㅇ 항목 : 원자력,유연탄,무연탄,유류,액화천연가스(LNG),양수,기타*단위 : MW'
