description_portal: 이 데이터는 한국남부발전이 해외에서 수행한 발전소 건설사업 현황을 정리한 자료입니다. 칠레, 요르단, 미국 등 다양한 국가에서 진행된 프로젝트의 명칭, 위치, 설비용량(MW), 착수 및 준공 연도·월, 사업 진행 상태 등을 포함하고 있습니다. 복합화력, 태양광, 풍력 등 다양한 에너지원이 반영되어 있으며, 준공 및 운영 중인 사업과 현재 건설 중인 프로젝트 현황을 함께 제공하고 있습니다. 이를 통해 해외 에너지 인프라 구축 현황을 한눈에 파악할 수 있으며, 국제 에너지 산업 동향 분석, 해외 발전사업 전략 수립, 신재생에너지 확산 정책 연구 등 다양한 분야에서 기초 자료로 활용할 수 있습니다.
