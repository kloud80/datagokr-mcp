summary_user: 충청북도 단양군에 지정된 담배소매인 업소를 한 곳당 한 행으로 담은 파일로, 포털 설명 기준 169곳의 소매인구분·업소명·지번주소·전화번호·지정일자를 담는다. 단양군에서 담배를 파는 가게가 어디에 몇 곳 있고 언제 지정됐는지 알고 싶은 주민·예비 소매인 사업자나 지역 담배 판매 현황을 보는 연구자가 쓴다. 전역 조인 키(사업자번호·법정동 코드 등)는 없어 다른 데이터와는 업소명·지번주소를 맞춰 잇거나, 같은 군의 다른 업종 인허가(LOCALDATA) 자료와 주소 기준으로 대조해 쓴다.
