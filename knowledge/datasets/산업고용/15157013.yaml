summary_user: 한국중부발전 발전소의 호기별 질소산화물·황산화물·먼지 배출농도 평균을 년월·발전소·호기 기준으로 조회해 담는 API로, 원천 측정값이 아니라 평균값 형태의 집계다. 지역 주민이나 환경 분석가가 '특정 중부발전 발전소 몇 호기의 이번 달 질소산화물 배출농도가 지난달보다 높아졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소명·호기명 이름 매핑으로만 다른 데이터와 잇고, 발전소 단위 측정값이라 주변 대기질·기상 데이터와 교차 분석하는 데 쓴다.
