summary_user: 한국가스안전공사가 보유한 액화석유가스(LPG) 분야 KGS Code(가스안전 시설·검사·기술 상세기준) 목록을 코드 한 건당 한 행으로 담으며, 분류·코드번호·코드명·최신버전·내용쪽수로 구성된 전국 단위 비공간 현황표다(CSV 약 6KB). LPG 충전소·저장시설 사업자나 설계·검사 실무자가 "LPG 시설에 적용되는 KGS 코드가 무엇이고 최신 버전은 몇 번인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 코드번호·코드명 문자열 매핑으로만 연결하며, 같은 기관의 고압가스법·도시가스법 KGS Code 현황 등과 코드번호로 나란히 비교하는 정도로 이어 쓴다.
description_portal: 'KGS Code는 정부에서 승인한 가스안전분야 시설,검사,기술 상세기준으로, 한국가스안전공사에서 보유하고 있는 액화석유가스 코드 현황 데이터입니다.해당 데이터는 분류, 코드번호, 코드명, 최신버전, 내용쪽수로 구성되어 있습니다.액화석유가스 관련 KGS코드 최신정보를 쉽게 확인 할 수 있습니다.※  KGS Code : 가스 관계 법령에서 정한 시설·기술·검사 등의 기술적인 사항을 상세기준으로 정하여 코드화한 것으로, 가스기술 기준위원회에서 심의·의결하고 산업통상자원부에서 승인한 가스안전 분야의 기술기준입니다.※  해당 데이터는 연간 주기로 업데이트 됩니다.※  2025년 데이터기준일 기준 현황입니다.-  데이터기준일 : 2025년 9월 15일'
