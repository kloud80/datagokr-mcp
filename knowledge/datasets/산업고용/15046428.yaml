summary_user: 서울시에 설립·신고된 노동조합과 관련 단체를 조합 단위로 한 건씩 담은 원장으로, 노조명·사업장명·상급 소속단체명·주소와 함께 인허가번호(ESBMNT_NO)와 민원구분이 들어 있다. 노동정책 담당자나 분석가가 '어느 자치구에 어떤 사업장 노조가 몰려 있고, 어느 상급단체에 속해 있는가'를 확인하거나 자치구별 노조 분포를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치단체코드·자치구명이나 사업장명·노조명 같은 이름 매핑으로만 이어 쓰고, 전국노동조합표준데이터와도 이 방식으로 맞춰 본다.
description_portal: 서울시 노동조합 현황 데이터는 서울시에 설립·신고된 노동조합 및 관련 단체들의 기본 정보를 제공하는 자료입니다. 자치단체코드를 통해 행정구역별로 노동조합을 구분할 수 있으며, 인허가번호와 민원구분은 각 노동조합의 설립·인가 이력과 행정처리 유형을 파악하는 데 활용됩니다. 노동조합단체명과 사업장명, 소속단체명은 어느 사업장에 어떤 이름의 노동조합이 설치되어 있고, 상급단체나 연맹 등과 어떤 관계를 맺고 있는지를 보여줍니다. 노동조합주소와 자치구명 정보는 노조의 실제 위치와 관할 지역을 확인할 수 있어 자치구별 노동조합 분포 분석, 지역 노동정책 수립, 현장 상담 및 노사관계 지원 업무에 활용하기 좋습니다. 이 데이터는 지역별 노동조합 조직률 파악, 업종·사업장 유형별 노조 현황 분석, 노동권 보호 및 노사협력 정책의 기초 자료로 폭넓게 활용될 수 있는 정보입니다.
