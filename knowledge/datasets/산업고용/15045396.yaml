summary_user: 제주시 관내 조경공사업체를 업체 한 곳당 한 행으로 정리한 목록으로, 상호·소재지(주소)·전화번호·데이터기준일자를 담은 작은 CSV 파일(약 3KB)이다. 발주처나 주민이 '제주시 우리 읍·면·동 근처에 조경공사를 맡길 업체가 어디 있고 연락처가 무엇인가'를 찾을 때나, 담당자가 지역별 업체 분포를 파악할 때 쓴다. 사업자번호나 표준 코드 같은 공통 조인 키가 없어서, 다른 인허가(LOCALDATA) 자료나 업체 데이터와는 상호·주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
