description_portal: 한국산업기술진흥원의 기술은행(NTB)에 수집된 기술정보(기술번호)를 활용하여, 사용자는 각 기술에 대한 다수의 특허 정보를 조회할 수 있는 기술은행 등록기술 특허 조회 서비스 입니다. 이 서비스는 특허출원번호, 출원일, 발명명칭, 발명자 등의 정보를 제공함으로써, 기술의 연구 및 개발, 상용화 가능성 검토를 위한 기초 자료를 제공합니다. 또한, 기술 데이터를 기반으로 기업이나 연구자들은 특허 동향을 분석하여 경쟁력을 높이고 새로운 기술 아이디어나 혁신적인 프로젝트에 활용할 수 있는 귀중한 자료를 얻을 수 있습니다. 이 서비스는 여러 오퍼레이션을 통해 기능을 지원합니다. 사용자는 특허에 대한 상세한 정보와 그 외의 관련 데이터를 얻을 수 있으며 이를 통해 기술 상용화에 필요한 다양한 인사이트를 확보할 수 있습니다.
