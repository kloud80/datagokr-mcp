summary_user: 한국수력원자력이 추진·운영하는 태양광·풍력·소수력 등 재생에너지 설비를 사업 단위로 정리한 현황 파일로, 설비 구분·사업명·설비용량·준공연도·위치를 담으며 원본 CSV는 약 3KB(3,344바이트) 규모의 소량 목록이다. 한수원이 어디에 어떤 종류의 재생에너지 설비를 얼마만큼 지었는지, 사업이 언제 준공됐는지를 확인하려는 분석가나 국민이 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(주소)나 사업명을 이름으로 맞춰 잇거나, 전국 태양광 발전사업 허가 표준데이터 같은 발전소 원장과 수작업으로 대조해 쓴다.
