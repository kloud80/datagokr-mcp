summary_user: 내일채움공제에 가입한 중견기업별로 사업자번호, 업체명, 가입인원을 담은 전국 단위 현황 파일이며, 포털 설명상 2026년 2분기 기준 한 시점의 스냅숏이다(파일 크기 967바이트로 소규모). 중견기업 인사·노무 담당자나 정책 분석가가 '어느 중견기업이 내일채움공제로 몇 명의 재직자 장기재직을 지원하고 있는가'를 확인하는 데 쓴다. 사업자번호(bizno)를 키로 벤처·이노비즈 확인서 같은 기업 확인·인증 원장이나 다른 기업 단위 데이터와 연결한다.
description_portal: 중소벤처기업 재직 근로자의 장기재직과 자산형성 지원을 위하여 중소벤처기업진흥공단에서 관리하는 성과보상공제사업 중 내일채움공제에 가입한 중견기업별 내일채움공제 가입자수로 현황조사 한 데이터입니다.해당 데이터 기준일의 내일채움공제 가입 중견기업 현황으로 해당 중견기업의 사업자번호, 업체명, 내일채움공제 가입인원에 대한 정보입니다.중견기업 정보는 중견기업 정보마당의 중견기업 확인서를 바탕으로 하였습니다.* 분기별 데이터 중 등록예정일 기준 최신 분기 데이터 입니다.** 2026년 2분기 기준 데이터입니다.
