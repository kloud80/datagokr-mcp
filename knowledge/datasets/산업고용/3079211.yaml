summary_user: 익산시에 등록된 가스사업자(도시가스·LPG 등 제조·공급·판매 업체)를 사업체 한 곳당 한 행으로 담은 현황 파일로, 상호·사업의 종류·사업소 소재지·대표자명·전화번호가 들어 있다. 시민이나 안전관리 담당자가 '익산시 안에서 LPG를 판매하는 업체는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 관내 가스 유통 업체 분포를 파악하는 데 쓴다. 실측 컬럼에 사업자번호나 인허가번호 같은 전역 조인 키가 없어, 다른 데이터와는 상호·주소 문자열 매칭으로만 이어 쓰며 LOCALDATA 에너지 업종 인허가 원장과 대조하는 보조 자료로 쓴다.
limits: 사업자번호나 인허가번호 같은 공통 키가 없어 다른 시군 자료나 전국 원장과 정확히 결합하기 어렵고, 상호·주소 매칭에 의존해야 한다. 범위는 익산시 한 곳으로 한정되며, 파일 크기가 약 10KB로 작은 단일 시군 현황 목록이다.
