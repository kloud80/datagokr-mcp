description_portal: 이 데이터는 지역 내 고압가스류의 생산 및 유통을 담당하는 가스사업자의 현황을 정리한 자료입니다. 사업자 상호명, 사업장 주소, 사업자 구분(고압가스 등), 전화번호 등의 항목으로 구성되어 있으며, 고압가스를 취급하는 일반 판매업체가 주로 포함되어 있습니다. 대부분 단원구 및 상록구에 분포되어 있으며, 도로명 주소 기준으로 정비되어 있어 위치 기반 행정이나 안전점검 계획 수립에 활용 가능합니다. 고압가스는 산업용·의료용·생활용 등 다양한 용도로 사용되며, 이에 따라 안전관리 체계 수립이 필수적입니다. 본 자료는 가스안전관리계획 수립, 유해화학물질 운송 및 취급시설 실태조사, 에너지 유통망 분석, 재난 대응 체계 설계 등 다양한 행정·산업 분야에서 활용하실 수 있습니다.
