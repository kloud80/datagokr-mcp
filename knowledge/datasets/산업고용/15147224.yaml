summary_user: 서울시 자치구별 상주인구를 분기 단위로 집계한 데이터로, 총인구와 남녀 인구, 10대부터 60대 이상까지 연령대별(성별 교차 포함) 인구, 가구 수와 아파트·비아파트 가구 수를 담는다. 소상공인이나 상권 분석가가 '이 자치구의 주 고객층이 될 30·40대 거주 인구와 아파트 가구 비중은 얼마이고 분기마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 자치구 코드(SIGNGU_CD)·자치구명과 기준 분기 코드를 이름·코드 매핑해 같은 서울시 상권분석서비스의 다른 자치구 단위 자료나 상가업소 원장과 이어 쓴다.
limits: 자치구 단위 집계라 행정동·상권·상가 단위의 세부 분석에는 쓸 수 없고, 다른 데이터와는 전역 조인 키 없이 자치구 이름·코드 매핑으로만 연결된다. 호출하려면 포털 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 경로 파라미터로 넣어야 한다.
