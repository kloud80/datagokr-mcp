summary_user: 신규 등록된 웹하드(특수부가통신) 사업자를 사업자 1건 단위로 담은 소규모 파일(csv 약 4.8KB)로, 사업자명·사업자등록번호·사업종별·등록일자·관리관서(전파관리소)와 사이트명·PC/모바일 주소를 최대 2개까지 담는다. 분석가나 저작권·콘텐츠 관련 실무자가 "최근 어떤 웹하드 사업자가 언제 등록했고 어느 전파관리소가 관리하나"를 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 업종 인허가·기업 현황 데이터와 사업자 단위로 이어 쓴다.
description_portal: 해당 데이터는 신규 등록된 웹하드 서비스 제공 통신사업자들의 정보를 수록한 현황 자료입니다. 각 기업의 사업자명, 사업자등록번호, 사업종별, 사이트명, 등록일자, 관리관서 등의 항목으로 구성되어 있으며, 이를 통해 최근 시장에 진입한 사업자들의 규모와 분포를 파악할 수 있습니다. 등록일자를 기준으로 등록 추이 및 시점 분석이 가능하고, 전파관리소별 관리 건수를 통해 지역별 사업자 집중도도 확인할 수 있습니다. 또한, 기업 유형이나 서비스 개시 시점 등의 부가 정보와 함께 분석하면, 통신서비스 산업의 변화 방향, 신규 사업자 특성 및 시장 진입 동향을 다각도로 해석할 수 있습니다.
