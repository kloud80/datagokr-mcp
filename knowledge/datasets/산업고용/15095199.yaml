description_portal: 이 CSV 데이터는 대전광역시 서구 지역의 도시가스 공급량을 연도별·용도별로 구분하여 제공하는 에너지 행정통계 자료입니다. 각 행은 특정 연도의 도시가스 사용 현황을 나타내며, ‘연별’은 기준 시점을 의미합니다. ‘가정용’과 ‘취사용’ 항목은 주택 내 난방과 조리 등 일상생활에서 사용된 도시가스의 소비량을, ‘영업용’은 음식점, 소매업 등 상업시설의 가스 사용량을 반영합니다. ‘업무용’은 사무실, 공공기관 등 비주거 시설에서의 소비량을, ‘산업용’은 제조업 등 생산 활동에 투입된 에너지 사용량을 의미합니다. ‘수송용’은 차량 연료 등 이동수단에 사용된 도시가스 공급량을 포함하며, ‘기타’ 항목은 분류되지 않은 특수용도나 기타 비정형적 소비를 나타냅니다. 이 데이터는 지역 내 에너지 소비 구조와 산업별 의존도를 객관적으로 파악할 수 있는 기반 자료로서, 에너지 수급 계획 수립, 탄소중립 정책 평가, 연도별 사용패턴 분석, 효율적 도시가스 배분 정책 설계 등에 활용될 수 있습니다.
