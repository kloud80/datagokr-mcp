summary_user: 성동구 안에서 유료로 구인·구직을 알선하는 직업소개소의 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·소재지 주소·전화번호·좌표가 들어 있다. 구직자나 구인 사업자가 "이 직업소개소가 정식으로 인허가를 받았고 지금도 영업 중인가"를 확인하거나, 분석가가 성동구 유료직업소개소의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 구의 같은 인허가 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 체계의 코드로 묶고, 그 밖의 데이터와는 업소명·주소를 직접 맞춰 이어야 한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 유료로 구인 또는 구직의 신청을 받아 구인자와 구직자 간의 고용계약 성립을 알선하는 직업소개소 및 관련 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 유료직업알선은 취업 시장 내 다양한 수요와 공급을 연결하는 역할을 하며, 합법적이고 공정한 인력 유통 질서 유지와 구직자 권익 보호를 위해 관련 업소의 행정현황 및 관리 이력이 중요하게 다뤄집니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 각 업소의 인허가 내역, 영업 개시와 종료, 행정변동 상황을 투명하게 확인할 수 있습니다. 성동구청 등 관할 행정기관에서 정기적으로 점검과 자료 갱신을 실시하여 데이터의 신뢰성 및 최신성이 보장됩니다. 본 데이터는 직업소개업소 관리, 시장 동향 분석, 고용정책 수립, 인력 중개 서비스 품질 향상, 관련 업계 연구 및 구인·구직자 정보 제공 등 다양한 분야에서 광범위하게 활용될 수 있습니다. 데이터는 정기적으로 최신화됩니다.
