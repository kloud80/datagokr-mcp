description_portal: 이 데이터는 2016년 기준 서울시 각 행정동별 사업체 현황과 종사자 수, 여성 종사자 수를 업종별로 세분화해 제공한 자료입니다. 행정구역은 ‘동별(1)~동별(3)’으로 구·동 단위로 구분되며, 업종은 농업·임업·어업부터 광업, 제조업, 건설업, 도소매업, 숙박·음식점업, 금융·보험업, 교육서비스업, 보건·사회복지 서비스업 등 다양한 산업 부문으로 분류됩니다. 각 업종별 여성 종사자 수가 세부적으로 기록되어 있어 성별 고용 구조 분석에 유용하며, 동별 총 사업체 수, 총 종사자 수, 업종별 분포를 통해 지역 산업 특성을 파악할 수 있습니다. 이를 활용하면 지역 경제 구조, 여성 고용 비중, 산업별 인력 분포를 분석하여 정책 수립, 상권 분석, 일자리 지원 전략 마련 등에 적용할 수 있습니다.
