description_portal: 본 자료는 청년일자리올인원지원서비스의 일환으로, 워크넷에서 운영하는 구직자 취업역량 강화 프로그램에 대한 소개와 함께 세부 일정 정보 제공을 위한 기초 콘텐츠입니다. 해당 프로그램들은 청년 구직자의 자기이해 증진, 진로탐색, 취업 실전 준비를 돕기 위해 구성된 체계적인 교육과정입니다.주요 프로그램으로는 단기집단상담 프로그램, 청년취업역량 프로그램, 성취 프로그램, 취업특강 프로그램, 그리고 취업역량향상 프로그램(행복오름)이 있으며, 각각 심리적 안정, 진로설정, 실전 취업 역량 강화를 목표로 합니다.특히 행복오름 프로그램은 실전 모의면접, 이력서 작성, 커뮤니케이션 스킬 강화 등을 포함하며, 정기적으로 일정 정보가 공지되고 참여 신청이 가능합니다. 각 프로그램은 워크넷 누리집을 통해 상세 일정 확인 및 지역별 참여 신청이 가능합니다.
