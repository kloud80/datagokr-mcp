description_portal: 본 데이터는 「에너지이용합리화법」에 따라 연간 에너지 사용량 2,000toe 이상을 소비하여 신고 의무가 있는 에너지다소비사업자들의 석탄 사용 현황 정보를 체계적으로 제공합니다. 전국 광역시별로 구분된 데이터를 통해 다소비사업자의 연도별, 부문별 석탄 소비량을 명확하게 파악할 수 있으며, 이를 바탕으로 산업 및 상업 부문 등 주요 에너지 소비처의 석탄 사용 특성과 소비 패턴을 심층 분석할 수 있습니다. 본 데이터는 정부 및 지방자치단체가 지역 및 부문별 에너지 사용 특성을 분석하고, 석탄 사용 저감 정책과 기후대응 전략을 수립할 때 중요한 기초자료로 활용할 수 있습니다. 또한 기업과 연구기관은 에너지 소비 최적화 방안, 석탄 대체 에너지 전환 연구 및 온실가스 저감 전략 마련에 본 데이터를 활용할 수 있습니다.
