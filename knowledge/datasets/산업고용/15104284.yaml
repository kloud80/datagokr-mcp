description_portal: "본 데이터는 지역 내 우수기업 발굴 및 소개를 통해 지역기업에 대한 인식 개선을 돕고, 기업과 청년 간의 취업 연계를 지원하는 희망이음 프로젝트에 참여한 전국 18개 시도의 중소기업 및 중견기업 정보를 포함하고 있습니다. 이 데이터는 지역경제의 활성화 및 청년층의 고용 기회 증대에 기여하기 위한 자료로 활용될 수 있습니다. 예를 들어, 지방자치단체나 정부 기관에서는 이 정보를 바탕으로 지역 내 기업 지원 프로그램을 개발하거나, 구직자에게 맞춤형 일자리 정보를 제공하는 데 활용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 이 데이터는 '번호', '해당년도', '지역', '기업명', '주소', '기업규모', '업종' 등 총 7개의 컬럼으로 구성되어 있으며, 각 컬럼의 특징은 다음과 같습니다.'번호'(숫자형) : 기업 정보를 식별하는 고유 번호'해당년도'(숫자형) : 데이터 기준 연도'지역'(문자형) : 기업의 주소 또는 소재지가 위치한 지역'기업명'(문자형) : 기업의 공식 명칭'주소'(문자형) : 기업의 등록 주소'기업규모'(문자형) : 기업의 규모(중소기업, 중견기업 등)'업종'(문자형) : 기업의 주된 업종"
