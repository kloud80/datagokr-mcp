description_portal: '한국가스안전공사에서 관리하는 전국 기준 LPG 소형저장탱크 설치현황을 지역별, 용량별로 구분하여 정리한 데이터 항목을 제공합니다.전국의 시,도 지역별 기준으로 탱크 용량(최소 0톤 ~ 최대 3톤 미만)별로 구분하여 설치 현황 수가 반영되어 있습니다.가스 안전관리 및 사고예방을 위한 데이터 분석, 정책 수립 등에 활용할 수 있습니다.- LP가스에 대한 소형 저장탱크 입니다.- 제공 신청 요청에 따라 제공된 데이터로 추후 현황 정보 업데이트 예정입니다.- 해당 데이터는 공사가 안전관리 업무 수행을 목적으로 수집, 관리하고 있는 데이터이며 타 유관기관 데이터와 일부 상이할 수 있습니다.- 데이터기준일 : 2025년 9월 19일'
