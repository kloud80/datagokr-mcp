description_portal: '중진공의 임원 현황 데이터는 중진공 재직 임원(이사장, 감사, 부이사장, 상임이사, 비상임이사 등 임원)의 정보(직위, 성명, 직책, 성별, 임기, 주요경력, 선임절차 등)를 포함하고 있습니다. 이 데이터는 조직구조, 임원 직위, 재직일, 이름 등 주요 정보를 제공합니다. 데이터 사용 시 하기 내용에 유의해주시기 바랍니다.- 공개된 임원 정보는 일반적인 정보에 한정되며, 개인 정보 보호를 위한 법적 규제에 따라 민감한 사항은 제외될 수 있습니다.ㅇ 중진공 : 임원, 이사장, 부이사장, 이사 및 임직원이 중소기업의 진흥을 위한 사업을 효율적으로 추진함으로써 국민경제발전에 기여함을 목적으로 한다.ㅇ 이사장 : 이사장은 중진공의 업무를 대표하고 중진공의 업무를 총괄한다.ㅇ 감사 : 감사는 중진공이 수행하는 업무 전반과 관계법령 등에서 정하는 사항에 대한 감사를 총괄한다.ㅇ 부이사장 : 부이사장은 이사장을 보좌하여 기관경영 전반을 총괄한다. 임원 간의 협의, 조정을 수행한다.ㅇ 이사 : 각 소관부서별 운영에 관한 직무를 관장한다.ㅇ 직책 : 이사장, 부이사장 등 기관에서 사용하고 있는 기관의 담당 업무와 관련한 명칭ㅇ 주요경력 : 임명 추천, 심사 시 주요하게 고려된 경력 위주로 간략히 5줄 이내로 설명ㅇ 선임절차 : 정관, 법령 등에 따른 임원 선임절차를 간명하게 표기하며, 정관 변경 등에 따라 임원의 선임절차 및 근거규정이 변경된 경우, 현행 절차 및 규정으로 수정하여 설명'
