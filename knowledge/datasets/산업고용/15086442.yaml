summary_user: NCS 대·중·소·세분류와 학습모듈번호별로 학습모듈명과 학습모듈 내용을 한 건씩 담는 코드 마스터 성격의 API로, 검증 호출에서는 전국·비공간 범위로 10행을 받았다. 훈련기관이나 교육 담당자가 '특정 NCS 세분류 직무를 가르치려면 어떤 학습모듈이 있고 무슨 내용을 다루는가'를 확인하는 데 쓴다. NCS 대·중·소·세분류 코드(ncsSubdCd 등)가 직업분류 조인 키이므로, 같은 NCS 코드를 쓰는 직업훈련 과정·자격·채용 데이터와 이어 쓴다.
limits: 실측 최신 행 날짜가 2016-12-01로 나왔지만 검증 호출에서 10행만 받은 결과이므로 전체 데이터가 오래됐다고 단정하지 말고 호출 조건을 넓혀 확인해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
