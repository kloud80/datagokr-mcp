description_portal: '2030년까지의 유효일수로 도시가스 산업용 수요의 일별 유효일수 데이터입니다. 공휴일 등 특정일을 반영한 유효일수를 나타내며, 도시가스 수요예측 등에 활용할 수 있습니다.* 유효일수 : 가스수요 발생기준으로 재정의한 월의 일수산업용 도시가스 수요의 일별 유효일수에 관한 수요예측 기초자료 입니다. 유효일수는 산업체의 가스 수요에 영향을 미치는 실질적 가동일수를 나타내는 지표로서, 휴일 및 공휴일의 수요 감소 효과를 반영하여 공급 계획의 정확도를 높이는 핵심 변수입니다. 본 데이터는 2030년까지의 유효일수를 포함하며, 산업용 가스 중장기 수요 예측을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 순번, 연월일, 유효일수가 포함되며, 공휴일, 대체휴일 등을 고려한 보정값을 나타냅니다.본 데이터를 활용하면 산업용 가스 수요 예측 모델 개발 및 고도화, 장기 공급 계획 및 설비 투자 계획 수립, 산업 에너지 정책 의사결정에 기초자료로 활용할 수 있어 산업용 가스 공급 안정성 향상과 국가 에너지 수급 계획 정교화에 기여할 것으로 기대됩니다.'
