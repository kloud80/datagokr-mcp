summary_user: 서울시 자치구별 분기 단위 길단위 유동인구 집계로, 기준 분기(STDR_YYQU_CD)마다 구별 총 유동인구와 성별·연령대(10대~60대 이상)·시간대(6구간)·요일별 유동인구 수를 담는다. 창업 준비자나 상권 분석가가 '우리 구는 어느 요일·시간대에 어떤 연령층 유동인구가 많은가'를 다른 구와 비교하거나 분기별 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 자치구 코드·이름(SIGNGU_CD, SIGNGU_CD_NM)과 기준 분기를 맞춰 같은 서울시 상권분석서비스의 다른 자치구 단위 데이터나 소상공인 상가업소 원장의 구 단위 집계와 이어 쓴다.
description_portal: 이 데이터셋은 서울시 자치구 단위의 유동인구 정보를 제공하며, 분기별로 갱신됩니다. 각 구별 총 유동인구 수와 성별, 연령대별, 시간대별, 요일별 인구 이동 현황을 포함하고 있어 특정 지역의 상권 특성 및 생활 패턴을 파악할 수 있습니다. 이를 활용하면 특정 시간대의 유동 인구 집중 현상, 연령별·성별 주요 이용 집단 등을 분석할 수 있으며, 상권 활성화 전략, 도시계획, 교통정책 수립, 지역경제 연구 등에 활용이 가능합니다. 또한 실시간이 아닌 분기별 통계 데이터를 제공하므로, 장기적인 변화 추이 분석에도 유리한 자료입니다.
