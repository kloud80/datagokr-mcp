summary_user: 서울 금천구의 동물판매업 인허가 사업장을 한 곳씩 담은 원장으로, 인허가일자·영업상태(영업/폐업 등)·폐업·휴업 일자·사업장명·지번/도로명 주소·전화번호·좌표를 담는다. 반려동물 판매점 창업을 검토하는 사업자가 '금천구에 현재 영업 중인 동물판매업소가 어디에 몇 곳 있나'를 확인하거나, 분석가가 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 좌표(XCRD·YCRD) 기반 공간 결합, 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 다른 지자체 LOCALDATA 동물판매업 데이터와 같은 구조로 합쳐 보는 데 쓴다.
description_portal: 동물판매업에 대한 인허가 현황과 사업장 정보를 체계적으로 제공하는 데이터로, 인허가일자, 영업상태, 사업장명, 소재지, 전화번호 등 주요 항목과 함께 축산업무 구분, 축산물가공업 구분, 총인원 등 세부 정보가 포함되어 있습니다. 또한 위치 좌표 정보가 제공되어 지도 기반 분석이나 통계 자료 작성에도 활용할 수 있습니다. 해당 자료는 동물판매업 관련 정책 수립, 지역 내 동물산업 동향 분석, 신규 창업 계획, 시장 규모 및 경쟁 현황 파악 등에 유용하며, 나아가 반려동물 산업 발전 전략 및 관련 규제 개선 논의에도 기초 자료로 기여할 수 있습니다.
