summary_user: 한국수력원자력이 체결한 REC(신재생에너지공급인증서) 선정계약을 연도·반기별로 묶어 업체 수, 체결 물량(MW), 평균 단가(원/kWh)를 담은 전국 단위 집계 파일(약 427바이트 CSV)이다. 태양광 등 신재생 발전사업자나 분석가가 "한수원 REC 선정계약의 평균 단가와 물량이 반기마다 어떻게 변했나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 발전공기업의 REC 계약 현황이나 REC 현물시장 가격과 함께 볼 때는 연도·반기를 기준으로 직접 맞춰 나란히 비교한다.
description_portal: 한국수력원자력㈜이 제공하는 REC 선정계약 현황 공개 데이터는 신재생에너지공급인증서(REC, Renewable Energy Certificate)와 관련된 주요 정보를 체계적으로 정리한 자료입니다. REC는 신재생에너지 전력을 1MWh 생산할 때 발급되는 인증서로, 신재생에너지 발전사업자는 「신재생에너지공급의무화(RPS) 제도」에 따라 이를 필요로 하는 발전공기업 등 다른 발전사업자에게 판매할 수 있습니다. 이 데이터는 REC 선정계약의 연도별·반기별 현황을 담고 있으며, 업체 수, 체결 물량, 평균 단가 등의 항목으로 구성되어 있어 시장 동향을 구체적으로 파악할 수 있도록 합니다. 이를 통해 신재생에너지 인증서 거래 규모와 가격 변동 추이를 확인할 수 있으며, 정책 입안자나 연구자는 물론 발전사업자들에게도 중요한 참고 자료로 활용될 수 있습니다. 특히 에너지 전환과 탄소중립이 강조되는 현 시점에서, REC 시장의 흐름을 이해하는 것은 국가 에너지 정책의 효과성과 신재생에너지 보급 확대 전략을 검토하는 데 필수적입니다. 따라서 이 데이터는 에너지 산업 종사자뿐 아니라 학계, 연구기관, 투자자 등 다양한 이해관계자들에게도 가치 있는 자료로 기능합니다.
