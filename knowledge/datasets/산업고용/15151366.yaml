description_portal: '"한국지역난방공사의 정보화 사업 추진 현황을 체계적으로 관리하기 위한 데이터로, 프로젝트별 진행 상태, 예산, 사업기간, 수행업체 등을 포함하여 정보화 사업의 계획·집행·성과를 종합적으로 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 현재상태: 프로젝트의 진행 단계(예시: 수행, 종료)■ 프로젝트명: 추진 중인 정보화 사업 또는 시스템 구축 과제명(예시: 한난형 생성형 AI 구축 용역)■ 프로젝트유형: 사업의 구분 또는 관리 목적(예시: IT프로젝트 > 구축, IT프로젝트 > 운영유지보수)■ 관리부서: 프로젝트를 총괄 관리하는 부서명(예시: 정보시스템처 정보기획부)■ 사업시작일: 프로젝트가 착수된 날짜(예시: 2025-05-29)■ 사업종료일: 사업이 완료 또는 종료된 날짜(예시: 2025-11-28)■ 사업금액: 프로젝트 예산 또는 계약 금액(예시: 635,690,000)■ 사업자명: 해당 사업을 수행하는 외부 용역사 또는 참여 기업명(예시: (주)그리드원, 주식회사 인사이드정보)3. 활용 예제:■ 연도별 정보화 사업 추진 현황 분석을 통해 예산 집행 효율성 및 사업성과 평가에 활용■ 사업유형별·사업자별 계약 추세 분석을 통한 공급망 관리 및 협력업체 선정 기준 마련■ 정보시스템 구축 및 유지보수 프로젝트의 기간·비용·성과를 종합적으로 관리하여 IT 거버넌스 및 전략적 의사결정 지원"'
