description_portal: 경기주택도시공사 홈페이지에 등록 신청된 경기도 내 여성대표 기업의 현황에 대한 데이터로써 기업명, 업종, 주요 생산품, 업체 주소, 연락처 등의 정보를 포함하고 있습니다. 본 자료는 공공조달 및 판로 개척 지원을 목적으로 활용될 수 있으며, 여성기업의 경제활동 참여를 촉진하고, 공공기관의 우선구매를 지원하기 위한 정책자료로 사용될 수 있으며, 해당 데이터를 통해 여성기업에 대한 기초 현황을 파악할 수 있습니다. 또한 기업규모, 업종다양성, 지역분포현황 등을 분석하여 중소기업 지원정책 수립에 활용이 가능하며, 여성기업 지원 사업의 효과성과 성과관리에도 활용도가 높은 데이터입니다.
