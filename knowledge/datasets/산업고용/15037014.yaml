summary_user: 경기주택도시공사 홈페이지에 등록 신청된 여성대표 기업을 업체 한 곳당 한 행으로 담은 파일(csv, 약 8KB)로, 업종·주생산품·여성기업 확인서 발급번호와 유효기간·종업원 및 여성고용비율·주소와 좌표·연락처를 포함한다. 공공기관 구매 담당자가 '우선구매 대상인 여성기업 중 이 품목을 생산하고 확인서가 아직 유효한 업체는 어디인가'를 찾거나, 분석가가 여성기업의 업종·지역 분포를 파악하는 데 쓴다. 사업자등록번호(bizno)를 키로 벤처·이노비즈·창업기업 확인 등 다른 기업 인증 원장이나 기업 현황 데이터와 이어 쓰고, 위도·경도로 지도 기반 분석에 붙인다.
limits: 이 공사 홈페이지에 등록 신청한 업체만 담겨 있어 전체 여성기업 명부로 쓸 수 없다. 확인서의 유효기간 종료일이 지난 업체가 섞여 있을 수 있으니, 현재 유효 여부를 보려면 유효기간을 직접 걸러야 한다. 포털 설명은 경기도 내 기업이라고 하지만 범위 실측은 전국으로 나와 있으므로, 지역 범위는 주소로 확인한다.
