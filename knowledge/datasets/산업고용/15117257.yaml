description_portal: '본 신재생연료 구매계획 데이터는 한국중부발전이 신재생에너지 확대 정책의 일환으로 수립한 신재생연료 구매계획을 연도별로 정리한 자료입니다. 항목은 연도, 연료(예: 바이오매스, 폐기물 RDF 등), 구매계획량(단위: 톤), 적용 대상 발전소로 구성되어 있으며, 발전소별로 필요한 연료량을 사전에 수립한 계획 수치를 포함하고 있습니다. 이 데이터는 신재생 연료 수급 전략, 연료 다양성 확보 현황, 탄소중립 목표 이행 수준 등을 파악하는 데 유용하며, 중장기 재생에너지 운영계획 수립, 연료 공급사와의 계약 전략, 정부 RPS(신재생에너지 공급의무화) 이행 평가에도 활용될 수 있습니다.'
