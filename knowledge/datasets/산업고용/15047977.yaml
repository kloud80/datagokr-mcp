summary_user: 광주광역시 관내 자동차관리법에 따라 등록된 소형자동차종합정비업 사업자의 등록현황을 사업자 1곳당 1행으로 담은 파일로, 2025년 12월 31일 기준 총 55개소의 정비형태·상호·소재지 주소를 담는다. 시민이 집이나 직장 근처의 소형 정비업소를 찾거나, 분석가가 광주 자치구별 소형정비업소 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 같은 기관이 별도로 올린 종합·전문정비업 현황과는 상호·주소 기준으로 합치고, 지도나 행정구역 자료와는 주소를 지오코딩해 잇는다.
description_portal: '광주광역시 관내 자동차"소형"정비업 현황입니다.자동차관리법에 따라 등록된 자동차관리사업자 중 소형자동차종합정비업의 등록현황 자료이며, 각 사업자별 정비형태, 상호명, 사업자주소(소재지 도로명 또는 구주소) 항목을 제공합니다.* 정비형태 구분 : 종합,소형,전문정비업(각 정비형태 구분별로 공공데이터가 별도 등록되어 있습니다.)* 등록기준일 : 2025년 12월 31일* 등록사업자 수 : 총 55개소* 자동차관리사업 등록은 등록소재지 관할 자치구청에서 등록/변경 등이 가능함을 알려드립니다.'
