description_portal: '인천광역시가 제공하는 산업대분류별 사업체 총괄 현황 공공데이터는 한국표준산업분류(KSIC) 상의 대분류별로 지역 사업체의 법적 형태 및 규모를 집계한 종합 통계 자료입니다. 이 데이터는 인천시의 전반적인 산업 구조, 법인/개인 사업체의 분포, 고용 형태 등을 파악하여 지역 경제 구조 분석, 산업 정책 수립, 투자 유치 전략 등의 기초 자료로 활용됩니다.<주요 구성 항목>-산업대분류: 농림어업, 제조업, 건설업, 도매 및 소매업, 숙박 및 음식점업, 교육 서비스업 등 총 21개 산업 대분류별로 구분됩니다.-법적 형태별 구분: 사업체를 개인, 회사법인, 회사 외 법인, 비법인단체 등으로 세분화하여 각 형태별 사업체 수를 제공합니다.-조직 형태별 구분: 사업체를 단독 사업체, 공장 등으로 구분하여 제공합니다.-종사자 수: 각 산업별 및 형태별 총 종사자 수를 포함합니다.'
