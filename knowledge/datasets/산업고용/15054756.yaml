description_portal: '광주광역시 뿌리산업 현황(주조, 금형, 소성가공, 용접, 표면처리, 열처리, 사출프레스, 정밀가공, 적층제조, 산업용필름및지류, 로봇, 센서, 산업용SW, 엔지니어링설계 )입니다. 산업구분별 업체수, 종사자, 매출액 등의 내용을 제공합니다. ※ 출처 : KPIC(국가뿌리산업진흥센터) 뿌리산업 주요 현황 / 2025년 4월 23일 기준입니다. ※ "뿌리기술"이란 주조(鑄造), 금형(金型), 소성가공(塑性加工), 용접(鎔接), 표면처리(表面處理), 열처리(熱處理) 등 제조업의 전반에 걸쳐 활용되는 공정기술로서 대통령령으로 정하는 기술을 말한다. ※ KPIC(국가뿌리산업진흥센터)에서 정의된 뿌리산업으로는 일반적인 의미에서 자동차, 조선, 정보통신(IT) 등 국가기간산업인 주력 제조업의 경쟁력을 높이는 기초산업으로 주조, 금형, 소성가공, 용접, 표면처리, 열처리가 있다.'
