description_portal: '◎ 사망사고 고위험요인(SIF, Serious Injury & Fatality)이란?  - 중대재해로 이어질 수 있는 고위험작업* 및 재해유발요인**     * 고위험작업·상황(Potential) : 심각한 부상이나 사망을 초래할 수 있는 잠재력이 있는 작업 또는 상황   ** 재해유발요인(Precursor) : 통제방법의 부재, 미흡 또는 준수되지 않아 심각한 부상이나 사망을 초래할 수 있는 증상, 조건 상태  또는 행동    ◎ 본 자료는 최근 8년간(2016~2023년) 발생한 중대재해 사례 6,032건(제조업 등 2,573건, 건설업 3,459건)을 분석하여 고위험작업·상황과 재해유발요인으로 범주화하고, 사례별 재해개요, 직·간접적 기인물 및 위험성 감소대책을 제공하고 있습니다. ※ 업데이트 내용  - 2023. 6월 기 공개자료 4,432건에 대한 보완(분류기준, 위험성 감소대책 등)  - 2021~2023년 발생 중대재해사례 분석 정보 1,600건 공개◎ 제공컬럼 : 산재업종(대/중/소), 재해개요, 기인물, 고위험작업·상황, 재해유발요인, 위험성감소대책(예시)◎ 활용방안(예시)  ▶ 사업장에서 재해사례와 유사한 고위험 작업·상황 및 재해유발요인이 있는지 점검을 실시하고, 유해·위험요인을 발굴하여 사업장의 위험성평가와 연계     ※ 실제 중대재해까지 이어진 유해·위험요인으로 위험성의 수준은 높게 설정  ▶ 재해유발요인에 대한 위험성 감소대책(예시)를 참고하여 사업장에 적합한 개선대책을 수립  ▶ 교육 시 근로자에게 실제 재해사례를 전달해 안전에 대한 경각심 고취※ 본 자료(저작물)는 동종재해 예방을 목적으로 안전보건공단에서 제작하여 제공하는 자료로 일부 내용이 재해발생 상황과 다를 수 있으며, 자료의 변경을 금지(저작물을 변경하거나 2차적 저작물 등으로 작성할 수 없음)하고 있습니다.'
