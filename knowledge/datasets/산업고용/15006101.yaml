summary_user: 부산광역시 강서구에 등록된 건설기계 대여·정비·매매·해체재활용 업체를 업체 한 곳당 한 행으로 담은 명단 파일로, 상호·영업 상태·등록일·사업유형·등록종별·전화번호·도로명주소를 담는다(포털 설명 기준 139개 업체). 건설 현장 담당자나 사업자가 '강서구에서 영업 중인 건설기계 대여업체나 정비업체가 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소로 맞춰 붙여야 하며, 같은 업종의 지방행정 인허가(LOCALDATA) 원장과 대조하는 용도로 쓴다.
description_portal: '2025년 현재 부산광역시 강서구에 등록되어 있는 139개 건설기계사업자 현황 정보 입니다. 건설공사 현장에서 사용되는 건설기계를 대여, 정비, 매매, 해체재활용하는 업체로,제공하는 정보는 다음과 같습니다.(상호,  상태, 등록일, 사업유형, 등록종별, 전화번호, 도로명주소  등)<컬럼별 상세 설명>*상태: 현재 영업 여부*등록일: 영업 등록일*사업유형: 대여업(74개), 정비업(36개), 매매업(28개), 해체재활용업(1개)*등록종별 분류 - 대여업: 일반(건설기계 4대 이하)/개별(건설기계 5대 이상) - 정비업: 전문/부분/종합'
