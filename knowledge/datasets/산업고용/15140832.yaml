summary_user: 광진구 관내 유료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 업소명·인허가일자·영업상태(정상·휴업·폐업 등)·폐업일자·지번/도로명 주소·전화번호와 중부원점TM 좌표(X, Y)를 담는다. 구직자나 구인 사업자가 광진구에서 현재 정상 영업 중인 유료직업소개소가 어디에 있는지 확인하거나, 분석가가 지역별 직업소개소 개업·폐업 추이를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE) 기준으로만 이어 쓴다.
description_portal: 서울특별시 광진구 유료직업소개소 인허가 정보는 광진구 관내에서 유료로 운영되는 직업소개소의 등록 및 운영 현황을 제공하는 데이터입니다. 해당 업소는 구인자와 구직자의 요청을 받고 유료로 알선하여 상호 고용계약이 성립되도록 중개 역할을 수행합니다. 본 데이터에는 업소명, 소재지 주소, 인허가 일자, 인허가 상태(정상, 휴업, 폐업 등), 등록번호, 대표자명, 업종 분류 등의 주요 정보가 포함되어 있으며, 유료직업소개소 운영 현황 파악 및 고용 관련 정책 수립, 지역 고용 동향 분석 등에 활용할 수 있습니다. 또한 중부원점TM(EPSG:2097) 기준의 좌표값을 포함하고 있어 공간정보 기반 분석이 가능하지만 위경도는 제공되지 않습니다. 데이터는 최신성을 유지하기 위해 최근 3일 이내의 자료 기준으로 제공됩니다.
