description_portal: 해당 데이터는 서울시 국민연금 규모별 사업장 가입자 현황 통계입니다. 데이터는 서울 내 각 사업장의 규모별규모별 사업장수, 가입자수, 남자가입자수, 여자가입자수로 구성됩니다. 각 사업장의 근로자들이 국민연금에 가입한 비율과 현황을 분석할 수 있습니다. 이를 통해 서울시의 고용 구조와 국민연금 가입 상황을 파악하고, 정책적 지원이 필요한 분야나 가입률 향상 방안을 도출할 수 있습니다. 또한 서울시의 사회보험 정책 개선, 고용 구조 분석, 중소기업 지원 방안을 마련하는 데 중요한 기초 자료로 활용될 수 있습니다.※ 바로가기 클릭 시 열린데이터광장에서 개방된 데이터를 확인할 수 있습니다.
