summary_user: 한국전력공사 충전 서비스 시스템에서 운영 중인 EV충전소의 충전부하를 2025년 1월 1일부터 12월 31일까지 일자별·충전방식(급속·완속)별로 00시~23시 24개 시간대 값으로 집계한 전국 단위 비공간 파일(CSV)이다. 전력·에너지 분석가가 급속과 완속 충전이 하루 중 어느 시간대에 몰리는지, 피크 시간대 전력 수요와 시간대별 요금 설계를 검토하는 데 쓴다. 충전소 ID·지역 코드 같은 전역 조인 키가 없어 다른 데이터와는 일자나 시간대를 기준으로 맞추거나 같은 기관 자료와 이름으로만 이어 쓴다.
description_portal: 한국전력공사에서 제공하는 전기차 시간대별 충전부하 데이터로 2025년 1월 1일부터 12월 31일까지의 기간 동안 전기차 충전 서비스 시스템에서 운영중인 EV충전소에서 집계된 자료입니다. 일자, 충전방식(급속, 완속), 시간대별 항목으로 구성되어 있어, 특정 시점의 충전 패턴을 파악할 수 있습니다. 데이터 이용자는 피크 시간대 전력 수요 관리, 충전 인프라 증설 시기 예측 등에 활용할 수 있습니다. 또한, 데이터 기반의 수요 예측 모델 구축, 시간대별 요금제 차등 설계의 기초 자료로 사용할 수 있으며, 더 나아가 전기차 보급 확대 정책과 친환경 교통 인프라 구축 전략을 수립하는 데 활용할 수 있습니다.
