summary_user: 한국남부발전이 추진하는 중소기업 지원사업을 사업별 한 행으로 정리한 목록 파일(csv, 약 4KB)로, 구분·사업명·사업내용·시행시기를 담으며 주로 해외 상담회·전시회 참가 같은 판로개척 사업이다. 에너지 분야 중소기업이 '남부발전이 올해 어떤 해외 전시회 참가를 지원하고 언제 시행하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지원사업 공고 데이터와는 사업명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 한국남부발전이 추진하는 중소기업 지원사업 목록을 정리한 자료입니다. 사업 구분은 주로 판로개척 분야로, 해외 비즈니스 상담회와 전시회 참가 지원을 통해 중소기업의 수출 판로 확대를 돕고 있습니다. 예를 들어 한·중 미래차 산업 비즈니스 상담회, 베트남 ENTECH 및 전기에너지쇼, 두바이 WETEX, 프랑스 WNE 등 국제 전시회 참가 지원이 포함되어 있으며, 각 사업의 시행 시기도 함께 제공됩니다. 이를 통해 에너지 산업 분야 중소기업이 글로벌 시장에 진출할 기회를 마련하고, 공기업과 민간기업 간 협력을 통해 산업 경쟁력을 높이고자 하는 노력을 확인할 수 있습니다. 본 자료는 중소기업의 해외 판로 확대, 지역 경제 활성화, 나아가 국가 에너지 산업의 글로벌 경쟁력 강화를 위한 기초 자료로 활용될 수 있습니다.
