summary_user: 금천구 내 고압가스업 사업장을 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업/휴업 기간·사업장명·지번/도로명 주소·제조구분·업태·좌표(X, Y)를 업소 단위로 담는다. 구청 안전 담당자나 분석가가 '금천구에서 현재 영업 중인 고압가스 제조·판매 업소는 어디에 몇 곳이며 최근 폐업한 곳은 어디인가'를 확인하거나 안전 점검 대상 지도를 만드는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 에너지 업종 원장(석유판매·LPG·도시가스 등)과 묶어 지역 에너지 업종 현황을 보는 데 쓴다.
description_portal: 금천구 내 고압가스업체의 인허가 및 영업 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 폐업 및 휴업 정보, 사업장명, 소재지 주소, 전화번호, 제조구분, 사업장 부지용도, 업태 구분, 좌표 정보 등 다양한 항목을 포함하여 고압가스 관련 업소의 현황을 체계적으로 확인할 수 있습니다. 이를 통해 고압가스 안전 관리 체계를 강화하고, 관련 업계의 현황이나 동향을 분석하는 데 활용할 수 있습니다. 또한 사업장 위치와 용도 구분에 대한 정보가 함께 제공되어 지도 기반 서비스 개발, 위험물 관리, 행정 업무 지원, 안전 점검 계획 수립 등 여러 방면에서 유용합니다. 나아가 정책 수립, 연구, 지역 사회 안전망 구축 등 다양한 목적에 기여할 수 있는 가치 높은 공공 데이터입니다.
