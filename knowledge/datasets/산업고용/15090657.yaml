summary_user: 해외인턴 프로그램에 선발되어 참여한 인원을 사업명(itrnBsnsNm)·기수 번호별 인원수(cnt)로 담은 전국 단위 집계 데이터로, 개인별 원천 기록은 아니다. 해외 취업을 준비하는 청년이나 정책 분석가가 "어떤 해외인턴 사업의 몇 기수에 몇 명이 참여했나"를 확인해 사업별 운영 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 일자리사업·채용 데이터와는 사업명 같은 이름 매핑이나 같은 기관(한국산업인력공단·월드잡플러스) 데이터로만 이어 쓴다.
limits: 사업명·기수·인원수만 있고 지역 코드가 없는 비공간 데이터라 국가별·지역별 분석에는 쓸 수 없으며, 다른 데이터와 코드로 바로 조인되지 않는다. 기수 단위로 생성된 뒤 바뀌지 않는 이벤트형 갱신이라 정기 시계열처럼 해석하지 않는다.
