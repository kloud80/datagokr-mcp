description_portal: 바이오중유 품질기준은 석유 및 석유대체연료 사업법 제31조에 따라 석유대체연료의 품질기준과 검사방법 및 검사수수료에 관한 고시에 규정되어 있습니다.바이오중유는 ｢전기사업법｣ 제2조제16호가목의 전기사업용전기설비 중 기력발전소에 사용하는 연료로서 생물유기체 이외의 원료를 함유하지 아니하고 다음의 품질기준에 적합하여야 합니다.바이오중유의 품질기준 항목은 인화점, 동점도, 잔류탄소분, 황분, 회분, 동판부식, 유동점, 밀도, 수분, 전산가, 알칼리금속, 요오드가, 질소, 바나듐, 인, 물과 침전물, 총발열량 등이 있습니다.
