summary_user: 서울특별시 중랑구 관내에 등록된 주택관리업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 379바이트)로, 사무소명·전화번호·도로명 주소·팩스번호와 관리부서 정보를 담는다. 중랑구 공동주택 입주자대표회의나 관리주체가 관내 주택관리업체 연락처를 찾거나, 분석가가 지역별 주택관리업체 분포를 확인할 때 쓴다. 전역 조인 키(사업자번호·업체코드 등)가 없어 다른 데이터와는 업체명이나 주소를 매칭해 이어야 하며, 다른 자치구의 같은 종류 자료와 합쳐 서울 단위 현황을 만드는 식으로 쓴다.
description_portal: 2026년 1월 기준 공동주택관리법 제2조(정의) 및  제52조등에  따라 서울시특별시 중랑구의 관내에 있는  주택관리업체 현황자료를 제공합니다.담당부서는 중랑구 주택관리과 공동주택팀입니다.공공데이터포털에  제공하는 데이터는 주택관리업체명, 관리업체 전화번호 ,관리업체 소재지(도로명 주소), 관리업체 팩스번호 입니다.주택관리업은 공동주택의 효율적인 운영과 관리를 담당하는 전문분야입니다. 용역계약된 공동주택에 주택관리사등을 배치합니다. 참고해주시기 바랍니다. 감사합니다.
