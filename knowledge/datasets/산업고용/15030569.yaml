summary_user: 대구광역시 북구 관내에서 영업 중인 가스판매소와 가스충전업소를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종·업소명·전화번호·도로명주소·데이터기준일자를 담는다. 주민이나 사업자가 북구에서 LPG 등 가스를 사거나 충전할 수 있는 업소가 어디에 있고 연락처가 무엇인지 찾을 때, 또는 안전점검 대상 업소 목록을 뽑을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명주소(소재지도로명주소)로 맞춰 이어야 하며, 전국 단위 에너지 업종 인허가 원장(LOCALDATA)과 대조할 때도 이름·주소 매핑이 필요하다.
description_portal: 대구광역시 북구 관내에서 운영 중인 가스사업자현황(가스판매업, 가스충전업)정보를 제공합니다.대구광역시 북구 관내 영업 중인 가스판매소 및 충전업 현황입니다.(상호, 업종, 소재지, 전화번호 등)해당 업체는 고압가스 안전관리법, 액화석유가스의 안전관리법 및 도시가스사업법에 따라 허가를 받아 운영되며, 해당 정보는 산업 현황 파악, 안전관리 체계 구축, 시설 안전관리, 관련 정책 수립 등을 위한 기초 자료 및 유관기관의 안전점검 자료로도 활용 됩니다.자세한 현황 내역은 대구광역시 북구청 일자리정책과(053-665-2082)로 문의하시기 바랍니다.
