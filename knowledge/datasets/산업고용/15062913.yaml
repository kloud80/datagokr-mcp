summary_user: 경상남도 내 창업보육센터 현황을 센터 한 곳당 한 행으로 담으며, 시군구명·센터명·전화번호·개업일자·전문분야·도로명주소와 데이터기준일자를 포함한다. 예비창업자나 초기 창업기업이 "우리 시군에 내 업종을 전문으로 하는 창업보육센터가 있나"를 찾을 때 쓰고, 분석가가 경남 시군별 보육 인프라 분포를 파악할 때도 쓴다. 전역 조인 키나 사업자번호가 없어서 다른 데이터와는 시군구명이나 주소 같은 이름 매칭으로만 잇고, 주소를 지오코딩하면 상권·지역 기업 현황 데이터와 위치 기준으로 겹쳐 볼 수 있다.
limits: 사업자번호 같은 공통 키가 없어 기업 확인·인증 원장과 바로 연결되지 않고, 시군구명·주소 문자열 매칭에 기대야 한다. 범위는 경상남도 한 곳뿐이라 다른 시도와 비교하려면 별도 데이터가 필요하다. 입주기업 명단이나 보육 실적은 필드에 없다.
