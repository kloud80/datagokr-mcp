description_portal: 서울시 전통시장 현황(중국어_간체) 데이터는 서울시에 위치한 전통시장의 기본 정보를 중국어 간체로 제공하는 자료입니다. 시장명, 행정시, 행정구, 행정동을 중국어 간체 표기로 수록하여 중국어권 관광객 안내, 다국어 지도 제작, 외국인 대상 홍보물 제작 등에 활용하기 적합합니다. 각 전통시장별 웹주소가 포함되어 있어 시장 소개, 점포 정보, 행사 안내 등 상세 내용을 연계해 확인할 수 있습니다. 또한 중심좌표 X, 중심좌표 Y 항목을 통해 WGS84 좌표계 기반의 위치 정보를 제공하므로, 온라인 지도, 내비게이션, 관광 앱 등 위치기반 서비스와 연동하여 전통시장의 공간 분포 분석과 방문 동선 설계 등에 활용 가능한 데이터입니다.
