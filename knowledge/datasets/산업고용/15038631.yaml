summary_user: 김포시 관내 직업소개소를 업소 한 곳당 한 행으로 담은 목록 파일로, 유료·무료 구분, 법인명, 사업소 전화번호, 도로명주소, 데이터기준일이 들어 있다. 구직자나 구인 사업자가 김포에서 연락할 수 있는 무료·유료 직업소개소가 어디에 있는지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 도로명주소나 업소명으로 직접 맞춰 이어야 한다.
description_portal: 경기도_김포시_직업소개소 입니다. 김포시에서 제공하는 직업에 대한 소개를 통한 고용증가를 목표하고 있습니다,김포시의 직업소개소 관련하여 직업,일자리,인력취업,소개,인력풀 등의 키워드를 통해 제공합니다. 직업소개서 정보를 통하여 구직자는 보다 편리하고 손쉽게 일자리 정보를 제공받을 수 있습니다.여러가지 직업에 대한 정보를 다양한 업체로부터 소개받을 수 있다는 장점이 있습니다. 순번,유무료구분,직업소개소명, 사업소전화번호, 도로명주소 ,데이터기준일 등의 정보를 제공하고 있습니다.
