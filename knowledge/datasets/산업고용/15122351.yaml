description_portal: '이 데이터는 근로복지공단 산재보험에 가입된 사업장의 현황을 지역별 지사 단위 및 사업장 규모별(상시근로자수 기준)로 상세하게 집계한 통계 자료입니다. 각 지사별로 상시근로자 수(예: 5인 미만, 1000인 이상)에 따른 적용 사업장 수(개소) 정보를 연도별로 제공합니다. 이 자료는 지역별 고용 구조의 특성과 산재보험 적용의 포괄 범위를 구체적인 수치로 보여주며, 특히 지역별로 영세 사업장이 차지하는 비중 및 고용 안전망의 분포를 파악하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 지역 기반의 고용 및 복지 정책 수립에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 지사 관할 지역 내에서 5인 미만 소규모 사업장의 비중이 높게 나타나는 현상을 분석할 수 있습니다. 이를 통해 해당 지역을 대상으로 한 맞춤형 산재 예방 활동 및 안전 관리 지원책을 수립할 수 있으며, 소규모 사업장의 보험 가입 및 유지 관리를 위한 행정적 노력을 집중하는 데 활용할 수 있습니다. 또한, 이 통계는 지역별 산재보험 적용 현황의 균형 발전을 평가하고, 공공서비스의 지역별 접근성을 개선하는 데 기여할 수 있다고 판단됩니다.'
