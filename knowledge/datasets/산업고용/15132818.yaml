description_portal: 한국노동연구원은 국내 고용 및 기업 구조의 동태를 심층적으로 파악하기 위해 사업체패널조사(Workplace Panel Survey)를 정기적으로 수행하고 있습니다. 이 조사는 다양한 산업 및 규모의 사업체를 추적하며, 고용관계, 임금구조, 인적자원관리, 기업 경영환경 등에 대한 종합적인 데이터를 수집합니다. 사업체패널조사 데이터는 기술변화나 인적자원관리 전략, 노사관계 변화 등의 성과를 분석하는 데 핵심적인 자료입니다.한국노동연구원 사업체패널 1-9차년도 조사자료 통합코드북(version 1.81)은  각 변수의 분류값(대분류, 중분류 등), 변수설명, 변수값 설명, 변수값 등의 정보로 구성되어 있습니다. 사업체패널조사 통합코드북은 조사 데이터에 포함된 변수들의 구조와 내용을 명확히 설명하고, 조사 결과를 정확하게 분석할 수 있도록 지원하기 위한 핵심 문서입니다. 통합코드북은 다년도에 걸쳐 축적된 사업체패널 데이터를 일관되게 이해하고 활용할 수 있도록 각 변수의 정의, 값의 의미, 응답코드 체계, 결측처리 방식 등을 통합적으로 정리한 자료입니다.
