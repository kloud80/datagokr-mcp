summary_user: 전국 지방자치단체가 관리하는 대형마트·백화점·쇼핑센터·복합쇼핑몰 등 대규모점포의 인허가 정보를 점포 한 곳 단위로 모은 원천 데이터이며, API 전체 4,186건에 인허가일자·영업상태·사업장명·주소·좌표를 담는다. 상권 분석가나 입점 검토자가 특정 지역에 어떤 대규모점포가 언제 인허가를 받아 지금 영업 중인지 확인하는 질문에 쓴다. 지번주소·도로명주소(address)와 관리번호(pnu)가 조인 키라서 주소 기준으로 다른 상가·상권 데이터와 이어 쓰고, 개방자치단체코드는 다른 데이터에서 받아 와야 한다.
description_portal: '생활_대규모점포 데이터는 대형마트, 백화점, 쇼핑센터,복합쇼핑몰 등 다수의 사업자로부터 납품받아 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준, 전국 지방자치단체에서 관리하는 대규모점포 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터의 법령 소관기관 및 문의처 : 산업통상부 유통물류과 / 044-203-4383 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
services:
  - op: /info
    name: 생활_대규모점포 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/large_scale_retail_stores/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[LCPMT_YMD::GTE]
        required: false
        desc: 인허가일자 이상의 값(YYYYMMDD)
      - name: cond[LCPMT_YMD::LT]
        required: false
        desc: 인허가일자 미만의 값(YYYYMMDD)
      - name: cond[SALS_STTS_CD::EQ]
        required: false
        desc: 영업상태코드 와 일치하는 값
      - name: cond[ROAD_NM_ADDR::LIKE]
        required: false
        desc: 도로명주소 을(를) 포함하는 값
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[BPLC_NM::LIKE]
        required: false
        desc: 사업자명 을(를) 포함하는 값
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
