description_portal: 본 데이터는 충청남도 금산군의 전기자동차 등록대수 및 보조금 신청  대기현황 정보를 제공합니다. 2021년 5월 기준 총 11건의 데이터가 수록되어 있습니다. 각 읍면별 전기자동차 등록 건수 및 보조금 신청 대기 건수 데이터를 제공합니다. 금산군 전체 전기자동차 등록 건수는 132건이며, 보조금 신청 대기 건수는 8건입니다. 해당 데이터는 친환경 교통수단 보급 확대 및 지역별 수요 파악을 위한 기초자료로 활용될 수 있습니다. 특히 전기차 이용자 및 관련 정책 수립자들에게 유용한 정보로, 지역 간 친환경차 인프라 격차 분석, 보조금 수요 예측 등에 다양하게 활용될 수 있습니다.
