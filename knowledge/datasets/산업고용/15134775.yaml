description_portal: '본 데이터는 중소벤처기업 전문 연구기관인 중소벤처기업연구원(KOSI)에서 수행한 다양한 연구 성과물과 발간물 정보를 제공하는 파일 데이터입니다. - 정책연구 보고서 : 기본연구보고서, 이슈 분석, 정책과제 연구 보고서 등 - KOSI 중소기업 동향 : 국내외 경제·산업 여건 변화에 따른 중소기업 및 소상공인 경기 동향 분석 자료 - 해외 중소기업 정책동향 : 주요국(미국, EU, 일본, 중국 등)의 중소기업·벤처 관련 정책 및 최신 동향 분석 - 중소기업 이슈포커스 : 현안 중심의 중소·벤처기업 및 소상공인 정책 이슈 분석 보고서 - 학술 및 기타 발간물 : Journal of SME Policy(등재 학술지) 논문 및 연차보고서, 소식지 관련 정보데이터 항목 필드 - 보고서 제목, 연구자(저자), 발행기관, 원문면수, 주제, 원문 첨부파일(PDF 등), 발행일, 자료의 요약 내용 등※ 활용 분야 - 중소·벤처기업 및 소상공인 관련 정책 입안, 학술 연구, 산업·시장 분석 및 통계 기초 자료 활용 - 창업 및 중소기업 지원 사업 기획을 위한 실증 연구 및 동향 분석'
