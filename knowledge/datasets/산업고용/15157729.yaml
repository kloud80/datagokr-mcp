summary_user: 한국수력원자력이 운영하는 양수발전소 7곳(청평·삼랑진·무주·산청·양양·청송·예천)의 발전 현황을 항목별 측정시간과 값(설명·항목코드·측정시간·값) 단위로 담는 조회 API입니다. 전력 분석가나 에너지 연구자가 '특정 양수발전소가 지금 얼마나 발전하고 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 발전소 구분 코드(3310~3370)와 발전소 이름을 매핑해 다른 발전소 원장이나 전력 수급 데이터와 이어 쓴다.
description_portal: '위 API는 한국수력원자력(주)_양수발전소 발전현황 조회 서비스 API입니다.한국수력원자력에서 운영중인 양수발전소(청평양수발전소, 삼랑진양수발전소, 무주양수발전소, 산청양수발전소, 양양양수발전소, 청송양수발전소, 예천양수발전소)의 발전 현황(설명, 항목코드, 측정시간, 값)을 조회하는 서비스입니다.○ serviceKey : 공공데이터포털에서 받은 인증키○ 발전코드 : 발전소 구분 코드 / 3310 : 청평 3320 : 삼량진 3330 : 무주 3340 : 산청 3350 : 양양 3360 : 청송 3370 : 예천○ expl: 설명, name : 항목코드, time: 측정시간, value : 값'
team:
  dept: AI혁신처 데이터혁신부
