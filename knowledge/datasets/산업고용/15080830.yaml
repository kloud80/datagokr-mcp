summary_user: 서울 종로구 관내 공공시설에 설치된 태양광 발전설비를 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명/지번 주소·설치용량(kW)·발전유형·설치년도·기준일자를 기록한다. 구청 담당자나 분석가가 '종로구 공공건물에 태양광이 어디에 얼마만큼 설치돼 있고 언제 들어갔는가'를 확인하거나 추가 설치 대상지를 검토할 때 쓴다. 전역 조인 키는 없어서 주소나 시설명으로 맞춰 붙여야 하며, 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 단위 원장과 주소·용량을 비교하는 정도로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 공공시설에 설치된 태양광 발전 설비의 현황을 정리한 자료입니다. 주요 항목에는 태양광 설비가 설치된 장소명, 도로명 주소, 설비의 설치용량(kW) 등이 포함되어 있으며, 지역 내 신재생에너지 보급 및 탄소중립 실현을 위한 공공부문 에너지 전환 현황을 확인할 수 있습니다. 본 자료는 공공건물의 에너지 자립률 분석, 태양광 보급률 통계 관리, 친환경 정책 이행 여부 확인 등에 활용되며, 에너지 수요 절감과 온실가스 저감을 위한 기초자료로 제공됩니다. 또한 향후 태양광 확대 설치 대상지 선정, 공공시설 에너지 진단, 그린뉴딜 관련 정책 수립 등 지속가능한 도시환경 조성을 위한 행정계획 수립에 기여할 수 있는 공공데이터입니다.
