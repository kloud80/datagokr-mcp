summary_user: 중소벤처기업부가 올린 지원사업 공고를 게시물 한 건 단위로 담으며, 제목·내용·신청 시작일과 마감일·담당부서와 연락처·상세페이지와 첨부파일 주소를 전국 범위로 제공한다. 창업자나 중소기업 대표가 "이번 달 신청할 수 있는 중기부 지원사업 공고가 무엇이고 마감이 언제인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고 제목·사업명 같은 이름 매칭으로만 잇고, 게시물 키(itemId)는 이 목록 안에서 공고를 구분하는 용도다.
description_portal: 중소벤처기업부 사업공고의 제목, 작성자, 첨부파일 등을 조회하는 중소벤처기업부 사업공고 목록 조회 서비스입니다.
