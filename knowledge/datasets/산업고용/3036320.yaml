summary_user: 문경시에서 공장등록된 제조업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 회사명·공장 지번주소·업종명이 들어 있습니다(포털 설명상 2025년 12월 기준). 문경시 안에서 특정 업종의 제조공장이 어디에 몇 곳 있는지 알아보려는 지역 분석가나 협력업체를 찾는 사업자가 쓴다. 사업자번호 같은 전역 조인 키는 없어서, 다른 데이터와는 회사명이나 지번주소를 이름·주소 매칭으로 이어 붙여야 한다.
description_portal: 2025년 12월 기준, 문경시 기업체 중 공장등록된 제조업체 현황 정보입니다. 업체명, 주소, 업종에 관한 데이터를 포함합니다. 참고하시기 바랍니다.
