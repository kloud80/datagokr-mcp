description_portal: '서울특별시 영등포구에서 담배소매업을 영위하기 위해 인허가를 받은 업소의 상세 정보를 담고 있는 데이터입니다. 이 정보는 담배사업법 및 관련 조례에 따라 적법하게 등록된 소매인에 대한 행정 기록을 포함합니다.데이터셋에는 업소의 고유 식별을 위한 인허가번호와 더불어, 최초 영업을 시작한 인허가일자 및 현재 영업을 지속하고 있는지 여부를 나타내는 영업상태명(예: 영업/폐업 등)과 폐업일자 등이 포함되어 있어 최신 상태를 확인할 수 있습니다.또한, 영업소의 소재지를 정확히 파악할 수 있는 소재지 도로명주소와 소재지 지번주소 등의 위치 정보가 제공됩니다. 해당 데이터는 신규 점포 개설 시 법적 거리 제한 준수 여부를 확인하거나, 담배 판매업소의 현황 분석, 그리고 비위생적이거나 불법적인 영업행위에 대한 관리 및 감독을 위한 기초 자료로 활용될 수 있습니다.'
