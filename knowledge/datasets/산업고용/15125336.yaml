summary_user: 한국남부발전(주)이 전력거래시장에 참여한 내역을 일자별로 담은 API로, 공급가능용량·재선언 공급가능용량·입찰량·판매량·가격결정 발전계획량·계량전력량·급전지시 발전량 같은 시장 운영 수치를 날짜(tradedt) 단위로 돌려준다. 에너지 분석가나 사업자가 '남부발전이 특정 날짜에 얼마를 입찰하고 실제로 얼마를 발전·판매했나'처럼 입찰량과 실제 발전량의 차이를 따지거나 일별 발전량을 추정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜나 같은 기관 기준으로만 맞춰 쓰며, 전력거래소의 일별 수급·SMP 자료와 날짜로 나란히 놓고 보는 방식이 현실적이다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전공기업입니다. 본 API는 한국남부발전(주) 전력거래시장 운영정보조회 서비스입니다.본 API를 통해 일일 단위로 한국남부발전(주)의 전력거래시장 참여 정보를 조회할 수 있습니다. 일일별 한국남부발전(주) 전력거래시장 운영정보 조회를 통해 일자별 세부 발전량을 추정할 수 있으며,해당 데이터를 바탕으로 전력거래 투명성 확보를 통해 새로운 에너지 비즈니스 모델을 개발하는데 도움을 줄 수 있습니다.
