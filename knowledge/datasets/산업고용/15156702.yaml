description_portal: 해당 데이터는 공단 부지 내 7개 지점과 부지 외 3개 지점, 월성원전 감시지점 17개 지점 등 총 27개 지점을 분기별 1회 주기로 열형광선량계를 설치 및 회수하여 3개월간 누적된 선량을 판독하였음.시료채취지점 중 처분시설의 영향이 없는 울산지역을 비교지점으로 선정하여 그 값을 비교하였으며, 울산지역은 월성원전 감시지역으로 해당 결과를 활용하였음.데이터 중 부지외부에 대한 값은 공단 측정 3개소와 월성원전 측정 17개소의 자료값으로,각 측정결과의 단위는 "uGy/분기"를 활용하였음.해당 데이터는 연간 발생하는 데이터이나 행 및 열의 구성에 따라 누적 파일로 관리되고 있지 않아서 일회성 데이터로 등록됨.
