description_portal: '본 데이터는 기술경영과 연구개발능력, 기술성, 시장성 및 사업성 등을 통하여 기업의 기술사업화 역량을 체계적으로 평가할 수 있는 요소를 제공합니다. 이를 통해 기업은 자사의 기술력과 사업성에 대한 객관적인 판단을 할 수 있으며, 평가 결과를 바탕으로 기술 개발 및 사업 전략 수립에 필요한 근거 자료를 마련할 수 있습니다. 또한 이 데이터는 기업의 경쟁력 강화를 위한 정책 수립이나 맞춤형 지원을 위한 확인 자료로 활용될 가능성이 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 대분류(문자형) : 기업 사업 분야의 유형을 나타냅니다. 중분류(문자형) : 세부적으로 분류된 기술 관련 특성을 제공합니다. 소분류(문자형) : 해당 문의 구체적인 평가 항목을 설명합니다. 질문 설명(문자형) : 각 항목에 대한 구체적인 평가 기준을 서술합니다. 예시 설명(문자형) : 질문의 내용과 관련된 구체적인 예시를 제공합니다.'
