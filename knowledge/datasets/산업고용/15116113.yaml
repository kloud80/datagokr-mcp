summary_user: 서울특별시 강서구의 고압가스 제조·저장·판매업소를 인허가 건별로 담은 원장으로, 사업장명·주소·인허가일자·영업상태·폐업일자·좌표(X, Y) 등을 행 단위로 기록한다. 주민이나 안전관리 담당자가 '강서구에서 현재 영업 중인 고압가스 취급 업소는 어디에 있고 언제 인허가를 받았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 시군구의 같은 LOCALDATA 에너지 업종 인허가 원장과 컬럼 구조를 맞춰 이어 붙여 쓴다.
description_portal: 서울특별시 강서구 내 고압가스 제조, 저장 및 판매업체의 인허가 관련 정보를 정리한 데이터입니다. 이 자료에는 각 업체의 사업장명, 주소, 전화번호, 인허가일자, 영업상태 등 핵심 정보가 포함되어 있으며, 고압가스를 포함한 산업용 가스를 생산하거나 취급하는 업소 현황을 파악하는 데 활용됩니다. 이를 통해 안전관리 대상 사업장의 분포, 산업활동 특성, 위험물질 취급 시설의 위치 등을 분석할 수 있습니다. 또한 긴급 재난 대응, 안전관리 계획 수립, 관련 업종 규제 검토 등에 중요한 기초자료로 사용될 수 있으며, 지역 내 에너지 및 공업 관련 인프라 현황을 이해하는 데 기여할 수 있습니다. 특히 산업단지, 물류시설, 제조시설 인근 지역에서의 정책 수립이나 환경·안전 모니터링에도 유용한 정보입니다.
