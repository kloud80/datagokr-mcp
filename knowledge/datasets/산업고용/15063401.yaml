limits: 전체 99건이라 경상남도 내 태양광 설비 전체를 대표하는지는 이 데이터만으로 확인되지 않는다. 연결 키는 주소 하나뿐이어서 주소 표기 차이에 따른 매칭 오류를 감안해야 하며, 갱신 주기는 근거가 없어 알 수 없다.
