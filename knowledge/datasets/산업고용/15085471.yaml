summary_user: 경상남도 하동군에 있는 직업소개소를 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 1.7KB)로, 유료·무료 구분, 법인명·사업소명, 인허가번호, 운영상태, 주소·전화번호, 대표자, 보증보험 기간, 등록일자를 담는다. 하동군에서 일자리를 찾는 주민이나 인력이 필요한 사업자가 '군내에 운영 중인 무료(또는 유료) 직업소개소가 어디이고 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어서, 다른 시군의 직업소개소 현황이나 고용 서비스 기관 데이터와는 사업소명·인허가번호·주소를 직접 맞춰 이어야 한다.
