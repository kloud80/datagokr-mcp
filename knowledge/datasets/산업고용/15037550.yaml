summary_user: 창업기업이 창업까지 준비에 걸린 평균 기간(개월)을 업력·업종·기업형태(개인/법인)·창업자 성별·연령 같은 구분별로 묶은 전국 단위 집계표로, 903바이트 크기의 작은 CSV 파일이다. 예비창업자나 창업지원 정책 분석가가 '내 업종이나 연령대에서는 창업 준비에 보통 몇 개월이 걸리나'를 비교할 때 쓴다. 사업자번호나 표준 코드 같은 조인 키가 없어서 다른 데이터와는 업종명·연령대 같은 구분 이름을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: 해당 데이터는 창업진흥원의 창업까지 소요된 기간(개월 수)에 대한 통계 자료입니다. 데이터는 구분별(1), 구분별(2), 창업까지 소요기간(개월) 항목으로 구성되어 있으며, 업력, 업종, 기업형태, 창업자 성별, 창업자 연령 등의 다양한 기준으로 구분되어 있습니다. 예를 들어 업력 1년 창업자는 평균 9.4개월, 5년차는 11.6개월이 소요된 것으로 나타났으며, 업종별로는 전기·가스·증기 및 공기조절 공급업이 14개월, 운수 및 창고업은 8.7개월로 나타났습니다. 또한 개인기업은 10.8개월, 법인기업은 11.3개월이 소요되었으며, 성별에 따라 남성은 10.9개월, 여성은 10.7개월, 연령별로는 20대 이하는 8.7개월, 60대 이상은 11.1개월로 기록되어 있습니다. 이 데이터를 통해 창업까지 소요되는 기간이 어떤 요인에 따라 차이를 보이는지 비교 분석이 가능합니다.
