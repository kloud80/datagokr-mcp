description_portal: 대구광역시 부동산개발업 등록사업자의 현황입니다. 부동산개발업등록번호와 상호, 대표자, 전화번호, 자본금 등이 기록되어 있습니다. 타인에게 판매 또는 임대할 목적으로 건축물의 연면적이 3천㎡ 또는 연간 5천㎡ 이상이거나 토지의 면적이 5천㎡ 또는 연간 1만㎡ 이상을 개발하기 위해서는 부동산개발업 등록을 하여야 합니다. 부동산개발업 등록제도는 개발업자의 난립으로 인한 소비자 피해 방지 및 개발업의 체계적 관리‧육성을 위해 도입되었으며 개발업 정보의 종합적 관리, 사업실적 정보의 제공을 통해 개발업자 간 건전한 경쟁과 부동산개발 시장의 투명화 유도하고 개발업자의 허위개발정보 유포행위 등을 금지하여 소비자를 보호하기 위하여 시행하는 제도입니다.
