description_portal: '한국산업기술진흥원에서 제공하는 데이터는 소재개발 및 정보화와 관련된 대학, 연구소 간 협력사업을 정부의 지원을 통해 소개하는 자료입니다. 본 데이터에는 주관기관의 종류와 이름, 개별 과제의 제목, 사업에 대한 상세한 소개, 그리고 그 결과를 활용하고 있는 기관의 현황이 포함되어 있습니다. 이 데이터는 소재 분야의 연구개발 및 관련 기업의 협력 강화를 위한 기초자료로 활용될 수 있습니다. 예를 들어, 학계나 연구소가 새로운 소재를 개발하는 데 있어 필요한 정보를 제공하여 효과적인 협력을 이끌어낼 수 있습니다. 또한 기업이 정부 지원사업을 통해 파트너십을 고려할 때 유용한 참조 자료가 될 것입니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 링크(문자형), 주관기관 구분(문자형), 주관기관(문자형), 과제명(문자형), 사업소개(문자형), 결과활용기관현황(문자형)입니다.'
