description_portal: 본 데이터는 한국가스공사에서 운영하는 평택, 인천, 통영, 삼척, 제주 등 전국 5개 LNG 생산기지의 2010년부터 현재까지 분기별 천연가스 생산 분담률을 체계적으로 정리한 국가 에너지 인프라 운영 통계 자료입니다. 각 생산기지의 분기별 생산량 비중을 백분율로 산출하여 제공하며, 기지별 생산능력과 실제 가동현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 데이터 항목으로는 연도, 분기, 기지명, 생산 분담률 수치 등이 포함됩니다. 이 데이터를 활용하면 각 생산기지의 시계열적 생산 추이를 분석하고, 계절별 천연가스 수요 변동에 따른 기지별 가동률 변화 패턴을 파악할 수 있습니다. 또한 향후 국가 차원의 천연가스 수급계획 수립 및 신규 생산기지 건설 타당성 검토 시 핵심 기초자료로 활용될 수 있습니다.
