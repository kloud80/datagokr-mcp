summary_user: 충청북도의 15세 이상 생산가능인구 규모, 취업자 수, 고용률(%)을 연도·월 단위로 담은 시도 단위 집계 지표다. 분석가나 정책 담당자가 '충북 고용률이 최근 몇 년간 월별로 어떻게 변했나'를 확인하거나 일자리 정책 성과를 모니터링할 때 쓴다. 전역 조인 키는 없어서 다른 지역 고용동향 데이터와는 연도·월(YEAR, MT)과 시도 이름을 맞춰 시도 × 월 격자로 이어 쓴다.
description_portal: 충청북도 고용동향 중 15세 이상 생산가능인구의 고용률 변화를 연도·월 단위로 조회할 수 있는 Open API로, 생산가능인구 규모, 취업 인구 수, 고용률(%) 등 핵심 노동지표를 입력 파라미터로 세분화하여 확인할 수 있습니다. 이 데이터는 지역 경제활동 수준과 고용시장 흐름을 파악하는 데 필수적인 기초자료로 활용되며, 일자리 정책의 성과 모니터링, 인구구조 변화에 따른 노동공급 분석, 청년층 지원정책 수립 등 행정·연구 목적의 정량적 근거를 제공합니다. 공공 개방을 통해 지역 간 고용환경 비교, 산업별 인력수요 예측, 정책 효과 분석 등 다양한 활용성을 높이고, 민간에서도 경제동향 파악과 사회지표 연구에 참고할 수 있는 의미 있는 자료로 기능합니다.
