description_portal: '○ 통계개요* 통계명 : 신설법인 현황* 통계종류 : 서울시 신설법인 현황을 업종별로 제공하는 일반·보고통계* 작성목적 : 신설법인의 추이와 업종별·지역별 창업 동향 파악으로 중소기업의 현장경기를 진단하고,창업 지원시책의 효율적 수립을 도모하는 것을 목적으로 함* 조사체계 : 법원행정처(전국신설법인 등록자료)→중소기업청→한국기업데이터→중소기업청* 공표주기 : 정기* 공표범위 : 지역 - 서울시내용 - 서울시 신설법인수○ 용어설명* 신설법인 : 상법상의 영리법인(주식회사, 유한회사, 합자회사, 합명회사)으로 법원(상업등기소)에설립등기를 마친 법인(개인기업 제외)○ 기 타* 집계방식 변경으로 작성중지** 신설법인현황에서 활용하는 행정자료가 법인등기에서 사업자등록(「창업기업동향」)으로 변경 집계, 이용시 유의○ 출 처 : 중소벤처기업부「신설법인동향」'
