summary_user: 경상북도 경주시 관내 건설업체를 업체 한 곳당 한 행으로 담은 파일 데이터로, 상호·최초등록일자·업체상태·도로명 소재지를 담는다(CSV 약 45KB). 지역 사업자나 분석가가 경주시에 어떤 건설업체가 영업 중이고 언제 처음 등록했는지, 소재지가 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명주소를 맞춰 잇거나 같은 기관의 다른 인허가 자료와 나란히 보는 방식으로만 연결한다.
description_portal: 본 데이터는 경상북도 경주시 관내에서 영위 중인 건설업체의 현황을 정리한 파일 형태의 공공데이터이다. 건설업 현황은 지역 건설산업의 규모와 동향을 파악하는 데 필수적 자료로, 사업장 명칭, 대표자, 사업자 등록번호, 주소 등의 주요 정보를 포함하고 있다. 해당 데이터는 업체명, 대표자, 사업자번호, 소재지, 전화번호 등에 활용 가능하며, 지역 사회 기반시설의 계획과 관리에도 기여한다. 경주시는 데이터의 정확성과 최신성 유지를 위해 정기적인 갱신을 실시하고 있으며, 투명한 행정 서비스 제공을 목적으로 공공에 개방한다.
