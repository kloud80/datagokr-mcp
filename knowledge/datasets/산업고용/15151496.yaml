description_portal: '한국지역난방공사 ‘열수송 분야 계획예방정비 통계(2024)’는 지사별 열배관 및 관련 설비의 예방정비 실적 데이터입니다. 설비별 이력과 일정 흐름을 한눈에 파악할 수 있어 노후 구간 진단, 자재·인력 계획 수립, 장기 공사로 인한 공급 중단 리스크 최소화, 성과 모니터링 및 정책평가 등 유지관리 의사결정 전 과정에 바로 활용할 수 있습니다.1. 형식: CSV2. 내용 요약:■ 지사명: 정비가 수행된 지사 명칭(예시: 수원, 분당)■ 설비위치: 열배관·설비가 위치한 주소 또는 지점명(예시: 서울 영등포구 여의도동)■ 정비기간 시작일: 정비 착수일(YYYY-MM-DD)(예시: 2024-12-28)■ 정비기간 종료일: 정비 완료일(YYYY-MM-DD)(예시: 2024-12-29)■ 관경코드: 배관 관경(mm) 코드값으로 공정 난이도·자재 산정에 활용(예시: 200)■ 정비사유: 정비 필요 사유 분류(예시: 누수의심, 구조개선, 신설, 진단, 기타)■ 정비내용: 실제 수행 작업(예시: 교체, 이설, 보수, 점검, 철거)■ 긴급여부: 작업 긴급도 표시(예시: 일반, 긴급, 고장)3. 활용 예제:■ 정비 우선순위·자원배분: 사유+관경+긴급을 점수화해 월간 계획·인력·자재 배치 최적화■ 위험구간 선별: 누수의심·장기공사 구간을 기간·빈도 분석으로 추출 후 지도화■ 성과·예산 평가: 지사별 건수·평균기간 시각화로 표준공정 개선과 예산 배분 근거 마련'
