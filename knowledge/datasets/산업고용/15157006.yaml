description_portal: 의정부도시공사에서는 1년간의 에너지 사용량에 관한 정보를 제공합니다. 본 데이터에는 휘발유, 경유, CNG LNG, LPG, 전력 등 연료별 에너지사용량을 세부 정보로 포함하고 있습니다.이러한 정보를 통해 정책 담당자는 국가 감축 정책의 추진 현황을 점검할 수 있고, 연구자와 산업계는 효율적인 에너지 활용 전략 수립에 참고할 수 있습니다.또한 공공기관의 환경경영 성과를 확인할 수 있어 지속가능경영의 지표로 활용되고, 에너지 효율화와 환경정책 수립을 위한 기초 자료로 제공됩니다.한편 본 데이터는 환경정보공개시스템(https://www.env-info.kr/)에 공개된 정보와 연동하고 있습니다.데이터제공 기준일자는 2025.12.18.입니다.
