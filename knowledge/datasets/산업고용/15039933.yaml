summary_user: 인천광역시 서구(서해구) 안에 등록된 노동조합을 조합 한 곳당 한 행으로 담은 파일로, 노동조합단체명·사업장명·소재지·데이터기준일자를 담는다(CSV 약 6.9KB, 시군구 범위의 개별 주소 단위). 지역 노동정책 담당자나 분석가가 "서구에는 어떤 사업장에 어떤 노동조합이 있고 어디에 모여 있는가"를 확인하는 데 쓴다. 전역 조인 키(사업자번호·코드 등)가 없어 다른 데이터와는 사업장명·노동조합명 같은 이름 매칭이나 소재지 주소로만 이어 쓰며, 전국노동조합표준데이터와는 같은 조합 단위 원장으로 나란히 비교하는 데 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 노동조합의 등록 현황을 제공합니다. 본 공공데이터는 인천광역시 서구 내 노동조합의 노동조합단체명, 사업자명, 소재지 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 내 다양한 산업 분야에서 활동하는 노동조합의 분포와 조직 현황을 파악할 수 있습니다. 이를 통하여 지역 내 고용환경 변화, 산업별 근로자 권익 보호 정책 추진 등 관련 행정 자료에도 활용할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
