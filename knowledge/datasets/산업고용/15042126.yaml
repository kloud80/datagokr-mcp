summary_user: 한국가스공사가 맺은 기술이전 계약을 건별로 담은 파일 데이터로, 계약마다 이전받은 업체, 이전 기술명, 구분, 등록번호를 기록한다(CSV 약 6KB 규모). 가스 분야 기업이나 연구자가 '가스공사가 어떤 특허·기술을 민간에 넘겼고 어느 기업이 받았나'를 확인해 기술 도입이나 공동연구 상대를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·기술명 같은 이름 매칭이나 기관 단위로만 이어 쓴다.
limits: 표준 조인 키(사업자번호 등)가 없어 기업 정보나 특허 DB와 자동 연결이 어렵고, 업체명·등록번호를 직접 맞춰 봐야 한다. 지역 정보가 없는 전국 단위 비공간 자료라 지역별 분석에는 쓰지 못한다.
