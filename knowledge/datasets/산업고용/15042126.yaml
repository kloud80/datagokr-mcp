description_portal: 본 데이터는 한국가스공사에서 진행한 기술이전 계약의 상세 현황을 담고 있습니다. 계약건별 기술명, 이전유형 및 이전받은 기업체명 등을 투명하게 제공합니다. 가스 산업기술 동향 분석과 협력 방안 모색에 핵심적인 정보를 제공하며, 민간의 동반성장을 위해 공사에서 개방한 지식재산권의 기술이전 현황을 제공하고 있습니다. 또한, 해당 계약현황 자료를 통해 공사에서 개발중인 주요 연구 분야와 해당 연구의 결과물들을 공개하여, 민간의 연구개발 및 공사와의 협력 방안에 대한 방향성을 제시하고 있습니다.
