summary_user: 한국가스공사가 공급하는 도시가스용 천연가스 도매요금을 용도·계절별로 원료비, 공급비용, 도매요금(원/MJ)으로 나눠 담은 전국 단위 요금표 파일(약 603바이트의 작은 CSV)이다. 사업자나 분석가가 '주택용·업무용·산업용 등 용도별로 현재 도매요금 중 원료비와 가스공사 공급비용이 각각 얼마인가'를 확인하거나 소매요금 구조를 이해할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용도 이름을 맞추는 방식으로만 연결하며, 지역×월 가스 공급·판매량 같은 에너지 사용량 데이터와 함께 볼 때도 용도명 매핑이 필요하다.
description_portal: '*도시가스용 천연가스 도매요금 자료 제공_용도별 원료비(원/MJ), 공급비용(원/MJ), 도매요금(원/MJ) 등** 상업용 중 수소제조용 원료비는 15.1411원/MJ, 수송용 중 차량충전 수소제조용 원료비는 12.1919원/MJ(기준원료비의 80%+정산단가) 적용- 천연가스 요금은 공공요금으로 도매요금과 소매요금으로 구분되며, 정부 또는 지방자치단체의 승인으로 결정됨- 도매요금은 원료비(LNG도입가+도입부대비)와 가스공사 공급비용으로 구성되며, 공급비용은 산업통상자원부의 천연가스 도매요금 심의위원회 심의 및 기재부장관 협의를 거쳐 산업통상자원부장관이 승인- 소매요금(최종소비자요금)은 도매요금(정부승인요금)과 소매 도시가스사 공급비용으로 구성되며, 공급비용은 시/도 물가대책 심의위원회 심의를 거쳐 시/도지사가 승인(발전용은 가스공사 직공급)'
