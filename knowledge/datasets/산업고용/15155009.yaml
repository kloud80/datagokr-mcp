description_portal: 한국서부발전 발전설비운영의 FLOW제어 태그데이터에 대한 합성데이터 입니다.이 데이터는 한국서부발전의 주요 발전설비 운영 과정에서 수집된 FLOW 제어 태그데이터를 기반으로 한 합성 시계열 데이터입니다. 설비의 운전상태, 유량 등 주요 제어 변수와 상·하한값을 포함하며, 설비 이상탐지 및 예지정비(Preventive Maintenance) 모델 학습에 활용할 수 있습니다. 또한 운전데이터를 시계열로 구성하여 실시간 설비운영 최적화, 효율성 분석, 이상 상황 대응 시뮬레이션 등 다양한 AI 응용에 적합합니다. 데이터는 태그 단위로 정규화되어 있으며, 시간 동기화 및 결측값 처리가 완료된 형태로 제공되어 안정적인 분석 환경을 지원합니다.
