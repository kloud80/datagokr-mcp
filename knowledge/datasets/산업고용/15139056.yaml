summary_user: 광양시 관내 태양광발전소의 소유권 양도·양수 승인 내역을 발전소 한 건씩 담은 원천 목록으로, 발전소명·주소·발전용량(kW)·양도인·양수인·양수인가일·발전원을 포함한다. 광양시에서 어떤 태양광발전소가 언제 누구에게 넘어갔는지, 거래된 발전소의 용량 규모는 어느 정도인지 확인하려는 발전사업자·투자자·지역 에너지 분석가가 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보 표준데이터 같은 허가 원장과는 발전소명이나 주소를 맞춰 붙여야 한다.
description_portal: 태양광발전소 매매거래현황 데이터는 태양광 발전소의 운영 및 소유권 이전과 관련된 거래 내역을 제공하는 자료입니다. 발전소명과 소재지, 발전용량(㎾)을 비롯해 매매 과정에서의 양도인, 양수인, 승인일자, 그리고 해당 발전소의 발전원 정보가 포함됩니다. 이를 통해 지역별 태양광 발전소의 규모와 거래 현황을 파악할 수 있으며, 신재생에너지 보급 확대 및 시장 동향을 이해하는 데 중요한 기초 자료로 활용됩니다. 또한 에너지 산업 투자 동향과 재생에너지 정책 수립을 위한 분석 자료로도 유용합니다.
