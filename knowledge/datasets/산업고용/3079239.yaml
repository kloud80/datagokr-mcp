summary_user: 경상남도 거제시에 등록된 농약판매업소를 업소 한 곳당 한 행으로 담은 건별 등록 현황 파일(csv, 약 3KB)로, 상호·도로명/지번 주소·위도·경도·전화번호·대표자명·기준일을 담는다. 거제시 농업인이 가까운 농약 판매처를 찾거나, 지자체·연구자가 관내 농약 유통업소의 분포를 지도로 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키는 없어서 다른 데이터와는 주소·좌표 기반 공간 결합이나 상호명 매칭으로만 이어 쓰며, 같은 업종 인허가(LOCALDATA) 계열이나 소상공인 상가업소 정보와 대조할 때도 이 방식을 쓴다.
description_portal: 경상남도 거제시에서 등록된 농약판매업소의 현황을 정리한 자료입니다. 본 데이터에는 각 판매업소의 상호, 주소, 전화번호, 대표자명, 기준일 등의 주요 정보가 포함되어 있어, 관내 농약 유통업체를 쉽게 파악하고 활용할 수 있습니다. 이를 통해 농업 종사자, 연구자, 공공기관 등은 지역 농약 유통망을 파악하고, 농업지원 정책 수립이나 판매업소 관리를 위한 기초 자료로 이용할 수 있습니다. 또한 기준일자 정보를 통해 등록정보의 최신성을 확인할 수 있어, 보다 정확하고 신뢰성 있는 정보 이용이 가능합니다.
