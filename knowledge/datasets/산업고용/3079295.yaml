summary_user: 경기도 광주시가 유망중소기업으로 선정한 업체를 한 행에 한 업체씩 담은 파일(CSV 약 6KB)로, 업체명·공장 소재지·주 생산품·선정년도를 담는다. 광주시 안에서 특정 품목을 만드는 유망 제조업체가 어디에 있고 언제 선정됐는지를 찾는 사업자나 지역 산업 분석가가 거래처 발굴이나 기업 분포 파악에 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업·인증 데이터와는 업체명이나 공장 주소를 맞춰 보는 방식으로만 잇는다.
description_portal: 본 데이터는 경기도 광주시에서 성장 가능성과 경쟁력을 인정받아 유망중소기업으로 선정된 업체들의 현황 정보를 제공합니다. 선정 업체의 명칭과 공장 소재지를 통해 광주시 내 우수 제조기업의 분포를 파악할 수 있으며, 주 생산품 정보는 각 업체의 주력 품목과 산업 분야를 나타냅니다. 선정년도는 해당 업체가 유망기업으로 인정받은 시점을 보여주어 기업의 성장 이력을 확인할 수 있습니다. 본 데이터는 광주시 지역 산업 생태계의 우수 기업 현황을 한눈에 파악할 수 있게 하며, 기업 간 협력 및 거래처 발굴을 위한 참고자료로 활용 가능합니다.
