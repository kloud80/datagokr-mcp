summary_user: 고용노동부 노동포털에서 온라인으로 신청할 수 있는 노동관계법·산업안전 민원서식을 서식 한 건당 한 행으로 담은 전국 단위 CSV 파일(약 55KB)로, 서식명·분류·처리기간·수수료 여부·관련 법령·구비서류·접수방법·처리기관 등을 담는다. 사업주나 근로자가 "이 신고를 하려면 어떤 서류가 필요하고 처리에 며칠 걸리며 어디에 접수하나"를 확인하거나, 분석가가 노동 민원 서식 목록을 분류별로 정리하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어 서식코드(민원서식코드)나 서식명·처리기관명을 기준으로 이름을 맞춰 연결해야 한다.
description_portal: 고용노동부 대국민 민원 사이트인 노동포털에서 노동관계법 및 산업 안전과 관련한 온라인 신청 가능한 민원서식에 대한 설명입니다.파일을 다운로드받으면 노동포털 민원서식 내용이 들어가 있습니다.파일 확장자는 csv이며, 파일 내용안에 데이터로우별 구분행을 참고해 주시기 바랍니다.데이터 건수가 많지 않아 엑셀, 메모장 등으로 모든 데이터가 표출가능하오니, 참고하여 이용해주시기 바랍니다.* 해당데이터는 노동포털에서 민원서식이 변경되거나 추가건이 있을 때마다 데이터가 추가되고 있습니다.
