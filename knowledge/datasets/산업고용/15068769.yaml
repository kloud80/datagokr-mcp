description_portal: ㅇ 「산업안전보건법」 제140조제1항에 따라 사업주는 유해하거나 위험한 작업으로서 상당한 지식이나 숙련도가 요구되는 고용노동부령으로 정하는 작업의 경우 그 작업에 필요한 자격ㆍ면허ㆍ경험 또는 기능을 가진 근로자가 아닌 사람에게 그 작업을 하게 해서는 아니 됩니다. - 「유해ㆍ위험작업의 취업 제한에 관한 규칙」 [별표 1]에 따라 유해ㆍ위험작업 종류 및 작업별 필요한 자격을 규정하고 있으며, 일부 자격 중에는 유해ㆍ위험작업 교육을 이수하여야 합니다.ㅇ 이에, 고용노동부가 지정한 유해ㆍ위험작업 교육기관의 현황 파일을 등록하오니 해당 데이터를 활용하여 필요한 정보를 확인하시기 바랍니다.  * (항목) 연번, 기관명, 업무영역, 주소명, 전화번호, 지정관서
