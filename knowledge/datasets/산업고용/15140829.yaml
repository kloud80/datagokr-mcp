description_portal: 서울특별시 광진구 담배소매업 인허가 정보는 광진구 내에서 담배를 구매하여 일반 소비자에게 판매하는 담배 소매업체의 인허가 현황을 담은 데이터입니다. 이 데이터에는 사업장명, 영업소재지, 인허가일자, 인허가번호, 대표자 성명, 영업상태(정상, 폐업 등), 취급 품목 등 주요 항목이 포함되어 있으며, 담배 판매점에 대한 지역별 분포 및 운영 현황을 파악하는 데 유용합니다. 해당 정보는 담배 유통 경로의 투명성을 확보하고, 지역별 편의시설 분석이나 상권 분석 등에 활용할 수 있습니다. 좌표정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며, 위도·경도 형태의 좌표는 포함되어 있지 않습니다. 본 데이터는 3일 전 기준의 최신 정보를 바탕으로 제공됩니다.
