description_portal: 중소벤처기업진흥공단에서 지원하는 업체 중 여성기업 지원 실적 자료입니다. 여성기업 신청요건으로는 여성기업지원에 관한 법률 제2조 및 동법 시행령 제2조에 따른 여성기업 확인서 보유기업이 해당됩니다. 증빙자료는 지방중기청에서 발급한 여성기업확인서(유효기간 내)가 있습니다.* 컬럼별 상세설명○ 업종 → 금속, 기계, 전기, 전자, 섬유, 화공, 잡화, 식료, 정보, 유통, 기타 등○ 지원금액(시설) → 여성기업 지원 현황 중 시설자금 지원실적입니다.○ 지원금액(운전) → 여성기업 지원 현황 중 운전자금 지원실적입니다. ○ 지원금액(합계_백만원) → 여성기업 지원 현황 중 지원실적 합계입니다.
