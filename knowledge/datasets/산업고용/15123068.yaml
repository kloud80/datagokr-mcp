summary_user: 한국서부발전 발전소의 호기별 일자, 사업소명, 설비 용량, 실제 송전량을 기록한 CSV 파일로, 범위는 전국(비공간)이다. 에너지 분석가가 특정 발전소·호기의 일별 송전 실적과 용량 대비 송전 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 발전설비·전력수급 데이터와는 사업소명·호기 이름 매핑이나 같은 기관 데이터로만 연결한다.
description_portal: 한국서부발전은 전국적인 전력망의 안정적인 운영을 위해 각 발전소별 송전량 데이터를 관리하고 있습니다. 발전소별 호기별 운전일, 용량, 그리고 실제 송전된 전력량 데이터를 기록하며, 이는 전력 시스템의 효율적인 운영과 관리에 활용될 수 있는 데이터입니다. 각 발전소에서 생산된 전력이 얼마나 효율적으로 전력망을 통해 전달되는지를 파악함으로써, 전력에 대한 분석 및 예측을 할 수 있는 데이터입니다. 특히, 호기별 송전량 데이터는 전력망 부하 분산 및 운영 계획 수립자료로 활용가능 합니다.제공항목은 일자,사업소명,호기,용량,송전량 데이터를 제공합니다.
