summary_user: 충청북도에 도시가스를 공급하는 업체를 관할 지역별로 정리한 소규모 파일(csv, 약 2KB)로, 업체명·관할 시군·사업소 주소·연락처·팩스·홈페이지를 담는다. 도민이나 사업자가 "우리 시군의 도시가스 공급 업체는 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명(시군 이름)이나 업체명을 이름 매핑해서만 이어 쓴다.
description_portal: '충청북도 지역 도시가스 공급 업체 정보충청북도 지역에 도시가스를 공급하는 업체 데이터를 제공합니다.(업체명, 관할 구역, 주소, 전화번호, 홈페이지, 팩스번호 등)<관할지역>10개 시군(청주,제천,보은,옥천,영동,증평,진천,괴산,음성,단양) : 충청에너지서비스(주)(충청북도 청주시  흥덕구 산단로 244(송절동))1개 시군(충주) : 참빛충북도시가스(주) (충청북도 충주시 국원대로 344(목행동 20-12))※  자세한 도시가스 공급 구역 및 도시 가스 공급을 위한 기타 안내 사항은 관할 구역 소관 업체 홈페이지 및 대표전화를 통해 문의할 수 있습니다.'
