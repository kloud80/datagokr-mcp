summary_user: 한국중부발전(주)이 발전소 온배수 관련 문서를 건별로 제공하는 API로, 한 건마다 일련번호·년월·파일제목·파일번호·파일명을 담고 조회 시작일·종료일로 기간을 지정해 조회한다. 환경 분석가나 연구자가 '특정 기간에 중부발전이 공개한 온배수 관련 문서가 무엇인가'를 확인하고 해당 문서 목록을 수집하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 발전소명 같은 이름 매핑이나 같은 기관(한국중부발전) 기준으로만 이어 쓴다.
limits: 수온·배출량 같은 측정값이 아니라 문서 목록(파일 제목·파일명)만 담으므로 온배수 수치 분석에는 바로 쓰지 못한다. 공간 정보가 없는 전국 단위 비공간 데이터이며, 개발계정 호출은 일 1,000회로 제한된다.
