summary_user: 경기도 양평군이 지정한 담배소매인(판매업소)을 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업소명·지번/도로명 주소·우편번호·지정일자·법인구분·영업구분을 담는다. 담배 판매점을 새로 내려는 사업자가 예정지 주변에 이미 지정된 소매점이 어디에 있는지 확인하거나, 분석가가 양평군 안의 담배 판매점 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 업소명·주소를 맞춰 붙여야 하며, 같은 LOCALDATA 담배소매 인허가 원장이나 소상공인 상가업소 정보와 이렇게 연결해 쓴다.
description_portal: '경기도 양평군의 담배소매인으로 지정한 현황(담배소매인 업소명, 담배소매인 업소 주소, 담배소매인 업소 전화번호) 데이터 정보입니다경기도 양평군 담배소매인 현황 안내(데이터 기준일자: 2025년 12월 29일)경기도 양평군에서는 관내 담배소매업소의 등록 및 변동 사항을 관리하고 있으며, 본 자료는 양평군에서 운영·관리 중인 **담배소매인(판매업소)**의 현황을 정리한 것입니다. 다음과 같은 항목들로 구성되어 있습니다:연번: 등록 순서에 따른 일련번호업소명: 담배소매업소의 상호업소 지번 주소: 지번 기준의 업소 위치업소 도로명 주소: 도로명 기준의 업소 위치'
