summary_user: 한국노인인력개발원 노인일자리 업무시스템에 등록된 자립형 노인일자리 사업 수행기관을 기관 한 곳당 한 행으로 담는다. 전국 1,484곳이 대상이며, 기관명·기관유형·주소·우편번호·전화·팩스를 포함한다. 어르신이나 가족이 우리 동네에서 자립형 노인일자리를 운영하는 기관이 어디이고 연락처가 무엇인지 찾거나, 분석가가 지역별 수행기관 분포와 기관유형 구성을 살피는 데 쓴다. 운영기관 코드(orgCd)는 행정표준 기관코드 체계라서 같은 코드를 쓰는 다른 노인일자리·기관 데이터와 붙일 수 있고, 주소(zipAddr·dtlAddr)로 행정구역이나 좌표 데이터와 이을 수 있다.
description_portal: 한국노인인력개발원에서 운영하는 노인일자리 업무시스템의 자립형 노인일자리 사업 수행기관 정보를 조회하는 OpenAPI이며, 자립형 일자리 수행기관 목록 조회 서비스와 수행기관 상세정보 조회 서비스로 구성되어 있습니다. 자립형 일자리 수행기관 목록 조회 서비스는 운영기관코드(orgCd), 운영기관명, 기관유형, 우편번호, 주소 등 전반적인 사업 수행기관 현황에 대한 정보를 제공하며, 자립형 일자리 수행기관 상세정보 조회 서비스는 운영기관코드(orgCd)를 필수 요청변수로 하여 운영기관코드, 기관유형, 전화번호, 팩스번호, 우편번호, 주소, 이메일 등 세부 수행기관 정보를 제공합니다.
