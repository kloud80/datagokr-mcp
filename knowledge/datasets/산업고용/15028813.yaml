summary_user: 인천 부평구에 등록된 행정사사무소를 사무소 한 곳당 한 행으로 담은 목록 파일로, 행정사 종류(일반·기술 등), 사무소 명칭, 도로명 주소, 전화번호를 담는다(csv 약 6KB). 주민이 부평구 안에서 가까운 행정사사무소를 찾거나, 분석가가 구 안의 행정사 종류별 분포와 입지를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소 명칭이나 주소를 맞춰 잇거나, 지방행정 인허가(LOCALDATA) 행정사 업종 원장과 대조해 쓴다.
description_portal: '행정사사무소의 종류, 명칭, 주소, 전화번호 등을 수록한 데이터.행정사사무소의 운영 현황을 파악하고, 주민의 민원 처리 지원, 행정 서비스 접근성 향상, 법률·행정 자문 체계 구축 및 지역 행정 인프라 관리에 활용 가능하다.활용 목적 및 특징– 행정사사무소 등록 현황 및 종류별 분포 분석– 주소 기반 입지 특성 및 행정 서비스 접근성 평가– 행정 민원 처리 지원 및 법률·행정 자문 정책 자료 활용– 주민 편의 증진 및 지역 행정 인프라 강화 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 행정사 종류: 일반행정사, 기술행정사 등 행정사 유형 구분● 사무소 명칭: 등록된 행정사사무소의 공식 명칭● 사무소 주소: 행정사사무소의 도로명 주소● 사무소 전화번호: 행정사사무소의 공식 연락처'
