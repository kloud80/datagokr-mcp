summary_user: 한국남부발전이 운영하는 발전소의 보일러를 호기 단위로 정리한 설비 원장으로, 발전소명·호기별 연소방식(미분탄 연소, 슬래그 탭 연소로 등)·회분제거방식·버너 분사형식을 담은 933바이트 분량의 소규모 CSV 파일이다. 발전설비를 연구하는 분석가가 '남부발전 발전소들의 보일러는 호기마다 연소·회분 처리 방식이 어떻게 다른가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명을 이름으로 맞추거나 같은 기관의 다른 설비 자료와 수동으로 이어 써야 한다.
limits: 발전소 코드나 주소 같은 공통 키가 없어 태양광 허가 표준데이터나 배출 측정 자료와 자동으로 결합할 수 없고, 발전소명 문자열로만 맞춰야 한다. 범위는 전국이지만 위치 정보가 없는 비공간 자료여서 지도나 지역별 분석에는 쓸 수 없다.
