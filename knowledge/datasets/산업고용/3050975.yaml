description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 2026년 6월 1일 기준 입점 업체별 브랜드 현황을 정리한 자료입니다. 각 데이터 항목은 기준일자, 품목명, 업체명, 브랜드명, 상품군으로 구성되어 있으며, 기준일자는 "2026-06-01"로 표기되어 있습니다. 품목명은 화장품, 주류, 담배, 패션잡화 등 면세점에서 판매되는 상품을 대상으로 하며, 영문과 한글 병기 형태로 기재되어 있어 국내외 사용자 모두가 식별할 수 있도록 구성되어 있습니다. 업체명은 브랜드를 입점시킨 협력사 또는 유통사를 나타내며, 브랜드명 항목에는 해당 업체가 운영하거나 유통하는 구체적인 브랜드명이 기입되어 있습니다. 상품군은 수입, 환급, 국산으로 분류되어 각 브랜드의 상품이 국내 제조품인지, 수입품인지, 또는 환급 대상 상품인지를 구분할 수 있습니다. 본 데이터는 입점 브랜드의 현황과 유통사 구성, 품목별 상품군 분포, 국산·수입 브랜드 비율 등을 분석하는 데 활용할 수 있으며, 면세점 운영 전략 수립, 브랜드 입점 정책 검토, 상품군별 마케팅 계획 설계 등에 유용한 기초 자료로 활용됩니다.
