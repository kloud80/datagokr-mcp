summary_user: 제주국제자유도시개발센터(JDC)가 운영하는 JDC지정면세점에 입점한 브랜드를 업체(협력사·유통사)별로 정리한 목록으로, 2026년 6월 1일 기준 한 시점의 현황을 품목, 업체명, 브랜드명, 상품군(수입·환급·국산) 단위로 담은 CSV 파일(약 18KB)이다. 면세점 이용객이나 입점을 검토하는 사업자, 유통 분석가가 "JDC면세점에 어떤 화장품·주류 브랜드가 들어와 있고, 국산과 수입 브랜드 비중은 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·브랜드명 같은 이름을 맞춰서만 이을 수 있다.
limits: 업체를 식별하는 사업자번호나 위치 좌표가 없어 인허가·상가 원장과 직접 결합할 수 없고, 이름 매칭에 의존해야 한다. 기준일자가 하나인 시점 자료라 입점·퇴점 추이나 브랜드별 매출은 알 수 없다. 업종 인허가 부문으로 분류돼 있지만 영업 인허가 원장이 아니라 면세점 한 곳의 입점 브랜드 목록이다.
