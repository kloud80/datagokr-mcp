description_portal: '한국원자력안전재단에서 제공하는 생활주변방사선 안전교육 운영현황으로, 수시로 제공되는 1회성 데이터입니다. 생활주변방사선 안전교육 운영현황에 대한 데이터는 대상, 구분, 2018~2024년도 횟수(회), 수료자수(명)과 같은 항목으로 구성되어 있습니다.대상은 종사자, 일반국민으로 구분되며, 감시기 운영자, 항공운송사업자, 원료물질 취급자, 생활주변방사선 교육, 체험행사로 다시 한번 구분됩니다.해당 데이터는 2024년 12월 기준으로, 2018년도부터 2024년도까지의 데이터를 제공합니다.데이터명 : 한국원자력안전재단_생활주변방사선 안전교육 운영현황_20241231파일명 : 생활주변방사선 안전교육 운영현황.csv'
