summary_user: 대구광역시 서구 관내에서 산업집적법에 따라 공장등록된 중소기업을 업체별로 한 행씩 담은 목록으로, 회사명·도로명 공장주소·전화번호·생산품을 수록한 CSV 파일(약 164KB)이다. 지역 지원사업 담당자나 분석가가 '서구에 금속가공·자동차부품·섬유기계를 만드는 공장등록 업체가 어디에 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어서 다른 데이터와는 회사명 매칭이나 주소 기반 지오코딩으로만 이어 쓴다.
limits: 공장등록된 업체만 담고 있어 서구의 모든 중소기업 현황은 아니며, 업체 규모·매출·종업원 수는 없다. 공통 기업 식별 키가 없어 인증·지원사업 데이터와 붙이면 회사명 표기 차이로 매칭이 누락될 수 있다.
