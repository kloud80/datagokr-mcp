description_portal: 골재자원으로 활용되는 기반암은 지질학적으로 암석에 해당하며 암석은 구성광물에 따라 다양한 화학조성을 나타냄, 화학조성의 특성에 따라 인체에 유해한 원소나 골재로 활용시 강도나 안전성에 영향을 주는 특성을 보이기도 함, 따라서 지화학적인 특성을 다양한 시험분석을 통해 파악하여 골재품질을 향상시키는데 그 목적이 있음, XRD는 광물조성 및 구성비, XRF는 화학조성 및 함량을 파악하는 시험이며, 알칼리골재 잠재반응성시험은 건축물 강도 유지 및 안전성, ARD는 환경 오염 및 건축물 강도, Rn(라돈)과 F(불소) 시험은 인체유해물질 배출 여부를 확인 할 수 있음
