summary_user: 한국전력공사가 운영하는 전기차 충전소의 아이디·이름·주소·위경도를 충전소 한 곳당 한 행으로 담은 CSV 파일이며, 전국 4,673행을 받았다. 전기차 운전자나 앱 개발자가 내 위치에서 가까운 충전소를 찾는 위치기반 서비스를 만들 때 쓴다. 충전소주소(address)와 위도·경도(coord)가 조인 키라서 주소 또는 좌표 기준의 다른 위치 데이터와 이어 쓴다.
description_portal: 전기차의 급격한 확대 및 친환경 자동차의 비율이 높아짐에 따라, 한국전력공사에서는 전기차 충전인프라를 운영하기 위한 전기차운영시스템을 운영하고 있습니다.이 시스템에는 전기차 충전소들의 충전소ID, 충전소명을 기준으로  위치 정보인 주소 및 위경도가 등록되어 있습니다.이를 활용하여 전기차 운전자 및 웹,앱 개발 등의 수요자분들께 가까운 충전소 찾기 및 위치기반 서비스 등 연구, 개발 등의 목적으로 활용하실 수 있습니다.한국전력공사에서 운영 중인 전기차 충전소 약 4천7백 개소를 대상으로 하는 점 참고하여 주시기 바랍니다.
