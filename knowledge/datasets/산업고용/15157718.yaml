summary_user: 한국수력원자력의 5개 원자력본부(고리·새울·월성·한빛·한울)와 각 호기의 운전상태 정보를 본부 단위로 조회해 돌려주는 API입니다. 발전 사업자나 에너지 분석가가 "지금 어느 원전 호기가 운전 중이고 어느 호기가 정지해 있는가"를 확인하는 데 쓴다. 실측 응답에서 전역 조인 키는 확인되지 않아, 다른 발전소·전력 수급 데이터와는 본부·호기 이름 매칭이나 같은 기관 코드로만 연결한다.
limits: 호출 때 필수인 원자력본부 코드(SITE_CD)는 이 API가 주지 않는 별도 코드이다. 포털 설명의 WS·KR·YK·UJ·SU 중 하나를 먼저 정해 넘겨야 한다. 개발계정은 하루 10,000회로 제한된다.
