description_portal: 한국수력원자력(주)_원자력 발전소 상태(Korea Hydro & Nuclear Power Co., Ltd._Nuclear Power Plant Status) API는 한국수력원자력 월성원자력본부, 한빛원자력본부, 새울원자력본부, 한울원자력본부, 고리원자력본부 발전소 본부 및 각 호기에 대한 운전상태 정보 제공합니다. 요청 메시지에 원자력본부 코드 WS,KR,YK,UJ,SU 중 하나를 선택하시어 호출하시면 응답 메시지 확인 가능합니다. 해당 데이터 호출에 대한 오류 발생 등에 대해서는 첨부파일 가이드 내 서비스제공자 분께 문의 부탁드립니다.
