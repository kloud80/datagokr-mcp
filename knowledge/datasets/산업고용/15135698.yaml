summary_user: 하천골재 조사 결과를 조사지역·시료 단위로 담은 파일로, 관련 하천과 하천등급, 수계코드, 기점·종점 행정구역과 하폭, 하천·퇴적물 기재, 골재 부존성을 기록하며 범위는 전국입니다. 골재 수급을 검토하는 분석가나 사업자가 특정 하천 구간에 모래·자갈이 얼마나 부존할 가능성이 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 하천명·수계코드·행정구역명을 이름으로 맞춰 하천 정보나 토석채취·골재 허가 자료와 이어 쓴다.
description_portal: 하천골재는 지적도 상의 하천에 분포하는 골재라는 특성을 갖는다. 때문에 하천 수위의 상부에 노출되는 부분과 하천 바닥의 하부에 분포하는 모래와 자갈이 부존량 산정에 포 함된다. 육안으로 확인되는 하천 둔치와 사주 등에 대해서는 측량을 통해 부존량을 산정 하고 하부는 시추조사에 의해 회수된 퇴적층을 분석하여 부존량을 산정한다. 일반적으로 계산되는 부존량은 수평의 부존면적을 시추조사를 통해 얻은 부존구간을 곱하여 체적으로 계산한다. ※ 22~25년(3개년) 골재자원정보관리시스템 고도화 추진 중으로 해당 목록은 변경 될 수 있음
