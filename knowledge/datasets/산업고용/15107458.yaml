summary_user: 한국동서발전이 운영하는 태양광 발전설비의 일일 발전량(Wh)을 기준일자(ymd)와 발전기명(pltNm)별로 담은 건별 실적 데이터이며, 포털 설명상 2021년 이후분을 제공한다. 분석가나 연구자가 '동서발전의 특정 태양광 발전기가 날짜별로 얼마나 발전했고 성능이 어떻게 변해 왔는가'를 확인하거나 발전량 예측 모델의 학습 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전기명이나 날짜를 기준으로 이름 매칭해 이어 써야 한다.
limits: 발전소 코드 같은 전역 조인 키가 없어 발전소 원장이나 기상 데이터와 연결하려면 발전기명·날짜를 직접 매핑해야 한다. 지역 구분이 없는 비공간 데이터라 지역별 집계에는 쓰기 어렵다. 호출에는 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
