summary_user: 경상북도 성주군 관내에서 토석채취 허가를 받은 사업장별로 상호·연락처·주소, 채취 용도, 허가면적·허가량, 허가 시작·종료일을 담은 건별 허가 현황 파일이며 파일 크기는 340바이트로 소량이다. 사업자나 주민이 성주군 안 어느 곳에서 어떤 용도로 얼마만큼 토석채취가 허가됐고 허가가 언제 끝나는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·우편번호를 매칭하거나 상호 이름으로 이어 쓴다.
description_portal: 본 데이터는 성주군 관내에서 토석 채취 허가를 받은 사업장의 현황을 체계적으로 정리한 자료이다. 토석 채취는 건설 자재 공급과 지역 개발에 필수적인 활동이지만, 토지 이용 및 환경 관리 측면에서 체계적인 관리가 요구된다. 본 자료는 허가 사업장의 위치, 토석채취 용도, 허가 면적, 허가 일자, 허가량, 허가 시작일 등 핵심 정보를 포함하여 이용자가 채취 활동의 범위와 현황을 명확히 이해할 수 있도록 구성하였다. 또한 토석 채취 관련 정책 수립, 환경영향 평가, 안전 관리, 지역 개발 계획 검토 등 다양한 행정 업무에 활용될 수 있도록 자료의 정확성과 설명의 일관성을 강화하였다. 이를 통해 이용자는 성주군 내 토석 채취 사업의 분포와 규모를 직관적으로 파악할 수 있으며, 향후 자원 관리 및 환경보전 정책 수립에 필요한 기초 자료로 활용할 수 있다.
