description_portal: '○ 통계개요* 통계명 : 도시가스 이용현황(용도별/동별)* 통계종류 : 서울시 도시가스 이용현황을 용도별ㆍ동별로 제공하는 일반ㆍ보고통계* 근거법령 :「도시가스사업법」에 근거한 도시가스 이용현황* 작성목적 : 각종 에너지의 공급 및 수급 현황 등을 파악하여, 에너지 자원을 효율적으로관리하고 에너지 정책수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 도시가스 및 한국가스안전공사 → 서울특별시 녹색에너지과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 각 자치구 동별ㆍ용도별(가정, 일반, 업무, 산업, 열병합,수송용) 도시가스 수급가수○ 용어설명* 도시가스 : 도시의 중앙공급원에서 도관에 의하여 각 수요자에게 보여지는 연료가스.근년에는 액화기술의 발전에 의해 천연가스를 공급함○ 기타* LNG(Liquefied Natural Gas)* 가정용에 취사용 포함됨'
