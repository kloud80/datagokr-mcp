description_portal: '한국산업기술진흥원에서 지원하는 사업의 추진 중 제작된 시제품의 현황 정보를 제공합니다. 이 데이터는 시제품의 명칭, 제작기관명, 인증명, 인증발급기관 등과 같은 다양한 정보를 포함하여, 제작된 시제품의 품질 및 진흥원 사업의 성과를 관리하고 평가하는 데 중요한 역할을 합니다. 관련 분야의 연구자와 기업들은 이 데이터를 활용하여 현재 진행 중인 시제품의 상태를 파악하고, 인증 현황을 통해 시제품의 신뢰성을 검증할 수 있습니다. 또한 관련 정책 개발 및 전략 수립에 있어 중요한 참고자료로도 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 성과발생년도, 시제품순번, 시제품의명칭, 성과유형, 제작년도, 제작기관명, 인증명, 인증발급기관, 인증번호, 인증등록년도, 등록일자. 각 컬럼은 숫자형 또는 문자형 데이터로 구성되어 있어, 체계적으로 시제품에 대한 정보를 제시하고 있습니다.'
