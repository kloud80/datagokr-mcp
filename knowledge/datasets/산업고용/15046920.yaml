description_portal: '○ 통계개요* 통계명 : 전력사용량(용도별)* 통계종류 : 한국전력공사의 서울시 용도별 전력사용량 현황을 제공하는 일반통계* 근거법령 :「전기사업법」제41조에 전력시장에 관한 정보를 공개* 작성목적 : 전력사용량 현황을 파악하여, 전력시장 운영을 효율적으로 관리하고전력관련 정책 수립에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 한국전력공사* 공표주기 : 정기(매월)* 공표범위 : 지역- 서울시내용 - 서울시 전력사용량의 용도별(가정용·공공용·서비스업·산업용) 현황○ 용어설명* 용도별 : 계약종별과 관계없이 용도 및 산업분류에 의한 분류* 통계청 한국표준산업분류에 따라 신규접수시 고객별로 부여한 용도코드에 의해 분류* 가정용 : 순수 주거용 고객(일반주택, 아파트 연립주택)* 공공용 : 관공용(정부및지자체, 산하기관), 기타 공공용(교육서비스, 뉴스공급업등) 등* 서비스업 : 수도, 전철, 사업자용(판매,송변전,건설용,발전소),순수서비스업(가정용,공공용,생산부문,수도,전철,전기사업자 이외 고객)* 농림어업 : 표준산업분류 대분류 농업 및 임업, 어업* 광업 : 표준산업분류 대분류 광업* 제조업 : 표준산업분류 대분류 제조업○ 기타* 2004년부터 구별자료로 확대* 서비스업 항목 세분화○ 출 처 : 한국전력공사'
