summary_user: 사천시 관내에서 산지관리법에 따라 허가된 토석채취 현장을 현장 1건당 1행으로 담은 허가 원장 파일입니다. 수허가자 상호, 허가지 주소, 용도, 허가면적·허가량, 허가 시작·종료일이 들어 있으며 파일 크기는 640바이트로 매우 작습니다. 주민이나 사업자가 '우리 동네 인근에서 지금 허가 기간 중인 토석채취장은 어디이고 언제까지인가'를 확인할 때, 분석가가 사천시 채석 개발 현황을 파악할 때 씁니다. 전역 조인 키는 없으므로 허가지 주소(지번·도로명)를 지오코딩하거나 필지 단위로 맞춰 국토 공간 규제 데이터나 다른 시군의 토석채취허가 현황과 이어 씁니다.
description_portal: '경상남도 사천시 관내에 허가된 토석채취 현장에 대한 상세 현황 정보를 공공데이터로 제공하고 있습니다. 이 정보는 관련 산업 및 환경 관리 분야에서 투명성과 효율성을 높이는 데 기여합니다.제공되는 주요 데이터 항목은 다음과 같습니다사무실 연락처: 허가받은 수허가자 또는 관련 기관의 문의 전화번호허가지 주소: 토석 채취가 허가된 소재지의 정확한 지번 및 도로명 주소허가 면적: 채취 활동이 가능한 총 면적의 규모용도 및 수량: 토석 채취의 목적과 허가된 수량허가 기간: 최초 허가일과 허가 종료일 등의 기간 정보이 데이터는 산지관리법에 따라 허가를 득한 자료이며, 사천시의 자원 관리 실태 및 개발 현황을 파악하는 데 중요한 기초 자료로 활용됩니다.'
