summary_user: 태백시 내 태양광발전소의 발전사업 양수·양도(매매) 거래를 발전소 건별로 담은 파일로, 발전소명·주소·용량(kW)·양수인가일·양도인·양수인·발전원을 기록한다. 태백시에서 어떤 태양광발전소가 언제 누구에게서 누구에게 넘어갔는지, 매물로 거래된 발전소의 용량과 위치를 확인하려는 발전사업자나 투자 검토자가 쓴다. 전역 조인 키가 없어 전국태양광발전소전기사업허가정보표준데이터 등 발전소 원장과는 발전소명·주소를 이름 매칭해 이어 쓴다.
