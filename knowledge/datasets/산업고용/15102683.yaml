summary_user: 인천 부평구에 등록된 대규모점포(백화점·대형마트·쇼핑센터 등)를 점포 한 곳당 한 행으로 상호·주소·업태·개설일과 함께 담은 건별 목록이며, 파일 크기가 650바이트 정도인 소규모 CSV입니다. 부평구 안에 어떤 대형 유통시설이 언제 문을 열었는지, 업태별로 어떻게 분포하는지 알고 싶은 상권 분석가나 유통 민원·정책 담당자가 쓴다. 전역 조인 키가 없어 소상공인 상가업소 원장이나 전국 대규모점포 표준데이터와는 상호·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '부평구 내에 등록된 대형 유통매장의 상호, 주소, 업태, 개설일 정보를 수록한 자료대규모점포는 일정 규모 이상의 판매시설로, 백화점, 대형마트, 쇼핑센터, 기타 유통시설 등이 포함되며, 유통정책 수립과 상권분석 자료로 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 관내 대규모 유통시설 현황 파악– 업태별 점포 분포 및 개설 시기 분석– 유통업 관련 민원 대응 및 정책 기초자료– 지역 상권 분석 및 상업시설 관리 자료 활용주요 항목 설명● 상호: 등록된 유통매장의 정식 명칭● 주소지: 점포가 위치한 지번 또는 도로명 주소● 업태: 백화점, 대형마트, 쇼핑센터, 기타 등 업종 유형● 개설일: 해당 점포가 영업을 시작한 날짜'
