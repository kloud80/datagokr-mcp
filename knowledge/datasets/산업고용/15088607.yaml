description_portal: '본 데이터는 2019년 기준 국내 주요 대학별 원자력 및 방사선 안전규제 관련 교과목 비중을 나타낸 데이터입니다. - 데이터 구성 항목 : 경희대, KAIST, 서울대, 제주대, 중앙대, 한양대의 안전규제교육 비율(%)을 나타내고 있습니다.- 출처 : 원자력안전위원회(2019) 원자력안전/규제 대학교육 강화 방안 연구, UNIST본 데이터로 대학별 교육 체계 내에서 안전규제 분야가 어느 정도 반영되어 있는지를 비교·분석할 수 있습니다. 이를 통해 대학별로 안전규제 교육 강화 수준, 교육 커리큘럼의 특성, 원자력안전 전문인력 양성에 대한 기여도를 비교하는 데 활용할 수 있습니다.'
