summary_user: 한국남부발전이 운영하는 한경풍력 발전소의 발전실적을 하루 한 행으로 담으며, 일별 총량·평균·최대·최소와 01시부터 24시까지 1시간 단위 발전량을 포함한다(포털 설명상 2013년 1월 1일~2026년 3월 31일, CSV 약 1.3MB). 풍력 발전량의 계절·시간대 패턴을 분석하거나 기상자료와 묶어 발전량 예측 모델을 만들려는 분석가가 '한경풍력은 어느 달, 어느 시간대에 가장 많이 발전하는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 날짜(년월일)와 시간대를 기준으로 기상 관측자료나 성산풍력 등 다른 풍력 발전실적과 맞춰 붙여 쓴다.
limits: 단일 발전소의 실적이라 전국·지역 단위 풍력 발전량이나 실시간 전력 수급을 대신하지 못한다. 발전소·지역 코드 같은 공통 키가 없어 다른 데이터와는 날짜나 발전소 이름으로만 연결된다.
