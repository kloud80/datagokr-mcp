description_portal: 한국가스공사 창립연도인 1987년부터 2020년까지의 천연가스 국가 총 수요실적 및 비중에 관한 시계열 통계자료 입니다. 천연가스 국가 수요는 도시가스용과 발전용을 포함한 전체 천연가스 소비량을 나타내며, 국가 에너지 수급의 종합 지표로 활용됩니다. 본 데이터는 천연가스 시장 전반 분석 및 중장기 수급 전망을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 연도별 공사 공급량, 직수입사 공급량, 총 국가 수요량, 공사 시장점유 비중 등이 포함되며, 단위는 만 톤입니다. 본 데이터를 활용하면 천연가스 수요 장기 성장 추세 분석 및 전망, 에너지원별 수요 비교 연구, 국가 에너지 수급 계획 수립 지원, 공사 사업 전략 및 시설 투자 계획 도출에 기초자료로 활용할 수 있어 국가 에너지 정책 수립과 천연가스 산업 발전 방향 도출에 기여할 것으로 기대됩니다.
