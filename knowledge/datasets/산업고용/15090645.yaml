summary_user: 월드잡플러스 해외인턴사업의 지원자 현황을 공고 단위로 담은 집계 데이터로, 인턴사업명(itrnBsnsNm)·공고번호와 지원 인원 수(cnt)를 제공하며 범위는 전국·비공간입니다. 정책 담당자나 연구자가 '어떤 해외인턴 공고·사업에 지원자가 많이 몰렸는가'처럼 해외인턴 수요를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 공고번호나 사업명을 이름으로 맞추거나 같은 기관(한국산업인력공단) 해외취업 데이터와 코드로 맞춰 이어 쓴다.
limits: 지원자 개인 특성이나 지역 단위 정보는 없고 전국 단위 공고별 인원 수만 담으므로, 참여자 특성 분석이나 지역별 비교에는 쓰기 어렵다. 이벤트성으로 생성된 뒤 바뀌지 않는 데이터로 분류되어 있어 정기 갱신을 전제로 하지 않는다.
