description_portal: 해당 자료는 대한민국 청년들이 2013년도부터 2025년도까지 일본, 미국, 싱가포르, 호주, 아랍에미리트, 중국, 캐나다, 베트남, 인도네시아, 독일, 기타국가 등에 취업한 인원을 통계자료로 작성한 것입니다.한국산업인력공단에서는 해외진출을 희망하는 청년을 대상으로 구인기업 맞춤형 교육훈련(K-Move스쿨 등)을 실시하여 해외취업 역량을 강화하고, 양질의 해외 일자리 제공을 통한 청년의 글로벌경력개발지원 및 청년실업률 완화에 기여하고 있습니다. 또한, 국가별 해외 일자리 정보 및 진출가이드, 해외진출 유관기관 연계 등 청년의 해외진출을 지원하는 정보시스템인 월드잡플러스를 운영하고 있습니다.2013년 3월 29일 대한민국 청년이 세계를 움직이는 K-Move를 추진하여 현재까지 10년 이상 대한민국 청년의 해외진출을 돕는 장으로 역할을 수행하고 있습니다.한국산업인력공단에서 수행하는 구체적 사업은 해외취업연수(K-Move스쿨), 해외취업알선, 해외일경험지원사업, 해외취업정착지원금 지급,  국내재취업지원, 해외취업촉진인프라지원, 해외통합정보망 운영 등입니다.이와 관련한 자세한 사항은 월드잡플러스 홈페이지(https://www.worldjob.or.kr)를 통해 확인할 수 있습니다.
