summary_user: 강원특별자치도 안에서 허가된 전기사업을 허가 건별로 정리한 파일 데이터로, 허가일자·상호·설비용량(kW)·설치장소·원동력종류(태양광·수력·풍력 등)·상태를 담는다(CSV 약 155KB). 투자자나 분석가가 "강원도 어느 지역에 어떤 발전원의 설비가 얼마나 허가돼 있고, 지금 운영 중인가"를 확인할 때 쓴다. 전역 조인 키는 없으므로 설치장소 주소나 상호를 이름 매핑해 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 원장과 맞춰 쓴다.
