description_portal: 본 데이터는 경상북도 경주시 관내에서 허가된 신재생에너지 기반 전기사업 발전시설의 현황을 파일 형식으로 제공하는 공공데이터이다. 신재생에너지의 보급 확대와 친환경 에너지 정책 추진을 위해 발전사업 허가 정보를 체계적으로 관리하고 있으며, 본 자료에는 발전소명, 설치장소, 용량, 허가일자, 공사계획인가일자, 사업개시일자, 데이터기준일자 등 주요 항목이 포함된다. 해당 데이터는 태양광, 풍력, 바이오 등 다양한 에너지원에 기반한 발전사업 현황을 파악하는 데 유용하며, 에너지정책 수립, 지역개발 계획, 환경영향 평가 등에 활용될 수 있다. 경주시는 본 데이터를 통해 지역 에너지 자립도 향상과 지속가능한 도시 조성에 기여하고자 한다.
