description_portal: 인공지능 제조 플랫폼(KAMP)에 무료로 개방된 중소 제조기업이 인공지능(AI) 분석에 활용할 수 있는 50종의 제조(AI) 데이터셋에 대한 정보이다. 제조데이터는 제조공정 상 효율적인 제품 개발·생산을 가능하게 하는 원동력이자 핵심 자원이다. 스마트공장 제조 현장에 축적된 제조데이터를 활용하여 중소기업의 설비·공정에서 발생하는 문제를 인공지능으로 쉽게 해결할 수 있다. 제조공정 특성 상 업종별로 공정 및 생산라인, 설비의 차이가 존재하고, 제조데이터 또한 형식이 상이하여, 다양한 업종에 적용이 가능한 업종별 인공지능 표준 모델을 구축하였다.
