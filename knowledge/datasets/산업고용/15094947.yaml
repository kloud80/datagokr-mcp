description_portal: '○ 통계개요* 통계명 : 석유류 소비량(구별)* 통계종류 : 서울시 석유류 소비량 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「석유사업법」에 근거한 원유, 천연가스 및 석유제품의 소비량* 작성목적 : 각종 에너지의 공급 및 수급 현황 등을 파악하여, 에너지 자원을 효율적으로관리하고 에너지 관련 정책수립에 필요한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 한국석유공사* 공표주기 : 정기(매년)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 석유류(휘발유, 등유, 경유, 벙커C유, 기타)의 구별 소비량 현황○ 용어설명○ 기 타* LPG는 제외* 기타는 경질중유, 중유, 용제, 항공유, 부생연료유 등임○ 출 처 : 한국석유공사 패트로넷(Petronet)'
