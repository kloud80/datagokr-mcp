description_portal: 이 데이터는 국내에서 소비된 석유제품의 실적을 연도별/제품별로 정리한 자료입니다. 항목에는 석유제품명, 소비연도, 소비량(천배럴 단위) 등이 포함되어 있으며, 이를 통해 각 석유제품의 연도별 소비 추이와 연간 수요 규모를 파악할 수 있습니다. 특정 석유제품의 연도별 수요 변화나 연료별 소비 집중 현황을 분석함으로써 정유 및 유통 전략 수립, 에너지 소비 효율성 진단, 탄소 배출량 예측 등에 활용할 수 있습니다. 이 데이터는 국가 에너지 수급 분석, 정책 수립, 산업계 수요 예측, 온실가스 감축 전략 수립 등 다양한 분야에서 기초 자료로 유용하게 활용될 수 있습니다.
