summary_user: 한국남동발전 발전소 주변 여러 측정 지역의 아황산가스·이산화질소·미세먼지 등 대기오염물질 평균농도를 발전소·지역·년월·물질별 값(농도값)으로 담은 API이며, 범위는 전국 시군구 단위로 표시된다. 발전소 인근 주민이나 환경 분석가가 "우리 동네 발전소 주변 공기질이 환경 기준치 이내로 관리되고 있는가"를 월별로 확인하는 데 쓴다. 전역 조인 키는 없어 발전소코드·발전소명이나 지역명을 이름 매핑해 다른 발전사 배출 측정 데이터나 환경·기상 측정 데이터와 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑 또는 같은 기관 코드로만 연결된다. 개발계정은 하루 1,000회 호출 한도가 있다.
