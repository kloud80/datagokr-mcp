description_portal: 해당 데이터는 한국남동발전에서 제공하는 발전소 주변 농도 현황입니다. 발전소별로 발전소 주변 농도 현황에 관한 데이터를 제공하고 있습니다. 발전소의 각 발전기(호기)별로 아황산가스(SO₂), 이산화질소(NO₂), 미세먼지(PM10) 등 물질에 대한 평균농도값 데이터를 포함하고 있으며, 환경 기준과 비교하여 기준 적합 여부를 확인할 수 있습니다. 이 데이터를 활용하여 발전소 주변 여러 지역의 공기질이 법적 기준치 이내로 안전하게 관리되고 있는지 확인할 수 있으며 이를 통해 기관의 환경 기준 준수 여부를 파악할 수 있습니다.
