summary_user: 이러닝(에듀테크) 사업자 신고확인서 발급 건별로 회사명, 본사·지점 소재지, 확인서 발급일을 담은 전국 범위 파일(CSV 약 39KB)이다. 정책 담당자나 시장 분석가가 연도별·지역별로 이러닝 사업자 신고확인서가 얼마나 발급됐는지, 사업자가 어느 지역에 몰려 있는지 파악하는 데 쓴다. 사업자등록번호 같은 공통 조인 키가 없어 다른 기업 인증·현황 데이터와는 회사명이나 소재지 문자열 매칭으로만 이어 쓴다.
description_portal: 본 자료는 국내 이러닝(에듀테크) 산업과 관련된 사업자들의 신고확인서 발급 현황에 대한 조사가 필요하다는  전문가들의 의견을 반영 및 민원인의 해당자료 제공요청을 수용하여 작성된 것으로, 전국 각 지역에 위치한 사업자들의 회사명, 본사 및 지점 소재지, 확인서 발급일 등 주요 정보를 포함한다. 이를 통해 연도별·지역별 발급 추이와 사업자 분포, 신규·갱신 발급 현황을 종합적으로 파악할 수 있으며, 산업 규모 산정, 정부정책 수립, 시장동향 분석, 연구 참고자료 활용등 다방면으로 활용 가능하도록 구성하였다.
