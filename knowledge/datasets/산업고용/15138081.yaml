description_portal: 신용보증재단중앙회의 개인보증(햇살론, 근로자햇살론)에 대한 데이터로 개인보증 제도 운영 시 보증료 발생분을 재계산하여 관리하는데 이 과정에서 발생한 수입금 내역을 항목별로 구분한 정보입니다. 개인정보보호를 위해 개인을 특정할 수 없도록 고유문자로 변환해 제공합니다보증번호별 단위이며 제수입금구분값, 보증료발생금액, 보증료잔액, 수납완료구분값 등의 내용으로 구성되어 있습니다. 개인보증이란 사업자가 아닌 금융취약계층의 개인을 대상으로 보증을 제공해 대출 접근성을 높이는 제도로 2016년 9월에 서민금융진흥원으로 이관되어 본 데이터는 2015년 이전 정보만을 포함하고 있습니다.
