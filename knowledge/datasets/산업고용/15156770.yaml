description_portal: 본 데이터는 한국수력원자력의 협력 중소기업 정보화지원사업에 관한 데이터입니다. 정보화지원사업은 한수원 협력중소기업을 대상으로 하는 동반성장 프로그램 중의 하나로, 중소기업의 정보화 지원 및 한국수력원자력이 개방한 공공데이터를 활용한 신규 비즈니스 창출 등을 지원하며 2020년부터 원전 생태계 유지 및 발전을 위해 시행하고 있습니다. 제공항목은 번호, 기업명, 사업명, 사업내용, 사업대상, 사업비중 보조금액, 관계규정으로 구성되어있으며 사업비중 보조금액 제공항목의 단위는 "원"입니다.
