summary_user: 한국수력원자력이 방사성동위원소 사용 시설에서 주기적으로 잰 방사능 측정 기록을 측정 건별로 담은 파일 데이터로, 2020-01-02부터 2024-10-10까지 전국 14,840행이다. 시설 안전 담당자나 분석가가 특정 시설·측정지점의 베타·중성자·표면오염·공기오염 값이 시기별로 어떻게 달라졌는지 확인하는 질문에 쓴다. 필드에 전역 조인 키와 코드표가 없어 다른 데이터와는 사업소명·시설명 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
description_portal: '"방사성동위원소를 사용하는 시설의 주기적인 방사능 측정결과" 데이터는 해당 시설의 방사선 안전 관리를 위해 수집된 중요한 정보입니다. 이 데이터에는 측정일자, 측정주기, 시설명, 측정지점, 베타값, 중성자값, 표면오염도 및 공기오염도 등 다양한 방사선(능) 값이 포함되어 있습니다. 이를 통해 각 시설의 방사선 수준을 정기적으로 모니터링하고, 안전 기준 준수 여부를 확인할 수 있습니다. 또한, 데이터 분석을 통해 방사선 노출 위험을 사전에 파악하고, 필요 시 조치를 취할 수 있어 방사선 안전 확보와 사고 예방에 큰 도움을 줍니다.'
