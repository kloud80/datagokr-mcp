description_portal: 한국전력공사에서 운영중인 전기차 충전기에 대한 고유 식별 코드 정보입니다.충전소ID, 충전소명, 충전기ID, 충전기명 항목과 함께 한국환경공단 연계코드와 한전의 관리코드가 포함되어 있습니다.기관별로 상이하게 관리되는 충전기 정보를 연계하고 서로 다른 시스템간의 상호운용성을 확보하기 위한 기준정보입니다.사용자는 해당 데이터를 활용해 다양한 충전관련 데이터와 결합해 분석할 수 있으며 한전의 충전기 사용량 데이터와 결합하여 특정 지역의 충전기 이용률을 비교하거나, 충전기 설치 위치에 따른 사용자 분포를 파악하는 등 종합적인 인프라 분석에 활용할 수 있습니다.
