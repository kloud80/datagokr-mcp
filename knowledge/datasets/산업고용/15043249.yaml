description_portal: 한국남동발전에서 진행 중인 건설사업에 대한 추진 경위입니다. 공사명, 추진경위일, 추진경위 등의 정보를 포함하고 있습니다. 사업의 종류로는 환경설비개선 건설공사, 건설사업, 설비개선사업 등이 존재하며 추진 경위로는 환경설비 개선사업 기본계획 확정, 환경영향평가 용역 계약, 산단 실시계획 불승인, 보일러 및 부대설비 입찰 공고, 제4차 전력수급기본계획 전력정책심의회 원안 가결, 부지조성공사 착공, 주설비 건설공사 착공 등이 있습니다. 해당 자료를 활용하여 유사 사업별 추진 경위를 확인할 수 있으며, 해당 사업의 리스크를 사전에 관리하는 데 활용할 수 있습니다.
