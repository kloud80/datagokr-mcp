summary_user: 2019년 기준 수출바우처사업에서 우수 수행기관으로 선정된 기관을 신청 분야(디자인 개발, 브랜드 개발·관리, 해외 마케팅 등)별로 수행기관명과 연락처로 정리한 소규모 목록 파일(csv, 약 1.3KB)이다. 수출바우처에 참여하려는 중소기업이 '해외 마케팅 분야에서 우수 평가를 받은 수행기관이 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 수행기관명을 이름으로 맞춰서만 이어 쓸 수 있다.
limits: 2019년 기준 한 시점의 목록이라 현재 우수 수행기관 현황이나 연도별 변화는 알 수 없다. 기관 식별 코드나 사업자번호가 없어 기업 인증·지원사업 데이터와 직접 연결되지 않고, 이름 매칭에 의존해야 한다.
