summary_user: 경상북도 영주시 관내에 등록된 행정사 사무소를 사무소 한 곳당 한 행씩 담은 원천 목록으로, 사무소명칭·영업상태·신고일자·소재지·전화·팩스·데이터기준일자를 담는다(CSV 667바이트의 소규모 파일). 영주시민이 서류 작성이나 인허가 신청 대행을 맡길 행정사 사무소를 찾을 때, 또는 분석가가 시군구별 행정사 사무소 분포와 영업 현황을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소명칭이나 소재지 주소를 매핑해 잇거나, 같은 지방행정 인허가(LOCALDATA) 계열의 다른 업종 목록과 기관 단위로 나란히 놓고 쓴다.
description_portal: '"행정사법"에  의거 등록된 행정사들이 영주시 관내에서 운영하는 행정사 사무소에 대한 기본 정보를 수록한 공공데이터 입니다.행정사는 행정기관에 제출하는 서류의 작성, 신청청구의 대리, 사실관계 확인 등 행정업무의 일정 부분을 민간 차원에서 대행할 수 있도록 허가된 전문자격사입니다.본 데이터는 사무소 명칭, 대표 행정사, 신고일자, 소재지 등의 항목으로 구성되어 있으며 지역 내 행정사 사무소 운영 현황을 파악하여 시민들의 행정 접근성 향상, 대민 서비스 선택권 확보 등의 용도로 활용될 수 있습니다.'
