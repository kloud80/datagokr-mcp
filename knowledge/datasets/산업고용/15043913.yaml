summary_user: 광주광역시(현 전남광주통합특별시)에 등록된 전기공사업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 등록번호·상호명·대표자·전화번호·소재지 주소를 제공한다. 전기공사를 맡길 사업자가 관내에 등록된 전기공사업체인지 확인하거나, 분석가가 지역별 전기공사업체 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·소재지 주소를 맞추는 방식으로만 이어 쓰며, 같은 세부 부문의 다른 에너지 업종 인허가 원장(석유판매·가스·전력기술 등)과 나란히 보는 보조 자료로 쓴다.
limits: 전역 조인 키가 없어 사업자등록번호 등으로 다른 데이터와 정확히 연결할 수 없고, 이름·주소 매칭에 의존해야 한다. 범위는 광주 관내 한 시도에 한정된다.
