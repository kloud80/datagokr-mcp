description_portal: 광주광역시 전기공사업체 현황전기공사는 전기공사업법 제3조(전기공사의 제한 등)에 따라 전기공사업자가 아니면 도급받거나 시공할 수 없습니다, 이에 전기공사업법 제4조(공사업의 등록) 제1항에 따라 광주광역시 관내에 전기공사업의 등록을 하려는 자는 기술능력 및 자본금 등을 갖추고 광주광역시에 등록하여야 하며 광주광역시는 제1항에 따른 등록을 받았을 때에는 등록증과 등록수첩을 발급하여 교부하고 관내 전기공사업체의 등록대장을 관리합니다.광주광역시에 등록된 전기공사업체 현황 정보로 등록번호, 상호명, 대표자, 전화번호, 소재지 항목을 제공합니다.
