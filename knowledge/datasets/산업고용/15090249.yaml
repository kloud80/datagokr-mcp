summary_user: 한국서부발전 평택발전소 주변에서 측정한 기온·상대습도·기압·풍향·풍속을 측정일시별로 기록한 측정 원천 파일(csv, 약 48KB)이다. 발전소 주변 주민이나 환경 분석가가 특정 기간 평택발전소 인근의 바람 방향과 세기를 확인해 대기오염물질이 어느 쪽으로 퍼졌을지 가늠하는 데 쓴다. 전역 조인 키가 없어 같은 발전소의 대기오염물질 배출 측정 자료나 기상청 관측자료와는 측정일시와 발전소명을 기준으로 맞춰 이어 쓴다.
