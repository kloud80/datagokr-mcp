summary_user: 청년창업사관학교 졸업기업의 사업장 소재지를 광역자치단체별로 묶어 2020~2025년 연도별 기업 수 총계로 담은 집계표이며, 파일 크기는 463바이트의 작은 CSV입니다. 지역 창업정책 담당자나 분석가가 '청년창업사관학교 졸업기업이 어느 시·도에 많이 자리 잡았고 연도별로 어떻게 달라졌나'를 확인할 때 쓴다. 전역 조인 키가 없어 시·도 이름을 행정구역 코드표에 맞춰 지역별 창업기업·사업체 통계와 이어 붙여야 한다.
description_portal: 중소벤처기업진흥공단의 청년창업사관학교 졸업기업 관련 데이터로 졸업기업의 각 연도별 사업장 소재지(광역자치단체별) 현황(총계)을 파악할 수 있는 데이터입니다. 2011년부터 중소벤처기업진흥공단에서 운영하고 있는청년창업사관학교는 창업 3년 이내이며 대표자가 만 39세 이하인 청년 스타트업을 대상으로 지원하는 청년창업지원사업입니다. 청년창업사관학교 입교시 사업화지원금과 창업코칭 및 교육, 창업공간, 공단사업 연계지원 등 창업에 필요한 다양한 지원을 제공받을 수 있습니다.
