summary_user: 전라남도 영광군 안의 문화유통업소를 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 상호·도로명 소재지·전화번호·시설면적·업종명·등록(신고)일자를 담는다. 영광군에서 음반·영상물 등 문화상품을 유통하는 업소가 어디에 몇 곳 있고 언제 등록했는지 확인하려는 주민·사업자, 지역 문화상권을 보려는 분석가가 쓴다. 전국 공통 조인 키(사업자번호·업소 고유번호 등)가 없어 다른 데이터와는 상호·주소 문자열 매칭으로 잇거나, 같은 군의 다른 LOCALDATA 업종 인허가 현황과 주소 기준으로 나란히 비교해 쓴다.
