summary_user: 경기도 시군별로 기준연도·기준월마다 성별·학력·연령 구분에 따른 노인 수와 노인 일자리 수를 담은 집계 자료다. 지자체 고령정책 담당자나 분석가가 '우리 시군은 노인 수에 비해 일자리가 다른 시군보다 적은가'를 비교하고 예산 배분 근거를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 시군명(sigun_nm)과 기준연월을 이름으로 맞추는 방식으로 시군별 노인인구·복지 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 노인 인구의 일자리 현황을 기준년도와 기준월 단위로 수록한 자료로, 시군명, 성별, 노인 수, 일자리 수 등의 항목으로 구성되어 있습니다. 노인 대상 일자리의 성별 분포 및 지역별 제공 규모를 파악할 수 있으며, 고령화 대응 정책 수립, 사회참여 확대 전략 마련, 노인복지 예산 배분의 기초 자료로 활용될 수 있습니다. 특히 일자리 수치를 통해 지역 간 일자리 지원 편차와 고령친화도시 조성 성과를 분석할 수 있어 지방정부의 정책 성과 측정 및 복지 수요 예측에도 유용하게 활용할 수 있습니다.
