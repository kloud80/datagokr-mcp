summary_user: 한국남동발전 발전소의 발전기(호기)별 월별 발전 실적을 담은 API로, 호기마다 설비용량(MW), 정상운영 발전량(MWh), 감소전력(MW), 발열량(Mcal), 발전원 구분을 기록한다. 연구자나 에너지 분석가가 "남동발전 특정 발전소·호기의 설비용량 대비 실제 발전량, 즉 이용률은 월별로 얼마인가"를 따질 때 쓴다. 전역 조인 키는 없으므로 같은 기관 데이터와는 발전소코드(orgNo)·호기코드로, 다른 기관의 발전소·전력시장 데이터와는 발전소명·발전원명 매핑으로 이어 쓴다.
description_portal: 해당 데이터는 한국남동발전에서 제공하는 월별 발전 실적 현황입니다. 한국남동발전의 발전소별 월별로 발전 실적에 관한 데이터를 제공하고 있습니다. 발전소의 각 발전기(호기)별로 용량(Mw),  발전량(Mwh), 감소전력(Mw), 발열량(Mcal) 등의 핵심 데이터를 포함하고 있습니다. 연구기관에서는 해당 데이터를 활용하여 설비용량 대비 실제 발전량을 통해 설비 이용률과 신뢰도를 평가할 수 있으며, 발열량 데이터를 통해 한국남동발전의 에너지 사업 효율성을 분석하여 분석 결과를 연구 개발 기초자료로 활용할 수 있습니다.
