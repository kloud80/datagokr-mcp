summary_user: 한국수력원자력이 운영하는 고리·한빛·월성·한울 원자력본부별로 취수구와 배수구의 실시간 수온·염분을 담은 발전소 단위 측정 API다. 발전소 주변 해역 환경을 보는 분석가나 주민이 '특정 원전의 배수구 수온이 취수구보다 지금 얼마나 높은가'를 확인하는 데 쓴다. 전역 조인 키는 없어 발전소 이름이나 같은 기관의 발전소 코드로만 다른 데이터와 잇고, 해양·기상 관측 같은 환경기상 데이터와 발전소 이름 기준으로 맞춰 보는 용도에 쓴다.
description_portal: “원자력발전소 실시간 온배수현황” API는 한국수력원자력㈜이 제공하는 공공데이터 서비스입니다. 이 API는 한국수력원자력에서 운영중인 원자력발전소(고리원자력본부, 한빛원자력본부, 월성원자력본부, 한울원자력본부)의 실시간 온배수 현황자료를 XML 형식으로 제공합니다. 발전소코드 파라미터를 이용하여 각 발전소의 실시간 취수구 수온, 취수구 염분, 배수구 수온, 배수구 염분 현황을 조회할 수 있습니다. 이 오픈API 서비스를 통해 발전소별 온배수의 수온 및 염분 변화를 모니터링 할 수 있고 온배수 관리정책 수립, 환경영향평가 등에 활용할 수 있습니다. 평소와 다른 온배수 수온·염분 변화 탐지 시 즉각적인 대응 체계 구축에 활용할 수도 있습니다. 개발계정 기준으로 10,000회 호출이 가능합니다. 운영계정은 활용 사례 등록을 통해 트래픽 증가가 가능합니다.
