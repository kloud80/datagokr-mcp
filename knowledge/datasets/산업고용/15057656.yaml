summary_user: 경기도 내 시군별 산림조합과 산림조합중앙회 경기지역본부를 조합 1곳당 1건으로 담은 현황 목록으로, 조합명·관할 시군·전화·팩스·도로명/지번 주소·우편번호·위경도를 포함한다. 산주나 임업인이 "우리 시군의 벌채·조림·임산물 유통 상담은 어느 산림조합에 문의해야 하나"를 찾거나, 분석가가 경기도 내 조합 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없으므로 시군명·시군코드(SIGUN_CD)로 같은 기관(경기도) 데이터와 맞추거나 위경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 산림녹지과에서 제공하는 자료로, 경기도 내 각 시군에 설치된 산림조합 및 산림조합중앙회 경기지역본부의 현황을 포함합니다. 각 산림조합의 명칭, 관할 시군, 전화번호, 팩스번호, 주소(도로명·지번·우편번호), 위도·경도 정보가 제공되며, 산림경영 지원, 벌채·조림·임산물 유통 등 산림자원 관리 기능을 수행하는 조직 현황을 담고 있습니다. 본 데이터는 산림 기반 행정 서비스 제공, 지역 산림정책 수립, 조합 분포 분석, 산림경제 연구 등에 활용할 수 있으며, 수시로 갱신되며 상업적 이용 및 콘텐츠 수정이 가능합니다.
