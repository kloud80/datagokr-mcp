description_portal: '본 데이터는 직업정보 표준화를 위해 구축된 직종코드 3단계 분류체계로, 산업 및 고용 서비스에서 사용하는 직종 분류 기준을 제공합니다. 분류 체계는 대분류(1Depth: 1자리 코드), 중분류(2Depth: 3자리 코드), **소분류(3Depth: 6자리 코드)**로 구성되어 있으며, 각 항목은 고유한 카테고리 ID를 통해 관리됩니다.해당 분류는 직업군을 체계적으로 나누어 고용정보 통계, 직업훈련 과정 편성, 구인·구직 매칭 등에 활용되며, 다양한 직업군에 대한 정렬된 정보 제공을 통해 데이터 분석과 정책 수립의 기반을 마련합니다.데이터는 파일 형태로 제공되며, 데이터베이스 설계 및 시스템 내 코드 연계 시 활용도가 높습니다.'
