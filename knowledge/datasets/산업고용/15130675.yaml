description_portal: '이 데이터는 「산업재해보상보험법 시행규칙」 제13조에 따라 지급되는 간병료*와 관련하여, 간병의 범위와 이에 따른 세부 적용 등급(1등급, 2등급, 3등급)을 정의한 기준 정보입니다. 「산업재해보상보험법 시행규칙」 제11조에 명시된 간병의 범위와 같으며, 간병은 근로자가 업무상의 사유로 부상이나 질병에 걸려 요양 중 다른 사람의 간병이 의학적으로 필요하다고 인정되는 경우에 제공됩니다. 간병이 필요한 상태는 두 손가락을 모두 잃어 식사가 불가능한 경우, 두 눈 실명 등으로 일상생활이 불가능한 경우, 뇌 손상으로 정신이 혼미한 경우, 심한 화상, 하반신 마비로 인한 배뇨·배변 및 욕창 방지 조치가 필요한 경우 등 시행규칙 제11조 각 호에 따른 10가지 구체적인 신체 및 정신 상태 기준으로 명시됩니다. 이 자료는 산재 근로자가 요양 중 간병이 필요한 정도에 따라 공정하고 합리적인 간병료를 받도록 보장하는 행정 기준을 투명하게 공개하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산재보험 간병료 지급의 적정성 검토 및 요양 서비스 연구에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 간병 필요 등급별 수급 현황 및 지급액을 분석함으로써, 간병료 지급 기준이 근로자의 실제 간병 수요를 적절히 반영하고 있는지 평가할 수 있습니다. 이를 통해 간병이 필요한 중증 산재 근로자에게 충분하고 합리적인 지원이 이루어지도록 제도를 개선하는 방안을 모색할 수 있습니다. 또한, 이 통계는 간병 필요 상태와 장해 상태 간의 관계를 분석하여 산재 요양 및 재활 서비스의 통합적 지원 체계를 구축하는 데 기여할 수 있다고 판단됩니다.* 간병료 : 근로자가 업무상의 사유로 부상을 당하거나 질병에 걸린 경우 그 근로자에게 지급하는 요양급여의 일종으로, 자세한 내용은 「산업재해보상보험법 시행규칙」 제3절(요양급여의 범위 등) 참고'
