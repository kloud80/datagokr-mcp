summary_user: 경상북도 김천시 관내에서 영업 중인 LPG 충전소를 한 곳씩 담은 시설현황 파일로, 상호명·대표자·도로명주소·위도·경도·전화번호·데이터기준일을 담는다(약 2KB 규모의 소량 CSV). 김천시 시민이나 방문객, 물류 사업자가 'LPG 차량을 김천 어디에서 충전할 수 있나'를 확인하거나 지도 앱·경로 안내에 충전소 위치를 올릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소·좌표로 공간 매칭하거나 상호명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경상북도 김천시 관내에서 영업 중인 LPG(액화석유가스) 충전소의 위치 및 연락처 정보를 포함한 시설현황 자료입니다.시민과 방문객이 가스연료 차량(LPG 차량 등)의 연료 충전을 효율적으로 계획할 수 있도록 정보 접근성을 높이는 것을 목적으로 공개됩니다.데이터에는 각 충전소의 정확한 도로명주소, 위도·경도 좌표 정보, 대표 전화번호가 포함되어 있으며,네비게이션 서비스, 지도 기반 위치 안내 앱, 응급차량·물류차량 경로 최적화,에너지 기반 인프라 분석 등의 다양한 행정·산업적 목적에 활용할 수 있습니다.
