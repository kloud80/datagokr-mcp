summary_user: 한국남부발전이 수행한 연구개발 과제를 과제 한 건 단위로 담으며, 과제번호·과제명·진행상태·연구기간·연구기관·주관부서와 총연구비·남부발전 현금/현물 개발비·투자비율·누적집행비용(천원)·연구분류를 포함한다. 연구자나 협력 희망 기업이 '남부발전이 가스터빈 성능개선이나 수소 연료 관련 과제를 어느 연구기관과 얼마의 예산으로 진행했나'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으므로, 연구기관명(coopcdnm)·과제명 같은 이름 매칭이나 같은 기관의 다른 데이터와 연결해 쓴다.
limits: 전역 조인 키가 없어 다른 기관의 R&D·기업 데이터와 정확히 연결하기 어렵고 이름 매칭에 의존해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 10,000회로 호출이 제한된다.
