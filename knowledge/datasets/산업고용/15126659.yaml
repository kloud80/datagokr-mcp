description_portal: '건축 관련 제조·생산업체의 기본 정보를 업종별로 정리한 데이터로, 업체별 상호, 대표자, 소재지, 연락처, 업종 분류, 주요 생산품을 한눈에 확인할 수 있도록 구성된 자료입니다.업체명: 건축자재·부품·설비 등을 생산·공급하는 업체의 공식 상호로, 사업장 이름을 의미합니다.대표자: 해당 업체의 대표이사·사업주 등 법적 대표자의 성명을 나타냅니다.소재지: 공장 또는 영업장이 위치한 주소 정보로, 입지 분석·지도 서비스 연계·현장 점검 등에 활용됩니다.전화번호: 업체에 문의·발주·협력 상담 등을 할 수 있는 대표 연락처를 제공합니다.업종명: 건축업체가 수행하는 주된 업종을 구분한 항목으로, 건축자재 제조, 금속가공, 창호·유리, 설비자재 등 산업 분류 정보를 포함합니다.생산품: 각 업체에서 실제로 생산하거나 취급하는 주요 제품 목록으로, 콘크리트 제품, 철강자재, 목재·패널, 창호, 단열재, 배관·전기자재 등 구체적인 품목을 기록합니다.이 데이터는 지역 내 건축 관련 제조업체 분포와 업종 구조, 품목 특성을 파악하고, 건설 프로젝트 자재 수급 계획, 산업 생태계 분석, 중소기업 지원 정책, 민간 발주·조달시장 조사, 관련 기업 네트워크 구축 등에 활용할 수 있는 기초 자료입니다.'
