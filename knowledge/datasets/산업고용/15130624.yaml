description_portal: '한국산업기술진흥원의 사업 추진과 관련하여 원활한 사업 지원 및 사업 고도화를 위해 구축된 시설 구축현황 및 활용 정보를 제공합니다. 본 데이터는 산업 기술의 발전을 촉진하고 다양한 연구개발 활동에 귀중한 자원으로 작용할 수 있습니다. 예를 들어, 학술 연구자들은 이 데이터를 통해 특정 시설의 운영 현황과 이용 패턴을 분석하여 연구 방향을 설정할 수 있습니다. 이 데이터는 다음과 같은 구조로 이루어져 있습니다.구축순번(숫자형) : 각 시설의 고유 번호성과발생년도(숫자형) : 해당 시설과 관련된 성과가 발생한 연도접수번호(문자형) : 사업 지원 요청 시 접수된 고유번호로, 이력을 추적하는 데 사용시설명칭(문자형) : 시설의 이름구축년도(숫자형) : 시설이 구축된 년도구축장소(문자형) : 시설이 위치한 지리적 정보시설운영인원 수(숫자형) : 해당 시설을 운영하는 인원의 수를 나타내며, 각 시설의 규모를 파악하는 데 유용총 활용건수(숫자형) : 해당 시설의 총 활용 건수등록일자(날짜형) : 데이터가 등록된 날짜'
