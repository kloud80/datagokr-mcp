description_portal: '한국수력원자력㈜은 CFSI 예방 세미나 참여 업체 현황 데이터를 공개합니다. 위모조품 및 의혹자재(CFSI: Counterfeit, Fraudulent, Suspect Items)란 진품이 아닌 모든 품목을 총칭하며 자재의 외관, 성능, 재질, 특성, 관련문서 등이 공급자 또는 제조사에 의해 고의로 다르게 공급된 자재를 모조품(Counterfeit Item), 품질서류가 다르게 공급된 자재를 위조품(Fraudulent Item), 위모조품이 공급되었을 가능성이 있는 자재를 의심품목(Suspect Item)이라고 합니다. 한국수력원자력(주)은 위모조품 근절과 CSFI 검증체계 정착으로 원전안정성 확보에 기여하고자 CSFI 예방 세미나에 참여하고 있습니다.해당 데이터는 CSFI 예방 세미나에 참여한 업체들의 회사명, 회사전화, 주소 정보를 포함하고 있습니다.'
