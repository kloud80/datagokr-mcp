summary_user: 서울 강서구 무료직업소개소의 인허가 정보를 사업장 한 곳당 한 행으로 담는 건별 원천 데이터로, 인허가일자(LCPMT_YMD)·영업상태·폐업일자·소재지 주소·좌표·법인구분이 들어 있다. 구직자나 지역 고용 분석가가 "강서구에서 지금 영업 중인 무료직업소개소는 어디이고 언제 문을 열거나 닫았나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OGDP_INST_CD)로만 잇고, 좌표(XCRD·YCRD)와 주소로 다른 고용 서비스 기관 목록과 위치 기준으로 맞춰 본다.
description_portal: 서울시 강서구에 위치한 무료직업소개소의 설치 및 운영에 관한 인허가 정보를 담은 데이터로, 지역 내 구직자와 구인자의 고용 연결을 촉진하기 위한 목적으로 수집된 행정정보입니다. 주로 고용지원 정책의 일환으로 제공되며, 직업알선, 채용상담, 구인정보 제공 등의 공익적 서비스를 제공하는 비영리기관 또는 공공기관의 직업소개소 운영 현황을 파악할 수 있습니다. 해당 데이터는 기관별 인허가 일자, 상태, 취소 여부 등 운영 이력을 포함하여 정책 수립 및 지역 노동시장 분석에 유용하게 활용될 수 있습니다.
