summary_user: 국민취업지원제도를 함께 운영하는 전국 민간위탁·협력 운영기관의 기관명·주소·우편번호·연락처·관할지역과 전년도 기관평가등급, 전년도 취업률, 월급여 229만원 이상 일자리 취업률을 기관 한 곳당 한 행으로 담은 CSV 파일(약 66KB)이다. 구직자가 내 지역을 관할하는 운영기관과 연락처를 찾거나, 분석가가 지역별 운영기관의 평가등급과 취업 성과를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 고용 서비스 기관·고용센터 자료와는 기관명이나 주소·관할지역 같은 이름 매칭으로만 잇는다.
description_portal: 이 자료는 청년일자리올인원지원서비스의 일환으로, 한국고용정보원이 수행 중인 국민취업지원제도와 관련된 운영 기관들에 대한 정보를 소개합니다. 국민취업지원제도는 취업을 희망하지만 일자리를 찾기 어려운 구직자에게 맞춤형 취업지원서비스와 소득 지원을 함께 제공하는 통합 고용안전망입니다. 이 제도는 고용센터를 중심으로 지역 내 민간위탁기관, 전문상담기관, 청년맞춤형 운영기관 등 다양한 협력기관과 함께 운영되고 있습니다. 각 기관은 참여자 상담, 취업역량 진단, 직업훈련 연계, 일경험 제공 등 다양한 역할을 수행하며, 워크넷이나 국민취업지원제도 누리집을 통해 지역별 운영기관 현황 및 참여 방법을 확인할 수 있습니다.
