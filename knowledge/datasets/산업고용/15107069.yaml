description_portal: 「중소벤처기업진흥공단 2021년 지자체 비대면 수출상담회 참여기업 주요현황」은 지자체가 주관하여 비대면 방식으로 추진된 수출상담회에 참여한 국내 중소기업의 상담 실적을 정리한 데이터입니다. 기업명, 주요 수출품목, 소재지, 상담액(천불), 상담건수 등 정보를 포함하고 있으며, 코로나19 이후 비대면 교역 환경에서 중소기업의 해외시장 개척 성과와 특성을 파악할 수 있습니다. 본 데이터는 참여기업별 상담성과를 기반으로 정책 연구, 지역별 산업 특화 전략 수립, 온라인 수출지원 사업 평가 및 개선 등에 활용될 수 있으며, 향후 비대면 무역지원 체계 고도화에도 기초자료로 제공됩니다.
