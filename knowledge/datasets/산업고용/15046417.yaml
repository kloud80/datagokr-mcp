description_portal: '○ 통계개요* 통계명 : 연령별 취업자* 통계종류 : 경제활동참가자 중 취업자 현황을 연령별로 제공하는 지정ㆍ표본통계* 작성목적 : 국민의 경제활동 즉 국민의 취업, 실업 등과 같은 경제적 특성을 조사하여거시경제분석과 인력 자원의 개발정책 수립에 필요한 기초자료인 노동공급,고용구조, 가용노동시간 및 인력자원 활용정도를 제공하고 정부의 고용정책입안 및 평가에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사담당자 → 지방통계청(사무소) → 통계청* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울시 경제활동참가자 중 취업자의 연령별, 성별 현황○ 용어설명* 취업자- 조사대상 주간 중 수입을 목적으로 1시간 이상 일한 자- 자기에게 직접적인 이득이나 수입이 오지 않더라도 자기가구에서 경영하는 농장이나사업체의 수입을 높이는 데 도운 가족종사자로서 주당 18시간이상 일한 자(무급가족종사자)- 직장 또는 사업체를 가지고 있으나 조사대상 주간 중 일시적인 병, 일기불순, 휴가또는 연가, 노동쟁의 등의 이유로 일하지 못한 일시휴직자○ 기 타* 구직기간 4주기준* 2015년 인구총조사(등록센서스) 결과를 토대로 소급작성된 추계인구의 변경을 반영하여 2018년 1월에2000년 7월 ~ 2017년 12월까지의 자료를 변경 하였음'
