description_portal: 경상남도 창원시 수소에너지 차량 현황입니다. 창원시 성산구, 의창구, 마산합포구, 마산회원구, 진해구로 총 5개로 구분되어있으며, 차량의 용도는 사업용, 비사업용으로 나눠져 있습니다.수소연료전지 자동차의 등록·운행 현황 및 인프라 연계 정보를 담은 자료입니다. 이 데이터는 수소차 보급 대수, 지역별 분포, 연식·모델군 분포, 충전소 접근성 등을 종합하여 분석할 수 있으며, 탄소중립 정책 수립, 교통 인프라 계획, 보조금 지원, 민원 대응 등의 목적으로 활용됩니다.항목 수가 많을 경우 엑셀 등 일반 뷰어에서 일부만 표시될 수 있으므로 R, Python, GIS 같은 전용 도구 활용을 권장합니다.데이터 기준일, 집계 방법, 차종 분류 기준 등 세부 항목 정의는 제공기관의 메타데이터나 기술문서를 참고해주세요.
