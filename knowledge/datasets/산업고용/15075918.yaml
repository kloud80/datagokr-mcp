summary_user: 에너지사용 및 온실가스배출 실태조사 결과를 조사 대상 사업장 단위의 마이크로데이터로 담는다. 대상연도·에너지원·광역지역·종사자 규모·표준산업분류별로 에너지 사용량, CO2·CH4·N2O 및 온실가스 배출량, 에너지원별 환산계수를 제공하며, 전국 범위에 API 전체 103,663건이다. 분석가나 정책 담당자가 "특정 업종·규모·지역 사업장은 어떤 에너지원에서 온실가스를 얼마나 배출하는가"를 따지는 데 쓰고, 전역 조인 키는 확인되지 않아 표준산업분류 코드(KSIC_CD)나 광역지역명·코드, 업종구분 코드표로 이름·코드를 맞춰 다른 통계와 잇는다.
description_portal: 본 데이터는 한국에너지공단이 「에너지이용 합리화법」에 따라 수행하는 '에너지사용 및 온실가스배출 실태조사'의 결과 중, 개별 조사 대상 사업체(주로 에너지 다소비 사업자)의 에너지 사용량 및 온실가스 배출량 원시 데이터에 가까운 형태(마이크로데이터)를 제공합니다. 기존에 설명해 드렸던 산업, 수송, 상업 부문 통계가 집계된 요약 정보인 반면, 마이크로데이터는 더욱 세분화된 단위의 정보를 포함합니다.이 데이터셋의 주된 목적은 국가 에너지 소비 및 온실가스 배출 현황을 심층적으로 분석하고, 다양한 관점에서 맞춤형 정책을 수립하는 데 필요한 정밀한 기초 자료를 제공하는 것입니다. 개별 사업체 또는 업종, 규모, 지역별로 에너지 소비 및 배출 패턴을 파악함으로써, 특정 대상에 최적화된 에너지 효율 향상 방안이나 온실가스 감축 전략을 개발하는 데 기여합니다. 이는 단순 총량 분석을 넘어선 심도 있는 연구 및 정책 수립을 가능하게 합니다.
