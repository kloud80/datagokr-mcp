description_portal: '이 데이터는 2020년 말 기준으로 경기도 북부 10개 시군(가평군, 고양시, 구리시, 남양주시, 동두천시, 양주시, 연천군, 의정부시, 파주시, 포천시) 소재 사업장의 업무상 질병 관련 산재 신청 및 승인 현황을 집계한 통계 자료입니다. 통계 항목은 질병 유형별(전체 질병, 뇌심혈관계 질병, 정신 질병)로 구분하고, 각 질병별로 사업장 규모(상시근로자수 기준)에 따른 신청 건수와 승인 건수를 제공합니다. 이 자료는 경기 북부 지역의 산업 구조와 노동 환경 특성에 따른 질병 재해 발생 패턴을 명확하게 보여줍니다. 특히, 뇌심혈관계 질병이나 정신 질병과 같은 중대한 업무상 질병의 지역별 및 규모별 취약성을 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 지역 보건 및 노동 안전 정책 수립에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 시군(예: 공업 단지가 밀집된 시)이나 특정 사업장 규모(예: 5인 미만 영세 사업장)에서 뇌심혈관계 질병 및 정신 질병 승인 건수가 높게 나타나는 현상을 분석할 수 있습니다. 이를 통해 해당 지역 및 사업장 규모를 대상으로 한 집중적인 직업 건강 관리 대책을 수립하고, 지역별 근로자의 정신 건강 증진을 위한 공공 지원을 강화하는 데 활용할 수 있습니다. 또한, 이 통계는 지역 노동 시장의 건강 위험도를 진단하고, 질병 재해 예방을 위한 의료 인프라 확충 방안을 모립하는 데 기여할 수 있다고 판단됩니다.'
