summary_user: 경기도 지역별 고용조사(표본조사)를 바탕으로 시군별·근로형태별·성별 주당 근로시간과 보정계수가 적용된 근로자수를 조사연도·반기 단위로 담은 집계표입니다. 노동정책 분석가가 '경기도 시군에서 비정규직 여성의 주당 근로시간이 정규직 남성과 얼마나 다른가'처럼 근로형태와 성별에 따른 근로시간 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·근로형태명 같은 이름을 맞춰서만 연결된다.
description_portal: 지역별 고용조사(표본조사)에 따라 산정된 시군별, 근로형태별, 성별 주당 근로시간 입니다.※ 표본조사에 의한 근로시간으로, 근로자수는 실제 근로자수가 아닌 보정계수가 적용된 근로자수 입니다.※ 4월, 10월의 15일이 포함된 주 및 다음주까지 2주간 조사를 실시했으며, 통계표 상의 근로시간은 조사 대상 주간(15일이 포함된 주) 1주일간의 총 근로시간을 의미함※ 실태조사는 2019년, 2020년에 각각 실시했으며, 2019년 경기도 비정규직 실태조사 관련 구체적인 자료는 www.gglabordata.com를 참고하시기 바랍니다.
