summary_user: 장애인 고용의무를 현저히 불이행해 명단이 공표된 기관·기업을 사업체 한 곳당 한 행으로 담은 전국 단위 파일로, 사업체구분·사업체명·산업대분류·주소와 상시근로자수, 고용의무 인원, 중증 2배수를 적용한 장애인 근로자 수와 고용률, 관할지사를 담는다. 구직 장애인이나 시민단체, 분석가가 특정 기업이나 지역·업종에서 장애인 고용의무를 지키지 않은 사업체가 어디이며 의무 인원 대비 실제 고용이 얼마나 부족한지를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업체명, 주소, 산업대분류 이름을 맞춰 붙이거나 관할지사 단위로 묶어서 이어 쓴다.
description_portal: '- 장애인 고용의무를 현저히 불이행한 기관 및 기업의 명단 현황(사업체명, 상시근로자수, 고용의무인원, 소재지, 산업대분류 등)- 이 데이터는 장애인 고용의무를 위반한 사업체들의 명단을 공개하며, 불이행 현황과 해당 사업체 정보를 포함합니다. 법적 책임 부과를 위한 근거가 되며, 장애인 고용 촉진과 사회적 감시 역할을 수행합니다. 이를 통해 장애인 일자리 확대와 공정한 고용환경 조성을 목표로 하며, 관련 기관과 국민에게 투명한 정보를 제공합니다. 세부 문의사항은 한국장애인고용공단 고용컨설팅부로 부탁드립니다.'
