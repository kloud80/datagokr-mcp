description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 추진하는 에너지기술개발사업의 지역별 지원 현황을 집약한 공공 데이터입니다. 본 데이터는 이러한 지역별 지원 현황을 객관적인 수치로 보여줌으로써, 지역별 에너지 R&D 역량 및 정책 효과를 분석하는 데 필요한 기초 자료를 제공합니다.제공되는 정보는 각 사업의 성격(예: 기술개발, 기반조성 등)과 수행기관이 소재한 권역 및 지역에 따른 정부 지원금 현황을 포함합니다. 이를 통해 특정 지역에 대한 에너지 R&D 투자가 어떻게 이루어졌는지, 그리고 지역별로 어떤 사업들이 주로 지원을 받았는지를 파악할 수 있습니다.'
