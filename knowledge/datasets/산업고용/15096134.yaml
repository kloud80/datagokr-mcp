summary_user: 한국남부발전 이천D(백사면B) 태양광 발전설비의 발전실적을 일자·호기별로 한 행씩 담은 파일로, 일간 총량·평균·최대·최소 발전량과 1~24시 시간별 발전량(kW)이 들어 있다. 분석가가 '이 발전소의 하루 중 발전 피크는 몇 시이고 계절에 따라 일 발전량이 어떻게 달라지는가'를 확인하거나 태양광 발전량 예측 모델의 학습 자료로 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 전역 조인 키가 없어, 같은 기관의 다른 태양광 발전실적 파일과는 날짜(년월일)와 발전소 이름으로 맞춰 이어 쓴다.
limits: 발전소 위치 좌표나 행정구역 코드 같은 전역 키가 없어 기상·일사량 등 외부 데이터와는 날짜와 이름 매핑으로만 연결된다. 범위 표기는 전국·비공간으로 되어 있으나 실제 내용은 단일 발전소 실적이다. 활용신청 없이 CSV 파일로 받는 형태라 실시간 수급 조회 용도로 쓰기는 어렵다.
