summary_user: 창원시가 허가한 태양광 발전사업을 발전소(허가) 한 건씩 담은 원장으로, 인허가번호·상호·설치장소 소재지·설비용량·공급전압·허가일자·사업개시일 등을 포함하며 범위는 창원시 한 곳입니다. 창원시 안에서 어느 지역에 어느 규모의 태양광 발전소가 언제 허가되고 사업을 시작했는지 확인하려는 주민·사업자·에너지 정책 분석가가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 설치장소 주소나 상호 이름으로 맞추거나 전국태양광발전소전기사업허가정보표준데이터와 같은 기관 기준으로 비교해 이어 쓴다.
description_portal: 태양광발전소 인허가번호, 인허과관리번호, 상호, 영업구분, 원동력의종류, 설비용량, 공급전압, 주파수, 허가일자, 기타사항, 사업개시일태양광 발전 시설에 대한 허가 내역과 관련 정보(위치, 설치 용량, 사업자, 허가일 등)를 정리한 자료입니다. 본 데이터는 발전 시설 분포 및 규모 파악, 재생에너지 정책 수립, 민원 대응, 인허가 절차 모니터링 등에 활용될 수 있습니다.허가 시설 정보가 많을 경우 일반 뷰어(엑셀, 메모장 등)만으로는 일부 항목이 표시될 수 있으므로, R, Python, GIS 등의 분석 도구를 활용한 공간 분석 및 시각화가 권장됩니다.설치 규모 기준(㎾·MW), 허가 유형(소형주택용, 사업장용 등), 유효 기간, 설비 상태 점검 이력 등 상세 기준은 해당 메타데이터 또는 기술문서를 참고하시기 바랍니다.
