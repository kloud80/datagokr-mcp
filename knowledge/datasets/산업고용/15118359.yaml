status: active
summary_user: 한국서부발전 발전소(태안·평택·군산·서인천)의 호기별·연월별 황산화물·질소산화물·먼지 평균 농도와 각 배출 기준을 함께 담은 측정 집계 데이터다. 지역 주민이나 환경 분석가가 "태안발전소 특정 호기의 질소산화물 농도가 배출 기준 대비 어느 수준인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소명(genNm)과 일자를 기준으로 다른 발전사 배출 데이터나 주변 환경기상 측정 자료와 이름·날짜 매핑으로 연결한다.
limits: 표준 코드 형태의 조인 키가 없어 다른 데이터와는 발전소명 문자열 매핑으로만 연결된다. 개발계정은 하루 100회로 호출이 제한된다. 서부발전 소속 발전소만 담으므로 전국 발전소 배출 비교에는 다른 발전사 데이터가 따로 필요하다.
