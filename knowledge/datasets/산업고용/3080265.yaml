summary_user: 울산광역시 동구에 등록된 옥외광고업체를 업체 한 곳당 한 행으로 담은 건별 등록 목록으로, 업소명·도로명/지번 주소·인허가번호·등록연월일·전화번호를 담는다(파일 크기 약 3.4KB의 소규모 CSV). 광고물 제작을 맡길 업체를 찾는 주민·사업자나 동구 옥외광고업체의 분포와 등록 시기를 살피는 분석가가 "동구에 등록된 옥외광고업체는 어디에 몇 곳 있나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 매핑해 잇거나, 같은 LOCALDATA 업종 인허가 계열 자료와 기관 단위로 맞춰 쓴다.
description_portal: 울산광역시 동구에 등록된 옥외광고업체의 현황을 체계적으로 정리한 공공데이터이다. 사업자명, 주소, 인허가일자, 영업내용, 전화번호 등이 포함되어 있으며, 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」에 따라 등록된 업체 정보를 제공한다. 본 자료는 지역 광고산업 현황 분석, 정책 수립, 행정 업무 지원, 민간 기업의 시장 조사 등 다양한 목적으로 활용할 수 있다. 정기적으로 갱신되며, 공공데이터포털을 통해 검색 및 다운로드가 가능하다. 제공되는 정보는 비식별 처리 기준을 준수하여 개인정보를 보호하고, 타 행정자료와 연계한 분석에도 적합한 구조를 갖추고 있다.
