summary_user: 경기도 내 건강기능식품일반판매업 가운데 '기타(복합 등)'로 분류된 다단계판매 사업장을 사업장 한 곳당 한 행으로 담으며, 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 지번·도로명 주소, WGS84 위도·경도 등을 포함한다. 시군 공무원이나 분석가가 "우리 시군에서 현재 영업 중인 다단계 건강기능식품 판매 사업장은 어디에 몇 곳이며 언제 인허가·폐업했나"를 확인하고 점검 대상 지도를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(SIGUN_CD)·시군명이나 주소·사업장명 매칭으로만 다른 지방행정 인허가(LOCALDATA) 업종 자료나 상가업소 자료와 이어 쓴다.
description_portal: 본 데이터는 경기도 내 건강기능식품일반판매업 중 ‘기타(복합 등)’으로 분류된 다단계판매 형태의 사업장 현황을 정리한 자료로, 시군별로 사업장명, 소재지 정보(지번 및 도로명), 인허가일자, 영업상태(운영중/폐업 등), 폐업일자, 위생업종명, 위생업태명, 위치정보(WGS84 위도·경도)를 포함합니다. 이 데이터를 통해 특정 사업장의 인허가 및 폐업 이력, 위치 기반 분석, 업종 분포, 위생관리 대상 여부 등을 확인할 수 있으며, 식품안전 및 공정거래와 관련된 감시·점검 업무, 불공정 다단계 영업행위 예방정책 수립, 지역 내 건강기능식품 유통 실태 분석 등에 활용할 수 있습니다. 또한 위경도 정보를 기반으로 지도 시각화 및 밀집지역 식별 등에도 유용하게 활용됩니다.
