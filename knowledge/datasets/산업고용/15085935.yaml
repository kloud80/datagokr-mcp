description_portal: 본 데이터는 집단에너지 사업의 보급 현황 및 운영실적을 종합적으로 제공하는 통계자료입니다.집단에너지 공급기준에 따른 공급세대수 및 참여 업체 수, 허가기준에 따른 열공급설비 현황(수열량 포함), 연료 사용량, 열 생산 및 판매량, 전기 생산 및 판매량을 포함하여,지역냉방 공급현황, 허가기준 공급세대수와 업체 수, 허가기준 사업자수 및 사업장수, 전기공급설비 현황 등 집단에너지 사업 운영에 관한 핵심 정보를 체계적으로 정리한 데이터입니다.이를 통해 정부와 연구기관은 집단에너지 사업의 보급 추이와 효율성 분석을 수행할 수 있으며, 에너지 정책 수립, 에너지 수급 안정성 확보 및 친환경 에너지 공급 확대 전략 마련을 위한 기초자료로 활용 가능합니다.
