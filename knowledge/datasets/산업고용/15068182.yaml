description_portal: 「한국고용정보원_워크넷_온라인청년센터_청년친화강소기업목록_20220101」 데이터는 청년들이 선호할 만한 고용 여건을 갖춘 중소·중견기업을 발굴하여 제공하기 위한 기업 정보 목록입니다. 고용노동부와 워크넷, 온라인청년센터가 공동으로 운영하며, 임금 수준, 일생활균형, 고용안정성 등 청년 친화적인 요소를 기준으로 선별된 기업들이 포함됩니다. 해당 목록은 2022년 1월 1일 기준으로 제공된 자료이며, 청년 구직자에게 우수 중소기업 정보를 체계적으로 제공하고, 기업의 인지도 제고 및 채용 연계 강화를 목적으로 합니다. 기업명, 지역, 산업분류, 기업특성 등의 상세 정보가 포함되어 있으며, 고용정책, 청년일자리 정책 수립의 기초자료로도 활용됩니다.
