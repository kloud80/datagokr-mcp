summary_user: 경상남도 거창군의 태양광발전소를 발전소 한 곳당 한 행으로 담은 원장 파일로, 인허가관리번호·상호·설치장소 주소(도로명·지번)·설비용량(kW)·허가일자·사업개시일·위도·경도를 담는다. 거창군 안 어느 지역에 얼마 규모의 태양광발전소가 언제 허가되고 가동을 시작했는지 확인하려는 주민·사업자·에너지 분석가가 입지 현황이나 용량 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 주소·좌표로 지도나 행정구역 자료에 얹거나, 전국태양광발전소전기사업허가정보표준데이터와는 상호·주소를 맞춰 비교하는 방식으로 이어 쓴다.
