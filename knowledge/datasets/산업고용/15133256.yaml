description_portal: '장애인기업종합지원센터는 직원들이 일과 가정생활을 조화롭게 병행할 수 있는 근무환경 조성을 중요한 조직문화 가치로 삼고, 다양한 일·가정양립 지원제도를 운영하고 있습니다. 이는 단순한 복지 향상을 넘어, 직원들의 삶의 질을 높이고, 업무 몰입도와 조직 만족도를 제고하여 장기적으로는 조직의 생산성과 지속가능성에 기여하기 위한 전략적 정책입니다.장애인기업종합지원센터의 일,가정양립을 위한 지원제도 운영에 관한 정보로 성별 육아휴직, 가족돌봄휴직, 가족돌보휴가 사용자수에 대한 정보를 제공합니다.데이터 : 육아휴직 남성 사용자수, 육아휴직 여성 사용자수, 가족돌봄휴가 남성 사용자수, 가족돌봄휴가 여성 사용자수, 가족돌봄휴직 남성 사용자수, 가족돌봄휴직 여성 사용자수'
