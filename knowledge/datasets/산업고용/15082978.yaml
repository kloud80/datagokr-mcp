description_portal: 이 데이터는 한국남부발전의 발전소별 연료소비 실적을 정리한 자료입니다. 하동발전본부 등 각 플랜트와 호기별로 우드펠릿, 가축분뇨, 석탄(유연탄·무연탄), 중유, 경유, 실내 등유, 액화천연가스(LNG) 등의 사용량이 연도·월별 단위로 기록되어 있습니다. 이를 통해 화석연료와 바이오매스, LNG 등 다양한 연료가 발전 과정에서 어떤 비중으로 활용되는지 파악할 수 있으며, 발전소 운영의 에너지 믹스와 친환경 연료 도입 현황을 수치로 확인할 수 있습니다. 본 자료는 에너지 사용 패턴 분석, 발전 효율 평가, 탄소배출 저감 정책 연구에 기초자료로 활용될 수 있으며, 장기적으로는 신재생에너지 확대와 에너지 전환 정책의 효과를 검토하는 데에도 유용한 정보를 제공합니다.
