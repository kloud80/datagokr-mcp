description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점의 운영성과와 외부 요인을 연계하여 분석하기 위해 2017년 5월 2일 기준으로 정리된 자료입니다. 데이터는 외부 통계 및 내부 수집자료를 기반으로 구성되어 있으며, 각 항목은 구분, 연도, 그리고 1월부터 12월까지의 월별 데이터로 구성되어 있습니다. 구분 항목에는 출도객(백만원), 이용객(명), 이용률(백만원), 소비자심리지수, 경제심리지수 등이 포함되어 있어, 단순한 매출 수치뿐만 아니라 고객 유입과 경제적 인식 등 외부 요인까지 종합적으로 고려한 분석이 가능합니다. 출도객 항목은 면세점을 이용하고 출국한 인원 또는 구매 규모를 의미하며, 이용객은 실질적으로 면세점을 이용한 고객 수를 나타냅니다. 이용률은 백만원 단위로 계산된 고객 1인당 평균 이용 금액 수준을 반영합니다. 소비자심리지수와 경제심리지수는 외부 경제동향 및 소비자 행동 변화를 나타내는 지표로, 월별 면세점 실적과의 상관관계를 분석할 수 있는 중요한 요소입니다. 이 데이터는 관광객 유입 변화, 소비심리 흐름, 계절별 매출 패턴, 외부 경제환경이 면세점 운영에 미치는 영향을 다차원적으로 분석할 수 있는 기초자료로 활용되며, 향후 전략적 마케팅 기획, 판매 예측 모델 개발, 리스크 대응 체계 마련 등에 유의미한 기반 정보를 제공합니다.
