summary_user: 한국산업기술시험원이 발급한 KC마크 인증을 인증번호 단위로 한 건씩 담은 원천 파일로, 인증상태·인증구분·인증일자·제품명·법정제품분류·수입/제조 구분·제조국·적용 규격이 들어 있으며 CSV 한 파일이 약 209MB 규모다. 수입업체나 소비자가 특정 제품의 KC 인증이 유효한지, 최초 인증 이후 어떤 변경 인증을 받았는지 확인하거나, 분석가가 법정제품분류·제조국별 인증 취득 동향을 집계하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 제품안전정보센터 등 다른 인증·리콜 데이터와는 인증번호·제품명·법정제품분류명을 이름·코드로 맞춰 이어 써야 한다.
description_portal: 한국산업기술시험원(KTL)은 다양한 산업 분야에서 이루어진 KC마크 인증의 현황 정보를 체계적으로 축적하고 정교하게 가공해 제공하고 있습니다. 이 데이터는 제품 안전성과 품질 관리를 위한 기초 자료로 활용되며, 특히 연도별, 제품 분류별, 인증 상태별로 세분화된 정보를 통해 산업 전반의 인증 동향을 파악할 수 있습니다. KC마크는 국내에서 제조되거나 수입되는 제품이 해당 법령과 안전기준을 충족했음을 나타내는 국가 인증으로, 제품의 안전성과 소비자 보호를 위한 중요한 제도입니다. KTL이 보유한 인증 데이터는 인증 트렌드를 분석하거나 인증 취득을 준비 중인 기업에게 실질적인 참고자료가 될 수 있으며, 정책 수립 및 시장 분석에도 활용 가치가 높습니다.
