summary_user: 전국 지자체가 관리하는 승강기 제조·수입업체의 인허가 정보를 업소 단위로 담으며, 전체 512건에 인허가일자·영업상태·사업장명·주소·좌표와 직원 수·자본금이 있고 기간은 2013-03-05부터 2026-10-01까지다. 소비자나 분석가가 특정 승강기 제조·수입업체가 지금 영업 중인지, 어느 지역에 있는지 확인하는 질문에 쓴다. 사업자등록번호(BRNO)와 지번·도로명 주소로 다른 사업자·인허가 데이터나 주소 데이터와 이어 쓴다.
description_portal: '기타_승강기제조및수입업체 데이터는 승강기의 제조 또는 수입을 하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 승강기제조및수리업체 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 행정안전부 승강기정책과 / 044-205-4297 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
