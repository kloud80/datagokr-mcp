summary_user: 한국동서발전의 사업관리 발전실적을 연도·월 단위로 집계한 파일로, 월별 발전량(kWh)·이용률·REC 발급량·SMP 가중평균을 한 행에 담는다. 에너지 분석가나 연구자가 "동서발전 사업의 월별 발전량과 REC 발급량이 SMP 변동과 함께 어떻게 움직였나"를 살피는 데 쓴다. 전역 조인 키는 없어서, 다른 전력시장·발전 데이터와는 연도·월 기준으로 맞추거나 같은 기관 자료끼리 이어 쓴다.
description_portal: 한국동서발전의 사업관리 발전실적 정보 데이터입니다. 해당 데이터는 순번, 연도, 월, 발전량(KWh), 이용율, 발급량(REC), 가중평균(SMP)의 항목으로 구성되며, 월 단위로 발전 실적을 체계적으로 기록한 자료입니다. 이 데이터는 발전량과 이용률 외에도 신재생에너지 공급인증서(REC) 발급량과 전력시장가격의 가중평균값(SMP) 정보를 포함하고 있어 경제적, 정책적 분석에도 유용합니다. 학계 및 연구기관에서는 전력 생산 효율성과 신재생에너지 보급 실적, 전력시장의 가격 동향 간의 상관관계를 분석하거나, 기간별 REC 발급량 추이를 통해 RPS(신재생에너지 공급의무화제도) 이행 성과 및 정책 효과 분석 자료로 활용할 수 있습니다. 또한 SMP 데이터를 기반으로 전력시장 가격의 변화 흐름을 예측하거나 에너지 경제 지표로서의 의미를 도출하는 연구도 가능합니다.
