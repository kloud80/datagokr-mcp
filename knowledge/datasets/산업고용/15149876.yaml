summary_user: 중증장애인 근로자를 돕는 근로지원인을 모집하는 수행기관의 구인 건별 정보로, 수행기관명·관할지사·근무소재지 주소·근무유형·근무일자와 시작·종료 시간·등록일자를 전국 범위로 담는다. 양성교육을 마친 근로지원인 희망자가 '우리 동네 근처에서 지금 근로지원인을 구하는 수행기관이 어디이고 근무 시간대는 어떤가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 수행기관명·관할지사 이름 매칭이나 근무소재지 주소 기반 지역 매핑으로만 잇는다.
description_portal: 중증장애인의 안정적, 지속적인 직업생활을 돕는 근로지원인 모집, 구인에 관한 정보입니다. 이 데이터는 양성교육을 수료하고 근로지원인으로서 활동을 희망하는 분들께서 구직에 대하여 문의할 수 있는 구인 기관의 정보를 제공하고자 공개하고 있습니다. 데이터 내용은 근로지원인 구인 수행기관의 기관명 및 연락처, 근무소재지 등의 근무정보, 활동내용 등을 포함하고 있습니다. 구인정보는 한국장애인고용공단 장애인서비스신청포털(https://hub.kead.or.kr)에서도 확인하실 수 있으며, 각 구인 건에 대한 자세한 사항은 구인정보 제공 수행기관에 문의 바랍니다.
team:
  dept: 근로지원부
