summary_user: 한국남동발전의 발전소별·월별 탈황석고 발생량(톤), 재활용량(톤), 재활용률(%)을 담은 집계 파일로, 포털 설명상 2022년 1~12월 범위의 작은 CSV(약 1.6KB)다. 발전 부문의 자원순환 실적을 보는 분석가가 '어느 발전소가 어느 달에 탈황석고를 얼마나 발생시키고 얼마나 재활용했나'를 확인하는 데 쓴다. 전역 조인 키는 없어 발전소명·기관명과 연월(년월)을 기준으로 다른 발전공기업(남부·서부·동서·중부)의 같은 표준 탈황석고 데이터나 석탄재·대기배출 등 발전소 단위 측정 데이터와 이름을 맞춰 이어 쓴다.
description_portal: 한국남동발전의 탈황 석고 재활용 실적 데이터입니다. 2022년 1월부터 12월까지 발전소별 탈황석고 발생 현황을 확인할 수 있으며, 재활용량, 재활용률 등의 정보를 포함하고 있습니다. 발전소별로 특정 월에 탈황석고가 얼마나 발생했고(발생량), 얼마만큼을 재활용했는지(재활용량), 비율(재활용률)은 얼마인지를 구체적인 수치로 제공합니다. 이를 통해 폐기물을 산업 원료로 전환하여 새로운 경제적 가치를 창출하는 자원순환 성과를 종합적으로 평가할 수 있는 중요한 지표입니다.* 해당 데이터는 발전공기업(남동, 남부, 서부, 동서, 중부) 표준 데이터 입니다.
