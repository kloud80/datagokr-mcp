summary_user: 중소벤처기업진흥공단 개발기술사업화자금을 지원받은 기업을 건별로 담은 파일로, 지원연도·지역·업력구분·신청사유·특허담보 여부·대여금액(백만원)·업종·주생산품·종업원·자산·매출 규모를 기록하며 범위는 전국이다. 정책자금 분석가나 사업자가 어떤 업종·업력·규모의 기업이 이 자금을 얼마나 받았는지, 특허담보 대출 비중은 어떤지 살피는 데 쓴다. 중진공 내부 업체번호(sbc_fund_company_no)가 유일한 키라서 같은 기관의 다른 정책자금 현황과는 이 번호로 잇고, 사업자등록번호가 없어 다른 기관의 인증·확인 원장과 기업 단위로 직접 붙이기는 어렵다.
