description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 일일 발전운영에 대한 정보를 전일 및 금일 전망값과 비교하여 주기적으로 정보 제공합니다.ㅇ 항목 : 기준일자, 전망시간(1~24시기준 데이터),  설비용량, 공급능력, 최대전력, 공급예비력, 운영예비력 * 단위 : MW'
