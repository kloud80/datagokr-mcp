description_portal: 한국동서발전 해외사업장(칼셀)의 연도별 중소기업제품 구매실적 정보는 공기업의 해외 자회사 또는 프로젝트 현장에서 국내 중소기업 제품을 얼마나 활용하고 있는지를 보여주는 데이터입니다.해당 데이터는 연도, 구매품목, 회사명, 구매금액(USD) 등의 항목으로 구성되어 있으며, 특정 연도에 칼셀(Calsel) 사업장에서 어떤 품목을 어느 국내 기업으로부터 얼마에 구매했는지를 확인할 수 있습니다.이 데이터는 국내 중소기업의 해외 판로 확대 실적을 간접적으로 평가할 수 있으며, 공공기관의 중소기업 지원 정책이 해외사업에 어떻게 연계되고 있는지를 분석하는 데 유용합니다.학계 및 연구기관에서는 본 데이터를 기반으로 공공기관의 글로벌 공급망 내 중소기업 참여 실태, 품목별 수출 연계 현황, 연도별 구매 추세 분석, 중소기업 해외 진출의 정책 효과 분석 등을 수행할 수 있습니다.또한 한국동서발전의 해외사업장이 단순한 해외 투자처가 아니라 국내 산업 생태계와의 연계 기능도 수행하고 있는지를 평가하는 데 활용될 수 있습니다.국가 차원의 중소기업 글로벌 진출 전략 수립, 공기업의 해외 조달 정책 개선, 수출지원 프로그램 효과 측정 등의 실증 연구에도 해당 데이터는 중요한 자료로 활용될 수 있습니다.
