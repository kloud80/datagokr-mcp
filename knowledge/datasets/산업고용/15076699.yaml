summary_user: 서울시 상권배후지 영역별로 기준 분기(STDR_YYQU_CD)마다 추정 소비를 집계한 데이터로, 지출 총액과 식료품·의류신발·생활용품·의료비·교통·여가·문화·교육·유흥 등 항목별 지출액을 담는다. 창업 예정자나 상권 분석가가 '이 상권 배후 주민은 어느 항목에 얼마나 쓰는가'를 비교해 업종 입지를 판단하는 데 쓴다. 전역 조인 키는 확인되지 않아, 상권 코드(TRDAR_CD)·상권명으로 같은 서울시 우리마을가게 상권분석서비스의 다른 상권 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: 서울시 상권배후지 영역 내 추정 소득 및 추정 소비 정보를 제공합니다.※ 소득소비 - 행정동, 자치구, 서울시를 집계한 데이터와 소득소비 - 상권배후지 영역 집계 데이터는 서로 다른 데이터를 사용합니다.※ 행정동보다 작은 상권크기의 데이터의 제공이 어려워 더 이상 갱신되지 않습니다.*용어설명추정소득이란 실제 소득 자료가 없거나 확인이 어려운 경우, 합리적 근거를 바탕으로 추정한 개인 또는 가구의 소득을 말합니다.주로 사회복지, 조세, 공공지원제도 등에서 사용되며, 지원 대상 선정이나 혜택 산정에 활용
