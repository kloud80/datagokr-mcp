description_portal: 한국디자인진흥원에서는 우수한 디자인을 발굴하고 포상함으로써 디자인의 가치와 중요성을 널리 알리기 위해 우수 디자인 상품 선정(GD), 대한민국 디자인 전람회, 대한민국 디자인 대상을 운영하고 있습니다. 대한민국디자인전람회의 경우 청소년과 초대/추천, 일반, 대학(원)생을 구분하여 진행합니다. 이 데이터는 2019년부터 2025년까지 개최된 공모전 목록으로, 공모전 분류(GD, 일반, 청소년, 대상), 개최년도, 공모전명, https://award.kidp.or.kr/ 내 공지 여부 등의 정보를 제공합니다.[변경내용안내]2025년부터 우리 원은 디자인 산업 경쟁력 강화를 위해 "대한민국 디자인 대상"을 새롭게 운영하고 있습니다. 이 상은 디자인 산업 발전에 기여한 개인과 디자인 경영이 우수한 기업, 관련 지방자치단체 및 전문 기관을 찾아 포상함으로써 디자인 분야의 우수 사례를 격려하고 우리나라 디자인 산업의 위상을 높이는 것을 목표로 합니다.본 데이터를 통해 국내 디자인 공모전의 변화 과정과 디자인 산업의 발전 동향을 파악할 수 있습니다. 기관에서는 디자인 정책 수립이나 관련 사업 기획 시 참고자료로 활용할 수 있으며, 연구자나 개인은 디자인 분야 연구 자료나 공모전 참가 정보로 활용 가능합니다.* 해당 데이터는 매년 정기적으로 갱신되어 최신 정보를 제공합니다.* 갱신주기와 데이터 열람시기에 의해 KIDP 공식 홈페이지에서 별도로 제공되는 데이터와 차이가 있을 수 있습니다.
