summary_user: 중소벤처기업진흥공단이 연구개발유형 벤처기업확인 평가를 수행한 건별 현황을 담은 파일로, 진행상태·현장실사 완료일·설립연도·업력·업종·지역·연구개발 조직종류·직전 4분기 연구개발비·당기 매출액·비대면 여부를 기록하며 범위는 전국이다. 정책 분석가나 창업 지원 담당자가 연구개발유형 벤처 확인을 신청한 기업이 어떤 업종·지역에 몰려 있고 연구개발비와 매출 규모가 어느 정도인지 파악하는 데 쓴다. 실측 조인 키는 업종코드(classification_code)뿐이라 업종 단위로 다른 업종별 통계·인허가 데이터와 이어 쓰며, 사업자번호 같은 기업 식별 키는 필드에 없어 개별 기업 단위 연결은 어렵다.
description_portal: 동 데이터는 중소벤처기업진흥공단 벤처기업확인 평가 업무의 현황(설립연도, 업종명, 지역, 연구개발 조직종류, 매출액 등)을 제공합니다.벤처기업 확인 제도는 「벤처기업육성에 관한 특별법」에 규정된 일정 요건을 갖추고 기술의 혁신성과 사업의 성장성이 우수한 기업을 벤처기업으로 발굴하고 지원해 주는 제도이며, 벤처기업’이란 일반적인 의미로 첨단의 신기술과 아이디어를 개발하여 사업에 도전하는 기술집약형 중소기업을 의미합니다. 우리나라에서는 「벤처기업육성에 관한 특별법」에서 정한 요건의 기업들을 ‘벤처기업’으로 정의하고 있으며 ‘벤처투자유형 / 연구개발유형 / 혁신성장유형’으로 구분하고 있습니다. 중소벤처기업진흥공단은 벤처기업 유형 중 연구개발유형 평가기관이며, 연구개발유형 평가기관으로는 중진공과, 신용보증기금이 있습니다.
