description_portal: 본 자료는 충북혁신도시 이전기관인 한국고용정보원, 한국소비자원, 한국가스안전공사가 관리하는 착한기업 관련 데이터를 통합 제공하는 현황 자료입니다. 한국소비자원의 CMM 인증기업, 한국가스안전공사의 우수 LPG 판매 인증업체, 한국고용정보원의 청년친화강소기업 정보를 포함하며, 충청북도 내 사회적 책임 경영 실천 및 고용 창출, 안전과 품질 우수성을 갖춘 기업 현황을 종합적으로 제공합니다. 데이터에는 기업 식별 및 구분 정보(번호, 구분, 업소명), 소재지 정보(주소), 업종, 인증 유효 기간(시작일자, 종료일자) 등이 포함됩니다. 이를 통해 지역별 착한기업 분포 분석, 인증유형별 기업 현황 파악, 정책 지원 대상 관리, 우수사례 홍보 등 다양한 정책 및 행정 활용이 가능합니다.
