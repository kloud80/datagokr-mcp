summary_user: 부산광역시 연제구에서 운영하는 노인일자리사업을 사업 단위로 정리한 파일로, 사업수행기관·사업유형·사업명·참여 인원·사업내용을 담는다(csv 약 4.5KB 규모의 소량 목록). 일자리를 찾는 연제구 노인이나 가족, 복지 담당자가 '연제구에서 어느 기관이 어떤 노인일자리사업을 몇 명 규모로 운영하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 노인일자리 현황이나 일자리사업 데이터와는 수행기관명·사업유형 이름을 맞춰 연결해야 한다.
