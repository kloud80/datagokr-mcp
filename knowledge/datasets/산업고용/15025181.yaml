description_portal: 본 데이터는 부산광역시 연제구의 노인일자리 현황을 담고 있습니다. 본 자료는 사업수행기관, 사업유형, 사업명, 참여인원 등을 포함한 노인일자리 정보를 제공합니다. 노인일자리사업은 노인이 일자리와 사회활동을 통하여 활동적이고 생산적인 노후생활을 영위할 수 있도록 지원하는 사업입니다. 각 수행기관의 명칭, 사업 조류, 참여 노인 수 등을 제공함으로써 일자리를 찾는 노인들에게 필요한 정보를 제공함과 동시에 노인복지정책 수립, 지역 고령자 고용 촉진, 사업성과 분석 등에 활용될 수 있습니다.
