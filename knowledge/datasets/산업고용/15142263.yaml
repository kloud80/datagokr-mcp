summary_user: 경기도 하남시 공공청사·체육시설·복지시설 등에 설치된 태양광발전 설비를 건축물 단위로 담은 원장으로, 건축물명·에너지 구분·설치용량·도로명/지번 주소·위경도를 설비별로 제공한다. 하남시 공공건물 중 어디에 태양광이 얼마나 설치돼 있는지, 공공부문 신재생 보급 현황을 지도에 표시하거나 용량을 합산해 보려는 시민·분석가가 쓴다. 전역 조인 키는 없어 주소나 위경도로 다른 데이터와 맞추거나, 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 단위 원장과 주소·용량으로 대조해 쓴다.
description_portal: 경기도 하남시 공공청사 태양광발전소 현황 정보로, 건축물명, 도로명주소, 지번주소, 위경도, 설치용량 등의 항목을 제공합니다.총 48개 설비가 등록되어 있으며, 전체 설치용량은 약 2,160kW로 확인됩니다. 주요 설치 시설은 하남시청(171.3kW + 48.9kW), 하남벤처센터(103.9kW), 하남종합운동장(41.0kW) 등이며, 신장동·망월동·창우동 등 행정 중심지에 집중되어 있습니다. 평균 용량은 시설당 약 45kW로, 대부분 공공청사·체육시설·복지시설 옥상에 분산형으로 설치되어 있습니다. 이는 하남시가 에너지 자립도 향상, 탄소중립 실현, 지속가능한 도시 기반 구축을 위해 공공건물 중심으로 신재생에너지 보급을 체계적으로 추진하고 있음을 보여줍니다.
