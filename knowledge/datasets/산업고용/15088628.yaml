description_portal: 한국서부발전 신재생 사업분야중 화순풍력발전사업의 2018년도 부터 2020년까지의 월간 풍력발전량 데이터를 제공합니다. 화순풍력발전사업은 2015년 11월에 전남 화순군 일대에 조성된 풍력발전단지, 특히 금성산(화학산) 중턱에 위치한 육상 풍력발전단지로 2MW 규모의 풍력발전기 8기가 16MW의 전력을 생산하고 있는 설비입니다. 풍력타워는 타워의 높이가 80미터, 날개라 할 수 있는 블레이드의 길이가 45미터입니다. 보통의 윈드터빈과 달리 블레이드의 중심축 색상이 파란색 계통으로 되어 있습니다.
