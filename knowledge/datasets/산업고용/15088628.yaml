summary_user: 한국서부발전 화순풍력발전단지(전남 화순, 2MW 8기·16MW)의 월간 풍력발전량을 사업명·연도·월별 발전량(MWh)으로 담은 소규모 집계 파일(CSV 926바이트)이며, 포털 설명상 2018~2020년분이다. 분석가나 연구자가 단일 육상풍력단지의 월별·계절별 발전량 변동이나 설비 이용 수준을 살펴보는 질문에 쓴다. 전역 조인 키가 없어 다른 발전 통계와는 연도·월과 사업명(발전소 이름)을 맞춰 붙여 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름·연월 매칭으로만 연결된다. 월 단위 단일 발전단지 실적이라 실시간·일별 전력수급이나 시장가격 분석에는 쓰지 못한다.
