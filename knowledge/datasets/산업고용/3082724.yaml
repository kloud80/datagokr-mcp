summary_user: 제주특별자치도 안에 있는 태양광발전소를 발전소 한 곳당 한 행으로 정리한 목록으로, 상호·설비용량(kW)·설치장소·사업개시일·데이터기준일자를 담는다(CSV 파일 약 165KB). 제주에서 태양광 설비가 어느 지역에 얼마나 들어섰고 언제부터 가동됐는지 보려는 에너지 분석가나 발전사업 검토자가 지역별 설비용량 분포와 연도별 사업개시 추이를 따지는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와 붙이려면 상호나 설치장소 주소를 문자열로 맞춰야 하며, 전국태양광발전소전기사업허가정보표준데이터 같은 발전소 단위 원장과 이 방식으로 대조한다.
description_portal: "제주특별자치도 내 소재하는 태양광발전소 현황 데이터를 제공합니다.항목: 상호, 설비용량, 사업개시일 등*'신에너지 및 재생에너지 개발ㆍ이용ㆍ보급 촉진법' 제2조 및 전기사업법, 지방자치단체 조례 등에 의거하여 설치된 태양광발전소 정보*설비용량: 발전소가 시간 당 최대로 생산해 낼 수 있는 능력을 기준으로 함*KW(킬로와트) : (1kw=1000w)자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1157"
