summary_user: 광주 서구 관내 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록이며, 업종명·업소명·소재지 주소를 포함하는 CSV 파일(약 58KB)입니다. 우리 동네 어디에 담배 판매점이 있는지, 새 소매인 지정을 검토하는 예정지 주변에 기존 판매점이 몰려 있는지 확인하려는 주민·예비 사업자·상권 분석가가 쓴다. 전역 조인 키는 없으므로 소재지 주소를 기준으로 다른 인허가(LOCALDATA) 자료나 상가업소 자료와 이어 쓴다.
limits: 사업자번호·좌표·공통 코드 같은 조인 키가 없어서 다른 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 연결된다. 범위는 서구 한 곳뿐이라 다른 자치구와 비교하려면 해당 구의 자료를 따로 모아야 한다. 포털 설명은 대규모점포를 다룬다고 적혀 있어 제목·필드(담배소매인 지정)와 맞지 않으므로, 설명에 나온 내용은 그대로 믿지 않는 편이 좋다.
