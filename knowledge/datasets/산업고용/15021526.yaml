description_portal: 이 데이터는 광주광역시 서구 관내에 소재한 대규모점포의 정보를 수록한 자료입니다. 대규모점포는 유통산업발전법에 따라 일정 기준 이상의 면적을 갖춘 점포로 분류되며, 이 데이터에는 해당 점포의 적용 대상, 사업장명, 매장 면적, 도로명 주소, 연락처 등 기본 정보가 포함되어 있습니다.정보는 각 점포별로 구분되어 있으며, 지역 내 유통시설 분포와 상업활동 규모, 입지 조건 등을 파악하는 데 유용하게 활용될 수 있습니다.또한 이 데이터는 지역 상권 분석, 대형 유통시설 정책 수립, 소상공인 보호 정책, 인허가 관리 등 다양한 행정 및 정책 수요에 대응할 수 있도록 제공됩니다. 정기적으로 연 1회 업데이트되며, csv 형식의 텍스트 파일로 제공됩니다.
