description_portal: 한국광해광업공단에서 제공하는 "광종별 매장량(상위 5개국) 합계" 데이터는 2017년도 기준으로 특정 광종의 전 세계 매장량 중 상위 5개국이 보유한 매장량의 총합을 보여줍니다. 이 데이터는 고령토, 금, 니켈, 다이아몬드, 동, 레늄, 리튬, 망간, 몰리브덴, 바나듐, 백금, 불석, 석고, 아연, 알루미늄, 연, 우라늄, 유연탄, 유황, 은, 인광석, 장석, 주석, 중정석, 창연, 철광석, 카드뮴, 코발트, 크롬, 텅스텐, 티타늄, 포타쉬, 흑연, 희토류 등 총 34가지 주요 광종을 포함합니다. 이를 통해 각 광종의 글로벌 자원 분포 및 특정 국가의 자원 지배력을 간략하게 파악할 수 있습니다. 본 데이터는 광물 자원 정책 수립 및 산업 동향 분석에 중요한 기초 자료로 활용될 수 있습니다.
