summary_user: 서울시 행정동별로 공공기관·은행·병원·약국·유치원부터 대학교까지의 학교·백화점·슈퍼마켓·극장·숙박시설·공항·철도역·지하철역·버스터미널·버스정류장 같은 집객시설 수를 기준 분기(STDR_YYQU_CD)마다 집계해 담는다. 상권 분석가나 창업 준비자가 특정 행정동에 유동인구를 모으는 시설이 얼마나 있는지, 다른 동과 비교해 어떤지를 확인할 때 쓴다. 행정동 코드(ADSTRD_CD)와 행정동명이 있으나 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 동 이름·코드 매핑이나 같은 서울시 상권분석서비스 계열 데이터의 코드로 연결한다.
description_portal: 이 데이터는 서울시 행정동 단위로 생활 기반시설 현황을 정리한 자료로, 각 동별로 공공기관, 은행, 약국, 유치원, 초등학교, 중학교, 고등학교, 대학교 등 주요 교육·의료·공공 인프라의 수를 제공합니다. 예를 들어, 청운효자동의 경우 공공기관 6개, 은행 3개, 약국 4개, 초·중·고교와 대학교 시설 현황, 그리고 버스정류장 수 등 생활에 밀접한 시설 데이터를 확인할 수 있습니다. 이를 통해 지역별 생활 인프라의 수준과 균형 여부를 파악할 수 있으며, 주민 생활 편의 분석, 교육 및 의료 자원 배분, 교통·복지 정책 수립 등 다양한 행정 및 정책적 활용이 가능합니다. 특히 분기별로 제공되므로 시계열 비교 분석을 통해 시설 변화 추이를 확인할 수 있다는 점에서 의미가 큽니다.
