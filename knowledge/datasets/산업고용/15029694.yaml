description_portal: '충청남도 당진시 고압가스 저장소 현황 안내(데이터 기준일: 2026년 8월 1일)충청남도 당진시는 지역 내 고압가스 저장소의 안전한 관리와 관련 행정업무의 효율성을 위하여 고압가스 저장소 현황 자료를 관리하고 있습니다. 본 자료는 당진시 관내 설치·운영 중인 고압가스 저장소의 기본 정보를 정리한 것으로, 다음 항목을 포함하고 있습니다:상호: 고압가스 저장소의 업체명 또는 사업장명주소: 저장소가 위치한 주소규모: 저장소의 저장 용량 또는 설비 규모 (단위는 자료 내 명시된 수치 및 기준에 따름)본 자료는 위험물 안전관리, 시설 지도 기반 분석(GIS), 지역 재난예방 계획 수립, 관련 민원 대응, 대시민 정보 제공 등 다양한 행정 및 공공 목적에 활용될 수 있습니다.'
