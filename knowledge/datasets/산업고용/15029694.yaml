summary_user: 충청남도 당진시 관내에 설치·운영 중인 고압가스 저장소를 사업장 한 곳당 한 행으로 정리한 현황 파일로, 법인명(상호)·사업소 소재지·취급가스 정보를 담는다. 시 안전관리 담당자나 지역 재난예방 계획을 세우는 분석가가 '우리 동네 어디에 어떤 고압가스를 다루는 저장소가 있는가'를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업장 소재지 주소나 상호를 매칭해서 잇는다. 예를 들어 주소를 지오코딩해 지도(GIS) 위에 올리거나, LOCALDATA 에너지 업종 인허가 원장과 상호·주소로 대조한다.
limits: 사업장을 식별하는 공통 코드가 없어서 다른 인허가·사업자 데이터와 정확히 결합하기 어렵다. 이름과 주소를 매칭할 때는 오차를 고려해야 한다. 범위는 당진시 한 곳뿐이므로 다른 시군과 비교하려면 지자체별 자료를 따로 모아야 한다.
