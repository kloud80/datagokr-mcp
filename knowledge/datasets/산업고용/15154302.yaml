summary_user: 서울시설공단이 관리하는 지하도상가의 점포 한 곳당 한 행으로 상가명, 점포면적(㎡와 평), 공용면적, 공유면적을 담은 CSV 파일(약 101KB)이다. 임차 희망자나 상권 분석가가 특정 지하도상가 점포의 전용면적과 공용·공유면적 규모를 비교하거나 임대 가능 면적을 확인할 때 쓴다. 점포코드(underground_mall_store_cd)가 실측 조인 키라 같은 코드를 쓰는 지하도상가 점포 데이터와 행 단위로 붙이고, 상가명으로는 상가 단위로 묶는다.
description_portal: 지하도상가별 점포면적·공유면적 등 세부 공간 정보를 정밀하게 정리한 데이터로, 각 점포의 전용면적 구성과 공용면적 비율, 공간 배치 구조, 인접 점포와의 관계까지 종합적으로 파악할 수 있는 자료입니다. 이러한 정보는 임대 가능 면적 산출, 관리비 부과 기준 마련, 공실·혼잡 구역 진단, 고객 이동 동선 분석 등 운영 효율화에 중요한 근거가 됩니다. 또한 시설 재배치와 리모델링 방향 설정, 피난·안전시설 확충 검토, 상권 경쟁력 강화 전략 수립 등 중장기 계획 수립에도 활용할 수 있어 공간 관리와 정책 의사결정 전반을 지원하는 핵심 데이터로 기능합니다.
