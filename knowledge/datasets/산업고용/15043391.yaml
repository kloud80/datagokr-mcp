summary_user: 한국남부발전 삼척발전본부 소내 태양광 설비의 발전실적을 일자·호기별 한 행으로 담으며, 일간 총량·평균·최대·최소와 1시부터 24시까지 시간별 발전량(kW)을 함께 기록한 CSV 파일(약 1.5MB)이다. 발전사·연구자가 '삼척 소내 태양광의 시간대별 발전 패턴이 계절이나 일조에 따라 어떻게 달라지는가'를 보거나 발전량 예측 모델의 학습 자료를 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 날짜(년월일)와 시간대를 맞추거나 같은 기관의 다른 발전소 실적 파일과 호기·발전소 이름으로 이어 쓴다.
limits: 실측 컬럼에 표준 조인 키가 없어 기상·전력시장 데이터와 붙이려면 날짜·시간을 직접 맞춰야 한다. 공간 단위가 전국·비공간으로 분류돼 좌표나 행정구역 코드가 없으므로 지역 단위 분석에 바로 쓰기 어렵다.
