summary_user: 부산광역시 기장군에 「민간임대주택에 관한 특별법」으로 등록된 주택 임대사업자의 임대주택을 주택 단위로 담은 파일로, 영업구분·사업자구분·임대주택구분, 임대주택의 지번주소, 종류·유형, 면적(제곱미터)을 담는다(CSV 약 33만 바이트, 전출·폐업 사업자 제외). 집을 구하는 임차인이 계약하려는 기장군 주택이 등록 임대주택인지 확인하거나, 분석가가 기장군 내 등록 임대주택의 종류·면적 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 지번주소를 주소 매핑해 잇거나 같은 기관(기장군) 자료끼리만 연결한다.
description_portal: 부산광역시 기장군에 등록된 주택 임대사업자 현황을 제공합니다.(사업자의 영업구분, 사업자구분, 임대주택구분, 임대주택의 지번주소, 임대주택의 종류 및 유형, 면적)* 제공되는 데이터의 임대사업자는 「민간임대주택에 관한 특별법」에 의거하여 등록되었습니다. (전출, 폐업사업자의 제외)* 2026년3월18일 기준의 데이터로 임대사업자 및 임대주택에 말소가 있을 경우 정보가 변경될 수 있습니다.* 민간임대사업자는 임대차계약을 체결시 임차인에게 임대사업자임을 고지하여야 함으로 부산광역시 기장군의 임대사업자의 현황을 제공합니다.
