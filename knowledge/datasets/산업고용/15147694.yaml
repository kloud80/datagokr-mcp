summary_user: 서울특별시 성북구에서 고압가스를 제조·저장·판매(용기 충전 포함)하는 업소의 인허가 현황을 업소 1곳당 1건으로 담으며, 업소명·소재지 주소·인허가일자·영업상태·폐업일자·중부원점TM 좌표(X, Y)가 들어 있다. 행정기관이나 분석가가 "성북구 안에서 현재 영업 중인 고압가스 업소는 어디에 몇 곳 있고, 언제 허가받았는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있고, 같은 LOCALDATA 계열의 석유판매·LPG·도시가스 등 에너지 업종 인허가 데이터와 나란히 묶어 쓴다.
description_portal: 서울시 성북구 고압가스업 인허가 정보 데이터는 용기에 충전하는 것을 포함하여 고압가스를 제조, 저장, 판매하는 업소의 인허가 현황을 제공합니다. 각 업소의 명칭, 소재지, 업종, 허가일자, 중부원점TM(EPSG:5174) 좌표 정보를 포함하며 위경도 좌표는 제공되지 않습니다. 본 데이터는 3일 전 기준으로 작성되었으며, 행정기관은 안전관리 및 점검, 연구기관은 산업 분석, 민간은 사업 정보 활용 등 다양한 목적에 활용할 수 있는 공공성과 신뢰성이 높은 자료입니다.* 본 데이터는 3일전 자료를 제공합니다.
