summary_user: 거제시 안의 담배소매업소를 업소 한 곳당 한 행으로 담은 등록 현황 파일로, 업소명·지번/도로명 주소·소매인 지정일자·법인 여부·영업 상태(영업구분)·기준일자를 포함한다. 담배소매점 창업을 검토하는 사업자가 특정 동네에 이미 영업 중인 소매점이 어디에 몇 곳 있는지, 최근 지정이 늘고 있는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소를 기준으로 다른 상가·상권 데이터나 같은 지방행정 인허가(LOCALDATA) 계열 업종 원장과 맞춰 이어 쓴다.
description_portal: 경상남도 거제시 담배소매인등록현황 공공데이터는 거제시 내 담배소매업소의 기본 정보를 체계적으로 정리하여 제공합니다. 주요 항목으로 업소명, 도로명주소, 위도, 경도, 전화번호, 소매인 지정일자, 영업구분, 기준일자 등이 포함되어 있어 업소의 위치와 운영 상태를 한눈에 파악할 수 있습니다. 이를 활용하면 신규 소매업 등록 추세나 업소 정보 변화를 파악할 수 있습니다. 또한 소매업자의 영업 상태나 지정일자 정보를 바탕으로 업소의 운영 기간을 확인할 수 있어 담배 유통 구조를 이해하고 정책 수립 및 창업 컨설팅, 지역 상권 분석 등 다양한 분야에서 유용하게 활용될 수 있습니다.
