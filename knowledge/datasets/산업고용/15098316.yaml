summary_user: 세종특별자치시에 게임산업으로 등록된 업체를 업체 한 곳씩 상호, 주소, 업종으로 담은 건별 목록이며, 범위는 세종시 한 곳이고 위치는 개별 주소 단위다. 세종시에서 PC방·게임제공업 같은 게임 관련 업소가 어디에 몇 곳 있는지 확인하려는 창업 예정자나 지역 상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 문자열 매칭으로만 연결하며, 소상공인 상가업소 정보나 다른 업종 인허가 목록과 주소 기준으로 대조할 때 쓴다.
limits: 사업자번호나 공통 코드 같은 조인 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 세종시만 다루므로 다른 시도와 비교하려면 별도 데이터가 필요하다. 개발계정 호출은 하루 5,000회로 제한된다.
