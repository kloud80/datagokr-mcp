summary_user: '광주 광산구에서 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 원천 목록 파일로, 업체명·주소·등록일자·데이터기준일자를 담는다. 주민이 집 근처 담배 판매처를 찾거나, 분석가·행정 담당자가 구 안의 담배소매점 분포와 연도별 신규 지정 추이를 볼 때 쓴다. 실측 컬럼에 사업자번호나 표준코드 같은 전역 조인 키가 없어서, 다른 데이터와는 주소를 지오코딩하거나 업체명을 맞춰 보는 방식으로만 잇는다(예: 소상공인 상가업소 정보, 다른 시군구의 담배소매인 현황).'
description_portal: 광주광역시 광산구의 담배소매인 지정 현황에 관한 정보를 제공합니다. 이 자료에는 담배를 판매하는 각 소매업체의 이름과 주소, 등록된 날짜, 그리고 데이터가 기준이 된 일자 등이 포함되어 있습니다. 이를 통해 지역 내 담배 판매업체의 분포와 현황을 한눈에 파악할 수 있으며, 관련 행정 업무나 정책 수립에 중요한 기초 자료로 활용됩니다. 또한, 이 정보는 주민들에게 정확한 담배 구매처 안내뿐만 아니라, 공공기관에서 담배 판매 관리와 단속을 효율적으로 수행하는 데에도 도움을 줍니다. 데이터는 정기적으로 갱신되어 최신 상태를 유지하며, 광산구 내의 담배소매인 관련 전반적인 상황을 이해하는 데 유용한 자료입니다.
