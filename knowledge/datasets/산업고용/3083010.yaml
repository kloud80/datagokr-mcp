summary_user: 광주광역시가 일자리 창출·고용안정·복리증진에 기여했다고 인증한 일자리우수기업 목록으로, 기업 한 곳당 한 행에 구분·기업명·대표자·소재지 도로명주소·데이터기준일자를 담은 작은 파일(약 1.4KB)이다. 구직자가 광주에서 인증받은 모범 고용기업이 어디인지 확인하거나, 분석가가 지역 인증기업의 분포를 파악하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 기업명이나 도로명주소를 매핑해 이어 써야 한다.
description_portal: 본 데이터는 광주광역시의 일자리우수기업 인증업체 현황을 정리한 자료로, 연번, 구분, 기업명, 대표자, 소재지 도로명주소, 데이터기준일자 항목으로 구성되어 있습니다. 일자리우수기업은 일자리 창출과 근로자의 고용안정 및 복리증진에 기여한 모범기업을 선정하여 인센티브를 제공함으로써 일자리 창출 분위기를 확산하고자 추진합니다. 제조업, 전자제품 제조업, 서비스업  등 다양한 업종의 기업이 포함되어 있으며,(주)부각마을, 정평시스템(주),(주)아토모스,(주)지용금속 등이 대표 기업으로 제시되어 있습니다. 각 기업의 대표자 성명과 도로명 주소가 함께 제공됩니다.
