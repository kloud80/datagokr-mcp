description_portal: 현재 건설중인 신한울원자력3,4호기 건설현장 전문인력(용접사) 양성관련 연도 및 차수별 교육 시행 현황이고, 수행년도, 기수, 순번(교육생번호), 출생년도, 지역, 성별 등을 포함합니다.본 교육은 지역특성을 반영한 맟춤형 인재양성 프로그램으로 안정적인 취업기회(양질의 신규 일자리 창출, 청년실업/실직자의 취업기회) 제공을 통해 원전에 대한 대외 신인도 제고 및 지역경제 활성화에 기여합니다.교육대상은 울진군 북면(울진군 건설현장 주변 지역주민 우선순위) 소재 거주자, 건설소 인근(죽변면, 울진읍) 소재지 거주자 및 그 외 울진군 지역 거주자 등입니다.모집공고는 울진군, 한울원자력본부 및 시공사 홈페이지에 게시합니다.
