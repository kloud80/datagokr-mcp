summary_user: 경기도 안의 근로복지공단 지사를 한 행씩 담은 기관 목록으로, 시군명, 지사명, 관할지역, 지번·도로명 주소, 우편번호, 위도·경도, 전화번호, 홈페이지 주소를 담는다. 산재·고용보험 업무로 공단을 찾는 근로자가 "우리 시군을 관할하는 지사가 어디이고 연락처는 무엇인가"를 확인하거나, 분석가가 지사 분포와 접근성을 지도 위에서 살필 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 시군 코드(SIGUN_CD)나 시군명으로 경기도 시군 단위 자료와 맞추거나, 위도·경도로 다른 위치 자료와 공간 결합해 잇는다.
description_portal: 이 데이터는 근로복지공단 각 지사의 현황을 정리한 자료로, 지역별 관할 범위와 지사 소재지 정보를 포함하고 있습니다. 주요 항목에는 시군명, 기관명, 관할지역정보, 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 있습니다. 각 지사는 산업재해보상보험, 고용보험, 산재근로자 재활지원 등의 업무를 수행하며, 해당 데이터는 관할 지역별 공단 지사 분포를 분석하고 근로자 복지 서비스 접근성을 평가하는 데 유용합니다. 또한 위치 좌표와 연락처 정보를 통해 GIS 기반 분석이나 이용자 접근성 연구에 활용할 수 있으며, 사회보험 및 복지정책 수립 시 기초 자료로도 중요한 역할을 합니다.
