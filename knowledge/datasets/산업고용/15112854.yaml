summary_user: 여수시에 고압가스 안전관리법에 따라 신고된 고압가스 저장소를 사업장 한 곳당 한 행으로 담은 파일로, 상호·소재지·사업의 종류·저장 고압가스 종류를 싣는다. 주민이나 안전관리 담당자가 '우리 동네 어디에 어떤 고압가스 저장소가 있는가'를 확인하거나 여수 지역 고압가스 저장 시설 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 에너지 업종 인허가 원장이나 시설 데이터와는 상호·소재지 주소를 이름·주소 매칭으로 맞춰 이어 쓴다.
limits: 범위가 여수시 한 시군구에 그치므로 다른 지역이나 전국 비교에는 이 파일만으로는 부족하다. 공통 코드나 사업장 식별번호가 없어 다른 데이터와 연결할 때 상호·주소 문자열 매칭에 기대야 한다.
