description_portal: 한국광해광업공단의 "무연탄 소비 정보 (지역별 민수용탄 소비)" 데이터셋은 석탄산업의 생산 기반 유지와 연탄의 안정적인 공급을 위해 석·연탄산업 지원 사업을 실시하고 있으며 이를 통해 자원안보와 서민생활보호 및 폐광지역 고용창출 등에 이바지하고 있습니다. 무연탄 소비현황을 부분별, 계절별, 월별, 지역별 등으로 구분하여 정보 제공합니다. 이 데이터는 무연탄의 지역별 소비량을 상세히 기록하여, 지역별 에너지 수요를 분석하고 정책 수립에 활용할 수 있습니다. 또한, 연탄 제조업체와 수송업자에게 지원되는 차액을 파악하는 데 유용하며, 정부의 가격 지원 정책과 연탄 산업의 가격 동향을 분석하는 데 기초 자료로 활용됩니다. 데이터는 공공데이터포털에서 무료로 제공되며, CSV 형식으로 다운로드하여 활용할 수 있습니다. 이러한 정보는 정책 입안자와 연구자들이 연탄 가격 정책을 수립하고, 시장 변동에 대응하는 데 중요한 기초 자료로 활용됩니다.
