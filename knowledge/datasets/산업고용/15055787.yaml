summary_user: 전북특별자치도에 등록된 공공측량업체를 업체 단위로 나열한 명부로, 시도·상호·소재지 세 항목만 담은 작은 CSV 파일(4,537바이트)이다. 지자체·공공기관 담당자가 '도내에서 공공측량 사업을 맡길 수 있는 등록 업체가 어디에 있는가'를 확인하거나 지역 측량 업계 분포를 볼 때 쓴다. 사업자번호나 코드 같은 공통 조인 키가 없어 다른 데이터와는 상호명이나 주소(소재지) 문자열을 맞춰서만 연결할 수 있다.
description_portal: 전북특별자치도 내에 등록되어 공공측량 업무를 수행할 수 있는 자격을 갖춘 업체들의 현황 데이터입니다. 이 자료는 국가나 지방자치단체가 발주하는 지도 제작, 지형·지물 측정 등 공공의 이익과 안전에 밀접한 관련이 있는 측량 사업을 수행할 수 있도록 허가받은 전문 업체들의 공식 목록입니다. 각 업체의 상호명과 상세 주소 정보를 포함하고 있어, 공공기관에서 사업 파트너를 선정하거나 관련 산업의 현황을 파악하는 데 중요한 기초 자료로 활용됩니다. 이는 국토의 효율적인 관리와 개발에 필수적인 정확한 지리정보를 생산하는 기반이 됩니다.
