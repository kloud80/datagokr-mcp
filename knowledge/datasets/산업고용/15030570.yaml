summary_user: 대구광역시 북구 관내 담배소매인 지정 내역을 업소 한 곳당 한 행으로 담은 건별 원천 파일로, 소매인 구분·업소명·도로명주소·지정일자를 포함한다. 담배소매점 신규 개업을 검토하는 사업자가 예정지 주변의 기존 소매인 위치를 확인하거나, 제조·수입·도매업자가 북구의 거래 대상 소매점 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 인허가(LOCALDATA)나 상가업소 데이터와는 업소명·도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대구광역시 북구청 관내 담배소매인 지정내역을 확인 하실 수 있습니다. 데이터 기준일은 2026년 4월 16일 기준입니다. 지정내역은 1년마다 갱신되오니 대구광역시 북구청 경제정책과 에너지관리팀(☏053-665-2084)로 문의주시면 최신의 담배소매인 지정내역을 열람하실 수 있게 도와드립니다. 담배사업법 시행령 제7조의3 제2항 제1호에 따라 담배소매인은 소매 영업소간 거리가 50미터 이상 되겠금 유지토록 법제화 되어있습니다. 이 대장은 담배사업법 시행규칙 제7조(소매인의 지정철차 등) 제13항에 따라 제조업자·수입업자 및 도매업자가 열람할 수 있도록 해야한다는 근거로 보관됩니다.
