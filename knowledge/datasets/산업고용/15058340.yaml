summary_user: 경기도 지역 전기·도시가스 관련 기관의 비상연락망을 기관명·담당 부서·전화번호·팩스 단위로 정리한 목록으로, 건별 사업장 원장이 아니라 연락처 현황표다. 지자체 재난담당자나 안전관리 실무자가 "가스 누출이나 정전 사고 때 어느 기관 상황실에 연락해야 하나"를 확인하거나 에너지 분야 비상연락체계를 정비할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM)을 이름으로 맞추는 방식으로만 연결한다.
description_portal: 이 데이터는 전기 및 도시가스 관련 기관의 비상연락망 현황을 정리한 자료로, 재난이나 긴급상황 발생 시 신속한 연락과 대응을 위한 정보를 제공합니다. 항목에는 집계일자, 에너지 구분(전기/가스), 기관명, 담당 부서명, 전화번호 등이 포함되어 있어, 실제 재해 대응 매뉴얼 구축이나 상황 발생 시 즉시 활용할 수 있는 정보로 구성되어 있습니다. 특히 모든 연락처가 종합상황실 등 긴급대응 부서로 연결되어 있어, 전력·가스 사고 발생 시 지역 내 협력 체계를 빠르게 가동할 수 있는 기반이 됩니다. 이 자료는 에너지 분야 재난대응 계획 수립, 지자체 비상연락체계 정비, 공공안전 매뉴얼 작성 등 실무적 용도로 활용됩니다.
