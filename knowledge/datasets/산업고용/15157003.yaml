summary_user: 경기도 양평군에 등록되어 영업 중인 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 파일로, 업종분류·상호·법인여부·도로명 주소·우편번호·등록일자를 포함한다(파일 크기 850바이트 규모). 양평군 주민이나 금융소비자가 거래하려는 대부업체가 군에 정식 등록된 업체인지, 소재지가 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호 등)가 없어 다른 데이터와는 상호명·주소를 맞춰 보거나 시군구명으로만 연결하며, 지방행정 인허가(LOCALDATA) 대부업 원장과 함께 보면 좌표·이력을 보완할 수 있다.
description_portal: '경기도 양평군_대부업 등록 현황 정보경기도 양평군 내 영업중인 대부업·대부중개업체 관련 데이터를 제공합니다.(연번, 대부업·대부중개업 분류, 상호명, 도로명주소, 등록일자 등)[데이터 안내]1. 업종분류 : 대부업·대부중개업 여부2. 상호명 : 등록 시군구에 등록된 상호명3. 도로명 주소 : 등록 업체의 소재지 도로명 주소해당 데이터는 등록일 현재의 영업중인 대부업·대부중개업체의 정보를 제공하며 차기 데이터 등록일 전 변경사항이 있을 수 있으니 특정 시점의 업체 등록 및 영업 여부는 양평군청 일자리경제과에 문의하시기 바랍니다.'
