description_portal: 이 파일은 한국가스기술공사의 드론 운영 현황을 연도별로 정리한 자료로, 2018년부터 2025년까지 드론을 활용한 관로 점검의 확대 추세를 확인할 수 있습니다. 각 연도별로 드론이 운영된 구간 수(개소), 점검된 배관 연장 거리(킬로미터), 그리고 드론 1종 자격증을 취득한 인원 수가 정리되어 있습니다. 예를 들어, 2018년에는 4개 구간에 걸쳐 5.8km를 점검하며 1종 자격자 4명이 활동했지만, 2022년에는 점검 구간이 19개로 늘어나고 총 67.2km에 이르는 배관을 드론으로 관리하게 되었습니다. 이는 스마트 기술을 활용한 점검 자동화와 안전성 향상을 추구하는 공사의 방향성을 보여주며, 자격자 수 변화와 비교하여 인력 대비 자동화 효과도 분석할 수 있는 기반 자료가 됩니다.
