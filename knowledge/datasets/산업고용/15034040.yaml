summary_user: 경상남도 통영시 관내 태양광 발전소를 한 곳씩 담은 건별 원장으로, 발전소명(상호)·설치 소재지·설비용량(kW)·공급전압·주파수·허가일자·사업개시일·영업구분을 담는다. 통영시에서 태양광 발전사업을 하려는 사업자나 지역 에너지 분석가가 '관내 어느 지역에 어느 규모의 태양광 발전소가 언제 허가돼 가동 중인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 전국태양광발전소전기사업허가정보표준데이터 같은 다른 자료와는 상호·주소를 이름으로 맞춰 이어야 한다.
limits: 표준 코드나 고유 식별번호가 없어 다른 데이터와 정확히 조인하기 어렵고, 상호·주소 문자열 매칭에 의존해야 한다. 범위는 통영시 한 곳뿐이며 발전량 실적은 담지 않는다.
