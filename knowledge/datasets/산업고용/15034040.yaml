description_portal: 태양광 발전은 청정하고 무한한 에너지원(태양 빛)을 사용해 화석연료와 달리 고갈될 걱정이 없고, 대기오염이나 온실가스를 배출하지 않습니다.발전시 오염물질이나 소음이 발생하지 않아 친환경적이며, 필요한 곳 어디든 지붕, 옥상 등 다양한 공간에 설치가능하고 설치 후 별도 조정 없이 자동 운전이 가능하고, 긴 수명(20년 이상)으로 유지보수가 용이해 장기적으로 전기요금 절감 효고와 안정적인 수익창출이 가능합니다. 또한, 필요한 곳에서 전기를 생산하여 송전 손실을 줄일 수 있으며, 외부 에너지원 의존도를 낮추고 에너지 자립도를 높여줍니다. 기술 발달로 발전 효율이 높아지고 설치 비용이 지속적으로 감소하고 있습니다. 이에 따라, 통영시에서 공공데이터 제공 및 이용 활성화에 관한 법률, 전기사업법제7조 및 같은법 시행규칙 제6조 등에 따라 국민의 데이터 이용권 보장을 위해 데이터 수집, 보유, 관리하고 개방을 합니다. 제공 내역은 태양광발전 인허가, 공사계획신고필증, 사업개시 신고 등 업무를 하고 있으며  공공데이터 제공 및 이용 활성화에 관한 법률 및 전기사업법 등에 따라 관내 태양광발전설치현황에 대한 허가일자,사업개시일자,공사계획신고일자,상호(발전소명),소재지 도로명주소,소재지 지번주소,설비용량(kW),공급전압(V),주파수(Hz),사업상태 정보를 제공합니다. 따라서 태양광 발전시설 설치현황에 대해서 공공데이터에서 제공하는 데이터를 참고하시면 됩니다. 공공데이터포털(data.go.kr), 한국에너지공단 신재생에너지센터(knrec.or.kr), 그리고 재생에너지 클라우드플랫폼(recloud.energy.or.kr) 등에서 찾을 수 있으며, 여기에는 지역별, 기관별, 설비별 상세 설치 정보(용량, 주소, 가동상태 등)와 발전량 데이터가 포함되어 있어 태양광 발전 현황 파악 및 정책 분석에 활용
