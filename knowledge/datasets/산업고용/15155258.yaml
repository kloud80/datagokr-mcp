summary_user: 석유제품·석유대체연료 판매업소의 인허가 정보를 업소 단위 건별로 담으며, 전국 2,717건(검증 수신 1,000행)에 인허가일 2014-02-25부터 2026-09-29까지 걸친다. 사업자나 분석가가 특정 지역에 영업 중인 석유대체연료 판매업소가 어디에 있고 언제 인허가를 받았는지 확인하는 데 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 주소 키로 다른 주소 기반 데이터와 이어 쓰며, 개방자치단체코드(OPN_ATMY_GRP_CD)는 다른 데이터에서 받은 코드를 넘겨야 한다.
description_portal: '자원환경_석유및석유대체연료판매업체 데이터는 석유제품 및 석유대체연료(석유제품 연소 설비의 근본적인 구조 변경 없이 석유제품을 대체하여 사용할 수 있는 연료)를 판매하는 업소 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 석유및석유대체연료 판매업체 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 산업통상부 석유산업과 / 044-203-5226 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
