description_portal: '○ 통계개요* 통계명 : 노인(65세이상) 고용동향* 통계종류 : 65세이상 노인의 경제활동 현황을 제공하는 지정·표본통계* 작성목적 : 취업, 실업 등의 경제적 특성을 조사하여 거시경제 분석과 인력자원의개발정책 수립에 필요한 정보를 제공하고 정부의 고용정책 입안 및 평가에필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 지방통계청 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 65세이상 인구의 경제활동인구, 취업자수, 고용률 등○ 용어설명* 노인 : 65세이상인구* 15세이상인구 : 대한민국에 상주하는 만 15세(매월 15일 현재) 이상인 자** 단, 군인(직업군인, 상근예비역 표함), 사회복무요원, 의무경찰, 형이 확정된교도소 수감자 등 제외* 경제활동인구 : 만15세 이상 인구 중 조사대상주간 동안 상품이나 서비스를 생산하기위하여 실제로 수입이 있는 일을 한 취업자와 일을 하지 않았으나구직활동을 한 실업자를 한다(취업자수+실업자수)* 비경제활동인구 :조사대상 주간 중 취업자도 실업자도 아닌 만 15세 이상인 자,즉 집안에서 가사와 육아를 전담하는 가정주부, 학교에 다니는 학생,일을 할 수 없는 연로자와 심신장애자, 자발적으로 자선사업이나종교단체에 관여하는 자 등을 말한다* 고용률 : 취업자수/15세이상인구×100* 경제활동참가율 : 경제활동인구/15세이상인구×100* 취업자 : 조사대상주간에 소득,이익,봉급,임금 등의 수입을 목적으로 1시간이상 일한자,자기에게 직접적으로 이득이나 수입이 오지 않더라도 가구단위에서 경영하는농장이나 사업체의 수입을 높이는데 도와준 가족종사자로서 주당 18시간 이상일한 자, 직업 또는 사업체를 가지고 있으나 조사대상 주간에 일시적인 병,일기불순, 휴가 또는 연가, 노동쟁의 등의 이유로 일하지 못한 일시휴직자○ 기 타* 구직기간 4주 기준* 통계청 『경제활동인구조사』자료 중 65세이상 인구를 대상으로 하는 통계수치임○ 자 료 :'
