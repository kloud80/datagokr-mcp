summary_user: 한국남부발전이 해외에 출자한 회사를 한 행씩 담은 소규모 현황표(csv 887바이트)로, 회사별 사업국가·출자회사명·회계기준분류·지분율·주요사업·설립일·최초 출자일·위치를 담는다. 연구자나 국민이 '한국남부발전은 어느 나라의 어떤 발전사업에 지분을 몇 % 갖고 있으며 언제부터 출자했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 출자회사명이나 사업국가 이름을 맞춰 붙이거나 같은 기관의 다른 공개자료와 나란히 보는 방식으로만 잇는다.
description_portal: 이 데이터는 한국남부발전이 해외에 출자한 회사들의 현황을 나타내는 자료입니다. 각 회사별로 사업국가, 출자회사명, 회계기준분류(종속회사 등), 지분율, 주요사업, 설립일, 최초 출자일, 위치 정보가 포함되어 있습니다. 이를 통해 한국남부발전의 글로벌 투자 포트폴리오를 확인할 수 있으며, 각 출자회사의 사업 영역(복합발전 투자사업, 발전 O&M 등)과 설립 및 출자 시점까지의 경과를 알 수 있습니다. 본 데이터는 공공기관의 해외 투자 활동을 투명하게 공개함으로써 국민에게 해외 자산과 사업 현황을 이해할 수 있도록 제공됩니다. 또한 연구자와 정책 담당자는 해외 출자 전략, 글로벌 시장 확장에 대한 분석 및 개선 방안을 도출할 수 있습니다. 이는 한국남부발전의 국제적 투자 현황을 확인하고, 향후 글로벌 사업 확장 및 국제적인 경영 전략 수립에 중요한 기초 자료로 활용될 수 있습니다.
