description_portal: 한국가스공사의 지역별 도시가스 수요의 특수일 효과에 관한 자료입니다. 특수일 효과는 국경일, 공휴일 등 특수일에 발생하는 도시가스 수요 변화 패턴을 정량화한 지표로, 일반적으로 공휴일에는 근무일 대비 수요가 감소하는 특성이 있습니다. 또한, 고려하는 공휴일은 월요일, 토요일, 일요일, 국경일, 공휴일, 명절, 임시휴일, 샌드위치데이, 연말, 기타 수요에 영향을 미치는 날을 고려 합니다. 본 데이터는 수요 예측 정확도 향상 및 공급 계획 수립을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 특수일 구분, 서울·대전·광주·대구·부산 등 지역별 수요 변화 비율이 포함되어 있습니다. 본 데이터를 활용하면 특수일별 수요 감소 패턴 분석, 지역별 특수일 효과 비교, 수요 예측 모델 보정 및 정확도 향상, 공휴일 공급 계획 수립에 기초자료로 활용할 수 있어 도시가스 수요 예측 정확도 향상과 선제적 수급 대응에 기여할 것으로 기대됩니다.
