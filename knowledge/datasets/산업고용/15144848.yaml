description_portal: 한국노동연구원은 국내외 노동시장 이슈에 대한 정책연구 결과를 널리 알리고 국제적 소통을 강화하기 위해 영문 웹진을 정기적으로 발행하고 있습니다. 웹진은 한국의 고용, 노동, 인적자원 개발 관련 주요 연구 성과를 외국 연구자, 정책 입안자단 등 해외 독자를 대상으로 소개하는 영문 콘텐츠입니다. 영문웹진은 분기별로 발행되며 한국노동연구원의 최신 발간자료를 소개하고 연구원의 소식이나 행사 정보를 제공합니다. 공공데이터로 개방되는 정보에는 웹진의 제목, 웹진 발행번호, 웹진 내용, 항목유형, 요약 등의 메타데이터가 포함되며, 기계 판독이 가능한 형식(CSV, JSON 등)으로 제공됩니다.
