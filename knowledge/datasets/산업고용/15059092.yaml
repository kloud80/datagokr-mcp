summary_user: 경기도 내 근로복지공단 관할 지사별로 기준연도마다 산재보험 장해급여 전체 수급자 수와 지급 금액, 1급부터 14급까지 등급별 수급자 수·금액을 집계한 통계다. 정책 분석가나 연구자가 '경기도 어느 지사 관할에서 중증(낮은 등급) 장해급여 수급자가 많고 지급액은 얼마인가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지사명(BRCH_NM)이나 관할지역 정보를 이름으로 맞춰 연결해야 한다.
description_portal: '산재보험장애급여 장애정도별 수급 집계현황 데이터는 경기도 내 근로복지공단 관할 지사를 기준으로 산재보험 장해급여 수급자의 규모와 지급 금액을 집계한 복지 통계자료입니다. 주요 항목에는 기준년도, 지사명, 관할지역정보, 전체수급자수, 전체금액과 함께 1급부터 14급까지의 등급별 수급자수 및 지급 금액이 포함됩니다. 장해급여는 산재로 인해 발생한 장애 정도에 따라 지급되는 연금 또는 일시금으로, 등급이 낮을수록 장애의 정도가 심함을 의미합니다. 이 데이터는 지역별 장해 수급 현황과 급여 지급 규모를 분석할 수 있어 산재보험 정책 수립, 산업재해 예방 대책 마련, 장애인 복지정책 연구 등에 활용됩니다. 또한 행정구역별 통계 차이를 통해 지사 관할 경계 문제(예: 가평군은 춘천지사 관할, 의정부지사에는 강원도 철원 포함)도 반영된 자료입니다. 경기도장애인복지종합지원센터(누림센터)에서 제공하며, 노동·복지·산업안전 정책 연구에 중요한 근거자료로 활용될 수 있습니다.'
