summary_user: 한국서부발전이 낸 입찰공고를 공고 1건당 1행으로 담은 원천 목록 파일(csv, 약 2.2MB)로, 공고명·공고부서·입찰종류와 방법·낙찰자 선정 방식·신청 마감일·투찰 시작/종료일·공고일자·진행상태를 담는다. 발전공기업 입찰에 참여하려는 사업자가 '서부발전은 어떤 입찰을 어떤 방식으로 자주 내고, 투찰 기간은 보통 얼마나 되나'를 확인하거나, 분석가가 공고·낙찰·계약 통계를 낼 때 쓴다. 공고번호(bid_ntce_no)가 조인 키이므로 같은 공고번호를 쓰는 낙찰·계약 현황 데이터와 이어 쓰며, 지역 코드는 없어 지역 단위 에너지 사용량 데이터와는 직접 연결되지 않는다.
description_portal: 한국서부발전의 입찰 공고 관련 정보를 상세하게 담고 있는 자료입니다. 공고번호, 공고명, 담당 부서, 입찰 종류 및 방법, 낙찰자 선정 방식 등 계약과 관련된 핵심 정보들을 확인할 수 있습니다. 또한, 입찰 신청 마감일, 투찰 시작 및 종료일, 공고일자, 현재 진행 상태까지 모든 과정을 파악할 수 있도록 구성되어 있습니다.이 자료는 입찰공고 및 낙찰, 계약 등 통계자료 분석에 활용되 수 있습니다.제공데이터는 입찰공고현황의 공고번호, 공고명, 공고부서, 입찰종류, 입찰방법, 낙찰자선정, 입찰신청마감일자, 투찰시작일자, 투찰종료일자, 공고일자, 진행상태의 항목으로 구성됩니다.
