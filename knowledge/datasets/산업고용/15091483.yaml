summary_user: 한국가스안전공사가 가스용품 성능인증 업무로 관리하는 제조업체를 인증품목별로 한 행씩 담은 원천 명부로, 업소명·대표자·전화번호·주소를 전국 범위로 담는다(csv 약 7KB 규모). 성능인증품을 구매해야 하는 제조사나 사업자가 '이 가스용품 품목을 성능인증받아 만드는 업체가 어디인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭으로만 이어 쓰며, 같은 공사의 다른 가스 인허가 현황과 업체명 기준으로 대조하는 정도가 현실적이다.
description_portal: '한국가스안전공사가 수행하는 가스용품분야 성능인증 업무를 통해 생성된 데이터로, 성능인증품 구매가 필요한 제조사의 수요를 반영하여 성능인증 품목별 제조업체 현황을 공개합니다.해당 데이터는 인증품목, 업소명, 대표자, 전화번호, 주소로 구성되어 있습니다.가스용품 성능인증 관련 통계 정보 및 가스 안전관리 업무, 관련 정책 수립 등에 활용할 수 있습니다.※ 해당 데이터는 연간 주기로 업데이트됩니다.※ 해당 데이터는 공사가 안전관리 업무 수행을 목적으로 수집, 관리하고 있는 데이터이며 타 유관기관 데이터와 일부 상이할 수 있습니다.※ 2025년 데이터기준일 기준 현황입니다.- 데이터기준일 : 2025년 11월 27일'
