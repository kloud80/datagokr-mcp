description_portal: 이 데이터는 한국남부발전의 국내 풍력발전 사업 운영 현황을 정리한 자료입니다. 연도별 신규 설비용량(MW), 신규 단지 수, 누적 설비용량 및 누적 단지 수를 포함하며, 한국남부발전 자체 풍력 사업 실적도 별도로 제공됩니다. 예를 들어 2010년 이전부터 시작된 국내 풍력발전 보급 현황과 남부발전의 누적 설비 및 단지 수를 비교할 수 있어, 국가 전체 풍력발전 보급 추세와 남부발전의 기여도를 동시에 확인할 수 있습니다. 이를 통해 국내 신재생에너지 확대 정책의 성과, 친환경 에너지 보급 현황, 향후 에너지 산업 발전 방향 등을 분석할 수 있으며, 학술 연구, 정책 수립, 산업 전략 개발 등 다양한 분야에서 기초자료로 활용될 수 있습니다.
