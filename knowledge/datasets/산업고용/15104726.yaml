description_portal: "본 데이터는 한국에너지기술평가원(KETEP)이 수행하는 '에너지기술기업실태조사'의 결과 중, 국내 에너지 기술 기업들의 소재·부품·장비(소부장) 국산화 현황에 대한 정보를 집약한 공공 데이터입니다. 제공되는 정보는 조사 연도별로 에너지 기술 분야별(예: 태양광, 풍력, 수소 등)로 분류된 기업들의 소재, 부품, 장비에 대한 국산화율 현황을 포함합니다. 더불어, 국산화가 이루어지지 않은 주요 사유(예: 기술력 부족, 경제성 문제, 품질 미흡 등)에 대한 기업들의 응답 정보를 함께 제공하여, 국산화율 제고를 위한 정책 수립에 필요한 구체적인 통찰을 제공합니다."
