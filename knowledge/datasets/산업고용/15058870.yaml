summary_user: 경기도 시군별 자살예방센터의 이름, 개소일, 전화번호, 위탁기관명, 인력 현황, 지번·도로명 주소와 위경도를 센터 한 곳당 한 행으로 담은 현황 목록이며, 기준연도(SUM_YY)가 함께 들어 있다. 정신건강 정책 담당자나 분석가가 "우리 시군에 자살예방센터가 어디 있고 인력이 몇 명인가" 또는 "센터가 멀리 떨어진 지역은 어디인가"를 확인할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군명·시군코드(SIGUN_CD)를 이름·코드로 매핑하거나 위경도로 다른 지역 통계·시설 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 자살예방센터의 운영 현황을 정리한 자료로, 센터의 위치, 개소일, 전화번호, 위탁기관명, 인력 구성 등 주요 정보를 포함하고 있습니다. 각 센터는 심리적 위기 상황에 있는 주민을 지원하기 위해 설립되었으며, 정신건강 상담, 자살 고위험군 발굴 및 연계, 예방 교육 등의 역할을 수행합니다. 이 데이터는 정신건강 서비스 접근성 분석, 지역별 위기 대응 체계 평가, 자살 예방 정책 수립, 보건복지 인프라 개선 등의 공공 보건 및 복지 행정 분야에서 활용될 수 있습니다. 특히, 자살률이 높은 지역을 중심으로 정책 자원 배분과 우선지원 대상 선정을 위한 근거자료로도 유용합니다.
