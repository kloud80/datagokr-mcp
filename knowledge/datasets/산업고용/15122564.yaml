summary_user: 소상공인시장진흥공단이 관리하는 나들가게 매장의 위치를 매장 단위로 담은 파일 데이터로, 전국 7,136건이 관리번호·매장주소·위도·경도로 들어 있다. 지역별 나들가게 분포나 밀집도를 지도에 그리거나 상권 분석에 쓰는 분석가·사업자가 "우리 지역에 나들가게가 어디에 몇 곳 있나"를 확인할 때 쓴다. 매장주소(address)와 위도·경도(coord)를 키로 상가업소 원장 같은 주소·좌표 기반 데이터와 이어 쓴다.
description_portal: 소상공인시장진흥공단에서 관리하는 나들가게 매장의 위치 정보를 담고 있으며, 관리번호, 매장 주소, 위도, 경도 등의 항목을 포함합니다. 매장의 공간 분포를 지도 기반으로 시각화하거나, 지역별 점포 밀집도를 파악하는 데 유용하며, 나들가게 위치정보 확인 및 상권 분석에도 활용할 수 있습니다. 특히 위치 기반 마케팅, 배송 최적화, 정책 타겟팅 등 실무적 활용도가 높아 행정기관이나 민간기업 모두에게 실질적인 데이터를 제공합니다.  향후 유사 사례 발굴 및 정책 설계의 참고 자료로도 활용될 수 있습니다.
