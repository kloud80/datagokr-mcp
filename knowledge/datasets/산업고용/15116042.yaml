description_portal: '서울특별시 중구의 텔레마케팅과 같은 전화를 이용하여 소비자에게 권유하거나 전화회신을 유도하는 방법으로 재화 등을 판매하는 업소 정보입니다. 데이터는 각 전화권유판매업 영업자에게 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 사업장 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 전화권유판매업 텔레마케팅 창업을 희망하는 예비 영업자에게는 중구 지역의 시장 분석 및 통신판매 등록업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
