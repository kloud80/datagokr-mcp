summary_user: 한전 청구 원장에서 나온 전력사용량을 전국 읍면동(법정동) × 연월 단위로 집계해, 지역별 고객 호수(전체호수)와 전력사용량을 담는다. 지역 분석가나 지자체 담당자가 '우리 동네 산업 부문 전력 소비가 월별로 어떻게 변하고 다른 동과 비교하면 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어, 시도·시군구·법정동 이름을 행정구역 코드표에 매핑한 뒤 다른 지역 통계와 연결한다.
description_portal: 한국전력공사에서 공급한 전력사용량에 대한 데이터 입니다.년도, 월, 시도, 시군구, 읍면동(법정동), 산업분류코드(대), 산업분류명(대), 산업분류코드(중), 산업분류명(중), 고객호수, 판매량, 판매요금으로 구성되어있습니다.해당 데이터를 통해 다양한 분야에서 업종별로 전력 사용 패턴을 비교하거나, 지역 경제 구조와 에너지 소비 간의 상관관계를 파악하는 등 다양한 활동에 기초 자료로 활용할 수 있습니다.나아가 이를 바탕으로 산업별 에너지 소비 추세 또는 지역간의 분석, 요금 예측 등 다양한 응용 서비스를 개발에 있어 도움을 줄 수 있습니다.(고객 호수 5호 미만은 개인정보 보호를 위하여 비식별화 조치 하였습니다.)
