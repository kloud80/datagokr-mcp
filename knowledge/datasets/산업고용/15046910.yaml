description_portal: '○ 통계개요* 통계명 : 신재생에너지 보급량* 통계종류 : 일반통계, 조사통계* 작성목적 : 신재생에너지의 이용실적을 파악하여 에너지정책수립 및 신재생에너지연구의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 통합관리시스템, 유관기관, 외부전문기관을 통한 조사 -> 한국에너지공단* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 신재생에너지(태양열, 태양광, 바이오, 풍력 등) 보급량 현황○ 용어설명* 신재생에너지 : 석유, 석탄, 원자력, 천연가스, 수력 등 종래 사용되어온 에너지 이외에장차 기술개발에 의하여 공급이 가능하게 될 태양에너지, 바이오매스, 동력, 소수력,지역, 해양에너지, 수소에너지, 석탄전환연료 등을 말함○ 기타* 반올림을 원칙으로 세부적인 내용의 합계가 총계와 일치하지 않는 경우도 있음'
