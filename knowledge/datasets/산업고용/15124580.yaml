description_portal: 이 데이터는 노인일자리 사업 정책 대상자 분석을 위해 작성된 가계금융복지조사(RAS) 기반의 기초연금 수급 관련 통계를 제공하는 자료입니다. 연령대별로 66세 이상 고령자 가구의 연금 합계액이 월 60만 원 이상인 비율을 나타내며, 66-70세, 71-75세, 76-80세, 81-85세 등 연령 구간별 세부 수치를 포함하고 있습니다. 이를 통해 연령대별 연금 수급 격차를 파악할 수 있으며, 고령층의 경제적 안정성과 정책 효과를 분석하는 데 활용할 수 있습니다. 특히 연도별 추이를 통해 고령자 연금 수급 비율의 변화를 시계열적으로 확인할 수 있고, 연령대별 생활수준과 정책 지원 필요성을 평가하는 기초 자료로 유용합니다.
