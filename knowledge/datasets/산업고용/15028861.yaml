summary_user: 대구광역시 동구의 토석(골재) 채취허가를 허가 건별로 담은 파일로, 수허가자 상호·연락처·허가지 주소·채취용도·허가면적·연간허가량·허가시작일을 담는다(파일 크기 190바이트로 건수가 매우 적다). 동구 안에서 어느 업체가 어디에서 얼마만큼 토석 채취허가를 받았는지 확인하려는 주민이나 골재 수급·국토 공간 규제를 살피는 분석가가 쓴다. 전역 조인 키는 없어 허가지 주소를 지번·좌표로 바꾸거나 업체명을 매칭해 토지이용규제 등 공간 데이터와 잇는다.
description_portal: 토석(골재) 채취 업체는 건설, 토목 공사 등에 필요한 모래, 자갈, 쇄석 등 자연 상태의 골재를 산지나 하천, 바다 등에서 채취하여 공급하는 업체입니다. 이러한 업체는 국토교통부나 지자체로부터 허가를 받아야 하며, 채취 지역의 환경영향 평가를 거쳐 일정한 기준을 충족해야 합니다. 채취된 골재는 도로포장, 콘크리트 제조, 조경용 자재 등 다양한 용도로 활용됩니다. 채취 과정에서는 주변 생태계와 수질에 영향을 줄 수 있으므로, 환경 보호를 위한 복구 계획도 함께 수립·이행해야 합니다. 대구광역시 동구 토석채취허가현황 데이터는 채취업체명, 주소 및 연락처, 채취량, 채취허가기간 등의 항목을 제공합니다.
