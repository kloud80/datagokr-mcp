summary_user: 대구광역시 북구 전통시장 중 하나인 전자상가의 개별 상점을 한 행씩 담은 건별 원장으로, 상호·업종·대표품목·주소·위도경도와 온누리·문화·전자상품권 사용 여부, 카드단말기·택배서비스 유무, 종업원 수를 담는다(CSV 약 45KB). 시장 방문객이 온누리상품권이나 카드를 쓸 수 있는 전자 상점을 찾거나, 분석가가 전통시장 점포의 업종 구성과 결제수단 도입 현황을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 위도·경도 좌표로 소상공인 상가업소 정보 등과 연결한다.
description_portal: 먼저 해당 데이터는 2022년 공공데이터 기업매칭 사업 완료시 구축된 1회성 데이터이며, 더이상 업데이트가 진행되지않음을 말씀드립니다.대구광역시 북구 전통시장 28개 중 하나인 전자상가의 상점정보에 대한 데이터로 상점코드, 상점명, 소재지 도로명주소, 소재지 지번주소, 상접업종분류, 대표품목, 전통시장 상가번영회 가입유무, 온누리 상품권 사용유무, 문화상품권 사용유무, 전자상품권 사용유무, 카드단말기 사용유무, 택배서비스 유무, 종업원 수, 상점홈페이지 주소, 위도, 경도 등의 항목을 제공합니다.
