summary_user: 국내에서 제조되거나 수입·판매되는 자동차용 타이어의 에너지소비효율등급 인증 현황을 모델·제원 단위 건별 원장으로 담으며, 회사명·원제조사·모델명·타이어 제원과 종류·모델 상태·회전저항 등급·젖은 노면 제동력 등급·최종변경일이 들어 있다(전국 범위, CSV 약 3MB). 소비자가 "같은 규격 타이어 중 회전저항 등급과 젖은 노면 등급이 모두 높은 모델은 무엇인가"를 비교하거나, 연구자가 제조사별 등급 분포를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 효율등급·자동차 데이터와는 회사명·모델명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 국내에서 제조되거나 해외로부터 수입되어 국내에 판매되는 자동차용 타이어의 에너지소비효율등급 인증 현황 데이터입니다.제공되는 주요 항목은 타이어 제조 또는 수입 회사명, 원제조사, 타이어 모델명, 타이어 제원 및 종류, 모델 상태와 회전저항 등급, 젖은 노면 제동력 등급 등으로 구성되어 있습니다.타이어 에너지소비효율등급 인증 현황 데이터를 통해 에너지 효율성이 높은 타이어를 비교하여 구매할 수 있으며,기업 및 연구기관 등에서는 타이어의 성능 분석, 친환경 자동차 개발 및 정책 수립을 위한 연구자료로 활용할 수 있습니다.
