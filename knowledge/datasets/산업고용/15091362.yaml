summary_user: 고효율에너지기자재 인증을 받은 제품을 모델명·인증번호 단위로 한 건씩 담은 원장으로, 업체명·사업자등록번호·주소, 용량·효율, 인증일·인증만료일, 시험기관과 시험성적서 번호·발급일을 함께 담는다. 기업 구매담당자나 소비자가 '이 모델이 고효율기자재 인증을 받았고 인증이 아직 유효한가'를 확인하거나, 분석가가 품목·업체별 인증 현황을 집계하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 모델명·업체명 같은 이름 매핑이나 사업자등록번호(BR_NUM)로 맞춰 이어 쓰며, 같은 공단의 에너지소비효율등급 제품 데이터와 모델명 기준으로 대조하는 식이 된다.
description_portal: 본 데이터는 정부의 '고효율에너지기자재 인증 제도'를 통해 공식적으로 인증받은 제품들의 상세 정보를 제공합니다. 이 제도는 에너지 효율이 높은 기자재의 생산과 보급을 장려하여, 국가 전체의 에너지 소비를 절감하고 온실가스 배출을 줄이는 데 핵심적인 역할을 합니다. 데이터의 주된 목적은 기업과 소비자들이 에너지 효율성이 검증된 제품을 쉽게 식별하고 선택할 수 있도록 정보를 투명하게 공개하는 것입니다. 이를 통해 시장에서는 고효율 제품의 경쟁이 촉진되고, 에너지 낭비를 줄이는 친환경 소비 문화가 확산되며, 궁극적으로는 국가 에너지 안보 강화와 기후변화 대응에 기여합니다.
