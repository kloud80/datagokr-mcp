summary_user: 경기도 시군별 일자리센터(경기일자리센터와 각 지역 센터)를 한 곳당 한 행으로 담아 센터명, 전화번호, 홈페이지, 도로명·지번 주소, 우편번호, 위경도 좌표를 제공한다. 구직자가 "우리 동네에서 가장 가까운 일자리센터는 어디고 연락처는 무엇인가"를 찾거나, 분석가가 시군별 고용서비스 기관의 분포와 접근성을 평가하는 데 쓴다. 전역 조인 키는 없으며, 시군 코드(SIGUN_CD)·시군명으로 경기도 다른 시군 단위 데이터와 맞추거나 좌표로 인구·교통 등 공간 데이터와 겹쳐 쓴다.
description_portal: 본 데이터는 경기도 내 시군별 일자리센터의 위치 및 연락처 정보를 포함한 현황 자료입니다. 주요 항목으로는 시군명, 센터명, 전화번호, 홈페이지 주소, 소재지 주소(도로명/지번), 우편번호, 위도 및 경도 정보 등이 있으며, 경기일자리센터와 각 지역 일자리센터에 대한 정보를 포함합니다. 이 데이터는 경기도민에게 맞춤형 고용서비스를 제공하기 위한 인프라 분석, 일자리 접근성 평가, 고용복지 연계 정책 수립 등에 활용될 수 있습니다. 구직자들이 가까운 일자리센터를 쉽게 찾을 수 있도록 정보를 제공하며, 데이터는 경기도 일자리경제정책과에서 관리하고 있습니다.
