summary_user: 경상남도 내 전기사업 관련 감리업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 등록번호·등록일자·상호·종류·대표자 성명·주소·영업 상태가 들어 있다. 사업자나 발주처가 특정 감리업체의 등록 여부와 현재 영업 상태를 확인하거나, 분석가가 시군별 감리업체 분포를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매칭이나 등록번호 대조로만 이어 쓸 수 있다.
limits: 공통 조인 키가 없어 사업자등록·인허가 원장 등과 기계적으로 연결되지 않으므로 상호·주소 매칭 시 오매칭에 주의해야 한다. 범위가 경상남도 한 시도에 한정되어 전국 비교에는 다른 시도 자료가 따로 필요하다.
