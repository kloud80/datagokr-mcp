summary_user: 서울시 행정동별 상주인구를 분기(기준 년분기 코드) 단위로 집계한 데이터로, 총인구·성별·연령대(10대~60대 이상)·성별×연령대 인구와 총가구·아파트·비아파트 가구 수를 담는다. 창업 예정자나 상권 분석가가 '이 동네에 30~40대 여성 거주자와 아파트 가구가 얼마나 사는가'처럼 점포 입지의 배후 거주 수요를 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 행정동 코드(ADSTRD_CD)·행정동명으로 서울시 상권분석서비스의 다른 행정동 단위 데이터와 이름·코드를 맞춰 잇는다.
description_portal: 서울시 행정동 내 상주인구 정보를 제공합니다. 1년 중 4분기에 한 번 데이터를 업데이트하여 다음 해 1, 2, 3분기의 값이 동일합니다. ※ 행정동 코드는 행정안전부에서 고시한 "주민등록 행정기관코드"를 사용하고 있습니다. 본 데이터는 각 행정동별로 거주하는 인구 규모와 분포를 파악할 수 있도록 제공되며, 상권 분석, 도시 계획, 정책 수립, 생활SOC 배치 등 다양한 분야에서 활용이 가능합니다. 특히 인구 변화 추이를 기반으로 한 상권 특성 분석 및 지역 맞춤형 서비스 기획에 중요한 자료로 쓰일 수 있습니다.
