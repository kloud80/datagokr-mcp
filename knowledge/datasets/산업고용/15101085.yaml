summary_user: 전국 창업보육센터의 시도·시군구, 센터명, 운영기관명·유형, 주요 분야, 개설일, 전화번호, 주소를 담은 센터 단위 목록 API이다. 창업 준비자가 내 지역에서 입주할 수 있는 창업보육센터가 어디에 있고 어느 기관이 운영하는지 찾는 질문에 쓴다. 이어 쓸 전역 조인 키는 확인되지 않아 센터명·주소 같은 이름 매핑이나 같은 기관 코드로만 다른 데이터와 연결한다.
description_portal: '#기술과 아이디어는 있으나, 제반 창업 여건이 취약하여 사업화에 어려움을 겪고 있는 창업초기기업(예비창업자)을 일정기간 입주시켜 기술개발에 필요한 범용기기 및 사업장 제공, 기술 및 경영지도, 자금지원 등 창업에 필요한 종합적인 지원을 통하여 창업 활성화 및 성공률을 높이기 위한 기업의 멘토 및 디딤돌 역할을 하고 있습니다.#창업보육센터는 핵심기술과 기술에 대한 기술성/사업성/시장성 등은 가지 고 있으나 자금, 사업장 및 시설확보에 어려움이 있는 창업자 또는 예비 창업자 에게 개인/공동 작업장 등의 시설을 저렴하게 제공하며, 아울러 경영, 세무, 기술 지도 등의 지원을 통해 창업에 따른 위험 부담을 줄이고 원활한 성장을 유도하여 성공 가능성을 높이기 위해 설립된 시설입니다.'
