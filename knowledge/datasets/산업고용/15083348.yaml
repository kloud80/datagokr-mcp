summary_user: 한국서부발전 태안발전본부 주변 측정 지점별로 미세먼지(PM10)·초미세먼지(PM2.5)·오존·이산화질소·일산화탄소·아황산가스의 월평균 농도를 연월·위치 단위로 담은 집계 파일(CSV)이다. 지역 주민이나 환경 분석가가 "태안화력 주변 대기질이 월별로 어떻게 변했고 친환경 설비 도입 뒤 오염물질 농도가 줄었는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 연월과 측정 위치 이름을 맞추거나 같은 기관(한국서부발전)의 배출·수질·기상 자료와 기관 단위로 이어 쓴다.
