summary_user: 서울 양천구 관내 복합유통게임제공업소(인터넷컴퓨터게임시설제공업과 비디오·음악사 등을 한 장소에서 함께 하는 업소)의 인허가 내역을 업소 한 건씩 담은 원장으로, 인허가·취소·폐업 일자, 영업상태, 소재지 주소, 좌표, 시설면적, 방 수, 주변환경 같은 항목을 포함한다. 주민이나 상권 분석가가 '양천구에서 지금 영업 중인 복합유통게임업소는 어디에 몇 곳 있고 규모는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있으며, 지방행정 인허가(LOCALDATA) 공통 원천의 한 업종이므로 다른 업종 인허가 데이터와 같은 형식으로 함께 쓴다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 복합유통게임제공업체의 인허가 현황을 종합적으로 관리하기 위해 수집된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지,  업종구분, 주변환경, 제작취급품목, 시설면적, 방수, 게임기수, 추가업종, 제공게임물등급, 지역구분 등 핵심 항목이 포함되어 있어 각 업체의 설립 및 운영 실태를 체계적으로 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관에서 복합유통게임제공업체 관리, 감독, 정책 수립, 안전 점검 등에 활용할 수 있으며, 연구자와 시민은 지역별 게임 제공업체 분포 및 서비스 유형 분석 등 다양한 목적으로 이용할 수 있는 신뢰성 있는 정보 자원이다.* 복합유통게임제공업 - 인터넷컴퓨터게임시설제공업 또는 비디오, 음악사 등의  영업을 동일 장소에서 함께 영업하는 업소정보
