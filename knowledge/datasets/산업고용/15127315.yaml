description_portal: 한국전력공사에서 공급하는 전국 데이터센터 전기공급 현황 데이터 입니다. 지역명, 고객호수, 계약전력(MW) 의 컬럼 구성으로 이루어져 있는 데이터 입니다.이 데이터는 한국전력공사에서 대용량 고객의 지역분산 정책을 위하여 1회성으로 제작된 데이터로, 기준일은 2023년 12월 31일 입니다.한국전력공사에서는 데이터센터의 민간·공공 구분 등 고객의 사용용도를 식별하기 위한 방법이 존재하지 않아, 고객의 전기사용용도(전기사용신청서) 및 주생산품(사업자등록증) 등의 항목으로 데이터센터 용도 구분을 관리하고 있습니다.해당 데이터는 2023년 말 전기사용신청 정보 기반 데이터센터 현황임을 참고하여 주시기 바랍니다.
