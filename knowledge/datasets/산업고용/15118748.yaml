summary_user: 고용노동부에 등록한 근로자 안전보건교육기관을 기관 한 곳당 한 행으로 담은 명단 파일로, 기관명·기관종류·우편번호·소재지·전화번호·관할 지방관서를 담고 범위는 전국이다. 근로자 정기교육이나 채용 시 교육을 위탁하려는 사업주가 우리 지역에서 맡길 수 있는 등록 교육기관과 연락처를 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명이나 소재지 주소, 관할 지방관서 이름을 맞춰 이어 쓴다.
description_portal: ◈ 사업주는 산업안전보건법 제29조에 따라 근로자에 대하여 정기교육, 채용 시 교육, 작업내용 변경 시 교육, 특별교육 등을 자체적으로 또는 위탁하여 실시하여야 합니다.    안전보건교육을 위탁하는 경우, 사업주는 산업안전보건법 제33조에 따른 근로자 안전보건교육기관에 위탁하여야 합니다.    본 자료는 고용노동부에 등록한 근로자 안전보건교육기관의 기관명, 주소지, 연락처 등을 포함하고 있습니다.◈ 교육실시 방법 등 자세한 내용은 "안전보건교육 안내서" 참조     (고용노동부 홈페이지 정책자료실에서 검색 후 다운로드)
