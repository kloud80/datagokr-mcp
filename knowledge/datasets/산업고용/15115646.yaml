summary_user: 서울 양천구 관내 옥외광고업(간판·현수막·전단 등 광고물 제작·설치·대행) 사업장의 인허가 정보를 업소 한 건씩 담으며, 인허가일자·영업상태·폐업일·휴업기간·소재지 주소·업체명·영업내용·좌표(X, Y) 항목이 있다. 시민이나 분석가가 '양천구에 현재 영업 중인 옥외광고업체는 어디에 몇 곳 있고, 언제 폐업한 곳이 많은가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구나 다른 업종 인허가(LOCALDATA) 자료와는 업체명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내 옥외광고업 사업장의 인허가 현황을 종합적으로 관리하기 위해 구축된 자료이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 영업내용 등의 항목이 포함되어 있어 각 업체의  운영 상태를 명확히 확인할 수 있도록 구성되어 있다. 본 자료는 행정기관의 광고물 지도·감독 및 정책 수립에 활용될 수 있으며, 시민과 연구자는 옥외광고물 분포, 사업자 운영 현황, 안전관리 실태 등 다양한 분석 목적으로 신뢰성 있는 정보 자원으로 이용할 수 있다.* 옥외광고업 - 간판, 현수막, 전단지 등 광고물 또는 게시시설을 제작, 표시 및 설치하거나 옥외광고를 대행하는 업소
