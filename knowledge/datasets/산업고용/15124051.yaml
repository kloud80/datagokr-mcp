summary_user: 한국지역난방공사가 지사·지구별로 설치한 지역난방 열량계의 기준정보를 열량계 한 대 단위로 담은 원천 목록으로, 설치종별(주택용 등)·기계실번호·설치번호·열량계종류·열공급개시일을 포함하며 전국 범위의 비공간 파일(csv)입니다. 분석가가 "어느 지사·지구에 어떤 종류의 열량계가 얼마나 설치돼 있고 설치종별 비율은 어떤가"를 파악하거나 열공급 개시 시점별 분포를 볼 때 쓴다. 기계실번호(heat_meter_room_no)가 실측 조인 키로 확인돼 같은 기계실 단위로 정리된 지역난방 열 공급·사용 자료와 이어 쓰며, 지사·지구 이름은 지역 단위로 묶는 기준으로 쓴다.
