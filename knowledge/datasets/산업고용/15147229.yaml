description_portal: 이 데이터는 서울시의 업종별 매출 현황을 분기별로 제공하는 공공데이터입니다. 업종 코드 및 업종명과 함께 총 매출액과 거래 건수가 제공되며, 주중·주말 매출 구분도 포함되어 있습니다. 또한 성별 매출액(남성·여성)과 연령대별 매출 현황(10대, 20대, 30대, 40대, 50대, 60대 이상)을 제공하여, 소비 주체별 특성을 파악할 수 있습니다. 이를 통해 업종별 소비 패턴, 주요 소비층, 성별 소비 차이 등을 분석할 수 있으며, 지역 상권 활성화 정책, 소비 트렌드 분석, 소상공인 지원 정책 수립 등 다양한 행정·연구 분야에서 활용할 수 있는 중요한 기초 자료입니다.
