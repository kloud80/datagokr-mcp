summary_user: 한국수력원자력이 운영하는 연료전지 출자회사·자체사업 발전소를 발전소 단위로 담은 소규모 파일(csv 약 1.2KB)로, 발전형식·준공일·위치·시설용량·단위용량·호기 수를 기록한다. 에너지 분석가나 지역 주민이 '한수원이 어느 지역에 몇 MW 규모의 연료전지 발전소를 언제 준공해 운영하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 발전소명이나 위치 문자열을 매핑해 태양광 발전사업 허가 표준데이터 같은 발전소 원장과 이어 쓴다.
description_portal: 한국수력원자력(주)에서 운영 중인 신에너지 사업에 대한 정보를 제공합니다.한국수력원자력(주)은 2013년도 경기그린에너지(주) 사업을 시작으로 현재까지 지속적으로 연료전지 사업을 시행하여 총 13개의 발전소를 운영하고 있습니다.본 데이터는 2026.6월 말 기준으로 한국수력원자력(주)에서 운영 중인 연료전지 출자회사 및 자체사업에 대한 정보를 제공하고 있습니다.이 데이터는 발전설비, 발전형식, 준공일, 발전소 위치, 시설용량, 단위용량, 호기 수에 대한 데이터를 포함하고 있습니다.
