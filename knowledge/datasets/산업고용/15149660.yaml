description_portal: 이 데이터는 한국수력원자력(주)의 서남부권 육상풍력 사업개발현황 자료입니다. 한국수력원자력은 재생에너지 발전 설비를 통한 깨끗한 에너지 생산으로 ESG 기업경영가치 실현하고자 노력하고 있습니다. 이 데이터는 다음과 같은 항목을 포함하고 있습니다. ○ 구분, 사업명, 착공일자, 준공일자, 설비용량(MW), 위치, 사업구조이 개방데이터를 통해 해당 지역에서 진행되는 사업에 대한 설비용량, 착공, 준공 기간 등을 확인함으로써 인근 지역의 주민들은 이익 공유 시기에 대한 현황을 예측하고 계획할 수 있습니다. 또한 민간사업자, 지역 주민 등 사업 분석을 필요로 하는 수요처에 자료를 제공함으로써 사업 참여 검토를 용이하게 할 수 있습니다.
