description_portal: 본 데이터는 2014년 12월 말 기준으로 국내에서 취급되는 방사성동위원소 및 방사선 관련 기기의 수입·수출 현황을 정리한 자료입니다.데이터 항목에는 개봉 및 밀봉 방사성동위원소, 방사선기기에 내장된 방사성동위원소, 방사선기기 자체 및 방사선발생장치 부품 등이 포함되어 있으며, 각 항목별로 방사능량, 거래 금액(수입·수출 기준)을 확인할 수 있습니다. 이를 통해 국내 방사성동위원소와 방사선기기 관련 흐름을 종합적으로 분석할 수 있습니다.또한 방사선 산업 및 연구, 의료 장비 관리, 규제 및 안전 관리 정책 수립 등 다양한 분야에서 활용될 수 있습니다.
