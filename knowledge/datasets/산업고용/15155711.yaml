summary_user: 전국 나들가게를 사업자번호 단위로 한 줄씩 담아 사업자 상태와 폐업일자를 기록한 파일 데이터이며, 범위는 전국·비공간이다. 소상공인 정책 담당자나 상권 분석가가 '지원 대상 나들가게 중 실제로 폐업한 곳은 어디이고 언제 문을 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 사업자번호 등 이름·코드 매핑으로만 다른 상가업소·인허가 데이터와 연결할 수 있다.
description_portal: 나들가게 폐업 진위여부 조회 현황정보 데이터는 전국 나들가게의 사업자번호를 기반으로 사업자 상태와 실제 폐업 여부, 폐업일자 등을 확인할 수 있도록 제공되는 데이터입니다. 해당 자료는 소상공인 정책 지원, 상권 관리, 지역경제 분석 등 다양한 행정적·연구적 활용에 기여할 수 있으며, 폐업 여부를 신속히 검증함으로써 유관기관의 업무 효율성을 높이고 상권 관련 서비스 개발에도 활용할 수 있습니다. 또한 일반 이용자도 상점의 운영 상태를 손쉽게 확인할 수 있어 소비자 편의성을 증대시키는 공공데이터입니다.
