description_portal: '- 장애인 고용을 위하여 고용컨설팅 서비스를 신청한 사업체에 대한 제공정보(순번, 사업장명, 진단번호, 접수일자 등)- 장애인 고용컨설팅 데이터는 장애인 채용 및 근무환경 개선을 위해 기업과 기관에 제공되는 맞춤형 컨설팅 내용을 담고 있습니다. 직무개발, 인사담당자 교육, 장애인 직업지원 등 다양한 지원 활동을 포함하며, 장애인 고용 확대와 근로환경 향상에 기여합니다. 이 데이터는 장애인 고용 활성화를 위한 정책 수립과 현장 지원에 필요한 정보를 제공합니다. 세부적인 문의사항은 한국장애인고용공단 고용컨설팅부로 부탁드립니다.'
