summary_user: 한국장애인고용공단이 실시한 그림직업흥미검사의 평가결과를 수검 건별로 담으며, 검사일자·소요시간·장애유형·총점·일관성과 함께 서비스·제조·음식·세탁·청소·임농 등 직업분야별 흥미점수, 작업형태(운반·정리·조작)·작업환경(개인·집단·실내·실외) 점수, 1~26번 문항별 점수가 들어 있습니다. 지적장애인 등 글을 읽기 어려운 수검자가 어떤 직업분야에 흥미를 보이는지, 장애유형별로 흥미 분포가 어떻게 다른지를 살피는 직업재활 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 이름 매칭이나 같은 기관의 다른 직업능력평가 데이터와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '한국장애인고용공단에서 실시하는 장애인 직업능력평가 도구 중 그림직업흥미검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 총점, 문항별 점수 등에 대한 정보를 제공합니다.* 그림직업흥미검사: 언어적 검사에 제한이 있는 지적장애인이 직업흥미를 파악하기 위한 검사로 그림을 통해 수검자가 좋아하는 일과 활동을 찾도록 도와주는 검사입니다. 해당 검사는 글을 읽기 어려운 사람들을 위하여 그림으로 만들어져 있습니다. 직업 영역 검사결과는 6가지 직업분야에 대한  흥미점수로 수검자가 직업적으로 흥미를 가지고 있는 분야에 대한 정보를 알 수 있습니다.'
