description_portal: 대전광역시 소상공인 설문조사 항목 자료는 2020년 대전광역시 내 소상공인을 대상으로 공공 데이터 청년 인턴들과 협력하여 실시한 실태 조사의 세부 항목 자료입니다. 본 데이터는 소상공인 개별 사업장의 현황, 사업자의 일반 정보, 경영 실태, 업종 유형, 창업 배경, 운영상 애로 사항, 정부 및 지자체 지원 제도 인지도와 활용 경험, 경영 환경 변화 대응, 판로 및 홍보, 고용 현황, 코로나 19 영향 등 다양한 측면의 내용을 포함합니다. 각 항목은 소상공인의 운영 특수성과 실질적 경영상 어려움, 필요 정책 지원 방향을 체계적으로 진단할 수 있도록 구성되어 있으며, 설문 구조의 명확성으로 인해 응답의 일관성과 실무적 해석 될 수 있습니다.
