description_portal: '은평구의 담배를 매입하여 일반인에게 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 **서울특별시 은평구 내에서 「담배사업법」에 따라 담배를 일반 소비자에게 판매할 수 있도록 지정된 소매업소(편의점, 마트 등)**의 인허가 현황을 담고 있습니다. 데이터에는 각 판매점의 상호명, 소재지 주소, 최초 지정일, 현재 영업 상태(영업중, 폐업 등)와 같이 담배 유통 관리에 필요한 핵심 정보가 포함되어 있습니다.담배소매업은 국민 건강과 청소년 보호를 위해 엄격한 규제를 받는 업종입니다. 특히, 업소 간 과밀 경쟁을 막고 담배 접근성을 제한하기 위해 판매점 간 50m 이상의 거리를 유지해야 하는 등 엄격한 지정 기준이 적용됩니다. 이 데이터는 신규로 담배 판매를 시작하려는 예비 창업자가 해당 위치가 거리 제한 규정에 저촉되지 않는지 사전에 확인하는 데 필수적입니다. 또한, 지자체는 이를 기반으로 관내 담배 판매업소를 체계적으로 관리하고, 특히 학교정화구역 내 판매를 제한하는 등 청소년 보호 정책을 시행하는 데 중요한 기초 자료로 활용합니다.'
