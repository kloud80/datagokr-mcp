summary_user: 서울 서대문구 관내 담배소매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·지번/도로명 주소·전화·영업상태·인허가일자·지정일자·폐업일자·좌표(X, Y)가 들어 있다. 학교 주변 유해환경 점검이나 상권 분석을 하는 공무원·분석가가 '서대문구에서 지금 영업 중인 담배소매점은 어디에 몇 곳 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호(MGTNO) 기준으로만 이어 쓰며, 같은 LOCALDATA 인허가 원천의 다른 업종 데이터와 형식이 같다.
description_portal: 서울특별시 서대문구 관내의 담배소매업 현황(사업장명, 주소, 영업상태, 좌표, 지정일자 등)에 대한 데이터를 제공합니다.서울특별시 서대문구_담배소매점 현황 데이터는 서대문구 내에 위치한 담배 판매업소들의 정보를 담고 있습니다. 주요 항목으로는 사업장명, 주소, 연락처, 영업 상태, 인허가일자, 위도와 경도 등이 포함됩니다. 이 데이터는 담배소매점의 분포와 영업 현황을 파악하는 데 활용되며, 청소년 보호를 위한 유해환경 점검, 상권 분석, 정책 수립 등 공공 및 민간 분야에서 사용됩니다.데이터는 CSV 형태로 제공됩니다.
