description_portal: 유통산업발전법 제2조 3항에 따른 부산광역시 연제구 대규모 점포 현황입니다.대규모점포란  하나 또는 대통령령으로 정하는 둘 이상의 연접되어 있는 건물 안에 하나 또는 여러 개로 나누어 설치되는 매장으로, 상시 운영되고, 매장면적의 합계가 매장면적의 합계가 3천제곱미터 이상인 곳을 말합니다.상기 데이터는 관내 대규모 점포에 관하여 제공되는 데이터로서 대규모 점포의 점포명, 소재지, 등록일 현황이 제공됩니다.대규모점포는 준대규모 점포와 구분되는 개념으로 세부적으로  대형마트, 백화점, 전문점, 쇼핑센터, 복합쇼핑몰, 그밖의 대규모 점포로 나눌 수 있습니다.
