summary_user: 부산광역시 연제구 관내에 등록된 대규모 점포(매장면적 합계 3천제곱미터 이상)를 점포 한 곳당 한 행으로 담은 작은 파일(약 300바이트)이며, 점포명·소재지·우편번호·행정동·등록일을 제공한다. 연제구 안에 어떤 대형마트·백화점 같은 대규모 점포가 어느 동에 언제 등록됐는지 확인하려는 주민·상권 분석가·유통 사업자가 쓴다. 전역 조인 키가 없어 행정동 이름이나 주소를 매핑해 상가업소 원장이나 전국 대규모·준대규모점포 표준데이터와 이어 쓴다.
