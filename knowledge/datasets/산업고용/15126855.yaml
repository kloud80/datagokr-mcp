summary_user: 대구광역시 수성구 관내 상시근로자 100인 이상 기업을 연도별로 한 줄씩 담은 목록 파일로, 사업체명·도로명 주소·전화번호를 기업 단위로 담는다. 수성구에서 고용 규모가 큰 기업이 어디에 있는지, 일자리 정책이나 기업 유치 검토 때 연락할 중대형 사업체가 누구인지 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 데이터와는 사업체명이나 도로명 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 대구광역시 수성구 내 상시근로자 수 100인 이상 기업의 현황을 정리한 자료로, 컬럼에는 연도, 사업체명, 도로명 주소, 전화번호가 포함된다. 본 자료는 중대형 고용기업의 분포를 파악하고 지역 산업 구조와 고용 환경을 분석하는 데 활용된다. 연도별 기업 목록을 통해 산업 활동의 변화와 고용 추이를 확인할 수 있으며, 기업 유치, 일자리 정책 수립, 산업 기반 조성 등에도 활용 가능하다. 도로명 주소는 위치 식별을 돕고, 전화번호는 행정적 문의나 정보 확인에 사용된다. 수성구 내 경제 활동의 기초 자료로 제공되며, 공공기관, 정책 부서, 연구기관 등에서 다양하게 활용될 수 있도록 정기적으로 갱신된다.
