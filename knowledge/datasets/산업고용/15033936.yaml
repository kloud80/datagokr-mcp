summary_user: 전남 신안군 내 태양광 발전소를 발전소 단위로 한 줄씩 담은 원장 파일로, 발전소명·원동력·허가용량(kW)·허가증 교부일·사업개시일·설치장소를 담는다. 군 에너지 담당자나 분석가가 신안군 태양광 설비가 어느 지역에 얼마나 들어섰는지, 허가 후 상업운전까지 얼마나 걸렸는지 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 전국태양광발전소전기사업허가정보표준데이터 등과는 발전소명이나 설치장소 주소를 맞춰 보는 방식으로만 이어 쓴다.
