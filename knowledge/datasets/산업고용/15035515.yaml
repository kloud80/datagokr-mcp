summary_user: 부산광역시 수영구 관내에서 지정된 담배소매인을 업소 단위로 담은 건별 목록으로, 소매인 구분·업소명·지번주소·도로명주소를 포함한다. 담배소매점 창업을 검토하는 사업자가 수영구 안 특정 동네에 기존 담배소매인이 어디에 몇 곳 있는지 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 주소(지번·도로명)를 기준으로 맞추거나, 같은 업종을 담은 지방행정 인허가(LOCALDATA) 담배소매업 자료와 업소명·주소로 대조해 쓴다.
description_portal: 부산광역시 수영구 관내 담배소매인 지정 현황은 분기별로 현행화되기 때문에, 데이터 기준일 이후 실제 소매인 현황과 일부 차이가 있을 수 있습니다.소매인 구분은 2009년 11월 법 개정 전 지정된 담배소매인 자료 또는 자동판매기까지 포함하며, 민원구분은 현행 법령상 지정된 담배소매인에 해당합니다.최신 현황 자료는 수영구청 홈페이지 사전정보공표 게시판에서 확인할 수 있으며, 업소명, 소재지(주소)가 포함되어 있습니다.자료는 담당부서(일자리경제과)에서 관리하며 실제 현황이 필요할 경우, 자료 기준일과 변동 가능성을 반드시 확인해야 합니다.
