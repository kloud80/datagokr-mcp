summary_user: 2017~2021년 전국 전력시장의 발전량을 거래일별로 한 행에 두고 1시부터 24시까지 시간대별 값(MWh)을 열로 담은 집계 파일로, 전력시장에 등록되지 않은 발전기(한전 PPA 등)의 발전량은 빠져 있다. 분석가나 연구자가 '평일과 주말, 계절에 따라 하루 중 어느 시간대에 발전량이 가장 많았는가'처럼 시간대별 전력 생산 패턴을 볼 때 쓴다. 전역 조인 키가 없고 거래일 외에 지역·발전원 구분이 없어, 같은 기관의 SMP·전력수급 자료나 기상 자료와는 날짜·시간을 기준으로 맞춰 이어 쓴다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2017~2021년간 시간대별 발전량 자료입니다.※ 전력거래량은 한전 전력수급계약(PPA) 등 전력시장에 미등록한 발전기의 발전량은 포함하지 않음) 우리나라 총발전량은 “한국전력통계”(한전발간)의 공식 자료 참조단위 : MWh'
