description_portal: 본 데이터는 한국가스공사 통영기지본부에서 운영하는 유입식 변압기의 유중가스 분석 결과를 정리한 전력설비 예방정비 자료입니다. 변압기 절연유 내에 용해된 가스 성분을 분석하여 변압기 내부의 이상 발열, 방전, 절연 열화 등 고장 징후를 사전에 진단하는 핵심 설비관리 데이터입니다. 데이터 항목으로는 변압기 일련번호, 용량 사양, 측정단위, 수소, 메탄, 에틸렌, 에탄, 아세틸렌, 일산화탄소, 이산화탄소 등 각종 용존가스 농도가 포함됩니다. 유중가스 분석은 변압기 고장의 조기 징후를 비파괴적으로 발견하는 국제 표준 진단 기법입니다. 이 데이터를 통해 변압기의 건전성을 정량적으로 평가하고 적절한 정비 시기와 방법을 결정할 수 있습니다. 또한 전력설비 진단 기술 연구 및 유사 시설의 변압기 상태감시 체계 구축에 활용될 수 있습니다.
