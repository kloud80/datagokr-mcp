summary_user: 서울시 상권별로 생존·폐업 사업체의 평균 영업기간과 서울시 평균을 비교해 상권변화지표를 LL·LH·HL·HH 4개 등급으로 나눈 집계 데이터로, 기준 분기(STDR_YYQU_CD)와 상권 코드·이름 단위로 담는다. 창업 예정자나 상권 분석가가 '이 상권은 신규 업체와 기존 업체 중 어느 쪽이 경쟁력을 가지는가, 진출 시 주의가 필요한가'를 판단하는 데 쓴다. 전역 조인 키는 없고, 상권 코드(TRDAR_CD)와 상권 이름으로 같은 서울시 우리마을가게 상권분석서비스의 다른 상권 데이터와 맞춰 이어 쓴다.
description_portal: '상권의 변화를 생존한 사업체의 평균 영업기간과 폐업한 사업체의 평균 영업기간을 기준으로 4개 등급으로 나눈 지표LL : (같은 업종으로) 상권의 사업체의 평균 영업기간이 "서울시"에서 "생존"한 사업체들의 평균 영업기간보다 낮고, "서울시"에서 "폐업"한 사업체들의 평균영업기간보다 낮은 상권 - 도시재생 및 신규 개발 상권으로 창업 진출입시 세심한 주의가 필요한 상권LH : 신규 업체가 경쟁력을 가지는 상권HL : 기존 업체가 경쟁력을 가지는 상권HH : 창업 진출입시 세심한 주의가 필요한 상권※ 제공부서 : 서울특별시 서울신용보증재단 빅데이터팀(02-2174-5075)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
