summary_user: 서울특별시 마포구에서 고압가스를 제조·저장·충전·운송하는 사업장의 인허가 원장을 사업장(관리번호) 한 건 단위로 담으며, 사업장명·도로명/지번주소·좌표·인허가일자·폐업일자·영업상태·제조구분(냉동·일반·충전)이 들어 있다. 주민이나 사업자가 '우리 동네에 영업 중인 고압가스 충전·저장 사업장이 어디에 있고 언제 허가됐는가'를 확인하거나, 분석가가 지역 에너지 업종 인허가 현황을 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, LPG·도시가스·석유판매 등 같은 계열의 다른 에너지 업종 인허가 데이터와 나란히 놓고 쓴다.
description_portal: 서울특별시 마포구의 고압가스업 인허가 정보에 대한 설명입니다. 이 데이터에는 고압가스를 취급하거나 저장·충전·운송하는 사업자의 사업장명과 실제 위치하는 도로명주소 및 지번주소, 도로명 우편번호, X좌표와 Y좌표가 포함되어 있습니다. 각 사업장별 관리번호와 영업상태명(폐업,영업/정상), 인허가일자와 폐업일자, 제조구분명(냉동, 일반, 충전), 사업장부지용도구분명(상업 및 업무용, 엄무용, 주거기타, 주상복합용, 기타) 등의 세부 항목이 제공됩니다. 이 데이터를 통해 사업자들은 법적 준수 여부를 확인하고, 관계 기관은 고압가스 사고 예방 및 인·허가 행정의 투명성을 확보할 수 있습니다.
