description_portal: '산업재해조사표의 기인물 항목은 재해 발생의 직접적인 원인 또는 관련된 물체나 기계장치를 식별하기 위해 작성됩니다. 기인물이란, 사고의 물리적 원인이 된 기계, 설비, 재료, 작업물 등을 의미하며, 이를 분류함으로써 재해유형별 원인 기계나 설비를 파악하고 위험요소를 구조적으로 분석할 수 있습니다.「산업안전보건법」 제57조 및 고용노동부 산업재해조사표 작성지침에 따라, 재해 원인항목으로 기인물 작성을 의무화하고 있습니다.분류체계는 고용노동부에서 표준화한 기인물 분류코드체계에 기반합니다.[예시](분류코드 01: 일반동력기계)0100 – 일반동력기계 원동기0110 – 일반동력기계0109 – 일반동력기계 절곡기0108 – 일반동력기계 혼합기 및 분석기'
