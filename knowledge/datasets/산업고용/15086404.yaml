description_portal: 본 데이터는 기술개발제품에 대한 한국에너지공단의 구매 실적 정보를 제공합니다.기술개발제품 구매제도는 중소기업 등의 기술혁신 및 신기술 제품 판로 지원을 목적으로 추진하는 제도로서, 공공기관이 우수한 기술력을 보유한 제품을 우선 구매하도록 장려하는 사업입니다.주요 제공 항목은 구매일자, 계약방법, 제품에 부여된 인증내역, 제품명, 구매업체 및 원단위 구매금액으로, 상세한 거래정보를 제공하고 있습니다. 본 데이터를 통해 기업 및 연구기관은 기술개발제품의 공공시장 진입 현황을 분석할 수 있으며, 기술혁신 제품 개발 및 마케팅 전략 수립을 위한 기초자료로 활용할 수 있습니다.
