description_portal: '인천광역시의 수입동향 실적 데이터는 인천 지역의 산업 및 경제 활동에 대한 중요한 지표를 제공하는 공공데이터입니다. 이 자료는 주로 품목별, 국가별 수입 현황을 시계열적으로 나타내며, 인천항이나 인천국제공항을 통해 이루어지는 무역 활동을 분석하는 데 필수적인 정보를 담고 있습니다.주요 포함 내용은 다음과 같습니다.1.주요 수입 품목: 반도체, 천연가스, 원유, 석탄, 철과, 자동차부품, 농약 및 의약품, 석유제품, 기구부푸므, 원동기 및 펌프2. 주요 나라: 대만, 중국, 미국, 호주, 베트남, 일본, 카타르, 브라질, 멕시코, 싱가포르데이터는 한국무역협회 또는 실적 보고 데이터를 참고하였습니다.'
