summary_user: 서울 강서구 관내 공공 태양광 발전시설을 시설 1곳당 1행으로 담은 CSV 파일(약 2.6KB)로, 시설명·도로명주소·설치 위치·가동 상태·설비용량과 2022년·2023년 연간 발전량을 담는다. 구청 담당자나 분석가가 '강서구 공공 태양광 시설별 설비용량 대비 실제 연간 발전량은 얼마이고, 어느 시설의 효율이 낮은가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 도로명주소(소재지도로명주소)를 맞춰 붙이거나, 같은 강서구 자료끼리 이어 써야 한다.
description_portal: 서울특별시 강서구 관내에 설치된 공공 태양광 발전시설의 발전량 및 설비 운영 현황을 수록한 자료로,시설명, 주소, 설치 위치, 가동 상태, 전기적 특성, 설비용량, 연도별 발전량 등의 정보를 포함하고 있습니다. 특히 2022년 및 2023년 발전량 데이터를 통해 시설별 발전효율과 가동 추이를 분석할 수 있어, 신재생에너지 정책 수립, 에너지 자립률 향상 전략, 친환경 도시계획 수립 등에 활용도가 높습니다. 또한, 설비용량과 실제 발전량 간 비교를 통해 운영 효율성을 평가하거나 신규 설비 도입 시 투자 타당성 분석 자료로도 유용합니다. 공공부문 외에도 민간 부문의 친환경 에너지 관심 확대 및 시민 인식 제고에도 기여할 수 있는 기초자료입니다.
