description_portal: '본 데이터는 근로자가 10인 이상인 전국 사업체 중 21,081개의 표본사업체를 대상으로 매년 시행되는 조사 내용으로 이는 다양한 산업별 및 직업별로 산업기술인력 현황을 상세히 보여주고 있습니다. 조사 범위는 12대 주력 산업에 속하는 제조업과 이와 관련된 서비스업으로 한정되어 있으며, 수집된 통계 수치는 표본 조사 결과를 바탕으로 한 모수 추정치로 제공됩니다. 이를 통해 이용자는 특정 산업의 인력 수급 상황을 이해하고 분석할 수 있는 기초 자료를 확보할 수 있습니다. 추가적으로, 데이터는 정책 수립, 인력 교육 및 훈련 프로그램의 개발, 그리고 산업계의 인력 수요 예측을 위한 기초 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 대분류, 중분류, 소분류, 관리직 및 전문가 관련 근로자 현원, 관리직 및 전문가 관련 근로자 부족인원, 관리직 및 전문가 관련 근로자 부족률, 기능원 및 관련 근로자 현원, 기능원 및 관련 근로자 부족인원, 기능원 및 관련 근로자 부족률, 장치 및 기계조작 조립근로자 현원, 장치 및 기계조작 조립근로자 부족인원, 장치 및 기계조작 조립근로자 부족률.'
