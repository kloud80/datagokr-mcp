description_portal: 중소벤처기업진흥공단에서 운영하는 성과보상공제사업 중 하나인 '내일채움공제'의 가입을 지원하는 외부 가입기관 현황 데이터입니다. 내일채움공제는 중소기업 핵심인력의 장기재직을 유도하고 근로자의 자산 형성을 지원하기 위한 제도로, 본 데이터는 공제 가입을 지원하는 외부 가입기관의 소재지별 현황을 제공합니다. 소재지는 행정구역을 기준으로 구분되어 있으며, 기관유형은 금융권과 비금융권으로 분류되어 있어 지역별 및 기관 유형별 가입 지원기관 현황을 파악하는 데 활용할 수 있습니다.
