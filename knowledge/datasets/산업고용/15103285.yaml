summary_user: (주)한국가스기술공사가 보유한 지식재산권을 권리 종류, 등록번호, 등록일자, 명칭, 비고로 한 건씩 나열한 전국 단위·비공간 목록으로, 포털 설명상 330건을 담는다. 가스설비 관련 기술을 찾는 기업이나 분석가가 기술공사가 어떤 특허를 언제 등록했고 활용·이전 대상으로 검토할 기술이 있는지 확인하는 데 쓴다. 등록번호(kipo_rgst_no)를 키로 특허청·키프리스 등록 정보와 이어 상세 기술 내용과 권리 상태를 확인한다.
description_portal: 'CSV 파일에는 총 330개의 지식재산권 리스트가 포함되어 있으며, 다음과 같은 주요 항목으로 구성되어 있습니다.분류: 권리, 등록번호, 등록일자, 명칭, 비고관리명: 지식재산권 등록 현황이 자료는 지식재산권 현황을 리스트업한 자료로써 기술의 명칭과 등록번호를 확인할 수 있으며, 상세 기술을 확인하고자 하는 경우 특허청 및 키프리스(kipris) 사이트상에서 발명 명칭과 등록번호로 확인할 수 있습니다.이 자료는 특허권 등 지식재산권 활용과 관련하여 기술공사가 제공하는 리스트를 확인하여 활용 될 수 있습니다.'
