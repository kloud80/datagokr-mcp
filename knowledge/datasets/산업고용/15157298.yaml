description_portal: "발전원 다변화 등으로 전력수급과 관련 이슈가 중요해지면서 전력거래소에서 이를 운영 및 정책 설계 등을 수행하기 위한 기반자료에 해당하는 실시간전력수급, 전력수급실적, 최대최소전력월별 평균, 추계정보 등을 국민에게 공개중산업통상자원부가 전력통계정보 관리기관으로 전력거래소를 지정함에 따라“ 전력거래소는 전력통계정보시스템을 운영하고 있습니다. ”산업통상자원부는 전력산업구조개편 이후 전력통계의 효율적인 운영 방안을 마련하고자 '전력산업구조개편에 따른 전력통계DB체제 구축 및 운영방안' 용역 결과에 따라서 2003년도에 1단계 전력통계정보시스템(EPSIS : Electric Power Statistics Information System)을 개발하였습니다.전력거래소는 전력통계정보시스템을 통하여 1964년부터의 발전설비현황, 송변배전설비 현황, 전력시장 통계, 전력판매 현황, 상용자가발전 현황 등의 전력산업 통계를 제공하고 있습니다."
legal_basis_portal: "산업통상자원부가 전력통계정보 관리기관으로 전력거래소를 지정함에 따라“ 전력거래소는 전력통계정보시스템을 운영하고 있습니다. ”산업통상자원부는 전력산업구조개편 이후 전력통계의 효율적인 운영 방안을 마련하고자 '전력산업구조개편에 따른 전력통계DB체제 구축 및 운영방안' 용역 결과에 따라서 2003년도에 1단계 전력통계정보시스템(EPSIS : Electric Power Statistics Information System)을 개발하였습니다.전력거래소는 전력통계정보시스템을 통하여 1964년부터의 발전설비현황, 송변배전설비 현황, 전력시장 통계, 전력판매 현황, 상용자가발전 현황 등의 전력산업 통계를 제공하고 있습니다."
