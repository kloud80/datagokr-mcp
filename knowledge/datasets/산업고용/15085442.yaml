description_portal: 한국수력원자력㈜ 원전 본부별 사용후핵연료 운반 현황을 분기별로 업데이트하여 공개합니다. 공개 정보는 원자로 구분(경수로/중수로), 원전본부, 운반수량, 기준일 항목으로 구성되어 있습니다.사용후핵연료는 원자력 발전소 밖으로 운반된 후, 중간저장 시설을 거친 후 영구처분을 위해 원자력 발전소 내 임시저장 시설에서 외부로 사용후핵연료를 운반하는 과정이 필요하며, 본 정보는 원전본부 내 발전소간 운반 현황입니다. 운반을 수행하는 시점은 발전소가 포화되기 전이며 연료를 재장전하는데 충분한 여유 저장량을 확보하기 위해 필요한 양만 운반을 수행합니다. 물론 경우에 따라 운반용기 유지 보수, 정기 검사, 발전소 계획예방정비 등의 일정을 모두 고려하여 운반시기와 운반수량은 변경될 수 있습니다. 사용후핵연료는 원자로에서 핵연료 주기를 거치고 방출된 핵연료로써 방사능이 남아있는 연료입니다. 그냥 버리면 고준위 방사성 폐기물이지만 사용후핵연료에는 여전히 우라늄 자원이 남아 있기 때문에 재처리를 하면 핵연료로 재사용 할 수 있으며 산업 및 의료용으로 사용하는 희토류 자원도 회수 할 수 있게됩니다. 보는 시각에 따라 사용후핵연료는 골칫덩이가 될 수 있지만 한편으론 귀중한 자원이 될 수 있습니다.
