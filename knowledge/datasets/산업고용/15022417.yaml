description_portal: 연구장비활용 바우처 지원사업은 수요자 중심의 맞춤형 연구장비활용 지원을 통한 중소기업의 효율적인 연구개발 기반 조성이 목적인 사업이다. 동 사업으로 지원이 가능한 연구장비 보유기관들이 가지고 있는 공동활용 가능한 장비의 목록이다. 지원사항은 아래와 같다.(시험설계‧분석) 중소기업 보유기술, 제품의 고도화를 위해 대학‧연구기관‧민간이 보유한 연구장비 및 전문인력 활용 지원(사업화) 인증‧시제품 제작 등 사업화를 위해 대학‧연구기관‧민간이 보유한 연구장비 활용 지원동 사업은 사업명이 연구장비공동활용지원사업 ->  연구기반 활용플러스사업 -> 연구장비활용 바우처 지원사업 순으로 변경되었고, 2023년을 마지막으로 사업이 종료되었다.
