summary_user: 근로복지공단이 고용보험 가입사업장에 적용하는 사업종류(업종)를 대분류·업종코드·업종명 단위로 담은 코드표 파일로, 통계청 한국표준산업분류 11차의 세세분류를 원칙으로 한 전국 단위 비공간 자료다. 사업주나 노무 담당자가 자기 사업장이 고용보험에서 어떤 업종코드로 분류되는지 확인하거나, 분석가가 고용보험 통계의 업종코드를 업종명으로 풀어 읽는 데 쓴다. 고용보험 업종코드(classification_code)를 키로 업종코드가 들어 있는 고용보험·사업장 자료와 이어 쓰고, 한국표준산업분류 기반이므로 산업분류 코드를 쓰는 다른 자료와 맞대어 쓰는 코드 마스터 역할을 한다.
description_portal: '근로복지공단에서 제공하는 고용보험 가입사업장에 적용 되는 고용보험 업종 정보로, "고용보험 업종(대분류)", "고용보험 업종코드", "고용보험 업종명"의 데이터를 제공합니다.* 사업종류 분류 기준: 사업의 범위에 관하여는 법 또는 이 영에 특별한 규정이 있는 경우 외에는 「통계법」 제22조에 따라 통계청장이 고시하는 『한국표준산업분류표』에 따름(고용보험법시행령 제2조) - 이에 따라 고용보험  사업의 종류 구분을 한국표준산업분류표상의 산업세세분류를 원칙으로 함.  ※  데이터 출처: 통계청 표준산업분류코드 11차'
