summary_user: 한국남부발전이 발전연료용 유연탄을 전자입찰로 구매한 내역을 입찰 건별로 담은 원천 파일로, 공고번호·입찰공고일·입찰마감일·입찰물량(톤)·운송조건이 한 행에 기록된다. 에너지 분석가나 석탄 공급 사업자가 남부발전이 언제, 얼마만큼, 어떤 인도조건으로 유연탄을 사들였는지 확인하는 데 쓴다. 공고번호(kospo_coal_bid_no)가 건별 키이므로 같은 공고번호를 쓰는 남부발전의 다른 입찰·계약 자료와 이어 쓰며, 지역 코드가 없어 지역별 에너지 사용량 자료와는 직접 연결되지 않는다.
description_portal: 이 데이터는 한국남부발전의 유연탄 전자입찰 세부 정보를 정리한 자료입니다. 각 입찰 건별로 공고번호, 입찰공고일, 입찰마감일, 입찰물량(MT), 운송조건이 기록되어 있어 발전연료 조달 과정을 투명하게 확인할 수 있습니다. 입찰물량은 수만~수십만 톤 단위로 구성되어 있으며, 운송조건은 주로 FOBT(본선인도조건) 방식이 적용됩니다. 이를 통해 유연탄 조달 시기와 계약 규모를 파악할 수 있고, 국제 석탄 시장에서의 조달 전략을 이해할 수 있습니다. 본 자료는 안정적인 발전연료 확보와 공기업의 조달 과정 투명성을 높이는 데 기여하며, 향후 에너지 자원 관리 정책과 발전 연료 구매 전략을 수립하는 데 기초 자료로 활용될 수 있습니다.
