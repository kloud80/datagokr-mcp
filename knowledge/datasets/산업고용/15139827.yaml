summary_user: 국내 판매 신차의 모델별 표시연비·도심/고속도로 연비·CO2 배출량(g/km)·연비등급·예상 연간유류비를 담은 전국 단위 모델·제품 원장으로, 전기차는 1회충전주행거리도 함께 담는다. 차를 사려는 소비자가 "같은 연도에 나온 하이브리드 SUV 중 연비와 연간 유류비가 가장 나은 모델은 무엇인가"를 비교하거나, 분석가가 제조사·연료별 연비와 CO2 배출 수준을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·모델명(MODEL_NM)·연료 같은 이름 매핑으로만 이어 쓰며, 같은 기관의 효율등급 제품 데이터와 함께 보는 정도로 연결한다.
description_portal: 본 데이터는 국내 시장에 판매되는 모든 신차(승용차, 승합차, 화물차 등)에 대해 '에너지이용 합리화법'에 따라 의무적으로 표시해야 하는 연비(에너지 소비 효율) 및 이산화탄소(CO2) 배출량 정보의 목록을 제공합니다. 이는 '자동차 에너지소비효율 및 등급표시 제도'의 핵심이며, 소비자가 자동차 구매 시 차량의 경제성과 친환경성을 쉽게 파악하고 합리적인 선택을 할 수 있도록 지원하는 데 그 목적이 있습니다.이 데이터셋은 고효율 자동차의 개발 및 판매를 촉진하고, 자동차 산업 전반의 연비 향상 기술 개발을 유도하여 국가적인 에너지 절약과 온실가스 배출량 감축 목표 달성에 기여합니다. 정부는 이 데이터를 통해 자동차 산업의 연비 현황을 파악하고 관련 정책의 효과를 평가하며, 자동차 제조사는 시장 동향 분석 및 제품 개발 전략 수립에 활용할 수 있습니다. 궁극적으로는 친환경 운전을 장려하고, 대기 환경 개선에 이바지합니다.
