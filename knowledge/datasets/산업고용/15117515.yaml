description_portal: 한국수력원자력㈜이 공개하는 텔레비전 광고 데이터는 한국수력원자력이 제작·방영한 TV 광고 파일에 대한 정보를 제공합니다. 영상 목록은 기타 유의사항에 기재된 링크를 통해 확인할 수 있으며, 이를 통해 대국민 홍보 활동의 일환으로 제작된 광고 영상을 열람할 수 있습니다. 저작권 관련해서는 「저작권법」 제24조의2에 따라 한국수력원자력이 저작재산권 전부를 보유한 경우 별도의 허락 없이 자유 이용이 가능합니다. 다만 자유 이용이 가능한 자료는 반드시 “공공저작물 자유이용허락 표시기준(공공누리, KOGL) 제1유형”이 부착되어야 하며, 해당 표시가 없는 경우에는 자유 이용이 제한됩니다. 자유 이용 시에는 반드시 출처(한국수력원자력㈜)를 명확히 표기해야 하며, 이러한 조건을 준수할 경우 교육, 홍보, 연구 등 다양한 용도로 활용할 수 있습니다. 이 데이터는 한수원의 대외 커뮤니케이션 활동과 공공저작물 개방 정책을 이해하는 데 도움이 됩니다. 한국수력원자력 유튜브 광고 재생목록 https://www.youtube.com/playlist?list=PLHrJjOtsGpmqOY6qqStpV8hvcU2HfmjLJ
