description_portal: '회생가능성이 높은 기업 대상으로 회생절차 전반(회생신청~회생인가)에 전문가 자문 및 절차 대행 등 컨설팅을 지원하는 사업으로 2024년 업종별  지원기업 현황을 확인할 수 있는 데이터입니다.세부 내용은 다음과 같습니다.- 업종: 업종을 9가지로 분류하였습니다.- 지원기업: 업종별 회생컨설팅 지원기업 수를 나타냅니다.- 비중_퍼센트: 업종별 회생컨설팅 지원기업의 비중을 나타냅니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.'
