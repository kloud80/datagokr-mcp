summary_user: 서울시가 관리하는 대규모점포(백화점·대형마트·복합쇼핑몰 등)의 인허가를 점포 한 건씩 담은 원천 데이터로, 관리번호·인허가일자·취소일자·영업상태·폐업일자·사업장명·업태·지번/도로명주소·좌표를 포함한다. 유통업 분석가나 창업자가 '우리 구에 정상 영업 중인 대형마트·백화점은 어디이고 언제 허가·폐업했는가'를 확인하거나 상권·입지 분석의 기준 점포 목록으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 상가·상권 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 같은 기관 코드로만 연결하며, 좌표(X·Y)를 이용한 위치 기반 결합도 고려할 수 있다.
description_portal: 'ㅇ 데이터 개요서울시에서 관리하는 대규모점포(쇼핑몰, 마트, 백화점 등)의 인허가 현황을 담은 데이터로, 점포별 허가·취소, 영업 상태, 주소, 업태, 사업장명 등 상세 정보를 제공합니다.ㅇ 주요 항목관리번호: 각 점포별 인허가 고유 식별자인허가일자 / 취소일자: 최초 허가 및 취소 처리 일자영업상태: 정상영업, 폐업, 휴업, 영업개시전 등 상태 구분사업장명 및 업태구분: 점포명, 업태(복합쇼핑몰, 대형마트, 백화점 등)주소 및 좌표: 도로명주소, 우편번호, X·Y 좌표를 포함한 위치 정보데이터갱신일자: 서울시에서 마지막으로 갱신한 일자ㅇ 데이터 활용성상권 분석, 신규 점포 입지 선정, 유통 정책 수립, 인허가 관리, AI 기반 상권 예측 모델 학습 등 다양한 분야에서 활용 가능합니다.'
