summary_user: 서울시 상권분석서비스의 공간 영역 정보로, 시도 단위 영역의 코드·이름(MEGA_CD, MEGA_NM), 중심 X·Y 좌표, 면적(㎡)을 담는 기초 지리 데이터다. 상권 분석가나 도시계획 연구자가 '서울시 영역의 중심 위치와 면적이 얼마인가'를 확인하고 지도 제작·면적 기반 지표 계산의 기준값으로 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시도 이름·코드를 매핑하거나 같은 서울시 상권분석서비스 데이터의 코드 체계로만 잇는다.
description_portal: 이 데이터는 서울특별시의 공간 영역 정보를 제공하는 기초 지리 데이터입니다. 행정 구역 단위인 MEGA_CD와 MEGA_NM을 통해 지역을 식별하며, 중심 좌표값(X좌표, Y좌표)과 전체 면적(RELM_AR, 단위㎡)이 포함되어 있습니다. 서울의 행정적 경계와 공간적 특성을 수치화하여 지도 제작, 공간 분석, 도시계획 연구 등에 활용할 수 있습니다. 특히 인구 분포, 상권 분석, 환경 관리와 같은 다양한 공공 정책 수립의 기초자료로서 중요한 역할을 하며, 서울시의 행정적 위치와 면적 기반 정보를 이해하는 데 유용합니다.
