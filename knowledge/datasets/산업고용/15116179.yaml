description_portal: '서울특별시 중구의 담배를 매입하여 일반인에게 판매하는 업소 정보입니다. 해당 데이터에는 업소명, 소재지 주소, 인허가일자, 영업 상태, 취급 품목, 좌표정보 등의 항목이 포함되어 있습니다. 이를 통해 시민은 주변 담배 판매업소의 위치와 운영 여부를 확인할 수 있으며, 관계 기관은 유통 질서 유지와 불법 판매 방지, 정책 수립에 활용할 수 있습니다. 변경 이력 정보는 업소의 이전, 명의 변경 등 행정 변동 사항을 파악하는 데 유용합니다. 또한 영업 상태와 폐업 정보는 시장 현황 분석과 상권 변화 연구에 중요한 자료로 쓰입니다. 본 데이터는 정기적으로 갱신되어 최신 정보를 반영하며, 누구나 공공데이터포털을 통해 열람하고 활용할 수 있습니다. 이를 통해 지역사회 유통 관리와 공중 보건 향상에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
