summary_user: 광주광역시 남구의 봉선시장과 무등시장 안 점포를 한 행씩 담은 건별 목록으로, 시장명·개설일자·점포명·도로명주소·데이터기준일자를 담는다. 남구 전통시장에 어떤 점포가 있고 시장별 점포 수가 얼마인지 확인하려는 상인 지원 담당자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 상가·상권 데이터와는 도로명주소나 점포명·시장명을 이름 매칭해 이어 쓴다.
description_portal: 광주광역시 남구 내 전통시장에 대한 데이터로, 봉선시장과 무등시장 내 점포  개설일, 주소, 점포수, 점포명 등의 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2712)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 전통시장은 지역 고유의 상권과 문화가 어우러진 상업 공간으로, 다양한 점포가 모여 생활 필수품, 식재료, 의류, 잡화 등 여러 품목을 판매합니다. 해당 데이터를 통해 상권 분석, 시장 활성화 정책 수립, 상인 지원 사업 기획, 관광 연계 프로그램 개발 등에 활용할 수 있으며, 전통시장의 경쟁력을 높이고, 지역 경제와 공동체 활성화에 기여하는 기반 자료로 쓰일 수 있을 것으로 보입니다.
