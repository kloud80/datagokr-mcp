summary_user: 서울특별시 금천구의 일반게임제공업(오락실 등) 업소를 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·사업장명·주소·전화번호·좌표와 시설면적·층수·비상구·소방·편의시설 여부 같은 시설 항목을 담는다. 창업 준비자나 분석가가 '금천구에 지금 영업 중인 오락실은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 관리번호·사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 좌표(X·Y)를 써서 소상공인 상가업소나 다른 LOCALDATA 업종 인허가 데이터와 위치 기준으로 겹쳐 본다.
description_portal: 일반게임제공업의 인허가 및 영업 현황을 종합한 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명, 시설면적, 총게임기수, 편의시설, 소방시설, 청소년실 여부 등 다양한 항목을 포함하고 있습니다. 이를 통해 오락실 등 일반게임제공업의 창업 준비, 운영 현황 파악, 정책 수립, 지역 내 업소 분포 분석, 시설 안전 점검 등에 활용할 수 있습니다. 또한 해당 데이터는 게임 산업 동향 분석, 청소년 보호 대책 마련, 지역 상권 변화 연구, 업계 경쟁력 강화 전략 수립 등 다양한 분야에서 기초 자료로 쓰이며, 행정기관·연구기관·민간 기업 모두에 유용한 참고 자료가 됩니다.
