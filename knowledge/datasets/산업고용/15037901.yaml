description_portal: 이 데이터는 한국남부발전의 기록물 관리 현황을 연도별로 정리한 자료입니다. 기록물의 유형을 생산과 폐기로 구분하고, 다시 전자와 비전자 형태로 나누어 보존기간별 분류 현황을 수치로 제시하고 있습니다. 보존기간은 1년, 3년, 5년, 10년, 30년, 준영구, 영구 등으로 구분되어 있어 기록물이 어느 기간 동안 관리되는지를 명확히 확인할 수 있습니다. 이를 통해 전자기록과 비전자기록의 생산·보존·폐기 추이를 파악할 수 있으며, 장기적으로 관리되는 준영구 및 영구 기록물의 비중을 확인할 수 있습니다. 본 자료는 공공기관의 기록물 관리 체계와 보존 정책을 이해하는 데 유용하며, 투명한 행정 운영과 정보 공개 활성화, 그리고 기록 관리 제도의 개선 방향을 분석하는 데 기초 자료로 활용될 수 있습니다.
