description_portal: 한국남동발전의 연료원별 월별 도입물량 데이터입니다.해당 데이터는 2015년 01월부터 도입된 한국남동발전의 연료 도입 실적을 확인할 수 있으며, 유연탄, 무연탄, 유류, LNG, 유기성고형연료, 우드팰릿 등 정보를 제공합니다. 상세 사항으로 구분, 일자, 연료코드, 연료명, 연료량을 포함하고 있으며, EXCEL 형식이나 CSV 파일 형식으로 다운로드할 수 있습니다. 이 데이터는 연료별 도입 현황과 사용량 추이를 파악하여 발전소 운영 효율성을 분석하고, 연료 조달 전략 및 비용 관리에 활용할 수 있습니다.
