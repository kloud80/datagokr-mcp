description_portal: 에너지 인포그래픽은 에너지 소비, 가격, 수급 구조 등 복잡한 데이터를 누구나 쉽게 이해할 수 있도록 시각화한 정보 콘텐츠이다. 월별 주제에 따라 산업·수송·가정 등 부문별 소비 변화, 국제 원유·가스·석탄 가격 동향, 전기·도시가스 요금 추이, 그리고 수소에너지 인프라와 같은 미래 에너지원 현황까지 다룬다. 각 호는 도표, 그래프, 아이콘, 지도 등을 활용해 핵심 지표를 직관적으로 보여주며, 단순한 수치를 넘어 변동 원인과 배경을 함께 설명한다. 이를 통해 연구자, 정책 담당자, 일반 국민 모두가 국내외 에너지 현황을 빠르게 파악할 수 있도록 돕는 것이 특징이다. 해당 데이터는 이러한 인포그래픽에 대한 이미지 링크와 게시일자 등의 정보를 포함한다.
