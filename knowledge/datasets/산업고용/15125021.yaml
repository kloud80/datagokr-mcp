summary_user: 한국전력공사가 운영하는 전기차 급속충전기의 설치 현황을 지역별로 묶어 2018년부터 2022년까지 연도별 수치로 담은 집계 파일(CSV, 631바이트)이다. 지역 정책 담당자나 분석가가 '우리 지역의 한전 급속충전기는 해마다 얼마나 늘었고 다른 지역과 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 지역별 전기차 등록대수 같은 다른 통계와는 지역 이름을 맞춰 붙여야 한다.
description_portal: 한국전력공사에서 운영하고 있는 전기차 급속 충전기 설치 현황을 지역별로 집계한 데이터입니다.지역과 함께 2018년부터 2022년까지 연도별 설치 현황 항목으로 구성되어 있습니다.사용자는 해당 자료를 통해 연도별, 지역별 전기차 충전 인프라 확산속도를 파악할 수 있습니다.특정 지역의 연간 충전기 설치 증가율을 분석하여 지역간의 인프라를 비교하는 기초 자료로 활용될 수 있으며, 지역별 전기차 등록대수 데이터와 결합해 충전기 보급이 전기차 증가속도에 맞춰 적절하게 이루어지고 있는지 등에 대한 분석에도 도움을 줄 수 있습니다.※ 한국전력에서 운영하는 전기차 충전소 현황으로 전체 전기차 현황은 아님을 안내드립니다.
