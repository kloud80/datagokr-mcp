summary_user: 경기도 장애인일자리사업 참여 인원을 기준년도·시군·성별로 나눠 집계한 자료로, 총계와 복지일자리·일반형·시간제 인원을 담고, 필드상 돌봄보조와 시각장애인 안마사 인원도 함께 있다. 정책 분석가나 지자체 담당자가 '우리 시군의 장애인 참여자는 어떤 유형의 일자리에 많이 몰려 있고, 성별·연도별로 어떻게 달라졌나'를 확인할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 시군 단위 통계와는 시군명이나 시군코드(SIGUN_CD)를 이름·코드로 맞춰 붙이고, 같은 기관(경기도) 자료끼리 연결한다.
description_portal: 이 데이터는 장애인일자리사업에 참여한 인원을 사업 유형별로 구분하여 집계한 자료로, 지역별·성별·연도별 고용 현황을 보여줍니다. 주요 항목에는 기준년도, 시군명, 성별, 총계(명), 복지일자리 인원수, 일반형 일자리 인원수, 시간제 일자리 인원수가 포함되어 있습니다. 이를 통해 특정 지역에서 장애인들이 어떤 유형의 일자리에 주로 참여하는지를 파악할 수 있으며, 복지형·일반형·시간제 일자리 간 분포를 비교할 수 있습니다. 또한 성별 및 연도별 추이를 분석하여 장애인 고용 지원 정책의 효과성을 평가하고, 맞춤형 일자리 제공 전략 수립에 활용될 수 있습니다.
