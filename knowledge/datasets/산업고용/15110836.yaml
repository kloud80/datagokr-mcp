summary_user: 근로복지공단 업무상질병판정위원회가 업무상 질병 여부를 심의한 질병판정서를 판정위 사건번호 단위로 담으며, 심의결과·직종유형·질병구분·업종명과 판정서 본문을 함께 제공하고 범위는 전국이다. 산재 신청을 준비하는 근로자나 노무 대리인이 '내 직종에서 이 질병이 업무상 질병으로 인정된 사례와 기각된 사례는 어떻게 다른가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 전역 조인 키가 없어, 산재 판례·심사결정 등 같은 기관 데이터와는 업종명·직종유형·질병구분 같은 이름 매핑으로만 이어 쓴다.
description_portal: 본 API는 근로복지공단 업무상질병판정위원회에서 업무상 질병 여부를 심의한 결과인 질병판정서 정보를 개방하여 산재 판정의 객관성과 투명성을 높이기 위해 구축된 서비스입니다. 산업재해보상보험에서 질병의 업무 관련성을 판단하는 것은 매우 전문적이고 복잡한 과정인 만큼, 본 서비스는 사용자가 직종유형, 질병구분, 심의결과 등의 조건을 결합하여 질병판정서를 정밀하게 검색하고 그 세부 판정 근거를 확인할 수 있도록 지원합니다. 특히 특정 직종에서 주로 발생하는 질병에 대한 인정 사례와 기각 사례를 비교 분석할 수 있는 데이터를 제공함으로써, 산재 신청을 준비하는 근로자와 대리인에게 명확한 판단 기준과 예측 가능성을 제시하는 중요한 지표가 됩니다. 또한, 이러한 고가치 의료·행정 융합 데이터의 개방은 민간 리걸테크 및 헬스케어 산업에서 업종별·직종별 맞춤형 질병 위험도 분석 모델을 개발하거나 AI 기반의 산재 상담 솔루션을 고도화하는 데 핵심적인 기초 자료로 활용될 수 있으며, 학술적으로는 산업보건 정책 수립 및 직업병 예방 연구를 위한 정밀한 통계 데이터로서의 가치를 지닌다고 판단됩니다.
