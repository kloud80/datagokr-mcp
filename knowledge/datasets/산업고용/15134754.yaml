summary_user: 국토교통부 골재자원조사에서 실시한 시추공 한 곳당 한 행으로, 시추심도와 주소·위도·경도, 그리고 점토·모래·사력·연암·미고결 퇴적암 구성비와 골재부화율(퍼센트)을 담은 전국 범위의 건별 원천 파일이다(CSV 약 16KB). 골재 채취 사업자나 지반·자원 분석가가 특정 지역 지하 퇴적층에 모래·자갈이 얼마나 있는지, 골재로 쓸 만한지를 확인하는 데 쓴다. 전역 조인 키는 없으므로 위도·경도 좌표나 주소로 공간 결합하거나, 같은 조사의 다른 파일과는 조사지역일련번호로 이어 쓴다.
description_portal: 시추조사는 지표면 하부 지층의 상태를 직접 관찰할 수 있으며, 심부 지층의 시료채취를 위해 반드시 실시해야 함, 산림골재에서는 회전식, 그리고 육상과 하천골재 시추에서는 충격식과 변위식 시추방법을 사용함, 시추심도는 각 시추공별로 기반암이 확인되는 심도까지이며, 모든 시추공 내 퇴적층 전 구간에서 코어시료를 회수하는 것을 원칙으로 함, 시추조사가 완료되어 코어를 확보한 후 지층을 굴착한 공은 앞으로 별도의 이용계획이 없다면 별도의 조치 없이 방치되게 되며, 이러한 공들을 불용공이라 함, 이는 지표에서의 오염원이 지하 심부로 이동되는 통로가 되는 것을 방지하기 위한 조치로, 불용공 처리까지 되면 시추조사는 완료됨을 의미함
