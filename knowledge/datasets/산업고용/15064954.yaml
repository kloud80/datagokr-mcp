summary_user: 인천광역시 제조업을 중분류(음식료품·섬유·의복·가죽·목재 등) 업종별로 나눠 2025년 1~12월 월별 전력 사용량(MWh)을 집계한 소규모 통계 파일로, 업종이 행이고 월이 열인 가로형 표다. 지역 에너지·탄소중립 정책 담당자나 분석가가 '인천에서 어떤 제조업종이 전력을 가장 많이 쓰고 계절에 따라 어떻게 달라지나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종 중분류 이름을 표준산업분류 등에 이름으로 맞추거나 인천시 단위로만 연결한다.
limits: 업종명 외에 코드나 공통 키가 없어 사업체·산업 통계와 바로 결합되지 않고, 업종명 매핑을 직접 해야 한다. 인천시 전체 단위 집계라 군·구나 사업장별 사용량은 알 수 없다. 월이 열로 펼쳐진 형태라 분석 전에 세로형으로 바꿔야 한다.
