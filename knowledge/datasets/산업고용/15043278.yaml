summary_user: 발전그룹사 5곳(남동·남부·동서·서부·중부발전)의 신재생 에너지 설비를 사업 단위로 담은 파일로, 발전사·에너지원(ESS, 바이오, 수력, 연료전지, 태양광, 풍력, 조류 등)·사업명·설비용량이 한 행에 들어 있으며 전국 범위의 비공간 자료다(CSV 약 6KB). 에너지 분석가나 정책 담당자가 "공기업 발전사별로 태양광·풍력 등 에너지원별 신재생 설비용량이 얼마인가"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 발전사명·사업명 같은 이름 매핑으로만 이어 쓰며, 발전소 단위 주소·용량을 담은 전국태양광발전소전기사업허가정보표준데이터와는 사업명·용량을 대조하는 정도로 연결한다.
description_portal: 발전그룹사(한국남동발전, 한국남부발전, 한국동서발전, 한국서부발전, 한국중부발전)의 신재생 에너지 설비 현황 정보입니다. 발전그룹사별 에너지원(ESS, 바이오, 수력, 연료전지, 태양광, 풍력, 조류 등) 유형에 대한 사업명과 설비용량이 포함되어있습니다. 이 데이터는 에너지 산업 분석, 설비 확충 계획 수립, 설비 운영 최적화, 전력 수급 계획 등 다양한 방면에서 고부가가치로 활용될 수 있습니다. 또한 에너지원별 설비 현황을 체계적으로 파악해 전력 수급 안정, 재생에너지 확대, 투자 전략 수립, 정책 투명성 강화를 지원할 수 있습니다.
