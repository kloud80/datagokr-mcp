description_portal: 이 데이터는 서울특별시 광진구 관내 「대부업 등의 등록 및 금융이용자 보호에 관한 법률」에 따라 자치구에 등록된 대부업 및 대부중개업체 현황을 제공하는 자료입니다.대부업은 타인에게 금전 등을 대출하거나 신용을 제공하는 업태이며, 대부중개업은 이러한 대부행위를 중개하는 업소로, 등록된 업체만 영업이 가능하며 불법 사금융 예방을 위해 관련 정보가 공개됩니다.제공되는 항목은 업체 상호, 사업장 소재지, 대표자명, 등록번호, 운영 여부, 연락처 등이며, 이를 통해 지역 내 합법 등록 업체 여부 확인, 금융소비자 보호, 불법 대부업 사전 방지, 행정 지도·점검 등에 활용됩니다.본 데이터는 광진구청 및 관련 부처의 등록 현황을 기반으로 작성되며, 정기적 갱신을 통해 실제 운영여부와 최신 등록 상태를 반영합니다.※ 소비자는 해당 데이터를 통해 안전한 금융 거래 여부를 사전 검토할 수 있으며, 불법 대부업체 식별 및 신고 기반 자료로도 유용합니다.
