summary_user: 중소벤처기업진흥공단이 확인한 비대면(언택트) 분야 벤처인증기업을 기업 한 건당 한 행으로 담은 전국 단위 파일로, 업종명·세부업종·지역·벤처인증일자·인증유형이 들어 있다. 분석가나 정책 담당자가 '비대면 분야 벤처기업이 어느 지역·업종에 몰려 있고 어떤 인증유형으로 인정받았는가'를 살필 때 쓴다. 사업자번호 같은 전역 조인 키가 실측 컬럼에 없어서 다른 데이터와는 지역명·업종명을 이름으로 맞추는 방식으로만 이어 쓴다.
limits: 기업명이나 사업자번호가 없어 개별 기업을 특정하거나 다른 기업 원장과 기업 단위로 연결할 수 없다. 지역은 공간 좌표가 없는 비공간 정보라서 지도 위치 분석에는 바로 쓰지 못한다.
