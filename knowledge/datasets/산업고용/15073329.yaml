description_portal: ‘벤처기업’이란 일반적인 의미로 첨단의 신기술과 아이디어를 개발하여 사업에 도전하는 기술집약형 중소기업을 의미합니다. 우리나라에서는 「벤처기업육성에 관한 특별법」에서 정한 요건의 기업들을 ‘벤처기업’으로 정의하고 있으며 ‘벤처투자유형 / 연구개발유형 / 혁신성장유형’으로 구분하고 있으며, 중소벤처기업 진흥공단은 연구개발유형에 대한 평가를 진행하고 있으며,  ① 벤처기업확인 신청기업의 서류검토 및 현장실제조사 ② 신청기업의 기술의 혁신성 및 사업의 성장성 평가 등의 업무를 수행합니다. 이 정보는 비대면 분야 벤처인증 현황 자료를 제공합니다.
