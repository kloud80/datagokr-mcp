description_portal: '○ 통계개요* 통계명 : 유통업체 현황(동별)* 통계종류 : 서울시에 등록된 유통업체 현황을 자치구별로 제공하는 일반ㆍ조사통계* 근거법령 :「유통산업발전법」제8조 규정에 의거 각 구청에 등록된 유통업체* 작성목적 : 대형마트 및 백화점 등 등록된 유통업체 현황을 파악하여 유통산업에 대한효율적인 지원과 정책수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울특별시 소상공인지원과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 대형마트(할인점), 백화점, 전문점 등 대규모점포의개소수 및 면적(영업장면적, 매장면적, 건물연면적) 현황'
