description_portal: 해당 데이터는 2024년 측정된 데이터로 1단계 처분시설에서 배출된 기체 방사성물질로 인한 예상 주민피폭선량 데이터임.부지당 기준치는 0.25mSv/yr이며 일반인에 대한 선량한도는 1mSv/yr로 중저준위 방사성폐기물 운영에 따라 주변 주민이 자연선량률 외 추가로 받는 선량은 극히 미미한 정도임을 나타내고있음.해당 데이터는 제한구역경계에서의 기체 방사성물질 배출물에 의한 신체부위별 선량평가 결과로, 유효선량과 피부선량은 외부피폭에 의한 것이고 장기의 경우 최대 피폭장기를 선정하여 최대 연령군은 1세, 최대 장기는 소화기임.단위는 조직에 대한 개인선량은 mGy/yr이고 조직선량에 대한 단위는 mSv/yr로 작성되어져있다.해당 데이터는 연간 발생하는 데이터이나 행 및 열의 구성에 따라 누적 파일로 관리되고 있지 않아서 일회성 데이터로 등록됨.
