summary_user: 청주시 관내 산지전용허가지에서 반출되는 부수적 토석채취 허가를 건별로 담은 파일로, 수허가자 상호·허가지 주소·채취 용도·허가면적·허가 시작·종료일을 담으며 파일 크기는 416바이트로 몇 건 안 되는 소규모 목록이다. 건설·골재 사업자나 주민이 청주시 안에서 현재 토석채취 허가가 난 곳이 어디이고 언제까지 허가돼 있는지 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 허가지 주소를 지오코딩하거나 이름으로 맞춰야 산지·토지이용 규제 같은 국토 공간 자료와 겹쳐 볼 수 있다.
description_portal: 충청북도 청주시 관내 산지에서 허가된 토석채취허가 공공데이터 파일 자료입니다.이는 산지전용허가지(허가지 주소)에서 반출되는 부수적 토석채취허가 현황에 대한 다양한 정보를 제공하고 있습니다.연번, 수허가자 상호명, 허가지 주소, 토석채취용도, 허가면적(㎡), 허가시작일자, 허가종료일자, 데이터기준일 등 총  8개 항목의 정보를 제공합니다.토석채취 허가는 흙과 돌(토석)을 자연에세 파내어 사용할 수 있도록 해당 지방자치단체에 공식적으로 허가는 받는 사항으로,무분별한 채굴 방지, 산림 등 훼손 방지 등을 위하여  허가를 득한 후 채취가 가능합니다.본 공공데이터를 사업용이나 개인용 등 다양한 방면에 활용할 수 있습니다.
