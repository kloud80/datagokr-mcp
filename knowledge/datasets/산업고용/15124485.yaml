description_portal: 울산광역시 북구의 혼성 플라스틱 제조업체에 대한 현황 입니다.포함된 정보로는 회사명, 대표자명, 소재지, 업종코드, 업종명입니다.활용가치로는 주소를 GIS로 도식화 하여 지역별 산업 분포도 분석하는 참고자료로 사용할 수 있고, 환경과 관련하여 폐기물과 밀접한 산업으로 폐기물 배출량 규제 분석 자료로 활용가능합니다.또한 행정적 목적으로는 혼성플라스틱 중에서도 친환경 업체는 지원금 보조, 세제 해택 등 정책수립에 근거자료로 활용가능합니다.더 필요하신 사항은 경제일자리과(제조업 담당), 미디어정보과(공공데이터 담당)으로 문의주시기 바랍니다.
