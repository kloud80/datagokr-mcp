summary_user: 서울 양천구 관내 위탁급식영업소를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·인허가일자·영업상태와 상세상태·폐업일자·지번/도로명 주소·소재지면적·업태·남녀 종사자수·좌표(X, Y) 등을 포함한다. 급식 위탁업체를 찾는 기관이나 분석가가 '양천구에서 현재 영업 중인 위탁급식업체는 어디이고 규모는 어떤가'를 확인하거나, 지도점검 대상을 추릴 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드로만 이어 쓰며, 같은 LOCALDATA 계열의 다른 업종 인허가 데이터와 형식이 같아 함께 묶어 쓰기 쉽다.
description_portal: 본 데이터는 서울특별시 양천구에서 관내 위탁급식영업 시설의 인허가 정보를 체계적으로 관리하기 위하여 수집·정리한 행정자료이다. 해당 자료는 급식 제공을 목적으로 운영되는 각 사업장의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 주요 항목을 포함하며 지역 내 위탁급식 운영 실태를 종합적으로 파악할 수 있도록 구성되어 있다. 또한 신규 허가, 변경 신고, 행정처분, 휴·폐업 등의 절차 이력 정보를 제공하여 급식 안전성 확보와 지도점검 계획 수립에 활용될 수 있다. 본 데이터는 사업장의 급식 제공 능력과 운영 환경을 투명하게 공개함으로써 공공 급식 서비스의 질 향상과 행정 의사결정 지원에 기여한다. 아울러 정기적인 갱신을 통해 최신 인허가 정보를 유지하며 민원 처리의 효율성 제고에도 도움을 준다.* 위탁급식영업 - 집단급식소를 설치 및 운영하는 업체와 계약에 따라 해당 집단급식소에서 음식류를 조리하여 제공하는 업소
