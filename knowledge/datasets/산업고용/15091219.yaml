summary_user: 충청북도 도내에 소재한 반도체 관련 기업을 기업 한 곳당 한 행으로 담은 목록 파일이며, 기업명·주생산품·업종명(KSIC 기준)·본사주소·사업장주소를 담는다. 투자·협력처를 찾는 사업자나 지역 산업 분석가가 '충북 어느 시군에 반도체 소재·부품·장비 기업이 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기업명이나 주소(시군구) 문자열 매칭으로만 이어 쓰며, 업종명은 KSIC 코드가 아닌 분류명이므로 표준산업분류 코드표와 이름으로 맞춰야 한다.
limits: 사업자등록번호 같은 공통 키가 없어 다른 기업 원장과 정확히 연결하기 어렵고, 기업명·주소 매칭에 의존해야 한다. 포털 설명대로 업종분류 적용 기준에 따라 누락·추가된 업체가 있을 수 있고, 주생산품이 반도체가 아닌 소재·부품·장비 업체도 포함된다.
