description_portal: 서비스산업 주요 지표를 제공하는 데이터 입니다. 포함 항목은 서비스 산업  취업자 수와 전산업대비 비중, 부가가치, 생산지수, 물가지수, 서비스 산업내 주요 부문(집세, 공공서비스, 개인서비스)의 물가 현황입니다. 취업자 수 및 생산지수는 통계청 자료에서 활용되었고, 부가가치, 물가지수 항목은 한국은행 자료에서 활용되었습니다. 서비스산업의 취업자수, 부가가치 등을 중심으로 구성된 본 데이터는 서비스의 산업구조 분석, 고용현황 및 변화 파악, 정책 수립, 경기 진단에 활용 됩니다. 또한 서비스업 동향, 산업분석, 경제지표 등과 연계되어 경제 및 산업 연구에 유용한 기초자료로 쓰입니다. 산업지표, 통계자료, 구조분석, 성장률, 경제동향 등의 키워드와 관련된 기초적 참고 정보로 활용도가 높습니다.
