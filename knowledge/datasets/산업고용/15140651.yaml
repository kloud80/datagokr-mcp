description_portal: '은평구의 수소·산소·액화암모니아·아세틸렌·액화염소·천연가스·압축모노실란·압축디보레인·액화알진 등 고압가스를 사용하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 산소, 수소, 아세틸렌 등 「고압가스 안전관리법」에 따라 지정된 특정고압가스를 제조, 저장, 판매, 사용하는 업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 주소, 허가일, 현재 영업 상태(영업중, 폐업 등) 및 취급 가스의 종류 등 산업 및 공공 안전 관리를 위한 핵심 정보가 포함됩니다 .이 데이터는 병원의 의료용 가스, 산업 현장의 용접용 가스 등 필수적이지만 폭발 및 화재 위험이 큰 고압가스의 안전한 공급망을 파악하고 관리하는 데 있어 매우 중요합니다. 소방 및 가스안전 관련 기관은 이 데이터를 기반으로 위험물 취급 시설을 체계적으로 관리·감독하고, 정기적인 안전 점검을 실시하여 대형 사고를 예방합니다. 이는 주민의 생명과 재산을 보호하고, 도시의 안전을 유지하는 데 필수적인 기초 자료입니다.'
