summary_user: 서울에너지공사가 한국전력거래소를 통해 외부에 판매한 전기량을 발전소(지사) 단위·날짜별로 집계해 담는 API 데이터로, 판매량(elecSales)과 단위 정보를 포함한다. 에너지 분석가나 정책 담당자가 '서울에너지공사 발전소별로 거래소에 판매한 전력량이 기간에 따라 어떻게 변하는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 발전소·지사 이름이나 기관 내부 코드(branchCd) 매핑으로만 이어 쓸 수 있으며, 발전소 단위 주소·용량이 담긴 전국태양광발전소전기사업허가정보 표준데이터와는 이름 기준으로 맞춰 보는 정도로 연결한다.
description_portal: 서울에너지공사가 한국전력거래소를 통해 외부에 판매한 전기량에 대한 정보를 제공하는 공공데이터이다. 본 자료는 발전소 단위로 집계된 전력 판매 실적을 포함하며, 주요 항목은 발전소명, 판매일자, 판매량(kWh), 거래단가, 총판매금액 등으로 구성된다. 전기판매량은 발전소에서 생산된 전력 중 거래소를 통해 외부로 공급된 양을 의미하며, 발전소의 수익 구조와 전력 유통 흐름을 분석하는 데 활용된다. 이 데이터를 통해 에너지 생산기관의 운영 성과를 파악하고, 전력시장 내 거래 패턴과 수요 변화를 이해할 수 있다. 또한 판매량 추이를 바탕으로 생산 계획 수립과 에너지 정책 결정 시 기초자료로 활용 가능하며, 공공기관의 에너지 자원 운영과 공급 안정성 확보에도 기여할 수 있다.
