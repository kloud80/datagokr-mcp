summary_user: 전주시 관내 전문건설업체 977곳을 업체별 한 행씩 담은 원천 파일로, 업체명·등록일자·업종·등록번호·주소·좌표·전화번호를 싣고 등록일은 1976-11-10부터 2026-08-13까지다. 시민이나 건설 종사자가 전주시에서 특정 전문 업종으로 등록된 업체가 어디 있는지 찾거나, 분석가가 지역별 건설업 분포를 볼 때 쓴다. 도로명·지번 주소(address)와 위도·경도(coord)를 키로 다른 주소·좌표 기반 자료와 이어 쓰며, 업종 인허가(LOCALDATA) 계열의 다른 업종 원장과 같은 방식으로 결합할 수 있다.
description_portal: 전북특별자치도 전주시 전문건설업 현황 데이터는 전주시 관내 전문건설업체의 등록 및 운영 현황 정보를 체계적으로 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 연번, 업체명, 업체등록일자, 업종, 등록번호, 소재지 도로명주소, 소재지 지번주소, 위도, 경도, 전화번호 등의 정보를 포함하여 전문건설업체의 기본 현황과 위치 정보를 종합적으로 확인할 수 있도록 구성되었습니다.특히 업종 및 등록번호 정보를 통해 업체의 등록 현황과 전문 분야를 확인할 수 있으며, 위치정보(위도·경도)를 함께 제공함으로써 지도 기반 검색 서비스, 지역별 건설업 분포 분석, 산업 동향 파악 등에 활용할 수 있도록 설계되었습니다. 또한 시민, 건설 관련 종사자, 연구자 및 기업 등이 공사 수행 가능 업체 확인, 입찰·계약 참고자료, 지역 산업 분석 및 정책 연구 자료로 활용할 수 있습니다.전주시는 본 데이터를 통해 건설산업 정보의 투명성을 제고하고 공공정보 접근성을 강화하는 것을 목표로 하며, 신규 등록, 변경 및 말소 등 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 도시계획과에서 제공·관리합니다.
