summary_user: 서울 중구의 무료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 사업장명·관리번호·인허가일자·영업상태(영업·휴업·폐업)·폐업일자·주소·전화번호·중부원점TM 좌표를 포함한다. 구직자가 '이 소개소가 중구에 정식으로 허가받아 지금도 영업 중인가'를 확인하거나, 분석가가 중구 내 소개소의 분포와 허가·폐업 추이를 볼 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)를 통해서만 다른 구의 인허가 자료나 고용 서비스 기관 목록과 이어 붙인다.
description_portal: '서울특별시 중구에서 운영되는 무료 구직 알선 업소의 인허가 현황을 제공하는 자료입니다. 주요 항목에는 사업장명, 소재지 주소, 관리번호, 인허가일자, 영업 상태(영업 중, 휴업, 폐업), 좌표정보 등이 포함되어 있습니다. 본 데이터는 구직자가 합법적으로 운영되는 기관을 확인하고 신뢰할 수 있는 알선처를 선택하는 데 도움을 줍니다. 행정기관은 허가 현황과 영업 상태 변동을 관리하며, 점검 대상 선정이나 제도 운영의 기초 자료로 활용할 수 있습니다. 연구자와 정책 담당자는 지역 내 업소의 분포, 허가 추이, 운영 실태를 분석하여 취업 지원 정책 수립에 활용할 수 있습니다. 이 자료는 일자리 지원 서비스의 투명성을 높이고, 구직자 보호 및 고용 연계의 신뢰성을 강화하는 데 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
