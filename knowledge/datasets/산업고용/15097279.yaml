summary_user: 전력시장 회원사의 전력거래대금 결제일정을 년월·결제차수 단위로 담은 일정표 파일(csv, 약 3.5KB)로, 차수별 거래 시작일·마지막일과 청구요청일·청구일·입금일·결제일을 담는다. 발전·판매 사업자나 분석가가 특정 거래일의 거래대금이 어느 결제차수에 묶여 언제 청구·입금·결제되는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 전력시장 데이터(SMP·정산 내역 등)와는 거래일을 차수시작일~차수마지막일 구간에 맞추는 날짜 매핑으로만 잇는다.
description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 결제차수, 차수에해당하는 거래일 등 전력시장 참여 회원사의 전력거래대금 결제일정을 제공합니다.ㅇ 결제차수에 해당하는 거래일에 대한 정산내역은 결제일 이후에 확정되며, 그 이후에도 수정정산 등으로 인하여 변동될 수 있습니다.
