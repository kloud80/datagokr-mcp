summary_user: 서울특별시 중구에서 인허가를 받은 유료직업소개소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 관리번호·인허가일자·영업상태·폐업일자·소재지·사업장명·중부원점TM 좌표 등을 포함한다. 구직자가 이용하려는 중구의 직업소개소가 정식 인허가를 받아 현재 영업 중인지 확인하거나, 분석가가 중구 안 직업소개소의 분포와 개·폐업 추이를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓰며, 다른 자치구의 같은 인허가 데이터와 합쳐 서울 전체 현황을 만들 때도 이 방식으로 붙인다.
description_portal: '서울특별시 중구에서 인허가를 받아 운영 중인 유료직업소개소의 현황을 제공하는 자료입니다. 주요 항목에는 사업명, 소재지, 대표자, 관리번호, 인허가일자, 좌표정보 등이 포함되어 있습니다. 유료직업소개소는 구직자와 구인자를 연결하여 일자리를 중개하는 기관으로, 관련 법령에 따라 반드시 인허가 절차를 거쳐야 합니다. 본 데이터는 지역 내 인허가 현황을 체계적으로 기록하여 행정기관이 관리·감독을 수행할 수 있도록 지원하며, 취업 알선 서비스의 건전성과 신뢰성을 높이는 기반이 됩니다. 시민은 본 자료를 활용하여 합법적으로 운영되는 직업소개소를 확인하고 안전한 고용 서비스를 이용할 수 있습니다. 업소 운영자는 해당 데이터를 통해 지역 내 경쟁 현황을 파악하고 자율적인 서비스 품질 개선에 참고할 수 있습니다. 또한 연구자와 정책 담당자는 본 데이터를 활용하여 일자리 중개 서비스의 지역 분포와 운영 현황을 분석하고, 고용 정책 수립 및 서비스 개선 방안을 마련하는 데 기초 자료로 활용할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
