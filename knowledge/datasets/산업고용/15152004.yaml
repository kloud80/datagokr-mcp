summary_user: 충청북도 진천군 내 사업장이 등록한 구인 공고를 공고 단위로 담은 CSV 파일(약 34.6MB)로, 회사명·업종·채용제목·고용형태·모집인원·급여(최저·최대)·근무시간·복리후생·접수기간·근무지 주소 등이 들어 있다. 진천군에서 일자리를 찾는 구직자나 지역 일자리센터 상담원이 '진천에서 지금 어떤 업종이 어떤 급여로 사람을 뽑는가'를 확인하거나, 분석가가 업종별 구인 조건을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 회사명·주소(회사주소·상세주소) 같은 이름 매칭이나 주소 기반 지역 연결로만 이어 쓴다.
description_portal: 충청북도 진천군 내 사업장에서 등록된 구인 정보를 제공하는 데이터로 사업장명, 소재지, 직종, 모집 인원, 임금 수준, 근무 형태, 근무시간, 복리후생 등 채용 조건과 고용 환경에 대한 세부 내용을 포함한다. 본 데이터는 연 1회 정기적으로 갱신되어 시기별·업종별 노동 수요 변화 분석이 가능하며, 지역 일자리센터의 상담 및 취업 연계 서비스, 청년·중장년 대상 맞춤형 고용 지원 프로그램 기획, 민간 채용 플랫폼과의 데이터 결합을 통한 직무 추천 서비스 고도화, 지역 고용정책 수립 및 산업 구조 변화 대응 전략 마련에 활용할 수 있다.
