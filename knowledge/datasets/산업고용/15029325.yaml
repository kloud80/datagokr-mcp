summary_user: 충청남도 예산군 관내에서 허가된 산지 토석채취 사업장을 건별로 담은 파일로, 사업장마다 소재지·업체명·연락처·면적·용도·허가기간·허가량·허가권자를 기록한다(파일 크기 약 1.7KB의 소규모 목록). 예산군에서 지금 어느 업체가 어디서 얼마만큼 토석을 캐도록 허가받았는지, 허가기간이 언제까지인지 확인하려는 주민·건설 사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 업체명을 매핑해 잇거나, 같은 기관이 낸 데이터와만 연결된다.
description_portal: 충청남도 예산군 산지 토석채취허가현황 데이터를 제공합니다.(업체명, 연락처, 면적, 용도, 기간 등)충청남도 예산군 산지 토석채취허가 정보 제공을 통해 정보가 필요한 사람에게 도움을 준다이 데이터는 충청남도 예산군에서 허가된 토석채취 행위에 대한 위치, 면적, 허가기간 등의 현황 정보를 제공합니다.토석채취란 토지 내 흙, 모래, 자갈, 암석 등의 자원을 개발 또는 공사 목적으로 채취하는 행위입니다.예산군 관내 허가된 토석채취 사업장의 위치, 면적, 허가기간, 허가자(업체명) 등으로 구성되어 있으며,공공데이터포털을 통해 국민 누구나 열람하고 활용할 수 있습니다.
