summary_user: 한국전력거래소 전력시장에 참여하는 발전기의 연료원별 설비용량과 전력거래량을 날짜·시간 단위로 담은 전국 단위 집계 API이며, 포털 설명상 정산 기준 D-2월 실적만 제공한다. 에너지 분석가나 발전사업자가 '최근 몇 달 사이 LNG·석탄·신재생 등 연료별 거래량 비중이 어떻게 바뀌었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연료원 이름이나 거래일(tradeDay) 같은 날짜를 맞춰 붙여야 하고, 같은 기관의 SMP·발전량 데이터와 함께 쓰는 것이 현실적이다.
description_portal: ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다. ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다. 한국전력거래소 전력시장에서 전력을 거래하고 있는 연료별 설비용량과 전력거래량을 날짜 및 시간별로 조회할 수 있는 서비스전력시장에 참여하는 발전기의 연료원별 월별 설비용량, 거래량 합계를 제공합니다.(정산 기준 D-2월 실적만 제공)
