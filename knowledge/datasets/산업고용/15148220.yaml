description_portal: 경상북도 경주시에서 관리하는 건설기계사업자 현황 데이터이다. 본 자료는 관내에 등록된 건설기계 사업자의 정보를 제공하여 지역 산업 현황을 이해하는 기초자료로 활용된다. 데이터는 순번, 영업상태, 상호명, 사업유형, 등록종별, 주소 항목으로 구성되어 영업 여부, 업종, 등록 유형, 소재지를 확인할 수 있다. 건설기계 대여업, 정비업, 판매업 등이 포함되어 있어 행정기관은 인허가 관리와 정책 수립에 활용할 수 있다. 연구자에게는 산업 구조와 사업자 분포 자료가 되고, 시민에게는 생활권 내 업체 확인에 도움이 된다. 자료는 파일형식으로 제공되며 주기적으로 갱신되어 최신성을 유지한다. 따라서 본 데이터는 경주시 건설산업을 파악하고 행정업무를 지원하는 기초자료이다.
