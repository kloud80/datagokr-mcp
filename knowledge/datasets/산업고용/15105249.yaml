summary_user: 인천광역시 서구(서해구)에 등록된 담배도매업체를 업체 한 곳당 한 행으로 담고, 상호와 소재지 도로명 주소, 데이터기준일자를 기록한 작은 파일(약 1.2KB)이다. 지역 내 담배도매업체가 어디에 몇 곳 있는지, 담배 공급 거점이 어떻게 분포하는지 알아보려는 분석가나 담당 공무원이 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 상호나 도로명 주소를 맞춰 보는 방식으로만 잇고, 담배소매업 같은 LOCALDATA 업종 인허가 자료와 나란히 놓고 볼 때 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구에 등록된 담배도매업체의 현황을 정리한 자료입니다. 본 데이터는 각 사업체의 상호와 도로명 주소등을 포함하고 있습니다. 본 데이터를 통해 담배 유통의 중심 역할을 하는 도매업체의 위치와 공급망 분포를 파악할 수 있으며, 또한 지역 내 담배 공급 흐름의 구조 분석, 유통 질서 확립, 인허가 관리 등 다양한 행정업무에도 활용 할 수 있는 기초자료로도 제공될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신 정보를 제공하고 있습니다.
