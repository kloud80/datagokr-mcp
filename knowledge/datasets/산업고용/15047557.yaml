summary_user: '제주특별자치도 안 풍력발전소를 발전소 한 곳당 한 행으로 담은 소규모 CSV 파일(1,149바이트)로, 발전소명·설비용량·설치장소·원동력 종류·데이터기준일자가 들어 있습니다(설비용량 단위는 포털 설명에서 kW, 필드명에서 MW로 서로 다르게 표기됨). 제주에서 어느 마을에 어떤 규모의 풍력발전소가 있는지 확인하려는 주민·사업자·에너지 분석가가 쓰는 데이터입니다. 공통 조인 키가 없어서, 다른 발전소 원장(예: 전국 태양광발전소 전기사업허가 표준데이터)과 연결하려면 발전소명이나 설치장소 주소를 이름 단위로 맞춰야 합니다.'
limits: 행정구역 코드나 발전소 고유번호 같은 전역 조인 키가 없어서 다른 데이터와 자동으로 연결할 수 없고, 이름이나 주소를 직접 대조해야 합니다. 범위는 제주 시도 단위이고 좌표가 없는 비공간 데이터라서 지도에 바로 올릴 수 없습니다.
