description_portal: 건물에너지진단정보DB 구축 사업은 기존 건물의 에너지 사용 현황을 전문적으로 진단하고, 에너지 절감과 효율화를 위한 개선방안을 도출하여 관련 정보를 데이터베이스화하는 사업입니다. 본 데이터는 사업에 참여하여 에너지 진단을 받은 개별 건물들의 진단 결과를 체계적으로 정리하여 제공합니다. 제공되는 데이터 항목은 건물의 주용도(주거, 상업, 업무 등), 연면적, 건물연수, 설비 현황, 에너지 개선요인 및 투자비 회수기간 등으로 구성되어 있어 건물별 에너지 효율성을 정확하게 비교하고 분석할 수 있습니다. 정부 및 연구기관은 에너지효율 개선 정책 수립 및 건물 에너지 성능 분석에 활용 가능하며, 기업 및 개인은 효율개선 투자계획 수립과 에너지 관리전략 마련 시 기초자료로 활용할 수 있습니다.
