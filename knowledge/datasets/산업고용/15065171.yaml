description_portal: 인천광역시 관내 인허가된 고압가스 특정제조, 일반제조, 냉동제조, 충전, 저장 판매소와 LP가스 저장 판매소 현황(개소수)입니다. 산업·통상·중소기업 분야의 에너지 및 자원개발 분류에 속하며, 인천시 에너지산업과에서 관리합니다. 이 데이터는 제조 공정별로 고압가스, LPG, 일반가스 등 다양한 가스 종류에 대한 정보를 포함하고 있으며, 각 업체의 위치, 업종, 취급 가스 종류, 인허가 정보 등을 제공합니다. 연간 단위로 업데이트되며, CSV 형식으로 제공되어 누구나 공공데이터포털에서 무료로 다운로드할 수 있습니다. 또한 오픈 API 형태로도 제공되어 시스템 연동이나 분석에 활용하기 용이합니다.
