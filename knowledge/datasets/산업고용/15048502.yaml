description_portal: 바이오디젤연료유 품질기준은 석유 및 석유대체연료 사업법 제31조에 따라 석유대체연료의 품질기준과 검사방법 및 검사수수료에 관한 고시에 규정되어 있습니다.바이오디젤연료유(BD20)는 버스, 트럭, 건설기계 및 철도차량(「철도산업발전 기본법」 제3조제4호에서 규정하는 철도차량을 말한다)에 사용하기 위하여  석유제품인 자동차용 경유 80%와 제2호의 바이오디젤(BD100) 20%을 혼합한 연료로서 품질기준에 적합하여야 합니다.바이오디젤연료유의 품질기준 항목으로는 지방산메틸에스테르함량, 유동점, 인화점, 동점도, 증류성상, 10% 잔유중 잔류탄소분, 황분, 회분, 세탄가, 동판부식 등이 있습니다.
