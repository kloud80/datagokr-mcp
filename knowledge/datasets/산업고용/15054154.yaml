summary_user: 한국산업기술진흥원이 운영하는 소재·부품 신뢰성 평가기준의 목록을 기준서 한 건당 한 행으로 담은 CSV 파일(약 217KB)로, 분야·평가기관·품목·평가기준명·기준번호·제정일자·등록일자·다운로드 수를 담는다. 부품·소재 제조업체나 시험 담당자가 '우리 품목에 적용할 성능·내환경성·수명·안전성 신뢰성 평가기준이 있는지, 어느 기관이 평가하는지'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어, 품목명이나 평가기관 이름을 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 소비자의 신뢰성 요구조건을 충족하기 위해 한국산업기술진흥원에서는 철저한 신뢰성 평가기준을 기반으로 다양한 시험평가를 수행하고 있습니다. 이러한 평가에는 종합 성능시험, 내환경성시험, 수명시험, 안전성시험 등이 포함되어 있으며, 이는 제품이 정해진 기준에 부합하는지를 판별하는 데 중요한 역할을 합니다. 이 제도를 통해 제조업체는 자사의 제품이 소비자에게 제공할 수 있는 안정성과 내구성에 대한 확신을 갖고, 소비자는 신뢰성을 보장받은 제품을 구매할 수 있게 됩니다. 또한, 이 데이터는 산업의 다양한 분야, 특히 부품 및 소재 산업에서 신뢰성 있는 제품 개발에 중요한 참고자료로 활용될 수 있습니다. 데이터는 '번호(숫자형)', '분야(문자형)', '평가기관(문자형)', '품목(문자형)', '평가기준명(문자형)', '기준번호(문자형)', '등록일자(날짜형)', '기준서(문자형)', '다운수(숫자형)', '제정일자(날짜형)' 등의 컬럼으로 구성되어 있습니다.
