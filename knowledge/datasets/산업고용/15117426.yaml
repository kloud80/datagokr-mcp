summary_user: 2021~2023년 3개년 산재보험 최초 요양 신청 건을 연도·성별(남성·여성)로 나눠 사고성·질병성 재해의 신청 건수와 승인 건수를 담은 전국 단위 집계표이며, 311바이트 크기의 작은 CSV 파일이다. 정책 담당자나 분석가가 '여성 근로자는 남성보다 질병성 재해 신청 비중이 높은가, 성별로 승인 비율에 차이가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 산재 통계와는 보험연도와 성별 이름을 맞춰 붙이거나 같은 근로복지공단 자료끼리 연결해 쓴다.
