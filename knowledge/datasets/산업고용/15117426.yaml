description_portal: 이 데이터는 2021년부터 2023년까지 3개년 동안 산업재해보상보험 최초 요양 신청 건에 대한 처리 현황을 성별(남성, 여성)로 상세하게 집계한 통계 자료입니다. 통계 항목은 성별 구분에 따라 사고성 재해와 질병성 재해의 신청 건수 및 승인 건수를 연도별로 제공합니다. 이 자료는 국내 노동 시장의 주요 인력 집단인 남성 근로자와 여성 근로자가 겪는 산업재해의 규모와 특성을 명확하게 보여줍니다. 특히, 성별에 따른 사고성 재해와 질병성 재해의 상대적 취약도와 산재 인정 과정의 실태를 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 성인지적 관점의 산업 안전 및 보건 정책 수립에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 여성 근로자의 경우 질병성 재해의 비중이 높게 나타나는지 등 성별 간 재해 유형의 차이를 분석할 수 있습니다. 이를 통해 여성 근로자가 주로 종사하는 직종의 직업병 예방에 특화된 보건 관리 대책을 수립하거나, 남성 근로자의 경우 사고성 재해 예방을 위한 안전 관리 감독을 강화하는 등 성별 특성을 반영한 맞춤형 안전 정책을 수립하는 데 활용할 수 있습니다. 또한, 이 통계는 성별 산재 인정의 형평성과 사회 안전망의 포괄성을 평가하고, 모든 근로자의 건강권을 확보하는 데 기여할 수 있다고 판단됩니다.
