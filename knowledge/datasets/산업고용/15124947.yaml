description_portal: 전자파 적합성(EMC, Electromagnetic Compatibility)은 전자기기가 주위 환경에서 다른 전자기기에 간섭을 일으키지 않고, 반대로 외부의 강한 전자기 간섭에도 정상적으로 작동할 수 있는지를 평가하는 시험입니다. EMC는 크게 두 가지로 구분되며, 하나는 전자기기 자체에서 발생하는 전자기 노이즈를 억제하는 전자기간섭(EMI) 시험, 다른 하나는 외부 전자파에 대한 기기의 견딜 수 있는 정도를 측정하는 전자기내성(EMS) 시험입니다. 이 중 전도성 방해전압(CE, Conducted Emission) 시험은 전자기기에서 발생하는 전자파가 전원선, 통신선, 데이터선 등을 통해 외부로 전도되어 다른 장비에 간섭을 줄 수 있는지를 측정하는 시험입니다. 이 시험을 통해 기기 내부 회로에서 발생한 노이즈가 외부 시스템에 영향을 미치지 않도록 사전에 진단하고 개선할 수 있으며, EMC 적합성을 확보하기 위한 핵심 시험 중 하나로 간주됩니다.
