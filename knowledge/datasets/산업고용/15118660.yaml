summary_user: 한국가스기술공사가 지하 가스배관 주변에서 신고 없이 진행된 굴착공사를 점검한 건별 기록으로, 지사·공사구분·점검일자·시군 단위 행정구역·공사종류·배관과의 이격거리(미터)를 담은 전국 범위 CSV 파일(약 45KB)이다. 가스안전 담당자나 지자체·분석가가 어느 지역에서 어떤 종류의 미신고 굴착이 배관에 얼마나 가깝게 일어나는지 파악해 점검·계도 대상을 정하는 데 쓴다. 전역 조인 키나 행정구역 코드는 없어 다른 데이터와는 시군 이름을 매핑하거나 같은 기관 자료와 지사명으로만 이어 붙인다.
description_portal: 이 파일은 「한국가스기술공사」가 2026년 4월 기준으로 집계한 미신고 굴착공사 발생 현황을 정리한 CSV 문서로, 전국 각지에서 지하 배관 보호구역 내 신고 없이 수행된 굴착공사 사례를 기록하고 있습니다. 주요 항목으로는 발생 일자, 발생 장소, 시공사명, 신고 여부, 유관기관 통보 여부, 조치 내용 등이 포함되어 있으며, 이는 지하매설물(가스관 등) 사고 예방을 위한 핵심 자료입니다. 미신고 굴착은 인명사고와 대규모 도시기반시설 마비를 초래할 수 있어, 관련 정보는 위험요소 사전 차단과 법적 대응 기준 마련에 필수적으로 활용됩니다. 또한 해당 자료는 지자체·경찰서·소방서와의 연계조치, 반복 시공업체 식별, 교육·경고 이력 관리 등에도 활용될 수 있습니다.
