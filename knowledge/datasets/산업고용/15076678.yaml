summary_user: 서울시 골목상권 배후지 단위로 분기별 직장인구를 성별·연령대(10대~60대 이상)와 성별×연령대 교차로 집계한 표형 데이터이며, 포털 설명 기준 1,090개 배후지를 담는다. 창업자나 상권 분석가가 '이 골목상권 배후지에 일하는 사람은 몇 명이고 어떤 성별·연령이 많은가'를 따져 업종·입지를 정할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 같은 서울시 상권분석서비스의 다른 파일과는 분기 코드(STDR_YYQU_CD)와 상권 코드·이름으로 맞춰 잇고 소상공인 상가업소 원장 등과는 상권명·위치 매핑으로만 연결한다.
description_portal: 'ㅇ 데이터 개요: 서울시 ‘골목상권’ 배후지 단위의 직장인구 통계로, 분기별·성별·연령대별 인구가 수록된 표형 데이터입니다ㅇ 공간 단위: 상권배후지(코드/명) 기준으로 1,090개 고유 배후지를 포함합니다.ㅇ 분류 체계: 상권_구분_코드_명은 본 파일에서 ‘골목상권’으로 표기되어 있습니다(해당 열의 고유값 1종).ㅇ 핵심 지표: 총_직장_인구_수, 남성/여성 직장 인구 수, 연령대별 직장 인구(10대·20대·30대·40대·50대·60대 이상) 및 성별×연령대 교차 항목이 제공됩니다.ㅇ 활용 예시: 상권별 직장인 수요·연령 구조 파악, 업종·입지 전략 수립, 출퇴근 인구 성별·연령 특성 분석, 특정 분기 영향 분석(경기 변동·정책 효과 등).'
