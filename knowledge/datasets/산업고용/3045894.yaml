summary_user: 부산광역시 강서구 관내에서 작성일 기준 영업 중인 공중위생영업 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호 네 항목만 있다. 강서구에서 묵을 숙박업소를 찾는 주민·방문객이나 구 단위 숙박업소 분포를 파악하려는 분석가가 '강서구에 영업 중인 숙박업소가 어디에 몇 곳 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·좌표·관리번호)가 없어, 다른 데이터와는 도로명 주소나 업소명을 맞춰 보는 방식으로만 이어 쓰며 지방행정 인허가(LOCALDATA) 숙박업 원장과 대조할 때도 같은 방식이다.
description_portal: '부산광역시 강서구 숙박업 현황입니다.부산광역시 강서구 관내 공중위생영업 숙박업 현황(업종명, 업소명, 영업소 주소(도로명), 소재지 전화) 자료를 제공합니다.(작성일 기준으로 영업중인 숙박업소를 기준으로 합니다.)1. 업종명 : 부산광역시 강서구 관내 숙박업의 업종명입니다.2. 업소명 : 부산광역시 강서구 관내 숙박업의 업소명입니다.3. 영업소 주소(도로명) : 부산광역시 강서구 관내 숙박업의 영업소 주소(도로명 주소)입니다.4. 소재지전화 : 부산광역시 강서구 관내 숙박업의 영업소의 전화번호입니다.'
