summary_user: 전북특별자치도 탄소 융합 부품·소재 창업보육센터에 입주한 기업을 한 행씩 담은 목록으로, 업체명·대표자 이름·대표번호·주생산품을 담는다(파일 약 2KB 규모의 소규모 CSV). 탄소 소재 부품 분야에서 협력사나 투자 대상을 찾는 사업자·투자자가 '전북 탄소 창업보육센터에 어떤 기업이 무엇을 만들고 있나'를 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 다른 기업 인증·현황 데이터와는 업체명 문자열 매칭으로만 이어 쓸 수 있다.
