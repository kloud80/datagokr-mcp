summary_user: 광주환경공단이 운영하는 하수처리장·위생매립장·음식물자원화시설 등 시설별로 태양광 설비의 설치위치, 설비용량(kW), 1~12월 월별 발전량과 연간 합계(kWh)를 담은 집계 파일이다(csv 약 1.3KB의 소규모 표). 공단 시설 중 어느 곳의 태양광 발전 실적이 높은지, 계절별 발전량이 어떻게 달라지는지 비교하려는 분석가·지자체 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 같은 기관(광주환경공단) 기준으로만 이어 쓰며, 발전소 단위 주소·용량을 담은 전국 태양광 발전사업 허가 표준데이터와는 시설명·위치를 수작업으로 맞춰 참고한다.
description_portal: 광주환경공단의 태양광에너지 발전현황에 대한 데이터로, 공단이 운영 중인 주요 시설을 대상으로 한 태양광 발전 관련 정보를 제공합니다. 제공되는 데이터에는 광주제1하수처리장, 제2하수처리장, 효천하수처리장, 광역위생매립장, 제2음식물자원화시설의 각 시설명을 비롯하여, 태양광 설비의 설치위치, 설비의 총 용량(kW), 그리고 월별 발전량(kWh) 항목이 포함되어 있습니다. 이를 통해 시설별 에너지 생산 실적을 비교하거나, 계절별 발전량 추이를 분석할 수 있으며, 공단의 신재생에너지 활용성과 운영 효율성 평가 등에 활용될 수 있도록 구성되어 있습니다.
