description_portal: "제주특별자치도 내 관광유람선업 현황 데이터를 제공합니다.항목: 상호명, 소재지 등*'관광진흥법 시행령 제2조 제1항 제3호 라목'에 따른 관광객 이용시설업 중1) 일반관광유람선업: 「해운법」에 따른 해상여객운송사업의 면허를 받은 자나 「유선 및 도선사업법」에 따른 유선사업의 면허를 받거나 신고한 자가 선박을 이용하여 관광객에게 관광을 할 수 있도록 하는 업2) 크루즈업: 「해운법」에 따른 순항(順航) 여객운송사업이나 복합 해상여객운송사업의 면허를 받은 자가 해당 선박 안에 숙박시설, 위락시설 등 편의시설을 갖춘 선박을 이용하여 관광객에게 관광을 할 수 있도록 하는 업자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1512956"
