summary_user: 한국서부발전이 전력시장에서 판매한 전력의 거래량(GWh)과 거래금액(억원)을 연도·분기 단위로 집계한 소규모 파일(csv, 약 1KB)이다. 에너지 분석가나 정책 담당자가 '서부발전의 전력 판매량과 금액이 분기·계절에 따라 어떻게 달라졌나'를 볼 때 쓴다. 전역 조인 키가 없어 다른 발전사나 전력거래소 자료와는 연도·분기를 기준으로 맞춰 붙여 써야 한다.
description_portal: 한국서부발전의 분기별 전력판매 현황 정보입니다. 분기별 전력거래량 및 거래금액 데이터는 전력시장에서 발생항 전력 거래 현황을 3개월 단위로 집계하여 제공하는 자료입니다. 이 데이터는 각 분기별 전력 거래량과 해당 전력에 적용된 정산 단가를 기반으로 산출된 거래금액으로 구성되며, 전력시장 규모와 가격 변동 추이를 분석하는 지표로 활용됩니다. 월 단위 데이터에 비해 계절적 요인과 수급 상황을 보다 안정적으로 반영하기 때문에 정책적·경영적 의사결정에 유용합니다. 또한 분기별 거래량 추세를 통해 여름철 냉방 수요, 겨울철 난방 수요와 같은 계절별 특성이 전력시장에 미치는 영향을 확인할 수 있습니다.
