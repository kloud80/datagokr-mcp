description_portal: 이 데이터는 전남개발공사의 2017년부터 2024년까지 연도별 중소기업제품의 구매 실적에 대한 정보를 담고 있습니다.이는 중소기업 지원 정책에 대한 공공기관의 이행 상황을 투명하게 공개하고, 관련 기업의 성장을 촉진하는 것을 목적으로 합니다.데이터는 연간 구매합계금액(원)과 구매총액 대비 구매비율(%) 등의 항목으로 구성되어 있으며, 공사의 중소기업 지원 정도와 조달 정책 이행 수준을 수치로 확인할 수 있습니다.활용 기대 효과로는 구매 실적 분석을 통해 중소기업 지원 정책의 효과를 평가하고, 중소기업들이 시장 참여 기회를 모색하는 데 유용한 자료로 활용될 수 있습니다.이를 통해 지역 경제 활성화에 기여하고, 공공기관의 사회적 책임 경영을 보여줌으로써 국민 신뢰도를 높이는 데 도움이 될 것으로 기대됩니다.
