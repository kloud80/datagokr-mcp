summary_user: 부산광역시 동구에서 기준 일자에 운영 중인 노동조합을 조합 한 곳당 한 행으로 담은 건별 명부로, 단체명·사업장명·소속 상급단체·주소·대표자명을 담으며 파일 크기는 약 1KB(1,127바이트)로 작다. 노동자나 연구자가 '동구에 어떤 사업장 노조가 있고 어느 상급단체에 속해 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 사업장명 같은 이름 매칭으로만 잇고, 전국노동조합표준데이터나 다른 지자체 노동조합 현황과는 같은 항목을 기준으로 이어 붙여 쓴다.
description_portal: 이 자료는 부산광역시 동구 노동조합 현황 데이터를 제공합니다.해당 자료는 기준 일자에 부산광역시 동구에서 현재 운영 중인 노동조합의 단체명, 사업장명, 소속단체명, 노동조합의 주소, 노동조합의 대표자명과 관련된 정보를 얻을 수 있습니다. 이 자료를 통해 헌법이 보장하는 노동자의 단결권, 단체교섭권, 단체행동권을 지원하고, 이를 통한 노동자의 근로 조건의 유지 및 개선과 근로자의 사회경제적 지위의 향상을 도모합니다.또한, 노동관계를 공정하게 조정하여 노동쟁의를 예방하고 해결함으로써 산업 평화의 유지와 국민 경제의 발전에 이바지함을 위해 이 공공데이터를 제공합니다.
