description_portal: '인천광역시 공공기관 신재생에너지 보급현황 공공데이터는 지역 내 공공기관에서 설치·운영 중인 신재생에너지 설비 정보를 집계한 자료입니다.주요 구성 항목은 시군구명을 통해 행정구역별 현황을 구분하고, 에너지원(태양광)을 명시합니다. 또한 설치장소와 설치연도를 기록하여 시설 위치와 도입 시기를 확인할 수 있습니다. 발전유형은 에너지 생산 방식(예: 자가소비용)을 구분하며, 소유기관을 통해 관리 주체를 명시합니다. 마지막으로 설비용량을 제공하여 각 기관의 에너지 생산 규모를 파악할 수 있습니다. 이 데이터는 신재생에너지 보급 성과를 분석하고, 정책 수립 및 에너지 자립률 향상 전략 마련에 활용됩니다.'
