summary_user: 경기도 지역 프랜차이즈 가맹본부의 정보공개서 등록 이력을 건별로 담으며, 프랜차이즈명, 정보공개서 수정일시(mdfcn_dt), 관련 등록 파일명, 구분으로 이루어진 시도 범위의 비공간 자료다. 예비 창업자나 가맹사업 분석가가 '관심 있는 프랜차이즈의 정보공개서가 언제 등록·수정됐고 어떤 서류가 올라와 있는가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로, 다른 가맹사업·상권 데이터와는 프랜차이즈명을 맞춰 보는 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 지역의 주요 프랜차이즈 업체들의 정보공개서 등록 이력을 나타내는 자료로, 프랜차이즈명, 정보공개서 수정일시, 관련 등록 파일명, 구분 등의 항목으로 구성되어 있습니다. 정보공개서는 가맹 희망자에게 제공되는 핵심 문서로, 가맹본부의 운영 현황과 계약조건 등을 포함하며, 이 데이터를 통해 프랜차이즈별 등록 시기 및 관련 서류 현황을 파악할 수 있습니다. 본 자료는 가맹사업 관련 정책 수립, 시장 현황 분석, 창업자 정보 제공 등을 위한 기초자료로 활용될 수 있습니다. 데이터에 포함된 파일명은 등록 자료의 성격과 시점을 간접적으로 파악할 수 있는 참고 정보로 활용됩니다.
