summary_user: 전라남도 보성군 관내 가축분비료 생산업체를 업체 한 곳당 한 행으로 정리한 명부로, 업체명·생산 비료 종류·주소·전화번호·기준일자를 담는다(파일 크기 393바이트의 소규모 CSV). 보성군에서 가축분 퇴비나 유기질 비료를 사려는 농가, 또는 지역 비료 생산 실태를 보는 담당자가 "군내 어느 업체가 어떤 비료를 만드는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 업체명·주소를 문자열로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 사업자번호나 좌표 같은 공통 키가 없어 인허가 원장이나 다른 지역 자료와 자동으로 결합하기 어렵다. 범위는 보성군 한 곳이므로 전남이나 전국 단위 비교에는 다른 시군 자료를 따로 모아야 한다.
