summary_user: 중소벤처기업진흥공단이 운영한 해외기술교류센터의 설치 현황을 센터 한 곳당 한 행으로 담은 소규모 파일(csv 720바이트)이며, 국가명·센터명·개소일자·업무영역을 포함한다. 해외 기술협력을 조사하는 분석가나 중소기업이 '공단의 해외기술교류센터가 어느 나라에 언제 열렸고 어떤 업무를 맡았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 중소벤처기업진흥공단이 해외 기술 교류 및 국제 협력을 활성화하기 위해 해외 기술 교류 센터의 설치 현황을 정리한 자료입니다. 각 기술 교류 센터의 설치 국가, 센터명, 개소일자 등의 기본 정보를 포함하고 있으며, 이를 통해 국가별 기술협력 인프라의 분포와 설립 추이를 한눈에 확인할 수 있습니다. 다만, 중소벤처기업진흥공단의 해외 기술교류센터 운영 사업은 2023년을 마지막으로 종료되었으며, 본 데이터는 사업 종료 시점까지의 누적 정보를 제공하는 기록 자료로서 의미를 가집니다.
