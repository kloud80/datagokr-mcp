summary_user: 창업기업 수를 업력(1~7년차)과 기업형태(개인·법인)로 나눈 뒤 제조업·도소매업·정보통신업 등 산업 대분류별로 집계한 전국 단위 통계표로, 1.5KB 남짓의 작은 CSV 파일이다. 정책 담당자나 연구자가 '창업 후 연차가 늘수록 어떤 업종 비중이 줄거나 늘어나는가', '법인 창업은 개인 창업보다 어느 업종에 더 몰리는가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명(산업 대분류 이름)이나 업력·기업형태 구분을 맞춰 붙이는 식으로만 이어 쓴다.
description_portal: '창업진흥원이 제공한 업력별·기업형태별 업종 통계자료로, 연차에 따른 업종 분포와 개인·법인 구분별 기업 수를 포함하고 있습니다. 구성 항목은 구분별 항목(업력 또는 기업형태), 세부 분류(예: 1년차, 법인 등), 전체 기업 수, 업종별 기업 수로 구성됩니다. 업종은 제조업, 도소매업, 정보통신업, 교육서비스업, 금융업, 부동산업, 예술여가서비스업 등 20개 산업군으로 이루어져 있으며, 업력은 1~7년까지의 연차로 분류됩니다. 이 데이터는 업종별 기업 생존 흐름, 법인과 개인 간 업종 집중도 비교, 창업 이후 업종 분포 변화 등을 다각도로 분석할 수 있어, 정책 수립과 연구 분석 자료로 활용도가 높습니다.'
