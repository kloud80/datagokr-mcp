description_portal: 한국가스공사의 배관시설 용량계수에 관한 자료입니다. 용량계수는 천연가스 직수입자가 공사 배관시설을 1년 미만 단기 이용할 경우, 기존 인입/인출 계약용량 단가에 적용하는 월별 가중치로서 이용요금 산정의 기준이 됩니다. 본 데이터는 배관시설 이용요금 산정 기준 공개 및 거래 투명성 확보를 위해 수집 관리되고 있습니다.데이터의 세부 항목으로는 기준연도, 월, 용량계수(%) 등이 포함되어 있습니다. 본 데이터를 활용하면 월별 배관시설 이용요금 산정 기준 확인, 단기 이용 시 비용 예측, 직수입 사업 계획 수립, 배관시설 이용 계약 조건 검토에 기초자료로 활용할 수 있어 배관시설 이용요금 체계 이해와 직수입 사업자의 비용 계획 수립에 기여할 것으로 기대됩니다.
