summary_user: 내일채움공제 가입자 중 만기가 도래해 만기를 신청·승인받은 건을 청약번호 단위로 담은 건별 파일이며, 포털 설명상 2019년 9월부터 2026년 2월까지의 만기접수자를 대상으로 만기접수일·승인일시·만기상태·수령방법·핵심인력 거래은행·상세상품을 담는다. 공제사업을 분석하는 연구자나 정책 담당자가 기간별 만기 신청·승인 추이나 청년내일채움공제 만기자의 내일채움공제 재가입 비중 같은 질문에 쓴다. 청약번호와 연계이전 청약번호가 같은 청약번호 키(sbc_tomorrow_subscription_no)를 쓰므로 이 둘을 서로 이어 이전 가입 건과 재가입 건을 추적하거나 다른 내일채움공제 청약 데이터와 조인할 수 있으며, 사업자번호 같은 기업 식별 키는 없다.
description_portal: 내일채움공제 가입대상자 중 만기가 도래하여 신청 및 승인된 가입자 데이터로 청약번호, 만기접수일, 만기승인일, 만기 상태, 만기금 지급상태, 핵심인력 주거래 은행, 연계이전 청약번호,  상세상품을 제공합니다. * 2019년 9월부터 2026년 2월까지 만기접수자의 현황입니다. ** 연계이전 청약번호는 기존 청년내일채움공제, 청년재직자 내일채움공제등의 가입자가 만기금을 수령하여 다시 내일채움공제에 가입한경우, 기존의 청약번호입니다. *** 만기 접수는 내일채움공제 홈페이지를 통해 기존 가입자(핵심인력)가 만기시 신청하여 접수합니다. 접수된 만기신청에 대하여 만기 승인한 이후에 가입자가 만기금을 수령받을 수 있습니다.
