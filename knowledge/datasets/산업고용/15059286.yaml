summary_user: 경기도에 등록된 후원방문판매업·다단계판매업·선불식할부거래업 업체를 한 건씩 담으며, 업종명·상호·대표자·등록번호·사업자등록번호·전화번호와 시군, 지번·도로명 주소, 우편번호, WGS84 좌표가 들어 있다. 소비자가 가입을 권유받은 다단계·상조(선불식 할부) 업체가 경기도에 등록돼 있는지 확인하거나, 분석가가 시군별 업종 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로, 사업자등록번호(BIZ_REG_NO)나 상호 매칭, 시군 코드·주소·좌표를 기준으로 다른 인허가(LOCALDATA)·상가업소 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도에서 관리하는 후원방문판매업, 다단계판매업, 선불식할부거래업에 등록된 업체 현황을 제공합니다. 데이터는 각 업체의 업종명, 상호명, 소재지주소, 전화번호 등 주요 식별 정보를 포함하고 있습니다. 이를 통해 소비자 보호, 관련 업계 분석, 정책 수립 및 행정 관리 등에 활용할 수 있으며, 특정 영업 형태에 따른 시장 현황 파악, 소비자 피해 예방을 위한 기초자료로 활용 가능합니다. 후원방문판매업은 소비자 주거지 등에서 판매가 이루어지는 형태를, 다단계판매업은 판매원의 네트워크를 기반으로 이루어지는 판매 방식을, 선불식할부거래업은 소비자가 상품이나 서비스를 선불로 지급한 후 일정 기간 동안 공급받는 계약 형태를 의미합니다. 데이터 활용 시 업체의 등록 유효성, 변경사항 등을 최신 정보와 비교하여 활용하는 것이 중요합니다.
