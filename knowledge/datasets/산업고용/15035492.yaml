description_portal: 본 데이터는 경기도 광주시청에서 관리하는 비료생산업등록현황 자료입니다. 주요 제공 항목은 시군명, 법인(상호)명, 제조장소재지 도로명주소, 전화번호, 비료의 종류 및 명칭, 제조원료 및 투입비율, 데이터 기준일자로 구성되어 있으며, 광주시 내 등록된 비료생산업체의 현황 정보를 체계적으로 수록하고 있습니다. 해당 데이터는 비료의 전문 제조와 유통 관리, 안전성 및 품질 확보를 위한 행정 지원, 그리고 농업환경 개선과 친환경 정책 수립에 활용됩니다. 또한, 제조장소 정보와 원료 투입비율을 통해 지역 내 환경관리와 관련 사업의 투명성 확보에 기여합니다.
