description_portal: 동 데이터는 2025년 ESG자가진단 참여기업의 수, 전체기업 대비 비중, ESG 수준(E,S,G 평균)을 지역별로 나타낸 통계 자료입니다.서울, 광역시 및 도단위로 구분을 하였으며, 참여기업은 해당 지역에서 ESG자가진단에 참여한 중소벤처기업을 나타낸 숫자이며, 비중은 전국 대비 해당 지역 중소벤처기업의 비중을 나타냅니다수준은 해당 지역에 소재한 중소벤처기업이 시행한 ESG자가진단으로 나타낸 ESG수준에 대해 평균 수치를 나타낸 값입니다.해당 자가진단은 2025.1.1에서 2025.12.31까지 진행한 조사결과입니다.
