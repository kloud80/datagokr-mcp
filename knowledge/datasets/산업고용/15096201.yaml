summary_user: 한국남동발전 사업소별 하도급 공사 계약을 건별로 담은 파일로, 포털 설명상 2021년 5월부터 2023년 5월까지 49건이며 원도급 수급인과 하수급인의 상호·사업자번호·소재지, 하도급 공종, 도급·하도급 금액과 하도급률을 포함한다. 공공 발주 공사의 하도급 비율이 적정한지, 특정 업체가 어떤 공종을 얼마에 하도급받았는지를 확인하려는 분석가·건설 사업자가 쓴다. 수급인 사업자번호(수급인_사업자번호)를 키로 건설업 등 업종 인허가 원장이나 기업 정보와 잇고, 하수급인 사업자번호도 같은 방식으로 대조에 쓴다.
description_portal: 한국남동발전의 하도급 공사 계약에 대한 자료 입니다. 2021년 5월부터 2023년 5월까지 총 49건의 내역을 확인할 수 있으며, 각 사업소별 계약일, 계약목적명, 계약명, 수급인 상호, 수급인 대표자(비식별처리),  수급인 사업자번호, 계약내역 , 해당 공종 금액, 계약금액, 설계금액 기준 등에 대한 데이터를 포함하고 있습니다. *(하도급 공종) 비계구조물 해체공사, 기계설비공사, 비계공사, 건설 및 기계설비공사업, 기계/전기, 전기공사업, 습식방수공사, 철근콘크리트 공사업, 강구조물공사업, 석공사, 조경시설물, 조경공사 등
