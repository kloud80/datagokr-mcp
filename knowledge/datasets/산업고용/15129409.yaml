description_portal: '본 데이터는 사업 종료 이후부터 2020년을 시작으로 성과 활용에 참여한 기관의 명단을 정리한 것입니다. 이 명단에는 성과발생년도, 참여기관명, 연구수행 주체 및 지역명 등의 정보가 포함되어 있습니다. 해당 데이터는 연구개발 성과를 창출한 다양한 기관들을 체계적으로 정리하여, 관련 정책 수립이나 연구 평가에 유용하게 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형) : 성과를 생성한 연도참여기관명(문자형) : 해당 성과에 참여한 기관의 이름연구수행주체(문자형) : 연구를 수행한 주체의 구분지역명(문자형) : 참여 기관이 위치한 지역의 명칭등록일자(날짜형) : 데이터가 등록된 날짜의 정보이러한 정보를 통해 연구개발 분야의 성공사례 분석 및 정부 정책 방향성을 제시하는 데 기여할 수 있습니다.'
