summary_user: 한국중부발전과 협력 관계에 있는 기업을 한 행에 한 곳씩 담은 목록 파일로, 기업명·구분·주생산품·주소·사업자등록번호·대표자명·사무실전화와 데이터 기준일을 담고 범위는 전국이다. 공급사 분석가나 지역 산업 담당자가 '중부발전과 거래하는 협력사는 어디이며 어떤 제품을 만드나'를 확인하거나, 특정 기업이 협력사인지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 삼아 기업 확인·인증 목록, 업종 인허가 같은 다른 기업 데이터와 이어 쓴다.
description_portal: 본 협력기업정보는 한국중부발전과 협력 관계에 있는 기업의 일반 정보를 정리한 자료입니다. 항목은 순번, 구분, 기업명, 주생산품, 주소, 사업자등록번호, 대표자명, 사무실전화로 구성되어 있으며, 협력기업의 기본 현황과 연락 가능한 채널을 포함합니다. 해당 자료는 협력사 현황 관리, 사업자 식별 및 공급사 분석, 제품·서비스 연계 파악 등의 용도로 활용 가능합니다. 또한 중소기업 지원정책 수립, 기술협력 기반 조성, 지역 산업 네트워크 구성 및 상생협력 체계 현황 분석 등의 기초 자료로도 활용 가능합니다.
