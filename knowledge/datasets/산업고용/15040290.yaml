summary_user: 과천도시공사가 운영하는 공공시설 태양광 설비(시민회관·체육공원 등)의 발전량을 연도와 시설 구분별로 1월~12월 월별 값으로 정리한 소규모 집계 파일(csv 약 2.8KB)이다. 과천 공공시설 태양광이 해마다, 달마다 얼마나 발전했는지 보려는 시민이나, 지자체 공공시설 재생에너지 실적을 비교하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설 이름이나 같은 기관(과천도시공사) 기준으로만 맞춰 이어 쓴다.
description_portal: 과천도시공사에서 관리‧운영 중인 신재생에너지 시설의 구축 및 운영 현황 정보를 제공하는 데이터셋입니다. 시민회관은 기존 태양열시설을 운영하다가 2023년 9월 태양광시설(발전용량 96kWp)로 전환‧구축하였으며, 체육공원은 2010년 태양광시설(발전용량 160kWp)을 설치하여 현재까지 운영 중입니다.본 데이터는 시설별 설치 연도, 에너지원 유형(태양광 등), 발전용량(kWp), 설치 위치, 운영 현황 등 신재생에너지 설비 관련 기본 정보를 포함하고 있습니다.해당 데이터는공공시설의 친환경 에너지 전환 현황 공개탄소중립 및 에너지 자립 정책 관련 기초자료 제공연구·정책 분석 및 외부 서비스 연계 활용시민 대상 친환경 시설 운영 정보 제공을 목적으로 공개하며, 설비 증설·교체·운영 상태 변경 등 변동 사항 발생 시 지속적으로 최신화할 수 있도록 표준화된 구조로 구성되어 있습니다.
