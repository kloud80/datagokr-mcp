summary_user: 경기도 시험검사기관이 보유한 실험·분석 기기를 장비 한 대(기기코드) 단위로 담은 원장으로, 물품명·규격·제조자·단가·보유일자·담당 팀·용도와 기기 이력코드가 함께 들어 있다. 경기도 시험검사 업무 담당자나 예산 분석가가 "보유한 지 오래된 기체크로마토그래프는 어느 팀에 몇 대 있고 구입 단가는 얼마인가" 같은 장비 노후도·교체 예산 질문에 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으며, 팀코드(team_cd)나 기기이력코드처럼 같은 기관 내부 코드, 또는 물품명·제조자 이름 매핑으로만 이어 붙인다.
description_portal: 이 데이터는 경기도 시험검사기관에서 사용 중인 실험·분석 기기의 보유 및 운영 현황을 관리하기 위한 자료로, 각 장비에 대한 세부정보와 이력 정보를 포함합니다. 주요 항목은 기기코드, 물품번호, 물품명, 규격, 제조자, 담당자, 전화번호, 주소, 단가, 보유일자, 팀명, 팀코드, 용도, 특징, 비고 등으로 구성되어 있으며, 기체크로마토그래프, 킬달질소분해장치, 건조기 등 다양한 실험 장비에 대한 정보가 포함되어 있습니다. 이 데이터는 장비의 유지보수 관리, 실험기기 이력 추적, 실험실 예산편성 및 자산관리, 연구 장비 운영 효율성 향상 등을 위한 기초자료로 활용될 수 있습니다. 특히 '보유일자'와 '기기이력코드'는 장비의 사용 연한 및 이력관리 분석에 유용하며, 각 장비별 사용 목적과 특징은 실험기기 배치와 관리의 기준으로 활용 가능합니다.
