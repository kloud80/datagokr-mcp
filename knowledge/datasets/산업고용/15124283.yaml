summary_user: 중소벤처기업진흥공단 기업진단 사업을 받은 수진기업의 현황을 지원연도·진단구분·세부진단내역과 함께 지역, 매출액(백만원), 종업원수, 업종, 산업분류코드, 업력으로 담은 전국 범위 CSV 파일(약 169KB)이다. 정책 분석가가 "기업진단을 받은 기업은 어떤 업종·규모·업력·지역에 몰려 있고 진단 유형은 해마다 어떻게 달라지나"를 볼 때 쓴다. 산업분류코드(classification_code)를 키로 업종별 사업체 통계나 다른 지원사업·인증 데이터와 업종 단위로 잇는다.
description_portal: 중소기업 기업진단은 중소기업의 문제를 분석하여 향후 기업이 나가야할 방향성을 제시하는 사업입니다.기업진단에서는 다양한 모듈을 통해서 기업의 재무, 영업이익 등을 분석하여 중소기업이 객관적으로 스스로를 볼 수 있도록 지원하고 있습니다.또한 기업이 희망할 경우 옵션모듈을 통해 기업을 다양한 각도에서 분석할 수 있도록 도와주고 있습니다.동 데이터는 기업진단 수진기업의 현황을 나타내는 자료로, 수진기업의 진단구분, 매출규모, 종업원규모, 업종, 업력, 지역, 광역별 정보를 나타내고 있습니다.
