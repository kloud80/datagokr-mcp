description_portal: '- 한국에너지기술평가원에서 R&D 사업으로 지원한 과제 정보입니다.- 주관연구개발기관이라 함은 과제를 주관하여 수행하는 기관을 말하며, 공동연구개발기관이라 함은 해당 과제에 참여하여 주관연구개발기관과 공동으로 과제를 수행하는 기관을 말합니다.- 지원과제별로 수행기관은 확인 시점에 따라 변경될 수 있습니다.- 비R&D 사업은 지원과제 정보에 포함되어 있지 않습니다.- 세부사업에 대한 추가정보(사업설명자료)는 한국에너지기술평가원 홈페이지(www.ketep.re.kr > 주요사업 안내 > 사업소개)를 통해 확인할 수 있습니다.- 지원과제별 추가정보(최종목표, 개발내용 및 범위, 개발기간, 키워드 등)는 ETIC(www.etic.kr > R&D 지원정보 > 지원과제정보)를 통해 확인할 수 있습니다.- 지원과제별 추가정보(연구목표, 연구내용, 기대효과, 연구비 세부내역, 성과, 참여연구원, 과제구성 등)는 NTIS(www.ntis.go.kr)에서 과제명 검색을 통해 확인할 수 있습니다.'
