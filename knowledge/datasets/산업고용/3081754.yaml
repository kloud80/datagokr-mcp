description_portal: 울산광역시의 연도별 에너지 소비현황에 대한 각 구분별(에너지 부문별, 에너지원별, 소비 및 점유율) 데이터 통계자료를 일괄로 제공하고 있습니다.단위는 1,000toe이며, 석탄,석유, 가스(천연가스,도시가스), 전력, 열에너지, 신재생 및 기타 등 에너지원별 소비량의 합산값입니다.*toe(Ton of oil equivalent) 는 석유환산톤으로 원유 1톤이 갖는 열량으로 10^7Kcal(10의 7승 Kcal)을 1TOE로 정의합니다.통계자료의 출처는 에너지경제연구원의 에너지수급통계입니다. 더 자세한 자료는 국가에너지통계종합정보시스템(KESIS)에서 확인 가능합니다.
