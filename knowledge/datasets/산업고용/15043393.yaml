summary_user: 한국남부발전이 운영하는 성산풍력 발전소의 발전실적을 하루 한 행 단위로 담은 파일로, 일별 총량·평균·최대·최소와 1시부터 24시까지 시간대별 발전량이 들어 있다(포털 설명상 2013년 1월~2026년 3월, CSV 약 1.4MB). 분석가가 '성산풍력의 시간대별·계절별 발전량 패턴은 어떻고, 기상 조건과 묶으면 발전량을 예측할 수 있는가' 같은 질문에 쓴다. 전역 조인 키는 없어 날짜(년월일)와 시간대를 기준으로 기상 관측 자료나 같은 기관의 한림풍력 등 다른 풍력 발전실적과 맞춰 이어 쓴다.
description_portal: 한국남부발전(주) 성산풍력의 발전실적의 파일데이터입니다.한국남부발전(주)에서 운영하는 성산풍력 발전소의 2013년 01월 01일부터 2026년 03월 31일 기간동안 일일별 풍력발전 총량, 평균값, 최대 및 최소값과 시간대(01시부터 24시까지 1시간 단위)별 발전량데이터를 포함하고 있습니다. 일별 및 시간대별 상세한 발전실적 자료를 제공하여 풍력발전의 시계열 분석 및 기상정보 등과 결합하여 발전량 예측 등에 활용될 수 있습니다. 또한 성산풍력 외, 한림풍력 등 기타 풍력발전실적과 비교에도 활용 가능합니다.
