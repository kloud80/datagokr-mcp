summary_user: 한국남부발전 빛드림본부별(하동, 안동, 부산, 남제주, 영월 등) 종합폐수의 발생량·처리량·재이용량·방류량을 월 단위로 담은 발전소별 집계 데이터다. 분석가나 지역 주민이 '하동 발전소의 월별 폐수 방류량과 재이용 비율이 어떻게 변해 왔나'를 확인하거나 발전소 간 폐수 관리 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 발전소명(orgNm)과 년월(ym)을 기준으로 같은 기관의 대기오염물질·석탄재 배출 데이터나 주변 기상 측정 자료와 이름 매핑으로 이어 쓴다.
description_portal: 한국남부발전(주)은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전공기업입니다. 본 API는 한국남부발전(주)의 폐수배출 및 수질오염 물질 배출량 현황_GW 입니다.사용자는 한국남부발전(주)의 발전소별(하동, 안동, 부산, 남제주, 영월 등 빛드림본부별)로 월별 종합폐수처리량 정보를 조회할 수 있습니다.해당 데이터를 개방함으로서 발전소 운영에 대한 이해도를 높이고 환경 정보에 대한 접근성을 높이고 있습니다.또한 공개된 데이터를 활용하여 합리적인 환경 정책 수립 및 평가의 기초 자료로 활용할 수 있습니다.
