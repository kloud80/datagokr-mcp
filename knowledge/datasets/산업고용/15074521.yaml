description_portal: 이 데이터는 산업재해보상보험 요양급여 중 한의의료기관(한의원, 한방병원)에 지급된 현황을 연도별로 집계한 통계 자료입니다. 통계 항목은 전체 지급 건수, 전체 지급액(천 원)을 포함하며, 세부적으로는 한방병원과 한의원으로 구분하여 각각의 지급 건수와 지급액을 제공합니다. 이 자료는 산재 근로자들이 재활 및 치료 과정에서 한의학적 의료 서비스를 이용하는 추이와 그 규모를 명확하게 보여줍니다. 특히, 시간이 지남에 따라 한방병원과 한의원 중 어느 쪽의 이용률이 더 높거나 빠르게 변화하는지 파악할 수 있는 중요한 근거 자료라고 판단됩니다.본 데이터는 산재보험의 의료 서비스 다양화 및 한의학적 재활 치료 정책의 실효성을 평가하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 한방병원과 한의원 간의 지급 건수 및 지급액 변화를 분석함으로써, 산재 근로자의 한방 의료 수요 증가에 대한 공단의 재정적 지원 규모의 적정성을 평가하고 대응 방안을 모색할 수 있습니다. 또한, 한의학적 치료가 필요한 특정 상병 유형에 대한 지원을 강화하거나, 산재 재활 과정에서 한방 의료기관의 역할을 확대하는 정책을 수립하는 데 기여할 수 있다고 판단됩니다.
