description_portal: 본 데이터는 엔지니어링사업자의 지역별 ·신고유형별 사업자 현황을 연도별로 집계한 통계 자료이다.신고유형(대기업, 중소기업, 기타)은 「엔지니어링산업진흥법 시행령」에 따라 사업자가 직접 선택하여 신고한 유형이다.지역 구분은 사업자의 소재지를 기준으로 하며, 전국 17개 시·도(서울, 부산, 인천, 대구, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)로 따라 구분하였다.이 자료는 우리나라 엔지니어링산업의 현재 위치를 객관적으로 보여주며, 정부 정책 수립 및 연구를 위한 기초 통계자료로 활용될 수 있다. 또한 산업 경쟁력 평가, 인력수급계획 수립, 기술 분야별 지원 사업 기획 등 다양한 분야에서 폭넓게 활용 가능 하다.
