description_portal: 대전광역시 서구의 상권별 업종별 신생업소 생존률 데이터는 지역 상권의 지속 가능성과 업종별 창업 안정성을 파악할 수 있도록 구성된 상권분석 기초자료입니다. 이 데이터는 순번, 개방서비스 ID, 기준연도, 상권코드·상권명, 행정동코드·행정동명 등 상권 식별 항목과 함께 신생업소 수, 1년 및 3년 이내 폐업 업소 수, 1년·3년 생존율을 포함합니다.이를 통해 특정 상권에서 새로 문을 연 업소가 얼마나 안정적으로 유지되는지 분석할 수 있으며, 업종별 창업 리스크 평가, 상권 경쟁력 진단, 자영업 활성화 정책 수립에 활용됩니다. 특히 생존률 정보는 창업 성공 가능성 예측, 투자 가치 판단, 상권 성장성 파악 등에 중요한 지표로 사용됩니다.
