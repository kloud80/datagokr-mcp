summary_user: 서울특별시 양천구 관내 유흥주점영업(룸살롱·노래클럽·스탠드바 등) 인허가 사항을 업소 한 곳당 한 행으로 담은 건별 원장으로, 인허가 일자·영업상태·폐업일자·주소·소재지면적·종사자수·좌표(X, Y) 등을 포함한다. 주민이나 분석가가 "양천구에서 현재 영업 중인 유흥주점은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가"를 확인하거나 학교·주거지 주변 유흥업소 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 지방행정 인허가(LOCALDATA) 공통 형식이라 다른 구·다른 업종 인허가 데이터와 같은 구조로 합쳐 볼 수 있다.
description_portal: 본데이터는 서울특별시 양천구 관내에서 주류를 제공하며 유흥주점으로 영업하는 사업자가 법령에 따라 신청하고 승인받은 인허가 사항을 체계적으로 기록한 데이터이다.해당 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수, 등급구분, 영업장주변구분 등의 항목이 포함된다. 이를 통해 지역 내 유흥주점의 운영 현황을 객관적으로 파악할 수 있으며, 영업자의 행정 서비스 제공과 정책 수립, 안전·위생 관리 강화, 지역주민 보호 등 공공 목적의 의사결정에 활용된다.* 유흥주점영업 - 스탠드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소
