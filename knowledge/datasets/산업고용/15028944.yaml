summary_user: 충청남도 논산시의 토석채취 허가를 허가 건별로 담은 파일로, 업소명·대표자·소재지와 허가지 지번주소, 허가면적·허가량, 채취 용도, 허가 시작일을 수록한다(CSV 395바이트의 소규모 파일). 논산시에서 어느 업체가 어느 지번에서 얼마만큼, 어떤 용도로 토석을 캘 허가를 받았는지 확인하려는 주민·건설자재 사업자·분석가가 쓴다. 전역 조인 키는 없어 허가지 지번주소나 소재지 주소를 매개로 필지·토지이용규제 같은 국토 공간 자료나 다른 시군의 토석채취허가현황과 이름·주소 매핑으로 이어 쓴다.
description_portal: 충청남도 논산시 토석채취허가현황 데이터입니다. 본 데이터는 허가번호, 수허가자 상호, 사무실 연락처, 허가지 주소, 토석채취 용도, 허가 면적(헥타르), 허가량(세제곱미터), 허가 시작일, 허가 종료일, 데이터 기준일자 등 주요 정보를 포함하고 있습니다. 이를 통해 토석채취 허가 현황을 체계적으로 파악할 수 있으며, 토석 자원의 효율적 관리와 불법 채취 방지에 활용됩니다. 또한 지역 환경 보전과 건설자재 공급의 안정성 확보, 관련 행정 업무의 효율성 향상에 기여하는 중요한 기초 자료로 활용됩니다. 데이터 기준일은 2021-10-29 입니다
