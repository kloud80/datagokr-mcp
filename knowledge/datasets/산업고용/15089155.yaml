description_portal: 중소기업기술혁신개발사업의 상생협력형 내역사업에 참여하는 투자기업에 대한 현황 자료이다. 동 사업은 기업 간의 다양한 상생협력 활동을 촉진하여 가치(공급) 사슬 상의 종소기업 경쟁력 확보 및 자립화 기반 마련을 목표로 운영되고 있다. 투자기업의 종류로는 대기업, 중견기업, 공공기관 등으로 구성되어 있다. 투자기업은 대중소기업농어업협력재단에서 관리, 감독을 하고 있다. 따라서 2025년 5월 31일 이후 현황은 대중소기업농어업협력재단에 문의 또는 상생누리(메인페이지) -> 상생정보통신 -> 개방형 상생협력 안내 -> 기업명 검색으로 확인할 수 있다.
