summary_user: 한국남부발전의 사업소별 안전보건경영시스템 인증 보유 현황을 사업소 단위로 정리한 작은 파일(csv, 466바이트)로, 사업소명과 ISO45001 등록번호, 인증기관을 담는다. 공공기관 안전관리를 비교하는 분석가나 협력업체가 '남부발전의 어느 사업소가 어떤 기관에서 ISO45001 인증을 받았는가'를 확인하는 데 쓴다. 사업소명(kospo_saupso_cd)이 실측 조인 키여서 같은 키를 쓰는 남부발전의 다른 사업소별 데이터와 이어 쓴다.
description_portal: 이 데이터는 한국남부발전의 전사 안전보건경영시스템 인증 현황을 정리한 자료입니다. 각 사업소별로 인증번호와 등록번호가 포함되어 있으며, KOSHA-180001, KOSHA-MS, ISO45001 등의 인증을 보유하고 있습니다. 안전보건경영시스템 인증은 공공기관 및 기업이 근로자의 건강과 안전을 보장하기 위해 준수해야 하는 국제 기준에 부합함을 나타내며, 이를 통해 한국남부발전이 안전보건 관리에 얼마나 철저히 노력하는지를 보여줍니다. 본 데이터를 통해 각 사업소가 어떤 안전보건경영시스템 인증을 보유하고 있는지 확인할 수 있으며, 공공기관의 안전 관리 수준을 평가하고 비교할 수 있습니다. 또한 연구자와 정책 담당자는 안전경영 시스템의 효과성과 개선 방안을 분석하는 데 활용할 수 있습니다. 이는 공공기관의 경영 투명성과 사회적 책임을 강화하는 중요한 자료로 활용될 수 있습니다.
