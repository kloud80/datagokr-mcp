description_portal: 데이터는 업력, 업종, 기업형태, 창업자 성별과 연령을 기준으로 창업 전 취업 상태에 대한 분포를 제시하고 있습니다. 취업 상태는 휴직 중 창업, 겸직 창업, 전업 창업 등으로 구분되어 있으며, 업력 구간이 증가함에 따라 전업 창업 비율이 대체로 높게 나타납니다. 업종별로는 금융 및 보험업, 전문 과학 및 기술 서비스업, 정보통신업 등에서 전업 창업 비율이 높게 나타나며, 부동산업은 전체적으로 취업 유지 상태에서 창업한 비율이 상대적으로 높습니다. 성별에 따라 남성은 전업 창업 비율이 여성보다 높으며, 여성은 전체적으로 모든 취업 상태에서의 창업 비율이 낮은 편입니다. 연령대별로는 40대와 60대 이상에서 전업 창업 비율이 높고, 20대 이하에서는 매우 낮게 나타납니다. 본 데이터는 창업자의 사전 취업 상태에 따른 창업 경향 분석에 유용한 자료입니다.
