summary_user: 「녹색건축물 조성 지원법」에 따라 제로에너지건축물 인증을 받은 건축물을 인증 건별로 담은 전국 단위 파일(CSV)로, 인증구분·건물 용도·에너지자립률·지역·건축물명·업체명·인증등급·인증일자를 담는다. 건축주나 설계·시공사가 비슷한 용도의 건물이 어느 인증등급과 에너지자립률을 받았는지 참고하거나, 정책 담당자가 지역별 제로에너지건축물 분포와 자립률 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지역명이나 건축물명·업체명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 「녹색건축물 조성 지원법」 제17조에 따라 인증받은 제로에너지건축물에 대한 상세 현황을 제공합니다. 제로에너지건축물이란 에너지 소비를 최소화하고 신재생에너지를 활용하여 건물 스스로 필요한 에너지를 생산하는 친환경 건축물입니다.제공되는 주요 정보는 인증구분, 건물주용도, 건물용도, 에너지자립률, 지역, 건축물명, 업체명, 제로에너지건축물 인증등급, 인증일자 등이며, 본 데이터를 통해 건축주 및 건설회사는 제로에너지건축물 설계 및 시공 시 참고할 수 있습니다.또한 연구기관 및 정책 입안자는 에너지자립률 현황 및 지역별 제로에너지건축물 분포 분석 등 관련 연구 및 정책 수립을 위한 기초자료로 활용할 수 있습니다.
