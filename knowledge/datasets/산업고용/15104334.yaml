summary_user: 2017년부터 2021년까지 경기도 시군별 전력거래량을 월 단위로 집계한 파일로, 지역·날짜·전력거래량(MWh) 세 항목을 담는다. 에너지 분석가나 지자체 담당자가 경기도 안에서 어느 시군의 전력거래량이 몇 년 사이 얼마나 늘었는지, 계절별로 어떻게 달라지는지 비교할 때 쓴다. 공통 조인 키(행정코드 등)는 없어서 다른 지역별·월별 통계와 연결하려면 지역 이름을 시군구 코드에 직접 맞추고 날짜를 월 기준으로 맞춰야 한다.
description_portal: 'ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 2017년 ~ 2021년도까지의 월별 경기도 시군별 전력거래량을 나타냅니다.*단위 : MWh※ 전력거래량은 수정정산으로 인해 값이 변경될 수 있습니다.'
