description_portal: 중소기업기술정보진흥원에서 제공하는 "중소기업 기술개발 지원사업정보" 데이터는 정부가 시행하는 중소기업 R&D 지원사업에 대한 포괄적이고 체계적인 정보를 집약한 핵심 목록입니다. 이 데이터는 사업명을 비롯하여 해당 사업이 중점적으로 다루는 지원분야를 명시합니다. 또한, 연구수행주체와 지원목적을 밝혀 사업의 목표와 참여 대상을 명확히 구분합니다. 연구개발단계와 연구개발기간 정보를 통해 사업의 성격과 수행 기간을 알 수 있으며, 25년 정부투자규모(억원) 컬럼은 해당 사업의 재정적 규모를 보여줍니다. 세부사업개요 컬럼을 통해 사업의 세부적인 추진 내용과 특성을 요약적으로 파악할 수 있습니다.
