description_portal: 본 데이터는 한국에너지기술평가원(KETEP)이 지원하는 에너지기술개발사업의 기술 성숙도별 통계 정보를 집약한 공공 데이터입니다. 제공되는 정보는 각 연도별로 수행된 과제들을 기술 성숙도에 따라 기초연구, 개발연구, 응용연구, 기타로 세분화하여 그 수를 제공합니다. 이를 통해 에너지 R&D 투자가 기술 개발의 어느 단계에 집중적으로 이루어지는지, 그리고 시간의 흐름에 따라 기술 성숙도별 지원 비중이 어떻게 변화하는지를 파악할 수 있습니다. 이 데이터는 에너지 기술 정책의 효과성을 분석하고, 미래 기술 로드맵을 수립하는 데 중요한 참고 자료로 활용될 수 있습니다.
