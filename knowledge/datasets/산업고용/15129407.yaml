description_portal: '이 데이터는 한국산업기술진흥원에서 수행한 다양한 교육훈련 성과를 기록한 것입니다. 사업을 수행하는 과정에서 기술컨설팅, 기술지도 등의 교육훈련 프로그램을 진행한 내용을 포함하고 있습니다. 본 데이터셋은 각 프로그램의 공적 성과를 나타내며, 프로그램명, 수행기관, 지원건수 및 관련 정보를 상세히 제공합니다. 이를 통해 산업계의 교육훈련 현황을 파악할 수 있으며, 기업이나 공공기관에서도 벤치마킹할 수 있는 기초자료로 활용될 수 있습니다. 이 데이터는 다음과 같은 구조로 이루어져 있습니다.성과발생년도(숫자형): 교육훈련 성과가 발생한 연도를 나타내며교육훈련순번(숫자형): 각 교육훈련 프로그램의 순번프로그램명(문자형): 진행된 프로그램의 명칭수행기관명(문자형): 해당 프로그램을 시행한 기관의 이름지원년도(숫자형): 지원이 이루어진 연도총지원건수(숫자형): 총 교육훈련 지원 건수총지원인력수(숫자형): 지원받은 인력의 총 수등록일자(날짜형): 데이터의 등록일자'
