description_portal: 이 데이터는 2011년부터 2025년까지 산업재해로 인한 정신질병 관련 신청 및 승인 현황을 연도별로 집계한 통계 자료입니다. 전체 신청 건수, 승인 건수 및 승인율을 포괄하며, 승인된 질병에 대해서는 우울증, 적응장애 등 주요 진단명별 상세 현황을 제공합니다. 특히, 2011년부터 2022년까지의 승인 통계는 안전보건공단, 불승인 통계는 근로복지공단 기준이며, 2023년부터 2025년까지는 근로복지공단 통계 기준이라는 통계 산정 기준의 변화가 있으므로, 시계열 분석 시 이 점을 반드시 고려해야 합니다. 본 자료는 직장 내 심리적 건강 문제의 증가 추이와 사회적 인정 수준을 파악하는 데 핵심적인 정보를 제공합니다.본 데이터는 직장인의 정신 건강과 관련된 정책 및 연구에 다방면으로 활용될 수 있습니다. 정책 입안자는 연도별 승인율의 변화와 주요 질병 유형의 증감을 분석하여, 정신적 위험 요인이 높은 직무 환경이나 산업 분야에 대한 예방 및 관리 대책을 수립할 수 있습니다. 또한, 학술 연구자는 이 자료를 활용하여 사회경제적 변화와 노동 환경이 근로자의 정신 건강에 미치는 영향을 심층적으로 연구하고, 관련 법제도의 개선 방안을 제시하는 데 기여할 수 있다고 판단됩니다.※ (2011~2022) 승인은 안전보건공단, 불승인은 근로복지공단 통계 기준※ (2023~2025) 근로복지공단 통계 기준
