description_portal: 부산광역시 북구_노인일자리  데이터는 부산광역시 북구 관내 노인일자리 및 사회활동 지원사업에  대한 기본 데이터로 현재 실시 중인 수행기관, 전화번호, 주소, 대표자, 참여 인원 등의 기본 정보를 제공합니다. 노인 일자리는 노인 일자리 및 사회활동 지원에 관한 법률에 근거하며, 노인공익활동사업, 노인역량활용사업, 공동체 사업 등으로 나뉩니다.노인이 일자리와 사회활동을 통하여 활동적이고 생산적인 노후생활을 영위할 수 있도록 지원함으로써 노인의 건강과 복지를 증진하는 데 이바지할 수 있습니다.
