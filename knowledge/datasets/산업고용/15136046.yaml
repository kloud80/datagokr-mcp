description_portal: '중소벤처기업진흥공단이 운영하는 청년재직자 내일채움공제에 사전 가입신청을 하거나 내일채움공제 가입자가 청년재직자 내일채움공제로 사전 전환신청을 한 경우의 가입자가 재직하는 기업의 현황정보입니다 .* 청년재직자 내일채움공제 사업은 2022년 사업 일몰되어 더이상 신규가입자를 받지 않으며, 사전 (전환)신청은 2018년에 한시적으로 진행하였으므로 더이상 업데이트 되지 않습니다.** 컬럼 상세 설명 -  사업자 등록번호 : 해당 가입자가 재직하는 회사의 사업자 등록번호 - 기업 주소 : 해당 가입자가 재직하는 회사의 주소 - 중소기업납입금액 : 해당 가입자의 공제상품에 대한 기업 부담금 - 핵심인력납부금액 : 해당 가입자의 공제상품에 대한 본인 부담금'
