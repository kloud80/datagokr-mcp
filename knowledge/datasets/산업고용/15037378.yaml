summary_user: 사업주훈련(기업직업훈련카드·재직자 디지털융합훈련 등) 훈련과정을 과정별로 담은 건별 목록으로, 과정명·훈련기관·주소·연락처·훈련기간(시작·종료일)·훈련비·정원·NCS 직무코드·훈련지역 등을 전국 범위로 제공한다. 재직자 교육을 보내려는 중소기업 담당자가 "우리 지역에서 다음 달 시작하는 특정 NCS 직무 분야 사업주훈련 과정은 무엇이고 정원은 얼마인가"를 찾는 데 쓴다. 전역 조인 키는 없으며, NCS 코드(ncsCd)로 NCS 직무 사전과, 훈련과정 ID·회차(trprId·trprDegr)와 훈련기관 코드로 같은 기관(고용24)의 다른 훈련과정·기관 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 사업주 직업능력개발 지원사업주 직업능력개발훈련은 사업주(=사업장 대표)가 소속근로자 등의 직무수행능력을 향상시키기 위하여 훈련을 실시할 때, 이에 소요되는 비용의 일부를 지원해 주는 제도로 사업주 훈련이라고도 합니다.기업직업 훈련카드빠르게 발급받고 손쉽게 사용하는 기업직업훈련카드로 중소기업이 재직자 직무능력향상에 필요한 훈련과정을 기업훈련 여건 및 수요에 맞게 자유롭게 수강할 수 있는 바우처를 발급·지원하는 사업입니다.재직자 디지털융합훈련코로나 시대 경제·사회구조 변화에 대응하기 위한 빅데이터, 인공지능 등 디지털 뉴딜의 핵심 기술에 대한 근로자 역량강화가 필요하여, 시·공간의 제약 없이 훈련이 가능한 원격훈련의 강점을 살려 재직자의 디지털 융합 기술 역량 개발을 지원합니다패키지 구독형 원격훈련다수의 훈련과정 묶음을 일괄 계약형태로 구독서비스를 체결하여 다양한 훈련 콘텐츠를 자유롭게 수강할 수 있도록 지원합니다.고숙련 신기술 훈련산업구조 고도화 및 변화에 맞춰 숙련도 향상 및 신기술 습득을 위한 역량 개발 훈련을 지원합니다.
