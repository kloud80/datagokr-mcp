summary_user: 부산 해운대구에 등록된 건설기계사업자를 사업자 한 곳당 한 행으로 담은 파일(csv, 약 2.6KB)로, 상호·영업상태·사업유형·등록종별·전화번호·주소와 데이터 기준일자를 담는다. 건설기계 대여·정비·매매 업체를 찾는 주민이나 사업자가 '해운대구에서 영업 중인 건설기계 대여업체는 어디인가'를 확인하거나, 분석가가 구 단위 업종 분포를 볼 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭으로만 잇고, 지방행정 인허가(LOCALDATA) 건설기계사업 데이터나 타 시군구의 같은 현황 파일과 나란히 놓고 비교하는 방식으로 쓴다.
limits: 해운대구 등록 사업자만 담고 있어 다른 구·시의 건설기계사업자는 해당 지자체 파일을 따로 받아야 한다. 실측 컬럼에 사업자번호·좌표 등 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵다.
