summary_user: 한국전력거래소 전력시장에 참여하는 회원사별로 날짜(거래일자)마다 설비용량과 전력거래량을 담은 전국 범위 데이터로, 회원사 이름(companyNm) 단위의 행으로 내려온다. 에너지 분석가나 발전·판매 사업자가 '특정 발전회사가 특정 날짜에 시장에서 얼마나 거래했고 설비용량은 얼마였나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 전력 데이터와는 회원사 이름 매핑이나 같은 기관(전력거래소) 데이터의 날짜·이름 기준으로만 이어 쓴다.
description_portal: ㅇ 전력시장은 발전소에서 생산한 전기를 판매하기 위해 한 곳으로 모은다는 의미에서 풀(POOL)이라고도 부릅니다.ㅇ 전력거래소는 전력시장 운영규칙에 따라 입찰, 정산, 계량, 시장감시, 정보공개, 분쟁조정 등 공정하고 투명한 시장 운영업무를 맡고 있으며, 전력시장을 통해 전력을 판매하는 발전회사와 전력을 구매하는 판매회사, 구역전기사업자, 또는 대규모 소비자(직접구매자)가 참여하여 전력의 거래가격과 거래량을 결정합니다.ㅇ 해당목록은 한국전력거래소 전력시장에서 전력을 거래하고 있는 회원사별 설비용량과 전력거래량을 날짜별로 조회 할 수 있는 서비스입니다.
