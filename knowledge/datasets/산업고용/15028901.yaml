legal_basis_portal: 본 데이터는 「행정사법」 제6조 및 제12조에 따라 등록된 행정사의 개업 신고 및 사무소 설치 현황을 기반으로 수집되었습니다.행정사는 개업 시 관할 시·도지사에게 행정사 등록과 사무소 개설 신고를 의무적으로 해야 하며, 이에 따라 행정기관(시·도청 또는 대한행정사회)은 관련 정보를 관리하고 있습니다.
