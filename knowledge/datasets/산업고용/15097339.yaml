summary_user: 용인시 관내 기업을 한 건씩 담은 목록으로, 기업마다 구분, 회사명, 대표자, 전화번호, 주요생산품목을 제공한다. 사업자나 구매 담당자가 '용인시에서 특정 품목을 생산하는 기업이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 관내 기업의 업종 구분별 분포를 보는 데 쓴다. 다른 데이터와 직접 이을 사업자등록번호 같은 공통 조인 키가 없어서, 회사명이나 품목명을 문자열로 맞추는 방식으로만 연결한다.
limits: 사업자번호·주소·좌표가 없어 다른 기업 데이터나 지도와 정확히 연결하기 어렵고, 범위가 용인시 한 곳이라 다른 시군구와 비교하는 데는 쓸 수 없다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회까지 호출할 수 있다.
