description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 신재생에너지 도입 실적을 제공합니다. 태양광, 연료전지, 지열, 소수력, 태양열 등 다양한 신재생에너지 유형별로 보급·설치 용량(MWh)과 석유환산톤(TOE)을 포함하고 있어, 에너지원별 도입 규모와 에너지 절감 효과를 정량적으로 확인할 수 있습니다.여기서 TOE(Ton of Oil Equivalent, 석유환산톤)은 서로 다른 에너지원을 비교할 수 있도록 석유 1톤을 연료로 사용했을 때의 발열량(약 10,000 kcal/kg 기준)을 표준 단위로 환산한 값으로, 에너지 절감·공급 효과를 통합적으로 파악하는 데 활용됩니다.본 데이터는 행복도시 내 에너지 자립도, 온실가스 감축 효과, 친환경 도시 조성 성과 등을 파악하는 데 활용될 수 있으며, 향후 신재생에너지 정책 수립, 환경 연구, 에너지 효율성 분석, 탄소중립 이행 모니터링 등에 유용하게 쓰일 수 있습니다.
