summary_user: 2026년 근로지원인 지원사업 위탁운영 수행기관으로 선정된 기관을 기관 한 곳당 한 행으로 담은 전국 명단 파일로, 수행기관명·담당 공단 지사·우편번호·주소·사업자등록번호·전화번호를 담는다. 근로지원인 서비스를 받으려는 장애인 근로자나 사업주가 "우리 지역에서 근로지원인을 연결해 주는 수행기관은 어디이고 어느 공단 지사 소관인가"를 찾을 때 쓴다. 사업자등록번호(bizno)를 키로 사업자 상태 조회나 다른 기관·사업자 데이터와 잇고, 주소를 지역 단위로 묶어 지역별 기관 분포를 볼 수 있다.
