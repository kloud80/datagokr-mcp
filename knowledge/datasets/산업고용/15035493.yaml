summary_user: 충청남도 논산시에서 지정한 담배소매인을 업소 한 건씩 담은 인허가 원장 파일(CSV)로, 지정번호·지정일자·영업상태·상호명·도로명/지번주소·우편번호를 담는다. 논산시 안에서 지금 영업 중인 담배소매점이 어디에 있는지, 특정 지역에 소매인이 얼마나 몰려 있는지 확인하려는 주민·예비 창업자·분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소(도로명·지번)나 상호명을 맞춰 연결하고, 같은 지방행정 인허가(LOCALDATA) 계열 업종 데이터와는 같은 기관 기준으로 나란히 본다.
description_portal: 충청남도 논산시 담배소매인 지정 현황 데이터입니다. 본 데이터는 인허가일자, 영업상태, 상호명, 행정동명, 소재지 도로명주소 및 지번주소, 대표 전화번호, 관리기관명, 데이터 기준일자 등 주요 정보를 포함하고 있습니다. 이를 통해 담배소매인의 영업 현황과 위치를 체계적으로 파악할 수 있으며, 관련 행정 업무 및 관리에 활용됩니다. 또한 합법적인 영업활동 지원과 불법 판매 방지, 주민 안전 및 건강 보호에 기여하는 중요한 자료입니다. 데이터는 지역사회 서비스 개선 및 정책 수립에 필수적인 기초 정보로 활용됩니다.
