summary_user: 경기도 내 전력기술감리업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·지번/도로명 주소·WGS84 좌표·설계감리업 종류(전문·종합 등)·실질자본금을 포함한다. 감리 업체를 찾는 발주자나 분석가가 "우리 시군에서 영업 중인 종합감리업체는 어디이고 자본금 규모는 어떤가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·사업장명·주소 같은 이름·코드 매핑이나 좌표로만 연결하며, 같은 LOCALDATA 계열의 다른 에너지 업종 인허가 데이터와 함께 보는 데 쓴다.
description_portal: 이 데이터는 경기도를 포함한 지역 내 전력기술감리업체의 인허가 현황을 정리한 자료로, 각 사업장의 시군명, 사업장명, 인허가일자, 영업상태, 전화번호, 소재지 도로명 주소 및 우편번호, WGS84 위도·경도 좌표, 업종 구분(감리업), 설계감리업종류(전문감리업, 종합감리업 등), 실질자본금 등의 항목으로 구성되어 있습니다. 이 데이터는 전력설비 관련 기술 감리업체의 등록·관리 현황을 파악하고, 인허가된 업체의 위치 정보 및 업종 특성별 분포를 분석하는 데 활용됩니다. 또한 지역별 감리업체 분포 현황, 전문성 구분, 인허가 변동 추세 등 전력 산업 인프라 및 감리 체계에 대한 정책 수립, 제도 개선, 시장 분석에 유용한 자료로 사용될 수 있습니다.
