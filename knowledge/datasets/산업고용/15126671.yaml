description_portal: 건축업체 업종별 현황은 대구광역시 북구 관내 전문건설업, 골재채취업 업종을 갖고 있는 업체에 대한 기본정보(업체명, 사업자등록번호, 업종, 전화번호, 주소 등)로 구성된 데이터입니다.전문건설업체는 건설산업기본법의 건설업 등록규정에 따라 등록된 업체로 총 14개(지반조성.포장공사업, 실내건축공사업, 금속창호.지붕건축물조립공사업, 도장.습식.방수.석공사업, 조경식재.시설물공사업, 철근.콘크리트공사업, 구조물해체.비계공사업, 상.하수도설비공사업, 철도.궤도공사업, 철강구조물공사업, 수중.준설공사업, 승강기.삭도공사업, 기계설비.가스공사업, 가스난방공사업)의 전문건설업종을 포함합니다.골재채취업체는 골재채취법의 골재채취업 등록규정에 따라 등록된 업체로 총 6개의 골채채취업종(수중골재채취업, 바다골재채취업, 산림골재채취업, 육상골재채취업, 골재선별.파쇄업, 바다골재선별세척업)을 포함합니다.
