summary_user: 건설 중인 원자력발전소 프로젝트(신한울1,2호기·신한울3,4호기·새울3,4호기)별로 원자로설비·터빈발전기 공급, 종합설계, 주설비공사 같은 주계약의 구분·업체명·계약일·계약만료일을 담은 소규모 목록 파일(854바이트 CSV)입니다. 원전 건설 공급망을 살피는 분석가나 사업자가 특정 원전 프로젝트에 어떤 기업이 어떤 역할로 언제까지 계약했는지 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 프로젝트명이나 업체명을 문자열로 맞춰 연결해야 합니다.
description_portal: 현재 건설중인 원자력발전소의 프로젝트별(신한울1,2호기, 신한울3,4호기 및 새울3,4호기) 주계약 현황을 나타내는 자료입니다.신한울1,2호기, 신한울3,4호기 및 새울3,4호기에 설치되는 원자로설비 및 터빈발전기는 국내기업인 두산에너빌리티에서 공급을 하고, 종합설계를 담당하고 있는 회사는 한국전력기술입니다.주설비공사는 한개의 프로젝트당 3개의 건설회사가 참여하여 진행을 하는데, 신한울1,2호기의 경우 현대건설, SK에코플랜트, GS건설에서 진행하였고, 새울3,4호기는 삼성물산, 두산에너빌리티, 한화오션, 그리고 신한울3,4호기는 현대건설, 두산에너빌리티, 포스코이앤씨에서 진행을하고 있습니다.
