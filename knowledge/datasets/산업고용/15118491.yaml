summary_user: 워크넷에서 운영하는 청년 구직자 취업역량 강화 프로그램(단기집단상담, 청년취업역량, 성취, 취업특강, 행복오름 등)의 소개 내용을 프로그램 구분별로 담은 전국 단위 소개 파일입니다. 청년 구직자나 상담 실무자가 '면접·이력서 준비나 진로설계를 도와주는 공공 프로그램에는 어떤 것이 있나'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 이어 쓸 전역 조인 키가 확인되지 않아, 직업훈련 과정이나 일자리사업 데이터와는 프로그램 구분 이름을 대조해서만 연결합니다.
description_portal: 이 자료는 청년일자리올인원지원서비스의 일환으로 워크넷에서 제공하는 구직자 취업역량 강화 프로그램들을 소개하는 콘텐츠입니다. 본 프로그램은 청년층 구직자의 자기이해, 진로설계, 면접 및 취업준비 능력 강화를 목표로 구성되어 있으며, 참여자 맞춤형 단계별 지원이 특징입니다. 프로그램은 다음과 같은 세부 과정으로 구성됩니다. 단기집단상담 프로그램은 집단 활동을 통해 진로 인식과 구직 스트레스를 완화하고, 청년취업역량 프로그램은 진로설정 및 기업 분석 역량을 향상시키며, 성취 프로그램은 자존감 회복과 구직 동기 부여에 초점을 둡니다. 이외에도 취업특강 프로그램, 행복오름(취업역량향상) 프로그램은 실전 면접과 이력서 작성 등 실용적 역량 향상에 도움을 줍니다.
