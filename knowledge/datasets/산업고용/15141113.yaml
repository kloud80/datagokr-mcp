description_portal: '은평구의 텔레마케팅과 같은 전화를 이용하여 소비자에게 권유하거나 전화회신을 유도하는 방법으로 재화 등을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구에 사업장을 두고 텔레마케팅과 같이 전화를 이용하여 소비자에게 판매를 권유하거나 전화 회신을 유도하는 방식으로 영업하는 전화권유판매업체의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같은 특수판매 분야의 소비자 보호를 위한 핵심 행정 정보가 포함되어 있습니다 .이 데이터는 소비자가 원치 않는 판매 전화를 받거나, 허위·과장 광고에 노출되는 것을 방지하고, 합법적인 업체를 통해 안전하게 거래할 수 있도록 돕는 중요한 역할을 합니다. 특히 공정거래위원회가 운영하는 **‘전화권유판매 수신거부의사 등록시스템(두낫콜)’**과 연계하여 , 소비자의 수신 거부 권리를 보장하고 업체의 준수 여부를 감독하는 데 활용됩니다. 지자체는 이 데이터를 기반으로 불법 텔레마케팅 업체를 단속하고, 건전한 비대면 거래 질서를 확립하여 소비자 권익을 보호하는 데 필수적인 기초 자료로 사용합니다 .'
