summary_user: 경기도 포천시 관내 담배소매업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 상호·소재지·위도·경도·데이터기준일을 담는다(CSV 약 82KB). 주민이나 분석가가 '우리 동네나 학교 주변에 담배소매점이 어디에 얼마나 몰려 있나'를 지도에서 확인하거나, 상권 분석·청소년 보호 정책의 기초자료로 쓴다. 공통 식별 코드나 사업자번호 같은 전역 조인 키는 없어서, 소재지 주소나 위도·경도 좌표를 기준으로 행정구역·학교·상가업소 같은 공간 데이터와 공간 결합하거나 상호 이름으로 맞춰 이어 쓴다.
description_portal: 경기도 포천시에서 제공하는 담배소매업 현황 데이터입니다. 본 데이터는 포천시 관내 담배소매업소의 기본 정보를 제공하는 자료로, 상호, 소재지, 위도, 경도, 데이터기준일 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내 담배소매업소의 위치와 분포 현황을 확인할 수 있으며, 담배소매업 관리, 지역 상권 분석, 금연환경 조성 및 청소년 보호 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 위도·경도 및 소재지 정보를 기반으로 행정구역, 생활편의시설, 공간정보 등 다양한 공공데이터와 연계·분석이 가능하여 지도 기반 서비스 구축, 지역 인프라 분석에 활용할 수 있는 공공데이터입니다.본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
