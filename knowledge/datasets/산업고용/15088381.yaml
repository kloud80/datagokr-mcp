description_portal: 이 데이터는 근로복지공단이 코로나19와 같은 경제 위기 상황에서 근로자의 고용 유지를 지원하기 위해 시행한 고용유지비용 지원 사업의 현황을 담고 있습니다. 지원 기간은 2020년 8월부터 2021년 12월까지이며, 통계 항목은 대부 금액(원), 지원을 받은 사업장 수, 그리고 대부 인원(명)을 월별로 제공합니다. 이 사업은 일시적인 경영난에도 불구하고 감원 대신 휴업, 휴직 등을 통해 고용을 유지하는 사업주에게 인건비 부담을 줄여주기 위한 저금리 대부 형태로 지원되었습니다. 이 자료는 감염병과 같은 외부 충격이 국내 노동 시장과 기업 경영에 미치는 영향을 파악하고, 정부의 고용 유지 지원 정책이 실제 현장에 투입된 규모와 대상을 정량적으로 분석하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 위기 상황에서의 고용 안정화 정책 효과 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 월별 대부 금액 및 인원 변화 추이를 분석함으로써, 경제 위기 상황에서 고용 유지 지원 수요가 가장 높았던 시점을 정확하게 파악할 수 있습니다. 이를 통해 향후 유사한 경제적 충격 발생 시 선제적인 재정 지원이 필요한 시기를 예측하고, 지원 대상 사업장의 규모 및 특성을 분석하여 맞춤형 지원 정책을 신속하게 수립하는 데 활용할 수 있습니다. 또한, 이 통계는 공공 재정 지원이 고용 유지에 기여한 정도를 평가하고, 고용 안전망의 작동 효율성을 검토하는 데 기여할 수 있다고 판단됩니다.※ 2021년에 해당 사업이 종료되었으며, 2020년 8월~2021년 12월까지만의 대부인원, 대부금액, 사업장 수를 포함하고 있습니다.
