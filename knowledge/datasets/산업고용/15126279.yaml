description_portal: '경기도 지역의 업종별(제조업, 건설업, 기타의 사업, 그외 업종 등) 재해정도(요양기간)별 산업재해 현황에 대해 제공하고자 합니다.<통계 산출기준>ㅇ 근로복지공단의 산재보상 승인자료를 활용하여 발생연도가 아닌 "승인 연도 기준"으로 산출ㅇ 재해자에는 사망자가 포함됨ㅇ  ‘18.1.1.부터 확대 적용된「산업재해보상보험법」상의 통상 출퇴근 재해는 제외ㅇ 사망자에는 사업장외 교통사고, 체육행사, 폭력행위, 사고발생일로 부터 1년 경과 사고사망자, 통상 출퇴근 사망자는 제외    (다만, 운수업, 음식숙박업의 사업장 외 교통사고 사망자는 포함) ㅇ 사망자에는 사업장외 교통사고, 체육행사, 폭력행위, 사고발생일로부터 1년 경과 사고사망자, 통상 출퇴근사망자는 제외   (다만, 운수업, 음식숙박업의 사업장외 교통사고 사망자는 포함) 되어 있고, 재해자에는 제외되는 사망자가 모두 포함되어     있어 재해정도(요양기간별)를 합한 수치와 재해자는 일치하지 않음ㅇ 산업재해 현황은 지방고용노동관서의 소재 지역에 따라 구분하여 산출하고 있어, 실제 행정구역과는     일부 불일치한 경우가 있을 수 있음    - 경기지역은 부천, 의정부, 고양, 경기, 성남, 안양, 안산, 평택 지방고용노동관서를 기준으로 작성    - 부천: 경기도 부천시, 김포시    - 의정부: 경기도 의정부시, 동두천시, 구리시, 남양주시, 양주시, 포천시, 연천군, 강원도 철원군    - 고양: 경기도 고양시, 파주시    - 경기: 경기도 수원시, 용인시, 화성시    - 성남: 경기도 성남시, 하남시, 이천시, 광주시, 여주시, 양평군    - 안양: 경기도 광명시, 안양시, 과천시, 의왕시, 군포시    - 안산: 경기도 안산시, 시흥시    - 평택: 경기도 평택시, 오산시, 안성시'
