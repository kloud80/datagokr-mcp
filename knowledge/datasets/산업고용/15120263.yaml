description_portal: 한국벤처투자에서 한국모태펀드, 벤처투자모태조합 등을 운용하며 축적한 시장 정보와 운용 성과 정보를 공개하고 민간과 공유하여 민간 주도의 벤처생태계를 조성하고 중소기업과 벤처기업 등의 투자를 활성화하기 위해 매월 저널 형태로 작성하여 제공하는 KVIC 마켓워치(MarketWatch)의 발간 현황 데이터입니다. 마켓워치 현황 파악 및 개별 저널에 접근하기 용이하도록 제목, 다운로드 수, 작성일자, URL 등으로 데이터가 구성되어 있으며, 개별 마켓워치 저널에서는 모태 출자펀드 결성부터 회수까지 큰 흐름을 살펴볼 수 있는 결성/투자/회수 동향, 모태 출자펀드의 투자 트렌드를 심도 있게 분석하고 시장 동향을 예측하는 투자 산업 트렌드, 국내 벤처펀드들의 재무적 성과를 비교할 수 있는 잣대인 벤처펀드 벤치마크, 그 밖에 시의성있는 벤처생태계 관련 이슈를 점검해보는 Venture Opinion, 모태조합 출자펀드가 투자한 유니콘 및 유니콘 후보 기업 분석, 미국, 유럽 등 해외 벤처캐피털 시장의 동향을 다각적인 관점에서 분석한 정보를 제공하는 해외 VC 시장 동향 등 다양한 종류의 주요 콘텐츠들을 제공합니다.
