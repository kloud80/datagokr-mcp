summary_user: 한국벤처투자가 매월 발간하는 KVIC 마켓워치 저널의 발간 목록을 호별 한 행으로 담은 작은 파일(csv, 약 3.7KB)로, 연번·제목·다운로드 링크로 구성된다. 벤처캐피털 업계 종사자나 분석가가 '모태펀드 결성·투자·회수 동향이나 벤처펀드 벤치마크를 다룬 호를 어디서 받나'를 찾을 때 개별 저널로 가는 색인으로 쓴다. 전역 조인 키가 없어 다른 데이터와는 제목·발간 시점 같은 이름 매칭이나 같은 기관(한국벤처투자) 자료끼리로만 이어 쓴다.
