summary_user: 서울 강서구에서 반려동물을 판매·알선·중개하는 동물판매업 사업장의 인허가 건별 원장으로, 인허가일자·영업상태·폐업일자·주소·전화번호·사업장명·좌표를 업소 단위로 담는다. 반려동물 관련 사업자나 분석가가 '강서구에 현재 영업 중인 동물판매업소는 어디이고 언제 인허가·폐업했는가'를 확인하거나, 정책 담당자가 지역 내 동물판매업 현황을 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소(지번·도로명) 매칭이나 개방기관코드(OGDP_INST_CD) 같은 기관 코드로 잇고, 좌표(XCRD·YCRD)를 써서 다른 LOCALDATA 업종 인허가나 상가업소 데이터와 위치 기준으로 겹쳐 본다.
description_portal: 서울특별시 강서구 동물판매업 인허가 정보는 강서구 내에서 반려동물의 판매, 알선 또는 중개를 목적으로 운영되는 사업장의 인허가 현황을 제공합니다. 본 데이터는 인허가일자, 영업상태, 주소, 전화번호, 사업장명 등 기본적인 업소 정보를 포함하고 있으며, 반려동물 산업의 규모 파악 및 시장 구조 분석에 유용한 기초자료로 활용됩니다. 특히 반려동물 입양과 유통에 대한 수요 증가에 따라 관련 업소의 현황을 체계적으로 관리하고, 불법 번식 및 유통 방지를 위한 정책 수립의 근거 자료로 활용할 수 있습니다. 나아가 지역 내 동물복지 수준 향상, 반려문화 조성, 공공의 위생·안전 확보를 위한 행정 조치에도 활용도가 높습니다.
