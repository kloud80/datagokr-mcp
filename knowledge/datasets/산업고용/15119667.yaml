description_portal: '본 데이터는 한국에너지기술평가원(KETEP)이 지원한 에너지기술개발사업의 지역별 R&D 지원 현황을 집약한 공공 데이터입니다. KETEP은 국가 에너지 기술 역량의 균형 있는 발전을 위해 전국 각지의 기관들을 대상으로 연구 개발 과제를 지원하고 있습니다. 본 데이터는 이러한 지역별 지원 현황을 객관적인 수치로 보여줌으로써, 지역별 에너지 R&D 역량 및 정책 효과를 분석하는 데 필요한 기초 자료를 제공합니다.제공되는 정보는 2012년부터 2022년까지 11년간 수행된 에너지기술개발 과제를 대상으로, 각 과제가 지원된 지역별로 총 지원 규모(예: 금액)와 지원받은 기관 수를 포함합니다.'
