summary_user: 한국중부발전 발전본부(포털 설명상 보령발전본부)의 태양광 설비용량(MW)과 발전량(MWh)을 연월일 단위로 정리한 발전 실적 CSV 파일(약 14.7KB)입니다. 신재생 분석가나 발전사업자가 '이 태양광 설비가 설비용량 대비 어느 시기에 얼마나 발전했나'처럼 이용률과 계절별 발전 패턴을 따질 때 씁니다. 전역 조인 키는 없으므로 다른 발전량·전력시장 데이터와는 발전본부 이름과 날짜(연월일)를 맞춰 붙이거나, 같은 기관(한국중부발전) 자료끼리 연결합니다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·날짜 매칭으로만 연결합니다. 포털 설명은 '월별 발전량'이라 하지만 필드명은 '일별발전량(MWh)'이므로, 집계 단위를 연월일 값으로 확인한 뒤 해석해야 합니다. 범위가 '전국'으로 표기되어 있으나 실제로는 한 발전사의 특정 발전본부 설비 실적이며 전국 태양광 발전량을 대표하지 않습니다.
