summary_user: 한국수력원자력이 건설 중인 원자력발전소(신고리5·6호기, 신한울1·2호기)의 발전소별 실적공정률을 조회하는 API로, 발전소 코드를 넣으면 발전소명과 실적공정률 값을 돌려준다. 신규 원전 건설이 어디까지 진행됐는지 확인하려는 에너지 정책 분석가나 지역 주민이 '신고리5·6호기 공사가 몇 퍼센트 진척됐나' 같은 질문에 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 발전소 코드나 발전소명으로 같은 기관의 다른 원전 데이터와 매핑해야만 연결된다.
description_portal: '위 api는 한국수력원자력(주)_원전건설 공정률 현황 API 입니다.한국수력원자력(주)에서 현재 건설중인 원자력발전소 신한울1,2호기 및 신고리5,6호기  실적공정률 현황조회 자료입니다. (발전소 파라미터를 이용하여 실적공정률 현황 조회가 가능합니다.)○ servicekey : 공공데이터포털에서 받은 인증키○ genName : 발전소 코드 SKN56 : 신고리5&6, SHN12 : 신한울1&2 ( 샘플 : SKN56)○ PROJ_CD : 발전소 코드(샘플 : SKN56)○ PROJ_CD_DESC : 발전소 명(샘플 : 신고리5,6)○ ACT : 실적공정률 (샘플 : 62.32)'
