description_portal: 해당 데이터는 2022년도에 수행된 국내 주요 기업 및 기관과의 오픈이노베이션 협업 사례를 정리한 자료로 구성되어 있습니다. 항목은 기업명, 수요 내용, 협업 주제 및 형태, 참여 연도로 이루어져 있으며, 협업 주제는 스마트 스타디움, ESG(환경·사회), 인공지능, 메타버스 등으로 다양하게 구분되어 있습니다. 수요 내용에는 프라이싱 알고리즘 개발, 디지털 아바타 서비스, 대체식품 기술, 텍스트 증강 모델 개발 등 구체적인 협업 프로젝트가 포함되어 있습니다. 본 자료는 기술 기반 협업 동향을 파악하고, 유사한 형태의 오픈이노베이션 추진 시 참고 자료로 활용될 수 있도록 정리되어 있습니다.
