summary_user: 경기도 양주시 관내 주유소·LPG 충전소·CNG 충전소를 시설 한 곳당 한 행으로 담은 목록 파일로, 시설 구분·상호·도로명/지번 주소·관리기관과 전화번호·데이터 기준일자를 담는다. 양주시 주민이나 물류 사업자가 '양주시 어느 동네에 LPG·CNG 충전소가 있는가'를 확인하거나, 분석가가 시 단위 연료 공급시설 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 주소를 지오코딩하거나 상호·주소 문자열로 오피넷 유가·전국주유소표준 데이터와 맞춰 이어 쓴다.
description_portal: 경기도 양주시 주유소·LPG·CNG 충전소 현황 데이터입니다.본 데이터는 양주시 관내 주유소, LPG 충전소 및 CNG 충전소의 운영 현황을 제공하며, 시설 구분, 상호명, 도로명주소, 지번주소, 관리기관명, 관리기관 전화번호, 데이터기준일자 등의 정보를 포함하고 있습니다.해당 데이터는 연료 공급시설의 위치와 운영 현황을 체계적으로 확인할 수 있도록 제공되며, 시민의 연료 공급시설 이용 편의 제공, 지역별 에너지 공급 인프라 현황 파악, 행정업무 지원, 공간정보(GIS) 분석, 위치기반 서비스 구축, 교통·물류 및 에너지 관련 정책 수립 등에 활용할 수 있습니다.또한 도로명주소와 지번주소를 함께 제공하여 다양한 주소 체계에서 시설 위치를 확인할 수 있으며, 관리기관 정보를 통해 시설 관리 및 행정 문의에 활용할 수 있습니다. 데이터는 기준일자를 기준으로 작성되며, 최신 시설 운영 현황을 확인하는 기초자료로 활용됩니다.
