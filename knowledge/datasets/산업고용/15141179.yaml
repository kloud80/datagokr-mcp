summary_user: 서울특별시 양천구 관내 고압가스업(용기 충전을 포함해 고압가스를 제조·저장·판매하는 업소) 업체별 인허가 원장으로, 인허가일·영업상태·폐업일·주소·소재지면적·업태·제조구분·좌표를 업소 한 건씩 담는다. 주민이나 사업자가 '양천구에서 영업 중인 고압가스 제조·충전 업소는 어디이며 언제 허가받았나'를 확인하거나, 분석가가 관내 에너지 업종 개폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업체명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 형식의 다른 에너지 업종 인허가(석유판매·LPG·도시가스 등) 데이터와 나란히 쓴다.
description_portal: 본 데이터는 서울특별시 양천구에서 관내 고압가스업체의 인허가 현황을 체계적으로 관리하기 위하여 구축된 행정자료이다. 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 제조구분、 사업장부지용도구분명 등 주요 항목이 포함된다. 이는 고압가스 취급 관련 법령 준수 여부와 안전관리 실태를 확인하고, 지역 내 업체 운영 현황을 분석하는 근거자료로 활용된다. 또한 인허가 변동 사항을 주기적으로 갱신하여 정보의 최신성을 유지하며, 이용자가 업체 현황과 허가 절차를 명확히 이해할 수 있도록 표준화된 형식으로 제공된다. 본 데이터는 안전한 가스 취급 환경 조성과 행정업무 효율성 제고에 기여한다.＊고압가스업 - 용기에 충전하는 것을 포함하여 고압가스를 제조,저장 및 판매하는 업소
