summary_user: 광종별로 단위, 광산수, 품위와 함께 매장량·가채매장량을 확정·추정·합계로 나눠 담은 전국 단위 집계표이며, 광산·지역별 건별 원천이 아닌 작은 CSV 파일(약 2.5KB)이다. 자원개발 분석가나 정책연구자가 '국내에 어떤 광종이 얼마나 매장돼 있고 그중 캐낼 수 있는 양은 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 광업 데이터(광업권·생산 실적 등)와는 광종 이름을 맞춰 연결해야 한다.
description_portal: 산업통상자원부는 광종별 매장량 현황을 격년주기로 제공합니다(다음 업데이트는 26년 중순 예정) 광종별로는 각 자원에 대한 품위와 함께 매장량 현황을 체계적으로 제공합니다. 데이터칼럼은 광종, 단위 광산수, 품위, 매장량으로 구분되며 매장량은 추정, 확정, 계로 구분하여 제시되며, 가채매장량 역시 추정, 확정, 계로 나누어 정리됩니다. 이러한 정보는 자원개발 가능성 평가, 채굴계획 수립, 정책연구 등 다양한 분야에서 활용될 수 있도록 구성되어 있어 자원관리와 산업정책 수립의 중요한 기초자료로 제공됩니다.
