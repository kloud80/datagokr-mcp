summary_user: 성남시 관내에 등록된 국제회의기획업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 업종·상호·등록일자·지번 및 도로명 소재지·전화번호·데이터기준일자를 담는다(CSV 약 4.9KB의 소규모 파일). 성남시에서 컨벤션·포럼·세미나 같은 국제행사를 맡길 기획업체가 어디에 있고 언제 등록했는지 찾는 사업자나 지역 MICE 산업 현황을 보는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소(소재지)를 매칭해서 잇고, 지방행정 인허가(LOCALDATA) 업종 원장이나 소상공인 상가업소 정보와 대조하는 식으로 활용한다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 상호·주소 문자열 매칭에 의존해야 한다. 범위는 성남시 한 곳에 한정되므로 경기도나 전국 현황은 이 파일로 알 수 없다.
