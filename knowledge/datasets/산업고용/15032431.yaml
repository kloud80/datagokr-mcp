description_portal: 성남시 국제회의 기획업현황 자료는 성남시 관내에서 국제회의를 기획·운영하는 업체들의 정보를 담고 있습니다. 이 자료는 대규모 컨벤션, 포럼, 세미나 등 국제 행사를 기획운영하는 업종(국제회의기획업), 상호명, 등록일자, 소재지, 전화번호 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 국제행사 유치 전력과 지역 경제 활성화 정책등의 기초자료로 활용 할 수 있습니다.
