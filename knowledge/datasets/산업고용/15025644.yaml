summary_user: '부산광역시 금정구에 등록된 대규모 점포(대형마트·백화점·슈퍼마켓·전통시장 등)를 점포 한 곳당 한 행으로 정리한 시군구 단위 목록으로, 상호·주소·전화번호를 담는다. 금정구 주민이나 상권 조사자가 "금정구에 어떤 대형 유통점포가 어디에 있고 연락처는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 상호명이나 주소를 맞춰 보는 방식으로만 이어 쓴다(예: 전국대규모및준대규모점포표준데이터와 상호·주소 대조).'
description_portal: 첨부된 데이터는 부산시 금정구 관내에 존재하는  대규모 점포 등록 현황에 관한 자료로, 금정구 대규모 점포의 상호명, 연락처 등의 정보를 제공합니다.이 데이터는 부산광역시 금정구에 등록된 대규모 점포(마트, 쇼핑몰, 시장 등)들의 현황을 정리한 자료이며, 2026년 4월 10일 기준 정보로 총 7개의 레코드가 포함되어 있습니다.각 항목은 순번, 상호(점포명), 주소, 그리고 업소 전화번호의 4가지 정보로 구성되어 있어 점포의 위치 및 연락처를 즉각적으로 파악할 수 있습니다.데이터에는 (주)이마트, (주)GS리테일(슈퍼마켓), NC백화점 등 대형 유통업체 계열 점포뿐만 아니라 남산(농수산)시장과 같은 전통시장 정보도 포함되어 있습니다.이 자료는 지역 소비 패턴 분석, 상권 조사, 유통 산업 구조 파악, 그리고 행정기관의 유통산업발전법 관련 관리 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다.
