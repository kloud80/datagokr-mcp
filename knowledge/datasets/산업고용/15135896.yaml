description_portal: 트렌치조사 결과는 시추조사에 비해 비교적 오랜기간 조사할 수 있으나, 비용과 시간이 많이 들고 대상지 훼손등 일부 단점이 존해함, 따라서 조사시 확보된 결과는 조사지 주변의 기반암 및 퇴적층의 분포특성 파악에 중요한 자료이며 특히 시추주상도와 달리 수직적인 정보제공이 아닌 수평적이고 2차원 단면에 대한 정보를 제공함으로써 지질구조특성 파악에 유리함, 2차원 단면으로 보이는 트렌치영역에 따라 관찰되는 암종, 지질구조, 풍화대 분포 및 입도 변화 등을 기록하는 자세한 결과도로 골재자원 개발 및 활용에 대한 기초자료로 유용한 자료임
