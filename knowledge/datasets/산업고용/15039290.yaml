description_portal: 한국전력공사에서 제공하는 전국 시군구별 전기차 충전소 설치현황 데이터 입니다.해당 데이터는 사용자가 원하는 정보를 직접 설정하여 추출할 수 있는 시스템으로 행정구역, 추출정보를 설정하면 테이블과 그래프로 제공받을 수 있습니다.기본적으로 조회는 가능하나 다운로드시에는 회원가입과 로그인이 필요합니다.사용자는 지역별 전기차 충전 인프라의 유형 및 규모를 한눈에 파악할 수 있어 급속 충전기와 완속 충전기의 비율을 비교하며 해당 지역의 충전 수요 특성을 분석하는데 활용할 수 있습니다.신규 충전소 설치 사업 타당성을 평가하고 수요대비 공급이 부족한 지역을 식별하는 등 다양한 연구에 도움을 줄 수 있습니다.
