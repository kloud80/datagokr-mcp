description_portal: 한국우편사업진흥원의 장애인기업 생산품 구매실적 공공데이터는 2018년 1월부터 2024년 12월까지의 월별 구매 실적을 담고 있습니다. 데이터는 구매한 월(달), 물품과 공사, 용역, 합계를 다 담고 있는 총구매액과 장애인생산품 구매실적(물품, 공사, 용역, 합계) 등의 항목으로 구성되어 있어, 한국우편가업진흥원의 장애인기업 생산품 구매 현황을 파악할 수 있습니다. 이 데이터를 활용하면 장애인에 대한 인식이 제고될 수 있고, 이와 관련한 복지 정책을 수립하거나 사회 효과 등을 분석할 때도 활용할 수 있습니다.
