description_portal: 대구광역시의 스타기업, PRE-스타기업, 3030기업의 기업명, 대표자명, 주요 생산 품목 등 기업현황을 제공합니다.스타기업은 혁신역량을 갖춘 지역의 유망 중기업을 발굴하고 맞춤형 지원을 통하여 중견기업으로 육성하기 위한 사업입니다.  PRE-스타기업(프리스타기업)은 지역의 유망 소기업을 중기업으로 육성하여 지역경제의 활력 회복을 도모하는 사업입니다.3030기업은 대구시에서 30년 이상 경영활동을 유지해온 우수 향토기업(근로인원 30인 이상)으로 선정된 기업입니다.
