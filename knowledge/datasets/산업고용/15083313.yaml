summary_user: 한국지역난방공사가 청주·세종 지역에 공급한 열을 기준연도·월별로 집계해 주택용·업무용·공공용·냉수용 용도별 판매량(Gcal)으로 담은 작은 CSV 파일(약 8KB)이다. 지역난방 수요를 분석하는 연구자나 에너지 분석가가 "청주·세종의 주택용 열판매량은 계절별로 어떻게 달라지고, 연도별로 늘고 있는가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준연도·월을 맞춰 같은 기관의 열생산량 자료나 지역 기상·인구 자료와 이름 매핑으로 이어 쓴다.
limits: 지역 코드 등 전역 조인 키가 없어 행정구역 단위 자료와 자동으로 결합되지 않고, 연·월과 지역명으로 직접 맞춰야 한다. 범위가 전국으로 표시돼 있으나 설명상 청주·세종 지역 수치이므로 지역별 구분 여부를 확인하고 해석해야 하며, 업무용 컬럼명이 '업우용'으로 오기돼 있다.
