summary_user: 경기도 내 다단계판매(도매업·유통) 업종, 주로 건강기능식품 일반판매업 사업장을 한 건씩 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·시설규모·소재지 주소와 위경도를 포함한다. 지자체 위생 담당자나 상권 분석가가 '우리 시군에 지금 영업 중인 건강기능식품 다단계·유통 업체는 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표 매핑으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 다단계판매(도매업·유통) 업종의 현황을 정리한 자료로, 건강기능식품 일반판매업을 중심으로 한 사업장 인허가 및 운영 정보를 제공합니다. 주요 항목에는 시군명, 사업장명, 인허가일자, 영업상태명(운영중·폐업 등), 폐업일자, 다중이용업소 여부, 총시설규모, 위생업종명 및 위생업태명, 소재지 도로명주소와 지번주소, 소재지 우편번호, WGS84 좌표(위도·경도)가 포함되어 있습니다. 이를 통해 경기도 내 건강기능식품 도매·유통업체의 분포와 영업 현황을 확인할 수 있으며, 특히 영업상태(운영·폐업 등)와 다중이용업소 여부는 위생 관리 및 행정적 감독에 중요한 근거가 됩니다. 또한 위치정보를 통해 GIS 분석, 상권 연구, 공중위생 관리 정책 수립에 활용될 수 있습니다.
