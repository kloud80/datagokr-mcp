description_portal: '본 데이터는 부산광역시 동래구에서 2026년 한 해 추진하는 공공부문 일자리사업에 관한 현황을 체계적으로 정리한 자료입니다.지역 내 고용 창출 및 사회적 경제 활성화를 위한 다양한 사업들이 포함되어 있으며, 각 사업의 목표 인원과 투입 예산 규모를 한눈에 파악할 수 있도록 구성되어 있습니다.주요 제공 항목은 다음과 같습니다:구군명: 사업이 시행되는 행정구역 명칭세부사업명: 구체적인 일자리사업의 명칭사업내용: 해당 사업의 목적 및 주요 추진 내용 설명목표(명): 해당 사업을 통해 채용 또는 지원할 계획인 인원 수예산(백만원): 사업에 배정된 예산 총액 (단위: 백만원)이 데이터는 동래구의 공공부문 일자리 정책 현황을 명확히 파악하고,사업별 예산 배분과 목표 인원 관리의 투명성을 높이는 데 활용됩니다.또한 지역사회 일자리 창출 성과 분석 및 향후 정책 수립을 위한 기초자료로도 활용할 수 있습니다.필요 시 부산광역시 동래구청 일자리정책과 또는 관련 부서에 문의하여 상세 정보를 확인할 수 있습니다.'
