description_portal: 충청북도 고용동향의 종사상지위별 비임금근로자 현황을 연도·월 단위로 조회할 수 있는 Open API로, 임금을 기반으로 하지 않는 근로 형태의 인구 규모를 종사자 지위, 세부 지위 구분, 직원 여부를 기준으로 입력 파라미터를 통해 확인할 수 있습니다. 비임금근로자는 지역 노동시장의 구조적 특성을 파악하는 데 중요한 집단으로, 경기 변동, 산업 구조 변화, 자영업 환경의 질적 변화 등을 분석하는 데 핵심 지표로 활용됩니다. 행정기관은 이 데이터를 바탕으로 지원정책의 성과 분석, 취약 지위 파악, 지역별 고용 안정성 평가 등 정책적 의사결정을 수행할 수 있으며, 연구자·민간 분야에서는 노동시장 불균형 분석, 지역경제 구조 연구, 비임금근로자 대상 서비스 및 정책 개발 등 다양한 활용이 가능합니다.
