summary_user: 한국남부발전이 내는 전력수급 급전속보를 거래일자별로 담으며, 금일·전일의 설비용량·공급능력·최대전력·공급예비력/예비율·운영예비력, 시간대별 수요와 총발전량, 정비지연·계획정비 같은 특기사항을 함께 제공한다. 에너지 분석가나 발전·전력시장 사업자가 '특정 날짜에 공급예비율이 얼마였고 그날 어떤 정비 이벤트가 있었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 SMP·발전량 등 다른 전력시장 데이터와는 거래일자(tradedt)를 기준으로 날짜를 맞춰 이어 쓴다.
description_portal: 본 API는 한국남부발전(주) 전력수급 급전속보 조회 서비스_GW 입니다.해당 서비스는 사용자가 원하는 조회 시작일부터 조회 종료일 날짜를 입력할 경우, 해당 일자에 해당하는 전력수급 급전속보 정보를 조회할 수 있습니다. 전력수급 급전속보에는 일자, 발전량, 최대량, 급전속보(시간, 일시, 대상, 세부내용 - 정비지연, 계획정비 등)의 내용이 포함되어 있습니다.해당 급전속보 조회 서비스를 통하여 실시간으로 전력시장의 이벤트를 추적할 수 있으며,발전량 및 SMP 등의 데이터와 연계하여 분석하는 기초자료로 활용할 수 있습니다.
team:
  dept: AI업무혁신부
services:
