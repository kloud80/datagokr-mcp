    name: 전력수급 급전속보 조회 서비스
    endpoint: https://apis.data.go.kr/B552520/GenFeedPwrSupply/getDataService
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: false
        example: '1'
        desc: 한 페이지 결과 수
      - name: strSdate
        required: true
        example: '20231130'
        desc: 조회 시작월
      - name: strEdate
        required: true
        example: '20231130'
