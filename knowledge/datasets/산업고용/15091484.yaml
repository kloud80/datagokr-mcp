description_portal: '원활한 수소산업 발전을 위하여 수소사업 규제자유특구 현황을 공개하여, 정부정책 및 민간을 지원하기 위한 데이터입니다.해당 데이터는 지역, 세부사업, 특례부여 현황, 대상, 특례 사유로 구성되어 있습니다.수소사업 규제자유특구 관련 통계 수집, 지역별 특화 전략 수립, 투자 유치 및 민간 참여 확대, 수소 관련 신사업 및 신기술 개발에 참고 및 활용 등 수소경제 활성화를 위한 다양한 정책적‧행정적 의사결정에 활용할 수 있습니다.※ 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.※  2025년은 수소 분야 규제자유특구 신규 지정 사례는 없습니다.- 데이터기준일 : 2025년 9월 16일'
