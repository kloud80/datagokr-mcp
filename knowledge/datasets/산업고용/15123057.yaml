description_portal: 이 데이터는 진폐증으로 입원 요양 중인 산재 근로자의 정서적 안정과 재활 의욕 고취를 위해 운영된 취미활동반의 지원 현황을 연도별로 집계한 통계입니다. 통계 항목은 해당 연도에 지원받은 의료기관 수와 실제로 운영된 취미활동반 수로 구성되어 있습니다. 취미활동반은 월평균 10명 이상의 진폐 입원 환자를 수용하는 의료기관이 관할 지사에 신고서를 제출하여 개설하며, 이 통계는 진폐 근로자를 위한 비의료적 재활 지원의 규모와 변화 추이를 파악하는 데 중요한 자료입니다.본 데이터는 진폐증 산재 근로자의 복지 및 재활 지원 정책의 실효성을 평가하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 연도별 의료기관 수와 취미활동반 수의 변화를 분석함으로써, 진폐 근로자의 정서적 재활 수요에 대한 공단의 지원 활동이 적절히 이루어지고 있는지 평가하고 개선 방안을 모색할 수 있습니다. 또한, 운영되는 활동반의 규모와 연도별 추이를 통해 진폐 근로자의 재활 의욕 고취를 위한 비급여 지원 사업의 지속 가능성 및 확대 방안을 논의하는 데 기여할 수 있다고 판단됩니다.
