description_portal: 노사발전재단에서 발간한 연구보고서 목록 데이터입니다.노사관계, 노동시장, 일터혁신 등 재단이 수행한 주요 연구과제의 카테고리, 제목, 게시일자 등의 정보를 포함하고 있습니다.ㅇ 정책 분석과 현장 실태 조사를 바탕으로 한 다양한 연구성과를 체계적으로 수록ㅇ 국민 누구나 연구보고서 자료를 열람하고 활용할 수 있도록 재단 홈페이지에서 1차 공개 중임ㅇ 정책 개발, 학술연구, 교육자료, 현장 적용 등 다양한 목적으로 활용 가능하도록 공공데이터로 개방 추진ㅇ 본 데이터는 재단의 연구역량 강화 및 정책 수립 지원을 위한 핵심 자료로서, 정기적이고 수시로 갱신할 예정ㅇ 이를 통해 노사관계와 노동정책 분야의 이해 증진 및 사회적 대화 활성화에 기여하고자 함
