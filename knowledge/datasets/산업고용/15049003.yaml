description_portal: 데이터는 업력, 업종, 기업형태, 창업자 연령별로 남성과 여성의 비율을 정량적으로 제시하고 있습니다. 업력은 1년부터 7년까지 구분되며 전반적으로 남성 비율이 높게 나타납니다. 업종은 농업, 제조업, 건설업 등 다양한 분야로 구성되어 있으며, 대부분 업종에서 남성 비율이 우세합니다. 다만 교육 서비스업, 수리 및 기타 개인 서비스업 등에서는 여성 비율이 높게 나타납니다. 기업형태별로는 법인에서 남성 비율이 더 높으며, 창업자 연령대는 20대 이하부터 60대 이상까지 구분되어 있습니다. 연령이 증가할수록 남성 비율이 다소 높아지는 경향이 나타납니다. 본 데이터는 성별에 따른 업력 분포, 업종 특성, 기업형태별 경향, 연령별 성향 분석에 활용할 수 있습니다.
