summary_user: 창업기업의 창업자 성별 비율을 업력(1~7년), 업종, 기업형태(법인·개인), 창업자 연령대별로 남성과 여성으로 나눠 담은 전국 단위 집계표이며, 1KB 남짓의 작은 CSV 파일 한 건이다. 정책 분석가나 연구자가 "여성 창업자 비율이 높은 업종은 어디이고, 업력이나 연령대에 따라 성별 구성이 어떻게 달라지는가"를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와 직접 결합할 수 없고, 업종명이나 구분명을 기준으로 같은 기관의 창업기업 통계와 나란히 비교하는 정도로 이어 쓴다.
limits: 구분별 비율만 담은 전국 집계라서 개별 기업이나 지역별 분석에는 쓸 수 없고, 사업자번호 같은 기업 식별 키도 없다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 업종명 같은 이름 매핑으로만 맞춰야 한다.
