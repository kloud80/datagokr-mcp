description_portal: 한국서부발전의 국내 연료전지사업 개발현황 정보입니다. 한국서부발전에서 추진하는 국내 연료전지사업 개발 현황 데이터는 분산형 친환경 전원 확대와 수소경제 기반 마련을 위해 진행되는 연료전지 프로젝트의 추진 상황을 종합적으로 보여주는 자료입니다. 이 데이터에는 사업별 설치위치, 용량, 총 사업비 및 지분율, 투자비용, 착공예정일, 준공예정일, 현단계 등이 포함됩니다. 현재 경상남도 거제시 및 충청남도 천안시, 전라북도 익산시, 경상북도 문경시,경기도 파주시 등에서 사업을 추진중에 있습니다.
