summary_user: "한국서부발전이 국내에서 추진하는 연료전지 발전사업을 사업 단위로 정리한 소규모 파일(csv 약 1KB)로, 사업별 위치·용량(MW)·총사업비와 지분율·투자비·착공/준공 예정일·현재 단계를 담는다. 수소·연료전지 분야 분석가나 지역 주민·사업자가 '서부발전이 어느 지역에서 몇 MW 규모 연료전지 사업을 어느 단계까지 진행했는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전설비 데이터(예: 태양광 발전사업 허가 표준데이터)와는 위치 주소나 사업명을 이름으로 맞춰 보는 방식으로만 이어 쓴다."
