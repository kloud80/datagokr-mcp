summary_user: 경상남도 지방산지관리위원회 심의를 거쳐 허가된 토석채취장을 건별로 담은 허가 원장 파일로, 소재지·지번, 용도, 면적(제곱미터), 채취 수량(세제곱미터), 현재 허가 시작일·종료일, 수허가자를 담는다. 특정 시군이나 필지 주변에 허가 중인 토석채취장이 있는지, 허가가 언제 끝나는지를 확인하려는 주민·사업자·국토 규제 분석가가 쓴다. 전역 조인 키나 코드 컬럼은 없어서 다른 데이터와 잇는 방법은 소재지·지번 문자열을 주소나 필지에 맞추는 것뿐이고, 그렇게 해서 산지·용도지역 같은 공간 규제 정보와 겹쳐 본다.
description_portal: 산지관리법 제25조 제1항에 따라 경상남도 지방산지관리위원회에서 그 타당성에 관하여 심의를 거쳐 토석채취허가를 득한 자료로써 토석채취장의 소재지, 지번, 용도, 면적, 수량, 허가일, 종료일, 수허가자의 정보를 포함하고 있는 자료입니다.
