summary_user: 서울시 자치구별 직장인구를 분기(기준 년분기 코드) 단위로 집계한 자료로, 총 직장인구와 남녀 인구, 10대부터 60대 이상까지 연령대별·성별 연령대별 인구 수를 담는다. 소상공인이나 상권 분석가가 '이 자치구에 낮 시간 직장인이 얼마나 있고 어떤 연령·성별이 많은가'를 따져 점포 입지나 업종을 고를 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 자치구 코드(SIGNGU_CD)나 자치구명으로 맞춰 같은 서울시 상권분석서비스의 다른 자치구 단위 자료와 이어 쓴다.
description_portal: 이 데이터는 서울시 자치구 단위의 상주인구 현황을 분기별로 제공하는 자료입니다. 전체 인구와 남성, 여성 인구 수를 구분하여 수록하고 있으며, 10대부터 60대 이상까지 연령대별 세부 인구 분포도 함께 포함되어 있습니다. 이를 통해 자치구별 인구 구조와 성별·연령별 비중을 파악할 수 있으며, 특정 시점의 인구 변화를 비교·분석할 수 있습니다. 본 데이터는 도시 계획, 지역 맞춤형 정책 수립, 생활SOC 인프라 배치, 상권 분석 및 행정 수요 예측 등 다양한 분야에서 기초 자료로 활용될 수 있는 공공데이터입니다.
