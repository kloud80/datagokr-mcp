summary_user: 경기도 시험검사정보관리시스템에서 쓰는 시약과 초자(실험기구)의 품목 정보(품명·규격·파트넘버·단가·제조사·적정재고)와 팀별 입출고 기록(입출고일자·입고량·출고량)을 건별로 담은 자료이며, 범위는 경기도 단위의 비공간 데이터다. 실험실 관리자나 예산 담당자가 특정 시약의 팀별 소모량과 적정재고 대비 보유 현황을 확인해 다음 해 구매량을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품명·시약초자코드(rgnt_gls_cd) 같은 이름·코드 매핑이나 같은 기관(경기도) 내부 코드로만 연결한다.
description_portal: 이 데이터는 경기도 시험검사정보관리시스템에서 사용되는 시약 및 초자(실험기구)의 재고 현황과 입출고 기록을 정리한 자료로, 실험실 물품의 관리 효율성과 정확성을 확보하기 위한 목적을 가지고 있습니다. 주요 항목은 시약초자코드, 구분(시약 또는 초자 및 기구 등), 품명, 단위, 규격, 파트넘버, 단가, 적정재고, 팀코드 및 팀명, 입출고일자, 입고량, 출고량, 입출고구분 등으로 구성되어 있습니다. 이 데이터는 실험실 운영의 투명성 확보, 시약 소모량 및 보유 현황 분석, 예산 집행 계획 수립, 시험검사 효율성 개선 등의 목적으로 활용될 수 있습니다. 또한 시약 및 초자의 정확한 입출고 내역을 파악함으로써, 중복 구매 방지와 적정 재고 유지 등 실험실 자산 관리에 효과적입니다.
