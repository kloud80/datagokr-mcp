summary_user: 한국동서발전 발전소의 2019년 이후 발전 실적을 연월·발전원·발전소·호기 단위로 담은 집계 데이터로, 설비용량·발전량·송전량(MWh), 발전·송전 열효율, 일수·운전 기준 이용률을 포함한다. 연구자나 분석가가 "동서발전의 특정 발전소 호기별 열효율과 이용률이 연도별로 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 발전량·전력시장 데이터와는 발전소명·발전원 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 한국동서발전 소속 발전소만 담으며 지역 단위가 없는 전국·비공간 자료라 지역별 분석에는 쓸 수 없다. 공통 조인 키가 없어 타 기관 데이터와 붙일 때 발전소 이름을 직접 맞춰야 한다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
