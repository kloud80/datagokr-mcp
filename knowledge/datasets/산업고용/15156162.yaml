description_portal: '평택시 할인가맹점 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 시민에게 다양한 지역 할인 혜택 정보를 제공하고, 소상공인과 지역상권 활성화를 지원하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 가맹점의 위치, 업종, 제공되는 할인 혜택 등을 손쉽게 확인할 수 있으며, 민간·연구기관은 지역 소비 패턴 분석, 복지·우대정책 연계 서비스 개발, 지도·플랫폼 기반 혜택 안내 서비스 구축 등 다양한 분야에서 데이터를 활용할 수 있습니다. 본 데이터에는 가맹점명, 주소, 업종, 할인 종류 및 조건  등의 주요 항목이 포함되어 있어 시민 편익 증진과 지역경제 활성화에 기여하는 정보를 제공합니다. 이러한 자료는 복지 정책 효율성 강화, 지역 상권 분석, 소상공인 지원 전략 수립, 민간 플랫폼 서비스와의 연계 등 공공·민간 영역에서 폭넓은 활용이 가능한 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
