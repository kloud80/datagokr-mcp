summary_user: 2023년 8월 기준 경상남도에 태양광 발전기를 둔 전력거래소 회원사를 회원사 한 곳당 한 행으로 담은 목록 파일로, 회원명·법인/개인 구분·대표자명·사업자번호가 들어 있다(발전기 미등록 회원사는 빠짐). 경남 지역 태양광 발전사업자가 전력시장 회원으로 누가 있는지, 특정 업체가 회원사인지 확인하려는 사업자나 분석가가 쓴다. 전역 조인 키는 없으며, 사업자번호나 회원명을 기준으로 태양광 발전사업 허가 원장 같은 다른 사업자 목록과 이름·번호를 맞춰 대조하는 방식으로만 이어 쓴다.
limits: 2023년 8월 한 시점의 현황이라 이후 가입·탈퇴는 반영되지 않고, 실시간 수급·발전량 정보는 담지 않는다. 표준 조인 키가 없어 다른 데이터와는 이름이나 사업자번호 매칭으로만 연결된다.
