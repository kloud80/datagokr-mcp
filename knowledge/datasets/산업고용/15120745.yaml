description_portal: '산재보험 패널조사 데이터는 산업재해를 경험한 근로자 및 그 가족에게 미치는 사회적·경제적 영향을 심층적으로 분석하기 위해 2013년부터 실시된 국가승인통계 자료입니다. 이 데이터는 재해 근로자의 요양 종결 이후 상황을 종합적으로 진단하고, 재해 근로자의 개인 특성, 재해 상황, 사회경제적 특성 등 광범위한 정보를 실제 면접조사와 공공 데이터베이스를 결합하여 수집·생산합니다. 이 자료는 산업재해와 공적 보험 제도의 역할에 대한 객관적인 논의와 정책적 대안 마련을 위한 핵심 근거를 제공합니다.본 데이터는 공공 부문뿐만 아니라 민간 및 학술 분야에서 매우 광범위하게 활용될 수 있습니다. 정책 연구자는 이 패널 데이터를 활용하여 시간의 흐름에 따른 산재 근로자의 노동 시장 재진입, 소득 변화, 삶의 질 변화 등을 추적 분석할 수 있습니다. 이를 통해 사회 안전망 서비스의 장기적인 효과를 평가하고, 재활 서비스 및 복지 지원 정책의 개선 방향을 제시하는 데 결정적인 역할을 합니다. 학술 연구자는 이 데이터를 활용하여 재해의 원인 및 결과에 대한 인과관계를 규명하고, 사회 안전망으로서 해당 제도가 지니는 사회적 의미를 탐구하는 데 활용함으로써 국민 경제 발전에 이바지할 수 있을 것으로 판단됩니다.※ 산재보험 패널조사 홈페이지 URL : www.pswci.or.kr'
