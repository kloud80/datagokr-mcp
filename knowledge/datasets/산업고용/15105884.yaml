description_portal: 에너지총조사 데이터는 국가 에너지정책 및 온실가스 저감정책 수립을 위한 기초자료로서, 수송부문 중 개인이 소유하고 있는 관자가용 차량의 에너지 소비행태를 상세히 조사한 결과를 제공합니다. 제공 항목은 차량의 차종, 배기량, 사용연료, 출고연월, 연비, 주행거리 등의 기술적 정보와 차량의 주 이용 목적, 연간 및 일평균 주행거리, 주유 행태, 시간대별 운행패턴 등 에너지 소비 행태를 분석할 수 있는 자료를 포함하고 있습니다.또한 소득, 직업, 연령 등 사회경제적 정보까지 결합하여 심층 분석이 가능합니다. 본 데이터를 통해 정부와 연구기관은 정확한 에너지 소비행태를 파악하여 효율적인 에너지정책 및 온실가스 저감 정책을 설계하고 효과적인 정책 대응 전략을 마련할 수 있습니다.
