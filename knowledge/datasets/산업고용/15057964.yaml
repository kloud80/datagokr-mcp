summary_user: 경기도 장애인일자리사업 참여 인원을 기준연도·시군·성별로 나눠 총계와 장애유형별 인원으로 집계한 자료다. 지체·시각·청각·지적·자폐성 등 유형과 특수교육대상자까지 포함한다. 분석가나 정책 담당자가 "우리 시군의 장애인일자리 참여자는 어떤 장애유형이 많고, 연도별로 어떻게 달라졌나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명·연도를 이름·코드 매핑해 경기도 기관의 다른 시군별 고용·복지 통계와 맞춰 붙인다.
description_portal: 이 데이터는 장애인일자리사업에 참여한 인원을 장애 유형별로 집계한 현황 자료로, 시군별·성별·연도별 일자리사업 참여자 분포를 제공합니다. 주요 항목에는 기준년도, 시군명, 성별, 총계(명), 지체·뇌병변·시각·청각·언어·안면·신장·심장·간·호흡기·장루요루·뇌전증 등 신체적 장애 유형별 인원과 지적·정신·자폐성 장애, 특수교육대상자 현황까지 포함되어 있습니다. 이를 통해 장애인 고용 현황을 지역별, 연령별, 성별로 분석할 수 있으며, 장애유형별 맞춤형 고용 정책 및 직업재활 지원 전략 수립에 활용될 수 있습니다. 또한 연도별 추이를 통해 고용 정책 효과를 검증하거나 향후 지원 수요를 예측하는 데에도 기여할 수 있습니다.
