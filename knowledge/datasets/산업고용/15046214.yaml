summary_user: 한국장애인고용공단이 구직장애인에게 실시한 직업기능탐색검사 결과를 검사 1건 단위로 담은 전국 범위 파일로, 검사일자·장애유형과 자립·운동·언어·작업·인지·사회 기능별 원점수, 퍼센타일, 환산점수, Z·T 점수, 고용수준, 식사하기·이동하기·주의집중 등 세부 문항 점수를 포함한다. 분석가가 장애유형별로 어떤 기능 영역 점수가 낮고 일반고용·보호고용·복지서비스 중 어느 고용수준으로 판정되는 비율이 높은지 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 이름 매칭이나 같은 기관 데이터와의 비교 수준으로만 이어 쓴다.
description_portal: '한국장애인고용공단에서 실시하는 직업능력평가 도구 중 직업기능탐색검사의 평가결과에 대한 데이터로 검사일자, 소요시간, 장애유형, 기능별 점수 등에 대한 정보를 제공합니다.* 직업기능탐색검사: 고용서비스 초기단계에서 적합한 서비스 영역을 탐색하기 위한 검사로 구직장애인이 고용서비스를 받는 초기단계에서 적합한 서비스를 파악하기 위한 검사입니다. 고용서비스는 일반고용(일반사업체 취업), 보호고용(근로사업장, 보호작업장 등), 복지서비스(장애인 생활시설, 자립생활센터 등)로 구분합니다.'
