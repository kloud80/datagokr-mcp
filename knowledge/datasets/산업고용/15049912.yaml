description_portal: 한국가스공사의 연간 용수 사용량 데이터 입니다.용수 사용현황 관리 및 수자원 효율화 정책 수립, 환경경영 성과 분석, 용수 비용 관리를 목적으로 수집되었습니다. 데이터 구성항목은 2014년부터 2020년까지의 연도별 해수, 상수도, 지하수 사용량(㎥ 단위)으로 이루어져 있어 용수원별 사용현황을 종합적으로 파악할 수 있습니다. 본 데이터를 활용하면 연도별 용수 사용 추이 분석, 용수원별 사용 비중 파악, 용수 사용 효율성 평가, 절감 목표 대비 실적 평가, 용수 원단위 분석이 가능합니다. 또한 용수 절감 계획 수립, 대체 수자원 활용 방안 검토, 용수 비용 관리, 물 재이용 확대 방안 도출에 활용됩니다. ESG 경영성과 보고, 환경경영시스템 운영, 수자원 관리 정책 수립 등에 기초자료로 활용되어 수자원의 효율적 이용과 지속가능한 환경보전에 기여합니다.
