description_portal: 한국광해광업공단은 석탄산업의 생산 기반 유지와 연탄의 안정적인 공급을 위해 석·연탄산업 지원 사업을 실시하고 있으며 이를 통해 자원안보와 서민생활보호 및 폐광지역 고용창출 등에 이바지하고 있습니다. 무연탄 소비현황을 성수기, 비수기, 월동기 등으로 구분하여 정보 제공합니다. 또한, 무연탄 소비 데이터를 월별, 지역별, 부분별로 상세히 분류하여 제공함으로써 다양한 분석과 정책 수립에 활용할 수 있는 기초 자료를 제공합니다. 이러한 정보는 에너지 수급 안정성 확보와 지역별 수요 예측, 그리고 연탄 공급 계획 수립에 중요한 역할을 합니다
