description_portal: '성북구 관내에서 TV홈쇼핑, 인터넷, 카탈로그, 신문잡지 등 다양한 통신판매 수단을 활용하여 가구, 가전, 식품, 의류 등을 판매하는 업소의 인허가 정보를 제공합니다. 본 데이터에는 사업장의 기본 정보와 함께 위치 안내를 위한 좌표가 포함되어 있으며, 좌표는 중부원점TM(EPSG:5174) 좌표계 기준으로 제공됩니다. 위경도 좌표는 별도로 제공하지 않으며, 공간 분석이나 지도 매핑 시 해당 좌표계를 활용해야 합니다. 또한, 데이터는 최신성을 유지하기 위해 매일 업데이트되는 것이 아니라 3일 전 기준의 자료를 제공하므로, 실제 영업 현황과는 일부 차이가 있을 수 있습니다. 이 데이터는 지역 내 통신판매업 현황을 파악하고 행정업무, 정책 수립, 연구 및 민간 활용 등 다양한 분야에서 참고자료로 활용될 수 있습니다.* 좌표안내 :  중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
