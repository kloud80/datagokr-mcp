description_portal: 연도별 KS는 표준 제·개정이 이루어진 연도에 따라 구분되는 체계를 말한다. KS는 기술 발전, 산업 환경 변화, 안전 요구 등 다양한 요인을 반영해 주기적으로 개정된다. 따라서 연도별 체계는 표준의 최신성을 확보하고 적용 시점에 따른 유효성을 판단하는 기준이 된다. 이를 통해 현행 산업계가 활용할 수 있는 적합한 표준과 과거 이력을 구분해 추적 관리가 가능해진다.한국산업표준 기본현황 및 표준활동에 대한 통계정보로 연도별 한국산업표준(KS) 현황에 관한 연도,제정,개정,확인,폐지,보유표준수 항목으로 분류
