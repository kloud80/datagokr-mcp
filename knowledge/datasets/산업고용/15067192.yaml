summary_user: 대전광역시 동구에 있는 세탁업소를 한 곳씩 담은 업소 목록 파일로, 업소명·도로명 주소·우편번호·전화번호와 데이터기준일을 담는다(CSV 약 9KB). 주민이 동구에서 가까운 세탁소를 찾거나, 창업을 검토하는 사업자가 동구 안 세탁업소의 분포를 살펴보는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명 주소·우편번호나 업소명 매칭으로만 잇는다. LOCALDATA 세탁업 인허가 원장, 소상공인 상가업소 정보와 이렇게 대조하는 방식이 현실적이다.
limits: 사업자번호·좌표·인허가일·영업상태 같은 컬럼이 없어 폐업 여부나 개업 시점은 이 파일만으로 알 수 없다. 범위가 동구 한 곳이라 대전 전체나 다른 구와 비교하려면 별도 데이터가 필요하다.
