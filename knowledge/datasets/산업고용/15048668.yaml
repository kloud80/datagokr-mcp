summary_user: 광진구 관내 공공시설에 설치된 태양광 발전 설비의 발전량을 시설별·연월별로 담은 행정 파일(csv)로, 시설명·연·월·발전량(kWh)으로 구성된다. 구청 에너지 담당자나 분석가가 "어느 공공시설 태양광이 어느 달에 얼마나 발전했고 계절별 차이는 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없어, 다른 데이터와는 시설명 매핑이나 연·월 기준으로만 맞춰 붙인다.
