summary_user: 부산광역시 수영구에 있는 건축사 설계사무소를 사무소별 한 행으로 담은 목록 파일(csv, 약 7KB)로, 사무소명·도로명주소·설계자 전화번호를 담는다. 구청 건축 담당자나 주민이 건축허가·착공·사용승인 건에서 설계자나 감리자로 나온 수영구 건축사 사무소에 연락할 때, 그 주소와 전화번호를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소명이나 도로명주소로 맞춰 이어야 하며, 지방행정 인허가(LOCALDATA) 건축사 업종 자료와 대조하는 정도로 연결한다.
description_portal: 건축사설계사무소에 대한 정보로 건축사 사무소명, 소재지(도로명주소), 설계자 전화번호 등의 정보를 제공여 추후 건축허가, 착공, 사용승인 시 문제가 있을시 우리 구 건축사에게 바로 연락할수 있도로 제공합니다. 또한  공공데이터 목록 등재함에 따라 각 구에 있는 건축허가, 착공, 사용승인시 우리 구 건축사가 설계사, 감리자일 경우 보다 빠르게 연락을 하여 추후 안전사고, 설계미비 등 관련 이유를 연락을 할 떄 보다 정확한 주소와 연락처를 통하여 근처 주민분들의 안전을 책임질수 있도록 할수 있을것입니다.
