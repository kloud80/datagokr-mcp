description_portal: '- 전라남도 수출정보망 홈페이지에 게재된 전라남도 상품에 대한 정보(상품명, 상품설명 등)를 국문, 영문으로 조회하실 수 있습니디.- 전라남도 수출정보망의 상품관은 전라남도 지역의 우수한 농수산물과 가공식품을 소개하고, 이를 국내외 바이어와 소비자에게 연결하는 플랫폼입니다. 이곳에서는 전라남도 농업인의 제품을 손쉽게 찾아보고, 수출 상담 및 구매를 진행할 수 있습니다.- 전라남도 수출정보망 상품관은 지역 농업인의 제품을 국내외 시장에 알리고, 수출 기회를 확대하는 데 중요한 역할을 하고 있습니다. 수출을 희망하는 바이어나 소비자에게 유용한 정보와 서비스를 제공하므로, 관심 있는 분들의 적극적인 활용을 권장합니다.'
