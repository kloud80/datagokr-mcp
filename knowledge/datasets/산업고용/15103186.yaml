description_portal: '주로 각 사업장 또는 공정별로 구분된 고압 전력 소비량이 월 단위로 기록되어 있으며, 이를 통해 연간 총 사용량은 물론, 계절별 소비 추세, 특정 시설의 에너지 집중 사용 시기 등을 파악할 수 있습니다. 해당 자료는 에너지 비용 관리뿐 아니라, 탄소중립 실현을 위한 간접 탄소배출량 산정에도 기초 데이터로 활용될 수 있습니다. 또한, 효율적인 에너지 사용 계획 수립, 전력 피크 대응 전략 마련, 정부 보고(예: 공공기관 에너지 목표관리제 대응), 내부 ESG 경영 평가 등에 활용 가능성이 높습니다. 고압 전력을 사용하는 주요 공정이나 시설의 에너지 집약도 평가, 절감 목표 설정 등의 참고 자료로도 유용합니다.'
