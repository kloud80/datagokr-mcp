summary_user: 울산광역시 남구 관내 담배소매업소를 업소 한 곳씩 담은 파일로, 상호·소매인 구분·지번 및 도로명 주소를 담는다. 남구에서 어느 동네에 담배 판매점이 몰려 있는지, 특정 상가 주변에 이미 지정된 소매인이 있는지를 확인하려는 예비 창업자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 맞춰 붙여야 하며, 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 기준으로 대조해 쓴다.
description_portal: 울산광역시 남구의 담배소매업 정보에 대한 데이터로 상호, 소매인구분, 업소지번주소 등의 항목을 포함하고 있으며, 관내 담배소매업체의 지정 현황, 운영 정보, 입지 분포 등을 파악할 수 있는 기초 정보를 제공합니다. 이 데이터는 담배 판매업소의 지정 관리 현황을 기록하고, 지역별 소매업체 수요·공급 분석, 상권 현황 파악 등의 기초자료로 활용될 수 있습니다. 또한 업소 위치 정보를 활용한 지리적 시각화, 연계 분석 등을 통해 정책 수립 및 민원 대응에도 기여할 수 있습니다.데이터 추출일은 2026년 7월 9일입니다.
