description_portal: '국내 연안 해운 부문의 선박 유형별 연료 사용량과 에너지 소비량을 연료별로 정리한 통계 자료로, 연안여객선, 연안화물선 및 전체 선박 합산 기준의 세 가지 시트로 구성되어 있습니다.형식: CSV내용 요약■ 연안여객선 연료별 에너지 소비량: 여객선에서 사용한 경유, 중유 등의 연료 사용량(㎘)과 해당 연료의 에너지 소비량(TJ)을 집계한 데이터■ 연안화물선 연료별 에너지 소비량: 화물선 운항 시 소비된 연료 종류별 사용량 및 이에 따른 에너지 소비량 정보를 포함■ 연안여객·화물선 연료별 에너지 소비량: 여객선과 화물선을 합산한 연료별 총 사용량과 에너지 소비량을 정리한 통합 시트각 시트는 아래의 공통 컬럼 구조를 따릅니다:구분: 연료 종류 구분(예: 경유(Diesel), 경질중유(B-A), 중질유(B-C), 액화천연가스(LNG), 기타 등)연료 사용량(㎘): 해당 연료의 실제 사용 부피(Liter 기준 천 단위)에너지 소비량(TJ): 사용 연료에 해당하는 총 에너지 소비량(Terajoule 기준)활용 예제■ 연안선박의 연료 소비 현황을 기반으로 한 저탄소 해운정책 수립, 연료세 부과 기준 설정 등 정부 규제자료로 활용■ 선박유형별 연료 소비 특성을 분석하여 고효율 선박 전환 및 연료 다변화(예: LNG, 바이오연료) 정책 기초자료로 사용■ 항만별 연료 수급 계획 수립, 선박 온실가스(GHG) 배출량 추정, 지역별 미세먼지 기여도 산정 등에 활용 가능'
