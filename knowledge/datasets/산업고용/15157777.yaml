summary_user: 한국수력원자력이 운영하는 9개 수력발전소(안흥·춘천·의암·화천·청평·섬진강·보성강·팔당·괴산)의 현재 출력(MW)을 발전소별로 측정 시각과 함께 담는 실시간 조회 API다. 분석가나 에너지 관심 이용자가 '지금 팔당·청평 수력발전소는 몇 MW를 내고 있나'처럼 오늘의 수력 발전 상황을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 발전소 코드(code)의 이름 매핑으로 전력거래소 수급·발전원별 발전량 등 다른 발전소 데이터와 맞춰 쓴다.
