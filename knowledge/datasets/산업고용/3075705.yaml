summary_user: 부산 해운대구에서 고압가스법에 따라 허가·신고된 고압가스 저장소를 시설 한 곳당 한 행으로 담은 목록으로, 상호·업종·소재지·연락처가 들어 있으며 포털 설명상 총 5개소(457바이트 CSV)다. 구민이나 안전·방재 담당자가 '우리 동네 어디에 고압가스 저장탱크가 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 에너지 업종 인허가 원장(LOCALDATA 등)과는 상호·소재지 주소를 문자열로 맞춰 이어 쓴다.
description_portal: 고압가스의 종류 및 범위는 아래 내용과 같습니다.1. 상용(常用)의 온도에서 압력(게이지압력을 말한다. 이하 같다)이 1메가파스칼 이상이 되는 압축가스로서 실제로 그 압력이 1메가파스칼 이상이 되는 것 또는 섭씨 35도의 온도에서 압력이 1메가파스칼 이상이 되는 압축가스(아세틸렌가스는 제외한다)2. 섭씨 15도의 온도에서 압력이 0파스칼을 초과하는 아세틸렌가스3. 상용의 온도에서 압력이 0.2메가파스칼 이상이 되는 액화가스로서 실제로 그 압력이 0.2메가파스칼 이상이 되는 것 또는 압력이 0.2메가파스칼이 되는 경우의 온도가 섭씨 35도 이하인 액화가스4. 섭씨 35도의 온도에서 압력이 0파스칼을 초과하는 액화가스 중 액화시안화수소ㆍ액화브롬화메탄 및 액화산화에틸렌가스고압가스 저장소란 고압가스법 제3조에 따라 산업통상자원부령으로 정하는 일정량 이상의 고압가스를 용기나 저장탱크로 저장하는 일정한 장소를 말합니다.고압가스법 제4조에 따라 허가 및 신고된 시설입니다.부산광역시 해운대구 저장소는 총 5개소 이며 부산그린에너지(주), 부산교통공사 해운대지하철역, 인제대학교 해운대백병원, (주)벡스코, (주)SK텔레코 부산데이터 센타 입니다.자세한 상호, 소재지, 연락처는 파일과 같습니다.
