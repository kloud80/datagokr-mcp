summary_user: 충청남도 계룡시가 담배소매인으로 지정한 영업소를 한 곳씩 담은 건별 목록으로, 업소명·도로명주소·지정일자를 제공한다. 계룡시에서 담배를 파는 가게가 어디에 얼마나 있는지, 특정 업소가 언제 소매인으로 지정됐는지 확인하려는 주민·창업 예정자·분석가가 쓴다. 실측 컬럼에 사업자번호나 행정코드 같은 공통 조인 키가 없어서, 다른 데이터와는 업소명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다. 예를 들어 상가업소 정보나 다른 업종 인허가(LOCALDATA) 데이터와 연결할 때 이 방식을 쓴다.
description_portal: 충청남도 계룡시의 '담배소매인지정현황' 데이터는 담배사업법 및 관련 조례에 따라 계룡시로부터 담배 소매인으로 정식 지정받은 영업소들의 정보를 정리한 자료입니다. 이 데이터는 판매 허가를 받은 업소명을 제공합니다. 또한, 해당 업소의 정확한 위치를 알려주는 업소도로명주소가 포함되어 있으며, 담배 판매 허가가 공식적으로 지정된 날짜인 지정일자 정보까지 기록되어 있습니다. 이 자료는 계룡시의 담배 판매 시설 분포를 파악하고, 담배 판매 관련 규제 및 관리 업무를 수행하는 데 필요한 핵심 행정 자료 역할을 수행합니다.
