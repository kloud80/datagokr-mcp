summary_user: 한국가스기술공사 전사 시스템에서 쓰는 공통 코드체계를 코드 한 건당 한 행으로 담은 CSV 파일(약 24KB)로, 코드 식별자·상위코드·코드명·사용여부·분류코드와 생성·수정 이력을 포함한다. 이 기관의 다른 공개 데이터에 나오는 코드값이 무슨 뜻인지, 어떤 상위 분류에 속하고 지금도 쓰이는지 확인하려는 분석가가 쓴다. 전역 조인 키는 없고, 같은 기관 데이터의 코드값을 개별코드 식별자(CODE_ID)에 맞추거나 상위코드로 계층을 따라가는 방식으로만 연결한다.
description_portal: 이 데이터는 한국가스기술공사 전사 시스템에서 사용하는 공통 코드체계를 정리한 자료로 각 코드의 고유식별값과 상위코드, 코드명, 사용여부, 분류코드 등을 포함하고 있다. CODE_ID는 개별 코드의 식별자이고 UPR_CODE_ID는 상위코드를 의미한다. CODE_ID_NM은 코드명이며 USE_AT은 사용여부이다. CL_CODE는 분류코드이며 CRTE_USER_ID·CRTE_DTTM은 생성자 및 생성일시를, UPDT_USER_ID·UPDT_DTTM은 수정자 및 수정일시를 각각 나타낸다. 업무 전반의 통일된 코드정보 제공 및 시스템 간 연계에 활용된다.
