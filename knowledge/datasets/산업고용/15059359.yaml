summary_user: 경기도 내 태양광 등 전기사업 업체를 사업장 한 곳당 한 행으로 담는 인허가 원장으로, 인허가·취소·폐업일자, 영업상태, 설비용량, 공급전압, 원동력 종류, 주소와 WGS84 위경도를 포함한다. 분석가나 사업자가 "우리 시군에 영업 중인 태양광 전기사업장이 몇 곳이고 어디에 몰려 있나" 같은 지역별 분포·운영 상태 질문에 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·사업장명 매칭, 위경도 좌표로 다른 신재생·발전소 원장과 이어 쓴다.
description_portal: '이 데이터는 경기도 내 태양광 전기사업 업체의 인허가 및 운영 현황을 기록한 자료를 제공합니다. 주요 항목에는 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 소재지 주소, 우편번호, WGS84 위경도 좌표, 전화번호, 면적, 업태구분명, 원동력 종류(예: 태양광), 주파수 값, 전기사업 허가 조건 등이 포함됩니다. 이를 통해 지역별 전기사업체 분포와 운영 상태를 파악할 수 있으며, 재생에너지 기반 전기사업 현황을 확인할 수 있습니다. 이 데이터는 전력 인프라 관리, 에너지 정책 수립, 신재생에너지 보급 현황 분석, 지역별 전력 수급 연구 등 다양한 행정 및 연구 분야에서 활용할 수 있습니다.'
