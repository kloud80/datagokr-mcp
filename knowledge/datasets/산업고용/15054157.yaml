summary_user: 기준일 현재 유효한 녹색기술제품 확인 목록을 제품 한 건씩 담은 전국 단위 파일로, 제품명·신청기관명·발급부처·확인번호·확인일자·확인만료일을 포함한다. 조달·투자 담당자나 분석가가 '이 기업이 녹색기술제품 확인을 받았는지, 확인이 언제 만료되는지'를 확인하는 데 쓴다. 사업자번호(bizno)가 조인 키로 실측되어 있어 같은 키를 가진 기업 인증·지원사업·재무 데이터와 기업 단위로 이어 쓴다.
description_portal: 확인받은 녹색기술제품 중 기준일 현재 유효한 목록들이며 이 데이터를 구성하는 주요 정보는 순번, 제품명, 신청기관명, 발급부처, 확인번호, 확인일자, 확인만료일자로 이루어져 있습니다. 본 데이터는 환경친화적인 기술과 제품을 발굴하고 지원하기 위한 중요한 자료로 활용될 수 있으며, 기업의 녹색기술 인증 현황을 파악하는 데 유용합니다. 특히, 이 정보는 해당 기업들이 인증 받은 기술 제품을 홍보하거나 새로운 제품 개발 시 필요한 기초 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 순번(숫자형), 제품명(문자형), 신청기관명(문자형), 발급부처(문자형), 확인번호(문자형), 확인일자(날짜형), 확인만료일(날짜형)로 구성되어 있습니다. 이와 같은 상세한 정보는 각 녹색기술 제품의 인증 현황을 제대로 이해하고 필요한 필요한 정보를 제공하기 위한 기반으로 활용될 수 있습니다.
