description_portal: 본 데이터는 국내 열수송관 주변에서 이루어지는 굴착공사의 신고 현황과 이에 대한 집단에너지 사업자의 처리 내역을 제공합니다. 열수송관은 대규모 지역에 난방 및 온수를 공급하는 핵심 에너지 기반 시설로, 굴착공사 중 파손될 경우 심각한 안전사고(폭발, 누수 등)와 대규모 에너지 공급 중단으로 이어질 수 있습니다.이 데이터는 굴착공사로부터 지하에 매설된 집단에너지 열수송관의 파손사고를 예방하기 위해 집단에너지 사업자와 굴착공사정보(집단에너지사업자에게)와 굴착지역 인근 열수송관 매설여부(굴착공사자에게)를 제공, 이에 대한 처리 과정을 투명하게 공개함으로써, 관련 기관은 안전 관리의 효율성을 높이고, 사업자는 공사 시 발생할 수 있는 위험을 최소화하며, 국민들은 안전한 에너지 공급을 받을 수 있도록 기여합니다.
