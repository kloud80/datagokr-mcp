summary_user: 한국수력원자력이 운영하는 원자력발전소의 본부별(고리·한빛·월성·한울·새울) 중저준위 방사성폐기물 발생 현황을 XML로 제공하는 API이며, 범위는 전국·비공간 자료다. 연구자나 정책 분석가가 "어느 발전본부에서 중저준위 방사성폐기물이 얼마나 발생하고 있는가"를 모니터링하고 본부 간 비교하는 데 쓴다. 실측 응답 필드에서 다른 데이터와 맞출 전역 조인 키를 찾지 못해, 발전본부 이름 매핑이나 같은 기관(한국수력원자력·원자력환경공단 계열) 데이터와 이름 기준으로만 이어 쓸 수 있다.
description_portal: “방사성폐기물 발생량” API는 한국수력원자력㈜이 제공하는 공공데이터 서비스입니다. 이 API는 한국수력원자력에서 운영 중인 원자력발전소의 본부별(고리원자력본부, 한빛원자력본부, 월성원자력본부, 한울원자력본부, 새울원자력본부) 중저준위 방사성폐기물 현황 자료를 XML 형식으로 제공합니다. 이 API 서비스를 활용하여 한국수력원자력 각 발전본부의 방사성폐기물 발생량 데이터를 모니터링하고 분석할 수 있으며 그 결과를 방사성폐기물 관리, 정책 개발, 연구, 대국민 서비스 등 다양한 분야에서 활용할 수 있습니다. 개발계정 기준으로  10,000회 호출이 가능합니다. 운영계정은 활용 사례 등록을 통해 트래픽 증가가 가능합니다.
team:
