description_portal: 이 데이터는 합성데이터로써 수시(1회성) 제공됩니다.임직원 교육 이수 현황은 한국중부발전(주) 본사 임직원들의 교육이수시간을 정리한 자료입니다.제공항목은 "이수자", "교육이수시간", "부서명", "교육시작일", "교육종료일"으로 이루어져 있으며, 본사 임직원 중 교육을 받은 이수자의 교육이수시간과 교육 기간 정보 제공합니다."교육이수시간"의 단위는 "시간"입니다. "부서명"의 단위는 "처"입니다."이수자"는 개인정보 및 민감정보에 속함으로써 식별자로 대체하여 재식별 불가능한 정보로 대체되었습니다.이 데이터는 한국중부발전(주)의 본사 임직원들 중 교육 받은 이수자의 최소/최대 교육 이수시간, 부서별 평균 교육이수시간, 집중 교육수료 기간 등을 파악하는데 활용할 수 있습니다.
