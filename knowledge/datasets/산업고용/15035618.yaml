summary_user: 서울특별시 중랑구 안 담배소매업소의 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·휴업기간·지번/도로명 주소·좌표·전화번호·사업장명이 들어 있다. 상권 분석가나 담배소매점 창업을 검토하는 사업자가 '중랑구에서 지금 영업 중인 담배소매점이 어디에 얼마나 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 좌표(X, Y) 기반 공간 결합으로 잇고, 같은 LOCALDATA 인허가 원천의 타 업종·타 자치구 자료와는 관리번호(MGTNO) 체계와 개방자치단체코드(OPNSFTEAMCODE)로 맞춰 쓴다.
description_portal: 서울특별시 중랑구의 담배 소매업 인허가정보를 제공합니다. 인허가일자, 영업상태코드, 영업상태명, 폐업 시 폐업일자, 휴업 시 휴업시작과 종료일자, 주소, 좌표정보, 전화번호, 사업장 등이 있습니다. 중랑구 담배소매인 현황 자료는 중랑구 내에 위치한 담배 소매업자들에 대한 정보를 담고 있습니다. 이 데이터는 담배소매점의 분포와 영업현황을 파악하는 데에 활용이 되며, 관련 사업 추진 시 상권 분석 또는 정책 수립 등 다양한 분야에서 사용하실 수 있습니다. 자세한 내용은 링크를 클릭하여 이용에 참고하여 주시기 바랍니다. 감사합니다.
