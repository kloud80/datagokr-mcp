summary_user: 근로복지공단 업무상질병판정위원회의 판정 결과를 질병 구분(뇌심혈관질환, 근골격계질환, 직업성 암·정신질환 등 기타질병)별로 판정 건수, 인정 건수, 인정률로 묶은 전국 단위 집계 파일입니다. 노무사, 연구자, 산재 신청을 앞둔 근로자가 '근골격계질환이나 정신질환으로 산재를 신청하면 업무상 질병으로 인정되는 비율이 어느 정도인가'를 확인하는 데 씁니다. 전역 조인 키가 없어 다른 산재 통계와는 질병 구분 이름을 맞추거나 같은 기관(근로복지공단)의 자료끼리 대조하는 방식으로만 이어 씁니다.
description_portal: '- 근로복지공단 업무상질병판정위원회 질병별 판정현황 데이터입니다.- 질병 구분별[뇌심혈관질환, 근골격계질환, 기타질병(직업성 암, 정신질환, 세균성질환, 간질환 등)] 산재보험 업무상질병 판정건, 인정건, 인정률 데이터를 제공합니다. ※ 인정률 = 인정건 / 판정건 * 100- 본 자료는 2020. 1. 1.~2025. 12. 31. 기간의 데이터를 제공하며, 1년에 한번 갱신됩니다. 과거자료는 근로복지공단 누리집 > 정보공개 > 사전정보공표(https://www.comwel.or.kr/comwel/info/docu.jsp)에서 확인하실 수 있습니다.'
