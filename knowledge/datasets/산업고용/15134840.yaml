summary_user: 골재자원조사에서 시추한 공마다 시추일련번호별로 심도 구간의 시작·종료 깊이(미터)와 그 구간의 지층·암종을 나타내는 패턴코드를 담은 시추주상도 원천 자료이며, 전국 범위의 비공간 CSV 파일(약 24만 바이트)로 제공된다. 골재 개발 사업자나 지질 분석가가 특정 시추공에서 어느 깊이에 어떤 암층·퇴적층이 분포하는지 확인해 골재자원 활용 가능성을 판단하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키는 없어, 같은 골재자원조사의 시추 위치·조사 자료와 시추일련번호를 이름·코드 매핑으로 맞춰 연결해야 한다.
description_portal: 골재자원조사의 결과 중 시추 주상도의 내용으로 시추 시 수집된 정보를 바탕으로 시추 일련번호에 따라 구간의 시작과 종료를 수치로 표시시추조사 결과는 지표지질조사와 같은 다회성 조사가 용이하지 않고, 비용과 시간이 많이 듬, 따라서 조사시 확보된 결과는 조사지 주변의 기반암 및 퇴적층의 분포특성 파악에 중요한 자료임, 시추주상도는 시추조사결과를 제시하는 기본적인 방법 중 하나임, 회수된 코어를 조사하여 심도에 따라 관찰되는 암종, 지질구조, 풍화대 분포 및 암석 강도에 따른 분류 등 많은 정보를 자세하게 기록한 결과도로 골재자원으로의 활용여부 판단에 중요함
