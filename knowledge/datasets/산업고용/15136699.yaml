description_portal: 이 데이터는 한국남부발전 남제주 발전소에서 사용된 연료 사용량을 일자별로 기록한 자료입니다. 발전소별 플랜트와 호기, 발전원 정보와 함께 부생연료유, 바이오중유, 경유, 실내 등유, LNG 등 다양한 연료의 사용량(L, kg 단위)을 포함하고 있습니다. 이를 통해 화석연료와 바이오 연료 사용 추이를 비교할 수 있으며, 친환경 연료의 활용 확대 여부를 확인할 수 있습니다. 또한 연료 사용 패턴을 분석하여 발전 효율성을 평가하거나, 탄소배출량 산정, 친환경 에너지 전환 전략 수립 등에 기초자료로 활용할 수 있습니다. 이 자료는 발전소 운영의 투명성을 높이고, 에너지 정책 및 연구 활동에도 유용하게 쓰일 수 있습니다.
