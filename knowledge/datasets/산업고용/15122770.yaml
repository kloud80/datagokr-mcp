summary_user: 공공구매종합정보망(smpp.go.kr)의 기술개발제품 시범구매제도 공고 목록을 공고 1건당 1행으로 담은 CSV 파일(약 7.6KB)이며, 번호·제목·담당 부서·등록일시만 들어 있다. 기술개발제품을 가진 중소기업·창업자가 '공공기관 시범구매 대상 선정 공고가 언제 어느 부서에서 나왔나'를 확인하거나, 분석가가 시범구매 공고 이력을 시점별로 훑는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지원사업 공고나 공공구매 인증 데이터와는 공고 제목·부서명 같은 이름 매칭으로만 이어 쓴다.
