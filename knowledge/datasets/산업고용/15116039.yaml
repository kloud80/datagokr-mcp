summary_user: 서울특별시 중구의 대형마트·백화점·쇼핑센터·복합쇼핑몰 등 대규모점포를 점포(관리번호)별 한 행으로 담은 인허가 원천 자료로, 인허가일·영업상태·폐업일·소재지·업태·면적·좌표(중부원점TM)를 포함한다. 대규모점포 등록을 준비하는 사업자나 전통시장 상인이 중구 어디에 어떤 업태의 대형 점포가 영업 중이거나 폐업했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·상호 이름 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결하며, 상가업소 원장이나 전국 대규모점포 표준데이터와 주소 기준으로 대조하는 식으로 이어 쓴다.
description_portal: '서울특별시 중구의 대형마트, 백화점, 쇼핑센터,복합쇼핑몰 등 다수의 사업자로부터 납품받아 판매하는 업소 정보입니다. 데이터는 각 대규모점포에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 대규모점포 등록을 희망하는 예비 사업자에게는 중구 지역의 유통산업 환경 분석 및 상권별 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민 및 전통시장 상인들에게는 대형 점포의 업태 정보와 지역협력 상생 활동 이행 여부 등 지역 상권에 미치는 영향을 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
