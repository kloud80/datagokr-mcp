summary_user: 부산광역시 수영구에 등록되어 영업 중인 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 작은 CSV 파일(약 2.7KB)로, 업종 구분(대부업/대부중개업)과 상호, 도로명 소재지를 담는다. 주민이나 금융소비자가 "내 동네에서 영업하는 이 대부업체가 구청에 등록된 곳인가"를 확인하거나, 분석가가 수영구 안 대부업체 분포를 살펴볼 때 쓴다. 사업자번호나 행정코드 같은 공통 조인 키가 없어서 다른 데이터와는 상호명이나 도로명주소를 맞춰 보는 방식으로만 이을 수 있고, 주소를 지오코딩하면 상권·인허가(LOCALDATA) 데이터와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: '수영구_대부업 등록 현황 정보부산광역시 수영구 내 영업중인 대부업·대부중개업체 관련 데이터를 제공합니다.(연번, 대부업·대부중개업 분류, 상호명, 도로명주소)[데이터 안내]1. 업종분류 : 대부업·대부중개업 여부2. 상호명 : 등록 시군구에 등록된 상호명3. 도로명 주소 : 등록 업체의 소재지 도로명 주소해당 데이터는 등록일 현재의 영업중인 대부업·대부중개업체의 정보를 제공하며 차기 데이터 등록일 전 변경사항이 있을 수 있으니 특정 시점의 업체 등록 및 영업 여부는 관련 부서에 문의하시기 바랍니다.'
