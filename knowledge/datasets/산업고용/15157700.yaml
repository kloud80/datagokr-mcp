summary_user: 한국수력원자력이 운영하는 원자력본부(고리·한빛·월성·한울)의 폐수 방류량(㎥/h)과 pH 등 수질 측정값을 실시간으로 담는 발전소 단위 측정 API다. 지역 주민이나 환경 분석가가 특정 원자력본부의 지금 폐수 방류량과 pH가 정상 범위인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 발전소 이름으로 다른 발전소 배출·주변 기상 측정 데이터와 맞춰 이어 써야 한다.
limits: 필수 파라미터인 발전소 구분값(genName)은 다른 데이터에서 받아온 코드여서, 먼저 확보한 뒤 넘겨야 호출된다. 공통 조인 키가 없어 다른 데이터와는 이름 매핑으로만 연결된다. 개발계정은 하루 10,000회까지 호출할 수 있다.
