description_portal: '한국지역난방공사의 유종별 구매규격 데이터를 정리한 자료로, 발전 및 열공급용 연료유의 주요 물리·화학적 특성 기준과 분석 방법을 명시하여 품질 관리 및 조달 기준 설정에 활용할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 연료코드(연료명): 규격이 정의된 연료유의 명칭(예시: LSFO)■ 구분1(항목): 연료 특성을 구분하는 주요 항목(예시: 황분, 비중, 동점도, 유동점, 인화점)■ 구분2(단위): 각 항목의 측정 단위(예시: wt.%, 15/4℃, cSt at 50℃, ℃, PMCC(℃))■ 구분3(연료규격): 해당 항목의 허용 기준값(예시: 황분 0.3 이하, 비중 0.8800~0.9700, 인화점 70 이상)■ 구분4(분석방법): 해당 항목의 분석 시험방법 또는 표준 코드(예시: ASTM D-4294, ISO 8754, D-445)3. 활용 예제:■ 연료유 품질검사 기준 및 분석 절차를 표준화하여 연료 조달 및 저장 관리 체계 확립■ 발전소 연료유 품질 모니터링 및 규격 충족 여부 점검을 통한 설비 효율 및 환경오염 저감■ 국제 표준시험법(ASTM, ISO 등)에 따른 품질평가 체계 수립 및 조달 규격서 작성 참고자료로 활용'
