summary_user: 한국수력원자력이 원전 소내외에서 운반할 때 취급하는 방사성물질(핵종·방사성폐기물 등)의 목록으로, 물질 구분과 구체적인 물질명을 한 행씩 담은 약 24KB 분량의 CSV 파일이며 지역 구분이 없는 전국 단위 참조표이다. 원전 운반 업무나 안전 관리를 살피는 분석가가 '사용후 핵연료·증기발생기·필터 같은 분류 아래 실제로 어떤 물질이 운반 대상으로 관리되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 운반 실적이나 방사성폐기물 데이터와는 물질명·물질구분 문자열을 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: 방사성물질 운반 물질명 데이터는 소내외 운반시 취급하는 방사성물질 목록으로 주로 방사성물질 핵종이나 방사성 폐기물이 해당한다. 본 데이터는 방사성물질 구분 및 구체적인 물질명으로 구성되어 있으며, 방사성물질 구분은 16가지 분류기준으로 가압기 전열기, 관리구역 작업용품, 노내외핵계측기, 방사성물질 등, 방사성폐기물, 방사성폐기물 시료, 사용후 핵연료, 시연료/사용수연료, 압력관, 원자로, 원자로냉각재펍프, 잡품목, 증기발생기, 테스트실험장비, 필터, 핵종운반으로 분류하고 있으며,
