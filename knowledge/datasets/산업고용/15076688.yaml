summary_user: 서울시 상권 영역별로 그 안에 직장이 있는 인구 수를 분기(기준년분기 코드) 단위로 집계한 데이터로, 총 직장인구와 성별·연령대(10대~60대 이상)·성별×연령대별 인원을 담는다. 창업 예정자나 상권 분석가가 '이 상권에 30~40대 직장인이 얼마나 근무하는가'처럼 점심·평일 수요층을 가늠할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 상권 코드(TRDAR_CD)와 상권 구분 코드로 같은 서울시 상권분석서비스의 다른 상권 단위 데이터와 이어 쓴다.
description_portal: '서울시 상권 영역 내 직장이 위치한 인구 정보를 제공합니다.1년중 4분기에 한번 데이터를 업데이트 하여 다음 해 1, 2, 3 분기의 값이 동일합니다.*용어설명- 상권분석은 다양한 데이터를 기반으로 상권(상업지역)의 특성, 소비자 행동, 경쟁 환경 등을 분석하는 기법으로 목적은 창업, 점포 입지 선정, 마케팅 전략, 투자 판단 등 의사결정을 지원하는 것- 입지 선정, 마케팅, 창업 전략, 투자 판단에 활용- 공공·민간·모바일 데이터를 활용하며, GIS·통계·AI 분석 기법과 결합※ 제공부서 : 서울특별시 서울신용보증재단 빅데이터팀(02-2174-5075)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
