summary_user: 방사성물질을 운반할 때 쓰는 국제연합번호(4자리 운반구분 번호)별로 방사성물질 구분, 운반물 종류(저준위 비방사능물질, L형·A형·B(U)형·B(M)형·C형 운반물 등), 운반물 속성을 정리한 작은 분류표 파일(CSV 약 1.5KB)이며, 범위는 전국·비공간입니다. 방사성물질 운송·포장 담당자나 안전 분석가가 특정 UN 번호가 어떤 운반물 유형과 속성에 해당하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 운반·폐기물 데이터와는 운반구분 번호나 운반물 종류 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 한국수력원자력(주)_방사성물질 운반물 분류 데이터는 방사성물질 운반시 운반물의 물리화학적 형태, 방사선 방출가능성 등을 기반으로 운반물을 분류하기 위해 사용되며, 본데이터는 운반구분 번호,  방사성물질 구분, 운반물 종류, 운반물 속성으로 구성되어 있다. 운반구분 번호는 방사성물질 운반 시 사용되는 국제연합번호로 방사성물질 운송을 위한 4자리 고유 식별번호이며, 방사성물질의 형태, 포장상태, 위험도 등에 따라 구분됩니다. 운반물 종류는 제1종/제2종/제3종 저준위 비방사능물질, L형 운반물, A형 운반물, B(U)형/B(M)형 운반물, C형 운반물 등으로 구성되어 있다.
