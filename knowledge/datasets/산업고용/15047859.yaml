summary_user: 영월군에서 담배소매인으로 지정된 업소를 한 행씩 담은 건별 목록으로, 업소명·대표자명·지번 및 도로명 주소·지정일자·민원구분·법인구분(개인/법인)을 담는다(CSV 약 28KB). 영월군 안에서 담배를 합법적으로 파는 곳이 어디인지, 특정 지역에 언제 소매인이 새로 지정됐는지를 확인하려는 주민·창업 예정자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업소명을 매칭하거나 같은 기관의 다른 인허가(LOCALDATA) 자료와 나란히 놓고 써야 한다.
description_portal: 이 공공데이터는 강원특별자치도 영월군 내 담배 소매인으로 정식 지정된 업소들의 상세 현황을 제공하는 자료입니다. 데이터에는 각 업소의 고유 식별 번호, 대표자명, 그리고 민원 구분(지정 신고 유형)에 대한 정보가 포함됩니다. 특히 업소의 명확한 식별을 위해 상호명, 정확한 지번 주소와 도로명 주소를 제공하며, 담배 소매인으로 지정된 공식적인 일자도 명시하고 있습니다. 또한, 해당 업소가 개인 사업자인지 법인 사업자인지 구분하는 법인구분 정보도 함께 제공하여 사업체 유형을 파악하는 데 도움을 줍니다.이 자료는 소비자들이 합법적으로 담배를 구매할 수 있는 지정 판매처를 쉽게 확인하고 접근하는 데 중요한 역할을 합니다. 또한, 지방자치단체는 이 데이터를 기반으로 담배 소매업의 현황을 체계적으로 관리하고 감독하며, 관련 법규 준수 여부를 확인하고 불법 판매를 방지하는 데 활용합니다. 이를 통해 건전하고 투명한 담배 유통 질서를 확립하고, 청소년 흡연 예방 등 공중 보건 증진을 위한 정책을 수립하고 실행하는 데 필수적인 기초 자료를 제공합니다.
