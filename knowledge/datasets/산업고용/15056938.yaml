summary_user: 경기도 31개 시군의 고압가스 제조·판매 사업장 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자, 업태(제조·판매 등)와 제조구분(냉동 등), 지번·도로명 주소, 면적, WGS84 위경도를 포함한다. 지자체 안전관리 담당자나 분석가가 '우리 시군에서 영업 중인 고압가스 제조 사업장이 주거지 주변 어디에 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·사업장명 매칭, 좌표 기반 공간 결합으로 같은 계열의 LPG·도시가스·석유판매 등 다른 에너지 업종 인허가 데이터와 연결한다.
description_portal: 용기에 충전하는 것을 포함하여 고압가스를 제조하는 경기도 내 고압 가스업 현황입니다.※ 경기도 31개 시군의 인ㆍ허가 데이터입니다.※ 고압가스는 고압가스 안전관리법의 적용을 받습니다.이 데이터는 경기도 내 고압가스를 제조 또는 판매하는 사업장에 대한 현황을 나타내며, 각 사업장의 인허가일자, 영업상태, 업태구분명(제조, 판매 등), 제조구분명(냉동 등), 소재지 주소 및 도로명주소, 사업장 면적, WGS84 기준 위도·경도, X·Y좌표값 등 다양한 정보를 포함하고 있습니다. 이를 통해 고압가스 취급 업체의 지역 분포, 운영 실태, 제조 유형 등을 파악할 수 있으며, 안전관리 대상 시설로서의 중요도 평가, 산업별 위험물 취급 관리, 도시계획상 안전대책 수립 등에 활용될 수 있습니다. 특히 소재지 위치 정보는 위험물 시설 주변 주민 보호 대책 마련에도 유용하게 쓰일 수 있습니다.
