summary_user: 성남벤처넷에 가입한 성남 기업 회원의 현황을 기업 한 곳당 한 행으로 담은 파일로, 회사명·대표자·주소·업종·주요취급품목·설립일과 벤처·이노비즈 인증 여부, 기업부설연구소 여부, 특허·실용신안·의장등록 건수를 포함한다(포털 설명상 2014년 4월 기준). 성남 지역에서 특정 품목을 다루는 벤처·이노비즈 기업이나 특허를 보유한 기술기업을 찾는 사업자·분석가가 거래처 탐색이나 지역 기업 기술역량 파악에 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 기업 인증 데이터와는 회사명·주소 같은 이름 매칭으로만 잇고, HS코드(HS코드) 필드는 무역 품목 분류 자료와 맞춰 보는 데 쓴다.
limits: 사업자번호 등 공통 키가 없어 벤처·이노비즈 확인서 원장과 정확히 연결되지 않고 이름 매칭에 의존해야 한다. 포털 설명상 2014년 4월 시점 자료이며, 벤처넷 회원 기업만 담고 있어 성남 전체 기업 현황으로 보면 안 된다.
