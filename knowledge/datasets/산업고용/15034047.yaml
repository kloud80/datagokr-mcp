summary_user: 대구광역시 군위군이 관리하는 태양광 발전설비를 설비 한 건씩 담은 원장 파일로, 상호·설치장소 소재지·설비용량(kW)·허가일자를 담는다. 군위군 안에서 어느 지역에 태양광이 얼마나 들어섰는지, 연도별로 허가 용량이 어떻게 늘었는지를 따지는 지역 에너지 정책 담당자나 분석가가 쓴다. 전역 조인 키는 없어서, 전국태양광발전소전기사업허가정보 표준데이터 같은 다른 자료와는 상호명이나 설치장소 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대구광역시 군위군에서 관리하고 있는 태양광발전설치현황에 대한 데이터로 상호명, 설치장소, 설비용량, 허가일자의 항목을 제공합니다. 재생에너지 보급률 평가, 지역 에너지 자립 정책 수립, 신재생에너지 지원금 관리, 설비 안전관리 등을 위한 기초 자료입니다. 설치장소는 지자체별 설치분포 분석, 농지 태양광/산지 개발행위 허가 연계 정보 확인, 일사량 기반 발전효율 분석에 활용됩니다. 설비용량은 보급 통계 집계, 발전량 예상치 계산, 설치지원금 산정 기준에 활용됩니다. 허가일자는 연도별 설치량 통계 및 성장률 분석, REC(신재생에너지공급인증서) 발급 이력 기준, 안전관리 및 설비점검 주기 산정, 일정 기간 내 설치 여부 확인(보조금 지원 조건 검토)에 활용됩니다.
