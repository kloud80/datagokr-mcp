description_portal: 중소기업기술정보진흥원에서 제공하는 '산학협력 거점형 플랫폼RnD 거점대학정보' 데이터는 중소기업의 기술 혁신 역량 강화를 위해 구축된 산학협력 체계의 핵심 역할을 수행하는 거점 대학들의 정보를 담고 있습니다. 이 데이터는 전국을 권역별로 구분하고 해당 지역에 위치한 운영기관명(거점대학)을 명확히 제시하여, 중소기업이 지리적으로 가까운 기술 지원 플랫폼을 쉽게 찾을 수 있도록 돕습니다. 또한, 해당 사업의 공고 홈페이지 주소를 포함하여 플랫폼에서 진행되는 RnD 사업의 상세 내용 및 지원 절차를 신속하게 확인할 수 있도록 접근성을 제공합니다. 대표번호 정보를 통해 직접적인 문의가 가능합니다.
