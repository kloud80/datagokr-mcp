summary_user: 탄소배출량 검증인정서를 받은 태양광 모듈 제품을 모델 단위로 한 행씩 담은 원장 파일로, 기업명·공장명·모델명·검증코드·출력(W)·탄소배출량·검증방법과 인정서 발급일·만료일이 들어 있다(전국 범위, 약 261KB CSV). 소비자나 발전사업자가 "설치하려는 모듈 모델이 탄소검증을 받았고 출력 대비 탄소배출량이 얼마인가"를 확인하거나, 연구자가 제조사·공장별 탄소배출량을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 기업명·모델명 같은 이름 매핑으로만 이어 붙일 수 있다.
description_portal: 본 데이터는 태양광 모듈 제품의 제조 과정에서 발생하는 탄소배출량에 대해 검증하여 발급된 인증 제품 정보를 제공합니다.탄소검증 제도는 소비자에게 저탄소 태양광 제품의 정보를 투명하게 제공함으로써 친환경적 제품 선택을 돕고, 기업의 탄소 저감 노력을 촉진하기 위한 제도입니다. 주요 제공 항목은 탄소배출량 검증인정서를 받은 태양광 모듈 제품을 생산한 기업명, 공장명, 검증코드, 출력, 탄소배출량 등이며, 소비자는 본 데이터를 통해 친환경 제품을 쉽게 식별하여 선택할 수 있습니다.또한 기업과 연구기관은 제품별 탄소배출량 비교분석, 시장조사 및 친환경 제품 개발, 태양광 산업의 탄소 저감 전략 수립 등 다양한 연구와 정책 마련에 본 데이터를 활용할 수 있습니다.
