summary_user: 서울시 전체(시도 단위) 가계의 소비 지출을 기준 분기(STDR_YYQU_CD)별로 집계한 데이터로, 총지출액과 식료품·의류신발·생활용품·의료·교통·교육·유흥·여가문화·기타·외식 항목별 지출 금액을 담는다. 분석가나 창업 준비자가 '최근 분기 서울시민의 외식·의류 지출이 전년 같은 분기보다 늘었나'처럼 업종별 소비 흐름을 확인하는 데 쓴다. 전역 조인 키는 없어 기준 분기 코드와 시도 코드·이름(MEGA_CD, MEGA_CD_NM)으로 같은 서울시 상권분석서비스의 다른 데이터와 시점·지역을 맞춰 붙인다.
description_portal: 이 데이터는 서울시 가계의 평균 소득과 소비 지출 현황을 보여주는 자료로, 분기별로 제공됩니다. 서울시민의 월평균 소득과 함께 총지출액, 식료품비, 의류·신발, 생활용품, 의료비, 교통비, 교육비, 여가·오락, 문화 관련 지출, 기타 지출, 그리고 외식비 등 다양한 항목별 소비 패턴을 포함하고 있습니다. 이를 통해 시민 생활수준과 소비 성향을 파악할 수 있으며, 가계경제 분석, 생활물가 연구, 정책 수립, 도시민 복지 향상 자료로 활용할 수 있습니다. 또한 시계열 데이터를 통해 분기별·연도별 소비 구조 변화를 비교·분석할 수 있습니다.
