summary_user: 전통시장의 경기전반·매출·자금사정·비용·구매고객 수·재고·고용·영업이익·원재료 조달사정 체감지수와 전망지수를 연·월 단위로 담은 전국 집계 시계열 파일(csv)이며, 농산물·축산물·수산물·음식점 등 업종별과 서울·부산·대구·인천 등 지역별 지수도 함께 담는다. 정책 담당자나 분석가가 "최근 몇 달 사이 전통시장 상인의 매출 체감과 다음 달 전망이 나아지고 있는가, 어느 업종·지역이 특히 나쁜가"를 확인하는 데 쓴다. 전역 조인 키는 없고 연도·월 기준으로 다른 월별 경기·소비 지표와 나란히 놓거나, 지역명을 이름으로 맞춰 같은 기관의 상가·전통시장 데이터와 이어 쓴다.
description_portal: 소상공인시장진흥공단_전통시장 경기동향(BSI) 현황은 전통시장의 경기전반, 매출, 자금사정, 영업의욕, 원재료 조달사정, 구매고객 수 등의 체감지수를 바탕으로 시장 경기동향을 수치화한 자료입니다. 매월 정기적으로 조사되어 시계열 분석이 가능하며, 소상공인 정책 방향 설정 및 경기 회복 지표 모니터링 자료로 활용할 수 있습니다. 특히 전통시장 운영 환경 변화나 소비심리 진단을 위한 참고지표로 유의미하며, 정부의 맞춤형 지원 및 대응 정책 수립에 필요한 기초 통계로 활용됩니다. 향후 유사 사례 발굴 및 정책 설계의 참고 자료로도 활용될 수 있습니다.
