summary_user: 한국산업기술진흥원이 지원하는 소재부품 신뢰성 장비를 장비 한 대당 한 행으로 담은 목록이며, 보유 기관명, 장비명, 장비가 있는 지역, 구축년월을 전국 범위로 담는다(CSV 파일 약 49KB). 기업이나 연구소가 '우리 지역에서 이 신뢰성 시험 장비를 갖춘 기관이 어디인가'를 찾을 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 기관명이나 지역명을 문자열로 맞춰서만 이어 쓴다.
description_portal: '소재부품 관련한 신뢰성 장비 현황입니다. 이 데이터는 산업 기술 발전을 위한 중요한 정보로, 각 지원 장비의 구체적인 현황을 담고 있습니다. 기관명, 장비명과 더불어 장비의 위치, 구축 시점에 대한 정보를 포함하고 있어 연구 및 개발 프로젝트에 활용될 수 있습니다. 예를 들어, 기업이나 연구소는 해당 데이터를 통해 필요한 장비를 파악하고, 효율적으로 필요한 자원을 분배하는 데 도움을 받을 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 기관명(문자형) : 지원 장비를 제공하는 기관의 이름, 장비명(문자형) : 해당 장비의 명칭, 장비지역(문자형) : 장비가 위치한 지역, 구축년월(문자형) : 장비가 구축된 연도를 나타냅니다. 이를 통해 관련 산업의 생태계가 활성화되고, 산업 응용 수준이 향상될 수 있는 기회를 제공할 것입니다.'
