description_portal: '서울특별시 중구의 TV홈쇼핑, 인터넷, 카탈로그, 신문잡지, 기타의 방법으로 가구, 가전, 식품, 의류 등을 판매하는 업소 정보입니다. 데이터는 각 통신판매업 영업자에게 부여된 관리번, 현재의 영업 상태(신고, 폐업 등), 소재지 주소 등의 주요 항목들로 구성되어 있습니다. 이 자료는 통신판매업 창업을 희망하는 예비 영업자에게는 중구 지역의 전자상거래 온라인 쇼핑몰 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. * 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
