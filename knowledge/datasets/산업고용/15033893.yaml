summary_user: 정읍시에서 태양광발전사업 허가를 받은 발전소를 한 건씩 담은 원장 파일로, 발전소명·설치위치·설치구분·설치면적(㎡)·허가용량(kW)을 담는다(포털 설명상 2025년 6월 30일 기준). 주민이나 분석가가 정읍시 안 어느 지역에 태양광 허가가 몰려 있는지, 허가 용량이 얼마나 되는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 설치위치 주소나 발전소명을 매칭해 잇거나, 전국태양광발전소전기사업허가정보 표준데이터와 주소·용량을 대조해 쓴다.
