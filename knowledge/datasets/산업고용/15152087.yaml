description_portal: 이 데이터는 전 세계 주요 국가의 사용후 핵연료 재처리시설에 대한 현황 정보를 제공합니다.처리대상 연료 유형에 따라 주요국가명, 시설 위치(시설명), 처리 규모 등으로 구성되어 있습니다. 본 데이터는 세계원자력협회(WNA) Information Library(www.world.-nuclear.org)의  공개자료를 기반으로 정리되었습니다.현재 상업적 재처리 능력은 전 세계적으로 약 연간 3,800톤(THM) 수준이며, 주요 시설은 프랑스, 러시아, 일본, 중국, 인도, 영국 등에 집중되어 있습니다.이 데이터는 국제 원자력 연료주기 분석, 핵비확산 연구, 에너지 정책 수립, 산업 연구자료 구축 등에 활용될 수 있습니다.
