summary_user: 진도군 관내에서 허가된 토석채취 사업을 허가 건별로 담은 원천 목록으로, 수허가자·허가대상지·채취용도·허가량(㎥)·허가 시작일과 종료일을 담는다(CSV 557바이트의 소규모 파일). 군민·연구자·사업자가 '진도군 어느 지역에서 누가 어떤 용도로 얼마만큼 토석채취 허가를 받았고, 허가가 언제 끝나는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 허가대상지 지명(이름 매칭)이나 같은 기관 기준으로만 이어 쓰며, 다른 시군의 토석채취허가 현황과 나란히 비교하는 정도로 활용한다.
limits: 표준 코드(필지 고유번호·사업자번호 등)가 없어 지적·공간 규제 데이터와 자동 결합이 어렵고, 허가대상지는 지명 문자열로 맞춰야 한다. 범위는 진도군 한 곳이며 좌표가 없는 비공간 자료라 지도 분석에는 별도 위치 변환이 필요하다.
