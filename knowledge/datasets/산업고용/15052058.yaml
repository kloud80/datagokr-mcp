description_portal: 한국가스공사의 발전용 천연가스 요금 데이터 입니다.발전용 천연가스 요금 현황 파악 및 요금 변동 분석, 요금정책 수립, 발전사업자 지원을 목적으로 수집되었습니다. 데이터 구성항목은 연도별 월별 발전용 천연가스의 원료비와 공급비(원/Nm3, 원/GJ 단위)로 이루어져 있습니다. 2008년 이전 요금 단가는 원/Nm3로 산정되어 있으며, GJ 단위는 23.21146Nm3/GJ 기준으로 환산하여 제공됩니다. 본 데이터를 활용하면 발전용 천연가스 요금 추이 분석, 원료비와 공급비 비중 변화 파악, 요금 변동 요인 분석, 타 에너지원 대비 경쟁력 평가, 계절별 요금 패턴 분석이 가능합니다. 또한 발전사업자의 연료비 예측, 전력요금 산정 기초자료, 에너지 정책 수립, 발전원가 분석에 활용되어 발전용 천연가스 시장의 투명성과 예측가능성을 높이는 데 기여합니다.
