description_portal: 1. 숙련기술장려법 제20조, 제25조에 따라 추진하는 전국기능경기대회에서 광주광역시 선수단의 입상실적 데이터 - 2007년 이후 입상실적 현황입니다. - 순위제는 2021년부터 폐지됨2. 전국기능경기대회는 매년 시·도에서 순회 개최3. 2024년은 경북(구미, 경주, 안동, 포항)에서 59회 전국기능경기대회 개최 - (개회식) 8.26.(월) 17:00 박정희체육관(구미), (폐회식) 8.30.(금) 15:00 박정희체육관(구미) - (표어) Spark! 경북에서 기술이 터지다.4. 50개 직종 1,755명 선수가 참여해 7일간(8.24.~8.30.) 실력 겨뤄5. 전국대회는 지방기능경기대회를 우수한 성적으로 입상한 시·도 대표선수들이 참가하여 경쟁6. 우수 입상자는 순위에 따라 상장 및 상금이 지급되고, 제48회 국제기능올림픽대회(’26년, 상하이) 국가대표 선발전에 참가할 수 있는 자격과 산업기사(국가기술자격) 실기시험 면제 혜택7. 제60회 전국대회는 광주광역시에서 개최
