description_portal: 이 데이터는 산재 근로자의 사회 복귀를 돕기 위해 시행된 직장적응훈련 지원 현황을 담고 있습니다. 통계는 산재보험 장해 등급 기준에 따라 1~3급, 4~9급, 10~12급으로 구분하여, 각 급수별 지원 인원(명)과 지급된 총 금액(원) 정보를 연도별로 제공합니다. 이 직장적응훈련은 재활이 필요한 근로자가 직장에 복귀하여 업무에 적응하는 기간 동안 심리적, 물리적 지원을 제공하는 핵심 재활 프로그램입니다. 이 자료는 산재보험 재활 사업 중 직장 복귀 지원 분야의 규모와 성과를 등급별로 세분화하여 파악할 수 있는 중요한 지표라고 판단됩니다.본 데이터는 산재 재활 정책의 효과성과 지원 효율성을 평가하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 상대적으로 장해 정도가 심한 1~3급 근로자에 대한 훈련 지원 실적이 미흡할 경우, 중증 장해자를 위한 직장 복귀 지원 방안을 강화할 필요성을 도출할 수 있습니다. 또한, 급수별 인원 대비 지급액의 변화 추이를 분석함으로써 재활 프로그램의 단가 및 지원 기준의 적정성을 검토하고, 제한된 재원을 효율적으로 배분하여 더 많은 산재 근로자의 안정적인 직장 복귀를 촉진하는 데 기여할 수 있다고 판단됩니다.
