description_portal: 2012년부터 2025년 현재까지 한국산업기술기획평가원 주관으로 진행된 산업기술 연구개발(R&D) 교육과정에 대한 연도별 교육정보를 제공합니다. 본 데이터는 국가 연구개발 역량 강화를 목적으로 시행된 다양한 전문 교육 프로그램의 운영 이력을 포함하고 있으며, 각 교육의 실시 연도, 교육과정 유형, 교육장소(온라인 및 대구, 광주, 서울, 수원, 원주, 전주, 제주 등 주요 권역별 오프라인 교육 포함), 교육과정명, 기수(회차), 접수 시작일자, 접수 종료일자, 교육 시작일자, 교육 종료일자, 신청 인원 수, 정원(수용 가능 인원), **진행 상태(예정, 진행 중, 종료 등)**에 대한 정보를 포함합니다. 이 데이터는 연구책임자 및 실무자 대상의 R&D 역량 향상, 과제 수행 이해도 제고, 실무 중심의 정책 교육 확산 등을 목적으로 기획된 교육 실적을 기반으로 하며, 교육 수요 분석, 지역별 교육 인프라 평가, 향후 교육기획 및 개선 방향 도출 등에 활용될 수 있습니다.
