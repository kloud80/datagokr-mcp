summary_user: 인천광역시에 등록된 대규모점포(대형마트·백화점·쇼핑센터·복합쇼핑몰)를 점포 한 곳당 한 행으로 담은 파일로, 기초지자체·법인명·상호·업태·소재지·건물 연면적·영업장 면적·매장면적·영업개시일을 포함한다. 인천의 어느 구·군에 어떤 업태의 대형 점포가 언제 문을 열었고 매장 규모가 얼마인지 확인하려는 시민·상권 분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 기초지자체명이나 소재지 주소, 상호를 기준으로 전국 대규모점포 표준데이터나 소상공인 상가업소 정보 같은 상권 자료와 맞춰 이어 쓴다.
description_portal: 인천광역시 대규모점포(대형마트, 백화점, 쇼핑센터, 복합쇼핑몰)의 소재지, 연면적 등에 대해 알 수 있습니다. * 유통산업정보시스템 기준 자료 입니다.이 공공데이터는 인천광역시 관내에서 등록된 대규모점포(대형마트, 백화점, 쇼핑몰 등)의 현황을 체계적으로 정리하여 제공하는 행정 자료입니다. 지역 상권의 규모와 분포를 파악하고 유통산업 정책 수립에 활용할 수 있도록 상세 항목을 포함합니다.<활용 목적> 이 자료는 인천시의 유통산업 현황을 분석하고, 상권 관리·도시계획·교통 및 기반시설 확충 정책 수립에 기초 자료로 활용됩니다. 또한 시민과 연구기관은 지역별 대규모점포 분포와 개점 시기를 확인하여 소비 패턴과 상권 변화를 분석하는 데 참고할 수 있습니다.
