description_portal: 충청북도 충주시 관내에서 경질유 및 중질유를 사용하는 업체의 현황을 수록한 데이터임. 산업체 에너지 소비 구조 분석, 환경영향 평가, 온실가스 배출량 산정 등 다양한 행정 및 정책 분야에 활용 가능함.주요 항목은 상호(업체명), 주소(사업장 소재지), 사용연료(경유, 벙커C유 등 연료 종류), 생산품(제조 제품 또는 산업용 품목), 연료사용량등으로 구성됨.연료사용량 정보는 대기오염물질 배출계수 적용, 지역 에너지 자립도 평가, 에너지 고효율 설비 보급사업 추진 등의 근거자료로 활용되며, 연료 유형에 따른 탄소 배출계수 적용 시 온실가스 배출량 산정에도 활용됨.※ 해당 데이터는 자가발전, 난방, 공정연료 등의 용도 구분이 포함되지 않을 수 있으며, 사용량은 업체 자가보고 또는 관리기관 집계 기준에 따라 일부 편차가 존재할 수 있음.
