summary_user: 서울특별시 중랑구에서 반려동물을 구입해 판매·알선·중개하는 동물판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표를 개별 단위로 제공한다. 반려동물을 분양받으려는 주민이 동네 펫숍이 정식 등록돼 현재 영업 중인지 확인하거나, 분석가가 중랑구 동물판매업소의 개·폐업 추이와 위치 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역·업종의 LOCALDATA 인허가 자료나 상가업소 정보와는 주소·사업장명 매칭 또는 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 가정에서 반려의 목적으로 사육하는 동물을 구입하여 판매, 알선 또는 중개하는 업소 정보입니다. 동물판매업소의 인허가일자, 영업상태, 폐업의 경우는 폐업일자, 주소, 사업장명, 좌표정보, 축산업무구분명, 축산물가공업구분 정보를 제공하고 있습니다. * 좌표안내: 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 자세한 정보는 데이터 링크를 클릭하여 서울시 열린데이터 광장 사이트에서 데이터를 다운받아서 확인하여 주시기 바랍니다. 감사합니다.'
