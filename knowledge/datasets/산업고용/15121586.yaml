description_portal: 산업기술 연구개발(R&D) 투자전략 수립 및 정책 기획을 위한 분류체계 정보를 제공합니다. 이 데이터는 국가 산업경쟁력 강화를 위해 설정된 주요 전략분야별로 체계화된 구조를 갖추고 있으며, 전략분야에는 전기·수소차, 자율주행차, 친환경 스마트 조선해양플랜트, 디지털 헬스케어, 맞춤형 바이오 진단·치료, 스마트 의료기기, 스마트 홈, 지능형 로봇, 웨어러블 디바이스, 미래형 디스플레이, 지식서비스, 뿌리기술, 섬유의류, 세라믹, 화학공정, 나노, 탄소소재, 금속재료, 차세대 반도체, 첨단 제조공정·장비, 스마트 산업기계, 디지털 엔지니어링, 3D 프린팅, 차세대 항공, 이차전지 등이 포함됩니다. 각 전략분야는 대분류, 중분류, 소분류 체계로 구성되며, 이에 대한 구체적인 전략 정의도 함께 제공합니다. 이 분류체계는 기술개발 방향성 설정, 정책 평가 기준 마련, 연구개발 과제 기획, 예산 배분의 합리화를 위한 기초 자료로 활용되며, 민간 기업과 연구기관에서도 미래 유망 기술 분야를 선제적으로 파악하고 투자 전략을 수립하는 데 참고할 수 있습니다.
