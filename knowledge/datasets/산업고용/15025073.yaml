summary_user: 부산광역시 연제구에 등록된 문화유산매매업자(동산 유형·민속문화유산을 사고팔거나 교환하는 업자)를 업소 한 건씩 담은 등록 원장으로, 허가번호·상호·지번/도로명 주소·대표자·최초등록일·전화번호·영업 상태를 담으며 파일 크기는 340바이트로 매우 작다. 연제구에서 정식 등록된 고미술품·골동품 매매업소가 어디 있고 지금도 영업 중인지 확인하려는 구매자나, 지역 문화유산 유통업 현황을 보는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(지번·도로명)나 행정동 이름으로 맞춰 붙이며, 다른 시군구의 같은 업종 등록현황이나 LOCALDATA 업종 인허가 자료와 상호·주소를 기준으로 이어 쓴다.
description_portal: '문화유산 매매업 등록현황에 대한 데이터로 허가번호, 상호, 주소, 대표자, 전화번호 등의 항목을 제공합니다. (문화유산의 보존 및 활용에 관한 법률 관련)문화유산 :  「국가유산기본법」 제3조제2호에 해당하는 다음 각 호의 것문화유산매매업자 : 동산에 속하는 유형문화유산이나 민속문화유산을 매매 또는 교환하는 것을 업으로 하려는 자자격요건1. 국가, 지방자치단체, 박물관 또는 미술관에서 2년 이상 문화유산을 취급한 사람2. 전문대학 이상의 대학(대학원을 포함한다)에서 역사학ㆍ고고학ㆍ인류학ㆍ미술사학ㆍ민속학ㆍ서지학ㆍ전통공예학 또는 문화유산관리학 계통의 전공과목(이하 “문화유산 관련 전공과목”이라 한다)을 일정 학점 이상 이수한 사람3. 「학점인정 등에 관한 법률」 제7조에 따라 문화유산 관련 전공과목을 일정 학점 이상을 이수한 것으로 학점인정을 받은 사람4. 문화유산매매업자에게 고용되어 3년 이상 문화유산을 취급한 사람5. 고미술품 등의 유통ㆍ거래를 목적으로 「상법」에 따라 설립된 법인으로서 제1호부터 제4호까지의 자격 요건 중 어느 하나를 갖춘 대표자 또는 임원을 1명 이상 보유한 법인'
