description_portal: 본 데이터는 한국가스공사의 연도별·월별 발전용 천연가스 요금 정보를 제공합니다. 발전용 천연가스 요금의 투명한 공개와 전력시장 참여자 정보 제공을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 연도, 월, 일반발전용 원료비·공급비, 집단발전용 원료비·공급비, 요금 변동추이, 산정기준, 적용기간 등이 포함되어 있습니다. 본 데이터는 발전사업자, 전력시장 분석가, 에너지 정책 연구자, 요금산정 담당자, 전력거래소, 산업통상자원부가 발전용 가스요금 추이 분석 및 발전비용 산정에 필수적으로 활용할 수 있습니다. 전력시장의 투명성 향상과 합리적인 전력요금 산정에 기여할 것으로 기대됩니다.
