description_portal: '한국전력공사에서 제공하는 전기요금 조정율 데이터로 전기요금의 연도별 변동 내역을 수치로 정리한 자료입니다.연월, 주택용, 일반용, 교육용, 산업용 등의 칼럼으로 구성되어 있어, 특정 시기마다 용도별 전기요금이 어떻게 인상·인하되었는지를 확인할 수 있습니다.이 데이터는 단순 평균 조정율이 아니나 용도별 세부 수치가 제공되므로, 가정과 산업현장의 부담 변화를 비교하거나, 교육기관 및 상업시설 등 특정 부문의 요금 정책 영향을 분석할 수 있습니다.향후 전기요금 조정 정책 수립이나 비용 예측 모델 개발의 기초 자료로 활용할 수 있습니다.* 기존 정률인상(%)에서 21년부터 정액인상(원/kWh)으로 변경됨에따라 단위를 잘 확인하여 주시기 바랍니다.(단위 : 2021년 이전 %, 이후 원/kWh)'
