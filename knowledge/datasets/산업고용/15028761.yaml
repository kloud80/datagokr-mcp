summary_user: 대구광역시 서구에 신고된 행정사 사무소를 사무소 한 곳당 한 행씩 담은 소규모 CSV 파일(약 1.8KB)로, 명칭·신고일·소재지 주소·영업여부를 담는다. 서구에서 인허가·행정심판 대행을 맡길 행정사 사무소를 찾는 주민이나 관내 행정사 분포를 확인하려는 담당자가 "서구 어느 동에 영업 중인 행정사 사무소가 있나"를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 소재지 주소나 사무소 명칭을 맞추거나 다른 지방행정 인허가(LOCALDATA) 업종 자료와 같은 기관 단위로만 이어 쓴다.
description_portal: 이 데이터는 대구광역시 서구 지역 내에서 등록되어 운영 중인 행정사 사무소의 현황을 제공하는 공공데이터로 2025년 10월말 기준으로 작성되었다. 행정사 제도는 각종 인허가, 신고, 진정, 행정심판 등 국민의 행정업무를 대행하거나 자문하는 제도로서, 지역 내 행정서비스 접근성을 높이는 데 중요한 역할을 한다. 본 데이터에는 행정사 사무소의 명칭, 신고일, 소재지, 영업 여부 등 기본 정보가 포함되어 있으며, 이를 통해 관내 행정사 분포 현황과 운영 실태를 파악할 수 있다. 해당 자료는 행정업무 관련 민원 대응 및 제도 운영의 효율화를 지원하기 위해 구축되었으며, 정기적으로 갱신되어 최신 정보를 유지한다. 공공데이터포털을 통해 누구나 열람 및 활용이 가능하며, 대구광역시 서구청에서 관리·제공하고 있다.
