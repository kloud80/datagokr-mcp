description_portal: 한국서부발전의 업무용 차량 보유현황 데이터는 기관이 보유하고 있는 차량 운용 현황을 종합적으로 보여주는 자료입니다. 해당 데이터에는 차량의 차종(승용차, 승합차, 화물차, 특수차, 유틸리티카 등)과 함께, 각 차량이 사용하는 연료 유형(경유, 전기, 휘발유, 하이브리드 등)이 구분되어 제공됩니다. 또한 차량별 보유대수와 운행특성에 따른 교체주기 정보가 포함되어 있어 차량 관리 및 효율적 운영 전략수립에 활용할 수 있습니다. 이를 통해 친환경차 전환 비율, 연료별 운영비 절감효과, 교체계획 수립 등 다양한 정책적 의사결정에 기초자료로 사용될 수 있으며, 나아가 기관의 탄소중립 목표 달성과 대내외 투명한 경영활동을 지원하는 자료입니다.
