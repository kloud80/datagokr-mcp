summary_user: 인천광역시 안에서 수수료 없이 일자리를 알선하는 무료 직업소개소의 목록으로, 소개소 한 곳이 한 행이며 기관명·대표자명·전화번호·팩스번호·소재지를 담는다(CSV 약 5KB 규모의 소형 파일). 인천 시민이나 구직 지원 담당자가 '우리 동네 근처에 수수료 없이 일자리를 소개받을 수 있는 곳이 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키나 기관 코드가 없어 다른 데이터와는 기관명이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: '인천광역시 무료 직업소개소의  사업장 현황에 대한 데이터로 연번, 기관명, 대표자명, 전화번호, 팩스, 소재지  등을 알 수 있습니다.<활용 목적 입니다>-구직자 지원: 수수료 부담 없이 일자리를 찾고자 하는 시민들에게 신뢰할 수 있는 무료 알선 기관 정보를 투명하게 제공합니다.-사회 공헌 분석: 비영리 목적의 직업소개소가 지역 사회 고용 안정에 기여하는 정도를 파악하고, 공익적인 취업 지원 정책 수립 및 지원의 기초 자료로 활용됩니다.-취약계층 및 시민들의 고용 접근성 향상을 위한 중요한 기반 자료입니다.'
