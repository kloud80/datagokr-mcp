summary_user: 서울 광진구 관내 무료직업소개소의 인허가 현황을 업소 한 곳당 한 행으로 담는 건별 원천 데이터로, 업소명(BPLC_NM)·인허가일자·폐업일자·영업상태·지번/도로명 주소·전화번호·중부원점TM 좌표 등이 들어 있습니다. 구직자나 지역 고용 담당자가 '광진구에 지금 영업 중인 무료직업소개소가 어디에 있고 언제 허가받았나'를 확인하거나 고용서비스 접근성을 따져 볼 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호(MNG_NO) 기준으로만 이어 쓰며, 다른 자치구의 같은 인허가 데이터와 묶어 서울 전체 현황을 볼 때 이 방식을 씁니다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 무료로 직업을 소개하는 업소에 대한 인허가 현황 정보를 제공합니다. 「직업안정법」에 따라 설립된 무료직업소개소는 구인자 또는 구직자로부터 금품 등을 받지 않고, 일자리 알선 및 고용계약 성사를 중개하는 비영리 고용서비스 기관입니다.데이터 항목에는 업소명, 소재지, 인허가일자, 운영상태, 업종구분, 담당 행정기관 등이 포함되어 있으며, 이는 공공일자리 지원정책 수립, 중개기관 등록 현황 파악, 고용서비스 접근성 분석 등에 활용될 수 있습니다.또한 사회복지시설 부설 소개소, 지역 기반 구직자 취업연계, 중장년·청년층 일자리 매칭 수요 대응 등의 행정 수요에도 활용 가능성이 높습니다.※ 본 데이터의 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도는 포함되어 있지 않습니다.※ 인허가 정보는 3일 전 기준 최신 내용이 반영되어 있습니다.
