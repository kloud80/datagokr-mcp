summary_user: 경기도일자리재단 잡아바(Jobaba) 플랫폼에 올라온 채용공고를 공고 한 건 단위로 담으며, 기업명·공고명·급여조건·공고형태·근무지역·경력·학력·모집분야·채용인원·접수 시작/종료일·공고 링크를 포함한다. 구직자가 '경기도에서 지금 접수 중인 경력 무관 공고는 어디인가'를 찾거나, 분석가가 지역·직무별 구인 수요와 학력·경력 무관 공고 비율을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기업명이나 근무지역명(WORK_REGION_CONT)·모집분야명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 경기도일자리재단은 경기도민을 위한 다양한 일자리 정보의 제공과 양질의 직업 알선, 다양한 직업교육 및 단계별 여성창업 지원을 통하여 도민이 일할 수 있는 더 많은 기회를 제공 받기 위한 고용서비스를 제공하고 있습니다.본 잡아바 채용정보 데이터는 기업명, 공고명, 급여조건, 공고형태, 경력 등을 제공합니다.이 데이터는 경기도일자리재단에서 제공하는 잡아바(Jobaba) 플랫폼의 채용정보를 수록한 자료로, 각 기업의 채용공고명, 급여조건, 공고형태, 근무지역, 경력 및 학력 요구사항, 모집분야 및 인원, 접수기간, 채용공고 링크(URL) 등의 항목으로 구성되어 있습니다. 주요 항목으로는 ‘공고명’, ‘근무지역’, ‘급여조건’, ‘모집분야’, ‘경력’, ‘학력’, ‘접수시작일’, ‘접수종료일’ 등이 있으며, 구직자에게 실질적인 채용 정보 제공, 구인기업의 고용추세 파악, 지역 일자리 분석, 직무별 수요 분석 등에 활용할 수 있습니다. 근로계약 형태는 상용직, 계약직 등으로 구분되어 있고, 일부 공고는 상용직 전환 가능성이나 대체인력 여부도 포함되어 있어 취업 안정성 평가에도 유용합니다.공고별 링크가 포함되어 있어 자세한 공고 세부내용 확인도 가능하며, 학력 무관 또는 경력 무관의 비율 분석도 가능합니다.
