summary_user: 경상북도 안에서 승강기 유지관리업을 하는 법인의 등록 현황을 법인 한 곳당 한 행으로 담은 파일(csv, 약 2.6KB)로, 법인명·사업자등록번호·대표자명·전화번호·소재지를 담는다. 아파트 관리주체나 건물주가 도내 승강기 유지관리 업체를 찾아 연락처와 소재지를 확인할 때, 또는 분석가가 시군별 유지관리업체 분포를 살펴볼 때 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 다른 지방행정 인허가(LOCALDATA) 업종 데이터와 이어 쓴다.
description_portal: 경상북도 승강기유지관리업자법인현황은 도내에서 승강기 유지관리업을 수행하는 법인 사업체의 등록 현황을 정리한 자료입니다. 주요 항목에는 법인명, 사업자등록번호, 대표자명, 전화번호, 소재지가 포함되어 있으며, 각 법인의 기본 정보와 연락처, 소재지를 통해 관내 승강기 안전관리 체계의 현황을 한눈에 파악할 수 있습니다. 본 자료는 「승강기 안전관리법」에 따라 등록된 유지관리업체를 대상으로 수집되며, 안전점검·보수·정기검사 등 승강기 관리 업무의 효율화를 지원하기 위해 제공됩니다. 데이터는 표준화된 형식으로 구성되어 있으며, 행정기관의 감독 업무 및 산업 통계 분석 자료로도 활용됩니다. 자료 관련 문의는 054-880-2340으로 하시기 바랍니다.
