summary_user: 경상남도 사천시에 등록된 대규모점포를 점포 한 곳당 한 행으로 담은 목록으로, 유형 구분·상호명·개설등록일·소재지·매장면적(제곱미터)을 기록한다(CSV 305바이트의 작은 파일). 사천시에 어떤 대형마트·쇼핑센터가 언제 어디에 얼마 규모로 들어서 있는지 확인하려는 상인·분석가가 상권 구조나 전통시장 주변 유통 환경을 볼 때 쓴다. 전역 조인 키가 없어 상호명·소재지 주소를 기준으로 전국 대규모점포 표준데이터나 소상공인 상가업소 정보와 직접 맞춰 이어 써야 한다.
limits: 공통 코드나 키가 없어 다른 데이터와 붙이려면 상호명·주소를 수작업으로 맞춰야 한다. 범위가 사천시 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하고, 매출·영업시간 같은 운영 실적은 담지 않는다.
