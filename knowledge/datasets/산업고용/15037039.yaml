summary_user: 성남시 관내 고압가스 저장소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 4.4KB)로, 상호명·지번/도로명 주소·위도·경도·고압가스 종류·인허가일자·인허가번호를 담는다. 주민이나 안전관리 담당자가 '우리 동네나 학교 주변에 어떤 고압가스 저장소가 있는가'를 확인하거나, 분석가가 시설 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위도·경도로 공간 매칭하거나 상호명·인허가번호로 LOCALDATA 에너지 업종 인허가 원장과 대조하는 방식으로만 이어 쓴다.
description_portal: 성남시내 고압가스 저장소 현황에 대한 데이터로, 상호명,주소,고압가스종류,인허가일자 등의 항목으로 구성되어 있습니다. 성남시 고압가스저장소 현황 데이터는 관내에 설치된 고압가스 저장 및 취급시설의 위치, 시설 규모, 용도, 안전관리 상태 등을 체계적으로 정리한 자료로, 도시 안전관리와 위험물 시설 행정의 기초정보로 활용됩니다. 성남시는 해당 데이터를 기반으로 고위험 시설에 대한 정기적인 안전 점검 및 재난 대응 체계를 수립하고 있으며, 특히 인구 밀집 지역 및 학교·주거지 인근의 위험시설 분포를 면밀히 분석하여 민원 대응 및 사전 예방 조치를 강화하고 있습니다.
