summary_user: 자동차 모델별 표시연비를 모델 1건당 1행으로 담은 전국 단위 원장 파일로, 제조(수입)사·차종·유형과 복합·도심·고속도로 연비, 전기차 1회충전 주행거리, 연비 등급 9개 항목으로 구성된다. 차를 고르는 소비자가 같은 차종 안에서 복합연비나 등급이 더 좋은 모델을 비교하거나, 분석가가 제조사·유형별 연비 분포를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 모델명·제조사 이름을 맞춰 연결하거나 같은 기관의 다른 효율등급 데이터와 이름 기준으로 이어 써야 한다.
