description_portal: 자동차 산업의 환경 규제 강화와 연비 개선 요구 증가에 따라, 자동차 표시연비 정보는 소비자들에게 차량의 연비 성능을 명확히 전달하는 중요한 역할을 합니다.해당 데이터는 차량의 연비 성능과 관련된 여러 가지 지표를 포함하고 있으며, 소비자들이 연비 효율이 우수한 차량을 선택하는 데 도움을 줍니다.제공되는 데이터는 모델명, 제조사, 차종, 유형, 복합연비, 도심연비, 고속도로연비, 1회충전 주행거리 및 등급 정보를 포함한 총 9종의 항목으로 구성되어 있습니다.이 데이터는 약 2,800개 이상의 차량 모델에 대한 정보로, 소비자에게 연비 성능에 대한 명확한 기준을 제시합니다.
