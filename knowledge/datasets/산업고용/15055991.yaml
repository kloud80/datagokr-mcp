summary_user: 광업등록사무소 통계집에 실린 2012년 이후 채굴권 출원 건수를 연도·광종분류(금속광·비금속광)·광종별로 집계한 전국 단위 CSV 파일(약 6KB)이다. 연구자나 자원 정책 분석가가 "최근 몇 년간 어떤 광종의 채굴권 출원이 늘었나"처럼 광종별 출원 추이를 확인하는 데 쓴다. 전역 조인 키가 없어 같은 기관의 탐사권·광업권 등록현황 통계와는 연도와 광종 이름을 맞춰서만 이어 쓴다.
