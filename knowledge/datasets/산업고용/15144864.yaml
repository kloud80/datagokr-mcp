description_portal: 한국노동연구원은 노동시장 및 고용정책과 관련된 주요 이슈를 논의하고 사회적 합의를 모색하기 위한 토론회 및 세미나를 정기적으로 개최하고 있습니다. 이러한 공개 토론의 목적은 연구 성과의 사회 환원, 정책 수요자와의 소통 강화, 현장 전문가 및 시민과의 교류 확대에 있으며, 이를 위해 연구원 대표홈페이지의 ‘토론세미나’ 게시판을 통해 행사 일정을 안내하고 참가 등록 정보를 제공합니다. 해당 공공데이터는 대표홈페이지에 게재된 행사 정보 중 첨부파일과 관련하여 첨부파일명, 유형 등의 메타정보를 포함하고 있습니다.
