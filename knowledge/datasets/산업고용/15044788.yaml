summary_user: 경상북도 관내에서 유통산업발전법에 따라 개설 등록되어 영업 중인 대규모점포를 점포 한 곳당 한 행으로 담고, 법인명·상호·업태·소재지와 건물 연면적·영업장 면적(㎡)을 수록한 약 3KB 규모의 CSV 파일이다. 지역 상권 분석가나 정책 담당자가 '경북 어느 시군에 대형마트·백화점 같은 대규모점포가 몰려 있고 매장 면적은 얼마나 되는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소나 상호를 이름으로 맞춰 이어야 하며, 전국대규모및준대규모점포표준데이터나 소상공인 상가업소 정보와 주소 기준으로 대조하는 방식으로 쓴다.
description_portal: 경상북도 관내에서 유통산업발전법에 따라 개설 등록되어 영업 중인 대규모 점포의 상세 운영 현황을 제공하는 데이터입니다. 본 자료는 지역별 유통 시설의 분포를 명확히 파악할 수 있도록 운영 법인명, 상호 및 상세 소재지 정보를 핵심적으로 포함하고 있습니다. 또한, 각 점포의 영업 형태를 구분할 수 있는 업태 정보와 함께, 시설의 물리적 규모와 실제 판매 공간의 크기를 가늠할 수 있는 건물 연면적($m^2$) 및 영업장 면적($m^2$) 수치를 상세히 수록하고 있습니다. 해당 데이터는 지역 내 상권 분석과 유통 산업의 균형 발전 도모, 소비자 편의 증진을 위한 정책 수립 및 연구 기초 자료로 활용됩니다.
