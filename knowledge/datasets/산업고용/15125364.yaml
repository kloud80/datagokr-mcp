summary_user: 창업진흥원 K-Startup의 창업지원 사업 공고를 건별로 담은 API로, 공고명·지원대상·접수기간·신청방법·담당부서 등과 사업소개·통계 콘텐츠 정보를 함께 제공하며 검증 시 전국 범위 327행을 받았다. 예비창업자나 창업기업이 지금 접수 중인 지원사업이 무엇이고 자기 업력·지역·연령에 맞는지 찾는 질문에 쓴다. 전역 조인 키는 없어서 지원 분야·지역명·주관기관 같은 이름이나 코드 매핑, 또는 같은 기관 코드로만 다른 자료와 잇고, 공고 상세 URL로 원문 공고를 확인한다.
description_portal: 해당 정보는 (예비)창업자들이 성공적인 창업을 준비하고 추진할 수 있도록 지원하기 위해 창업진흥원 기관에서 제공하는 다양한 창업지원 사업의 공고 정보를 정리한 자료입니다. 주요 항목은 사업명, 사업유형, 사업 개요, 지원대상, 모집기간, 신청방법, 문의처 등으로 구성되어 있으며, 창업자들은 이를 통해 정부의 창업지원 정책과 연계된 각종 프로그램의 세부 내용을 확인하고, 자신의 창업 단계와 분야에 맞는 맞춤형 지원사업을 탐색할 수 있습니다. 또한 사업별 소개 자료, 신청 가이드, 선정사례, 영상 콘텐츠 등 다양한 부가정보도 함께 제공되어 창업 이해도와 준비도를 높이는 데 활용 가능하며, 실무 중심의 창업전략 수립과 정책 연계형 자금·교육·멘토링 기회를 확보하는 데 실질적 도움을 주는 창업정보 서비스입니다.
