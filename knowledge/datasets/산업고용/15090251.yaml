summary_user: 한국서부발전 서인천발전소 주변에서 측정한 기온, 상대습도, 기압, 풍향, 풍속을 측정일시별로 담은 원천 기상 관측 파일(CSV, 약 59KB)이다. 발전소 인근 주민이나 환경 분석가가 '특정 날 서인천발전소 주변 바람이 어느 방향으로 얼마나 불어 배출물질이 어디로 퍼졌을까'를 살필 때 쓴다. 전역 조인 키가 없으므로 측정일시를 기준으로 같은 기관의 서인천발전소 대기오염물질 배출 측정 자료나 기상청 관측 자료와 날짜를 맞춰 이어 쓴다.
