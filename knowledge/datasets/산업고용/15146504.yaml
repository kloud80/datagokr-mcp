description_portal: '○ 통계개요* 승인통계명 : 서울특별시영세자영업경영활동통계(A seoul statistics of small business management)* 통계종류 : 일반ㆍ가공통계(승인201015)* 작성목적 : 서울의 영세자영업 사업체의 경영활동 현황, 생존율 현황, 추정매출액 현황, 종업원수 현황에 대한 기초자료를 제공하여 정책목적에 활용* 작성대상 : 서울시 영세자영업(100대 생활밀접업종_외식업/소매업/서비스업) 영위 사업체※ 영세자영업 : 개인사업자이면서 5인 미만 100대 생활밀접업종_외식업/소매업/서비스업)을 운영하는 자영업* 작성방법 : 서울시 상가업소 정보(운영점포수, 개업수, 폐업수, 종업원수, 매출액 등) 및 통계청 SBR(기업통계등록부)자료를 활용하여 지역별 추정* 작성내용 : 16개 결과표? 경영활동현황 총괄(업종별, 자치구별)? 운영 점포수 현황(종사자 규모별, 자치구별)? 개업점포수 현황(종사자 규모별, 자치구별)? 폐업점포수 현황(종사자 규모별, 자치구별)? 평균영업기간 현황(종사자 규모별, 자치구별 운영점포수)? 매출액 현황(종사자 규모별, 종사자 규모별 면적당, 자치구별, 자치구별 면적당, 업종별 면적당) 등* 조사체계 : 서울시 ⇔ 서울신용보증재단* 작성주기 : 1년* 통계간행물명 : 서울시 영세자영업 경영활동 통계* 공표범위 : 서울시 25개 자치구별, 업종별* 공표방법 : 간행물○ 기타* 관련 홈페이지 : 우리마을가게 상권분석서비스(http://golmok.seoul.go.kr)'
