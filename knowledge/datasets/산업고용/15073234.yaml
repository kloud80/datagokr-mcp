summary_user: 제주 지역 전력도매가격(SMP)을 일자 1행 단위로 담은 파일로, 하루의 최소·최대·산출평균·가중평균 가격과 1시~24시 시간대별 가격이 함께 들어 있다(CSV 약 70만 바이트). 발전사업자나 에너지 분석가가 '제주 SMP는 어느 시간대·요일에 높고 낮은가'처럼 시간대별 가격 패턴과 수급 상황을 확인할 때 쓴다. 실측 컬럼에 기관 간 공통 조인 키는 없으므로, 다른 전력 수급·발전량 자료와는 날짜(일자)와 시간대를 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 제주 지역에서 거래되는 전력도매가격(SMP, System Marginal Price) 정보를 정리한 자료입니다. 일자별 최소·최대 가격, 산출평균 및 가중평균과 함께 1시간 단위의 세부 전력가격이 포함되어 있어, 특정 시점의 가격 변동과 전력 수급 상황을 체계적으로 확인할 수 있습니다. 이를 통해 전력시장 내 공급·수요 불균형이 가격에 미치는 영향을 분석할 수 있으며, 시간대별 전력 수요 변화와 가격 패턴을 이해하는 데 유용합니다. 또한 에너지경제 연구, 전력 수급 예측, 가격 정책 수립 등 다양한 분야에서 활용 가능한 기초자료로서 의미가 있으며, 제주 지역 전력 시스템의 특성을 파악하는 데 중요한 참고 자료가 됩니다.
