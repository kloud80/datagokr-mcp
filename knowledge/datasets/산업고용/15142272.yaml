description_portal: '이 데이터는 경상북도 봉화군 내에서 이루어진 개발행위 허가 현황을 정리한 자료입니다. 각 허가 항목은 개발목적, 허가면적, 허가일자 등과 관련된 정보를 포함하고 있으며, 주요 용도로는 풍력발전단지, 태양광발전시설 등 재생에너지 관련 사업이 포함됩니다. 또한 개발행위에 대한 허가 여부, 허가면적, 허가일자 및 준공 여부 등의 정보를 제공하며, 해당 데이터를 통해 봉화군 내 개발행위 및 환경 영향을 분석하는 데 활용될 수 있습니다. 데이터는 총 8개 항목으로 구성되어 있으며, 기준일은 2025년 3월 10일입니다.허가년도: 개발행위가 이루어진 연도입니다.소재지 주소: 개발이 이루어진 부지의 주소입니다.용도(허가목적): 해당 개발행위의 주요 용도나 목적을 나타냅니다. 예: 풍력발전단지, 태양광발전시설 등.허가면적(m2): 개발행위가 허가된 면적을 제곱미터 단위로 나타냅니다.비고: 기타 특이사항이나 추가 설명이 기재된 항목입니다.지목명: 개발 부지의 토지 지목 정보입니다. 예: 임야, 전답 등.허가일자: 개발행위에 대한 허가가 이루어진 날짜입니다.준공일자: 개발행위가 완료된 날짜입니다. (완공된 데이터는 비어 있을 수 있음)'
