description_portal: 해당 데이터는 한국남부발전(주)의 한경풍력의 일일별 평균 풍속과 발전량을 기반으로 인공지능 생성모델 알고리즘을 적용하여 산출된 합성데이터입니다. 합성데이터는 원천데이터와 통계적으로 유사한 패턴을 가진 가상데이터로, 익명화와 통계적 변형 기법을 통해 개인정보 및 민감정보가 포함되어 있지 않습니다. 합성모델(CTGAN)에 따라 2018년 01월 01일부터 2024년 03월 26일까지 총 2276건의 일일별 한경풍력 1호기, 2호기, 3호기, 5호기, 6호기, 7호기, 8호기, 9호기의 평균 풍속과 발전량에 대한 데이터가 수록되어 있습니다. 해당 합성데이터를 활용하여 풍속에 따른 발전량을 추정하는 모델 등의 개발에 활용할 수 있을 것으로 기대됩니다.
