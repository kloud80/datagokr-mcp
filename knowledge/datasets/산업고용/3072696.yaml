description_portal: 해당 데이터는 한국발명진흥회 지식재산 연수사업(IP CAMPUS) 사이트(https://www.kipa.org/ipcampus)에서 신청 받아 진행하는 오프라인 교육에 대한 일정 데이터 입니다.해당 지식재산 연수사업 교육은 아래의 과정들을 포함합니다.1. 다수의 실무경험과 전문성을 바탕으로 하는 전문가를 강사로 초빙하여, 지식재산 기초부터 최신사례 및 동향등을 다루어 IP 실무 역량 향상을 위하는 일반과정2. IP관련 최근 이슈 및 현안 등을 주제로 다양한 분야의 지식재산권 담당자에 넒은 시야와 안목을 주기위한 심화과정각 교육과정은 1일에서 4일까지 다양하게 교육일이 나뉘어 있으며,  과정 및 신청자의 소속에 따라 서로 다른 교육비를 책정하고 있습니다.해당 데이터를 통해 과정및 교육일자, 시간, 교육비용등을 확인 할 수 있습니다.
