summary_user: 한국에너지공단이 인증한 급수처리시설 제품(이온교환처리장치, 음향처리장치 등)을 모델 단위로 한 행씩 담은 전국 범위의 파일 원장이며, 인증번호·인증일자·만료일자·업체명·기기종류·모델명·제조국·인증현황을 담는다. 보일러 급수처리 설비를 고르는 사업자나 시설 관리 기관이 '이 업체의 이 모델이 현재 유효한 인증 제품인가, 인증은 언제 만료되나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명·모델명 같은 이름 매칭이나 같은 기관의 인증번호 체계로만 잇는다.
limits: 표준 조인 키가 없어 다른 효율등급·인증 데이터와 묶으려면 업체명·모델명 문자열 매칭에 의존해야 한다. 지역 정보가 없는 전국·비공간 자료라 설치 위치나 지역별 분포 분석에는 쓸 수 없다.
