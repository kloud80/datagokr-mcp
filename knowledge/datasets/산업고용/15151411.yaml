description_portal: '한국지역난방공사를 대상으로 한 감사원의 정기 및 특별감사에서 도출된 지적사항을 정리한 데이터로, 감사 시기와 지적건수를 통해 기관의 경영관리 및 회계운영의 개선 필요 영역을 파악할 수 있는 자료입니다.1. 형식: CSV2. 내용 요약:■ 통보기관: 감사를 수행한 기관명(예시: 감사원)■ 감사명: 감사 주제 또는 감사의 세부명칭(예시: 2024년 감사원 공공기관 결산 및 회계감사 운영실태 감사, 공공기관 재무건전성 및 경영관리 실태)■ 감사시작일자: 감사가 시작된 날짜(예시: 2024-11-04)■ 감사종료일자: 감사가 종료된 날짜(예시: 2024-12-06)■ 조치할사항(지적건수): 해당 감사에서 도출된 지적 또는 개선 권고사항의 건수(예시: 1, 14, 3)3. 활용 예제:■ 감사원 감사 결과를 연도별로 분석하여 주요 지적 분야(회계, 경영, 행정 등)별 개선 이행률 평가■ 지적건수 데이터를 활용해 내부통제 강화 및 재무건전성 개선을 위한 사전 예방 체계 구축■ 공공기관 감사결과의 투명한 공개 및 경영책임성 제고를 위한 정책 자료로 활용'
