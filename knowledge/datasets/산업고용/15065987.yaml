description_portal: 한국가스공사의 도시가스 민수용 월별 기온효과 데이터 입니다.민수용 도시가스 수요예측 모델 개발 및 기온과 수요의 상관관계 분석, 수요변동 요인 파악, 기상리스크 관리를 목적으로 수집되었습니다. 데이터 구성항목은 2007년 1월부터 2021년 6월까지 약 15년간의 연, 월, 기온효과 지표로 이루어져 있으며, 기온이 민수용 도시가스 수요에 영향을 미치는 정도를 정량적으로 나타냅니다. 본 데이터를 활용하면 월별 기온효과 추이 분석, 계절별 기온 민감도 파악, 기온변화에 따른 수요 변동량 예측, 연도별 기온효과 변화 분석, 이상기온시 수요 영향 분석이 가능합니다. 또한 수요예측 모델 개발, 공급계획 수립, 피크 수요 예측, 기상시나리오별 수요 전망에 활용됩니다. 민수용 도시가스 수요예측의 정확도 향상에 기초자료로 활용되어 안정적인 천연가스 수급 관리와 정책 의사결정을 지원합니다.
