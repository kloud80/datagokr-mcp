description_portal: '○ 통계개요* 통계명 : 숙련노동력 구인 용이성* 통계종류 : 서울서베이의 사업체의 숙련노동력 구인 용이정도를 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의 현재상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을 모니터링 하는 한편,시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의 실효성을 객관적으로측정하여 보다 발전된 정책의 방향을 제시하는데 목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 국내 및 외국인사업체(산업별ㆍ규모별)의 기업운영에 따른숙련노동력 구인 용이 정도'
