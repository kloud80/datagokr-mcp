description_portal: 연구장비 활용을 지원하고 기술애로를 겪은 기업을 지원하기 위해 구축된 고가의 기술개발(R&D) 장비를 보유한 전국의 연구기관, 대학, 기업지원기관의 목록입니다. 이 데이터는 연구장비의 접근성을 높이고, 기업들이 필요한 장비를 신속하게 찾아 활용할 수 있도록 도와줍니다. 또한, 연구기관 간의 협력 및 장비 공동 활용을 촉진하여 기술력 향상에 기여할 수 있는 기초 자료가 됩니다. 이를 통해 기업이나 연구자는 장비에 대한 정보를 시각적으로 파악하고, 연구개발 생태계의 활성화에 이바지할 수 있습니다.  데이터는 다음과 같은 구조로 이루어져 있습니다. 번호(숫자형), 기관명(문자형), 센터명(문자형), 센터주소(문자형), 업종(문자형)으로 구성되어 있으며, 각 항목은 연구장비 지원 기관에 대한 중요한 정보를 제공합니다.
