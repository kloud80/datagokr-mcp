summary_user: 경기도 가평군에 지정된 담배소매인을 사업장 한 곳당 한 행으로 담은 건별 원장 파일로, 사업장명·인허가일자·영업상태와 도로명·지번 주소, 위도·경도를 포함한다. 가평군에서 지금 영업 중인 담배소매점이 어디에 몰려 있는지, 새 점포를 낼 자리 주변에 기존 소매점이 있는지 확인하려는 사업자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 사업장명으로 맞춰 연결하며, 다른 시군의 같은 LOCALDATA 담배소매 데이터나 소상공인 상가업소 정보와 공간 단위로 겹쳐 쓴다.
description_portal: 해당 데이터는 경기도 가평군 관내에 지정된 담배소매인 현황에 관한 자료로, 담배소매업 인허가 및 영업 상태에 대한 정보를 제공하는 공공데이터입니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태명, 소재지 도로명주소, 지번주소, 위도 및 경도, 데이터 기준일자 등이 포함되어 있으며, 이를 통해 가평군 내 담배소매점의 위치 및 운영 현황을 파악할 수 있습니다. 참고로 과거에 등록된 일부 사업장은 수기로 관리되다 보니, 사업장명 항목에 일부 공란이 있을 수 있습니다. 해당 자료는 담배소매업 관리, 영업현황 분석, 상권 조사, 정책 수립 및 관련 행정 업무 수행 등에 활용될 수 있으며, 위치 정보가 포함되어 있어 공간 분석에도 유용한 기초 자료입니다.
