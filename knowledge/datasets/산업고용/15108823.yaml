summary_user: 수원시 건축물 한 동씩 시설군·용도, 지번주소와 월별 전기 사용량(kWh)을 담은 건축물 단위 원천 자료로, 포털 설명상 2019~2021년을 다루며 연 합계·평균 열도 있다. 도시계획·에너지 분석가가 '수원시에서 어떤 용도의 건물이 여름철 전기를 많이 쓰는가' 같은 질문에 쓴다. 필드에 필지고유번호(PNU)와 시설물 고유등록번호가 있어 건축물대장·토지 자료와 이을 여지가 있지만, 실측 점검에서는 전역 조인 키로 확인되지 않아 주소나 코드 매핑으로 연결해야 한다.
description_portal: '수원시의 2019년, 2020년, 2021년 전기에너지에 대한 건축물 단위 건축물 시설군 및 용도 등의 건축물 정보와 월별 에너지 사용량(단위 : kwh) 데이터를 제공합니다.'
