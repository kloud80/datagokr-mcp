description_portal: 본 데이터는 국내 해상(바다)을 1km 격자 단위로 나누어 각 격자 중심점의 정확한 위치 정보와 해당 지역의 풍력이용률을 제공합니다. 풍력이용률(Capacity Factor)은 특정 기간 동안 풍력발전기가 실제로 생산한 전력량을 최대 생산 가능한 전력량으로 나눈 비율로, 해당 지역의 바람 자원 우수성과 풍력발전 사업의 경제성을 평가하는 핵심 지표입니다. 이 데이터셋은 정확한 해상풍력 자원 평가를 통해 국내 해상풍력 발전 사업의 최적 입지를 선정하고, 투자 타당성을 분석하며, 효율적인 풍력발전단지 개발을 촉진하는 데 그 목적이 있습니다. 또한, 불확실성이 큰 해상풍력 사업의 초기 단계에서 객관적이고 과학적인 데이터를 제공함으로써, 개발 비용을 절감하고 투자 리스크를 줄이며, 궁극적으로는 국가 신재생에너지 목표 달성에 기여합니다
