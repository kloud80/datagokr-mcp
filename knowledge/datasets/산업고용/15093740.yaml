summary_user: 국내 해상을 1km 격자로 나눈 각 격자 중심점의 위도·경도와 그 지점의 풍력이용률(USAGE_RATE)을 담는 격자별 자원 평가 데이터로, 범위는 전국 해역이고 지점은 좌표로 구분됩니다. 해상풍력 사업자나 분석가가 '어느 해역의 바람 자원이 좋아 발전단지 후보지로 적합한가'를 비교하고 초기 투자 타당성을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표를 공간 매칭하거나 같은 기관 자료와 이름으로 맞춰 이어 쓴다.
limits: 공통 조인 키가 없어 행정구역 코드나 발전소 원장과 바로 결합할 수 없고 좌표 기반 공간 결합이 필요하다. 세부 부문이 전력 수급·시장으로 분류돼 있지만 이 데이터는 실시간 수급·발전량이 아니라 격자별 풍력이용률이므로 오늘의 전력 수급 판단에는 쓰지 않는다.
