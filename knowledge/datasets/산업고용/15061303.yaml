description_portal: 한국수력원자력(주)이 공개하는 임직원 수 현황에 대한 데이터입니다. 한국수력원자력(주)은 분기별로 정규직과 무기계약직, 시니어전문직을 포함한 전체 임직원 현황을 직급과 성별에 따라 분류하여 공개하고 있습니다. 해당 임직원 수 데이터는 인원수 산정 시 단시간 근로 여부를 반영하고 있습니다. 예를 들어 주 40시간 근로자는 1명으로 산정되었으며, 주 20시간 근로자는 0.5명으로 산정되었습니다. 이 공개 데이터를 통해 한국수력원자력(주)의 임직원 규모와 성비, 직급 체계 등을 파악할 수 있습니다.
