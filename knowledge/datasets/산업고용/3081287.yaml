summary_user: 전북특별자치도 시군별로 6차산업(농촌융복합산업) 인증을 받은 경영체 수와 지역 대표 인증 사업자 사례를 담은 집계 파일(csv, 약 1KB)이다. 귀농·창업 준비자나 지역정책 분석가가 '전북 어느 시군에 6차산업 인증 경영체가 많고 대표 업체는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군 이름을 매개로 다른 시군구 단위 통계나 기업 현황 자료와 맞춰 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 내에서 농촌융복합산업, 즉 '6차 산업' 인증을 받은 경영체의 현황을 보여주는 자료입니다. 각 시군별로 인증을 받은 사업체의 총 수와 함께, 전주콩나물, 옹고집, 황수연전통식품 등 각 지역을 대표하는 주요 인증 사업자의 사례를 제시하고 있습니다. 이 자료를 통해 농업(1차)을 기반으로 가공(2차) 및 유통·체험·관광(3차)을 연계하여 새로운 부가가치를 창출하는 경영체의 분포와 규모를 파악할 수 있습니다. 농촌 경제 활성화, 귀농귀촌 및 창업 지원, 그리고 지역 특화 산업 육성 정책을 위한 중요한 기초 데이터로 활용됩니다.
