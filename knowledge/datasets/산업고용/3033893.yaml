summary_user: 중소벤처기업부에서 기술혁신형(이노비즈)·경영혁신형(메인비즈) 인증을 받은 중소기업을 기업(인증) 한 건씩 담은 전국 단위 파일로, 사업자명·대표자·업종·지역·인증만료일을 포함한다. 거래처나 투자·협력 후보 기업이 이노비즈·메인비즈 인증을 갖고 있는지, 언제 인증이 만료되는지 확인하거나 지역·업종별 혁신형 중소기업 분포를 살펴보는 데 쓴다. 사업자등록번호(bizno)를 키로 벤처기업 확인, 창업기업 확인, 공공구매 인증서 등 다른 기업 확인·인증 원장이나 기업 정보와 이어 쓴다.
description_portal: "* 중소벤처기업부에서 기술혁신형(이노비즈), 경영혁신형(메인비즈) 인증을 받은 기업 현황 정보입니다.* 이노비즈란? Innovation(혁신)과 Business(기업)의 합성어로 기술 우위를 바탕으로 경쟁력을 확보한 '기술혁신형' 중소기업을 지칭합니다. - 중소기업기술혁신촉진법에 근거, 「오슬러 매뉴얼」에 의한 2단계에 걸친 혁신성 평가를 통과하여 중소벤처기업부로부터 Inno-Biz인증을 받은 핵심 기업군*메인비즈란? Management INnovation Business를 뜻하며 국제협력기구(OECD) 기업혁신지침 「오슬로 매뉴얼」에 근거해 정부가 우수한 '경영혁신' 중소기업을 확인하는 제도* 데이터 구성요소 : 사업자명, 대표, 업종, 지역, 유효기간 순"
