summary_user: 한국남부발전이 제공하는 전국 단위 급전속보로, 거래일자별로 원자력·석탄·LNG·수력/양수·유류 등 발전원(자원)마다 설비용량·공급능력·발전량과 각각의 점유율, 평균 출력을 담은 일일 집계 데이터입니다. 에너지 분석가가 '어제 전국 발전량 중 석탄과 LNG 비중이 각각 얼마였나'처럼 일별 발전원 구성을 확인하거나 발전량 예측의 기초자료를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 전력 수급·SMP 데이터와는 거래일자와 발전원 이름을 맞춰 연결해야 한다.
description_portal: 한국남부발전은 친환경 에너지로 미래를 밝히는 글로벌 에너지 리더를 비전으로 하는 발전 공기업입니다.해당 API는 한국남부발전(주) 발전원별 점유율 급전속보 조회 서비스_GW입니다.해당 조회 서비스를 통하여 일일 단위의 각 발전원별(원자력, 석탄, 국내탄, 수력/양수, LNG(복합), 바이오(기력), 유류, 열병합 등) 발전량, 발전비율 등을 조회할 수 있습니다.해당 데이터를 활용하여 전력시장의 발전현황을 일일 단위로 분석할 수 있으며, 이를 활용하여 발전량 예측, 분석 등의 기초자료로 활용 가능합니다.
