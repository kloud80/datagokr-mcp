summary_user: 한국수력원자력이 운영하는 양수발전소 7곳(청평·삼랑진·무주·산청·양양·청송·예천)의 상·하부댐 수위, 수문 개도, 강수량 같은 실시간 수문 측정값을 항목코드·측정시간·값 단위로 담는다. 발전소 인근 하천 이용자나 수자원·전력 분석가가 "지금 무주양수 상부댐 수위와 수문 개도가 어떤가" 같은 질문을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소 이름이나 발전소 구분 코드(genName) 매핑, 같은 기관 코드로만 이어 쓴다.
limits: 호출 시 발전소 구분 코드(genName)가 필수인데 이 코드는 다른 데이터에서 정해진 값이라 먼저 확보해 넘겨야 한다. 공통 조인 키가 없어 발전소 원장이나 전력 수급 데이터와 자동으로 결합되지 않으며, 지리 좌표가 없는 비공간 자료다. 개발계정은 하루 10,000회로 호출이 제한된다.
