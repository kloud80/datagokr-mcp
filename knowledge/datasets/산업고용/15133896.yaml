description_portal: '2024년 성실경영 심층평가 평가자의 재창업연도별 평가결과 자료를 공공에 제공하여 재창업 기업 관련 통계 구축 및 재창업 활성화에 기여함을 목적으로 하는 자료입니다.세부내용은 다음과 같습니다.- 연번: 2024년 기간 동안 성실경영 심층평가가 이루어진 업체들의 순번입니다. 신청일자 기준으로 나열하였습니다.- 신청일자: 성실경영 심층평가를 신청한 날짜입니다. 재도전종합지원센터 온라인 홈페이지에 접수된 신청일자입니다.- 재창업연도: 재창업기업의 재창업연도 입니다. 일부 공란의 데이터는 예비재창업자 데이터이며, 성실경영 심층평가일 기준 아직 창업하지 않았기 때문에 공란입니다.- 결과: 24년도에 이루어진 성실경영 심층평가의 결과입니다. 통과/탈락으로 이루어져있습니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.'
