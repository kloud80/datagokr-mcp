description_portal: 외국인고용관리시스템(EPS)에서 규정하고 있는 업종별 허용 세부업종 및 사업내용은, 고용허가제(E-9 비자 등)을 통해 외국인 근로자를 고용하고자 하는 사업장에서 수행 가능한 업종을 구체적으로 나눈 분류체계입니다. 단순히 “제조업”이나 “건설업”이라는 큰 카테고리만을 허용하는 것이 아니라, 각 업종 안에서 세부업종을 규정하고 사업내용을 명시해서 어떤 형태의 작업·기능이 허용되고 어떤 것은 허용되지 않는지 기준을 마련해 두고 있습니다.제조업 내에서도 용접, 금형, 주조 등 기능직 위주의 세부업종이 허용되는 반면, 전문기술이나 고숙련 직종은 이 제도 하에서는 허용범위가 다르거나 별도의 비자제도를 적용받을 수 있습니다
