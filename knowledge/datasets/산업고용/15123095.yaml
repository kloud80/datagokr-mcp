summary_user: 한국서부발전의 전력거래 일별 일반 정산 내역을 발전소·호기·일자 단위로 담은 CSV 파일로, 각 행에 공급가능용량과 실제 전력량이 들어 있다. 분석가가 "특정 발전소 호기의 공급가능용량 대비 실제 발전량이 날짜별로 얼마나 차이 나는가"처럼 설비 가동 상태와 운영 효율을 점검하는 질문에 쓴다. 발전소명과 호기를 묶은 키(ewp_plant_unit)로 같은 기관의 다른 발전소·호기별 자료와 이어 쓰며, 지역 행정코드는 없어 지역 단위 에너지 사용량 자료와 바로 연결되지 않는다.
description_portal: 한국서부발전의 전력거래 일별 일반 정산 내역을 상세히 기록한 자료입니다. 각 발전소별, 호기별로 해당 일자의 공급 가능 용량과 실제 전력량 데이터를 확인할 수 있습니다. 이는 발전소의 전력 공급 능력과 실제 전력 생산량을 비교 분석하여 효율적인 에너지 관리를 가능하게 합니다. 특히, 공급 가능 용량과 실제 전력량 간의 차이를 분석하는 것은 발전 설비의 성능 점검, 운영 효율 개선, 그리고 향후 전력 생산 계획 수립을 할수있는 분석데이터로 활용가능 합니다.제공항목은 일자,발전소명,호기,공급가능용량,전력량 데이터를 제공합니다.
