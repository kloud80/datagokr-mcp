summary_user: 서울시 골목상권 배후지의 생활인구를 기준 분기(STDR_YYQU_CD)·상권 단위로 집계해 성별, 10대~60대 이상 연령대, 6개 시간대, 요일별 인구 수로 담는다. 서울에서 창업을 준비하는 소상공인이나 상권 분석가가 '이 상권 배후지에는 어느 연령대가 어느 시간대·요일에 많이 머무는가'를 확인해 입지와 영업시간을 정하는 데 쓴다. 전역 조인 키는 없으므로 상권 코드·상권명(TRDAR_CD)과 상권 구분 코드를 기준으로 같은 서울시 우리마을가게 상권분석서비스의 다른 데이터(점포·매출 등)와 맞춰 쓰고, 소상공인 상가업소 원장 같은 외부 데이터와는 이름·코드 매핑으로 연결한다.
description_portal: '서울시 골목상권 배후지의 생활인구 정보를 제공함. (매월 3개월 전 데이터가 적재됩니다.)* 시간대1 : 00시1분 ~ 06시, 시간대2 : 06시1분 ~ 11시, 시간대3 : 11시1분 ~ 14시, 시간대4 : 14시1분 ~ 17시, 시간대5 : 17시1분 ~ 21시, 시간대6 : 21시1분 ~ 24시**데이터량이 많아 현재 Sheet서비스는 2018년도 이후 부터 조회 가능합니다.그 이전 데이터는 File탭을 확인하시면 다운받아 확인 가능 합니다.※ 행정동 코드는 행정안전부에서 고시한 "주민등록 행정기관코드"를 사용하고 있습니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
