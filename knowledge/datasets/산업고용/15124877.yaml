summary_user: 한국남부발전이 해외에서 수행한 발전소 시운전 사업을 사업 한 건당 한 행으로 정리한 소규모 목록(CSV 약 962바이트)으로, 사업명·설비용량·계약기간·진행 현황(비고)을 담는다. 해외 발전 사업 동향을 조사하는 분석가나 사업 담당자가 '한국 발전사가 어느 나라에서 어떤 규모의 시운전 사업을 맡았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·국가명을 직접 매핑하거나 같은 기관(한국남부발전) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 한국남부발전이 해외에서 수행한 발전소 시운전 사업 현황을 정리한 자료입니다. 사업명, 설비용량(MW), 계약기간, 진행 현황(비고) 등의 정보를 포함하며, 인도, 사우디아라비아, 카타르, 쿠웨이트, 요르단 등 다양한 국가에서 추진된 프로젝트를 담고 있습니다. 이를 통해 한국 발전사의 해외 진출 사례를 확인할 수 있으며, 복합화력 중심의 발전소 건설과 운영 노하우 축적 과정을 파악할 수 있습니다. 또한 국제 에너지 산업 동향 연구, 해외 사업 전략 수립, 전력 인프라 비교 분석 등 학술·정책·산업적 활용에 기초자료로 제공될 수 있습니다.
