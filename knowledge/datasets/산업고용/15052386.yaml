description_portal: 연도별 월별 국내 연탄소비량* 동향 데이터입니다. 2012년 이후의 연도별 월별 민수용탄(연탄) 소비량에 대한 정보를 제공하고 있습니다. 매년 데이터를 업데이트 하고 있으며, 현재 1996년부터 2024년까지의 국내 연탄소비량 동향을 제공하고 있습니다. 국내 연탄소비량 데이터를 월별로 상세히 분류하여 제공함으로써 다양한 분석과 정책 수립에 활용할 수 있는 기초 자료를 제공합니다.이러한 정보는 에너지 수급 안정성 확보와 지역별 수요 예측, 그리고 연탄 공급 계획 수립에 중요한 역할을 합니다
