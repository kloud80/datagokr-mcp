summary_user: 지방자치단체가 관리하는 노동조합을 조합 한 곳당 한 행으로 담은 원장 데이터로, 조합명·형태·소재지 주소와 좌표·설립일자·소속 연합단체·대표자·조합원수·소속 사업장을 담으며 검증 시 3,061행을 받았다. 노동 분야 분석가나 지자체 담당자가 "우리 지역에 어떤 노동조합이 있고 어느 연합단체에 속하며 조합원 규모는 얼마인가"를 확인하는 데 쓴다. 소재지 도로명·지번 주소와 위도·경도로 지역 행정구역·사업장 데이터와 공간 결합하고, 제공기관코드(행정표준 기관코드)로 제공 지자체별로 묶는다.
