description_portal: e채용마당은 고용노동부 고용센터에서  인재를 채용하고자 하는 기업으로부터 온라인 채용대행 신청을 받아 고용24에 입사지원 사이트를 개설하고 채용을 대행하는  공공취업지원서비스입니다. 취업준비생과 구직자가 공공기관·대기업, 일반기업 등 다양한 채용 공고를 한 곳에서 확인할 수 있습니다.  이 서비스는 단순 공고 열람 기능을 넘어, 기관별 채용일정, 직무별 모집 요강, 전형 절차, 응시 자격, 제출서류 등 세부 정보를 구조화하여 제공하며, 일부 공고는 원서접수 시스템과 연동되어 지원 절차까지 이어질 수 있습니다. 본 자료는 채용공고명, 모집구분명, 모집분야명, 주요 업무, 접수시작일자, 종료일자, 첨부서류 정보가 있습니다.
