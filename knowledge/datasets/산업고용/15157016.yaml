summary_user: 한국중부발전이 운영하는 태양광 발전소의 호기별 일별 발전실적을 운전일자 단위로 담으며, 1시부터 24시까지 시간대별 발전량과 일합계·최대·최소 발전량을 함께 제공한다. 분석가나 에너지 사업자가 특정 날짜에 중부발전 어느 태양광 호기가 몇 시에 얼마나 발전했는지, 일조 시간대별 발전 패턴이 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전소명·호기명 같은 이름 매핑이나 중부발전 자체 발전소·호기 코드로만 연결한다.
