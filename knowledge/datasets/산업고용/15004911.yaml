summary_user: 성남시 수정구·중원구·분당구에 지정된 담배소매인 업소를 한 행씩 담은 건별 목록으로, 구별·업소명(상호)·소재지 주소·기준일자로 구성되며 포털 설명상 연간 단위로 현행화한다. 담배소매인 지정을 준비하는 사업자가 예정지 주변에 이미 지정된 소매점이 어디 있는지 확인하거나, 분석가가 구별 담배 판매점 분포를 파악하는 데 쓴다. 전역 조인 키나 사업자번호·좌표 컬럼은 없어서, 다른 데이터와는 소재지 주소를 지오코딩하거나 업소명·주소 문자열을 맞춰 LOCALDATA 담배소매업 인허가 데이터나 소상공인 상가업소 정보와 연결한다.
limits: 실측 컬럼에서 조인 키를 찾지 못해 다른 데이터와는 이름·주소 매칭으로만 연결할 수 있다. 좌표 없이 주소만 있어 영업소 간 거리 계산은 별도 지오코딩이 필요하다. 지정일·휴폐업 상태 컬럼이 없어 지정 이력이나 폐업 여부는 알 수 없다.
