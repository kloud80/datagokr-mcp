description_portal: '성남시 담배소매인 지정현황에 대한 자료는 각 구별(수정구, 중원구, 분당구), 담배소매인의 업소명(상호), 담배소매인 업소 소재지 주소 정보를 연간단위로 현행화하여 데이터로 제공합니다. 담배는 지정된 소매인만 소비자에게 팔 수 있고, 소매인 영업소 간에 일정 거리 이상을 유지해야 합니다. 성남시 지역내 담배소매인을 하려는 신청자는 담배사업법과 시행령, 시행규칙 등 관련법에 따라 사업장의 소재지를 관할하는 구청장으로부터 소매인의 지정을 받아야 하며, 폐업이나 휴업시 관련법 적용을 받습니다. 담배사업법 제16조: 담배소매인은 시장·군수·구청장의 지정을 받아야만 담배를 판매할 수 있습니다.시행령 및 시행규칙: 지정 요건, 거리 제한, 폐지 사유 등이 세부적으로 규정되어 있습니다.'
