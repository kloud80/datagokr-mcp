description_portal: 본 데이터는 국가 에너지 절약 정책의 일환인 대기전력저감 프로그램에 참여하는 제품에 대한 상세 정보를 제공합니다. 대기전력(Standby Power)은 전원을 끄거나 절전모드로 전환했을 때도 소비되는 전력으로, "숨은 전기 먹는 하마"로 불리며 불필요한 에너지 낭비를 초래합니다. 이 프로그램은 고효율 기자재 보급을 통해 이러한 대기전력을 최소화하고 에너지 효율을 향상시켜 국가 전체의 에너지 절약과 온실가스 감축에 기여하는 것을 목표로 합니다. 본 데이터는 소비자들이 대기전력 저감 성능이 우수한 제품을 쉽게 식별하고 선택할 수 있도록 정보를 제공하며, 제조사들에게는 친환경 제품 생산을 유도하는 중요한 기준이 됩니다.
