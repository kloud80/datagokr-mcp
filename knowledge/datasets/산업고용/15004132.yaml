description_portal: 매년 1월 1일부터 12월 31일까지, 한국장애인고용공단 고용개발원 EDI사이버연수원에서 운영하는 장애인고용 전문인력 양성교육에 대한 정보입니다. 본 데이터는 각 양성교육별 교육차수, 교육일시, 신청기간, 교육장소, 교육방식, 모집정원 등을 포함합니다. 각 교육과정은 직무지도원, 근로지원인, 장애인직업생활상담원을 양성하고 있으며, 자격과정에 따라 온라인 교육, 대면 집합교육, 필기시험 등 수강 방식에 차이가 있습니다. 반드시 EDI사이버연수원 홈페이지 내 공지사항을 통해 상세사항을 충분히 확인하신 후 교육신청 바랍니다.
