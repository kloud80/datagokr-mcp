summary_user: 경상남도 거창군에서 담배소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 업소명·도로명/지번 주소·위도·경도·영업구분·지정일자를 포함한다(포털 기준일 2025.07.01, CSV 약 49KB). 담배 판매점을 새로 열려는 사업자가 예정지 주변에 이미 지정된 소매점이 어디에 있는지 확인하거나, 분석가가 군내 담배 판매점 분포를 지도로 그리는 데 쓴다. 전역 조인 키는 없어서 주소나 좌표로 상가업소·인허가(LOCALDATA) 등 다른 업소 데이터와 맞춰 붙이고, 시군명으로 다른 시군의 같은 현황과 이어 쓴다.
description_portal: '경상남도 거창군의 담배소매인 지정 현황에 대한 데이터로써, 거창군의 담배소매인 지정 업소명, 거창군의 담배소매인 지정 업소 주소,  거창군의 담배소매인 지정 위도,  거창군의 담배소매인 지정 경도, 거창군의 담배소매인 지정 영업구분, 거창군의 담배소매인 지정 데이터기준일 데이터를 제공합니다.○ 데이터기준일 : 2025.07.01.○ 담배소매인은 담배사업법에 따라 담배를 직접 소비자에게 판매할 수 있도록 지정을 받은 사람을 말합니다. 담배소매인 지정을 받기 위해서는 소정의 절차를 거쳐야합니다.'
