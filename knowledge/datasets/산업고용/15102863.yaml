description_portal: '도시가스 중기 수요전망(5개년) 기준 권역별 보급률은 2022년부터 2026년까지의 각 권역별 가정용 도시가스 보급률을 퍼센트(%) 단위로 정리한 데이터입니다.* 권역: 강원권, 수도권, 영남권, 제주, 중부권, 호남권보급률을 구하는 공식은 (당해 권역별 가정용 수요가수/가정용 공급권역 내 세대수)입니다.해당 데이터와 함께 참고할 수 있는 자료로는 [도시가스 용도별 권역별 중기 수요전망(5개년)], [도시가스 중기 수요전망(5개년) 기준 권역별 가정용 수요가수]가 있습니다.본 데이터를 활용하면 권역별 보급률 비교 및 격차 분석, 저보급 지역 식별 및 확대 전략 수립, 보급 목표 설정 및 달성도 평가, 공급망 확충 우선순위 결정에 기초자료로 활용할 수 있어 도시가스 보급 확대와 에너지 복지 향상에 기여할 것으로 기대됩니다.'
