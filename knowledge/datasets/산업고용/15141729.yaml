summary_user: 음성군에서 태양광발전소로 허가를 받았지만 아직 준공되지 않은 사업부지를 부지 한 건씩 담은 원천 목록이며, 도로명·지번 주소와 허가면적(제곱미터), 허가일자, 허가내용, 준공여부, 전력량, 데이터기준일자가 들어 있다. 주민이나 개발사업자가 '우리 동네 어느 부지에 태양광 허가가 났는데 아직 공사가 끝나지 않았나'를 확인하거나, 분석가가 군 안의 미준공 허가 물량과 용량을 파악할 때 쓴다. 전역 조인 키가 없어 주소를 기준으로 전국태양광발전소전기사업허가정보 표준데이터 같은 발전소 원장이나 지번 기반 토지 정보와 이름·주소 매칭으로 잇는다.
