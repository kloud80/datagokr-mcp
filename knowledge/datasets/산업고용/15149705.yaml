summary_user: 한국수력원자력 원자력 발전소의 호기별 연속운전 현황을 담은 파일(csv, 약 4KB)로, 최근 발전정지 기간·사유, 계통 재연결일, 이번 주기 운전일수와 총 연속운전일수, 무정지 안전운전(OCTF) 일수, 계획예방정비(OH) 착수일과 기념일 도달 여부를 기준일 시점으로 정리한다. 일반 국민이나 에너지 분석가가 '어느 원전 호기가 정지 없이 가장 오래 운전 중이며 최근 언제 왜 멈췄는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 발전소 데이터와는 발전소명·호기 이름을 맞추거나 같은 기관(한수원) 자료끼리 이어 쓴다.
description_portal: '이 데이터는 한국수력원자력(주)의 원자력 발전소 연속운전 일수 자료입니다. 연속운전일수란 발전소가 중단없이 안정적으로 운전되었음을 보여주는 지표로서 수치를 통해 원자력에 대한 이해 없이도 발전소의 성과를 직관적으로 이해할 수 있는 지표입니다. 이 지표를 통해 원자력 발전이 단지 기술적 설비를 넘어, 철저한 운영과 관리에 기반한 고신뢰 에너지 시스템임을 알 수 있습니다. 이 데이터는 다음과 같은 항목을 포함하고 있습니다. ○ 발전소, 호기, 최근 발전정지 주기, 정지시작일, 정지종료일, 발전정지 사유, 계통 재연결일, 결과, 추가일자, 연속 OCTF 일자, 이번주기 계통연결 또는 재가동일, 운전일자, 총 연속운전일자, OH 착수일, 기념일 도달시점, 이번주기 기념일 도달여부, 기준일 ○ 무정지 안전운전(OCTF, One Cycle Trouble Free): 1주기(APR1400 기준 약 500일) 동안 발전정지 없이 원자로를 연속적으로 안전 운전한 실적원자력 발전소 연속운전일수 자료를 정기적으로 제공함으로써 원자력에 대한 긍정적인 인식을 확산시켜 안전문화 정착을 위한 신뢰 기반을 마련하기 위해 해당 데이터를 공개합니다.'
