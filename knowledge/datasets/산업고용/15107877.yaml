description_portal: 이 데이터는 중소벤처기업진흥공단 수출바우처사업의 지역별 우선선정 및 가점 현황을 수집·정리한 자료다.지역본(지부)별로 적용되는 우대요소, 정책가점, 혁신형 기업 가점 기준 등 을 한눈에 확인할 수 있다.데이터는 연도별·지역별 기준으로 구성되어 있으며, 각 지역의 산업특성·수출역량·정책우대 현황을 비교 분석할 수 있다.이를 통해 수출바우처 선정 과정의 지역균형성 평가, 정책 우대효과 검증, AI 기반 우선지원모델 설계 등에 활용 가능하다.CSV 파일 형태로 제공되어 통계 분석 및 시각화 작업에 용이하며, 매년 8월 기준으로 최신화된다.본 데이터는 수출지원정책 평가, 지역별 기업선정 기준 검토, 가점체계 개선 연구 등 다양한 정책활용에 사용될 수 있다.
