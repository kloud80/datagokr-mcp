description_portal: 한국가스공사 사업소별 에너지경영협의체의 연도별 활동범위 및 경계에 관한 자료입니다. 에너지경영협의체는 에너지경영시스템(ISO 50001) 운영을 위한 조직으로, 활동범위와 경계를 명확히 설정하여 체계적인 에너지 관리를 수행합니다. 본 데이터는 에너지경영 범위 관리 및 체계적 운영을 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 지역분류 코드, 대상연도, 사업소코드, 구분, 포함내용 등이 포함되어 있습니다. 본 데이터를 활용하면 에너지경영협의체 범위 및 경계 확인, 사업소별 에너지 관리 대상 파악, 에너지경영시스템 인증 범위 검토, 협의체 운영 계획 수립에 기초자료로 활용할 수 있어 체계적인 에너지경영 운영과 관리 효율화에 기여할 것으로 기대됩니다.
