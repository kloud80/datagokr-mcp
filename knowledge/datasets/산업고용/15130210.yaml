description_portal: 본 데이터는 글로벌 LNG 시장에서 아시아 대륙의 LNG 수입 물량 및 원산지별 거래 현황을 연도별로 체계적으로 정리한 국제 에너지 무역 통계 자료입니다. Energy Institute에서 매년 발표하는 세계 에너지 통계 리뷰 데이터를 기반으로 아시아 지역 LNG 거래 흐름을 분석하여 독립적인 데이터셋으로 가공 및 제공합니다. 데이터 항목으로는 연도, 원산지국, 수입량, 전체 대비 수입 비중 등이 포함됩니다. 아시아는 한국, 일본, 중국, 대만 등 세계 최대 LNG 수입 지역으로서 글로벌 시장 분석의 핵심 대상입니다. 이 데이터를 통해 아시아 LNG 시장의 거래 흐름과 주요 공급국 다변화 추이, 연도별 수입량 변화를 종합적으로 파악할 수 있으며, 국내 LNG 도입 전략 수립 및 아시아 에너지 시장 정책 연구에 핵심 기초자료로 활용될 수 있습니다.
