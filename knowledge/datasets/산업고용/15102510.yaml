summary_user: 한국전력공사 전기차충전서비스시스템이 관리하는 충전소의 충전 이력을 충전기 단위 건별로 담으며, 충전량·충전시간·충전 시작·종료 시각과 충전기 용량·방식, 주소 기준 전국 범위의 위치 정보를 포함한다. 분석가나 연구자가 '어느 지역·어느 시간대에 급속 충전기 이용이 몰리는가' 같은 시간대별·지역별·충전기별 이용 패턴을 따질 때 쓴다. 전역 조인 키는 없어 다른 충전소 데이터와는 충전소ID·충전기ID 같은 한전 자체 코드나 충전소명·주소, 시도·시군구 이름 매칭으로만 잇는다.
description_portal: 한국전력공사 전기차충전서비스시스템에서 관리하고 있는 충전소의 충전량 데이터 입니다.데이터는 시도, 구군, 본부, 사업소, 충전소ID, 충전소명, 주소, 충전기ID, 충전기명, 용도, 충전기용량, 충전기방식, 충전구분, 충전량, 충전시간(시), 충전시간(분), 충전종료일, 충전시작시각, 충전종료시각 항목으로 구성되어 있습니다.해당 데이터를 통하여 충전량을 비롯한 세부적인 시간 정보까지 확인 가능하기때문에 시간대별, 지역별, 충전기별로 다양한 분석과 연구의 기초자료로 활용할 수 있습니다.본 데이터는 대용량 데이터 입니다. 샘플을 먼저 확인하시고 활용신청을 통해 원본데이터를 요청하셔야 합니다.
