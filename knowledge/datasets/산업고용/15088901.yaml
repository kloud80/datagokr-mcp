description_portal: ‘플랫폼 경제종사자 규모 추정과 특성 분석 원자료’는 배달, 대리운전, 택시운전 등 4개 주요 직종에 종사하는 플랫폼 노동자들의 근로실태를 파악하기 위한 기초조사 자료입니다. 해당 데이터는 공공데이터 포털을 통해 수요자 요청에 따라 제공되며, 실제 연구보고서 작성에 활용된 원천 데이터를 기반으로 구성됩니다. 주요 내용은 직종별 종사자의 소득, 근로시간, 고용형태, 사회보험 가입 여부, 일 만족도 등 플랫폼 노동자의 근로 특성과 경제적 조건에 대한 실태를 포함합니다. 이 자료는 플랫폼 노동 정책 수립, 보호제도 마련, 직종 간 비교분석 등에 활용되며, 플랫폼 경제의 구조적 이해를 위한 실증 기반을 제공합니다.
