description_portal: 본 데이터는 한국중부발전이 유연탄 연료 구매 시 제시하는 입찰 규격 정보를 정리한 자료입니다. 항목은 항목명, 단위, 저열량탄 범위, 고열량탄 범위로 구성되어 있으며, 포함된 항목으로는 총수분(Total Moisture), 휘발분(Volatile Matter), 고정탄소(Fixed Carbon), 유황함량(Total Sulphur), 분쇄도(Grindability), 발열량(Gross Calorific Value), 잔발열량(Net Calorific Value) 등이 있습니다. 또한 석탄 품질 기준의 표준 단위로 기건기준(Air Dried Basis)과 도착기준(As Received Basis)을 사용합니다. 해당 자료는 발전용 연료의 품질 검토, 입찰 조건 비교, 공급업체 평가, 최적 연료선정 전략 수립 등에 활용 가능합니다.
