description_portal: '"본 데이터는 한국산업기술기획평가원(KEIT)이 추진하는 산업기술 연구개발 프로그램을 사업 단위로 정리한 현황 자료입니다. 각 항목에는 사업의 명칭과 추진 목적이 함께 제시되며, 지원하려는 기술·과업의 범위가 어떤 내용으로 구성되는지 서술형으로 확인하실 수 있습니다. 수행 주체 측면에서는 기업, 대학, 연구기관 등 신청 가능한 기관 유형과 적용 규정 근거가 포함되어 있어 참여 가능 여부를 검토하는 데 유용합니다. 더불어 과제당 규모, 개발기간 등 지원 조건 정보가 담겨 있어 공모 준비 단계에서 요구 사항을 사전에 점검할 수 있습니다.재정 규모는 신규·계속·합계로 구분된 금액이 억원 단위로 제공되므로, 사업 간 투자 비중을 비교하거나 연도별 예산 계획을 수립할 때 근거로 활용하기 좋습니다. 일정 정보 역시 공고, 접수, 평가, 협약 및 사업비 지급 단계별 시작·종료 날짜가 포함되어 있어, 공모 참여 일정 관리, 내부 결재 및 문서 준비, 평가 대응 계획, 협약 체결 이후 집행 로드맵 수립까지 한 번에 연결할 수 있습니다. 정책·기획 담당자는 다수 사업의 추진 시기를 조정하거나 지원 체계 변화를 점검하는 데 참고할 수 있고, 수행기관은 적합한 사업을 선별해 신청 전략을 세우는 자료로 활용하실 수 있습니다."'
