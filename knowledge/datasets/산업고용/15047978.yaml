summary_user: 광주광역시 관내에 등록된 자동차전문정비업 사업자를 한 곳당 한 행으로 담은 파일이며, 2025년 12월 31일 기준 1,099개소의 정비형태·상호·주소(도로명 또는 지번)를 담는다. 운전자가 집 근처 전문정비업소를 찾거나, 분석가가 자치구별 정비업소 분포를 볼 때 쓴다. 공통 조인 키가 없어 같은 기관의 종합·소형정비업 현황 파일과는 상호·주소로 맞춰 이어 쓰고, 다른 데이터와 이으려면 주소를 정제하거나 지오코딩해야 한다.
description_portal: '광주광역시 관내 자동차"전문"정비업 현황입니다.자동차관리법에 따라 등록된 자동차관리사업자 중 자동차전문정비업 등록현황 자료이며, 각 사업자별 정비형태, 상호명, 사업자주소(소재지 도로명 또는 구주소) 항목을 제공합니다.* 정비형태 구분 : 종합,소형,전문정비업(각 정비형태 구분별로 공공데이터가 별도 등록되어 있습니다.)* 등록기준일 : 2025년 12월 31일* 등록사업자 수 : 총 1,099개소* 자동차관리사업 등록은 등록소재지 관할 자치구청에서 등록/변경 등이 가능함을 알려드립니다.'
