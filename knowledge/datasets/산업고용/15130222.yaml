description_portal: 글로벌 천연가스 및 LNG 거래 시장에서 20년 이상의 장기계약을 통해 거래되는 LNG 물량과 달리 LNG 카고 단위 또는 단기간 동안의 계약을 통해 거래되는 LNG 물량을 수입국 중심으로 정리하였다. LNG 단기거래 물량은 해당 시기의 시장 수급 현황, 계절성, 지정학적 요인 등 시장 영향 요인들을 반영해 천연가스의 특성을 알 수 있다.해당 단기거래 자료는 국제 LNG 수입자협회(GIIGNL)의 연간 공개 리포트의 장단기 거래 데이터를 바탕으로 이루어져 있으며, 연간 리포트들의 데이터를 취합 및 가공하여 수입국 중심의 단기거래 물량 및 비중을 독립적인 데이터 형태로 구성하였다
