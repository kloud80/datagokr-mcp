description_portal: ㅇ 한국전력거래소는 전력을 생산하는 발전사업자, 전력을 수요지까지 전달하는 송배전사업자, 전력을 구매하여 판매하는 판매사업자, 전력을 사용하는 소비자 등으로 구성되는 전력시장에서 전력의 판매 및 구매 활동을 실시간으로 운영, 감시하는 "전력시장 운영 업무"와 전력 수요에 맞춰 전력 생산량을 결정하고 이를 안정적으로 수요지에 공급되도록 하는 "전력계통 운영 업무"등을 전담하고 있습니다.ㅇ 해당목록은 시간단위 전국 발전단 수요 데이터이며 수요예측용 잠정자료임을 알립니다.해당 날짜와 24시간의 전력수요 값을 제공합니다.단위 :MWhㅇ 해당 데이터는 육지 및 제주를 모두 포함한 데이터입니다.ㅇ 20240807 데이터 목록명이 시간별 전력수요량에서 시간별 전국 전력수요량으로 변경되었습니다.
