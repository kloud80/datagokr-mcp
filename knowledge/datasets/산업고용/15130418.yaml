description_portal: '본 데이터는 한국에너지공단에서 수행하는 기후대응 사업 및 정책에 대한 이용자들의 만족도 조사 결과를 제공합니다.조사는 이용자의 다양한 의견과 평가를 수렴하여 공단의 기후대응 정책과 사업을 개선하고, 서비스 품질 향상을 위한 기초자료로 활용하기 위해 실시됩니다.주요 제공 항목으로는 응답자의 익명성을 보장하는 개별 구분번호, 만족도 점수(1~5점으로 1: 매우 불만족, 2: 불만족, 3: 보통, 4: 만족, 5: 매우 만족), 응답자가 추가적으로 자유롭게 의견을 제시할 수 있는 주관식 항목 및 답변일자 등으로 구성되어 있습니다.본 데이터는 정부 및 연구기관이 국민의 정책 만족도와 의견을 분석하고, 향후 기후대응 사업 기획과 정책 수립 시 참고자료로 적극적으로 활용할 수 있습니다.'
