description_portal: 이 데이터는 서울특별시 광진구 관내에서 통신판매업으로 인허가를 받은 업소에 대한 정보를 제공합니다. 통신판매업이란 TV홈쇼핑, 인터넷 쇼핑몰, 모바일 앱, 카탈로그, 신문잡지, 우편 등과 같은 비대면 방식으로 소비자에게 상품을 홍보하고 판매하는 영업 행위를 의미합니다.데이터에는 업소의 상호, 사업장 소재지, 인허가 일자, 업종 형태, 영업 상태 등이 포함되며, 판매 품목은 가전, 의류, 식품, 생활용품 등 다양합니다.해당 정보는 지역 내 전자상거래 및 비대면 유통산업 동향 파악, 소비자 보호 및 통신판매업 관리 정책 수립 등에 활용될 수 있습니다.※ 본 데이터는 중부원점TM(EPSG:2097) 좌표계 기반의 위치 정보를 포함하고 있으며 위도 및 경도는 제공되지 않습니다.※ 제공된 데이터는 3일 전 기준 최신 현황을 반영하고 있습니다.
