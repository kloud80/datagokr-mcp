description_portal: '중소벤처기업진흥공단 재도약성장처에서 수행하는 성실경영평가의 외부기관별 접수현황입니다.본 데이터는 2024년 기준 01~12월내의 자료로 구성되었습니다.성실경영평가는 홈페이지인 재도전종합지원센터를 비롯하여 외부채널인 중소벤처기업진흥공단의 BPMS, 신용회복위원회 재창업자금, 창업진흥원 재도전성공패키지 등의 사업을 위해 평가를 수행하고 있습니다.데이터 컬럼에 대한 설명은 다음과 같습니다.- 접수일자: 성실경영평가 의뢰일을 나타냅니다.- 외부채널명: 외부채널에서 성실경영평가를 필요로하는 사업명을 나타냅니다. (재창업자금, 재도전성공패키지 등)- 외부기관명: 외부채널의 기관명을 나타냅니다 (중소벤처기업진흥공단, 신용회복위원회 등)- 총 접수건: 같은 접수일자에 같은 기관의 채널을 통해 접수된 건수를 나타냅니다.'
