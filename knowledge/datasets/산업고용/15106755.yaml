summary_user: 서울특별시 성북구의 산업 분류별 사업체 수와 종사자 수를 구 전체와 돈암1동·정릉1동·석관동 등 20개 행정동별 열로 나눠 담은 집계 통계 파일(csv)이다. 지역경제 담당자나 분석가가 '성북구에서 어느 행정동에 어떤 산업의 사업체와 일자리가 몰려 있는가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 산업 분류 이름이나 행정동 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 서울특별시 성북구의 산업별·행정동별 사업체 수와 종사자 수를 정리한 통계자료로, 사업체보고서를 기반으로 작성되었습니다.자료에는 전 산업을 포함한 제조업, 건설업, 서비스업 등 세부 산업 분류별 사업체 수와 종사자 수가 포함되어 있으며, 돈암동, 안암동, 정릉동, 석관동 등 행정동 단위로 세분화되어 있습니다.본 데이터는 성북구의 지역 산업 구조, 일자리 분포, 경제활동 현황을 파악하는 데 활용될 수 있으며, 지역경제 활성화 정책 수립, 산업별 일자리 통계 작성, 중소기업 지원정책 개발 등 다양한 공공 및 연구 분야에서 활용 가치가 높은 기초 행정데이터입니다.
