summary_user: 전국 LPG 판매소를 업소 한 곳당 한 행으로 담은 건별 파일 데이터로, 업소명·주소·일련번호를 싣고 검증 수신 기준 4,542건이다. 입지 선정이나 GIS 분석을 하려는 분석가가 우리 지역에 LPG 판매소가 어디에 몇 곳 있는지 확인하는 질문에 쓴다. 주소(address)가 조인 키라서 주소 기반 지오코딩이나 다른 에너지 업종 인허가 자료와 주소로 맞춰 이어 쓴다.
description_portal: '본 데이터는 국민이 제공신청 한 데이터입니다.한국가스안전공사가 수집 및 관리하는 전국에 위치한 LPG 판매업체 현황을 공개하여 국민분들의 실생활에 도움을 드리고자 제공하는 데이터입니다.해당 데이터는 LPG 판매소의 업소명, 판매소의 주소, 일련번호 등의 정보를 제공하고 있습니다.판매소 운영 현황, 입지 선정, GIS 서비스 등에 활용할 수 있습니다.※ 해당 정보는 타 유관기관에서 자체 수집, 관리를 통해 제공하는 정보와 일부 상이할 수 있음을 참고 바랍니다.※ 현재 일부 업소의 경우 일련번호가 공란으로 처리되어 있으니 참고 바랍니다.-데이터 기준일자 : 2024년 3월 5일'
