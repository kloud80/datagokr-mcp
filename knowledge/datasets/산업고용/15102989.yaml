summary_user: 1991~2021년 천연가스 판매실적을 바탕으로 연도별·용도별(주택용, 산업용, 발전용, 도시가스 통합 등 10개 용도) TDR, 즉 연중 최고 판매 월 판매량을 최저 판매 월 판매량으로 나눈 비율을 전국 단위로 정리한 집계 파일이다. 에너지 분석가가 '주택용 가스 수요의 계절 변동이 산업용·발전용보다 얼마나 크고, 그 차이가 해마다 어떻게 달라졌나'를 비교하거나 피크 수요 대비 저장·공급 설비 계획의 기초자료로 쓴다. 전역 조인 키는 없고, 다른 연도별 가스 판매량·수급 자료와 연도 값을 맞춰 붙여 쓰는 정도로만 연결한다.
limits: 연도별 비율만 담고 월별 판매량이나 지역별 값은 없어 최고·최저 월이 언제였는지, 지역 간 차이가 어떤지는 알 수 없다. 전국·비공간 집계이고 공통 코드 키가 없어 다른 데이터와는 연도나 이름 매핑으로만 붙는다. 세부 부문은 전력 수급(실시간·일별)으로 분류돼 있지만 실제 내용은 연 단위 과거 집계다.
