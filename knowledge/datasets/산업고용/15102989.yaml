description_portal: '천연가스 용도별 TDR은 1991년부터 2021년까지 천연가스 판매실적의 연도별 용도별 TDR을 정리한 데이터입니다.* 용도: 주택용, 산업용, 일반용, 열병합용, 수송용, 직공급, 업무난방용, 냉방용, 도시가스 통합, 발전용TDR(Top Down Ratio)은 (연중 최고 판매 월의 판매량 / 연중 최저 판매 월의 판매량)으로 정의되며, 천연가스의 용도별 소비 특성을 나타냅니다.도시가스의 경우 연중 최고 판매 월은 1월 또는 12월, 최저 판매 월은 8월 또는 9월인 경우가 많은 특성이 있습니다.본 데이터를 활용하면 용도별 수요 계절 변동성 비교 분석, 피크 수요 대비 공급 역량 평가, LNG 저장시설 운영 계획 수립, 사업 계획 및 의사결정 지원에 기초자료로 활용할 수 있어 천연가스 수급 안정성 확보와 효율적 설비 운영 계획 수립에 기여할 것으로 기대됩니다.'
