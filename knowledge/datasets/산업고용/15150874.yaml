summary_user: 경기도 내 공공공사에 적용할 신기술·특허 공법의 선정 공고를 공고 한 건씩 담은 자료로, 기술분류명(교량·아스팔트 포장·옹벽 등), 공고번호, 제목, 작성일, 공고기관부서로 구성된다. 건설·토목 업체나 기술 보유 기업이 '이번에 경기도 어느 부서가 어떤 분야 신기술·특허 공법을 선정 공고했나'를 확인해 입찰이나 기술 영업을 준비하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공고기관부서 이름이나 기술분류명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 신기술 또는 특허 공법이 적용될 예정이거나 선정된 기술에 대한 공고 정보를 수록한 자료로, 기술분류명, 공고번호, 제목, 작성일, 공고기관부서 항목으로 구성되어 있습니다. ‘기술분류명’은 건설, 토목, 방재 등 기술의 세부분야를 구조적으로 표현하며, ‘공고번호’와 ‘제목’은 각각 고유 식별자와 공고의 핵심 내용을 나타냅니다. 작성일은 공고일자이며, ‘공고기관부서’는 해당 공고를 발행한 지방자치단체나 관련 부서를 명시합니다. 이 데이터는 신기술 활용 및 도입 계획 수립, 공공공사 입찰 준비, 기술개발 성과 평가, 지자체별 기술 적용현황 분석 등에 활용될 수 있으며, 건설 및 인프라 분야의 기술 수요 예측에도 유용한 자료입니다. 기술 명칭은 '교량', '아스팔트 포장', '옹벽' 등 구체적이고 실무 중심의 내용으로 구성되어 있어 현장 중심의 분석과 적용에 적합합니다.
