summary_user: 한국동서발전이 일자별로 액화천연가스·석탄·중유 연료원별 발전량(MWh)을 나눠 담은 일 단위 집계 파일로, 포털 설명상 2015~2019년 기간을 다룬다. 연구자나 분석가가 '이 기간 동서발전의 LNG와 석탄 발전 비중이 계절별로 어떻게 달라졌나' 같은 연료별 발전 추이·탄소배출 산정 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 일자 기준으로 다른 일별 전력 수급·연료가격 자료와 맞추거나 같은 기관 자료와 이름으로만 이어 쓴다.
description_portal: 한국동서발전의 2015년부터 2019년까지 원료원별 일별 발전량 정보 데이터입니다. 해당 데이터는 일자별로 액화천연가스(LNG), 석탄, 중유 등 주요 연료원을 기반으로 한 발전량(MWh)을 구분하여 제공합니다. 에너지원별 발전량을 일 단위로 제공함으로써 계절, 연료 가격, 수요 변동 등에 따른 에너지 사용 경향을 정밀하게 분석할 수 있습니다. 학계 및 연구기관에서는 시간에 따른 연료별 발전 추이 분석, 연료 선택의 경제성 비교, 배출가스 예측 모델링, 탄소배출량 산정 연구 등에 활용할 수 있으며, 에너지믹스 전략 수립과 기후변화 대응정책 연구의 기초자료로도 유용합니다. 특히 탄소중립 및 에너지 전환 정책 수립을 위한 기반 분석 자료로 적합합니다.
