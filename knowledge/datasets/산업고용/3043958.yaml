summary_user: 여수시 관내 LPG(자동차용 부탄) 충전소와 주유소를 업소 한 곳당 한 행으로 담은 현황 파일로, 구분·상호·소재지(도로명 주소)·전화번호·기준일자를 담는다. 여수에서 차량용 LPG를 넣을 수 있는 충전소나 가까운 주유소의 위치와 연락처를 찾는 주민·운전자, 시 단위 연료 판매시설 분포를 정리하는 분석가가 쓴다. 전역 조인 키가 없어 오피넷 유가나 전국 주유소 표준데이터와는 상호명·주소를 맞춰 대조해야 한다.
description_portal: 1. LPG 충전소 및 주유소 현황은 2026년 2월까지 수집된 여수시 관내 데이터를 대상으로 합니다. 1-1) LPG충전소는 자동차용부탄(LPG) 충전소를 의미하며, 일반적인 의미의 LPG차량을 충전가능한 장소입니다. 다만, 천연가스 충전소는 CNG충전소로 별개데이터를 확인하여야 합니다. 1-2) 주유소는 휘발유, 경유, 등유(일부 주유소에 한정)를 판매하는 석유판매업 등록을 마친 장소를 의미합니다. 다만, 선박용 경유 등은 일반대리점을 별도로 확인하여야 합니다.2. 충전소와 주유소 현황은 다음 정보를 포함하여, 공공데이터로 활용이 가능합니다. - 연락처 - 도로명 주소
