summary_user: 경상북도 청도군이 관내에서 담배 소매인으로 지정한 업소를 업소별 한 행으로 담은 건별 원천 파일로, 업소명·지번/도로명 주소·민원구분·지정일자·데이터기준일자를 담는다(csv 약 23KB). 청도군 안에서 학교나 청소년 시설 주변에 담배소매점이 얼마나 몰려 있는지, 어느 읍·면에 소매점이 새로 지정되었는지를 확인하려는 행정 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 업소명을 맞춰 붙여야 하며, 같은 업종의 지방행정 인허가(LOCALDATA) 담배소매업 원장이나 소상공인 상가업소 정보와 주소 기준으로 이어 쓴다.
description_portal: 경상북도 청도군 관내 담배 소매인 지정 현황에 대한 정보를 제공합니다.이 자료는 「담배사업법 시행령」 제7조의3에 따라, 지방자치단체장이 관할 지역 내에서 **담배를 소매로 판매할 수 있는 사업자(소매인)**를 공식적으로 지정한 내역을 기록한 것입니다.해당 데이터에는 지정이 완료된 담배소매업소의 상호명, 사업장 주소(도로명 또는 지번 주소), 담배 소매인 지정일자 등의 항목이 포함되어 있으며, 지정일자 기준으로 현재까지의 운영 여부 및 지정 변동 사항을 시간 순으로 파악할 수 있도록 구성되어 있습니다. 해당 데이터는 청소년 보호 정책 수립, 금연구역 설정, 공중보건 증진, 지역 유통 구조 파악, 담배 유통질서 유지 등의 행정 목적으로 활용되며,지도 기반 시각화(GIS) 시스템에 연계하여 지역 내 담배소매점 분포, 학교 및 청소년 보호시설 인근 업소 현황, 소매점 과밀 또는 공백 지역 분석 등 공간 기반의 정책 수립에도 효과적으로 활용될 수 있습니다.
