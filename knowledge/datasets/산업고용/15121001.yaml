summary_user: '산업안전포털에 게시된 국내재해사례 게시물을 건별로 담으며, 게시판 종류(제조업·건설업·조선업 등), 제목, 본문 내용, 첨부파일 건수, 게시판 번호를 전국 범위로 제공한다. 안전관리자나 사업주가 "우리 업종(예: 건설업)에서 최근 어떤 유형의 재해가 났고 원인과 예방대책은 무엇인가"를 찾아 안전교육 자료로 쓰는 데 활용한다. 실측 컬럼에 전역 조인 키가 없어 다른 산재 통계와 연결하려면 업종명 같은 이름 매핑에 의존해야 하며, 게시판 번호(boardno)는 이 게시판 안에서만 쓰는 식별자다.'
limits: 전역 조인 키가 없어 사고사망·중대재해 통계 등과 코드로 직접 결합할 수 없고, 이름 매핑이나 같은 기관 기준으로만 연결된다. 지역 구분이 없는 전국·비공간 자료라 지역별 분석에는 맞지 않는다. 개발계정은 하루 1,000회까지 호출할 수 있다.
