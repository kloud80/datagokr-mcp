summary_user: 전라남도 시군에 있는 노동조합을 조합 하나당 한 행으로 담은 파일(csv, 약 16KB)로, 관할 행정관청·조합명·사업장명·설립일·조합원수·상급단체를 담는다. 노동 분야 연구자나 지역 정책 담당자가 '전남 지역 노동조합은 어느 상급단체에 얼마나 속해 있고 조합원 규모는 어떤가'를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정관청명이나 사업장명 같은 이름 매핑으로만 이어 쓰며, 전국노동조합표준데이터와 같은 조합 단위 원장으로 견줘 볼 수 있다.
description_portal: '- 전라남도 시군에 위치한 노동조합 현황 (조합명, 조합원수, 사업장명,설립일 등)에 관한 데이터를 조회하실 수 있습니다.- 정보 접근 : 전라남도 내 노동조합의 구체적인 정보는 해당 노동조합의 공식 웹사이트나 전라남도 노동청을 통해 확인하실 수 있습니다.- 연대 활동 : 여러 노동조합이 연대하여 지역 사회의 다양한 이슈에 대응하는 경우가 많으므로, 관련 단체들의 협력 활동도 주목할 필요가 있습니다.- 정기적인 소통 : 노동조합의 활동은 정기적인 총회나 회의를 통해 회원들과의 소통을 강화하고 있습니다.- 전라남도 내 노동조합의 구체적인 현황이나 특정 분야에 대한 정보가 필요하시면, 해당 노동조합의 공식 채널을 통해 직접 문의하시기 바랍니다.'
