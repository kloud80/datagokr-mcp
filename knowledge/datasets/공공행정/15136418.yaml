summary_user: 경기도 공유서비스 플랫폼에 등록된 강좌·프로그램·시설 같은 공유자원을 자원 한 건씩 담은 목록으로, 자원명·제공 기관·지역·주소·위경도와 이용료·무료 여부·신청 인원 제한·접수 기간·예약 가능 여부를 함께 담는다. 경기도민이 우리 동네에서 지금 예약할 수 있는 무료 강좌나 대관 시설이 어디에 있는지 찾거나, 분석가가 시군별 공유자원 분포와 유료·무료 비율을 비교하는 데 쓴다. 전역 조인 키는 없어서 기관코드(inst_cd)·지역코드를 같은 기관 코드 체계나 이름 매핑으로 맞추거나, 위경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 공유서비스 플랫폼에서 제공되는 자원(강좌, 프로그램 등)의 정보와 예약 관련 내용을 포함하는 자료입니다. 각 자원은 ‘일련번호’와 ‘자원명’을 통해 고유하게 식별되며, 제공 기관의 ‘기관코드’, 지역을 나타내는 ‘지역코드’, 자원의 물리적 위치를 나타내는 ‘주소’ 및 ‘상세주소’ 정보도 포함됩니다. ‘자원구분 일련번호’, ‘상태구분 일련번호’, ‘심사구분 일련번호’ 등은 자원의 관리 상태 및 사용 가능 여부를 판단하는 데 사용됩니다. 또한 ‘공개여부’, ‘접수기간 설정여부’, ‘예약버튼 노출 시작/종료일’, ‘접수 시작/종료일시’ 등의 항목은 자원 예약 가능 여부와 시점을 관리하며, 사용자에게 노출되는 자원의 시기적 조건을 설정합니다.
