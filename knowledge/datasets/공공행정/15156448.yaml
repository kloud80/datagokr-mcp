summary_user: 동북아역사재단 웹사이트에서 쓰는 부서 목록으로, 한 행에 부서 하나씩 일련번호, 부서아이디, '상위부서>하위부서' 형식의 부서이름, 사용여부를 담은 소규모 파일(csv, 1650 bytes)이다. 재단 조직도를 그리거나 현재 운영 중인 부서와 폐지·미사용 부서를 가려내려는 행정 담당자·분석가가 쓴다. 조인 키는 재단 내부 부서아이디(nahf_dept_id) 하나뿐이어서 같은 아이디를 쓰는 재단 자체 자료와만 이어 쓸 수 있고, 외부 행정 코드와 연결하는 키는 없다.
description_portal: 이 데이터는 동북아역사재단의 내부 조직 체계를 정리한 부서 목록 자료로, 각 행에 일련번호(번호), 고유 부서 아이디, 부서 이름, 사용여부 정보를 담고 있습니다. 부서이름은 ‘상위부서>하위부서’ 형식으로 표기되어 실·실·팀 단위의 소속 관계와 임시 조직, 파견·휴직, 퇴직 등 특수 상태까지 함께 나타냅니다. 사용여부 항목을 통해 현재 운영 중인 조직과 폐지·미사용 부서를 구분할 수 있어, 조직도 작성, 인사·행정 시스템 연계, 부서 코드 관리 및 재단 조직 구조 분석을 위한 기초 데이터로 활용할 수 있습니다. 수시 업데이트 예정입니다.
