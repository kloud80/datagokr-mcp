description_portal: 이천시시설관리공단에서 관리·운영 중인 시설(공영주차장, 농업테마공원, 수변공원 캠핑장, 추모의집, 자연장지, 이동지원센터)에 대한 정보입니다. 우리 공단에서는 이천시민을 위한 편의시설과 문화관광시설을 운영, 관리하며 장사시설을 이천시민 대상 할인과 혜택을 제공하여 고객만족을 위해 노력하고 있습니다. 또한, 노약자, 어린이, 장애우를 포함하여 장거리 이동의 어려움을 갖는 시민을 위하여 이동수단을 지원하고 있습니다. 시민의 편의와 복리증진을 위해 노력하고 있습니다. 최근에는 캠핑장을 조성하여 이천시민 뿐만 아니라 많은 타지역의 고객이 방문하면서 경기도 최대 규모의 공공운영 캠핑장으로 자리잡고 있습니다.
