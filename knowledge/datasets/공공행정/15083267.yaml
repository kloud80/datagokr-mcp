description_portal: 인천광역시_역사 정보는 고대부터 현대까지 인천지역에서 있었던 과거의 사실들을 연대순으로 구성한 데이터입니다. "인천"이라는 이름이 없었던 시기라도, 인천지역에 대한 기록은 삼국시대부터 나타나며, 고고학 유적과 유물은 선사시대까지 거슬러 올라갑니다. 본 데이터에서는 기원전 18세기 비류의 미추홀 정착부터 최근 현대 인천까지를 대상으로 했으며, 2000년 이후부터는 인천광역시 시정(市政)과 관련된 주요 내용을 정리했습니다. 인천의 과거와 현재를 이해하는 데에 도움이 되기를 바랍니다.
