summary_user: 경상북도 영양군의회에 발의된 의안을 한 건씩 담은 파일로, 의안번호·의안명·발의자·발의일자와 본회의 보고일·상정일·처리일·처리결과를 기록한다. 주민이나 분석가가 "영양군의회에서 어떤 조례안이 누구 발의로 언제 상정돼 어떻게 처리됐나"를 확인하거나 의원별 발의 실적을 셀 때 쓴다. 다른 데이터와 묶을 공통 조인 키는 없어서, 다른 시군 의회 의안 정보와는 의안명·발의자 이름이나 같은 기관 단위로만 맞대어 쓴다.
limits: 전역 조인 키가 없어 의원 명부·회의록 등 다른 데이터와 연결하려면 이름 매칭에 의존해야 한다. 범위는 영양군 한 곳의 의회에 한정되며 공간 정보는 없다.
