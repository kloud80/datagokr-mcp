description_portal: 대전테크노파크 보유장비 현황은 대전테크노파크가 보유한 장비에 대한 정보를 제공합니다. 대전테크노파크는 로봇센터, 바이오센터, 우주ICT산업센터, 반도체에너지산업센터에서 장비를 보유하고 있습니다. 각 장비들은 활용범위, 이용방법에 따라 분석,시험,의뢰, 이용자 직접사용, 공동활용 등이 가능합니다. 또한, 시험장비, 분석장비, 물리적측정장비, 데이터처리장비등 장비 분류에 대한 정보도 함께 제공합니다. 해당 데이터를 통해 대전테크노파크가 보유한 장비의 현황가 이용방법, 활용범위, 용도에 대한 데이터를 얻을 수 있습니다.
