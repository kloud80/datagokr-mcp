summary_user: 지방공기업 통합경영공시에 올라온 기관별·연도별 손익 지표(영업수익·영업비용·영업이익, 영업외수익·비용, 법인세차감전이익, 법인세, 당기순이익)를 담은 전국 단위 비공간 데이터다. 분석가나 지방의회·주민이 '우리 지역 도시공사가 최근 몇 년간 영업이익을 냈는가, 적자 기관은 어디인가'처럼 지방공기업의 수익성을 기관 간·연도 간으로 비교하는 데 쓴다. 전역 조인 키가 없어 다른 경영공시 데이터와는 기관명(ENT_NAME)과 연도를 맞춰서 이어 써야 한다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이다. 경영성과 자료에는 기관별 영업수익, 영업비용, 영업이익, 영업외수익, 영업외비용, 법인세차감전이익, 법인세등, 당기순이익 지표가 포함됩니다.지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
