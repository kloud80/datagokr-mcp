description_portal: 한국토지주택공사 홈페이지-정보공개-사전정보공표-전체에서 공개중인 대외 포상 수상내용에 대한 자료로, 포상일자, 포상기관, 포상명칭, 포상등급, 포상사유, 수여기관 유형 등의 정보를 제공합니다. 포상의 종류에는 자연환경, 조경, 도시, 경영, 사회적 가치 실현, 상생 우수, 일자리 창출이 대표적입니다. 매년 8월 포상정보를 공개하고 있으며, 해당 년도로부터 모든 이전 년도의 포상 내역을 산출해서 보여주고 있습니다. 인사처에서 관련 내역을 담당하며 홍보, 보안, 정보처리로 분류됩니다. 인사처 담당자의 전화번호를 통해 관련 내역에 대한 자세한 문의가 가능합니다.
