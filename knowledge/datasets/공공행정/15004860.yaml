description_portal: "본 데이터는 경상북도가 「공유재산 및 물품 관리법」에 근거하여 관리 중인 공유재산의 현황을 집계한 목록입니다. 경상북도가 소유하고 있는 재산에 대한 기본 정보를 제공하여, 도민의 알 권리를 보장하고 데이터 기반의 행정 투명성을 높이고자 개방됩니다.데이터는 '재산', '소재지', '공부지목', '공부면적', '재산관리관'의 5개 핵심 칼럼으로 구성되어 있습니다. '재산' 항목은 관리되는 재산의 유형(예: 토지, 건물 등)을 나타내며, '소재지'는 해당 재산이 위치한 주소 정보를 제공합니다. '공부지목'과 '공부면적'은 각각 토지대장 등 공식 장부에 등재된 지목(예: 대, 전, 답)과 면적(제곱미터 단위)을 의미합니다. 마지막으로 '재산관리관' 항목은 해당 재산을 실질적으로 관리하는 경상북도 내 담당 부서 또는 기관을 명시합니다."
