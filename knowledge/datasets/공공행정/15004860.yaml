summary_user: 경상북도가 소유·관리하는 공유재산을 재산별 한 행으로 담은 목록으로, 재산 종류(토지·건물 등), 소재지 주소, 공부상 지목과 면적(㎡), 담당 재산관리관을 기록한다. 도민이나 분석가가 "우리 시군에 경상북도 소유 토지가 어디에 얼마나 있고 어느 부서가 관리하는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 소재지 주소를 지번·도로명 주소로 매칭해 토지대장·공시지가 같은 토지 자료와 잇거나, 재산관리관 이름으로 경상북도 조직 자료와 맞춰 쓴다.
limits: 코드형 조인 키가 없어 다른 데이터와 연결하려면 주소나 부서명 문자열을 직접 정제·매칭해야 한다. 범위는 경상북도 소유 재산에 한정되며 시군 소유 공유재산은 들어 있지 않다. 공부상 지목·면적만 담고 있어 실제 이용 현황이나 재산 가액은 알 수 없다.
