summary_user: 지방자치단체가 행사·축제를 위해 일반회계에 편성한 세출예산(행사운영비·행사실비보상금·민간행사사업보조·행사관련시설비 4개 통계목)을 회계연도·자치단체별로 집계하고, 전체 세출예산액 대비 비율과 함께 담는다. 주민이나 분석가가 '우리 시·군·구는 행사·축제에 예산을 얼마나, 전체 예산 중 몇 퍼센트나 쓰는가'를 확인하거나 자치단체끼리 비교할 때 쓴다. 전역 조인 키는 없으므로 자치단체 코드(laf_cd)나 자치단체명으로 다른 지방재정365 공시 데이터와 이름·코드를 맞춰 연결해야 한다.
description_portal: 지방자치단체는 행사·축제관련 경비를 행사운영비(201-03), 행사실비보상금(301-11), 민간행사사업보조(307-04), 행사관련시설비(401-04) 4개 통계목으로 관리하고 있습니다. 자치단체 행사·축제경비 편성내역 정보는 자치단체의 행사·축제를 위해 편성한 일반회계 기준의 세출예산정보를 전체 세출예산액으로 나눈 비율정보와 함께 제공되고 있습니다. 대상회계는 일반회계가 대상이며 2015 회계연도부터 정보가 제공되고 있습니다.지방재정통합공개시스템(lofin365.go.kr)에서 보다 자세한 정보를 확인하실 수 있습니다.
