summary_user: 국회사무처가 공개하는 의회외교 실시내역을 게시물 단위로 담으며, 게시물 번호·게시판명·분류·제목·작성자·작성일·원문 링크·첨부파일명으로 구성된 전국 범위의 비공간 데이터다. 연구자나 기자가 '최근 국회가 어떤 국가·기구와 의원 외교 활동을 했는가'를 확인하거나 활동 이력을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명·행사명 같은 이름 매핑이나 같은 기관(국회) 데이터의 게시물 정보로만 이어 쓴다.
