summary_user: 법제처가 법령 속 어려운 용어·문장을 그림·사진·표로 풀어 제공하는 '한눈보기' 콘텐츠의 목록을 담으며, 항목마다 관련 법령의 일련번호·법령ID·법령명·시행일자·공포일자·공포번호와 제공일자·제공건수가 붙는 전국 단위 비공간 데이터입니다. 국민이나 공무원이 "이 법령에 쉽게 풀어 쓴 시각 설명 자료가 있는가, 언제 제공됐는가"를 찾을 때 쓰고, 본문 조회로 넘어가는 진입 목록 역할을 합니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 법령 데이터와는 법령ID·법령명 같은 이름·코드 매핑이나 같은 기관(법제처) 코드로만 이어 씁니다.
description_portal: 한눈보기(목록) 조회 데이터는 한눈에 이해되는 법령정보 제공 서비스로, 국민이 법령을 이해하기 쉽도록 국민의 일상생활에 밀접하지만 이해하기 어려운 법령 속 용어나 문장에  그림·사진·표 등 이해를 돕는 시각 콘텐츠를 함께 제공하는 서비스 입니다. 각 목록 항목에는 제목, 주제 분류, 관련 법령명, 작성일자, 담당 부서 등 주요 메타정보가 포함되어 있으며, 이용자는 목록을 통해 관심 있는 항목의 본문 정보로 직접 연결할 수 있습니다. 목록은 생활 밀접형 법률, 자주 제기되는 행정 해석, 실무 적용상 쟁점 등이 중심 주제로 구성되어 있어, 국민과 공무원 모두가 법령 내용을 명확하게 이해하고 활용할 수 있도록 지원합니다.
