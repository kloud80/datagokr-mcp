summary_user: 한국산업인력공단의 본부·지역본부·지사 등 조직 단위를 상위부서명과 부서명 두 항목으로 담은 부서 목록 파일(csv, 약 6.8KB)이다. 공단의 어느 부서가 어느 상위 조직에 속하는지 확인하거나 조직도를 그리려는 민원인·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 부서명 문자열 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 한국산업인력공단의 조직 체계를 반영한 상위부서명 및 부서명 정보를 제공합니다. 공단 내부의 행정조직 체계를 표준화된 형태로 공개함으로써, 공공기관의 조직 현황을 투명하게 관리하고, 기관 내외부의 행정업무 연계 및 데이터 기반 의사결정을 지원하기 위한 목적을 가지고 있습니다. 데이터는 공단의 본부 및 지역본부, 지사, 사업소 등 조직 단위별 계층구조를 포함하며, 각 부서의 상위부서명, 부서명 정보를 제공합니다. 이를 통해 조직 구조를 시각화하거나, 업무분류·기관 간 협업·민원처리 연계 등 다양한 행정정보 시스템과 연계하여 활용할 수 있습니다. 본 데이터는 한국산업인력공단 인사·조직 관리 시스템을 기반으로 생성됩니다.
