description_portal: '이 데이터는 경상북도 봉화군 관내 빈집의 현황을 정리한 자료입니다. 각 빈집의 위치, 건축물 구조, 건축연도, 용도, 관리기관 등 주요 정보를 포함하고 있으며, 봉화군의 빈집 관리 실태를 표 형식으로 제공합니다. 데이터는 총 10개 컬럼으로 구성되어 있으며, 기준일은 2025년 7월 14일입니다.구분: 데이터에 기록된 빈집의 일련번호로, 각 행을 구분하기 위해 부여된 고유 번호입니다.읍면동: 빈집이 속한 읍·면·동 단위의 행정구역명입니다.리: 보다 세부적인 행정구역 단위로, 해당 빈집이 위치한 리의 명칭입니다.건축물구조: 건축물의 구조 형태를 나타내며, ‘벽돌구조’, ‘일반목구조’ 등으로 표기됩니다.건축연도: 해당 건축물이 지어진 연도로, 연도 형식(YYYY)으로 표시됩니다.건물용도: 건물의 사용 용도를 나타내며, ‘단독주택’ 등으로 구분됩니다.빈집등급: 빈집의 등급을 표시하며, ‘일반빈집’ 등으로 표기됩니다.관리기관명: 빈집을 관리하는 기관의 명칭으로, ‘봉화군청’으로 표기됩니다.관리기관전화번호: 관리기관의 대표 전화번호입니다.데이터기준일: 데이터가 집계된 기준일로, 2025년 7월 14일로 명시되어 있습니다.'
