description_portal: 본 데이터는 경기도 고양시 빅데이터 플랫폼(Bigtory)은 데이터 기반의 과학적 정책 및 의사 결정 지원 체계 확보를 위한 플랫폼으로, 고양시 통계, 분야별 데이터, 데이터 지도, 평생학습 지표, 상권분석, 공모매칭 지원 등 서비스를 제공하고 있습니다. 이를 통해 도시현황을 종합적으로 파악하고 정책효과를 분석할 수 있으며 부서간 데이터 공유와 활용을 촉진하여 정책품질을 향상시키는 근거기반행정을 실현할 수 있습니다. 또한 시민 및 기업과 함께 데이터 활용 생태계를 확장하는 역할을 수행합니다.
