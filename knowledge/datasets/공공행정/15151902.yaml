description_portal: 공공데이터 활용 기업 현황 합성데이터는 국내 공공데이터를 활용하는 기업의 일반적 특성과 활동 현황을 분석하기 위해 구축된 데이터로, 실제 기업정보를 기반으로 통계적 기법을 통해 생성된  합성데이터(Synthetic Data)입니다. 데이터는 기업의 소재지, 한국표준산업분류, 설립연도, 인력현황, 매출액, 채용인원 등 주요 항목으로 구성되어 있으며, 개인정보 및 민감정보를 포함하지 않습니다. 본 데이터는 공공데이터 활용 기업의 산업별·지역별 분포를 파악하거나, 공공데이터 기반의 산업생태계 분석, 정책효과 측정, 일자리 창출 영향 분석 등 다양한 연구 및 행정 정책 수립에 활용될 수 있습니다. 특히 합성데이터 특성을 통해 원본 데이터와 유사한 통계적 패턴을 유지하면서도 개인정보 침해 위험을 제거하였으며, 인공지능 학습용 데이터, 데이터 유통 생태계 연구, 중소기업 지원정책 분석 등 공공데이터 활용 가치 확산을 위한 기반자료로 폭넓게 활용될 수 있습니다.
