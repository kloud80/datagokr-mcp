summary_user: 2018년 6월 13일 제7회 전국동시지방선거와 같은 날 치른 국회의원 재보궐선거의 개표결과를 선거종류·선거구별로 시도·구시군·읍면동 단위까지 담은 파일로, 선거인수·투표수·후보자별 득표수·무효투표수·기권수가 들어 있다. 분석가나 연구자가 '우리 동네 읍면동에서 시·도지사 후보별 득표율과 기권율은 어땠나'처럼 지역별 투표 결과와 투표율을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·구시군명·읍면동명 같은 이름 매핑이나 같은 기관의 다른 선거 개표자료와 지역명을 맞춰 이어 쓴다.
limits: 선거 때 한 번 만들어진 뒤 바뀌지 않는 이벤트성 자료라 다른 선거 결과는 담지 않는다. 행정동 코드 같은 공통 키가 없어 지역명으로 맞춰야 하며, 후보자별 득표수가 이름 없는 여러 열(Unnamed)로 펼쳐져 있어 열마다 후보를 확인해야 한다.
