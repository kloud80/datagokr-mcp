summary_user: 과학기술정보통신부 소관 법령에 대한 질의·해석 사례를 건별 목록으로 담으며, 한 건마다 안건명·안건번호·질의기관·해석기관·해석일자와 상세 해석문 링크가 붙는다. 사업자나 법무 담당자가 "전기통신사업법 관련해 과기정통부가 이전에 어떻게 해석했나"처럼 특정 쟁점의 기존 해석 사례를 찾을 때 쓴다. 전역 조인 키는 없고, 해석일련번호(법령해석일련번호)로 같은 서비스의 본문 조회와 잇거나 질의·해석 기관 코드나 기관명으로 다른 부처 해석례·법제처 데이터와 맞춰 쓴다.
description_portal: 법제처 국가법령정보센터에서 제공하는 과학기술정보통신부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 과학기술정보통신부 소관 법령 질의 및 해석 사례를 목록 형태로 제공하며, 해석일련번호, 안건명, 해석기관명, 해석일자 등의 기본 정보가 포함됩니다. 사용자는 안건번호, 해석일자 등의 조건 검색을 통해 필요한 해석 사례를 확인할 수 있으며, 각 항목은 링크를 통해 세부 해석문으로 연결됩니다. 본 데이터는 과학기술정보통신부 법령해석의 체계적 관리와 일관된 법적 판단을 지원하기 위해 제공됩니다. 또한 법령해석 정보를 기반으로 한 검색·조회 서비스, 법령 기반 지식산업 개발, 자동화된 법률 정보 제공 도구 등 다양한 서비스 구현에 활용될 수 있습니다.
