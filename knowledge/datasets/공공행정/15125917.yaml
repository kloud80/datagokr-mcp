summary_user: 국회도서관이 공표한 정책 관련 행정정보 목록을 공표 파일 단위로 담으며, 생산연월(PRDC_YM), 기관명, 분류명, 공표 파일명과 파일 경로 같은 항목이 함께 있다. 국민이나 연구자가 국회도서관이 어느 시기에 어떤 정책 자료를 공표했는지 찾아 원문 파일로 가는 데 쓴다. 전역 조인 키는 없어 기관 코드(INST_CD)나 분류 코드(CTGR_CD), 이름 매칭으로만 국회사무처의 다른 행정정보 공표 데이터와 이어 쓴다.
