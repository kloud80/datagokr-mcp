description_portal: '부산광역시 서구의 거래처 데이터. 구청 계약정보시스템에 등재된 거래처에 대한 데이터입니다.데이터에는 거래처명, 주소, 상세주소, 데이터기준일자 등의 항목이 포함되어 있으며, 이를 통해 계약대상 기관의 소재지 정보를 확인할 수 있습니다.예시 데이터에는 사회단체, 협회, 연구원, 교육기관, 지역 기반 협의체 등 다양한 유형의 거래처가 포함되어 있으며, 부산 지역뿐 아니라 서울·경기·경남 등 타 지자체 소재 기관도 함께 등재되어 있습니다.본 데이터는 계약 및 구매 관리, 공공조달·위탁사업 실행기관 파악 등 다양한 분야에서 활용될 수 있습니다.** 항목별 설명거래처명: 계약정보시스템에 등록된 기관 또는 단체의 이름주소: 해당 거래처의 기본 주소상세주소: 건물 층수, 호수 등 주소의 추가 상세 정보가 필요한 경우 기재'
