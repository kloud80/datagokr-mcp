description_portal: '개인정보 보호수준 평가는 공공기관과 일부 민간기관이 개인정보를 안전하고 적법하게 관리하고 있는지를 점검하고 평가하는 제도입니다. 이는 개인정보가 유출되거나 오·남용되는 것을 방지하고, 국민의 개인정보 자기결정권을 보호하기 위한 목적으로 시행됩니다.개인정보 보호수준 평가는 개인정보를 처리하는 기관의 관리체계, 보호조치 이행 상태, 법령 준수 여부 등을 종합적으로 진단하여 등급화하는 제도입니다.이는 과거 "개인정보 관리수준 진단"에서 발전된 형태로, 2024년부터는 개선된 평가 기준 및 등급 체계로 운영되고 있습니다.해당 데이터는 2019~2024년 장애인기업종합지원센터의 개인정보 보호수준 평가 결과 정보입니다.해당 데이터가 보유한 컬럼은 다음과 같습니다.- 컬럼명: 기관명,연도,개인정보 개인정보 보호수준 평가 결과'
