description_portal: 경기도 성남시 어디서나민원 취급종류에 대한 데이터로,  어디서나민원의취급종류(소관부처,민원코드,민원명,신청방법 등)의 항목을 제공합니다. 성남시 어디서나민원 취급종류 자료는 시민들이 전국 어디서든 민원서류를 신청하고 교부받을 수 있도록 지원하는 ‘어디서나민원’ 제도의 처리 가능 항목을 정리한 자료입니다. 이 자료에는 소관부처(교육부, 국방부, 행정안전부 등), 민원명(대학교 성적증명, 지방세 납세증명 등), 신청방법(전화, 방문, 정부24) 등의 항목을 포함하고 있습니다. 신청은 정부24 또는 가까운 행정복지센터에서 가능하며, 일부 민원은 전화 접수도 지원됩니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.
