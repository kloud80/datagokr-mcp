summary_user: 경기도의회 각 위원회의 구성원을 위원회·대수·의원 단위로 담은 명부로, 위원회 코드와 대수, 의원 식별번호(asemby_seq_no), 위원회 내 직책·서열, 대표위원회 여부, 전·후반기 구분, 등록·수정일자를 포함한다. 시민·기자·의정 분석가가 특정 대수에서 어느 위원회에 어떤 의원이 위원장·부위원장·위원으로 배치됐는지, 한 의원이 어떤 위원회를 거쳐 왔는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 같은 경기도의정포털의 의원·위원회 자료와 위원회 코드나 의원 식별번호를 맞춰 보는 방식으로만 잇는다.
description_portal: 「경기도의정포털_위원회 구성원」 데이터는 경기도 의회 내 각 위원회별 구성 현황을 제공하는 자료입니다. 이 데이터에는 위원회 코드, 위원회 대수, 의원SEQ(식별번호), 위원회 내 의원직책, 위원회 내 의원서열, 등록일자, 수정일자, 대표위원회 여부, 전·후반기 구분(F/S), 1~4기 표시 등의 항목이 포함되어 있습니다.이를 통해 특정 대수에서 각 위원회가 어떤 의원으로 구성되었는지, 위원장·부위원장·위원 등의 직책 분포가 어떠한지 확인할 수 있으며, 의원 개별 활동 이력과 위원회 참여 기록을 추적할 수 있습니다.
