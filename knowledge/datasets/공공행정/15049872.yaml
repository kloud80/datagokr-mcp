description_portal: 설비투자지수*에 대한 관련 데이터로 분류[작업아이디,조사구분,컬럼정보,값]에 대한 정보를 제공하고 있습니다.*관련참고:- 설비투자란  장기간(1년 이상)에 걸쳐 생산 과정에 지속적, 반복적으로 사용되는 자산 중 각종 기계류와 자동차, 항공기, 선박 등의 운송장비를 취득하여 자본량을 증가시키는 행위를 말합니다. 설비투자지수는 경제통계에서 기업의 설비투자 동향을 보여주는 지표입니다. 국내 기업이 기계류와 운송장비 등 설비에 투자한 금액을 기준으로 산출한 지수로 설비투자의 증감과 경기 동향을 파악하기 위함이며, 통상 기준연도를 100으로 설정하여 지수화합니다. 즉, 기업이 생산설비에 투자한 금액을 기준연도 대비 지수화한 통계로 기계류와 운송장비 등 설비투자 항목이 포함되어 있습니다.
