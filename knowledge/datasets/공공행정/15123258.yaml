description_portal: 공무원 행동강령은 공무원이 직무를 수행하면서 지켜야 할 윤리적 기준과 행위 규범을 정리한 대통령령입니다.2020년 3월부터 2023년 12월까지 공무원들이 직무 수행 중 위반한 행동강령 사례를 연도별, 부패 유형별로 집계한 통계 자료입니다. 행동강령 위반 사례에는 금품 향응 등 수수,예산의 목적 외 사용,알선 청탁 이권개입,공용물 사적사용,외부강의등 신고의무위반,금전 차용 금지 직무관련자 거래 신고,공정한 직무수행 저해,경조사 통지,기타 유형이 포함되며, 이를 통해 공직기강 확립과 청렴한 행정문화 조성을 위한 기초 자료로 활용됩니다.
