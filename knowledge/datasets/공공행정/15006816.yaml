description_portal: '인천광역시 중구에 소재하는 공동주택에 관련된 현황입니다.현재 우리 인천광역시 중구는 영종과 원도심으로 이루어져 있으며 향후 2026년 7월에 분구되어 제물포구와 영종구로 나누어질 예정입니다.지금 파일 데이터에 포함된 내용은 중구 관내에 위치한 주택현황들로써 단지 및 법정동명 용도구분 및 동수와 세대수 해당동의 연면적 그리고 건축허가와 사용승인일이 기록되어있습니다.데이터 기준일자는 2025년 11월 20일자 데이터이며, 향후 2026년 11월에 차기 등록 예정입니다. 인천 중구 건축과 부서에서 취합하여 작성하였음을 안내드립니다.연립주택 : 주택으로 쓰는 1개 동의 바닥면적 합계가 660제곱미터를 초과하고 층수가 4개층 이하인 주택다세대 주택 : 주택으로 쓴느 1개의 동의 바닥면적 합계가 660제곱미터 이하 이며, 층수가 4개 층 이하인 주택아파트 : 주택으로 쓰는 층수가 5개층 이상인 주택'
