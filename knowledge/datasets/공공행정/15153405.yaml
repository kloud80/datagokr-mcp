description_portal: 본 데이터는 관악구 정보시스템 "관악구의회 통합홈페이지"에서 추출된 서울특별시 관악구의회 영상회의록 안건 정보에 대한 데이터로, 고유번호, 영상번호, 의원코드, 안건, 시간 등의 항목을 포함하고 있습니다. 본 데이터는 회의별 안건별 진행 흐름을 객관적으로 파악할 수 있어 의정활동의 공개성과 접근성을 높일 수 있습니다. 또한 회의 운영 현황 분석, 정책 의사결정 과정 기록 관리, 회의 시간 예측 및 일정 최적화 등 행정 효율화를 지원하는 자료로 사용할 수 있습니다. 더 나아가 시민, 연구자, 언론 등 다양한 주체가 의정활동을 쉽게 분석하고 비교할 수 있는 기반을 제공함으로써 열린 의회 문화 조성과 민주적 거버넌스 확립에 중요한 역할을 합니다.각 항목에 대한 설명은 아래와 같습니다.고유번호는 각 데이터(행)를 구분하는 고유 값입니다.영상번호는 하나의 회의(본회의/위원회) 녹화파일을 식별하는 번호입니다. 동일한 번호에 포함된 여러 행(안건·발언)은 모두 같은 영상 파일 안의 특정 시간대를 나타냅니다.의원코드는 의원을 구분하는 구분자입니다.안건은 안건 내용을 나타냅니다.시간은 영상번호로 구분되는 각 녹화파일에서의 녹화 진행 시간을 의미합니다.
