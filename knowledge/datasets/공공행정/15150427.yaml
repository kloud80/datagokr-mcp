summary_user: 경기도 청정계곡에서 접수된 불법행위 신고를 건별로 담은 원천 기록으로, 신고·접수번호, 시군명, 발생 위치, 신고내용, 공개 여부, 조치 결과와 미조치 사유, 처리일시·처리내용, 신고자·관리자 첨부파일 수를 포함한다. 분석가나 도·시군 담당자가 "어느 시군 계곡에서 불법행위 신고가 많고, 조치되지 않은 신고는 어떤 사유로 남았는가"를 따질 때 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)을 이름 그대로 맞춰 다른 시군 단위 통계와 잇는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도 내 청정계곡을 대상으로 한 불법행위 신고 및 행정조치 내역을 포함하고 있으며, 민원 발생 위치, 신고내용, 조치 여부 및 처리 결과 등 민원 접수와 처리 전 과정을 기록합니다. 각 신고는 신고번호 및 접수번호를 통해 구분되며, 시군명과 발생 위치를 통해 지역별 불법행위 분포를 파악할 수 있습니다. 신고사항은 공개여부 및 미조치 사유, 조치불가 신고 여부 등으로 세분화되어 있으며, 처리 결과는 처리일시 및 처리내용을 통해 확인 가능합니다. 또한, 유저와 관리자 첨부파일 수를 별도로 제공하여 시각자료 기반의 민원 관리가 가능하며, 청정계곡 환경 보호를 위한 정책 수립, 민원 대응 효율성 분석, 지역별 불법행위 유형 분류 등 다양한 분석 목적으로 활용될 수 있습니다.
