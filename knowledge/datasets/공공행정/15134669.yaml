description_portal: '"전라남도교육청_기계설비유지관리자 선임대상 및 성능점검 건물 수" 데이터는 전라남도교육청 관할 학교 및 교육기관 중 기계설비유지관리자 선임이 법적으로 요구되는 건물과 해당 시설의 성능점검 대상 건물 수를 체계적으로 제공하는 공공데이터입니다. 주요 제공 정보에는 기계설비유지관리자 선임기준(예: 연면적 기준, 학교 유형 등), 각 기준에 해당하는 건물 수, 성능점검 대상 건물 수 등이 포함되어 있습니다.해당 데이터는 각 교육지원청 및 학교에서 제출하는 시설관리 자료를 바탕으로 수집되며, 「기계설비법」 및 관련 시행규칙에 근거해 보유·제공됩니다. 데이터는 연 1회 이상 정기적으로 갱신되며, 건물 신설, 용도 변경, 면적 변동 등 주요 시설 현황이 변동될 때마다 수시로 업데이트됩니다.이 데이터는 교육청 및 산하 기관의 시설 안전관리, 기계설비유지관리자 선임 의무 이행 점검, 성능점검 계획 수립, 예산 배분, 시설물 유지관리 정책 수립 등에 활용됩니다. 또한, 연구기관이나 정책 담당자는 학교시설의 기계설비 관리 현황을 분석하여 안전관리 체계 강화, 법적 의무 이행 평가, 시설 개선 방안 마련 등에 참고자료로 활용할 수 있습니다.'
