summary_user: 인천광역시 미추홀구에 있는 시유지를 필지 한 건씩 담은 파일로, 재산구분·위임 재산관리관·동명·번지·호·공부지목과 공부면적·실소유면적(제곱미터)을 기록하며 범위는 미추홀구 한 곳, 위치 단위는 읍면동입니다. 주민이나 사업자, 분석가가 "우리 동네 어느 번지가 시 소유 땅이고 지목과 면적은 얼마인가"를 확인하거나 개발·도시계획 검토 때 시유지 분포를 파악하는 데 씁니다. 전역 조인 키가 없어 다른 데이터와 붙이려면 동명과 번지·호를 조합해 지번을 만들고 이를 필지고유번호(PNU)나 국유재산 목록에 이름 기준으로 매핑해야 합니다.
limits: 필지고유번호나 법정동코드 같은 표준 키가 컬럼에 없어 다른 데이터와 바로 조인할 수 없고, 동명·번지 문자열로 매칭해야 해 표기 차이로 누락이 생길 수 있습니다. 범위는 미추홀구 안의 시유지로 한정되며 다른 시군구나 구유지·국유지는 담지 않습니다.
