description_portal: 『수원시폐기물처리시설 촉진ㆍ운영 및 주변지역 지원 등에 관한 조례』에 의거하여 설치된 수원시 내 주민편익시설에 대한 데이터를 제공합니다.  주민수용성을 높이기 위해 자원회수시설과 주민편익시설을 함께 설치되어 있습니다. 지자체에서 자체 시설을 보유하면 외부 위탁비, 운반비, 처리단가 등을 크게 줄일 수 있습니다. 자원회수시설은 열 전기를 생산하는 에너지 시설이기도 합니다. 지역난방 공급, 주민편익시설 난방, 전기 생산 등 자원을 회수하여 에너지로 전환하는 순환경제의 기반이 됩니다.
