summary_user: 공정거래위원회 가맹사업 정보공개 자료 가운데 브랜드별 가맹지역본부의 상호·소재지 주소·대표자·관리지역·관리 가맹점 수·계약기간과 모집·계약체결·가맹금 수령 권한 여부를 기준년도와 브랜드관리번호 단위로 지역본부 한 곳씩 담고, 범위는 전국이며 위치는 개별 주소로 나온다. 가맹 창업 예정자가 "이 브랜드의 우리 지역 지역본부는 어디이고, 계약을 맺거나 가맹금을 받을 권한이 정말 있는가"를 확인할 때 쓴다. 브랜드관리번호·가맹본부관리번호로 같은 기관의 가맹 브랜드·가맹본부 정보와 이어 쓰지만, 실측 컬럼에서 기관 밖 데이터와 묶을 전역 조인 키는 찾지 못해 다른 데이터와는 상호명·주소 매칭으로만 연결된다.
description_portal: 브랜드 가맹지역본부 일반 정보에 대한 기준년도, 브랜드관리번호를 이용하여 가맹지역본부 상호명, 소재지주소 등 정보 조회 서비스를 제공합니다.
