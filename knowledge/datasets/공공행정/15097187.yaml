summary_user: 제주국제자유도시개발센터(JDC)에서 일하는 직·간접 감정노동자의 사전 설문 응답을 응답자 한 명당 한 행으로 담은 CSV 파일(약 18만 바이트)이다. 성별·연령대·고용 형태·근속년수·근로시간 같은 인적·근무 정보와 함께 직무 요구, 직무 자율, 상사·동료 지지, 조직 공정성, 감정 표현 억제 등에 대한 5점 또는 4점 척도 응답이 들어 있다. 노무·보건 담당자나 분석가가 '고용 형태나 직급에 따라 감정노동과 직무 스트레스 인식이 어떻게 다른가'를 살피는 데 쓰고, 전역 조인 키가 없어 다른 데이터와는 기관명이나 문항 내용을 기준으로만 비교한다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC) 내에서 근무하는 직·간접 감정노동자를 대상으로 실시한 사전 설문조사 결과를 정리한 자료입니다. 해당 조사는 감정노동자의 건강 상태, 근로 환경, 직무 인식 등을 종합적으로 파악하기 위해 시행되었으며, 데이터 항목은 아이디, 성별, 연령대, 직종구분, 고혈압 경험 여부, 심장 질환 여부, 근로 형태 구분(정규직, 비정규직 등), 직급 구분(사원, 대리, 관리자 등), 일일 업무 준비 시간, 업무 마무리 시간 등 기본적인 인적·근무 정보를 포함하고 있습니다. 이후에는 “내 일은 위험하며 사고를 당할 가능성이 있다”, “업무 중 고객과의 갈등이 잦다”, “업무 중 감정을 조절해야 한다”와 같은 감정노동 특성을 반영한 사전 설문 문항들이 이어지며, 응답자는 해당 항목에 대해 5점 또는 4점 척도 방식으로 본인의 인식이나 경험을 평가합니다. 이 데이터는 감정노동자의 직무 스트레스, 건강 위험 요인, 조직 내 위험 인식 등을 분석하는 데 활용되며, 조직 차원의 근로환경 개선, 스트레스 관리 프로그램 설계, 산업안전 대책 마련 등 정책적·실무적 대응 방안 수립을 위한 기반 자료로 활용될 수 있습니다.
