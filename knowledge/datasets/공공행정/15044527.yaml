summary_user: 한국자산관리공사가 국세물납으로 받은 비상장증권의 매각 실적을 연도별(5개년)로 종목수와 매각 금액만 담은 전국 단위 집계 파일로, 크기가 84바이트에 불과한 소규모 표입니다. 국유재산 정책 분석가나 연구자가 "물납 비상장주식이 해마다 몇 종목, 얼마어치 팔렸는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 연도 기준으로 다른 국유재산·국세물납 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
