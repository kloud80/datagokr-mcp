summary_user: 한국가스기술공사가 낸 입찰공고를 공고 건별로 담은 파일로, 계약명·공고 시작일과 종료일·마감일·추정가격·계약금액·낙찰업체·계약 여부를 한 행에 기록한다(포털 CSV 1,828바이트의 소규모 파일). 공공사업 진출을 노리는 사업자나 조달 분석가가 '이 기관이 어떤 용역·공사를 얼마의 추정가격으로 발주했고 누가 낙찰받았나'를 확인하는 데 쓴다. 기관 내부 입찰공고코드(kgt_bid_ntce_cd)가 키이지만 나라장터 공고번호 같은 공통 코드는 필드에 없어, 다른 조달 데이터와는 계약명·날짜를 맞춰 대조해야 한다.
description_portal: 공공기관 입찰공고는 정부 및 공공기관이 물품 구매, 공사, 용역 등의 사업을 외부에 위탁하거나 발주하기 위해 공개적으로 참여 기업을 모집하는 공식 안내문이다. 공고문에는 사업명, 계약 방식, 예산 규모, 입찰 일정, 참가 자격, 제출 서류 등 입찰에 필요한 핵심 정보가 포함된다. 이는 예산의 투명한 집행과 공정한 경쟁을 유도하기 위한 절차로, 조달청 나라장터를 비롯한 각 기관의 홈페이지 등을 통해 게시된다. 입찰공고는 민간기업과의 협력을 촉진하고, 기관의 정책 목표를 효과적으로 달성하기 위한 첫 단계로 활용되며, 참여 기업에게는 공공사업 진출 기회를 제공하는 중요한 정보 창구다.
