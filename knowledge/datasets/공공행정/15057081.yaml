summary_user: 지방자치단체별 상근인력 관련경비의 예산편성 현황을 회계연도·자치단체·세부항목 단위로 담은 집계 자료로, 인원(합계·일반회계·기타특별회계·공기업특별회계)과 회계별 예산액을 전국 범위로 제공하며 포털 설명상 2009회계연도부터 있다. 분석가나 주민이 "우리 시·군·구는 상근인력 인건비에 어느 회계에서 얼마를 편성했고 인원은 몇 명인가"를 다른 자치단체와 비교할 때 쓴다. 전역 조인 키는 없어서 같은 지방재정365 자료와는 자치단체 코드·이름(laf_cd, laf_hg_nm)과 회계연도(fyr)로 맞춰 잇는다.
description_portal: 지방자치단체의 상근인력은 지역사회 서비스 및 행정 운영을 지원하기 위해 상시 근무하는 인력을 말합니다. 상근인력은 지방자치단체의 소속으로 근무 하며, 행정 처리, 주민 대상 서비스, 정책 시행 및 지역 발전과 관련된 업무를 수행하며 지방자치단체의 보수규정에 따라 지급되며, 경력이나 직책에 따라 차등 지급됩니다. 이 자료는 지방자치단체의 상근인력 관련경비 예산편성 현황을 분석한 자료입니다.상근인력관련경비 정보는 2009회계연도부터 제공됩니다. 제공되는 세부항목은 자치단체별 분류명, 세부항목명, 인원합계, 일반회계인원, 기타특별회계인원, 공기업특별회계인원 및 회계별 예산액 항목입니다.
