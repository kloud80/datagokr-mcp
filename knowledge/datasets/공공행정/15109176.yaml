summary_user: 5급 이상 국가공무원과 이에 상당하는 공무원의 신규채용·승진·전보·전출입·퇴직·추서 등 관보에 실린 인사 게재 건을 건별로 담고, 게재 제목·발행기관·게재 희망일·근거 법령·관보 호수·원문 PDF 경로 등을 준다. 기자·연구자·민원인이 '특정 부처의 고위공무원 승진·전보가 언제 어느 관보에 실렸는가'를 확인하거나 인사 원문을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발행기관명(pblcnInstNm)·근거 법령명 같은 이름 매칭으로만 잇고, 관보의 다른 구분(법령·고시공고 등) 데이터와는 같은 기관 기준으로 함께 본다.
limits: 공식 조인 키가 없어 기관·법령 연계는 이름 매핑에 의존하므로 표기 차이로 누락될 수 있다. 개발계정은 하루 10,000회로 호출이 제한된다.
