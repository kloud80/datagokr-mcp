description_portal: 관보는 국가가 국민에게 널리 알릴 사항을 수록하여 발행하는 국가의 공식 기관지로 '관보'라는 제호로 발간되는 정기간행물입니다. 관보는 헌법개정, 법률, 조약, 대통령령, 총리령 및 부령의 공포와 헌법개정안, 예산 및 예산 외 국고부담계약의 공고 수단입니다. 또한, 법령 공포, 대통령·국무총리훈령 및 대통령·국무총리 지시사항, 각급 기관의 인사발령 통지 등 정부 기관간의 공문 시행을 대체하는 역할을 합니다.이 데이터는 국가공무원 중 5급 이상 공무원 및 이에 상당하는 공무원의 신규채용, 승진, 전직, 기관 간 전보, 전출, 전입, 정년퇴직, 명예퇴직 및 추서의 목록, 상세정보, 원문에 대한 정보를 제공합니다.
