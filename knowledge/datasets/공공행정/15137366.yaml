summary_user: 전라남도 곡성군 공유재산관리시스템의 실태조사 테이블을 재산번호별로 담은 파일로, 소재지·공부면적과 실면적·공유지분, 대부 가능 여부와 대부만료일, 유휴재산 여부, 활용형태와 활용가능성, 조사일자 등을 개별 재산 단위로 담는다. 곡성군 안에서 놀고 있거나 대부할 수 있는 군유지·건물이 어디에 얼마나 있는지, 무단점유 가능성이 있는 재산은 무엇인지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 재산명을 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
limits: 곡성군 한 시군구만 다루므로 다른 지자체 공유재산과 바로 비교할 수 없다. 표준 코드(법정동코드·지번 PNU 등) 같은 공통 키가 없어 토지대장·공시지가 등과 연결하려면 소재지 주소를 별도로 정제·매칭해야 한다.
