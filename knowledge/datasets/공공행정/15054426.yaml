description_portal: 본 데이터는 서울시 각 자치구에서 관악구로 전입한 세대수와 개인수의 연도별 현황을 정리한 자료입니다.항목은 ▲시도 ▲자치구 ▲2014년부터 2025년까지의 연도별 세대수 ▲연도별 개인수로 구성되어 있으며, 각 자치구에서 관악구로 이동한 규모를 세대 단위와 개인 단위로 확인할 수 있도록 제시되어 있습니다.본 데이터는 연도별 전입 규모의 변화 흐름을 파악하거나, 어느 자치구에서 관악구로의 전입이 상대적으로 많았는지 비교하는 데 활용할 수 있으며, 전입 규모 증감 추세 분석, 그래프·지도 기반 시각화 등 정량적 검토를 위한 기초자료로 사용할 수 있습니다.
