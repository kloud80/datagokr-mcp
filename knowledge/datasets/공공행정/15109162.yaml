summary_user: 관보에 게재된 입법예고를 건별로 담으며, 제목·발행기관·근거법령·정정 여부·개정이유 및 주요내용(rvsnRsnMainCn)·원문 PDF 경로 등을 전국 범위로 제공한다. 어떤 법령이 어느 기관에서 어떤 이유로 개정 예고되었는지 확인하려는 국민·사업자·정책 분석가가 "우리 업종 관련 법령 중 최근 입법예고된 것은 무엇이고 주요 개정 내용은 무엇인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 근거법령명이나 발행기관명 같은 이름 매핑으로만 이어 쓴다.
limits: 코드형 조인 키가 없어 법령·기관 데이터와 연결할 때 이름 문자열 대조에 의존해야 하므로 표기 차이로 누락·오매칭이 생길 수 있다. 비공간 데이터라 지역별 분석에는 쓰지 않는다. 개발계정은 일 10,000회 호출 제한이 있다.
