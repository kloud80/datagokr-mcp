description_portal: '○ 통계개요* 통계명 : 노령연금 지급현황(연령별)* 통계종류 : 노령연금의 수급자 및 지급액 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자ㆍ징수ㆍ급여ㆍ기금현황 등을 파악하여연금정책 수립 및 관련 연구를 위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 노령연금의 연령별ㆍ성별 수급자수 및 지급액 등○ 용어설명* 노령연금(10년이상~20년미만) : 가입기간 10년 이상, 20년 미만인자로 60세에 달한 자(65세 이전까지는 소득있는 업무에 종사하지 않을 경우)에게 지급되는 급여* 조기노령연금 : 가입기간 10년 이상, 연령55세 이상인 자가 소득있는 업무에 종사하지 아니하고,60세 도달 전에 연금수급을 청구한 경우(65세이전에 소득있는 업무에 종사시 소득활동 종사기간동안지급정지 60세 이후 65세 이전에는 소득활동에 따른 노령연금으로 지급)에 지급되는 급여* 특례노령연금 :- ‘88.1.1 현재 45세(40세)이상 60세(55세)미만이며, 가입기간 5년 이상 15년 미만인 자- ‘95.7.1 현재 45세 이상 60세 미만으로, ’95.7.1∼‘99.3.31 사이에 농어촌 가입이력이 있으며,가입기간 5년 이상 15년 미만인 자- ‘99.4.1 현재 50세 이상 60세 미만이며, 가입기간 5년 이상 10년 미만인 자에게 지급되는 급여'
