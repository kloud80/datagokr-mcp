summary_user: 정부조직관리시스템의 정부기관 기구도를 기관 한 곳당 한 행으로 담은 전국 단위 파일(csv)로, 기관코드·상위기관코드·최상위·차상위기관코드·서열순서·기관명·등록·종료일자를 담는다. 분석가나 개발자가 특정 부처 아래 어떤 하위기관이 있고 그 상위 계통이 어떻게 되는지, 기관이 언제 생기고 없어졌는지를 확인하는 데 쓴다. 기관코드(instt_cd)와 기관고유코드(mois_org_uniq_cd)를 키로 행정표준코드(code.go.kr) 기관코드나 기관코드를 쓰는 다른 공공데이터와 이어 쓰고, 상위기관코드로 같은 파일 안에서 계층을 펼친다.
description_portal: 정부조직관리시스에서 사용하는 정부기관의 중분류에 대한 데이터입니다. code.go.kr 등 기관코드 분류등과 같이 다른 공공데이트와 매칭해서 원하는데로 데이터를 가공해서 쓰시면 됩니다.기관코드, 상위기관코드, 서열순서, 기관명, 기관전체명, 최상위기관코드, 차상위기관코드 등 레이블 명을 가지고 있으므로 데이터를 참조하시여 필요에 맞게 수정하시기 바랍니다. 해당 데이터는 연에 한번씩 현행화 할 예정이며 테이블 형식도 필요에 따라 변경될 수 있으니 데이터 활용시 업무에 참고하시기 바랍니다.
