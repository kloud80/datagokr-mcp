description_portal: 지방공기업 경영평가 고객만족도 조사는 지방공기업이 제공하는 공공서비스에 대한 이용자의 만족도를 체계적으로 측정하고, 이를 바탕으로 전반적인 경영성과를 종합 평가하기 위해 실시됩니다. 본 조사는 행정안전부가 주관하고 지방공기업평가원이 수행하며, 공단시설을 포함한 다양한 유형의 공공시설 이용자를 대상으로 표본조사를 통해 진행됩니다. 설문을 통해 수집된 고객의 실제 이용 경험과 평가 결과는 데이터 기반 분석을 거쳐, 각 기관의 서비스 품질 개선과 고객 중심 경영 전략 수립에 활용됩니다. 나아가 공공기관의 투명성과 책임성을 강화하고, 시민 체감 행정의 신뢰도를 높이는 중요한 기초자료로 기능합니다.
