description_portal: 본 데이터는 경상남도 의령군 관내에 설치된 스마트 마을방송 시스템의 위치 및 설치 현황 정보를 제공합니다. 스마트 마을방송은 재난이나 긴급 상황 시 신속한 방송을 통해 주민에게 상황을 전달하고, 행정공지와 지역 행사 안내 등 다양한 정보전달 수단으로 활용됩니다. 본 데이터는 마을방송이 설치된 읍면명과 그 마을명칭, 마을회관의 도로명주소, 스마트마을방송이 설치된 연월, 마을방송 관리기관명과 관리기관의 전화번호를 제공하며, 지역 안전망 강화, 마을 단위 정보전달 효율화, 주민 편의 향상 등에 활용됩니다. 본 데이터는 정기적으로 갱신되며, 공공기관과 국민에게 개방되어 있습니다.
