description_portal: '[SGIS 오픈 플랫폼] "총조사 시각화 지도" 서비스에서 별도 관리되는 년도별 비자치구 정보입니다.기준년도, 지역명, 상위지역명 등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 총조사시각화지도  국가데이터처에서 실시하는 총조사(인구주택총조사, 농림어업총조사) 결과를 지도와 차트 등으로 시각화하여, 통계결과를 한눈에 확인할 수 있는 대시보드형 서비스'
