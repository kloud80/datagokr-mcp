description_portal: '이 데이터는 2017년부터 2037년까지 전북특별자치도 내 14개 시군을 대상으로 한 연도별 순이동자수를 나타낸 자료입니다. 순이동자수란 일정 기간 동안 전입자 수에서 전출자 수를 뺀 값으로, 해당 지역의 인구가 사회적 요인(예: 취업, 교육, 주거 등)에 의해 얼마나 유입되거나 유출되었는지를 보여줍니다. 이를 통해 전주시, 익산시, 군산시와 같은 주요 도시뿐만 아니라 진안군, 장수군 등 농촌 지역에서의 인구 이동 추세를 비교·분석할 수 있습니다. 이 데이터는 인구 구조 변화에 따른 정책 수립, 지방소멸 위험 진단, 정주 여건 개선 방안 마련, 지역균형발전 전략 수립 등 다양한 분야에서 활용될 수 있습니다. 특히 장기적인 인구 이동 경향을 파악함으로써 지역별 인구 유출입 패턴을 예측하고, 이에 대한 선제적 대응책 마련에도 유용합니다.'
