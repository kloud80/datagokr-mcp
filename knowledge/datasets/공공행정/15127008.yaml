description_portal: 지역화폐를 통한 지역경제 활성화와 소상공인 지원을 위해 전라남도 함평군은 ‘함평사랑상품권’ 관련 정보를 공공데이터로 개방하고 있습니다. 본 데이터는 함평군 관내에서 유통되는 지류형 함평사랑상품권에 대한 정보를 포함하고 있으며, 상품권 순번, 가맹점 명칭, 대표자 성명, 도로명주소 등의 항목으로 구성되어 있습니다. 해당 정보는 가맹점 분포 현황 분석, 지역 내 소비 흐름 파악, 지역화폐 운영의 투명성 제고 등에 활용될 수 있으며, 행정기관은 물론 민간 기업 및 연구기관에서 상권 분석, 모바일 지도 서비스, 상생 협력 정책 수립 등 다양한 분야에서 응용 가능합니다. 본 데이터는 지역자원의 디지털화와 정책의 효율적 추진에 기초자료로 활용될 수 있는 공공자산입니다.
