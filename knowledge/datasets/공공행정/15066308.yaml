description_portal: "인천광역시가 사회조사를 통해 제공하는 지난 1년간 구직활동 여부 경로 현황 공공데이터는 시민들이 최근 1년 동안 구직활동 경로에 대해 제공하고 있습니다. 지난 1년간(2025년) 구직활동 여부 자료입니다.* 공공취업지원기관(워크넷 등 포함)/ 인터넷 취업사이트/친척, 친구, 동료 등 주변 지인/ 해당기업(기관) 웹사이트/ 민간취업알선기관(인력사무소, 직업소개소 등)<데이터의 가치와 활용 방안>디지털 격차 파악: '인터넷 취업사이트'와 '공공기관 방문' 비중을 연령대별로 교차 분석하여, 고령층 등 디지털 취약계층을 위한 대면 지원 필요성을 도출할 수 있습니다.고용 정책 피드백: 워크넷 등 공공 서비스의 이용률이 낮다면, 홍보 강화나 시스템 개선의 근거로 활용됩니다.지역 경제 활성화: 지인 네트워크(인적 자원) 의존도가 지나치게 높을 경우, 정보의 비대칭성을 해소하기 위한 공적 정보망 확충 전략을 세울 수 있습니다."
