description_portal: '- 전라남도 산하 공사 출연기관 현황(공사 및 출연기관 구분, 기관명, 주소, 전화번호, 누리집 등)에 대한 데이터를 조회하실 수 있습니다.- "공사 출연기관"이란 정부 또는 공공기관이 출자하거나 출연하여 설립한 기관으로, 주로 공공의 목적을 수행하면서도 민간기업처럼 독립적으로 운영되는 조직을 말합니다. 보통 공공기관, 정부출연연구기관, 지방공기업, 공사(公社) 등이 이에 포함될 수 있습니다.-  전라남도의 공사 출연기관들은 지역 경제의 발전과 주민들의 삶의 질 향상을 위해 다양한 분야에서 활발히 활동하고 있습니다. 각 기관의 홈페이지나 전라남도청의 공식 웹사이트를 통해 더 자세한 정보와 지원 프로그램을 확인하실 수 있습니다.'
