summary_user: 조달청 나라장터의 납품요구 건에 대한 대금 종결 집계내역을 대금지급 건별로 담은 2024년 1~2월분 전국 파일(CSV 약 45MB)로, 계약금액·지출금액·지급결정금액·차감금액·선급금 정산액·지체일수와 지체상금 등을 포함한다. 분석가나 공공기관 담당자가 '어느 기관의 납품요구 건에서 지체상금이나 선급금 정산이 얼마나 발생했고 실제 지급액은 얼마였나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 나라장터 계약·납품 데이터와는 계약납품요구번호, 기관명, 업체명 같은 이름·번호 매칭으로만 이어 쓴다.
limits: 포털 설명상 2024년 1월과 2월분만 담고 있어 다른 기간의 추세 분석에는 쓰지 못한다. 표준 기관코드나 사업자번호 같은 전역 키가 없어 기관·업체를 다른 데이터와 연결할 때 이름 매칭 오류에 주의해야 한다.
