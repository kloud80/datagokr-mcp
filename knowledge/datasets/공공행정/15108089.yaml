summary_user: 전국 행정동 아래 통·반 단위로 전월·당월 주민등록 인구수와 그 증감을 성별(전체·남·여)로 담은 월별 집계 데이터다. 지자체·분석가가 특정 동네의 통·반별로 지난달 대비 인구가 얼마나 늘거나 줄었는지, 남녀 중 어느 쪽 변화가 컸는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 행정기관코드(admmCd)나 시도·시군구·행정동 이름 매핑, 통계년월로 같은 기관의 다른 주민등록 인구·세대 데이터와 맞춰 쓴다.
description_portal: 행정기관과 통계년월을 기준으로 시도명, 시군구명, 행정동명, 통, 반, 전월인구수, 전월남자인구수, 전월여자인구수, 당월인구수, 당월남자인구수, 당월여자인구수, 전체인구증감, 남자인구증감, 여자인구증감을 조회하기 위한 서비스입니다.주민등록 데이터는 통계의 기본이 되는 인구 데이터로써, 주민의 신고에 따라 주민등록법 제6조의 규정에 근거하여 개인·세대별 주민등록표를 기반으로 매월 말일 집계하고 있으며 거주자, 거주불명자, 재외국민을 포함하고 있습니다.활용가치가 큰 주민등록 데이터의 제공 단위를 통반 단위, 도로명 등으로 확대하여 오픈API 방식으로 제공함으로써, 주민등록 데이터를 활용한 국가정책수립, 민간·공공서비스 개발, 창업 지원 및 일자리 창출 등 다양한 분야의 디지털 전환 및 국민 삶의 질 향상에 기여할 목적으로 작성되었습니다.
