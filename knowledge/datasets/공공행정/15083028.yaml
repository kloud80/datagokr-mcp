description_portal: 서울특별시 관악구에서 제공하는 관내 공공시설개방 정보를 관리하는 DB(서비스상태, 서비스명, 결제방법, 서비스 대상, 바로가기 주소, 장소X좌표, 장소Y좌표)본 데이터는 관악구 전역의 공공시설을 대상으로 제공되는 시설대관 서비스 정보를 정리한 현황 데이터입니다. 서비스구분, 서비스ID, 대·소분류명, 서비스명, 결제방법, 장소명, 바로가기 링크, 좌표값(X·Y), 이용 가능 시간(개시·종료), 접수 기간, 지역명 등 다양한 속성을 포함합니다.이 데이터는 각 주민센터·보훈회관·자치회관 등 공공시설에서 제공하는 강의실, 회의실, 다목적실, 강당 등 공간대관 서비스를 체계적으로 파악할 수 있도록 구성되어 있습니다. 특히 서비스 상태(예약중지·운영중 등), 결제 방식(무료·유료), 좌표 기반 위치 정보, 예약 페이지 URL 등이 포함되어 있어 주민 이용 편의 증진, 공간 수요 분석, 시설 운영 효율화 정책 수립에 활용됩니다.
