description_portal: 대전교통공사의 매식 관련 정보입니다.이 데이터는 공사 직원들의 근무 중 식사 제공 내역을 관리하기 위해 생성된 자료로, 매식이 발생한 일자와 구체적인 매식 시간, 해당 식사에 사용된 금액, 그리고 조식·중식·석식 등 식사 구분 정보를 포함하고 있습니다.이를 통해 근무 형태별 식사 현황 분석, 예산 집행 관리, 매식 제공 기준 점검 등에 활용할 수 있습니다.데이터는 매년 1회 정기적으로 업데이트되고 있으며, 2021년 2월부터 2024년 12월까지의 매식 기록이 축적되어 있습니다.현재까지 누적된 데이터 건수는 총 21,902건으로, 조직 내 매식 운영 현황을 종합적으로 파악하기에 충분한 규모를 갖추고 있습니다.
