summary_user: 지방자치단체별로 일반회계·기타특별회계·공기업특별회계·기금을 합산한 전체 재정의 수입과 지출을 복식부기 계정과목 단위로 담으며, 회계연도별 당기금액·전기금액·증감율을 제공하는 전국 범위 집계 데이터다. 주민이나 지방재정 분석가가 "우리 시·군·구의 전체 재정 수입과 지출이 전년보다 어느 계정에서 얼마나 늘거나 줄었나"를 확인하는 데 쓴다. 전역 조인 키가 확인되지 않아 자치단체 코드(laf_cd)나 자치단체명, 회계연도(fyr)를 기준으로 같은 지방재정365 계열 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 지방자치단체의 통합재정운영표는 일반회계, 기타특별회계, 공기업특별회계, 기금을 포함한 전체 재정의 수입과 지출을 통합하여 보여주는 재정정보입니다. 이는 주민에게 자치단체의 재정운영 실태를 명확하게 전달하고 재정의 투명성과 책임성을 높이기 위해 공개하고 있습니다.통합재정운영표 정보는 2015회계연도부터 제공되고 있으며, 대상회계는 기금을 포함한 자치단체 전체회계 합산금액 대상입니다. 세부 제공 항목으로는 복식부기 계정과목별 당기금액과 전기금액, 증감율 정보가 제공되고 있습니다.
