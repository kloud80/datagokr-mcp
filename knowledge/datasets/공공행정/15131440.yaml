description_portal: 본 서비스는 지식재산과 관련된 학술지의 영문 기사 버전을 제공하여 국내외 이용자들이 연구성과와 전문지식을 보다 폭넓게 활용하실 수 있도록 지원합니다. 특허, 상표, 디자인, 저작권, 기술사업화, 지식재산 정책 등 다양한 분야의 영문 학술논문과 연구자료를 제공함으로써 국내 연구성과의 국제적 확산과 학술 교류를 촉진합니다. 또한 해외 연구자, 전문가, 기업 관계자 및 학생들이 국내 지식재산 분야의 연구동향과 주요 성과를 쉽게 이해하고 활용할 수 있도록 신뢰성 있는 영문 콘텐츠를 제공합니다. 이를 통해 국제적인 연구협력과 정보 공유를 활성화하고, 지식재산 분야의 글로벌 경쟁력 강화와 학문적 발전에 기여하는 전문 학술정보 서비스를 제공합니다.
