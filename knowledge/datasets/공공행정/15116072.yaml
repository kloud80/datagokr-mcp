description_portal: 본 데이터는 대전광역시 서구청 소속 각 행정 부서에서 업무용으로 사용 중인 컴퓨터(PC)에 대한 장비 보유 현황 정보다. 데이터에는 부서별 설치 현황, 사용 용도(개인/공용), 운영체제 종류, 장비 모델명, 제조사, 도입연도 등의 항목이 포함된다.자료는 실사용 중인 컴퓨터 기준으로 구성되며, 폐기 예정이거나 행정업무 외 목적의 장비는 제외된다.장비 도입 연도를 기준으로 작성되며, 실사용 개시 연도와 차이가 있을 수 있다.데이터는 정기점검(연 1회) 및 신규 도입 시 업데이트되며, 장비 노후화 대응, 정보자산 계획 수립, 디지털 전환 정책 등의 행정업무에 참고 자료로 활용된다.
