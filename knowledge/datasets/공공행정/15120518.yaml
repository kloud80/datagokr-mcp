description_portal: “공단에서 직원 공개채용(일반직, 공무직, 한시직 등)에 관한 정보”는 공단이 실시하는 직원 채용 공고에 대한 주요 정보를 제공하는 데이터입니다. 해당 데이터는 주관 부서, 채용 공고명, 조회수, 공지 여부, 등록일 등의 항목으로 구성되어 있으며, 일반직, 공무직, 한시직 등 다양한 고용 형태의 채용 현황을 확인할 수 있습니다. 본 데이터는 공공기관의 인사 운영 투명성을 제고하고, 구직자들의 채용 정보 접근성을 높이는 데 활용될 수 있습니다.자세한 정보는 공단홈페이지(https://www.dpfc.or.kr) 정보공개 메뉴에서 확인하실수 있습니다.
