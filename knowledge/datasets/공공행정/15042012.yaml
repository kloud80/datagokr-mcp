description_portal: 분야 및 부문별로 분류된 국고보조금 예산 편성 현황을 연도별로 제공하는 통계입니다.자료에는 보조사업 유형별 예산액과 항목별 총계가 포함되어 있으며, 각 금액은 국회에서 확정된 본예산 기준으로 산출됩니다.예산총액은 원단위 기준 전체 예산을 천만 단위로 반올림하여 제공되며, 데이터는 분야별 지원 방향과 부문별 재정 배분의 흐름을 분석하는 데 활용됩니다.이 통계는 중앙정부 재정 운영의 투명성 확보와 보조금 효율성 제고를 위한 기초자료로, 정책 평가와 재정계획 수립에 참고됩니다.정부기관, 연구기관, 예산담당 부서 등에서 보조사업의 예산 구성 및 변동 추이를 파악하고, 관련 정책 수립 시 실무적으로 활용할 수 있습니다.
