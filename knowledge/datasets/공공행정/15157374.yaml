description_portal: 국가데이터처 데이터전문기관은 서로 다른 기관이 보유한 데이터를 안전하고 합법적으로 결합·활용할 수 있도록 지원하는 전문기관입니다.신용정보법 제26조의4 등에 근거해 지정되며, 공공·민간의 가명정보 결합을 통해 공익적 가치와 산업 혁신을 촉진하는 중립적 허브로 기능합니다.결합 전·중·후 전 과정에서 결합키 관리, 재식별 위험 최소화, 안전한 분석·제공 환경 구축 등 적법성과 보안을 책임집니다.이를 통해 정책 수립·연구개발·산업 혁신 등에서 데이터 기반 의사결정을 촉진하고 국가 데이터 활용 역량을 높입니다.데이터전문기관의 주요업무는 정보집합물 결합·전달, 가명·익명처리 적정성 평가, 사전결합률분석입니다.본 데이터는 데이터전문기관의 게시물정보입니다. 게시물제목, 조회수, 등록일 등의 정보를 담고 있습니다. 더 자세한 국가데이터처 데이터전문기관의 소식을 알고 싶으신 분은 데이터전문기관(https://da.mods.go.kr)으로 접속부탁드립니다.
