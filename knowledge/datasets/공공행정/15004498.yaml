description_portal: '강원특별자치도 강릉시 관내 노인복지시설 현황을 제공하는 데이터로, 시설의 종류·수용유형·위치·연락처를 함께 담고 있어 지역 내 노인복지 인프라를 한눈에 파악할 수 있습니다.주요 항목은 다음과 같습니다.시설종류: 노인요양시설, 노인주거복지시설, 노인여가복지시설, 재가노인복지시설 등과 같이 시설의 법적·기능적 유형수용유형: 입소형, 주·야간보호, 단기보호, 재가서비스 등 시설이 제공하는 서비스 및 이용 형태시설명: 각 노인복지시설의 명칭(기관명)도로명주소: 시설의 도로명 기반 주소(내비게이션·지도 서비스에서 활용 용이)연락처: 시설에 직접 문의할 수 있는 전화번호위도, 경도: 시설 위치를 나타내는 좌표 정보로, GIS(지도) 기반 위치조회 및 분석에 활용데이터기준일자: 시설 현황 정보가 갱신·확인된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 노인복지시설을 시설종류–수용유형–주소–좌표–연락처 단위로 구조화하여 제공함으로써,읍·면·동 및 생활권역별 노인복지 인프라 분포 분석고령인구 밀집지역 대비 복지시설 공급 수준 파악복지 정책 수립 시 신규 시설 입지 검토 및 서비스 사각지대 발굴시민·보호자 대상 주변 노인복지시설 검색 서비스(지도/앱) 구축등에 활용할 수 있는 노인복지 인프라 현황 공공데이터입니다.'
