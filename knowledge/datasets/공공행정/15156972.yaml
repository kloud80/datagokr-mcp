description_portal: '본 청렴계약 및 윤리서약 데이터는 한국중부발전의 전사적 윤리경영 실천 의지와 준법 문화 확산 수준을 확인할 수 있습니다. 항목으로는 년도 구분(직원 윤리서약 또는 임원직무청렴계약) 서약대상 서약인원(단위: 명) 비고로 구성되어있으며 모든 인원이 반부패 및 투명성 강화에 대한 공식적 약속(청렴계약/윤리서약)을 이행함으로써, 조직 내부적으로 높은 윤리적 책임감을 확보하고 있음을 입증합니다. 이는 대외적으로 신뢰도를 제고하고 리스크를 사전 예방하는 경영 시스템이 구축되었음을 의미합니다.'
