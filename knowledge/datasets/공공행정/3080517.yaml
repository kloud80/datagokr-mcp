summary_user: 부산광역시 남구에 신고된 행정사 사무소를 한 건씩 담은 원장으로, 행정사 종류(일반·해사·외국어번역), 성명, 사무소 명칭, 도로명주소, 영업 여부, 위도·경도를 사무소 단위로 담는다. 남구 주민이나 사업자가 '집 근처에서 영업 중인 행정사 사무소가 어디 있는가', '해사나 외국어번역 업무를 맡는 행정사가 있는가'를 찾을 때 쓴다. 전역 조인 키는 없어서 다른 자치구 행정사 현황과는 같은 항목명으로 이어 붙이고, 위도·경도나 도로명주소로 지도나 다른 생활 시설 데이터와 위치를 겹쳐 본다.
limits: 남구 한 개 시군구 범위만 담으므로 부산 전체나 전국 행정사 분포는 다른 자치구 파일을 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와는 주소·좌표나 이름 매핑으로만 연결된다.
