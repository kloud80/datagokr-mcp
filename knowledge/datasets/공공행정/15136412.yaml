summary_user: 경기공유서비스(공유누리)에 등록된 캠핑장마다 고유번호와 시설 코드, 시설별 개수를 담은 목록으로, 캠핑장 하나에 시설 종류별로 한 행씩 기록된 원천 자료입니다. 캠핑장 예약 이용자나 정책 담당자가 '이 공공캠핑장에 샤워장·화장실 같은 편의시설이 몇 개 있는가'를 확인하거나 지역별 시설 규모를 비교할 때 씁니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 캠핑장 고유번호(idntfy_no)를 같은 기관의 경기공유서비스 캠핑장 기본정보와 맞춰 잇거나 시설 코드를 이름으로 매핑해 연결해야 합니다.
description_portal: 이 데이터는 캠핑장 시설 자원에 대한 세부 정보를 제공하는 자료로, 각 캠핑장에 부여된 고유번호와 그에 해당하는 시설 코드, 시설별 개수로 구성되어 있습니다. ‘시설개수’는 해당 캠핑장 내 각 시설의 수량을 의미하여, 캠핑장의 편의시설 보유 여부 및 규모를 파악하는 데 활용됩니다. 이 데이터는 공공캠핑장 예약 플랫폼에서 사용자에게 캠핑장의 시설 현황을 안내하거나, 캠핑장 조성 계획 및 예산 배분, 지역별 캠핑 수요 분석 등에 활용될 수 있습니다. 특히, 공공자원으로서의 캠핑장을 효율적으로 활용하고자 하는 정책 수립 시 기초자료로 활용됩니다.
