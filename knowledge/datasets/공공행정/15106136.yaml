description_portal: 「사이버폭력 실태조사」는 온라인 환경에서 발생하는 폭력 경험과 인식을 파악하기 위한 조사로, 디지털 시민의식 제고 및 정책 수립에 활용됩니다. 주요 항목 중 하나인 온라인 이용 현황은 대상자의 일반적인 인터넷 사용 빈도, 용도, 접속 기기 등을 파악하여 사이버 활동의 기반을 이해합니다. 이어 소셜미디어 이용 현황은 카카오톡, 유튜브, 인스타그램 등 플랫폼별 사용 실태를 조사하여 사이버폭력이 일어날 가능성이 큰 채널을 특정합니다. 또한 사이버폭력 관찰 경험을 통해 타인의 피해나 가해 장면을 목격한 빈도와 경로를 조사하며, 이는 방관자 역할과 디지털 공감능력 측정에 활용됩니다. 사이버폭력 피해 경험은 악성 댓글, 따돌림, 계정 해킹 등 다양한 유형의 피해를 직접 당한 사례를 수집하고, 그에 대한 대응방식(무대응, 신고, 상담 등)을 함께 파악합니다. 마지막으로 사이버폭력 가해 경험 항목은 고의적·비고의적 행위 여부, 동기, 후속 인식 등을 측정해 교육 개입의 필요성을 진단합니다. 이 조사는 주로 청소년 및 성인을 대상으로 하며, 정책·교육·상담·플랫폼 개선을 위한 근거자료로 폭넓게 활용됩니다.
