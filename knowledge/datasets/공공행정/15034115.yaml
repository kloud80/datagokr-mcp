description_portal: 대구광역시 남구 소재의 행정기관(구청, 행정복지센터) 현황에 대한 데이터로 기관명, 지번주소, 도로명주소, 대표 전화번호, 대표 팩스 등의 항목을 제공합니다.민원사항이나 문의사항이 있으실 때 활용 가능합니다.대구광역시 남구는 본청(1) 행정복지센터(13) 정보를 제공합니다.동 행정복지센터는 민원실 및 주민자치센터로 구분됩니다. 민원실은 각종 제증명 및 신고, 사회복지서비스 신청 등이 가능합니다.주민자치센터는 각종 문화교실 등의 프로그램을 운영하고 있습니다.일부 회의실은 대관도 가능합니다.
