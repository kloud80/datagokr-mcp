description_portal: 대구광역시 북구 외 공공목적으로 추진 중인 사업 내용은 해당 각 위치에 게시되어있는 현수막을 통해 확인하실 수 있습니다.대구광역시 북구_지정벽보판 게시대 현황은 2025. 05. 26. 기준 대구광역시 북구 관내 각종 개인 상업 홍보용으로 게시 및 운영되고있는 지정 벽보판의 연변, 지정 게시대명, 설치 위치, 수량에 대한 정보를 제공하고 있습니다.현재 대구광역시 북구 관내 지정 벽보판은 95개소가 설치되어있습니다.해당 내용의 정확한 연번, 지정 게시대명, 설치 위치, 수량은 첨부파일을 참고해 주시기 바랍니다.대구광역시 북구는 대구광역시옥외광고협회에 위탁하여 지정 벽보판을 운영하고 있으며, 해당 벽보판 이용을 희망할 시, 대구광역시옥외광고협회에 문의를 통해 게시할 수 있습니다.
