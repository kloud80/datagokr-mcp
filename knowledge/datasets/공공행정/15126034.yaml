summary_user: 국회 위원회에 계류 중인 법률안을 의안 한 건 단위로 담으며, 대수·의안번호·법안명·제안자·제안일과 소관위원회 회부·상정·처리일, 법제사법위원회 회부·처리 결과 같은 심사 단계 정보를 포함한다. 시민·기자·입법 분석가가 "지금 어느 위원회에 어떤 법안이 묶여 있고 심사가 어디까지 진행됐나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 국회 계열 의안·의원 데이터와는 의안번호(BILL_NO)나 대표발의 의원 코드(RST_MONA_CD) 같은 같은 기관 코드, 또는 법안명 매핑으로 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
