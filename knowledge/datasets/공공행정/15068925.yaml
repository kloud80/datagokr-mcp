description_portal: 전북 특별자치도 진안군의 계약정보에 대한 공공데이터 자료입니다. 이번 자료에서는 계약 관서, 계약부서, 계약명, 계약 금액, 계약일, 계약상대자, 구분, 계약 종류에 대한 정보를 제공합니다. 이 자료 중 계약명을 통해 1년 동안 어떤 계약을 주로 하였는지 알아볼 수 있고, 계약 금액으로 계약을 진행했는지 확인할 수 있습니다. 또한 계약상대자 정보로 어떤 업체들과 계약을 진행하고 사업을 시행하였는지도 알아볼 수 있습니다. 그리고 구분 정보를 통해 이 계약이 용역인지, 공사인지, 물품인지 파악할 수 있습니다.
