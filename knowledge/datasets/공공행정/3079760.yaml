description_portal: 시민 정보화 교육 데이터는 시민을 대상으로 한 정보화 교육의 일정 현황을 정리한 자료입니다.교육 과정명, 교육 기간, 교육 장소, 교육 정원 등 항목이 포함되어 있으며, 시민의 디지털 역량 향상과 정보 격차 해소를 위한 정책 수립 및 교육 프로그램 개선에 활용됩니다. 이를 통해 디지털 환경에 대한 시민의 접근성과 활용 능력을 향상시키고, 컴퓨터와 스마트기기 사용, 인터넷 활용 등 정보화 역량을 높이고, 다양한 디지털 서비스를 활용할 수 있는 기반을 마련하고자 합니다  - 항목 (교육기간 및 시간(시작, 종료),  교육장소 5개소(국동 정보화교육장, 쌍봉 정보화교육장, 율촌 인터넷사랑방, 화양 인터넷사랑방, 광림 인터넷사랑방)
