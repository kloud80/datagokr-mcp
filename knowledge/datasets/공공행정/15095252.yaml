summary_user: 부산광역시 상권별로 상권구분명, 상권명, 변화지표값(성장·쇠퇴 등), 평균생존개월수·평균폐업개월수와 이를 비교할 부산 평균값을 담은 상권 단위 집계 데이터이다. 창업 예정자나 프랜차이즈 사업자가 '이 상권에서 점포가 부산 평균보다 오래 버티는가, 쇠퇴형인가'를 판단하거나, 정책 담당자가 쇠퇴 상권을 골라 도시재생·공공 지원 대상을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 상권·인허가(LOCALDATA) 자료와는 상권명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 부산시 상권 변화지표정보를 개방합니다. 상권변화지표는 특정 지역의 상권(상업 활동이 이루어지는 구역)의 성장, 쇠퇴, 안정성, 잠재력 등을 수치화하여 상권의 변화 추이를 파악하는 지표입니다.본 데이터에는 상권구분명, 상권명, 변화지표값, 평균생존개월수, 평균폐업개월수, 부산 평균생존개월수,부산 평균폐업개월수의 정보를 제공합니다. 본 데이터를 통해 쇠퇴형 상권을 대상으로 도시재생사업, 공공 지원 확대의 정책을 수립하거나 창업지나 프랜차이즈의 유망 지역을 선정하고 임대료 추이 및 점포 수 증가로 향후 가치 예측 등의 분야에 활용할 수 있습니다.
