summary_user: 고양시가 소유한 공유재산 건물을 건축물대장 한 건당 한 행으로 재산명·소재지·건물용도를 담은 원장 파일(csv 약 43KB)이며, 같은 공원 안의 관리사무소와 화장실처럼 대장이 따로 있으면 별 건으로 들어간다. 시민이나 분석가가 "우리 동네에 시 소유 건물이 어디에 있고 무슨 용도로 쓰이나"를 확인하거나 시 보유 시설의 용도별 분포를 볼 때 쓴다. 전역 조인 키는 없어서 소재지 주소나 재산명을 이름으로 맞춰 건축물대장이나 고양시의 다른 시설 데이터와 이어 쓴다.
description_portal: 고양시 공유재산 건물현황 데이터는 고양시에서 소유하고 있는 공유재산 건물에 대한 건물명, 주소, 건물유형 등의 항목을 제공합니다.- 건축물대장에 등재되어 있는 건물 현황만 제공하며, 집합건물의 경우에도 각 호로 건축물대장이 있을 경우에는 별도로 제공합니다.  (예시)000공원에 소재하는 건축물  "000공원 관리사무소, 000공원 화장실 1호, 화장실 2호, 화장실 3호"는  각각 건축물대장이 존재하여 별 건으로 제공됨- 등기부등본 등재 여부로 구분하지 않고 건축물대장을 기준으로 제공함.
