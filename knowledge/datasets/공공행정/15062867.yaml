summary_user: 경기도의회에서 열린 본회의·위원회 등 각종 회의를 회의록 한 건당 한 행으로 담은 목록으로, 연도·의회 대수·회기·회의 차수·회의일시·회의 구분·안건 유무·전체 회의명·피감사기관·등록일시를 포함한다. 시민이나 의정 분석가가 '특정 대수 경기도의회에서 어느 위원회가 언제 몇 차례 회의를 열었고, 행정사무감사 대상 기관은 어디였나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으며, 회의명·피감사기관 이름을 맞추거나 같은 경기도 기관 데이터(회의록 본문 등)와 대수·회기·차수로 이어 쓴다.
description_portal: 이 데이터는 경기도의회에서 진행된 각종 회의의 회의록 목록을 수록한 자료로, 고유번호, 년도, 의회대수, 회기정보, 회의차수, 회의명코드, 회의일시, 회의구분, 안건유무, 전체회의명, 피감사기관, 등록일시 등을 제공합니다.  또한 회의가 이루어진 날짜와 피감사기관 유무 여부, 회의의 전체 명칭, 회의 개최 연도 및 대수 등도 명시되어 있어 의회 활동 이력을 체계적으로 파악할 수 있습니다. 지방의회의 회의 운영 현황, 위원회별 활동 분석, 정책 추진 동향 등을 분석하는 데 활용 가능합니다. 이 자료는 지방의회 의정활동의 투명성 제고와 정책 개발 및 입법 지원을 위한 참고자료로도 유용합니다.
