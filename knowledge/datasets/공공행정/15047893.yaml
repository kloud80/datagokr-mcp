description_portal: '시청자미디어재단에서 2024년 전국 학교를 대상으로 동아리 미디어교육 지원합니다. 이에 따라 전국 12개 센터에서 운영 중인 학교 동아리 미디어교육 지원 현황을 공유합니다.데이터 현황은 학교미디어교육 순번, 학교명,관할센터,지역,학교주소,진행학기,교육주제,프로그램명(세부),교육일자와 비고 사항으로 구성되었습니다.데이터 기준일: 2024.05.16(2025.06.16) 해당 데이터의 출처인 학교 동아리 미디어교육 지원 사업이 학교 미디어교육 지원 사업으로 변경되어 데이터 제공을 중단합니다.'
