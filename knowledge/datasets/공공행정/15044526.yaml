description_portal: 한국자산관리공사에서 위탁, 관리하고 있는 국유증권(국세물납증권 등)의  유형별 종목수를 제공합니다.주된 관리는 국세물납증권*을 취급하고 있으며, 현재 증권으로 물납할 수 있는 조세는 상속세입니다.과거에는 증여세도 수탁받았지만, "08년 시행령 개정을 통해 증여시점이 "08.1.1. 이후인 경우 물납 불가여 수탁받고 있지 않습니다. 국세물납증권이란, 납세자의 편의를 위해 즉시 현금화하기 어려운 부동산이나 증권에 대하여 현금납부의 예외로서 해당 재산으로 납부할 수 있도록 한 제도입니다.국세물납증권 이외 정부이관증권도 취급하고 있으며, 타 기관에서 공사로 이관한 정부소유유가증권을 정부이관증권이라고 합니다.
