summary_user: 광역·기초지자체의 사회적기업·협동조합·마을기업 등 사회적경제 관련 조례와 규칙 833건을 한 건씩 담은 파일로, 조례명·지역명·제정/개정 구분·법령종류·공포번호·공포일자·시행일자·국가법령정보센터 링크를 포함하며 공포 기간은 2009-01-08부터 2022-09-01까지다. 지자체 담당자나 사회적경제 분석가가 "우리 지역에는 사회적경제 지원 조례가 있고 언제 제정·개정됐나"를 확인하거나 지역별 조례 제정 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 지역명(지자체 이름) 매핑으로 잇고, 조례 원문은 국가법령정보센터 링크로 따라간다.
description_portal: 사회적경제 지역생태계 구축 지원사업의 일환으로 광역, 기초지자체의 사회적기업, 사회적가치 등 사회적경제 관련 조례 현황 수집하여 제공합니다.연번 / 조례 및 규칙명 / 구분 / 지역명/ 제정_개정구분 /법령종류/공포번호/공포일자/시행일자/국가법령정보센터 링크의 칼럼정보를 제공합니다.총 833개의 사회적경제관련 조례 현황을 제공하며 사회적기업, 협도옺합, 마을기업 등 다양한 사회적경제기업관련 조례를 제공합니다.데이터관련 문의사항이 있으시다면 한국사회적기업진흥원 정보화기획팀으로 문의 부탁드리겠습니다. 감사합니다.
