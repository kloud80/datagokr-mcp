description_portal: '서울특별시 중랑구 대표홈페이지의 관련사이트 정보를 제공합니다. 중랑구 홈페이지의 하단에 위치하는 관련사이트 바로가기에 대한 정보입니다. 항목은 순번과 사이트명 그리고 사이트의 주소로 구성되어 있습니다. - 중랑구 홈페이지: www.jungnang.go.kr 를 통해서 관련된 서비스로 바로 이동할 수 있도록 편리한 기능을 제공하고 있습니다. 14개 사이트가 연계되어 있으며 중랑동행사랑넷, 방정환교육지원센터, 중랑미디어센터 등이 있습니다. 자세한 사항은 중랑구 홈페이지에 방문하시어 하단의 바로가기 링크를 확인하여 주시기 바랍니다. 감사합니다.'
