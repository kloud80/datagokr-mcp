description_portal: '이 데이터는 「공공기관의 운영에 관한 법률」에 따라 지정된 370개 공공기관(부설기관 포함)의 임직원 현황을 정리한 자료로, 각 기관의 정원 및 현원, 직급별 인원 수 등을 포함하고 있습니다. 재정경제부의 ‘알리오(ALIO)’ 공공기관경영정보공개시스템을 통해 공개되며, 기관별 인력 규모와 직제 구조를 파악할 수 있는 주요 기초자료입니다.직급별 인원 구성(예: 기관장, 본부장, 일반직 등)은 물론 정원 대비 실제 인원 현황을 통해 인력운용의 적정성과 효율성을 평가할 수 있으며, 유사 기관 간 비교 분석이나 인사·조직 정책 수립에도 활용됩니다. 공공기관의 인력 구조를 투명하게 공개함으로써 국민의 알 권리를 보장하고 공공부문의 책임성과 신뢰성 제고에 기여합니다.'
