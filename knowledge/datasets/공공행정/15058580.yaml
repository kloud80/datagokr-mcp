summary_user: 지방자치단체별로 환금자산(재정자금) 대비 차입부채 비율을 회계연도(fyr) 단위로 담은 지방재정365 공시 지표 집계로, 범위는 전국이다. 주민이나 분석가가 "우리 시·군·구의 차입부채가 가진 재정자금에 비해 얼마나 많은가, 다른 자치단체보다 차입 의존도가 높은가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 지방재정365 지표와는 자치단체 코드(laf_cd)나 자치단체명을 맞춰서 연결해야 한다.
description_portal: 지역통합재정자금대비차입부채비율은 지방자치단체의 재정자금과 치입 부채의 관계를 나타내는 지표입니다.해당 지표의 비율은 자치단체가 차입한 부채가 재정 자금에 비해 얼마나 많은지를 보여줍니다.비율이 높을수록 차입 부채의 의존도가 커져 재정적 위험이 증가할 수 있으며, 낮을수록 자치단체가 자주적인 재정 관리를 하고 있다는 의미로 해석됩니다.이 지표는 자치단체가 차입금 상환 능력을 평가하고, 장기적인 재정 건전성을 유지하기 위해 전략을 수립하는 데 매우 중요한 역할을 합니다.
