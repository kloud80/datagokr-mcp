description_portal: 2024년 청렴포털을 통해 공공기관에 접수된 공익신고를 6개 공익신고분야의 법률별로 분류하여 접수 건수를 제공합니다. 이를 통해 각 법률별로 공익 침해 행위가 얼마나 발생했는지 파악할 수 있으며, 법률의 실효성 평가 및 개선 방안 마련에 활용하여 공익 침해 행위 예방 및 공익신고자 보호 정책 수립에 적극적으로 활용할 수 있습니다. 또한, 특정 분야에서의 신고 건수가 많다면 해당 분야의 제도적 문제나 관리상의 허점이 있을 수 있음을 시사하며, 이를 통해 보다 효과적인 부패 방지 대책을 수립할 수 있습니다.​
