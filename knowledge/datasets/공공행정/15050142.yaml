legal_basis_portal: 본 자료는 「공공기록물 관리에 관한 법률」 제16조(기록물의 생산 및 수집), 「지방자치단체 재무회계규칙」 제6조(회계관계서류의 작성·보존), 「정보공개법」 제3조 및 제6조에 따라, 경기도 하남시에서 지방재정시스템(e-호조)을 통해 생성·관리하고 있는 회계 및 계약 관련 공공기록물로서, 적법한 행정기록물로 보유 중입니다. 행정업무의 투명성과 책임성 확보를 위한 근거 자료로 활용됩니다.
