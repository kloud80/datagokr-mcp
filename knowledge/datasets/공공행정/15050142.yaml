description_portal: 본 자료는 경기도 하남시에서 제공하는 하도급 공사계약 관련 정보로서, 원도급 계약과 연계된 하도급 계약의 체결 현황을 확인할 수 있도록 구성되어 있습니다. 주요 제공 항목에는 공사의 계약명, 계약연도, 계약방법, 계약금액, 하도급계약금액, 하도급율, 하도급 업체명, 준공예정일자 및 실제 준공일자 등이 포함됩니다.하도급계약금액과 하도급율은 해당 공사의 총계약금액 대비 하도급에 배분된 금액 및 비율을 기준으로 산정되며, 업체명은 실제 계약체결이 이루어진 수급사업자 기준으로 제공됩니다.해당 정보는 지방재정통합시스템(e-호조) 및 건설산업정보종합관리시스템을 기반으로 수집된 자료이며, 하도급 거래의 투명성 확보와 공정한 계약질서 확립을 목적으로 제공합니다.자료는 공공기관 계약의 이행실적 분석, 공정거래 관련 제도 이행 확인, 의회 및 감사 대응 자료 등으로 활용될 수 있으며, 항목별 상세 정의 및 해석 기준은 「지방자치단체 입찰 및 계약 집행기준」, 「건설산업기본법」 및 관련 지침을 참고해주시기 바랍니다.건수가 많아 일반 문서편집 도구로는 일부 항목이 누락될 수 있으므로, 분석 전용 프로그램(R, Stata, Excel PowerQuery 등)의 활용을 권장드립니다.
