description_portal: 울산광역시 남구 관내에 위치한 반려동물 등록 현황에 대한 데이터 입니다.반려동물 등록제는 반려동물과 보호자를 식별하고 유기/유실을 예방하기 위해 시행되는 제도입니다.내장형 마이크로칩이나 외장형 인식표를 통해 등록대상동물을 관리하며, 미등록 시 과태료가 부과됩니다.보호자는 지자체 동물등록 서비스를 이용해 신규 등록/변경/이전 신고를 할 수 있고, 등록된 정보는 동물보호관리시스템을 통해 체계적으로 관리됩니다.해당 데이터는 년도, 읍명동, 등록주체(시군구), 등록주체(대행업체), 등록주체(기타(이벤트등)),  RFID종류(내장형),  RFID(외장형),  RFID(인식표), 등록 품종수,  동물소유자수, 동물소유자당 동물등록수, 합계, 기준일자로 구성되어있습니다.
