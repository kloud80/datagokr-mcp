description_portal: '- 2020년~2022년  말 기준 전남통계연보에 있는 주요 자료를 하루 단위로 환산한 통계(출생, 사망, 혼인, 이혼 등 12분야)를 제공합니다.- 이 통계 정보는 전라남도의 인구 구조, 혼인 및 이혼 동향, 출생 및 사망률 등을 분석하는 데 유용합니다. 예를 들어, 출생률과 사망률을 비교하여 인구 증가 또는 감소 추이를 파악하거나, 혼인 및 이혼 건수를 통해 사회적 변화 양상을 분석할 수 있습니다.- 이 데이터는 전라남도의 정책 기획 및 평가, 연구기관의 분석, 학술 연구 등 다양한 분야에서 활용될 수 있습니다. 데이터를 활용하여 전라남도의 사회적, 경제적 동향을 이해하고, 정책 수립에 필요한 기초 자료로 활용하시기 바랍니다.'
