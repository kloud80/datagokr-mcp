description_portal: '○ 통계개요* 통계명 : 인구동향(출생,사망,혼인,이혼통계)* 통계종류 : 서울시 인구동향을 월별로 제공하는 지정ㆍ전수통계* 근거법령 :「인구동태조사규칙」(재정경제부령 629호)* 작성목적 : 인구규모 및 구조의 변동요인인 출생·사망·혼인·이혼 현황을 파악하여 정책수립의기초자료 및 연구자료 등으로 제공하기 위함* 조사체계 : 동 → 자치구 → 시도→ 통계청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - - 출생아수, 사망자수, 혼인건수, 이혼건수 등○ 용어설명○ 기타* 출생은 출생자, 사망은 사망자의 주소지 기준이며, 혼인·이혼은 남편의 주소지 기준으로 집계한 것임* 출생·사망: 발생월별 기준으로 지연신고 등을 추정하여 합산함(국내 거주만 집계)* 혼인·이혼: 신고월 기준으로 집계함* 통계표에 수록된 자료는 하위단위에서 반올림한 값으로 전체 수치와 하위분류의 합이 일치하지 않을 수 있음* 월별 자료는 신고 뿐 아니라 지연신고 등을 추정하여 반영함에 따라 이듬해 공표되는 연간 잠정치 및 확정치와차이가 있을 수 있음* 연간 확정 공표는 혼인, 이혼은 이듬해 3월, 출생은 이듬해 8월, 사망은 이듬해 9월'
