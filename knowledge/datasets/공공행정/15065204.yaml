description_portal: '- 2020년~2024년 전라남도 행정심판 청구에 대한 데이터로 행정심판 접수, 재결 사항을 수치로 확인할 수 있는 자료입니다.- 행정심판은 국민이 행정기관의 잘못된 처분이나 부작위로 권리를 침해당했을 때, 법원에 가기 전 행정부 내부에서 이의제기를 할 수 있는 절차입니다.- 행정청의 처분이나 부작위에 대해 불복이 있을 경우- 법원에 소송을 제기하기 전에 먼저 제기할 수 있는 행정부 내의 구제절차- 「행정심판법」에 근거- 행정심판 진행 절차- 청구서 제출- 처분이 있음을 안 날부터 90일 이내- 처분이 있었던 날로부터 180일 이내- 피청구인 의견 제출 (처분한 행정청)- 심리 및 조사- 재결(결정)- 기각: 원처분 유지- 인용: 처분 취소 또는 변경- 각하: 요건 불충족 시 판단하지 않음'
