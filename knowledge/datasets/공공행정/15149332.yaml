summary_user: 경기도국민안전체험관의 휴관 공휴일을 날짜(holdy_ymd)와 명칭별로 한 건씩 담은 목록으로, 신정·설날·3·1절 같은 국가 지정 공휴일이 들어 있다. 체험관 방문을 계획하는 시민이나 예약 시스템 운영자가 특정 날짜에 체험관이 휴관해 예약이 막히는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜나 공휴일 명칭을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 경기도국민안전체험관의 공휴일 정보를 정리한 자료로, 체험관 운영과 관련된 휴관일을 날짜와 명칭별로 제공하고 있습니다. 신정, 설날, 3·1절 등 국가 지정 공휴일이 포함되어 있으며, 안전체험관 방문 일정을 계획하는 시민이나 운영 관리자가 휴관 여부를 쉽게 확인할 수 있도록 구성되어 있습니다. 공휴일 지정을 통해 시스템에서 해당날짜에 예약이 불가능하도록 설정되어 있습니다. 공휴일별 데이터는 체험관의 서비스 운영일정과 직접적으로 연계되며, 이용객 안내, 예약 시스템 운영, 공공서비스 관리에 활용될 수 있습니다.
