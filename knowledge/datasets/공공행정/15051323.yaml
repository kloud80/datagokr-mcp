summary_user: 2015년 인구주택총조사를 바탕으로 전북특별자치도 시군별 일반가구 수를 주택 점유형태(자기집, 전세, 보증부월세, 무보증월세, 사글세, 무상)로 나눠 담은 집계 통계 파일이다. 전북 시군별로 자가 가구와 임차 가구의 비중을 비교해 임차 가구가 많은 지역을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군 이름을 행정구역 코드에 매핑해 이어 써야 한다.
limits: 표준 행정코드 같은 조인 키가 없어 다른 데이터와 붙일 때 시군명 매핑이 필요하다. 포털 설명상 2015년 한 시점의 자료라 이후 변화나 추이는 이 파일로 알 수 없다.
