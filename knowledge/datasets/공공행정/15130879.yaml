summary_user: 경기민원24에서 사용자가 입력한 검색어를 건별로 기록한 자료로, 일련번호·검색어 내용·서비스 일련번호·등록일시를 담고 범위는 경기도(비공간)다. 경기도 민원 담당자나 분석가가 특정 시기에 시민들이 어떤 민원 주제를 많이 찾았는지 확인하고 민원 안내·홍보를 개선할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 검색어 이름 매칭이나 같은 기관 자료(서비스 일련번호 기준 경기민원24 서비스 목록 등)로만 이어 쓴다.
description_portal: 경기민원24 시스템에서 사용자가 입력한 검색어의 빈도와 유형을 기록하여 통계적으로 제공하는 자료입니다. 데이터에는 일련번호, 검색어, 서비스 일련번호, 등록일시 등의 항목이 포함되며,이를 통해 특정 시기에 어떤 민원 관련 주제가 시민들에게 가장 큰 관심을 받았는지 확인할 수 있습니다. 이러한 데이터는 민원 서비스 개선, 정책 홍보, 행정 자원의 효율적 배분에 중요한 기초자료로 활용될 수 있으며, 검색 패턴 분석을 통해 사용자가 실제로 필요로 하는 정보에 더욱 쉽게 접근할 수 있도록 시스템을 최적화하는 데 기여할 수 있습니다.
