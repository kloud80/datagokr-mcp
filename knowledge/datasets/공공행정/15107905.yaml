description_portal: 본 데이터는 중소벤처기업진흥공단이 운영하는 해외기술교류사업 온라인 플랫폼(G_TEP)의 연도별 방문자 수 현황을 정리한 자료입니다. G_TEP(Global Technology Exchange Platform)은 국내 중소기업과 해외 유관기관 간의 기술 교류와 협력을 촉진하기 위해 구축된 온라인 플랫폼으로, 기술정보 제공, 해외 기술 매칭, 온라인 상담 지원 등 다양한 서비스를 제공합니다. 본 데이터에는 연도별 월별 방문자 수 정보를 제공합니다. 다만, 중소벤처기업진흥공단의 해외 기술교류센터 운영 사업은 2023년을 마지막으로 종료되었으며, 본 데이터는 사업 종료 시점까지의 누적 정보를 제공하는 기록 자료로서 의미를 가집니다.
