description_portal: 설문조사 현황 데이터는 기관에서 실시한 각종 설문조사의 기본 정보를 체계적으로 관리하기 위한 공공데이터이다. 각 레코드는 하나의 설문 단위를 의미하며 제목, 시작일, 종료일, 문항갯수, 항목갯수, 등록일, 부서명 항목으로 구성된다. 제목은 설문 목적과 주제를 요약해 나타내고, 시작일과 종료일은 응답 수집 기간을 표시하여 진행 중 설문과 종료 설문을 구분하는 기준이 된다. 문항갯수는 설문에 포함된 질문 개수를, 항목갯수는 선택지나 응답 옵션의 총 개수를 나타내어 설문 복잡도와 응답 부담을 파악할 수 있다. 등록일은 설문이 시스템에 최초로 등록된 일자를 의미하며, 부서명은 설문을 주관한 조직을 명시하여 책임 부서와 업무 영역을 확인할 수 있도록 한다. 이 데이터는 설문 운영 현황 분석, 부서별 조사 빈도 파악, 중복·과다 조사 점검 등 행정 효율성 제고에 활용된다.
