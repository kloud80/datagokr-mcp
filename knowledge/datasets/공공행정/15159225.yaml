summary_user: 2023년 인구총조사(센서스) 기준으로 전국 시군구별 인구수를 만나이·성별로 나눠 담은 집계 파일이다. 분석가나 지자체 담당자가 "우리 시군구의 연령별·성별 인구 구조는 어떤가", "고령 인구 비중이 높은 시군구는 어디인가"를 확인하는 데 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 데이터나 SGIS 행정구역 경계와는 시도명·시군구명을 이름으로 맞춰 연결해야 한다.
description_portal: '[SGIS 오픈 플랫폼] SGIS서비스의 2023년 센서스데이터 인구 시군구 집계 정보를 담고 있습니다.시도명, 시군구명, 만나이, 성별, 인구수를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼'
