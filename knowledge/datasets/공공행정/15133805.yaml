summary_user: 2002년 12월 19일 실시한 제16대 대통령선거의 개표결과를 전국 시도·구시군·읍면동·투표구 단위로 담은 CSV 파일(약 9.8MB)로, 투표구별 후보자 득표수를 담는다. 분석가나 연구자가 "2002년 대선에서 특정 읍면동·투표구의 후보별 득표는 어떻게 갈렸나" 같은 지역별 득표 분포 질문에 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 시도명·구시군명·읍면동명 같은 이름 매핑으로만 이어 쓰며, 다른 회차 대선 개표결과와 지역명 기준으로 비교하는 식으로 연결한다.
description_portal: '2002년 12월 19일에 실시한 제16대 대통령선거에 대한 개표결과로 전국 시도, 구시군, 읍면동, 투표구별 개표정보입니다. 선거인수, 투표수, 후보자별 득표수, 무효투표수, 기권자수 등의 항목으로 구성되어 있습니다.※ 제16대 대통령선거 개표결과 데이터는 공공데이터 제공 기준에 따라 CSV 형식으로 제공됩니다.※ 통합 시트 형태의 엑셀 파일(.xlsx)은 중앙선거관리위원회 국가선거정보 개방포털시스템에서 확인하실 수 있습니다. ‣ 국가선거정보 개방포털시스템: http://data.nec.go.kr ‣ 통합 엑셀 파일 제공 경로: http://data.nec.go.kr/open-data/file.do?dataId=44'
