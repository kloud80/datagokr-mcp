description_portal: '한국남동발전의 연간 청렴교육 현황에 관한 사전정보공개 자료입니다. 2014년부터 진행된 청렴교육 현황을 xlsx 형식으로 다운로드할 수 있으며, 일시, 장소, 교육내용, 참석인원 등 상세 정보를 확인할 수 있습니다. 이를 통해 한국남동발전의 투명성 및 윤리경영 수준을 가늠하고, 조직의 청렴 문화 확산 노력을 평가하는 중요한 기초자료로 활용할 수 있습니다. 공표 내용: 청렴교육 시행내역, 참석인원, 기관장 및 임원 참석 여부담당 부서: 청렴감사부공표 주기: 매년 한국남동발전 사이트 → 정보공개 → 사전정보공표 → 감사윤리 분야에서도 확인할 수 있습니다.'
