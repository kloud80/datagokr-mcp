summary_user: 가맹사업 기준년도와 브랜드관리번호별로 가맹점사업자가 내는 예치가맹금의 구분명과 금액 범위값을 일련번호 단위로 담는 전국·비공간 API입니다. 가맹 창업 예정자가 "이 브랜드에 가입하면 예치해야 하는 가맹금이 어느 정도인가"를 확인하거나, 분석가가 브랜드 간 예치가맹금 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 브랜드관리번호(brandMnno)·가맹본부관리번호 같은 공정위 내부 관리번호로 같은 기관의 다른 가맹정보 서비스(브랜드·가맹본부 정보 등)와만 이어 쓴다.
limits: 사업자등록번호·법인등록번호 같은 전역 키가 실측 컬럼에 없어 다른 기관 데이터와 직접 결합할 수 없고, 이름·코드 매핑이나 공정위 관리번호로만 연결된다. 금액은 정확한 값이 아니라 범위값으로 제공되며, 조회에 기준년도와 브랜드관리번호가 필요하다.
