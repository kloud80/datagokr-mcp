description_portal: 서울특별시 양천구에서 설치·운영 중인 각종 위원회에 대한 전반적 현황을 체계적으로 정리한 자료로서, 각 위원회 명칭과 위원장, 설치근거, 구성원수, 주관부서 등을 종합적으로 제공하는 데이터이다. 본 자료는 주민 생활과 행정 결정 과정에 관여하는 각 위원회의 기능과 구조를 한눈에 파악하고, 이를 통해 이용자는 위원회별 기능과 책임, 정책 결정 과정에서의 참여 구조를 한눈에 이해할 수 있으며, 관련 제도 비교나 행정 운영 분석에 필요한 기초 자료로도 활용할 수 있다. 본 자료는 각 위원회가 지역 행정체계에서 담당하는 역할과 중요성을 체계적으로 인지하고,양천구의 행정 투명성 제고와 주민 참여 확대를 지원하기 위한 목적에서 작성되었다.
