summary_user: 전국 다단계판매사업자의 등록 현황을 사업자 한 곳씩 담으며, 법인명·대표자명·주소·전화번호·허가일자·인허가 등록연도를 시도·시군구 단위로 조회한다. 소비자가 가입이나 구매를 권유받은 다단계 업체가 실제로 등록된 사업자인지, 대표자와 소재지가 맞는지 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어서, 통신판매·후원방문판매 등 다른 특수판매 등록 데이터와는 법인명·주소 같은 이름 매칭으로만 이어 쓴다.
description_portal: 상호명, 지역별, 허가일자 등을 이용하여, 다단계판매사업자에 대한 인허가-등록연도, 법인명, 전화번호 등의 정보를 조회할 수 있는 서비스
