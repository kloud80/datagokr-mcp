description_portal: 서울시 본청 업무추진비 목록은 서울시 본청 각 부서가 집행한 업무추진비의 사용 내역을 투명하게 공개하기 위한 데이터입니다. 문서고유아이디와 제목, 부서명, 전체부서명, 작성자, 연락처, 등록일 등은 각 집행 내역의 기본 정보를 제공하여 언제, 어느 부서에서 작성했는지 확인할 수 있게 합니다. 해당년도와 해당월, 집행일시는 예산 집행 시기와 기간별 지출 현황 분석에 활용됩니다. 집행장소, 집행목적, 집행대상은 실제 사용이 어떤 회의, 행사, 대외협력 활동 등을 위해 이루어졌는지 구체적으로 보여주는 항목입니다. 결제방법과 집행금액, 비목 정보는 카드 결제 여부, 지출 규모, 예산 항목을 확인할 수 있게 해 예산 집행의 적정성 검토와 감사, 시민 대상 공개에 중요한 기반 자료로 활용됩니다. 또한 문서 URL을 통해 상세 원문에 접근할 수 있어 행정의 투명성과 책임성을 높이는 데 기여하는 데이터입니다.
