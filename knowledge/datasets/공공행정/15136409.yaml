summary_user: 경기공유서비스(공유누리)에 등록된 시설·장비 등 공유자원별 부가 특성을 담은 데이터로, 자원구분일련번호(resrce_div_sn)와 자원정보일련번호를 기준으로 한 행마다 정보 유형(분류, 크기 등)과 그 숫자형 또는 문자형 값을 기록한 키-값 형태이다. 경기도 공공시설·장비를 빌리려는 주민이나 분석가가 '이 자원의 규모와 분류가 다른 자원과 어떻게 다른가'를 비교·검색할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어 같은 일련번호를 쓰는 경기공유서비스 자원 기본정보와 이름·일련번호 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 공유자원에 대한 추가 정보를 제공하기 위한 자료로, 각 자원을 식별하는 자원구분일련번호 및 자원정보일련번호를 기준으로 구성되어 있습니다. 데이터는 '데이터 구분 키' 항목을 통해 정보의 유형(category, size 등)을 분류하며, 각 유형에 따라 '숫자형 데이터 값' 또는 '문자형 데이터 값'에 해당 정보가 입력됩니다. 이 데이터는 시설이나 장비 등의 공공 공유자원에 대한 세부 특성을 부가적으로 설명하여 사용자 맞춤형 자원 검색, 자원 비교 및 선택 시 참고자료로 활용될 수 있으며, 자원 관리 체계의 정교화 및 통계 기반 자원 활용 분석에도 활용 가능합니다.
