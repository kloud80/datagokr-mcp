description_portal: 한국가스공사는 천연가스 거래를 위한 계량설비를 운영 중에 있음. 계량설비에 의해 측정되는 천연가스 공급량은 요금 산출에 직접적인 영향을 미치는 요인으로, 우리 공사는 투명하고 공정한 상거래를 위해 법적기준보다 강화된 사내기준에 의해 정기적인 교정을 실시하고 있음. 우리 공사는 한국인정기구(KOLAS)로부터 인정받은 유량측정센터를 운영하여 계량설비를 교정하고 있으며, 연간 100여대의 유량계와 2700여기의 계측기를 교정하고 있음. 유량측정센터는 국내 유일의 폐루프식 교정시설을 운영하여 다양한 유량 및 압력조건을 연중 내내 발생시킬 수 있어, 높은 교정 정확도와 효율성을 갖고 있음. 발전시 및 도시가스사에게 우리 공사 계량설비 교정 현황 공개를 통해 천연가스의 공정한 상거래 현황을 공유하고자 함.
