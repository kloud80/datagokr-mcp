summary_user: 농식품 공공데이터 포털에 개방된 시설장비 분야 데이터셋의 목록으로, 데이터셋 한 건마다 데이터셋명·설명·제공기관·담당자·키워드·등록일·이용허락범위·업데이트주기·제공형태(파일·오픈API·지도 등)를 담는 메타데이터이며 시설 자체의 건별 원장은 아니다. 농업·식품 시설장비 데이터를 찾는 분석가나 개발자가 '농기계·농업시설 관련 데이터는 어느 기관이 어떤 형태로, 어떤 이용조건으로 개방하는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 데이터셋명·기관명으로 대조하거나 링크URL·공공데이터포털URL을 따라 원 데이터셋으로 이어 간다.
description_portal: '농식품 공공데이터 포털에 개방한 시설장비 데이터 목록으로, 다양한 농업 및 식품 산업과 관련된 시설 및 장비에 대한 정보를 체계적으로 제공합니다. 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호 및 기타 유의사항과 같은 기본적인 정보 외에도 키워드, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함 유무, 상위분류, 제3자권리, 이용허락범위, 업데이트주기, 서비스 유형 등 다양한 데이터를 포함하고 있습니다. 이 데이터는 농림수산 식품 분야의 연구, 정책 개발 및 시설 관리 등에 활용될 수 있으며, 특히 농업 기반 시설의 효율적인 관리와 이용을 위해 필수적인 데이터로 인정받고 있습니다. 데이터는 다음과 같은 구조로 이루어져 있으며, 컬럼들의 특성은 다음과 같습니다. 데이터셋ID(문자형) : 각 데이터셋의 고유식별자, 데이터셋명(문자형) : 데이터셋의 제목, 기관명(문자형) : 데이터를 제공하는 기관의 명칭, 담당자명(문자형) : 데이터 관리자의 이름, 전화번호(숫자형) : 담당자의 연락처, 키워드(문자형) : 관련 검색어, 등록일(날짜형) : 데이터셋의 등록일, 상위분류(문자형) : 데이터의 카테고리 등을 포함하고 있습니다.'
