summary_user: 광주광역시 남구가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 목록으로, 상호·주소·대표품목·가격·연락처·데이터기준일자를 포함하며 활용신청 없이 받는 약 5.8KB 크기의 CSV 파일이다. 주민이나 방문객이 '남구에서 싼 값에 밥 먹을 수 있는 착한가격 식당이 어디고 대표 메뉴가 얼마인가'를 찾거나, 분석가가 지역 업소 가격 수준을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 이름 매칭해 LOCALDATA 인허가 등 업소 원장과 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: 광주광역시 남구의 착한가격업소 현황(상호명, 주소, 대표품목, 가격, 연락처 등)의 정보를 제공합니다. 매해 저렴한 가격으로 양질의 서비스를 제공하는 착한가격업소를 선정하였으며, 선정기준은 「착한가격업소 점검표」에 의한 점검 결과 70점 이상 및 가격기준 평점이 29점 이상입니다. 연락처가 공란인 착한가격업소들의 경우, 개인정보가 포함되어 있어 해당 데이터 미표기하였으며, 해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2711)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 착한가격업소는 합리적인 가격과 위생, 친절한 서비스, 원가 절감 노력 등을 통해 물가 안정에 기여하는 음식점이나 서비스업소를 지방자치단체에서 지정한 곳입니다. 주민과 방문객이 부담 없이 이용할 수 있도록 표준화된 가격과 질 높은 서비스를 제공하며, 지자체는 이 제도를 통해 지역 물가 관리와 외식 문화 개선을 동시에 추진합니다. 해당 데이터는 주민들이 합리적인 소비처를 쉽게 찾을 수 있도록 돕습니다. 민간에서는 소비자 안내 서비스, 외식업 홍보, 지역 상권 분석 자료 등으로 활용할 수 있으며, 학계와 연구기관에서는 물가 안정 정책 효과를 검증하는 자료로 사용할 수 있습니다. 이를 통해 지역 경제 안정과 건전한 소비문화 확산에 기여합니다.
