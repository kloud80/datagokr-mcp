summary_user: 후원방문판매업자의 등록·허가 변경내역을 사업자별 건 단위로 담은 원천 데이터로, 허가일자·인허가 시도·지역, 영업상태, 휴폐업 사유, 소재지, 자본규모 등을 포함하며 전국 919건(2013-06-25~2023-12-29)이다. 소비자나 창업·투자 검토자가 "이 후원방문판매업자가 정식 등록된 사업자인가, 영업 중인가"를 확인하는 질문에 쓴다. 법인등록번호(crno)와 사업자등록번호(brno)로 같은 공정위의 가맹·통신판매·상조 등 다른 등록 데이터와 이어 쓰고, 소재지주소·도로명주소(address)로 주소 기반 자료와도 연결한다.
description_portal: 이 API는 공정거래위원회에서 제공하는 공정거래위원회_후원방문판매사업자 등록변경현황 제공 서비스 입니다. 변경일자from ~ 변경일자to를 조회 조건으로 해당 날짜 범위의 후원방문판매사업자의 시도명, 지역명, 허가일자 등 변경내역을 제공한다.
