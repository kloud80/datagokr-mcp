summary_user: 경상북도 구미시의회 시의원 한 명당 한 행으로 성명, 소속 정당, 구역·선거구, 소속 위원회, 전화번호를 담은 명단 파일(csv, 약 2KB)이다. 구미시민이 "우리 동네 선거구 시의원은 누구이고 어느 위원회 소속이며 연락처는 무엇인가"를 확인하거나, 분석가가 정당별 의석과 위원회 구성을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 선거구명·정당명 같은 이름 매핑이나 같은 기관(구미시) 기준으로만 연결한다.
