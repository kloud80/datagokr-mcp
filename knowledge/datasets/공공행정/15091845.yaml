summary_user: 농식품공공데이터포털에 개방된 농업정책 데이터의 목록을 데이터셋·데이터 단위로 담은 메타데이터 목록으로, 데이터셋명·설명·제공기관·담당자·키워드·등록일·이용허락범위·업데이트주기·제공 형태(오픈API·파일·지도 등)를 담으며 범위는 전국·비공간이다. 연구자나 분석가가 '농업정책 분야에서 어떤 기관이 어떤 데이터를 어떤 형태와 갱신 주기로 개방하고 있는가'를 확인해 활용할 원천 데이터를 고를 때 쓴다. 실측 컬럼에 전역 조인 키는 없어 데이터셋명·기관명 같은 이름 매핑이나 링크URL·공공데이터포털URL을 따라 원본 데이터로 이어 쓴다.
description_portal: '농식품 공공데이터 포털에는 농업정책 데이터 목록이 풍부하게 제공되고 있습니다. 이 데이터셋은 농식품 부문과 관련하여 공식적으로 개방된 다양한 농업정책 데이터를 포함하고 있으며, 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자 권리 포함 유무, 상위 분류, 제3자 권리, 이용 허락 범위, 업데이트 주기 및 서비스 유형 등의 정보로 구성되어 있습니다. 이 또한 관련 기관의 통계 및 농업 분야의 정책적 결정 근거로 활용이 가능하며, 연구 및 논문 작성 시 데이터 활용이 유용합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형) : 고유 식별번호, 데이터셋명(문자형) : 데이터셋의 제목, 기관명(문자형) : 데이터를 제공하는 기관명, 담당자명(문자형) : 데이터 관련 담당자 이름, 전화번호(숫자형) : 담당자 전화번호, 키워드(문자형) : 관련 키워드, 등록일(날짜형) : 데이터 등록일, 데이터설명(문자형) : 데이터의 내용 및 설명, 업데이트주기(문자형) : 데이터 갱신 주기 등으로 세분화되어 있습니다.'
