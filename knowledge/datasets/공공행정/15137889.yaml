description_portal: 본 데이터는 광주시의회 홈페이지에서 제공하는 의회 관련 전문 용어를 체계적으로 정리한 정보자료입니다. 각 용어에 부여된 고유 번호를 기반으로 초성, 표기 용어, 상세 설명을 함께 제공하여 의정활동에서 사용되는 개념을 명확하게 이해할 수 있도록 구성하였습니다. 이를 통해 이용자는 의회 운영, 회의 절차, 행정 용어 등 다양한 용어의 의미를 쉽게 파악할 수 있으며, 의정자료 활용 과정에서 발생하는 용어 해석의 어려움을 해소할 수 있습니다. 또한 표준화된 용어 정보를 제공함으로써 시민의 의회 접근성과 정보 활용도를 높이는 기반자료로 활용됩니다.
