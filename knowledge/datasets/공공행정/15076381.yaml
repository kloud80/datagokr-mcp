description_portal: 해당 데이터는 이천시시설관리공단의 공공시설에 대한 할인율 정보입니다. 할인율이 적용되는 대상은 공영주차장, 체육시설, 숙박(농업테마공원), 캠핑장(복하천 수변공원), 장사시설(추모의집, 자연장지)이며 국가유공자, 독립유공자, 장애인, 기초생활수급자 및 기타 법령, 조례 등 에서 정하는 감면대상자에 한하여 이용요금의 할인율을 적용합니다.할인율은  감면대상 정보에 해당하는 것에 따라 비율이 다르며, 전액감면부터 시간별 면제 대상, 50%, 30% 등으로 나뉩니다. 특히, 감면대상의 종류가 가장 다양한 것은 공영주차장이며, 감면대상자임을 확인할 수 있는 증빙서류를 제출해야 적용받을 수 있습니다.
