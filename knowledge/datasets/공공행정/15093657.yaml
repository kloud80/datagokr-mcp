description_portal: 본 데이터는 강원특별자치도 속초시 교통행정 분야의 신용카드납부 시스템과 관련된 카드사 코드 정보를 제공하는 자료이다. 시민과 관계기관이 교통행정 관련 납부 시스템에 적용되는 카드사 정보를 쉽고 편리하게 확인할 수 있도록 카드사명, 카드사 코드 등 관련 정보를 정리하여 개방한다. 공공요금 납부 서비스의 효율성과 행정정보 활용성 향상을 목적으로 구축된 자료이며, 신용카드 기반 납부 시스템 운영과 행정업무 처리 시 참고자료로 활용할 수 있다. 또한 교통행정 분야 전자납부 서비스 운영 현황을 파악하고 공공서비스 접근성을 높이고자 한다. 데이터는 속초시 교통행정 신용카드납부 시스템 운영 현황을 기준으로 관리하며 관련 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 카드사 코드 정보와 납부 시스템 운영 현황을 확인할 수 있다.
