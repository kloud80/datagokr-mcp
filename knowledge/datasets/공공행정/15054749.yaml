summary_user: 온비드에서 거래된 한국자산관리공사 공매(매각) 입찰·낙찰을 연도별·광역시도별(권역 합계 포함)로 집계한 통계로, 감정가·최저입찰가·낙찰가(백만원), 낙찰가율, 입찰 참가자수, 경쟁률을 담는다(포털 설명상 2013~2025년). 공매 투자자나 분석가가 "어느 지역의 공매 낙찰가율과 경쟁률이 최근 몇 년간 어떻게 변했나"를 볼 때 쓴다. 전역 조인 키가 없어 지역명(광역시도 이름)을 행정구역 코드와 이름 매핑하거나 연도 기준으로 다른 지역 통계와 맞춰 붙여 쓴다.
limits: 건별 물건·입찰 내역이 아닌 연도·광역 단위 집계라 개별 공매 물건이나 시군구 단위 분석에는 쓸 수 없다. 공통 코드 없이 지역명 문자열로만 연결되므로 다른 데이터와 붙일 때 명칭 매핑이 필요하다.
