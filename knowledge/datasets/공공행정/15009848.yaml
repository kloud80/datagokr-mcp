description_portal: '* 부산광역시 남구 65세 이상 독거노인 세대 현황 (2025년 6월 30일 기준)본 자료는 2025년 6월 30일 기준으로, 부산광역시 남구에 거주하는 65세 이상 독거노인 세대의 주민등록상 거주 현황을 다양한 기준에 따라 작성한 자료입니다.1. 독거노인 세대의 정의여기서 말하는 "독거노인 세대"는 다음의 두 가지 조건을 모두 충족하는 경우를 말합니다.연령 기준: 만 65세 이상세대 기준: 주민등록상 단독세대 (1인 세대, 즉 가족과 동거하지 않는 경우)2. 행정동별 세대 현황남구는 총 17개의 행정동으로 구성되어 있으며, 각 동별로 거주 중인 독거노인 세대 수에 대한 통계를 확인할 수 있습니다. 3. 소득 수준에 따른 세대 구분독거노인 세대는 소득 수준에 따라 아래와 같이 세 가지로 분류됩니다.1) 국민기초생활수급자: 정부의 생계급여, 의료급여, 주거급여, 교육급여 등을 지원받는 저소득층2) 차상위계층: 수급자는 아니지만 중위소득의 50% 이하 등 일정 기준에 따라 복지 사각지대에 놓인 계층3) 일반 세대: 상기 기준에 해당하지 않는 일반적인 소득 수준의 독거노인4. 연령 및 성별에 따른 세대 구분1) 65세~79세2) 80세 이상'
