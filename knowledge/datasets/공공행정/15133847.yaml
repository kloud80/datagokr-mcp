summary_user: 경기도의회 의정포털에서 업무 담당 실국·부서·담당자가 바뀌거나 업무가 재배정된 내역을 건별로 담고, 재지정 단계(charge_step)·내용·등록자 부서코드·등록일자를 포함한다. 의정 업무 분석가가 특정 기간에 담당 재지정이 얼마나 자주, 어느 단계(실국·부서·담당자)에서 일어났는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 등록자 부서코드처럼 경기도 내부 코드나 이름 매핑으로만 연결한다.
description_portal: 경기도의정포털_담당재지정정보는 경기도 의회와 관련 행정기관에서 업무 수행 과정 중 발생하는 담당 부서 및 담당자 변경, 업무 재배정 내역을 기록한 데이터입니다. 주요 항목으로는 번호, 파트시퀀스번호, 담당 재지정정보 단계(실국·부서·담당자 구분), 담당 재지정정보 내용, 담당 재지정정보 등록자시퀀스번호, 담당 재지정정보 등록자부서코드, 담당 재지정정보 등록일자가 포함되어 있습니다. 이를 통해 특정 행정업무의 담당 부서 및 담당자가 언제, 어떤 사유로 변경되었는지 확인할 수 있으며, 데이터 분석을 통해 담당자 변경 사유와 빈도를 확인함으로써 행정 효율성을 높일 수 있습니다.
