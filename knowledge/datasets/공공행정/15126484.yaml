description_portal: '이 데이터는 경상북도 봉화군 관내에서 봉화사랑상품권을 사용할 수 있는 가맹점들의 정보를 수록한 자료입니다. 가맹점별로 상호명, 행정구역, 소재지 주소, 상품권 사용 가능 형태 등을 포함하고 있으며, 각 항목은 표 형식으로 정리되어 있습니다. 데이터는 총 8개 컬럼으로 구성되어 있으며, 본 데이터의 기준일은 2026년 1월 12일입니다.- 번호: 데이터에 수록된 가맹점의 일련번호로, 각 행을 구분하기 위해 부여된 고유 번호입니다.  - 시도명: 가맹점이 속한 시·도의 명칭입니다. 이 데이터는 모두 ‘경상북도’로 표시됩니다.  - 시군명: 가맹점이 위치한 시·군의 명칭으로, ‘봉화군’으로 표기됩니다.  - 행정구역: 읍·면·동 단위의 세부 행정구역명을 나타냅니다.  - 업소명: 봉화사랑상품권 가맹점의 상호명입니다. 음식점, 소매점 등 다양한 업종이 포함됩니다.  - 주소: 가맹점의 도로명 주소로, 위치를 정확히 나타냅니다.  - 구분: 상품권 사용 가능 형태를 표시하며, ‘지류’, ‘카드’, ‘지류,카드’ 등으로 구분됩니다.  - 데이터기준일: 데이터가 집계된 기준일로, 2026년 1월 12일로 명시되어 있습니다.'
