summary_user: 국회 본회의에서 처리된 법률안을 의안 한 건 단위로 담으며, 대수·의안번호·법률안명·제안자·소관위원회와 처리결과, 표결 수(총투표·찬성·반대·기권), 제안일부터 위원회·법사위·본회의 처리, 정부이송·공포일까지의 날짜를 포함한다. 시민이나 입법 분석가가 "특정 법률안이 본회의에서 찬성 몇 표로 가결됐고 공포까지 얼마나 걸렸나" 같은 질문을 확인하는 데 쓴다. 실측상 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 국회 다른 의안 데이터와는 의안ID(BILL_ID)·의안번호 같은 같은 기관 코드나 법률안명으로 맞춰 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
