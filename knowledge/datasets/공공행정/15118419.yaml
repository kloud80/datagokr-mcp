description_portal: LNG 탱크로리 수요처에서는 요금산정에 사용되는 계측기(계근대, 가스분석기)의 신뢰성 및 정확성 확인을 위해 교정현황 등을 수시로 한국가스공사에 요청하고 있음, 따라서 한국가스공사 통영기지본부 출하장의 탱크로리용 계근대 교정현황(2년주기) 및 가스분석기 상호비교시험(1년주기) 결과를 공공데이터로 개방하여 한국가스공사와 LNG 탱크로리 수요처 간 계측기 관리 자료 공유를 통한 상호 신뢰성 확보, 또한 공정한 상거래를 하고자 함에 따라 해당 데이터를 공공데이터로 개방함본 데이터는 LNG 운송업체, 계량기기 관리기관, 품질관리 담당자, 검교정 기관, 한국표준과학연구원이 출하량 정확성 검증 및 장비 관리에 활용할 수 있으며, LNG 거래의 공정성 확보와 계량기기 신뢰성 향상에 기여할 것으로 기대됨.
