description_portal: 전북특별자치도 내에서 추진된 '지적재조사 사업'의 대상 지구별 현황을 정리한 데이터입니다. 이 자료는 실제 토지 이용 현황과 일치하지 않는 지적공부(토지대장 등)의 등록사항을 바로잡기 위해 실시된 사업의 내역을 담고 있습니다. 각 사업 지구의 명칭과 위치, 그리고 사업에 포함된 총 필지 수와 면적, 투입된 사업비 정보를 제공합니다. 이 데이터는 토지 소유자들의 재산권 분쟁을 예방하고, 전북특별자치도 국토의 효율적인 관리와 개발을 위한 정확한 토지 정보를 구축하는 과정을 보여주는 중요한 행정 기록입니다.
