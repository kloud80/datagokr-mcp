description_portal: '국민권익위원회가 2008년부터 2025년까지 접수한 고충민원의 처리결과를 시정권고, 의견표명, 조정합의, 안내기각, 각하, 이송, 종결로 분류하여 제공하는 통계자료입니다. 이를 통해 처리결과 추이를 파악할 수 있으며, 행정 서비스의 개선 방향을 설정하는 데 활용됩니다. 특정 처리결과가 지속적으로 증가하고 있다면  시사점을 확인하고  이를 통해 보다 효과적인 민원 대응 전략을 수립할 수 있습니다.시정권고: 행정기관에 위법·부당한 처분을 개선하라고 권고함.의견표명: 민원에 대해 참고할 만한 의견을 제시함.조정합의: 민원인과 기관 간 갈등을 중재해 합의에 이르게 함.안내기각: 고충민원 대상이 아니어서 안내 후 처리하지 않음.각하: 요건 미비 등으로 심사 없이 민원을 종료함.이송: 권익위 관할이 아닌 민원을 해당 기관으로 넘김.종결: 민원 처리 절차가 완료되어 더 이상 진행하지 않음.'
