description_portal: 행정안전부 국가기록원은 공공기록물 관리 전문성 강화를 위해 매년 기록관리 집합교육을 운영하고 있으며, 이에 대한 세부 정보를 데이터로 제공합니다. 본 데이터는 2023년도 교육과정 운영 정보를 담고 있으며, 과정별로 교육년도, 과정명, 교육대상, 교육목표, 교육내용, 교육횟수, 교육기간, 집합교육시간, 온라인교육시간, 모집정원, 교육방법, 교육장소 등의 항목으로 구성되어 있습니다. 해당 데이터는 기록물 관리 담당자의 역량 강화를 목적으로 활용될 수 있으며, 공공기관 기록관리 체계 개선, 교육 과정 개발, 정책 수립 등에 필요한 기초자료로 쓰일 수 있습니다.데이터 기준일은 2024년 11월 7일이며, 일부 누락된 항목은 공백 처리되어 있습니다. 데이터는 텍스트(csv) 파일로 제공되며, 연간 단위로 갱신됩니다. 제공되는 정보는 「공공기록물 관리에 관한 법률」 및 「기록관리 교육훈련 운영규정」에 근거하여 수집되었습니다.
