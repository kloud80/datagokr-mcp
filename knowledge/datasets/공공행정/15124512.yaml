summary_user: 경기도의 월별 고용 현황을 기준연월(crtr_ym) 단위 집계로 담으며, 경기도와 전국의 15세 이상 인구·경제활동인구·비경제활동인구, 경기도 취업자·실업자·고용률·실업률, 산업별 취업자와 자영업자·상용·임시·일용근로자 등 종사자 지위별 취업자를 천 명 단위로 제공한다. 지역 고용 분석가나 정책 담당자가 '경기도 실업률과 임시·일용근로자 수가 최근 몇 달간 어떻게 변했고 전국과 비교해 어떤가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월을 맞추거나 이름 매핑으로만 이어 쓴다.
description_portal: '이 데이터는 경기도의 월별 고용 현황을 산업별 및 종사자 지위별로 구분하여 제공하며, 단위는 천 명입니다. 주요 항목으로는 경기도 전체 및 성별 경제활동인구, 취업자 수, 실업자 수, 고용률, 실업률, 산업별 고용자 수(예: 농림어업, 광업·제조업, 서비스업 등)와 자영업자, 상용근로자, 임시근로자, 일용근로자 등 종사자 지위별 고용자 수가 포함되어 있습니다. * 임시근로자: 근로계약 기간이 1개월 이상 1년 미만인 근로자* 일용근로자: 근로계약 기간이 1일 단위 또는 1개월 미만인 근로자* 실업자: 지난 4주간 구직활동자 중 일자리 제공시 즉시 취업가능자'
