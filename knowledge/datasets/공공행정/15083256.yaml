description_portal: '한국소비자원이 운영하는 가격정보 포털의 데이터를 기반으로 구성된 자료로, 주요 생필품의 상품명, 조사일, 판매가격, 판매업소, 제조사 등 기본 정보뿐 아니라 세일 여부 등 할인 정보도 포함하고 있습니다. 본 자료는 생필품의 가격 변동 추이 및 유통 채널별 가격 차이를 비교·분석하는 데 활용할 수 있으며, 소비자의 합리적인 구매 결정과 생활물가 모니터링에 유용한 기초자료로 제공됩니다. *한국소비자원 가격정보 포털: 한국소비자원이 전국 주요 유통업체의 생필품 가격을 조사하여 소비자에게 제공하는 서비스로, 생활 밀접 품목의 가격정보를 정기적으로 제공합니다.(www.price.go.kr)'
