description_portal: 전자정부서비스 이용실태조사는 국민의 전자정부서비스 이용 현황을 파악하기 위해 매년 시행되는 국가승인 통계조사입니다. 만 16세부터 74세까지의 국민을 대상으로 태블릿PC를 활용한 면접조사를 실시하며, 인지도, 이용률, 만족도, 이용 수단(모바일, PC 등) 등을 조사합니다. 본 데이터는 전자정부서비스 이용실태조사에 대한 코드 북 및 설문응답데이터로 구성되어 있습니다. 설문항목은 전자정부서비스에 대한 인지도, 전자정부서비스 이용 경험, 전자정부서비스 이용 수단, 전자정부서비스별 이용 만족도 및 개선의견 등으로 구성되어 있고, 응답자의 인구통계학적 특성으로 정보 접근성, 디지털 역량수준, 개인정보보호 인식 수준도 측정합니다. 조사 결과는 전자정부 정책 수립, 서비스 개선, 디지털 격차 해소 등 다양한 행정 서비스 혁신의 기초자료로 사용될 수 있습니다.
