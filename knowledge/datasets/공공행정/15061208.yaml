summary_user: 지방공사·공단 등 지방공기업이 클린아이(지방공공기관 경영정보공개시스템)에 공시한 정관과 인사·보수·복무 등 각종 내규를 연도·지자체·기관별 공시 건 단위로 담는 전국 범위 데이터다. 국민이나 분석가가 특정 지방공사·공단의 정관이나 보수·복무 규정이 어떻게 정해져 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 지방공기업 경영공시 데이터와는 지자체명·기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이다. 정관 및 내규 자료에는 연도, 지자체명, 기관명, 작성자명, 제목, 내용 등 지표가 포함된다. 첨부파일(정관 및 인사, 보수, 복무 등 각종 내규 게재（비공개사항은 공시 제외)) 함께 게시된다. * 대상 : 지방공사, 공단지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.'
