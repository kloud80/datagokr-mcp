description_portal: '국토교통부 대표홈페이지를 통해 운영하는 국민소통창구로써 국토/도시, 주택/토지, 건설, 교통/물류, 항공, 도로/철도, 기타 분야별 국민들이 의견을 자유롭게 개진※ 대표 사례분야: 주택/토지제목: 다자녀가족 일시적2주택내용: 안녕하세요 3년전 20평 신혼집에서 10년을 살다가 셋째아이를 임신하였습니다. 서울에서는 5인가족이 살수있는 30평대는 너무 비싸 인천쪽으로 분양을 받아 이사를 하였습니다. 일시적2주택으로 올해 10월 안에 매도를 하면 비과세 적용이 되는 상황이였습니다. 현재 서울20평 아파트 세입자 분께서 토허제를 악용하여 500만원의 합의금을 제안하였는데도 나가지 않겠다는 답변을 받았습니다. 저희 입장으로서는 세입자가 있는 상황에서는 매도가 불가능 하기때문에 참 힘든상황입니다. 요즘 토허제로 인해 2천만원이상 세입자가 합의금으로 요구하는 사례도 많다고 합니다. 5.9정책에 왜 1주택자 일시적2주택자는 제외 된다는 것도 너무 억울합니다. 매매하겠다는 사람이 있고 매도하고싶은 사람이 있는데, 세입자가 있다는 조건으로 이모든것이 이루어 지지않고 세금폭탄을 맞아야 하는 시민들의 입장도 생각해 주셨으면 합니다.자세한 내용은 https://www.molit.go.kr/USR/BORD0201/m_17/BRD.jsp 에 접속하여 확인할 수 있습니다.'
