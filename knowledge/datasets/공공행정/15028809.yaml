description_portal: 1. 강원특별자치도 정선군 소재지의 행정사사무소 현황 데이터를 제공합니다.2. 행정사의 정의, 행정사라는 것은 타인의 선임에 의하여 보수를 받고 행정기관에 제출하는 서류나 권리 및 의무사항, 사실증명에 관한 서류의 작성 및 제출을 업으로 하는 자를 말합니다.3. 행정사 관련법규정으로는 행정사법이 있습니다.4. 소관 업무에 따라 일반행정사와 외국어행정사 및 해사행정사로 나뉜다.(행정사법 제4조 근거)5. 해당 데이터(강원특별자치도 정선군_행정사무소 현황)는 업체명, 대표자명, 사무소 전화번호,소재지 도로명주소 및 지번주소,좌표(경도, 위도) 등의 내용을 포함한다6. 현재 강원특별자치도 정선군 소재의 행정사무소는 2개이며 해당 관련 업무는 정선군청 총무행정관 행정팀에서 담당하고 있다
