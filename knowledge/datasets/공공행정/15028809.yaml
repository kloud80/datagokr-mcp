summary_user: 강원특별자치도 정선군에 있는 행정사사무소를 사무소 한 곳씩 담은 건별 목록으로, 업체명·대표자명·종류·연락처·도로명/지번 주소·경도·위도를 포함하며 파일 크기는 470바이트 수준의 소규모 자료입니다. 정선군 주민이나 사업자가 '인허가·민원 서류 작성을 맡길 행정사사무소가 군내 어디에 있고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키는 없어 시도명·시군구명이나 주소 문자열, 좌표(경도·위도)를 기준으로 다른 시군의 행정사 현황이나 생활 행정시설 자료와 이어 붙인다.
limits: 표준 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭이나 좌표로만 연결된다. 범위가 정선군 한 곳의 개별 사무소에 한정되므로 도 단위나 전국 행정사 분포를 보려면 다른 시군 자료를 따로 모아야 한다.
