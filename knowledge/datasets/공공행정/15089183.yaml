description_portal: 울산시설공단은 시민의 안전을 최우선 가치로 삼고, 자연재해로부터의 피해를 최소화하기 위해 공단이 관리하는 건축물의 내진성능 확보 현황을 체계적으로 조사·관리하고 있으며, 이와 관련된 상세 데이터를 제공합니다. 해당 데이터는 각 건축물의 실질적인 운영 및 유지 관리를 담당하는 부서, 건축물의 성격을 분류한 시설 종류, 건축물의 고유한 명칭인 시설명, 해당 시설의 보다 구체적인 위치나 용도를 설명하는 시설명 상세, 건축물의 구조적 특성을 보여주는 층수(지상), 건축물 전체의 규모를 수치로 나타낸 연면적(㎡), 해당 건축물이 사용되는 용도, 건축물의 허가 일자와 실제 사용이 가능해진 준공 일자, 그리고 가장 중요한 내진설계가 적용되었는지를 나타내는 내진 유무 항목으로 구성되어 있습니다.
