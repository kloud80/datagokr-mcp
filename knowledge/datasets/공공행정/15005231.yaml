summary_user: 경기도 내 시군에서 등록·발간되는 신문, 인터넷신문, 잡지, 특수주간신문 등 정기간행물을 간행물 한 건 단위로 담으며, 등록번호·제목·종류·발간 구분·발행 법인·보급지역·보급대상·인쇄소·등록일자 등을 포함한다. 지역 언론 분석가나 사업자가 '경기도 특정 시군에 등록된 인터넷신문은 어떤 것이 있고 누가 발행하나'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓸 전역 조인 키를 찾지 못해, 다른 데이터와는 법인단체명(COPRTN_GRP_NM)이나 보급지역명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 「경기도 정기간행물 현황」 데이터는 경기도 내 각 시군에서 발간되는 신문, 인터넷신문, 잡지, 특수주간신문 등 정기간행물의 등록 및 발간 현황을 제공하는 자료입니다. 주요 항목은 등록번호(REG_NO), 간행물제목(PUBLCTN_TITLE), 간행물종류명(PUBLCTN_KIND_NM), 발간구분명(PBLCT_DIV_NM), 법인단체명(COPRTN_GRP_NM), 인쇄소명(PRNTNG_COMPNY_NM), 보급지역명(SUPPLY_REGION_NM), 보급대상정보(SUPPLY_TARGET_INFO), 구분명(DIV_NM), 홈페이지주소(HMPG_ADDR), 등록신청등록일자(REGIST_DE), 등록신청제출일자(PRESENTN_DE) 등입니다. 이 데이터는 정기간행물의 발행 주체, 보급 범위, 독자 대상 등을 파악할 수 있도록 구성되어 있으며, 지역 언론 현황 분석, 출판·언론 정책 수립, 문화산업 연구, 정보 유통 구조 파악 등에 활용될 수 있습니다. 또한 간행물의 발행 형태와 사업자 구분을 함께 제공하여 언론 매체 다양성 및 공공성 평가에도 유용합니다.
