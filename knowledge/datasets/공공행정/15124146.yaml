description_portal: '전라남도 함평군은 계약 행정의 투명성과 효율성을 높이기 위해 계약정보 공개시스템 선금급데이터를 공공데이터로 제공하고 있습니다. 선금급 데이터에는 군에서 발주한 사업의 선금 지급 및 정산 현황을 확인할 수 있도록 번호, 계약명, 선금차수, 선금정산차수, 선금정산순번, 정산일자, 정산금액, 정산내용 등의 컬럼 데이터를 제공하고 있습니다. 선금급 데이터는 발주사업의 재정 흐름을 명확히 파악할 수 있게 해주며, 예산 집행의 투명성 확보, 지역업체 참여 확대, 사업 추진의 신뢰성 강화에 활용될 수 있는 데이터입니다.제공사이트 : https://gyeyak.hampyeong.go.kr/'
