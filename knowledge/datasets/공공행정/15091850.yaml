summary_user: 농식품공공데이터포털에 개방된 말산업 데이터의 목록(메타데이터)을 데이터셋·데이터 단위로 담으며, 데이터셋명·설명·기관·담당자·키워드·이용허락범위·업데이트주기·제공 형태(그리드·오픈API·파일·지도 등)와 링크를 포함한다. 연구자나 정책 담당자가 '말 산업 관련해 어떤 공공데이터가 어떤 형태로 열려 있고 누구에게 문의하나'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 데이터명·기관명 매핑이나 링크URL·공공데이터포털URL을 따라가는 방식으로만 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방한 말 산업 데이터 목록으로, 해당 데이터는 말 산업의 다양한 측면을 다루고 있으며 연구, 정책 개발, 산업 분석 등 여러 분야에 활용될 수 있습니다. 본 데이터셋은 총 14개의 주요 항목으로 구성되어 있으며, 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함유무, 상위분류, 제3자권리, 이용허락범위, 업데이트주기, 서비스 유형 등의 정보를 포함하고 있습니다. 이러한 항목들은 말 산업의 전반적인 이해도를 높이기 위해 매우 중요하며, 각 데이터 항목은 다양한 분석과 연구를 지원하는 데 유용합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형): 데이터셋의 고유 식별번호, 데이터셋명(문자형): 데이터셋의 이름, 데이터셋설명(문자형): 데이터셋의 상세 설명, 기관명(문자형): 데이터를 제공하는 기관의 이름, 담당자명(문자형): 해당 데이터를 관리하는 담당자의 이름, 전화번호(문자형): 담당자의 연락처 정보 등이 포함되어 있습니다. 이와 같은 데이터는 연구자, 정책 입안자 및 관련 분야 전문가에게 매우 유용한 정보를 제공할 것입니다.'
