description_portal: 주식회사한국중소벤처기업유통원은 시장 경쟁 속에서 판로개척에 어려움을 겪고 있는 우수한 중소벤처기업 및 소상공인 제품의 역량 강화부터 인프라 지원, 시장 진출까지의 전주기적 판로지원을 통해 중소벤처기업 및 소상공인의 경쟁력 향상과 경영안정에 기여하는 공공기관입니다.전 직원은 대표 판로지원기관의 사명감을 다 하기 위해 기관 대표홈페이지에 사업실명제를 안내하고 있습니다.우리기관의 지원관리하는 사업은 동반성장몰, TV홈쇼핑 방송판매 대행, 백화점 운영, 직접생산확인제도, 공공구매제도, 소상공인 기반구축, 소모성자재납품 중소기업 지원 등 총 17개의 사업을 운영중에 있습니다.본 데이터는 사업실명제키, 제목, 관리부서, 클라이언트파일명, 파일확장자, 파일사이즈, 사업실명제게시일자 순서의 항목 등 총 7종 제공하는 파일데이터입니다.본 파일데이터를 활용하기 위해서 엑셀 등 전용 소프트웨어를 사용해주시기 바랍니다.
