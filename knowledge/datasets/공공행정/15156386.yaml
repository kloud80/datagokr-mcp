description_portal: '평택시 시민의 의견 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 시민이 생활 속에서 느끼는 불편사항, 개선 요구, 정책 제안 등 다양한 의견을 수렴하여 행정서비스 품질을 향상시키고 시민 중심의 정책을 수립하기 위해 체계적으로 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 지역사회 현안을 공유할 수 있고, 민간기업·연구기관은 민원 유형 분석, 정책 만족도 연구, 도시 문제 해결을 위한 서비스 기획 등에 활용할 수 있습니다. 본 데이터에는 게시글 제목, 주요  질문 등이 포함되어 있어 지역사회 현안을 엿볼 수 있습니다. 이러한 자료는 시민참여 확대, 소통 기반 행정 구현 등 활용할 수 있는  데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
