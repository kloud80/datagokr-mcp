summary_user: 가맹 브랜드별로 점포 환경 개선(리뉴얼 등) 때 가맹본부가 부담하는 비용 항목·부담 비율·지급 방식·제외 사유를 기준년도 단위로 담는 정보공개서 기반 건별 데이터로, 범위는 전국입니다. 가맹점 창업 예정자나 가맹점주가 "이 브랜드는 매장 리뉴얼 때 본부가 비용을 얼마나, 어떤 항목까지 분담하나"를 확인하는 데 쓴다. 브랜드관리번호와 가맹본부관리번호로 같은 공정위 가맹정보 계열(브랜드 개요·가맹본부 정보 등)과 이어 쓰며, 실측상 전역 조인 키는 없어 다른 기관 데이터와는 이름 매핑이나 사업자등록번호를 거친 간접 연결만 가능하다.
limits: 실측 컬럼에서 사업자등록번호 같은 전역 조인 키가 확인되지 않아 타 기관 데이터와 직접 결합하기 어렵다. 조회는 기준년도와 브랜드관리번호를 입력으로 받으므로 브랜드관리번호를 먼저 다른 가맹정보 서비스에서 확보해야 하고, 개발계정은 일 10,000회 호출 제한이 있다.
