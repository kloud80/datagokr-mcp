description_portal: '인천관광공사의 채용 관련 현황정보를 제공합니다.대상 기간은 2015년부터 2020년도까지이며, 기간 내 직급별 모집구분(정규직, 계약직, 파견근로자), 채용대상 직급, 공고인원, 접수인원, 경쟁률 등을 확인할 수 있습니다.보다 상세한 내용은 아래와 같습니다.채용직군 : 전시, 전산, 전시 및 컨벤션, 관광, 안전건축, 일반행정, 기록물관리, 정보통신, 일반행정, 온라인마케팅 등공고인원 : 채용공고 상의 모집인원 수접수인원 : 채용별 실제 지원접수한 지원자 수경쟁률 : 접수인원(실제 접수한 지원자 수) / 공고인원(채용공고 상의 모집인원 수) * 100%'
