summary_user: 서울시 내 썰매장업 사업장별 인허가 원장으로, 인허가·취소·폐업·휴업 일자와 영업상태, 주소·좌표, 공·사립 구분, 보험가입 여부, 지도자 수, 건축물 연면적 등을 사업장 한 건 단위로 담는다. 분석가나 행정 담당자가 '서울에서 현재 영업 중인 썰매장은 어디에 있고 보험에 가입돼 있는가' 같은 겨울철 여가시설 분포·안전관리 점검 질문에 쓴다. 전역 조인 키는 없어 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE, 관리번호)로만 잇고, 같은 원천을 공유하는 LOCALDATA 인허가 자료와 함께 상권·점포 이력 분석에 쓴다.
description_portal: 서울시 썰매장업 인허가 정보는 썰매장을 운영하는 시설의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자, 영업상태 및 상세영업상태를 통해 각 썰매장의 행정 이력과 현재 영업 여부를 확인할 수 있습니다. 사업장명, 법인명, 전화번호, 지번·도로명 주소, 우편번호, 좌표, 소재지면적 등의 항목으로 위치와 기본 정보를 파악할 수 있습니다. 또한 문화체육업종명, 세부업종명, 공·사립 구분, 보험가입여부, 지도자수, 건축물 동수와 연면적, 회원모집총인원 등의 정보를 통해 시설의 운영 형태, 안전관리 수준, 인력 및 시설 규모를 세부적으로 분석할 수 있습니다. 이 데이터는 겨울철 여가·체육시설 분포 분석, 안전관리·보험가입 실태 점검, 공공·민간 스포츠·여가 정책 수립, 가족·청소년 대상 여가시설 정보 제공, 민간 지도·관광·레저 플랫폼과 연계한 썰매장 안내 등 다양한 행정·연구·서비스 분야에서 활용 가능한 자료입니다.
