description_portal: 본 데이터는 2013년 기준 경기도 용인시 산업 중분류별 사업체 수와 종사자 수를 종사자 규모 및 읍·면·동 단위로 집계한 현황을 제공한다. 주요 항목은 산업중분류, 사업체 수, 종사자 수, 읍·면·동, 종사자 규모 구분 등으로 구성되어 있으며, 소규모·중규모·대규모 사업체의 지역별 분포와 고용 현황을 구체적으로 확인할 수 있다. 이를 통해 용인시 산업별 고용 구조, 지역별 산업 특성, 사업체 규모에 따른 경제 활동 현황을 종합적으로 파악할 수 있다. 자료는 지역 경제 분석, 창업 및 투자 전략 수립, 고용 정책 마련, 산업 구조 변화 연구, 생활 SOC 기초자료, 지역 맞춤형 경제 활성화 방안 수립 등 다양한 목적으로 활용된다. 단일 연도 기준으로 제공되는 통계 자료로 주기적 갱신은 이루어지지 않으나, 해당 시기의 산업·고용 구조를 이해하는 기초 데이터로서 유용하다. 공공데이터 개방을 통해 지역 경제의 투명성과 신뢰성을 높이고, 정책적·연구적 활용도를 강화하는 것을 목표로 한다.
