description_portal: '충청남도 당진시 주민자치센터 설치 및 운영 현황 안내(데이터 기준일자: 2025년 6월 24일)충청남도 당진시는 주민의 자치역량 강화와 지역 공동체 활성화를 위하여 각 읍·면·동 행정복지센터 내에 주민자치센터를 설치·운영하고 있습니다.본 자료는 당진시 관내 주민자치센터의 설치 및 운영 현황을 정리한 것으로, 다음 항목들을 포함하고 있습니다:구분: 행정구역(읍·면·동) 또는 센터 명칭소재지: 주민자치센터가 위치한 주소전화번호: 대표 연락처우편번호: 소재지 기준 우편번호본 자료는 지역 주민자치 프로그램 운영 관리, 시설 이용 안내, 대시민 행정서비스 제공, 지역자치 기반 정보 구축 등 다양한 목적으로 활용될 수 있습니다.'
