summary_user: 부산광역시 사상구 관내 쓰레기 종량제봉투 판매업소를 한 곳당 한 행으로 담은 파일(csv, 약 24KB)로, 연번·관리번호·상호·도로명주소를 담는다. 사상구 주민이 '우리 동네에서 종량제봉투를 어디서 살 수 있나'를 확인하거나, 분석가가 구 안의 판매소 분포를 살펴볼 때 쓴다. 다른 데이터와 바로 묶을 전역 조인 키는 없어서, 도로명주소를 주소 매칭하거나 상호 이름으로 맞춰 이어 쓴다.
description_portal: 부산광역시 사상구 관내 종량제 봉투 판매정보(연번, 관리번호, 상호, 도로명 주소 등)에 관한 데이터를 제공합니다.부산광역시 사상구 관내 쓰레기 종량제 봉투 판매정보에 대한 데이터를 제공합니다.이 자료에는 각 판매업소의 연번, 관리번호, 상호명, 도로명주 등이 포함되어 있어, 주민들이 가까운 판매소를 쉽게 찾고 필요한 정보를 빠르게 확인할 수 있습니다. 판매되는 종량제봉투의 종류는 5리터부터 75리터까지 다양하며, 10리터 및 20리터 재사용 봉투도 제공됩니다. 특히 20리터 불연성 마대도 함께 판매되어 분리 배출이 필요한 경우에 유용하게 활용됩니다. 판매업소는 주로 마트, 편의점, 슈퍼마켓 등에서 운영되지만, 일부는 다른 업종에서도 취급하므로 사전 확인이 필요합니다. 이 데이터는 올바른 쓰레기 배출 문화 정착과 지역 환경 보호에 기여하는 실질적인 정보 자원입니다.
