description_portal: '2025년 3월 기준 부산광역시 2023년, 2024년, 2025년 연도별, 시군구별 전세사기 피해자 결정현황 자료입니다. 여기서 전세사기란 집주인이나 중개인이 고의로 임대차 계약금을 가로채거나, 담보 대출·이중계약 등으로 임차인의 전세보증금을 돌려주지 못하게 만드는 범죄로 발생건수는 해당 범죄가 신고되거나 수사·확정 판결 등을 통해 공식적으로 집계된 건의 수를 말합니다. 위의 데이터는 지역 부동산 시장의 안전성과 신뢰 수준을 간접적으로 보여주며 정부나 지자체가 전세사기 예방 정책(예: 임대차 등록 의무 강화, 보증보험 의무화)을 설계할 때 참고 지표가 될 수 있습니다.'
