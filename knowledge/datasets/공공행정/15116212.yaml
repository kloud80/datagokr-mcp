description_portal: '2022년 3월 9일 실시한 제20대 대통령선거의 투표율을 성별, 연령대별, 지역별로 비교·분석함으로써 각종 선거의 투표율 제고 등 선거관련 제반 연구의 기초적인 자료로 활용하기 위함.※ 조사방법▶ 모집단: 전국 14,464개 투표구 / 선거인 44,168,510명 (증거보전신청 대상은 모집단에서 제외)▶ 표본수 : 투표구 1,508개 / 선거인 4,527,836명 (전체 선거인의 10.3%) / 선거일 투표 3,493,332명(사전투표, 거소·선상투표, 재외투표 제외)               ▶ 표본추출방법: 체계적 무작위 추출법▶ 조사대장 표본은 4단계에 거쳐 선정1. 구·시·군선거관리위원회별 투표구를 실제 투표율의 내림차순으로 정렬2. 구·시·군선거관리위원회마다 전체 투표구 수의 10%를 조사대상으로 산출3. 전체 투표구를 조사대상 투표구 수로 나누어 체계적인 무작위 추출을 위한 등간격 산출4. 산출된 등간격 수의 1/2에 해당하는 수를 산출하여 조사대상 최초 투표구로 선정하고 매 등간격 마다의 투표구를 조사대상 투표구로 선정※ 투표구수가 30개 미만인 경우 표본선정 방법(조사대상 투표구수 : 3개)1. 전체 투표구를 실제 투표율의 내림차순으로 정렬2. 표본추출 등간격 산출3. 조사대상 첫 번째 및 이후 2개의 조사대상 투표구 선정'
