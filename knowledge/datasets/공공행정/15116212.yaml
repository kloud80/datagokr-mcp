summary_user: 2022년 3월 9일 제20대 대통령선거의 투표율을 시·도별 전체·사전투표율과 성별·연령대별로 나눠 정리한 집계표 파일로, 전국 14,464개 투표구 중 1,508개 투표구(선거인 4,527,836명, 전체의 10.3%)를 체계적 무작위 추출한 표본조사 결과를 담는다. 선거 연구자나 정책 분석가가 '20대 대선에서 어느 연령대·성별·지역의 투표율이 높거나 낮았는가' 같은 질문에 답하고 투표율 제고 방안을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선거의 투표율 분석 자료나 인구 통계와는 시·도 이름이나 연령대 구분을 맞춰 연결해야 한다.
limits: 표본조사 결과이며 성별·연령대별 분석의 표본은 선거일 투표자 기준으로 사전투표·거소·선상·재외투표는 제외되고, 증거보전신청 대상 투표구는 모집단에서 빠졌다. 선거 때 한 번 만들어진 뒤 바뀌지 않는 자료라 이후 선거와 비교하려면 다른 회차 자료를 따로 받아야 한다. 파일 첫 행이 제목으로 들어가 열 이름이 비어 있으므로 파싱할 때 머리글을 직접 지정해야 한다.
