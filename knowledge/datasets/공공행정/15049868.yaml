summary_user: 수입물가지수를 품목(동태코드)별·조사년월별로 담은 전국 단위 집계 통계 파일로, 물가지수와 가중치를 함께 싣고 있으며 설비투자지수 산출과 관련된 자료다(csv 약 366KB, 활용신청 없이 내려받음). 분석가가 '특정 수입 품목의 가격이 월별로 어떻게 움직였고 전체 지수에서 비중은 얼마인가'를 확인하거나 설비투자 동향을 해석할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 조사년월을 기준으로 맞추거나 동태코드를 같은 기관(국가데이터처)의 품목 코드와 이름으로 매핑해 이어 쓴다.
description_portal: 설비투자지수* 관련 데이터로 수입물가지수(품목)[조사년월,동태코드, 물가지수, 가중치]에 대한 정보를 제공합니다*관련참고:- 설비투자지수는 경제통계에서 기업의 설비투자 동향을 보여주는 지표입니다. 국내 기업이 기계·장비, 건물, 운송장비 등 설비에 투자한 금액을 기준으로 산출한 지수로  설비투자의 증감과 경기 동향을 파악하기 위함이며, 통상 기준연도를 100으로 설정하여 지수화합니다.  즉, 기업이 생산설비에 투자한 금액을 기준연도 대비 지수화한 통계로 기계·장비, 운송장비, 건물·구조물 등 설비투자 항목 포함되어 있습니다.
