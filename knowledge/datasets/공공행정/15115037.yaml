summary_user: 서울 강남구의 안경업소를 업소 1곳당 1행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업·휴업일자, 도로명·지번 주소, 사업장명, 좌표, 검안·렌즈 가공 장비 수와 면적을 담는다. 창업 예정자나 상권 분석가가 '강남구에서 영업 중인 안경점은 몇 곳이고 최근 몇 년 사이 어디서 문을 열고 닫았나'를 확인할 때 쓴다. 전역 조인 키는 없어서 같은 원천인 LOCALDATA 인허가 자료와는 관리번호·개방서비스 코드로, 다른 데이터와는 주소나 좌표 매핑으로 잇는다.
description_portal: 서울시 강남구 안경업 인허가 정보(https://data.seoul.go.kr/dataList/OA-16404/S/1/datasetView.do)강남구의 눈을 보호하거나 시력의 교정을 요하는 대상에게 시력의 교정 및 안경을 판매 또는 수리하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다.데이터 활용시 참고하시기 바랍니다.
