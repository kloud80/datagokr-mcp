summary_user: SGIS 도시화분석지도의 도시화지역별 주택 데이터로, 전국을 시군구 단위로 나눠 도시화지역명·시도·시군구·주택종류별 거처수를 담은 집계 파일(CSV)이다. 분석가나 지자체 담당자가 'UN 도시분류 기준의 도시·준도시 지역에서 아파트·단독주택 등 주택 유형별 거처가 어느 시군구에 얼마나 분포하는가'를 볼 때 쓴다. 전역 조인 키(행정구역 코드 등)가 없어 시도명·시군구명 이름을 매핑하는 방식으로만 다른 SGIS 통계나 행정구역 경계와 연결한다.
description_portal: '[SGIS 오픈 플랫폼] "도시화분석지도" 서비스의 도시화지역별 주택 데이터입니다.도시화지역명,시도명,시군구명,주택종류명,거처수 를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System] 국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 도시화분석지도   ‘UN 도시분류’ 기준을 적용한 인구변화에 따른 도시화 권역의 변화 모습과 격자 통계정보 및 분석 지표를 제공하는 서비스.  - UN의 도시분류 기준의 공식화: 유럽연합, 유엔 인간거주계획, 세계은행 등 6개 국제기구가 도시 기준을 표준화하기 위해 만든 도시 개념을 "20년 UN 통계위원회에서 공식 채택'
