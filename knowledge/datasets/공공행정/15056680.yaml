summary_user: 전국 지방공기업의 신입사원 임금을 연도·기관별로 집계해 기본급, 급여성복리후생비, 수당, 시간외근무수당, 합계와 신입사원 수로 담는다. 취업준비생이 특정 지방공기업의 신입 초봉 수준을 비교하거나, 분석가가 기관 간 신입 처우 격차를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 경영공시 자료와는 기관명(ENT_NAME)과 연도로 이름 매칭해 이어 붙여야 한다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이며, 신입사원 평균임금 자료에는 연도, 기관명, 신입사원 기본급, 신입사원 급여성복리후생비, 신입사원 수당, 신입사원 시간외근무수당, 합계, 신입사원 직원수 지표가 포함됩니다.지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 매년 정기적으로 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
