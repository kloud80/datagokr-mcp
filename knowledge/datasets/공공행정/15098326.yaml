summary_user: 세종특별자치시 안의 공중위생업소(이용·미용·세탁·숙박업 등)를 업소 한 곳씩 담은 건별 목록으로, 업종 구분·업소명·도로명/지번 주소·전화번호와 위치정보를 제공한다. 주민이나 사업자가 '우리 동네 근처에 어떤 미용실·세탁소가 있고 연락처는 무엇인가'를 찾거나, 분석가가 세종시 내 업종별 위생업소 분포를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 주소나 업소명을 맞춰 보거나 같은 기관 코드로만 연결한다.
limits: 범위가 세종특별자치시 한 곳이라 다른 시도와 비교하려면 별도 데이터가 필요하다. 표준 코드나 고유 식별자로 다른 데이터와 바로 조인할 수 없으므로 주소·명칭 매칭에 따른 오차를 고려해야 한다. 호출에는 serviceKey가 필요하며, 개발계정은 하루 5,000회로 제한된다.
