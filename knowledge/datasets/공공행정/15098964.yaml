description_portal: 서울특별시 마포구의 통·반장 현황입니다.행정동별 통장 정원, 통장 현원, 통장 결원, 반장 정원, 반장 현원, 반장 결원을 제공합니다.이 데이터는 서울특별시 마포구 내 각 행정동의 통·반장 현황을 상세히 나타낸 자료입니다.각 행정동별 통장 정원, 현원 및 결원과 반장 정원, 현원 및 결원에 대한 데이터를 포함하고 있습니다.또한 각 정원별, 현원별, 결원별 총계도 확인하실 수 있습니다.이 데이터를 통해 주민들은 자신의 거주지 담당 통반장을 확인하고, 생활 민원·행정 안내·지역 행사 소식 전달 등과 관련된 주민자치 활동에 더욱 쉽게 접근할 수 있으며, 행정기관은 통반 조직의 현황을 관리 및 개선하는 데 활용할 수 있습니다.
