description_portal: 협동화자금 지원기업의 업종, 지역, 지원연도 자료입니다.협동화사업은 중소기업이 규합하여 공동으로 집단화, 공동화, 협업화 사업의 공동추진을 지원함으로써 투자비용·원가절감 등 기업경쟁력 강화를 목적으로 합니다.지원대상은 공동시설, 원부자재 공동구매 등을 추진하는 아래 중소기업이며, 규합(협의)체의 추진배경, 협동화 실천계획의 추진목적 등에 따라 ①집단화, ②공동화, ③협업화로 구분하여 지원합니다.① 3개 이상의 중소기업이 규합(협동조합 등)하여 협동화실천계획의 승인을 얻은 자② 2개 이상의 중소기업이 규합하여 협업사업계획의 승인을 얻은 자
