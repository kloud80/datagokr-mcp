description_portal: '본 데이터는 경남개발공사에서 보유한 자산의 이력 및 회계처리 정보를 포함하는 자료로, 자산별로 자산번호, 자산명, 취득일자, 수량, 취득금액, 관리부서 등 자산의 기본 속성과 더불어 감가상각이 발생한 시점별 자산가액, 누계상각액, 미상각잔액, 상각금액, 상각년월 등의 재무회계 정보를 함께 제공합니다. 해당 데이터는 고정자산(예: 사옥 등)의 장기 회계처리 내역을 시계열로 확인할 수 있도록 구성되어 있으며, 공공기관의 자산 운용 현황, 회계 건전성 분석, 공시용 재무정보 검증 등에 활용될 수 있습니다. 또한 자산의 감가상각 누적 추이를 통해 재무 구조의 변화나 잔존가치 기반의 자산관리 전략 수립에도 도움이 되며, 기관 내부 회계 투명성 제고와 공공자산 가치 평가 근거 자료로도 쓰일 수 있습니다.'
