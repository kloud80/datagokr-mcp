summary_user: 국회에 제출된 의안(예산·결산안 제외)을 의안 한 건 단위로 담으며, 대수(ERACO), 의안번호·이름, 제안자 구분, 제안일, 소관위원회와 회부·상정·처리일, 위원회 처리결과, 상세 링크를 포함한다. 국민이나 입법 분석가가 특정 법률안이 어느 위원회에 회부돼 언제 상정·처리됐고 결과가 어떻게 났는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 같은 국회 의안 데이터와는 의안ID(BILL_ID)·의안번호를 이용한 같은 기관 코드 매칭이나 위원회명 같은 이름 매칭으로만 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
