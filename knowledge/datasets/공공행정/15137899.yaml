description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 전자 회의록 본문 내용 정보를 제공합니다. 시의회 본회의와 위원회에서 진행된 회의의 발언과 논의 내용을 텍스트로 기록한 자료를 담고 있습니다. 고유번호는 각 발언 기록을 식별하기 위한 순번을 나타내며, 회의록 고유번호와 안건 고유번호는 상위 회의록 및 안건과의 연결 관계를 나타냅니다. 발언 의원명은 해당 발언을 한 의원이나 관계자의 이름을 표시하고, 회의록 본문 내용은 실제 발언 내용을 기록합니다. 본문 내용 정렬순서는 회의 진행 순서에 따른 발언 순서를 나타냅니다. 본 데이터는 의정 활동 기록 보존, 회의 내용 검색, 의안 심의 과정 확인, 의정 투명성 강화 등에 활용됩니다.
