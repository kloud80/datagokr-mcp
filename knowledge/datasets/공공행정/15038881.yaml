summary_user: 지방세 세수추계 방법을 설명하는 교육교재 파일(hwpx, 약 720KB)로, 세수추이와 경기변동 등을 반영한 추계산식으로 다음 연도 세목별 지방세 수입을 예측하는 연 단위 작업 절차를 담으며, 건별 원천 데이터나 집계 수치표가 아닌 문서 자료다. 지방자치단체 세정·예산 담당자나 재정 분석가가 "당해연도 예상징수액과 경제성장률·부동산 동향 같은 추계변수를 써서 내년 지방세 수입을 어떻게 추정하나"를 익히는 데 쓴다. 실측 내용에서 전역 조인 키를 찾지 못해 다른 데이터와 직접 결합할 수 없으며, 지방재정365 공시의 세입 실적 자료 등과는 세목 이름을 맞춰 참고용으로만 이어 쓴다.
limits: 교육용 문서이므로 지자체별·세목별 실제 세수 실적이나 추계 결과 수치를 기계적으로 뽑아 쓰는 용도에는 맞지 않는다. 전국 단위·비공간 자료로 지역 코드나 조인 키가 없어 다른 데이터와는 이름 매핑으로만 연결된다. 파일은 활용신청 없이 내려받지만 hwpx 형식이라 별도 파싱이 필요하다.
