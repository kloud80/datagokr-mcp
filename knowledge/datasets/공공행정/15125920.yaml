summary_user: 국회도서관이 공표한 행정정보 목록을 공표 파일 단위로 담으며, 항목별로 생산연월, 분류, 기관, 공표 파일 이름과 경로가 함께 붙는 것으로 보인다(필드명 기준 추정, 명세상 의미는 비어 있음). 국민이나 연구자가 '국회도서관이 어느 시기에 어떤 분류의 행정정보 파일을 공표했는가'를 확인하고 원문 파일을 찾을 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않았으므로, 같은 기관 코드(INST_CD)나 분류 이름을 맞춰 국회사무처의 다른 공표목록과 나란히 보는 정도로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
