summary_user: 경상남도 의령군이 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 파일(csv 약 2KB)로, 업소명·주메뉴 가격·도로명주소·전화번호·데이터기준일을 담는다. 의령에서 값싼 식당을 찾는 주민·여행자가 '근처 착한가격업소가 어디이고 주메뉴가 얼마인가'를 확인하거나, 분석가가 지역 외식 가격 수준을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명주소를 맞춰 붙이는 방식으로만 이으며, 지방행정 인허가(LOCALDATA) 업소 원장과 주소 기준으로 대조하는 쓰임이 있다.
description_portal: 본 데이터는 경상남도 의령군 착한가격업소를 제공합니다. 데이터는 연번, 업소명, 주메뉴가격, 도로명주소, 전화번호, 데이터기준일로 구성됩니다. 이를 통해 이용자는 업소 번호와 명칭, 주요 메뉴 가격, 위치, 연락처, 기준일을 확인할 수 있습니다. 이 정보는 소비자에게 합리적 가격의 업소를 안내하고, 방문 전 위치와 가격 비교를 돕습니다. 또한 주메뉴가격은 물가 동향과 가격 수준을 파악하는 자료로 활용됩니다. 행정기관은 착한가격업소 현황 관리, 물가안정 정책, 홍보 자료 제작 등에 사용할 수 있으며, 소비자는 경제적이고 품질 좋은 업소를 쉽게 찾을 수 있습니다. 본 데이터는 공공데이터포털에서 제공되며, 지역 물가 안정과 소비자 편익 증진에 기여합니다.
