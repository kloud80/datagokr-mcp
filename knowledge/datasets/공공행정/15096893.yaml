description_portal: '- 한국전력기술(주)에서 외부 법률 전문기관에 위촉한 법률고문 현황을 정리한 데이터입니다.- 해당 데이터는 법률고문의 ‘구분’, ‘고문명’, ‘위촉 시작일’, ‘위촉 종료일’, ‘위촉 목적’ 항목으로 구성되어 있으며, 각 고문에 대한 위촉 기간 및 자문 목적 정보를 파악할 수 있습니다.- 해당 데이터는 공공기관이 운영하는 법률 자문체계를 파악하고, 외부 법무법인의 자문 참여 현황을 분석하는 데 활용될 수 있습니다. 외부 법률자문의 의존도, 특정 법무법인에 대한 위촉 집중도, 자문 기간 등을 평가하는데 활용될 수 있으며, 향후 법률자문 정책 수립 및 외부 자문기관 선정 시 참고 자료로서 활용될 수 있습니다.- 해당 데이터의 업데이트 주기는 연간입니다.- 개방된 데이터는 2024년 기준 6건의 법률고문 위촉 이력을 포함하고 있습니다.'
