description_portal: 전북특별자치도가 정보 취약계층을 대상으로 추진한 '사랑의 PC 보내기' 사업의 연도별 보급 실적 데이터입니다. 이 자료는 장애인, 기초생활수급자, 소년소녀가장 등 개인 수혜자와 사회복지시설을 포함한 단체 수혜자에게 매년 몇 대의 중고 PC가 보급되었는지를 상세히 보여줍니다. 이 데이터는 디지털 시대에 정보 접근성이 낮은 계층을 지원하여 사회 통합을 촉진하려는 정책적 노력을 나타내는 중요한 지표입니다. 관련 기관에서는 이를 통해 정보 격차 해소 사업의 성과를 평가하고, 향후 지원 규모나 대상을 계획하는 데 기초 자료로 활용할 수 있습니다.
