description_portal: "본 데이터는 경상남도 남해군에서 청년들의 안정적인 지역 정착과 자립 기반 강화를 지원하기 위해 시행하는 다양한 '청년지원정책'의 상세 현황 정보를 제공합니다. 이는 지역 청년들의 삶의 질 향상, 균등한 성장 기회 보장, 그리고 미래 설계를 적극적으로 지원하여 지역사회 전체의 활력을 제고함을 목표로 합니다. 각 지원정책별로 혜택을 받을 수 있는 구체적인 '지원대상'(연령, 거주요건, 소득 기준 등 명시), 제공되는 서비스나 혜택의 상세한 '지원내용'(예: 창업자금 지원, 주거 안정 지원, 역량 강화 교육 프로그램 등), 그리고 정책 참여를 위한 '신청시작일'과 '신청종료일'을 포함한 신청 기간 등 핵심 정보를 담고 있습니다."
