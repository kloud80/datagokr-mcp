summary_user: 강남구에서 간판·현수막·전단지 등 광고물을 제작·표시·설치하거나 옥외광고를 대행하는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·휴폐업일자·주소·좌표 등을 포함한다. 사업자나 상권 분석가가 '강남구에서 현재 영업 중인 옥외광고업체는 어디이고 최근 몇 곳이 폐업했는가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 관리번호(MGTNO)와 기관 코드를 기준으로 같은 원천인 LOCALDATA 인허가 자료와 맞추거나 주소·좌표로 행정동·상권 단위에 붙여 쓴다.
