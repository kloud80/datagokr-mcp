summary_user: 충청남도 예산군이 보유한 공유재산(토지·건물 등)을 재산 건별로 담은 파일 데이터로, 소재지 주소, 대부 가능 여부, 공부상 지목과 실제 지목 코드, 면적과 실면적을 시군구 범위에서 개별 주소 단위로 제공한다. 예산군에서 민간이 빌려 쓸 수 있는 군유지가 어디에 얼마나 있는지 찾으려는 주민·사업자나, 공부상 지목과 실제 이용이 다른 재산을 점검하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(필지고유번호 등)가 없어 다른 데이터와는 소재지 주소를 매핑하거나 같은 기관 기준으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 충청남도 예산군이 보유한 공유재산(토지 및 건물 등 공공 자산)의 현황을 제공하는 공공데이터입니다.예산군 공유재산 현황(소재지, 대부가능여부, 토지지목, 실지목 코드, 면적 등)에 대한 정보를 알 수 있습니다.본 데이터에는 재산명, 재산의 종류(토지/건물), 용도 구분(행정/일반), 위치 주소, 면적, 재산가액, 관리부서, 사용 용도 등의 정보가 포함되며,예산군의 공공자산 현황 파악, 효율적 재산관리, 민간 활용 가능 부지 정보 제공, 지역자산 기반 정책 수립 등에 활용됩니다.공유재산 현황 제공을 통해 군 운영에 대한 투명성 제고합니다
