summary_user: 국회 입법예고 기간이 끝난 법률안을 의안 한 건 단위로 담으며, 대수·의안번호·법률안명·제안자 구분과 제안자·소관위원회·예고 종료일·상세 링크 등을 포함하는 전국 범위의 비공간 데이터입니다. 시민·이해관계자·입법 분석가가 특정 법률안의 입법예고가 언제 끝났고 어느 위원회 소관인지 확인하거나, 의견 제출 기간이 지난 법안을 추려 심사 진행을 추적하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 국회 의안 데이터와는 같은 기관 체계의 의안번호(BILL_NO)나 법률안명을 맞춰 연결한다.
