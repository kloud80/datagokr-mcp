summary_user: 지방자치단체별로 회계연도(fyr) 단위 신속(조기)집행 목표액·집행액과 집행률을 담은 집계 데이터로, 범위는 전국이며 공간 정보는 없다. 분석가나 주민이 "우리 시·도와 시·군·구는 올해 조기집행 목표 대비 실제로 얼마나 빨리 예산을 집행했나"를 비교할 때 쓴다. 전역 조인 키는 확인되지 않아 자치단체 코드(laf_cd)나 자치단체명으로 지방재정365의 다른 공시 데이터와 맞춰 잇는다.
description_portal: 신속(조기) 집행실적은 정부나 지방자치단체가 예산을 세운 시점보다 빠르게, 또는 예정된 기간 내에 예산을 집행한 실적을 나타내는 지표입니다. 이는 예산을 효율적으로 활용하고, 경제 활성화나 긴급한 재정 자원을 필요로 하는 상황에서 예산 집행을 신속히 완료하는 것을 목표로 합니다. 신속한 예산 집행은 경제적 불확실성을 줄이고, 시급한 공공 서비스나 사회적 요구를 신속하게 해결할 수 있도로 도와줍니다.신속(조기)집행실적은 재정 운용의 효율성을 평가하고, 경제적 위기 대응 능력을 강화하는 데 중요한 역할을 합니다,
