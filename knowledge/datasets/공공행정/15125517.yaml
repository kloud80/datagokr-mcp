summary_user: 가맹사업 기준년도별로 가맹 브랜드 하나당 한 행씩, 가맹본부 상호·대표자, 업종 분류, 가맹사업 개시일과 가맹금·교육비·보증금·인테리어비 등 창업 비용 범위(편차 5%), 가맹금 예치·보험·공제조합 가입 여부, 최초·연장 계약 기간을 담는 전국 단위 비교 목록이다. 창업 예정자가 같은 업종의 여러 브랜드를 놓고 초기 부담금과 계약 기간이 어느 쪽이 더 적고 유리한지 비교할 때 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)가 조인 키라서 다른 가맹본부 정보와 이어 쓰고, 통신판매·상조 등록이나 기업집단 공시 데이터와도 같은 사업자 기준으로 묶을 수 있다.
