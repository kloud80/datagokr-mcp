summary_user: 서울특별시 자치구에서 인허가를 받은 동물판매업 사업장을 업소 한 곳당 한 행으로 담은 원천 원장으로, 인허가일자·영업상태(정상·폐업 등)·폐업일자·주소·전화번호·좌표가 들어 있으며 포털 설명상 약 8,409건입니다. 반려동물 정책 담당자나 상권 분석가가 '우리 구에서 영업 중인 펫숍은 몇 곳이고 최근 몇 년 사이 폐업이 얼마나 늘었나'를 확인하고 지역별 분포를 지도로 그리는 데 쓴다. 전역 조인 키는 없어 기관코드(OGDP_INST_CD)와 관리번호로 같은 원천인 LOCALDATA 인허가 자료와 맞추거나, 주소·사업장명으로 다른 업종 인허가나 상권 자료와 이어 붙인다.
description_portal: '가정에서 반려의 목적으로 사육하는 동물을 구입하여 판매, 알선 또는 중개하는 서울특별시 소재 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.ㅇ 데이터 개요: 본 데이터는 서울특별시 각 자치구에서 인허가를 받은 동물판매업 관련 사업장 정보를 포함합니다. 인허가일자, 영업상태(정상·폐업·말소 등), 사업장 주소, 연락처, 좌표 정보, 축산업무구분 등 세부 항목이 기록되어 있습니다.ㅇ 제공 범위: 2018년 이전부터 2025년까지의 인허가·취소·폐업 내역을 포함하며, 총 8,409건의 사업체 데이터가 수록되어 있습니다.ㅇ 주요 활용 분야: 동물판매업 현황 분석, 영업 상태별 통계, 지역별 사업 분포 지도화, 불법·무허가 영업 단속, 반려동물 산업 정책 수립 등에 활용 가능합니다.ㅇ 데이터 형식: CSV 형식으로 제공되며, 한글(EUC-KR/CP949) 인코딩이 적용되어 있습니다. 위치 좌표는 X/Y 방식으로 제공되어 GIS 분석이 가능합니다.ㅇ 갱신 주기: 데이터는 주기적으로 갱신되며, 데이터갱신일자 항목을 통해 최신성을 확인할 수 있습니다.'
