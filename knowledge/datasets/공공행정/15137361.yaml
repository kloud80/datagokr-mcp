summary_user: 곡성군 공유재산관리시스템 DB의 도로구간 테이블을 도로구간(도로구간일련번호)마다 한 행씩 담은 건별 원천 파일로, 도로명·영문도로명·기점·종점·도로폭·도로길이·고시일자·부여 및 이동 사유와 일자, 공간데이터를 포함하며 범위는 곡성군 읍면동 단위다. 곡성군 안에서 특정 도로명이 어느 구간에 걸쳐 있고 폭과 길이가 얼마인지, 언제 부여되거나 바뀌었는지 확인하려는 공무원이나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 도로명·도로명코드나 읍면동 이름을 맞추는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 붙이려면 도로명·코드 매핑 작업이 필요하다. 범위가 곡성군 한 곳이라 다른 시군구와 비교하는 데는 쓰지 못한다.
