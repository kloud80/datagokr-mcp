description_portal: 서울특별시 강남구의 재건축 및 재개발에 따른 건축물 기부채납 현황입니다. 기타 자세한 사항은 강남구 건축과(02-3423-6078)로 주시면 자세히 안내해 드리도록 하겠습니다.각 기부채납 시설의 기본적인 위치 정보를 알 수 있는 주소와, 시설의 규모나 크기를 나타내는 연면적이 제곱미터(㎡) 단위로 구체적으로 명시되어 있습니다.또한, 해당 건축물들이 어떤 용도로 활용되고 있는지에 대한 분류도 제공하고 있습니다. 예를 들면, 전체적인 시설의 목적에 따라 공공업무시설, 체육시설, 문화시설 등과 같은 여러 분야의 시설용도가 안내되어 있으며, 보다 세부적으로 들어가면 각 시설이 실제로 사용되는 구체적인 목적이나 기능을 확인할 수 있도록 세부용도도 함께 제공됩니다.
