summary_user: 제14대부터 제22대까지 역대 국회의원선거마다 선거명·대별(회차)·선거일과 요일·공고일·선거기간 일수·임기 시작일과 종료일을 한 건씩 담은 전국 단위 선거 일정 목록입니다. 분석가나 기자가 '특정 대 국회의원의 임기는 언제 시작해 언제 끝났고, 공고에서 선거일까지 며칠이었나' 같은 선거 일정 질문에 답할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선거 데이터와는 선거명이나 대별 같은 이름·회차 매핑으로만 이어 쓴다.
limits: 후보자·득표·투표율 같은 결과 정보는 없고 선거 일정·임기 정보만 담으며, 지역 구분 없는 전국 단위 비공간 데이터다. 선거가 있을 때 생성된 뒤 바뀌지 않는 이벤트성 데이터라 수시 갱신을 기대하지 않는다.
