summary_user: 경기도 국민안전체험관 예약 과정에서 생성된 이수증·수료증 등 첨부파일의 관리 내역을 예약번호별로 담은 건별 운영 자료로, 첨부파일 순번, 파일 크기, 생성·수정 일시, 사용 여부를 기록한다. 체험관 운영 담당자나 분석가가 예약 건별로 교육 증빙 파일이 발급·관리되고 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 체험관의 다른 예약 자료와는 예약번호(rsve_no)로 이어 붙이는 방식만 생각할 수 있다.
description_portal: 이 데이터는 경기도국민안전체험관 예약과정에서 생성·관리되는 첨부파일 정보를 수록한 자료로, 이수증·수료증 등 교육 참여를 증빙하는 파일과 관련된 관리 내역을 포함하고 있습니다. 예약번호별로 첨부파일 ID, 파일 크기, 생성 및 수정 일시, 사용 여부 등이 기록되어 있으며, 이용자가 교육 참여 후 발급받은 증빙 자료를 체계적으로 관리하는 역할을 합니다. 이 데이터는 수료 확인, 행정지원, 예약 절차의 신뢰성 확보에 활용되며, 향후 교육 이력 관리와 안전교육 효과성 검증에도 기초 자료로 제공될 수 있습니다.
