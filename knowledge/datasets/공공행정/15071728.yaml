summary_user: 서울시 의원급 의료기관을 한 곳당 한 행으로 담은 건별 인허가 원천 데이터로, 인허가·취소·폐업·휴업 일자와 영업상태, 지번·도로명 주소와 좌표, 의료기관 종별, 진료과목, 의료인 수, 입원실·병상 수, 총면적을 포함한다. 분석가가 "우리 구에서 지금 영업 중인 내과 의원은 어디에 몰려 있고, 최근 몇 년간 폐업은 얼마나 늘었나" 같은 1차 의료 접근성과 개폐업 추이를 따질 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 코드(개방자치단체코드, 관리번호)로만 잇는다.
limits: data.seoul.go.kr 외부 사이트 인증키가 따로 필요하며, 공공데이터포털 활용신청과는 별개다. 공통 키가 없어 건강보험·병원평가 같은 다른 의료기관 데이터와 붙이려면 이름·주소 매핑이 필요하다. 여기서 '의원'은 지방의회 의원이 아니라 의료기관이며, 부문 분류도 보건의료 쪽으로 옮기자는 제안이 있다.
