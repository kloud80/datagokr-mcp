summary_user: 전라남도 시군별로 읍·면·동·법정동·법정리·행정리·반 수, 출장소 수, 면적, 세대수, 남녀 인구를 한 줄씩 모은 집계 현황 파일이다(CSV 약 1.7KB, 범위는 시도, 행정단위는 읍면동 수준). 지역 분석가나 행정 담당자가 '전남 각 시군에 읍면동과 행정리가 몇 개이고 면적 대비 인구·세대는 어느 정도인가'를 비교하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 시군 이름(구분)을 행정구역 코드에 매핑해야만 이어 쓸 수 있다.
description_portal: '- 전라남도 행정구역(읍면동)현황입니다. - 읍/면/동/통/리/반 수, 출장소 수, 면적, 세대 수, 남성/여성 인구 수 등 전라남도 내 시군별  현황을 참고할 수 있습니다.- 전라남도의 행정구역은 22개 시·군으로 구성되어 있으며, 그 아래에 읍·면·동 단위의 하위 행정구역이 있습니다. 전라남도는 대한민국 남서부에 위치하며, 농업, 어업, 관광자원이 풍부한 지역입니다.- 전라남도청은 무안군 삼향읍 남악로에 위치한 남악신도시에 있습니다.- 순천시는 전남에서 인구가 가장 많은 도시입니다.- 신안군은 대한민국에서 섬이 가장 많은 군으로, 1,000개 이상의 섬이 분포합니다.'
