summary_user: 전국 공공기관 등 기관의 위치정보를 시설 한 곳당 한 건으로 담으며, 시설 유형·시설 코드·기관명·지번/도로명 주소·전화번호·좌표가 들어 있다. 특정 지역에 어떤 공공기관이 어디에 있는지 찾거나, 재난·안전 분석에서 기관 위치를 지도에 올려야 하는 분석가가 쓴다. 실측에서 전역 조인 키는 확인되지 않아 다른 데이터와는 기관명·주소 매칭으로 잇고, 법정동 단위 시도·시군구·읍면동 코드 필드와 좌표로 지역 단위 집계나 공간 결합에 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 기관(공공기관 등) 위치정보입니다."
