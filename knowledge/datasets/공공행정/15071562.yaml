summary_user: 서울시에 인허가된 비디오물제작업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소·폐업일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표, 시설면적, 건물 층수·용도, 제작취급품목 등을 포함한다. 분석가나 창업 예정자가 '서울 어느 자치구에 영상 제작업체가 몰려 있고, 최근 폐업이 늘었는가'처럼 업소 분포와 영업 이력을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 주소·좌표나 같은 기관의 관리번호(MGTNO)·자치단체 코드로 다른 서울시 인허가 데이터와 맞추어 쓰고, 원천은 LOCALDATA 인허가 자료와 같다.
description_portal: 서울시 비디오물제작업 인허가 정보는 서울시에 인허가된 비디오물 제작업소의 행정 이력과 시설·환경 특성을 파악할 수 있는 공공데이터입니다. 인허가일자, 취소일자, 영업·휴업·폐업·재개업 등 영업상태 정보로 업체의 현재 영업 여부와 변경 이력을 확인할 수 있으며, 사업장명, 전화번호, 주소(지번·도로명), 우편번호, 좌표, 소재지·시설 면적 등으로 사업장의 위치와 기본 규모를 알 수 있습니다. 문화체육업종명, 문화사업자구분명, 제작취급품목내용, 제공게임물명, 기존게임업 외 업종명, 품목명, 지역구분명 등은 해당 업체의 업종 성격과 취급 콘텐츠 유형, 입지 특성을 보여 줍니다. 건물용도, 총층수와 지상·지하층수, 주변환경, 통로 너비, 조명·음향·특수조명·방음·편의·소방시설, 비상계단·비상구·자동환기 여부, 노래방실·청소년실 수, 비디오 재생기, 게임기 수 등의 정보는 이용환경과 안전·편의·방송·영상·게임 관련 시설 수준을 파악하고, 청소년 보호·소방·안전 기준 충족 여부 등을 점검·분석하는 데 활용할 수 있는 인허가 기반 데이터입니다.
