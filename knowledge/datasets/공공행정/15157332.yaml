description_portal: 본 데이터는 전주시 관내에 설치·운영 중인 전광판의 현황을 체계적으로 정리한 공공데이터이다. 전광판은 시민 안내, 재난·안전 정보 전달, 교통 및 시정 홍보 등 다양한 공공 목적을 위해 활용되고 있으며, 본 데이터는 이러한 전광판 시설의 관리 및 정보 제공을 목적으로 구축되었다.데이터에는 전광판의 기본적인 특성을 파악할 수 있도록 구분, 설치연도, 송출방식, 크기, 표출형식 등의 항목이 포함되어 있다. 구분 및 표출형식 항목은 전광판의 기능적 특성에 따라 멀티형과 문자형으로 구분된다. 멀티형 전광판은 영상, 이미지, 문자 등 다양한 형태의 콘텐츠를 복합적으로 표출할 수 있는 전광판을 의미하며, 문자형 전광판은 문자 정보 중심으로 내용을 표출하는 전광판을 의미한다.또한 전광판의 공간적 위치를 파악할 수 있도록 설치 위치에 대한 행정구역 또는 상세 주소 정보와 함께 위도 및 경도 좌표를 제공한다. 위도·경도 좌표는 WGS84 좌표계를 기준으로 제공되어 지도 서비스 연계, 위치 기반 분석 등 다양한 공간정보 활용이 가능하다.데이터기준일자는 해당 데이터의 작성 및 갱신 시점을 나타내는 기준일자로, 데이터의 최신성을 판단하는 데 활용된다. 본 데이터는 전주시 전광판 시설의 효율적인 관리뿐만 아니라, 시민 및 민간에서의 데이터 활용을 통해 공공서비스 개선, 도시 인프라 분석, 연구 및 정책 수립 등의 기초 자료로 활용될 수 있다.
