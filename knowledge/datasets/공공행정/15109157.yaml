summary_user: 1948년부터 현재까지 발행된 관보를 수록 내용 건별로 담은 목록으로, 제목(cntntSj)·편집구분·테마구분·발행기관·근거법령·발행일자와 원문 PDF 경로, 정정 여부·정정 사유를 함께 제공하며 범위는 전국·비공간이다. 특정 법령의 공포일이나 어느 기관이 어떤 고시·공고·인사발령을 관보에 실었는지를 확인하려는 국민·법무 실무자·정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 발행기관명이나 근거법령명 같은 이름 매핑으로만 연결한다.
limits: 표준 기관코드나 법령ID 같은 공통 키가 없어 법령·기관 데이터와 정확히 조인하기 어렵고, 이름 문자열 대조에 의존해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
