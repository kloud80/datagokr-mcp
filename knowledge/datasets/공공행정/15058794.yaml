summary_user: 지방자치단체별 주민 1인당 세출예산액을 회계연도 단위로 담은 전국 범위 집계 지표로, 일반회계 세출예산액(bfae_totl_amt)을 전년도 말 주민등록 인구수로 나눈 값과 그 산정에 쓴 예산액·인구수를 함께 제공한다. 분석가나 주민이 '우리 시·군·구의 주민 한 명당 예산 규모가 같은 광역 안 다른 자치단체나 전국 평균보다 큰가'를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 지방재정365 데이터와는 자치단체 코드·이름(laf_cd, laf_hg_nm)과 회계연도(fyr)를 맞춰 이어 쓴다.
description_portal: 지방자치단체의 주민1인당 세출예산액은 자치단체의 재정운영 규모를 주민 수 기준으로 환산한 지표로, 자치단체의 총 세출예산액을 전년도 12월31일 기준 자치단체에 등록된 주민등록 인구수로 나누어 산정합니다. 이 지표는 자치단체의 재정운영 효율성과 주민에 대한 재정서비스 수준을 평가하는데 활용됩니다.주민1인당 세출예산액 정보는 2001회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 주민1인당세출예산액, 일반회계세출예산액, 인구수 항목이 제공됩니다.
