description_portal: 서울시 폐쇄말소대장 등록 정보를 행 단위로 정리한 자료입니다. 각 행은 하나의 필지를 나타내며, 대지 위치, 시군구명, 법정동, 대지구분, 주·부지번, 호별명세 일련번호 등 기본 식별정보와 건물 용도, 구조, 동 수, 연면적, 총세대수 등의 건축 세부정보를 담고 있습니다. 또한 승인일, 착공일, 사용승인일 및 해당 날짜의 사전 공고일 정보가 포함되어 건축 진행 단계의 흐름을 파악할 수 있습니다. 이 데이터는 지역별 개발 현황 분석, 인허가 절차 추적, 도시계획과 주거정책 수립을 위한 기초 자료로 활용할 수 있습니다.
