summary_user: 한국자산관리공사가 금융기관·공공기관으로부터 매각을 위탁받아 온비드 공매에 부친 비업무용 부동산을 물건별로 담으며, 기준일자·공고회차·물건번호·위임기관명·물건주소·최저매매가격을 전국 범위의 개별 주소 단위로 제공한다. 공매 투자를 검토하는 개인·사업자가 특정 지역에 어떤 은행·공단이 내놓은 수탁 부동산이 얼마의 최저가로 나와 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 물건주소(CLTR_ADR)를 주소·지번 매칭하거나 위임기관명을 이름으로 맞춰 연결해야 한다.
description_portal: 한국자산관리공사 설립 등에 관한 법률(제2조1호, 26조 제1항제2호) 및 한국자산관리공사 설립 등에 관한 법률 시행령에 따라 한국자산관리공사는 한국자산관리공사법상 기재되어 있는 금융기관등(은행, 저축은행, 신용협동조합 등), 각종 공공기관(공단, 공사 등)으로부터 부동산 매각을 위탁받아 온비드에서 수탁재산 공매 매각 업무를 진행하고 있습니다.(포함정보) 현재 한국자산관리공사에서 수탁재산 공매를 진행하고 있는 금융기관, 공공기관의 목록(위임기관), 물건의 소재지(주소), 공매를 진행한 일시(공고월)이 포함되어 있습니다.
