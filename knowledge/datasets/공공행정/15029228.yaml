summary_user: 전라남도 나주시에서 업무신고 후 영업 중인 행정사 사무소를 한 곳씩 담은 목록 파일로, 사무소명·소재지주소·전화번호·데이터기준일자를 담는다(파일 크기 약 1.2KB 수준의 소규모 시군구 단위 자료). 인·허가 신청이나 행정심판 서류 작성을 맡길 민원인이 '나주에서 가까운 행정사 사무소가 어디이고 연락처는 무엇인가'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사무소명·주소 문자열 매칭이나 같은 기관(나주시) 자료끼리로만 연결한다.
description_portal: 나주시 행정사 정보는 행정업무의 원활한 운영과 국민의 편익 도모를 위해 행정사 업무신고 후 영업중인 관내 행정사 사무소에 대한 정보를 제공합니다.행정사는 각종 인·허가 신청, 행정 심판 청구, 서류 작성 대행 등 국민의 권리 구제를 지원하는 전문 자격사로, 국민과 행정기관 사이에서 원활한 소통을 돕습니다.현재 영업중인 전라남도 나주시 행정사사무소의 사무소 명칭, 주소, 전화번호 등의 정보를 제공하여 민원인이 가까운 행정사사무소를 찾는 데 활용할 수 있습니다.
