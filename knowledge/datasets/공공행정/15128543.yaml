description_portal: 서울시설공단은 연간 접수된 시민의 소리(VOC) 분석을 통해 시민 중심 서비스 품질 관리 및 서비스 개선에 활용하고 있습니다. 본 데이터는 서울시설공단에 접수된 VOC(Voice of Customer) 민원 건수에 대해 민원 등록 채널별, 연도별 데이터를 제공합니다. 온라인 홈페이지를 통해 등록된 건, 시민제안 채널을 통해 접수한 건, 대표전화를 통해 직원이 등록한 건, 서비스 제공 부서와 통화 후 직원이 등록한 건, 사무실 및 관리소 등 직접 방문하여 접수된 건, 외부 채널(서울시 응답소)을 통해 접수된 건수를 각 연도별로 제공합니다. 각 채널별 민원 증감 추이와 처리 현황을 분석하는 데 유용합니다.
