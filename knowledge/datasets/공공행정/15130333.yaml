description_portal: '[SGIS 오픈 플랫폼] "고령화 현황보기" 서비스의 지표별 년도별 메타데이터 정보입니다.상세항목 및 항목명 정보를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 고령화 현황보기  고령화가 점점 심화되는 상황에서 고령화와 관련된 다양한 통계를 제공하고, 이를 통해서 고령화 현황, 고령화추세, 복지시설 등을 파악할 수 있도록 하기 위한 서비스'
