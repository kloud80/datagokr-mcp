description_portal: 본 데이터는 지역 내 옥외광고물 관리업무를 수행하는 기관 및 담당 부서에 대한 고유 기관코드와 행정기관 정보를 체계적으로 정리한 자료입니다.옥외광고물 허가·신고·정비·행정지도 등의 업무를 수행하는 주체를 명확히 구분하기 위해 필요한 기관명, 기관코드, 소관 부서명, 업무구분 등의 항목을 포함하고 있으며, 각 광고물의 관리 책임 기관을 일관된 기준에 따라 식별할 수 있도록 설계되었습니다.옥외광고물 관리대장 작성, 허가서 발급, 현수막 및 간판 관리, 위반광고물 단속 시 기관별 역할 분담을 명확히 하기 위한 핵심 기초자료로 활용되며, 특히 여러 기관이 공동으로 관리하는 구역의 경우 관리 책임 소재를 분명히 하는 데 중요한 기준이 됩니다.이처럼 본 데이터는 옥외광고물 행정 서비스의 표준화 및 체계화를 지원하기 위한 기반 정보로 제작되었습니다.
