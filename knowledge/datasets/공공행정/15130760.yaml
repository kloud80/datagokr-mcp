summary_user: 경기도 도의원의 업무추진비 사용 내역을 건별로 담은 데이터로, 집계연도·분기별로 사용일자, 집행목적, 장소, 집행대상, 지출금액(원)이 기록된다. 시민단체·언론·분석가가 "특정 분기에 도의회 업무추진비가 어떤 목적으로 어디서 얼마나 쓰였나"를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 장소명·집행대상명 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 이 데이터는 경기도 도의원의 업무추진비 사용 내역을 기록한 자료로, 연도별·분기별 집계된 업무추진비 집행 현황을 제공합니다. 주요 항목으로는 집계년도, 집계분기, 사용구분명, 사용일자, 집행목적내용, 장소명, 집행대상명, 지출금액(원) 등이 포함되어 있으며, 각 건별 사용일자와 목적, 집행 장소, 상대방, 지출금액 등의 상세정보가 제공됩니다. 이 데이터는 지방의회 및 공공기관의 예산 집행의 투명성을 확보하고, 업무추진비 사용의 적정성 여부를 점검하기 위해 활용됩니다. 또한 예산운영 감사, 의정활동 모니터링, 재정건전성 평가, 공공재정 정보공개 등의 다양한 행정·정책적 목적으로 활용될 수 있습니다.
