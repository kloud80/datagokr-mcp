description_portal: 푸른등대 기부장학사업은 학자금 지원의 사각지대를 보완하여 균등한 교육 기회를 제공하고, 사회 각 분야의 인재를 육성하기 위한 기부금 재원 장학 사업입니다. 한국장학재단에서는 매년 사업 홍보를 위한 기부 뉴스레터를 제작·발행하고 있으며, 제작한 뉴스레터를 장학생, 기부처 등에 발송하고 있습니다. 해당 데이터는 뉴스레터의 발송 일자, 발송 횟수 등 발송 내역입니다.뉴스레터는 "한국장학재단 홈페이지(https://www.kosaf.go.kr) > 기부 > 푸른등대이야기 > 정기간행물 > 뉴스레터"에서 확인가능 합니다.
