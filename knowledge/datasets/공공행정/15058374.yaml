summary_user: 경기도 내 외국인전용 관광기념품판매점을 사업장 한 곳당 한 건으로 담으며, 운영 중인 곳과 폐업한 곳이 함께 들어 있고 인허가일자·영업상태·폐업일자·소재지 주소·위도경도를 포함한다. 외국인 관광객 대상 기념품 판매점이 경기도 어느 시군에 몰려 있고 최근 몇 곳이 문을 닫았는지 확인하려는 관광정책 담당자나 상권 분석가가 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 주소로 다른 경기도 시군 단위 자료와 맞추고, 좌표(WGS84 위경도)로 지도나 다른 시설 위치 자료와 겹쳐 본다.
description_portal: 이 데이터는 외국인을 대상으로 운영되는 관광기념품 판매점에 대한 경기도 내 사업장 현황을 담고 있습니다. 데이터는 각 사업장의 인허가일자, 영업상태, 주소, 사업자 구분, 위치정보(위도·경도)를 포함합니다. 자료는 운영중인 사업장과 폐업한 사업장을 함께 포함하고 있어, 관광산업의 지속성 및 변동성을 파악하는 데 도움이 됩니다. 이 데이터는 외국인 대상 관광자원 분포 분석, 문화상품 소비 동향 파악, 관광 인프라 정책 수립, 지역경제 기여도 평가, 외국인 전용 상권 개발 등의 분야에서 활용될 수 있습니다.
