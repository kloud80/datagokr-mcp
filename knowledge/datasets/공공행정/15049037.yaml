description_portal: 본 데이터는 사업별 공공용지 내 토지이외 자산에 대한 보상 현황을 사업정보 형태로 제공한다. ‘토지이외’란 공공사업 부지에 포함되지만 토지 자체가 아닌 건축물, 시설물, 식물, 농작물, 영업권 등 기타 재산을 의미한다.본 데이터에는 건축물, 공작물, 과수, 임목, 묘목, 농작물, 농기구, 축산 관련 보상, 분묘, 개간비, 영업보상, 광업권, 어업보상, 영농손실액, 이사비, 주거이전비(소유자·세입자), 이주정착금, 이주정착지원금, 생활안정지원금, 토지사용료, 이농·이어비, 휴직·실직 보상, 분묘이장보조비, 동산이전비, 기타 보상현황 등 다양한 보상항목이 포함된다.이 데이터는 각 사업에서 토지이외 자산에 대한 보상 건수와 금액을 체계적으로 확인할 수 있어, 보상 규모 분석, 예산 수립, 정책 검토 등 행정 및 연구 목적으로 활용할 수 있다.
