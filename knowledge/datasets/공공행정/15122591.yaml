summary_user: 인천광역시 영종구(구 중구) 소유 공유재산 가운데 행정 목적으로 쓰지 않는 토지 일반재산을 필지별로 나열한 목록 파일로, 소재지·지목(공부상·실제)·면적(공부상·실제)·공시지가를 담는다(CSV 약 1.6KB의 소규모 목록). 이 구의 땅을 빌리거나 사고 싶은 주민·사업자가 대부·매각 검토 대상 토지가 어디에 얼마만큼 있는지, 대부료 산정 기준이 되는 공시지가가 얼마인지 확인하는 데 쓴다. 필지고유번호(PNU)나 행정표준코드 같은 전역 조인 키는 없어서, 다른 데이터와는 소재지 주소 문자열이나 지목 코드 매핑으로만 이어 붙일 수 있다.
description_portal: '공유재산 및 물품관리법에 의거하여 인천광역시 중구 소유의 공유재산 중 토지(일반재산) 목록 데이터를 공개합니다.공유재산의 종류 중 일반재산은 공공기관이 행정 목적으로 사용하지 않고 있는 재산으로서, 신청자에게 대부 및 매각이 검토 가능한 재산입니다. (*행정업무 목적으로 사용하는 재산 : 행정재산)대부진행 시에는 공시지가에 사용목적 및 지목 등에 따라 대부료율을 적용하여 산정합니다.이 중 토지재산의 목록을 공개하며, 해당 재산 대부 등에 관한 기타 자세한 문의사항은 인천광역시 중구청 재무과 재산관리팀(032-760-7202)로 연락주시기 바랍니다.'
