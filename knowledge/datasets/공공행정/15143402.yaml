description_portal: 전북특별자치도 무주군청 내 각 부서에서 현재 사용하고 있는 팩스(전자팩스) 번호 목록을 년 단위로 분류하여 파일데이터로 제공하고 있습니다.해당 공공데이터는 2025년 5월 공공데이터 제공 신청으로 작성된 파일 공공데이터이며기관명(무주군), 부서명(각 실과원소), 팩스번호(전자팩스) 등으로 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다.평소에는 데이터 변동이 없지만 매년 1월, 7월 인사발령으로 인해 신규 부서 및 통폐합 부서가 발생 및 조직개편 발생 등의 경우에 많은 변동이 있을 수 있습니다.그러할 경우에는 업데이트 주기 외에 별도로 자료를 업데이트 할 예정입니다. 이용에 참고하여주시기 바랍니다.해당 데이터는 전북특별자치도 무주군 자치행정과 정보통신팀 관리하고 있으며 자세한 내용은 063-320-2141(자치행정과)로 연락주시면 됩니다.
