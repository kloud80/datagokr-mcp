summary_user: 경기도 지역 개별 품목(과일·채소·곡물·특용작물 등 생활필수품·농산물)의 소비자물가지수를 집계월·품목 단위로 담은 월별 집계 자료로, 통계청 소비자물가조사(2020=100 기준)를 바탕으로 최신 월 기준 12개월치를 제공한다. 가계나 분석가가 "최근 1년 사이 경기도에서 배추·사과 같은 특정 품목 물가가 언제 급등했나"처럼 계절별 변동이나 품목별 급등락을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 물가·지역 데이터와는 품목명(prodlst_nm)과 집계월(agrt_ym)을 이름 매핑해 맞춰 이어 써야 한다.
description_portal: 경기도 품목별 소비자물가지수 데이터는 통계청 소비자물가조사(2020=100 기준)를 바탕으로 경기도 지역의 개별 품목에 대한 물가 변동을 보여주는 자료입니다. 항목은 집계월, 품목명, 소비자물가지수값, 기준정보, 최종수정일자로 구성되어 있으며, 과일·채소·곡물·특용작물 등 다양한 생활필수품 및 농산물의 월별 물가 수준을 확인할 수 있습니다. 최신 12개월 데이터를 제공하여 시계열 분석이 가능하며, 이를 통해 계절별 물가 변동, 특정 품목의 급등락, 물가 안정 여부 등을 파악할 수 있습니다. *  최신 월 기준 12개월의 데이터를 제공합니다.
