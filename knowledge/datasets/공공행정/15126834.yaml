description_portal: 한국자산관리공사가 운영 · 관리하는 국유지 개발사업 준공사업장 건물 임대 현황에 대한 자료입니다.(총 임대변적, 임대중 면적, 임대가능 면적 등)정부의 국유지 관리 방향이 보존에서 활용으로 변화함에 따라 캠코는 국유재산의 위탁개발을 통해 국유재산의 가치를 높이고 있습니다. 저활용 행정재산이나 유휴일반재산을 대상으로 국가 필요시설과 민관복합건물을 개발하여 재정건전성을 높이고 정책사업을 효율적으로 지원하고 있습니다.국유재산 개발은 위와 같은 정량적인 재산의 가치증가 뿐만 아니라 국유재산에 대한 인식 전환에도 기여하고 있습니다. 노후화되어 지역 경제 활성화에 저해가 되거나 쓰레기 집단 투하장 등으로 방치되던 국유재산은 주변 환경과 조화되는 새로운 재산으로 탈바꿈되고 있으며, 대국민공모를 통해 선정된 '나라키움'이라는 명칭을 개발 완료 건마다 일체감 있게 부여하여 국유재산 개발의 정성적인 가치 또한 증대시키고 있습니다.
