summary_user: 국유지 개발사업 준공사업장 건물의 층별 임대 현황(사업명, 건물명, 층수, 층구분, 구조유형, 전용면적)을 담은 API로, 전체 709건을 전국 범위로 제공한다. 국유재산 개발 건물에 임대 가능한 공간이 얼마나 있는지 알아보려는 사업자나 분석가가 쓴다. 필드에서 확인되는 전역 조인 키가 없어 사업명·건물명 매칭이나 같은 기관 코드로만 다른 국유재산 자료와 잇는다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 포털 설명에 나온 총 임대면적·임대중·임대가능 면적은 현재 확인된 필드 목록에 보이지 않아 필드를 확인한 뒤 써야 한다. 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
