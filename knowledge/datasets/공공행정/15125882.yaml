summary_user: 국회예산정책처(NABO)가 펴낸 조세수첩 간행물을 건별로 담으며, 게시번호·등록일·담당부서·분류·제목·원문 링크·첨부파일명을 제공하고 범위는 전국·비공간이다. 연구자나 기자가 '최근 발간된 조세수첩은 언제 나왔고 원문 파일은 어디서 받는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·부서명 같은 이름 매핑이나 같은 기관의 다른 간행물 목록과의 대조로만 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
