summary_user: 서울특별시 강남구에서 식용얼음을 주된 품목으로 제조·유통·판매하는 업소의 인허가 원장으로, 업소 한 곳이 한 행이며 인허가일자·영업상태·폐업일자·휴업기간·도로명/지번주소·좌표·사업장명을 담는다. 강남구에서 지금 영업 중인 식용얼음 판매업소가 어디이고 언제 문을 열고 닫았는지 확인하려는 사업자나 상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)로만 이어 붙이며, LOCALDATA 인허가 자료와 출처가 같다.
