description_portal: '건축선이란 건축법 제46조에 따라 도로와 접한 부분에 건축물을 건축할 수 있는 선을 뜻하며, 이는 대지와 도로의 경계선으로 합니다. 건축선 후퇴란 내 땅을 지나는 도로 때문에 건축선이 토지의 경계 안쪽으로 밀려나는 경우를 말합니다.또한 공적공간이란 공중 (公衆)이 이용하도록 제공된 공간입니다. 건축법과 국토계획법에 따라 설치된 공개공지나 공개공간, 도로 및 건축물 사이의 공지를 비롯해 사유지 안에도 관계법령에 따라 공중을 위해 제공된 장소가 모두 공적공간에 해당됩니다.관계법령: 건축법 제46조 및 제47조 및 동법 시행령 제31조'
