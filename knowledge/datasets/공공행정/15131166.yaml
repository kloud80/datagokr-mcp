description_portal: '사전알림 계량기 추가: 개인정보 수집에 동의한 계량기 사용자에 한해 이메일 및 SMS로 사용중인 계량기의 재검정/정기검사 일정을 안내하는 서비스로 각각 재검정의 경우 한 달 전(30일), 정기검사의 경우 3일전 이메일 및 SMS를 통해 검사 일정을 안내하는 서비스입니다. * 국가기술표준원에서는 특히 국민 생활과 밀접한 관련이 있는 계량기 13종을 법정계량기로 지정하여 10ton 미만의 저울은 정기검사, 그 외 계량기는 재검정을 받도록 계량에 관한 법률에서 규정하고 있습니다.지정신청분야: 자체사업자(계량기 자체수리자/계량기 자체정기검사사업자)가 신청한 자체적인 수리나 정기검사를 할 수 있는 계량기 규격* 자체사업자가 등록한 지정신청분야 외 계량기는 이를 검사or수리할 수 있는 설비를 갖추어 지자체에 변경신고 후 지능형 계량기 유통관리시스템에 규격을 추가로 등록해 주셔야 합니다.'
