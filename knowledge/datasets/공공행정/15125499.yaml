summary_user: 가맹사업 기준년도와 브랜드관리번호별로 가맹점 사업자가 받아야 하는 교육훈련의 시간·비용 구분, 최소 교육시간, 교육비용, 비고를 담는 브랜드 단위 정보공개서 항목이며, 범위는 전국입니다. 가맹 창업 예정자가 '이 브랜드에 가맹하면 교육을 몇 시간 받고 비용은 얼마나 드나'를 확인하거나, 분석가가 브랜드 간 교육훈련 부담을 비교하는 데 씁니다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 같은 공정위 가맹정보 계열 데이터와 브랜드관리번호(brandMnno)·가맹본부관리번호·기준년도로 맞춰 이어 씁니다.
limits: 사업자등록번호 같은 전역 조인 키가 없어 다른 기관 데이터와는 이름 매핑이나 공정위 내부 관리번호로만 연결됩니다. 교육 최소시간·비용 값은 정형 수치가 아니라 내용(텍스트) 필드로 오므로 비교·집계 전에 정제가 필요합니다. 개발계정은 일 10,000회 호출 제한이 있습니다.
