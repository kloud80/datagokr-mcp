description_portal: '본 데이터는 공공데이터를 활용하지 않는 기업을 대상으로 한 실태조사 결과를 기반으로 하며, 기업의 미활용 이유, 활용 의향, 계획, 선호 분야 등을 정량적으로 파악할 수 있도록 구성되어 있습니다. 특히 미활용 이유(예: 필요성 부족, 활용 방법 모름 등), 향후 활용 의향 및 계획 유무, 활용 가능성이 높은 데이터 분야(예: 산업, 통계, 물류 등), 그리고 기업이 개방을 희망하는 구체적인 데이터 분야 등을 항목별로 수록하고 있어, 공공데이터 정책 개선 및 수요자 중심 데이터 개방 전략 수립에 중요한 기초자료로 활용됩니다. 이 데이터는 기업의 인식 변화 및 수요 구조를 시계열 분석하거나, 특정 산업군의 활용 저해 요인을 정리하는 데 유용하며, 향후 잠재적 활용기업군 발굴에도 활용 가능합니다.'
