description_portal: '○ 통계개요* 통계명 : 아동안전사고 사망자 현황(14세 이하 아동)* 통계종류 : 서울시 14세이하 이하 아동안전사고를 제공하는 지정ㆍ가공통계* 근거법령 :「가족관계의 등록 등에 관한 법률」제84조에 의한 사망신고와 그 기재사항* 작성목적 : 어린이가 안전하게 자랄 수 있는 제도와 환경을 구축하기 위한 정책기초자료로 활용* 조사체계 : 동 → 자치구 → 서울시 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 1년동안 안전사고로 사망한 14세 이하 아동수 등○ 용어설명* 사망원인 : 사망진단서에 기록되는 사인이란 사망을 유발했거나 사망에 영향을 미친모든 질병, 병태 및 손상과 이러한 손상을 일으킨 모든 사고 또는 폭력의상황을 말함○ 기 타* 14세 이하 아동에 대한 안전사고 사망자 수임* 사망원인통계 중 질병이환 및 사망의 외인(V01-Y89)에 의한 사망 중 자살 및 타살 제외교통사고 : 운수사고(V01-V99)추락 : 낙상(추락)(W00-W19)익사 : 불의의 익사 및 익수 (W65-W74)화재 : 연기, 불 및 불꽃에 노출 (X00-X09)중독 : 유독성 물질에 의한 불의의 중독 및 노출 (X40-X49)기타 : 모든 기타 외인 (Re. V01- Y89)'
