summary_user: 가맹본부가 해당 브랜드 외에 함께 경영하는 다른 가맹사업을 기준년도·브랜드관리번호별로 담으며, 경영 주체 구분, 상호명, 영업표지명, 정보공개서 등록번호, 업종, 가맹점 수·직영점 수를 건별로 제공한다. 가맹 창업 예정자가 "이 본부가 다른 브랜드도 운영하는가, 그 브랜드들의 가맹점 규모는 어떤가"를 확인해 본부의 신뢰도를 가늠하는 데 쓴다. 브랜드관리번호·가맹본부관리번호와 정보공개서 등록번호(brandExclJngIfrmpRgsno)로 같은 기관의 가맹정보 계열 API와 이어 쓰지만, 실측 컬럼에서 사업자등록번호 같은 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름 매칭으로만 연결된다.
description_portal: 브랜드 제외 경영가맹사업 정보에 대한 기준년도, 브랜드관리번호를 이용하여 경영가맹사업 상호명, 브랜드명 등 정보  조회 서비스를 제공합니다.
