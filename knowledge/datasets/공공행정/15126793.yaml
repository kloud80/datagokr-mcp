summary_user: 국고보조금의 예산현액·교부액·지출액을 사업연도별로 담으며, 분야·부문, 소관, 회계·계정, 프로그램·단위사업·세부사업·내역사업, 지출목·세목 단위로 나뉜 전국 범위의 재정 집계 자료이다. 분석가나 국민이 '올해 이 부처 보조사업에 배정된 돈 중 실제로 얼마가 교부되고 지출됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 분야·부문코드와 프로그램·단위·세부사업코드 같은 예산 분류 코드나 사업명으로 같은 기관의 다른 재정 데이터와 맞춰 잇는다.
limits: 수급자별 건별 원장이 아니며 사업자번호 같은 전역 키가 없어 국세청·상권 데이터와 직접 조인할 수 없다. 범위는 전국이지만 지역 구분이 없는 비공간 자료라 시도·시군구별 집행을 볼 수 없다. 개발계정 호출은 하루 10,000회로 제한된다.
