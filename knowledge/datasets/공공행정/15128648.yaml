description_portal: 2024년판 민원 빅데이터 분석 API로 민원 발생지별 정보와 포트홀 민원 위경도 정보 등을 조회할 수 있어, 민원 발생 지역의 특성을 파악하고, 도로 유지보수 등 실질적인 행정 서비스 개선에 활용할 수 있습니다. 또한, 민원 데이터를 기반으로 한 연구나 분석에 필요한 정보를 제공하여 공공 및 민간의 다양한 분야에서 활용될 수 있습니다. 또한, 지역별 민원 현황을 파악하여 기초지방자치단체별 민원 추세를 파악하는데 통계 자료를 제공합니다. 민원에 대한 빅데이터를 바탕으로 그 속에 담긴 의미있는 정보를 추출하여 정책 수립에 도움을 줄 수 있습니다. 주로 기초지방자치단체의 홈페이지 등에서 API를 호출하여 각종 민원 관련 통계를 제공하는데 활용됩니다.
team:
  dept: 민원정보분석과
services:
  - op: /minPttnStstAddrInfo
    name: 키워드 기반 민원 발생지별 정보
    endpoint: https://apis.data.go.kr/1140100/minAnalsInfoView7/minPttnStstAddrInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: target
        required: true
        desc: 'pttn : 일반민원 dfpt : 고충민원 saeol : 수집민원(새올시스템, 시도시스템, 응답소 등) prpl : 제안'
      - name: searchword
        required: true
        desc: '검색 질의어 '
      - name: dateFrom
        required: true
        desc: 검색기간(시작일)-yyyyMMdd
      - name: dateTo
        required: true
        desc: 검색기간(종료일)-yyyyMMdd
      - name: mainSubCode
        required: true
        desc: 기관코드
      - name: searchOption
        required: false
        desc: 검색영역 (기본값 제목 내용 전체 B006005)
      - name: omitDuplicate
        required: false
        desc: 중복 민원 제거 여부 (기본값 false  중복 제거안함    true 중복 제거 하여 동일한 민원 건수를 한 개로 카운트)
    approval: auto
    traffic:
      dev: 100
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
  - op: /minPotholeLatLonInfo
    name: 포트홀 민원 위경도 정보
    endpoint: https://apis.data.go.kr/1140100/minAnalsInfoView7/minPotholeLatLonInfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: dateFrom
        required: true
        example: '20240107'
        desc: 검색기간(시작일)-yyyyMMdd (최대 15일까지 가능)
      - name: dateTo
        required: true
        example: '20240107'
        desc: 검색기간(종료일)-yyyyMMdd (최대 15일까지 가능)
    approval: auto
    traffic:
      dev: 100
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
