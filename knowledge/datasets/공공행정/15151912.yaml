description_portal: 본 데이터는 K-ICT 빅데이터센터에서 실시한 교육 프로그램 참여자들의 만족도 및 직무 연관성을 조사한 원천 데이터를 개인정보 보호를 위해 합성 처리한 데이터셋입니다. 데이터는 교육만족도, 교육환경 만족도, 강사만족도, 교육 동기, 재직 직종 등의 주요 항목으로 구성되어 있으며, ICT 분야 교육 프로그램의 효과성과 참여자 특성 간의 상관관계를 분석할 수 있습니다. 합성데이터 기법을 통해 원본 데이터의 통계적 특성과 패턴은 유지하면서 개인 식별 가능성은 완전히 제거하였습니다. 본 데이터는 교육 정책 수립, 직업 훈련 프로그램 개선, ICT 인력 양성 전략 수립 등에 활용 가능하며, 특히 직종별 교육 수요 예측, 교육 만족도 영향 요인 분석, 교육 커리큘럼 최적화 연구, 평생교육 프로그램 설계 등 다양한 분야에서 유용하게 사용될 수 있습니다. 교육 분야 연구자, 정책 입안자, 교육기관 실무자들이 데이터 기반 의사결정을 위한 실증 자료로 활용할 수 있습니다.
