summary_user: 서울시설공단이 발주·관리한 공사의 기본 계약 정보를 공사 1건당 한 행으로 담은 파일로, 공사명·총공사비(원)·착공일자·준공예정일·도급자·공사위치를 담는다(포털 설명상 착공일자는 2003년 6월부터 2025년 8월까지). 시민이나 분석가가 "우리 동네에서 공단이 진행한 공사는 무엇이고 누가 얼마에 맡았나"를 확인하거나, 연도별 공사비·도급업체 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공사위치의 자치구·행정동 이름 매칭이나 도급자 업체명 매칭으로만 연결한다.
description_portal: 서울시설공단의 공사 업무 처리 정보입니다.파일 데이터에서 공사의 기본 계약 정보를 담은 데이터로, 공사의 명칭, 총 공사비,  공사기간, 도급자, 공사 위치 등의 정보를 제공합니다.공사 시작 일자를 나타내는, 착공일자는 2003년 6월 4일부터 2025년 8월 28일까지 입니다.공사 종료 예정 일자를 나타내는, 준공예정일자는 2004년 11월 8일부터 2028년 01월 11일까지입니다.공사 위치는 서울시설공단에서 관리하는 서울특별시 25개 자치구와 426동 행정동이 포함됩니다.
