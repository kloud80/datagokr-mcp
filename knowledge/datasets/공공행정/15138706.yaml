summary_user: 전국 지방자치단체별로 회계연도 단위의 시책추진업무추진비 기준액·편성액·비율을 담은 집계 데이터이며, 2020회계연도 이후 일반회계와 기타특별회계를 대상으로 한다. 주민이나 분석가가 "우리 시·군·구는 단체장 시책추진업무추진비를 기준액 대비 얼마나 편성했나"를 다른 자치단체와 비교할 때 쓴다. 자치단체 코드(laf_cd)와 자치단체명이 있지만 전역 조인 키로 확인되지 않아, 다른 지방재정365 공시 데이터와는 같은 기관 코드나 자치단체명 매핑으로 연결한다.
description_portal: 지방자치단체의 시책추진업무추진비는 지방자치단체장이 주요 시책을 효과적으로 추진하기 위해 사용하는 예산 항목으로, 공식행사, 각종회의 대내외 협력활동 등을 수행하는데 필요한 업무추진경비입니다. 이는 일반업무추진비와 구분되며 지방자치단체장의 정책정 판단과 행정운영에 따라 집행됩니다.시책추진업무추진비(2020년이후) 정보는 2020회계연도 이후 정보가 제공되고 있으며, 대상회계는 일반회계와 기타특별회계입니다. 세부 제공 항목으로는 자치단체별 기준액, 편성액, 시책추진업무추진비율 정보가 제공되고 있습니다.
