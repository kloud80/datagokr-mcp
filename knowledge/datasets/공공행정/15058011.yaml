summary_user: 지방재정365에서 회계연도별·지방자치단체별(광역·기초)로 세출예산을 분야 등 기능별로 나눈 금액을 담는 집계 데이터로, 범위는 전국입니다. 주민·분석가가 "우리 시·군·구는 올해 예산을 어느 분야에 얼마나 배정했나", "다른 자치단체와 기능별 예산 배분이 어떻게 다른가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 자치단체 코드·이름(wa_laf_cd 등)이나 분야 코드·이름으로 같은 기관의 다른 지방재정365 데이터와 매핑해 잇는다.
description_portal: '지방자치단체(광역자치단체, 기초자치단체)별 법적으로 설정한 목적을 달성하기 위해 지출할 비용을 정리한 계획서로, 특정 회계연도 내의 모든 지출 항목을 포함한 자료입니다. 정부가 수행하는 다양한 기능을 기반으로 하여, 세출예산을 기능별, 지방자치단체별로 나누어 분석하는 것을 의미합니다. 이 방법은 정부 재정정책을 수립할 때, 세출예산을 기능별, 지방자치단체별 자원의 배분을 효율적으로 파악하고, 예산 사용의 투명성을 높이는 데 기여합니다.(기능별 분류 : 정책사업, 행정운영경비, 재무활동 예산)'
