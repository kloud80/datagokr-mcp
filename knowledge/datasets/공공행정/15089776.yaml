description_portal: '중앙노동위원회 및 지방노동위원회에서 1년간 처리하는 노동쟁의 조정 건수, 중재 건수 및 심판건수(부당해고, 부당노동행위 등)을 제공(2023년 전체 사건 처리건수 18,946건, 중노위 2,385건, 지노위 16,561건에 대한 사건 처리건수)<약어 정의>- 노동쟁의 조정 사건(또는 조정 사건) : 노사관계 당사자 간 근로조건의 결정에 관한 주장의 불일치로 노동쟁의가 발생한 경우 노동위원회에 조정(調停)을 신청한 사건- 노동쟁의 중재 사건(또는 중재 사건) : 노동쟁의가 발생한 경우 노동위원회에 중재를 신청한 사건- 필수유지업무 사건 : 필수공익사업의 노동관계 당사자가 노동위원회에 필수유지업무의 필요 최소한의 유지·운영 수준, 대상직무 및 필요인원 등에 대한 결정을 신청한 사건- 부당해고등 사건(또는 부해 사건) : 부당해고등(해고, 휴직, 정직, 전직, 감봉, 그 밖의 징벌)을 당한 근로자가 노동위원회에 부당해고등에 대한 구제를 신청한 사건- 부당노동행위 사건(또는 부노 사건) : 사용자의 부당노동행위로 권리를 침해당한 근로자 또는 노동조합이 노동위원회에 부당노동행위에 대한 구제를 신청한 사건- 기타심판 사건 : 근로조건 위반에 대한 손해배상, 휴업이나 장해보상의 예외 인정, 노동조합 회의 소집권자의 지명 및 노동조합 규약의 시정명령 의결, 노동조합 결의·처분의 시정명령 및 노동조합의 해산 의결, 단체협약의 시정명령 의결, 단체협약의 해석이나 이행방법에 관한 견해의 제시 등의 일체- 복수노조 사건 : 교섭요구, 교섭대표, 교섭단위, 공정대표 등 복수노조 제도와 관련된 사건 일체 - 차별시정 사건(또는 차별 사건) : 차별적 처우를 받은 기간제·단시간·파견근로자 및 일학습병행근로자가 노동위원회에 차별적 처우에 대한 시정을 신청하거나, 고용노동부장관이 노동위원회에 차별적 처우를 통보한 사건 또는 고용상 성차별ㆍ직장 내 성희롱 피해근로자에 대한 시정신청'
