description_portal: 본 데이터는 2013년 기준 경기도 용인시 산업 중분류별 사업체 구분과 읍·면·동별 사업체 수, 종사자 수를 집계한 현황을 제공한다. 주요 항목은 산업중분류, 사업체구분, 읍·면·동, 사업체 수, 종사자 수로 구성되어 있으며, 이를 통해 산업별 사업체 유형과 지역별 경제 활동 현황을 종합적으로 파악할 수 있다. 소상공인 중심의 영세 사업체부터 중규모·대규모 사업체까지 규모별 특징을 분석할 수 있으며, 지역별 산업 구조 분포를 비교하여 경제 활동의 균형 정도를 확인할 수 있다. 자료는 창업 환경 분석, 소상공인 지원 정책, 지역 산업 육성 전략, 일자리 창출 계획 등 다양한 행정 및 연구 목적에 활용될 수 있다. 단일 연도 기준으로 제공되는 통계 자료로 주기적 갱신은 이루어지지 않지만, 당시 용인시 산업 구조와 지역별 경제 활동 특성을 이해하는 중요한 기초 자료로서 활용 가치가 높다. 공공데이터 개방을 통해 정보의 투명성과 활용도를 제고하고, 지역 맞춤형 경제 정책 수립에 기여하는 것을 목표로 한다.
