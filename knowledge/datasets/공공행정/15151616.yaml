summary_user: 경기도 행정동(읍면동)별로 기준년월과 요일에 따라 나눈 유동인구 집계를 담으며, 유동인구수·비율·등급과 전월·전년 동월 대비 증감값·증감비율이 함께 들어 있다. 상권 분석가나 창업 예정자가 '이 동네는 주말과 평일 중 언제 유동인구가 많고, 작년보다 늘었나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 행정동코드(admdong_cd)를 이름·코드 매핑으로 맞추거나 같은 기관의 상권·인허가 자료와 행정동·월 기준으로 이어 쓴다.
description_portal: 이 데이터는 경기데이터분석포털에서 유동인구의 시계열 및 공간적 변동을 분석하기 위해 구축된 자료로, 행정동 단위로 요일별 유동인구 데이터를 제공합니다. 각 행은 기준년월, 행정동코드, 요일코드에 따라 구분되며, 해당 조건에 해당하는 유동인구수, 유동인구수비율, 유동인구수등급 등의 정보가 포함되어 있습니다. 또한, 전월 및 전년 동월 대비 유동인구 증감값과 증감비율도 함께 제공되어 시계열 추세를 확인할 수 있습니다. 이 데이터는 요일코드를 활용하여 특정 요일에 따라 과거 유동인구 패턴을 비교하거나, 특정 지역의 유동 변화 흐름을 분석하는 데 적합합니다.
