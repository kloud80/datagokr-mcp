description_portal: 충청남도 공주시 공설 봉안시설 현황에 대한 데이터로 (봉안당 명칭, 위치, 관리주체, 전화번호, 설치년도) 등의 항목을 제공합니다. 이 자료는 봉안시설별 설치연도와 총 봉안능력(구) 등을 함께 수록해 지역별 장사 인프라의 규모와 운영 여건을 비교·파악할 수 있도록 구성됩니다. 또한 행정구역(시군구) 기준으로 시설을 구분하고, 공설·사설 여부 등 비고 항목을 포함해 실제 이용자가 시설 특성을 직관적으로 이해할 수 있도록 세부 정보를 표준화해 제공합니다. 이를 통해 장사시설의 배치 현황을 점검하거나 수요 기반의 정책 수립, 시설 확충 계획 마련 등 행정적 활용에 필요한 기초자료로 활용될 수 있습니다.
