summary_user: 지방자치단체(광역·기초)별·회계연도별로 공무원 맞춤형복지 제도 시행경비를 예산규모와 함께 담고, 예산 대비 비율을 붙인 2020년 이후 집계 자료이며 범위는 전국이다. 주민·기자·재정 분석가가 "우리 시·군·구는 전체 예산 중 공무원 복지포인트에 얼마를 쓰고 그 비중은 다른 자치단체와 비교해 어떤가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 자치단체 코드(laf_cd)·자치단체명과 회계연도(fyr)를 기준으로 같은 지방재정365 공시 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 지방자치단체(광역자치단체, 기초자치단체)별 맞춤형복지 제도는 회계연도에 공무원의 다양한 복지 수요를 충족 하기 위해 시행하는 제도로 공무원 개인에게 일정 범위 내에서 복지 혜택을 선택하도록 하는 방식이며 지역에 맞는 복지 정책을 구현하기 위해 각 자치단체의 자율성을 강조하고 있습니다. 공무원의 근무 능률 향상 및 복지 수준을 높이는 것이 목적입니다. 예산규모 대비 맞춤형 복지 제도 비용을 분석한 자료입니다.(예산규모는 지방자치단체별 회계연도에 계획한 전체 예산의 총합을 의미합니다.)
