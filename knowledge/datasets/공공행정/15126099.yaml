summary_user: 국회 회기별로 대수(ERACO), 회기 번호, 회기 시작일과 종료일을 담은 회기 단위 목록으로, 전국 단위의 비공간 데이터다. 의정 활동을 분석하는 사람이 특정 표결이나 회의가 어느 대수의 몇 회 회기에 열렸는지, 그 회기가 언제 시작해 언제 끝났는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 회의·표결·의안 데이터와는 대수·회기 번호 값이나 회기 기간 날짜를 맞춰 이어 쓴다.
