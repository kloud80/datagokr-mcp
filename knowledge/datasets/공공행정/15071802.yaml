summary_user: 서울시 축산물(식육·원유·식육가공품 등)을 냉동·냉장 보관하는 업소의 인허가를 업소 한 곳당 한 행으로 담은 원장 자료로, 인허가일·취소일, 영업·상세 상태, 폐업·휴업 일자, 소재지 지번·도로명 주소, 면적, 중부원점TM 좌표를 포함한다. 식품·물류 사업자나 분석가가 "우리 구에 영업 중인 축산물 냉장·냉동 보관업소가 어디에 몇 곳이고 최근 폐업이 늘었는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE)로만 연결하며, 원천이 같은 LOCALDATA 지방행정 인허가 자료와 함께 상권·점포 이력 분석에 쓴다.
description_portal: '해당 데이터는 서울특별시 축산물보관업 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.축산물(식육,원유,식육가공품 등)을 냉동 또는 냉장으로 보관하는 업소에 대한 데이터입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
