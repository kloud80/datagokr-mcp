description_portal: 공무원 마음건강센터는 공직자들의 정신건강을 지원하기 위해 전국 주요 정부 청사에 설치된 전문 심리상담 시설입니다. 현재 세종, 서울, 과천, 대전, 대구, 광주, 인천, 춘천, 제주, 경남 등 전국 곳곳에 위치해 있으며, 각 센터에는 전문 상담사들이 상주하고 있습니다.이 센터들은 공무원과 그 가족을 대상으로 스트레스, 직무 관련 어려움, 심리적 외상 등에 대한 개별 상담, 심리 검사, 집단 상담 등 다양한 프로그램을 운영합니다. 이 위치 데이터는 공직자들이 가까운 센터를 찾아 도움을 받을 수 있도록 정보를 제공하며, 공무원들의 건강한 직장 생활을 돕는 데 중요한 역할을 합니다.
