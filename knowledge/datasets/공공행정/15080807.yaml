description_portal: "'한국조폐공사_제품일람(여권)' 데이터는 한국조폐공사에서 발급하는 여권 제품에 대한 상세 정보를 제공하는 데이터로, 외교관여권, 관용여권, 일반복수여권, 일반단수여권 등 다양한 여권 종류별 특성을 담고 있습니다. 각 여권에는 총 면수와 내지 구성, 뒷표지 정보 등이 포함되어 있으며, 이를 통해 여권의 구조적 차이와 기능적 특징을 체계적으로 이해할 수 있습니다. 특히 여권의 내지 구성과 면수 차이를 통해 사용 목적과 대상에 따른 여권의 용도별 특성을 파악할 수 있습니다. 이 데이터는 여권 제작과 관리뿐만 아니라 학술 연구, 교육 자료 등 다양한 분야에서 실질적으로 활용될 수 있습니다."
