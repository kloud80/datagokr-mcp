description_portal: 이 데이터는 광주광역시 서구에서 운영 중인 옥외광고물관리시스템에 등록된 옥외광고물의 업소명, 주소, 광고물의 종류 및 규격, 표시 위치, 설치 일자, 조명 여부 등의 정보를 포함한 현황 자료입니다. 구체적으로는 옥외광고물을 신청한 업소의 지번주소 및 도로명주소, 광고물의 크기(가로, 세로, 면, 높이), 표시 위치와 내용, 조명 및 점멸 여부, 등록 일자 등의 세부 항목이 포함되어 있습니다.이 데이터는 옥외광고물의 합법적 설치 여부 확인, 불법 광고물 단속 계획 수립, 유사업소 광고물 분석, 도시 미관 및 행정계획 수립 등 다양한 목적으로 활용될 수 있으며, 옥외광고물 관리 행정업무뿐 아니라 민원 대응, 시각 환경 개선, 공공안전 확보, 빅데이터 기반 도시계획 수립 등에도 기초자료로 활용됩니다.데이터는 매년 최신 정보로 갱신되며, 데이터 항목은 CSV 파일 형식으로 제공되어 연계 및 분석이 용이합니다.
