summary_user: 서울 송파구에서 동별로 지정된 종량제봉투 판매소를 판매소 한 곳당 한 행으로 담은 파일이며, 판매업소명·행정동·도로명주소를 2023년 6월 기준으로 제공한다. 주민이 '우리 동에서 종량제봉투를 어디서 살 수 있나'를 찾거나, 분석가가 행정동별 판매소 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 도로명주소를 문자열로 맞춰 이어 쓴다.
limits: 행정동 코드나 판매소 고유 코드 같은 조인 키가 없어 다른 데이터와 연결하려면 이름·주소 매칭이 필요하다. 범위는 송파구 한 곳뿐이어서 다른 구의 판매소는 담지 않는다.
