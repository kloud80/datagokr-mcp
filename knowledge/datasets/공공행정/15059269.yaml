summary_user: 법제처가 제공하는 전국 판례 목록으로, 판례 한 건마다 사건번호·사건명·선고일자·법원명·사건종류·판결유형과 상세 링크를 담는다. 판례 경향을 찾는 분석가나 특정 사건번호·사건명의 판결을 확인하려는 사람이 쓴다. 전역에 통하는 조인 키는 확인되지 않아, 판례일련번호·사건번호나 법원종류코드·사건종류코드 같은 같은 기관 코드, 또는 이름 매핑으로 법제처 상세 조회와 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑을 직접 만들어야 한다. 외부 사이트 open.law.go.kr의 인증키(query 파라미터 OC)가 필요하며 포털 활용신청과는 별개다. 판례는 등록 시점 이후의 것이 가치가 있다는 검토 의견이 있어 과거 전 기간을 포괄하는지는 확인되지 않았다.
