summary_user: 한국국제협력단(KOICA)이 체결한 일반행정 분야 계약을 계약번호·차수 단위로 한 건씩 담은 CSV 파일로, 계약명·계약일자·계약금액·계약방법·조달구분·계약기간·의뢰부서·계약업체와 금액·기간·과업 변경 여부를 포함한다. KOICA 행정 계약을 감시하는 국민이나 공공조달 분석가가 "KOICA가 어떤 업체와 어떤 방법으로 얼마 규모의 일반행정 계약을 맺었고, 계약 후 금액이나 기간이 바뀐 건은 무엇인가"를 확인하는 데 쓴다. 계약번호(koica_contract_no)가 실측 조인 키라 같은 계약의 차수별 변경 이력을 묶거나 KOICA의 다른 분야 계약목록과 대조하는 데 쓰며, 업체·지역 코드 같은 외부 코드표 키는 없다.
description_portal: 한국국제협력단(KOICA)이 수행하는 연내 일반행정 분야 계약목록에 대한 데이터로, 계약번호, 계약명, 계약일자, 계약범위, 계약금액, 계약방법, 조달사업구분, 계약의 변경 여부(금액, 기간, 과업 등)에 대한 정보를 제공합니다. 각 계약에 대한 기본 정보와 조달 형태, 계약 체결 현황, 사업 상세사항을 세부적으로 제공함으로써, 국민들은 KOICA가 분야에서, 어떤 규모로, 어떤 업체와 계약을 맺는지 파악할 수 있습니다. 더불어 KOICA의 계약 정보를 공개함으로써, KOICA의 행정업무와 계약업무에 대한 투명성을 높일 수 있고 이는 기관의 신뢰도를 높이는데 기여합니다.
