summary_user: 한국자산관리공사(캠코)가 관리하는 전국 부동산 임대물건을 물건 한 건당 한 행으로 담은 목록 파일로, 지역구분·물건명·주소·준공년도·연면적·빌딩규모·전용률·평형정보 등을 담는다(약 9.5KB CSV). 사무실이나 상가를 구하는 사업자가 '우리 지역에 캠코가 임대하는 건물이 있고 전용률·평형은 어떤가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 물건주소를 주소·좌표로 변환하거나 이름으로 매칭해 이어 쓴다.
description_portal: 한국자산관리공사에서 관리중인 부동산의 임대물건에 대한 정보입니다. 수도권부터 강원도, 충청도, 전라도, 경상도 등 전국에 분포한 캠코부동산 임대물건의 상세 정보를 제공하고 있으며, 데이터 제공항목으로는 지역구분, 물건명, 물건주소, 준공년도, 연면적, 빌딩규모, 전용률, 상세설명, 평형정보내용, 물건키워드를 제공하고 있습니다. ※  해당 데이터는 2025년 4월 기준으로 생성되어 제공되고 있습니다.※  일부 데이터 값이 공란인 이유는 데이터가 미집계된 경우로 데이터 활용시 참고하여 주시기 바랍니다.
