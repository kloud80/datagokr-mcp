summary_user: 정부 부처·지방자치단체·공공기관·교육청이 제공하는 공공서비스(정부 혜택)를 서비스 한 건 단위로 담으며, 목록·상세·지원조건 오퍼레이션으로 서비스명, 지원대상, 선정기준, 지원내용, 신청방법·기한, 구비서류, 근거 법령·자치법규를 제공하고 범위는 전국이다. 국민이나 상담 서비스 개발자가 '내 조건에 맞는 정부 지원금·혜택이 무엇이고 어디에 어떻게 신청하나'를 찾는 데 쓴다. 전역 조인 키는 없고, 목록·상세·조건 정보는 서비스ID로 서로 잇고, 다른 데이터와는 소관기관코드·소관기관명이나 이름 매핑으로만 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터셋과는 기관 코드나 이름 매칭으로만 연결된다. 전국 단위의 비공간 데이터라 좌표가 없어 지도 표시나 위치 기반 분석에는 쓰지 못한다. 호출하려면 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
