description_portal: 이 데이터는 매 회계연도별로 충청북도에서 기초자치단체(시군)에 교부한 특별조정교부금 내역을 정리한 자료로, 조정교부금 총액의 10% 범위 내에서 지역별로 차등 교부된 내용을 포함하고 있습니다. 본 자료는 각 회계연도 결산 이후 재정공시를 통해 공개되는 데이터로, 교부연도, 시군명, 교부금액, 교부사유 등의 항목으로 구성되어 있습니다. 특별조정교부금은 지역 간 재정격차 해소 및 시급한 현안사업 해결을 위한 목적 재원으로 사용되며, 지방재정의 탄력적 운영과 지역 특수성 반영에 중요한 역할을 합니다. 본 데이터는 교부 기준의 형평성 분석, 지역재정 수요 진단, 정책자금 배분의 투명성 확보 등 다양한 행정 및 정책 수립 과정에 기초자료로 활용될 수 있습니다.
