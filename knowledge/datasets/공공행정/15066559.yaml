description_portal: '인천광역시의 군구별 인구 이동 현황 공공데이터는 시내 군/구별로 발생한 전입 및 전출 인구의 규모를 성별과 **이동 유형(시내/시군구 간)**에 따라 집계한 통계 자료입니다. 이 데이터는 지역 인구 분산 및 집중 현상, 거주지 변화 패턴을 파악하고, 지역 개발 정책, 주거 환경 개선, 생활권 조성 등의 기초 자료로 활용됩니다.<주요 구성 항목>-군구별: 데이터는 강화군, 옹진군, 중구, 동구, 미추홀구, 연수구, 남동구, 부평구, 계양구, 서구 등 시내 행정구역별로 분류됩니다.-전입 인원 (명): 각 군/구로 전입한 총 인원을 남자와 여자로 구분하여 제공합니다.-해당데이터는 국가통계포털(KOSIS)의 국내인구이동통계 -> 시군구/성별 이동자수를 찾고 하였습니다.'
