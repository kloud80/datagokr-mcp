description_portal: 대구광역시 서구 기계설비유지관리자 선임 대상 건축물(일반건축물, 공동주택) 현황 자료입니다. 건물명, 연면적, 세대수, 주소에 관한 내용을 포함하고 있습니다.본 데이터는 대구광역시 서구 관내 기계설비 유지관리자 선임 대상 건축물 현황을 체계적으로 정리한 자료이다. 각 건축물의 연번, 명칭, 용도, 연면적(㎡), 세대수 및 상세 주소를 포함하여 구체적인 정보를 제공한다. 자동차시설, 공장, 의료시설, 교육연구시설, 판매시설, 공동주택 등 다양한 용도의 건축물이 포함되어 있으며, 기계설비 유지관리자 선임 기준에 따른 대상 건물 파악에 유용하다. 본 자료는 건축물별 기계설비 안전관리 및 유지보수 계획 수립에 필수적인 기초 자료로 활용됨을 목적으로 한다.
