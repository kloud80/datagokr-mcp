description_portal: 성남시 내 현수막지정게시대 현황입니다(설치위치(주소), 용도, 게시대 수, 규격(높이,너비),  게시면 수, 부착금액, 관리기관) 성남시는 도시미관을 유지하고 무분별한 불법 광고물을 방지하기 위해 현수막 지정게시대를 운영하고 있습니다. 지정게시대는 주민 홍보, 행사 안내, 공익 캠페인 등을 합법적으로 홍보할 수 있는 공간으로, 구청 및 시청 담당 부서의 관리 하에 설치·운영되고 있습니다. 2025년 기준 성남시 전역에는 약 100개소 이상의 지정게시대가 설치되어 있으며, 분당구, 수정구, 중원구의 주요 간선도로변 및 유동인구가 많은 지역에 집중 배치되어 있습니다. 게시대는 일반적으로 횡형 기둥식 게시대나 지주형 프레임 게시대의 형태로 구성되며, 게시기간, 규격, 부착 가능 매수 등은 조례에 따라 규정되어 있습니다.
