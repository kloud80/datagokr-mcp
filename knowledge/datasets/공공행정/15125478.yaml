summary_user: 가맹 브랜드별로 가맹점사업자가 부담하는 기타비용을 기준년도·브랜드관리번호 단위로 담은 전국 범위의 건별 공시 정보로, 비용 구분, 지급 대상, 지급 금액, 지급 기한, 반환 조건을 항목마다 기록한다. 창업 예정자가 "이 브랜드에 가맹하면 가맹비·교육비 외에 어떤 비용을 누구에게 언제 내고, 어떤 조건에서 돌려받는가"를 확인하거나 분석가가 브랜드 간 추가 부담 비용을 비교하는 데 쓴다. 실측 컬럼에는 사업자등록번호 같은 전역 조인 키가 없으므로, 같은 공정위 가맹정보 계열 데이터와는 브랜드관리번호(brandMnno)·가맹본부관리번호와 기준년도로 잇고, 그 밖의 데이터와는 브랜드·본부 이름 매핑으로만 연결한다.
