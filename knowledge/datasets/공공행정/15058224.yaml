summary_user: 지방자치단체의 복식부기 재무현황 중 발생주의로 인식한 '비용'을 회계연도와 자치단체(광역·기초 코드와 이름) 단위로 금액 하나씩 담은 집계 데이터이며, 범위는 전국입니다. 분석가나 주민이 "우리 시·군·구가 한 해 동안 행정서비스와 재정활동에 쓴 자원 소모 규모가 다른 자치단체와 비교해 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 지방재정365의 다른 공시 데이터와는 같은 기관의 자치단체코드(laf_cd)와 회계연도로 잇고, 다른 기관 데이터와는 자치단체 이름을 매핑해 연결한다.
description_portal: 지방자치단체에서 복식부기 재무현황 중 ‘비용’이란, 회계기간 동안 자치단체가 행정서비스를 제공하거나 재정활동을 수행하는 과정에서 발생한 자원 소모를 금전적 가치로 측정한 것을 말합니다.이는 경상비, 인건비, 감가상각비, 이자비용, 무상제공서비스 등 다양한 항목을 포함하며, 발생주의 회계기준에 따라 인식됩니다. 단순히 현금 지출만을 의미하는 것이 아니라, 실제 자원의 감소나 의무 발생을 기준으로 비용을 산정하는 것이 특징입니다.복식부기를 통해 비용을 인식하면 자치단체의 자산, 부채, 순자산 변동을 체계적으로 파악 할 수 있습니다.
