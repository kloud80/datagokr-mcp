description_portal: 서울시 안경업 인허가 정보는 안경 판매 및 시력 측정 서비스를 제공하는 안경점의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소·폐업·휴업·재개업일자와 영업상태, 상세영업상태를 통해 각 업소의 행정 이력을 확인할 수 있으며, 사업장명, 전화번호, 주소, 좌표, 소재지면적 등으로 위치와 기본 정보를 파악할 수 있습니다. 또한 시력표, 표본렌즈, 측정의자, 동공거리측정기, 정점굴절계, 조제용연마기, 렌즈절단기, 가열기, 안경세척기 보유 수와 총면적 정보를 통해 시력 검사 및 안경 조제·가공을 위한 장비·시설 수준을 확인할 수 있습니다. 이 데이터는 지역별 안경업소 분포 및 접근성 분석, 시력검사·조제가 가능한 시설 규모 파악, 보건·의료·안경 산업 정책 수립, 상권 분석 및 민간 지도·정보 서비스 연계 등 다양한 행정·연구·산업적 활용에 유용한 자료입니다.
