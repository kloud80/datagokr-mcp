summary_user: 서울시 안경점의 인허가 원장으로, 업소 한 곳당 한 행에 인허가·폐업·휴업 일자, 영업상태, 주소·좌표와 시력표·렌즈절단기 같은 검사·조제 장비 보유 수, 총면적을 담는다. 창업 예정자나 상권 분석가가 '이 동네에 영업 중인 안경점이 몇 곳이고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 주소·좌표나 사업장명으로 맞춰 붙이거나, 같은 출처를 공유하는 LOCALDATA 인허가 업종 데이터와 관리번호(MGTNO) 체계로 묶어 쓴다.
limits: 호출에는 서울 열린데이터광장(data.seoul.go.kr) 인증키가 필요하며, 이 키는 공공데이터포털 활용신청과 별개로 받아야 한다. 표준 행정코드 같은 전역 조인 키가 없어 행정동·상권 통계와 바로 결합할 수 없고, 주소나 좌표를 거쳐 따로 매핑해야 한다.
