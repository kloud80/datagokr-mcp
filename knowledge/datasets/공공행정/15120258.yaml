summary_user: 경기데이터분석포털이 운영하던 분석교육 강의를 강의 한 건 단위로 담으며, 강의명·강의번호·분류(열린강의 등)·상태(종료 여부 등)·설명·시작일과 종료일·장소·정원을 기록한다. 경기도 데이터 분석 교육이 언제, 어디서, 어떤 주제로, 몇 명 정원으로 열렸는지 되짚어 보려는 분석가나 교육 담당자가 과거 운영 이력을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 강의명·장소 이름 매핑이나 같은 기관(경기도) 자료로만 느슨하게 연결한다.
description_portal: 이 데이터는 경기데이터분석포털에서 제공한 분석교육 강의 정보를 담고 있으며, 강의명, 강의번호, 강의분류코드 및 명칭, 강의상태코드 및 명칭, 강의설명, 강의 시작일자와 종료일자, 강의장소, 강의정원 등의 항목으로 구성되어 있습니다. 강의분류는 '열린강의' 등으로 구분되며, 강의상태는 종료 여부 등을 나타냅니다. 교육 대상자는 모델 고도화, 분석 서비스 활용 등 데이터 기반 실무 능력 향상을 목표로합니다.경기데이터분석포털>소통참여>분석교육 게시판에서 확인 가능했으나 해당 게시판 삭제(운영중단)로 갱신이 중단되었습니다.
