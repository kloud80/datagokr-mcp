summary_user: 전국 지방자치단체의 일반회계 공무원 인건비 비율을 회계연도·자치단체별로 집계한 공시 지표로, 인건비 금액, 세출결산액, 그 비율(goem_lbst_rt)을 담는다. 분석가나 주민이 '우리 시·군·구의 세출 가운데 공무원 인건비 비중은 다른 자치단체와 비교해 높은가'를 따질 때 쓴다. 전역 조인 키는 없으며, 회계연도와 광역·기초 자치단체 코드 및 이름을 기준으로 같은 지방재정365의 다른 지표(재정자립도 등)와 이어 쓴다.
description_portal: 공무원 인건비 비율은 지방자치단체의 일반회계를 대상으로 집계되며, 해당 회계연도 총계 세출결산액을 기준으로 산출됩니다.이 비율은 자치단체의 1년간 공무원 인건비 집행 현황을 반영하며, 인건비에는 다음 항목이 포함됩니다:보수(101-01), 기타직 보수(101-02), 공무직(무기계약직) 근로자 보수(101-03), 직무수행경비(직급보조비),포상금(성과상여금), 연금부담금, 국민건강보험금 등 해당 금액을 일반회계 세출결산액으로 나누어 공무원 인건비 비율을 산정하며, 이는 지방자치단체의 인건비 부담 수준과 재정 운영의 건전성을 파악하는 데 중요한 지표로 활용됩니다.이 지표는 인건비의 과다 여부를 분석하거나, 재정 구조의 적정성 여부를 판단하는 참고자료로 활용될 수 있습니다.
