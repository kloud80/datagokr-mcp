summary_user: 국회도서관에 접수된 정보공개청구를 연도·일련번호별 건 단위로 담고, 청구 사유, 담당 부서, 결정 구분(공개·비공개), 공개·비공개 사유, 결정 통지일, 공개일·공개 방법·공개 형태, 공개 파일명을 함께 기록한다. 국회도서관에 어떤 정보가 주로 청구되고 어떤 사유로 비공개 결정이 나는지 확인하려는 청구인이나 정보공개 제도 분석가가 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키를 찾지 못해, 담당 부서명 같은 이름을 매핑하거나 같은 기관(국회사무처) 데이터와 기관 단위로만 연결한다.
