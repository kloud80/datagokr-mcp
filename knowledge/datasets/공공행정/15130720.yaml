description_portal: 토크대구는 대구광역시에서 운영하는 정책 참여 시스템으로, 시민들이 제안,토론,투표,설문을 통해 대구시 정책형성과 실행에 참여하는 쌍방향 온라인소통 플랫폼입니다. 토크대구 오픈소스란, 구군 홈페이지에 토크대구를 독립적으로 운영, 관리할 수 있는 연계프로그램으로 토크대구 오픈소스를 통하여 주민의 지역현안 해결 참여를 도모하고 있습니다. 토크대구에서 진행되는 모든 처리결과는 투명하게 공개되며, 토크대구 및 오픈소스 시스템의 데이터 목록 중 토론목록(등록일자/제목/공감수/댓글수)의 데이터를 공개합니다.
