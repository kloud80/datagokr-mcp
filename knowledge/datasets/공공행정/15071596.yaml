description_portal: 울시 식품첨가물제조업 인허가 정보는 식품에 사용되는 첨가물을 제조하는 업체에 대한 인허가 및 영업 현황을 제공하는 공공데이터입니다. 인허가일자와 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태와 상세영업상태 정보를 통해 각 제조업체가 현재 영업 중인지, 휴업 또는 폐업 상태인지를 확인할 수 있는 행정 이력 자료입니다. 사업장명, 전화번호, 지번주소와 도로명주소, 우편번호, 좌표, 소재지면적, 업태구분명, 위생업태명 등의 항목은 업체의 위치와 규모, 위생 관련 분류 및 업종 특성을 파악하는 데 활용될 수 있습니다. 남성과 여성 종사자수, 총인원, 본사 및 공장 사무직·판매직·생산직 종업원수 정보는 제조업체의 인력 규모와 성별 분포, 직무별 인력 구성을 분석하는 데 유용한 자료입니다. 또한 영업장주변구분명, 등급구분명, 급수시설구분명, 건물소유구분명, 시설총규모 정보는 식품첨가물 제조시설의 입지 환경, 위생과 시설 수준, 자가 또는 임대 여부 등 운영 특성을 평가하는 데 도움을 주는 항목입니다. 보증액과 월세액은 제조업체의 임대료 및 초기 비용 수준을 파악하는 데 활용할 수 있으며, 다중이용업소여부, 전통업소지정번호, 전통업소주된음식, 홈페이지 정보는 안전관리, 전통 식품 관련 제조업체 발굴, 대국민 정보 제공과 홍보 서비스 기획 등에 기초 자료로 활용 가능한 데이터입니다.
