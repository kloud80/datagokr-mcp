summary_user: 서울시 관할 목재생산업(제재업) 사업장의 인허가·영업 이력을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 포털 설명 기준 총 15건이며 인허가일자는 2013-12-05부터 2025-05-07까지 분포한다. 사업자나 분석가가 서울에 영업 중인 제재업체가 어디에 있고 언제 인허가·폐업했는지, 취급 목재제품·연간생산량·자본금이 어떤지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관(서울시) 코드로만 연결하며, 같은 원천을 쓰는 LOCALDATA 인허가 자료와 함께 상권·점포 원장 분석에 쓴다.
description_portal: 'ㅇ 데이터 개요: 서울시 관할의 목재생산업(제재업) 인허가·영업 이력 정보를 정리한 표 형식 데이터입니다. 사업장명, 주소, 인허가일자, 영업상태, 좌표(X·Y) 등 행정·공간 정보를 함께 제공합니다.ㅇ 규모·범위: 총 15건, 32개 필드로 구성되어 있습니다. 주소 기준으로 서울 소재 건이 다수(13건)이며, 과거 이력상 타 지자체 건도 일부 포함됩니다.ㅇ 기간: 인허가일자는 2013-12-05부터 2025-05-07까지 분포합니다.ㅇ 상태 분포: 영업/정상 8건, 폐업 5건, 제외/삭제/전출 2건입니다.ㅇ 업종 세부: 목재생산업구분코드명은 ‘제재업’ 표기가 9건이며, 목재생산업종류명은 1종 5건, 2종 1건, 3종 1건, 4종 2건(미기재 6건)입니다.ㅇ 주요 필드: 관리번호, 인허가일자, 영업상태(코드/명), 사업장명, 지번·도로명주소, 좌표(X/Y), 목재생산업 구분·종류, 취급목재제품, 인력보유현황, 연간생산량, 자본금, 최종수정일자, 데이터갱신일자 등으로 구성됩니다.ㅇ 공간정보: 전 건에 좌표(X/Y)가 있어 행정동·권역별 분포 분석 및 지도 시각화가 가능합니다.ㅇ 데이터 품질·유의: 휴·폐업일자, 소재지우편번호, 소재지면적 등은 결측이 많고, 동일 사업장명이 중복된 행(예: 2개 사업장)이 존재합니다(행정이력 또는 변경 반영 가능성—확실하지 않음).'
