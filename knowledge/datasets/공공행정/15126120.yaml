summary_user: 국회사무처가 소개하는 어린이국회 우수법률안을 게시글 단위로 담은 목록이며, 필드명으로 보아 제목(BRDI_TTL)·작성일·원문 링크로 구성되고 범위는 전국·비공간이다. 교사나 학부모, 청소년 교육 담당자가 '최근 어린이국회에서 어떤 법률안이 우수작으로 뽑혔나'를 확인하고 원문으로 이동할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의안 데이터와는 제목이나 날짜로 맞춰 보는 방식으로만 연결한다.
