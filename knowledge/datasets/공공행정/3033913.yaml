summary_user: 공공기관 의무구매 대상인 중소기업 기술개발제품 13종(성능인증, NEP, GS인증, NET, 혁신제품 등)의 인증 현황을 인증 1건당 한 행으로 담은 전국 단위 파일로, 인증구분·인증번호·제품명·업체명·사업자등록번호·대표자·인증일자·만료일자를 담는다. 공공기관 구매 담당자가 특정 업체 제품이 우선구매 대상 기술개발제품 인증을 받았고 아직 유효한지 확인하거나, 분석가가 인증 종류별 보유 기업을 파악하는 데 쓴다. 사업자등록번호(bizno)를 키로 사업자 등록 상태, 기업 정보, 조달·계약 실적 데이터와 업체 단위로 이어 쓴다.
description_portal: '* 공공구매종합정보망(www.smpp.go.kr)에서 제공하는 데이터입니다.* 우선구매 제도소개 : 중소기업 기술개발제품의 판로를 지원하고 기술개발 의욕을 고취시키기 위하여 중소기업이 개발한 기술개발제품을 공공기관에서 우선적으로 구매토록 하는 제도입니다. - 법적근거 : 중소기업제품 구매촉진 및 판로지원에 관한 법률 제13조* 공공기관의 의무구매대상인 기술개발제품 13종의 인증 현황 1) 성능인증, 2) 우수조달물품지정, 3) NEP(신제품인증), 4) GS인증,  5) NET(과학기술, 건설교통, 환경, 보건의료신기술, 농림식품, 해양수산, 목재제품, 농업기계, 재난안전, 물류), 6) 우수조달 공동상표, 7) 물산업 우수제품 등 지정, 8) 혁신제품(우수연구개발혁신제품, 혁신시제품, 기타혁신제품) 9) 녹색기술제품, 10) 산업융합 신제품 적합성 인증, 11) 산업융합품목, 12) 수요처 지정형 기술개발제품(구매조건부신기술개발, 민관공동투자기술개발, 성과공유기술개발) 13) 재난안전제품인증  * 데이터 구성요소 :  인증구분, 인증번호, 인증제품명, 업체명, 사업자등록번호, 대표자, 인증일자, 만료일자 순'
