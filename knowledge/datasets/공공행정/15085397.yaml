description_portal: '○ 통계개요* 통계명 : 서울의 가계수지* 통계종류 : 서울시 가구의 소득 및 가계지출 현황을 제공하는 지정ㆍ조사통계* 작성목적 : 가구에 대한 가계수지 실태를 파악하여 소득과 소비 수준변화의 측정 및분석 등에 필요한 자료를 제공하는 것을 목적으로 함* 조사체계 : 지방통계청 → 통계청* 공표주기 : 정기(매년, 12월 기준)  * 2008년 생산종료* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 가구의 경상소득ㆍ비경상소득 등 소득현황, 소비지출ㆍ비소비지출등 가계지출현황, 월세평가액 및 현물총액 등○ 용어설명* 근로자가구 : 가구주가 정부나 기업(준법인기업 포함)에 고용되어 정신적 또는 육체적노동을 제공하고 그 대가로 급여를 받는 가구* 소득 : 가구의 실질적인 자산의 증가를 가져온 일체의 현금 및 현물의 수입을 말하며경상소득과 비경상소득으로 구성됨- 경상소득 : 가구가 근로제공의 대가로 받은 근로소득, 자영사업으로부터의 사업소득(혼합소득), 자산으로부터 이자, 배당금 등의 재산소득, 정부, 타가구, 비영리단체등으로부터 이전되는 이전소득 등 경상적으로 발생되는 소득- 비경상소득 : 경조소득, 퇴직수당 등 일정하지 않고, 확실하지 않으며 일시적으로 발생하는 소득을 말함* 가계지출 : 가계지출은 실질적으로 가계의 자산이 감소되는 지출로써, 소비지출과비소비 지출로 구성- 소비지출 : 생계 및 생활을 위해 소비하는 내구재, 비내구재, 준내구재의 상품 및서비스의 구입에 대한 대가로 지출하는 비용- 비소비지출 : 조세, 공적연금, 사회보험, 비영리단체로 이전, 가구간이전 등 소비지출 및자산구입이 아닌 금액'
