summary_user: 수원시 일평균 유동인구를 격자 단위로 담은 2021년 기준 일회성 파일(CSV 약 1.4MB)로, 격자별 좌·우·상·하 경계 좌표와 전체·성별·연령대(20세 미만, 20~40세, 40~65세, 65세 이상) 일평균 유동인구를 담는다. 상권 분석가나 시 정책 담당자가 '수원시에서 하루 평균 사람이 가장 많이 다니는 격자는 어디이고, 그곳의 성별·연령 구성은 어떤가'를 확인해 상권·교통·방역 정책 대상지를 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 격자 경계 좌표를 이용한 공간 겹침이나 같은 기관(수원시) 자료와의 수동 매핑으로만 이어 쓰며, 상권·인허가(LOCALDATA) 점포 원장과 위치 기준으로 겹쳐 보는 것이 주된 연계다.
description_portal: 해당 데이터는 경기도 수원시의 일평균 유동인구 데이터로 격자정보, 성별 인구 수, 연령대별 인구 수 데이터를 포함합니다. 2021년 기준의 일회성 데이터입니다. 데이터 활용에 참고하여 주시기를 바랍니다. 특정 지역의 유동인구 규모를 바탕으로 치안, 방역, 교통, 상권 활성화 정책을 맞춤형을 설계하는데 활용할 수 있습니다. 시민이 특정 지역의 혼잡도를 미리 파악해 방문 시기를 조정하거나 사람이 많이 모이는 장소를 제공받아 개인 안전 확보에 도움이 되며, 주민들이 유동인 규모를 근거로 교통편, 편의시설 확충을 요구하는데 활용할 수 있습니다.
