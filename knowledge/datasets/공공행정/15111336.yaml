summary_user: 법제처 지능형 법령정보 지식베이스에서 특정 법령(기준법령)을 중심으로 상위법령·하위법령·시행령·시행규칙 등 연관된 법령 목록을 조회하는 전국 단위 외부 API로, 기준법령 ID·이름과 관련법령 목록을 XML로 돌려준다. 법무 담당자나 연구자가 '이 법률에 딸린 시행령·시행규칙과 상위법은 무엇인가'처럼 한 법령의 법체계 연결 구조를 파악하는 데 쓴다. 기준법령ID로 법령 원장 계열 데이터와 묶어 시행일·개정 이력 변경 감지에 연결할 수 있으나, 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 법령명 매핑이나 같은 기관(법제처) 코드로만 이어 쓴다.
description_portal: 지능형 법령정보 지식베이스 관련법령 목록을 XML 데이터로 제공 받으실 수 있는 관련법령 정보 목록 조회 서비스입니다. 이 기능은 특정 법률의 조문을 중심으로 상위법령, 하위법령, 시행령, 시행규칙, 영문조문 등 연관된 법체계 요소를 체계적으로 연결하여 제공합니다. 이를 통해 이용자는 조문 간의 상호 연계 관계를 쉽게 파악하고, 해당 법령의 적용 맥락과 구조를 종합적으로 확인할 수 있습니다. 본 데이터는 법령 간의 구조적 연관성을 바탕으로 법제 연구, 판례 분석, 조문 해석 및 법률 검토 업무 등 다양한 용도에 유용합니다.
