summary_user: 충청북도 단양군이 사용허가·대부를 내준 국공유재산을 건별로 담은 파일로, 재산 구분·소재지·지목·허가(대부)면적·기간·관리부서와 연락처를 한 줄씩 기록한다. 단양군에서 군유지나 국유지를 빌려 쓰려는 주민·사업자가 어느 위치의 어떤 땅이 이미 사용허가 중인지, 담당 부서가 어디인지 확인하는 데 쓴다. 전역 조인 키나 필지고유번호(PNU)는 없어서, 다른 데이터와는 소재지 주소를 이름으로 맞추거나 같은 기관 자료끼리 이어 써야 한다.
description_portal: 충청북도 단양군의 국공유재산 사용허가 현황을 정리한 데이터입니다. 구분, 소재지, 지목, 허가(대부)면적, 허가(대부)일, 기간, 관리부서명, 연락처, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 국공유재산 사용허가 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 15일입니다. 담당부서는 단양군청 행정복지국 재무과이며 문의주시면 최신의 충청북도 단양군 국공유재산 사용허가 현황을 열람하실 수 있게 도와드립니다.
