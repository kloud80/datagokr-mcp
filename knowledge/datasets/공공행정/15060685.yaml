description_portal: 이 자료는 당해년도 행정부 국가공무원의 부처별(가나다순) 직종별 여성공무원 비율을 정리한 자료입니다. 각 부처별 정무직공무원, 일반직공무원, 특정직공무원, 별정직공무원에 대한 인원수와 여성공무원 인원수 및 비율을 나타내고 있습니다. 부처명은 가나다 순으로, 감사원, 개인정보보호위원회, 경찰청, 고용노동부 순으로 되어 있습니다.여성공무원 비율은 각 부처별  여성공무원수를 각 부처별 전체 인원수로 나누고 100을 곱하여 나타냈습니다. 통계 산출 기준일은  매년 12월 31일이며, 단위는 명, 퍼센트(%)입니다.
