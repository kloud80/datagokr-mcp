summary_user: 울산시설공단이 관리하는 울산 시내 공공시설물을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 4KB)로, 시설명·연면적·대지면적·주요시설·주요기능·연락처·주소·데이터 기준일자를 담는다. 시민이나 분석가가 '울산시설공단이 운영하는 시설은 어디에 있고 규모와 기능은 어떤가'를 확인하는 데 쓴다. 실측 조인 키는 시설명(uicf_facility_nm)뿐이고 코드표는 없으므로, 다른 데이터와는 시설명 문자열이나 주소를 맞춰 잇는다.
description_portal: 울산시설공단은 공공시설물의 체계적인 관리와 시민의 알 권리 충족을 위해 울산시 내 각종 시설물에 대한 정보를 데이터 형태로 제공하고 있습니다. 제공되는 울산시설공단_시설물 현황 데이터는 시설명, 연면적(제곱미터), 대지(부지)면적, 주요시설, 주요 기능, 연락처, 주소, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 각 시설의 규모와 부지 면적을 비롯해 어떤 주요시설이 설치되어 있는지, 그리고 해당 시설이 어떤 목적과 기능으로 운영되고 있는지를 구체적으로 확인할 수 있습니다. 데이터 기준일자를 통해 정보의 최신성도 확인할 수 있습니다.
