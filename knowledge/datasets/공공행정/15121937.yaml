summary_user: 공공기관이 공공데이터포털에 등록해 개방 중인 데이터 목록을 한 행씩 담은 메타정보 파일로, 목록키·목록명·키워드·제공기관명과 코드·목록유형(FILE/API)·서비스유형·데이터포맷·요청변수·출력결과·제공주기·전체행을 포함한다(CSV 약 24.6MB). 분석가나 에이전트가 "어느 기관이 어떤 주기로, 어떤 형식의 데이터를 API나 파일로 개방하고 있는가"를 찾거나 목적에 맞는 데이터셋 후보를 고를 때 쓴다. 전역 조인 키는 없어 목록키로 개별 데이터셋 페이지를 찾거나, 제공기관명·제공기관코드로 행정표준코드 같은 기관 코드 원장과 이름·코드 매핑으로 잇는다.
description_portal: 공공기관이 공공데이터포털에 등록하여 개방중인 목록의 메타정보(목록키, 목록명, 키워드, 제공기관명, 제공기관코드, 목록유형, 서비스유형, 데이터포맷 , 요청변수, 출력결과, 주기, 전체행)를 제공합니다.목록키는 데이터 목록을 식별하는 고유 키, 목록명은 데이터 목록의 명칭, 키워드는 데이터 검색을 위한 주요 키워드, 제공기관명 및 코드는 데이터를 제공하는 기관의 명칭 및 코드 입니다. 목록유형에는 FILE, API로 구분, 데이터포맷은 CSV,  XLSX, HWPX, PDF, JSON+XML,  JSON, XML 등으로 구분, 주기는 연간, 반기, 분기, 월간, 주간, 수시 등으로 구분, 서비스유형은 FILE, LINK, REST 등으로 구분됩니다.
