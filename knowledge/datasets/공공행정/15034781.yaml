description_portal: 서울특별시 광진구_건축사사무소현황 데이터는 광진구 관내에서 운영되는 건축사사무소의 신고 및 기본 현황을 제공하는 행정 데이터입니다. 이 데이터는 “건축사사무소 신고번호”, “건축사사무소 신고구분”, “건축사사무소 사무소명”, “건축사사무소 주소”, “건축사사무소 영업구분”  필드로 구성되어 있습니다. ‘건축사사무소 신고번호’은 해당 사무소가 관할 행정기관에 신고된 번호를 나타내며, ‘건축사사무소 신고구분’은 법인 또는 개인 여부를 구분합니다. ‘건축사사무소 사무소명’은 등록된 사무소의 명칭을, ‘건축사사무소 주소’는 해당 사무소의 도로명 위치 정보를 제공합니다. '영업구분'은 등록영업중, 재개업영업중, 전입영업중 등을 나타내는 데이터입니다. 이 데이터는 건축 관련 행정 관리, 지역 내 건축사무소 분포 파악 및 정책 수립의 기초 자료로 활용됩니다.
