description_portal: 이 자료는 충청남도 청양군에 설치된 옥외광고물 게시대 현황을 확인할 수 있도록 정리한 데이터입니다.지역 내 게시대의 명칭, 위치, 형태, 규격, 게시면 수 등을 한눈에 볼 수 있도록 구성하였습니다.데이터 항목은 번호, 게시대명, 지번주소, 게시대형태, 규격, 게시면, 데이터기준일 등으로 이루어져 있으며, 관내 옥외광고물 게시대의 설치 현황을 파악하는 데 활용할 수 있습니다.게시대의 위치와 형태, 게시 가능 면수를 함께 제공함으로써 광고물 게시 가능 시설을 확인하는 데 도움이 됩니다.이 자료는 옥외광고물 게시대 현황 관리, 광고물 게시 관련 민원 안내, 시설물 관리, 현장 확인 등의 행정업무에 참고할 수 있습니다.또한 데이터기준일을 함께 제공하여 자료의 기준 시점을 명확히 확인할 수 있습니다.이는 관내 옥외광고물 게시시설의 위치와 규모를 파악하는 기초자료로서, 광고물 관리와 시설 운영 업무를 보다 체계적으로 추진하는 데 활용될 수 있습니다.
