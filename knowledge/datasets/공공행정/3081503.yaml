description_portal: '최근 들어 유흥주점, 단란주점영업 중인 가게에 대한 문의가 늘어나고 있어 해당 문의들을 바탕으로 참고용 정보를 공개합니다. 부산광역시 남구에 위치한 유흥주점, 단란주점의 업소명(가게 이름, 상호), 소재지(도로명 주소, 지번 주소), 소재지전화(가게 전화번호), 업종명(유흥, 단란)에 관한 상세한 정보를 제공합니다. 부산광역시 남구청 환경위생과에서 보유하고 있는 정보를 바탕으로 유흥주점영업, 단란주점영업 신고된 업소들에 대한 자료를 추출하여 제공합니다. 100건의 현황 자료를 제공합니다.[식품위생법 시행령 제21조]단란주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 손님이 노래를 부르는 행위가 허용되는 영업유흥주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 유흥종사자를 두거나 유흥시설을 설치할 수 있고 손님이 노래를 부르거나 춤을 추는 행위가 허용되는 영업'
