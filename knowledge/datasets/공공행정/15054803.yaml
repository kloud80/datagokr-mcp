summary_user: 광주광역시 행정동마다 인구(명)·면적(㎢)·세대수·공무원 수를 한 행씩 정리한 집계 표로, 범위는 시도 단위이고 행정단위는 읍면동이다. 분석가나 주민이 '어느 동이 인구·세대가 많고 면적 대비 인구가 몰려 있는지, 동 주민센터 공무원 1명이 맡는 주민 수는 어느 정도인지'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어서, 다른 데이터와는 시·구·동 이름으로 맞춰 붙여야 한다.
limits: 행정동 코드가 없으므로 다른 통계나 경계 데이터와 붙일 때는 동 이름을 직접 대조해야 하고, 이름이 바뀌었거나 같은 이름의 동이 있으면 어긋날 수 있다. 좌표가 없는 집계 표라 주민센터 같은 시설의 위치 정보로는 쓰지 못한다.
