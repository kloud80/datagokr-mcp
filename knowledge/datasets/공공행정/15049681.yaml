summary_user: 지방공기업의 예산규모를 직영기업·지방공사·공단 등 유형별, 상수도·하수도·공영개발 등 사업(회계)별로 나누어 연도(fyr) 단위로 담은 전국 집계 자료이다. 분석가나 지방재정 담당자가 "올해 특정 지역 상수도 직영기업 예산이 전년보다 얼마나 늘었나" 같은 질문으로 지방공기업 재무상태와 경영성과를 볼 때 쓴다. 전역 조인 키는 없으며, 시도·시군구 코드와 이름(wa_laf_cd, laf_cd 등)을 이용한 이름·코드 매핑이나 같은 기관(지방재정365) 코드 체계로만 다른 지방재정 자료와 연결한다.
description_portal: 이 데이터는 공기업별 예산규모을 직영기업, 지방공사, 공단 등 유형별로 분류해 제공합니다.예산규모 내용은 상수도, 하수도, 공영개발 등 사업별로 세분화되어 정리되고, 연도별 변화도 파악할 수 있습니다.자료 활용은 예산규모를 기초로 지방공기업의 재무상태분석, 경영성과평가 등에 쓰입니다. 또한 지방공기업 재정관리의 중요한 기초 자료로 활용됩니다.데이터의 형태는 엑셀이나 PDF형태로 내려받을 수 있습니다.해당자료는 클린아이(지방공기업 경영정보시스템)을 통해 내려받기가 가능합니다.
