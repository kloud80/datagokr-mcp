summary_user: 지방자치단체가 회계연도별로 실제 집행한 세출 결산액을 단체(시도·시군구)와 기능 분야·부문별로 나눠 담은 전국 단위 집계 자료로, 연도(fyr), 상위 단체·단체 코드와 이름, 분야·부문 코드와 이름, 지출액(ep_amt)으로 구성된다. 분석가나 주민이 "우리 시군구는 지난해 복지·환경 같은 분야에 실제로 얼마를 썼나", "같은 규모 단체끼리 분야별 지출 구성이 어떻게 다른가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 자치단체 코드·이름이나 분야 코드를 지방재정365의 다른 공시 데이터(예산·세입 등)와 맞춰 이어 쓴다.
description_portal: 지방자치단체의 기능별단체별 세출결산 지표는 지방자치단체가 일정 회계연도 동안 집행한 지출 내역을 기능(예:교육, 복지, 환경 등)과 단체(예:시도, 시군구 등)별로 분류하여 정리한 회계 결산자료를 의미합니다.해당 자료는 지방자치단체가 예산을 어떻게 집행했는지를 확인하고, 정책의 효과성과 재정 운용의 건전성을 평가하는 데 활용됩니다.기능별 세출결산은 각 정책 분야별로 예산이 얼마나 사용 및 지출되었는지를 보여주고, 단체별 세출결산은 지역별로 지출 규모와 특성을 파악할 수 있게 해줍니다.
