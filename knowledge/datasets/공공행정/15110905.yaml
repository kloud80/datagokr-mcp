description_portal: 공무원연금공단에서 관리하는 소급통산 및 사병산입 승인건수 현황 데이터입니다. 2011년부터 기준년도까지 연도별로 구분하여 제공되며, 소급통산과 사병산입 각각의 승인 건수를 확인할 수 있습니다. 소급통산은 과거 공무원 재직기간 중 공무원연금 가입이 누락된 기간을 소급하여 가입기간으로 인정받는 절차로, 연금 수급권을 확보하거나 수급 개시 시점을 앞당기는 효과가 있습니다. 사병산입은 군 복무 기간을 공무원연금 가입기간에 포함시키는 제도로, 군 복무 경력을 연금 가입기간으로 인정받는 경우에 해당합니다. 유형에 따라 연도별 승인 건수 추이 등을 확인할 수 있으며, 제도개선에 기초자료로 활용될 수 있습니다.
