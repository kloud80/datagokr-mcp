description_portal: 출입국외국인정책본부는 재한외국인이 우리 사회 구성원으로서 살아가는 데 필요한 기본 소양(한국어와 한국문화, 한국사회이해)을 함양할 수 있는 기회를 제공하는 사회통합프로그램을 운영하고 있습니다.해당 데이터는 "23~"25 연도별 법무부 사회통합프로그램 평가별 응시자 및 합격자 수 데이터입니다.1, 2, 3단계 평가, 중간평가, 영주용 종합평가, 귀화용 종합평가의 총 6단계 평가로, 1, 2, 3단계 연도별 대상자 및 합격자 수를 포함하고 있습니다.중간평가, 영주용 종합평가, 귀화용 종합평가는 각각 PBT, CBT의 응시자 및 합격자 수를 포함하고 있습니다.*"22년부터 컴퓨터 기반 시험(CBT)  평가 방식 운영, "25년부터 CBT 중간평가 실시, 영주용 CBT 종합평가는 미실시해당 통계는 데이터 제공 신청에 의한 수시 데이터 입니다.법무부 출입국외국인정책본부 이민통합과에서 취합한 자료를 바탕으로 담당자가 수기로 입력한 자료로 DB와 Table이 존재하지 않는 점 양해 부탁드리며,법무부 출입국외국인정책본부 홈페이지 - 빅데이터 통계- 통계연보 메뉴를 통해서 연도별 사회통합 프로그램 운영기관 및 참여자 현황, 지역별 이민자별 사회통합프로그램 참여 현황 등을 확인하실 수 있습니다.(매년 6월 말 이전년도 통계 연보 업로드)https://www.immigration.go.kr/immigration/1570/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjglMkY1OTY0NjQlMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmlzVmlld01pbmUlM0RmYWxzZSUyNnBhZ2UlM0QxJTI2YmJzT3BlbldyZFNlcSUzRCUyNnNyY2hDb2x1bW4lM0QlMjZzcmNoV3JkJTNEJTI2
