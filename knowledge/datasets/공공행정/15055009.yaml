description_portal: '인천광역시가 제공하는 주택점유형태별 가구 통계 공공데이터는 시 지역의 가구를 거처의 종류별(단독주택, 아파트 등) 및 **점유 형태별(자가, 전세, 월세 등)**로 세분하여 집계한 통계 자료입니다. 이 데이터는 지역 주거 환경의 실태, 주택 시장 구조, 주거 복지 수요 등을 파악하고, 주거 안정 정책, 주택 공급 계획, 임대차 시장 관리 등의 기초 자료로 활용됩니다.<주요 구성 항목은 다음과 같습니다>거처의 종류별 분류: 가구가 거주하는 주택의 종류를 주택(총계), 단독주택, 아파트, 연립주택, 다세대주택, 비거주 건물 내 주택 등으로 구분합니다.'
