description_portal: '[SGIS오픈플랫폼] 총조사 시각화 지도 서비스 항목 정보입니다.항목대분류, 중분류, 소분류 정보 및 조사항목별 차트, 설명, 출처, 단위 정보 등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 총조사시각화지도  국가데이터처에서 실시하는 총조사(인구주택총조사, 농림어업총조사) 결과를 지도와 차트 등으로 시각화하여, 통계결과를 한눈에 확인할 수 있는 대시보드형 서비스입'
