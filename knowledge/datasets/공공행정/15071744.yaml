summary_user: 서울시 인터넷컴퓨터게임시설제공업(PC방 등) 업소를 관리번호(MGTNO) 단위로 한 건씩 담은 인허가 원장으로, 인허가·폐업·휴업 일자와 영업상태, 지번·도로명주소와 좌표, 건물 층수·시설면적, 비상구·환기·조명 같은 시설 항목을 포함한다. 상권 분석가나 창업 준비자가 '특정 지역에서 PC방이 언제 얼마나 문을 열고 닫았는가', '지금 영업 중인 업소가 어디에 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 업소명 매핑으로 이어야 하며, 같은 원천(LOCALDATA 인허가)을 공유하는 다른 업종 인허가 원장과 함께 점포 이력 분석에 쓴다.
description_portal: 서울시 인터넷컴퓨터게임시설제공업 인허가 정보는 주로 PC방 등의 인허가·영업 현황과 시설·안전 조건을 관리하는 데이터입니다. 관리번호를 중심으로 인허가일자, 취소·폐업·휴업·재개업일자, 영업상태 및 상세영업상태로 업소 이력을 추적하며, 지번·도로명주소, 우편번호, 좌표(X,Y)로 위치와 입지를 파악합니다. 문화체육업종명, 문화사업자구분명, 지역구분명, 주변환경명은 업종 특성과 입지 특성을 보여주고, 총층수·지상·지하층수, 건물용도명, 시설면적은 건물·시설 규모를 나타냅니다. 통로너비, 조명조도, 비상계단·비상구·자동환기·소방시설 여부, 노래방실·청소년실 관련 항목, 방음·조명·음향·편의시설 여부, 게임기수, 제공게임물명 등은 안전·위생·이용환경 기준 충족 여부를 확인하는 데 활용됩니다. 최종·최초등록시점과 데이터갱신정보는 관리 이력과 최신성을 보여줍니다.
