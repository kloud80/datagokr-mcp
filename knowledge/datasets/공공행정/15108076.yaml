summary_user: 법정동·통계년월 기준으로 행정동 통·반 단위까지 내려가 총 출생등록자수와 남녀별 출생등록자수를 담는 주민등록 집계 데이터로, 범위는 전국이며 검증 호출에서는 0행이 수신되었다. 지자체 담당자나 분석가가 특정 동네의 통·반별로 한 달 동안 아이가 몇 명 출생등록되었고 성비는 어떤지 확인하는 데 쓴다. 법정동코드(stdgCd)와 행정기관코드(admmCd)가 있어 같은 기관의 주민등록 인구·세대 통계와 코드로 이어 쓰지만, 실측상 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
description_portal: 법정기관과 통계년월을 기준으로 시도명, 시군구명, 법정동명, 리명, 행정기관코드, 행정동명, 통, 반, 총출생자수, 남자출생자수, 여자출생자수을 조회하기 위한 서비스입니다.주민등록 데이터는 통계의 기본이 되는 인구 데이터로써, 주민의 신고에 따라 주민등록법 제6조의 규정에 근거하여 개인·세대별 주민등록표를 기반으로 매월 말일 집계하고 있으며 거주자, 거주불명자, 재외국민을 포함하고 있습니다.활용가치가 큰 주민등록 데이터의 제공 단위를 통반 단위, 도로명 등으로 확대하여 오픈API 방식으로 제공함으로써, 주민등록 데이터를 활용한 국가정책수립, 민간·공공서비스 개발, 창업 지원 및 일자리 창출 등 다양한 분야의 디지털 전환 및 국민 삶의 질 향상에 기여할 목적으로 작성되었습니다.
