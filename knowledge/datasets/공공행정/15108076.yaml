services:
  - op: /selectStdgSexdBrthReg
    name: 법정동별(행정동 통반단위)성별 출생등록자수 목록 조회
    endpoint: https://apis.data.go.kr/1741000/stdgSexdBrthReg/selectStdgSexdBrthReg
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: stdgCd
        required: true
        example: '1111014000'
        desc: 법정동코드 자료확인(행정안전부 홈페이지  https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardList.do?bbsId=BBSMSTR_000000000052 업무안내 > 지방자치분권실 > 주민등록,인감,행정사 > 주민등록,인감,행정사)
      - name: srchFrYm
        required: true
        example: '202210'
        desc: 조회시작년월. 2022.10부터 조회가능
      - name: srchToYm
        required: true
        example: '202210'
        desc: 조회종료년월. 3개월 기간내 설정
      - name: lv
        required: false
        example: '4'
        desc: '조회결과구분. 광역시도 단위 : 1, 시군구 단위 : 2, 읍면동 단위 : 3, 읍면동 통반 단위 : 4, 단일 시도 단위 : 5, 단일 시군구 단위 : 6, 단일 리동 단위 : 7 (기본값 : 4)'
      - name: type
        required: false
        example: XML
        desc: '타입. XML, JSON(기본값 : XML)'
      - name: numOfRows
        required: false
        example: '10'
        desc: '페이지 크기. 페이지당 목록 수(1~100)(기본값 : 10)'
      - name: pageNo
        required: false
        example: '1'
        desc: '페이지 번호. 기본값 : 1'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
