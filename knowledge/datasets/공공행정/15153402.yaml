description_portal: '세종특별자치시시설관리공단은 자연장지 이용 과정에서 발생하는 각종 접수 내역과 추가 사용·변경 이력을 투명하게 공개하고, 자연장 행정서비스의 정확성과 신뢰성을 높이기 위해 자연장 접수 이력 데이터를 공공데이터로 제공하고 있습니다.본 데이터는 자연장 계약 이후 발생하는 추가 접수, 변경, 추가 비용 부과 등 세부 처리 내역을 체계적으로 관리하기 위한 정보로 구성되어 있습니다.■ 데이터 컬럼 구성 추가 접수 및 변경 관련 정보 - 추가접수일자: 자연장 추가 사용을 접수한 날짜  - 추가접수순번: 추가 접수 건별 순번 - 변경여부: 기존 계약 사항 변경 여부(예: Y/N) - 변경시작일: 변경된 사용 기간의 시작일 - 변경종료일: 변경된 사용 기간의 종료일 - 추가사용일: 추가로 사용된 일수 - 일별추가사용료: 1일 기준 추가 사용료 - 최종추가사용료: 총 추가 사용료 - 추가임대료: 추가 청구되는 임대료 - 추가관리비: 추가 청구되는 관리비 - 자연장계약일자: 최초 자연장 계약 체결일 - 자연장계약순번: 해당 계약의 고유 순번(식별자) - 자연장 위치 및 구분 정보 - 자연장구분: 자연장 유형(잔디장, 수목장 도심형, 수목장 산림형 등) - 자연장구역구분: 해당 자연장이 속한 구역 정보 - 사용시작일: 자연장 사용 시작일 - 사용종료일: 자연장 사용 종료일 - 관내관외구분: 주소지 기준 관내/관외 구분 - 자연장비용: 자연장 이용 시 부과되는 총 비용 - 자연장임대료: 자연장 사용에 대한 임대료 - 자연장관리비: 자연장 유지·관리 비용■ 데이터 제공 목적자연장 접수 이력 데이터는 다음과 같은 목적을 위해 제공됩니다. - 자연장지 접수·변경·추가 사용 이력의 투명한 공개 - 자연장 비용 산정 구조(임대료·관리비·추가 사용료)의 명확성 강화 - 자연장 운영의 효율성 제고 및 수요 예측 지원 - 사용 기간·비용·구역별 통계를 통한 장사행정 정책 기반마련'
