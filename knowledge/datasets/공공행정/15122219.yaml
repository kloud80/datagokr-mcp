summary_user: 충청남도 공유재산통합관리시스템의 주제도·용도구역·사용자 설정·통계·시스템 설정 등 관리 항목을 묶은 파일 데이터(zip, 약 4MB)로, 확인된 필드는 사용자 아이디·사용자 이름·로그 경로·생성 날짜처럼 시스템 운영 기록 성격이다. 공유재산 시스템을 점검하는 담당자나 분석가가 '이 시스템에 어떤 사용자가 언제 어떤 기록을 남겼나'처럼 시스템 구성과 이용 이력을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름 매핑이나 같은 기관(충청남도) 기준으로만 이어 쓴다.
description_portal: 충청남도 공유재산통합관리시스템 데이터는 도내 공유재산을 효율적으로 관리하고 활용하기 위한 종합 행정정보 자료이다. 본 데이터에는 도로용도구역을 비롯한 주제도 정보, 용도구역 정보, 사용자 설정, 통계, 시스템 설정 등 다양한 관리 항목이 포함되어 있다. 이를 통해 공유재산의 위치와 용도, 관리 현황을 공간정보 기반으로 종합적으로 파악할 수 있으며, 재산 관리 업무의 효율성 향상과 정책 의사결정을 지원한다. 또한 통계 및 설정 정보를 활용하여 시스템 운영의 안정성을 확보하고, 공유재산의 체계적 관리와 활용 계획 수립을 위한 기초자료로 활용된다.
