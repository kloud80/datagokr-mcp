description_portal: '경기도 하남시 세입세출예산 운영과 관련된 정보에 대한 세부 데이터로 분야별(일반공공행정, 공공질서및안전, 교육, 문화및관광, 환경, 사회복지 , 보건, 국토및지역개발 등) 예산액, 지출액의 항목을 제공합니다. 지방재정의 계획수립 및 운용 현황을 파악하여, 지방재정의 건전하고 투명한 운용과 합리적·효율적인 관리가 이루어질 수 있도록 기초자료를 제공하는 것을 목적으로 합니다.실제 예산이 어디에, 얼마나 집행되고 있는지 공개하여, 재정의 투명성과 재정운용의 건전성을 확인하고자 하는 공공자료입니다. 해당 데이터는 연간 단위로 업데이트되어 최신 재정 현황을 반영합니다. ※ 하남시 대표 홈페이지 매뉴(홈페이지 > 정보공개 > 예산결산 > 예산현황)에서 연도별 예산 현황을 pdf파일로 확인하실 수 있습니다.   ※ 관련링크URL: https://www.hanam.go.kr/www/selectBbsNttList.do?bbsNo=7&key=42'
