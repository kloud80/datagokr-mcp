summary_user: 전화권유판매 수신거부 의사를 무시하고 전화한 업체에 대한 신고를 신고 한 건 단위로 담는 건별 처리 현황 데이터로, 범위는 전국입니다. 각 건에는 기준년월, 신고관리번호, 제목, 상호명, 처리상태, 신고등록·업체응답·지자체응답 일시가 들어 있습니다. 소비자나 분석가가 특정 상호에 수신거부 위반 신고가 접수됐는지, 신고가 업체 응답과 지자체 처리까지 얼마나 걸려 어디까지 진행됐는지 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어서, 전화권유판매업자 등록 정보 같은 특수판매 데이터와는 상호명을 맞춰 보는 방식으로만 이어 쓴다.
