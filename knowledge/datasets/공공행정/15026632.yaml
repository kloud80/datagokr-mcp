summary_user: 충청북도 시군별로 시·군·일반구·읍·면·동 수와 통·리·반 수, 면적, 세대수, 인구를 한 표에 정리한 시군구 단위 집계 자료다(포털 설명 기준 3시 8군, 16읍 86면 51동, 세대수 797,797, 인구 1,596,502). 충북 각 시군의 읍면동·마을 구성과 인구·세대 규모를 비교하려는 분석가나 주민, 행정 담당자가 '이 군에는 리와 반이 몇 개이고 세대수는 얼마인가' 같은 질문에 쓴다. 실측 컬럼에 행정구역코드 같은 전역 조인 키가 없어 다른 데이터와 붙이려면 시군 이름을 행정구역코드로 직접 매핑해야 한다.
description_portal: '충청북도 행정구역 현황 :  충청북도에 소재하고 있는 행정구역 현황에 대해 각 시군별로 조사한 데이터를 담은 엑셀자료 입니다. 범례는 구분 시 군 일반 구 읍 면 동 통 리 반 면적 세대수 인구로 구성되어 있고 구체적인 내용으로는 3시, 8군, 4구, 16읍, 86면, 51동, 마을(2044통, 3130리, 20962반), 7406면적, 797797세대수, 1596502인구 현황이 표시되어 있습니다. 이 중에서 마을(통리반), 세대수, 인구 등은 행정여건에 따라 일부 변동이 있을 수 있고, 정확한 자료가 등재되도록 지속 관리 예정입니다.'
