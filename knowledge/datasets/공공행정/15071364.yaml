summary_user: 서울시에서 계량기 수입업 허가를 받은 업체를 사업장 한 곳당 한 행으로 담은 인허가 원장이며, 인허가일·폐업일·휴업 기간·재개업일과 영업상태, 주소·좌표·전화번호를 함께 담는다. 행정기관이나 업계 분석가가 '서울에서 지금 영업 중인 계량기 수입업체는 어디이고 언제 폐업·휴업했는가'를 확인하거나 현장 점검 대상을 추릴 때 쓴다. 전역 조인 키는 없어 사업장명·주소 매핑이나 같은 기관 코드(개방자치단체코드, 관리번호)로만 이어 쓰며, LOCALDATA 전국 인허가 자료와 원천이 같아 다른 업종 인허가 원장과 함께 상권·점포 이력 분석에 쓴다.
description_portal: 서울시 계량기수입업 인허가 정보는 서울시에서 계량기 수입업을 허가받은 업체들의 기본 현황과 영업 상태를 확인하기 위한 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태명과 상세영업상태명 등을 통해 해당 업체가 현재 영업 중인지, 휴업 또는 폐업 상태인지, 언제부터 어떤 변동 이력이 있었는지 파악할 수 있습니다. 사업장명, 지번주소·도로명주소, 소재지우편번호, 도로명우편번호, 좌표정보, 소재지면적 등은 업체의 위치와 부지 규모를 알려주어 지도 기반 분석, 현장 점검, 민원 처리 등에 활용될 수 있습니다. 전화번호, 사무소전화번호, 사업장전화번호는 본사·사무소와 실제 사업장 연락처를 구분해 제공함으로써 행정기관, 소비자, 관련 업계가 쉽게 연락할 수 있게 합니다. 업태구분명은 계량기수입업이 어떤 업종 범주로 관리되는지를 보여주며, 최종수정일자, 데이터갱신구분, 데이터갱신일자는 정보의 최신성과 관리 이력을 확인하는 데 중요해 인허가 관리, 계량기 유통 안전 관리, 관련 정책 수립의 기초 자료로 활용될 수 있습니다.
