summary_user: 경기도 파주시 시의원 한 명당 한 행으로 이름, 직위(의장·부의장·위원장 등), 소속 정당, 선거구명과 선거구역, 이메일, 경력을 담은 소규모 명단 파일(CSV 약 4KB)이다. 주민이 우리 동네 선거구를 맡은 시의원이 누구이고 어느 정당 소속이며 어떤 경력을 가졌는지, 민원을 어디로 보내면 되는지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 선거구명·선거구역의 읍면동 이름이나 의원 이름을 문자열로 맞춰 잇거나 같은 파주시 자료끼리 연결해야 한다.
description_portal: 경기도 파주시 시민들의 지역 대표자인 시의원의 정보를 쉽게 확인할 수 있도록 시의원의 이름, 의장, 부의장, 위원장 등의 직책, 시의원이 속한 정당, 해당 의원이 어떤 지역 주민들을 대표하여 조례를 제정하고 예산을 심의하는지 명확한 책임 범위를 보여주는 선거구명과 선거구역, 시민들이 지역 현안이나 민원을 의원에게 직접 전달할 수 있는 소통 창구인 이메일주소, 주요 이력이나 활동 사항을 포함하여 주민들이 시의원의 과거 전문 경험과 역량을 검증하여 의정 활동의 신뢰도를 평가하는 객관적 지표인 경력내용 등으로 구성되어 있습니다. 본 데이터셋은 우리 동네 의원 찾기 서비스 개발, 주민 참여형 민원 및 정책 제안 플랫폼, 의원 역량 및 전문성 분석 보고서, 선거 및 정치 지형 시각화 지도 등에 활용될 수 있습니다.
