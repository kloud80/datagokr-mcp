summary_user: JDC 소속 직간접 감정노동자가 날마다 답한 설문 응답을 응답자·응답일 단위로 담은 건별 원천 파일(CSV, 약 66만 바이트)로, 그날 한 업무, 스트레스를 가장 많이 받은 업무·시간대·원인, 업무량·업무 스트레스 평가, 전날 음주 여부, 육체·정신 컨디션을 담는다. 조직 관리자나 연구자가 '업무량이 많다고 답한 날에 정신 컨디션이 더 나빴는가', '어느 시간대·업무에서 스트레스가 몰리는가'를 따져 근무환경 개선이나 정신건강 지원 설계에 쓴다. 응답자 아이디(jdc_health_participant_id)가 조인 키라서 같은 응답자의 날짜별 응답을 묶거나, 같은 아이디를 쓰는 JDC 건강 관련 다른 자료와 이어 볼 수 있다.
description_portal: 이 데이터는 2021년 12월 4일 기준으로 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC) 내 직간접 감정노동자들을 대상으로 실시된 일일 설문조사 결과를 정리한 자료입니다. 설문은 감정노동자의 업무 특성과 일상적인 스트레스 수준을 파악하기 위한 목적으로 수행되었으며, 데이터 항목은 응답자 식별을 위한 아이디, 응답 일시, "오늘 어떤 업무를 했나요", "오늘 업무 중 스트레스를 가장 많이 받은 업무는 무엇인가요", "오늘 전체 업무량을 평가해주세요", "오늘 정신적인 컨디션은 어떠셨습니까" 등으로 구성되어 있습니다. 업무 내용은 개방형 응답으로 입력되며, 업무량 및 스트레스 수준, 정신적 컨디션 등의 평가는 '보통', '조금 많다', '많다', '매우 힘들다' 등 다단계 선택지로 구분되어 정성적 요소를 수치화할 수 있도록 설계되어 있습니다. 이 데이터는 감정노동자의 일별 심리 상태 및 업무 경험을 종합적으로 분석할 수 있는 기초 자료로 활용되며, 근무환경 개선, 조직 내 피로도 관리, 정신건강 지원 프로그램 설계 등 다양한 조직관리 및 복지 정책 수립에 활용될 수 있습니다.
