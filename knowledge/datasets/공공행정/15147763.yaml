description_portal: 서울특별시 중랑구 구의회의 회의록 데이터입니다. 중랑구의회 홈페이지의 회의록 메뉴를 통해 해당 데이터를 제공하고 있습니다. 또한, 회의록 원본 자료를 다운받으실 수 있고 좌측의 단순검색 메뉴를 통해 회기별, 회의별, 연도별 검색도 가능합니다. 상세검색을 통해서는 대수, 회기, 위원회, 의원명, 검색어를 통해서 회의록을 찾아볼 수 있습니다. 최근회의록 메뉴에서는 번호, 대수, 회기, 회의명, 회차, 회의일자, 원본회의록의 항목을 지니고 있습니다. 자세한 사항은 구의회 홈페이지를 통해 확인하여 주시기 바랍니다. 감사합니다.
