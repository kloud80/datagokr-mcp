description_portal: 서울특별시 서초구 LED전자게시대는 도시미관에 어울리는 심플한 디자인과 안정적인 통합시스템을 구축한 디지털 방식 매체로 중·소상공인에게 효과적인 광고 기회와 서초구민에게 구정 생활 문화 정보를 제공하고자 합니다. 관내 설치장소는 총 7군데입니다. 강남역(7번출구 인근), 교대역(5번출구 인근), 양재역(2번출구 인근), 이수역(6번출구 인근), 사당역(2번출구 인근), 고속터미널사거리, 양재트럭터미널삼거리(코스트코)입니다. 매일 06~24시(단, 고속터미널사거리는 06~22시)에 광고를 표출하고 있습니다.디지털 사이니지 광고시대에 걸맞는 LED전자게시대 설치로 미래형 중심도시의 이미지 제고에 기여하고,  기존 현수막게시대는 광고기회가 제한되고 광고 포화상태로 인한 불법 현수막이 난립되어 도시미관 훼손, 보행자 안전위협 등이 발생하여 LED전자게시대 도입을 통해 개선되는 효과가 있습니다. 관내 소상공인에게 보다 효과적이고 고품질의 광고기회를 제공하여 상권 활성화와 지역 일자리 창출에 기여할것으로 기대됩니다. 이 중 80%는 일반 상업광고, 20%는 공익광고로 구성되어 균형적인 정보 전달을 도모하고 있습니다.
