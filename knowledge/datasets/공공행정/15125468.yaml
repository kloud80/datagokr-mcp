summary_user: 공정거래위원회 가맹사업 정보 중 브랜드 목록의 변경 이력을 기준년도·브랜드관리번호별로 담는 전국 단위 API로, 이력일련번호마다 브랜드명·가맹본부 대표자명·업종 대·중분류·주요상품·가맹사업 개시일자를 건별로 제공한다. 가맹 창업 예정자나 분석가가 "이 브랜드가 그동안 이름·대표자·업종을 바꿨는가, 이 가맹본부를 믿어도 되나"를 확인하는 데 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)가 조인 키로 확인돼 다른 가맹사업·특수판매·상조·기업집단 등록 정보와 사업자 단위로 이어 쓰고, 브랜드관리번호·가맹본부관리번호로 같은 가맹정보 계열 서비스와 연결한다.
limits: 이 서비스는 변경 이력 조회용이며 가맹점 수·매출 같은 집계나 결정문·제재 같은 사건 단위 정보는 담지 않는다. 호출 시 기준년도와 브랜드관리번호를 조건으로 주어야 하고, 개발계정은 일 10,000회로 제한된다.
