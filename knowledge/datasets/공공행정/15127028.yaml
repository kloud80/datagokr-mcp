summary_user: 전화권유판매 수신거부 신고에 대해 해명 요청을 받은 업체의 처리 현황을 신고 건별로 담으며, 기준년월·신고관리일련번호·제목·상호명·처리상태·신고등록일시·업체응답일시로 구성된 전국 범위 데이터다. 소비자가 수신거부 후에도 전화가 온 업체가 해명 요청에 응답했는지, 처리 단계가 어디까지 왔는지 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 특수판매(전화권유판매) 사업자 등록 데이터와는 상호명 매칭으로만 이어 쓴다.
limits: 사업자등록번호·법인등록번호가 없어 다른 공정위 등록·공시 데이터와 정확히 연결할 수 없고, 상호명 매칭은 동명 업체 오인 위험이 있다. 공간 정보가 없어 지역별 분석에는 쓸 수 없다.
