description_portal: '- 행정안전부 지정 도내 착한가격 업소현황 소개(업소명, 주요품목, 가격, 주소 등) 에 관한 데이터를 조회하실 수 있습니다.- 전라남도에서는 물가 안정과 지역경제 활성화를 위해 착한가격업소를 지정하고 다양한 지원 정책을 추진하고 있습니다. 이러한 업소는 저렴한 가격과 양질의 서비스를 제공하며, 각 시·군별로 다양한 혜택과 이벤트를 운영하고 있습니다.- 전라남도의 착한가격업소는 지역 주민들에게 경제적 부담을 줄이고, 지역경제를 활성화하는 데 기여하고 있습니다. 각 시·군별로 다양한 혜택과 이벤트를 운영하고 있으니, 관심 있는 분들은 해당 지역의 공식 웹사이트나 행정안전부 착한가격업소 누리집을 통해 자세한 정보를 확인하시기 바랍니다.'
