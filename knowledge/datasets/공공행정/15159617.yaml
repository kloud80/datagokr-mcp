description_portal: 해당 자료는 고용노동부 소속 직원(공무원)의 간호사 자격증 보유현황을 나타낸 자료입니다.이 자료는 전자인사관리시스템(표준인사시스템)에 등록된 자료를 기반으로 만들어졌습니다. 간호사 자격증에 대해서는 보유현황은 인사 관련 규정에 따라 의무적으로 등록하여야 하는 것이 아니며, 직원 스스로 보유 자격증을 등록한 것입니다. 따라서 해당 데이터는 고용노동부 소속 직원(공무원)한 것이며 해당자격증의 보유 여부에 대하여 주기적으로 조사한 것이 아니므로 실제 간호사 자격증 보유현황과는 다를 수 있습니다.
