summary_user: 전북특별자치도 남원시의 읍·면·동 행정복지센터를 한 행에 하나씩 담은 시설 목록으로, 읍면동명·주소·우편번호·전화번호·팩스번호를 담는다(약 2KB 크기의 CSV 파일). 주민이 "우리 면사무소 주소와 전화번호가 무엇인가"를 확인하거나, 분석가가 남원시 민원 거점 위치를 정리할 때 쓴다. 전역 조인 키가 없어 읍면동명을 행정구역 코드표에 이름으로 맞추거나 주소를 지오코딩해 다른 시설·인구 자료와 잇는다.
description_portal: 1. 데이터 주요 내용 및 활용 맥락본 데이터는 전북특별자치도 남원시의 모든 행정복지센터(읍사무소, 면사무소, 동사무소)에 대한 포괄적인 기본 정보를 제공합니다. 주민들이 주민등록등본, 인감증명서 등 다양한 서류발급과 민원 서비스를 위해 방문해야 하는 행정기관의 정확한 위치와 연락처 정보를 상세히 담고 있습니다. 더불어 찾아가는 복지 서비스와 주민자치 활동의 중심지 역할을 하는 각 센터의 접근 정보를 제공함으로써, 지역주민들이 더욱 손쉽게 행정 서비스를 이용할 수 있도록 지원합니다.2. 데이터 항목명- 읍면동명- 주소- 우편번호- 전화번호- 팩스번호3. 기대 효과이 데이터는 시민들의 행정 서비스 접근성을 획기적으로 개선하고, 민원 처리의 효율성을 크게 높일 것으로 예상됩니다. 나아가 지역 내 복지 서비스와 주민자치 활동 참여를 촉진함으로써 지역 공동체의 발전에 실질적으로 기여할 것으로 기대됩니다.
