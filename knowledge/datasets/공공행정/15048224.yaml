description_portal: '광주광역시 광산구에 소재한 공유재산 중 토지에 대한 현황 정보를 제공합니다. 해당 데이터는 각 토지의 지번주소와 도로명주소를 비롯해, 해당 토지가 취득된 일자, 면적 등 주요 속성이 포함되어 있습니다. 이를 통해 광산구 내 공공에서 보유하고 있는 토지 자산의 분포와 규모, 활용 가능성 등을 파악할 수 있으며, 행정계획 수립, 도시개발, 공공자산 관리 등의 다양한 분야에서 활용이 가능합니다. 또한 공유재산의 효율적인 관리와 활용을 위한 기초 자료로 활용되며, 행정업무뿐만 아니라 정책 수립 및 민간의 공공데이터 활용에도 기여할 수 있습니다. 특히 토지 규모와 위치에 대한 정보를 통해 지역 개발, 도시계획, 공공시설 배치 등에 필요한 분석 자료로도 유용하게 쓰일 수 있습니다.※ 면적 단위: ㎡'
