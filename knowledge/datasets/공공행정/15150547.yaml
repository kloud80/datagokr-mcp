summary_user: 서울특별시 강북구의회에 제출된 조례안·예산안·동의안·결의안 등 의안을 한 건씩 담은 파일(csv, 약 47만 바이트)로, 의안번호·의안명·발의자와 발의자 구분·발의일·처리 상태·소관 위원회·결과·공포일과 공포번호를 담는다. 주민이나 지방의회 연구자가 '강북구의회에서 최근 어떤 조례안이 누구 발의로 올라와 어느 위원회를 거쳐 가결·공포됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 자치구 의회 의안자료와는 의회 코드·의안명 같은 이름·코드 매핑으로만 맞춰 이어 쓴다.
description_portal: 지방의회의 의결을 필요로 하는 많은 사항 즉, 안건 중에서 특별한 형식적 요건을 구비하여 의원이나 지방자치단체의장이 제출하는 것을 “의안”이라 합니다.의안의 종류에는 조례안, 예산안, 결산, 동의안, 승인안, 결의안, 건의안, 규칙안 등이 있습니다. 의안 심의 절차는 의안의 제출, 의안접수, 의안의 배부, 위원회 회부, 위원회 심사, 위원회 심사결과 보고, 본의회 심의, 지장자치단체장에게 의안 이송, 공포의 순서를 서울특별시 강북구 구의회 의안자료는 고유번호,의회 코드,의안번호,의안 코드,발의자,발의자 구분코드,발의일,상태,의안명,공포일,공포번호,위원회명,결과로 구성되어 있으며, 구의회 누리집에 데이터입니다.
