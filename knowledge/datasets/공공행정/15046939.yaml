description_portal: '○ 통계개요* 통계명 : 인구추이(등록인구)* 통계종류 : 서울시 인구추이(주민등록인구)를 제공하는 일반ㆍ보고통계* 작성목적 : 서울지역 인구의 변동상황 및 연령구조를 파악하여 제반 행정사항의기초자료를 제공하는 것을 목적으로 함* 조사체계 : 행정자치부·법무부 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 등록인구 및 등록외국인 추이(인구수 및 인구밀도,고령인구 등) 현황○ 용어설명* 등록인구 = 주민등록인구 + 등록외국인* 주민등록인구는 "거주자", "거주불명자", "재외국민"이 포함- 거주자: 거주지가 분명한 사람(재외국민 제외)- 거주불명자 : 거주사실이 불분명하여 거주불명으로 등록된 사람(2010년 1월부터 통계에 포함)- 재외국민: 외국의 영주권을 취득한(영주목적으로 외국거주 포함) 대한민국 국민으로주민등록을 한 사람(2015년 1월부터 통계에 포함)* 등록외국인은 출입국관리법에 의해 90일 초과 장기체류자 중에서 작성기준일 현재외국인 등록표에 등재된 자의 집계결과로서 실제로 국내에 거주하고 있는외국인 수와는 차이가 있을 수 있음'
