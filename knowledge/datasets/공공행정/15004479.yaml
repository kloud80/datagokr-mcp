summary_user: 순천시 안의 경로당을 한 곳씩 담은 시설 목록으로, 관할 읍면동·경로당명·리·번지 주소·연락처·건축연도·건축물 면적·부지면적을 담는다(포털 설명 기준 687개소). 복지 담당자나 분석가가 읍면동별 경로당 수와 노후도·규모를 비교해 "어느 동네 경로당이 오래되고 좁은가"를 확인하는 데 쓴다. 전역 조인 키가 없어 읍면동 이름을 기준으로 인구·노인 인구 통계와 이름 매칭해 이어 쓴다.
