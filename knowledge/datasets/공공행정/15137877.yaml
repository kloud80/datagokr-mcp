description_portal: 경영평가는 정부가 매년 공공기관의 경영노력과 성과를 공정하고 객관적으로 평가하는 제도입니다.현재 예금보험공사는 기금관리형에 속해 있습니다. 기본적으로 경영평가는 크게 경영관리와 주요사업으로 나뉩니다. 예금보험공사의 주요사업 지표는 4가지로 예금보험기금의 조성 및 안정적 관리 사업, 금융계약자보호서비스 제공 사업, 자금지원 사후관리 사업, 주요사업 계량지표 구성의 적합성 및 목표의 도전성으로 구성되어 있습니다. 종합등급은 상대평과 절대평가로 나뉘며, 상대평가 같은 경우 비슷한 유형의 기관들과 묶여서 평가 받게 됩니다.
