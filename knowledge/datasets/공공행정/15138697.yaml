summary_user: 지방자치단체별 기관운영업무추진비의 당초예산 편성액을 회계연도 단위로 담는 집계 데이터로, 전체회계(일반·기타특별회계)를 대상으로 단체장·부단체장·실국장 및 읍면동장 등 기타 편성액으로 나눠 전국 자치단체를 다룬다. 주민이나 분석가가 "우리 구청장 업무추진비 예산은 다른 자치단체와 비교해 얼마나 편성됐나"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 자치단체 코드(laf_cd)나 자치단체명으로 같은 지방재정365의 다른 세출·재정 공시 데이터와 맞춰 쓴다.
description_portal: 기관운영업무추진비는 지방자치단체의 장(시장, 군수, 구청장 등)이나 기관의 실·국·과장 등의 기관운영과 관련된 공식적인 업무 수행을 지원하기 위해 편성되는 예산항목으로 지방자치단체 예산편성 운영기준 제4조에 따른 기준병비에 의해 편성되고, 주로 간담회비, 회의비 등의 형식으로 사용됩니다.기관운영업무추진비(2020년 이후)정보는 당초예산 편성내역을 자치단체 전체회계(일반회계, 기타특별회계)를 대상으로 단체장예산편성액, 부단체장예산편성액, 실국장 및 읍면동장등 기타 편성액 정보로 분류하여 제공합니다.
