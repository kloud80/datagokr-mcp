description_portal: 원주시의회 홈페이지에서 제공하는 의회 회의록입니다. 회의록은 각각 본회의, 상임위원회, 예산결산특별위원회, 행정사무감사, 행정사무조사, 특별위원회로 분류되어 있습니다. 모든 회의록은 제1대 의회(1995년 1월 6일)부터 제9대 의회(2026년 6월 30일)까지 기록되어 있습니다. 회의별 회차, 개최일자, 출석의원, 안건 내용, 발언 요지 등 의정활동 전반이 포함되어 있으며, 지방의회의 입법, 예산심의, 감시 기능 수행 과정이 상세히 담겨 있습니다. 이 데이터는 시민의 알권리 보장, 지방행정 감시, 정책 연구 및 의회 운영 분석 등에 활용될 수 있습니다.
