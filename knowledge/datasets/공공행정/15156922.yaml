summary_user: 한국중부발전 내부에서 등록·결재된 문서를 한 건씩 담은 기록물관리대장으로, 등록구분(내부결재·대내발송·대외발송), 문서번호, 제목, 결재자 직위, 수신·발신자, 생산일자, 보존기간을 담는다. 기록관리·감사 담당자나 분석가가 '이 기관이 어떤 문서를 누구 결재로 생산했고 얼마나 보존하는가'를 확인하거나 특정 문서의 이력을 추적할 때 쓴다. 다른 데이터와 이을 전역 조인 키는 없어, 문서번호·제목 같은 이름 매칭이나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 한국중부발전 기관 내부의 문서 등록 및 결재 현황을 정리한 자료로, 문서의 등록구분, 문서번호, 제목, 결재자 직위, 수신 또는 발신자, 생산일자, 보존기간 등의 정보를 포함합니다. 내부결재, 대내발송, 대외발송 등 문서유형별 처리 흐름을 구분하여 행정 문서의 생성과 전달 과정을 체계적으로 관리할 수 있습니다. 이를 통해 부서 간 문서 소통 구조, 결재 단계, 기록물의 생산 및 보존주기 등을 파악할 수 있으며, 공공기관의 기록관리 체계 개선, 행정 투명성 강화, 문서이력 추적 및 감사 대응 등의 목적에 활용 가능합니다.
