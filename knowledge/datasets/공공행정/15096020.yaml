summary_user: 충청남도 계룡시 관내 이발·미용·외식 등 개인서비스 품목별 가격을 품목명, 품목 기준, 조사 연월·조사 시기, 가격 단위로 담은 조사 자료를 API로 조회한다. 계룡시 주민이나 창업을 검토하는 사업자가 '계룡시에서 커트 한 번이나 김치찌개 한 그릇 값은 얼마이고, 조사 시기별로 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시군 물가정보나 착한가격업소 자료와는 품목명을 맞추거나 같은 기관 기준으로만 연결한다.
description_portal: 충청남도 계룡시의 '지역물가정보(개인서비스요금) API' 데이터는 관내에서 제공되는 이발, 미용, 외식 등 개인 서비스 항목의 가격 동향을 정기적으로 조사하여 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 개인서비스요금 물가 정보를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 조사 대상 품목의 명칭과 서비스의 기준이 되는 품목 기준, 그리고 조사 연월 및 조사 시기, 최종 책정된 가격 정보가 포함됩니다.
