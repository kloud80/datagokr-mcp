summary_user: 국회 전원위원회 회의록을 회의 건별로 담으며, 대수(DAE_NUM)·회의일자·회의번호·회의 제목·안건명과 함께 영상·회의록 원문·PDF 링크를 제공하는 전국 단위 비공간 데이터다. 국민이나 연구자가 특정 대수 국회에서 전원위원회가 언제 열렸고 어떤 안건을 다뤘는지 확인하고 회의록 원문을 찾아볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 의안·표결 데이터와는 대수·회의일자·안건명 같은 이름 매핑이나 같은 기관(국회사무처) 코드로만 연결한다.
