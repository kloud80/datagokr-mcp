summary_user: 강원특별자치도 시군별·연도별로 면적(㎢)과 면적비율, 읍·면·행정동·법정동·통·행정리·반의 개수를 정리한 집계 통계 파일(CSV 약 23KB)이다. 지역 연구자나 지방행정 담당자가 '강원도 시군별로 읍면동·리·반이 몇 개이고 해마다 어떻게 바뀌었나'를 비교할 때 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 데이터와는 시군 이름을 맞춰 연결해야 한다.
description_portal: 강원특별자치도의 행정구역 현황을 시군별·연도별로 정리한 데이터입니다.데이터에는 시군별 명칭, 연도별 구분, 면적 및 면적비율(%)을 비롯하여 행정구역-시군, 읍면동, 통리반 현황 통계 등 행정구역 단위별 구성 수가 포함되어 있습니다.이를 통해 시군별 행정구역의 규모와 구조, 지역 간 면적 분포, 세부 행정단위의 수를 체계적으로 파악할 수 있습니다.본 자료는 행정구역 조정, 지역개발계획 수립 등 지방행정의 기초자료로 활용될 수 있으며, 각 시군의 행정 여건을 분석하는 데 중요한 참고자료로 활용됩니다.
