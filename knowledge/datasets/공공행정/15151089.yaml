description_portal: 이 데이터는 국가직무능력표준(NCS) 체계를 기반으로 한 직무능력은행 분류별 계좌 통계 정보를 제공합니다. 각 직무능력 분야(NCS 대·중·소분류 및 능력단위)에 대해 계좌제 훈련과정의 보유 현황을 집계한 데이터로, 우리나라의 직업능력개발 훈련 현황과 직무별 수요를 한눈에 파악할 수 있도록 구성되었습니다. 데이터는 NCS 분류코드, 직무능력단위, 능력단위명, 계좌보유수 등의 항목으로 구성되며, 각 항목은 국가직무능력표준(NCS) 분류체계에 따라 표준화되어 있습니다. 이를 통해 산업현장에서 요구되는 직무능력과 이에 대응하는 훈련계좌의 분포를 분석할 수 있으며, 직업훈련 정책 수립, 인력양성 계획, 교육기관 운영 방향 설정 등 다양한 분야에서 근거자료로 활용할 수 있습니다.
