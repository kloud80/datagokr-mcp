summary_user: 서울시 관내 가축사육업 사업장을 한 건씩 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·휴폐업 일자·지번/도로명 주소·좌표·소재지면적 등을 개별 업소 단위로 제공한다. 자치구 공무원이나 분석가가 "서울 안에서 지금 영업 중인 가축사육 시설은 어디에 있고, 언제 휴업·폐업했는가"를 확인해 현장 점검·방역·악취 민원 대응에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표를 통한 공간 매핑이나 같은 기관(개방자치단체 코드, OPNSFTEAMCODE) 기준으로만 이어 쓰며, LOCALDATA 지방 인허가 데이터와 같은 원천을 공유한다.
description_portal: 서울시 가축사육업 인허가 정보는 서울시 관내 가축을 사육하는 사업장의 인허가 현황과 영업 상태, 축산 관련 업무 구분을 파악하기 위한 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 시작·종료일자, 재개업일자, 영업상태명과 상세영업상태명 등을 통해 각 가축사육업체가 현재 영업 중인지, 휴업 또는 폐업 상태인지, 인허가 이후 어떤 변동 이력이 있었는지를 시점별로 확인할 수 있습니다. 사업장명, 전화번호, 지번주소·도로명주소, 소재지우편번호·도로명우편번호, 좌표정보, 소재지면적 등은 축산시설의 위치와 부지 규모, 연락처 정보를 제공하여 지도 기반 입지 분석, 민원 대응, 현장 점검 및 방역 계획 수립 등에 활용됩니다. 업태구분명과 축산업무구분명, 축산물가공업구분명은 해당 사업장이 단순 사육시설인지, 축산물 가공까지 수행하는지 등 축산 관련 업무의 성격을 구체적으로 보여줍니다. 축산일련번호와 권리주체일련번호는 행정적으로 개별 사업장과 권리주체를 식별·관리하기 위한 식별값이며, 총인원은 가축사육업 운영에 투입되는 인력 규모를 파악하는 데 활용됩니다. 주사육업종 정보는 어떤 축종 또는 사육 형태를 주로 하는지 나타내어, 지역별 축종 분포, 가축사육 밀도, 환경·악취·질병 관리 정책 수립에 중요한 기초 자료로 쓰일 수 있습니다. 이러한 정보를 종합하면 서울시 내 가축사육업의 분포, 규모, 영업 이력, 축산업무 특성을 체계적으로 분석하고 축산행정, 환경·위생 관리, 방역정책 수립에 활용할 수 있습니다.
