summary_user: 경기연구원이 소장한 도서를 한 권씩 등록번호·청구기호·서명과 저자명·출판사·입수방법(기증, 구입 등) 단위로 담은 소장 목록이며, 정책연구·사회과학 분야 연구서와 보고서가 주를 이룬다. 연구자나 도서 담당자가 '경기연구원에 특정 주제나 저자의 정책 보고서가 있는지, 청구기호로 어느 서가에 있는지'를 확인하는 데 쓴다. 다른 데이터와 잇는 공통 조인 키는 없어서, 서명·저자명 같은 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 경기연구원에서 보유 중인 도서 목록으로, 각 도서의 등록번호, 청구기호, 서명 및 저자명, 출판사와 출판년도, 입수방법(기증, 구입 등)의 항목으로 구성되어 있습니다. 정책연구 및 사회과학 분야의 연구서적, 보고서, 연구논총 등이 주를 이루며, 각 도서는 연구주제, 라이프스타일, 복지정책 등 다양한 사회 이슈를 다루고 있습니다. 연구기관 소장 자료의 체계적인 관리와 도서관 운영, 학술 연구의 기초자료로 활용될 수 있으며, 정책 자료집과 참고문헌 확보를 위한 도서 관리 기반자료로도 유용합니다. 청구기호를 통해 주제 분류 체계와 서가 배치를 연계할 수 있어 도서 검색과 분류 업무에도 활용됩니다.
