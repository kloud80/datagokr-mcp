description_portal: '조달청 기관장(청장) 업무 일정에 대한 안내 자료○  청장 인사말 : 약 225조 원의 공공조달 시장, 62만여 조달기업, 7만5천여개 수요기관,조달청은 「국민이 체감하는 조달개혁」을 적극 추진하겠습니다.○ 조달청 홈페이지 내 열린청장실 "청장 25시"에 안내되는 내용○ 열린청장실은 조달 행정과 그 주변에서 일어나는 생생한 현장의 목소리를 듣고 이를 국정에 반영하고자 하는 만남의 장입니다. 업무와 관련된 민원이나, 민원처리 시 불편한 점, 조달행정에 대한 정책 건의사항이나 개선사항 등 도움을 줄 수 있는 제반사항들을 그 주제나 내용에 관계없이 자유롭게 게재할 수 있습니다.'
