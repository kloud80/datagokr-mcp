summary_user: 환경표지인증시스템으로 인증된 제품을 제품·모델 단위로 한 줄씩 담은 인증 내역 파일로, 대상제품군·업체명·제품명·인증사유·인증번호와 최초인증일·인증시작일·인증종료일, 본사·공장 지역 구분을 포함하며 범위는 전국이다. 소비자나 공공구매 담당자가 '이 제품이 환경표지 인증을 받았고 인증이 언제 끝나는가'를 확인하거나, 분석가가 제품군별·지역별 인증 현황과 갱신 예정 시점을 파악하는 데 쓴다. 인증번호(green_product_cert_no)로 다른 인증 자료와 맞대고, 사업자번호(bizno)로 사업자 등록·기업 정보 데이터와 업체 단위로 연결한다.
description_portal: 본 데이터는 2026년 01월 기준 환경표지인증시스템을 통해 인증된 제품 내역을 집 계·제공하는 공공데이터입니다. 데이터는 ‘대상제품군’, ‘업체명’, ‘제품명’, ‘제품구분’, ‘인증사유’, ‘인증번호’, ‘최초인증일’, ‘인증시작일’, ‘인증종료일’, ‘사업자번호’, ‘본사지역구분’,  ‘공장지역구분’, ‘공장구분’ 등 13개 필드를 포함하며, 인증 제품의 사유와 인증 기간, 적용 대상 등을 상세히 확인할 수 있습니다. 소비자 정보 제공, 시장 동향 분석, 인증 갱신 일정 관리, 정책 성과 평 가, 친환경 제품 홍보자료 제작 등에 폭넓게 활용할 수 있습니다.
