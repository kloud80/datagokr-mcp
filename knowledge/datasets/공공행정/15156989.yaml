summary_user: 한국중부발전 본사에서 생산된 기록물철 가운데 기록물평가심의회 평가 대상이 된 것을 한 건씩 담은 파일로, 관리번호·생산부서·생산/종료연도·보존기간과 만료일·기록물 형태와 수량·1차 평가의견·보존기간 재책정 여부와 평가사유를 포함한다. 국민이나 기록관리 담당자가 보존기간이 끝나 폐기되거나 재책정될 발전사 기록물이 무엇이고 그 사유가 무엇인지 확인하고 의견을 내는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 기관의 기록물 평가 목록과는 부서명·기록물철 제목 같은 이름으로만 맞대어 비교한다.
description_portal: 본 데이터는 한국중부발전 본사에서 생산된 행정 및 기술 관련 기록물의 관리 현황을 담고 있습니다. 각 기록물의 관리번호, 생산부서, 생산,종료연도, 보존기간, 만료일, 평가사유 등을 포함하여 문서의 생성부터 폐기 또는 재책정까지의 전 과정을 체계적으로 관리할 수 있습니다. 기록물의 형태, 크기, 수량 등 물리적 속성과 함께 보존기간 재책정 사유, 1차 평가의견 등을 통해 기관의 문서 보존정책과 업무 참고 가치를 분석할 수 있습니다. 이를 활용하면 공공기관의 기록물 관리체계 점검, 보존기간 기준 수립, 평가 및 폐기 정책 수립 등 기록정보자산 관리에 필요한 기초자료로 활용 가능합니다.
