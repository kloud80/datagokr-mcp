summary_user: 전국 지방자치단체별로 회계연도마다 일반회계 세출예산 중 지방의회 운영 경비가 차지하는 비중(rate)과 의회비, 의회사무처경비, 일반회계 예산액을 담은 집계 자료로, 포털 설명상 2001회계연도부터 제공된다. 주민·지방의회 감시단체·재정 분석가가 '우리 시·군·구는 예산 중 의회 운영에 얼마를 쓰고, 다른 자치단체보다 많은가'를 비교하는 데 쓴다. 전역 조인 키는 없고 광역·기초 자치단체 코드와 이름(laf_cd, laf_hg_nm)과 회계연도를 기준으로 같은 지방재정365의 다른 공시 지표와 맞춰 쓴다.
description_portal: 지방자치단체의 의회비는 지방의회의 운영 및 의정 활동을 지원하기 위해 필요한 경비로, 의정운영공통경비, 의회운영업무추진비, 의원국외여비, 의원역량개발비와 같은 항목을 포함하고 있으며 지방의회가 효율적, 독립적으로 운영될 수 있도록 예산을 편성합니다. 이 자료는 자치단체의 일반회계 세출예산에서 지방의회 운영과 관련된 경비가 차지하는 비율을 분석한 자료입니다.해당자료의 보유연도는 2001년 회계연도부터 제공되며 자치단체별 의회비 비중, 의회비, 의회사무처경비, 일반회계 예산액등의 정보가 제공됩니다.
