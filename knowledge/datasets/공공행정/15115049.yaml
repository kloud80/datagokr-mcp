summary_user: 서울 강남구에서 동물용 의약품을 취급하는 동물약국을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소일, 영업·휴업·폐업 상태와 일자, 사업장명·주소·전화번호·좌표를 포함한다. 반려동물 보호자가 집 근처에서 영업 중인 동물약국을 찾거나, 분석가가 강남구 동물약국의 개업·폐업 이력으로 점포 변화를 볼 때 쓴다. 전역 조인 키는 없으므로 같은 출처인 LOCALDATA 인허가 자료와는 관리번호(MGTNO)나 개방자치단체코드로 맞추고, 다른 자료와는 주소·사업장명·좌표로 연결한다.
