summary_user: 공정거래위원회 가맹사업 정보공개 중 브랜드별 독점·배타 영업지역과 관련해, 기준년도와 브랜드관리번호 단위로 동일업종 범위명, 같은 업종에서 가맹본부와 계열회사가 쓰는 영업표지명, 업종 대·중분류를 담은 전국 단위 비공간 API입니다. 창업 예정자나 가맹점주가 "이 브랜드 본부가 같은 업종에서 다른 영업표지나 계열회사 브랜드를 운영해 내 영업지역과 겹칠 수 있나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 가맹정보 API들과는 브랜드관리번호(brandMnno)·가맹본부관리번호·기준년도를 같은 기관 코드로 맞춰 잇고, 그 밖의 데이터와는 영업표지명 같은 이름 매핑으로만 연결한다.
limits: 사업자등록번호·법인등록번호 같은 전역 키가 응답에 없어 공정위 밖의 데이터와 바로 조인하기 어렵고, 이름 매핑에 기댈 수밖에 없다. 위치 정보가 없는 비공간 데이터라서 실제 영업지역의 경계나 범위는 이 데이터로 알 수 없다. 기준년도와 브랜드관리번호를 알아야 조회되며, 개발계정 호출 한도는 하루 10,000회다.
