summary_user: 지방자치단체 복식부기 재무현황 중 수익 항목을 담는다. 수익은 지방세·세외수입·보조금 등 발생주의 기준으로 인식한 순자산 증가분이며, 회계연도(fyr)와 자치단체별 금액으로 제공되는 전국 범위 집계 자료다. 분석가나 주민이 "우리 지자체의 한 해 수익 규모는 얼마이고 다른 지자체와 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 광역·기초 자치단체 코드와 이름(laf_cd·laf_hg_nm 등)으로 같은 지방재정365 계열 공시 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 지방자치단체의 복식부기 재무현황에서 ‘수익’ 이란 회계기간 동안 자치단체가 행정서비스 제공이나 재정활동을 통해 획득한 경제적 자원의 유입으로, 순자산을 증가시키는 거래나 사건을 의미합니다. 이는 지방세, 세외수입, 보조금, 기부금, 자산처분이익, 무상수입 등 다양한 형태로 발생할 수 있으며, 발생주의 회계기준에 ᄄᆞ라 실제 현금 수취 여부와 무관하게 인식됩니다.복식부기 회계는 이러한 수익을 거래 시점에 정확히 반영함으로써 자치단체의 재정운영 성과를 보다 정확하게 평가할 수 있도록 합니다.
