description_portal: '본 데이터는 경기도 가평군 계약정보공개시스템에 공개된 특별회계 사업현황 자료입니다. 항목에는 회계연도, 구분, 관서명, 계약명, 계약금액, 계약일자, 업체명, 데이터기준일자 등이 포함되며, 가평군의 특별회계를 통한 계약사업 집행 내역을 확인할 수 있습니다. 본 자료는 특별회계별 재정 운영의 투명성을 확보하고, 사업별 계약금액 및 업체 현황을 비교·분석하는 데 활용됩니다. 계약명과 업체명을 통해 사업 목적과 수행 주체를 파악할 수 있으며, 계약일자를 기준으로 예산 집행 흐름도 확인 가능합니다. 해당 데이터는 공공예산의 건전한 집행을 위한 기초자료로 활용됩니다.*가평군계약정보공개시스템: https://gyeyak.gp.go.kr/'
