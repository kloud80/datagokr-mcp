description_portal: 만 15세 이상 인구 중 경제활동에 참여하는 인구의 현황을 월별로 제공하는 데이터입니다. 경제활동인구는 수입을 목적으로 일정한 일에 종사하고 있는 취업자와, 취업을 희망하며 적극적으로 구직활동 중인 실업자를 포함합니다. 본 데이터는 취업자 수, 실업자 수, 경제활동참가율 등을 분류하여 제공합니다. 이를 통해 노동시장 구조 분석, 고용 동향 파악, 정책 수립 및 사회경제 연구에 필요한 기초 자료로 활용할 수 있습니다. 취업자, 실업자, 경제활동인구는 국가 통계정책 수립의 핵심 지표로, 본 자료는 시의성 있고 정확한 통계 제공을 통해 국민의 정보 접근성과 활용 편의를 높이는 데 목적이 있습니다.
