summary_user: 서울특별시 강남구에서 전화로 소비자에게 권유하거나 회신을 유도해 재화를 파는 전화권유판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장이다. 관리번호, 인허가일자, 영업상태(영업·폐업), 휴업·재개업·폐업일자, 사업장명, 도로명·지번주소, 전화번호 등이 들어 있다. 강남구에서 지금 영업 중인 텔레마케팅 판매업체가 어디인지, 특정 업체가 신고된 곳인지, 언제 폐업했는지를 확인하려는 소비자나 상권·업종 변화를 보는 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다. LOCALDATA 인허가 자료와 원천이 같다.
description_portal: 서울시 강남구 전화권유판매업 인허가 정보(https://data.seoul.go.kr/dataList/OA-18799/S/1/datasetView.do)서울특별시 강남구의 텔레마케팅과 같은 전화를 이용하여 소비자에게 권유하거나 전화회신을 유도하는 방법으로 재화 등을 판매하는 업소정보입니다.관리번호, 인허가일자. 영업상태명, 상세영업상태명(영업/정상,폐업), 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소, 위생업태명, 사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
