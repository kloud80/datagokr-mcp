description_portal: 한국국제협력단(KOICA)이 공공기관의 운영 투명성 제고를 위해 기관장과 임원이 연도 내에 사용한 업무추진비 집행 내역을 체계적으로 정리한 자료입니다. "업무추진비"란 기관의 사업추진과 기본적인 운영을 위해 사용되는 경비"를 말합니다. 사용일자, 집행자, 사용처, 집행 대상자, 인원, 금액, 결제 구분(현금 또는 카드) 등 주요 경비 집행 항목이 포함되어 있어, 예산 사용의 적정성과 투명성을 확인하고 검토할 수 있습니다. 동 데이터는 연간 업데이트되며 기관 내부적으로도 책임감 있는 예산집행을 유도하는 역할을 합니다.
