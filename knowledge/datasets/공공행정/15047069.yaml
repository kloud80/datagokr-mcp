description_portal: '○ 통계개요* 통계명 : 연구기관 현황* 통계종류 : 전국 연구기관 및 연구원 현황을 제공하는 지정통계, 조사통계* 작성목적 : 국내의 과학기술에 관한 연구개발활동 현황을 파악하여 국가 과학기술정책수립에 필요한 기초자료로 활용함과 아울러 각계의 과학기술분야종사자로 하여금 연구개발계획 수립 등에 기초자료로 활용* 조사체계 : 조사대상→위탁기관(한국과학기술기획평가원) →미래창조과학부* 공표주기 : 정기(매년))* 공표범위 : 지역 - 전국, 수도권(서울,인천,경기), 수도권이외 지역내용 - 연구개발조직의 연구개발주체별 수행조직수와 연구원수 등○ 용어설명* 연구기관 : 국립.공립 연구소, 교육기관 및 민간기업의 부속 연구소 등이 포함* 연구개발활동 : 새로운 지식을 획득하거나 기존 지식을 활용하여 새로운 방법을찾아내기 위한 창조적인 노력 및 탐구를 의미(시험생산이나 상업화단계는 연구개발에서 제외)* 연구원 : 학사학위 이상의 학위 소지자 또는 동등학위 이상의 전문지식을 갖고 있는사람으로서 연구개발과제에 참여한 사람* 연구기관 구분- 국·공립 연구기관 = 국·공립시험연구기관 + 국공립병원- 출연 연구기관 = 정부출연(연) + 지방자치단체출연(연)- 기타 비영리 = 사립병원 + 기타비영리- 국·공립 대학 = 국·공립대학 + 국·공립대학 부속병원- 사립 대학 = 사립대학 + 사립대학 부속병원- 정부투자기관 = 정부투자기관 + 정부재투자기관 + 기타- 민간 기업 = 민간기업○ 기 타* ~2006년 과학기술분야만 대상, 2007년~ 과학기술분야 및 인문사회과학 포괄* 연구개발활동조사는 연구개발수행자 관점에서의 조사이므로 자료이용시 유의○ 출 처 : 과학기술정보통신부 「연구개발활동조사보고서」'
