description_portal: 「인터넷이용 실태조사」는 우리 국민의 인터넷 이용 행태를 종합적으로 분석하여 디지털 격차 해소, 이용자 보호, 정책 기초자료 확보 등을 목적으로 매년 실시됩니다.먼저 인터넷 이용빈도 항목은 주간 또는 일일 기준으로 인터넷 사용 빈도를 파악하며, 세대별·성별 이용 격차 분석에 활용됩니다. 인터넷 접속방법은 스마트폰, PC, 태블릿, 스마트TV 등 어떤 기기를 주로 사용하는지 조사해 기술환경 변화를 반영합니다.또한 인터넷 이용장소는 가정, 직장, 학교, 공공장소(카페·도서관·지하철 등)로 구분되며, 모바일 중심의 변화 흐름을 분석하는 데 중요한 기준이 됩니다. 인터넷 이용목적에서는 정보검색, 커뮤니케이션, 여가, 쇼핑, 금융, 행정서비스, 교육 등 다양한 사용목적을 복수응답으로 파악해 사회 전반의 디지털 활용도를 측정합니다. 주 이용 사이트는 포털, 커뮤니티, 쇼핑몰, SNS 등 구체적 플랫폼 선호도를 분석하며, 이용자 집중도나 콘텐츠 소비 추세를 파악하는 지표로 활용됩니다. 주 이용 동영상 서비스 항목에서는 유튜브, 넷플릭스, 웨이브 등 OTT 서비스 중심의 동영상 소비 실태를 조사하여 콘텐츠 시장 분석 및 규제 정책 근거로 활용됩니다. 이 조사는 과학기술정보통신부 및 한국지능정보사회진흥원(NIA) 주관으로 전국 만 3세 이상 국민을 대상으로 실시되며, 디지털 포용 정책과 정보문화 진흥에 중요한 통계자료입니다.
