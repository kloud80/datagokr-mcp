description_portal: '이 데이터는 충청남도 내 15개 시군의 행정사사무소  등록현황 자료를 제공합니다.주요항목으로는 행정사사무소 명칭, 행정사 종류, 주소(관할 기관명까지만 공개), 대표자성명, 운영상태(영업중, 휴업, 폐업)가 포함되어 있습니다.이를 통해 도민과 기업은 행정업무 관련 상담 및 대행 서비스를 제공받을 수 있는 사무소를 쉽게 찾아 이용할 수 있고, 행정기관은 지역 내 행정사 서비스 분포 파악, 정책 수립 등에 활용할 수 있습니다.본 데이터 기준일은 2025년 12월 27일입니다.[항목별 추가설명]1) 행정사사무소 명칭: 행정사가 운영하는 사무소의 명칭2) 행정사 종류: 일반행정사, 해사행정사, 외국어번역행정사로 구분되며, 대부분 일반행정사로 구성됨3) 주소: 사무소가 위치한 주소로, 개인 집주소로 등록한 경우도 있어 관할 시군명까지만 공개4) 대표자성명: 행정사 자격을 가진 개인의 실명으로 부분 마스킹처리하여 공개5) 운영상태: 행정사 사무소의 현재 업무가능여부를 나타내는 행정관리 정보(영업중, 휴업, 폐업)출처: 행정사 자격관리시스템'
