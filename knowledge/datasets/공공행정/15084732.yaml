summary_user: 양산시 관내 주요 관광지별로 연·월 단위 총 방문수와 10대 이하부터 70대 이상까지 연령대별 방문수를 담은 월별 유동인구 집계 데이터다. 관광 정책 담당자나 관광지 주변 사업자가 '어느 관광지에 어느 달, 어느 연령대 방문객이 많이 오는가'를 확인해 편의시설·주차·콘텐츠 계획을 세우는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관광지명(site_nm)과 연·월을 이름 매핑으로 맞추거나 같은 양산시 자료끼리만 연결한다.
description_portal: “양산시 관광지 유동인구 정보 조회” 기능은 사용자가 설정한  조회 기간(연·월 단위)을 기반으로, 양산시 관내 주요 관광지별 유동인구 및 방문 규모를 체계적으로 조회할 수 있도록 제공하는 공공데이터 OpenAPI 서비스입니다.이 API는 관광지별 월별 방문객 수를 산출한 유동인구 통계자료를 기반으로 하여, 특정 시점 또는 기간 동안의 관광지 이용 현황과 방문자 특성을 정량적으로 파악할 수 있도록 설계되었습니다.본 서비스는 관광객의 체류·방문 패턴을 분석하여 지역 관광활성화 정책, 관광지 운영 전략, 편의시설 확충, 교통 및 주차 수요 대응 등 다양한 행정적·산업적 의사결정에 활용할 수 있는 핵심 데이터를 제공합니다.API 응답에는 관광지의 방문 현황 분석에 필요한 다음과 같은 주요 항목이 포함되어 있습니다.관광지명(Tourist Attraction Name)조회 대상 관광지의 정식 명칭으로, 관광지 단위별 방문 현황을 식별하고 비교할 수 있는 기준 정보총 방문수(Total Visitors)해당 월 기준 관광지를 방문한 전체 인원 수로, 관광지의 인기도·이용 수요·계절별 방문 패턴을 분석하는 핵심 지표연령별 방문수(Visitors by Age Group)유소년, 청년, 중장년, 노년 등 연령대별 방문자 규모를 분류하여 제공하며, 관광지 이용층의 특성 파악, 연령대별 맞춤형 관광 콘텐츠 개발, 서비스 개선 전략 수립 등에 활용 가능
