summary_user: 경기도 하남시의 유동인구를 날짜(exmn_ymd)·시간대(0~23시)·내외국인 구분별로 나누고 성별·5세 단위 연령대별 인구수로 담은 집계 통계이며, 기지국 단위로 수집한 인구를 주변 50×50 셀로 배분해 값에 소수점이 생길 수 있다. 상권 분석가나 창업 예정 사업자가 '하남시에서 평일 저녁 시간대에 20~30대 여성 유동인구가 얼마나 되는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구코드·시군구명을 이름·코드로 맞추거나 같은 기관(경기도)의 다른 시군 유동인구·상권 자료와 이어 쓴다.
description_portal: '이 데이터는 경기도 하남시의 시간대별·성별·연령대별 유동인구 현황을 보여주는 통계자료입니다.주요 항목은 시군구코드, 시군구명, 시간코드, 외국인구분(내국인/외국인), 연령대별 유동인구수, 연도_월_일로 구성되어 있습니다.1. 시간코드는 00~23까지의 1단위로 있고 각 시간대를 의미합니다.예) 0 : 00:00~00:59 1 : 01:00~01:592. 남자0009수와 같은 컬럼은 연령대별 유동인구수를 나타냅니다.* 소수점이 발생하는 이유는 기지국단위로 수집된 인구를 주변셀(50*50)으로 나누어 배분하면서 소수점이 발생될 수 있습니다.'
