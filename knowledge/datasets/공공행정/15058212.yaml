summary_user: 경기도 안에서 환경 분야로 활동하는 비영리 민간단체를 단체 한 곳당 한 행으로 담은 현황 목록으로, 시군명·지역구분, 단체명, 사업목적, 지번·도로명 주소, 우편번호, WGS84 위경도를 담는다. 환경단체와 협력 사업을 찾는 공무원이나 주민이 '우리 시군에서 수질개선·야생동물 보호 활동을 하는 민간단체는 어디에 있나'를 확인하거나, 분석가가 시군별 환경단체 분포를 지도에 그려 볼 때 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)·시군명으로 경기도 다른 시군 단위 자료와 묶거나, 주소·좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 환경 분야에서 활동 중인 비영리 민간단체의 현황을 정리한 자료로, 각 단체의 명칭, 활동 목적, 소재지 정보 및 위치좌표 등을 포함하고 있습니다. 주요 항목은 시군명, 지역구분명, 단체명, 사업목적, 소재지 지번주소 및 도로명주소, 우편번호, 위도(WGS84), 경도(WGS84)이며, 이를 통해 해당 단체의 설립 목적과 활동영역, 지리적 분포를 파악할 수 있습니다. 본 데이터는 환경정책 수립, 지역별 환경운동 분포 분석, 민간협력 체계 구축, 공공기관과의 협업 기반 마련 등에 활용될 수 있습니다. 사업목적에는 자연보호, 수질개선, 지속가능발전교육, 야생동물 보호 등 다양한 환경보전활동이 포함되어 있으며, 이를 통해 지역사회 환경문제 해결에 기여하고 있습니다.
