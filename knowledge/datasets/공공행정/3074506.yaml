description_portal: 전북특별자치도 고창군 건축물 유지관리점검대상 시설물 공공데이터는 고창군 내 주요 건축물의 유지관리 점검 대상을 기록한 데이터입니다. 이 데이터에는 소재지 지번주소, 도로명주소, 주용도, 상세용도, 연면적, 지상층수, 사용승인일 등의 정보가 포함됩니다. 이를 통해 건축물의 유지관리 상태를 확인하고, 점검 대상 시설물을 체계적으로 관리할 수 있습니다.데이터는 XLS 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다. 또한, 건축물 유지관리 점검은  다중이용시설, 16층 이상 건축물, 연면적 3,000㎡ 이상인 집합건축물 등이 포함됩니다. 보다 자세한 내용은 공공데이터포털에서 확인할 수 있습니다.
