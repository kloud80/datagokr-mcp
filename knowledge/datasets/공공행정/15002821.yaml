description_portal: 본 데이터는 서울시 성북구 관내의 건전한 옥외광고 문화를 정착시키고 도시 미관의 체계적인 관리를 도모하기 위해 성북구도시관리공단에서 전담 운영하는 지정게시대의 통합 행정 정보를 제공합니다.데이터의 세부 구성 체계로는 각 행정동별 설치 위치와 게시대별 가용 면수, 게시 가능한 규격 사양 및 규제 정보를 포함하고 있습니다. 또한 이용자의 투명한 행정 서비스 이용을 돕기 위해 이용요금 정보와 관내 소상공인 및 개인사업자의 홍보 지원을 위한 담당부서 문의처 정보를 수록하여, 적법한 광고 게시를 통한 불법 유동 광고물 저감 및 효율적인 마케팅 활동을 적극 지원하고 있습니다.본 데이터는 지역별 옥외광고 수요 분석을 통한 효율적 입지 선정, 공공 미관 개선 정책 수립, 위치 기반 광고 플랫폼 개발 및 소상공인 판로 개척 지원 서비스 구축을 위한 핵심 기초 데이터로서 그 공익적·경제적 활용 가치가 매우 높습니다.게시대별 예약 현황 등 최신 정보는 홈페이지(https://gongdan.uriad.com/index.jsp) 를 통해 편리하게 확인하실 수 있습니다.
