summary_user: 국회 상임위원회별 국정감사 결과보고서를 보고서 한 건 단위로 담으며, 보고 연도(RPT_YR)·위원회명·보고서 제목과 PDF·HWP 원문 내려받기 주소를 제공한다. 국정감사를 추적하는 시민·기자·연구자가 특정 연도에 특정 위원회가 어떤 감사 결과를 보고했는지 찾아 원문을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의정활동·의안 데이터와는 위원회명이나 연도로 이름을 맞춰 연결해야 한다.
