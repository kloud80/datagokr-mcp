description_portal: 경기도 여주시의 동물관련서비스업 현황에 대한 데이터를 제공합니다. 본 데이터는 관내에서 동물관련 서비스업을 운영하거나 운영했던 사업장을 대상으로 하며, 사업장 명칭, 신고일자, 영업 내용, 도로명 주소, 지번 주소, 전화번호, 영업 상태 구분, 폐업일자 등의 항목으로 구성되어 있습니다. 이를 통해 여주시 내 동물 미용업, 동물 위탁관리업, 반려동물 장례업 등 다양한 동물관련 서비스업체의 운영 현황을 파악할 수 있으며, 신고 시점부터 현재까지의 영업 상태 및 폐업 여부, 소재시도로명주소를 확인할 수 있습니다.
