status: active
summary_user: 세종특별자치시에 사는 외국인 인구를 읍면동(emd)별로 묶어 총계와 국적별 인구수를 남녀로 나눠 담은 집계 데이터다. 세종시 행정·다문화 지원 담당자나 연구자가 '어느 읍면동에 어느 나라 출신 외국인이 몇 명 사는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름을 행정구역 코드에 매핑하거나 같은 기관 자료와 이름 기준으로 맞춰 잇는다.
limits: '범위는 세종시 한 곳, 단위는 읍면동까지이며, 개인 단위 자료는 없다. 국적은 ISO 3자리 약어 형태의 필드명(예: 네팔 npl, 독일 deu)으로 열마다 나뉘어 있어 분석 전에 행 형태로 바꾸고 국가명으로 매핑해야 한다. 법정·행정동 코드가 없어 지도·타 통계와 결합하려면 이름 매칭이 필요하다.'
