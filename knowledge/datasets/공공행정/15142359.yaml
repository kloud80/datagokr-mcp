description_portal: 부산광역시 의회 홈페이지에서 공개 중인 인터넷 방송 현황 데이터를 개방합니다.부산광역시의회에서는 시의원들의 의회 활동을 시민이 직접 확인할 수 있도록 그리고 시의원들의 의회에서의 발언, 토론 결정과정들을 볼수 있고 정치에 대한 관심을 유도하여 민주시민의식을 높이고자 시의회 홈페이지 내에 인터넷 방송 현황을 공개하고 있습니다. 본회의 운영위원회, 기획재경위원회, 행정문화위원회 등의 상임위원회, 예결산특별위원회, 행정사무감사 등 각 회차별로 회의들을 인터넷으로 볼 수 있습니다.개방되는 데이터에는 회의제목, 방송내용, 등록일자 등의 정보를 제공합니다.
