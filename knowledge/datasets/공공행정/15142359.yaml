status: active
summary_user: 부산광역시의회 홈페이지에 올라온 인터넷 방송 영상을 한 건씩 담은 목록으로, 회의 대수·회차·차수, 위원회명, 회의제목, 방송내용, 생방송 여부, 조회수, 등록일시를 포함한다. 시민이나 의정 감시 활동가가 '특정 상임위원회의 행정사무감사나 예결산특별위원회 회의 영상이 언제 올라왔고 얼마나 시청됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 회의 대수·회차(mtgNmot)나 위원회명 같은 이름 매핑, 또는 같은 부산광역시의회 기관의 회의록·의안 데이터와 이름으로 맞춰 이어 쓴다.
limits: 표준 코드 형태의 조인 키가 실측 컬럼에 없어 다른 의회 데이터와 정확히 결합하려면 위원회명·회차를 문자열로 맞춰야 한다. 범위는 부산광역시 한 곳의 의회에 한정되며 다른 시도 의회 방송은 담지 않는다.
