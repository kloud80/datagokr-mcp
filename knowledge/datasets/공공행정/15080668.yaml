summary_user: 광주 각화동농산물도매시장에 허가·등록된 중도매인을 한 행씩 담은 명부 파일로, 소속 도매법인·거래품목·상호·허가일자를 담는다(csv 약 11KB). 농산물 유통업자나 분석가가 "각화동시장에서 특정 품목을 다루는 중도매인은 어느 도매법인 소속이고 언제 허가받았나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도매법인명·상호 같은 이름 매핑으로만 이어 쓴다.
description_portal: 광주광역시 각화동농산물도매시장 중도매인 등록현황농수산물 유통 및 가격안정에 관한 법률 제25조(중도매업의 허가) 1항에 따라 광주광역시 각화동농산물도매시장에서 중도매인의 업무를 하려는 자는 도매시장 개설자의 허가 또는 지정을 받아야합니다. 또한 6항에 따라 "도매시장 개설자는 제1항에 따라 중도매업의 허가를 하는 경우 5년 이상 10년 이하의 범위에서 허가 유효기간을 설정할 수 있다. 다만, 법인이 아닌 중도매인은 3년 이상 10년 이하의 범위에서 허가 유효기간을 설정할 수 있다."광주광역시에 등록된 각화동농산물도매시장 중도매인 등록현황 정보로 중도매인 소속(도매법인), 상호 번호, 허가일자 등의 항목을 제공합니다.
