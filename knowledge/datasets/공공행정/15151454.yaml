description_portal: 해당 데이터는 지방공기업 통합결산시스템을 통해 추출한 2020~2024회계연도 결산보고 데이터로,  지방공기업 기관유형별(공영개발/도시개발공사/도시철도공사/상수도/하수도/운송사업/지방공단/기타공사) 재무 및 운영성과를 집계한 자료입니다. 각 기관유형별 자본금, 미처리결손금, 매출액, 영업활동현금흐름, 유형자산, 차입금 등 핵심 재무지표를 비롯하여, 상하수도 요금수입, 정수량, 지하철 수송인원 등 사업특성별 운영지표가 포함되어 있습니다. 지방공기업의 재무건전성, 경영효율성, 사업성과 등을 다각적으로 분석할 수 있는 기반 데이터를 제공하며, 지방공공기관 관리정책 수립, 결산통계 분석, 재무성과 비교 연구 등에 폭넓게 활용될 수 있습니다.
