description_portal: 농지보전부담금은 농지를 다른 용도로 전용할 때 부과되는 비용으로, 특정 요건을 충족하면 감면이나 면제가 가능합니다.  농지전용업무처리규정 제22조의2(보전부담금 감면 공개) 시장ㆍ군수ㆍ구청장이 제21조 및 제22조에 따라 보전부담금을 감면한 경우에는 보전부담금 부과결정서를 공사에 통보하는 날에 해당 사업명, 감면금액, 감면사유 등을 해당 시ㆍ군ㆍ구 홈페이지에 7일 이상 공개하여야 하는 자료입니다.해당 자료에는 농지보전부담금의 부과 및 감면 사유를 명시하고 있어, 행정의 공정성과 형평성을 확인할 수 있는 자료가 됩니다.
