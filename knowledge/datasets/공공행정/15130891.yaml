description_portal: '"회의록" 콘텐츠는 생산 후 30년이 경과한 기록물 중 지속적·주기적으로 개최된 회의록 원문을 편리하게 볼 수 있도록 개발되었습니다. 국가안전보장회의는 국가안전보장에 관련되는 대외정책과 국내정책의 수립에 관하여 대통령의 자문에 응하기 위하여 설치된 기관입니다. 국토건설종합계획심의회는 1963년 「국토건설종합계획법」 제정으로 1964년부터 구성되어 계획적인 국토건설계획을 심의하였습니다. 국정자문회의는 1980년 대통령의 자문에 응하기 위하여 국가원로로 구성되었던 헌법기관으로, 1989년 폐지되었습니다.'
