description_portal: '- 전라남도 농업기술원의 부서, 팀명, 이름, 직위, 담당업무, 연락처 등 조직 현황에 대한 정보를 조회하실 수 있습니다.- 전라남도 농업기술원은 전라남도 농업의 과학화·기술화·산업화를 선도하는 기관으로, 농업인 교육, 기술 보급, 연구 개발 등을 통해 지역 농업의 경쟁력 향상에 기여하고 있습니다.1. 농업 기술 연구 및 개발- 기술 개발 : 지역 특성에 맞는 농작물 재배 기술, 병해충 관리, 스마트 농업 기술 등을 연구합니다.- 품종 개발 : 고품질 농산물 생산을 위한 새로운 품종 개발 및 보급을 진행합니다.2. 농업인 교육 및 기술 보급- 교육 프로그램 : 농업인 대상의 다양한 교육과정을 운영하여 최신 농업 기술을 전파합니다.- 기술 보급: 현장 중심의 기술 보급을 통해 농업인의 생산성 향상에 기여합니다.3. 농업 정책 지원 및 컨설팅- 정책 지원 : 농업 관련 정책 수립에 필요한 자료를 제공하고, 정책 효과를 분석합니다.- 컨설팅 서비스 : 농업인 및 농업 관련 기업을 대상으로 맞춤형 컨설팅을 제공합니다.'
