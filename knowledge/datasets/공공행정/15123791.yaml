summary_user: 상위 법령의 조문 단위로 법령 ID, 공포번호·공포일자, 조문번호·조문명, 조문 공포·시행일자를 담고, 각 조문에 대해 지자체 전체 합계와 17개 시도별·교육청별 통계를 함께 담은 전국 단위 집계 파일(CSV 약 148KB)이다. 상위 법령의 어떤 조문이 개정됐을 때 어느 시도와 교육청의 하위 규정에 영향이 큰지 알고 싶은 입법실무자나 지자체 법무 담당자가 정비 대상을 가늠하는 데 쓴다. 전역 조인 키는 없으며, 같은 법제처 법령 데이터와는 법령 ID와 조문번호로, 그 밖의 데이터와는 법령명 매핑으로 이어 쓴다.
