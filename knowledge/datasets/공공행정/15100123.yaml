summary_user: 전국 법정동(읍면동·리) 단위로 기준연월별 전월·당월 주민등록 인구수와 그 증감을 전체·남자·여자로 나눠 담은 집계 데이터이다. 지자체 담당자나 분석가가 '우리 동네 리 단위 인구가 지난달보다 남녀별로 얼마나 늘거나 줄었나'를 확인하는 데 쓴다. 법정동코드(bjd_cd)를 키로 다른 법정동 기준 주민등록·세대 통계나 지역 데이터와 이어 공간 결합의 기본 축으로 쓴다.
description_portal: 법정동(읍면동리) 성별 주민등록 인구증감에 대한 데이터로, 법정동은 시 또는 구의 하위 행정구역으로 법률로 지정한 구역을 말합니다.주민등록 인구 및 세대 등 을 기반으로 선거, 교육, 조세, 복지, 교통, 지역 개발 등 다양한 분야에 적시성 있는 통계를 제공하고 있습니다. 이러한 통계는 국가 행정 및 정책 수립에 필요한 기초 자료로 활용되고 있습니다.또한, 주민등록 인구통계는 행정안전부 주민등록 인구통계 홈페이지(https://jumin.mois.go.kr), 공공데이터포털(https://data.go.kr) 등에서 확인 및 다운로드가 가능합니다.
