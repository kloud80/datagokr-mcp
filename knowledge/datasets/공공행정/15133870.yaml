summary_user: 경기도의정포털 시스템에서 쓰는 공통코드를 코드 그룹(cd_id)별로 코드값·코드명·설명·사용여부·등록·수정 시점과 정렬 순서까지 한 줄씩 담은 코드 원장이다. 경기도의회 의정포털 데이터를 다루는 분석가나 개발자가 '이 코드값이 무슨 뜻이고 아직 쓰이는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 의정포털의 다른 데이터에 들어 있는 코드값을 코드ID·코드로 매핑해 이름을 풀어 쓰는 방식으로만 이어진다.
description_portal: 「경기도의정포털_공통코드정보상세」 데이터는 경기도 의정포털 시스템에서 활용되는 공통코드 체계를 상세히 제공하는 자료입니다. 이 데이터에는 코드ID, 코드, 코드명, 코드설명, 사용여부, 최초등록시점, 최종수정시점, 등록자 및 수정자ID, 순서와 같은 항목이 포함되어 있어 행정시스템 내 코드값의 정의와 사용 현황을 파악할 수 있습니다. 코드정보를 통해 시스템 사용자들은 동일한 기준으로 행정정보를 입력·관리할 수 있으며, 데이터 간 상호 연계와 일관성 유지에 기여하고 행정정보 표준화, 시스템 간 호환성 확보, 데이터 분석 및 보고서 자동화에 활용 가능합니다.
