summary_user: 나라장터에 등록된 수요기관(기관코드·소관구분·기관유형·주소·최상위기관)과 조달업체(사업자등록번호·업체명·주소·제조구분·종업원수 등)를 기관·업체 1건 단위로 담은 원천 목록이며, 검증 호출에서 191행을 받았고 등록일 범위는 1989-12-13부터 2026-12-31까지다. 입찰·계약 분석가가 특정 사업자등록번호의 업체가 어느 지역에 있고 제조업체인지, 또는 특정 수요기관이 어느 최상위기관 소속인지 확인할 때 쓴다. 사업자등록번호(bizno)와 법인등록번호(corprtRgstNo)로 나라장터 입찰·낙찰·계약 데이터나 다른 사업자 정보와 잇고, 수요기관코드·최상위기관코드·지역코드 코드표로 조달 원장의 발주기관과 맞춘다.
description_portal: 나라장터에 등록된 조달업체와 수요기관에 대한 정보를 제공하는 서비스로 조달업체정보에는 사업자등록번호, 업체명, 업체주소, 업체의 등록업종정보, 업체의 공급물품정보가 포함되며 수요기관정보에는 수요기관코드(행안부코드가 기본으로 제공되며 행안부코드가 없을 경우 나라장터 수요기관코드가 제공됨), 소관구분, 주소, 최상위기관코드, 최상위기관명 등이 포함되는 나라장터 사용자정보서비스※ 코드정보시스템(code.go.kr)에 등록되지 않은 수요기관이 나라장터에 수요기관으로 등록하는 경우 나라장터 자체 수요기관코드가 채번됩니다.
