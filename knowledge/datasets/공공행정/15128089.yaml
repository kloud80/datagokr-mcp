description_portal: 다음 자료는 진주시에서 건립·운영 중인 공공체육시설 현황으로, 전문체육시설과 생활체육시설을 모두 포함하고 있습니다. 시설별 명칭, 주소, 규모, 주요 시설물, 접근성, 안전관리 현황 등의 기본정보와 함께, 최근 사회적으로 주목받는 빅데이터·스마트시티·지속가능성·친환경·포용적 공간·지역사회 활성화·건강증진 등 관련 키워드를 반영하여 구성하였습니다.일부 개인정보 또는 보안상 민감한 정보는 비공개 처리되었으며, 세부 항목별 설명은 “진주시 공공체육시설 현황 데이터 매뉴얼”을 참고하시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등 일반 프로그램에서 전체 내용이 표출되지 않을 수 있으니, 분석 전용 소프트웨어 사용을 권장합니다.
