summary_user: 가맹사업 기준년도를 넣어 그해 정보공개서가 신규 등록된 가맹 브랜드 목록을 브랜드 단위로 조회하는 전국 범위 API로, 브랜드명·가맹본부 상호·업종 대·중·소분류·가맹사업 개시일·최초등록일을 담는다. 창업 예정자나 분석가가 "올해 새로 등록된 치킨·카페 브랜드는 어디이고 본부는 어떤 회사인가"를 확인하는 데 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)가 실측 조인 키여서 같은 키를 가진 다른 가맹사업 정보공개서 데이터나 통신판매·상조 등록, 기업집단 공시와 사업자 단위로 이어 쓰고, 브랜드관리번호·가맹본부관리번호로 가맹정보 다른 목록과도 맞춘다.
limits: 신규 등록 브랜드 목록만 담으므로 브랜드의 가맹점 수·매출 같은 정보공개서 세부 내용은 이 데이터만으로 알 수 없다. 기준년도를 넣어 호출하는 구조이고 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
