description_portal: '이 데이터는 특정 지역 내 아동을 위한 실내 여가·놀이공간인 실내놀이터의 운영 현황을 정리한 자료입니다. 사업장명, 구분(예: 키즈카페, 유원시설), 지번 주소, 행정구역 등의 항목으로 구성되어 있으며, 아이들의 안전한 놀이공간 제공과 가족 단위 여가 활성화를 위한 주요 시설들이 포함되어 있습니다. 키즈카페는 건물 내부에 설치된 놀이기구 중심의 민간 운영시설이 주를 이루며, 유원시설은 교육체험이나 해양안전체험 등 공공 목적을 포함한 복합 기능형 공간으로도 운영되고 있습니다. 본 자료는 아동친화도시 조성, 실내놀이시설 분포 분석, 부모 대상 정책 서비스 설계, 지역별 여가 인프라 격차 해소 등의 정책 수립과 민간 협력 사업 발굴에 활용하실 수 있습니다.'
