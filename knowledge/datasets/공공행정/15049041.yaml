description_portal: 본 데이터는 공공사업 추진 과정에서 재결절차를 거쳐 취득한 공공용지의 취득현황을 사업정보 형태로 제공한다. 이 데이터는 사업종류(단지개발 등), 사업명, 사업시행자, 토지 면적(㎡), 보상금조정 결과에 따른 금액 등을 포함한다.이의재결은 보상금에 대해 토지소유자가 이의를 제기한 경우, 행정판단을 통해 최종 보상금액을 확정하는 절차이며 이를 통해 공공용지 확보 과정에서 발생하는 보상 분쟁을 조정하고 합의되지 않은 금액을 법적·행정 절차로 결정한다.데이터를 활용하면 정책 수립, 재정계획 검토, 사례 분석 등에 참고자료로 제공될 수 있다.
