summary_user: 경기도국민안전체험관 홈페이지에서 체험유형별로 예약할 때 적용되는 약관 내용을 체험유형(exprn_type)과 약관 본문 두 항목으로 담은 텍스트 자료로, 참여 가능 연령·보호자 동반 조건·안전 유의사항 등을 포함한다. 체험관 예약을 앞둔 보호자나 단체 인솔자가 '이 체험 프로그램에 우리 아이 나이로 참여할 수 있고 보호자가 함께 들어가야 하는가'를 확인하거나, 분석가가 프로그램별 안전지침을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 체험유형 이름을 맞추거나 같은 기관(경기도) 자료끼리만 연결한다.
description_portal: 이 데이터는 경기도국민안전체험관 홈페이지 체험유형별 예약 시 적용되는 약관 내용을 정리한 자료로, 체험 프로그램별 참여 가능 연령, 보호자 동반 조건, 안전상의 유의사항 등을 포함하고 있습니다. 약관은 체험자의 연령대와 건강 상태에 따른 참여 제한을 명시하여 안전사고를 예방하고, 체험 운영의 일관성을 유지하는 기준으로 활용됩니다. 이를 통해 이용자는 사전에 체험 조건을 명확히 인지할 수 있으며, 운영 기관은 법적·행정적 기준에 따라 서비스 제공의 책임성을 확보할 수 있습니다. 또한 본 데이터는 프로그램별 안전지침 분석, 이용자 안내 시스템 개선, 정책적 안전관리 기준 수립에 기초자료로 활용될 수 있습니다.
