summary_user: 온라인 행정심판시스템을 이용하는 각 행정심판위원회의 이름, 우편번호, 대표주소, 우편·방문 접수처, 전화·팩스 번호를 위원회 한 곳당 한 행으로 담은 전국 범위의 소형 CSV 파일(약 8.9KB)이다. 행정심판을 청구하려는 국민이 '내 사건을 맡는 위원회에 서류를 어디로 보내고 어디로 방문·전화하나'를 확인할 때 쓰고, 분석가는 지역별 위원회 분포를 볼 때 쓴다. 전역 조인 키나 기관 코드가 없어 다른 행정심판 재결례 데이터와는 위원회명을 이름으로 맞춰 연결해야 하며, 주소를 지오코딩하면 지도 데이터와 겹쳐 볼 수 있다.
description_portal: 온라인 행정심판시스템을 이용하고 있는 각 위원회 기관의 위치 정보를 제공합니다. 주요 제공 항목은 위원회 명칭, 위원회 우편주소, 도로명주소, 전화번호, 팩스번호로 구성되어 있으며, 민원인들이 직접 위원회를 방문하거나 서면, 유선으로 문의할 때 활용할 수 있도록 설계되어 있습니다. 해당 정보는 행정심판을 청구하려는 국민에게 필수적인 접촉 경로를 제공하며, 지역별 위원회 분포 현황 파악에도 유용합니다. 또한, 행정심판의 접근성과 편의성을 높이고, 제도 이용에 있어 정보 격차를 해소하는 데 기여하고 있습니다.
