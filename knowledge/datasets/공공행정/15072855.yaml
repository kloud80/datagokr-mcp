summary_user: 대전광역시 중구가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 원장 파일로, 업종(한식·중식·이미용업 등), 업소명, 도로명주소, 연락처, 대표 메뉴 1개와 그 1개 단위 가격을 담는다. 주민이나 방문객이 '중구에서 싼 가격에 먹을 수 있는 한식집이나 미용실이 어디인가'를 찾거나, 분석가가 지역 업종별 저가 업소 분포를 살피는 데 쓴다. 전역 조인 키는 없어 도로명주소나 업소명을 맞춰 LOCALDATA 인허가 같은 점포·업소 원장과 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 착한가격업소(연번, 업종, 업소명, 도로명주소, 연락처, 메뉴, 가격, 데이터 기준일자) 현황정보를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 업종은 한식, 중식, 양식, 이미용업 등이 있습니다.데이터 컬럼 중 전화번호는 유선 지역번호 또는 안심번호로 기재되어 있으며 일부 공란이 존재합니다.데이터 컬럼 중 가격은 메뉴1 컬럼의 1개 단위 가격을 표시하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
