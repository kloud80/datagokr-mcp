description_portal: 주민안내일림메시지는 각 행정부서에서 주민을 대상으로 발송한 안내 및 알림 메시지 내용을 포함한 데이터입니다. 발송부서, 메시지타입, 메시지내용, 데이터기준일자로 구성되어 있으며, 주민에게 전달된 다양한 행정 정보, 공지, 생활 안내 등 메시지 내역을 다양하게 수록합니다. 특히 본 데이터는 과학기술정보통신부에서 제공한 스팸문자 내역과 신청을 통해 제공받은 문자 내역을 AI로 학습하여, 시스템 이용자가 입력한 메시지의 일반/광고(스팸) 여부를 판단할 수 있도록 활용할 수 있습니다.  이를 통해  메시지 수신자가 불필요한 스팸성 안내를 받지 않도록 지원하는 시스템 개발과 테스트, 행정 메시지 품질 관리, 정보 전달 체계 개선, 메시지 유형 분석 등 다양한 목적으로 활용할 목표를 둡니다.
