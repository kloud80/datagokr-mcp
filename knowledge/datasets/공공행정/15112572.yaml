description_portal: 본 데이터는 2009년부터 인천광역시 동구의 재정 운영 자율성을 수치로 표현한 재정지표 정보를 수록한 자료이다. 주요 항목에는 연번, 회계연도, 재정자립도(개편 전), 재정자립도(개편 후), 재정자주도, 데이터 기준일이 포함되어 있으며, 각 연도별로 자치단체의 재정적 독립성과 자주성을 분석할 수 있다. 재정자립도는 지방세와 세외수입 등 자체 수입이 전체 재정에서 차지하는 비율을 의미하며, 재정자주도는 국고보조금 등을 포함한 자율적인 재정 운용 수준을 나타낸다. 개편 전후 기준값을 함께 제공함으로써 행정 해석상의 연속성과 비교 가능성을 높였으며, 본 자료는 지방재정 건전성 진단, 정책 수립, 학술연구 및 대외 공시용 기초자료로 활용된다. 데이터는 매년 갱신되며, 자치단체의 재정운영 효율성 평가 및 주민 정보공개에 기여한다.
