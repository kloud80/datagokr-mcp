description_portal: '○ 통계개요* 통계명 : 주민등록인구(동별)* 통계종류 : 주민등록인구수를 행정동 단위로 제공하는 일반?보고통계* 근거법령 :「주민등록법」에 따른 주민등록표에 등록된 서울시민 및 세대와「출입국관리법」에 따른 외국인등록표에 등록된 서울시 거주 외국인* 작성목적 : 지역별 인구의 변동상황 및 연령구조를 파악하여 각 지방행정기관의제반 행정사항의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 행정자치부·법무부→ 서울특별시 스마트도시담당관* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 자치구, 행정동내용 - 서울시 동별 세대수 및 성별 등록인구 수○ 용어설명* 등록인구 = 주민등록인구 + 등록외국인* 주민등록인구는 "거주자", "거주불명자", "재외국민"이 포함- 거주자 : 거주지가 분명한 사람(재외국민 제외)- 거주불명자 : 거주사실이 불분명하여 거주불명으로 등록된 사람(2010년 1월부터 통계에 포함)- 재외국민 : 외국의 영주권을 취득한(영주목적으로 외국거주 포함) 대한민국 국민으로주민등록을 한 사람(2015년 1월부터 통계에 포함)* 등록외국인은 출입국관리법에 의해 90일 초과 장기체류자 중에서 작성기준일 현재외국인 등록표에 등재된 자의 집계결과로서 실제로 국내에 거주하고 있는외국인 수와는 차이가 있을 수 있음○ 기타* 출생, 사망, 전입 등의 미신고,지연?허위신고 등에 따라 실제와는 차이가 있을 수있으며, 실제로 국내의 가족과 살고 있지 않더라도 주민등록표에 등재되어 있는경우에는 집계되기 때문에 상주인구 기준의 조사결과와 차이가 있을 수 있음'
