description_portal: 지방자치단체의 투명한 행정운영과 시민의 알권리 보장을 위한 정보공개 확대 필요성이 증대되면서, 행정절차법에 따른 적정한 고시·공고 절차 이행과 시민들의 정보 접근성 향상이 중요한 행정 과제로 대두되고 있습니다. 각종 행정처분과 정책 결정 과정에서 시민 참여 기회 보장과 의견 수렴을 위한 체계적인 고시·공고 운영이 요구되고 있으며, 디지털 전환 시대에 맞는 온라인 정보 제공 서비스 확대와 시민 편의성 향상이 필요합니다. 도시계획, 건축허가, 환경영향평가 등 다양한 행정 분야의 고시·공고를 통한 행정 투명성 확보와 시민 권익 보호가 중요해지고 있으며, 고시·공고 내용의 명확성과 이해하기 쉬운 정보 제공을 통한 시민 소통 개선이 요구되고 있습니다. 또한 고시·공고 정보의 체계적인 관리와 검색 편의성 향상을 위한 데이터베이스 구축이 필요하며, 행정 효율성 제고와 민원 처리 개선을 위한 고시·공고 운영 현황 분석의 중요성이 증대되고 있어, 충청남도 보령시는 관내에서 발표한 각종 고시·공고의 제목과 게재일자 등 시민들의 행정 정보 접근과 참여 기회 확대에 필요한 종합적인 고시공고 현황 정보를 제공하고 있습니다. 현재 고시공고를 확인하시려면 보령시 대표누리집(https://brcn.go.kr/prog/eminwon/kor/BB/sub04_03_01/list.do)에서 확인해주시기 바랍니다.
