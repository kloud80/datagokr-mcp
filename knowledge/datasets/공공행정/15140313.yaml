summary_user: 국세청이 소득세·부가가치세·상속세·법인세 등 국세 법령에 대해 내린 해석 사례를 한 건씩 목록으로 담으며, 건마다 안건명·안건번호·질의기관·해석기관·해석일자와 상세 본문 링크가 붙는다. 세무사나 사업자가 '이 거래의 부가가치세 처리에 대해 국세청이 이미 해석한 사례가 있는가'를 안건명과 해석일자로 찾아볼 때 쓴다. 전역 조인 키는 없고, 법령해석일련번호나 상세링크로 같은 서비스의 해석 본문을 이어 보며, 다른 데이터와는 안건명·질의기관명 같은 이름 매핑이나 해석기관코드·질의기관코드로만 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 국세청 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 소득세, 부가가치세, 상속세, 법인세 등 국세 관련 법령에 대한 해석 요청 사례를 목록 형태로 제공합니다. 이용자는 해석 일련번호, 안건명, 질의기관, 해석일자, 접수일자 등의 항목을 기준으로 다양한 질의 및 회신 사례를 검색할 수 있으며, 각 항목에는 회신 여부와 처리상태가 포함되어 해석 진행 현황을 명확히 확인할 수 있습니다. 목록 정보는 개별 해석 본문과 연계되어 세부 내용을 확인할 수 있도록 구성되어 있으며, 세무 행정에서 제기되는 쟁점 사항에 대한 법적 판단 기준을 체계적으로 제공합니다.
