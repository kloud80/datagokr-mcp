summary_user: 지방자치단체별로 전체 예산 대비 인건비(직원급여·복리후생비·퇴직금 등) 비율을 회계연도 단위로 담은 전국 범위의 집계 지표다. 연구자나 주민이 '우리 시·군·구의 인건비 비중이 다른 지자체보다 높은가, 해마다 늘고 있는가'를 비교하는 데 쓴다. 전역 조인 키는 없어 지자체 코드(laf_cd)나 지자체 이름으로 같은 지방재정365의 다른 지표와 맞춰 잇는다.
description_portal: 지역통합인건비비율이란, 지방자치단체의 전체 예산에서 인건비가 차지하는 비율을 의미합니다.이건비는 지방정부의 직원급여, 복리후생비, 퇴직금 등 인력과 관련된 모든 비용을 포함합니다.이 비율은 지방자치단체의 인력 운영이 예산에서 차지하는 비중을 보여주며, 인건비 과다 지출이 재정건전성에 마치는 영향을 평가하는 데 사용됩니다.또한, 적정한 비율을 유지해야 재정의 효율성을 높이고, 나머지 예산을 공공서비스나 사회적 투자에 잘 배분할 수 있습니다.지역톨합인건비비율은 지방자치단체의 재정 안정성과 지속 가능한 운영을 위해 중요한 지표로 활용됩니다.
