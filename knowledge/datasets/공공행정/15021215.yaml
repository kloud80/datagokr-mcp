description_portal: '경상남도 사천시의 담배소매인 지정 현황에 관한 정보(업소명, 주소, 연락처, 지정일자, 영업구붐 등)을 알 수 있습니다.이공공데이터는 각 소매업소의 식별과 관리를 위해 다음과 같은 구체적인 정보를 포함하고 있습니다.업소명: 담배 판매가 허가된 사업장의 공식 명칭입니다. (주로 편의점, 마트, 일반 소매점 등)주소: 해당 소매업소가 실제로 위치한 소재지 주소 (지번 또는 도로명 주소)로, 판매 구역 규제 준수 여부를 확인하는 기초 자료가 됩니다.연락처: 사업자와의 소통을 위한 연락 가능한 전화번호가 포함될 수 있습니다.지정일자: 사천시로부터 담배소매인으로 공식 지정받은 날짜를 나타냅니다.영업구분: 업소의 영업 형태 (예: 편의점, 일반소매, 기타) 등 추가적인 분류 정보가 제공될 수 있습니다.이 데이터는 사천시가 담배 소매업소의 위치 분포 및 지정 기준 준수 여부를 행정적으로 관리하는 데 사용됩니다. 또한, 신규 창업 희망자의 시장 분석 자료나 인근 지역 주민들의 편의 시설 정보로도 유용하게 활용될 수 있습니다.'
