summary_user: 지방공기업 통합경영공시(클린아이)에 올라온 지방공기업 이사회 의사록을 연도·지자체·기관별 공시 건 단위로 담으며, 제목·내용과 함께 회차·일자·참석이사·의안·가결여부가 든 첨부파일을 제공하고 범위는 전국이다. 분석가나 시민이 특정 지방공기업 이사회가 어떤 안건을 언제 의결했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 경영공시 데이터와는 기관명·지자체명 매핑으로만 잇는다.
limits: 필수 파라미터 조회 시작월·종료월(from_month, to_month)은 다른 데이터에서 받은 코드를 넘겨야 하므로 먼저 해당 값을 확보해야 한다. 전역 조인 키가 없어 기관 단위 결합은 이름 매핑에 의존한다.
