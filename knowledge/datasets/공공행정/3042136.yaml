summary_user: 전북특별자치도 도민이 부모님과의 관계에 얼마나 만족하는지를 '매우 만족'부터 '매우 불만족', '해당 없음'까지 응답 분포로 담은 사회조사 집계표이며, 도시·농촌, 가구주 여부, 성별, 연령대 같은 응답자 구분(구분)별로 행이 나뉜 713바이트 크기의 작은 CSV 파일이다. 가족정책 담당자나 연구자가 '전북에서 어느 연령대·지역 주민이 부모와의 관계에 불만족 응답을 더 많이 하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 응답자 구분 이름을 맞추거나 같은 기관의 다른 사회조사 항목과 나란히 놓는 방식으로만 이어 쓴다.
limits: 건별 응답이 아닌 구분별 집계 비율이라 개인 단위 분석이나 시군 단위 비교는 할 수 없고, 시도 단위 비공간 자료라 지도에 바로 얹을 수 없다. 표준 코드 키가 없어 다른 데이터와 연결할 때 구분 명칭을 직접 매핑해야 한다.
