summary_user: 경주시의회 시의원 한 명당 한 행으로 성명, 정당, 선거구, 소속 위원회, 전화번호, 사진 주소, 데이터기준일을 담은 소규모 CSV 파일(약 2.8KB)이다. 시민이나 언론이 '우리 선거구 시의원은 누구이고 어느 정당·위원회 소속인가'를 확인하거나, 연구자가 경주시의회의 정당·위원회 구성을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 의원 성명이나 선거구 이름을 글자로 맞추거나 같은 기관(경주시) 기준으로만 이어 쓴다.
description_portal: 본 데이터는 경상북도 경주시에서 제공하는 시의원 현황 자료로서, 각 시의원의 성명, 선거구, 소속 정당, 연락처 등의 정보를 포함하고 있다. 데이터는 오픈 API 방식으로 제공되며, 공공데이터포털을 통해 손쉽게 접근할 수 있다. 이 자료는 경주시의 지방의회 구성 및 운영 실태를 이해하고자 하는 시민, 연구자, 언론인, 정책입안자 등이 활용할 수 있도록 체계적으로 정리되어 있다. 정기적으로 최신 정보로 갱신되며, 행정의 투명성과 책임성을 높이는 데 기여한다. 또한 지방자치와 주민참여 확대를 위한 기초자료로 활용될 수 있으며, 메타정보가 상세히 제공되어 검색과 활용에 있어 편의성을 높였다. 데이터는 XML 및 JSON 형태로 제공되어 다양한 시스템에 연계 가능하다.
