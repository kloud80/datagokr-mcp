summary_user: 경기도 시군별로 등록된 비영리민간단체를 단체 한 곳당 한 행으로 담은 원장으로, 단체명·대표자·등록일자·사업내용·담당 기관과 부서, 지번·도로명 주소와 위경도 좌표를 포함한다. 특정 시군에서 환경·복지·교육 분야로 활동하는 비영리단체가 어디에 얼마나 있는지 찾으려는 지자체 담당자, 공모사업 협력 대상을 고르려는 분석가가 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)로 다른 경기도 시군 단위 자료와 맞추거나, 위경도 좌표로 인근 공공시설과 공간적으로 겹쳐 본다.
description_portal: 경기도 내 시군별 비영리민간단체 현황으로, 소유주나 주주를 위한 자본의 이익을 추구하지 않고 공익적 목적을 중심으로 운영되는 단체 정보를 제공합니다. 항목은 시군명과 시군코드로 행정 구역을 구분하고, 기관명과 담당부서명으로 관리 체계를 명확히 하며, 단체명과 대표자, 단체등록일자를 포함해 설립과 운영의 기본 정보를 파악할 수 있습니다. 또한 사업내용을 통해 단체의 주요 활동 영역과 추진 사업을 확인할 수 있으며, 소재지는 우편번호, 지번주소, 도로명주소를 모두 제공해 위치 확인과 행정 활용에 용이합니다. 더불어 WGS84위도와 경도를 포함해 지도 시각화, 위치 기반 분석, 인근 공공시설과의 연계 활용이 가능하도록 지원합니다. 이 데이터는 자치행정과가 연간 단위로 갱신하며, 경기도의 공공 데이터 관리 체계를 기반으로 최신 정보를 반영합니다. 활용 예시는 비영리단체 분포 분석, 지역별 공익 활동 비교, 민간협력사업 대상 발굴, 공모 지원 단체 현황 파악 등이며, 사회복지, 환경, 교육, 문화 등 다양한 분야의 민간 활동을 통합적으로 살펴볼 수 있는 자료로 가치가 큽니다. 다만 단체명 변경, 해산, 통합 등 이력이 반영되기 전까지 시차가 존재할 수 있으므로 시점 분석 시 기준일자와 최종 수정일자를 함께 검토하는 것이 필요합니다.
