summary_user: 경기도 파주시의회에서 열린 회의를 회의 건별로 담은 파일 데이터로, 회의날짜·회의구분(임시회·정례회 등)·안건유무·회의명·차수와 회기 상세를 기록한다. 시민이나 분석가가 '파주시의회가 언제 어떤 회기와 차수로 회의를 열었고 안건이 있었는가'를 확인하거나 연도별 회의 횟수를 세는 데 쓴다. 전역 조인 키는 없어 다른 지자체 의회 회의 데이터나 의안 자료와는 회의날짜·회의명·회기 같은 이름 기준으로만 맞춰 이어 쓴다.
limits: 파주시 한 곳의 시군구 단위 자료라 다른 지역과 비교하려면 지자체별 자료를 따로 모아야 한다. 공통 코드나 식별자가 없어 다른 데이터와의 연결은 이름·날짜 매칭에 의존한다.
