description_portal: '○ 통계개요* 통계명 : 집회 및 시위* 통계종류 : 집회 및 시위 현황을 단체성격별로 제공하는 일반ㆍ보고통계* 작성목적 : 적법한 집회 및 시위를 최대한 보장하고 위법한 시위로부터 국민을 보호함으로써 집회 및 시위의 권리 보장과 공공의 안녕질서가 적절히 조화를이루도록 하는 것을 목적으로 함* 조사체계 : 서울지방경찰청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 집회 및 시위의 건수, 참가자수 등○ 용어설명* 옥외집회 : 천장이 없거나 사방이 폐쇄되지 아니한 장소에서 여는 집회를 말함* 시위 : 여러 사람이 공동의 목적을 가지고 도로, 광장, 공원 등 일반인이 자유로이통행할 수 있는 장소를 행진하거나 위력(威力) 또는 기세(氣勢)를 보여, 불특정한여러 사람의 의견에 영향을 주거나 제압(制壓)을 가하는 행위를 말함'
