description_portal: 대구광역시 북구_공공용 저단 현수막 게시대 현황은 2025. 05. 26. 기준 대구광역시 북구 관내 공공 사업 홍보 목적으로 사용되는 저단 현수막 지정 게시대의 연변, 지정 게시대명, 설치 위치, 수량, 설치시기에 대한 정보를 제공합니다.현재 대구광역시 북구 관내 공공용 현수막 저단 게시대는 10개소를 운영하고 있습니다.해당 내용의 정확한 연번, 지정 게시대명, 설치 위치, 수량, 설치시기는 첨부파일을 참고해 주시기 바랍니다.해당 저단 현수막 지정 게시대는 공공용의 각종 사업에 대한 홍보 목적으로 설치 및 운영 중이며, 별도 개인 상업 홍보 목적으로는 운영되고 있지 않습니다. 별도 상업 홍보 목적으로 이용되는 지정 게시대는 별도의 4,5단 게시대를 통해 운영되고있습니다.대구광역시 북구 외 공공목적으로 추진 중인 사업 내용은 해당 각 위치에 게시되어있는 현수막을 통해 확인하실 수 있습니다.
