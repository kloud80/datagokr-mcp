summary_user: 지방공기업별·연도별 신규채용 인원을 총인원과 청년(여성 포함), 이공계대졸, 기능인재(전문대·고졸), 여성, 장애인, 북한이탈주민 등 채용 유형별로 나눠 담은 전국 단위 경영공시 집계 자료다. 분석가나 구직자가 '어느 지방공기업이 청년·장애인·여성을 해마다 몇 명씩 새로 뽑았는가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 경영공시 자료와는 기관명(ENT_NAME)과 연도를 맞춰 이어 써야 한다.
