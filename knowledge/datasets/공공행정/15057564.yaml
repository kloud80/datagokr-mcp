summary_user: 지방자치단체별 당초예산(일반회계) 기준 재정자주도를 회계연도·자치단체 단위로 담은 집계 지표로, 자체수입(개편 전·후), 자주재원, 예산규모와 재정자주도(개편 전·후)를 제공하며 포털 설명상 2012회계연도부터 전국 자치단체를 다룬다. 분석가나 주민이 '우리 시·군·구는 중앙정부 이전재원에 얼마나 덜 의존하고 예산을 자주적으로 운영하나, 다른 지자체·광역평균과 비교하면 어떤가'를 따질 때 쓴다. 전역 조인 키는 없어서 다른 지방재정365 데이터와는 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm, 광역 wa_laf_cd)을 맞춰 연결한다.
description_portal: 재정자주도(당초)는 지방자치단체가 편성한 당초예산을 바탕으로 자체적으로 안정적인 재원을 통해 예산을 얼마나 자주적으로 운영할 수 있는지를 나타내는 지표입니다.이 지표는 지방자치단체의 세입 중 중앙정부나 다른 기관에서 지원받는 이전수입을 제외한 자체적인 세입이 차지하는 비율을 의미합니다. 재정자주도가 높을수록 자치단체가 중앙정부의 재정적 지원에 의존하지 않고 자체적으로 재정을 운영하는 능력이 뛰어나며, 이는 자치단체의 재정 독립성과 안정성을 평가하는 중요한 기준으로 활용됩니다.재정자주도(당초) 정보는 2012회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 자체수입(개편전), 자체수입(개편후), 자주재원, 자치단체예산규모, 재정자주도(개편전), 재정자주도(개편후) 항목이 제공됩니다.
