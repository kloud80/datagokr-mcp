description_portal: '[SGIS오픈플랫폼] e지방지표 서비스에서 지표 검색시 사용되는 세부 검색항목 목록입니다. 지표별 기본항목코드, 기본항목명, 기본항목순번, 우선표출여부를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. e지방지표  지역(시도/시군구)에 대한 종합적이고 객관적인 정보를 이용자들이 쉽고 편리하게 비교 및 이용 가능하도록 각 기관에서 생산하고 있는 지역의 주요통계를 한 곳에 모은 서비스'
