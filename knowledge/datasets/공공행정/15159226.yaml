summary_user: 2023년 인구주택총조사(센서스) 주택 자료를 전국 시군구 단위로 집계한 파일로, 시도·시군구별로 거처 종류, 주택면적 구간, 건축년도 구간에 따른 거처수를 담는다. 분석가나 지자체 담당자가 '우리 시군구에 지은 지 30년 넘은 소형 아파트가 몇 채인가'처럼 지역별 주택 재고의 유형·규모·노후도 구성을 파악하는 데 쓴다. 전역 조인 키(행정구역 코드)가 없어 시도명·시군구명 이름을 매핑해 행정구역 경계나 다른 시군구 통계와 이어 쓴다.
limits: 집계 자료라 개별 주택·건물 단위의 정보는 없고, 행정구역 코드 컬럼이 없어 이름 기준으로 연결할 때 시군구 명칭 변경·동명 시군구에 주의해야 한다. 포털 설명상 2023년 센서스 기준 자료이다.
