summary_user: 경상남도 창녕군 읍·면 행정복지센터를 한 곳당 한 행으로 담은 파일로, 명칭·도로명주소·위도·경도·전화번호·소속 팀 구성과 무인민원발급기 보유 여부·설치 위치를 개별 시설 단위로 담는다. 창녕군 주민이 가까운 읍·면사무소 위치와 연락처, 무인민원발급기를 쓸 수 있는 곳이 어디인지 찾을 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 센터 명칭·주소 이름 매핑이나 좌표(위도·경도)로 지도 위에 겹쳐 쓴다.
description_portal: 경상남도 창녕군의 행정복지센터(읍·면사무소) 현황입니다.1. 자치단체명, 행정복지센터명칭, 주소(도로명주소), 위도, 경도, 대표 전화번호, 소속 팀(계) 구성, 무인민원발급기 보유여부, 무인민원발급기의 상세 위치에 대한 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일 기준이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 행정복지국 행정과 정보전산팀 055-530-1243으로 문의 주시기 바랍니다.
