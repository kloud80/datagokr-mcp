summary_user: 서울시에 있는 약국을 한 곳씩 담은 인허가 원장으로, 인허가·취소일자, 영업상태와 상세영업상태, 폐업·휴업·재개업 일자, 사업장명, 지번·도로명주소, 좌표(X, Y), 약국영업면적, 지정일자를 함께 담는다. 분석가나 사업자가 '이 동네에 영업 중인 약국은 몇 곳이고 최근 몇 년 사이 어디서 문을 닫거나 새로 열었나'를 따져 보는 상권·보건의료 접근성 분석에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 주소·사업장명 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 다른 데이터와 잇고, 출처가 같은 LOCALDATA 인허가 데이터와 함께 상권 분석 원료로 쓴다.
limits: data.go.kr 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 받아 호출 경로에 넣어야 한다. 다른 데이터와 바로 붙일 공통 키가 없어 주소·이름 매칭 정확도를 따로 확인해야 한다.
