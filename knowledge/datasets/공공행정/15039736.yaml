summary_user: 평택시 관내 주택 외 건물의 시가표준액을 건물 한 건 단위로 담은 파일(csv, 약 7.6KB)로, 기준년도·건물형태·구조·지붕·지번주소·연면적·전용면적·공부상지목과 함께 산정된 금액을 담는다. 상가·사무실 등 비주거용 건물을 가진 사업자나 분석가가 '이 건물의 재산세·취득세 과세 기준 금액이 얼마인가', '같은 구조·용도 건물끼리 단위면적당 가치가 어떻게 다른가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(건물관리번호·PNU 등)가 없어, 다른 건축물·부동산 가격 데이터와는 지번주소(물건지지번주소) 문자열 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 경기도 평택시 관내의 주택 외 건물에 대한 시가표준액 현황을 정리한 자료로, 건축물의 용도와 구조, 면적 등에 따라 산정된 건물 자산 가치를 파악할 수 있는 정보를 제공합니다. 시가표준액은 「지방세법」 등에 근거하여 재산세, 취득세 등의 과세 기준이 되는 금액으로, 공정한 과세와 부동산 가치 산정을 위해 매년 고시됩니다. 본 데이터는 건물형태, 물건지지번주소, 연면적, 전용면적, 공부상지목, 시가표준액 등의 항목으로 구성되어 있으며, 다양한 유형의 비주거용 건물의 가치를 비교·분석하는 데 활용할 수 있습니다. 이 자료는 지방세 부과, 부동산 통계 분석, 재산 평가 및 행정계획 수립 등 다양한 행정 및 정책적 용도로 사용될 수 있습니다.
