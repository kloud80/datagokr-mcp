summary_user: 주택도시보증공사가 발급한 전세보증금반환보증을 발급년도·월, 17개 시도, 주택유형(아파트·오피스텔·연립·다세대·단독·다가구 등)별로 묶어 보증발급 건수와 보증금액을 담은 집계 파일이며, 범위는 전국이고 포털 설명상 2016년부터 수록한다. 분석가나 정책 담당자가 '어느 지역, 어떤 주택유형에서 전세보증 가입이 늘었는가'처럼 지역·유형별 전세보증 발급 추이를 볼 때 쓴다. 상품명(hug_guarantee_product)이 실측 조인 키여서 같은 키를 가진 주택도시보증공사의 다른 보증 상품 데이터와 이어 쓰고, 지역·주택유형·연월은 코드표 없이 이름으로만 되어 있어 다른 통계와 맞출 때는 이름 기준으로 대조한다.
description_portal: 우리 공사에서 취급하고 있는 지역별, 주택유형별 전세보증금반환보증(전세계약 종료 후 임대인이 임차인에게 반환해야하는 전세보증금의 반환을 책임지는 보증) 데이터로, 2016년부터 17개 시도별(서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주) 및 주택유형별(아파트, 오피스텔, 연립주택, 다세대주택, 단독주택, 다가구주택 등)로 전세보증금반환보증 보증발급 금액과 보증발급 건수 등으로 구성되어 있으니 통계 업무 등에 참고하시기 바랍니다. 감사합니다.
