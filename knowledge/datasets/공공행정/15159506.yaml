description_portal: 2026년에 제정·개정된 자치법규(조례, 규칙, 훈령 및 예규)에 관한 정보를 수집·정리한 데이터이다. 해당 데이터는 김천시에서 2026년도에 공포한 자치법규를 대상으로 구축되었으며, 자치법규의 제·개정 현황과 기본 정보를 체계적으로 제공하기 위한 목적을 가진다.데이터에는 자치법규의 명칭, 법규 구분(조례·규칙·훈령·예규), 제정·개정 유형(제정, 일부개정, 전부개정, 폐지 등), 공포일자, 소관부서 등의 정보가 포함되어 있으며, 김천시 자치입법 운영 현황과 법규 정비 흐름을 파악할 수 있도록 구성되어 있다. 자치법규안 및 세부 조문, 입법예고 내역 등 상세 내용은 자치법규정보시스템(https://www.elis.go.kr/)에서 확인할 수 있다.
