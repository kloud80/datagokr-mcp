legal_basis_portal: 본 데이터는 「지방자치법」에 따른 지방자치단체의 자치입법권 행사 과정에서 생산되는 공공데이터로, 지방자치단체가 제정·개정·폐지한 자치법규의 공포 및 관리 업무 수행 과정에서 생성·보유된다. 자치법규는 지방자치단체의 행정 운영과 주민 권리·의무에 직접적인 영향을 미치는 기준으로서, 각 지방자치단체는 자치법규의 제·개정 사항을 공포하고 체계적으로 관리하여야 한다.또한 「지방자치법」, 「행정 효율과 협업 촉진에 관한 규정」 및 각 지방자치단체의 자치법규 관리 규정 등에 따라 자치법규의 제·개정 이력, 공포일자, 시행일자, 소관부서 등의 정보를 지속적으로 관리하고 있으며, 해당 정보는 자치법규정보시스템(ELIS)을 통해 통합적으로 제공·관리되고 있다.
