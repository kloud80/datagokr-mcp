summary_user: 전국 지방자치단체의 세출을 세부사업 단위로 담은 원장성 데이터로, 회계연도·자치단체·회계구분·분야·부문별로 세부사업명, 집행일자, 예산현액과 국비·시도비·시군구비·기타 재원, 지출액 등을 2016회계연도부터 제공한다. 주민이나 지방재정 분석가가 "우리 구가 올해 어떤 세부사업에 예산을 얼마 편성하고 실제로 얼마 집행했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방재정365 데이터와는 자치단체 코드(laf_cd)·회계연도·세부사업 코드 같은 같은 기관 코드 또는 이름 매핑으로만 연결한다.
description_portal: '지방자치단체의 분야별 세출 현황은 각 지방자치단체가 예산을 어떻게 활용하고 있는지를 보여주는 지표로 세출현황은 공공 서비스 제공을 위한 지출을 다양한 분야로 분류하여 관리되고 있습니다. 이러한 세출 현황은 자치단체의 재정 운영의 효율성을 평가하고, 각 분야에서의 재정 지원이 어떻게 이루어지는를 분석한 자료입니다.(분야별 분류 : 일반공공행정, 교육, 문화 및 관광, 환경, 사회복지, 보건등)세부사업별 세출현황 정보는 2016회계연도부터 제공됩니다. 제공되는 세부항목은 자치단체별 회계구분명, 세부사업명, 집행일자, 예산현액 등 항목입니다.'
