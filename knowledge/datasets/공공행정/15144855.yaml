description_portal: '이 데이터는 과천시의회 홈페이지에 게시된 각종 게시글의 통합 정보를 담고 있습니다. 고유식별번호는 각 게시글을 유일하게 구분할 수 있도록 하며, 게시판명은 게시글이 등록된 게시판의 종류(예: 공지사항, 보도자료 등)를 나타냅니다. 공지사용여부는 해당 글이 상단에 고정된 공지인지의 여부를, HTML사용여부는 게시글 내용에 HTML 형식을 적용했는지 여부를 나타냅니다. 조회수는 게시글 열람 횟수를 나타내고, 작성일시는 게시글이 실제 등록된 일시를 의미합니다. 이 데이터는 시민 참여와 정보 접근성을 높이기 위한 기반 자료로 활용될 수 있습니다.보다 정확한 정보는 과천시의 홈페이지(https://www.gccouncil.go.kr/)를 통해 확인하실 수 있습니다.※공개여부가 "Y"인 데이터에 한하여 공개됩니다.'
