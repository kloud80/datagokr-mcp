description_portal: 전라남도 영광군에서 운영하는 ARS(자동응답시스템) 지방세 납부 시스템에 관한 데이터로, 비대면 음성 ARS를 통한 지방세 자동 납부 처리 흐름 및 수납 이력 전반에 대한 정보를 담고 있습니다. 주요 제공 항목에는 수납정보, 통신사 정보, 납부에 사용된 신용카드 정보, 선택 납부 시간대 및 납부 방식, 세목 코드별 선택 납부 상세내역, 수납 상세이력, 세목별 분류정보 등이 포함되며, 전자납부 처리 현황을 체계적으로 분석하는 데 활용됩니다. 이 데이터는 납부 채널별 수납 비율 파악, 민원 편의성 향상, 세무행정 효율화, 비대면 자동납부 시스템 개선, 수납 오류 방지 및 응답 시스템 개선 등 전자지방세 행정 품질 제고에 필요한 기반 자료로 활용 가치가 높습니다.
