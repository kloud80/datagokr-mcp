summary_user: 경기도 내 개방 공공시설을 시설 한 곳씩 담은 목록으로, 시설명·유형, 평일·주말 운영시간과 휴무일, 유료 여부와 사용료·초과 사용료, 수용인원·면적, 부대시설, 신청방법, 관리기관·담당부서·연락처, 도로명·지번 주소와 위도·경도를 담는다. 도민이나 단체가 '우리 동네에서 주말에 빌릴 수 있는 강당이나 회의실이 어디이고 요금은 얼마인가'를 찾을 때, 또는 지자체가 시설 개방 현황을 점검할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 관리기관명·주소 같은 이름 매핑이나 위도·경도(refine_wgs84_lat/logt) 기반 위치 결합으로만 잇는다.
description_portal: 이 데이터는 경기도 내 공공시설의 개방 현황을 정리한 자료로, 개방된 시설의 명칭, 운영시간, 이용요금, 수용인원, 부대시설 정보 등을 제공합니다. 주요 항목으로는 개방시설명, 개방장소명, 개방시설유형구분, 평일운영시작시각, 평일운영종료시각, 주말운영시작시각, 주말운영종료시각, 유료사용여부, 사용료, 수용가능인원수, 면적, 부대시설정보, 신청방법구분, 관리기관명, 담당부서명, 사용안내전화번호, 홈페이지주소, 소재지도로명주소, 소재지지번주소 등이 포함되어 있습니다. 이 데이터는 경기도민 및 일반 시민이 공공시설을 효율적으로 이용하도록 지원하며, 행정기관의 시설 운영관리, 예약 시스템 구축, 민원 응대 및 시설 이용 활성화 정책 수립 등에 활용할 수 있습니다. 또한 각 시설의 위도와 경도 정보가 포함되어 있어 위치기반 서비스와 연계한 활용도 가능합니다.
