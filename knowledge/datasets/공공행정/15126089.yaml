summary_user: 국회의원 한 명당 한 행으로 영문 이름, 생년월일, 소속 정당, 선거구와 선거구 구분, 소속·대표 위원회와 위원회 직책, 당선 횟수(재선 구분), 연락처·이메일·홈페이지를 영문으로 담은 명부형 데이터이며, 범위는 전국이고 공간 정보는 없다. 해외 기관·외국인 연구자·통번역 실무자가 '특정 의원의 영문 표기와 소속 위원회·정당은 무엇인가'를 확인하거나 영문 자료에 의원 정보를 표기할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국문 국회의원 정보 등 다른 데이터와는 의원 이름·정당명·선거구명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
