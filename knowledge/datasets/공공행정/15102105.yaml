description_portal: 본 데이터는 대구광역시 수성구에서 제작한 구정 홍보영상을 모아 제공하는 자료이다. 해당 영상은 수성구의 주요 정책, 행정서비스, 지역 행사 및 생활 정보 등을 주민에게 알기 쉽게 전달하기 위해 제작된 것으로, 다양한 연령대와 계층이 행정 정보를 쉽게 접할 수 있도록 구성되어 있다. 데이터는 영상의 제목, 제작 시기, 주제, 활용 목적 등의 메타정보와 함께 제공될 수 있으며, 수성구의 구정 운영 방향에 대한 이해를 높이고 주민 참여를 유도하는 데 활용된다. 또한 행정의 투명성 제고 및 열린 소통 강화를 위한 미디어 콘텐츠로서, 교육·홍보·자료 활용 등 다양한 행정 목적에 사용 가능하다. 본 자료는 지속적으로 업데이트되어 최신 구정 소식을 반영하고 있다.https://www.suseong.kr/index.do?menu_id=00000191 에서 바로 볼 수 있습니다.
