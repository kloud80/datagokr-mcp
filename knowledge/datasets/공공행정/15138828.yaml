description_portal: 2025년 12월 말 기준 부산광역시 동구 행정동별 65세이상 1인 가구 수에 대한 데이터로 남성 65세 1인 가구 수, 여성 65세 1인 가구 수를 제공하고 있는 자료입니다.부산광역시 동구 각 행정동의 고령층 인구 분포를 파악할 수 있도록 구성되어 있으며,전체 65세 이상 1인 세대수뿐만 아니라 남성 및 여성 1인 세대 수를 구분하여 제공합니다.이를 통해 동별 고령층의 성별 구성과 고독사 위험도, 돌봄 수요 등 지역사회 복지정책 수립에 필요한 기초 정보를 확인할 수 있습니다. 취약계층 대상 복지서비스 계획, 방문 돌봄 인력 배치, 고령친화 환경 조성, 지역사회 안전망 구축 등 다양한 행정 및 연구 목적으로 활용될 수 있으며, 고령 인구 증가에 따른 정책 대응을 위한 중요 통계자료로서 활용 가치가 있습니다。
