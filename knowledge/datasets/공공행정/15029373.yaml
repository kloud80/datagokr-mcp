summary_user: 인천광역시 연수구 6개 행정동(옥련동·선학동·연수동·청학동·동춘동·송도동)의 면적을 2000년부터 2025년까지 5년 단위로 정리한 동별 집계표로, 349바이트 크기의 작은 CSV 파일이다. 연구자나 정책 담당자가 송도동처럼 특정 동의 면적이 매립·개발로 얼마나 늘었는지, 동별 인구밀도를 계산할 기초 면적이 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 동 이름(토지소재지)을 기준으로 주민등록 인구 등 다른 동별 통계와 이름 매칭으로 이어 쓴다.
description_portal: '이 자료는 인천광역시 연수구의 행정구역별 면적 변화를 한눈에 파악할 수 있도록 2000년부터 2025년까지 5개년 단위로 정리한 통계 데이터입니다. 각 연도별로 동(행정동) 단위 면적이 수록되어 있어, 도시계획, 행정구역 조정, 인구밀도 분석, 지역개발 전략 수립 등의 기초자료로 활용이 가능합니다. 또한 시계열 비교를 통해 특정 동의 성장 추이, 도시 확장 및 행정구역 변동 여부를 파악할 수 있어 학술연구나 공공정책 수립에도 유용합니다. 본 데이터는 연수구 내 공간정보 및 행정구역 변화에 관심 있는 연구자, 정책입안자, 지역주민 등 다양한 수요자의 정보 활용을 지원합니다.(행정구역(동)명 : 옥련동, 선학동, 연수동, 청학동, 동춘동, 송도동)'
