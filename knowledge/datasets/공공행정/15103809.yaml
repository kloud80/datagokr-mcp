description_portal: 한국동서발전의 연도별 자활용사촌 생산품 구매 현황 정보는 공기업의 사회적 가치 실현을 위한 구매 활동 내역을 연도별로 기록한 데이터입니다.해당 데이터는 연도, 자활용사촌 구매금액(천 원), 기타 구매금액(천 원), 자활용사촌 구매 비율(%), 구매 품목 수 등의 항목으로 구성되어 있으며, 자활용사촌(자활기업 또는 유관 사회적경제 조직 등)을 통한 제품 구매 실적을 수치화하여 제공합니다.이 데이터는 한국동서발전이 공공기관으로서 자활기업과의 거래를 통해 지역경제 및 취약계층 일자리 창출에 얼마나 기여하고 있는지를 정량적으로 파악하는 데 활용될 수 있습니다.학계 및 연구기관에서는 이 데이터를 기반으로 공공기관의 사회적경제조직 지원 성과 분석, 자활기업과의 구매 연계성 비교, 연도별 지원 확대 추세 분석 등을 수행할 수 있습니다.또한 사회적 가치 실현 지표 개발, 공공조달 정책 개선 방향 제시, ESG 경영 실천 수준 평가 등에도 활용 가능하며, 타 공기업과의 유사 지표 비교를 통해 사회책임 조달 실적의 상대적 우수성을 분석할 수 있습니다.
