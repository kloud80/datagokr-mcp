description_portal: '○ 통계개요* 통계명 : 인구이동(동별)* 통계종류 : 서울시 인구이동 현황을 동 단위로 제공하는 지정ㆍ보고통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국 국민의 지역별 인구이동량 및 이동방향 등을 파악하여 지역간의균형적 국토개발,교통,교육 및 주택 등의 정책수립 자료와 지역별 인구추계에필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 동별ㆍ성별, 시도내ㆍ시도간 이동 인구수 등'
