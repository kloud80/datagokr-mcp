summary_user: 인천광역시 영종구 지방의회에 접수된 의안을 한 건씩 담은 원천 파일(csv, 약 48KB)로, 대수·의안번호·의안명·제안자·제안일자와 본회의 보고·상정·처리일, 본회의 처리결과, 구청 이송일, 처리회기를 담는다. 주민이나 지역 분석가가 "이번 대수 영종구의회에서 어떤 조례안이 누구 제안으로 언제 가결돼 구청으로 넘어갔나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방의회 의안정보나 법령 데이터와는 의안명·대수 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
