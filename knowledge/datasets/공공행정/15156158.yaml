summary_user: 정부입법지원센터가 법령을 분야별로 나누는 데 쓰는 법분야 분류체계를 코드값과 분야명, 사용·삭제 여부로 담은 코드표 파일이다(csv, 약 1.6KB). 입법 업무 담당자나 분석가가 '이 법분야코드는 어떤 분야를 뜻하고 지금도 쓰이는가'를 확인하거나 분야별 법령 현황을 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 정부입법지원센터의 다른 법령·입법 데이터와는 법분야코드나 법분야명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 정부입법지원센터에서 관리하는 법령의 법분야 분류체계를 코드화한 정보를 제공하는 자료입니다. 각 법령이 속하는 분야를 표준화된 코드로 구분하여 관리함으로써, 법령 간 구조적 관계를 명확히 파악하고 분야별 법령 현황을 체계적으로 분석할 수 있도록 구성되어 있습니다. 법분야코드는 법령의 제·개정, 심사, 연구 등 다양한 입법업무에서 활용되는 기본 분류체계로서, 법령정보의 체계성·일관성을 유지하기 위한 핵심 기반 데이터입니다.중장기 개방계획에 따라 법분야 정보를 공공데이터로 개방합니다.
