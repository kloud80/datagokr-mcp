summary_user: 공매정보 포털 온비드의 신규 회원가입 수를 날짜(일자)별로 집계한 파일로, 자산을 처분하는 이용기관(국가기관·지자체·학교·공공기관 등)과 자산을 사는 일반회원의 가입 수, 그 합계를 요일과 함께 담으며 포털 설명상 2018~2025년을 전국 단위로 수록한다. 공매·자산관리 분석가가 '연도별·요일별로 온비드 신규 이용자가 어떻게 늘었고, 매각 기관 쪽과 매수자 쪽 가입 추이가 어떻게 다른가'를 볼 때 쓴다. 전역 조인 키는 없고 날짜만 공통 축이므로, 같은 기관의 온비드 공매 공고·낙찰 통계 같은 다른 시계열과 날짜 기준으로 맞춰 보는 방식으로만 이어 쓴다.
limits: 전국·비공간 집계라 지역별·기관별 가입 내역은 알 수 없고, 다른 데이터와 코드로 조인할 수 있는 키가 없어 날짜나 이름 매핑으로만 연결된다. 일별 신규 가입 수만 담아 누적 회원 수나 탈퇴·활동 회원은 이 데이터로 알 수 없다.
