description_portal: '[SGIS 오픈 플랫폼] "지방의 변화보기" 서비스의 카테고리 및 지표별 범례 정보입니다.상세지표 조회시 지도에 표시되는 범례에 적용할 색상 정보를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 지방의 변화보기  통계적으로 지방(시군구)의 변화하는 모습을 제공하는 서비스'
