description_portal: 경기도 양평군 공유재산 사용허가 및 대부현황자료입니다.공유재산 사용허가 및 대부현황은 지방자치단체가 보유한 행정재산과 일반재산을 효율적으로 활용하기 위해 실시하는 관리 체계이다. 사용허가는 주로 공익적 목적이나 법령에서 정한 용도에 따라 일정 기간 사용을 허용하는 제도이며, 대부는 일반재산을 유상으로 임대하여 민간이 활용할 수 있도록 하는 절차를 말한다. 각 재산은 위치, 면적, 용도, 대부료, 계약 기간 등 세부현황을 체계적으로 관리하며, 연장·변경 시에는 관련 법령과 조례에 따라 재심사가 이루어진다. 이러한 현황 관리는 재산의 효율적 활용과 투명성 확보에 중요한 역할을 한다.
