description_portal: 옥외광고물의 설치·허가·신고·관리 업무에 활용하기 위해 도로명주소 기반의 신우편번호(5자리 체계) 정보를 정리한 자료입니다.신우편번호는 기존 지번 중심의 구 우편번호 체계를 개선하여 도로명주소와 연계한 공간단위로 구성되므로, 옥외광고물의 정확한 위치 식별과 행정구역 기준의 일관성 유지에 매우 중요한 역할을 합니다.광고물 설치지의 신우편번호, 도로명주소·지번주소 매핑 정보, 법정동·행정동 코드 연계, 건물번호 및 건물구분 값 등 주소 관련 기본 공간정보를 포함하고 있습니다.이를 통해 광고물 관리대장 작성, 허가·신고 처리, 현장 점검, GIS 기반 지도 시스템 연동 등 다양한 행정업무에서 설치 위치를 정밀하게 식별할 수 있도록 설계되었습니다.
