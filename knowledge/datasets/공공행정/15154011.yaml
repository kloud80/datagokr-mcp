description_portal: '이 표는 구의회의 여러 대수(구의회를 구성하는 각각의 임기나 기)를 기준으로, 각 대수마다 여러 회기(의회가 실제로 운영되는 기간)별로 구체적인 정보를 정리한 자료입니다. 표에는 각 대수(예를 들어, 제1대, 제2대 등)와 해당 대수에서 열린 각각의 회기(예: 제1회, 제2회 등)의 "시작일"과 "종료일"이 각각 정확히 날짜로 기재되어 있습니다. 이를 통해, 각 회기가 언제 시작해서 언제 끝났는지 한눈에 확인할 수 있습니다.또한, 각 회기별로 ‘임시회’와 ‘정례회’처럼 회의의 성격에 따라 구분해 놓았습니다. ‘임시회’는 특정 사안이나 필요에 의해 수시로 열리는 회의이고, ‘정례회’는 매년 정해진 일정에 따라 정기적으로 개최되는 공식 회의를 의미합니다. 이런 구분을 통해 표를 보는 사람은 특정 대수의 어떤 회기가 임시회였는지, 혹은 정례회였는지도 알 수 있습니다.'
