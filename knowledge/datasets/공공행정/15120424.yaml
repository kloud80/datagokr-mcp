description_portal: '강원특별자치도 강릉시 내 버스카드(교통카드) 충전소 현황을 제공하는 데이터로, 시민과 관광객이 버스카드를 충전할 수 있는 지점을 상호명·주소·좌표 기준으로 확인할 수 있습니다.주요 항목은 다음과 같습니다.상호명: 버스카드 충전이 가능한 가게·편의점·약국 등 영업점의 이름전화번호: 해당 충전소에 직접 문의할 수 있는 연락처상세위치: 도로명 주소 또는 지번, 건물명·층수 등 구체적인 소재지 정보좌표(위도), 좌표(경도): 지도 서비스(GIS, 내비게이션 등)에서 위치를 바로 확인할 수 있는 공간 좌표읍면동: 충전소가 위치한 행정구역(읍·면·동) 명칭이 데이터는 버스카드 충전소의 명칭–연락처–상세주소–좌표–행정구역 정보를 함께 제공하여,지도 기반 버스카드 충전소 위치 서비스(웹·앱) 구현대중교통 이용 편의성 분석 및 충전 인프라 취약 지역 파악읍·면·동별 생활편의시설 분포 현황 분석관광객·신규 전입자 대상 교통편의 안내 자료 구축등에 활용할 수 있는 대중교통·생활편의 인프라 현황 공공데이터입니다.'
