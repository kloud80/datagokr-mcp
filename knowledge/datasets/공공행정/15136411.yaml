summary_user: 경기공유서비스(공유누리 계열)에서 제공하는 행정상담서비스별 운영 시간 정보를 운영시간 일련번호 단위로 담으며, 행정서비스 번호·제공기관 코드·예약 분야명·상담 분야·운영 요일 구분·등록일·최종수정일로 구성된 목록이다. 행정상담을 받으려는 국민이 '어느 기관의 어떤 분야 상담이 무슨 요일에 운영되는가'를 확인하거나, 분석가가 기관별 상담 운영 요일 분포를 살피는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았고, 같은 경기공유서비스 데이터와는 행정서비스 일련번호(administ_servc_sn)나 기관 코드(inst_cd)로, 그 밖의 데이터와는 기관명·코드 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 공공기관에서 제공하는 행정상담서비스의 운영시간 정보를 포함한 자료로, 각 행정서비스에 대한 일련번호, 제공기관의 코드, 상담 분야, 상담 가능 요일 구분, 등록일자 및 최종수정일 등의 항목으로 구성되어 있습니다. '요일구분'은 해당 상담서비스가 운영되는 요일을 나타냅니다. 데이터는 공공서비스 이용자에게 상담 가능 시간 및 분야 정보를 명확히 제공하여 행정 접근성을 높이고, 각 기관의 상담 운영 효율성을 높이기 위한 기반 자료로 활용됩니다. 또한, 예약시스템과 연계하여 시간별·요일별 상담 매칭을 자동화하거나, 상담자 수요 분석을 통한 서비스 개선에도 활용될 수 있습니다.
