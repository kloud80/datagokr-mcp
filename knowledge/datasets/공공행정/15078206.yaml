description_portal: '120바로콜센터 키워드 정보는 시민들이 전화 상담을 통해 문의하는 다양한 민원 내용을 빠르고 정확하게 안내하기 위해 상담사가 지능형상담정보시스템을 활용하여 검색하는 핵심 단어와 문구를 말합니다.이 키워드 정보는 콜센터 상담 데이터와 민원 유형을 기반으로 사전에 구축되어 있으며, 상담사가 질문을 받는 즉시 키워드를 입력하면 관련 법령, 행정절차, 담당 부서 정보, 자주 묻는 질문(FAQ) 등을 빠르게 찾아볼 수 있도록 구성되어 있습니다. 예를 들어, 시민이 “주정차 단속 시간은 언제인가요?”라고 물으면 상담사는 ‘주정차’, ‘단속 시간’과 같은 키워드를 검색해 표준 답변과 담당 부서 정보를 바로 확인할 수 있습니다.이러한 키워드 정보는 다음과 같은 특징을 가집니다.민원 분류별 정리: 교통, 환경, 복지, 세금, 상수도 등 분야별 키워드 구성실시간 검색 지원: 상담 중 필요한 정보를 신속하게 조회 가능표준화된 답변 제공: 동일한 질문에 일관성 있는 안내 가능데이터 기반 개선: 검색 빈도와 상담 이력을 분석해 키워드 지속 보강즉, 키워드 정보는 상담사가 민원인의 질문을 정확히 이해하고, 즉각적으로 필요한 정보를 찾아 시민에게 안내할 수 있도록 돕는 핵심 도구이자 상담 품질을 높이는 기반 자료입니다.'
