description_portal: '거창군의 읍·면별 차량 등록 현황은 지역의 인구 밀집도, 경제 활동 수준, 그리고 교통 인프라의 특성을 그대로 반영합니다. 2026년 현재를 기준으로 거창군의 차량 등록 데이터에서 읽을 수 있는 주요 특징은 다음과 같습니다.1. 거창읍 중심의 집중 현상거창군 전체 차량의 약 60~70%가 거창읍에 집중되어 있습니다. 이는 행정, 상업, 교육 시설이 밀집된 읍 지역의 특성상 세대당 차량 보유 대수가 높고, 직장인들의 통근 차량이 많기 때문입니다. 특히 중·대형 승용차와 전기차 등록 비중이 다른 면 지역에 비해 월등히 높습니다.2. 면 지역의 실용적 차량 구성가조면, 위천면, 마리면 등 주요 면 지역은 농업용 화물차(트럭)와 특수 차량의 비중이 상대적으로 높습니다.화물차: 농산물 운반 및 자재 수송을 위한 1톤 트럭 위주의 등록이 많습니다.고령화 반영: 인구 감소와 고령화로 인해 승용차 증가율은 정체되어 있으나, 이동 편의를 위한 경차나 실버 세대용 차량 등록은 꾸준히 유지됩니다.3. 친환경차 및 정책적 변화최근 거창군은 탄소중립 정책에 따라 전기차 및 수소차 보급이 확대되고 있습니다. 읍 지역을 중심으로 공공 충전 인프라가 확충되면서 친환경 승용차 등록이 매년 두 자릿수 이상의 성장률을 보이고 있으며, 농촌 지역에서도 노후 경유차 조기 폐차 지원 사업을 통해 차량 세대교체가 활발히 이루어지고 있습니다.'
