summary_user: 공정거래위원회가 공개하는 지주회사 설립·전환 신고현황을 지주회사 단위로 담은 API로, 설립전환일·자산총액·지주비율·부채비율과 자회사·손자회사·증손회사 수 및 상장 수를 제공하며 전체 2,820건, 기간은 2001-04-03~2020-11-02이다. 투자자나 언론, 분석가가 특정 지주회사의 규모와 지배구조(지주비율·부채비율, 계열 단계별 회사 수)가 어떤지 확인하는 데 쓴다. 법인등록번호(jurirno)와 사업자등록번호(bizrno)로 같은 번호를 쓰는 기업집단 등 다른 공정거래위원회 공시 데이터와 이어 쓴다.
description_portal: '지주회사 정보 공개년월과 기업집단코드, 법인등록번호를 기준으로 지주회사에 속한 자손회사의 설립전환일, 자산총액, 지주비율, 부채비율, 자손회사 수/상장수 등 지주회사 설립/전환 신고현황 정보를 조회하는 서비스.※ 당해년도 정보 제공 시기 : 당해년도 6월, 12월※ 대상 지주회사는 4월(1차) 및 7월 또는 9월(2차)에 관련 자료를 제출하고, 검토 시기를 거쳐 각각 6월(1차 제출자료), 12월(2차 제출자료)에 정보 제공※ 요청년월(공개년월 또는 지정년월) : [사용 가능한 공개년월 조회 서비스(publicYmList)] API 를 활용하여 이 서비스(API)를 이용하기 전에 사용 가능한 년월을 확인 후 이용하시기 바랍니다.'
