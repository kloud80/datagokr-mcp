summary_user: 한국서부발전이 업무 과정에서 생산한 문서를 한 건씩 문서제목·생성일·문서번호·작성부서로 기록한 건별 목록 파일(CSV, 약 3.2MB)이다. 분석가나 국민이 '특정 부서가 어떤 시기에 탈질설비 안전점검이나 환경 관련 문서를 만들었는가'처럼 기관의 업무 이력을 확인하고 정보공개청구 대상 문서를 고르는 데 쓴다. 문서번호(ewp_doc_no)가 조인 키이지만 다른 기관 데이터와 공유하는 코드표는 없어서 같은 기관의 다른 문서 자료와 맞춰 보는 정도로 쓴다.
description_portal: 한국서부발전에서 생산된 문서정보를 제공합니다. 한국서부발전에서 생성된 생산문서 목록 데이터는 기관의 주요 업무 과정에서 작성·관리되는 다양한 문서를 체계적으로 정리한 자료입니다. 이 데이터에는 기획보고서, 사업계획서, 회의록, 연구·기술 보고서, 환경영향평가 자료, 예산 집행 내역, 성과보고서 등 각종 행정·경영·기술 관련 문서가 포함됩니다. 목록에는 문서명, 생성일, 문서번호, 작성부서 등이 기록되어 있어 문서 관리의 효율성과 투명성을 높일 수 있습니다. 또한 생산문서 데이터는 기관의 업무이력과 의사결정 과정을 추적할 수 있는 중요한 근거자료가 되며, 내부 지식 자산 관리와 감사·평가 업무에도 활용됩니다.데이터 예) [탈질설비]고압가스 저장시설 안전점검표,2019-01-01,평(환)-1,환경화학부
