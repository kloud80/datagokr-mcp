description_portal: 서울시설공단에서 업무용으로 사용하고 있는 본부별 차량 현황입니다.  공단 내 본부는 총 6개 본부로 구성되어있으며, 데이터 활용 편의를 위해 각 본부별 차량 현황 데이터를 제공하고 있습니다.또한, 해당 데이터는 업무 수행을 위해 보유하고 있는 차량에 대한 정보를 정리한 데이터로 아래 항목으로 구성되어있습니다.업무용 차량은 승용차량, 승합차량, 화물차량, 특수 및 건설기계로 공단 업무 수행을 위해 사용하고 있습니다.참고로 건설기계의 경우 차량은 아니나, 데이터 집계 편의를 위해 포함하였습니다.
