summary_user: 부산광역시 남구청과 17개 동 행정복지센터, 남구 보건소, 남구 도서관의 기관명·주소·대표전화번호를 기관 1곳당 1행으로 담은 작은 CSV 파일(1,597바이트)이다. 남구 주민이 특정 동 행정복지센터의 위치나 대표전화를 찾을 때, 또는 분석가가 남구 관공서 목록을 지도에 올릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소 문자열을 맞춰 이어야 하며, 좌표가 필요하면 주소를 지오코딩해 공공시설·무인민원발급기 표준데이터와 겹쳐 본다.
description_portal: 부산광역시 남구에 있는 행정기관인 남구청과 17개동 행정복지센터(대연1동, 대연3동, 대연4동, 대연5동, 대연6동, 용호1동, 용호2동, 용호3동, 용호4동, 용당동, 감만1동, 감만2동, 우암동, 문현1동, 문현2동, 문현3동, 문현4동), 남구 보건소, 남구 도서관(임시휴관)의 주소 및 대표전화번호에 대한 자료입니다.2025년 12월 용호2동행정복지센터 이전으로 주소가 부산광역시 남구 용호로197번길 41에서 부산광역시 남구 용주로 12로 변경되었습니다.남구도서관은 임시휴관 중으로 2026년 3월 재개관 예정입니다.
