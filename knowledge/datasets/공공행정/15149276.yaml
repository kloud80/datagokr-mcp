description_portal: 위원회는 집행기관의 행정조직에 대응하여 설치되며 소관의안과 청원 등을 심사처리하는 상임위원회와 특정안건심사ㆍ처리를 위한 특별위원회가 있으며 강북구의회는 3개 상임위원회가 구성되어 있으며 특별위원회는 필요시 본회의 의결로 설치됩니다.특별위원회는 특정한 안건을 심사 처리하기 위하여 필요한 경우에는 본회의 의결로써 설치 운영하고 있으며, 특별위원회는 그 위원회에서 심사한 안건이 본회의에서 의결될 때까지 존속하며, 특별위원의 임기는 위원회의 존속기간으로 합니다.서울특별시 강북구 구의회 위원회 데이터는 연번,분류,위원회 명칭,구성인원,위원장,부위원장,소관사무,데이터기준일자로 구성되어 있습니다.
