summary_user: 국회 본회의에서 처리된 예산안을 안건 한 건 단위로 담으며, 대수(AGE)·의안번호·의안명, 처리결과, 투표 수(총·찬성·반대·기권), 제출·상정·처리일 같은 심사 단계별 날짜, 소관위원회를 함께 담는다. 분석가나 국민이 "이번 대 국회에서 예산안·추경안이 언제 본회의를 통과했고 찬반 표결은 어땠나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 국회사무처의 다른 의안 데이터와 의안ID(BILL_ID)·의안번호·위원회ID 같은 기관 내부 코드나 이름 매핑으로만 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
