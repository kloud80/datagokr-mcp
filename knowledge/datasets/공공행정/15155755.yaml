description_portal: 한전KDN 청렴마일리지 항목 정보는 임직원의 청렴활동 참여 현황을 체계적으로 관리하기 위해 운영되는 청렴마일리지 제도의 세부 구성 항목을 정리한 데이터입니다. 본 데이터에는 각 활동에 대한 평가항목, 세부평가기준, 배점, 적용대상 등이 포함되어 있으며, 청렴교육 이수, 윤리경영 실천, 부패방지 자율과제 수행 등 다양한 청렴 관련 활동을 정량적으로 평가할 수 있도록 설계되었습니다. 이를 통해 조직 구성원의 청렴활동 참여도와 실천 수준을 분석하고, 부서별·직군별 활동 현황을 비교하여 청렴문화 확산을 위한 정책 개선에 활용할 수 있습니다. 또한 내부 평가체계 운영, 윤리경영 지표 관리, 청렴도 제고 방안 마련 등 기관의 청렴경영 기반 마련에 중요한 기초자료로 사용됩니다. 데이터는 CSV 형식으로 제공되며, 엑셀 및 데이터 분석 도구에서 손쉽게 활용할 수 있도록 구성되어 있습니다.
