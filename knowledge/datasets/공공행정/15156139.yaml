description_portal: 광주광역시관광공사가 제공하는 본 데이터는 관내 관광객과 시민의 주차 편의를 높이고 다양한 문화·행사 참여를 지원하기 위하여 공사가 관리하는 주차장 현황을 종합적으로 공개한 자료이다. 주차장 명칭, 주차구획수, 부제 시행 여부, 기본요금, 운영시간, 결제 방식, 특기사항 등 이용 판단에 필요한 핵심 정보가 포함되며, 전시·콘서트 등 주요 행사 방문 시 주변 주차 가능성을 사전에 확인할 수 있는 기초자료로 활용될 수 있다. 또한 옥내·야외 등 시설 유형과 위치 특성을 체계적으로 분류하여 관광지 접근성 분석과 교통관리 정책 수립에 기여할 수 있으며, 이를 통해 시민과 방문객의 이동 편의성을 높이는 데 활용될 것으로 기대된다.
