description_portal: 경기도 하남시에서 운영중인 민원상담 챗봇 사용자 현황입니다. 하남챗봇은 시민들이 모바일을 통해 민원 신청 및 행정정보 열람을 가능하게 하여 편의성 향상을 도모하며 민원, 행정, 경제, 문화, 등 총 120개 시나리오로 구성되어 있습니다.하남시 챗봇 사용자 현황 데이터는 디지털 행정서비스의 실제 이용 추이를 월별로 보여주는 시계열 자료로, 시민과의 비대면 민원 접점 확대 여부를 파악하는 데 매우 유용합니다. 향후 사용자 문의 유형, 응답 시간, 만족도와 연계되면 AI 기반 응답 최적화 및 민원 행정 자동화에도 활용 가능합니다.
