description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지에 등록된 공매 물건의 입찰 결과에 대한 상세 정보를 조회할 수 있는 서비스입니다. 물건 입찰결과목록 서비스에서 제공되는 물건관리번호(cltrMngNo), 공매조건번호(pbctCdtnNo)를 이용하여 상세한 정보를 조회할 수 있습니다. 공매 물건(부동산, 동산, 자동차)의 입찰 결과(pbctStatCd)가 낙찰(0010), 유찰(0011), 취소(0012)인 물건의 상세 정보만 조회 가능합니다.  필수 입력 조건 :  물건관리번호(cltrMngNo)'
