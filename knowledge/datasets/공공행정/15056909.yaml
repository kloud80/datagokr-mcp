summary_user: 지방자치단체별로 한 해 세출예산 가운데 연말에 집행된 금액과 그 비율(연말지출비율)을 회계연도 단위로 담은 전국 범위의 집계 지표이며, 세부사업 단위 원장이 아니다. 주민이나 지방재정 분석가가 "우리 지자체는 예산을 연말에 몰아 쓰는 편인가, 다른 지자체와 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없어 회계연도(fyr)와 지자체 코드·이름(laf_cd, 상위 지자체 wa_laf_cd)을 기준으로 같은 지방재정365의 다른 지표와 이름·코드 매핑으로만 이어 쓴다.
description_portal: 연말지출비율은 정부나 지방자치단체가 한 해 동안 편성된 예산 중 연말에 집중적으로 집행되는 비율을 의미하는 지표입니다. 보통 예산의 많은 부분이 연말에 몰리는 경향이 있으며, 이는 해당 지방자치단체의 예산 집행의 효율성이나 계획적 지출 여부를 평가하는데 중요한 역할을 합니다.연말지출비율이 높으면 예산집행이 지연되거나, 사업이 급하게 추진되는 경우가 많아 계획적으로 예산 운용에 문제가 있을 수 있음을 나타낼수있습니다.반대로 비율이 적당하면 예산 집행이 균형 있게 이루어졌다고 볼 수 있습니다.
