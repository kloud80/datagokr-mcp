description_portal: 경기도 파주시의 읍면동별로 등록된 반려동물 수를 기본으로, 시군구등록수, 등록을 대행한 업체를 통한 등록 수, 그 외 기타 방식으로 등록된 수 등의 정보를 포함합니다. 또한 반려동물의 개체를 식별하기 위한 수단인 내장형 식별장치(RFID), 외장형 식별장치(RFID), 인식표 식별장치(RFID) 각각의 수치를 세분화하여 제공함으로써 등록 방식의 비율이나 선호도를 파악할 수 있게 해줍니다. 이외에도 등록된 동물의 품종 수, 등록소유자수, 소유자당 평균 등록 동물 수, 해당 동에 존재하는 등록 대행업체 수 등을 통해 지역별 반려동물 보유 및 등록 서비스 접근성을 평가할 수 있고, 맞춤형 반려 시설 입지 선정, 동물등록제 활성화 캠페인, 유기동물 예방 정책, 애견카페·미용숍·소매점 창업 입지 분석, 반려동물 보험(펫보험) 타겟 마케팅, 특수 품종 맞춤형 서비스 런칭, 우리 동네 댕댕이 리포트, 반려동물 인프라 격차 지도 등에 활용될 수 있습니다.
