description_portal: '한국해양수산연수원의 연도별 성별 이직자 비율 통계를 나타낸 공공데이터로, 2019년부터 남성과 여성 각각의 이직률을 비교할 수 있도록 구성되어 있습니다. 예를 들어, 2020년에는 남성 이직자 비율이 15.7%, 여성은 17.4%였으며, 2021년에는 여성 이직률이 22.9%로 가장 높게 나타났음을 확인할 수 있습니다. 공공기관의 성별별 이직 경향 분석, 조직 내 인사이동 흐름 파악, 이직률 감소 정책의 효과 검토 등에 활용 가능하며, HR 부서의 인력 안정성 진단, 성별 균형 유지 전략 수립 등에도 유의미한 통계적 기반을 제공합니다.* 이직자 : 해당 기업에서 다른 기업으로 이직 한 사람'
