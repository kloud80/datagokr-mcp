description_portal: '- 전라남도에서 주민등록표에 등록된 내국인과 출입국관리법에 등록된 외국인 현황을 시군 및 읍면동 단위 및 반기별로 제공하는 자료입니다. - 전라남도의 인구 구조 변화는 고령화와 인구 감소, 외국인 유입 증가 등 복합적인 요인에 의해 영향을 받고 있으며, 이에 따른 정책적 대응이 필요합니다.- 전국 최초로 "인구청년이민국"을 신설하여 인구정책의 컨트롤타워 역할을 수행하고 있습니다. 이 기관은 출산 장려, 청년 유입, 외국인 정착 등 다양한 인구 문제를 종합적으로 대응하고 있습니다.- "전남도·시군 출생수당" 지원 : 출산 가정에 금전적 지원을 통해 출산 장려.- "전남형 만원주택" 공급 : 신혼부부와 청년을 대상으로 월 1만 원의 임대료로 주택을 제공하여 주거 부담 완화.'
