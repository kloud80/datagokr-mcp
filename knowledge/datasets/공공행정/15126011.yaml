summary_user: 국회사무처가 운영하는 시민 대상 의정연수 과정을 과정 한 건씩 담으며, 연수명·연수일·신청기간과 신청취소 기한·교육대상·연수 구분·장소·정원·조회수 같은 항목이 들어 있다. 국회 연수에 참여하려는 시민이나 교사가 "언제, 어디서, 누구를 대상으로 몇 명 정원의 연수가 열리고 신청은 언제까지인가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어서, 연수 구분 코드(EDU_GUBUN_CD)나 연수명으로 국회 내부 자료와 이름 단위로 맞춰 볼 수밖에 없다.
