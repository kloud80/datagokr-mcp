summary_user: 경기주택도시공사 홈페이지 방문자 수를 접속 연월(cntn_ym)과 플랫폼·기기 같은 접속환경별로 집계한 운영 통계를 담는다. 공공기관 디지털 서비스를 분석하는 연구자나 담당자가 'PC와 모바일 중 어느 쪽 방문이 더 많고, 시기별로 그 비율이 어떻게 바뀌었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월이나 같은 기관 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기주택도시공사 홈페이지에 접속한 방문자 수를 접속환경별로 구분하여 기록한 자료입니다. PC, 모바일 등 접속환경의 차이에 따라 방문자 규모와 비율을 파악할 수 있어, 온라인 서비스 이용 행태, 디지털 접근성, 사용자 선호 채널을 분석하는 데 유용합니다. 이를 통해 공사는 홈페이지 설계·운영 전략 개선, 모바일 최적화 서비스 강화, 온라인 민원 접근성 확대에 참고할 수 있으며, 연구기관이나 정책 담당자는 공공기관 디지털 서비스 품질 평가, 채널별 이용 행태 연구, 전자행정 효과 분석의 기초자료로 활용할 수 있습니다. 또한 특정 시기별 접속환경 변화는 정보 전달 방식 최적화 및 이용자 맞춤형 서비스 개발에도 도움이 됩니다.
