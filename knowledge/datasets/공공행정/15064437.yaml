summary_user: 서울 금천구의회에서 심의·의결한 의안을 의안코드별 한 행으로 담아 회기, 상임위원회 회부·상정·처리 일자와 처리결과, 본회의 상정·처리 결과를 단계별로 기록한 건별 원천 파일(CSV 약 144KB)이다. 구민이나 시민단체가 '관심 조례안이 상임위를 거쳐 본회의에서 가결됐는지, 언제 처리됐는지'를 확인하거나, 연구자·언론이 금천구의회의 의안 처리 기간과 가결·부결 경향을 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의안코드나 회기 같은 이름·코드 매핑으로만 연결하며, 같은 금천구의회의 다른 의정 데이터와 의안코드를 맞춰 보는 방식으로 이어 쓴다.
limits: 금천구 한 곳의 의회 의안만 담고 있어 다른 자치구·광역의회와 바로 비교하려면 별도 데이터를 모아 이름·코드로 맞춰야 한다. 전역 조인 키가 없고, 상임위·본회의 단계 컬럼이 '대정보.1', '회기.1'처럼 중복 이름으로 들어 있어 어느 단계의 값인지 구분해 해석해야 한다.
