description_portal: '서울특별시 금천구 관내 마을세무사 현황으로 세무사명, 세무사별 담당 동, 세무사사무소 전화번호, 팩스번호, 주소 등의  항목을 제공하고 있습니다.금천구는 세금 문제로 어려움을 겪고 계신 분들이나, 세무 관련 전문지식이 부족하여 도움을 필요로 하시는 분들을 위해 "마을세무사" 제도를 운영하고 있습니다."마을세무사" 제도는 전문 세무사들이 재능기부 형태로 참여하여, 구민 여러분께 무료로 비대면 세무상담을 제공하고, 필요한 경우 권리구제 지원까지 도와드리는 프로그램입니다. 이 제도는 세금에 대한 고민을 덜고, 세무와 관련하여 도움이 필요한 분들일 지원하고자 마련되었습니다.세무 관련 궁금증이나 어려움이 있으시면 언제든지 "마을세무사"를 통해 도움을 받으실 수 있습니다. 더 많은 정보나 신청 방법은 구청 홈페이지나, 관련 부서로 문의해 주시기 바랍니다.(담당부서 : 금천구 세무관리과)'
