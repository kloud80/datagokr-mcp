description_portal: 국민권익위원회는 청렴포털을 통해 접수된 부패행위 신고에 대한 업무분야별 현황을 제공하고 있습니다. 이 자료는 2021년부터 2023년까지의 접수일자, 위반행위, 업무분야 대분류 등의 정보를 포함하고 있으며, 공익신고자 보호법 관련 상세 신고자 유추 데이터는 제외되어 있습니다. 이러한 현황은 부패행위의 유형과 발생 분야를 분석하여, 효과적인 부패 방지 정책 수립에 활용됩니다. ​(공익신고자보호법 관련 상세 신고자 유추 데이터는 제외함)접수신고 시  심사위반행위분류, 업무분야, 위반분야, 위반행위분류 4개 항목의 자료가 필수 등록사항이 아니므로, 분야,분류항목 중 비워있는 데이터가 존재합니다.
