description_portal: 지방청사 서비스 데스크 요청 내역 합성데이터는 지방청사 내 이용자들이 시설 및 공간 사용과 관련해 접수한 각종 서비스 요청 정보를 기반으로 생성된 합성데이터입니다. 원본 데이터는 청사별로 수집된 실제 업무 요청 내역을 바탕으로 하되, 개인정보 및 민감정보를 포함하지 않도록 비식별·합성처리 과정을 거쳐 안전하게 가공되었습니다. 데이터는 청사구분, 서비스 분류(회의실, 시설, 기타 등), 서비스 요청 상세내용, 서비스 신청일의 4개 항목으로 구성되어 있으며, 지방청사별 서비스 운영 현황, 시설물 유지보수 수요, 공간 활용 효율성 분석 등에 활용할 수 있습니다. 또한, 합성데이터 특성을 활용해 공공시설 운영의 트렌드를 분석하거나, 민원 응대 시스템 개선 및 예측 기반 행정서비스 고도화에도 적용이 가능합니다.
