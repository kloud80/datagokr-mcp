description_portal: 이 데이터는 중앙부처별로 구분된 국고보조금 예산 편성 통계를 연도별로 제공합니다.각 부처의 예산액은 국회에서 확정된 본예산 기준으로 구성되며, 실제 재정 배분 현황을 반영합니다.제공된 총액은 원단위 기준으로, 천만 단위에서 반올림된 수치로 나타납니다.이를 통해 부처별 국고보조금 분포와 전체 예산 규모를 확인할 수 있으며, 정책 기획과 분석에 유용합니다.이 통계는 중앙정부의 예산 운영 실태와 보조금 집행 흐름을 이해하는 데 도움을 줍니다.정책 입안자, 예산 분석가, 공공기관 담당자에게 국가보조금 체계 분석과 예산 구조 파악에 유익한 자료입니다.또한 예산의 투명성 확보와 재정 정책 수립 과정에도 실질적인 참고자료로 활용될 수 있습니다
