description_portal: 광주광역시 마을공동체 현황본 데이터는 광주광역시 마을공동체 기본 조례에 근거하여, 주민 주도의 자발적 참여를 통해 마을공동체의 역량 강화 및 자립 기반 조성을 도모하고, 이를 통해 마을공동체 활성화를 지원하기 위해 추진된 2025년도 기준 광주광역시 마을공동체 지원사업 참여 공동체 현황 자료입니다. 이 데이터는 마을공동체 자원조사를 통해 수집된 자료로, 광주광역시에서 활동하는 마을공동체의 공동체 유형(동아리, 주민협의체, 비영리민간단체, 아파트자치회, 협동조합, 마을기업 등), 사업내용, 지원형태, 지원근거 등을 제공합니다.
