description_portal: 해당 데이터는 2020년에 미국 내에서 제기된 특허 소송 5,472건을 정리한 자료입니다.미국내특허소송정보 데이터는 각 사건별로 다음 정보를 포함하고 있습니다.- 사건 번호, 원고명, 피고명, 원고정보,  피고 정보, 분쟁 내용, 산업 대분류, 산업 중분류  등으로 구성되어 있습니다. * 국내 기업이 포함된 사건의 경우, 익명 처리되어있습니다.산업 분류는 대분류 기준으로기계소재, 기타산업, 장치산업, 전기전자, 정보통신, 화학.바이오의 6개 분야로 구성되어 있으며각 대분류 하위에 산업 중분류까지 세분화되어 있습니다.미국내특허소송정보 데이터는 이후 특허 소송 발생 시,산업별 분쟁 패턴, 소송 빈도를 비교 및 분석에 활용할 수 있으며산업별 특허 분쟁 대응 전략 수립을 위한 기초 자료로 활용할 수 있습니다.
