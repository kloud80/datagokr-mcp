summary_user: 서울특별시 강남구에서 인허가를 받은 노래연습장 업소를 한 곳씩 담은 건별 원장으로, 인허가·취소일자, 영업상태와 폐업·휴업·재개업 일자, 도로명·지번 주소, 좌표, 시설 면적·층수·방 수 등 시설 정보를 함께 담는다. 강남구 안에서 노래연습장이 어디에 얼마나 영업 중이고 언제 문을 닫았는지 보려는 상권 분석가나 창업 예정자가 업종 점포 이력과 밀집도를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 같은 원천인 LOCALDATA 인허가 자료와 겹친다.
description_portal: 서울시 강남구 노래연습장업 인허가 정보(https://data.seoul.go.kr/dataList/OA-17264/S/1/datasetView.do)서울특별시 강남구의 반주에 맞추어 노래를 부를 수 있는 반주장치 등의 시설을 갖추어 제공하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
