description_portal: 한국해양수산연수원이 보유한 영도본원의 종합소화시설 및 해양안전훈련 관련 교육시설에 대한 정보를 정리한 목록입니다. 각 시설의 명칭, 위치, 주요장비를 표 형태로 제공하며, 고정식소화장치, 퓨대식소화장치, AED, 구명보트, 심폐소생훈련기 등 다양한 안전교육 장비가 포함되어 있습니다. 해당 데이터는 해양 안전사고 예방, 교육장비 현황 파악, 안전 훈련 체계 개선, 정책 수립 시 참고 자료로 활용 가능하며, CSV 형식으로 제공됩니다. 교육 과정에는 소화훈련, 심폐소생술, 구조 및 피난훈련 등 실습 중심의 내용이 포함되어 있습니다.* 교육예약시스템 홈페이지에 기재되어 있습니다.
