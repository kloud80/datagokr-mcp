summary_user: 경기도 경기통계시스템에서 쓰는 통계 조사항목 목록을 항목 한 건 단위로 담으며, 조사항목ID·상위 조사항목ID·공표구분·조사항목명으로 계층 구조를 이룬다. 분석가가 경기도 통계의 특정 주제 아래 어떤 세부 조사항목이 있고 어떻게 분류되는지 파악할 때 쓴다. 전역 조인 키는 없고, 상위 조사항목ID(up_exmn_item_id)로 자기 자신과 이어 계층을 펼치거나 같은 기관(경기통계시스템)의 통계 자료와 항목 이름·코드로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템에서 활용되는 통계 조사 항목 목록을 제공하며, 각 조사항목의 고유 식별자인 조사항목ID, 상위 항목ID, 공표 구분, 조사항목명 등의 정보를 포함합니다. 조사항목은 계층적 구조로 구성되어 있으며, 상위조사항목과 연계되어 특정 통계 주제 하위의 세부 항목을 정의합니다. 공표구분은 각 항목의 데이터 공개 범위나 유형을 나타내며, 일부 행정적 관리 정보도 포함됩니다.  이 데이터는 경기통계시스템의 통계 설계 구조를 이해하고 통계주제별 항목 분류를 분석하는 데 유용하며, 통계포털 및 행정기관의 데이터 관리 및 제공 체계 수립에 활용될 수 있습니다.
