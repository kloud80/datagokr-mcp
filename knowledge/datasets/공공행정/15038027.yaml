summary_user: 울진군의회에 발의·처리된 조례안·예산안·결의안·승인안 등 의안을 한 건씩 담은 파일로, 의안번호·대수·회기·의안명·발의자·발의일자·본회의 처리일·처리결과를 포함한다(CSV 약 379KB). 군민이나 언론·연구자가 '이번 대 울진군의회에서 어떤 의원이 어떤 조례안을 발의했고 가결됐는가'처럼 의정 활동을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의안명·의원 이름 매칭이나 같은 기관(울진군) 기준으로만 이어 쓴다.
description_portal: 경상북도 울진군 의회에서 발의 및 처리된 의안에 대한 상세한 정보를 제공합니다. 해당 정보는 울진군의회에서 심의·의결한 각종 조례안, 예산안, 결의안, 승인안 등 다양한 의안의 처리 과정을 체계적으로 기록한 것으로, 의안번호, 대수, 의안명, 발의자, 발의일자, 발의의원, 본회의 처리일, 회수, 처리결과 등의 항목을 포함합니다. 이를 통해 울진군의회가 추진하는 정책과 입법 활동의 흐름을 파악할 수 있으며, 군민의 의정 참여와 의정 활동에 대한 투명성을 제고하고자 하는 목적을 가지고 있습니다. 또한, 해당 자료는 행정기관, 연구기관, 언론, 일반 군민 등 다양한 수요자에게 유용하게 제공될 수 있으며, 향후 울진군의 정책 분석이나 의정 자료 기반 연구에도 기초자료로 활용될 수 있습니다.
