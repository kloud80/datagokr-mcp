description_portal: 2022년 7월 27일 기준 대구광역시에 설치된 스마트 원격검침 계량기 전수를 동별로 집계한 데이터로 공공데이터 제공신청에 의해 제공합니다. 참고로 대구광역시는 상수도 관리의 효율성과 시민 편의를 높이기 위해 원격검침단말기를 도입하여 운영하고 있습니다. 이 단말기는 수도계량기에 부착되어 수돗물 사용량을 실시간으로 측정하고, 이를 무선 통신망을 통해 상수도사업본부의 중앙 시스템으로 전송하는 역할을 합니다. 원격검침단말기는 디지털 계량기에 부착되어 수돗물 사용량 데이터를 실시간으로 수집합니다. 수집된 데이터는 원격관제 시스템으로 전송되며, 이를 기반으로 정확한 요금 부과와 누수 감지 등이 이루어집니다 . 특히, 누수 발생 시 신속하게 감지하여 조치를 취할 수 있어 수자원 낭비를 예방하는 데 효과적입니다.
