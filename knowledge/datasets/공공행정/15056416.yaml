description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘청사(읍·면·동 포함) 현황’ 데이터는 서귀포시청 및 각 읍·면·동 사무소의 주요 시설 현황을 담고 있습니다.이 데이터는 청사명, 도로명·지번 주소, 층수, 건축물 연면적, 주차장 면수, 장애인주차장 수, 신축 연도 등의 정보를 포함하여지방행정 기반 시설의 규모와 접근성, 주차 여건, 장애인 편의시설 등을 파악할 수 있도록 구성되었습니다 이를 통해 행정 인프라 공유·분석, 주차장 및 장애인 편의 기반 평가, 공공건축물 관리, 재난·긴급 대응 공간 분석 등 실무적이고 정책적인 활용이 가능합니다.GIS 연동, 건축물관리 시스템, 재정계획 수립 등에도 유용한 기초 자료로 활용할 수 있습니다.
