description_portal: 이 데이터는 미군정 시기부터 정부수립 이후 2000년까지 발행된 관보에 대한 목록 정보를 제공하는 자료입니다. 국가기록원이 구축한 디지털컬렉션(관보)을 기반으로 수집된 이 데이터는 각 관보의 고시명, 발행날짜, 관보명, 관보종류, 생산기관, 고시기관, 편찬구분 등의 항목으로 구성되어 있습니다. 총 72만 건이 넘는 방대한 기록으로, 정부 간행물의 발행 이력 관리, 입법·행정 정보 추적, 학술 연구 등 다양한 용도로 활용될 수 있습니다. 이 데이터는 1회성으로 수집되었으며, 당시 구축된 디지털컬렉션 기준으로 제공됩니다.
