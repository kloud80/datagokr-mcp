summary_user: 전국 가로등의 위치정보를 시설 한 건 단위로 담으며, 시설 유형·시설 코드·관리기관명·지번 및 도로명 주소·법정동 시도/시군구/읍면동 코드·X/Y 좌표를 포함한다. 지자체 안전 담당자나 분석가가 "우리 동네 어느 골목에 가로등이 부족한가"처럼 야간 보행 안전 취약 지점을 찾는 질문에 쓴다. 측정 결과 전역 조인 키는 확인되지 않아 다른 데이터와는 주소나 법정동 코드(STDG_EMD_CD 등) 이름·코드 매핑, 또는 좌표 기반 공간 결합으로 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 가로등 위치정보 데이터입니다.
