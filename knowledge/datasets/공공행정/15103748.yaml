description_portal: 광주광역시도시공사에서 진행한 신규채용 현황을 연도별로 정리한 데이터입니다. 본 데이터는 구분(년도), 채용구분, 채용형태, 공고일, 직종, 직급, 채용인원, 접수인원, 데이터기준일자 항목으로 구성되어 있습니다. 채용구분 및 채용형태를 통해 정규직, 기간제 등 채용 방식별 채용 현황을 파악할 수 있으며, 직종 및 직급 항목은 모집 대상의 직무 및 직무 수준을 확인할 수 있도록 구성되어 있습니다. 채용인원과 접수인원 비교를 통해 경쟁률 및 채용 수요에 대한 분석이 가능하며, 공고일과 기준일자는 시기별 채용계획 수립 및 분석 자료로 활용됩니다. 본 데이터는 인사관리의 투명성과 채용과정의 공정성을 제고하는 데 목적이 있으며, 인력 수급 계획, 직무별 채용 추이 분석, 정책 수립 등을 위한 기초자료로 제공됩니다.
