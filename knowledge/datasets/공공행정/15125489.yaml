status: active
summary_user: 가맹본부가 브랜드별로 가맹점사업자를 어떻게 감독하는지(감독 항목명, 내용, 시기, 비고)를 기준년도와 브랜드관리번호 단위로 담은 전국 범위의 가맹사업 정보 조회 API다. 가맹 창업을 준비하는 사람이 "이 브랜드 본부는 가맹점을 어떤 항목으로, 언제 점검·감독하나"를 계약 전에 확인하는 데 쓴다. 브랜드관리번호(brandMnno)와 가맹본부관리번호로 같은 공정위 가맹정보 계열 데이터와 이어 쓰며, 실측 컬럼에서 사업자등록번호 같은 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름 매핑으로만 연결된다.
limits: 사업자등록번호·법인등록번호 같은 전역 조인 키가 실측 컬럼에 없어 타 기관 데이터와 직접 결합하기 어렵다. 비공간 데이터라 가맹점 위치나 지역별 분석에는 쓸 수 없다. 개발계정 호출은 하루 10,000회로 제한된다.
