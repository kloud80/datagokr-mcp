summary_user: 국회 본회의 일정을 회의 건별로 담으며, 대수(UNIT_NM)·회기·차수·회의 날짜와 시간·제목·안건 내용과 회의 자료·결과 문서 내려받기 주소를 함께 제공하는 전국 단위 비공간 데이터다. 국민이나 의정 분석가가 "이번 주 본회의는 언제 열리고 어떤 안건을 다루는가"를 확인하거나, 회기별 본회의 개최 이력을 정리하는 데 쓴다. 전역 조인 키가 없어 의안·표결·회의록 데이터와는 대수 코드(UNIT_CD)·회기·차수·회의 날짜 같은 이름·코드 매핑으로만 이어 쓰며, 의안과 결합해 "누가 무엇을" 처리했는지를 보는 용도가 핵심이다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
