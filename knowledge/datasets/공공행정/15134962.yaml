description_portal: 본 데이터는 충청남도 위치기반 증강현실(AR) 플랫폼에서 활용되는 용도구분 현황 정보로, 각 지역별 지역명과 해당 지역에 적용되는 용도명 정보를 포함하고 있습니다. 용도구분에는 전용공업지역, 일반공업지역, 준공업지역 등 국토의 계획 및 이용에 관한 법률에 따른 도시계획 용도지역 체계가 반영되어 있으며, 이를 기반으로 증강현실 서비스에서 해당 지역의 토지 이용 특성과 기능을 직관적으로 확인할 수 있도록 구성되어 있습니다. 본 데이터는 AR 기반 도시 정보 서비스, 산업단지 안내, 개발 가능 지역 분석, 입지 정보 제공, 도시계획 이해도 향상 등 다양한 행정·민간 서비스에 활용될 수 있는 기초 자료로서, 공간정보와 디지털 콘텐츠를 연계한 스마트 도시 서비스 구현을 지원합니다.
