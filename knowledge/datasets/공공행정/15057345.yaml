summary_user: 경기도가 운영하는 각종 심의회(위원회)마다 집계연도, 심의회명, 담당부서, 구성원 수, 설치목적과 설치근거를 한 행씩 정리한 현황 목록이다. 연구자나 도민이 "경기도의 어느 부서가 어떤 법적 근거로 몇 명 규모의 심의회를 두고 있는가"를 확인하거나 위원회 운영 구조를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 심의회명이나 담당부서명을 이름으로 맞추어 연결해야 한다.
description_portal: 각종 심의회 현황 데이터는 경기도 내에서 운영 중인 다양한 심의회의 설치 및 운영 현황을 정리한 자료로, 집계년도, 심의회명, 담당부서명, 구성원 수, 설치목적, 설치근거, 데이터기준일자 등의 항목으로 구성되어 있습니다. 본 데이터는 정책 수립·집행 과정에서 필요한 행정적 자문과 심의를 담당하는 위원회의 구조와 운영 특성을 한눈에 확인할 수 있도록 제공됩니다. 특히 심의회의 설치목적과 설치근거를 통해 해당 위원회의 필요성과 법적 정당성을 파악할 수 있으며, 구성원 수는 위원회의 규모와 전문성 확보 정도를 나타내는 지표가 됩니다. 또한 담당부서명 항목을 통해 각 심의회가 소속된 행정 부서와 연계 정책 분야를 확인할 수 있습니다. 이 데이터는 경기도 행정 의사결정의 투명성 제고, 위원회 운영의 효율성 분석, 행정참여 구조 연구 등 다양한 분야에서 활용될 수 있습니다.
