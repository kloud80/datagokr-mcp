summary_user: 통신판매사업자 등록 현황을 기준년월별로 시도·시군구, 법인 여부, 판매방식, 영업상태별 총사업자수로 집계한 통계로, 범위는 전국이며 행정단위는 시군구까지입니다. 지역별 통신판매업 등록 추이를 보거나, 우리 시군구에서 특정 판매방식으로 영업 중인 통신판매사업자가 몇 곳인지 확인하려는 분석가·지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도명·시군구명 같은 이름 매핑으로만 다른 지역 통계와 붙이며, 사업자등록번호가 없어 개별 사업자 등록 정보와는 직접 연결되지 않는다.
limits: 사업자별 건 단위가 아닌 집계 통계라서 특정 사업자가 등록돼 있는지 확인하는 데는 쓰지 못한다. 공정위 다른 체인이 사업자등록번호로 묶이는 것과 달리 이 데이터는 그 키가 없어 이름·코드 매핑으로만 연결된다.
