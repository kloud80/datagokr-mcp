description_portal: '울산광역시 중구야영·휴양시설 통합운영체계  체험프로그램 정보입니다.데이터는 프로그램번호,프로그램명,접수시작일, 접수종료일 로 구성되어 있습니다.주로 야영·휴양시설 통합운영체계의 체험프로그램 구성에 필요한 정보로 되어 있으므로 시스템 정보를 찾아보고자 할때 참고용으로 사용하시기 바랍니다.산림 숲속 체험교실  프로그램 안내: 과수에서 꽃을 피우고 수확하기까지 일련의 과정을 알아가는 과정에서 가족 구성원간 유대관계를 강화하고 수확한 과일을 지역의 사회적 약자와 나눔을 통해 지역공동체 의식을 고양하는 과수체험 프로그램유아숲교육 프로그램 안내: 자라나는 어린이(5~7세)에게 도심이 아닌 숲을 탐방하고 직접 체험함으로써 숲의 소중함을 알게 하는 유아숲교육 프로그램 , 함월유아숲 체험원(052-708-2836)숲해설 프로그램 안내: 어린이, 학생 및 가족에게 도심이 아닌 숲을 탐방하면서 야생화, 나무 등을 관찰하고 숲의 생태, 이용 등 숲의 소중함을 알게 하는 숲해설 프로그램문의사항 있을시 울산광역시 중구 홍보실 공공데이터 담당자(052-290-3104)로 연락하시기 바랍니다.'
