status: active
summary_user: 한국자산관리공사가 체납 압류재산 공매로 거둔 국가재정수입 기여액을 연도·세목별로 월별(1~12월) 집계한 전국 단위 파일로, 매각대금을 체납세액에 충당한 배분충당액과 매각 전 체납자가 낸 자진납부액을 나눠 담는다. 정책 분석가나 연구자가 '공매제도로 회수한 체납세액이 연도별·세목별로 어떻게 변했고, 배분충당과 자진납부 중 어느 쪽 비중이 큰가'를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 세목 이름을 맞춰 붙여야 하며, 같은 기관의 국유·공유재산 관련 자료와 함께 본다.
limits: 집계 자료라 개별 압류재산이나 체납자 단위의 공매 내역은 알 수 없고, 지역 구분 없이 전국 합계만 있다. 공통 조인 키가 없어 다른 데이터와 연결하려면 연도·세목 이름 매핑이 필요하다.
