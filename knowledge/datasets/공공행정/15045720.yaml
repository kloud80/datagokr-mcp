description_portal: 체납 압류재산 공매를 통해 국가재정수입에 기여한 실적을 연도별로 정리한 자료입니다. 공매를 통한 재정 기여는 압류재산이 매각되어 대금이 체납세액에 배분충당 되는 경우와, 매각 전 체납자가 자진납부를 통해 세금을 납부한 경우, 두 가지의 방식으로 산출됩니다. 해당 자료는 각 회수 방식별로 세목과 연도에 따라 구분되어 있으며, 이를 통해 회수 세액의 변화 추이와 공매제도가 국가 세입 확보에 기여한 정도 등을 다각도로 분석할 수 있습니다. 공매 제도가 국가 재정에 어떻게 도움이 되고 있는지를 이해하고, 체납 정리의 효과를 한 눈에 볼 수 있는 자료입니다.
