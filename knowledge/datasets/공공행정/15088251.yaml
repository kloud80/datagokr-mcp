description_portal: 한전KDN의 일반기록물 생산현황 데이터는 2012년부터 2025년까지 생산된 일반문서를 보존기간별로 구분하여 철 단위 건수 정보를 제공합니다. 해당 문서들은 보존기간에 따라 분류되며, 문서의 행정적·법적·역사적 가치를 고려해 관리되고 있습니다. 이 데이터는 조직의 기록관리 체계의 운영 수준과 문서 생산·보존의 흐름을 객관적으로 보여주며, 연도별 변화 추이와 특정 보존기간 문서의 비중 등을 파악할 수 있는 기초 자료입니다. 향후 해당 데이터를 기반으로 기록물 보존시설의 수요 예측, 보존관리 정책 수립, 기록관리 표준화 등을 추진하여 공공기관으로서의 투명성과 책임성을 강화할 수 있을 것입니다.
