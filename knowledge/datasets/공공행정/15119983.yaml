summary_user: 대전광역시 중구가 소유·관리하는 공유(구유)재산을 필지 단위로 한 건씩 담은 목록으로, 지번 주소 기준 소재지와 지목·면적·재산 용도·행정재산 구분을 담는다. 구 재산이 어디에 어떤 지목으로 얼마나 있는지, 특정 지번이 구유지인지 확인하려는 주민·사업자나 공유재산 활용·매각 대상을 검토하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(필지고유번호 등)가 없어 다른 데이터와는 지번 주소 문자열이나 지목·용도 코드 이름 매핑으로만 연결한다.
description_portal: 본 공공데이터는 중구 공유(구유)재산 현황입니다.정기적인 공유재산 실태조사 실시로 무단 점․사용자 조치 및 보존부적합 재산 매각 등의 관리방안을 강구하고, 효율적인 관리체계 구축을 통해 구 재정확충 및 누수없는 재산 운영을 위함.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 소재지는 지번 주소를 기준으로 작성되어 있습니다.데이터 컬럼 중 지목은 도로, 대, 공원, 주차장 등으로 구분되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
