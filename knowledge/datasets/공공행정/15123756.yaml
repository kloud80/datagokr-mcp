summary_user: 법률·대통령령·총리령·부령 등 법령 유형을 코드로 분류한 코드표로, 법령 종류 코드별 상위 코드, 국문·영문 명칭, 그룹 코드, 현행 여부와 등록·수정 일시를 담은 전국 단위 비공간 파일(csv, 약 12KB)이다. 법령 데이터를 다루는 분석가나 시스템 개발자가 '법령 목록에 찍힌 종류 코드가 법률인지 부령인지'를 풀어 읽거나, 법령을 종류별로 묶어 집계할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 법제처 법령 데이터의 법령 종류 코드나 명칭과 매핑해 이어 쓴다.
description_portal: 법제처에서 제공하는 법령종류코드 데이터는 법률, 대통령령, 총리령, 부령 등 다양한 법령 유형을 표준화된 코드 체계로 분류하여 정리한 자료입니다. 각 법령 유형은 고유한 코드와 함께 명칭, 약칭, 법적 효력 범주 및 관리 부서 정보를 포함하며, 코드별 적용 대상과 사용 예시도 함께 제공됩니다. 또한 코드 체계는 주기적인 개정 이력을 반영하여 법령 구조 변화에 대응할 수 있도록 설계되었습니다. 이를 통해 전자정부 시스템, 법령정보 플랫폼, 행정문서 관리 체계 등에서 법령을 코드 기준으로 일관되게 식별하고 처리할 수 있으며, 데이터베이스 구축 및 내부 연계 시 오류를 줄입니다. 해당 자료는 법령 기반 정보 시스템의 표준화와 행정 효율성 제고를 위한 기초 자료로 활용됩니다.
