summary_user: 광주광역시 남구가 소유한 공유재산(행정재산·일반재산)을 재산 한 건마다 소재지, 토지지목, 면적, 재산관리관코드와 함께 담은 시군구 단위 파일이다. 주민이나 분석가가 '남구 소유 토지가 어디에 있고 지목과 면적은 어떤가'를 확인하거나 유휴 부지·임대·매각 검토의 기초 목록으로 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 이름 매칭하거나 같은 기관(남구) 자료끼리만 연결한다.
description_portal: 광주광역시 남구 공유재산(행정재산 및 일반재산)에 대한 현황 및 정보(소재지, 토지지목, 면적 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 회계과(☎062-607-3022)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 공유재산은 국가나 지방자치단체가 소유하여 공공의 목적을 위해 사용하는 재산으로, 토지, 건물, 시설 등이 포함됩니다. 도로, 공원, 청사 부지 등 행정·공익적 용도로 활용됩니다. 해당 데이터는 재산 관리 현황 파악, 활용 계획 수립, 유휴 부지 개발, 임대·매각 검토, 재산 가치 평가 등 다양한 행정 업무에 활용될 수 있을 것으로 보입니다.
