description_portal: 서울특별시 서초구 관내 연면적 10,000제곱미터 이상 30,000제곱미터 미만 건축물 현황입니다.연면적 10,000제곱미터 이상 ~ 30,000제곱미터 미만 건축물은 「시설물의 안전 및 유지관리에 관한 특별법(시설물안전법)」상 제3종 시설물에 해당합니다. 공동주택도 많이 포함되지만, 주로 상가·업무시설·공장·복합시설 등 대부분의 일반 대형 건축물이 포함됩니다.우리구 데이터는 건축물 용도로는 공동주택, 업무시설, 교육연구시설, 판매시설 등으로 많이 사용되고 있습니다.이외에 제1종근린종교시설, 자동차관련시설, 종교시설, 운동시설, 의료시설, 숙박시설 등이 사용되고 있습니다.이 자료는 소재지명 도로명주소, 소재지 지번주소, 위도, 경도, 건축물용도, 건축물 구조 형태, 사용승인일자, 연면적등을 제공하고 있습니다.10,000제곱미터 이상 30,000제곱미터 미만 건축물관리자는 매년 1회이상 건축물 점검, 소방점검, 전기·승강기·가스 점검, 환경관리, 안전관리계획 수립 등 복합적인 관리 의무를 체계적으로 수행해야 합니다.또한, 안전점검일지, 보수·보강 내역, 각종 정기검사 결과서, 공급계약(전기·가스), 소방점검 기록, 정보통신실 점검 기록등 유지관리 기록은 문서상으로 보존해야 됩니다.추가적으로 10,000제곱미터 이상 30,000제곱미터 미만 건축물은 2026년 8월 18일부터 정보통신설비 유지보수및 관리제도에 대해서도 일정이상의 자격을 갖춘 전문가를 선임하거나유지보수및 관리업무를 위탁하도록 하는 내용으로 바뀌었습니다.우리 구는 앞으로도 주민 여러분께서 오늘이 행복하고 내일이 기다려지는 서초가 될 수 있도록, 정확하고 실용적인 정보를 지속적으로 제공해 나가겠습니다.
