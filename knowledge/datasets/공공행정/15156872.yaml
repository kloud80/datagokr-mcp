summary_user: 전국 자치단체 공공 민원실의 기본정보(주소·위도/경도·평일 운영시각·야간/주말 운영 여부)와 민원 창구별 현재 발권 대기인수·호출번호를 민원실·업무 단위로 실시간 제공하는 API로, 오퍼레이션은 기본정보와 창구별 대기현황 두 개다. 시민이 "지금 가까운 시청 민원실의 여권발급 창구에 몇 명이 기다리는지, 이번 주 야간·주말에 여는지"를 확인하거나, 분석가가 민원실 혼잡 시간대를 살피는 데 쓴다. 두 오퍼레이션은 민원실일련번호(csoSn)와 지자체 코드(stdgCd)로 서로 연결하고, 다른 데이터와는 전역 조인 키가 확인되지 않아 지자체 코드·민원실명 매핑이나 좌표 기반 근접 결합으로 잇는다.
description_portal: 대국민 민원처리를 위해 자치단에에서 운영되고 있는 공공 민원실의 효과적인 운영을 목적으로 공공민원실의 기본정보를 비롯해 공공민원실의 민원 창구별 발권기 현황에 대한 실시간 정보를 제공 합니다. 제공되는 정보는 민원실의 주소 및 위도/경도를 포함한 지리적 위치 및 공공 민원실 연락처, 운영시간, 휴일운영여부 등 민원실의 기본적인 운영 정보인 "민원실 기본정보"를 비롯하여 자치단체별로 운영중인 공공 민원실의 민원 창구별 현재 발권기 대기현황에 대한 실시간 정보를 담은 "민원실 창구별 대기현황" 정보를 제공 합니다.
