description_portal: '이 데이터는 경남개발공사에서 추진하는 건설 및 시설 사업에 대해 조달청을 통해 이루어진 물품 구매 및 계약 실적을 월별로 집계한 조달계약 기반 데이터입니다. 계약 또는 납품요구 일자부터 실제 지출이 이루어진 지출일자, 지출 금액, 품명 및 세부 품목 정보(분류번호, 품명, 식별번호 등), 계약 품목에 대한 상세명칭(예: 부스터펌프, PVC관 등), 계약 업체명 및 소재지, 계약 방법(수의계약 등), 우수조달 여부, 계약금액, 업체 대표자 정보, 납품기한 등 공공조달과 관련된 실질적인 세부 정보가 포함되어 있습니다.해당 데이터는 주요 공공시설 건립공사나 토목·기반시설 조성공사 등에 사용된 관급자재의 구매 이력을 투명하게 관리하기 위한 목적으로 구축되었으며, 계약 절차, 계약 업체 및 품목의 투명한 공개를 통해 공공기관의 계약업무의 신뢰성 제고에 기여할 수 있습니다.조달청 시스템을 통한 계약 정보 공개 데이터로서, 계약주체·물품분류·납품기한 등의 정보를 종합적으로 활용하여 계약 추세 분석, 자재별 수요 분석, 계약방식별 집행효율성 분석 등 다양한 공공조달 행정지원 및 정책 기초자료로 활용될 수 있습니다.'
