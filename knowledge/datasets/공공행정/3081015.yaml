summary_user: 서울 금천구의회 현역 구의원 한 명당 한 행으로 성명(한글·한자), 선거구와 해당 동, 의장·상임위원장 같은 의회 내 직위, 전화·팩스번호를 담은 소규모 명단 파일(CSV 약 1.3KB)입니다. 금천구 주민이 '우리 동 담당 구의원은 누구이고 어디로 연락하나'를 확인하거나, 언론·연구자가 금천구의회의 인적 구성과 직위 배분을 살펴볼 때 쓴다. 다른 데이터와 맞출 전역 조인 키는 없으므로, 선거구·동 이름을 행정동 자료나 선거 결과 자료와 이름으로 맞추어 이어 쓴다.
limits: 금천구 한 개 시군구만 다루므로 다른 자치구 의원이나 전국 지방의원 비교에는 이 파일만으로 부족하다. 법정동·행정동 코드나 의원 식별 코드가 없어 다른 데이터와 연결할 때는 이름 매칭에 기대야 하며, 표기 차이에 주의해야 한다.
