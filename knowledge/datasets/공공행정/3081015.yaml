description_portal: 주민을 대표하여 금천구의 살림을 심의·의결하는 현역 구의원의 상세 정보를 투명하게 공개하는 데이터입니다. 본 데이터는 구민의 알 권리를 충족시키고 의원과의 소통을 활성화하여, ‘열린 의회, 일하는 의회’를 구현하는 중요한 기반이 됩니다.데이터는 각 의원의 성명(한글/한자), 소속 선거구, 의회 내 직위(의장, 상임위원장) 등 기본 정보와 함께, 의정활동에 대한 문의와 정책 제안에 필요한 전화번호, 팩스번호 등 공식 연락처를 포함하고 있습니다.구민 누구나 이 데이터를 통해 자신의 지역구 의원을 확인하고 손쉽게 연락을 취할 수 있으며, 언론 및 연구 기관은 금천구의회의 인적 구성과 정치 지형을 분석하는 객관적인 자료로 활용할 수 있습니다. 또한, 정기적인 정보 갱신을 통해 항상 정확한 최신 현황을 제공하여, 구민과 의회를 잇는 신뢰의 다리 역할을 하고자 합니다.
