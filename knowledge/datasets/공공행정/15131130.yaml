summary_user: 경기도 민원 플랫폼 「경기민원24」에 등록된 추천 검색어 묶음을 건별로 담으며, 한 건마다 최대 5개의 추천 키워드와 메인 화면 노출 여부, 등록·수정자 번호와 일시가 들어 있다. 민원 서비스 분석가가 경기민원24 메인 화면에 어떤 키워드를 언제 노출하고 바꿨는지 살펴 행정 수요나 검색 화면 구성을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 키워드 이름을 맞추거나 같은 기관 자료로만 이어 쓴다.
description_portal: 이 데이터는 경기도의 민원서비스 플랫폼 「경기민원24」에 등록된 추천 검색어 정보를 제공합니다. 각 항목은 추천 검색어 일련번호, 최대 5개의 추천 키워드 메인 노출 여부, 등록자 번호, 등록 및 수정 일시 등으로 구성됩니다. 추천 검색어는 사용자가 민원 서비스 이용 시 빠르게 관련 정보를 찾을 수 있도록 제시되며, 사용자 관심도나 행정 이슈 등을 반영해 구성됩니다. 이 데이터는 민원 이용자의 검색 행태 분석, 주요 행정 수요 예측, 검색 최적화 기능 개선 등의 목적에 활용될 수 있으며, 키워드의 조합을 통해 공공서비스 이용 활성화 전략 수립에기여할 수 있습니다.
