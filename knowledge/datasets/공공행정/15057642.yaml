summary_user: 전국 지방자치단체가 운영하는 기금의 현재액을 회계연도별 결산 기준으로 담은 집계 데이터로, 자치단체별로 전년도 현재액·증감액 총계·조성액·사용액·당해연도 현재액을 제공한다. 주민이나 지방재정 분석가가 "우리 지자체 기금이 한 해 동안 얼마나 쌓이고 쓰였나"를 확인하거나 자치단체끼리 기금 규모를 비교하는 데 쓴다. 회계연도(fyr)와 자치단체 코드·이름(광역 wa_laf_cd, 기초 laf_cd)이 있지만 실측상 전역 조인 키는 확인되지 않아, 다른 지방재정365 데이터와는 같은 기관 코드나 자치단체 이름 매핑으로 연결한다.
description_portal: 지방자치단체 기금이란 지방자치단체가 특정한 목적을 위해 일정한 재원을 장기적으로 조성·관리·운용하기 위해 설치한 재정수단으로 예산과는 별도로 운영되며 법령이나 조례에 따라 설치됩니다. 지방재정접 제 43조에 따라 특정운영되고 있습니다.지방자치단체 기금현재액 정보는 2014 회계연도 정보부터 제공되며 자치단체에서 운영중인 기금에 대한 현재액정보를 회계연도별 결산기준으로 제공합니다. 제공되는 세부항목은 전년도현재액, 증감액총계, 조성액, 사용액, 당해연도 현재액정보가 제공됩니다.
