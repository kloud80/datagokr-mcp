description_portal: 충디지털 전환 가속화와 비대면 행정 서비스 확산으로 시민들에게 신속하고 정확한 행정 정보 전달을 위한 다양한 소통 채널 구축의 중요성이 증대되면서, 알리미시스템을 통한 문자 서비스가 중요한 시민 소통 도구로 자리잡고 있습니다. 전자정부 구현과 스마트 행정 서비스 확대를 통한 시민 편의성 향상과 행정 효율성 제고가 요구되고 있으며, 시민들의 알권리 보장과 투명한 행정 정보 제공을 위한 체계적인 정보 전달 시스템 운영이 중요해지고 있습니다. 개인정보보호법과 정보통신망법에 따른 적정한 개인정보 처리와 문자 발송 서비스의 안전한 운영을 통한 시민 신뢰 확보가 필요하며, 다양한 행정 분야별 맞춤형 정보 제공과 시민 수요에 부응하는 서비스 개선이 요구되고 있습니다. 또한 문자 발송 서비스의 효과성 분석과 비용 효율성 평가를 통한 최적의 시민 소통 전략 수립이 중요하며, 시민 소통 정책 수립과 디지털 행정 서비스 개선을 위한 체계적인 운영 현황 분석의 필요성이 증대되고 있어, 충청남도 보령시는 관내 알리미시스템을 통해 발송한 문자 메시지의 발송 현황, 메시지 유형, 발송 비용 등 시민 소통 서비스 운영과 디지털 행정 서비스 개선에 필요한 종합적인 알리미시스템 문자발송 현황 정보를 제공하고 있습니다.
