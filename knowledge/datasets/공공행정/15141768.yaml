summary_user: SGIS 통계주제도 제작에 쓰이는 소지역 격자 단위 시계열 통계와 경계를 csv·shp 파일로 묶어 담으며, 기준연도·격자코드·통계항목·통계값 형태로 전국 범위를 다룬다(zip 약 98MB). 분석가나 지자체 담당자가 '우리 동네 격자별 인구나 사업체가 연도별로 어떻게 달라졌나'처럼 행정구역보다 작은 공간 단위의 변화를 지도에 올려 볼 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않았으므로, 격자코드로 같은 파일 안의 경계(shp)와 붙이고 다른 데이터와는 이름·코드 매핑으로 연결한다.
description_portal: 통계지리정보서비스(SGIS)의 다양한 주제도를 만드는 데에 사용되는 소지역 시계열 통계와 경계를 파일 형태로 이용할 수 있습니다.· 본 자료는 csv, shp 파일 등을 포함하고 있으며 자료 이용 시 참고자료 폴더 내 코드집, 자료 이용안내 등을 참고하여 이용하시기 바랍니다.※ 행정구역이나 행정구역보다 작은 집계구 단위의 시계열(2000~2024년) 통계와 경계, 도시화지역, 기초단위구 등 분석용 경계는 SGIS 포털 (https://sgis.mods.go.kr) 자료제공 메뉴에서 신청하시면 이용할 수 있습니다.
