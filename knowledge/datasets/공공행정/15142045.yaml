summary_user: 마포구 관내 쓰레기종량제봉투 판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·폐업·휴업 일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표를 포함한다. 주민이 집 근처에서 종량제봉투를 파는 영업 중인 가게를 찾거나, 분석가가 판매업소의 개업·폐업 이력으로 동네 점포 변화를 볼 때 쓴다. 전역 조인 키는 없어서 같은 기관 코드(개방자치단체코드)나 주소·사업장명 매핑으로 LOCALDATA 인허가 등 다른 지역 인허가 자료와 연결한다.
description_portal: 서울특별시 마포구의 시군구의 조례에 따라 정의되는 쓰레기 종량제 봉투의 판매 가능한 업소 정보에 대한 설명입니다.이 데이터에는 각 판매업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민과 행정기관은 관내 쓰레기종량제봉투판매업체의 위치, 판매 품목 및 운영 현황을 파악하고, 환경 위생 및 폐기물 관리 정책을 효율적으로 수립할 수 있습니다.
