summary_user: 한국수력원자력 원자력발전소의 2026년도 물리적 방호 검사 일정을 검사 건별로 담은 파일로, 년월·시작일자·종료일자·발전소·검사기관을 기록하며 파일 크기는 187바이트로 몇 건 되지 않는다. 원전 보안·핵안보 정책을 보는 분석가나 국민이 '올해 어느 발전소가 언제 어느 기관으로부터 물리적 방호 검사를 받는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 발전소 이름이나 검사기관 이름을 매핑해 같은 기관(한수원)의 다른 발전소 데이터와 이어 쓴다.
description_portal: 원자력발전소의 물리적 방호 검사는 원자력 시설과 핵물질을 도난, 파괴, 테러, 불법 침입 등으로부터 보호하기 위한 보안 체계가 제대로 구축되고 운영 되는지를 점검하는 제도입니다.이는 국가 차원의 핵안보와 대국민 안전보장에 매우 중요한 절차입니다. 이러한 물리적방호 검사는 출입통제시스템, 경비 인력 운영체계, 감시/경보시스템, 침입 방호 체계, 핵물질 재고 관리, 비상 대응 체계, 내부자 위협 대응, 보안시스템 사이버 보호 항목을 점검합니다.첨부된 데이터는 2026년도 한국수력원자력의 물리적 방호 검사 일정 관련 년월,시작일자,종료일자,발전소,검사기관 자료입니다.
