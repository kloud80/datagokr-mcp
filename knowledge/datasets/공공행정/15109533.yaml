description_portal: 본 데이터는 경상남도 남해군으로 귀농·귀촌을 희망하거나 초기 정착 단계에 있는 이들의 안정적인 주거 마련을 지원하기 위한 다양한 주거 지원 사업 정보를 종합적으로 제공합니다. 이는 귀농·귀촌인의 가장 큰 초기 부담 중 하나인 주거 문제 해결을 돕고, 성공적인 농촌 생활 적응과 지역사회로의 원활한 통합을 지원함을 목표로 합니다. 남해군에서 운영하는 "전원마을주택","고령자복지주택",귀농인의집","작은학교임대주택" 등 주요 주거 지원 사업별 상세 내용을 포함합니다. 구체적으로 각 사업별 "이름", "지번주소" "대지면적", "분양여부", 그리고 해당 "주택의 용도 및 건축물수" 정보 등 귀농·귀촌인이 실질적으로 필요로 하는 핵심 정보를 담고 있습니다
