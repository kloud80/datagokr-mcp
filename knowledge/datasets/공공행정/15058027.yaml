summary_user: 전국 지방자치단체가 제정한 조례·규칙 등 자치법규를 건별 목록으로 담으며, 한 건마다 자치법규명·종류·분야, 지자체기관명, 제개정 구분, 공포일자·공포번호, 시행일자, 상세 링크가 들어 있다. 사업자나 분석가가 "우리 시·군에서 최근 공포·시행된 조례는 무엇인가"처럼 특정 지역의 자치입법 현황을 확인하거나 지역 규제를 검토할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 지자체기관명 같은 이름 매칭이나 같은 법제처 데이터의 자치법규ID·일련번호로만 이어 쓸 수 있다.
description_portal: 법제처가 제공하는 모바일 자치법규 목록 조회 데이터는 지방자치단체에서 제정한 조례 및 규칙 등의 자치법규 정보를 모바일 환경에서 확인할 수 있도록 구성된 자료입니다. 이 데이터는 자치단체명, 자치법규명, 자치법규ID, 자치법규구분(조례·규칙 등), 제·개정 구분, 공포일자, 시행일자, 소관부서명, 문서번호, 시행여부 등 주요 항목으로 구성되어 있습니다. 사용자는 자치단체명, 자치법규명, 문서번호 등의 조건을 입력하여 해당 지역의 자치법규를 목록 형태로 조회할 수 있으며, 페이지 번호와 조회 건수를 지정하여 결과를 맞춤 설정할 수 있습니다. 경량화된 구조로 모바일 환경에서 신속하게 접근할 수 있으며 법령과 구분되는 지역 단위의 입법 정보를 체계적으로 제공함으로써 자치입법 분석, 규제 검토 및 지역 행정 업무에 효과적으로 활용할 수 있습니다.
