summary_user: 경기도 하남시에 설치된 무인민원발급기를 설치 장소별로 한 행씩 담은 위치 현황 파일로, 설치장소명·설치주소·지상/지하 구분·대수·이용시간·휠체어 접근 가능 여부를 담는다. 하남시 주민이 집 근처나 야간·주말에 쓸 수 있는 발급기, 휠체어로 접근 가능한 발급기가 어디 있는지 찾을 때, 또는 행정 담당자가 추가 배치 위치를 검토할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치주소를 주소·좌표로 바꾸거나 장소 이름을 맞춰 연결해야 한다.
description_portal: 경기도 하남시에 설치되어 있는 무인 민원 발급기 위치 현황에 대한 정보를 제공합니다."민원처리에 관한 법률" 등에 따라 행정기관 또는 공공장소 등에 설치하여 민원인이 직접 민원문서를 발급받을 수 있도록 하는 전자장비에 대한 정보입니다. 설치 장소는 행정복지센터, 금융기관, 대형마트, 지하철역, 경찰서 등으로 다양하며, 각 위치별 운영시간이 다르고 일부는 24시간 운영되어 접근성이 높습니다. 특히 휠체어 접근 가능 여부도 병기되어 있어 교통약자 및 장애인을 위한 맞춤형 안내에도 유용합니다. 민원 수요 예측, 스마트지도 연계, 복지시설 계획 등에 활용 가능하며, 현황 파악과 추가 배치 계획 수립에 실질적 도움을 줍니다.
