summary_user: 광주광역시 북구 관내 무인민원발급기로 접수된 민원을 한 건씩 담은 원천 기록으로, 2024년 1월 1일부터 12월 31일까지 1년간의 접수번호·발급기명·접수일자·민원사무명 등을 CSV 파일(약 15MB)로 제공한다. 구청 민원 담당자나 분석가가 '북구에서 어느 발급기가 언제 어떤 민원을 많이 처리했는가'를 따져 발급기 배치·운영을 검토하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 발급기명이나 민원사무분류번호·민원사무명을 이름·코드로 맞춰 잇거나 같은 기관(북구) 자료끼리만 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 지역·기관 데이터와 바로 결합하기 어렵고, 범위는 북구 한 시군구에 그친다. 좌표 등 공간 정보가 없어 발급기 위치 분석에는 별도 시설 목록이 필요하다.
