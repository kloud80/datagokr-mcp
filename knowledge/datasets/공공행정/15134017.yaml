description_portal: 서울교통공사는 국내 최고의 지하철 관련 기술 노하우를 보유하고 있으며, R&D에 심혈을 기울여 국내·외 지하철 관련 기관의 모범이 되고 있습니다. 혁신적인 신기술 도입과 활용에 적극적으로 참여하고자 각종 연구과제 또는 직종별 직무와 관련한 각종 아이디어를 발굴하여 산업재산권 출원을 적극적으로 진행하고 있습니다. 위 자료는 서울교통공사 산업재산권 출원기본정보, 출원일련정보, 발명구분명, 출원제목, 해외출원신청여부, 연구과제 구분, 공사단독여부, 공사권리지분, 지분합계, 발명진행상태로 구성되어 있습니다. 이 자료는 반기별로 업데이트 될 예정입니다.
