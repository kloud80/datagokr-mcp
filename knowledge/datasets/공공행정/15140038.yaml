summary_user: 2010년 이후 실시된 재보궐선거에 대해 선거구별로 대상자, 소속 정당, 실시 사유, 사유발생일자와 사유확정일자를 건별로 담으며 범위는 전국이고 행정단위는 시도까지다. 분석가나 기자가 '어느 지역에서 어떤 사유(당선무효·사퇴 등)로 재보궐선거가 열렸고, 사유 발생부터 확정까지 얼마나 걸렸나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관의 다른 선거 데이터와는 선거일자·선거종류코드(elctKndCd)·선거구명·시도명 같은 이름과 코드 매핑으로만 연결한다.
limits: 선거가 치러질 때 생성된 뒤 바뀌지 않는 이벤트성 데이터이므로 정기 갱신을 기대하기 어렵고, 지역 단위는 시도명까지만 있어 시군구 코드 기반 결합은 할 수 없다. 개발계정은 하루 10,000회 호출로 제한된다.
