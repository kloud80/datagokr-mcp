description_portal: 전라남도 영광군_대표홈페이지 열린군수실정보 공공데이터는 군정 운영의 투명성과 주민 참여 확대를 위해 제공되는 주요 행정정보 데이터셋이다. 이 데이터는 ‘뉴스 속의 영광군수’, ‘공약이행 현황’, ‘정책 소개’, ‘군수에게 바란다 민원 의견’, ‘군수 일정’ 등 군수 직무와 관련된 다양한 콘텐츠를 포함한다. 이를 통해 군정 소식과 정책 추진 상황을 실시간으로 확인할 수 있으며, 주민이 직접 의견을 제출하거나 공약 이행 수준을 평가하는 등 참여 기반 행정 구현에 활용된다. 또한 언론 보도 자료, 주요 정책 추진 계획, 민원 답변 내용까지 통합 제공해 군민과 행정 간 소통을 강화하고 지역 행정의 신뢰도를 높이는 데 기여하는 데이터이다.
