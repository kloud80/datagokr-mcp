summary_user: KOSIS(국가통계포털)에 있는 국가승인통계의 목록을 서비스뷰·목록·통계표 단위의 계층(트리)으로 담은 디렉터리 데이터로, 통계 수치가 아니라 통계표 이름·식별자·작성기관 같은 위치 정보를 전국 범위에서 제공한다. 분석가나 개발자가 "읍면동 유동인구나 시장 물가 통계는 KOSIS 어느 목록에 있고 통계표ID가 무엇인가"를 찾아 수집 범위를 정하는 데 쓴다. 여기서 얻은 통계표ID(TBL_ID)와 기관코드(ORG_ID)를 KOSIS 통계자료 조회 API의 입력으로 넘겨 쓰지만, 다른 데이터셋과 공통으로 맞물리는 전역 조인 키는 실측에서 확인되지 않아 이름·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 국가데이터처가 운영하는 KOSIS(국가통계포털)에서 보유하고 있는 방대한 국가 승인 통계의 계층 구조와 디렉터리 정보를 체계적으로 탐색할 수 있도록 지원하는 오픈 API 서비스입니다. 이 서비스는 사용자가 수많은 통계 테이블 중에서 원하는 데이터를 신속하고 정확하게 찾아갈 수 있도록 돕는 일종의 '나침반' 역할을 합니다.본 API 통해 사용자는 경제, 사회, 인구, 환경 등 각 기관 및 분야별로 분류된 통계 목록의 트리(Tree) 구조, 통계 명칭, 통계표 ID, 작성 기관 정보 등을 호출할 수 있습니다. 수많은 통계 데이터의 연동 위치와 식별자를 계층별로 명확하게 파악할 수 있기 때문에, 방대한 KOSIS 시스템 내에서 데이터 수집 범위를 정의하고 검색 경로를 최적화하는 데 필수적인 선행 서비스입니다.
team:
  dept: 통계서비스기획과
services:
  - op: /getStatisticsList
    name: KOSIS 통계목록 서비스
    endpoint: https://apis.data.go.kr/1240000/statisticsList/getStatisticsList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: vwCd
        required: true
        example: MT_ZTITLE
        desc: 서비스뷰 코드
      - name: parentListId
        required: true
        example: A_3
        desc: 시작목록 ID
      - name: format
        required: true
        example: json
        desc: 결과 유형
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
