description_portal: 본 데이터는 용인시 통합 홈페이지를 통해 제공되는 아파트 관련 현황 정보를 관리하기 위한 자료로, 아파트 기본정보와 거래 통계를 두 개의 파일로 구분해 제공한다. 아파트일련번호와 등록일시를 중심으로 단지명, 주소, 착공일, 사업승인일, 시공·감리자 등 단지의 행정 정보를 기록하였다. 또한 대지면적, 연면적, 동수, 세대수, 평형, 주차대수, 승강기수, 난방형태, 오수정화시설형식 등 주거 환경을 파악하는 데 필요한 지표를 포함하였다. 관리구분코드와 관리형태코드는 단지의 관리 체계를 나타내며, 분양일과 건물유형코드는 공급 특성을 확인하는 기준이 된다. 아울러 자료년도와 자료월, 거래수로 구성된 거래 통계는 지역 아파트 시장 변동을 분석하는 데 활용된다.
