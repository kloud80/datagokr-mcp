description_portal: '본 데이터는 2017년 7월 기준 전북특별자치도 내 등록된 선불식 할부거래업자의 현황을 정리한 자료입니다. 선불식 할부거래업이란 소비자가 일정 금액을 선지급하고, 그에 상응하는 서비스나 상품을 나중에 제공받는 거래 형태로, 상조업체가 대표적입니다. 데이터는 업체명, 대표자명, 등록번호, 소재지, 전화번호, 계약유형(예치계약, 공제계약), 선수금 보전기관명(예: 신한은행, 우리은행, 한국상조공제조합), 그리고 현재 영업상태(정상영업, 등록취소, 자진폐업 등)를 포함하고 있습니다. 이를 통해 각 업체의 운영 현황과 계약 형태를 파악할 수 있으며, 소비자 보호 및 행정 감독 업무에 활용 가능합니다. 특히 정상 영업 중인 업체와 폐업 또는 등록취소된 업체를 구분하여 산업 건전성 진단, 정책 지원 방향 설정, 피해 예방 대책 마련에 중요한 기초 자료로 활용됩니다.'
