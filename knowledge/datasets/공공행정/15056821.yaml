summary_user: 법제처가 관리하는 현행법령의 목록을 법령 단위로 담은 전국 범위의 원장 데이터로, 법령명·법령ID·시행일자·공포일자·제개정구분·소관부처 등을 포함한다. 법령이 언제 시행·개정됐는지, 어느 부처 소관인지 확인하거나 법령 변경을 감지하려는 분석가·실무자가 쓴다. 법령ID(법령ID)로 각 법적 근거를 묶고 시행일·개정 이력으로 변경을 잡으며, 소관부처코드는 같은 기관 코드끼리만 연결된다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 외부 사이트 open.law.go.kr 호출에는 포털 활용신청과 별개로 인증키(query 파라미터 OC)가 필요하다.
