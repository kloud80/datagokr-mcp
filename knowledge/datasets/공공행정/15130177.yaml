description_portal: '[통계지리정보서비스(SGIS)] "생활권역 통계지도"서비스의 권역 격자정보입니다.격자명, 격자레벨구분 등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 생활권역 통계지도  사용자가 선택한 특정시설(지점)을 기준으로단위 시간 내 도달 가능한 생활권역(생활반경, 영역)을 시각적으로 제시하고, 해당 영역 내의 통계값을 제공하는 서비스'
