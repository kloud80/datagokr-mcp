description_portal: 이 데이터는 한국남부발전이 각 지역 사업소에서 추진한 지역주민 복지시설 건립 현황을 정리한 자료입니다. 연도별로 조성된 복지시설의 명칭, 건립 시기, 주요 활용 목적 등을 확인할 수 있으며, 테니스장, 체육센터, 문화센터, 공원화 사업 등 다양한 시설이 포함되어 있습니다. 특히 발전소 유휴부지를 활용한 복지 공간 조성 사례도 함께 제시되어 지역사회와의 상생 노력을 보여줍니다. 본 자료는 공기업의 사회공헌 활동과 지역 주민 삶의 질 향상을 위한 시설 투자 현황을 이해하고, 향후 복지정책 및 공간 활용 방향을 분석하는 데 유용한 정보입니다.
