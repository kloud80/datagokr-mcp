description_portal: 본 데이터는 한국산업인력공단에서 운영하는 과정평가형 일학습병행 자격제도와 관련된 통계 정보를 제공합니다. 일학습병행 참여 기업 및 학습근로자 현황, 운영 정보, 평가(외부평가) 통계, 자격 취득 현황 등 제도 운영 전반에 대한 주요 지표를 포함하고 있습니다. 데이터는 연도별·유형별로 분류되어 있어 일학습병행 정책 연구, 자격 운영 현황 분석, 기업·기관의 제도 활용 전략 수립, 현장 맞춤형 인재양성 효과 분석 등에 활용할 수 있습니다. 또한 자격 과정 운영 실태를 파악하고, 직업능력개발 및 현장기반 학습제도의 질 향상을 위한 기초자료로 활용하도록 구성되어 있습니다.
