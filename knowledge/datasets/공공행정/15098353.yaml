summary_user: 소비자 민원학습데이터에서 소비자 상담을 처리하는 기관의 목록으로, 기관마다 기관코드·기관명·상위기관·소재지를 한 행씩 담은 전국 범위의 코드표 성격 파일(약 26KB CSV)이다. 민원학습데이터를 분석하는 연구자나 개발자가 "이 상담 건은 어느 기관이 처리했고 그 기관은 어디 소속·어디 소재인가"를 확인하는 데 쓴다. 기관코드(INSTITUTION_CODE, ccc_cnsl_instt_cd)를 키로 같은 민원학습데이터 계열의 상담 건 데이터와 이어 붙이며, 사업자등록번호·법인등록번호 같은 사업자 키는 없어 공정위 등록·지정·공시 데이터와는 연결되지 않는다.
description_portal: '공정거래위원회 소비자 민원 학습데이터는 소비자들이 공정거래위원회에 제기한 민원에 대한 정보를 담고 있는 데이터셋입니다. 이 데이터는 주로 소비자 상담 내용, 분쟁 유형, 법령 정보 등을 포함하며, 소비자 정책 및 관련 서비스 개선을 위한 학습 자료로 활용됩니다. 이 데이터는 소비자 민원을 처리하는 상담기관의 정보를 보여주는 데이터입니다. 이 데이터는 기관명, 상위기관을 포함하고 있습니다.보유근거 : 소비자기본법 제16조, 제28조, 제35조, 제53조부터 제55조, 제57조 및 동법 시행령 제3조'
