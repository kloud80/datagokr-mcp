summary_user: "광주광역시 모바일광주 앱 '내주변정보'에서 안내하던 무인민원발급기의 기기명·주소·위도/경도·평일/휴일 운영시간을 기기 한 대씩 담은 일회성 파일(2023년 5월 기준)이다. 시민이 \"집이나 직장 근처에서 주말에 증명서를 뽑을 수 있는 무인발급기가 어디에 있나\"를 찾거나, 분석가가 구별 발급기 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 매칭해 잇는다(예: 주민센터·관공서 위치, 전국 무인민원발급기 표준데이터)."
limits: 포털 설명상 2023년 5월 기준의 일회성 데이터라 이후 설치·철거 변동은 반영되지 않는다. 발급 가능한 증명 종류와 수수료는 담지 않으므로 각 구 홈페이지를 따로 확인해야 한다. 공통 코드 키가 없어 다른 데이터와는 주소나 좌표 매칭으로만 연결된다.
