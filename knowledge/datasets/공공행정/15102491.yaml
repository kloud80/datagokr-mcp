description_portal: 한국수력원자력(주)에서 운영중인 공식 인스타그램에 게시된 월말기준 년월, 게시물 수, 게시물 총계를 2022년 3월부터 현재까지 데이터를 제공하는 자료입니다.한수원 인스타그램의 활동 현황을 한눈에 확인할 수 있는 자료로 월별 게시물 수 및 누적 게시물 총계를 포함하고 있어 SNS를 통한 대국민 소통 현황을 분석하거나 홍보성과를 평가하는 자료로 활용될 수 있습니다. 특히 콘텐츠 업로드 빈도나 시기별 활동 추이를 파악하고자 하는 연구자, 언로, 일반국민 등에게 의미있는 자료로 활용될 수 있습니다. 또한 한수원의 디지털 소통 전략을 간접적으로 확인 할 수 있습니다.
