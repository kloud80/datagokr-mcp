summary_user: 국회의원이 직무상 국외활동을 신고한 내역을 건별로 담으며, 대수(UNIT_NM), 인원·목적, 일정 일수, 방문국, 경비지원기관, 보고서 제출 여부, 공개 파일명 같은 항목으로 구성된 것으로 보이고 범위는 전국·비공간이다. 시민·기자·분석가가 "어느 대수 국회에서 어떤 목적으로 어느 나라를 방문했고, 경비는 누가 댔으며, 보고서는 냈는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 국회 의정활동 데이터와는 대수 코드(UNIT_CD)나 이름 매핑으로만 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
