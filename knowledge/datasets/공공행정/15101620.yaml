description_portal: 한국수자원공사 전자조달시스템에서 체결된 계약정보목록을 공사, 용역, 내자별로 제공하는 서비스로, 각 업무구분별 계약구분, 계약일, 계약부서, 계약번호, 계약명, 계약금액, 계약상대자 등의 계약체결현황 정보를 제공합니다. 해당 자료는 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어, 이용자의 편익 증진과 신산업 창출에 기여합니다. 자세한 사항은 한국수자원공사 전자조달시스템(ebid.kwater.or.kr)에서 확인이 가능합니다.* 공사 계약체결현황 정보 조회 서비스, 용역 계약체결현황 정보 조회 서비스, 내자 계약체결현황 정보 조회 서비스
