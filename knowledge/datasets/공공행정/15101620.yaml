summary_user: 한국수자원공사 전자조달시스템에서 체결된 계약을 공사·용역·내자(물품)별로 건별로 담으며, 계약일·발주부서·계약번호·계약명·계약금액·계약자·계약방법·낙찰방법·계약기간을 제공한다. 사업자나 분석가가 '수자원공사가 최근 어떤 용역을 어느 업체와 얼마에 계약했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 계약자명·계약명 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
limits: 세 오퍼레이션 중 실호출 성공은 1개뿐이고 공사(/cntrwkList)·용역(/servcList) 목록은 최소 파라미터로 응답이 없었으며, 필수 파라미터 searchDt는 다른 데이터에서 먼저 받아 넘겨야 한다. 수자원공사 한 기관의 계약만 담아 범위가 좁으므로 공공조달 전반은 조달청 나라장터 데이터로 본다.
