summary_user: 국회의원 한 사람이 본회의 안건 하나에 던진 표결 결과를 담는 건별 데이터로, 대수·의안번호·의안명·표결일·의원 이름(한글·한자)·정당·표결 결과가 한 줄에 들어 있고 범위는 전국이며 지역 단위로 나뉘지 않는다. 유권자나 의정 분석가가 "우리 지역 의원은 이 법안에 찬성했나, 같은 정당 안에서 이탈한 표가 있었나"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 국회 의안·의원 데이터와는 의안번호(BILL_NO)나 의원 이름·정당을 이름 맞추기 방식으로 이어야 한다.
