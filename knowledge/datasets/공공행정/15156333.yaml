summary_user: 2025년 6월 3일 제21대 대통령선거의 투표율을 시·도 등 지역별, 성별, 연령대별로 비교한 집계표 파일로, 전국 14,295개 투표구 중 1,507개 투표구·선거인 4,506,881명(선거인명부 등재 선거인의 10.15%)을 체계적 무작위 추출한 표본조사 결과를 담는다. 선거 연구자나 언론·정책 분석가가 "20대 여성의 투표율과 사전투표율이 다른 연령대·지역보다 얼마나 낮았나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시·도 이름이나 연령대 구간 이름을 맞춰 역대 선거 투표율 분석이나 지역 인구 통계와 이어 쓴다.
description_portal: '2025년 6월 3일 실시한 제21대 대통령선거의 투표율을 지역별, 성별, 연령대별로 비교·분석함으로써 각종 선거의 투표율 제고 등 선거관련 제반 연구의 기초적인 자료로 활용하기 위함.※ 조사방법▶ 모집단: 전국 14,295개 투표구 / 선거인 44,363,148명  / 사전투표자 15,423,607명 / 국외부재자신고인 229,531명 / 재외선거인 28,723명▶ 표본수: 투표구 1,507개 / 선거인 4,506,881명 (선거인명부에 등재된 선거인의 10.15%)▶ 표본추출방법: 체계적 무작위 추출법▶ 투표구수가 30개 미만인 경우 표본선정 방법(조사대상 투표구수 : 3개)※ 조사기간: 2025. 9. 1. ∼ 2025. 9. 10.'
