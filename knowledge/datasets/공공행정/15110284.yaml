summary_user: 가맹사업 브랜드를 연도별·업종 대분류별로 묶어 가맹점 구분별, 직영점 구분별 브랜드 수와 업종 내 비율을 담은 전국 단위 집계 데이터이다(브랜드 건별 원천이 아님). 창업 예정자나 분석가가 "외식·서비스·도소매 같은 업종에서 직영점을 운영하는 브랜드 비중이 얼마나 되나"를 연도별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 가맹정보 데이터와는 연도와 업종 대분류명(indutyLclasNm)의 이름 매핑으로만 맞춰 쓴다.
description_portal: 이 API는 공정거래위원회에서 제공하는 가맹정보_브랜드별,업종별 직영점 및 가맹점 분포 현황 제공 서비스 입니다. 년도를 이용하여 브랜드별,업종별 직영점 및 가맹점 분포 현황에 대한 브랜드율, 직영구분브랜드수, 직영구분명 등을 조회 할 수 있습니다.
