description_portal: 본 데이터는 수성구청 공식 홈페이지 및 디지털 홍보물에 사용되는 **‘수성폰트’**의 제공 현황을 정리한 자료로, 폰트명, 버전 정보, 라이선스 유형(무료·상업적 이용 가능 여부 등), 제작·제공사명, 파일 형식(ttf·otf), 적용 대상(웹, 인쇄, 모바일 등), 배포일자, 데이터 기준일자 등의 항목으로 구성된다. 수성폰트는 구정 홍보, 문서 디자인, 지역 문화 이미지 강화 등을 위해 제작된 전용 서체로, 본 자료는 버전별 제공 시점과 활용 범위를 확인할 수 있도록 구성되었다. 이를 통해 디자인 일관성 확보, 공공브랜드 정책, 민간 디자이너 협업, 홍보물 제작 지원 등에 활용할 수 있다. 또한 웹·모바일·인쇄물 적용 가능 여부를 구분하여 UI/UX 디자인 기획, 접근성 준수, 콘텐츠 제작 안내, 저작권 관리 정책 수립 등의 행정 및 민간 실무에 기초가 된다. 수성구청은 신규 버전 출시 및 라이선스 변경 발생 시 정기적으로 자료를 갱신하며, 본 데이터는 공공기관, 디자인 업체, 문화콘텐츠 제작자, 시민 등이 활용할 수 있는 기초자료로 제공된다.
