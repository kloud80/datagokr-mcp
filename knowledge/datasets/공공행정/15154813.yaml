description_portal: “동구민상 데이터는 광주광역시 동구에서 지역사회 발전에 기여한 시민을 발굴·격려하기 위해 매년 시행하는 ‘동구프라이즈’ 수상자 정보를 체계적으로 정리한 공공데이터입니다. 본 데이터는 회차, 분야, 수상자명, 직업 등 기본 항목으로 구성하여 개인이력, 생애 정보 등 민감한 내용을 제외하고 공개 가능한 정보만 선별했습니다. 이를 통해 지역사회 공헌 인물의 활동을 널리 알리고, 지역 발전 역사와 공적의 흐름을 이해하는 데 도움이 되는 기초자료로 활용될 수 있습니다. 또한 공공기관, 연구자, 시민 등이 지역 인물 정보, 사회 공헌 활동 분석, 교육·홍보자료 제작 등 다양한 목적으로 활용할 수 있도록 제공되는 데이터입니다.”
