summary_user: 주민e직접 플랫폼으로 접수된 주민조례청구를 청구 건별로 담은 원천 파일로, 포털 설명상 2018년 이후 접수분이며 자치단체·조례명·청구대표자·청구일·청구취지·서명 기간·필요서명수와 전자서명수·진행상태를 함께 싣는다. 시민단체나 지방의회 연구자가 '우리 지역에서 주민이 직접 발의를 청구한 조례는 무엇이고 서명 요건을 채워 어디까지 진행됐나'를 확인하거나, 자치단체별 청구 건수와 성사율을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 자치단체 이름을 맞춰 연결해야 하며, 주민총수·필요서명수를 주민등록 인구 자료와 이름 기준으로 대조하는 정도가 가능하다.
description_portal:  주민e직접 플랫폼(juminegov.go.kr)을 통한 주민조례청구 현황 자료이며, 분기별로 등록하는 자료입니다. 해당 자료는 2018년 이후부터 접수된 조민조례청구내역이며 청구년도, 조례명, 청구대표자, 청구일, 청구취지, 공표내용 등의 정보를 제공하고 있습니다. 주민조례청구제도는 2000년도부터 시행되었으며, 「주민조례발안에 관한 법률」에 따라 운영하고 있습니다. 주민조례청구란 일정 수 이상의 주민들이 서명을 통해 지방의회에 직접 만든 조례안의 발의를 청구할 수 있는 제도입니다.
