description_portal: '○ 통계개요* 통계명 : 외국인근로자(국적별)* 작성목적 : 국내 거주 외국인주민에 관한 기본정책 수립, 운영 및 제도개선을 위한기초자료 활용* 조사체계 : 통계청→ 행정안전부* 작성방법 : 인구총조사?주민등록?가족관계?인구변동?외국인등록?거소신고?국적취득 등행정정보를 활용하여 통계 DB 시스템에서 추출ㆍ생성* 조사대상 : 한국국적을 가지지 않은 자 : 국내에 체류하는 외국인 중 90일 이상 체류자한국국적취득자 : 외국인이었으나 한국국적을 취득한 자자녀 : 한국국적을 취득한 자의 미성년자녀 및 한국인과 결혼한 한국국적을가지지 않은 자의 미성년자녀* 작성기준 : 직전년도 11월 1일 0시 기준(통계청 인구주택총조사 기준)* 공표주기 : 매년* 공표범위 : 지역 - 서울시 자치구내용 - 자치구별 국적별 외국인근로자 등○ 용어정의* 한국국적을 가지지 않은 자 (* 90일 미만 단기체류자 제외)- 외국인 근로자 : 체류자격이 단기취업(C-4), 교수 등 취업분야(E-1~E7, E9~E10),방문취업(H-2)인 자- 결혼이민자 : 체류자격을 불문하고 대한민국 국민과 혼인한 적이 있거나 혼인관계에있는 자- 유학생 : 체류자격이 유학(D-2), 일반연수(D-4) 중 ‘대학부설 어학원 연수(D-4-1),외국어연수생(D-4-7)인 자- 외국국적동포 : 체류자격이 "재외동포(F-4)" 중 국내 거소신고자- 기타 : 기업투자, 취재 등 체류자격이 외국인근로자?결혼이민자?유학생?외국국적동포에 해당하지 않는 자 및 단기체류기간 도과 불법체류자* 한국국적을 취득한 자- 국적법 제3조 및 제4조에 따라 한국국적을 취득한 자※ 한국인이 국적상실 후 회복한 경우 및 북한이탈주민은 제외* 외국인 주민자녀 : 미성년자만 집계** ‘한국국적을 취득한 자’의 자녀 및 한국인과 결혼한 ‘한국국적을 가지지 않은 자’의자녀** 외국인주민자녀(출생)는 외국인 또는 귀화한 자의 자녀로서 국적법 제2조(출생에의한 국적취득)에 따른 출생과 동시에 한국'
