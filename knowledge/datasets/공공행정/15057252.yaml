summary_user: 전국 지방자치단체별로 결산 세입 기준 재정자립도를 회계연도(fyr) 단위로 담은 집계 지표 데이터로, 자치단체 코드·이름과 금액 항목, 비율 항목이 함께 들어 있다. 주민이나 분석가가 "우리 시·군·구의 재정자립도가 다른 자치단체보다 높은가, 해마다 어떻게 바뀌었나"를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 자치단체 이름 매핑이나 같은 지방재정365 계열의 자치단체 코드(laf_cd)로만 이어 쓴다.
description_portal: 재정자립도(결산)는 지방자치단체가 자체적인 재원을 통해 예산을 얼마나 충당할 수 있는지를 나타내는 지표로, 지방자치단체의 재정 건전성을 평가하는 중요한 척도입니다. 해당 지표는 자치단체의 세입 중 지방세, 지방세외수입 등 자체수입이 차지하는 비율을 나타내며, 이 비율이 높을수록 중앙정부 의존도가 낮고 자치단체의 자립적인 재정 운영이 가능하다는 의미입니다. 재정자립도는 결산 시 세입 결산액을 기준으로 계산되며, 이 값이 높을수록 자치단체의 재정이 안정적이고 독립적이라고 평가됩니다.
