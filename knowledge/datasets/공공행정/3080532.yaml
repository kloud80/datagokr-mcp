summary_user: 부산광역시 남구가 보유한 공유재산(일반재산)을 필지마다 한 행으로 담은 건별 목록으로, 담당 부서명·소재지·면적(제곱미터)·공시지가(원)를 담는다. 남구 내 특정 위치에 구 소유 일반재산이 있는지, 그 면적과 공시지가가 얼마인지, 어느 부서가 관리하는지를 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지(주소) 문자열 매칭이나 같은 기관(남구) 자료끼리 이름으로만 이어 쓴다.
description_portal: 공유재산 및 물품관리법, 공유재산 및 물품관리법 시행령, 부산광역시 남구 공유재산 및 물품관리 조례에 근거를 두고 부산광역시 남구의 공유재산(일반재산)에 관한 담당 부서명, 소재지, 면적 등의 다양하고 자세한 자료를 각 필지마다 구분하여 순서대로 정렬하여 최신의 정보를 제공합니다. 해마다 공유재산(일반재산)의 내역이 토지의 취득, 처분, 분할, 합병 등의 사유로 면적과 소재지가 변화하고 용도 폐지, 변경 등의 사유로 인하여 부서도 변할 수가 있습니다.  공시지가도 매년 변동이 발생하기 때문에 현재기준으로 현행화하여 순서대로 정렬하여 최신의 데이터를 공개하고자합니다.
