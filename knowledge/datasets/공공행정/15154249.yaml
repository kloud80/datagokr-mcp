description_portal: 본 데이터는 국가통계마이크로데이터통합서비스(MDIS)* 시스템의 추출정보에 관한 내용입니다.- 추출 정보 관리 및 추출상세, 추출  상세 정보 관리,  추출 항목 정보에 대한 내용을 포함하고 있습니다.(추출관리 신청 제목, 다운로드횟수, 자료마스킹여부 등)* 국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다.   이에 국가데이터처는 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.
