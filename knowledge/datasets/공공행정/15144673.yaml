description_portal: 과천시의회에서 처리된 의안의 상세 이력을 담고 있는 공개용 자료입니다. 각 컬럼은 의안의 고유 식별번호, 상정된 대수, 회기 정보, 회기 형식, 의안 번호 및 보조 번호, 의안의 종류, 발의자 정보 및 구분, 발의 일자, 의안 명칭, 집행부 이송일, 공포일, 공포 번호, 의안 처리 결과 컬럼을 포함합니다. 이 데이터를 통해 특정 의안이 어떤 회기에 어떤 방식으로 발의되고 처리되었는지 추적할 수 있으며, 정책 분석, 의정 활동 연구, 시민 참여 확대 등을 위한 기초 자료로 활용할 수 있습니다.시간적 범위는 1991년부터 데이터 기준일까지입니다.※해당 데이터는 과천시의회 홈페이지에 공개 중입니다.
