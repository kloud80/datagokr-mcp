description_portal: “공단에서 운영중인 체육시설의 매출과 연관된 운영 프로그램에 관한 정보”는 공단이 관리하는 체육시설에서 운영 중인 프로그램의 매출 관련 정보를 제공하는 데이터입니다. 본 데이터는 순번, 센터코드, 품목명, 판매금액, 요금 적용 가능 요일, 일일 매표 단체 여부, 사용 여부, 강좌 자유이용 가능 여부 등의 항목으로 구성되어 있으며, 각 프로그램의 운영 현황과 수익 구조를 파악할 수 있도록 설계되었습니다. 이 데이터는 체육시설의 운영 효율성 제고, 수익성 분석, 이용자 맞춤형 서비스 개선 및 재정의 투명한 관리를 위한 기초자료로 활용될 수 있습니다.
