description_portal: 서울특별시 마포구 지방세의 비과세감면 현황에 대한 자료입니다. 이 데이터에는 2013년부터 2024년까지 적용된 각종 법령을 기준으로 지방세 비과세 및 감면 내역이 체계적으로 정리되어 있어, 연도별·법령별 감면 규모와 변동 추이를 한눈에 파악할 수 있습니다. 이를 통해 특정 시기 어떤 법적 근거에 따라 세제 혜택이 제공되었는지 분석할 수 있으며, 정책 변화에 따른 재정 영향도 함께 살펴볼 수 있습니다. 또한 행정기관은 본 자료를 활용하여 지방세 정책의 효과를 평가하고, 향후 재정 건전성 확보 및 합리적인 세제 운영을 위한 기초자료로 활용할 수 있으며, 연구자와 시민에게도 유용한 참고자료로 제공됩니다.
