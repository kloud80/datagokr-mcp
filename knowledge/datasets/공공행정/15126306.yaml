summary_user: 방문판매사업자 등록 현황을 기준년월·시도·시군구·법인여부·영업상태별로 묶어 사업자 수와 자본금 규모 구간(1억원 이하부터 20억 초과, 정보없음까지)별 업체 수를 담은 월별 집계 통계로, 범위는 전국이고 지역 단위는 시군구까지다. 지역별 방문판매업체가 얼마나 늘거나 줄었는지, 영세 자본 업체 비중이 어느 정도인지 추이를 보려는 분석가·언론·지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 지역 이름 매핑이나 기준년월로만 맞춰 붙인다.
description_portal: 이 API는 공저거래위원회에서 제공하는 공정거래위원회_방문판매사업자 등록현황 통계 제공 서비스 입니다.방문판매사업자에 대한 월기준의 기준년월, 갱신년도별, 시도명, 시군구별,  법인여부명,, 영업상태별 사업자 수, 일렬번호, 자본금규모별 통계 등을 제공 합니다.통계표 방문판매사업자 자본금 규모 업체 현황 - 월별, 지역별 작성목적 월별 자본금규모 통계 추이 작성주기 매월 조사대상 방문판매사업자
