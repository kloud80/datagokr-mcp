summary_user: 부산광역시 연제구의 행정구역(토지소재지)별로 지목(대·임야·도로·전·답 등 28개 안팎)마다 면적과 지번 수를 집계한 통계표로, 포털 설명 기준 연제구 전체는 22,702필지·12.11㎢입니다. 연제구 안에서 어느 동에 주거용 대지나 임야, 도로가 얼마나 분포하는지 비교하려는 분석가·주민이 토지 이용 구성을 파악하는 데 쓴다. 전역 공통 조인 키가 없어 다른 데이터와는 토지소재지(동 이름)를 행정구역 코드에 이름으로 매핑해 이어 써야 한다.
description_portal: 부산광역시 연제구의 행정구역별 지목별 면적 및 지번 수의 관한 통계자료입니다.부산광역시 연제구는 총 22,702필지, 12.11㎢이며 부산광역시 전역(769.86㎢)의 1.57%만큼의 면적을 차지하고 있으며,2026년 3월 기준으로 대(16,436필지, 총 면적 대비 47%), 임야(613필지, 총 면적 대비 23%), 도로(4,249필지, 총 면적 대비 15%) 등으로 많이 활용되고 있습니다.연제구의 지목별 면적 및 지번수는 각종 건축물 신축, 토지개발사업 완료, 도로 및 터널 개설 등으로 인해 토지이동이 발생 시 변동이 생길 수 있습니다.
