summary_user: 한국장애인고용공단 소속기관(지역 본부·지사 등)별로 기관명, 전화·팩스번호, 주소, 관할구역, 위도·경도를 한 행씩 담은 전국 단위 기관 목록 파일이다. 장애인 구직자나 장애인을 고용하려는 사업주가 '우리 지역을 맡는 공단 기관은 어디이고 연락처는 무엇인가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·관할구역의 지역명이나 좌표를 기준으로 맞춰 붙여야 한다.
description_portal: 한국장애인고용공단은 장애인고용촉진 및 직업재활법에 따라 장애인이 직업생활을 통하여 자립할 수 있도록 지원하고, 사업주의 장애인 고용을 전문적으로 지원하기 위해 설립되었습니다. 해당 데이터는 한국장애인고용공단 소속기관의 기관명, 전화번호, 주소, 관할구역 등의 정보를 포함하고 있으며, 공단의 조직 구성과 지역별 기관의 운영 현황을 종합적으로 파악하는 데 유용하게 활용될 수 있습니다. 이 정보는 한국장애인고용공단 대표 홈페이지(www.kead.or.kr)에서도 확인하실 수 있습니다.
