summary_user: 경기주택도시공사 홈페이지의 페이지뷰를 월(접속연월) 단위로, 메뉴 1~5단계 경로별로 집계한 조회수(page_dmnd_cnt)를 담는다. 공사 홍보·웹 담당자나 분석가가 "어떤 메뉴가 특정 달에 많이 조회됐고, 정책 홍보 시기에 조회수가 늘었는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월이나 메뉴 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기주택도시공사 홈페이지의 페이지뷰 현황을 정리한 자료입니다. 월별 접속 기록을 기반으로 홈페이지의 메뉴 단계별(1단계~5단계) 이용 내역과 해당 페이지의 조회수를 집계하고 있어, 어떤 메뉴가 많이 활용되는지, 이용자 접근 경로가 어떻게 분포하는지를 파악할 수 있습니다. 이를 통해 공사는 웹사이트 정보 구조 개선, 사용자 편의성 향상, 주요 서비스 홍보 효과 분석에 활용할 수 있습니다. 또한 연구기관이나 정책 담당자는 공공기관 웹서비스 이용 행태 분석, 전자행정 서비스 품질 평가, 디지털 접근성 향상 방안을 마련하는 기초자료로 활용할 수 있습니다. 특정 시기별 페이지뷰 증감은 시민 관심사 변화, 정책 홍보 효과, 온라인 민원 수요를 확인하는 지표로도 의미가 있습니다.
