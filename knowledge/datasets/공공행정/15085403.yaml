description_portal: '○ 통계개요* 통계명 : 소비자 피해구제 현황 (2006년부터)* 통계종류 : 서울시 소비자피해에 대한 구제정보를 제공하는 일반·보고통계* 작성목적 : 거래의 특성상 소비자 피해발생 빈도가 높은 방문판매, 다단계판매 등에서발생한 소비자피해 구제현황을 파악하여 소비자 정책수립의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 서울특별시 민생경제과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 소비자피해 구제유형별(교환, 환불, 배상, 시정, 상담 및정보제공 등) 건수○ 용어설명* 교환 : 물건을 새로운 물건으로 바꿔줌* 환불 : 물건의 구매가를 현금으로 돌려줌* 배상 : 물건의 수리나 이동 등 용역시 파손이나 손실이 발생할 경우 손실금액에대하여 현금으로 보상* 시정 : 소비자약관의 불합리 등 제도상의 문제점에 대해 바로잡음* 상담 및 정보제공 : 소비자피해종류, 구제방법등에 대한 상담 또는 정보제공* 해약 : 계약에 의한 매매가 성립되는 경우 이를 해제함'
