description_portal: '경상남도 남해군의 노인복지시설 현황을 보여주는 자료로, 마을회관과 경로당의 명칭, 소재지, 주소, 전화번호 등을 포함하고 있습니다. 10개 읍면 의 마을회관,경로당(총 482개의 시설)이며 해당 자료를 통해 남해군 내 노인 인구 분포에 따라 지역별 복지 인프라가 균형 있게 배치되어 있음을 보여줍니다.o 구분: 노인복지시설 종료를 뜻하며 마을회관과 경로당으로 구분가능합니다.o 읍면 : 남해군에 있는 읍면명을 뜻하며 납해읍, 이동면, 상주면, 삼동면, 미조면, 남면, 서면, 고현면, 설천면, 창선면 순으로 기재되어있습니다.o 시설명 : 마을회관 및 경로당 시설명을 뜻하면 해당 마을명으로 구분지어지고 있습니다.o 주소 : 시설이 위치한 주소를 나타내며 도로명주소로 표시되어집니다.o 전화번호 : 시설에  있는 전화번호를 나타내며 전화번호가 없는 경우 공란으로 표시되어있습니다.'
