description_portal: '공무원 교육훈련에 대한 통계자료로 내부/외부 교육, 교육종류/기관, 교육 내용에 따라 교육과정 개설 수를 제공합니다.교육 구분교육은 크게 내부교육과 외부 위탁교육으로 나뉩니다.내부교육에는 다시 기본교육, 전문교육, Cyber교육, 특별교육, 기타교육 등이 포함됩니다.외부 위탁교육은 민간기관, 대학기관, 외부 공공기관을 통해 진행된 과정이 포함됩니다.세부 교육과정기본교육: 신규 공무원이나 필수 직무 능력을 위한 기초과정.전문교육: 직무별 전문성을 강화하기 위한 과정으로, 인재개발원 직무과정, IT 집합과정, 상수도 관련 과정 등이 구체적으로 개설됨.Cyber교육: 온라인 기반 직무교육과 정보화 교육으로 나뉘며, 시공간 제약 없이 참여할 수 있는 교육 형태.특별교육: 특정 정책이나 상황에 대응하기 위한 맞춤형 교육.기타교육: 정규 분류 외 특수 목적 교육.직렬별 참여 인원행정직, 세무직, 사회복지, 건축, 토목, 보건, 약무·의료, 임업, 수의, 전기·통신, 지적, 기계, 간호, 화공, 전산, 기능직, 기타 등 다양한 직렬별 교육 참여 현황이 정리되어 있음.'
