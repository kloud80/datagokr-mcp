description_portal: 국민이 소통24 정책참여 설문조사에 참여하며 제출한 의견(텍스트), 관련 첨부자료(문서·이미지 등), 투표 첨부자료, 그리고 추천·비추천 수 정보를 종합적으로 제공하는 데이터입니다. 설문 응답자의 자유 의견과 정책 관련 자료, 의견에 대한 반응 정보를 포함하여 국민 참여 과정에서 나타나는 다양한 시각을 파악할 수 있습니다. 2025년 9월 10일 기준 총 53,256건이 축적되어 있으며, 건수가 많아 CSV 파일로 개방되며 일부 환경에서는 Excel에서 정상적으로 열리지 않을 수 있습니다. 청년 정책 개선, 재난·안전 관리, 디지털 전환 서비스, 개인정보 보호 등 사회적 주요 이슈에 대한 국민 의견을 분석할 수 있고, 정책 수립 및 민원 대응 연구에 활용 가능합니다. 데이터는 분기별로 정기 업데이트되어 최신 동향을 반영합니다.
