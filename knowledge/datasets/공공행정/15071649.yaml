summary_user: 서울시에 소재한 영화배급업 사업장 한 곳당 한 행씩 인허가일자·취소일자, 영업상태와 상세영업상태, 폐업·휴업 일자, 주소·좌표, 시설면적·건물층수 같은 입지 특성을 담은 건별 인허가 원장이다. 분석가나 사업자가 서울에서 영화배급업체가 어느 지역에 몰려 있고 언제 개업·폐업했는지를 살펴 문화산업 현황이나 상권 입지를 판단하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관(LOCALDATA 인허가 계열) 코드로만 이어 쓰고, 좌표(X, Y)로 상권·행정동 자료와 공간 결합하는 방식이 현실적이다.
description_portal: 서울시 영화배급업 인허가 정보는 서울시에 소재한 영화배급업 관련 사업장의 인허가 현황과 기본 특성을 제공하는 공공데이터입니다. 각 사업장에 대해 인허가일자와 인허가취소일자, 영업상태 및 상세영업상태, 폐업 및 휴업·재개업 일자 등 행정이력을 포함하고 있어, 시간에 따른 영업 변동과 업계 현황을 파악하는 데 활용할 수 있습니다. 또한 사업장명, 업태구분명, 문화체육업종명, 문화사업자구분명, 지역구분명 등의 정보를 통해 영화배급업체의 업종 특성과 지역적 분포를 간략히 분석할 수 있습니다. 지번주소와 도로명주소, 우편번호, 전화번호, 좌표정보(X, Y) 등이 제공되어 사업장의 위치를 정확히 확인할 수 있으며, 소재지면적, 시설면적, 건물층수, 건물용도명, 주변환경명 등 일부 시설 및 입지 특성 정보도 함께 확인할 수 있습니다. 이 데이터는 영화배급업 인허가 관리, 지역별 영화산업 인프라 분석, 문화산업 정책 수립, 상권 및 입지 분석 등 행정·연구·민간 활용을 위한 기초 자료로 유용하게 사용될 수 있습니다.
