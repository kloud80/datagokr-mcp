description_portal: '[통계지리정보서비스(SGIS)] "일자리 맵" 서비스의 "일자리보기"에서 사용되는 일자리 분류코드간 매핑정보입니다.대분류 및 소분류 정보를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 일자리맵  고용24와 인크루트와 사람인에서 수집된 구인정보를 이용하여 오늘의구인현황, 일자리보기, 구인현황분석 등 사용자 조건에 맞는 일자리정보 및 현황을 제공하는 서비스'
