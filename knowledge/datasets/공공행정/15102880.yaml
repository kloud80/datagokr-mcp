summary_user: 서울주택도시공사가 공고한 청년매입임대주택을 주택 한 호씩 담은 건별 목록으로, 자치구·소재지 주소·주택구조·전용면적·성별 제한과 함께 입주자 유형(청년, 대학생·취업준비생)과 순위(1순위 시세 30%, 2~3순위 시세 50%)별 보증금·월 임대료를 담는다(CSV 약 174KB). 청년이나 대학생이 '내가 원하는 자치구에 있는 청년매입임대 주택의 면적과 내 순위 기준 보증금·월세는 얼마인가'를 확인하거나, 분석가가 자치구별 공급 분포와 임대료 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 자치구 이름이나 소재지 주소를 매핑해 이어 써야 한다.
description_portal: 이 데이터는 청년 주거 안정을 목적으로 서울주택도시공사(SH공사) 등에서 제공하는 청년매입임대주택의 공고별 주택 목록으로, 주택별 세부 조건과 임대료 기준 정보를 포함한 실무 중심의 자료입니다. 주요 항목에는 주택 번호, 주택유형, 자치구, 거주 형태(공동/단독 등), 성별 제한 여부, 전용면적(㎡), 그리고 입주자 유형(청년 또는 대학생·취업준비생) 및 순위(1순위 또는 2~3순위)에 따른 시세 비율(30% 또는 50%) 적용 보증금 및 월 임대료가 상세히 기재되어 있습니다. 또한 각 주택의 구체적인 소재지 주소도 함께 제공되어, 실질적인 입주 선택에 도움이 됩니다. 이를 통해 다양한 조건에 따른 주택별 임대료 수준을 비교 분석할 수 있으며, 지역별 공급 패턴, 전용면적 분포, 시세 반영 기준 등을 정량적으로 파악할 수 있습니다. 청년층을 위한 맞춤형 주거복지 정책 수립, 공급·수요 매칭 전략 분석, 공공임대의 실효성 평가 등에 활용도가 높은 데이터입니다.
