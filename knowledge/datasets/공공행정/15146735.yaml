summary_user: 정보공개포털로 신청된 정보공개 청구·이의신청 건 가운데 2015년 1월부터 2025년 7월까지 열린 정보공개심의회 개최 내역을 건별로 담은 전국 단위 CSV 파일로, 한 처리대장번호에 심의 기록이 여러 건 붙을 수 있다. 정보공개 제도를 연구하는 분석가나 시민단체가 "비공개 결정에 대한 이의신청이 심의회에 얼마나 자주 올라가고, 기관별로 어떤 공개 결정으로 이어지는가"를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 처리대장번호(정보공개시스템 내부 일련번호)나 심의요청 부서 코드 같은 기관 코드로만 제한적으로 연결한다.
limits: 처리대장번호·심의회일련번호·공개구분코드 등은 정보공개시스템 안에서만 쓰는 번호라 별도 코드표가 없고, 외부 데이터와 바로 조인되지 않는다. 각 기관이 직접 등록한 건만 실리며 기관 내규에 따라 일부 정보는 비공개될 수 있어 전체 심의회 개최 현황으로 단정하면 안 된다.
