description_portal: 정보공개심의회 데이터는 정보공개포털을 통하여 신청된 청구/이의신청건 중 2015년 1월부터 25년 7월까지 개최된 정보공개 심의회에 대한 정보를 제공합니다.구성 정보는 청구기본정보(처리대장번호, 청구이의구분코드, 공개구분코드 , 처리부서정보)와 심의회 관련 정보(심의일자, 심의회 등록 부서, 심의등록순번 등)으로 구성된 데이터를 제공합니다. -한 처리대장번호 당 다수의 심의 정보가 등록될 수 있습니다.이외 필요시 정보공개포털을 통하여 각 기관으로 청구해주시길 바랍니다.단, 기관 내규에 따라 일부 정보는 비공개 할 수 있습니다.해당 데이터는 각 기관에서 정보공개시스템을 통해 직접 등록한 데이터입니다. 따라서 기관에서 등록되지 않은 데이터는 표기되지 않습니다.* 일부 등록 번호(처리대장번호, 심의회일련번호, 공개구분코드 등)는 정보공개시스템 내에서만 사용하는 일련번호이므로 별도 코드가 존재하지 않습니다.
