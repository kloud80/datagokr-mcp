summary_user: 서울시 자치구가 허가·관리하는 식육포장처리업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(영업·휴업·폐업)·폐업일자·휴업기간·재개업일자와 사업장명·전화번호·주소·좌표를 포함한다. 시민이나 축산물 유통 사업자가 '우리 동네에서 지금 영업 중인 식육포장처리업소는 어디이고 언제 문을 열거나 닫았나'를 확인하거나, 분석가가 업소 개폐업 이력을 상권 분석 원료로 쓰는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 내용은 LOCALDATA 인허가 자료와 같은 원천을 공유한다.
limits: 포털 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 따로 받아 호출해야 한다. 공통 조인 키가 없어 사업자등록·위생점검 등 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다.
