description_portal: '부산광역시 연제구에 등록된 차량현황을 용도별(관용, 자가용, 영업용) 및 차종별(승용차, 승합차, 화물차, 특수차)로 세분화하여 제공합니다.자동차관리법 제3조에 따라 자동차의 종류는 아래와 같습니다.1. 승용자동차: 10인 이하를 운송하기에 적합하게 제작된 자동차2. 승합자동차: 11인 이상을 운송하기에 적합하게 제작된 자동차 　다만 다음의 경우는 승차 인원이 10인 이하라도 승합자동차로 분류됨.　- 내부에 특수한 설비가 설치되어 승차 인원이 10인 이하로 제한된 경우　- 국토교통부령으로 정한 경형 전방조종자동차 중 승차 인원이 10인 이하인 경우3. 화물자동차: 화물을 운송하기에 적합한 화물적재공간을 갖추고, 화물적재공간의 총적재화물의 무게가 운전자를 제외한 승객이 승차공간에 모두 탑승했을 때의 승객의 무게보다 많은 자동차4. 특수자동차: 다른 자동차를 견인하거나 구난작업 또는 특수한 용도로 사용하기에 적합하게 제작된 자동차로서 승용자동차, 승합자동차 또는 화물자동차가 아닌 자동차'
