summary_user: 한국주택금융공사 지사별로 지사명, 주소, 관할지역, 대표번호, 팩스번호를 한 건씩 담은 전국 범위의 지사 목록이다. 주택연금이나 보금자리론 상담을 위해 내 주소지를 관할하는 지사가 어디이고 전화번호가 무엇인지 찾으려는 국민이나, 공공기관 창구 위치를 정리하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 주소나 관할지역 이름을 행정구역명에 맞춰 이어 쓰거나 같은 기관의 다른 데이터와 지사명으로 연결한다.
limits: 표준 행정코드나 기관 코드 같은 공통 키가 없어서 다른 데이터와 붙일 때는 주소·지역명을 직접 매핑해야 한다. 포털 설명에는 시계열 정보가 있다고 되어 있지만, 실제 필드는 지사 연락처와 위치 정보뿐이라 시계열 분석이나 실적 분석에는 쓸 수 없다. 호출에는 serviceKey가 필요하고, 개발계정은 하루 1,000회로 제한된다.
