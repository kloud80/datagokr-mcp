description_portal: '1. 가구에 대한 가계수지 실태를 파악하여 국민의 소득과 소비 수준변화의 측정 및 분석 등에 필요한 자료를 제공2. 제공 자료: 가구당 월평균 가계수지, 소득5분위별 가구당 가계수지, 가구원수별 가구당 월평균 가계수지 등3. 공표 주기: 분기(소득/지출), 연간(지출)4. 유의사항- 조사개편 등으로 인한 연도별 조사대상 포괄범위 및 집계기준이 다르므로 자료 이용시 유의해야 함.- 도시근로자가구란 도시지역에 거주하는 가구로서 가구주가 임금 근로자인 가구를 의미하며, 1963년부터 이에 대한 통계 시계열자료가 제공되고 있음.- 소득에 관한 모든 금액자료는 가구당 월평균 금액이며, 별도의 표시가 없는 한 물가상승분이 포함된 명목금액임.- 현재 가구를 구성하고 있는 가구원에 대한 소득과 지출을 조사하여 집계한 자료이므로 타지에 나가 있는 가족의 소득과 지출은 포함되지 않음- 가구특성은 가구주를 기준으로 한 것임.- 분기별 소득 자료는 계절성을 가지고 있으므로 전년동분기비를 중심으로 분석하여야 함.- 5(또는 10)분위별 소득이란 가구를 소득순으로 나열한 다음, 최하위 가구부터 최상위 가구까지 5(또는 10)구간으로 등분하여 각 구간별 소득을 평균한 금액임.- 2014년부터 통신사를 통해 통신장비, 통신서비스 비용 구분을 보완하였으므로 시계열 비교시 유의가 필요'
