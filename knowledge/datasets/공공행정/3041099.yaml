summary_user: 부산시설공단이 추진하는 주요 정책·사업(도시고속도로 노면개선, 광안대교 강교도장 보수 공사 등)을 사업 한 건씩 등록번호·정책명·소관부서로 담은 정책실명제 등록 목록이며, 2.4KB 남짓의 작은 CSV 파일입니다. 시민이나 언론·분석가가 "광안대교 보수 공사는 공단의 어느 부서가 맡았나" 같은 질문에 답할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 정책명·사업명을 문자열로 맞추거나 같은 기관(부산시설공단)의 자료끼리만 이어 쓴다.
description_portal: 정책실명제 등록 정보는 부산시설공단이 수행하는 주요 정책과 사업의 집행과정을 실명으로 투명하게 기록하는 제도입니다. 데이터에는 정책명, 소관부서 등이 포함되어 있으며, 도시고속도로 노면개선 공사, 광안대교 해상교량 강교도장 보수 공사 등 공단에서 추진하는 주요 사업이 명시되어 있습니다. 해당 정보는 단순한 정책 목록이 아닌, 정책 결정의 배경과 실행과정을 추적할 수 있는 기반자료로 활용됩니다. 정책실명제는 국민의 알 권리를 보장하고, 행정의 책임성과 투명성을 높이는 데 기여하며, 사회적으로 요구되는 공공기관의 신뢰 회복과 정책에 대한 시민 참여 확대에 부응하는 중요한 제도입니다.
