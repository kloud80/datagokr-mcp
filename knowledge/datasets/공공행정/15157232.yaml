summary_user: 온비드에 등록된 공매 물건 가운데 차량을 뺀 동산으로서 현재 입찰 중이거나 입찰 예정인 물건을 물건 단위로 담는다. 각 물건마다 재산유형, 처분방식, 입찰기간, 감정평가금액, 최저입찰가격, 유찰횟수, 소재지가 들어 있다. 개인·사업자는 이 데이터로 이번 주에 입찰할 수 있는 압류재산이나 불용품 동산이 무엇인지, 감정가 대비 최저입찰가가 얼마인지 확인한다. 실측에서 전역 조인 키는 찾지 못했으며, 물건관리번호(cltrMngNo)와 공매조건번호를 함께 넣어 같은 기관의 온비드 물건 상세·입찰정보 서비스와 잇는다. 지번·도로명 PNU 필드는 국유재산 체인과 연결할 후보로만 본다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid)에 등록된 공매 물건목록 중 물건유형이 동산(차량 제외)으로 분류되며 현재 입찰 중이거나 입찰예정인 동산목록을 조회할 수 있는 서비스입니다. 이용자는 물건명, 재산유형, 입찰기간 등의 항목으로도 정보를 조회할 수 있습니다.  조회된 결과로 물건관리번호, 재산유형, 물건명, 입찰시작일시, 입찰종료일시, 감정평가금액, 최저입찰가격 등의 항목을 조회할 수 있습니다.  필수 입력 조건 : 재산유형코드(prptDivCd), 수의계약가능여부(pvctTrgtYn)'
team:
  dept: 디지털시스템실
