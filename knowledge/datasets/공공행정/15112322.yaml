summary_user: "경기도 시군별로 장애인전용주차구역 불법 주차 위반 건수, 계도 건수, 과태료 부과 건수·금액, 징수 건수·금액을 기준연도(crtr_yr)별로 묶은 집계 통계로, 건별 단속 기록은 담지 않는다. 지자체 담당자나 분석가가 '어느 시군이 위반이 많고, 부과한 과태료를 얼마나 징수했는가(징수율)'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)과 기준연도를 이름으로 맞춰 이어 쓴다(예: 시군별 장애인 인구, 주차시설 통계)."
description_portal: 이 데이터는 각 시군에서 장애인전용주차구역 내 불법 주차 행위에 대해 적발한 위반 건수와 이에 따른 계도, 과태료 부과 및 징수 현황을 연도별로 집계한 통계자료입니다. 지역별로 얼마나 많은 위반 행위가 발생했는지, 실제 과태료 부과와 징수가 어떻게 이루어졌는지 파악할 수 있으며, 이동약자 보호 정책의 이행 실태를 객관적으로 평가할 수 있는 기초 자료입니다. 또한 이 데이터를 통해 지역 간 단속 및 징수 실효성 비교, 과태료 납부율 분석, 장애인 편의시설 보호 인식 수준 진단 등 정책 평가 및 개선 방안 수립에 활용할 수 있습니다. 공공질서 유지와 교통 약자 보호를 위한 실태 파악에 필수적인 자료입니다.
