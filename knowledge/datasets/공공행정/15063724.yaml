description_portal: 한전 KPS(주) 신규채용 현황입니다.한전 KPS(주)는 매년 사회적 가치 실현과 「공공기관의 운영에 관한 법률」 등 공공기관 채용 관련 법령 준수를 위하여 투명하고 공정한 인재 채용을 추진하고 있습니다. 채용의 전 과정에서 공정한 기회 제공이라는 가치를 실현하고 청년, 여성, 지역인재 등에 대한 채용기회 확대에 기여하고 있습니다.이와 관련하여 본 자료는 각 연도별 일반 정규직 신규채용 현황을 비롯하여 청년, 여성, 장애인, 비수도권 지역인재, 이전지역 인재로 구분한 신규채용 현황 정보를 제공합니다.
