description_portal: '세종특별자치시시설관리공단은 봉안당·봉안담 등 봉안시설의 구조와 배치를 정확하게 안내하고 제공하기 위해 봉안당(담) 구역별 맵 생성 정보 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 각 봉안시설의 구역·블록별 공간 정보를 기반으로 디지털 맵(배치도)을 생성하기 위해 구축된 자료이며, 봉안시설 운영·유지관리 및 시민 안내 서비스에 활용됩니다.■ 데이터 컬럼 구성봉안시설구분 - 봉안시설의 종류를 구분하는 항목    예: 봉안당, 봉안담봉안구역구분 - 봉안시설 내 구역을 식별하는 구분값    예: 1층, 2층 등봉안블럭구분 - 구역 내 세부 블록을 식별하는 구분값가로크기해당 블록 또는 구역을 표시하는 가로 길이(단위: cm)세로크기해당 블록 또는 구역을 표시하는 세로 길이(단위: cm)■ 데이터 제공 목적봉안당(담) 구역별 맵 생성 정보 데이터는 다음을 목표로 제공합니다. - 봉안시설의 구역·블록 구조를 정확하게 공개하여 시민 안내 서비스 강화 - 시설 배치도 생성 및 디지털 맵 제작을 위한 기초 데이터 제공 - 봉안당·봉안담 관리 업무의 효율성 향상 및 시설 운영 고도화 - 위치 기반 정보 제공을 통한 민원 응대 및 시설 이용 편의성 증진세종특별자치시시설관리공단은 봉안시설 이용자의 편의를 높이기 위해, 시설 구조 정보를 지속적으로 갱신·제공하며 투명한 장사행정을 실현해 나가겠습니다.'
