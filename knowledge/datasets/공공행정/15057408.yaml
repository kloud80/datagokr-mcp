summary_user: 지방자치단체별 연간 세출예산 규모를 회계연도·자치단체 단위로 담은 집계 자료로, 세출총계와 일반회계·기타특별회계·공기업특별회계·기금별 예산액을 2012회계연도부터 전국 범위로 제공한다. 분석가나 주민이 "우리 시·군·구의 올해 세출예산은 얼마이고 일반회계와 기금 비중은 어떤가"를 확인하거나 자치단체 간·연도 간 예산 규모를 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 자치단체 코드·이름(laf_cd 등)을 같은 지방재정365 계열 자료와 맞추거나 이름 매핑으로 연결한다.
description_portal: 지방자치단체의 세출예산은 특정 회계연도 동안 그들의 목적을 달성하기 위해 지출할 것으로 예상되는 모든 지출 항목의 총합으로 계산되며 일반적으로 운영비, 인건비, 토지/자산 구입비, 복지 비용, 공공 서비스 비용 등이 포함됩니다. 이 자료는 지방자치단체의 연간 세출예산 규모(일반회계, 기타특별회계, 공기업특별회계, 기금)를 분석한 자료입니다.세출예산 정보는 2012회계연도부터 제공되며 대상회계는 일반회계, 기타특별회계, 공기업특별회계, 기금입니다. 제공되는 세부항목은 자치단체별 세출총계, 회계별 예산액 등 항목입니다
