description_portal: 경상북도 청송군 관애에 위치한 조경관련 업체 현황(상호명, 주소, 전화번호, 데이터기준일자)을 제공합니다.조경관련업종은 조경 설계, 시공, 관리 등 조경 분야의 다양한 업무를 포괄하는 산업분야를 의미합니다. 대표적으로 조경공사업, 조경식재.시설물공사업, 조경엔지니어링, 조경관리업 등이 있습니다.2025년 기준 조경산업 관련 업종은 약 12,000개, 종사자 수는 10만명 이상, 매출액은 약 8조원 규모로 집계됩니다.조경관련업종은 설계, 시공, 관리 등 다양한 분야로 세분화되어 있으며, 최근에는 산림.조경 융합등 업무 영역이 점차 확대되고 있습니다.
