summary_user: 통영시의회 4대부터 9대까지의 의안을 건별로 담은 파일로, 안건명·회기·의안 종류·발의자와 소관 위원회 회부·상정·처리일, 본회의 처리 결과, 집행부 이송일·공포일까지 의안 한 건의 심사 경과를 한 행에 기록한다. 시민이나 지역 정책 분석가가 '특정 대수 통영시의회에서 의원이 발의한 조례안이 몇 건이고 위원회와 본회의에서 어떻게 처리됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 시군구 의회 의안정보나 통영시 자치법규와는 안건명·의안 번호·공포번호 같은 이름·번호 매칭으로만 이어 쓴다.
description_portal: 통영시의회 대수는 4대부터 9대까지 의안에 대하여 안건명,대수,회기,의안 종류,의안 번호,발의일,발의자 구분,발의자,발의의원,소관 위원회,소관 위원회 회부일,소관 위원회 보고일,소관 위원회 상정일,소관 위원회 처리일 등 정보를 제공합니다. 해당 내용은 통영시의회 홈페이지(https://www.tycl.go.kr)에서 확인할 수 있으며, 통영시 인터넷방송 홈페이지(https://www.tycl.go.kr/kr/tv)에서 회의영상을 보실 수 있습니다. 위원회 구성은 기획행정위원회, 산업건설위원회, 예산결산특별위원회가 있습니다.
