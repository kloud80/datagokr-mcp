description_portal: '서울특별시 강남구_불법주정차 위반 단속 CCTV 위치정보강남구는 교통 혼잡 해소와 보행자 안전 확보, 주정차 질서 확립을 위해 주요 도로변 및 상습 불법주정차 구역에 CCTV를 설치하여 실시간 단속을 실시하고 있습니다. 이에 따라 단속장비의 위치정보를 공개함으로써 주민의 자발적 질서 준수 유도 및 교통환경 개선을 도모하고 있습니다.개방 데이터는 단속장비명, 설치 위치 주소, 설치 좌표(위도·경도), 설치일자, 담당부서 등으로 구성되어 있습니다.※ 일부 정보는 보안상의 이유로 단속 사각지대 방지 및 혼란 방지를 위한 시간·형식 제한이 있을 수 있습니다.활용 기대효과로는▶ 시민 자율 준법 유도: 불법주정차 단속 위치를 사전에 안내함으로써 시민의 사전 인식 제고 및 위반 예방 유도▶ 교통정책 수립 자료 활용: 불법주정차 밀집 구간 분석 및 단속장비 추가 설치 필요성 검토 등 정책 수립 자료로 활용▶ 안전사고 예방 및 보행환경 개선: 이면도로 및 어린이보호구역 등 주요 안전구역 내 주정차 행위 억제를 통해 사고 위험 감소▶ 공공서비스 접근성 강화: 시민이 모바일 앱 또는 포털을 통해 단속 위치를 확인하여 실시간 주차계획 수립에 활용 가능등을 기대할 수 있습니다.'
