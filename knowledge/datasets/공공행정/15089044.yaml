description_portal: 한국소비자원은 소비자 상담 데이터와 외부 소셜 데이터를 결합하여 소비 시장에서 발생하는 다양한 소비자 이슈를 신속히 탐지하고 국민에게 제공하기 위해 소비자이슈 리스트를 작성했습니다. 본 자료에는 각 이슈의 발생 일자, 관련 품목, 주요 내용, 주제 등이 포함되어 있어 소비자 문제의 유형과 특성을 구체적으로 파악할 수 있습니다. 다만 2023년 7월 이후로는 소비자이슈 정보 발행이 중단되었으나, 본 자료는 과거 소비자 이슈 분석과 정책 연구, 소비자 권익 보호 활동의 기초 자료로 여전히 활용 가치가 크며 학술적 참고 자료로도 의미를 지닙니다.
