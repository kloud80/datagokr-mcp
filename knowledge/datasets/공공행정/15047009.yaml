description_portal: '○ 통계개요* 통계명 : 인구이동(연령별/월별)* 통계종류 : 서울시 인구이동 현황을 연령별ㆍ월별로 제공하는 지정ㆍ보고통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국 국민의 지역별 인구이동량 및 이동방향 등을 파악하여 지역간의균형적 국토개발, 교통, 교육 및 주택 등의 정책수립 자료와 지역별인구추계에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 연령별ㆍ월별ㆍ성별, 시도내ㆍ시도간 이동 인구수 등○ 용어설명* 전입 : 행정 읍면동 경계를 넘어 다른 지역에서 특정 지역으로 이동해 온 경우* 전출 : 행정 읍면동 경계를 넘어 특정 지역에서 다른 지역으로 이동해 간 경우* 순이동 : 총전입-총전출* 시도내 이동 : 이동전과 이동후의 시도는 같고 행정 읍면동이 다른 이동- 시군구내 이동 : 시도내 이동 중에서 이동전후의 시군구는 같고 행정 읍면동이 다른 이동- 시군구간 이동 : 시도내 이동 중에서 이동전후의 시군구가 다른 이동* 시도간 이동 : 시도를 달리하는 이동(이동전과 이동후의 시도가 다른 경우)'
