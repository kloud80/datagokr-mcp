summary_user: 서울시 복합유통게임제공업 업소별 인허가 원장으로, 인허가·취소·폐업·휴업 일자와 영업상태, 사업장명·주소·좌표, 시설면적·층수·비상구·방음·조명 등 시설 항목을 업소 한 건 단위로 담는다. 창업 예정자나 상권 분석가가 특정 자치구에서 복합게임업소가 언제 문을 열고 닫았는지, 지금 영업 중인 곳이 어디인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 코드(자치단체코드·관리번호)로만 잇고, 원천이 같은 LOCALDATA 인허가 데이터와 함께 상권 점포 이력 분석에 쓴다.
description_portal: 서울시 복합유통게임제공업 인허가 정보는 게임기, 영상물, 노래방 등 다양한 유통·오락 기능이 결합된 복합게임업소의 인허가 및 영업 현황, 위치·시설 특성을 제공하는 데이터입니다. 인허가일자, 취소·폐업·휴업·재개업일자와 영업상태·상세영업상태 정보를 통해 업소별 영업 이력을 파악할 수 있으며, 사업장명, 전화번호, 주소, 좌표, 소재지·시설면적으로 입지와 규모를 확인합니다. 층수, 건물용도, 통로너비, 조명·음향·환기·방음·소방·편의시설, 비상구·비상계단 여부는 안전성과 이용환경 평가에 활용됩니다. 총게임기수, 제공게임물명, 기존게임업외업종명, 노래방실·청소년실 관련 항목, 공연장형태구분명, 제작취급품목내용, 품목명 등은 제공 콘텐츠와 업소 성격을 보여 주며, 문화체육업종명, 문화사업자구분명, 지역구분명으로 문화·여가 산업 내 역할과 입지 특성을 분석할 수 있는 자료입니다.
