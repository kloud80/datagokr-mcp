summary_user: 농식품공공데이터포털에 개방된 축산 분야 데이터 목록을 데이터셋·데이터 한 건씩 담은 메타데이터 목록으로, 데이터셋명·설명·담당 기관과 담당자·키워드·이용허락범위·업데이트 주기·제공 형태(그리드·오픈API·파일·지도 등)를 담는다. 축산 관련 연구자나 분석가가 '가축·축산물 유통 관련 공공데이터가 어떤 것이 있고 오픈API나 파일로 받을 수 있는가'를 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 데이터셋ID·데이터명이나 링크URL·공공데이터포털URL로 실제 원천 데이터셋을 찾아가는 색인으로 쓴다.
description_portal: '농식품 공공데이터 포털에 공개된 축산 데이터 목록은 농림축산식품부에서 관리하는 다양한 축산 관련 정보를 제공합니다. 포털에 수집된 데이터에는 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함 유무, 상위분류, 제3자권리, 이용허락범위, 업데이트 주기, 서비스 유형 등의 정보가 포함되어 있어 각종 연구 및 분석, 정책 수립 등에 활용될 수 있습니다. 이러한 데이터는 농산물의 생산 및 유통과 관련된 의사결정에 필요한 기초 자료로 활용될 수 있으며, 축산물 유통 현황 분석, 농가 지원 정책 수립 등 다양한 분야에 응용 가능합니다. 데이터는 다음과 같은 구조로 이루어져 있습니다.  - 데이터셋ID(문자형) : 데이터셋을 고유하게 식별하는 아이디입니다.  - 데이터셋명(문자형) : 데이터셋의 이름을 나타냅니다.  - 데이터셋설명(문자형) : 데이터셋에 대한 설명 정보를 포함하고 있습니다.  - 기관명(문자형) : 데이터가 수집된 기관의 이름입니다.  - 담당자명(문자형) : 데이터에 대한 책임을 지는 담당자의 이름입니다.  - 전화번호(숫자형) : 담당자의 전화번호를 나타냅니다.'
