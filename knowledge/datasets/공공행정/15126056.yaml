summary_user: 국회사무처에 접수된 정보공개청구 이의신청의 처리현황을 연도·일련번호 단위로 담으며, 신청일자, 신청 사유와 방법, 처리 결과, 공개 파일명 등의 항목을 포함한다. 국회사무처의 정보공개 결정에 이의를 제기한 건이 어떤 사유로 접수돼 어떻게 처리됐는지 알고 싶은 국민이나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 연도나 기관 코드(INST_CD)를 기준으로 이름·코드를 맞춰 연결해야 한다.
