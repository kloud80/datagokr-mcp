summary_user: '대전역 지하도상가(역전지하도상가)에서 공사 등으로 점포가 바뀔 때 생기는 점포별 이력을 건별로 담으며, 항목은 일련번호·점포이름·전화번호·구분·등록일이고 파일 크기는 약 8KB 규모다. 대전역 지하상가에 어떤 점포가 언제 들어오고 바뀌었는지 확인하려는 상인·창업 희망자나 상권 변화를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 상권·인허가 자료(예: LOCALDATA 인허가)와는 점포이름 같은 이름 매핑으로만 이어 쓸 수 있다.'
description_portal: 대전광역시시설관리공단에서 운영 중인 대전역 지하도상가의 점포이력에 대한 정보를 제공하고 있습니다. 공단은 체육, 환경, 복지, 기반 4개 분야의 시설을 관리하고 있으며 역전지하도상가는 기반시설에 해당됩니다. 데이터에 표시되는 점포정보이력은 공사 등으로 점포가 변경될때 발생됩니다. 역전지하도상가의 주소는 대전광역시 동구 중앙로 지하 200 이며, 해당 파일에서 제공하는 정보는 일렬번호, 점포이름, 전화번호, 구분, 등록일입니다. 데이터 기준일은 2025년 7월 1일 기준입니다.
