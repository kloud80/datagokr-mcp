summary_user: 예천군의회에서 다룬 의안을 한 건씩 담은 원천 파일로, 대수·의안번호·의안명·제출자와 발의일부터 위원회 회부·처리, 본회의 상정·처리·결과, 집행기관 이송, 공포번호·공포일까지의 진행 날짜를 기록한다(CSV 약 34만 바이트). 주민이나 분석가가 특정 조례안이 언제 발의돼 위원회와 본회의를 거쳐 언제 공포됐는지, 의안이 처리되기까지 얼마나 걸렸는지 확인하는 데 쓴다. 다른 데이터와 바로 이을 공통 조인 키는 없어서, 의안명·공포번호 같은 이름 매칭이나 같은 기관(예천군) 기준으로만 자치법규·회의록 등 다른 자료와 연결한다.
description_portal: 예천군 지방의회 의안정보는 예천군 의회에서 다루어진 각종 의안의 상세한 진행 내역을 담고 있는 행정 정보입니다. 이 데이터는 의안번호, 의안명, 제출자, 발의일, 본의회보고일, 본회의상정일, 본회의처리일, 본회의결과, 집행기관이송일, 공포번호, 공포일, 기준일자 등 다양한 항목으로 구성되어 있으며, 각 의안이 처음 발의된 시점부터 의회 내 심의 및 처리 과정을 거쳐 최종적으로 공포 및 이송되는 전 과정을 포함합니다. 이를 통해 의회의 입법 활동과 집행기관과의 연계 과정을 명확히 파악할 수 있으며, 주민에게 투명한 입법 절차를 제공하고 행정 의사결정의 근거를 제공하는 중요한 자료입니다.
