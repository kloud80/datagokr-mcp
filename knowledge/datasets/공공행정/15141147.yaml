summary_user: 국가인권위원회가 처리한 진정사건 결정문을 사건 한 건당 한 행으로 담은 목록이며, 사건번호·사건명·의결일자·결정문 일련번호와 결정문 상세 링크를 전국 범위로 제공한다. 인권 분야 연구자나 정책 담당자가 '특정 유형의 차별·인권침해 진정이 언제 어떻게 의결됐는가'를 찾아 유사 사건을 비교하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으며, 결정문 일련번호(결정문일련번호)나 상세 링크로 같은 법제처 결정문 본문 조회와 잇거나 사건번호·사건명으로 맞춰 연결한다.
description_portal: 법제처 국가인권위원회 결정문 목록 조회 데이터는 국가인권위원회가 접수하여 처리한 진정사건의 결정문 목록 정보를 제공합니다. 본 데이터는 사건번호, 진정유형, 피진정인, 결정일자, 처리결과 등 주요 항목을 포함하고 있으며, 각 사건의 분류 및 결정 경과를 체계적으로 확인할 수 있도록 구성되어 있습니다. 이를 통해 인권침해나 차별행위에 대한 사건별 처리 현황을 일목요연하게 파악할 수 있으며, 유사 사건에 대한 비교 및 경향 분석에도 활용할 수 있습니다. 사건 목록은 행정적 정보와 법률적 판단 내용을 함께 반영하여 인권 관련 정책 검토에 필요한 기초자료로 제공됩니다.
