description_portal: '[SGIS 오픈 플랫폼] "인구피라미드" 서비스의 인구피라미드연령별카테고리 정보를 담고 있습니다.데이터 항목에는 인구피라미드연령, 인구피라미드성별, 인구성장유형을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 인구피라미드움직이는 인구피라미드는 과거 인구에 대한 확정인구와 향후 인구변동(출생, 사망, 국제이동)을 고려하여 작성된 장래추계 변화를 그래프로 보실 수 있습니다.'
