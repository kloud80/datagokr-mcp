summary_user: 지방자치단체(광역·기초)별·회계연도별 세출예산을 분야(기능)별로 나누고, 국고보조금·지역특별회계보조금·기금보조금·특별교부세·소방안전교부세·시도비 등 재원별 금액으로 쪼갠 전국 집계 자료다. 지역 주민이나 분석가가 "우리 시·군·구의 복지·교통 같은 분야 예산 가운데 국비와 자체 재원이 각각 얼마인가"를 따질 때 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 자료와는 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm), 분야 코드(fld_cd)를 같은 기관 코드 체계 안에서 맞춰 잇는다.
description_portal: '지방자치단체(광역자치단체, 기초자치단체)별 회계연도 내의 수행할 기능과 사업에 필요한 모든 지출 항목을 반영한 계획서입니다. 지방자치단체의 세출예산을 기능별 및 재원별로 나누어 분석한 자료입니다. 기능별 및 재원별 예산의 배분을 효율적으로 파악할 수 있습니다.(기능별 분류 : 정책사업, 행정운영경비, 재무활동예산)(재원별 분류 : 국고보조금, 지특보조금, 기금보조금, 특별교부세, 소방안전교부세, 시도비등)기능별재원별세출예산 정보는 2008 회계연도부터 정보가 제공되고 있습니다. 제공되는 세부항목으로는 자치단체 분야별 국고보조금, 지특보조금, 기금보조금, 특별교부세 등 항목이 제공됩니다.'
