summary_user: 경기도 내 허가를 받은 합법 노점상을 한 곳씩 담은 건별 현황으로, 시군명·점포명·허가번호·업종·폐업 여부·허가일자·점용면적과 도로명·지번 주소, WGS84 위도·경도를 담는다. 도시계획 담당자나 상권 분석가가 '우리 시군 어느 거리에 허가 노점이 몰려 있고 얼마나 넓은 도로를 점용하는가'를 지도로 확인하는 데 쓴다. 전역 조인 키는 없어 시군명이나 주소로 다른 데이터와 맞추고, 좌표(refine_wgs84_lat·logt)로 상권·도로 공간 데이터와 겹쳐 본다.
description_portal: 이 데이터는 경기도 내에서 허가를 받은 노점상의 현황을 정리한 자료입니다. 이 자료는 노점 운영의 합법성 여부, 거리 점유 실태, 소규모 자영업 지원 정책의 기초자료로 활용할 수 있으며, 도시 공간 활용, 도로 안전성 확보, 생활상권 분석 등의 정책 수립 및 연구에 유용합니다. 특히 좌표 데이터 기반으로 가시적인 분포 분석이 가능해, 노점 밀집 지역, 허가 현황, 상권별 노점 분포 등을 시각적으로 파악하는 데 효과적입니다.*단, 허가를 받은 합법 노점상들만 포함하며, 푸드트럭은 제외(별도의 데이터셋 존재), 또한 점포명이 없는 노점상이 존재할 수 있음.*노점상허가제 미시행등으로 제공불가능한 시군은 제공하지 않습니다.
