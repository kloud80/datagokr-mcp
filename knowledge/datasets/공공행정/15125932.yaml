summary_user: 국회사무처가 맺은 2천만원 이상 수의계약을 계약 건별로 담으며, 필드명으로 보아 계약일·계약명·계약금액·계약 상대·계약 방법·수의계약 사유·공개 파일명이 들어 있는 것으로 보인다(명세상 의미는 비어 있음). 시민단체나 분석가가 국회사무처가 어떤 사유로 어느 업체와 얼마짜리 수의계약을 했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 계약 상대 이름 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
