summary_user: 경기도 시군별로 종량제봉투의 구분(가정용·사업장용 등)마다 용량별 판매 단가를 담은 현황 자료로, 2ℓ~125ℓ 일반 봉투와 5ℓ~60ℓ 마대형 봉투 가격이 한 행에 정리돼 있다. 주민이나 분석가가 "우리 시의 20ℓ 가정용 봉투가 인근 시군보다 비싼가"처럼 지역 간 배출 비용을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(SIGUN_NM)을 이름으로 맞춰 다른 시군 단위 자료와 이어 써야 한다.
description_portal: 이 데이터는 경기도 각 시군에서 판매되는 종량제봉투의 가격 현황을 정리한 자료로, 가정용, 사업장용, 음식물 전용 봉투, 특수 규격 봉투(PP마대 등) 등 다양한 구분별 단가 정보를 포함하고 있습니다. 용량별(1ℓ~100ℓ, kg 단위 등) 가격이 기록되어 있어 지역 간 가격 차이를 비교하거나 폐기물 배출 비용의 합리성을 평가하는 데 활용할 수 있습니다. 종량제봉투는 폐기물 발생 억제와 자원 재활용 촉진을 위한 제도로 운영되고 있으며, 본 자료는 환경정책 수립, 폐기물 관리 효율성 검토, 자원순환 체계 개선 등과 같은 정책적 의사결정에 기초자료로 사용될 수 있습니다.
