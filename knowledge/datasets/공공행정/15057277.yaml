status: active
summary_user: 지방공기업별·연도별로 사장/이사장·이사·감사의 인원수와 기본급, 급여성복리후생비, 수당, 시간외수당, 인센티브, 예산성과급, 합계, 임원 1인당 평균임금을 담은 경영공시 집계 자료이며, 범위는 전국이다. 분석가나 국민이 '특정 지방공기업 사장의 연봉은 얼마이고 다른 지방공기업과 비교하면 어떤가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 지방공기업 경영공시 자료와는 연도(AC_YEAR)와 기관명(ENT_NAME)을 이름으로 맞춰 이어 쓴다.
limits: 기관 코드 같은 공통 조인 키가 없어 다른 데이터와 연결하려면 기관명 매핑에 의존해야 한다. 지역 좌표가 없는 비공간 자료라 지도 분석에는 바로 쓸 수 없고, 개발계정은 하루 10,000회로 호출이 제한된다.
