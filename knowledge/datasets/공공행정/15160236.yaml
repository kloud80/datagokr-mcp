description_portal: 강원특별자치도 내 시군별 불법광고물 정비 및 단속 실태에 대한 종합 통계 정보를 제공합니다. 쾌적하고 안전한 도시 경관 조성 및 보행 환경 개선을 위한 시군별 행정 조치 성과를 정량적으로 파악할 수 있도록 구성되어 있습니다. 주요 제공 항목으로는 불법광고물 정비 형태에 따른 고정형 광고물의 '철거' 실적과 유동형 광고물의 '제거' 실적 통계가 모두 수록되어 있습니다. 세부적으로는 벽면이용간판, 돌출간판, 지주이용간판 등 간판류 철거 현황을 비롯하여 입간판, 에어라이트, 현수막(공공·민간), 벽보, 전단지 등 다각적인 불법 홍보 매체별 정비 대수 현황을 포함합니다.
