description_portal: 한국동서발전의 장애인 고용률 정보 데이터는 연도별로 장애인 근로자의 고용 현황을 제공하는 자료입니다. 데이터 항목은 연도, 상시근로자 수, 장애인 근로자 수(경증), 장애인 근로자 수(중증), 장애인 고용률(퍼센트)로 구성되어 있으며, 기업의 사회적 책임 이행 수준과 법정 고용률 준수 여부 등을 판단하는 데 기초자료로 활용됩니다.이 데이터는 노동시장 내 장애인 고용 실태를 분석하거나 기업의 다양성과 포용성 정책의 효과를 검토하는 연구에 유용하며, 사회복지학, 산업노동정책, 공공경영 분야에서 통계 기반 분석 자료로 활용될 수 있습니다. 특히 중증 장애인과 경증 장애인의 고용 비율을 구분하여 제공함으로써 세분화된 정책 제언과 고용환경 개선 연구에 실증자료로 기여할 수 있습니다.
