summary_user: 지방자치단체별·회계연도별로 예산 중 업무추진비(회의·출장·행사 등 업무 경비)가 차지하는 비율을 담은 지방재정365 공시 지표 집계 데이터로, 범위는 전국 자치단체입니다. 주민·언론·분석가가 "우리 시·군·구의 업무추진비 비율이 다른 지자체보다 높은가"를 비교하거나 연도별 추이를 확인하는 데 쓴다. 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm), 광역 자치단체 코드·이름으로 같은 지방재정365의 다른 지표와 이어 쓰며, 전역 조인 키는 없어 그 밖의 데이터와는 이름·코드 매핑으로 연결한다.
description_portal: 업무추진비 비율은 해당 지방자치단체 조직의 예산 중 업무 추진을 위한 경비가 차지하는 비율을 나타내는 지표입니다.업무추진비는 주로 회의, 출장, 업무, 관련 행사 등 업무로 인하여 지출되는 경비로 사용되며, 조직의 운영 효율성이나 경비 낭비를 파악하는 데 중요한 역할을 합니다.이 비율이 지나치게 높으면 불필요한 경비 지출이 많을 수 있고, 반대로 너무 낮으면 조직 운영에 필요한 적정한 경비가 부족할 수 있습니다.따라서 업무추진비 비율은 예산의 적정성과 투명성을 평가하는 데 중요한 지표로 활용됩니다.
