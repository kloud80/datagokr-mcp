summary_user: 누리장터에 아파트관리사무소·영리법인 등 나라장터 수요기관이 아닌 민간이 올린 입찰공고를 공고번호·차수 단위 건별로 담으며, 용역·물품·공사·기타로 나눠 공고명, 입찰방식·낙찰방법, 입찰·개찰 일시, 기준금액·배정예산, 지역제한, 역경매 조건, 규격서 링크를 제공한다(검증 시 API 전체 25건, 전국, 2026-09-28~2026-10-23 범위). 사업자가 '이번 주 마감되는 아파트 관리용역 민간입찰 중 우리 지역에서 참가 가능한 공고는 무엇인가'를 찾거나, 분석가가 민간 발주의 입찰방식·기준금액 분포를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 입찰공고번호(bidNtceNo)·공고기관명 같은 이름·번호 매칭으로만 잇는다. 나라장터 공공조달 원장(발주계획→입찰→낙찰→계약)과는 별도 경로의 공고이다.
description_portal: "민간입찰공고정보를 제공하는 서비스로 용역, 물품, 공사, 기타 업무로 구분하여 입찰공고목록, 면허제한정보, 참가가능지역정보를 제공하며 다양한 옵션 조건으로 조회할 수 있는 나라장터 검색조건에 민간입찰목록조회로 구성되어 정보를 제공※ 나라장터에 수요기관으로 등록할 수 없는 '수요기관 외의 자'가 전자조달시스템을 이용하여 전자입찰을 실시하고자 하는 경우 '누리장터'를 이용할 수 있습니다. 민간입찰공고정보는 '수요기관 외의 자'(예 : 아파트관리사무소, 영리법인 등) 누리장터에 등록된 민간입찰공고 관련 정보를 제공합니다."
