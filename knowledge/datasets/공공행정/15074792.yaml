summary_user: 과학기술정보통신부가 게시한 주요정책을 건별로 담으며, 정책 제목·상세페이지 주소·담당부서·담당자·연락처·게시일과 계획서·로드맵 같은 첨부파일 정보를 제공한다. 정책 연구자나 언론사 정책팀이 '최근 과기정통부가 연구개발·네트워크·전파 등 분야별로 어떤 정책 계획을 발표했고 담당 부서는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 정책 제목·담당부서명 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
limits: 전역 조인 키가 없어 예산·과제 데이터와 코드로 바로 붙일 수 없고 이름 매핑에 의존해야 한다. 범위는 전국·비공간이라 지역별 정책 분석에는 쓰지 못하며, 개발계정은 하루 10,000회로 호출이 제한된다.
