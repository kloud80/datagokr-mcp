description_portal: 2026년도 지방대회의 원서접수 현황에 대한 자료입니다. 2026년도 1월 진행된 지방기능경기대회 원서접수 기간 중 17개 시.도 지방기능경기대회의 51개 직종에 대해 직종별로 접수한 인원에 대한 자료입니다. 접수 인원이 0인 직종은 해당 지방에서 개최되지 않으며, 접수 인원이 4명 이하인 직종의 경우 기능경기대회 관리규칙 제34조에 의거하여 해당 지방의 사정에 따라 개최되지 않을 수 있습니다. 이 자료는 접수 종료일 기준 접수인원에 대한 자료이므로, 해당 대회 불참자 등의 사유로 인해 실제 경기 참가 인원과 상이할 수 있습니다.
