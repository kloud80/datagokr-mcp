description_portal: 대국민 홈페이지(대표홈페이지)를 통해 중·고등학생 및 일반인을 대상으로 한국한의약진흥원을 방문 또는 견학을 희망하는 분들이 홈페이지의 견학신청 메뉴를 이용하여 신청한 현황 데이터입니다.한국한의약진흥원을 방문을 위해 방문희망일과 신청자명, 신정차소속 등을 작성하여 신청하면 담당부서에서 이를 접수하고 방문스케줄을 수립하여 방문 및 견학에 대응한 현황 데이터입니다.기본정보로는 견학번호, 신청자, 신청자소속, 견학희망일자, 신청일자 로 구성된 데이터이며,개인정보보호법에 의거하여 신청자 이름의 중간 이름은 아스타(*)로 처리하여 비공개로 처리함아래 한국한의약진원 대표홈페이지 링크를 통해 신청된 데이터 현황입니다.https://nikom.or.kr/nikom/module/visit/index.do?menu_idx=54CSV파일 형태로 제공되며 갱신주기는 연간으로 최초등록일 기준 1년 이내이며 다음 갱신년은 2026년 입니다.
