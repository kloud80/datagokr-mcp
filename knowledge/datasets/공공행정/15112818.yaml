summary_user: 인천 부평구가 보유한 공공건축물을 건물 한 건씩 재산명, 소재 주소, 연면적(㎡), 취득일자, 건물용도와 함께 담은 시군구 단위 파일 목록이다. 부평구 내 공공건축물이 어떤 용도로 어디에 얼마나 있는지, 오래전에 취득한 큰 건물이 어느 것인지 파악하려는 구 자산 담당자나 도시계획 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 재산명을 매핑해 붙이거나 같은 기관 자료끼리 이어 써야 한다.
limits: 필지고유번호(PNU)나 건축물대장 번호 같은 공통 키가 없어 국유재산·건축물 데이터와 자동으로 결합되지 않고, 주소 문자열 매칭에 의존해야 한다. 범위는 부평구 한 곳뿐이어서 다른 시군구와 비교하려면 별도 자료가 필요하다.
