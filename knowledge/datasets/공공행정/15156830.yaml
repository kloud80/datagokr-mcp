description_portal: 본 데이터는 고리본부 지역업체의 계약 현황을 정리한 자료로, 지역 산업계 참여 현황과 협력 구조를 파악하기 위해 구축된 공공데이터입니다. 제공항목은 계약번호,계약명,계약상대자명,최종계약일자,계약자주소,계약사업소,계약금액 등으로 구성되어 있으며, 지역경제 기여도 분석과 협력기업 관리, 계약 투명성 제고에 활용할 수 있습니다. 또한 연도별·업종별 계약추이를 비교함으로써 지역산업 활성화 정책 수립과 공공조달 효율화에 기초자료로 활용 가능합니다. 본 데이터는 통계분석, 시각화, AI 기반 분류 및 지역별 참여도 예측 모델링 등에도 활용할 수 있습니다.※ 제공항목 중 계약금액의 단위는 VAT가 포함된 "원"입니다.
