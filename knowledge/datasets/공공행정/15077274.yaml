summary_user: 광주환경공단이 영산강 주변 공중화장실 16곳을 한 곳당 한 행으로 담은 건별 현황 파일이다. 방문객이나 담당자가 영산강변 화장실의 위치, 남녀·장애인·어린이용 변기 수, 개방시간을 확인하는 데 쓴다. 소재지지번주소(address)와 위도·경도(coord)를 키로 지도나 주소 기반의 다른 시설 데이터와 이어 쓴다.
description_portal: 영산강 공중화장실 운영현황에 대한 데이터로, 영산강 주변에 설치된 공중화장실의 위치 및 시설 현황을 종합적으로 제공합니다. 해당 데이터에는 각 화장실의 명칭(화장실명), 소재지, 공용화장실 여부를 비롯해 여성용 및 남성용 변기의 개수, 개방시간, 설치년도 등의 항목이 포함되어 있습니다. 이 데이터를 통해 시민과 방문객은 공중화장실 이용 가능 여부를 쉽게 확인할 수 있으며, 공공시설의 위생관리, 접근성 개선, 시설 확충 계획 수립 등에도 활용될 수 있습니다. 특히 성별 구분된 시설 수와 개방시간 정보는 이용자 편의성 증진 및 관련 민원 대응의 기초자료로 활용됩니다.
