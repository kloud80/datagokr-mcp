description_portal: '○ 통계개요* 통계명 : 지방세 비과세 감면* 통계종류 : 일반통계, 보고통계* 작성목적 : 우리나라 지방세 규모의 성장과정 이해 및 향후 변화 예측 등 지방세 정책결정과 연구 등에 활용하기 위함* 조사체계 : 구·시·군→시·도→행정안전부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 지방세 세목별 감면건수 및 세액○ 용어설명* 지방세 비과세 감면: 세법에서 과세대상으로 규정한 것을 국가정책 또는 납세의무자의 개별적 사정을 고려하여일정기간 세액의 일부를 경감하거나 전부를 면제하게 하는 것으로 주민세, 취득세, 자동차세,재산세, 지역자원시설세 등 생계·의료·주거·교육급여 수급자, 국가유공자, 고엽제후유증 환자,장애인 등이 부담하는 지방세를 감면·면제하여 생활 안정과 시설 운영을 돕는 제도* 지방세 : 지방자치단체가 지방재정수요에 충당하기 위하여 관할구역내의 주민?재산또는 수익 등에 대하여 부과?징수하는 조세로 지방자치단체의 자주재원의 근간임○ 기 타* 기준시점은 당해년 12월말 결산액○ 자 료: 행정안전부「지방세통계연감」○ 담 당 : 서울특별시 디지털도시국 데이터전략과'
