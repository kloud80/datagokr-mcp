summary_user: 지방자치단체별로 법정 재난관리기금 전출금을 확보했는지를, 과거 3개 연도 보통세 수입결산액 평균과 해당 회계연도 재난관리기금 적립·전출액, 그 비율(rate)로 담은 연도별 자치단체 단위 공시 데이터이며 범위는 전국이다. 지역 주민이나 지방재정 분석가가 "우리 시·군·구는 올해 법정 재난관리기금 전출금을 기준만큼 적립했나"를 확인하거나 자치단체끼리 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 지방재정365 공시 데이터와는 회계연도와 자치단체 코드·이름(laf_cd·laf_hg_nm, 광역 단위는 wa_laf_cd)을 맞춰 이어 쓴다.
description_portal: 지방자치단체가 자연재해, 사회재난, 감염병 등 각종 재난으로부터 주민의 생명과 재산을 보호하고, 재난의 예방·대비·대응·복구 활동을 원활히 수행하기 위해 설치하는 기금입니다. 즉, 재난에 신속하고 효과적으로 대응하기 위한 상시적인 재정기반을 마련하는 것이 주된 목적으로 운영됩니다.재난관리기금전출금확보 정보는 법정재난관리기금 전출금의 확보여부를 확인할 수 있는 정보입니다. 과거3개연도의 보통세 수입결산액의 평균금액과 회계연도 적립 재난관리기금전출액의 비율 항목으로 정보가 제공됩니다.
