description_portal: 본 데이터는 전북특별자치도 부안군의 세정업무 투명성 제고 및 세입 분석 강화를 목적으로 매년 작성되는 지방세 비과세 및 감면율 현황 자료이다. 표준지방세정보시스템을 통해 수집된 세목별 비과세 및 감면 관련 통계를 기반으로 하며, 매년 12월 31일 기준으로 자료가 정리된다. 데이터는 부과된 지방세 중 비과세 또는 감면된 금액의 비율을 파악할 수 있도록 구성되어 있으며, 자치단체의 세입구조 개선, 지방세제 운용 효율화 및 정책 수립에 활용된다.수집 과정은 지방세법 등 관련 법령에 따라 운영되는 세정시스템에서 과세정보를 집계하고, 세목별로 비과세 및 감면내역을 구분하여 기록하는 절차로 이루어진다. 주요 항목은 세목명, 과세년도, 부과금액, 비과세금액, 감면금액, 비과세감면율 등으로 구성되어 있으며, 세금 항목별 세수 감소 요인을 정량적으로 분석할 수 있다.이 데이터는 부안군이 적용한 비과세 및 감면 제도의 세수 영향력을 평가하고, 재정정책 수립에 필요한 기초자료로서 기능한다. 또한 과거 대비 비과세 및 감면 추이 분석, 세목별 감면 편중 여부 확인 등 다양한 세정지표로 활용 가능하다. 민간기관, 연구자, 공공기관 등에서도 데이터 기반 분석을 통해 재정운용 계획 수립, 조세 형평성 분석, 세입예측 모델 개발 등에 유용하게 활용될 수 있다.
