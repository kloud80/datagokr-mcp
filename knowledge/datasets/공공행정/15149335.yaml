summary_user: 경기도 국민안전체험관이 이용자에게 보내는 알림 문자의 표준 템플릿 정의를 템플릿 한 건 단위(고유 번호·제목·본문)로 담는다. 체험관 운영자나 유사 시설 담당자가 교육 예약 완료·일정 알림·참여 안내 문구를 어떤 형식으로 쓰는지 참고할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 같은 기관(경기도 국민안전체험관) 기준이나 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도국민안전체험관에서 주기적으로 발송되는 알림메세지 템플릿 정의를 수록한 자료로, 교육 예약 완료, 일정 알림, 참여 안내 등 이용자에게 발송되는 표준 메시지 유형을 포함하고 있습니다. 각 템플릿은 고유 번호, 제목, 본문으로 구성되어 있으며, 어린이 안전관리, 산업안전, 심폐소생술(CPR) 등 다양한 안전교육 과정별 맞춤 안내에 활용됩니다. 이 데이터는 체험관 운영자가 효율적으로 메시지를 관리하고 이용자에게 일관된 안내를 제공할 수 있도록 지원하며, 공공서비스 전달 체계의 신뢰성을 높이는 데 기여합니다.
