description_portal: '○ 통계개요* 통계명 : 시본청 공무원(정원)* 통계종류 : 서울시 시본청 공무원 정원을 제공하는 지정ㆍ조사통계* 근거법령 :「서울특별시 지방공무원 정원조례 및 규칙」에 의한 공무원 정원* 작성목적 : 서울시 공무원의 전반적인 현황을 파악하여 인사정책의 운영 및 제도개선을위한 기초자료를 수집하고 공직내 인적자원의 주기별 변동사항 기록유지등에 활용하는 것을 목적으로 함* 조사체계 : 해당부서 → 서울특별시 조직담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 서울시 본청 공무원의 부서별ㆍ직류별ㆍ직급별 정원○ 용어설명* 정무직 : 선출직 공무원과 같이 담당 업무의 성격이 정치적 판단이나 정책결정을필요로하는, 중앙정부의 차관급 이상 공무원과 특별시의 행정부시장, 정무부시장 등특수경력직 공무원* 별정직 : 전문위원ㆍ상임위원ㆍ비서 등 공무원법상 특수경력직의 별정직으로규정되어 있거나 다른 법령ㆍ조례에서 별정직으로 지정하는 공무원* 일반직 : 행정일반 또는 기술 연구에 대한 업무를 담당하며, 실적과 자격에 의해임용되고 신분이 보장되는 경력직 공무원○ 기 타* ( )내는 국가공무원임, 합계에는 미포함○ 출 처 : 서울특별시 조직담당관'
