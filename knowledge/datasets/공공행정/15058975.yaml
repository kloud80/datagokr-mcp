summary_user: 전국 지방자치단체의 재정상태표를 회계연도·자치단체·계정과목별로 담은 집계 데이터로, 자산·부채·순자산 항목의 당기·전기 금액(필드명으로 추정)을 제공한다. 분석가나 주민이 '우리 시의 부채가 자산 대비 얼마나 되고 지난해보다 순자산이 늘었나' 같은 재정 건전성 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 지방재정365의 다른 공시 데이터와는 자치단체 코드(laf_cd)나 자치단체명·회계연도를 맞춰 연결한다.
description_portal: 재정상태표는 지방자치단체의 재정 상태를 특정 시점에서 종합적으로 나타내는 회계 보고서로, 자산, 부채, 순자산의 세 가지 요소를 기준으로 작성됩니다. 이는 지방자치단체의 재정 건전성을 평가할 수 있는 중요한 자료로 활용되며, 자산과 부채 간의 관계를 분석함으로써 재정의 안정성과 지속 가능성을 판단할 수 있습니다.자산 항목에는 현금, 예산 집행 잔액, 투자자산, 채권 등 다양한 자원이 포함되며, 이는 지방자치단체가 보유하거나 향후 활용 가능한 경제적 자원을 의미합니다. 반면, 부채 항목은 채무, 미지급금, 장기 차입금 등 미래에 지출이 예상되는 재정적 의무를 포함합니다.순자산은 자산 총액에서 부채 총액을 차감한 금액으로, 순자산이 크다는 것은 해당 지자체의 재정 여건이 상대적으로 양호함을 의미하며, 반대로 순자산이 적거나 음수일 경우 재정운영의 어려움을 나타냅니다. 따라서 재정상태표는 지방자치단체의 재정 운영 결과를 객관적으로 진단하고, 향후 재정 계획 수립과 정책 결정에 중요한 기초자료로 활용됩니다.
