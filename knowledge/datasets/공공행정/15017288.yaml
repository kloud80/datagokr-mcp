description_portal: '국토안전관리원에서 FMS와 건축물 생애이력관리시스템에서 추출하여 제공하는 건축물현황 중 층수별용도별 데이터 입니다.건축물은 공동주택부터 공공업무시설, 관광휴게시설, 교육연구시설 등 용도별로 다양한 형태를 보여주고 있으며 특히 공동 주택같은경우는 높은 층(16~30)수일수록 분포가 많이 되어있습니다.주거용: 단독주택, 공동주택(아파트 등)상업용: 제1·2종 근린생활시설(슈퍼마켓, 음식점, 미용실, 의원 등), 판매시설 등기타 용도: 문화 및 집회시설, 종교시설, 운수시설, 공장, 숙박시설, 의료시설 등 용도별 마다 건축물의 층수 정보는 상이하므로 위 설명을 참고 바람'
