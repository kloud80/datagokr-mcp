description_portal: 공무원연금공단의 연도별 연금개시연령 미도래자 추이에 대한 데이터입니다. 2003년부터 2022년까지의 데이터를 1회성으로 제공하고 있습니다.각 연도별로 전년도 말 기준 잔여 인원, 신규 발생 인원, 연금 개시 도래자, 종결처리 인원, 해당년도 말 기준 미도래자 수로 구분하고 있습니다.공무원연금 수급 예정자 규모 변화와 연금재정 소요 추계 등에 활용할 수 있습니다.  (참고) 공무원연금법 개정으로 인해 지급 개시 연령이 60세에서 65세로 연장되었습니다.2001년 1월 1일 이후 임용된 공무원은 재직 기간에 따라 연금 지급 개시 연령이 다르게 적용됩니다.1996년 1월 1일 이후 임용자부터는 65세로 단계적 연장을 하고 있습니다
