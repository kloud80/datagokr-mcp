summary_user: 전국 지방자치단체의 세출을 회계연도·자치단체·회계·세부사업 단위로 나눠 국비·시도비·시군구비 예산현액, 지출액, 집행잔액과 세출 분야·부문을 담은 연도별 세부사업 원장입니다. 주민이나 지방재정 분석가가 "우리 구가 올해 어떤 세부사업에 얼마를 편성하고 실제로 얼마를 썼나"를 확인하는 데 쓴다. 전역 조인 키는 없고, 자치단체 코드·이름(laf_cd 등)이나 분야·부문 코드를 같은 지방재정365 공시 데이터와 매핑해 잇는다.
description_portal: 세출이란 지방자치단체가 한 회계연도의 모든 지출을 말합니다.세출예산의 과목은 그 기능을 고려하여 일반공공행정, 공공질서 및 안전, 교육, 문화 및 관광, 환경보호, 사회복지, 보건, 농림해양수산 등으로 구분 중에 있습니다..연도별 세부사업세출현황은 지역별, 자치단체별, 회계별, 세부사업에 대해 국비, 시도비, 시군구비 예산현액 대비 지출액과 집행잔액 및 세울예산과목의 분야와 부문으로 구생되어있고, 매 회계년도 말일을 기준으로 작성되었습니다. 또한, 연도별 파일을 개별로 게시하고 있습니다.
