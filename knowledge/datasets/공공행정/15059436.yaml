summary_user: 전국 지방자치단체별로 지방의회 관련 경비(의정운영공통경비, 의회운영업무추진비, 의원국외여비, 의원역량개발비 등)의 일반회계 당초예산 편성액을 회계연도·항목 단위로 담은 집계 데이터이며, 포털 설명상 2016~2019 회계연도가 대상이다. 주민이나 분석가가 "우리 시·군·구 의회는 의원 국외여비와 업무추진비에 예산을 얼마나 잡았나"를 확인하거나 자치단체 간 의회경비를 비교하는 데 쓴다. 전역 조인 키는 없으며, 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 기준으로 같은 지방재정365의 다른 공시 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 지방자치단체의 지방의회 관련 경비는 지방재정법 제60조 및 같은법 시행령 제68조에 따라 주민의 알권리 보장과 재정운영의 투명성 확보를 위해 공개됩니다. 공개 대상에는 지방의회 의원의 인건비, 의정활동비, 여비, 업무추진비 등 의회운영에 소요되는 모든 경비가 포함됩니다.지방의회 관련경비 정보는 2016~2019 회계연도의 정보가 제공되며 대상회계는 일반회계를 대상으로 당초예산 편성액 정보로 취합됩니다. 세부 제공항목으로는 의정운영공통경비, 의회운영업무추진비, 의원국외여비, 의원역량개발비(민간위탁) 각 항목별 예산액 정보가 제공됩니다.
