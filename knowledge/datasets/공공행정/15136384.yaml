description_portal: 통계청_KOSIS 복합통계표 분류코드는 통계청의 국가통계포털(KOSIS)에서 제공하는 복합통계표 구성에 사용되는 분류항목의 코드 정보를 담고 있는 데이터이다.복합통계표란 둘 이상의 분류 항목을 조합하여 통계값을 다차원적으로 분석할 수 있도록 설계된 통계표를 말하며, 이 데이터는 각 항목별로 사용되는 분류의 코드값, 명칭, 순서 등을 포함하고 있다.예를 들어 인구통계에서는 성별, 연령대, 지역 등 여러 기준이 함께 사용되는데, 이때 각각의 분류항목이 어떤 코드로 표현되는지를 알려주는 것이 이 파일의 주요 목적이다.*통계표아이디는 파일데이터(통계청_통계표 정보), 기관코드는 파일데이터(통계청_KOSIS 기관정보) 참조
