description_portal: "우체국물류지원단은 기획재정부 주관 '공공기관 고객만족도 조사(PCSI)'의 일환으로, 저희 기관의 서비스를 이용하는 고객 여러분의 만족도를 면밀히 파악하고 서비스 품질 향상을 도모하고자 본 조사를 실시하였습니다. PCSI는 공공기관의 특성을 반영하여 개발된 고객만족도 모델로, 고객 만족을 통해 궁극적으로 국민 삶의 질 향상에 기여하는 것을 목표로 합니다.- 조사 대상: 우체국물류지원단의 1년 이내 서비스 이용 성인 남녀 전국 370명 표본- 조사기간: 2021년 11월  ~ 22년 2월 - 조사방법: 전화조사- 조사 모델: 기획재정부가 개발한 '공공서비스 고객만족도지수 모델(PCSI)' 활용 - 평가등급: B등급우체국물류지원단은 고객만족도 내 NPS 결과를 바탕으로 서비스 개선과 데이터분석을 통해 목표 달성도를 지속적으로 관리하고 있습니다."
