summary_user: 규제자유특구에 참여한 기업을 기업 한 곳당 한 행으로 담은 명단으로, 특구명·지정 차수·지역·기업명·기업규모·특구사업자 등록형태와 등록일자, 역외기업 이전형태를 담는다(csv 약 34KB, 전국 범위). 지역 정책 분석가나 사업자가 '어느 특구에 어떤 규모의 기업이 몇 곳 참여하고, 그중 다른 지역에서 옮겨 온 기업은 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 데이터와는 기업명이나 특구명·지역명을 이름으로 맞춰 이어 써야 한다.
description_portal: '중소기업의 규제를 개선하기 위한 사업으로 규제특례 부여를 통해 신사업, 신기술의 안정성을 검증하기 위한 실증을 진행하고 안정성 입증시 법령개정, 임시허가 등을 지원- 지역의 혁신성장 및 균형발전 촉진을 위해 비수도권으로 한정- 8개 분야 규제샌드박스 중 하나로서, 광역지자체가 신청하고   재정 지원 등이 가능한 지역단위(zone) 제도   * 타분야 규제샌드박스는 신청주체가 ‘개별 기업’으로 규제자유특구와 상이지정절차 : 시․도지사가 신청한 규제자유특구계획에 대해 심의위원회(위원장 : 중기부장관), 특구위원회(위원장 : 총리)의 심의․의결로 지정'
