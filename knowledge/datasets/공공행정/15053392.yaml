description_portal: 본 데이터는 2013년 기준 경기도 용인시 내 사업체를 산업 세세분류 기준으로 집계한 총괄 통계 자료를 제공한다. 주요 항목은 사업체 수, 종사자 수, 조직형태별 사업체 수, 법인 유형별 수, 사업체 구분별 수, 종사자 규모별 수 등으로 구성되어 있으며, 산업별 세부 현황을 종합적으로 파악할 수 있다. 이를 통해 지역 내 산업 구조와 고용 현황을 세밀하게 분석할 수 있으며, 산업별 세분화된 특성과 조직형태, 사업체 규모별 분포를 확인할 수 있다. 자료는 창업 및 투자 전략 수립, 지역 경제 활성화 방안 마련, 산업 정책 연구, 기업 지원 계획 등 다양한 목적으로 활용될 수 있다. 또한, 단일 연도 기준이지만 다른 연도 자료와 비교하여 산업 구조 변화 추이를 분석하거나 타 지역과의 현황을 대조하는 기초 자료로도 활용 가치가 높다. 공공데이터 개방을 통해 정보의 신뢰성과 투명성을 제고하고, 용인시 산업 생태계 전반에 대한 이해와 정책 수립 지원에 기여하는 것을 목표로 한다.
