description_portal: 서울시 음반, 음악영상물제작업 인허가 정보는 음반 및 음악영상물 제작 사업장의 행정 이력과 기본 특성을 파악하는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태코드와 영업상태명, 상세영업상태명은 각 사업장의 인허가 이력과 현재 영업 여부를 확인하는 핵심 정보입니다. 지번주소, 도로명주소, 우편번호, 좌표정보(X, Y), 사업장명, 전화번호, 업태구분명, 문화체육업종명, 문화사업자구분명은 사업장의 위치와 업종 특성을 나타냅니다. 소재지면적, 시설면적, 총층수, 지상층수, 지하층수, 건물용도명은 사업장 규모와 건물 특성을 보여 줍니다. 노래방실수, 청소년실수, 청소년실여부, 방음시설여부, 조명시설유무, 음향시설여부, 소방시설여부 등은 이용 환경과 안전 관련 주요 시설 수준을 나타내는 정보입니다. 이 데이터는 음반·영상 제작업체의 분포와 규모 파악, 청소년 이용 가능 시설 여부 및 안전시설 점검, 지역별 문화산업 인프라 분석과 정책 수립에 활용할 수 있습니다.
