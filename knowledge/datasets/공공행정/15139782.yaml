description_portal: 본 사옥 및 시설 보유 현황은 한국중부발전이 소유한 본사사옥 및 부대시설의 공간 정보와 용도별 현황을 정리한 자료입니다. 항목은 구분, 층수, 면적(㎡), 주용도로 구성되어 있으며, 각 층별 상세 규모와 사용 목적을 확인할 수 있습니다. 사옥 및 시설 보유 현황은 중부발전의 자산 관리 체계 수립, 공간 활용도 분석, 효율적인자산운영과, 시설 용도 및 규모 적정성 평가 등에 활용 가능합니다. 또한 본사사옥 내 사무용 공간과 편의 지원시설의 분포, 자산 배치 현황, 자산가치 분석의 기초 자료로도 다양하게 활용 가능합니다.
