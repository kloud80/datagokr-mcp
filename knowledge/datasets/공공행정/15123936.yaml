summary_user: 대전역 앞 역전지하도상가(대전 동구 중앙로 지하 200)에 입점한 점포를 한 행에 하나씩 담은 상가현황 파일로, 일련번호·상가이름·상가유형과 상세유형·전화번호를 담는다(포털 기준일 2025년 7월 1일, CSV 약 6.5KB). 시민이나 방문객이 '역전지하도상가에 어떤 업종의 가게가 있고 연락처는 무엇인가'를 확인하거나, 분석가가 지하도상가의 업종 구성을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 상가이름 같은 이름 매칭이나 같은 기관(대전광역시시설관리공단)의 다른 지하도상가 자료와 나란히 놓는 식으로만 잇는다.
description_portal: 대전광역시시설관리공단에서 운영 중인 대전역 지하도상가의 상가현황에 대한 정보를 제공하고 있습니다. 공단은 체육, 환경, 복지, 기반 4개 분야의 시설을 관리하고 있으며 역전지하도상가는 기반시설에 해당됩니다. 데이터에 표시되는 상가의 수는 점포 계약 및 입찰 결과에 따라 변경될 수 있습니다. 역전지하도상가의 주소는 대전광역시 동구 중앙로 지하 200 이며, 해당 파일에서 제공하는 정보는 일렬번호, 상가이름, 상가유형, 상가유형_상세, 전화번호입니다. 데이터 기준일은 2025년 7월 1일 기준입니다.
