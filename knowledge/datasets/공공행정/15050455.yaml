description_portal: 강원특별자치도 홍천군의 2025년 02월 기준으로 작성된 인구 및 세대 현황 정보입니다. 총 4개의 엑셀 파일로 구성되어 있습니다. 파일명은 1세단위, 5세단위, 65세이상_5세단위, 인구 및 세대현황_2025년 2월말입니다. 인구 및 세대현황_2025년 2월말 파일은 표가 나타나 있는데 홍천군, 홍천읍, 화촌면, 두촌면 등 지역명이 나타나 있고 각 지역에 따른 인구수, 구성비, 성비, 세대수, 세대당 인구가 나타나 있습니다. 인구수와 구성비는 계, 남, 여 항목으로 나타나 있습니다. 숫자 형식으로 데이터가 나타나 있으며 단위는 명입니다. 1세단위 파일의 구성 항목은 연령이 합계와 0세부터 110세 이상까지로 구성되어 있습니다.
