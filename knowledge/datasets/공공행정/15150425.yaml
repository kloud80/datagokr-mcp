summary_user: 경기도 통합홈페이지의 메뉴 하나하나를 한 행으로 담은 네비게이션 원장으로, 메뉴 번호·메뉴명·계층형 경로 문자열·숫자 경로·사용 가능 여부·메뉴 레벨·사이트 번호를 담는다. 홈페이지 운영자나 분석가가 "경기도 홈페이지에서 어떤 정보가 어떤 메뉴 경로로 제공되는가"를 파악해 정보 구조를 분석하거나 접근 경로를 시각화할 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 메뉴명 같은 이름 매핑이나 같은 기관 자료 안에서만 연결한다.
description_portal: 이 데이터는 경기도 통합홈페이지 내 다양한 주제별 정보 콘텐츠의 메뉴 구조를 보여주는 네비게이션 정보입니다. 각 메뉴는 메뉴IDX를 통해 식별되며, 사용자가 접근하는 정보 경로는 ‘네비게이션’ 항목에 계층적 문자열 형태로 나타납니다. 가능여부, 메뉴레벨, 사이트IDX 등의 항목으로 세부 정보가 구분되어 있습니다. 이 데이터를 활용하면 경기도 통합홈페이지의 정보 구조 분석, 사용자 접근 경로 시각화, 사이트 콘텐츠 구조 최적화 등의 목적으로 활용할 수 있으며, 특히 공공정보의 분류 및 제공체계를 파악하는 데 유용합니다. 메뉴경로 항목은 해당 메뉴의 위치를 숫자 식별자 형태로 제공하여 시스템 내부의 콘텐츠 연결 구조를 파악할 수 있도록 지원합니다.
