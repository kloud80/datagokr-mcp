summary_user: 경기공유서비스(공유누리 계열)에 등록된 공공시설 대관 정보를 시설 한 건씩 담으며, 시설명·유형·주소와 위도·경도, 수용인원, 이용대상, 예약기간·마감조건, 신청서류 필요 여부, 개인·단체·기업 구분 등을 포함한다. 주민이나 단체가 "우리 동네에서 단체 행사로 빌릴 수 있는 회의실이나 강당은 어디이고, 언제까지 예약해야 하는가"를 확인하거나, 분석가가 지역별 공공공간 개방 현황을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시설명·주소 매핑이나 같은 기관 코드(inst_cd)로만 연결하고, 위경도로 공간 결합을 할 수 있다.
description_portal: "이 데이터는 공공기관에서 제공하는 시설의 대관 서비스를 위한 정보로, 각 시설의 고유 식별자, 위치정보(주소, 위도/경도), 시설명, 시설유형, 예약 가능 조건, 신청서류 필요 여부, 예약마감 조건, 예약 기간, 등록일 및 수정일 등의 항목으로 구성되어 있습니다. 데이터는 공공시설의 효율적인 활용을 위한 공유 서비스 목적으로 수집되었으며, 개인 또는 단체가 대관 가능한 조건을 확인하고 예약을 진행할 수 있도록 지원합니다. 이 데이터는 공공자원의 개방과 시민 편의 향상, 지역사회 공간 활용 증대를 위한 기반 자료로 활용될 수 있습니다.개인/단체 여부: 'P'는 개인, 'T'는 단체, 'B'는 기업"
accrual_periodicity: 수시
