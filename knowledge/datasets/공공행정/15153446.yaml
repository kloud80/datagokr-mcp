description_portal: 세종특별자치시시설관리공단은 시민이 화장 및 봉안시설 이용에 필요한 비용을 명확하게 확인할 수 있도록 화장 및 봉안요금 정보 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 관내·관외 구분에 따른 요금 체계와 적용 시점을 투명하게 공개하여, 시민의 정보 접근성과 행정 신뢰성을 높이기 위한 목적으로 구축되었습니다.■ 데이터 컬럼 구성순번 - 각 요금 항목을 구분하기 위한 고유 번호요금구분 - 화장요금, 봉안요금 등 요금의 종류를 나타내는 구분 항목관내외구분 - 고인의 주소지 또는 신청인의 기준에 따라  - 관내(세종시 거주)  - 관외(타지역 거주)로 구분되는 요금 차이요금적용일 - 해당 요금이 적용되기 시작한 날짜 - 요금 변경 이력 및 적용 시점 확인에 활용요금 - 실제 부과되는 금액화장·봉안 유형 및 관내외 구분에 따라 달라짐■ 데이터 제공 목적화장 및 봉안요금 정보 데이터는 다음과 같은 목적을 위해 제공됩니다. - 요금 체계의 투명한 공개를 통한 시민 신뢰성 강화 - 관내·관외 구분에 따른 요금 차이 명확화 - 요금 변경 이력 관리 및 정책 평가 자료 제공 - 장사서비스 이용 시 비용 예측 가능성 제고 - 요금 정보 기반의 민원 응대 효율성 및 공공성 강화세종특별자치시시설관리공단은 앞으로도 정확한 요금 정보를 지속적으로 갱신하여 시민 편의와 행정 투명성을 높여 나가겠습니다.
