description_portal: 해당 데이터는 해양수산연수원에서 실시한 선원 대상 자격취득 관련 교육과정의 연도별 수료 현황을 정리한 자료입니다. 데이터는 2021년부터 2024년까지의 면허 갱신 교육 이력이 포함되어 있으며, 모든 과정은 소형선박을 대상으로 합니다. 수료 인원은 명시되어 있지 않지만, 동일한 교육과정이 매년 반복되고 있어 교육 수요의 지속성과 정책 반영을 위한 참고 자료로 활용될 수 있습니다. 또한 자격 갱신 관련 교육 운영 실태, 선박 규모별 교육 수요 분석 및 예측에 활용성이 매우 높은 자료 입니다.
