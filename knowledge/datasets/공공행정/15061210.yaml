summary_user: 지방공기업 통합경영공시(클린아이)에 공시된 지방공기업의 주요 사건·사고 현황을 건별로 담으며, 연도·지자체명·기관명·제목·내용 등으로 구성되고 범위는 전국이다. 지방공기업을 감시하는 시민이나 분석가가 '특정 지자체 도시철도공사·개발공사에서 최근 어떤 인명사고·산업재해가 공시됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 경영공시 데이터와는 기관명·지자체명 이름 매핑으로만 연결한다.
description_portal: '해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이다. 주요 사건 사고 현황 자료에는 연도, 지자체명, 기관명, 작성자명, 제목, 내용 등 지표가 포함된다. 첨부파일(개요, 세부내용, 대책 등) 함께 게시된다. * 예시 : 지하철 사고(도시철도), 공사장 인명사고(개발공사, 공영개발), 산업재해(공단) 등 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.'
