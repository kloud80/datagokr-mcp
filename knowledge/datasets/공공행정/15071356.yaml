summary_user: 서울시 관할 게임물배급업 사업장의 인허가 정보를 사업장(관리번호) 단위로 담으며, 인허가·취소·폐업 일자, 영업상태와 상세상태, 사업장명, 지번·도로명 주소, 좌표, 건물 층수·주변환경 같은 입지 항목을 포함한다. 분석가나 구청 담당자가 '어느 자치구에 영업 중인 게임물배급업체가 몰려 있고 최근 폐업이 늘었는가' 같은 업종 분포·상태 변화 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 잇고, 같은 출처를 쓰는 LOCALDATA 인허가 자료와 함께 상권·점포 이력 분석 원료로 쓴다.
description_portal: 'ㅇ 데이터 개요: 「서울시 게임물배급업 인허가 정보」는 서울시 관할 사업장의 게임물배급업 인‧허가 현황을 표준 스키마로 정리한 자료입니다. 행정식별(관리번호), 인허가 이력, 영업상태 및 상세상태, 사업장명, 주소(지번‧도로명), 연락처, 좌표 등 기본 행정·공간 정보를 포함합니다.ㅇ 업종·분류 필드: 문화체육업종명(게임물배급업), 문화사업자구분명(유통 관련) 등 업종 분류가 제공되어 업권별 현황 파악과 정책 대상자 분류에 활용할 수 있습니다.ㅇ 시설·안전 필드: 비상계단·비상구·자동환기·소방시설·방음·조명 등 안전·편의 관련 여부가 구조화되어 있어 청소년 보호, 안전기준 준수 점검, 현장 점검 체크리스트 설계에 유용합니다.ㅇ 공간·입지 특성: 좌표(X/Y), 지역구분명(예: 주거·상업·공업), 주변환경명, 건물용도·층수, 통로너비, 조명조도 등 입지·환경 요소가 포함되어 지도 기반 분포 분석, 위험도 매핑, 권역별 관리전략 수립에 적합합니다.ㅇ 분석 활용: 인허가 상태 변화 모니터링, 점검·단속 대상 선별, 청소년 유해환경 관리, 민원·사고 데이터와의 교차분석, 상권·도시계획 지표와의 결합 분석 등 행정·현장 업무에 직접 적용 가능합니다.ㅇ 품질 유의: 공통 스키마 적용으로 업종 특성상 일부 항목(예: 제공게임물명, 총게임기수, 업태구분 등)이 공란이거나 의미가 약할 수 있습니다. 주소 표기 이중화(지번/도로명)와 좌표 누락·오류 가능성에 대비해 정규화, 좌표 검증, 코드 일치성 점검 등 전처리가 필요합니다.ㅇ 운영·거버넌스 권고: 자료는 지속 갱신되므로 분석 시점별 스냅샷 보관, 전처리 로그 관리, 데이터사전 정비, 동일 사업장 이력 병합 기준 수립 등 표준 운영 절차를 권장합니다. 또한 연락처 등 민감정보 취급 시 관련 법령을 준수해야 합니다.'
