summary_user: 지방재정365에서 제공하는 지역통합재정통계로, 지방자치단체 총예산 가운데 행정 관련 경비가 차지하는 비율 같은 재정지표를 회계연도(fyr)·자치단체별로 담은 전국 단위 집계 데이터다. 분석가나 주민이 "우리 지자체는 다른 지자체보다 예산 중 행정운영 경비 비중이 높은가"처럼 예산 배분의 효율성을 비교할 때 쓴다. 자치단체 코드(laf_cd)와 광역·기초 자치단체명이 있으나 실측상 전역 조인 키는 확인되지 않아, 다른 데이터와는 자치단체명·코드 매핑이나 같은 기관(지방재정365) 데이터끼리만 이어 쓴다.
description_portal: 지역통합행정관련경비비율은 지방자치단체의 총 예산에서 행정 관련 경비가 차지하는 비율을 나타내는 지표입니다.이 비율은 행정 운영에 소요되는 경비가 전체 예산에서 얼마나 큰 비중을 차지하는지를 보여줍니다.비율이 지나치게 높다면 행정비용이 과도하게 소요되고 있을 가능성이 있으며, 이는 효율적인 예산 운영을 저해할 수 있습니다.반대로 낮은 비율은 행정 효율성을 의미할 수 있지만, 필수적인 행정 서비스의 질 저하를 초래할 수도 있습니다. 자원의 배분이 적절하게 이루어졌는지를 확인하는데 중요한 역할을 합니다.
