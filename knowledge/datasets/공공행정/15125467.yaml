summary_user: 공정거래위원회에 등록된 가맹 브랜드를 한 건씩 담은 원천 목록으로, 기준년도별로 브랜드명·가맹본부·대표자·업종 대·중분류·주요상품·가맹사업 개시일을 담으며 전체 5,886건, 가맹사업 개시일 범위는 1983-09-20~2018-02-01(검증 조회 기준)이다. 창업 예정자가 "관심 있는 치킨 브랜드의 본부가 언제부터 가맹사업을 해 왔고 대표자가 누구인가"를 확인하거나, 분석가가 업종별 브랜드 분포를 살피는 데 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)를 키로 가맹본부 정보, 다른 공정위 등록·공시 데이터(기업집단·특수판매·상조)와 이어 쓰며, 브랜드관리번호·가맹본부관리번호로 같은 가맹정보 계열 API와도 연결한다.
description_portal: 이 API는 공정거래위원회에서 제공하는 공정거래위원회_가맹정보_브랜드 목록 정보 제공 서비스 입니다. 브랜드 목록 정보에 대한 기준년도를 이용하여 가맹사업개시일자, 가맹사업기준년도, 브랜드관리번호, 가맹본부관리번호, 사업자등록번호, 법인등록번호, 가맹본부대표자명, 브랜드명, 업종대분류명, 업종중분류명, 주요상품명 등 정보 조회 서비스를 제공합니다.2024년 12월 13일 - 응답파라미터 corpNm(법인명) 추가
