summary_user: 경기도 시군별로 자전거도로를 전용도로·보행자겸용도로·전용차로·자전거우선도로 유형으로 나눠 노선 수와 연장, 정비 사업비를 집계 시점(SUM_YM)별로 담은 집계 자료다. 정책 분석가나 시군 담당자가 '우리 시군의 자전거도로 연장과 정비 예산이 경기도 다른 시군에 비해 어느 수준인가'를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명(SIGUN_NM)이나 경기도 시군코드를 맞춰 붙여 써야 한다.
description_portal: 이 데이터는 경기도 내 자전거도로의 설치 및 관리 현황을 집계한 자료로, 전용도로, 보행자겸용도로, 전용차로, 자전거우선도로 등 다양한 유형의 노선 수와 연장 길이, 정비 예산 정보를 포함하고 있습니다. 자전거 교통 인프라의 지역 간 분포와 규모, 예산 투입 현황 등을 파악할 수 있어, 친환경 교통 정책 수립 및 인프라 개선 계획에 활용됩니다. 각 시군별로 집계되어 자전거도로 공급 불균형 해소, 생활형 교통 수단 확대 방안, 도로 안전성 분석 등에도 기초 자료로 사용될 수 있으며, 도로 유형별 특징을 반영한 맞춤형 정책 수립에 도움이 됩니다.
