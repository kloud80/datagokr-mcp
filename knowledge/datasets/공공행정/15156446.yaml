description_portal: 이 자료는 국민신문고를 통해  양평군 기관에서 처리한 민원의 신청·이송·접수·처리 현황을 연 단위로 정리한 통계입니다.국민권익위원회에서 운영하는 시스템을 기반으로 집계되었으며, 제공항목은 민원신청 현황(신청·이송), 민원접수 현황(접수·미접수), 민원처리 현황(완료·미연장·1차연장·2차연장) 건수입니다.양평군 부서별 신문고 민원처리 현황을 볼 수 있으며, 행정기관의 민원 행정 운영 실태 파악 및 민원 서비스 품질 향상을 위한 기초자료로 활용할 수 있습니다. 또한 민원처리 경향을 이해하고 다양한 행정 분야에서 참고자료로 활용 가능합니다.
