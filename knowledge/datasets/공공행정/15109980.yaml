description_portal: 이 데이터는 한국남부발전의 유연탄 수송을 위한 현물용선 입찰 내역을 정리한 자료입니다. 연도별로 공급사와 공급계약 번호, 선적기한, 선적률, 계약 물량, 선적항 및 하역항 정보가 포함되어 있으며, 선적·하역 과정에서 발생하는 체선료와 조출료 금액도 기록되어 있습니다. 이를 통해 유연탄 수송의 국제 물류 과정과 계약 조건을 구체적으로 확인할 수 있으며, 주요 선적항인 글래드스톤, 사마린다, 뉴캐슬 등 해외 항만과 연계된 물류 흐름을 이해할 수 있습니다. 본 자료는 발전소 운영을 위한 유연탄 연료 조달 과정의 투명성을 높이고, 국제 해상운송 비용 구조 및 효율성을 분석하는 데 유용한 기초 데이터입니다. 또한 공기업의 연료 수급 안정성과 물류 전략 수립, 에너지 조달 정책 연구에도 활용될 수 있습니다.
