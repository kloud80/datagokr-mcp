summary_user: 한국수자원공사 전자조달시스템에 올라온 공사·용역·내자·물품 입찰공고를 공고 건별로 담고, 공고번호·입찰명·공고일·신청마감일·계약방법·금액·참가자수·진행상태와 개찰 결과를 제공한다. 사업자가 수자원공사가 지금 어떤 공사나 용역을 발주하고 마감이 언제인지, 과거 입찰에 몇 곳이 참여했는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고번호(tndrPbanno)·입찰명 같은 이름 매칭이나 같은 기관 코드로만 잇고, 공공조달 전체를 보려면 조달청 나라장터 데이터와 함께 본다.
limits: 2026-10-07 실호출에서 5개 오퍼레이션 중 1개만 성공했고, 공사·물품·결과·용역 목록 4개는 최소 파라미터로 응답이 없었다. 필수 파라미터인 계약구분 코드(cntrctDivCd)와 조회일(searchDt)은 다른 데이터에서 먼저 받아 넘겨야 한다. 수자원공사 한 기관의 공고만 담으며, 정부조달 부문 검토에서는 나라장터(조달청)를 원천으로 두고 이 데이터는 제외 대상으로 분류됐다.
