description_portal: 동북아역사넷 통계정보는 동북아역사재단 역사자료 디지털 플랫폼의 이용 로그를 기반으로 구축된 집계 데이터입니다. 방문자 통계와 페이지뷰 정보를 비롯해 사료, 문서, 이슈 콘텐츠 등 아이템 형태별 열람 현황, 메뉴별·콘텐츠별 조회 건수, 이용 빈도, 유입 특성 등을 테이블 단위로 구조화하여 제공합니다. 각 통계 데이터는 일정 기준 시점(일·월·연도 등)과 메뉴 코드, 콘텐츠 식별자, 아이템 유형 등의 분류값, 그리고 이에 대응하는 이용 건수·조회 수 등의 수치로 구성되며, 서비스 이용 행태를 정량적으로 파악할 수 있도록 설계된 정형 통계 데이터입니다.
