summary_user: 서울시에 인허가된 무도학원(태권도장·합기도장·격투기 체육관 등)을 사업장 한 곳당 한 건으로 담은 인허가 원장으로, 인허가·취소·휴폐업 일자와 영업상태, 주소·좌표, 지도자수·회원모집총인원·보험가입여부 등 시설·운영 항목을 포함한다. 특정 동네에 현재 영업 중인 태권도장이 몇 곳이고 최근 몇 곳이 폐업했는지, 보험에 가입된 곳은 어디인지 확인하려는 학부모·창업자·체육정책 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 코드(관리번호 MGTNO, 자치단체코드)로만 이어 쓰며, LOCALDATA 인허가 자료와 원천을 공유한다.
description_portal: 서울시 무도학원업 인허가 정보는 서울시에 인허가된 무도학원(태권도장, 합기도장, 격투기 체육관 등)의 행정 이력과 시설·운영 특성을 파악할 수 있는 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자 및 영업상태 관련 항목을 통해 각 무도학원의 인허가 및 운영 변동 이력을 확인할 수 있습니다. 사업장명, 법인명, 전화번호, 지번·도로명 주소, 우편번호, 좌표(X·Y), 소재지면적 등의 항목을 통해 무도학원의 위치와 기본적인 사업장 현황을 파악할 수 있습니다. 문화체육업종명, 세부업종명, 공사립구분명은 해당 학원이 어떤 무도 종목·유형을 운영하며 공립 또는 사립 등 어떤 성격을 가지는지 구분하는 데 활용됩니다. 지도자수, 건축물동수, 건축물연면적, 회원모집총인원 등의 정보는 시설 규모, 지도 인력 수준, 수용 가능한 회원 규모 등을 가늠할 수 있는 지표로 활용될 수 있습니다. 또한 보험가입여부코드는 안전·사고 대비 측면에서 해당 학원이 관련 보험에 가입되어 있는지를 보여 주어, 이용자 보호 관점의 분석에도 유용한 정보입니다. 이러한 데이터는 서울시 내 무도학원 분포, 규모, 운영 현황, 업종 특성 등을 분석·관리하고 체육·교육 정책 수립 및 안전 관리 계획 수립에 활용할 수 있는 인허가 기반 데이터입니다.
