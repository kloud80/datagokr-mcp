summary_user: 인천광역시 옹진군이 관리하는 공유재산 건물을 한 건씩 담은 목록 파일로, 재산명·소재지·연면적(제곱미터)·취득일자를 제공한다. 옹진군 내 어느 섬·읍면에 군 소유 건물이 있고 규모와 취득 시점이 어떤지 확인하려는 주민이나 공유재산 활용·유휴재산 실태를 분석하는 사람이 쓴다. 전역 조인 키는 없어 다른 데이터와는 소재지 주소를 매핑하거나 같은 기관 자료끼리 이어 써야 하며, 주소를 지번으로 정제하면 토지 정보와 필지 단위로 연결을 시도할 수 있다.
limits: 건물을 식별하는 표준 코드나 필지번호(PNU) 같은 공통 키가 없어 다른 공유재산·토지 데이터와 바로 결합하지 못하고 소재지 문자열 매핑이 필요하다. 범위는 옹진군 한 곳이라 다른 시군구와 비교하려면 기관별 파일을 따로 모아야 한다.
