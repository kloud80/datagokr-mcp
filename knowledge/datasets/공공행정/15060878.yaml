description_portal: 이 데이터는 외교관후보자 선발시험 최종합격자(면접시험(제3차시험) 합격자)에 대한 통계 데이터입니다. 구분은 직류 및 직렬을 나타내며([직류(직렬)]로 표기), 본 데이터의 경우 외교관후보자 선발시험 일반외교 직렬의 통계를 제공합니다 . 각 모집단위별로 선발예정인원, 면접응시인원, 최종합격인원에 대한 통계를 제공합니다. 여성합격자 현황, 연령별 합격자 분포에 대한 정보를 제공합니다. 모집단위별 제2차시험 합격자 필수과목 점수 통계(과목별 인원, 합격자 평균점수, 합격자 최고점수, 합격자 최저점수)를 제공합니다.
