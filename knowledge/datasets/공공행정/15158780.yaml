summary_user: 국가기록원이 관리하는 기록물의 메타데이터(기록물 구분, 생산년도, 공개구분, 생산기관, 철·건 ID, 상세정보 페이지 링크 등)를 기록물 건별로 RSS(XML) 형식으로 내려주는 전국 범위 API입니다. 연구자나 서비스 개발자가 "특정 주제나 생산기관의 국가기록물에는 어떤 것이 있고, 공개 여부와 상세 페이지는 어디인가"를 찾아 외부 시스템에 자동으로 수집할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 생산기관명 같은 이름 매칭이나 같은 기관 코드로만 다른 데이터와 연결하며, 행정표준코드를 기관 코드 원장으로 함께 쓰는 방식이 후보입니다.
limits: 필수 파라미터 query에 다른 데이터의 코드를 넣어야 해서, 그 코드를 먼저 확보한 뒤 호출해야 한다. 개발계정은 하루 1,000회로 호출이 제한된다. 실측된 응답 필드는 결과 코드·메시지 위주로 확인되어, 기록물 본문이나 원문 파일은 이 API에서 직접 받지 못하는 것으로 보고 다뤄야 한다.
