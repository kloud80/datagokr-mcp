description_portal: 국가기록물에 대해 공개 활용 활성화 등 IT환경의 변화속에서 기존의 복잡하고 비용이 높은 웹서비스 대신 개방형, 경량화 연계 지원으로 국민과 기업이 가치를 창출할 수 있는 전자정부 서비스를 발굴 제공하기 위한 서비스로, 국가기록원에서 관리하는 다양한 기록물의 메타데이터를 RSS(XML) 형식으로 제공하여 외부 시스템이 기록물 정보를 실시간으로 활용할 수 있도록 지원합니다. 기록물 구분, 생산년도, 공개구분, 생산기관, 기록물제공, 철 건 ID, 기록물 상세정보페이지 링크등을 제공합니다. 국가기록포털 검색과 연계되어 기록물 제목, 생산기관, 관리번호 등의 정보를 자동으로 수집할 수 있으며, 기록연구, 공공서비스 연계, 민간 활용 등 다양한 분야에서 활용 가능합니다.
