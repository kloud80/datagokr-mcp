summary_user: 국내 학술단체를 한 기관당 한 행으로 정리한 원천 목록으로, 기관명(한글·영문), 학문 대분류·중분류, 우편번호·주소, 시스템 보급 연월, 도메인 주소를 담고 전국을 범위로 한다. 연구자나 학술행정 담당자가 "내 분야(중분류)에서 온라인 논문 투고·심사 시스템을 쓰는 학회는 어디이고 투고 사이트 주소는 무엇인가"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명 문자열 매칭이나 주소·우편번호를 기준으로 연결해야 한다.
description_portal: 학술단체 정보 데이터는 국내 학술단체의 기관명, 대분류 및 중분류, 주소, 우편번호, 도메인 주소 등의 기본 정보를 체계적으로 정리한 자료입니다. 온라인 논문 투고 및 심사 시스템을 운영하는 학술단체의 현황을 파악할 수 있어, 연구자와 학술행정 담당자들이 학술단체 검색, 협력 네트워크 구축, 논문 투고처 탐색 등의 목적으로 유용하게 활용할 수 있습니다. 또한 학술 생태계 분석 및 연구 활동 지원 등 목적으로도 활용 가능합니다. 연간 주기로 업데이트되어, 수정일을 기준으로 최근 학술단체 정보를 확인할 수 있습니다.
