description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘가로등 및 보안등 현황’ 데이터는 도시 및 주거지의 야간 조명 인프라를 체계적으로 파악할 수 있는 핵심 공공자원입니다.이 데이터는 등종류(가로등·보안등), 행정동, 소재지 주소, 상세 위치, 위도·경도 좌표, 데이터 기준일자를 포함하여 조명의 분포, 설치 밀집도, 안전 사각지대 등을 정량적으로 분석할 수 있도록 구성되어 있습니다.도시계획, 교통안전, 범죄예방, 재난 대응, 야간 보행환경 개선 등 다양한 분야에서 활용 가능하며 GIS 기반 지도 제작, 조명 정책 수립, 민원 대응, 스마트 도시 시스템 구축 등 실무 중심의 분석 자료로 유용합니다.특히 야간 안전을 위한 조명 시설 개선 방향을 제시하거나, 주민불편 요소를 발굴하는 데 핵심 정보를 제공합니다.
