summary_user: 누리장터에 등록된 민간계약 건의 계약현황과 변경·삭제 이력을 계약 건 단위로 담는 API입니다. 검증 호출에서는 전국 범위로 1건만 확인됐습니다. 조달 분석가나 사업자가 나라장터 수요기관이 아닌 민간 발주처의 전자입찰 계약이 언제 체결·변경·삭제됐는지 확인하는 데 쓴다. 통합계약번호(untyCntrctNo)를 조인 키로 나라장터 발주계획→사전규격→입찰→낙찰→계약 데이터와 이어 쓰고, 확정계약번호·계약참조번호로도 대조한다.
description_portal: 민간계약정보를 제공하는 서비스로 계약현황조회 ,변경이력조회, 삭제이력조회등 민간계약의 현황정보를 제공. 또한, 나라장터 검색조건인 계약체결일자, 확정계약번호, 요청번호, 공고번호, 기관명(계약기관, 수요기관), 품명, 계약방법, 계약참조번호에 따른 계약현황정보를 제공※ 나라장터에 수요기관으로 등록할 수 없는 '수요기관 외의 자'가 전자조달시스템을 이용하여 전자입찰을 실시하고자 하는 경우 '누리장터'를 이용할 수 있습니다. 민간계약정보는 누리장터에 등록된 민간계약건의 계약 관련 정보를 제공합니다.
