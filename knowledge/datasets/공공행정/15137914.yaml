description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 전자 회의록 중 질문과 답변 게시판 정보를 제공합니다. 의회 본회의와 위원회에서 의원들이 제출한 질문과 집행부의 답변을 체계적으로 기록하여 공개하는 자료입니다. 고유번호는 각 질의응답을 식별하며, 상위 글 고유번호는 질문과 답변의 연결 관계를 나타냅니다. 대수, 회기, 차수는 의회 회의 정보를 표시하고, 서면 질문 여부는 질문 방식을 구분합니다. 질문과 답변의 제목 및 요지는 내용의 일부를 제공합니다. 본 데이터는 의정 활동 기록, 시민 정보 공개, 정책 모니터링, 의정 투명성 강화 등에 활용되며 시민의 알권리 보장에 기여합니다.
