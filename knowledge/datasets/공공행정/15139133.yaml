description_portal: '국도비 확보 촉진 및 공모사업의 체계적인 관리를 위한 양평군의 공모사업 추진현황 자료입니다. 데이터는 공모 추진 부서, 사업명, 국도비 확보금액, 군비금액 , 선정현황 등의 내용으로 구성되어 있으며, 양평군에서 어떤 공모사업을 추진 중인 지 파악할 수 있는 자료를 제공합니다.현재 양평군 공모사업 추진현황은 분기별로 양평군청 홈페이지에 게시중이니, 자세한 사항은 홈페이지에서 확인하시기 바랍니다.  * 양평군청 홈페이지: https://www.yp21.go.kr/www/selectBbsNttList.do?bbsNo=41&key=1573  * 공모사업이란? 국가, 지방자치단체, 공공기관 등에서 특정 사업의 수행 또는 참여기관을 공개 모집하여 선정하고, 사업비의 전부 또는 일부를 보조하는 사업'
