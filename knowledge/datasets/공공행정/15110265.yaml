summary_user: 공정거래위원회 가맹정보 중 브랜드별 창업 비용을 연도 기준으로 담은 데이터로, 브랜드·가맹본부(법인명)·업종 대·중분류마다 가맹금, 교육비, 보증금, 기타 비용과 그 합계 금액을 제공하며 범위는 전국이다. 창업 예정자가 "같은 업종에서 이 브랜드의 초기 창업 비용이 다른 브랜드보다 높은가"를 비교하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 다른 가맹사업 데이터와는 브랜드명·법인명·업종명을 이름으로 맞춰야만 이어 쓸 수 있다.
limits: 사업자등록번호·법인등록번호 같은 공통 키가 없어 다른 공정위 체인(가맹 정보공개서, 기업집단 등)과 정확히 연결하기 어렵고 이름 매핑에 의존한다. 지역별(시도·시군구) 비용 차이는 담지 않는 전국·비공간 데이터이며, 호출은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
