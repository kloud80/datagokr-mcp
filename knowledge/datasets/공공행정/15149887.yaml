description_portal: 이 데이터는 전남개발공사 홈페이지의 웹사이트 접속 기록 정보입니다. 원본데이터를 AI가 학습하기 쉬운 데이터로 결측치 및 이상치 처리, 오탈자 정제, 라벨링 등 전처리 과정을 이행한 데이터입니다. 데이터는 접속 일시, 사용된 브라우저, 운영체제, 기기 유형, 기기 종류, 접속 상태, 그리고 접속 시간대 등의 세부 항목으로 구성됩니다. 접속 상태와 접속 시간대는 라벨링 정보로 접속정보에 따라 정상적인 접속과 비정상접속(봇/시간대) 라벨링 하였고, 접속시간은 시간대 별로 새벽, 오전, 오후, 저녁으로 구분하여 AI가 데이터 패턴을 학습하기 쉽게 작성되었습니다. 이 정보는 홈페이지 이용 패턴을 분석하고, 사용자들이 주로 어떤 환경에서 접속하는지 파악하여 웹사이트 기능 및 디자인을 최적화하는 데 활용될 수 있습니다. 또한, 시간대별 접속량 분석을 통해 서버 트래픽 관리 및 서비스 안정성 강화에도 기여할 것으로 기대됩니다. 궁극적으로는 데이터 기반의 사용자 경험 개선을 통해 홈페이지의 접근성과 효율성을 높이고, 공공 정보에 대한 시민들의 접근성을 향상시키는 데 중요한 역할을 할 것입니다.
