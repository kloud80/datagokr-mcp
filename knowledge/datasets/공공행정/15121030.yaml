summary_user: '온비드 오픈API에서 쓰는 부동산·동산 물건의 용도 코드를 코드ID·코드명·상위코드·레벨(1레벨 안에 2레벨, 그 안에 3레벨)로 정리한 코드표 파일로, 건별 원천 데이터가 아니라 참조용 분류표다(csv 약 14.6KB). 온비드 공매·입찰 API를 호출하는 개발자나 분석가가 결과에 나온 용도코드가 어떤 물건 용도(예: 토지·주거용 건물·차량 등 상위 분류)에 속하는지 풀어 읽거나 용도별로 물건을 묶어 집계할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어 온비드 API 응답의 용도코드·용도명과 코드ID·코드명을 맞춰 붙이는 방식으로만 연결한다.'
limits: 이 파일은 용도 분류 코드표일 뿐 개별 물건·입찰 정보는 담지 않으며, 행정표준코드나 필지번호(PNU) 같은 전역 키가 없어 온비드 외 데이터와 직접 조인되지 않는다. 범위는 전국·비공간이다.
