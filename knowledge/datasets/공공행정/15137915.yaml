description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 전자 회의록에 기록된 출석 의원 정보를 제공합니다. 시의회 본회의와 위원회 개최 시 출석한 의원의 명단을 회의록별로 관리하여 의정 활동 참여 현황을 투명하게 공개합니다. 고유번호는 출석 기록을 구분하기 위한 순번을 나타내며, 회의록 고유번호는 해당 전자회의록 번호를 나타냅니다. 출석 의원명은 회의에 참석한 의원의 이름입니다. 본 데이터는 의정 활동 모니터링, 의원 출석률 분석, 의회 운영 투명성 확보, 시민 정보 제공 등에 활용되며 의원들의 성실한 의정 활동을 독려하고 시민의 알권리를 보장합니다.
