description_portal: '부산광역시 금정구 관내 지적공부 등록지 현황(토지소재지, 각종 유형별 면적, 지번수 등)을 제공하는 데이터 파일입니다.금정구 2025년 8월 31일 행정동-지목별, 면적, 지번수를 나타낸 csv 파일 형식의 데이터 입니다.○ 지번 → 토지의 고유 번호(필지번호)○ 지목 → 토지의 이용 목적을 나타내는 항목전(田) : 곡물이나 채소 등을 재배하는 토지답(畓) : 벼를 재배하는 토지과수원(果樹園) : 과수 재배를 목적으로 하는 토지목장용지(牧場用地) : 가축을 사육하기 위한 토지임야(林野) : 수목이 자라고 있거나 자라게 할 목적의 토지광천지(鑛泉地) : 온천, 약수터 등이 있는 토지염전(鹽田) : 소금을 생산하기 위한 토지대(垈) : 주거용 건축물이 있는 토지공장용지(工場用地) : 공장이 설치된 토지학교용지(學校用地) : 학교 건물이 있는 토지주차장(駐車場) : 차량을 주차할 수 있도록 된 토지주유소용지(注油所用地) : 주유소 건물이 설치된 토지창고용지(倉庫用地) : 창고 건물이 설치된 토지도로(道路) : 일반도로, 고속도로 등 통행용 토지철도용지(鐵道用地) : 철도가 설치된 토지제방(堤防) : 하천의 범람을 막기 위한 토지하천(河川) : 하천 부지구거(溝渠) : 인공적으로 설치된 수로(도랑, 개천)유지(溜池) : 못, 저수지 등 물이 고여 있는 토지양어장(養魚場) : 물고기를 기르는 토지수도용지(水道用地) : 수도 시설이 설치된 토지공원(公園) : 도시공원 등으로 지정된 토지체육용지(體育用地) : 운동장, 체육시설이 있는 토지유원지(遊園地) : 유원지, 위락시설이 있는 토지종교용지(宗敎用地) : 교회, 사찰 등 종교 시설이 있는 토지사적지(史蹟地) : 문화재○ 면적 → 토지의 실제 면적(㎡ 단위)○ 소재지 → 토지의 위치를 나타내는 주소(도로명 또는 지번)○ 행정동명 → 해당 토지가 속한 행정동 명칭○ 필지수 → 관할 구역 내 총 필지 개수'
