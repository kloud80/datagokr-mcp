description_portal: '전라남도 함평군 인구 및 세대현황에 관한 월별 데이터로 인구 구성 현황, 인구 변동 요인, 읍면별 인구에 관한 데이터를 제공합니다. 위 데이터는 남, 여 비율, 총계 정보를 제공하고 있으며 전년 말기준 정보 또한 제공하고 있습니다. 인구정보는 각종 정책수립 및 인구이동 추이 파악 등에 활용 가능합니다. 위 데이터는 함평군 홈페이지 사전공표로 제공되고 있으며 다음달 초에 게시되고 있습니다. 동일 파일은 함평군 홈페이지 내에서도 열람 가능합니다.○ 인구이동통계(증가요인, 감소요인)○ 인구 및 세대현황 등출처 : 주민등록시스템제공부서 : 민원봉사과'
