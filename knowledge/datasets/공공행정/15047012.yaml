description_portal: '○ 통계개요* 통계명 : 전입지 이동사유별 인구이동* 통계종류 : 서울시 인구이동 현황을 이동사유별로 제공하는 지정ㆍ보고통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국 국민의 지역별 인구이동량 및 이동방향 등을 파악하여 지역간의균형적 국토개발, 교통, 교육 및 주택 등의 정책수립 자료와 지역별인구추계에 필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 전입사유별 이동자수○ 용어설명* 이동건수 : 전입신고건수를 집계한 것으로, 동일시점에 동일세대 구성원이동시에 전입신고한 경우 함께 신고한 세대원수에 상관없이 한건으로 집계* 시도내이동 : 이동전과 이동후의 시도는 같고 행정 읍면동이 다른 이동* 시도간이동 : 시도를 달리하는 이동(이동전과 이동후의 시도가 다른 경우)'
