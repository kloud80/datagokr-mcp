summary_user: 경기도 시군구별로 기준년월·요일·중분류 업종마다 카드매출 금액과 비율, 전월·전년동월 대비 증감값과 증감률을 담은 집계 통계다. 소상공인이나 지역 상권 분석가가 '우리 시군구에서 이 업종은 어느 요일에 매출이 몰리고, 작년 같은 달보다 늘었나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군구코드(signgu_cd)를 다른 시군구 단위 통계와 이름·코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 시군구 단위에서 요일별 카드매출을 중분류 업종 기준으로 집계한 통계자료입니다. ‘기준년월’, ‘시군구코드’, ‘요일코드’, ‘중분류업종코드’를 기준으로 매출금액, 매출금액비율, 전월 및 전년동월 대비 증감값과 증감비율 등이 포함되어 있습니다. '요일코드'는 각 요일을 영어 약어(MON, TUE 등)로 표현하며, ‘TOT’는 요일별 합계가 아닌 별도 산정된 대표값으로 추정됩니다. 주요 항목은 ‘기준년월’, ‘시군구코드’, ‘요일코드’, ‘중분류업종코드’, ‘매출금액’, ‘매출금액비율’, ‘전월대비증감값’, ‘전월대비증감비율’, ‘전년동월대비증감값’, ‘전년동월대비증감비율’이며, 이를 통해 업종별 소비 집중 요일, 요일 간 매출 변동 패턴, 지역별 주중·주말 소비 분포 등을 분석할 수 있습니다. 마케팅 전략 수립, 소비 트렌드 파악, 업종별 요일 대응 전략 마련 등에 활용될 수 있습니다.
