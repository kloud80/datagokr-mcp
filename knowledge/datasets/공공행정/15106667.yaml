description_portal: '군포시 물가동향 정보(공공요금 포함)로 품목, 규격, 단위, 가격, 조사업체, 기타사항 항목을  군포시 홈페이지를 통해 제공합니다. 목    적 : 생활 밀접 품목에 대해 정기적으로 가격 동향을 조사·공개하여  민생물가 안정 및 합리적 소비행위 진작   추진방향 : 물가 조사의 일관․신뢰․정확성 제고, 물가안정 취약 시기 등               인상 억제 계도, 가격표시제 점검 병행추진   운영(위촉)기간 : 연중   운영인원 : 12명(각 동별 1명)  활동현황 : 월 3회(매월 10일/15일/20일)   조사품목 : 총 40종 내외- 농축수산물(25종) 2회, 개인서비스 요금(16종) 1회  - 농축수산물 품목 : 농산물 16종(사과, 깻잎, 배추, 무, 고춧가루, 마늘, 대파, 당근, 양파, 상추, 감자, 시금치, 느타리버섯, 애호박, 쌀, 콩), 축산물 4종(쇠고기, 돼지고기, 닭고기, 달걀), 수산물 5종(갈치, 조기, 삼치, 오징어, 고등어)  - 개인서비스 요금 : 식품위생업종 11개 요금(잔치국수, 김찌치개, 삼겹살, 자장면, 불고기피자, 치킨, 삼계탕, 칼국수, 김밥, 커피, 생맥주), 공중위생업종 5개 요금(의복수선료, 세탁료, 커트, 파마, 목욕료)   주요역할 : 관리품목 가격조사 및 물가안정 계도․홍보 등'
