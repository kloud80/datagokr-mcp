description_portal: '[SGIS 오픈 플랫폼] "e지방지표" 서비스의 지표 목록 정보입니다. 행정동지원레벨, 서비스여부, 자치구여부 정보 등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. e지방지표  지역(시도/시군구)에 대한 종합적이고 객관적인 정보를 이용자들이 쉽고 편리하게 비교 및 이용 가능하도록 각 기관에서 생산하고 있는 지역의 주요통계를 한 곳에 모은 서비스'
