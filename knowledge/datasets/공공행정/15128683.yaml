description_portal: '경상북도 경상북도 사업체 조사는 지역 내 사업체의 규모와 구조를 종합적으로 파악하기 위해 실시된 조사자료입니다. 본 데이터에는 사업체의 산업분류, 종사자 수, 업종별 분포, 행정구역, 법인 및 개인 구분 등 주요 항목이 포함되어 있습니다. 이를 통해 지역 산업의 구조적 특성과 고용 현황을 분석할 수 있으며, 정책 수립, 산업 육성, 일자리 창출 등 행정 의사결정의 기초자료로 활용됩니다. 본 조사는 통계법에 따라 매년 실시되며, 공공데이터로 제공되어 지역경제의 변화 추이를 체계적으로 분석할 수 있습니다. 경상북도 내 종사자 1인 이상 모든 사업체의 구조와 분포, 경영실태 등에 관한 사항을 종합적으로 파악하여 경제정책 수립과 기업의 경영계획 수립 및 평가의 기초자료를 제공합니다. - 기준시점 : 2022. 12. 31. - 조사기간 : 2023. 2. 9. ~ 3. 6. - 경로 이동 :(경상북도 통계홈페이지) 경상북도-경상북도사업체조사-2022년 기준 사업체조사 결과자료 관련 문의는 054-880-2564 로 하시기 바랍니다.'
