summary_user: 나라장터에서 쓰는 업종을 법제처 법 분야에 따라 코드화한 업종 기준 정보로, 업종별로 업종분류·업종명, 근거법령명과 조항, 법령 원문 URL, 관련규정 내용, 포함면허, 사용 여부와 등록·변경 일시를 담는다. 공공입찰에 참여하려는 사업자나 조달 분석가가 '이 입찰의 업종 제한 코드는 어떤 법령에 근거한 어떤 면허를 뜻하는가'를 확인하는 데 쓴다. 실측으로 확인된 조인 키는 근거법령명(baseLawordNm) 하나이며, 업종코드는 발주계획→사전규격→입찰→낙찰→계약으로 이어지는 조달청 나라장터 데이터에서 업종을 풀어 읽는 기준표로 곁들여 쓴다.
description_portal: 나라장터 업종 및 근거법규를 조회한다.법제처가 분류하고 있는 법 분야에 따라 업종이 분류되어 있으며 법 분야별로 업종을 코드화하여 제공법령의 제정,개정,폐지 등으로 업종이 추가/수정/삭제될 경우 조회시점에 유효한 업종 정보만 제공또한 제한업종과 허용업종에 대한 정보를 제공하여 조회하고자 하는 업종과 연관된 다른 업종에 대한 정보 제공또한 근거법령에 대한 내용과 해당 근거법령에 대한 정보를 직접 확인 및 다운로드할 수 있도록 URL 링크 제공법령의 제정,개정,폐지 등이 발생하는 시점과 업무담당자가 관련 업종을 코드화하여 등록하는 시점에 차이가 발생할 수 있으므로실제 업종코드의 등록시점과 법령의 제정,개정,폐지 시점이 일부 차이가 있을 수 있습니다.
