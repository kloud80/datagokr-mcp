summary_user: 충청남도 금산군 의회가 심사·처리한 의안을 한 건씩 담은 원천 목록으로, 의안번호·의안명·제안자·제안회기와 위원회 회부, 상정, 의결, 본회의 상정, 처리결과, 이송, 공시까지의 날짜를 기록한 CSV 파일(약 47만 바이트)이다. 주민이나 의정활동 분석가가 '이 조례안은 누가 언제 제안했고 위원회 회부부터 의결·이송까지 얼마나 걸렸는가'를 확인하는 데 쓴다. 다른 데이터와 직접 이을 전역 조인 키는 없어, 다른 지방의회 의안정보나 회의록과는 의안명·의안번호·회기 같은 이름 매칭이나 같은 기관 단위로만 연결한다.
description_portal: 이 데이터는 충청남도 금산군 의회에서 심사·처리한 각종 의안의 주요 정보를 제공하는 공공데이터입니다. 제공 항목으로는 의안번호, 의안명, 제안일자, 제안회기, 제안자, 위원회 회부일, 상정일, 의결일, 본회의 상정일, 처리일, 이송일 등이 포함되어 있으며, 각 의안의 제안부터 심사, 본회의 상정 및 최종 의결, 이송에 이르기까지의 절차와 처리 현황을 체계적으로 확인할 수 있습니다. 이를 통해 지방의회의 의안 심사 과정과 입법 활동 전반을 투명하게 파악할 수 있으며, 지방자치 정책 연구나 의정활동 분석, 관련 제도 개선, 의회 운영 계획 수립 등 다양한 분야에서 활용이 가능합니다. 특히 지방의회 의정활동의 효율성과 투명성을 높이는 데 기여할 수 있는 중요한 자료입니다.
