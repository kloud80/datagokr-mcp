summary_user: 2007년 12월 19일 실시한 제17대 대통령선거의 개표결과를 전국 시도·구시군·읍면동·투표구 단위로 담은 CSV 파일로, 후보자별 득표수와 선거인수·투표수·무효투표수·기권자수 등을 투표구 행 단위로 담는다. 분석가나 연구자가 '2007년 대선에서 우리 동네 투표구별로 어느 후보가 몇 표를 얻었나' 같은 지역별 득표 분포를 확인하거나 다른 선거와 비교할 때 쓴다. 전역 조인 키나 행정코드가 없어 시도명·구시군명·읍면동명 같은 이름으로 다른 선거 개표결과나 행정구역 통계와 맞춰 이어 쓴다.
description_portal: '2007년 12월 19일에 실시한 제17대 대통령선거에 대한 개표결과로 전국 시도, 구시군, 읍면동, 투표구별 개표정보입니다. 선거인수, 투표수, 후보자별 득표수, 무효투표수, 기권자수 등의 항목으로 구성되어 있습니다.※ 제17대 대통령선거 개표결과 데이터는 공공데이터 제공 기준에 따라 CSV 형식으로 제공됩니다.※ 통합 시트 형태의 엑셀 파일(.xlsx)은 중앙선거관리위원회 국가선거정보 개방포털시스템에서 확인하실 수 있습니다. ‣ 국가선거정보 개방포털시스템: http://data.nec.go.kr ‣ 통합 엑셀 파일 제공 경로: http://data.nec.go.kr/open-data/file.do?dataId=24'
