summary_user: 지방자치단체별 당초예산(일반회계) 기준으로 자체수입(개편 전·후), 예산규모, 재정자립도(개편 전·후)를 회계연도 단위로 담은 전국 범위 집계 지표이다. 주민·분석가가 "우리 시군구의 재정자립도는 몇 %이고 광역 평균이나 전국 평균과 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지방재정365 데이터와는 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 맞춰 연결한다.
description_portal: 재정자립도(당초)는 지방자치단체가 편성한 당초예산을 바탕으로 자체적인 재원을 통해 예산을 얼마나 충당할 수 있는지를 나타내는 지표로, 자치단체의 재정 건전성을 평가하는 중요한 척도입니다. 이는 자치단체의 세입 중 지방세, 세외수입 등 자체수입이 차지하는 비율을 나타내며, 이 비율이 높을수록 중앙정부 의존도가 낮고 자립적인 재정 운영이 가능하다는 의미입니다. 재정자립도는 결산 시 세입 결산액을 기준으로 계산되며, 이 값이 높을수록 자치단체의 재정이 안정적이고 독립적이라고 평가됩니다.재정자립도(당초) 정보는 2012회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 자체수입(개편전), 자체수입(개편후), 자치단체예산규모, 재정자립도(개편전), 재정자립도(개편후) 항목이 제공됩니다.
