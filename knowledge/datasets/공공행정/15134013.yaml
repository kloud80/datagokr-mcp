summary_user: 한국산업인력공단이 외국인 노동자 구직자의 구직정보를 접수 건별로 담은 API로, 접수번호·국적·희망분야와 희망직종(최대 3개)·경력 개월수·한국어 능력·등록일을 제공하며 범위는 전국이고 위치 정보는 없다. 외국인 근로자 채용을 검토하는 사업주나 인력 분석가가 '특정 국적·직종을 희망하는 외국인 구직자가 얼마나 있고 경력과 한국어 능력은 어느 수준인가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못해, 국적명이나 직종명 같은 이름 매핑으로만 다른 데이터와 이어 쓴다.
