summary_user: 지방자치단체별로 해마다 재난관리기금 전출금을 얼마나 확보했는지를 회계연도(fyr)·자치단체 단위로 담은 지방재정365 공시 집계이며, 범위는 전국입니다. 분석가나 주민이 '우리 시·군·구가 재난관리기금을 법정 기준만큼 적립했는가'를 확인하거나 자치단체끼리 확보율을 비교할 때 쓴다. 전역 조인 키는 없어 자치단체 코드·이름(laf_cd, laf_hg_nm)과 회계연도로 같은 지방재정365 공시 데이터와 맞춰 잇는다.
description_portal: 지방자치단체는 자연재난 발생시 응급복구 등에 소요되는 재원 확보를 위해 매년 재난관리기금을 적립하여야 합니다.또한, 최근 3년 동안의 「지방세법」에 의한 보통세의 수입결산액의 평균연액의100분의1에 해당하는 금액 이상을 재난관리기금에 적립하여야 합니다.재난관리기금은 지방자치단체가 수행하는 공공분야 재난관리 활동의 범위에서 해당 지방자치단체의 조례로 정한 사항, 지방자치단체 외의 자가 소유하거나 점유하는 시설에 대한 안전조치 비용 중 지방자치단체 조례로 정한 사항 등에 사용할 수 있습니다.이 게시판에서는 지방자치단체가 재난관리기금전출금 확보내역을 확인하실 수 있습니다.기존 재정분석 항목이었으나, 현행 재정분석에서는 별도 측정하지 않는 지표)
