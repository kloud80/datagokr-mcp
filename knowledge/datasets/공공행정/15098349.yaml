description_portal: '공정거래위원회의 소비자 민원 학습 데이터는 소비자 상담 데이터를 분석하여 소비자 보호 정책 수립 및 개선에 활용하기 위한 데이터입니다. 이 데이터는 다양한 형태로 제공되며, 주요 내용은 다음과 같습니다.소비자 상담 데이터: 소비자 민원 상담 내용, 상담 결과, 품목 코드, 분쟁 유형 등 다양한 정보를 포함합니다. 지역별 소비자 상담 데이터: 지역별 소비자 민원 발생 현황 및 상담 내역을 보여줍니다. 품목별 소비자 상담 데이터: 특정 품목에 대한 소비자 민원 발생 현황 및 상담 내역을 보여줍니다.분쟁 유형별 데이터: 소비자 민원 상담의 분쟁 유형별 현황을 보여줍니다. 사건 처리 결과 데이터: 소비자 민원 처리 결과에 대한 데이터를 제공합니다.'
