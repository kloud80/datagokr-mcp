summary_user: 지방자치단체별로 회계연도의 세출 결산액을 담은 전국 단위 집계 데이터로, 연도(fyr)·광역 자치단체명·자치단체 코드와 이름, 그리고 여러 개의 결산금액 항목(stl_amt0~4)으로 구성된다. 분석가나 주민이 "우리 지역 자치단체가 특정 연도에 실제로 얼마를 지출했나, 다른 지역과 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않아 다른 지방재정365 데이터와는 자치단체 코드(laf_cd)나 자치단체명을 맞춰 연결해야 한다.
description_portal: 지역통합세출결산이란, 지방자치단체가 특정 회계연도 동안 실제로 지출한 예산 항목을 결산한 결과를 의미합니다. 이는 지방자치단체가 예산을 세운 후 실제로 지출한 금액을 기록한 문서로, 세출 항목별로 공공서비스 제공, 인프라 구축, 복지 지원 등 다양한 분야의 지출 내역을 포함합니다. 세출결산을 통해 예산과 실제 지출 간의 차이를 분석하고 재정 운용의 효율성을 평가하며, 향후 예산 계획 수립 시 중요한 기준 자료로 활용됩니다.이를 통해 지방자치단체의 재정 투명성을 제고하고, 예산 집행의 적정성을 검토할 수 있습니다
