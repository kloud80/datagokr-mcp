description_portal: 무역안보관리원 발간물 자료 현황 데이터는 무역안보관리원(KOSTI)에서 생산·등록·관리하고 있는 발간물의 현황 정보를 제공하고 있습니다. 해당 데이터는 발간물별 등록일자, 기관명, 연도, 유형, 일련번호, 발간주기, 발간물명 등 기본 관리 정보를 포함하고 있으며, 발간수량, 배부처, 지면수, 규격, 발간예정일, 발간매체, 홈페이지 공개 여부, 조회수 등 발간 및 배포 관리에 필요한 세부 정보를 함께 제공하고 있습니다.본 데이터에는 전략물자 Basic 과정, 전략물자 프리마스터 과정, 자율준수무역거래자 과정, 판정 Basic 과정, 경찰청 전략물자 교육과정 등 무역안보 및 전략물자 관련 교육자료의 발간 현황이 포함되어 있습니다. 또한 현안대응보고서, 외국인투자 안보심사제도 총람, 대외무역법 시행령 및 전략물자수출입고시, 미국 수출통제 안내가이드 등 무역안보 정책 및 제도 안내와 관련된 발간물 정보도 포함하고 있습니다.해당 데이터는 무역안보관리원에서 발간하는 자료의 등록 현황과 발간 흐름을 체계적으로 파악하는 데 활용할 수 있습니다. 발간물명과 발간일정 정보를 통해 자료의 생산 시기와 주요 내용을 확인할 수 있으며, 발간수량과 배부처 정보를 통해 자료의 배포 대상과 활용 범위를 파악할 수 있습니다. 또한 지면수, 규격, 발간매체 정보를 통해 발간물의 제작 형태와 규모를 확인할 수 있습니다.홈페이지 공개 여부 항목을 통해 외부 공개자료와 내부 활용자료를 구분할 수 있으며, 이를 바탕으로 대국민 공개자료 관리, 기관 내부 자료 관리, 발간물 보존 및 활용 현황 점검 등에 활용할 수 있습니다. 특히 전략물자, 수출통제, 자율준수무역거래자, 외국인투자 안보심사 등 무역안보 분야의 주요 교육 및 정책자료 현황을 확인할 수 있어 관련 업무 담당자, 교육 운영자, 정책자료 관리자 등이 참고자료로 활용할 수 있습니다.본 데이터는 무역안보관리원의 발간물 제작, 배포, 공개, 관리 현황을 종합적으로 확인할 수 있는 기초자료로 활용될 수 있습니다. 또한 향후 발간계획
