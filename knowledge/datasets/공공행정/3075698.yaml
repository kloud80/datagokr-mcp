description_portal: '시설녹지란  「도시공원 및 녹지 등에 관한 법률」 제2조제5호, 「국토의 계획 및 이용에 관한 법률」 제2조제6호나목에 따른 녹지로서 도시지역에서 자연환경을 보전하거나 개선하고, 공해나 재해를 방지함으로써 도시경관의 향상을 도모하기 위하여 같은 법 제30조에 따른 도시ㆍ군관리계획으로 결정된 것을 말합니다.1. 완충녹지: 대기오염, 소음, 진동, 악취, 그 밖에 이에 준하는 공해와 각종 사고나 자연재해, 그 밖에 이에 준하는 재해 등의 방지를 위하여 설치하는 녹지2. 경관녹지: 도시의 자연적 환경을 보전하거나 이를 개선하고 이미 자연이 훼손된 지역을 복원ㆍ개선함으로써 도시경관을 향상시키기 위하여 설치하는 녹지3. 연결녹지: 도시 안의 공원, 하천, 산지 등을 유기적으로 연결하고 도시민에게 산책공간의 역할을 하는 등 여가ㆍ휴식을 제공하는 선형(線型)의 녹지광주광역시 자치구별 및 시설녹지(완충녹지, 경관녹지, 연결녹지)별 개소수, 조성/조성중/미조성(면적), 전년대비 증감면적 등을 제공합니다.○ 데이터 업데이트 기준 : 매년 12월 31일자'
