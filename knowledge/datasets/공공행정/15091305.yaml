summary_user: 한국개발연구원(KDI)이 발행하는 KDI 경제전망·KDI 경제동향·KDI 북한경제리뷰 세 정기간행물의 기사·보고서를 한 건씩 담은 목록 파일로, 보고서 번호·기사 번호·보고서 종류·기사 제목·발행일·언어·주제·발행처를 담는다(CSV 약 354KB). 분석가나 연구자가 특정 시기에 KDI가 민간소비·수출·소비자물가·북한경제 같은 주제로 어떤 보고서를 냈는지 찾고 발행 이력을 정리하는 데 쓴다. 다른 데이터와 맞물리는 전역 조인 키가 없어서 기사 제목·주제어 같은 이름 매칭이나 같은 기관(KDI) 자료끼리만 연결한다.
description_portal: 한국개발연구원_정기간행물 기사 논문 목록은 한국개발연구원(KDI)에서 발행하는 정기간행물 기사/논문 목록을 제공합니다. KDI 경제전망, KDI 경제동향, KDI 북한경제 3개의 정기간행물로 구성되어진 목록으로 KDI 경제전망에 수록된 현안자료와 KDI 북한경제리뷰의 기사, 매월 발행되는 KDI 경제동향 보고서들의 목록입니다. 한국개발연구원_KDI 정기간행물 기사 논문 목록은 순번, 발간번호, 간행물 제목, 발행일, 키워드, 언어, 발행처를 제공하며, 경제활동별 국내 총생산, 국내총생산에 대한 지출, 경기종합지수 및 BSI, 국내 경제 전망, 현 경제상황에 대한 인식, 세계경제 동향, 북한경제 동향과 분석, 민간소비, 설비투자, 건설투자, 수출, 경상수지, 소비자물가, 취업자 수 등 현 경제상황에 대한 인식과 경제전망을 대외여건에 견주어 파악하고 연구한 정기 보고서의 목록을 제공하고 있습니다.
