summary_user: 공정거래위원회가 공개하는 가맹본부 단위 현황으로, 기준년도별 가맹본부의 회사명·대표자·소재지·사업자등록번호 등을 건별로 담으며 API 전체 2,769건이다. 창업 예정자가 "이 가맹본부를 믿어도 되나"를 확인하는 질문에 쓰고, 시도명으로 지역별 본부를 좁혀 볼 수 있다. 사업자등록번호(brno)·법인등록번호(crno)로 같은 공정거래 체인의 다른 데이터와 이어 쓰고, 소재지주소(lctnAddr)로 주소 기반 자료와도 연결한다.
description_portal: 이 API는 공정거래위원회에서 제공하는 가맹정보_시도별 가맹본부현황입니다. 가맹사업기준년도(필수), 시도명(선택) 값을 입력하여 가맹사업기준년도, 가맹본부관리번호, 회사명, 사업자등록번호, 법인등록번호, 대표자명, 개인법인구분명, 전화번호, 소재지주소, 시도명 등의 데이터로 구성된 가맹본부현황을 조회할 수 있습니다.
