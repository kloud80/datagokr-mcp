description_portal: '세종특별자치시시설관리공단은 자연장지의 위치 체계를 체계적으로 관리하고, 시민이 자연장 위치 구조를 명확하게 이해할 수 있도록 자연장 위치 횡렬관리 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 자연장지 내 행(row) 단위의 구성 정보와 해당 행의 열(column) 배치 특성을 관리하기 위해 구축되었습니다.■ 데이터 컬럼 구성자연장구분 - 자연장의 종류 구분    예: 잔디장, 수목장 도심형, 수목장 산림형 등자연장구역구분 - 자연장지 내 구역을 식별하는 구역 코드 또는 구분 값행번호 - 자연장지 내 가로 방향(행·Row)에 해당하는 번호최대열 - 해당 행에서 사용 가능한 열(Column)의 최대 개수 - 자연장지 좌표 구조를 이해하는 핵심 값행_시작지정번호 - 해당 행의 열 번호 시작값 - 열 번호가 1부터가 아닌 특정 번호로 시작될 경우 사용행_번호증가치 - 열 번호 증가 간격    예: 1씩 증가, 2씩 증가 등행명칭 - 행을 식별하기 위한 이름(예: A행, B행 등) - 이용자 안내 및 유지관리 시 활용되는 표시 정보■ 데이터 제공 목적자연장 위치 횡렬관리 데이터는 다음의 목적을 위해 제공됩니다. - 자연장지의 행·열 구조를 명확하게 관리하여 시설 운영 효율성 향상 - 위치 좌표 체계 공개를 통한 시민 정보 접근성 및 안내 정확성 강화 - 자연장 위치 배치도(맵) 구성의 기반 데이터로 활용 - 구역·행·열 단위의 세부 관리체계 확립을 통한 장사행정 고도화세종특별자치시시설관리공단은 자연장지 운영의 투명성 확보와 시민 편의를 위해 해당 데이터를 지속적으로 갱신·제공하고 있습니다.'
