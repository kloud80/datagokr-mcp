summary_user: SGIS 도시화분석지도의 사업체 통계로, UN 도시분류 기준으로 나눈 도시화지역별·시군구별(전국)로 산업분류 1·3·5단계 이름에 따른 사업체수와 종업원수를 집계해 담는다. 연구자나 지역정책 분석가가 '도시 중심지와 준도시·농촌 지역 사이에 어떤 업종의 사업체와 일자리가 몰려 있는가'를 비교할 때 쓴다. 실측 컬럼에 행정구역코드 같은 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명과 산업분류명을 이름으로 맞춰 이어 써야 하며, 같은 SGIS 도시화분석지도의 인구·격자 자료와 함께 보는 것이 자연스럽다.
limits: 행정구역 코드가 없어 다른 통계와 붙일 때 시군구 이름 표기 차이를 직접 맞춰야 한다. 단위가 시군구·도시화지역 집계이므로 개별 사업체나 격자 단위 위치는 알 수 없다.
