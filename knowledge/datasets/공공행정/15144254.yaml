description_portal: '[SGIS 오픈 플랫폼] "도시화분석지도" 서비스의 사업체 데이터입니다.도시화지역명,시도명,시군구명,산업분류1명,산업분류3명,산업분류5명,사업체수,종업원수를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 도시화분석지도   ‘UN 도시분류’ 기준을 적용한 인구변화에 따른 도시화 권역의 변화 모습과 격자 통계정보 및 분석 지표를 제공하는 서비스.  - UN의 도시분류 기준의 공식화: 유럽연합, 유엔 인간거주계획, 세계은행 등 6개 국제기구가 도시 기준을 표준화하기 위해 만든 도시 개념을 "20년 UN 통계위원회에서 공식 채택'
