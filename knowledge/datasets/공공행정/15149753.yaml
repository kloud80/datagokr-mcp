description_portal: 청계천에서 일자별로 집계한 단속 건수 데이터입니다.파일데이터에서 일자별 음주·흡연, 노점상, 자전거·인라인, 노숙자, 전단지, 오토바이, 동물동반, 방뇨, 현수막, 기타 등의 건수 데이터를 확인할 수 있습니다.- 음주·흡연 관련 데이터는 2021년 5월을 기준으로 이전과 이후의 집계 방식이 상이합니다. 2021년 5월 이전에는 음주와 흡연이 합산되어 집계되었으며, 2021년 5월 이후부터는 각각 별도로 집계됩니다.음주·흡연 건수 데이터는 2021년 5월 이전까지의 자료를 의미합니다.음주 건수 데이터는 2021년 5월 이후의 자료입니다.흡연 건수 데이터는 2021년 5월 이후의 자료입니다.- 자전거·인라인 관련 데이터는 2022년 7월을 기준으로 이전과 이후의 집계 방식이 상이합니다. 2022년 7월 이전에는 자전거와 인라인이 합산되어 집계되었으며, 2022년 7월 이후부터는 각각 별도로 집계됩니다.자전거·인라인 건수 데이터는 2022년 7월 이전까지의 자료입니다.자전거 건수 데이터는 2022년 7월 이후의 자료입니다.인라인 건수 데이터는 2022년 7월 이후의 자료입니다.- 전단지, 오토바이, 동물동반, 방뇨, 현수막 관련 건수 데이터는 2022년 7월 이후부터 집계된 자료입니다.
