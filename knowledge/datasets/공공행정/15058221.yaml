summary_user: 특별시·광역시·도 단위 교육비특별회계의 회계연도별 세입·세출 결산액을 자치단체와 구분(세입/세출)·과목별로 담은 집계 데이터이며, 포털 설명상 2022 회계연도부터 제공되고 범위는 전국이다. 교육재정 분석가나 시민이 '우리 시·도 교육비특별회계는 어떤 수입으로 얼마를 걷고 어디에 얼마를 썼나'를 연도별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치단체 코드·이름(laf_cd 등)이나 같은 지방재정365 계열 데이터의 기관 코드로만 맞춰 연결한다.
description_portal: 지방자치단체의 교육비특별회계는 지방교육재정의 독립성과 효율성을 확보하기 위해 설치되며, 교육에 대한 안정적이고 투명한 재정지원을 위해 지방교육재정교부금법 제12조(교육비특별회계의 설치)에 의해 의무적으로 설치하여 일반회계와 분리하여 운영되고 있습니다.교육비특별회계 세입세출결산 정보는 특별시, 광역시, 도 단위의 각 회계연도별 교육비특별회계에 대한 세입과 세출 결산액 정보를 제공합니다.교육비특별회계 세입세출결산 정보는 2022 회계연도부터 정보가 제공되고 있습니다.
