description_portal: 시민과 함께하는 투명한 경영, 부산도시공사의 연간 수의계약 현황입니다. 본 자료는 공사, 용역, 물품 등 대상별로 체결된 계약의 상세 내역을 제공합니다. 개별 계약명과 계약일자, 집행금액은 물론, ‘지방계약법 시행령’ 등 관련 법규에 따른 수의계약 사유와 근거까지 구체적으로 명시하였습니다. 이는 계약 행정의 모든 과정을 투명하게 공개하여 공정성과 책임성을 강화하고, 시민 여러분의 알 권리를 보장하며 공기업으로서의 신뢰를 높이기 위한 노력의 일환입니다. 예산 집행의 모든 단계를 시민과 함께 감독받겠습니다.
