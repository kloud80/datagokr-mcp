summary_user: 한국남부발전이 공공데이터포털에 개방하는 데이터 목록을 목록명 한 건당 한 행으로 정리한 메타 파일로, 각 목록의 구분·최근수정일·개방여부·데이터구분을 담는다(CSV 약 19.8KB). 분석가나 국민이 '남부발전이 계약 현황이나 태양광 출자회사 발전정보 같은 데이터를 개방하고 있는지, 언제 마지막으로 수정됐는지'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 목록명(이름) 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 한국남부발전이 공공데이터 포털을 통해 개방하는 데이터 목록을 정리한 자료입니다. 문서정보 목록, 계약 체결 현황, 태양광 발전 출자회사 발전정보, 기부금 현황, 본사 북카페 도서 현황 등 다양한 주제의 데이터가 포함되어 있으며, 각 데이터의 최근 수정일, 개방 여부, 데이터 구분이 함께 제공됩니다. 이를 통해 국민은 기관이 어떤 정보를 개방하고 있는지 한눈에 파악할 수 있으며, 필요한 데이터를 손쉽게 검색하고 활용할 수 있습니다. 또한 연구자, 기업, 학생 등 다양한 이용자가 데이터 기반 분석과 서비스 개발에 참고할 수 있는 기초 자료로 활용 가능하며, 공공기관의 투명성 제고와 정보공개 확대에도 기여합니다.
