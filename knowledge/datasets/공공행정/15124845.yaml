description_portal: 한국남부발전(주)의 광고비 집행 현황을 기록한 자료로, 광고 매체(신문, 방송, 잡지, 인터넷, 기타), 집행 기간, 광고 방법, 집행 금액(천원 단위), 비고란 등으로 구성되어 있습니다. 예산은 언론진흥재단을 통한 의뢰 방식으로 주로 집행되며, 각 매체별로 사용된 금액이 명시되어 있어 공공기관의 홍보 활동과 관련된 예산 운용 내역을 투명하게 확인할 수 있습니다. 예를 들어 2020년 한 해 동안 신문광고에 가장 많은 예산이 집행되었고, 인터넷·지하철 옥외광고 등 다양한 채널이 활용되었음을 알 수 있습니다. 이 자료는 시민들이 공공기관의 광고비 집행 실태를 쉽게 이해할 수 있도록 돕고, 예산 집행의 공정성과 효율성을 점검하는 데 활용될 수 있습니다. 정책 결정자, 연구자, 언론 관계자 등에게도 유용한 참고자료가 될 수 있습니다.
