summary_user: 한국자산관리공사가 위탁개발한 공공개발부동산(나라키움 건물 등)의 건물별 시설현황으로, 건물명·주용도·소재지 주소·지상/지하 층수·구조·준공일자·대지/건축/전체면적·주차대수·승강기대수를 건물 단위로 전국 범위에서 담는다. 국유재산 활용을 분석하는 연구자나 공공시설 입주·이용을 검토하는 기관이 특정 지역 공공개발 건물의 규모와 준공 시점, 주차·승강기 여건을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소(CLTR_LCTN_ADR)나 건물명을 매칭하거나 같은 기관의 다른 국유재산 데이터와 이름으로 이어 써야 한다.
description_portal: 한국자산관리공사에서 관리하는 공공개발부동산의 시설정보(규모, 준공일자, 면적, 주차대수, 승강기수)를 제공합니다.정부의 국유지 관리 방향이 보존에서 활용으로 변화함에 따라 캠코는 국유재산의 위탁개발을 통해 국유재산의 가치를 높이고 있습니다. 저활용 행정재산이나 유휴일반재산을 대상으로 국가 필요시설과 민관복합건물을 개발하여 재정건전성을 높이고 정책사업을 효율적으로 지원하고 있습니다.국유재산 개발은 위와 같은 정량적인 재산의 가치증가 뿐만 아니라 국유재산에 대한 인식 전환에도 기여하고 있습니다. 노후화되어 지역 경제 활성화에 저해가 되거나 쓰레기 집단 투하장 등으로 방치되던 국유재산은 주변 환경과 조화되는 새로운 재산으로 탈바꿈되고 있으며, 대국민공모를 통해 선정된 '나라키움'이라는 명칭을 개발 완료 건마다 일체감 있게 부여하여 국유재산 개발의 정성적인 가치 또한 증대시키고 있습니다.
