description_portal: 본 데이터는 한국도로교통공단이 운전면허 학과시험 이해를 돕기 위해 만든 중국어 용어 해설 목록이다. 필드는 한국어 표제어, 중국어 번역(간체/번체), 주제분류(법규·표지·신호·차량장치 등), 정의·설명, 예문, 유의·동의어, 비고 등으로 구성된다. 각 항목은 문항 해석, 교육자료 제작, 다국어 안내문 작성, 번역 점검, 질의응답 사전 구축에 활용한다. 개인정보는 포함하지 않으며 표기 규칙과 분류 체계를 통일해 기계처리에 적합하다. 동일 스키마로 제공되어 분야·주제 기준의 검색·필터링과 키워드 색인, 용어 관계 분석이 용이하다. 요약하면 중국어 사용자 대상의 운전면허 핵심 용어를 표준화하여 학습 효율과 민원 안내의 명확성을 높이는 참고 사전이다.
