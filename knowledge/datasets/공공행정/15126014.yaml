summary_user: 역대 국회(대수, ERACO)별로 정당마다 시도별 지역구 의원 수와 전국구·비례대표 의원 수, 합계를 담은 집계표로, 범위는 전국이며 지도 좌표가 없는 비공간 데이터다. 정치학 연구자나 기자가 '특정 정당의 의석이 역대 국회에서 어느 시도에 몰렸고 어떻게 바뀌었나'를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 의원·선거 데이터와는 국회 대수(UNIT_CD)나 정당명·시도명을 이름으로 맞춰 연결해야 한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
