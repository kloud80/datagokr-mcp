description_portal: 주식회사한국중소벤처기업유통원에서는 다양한 지원사업을 운영 및 관리하는 가운데 공공구매종합정보망(SMPP)를 운영중에 있습니다.공공구매종합정보망의 경우 판로지원법에 의거 공공기관 및 중소기업 상호 간에 필요한 정보를 양방향으로 제공하여 공공기관의 공공구매 효율성 제고와 구매 촉진을 지원하는 시스템으로 중소기업의 원활한 공공조달시장 진출을 위한 공공판로 지원 대표 포털 사이트입니다.본 데이터는 우선구매제품에 해당되며 공공구매정보망에서 취급하는 19종의 기술개발제품 현황 데이터를 제공합니다. 인증구분, 인증번호, 인증제품명, 업체명, 사업자등록번호, 인증일, 만료일 등을 제공합니다.
