summary_user: 전국 지방자치단체의 지방보조금비율을 연도별·자치단체별로 담은 집계 지표로, 보조금액(lsa_amt), 비교 기준 금액, 비율이 함께 들어 있습니다. 지방재정 분석가나 주민은 우리 시·군·구의 예산 가운데 보조금이 차지하는 비중이 다른 지자체보다 높은지 확인하는 데 쓴다. 광역·기초 자치단체 코드와 이름이 들어 있지만 전역 조인 키는 확인되지 않아, 같은 지방재정365의 다른 지표와 자치단체 코드로 잇거나 다른 기관 데이터와는 이름·코드 매핑으로 연결한다.
description_portal: 지방보조금비율은 지방자치단체가 자체적으로 수입을 확보하는 비율에 비해서, 정부로부터 지원을 받는 보조금의 비율을 나타내는 지표입니다. 지방보조금비율은 지방자치단체의 재정 자립도를 평가하는 데 중요한 기준이 됩니다. 지방보조금비율이 높으면 해당 지방자치단체는 외부 지원에 의존하는 경향이 강합니다.자주 의존적 재정 구조를 나타냅니다. 반면, 지방보조금 비율이 낮다면 자립적인 재정 운용을 잘하고 있다는 것으로 지방자치단체의 재정 건정성과 독립성을 나타낼 수 있습니다.
