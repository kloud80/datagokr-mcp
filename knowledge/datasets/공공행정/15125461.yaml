summary_user: 가맹본부의 특수관계인이 운영하는 가맹사업을 기준년도·가맹본부관리번호별로 한 건씩 담아, 특수관계인과의 관계, 상호, 경영방법, 경영기간, 가맹사업 내용을 전국 범위로 제공한다. 가맹 창업을 준비하는 사람이 '이 가맹본부의 특수관계인이 어떤 다른 가맹사업을 얼마나 운영해 왔나'를 확인해 본부를 믿어도 되는지 판단하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 공정위 가맹정보 서비스들과는 가맹본부관리번호와 기준년도로, 그 밖의 데이터와는 상호명 매핑으로만 잇는다.
limits: 사업자등록번호·법인등록번호 같은 전역 키가 없어 기업집단·특수판매·상조 등 다른 공정위 등록 데이터와 바로 묶이지 않고, 이름 매핑에 기대야 한다. 조회에는 기준년도와 가맹본부관리번호가 필요하며, 개발계정은 하루 10,000회로 제한된다.
