summary_user: 경기도 경기통계시스템에 수록된 통계 간행물 목록을 간행물 한 건 단위로 담으며, 제작 조직번호, 간행물명, 최초 발간 시점인 설립연도로 구성된다. 연구자나 통계 담당자가 '경기도에서 가축통계나 보건지표 같은 주제별 통계자료를 어느 기관이 언제부터 발간해 왔는가'를 확인해 시계열 자료 확보 가능성을 판단할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 간행물명 매핑이나 같은 기관의 조직번호(orgnzt_no)로만 이어 쓸 수 있다.
description_portal: '이 데이터는 경기도 경기통계시스템에 수록된 간행물 정보를 정리한 자료로, 간행물을 제작한 조직번호, 간행물명, 설립연도 등의 항목으로 구성되어 있습니다. 간행물에는 지역별 통계연보, 전문 주제별 통계자료(예: 가축통계, 중소기업정보화수준평가, 보건지표 등)가 포함되며, 각 기관의 통계 발간 현황을 확인할 수 있습니다. 설립연도는 해당 간행물의 최초 발간 시점을 의미하며, 이를 통해 간행물의 발간 지속성, 시계열 분석 가능성 등을 판단할 수 있습니다. 본 데이터는 통계 발간자료 관리, 지역별·기관별 통계 간행 현황 분석, 통계정보 서비스 개선, 메타데이터 정비 등에 활용됩니다.'
