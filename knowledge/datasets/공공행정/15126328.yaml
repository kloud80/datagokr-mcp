summary_user: 전국 다단계판매사업자 수를 기준년월·시도·시군구·영업상태별로 집계하고, 자본금 규모 구간(1억원 이하부터 20억 초과, 정보없음까지)별 업체 수와 총사업자수를 함께 담은 통계 데이터다. 정책 담당자나 분석가가 "우리 지역 다단계판매사업자는 몇 곳이고 자본금 규모 분포가 어떻게 변하고 있나" 같은 지역별·월별 추이를 볼 때 쓴다. 사업자등록번호 같은 전역 조인 키가 없어 개별 사업자 등록정보와는 직접 연결되지 않으며, 시도명·시군구명 이름 매칭으로 다른 지역 통계와 맞춰 쓴다.
description_portal: 다단계판매사업자에 대한 월별, 지역별, 자본금규모별, 영업상태별 사업자 수 통계를 제공하는 서비스 통계표 다단계판매사업자 자본금 규모 업체 현황 - 월별, 지역별 작성목적 월별 자본금규모 통계 추이 작성주기 매월 조사대상 다단계판매사업자
