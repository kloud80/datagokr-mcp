description_portal: '○ 통계개요* 통계명 : 특정사망원인별 사망확률* 통계종류 : 통계법 제18조 규정에 의해 승인된 일반통계(승인번호 101035)* 작성목적 : 현재의 사망 수준이 그대로 지속된다는 가정하에서 몇세까지 살수 있는가를정리하여 장래인구 추계에 활용하고 보건ㆍ의료정책 등의 수립을 위한기초자료를 제공하는 것을 목적으로 함* 작성체계 : 기초자료수집→인구동태신고자료보정→연령별사망률산출→연령별사망확률산출→정지인구산출→생존률산출→총생존자수산출→기대여명산출* 공표주기 : 부정기(3년 주기)* 공표범위 : 지역 - 서울시내용 - 악성신생물, 순환기계통질환, 사망의 외인 등의 사망확률 등○ 용어설명* 생명표 : 현재의 연령별 사망 수준이 그대로 지속된다는 가정하에, 특정한 출생코호트가연령이 많아짐에 따라 소멸되어 가는 과정을 정리한 표. 어떤 연령층의 인구가주어진 사망력의 유형과 수준이 그대로 적용된다는 가정 하에 평균적으로 더살 수 있는 기간, 연령별 사망확률, 특정연령의 사람이 다른 연령까지 생존할수 있는 확률 등을 나타냄* 특정사인별 사망확률 : 특정연령 x세인 사람이 특정사인으로 사망하게 될 확률* 증가기대여명 : 특정사인제거시 증가기대여명으로, 특정사인을 예방하거나 퇴치함으로써 그 사인으로 사망하지 않고, 이후 다른 사인으로 사망함으로써 사망시기가 연장되어 증가되는 기대여명으로, 특정사인으로 인해 감소되는기대수명과 같은 의미○ 기 타* 시도별 자료는 3년주기로 생산됨("05, "08, "11, "14), 전국은 1년주기* 전국 생명표가 2016.12.2. 갱신됨에 따라 시도별 생명표도 2017.3.31. 갱신됨으로 사용에유의바람○ 출 처 : 통계청 인구동향과 「생명표」 _ 시도별 생명표'
