summary_user: 한국광해광업공단의 사규(내규)를 조항 하나당 한 행으로 담은 파일로, 규정 식별자(사규아이디)·내규명·조번호·조제목·조내용을 기록하며 CSV 약 39KB 규모입니다. 공단과 거래하거나 협업하는 사업자, 내부 규정을 비교하는 분석가가 '이 공단의 특정 규정에서 해당 조항은 무엇을 정하고 있나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 내규명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓰고, 묶음 안에서는 사규아이디로 조항들을 한 규정으로 모은다.
