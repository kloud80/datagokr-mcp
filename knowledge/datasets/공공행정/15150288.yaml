description_portal: “사규정보” 데이터셋은 조직 내 규칙(사규 또는 내규)의 조문별 내용을 체계적으로 관리하기 위한 자료입니다. 각 행은 하나의 조항으로 구성되며, 사규아이디로 전체 규칙을 구분하고, 내규명으로 해당 규칙의 명칭을, 조번호로 조항의 위치를, 조제목으로 조항의 주제를 요약하며, 조내용으로 조항의 구체적 규정 사항을 기록합니다. 이 데이터는 조직 내부 규정의 검색 및 참조, 조항 간 비교, 준수 여부 확인, 내규 개정 이력 관리 등에 활용될 수 있습니다. 규정의 명확성 확보 및 내부 통제 체계를 강화하는 데 기여하며, 외부 공개가 가능한 경우 투명성 제고에도 도움이 됩니다.
