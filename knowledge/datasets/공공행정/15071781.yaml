summary_user: 서울시 종합휴양업(리조트 등 숙박·음식점시설과 전문휴양·종합유원시설을 함께 갖춘 업소)의 인허가 정보를 업소 단위 원장으로 담으며, 인허가·취소일자, 영업상태, 소재지 주소, 중부원점TM 좌표, 시설 규모 항목을 포함한다. 사업자나 상권 분석가가 서울 안에서 영업 중이거나 폐업한 종합휴양업소가 어디에 있고 언제 인허가됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 원본인 지방행정 인허가(LOCALDATA) 자료와는 관리번호(MGTNO)·개방자치단체코드로, 다른 데이터와는 주소·업소명 매칭으로 잇는다.
description_portal: '해당 데이터는 서울시 종합휴양업 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.리조트 등 숙박시설 또는 음식점시설을 갖추고 전문휴양시설 중 두 종류 이상의 시설을 갖추거나, 한 종류 이상의 시설과 종합유원시설업의 시설을 갖추어 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
