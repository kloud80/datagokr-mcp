summary_user: 국회사무처가 공개하는 국회 시청각자료 목록으로, 회의 단위로 회의 식별값(CONF_ID)·대수·회기·차수와 파일 내용, 내려받기 주소를 건별로 담는다. 의정활동을 살피는 국민이나 분석가가 특정 대수·회기의 회의 영상·음성 자료가 있는지 찾고 내려받을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의정활동 데이터(회의록·의안 등)와는 대수·회기·차수나 회의 식별값을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
