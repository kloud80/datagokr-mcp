description_portal: 아래 자료는 용인도시공사가 각종 시설 운영 및 행정업무 수행 과정에서 시민 및 이용자에게 필요한 정보 제공, 공지사항 전달, 일정 안내 등을 위해 발송한 문자(SMS, LMS, MMS)의 월별 발송 이력을 정리한 것입니다. 문자 유형별(SMS, LMS, MMS)뿐 아니라 통신사별(SKT, LGU+, KT, 기타)로도 구분하여 구성하였으며, 이를 통해 통신사별 발송 비중과 유형별 활용 현황을 함께 파악할 수 있도록 하였습니다. 본 자료는 2019년 5월부터의 누적 데이터를 기준으로 하며, 각 월별 발송 건수와 유형에 따른 추이를 확인할 수 있는 참고자료로 활용 가능합니다.
