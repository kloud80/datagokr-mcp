summary_user: 온비드에 등록된 공매 물건의 입찰결과를 물건·공매조건 건별로 담은 목록으로, 물건명·재산유형(압류·국유·공유재산 등)·처분방식(매각·임대)·감정평가금액·최저입찰가격·낙찰가격·낙찰가율·유효입찰자수와 자동차 물건의 주행거리·연식 등을 포함하며 범위는 전국이다. 공매 참여를 고민하는 개인·사업자나 분석가가 "특정 기간에 개찰된 국유재산 토지는 감정가 대비 몇 %에 낙찰됐나" 같은 질문에 쓴다. 물건관리번호(cltrMngNo)와 공매조건번호(pbctCdtnNo)를 함께 넣어 온비드 물건 입찰결과상세 조회 서비스로 이어 쓰며, 실측 기준 다른 데이터와 잇는 전역 조인 키는 없어 용도분류·재산유형 코드나 이름 매핑으로만 연결한다.
limits: 물건유형·재산유형 코드와 개찰일 시작·종료일자가 필수이고 종료일자는 현재 이전으로만 조회되며, 검증 호출에서는 0행을 받아 실제 반환 내용과 규모는 확인되지 않았다. 주소·좌표 수준의 개별 물건이지만 지번(PNU) 같은 전역 키가 실측 컬럼에 없어 토지·건축물 데이터와 직접 조인하기 어렵다. 개발계정은 일 1,000회로 호출이 제한된다.
