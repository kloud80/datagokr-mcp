description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지에 등록된 공매 물건에 대한 입찰 결과 목록을 조회하는 서비스입니다. 이용자는 물건유형, 입찰방식, 입찰결과 등의 조건에 따른 물건명, 감정평가금액, 낙찰가격 등 정보를 조회할 수 있습니다. 본 서비스에서 조회된 물건관리번호(cltrMngNo), 공매조건번호(pbctCdtnNo)로 온비드 물건 입찰결과상세 조회 서비스를 조회하시면 더 상세한 정보를 조회 가능합니다. 필수 검색 조건 : 물건유형코드(cltrTypeCd), 재산유형코드(prptDivCd), 개찰일_시작일자(opbdDtStart), 개찰일_종료일자(opbdDtEnd) (※ 개찰일_종료일자(opbdDtEnd)는 현재 이전 시점으로만 조회됩니다)'
