description_portal: 서울시 인사발령 정보 데이터는 서울시 공무원 인사발령 관련 게시글의 메타정보와 내용을 관리하기 위한 자료입니다. 게시물 아이디와 제목, 작성일자, 최종수정일자는 각 인사발령 공지의 식별과 변경 이력을 확인하기 위한 기본 항목입니다. 담당기관과 담당부서는 인사발령 공지를 등록·관리하는 조직을 나타내며, 전화번호와 이메일은 문의가 필요할 때 연락할 수 있는 창구 정보입니다. 내용에는 인사발령 대상자, 발령 직위, 소속, 발령일 등 구체적인 인사 사항이 포함되며, 게시 시작일과 종료일, 신규 게시물 여부는 공지의 게재 기간과 노출 상태를 관리하는 데 활용됩니다. 또한 첨부파일 개수, 파일명, 파일크기, 첨부파일 주소 등은 인사발령 상세 내역 공문이나 관련 문서를 내려받을 수 있도록 지원하는 파일 관리용 정보입니다.
