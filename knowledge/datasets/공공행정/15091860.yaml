summary_user: 농식품공공데이터포털에 개방된 검역 관련 데이터를 데이터셋·데이터 단위로 나열한 메타데이터 목록으로, 데이터셋명·설명·제공기관·담당자·키워드·이용허락범위·업데이트 주기·제공 형태(그리드·오픈API·파일·지도 등)를 전국 단위 비공간 자료로 담는다. 수출입 기업이나 분석가가 '농식품 검역 분야에 어떤 데이터가 어떤 형태로 열려 있고 담당자는 누구인가'를 확인하고 필요한 원천 데이터를 고를 때 쓴다. 전역 조인 키는 없어 데이터명이나 링크·공공데이터포털 주소(공공데이터포털URL)로 실제 데이터셋을 찾아가는 색인으로 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방된 검역 데이터 목록은 검역에 필요한 다양한 정보를 체계적으로 관리하기 위한 데이터셋을 제공합니다. 이 데이터셋은 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자 권리 포함 여부, 상위 분류, 제3자 권리, 이용 허락 범위, 업데이트 주기, 서비스 유형과 같은 여러 정보를 포함하고 있습니다. 이 데이터는 농림수산물의 수출입과 관련하여 검역을 수행하는 데 유용하며, 수출입 기업이나 농업 관련 기관에서 해당 데이터를 참고하여 품질 관리 및 규제를 준수하는 데 활용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형): 고유 데이터셋 식별자, 데이터셋명(문자형): 데이터셋의 명칭, 데이터셋설명(문자형): 데이터셋의 구체적 설명, 기관명(문자형): 데이터 제공 기관의 이름, 담당자명(문자형): 데이터 담당자의 이름, 전화번호(숫자형): 담당자의 연락처, 키워드(문자형): 데이터와 관련된 키워드, 기타 유의사항(문자형): 데이터 이용 시 유의해야 할 사항, 등록일(날짜형): 데이터 등록 날짜, 데이터ID(문자형): 개별 데이터의 고유 식별자, 데이터명(문자형): 특정 데이터의 명칭, 데이터설명(문자형): 특정 데이터의 상세 설명, 제3자 권리 포함 유무(문자형): 데이터의 제3자 권리 여부, 상위 분류(문자형): 데이터의 분류항목, 제3자 권리(문자형): 데이터에 대한 권리 정보, 이용 허락 범위(문자형): 데이터의 이용 가능 범위, 업데이트 주기(문자형): 데이터의 갱신 주기, 서비스 유형(문자형): 데이터 제공 방법입니다.'
