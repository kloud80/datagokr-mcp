summary_user: 조달청 혁신장터의 혁신시제품 지정 신청 내역을 신청 건별로 담은 전국 단위 CSV 파일로, 공고(연도·회차)별 제안 분야, 신청 제목, 혁신·용도 내용, 개발단계, 산업기술분류, 지식재산권·기술인력 수 같은 항목을 포함한다. 혁신제품 지정 제도를 준비하는 기업이 어떤 분야와 기술 수준의 시제품이 신청되는지 살피거나, 분석가가 산업기술분야별 혁신시제품 신청 동향을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 사업자번호·세부물품분류번호·산업기술분류코드를 이름·코드 매핑으로 맞춰 나라장터 조달 데이터 등 같은 기관 데이터와 이어 쓴다.
description_portal: '○ 혁신시제품1. 공급자 제안형  - 공급자제안형 신청분야 : 혁신성장 지원 분야, 국민생활문제 해결 분야, 정책지원분야에 제시된 상세항목에서 해당 항목 1개 신청(중복신청금지)  - 혁신제품 추천위원(스카우터) 추천제품 신청분야 : 시급성 및 정부정책과의 시너지 효과 창출 위한 분야 및 공급자제안형 중 지정 건수가 저조한 분야를 제품 추천 시 스카우터*에게 별도 공지    * 스카우터는 민간시장과 접촉면이 넓어 기존 조달시장 밖의 제품·기업을 발굴할 수 있는 전문가를 위촉    ※ 개별 기업이 별도로 사전에 신청을 진행하지 않으며, 스카우터 추천 이후 사전심사(적합성평가 및 혁신성평가)와 데모데이(국민평가단 참석 발표심사 형식)를 거쳐 최종 추천 제품으로 선정된 제품(기업)만 지정 신청 대상이 됨2. 수요자 제안형  - 공공기관 제안 도전적 수요 과제 : 공공기관으로부터 과제를 공모하여 대상 과제를 정하고, 정해진 과제에 대한 문제해결 제품 공모  - 공공수요 숙성지원(인큐베이팅) 과제 : 수요기관ㆍ기업ㆍ국민들이 제안한 아이디어 차원의 공공수요를 실행 가능한 수준의 과제로 구체화하는 제도3. 지정대상  - 적용된 핵심기술이 기술개발단계(TRL) 7~9 에 이르는 상용화 이전 단계 의 혁신 솔루션(제품, 제품+서비스)으로 시범사용 (최대 1년) 내 기술혁신 성능 확인이 가능한 제품'
