summary_user: 법제처 지능형 법령정보 지식베이스에서 일상용어 목록을 용어 단위로 담고, 일상용어마다 출처와 연관 법령용어로 이어지는 관계 링크를 XML로 제공하는 전국 범위의 비공간 데이터다. 국민이나 행정 실무자가 '전세금을 법률에서는 어떤 용어로 부르는가'처럼 익숙한 표현에 해당하는 법령용어와 그 정의·관련 조문을 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 일상용어명이나 용어간관계링크를 통한 이름 매핑, 또는 같은 법제처 법령용어 조회 서비스와의 연계로만 이어 쓴다.
description_portal: 지능형 법령정보 지식베이스 일상용어 목록을 XML 데이터로 제공 받으실 수 있는 일상용어 정보 목록 조회 서비스입니다. 이 데이터는 일상용어를 입력하면 해당 용어와 연관된 법령용어를 제시하고, 각각의 정의, 설명, 사용 사례 및 연결된 조문 정보를 함께 제공합니다. 이를 통해 이용자는 익숙한 일상 표현을 기반으로 법률 용어의 의미와 용례를 자연스럽게 습득할 수 있습니다. 또한 유사한 의미를 가진 다수의 법령용어를 비교하고, 관련 조문 간의 맥락을 파악하는 데 유용하게 활용됩니다. 본 데이터는 법령 접근성 향상, 용어 해석의 정확성 제고, 법제 교육 및 행정 실무 지원 등에 효과적으로 사용됩니다.
