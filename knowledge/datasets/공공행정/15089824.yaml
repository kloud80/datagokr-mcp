description_portal: '데이터 개요본 데이터는 2022년 8월 19일 기준 연구개발특구진흥재단 사업관리시스템에서 제공하는 사업공고 현황 자료입니다.연구개발특구 내에서 추진되는 다양한 사업 공고 정보를 포함하고 있으며, 주요 항목으로는 사업식별자, 사업명 등이 제공됩니다.데이터 항목본 데이터가 보유한 세부 칼럼은 다음과 같습니다.순번 : 공고 데이터 식별을 위한 일련번호사업식별자 : 사업별 고유 식별 코드사업명 : 해당 사업의 명칭활용 방법연구개발특구 내 사업별 공고 현황 파악에 활용될 수 있습니다.유의 사항본 데이터는 2022년 8월 19일 기준으로 제공된 것으로, 이후 공고된 과제 또는 변경 사항은 반영되지 않을 수 있습니다.'
