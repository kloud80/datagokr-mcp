summary_user: 국회 위원회 회의 한 건마다 대수, 회의일자, 회의 차수, 위원회명, 회의 제목과 안건(부의안건) 정보를 담고, 영상·회의록·PDF로 가는 링크를 함께 제공하는 건별 목록이며 범위는 전국·비공간이다. 시민이나 분석가가 '특정 위원회가 언제 어떤 안건을 다뤘고 그 회의록 원문은 어디서 보나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 의안·표결 데이터와는 대수(DAE_NUM)·위원회명·회의일자·안건명 같은 이름·코드 매핑으로만 이어 쓴다.
