summary_user: 헌법재판소가 선고한 결정례의 목록을 건별로 담는 법제처 외부 API로, 사건번호·사건명·종국일자·헌재결정례일련번호·상세링크 필드를 제공한다. 위헌 여부나 헌법소원 결과가 궁금한 연구자·법률 실무자가 특정 사건의 결정례를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사건명 매핑이나 같은 기관(법제처) 코드로만 잇고, 상세 내용은 상세링크를 따라 확인한다.
limits: open.law.go.kr 인증키(OC 파라미터)가 필요하며 포털 활용신청과는 별개이다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터셋과 자동 연결은 어렵고, 결정례는 등록 시점 이후의 것이 가치를 갖는 데이터이다.
