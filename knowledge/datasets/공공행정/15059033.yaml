summary_user: 지방재정365에서 제공하는 기본경비비율 지표로, 회계연도(fyr)별로 지방자치단체(상위 단체·자치단체 코드와 이름)마다 금액 두 항목과 그 비율(rate)을 담은 전국 단위 집계 자료입니다. 분석가나 주민이 "우리 지자체의 예산 가운데 인건비를 뺀 일상 운영경비 비중이 다른 지자체보다 높은가"를 비교할 때 씁니다. 전역 조인 키는 없으므로 다른 지방재정365 지표와는 연도와 자치단체 코드·이름을 맞춰 연결합니다.
description_portal: 기본경비비율이란 행정기관이나 공공기관의ㅏ 전체 예산 또는 세출 중에서 기관의 일상적인 운영을 위해 사용되는 기본경비가 차지하는 비율을 의미한다.기본경비에는 인건비를 제외한 사무관리비, 공공요금, 여비, 소모성 자재 구입비, 유지보수비, 도서 및 자료 구입비 등 기관의 업무 수행에 필수적인 운영비용이 포함된다.이 비율은 조직의 행정운영 효율성을 판단하거나 에산의 구조적 건전성을 분석하는 데 활용된다.기본경비비율이 지나치게 높을 경우 실제 정책 사업이나 대민서비스보다는 기관의 자체 운영에 과도한 예산이 소요되고 있다는 것을 의미할 수 있으며, 이는 향후 예산편성 시 경비 조정이나 구조조정의 필요성을 제기하는 근거가 되기도 한다.
