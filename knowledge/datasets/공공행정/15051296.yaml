summary_user: 전북특별자치도 사회조사에서 주민이 참여하는 사교육 종류(학원 수강, 개인·그룹 과외, 유아원, 방문학습지, 유료 인터넷·통신강좌, 기타)를 다중응답으로 물어, 응답자 학력 등 구분별 참여 비율을 백분율로 정리한 집계표(CSV 730바이트)입니다. 교육 정책 담당자나 연구자가 '학력이 높은 집단일수록 학원보다 과외나 인터넷 강의를 더 많이 이용하는가' 같은 사교육 수요 차이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 자료와는 구분·상세구분 이름을 맞추거나 같은 전북 사회조사의 다른 항목 표와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 사회조사의 일환으로, 주민들이 참여하고 있는 사교육의 종류를 다중응답으로 조사한 결과 데이터입니다. 이 자료는 학원 수강, 개인 및 그룹 과외, 방문 학습지, 유료 인터넷 강의 등 다양한 사교육 분야별 참여율을 백분율로 보여줍니다. 특히, 응답자의 최종 학력 및 연령, 거주지역 등 인구통계학적 특성에 따라 선호하는 사교육 분야가 어떻게 다른지를 상세히 비교 분석할 수 있습니다. 교육 정책 입안자나 관련 연구자들은 이 데이터를 통해 과거 사교육 시장의 구조와 수요를 파악하고, 교육 격차 문제나 평생학습 트렌드를 연구하는 데 중요한 기초 자료로 활용할 수 있습니다.
