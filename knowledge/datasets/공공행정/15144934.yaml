description_portal: 공직자는 「부패방지 및 국민권익위원회의 설치와 운영에 관한 법률」제81조의2 및 같은 법 시행령 제88조의2에 따라 매년 1회 이상, 연 2시간 이상의 부패방지교육을 이수하여야 하며, 각 공공기관에서는 매년 전년도 부패방지교육 실시결과를 국민권익위원회에 제출하여야 합니다.청렴교육실적집계는 국민권익위원회로 제출된 각 기관의 2024년도 부패방지교육 이수율 실적으로 구성된 데이터입니다.청렴교육실적집계는 부패방지교육 대상이 되는 전체 공직자의 교육 이수율, 고위공직자의 교육 이수율, 신규자 및 승진자의 교육 이수율을 주요 내용으로 하고 있습니다.＊고위공직자, 신규자 및 승진자는 연 2시간 이상의 부패방지교육 중 1시간 이상을 대면 방식의 교육으로 이수하여야 함또한, 이수율 산출을 위한 교육 대상 인원 및 실제 이수자 수를 포함하여 데이터를 제공하고 있습니다.
