description_portal: '경기도 고양시 소독의무대상시설 데이터는 소독의무대상시설의 시설구분, 업소명, 소재지, 대표자성명 등의 항목을 제공합니다.<소독횟수 기준>1. 연 9회(4월부터 9월까지: 1회 / 1개월  , 10월부터 3월까지: 1회 / 2개월)- 「공중위생관리법」에 따른 숙박업소(객실 수 20실 이상), 관광숙박업소- 「식품위생법 시행령」에 따른 식품접객업소(연면적 300제곱미터 이상)- 「여객자동차 운수사업법」에 따른 시내버스, 농어촌버스, 마을버스, 시외버스, 전세버스, 장의자동차, 항공기와 공항시설, 여객선, 연면적 300제곱미터 이상 대합실, 여객운송 철도차량과 역사 및 역 시설- 「유통산업발전법」에 따른 대형마트, 전문점, 백화점, 쇼핑센터, 복합쇼핑몰, 그 밖의 대규모 점포, 전통시장- 종합병원, 병원, 요양병원, 치과병원 및 한방병원2. 연 5회(4월부터 9월까지: 1회 / 2개월  , 10월부터 3월까지: 1회 / 3개월)- 「식품위생법」에 따른 집단급식소(한번에 100명 이상에게 계속적으로 식사를 공급하는 경우)- 「식품위생법 시행령」에 따른 위탁급식영업을 하는 식품접객업소 중 연면적 300제곱미터 이상의 업소- 「건축법 시행령」에 따른 기숙사- 「소방시설 설치, 유지 및 안전관리에 관한  법률 시행령」에 따른 합숙소(50명 이상을 수용할 수 있는 경우)- 「공연법」에 따른 공연장(객석 수 300석 이상)- 「초,중등교육법」에 따른 학교- 「학원의 설립, 운영 및 과외교습에 관한 법률」에 따른 연면적 1천제곱미터 이상의 학원- 연면적 2천제곱미터 이상의 사무실용 건축물 및 복합용도의 건축물- 「영유아보육법」에 따른 어린이집 및 유치원(50명 이상을 수용)3. 연 3회(4월부터 9월까지: 1회 / 3개월  , 10월부터 3월까지: 1회 / 6개월)- 「주택법」에 따른 공동주택(300세대 이상)'
