description_portal: 전라남도 여수시의 불법주정차 위반 과태료 수납 현황에 대한 연도별 수납건수 및 수납금액 정보를 시민에게 공개함으로써, 세외수입 운영의 투명성을 확보하고 시민의 알권리를 보장하고자 함.본 데이터는 2017년부터 2025년까지 여수시에서 부과한 불법주정차 위반 과태료 중 실제 납부 완료된 건에 대한 연도별 수납건수 및 수납금액 현황을 집계한 자료로, 연도별 과태료 징수 실적과 세외수입 운영 현황을 확인할 수 있도록 구성되어 있음.자료에 포함된 수납건수는 「도로교통법」 등 관계 법령에 따라 부과된 불법주정차 과태료 중 납부가 완료되어 수납 처리된 건수를 의미하며, 수납금액은 해당 연도 기준 실제 수납 완료된 금액을 기준으로 산정한 자료임. 수납 유형에는 사전고지 자진납부, 본부과 납부, 독촉 이후 납부, 체납분 납부 등이 포함될 수 있음.또한 본 자료는 불법주정차 과태료의 실제 징수 현황을 시민에게 공개함으로써 지방재정 운영의 책임성과 신뢰성을 높이고, 세외수입 관리 현황에 대한 이해를 돕기 위한 기초자료로 활용될 수 있음. 아울러 교통질서 확립 정책, 주차행정 운영 분석, 체납관리 정책 수립 및 세외수입 재정 운영 분석 등을 위한 참고자료로도 활용 가능함.특히 연도별 수납 현황은 단속 건수 변화, 경기 여건, 체납 징수 활동, 주민신고제 운영 확대, 감액·취소 처리, 납부율 변동 등 다양한 행정적·사회적 요인에 따라 차이가 발생할 수 있으며, 특정 연도의 증감은 이러한 요인이 복합적으로 반영된 결과일 수 있음.제공되는 자료는 내부 세외수입 관리시스템 및 과태료 운영자료 등을 기준으로 작성된 통계자료이며, 이후 과오납 환급, 부과취소, 감액, 수납정정 등의 사유로 일부 수치가 변동될 수 있음. 또한 개인정보 및 개별 위반사항에 관한 세부 내용은 제외한 통계 형태로 제공하여 관련 법령에 따른 개인정보 보호사항을 준수함.
