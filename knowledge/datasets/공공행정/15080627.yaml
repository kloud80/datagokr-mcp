description_portal: 서울특별시에서 소유하고 있는 시유재산 데이터로 구분, 재산, 소재지, 지목, (연)면적, 재산관리관 정보를 포함합니다.주요 항목은 구분(자치구), 재산(토지·건물 등), 소재지, 지목, (연)면적, 재산관리관으로 구성되어 있습니다. 예를 들어 종로구의 경우, 청운동·신교동·궁정동 등 다양한 지역의 토지가 등록되어 있으며 지목은 ‘대(宅地)’가 다수를 차지합니다. 면적은 2~100㎡대 소규모부터 수백㎡ 이상의 대규모까지 다양하게 나타나며, 모든 재산은 “서울특별시 재무국 재산관리과”가 관리 주체로 명시되어 있습니다.이 데이터는 서울시가 직접 소유·관리하는 토지 및 건물의 위치와 규모를 확인할 수 있어, 공공자산의 효율적 활용, 재산 관리 정책 수립, 도시계획, 공공시설 입지 검토 등에 활용할 수 있습니다. 또한 자치구별 분포를 비교하면 특정 지역의 공공자산 밀집도와 특성을 파악할 수 있어, 지역 균형 발전 및 정책 의사결정에 기초 자료로 쓰일 수 있습니다.
