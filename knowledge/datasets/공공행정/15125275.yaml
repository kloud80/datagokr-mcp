summary_user: 고용보험심사위원회가 심의·의결한 결정문을 사건 한 건씩 목록으로 담으며, 건마다 결정문 일련번호·사건번호·사건명·의결일자·상세문서 링크가 붙는다. 실업급여 지급 제한이나 피보험자격 처분에 불복하려는 노동자·노무사가 비슷한 사건이 위원회에서 어떻게 결정됐는지 찾아볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사건번호나 사건명으로 맞춰 붙이고, 본문은 결정문 상세 링크(결정문일련번호)로 따로 조회한다.
description_portal: 법제처에서는 고용보험심사위원회가 심의·의결한 결정문의 목록을 제공하는 기능을 지원합니다. 이 목록은 각 결정문의 일련번호, 사건명, 사건번호, 의결일자 및 상세문서 링크를 포함합니다. 이를 통해 이용자는 고용보험 관련 심사 결과와 의사결정 현황을 체계적으로 확인할 수 있습니다. 데이터는 사건별로 구조화되어 있어 사건번호, 사건명 등을 기준으로 정렬 및 검색이 가능합니다. 또한, 의결일자를 이용한 정렬 기능을 통해 시의성 있는 의결 결과도 빠르게 파악할 수 있습니다. 본 목록은 고용보험 정책 연구, 법률분쟁 대비, 판례 분석 및 행정심판 관련 사례 검토 등 다양한 목적의 자료로 활용 가능합니다.
