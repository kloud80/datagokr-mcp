description_portal: 유동인구조사는 2009, 2012~2015년 사이에 진행된 조사입니다(현재 조사 중단).서울시 주요 지점의 유동인구를 변화량을 파악하기 위해 조사를 실시하였습니다.이 데이터는 서울시 주요 지점의 유동인구 변동을 파악하기 위한 조사 결과 보고서입니다. 조사 대상은 2009년 및 2012년부터 2015년까지의 연도로, 서울시 주요 지점에서 유동인구의 추세 변화를 분석하기 위해 실시되었습니다. 해당 데이터는 단회성으로 제공된 자료이며, 이후 조사가 중단된 상태입니다. 보고서는 PDF 형식으로 제공되며, 서울특별시 디지털도시국 데이터전략과에서 담당했습니다. 라이선스는 공공누리 제4유형(출처표시, 상업적 이용금지, 변경금지) 조건이 적용됩니다. 이 자료는 서울의 도시 유동패턴, 상권 분석, 인프라 계획, 교통 정책과 같은 분야의 기초 자료로 활용될 수 있습니다.
