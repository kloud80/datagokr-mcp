description_portal: '제주특별자치도 내 매매 가격 대비 전세 가격 비율 데이터를 제공합니다.항목: 연월, 주택 유형, 시도, 매매가격 대비 전세가격 비율 등* 제주특별자치도 내 주택 유형별로 매매가격 대비 전세가격의 비율을 2019년 1월부터 2021년 9월까지 주택유형 및 지역 단위로 집계한 통계자료이다. 해당 자료는 제주도의 부동산 시장 내 임대와 매매가격 간 균형성(전세가율)을 파악하는 데 초점을 두며, 주택 구매 가능성, 임대비 부담 수준, 주거 안정성 등의 지표로 활용될 수 있다.* 활용 분야 : 주택 임대비 부담 수준 평가, 부동산 및 주택 정책 수립, 임대주택 및 공공임대 확대 계획 등데이터 제공처: KOSIS 국가통계포털'
