summary_user: 국회가 보유한 자산 현황을 담은 데이터로, 실측 컬럼은 연도(YR)·구분명·면적·금액·공개파일명으로 구성돼 연도와 자산 구분별 집계로 보이며 범위는 전국·비공간입니다. 국회 재정·자산 규모를 살피는 분석가나 국민이 '연도별로 국회가 보유한 자산의 면적과 금액은 어떻게 변했나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 자산 구분명을 이름으로 맞추거나 같은 기관(국회사무처) 데이터끼리만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
