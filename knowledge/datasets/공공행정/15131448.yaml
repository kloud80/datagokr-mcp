description_portal: 공공기관의 예산 대비 환수처분 비율을 분석하여 발표하였습니다. 이는 공공재정의 효율적인 운영과 부정수급 방지를 위한 중요한 지표로 활용됩니다. 일부 기관에서는 예산 대비 높은 환수처분 비율을 보였으며, 이는 해당 기관의 부정수급 관리 체계에 대한 개선이 필요함을 시사합니다.  이러한 분석은 향후 예산 편성과 집행 과정에서의 투명성을 높이고, 공공재정의 건전한 운영을 도모하는 데 기여할 것으로 기대됩니다.​공공재정에서 지급되는 공공재정지급금에 대한  기관별 예산액 대비 환수처분 금액의 비율입니다. (공공재정지급금) 법령 또는 자치법규에 따라 공공재정에서 제공되는 보조금ㆍ보상금ㆍ출연금이나 그 밖에 상당한 반대급부를 받지 아니하고 제공되는 금품등
