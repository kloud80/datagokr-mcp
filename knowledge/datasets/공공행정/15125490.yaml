summary_user: 공정거래위원회 가맹사업 정보공개 자료 중 브랜드별·지역별 가맹점 수, 직영점 수, 전체 매장 수를 가맹사업기준년도 단위로 담은 API로, 전체 200,484건이 전국 범위로 제공된다. 창업 예정자나 분석가가 특정 프랜차이즈 브랜드가 어느 지역에 얼마나 매장을 냈는지, 가맹점과 직영점 비중이 어떤지 확인하는 질문에 쓴다. 브랜드관리번호(brandMnno)와 가맹본부관리번호(jnghdqrtrsMnno)로 같은 기관의 다른 가맹사업 자료와 이어 쓰며, 전역 조인 키는 없어 다른 기관 데이터와는 이름이나 코드 매핑이 필요하다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 사업자등록번호 기반 연결은 이 데이터만으로 되지 않는다. 검증 호출에서는 1,000행만 받았고 전량 수집에는 페이지 반복이 201회 이상 필요하다. 개발계정은 일 100,000회 호출 한도가 있다.
