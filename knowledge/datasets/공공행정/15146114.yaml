description_portal: 이 데이터는 ‘폐쇄말소대장 전유·공유 면적표’로, 건축물이나 부동산이 폐쇄·말소 처리될 때 해당 건물의 전유면적과 공유면적 정보를 기록한 자료입니다. 전유면적은 특정 소유자가 독점적으로 사용하는 공간의 면적을 의미하며, 공유면적은 복도, 계단, 주차장 등 공동으로 사용하는 공간의 면적을 의미합니다. 데이터에는 위치 정보(행정구역, 지번, 도로명), 건물 정보(동·호수, 층수), 폐쇄 또는 말소 사유와 일자, 면적 산출 값 등이 포함됩니다. 이 자료는 건축물 관리대장 변경, 소유권 이전, 세금 부과 정리, 재개발·재건축 사업, 행정 기록 보존 등에서 활용되며, 특히 건물의 과거 상태와 면적 변동 이력을 확인하는 데 중요한 근거 자료로 사용됩니다.
