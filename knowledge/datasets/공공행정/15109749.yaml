summary_user: 울산광역시도시공사가 시민에게 개방·대여하는 회의실·강당·체육시설 같은 공공시설을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.4KB)로, 운영시간·휴관일·사용료·수용인원·면적·주소·위도·경도를 포함한다. 시민이나 단체가 "울산에서 평일 저녁이나 주말에 빌릴 수 있는 회의실·강당이 어디이고 사용료와 수용인원은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 기관의 공공시설 개방정보 표준데이터와는 같은 항목 구성으로 행을 합쳐 쓰고, 주소나 좌표로 지도·주변 시설 데이터와 공간 결합한다.
description_portal: '이 데이터는 울산광역시도시공사에서 시민에게 개방·대여하고 있는 공공시설의 운영현황, 이용조건, 위치, 편의시설 등을 체계적으로 관리하기 위한 데이터셋입니다.시민이 직접 예약하거나 대관할 수 있는 회의실, 강당, 다목적실, 체육시설, 전시장 등 다양한 공공공간의 정보를 포함하며,공공자산의 효율적 활용과 시민 편의성 향상을 목적으로 구축되었습니다.핵심 항목인 **개방시설명(FCLTS_NM)**과 **개방장소명(HALL_NM)**은 시설의 명칭과 실제 위치한 건물 또는 공간을 식별할 수 있도록 하며,**개방시설유형구분(FCLTS_KND)**을 통해 시설의 성격(예: 회의실, 문화시설, 강의실, 체육시설 등)을 구분할 수 있습니다.운영시간 관련 항목인 **평일운영시작·종료시각(WKDAY_BGNG_TM, WKDAY_END_TM)**과**주말운영시작·종료시각(WKEND_BGNG_TM, WKEND_END_TM)**은 시민이 이용 가능한 시간대를 명확히 제공하며,휴관일(HLDY) 항목을 통해 정기 휴무나 시설 점검 일정을 확인할 수 있습니다.'
