summary_user: 국회 소위원회 회의록을 회의 단위로 담으며, 대수(ERACO)·회기·차수·회의일자·회의종류와 소속 위원회·소위원회 이름·코드, 회의록 내려받기 주소를 함께 제공한다. 법안 심사가 어느 소위원회에서 언제 논의됐는지 확인하려는 국민·기자·입법 분석가가 특정 소위원회의 회의 일정과 회의록 원문을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 위원회 코드·이름(CMIT_CD)이나 대수·회기·회의일자를 맞춰 의안·표결 등 국회 의정활동 데이터와 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
