description_portal: 이 자료는 지방공기업법 제46조에 근거하여 행정안전부가 통합경영공시를 통해 수집·관리하는 경영정보 중 하나로, 지방공기업의 상용정규직 근로자의 평균임금을 집계한 정보입니다. 상용정규직은 무기계약직, 청원경찰 등 일정한 근로계약을 기반으로 근무하는 인력을 포함하며, 일반정규직과 구분하여 공시됩니다. 해당 데이터는 성별, 근속년수, 수당 및 복리후생비를 포함한 세부 임금 항목을 종합하여 산출되며, 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 매년 정기적으로 공개됩니다. 이러한 정보는 지방공기업 인건비 구조의 투명성을 확보하고, 공공기관 임금 수준의 합리적 비교 및 정책 수립의 기초자료로 활용됩니다.
