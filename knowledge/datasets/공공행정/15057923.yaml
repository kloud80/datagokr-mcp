summary_user: 지방공기업별·연도별로 상용정규직(무기계약직·청원경찰 등) 근로자의 기본급, 수당, 시간외근무수당, 성과급, 급여성복리후생비 등 임금 항목과 직원수·평균근속년수·1인당 평균임금을 집계해 담은 전국 단위 경영공시 자료다. 구직자나 분석가가 "특정 지방공기업의 무기계약직 1인당 평균임금은 얼마이고 다른 기관과 비교해 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 기관명(ENT_NAME)과 연도(AC_YEAR)를 기준으로 같은 통합경영공시의 일반정규직 평균임금·지방공기업 목록 등과 이름 매핑으로 연결한다.
limits: 기관 코드 같은 전역 조인 키가 없어 다른 데이터와는 기관명 문자열 매칭으로만 붙일 수 있어 표기 차이에 주의해야 한다. 기관 단위 집계라 개인별 임금이나 성별·근속구간별 세부 분포는 이 필드로 확인할 수 없다.
