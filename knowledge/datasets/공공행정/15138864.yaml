summary_user: 전국 지방자치단체별로 지방의회 관련 경비(의정운영공통경비, 의회운영업무추진비, 의원국외여비, 의원역량개발비 등)의 일반회계 당초예산 편성액과 총액한도 대비 편성액을 회계연도·자치단체·항목 단위로 담은 공시 자료다. 주민이나 지방재정 분석가가 "우리 시·군·구 의회가 올해 국외여비와 업무추진비를 얼마나 편성했고 한도 대비 어느 수준인가"를 확인하거나 자치단체 간 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 같은 지방재정365 계열 공시 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 지방자치단체의 지방의회 관련 경비는 지방재정법 제60조 및 같은법 시행령 제68조에 따라 주민의 알권리 보장과 재정운영의 투명성 확보를 위해 공개됩니다. 공개 대상에는 지방의회 의원의 인건비, 의정활동비, 여비, 업무추진비 등 의회운영에 소요되는 모든 경비가 포함됩니다.지방의회 관련경비 정보는 2020 회계연도 이후의 정보가 제공되며 대상회계는 일반회계를 대상으로 당초예산 편성액 정보로 취합됩니다. 세부 제공항목으로는 의정운영공통경비, 의회운영업무추진비, 의원국외여비, 의원역량개발비(민간위탁) 각 항목별 예산액과 총액한도 대비 편성액 정보가 제공됩니다.
