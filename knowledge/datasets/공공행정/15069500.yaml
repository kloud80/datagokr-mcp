summary_user: 경기북부 지역 전주마다 부여된 전산화번호를 관할 한전 본부명·사업소명과 함께 한 행씩 담은 건별 코드표이며, 활용신청 없이 CSV 파일(약 17.9MB)로 받는다. 배전 분석가나 민원 담당자가 특정 전주번호가 어느 한전 본부·사업소 관할인지 확인할 때 쓴다. 전산화번호(kepco_pole_no)를 키로, 전주번호를 가진 정전기록·유지보수 이력·고객민원 자료와 이어 지역별 배전선로 관리를 분석한다.
description_portal: 한국전력공사에서 제공하는 경기북부 전주전산화번호 데이터로 경기북부 내 전주에 부여된 고유 전산화 번호를 정리한 자료입니다.본부명, 사업소명, 전산화번호 항목으로 구성되어 있으며 전주 번호를 통해 해당 전주가 속한 한전의 조직단위를 파악할 수 있는 지역별 코드표 역할을 합니다.전주전산화번호 데이터와 정전기록이나 유지보수 이력 데이터를 결합하여 사용하면 문제를 파악하고 해당 지역의 배전선로 관리 효율성을 분석할 수 있습니다.또한 전주 번호를 기반으로 고객민원 처리 현황을 분석하는 등 관련 활동에 기초 자료로 활용할 수 있습니다.
