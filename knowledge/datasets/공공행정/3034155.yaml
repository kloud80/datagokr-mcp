description_portal: 심결제도는 행정상 법률관계에 대해 분쟁이 있는 경우 그 분쟁에 대해 행정부가 사법절차에 준하여 본안에 대해 판단을 내릴 수 있는데, 이러한 일련의 심의･의결 절차를 말한다.방송미디어통신위원회의 심결은 소관 사무의 중요한 사안들에 대해 위원회의 합의를 통해 결정하는 행위로, 특히 금지행위에 있어 심의를 통해 적절한 조치를 의결하는 1차적인 처분절차이다. 이러한 심결은 방송통신분야의 이용자 보호와 관련하여 중요한 의미를 갖는다. 방송미디어통신위원회의 심결 대상은 기본계획, 산하조직 등 조직이나 운영 등에 관한 사항, 미디어 다양성, 진입규제, 금지행위의 조사 및 제재, 분쟁조정, 이용자 보호, 주파수 관리, 방송프로그램 및 방송광고 정책 관련 사항, 기금, 법령, 예산 등 다양한 사항을 대상으로 하고 있다.
