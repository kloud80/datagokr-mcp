summary_user: 국회도서관이 펴낸 연간보고서를 간행물 단위로 담으며, 보고서 제목(PBLM_TTL)·작성일·내려받기 주소를 제공하는 전국·비공간 목록이다. 국회도서관의 연도별 운영 현황이나 지난 연간보고서 원문을 찾으려는 연구자·국민이 "특정 연도 국회도서관 연간보고서를 어디서 내려받나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국회 간행물 목록과는 보고서 제목이나 작성일 같은 이름·날짜 매핑으로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
