summary_user: 강릉시 관내 시청·읍면동 행정복지센터·직속기관·사업소 등 행정기관을 기관 하나당 한 행으로 담은 개별 원장으로, 도로명·지번 주소와 위도·경도, 대표 전화번호, 홈페이지를 함께 담는다. 시민·관광객이 '우리 동네 행정복지센터가 어디이고 전화번호가 무엇인가'를 찾거나, 분석가가 강릉시 생활권별 행정기관 접근성을 지도에 그려 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 잇는다.
description_portal: '강원특별자치도 강릉시 관내 행정기관 현황을 제공하는 데이터로, 각 기관의 명칭·주소·좌표·연락처·홈페이지 정보를 함께 제공합니다.주요 항목은 다음과 같습니다.행정기관명: 강릉시청, 읍·면·동 행정복지센터, 직속·사업소 등 행정기관의 이름도로명주소: 행정기관의 도로명 기반 주소(민원 안내, 내비게이션 이용에 적합)지번주소: 지번 기준 상세 주소로, 토지·건축·지적 정보와의 연계에 활용 가능위도, 경도: 기관 위치를 나타내는 Y/X 좌표(위도·경도로 변환 가능)로, 지도(GIS) 서비스 및 공간 분석에 활용전화번호: 민원·문의 등을 위해 각 행정기관에 직접 연결되는 대표 전화번호홈페이지: 해당 행정기관에서 운영하는 웹사이트 주소(URL)데이터기준일: 도로명주소, 지번주소, 좌표, 전화번호, 홈페이지 정보가 작성·검증된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 행정기관을 기관명–주소–좌표–연락처–홈페이지 단위로 구조화하여 제공함으로써, 시민·관광객 대상 행정기관 위치 및 연락처 안내 서비스 구축, GIS 기반 행정기관 분포 시각화 및 생활권별 행정 접근성 분석, 각종 민원·생활정보 시스템에서 행정기관 선택/연계 시 참조 마스터 데이터로 활용, 주소·연락처 변경 시 통합 관리 및 유지보수 자동화 등에 활용할 수 있는 행정 인프라 현황 공공데이터입니다.'
