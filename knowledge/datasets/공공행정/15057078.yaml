summary_user: 지방자치단체의 통합재정수지비율(결산)을 회계연도별·자치단체별로 담은 집계 지표로, 일반회계·특별회계·기금을 합친 세입·지출·순융자·통합재정규모와 비율(rate)을 제공한다(포털 설명상 2016 회계연도부터, 전국·시도 평균은 순계, 개별 자치단체는 총계 기준). 분석가나 주민이 '우리 시군구의 재정이 결산 기준으로 흑자였나 적자였나, 다른 지역과 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없어 자치단체 코드(laf_cd)나 자치단체명으로 같은 지방재정365의 다른 지표(재정자립도 등)와 이름·코드 매핑으로 연결한다.
description_portal: 지방자치단체의 통합재정수지비율은 자치단체 전체 재정의 건전성을 나타내는 지표로, 통합재정수지를 일반회계와 기타특별회계, 공기업특별회계, 기금을 모두 포함한 총수입과 총지출의 차이로 계산합니다. 통합재정수지비율은 총수입대비 총합재정수지의 비율로 흑자일 경우 재정에 여유가 있고 적자일 경우 재정이 부담이 크다는 것을 의미합니다.통합재정수지비율(결산) 정보는 자치단체 결산정보를 기준으로 2016 회계연도부터 제공되고 있으며, 전국 및 시도별 평균은 순계기준, 개별자치단체는 총계기준 정보로 제공됩니다. 제공되는 세부항목은 세입, 지출, 순융자, 통합재정규모와 통합재정수지비율 정보가 제공됩니다
