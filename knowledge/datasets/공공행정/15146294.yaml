description_portal: '○ 통계개요* 통계명 : 보육시설이용 (동별)* 통계종류 : 서울시 보육시설 이용현황을 동 단위로 제공하는 일반ㆍ보고통계* 근거법령 :「영유아보육법」제10조에 의해 설치ㆍ운영되는 보육시설* 작성목적 : 초등학교 이하 아동의 보육시설 현황 및 이용실태를 파악하여 보육정책수립 및 평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 보육담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 동별 보육시설(국공립, 법인, 민간, 부모협동 등)의 정원수및 보육아동 수○ 용어설명* 영유아 : 6세 미만의 취학전 아동* 보육 : 영유아를 건강하고 안전하게 보호ㆍ양육하고 영유아의 발달 특성에 맞는교육을 제공하는 복지 서비스* 보육시설 : 보호자의 위탁을 받아 영유아를 보육하는 시설'
