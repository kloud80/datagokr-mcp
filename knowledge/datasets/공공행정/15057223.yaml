summary_user: 전국 지방자치단체별로 회계연도마다 주민 1인당 세외수입액, 일반회계 세외수입액, 인구수를 담은 집계 지표로, 세외수입 총액을 전년도 말 주민등록 인구로 나눠 산정한다. 지방재정 분석가나 주민이 '우리 시·군·구의 1인당 세외수입이 광역 평균이나 전국 평균에 비해 어느 수준인가'를 비교할 때 쓴다. 전역 조인 키는 없고, 자치단체 코드(laf_cd)·광역 코드(wa_laf_cd)와 자치단체명으로 같은 지방재정365의 다른 공시 지표와 연결한다.
description_portal: 지방자치단체의 주민1인당 세외수입액은 자치단체의 재정자립도를 평가하는 핵심 지표로 세외수입 총액을 전년도 12월31일 기준 자치단체에 등록된 주민등록 인구수로 나누어 산정합니다. 이 지표는 자치단체의 자체재원 확보능력을 나타내며, 재정운영의 자율성과 효율성을 평가하는데 활용됩니다.주민1인당 세외수입액 정보는 2001회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 주민1인당세외수입액, 일반회계세외수입액, 인구수 항목이 제공됩니다.
