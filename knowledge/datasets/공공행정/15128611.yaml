description_portal: '○ 한국특허정보원 홈페이지에 게시되어 있는 입찰공고 데이터를 제공합니다. 한국특허정보원이 나라장터(국가종합전자조달시스템)를 통해 공고한 용역, 단체보장성 보험, 유지관리 등 다양한 입찰 정보로 구성되어 있습니다. 이 데이터는 공공조달 과정의 행정 투명성을 높이고, 공정한 경쟁 환경 조성, 중소기업 참여 확대, 디지털 기반의 조달 혁신, ESG 기반 경영 실현 등 최근 사회적 가치 실현에 기여할 수 있습니다. 기업, 연구기관, 조달 관련 전문가 등이 입찰 시장 분석이나 공공조달 동향 파악에 활용할 수 있습니다.○ 컬럼 설명 : 게시물일련번호(게시물 등록 순서), 게시물제목(본문의 제목), 게시자명(게시물 등록자명), 게시일자(게시물 등록일자), 게시물조회수(해당게시물의 조회수)○ 기준일자 : 2026-06-09'
