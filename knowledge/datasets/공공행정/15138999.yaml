description_portal: 이 데이터는 기술보증기금이 외부 전문기관과 체결한 연구개발 과제의 완료 현황을 정리한 자료입니다. 각 과제별로 과제명, 수행기관, 연구책임자, 계약기간, 계약금액 정보가 포함되어 있으며, 연구 기간 및 연구자 정보와 함께 기금의 위탁연구 실적을 확인할 수 있도록 구성되어 있습니다.계약기간은 과제 시작일과 종료일로 표시되어 있어 과제의 진행 시점을 파악할 수 있으며, 계약금액은 과제별 연구 범위 및 규모를 가늠하는 데 참고할 수 있습니다. 수행기관에는 대학, 민간기업, 법무법인 등 다양한 유형이 포함되어 있으며, 과제명은 정책개선, 제도 진단, 내부 시스템 고도화 등 다양한 연구 주제를 포괄합니다.
