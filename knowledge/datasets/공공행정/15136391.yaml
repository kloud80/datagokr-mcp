summary_user: 국립생태원이 보유·관리하는 행정박물을 한 점(건)씩 담은 원천 목록으로, 유형·형태·재질·박물명·생산일자·수량·상태·공개여부·보존장소를 담으며 파일 크기는 약 83KB(csv)이다. 기록관리 담당자나 연구자가 '국립생태원이 어떤 기념품·문서·장비류 행정박물을 어디에 얼마나 보존하고 있고 공개 가능한 것은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 기관의 행정박물 현황과는 박물명·유형 같은 이름 매핑으로만 맞대어 비교한다.
description_portal: '이 데이터는 국립생태원이 보유·관리하고 있는 행정박물의 현황 정보를 담고 있으며, 행정통합시스템을 통해 체계적으로 등록·관리됩니다. 행정박물은 기관의 행정·운영 과정에서 생성되거나 수집된 물적 자산으로, 역사적·기록적 가치가 있어 보존 및 관리가 필요한 항목들입니다. 주요 제공 항목에는 박물의 유형(예: 기념품, 문서, 장비 등), 형태, 재질, 수량, 보존 장소, 취득 경위 등이 포함되며, 공공기관의 행정기록 보존 실태를 파악하거나 기관의 역사적 정체성 및 발자취를 시각화하는 데 활용됩니다. 이 데이터는 기관의 상징성과 유산을 기록하고 향후 전시·교육·홍보 등의 자료로 활용될 수 있는 기반자료로, 공공자산의 체계적 관리 및 기록문화 확산을 위한 중요한 자원입니다.'
