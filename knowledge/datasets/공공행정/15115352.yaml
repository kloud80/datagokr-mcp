summary_user: 강남구에서 일반음식점 영업허가를 받고 관광객용 음식제공시설을 갖춰 특정 국가 음식을 전문으로 제공하는 관광식당을 업소 한 곳당 한 행씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업·휴업일자·주소·사업장명·좌표 등을 포함하며 범위는 강남구 한 곳이다. 상권 분석가나 창업자가 '강남구에서 외국 음식 전문 관광식당이 언제 문을 열고 닫았고 지금 어디서 영업 중인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 LOCALDATA 인허가 자료와는 관리번호·사업장명·주소를 맞춰 대조하고, 다른 지역 자료와는 주소나 좌표로 이어 쓴다.
