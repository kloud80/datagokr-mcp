summary_user: 금융위원회가 심의·의결한 제재 사건의 결정문을 건별 목록으로 담으며, 한 건마다 의결번호·안건명·기관명·결정문일련번호·상세 링크가 붙고 범위는 전국·비공간입니다. 금융회사 준법 담당자나 분석가가 "특정 금융회사가 어떤 안건으로 금융위원회 제재 의결을 받았는가"를 찾고 결정문 원문으로 넘어가는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 기관명(금융회사명) 이름 매칭으로만 다른 데이터와 잇고, 결정문 본문은 결정문일련번호나 상세 링크로 따라가 조회한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 금융위원회 결정문 데이터로, 위원회 결정문에 대한 목록 정보를 조회하는 서비스입니다. 본 데이터는 금융위원회가 심의·의결한 각종 제재 사건에 대한 결정문 목록 정보를 제공합니다. 데이터는 사건번호, 심의일자, 금융회사명, 조치유형, 위반 법령, 위반행위 개요, 제재 내용 등으로 구성되어 있으며, 각 사건에 대한 행정처분 현황을 일자별로 조회할 수 있습니다. 사용자는 기간, 기관, 조치 구분 등 다양한 조건을 통해 목록을 검색할 수 있으며, 사건별로 고유 식별번호가 부여되어 있습니다.
