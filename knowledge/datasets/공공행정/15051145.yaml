description_portal: 전북특별자치도 장수군 통계연보에 대한 데이터를 제공하고자 합니다.통계연보의 구성은 토지 및 기후, 인구, 노동, 사업체, 농림수산업, 광업제조업및 에너지, 전기, 가스, 수도, 유통금융보험및기타서비스, 주택, 건설, 교통 및 관광, 보건 및 사회보장, 환경, 교육 및 문화, 재정, 공공행정및사법으로 구성되어 있습니다.제43회(2002년12월31일 기준)부터 제64회(2023년12월 31일 기준)까지 통계연보가 저장되어 있으며, 해당 자료는 장수군 대표홈페이지(www.jangsu.go.kr)에서 제공하고 있습니다.
