description_portal: '국민내일배움카드 훈련과정  중 ncs 대분류 기준 정보통신분야의  훈련 실시인원에 대하여 추출. 등록 (기간 : 2019년~2026년 4월 말)- 정보통신분야는 유선·무선 통신 설비 시공·유지보수, 네트워크·데이터 통신, 방송통신 시스템 등 통신 인프라를 다루는 분야로, 관련 국가기술자격(정보통신기술사, 정보통신기사, 통신설비기능장 등)과 공사업 등록 요건에 해당되는 분야로 해당 분야 실시인원을 바탕으로 향후 관련 인력수급 현황 예측 및 관련분야와의 융합 연계성 등 시사점 논의가 가능함.- 국민내일배움카드 훈련과정 중 NCS 대분류 기준 정보통신분야를 수강한 실시인원 현황- 출처: EIS(고용정보통합분석시스템)- 훈련실시인원: 훈련시작일 기준, 연 인원*    * 한 명의 훈련생이 2개 과정 수강 시, 실시인원은 2명으로 추출 - 훈련과정 : 일반직종, 첨단산업디지털핵심 실무인재 양성훈련, 일반고특화훈련, 국기직종,산업구조변화대응 등 특화훈련 등 모든 훈련과정으로 범위설정 - 연계 및 활용 :  훈련 실시자를 통해 향후 해당분야 훈련인원 조절 및 훈련설계  사용'
