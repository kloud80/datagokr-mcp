summary_user: 대전광역시 동구청과 각 행정복지센터(주민센터)의 소재지, 전화·팩스번호, 위도·경도 좌표를 기관 한 곳당 한 행으로 담은 소규모 파일(csv 약 2KB)이다. 동구 주민이 가까운 주민센터의 위치와 연락처를 찾거나, 분석가가 주민센터 접근성을 지도 위에서 따져 볼 때 쓴다. 전역 조인 키는 없어 기관명(구분)이나 주소로 맞추거나, 위도·경도 좌표로 다른 생활 행정시설·무인민원발급기 데이터와 공간 결합해 쓴다.
description_portal: 대전광역시 동구 내 동구청과 각 행정복지센터의 소재지, 전화번호, 팩스번호, 위도·경도 좌표 등 상세 정보를 포함한 데이터입니다. 이 자료를 통해 주민들은 생활에 밀접한 행정서비스 제공 기관들의 위치와 연락처를 손쉽게 확인할 수 있으며, 행정기관은 위치 기반 행정 서비스 제공, 민원 대응 체계 강화, 효율적인 자원 배치 및 행정 접근성 개선을 위한 정책 수립에 활용할 수 있습니다. 또한 긴급 상황 시 신속한 연락과 대응 체계 마련에도 중요한 기초 자료로서 활용됩니다. 이를 통해 주민 편의 증진과 행정 서비스의 질적 향상에 기여할 수 있습니다.
