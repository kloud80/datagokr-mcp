summary_user: 우리나라가 체결하거나 비준한 조약을 한 건씩 담은 파일로, 조약명(국문·영문), 조약 구분, 발효일자, 등록·수정 일시를 수록하며 범위는 전국·비공간이다. 법률 실무자나 연구자가 '이 국제협정이 언제부터 국내에서 효력을 가졌나'처럼 특정 조약의 발효 시점과 영문 명칭을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 법령·외교 데이터와는 조약명 같은 이름 매핑으로만 이어 쓴다.
