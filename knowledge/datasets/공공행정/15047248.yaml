description_portal: 서울시 주요 공기업 리스트 정보 데이터는 서울시에 위치한 핵심 공기업들의 기본 현황과 위치 정보를 체계적으로 제공하는 자료입니다. 키 값은 각 공기업을 식별하기 위한 고유 값으로 활용되며, 분류1, 분류2, 분류3 항목을 통해 공기업의 기능, 역할, 업종 등을 단계적으로 구분하여 분석할 수 있습니다. 명칭 항목에는 공기업의 공식 한글 명칭이 수록되어 있어 기관별 정보 탐색과 비교에 활용하기 좋습니다. 도로명 주소와 행정 시, 행정 구, 행정 동 정보는 공기업의 정확한 위치와 행정구역 상의 소속을 파악할 수 있게 해주며, 이를 기반으로 지역별 공공기관 분포나 접근성 분석에도 이용할 수 있습니다. 또한 홈페이지 주소 항목을 통해 각 공기업의 공식 사이트에 직접 접속하여 상세 업무 안내, 공지사항, 채용 정보, 민원 서비스 등을 확인할 수 있어 시민, 연구자, 행정기관 모두에게 유용한 기초 데이터입니다.
