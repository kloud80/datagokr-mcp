description_portal: '○ 통계개요* 통계명 : 필수생활시간* 통계종류:통계청「생활시간조사」에서 서울시민의 시간활용을 제공하는 지정·조사통계* 작성목적 : 국민들이 주어진 하루 24시간을 어떤 형태로 보내고 있는지 등 국민의 생활방식과 삶의 질을 파악하여 사회개발정책의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 조사원 → 지방통계청 → 통계청* 공표주기 : 정기(5년)* 공표범위 : 지역 - 서울시내용 - 서울시민의 평일, 토요일, 일요일 필수생활시간 활동별 평균시간○ 용어설명* 평균시간 : 전체 집계대상자(특정행동을 하지 않는 사람 포함) 평균 시간* 필수시간 : 잠, 식사 등 개인유지를 위해 필수적으로 필요한 시간* 개인건강관리 : 자가치료, 의료서비스받기, 아파서 쉼* 요일평균 : 평일, 토요일, 일요일 등 모든 요일을 포함한 평균시간* 평일 : 월~금요일의 평균시간* 토/일요일 : 토요일과 일요일에 각각 해당되는 평균시간○ 기 타* 통계표의 평균시간은 초단위에서 반올림하여, 상위분류의 값이 하위분류의 합과 일치하지 않을 수 있음"0:00"은 "단위미만"을 "-"는 "해당숫자 없음"을 각각 나타냄'
