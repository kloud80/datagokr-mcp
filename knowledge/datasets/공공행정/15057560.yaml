summary_user: 지방자치단체가 복식부기로 작성한 재무제표 중 부채 항목(차입금, 미지급금, 보증채무, 퇴직급여충당부채 등)을 회계연도(fyr)·광역/기초 자치단체별 금액으로 담은 전국 단위 집계 데이터다. 분석가나 주민이 "우리 시·군·구의 부채 규모가 연도별로 어떻게 변했고 다른 지자체와 비교하면 어떤가"를 확인해 재정 건전성을 판단하는 데 쓴다. 전역 조인 키는 없고, 광역·기초 자치단체 코드와 이름(wa_laf_cd, laf_cd 등)을 매핑하거나 같은 지방재정365의 자산·세입·세출 공시와 자치단체 코드로 맞춰 이어 쓴다.
description_portal: 복식부기 재무현황(부채)는 지방자치단체가 복식부기 회계방식에 따라 작성한 재무제표 중, 부채에 해당하는 항목들을 정리한 것입니다. 복식부기란 모든 거래를 자산, 부채, 자본, 수익, 비용의 다섯 가지 요소로 구분하여 기록하는 회계 방식으로, 재정의 흐름을 보다 정확하고 투명하게 파악할 수 있게 해줍니다.이 중 부채는 지방자치단체가 미래에 금전적으로 이행해야 할 의무를 의미하며, 대표적으로 차입금, 미지급금, 보증채무, 퇴직급여충당부채 등이 포함됩니다. 이러한 부채 항목들은 지방자치단체의 재정 건전성을 평가하는 데 중요한 지표로 활용되며, 향후 재정 운영에 있어 잠재적 부담 요인으로 작용할 수 있습니다..
