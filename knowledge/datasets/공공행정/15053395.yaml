description_portal: 본 데이터는 2013년 기준 경기도 용인시 산업 중분류별로 대표자의 연령대와 읍·면·동별 사업체 수, 종사자 수를 집계한 현황을 제공한다. 주요 항목은 산업중분류, 대표자 연령대, 읍·면·동, 사업체 수, 종사자 수로 구성되어 있으며, 연령대별 창업 및 경영 현황을 산업별·지역별로 비교·분석할 수 있다. 이를 통해 청년층, 중장년층, 고령층 등 세대별 대표자 분포와 이에 따른 사업체 규모, 종사자 현황을 종합적으로 파악할 수 있다. 자료는 청년 및 중장년 창업 지원 정책, 세대별 산업 특성 연구, 고용 다양성 분석, 지역경제 활성화 전략 수립 등 다양한 분야에서 활용될 수 있다. 단일 연도 기준으로 제공되는 통계 자료로 주기적 갱신은 이루어지지 않지만, 당시 용인시의 산업·고용 구조와 연령대별 창업 특성을 이해하는 데 중요한 기초 자료로서 의미가 크다. 공공데이터 개방을 통해 정책적 활용도와 연구적 가치를 높이고, 지역 맞춤형 경제정책 수립과 창업 지원 환경 조성에 기여하는 것을 목표로 한다.
