description_portal: '서울특별시 강남구_렌터카업체 정보자동차 이용 수요 증가와 함께 단기·장기 렌터카 수요가 지속적으로 확대되고 있으며, 특히 관광·출장·일상 생활 등 다양한 목적의 차량 임대 수요가 강남구에서도 꾸준히 발생하고 있습니다. 이에 따라 강남구는 관내 렌터카업체 현황 정보를 제공하여 시민 편의 증진, 교통정책 수립, 교통 안전관리 등에 활용될 수 있도록 하고 있습니다.개방 데이터는 사업장명, 사업장 소재지(도로명 주소), 사업자번호, 차량보유대수, 취급차종, 관할 행정동, 담당부서 등으로 구성되어 있습니다.※ 수집 시점 기준으로 지속적으로 업데이트되며, 일부 정보는 업체의 자율 신고 또는 변경사항 반영 시기에 따라 차이가 발생할 수 있습니다.활용 기대효과로는▶ 교통·도시정책 수립: 렌터카업체의 분포 현황을 분석하여 교통수요 관리, 주차공간 확보, 교통혼잡 완화 등의 정책 수립에 활용 가능▶ 산업·시장 분석: 연구기관·학계 등에서 지역 내 차량공유·렌터카 산업 동향 파악 및 관련 산업 활성화 방안 마련에 활용▶ 소비자 편의 증진: 시민·관광객 등 일반 이용자들이 업체 정보 확인을 통해 렌터카 이용 계획 수립 시 참고자료로 활용 가능▶ 안전관리 및 감독: 관계기관이 렌터카업체 운영 현황을 파악하여 보험가입, 차량보유대수 등 관리·감독 자료로 활용 가능'
