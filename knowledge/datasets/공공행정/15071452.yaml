summary_user: 서울시 단란주점 영업 인허가를 업소 한 곳당 한 행으로 담은 원장 데이터로, 상호명·지번/도로명 주소·인허가일자·영업상태와 상세상태·폐업일자·좌표(X, Y)·시설면적 등을 포함한다. 분석가나 정책 담당자가 '어느 자치구에서 단란주점 신규 인허가와 폐업이 늘고 있는가'처럼 지역별·연도별 증감 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 주소나 자치단체 코드(OPNSFTEAMCODE)로만 다른 자료와 연결하며, 같은 원천인 LOCALDATA 인허가 자료와는 관리번호(MGTNO)를 기준으로 맞춰 볼 수 있다.
description_portal: ㅇ 이 데이터는 서울시에서 단란주점 영업을 위한 인허가 현황을 제공하는 공공데이터입니다.ㅇ 데이터에는 단란주점 상호명, 소재지 주소, 허가일자, 업종, 영업상태, 관리기관명, 행정동 코드 등의 정보가 포함됩니다.ㅇ 해당 자료를 통해 서울시 내 단란주점의 분포 현황, 신규·폐업 추세, 지역별 인허가 현황 등을 분석할 수 있습니다.ㅇ 인허가일자 및 영업상태 정보를 활용해 연도별·지역별 단란주점 증감 추이를 파악할 수 있으며, 유흥업 관리 정책 수립 및 공공안전 대책 마련에 활용됩니다.ㅇ 본 데이터는 서울시 열린데이터광장을 통해 제공되며, 주기적으로 갱신되어 최신 현황을 반영합니다.
