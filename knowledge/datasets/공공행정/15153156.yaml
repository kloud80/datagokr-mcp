summary_user: 국민권익위원회가 의결한 특별행정심판 재결례를 사건 한 건씩 목록으로 담는 전국 단위 원천 데이터로, 사건명·사건번호·처분청·재결청·의결일자·처분일자·재결구분과 상세 재결문 링크를 포함한다. 행정처분에 불복하려는 국민이나 대리인, 법률정보 서비스 사업자가 비슷한 처분을 다룬 사건이 과거에 어떻게 재결됐는지 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 처분청·재결청 이름이나 재결구분 코드 매핑으로만 잇고, 재결문 본문은 일련번호(특별행정심판재결례일련번호)나 상세 링크로 따로 조회한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 국민권익위원회 특별행정심판 재결례 데이터로, 특별행정심판 재결례의 목록 정보를 조회하는 서비스입니다. 본 서비스는 국민권익위원회가 의결한 행정심판 사건의 기본 정보를 제공하며, 의결일자나 재결례유형 등을 조건으로 검색할 수 있습니다. 각 재결례에는 사건명, 청구번호, 처분청, 재결청, 의결일자 등 주요 내용이 포함되어 있고, 상세 재결문은 링크를 통해 확인할 수 있습니다. 본 데이터는 특별행정심판의 체계적 관리와 유사 사건의 법적 판단 분석에 활용될 수 있습니다. 또한 특별행정심판 재결례 정보를 기반으로 한 검색·조회 서비스, 법령 기반 지식산업 개발, 자동화된 법률 정보 제공 도구 등 다양한 서비스 구현에 활용될 수 있습니다.
