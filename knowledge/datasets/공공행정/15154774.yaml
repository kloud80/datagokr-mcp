summary_user: 전국 지방자치단체가 관리하는 무인민원발급기를 기기 한 대 단위로 담은 원장으로, 발급기명·관리기관·설치장소 주소와 상세 위치, 평일·공휴일 운영시간, 사용 여부, 점자라벨·음성안내·휠체어 조작 같은 장애인 편의기능, 발급 가능한 민원사무 분류를 담는다. 주민이 '우리 동네에서 주말에 등기사항증명서나 가족관계 서류를 뗄 수 있는 발급기가 어디 있나'를 찾거나, 분석가가 시군구별 발급기 배치와 장애인 접근성 기능 제공 현황을 비교하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시도코드·시군구명·개방자치단체코드나 도로명 코드(도로코드·건물번호)를 이용한 이름·코드 매핑으로 행정구역이나 주민센터 등 다른 생활 행정시설 데이터와 연결한다.
description_portal: "무인민원발급기정보 데이터는 '민원처리에 관한 법률' 등에 따라 행정기관 또는 공공장소 등에 설치하여 민원인이 직접 민원문서를 발급받을 수 있도록 하는 전자장비에 대한 데이터로 발급기명, 관리기관명, 설치장소 주소 및 상세 위치 등 기본 정보와 함께 평일·공휴일 운영시간, 사용 여부 등 운영 현황 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준, 전국 지방자치단체에서 관리하는 무인민원발급기 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 무인민원발급기의 설치 현황과 운영 정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 행정안전부 민원제도과 / 044-205-2456"
team:
  dept: 지역디지털협력과
