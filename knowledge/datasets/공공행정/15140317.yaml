summary_user: 기획재정부 관할(재정·세제·예산·금융 등) 법령해석 사례를 해석 건별 목록으로 담으며, 안건명·안건번호·질의기관·해석기관·해석일자와 상세 링크를 전국 범위로 제공한다. 세무·재정 실무자나 분석가가 "특정 세제·예산 규정에 대해 기획재정부가 과거 어떻게 해석했는가"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 법령해석일련번호와 상세 링크로 해석 본문 조회에 잇거나 질의기관코드·해석기관코드 같은 기관 코드, 안건명 이름 매칭으로만 다른 데이터와 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 기획재정부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 국가 재정, 세제, 예산, 금융 등 기획재정부 관할 분야에 대한 법령 해석 요청 사례를 목록 형태로 제공합니다. 이용자는 해석 일련번호, 안건명, 질의기관, 해석일자 등 기본 정보를 기준으로 다양한 사례를 검색할 수 있으며, 각 항목에는 회신 여부, 접수일, 처리현황 등이 포함되어 해석 진행 경과를 명확히 파악할 수 있습니다. 본 목록은 관련 회신 본문과 연계되어 있으며, 법률 질의에 대한 판단 기준과 행정 적용의 일관성 확보를 위한 분석 자료로 활용할 수 있습니다.
