summary_user: 서울 영등포구 안에 설치된 폐형광등·폐건전지 수거함을 한 곳씩 담은 위치 목록으로, 행정동(동명)·주소·설치 구분·건물명이나 상호·수거함 개수(박스수량)를 적는다. 영등포구 주민이 '우리 동네에서 다 쓴 건전지나 형광등을 어디에 버리나'를 찾을 때 쓰고, 구 단위 수거함 배치 현황을 살피는 데도 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 동명이나 주소 문자열로 맞춰 잇거나 같은 기관(영등포구)의 다른 생활시설 자료와 나란히 놓고 쓴다.
description_portal: '서울특별시 영등포구의 폐형광등 및 폐건전지 수거함 설치 위치 정보를 제공합니다.데이터는 자원순환 촉진과 유해 폐기물의 안전한 처리를 위한 목적으로 수집되었으며, 각 행정동별 설치 동명과 구체적인 설치 장소명(예: 주민센터, 아파트 관리사무소, 공공기관 등)으로 구성되어 있습니다.주민이 가장 가까운 수거함을 손쉽게 찾을 수 있도록 제작된 본 데이터는 환경정책 수립, 홍보 콘텐츠 제작, 위치 기반 서비스 연계 등 다양한 분야에서 활용될 수 있습니다.정기적인 현황 점검을 통해 최신 정보를 반영하고 있으며, 공공기관 및 민간의 환경 관련 분석 자료로도 유용합니다.※ 설치 장소는 사정에 따라 변경될 수 있으며, 현장 확인이 필요할 수 있습니다.'
