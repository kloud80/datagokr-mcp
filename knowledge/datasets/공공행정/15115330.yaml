summary_user: 서울 강남구에서 유산균 음료·어류·조개류처럼 부패·변질되기 쉬운 식품을 운반하는 식품운반업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·좌표 등을 포함하며 범위는 강남구 한 곳(시군구)이다. 상권 분석가나 사업자가 '강남구에서 지금 영업 중인 식품운반업체는 어디이고 언제 인허가·폐업했는가'를 확인하거나 점포 이력을 추적하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 업소명·주소 같은 이름 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 원천인 LOCALDATA 인허가 자료와 겹친다.
description_portal: 서울시 강남구 식품운반업 인허가 정보(http://data.seoul.go.kr/dataList/OA-18224/S/1/datasetView.do)강남구의 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다.데이터 활용시 참고하시기 바랍니다.
