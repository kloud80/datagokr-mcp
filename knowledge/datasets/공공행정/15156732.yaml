description_portal: 경기도 남양주시 청사 및 출장소(관공서) 현황입니다.  국민 생활과 밀접한 행정 및 공공 서비스를 제공하는 기관들의 위치와 속성 정보를 제공합니다. 본 데이터는 시청, 행정복지센터, 출장소 등 청사 구분명, 대표 전화번호, 소재지 도로명주소, 소재지 지번주소 등의 기본정보 항목들을 포함하고 있습니다. 이 데이터는행정 구역 개편 시 검토자료, 찾아가는 서비스에의 활용 등 행정 효율화 및 대민 서비스 개선에 이용할 수 있습니다.  또한 도시 안전 및 응급 구조, 상권분석, 생활 편의 서비스 등 다양한 서비스 제공에 활용될 수 있는 데이터입니다.
