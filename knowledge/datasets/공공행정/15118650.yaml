summary_user: 전국 지방자치단체가 체결한 공사·용역·물품구매 등 계약을 계약 한 건 단위로 담으며, 계약방법·계약종류·계약명·계약일자·계약총액·업체명 등을 포함하는 원천 공시 자료이다. 주민이나 분석가가 "우리 구가 올해 어떤 업체와 어떤 방식(수의계약 등)으로 얼마짜리 계약을 맺었나"를 확인하거나 자치단체별 계약 집행을 비교할 때 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 자료와는 자치단체 코드(laf_cd)나 자치단체명을 같은 기관 코드 체계로 맞춰 잇는다.
description_portal: 지방자치단체의 계약현황 공개는 계약의 투명성과 공정성을 확보하기 위한 제도입니다. [지방계약법] 제43조(계약정보의 공개) 및 시행령 제124조~제126조에 따라공사,  용역, 물품구매 등 계약내용, 계약금액, 계약상대자 등을 의무적으로 공개합니다. 계약정보는 각 자치단체 홈페이지를 통해 확인할 수 있으며, 주민은 이를 통해 예산 집행의 적정성을 감시할 수 있습니다.계약현황 정보는 2016 회계연도부터 제공되고있으며 세부 제공항목으로는 계약방법, 계약명, 계약일자, 계약집계금액, 업체명 등 정보가 제공됩니다
