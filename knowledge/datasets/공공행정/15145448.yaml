description_portal: 해당 회계연도별 주민참여예산 사업의 명칭, 사업예산액, 기준일자를 제공합니다. 주민이 직접 제안·참여한 사업의 예산 현황을 확인하고 분석하는 데 활용할 수 있습니다. 사업명과 예산액은 예산 편성 및 집행 계획을 이해하는 데 도움이 되며, 기준일자는 데이터의 최신성을 판단하는 지표로 활용됩니다. 분석·시각화 작업을 통해 예산 배분 경향, 분야별 투자 비율, 주민 제안 사업의 반영 정도 등을 파악할 수 있습니다. CSV, XLSX 등 기계판독이 가능한 형식으로 제공되어 행정·연구·민간 서비스 개발 등 다양한 분야에 적용이 가능합니다.
