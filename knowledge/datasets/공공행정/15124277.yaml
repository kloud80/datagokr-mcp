description_portal: 이 데이터는 공공기관이 장애인기업으로부터 구매한 제품 및 용역의 내역을 기록한 자료로, 거래처명, 지급 금액, 지급일자, 사업자등록번호 등의 항목을 포함하고 있습니다. 본 데이터는 2023년부터 2025년까지의 장애인기업 제품 구매 실적이 포함되어 있으며, 각 거래 건의 공급자 및 지급 정보를 통해 기관의 사회적경제기업에 대한 구매 확대 노력 및 정책 이행 상황을 정량적으로 확인할 수 있습니다.장애인기업 제품 구매는 「장애인기업활동촉진법」 및 관련 공공구매 촉진 정책에 따라 의무화되어 있으며, 본 데이터는 해당 제도의 이행현황을 파악하고 분석하는 데 활용될 수 있습니다. 또한, 데이터는 연도별, 거래처별, 금액 기준으로 가공이 가능하여 기관별 구매 비중 분석, 공급기업 분포, 정책효과 분석 등의 다양한 행정적·연구적 활용이 가능합니다.
