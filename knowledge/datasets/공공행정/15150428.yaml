summary_user: 경기도 통합홈페이지에 사전정보공표 항목으로 올라간 행정정보의 목록으로, 항목마다 공표내용·상세내용·공표주기·공표시기와 공표 유형, 게시판 또는 외부 링크 주소, 담당부서명, 게시물 수정일, 삭제여부를 담는다. 시민이나 정보공개 담당자가 "경기도가 어떤 정보를 얼마나 자주 사전공표하고, 담당 부서는 어디인가"를 확인하거나 공표 목록이 최신인지 점검하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키를 찾지 못했으므로, 담당부서명 같은 이름 매핑이나 같은 기관(경기도) 단위로만 다른 자료와 연결한다.
description_portal: 이 데이터는 경기도 통합홈페이지에서 사전정보공표 항목으로 공개하는 다양한 행정정보에 대한 목록을 제공합니다. 각 항목은 공표내용, 공표상세내용, 공표주기, 공표시기 등으로 구성되며, 공표 유형은 카테고리번호 및 유형텍스트를 통해 구분됩니다. 정보는 게시판 또는 외부 링크 형태로 제공되며, 게시판/링크주소 항목을 통해 직접 확인이 가능합니다. 또한, 담당부서명과 담당자 연락처가 포함되어 있어 정보 요청 및 문의가 가능하며, 삭제여부 및 게시물 업데이트 일자를 통해 정보의 최신성 여부도 확인할 수 있습니다. 이 데이터는 공공기관의 정보공개 투명성 강화, 시민 접근성 향상, 데이터 기반 행정정책 수립 등에 활용될 수 있습니다.
