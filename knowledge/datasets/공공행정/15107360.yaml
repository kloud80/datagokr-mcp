summary_user: 행정안전 통계연보 중 '민원 행정' 분야의 무인민원발급기 운영 통계로, 운영대수·발급가능 민원종수·민원발급 건수 같은 전국 단위 집계를 담는다. 무인민원발급기가 몇 대 운영되고 실제로 얼마나 쓰이는지를 확인하려는 정책 분석가나 연구자가 무인 발급 서비스 확대 추세를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 항목 이름이나 기관 기준으로만 맞춰 이어 쓴다.
limits: 범위가 전국·비공간이라 시도·시군구별 설치 위치나 지역 비교에는 쓰지 못한다. 조인 키가 없어 다른 통계와 자동 연계가 어렵다. 호출에는 포털 활용신청으로 받는 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
