summary_user: 대구광역시 북구가 운영하는 규제를 한 건씩 등록한 대장으로, 규제 사무명, 구분·유형·세부 유형, 자치법규와 상위 법령 근거, 사무 특성, 관련 중앙 부처, 소관 부서, 변경 사유, 등록 일자를 담는다. 북구에서 어떤 규제가 어느 조례와 상위 법령에 근거하고 어느 부서가 맡는지 확인하려는 사업자나, 지역 규제 현황을 정리해 개선 과제를 찾으려는 행정 분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군구 명칭(SIGNGU_NM)이나 자치법규·상위 법령 명칭을 이름으로 맞춰 자치법규·법령 데이터와 연결한다.
limits: 범위가 시군구 단위(북구)이므로 다른 지자체 규제와 비교하려면 각 기관의 규제등록대장을 따로 모아야 한다. 공통 코드 키가 없어 법령·자치법규 데이터와 연결할 때는 명칭 매칭에 의존해야 하며, 표기 차이에 따른 오매칭에 주의한다.
