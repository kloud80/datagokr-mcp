summary_user: 경기도 지역화폐 결제 내역을 바탕으로 읍면동별·카드업종 대분류별 월간 매출금액과 순위, 비율, 전월·전년 동월 대비 증감값과 증감률을 담은 집계 자료다. 지자체 정책 담당자나 지역경제 분석가가 '우리 동네에서 지역화폐가 어느 업종(유통, 주유·자동차, 의류·잡화 등)에 많이 쓰이고 작년보다 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 읍면동코드(emd_cd)와 기준년월을 이름·코드 매핑하거나 같은 경기도 데이터분석 시리즈의 코드로 맞춰 다른 상권·인구 자료와 잇는다.
description_portal: 이 데이터는 지역화폐를 활용한 소비 내역을 기반으로 경기도 각 읍면동에서의 업종별 월간 매출 정보를 제공하는 자료입니다. 주요 항목으로는 기준년월, 읍면동코드, 중분류업종코드, 발행구분코드, 매출금액, 매출금액 순위, 매출금액비율, 전월 대비 및 전년 동월 대비 증감값과 증감비율, 그리고 (대분류)업종명이 포함되어 있습니다. 유통, 주유/자동차, 의류/잡화, 서적/문구 등 생활과 밀접한 업종을 중심으로 한 데이터로, 지역 내 업종별 소비 비중과 증감 추세를 분석하는 데 유용합니다. 이 자료는 지역화폐 정책의 효과 분석, 지역경제 흐름 파악, 업종별 매출 트렌드 연구 등에서 활용할 수 있으며, 특히 정책입안자나 지역경제 분석기관에서 실증적 자료로서 활용가치가 높습니다.
