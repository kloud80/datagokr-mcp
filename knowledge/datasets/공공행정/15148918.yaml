summary_user: 서울시설공단 장사시설에서 판매하는 봉안용기(유골함)를 품목 하나당 한 행으로 담은 목록으로, 품명·재질·규격·원산지·판매단가·입고단가·사용여부를 포함하며 포털 설명상 35종, 재질은 도자기·자개·목재·향나무·전분·황토 등이고 판매가는 6,000원~243,000원이다. 장례를 준비하는 유족이 "공단 장사시설에서 살 수 있는 봉안용기는 어떤 재질이고 가격대는 얼마인가"를 비교하거나, 분석가가 공공 장사시설의 용품 가격 수준을 살펴보는 데 쓴다. 다른 데이터와 이을 공통 조인 키는 없고, 장사시설 관련 자료와는 기관명(서울시설공단)이나 품명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 서울시설공단 장사시설 봉안용기에 대한 정보입니다. 데이터 관리 항목으로는 봉안용기함번호, 봉안용기품명, 재질, 규격, 원산지, 판매단가, 이미지여부, 등록일, 웹노출여부, 입고단가, 용기함사용여부, 수정일에 대한 정보를 담고 있습니다.현재 서울시설공단 장사시설에서 판매중인 봉안용기에 대한 정보로 봉안용기함은 총 35가지입니다.봉안용기 재질은 주로 도자기, 자개, 목재, 향나무, 전분, 황토 등이 있고, 판매단가는 최소 6,000원부터 최대 243,000원으로 형성되어 있습니다.
