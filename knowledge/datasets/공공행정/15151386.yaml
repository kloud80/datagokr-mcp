summary_user: 조달청 공사원가통합관리시스템의 표준공사코드 체계 중 공통자재의 정기 자재단가를 자재코드·자원명·규격·단위·재료비단가 단위로 담은 전국 범위 CSV 파일(약 79만 바이트)이다. 수요기관 담당자나 설계사무소가 시설공사 내역서를 작성할 때 "이 규격 자재의 표준 재료비 단가는 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 공사원가 데이터와는 자재코드나 자원명·규격명을 맞춰 연결해야 한다.
description_portal: ○ 시설공사 원가계산에 사용하는 자료를 목록화하고, 개방형 설계내역서 자료 호환 양식인 공사원가호환규정을 수립하여, 공사원가계산을 웹에서 처리할 수 있는 시스템을 개발○ 조달청 공사원가통합관리시스템(https://npccs.g2b.go.kr)에서 제공하는  표준공사코드의 세부항목을 제공하는 서비스○ 공사원가 산정업무의 효율성과 가격의 객관성을 확보하기 위해 ‘표준공사코드’ 체계를 운영 중○ 시설자재, 노무비, 기계경비, 세부공종 등에 대해 수요기관이 공사내역 작성 시 활용할 수 있도록 표준공사코드를 제공○ 공통자재의 자재코드, 자원명, 자원규격명, 단위, 재료비단가, 비고내용을 조회"
