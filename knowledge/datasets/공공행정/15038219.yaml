description_portal: 경상북도 경주시에서 운영 중인 행복택시의 운행 현황 정보를 수록한 데이터이다. 해당 데이터는 운행기간, 운행지역, 운행횟수, 평균이용자수, 기준일자 항목으로 구성되어 있으며, 교통 소외지역 주민의 이동 편의 증진을 위한 정책 자료로 활용된다. 감포읍, 안강읍, 건천읍 등 읍·면 단위 지역의 실질적인 운행 실적을 바탕으로, 대중교통 접근성 개선 여부를 파악하는 데 유용하다. 본 자료는 공공교통서비스 수요분석, 맞춤형 교통복지 서비스 기획, 지자체의 교통 인프라 확충 계획 수립 등에 활용될 수 있다. 연도별 통계 분석 또는 지역 간 비교 분석을 위한 기초 자료로도 사용 가능하며, CSV 형식으로 제공되어 데이터 가공과 분석이 용이하다.
