summary_user: 창원시 각 구의 월별 유동인구수를 구 단위로 집계한 파일로, 포털 설명상 2020년 1월부터 2022년 11월까지의 기준년월·구단위코드·구·유동인구수를 담는다(약 5.7KB 규모의 작은 CSV). 상권 분석가나 시·구 담당자가 '코로나19 기간 창원시 어느 구의 유동인구가 얼마나 줄고 회복됐나' 같은 구별·월별 추이 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구 이름이나 같은 기관의 구 코드를 매핑해 행정동·상권 단위 자료나 인허가(LOCALDATA) 자료와 이어 써야 한다.
description_portal: 경상남도 창원시의 월별, 구별 유동인구수입니다. 항목은 기준년월, 소지역블럭코드, 구, 유동인구수 입니다. 2020.1.~2022.11.까지의 자료입니다.월별·구별 유동인구 데이터는 특정 월 기준으로 창원시 각 구에 유입·유출된 유동 인구 수를 집계한 자료입니다. 이 데이터는 지역별 유동인구 분포 분석, 상권 및 교통 인프라 계획, 관광 수요 예측, 시간대별 유입 패턴 파악, 정책 타깃 설정과 민원 대응 등에 활용될 수 있습니다. 특히 GIS 기반 시각화와 시간적 비교 분석을 통해 구역별 활성화 전략 수립, 공공 서비스 효율 향상 및 도시 계획의 기초 자료로 적합합니다.
