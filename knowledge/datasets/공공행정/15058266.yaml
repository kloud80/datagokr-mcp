summary_user: 중앙정부 법령과 이를 근거로 한 지방자치단체 자치법규의 조문·조항 연계 목록을 법령 기준으로 조회하는 외부 API이다. 전국 범위이며, 법령과 자치법규의 정합성이나 조문별 대응 관계를 점검하려는 분석가·법제 담당자가 쓴다. 필드에 법령ID·법령일련번호가 있어 같은 법제처 법령 데이터와는 이를 기준으로 이을 수 있으나, 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
description_portal: 본 데이터는 중앙정부 법령과 지방자치단체 자치법규 간의 조문 및 조항 연계 정보를 제공합니다. 각 항목에는 기준이 되는 법령의 고유번호, 해당 조항, 대응하는 자치법규의 명칭과 번호, 연계 코드, 법령의 제정·개정·공포일자 및 자치법규의 제정·시행일자가 포함되어 있습니다. 또한 지방자치단체의 행정구역 정보와 법령 적용 대상 범위, 관련 부처 및 법령 분야 분류 데이터가 수록되어 있습니다. 이 데이터는 중앙과 지방의 법규 정합성 확인, 하위 법규의 자치법규 일치 여부 점검 및 조문별 대응 관계 분석에 적합합니다. 법령 준수 여부 확인, 법제 행정의 통합적 이해, 법적 일관성 확보와 자치법규 관리 업무에 유용합니다.
