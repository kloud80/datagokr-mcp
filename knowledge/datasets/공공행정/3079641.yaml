description_portal: 행정동별 성별 연령별 주민등록 인구에 대한 데이터로, 행정동은 주민들이 거주하는 지역을 행정 능률과 주민 편의를 위하여 구분한 행정구역 단위를 말합니다.주민등록 인구 및 세대 등 을 기반으로 선거, 교육, 조세, 복지, 교통, 지역 개발 등 다양한 분야에 적시성 있는 통계를 제공하고 있습니다. 이러한 통계는 지역 행정 및 정책 수립에 필요한 기초 자료로 활용되고 있습니다.주민등록 인구통계는 인천광역시 중구 홈페이지 주민등록 인구통계(https://www.icjg.go.kr/krop020703tb), 행정안전부 주민등록 인구통계 홈페이지(https://jumin.mois.go.kr), 공공데이터포털(https://data.go.kr), 국가통계포털(KOSIS) 등에서 확인 및 다운로드가 가능합니다.
