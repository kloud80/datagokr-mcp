description_portal: 최저임금위원회에 대한 기본정보,  구성, 연혁, 연락처 등을 제공하고 있습니다.최저임금위원회는 최저임금법 제12조에 근거하여 설치된 고용노동부 소속기관으로, 최저임금에 관한 심의와 그 밖에 최저임금에 관한 중요사항을 심의하는 기관입니다.근로자위원, 사용자위원, 공익위원 각9명씩 총 27명으로 구성되어 매년 최저임금 수준을 심의.의결하며, 최저임금에 관한 심의 및 재심의, 최저임금 적용 사업의 종류별 구분에 관한 심의, 최저임금제도의 발전을 위한 연구 및 건의, 그 밖에 최저임그에 관한 중요한 사항으로 고용노동부 장관이 회의에 부치는 사항을 심의하는 기능을 수행하고 있습니다.
