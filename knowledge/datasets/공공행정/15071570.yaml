summary_user: 서울시에 인허가된 소독업체를 업체(관리번호) 단위로 한 건씩 담은 원천 인허가 목록으로, 인허가·취소·폐업 일자, 영업 상태, 주소·좌표·전화번호, 사무실·차고 면적, 분무기·방독면 등 소독 장비와 보호구 보유 수량을 포함한다. 방역 업체를 찾는 시민이나 상권·업종 분석가가 "우리 동네에서 지금 영업 중인 소독업체는 어디이고 장비는 어느 정도 갖췄나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 붙이며, 같은 원천을 쓰는 LOCALDATA 인허가 데이터와 함께 상권·점포 원장 분석의 재료로 쓴다.
description_portal: 서울시 소독업 인허가 정보는 서울시에 인허가된 소독업체에 대한 기본 현황과 행정 이력을 담은 공공데이터입니다. 인허가일자, 취소일자, 영업·휴업·폐업 상태와 같은 인허가 정보를 통해 업체의 현재 영업 여부와 변경 이력을 확인할 수 있습니다. 또한 사업장명, 주소(지번·도로명), 우편번호, 전화번호, 좌표, 소재지·사무실 면적 등으로 업체의 위치와 규모를 파악할 수 있습니다. 아울러 소독차량 차고 면적, 초미립자살포기, 휴대용소독기, 동력·수동식 분무기, 방독면, 보호안경, 보호용 의복, 진공청소기 등 주요 소독 장비·보호구 보유 현황을 포함하여, 각 업체의 실제 소독 수행 능력과 안전·방역 수준을 비교·분석하는 데 활용할 수 있는 인허가 데이터입니다.
