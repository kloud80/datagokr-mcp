description_portal: 지방자치단체 재정 운영의 투명성과 공공조달 과정의 공개성에 대한 시민들의 요구가 점점 높아지고 있습니다. 특히 수의계약 제도의 공정한 운영과 계약 과정의 투명성 확보를 통해 부정부패를 방지해야 한다는 필요성이 크게 부각되고 있습니다. 또한 소규모 용역 및 전문 서비스 발주 과정의 효율성 제고와 함께, 지역 전문업체의 참여 기회를 확대하는 것이 중요한 과제로 떠오르고 있습니다. 이에 따라 수의계약 기준과 절차의 적정성을 검증할 수 있는 시민 감시 기능 강화 요구도 증가하고 있으며, 지역 중소업체와 전문서비스 업체의 경영 안정성을 지원하기 위한 공공 용역 정보 제공 필요성도 커지고 있습니다. 더불어 시민들의 세금 사용 내역에 대한 알 권리를 보장하고, 공공 용역의 효율성을 검증할 수 있도록 관련 정보를 투명하게 공개하는 것이 핵심 과제로 대두되고 있습니다. 이러한 상황에서 대구광역시 동구는 관내에서 수의계약으로 계약 정보, 계약 상대방 등 공공 예산 집행과 관련된 주요 정보를 종합적으로 제공하고 있습니다. 이를 통해 수의계약 제도의 적정한 운영과 조달 시스템의 신뢰성 제고를 도모하고 있습니다. 공개된 데이터에는 계약구분, 관서명, 계약명, 계약금액(원), 계약일, 계약대상자 등 총 6개 항목의 상세 정보가 포함되어 있습니다. 이러한 데이터는 ▲전문서비스업체·컨설팅 업체가 수주 기회를 발굴하고 사업 전략을 수립하는 데 활용할 수 있고, ▲시민 및 시민단체가 수의계약의 적정성을 확인하여 행정을 감시하고 공공조달 투명성을 모니터링하는 데 기여하며, ▲연구기관·정책분석기관이 공공조달 제도의 운영 효과성과 개선 방향을 분석하는 데 활용할 수 있습니다.
