summary_user: 지방자치단체별로 회계연도의 결산서를 담은 목록 데이터로, 연도(fyr)·자치단체명·자치단체 코드와 함께 결산서 문서로 가는 링크 이름·주소를 제공한다(범위는 전국, 공간정보 없음). 주민이나 분석가가 "우리 구의 작년 예산이 실제로 어떻게 집행됐고 잉여금이나 적자가 있었나"를 확인하려 할 때 해당 지자체 결산서 원문을 찾는 입구로 쓴다. 전역 조인 키는 없으므로 다른 지방재정365 데이터와는 자치단체 코드(laf_cd)나 자치단체명, 회계연도를 맞춰 연결한다.
description_portal: 우리 지자체 결산서는 지방자치단체가 한 해 동안의 예산 집행 결과를 기록한 공식적인 재무 보고서입니다.결산서는 해당 연도의 수입과 지출 내역을 포함하여, 재정 상태를 정확히 파악하고 투명성을 높이는 역할을 합니다. 이는 지방자치단체가 예산을 어떻게 집행했는지, 예산의 몾겅에 맞게 사용됐는지, 그리고 잉여금이나 적자 여부를 확인할 수 있는 중요한 자료입니다.결산서는 지방의회와 주민들에게 공개되어 재정 운용에 대한 책임을 다하는 중요한 지표로 기능하며, 차기 예산 편성에도 영향을 미칩니다.
