description_portal: 이 데이터는 한국가스기술공사의 홈페이지에 게시된 회사행사 정보를 정리한 자료로 연도별 주요 행사명과 개최일, 장소, 등을 포함하고 있습니다.이 데이터는 2015년부터 2025년까지 약 11년간의 행사로 이사회, 안전점검의날, 국정감사, 임시주총, 시무식, 확대간부회의,  정비기술경진대회, 사회공헌활동 등 한국가스기술공사 해온 다양한 회사행사 내용을 각 지사 및 지역별로 나타내고 있습니다.이 자료를 통해 한국가스기술공사의 주요 발자취를 알 수 있으며, 사회공헌이나 명절행사 등 타 기관이 업무에 활용 할 수 있습니다.
