description_portal: 이 CSV 데이터는 대전광역시 서구의 옥외광고물 허가·신고 현황을 체계적으로 정리한 행정관리 데이터로, 지역 내 광고물 설치·운영 현황을 객관적으로 파악할 수 있게 구성되어 있습니다. ‘허가신고구분명’은 광고물이 허가 대상인지 단순 신고 대상인지를 구분하며, ‘광고물종류명’은 간판, 현수막, 입간판 등 설치물의 유형을 명시합니다. ‘업소명’은 광고물을 설치한 주체 또는 사업체명을, ‘표시시작일자’와 ‘표시종료일자’는 해당 광고물의 설치 및 게시 기간을 나타냅니다.‘지번주소’와 ‘도로명주소’는 설치 위치를 이중 표기하여 행정지도 또는 GIS 분석 시 정확한 위치 파악이 가능하며, ‘행정동코드’와 ‘법정동코드’는 행정구역 단위에서 데이터 연계를 용이하게 합니다. 마지막으로 ‘데이터기준일자’는 자료의 최신 갱신 시점을 표시하여 행정업무의 시의성을 보장합니다.이 데이터는 불법광고물 단속, 옥외광고물 허가정책 개선, 도심 경관관리, 광고물 설치밀도 분석 등 공공행정과 도시미관 유지에 필요한 기초자료로 활용될 수 있습니다.
