description_portal: 이 데이터는 「공유재산 및 물품관리법」에 따라 충청북도 진천군에서 관리 중인 군유재산 및 도유재산 중 대부된 일반재산의 현황을 담고 있습니다.공유재산의 회계연도별 대부내역을 기준으로, 대부대상 구분(건물, 토지 등), 물건지 주소, 관리항목 등 관련 정보를 제공합니다.해당 데이터는 지방자치단체의 재산 운용 실태 분석, 공유재산 활용률 파악, 공공자산 민간대부 실태 점검, 유휴공공자산 활용 정책 수립, 공공기관의 자산관리 투명성 확보 등에 활용될 수 있습니다.또한, 시민의 알 권리를 충족하는 공공부문 자산공개 데이터로서 민간·학계·언론에서도 활용도가 높은 자료입니다.
