description_portal: '- 한국전력기술(주)와 해외 기관 간 체결된 업무협약(MOU)의 내역을 정리한 자료입니다.- 해당 데이터는 MOU 체결일자, 상대 기관명, 효력기간, 협약 명칭, 협약의 주요 내용 등의 항목으로 구성되어 있습니다.- 해당 해외 원자력, 에너지, 신재생에너지 분야에서의 기술협력, 사업 공동개발, 현지화 전략 등을 위해 다양한 국가 및 기업과 체결한 협력양해각서의 정보를 포함하고 있습니다.- 해당 데이터는 해외진출 전략 수립, 글로벌 협력 네트워크 분석, 기술이전 및 협업 기회 발굴, 국내외 에너지 산업 정책 수립 및 연구 자료로 활용될 수 있습니다.- 개방 데이터는 해외기관 MOU 체결 현황 16건입니다.'
