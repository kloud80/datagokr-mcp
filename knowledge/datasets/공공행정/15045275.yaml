description_portal: '이 공공데이터 목록에는 사천시의 주요 공중위생업소 5개 분야에 대한 상세 정보가 포함됩니다.숙박업: 호텔, 모텔 등 잠자리와 시설을 제공하는 업소이미용업: 머리, 피부, 화장, 손톱 등 미용 서비스를 제공하는 업소목욕업: 목욕장, 찜질방 등 목욕 및 관련 시설을 제공하는 업소세탁업: 의류 등을 세탁하고 건조하는 서비스를 제공하는 업소건물위생관리업: 건물 청소 대행 및 위생 관리를 전문적으로 수행하는 업소각 업소에 대해 업소명, 주소, 연락처, 영업 상태 (정상, 휴업, 폐업), 신고/허가 일자 등의 구체적인 항목이 포함되어, 시민들이 안심하고 시설을 이용할 수 있도록 합니다. 이 정보는 사천시가 지역 공중위생 수준을 관리하고, 지도·점검을 효율적으로 수행하기 위한 행정의 기초 자료로도 활용됩니다.'
