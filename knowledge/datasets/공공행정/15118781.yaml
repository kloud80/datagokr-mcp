summary_user: SH공사가 보유한 특허를 한 건씩 정리한 소규모 파일(csv 약 6.8KB)로, 특허명·출원번호·출원일자·등록번호·등록일자와 최대 6개의 공동 특허권자를 담는다. 기술이전이나 공동연구를 검토하는 기업·연구자가 SH공사가 어떤 건축·주거 기술을 특허로 보유하고 누구와 공동 보유하는지 확인할 때 쓴다. 출원번호(kipo_appl_no)와 등록번호(kipo_rgst_no)를 키로 특허청(KIPRIS) 특허 공보·서지 정보와 이어 청구항·법적 상태를 확인하는 데 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)와 관련된 특허권 보유 현황을 정리한 파일 데이터로, 공사가 개발·보유하고 있는 지식재산권의 관리 및 활용 실태를 파악할 수 있는 자료입니다. 포함된 항목에는 특허명, 출원번호, 출원일자, 등록번호, 등록일자, 특허권자 등이 있으며, 이를 통해 SH공사가 자체 개발한 기술이나 시스템, 설계 기법 등에 대해 어떤 내용을 특허로 보호하고 있는지를 확인할 수 있습니다. 이 데이터는 공공기관의 기술 혁신 역량, 연구개발 성과, 기술 자산 관리 현황을 분석하는 데 활용될 수 있으며, 향후 기술 이전, 민간 협력, 스마트시티·친환경 건축 등 다양한 응용 분야에서의 협업 가능성도 가늠할 수 있습니다. 특허의 출원·등록 흐름을 통해 기관의 지식재산 전략도 간접적으로 분석 가능합니다.
