summary_user: 경기공유서비스(공유누리)의 행정상담서비스별 운영 회차를 한 행씩 담은 원천 목록으로, 요일 구분·회차 순서·회차 시작·종료 시간(30분 단위)과 예약분야·상담분야를 포함한다. 경기도 행정상담을 예약하려는 도민이나 운영 담당자가 '이 상담서비스는 무슨 요일 몇 시 회차에 예약 가능한가', '시간대별 상담 자원을 어떻게 배정할까'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 행정서비스일련번호(administ_servc_sn)와 기관코드로 같은 경기공유서비스의 행정서비스 목록 데이터와 이어 쓴다.
description_portal: 이 데이터는 행정상담서비스의 운영 회차 정보를 제공하는 자료로, 각 행정서비스에 대한 회차별 시간대 및 순서를 포함하고 있습니다. 주요 항목에는 ‘행정서비스일련번호’, ‘기관코드’, ‘예약분야’, ‘상담분야배열’, ‘요일구분’, ‘회차순서’, ‘회차 시작시간’, ‘회차 종료시간’ 등이 있으며, 각 상담 회차의 시작 및 종료 시간을 30분 단위로 나누어 제공합니다. 이 데이터는 행정상담 예약 시스템에서 사용 가능한 시간 구간을 설정하거나, 상담 인원 분배 및 효율적인 운영계획 수립에 활용될 수 있습니다. 또한, 상담 수요 분석, 피크타임 파악, 시간별 자원 배정 등에도 기반 자료로 활용됩니다.
