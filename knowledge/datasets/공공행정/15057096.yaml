summary_user: 지방자치단체별 기금의 수입예산액·수입결산액·지출예산액·지출결산액을 회계연도 단위로 담은 순계결산 기준 집계 데이터로, 포털 설명상 2002 회계연도부터 전국 자치단체를 다룬다. 주민이나 지방재정 분석가가 "우리 시·군·구는 기금을 얼마나 조성해 실제로 얼마를 썼나"를 확인하거나 예산 대비 집행률을 비교하는 데 쓴다. 전역 조인 키는 없으며, 자치단체 코드·이름(laf_cd 등)과 회계연도를 맞춰 같은 지방재정365의 다른 결산·공시 데이터와 연결한다.
description_portal: 지방자치단체 기금은 지방자치단체가 특정한 목적을 달성하기 위해 일정 재원을 장기적으로 조성·관리·운용하는 재정 수단으로, 일반회계나 특별회계와는 별도로 운영됩니다. 기금은 「지방재정법」 제43조 및 해당 지방자치단체의 조례에 따라 설치되며, 교육, 복지, 환경, 재난관리 등 다양한 분야에서 활용됩니다.기금은 해당 목적에 따라 자율적이고 탄력적인 운용이 가능하다는 장점이 있으며, 예산 편성과 집행의 유연성을 높이는 역할을 합니다.지방자치단체 기금결산 정보는 2002 회계연도부터 제공되며, 자치단체 순계결산 기준으로 구성되어 있습니다. 주요 제공 항목에는 자치단체별 기금의 수입예산액, 수입결산액, 지출예산액, 지출결산액 등이 포함되어 있어, 기금의 조성과 집행 실적을 파악할 수 있습니다.이러한 기금 결산 정보는 주민에게 재정 운영의 투명성을 제공하며, 향후 기금 운용 방향 설정과 재정 건전성 확보에 중요한 참고자료로 활용됩니다.
