description_portal: '농식품 공공데이터 포털에 개방한 농산 데이터 목록으로 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함유무, 상위분류, 제3자권리, 이용허락범위, 업데이트주기, 서비스 유형 등의 정보를 포함하고 있습니다. 이 데이터는 농산물 생산, 소비, 유통 관련 정보를 포괄적으로 제공하며, 이를 통해 농업 정보에 대한 연구 및 정책 수립에 기여할 수 있습니다. 이 데이터를 활용하면 농업 관련 기관, 연구자, 농민들이 농산물의 생산 실적 및 재배 현황을 파악하는 데 큰 도움이 됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(숫자형): 농산 데이터 세트의 고유 ID, 데이터셋명(문자형): 데이터 세트의 이름, 데이터셋설명(문자형): 데이터 세트에 대한 상세 설명, 기관명(문자형): 데이터를 제공하는 기관의 이름, 담당자명(문자형): 데이터 관련 담당자의 이름, 전화번호(숫자형): 담당자에게 문의할 수 있는 전화번호, 키워드(문자형): 데이터와 관련된 검색어들, 기타유의사항(문자형): 데이터 사용 시 주의할 사항 등의 컬럼으로 구성되어 있습니다.'
