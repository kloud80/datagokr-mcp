summary_user: 광주광역시 기관이 운영하는 공공시설별로 이용요금 감면자격 확인 대상 항목(국가유공자·기초생활수급자·장애인·다자녀 등)과 담당 전화번호를 시설 단위 한 줄씩 정리한 목록이며, 파일 크기는 약 9.5KB로 작은 규모입니다. 시민이 '이 시설을 이용할 때 내가 어떤 자격으로 요금 감면을 받을 수 있나'를 확인하거나, 분석가가 기관·시설별로 감면 자격 항목이 어떻게 다른지 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·시설명 같은 이름 매칭으로만 연결하며, 공공시설 개방 표준데이터와도 이 방식으로 이어 쓴다.
description_portal: 이 데이터는 광주광역시에서 운영하는 공공시설의 이용요금 감면서비스 제공 현황을 체계적으로 관리하기 위한 자료입니다. 비대면자격확인서비스를 통해 국가유공자, 기초생활수급자, 장애인, 친환경차 이용자,  다자녀가정, 만65세 이상 어르신 등 감면대상자의 자격을 실시간으로 검증하여 현장에서 자동으로 요금 감면을 적용할 수 있도록 지원합니다. 기관명, 시설명, 감면자격 항목, 담당자 연락처 등의 정보를 포함하며, 시민의 이용편의 증진과 사회적 약자 복지 향상을 목적으로 구축된 데이터입니다.
