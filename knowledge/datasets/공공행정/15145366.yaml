description_portal: 통계청의 감사업무를 지원하기 위한 감사정보시스템(e-감사)의 자료입니다.  감사정보시스템(e-감사)은 감사 업무 전반을 전산화하여 감사계획 수립, 자료 수집 및 분석, 보고서 작성, 감사 결과 관리 등을 지원하는  정보시스템으로, 첨부된 자료의 내용은 통계청의 감사법규  및 알림마당 내용, 질문과 답변제목 및 답변내용, 감사계획 및 감사결과 공개자료, 첨부파일 내용(원본파일명, 확장자, 파일크기), 코드테이블 정보가 포함되어 있습니다. 또한, 통계청 자체감사(내부감사)자료로 개인정보가 포함된 자료는 비공개 처리하였습니다.
