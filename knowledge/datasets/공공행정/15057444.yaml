summary_user: 전국 지방자치단체의 자산 대비 부채비율을 담은 지방재정365 공시 지표로, 필드 구성상 회계연도·자치단체별로 부채액, 자산액, 부채비율이 한 행씩 들어 있는 집계 데이터로 보인다. 분석가나 주민이 '우리 시·군·구의 부채가 자산에 비해 얼마나 되며 광역 내 다른 자치단체와 비교하면 어떤가' 같은 재정 건전성 질문에 쓴다. 전역 조인 키는 없으므로, 자치단체 코드(laf_cd)와 광역 코드, 자치단체명을 기준으로 같은 지방재정365의 다른 공시 지표와 연결한다.
description_portal: 채권현황은 지방자치단체가 보유하고 있는 채권의 상태와 관련된 정보를 나타내는 지표입니다.이는 자치단체가 채권을 통해 회수해야 할 금액, 채권의 종류, 만기일, 이자율 등 채권과 관련된 모든 세부 사항을 포함합니다. 채권현황을 통해 자치단체는 자산의 유동성, 수익성, 그리고 회수 가능성을 평가 할 수 있습니다.또한 채권을 발행한 이유나 자금 운용 계획을 이해하는 데 중요한 자료가 됩니다.채권현황은 자치단체의 재정 건전성을 평가하고, 향후 재정 상황을 예측하는 데 유용한 정보를 제공합니다.
