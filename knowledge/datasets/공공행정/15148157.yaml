description_portal: '통신판매업에 등록된 사업체의 법인 또는 상호명, 사업장 소재지, 법정동 정보를 수록한 자료.지역 내 전자상거래 사업자 분포를 파악하고, 민원 대응, 소비자 보호, 온라인 유통 관련 정책 수립을 위한 기초자료로 활용됨.활용 목적 및 특징– 통신판매업 등록 현황을 통해 지역 전자상거래 산업 분포 진단 가능– 법정동 단위의 상권 밀도 분석 및 지역 편중 현황 파악– 민원 발생 시 상호명·주소 기반 사업자 확인 및 지도점검에 활용– 통신판매업 관리 행정 및 유통산업 정책 수립 자료로 활용주요 항목 설명● 연번: 각 사업체에 부여된 고유 식별번호● 법인또는상호: 해당 통신판매업 등록 사업자의 명칭● 소재지: 사업장이 위치한 도로명 또는 지번 주소● 법정동: 해당 사업장이 속한 법정 행정동명'
