description_portal: 한국서부발전 산업재산권 기술이전목록 정보입니다. 2차전지의 수명 예측장치 및 방법, 500메가와트급 보일러 연소제어계통 노 내압 안정화 방법, QSC를 활용한 성과 평가방법 및 그 기록매체, 가스 터빈용 주제어 설비의 전원 감시 시스템, 가스터빈 동기기 센서리스 속도 제어를 위한 고정자 자속 추적 방법 및 장치 전동기 속도 추정 장치 및 방법 토크 리플 저감을 위한 터빈 기동장치의 강제전력 제어 시스템, 이의 제어 방법 및 이 방법을 저장한 컴퓨터 판독 기능 저장 매체, 가스터빈 배기가스의 온도 센서 장치, 가스화기 통풍장치, 건조슬러지의 투입장치 및 그의 투입방법, 고전압 임펄스 장치, 굴패각을 이용한 액상소석회의 제조방법 및 제조시스템, 미분기의 화재 감시장치 및 방법, 발전기 고정자 권선의 전용 진동 진단 방법 및 분석시스템, 발전설비용 서버의 사용자 인터페이스 통합 플랫폼 제어장치 등이 있습니다.
