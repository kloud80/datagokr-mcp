summary_user: 서울 강남구 안에서 의약품 조제·판매를 주목적으로 하는 약국을 업소 한 곳당 한 줄로 담은 인허가 원장이다. 인허가일, 영업·폐업·휴업 상태, 주소, 좌표, 사업장명이 들어 있다. 강남구에서 어느 동에 약국이 새로 열리거나 문을 닫았는지, 지금 영업 중인 약국이 어디인지 알고 싶은 개원 예정 약사나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 코드(개방자치단체코드·관리번호)로만 잇는다. 같은 원천인 LOCALDATA 인허가 자료와는 함께 쓴다.
