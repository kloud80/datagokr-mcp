description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에 설치된 다양한 홍보전광판의 현황을 체계적으로 정리한 정보입니다. 시민들에게 공공정보와 홍보 내용을 더욱 효과적으로 전달하기 위해 운영 중인 LED 전광판, 디지털 디스플레이 등 멀티미디어 홍보시설의 세부 정보를 담고 있으며, 여기에는 위치, 규모, 설치 시기, 운영 방식 등이 포함됩니다. 이 데이터는 공공 홍보매체의 체계적인 관리와 시민들의 정보 접근성 향상을 위한 정책 수립에 중요하게 활용될 예정입니다.2. 데이터 항목명구분, 설치연도, 송출방식, 크기, 표출방식, 위치, 위도, 경도3. 기대 효과본 데이터의 활용을 통해 공공 홍보매체의 전략적 배치와 운영 효율성을 크게 높일 수 있으며, 시민들의 공공정보 접근성 개선과 지역 간 정보 격차 해소에 실질적으로 기여할 것으로 기대됩니다.
