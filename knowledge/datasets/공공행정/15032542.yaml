description_portal: 서울특별시 은평구_행정사 현황입니다. 속성은 행정사종류, 명칭, 소재지, 전화번호, 영업상태 등으로 구성되어 있습니다."은평구 행정사 현황" 데이터는 행정사 사무소의 종류, 명칭, 소재지, 전화번호, 영업상태 등 기본정보를 포함합니다. 이 데이터는 각종 인허가, 행정심판, 이민·출입국 관련, 행정절차 대리, 민원 서류작성 등 시민 행정지원 현황을 한눈에 보여줍니다. 은평구는 최근 ‘마을행정사’ 제도를 시범 도입해, 각 동별 1명 이상의 마을행정사를 위촉하여 주민들의 권리구제, 행정서비스, 법률상담, 서류 작성 등을 무료로 지원하고 있습니다. 해당 제도는 주민행정 접근성을 높이고, 복지·행정 사각지대를 해소하는 사회적 실험으로 주목받고 있습니다. 데이터는 지역 내 행정복지 연계, 법률문해력 강화, 시민참여 행정에 기초자료로 활용됩니다
