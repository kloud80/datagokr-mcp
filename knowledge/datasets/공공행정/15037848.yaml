summary_user: 해운대구의회에 제출된 조례안·예산안·결산안·청원·결의안 등 의안을 건별로 담은 파일(CSV 약 351KB)로, 의안번호·회기·안건명·제출일·제출자와 소관상임위 심사 처리일·결과, 본회의 의결 처리일·결과, 이송일·공포자까지 처리 단계를 한 행에 기록한다. 주민이나 분석가가 "특정 회기에 해운대구의회가 어떤 조례안을 누가 냈고 상임위·본회의에서 어떻게 처리했나"를 확인하거나, 회기별·제출자별 처리 추이를 집계하는 데 쓴다. 전역 조인 키는 없어 다른 지방의회 의안정보나 자치법규 데이터와는 안건명(조례명)·회기 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 「부산광역시 해운대구 지방의회 의안정보」는 해운대구의회에서 상정·심의·의결된 조례안, 예산안, 결산안, 청원, 결의안 등 의안의 목록과 속성값을 제공하는 공공데이터다. 주요 항목은 의안번호, 회기, 안건명, 발의자(의원·위원회·구청장), 소관위원회, 처리결과, 처리일자, 의안유형, 비고 등으로 구성되며 회기별 비교와 검색이 가능하다. 이용자는 회기별 안건 흐름과 처리 추이를 파악하고, 유형별 통계 작성, 정책 변화 분석, 의정활동 공개 및 주민 참여 확대 등에 활용할 수 있다. 자료는 의회 운영 과정에서 변동될 수 있어 정정·보완 등 현행화가 이뤄진다.
