summary_user: 서울 강동구 관내 동주민센터를 한 곳당 한 행으로 담은 시설 목록 파일(csv, 약 2.8KB)로, 시설명·도로명/지번 주소·위도·경도·대표 전화·팩스번호를 담는다. 주민이 "우리 집에서 가장 가까운 동주민센터는 어디이고 전화번호는 무엇인가"를 확인하거나, 생활정보 서비스 개발자가 지도에 주민센터 위치를 표시하는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 이어 써야 한다.
description_portal: 서울특별시 강동구 관내 다양한 대민 행정업무를 수행하는 동주민센터 현황을 제공하는 공공데이터입니다.본 데이터는 지역 주민의 생활과 가장 밀접한 공공기관인 주민센터의 시설명, 주소(도로명, 지번), 위도, 경도, 대표 전화번호, 팩스번호 등의 정보를 담고 있습니다.동주민센터는 주민등록, 전입신고, 각종 증명서 발급, 복지 상담 등 주민 생활과 밀접한 행정서비스를 제공하는 기관입니다. 본 자료는 주민이 거주지 인근 동주민센터의 위치와 연락처를 쉽게 확인하고, 필요한 민원 및 복지 서비스를 편리하게 이용할 수 있도록 지원합니다.또한 위도와 경도 정보를 활용하여 지도, 내비게이션, 지역 생활정보 서비스 등에 동주민센터 위치를 표시하고 길 안내 기능을 제공하는 데 활용할 수 있습니다. 행정기관은 주민센터 현황 관리와 생활밀착형 행정서비스 안내를 위한 기초자료로 활용할 수 있습니다.
