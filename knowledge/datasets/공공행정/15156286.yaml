description_portal: '강화군 제5대 의회에 열렸던 의안정보입니다. 고유번호, 의회코드, 대수, 대수시작일, 대수종료일, 의안번호, 의안 등으로 구성되어 있습니다.(데이터값이 공란인 부분은 절차에 해당하지 않는 경우에 공란 처리하였습니다.)○ 공개 테이블: 의안정보(tb_bill), 의안종류정보(tb_bill_kind), 의안처리정보(tb_bill_process_code), 의안발의_제출_자분류정보(tb_bill_prop_kind), 의안처리형식정보(tb_bill_result_kind)강화군은 정보시스템의 미개방 공공데이터 개방 확대를 위해 기관메타관리시스템에 등록된 홈페이지 DB 테이블을 네거티브 방식으로 전면 개방 검토하고있으며, 이 데이터는 메타관리시스템 기반 공공데이터 중장기 개방(2025) 목록 데이터입니다.'
