description_portal: '청계천에서 수거한 동전의 개수를 집계하여 제공하는 데이터입니다.파일 데이터에서 일자별로 수거 장소와 10원, 50원, 100원, 500원 동전 권종별 개수와 총계(동전 권종별 총액)를 확인할 수 있습니다.처리일자는 2005년 12월 31일부터 2025년 8월 24일까지이며, 처리일자는 YYYYMMDD 형식(예: 20051231)으로 표기됩니다.장소는 팔석담, 청계광장 상부폰드, 스프링 수조, 스프링 구조물, 팔석담~모전교 교량 하부 등이 있습니다.총액(총계)는 동전 권종별 수량을 금액으로 환산하여 합산한 값 의미하며, 최소는 0원에서 최대 3,586,169원으로 집계되었습니다.※ 제공하는 정보- 일자별 수거 동전 현황- 10원, 50원, 100원, 500원의 동전 수량 및 총액- 기간 : 2005년 12월 31일 ~ 2025년 8월 24일'
