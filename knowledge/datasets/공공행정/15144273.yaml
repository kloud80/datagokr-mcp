summary_user: 2024년 4월 10일 제22대 국회의원선거의 비례대표 개표결과를 전국 시도·구시군·읍면동·투표구 단위로 정당별 득표수까지 담은 건별 원천 파일이며, 790,524행 규모다. 분석가나 유권자가 '우리 동네 투표구에서 정당별 득표가 어떻게 나뉘었나' 같은 지역별 정당 득표 분포를 보는 데 쓴다. 필드에 전역 조인 키나 코드표가 없어 다른 데이터와는 시도·구시군·읍면동 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 타 데이터와 결합하려면 지역 이름 매핑이 따로 필요하다. 지역구 선거 개표결과는 이 파일에 없고 별도 데이터에 있으며, 선거 때 생성된 뒤 바뀌지 않는 이벤트성 데이터라 선거 회차별로 별도 파일을 받아야 한다.
