description_portal: 기술료 수취 유형 현황 데이터는 2022년 대학 산학협력활동실태조사 결과를 토대로 국내 대학에서 발생한 기술료의 수취 유형별 현황 정보를 체계적으로 제공합니다. 대학 유형별로 정액기술료 일시불, 분납, 선급 및 경상기술료, 경상기술료, 기타 등 다양한 기술료 수취 방식에 대한 합계와 연도별 통계 정보가 포함되어 있습니다. 이 자료는 대학의 기술이전 및 산학협력 수익 구조 분석, 기술료 정책 수립, 대학별 비교 연구 등의 다양한 분야에서 활용 가능합니다. 연간 주기로 업데이트되어, 수정일을 기준으로 최근 정보를 확인할 수 있습니다.
