summary_user: 법령별로 개정 전후(신법·구법) 비교 대상 목록을 한 건씩 담으며, 법령명·공포일자·공포번호·시행일자·법령구분·제개정구분·소관부처와 신구법 상세 링크를 함께 제공하고 범위는 전국이다. 법무 담당자나 분석가가 '이 법령이 언제 어떻게 개정됐고 바뀐 조문 비교는 어디서 보나'를 확인하거나, 시행일·개정 이력으로 법적 근거의 변경을 감지하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 다른 데이터와는 법령명 매핑이나 소관부처코드 같은 같은 기관 코드로만 잇고, 조문 비교 본문은 신구법ID·상세링크로 따로 조회한다.
description_portal: 본 데이터는 법령의 개정 전후 내용을 비교하여 제공하는 목록 정보입니다. 법률, 대통령령, 총리령, 부령 등 다양한 법령 유형에 대해 신법과 구법의 조문을 비교할 수 있도록 구성되어 있습니다. 데이터는 법령명, 공포일자, 시행일자, 법령종류, 소관부처, 신구법 비교 ID 등의 항목으로 구성되며, 법령 개정의 주요 내역을 체계적으로 제공합니다. 이를 통해 특정 법령의 제정, 개정, 폐지 등 입법적 변동사항을 명확히 파악할 수 있습니다. 목록 형태로 제공되므로 여러 법령의 변동사항을 일괄적으로 조회할 수 있으며, 법령의 연혁 관리 및 조문 단위의 이력 파악에 유용합니다. 법령의 변화 과정을 객관적으로 분석하는 데 활용할 수 있는 기초 정보를 제공합니다.
