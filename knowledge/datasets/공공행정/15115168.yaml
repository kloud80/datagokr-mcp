summary_user: 서울특별시 강남구에 있는 일반여행업 업소를 한 건씩 담은 인허가 원장으로, 업소별 관리번호, 인허가·취소일자, 영업상태(영업·휴업·폐업), 휴·폐업일자, 주소, 전화번호, 좌표를 기록한다. 강남구에서 지금 영업 중인 여행사가 어디인지, 특정 여행사가 언제 인허가를 받고 폐업했는지를 확인하거나 상권 분석에서 업소 개폐업 이력을 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 원천이 같은 LOCALDATA 인허가 자료와 대조해 쓴다.
description_portal: 서울시 강남구 일반여행업 인허가 정보(https://data.seoul.go.kr/dataList/OA-17624/S/1/datasetView.do)서울특별시 강남구의 국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
