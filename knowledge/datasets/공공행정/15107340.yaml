summary_user: 행정안전 통계연보 '지방행정/지역발전 > 인구' 편에 실린 유형별 지방자치단체 외국인 주민 통계로, 외국인근로자·결혼이민자·유학생 등 한국 국적이 없는 주민을 유형별·지방자치단체별로 집계한 전국 범위 자료입니다. 분석가나 지자체 담당자가 "우리 시도에 결혼이민자와 외국인근로자가 각각 얼마나 사는가"처럼 지역별 외국인 주민 구성을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 주민등록 인구 등 다른 지역 통계와는 지자체 이름을 매핑해서만 이어 쓴다.
limits: 공간 정보가 없는 연보 집계여서 건별 외국인 정보나 행정동 단위 분석에는 쓰지 못한다. 행정구역 코드 같은 공통 키가 없어 다른 데이터와 결합하려면 지자체명을 직접 맞춰야 한다.
