summary_user: 지방자치단체별·회계연도별로 행사운영비·행사실비보상금·민간행사사업보조·행사관련시설비 4개 통계목의 행사·축제경비와 그 비율, 전년 대비 증감률을 담은 전국 단위 집계 지표이며, 포털 설명상 일반회계와 기타특별회계를 대상으로 2015 회계연도부터 제공된다. 주민·의회·재정 분석가가 "우리 시군구의 행사·축제 지출이 지난해보다 줄었나, 다른 자치단체와 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없어 자치단체 코드(laf_cd)·자치단체명과 회계연도(fyr)를 기준으로 같은 지방재정365의 다른 공시 데이터와 이름·코드 매핑으로 잇는다.
description_portal: 지방자치단체는 행사·축제관련 경비를 행사운영비(201-03), 행사실비보상금(301-11), 민간행사사업보조(307-04), 행사관련시설비(401-04) 4개 통계목으로 관리하고 있습니다.자치단체 행사·축제경비비율(증감률) 정보는 자치단체의 행사·축제를 위해 지출한 경비의 절감수준을 측정하는 자료로서 전년도의 행사축제경비증감율대비 당해연도 결산상 행사·축제경비비율을 구하여 지난년도 대비 증감율 정보를 제공하고 있습니다대상회계는 일반회계와 기타특별회계가 대상이며 2015 회계연도부터 정보가 제공되고 있습니다.
