summary_user: 2020년 4월 15일 제21대 국회의원선거를 앞두고·치른 뒤 실시한 유권자 의식조사의 응답자별 원자료로, 선거일 전 2차례와 선거일 후 1차례 각 1,500명을 대상으로 선거 관심과 투표참여 형태 등을 묻은 문항 응답을 전국 단위로 담는다. 연구자나 분석가가 '연령대별로 선거 관심도와 투표 참여 의향이 선거가 다가오며 어떻게 달라졌는가' 같은 질문을 응답자 단위로 교차 분석하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 다른 선거 통계와는 선거 회차·연령 같은 항목을 이름으로 맞춰 비교하는 방식으로만 연결한다.
description_portal: '2020년 4월 15일에 실시한 제21대 국회의원선거에 대한 유권자 의식조사로 선거 관심 및 투표참여 형태 등에 대한 유권자 의식과 태도를 조사하여 향후 선거에 대한 국민의 관심과 참여를 높이고, 선거 관련 제반 연구의 기초자료로 활용하기 위함. ※ 본 조사는 선거일 전 2차례, 선거일 후 1차례 총 3차례 진행됨. ▶ 1차 조사: 2020. 3.23. ~ 3.24. (선거일 24일 전) 1,500명▶ 2차 조사: 2020. 4. 5. ~ 4. 6. (선거일 11일 전) 1,500명▶ 3차 조사: 2020. 4.16. ~ 5. 5. (선거일 후) 1,500명'
