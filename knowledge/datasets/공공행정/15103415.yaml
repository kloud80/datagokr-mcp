summary_user: 광주 동구 관내 무인민원발급기별로 2024년 9월~2025년 8월 기간에 발급된 민원서류 건수를 주민등록등본·초본, 토지·건축물대장, 가족관계증명서, 지방세 납세증명, 학교 증명서 등 서류 종류별로 집계해 담은 CSV 파일(약 6.6KB)이다. 구청 민원 담당자나 분석가가 어느 발급기에서 어떤 서류가 많이 뽑히는지 확인해 발급기 배치나 운영 시간 조정을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발급기명(설치 장소 이름)을 수작업으로 맞춰 무인민원발급기 표준데이터 같은 위치 정보와 이어 쓴다.
limits: 발급기 단위로 1년치를 합산한 집계라 월별·시간대별 추이나 개별 발급 건은 알 수 없다. 좌표나 공통 코드가 없어 다른 데이터와 연결하려면 발급기명으로 이름 매칭을 해야 한다.
