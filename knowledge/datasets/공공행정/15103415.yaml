description_portal: 광주광역시 동구에 설치된 무인민원발급기에 접수된 민원 현황입니다. 2024년 9월~ 2025년 8월 기준의 광주광역시 동구에 설치된 무인민원발급기에 접수된 현황 데이터를 포함하고 있습니다. 동구 관내 무인민원발급기는 주요 공공기관과 행정복지센터를 중심으로 설치되어 있습니다. 주요 설치 장소로는 동구청 민원실이 핵심 거점 역할을 하고 있으며, 광주광역시 동구 서남로 1(서석동) 31번지에 위치한 동구청 민원실 입구에 설치되어 있습니다.각 동별 행정복지센터에도 무인민원발급기가 설치되어 있어 주민들의 접근성을 높이고 있습니다. 동구 무인민원발급기는 기본적으로 24시간 연중무휴 운영되는 서비스와 평일 운영 서비스로 구분됩니다. 대부분의 일반 민원서류는 24시간 발급이 가능하나, 부동산 등기사항증명서 및 가족관계증명서류의 경우 제한적으로 운영됩니다.주기적으로 시스템 점검으로 인해 일시적으로 서비스가 중단됩니다. 이는 시스템 안정성 유지와 정기적인 유지보수를 위한 조치입니다.
