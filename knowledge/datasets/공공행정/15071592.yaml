summary_user: 서울시 관내에서 식품을 자동판매기로 판매하는 업소를 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)·업태명·종사자 수 등을 업소 단위로 담는다. 상권 분석가나 식품위생 담당자가 '어느 구·동에 식품자동판매기업이 몰려 있고, 최근 몇 년 사이 폐업이 늘었는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 사업장명 매칭, 또는 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 원천인 LOCALDATA 인허가 자료와 함께 본다.
description_portal: 서울시 식품자동판매기업 인허가 정보는 서울시 관내에서 식품을 자동판매기 등을 통해 판매하는 업소의 인허가 현황과 기본 특성을 제공하는 공공데이터입니다. 인허가일자, 인허가취소일자, 영업상태, 폐업 및 휴업·재개업 일자 등의 정보를 통해 각 업소의 설립과 영업 지속 여부를 시간 흐름에 따라 파악할 수 있습니다. 또한 사업장명, 전화번호, 지번·도로명 주소, 우편번호, 좌표정보를 포함하고 있어 자동판매기업의 위치를 정확히 확인하고 지역별 분포를 분석하는 데 활용할 수 있습니다. 업태구분명과 위생업태명, 영업장 주변구분명 등은 업종 및 위생·입지 특성을 이해하는 데 도움이 되며, 종사자 수와 총인원 정보는 업소의 인력 규모를 가늠하는 데 활용할 수 있습니다. 이 데이터는 서울시 내 식품자동판매 인프라의 현황을 파악하고, 식품위생 관리, 소비자 접근성 분석, 관련 정책 수립과 연구에 기초 자료로 활용될 수 있습니다.
