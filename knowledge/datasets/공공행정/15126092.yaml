summary_user: 국회사무처가 영문으로 게시한 국회 소식과 보도자료를 글 단위로 담으며, 제목(ARTC_TTL)·작성일·원문 링크로 구성된 건별 목록이다. 해외 언론인이나 연구자, 외국인 독자가 특정 시기에 국회가 영문으로 무엇을 알렸는지 확인하고 원문으로 찾아가는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·날짜 같은 이름 매핑이나 같은 기관 데이터 기준으로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
