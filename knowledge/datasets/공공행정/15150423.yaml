summary_user: 경기도 통합홈페이지가 관리하는 도내 시·군 목록을 시군 한 곳당 한 행으로 담은 코드표로, 시군명과 시군코드에 등록·수정일자, 삭제여부, 등록자·수정자 번호 같은 관리 이력이 붙어 있다. 경기도 데이터를 다루는 개발자나 분석가가 "경기도 다른 데이터에 나오는 시군코드가 어느 시·군인가"를 확인하거나, 현재 쓰이는 시·군 목록을 뽑을 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 같은 경기도 데이터의 시군코드나 시군명을 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 통합홈페이지에서 관리되는 경기도 내 시·군의 행정구역 정보를 담고 있습니다. 각 행정구역은 고유의 시군코드를 통해 식별되며, 시군명과 함께 등록일자, 수정일자, 삭제여부 등 행정 처리 과정의 메타데이터가 포함되어 있습니다. 또한 데이터에는 등록자 및 수정자의 번호가 기록되어 있어 관리 이력 추적이 가능합니다. 시군코드는 공공 데이터 및 행정 시스템에서 지역 단위를 구분할 때 사용되는 고유 값으로, 다양한 지역 기반 정책 수립 및 정보 제공 시스템에서 활용될 수 있습니다. 이 데이터는 지역별 행정정보 시스템 구축, 시군 단위의 사용자 맞춤형 서비스 제공, 공공 포털의 지역기반 콘텐츠 자동 연결 등에 활용될 수 있으며, 삭제여부 항목을 통해 현재 사용 여부에 대한 판단이 가능합니다.
