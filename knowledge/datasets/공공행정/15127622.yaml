summary_user: 경기도 시군별로 등록된 건설기계 대수를 관용·자가용·영업용으로 나누어 담은 집계 자료이며, 건별 장비 원장이 아니다. 지자체 담당자나 건설장비 시장 분석가가 "우리 시군에 민간 영업용 건설기계가 공공 보유 장비보다 얼마나 많은가"처럼 소유 형태별 비율을 시군끼리 비교할 때 쓴다. 전역 조인 키가 없어 다른 시군 단위 통계와는 시군명(sigun_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 각 시군구에서 등록된 건설기계의 유형별 보유 현황을 나타내는 자료로, 건설기계의 소유 및 운용 형태를 지역별로 비교할 수 있습니다. 항목으로는 시군구명, 관용대수, 자가용대수, 영업용대수 등이 포함되며, 지역별 공공기관 보유 기계와 민간 사용 기계(자가용 및 영업용)를 구분하여 등록된 대수를 제공합니다. 이 자료는 건설기계의 수요·공급 구조 분석, 장비 배치 최적화, 도시 개발계획 수립, 건설장비 시장조사 등에서 실무적으로 활용될 수 있으며, 자가용과 영업용 기계의 비율 분석을 통해 민간 건설업의 활동성을 유추할 수 있습니다. 또한 각 시군의 건설기계 인프라 비교 및 장비 운영정책 수립에도 활용 가능합니다.
