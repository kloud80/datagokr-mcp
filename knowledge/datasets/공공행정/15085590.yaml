description_portal: '부평구 내 65세 이상 고령 인구를 대상으로 연령(1세 단위), 성별, 동별 인구수 및 구성비를 정리한 통계자료.급속한 고령화에 대응하기 위한 지역별 노인인구 분포 분석 자료로 활용되며, 복지정책, 의료·돌봄 서비스 수요 예측, 관련 행정계획 수립의 기반자료로 활용됨.활용 목적 및 특징– 65세 이상 고령인구에 특화된 통계로 지역별 고령화 수준 진단– 성별 및 연령대별 분석을 통한 복지 사각지대 식별 가능– 행정동별 고령층 비중을 기반으로 돌봄·건강관리 자원 배분 최적화– 연도별 누적 비교를 통한 고령화 속도 및 인구구조 변화 분석 가능주요 항목 설명● 연령(세): 기준 시점 기준 고령자의 나이 (65세 이상, 1세 단위)● 성별: 남성 또는 여성 구분● ○○동인구수 / ○○동구성비: 각 행정동의 해당 연령 인구 수 및 전체 고령 인구 대비 비율 (동별 반복 구조)'
