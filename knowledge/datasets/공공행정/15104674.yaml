description_portal: 이 데이터는 광주광역시 서구 관내에서 2020년 1월부터 2022년 5월까지 실제로 폐업한 사업장에 대한 현황 정보를 담고 있는 공공데이터입니다. 폐업한 업소의 연번, 업종명, 폐업일자, 도로명 주소, 위도 및 경도 좌표 등이 포함되어 있으며, 행정구역 단위에서 소상공인의 업종별 폐업 추세와 지역적 분포를 확인할 수 있도록 구성되어 있습니다. 데이터는 csv 형식으로 제공되며 총 4,173건의 레코드를 포함하고 있어, 폐업 현황에 대한 시계열 분석, 소상공인 정책 수립, 지역경제 변화 분석, 상권 쇠퇴지역 도출 등 다양한 행정 및 연구 목적으로 활용이 가능합니다. 특히 사업체의 폐업일자와 도로명 주소, 위치 좌표가 포함되어 있어 지도 기반의 공간정보 시각화 및 상권 분석 도구와 연계한 활용도가 매우 높습니다. 이 데이터는 광주광역시 서구청에서 수집 및 등록하였으며, 공공저작물로 자유로운 이용이 가능합니다.
