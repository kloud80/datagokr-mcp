summary_user: 경상북도 영천시 안의 경로당을 한 곳당 한 행으로 담은 시설 목록으로, 행정동명·시설명·도로명/지번주소·건물층수·위도·경도와 관리기관·담당부서·전화번호를 담는다. 어르신이나 가족이 '우리 동네에서 가까운 경로당은 어디이고 몇 층에 있나'를 찾거나, 복지 담당자가 읍면동별 경로당 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 행정동명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시의 경로당 현황을 상세하게 기록한 공공데이터입니다. 영천시 내 각 읍면동별로 위치, 건물 층수, 도로명주소, 지번주소, 위도와 경도, 담당 부서 및 연락처 정보가 포함되어 있습니다. 해당 데이터는 지역 내 복지시설의 위치와 운영 현황을 파악하는 데 유용하며, 지역사회 복지 정책 수립과 관련 기관의 행정 업무 수행에 참고자료로 활용될 수 있습니다. 또한, 시민들이 지역 내 경로당 위치를 쉽게 검색하고 접근할 수 있도록 지원하는 목적으로 제공됩니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 사회복지과로 연락주시기 바랍니다.
