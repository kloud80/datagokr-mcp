summary_user: 경기도 3D 스마트화재감시시스템 구축에 쓰인 도로명 목록으로, 도로명 하나하나를 시군구·읍면동 단위로 나누어 도로명코드, 상위도로명, 사용여부와 함께 담는다. 소방·방재 시스템 담당자나 분석가가 '특정 읍면동에 어떤 도로명이 있고 어느 상위 도로에 속하는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 도로명코드·읍면동코드 같은 이름·코드 매핑이나 같은 기관(경기도) 코드로만 이어 쓴다.
description_portal: 이 데이터는 경기도 지역 내 3D 스마트화재감시시스템 구축을 위한 도로명 기반 주소 체계를 제공하는 자료로, 도로명코드, 도로명, 상위도로명, 시군구명, 읍면동코드, 사용여부 등의 정보를 포함하고 있습니다. 도로명은 해당 행정구역의 읍면동 단위로 구분되며, 도로명코드는 고유 식별자 역할을 합니다. 상위도로명번호 및 상위도로명은 해당 도로가 소속된 상위 도로망 정보를 제공하여 주소체계를 체계적으로 구성할 수 있도록 돕습니다. 이 데이터는 3D 공간정보 기반 방재시스템 설계, 도시 교통계획, 주소정보시스템, 소방행정 서비스 등에서 활용 가능합니다.
