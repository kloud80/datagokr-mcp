description_portal: 본 공공데이터는 인천광역시 서구 내 각 행정동별 부동산 거래 현황을 수록한 자료입니다. 본 자료는 물건 수, 토지면적, 건축물 면적, 거래금액 등을 포함하고 있습니다. 이를 통해 인천광역시 서구 내 지역별 부동산 거래 규모와 특징을 비교, 분석할 수 있으며, 부동산 정책 수립 및 부동산 개발 전략에 기초자료로 활용할 수 있을것으로 판단됩니다. 특히 토지 및 건축물의 거래 금액과 면적 정보를 함께 제공해 부동산 시장 동향을 파악하는데 도움이 될것으로 판단됩니다. 본 데이터는 연마다 갱신을 통하여 최신정보를 반영하고 있습니다.
