description_portal: '[SGIS 오픈 플랫폼] "살고싶은 우리동네" 영문서비스의 라이프스타일 데이터입니다.스타일명,상세스타일명,선택기준명,가중치를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 살고싶은 우리동네- 통계에 기반하여 사용자 조건에 맞는 주거지역을 추천해 주는 서비스입니다.- 이용자는 자연, 주택, 지역 인구, 안전, 생활 편의 교통, 교육, 복지 문화 등 7개 카테고리 총 51종의 주거지 선정 조건에 해당하는 추천지역리스트 및 통계정보를 제공'
