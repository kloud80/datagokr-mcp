description_portal: 울산광역시 중구에서 운영중인 옥외광고물관리 시스템 DB 전수조사광고물 관리대상 테이블 추출 내역입니다.데이터목록으로는 조사번호, 전수조사일, 업체명, 업종분류, 시도,구군, 읍면동, 번지, 도로명, 건물번호  등이 있습니다.가로형간판, 돌출간판 등 광고물의 종류와 규격, 수량, 표시 면수, 가로·세로·높이 등 물리적 특성을 함께 수록하여 광고물 규모와 설치 형태를 정량적으로 파악할 수 있습니다.본 데이터는 옥외광고물 허가·신고 업무, 불법·위험 광고물 정비, 도시 미관 관리 및 관련 정책 수립을 위한 기초 행정자료로 활용됩니다.또한 옥외광고물 관리 정책 수립, 정비 우선순위 결정, 도시 경관 개선 및 안전사고 예방을 위한 실무·분석 자료로 활용됩니다.
