description_portal: 대구광역시의 토지거래 현황 공공데이터는 매월 갱신되는 자료로, 대구시 전체 및 각 구·군별 토지와 아파트의 거래 건수 및 거래 금액의 변동률을 제공합니다. 이 토지거래 현황 공공데이터는 해당 월의 전월 대비 및 전년 동월 대비 변동률을 포함하여, 부동산 시장의 동향을 파악하는 데 유용합니다. 데이터는 부동산 거래신고 등에 관한 법률에 따라 수집된 자료를 기반으로 하며, 매월 말일을 기준으로 생성됩니다. CSV, XML, JSON 형식으로 제공되며, 공공데이터포털에서 무료로 다운로드할 수 있습니다.
