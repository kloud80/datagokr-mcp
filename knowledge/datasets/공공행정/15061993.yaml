summary_user: 경기도 양주시의회에 발의된 의안을 건별로 담은 CSV 파일(약 767KB)로, 의회 대수·의안번호·의안명·의안종류·발의일·발의자와 본회의 보고·상정·의결일, 처리결과를 담는다. 시민·언론·연구자가 '양주시의회에서 이번 대수에 누가 어떤 조례안을 발의했고 본회의에서 어떻게 처리됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방의회 의안 데이터와는 기관명·의안종류 같은 이름 기준 매핑으로만 이어 쓴다.
