summary_user: 가맹사업 브랜드별로 가맹점사업자에게 금지되는 경쟁 업종명과 그 업종을 하려 할 때의 허가 절차 내용을 기준년도·브랜드관리번호 단위로 담은 전국 범위 API입니다. 가맹 창업을 준비하는 사람이 "이 브랜드와 계약하면 어떤 업종을 함께 못 하고, 하려면 본부 허가를 어떻게 받아야 하나"를 확인하는 데 쓴다. 브랜드관리번호와 가맹본부관리번호로 같은 공정위 가맹정보 계열 데이터(브랜드·가맹본부 정보)와 이어 쓰며, 실측상 사업자등록번호 같은 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름 매핑으로만 연결된다.
limits: 실측 컬럼에서 전역 조인 키가 없어 사업자등록번호·법인등록번호 기반의 타 기관 연계는 직접 되지 않고 이름이나 공정위 내부 관리번호로만 묶인다. 조회에 기준년도와 브랜드관리번호가 필요하므로 브랜드관리번호를 먼저 다른 가맹정보 서비스에서 얻어야 한다.
