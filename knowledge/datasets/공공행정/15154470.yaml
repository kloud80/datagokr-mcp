description_portal: 한국남동발전 선택적 5조3교대 교대근무조 근태정보 자료입니다.2025년 1월부터 12월까지 근무조 별 일자, 요일별 근태정보를 포함하고 있으며 회사코드별 근태영역이 구분되어 있으며근무조 코드는 0531과 같이 표현되며 근무시간 코드는 0157은 DAY(오전8시부터오후4시), 0158은 AFTER (오후4시부터오후12시)0159는 NIGHT(오후12시부터오전8시)로 표현되며 0160은 비번, 0152는 W근무(대체근무) 형태로 표현됩니다.근무조 코드별 요일유형을 구분하여 근무유형을 평일은 평, 토요일은 토, 일요일은 일로 구분하여 데이터로 제공합니다.5조로 구성되어 3교대로 근무를 하고 있으며 해당자료를 통해 한국남동발전의 교대근무 근태정보 및 조 편성 정보를 얻을 수 있으며해당 근태정보를 참고하여 근무형태별 근무시간을 참고할 수 있습니다.
