description_portal: 인천관광공사의 정보화사업 계획 및 예산현황에 대해 제공합니다.대상기간은 2018년부터 2021년까지이며,각 연도별 예산항목, 사업명, 사업목적, 사업내용, 사업일정, 예산액, 담당부서 등을 제공하고 있습니다.주요 정보화사업으로는 정보시스템 및 홈페이지 유지관리, 전산장비 유지관리, 시스템 추가개발, 전산사무용품 구매, 서버 및 네트워크 장비 등 장비구매, 보안솔루션 구매 및 설치, 개인정보보호 컨설팅 등을수행하였습니다.* 정보화사업이란 정보시스템을 기획ㆍ구축ㆍ운영ㆍ유지보수하거나 정보시스템 감리, 전자정부사업관리의 위탁 등을 하기 위한 사업입니다.
