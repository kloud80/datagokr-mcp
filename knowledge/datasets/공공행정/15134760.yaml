description_portal: 부산도시공사에서 활동한 사회공헌정보를 제공하는 데이터이며, 행사명, 행사내용, 행사시작일자, 행사단체명의 정보를 제공합니다.부산도시공사는 지역사회와 함께 성장하기 위해 다양한 사회공헌활동을 펼치고 있습니다. 주거 취약계층 지원, 환경 보호 캠페인 등 시민 삶의 질 향상과 공동체 가치 실현에 앞장서고 있습니다. 앞으로도 공기업으로서의 책임을 다하며 지속 가능한 사회 발전에 기여할 수 있도록 사회적 가치 실현에 최선을 다하겠습니다.* 주요 사회공헌사업 - 사랑의 연탄나눔 - 김치나눔 - 사랑의 헌혈 행사 - 희망 시설 고치기 - 갈맷길 플로깅 - 사랑의 빵 나눔 행사 등본 정보는 참고 이외 무단 사용을 금지합니다.
