description_portal: 이 통계 데이터는 당해년도 1월 1일부터 12월 31일까지 행정부 국가공무원의 휴직 현황을 직급별로 산출한 인사통계 자료입니다.휴직은 크게 직권휴직과 청원휴직으로 구분됩니다.  직권휴직은 각 기관에서 직권으로 해당 공무원에게 휴직을 명할 수 있으며, 장기요양휴직, 병역복무휴직, 소재불명휴직, 노조전임휴직 등으로 구성되어 있습니다. 그리고 청원휴직은 개별공무원의 청에 의한 것으로 고용휴직, 해외유학휴직, 연수휴직, 육아휴직, 가족돌봄휴직, 배우자동반휴직, 자기개발휴직으로 구성되어 있습니다.해당 통계자료는 일반직공무원 휴직, 특정직공무원 휴직, 별정직공무원 휴직으로 작성되어 있습니다세부 휴직유형이 구분되지 않는 검사 및 교육공무원은 합계만 표시되어 있습니다.
