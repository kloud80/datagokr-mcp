description_portal: 한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지를 통해 정보 공개중인 정부재산 목록 중 불용품 정보를 조회하는 서비스입니다. 이 서비스는 공공기관이 보유하고 있으나 더 이상 활용되지 않는 물품에 대한 정보를 투명하게 공개함으로써, 국민이 해당 자산의 현황을 확인하고 필요에 따라 활용할 수 있도록 지원하는데 목적이 있습니다. 「물품관리법」, 「공유재산 및 물품관리법」에 따르면 불용품(不用品)이란 중앙관서의 장 또는 지방자치단체의 장이 그 소관에 속하는 물품중 사용할 필요가 없거나 사용할 수 없는 물품에 대하여 불요의 결정을 한 물품을 말합니다.
