summary_user: 온비드에 공개된 정부재산 목록 중 중앙관서·지방자치단체가 불요 결정을 내린 불용품을 물품 건별로 담으며, 자산번호·자산명·물품상태·대장수량·대장가액·불용결정일자를 제공하고 범위는 전국(비공간)이다. 공공기관이 더 쓰지 않기로 한 물품 중 어떤 것이 어떤 상태로 얼마의 장부가액에 나와 있는지 확인하려는 국민·사업자나 불용품 발생 현황을 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자산명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓸 수 있다.
limits: 표준 조인 키가 없어 국유재산 PNU나 행정표준코드와 직접 연결되지 않는다. 위치 정보가 없는 비공간 데이터라 지역별 분포를 볼 수 없다. 개발계정은 하루 1,000회로 호출이 제한된다.
