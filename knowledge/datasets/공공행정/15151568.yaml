summary_user: 조달청이 비축물자(알루미늄·구리·아연·니켈·희소금속 등 원자재)의 일자별 판매가격을 품목별로 담은 파일로, 품목명·판매 지방청·판매금액·판매한도수량·판매종료일자를 행 단위로 담는다(csv 약 119KB). 원자재를 쓰는 중소 제조업체가 조달청 비축물자를 어느 지방청에서 얼마에, 어느 수량까지 살 수 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 물품명 같은 이름 매핑으로만 이을 수 있으며, 나라장터 조달 원장(발주→입찰→계약)과 통합번호로 연결되지 않는다.
description_portal: 국제원자재시장동향 일자별 원자재판매가격 안내○ 비축대상물자는 다음의 기준에 해당하는 물자로서 기획재정부장관이 관계중앙행정기관의 장과 협의하여 고시하는 물자는 아래와 같다.(조달사업에 관한 법률 시행령 제3조)- 해외의존도가 높은 물자- 국민생활 안정에 매우 중요한 물자- 방위산업물자의 안정적 생산을 위해 필요한 물자그 밖에 물가안정과 수급조절, 재난·국가위기 등 비상시 대비를 위해 긴급히 대처할 필요가 있는 물자○ 비축대상물자 고시(기획재정부고시 제2014-6호)알루미늄, 구리류, 아연류, 연류, 주석류, 니켈류, 희소금속류(실리콘, 망간, 코발트, 바나듐, 인듐, 리튬, 탄탈럼, 스트론튬, 비스무스), 방산물자용원자재, 재활용원자재, 긴급수급조절물자
