summary_user: 전라남도 해남군의회 의원 명단을 의원 한 명당 한 행으로 담은 파일(csv, 약 1KB)로, 의원명·정당·소속 상임위원회와 시도·의회명을 담는다. 주민이나 분석가가 "현재 해남군의회 의원은 누구이고 어느 정당, 어느 상임위원회 소속인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 시군 의회 의원총람이나 선거 결과 데이터와는 의원명·의회명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 전라남도 해남군 의회의원총람 데이터입니다.이 데이터에는 25년 11월 기준으로 대수, 전후반기, 직위, 의원면, 임기(시작), 임기(만료), 운영위원회, 상임위, 선거구 항목을 제공합니다.- 해남군의회는 91년 제1대부터 시작하여  4년 단위로 시작하여 지금 제9대 군의회가 개회- 의회의원은 총 11명이며 의장 및 부의장은 회기별로 상반기 하반기 2년단위로  나누어 운영- 상임위는 총무위원회와 산업건설위원회를 운영이 외의 해남군의회에 관한 정보는 해남군의회 홈페이지에서 역대의원을 포함하여 의회용어, 의안, 회의록 등 다양한 정보를 확인할 수 있습니다.
