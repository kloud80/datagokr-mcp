summary_user: 서울시 비디오물감상실업 업소를 건별로 담은 인허가 원장으로, 인허가·취소·휴폐업일자와 영업상태, 사업장명·주소·좌표, 시설면적·층수와 조명·음향·환기·비상구 등 시설 여부를 업소 단위로 담는다. 상권 분석가나 자치구 담당자가 '어느 지역에 영업 중인 비디오감상실이 몇 곳이고 언제 생기고 문을 닫았나'를 확인하는 데 쓴다. 전역 조인 키는 없어 관리번호(MGTNO)·주소·좌표나 같은 기관 코드로만 다른 인허가 원장(LOCALDATA 인허가와 같은 출처)이나 상권 격자 자료에 붙여 쓴다.
description_portal: 서울시 비디오물감상실업 인허가 정보는 개인·소규모 공간에서 비디오물을 시청하도록 제공하는 감상실 업소의 인허가 및 영업 현황, 위치·시설 특성을 담은 데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자와 영업상태·상세영업상태를 통해 업소의 설립부터 영업 종료까지 이력을 추적할 수 있습니다. 사업장명, 전화번호, 지번·도로명주소, 우편번호, 좌표정보, 소재지면적 등은 감상실의 기본 정보와 입지, 대략적인 규모를 파악하는 데 활용됩니다. 시설면적, 층수, 건물용도, 통로너비, 조명·음향·환기·방음·소방·편의·비상시설(비상구·비상계단) 여부는 이용환경과 안전성을 평가할 수 있는 핵심 항목입니다. 비디오재생기명, 제작취급품목내용, 품목명, 제공게임물명, 총게임기수, 공연장형태구분명 등은 감상실이 제공하는 비디오물 종류, 부가 게임·공연 서비스 유무와 형태를 보여 주며, 문화체육업종명, 문화사업자구분명, 지역구분명으로 문화·여가 시설로서의 성격과 지역적 분포를 분석하는 데 유용한 공공데이터입니다.
