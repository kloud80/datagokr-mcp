description_portal: 발전용어집은 발전 산업과 관련된 전문 용어를 정리한 문서로, 발전소 운영, 설비, 환경, 안전, 에너지 거래 등과 관련된 기술 용어 및 행정 용어의 의미를 통일성 있게 제공하기 위한 자료입니다.구성 예시 (한국서부발전 발전용어집 기준)순서,용어명,내용1,1차 에너지 (Primary Energy ),어떤 전환이나 변형이 이루어지지 않은 에너지이다2,1차 에너지 순공급 (Total Primary Energy Requirement Availability ),"에너지 발란스의 주요항목으로서, 대상지역 주체의 1차에너지 순내수와 동일하다."3,1차 에너지 총소비 (Gross Consumption ),특정지역 주체의 내수와 국제 벙커링 수요를 합한 1차에너지량 (에너지 수출입 및 재고변동 포함)을 말한다.4,1차 에너지 투입 (Primary Energy Input ),"에너지 이용공정에서의 석탄, 석유, 가스등 1차 에너지의 소비를 말한다."5,1차 에너지 투입기준 (Primary Energy Input Balance ),최종수요를 충족시키기위해 소요되는 모든 에너지원의 양을(화석연료 등) 특정 1차에너지의 양으로 등가전환시켜 표시하는 종합에너지발란스의 한 형태. 이러한 1차에너지로서 등가 전환은 이 발란스표에 계상되는 모든 항목에 데이터의 한글 발전용어집외 영문도 포함하고 있으니 많은 활용 바랍니다.
