description_portal: 중구의 지방세 비과세 및 감면 내역을 과세연도와 세목별로 정리한 자료입니다. 취득세, 등록면허세, 주민세, 재산세 등 주요 세목의 감면 건수와 금액을 확인할 수 있습니다. 감면 근거는 지방세법, 지방세특례제한법, 감면조례, 조세특례제한법으로 구분되어 적용 법령별 규모를 비교할 수 있습니다. 각 항목은 연도, 세목명, 법령별 건수, 법령별 금액으로 구성되어 지방세 감면 추이와 세제지원 현황을 파악하는 데 활용할 수 있습니다. 세입 관리, 정책 검토, 감면제도 분석, 주민 정보 제공에 필요한 기초자료로 사용할 수 있습니다. 금액은 원 단위로 제공되며, 값이 없는 항목은 해당 감면 실적이 없거나 별도 산정 자료가 없는 경우로 이해할 수 있습니다.
