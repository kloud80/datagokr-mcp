description_portal: 본 데이터는 공공용지 보상 과정 중 채권으로 지급된 보상 현황을 사업정보 형태로 제공한다. 채권 보상은 현금 대신 국채나 회사채를 발행하여 지급하는 방식으로, 사업별 재정 집행을 분산하고 장기적인 재원 운영을 가능하게 한다.데이터 항목으로 사업종류, 사업명, 사업시행자, 소재지, 1년 채권보상(국채·회사채), 2년 채권보상(국채·회사채), 3년 채권보상(국채·회사채), 4년 채권보상(국채·회사채), 5년 채권보상(국채·회사채), 기타 채권보상(국채·회사채) 등이 포함된다. 각 항목을 통해 채권 종류와 만기별 지급 규모를 확인할 수 있으며, 연도별 지급 현황을 체계적으로 파악할 수 있다.이 데이터는 사업별 채권 보상금액과 지급 내역을 분석하여 재정관리 계획을 세우거나, 현금 보상 대비 채권 보상의 비율을 검토하는 데 활용 가능하다. 또한 장기 채권 발행 추세, 만기별 상환 구조 분석, 정책 수립 및 연구 자료로도 사용할 수 있다.
