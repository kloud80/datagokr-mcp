summary_user: 공공기관 지방이전으로 쓰지 않게 된 종전부동산 가운데 한국자산관리공사가 매입·인수한 물건별 현황 사진과 설명을 담은 파일(zip)로, 물건별로 사진명·물건명·주소·매입년도·설명이 한 행씩 정리돼 있다. 혁신도시 이전기관의 옛 부지가 어디에 있었고 어떤 모습인지, 언제 매입됐는지 확인하려는 지역 주민·부동산 분석가·정책 연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 물건명이나 주소를 이름 매칭하는 방식으로만 잇고, 국유재산 데이터와 연결하려면 주소를 필지 고유번호(PNU)로 따로 변환해야 한다.
description_portal: 한국자산관리공사에서 공공기관 지방이전 정책 지원을 위해 매입 후 인수한 종전부동산에 대한 현황사진 데이터입니다.캠코는 2012년 혁신도시 조성 및 발전에 관한 특별법에 따라 종전부동산 매입공공기관으로 지정되었으며, 공공기관 지방이전 정책에 따라 사용하지 않게 된 부동산(종전부동산)의 매입 및 매각을 지원하고 있습니다. 2025년 8월 현재 총 7개 기관 종전부동산 중 6건은 매각완료 되었으며, 국방대학교 부지 1건은 도시개발법에 의한 "개발사업 후 매각" 방식으로 사업 진행 중입니다.
