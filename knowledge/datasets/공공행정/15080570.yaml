description_portal: 부산광역시 및 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있습니다.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 도로 시설물인 가로수의 지리정보의 지형지물명, 등록구, 도로구간명, 관리기관, 식재위치, 가로수의 수고 및 흉고, 수종 등의 정보 입니다.  각종 공사나 수목이 교체 되는 경우에 해당 시설물의 조사 등을 통해 수집된 정보를 시스템에 반영하고 있으며, 이 자료를 추출하여 제공되고 있는 자료 입니다.(도로구간, 식재위치, 가로수 생육상태, 보호덮개유무, 병충해 등)
