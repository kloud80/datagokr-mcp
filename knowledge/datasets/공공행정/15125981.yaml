summary_user: 국회입법조사처에 접수된 정보공개청구를 건별로 담는 전국·비공간 목록으로, 연도·일련번호와 함께 청구 내용, 공개 형태, 담당 부서, 결정 구분, 공개·비공개 사유, 결정 통지일·공개일, 공개 방법, 공개 파일명을 담는다. 국민이나 연구자가 "입법조사처에 어떤 정보가 청구됐고, 어떤 사유로 공개 또는 비공개됐는가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 국회 기관의 정보공개 처리현황과는 담당 부서명이나 연도 같은 이름·값 매핑으로만 이어 쓴다.
