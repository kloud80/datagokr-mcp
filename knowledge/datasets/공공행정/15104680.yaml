description_portal: 이 데이터는 광주광역시 서구 관할 구역 내 2021년도 불법주정차 단속 민원 현황을 상세히 기록한 자료입니다. 민원접수에 따른 단속 요청의 세부 내역을 담고 있으며, 신청일자, 단속 요청 주소, 접수 경로 등 단속 처리에 필수적인 행정 정보가 포함되어 있습니다.특히 ‘불법주정차’는 교통안전 및 도시질서에 중대한 영향을 미치는 행위로, 본 데이터는 이를 방지하고자 접수된 민원을 토대로 단속을 시행한 이력을 정리한 것입니다. 접수 건은 모두 신고일 기준으로 정리되며, 도로명 주소를 기준으로 단속 요청 위치를 파악할 수 있어, 향후 도시계획, 교통정책 수립, 민원 대응 개선 등에 활용도가 높습니다.데이터는 csv 형식(약 26,330건)으로 제공되며, 불법행위 유형별 민원 밀집 지역, 단속 요청 증가 추이, 접수 채널별 민원 분포(앱, 전화 등) 등의 분석도 가능합니다. 또한 단속의 실효성을 판단하고 주정차 정책의 개선 방향을 수립하는 데 기초자료로 활용될 수 있습니다.
