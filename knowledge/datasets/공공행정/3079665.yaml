description_portal: 본 데이터는 경기도 광주시의 읍면동별 지적공부 현황 정보를 제공합니다. 각 읍면동의 토지 면적과 지번 수를 용도별로 집계한 통계 자료를 담고 있어 토지 이용 현황을 파악할 수 있습니다. 토지소재지는 해당 읍면동을 나타내며, 면적과 지번수는 전체 토지의 규모와 필지 수를 제공합니다. 용지별 면적과 지번수는 전, 답, 과수원, 임야, 대지, 공장용지, 학교용지, 주차장, 공원 등 토지의 지목별 면적과 필지 수를 상세히 구분하여 제공합니다. 본 데이터는 토지 이용 계획, 도시 개발 정책, 부동산 통계, 지적 관리, 과세 자료, 토지 정책 수립 등에 활용됩니다.
