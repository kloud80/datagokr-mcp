description_portal: 이 자료는 한국가스기술공사의 연간 신규채용현황을  체계적으로 정리한 것으로, 총신규채용, 비수도권 지역인재, 이전지역 지역인재 분야의 연간 채용인원을 포괄합니다. 한국가스기술공사의 연간 채용인원을 확인할 수 있고, 신규채용 인원의 지역인재, 고졸현황 등을 파악하는 데 유용합니다. 인원산출 방식은 기획재정부의 알리오 공시 작성기준을 토대로 산출하였으며, 시간선택제 채용인원의 경우 1일 8시간 근무시간을 기준으로 환산하여 반영하였습니다.(예:1일 4시간 근무=0.5명)지역균형발전 정책에 따른 지역인재 채용에 관한 자료로 추후 정책개선에 활용 될 수 있습니다.
