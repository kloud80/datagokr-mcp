summary_user: 경기주택도시공사(GH)에 접수된 민원을 민원 유형(cvlcpt_div)과 연도별로 묶어 1월~12월 월별 접수 건수로 집계한 표로, 건별 민원 원천이 아닌 집계 자료다. 분석가나 공사 담당자가 "GH에 어떤 유형의 민원이 어느 달에 몰리는가"를 살펴 민원 빈발 시기와 주요 불편 유형을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 민원 유형 이름을 맞추는 식으로만 이어 쓸 수 있다.
description_portal: '이 데이터는 경기주택도시공사(GH)에서 접수된 다양한 민원의 연도별·유형별·월별 현황을 정리한 자료로, 공사 업무에 대한 국민 관심도 및 불편사항 유형을 분석하는 데 유용합니다. ‘민원구분’ 항목은 접수된 민원의 성격을 분류하며,  ‘년도’는 민원이 발생한 기준 연도를 나타내며, 각 월별 접수 건수를 수치로 기록하고 있습니다. 본 데이터는 GH 고객 응대 품질 개선, 민원 빈발 시기 분석, 주요 민원 유형별 대응 전략 수립, 특정 사업에 대한 사회적 반응 파악 등 다양한 행정적·정책적 활용이 가능합니다. ※ 경기주택도시공사 URL : https://www.gh.or.kr/index.do'
