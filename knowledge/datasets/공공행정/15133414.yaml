description_portal: '서울시 스마트 불편신고에서 제공하는 위치별 불편신고건수 통계 정보입니다.주요정보 :  자치구별, 연도별, 월별 신고건수 정보 제공*용어설명 : 서울시 스마트불편신고- 서울스마트 불편신고는 스마트폰으로 불법주정차, 보도블록 파손, 무단 쓰레기 투기 등 서울시의 생활 불편사항을 신고할 수 있는 앱입니다.  신고된 민원은 120 다산콜센터를 통해 접수되고, 이어 해당 부서 공무원이 처리하며, 앱으로 처리 과정 및 결과를 실시간 확인할 수 있음※ 제공부서 : 서울특별시  디지털도시국 공간정보과(02-2133-2857)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
