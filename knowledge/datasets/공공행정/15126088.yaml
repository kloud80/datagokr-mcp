summary_user: 국회의장의 영문 연설문을 건별로 담으며, 연설 제목(SPC_TTL)·작성일·원문 링크 주소를 제공한다. 해외 연구자나 언론·외교 실무자가 "국회의장이 특정 시기에 영어로 어떤 메시지를 발표했는가"를 찾아 원문을 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 이을 전역 조인 키가 없어, 같은 기관(국회사무처) 자료와는 날짜나 제목 이름 매핑으로만 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
