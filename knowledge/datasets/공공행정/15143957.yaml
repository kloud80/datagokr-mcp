summary_user: 경기도 홈페이지 장애인특별공급 게시판과 관련해 발송한 알림톡의 제목(alrt_tlk_title)과 발송시간을 건별로 담은 발송 내역이며, 범위는 경기도 시도 단위의 비공간 자료다. 장애인특별공급 공고 알림이 언제, 어떤 제목으로 나갔는지 확인하려는 도민이나 알림 발송 이력을 점검하는 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 알림톡 제목을 장애인특별공급 게시판 게시글 제목과 이름으로 맞춰 메시지 내용을 확인하는 방식으로만 이어 쓴다.
description_portal: 경기도에서 발송한 알림톡 관련 데이터입니다.SHEET 탭에는 경기도 홈페이지 장애인특별공급에 대한 알림톡 발송 제목과 발송시간 내역입니다. 장애인특별공급 알림톡으로 발송된 메시지 내용은 경기도 홈페이지 - 분야별정보 - 경기도민복지 - 장애인 - 장애인특별공급 게시판에 게시되는 각 게시글의 내용과 동일합니다. 알림톡 제목에 해당하는 게시글을 검색하시어 발송된 메시지 내용을 확인할 수 있습니다.FILE탭에서는 경기도에서 발송한 알림톡 서식(예시)를 확인할 수 있습니다. 개인정보 등의 사유로 일부 내용 및 링크는 비식별화 처리하여 제공합니다.
