summary_user: 소비자 민원 상담 접수 내역을 사건(사건번호) 한 건마다 접수일자, 상담자 성별·연령대·지역, 품목, 사건제목, 상담이유로 담은 전국 단위 원천 파일이며 CSV 약 68MB 규모다. 소비자 분석가나 사업자가 특정 품목에서 어떤 연령대·지역의 소비자가 어떤 이유로 상담을 많이 접수하는지 살펴보는 데 쓴다. 사건번호와 품목코드(ITEM_CODE)가 조인 키라서 같은 품목코드 체계를 쓰는 다른 소비자 상담·피해 데이터와 품목 기준으로 이을 수 있고, 사업자등록번호는 없어 개별 사업자 등록·공시 정보와는 바로 잇지 못한다.
