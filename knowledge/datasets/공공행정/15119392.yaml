description_portal: 서울시 및 자치구에서 수행하는 정책, 민원업무 등에 대한 업무개요, 접수처, 신고기한, 신청방법, 과태료, 신청대상, 구비서류, 처리절차, 처리기한, 교부방법 등의 정보를 대상으로 자주 묻는 질문에 대한 목록을 조회할 수 있도록 하는 OpenAPI 서비스입니다.ㅇ 데이터 개요서울시 다산콜센터(120)에서 수집한 ‘자주묻는질문(FAQ)’ 목록으로, 시민들이 자주 문의하는 주요 민원 주제를 정리한 데이터입니다.ㅇ 구성 항목일련번호, FAQ 구분, 대분류코드·대분류명, 질문 내용, 수정일시로 구성되어 있으며, 행정·문화·체육·복지 등 다양한 분야를 포함합니다.ㅇ 활용 가능성시민 문의 경향 분석, 분야별 민원 응답 자동화, 챗봇 응답 데이터 구축, 정책 홍보 자료 제작 등에 활용할 수 있습니다.ㅇ 데이터 특성FAQ는 비교적 정형화된 문장으로 구성되어 있어 자연어처리(NLP) 학습 데이터로 적합하며, 행정 분야별 분류 체계가 명확합니다.ㅇ 갱신 주기 및 주의점수정일시 기준으로 데이터 최신성을 확인해야 하며, 일부 FAQ는 타 기관 업무와 관련되어 별도 안내가 필요할 수 있습니다.
