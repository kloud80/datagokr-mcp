summary_user: 인천광역시 서해구 관내 동 행정복지센터를 한 곳당 한 행으로 정리한 시설 목록으로, 관할동·도로명주소·전화번호·팩스번호를 담는다(csv 1,296바이트의 소규모 파일). 주민이 우리 동 행정복지센터의 위치와 연락처를 찾거나, 분석가가 구 안의 행정기관 분포와 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 관할동 이름이나 도로명주소를 매개로 다른 동 단위 자료나 주소 기반 자료와 이름 매칭으로 잇는다.
description_portal: 본 공공데이터는 인천광역시 서해구 관내 동 행정복지센터의 현황을 정리한 자료입니다. 본 자료는 인천광역시 서해구 내 동 행정복지센터의 명칭, 주소, 전화번호 등 기본 정보를 제공하고 있습니다. 동 행정복지센터는 주민등록, 민원처리 등 다양한 행정서비스를 제공하는 공공기관으로 주민생활 편의 증진에 핵심 역할을 수행하고 있습니다. 본 데이터를 통해 지역별 행정기관 분포와 접근성 확인, 주민참여 확대 등에 활용 될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
