summary_user: 경기데이터드림이 제공하는 Open API 서비스별 응답 명세를 담는다. 서비스 하나의 출력 항목 하나가 한 행이며 공공데이터ID·서비스명·호출URL·항목ID·항목명·항목유형·요청인자 여부를 담는 메타데이터다. 개발자나 기관 담당자가 "경기데이터드림의 특정 API를 부를 때 필수 입력값은 무엇이고 어떤 출력 항목이 오는가"를 확인해 연계 설계에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 경기데이터드림 안의 개별 API와는 공공데이터ID(INF_ID)나 서비스명으로 이름을 맞춰 연결한다.
description_portal: 이 데이터는 경기데이터드림에서 제공하는 OpenAPI 응답 명세서로, 다양한 공공데이터 API 서비스별 출력 항목에 대한 상세 정보를 포함하고 있습니다. 각 데이터셋은 고유한 공공데이터ID와 서비스명을 가지고 있으며, 해당 데이터의 호출URL, 항목ID, 항목명, 항목유형, 요청인자 여부 등의 정보를 제공합니다. 이 데이터는 API를 연계하여 활용하고자 하는 개발자나 기관이 필요한 출력항목을 확인하고 시스템 연계를 설계하는 데 활용될 수 있습니다. 요청인자 여부에 따라 필수입력값이 명시되며, 항목명은 한국어로 제공되어 접근성과 활용성이 높습니다.
