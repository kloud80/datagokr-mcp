description_portal: 2025년 9월 16일 기준,  충청북도 청주시 흥덕구 관내에 있는 모든 담배소매인의 지정 현황 자료입니다. 담배소매인은 담배사업법에 따라 판매사업장이 위치한 곳을 관할하는 시장, 군수, 구청장으로부터 소매인의 지정을 받아야 하며, 해당 데이터는 그에 따라  담배소매인의 소매인 구분, 담배판매업소의 이름, 담배판매업소의 도로명 주소 및 지번주소, 지정일자 등의 자료를 제공합니다. 담배소매인 지정 신청을 원하는 시민께서는 본 공공데이터를 활용하여 창업, 사업 양도양수 등에 활용하여 주시기 바랍니다.
