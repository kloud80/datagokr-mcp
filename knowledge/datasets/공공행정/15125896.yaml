summary_user: 국회사무처가 보유한 토지 자산을 연도별로 정리한 목록으로, 컬럼명으로 보아 구분·주소·면적·금액(AMT) 정보를 담는 것으로 보이며 범위는 전국입니다. 국민이나 분석가가 국회가 어느 지역에 어느 규모의 토지를 보유하고 있고 그 가액이 연도별로 어떻게 달라졌는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소나 이름 매핑, 또는 같은 기관 코드로만 연결할 수 있습니다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
