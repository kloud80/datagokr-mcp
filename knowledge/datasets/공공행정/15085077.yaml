description_portal: '○ 통계개요* 통계명 : 초고속 통신망 설치율* 통계종류 : 서울서베이의 서울시 가구 초고속 통신망 설치율을 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의 현재상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을 모니터링하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 디지털도시국* 공표주기 : 정기(매년) ※ 2008년 조사종료* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 PC보유 가구의 초고속 통신망 설치비율'
