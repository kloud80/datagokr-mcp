description_portal: 전라남도 해남군 소재 공중위생업소에 대한 데이터입니다.이 데이터에는 2026년 3월 기준 업종명, 업소명, 영업소 주소, 우편번호, 소재지전화번호 항목을 제공합니다.공중위생업소의 대상은 다수인을 대상으로 위생관리 서비스를 제공하는 영업을 말하며, "공중위생관리법" 제2조에 따라 숙박업(농어촌 민박 등 제외), 목욕장업, 이용업, 미용업, 세탁업, 건물위생관리업으로 구분됩니다.우리군은 공중위생업소는 총 362개소이며 미용업 190개소, 숙박업(일반) 78개소, 이용업 42개소 등의 순이며 읍면별로는해남읍 226개소, 송지면 32개소, 문내면 20개소 등의 순입니다.
