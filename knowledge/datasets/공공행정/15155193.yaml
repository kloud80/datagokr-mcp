description_portal: 본 데이터는 용인시 통합 홈페이지의 사이트별 체류시간 분포를 분석하기 위해 구축된 통계 자료이다. 도메인명을 중심으로 접속 연월일, 방문자수, 총 체류시간, 접속 횟수를 기록하여 이용자의 접속 규모와 관심도를 종합적으로 파악할 수 있도록 구성하였다. 또한 1분·3분·7분·15분·20분·30분·60분 미만 및 그 외 기간으로 구분된 체류시간 범주를 제공함으로써 콘텐츠 이용 집중도, 페이지별 머무름 특성, 정보 탐색 패턴을 정밀하게 분석할 수 있다. 최종집계시간을 함께 제시하여 데이터의 최신성을 확인할 수 있으며, 이러한 정보는 홈페이지 콘텐츠 개선, 서비스 구조 재정비, 이용자 경험 기반 정책 수립에 중요한 분석 자료로 활용된다.
