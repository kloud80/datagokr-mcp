summary_user: 경기도 시군구별 유동인구를 기준년월마다 성별·연령층(전체 합계 포함)으로 나눈 집계 통계로, 유동인구 수와 비율, 전월·전년 동월 대비 증감값과 증감률을 담는다. 상권 분석가나 창업 예정자가 "우리 시의 20대 여성 유동인구가 작년보다 늘었나"처럼 지역·성연령별 인구 흐름 변화를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군구코드(signgu_cd)를 이름·코드 매핑하거나 같은 경기도 데이터의 코드 체계로 맞춰 연결하고, 같은 세부 부문의 상권·인허가 자료와 월 단위로 함께 본다.
description_portal: '이 데이터는 경기도 시군구 단위의 성별 및 연령별 유동인구를 기준년월별로 집계한 통계자료입니다. ‘성연령코드’(예: M50, F10, TOT 등)를 통해 성별과 연령층별로 유동인구의 규모 및 분포를 분석할 수 있으며, ‘전월대비증감값’, ‘전년동월대비증감값’ 및 각 비율을 활용하여 인구 흐름의 시계열적 변화도 확인할 수 있습니다. 컬럼에는 ‘기준년월’, ‘시군구코드’, ‘성연령코드’, ‘유동인구수’, ‘유동인구수비율’, ‘전년동월대비증감값’, ‘전년동월대비증감비율’, ‘전월대비증감값’, ‘전월대비증감비율’이 포함됩니다. 이 데이터는 상권 분석, 도시 계획, 지역 인프라 수요 예측 등 다양한 분야에서 의사결정 자료로 활용될 수 있습니다. 특히 ‘TOT’는 전체 인구를 의미하고, ‘M60O’는 60세 이상 남성을 뜻하는 등 코드에 기반한 세부 인구 집계가 가능합니다.'
