description_portal: 강릉관광개발공사 관용차량 현황 데이터는 공사가 보유·운영 중인 관용차량의 관리 실태를 체계적으로 파악하기 위해 구축된 자료입니다. 본 데이터에는 차량을 관리·운영하는 관리부서, 차량 식별을 위한 차량번호와 차명, 친환경 정책 이행 여부를 확인할 수 있는 전기차 여부, 차량의 용도 또는 관리상 구분 정보가 포함되어 있습니다.해당 자료는 관용차량의 운영 현황을 투명하게 공개하고, 차량 관리의 효율성 제고와 예산 집행의 합리성을 확보하는 데 활용될 수 있습니다. 또한 전기차 보유 현황을 통해 친환경 차량 도입 및 탄소 저감 정책 추진 성과를 점검하는 기초자료로 활용되며, 공공자산 관리 현황을 시민에게 제공함으로써 공사의 책임성과 신뢰성을 높이는 데 기여합니다. 기준일자 항목을 통해 데이터의 최신성을 확인할 수 있어 지속적인 관리와 갱신에도 활용 가능합니다.
