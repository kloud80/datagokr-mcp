summary_user: 국립아시아문화전당(ACC)이 국내 문화예술 기관·지방자치단체·교육연구기관 등과 추진한 교류·협력 활동을 기관명, 교류일자, 건명 단위로 한 건씩 기록한 목록이며, 파일 크기가 853바이트로 매우 작은 CSV입니다. 연구자나 지역 문화기관 담당자가 'ACC가 언제 어떤 기관과 어떤 협력 사업을 했는가'를 확인하거나 시기별 교류 흐름을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 기관명을 이름으로 맞추는 방식으로만 이어 쓸 수 있습니다.
description_portal: 국내교류 네트워크 데이터는 국립아시아문화전당(ACC)이 아시아문화교류도시로서의 역량을 강화하기 위해 국내 다양한 기관·단체와 추진한 교류·협력 활동의 현황에 대한 자료입니다. 이 데이터에는 문화예술 기관, 지방자치단체, 교육·연구기관 등과 진행한 사업의 기록이 포함되어 있으며, ACC의 핵심 가치인 민주·인권·평화 정신을 국내 네트워크를 통해 확산하고자 하는 노력의 흐름을 파악할 수 있습니다.해당 데이터는 ACC가 어떤 기관과 어떤 방식으로 협력했는지 한눈에 보여주어, 기관 간 문화예술 생태계 형성 과정과 지역·분야별 협력 구조를 분석하는 데 활용할 수 있습니다. 또한 교류일자와 교류 건명을 기반으로 일정한 시기별 교류 트렌드를 파악하거나, ACC의 교류 전략 변화, 협력 범위의 확장, 특정 분야와의 연계 강화 등 정책 수립을 위한 참고자료로 사용할 수 있습니다.또한 문화예술기관 간 협력 모델 연구, 네트워크 시각화, 지역문화 활성화 전략 설계, 공공·민간 협력 프로그램 개발 등 다양한 분야에서 참고할 수 있는 기반 정보를 제공합니다.
