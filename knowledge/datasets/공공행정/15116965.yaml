summary_user: 부산광역시 동래구가 관리하는 공유재산 중 일반재산(토지 등)을 재산 한 건씩 소재지 주소, 종류, 지목, 면적(제곱미터), 대부·매각 여부, 사용허가·대부 불가 사유와 함께 담은 파일(csv, 약 21KB)이다. 동래구에서 대부나 매각이 가능한 구유지가 어디에 있고 면적은 얼마인지 알아보려는 사업자·주민, 또는 구유재산 활용 현황을 점검하는 분석가가 쓴다. 전역 조인 키(필지고유번호 등)는 없어 소재지 주소를 주소·지번 체계와 맞춰 토지대장·국유재산 자료와 잇거나, 같은 기관 코드로만 다른 동래구 자료와 연결한다.
description_portal: '본 데이터는 부산광역시 동래구가 관리하는 공유재산 중 일반재산에 해당하는 토지 및 부동산 현황을 체계적으로 정리한 자료입니다.공공재산의 효율적 관리와 행정 투명성 강화를 위해 소유구분, 재산관리관, 소재지 등의 기본 정보와 더불어, 토지지목, 면적, 대부/매각 여부, 사용허가·대부 불가 사유 등의 상세 항목을 포함하고 있습니다.주요 제공 항목은 다음과 같습니다:소유구분코드: 재산 소유 형태를 구분하는 코드재산관리관: 해당 재산을 담당하는 관리관 이름 또는 부서소재지: 재산이 위치한 구체적 주소 정보토지지목: 토지의 지목면적: 토지 면적대부·매각: 대부·매각 대상 여부사용허가·대부 불가 사유: 사용허가·대부 불가 사유이 데이터는 공유재산 관리의 기초 자료로서 재산 활용 계획, 회계 처리, 부동산 평가 및 행정 감사 등에 활용되며,정기적인 갱신과 검증을 통해 최신의 정보를 제공합니다.필요 시 부산광역시 동래구청 재무과에 문의하여 보다 상세한 정보를 확인할 수 있습니다.'
