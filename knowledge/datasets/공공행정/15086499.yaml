description_portal: 본 데이터는 대구광역시 서구 관할 내 주요 도로를 중심으로 조성된 가로수의 현황을 수종별로 정리한 자료이다. 구체적으로는 노선명, 조성된 도로 구간, 식재된 수종명, 교목의 수량, 담당 부서 등을 포함하고 있으며, 도시공원과에서 관리하는 정보를 기반으로 한다. 이를 통해 가로수의 분포 현황을 파악하고 도시녹지의 유지·관리, 환경 개선 및 도로 미관 증진을 위한 정책 수립에 활용할 수 있다. 또한 생활환경과 관련된 행정정보로서 민원 대응, 도시계획, 지역 녹화사업 등 다양한 분야에 응용될 수 있다. 사용자는 도로별로 식재된 수종과 수량을 손쉽게 파악할 수 있어 데이터의 활용성이 높다.
