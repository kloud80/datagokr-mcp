description_portal: '"전북특별자치도교육청_폐교재산 현황" 데이터는 전북특별자치도 내 시군별로 폐교된 학교의 재산 현황을 종합적으로 제공하는 공공데이터입니다. 주요 제공 항목에는 폐교명, 지역(시군 구분), 폐교년도, 위치, 토지면적, 건물면적  등이 포함되어 있습니다. 이 데이터는 각 교육지원청과 학교에서 제출한 자료를 바탕으로, 실제 현장 조사와 행정자료를 통해 수집됩니다.보유 및 제공 근거는 「공유재산 및 물품관리법」과 「초·중등교육법」 등 관련 법령에 있으며, 폐교재산의 효율적 관리와 활용, 행정 투명성 제고, 정책 수립 및 연구자료 제공을 목적으로 합니다. 데이터는 폐교의 신설, 매각, 대부, 자체 활용 등 변동사항이 발생할 때마다 수시로 갱신되며, 필요 시 1회성으로도 제공됩니다.이 데이터는 행정기관의 재산관리, 지역사회 개발 및 활용 방안 모색, 연구기관의 교육 인프라 분석, 언론의 지역 교육환경 보도, 민간의 폐교 활용사업 기획 등 다양한 분야에서 활용됩니다. 특히, 토지·건물 면적과 관리계획 정보는 폐교재산의 활용 가능성 평가, 지역 균형발전 정책 수립, 공공자산의 효율적 배분 등에 중요한 기초자료로 쓰입니다.이처럼 "전북특별자치도교육청_폐교재산 현황" 데이터는 지역 내 폐교된 학교 재산의 현황과 활용 상태를 투명하게 공개함으로써, 공공자산의 효율적 관리와 지역사회 발전에 기여하는 핵심 공공정보입니다'
