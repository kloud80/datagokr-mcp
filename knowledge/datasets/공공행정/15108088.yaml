summary_user: 법정동·행정동의 통·반 단위로 전체·남자·여자 주민등록 평균연령을 통계년월별로 담는 집계 API이다. 지역별 연령 구조를 비교하려는 분석가나 창업 준비자가 우리 동네 통·반의 평균연령이 어느 정도인지 확인하는 데 쓴다. 법정동코드(stdgCd, 조인 키 bjd_cd)로 다른 법정동 단위 데이터와 이어 쓰며, 행정기관코드(admmCd)로 행정동 단위 자료와도 맞출 수 있다.
description_portal: 법정동의 통계년월을 기준으로 시도명, 시군구명, 법정동명, 리명, 행정기관코드, 행정동명, 통, 반, 전체평균연령, 남자평균연령, 여자평균연령을 조회하기 위한 서비스입니다.주민등록 데이터는 통계의 기본이 되는 인구 데이터로써, 주민의 신고에 따라 주민등록법 제6조의 규정에 근거하여 개인·세대별 주민등록표를 기반으로 매월 말일 집계하고 있으며 거주자, 거주불명자, 재외국민을 포함하고 있습니다.활용가치가 큰 주민등록 데이터의 제공 단위를 통반 단위, 도로명 등으로 확대하여 오픈API 방식으로 제공함으로써, 주민등록 데이터를 활용한 국가정책수립, 민간·공공서비스 개발, 창업 지원 및 일자리 창출 등 다양한 분야의 디지털 전환 및 국민 삶의 질 향상에 기여할 목적으로 작성되었습니다.
