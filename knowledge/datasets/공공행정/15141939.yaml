description_portal: '이 데이터는 특정 지역 행정기관이 운영하는 공식 SNS 채널(예: 블로그, 인스타그램 등)을 통해 게시한 콘텐츠의 정보를 수록한 자료입니다. 게시물 제목, 게시일자, 링크 URL, 소셜미디어 구분, 이미지 파일명 등의 항목으로 구성되어 있으며, 행정 홍보, 정책 안내, 문화 소식, 시민참여 캠페인 등 다양한 주제를 포함하고 있습니다. 해당 콘텐츠는 계절별 이슈, 행사 일정, 정책 추진 현황 등을 반영하여 시민과의 디지털 소통 창구 역할을 수행하고 있으며, 콘텐츠 유형에 따라 각기 다른 플랫폼을 활용하고 있습니다. 본 자료는 디지털 기반 홍보전략 수립, 반응도 분석, SNS 운영성과 평가, 정책 정보 접근성 제고 등의 행정 기획 및 마케팅 분야에 활용하실 수 있습니다.'
