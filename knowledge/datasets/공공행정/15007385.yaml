description_portal: 부산광역시 사상구 관내 "행복마을 현황" 공공데이터는 도심 내 낙후된 지역들 중 마을 단위의 주민공동체 회복을 통해 주민 주도로 마을 문제를 해결할 수 있도록 지원하는 행복마을 사업 추진을 위한 행복센터 현황을 담고 있습니다. 이 데이터에는 행복마을 명칭과 위치(도로명 주소), 대지 면적, 건물 면적, 주요 시설, 개관일, 위도 및 경도 정보가 포함되어 있어 행복마을(센터)의 공간적 특성과 운영 현황을 한눈에 파악할 수 있습니다. 위·경도 좌표를 활용해 위치기반 분석이 가능하며, 주민과 행정기관이 마을 활성화 및 공동체 회복을 위한 맞춤형 지원 정책을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다.
