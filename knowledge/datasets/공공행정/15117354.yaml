summary_user: 부산광역시 골목상권·발달상권·전통시장 상권별로 상권명, 변화지표값, 평균 생존개월수, 평균 폐업개월수를 담은 지도 표출용 공간정보(SHP) 파일로, 포털에서 약 150KB zip 한 개로 받는다. 상가 창업을 준비하는 사업자나 지역 분석가가 "부산의 어느 상권이 점포가 오래 살아남고 어느 상권이 빨리 폐업하는가"를 지도 위에서 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상권명 같은 이름 매칭이나 같은 기관(부산광역시) 자료끼리만 이어 쓰며, 점포·인허가 원장(LOCALDATA 등)과는 공간 위치로 겹쳐 보는 방식이 현실적이다.
limits: 표준 행정코드나 상권 코드 같은 전역 조인 키가 확인되지 않아 다른 통계와 자동으로 결합하기 어렵다. 범위는 부산광역시 한 곳의 상권에 한정되며, 상권 단위로 집계된 지표라 개별 점포의 생존·폐업 이력은 담지 않는다.
