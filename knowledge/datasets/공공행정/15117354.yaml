description_portal: '[골목상권 정의 및 조건: 주거지역이 밀집된 곳에 형성된 상권. 대형 유통시설이 상권 영역에 포함된 점포 및 발달상권(전통시장은 제외). 도로 길이 400m 이상인 길 단위로 구성 (대로, 로 제외한 길 단위 구성). 길 단위 영역 중에서 30개 이상 점포 수를 포함한 골목상권 지역][발달상권 정의 및 조건: 유통산업발전법 제5조의 법 조항에 따라 2천 제곱 미터 이내 50개 이상의 상점이 분포하는 경우 “상점가” 라 하고, 배후지를 고려하지 않은 도보 이동이 가능한 범위내의 상가업소밀집지역을 발달상권으로 정의][전통시장 상권 정의 및 조건: 오랜 기간에 걸쳐 일정한 지역에서 자연발생적으로 형성된 상설시장이나 정기시장. 부산시에서 지정한 전통시장 리스트를 기반으로 상권 영역 제공]부산광역시 부산 상권 변화지표현황 정보(상권구분명, 상권명, 변화지표값 , 평균생존개월수, 평균폐업개월수 등)의 관련한 사항을 지도표출용 공간정보(SHP) 파일입니다. 인코딩 형식은 UTF-8 입니다.'
