description_portal: '외국 출신의 이주민에 대한 성별, 국적 등 기본 현황을 파악하여 이주민에 대한 이식 제고를 하고 지역사회 커뮤니티 조성 등 지역사회 정착 지원 시책의 기초자료로 활용하기 위해 작성된 자료이며, 개인정보 누출 방지를 위해 2023. 11. 1.자 이후 현황은 미제공 상태임을 알려드립니다. 해당 데이터는 광주광역시 남구청 인구가족담당관(☎062-607-3513)에서 제공합니다.※ 외국인 주민은 대한민국에 일정 기간 이상 거주하는 외국 국적자 및 법률상 외국인으로 분류되는 사람을 의미하며, 광주광역시 남구 관내 다문화 지원 단체 현황은 다음과 같습니다. - 남구가족센터 : 방문교육, 다문화가족 자녀 언어발달지원, 결혼이민자통번역서비스, 한국어교육 등 / ☎062-351-5432- 다누리콜센터 : 이주여성, 다문화가족을 위한 긴급지원, 상담, 생활정보 제공 등 / ☎062-366-1366'
