description_portal: '○ 한국특허정보원(KIPI) 홈페이지에 게시되어 있는 공지사항 데이터를 제공합니다. 이 데이터에는 한국특허정보원이 주최한 행사 및 이벤트 정보, 공모, 주요 공지사항에 대한 정보들을 포함하고 있으며, 지식재산처(MOIP) 산하 다른 유관기관들의 공지사항까지 연계하여 제공하고 있습니다. 한국특허정보원의 운영과 연관되는 공지사항 데이터를 제공함으로써 정부 및 공공기관의 정보 공개와 행정 투명성 강화, 국민의 행정 정보 접근성 향상, 디지털 행정서비스 개선, 정책 참여 확대에 기여할 수 있습니다.○ 컬럼 설명 : 게시물일련번호(게시물 등록 순서), 게시물제목(본문의 제목), 게시자명(게시물 등록자명), 게시일자(게시물 등록일자), 게시물조회수(해당게시물의 조회수)○ 기준일자 : 2026-06-09'
