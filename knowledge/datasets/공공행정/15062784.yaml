summary_user: 경상남도 내 시군구청 한 곳마다 명칭, 도로명주소, 대표 전화·팩스, 홈페이지, 대표자 등을 담은 개별 기관 목록으로, 범위는 경상남도 한 시도이다. 주민이나 분석가가 '우리 시군의 군청 주소와 대표 전화번호는 무엇인가'처럼 관공서 위치·연락처를 확인하거나 생활 행정시설 목록을 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구 이름(sigungu)이나 기관명을 맞춰 연결하거나 같은 기관(경상남도) 자료끼리 이어 쓴다.
description_portal: 경상남도 시군구청의 명칭, 위치, 대표연락처 등을 조회하는 경상남도 시군구청 정보 조회 서비스
