summary_user: 한국가스공사가 낸 입찰 공고를 건별로 담으며, 입찰번호·입찰건명·입찰구분·업무구분(물품·용역·공사)·계약방법·공고일·마감/개찰일시·취소여부와 낙찰자 상호·낙찰금액·낙찰률·낙찰일을 입찰번호나 입찰명으로 조회한다. 가스공사 물품·용역·공사 입찰에 참여하려는 사업자가 특정 공고의 마감·개찰 일정과 취소 여부를 확인하거나, 분석가가 과거 입찰의 낙찰업체와 낙찰률을 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 입찰건명·업체명 매핑이나 낙찰자 사업자등록번호(SUCCESS_CORP_CODE) 같은 값으로 맞춰 이어야 한다.
limits: 한국가스공사 한 기관의 입찰만 담아 공공조달 전체를 보려면 원천인 조달청 나라장터 데이터를 써야 하며, 정부조달 부문 검토에서는 조달청 외 기관 데이터로 제외 대상에 올랐다. 지역 단위 정보가 없는 전국·비공간 데이터라 지역별 분석에는 맞지 않다.
