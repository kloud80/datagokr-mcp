description_portal: '범정부 공공데이터 중장기 (미제공)개방예정데이터 목록 정보로 각 기관의 연차별 개방계획과 개방목록명을 제공 합니다.1) 1년 단위로 개방이 예정되어 있는 기관별 목록으로, 기관의 사정에 따라 변경될 수 있음을 알려드립니다.2) 문의사항이 있을 경우, 데이터 목록정보별 해당 기관 연락처로 문의주시길 부탁드립니다.3) 기관별 공공데이터 실무담당자 연락처는 공공데이터포털 "공공데이터 제공기관 실무담당자" 개방목록으로 개방되어있으니 참고하시길 바랍니다.※ 기준일 : 2026년 1월말'
