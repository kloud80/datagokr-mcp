description_portal: <데이터 수집목적 및 과정>본 데이터는 경상남도 내 각 소방관서의 시군별 인력 현황과 담당 인구 현황을 제공하기 위해 구축되었습니다. 소방관서별 인력과 관할 인구수, 1인당 담당 인구수를 산출하여 소방서비스 제공의 적정성과 효율성 분석, 정책 수립, 행정 자료 등 다양한 용도로 활용될 수 있습니다. 데이터는 경남소방본부에서 필요 시 비정기적으로 수집·정리합니다.<데이터 구성 및 세부항목>데이터는 시군명, 관서명, 정원(명), 관할인구(명), 1인당 담당인구(명) 항목으로 구성되어 있습니다. 이를 통해 각 소방관서별로 배치된 인원과 그 인원이 담당하는 인구 규모를 쉽게 파악할 수 있습니다. 데이터는 분석, 정책 수립, 행정 지원, 지역 소방역량 평가 등에 활용 가능합니다.<데이터 기준일>해당 데이터는 2023년 12월 말 기준입니다.
