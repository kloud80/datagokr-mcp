summary_user: 지방자치단체별로 회계연도(fyr)마다 실제 걷힌 세입을 결산한 금액을 담은 전국 단위 집계 데이터로, 상위 자치단체명·자치단체 코드·자치단체명과 여러 결산 금액 항목(stl_amt0~4)으로 구성된다. 분석가나 주민이 "우리 시·군·구는 지난해 지방세와 보조금 등으로 실제 얼마를 거뒀나"를 확인하거나 지자체 간 세입 규모를 비교할 때 쓴다. 전역 조인 키는 없어 자치단체 코드(laf_cd)나 자치단체명으로 같은 지방재정365의 세출결산·예산 데이터와 맞춰 이어 쓴다.
description_portal: 지역통합세입결산이란, 지방자치단체의 거뒤들이는 세입(수입) 에산을 실제로 결산한 결과를 말합니다.이는 지방자치단체가 특정 회계연도 동안 실제로 징수한 지방세, 지방세외수입, 국고 보조금 등등 다양한 세입 항목을 종합적으로 정리한 문서입니다.세입결산을 통해 예산과 실제 세입 간의 차이를 파악하고, 재정 운용의 효율성 및 계획과 실행 간의 일치를 점검할 수 있습니다. 이를 바탕으로 지방자치단체는 향후 세입 예산을 수립할 때 참고자료로 사용하며, 투명한 재정 운영을 위해 중요한 역할을 합니다.
