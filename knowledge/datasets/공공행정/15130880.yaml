summary_user: 경기민원24 누리집의 개인정보 처리방침, 저작권 정책, 이용약관, 뷰어 다운로드 안내 같은 안내 문서를 콘텐츠 일련번호와 버전별로 기록한 이력 자료이며, 제목·문서 및 이미지 아이디·등록일시를 건별로 담고 위치 정보는 없다. 경기민원24 이용약관이나 개인정보 처리방침이 언제 어떤 버전으로 바뀌었는지 확인하려는 이용자나 분석가가 쓴다. 다른 데이터와 잇는 전역 조인 키가 없어 콘텐츠 일련번호(conts_sn)와 제목으로 같은 경기도 경기민원 데이터 안에서만 연결한다.
description_portal: 경기도 경기민원 콘텐츠 버전 데이터는 경기민원24에서 제공하는 다양한 행정 서비스 관련 콘텐츠의 버전별 이력을 관리하고 기록한 자료입니다. 각 콘텐츠는 개인정보 처리방침, 저작권 정책, 이용약관, 뷰어 다운로드 안내 등 행정 서비스 이용에 필요한 기본 문서와 정보들로 구성되어 있으며, 초기 등록 이후 여러 차례의 수정과 개정을 거친 버전별 변화를 확인할 수 있습니다. 데이터에는 콘텐츠 일련번호, 버전 정보, 제목명, 문서 및 이미지 아이디, 등록일시 등이 포함되어 있어 특정 시점의 문서 상태나 변경 내역을 확인할 수 있습니다.* 데이터 길이 문제로 html 코드 값이 포함된 내용 컬럼은 파일탭에 별도 개방합니다.
