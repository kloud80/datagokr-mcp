summary_user: 서울 강남구에서 자동판매기로 식품을 판매하는 업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일자(APVPERMYMD)·영업상태(영업중/폐업)·폐업일자·도로명/지번 주소·좌표·시설 면적 등을 포함한다. 상권 분석가나 창업 예정자가 '강남구 어느 동네에 식품 자판기 업소가 몰려 있고 최근 폐업이 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호 기준으로 이어 쓰며, 같은 원천인 LOCALDATA 인허가 자료와 대조할 수 있다.
description_portal: 서울시 강남구 식품자동판매기업 인허가 정보(https://data.seoul.go.kr/dataList/OA-18249/S/1/datasetView.do)강남구의 자동판매기를 이용하여 식품을 판매하는 업소정보입니다.도로명주소, 즉 해당 업체가 위치한 건물의 도로명을 기반으로 한 상세한 주소이고, 다른 하나는 전통적으로 사용되어온 지번주소로, 토지의 고유번호나 구획을 기준으로 한 주소를 의미합니다. 이 두 가지 주소 형태는 서로 다르지만, 모두 해당 자동판매기 업소의 위치를 확인할 수 있는 데에 활용됩니다.뿐만 아니라, 각 업소의 영업상태명이라는 정보 또한 함께 제공되는데, 이 영업상태명에는 '영업중'과 '폐업'이라는 두 가지 주요 상태가 포함됩니다. '영업중'이라는 표시는 해당 자동판매기 업소가 현재 정상적으로 영업을 하고 있음을 나타냅니다. 반대로 '폐업'이라는 표시는 해당 업소가 더 이상 영업을 하지 않고 공식적으로 영업이 종료되었음을 의미합니다.
