description_portal: 이 통계 데이터는 당해년도 1월 1일부터 12월 31일까지 행정부 국가공무원의 승진 및 상위직급대우 현황을 직급별로 산출한 인사통계 자료입니다.승진은 일반승진과 근속승진, 그리고 특별승진으로 구분됩니다. 상위직급대우 현황은 상위직급 대우를 받는 직급을 기준으로 작성되어 있습니다. 가령 8급공무원이 7급대우를 받는 경우 7급공무원에 표시되므로, 통계해석에 유의하시기 바랍니다.해당 통계자료는 일반직공무원 승진, 특정직공무원  승진으로 작성되어 있습니다단, 승진 규정을 적용받지 않는 임기제공무원 및 전문경력관, 별정직공무원은 제외되었습니다.
