description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 전자 회의록 기본 정보를 제공합니다. 시의회 본회의와 각 위원회에서 개최된 회의의 기록 정보를 체계적으로 관리하는 자료를 담고 있습니다. 고유번호는 각 회의록을 식별하는 코드이며, 대수와 회기는 회의가 열린 의회 기수와 회기를 나타냅니다. 회기 형식 문구는 정기회, 임시회 등 회의 성격을 표시하고, 위원회명은 본회의 또는 해당 위원회 명칭을 제공합니다. 차수와 차수 한글은 해당 회기의 회의 순서를 숫자와 한글로 표시하며, 회의 날짜는 실제 회의 개최일을 나타냅니다. 피감사기관은 행정사무감사 시 감사 대상 기관 정보입니다. 본 데이터는 회의록 검색, 의정 기록 관리, 회의 일정 확인, 의정 투명성 확보 등에 활용됩니다.
