summary_user: 프랜차이즈 브랜드별·지역별로 가맹점 수, 연간 평균 매출액, 단위면적당 연간 평균 매출액을 가맹사업 기준년도 단위로 담은 집계 데이터이며, 범위는 전국입니다. 창업 예정자나 가맹 희망자가 "이 브랜드 가맹점은 지역별로 연 매출이 어느 수준이고, 면적 대비 매출은 같은 업종 다른 브랜드와 비교해 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 공정위 가맹정보 계열 데이터와 브랜드관리번호·가맹본부관리번호(brandMnno) 같은 기관 내부 번호나 브랜드명·지역명 매핑으로만 이어 쓴다.
limits: 사업자등록번호·법인등록번호 같은 전역 키가 없어 공정위 외 다른 기관 데이터와 직접 결합하기 어렵다. 매출액은 정확한 값이 아니라 편차 5%의 범위값으로 제공되므로 개별 가맹점 실적이나 정밀 순위로 해석하면 안 된다. 지역 정보는 지역명 수준의 비공간 데이터라 좌표 기반 상권 분석에는 바로 쓸 수 없다.
