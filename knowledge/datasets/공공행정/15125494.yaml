description_portal: 이 API는 프랜차이즈 브랜드의 가맹점 평균 매출 현황과 단위면적당 매출 정보를 제공하는 공공데이터 서비스입니다.가맹사업 기준년도와 브랜드 관리번호를 이용하여 지역별 가맹점 수, 연간 평균 매출액, 단위면적당 연간 평균 매출액 등의 정보를 확인할 수 있습니다.또한 업종 분류 정보와 지역 정보를 함께 제공하여 프랜차이즈 브랜드의 매출 규모와 매장 운영 효율을 분석 가능하며,창업 예정자, 가맹 희망자, 연구기관 및 기업이 브랜드별 매출 수준을 비교하고 지역별 시장 현황과 상권 특성을 분석하는 데 활용할 수 있습니다.
