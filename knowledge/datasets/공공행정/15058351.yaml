description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이며, 일반정규직 평균임금 자료에는 연도, 기관명, 기본급, 급여성복리후생비, 수당, 초과근무수당, 인센티브성과급, 자체평가급, 예산성과급, 직원수, 평균근속연수, 1인당 평균임금 등 지표가 포함됩니다.지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
