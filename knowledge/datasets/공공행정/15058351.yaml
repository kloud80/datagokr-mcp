summary_user: 지방공기업 통합경영공시에 올라온 일반정규직 평균임금을 연도·기관별로 담은 집계 자료로, 기본급·수당·시간외근무수당·성과급 항목별 금액과 합계, 직원수, 평균근속연수, 1인당 평균임금을 담으며 범위는 전국이다. 구직자나 분석가가 '특정 지방공사·공단 정규직의 1인당 평균임금과 성과급 비중이 다른 지방공기업보다 높은가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 경영공시 자료와는 연도(AC_YEAR)와 기관명(ENT_NAME)을 이름 매핑해서만 이어 쓴다.
limits: 기관 코드 같은 전역 조인 키가 없어 기관명 표기가 다르면 다른 데이터와 연결이 어긋날 수 있다. 개인별 임금이나 직급별 분포는 없고 기관 단위 평균만 담는다. 개발계정 호출은 하루 10,000회로 제한된다.
