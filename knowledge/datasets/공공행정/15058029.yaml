summary_user: 지방공기업별로 회계연도(fyr)마다 부채 규모와 자본(자산) 규모, 이를 나눈 부채비율을 담은 지방재정365 공시 집계 데이터로, 범위는 전국입니다. 분석가나 주민이 "우리 지역 도시공사·공단의 부채비율이 다른 지방공기업보다 높은가"처럼 지방공기업의 재무 건전성을 비교하는 데 쓴다. 전역 조인 키는 없고, 광역·기초 자치단체 코드와 이름(wa_laf_cd, laf_cd 등)으로 같은 기관의 지방재정365 다른 지표와 맞춰 쓰거나 이름 매핑으로 지방공기업 명부·경영공시와 연결한다.
description_portal: 지방공기업별 부채비율은 각 지방공기업의 부채 규모가 자본에 비해 어느 정도인지를 나타내는 지표로, 지방공기업의 재정 건정성을 평가하는 데 사용 됩니다.이 비율은 지방공기업의 총 부채를 자본으로 나누어 계산하며, 부채비율이 높을수록 해당 공기업이 외부 지금에 의존하고 있다는 의미입니다.부채비율이 지나치게 높은 경우, 공기업의 재정적 위험이 클수 있으므로, 적정한 수준의 부채비율 유지가 중요합니다. 이 지표는 지방공기업의 재무 건정성과 안정성을 판단하는 중요한 기준이 됩니다.
