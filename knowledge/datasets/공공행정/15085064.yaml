description_portal: 서울시 과거 5년 동안 이사경험 및 변화 통계는 서울시 주민들의 이사 경험과 그에 따른 주거 지역, 주거 점유 형태, 주거 형태의 변화를 구체적으로 나타내는 데이터입니다. 이 통계는 성별, 연령별, 학력별, 주택형태별, 소득별, 지역별로 구분되어, 이사 경험이 있는 사람들의 이동 패턴을 분석할 수 있습니다. 주요 항목으로는 주거 지역 변화(한강이북/한강이남 등), 주거 점유 형태 변화(전세, 자가, 월세 등), 주거 형태 변화(아파트, 단독주택, 연립주택 등) 등이 포함됩니다. 이를 통해 서울시의 인구 이동과 주거 형태의 변화를 이해하고, 주거 정책 수립에 필요한 중요한 데이터를 제공합니다.
