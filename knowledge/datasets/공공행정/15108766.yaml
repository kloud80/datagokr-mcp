description_portal: 양평군의 공용차량보유현황으로 분류별(경형승용차, 중형화물차, 소형화물차, 중형승합차, 중형승용차, 대형화물차, 청소차, 기타 등), 대수를 세분화하여 데이터를 제공합니다공용차량 보유현황은 공공기관이나 지방자치단체가 보유한 차량의 종류, 수, 용도 등을 상세히 기록한 자료입니다. 여기에는 차량 대수, 차량 종류(승용차, 승합차, 화물차 등), 구매 방식(신규 구매, 임차, 리스) 등이 포함됩니다. 또한 각 차량의 연식, 운행 거리, 유지관리 비용(유류비, 정비비 등)도 중요한 요소로, 차량의 관리 효율성을 평가하는 데 사용됩니다. 차량 배정 부서와 사용 책임자도 기록되어, 차량의 사용 목적과 책임 소재를 명확히 합니다. 최근에는 친환경 차량의 보급이 중요한 이슈로, 전기차나 하이브리드 차량 등의 보유 현황도 함께 확인할 수 있습니다. 이를 통해 공공기관은 차량 운영의 효율성 및 비용 절감, 환경 친화적인 정책을 추진합니다.
