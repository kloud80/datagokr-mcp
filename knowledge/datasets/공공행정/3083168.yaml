summary_user: 경기도 시군별로 불법 유동·고정광고물 단속 건수를 집계년도·분기 단위로 모은 집계 자료로, 현수막·입간판·에어라이트·벽보·전단·기타 유형별 건수를 담는다. 도시환경 담당자나 분석가가 "어느 시군에서 현수막 단속이 가장 많고 분기별로 어떻게 변하는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명이나 시군 코드(SIGUN_CD)를 이름·코드 매핑해서만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 시군별 불법 유동광고물 및 고정광고물에 대한 단속 현황을 분기별로 집계한 자료입니다. 주요 항목은 시군명 및 코드, 집계년도와 분기, 광고물 유형별 단속 건수(현수막, 입간판, 에어라이트, 벽보, 전단, 기타) 등으로 구성되어 있으며, 각 광고물의 유형별 현황을 통해 불법광고물의 유형과 발생 빈도 등을 분석할 수 있습니다. 데이터는 건축정책과에서 반기 단위로 갱신되며, 불법 광고물 관리정책 수립, 시군 간 단속효율성 비교, 도시환경 개선 정책 등에 활용될 수 있습니다. Open API는 인증키를 기반으로 XML 또는 JSON 포맷으로 제공됩니다.-유동광고물: 거리에서 이동이 가능한 형태의 광고물로, 주로 입간판, 전단, 에어라이트 등이 포함됩니다.-고정광고물: 일정 장소에 고정된 광고물로, 현수막, 벽보 등이 여기에 해당합니다.-에어라이트: 바람을 주입하여 세우는 원기둥 형태의 광고물로, 야외 행사나 매장 홍보에 자주 사용됩니다.-전단: 손으로 나누어 주는 종이 형태의 광고물로, 대량 배포를 통해 홍보 효과를 노리는 방식입니다.'
