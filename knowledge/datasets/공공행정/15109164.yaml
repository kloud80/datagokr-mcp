status: active
summary_user: 관보에 게재된 인사혁신처·중앙선관위·대법원의 공직자 재산 공개 게시물을 건별로 담으며, 게시물마다 제목, 발행일자, 편집구분, 테마구분, 발행기관, 근거법령, 정정여부, 원문 PDF 경로를 제공한다. 국민이나 언론·분석가가 '특정 시기에 어느 기관이 공직자 재산 공개를 관보에 실었고 원문은 어디서 보나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 발행기관명(pblcnInstNm)·근거법령명 같은 이름 매핑이나 같은 기관 기준으로만 다른 관보·인사 데이터와 연결한다.
limits: 전역 조인 키가 없어 다른 데이터셋과 코드로 정확히 결합할 수 없고 이름 매칭에 의존해야 한다. 범위는 전국 단위의 비공간 데이터라 지역별 분석에는 맞지 않는다. 호출에는 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
