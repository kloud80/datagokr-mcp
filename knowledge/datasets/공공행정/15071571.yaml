description_portal: 서울시 수영장업 인허가 정보는 서울시 내 공·사립 수영장(체육시설형 수영장, 회원제 수영장 등)의 인허가 및 영업 현황을 보여주는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 각 수영장이 현재 영업 중인지, 휴업·폐업 상태인지 등 행정 이력을 파악할 수 있습니다. 사업장명, 법인명, 전화번호, 지번·도로명 주소, 우편번호, 좌표정보, 업태구분명, 문화체육업종명, 세부업종명은 수영장의 위치, 운영 주체, 체육시설 유형을 파악하는 데 핵심적으로 활용됩니다. 건축물동수, 건축물연면적, 소재지면적은 수영장 시설의 규모와 건물 구성(동 수)을 보여 주며, 지도자수는 수영 강사·지도 인력 확보 수준을 파악하는 주요 지표입니다. 공사립구분명은 공공수영장인지 민간수영장인지 구분하는 데 사용되고, 회원모집총인원은 회원제 운영 규모를 가늠하게 해 줍니다. 보험가입여부코드는 안전사고 대비를 위한 보험 가입 여부를 확인하는 항목으로, 안전관리 정책·점검 계획 수립에 유용하며, 전체적으로 서울시 수영장 분포와 규모, 운영주체, 안전·인력 현황을 분석하는 데 활용 가능한 데이터입니다.
