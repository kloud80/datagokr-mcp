summary_user: 성남시 안의 행정기관과 주요 공공기관을 기관 한 곳당 한 행으로 정리한 목록으로, 기관 구분·기관명·소재지 주소·관할구역·전화번호를 담는다(CSV 약 7KB 규모). 시민이나 분석가가 "우리 동을 관할하는 기관이 어디이고 연락처는 무엇인가", "성남시 행정구역별로 관공서가 어떻게 분포하는가"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 기관명이나 소재지 주소를 이름 매칭하거나 주소를 지오코딩해 이어 붙여야 한다.
