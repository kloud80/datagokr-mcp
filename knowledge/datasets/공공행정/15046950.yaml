description_portal: '○ 통계개요* 통계명 : 인구추이(추계인구_영유아)* 통계종류 : 일반, 가공통계* 작성목적 : 서울시 인구추이 분석을 통해 연금 및 재정 정책 등 국가중장기 발전계획의효과적 수립을 유용하게 하고, 이를 활용한 다양한 주제별 추계의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 통계청* 공표주기 : 정기(5년, 인구주택총조사 실시 다음 연도에 작성)* 공표범위 : 지역 - 서울시내용 - 서울시 추계 영유아 남ㆍ녀 인구수 등○ 용어설명* 추계인구 : 인구주택총조사 결과를 기초로 인구변동요인(출생, 사망, 국제이동 등)을반영하여 매년 7월 1일 현재로 조성법을 이용하여 추계한 인구* 영유아: 만 6세 미만의 취학 전 아동을 말함○ 기 타* 2019년 6월 공표한 장래인구추계 시도편 자료임* 작성대상 인구는 국적과 상관없이 대한민국에 상주하는 인구임.(외국인 포함)* 2000~2017년까지는 확정인구이며, 2018년 이후는 다음 인구추계시 변경될 수 있음.'
