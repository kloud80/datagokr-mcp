summary_user: 대구광역시 군위군이 조사한 생활 품목별 가격을 품목·기본조사규격·세부조사규격·단위·가격 단위로 담은 시군구 범위의 파일 데이터이다(csv 약 6.6KB 규모). 군위군 주민이나 지역 상권을 보는 분석가가 '군위군에서 쌀·돼지고기 같은 품목이 지금 얼마에 팔리는가'를 확인하거나 다른 지역 가격과 비교하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 물가동향 데이터와는 품목명·규격·단위를 이름으로 맞추어 이어 쓰고, 기관 단위로는 관리기관명으로만 연결한다.
description_portal: 대구광역시 군위군의 물가동향정보에 대한 데이터로 품목, 기본조사규격, 세부조사규격, 단위, 가격, 관리기관전화번호, 관리기관명, 데이터기준일자 항목을 제공합니다. 소비자물가지수(CPI), 생활물가지수, 체감물가 등 주요 경제지표 선정과 가격정책 수립의 기초가 되는 중요한 데이터입니다. 주로 통계청, 지자체, 한국은행 등에서 활용됩니다. 품목은 소비자물가 및 생활물가 지수 산정의 핵심 기준이며, 기본조사규격은 조사 대상 품목의 일반적 조건 또는 표준 사양이며, 세부조사규격은 브랜드, 원산지, 포장 형태 등 구체적인 조사 대상의 세부 정보입니다. 단위는 가격 비교, 지수 계산 시 일관성을 유지하기 위한 필수 항목이며, 가격은 조사 시점에서의 해당 품목의 시장 판매가격입니다.
