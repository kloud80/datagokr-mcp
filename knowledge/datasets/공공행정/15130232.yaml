description_portal: '[통계지리정보서비스(SGIS)] "생활권역 통계지도" 서비스의 사업체에 관한 코드 매핑 정보입니다.10차 선업분류코드 기준이며, 코드명 및 상위시설유형 정보등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 생활권역 통계지도  사용자가 선택한 특정시설(지점)을 기준으로단위 시간 내 도달 가능한 생활권역(생활반경, 영역)을 시각적으로 제시하고, 해당 영역 내의 통계값을 제공하는 서비스'
