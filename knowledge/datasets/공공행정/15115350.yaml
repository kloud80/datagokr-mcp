summary_user: 서울 강남구에 있는 단란주점 영업 업소를 업소 1곳당 1행으로 담은 인허가 원장이다. 인허가일자, 영업상태(영업·폐업), 휴업·폐업일자, 도로명·지번 주소, 좌표, 시설면적이 들어 있다. 창업 준비자나 상권 분석가가 '강남구에서 단란주점이 언제 얼마나 문을 열고 닫았는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 개방자치단체코드(OPNSFTEAMCODE)로만 잇는다. LOCALDATA 인허가 자료와 원천이 같다.
description_portal: 서울시 강남구 단란주점영업 인허가 정보(https://data.seoul.go.kr/dataList/OA-18549/S/1/datasetView.do)서울특별시 강남구에 위치해 있는 업소들 중에서, 주로 술과 함께 여러 종류의 음식을 직접 조리하여 손님에게 제공하고, 동시에 방문한 손님들이 실내에서 자유롭게 노래를 부를 수 있는 업소들에 대한 정보입니다.관리번호, 인허가일자. 영업상태명, 상세영업상태명(영업/정상,폐업), 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소, 위생업태명, 사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
