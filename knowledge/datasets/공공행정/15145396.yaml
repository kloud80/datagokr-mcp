description_portal: 본 데이터는 부산교통공사의 연도별 신규 채용 인원 현황을 제공하는 자료입니다.공개 채용을 중심으로 정규직(일반), 정규직(장애), 공무직, 인턴(일반), 인턴(장애인) 등 채용 유형별 인원 구성을 연도별로 확인할 수 있습니다.본 자료는 클린아이 공개자료를 기준으로 작성되었으며, 청년 인턴 등 체험형 인턴과 정기 채용을 포함합니다. 다만, 전문계약직 등 일부 계약직 채용 현황은 제외됩니다.부산교통공사의 고용 현황 변화를 분석하거나 청년·장애인 고용정책 수립, 채용 트렌드 파악 등에 활용할 수 있습니다. 특히 연도별 증감 추이를 통해 고용 다변화 방향, 사회적 책임 이행 정도, 지속가능한 인력 운용 정책 검토 등 다양한 정책 자료로 활용 가능합니다.* 본 자료는 2020년부터의 채용 정보를 제공합니다.
