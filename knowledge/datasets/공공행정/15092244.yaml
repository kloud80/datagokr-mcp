description_portal: '부산광역시 사하구의 U-옥외광고물통합관리시스템에서 사용하는 기관코드(법정동코드) 데이터입니다. 이 데이터는 사하구 관내 옥외광고물 관련 업무 처리를 위해 법정동 단위의 구역 식별에 사용됩니다. 각 법정동별 고유코드와 함께 법정동명 및 전체 행정구역명이 포함되어 있으며, 옥외광고물 설치·관리, 위반사항 조사 및 행정처분 연계 업무 등에 활용됩니다.주요 컬럼 설명○ 법정동코드 → 행정안전부 고시 기준의 법정동별 고유 식별코드○ 법정동명 → 각 법정동의 명칭 (예: 괴정동, 하단동 등)○ 법정동전체명 → 시·구·동 전체 명칭 (예: 부산광역시 사하구 하단동)'
