description_portal: 서울기록원이 보유한 역사·행정·도시 관련 기록물 중 사진 아카이브 자료의 메타데이터를 공개한 정보 기반 데이터셋입니다. 각 사진에 대한 촬영 일시, 촬영 장소, 장소 유형, 사건·행사명, 기록물 분류, 촬영자, 저작권, 파일명, 파일 유형, 크기 등의 속성을 포함하며, 기록물 식별번호를 통해 원본 디지털 아카이브와 연계할 수 있습니다. 특히 행정 기록 사진뿐만 아니라 도시 개발, 공공시설, 사회적 사건, 문화유산, 공간 변화, 시민 생활상 등을 담은 사진을 포함해 도시사 연구, 미디어 콘텐츠 제작, 교육 자료, 저작권 기반의 공공 서비스 개발 등에 활용성이 높습니다. 또한 메타데이터 기반 검색, 태그 자동 생성, 이미지 딥러닝 학습용 데이터 등 AI 기반 이미지 인식 및 아카이브 자동 분류 모델 구축에도 적용할 수 있는 실무적 가치를 가진 데이터입니다.
