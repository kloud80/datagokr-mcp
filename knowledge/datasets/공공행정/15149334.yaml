description_portal: "전라남도 순천시의 행정구역코드는 대한민국의 표준화된 행정구역 분류 체계에 따라 부여된 고유 번호입니다. 이 코드는 통계, 행정, 우편, 금융 등 다양한 분야에서 순천시 내 특정 지역을 식별하는 데 사용됩니다. 코드는 크게 행정동코드와 법정동코드 두 가지로 나뉩니다.행정구역코드의 구조와 의미 : 대한민국의 행정구역코드는 총 10자리로 구성되며, 계층적 구조를 가집니다. 순천시의 경우, 코드는 다음과 같이 구성됩니다.행정동 (Administrative Dong): 행정 효율성을 위해 설정된 구역으로, 주민센터(행정복지센터)의 관할 구역을 의미합니다. 인구 증감에 따라 분동되거나 통합될 수 있어 상대적으로 변동이 잦습니다. 예를 들어, 왕조1동과 왕조2동은 실제 행정 편의를 위해 나뉜 행정동입니다.법정동 (Legal Dong): 법률로 지정된 전통적인 지역 단위로, 주소의 기본이 되며 부동산 등기나 신분증 등에 사용됩니다. 거의 변동되지 않는 고유한 명칭을 가집니다. 예를 들어, 행정동인 왕조1동은 법정동인 조례동과 왕지동의 일부를 관할합니다.현재 순천시는 1읍, 10면, 13개 행정동으로 구성되어 있습니다. 각 행정구역별 코드는 행정안전부에서 최신 정보를 관리 및 제공하고 있습니다이러한 행정구역코드는 행정안전부의 '행정표준코드관리시스템' 웹사이트와 공공데이터포털을 통해 최신 데이터를 내려받거나 조회할 수 있어, 공공 및 민간 분야에서 널리 활용되고 있습니다."
