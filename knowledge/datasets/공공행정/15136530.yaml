summary_user: 용인시 행정읍면동별 행정구역 정보를 담은 파일로, 읍면동 코드(행정읍면동)·읍면동 이름·데이터 기준일자로 구성된 행정단위 개별 목록이다(zip 1,115바이트의 작은 파일). 용인시의 읍면동 구성과 명칭을 확인하거나, 읍면동별 통계를 지도·표로 정리할 때 기준 목록으로 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 인구·세대 통계 등 다른 자료와는 읍면동 이름 또는 같은 기관 코드 매핑으로만 연결한다.
limits: 포털 설명에는 경계 정보가 있다고 되어 있으나 실측 필드는 읍면동 코드·이름·기준일자뿐이라, 이 파일만으로 경계 기반 공간 분석은 어렵다. 다른 데이터와 붙일 공통 조인 키가 없어 이름 매칭 시 표기 차이에 주의해야 한다.
