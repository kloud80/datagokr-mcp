summary_user: 가맹본부별로 가맹사업법 위반에 따른 형벌 선고 내역을 기준년도·가맹본부관리번호 단위로 담으며, 선고 건마다 피고명·사건번호·선고법원·선고일자·범죄 사실과 선고 내용을 기록한 건별 원천 데이터다. 가맹점 창업을 준비하는 사람이 계약하려는 가맹본부가 과거 법 위반으로 형사 처벌을 받은 적이 있는지 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 같은 기관 가맹정보 데이터와는 가맹본부관리번호(jnghdqrtrsMnno)와 기준년도로, 그 밖의 데이터와는 가맹본부명 매핑으로만 잇는다.
limits: 사업자등록번호·법인등록번호 같은 전역 조인 키가 없어 다른 기관 데이터와 직접 결합하기 어렵다. 조회에는 기준년도와 가맹본부관리번호가 필요하다. 개발계정은 일 10,000회 호출로 제한된다.
