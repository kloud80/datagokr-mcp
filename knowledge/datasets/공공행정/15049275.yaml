description_portal: 서울시 공공구매 희망기업 정보는 서울시 및 공공기관과의 거래를 희망하는 기업들의 기본 현황을 정리한 데이터입니다. 인증구분을 통해 사회적기업, 마을기업, 협동조합 등 기업의 특성과 공공구매 우대 여부를 파악할 수 있으며, 업체명과 대표품목 정보를 통해 어떤 기업이 어떤 상품·서비스를 제공하는지 한눈에 확인할 수 있습니다. 전화번호와 대표자 정보가 함께 제공되어 공공기관 담당자, 민간기업, 중간지원조직 등이 직접 상담 및 협력을 추진하는 데 활용할 수 있습니다. 이 데이터는 공공조달 확대, 사회적경제 및 중소기업 판로 지원, 상생협력 네트워크 구축을 위한 기초 자료입니다.
