description_portal: '비영리민간단체지원법에 의해 서울시에 등록된 비영리민간단체의 목록입니다. - 주요정보 : 등록번호, 한글 법인명, 영문 법인명, 등록일자, 도로 주소, 지번주소, 상세주소, 전화번호, 팩스번호, 설립목적, 주요사업, 설립일, 홈페이지 주소, 대표자 이름, 주관부서 등 정보 제공*용어설명- 비영리단체(Non-Profit Organization, NPO)는 이익의 추구가 목적이 아니라 공익적인 목적을 위해 활동하는 단체를 의미, 일반 기업과 달리 이익을 구성원에게 분배하지 않고, 단체의 목적 달성을 위해 다시 사용-  비영리단체의 주요 유형 1. 시민사회단체 (NGO): 인권·환경·평화·개발협력 등 사회적 가치 추구 (예: 그린피스, 세이브더칠드런). 2. 사회복지법인: 아동·노인·장애인 복지 서비스 제공 (예: 사회복지관). 3. 문화·예술 단체: 공연, 전시, 예술가 지원 등. 4. 종교 단체: 교회, 사찰, 성당 등도 비영리 법인 형태 5. 학술·교육 단체: 학회, 장학재단, 교육재단 등.'
