summary_user: 문화체육관광부가 문화정책포털을 통해 모은 문화·체육·관광 분야 일자리 관련 뉴스를 기사 한 건 단위로 담으며, 제목·등록일·주제 분류·핵심 주제어·관련 장소·시간 범위·저작권·원문 링크 같은 항목을 함께 제공하는 전국 단위 비공간 자료다. 구직자나 연구자가 '최근 문화산업 일자리 정책이나 채용 소식에 어떤 것이 나왔나'를 찾거나, 주제어별로 일자리 뉴스 동향을 살피는 데 쓴다. 다른 데이터와 묶을 공통 조인 키는 없어서 주제어나 관련 장소 이름(spatialCoverage)을 기준으로 텍스트를 맞춰 이어 써야 한다.
description_portal: 문화체육관광부에서 제공하는 일자리뉴스 데이터는 문화 정책포털을 통해 수집된 다양한 일자리 관련 정보를 포함하고 있습니다. 자원의 명칭, 등록일, 소속 DB, 기관별 주제 분류, 핵심 주제어, 관련 장소, 시간적 범위, 언어, 저작권 등 상세한 항목을 통해 문화·체육·관광 분야의 일자리 동향과 정책 정보를 체계적으로 파악할 수 있습니다. 구직자나 연구자, 정책 담당자 등은 이 데이터를 활용하여 최신 일자리 소식, 정책 변화, 관련 인물 및 장소 정보를 분석하고, 문화산업 내 일자리 창출 현황을 심층적으로 이해하는 데 도움을 받을 수 있습니다.
