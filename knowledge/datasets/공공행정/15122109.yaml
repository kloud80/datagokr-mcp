description_portal: 본 데이터는 한국가스공사가 보유한 지적재산권 현황 정보를 제공합니다. 공사의 기술혁신 성과와 지식재산 현황 공개를 목적으로 수집되었습니다. 데이터의 세부 항목으로는 기술분류코드, 지적재산권번호, 생성일시, 특허명, 등록일자, 발명자, 기술분야, 권리유효기간, 실시권 현황 등이 포함되어 있습니다. 본 데이터는 기술이전 희망 기업, 연구개발 기관, 지식재산 연구자, 산학협력 담당자, 기술사업화 기관, 한국특허정보원이 공사의 기술 현황 파악 및 기술협력 검토에 유용하게 활용할 수 있습니다. 공공기관 연구성과의 민간 확산과 산학연 기술협력 활성화, 기술이전 촉진에 크게 기여할 것으로 기대됩니다.
