description_portal: 비위면직자는 공직자가 재직 중 직무와 관련된 부패 행위로 인해 당연퇴직, 파면 또는 해임된 자를 의미합니다.국민권익위원회는 각 공공기관에서 발생한 비위면직자의 현황을 기관 유형별로 수집하여 청렴포털에 등록합니다. 이 데이터는  2022년부터 2024년까지  기관에서 등록한 비위면직자의 기관구분별(중앙행정기관, 지방자치단체, 교육행정기관, 공직유관단체) 비위면직자 등  현황 자료입니다. 유형 별로 비위면직자 등록 추이를 분석하여 정책연구나 정책수립에 활용 할 수 있습니다.
