description_portal: '이 데이터는 기술보증기금이 운영하는 공식 SNS 채널에 게시된  콘텐츠의 형식 및 분류에 따른 제작 현황을 기록한 「유형별 SNS 콘텐츠 제작 건수」입니다.자료는 콘텐츠의 등록일자, 형식(예: 이미지, 동영상 등), 분류(예: 보도자료, 공지사항, 홍보영상 등), 콘텐츠 제목, 업로드된 SNS 채널 등으로 구성되어 있으며, 기관의 디지털 홍보 활동을 정량적으로 파악하는 데 활용될 수 있습니다.주요 항목은 ‘등록일시’, ‘콘텐츠 형식’, ‘콘텐츠 분류’, ‘콘텐츠명’, ‘업로드채널’로 이루어져 있습니다.‘등록일시’는 해당 콘텐츠가 제작 또는 업로드된 날짜를 의미하며, ‘콘텐츠 형식’은 이미지, 카드뉴스, 동영상 등 시각자료의 형태를 구분하는 항목입니다.‘콘텐츠 분류’는 보도자료, 공지사항, 캠페인, 카드뉴스, 홍보영상 등 내부 분류 기준에 따라 지정된 정보이며,‘콘텐츠명’은 개별 콘텐츠의 제목 또는 내용 요지를 요약한 문구로 구성되어 있습니다.‘업로드채널’은 해당 콘텐츠가 게시된 플랫폼을 의미하며, 블로그, 페이스북, 인스타그램, X(구 트위터), 카카오, 유튜브 등이 포함됩니다.이 데이터는 기관의 콘텐츠 제작·유통 현황을 모니터링하고, 채널별 홍보 성과나 유형별 활용 빈도 등을 분석하기 위한 기초자료로 활용될 수 있습니다.'
