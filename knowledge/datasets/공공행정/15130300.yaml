description_portal: '[SGIS 오픈 플랫폼] "인구피라미드" 서비스의 년도별 남녀인구 비율 정보입니다.기준년도별 인구성장유형이 "고위, 중위, 저위"로 구분되며남녀인구수, 여자대비남자비율, 평균나이 등이 포함됩니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 인구피라미드  ○ 움직이는 인구피라미드는 과거 인구에 대한 확정인구와 향후 인구변동(출생, 사망, 국제이동)을 고려하여 작성된 장래추계 변화를 그래프로 서비스함  ○ 서비스 내용    - 1960~2070년 연도별, 전국 각세별 인구피라미드    - 2000~2050년 연도별, 전국 및 시도 1세별 인구피라미드    - 출생년도 및 현재년도 기준으로 인구 비율을 나타내어 생존율을 표시    - 시도 간 인구구조 변화를 비교할 수 있도록 전국과 시도의 인구 변화를 대비하여 보여줌  ○ 인구성장 가정    - 고위 가정 : 높은 정도의 출산율과 기대수명을 예상해 계산    - 저위 가정 : 낮은 정도의 인구성장을 예상해 계산    - 중위 가정 : 고위와 저위의 중간치를 예상해 계산'
