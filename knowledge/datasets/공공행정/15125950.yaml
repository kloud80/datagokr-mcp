summary_user: 국회의원이 주최하는 세미나의 일정을 건별로 담으며, 세미나 제목·일자·시간·주최 의원명·장소·설명과 상세 링크로 구성된 전국 단위 비공간 데이터다. 시민·기자·연구자가 "이번 주 국회에서 어떤 의원이 어떤 주제로 세미나를 여는가"를 확인하거나 의원별 정책 관심 주제를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 의원 인적사항이나 의안 데이터와는 의원 이름(NAME) 같은 이름 매핑으로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
