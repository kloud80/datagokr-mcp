summary_user: 산림청 산림항공본부의 항공기 비행 기록을 비행정보 번호(FLYN_INFO_NO)별로 담은 건별 원천 데이터로, 비행일자·출발·착륙 시각·비행시간·착륙 횟수·임무와 비행 종류 구분·주야간 구분·비행지역명·교육훈련 내용 등을 포함하며 범위는 전국이다. 산림항공 운항 실적을 분석하는 연구자나 담당자가 '지역별·임무별로 산림 헬기가 얼마나 자주, 얼마나 오래 비행했는가'를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 비행지역명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓸 수 있다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하 제공하고 있습니다.- 해당 데이터는 산림청 산림항공본부에서 제공하는 비행시간 등을 포함하고 있는 정보입니다.
