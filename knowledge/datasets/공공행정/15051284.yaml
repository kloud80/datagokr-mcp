summary_user: 전북특별자치도 주민에게 환경오염의 주된 책임 주체를 물은 설문 결과를 기업체·관광객·모두·모름·기타 응답 비율로 담은 집계표이며, 성별·시군·연령대 같은 응답자 특성별(구분·상세구분) 교차 결과를 611바이트 CSV 한 개로 제공한다. 정책 담당자나 환경단체가 '어느 연령대나 지역 주민이 환경오염 책임을 기업보다 관광객에게 더 돌리는가'를 확인해 환경 교육·캠페인 대상을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군 이름을 맞추거나 같은 기관의 다른 설문 자료와 나란히 비교하는 방식으로만 이어 쓴다.
