summary_user: 경상북도 영양군 안 마을회관을 한 곳당 한 행으로 담은 시설 목록으로, 회관명·도로명주소·건축년도·면적·전화번호·위도·경도를 시설별로 기록한다(CSV 약 12KB). 군 담당자나 분석가가 '어느 읍면에 오래된 마을회관이 몰려 있고, 고령 주민이 걸어서 닿기 어려운 마을은 어디인가'처럼 노후도와 접근성을 따지거나 재난 때 임시대피 거점 후보를 고를 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소나 회관명을 직접 맞추거나 위도·경도로 공간 결합해 잇는다.
description_portal: 마을회관 현황 데이터는 경상북도 영양군 내 각 마을에 설치된 회관의 위치, 규모, 건축정보 등을 제공하는 생활기반시설 자료입니다. 마을회관명, 도로명주소, 건축년도, 면적, 전화번호, 위도, 경도, 데이터기준일자 등의 항목으로 구성되어 있으며, 고령 인구 비중이 높은 농촌 지역에서 주민 여가·모임·복지 전달 거점으로 기능하는 공간입니다. 본 데이터는 읍면동별 회관 분포, 건물 노후도 분석, 공간 접근성 평가, 재난 시 임시대피소 지정 등 다양한 행정 목적에 활용됩니다. 특히 위도·경도 정보는 지도 기반의 시설 위치 시각화에 유용하며, 복지사각지대 해소, 공동체 기반 사업 기획, 생활SOC 관리 등에도 활용도가 높습니다. 영양군의 지역공동체 활성화, 복지전달체계 구축, 마을 단위 생활인프라 관리 정책 수립에 필요한 기초자료입니다.
