description_portal: '이 데이터는 불법 주정차 행위에 대한 신고 접수 내역과 그에 따른 과태료 부과 결과를 정리한 자료입니다. 연도별 신고 시점과 발생 위치(주소), 부과 여부를 표준 필드로 제공하여 단속 실적 관리, 계도·단속 정책 보완, 위험·민원 다발 구간 파악 등에 활용할 수 있습니다. 신고일시는 발생 시점의 추세 분석(요일·시간대), 신고위치는 공간 분석(GIS) 및 열지도 시각화에 유리하며, 과태료 부과 여부는 행정처분 선별 기준 점검과 제도 개선 근거로 쓰일 수 있습니다. 데이터는 단순 식별(연번)과 행정 판단(부과 여부)을 분리해 기록함으로써 후속 검증과 재분류에도 적합합니다.본 데이터는 2024년 부과현황입니다. 연번: 데이터 내 사건(신고) 식별을 위한 일련번호입니다.신고년도: 신고가 접수된 연도입니다.신고일시: 신고 접수의 구체적 일시(연-월-일 또는 시분 포함)입니다.신고위치: 불법 주정차가 발생한 지번/도로명 등 위치 정보입니다.과태료 부과 여부: 해당 신고에 대한 과태료 부과 결과(부과/미부과 등)입니다.'
