description_portal: '"공공데이터 제공 표준"이란 민간의 활용수요 등을 고려하여 공공데이터포털의 개방데이터를 동일한 항목과 형식으로 제공할 수 있도록 행정안정부장관이 정한 개방데이터 표준을 의미합니다.제공표준 데이터셋을 보유하고 있는 공공기관은 행정안전부장관이 정의한 "공공데이터 제공 표준"을 준수하여 파일데이터 또는 오픈 API방식으로 데이터셋을 생성 및 제공해야합니다.개별기관이 등록한 제공표준 데이터셋은 "공공데이터포털 > 데이터 찾기 > 데이터 목록 > 표준데이터셋"에서 확인하실수 있습니다.※ 공공데이터 제공 표준 20차 제·개정(2025.10월) 기준'
