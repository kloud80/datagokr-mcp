description_portal: 이 데이터는 대구광역시 수성구 관내 성능점검 대상 기계설비가 설치된 건축물 현황을 정리한 자료로, 건축물명, 주소(도로명), 우편번호, 연면적 또는 세대수 등의 항목으로 구성된다. 성능점검 대상 기계설비는 「기계설비법」에 따라 안전성과 에너지 효율 등을 확보하기 위해 주기적 점검이 의무화된 설비들이 포함된다. 본 자료는 해당 건축물의 위치, 설비 유형과 점검 이력, 설치 시기 등을 제공함으로써 건축물 안전관리, 점검 이력 추적, 에너지 성능 분석, 유지관리 계획 등에 활용된다. 또한 점검 결과에 기반한 정비 주기 설정, 민원 대응, 안전 정책 수립, 에너지 절감대책 기획 등에 중요한 기초자료로 사용될 수 있다. 수성구청은 관련 법령에 따라 해당 정보를 정기적으로 갱신하여 최신 현황을 반영하며, 공공기관, 건축물 관리자, 안전·에너지 관계 부서 및 연구기관에서 폭넓게 활용 가능하다.
