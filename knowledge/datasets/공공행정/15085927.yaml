description_portal: '○ 통계개요* 통계명 : 자치구별 지역내총부가가치* 통계종류 : 서울시 자치구별 지역내총부가가치 현황을 제공하는 일반?가공통계* 작성목적 : 서울시 자치구별 지역내총생산 분석을 통해, 지역경제의 생산규모 및 지출수준, 소득수준, 산업구조 등을파악하여 지역 경제분석 및 정책수립에 필요한 기초자료를 제공하는 것을 목적으로 함제공하는 것을 목적으로 함* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 지역내총부가가치 현황○ 용어설명* 지역내총생산(시장가격) = 지역내총부가가치(기초가격) + 순생산물세* 당해년가격과 기준년가격- 당해년가격 : 당해연도의 경상가격으로 평가, 지역경제의 구조변동이나 지역소득을 구성하는 각 요소들의중요성이 시간의 경과에 따라 어떻게 변동하는가를 분석하고자 할 경우 이용- 기준년가격 : 어느 특정 년(통상 끝자리 0,5자 연도)도의 가격으로 평가, 장기간에 걸친 물량수준 및 구조변동을관찰할 경우 이용○ 기 타* 「서울시 지역내총생산(GRDP)」은 통계청 「시·도별 지역내총생산」의 추계시 이용되는 자료와 일부 상이하나,자료의 일관성을 위해 시 총생산 규모를 일치시켰음* 지역내총생산(GRDP)은 생산측면의 부가가치를 파악한 것이며, 각 구에서 경제활동별로 얼마만큼의 부가가치가발생되었는가를 나타내는 지표임. 소득 및 생활수준 등의 비교자료로 사용하기에는 부적합함* 연쇄가중법에 의해 추계된 실질 GRDP는 비가법적 특성에 의해 총량(또는 상위부문) 금액과 그 구성항목 금액의합이 일치하지 않음○ 출 처 : 스마트도시담당관 「서울특별시 지역내총생산」'
