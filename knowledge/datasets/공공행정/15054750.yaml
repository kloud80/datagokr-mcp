summary_user: 온비드에서 거래된 한국자산관리공사 공매(매각) 입찰·낙찰 결과를 연도와 부동산 용도(토지·건물 용도 구분)별로 묶은 전국 집계 통계로, 감정가·최저입찰가·낙찰가(백만원), 낙찰가율, 입찰참가자수, 경쟁률을 담는다. 공매 투자자나 분석가가 "최근 몇 년 사이 어떤 용도의 공매 물건이 감정가 대비 얼마에 낙찰되고 경쟁이 얼마나 치열했나"를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 용도 이름을 맞춰서만 이을 수 있으며, 같은 기관의 온비드 지역별 통계 등과 나란히 놓고 보는 방식이 현실적이다.
description_portal: '공매정보포털 온비드(Onbid)에서 거래 된 한국자산관리공사의 공매(매각) 입찰 및 낙찰에 대한 지역별 통계분석 자료로, 연도별기간, 지역, 거래금액, 입찰참가자 등의 정보를 csv 파일 형태로 제공합니다. 해당 데이터는 공공데이터 포털에서 다운로드 받을 수 있습니다.(2013년부터 2025년까지의 데이터 수록)* 연도 : 1년 단위* 용도 : 부동산 토지, 건물의 용도 구분* 감정가 및 최저입찰가, 낙찰가 : 백만원 단위* 감정가 및 최저입찰가 대비 낙찰가율: % 단위이며 낙찰가율 제외 기준은 "기타 유의사항" 부분 참조* 경쟁률: 배수 단위'
