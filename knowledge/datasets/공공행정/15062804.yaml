summary_user: 공공기관이 공공데이터포털에 등록해 개방 중인 목록을 한 행씩 담은 메타데이터 파일로, 목록유형(파일·API·표준), 목록명, 제공기관, 관리부서, 업데이트 주기, 이용허락범위, 조회수·활용신청건수 등을 담으며 CSV 한 파일이 약 135MB(135,225,877바이트)다. 분석가나 서비스 개발자가 '어느 기관이 어떤 데이터를 파일·API 중 어떤 방식으로, 어떤 주기로 개방하고 있는가'를 확인하거나 개방 현황을 기관별로 집계하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 제공기관코드나 목록명·기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 공공기관이 등록하여 공공데이터포털에서 개방중인 목록 정보(목록유형(파일, API,표준), 목록명,파일데이터명,분류체계,제공기관,관리 부서명,관리부서 전화번호,보유근거,수집방법,업데이트 주기,차기 등록 예정일,매체유형,데이터 한계,제공형태,설명,기타 유의사항,API 유형,신청가능 트래픽,심의 유형,조회수,목록 URL,국가중점여부 등)를 제공합니다.이 데이터는 공공기관들이 개방한 공공데이터의 전반적인 개방 현황을 한눈에 파악할 수 있도록 정리한 자료입니다. 각 기관이 어떤 데이터를 어떠한 방식으로 제공하고 있는지를 종합적으로 보여주며, 공공데이터 기반 서비스 개발이나 정책 수립에 필요한 기초 자료로 사용할 수 있습니다.※ "25년 7월 데이터부터 제공 칼럼을 개선, 파일데이터와 오픈API 상세페이지에서 제공하는 모든 항목을 추가하였습니다.      이에 따라 칼럼 순서가 상세페이지 순서에 맞춰 변경되었으니 데이터 이용에 참고하시기 바랍니다.
