summary_user: 경기도 시군·행정동(읍면동) 단위로 연도별 0~5세 전체 아동 인구와 3~5세 아동 인구를 나눠 담은 행정동 분석마트 집계 자료다. 지자체 보육 담당자나 분석가가 "우리 시군의 어느 행정동에 미취학 아동이 몰려 있어 어린이집·유치원 공급이 더 필요한가"를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 보육시설·인구 자료와는 시군코드·행정동코드나 시군명·행정동명을 매핑해 연결해야 한다.
description_portal: 이 데이터는 경기도 내 각 시군 및 행정동 단위의 보육 관련 기본정보를 담고 있으며, 아동 인구의 분포를 체계적으로 파악할 수 있도록 구성되어 있습니다. 주요 항목은 년도, 시군코드, 행정동코드, 시군명, 행정동명, 어린이인구0005수, 어린이인구0305수, 생성일자 등으로, 특히 05세 전체 아동 인구와 3~5세 아동 인구를 구분하여 제공합니다. 이를 통해 지역별 보육 수요를 예측하고 어린이집·유치원 등 보육 시설의 공급 정책을 수립하는 데 활용할 수 있습니다. 또한 아동복지 향상, 학령 전 아동 대상 서비스 배치, 저출산 대응 정책 연구, 도시계획 및 주거정책 분석 등 다양한 분야에서 유용하게 쓰일 수 있습니다.
