description_portal: 법제처의 해당 분석데이터는 법령문서 내부에 포함된 용어들의 빈도 기반 특성 및 단어 간 관계를 중심으로 분석 결과를 제공하는 자료입니다. 본 데이터는 법령에서 반복적으로 나타나는 핵심 용어들의 빈도 분포를 정량적으로 제시합니다. 또한 소셜네트워크분석(SNA) 기법을 적용하여 단어들 간의 상호 연결 구조를 네트워크 형태로 시각화하고, 중심성 지표를 통해 중요 용어를 도출합니다. 이를 통하여 법령어휘 체계의 핵심 관계망과 구조적 특징을 파악할 수 있습니다. 해당 자료는 법령 분석과 연구, 용어 구조 평가 등 법제적 언어의 패턴 탐색에 유용합니다. 본 데이터는 법령 문장 구성 요소의 상호 관계와 구조적 패턴 파악에 필요한 빈도 기반 분석과 네트워크 분석 결과를 함께 제공합니다.
