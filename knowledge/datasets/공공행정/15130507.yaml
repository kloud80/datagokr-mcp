description_portal: '- 전라남도 동부지역본부의 조직 현황(부서명, 직위, 담당업무, 전화번호 등)에 대한 정보를 조회하실 수 있습니다.- 전라남도 동부지역본부는 전라남도청의 지역본부 중 하나로, 순천시에 위치하고 있습니다. 이 기관은 전라남도 동부 지역의 행정, 경제, 문화 등 다양한 분야의 업무를 담당하고 있으며, 지역 발전과 주민 복지 향상을 위한 정책을 추진하고 있습니다.- 동부지역본부는 순천시 연향동에 위치해 있으며, 전라남도청의 공식 홈페이지를 통해 조직도와 업무 분장 등의 정보를 확인하실 수 있습니다.- 또한, 전라남도 동부지역본부는 유해화학물질 취급시설 검사 및 안전진단 업무를 수행하는 기관으로, 한국산업안전보건공단의 광주광역본부와 협력하여 해당 지역의 안전 관리 업무를 담당하고 있습니다.'
