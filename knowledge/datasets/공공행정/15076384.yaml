description_portal: 이천시시설관리공단에서 관리·운영 중인 홈페이지에 대한 정보입니다.당 공단에서는 홈페이지를 통하여 고객의 소리, 고객제안, 칭찬합시다 등 민원서비스와 관련된 메뉴를 제공하여 공공시설을 이용하시는 지역주민과 타지역 고객들의 불편함을 바로 접수할 수 있도록 온라인 창구를 운영하고 있고, 안전신문고를 통한 시설물 운영의 건의사항도 상시 반영할 수 있는 서비스를 제공 중입니다.또한, 매월 공단에서 생산하고 있는 문서 목록을 제공하여 어떤 사업에서 어느 문서가 생산되고 있는지 공개하고 있습니다. 공단의 게시글 중 가장 선호도가 높은 채용 분야는 별도로 메뉴를 생성하여 채용 공고부터 합격자 발표까지 한 눈에 파악할 수 있는 서비스를 제공 중입니다.
