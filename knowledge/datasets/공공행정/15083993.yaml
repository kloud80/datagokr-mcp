description_portal: 공공기관 청렴도 평가는 국민권익위원회가 주관하여 매년 실시하는 제도입니다. 이 평가는 공공기관의 부패 수준과 청렴 문화 정착 정도를 객관적으로 측정하여, 국민 신뢰를 높이고 반부패 정책을 강화하는 데 목적이 있습니다.2013년부터 2017년까지의 공공기관별 청렴도 평가 결과를 수록한 데이터입니다. 중앙행정기관, 지방자치단체, 교육청 등 기관 유형별로 구분되며, 종합청렴도, 외부청렴도, 내부청렴도로 구성된 점수 체계에 따라 각 기관의 청렴 수준을 수치화하여 제공하고 있습니다. 국민이 체감하는 부패 수준을 정량적으로 파악하고, 공공기관의 청렴도 향상을 위한 정책 수립에 활용될 수 있는 핵심 자료로 활용됩니다.
