summary_user: 경기도 경기통계시스템의 통계표마다 연결된 간행물과 관리 담당부서, 최종변경일을 한 행씩 담은 메타정보 자료다. 경기도 통계를 쓰는 분석가나 담당자가 특정 통계표를 어느 부서가 관리하고 언제 마지막으로 바뀌었는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없고, 통계표ID(sttbl_id)를 매개로 같은 기관의 "경기도 경기통계시스템 통계표정보"와 이어 통계표 이름을 붙여 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템에서 운영 중인 통계표와 이를 담당하는 부서 간의 관계를 정리한 메타정보 자료로, 통계표ID와 간행물ID, 최종변경일, 담당부서명이 주요 항목으로 구성되어 있습니다. 각 통계표는 창조행정담당관, 기획조정실 등의 부서별로 관리되며, 통계 작성과 갱신 이력을 포함하고 있어, 통계자료의 행정적 출처 및 관리 체계를 파악하는 데 유용합니다. 또한 이 데이터는 통계표와 간행물 간의 연계 관계를 분석하거나, 통계자료의 행정 책임 부서를 확인하여 자료의 신뢰성과 최신성을 검토하는 데 활용할 수 있습니다. 최종변경일 항목은 통계자료 갱신 이력을 통해 통계 업데이트 주기를 파악할 수 있으며, 통계품질 개선 또는 메타데이터 관리 목적에도 적합합니다.※통계표ID에 해당하는 자료명은 "경기도 경기통계시스템 통계표정보"를 참고해 주시기 바랍니다.
