description_portal: '한국남동발전 내 각 부서의 주요 업무와 관련된 정보를 담고 있습니다.1. 사업소와 본사의 구분으로 하여 어느 조직에 속하는지 여부를 나타냅니다.2. 부서명 : 각 부서의 명칭입니다.3. 분장업무 : 각 부서에서 담당하는 주요한 직무들을 나열합니다.각 부서는 고유 기능을 효율적으로 수행하기 위해 다양한 역할을 부여 받습니다. 이를 통해 조직 전체의 목표 달성에 기여하며, 중복되거나 불필요한 작업을 최소화하여 자원을 최적화할 수 있도록 설계되었습니다.또한 이러한 정보는 투명성을 높이고 대중과의 소통 강화를 목적으로 합니다. 따라서 누구나 쉽게 열람 및 활용 가능하도록 제공됩니다.'
