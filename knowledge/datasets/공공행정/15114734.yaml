summary_user: 안양시 시청·구청·동 행정복지센터 등 관공서를 한 곳씩 담은 시군구 범위의 개별 시설 목록으로, 기관 구분(구분명)·대표 전화번호·도로명/지번 주소와 집계일자를 담는다. 시민이 가까운 동 행정복지센터의 위치와 연락처를 찾거나, 분석가가 안양시 행정기관의 분포를 지도에 올려 민원 접근성을 따져볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와 붙이려면 주소를 지오코딩하거나 기관명·행정구역명을 맞춰 연결해야 한다.
description_portal: '안양시 관공서 현황(집계일자,시군명,구분명,전화번호,소재지도로명주소,소재지지번주소)입니다.• 청사 위치 정보: 도로명 주소 및 지번 주소로 행정기관의 위치를 파악할 수 있음• 기관 구분: 시청, 구청, 동 행정복지센터• 전화번호 안내: 민원 및 행정 서비스 이용을 위한 대표 연락처 제공• 행정구역별 분류: 동안구, 만안구 등 행정구역 단위로 분류 가능• 업데이트 주기: 연 1회 갱신• 활용 목적: 민원 안내, 행정 서비스 접근성 분석, GIS 기반 행정지도 구축 등이 데이터에는 총 34개 관공서의 정보가 포함되어 있으며, 주소 기반 공간 분석이나 행정 서비스 개선에 유용하게 활용될 수 있어요.'
