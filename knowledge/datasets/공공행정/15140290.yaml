summary_user: 온비드에서 거래된 압류재산 공매의 입찰·낙찰 실적을 광역시도 단위·월 단위로 집계한 통계 파일로, 입찰·낙찰 건수와 낙찰률, 감정가·최저입찰가·낙찰가(백만원), 낙찰가율, 입찰참가자 수와 경쟁률을 담는다. 공매 투자자나 분석가가 '최근 경기 지역 압류재산 공매의 낙찰가율과 경쟁률이 어떻게 변했나'처럼 지역별·시기별 공매 시장 흐름을 비교하는 데 쓴다. 전역 조인 키는 없고 지역명(시도)과 년월로만 다른 지역 통계와 이름 매핑해 이어 쓴다.
description_portal: '공매정보포털 온비드(Onbid)에서 거래 된 "압류재산" 공매 입찰 및 낙찰에 대한 지역별 통계분석 자료로, 월별기간, 지역, 거래건수, 거래금액 등의 정보를 csv 파일 형태로 제공합니다. 해당 데이터는 공공데이터 포털에서 다운로드 받을 수 있습니다. * 지역: 광역자치도 단위(서울, 인천, 경기, 강원, 충북, 대전, 충남, 대구, 경북, 부산, 울산, 경남, 전북, 광주, 전남, 제주, 세종) * 년월: 1개월 단위 * 입찰건수 및 낙찰건수, 낙찰률: 건, % 단위 * 감정가 및 최저입찰가: 백만원 단위 * 감정가 및 최저입찰가 대비 낙찰가율: % 단위이며 낙찰가율 제외 기준은 "기타 유의사항" 부분 참조 * 입찰참가자 수 및 경쟁률: 명, 배수(단위)'
