summary_user: SGIS '살고싶은 우리동네' 서비스에 쓰이는 고등학교별 진학자 비율을 기준년도·학교명 단위로 담은 전국 범위 파일(CSV, 약 0.9MB)이다. 이사나 주거지를 고르는 사람이 동네 고등학교의 진학률을 비교하거나, 분석가가 지역별 교육 여건을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없고 위치 정보도 없어서, 학교 기본정보 같은 다른 데이터와는 학교명을 맞춰 붙여야 한다.
