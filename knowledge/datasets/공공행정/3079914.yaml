description_portal: 전라남도 해남군 여권발급현황(2013년~2026년)에 대한 데이터입니다.이 데이터에는 지역, 대행기관, 연도, 월별, 합계 항목을 제공합니다.1. 여권(旅券, Passport)- 여권은 소지자의 국적 등 신분을 증명하고 국적국이 소지자에 대해 외교적 보호권을 행사할 수 있는 공문서의 일종으로, 외국을 여행하려는 국민은 여권을 소지해야 합니다 . (여권법 제2조)2. 여권발급 대상- 대한민국 국적을 보유하고 있는 사람 (여권법 제2조)-법령에 의한 여권발급 거부 또는 제한 대상이 아닌 사람 (여권법 제12조)-복수국적자 * 외국 국적 취득 등으로 한국 국적이 상실된 후 한국 여권을 계속 사용한 경우에 처벌 대상(출입국관리법 제7조, 제94조)이 되며, 국적상실 후 여권을 부정 발급받아 사용하는 경우에는 출입국관리법 위반 이외에도 여권법 제16조, 제24조 위반으로 처벌될 수 있음.3. 여권 신청본인 직접 신청 원칙 (여권법 제9조)-여권(여행증명서)의 발급, 재발급 등은 본인이 직접 신청하여야 하며, 예외적인 경우에 한해 대리인을 통한 신청 가능여권 신청인(본인) 확인 신분증-국가기관이 발급한 사진이 부착되어 있고 보안요소가 내재되어 있는 유효한 주민등록증, 운전면허증, 여권 등사진과 주민등록번호가 기재되어 있는 장애인등록증(복지카드) 가능. 단, 단순히 생년월일만 기재된 것은 제외- 미성년자는 법정대리인이 신청4. 공통 구비 서류- 여권발급신청서- 신분증- 여권용 사진 1매(6개월 이내 촬영한 사진)- 가족관계기록사항에 관한 증명서(행정정보공동이용망을 통해 확인 가능한 경우 제출 생략)- 국적 확인 서류(국적 상실자로 의심되는 경우)
