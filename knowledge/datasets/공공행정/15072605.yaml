description_portal: 서울특별시 강서구의 CCTV 사용자별 정보와 관련된 자료입니다. 해당 데이터는 강서구청 스마트정보과에서 관리하며 2016년 2월부터 2020년 9월까지의 접속월, 접속일, 접속건수를 담고있습니다. 2020년 10월 개방되어 1회성으로 제공되는 csv파일의 데이터입니다. 서울특별시 강서구에서 개방한 그외 CCTV 데이터와 연계하여 사용 가능합니다. 이 데이터는 관제 시스템의 운영 효율성 분석, 보안 인프라 점검, 정보접근 관리 체계 검토 등에 활용되어, 스마트 행정 및 공공안전 데이터 거버넌스 정책 수립에 기여할 수 있는 행정데이터입니다.
