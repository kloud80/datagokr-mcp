summary_user: 체납으로 압류된 재산의 공매 결과를 낙찰연도·낙찰월, 시도·시군구, 재산 용도(재산항목명)별로 묶어 감정평가금액·매각금액과 감정가 대비 낙찰가 비율(낙찰가율)을 담은 집계 자료로, 범위는 전국 시군구 단위다. 투자자나 부동산 분석가가 "최근 1년간 서울 주거용 건물 공매는 감정가의 몇 % 수준에서 낙찰됐나" 같은 질문으로 지역·용도별 공매 시장 흐름을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 이름 매핑이나 같은 기관(한국자산관리공사) 자료 기준으로만 이어 쓴다.
limits: 개별 물건 단위가 아닌 용도·지역별 집계이므로 특정 공매 물건의 낙찰 내역은 알 수 없다. 행정코드 등 공통 조인 키가 없어 다른 지역 통계와 연결하려면 시도·시군구 이름을 코드로 직접 매핑해야 한다.
