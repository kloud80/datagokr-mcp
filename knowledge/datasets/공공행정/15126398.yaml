description_portal: 체납으로 압류된 재산의 공매 결과를 분석한 자료로, 감정가격 대비 실제 낙찰가격의 비율인 '낙찰가율' 데이터를 제공합니다. 본 자료는 최근 1년간의 낙찰일 기준 데이터를 기반으로 하며, 재산의 용도(주거용 건물, 근린생활시설, 토지 등) 및 지역(서울, 경기, 부산 등)별로 구분해 제공됩니다. 낙찰가율은 공매 시장의 활황 또는 침체 여부를 판단할 수 있는 핵심 지표이자, 부동산 경기를 가늠해볼 수 있는 참고 자료로 활용됩니다. 또한, 체납재산이 실제로 어느 수준에서 매각되었는지, 얼마나 효율적으로 회수되었는지를 한 눈에 파악할 수 있는 유용한 지표이기도 합니다.
