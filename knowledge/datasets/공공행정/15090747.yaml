summary_user: 인천광역시 서구 주민참여예산 민관협의회의 구성원 명단을 담은 작은 파일(csv 893바이트)로, 구성원별로 구분·협의회 내 직위·성명·소속 직위를 한 행씩 담는다. 주민이나 지역 연구자가 '서구 주민참여예산 민관협의회는 누가 맡고 있고 민간과 공무원이 어떻게 섞여 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(서구)이나 이름 매핑으로만 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구의 주민참여예산 운영을 위한 민관협의회 구성 현황을 제공하고 있습니다. 본 자료는 인천광역시 서구의 주민참여예산 민관협의회의 협의장 직위, 성명, 직위 등의 정보를 수록하고 있습니다. 본 데이터를 통해 협의회 구성의 투명성과 공정성을 확보해 줄 수 있고, 지역 주민의 정책 참여 기회에 확대해 줄 수 있다는 것에 기여를 할 수 있을것으로 기대가 됩니다. 또한 협의회 구성의 운영실태 파악 등 기초자료에 활용할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
