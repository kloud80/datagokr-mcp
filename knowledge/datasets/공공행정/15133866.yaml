summary_user: 경기도의정포털에서 의회 요구서나 협조요청이 들어왔을 때 실국·부서·담당자 단계로 담당을 지정한 이력을 건별로 담으며, 요구서 순번(dmnd_seq_no)과 파트 순번, 단계별 지정 부서·등록일, 지연 사유와 지연 예정일, 협조 요청 내용이 함께 들어 있다. 행정 분석가나 감사 담당자가 '어떤 요구서에서 담당 지정이 어느 단계에서 얼마나 늦어졌고 그 사유는 무엇이었나'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못해, 같은 의정포털의 요구서 관련 자료와 요구서 순번이나 부서 코드처럼 같은 기관 내부 코드로만 연결할 수 있다.
description_portal: 이 데이터는 경기도의정포털 시스템 내에서 요구서나 협조요청에 따라 담당자를 지정한 이력 정보를 기록한 자료입니다. 주요 항목에는 파트시퀀스번호, 요구서시퀀스번호, 담당지정정보 단계(실국·부서·담당자), 지연 사유 및 지연 예정일자 등이 포함되어 있으며, 담당 지정 정보의 흐름 및 이력을 체계적으로 관리하는 데 활용됩니다. 특히 담당지정 지연 사유를 제공하여 행정업무 지연 원인을 확인하는 데 활용 할 수 있습니다. 본 데이터는 공공행정의 업무 흐름 추적, 이력 기반 감사자료 확보, 협조요청의 투명성 확보 및 조직 내 협업 구조 분석에 활용될 수 있습니다.
