description_portal: 해양수산연수원의 선원교육 과정에 참여한 교육생들의 거주지 현황을 연도별·과정별로 정리한 자료입니다. 해당 자료는 2024년 기준으로 기초안전교육 및 상급안전교육 과정에 참여한 교육생의 지역 분포가 전남, 전북, 충남 등으로 나뉘어 상세히 제공되며, 신규교육, 재교육, 온라인 과정, 구명정작동, 응급처치, 국제선 전용과정 등 다양한 유형이 포함되어 있습니다. 지역별 교육 수요 파악과 향후 교육 정책 수립 및 분원 운영 전략 수립에 유용한 기초자료로 활용될 수 있습니다.* 연도, 분류, 지역정보를 포함하고 있습니다.
