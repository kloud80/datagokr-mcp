summary_user: 산림청 산림항공본부의 관리소(산림항공 관리소)별 이름·좌표(경위도 또는 X·Y 좌표)·사용 여부·등록·수정 일시 등을 관리소 한 곳당 한 행으로 담은 전국 범위 목록이다. 산불·산림재난 대응 분석가나 지자체 담당자가 '우리 지역에서 가장 가까운 산림항공 관리소는 어디인가'를 확인하거나 지도에 관리소 위치를 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리소명 매칭이나 좌표(RGN_XCRD·RGN_YCRD) 기반 공간 결합으로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 산림청 산림항공본부에서 제공하는 관리소명, 좌표 등을 포함하고 있는 정보입니다.
