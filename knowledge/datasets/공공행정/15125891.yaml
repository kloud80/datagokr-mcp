summary_user: 국회 열린국회정보(open.assembly.go.kr)가 제공하는 OPEN API 전체 목록을 API(정보) 한 건당 한 행으로 담은 카탈로그로, 정보명·설명·분류·공개일시·제공기관·적재 주기·명세 주소·서비스 주소·이용허락 조건 등을 포함한다. 국회 데이터를 활용하려는 개발자나 분석가가 "의안·회의록·의원 정보를 주는 API가 무엇이고 어디서 호출하나"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 정보 식별자(INF_ID)나 서비스 주소를 통해 개별 국회 API 데이터셋과 이름 기준으로 대응시켜 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
