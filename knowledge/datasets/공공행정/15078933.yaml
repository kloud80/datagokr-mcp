description_portal: '이 데이터는 지방세 통계자료의 체계적 관리를 위해 전라북도 부안군에서 관리하는 세목별 과세현황을 수집한 것이다. 행정안전부에서 제공하는 자치단체 통합 지방세정보시스템의 과세 자료를 기반으로, 부안군 관내 주민 및 사업자에게 부과된 지방세의 항목별 현황을 전산 처리하여 구축하였다. 해당 자료는 지방세 부과 및 징수 행정의 투명성 확보와 함께 세정업무의 효율적 운영을 목적으로 활용된다.자료는 연도별로 구성되어 있으며, 각 연도에 해당하는 시도명, 시군구명, 자치단체코드, 과세년도, 세목명(예: 자동차세, 재산세 등), 과세건수, 과세금액, 비과세건수, 비과세금액 등의 세부 항목을 포함한다. 과세건수와 금액은 실제로 부과된 건수와 금액을 나타내며, 비과세건수와 금액은 지방세 감면 및 면제 대상에 해당되어 과세되지 않은 내역을 의미한다.이 데이터를 통해 각 세목별 부안군의 과세 현황과 감면 현황을 한눈에 파악할 수 있으며, 향후 세입 추계, 정책 수립, 세정업무 개선을 위한 근거자료로 활용될 수 있다. 아울러 타 자치단체와의 비교 분석, 세목 간 추세 분석, 예산편성 참고자료로도 유용하게 활용 가능하다. 공공데이터로 제공됨에 따라 민간 기업, 학계, 시민단체 등에서도 다양한 분석자료로 활용될 수 있을 것으로 기대된다.'
