summary_user: 경기도의정포털에서 담당자별로 지정된 첨부파일 정보를 파일 한 건 단위로 담으며, 파트 식별번호, 파일 순번, 첨부파일ID, 전자결재 포함 여부(Y/N)로 구성된다. 의정포털 전자문서를 분석하는 사람이 "전자결재로 처리된 첨부파일이 얼마나 되는가" 같은 파일 이력·유형 통계를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 다른 데이터와는 같은 기관 자료끼리 파트 식별번호나 첨부파일ID 같은 내부 번호를 맞춰 볼 수 있을 뿐이다.
description_portal: 이 데이터는 경기도의정포털에서 담당자별로 지정된 파일 정보를 나타내며, 각 파일의 파트시퀀스번호, 파일순번, 첨부파일ID, 전자결재 파일여부 등의 항목으로 구성됩니다. ‘파트시퀀스번호’는 파일이 소속된 부서나 파트의 식별자를 의미하고, ‘파일순번’은 문서 내 파일의 정렬 순서를 나타냅니다. ‘첨부파일ID’는 시스템 내에서 파일을 고유하게 식별하는 번호이며, ‘전자결재 파일여부’는 해당 파일이 전자결재 시스템에 포함되었는지를 Y/N으로 구분합니다. 이 데이터는 전자문서 관리 체계의 효율성을 높이기 위한 분석, 파일 이력 추적, 문서 유형별 통계 분석 등에 활용될 수 있습니다.
