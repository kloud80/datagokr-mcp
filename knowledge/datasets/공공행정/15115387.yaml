summary_user: 서울특별시 강남구에서 실내·실외 시설을 갖추고 골프 연습을 제공하는 업소의 인허가 원장을 업소 한 곳당 한 행으로 담으며, 인허가일자·폐업일자·휴업기간 같은 영업상태 이력과 도로명·지번 주소, 좌표(X, Y)를 포함한다. 상권 분석가나 창업 예정자가 "강남구에서 최근 몇 년간 골프연습장이 얼마나 새로 생기고 문을 닫았는가"처럼 업종의 개폐업 추이와 입지 분포를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 원천을 공유하는 LOCALDATA 인허가 자료와 대조해 쓴다.
description_portal: 서울시 강남구 골프연습장업 인허가 정보(https://data.seoul.go.kr/dataList/OA-19599/S/1/datasetView.do)서울특별시 강남구의 골프를 연습하기 위해 실내 또는 실외에 시설을 갖추어 제공하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
