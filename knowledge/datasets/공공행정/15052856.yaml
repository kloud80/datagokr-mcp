summary_user: 경기도 포천시 관내 식품위생 관련 업소를 한 곳씩 업종명·업소명·도로명주소·지번주소로 담은 업소 단위 현황 파일(csv, 약 97만 바이트)이다. 주민이나 분석가가 "포천시 어느 지역에 어떤 업종의 식품업소가 몰려 있나"를 확인하거나 위생 점검 대상 목록을 짤 때 쓴다. 전역 조인 키나 코드 필드는 없어 다른 데이터와는 주소 문자열이나 업소명 매칭으로만 이어 쓰고, 좌표가 필요하면 주소를 지오코딩해 붙인다.
description_portal: 경기도 포천시에서 제공하는 식품위생업소 현황 데이터입니다. 본 데이터는 포천시 관내 식품위생 관련 업소의 기본 정보를 수록한 자료로, 업종명, 업소명, 소재지 도로명주소, 지번주소 등의 항목으로 구성되어 있습니다.해당 데이터는 식품위생업소의 업종별 분포 및 위치 정보를 파악하는 데 활용될 수 있습니다. 또한 식품안전 관리, 위생 점검 계획 수립, 지역 위생환경 개선, 민원 대응 및 식품위생 정책 수립 등을 위한 기초자료로 활용될 수 있습니다. 본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
