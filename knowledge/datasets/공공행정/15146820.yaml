summary_user: 각 기관이 정보공개시스템에 등록한 사전정보공표 건을 기관·부서별로 담은 파일로, 등록일자·처리결과·전체/성공/실패 건수·공표 주기와 종합평가 점수(평가점수)를 함께 담는다(전국 범위, CSV 약 3.5MB). 정보공개 담당자나 분석가가 '어느 기관이 사전정보를 어떤 주기로 얼마나 공표했고 평가 점수는 어땠는가'를 확인하는 데 쓴다. 기관코드(instt_cd)를 키로 행정표준코드의 기관·부서코드표나 다른 기관 단위 데이터와 이어 쓴다.
description_portal: 각 기관에서 정보공개시스템을 통해 등록한 사전정보공표 기반 자료입니다.해당 자료는 종합평가 자료의 일부와 각 기관에서 사전정보와 관련된 일부 자료를 확인하실 수 있습니다.또한 2025년 기관 종합평가가 아직 시행되지 않아 2024년 종합평가 자료만 제공됩니다.추가정보 필요시 정보공개시스템을 통해 년도별 각 기관의 종합평가 자료를 제공하고 있습니다.https://www.open.go.kr/infOthbc/dta/dtaDta.do기관코드 및 부서코드 정보는 행정표준코드(https://www.code.go.kr/index.do) 에서 확인 가능합니다.
