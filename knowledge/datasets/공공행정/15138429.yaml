description_portal: 이 데이터는 제주에너지공사의 연도별 친환경 녹색제품 구매 실적을 정리한 자료입니다. 공공기관의 녹색소비 촉진을 위한 노력의 일환으로, 조달청 나라장터를 통해 구매한 녹색제품의 항목별 금액, 구매 비율, 구매처 등을 포함하고 있습니다. 이를 통해 친환경 제품 소비 확대를 위한 공사의 정책 이행 현황과 지속가능한 소비문화 확산을 위한 실적을 확인할 수 있습니다. 해당 자료는 환경부의 녹색제품 기준에 따라 분류되며, 연도별 비교를 통해 친환경 구매 추세와 성과를 파악할 수 있습니다. 또한 공공기관의 책임 있는 소비 활동을 시민들이 이해하고 참여하는 데에도 기초자료로 활용될 수 있으며, 지속가능경영 및 ESG경영 실천의 지표로서도 의미가 큽니다.
