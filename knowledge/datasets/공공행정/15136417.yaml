summary_user: 경기공유서비스에서 운영하는 행정서비스별로 월 단위 예약 개시·마감 일시(년·월·일·시간)를 예약기간 번호 단위로 담은 설정 정보로, 서비스 일련번호·기관코드·상담분야도 함께 담는다. 경기도 공유서비스로 행정 상담을 예약하려는 도민이나 이를 안내하는 개발자가 '이 행정서비스의 다음 달 예약은 언제 열리고 언제 마감되나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 행정서비스 일련번호(administ_servc_sn)나 기관코드(inst_cd)로 같은 경기공유서비스의 행정서비스 목록·기관 정보와 이름·코드를 맞춰 연결한다.
description_portal: 이 데이터는 행정서비스 예약 운영을 위한 기간 정보를 포함하고 있으며, 각 행정서비스에 대해 설정된 월별 예약 시작 및 종료 기간을 제공합니다. 주요 항목으로는 예약기간을 구분하는 ‘예약기간번호’, 행정서비스 식별을 위한 ‘행정서비스 일련번호’, 제공기관을 나타내는 ‘기관코드’, 상담 가능 분야를 표시하는 ‘상담분야배열’, 예약 기준 월 및 ‘예약시작년’, ‘예약시작월’, ‘예약시작일’, ‘예약시작시간’ 등의 예약 개시 정보를 포함합니다. 또한, ‘예약종료년’, ‘예약종료월’, ‘예약종료일’, ‘예약종료시간’을 통해 예약이 마감되는 일시를 구체적으로 설정할 수 있습니다.
