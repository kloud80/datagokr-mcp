summary_user: 지방자치단체가 민간투자사업(BTO·BTL 등)과 관련해 민간사업자에게 지급하는 재정부담액(운영비·임대료·시설투자비 상환·최소운영수입보장 등)을 회계연도와 자치단체별로 담은 전국 단위 공시 데이터로, 총액과 세부 부담액 항목이 함께 실린다. 지역 주민이나 재정 분석가가 "우리 시·군·구가 민자사업 때문에 해마다 얼마를 민간에 지급하고 있나"를 확인하거나 자치단체 사이에서 비교하는 데 쓴다. 전역 조인 키는 확인되지 않았으므로 다른 지방재정365 공시 데이터와는 회계연도와 자치단체 코드·이름(laf_cd 등)을 맞춰 연결한다.
description_portal: 민자사업 재정부담액은 「사회기반시설에 대한 민간투자법」에 따라 민간이 자금을 투자하여 사회기반시설을 건설하고 운영하는 **민간투자사업(BTO, BTL 등)**을 추진하는 과정에서, 지방자치단체가 민간사업자에게 지급하는 재정적 지원 금액을 의미합니다. 이는 지방자치단체가 해당 사업의 추진을 위해 민간사업자에게 운영비, 시설 임대료, 시설투자비 상환, 최소운영수입보장(MRG) 등의 명목으로 중장기적으로 부담해야 하는 비용을 포함합니다.민자사업 재정부담액은 지방자치단체의 재정지출에 직접적인 영향을 미치는 항목으로, 각 자치단체는 이 금액을 회계연도별로 산정하여 예산에 반영하고, 향후 수년간의 재정 계획에도 포함시켜야 합니다
