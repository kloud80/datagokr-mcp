summary_user: 국회 위원회별 정보를 영문으로 담은 데이터로, 위원회 구분 코드(CMIT_DIV_CD)·위원회명·위원장명·위원 정수·현재 위원 수·관련 링크를 위원회 단위로 제공한다. 해외 연구자나 영문 자료를 만드는 분석가가 '국회 각 상임위원회의 영문 명칭과 위원장, 위원 구성 규모는 어떠한가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 국회 데이터와는 위원회명 매핑이나 같은 기관(국회) 코드로만 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
