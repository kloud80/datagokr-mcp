description_portal: 이 자료는 1967년부터 2024년까지 대한민국의 국제기능올림픽 참가 현황에 대한 자료입니다. 대한민국은 1967년 스페인에서 열린 제16회 국제기능올림픽부터 참가하였습니다. 국제기능올림픽은 1971년 이후 2년마다 개최되고 있습니다. 본 자료에는 연도별 개최국, 해당 연도 국제기능올림픽에서 운영된 전체 직종 수, 대한민국 국가대표팀이 참가한 직종 수, 한국 선수들이 해당 국제대회에서 획득한 금메달, 은메달, 동메달 수, 대한민국의 대회별 종합 순위에 대한 자료를 포함하고 있습니다.
