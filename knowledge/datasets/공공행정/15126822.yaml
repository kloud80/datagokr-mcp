summary_user: 캠코가 관리하는 국유일반재산 가운데 「국유재산특례제한법」에 따라 양여된 재산을 건별로 담으며, 소재지명·재산구분·계약일자·매수인·담당부서·기준일자를 제공하고 범위는 전국, 위치 단위는 개별 주소다. 분석가나 지자체·공공기관 담당자가 '우리 지역에서 특례 양여로 넘어간 국유재산이 어디에 어떤 종류로 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 지번코드(PNU)나 행정코드로 바로 붙일 수 없고, 소재지명 주소를 정제해 국유재산 PNU 체인이나 같은 기관의 특례 대부 운용현황과 이름 매칭으로 연결한다.
description_portal: 한국자산관리공사_국유재산특례 운용현황(양여) 조회서비스 API는 국가(기획재정부)가 보유하고 한국자산관리공사가 관리하는 국유일반재산 중 국유재산특례(양여) 현황 자료입니다. 「국유재산특례제한법」에 따라 운용 중인 국유재산 특례(양여) 대상의 소재지, 종류 등의 정보를 제공합니다.※ 관련 내용은 캠코국유재산포털(https://gpminwon.kamco.or.kr)에서도 확인할 수 있습니다.※ 데이터 포맷은 JSON 및 XML 형태로 제공됩니다. ※  국유재산특례 대부 운용현황은 '한국자산관리공사_국유재산특례 운용현황(대부) 조회서비스' 참고
