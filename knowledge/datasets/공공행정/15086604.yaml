description_portal: 옥외광고물 DB 구축을 위해 실시한 전수조사 용역사업의 결과보고 자료이다. 관내에 설치된 모든 고정 옥외광고물을 대상으로 「옥외광고물 등 관리법령」에 따라 현황 및 불법 실태를 전수 조사하였으며, 새올행정시스템 기준 20개 필수항목을 포함한 세부 정보를 수집하였다. 조사 항목에는 광고물 종류별 현황, 위치 정보, 관리 정보 등이 포함되며, 광고물 사진 촬영, 크기 보정, 입력 내용 검수, 서버 업로드 및 전수조사 번호 일치 여부 확인까지 수행하였다.조사기간은 2025년 10월 부터 11월 까지이며, 조사요원 선발 및 교육, 현장 전수조사, 결과물 수정·보완 절차를 거쳐 최종 성과물을 도출하였다. 성과물로는 전수조사 보고서, 엑셀 데이터 파일 등 DB 구축 자료가 포함되어 있으며, 정확하고 신뢰성 있는 통계자료 확보와 체계적·효율적인 옥외광고물 관리행정 및 도시경관 정책 수립을 위한 기초자료로 활용된다.
