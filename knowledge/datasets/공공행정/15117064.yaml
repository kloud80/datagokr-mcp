summary_user: 경기도 시군구별로 등록된 반려동물을 생년·RFID 등록방식(외장형·내장형·인식표)·축종·품종·맹견여부 조합마다 마릿수로 합산한 집계 데이터이며, 건별 개체 원장이 아닙니다. 지자체 담당자나 분석가가 "우리 시군에서 내장형 칩으로 등록한 맹견은 몇 마리이고 어떤 품종이 많은가" 같은 질문에 쓴다. 전역 조인 키는 없고, 시도명·시군구명(SIGNGU_NM) 이름을 매핑해 시군구 단위 인구나 반려동물 관련 시설 데이터와 이어 쓴다.
description_portal: '이 데이터는 경기도 내 반려동물 등록현황을 수록한 자료로, 각 시군구별로 등록된 동물의 생년, RFID 등록방식(외장형, 내장형, 인식표), 축종(예: 개), 품종(예: 믹스견, 미니어쳐 핀셔 등), 마릿수, 맹견여부 등의 항목으로 구성되어 있습니다. 주요 항목에는 ‘RFID구분’, ‘생년’, ‘품종’, ‘마릿수’, ‘맹견여부’ 등이 있으며,지역별 반려동물 보유 현황 파악, 맹견관리 정책 수립, 등록방식 선호도 분석 등에 활용될 수 있습니다. 특히 RFID 유형별 분류는 등록제도의 정착 여부를 판단하는 데 유용하며, 축종 및 품종별 데이터는 반려동물 관련 산업 분석이나 정책 지원 자료로도 활용 가능합니다. 마릿수는 생년·품종 조합별로 합산되어 있어 시계열 비교나 구조적 분포 분석에 적합합니다.'
