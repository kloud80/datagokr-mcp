summary_user: 공정거래위원회에 등록된 후원방문판매사업자를 사업자 한 곳당 한 건으로 담으며, 상호명·후원방문판매 등록번호·대표자명·전화번호·본사 주소·등록부서 등을 전국 범위로 제공한다. 소비자가 후원방문판매 방식으로 물건을 권유받았을 때 그 업체가 실제로 등록된 사업자인지 상호나 대표자명, 등록번호로 확인하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어서, 다단계·방문판매 등 다른 특수판매 등록정보와는 상호명·대표자명·주소를 맞춰 보는 방식으로만 이어 쓴다.
