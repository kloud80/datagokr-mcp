summary_user: 공정거래위원회 가맹사업 정보공개 자료 중 가맹본부별 재무 현황을 가맹사업기준년도·가맹본부관리번호 단위로 담으며, 자산·자본·부채·매출·영업이익·당기순이익과 회계년도, 사업년도 기준월, 재무제표 작성 여부, 화폐단위를 함께 제공한다. 프랜차이즈 창업 예정자가 "이 가맹본부가 재무적으로 믿을 만한가"를 확인하거나 분석가가 여러 가맹본부의 매출·이익 규모를 비교하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어, 같은 기관의 다른 가맹정보 API와는 가맹본부관리번호(jnghdqrtrsMnno)로, 그 밖의 데이터와는 이름 매핑으로만 연결한다.
description_portal: 이 API는 프랜차이즈 가맹본부의 재무 현황 정보를 조회할 수 있는 공공데이터 서비스입니다.가맹사업기준년도(필수)와 가맹본부관리번호를 이용하여 가맹본부의 자산, 자본, 부채, 매출액, 영업이익, 당기순이익 등 주요 재무 정보를 제공합니다.또한 회계년도, 사업년도 기준월, 재무제표 작성 여부, 화폐단위 정보 등을 함께 확인할 수 있어 프랜차이즈 기업의 재무 상태와 경영 현황 분석 또는창업 정보 확인, 프랜차이즈 기업 비교, 가맹사업 시장 조사, 데이터 기반 서비스 개발 및 공공데이터 활용 분야에 사용할 수 있습니다.
