description_portal: 울산광역시 동구에서 담배를 소매 형태로 판매할 수 있도록 지정된 소매인에 관한 현황을 수록한 공공데이터이다. 항목에는 소매인구분, 업소명, 주소, 관리기관 등 주요 정보가 포함되어 있다. 「담배사업법」 및 관련 시행령에 따라 담배 소매업 지정 기준을 충족한 업체들을 대상으로 하며, 지역 내 유통망 현황 파악, 행정관리, 정책 수립, 공정 경쟁 환경 조성 등을 위한 기초자료로 활용된다. 데이터는 정기적으로 갱신되며, 공공데이터포털을 통해 열람과 다운로드가 가능하다. 제공되는 정보는 비식별 처리 기준을 준수하여 개인정보를 보호하며, 타 유통 정보와 연계한 분석에도 적합한 구조를 갖추고 있다.
