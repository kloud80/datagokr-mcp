description_portal: 경상북도 경주시에서 제공하는 통계연보는 지역의 사회, 경제, 산업, 문화 등 여러 분야의 연간 통계자료를 수록한 종합 데이터이다. 본 데이터는 행정구역, 인구, 복지, 환경, 교육, 교통 등 총 16개 분야로 구성되어 있으며, 시정 운영과 지역 현황을 파악할 수 있도록 연도별 항목별 수치를 표 형태로 제공한다. 이를 통해 경주시의 인구 변화, 산업 구조, 복지 수준 등 다양한 지표를 분석할 수 있으며, 정책 수립 및 연구, 민간 활용 등의 목적에 유용하다. 각 통계표는 엑셀 형식으로 제공되어 활용도가 높고, 통계연보는 매년 정기적으로 발간되어 최신 정보가 반영된다. 경주시 지역 특성을 종합적으로 이해할 수 있는 기초자료로서 행정 및 학술 분야에 폭넓게 활용될 수 있다.
