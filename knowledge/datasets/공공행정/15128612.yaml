description_portal: '○ 한국특허정보원(KIPI) 홈페이지에 게시되어 있는 직원 채용 공고 데이터를 제공합니다. 데이터에는 신입, 경력, 일반직, 계약직, 개방형 직위 등 다양한 형태의 채용 정보, 합격자 발표 정보, 제출서류 안내사항들을 포함되어 있습니다. 이 데이터는 청년 일자리 확대, 공정채용 실현, 공공기관의 인사 행정 투명성 강화, 디지털 채용정보 접근성 향상 등의 사회적 가치 실현에 기여할 수 있으며, 취업 준비생 및 인사·채용 관련 데이터를 활용하는 연구자, 기업, 공공기관 등에 유용하게 활용될 수 있습니다.○ 컬럼 설명 : 게시물일련번호(게시물 등록 순서), 게시물제목(본문의 제목), 게시자명(게시물 등록자명), 게시일자(게시물 등록일자), 게시물조회수(해당게시물의 조회수)○ 기준일자 : 2026-06-09'
