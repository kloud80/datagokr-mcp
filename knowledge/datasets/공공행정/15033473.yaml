summary_user: 부산광역시 강서구 9개 동(대저1·2동, 강동동, 명지1·2동, 가락동, 녹산동, 신호동, 가덕도동) 행정복지센터의 명칭·도로명주소·전화번호·위도·경도·보유시설을 센터 한 곳당 한 행으로 담은 작은 시설 목록 파일이다. 강서구 주민이 가까운 동 행정복지센터의 위치·연락처와 그 센터에 어떤 시설이 있는지 확인하거나, 분석가가 구 단위 생활 행정시설 지도를 만들 때 쓴다. 전역 조인 키는 없어서 센터명·주소 문자열을 맞추거나 위도·경도 좌표로 무인민원발급기·공공시설 개방 같은 표준데이터와 공간적으로 겹쳐 쓴다.
