description_portal: '[SGIS 오픈 플랫폼] "SGIS에듀" 서비스의 퀴즈 정보입니다.초등·중등·고등별 "수업하기" 메뉴의 각 컨텐츠 수업마다 제공되는 퀴즈데이터이며,사지선다 방식(한 문제에 대하여 네 개의 항목 가운데 정답 또는 가장 적당한 항목을 고르게 하는 방식) 입니다.설명 및 정답을 포함합니다.[용어설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2.  통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스'
