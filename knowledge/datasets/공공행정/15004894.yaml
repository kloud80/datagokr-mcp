description_portal: 성남시의 모자보건사업 건강관리사 파견기관은 임산부 및 영유아를 위한 건강관리 서비스를 효과적으로 제공하기 위해 설계된 공공-민간 협력 구조입니다. 보건소 단독 운영에서 벗어나, 간호 인력 파견이 가능한 전문 민간기관 또는 사회복지기관과 위탁 협약을 체결하여 운영되는 방식이 주를 이룹니다.이 기관들은 산모·신생아 건강관리사들을 고용하거나 연계해 보건소 또는 행정복지센터와 협력하며 서비스를 제공합니다. 파견기관은 건강관리사에 대한 교육, 일정 조정, 파견 후 모니터링 등을 수행하며, 사업의 품질 유지와 민원 응대까지 포함한 전담 역할을 맡습니다.
