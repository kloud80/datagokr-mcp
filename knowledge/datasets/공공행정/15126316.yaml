summary_user: 공정거래위원회에 등록된 통신판매사업자의 등록·변경 내역을 사업자 건별로 담은 API로, 전국 105,585건(2002-09-09~2023-12-29)이며 법인명·신고일자·운영상태·휴폐업일·판매방식·취급품목·소재지가 들어 있다. 소비자가 거래하려는 온라인 판매업체가 통신판매업으로 신고된 곳인지, 지금 영업 중인지 확인하는 질문에 쓴다. 법인등록번호(crno)와 사업자등록번호(brno)로 기업집단·가맹사업·상조 등 공정위 다른 등록·공시 데이터와 이어 쓰고, 소재지 주소 필드로 지역 단위 조회도 한다.
description_portal: 사업자 등록번호, 상호명, 업소상태 등을 이용하여 통신판매사업자에 대한 법인명, 사업자 번호, 신고일자 등의 정보를 조회할 수 있는 서비스
team:
  dept: 정보화담당관실
