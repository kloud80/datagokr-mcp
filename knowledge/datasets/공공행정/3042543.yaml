summary_user: 전북특별자치도에 소재한 사회적기업과 예비 사회적기업을 기업 한 곳당 한 행으로 정리한 지정 현황 파일로, 사회적기업 여부 구분, 시군, 기업명, 대표자, 업종, 지정·인증일, 유형(부처형·지역형 등)을 담는다. 사회적경제 정책 담당자나 지역 분석가가 "전북 시군별로 어떤 업종의 사회적기업·예비 사회적기업이 언제 지정됐는가"를 확인하는 데 쓴다. 전역 조인 키나 코드 컬럼은 없어서, 다른 데이터와는 시군 이름이나 기업명을 문자열로 맞춰 시군구 단위로 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도에 소재한 사회적기업 및 예비 사회적기업의 지정 현황을 정리한 자료로, 기업명, 대표자, 업종, 지정일자, 기업 유형(부처형·지역형 등)을 포함하고 있습니다.  전주시, 완주군, 군산시, 익산시 등을 중심으로 고르게 분포되어 있습니다. 업종은 제조, 교육, 문화예술, 보건복지, 임업, 기타 등으로 다양하며, 사회적가치 실현을 목표로 다양한 지역사회 문제 해결에 기여하고 있습니다. 특히 "예비 사회적기업"으로 지정된 기업들이 대부분으로, 이들은 정부나 지자체의 지원을 받으며 사회적기업으로 전환하기 위한 준비단계에 있습니다. 해당 데이터는 정책 수립, 사회적경제 생태계 분석, 지역별 사회적기업 발굴, 취·창업 연계 등에 폭넓게 활용될 수 있으며, 기업 간 협업과 네트워킹 기반 마련에도 중요한 참고자료로 활용될 수 있습니다.
