description_portal: 자치법규 현황 데이터는 조례·규칙 등 지방자치단체의 입법 정보 전반을 구조화한 데이터셋으로, 법규 구분, 입법구분(제정·폐지·일부개정), 개정 번호, 소속 편·장, 법규명 등 자치법규의 체계적 정보를 포함하고 있습니다.각 법규의 공포일자, 공포번호, 제출구분(단체장/의원발의), 주관부서 등 입법 절차 관련 주요 메타데이터를 함께 제공하여 지방정부의 정책 및 규제 흐름을 이해하는 데 매우 중요한 자료입니다.해당 데이터는 법규의 변천 과정, 부서별 법규 제·개정 현황, 조례·규칙의 정책 분포 등을 분석하는 데 유용하며 행정기관, 연구기관, 시민단체 등 다양한 분야에서 활용 가치가 높습니다.
