description_portal: '○ 통계개요* 통계명 : 인구이동률(구별)* 통계종류 : 보고통계, 지정통계(승인번호 10115)* 작성목적 : 인구 이동 상황을 주기적으로 파악하여 인구정책 및 지역간 균형개발을위한 기초자료로 활용* 조사체계 : 주민등록전입신고 -> 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 자치구별 성별 인구이동률 등○ 용어설명* 전입 : 행정 읍면동 경계를 넘어 다른 지역에서 특정 지역으로 이동해 온 경우* 전출 : 행정 읍면동 경계를 넘어 특정 지역에서 다른 지역으로 이동해 간 경우* 시군구내 이동:시도내 이동 중에서 이동전후의 시군구는 같고 행정 읍면동이 다른 이동* 시군구간 이동:시도내 이동 중에서 이동전후의 시군구가 다른 이동* 이동률 : 주민등록연앙인구대비 이동자수* 전입률 : 전입자수/연앙인구*100* 전출률 : 전출자수/연앙인구*100* 순이동률 : 순이동자수/연앙인구*100(=전입률-전출률)※ 주민등록연앙인구 : [연초 주민등록인구+연말 주민등록인구]/2'
