summary_user: 충청남도 태안군 읍면별 마을회관과 경로당을 한 곳당 한 행으로 담은 시설 목록 파일로, 명칭·주소·전화번호를 담는다(포털 설명 기준 총 233개). 주민이나 복지·행정 담당자가 '우리 읍면에 있는 경로당은 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 태안군 노인 여가시설 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 코드가 없어 다른 데이터와는 주소 문자열을 지오코딩하거나 시설 명칭으로 맞춰 이어 써야 한다.
limits: 행정구역 코드나 시설 식별 코드가 없어 다른 데이터와 바로 조인되지 않고, 주소·명칭 매핑으로만 연결된다. 범위는 태안군 한 곳의 개별 시설이라 다른 시군과 비교하려면 별도 자료가 필요하다.
