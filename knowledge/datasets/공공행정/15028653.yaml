description_portal: '- 정기간행물 정보는 정기간행물 신고 이력이 있는 간행물 13건 대한 기본정보로 구성된 데이터입니다. 현재 기장군 관내에 있는 신고업종에 해당하는 신고되어 있는 시설 목록입니다. - 데이터로는 제호, 종별, 간별, 성격, 발행소 주소, 전화번호 등의 항목을 제공합니다. 나머지 개인정보에 해당하는 내용으로 판단되는 것들은 제외하였으니 참고하시기 바랍니다.- 여러가지 정보 중에서 가장 필수적인 정보만 추려놓았습니다. 정기간행물 정보에 대한 상세한 내용은 검색하여 쉽게 알아볼 수 있습니다. - 업무의 연속성을 유지하여 과거 정기간행물 신고 내역을 참조하여 변경 신고, 폐간 신고 등 후속 행정처리를 정확하게 수행할 수 있습니다.- 등록된 정기간행물 현황 통계를 통해 지역 내 언론·출판 생태계를 파악할 수 있으며, 상위 기관의 정책 수립이나 실태 조사에 필요한 기초자료로 활용됩니다.- 등록된 간행물이 신고 내용과 다르게 발행되거나 법령을 위반할 경우, 보관된 정보를 토대로 행정지도, 시정명령, 등록취소 등의 조치를 취할 수 있습니다.- 새로운 신고가 들어왔을 때 기존에 등록된 간행물과 제호가 중복되는지 확인하기 위해 기존 등록 정보를 활용하고 있습니다.'
