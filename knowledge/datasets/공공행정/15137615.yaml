description_portal: 이 데이터는 국립생태원의 임원이 집행한 업무추진비 사용 내역을 공개한 자료입니다. 연도별로 갱신되며, 사용일자, 집행자(임원명), 집행금액, 집행목적, 사용처, 대상자 범주 등 세부 항목이 포함되어 있습니다. 해당 정보는 기관의 재정 집행 내역을 투명하게 공개함으로써 공공기관에 대한 신뢰도를 높이고, 업무추진비의 적정 사용 여부를 확인할 수 있는 주요 자료로 활용됩니다. 특히 언론·시민단체·감사기관 등 외부 이해관계자들이 예산 집행 감시를 수행하거나 정책 집행의 정당성을 평가할 때 중요한 참고자료로 활용되며, 공공정보 공개 및 책임성 제고의 수단으로 기능합니다. 이 데이터는 국립생태원 행정통합시스템에서 수집·관리되며, 국민의 알권리 실현을 위한 대표적 재정 정보로 분류됩니다.
