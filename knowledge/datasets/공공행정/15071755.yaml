summary_user: 서울시 일반여행업(여행 일정·비용 산출·숙박 예약·명소 안내 등을 제공하는 업소) 인허가를 업소 한 곳당 한 행으로 담은 원장으로, 인허가일·취소일, 영업상태, 폐업·휴업 기간, 지번·도로명 주소, 사업장명, 중부원점TM 좌표 등이 들어 있다. 여행업 창업을 검토하는 사업자나 상권 분석가가 '어느 자치구에 영업 중인 일반여행업체가 몰려 있고 최근 폐업이 늘었는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 원본이 지방행정 인허가 데이터개방(LOCALDATA)과 같아 다른 업종 인허가 원장과는 관리번호(MGTNO)·주소·업소명 매칭으로 이어 쓴다.
description_portal: '해당 데이터는 서울시 일반여행업 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
