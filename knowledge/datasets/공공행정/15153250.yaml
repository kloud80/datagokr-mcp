summary_user: 한국지역난방공사의 열수요실적을 재난안전데이터 공유플랫폼을 거쳐 제공하는 데이터로, 실적일자(PRFMNC_DT)·지사·열공급시설·노드별로 기온(최고·최저·평균)과 1시부터 24시까지 시간대별 열수요량을 한 행에 담으며 범위는 전국이다. 에너지 분석가가 "기온이 떨어진 날 어느 지사·시설에서 몇 시에 열수요가 가장 많았나"를 확인하는 데 쓴다. 전역 조인 키는 없어 지사·시설·노드 ID나 노드 한글명을 이름·코드 매핑하거나, 날짜를 기준으로 기상 등 다른 시계열과 맞춰 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국지역난방공사에서 제공하는 열수요실적에 대한 관련 정보입니다.\""
