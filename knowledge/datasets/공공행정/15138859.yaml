summary_user: 시도별로 지방세 세목(재산세·자동차세·담배소비세 등)이 전체 세수에서 차지하는 구성비율을 회계연도별로 담은 집계 지표로, 범위는 전국이고 행정단위는 시도입니다. 분석가나 지방재정 담당자가 "우리 시도 세수는 어떤 세목에 기대고 있고, 다른 시도와 비교하면 어떤가"를 따질 때 쓴다. 회계연도(fyr)와 자치단체 코드·이름, 징수액, 비율 컬럼을 담지만 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 지방재정365 지표와는 자치단체 이름·코드를 맞추거나 같은 기관 코드 체계로만 이어 쓴다.
description_portal: 시도별 지방세 구성비율은 각 지방자치단체에서 부과하는 지방세의 종류별 비율을 나타내는 지표입니다. 이는 지방자치단체가 거둬들인 세수 중에서 각 지방세 항목이 차지하는 비율을 계산한 것으로, 지방세의 주요한 세목이 무엇인지를 알 수 있습니다. 예를 들어, 재산세, 자동차세, 담배세 등 각 세목의 비율을 파악함으로써 지방자치단체의 세수 구조와 의존도를 이해할 수 있습니다. 이 비율은 지방 재정의 자주 재정 여부를 평가하고, 각 지역의 세수 구조를 비교하는 데 유용한 자료로 활용할 수 있습니다.
