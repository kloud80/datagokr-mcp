description_portal: 본 데이터는 (주)한국가스기술공사의 지역사회 진로탐색 워크숍 프로그램 목록을 정리한 자료입니다. ‘퇴퇴캠프’라는 프로그램을 중심으로 오리엔테이션, 원하는 일과 삶의 모습 찾기, 직장 내 대인관계, 직무탐색 컨설팅, 이직 준비 컨설팅 등 다양한 세부 과정이 포함되어 있습니다. 각 과정은 청년층의 진로 설계와 직무 역량 강화를 목표로 하며, 성향검사와 애니어그램을 통한 자기 이해, 직무 스타일 분석, 이직 정보 제공, 대인관계 개선 등 실질적인 경력개발 지원을 제공합니다. 프로그램별 기간, 세부내용, 주관 주체 정보가 명시되어 있어, 교육 일정 수립, 참여자 맞춤형 진로지도, 지역사회 청년 지원정책 수립, 기업-지역 연계형 사회공헌 활동 설계 등에 활용될 수 있습니다.
