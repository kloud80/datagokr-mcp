description_portal: 지역 정체성 확립과 문화적 자긍심 함양에 대한 지역민들의 관심이 증대되면서, 고유한 지역 문화와 역사적 가치를 보존하고 계승하기 위한 체계적인 문화 정보 수집과 관리가 중요한 문화정책 과제로 대두되고 있습니다. 급속한 도시화와 현대화 과정에서 사라져가는 전통 문화와 민속 자료의 기록과 보존을 통한 문화유산 보호의 필요성이 증대되고 있으며, 지명유래와 역사인물, 효자·열녀, 민속·전설 등 지역 고유의 문화 콘텐츠를 활용한 스토리텔링 개발과 문화관광 자원화가 요구되고 있습니다. 지역사 교육과 향토사 연구를 통한 지역민의 문화적 소양 함양과 지역에 대한 애향심 증진이 중요해지고 있으며, 문화 다양성 시대에 지역 고유의 문화적 특성을 발굴하고 보존하기 위한 지속적인 노력이 필요합니다. 또한 차세대 문화 계승과 지역 문화의 현대적 재해석을 통한 문화 콘텐츠 개발이 요구되고 있으며, 지역 문화 정보의 체계적 데이터베이스 구축과 시민들의 문화 정보 접근성 향상을 위한 디지털 아카이브 구축의 필요성이 증대되고 있어, 충청남도 보령시는 관내 지역별 지명유래, 역사인물, 효자·열녀, 민속·전설 등 지역의 역사와 문화를 이해하고 보존하기 위한 종합적인 지역문화 정보를 제공하고 있습니다. 보다 자세한 내용은 보령시 문화관광누리집의 보령의 문화 메뉴(https://www.brcn.go.kr/prog/tour_culture/tour/sub05_03/list.do)에서 확인하실 수 있습니다.
