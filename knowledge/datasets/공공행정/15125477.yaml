summary_user: 가맹본부가 브랜드별로 가맹점사업자에게 받는 보증금 정보를 기준년도·브랜드관리번호 단위로 담은 건별 데이터로, 보증금 구분, 금액 범위, 지급 기한, 가맹점사업자 귀책사유 내용을 포함하며 범위는 전국이다. 가맹 창업을 준비하는 사람이 "이 브랜드에 가맹하려면 보증금이 얼마이고, 어떤 경우에 돌려받지 못하나"를 확인할 때 쓴다. 브랜드관리번호·가맹본부관리번호로 같은 기관의 다른 가맹정보 API와 이어 쓰지만, 실측 컬럼에는 사업자등록번호 같은 전역 조인 키가 없어 다른 기관 데이터와는 이름 매핑으로만 연결된다.
limits: 사업자등록번호·법인등록번호 등 전역 조인 키가 실측 컬럼에 없어 외부 데이터와 바로 결합하기 어렵다. 조회하려면 기준년도와 브랜드관리번호를 알아야 하고, 개발계정 호출은 하루 10,000회로 제한된다.
