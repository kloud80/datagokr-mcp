summary_user: 2023년 센서스 기준으로 전국 읍면동(행정동)별 가구수를 재정의 세대유형과 가구원수로 나눠 담은 집계 파일이다(CSV 약 14MB). 지역 분석가나 사업자가 '이 동네에 1인 가구나 특정 세대유형 가구가 얼마나 사는가'를 비교할 때 쓴다. 전역 조인 키가 없어 행정동명으로 다른 읍면동 통계나 SGIS 경계 자료와 이름을 맞춰 붙여야 한다.
description_portal: '[SGIS 오픈 플랫폼] SGIS서비스의 2023년 센서스데이터 가구 행정동 집계 정보를 담고 있습니다.행정동명, 재정의세대유형, 가구수를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼'
