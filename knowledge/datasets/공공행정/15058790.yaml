summary_user: 법령별로 법령명·법령구분(법률·시행령·시행규칙 등)·소관부처·공포일자·시행일자·제개정구분과 체계도 본문 링크를 담은 전국 단위 비공간 목록 데이터로, 법령의 상위·하위 체계를 따라가는 출발점이다. 법률 연구자나 행정 담당자가 '이 법률에 딸린 시행령·시행규칙은 무엇이고 최근 언제 개정·시행됐나'를 확인하거나, 사업 근거 법령의 변경을 감지하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않아 다른 법제처 법령 데이터와는 법령ID·법령일련번호나 법령명, 소관부처코드 같은 같은 기관 코드를 맞춰 이어 쓴다.
limits: open.law.go.kr의 별도 인증키(OC 파라미터)가 필요하며 포털 활용신청만으로는 호출되지 않는다. 기관 간 공통 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다.
