summary_user: 전국 지방자치단체가 공포·시행한 자치법규에 붙은 별표와 서식을 한 건씩 담는 목록 조회 API로, 별표명·별표종류·별표번호와 함께 관련 자치법규명, 지자체기관명, 공포일자·시행일자, 제개정 구분, 서식 파일과 상세 링크를 돌려준다. 지자체 민원 담당자나 행정 서비스 개발자가 "우리 시 조례에 붙은 신청서 서식은 무엇이고 최신 개정본 파일은 어디서 받나"를 확인하는 데 쓴다. 데이터셋 전체를 잇는 공통 조인 키는 없고, 같은 법제처 자치법규 API와는 관련자치법규일련번호나 자치법규명으로, 다른 기관 데이터와는 지자체기관명 같은 이름 매핑으로만 잇는다.
description_portal: 법제처에서 제공하는 모바일 기반 자치법규 부속 자료 조회 서비스 데이터입니다. 지방자치단체에서 공포·시행하는 자치법규에 포함된 별표 및 서식의 일련번호, 명칭, 문서유형, 부속서식 여부, 개정일자, 자치법규 코드 정보 등을 체계적으로 확인할 수 있습니다. 자치법규 코드, 별표명, 서식명, 개정일자 등의 파라미터를 통해 원하는 자료를 선택적으로 조회할 수 있도록 구성되어 있습니다. 응답 데이터에는 총 결과 수, 페이지 정보 및 개별 별표·서식의 상세 링크 정보가 포함되어 있습니다. 이를 통해 자치법규 부속 문서 현황 파악, 서식 자동 생성, 지방 행정 시스템 연동 등에 활용할 수 있습니다. 또한 모바일 애플리케이션이나 웹서비스에서 자치법규 관련 부속서식 제공 기능 구현 및 검색 기능 강화를 위한 핵심 자료로 적합합니다.
