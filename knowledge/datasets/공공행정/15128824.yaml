summary_user: 서울시설공단이 조달청 나라장터에 낸 입찰공고(일반·제한·지명경쟁 등)와 전자공개 수의계약 견적공고를 공고 한 건씩 담은 CSV 파일(약 292KB)로, 공고명·게시일자·입찰계약방법·낙찰방법·공고상태·수요기관을 담는다. 사업자가 서울시설공단이 어떤 계약방법으로 얼마나 자주 공고하는지 확인하거나, 분석가가 기간·계약방법별 공고 건수를 집계하는 데 쓴다. 전역 조인 키는 없어서 공고기관명·수요기관명 같은 기관 이름이나 공고명을 맞춰 나라장터 입찰·계약 자료와 이어 쓴다.
description_portal: '계약은 경쟁계약을 원칙으로 조달청 나라장터를 통해 공고하고 있습니다. 그 중 입찰은 일반경쟁입찰, 제한경쟁입찰, 지명경쟁입찰이 있습니다.1. 일반경쟁입찰 : 일정한 자격을 가진 희망자 모두를 대상으로 하여 경쟁입찰에 참가하도록 한 후 그 중에서 가장 유리한 조건을 제시한 자를 선정하는 방법2. 제한경쟁입찰 : 특수한 설비 또는 기술, 지역, 중소기업자 여부 등에 의하여 입찰참가자의 자격을 제한하여 입찰하게 하는 방법3. 지명경쟁입찰 : 특수설비, 기술, 자재, 물품 또는 실적이 있는 자가 아니면 계약목적달성이 곤란한 경우로서 입찰대상자가 10인 이내인 경우 등에서 경쟁입찰참가자를 지명하여 입찰하는 방법이 외에도 전자공개 수의계약 견적공고를 통해 공고한 건수도 해당 데이터에 포함하고 있습니다.서울시설공단의 입찰 공고(일반, 경쟁입찰 등 포함), 전자공개 수의계약(견적공고) 공고 건수 현황 자료입니다. 2024-12-31일 기준 자료입니다.'
