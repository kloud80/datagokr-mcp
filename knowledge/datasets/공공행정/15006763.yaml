description_portal: 서울특별시 은평구 담배소매점 현황입니다. 속성은 민원구분, 업소명, 업소지번주소, 업소도로명주소, 지정일자로 구성되어 있습니다.해당 데이터는 서울특별시 은평구 내에서 소비자에게 직접 담배를 판매할 수 있도록 지정된 소매점(편의점, 마트, 가판대 등)의 현황을 담고 있습니다 . 데이터에는 각 소매점의 상호명, 지번 및 도로명 주소, 그리고 지정일자와 같은 담배 유통 관리를 위한 핵심 정보가 포함되어 있습니다 .이 데이터는 「담배사업법」에 따라 엄격하게 관리되는 담배 판매점의 현황을 투명하게 공개함으로써, 무허가 판매를 방지하고 건전한 유통 질서를 확립하는 데 중요한 역할을 합니다. 특히, 담배소매점은 영업소 간 50m 이상의 거리 제한 규정이 적용되기 때문에, 신규 창업을 희망하는 예비 소매인은 이 데이터를 통해 지정 가능 여부를 사전에 파악할 수 있습니다 . 또한, 지자체는 이를 기반으로 청소년 보호를 위한 담배 광고 및 판매 규제 준수 여부를 감독하고 , 국민 건강 증진 정책을 시행하는 데 필수적인 기초 자료로 활용합니다
