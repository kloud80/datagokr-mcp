description_portal: 대구광역시 서구 현역 구의원에 관한 자료입니다.대구광역시 서구 현역 구의원의  소속 위원회 등이 포함된 자료 입니다.대구광역시 서구의회 구 의원에 관한 자료정비본 데이터는 대구광역시 서구의회 소속 의원들의 위원회 참여 현황을 정리한 자료이다. 위원회는 의회운영위원회, 기획행정위원회, 사회도시위원회, 예산결산특별위원회, 윤리특별위원회 등으로 구분되며, 위원회별 주요 역할은 의정활동 운영, 지역 행정 및 기획 사안 심의, 예산안 검토, 윤리 기준 심사 등이다. 데이터는 의원들이 어떤 위원회에 소속되어 활동하는지 파악할 수 있도록 구성되어 있으며, 의회 구성의 체계 이해 및 관련 정책 자료로 활용 가능하다. 지방자치 의회의 기능 분담 및 전문성 강화를 위한 기초 자료로서 행정 및 시민의 의정 정보 접근성을 높이기 위해 제공된다.
