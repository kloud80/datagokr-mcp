summary_user: 전국 지방자치단체가 운영하는 지방공기업의 부채비율을 연도별·자치단체별·기업 유형(직영기업·지방공사·공단)과 사업 회계별로 담은 집계 자료로, 부채액(lat_amt)·자산액·비율이 함께 들어 있다. 분석가나 주민이 '우리 지역 상수도·하수도·공영개발 공기업의 부채비율이 몇 년 사이 어떻게 변했나'를 확인하거나 지방공기업 재무상태를 비교할 때 쓴다. 전역 조인 키는 없으므로 광역·기초 자치단체 코드와 이름, 회계연도를 기준으로 같은 지방재정(lofin365) 계열 자료나 자치단체명으로 매핑해 이어 쓴다.
description_portal: 지방공기업 부채비율 데이터는 전국 243개 지방자치단체의 지방공기업별 부채비율 정보를 담고 있어, 지방공기업별 부채현황을 상세히 확인할 수 있는 데이터입니다.이 데이터는 공기업별 부채비율을 직영기업, 지방공사, 공단 등 유형별로 분류해 제공합니다.내용은 상수도, 하수도, 공영개발 등 사업별로 세분화되어 관리되고, 연도별 변화도 파악할 수 있습니다.자료 활용은 지방공기업의 재무상태분석, 경영성과평가 등에 쓰입니다. 또한 지방공기업 재정관리의 중요한 기초 자료로 활용됩니다.데이터의 형태는 엑셀이나 PDF형태로 내려받을 수 있습니다.해당자료는 클린아이(지방공기업 경영정보시스템)을 통해 내려받기가 가능합니다.
