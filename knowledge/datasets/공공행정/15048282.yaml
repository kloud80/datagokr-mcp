description_portal: '2026년 7월 14일 기준, 지방공기업 설립 유형, 운영구분, 기관명 등 지방공기업에 대한 관련 정보를 제공합니다.지방공기업은 경영형태에 따라 두가지로 나뉩니다.직접경영(지방직영기업)- 지방자치단체가 직접 사업수행을 위해 공기업특별회계를 설치, 일반회계와 구분하여 독립적으로 회계를 운영하는 형태로 조직·인력은 지방자치단체 소속(상수도, 하수도, 공영개발 등)간접경영(지방공사·공단)지방자치단체가 50%이상 출자한 독립법인으로 지방자치단체와 별도 독립적으로 운영되며 종사자의 신분은 민간인임또한, 지방공기업 의무적용 사업은 아래와 같습니다.대통령령이 정하는 일정규모기준이상이면 의무적으로 법을 적용  1. 상수도사업(간이상수도사업 제외) : 1일생산능력 1만톤 이상  2. 공업용수도사업 : 1일생산능력 1만톤이상  3. 궤도사업(도시철도사업 포함) : 보유차량 50량이상  4.자동차운송사업 : 보유차량 30대이상  5.지방도로사업 : 도로관리연장 50㎞이상 또는 유료터널·교량 3개소이상  6. 하수도 사업 : 1일 처리능력 1만톤 이상(하수처리장시설 구비)  7. 주택사업 : 주택관리 연면적 또는 주택건설 면적 10만㎡이상  8. 토지개발사업 : 조성면적 10만㎡이상'
