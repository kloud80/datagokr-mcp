description_portal: 질의게시판 데이터는 한국에너지공단에서 운영하는 질의게시판의 질의 및 응답 내역에 대한 자료로서, 공단의 정책, 사업 및 서비스에 대해 이용자들이 제기한 다양한 의견과 질문들을 체계적으로 수집하고 분석할 수 있도록 제공합니다. 이용자의 익명성을 보호하기 위해 개인을 구분하는 아이디는 임의의 15자리 숫자로 구성되어 있으며, 질의 문항은 총 1번부터 15번까지 구성되어 있습니다. 객관식 형태의 답변은 15번까지의 항목 중 선택하여 기록되며, 특히 15번 문항은 주관식으로 구성되어 있어 별도의 답변 열이 공란으로 표시됩니다. 본 데이터는 기관의 서비스 만족도 평가, 개선이 필요한 영역의 발굴 및 정책 수립의 기초자료로 활용되며, 이용자 의견 분석을 통한 공단 서비스 품질 향상에 기여할 수 있습니다.
