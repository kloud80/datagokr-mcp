summary_user: 경기도 시군별로 기준년도마다 총인구수, 비상시 음용수 소요량(톤), 그리고 정부지원·자치단체·공공지정·응급조치명령 시설 유형별 개소수와 공급 톤수를 담은 집계 자료다. 재난안전·물관리 담당자나 분석가가 '지진이나 단수 때 우리 시군의 비상급수시설이 인구 대비 소요량을 충분히 감당하는가'를 따질 때 쓴다. 전역 조인 키는 없어서, 다른 시군 단위 통계와는 시군명(sigun_nm)과 기준년도를 이름으로 맞춰 이어 쓴다.
description_portal: 경기도 내 비상급수시설 현황입니다. 비상급수시설이란 지진, 갈수 및 배수시설의 사고 등으로 급수가 불가능한 경우에 음용수를 급수하는 것으로 주요 항목으로는 기준년도, 시군명, 총인구수(명), 소요량(톤), 정부지원시설개소, 정부지원시설톤수, 자치단체시설개소수, 자치단체시설톤수, 공공지정시설개소수, 공공지정시설톤수, 응급조치명령시설개소수, 응급조치명령시설톤수 등이 있습니다.이를 통해 각 시군의 급수대책 시설 규모와 공급능력을 확인할 수 있습니다. 본 데이터는 재난안전관리계획 수립, 물관리 정책 수립, 비상급수계획 작성, 지역별 재난 대응 역량 평가 등 다양한 행정·정책적 목적으로 활용됩니다. 특히 급수시설 유형별로 세분화된 자료를 제공함으로써 정부·지자체의 지원 현황 및 시설 운영의 실태를 체계적으로 파악할 수 있습니다.
