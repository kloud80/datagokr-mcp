summary_user: 지방공기업 통합경영공시 항목 중 하나로, 지방공기업이 당사자인 경영·인사·재무 관련 주요 소송을 건별로 담으며 연도·지자체명·기관명·당사자지위·소송개시연월·사건개요·소송가액·진행결과를 포함한다(포털 설명상 2015년 이후 제기되고 1심 판결 이상인 사건만, 범위는 전국). 분석가나 시민이 특정 지방공기업이 어떤 소송에 얼마의 소송가액으로 얽혀 있고 결과가 어땠는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 경영공시 데이터와는 지자체명·기관명 같은 이름 매칭이나 같은 기관 코드로만 잇는다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이다. 주요 소송현황 자료에는 연도, 지자체명, 기관명, 당사자지위, 소송개시연월, 제목, 사건개요, 소송가액, 진행결과 등 지표가 포함된다. 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다. * 2015년부터 제기된 당해 기관의 경영,인사,재무 관련 소송 현황 자료이며, 1심 판결 이상의 사건 내역에 대해서만 기재
