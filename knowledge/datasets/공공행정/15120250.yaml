summary_user: 경기데이터분석포털에 접수된 분석신청을 건별로 담으며, 신청일시·분석목적·신청사유·분석 예정일과 시작·종료 예정 시간대·분석 항목으로 구성된다. 연구자나 행정 분석가가 "경기도에서 어떤 목적(상권 분석, 관광, 교통, 학술연구 등)으로 데이터 분석 수요가 몰리는가"를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 분석 항목명 같은 이름 매핑으로만 느슨하게 연결한다.
description_portal: 경기데이터분석포털에서 수집된 분석신청 정보를 제공하는 데이터입니다. 이 데이터는 분석신청일시, 분석목적내용, 신청사유내용 등으로 구성되어 있습니다. 주요 분석 목적은 관광 활성화, 사회적 거리두기 정책 효과 모니터링, 공공 빅데이터 청년 인턴십 프로젝트 수행, 유동인구 및 카드매출 기반 상권 분석, 교통 빅데이터 시스템 활용, 논문 및 연구 수행 등으로 다양합니다. 신청사유는 정책 수립 근거자료 확보, 학술연구 및 과제 수행, 치안 계획 수립, 축제 안전 대책 마련 등 구체적 활용방안을 포함하고 있습니다. 이를 통해 경기도 내 데이터 기반 행정, 민간 연구, 학술 프로젝트에 대한 수요를 확인할 수 있으며, 데이터 활용 분야와 수요 패턴을 체계적으로 분석하는 데 유용합니다.
