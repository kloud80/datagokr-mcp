summary_user: 농림축산식품부 소관 법령에 대한 질의·해석 사례를 해석 건별로 담은 목록으로, 안건명·안건번호·질의기관·해석기관·해석일자와 세부 해석문 링크가 들어 있으며 범위는 전국·비공간이다. 농업인·식품사업자나 담당 공무원이 '농지·축산 관련 규정을 농림축산식품부가 과거에 어떻게 해석했는가'를 안건명이나 해석일자로 찾아볼 때 쓴다. 전역 조인 키는 없고, 법령해석일련번호나 상세 링크로 해석문 본문을 따라가거나 질의·해석기관 코드·이름으로 같은 기관의 다른 법령해석 목록과 묶어 쓰는 정도에 그친다.
description_portal: 법제처 국가법령정보센터에서 제공하는 농림축산식품부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 농림축산식품부 소관 법령 질의 및 해석 사례를 목록 형태로 제공하며, 해석일련번호, 안건명, 해석기관명, 해석일자 등의 기본 정보가 포함됩니다. 사용자는 안건번호, 해석일자 등의 조건 검색을 통해 필요한 해석 사례를 확인할 수 있으며, 각 항목은 링크를 통해 세부 해석문으로 연결됩니다. 본 데이터는 농림축산식품부 법령해석의 체계적 관리와 일관된 법적 판단을 지원하기 위해 제공됩니다.
