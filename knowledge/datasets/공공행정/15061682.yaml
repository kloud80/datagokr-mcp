description_portal: 이 데이터는 광주광역시 서구가 보유하고 있는 일반 공유재산의 현황 정보를 담고 있으며, 해당 공유재산의 순번, 재산관리관, 소재지, 취득일자, 토지지목코드, 공시지가, 취득면적, 기준일자 등 세부 항목을 포함합니다.특히, 토지의 위치 및 관리주체, 토지의 공시지가와 면적, 취득시점, 토지지목 코드 등을 함께 제공함으로써, 행정재산 관리, 재정 계획 수립, 공공부동산 정책 수립 등에 활용될 수 있습니다.연도별 공유재산의 취득 흐름, 자산가치 변동, 면적 규모 비교 등을 통해 공공재산의 공간적·경제적 특성을 분석하는 데 유용하며, 지방자치단체의 공유재산 운용의 투명성 확보와 효율성 제고를 위한 기초자료로 활용 가능합니다.
