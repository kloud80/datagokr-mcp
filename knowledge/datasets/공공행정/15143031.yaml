description_portal: 은평구청에서 운영하는 설문조사 시스템에 등록된 질문 정보를 관리하는 데이터입니다.설문조사에 사용되는 질문 항목 정보를 관리하는 테이블 내 데이터입니다.각 설문조사별 질문 번호, 질문 제목, 질문 유형(단답형/복수형 등), 필수 응답 여부, 선택 제한 수, 질문 설명, 척도 설명 등의 정보를 포함하고 있습니다.해당 데이터는 설문 항목을 구성하거나 결과를 수집할 때 기준이 되는 기초 데이터입니다.또한 설문 문항 구성을 위한 기본 정보로 활용될 수 있습니다.설문조사 질문내역 데이터는 은평구청, 산하기관, 도서관 등 공공기관에서 실시한 각종 설문조사의 질문 항목, 조사 목적, 참여대상, 기간, 응답 방식(온라인/오프라인) 등을 포함합니다. 예를 들어, 2024년 하반기에는 민원실 이용 만족도 설문조사에서 ‘접근편의성’, ‘시설이용의 쾌적성’, ‘직원 친절 및 전문성’, ‘안내 및 신속성’ 등 총 9개 항목이 제시됐으며, 이외에도 도서관 서비스, 주차, 교통, 환경, 복지, 도시계획 등 다양한 분야에 걸친 주민 참여형 설문이 주기적으로 시행됩니다. 설문지는 오프라인(공공청사, 도서관 등 비치)과 온라인(구청 홈페이지, QR코드 접속) 채널 모두 운영되고, 시민의 의견이 행정 서비스 개선 및 정책 수립의 자료로 활용됩니다. 설문 항목 및 결과 데이터는 정기적으로 갱신되어 주민 소통·참여 정도, 정책 효과 진단, 서비스 운영 평가 등 여러 용도에 참고됩니다
