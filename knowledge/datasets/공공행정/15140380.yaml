description_portal: '국토안전관리원에서 제공하는 민간일자리 창출 실적과 관련하여 년도별 일자리 창출 수와 관리원이 운영중인 일경험 프로그램의 참여자 수가 포함된 CSV형식 파일데이터 입니다.국토안전관리원의 채용은 주로 국토안전관리원 채용 홈페이지 또는 공공기관 채용 정보 포털을 통해 이루어집니다. "민간일자리"는 일반적인 정규직, 무기계약직, 기간제 계약직, 위촉직 등의 형태로 공고되며, 상시 채용이 아니므로 현재 진행 중인 공고를 직접 확인해야 합니다. 채용 유형국토안전관리원은 다양한 형태의 인력을 채용하고 있습니다. 정규직/무기계약직: 기간의 정함이 없는 근로계약을 체결하며, 신입/경력 공채 또는 사회형평적 인재 채용 시 모집합니다.위촉직: 특정 직무나 프로젝트를 위해 일정 기간 동안 위촉되는 형태의 일자리입니다.개방형 계약직: 전문성이 요구되는 직위에 대해 일정 기간 계약직으로 채용하는 방식입니다.청년인턴: 체험형 또는 채용형 인턴 프로그램을 운영하여 청년들에게 일 경험 기회를 제공하기도 합니다'
