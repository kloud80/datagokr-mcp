description_portal: 광주광역시 자료관의 도서자료 각 테이블에 대한 정의 설명입니다. 자료관에서 보유중인 도서자료의 유형으로 구분은 원문, 오디오테이프, 비디오 테이프, 논문, 보고서, 씨디 입니다.원문은 일반도서를의미하고 오디오테이프와비디오테이프는 시청각자료로 문자로구성된일반도서의단점을 보완하여 청각및시각으로 도서의 내용을 전달하여 문자위주의 일반도서의 단점을보완합니다. 논문은 일반도서가아닌 연구용역결과서등자체연구결과물에해당합니다. 보고서도 자체내부에서 국외연수등의결과로작성된자료이며 씨디(CD)는 여러자료를 담은 전자매체입니다.
