summary_user: 공정거래위원회 가맹사업 정보를 업종 대분류·중분류별로 묶어 기준년도·회계년도마다 가맹점수와 평균 신규개업·계약종료·계약해지 수를 담은 전국 단위 집계 데이터다. 창업 예정자나 분석가가 "치킨·커피 같은 업종에서 가맹점이 해마다 얼마나 새로 열고 계약을 끝내거나 해지하는가"를 업종끼리 비교하는 데 쓴다. 전역 조인 키가 없어 사업자등록번호로 개별 가맹본부와 잇지 못하고, 다른 가맹정보 데이터와는 업종명(indutyLclasNm·indutyMlsfcNm)과 기준년도를 맞춰서만 연결한다.
description_portal: 이 API는 공정거래위원회에서 소비자에게 업종별 가맹점의 변동현황 정보를 제공하기 위해 구축된 공정거래위원회_가맹정보_업종별 가맹점 변동현황 조회 서비스 입니다. 업종별 가맹점 변동현황에 대한 기준년도를 이용하여 가맹사업기준년도, 회계년도, 업종대분류명, 업종중분류명, 가맹점수, 평균신규개업수, 평균계약종료수, 평균계약해지수 등 정보 조회 서비스를 제공합니다.
