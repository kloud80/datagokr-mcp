summary_user: 지방재정365에 공시된 지방교부세 운영 정보를 전국 자치단체 단위로 담으며, 컬럼은 회계연도(fyr), 광역·기초 자치단체명과 코드, 금액 두 항목, 사유 내용, 위반 내용으로 이루어져 있다. 분석가나 지방의원이 우리 지자체가 어느 해에 교부세와 관련해 어떤 금액을 어떤 사유로 받거나 조정받았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 자치단체 코드(laf_cd)나 자치단체명을 매핑해 같은 지방재정365 공시 데이터와만 이어 쓴다.
description_portal: (교부세현황 정보) 지방교부세법 제9조의5 및 제15조에 따른 지방교부세의 교부기준과 교부내역 등 주요 운영사항으로 지방교부세 제도 및 각 교부세 세부 교부내역 등의 항목을 제공합니다. - (지방교부세 운영상황 보고) 지방교부세법 제9조의5 및 제15조에 따라 지방교부세의 교부기준과 교부내역 등 주요 운영상황을 국회 행정안전위원회에 보고하는 내용 - (지방교부세 산정해설) 보통교부세를 중심으로 제도의 이론과 운영개요, 산정기준과 방식 등을 예시와 도표를 사용하여 설명 - (보통교부세 산정내역) 지방교부세법령에 따라 산정한 보통교부세 산정내역 등
