summary_user: 지방재정365에 공시되는 세입증대 관련 자료로, 전국 지방자치단체의 회계연도별·자치단체(광역·기초)별 세입 항목과 금액을 담는다. 지자체 재정 담당자나 분석가가 '우리 시·군·구의 세외수입 등 세입이 어떻게 늘었고 어떤 증대 사례가 있었나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 자치단체 코드·이름(laf_cd, laf_hg_nm)과 회계연도를 기준으로 같은 기관의 지방재정365 공시 데이터와 이어 쓴다.
description_portal: 지방자치단체는 조직을 유지하고 주민 서비스를 제공하는 데 필요한 재원을 조달하고 재정지출을 합니다.지방자치단체의 세입원은 지방세를 비롯해 세외수입, 지방교부세, 보조금, 조정교부금, 지방체 등이 있습니다. 세입증대 게시판에서는 사용료, 수수료, 사업수입 등 증대, 자금관리 개선, 기타 공유재산 활용 등 세외수입 증대사례를 효과성, 개선 노력도, 확산가능성, 지속성 등으로 평가하여 세입증대 우수사례를 발굴하고 그 결과를 게시 중입니다. 결과에는 사례별 상세한 내용을 포함하고 있습니다.
