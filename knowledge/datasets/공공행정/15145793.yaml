description_portal: '서울시 행정동별 어린이 보호구역 지정 현황 자료입니다.법적 근거: 「도로교통법」 제12조내용: 초등학교, 유치원, 어린이집, 특수학교 등 어린이가 자주 오가는 곳의 주변 도로를 일정 구간 지정하여, 차량 속도 제한·주정차 금지·시설물 설치 등 특별한 교통안전 대책을 시행하는 구역-주요내용 : 자치구별 행정동별 초등학교, 유치원, 어린이집, 특수학교, 학원, 외국인학교, 대안학교별 어린이 보호구역 지정 통계- 세부현황 : 어린이 보호구역 주소, 시설명 지정연도, 시설유형 등제공부서는 서울특별시 교통실 교통운영관 보행자전거과(02-2133-2430) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
