description_portal: 한국동서발전의 코로나19 시대 화상회의 이사회 시행 현황 정보는 감염병 확산에 따른 비대면 회의 방식 전환과 이사회 운영 실태를 보여주는 데이터입니다.해당 데이터는 일자, 출자회사명, 이사회명 등의 항목으로 구성되어 있으며, 코로나19 유행 기간 동안 출자회사에서 어떤 날짜에 어떤 이사회를 화상회의로 진행했는지를 기록하고 있습니다.이 정보는 비대면 경영 회의의 도입 실태를 정량적으로 파악할 수 있는 기초 자료로, 공공기관의 거버넌스 유연성, 위기 대응 역량, 디지털 전환 수준 등을 간접적으로 평가하는 데 유용합니다.학계 및 연구기관에서는 해당 데이터를 활용해 코로나19 이후 공공기관의 의사결정 방식 변화 연구, 화상회의 도입 시기 및 빈도 분석, 출자회사별 비대면 회의 활성화 수준 비교 등을 수행할 수 있습니다.또한 공기업의 디지털 전환 트렌드, 비대면 회의 기반 의사결정 체계의 효율성 분석, 거버넌스 구조 변화에 따른 이사회 운영 방식 비교 연구 등에도 활용할 수 있습니다.
