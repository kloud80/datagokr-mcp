summary_user: 인천광역시 남동구 의회에 제출된 의안을 건별로 담은 원천 파일로, 의안번호·건명·분류·제출자(발의자)와 본회의 보고일·상정일·처리일, 본회의 처리 결과를 한 행씩 기록한다(CSV 약 6KB 규모). 주민이나 지방의정 분석가가 '남동구의회에서 어떤 조례안이 누구 발의로 올라와 언제 어떻게 처리됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 의회 의안 데이터나 자치법규 자료와는 건명·의안번호 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 자료는 인천광역시 남동구 의회의 의안과 처리 결과를 상세히 기록한 데이터로 의안번호, 건명, 분류, 제출자 발의자, 본회의 보고일, 본회의 상정일, 본회의 처리일, 본회의 등의 주요 정보를 포함하고 있습니다. 이를 통해 지역 의회에서 논의되고 결정된 정책과 입법 과정을 체계적으로 파악할 수 있으며, 의정 활동의 투명성 강화와 주민 참여 증진에 기여합니다. 앞으로 이 데이터를 활용해 의회 운영의 효율성을 높이고, 시민의 의견 반영을 더욱 활성화하며, 지방자치 발전에 중요한 기반 자료로 활용될 것으로 기대됩니다. 지속적인 관리와 공개 확대가 민주적 의사소통 강화에도 도움이 될 것입니다.
