summary_user: 서울시 쓰레기종량제봉투 지정 판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·지정·폐업·휴업 일자와 영업상태, 사업장명, 지번·도로명 주소, 좌표를 포함한다. 주민이나 분석가가 '우리 자치구에서 현재 영업 중인 종량제봉투 판매처가 어디에 몇 곳 있는가'를 확인하거나, 판매처 분포와 접근성을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 개방기관코드(OGDP_INST_CD) 같은 같은 기관 코드로만 잇고, 같은 원천을 공유하는 LOCALDATA 인허가 자료와 나란히 상권·점포 이력 분석에 쓴다.
description_portal: 서울시 쓰레기종량제봉투판매업 인허가 정보는 종량제 봉투를 판매하는 지정 판매업소의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자와 영업상태(상세영업상태 포함)를 통해 각 판매업소의 행정 이력을 확인할 수 있으며, 사업장명, 전화번호, 지번·도로명 주소, 좌표, 소재지면적, 소재지 및 업소구분명을 통해 위치와 기본 특성을 파악할 수 있습니다. 또한 지정일자, 신청일자와 항목값 등을 통해 지정 과정 및 구체적 관리 정보를 확인할 수 있습니다. 이 데이터는 자치구별 종량제봉투 판매처 분포 및 접근성 분석, 주민 생활 편의 증진을 위한 판매망 관리, 폐기물 정책 및 자원순환 정책 수립 지원, 민간 지도·포털 서비스와 연계한 판매소 안내 등 다양한 행정·연구·서비스 분야에서 활용 가능한 자료입니다.
