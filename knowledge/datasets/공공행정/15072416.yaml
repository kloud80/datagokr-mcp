description_portal: 본 공공데이터는 대전광역시 중구 행정동 인구통계 현황데이터 입니다.대전광역시 중구의 행정동은 17개입니다.시도명, 시군구명, 행정동명, 인구수, 남성인구수, 여성인구수, 연령별 인구수, 데이터 기준일자 등을 제공합니다.해당 행정동별 인구통계는 매월말 기준 인구 및 세대 정보를 표기하고 있으며 다음달 초 홈페이지를 통해 게시하고 있습니다.연령별 인구수도 기재하고 있으며, 전월대비 증감을 기재하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
