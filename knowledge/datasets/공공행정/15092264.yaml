description_portal: 이북5도 연락 사무소 전화번호, 주소 정보이북5도위원회는 1945년 8월 15일 대한민국 행정구역상의 도(道)로서 아직 수복되지 아니한 황해도, 평안남도,함경북도를 포함한 이북5도와 경기도와 강원도의 미수복 시.군을 관할하는 대한민국 행정안전부 산하의 정부기관입니다. 해당 데이터는 이북5도청사가 위치한 서울 이외 지역의 이북5도 주민들의 원할한  위한 각 시도 연락 사무소의 사무실 연락처, 사무실 팩스번호, 우편번호, 주소의 정보를 제공하는 데이터 입니다.이북5도 연락사무소는 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주에 위치하고 있습니다.
