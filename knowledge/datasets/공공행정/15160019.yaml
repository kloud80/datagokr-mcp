summary_user: 부산광역시 구·군이 보유한 유휴 공유재산을 필지·재산 한 건씩 담는 원천 목록으로, 구군명·재산용도·소재지주소·토지지목·구역면적(제곱미터)·데이터기준일자를 제공하며 범위는 부산 시 단위입니다. 사업자나 지역단체가 '우리 구에 놀고 있는 공유지 중 임대·활용을 검토할 만한 대지가 어디에 얼마나 있나'를 찾거나, 분석가가 구군별 유휴재산 면적과 지목 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 소재지주소를 주소·지번 매칭으로 토지·건축 데이터와 잇거나, 구군명·기관코드(insttCode)로 같은 기관의 다른 부산시 데이터와 연결한다.
description_portal: 부산광역시 구군별 유휴 공유재산 현황을 제공하는 데이터로, 재산용도, 소재지주소, 토지지목명, 구역면적 등 유휴 공유재산과 관련된 주요 정보가 포함되어 있습니다. 이를 통해 지역 내 유휴 공유재산 현황을 파악하고 효율적인 자산 활용 방안을 마련할 수 있으며, 지역 활성화 정책 추진을 위한 기초자료로 활용할 수 있습니다. 또한, 공공자산의 효율적인 관리와 활용 방안을 모색하고, 공공서비스 확대 및 민간 활용 가능 자산 발굴, 정책 수립, 연구 및 분석 등에 활용할 수 있으며, 공유재산의 투명한 관리와 정보 공개를 지원하는 공공데이터 입니다.
