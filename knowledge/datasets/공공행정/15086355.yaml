description_portal: '2025년 6월 7일자 기준 「복권 및 복권기금법」 제2조제1호마목에 정의된 온라인복권(상품명: 로또6/45)을 구매할 수 있는 전국의 판매점 목록입니다. * 온라인복권: 복권의 최종 구매자가 직접 번호를 선택하거나 전산에 의하여 자동으로 번호를 받은 후에 추첨으로 당첨번호를 결정하는 복권으로서 복권발행시스템을 갖춘 중앙전산센터와 정보통신망으로 연결된 복권의 발매단말기를 통하여 출력된 복권 또는 복권발행시스템을 갖춘 중앙전산센터와 연결된 정보통신망을 통하여 발행 및 판매가 이루어지는 전자적 형태의 복권해당 데이터에서는 온라인 복권을 구매할 수 있는 판매점 이름(상호)과 도로명 주소, 지번 주소를 확인할 수 있습니다.서로 다른 판매점이 같은 상호명을 사용할 수 있으므로 도로명 주소 또는 지번 주소까지 같이 확인하시기 바랍니다.2025년 6월 7일 이후 신규 판매점 개설 또는 기존 판매점의 폐점이 발생할 수 있습니다.'
