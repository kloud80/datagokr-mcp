description_portal: '이 데이터는 공정거래위원회의 소비자 민원학습에 대한 데이터로, 소비자들이 공정거래위원회에 제기한 민원에 대한 정보를 담고 있는 데이터셋입니다. 이 데이터는 주로 소비자 상담 내용, 분쟁 유형, 법령 정보 등을 포함하며, 소비자 정책 및 관련 서비스 개선을 위한 학습 자료로 활용됩니다. 소비자의 민원을 상담하는 중 소비자에게 안내한 법령에대한 데이터에 대한 최근 5개년도 소비자 민원상담 데이터 중 법령정보가 포함된 데이터 입니다. 이 데이터는 법령정보를 포함하고 있습니다.보유근거 : 소비자기본법 제16조, 제28조, 제35조, 제53조부터 제55조, 제57조 및 동법 시행령 제3조'
