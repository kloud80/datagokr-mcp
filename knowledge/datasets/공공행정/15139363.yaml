summary_user: 수원시 구(시군구) 단위로 일자구분·시간대·내외국인별 유동인구를 성별과 5세 연령대(10~74세) 인구수로 나눠 담은 집계 파일이다(CSV 약 1.4MB). 상권 분석가나 창업 준비자가 '평일 저녁에 20대 여성이 가장 많이 머무는 수원시 구는 어디인가'처럼 구별·시간대별 방문 연령층을 비교할 때 쓴다. 전역 조인 키는 없어 시군구코드·시군구명으로 같은 행정단위의 인구·상권·인허가 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 경기도 수원시의 구별 유동인구 데이터로, 일자별, 시간대별, 내외국인별, 성별, 5세계급 연령별 유동인구 데이터입니다. 특정 연령대 인구가 이동하는  지역을 알 수 있으며, 연령대별 생활권역으로 지역을 이해하는데 활용할 수 있습니다. 또한 연령대별 유동인구 데이터를 참고하여 인구 이동의 생활 행동 패턴을 파악하는데에 활용 할 수 있습니다. 인구이동의 시작점과 목표점을 나타내는 데이터와 합성하여 더 많은 소비자 행동 패턴을 파악하는데 활용 할 수 있습니다. 그러므로 시민들은 편리하게 생활, 여가 공간을 선택하고, 혼잡이나 안전을 고려하며, 나아가 경제적 사회적 참여 기회를 넓힐 수 있을 것입니다.
