description_portal: 통계분류포털은 통계청에서 국제표준분류를 기준으로 작성하는 산업, 직업 ,질병·사인분류 등 한국통계분류에 대하여 소개하고 분류코드 검색등의 관련 정보를 공유하는 사이트입니다. 경제, 사회, 보건분류 등 통계분류에 대한 정보를 검색하고 상담센터를 운영하여 분류 관련 민원을 효율적으로 처리할 수 있도록 지원하며, 통계분류 제·개정 업무처리 시 의견수렴 기능을 활용합니다. 통계청 통계기준의 통합관리시스템의 질병 코딩에 대한 사례집으로 , 질병의 분류 기준에 의한 사례를 활용하는 테이블입니다. 사례의 예시로 질병의 명칭, 주요 질병에 대한 검사 결과 및 시술내역에 대한 사례로 시술내역, 코딩 적용 사유, 질병코드의 수정일자 등이 등재 되어 있습니다.
