description_portal: 본 데이터는 경기도 광주시의 연도별 통계연보 자료를 제공합니다. 광주시의 토지, 기후, 인구, 노동, 사업체, 광업, 제조업, 유통, 금융, 전기, 교육 등 다양한 분야의 통계 정보를 연도별로 집계하여 제공합니다. 각 분야별 주요 지표와 현황 데이터를 종합적으로 담고 있어 지역 현황을 체계적으로 파악할 수 있습니다. 연력 정보는 해당 연도를 표시하며, 시계열 데이터로 구성되어 지역의 변화 추이를 분석할 수 있습니다. 본 데이터는 정책 수립, 지역 경제 분석, 학술 연구, 투자 의사결정, 행정 계획 수립, 지역 비교 분석 등에 활용되며 광주시의 종합적인 현황 파악과 과학적인 의사결정을 지원합니다.
