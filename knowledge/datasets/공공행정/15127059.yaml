summary_user: 공정거래위원회에 등록된 다단계판매사업자의 회사명, 등록번호명, 대표이사명, 본사 주소·연락처, 허가·변경일자를 사업자 단위로 담은 API이며, 검증 시 전국 범위에서 1건이 수신됐다. 소비자가 "이 다단계 업체가 정식 등록된 사업자인가"를 확인하는 데 쓴다. 이어 쓸 수 있는 실측 키는 본사주소(hedofcAddr)뿐이며, 공정위 네 체인이 묶인다는 사업자등록번호·법인등록번호는 이 필드 목록에 없다.
description_portal: 이 API는 공정거래위원회에서 다단계판매사업자로부터 소비자를 보호 하기 위해 제공하는 공정거래위원회_다단계판매사업자 정보 제공 서비스 입니다. 대표자명, 상호명별, 정보공개일자별 등을 이용하여 다단계판매사업자에 대한 회사명, 다단계사업자 등록번호, 대표이사명 등의 정보를 조회할 수 있는 서비스
team:
