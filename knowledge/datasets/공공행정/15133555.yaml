description_portal: 한국노동연구원이 정기적으로 발행하는 국문 웹진(KLI Labor-Net)은 노동시장 현안, 고용통계 분석, 연구보고서 발간 정보, 행사 공지, 원고 모집 등 다양한 소식을 종합적으로 제공하는 한국노동연구원의 대표 웹진입니다. 해당 데이터는 웹진 정보를 기계 판독이 가능한 구조로 제공함으로써, 연구자, 언론인, 정책 수요자 등 다양한 이용자가 과거 이슈 흐름과 콘텐츠를 탐색·활용할 수 있도록 하기 위한 목적을 갖고 있습니다. 한국노동연구원에서 배포한 국문웹진 발행 정보에는 발행번호, 제목, 구분코드, URL, 유형 등의 정보를 포함합니다.
