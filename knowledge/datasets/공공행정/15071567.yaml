summary_user: 서울특별시 상조업(선불식으로 회원을 모집해 장례 등을 공조하는 업소) 인허가 업소를 한 행씩 담은 건별 원장으로, 인허가일·영업상태·폐업·휴업일, 주소, 중부원점TM 좌표, 자본금·예치기관·공제계약·보험·지급보증 같은 소비자피해보상 관련 항목을 포함한다. 소비자가 가입하려는 상조회사가 영업 중인지와 선수금 보전 수단(예치·공제·보험·지급보증)을 확인하거나, 분석가가 구별 상조업체 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 관리번호(MNG_NO)와 개방기관 코드로 LOCALDATA 지방행정 인허가 원천과 맞추거나, 주소·업소명 매핑으로 다른 데이터와 잇는다.
description_portal: '해당 데이터는 서울특별시 상조업 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.장례 등 상호간 공조를 목적으로 선불식 방식으로 회원을 모집하여 운영하는 전문 업소입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기를클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
