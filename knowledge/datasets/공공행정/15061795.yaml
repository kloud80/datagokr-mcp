description_portal: 한전KDN 보유한 시청각기록물 현황은 조직의 주요 활동과 정책, 사업성과 등을 영상과 음성 등 다양한 매체로 기록한 자료에 대한 정보를 체계적으로 제공하는 데이터입니다. 본 정보에는 시청각기록물의 명칭, 제작 연도 및 월, 제작 편수, 비고 등의 항목이 포함되어 있어 기록물의 내용과 규모를 종합적으로 파악할 수 있습니다. 이러한 시청각 자료는 사내 홍보, 교육, 대국민 소통, 기관 홍보 콘텐츠로의 재가공 등 다양한 용도로 활용이 가능하며, 특히 비정형 데이터 기반의 디지털 아카이빙 자료로서도 가치가 높습니다. 또한, 기관의 역사성과 정책 추진 과정을 시각적으로 남기는 자료로서, 공공기관의 투명성과 책임성을 높이고, 시민과의 신뢰 구축에 기여할 수 있는 중요한 자산입니다.
