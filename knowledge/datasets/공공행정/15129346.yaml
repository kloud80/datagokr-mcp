summary_user: 경기도 데이터분석센터의 좌석 수를 센터별로 담은 소규모 현황 자료로, 센터 구분은 남부센터(수원시 영통구)와 북부센터(고양시 일산동구) 두 곳이다. 연구자·분석가·행정기관 담당자가 '남부·북부 분석센터 중 어디에 좌석이 몇 석 있어 방문 분석을 계획할 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터 이름이나 같은 기관(경기도) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 데이터분석시스템을 통해 제공되는 경기도 데이터분석센터의 좌석 현황 정보입니다. 제공 항목에는 번호, 분석센터좌석수, 분석센터구분아이디가 있으며, 구분아이디는 남부센터(수원시 영통구 소재)와 북부센터(고양시 일산동구 소재)로 나뉩니다. 이 데이터는 두 센터의 가용 좌석 수를 관리하고, 연구자·분석가·행정기관 등이 분석센터 이용을 계획하는 데 활용할 수 있도록 구성되어 있습니다.* 분석센터 이용 안내 페이지(https://insight.gg.go.kr/analysisOperGuide.do)를 통해 상세 내용을 확인할 수 있습니다.
