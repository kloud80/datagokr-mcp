description_portal: '이 데이터는 기술보증기금의 영업점(지점) 현황 및 각 지점의 관할구역 정보를 정리한 공공데이터입니다. 해당 자료는 전국에 위치한 각 영업점이 담당하는 지역 범위를 상세히 제공하며, 지점별 업무 분장과 지역별 지원 체계 파악에 활용됩니다. 데이터는 상반기와 하반기로 구분되어 반기별로 업데이트되며, 동일 지점이라도 관할 구역이 시기에 따라 일부 조정될 수 있습니다.**‘년도’**와 **‘상하반기’**는 해당 지점 관할 정보가 유효한 시점을 나타내며, 행정적·정책적 변화에 따라 반기 단위로 갱신됩니다.**‘영업점명’**은 기술보증기금의 각 지역 지점을 의미하며, 서울·경기·부산·광주 등 주요 광역시와 도 단위 행정구역에 걸쳐 다수의 지점이 존재합니다.**‘관할구역’**은 해당 지점이 담당하는 시·군·구 단위의 행정지역을 의미하며, 일부 지점은 세부 동 단위까지 명시되어 있습니다. 예를 들어, 수원지점이나 오산지점은 화성시 내 특정 동까지 관할 범위로 포함하고 있습니다.이 데이터는 각 지역의 기업이나 관계기관이 해당 지점과의 업무 연계를 확인할 때 활용할 수 있으며, 지점별 업무 범위 중첩 여부나 지역별 접근성 검토 등에도 기초자료로 활용됩니다. 특히 관할구역에는 예외 사항도 포함되어 있어, 일부 지역은 특정 지점에서 제외하거나 구체적인 조건을 명시하는 경우도 있습니다(예: “시흥시(정왕동 제외)”)'
