description_portal: 한국국제협력단(KOICA) 전자조달시스템을 통해 통합 관리되는 수의계약의 계약명, 계약금액, 계약업체, 계약내용, 체결일자, 수의계약사유 등 주요 정보를 제공합니다. 각 계약에 대한 기본 정보와 계약 체결 현황, 사업내용을 세부적으로 제공함으로써, 국민들은 기관의 전반적인 수의계약 현황 및 세부적으로 어떤 분야에서 어떤 규모로 어떤 업체와 계약을 맺는지 파악할 수 있습니다. 더불어 기관에서는 동 데이터를 통해 행정업무와 계약업무에 대한 투명성을 높일 수 있고 이는 기관의 신뢰도를 높이는데 기여합니다.
