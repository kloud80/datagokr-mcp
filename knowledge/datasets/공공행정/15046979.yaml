description_portal: '○ 통계개요* 통계명 : 사망원인별 사망(성/연령별)* 통계종류 : 서울시 사망인구의 사망원인을 성별ㆍ연령별로 제공하는 지정ㆍ가공통계* 근거법령 :「가족관계의 등록 등에 관한 법률」제84조에 의한 사망신고와 그 기재사항* 작성목적 : 대한민국 국민의 정확한 사망원인 구조를 파악하여 국민복지 및 보건의료정책수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울시 → 통계청* 공표주기 : 정기(매년, 9월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 사망인구의 성별ㆍ연령별 사망원인○ 용어설명* 사망원인 : 사망진단서에 기록되는 사인이란 사망을 유발했거나 사망에 영향을 미친모든 질병, 병태 및 손상과 이러한 손상을 일으킨 모든 사고 또는 폭력의 상황을 말함- 내분비 영양 및 대사질환 : 내분비샘(하수체, 부신, 갑상샘, 성샘 등)과 영양관련 및대사성 질환(생명을 유지하기 위하여 영양소를 섭취하고 이를 체성분과 에너지원으로저장 및 분해하여 생체활동을 행하는 것을 대사라 하는데 이 대사 과정에 이상이 생김)을 총칭- 순환기계통의 질환 : 혈액의 순환에 관여하는 제기관(심장을 포함한 대순환ㆍ소순환계를 말함)에 질병이 생긴 경우를 총칭- 호흡기계통의 질환 : 호흡기계(가스 교환을 행하는 호흡에 관한 기관의 총칭)의 질병- 소화기계통의 질환 : 구강,인두,식도,위,소장,대장으로 이루어지는 입에서 항문까지의전 길이가 약 9m의 속이 빈 기관에 생기는 질환의 총칭'
