summary_user: 서울시 노래연습장업 사업장별 인허가 원장으로, 인허가·취소·폐업일자, 영업상태(영업·휴업·폐업 등), 노래방실·청소년실 수, 방음·조명·소방·비상구 설치 여부, 주소와 좌표를 업소 한 건 단위로 담는다. 창업 예정자나 상권 분석가가 '이 자치구에 영업 중인 노래연습장이 몇 곳이고 최근 몇 곳이 폐업했나'를 확인하거나, 행정기관이 안전시설 현황을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 주소·좌표나 사업장명으로 맞추거나 같은 출처인 LOCALDATA 인허가 자료의 관리번호(MGTNO)로 연결한다.
description_portal: '서울시에서 관리하는 노래연습장업 인허가 정보입니다. ㅇ 인허가 현황 : 노래연습장에 대한 인허가일자, 취소일자, 최초등록시점 등의 행정 처리 내역을 포함합니다.ㅇ 영업상태 정보 : 영업 중, 폐업, 휴업, 재개업 등 사업장별 운영 상태를 확인할 수 있습니다.ㅇ 시설 및 안전 정보 : 노래방실수, 청소년실수, 방음시설, 조명시설, 소방시설, 자동환기 여부, 비상구·비상계단 설치 여부 등 안전 관련 항목이 포함됩니다.ㅇ 위치 및 행정구역 정보 : 지번주소, 도로명주소, 좌표(X,Y) 등 사업장 위치 정보를 제공하며, 구별 통계 분석이 가능합니다.ㅇ 사업장 세부 정보 : 사업장명, 전화번호, 시설면적, 업태구분, 문화체육업종명, 주변환경명 등 이용자와 행정기관 모두 활용 가능한 상세 데이터를 담고 있습니다.'
