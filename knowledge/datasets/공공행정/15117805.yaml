description_portal: 이 데이터는 2026년 1월기준 광주광역시 법률 고문 현황에 관한 데이터로 법률 고문 명단 및 임기, 소속 등 위촉 현황을 제공하고 있습니다. 광주광역시 법률고문운영 조례에 따라 법률고문을 고문변호사와 고문공인노무사로 구성하고 있습니다. 고문변호사는 시의 자치법규 제정 및 개정 자문, 법령 및 자치법규의 해석, 시 또는 소속기관이 의뢰한 사안의 법적 검토, 시를 당사자로 하는 사건의 소송수행, 시 또는 소속기관의 쟁송사건 관련 자문, 그 밖에 광주광역시장이 위임하는 사항에 대한 업무를 처리합니다. 고문공인노무사는 시 또는 소속기관에 대한 노사관계의 지도·협의와 단체교섭 등에 관한 자문, 시 또는 소속기관을 당사자로 하는 노동관계 분쟁·조정 및 중재 신청사건에 관한 자문 및 대리, 그 밖에 시장이 위임하는 사항에 대한 사항을 처리합니다.
