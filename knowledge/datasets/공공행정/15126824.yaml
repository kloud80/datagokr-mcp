summary_user: 한국자산관리공사가 관리하는 국유일반재산(토지·건물)에서 실시한 개보수 공사를 공사 건별로 담으며, 공사명·시공업체명·계약일·착공일·준공일과 소재지 주소를 전국 범위로 제공한다. 특정 지역 국유재산에서 어떤 업체가 언제 어떤 공사를 했는지 확인하려는 주민·시공업체·국유재산 관리 분석가가 쓴다. 실측 컬럼에 전역 조인 키(PNU·행정코드 등)가 없어 소재지 주소(LCTN_ADR)를 주소 정제·매핑해 국유재산 목록 등 다른 데이터와 잇거나 같은 기관 데이터와 이름으로 연결해야 한다.
limits: 필지고유번호나 행정코드 같은 공통 키가 없어 다른 데이터와의 결합은 주소·이름 매칭에 의존하므로 매칭 오류에 주의해야 한다. 개발계정은 일 10,000회 호출로 제한된다.
