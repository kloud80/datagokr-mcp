summary_user: 서울시 옥외광고업체(간판·광고물 제작·설치·관리)의 인허가 이력과 영업 현황을 업소 한 곳당 한 행으로 담은 건별 원장으로, 인허가일자·폐업·휴업·재개업일자, 영업상태, 사업장명, 주소, 좌표, 영업내용(TRDCTN)을 포함한다. 상권 분석가나 구청 담당자가 '우리 구에 영업 중인 옥외광고업체는 어디에 몰려 있고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 출처인 LOCALDATA 인허가 자료와는 기관 코드(OPNSFTEAMCODE)·관리번호로, 다른 데이터와는 주소·좌표 또는 이름 매핑으로 이어 쓴다.
description_portal: 서울시 옥외광고업 인허가 정보는 간판, 옥외 광고물 등을 제작·설치·관리하는 옥외광고업체의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소·폐업·휴업·재개업일자와 영업상태를 통해 각 업체의 행정 이력을 확인할 수 있으며, 사업장명, 전화번호, 주소, 좌표, 소재지면적, 업태구분명 등을 통해 위치와 기본 정보를 파악할 수 있습니다. 또한 영업내용 항목을 통해 광고물 제작·설치, 대행, 관리 등 구체적인 영업 형태를 확인할 수 있습니다. 이 데이터는 옥외광고업체 분포 및 밀집 지역 분석, 불법·무허가 광고물 관리 지원, 도시미관 및 야간경관 정책 수립, 관련 산업 동향 분석과 민간 지도·정보 서비스 연계 등 다양한 행정·연구·산업적 활용에 유용한 자료입니다.
