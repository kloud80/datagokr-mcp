synonyms:
  - 의회
  - 부산시의회
  - 의안검색
  - 부산시의회 안건
  - 부산 조례안 처리현황
  - 지방의회 의안
  - 시의회 의결 결과
  - 부산시의회 청원
  - 조례 공포일자
  - 의안 처리 경과
summary_user: 부산시의회에 제출된 조례안·예산안·결산·동의안·청원 등 의안을 건별로 담으며, 의안번호·의안종류·제안자·제안일자와 소관위원회 회부·상정·의결일, 본회의 상정·의결일, 집행부 이송일, 공포번호·공포일자, 위원회와 본회의 처리결과를 함께 담는다. 시민·언론·지방의회 연구자가 '특정 조례안이 언제 제안돼 어느 위원회를 거쳐 가결·공포됐는가'처럼 의안 처리 경과와 결과를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 의안번호(billNo)나 의안명·공포번호 같은 이름·번호 매핑, 또는 같은 부산광역시 기관 자료끼리만 이어 쓴다.
description_portal: 부산시의회에서 진행된 모든 안건(조례안,예산안 및 결산,동의안,승인안,건의안, 결의안, 규칙안,청원, 대안, 수정안, 재의안,의견청취안, 기타)과 관련된 의안 정보 제공
team:
  dept: 빅데이터과
services:
  - op: /billfilelist
    name: 부산시의회 의안정보조회 데이터조회
    endpoint: https://apis.data.go.kr/6260000/bscouncilbill/billfilelist
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: gId
        required: false
        desc: 대수
      - name: sessionId
        required: false
        desc: 회기
      - name: billType
        required: false
        desc: 의안종류(1:조례안, 2:예산안 및 결산, 3:동의안, 4:승인안, 5:건의안, 6:결의안, 7:규칙안, 8:청원, 9:대안, 10:수정안, 11:재의안, 14:의견청취안, 15:기타)
      - name: sdate
        required: false
        desc: 시작일(YYYY-MM-DD)
      - name: edate
        required: false
        desc: 종료일(YYYY-MM-DD)
      - name: name
        required: false
        desc: 의원명
      - name: subject
        required: false
        desc: 제목
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 700
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
