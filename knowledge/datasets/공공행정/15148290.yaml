summary_user: 경기데이터드림 플랫폼에 올라온 공공데이터 하나하나를 한 행으로 담은 메타정보 목록으로, 데이터명·제공기관·분류·갱신주기·최초개방일·데이터기준일자와 시트·지도·차트·API·링크·파일 제공 여부, 서비스 URL을 담는다. 분석가나 개발자가 "경기도가 어떤 주제의 데이터를 API로 열어 두었고 언제 마지막으로 갱신했는가"를 확인하거나, 아직 개방되지 않은 데이터 수요를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 데이터와는 데이터명·기관명 매칭이나 플랫폼 내부의 기관 코드(ORG_CD)·데이터 ID로만 연결한다.
description_portal: 이 데이터는 경기데이터드림 플랫폼에서 제공하는 공공데이터 API 서비스 목록에 대한 종합 정보입니다. 각 데이터 항목은 공공데이터명, 제공기관, 갱신주기, 최초개방일, 데이터기준일자, API 사용 여부, 서비스URL 등의 메타정보로 구성되어 있으며, 경기도를 포함한 여러 기관에서 제공하는 다양한 주제의 데이터셋을 포함하고 있습니다. 데이터셋은 API, 링크, 파일, 차트, 지도 등 다양한 방식으로 제공되며, 이 데이터는 공공데이터 포털 내 다양한 서비스를 파악하거나 새로운 데이터 수요를 확인하는 데 유용하게 활용될 수 있습니다.
