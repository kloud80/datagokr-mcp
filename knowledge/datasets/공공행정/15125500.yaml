summary_user: 가맹사업 기준년도와 브랜드별로 가맹점이 영업을 시작하기까지의 절차를 단계(영업개시절차일련번호) 단위로 담으며, 각 단계의 구분·내용·소요기간·소요금액을 전국 범위로 제공한다. 창업 예정자가 "이 브랜드 가맹점을 열려면 어떤 절차를 거치고 기간과 비용은 얼마나 드나"를 확인하거나, 분석가가 브랜드 간 개점 준비 부담을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 같은 기관의 가맹정보 데이터와 브랜드관리번호·가맹본부관리번호로 맞춰 이어 쓰며, 사업자등록번호 같은 공통 키로 다른 기관 데이터와 직접 연결하지는 못한다.
limits: 전역 조인 키가 없어 가맹본부의 사업자등록번호 등으로 타 데이터와 바로 묶을 수 없고, 이름이나 공정위 내부 관리번호 매핑으로만 연결된다. 소요기간·소요금액은 텍스트 내용 필드(bsnStrtReqAmtCn 등)로 제공되므로 수치 비교 전에 정제가 필요하다. 조회 시 기준년도와 브랜드관리번호를 지정해야 하며 개발계정은 일 10,000회로 제한된다.
