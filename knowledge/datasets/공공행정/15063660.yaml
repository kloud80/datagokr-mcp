description_portal: '지형지물부호, 관리번호, 행정읍면동, 도엽번호, 관리기관, 도로구간번호, 공사번호, 등기구모형, 등주높이 등을 기준으로 경상남도 사천시 공간정보시스템 상의 가로등 데이터 현황정보를 제공합니다.데이터를 구성하는 주요 항목들은 다음과 같습니다:지형지물부호 및 관리번호: 개별 가로등 시설물을 식별하고 체계적으로 관리하기 위한 고유 식별자입니다.행정읍면동 및 도엽번호: 가로등의 정확한 위치 정보를 행정 구역 및 수치지형도상의 좌표를 기준으로 제공하여 지역별 현황 파악을 용이하게 합니다.관리기관 및 공사번호: 해당 가로등의 설치 및 유지보수를 담당하는 주체와 관련된 사업 이력 정보를 나타냅니다.도로구간번호: 가로등이 설치된 도로의 특정 구간을 지정하여 교통 및 시설물 연계 정보를 제공합니다.등기구모형 및 등주높이: 설치된 가로등 설비의 물리적 사양($H$)에 대한 정보로, 조명 효율 분석 및 교체 계획 수립에 중요한 역할을 합니다.이러한 상세 현황 정보는 사천시의 스마트 시티 구축 기반을 다지고, 시민들에게 안전하고 쾌적한 야간 환경을 제공하는 데 기여합니다.'
