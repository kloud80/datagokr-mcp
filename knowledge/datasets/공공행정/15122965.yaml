summary_user: 경기통계시스템이 관리하는 통계표마다 수록 주기(부정기·연간)와 수록 시작·종료 연도, 최종변경일을 한 행씩 담은 메타데이터로, 시도 단위의 비공간 정보다. 분석가가 "이 통계표는 매년 갱신되는가, 몇 년도부터 몇 년도까지 자료가 있는가"를 확인할 때 쓴다. 전역 조인 키는 없고, 통계표ID(sttbl_id)로 '경기통계시스템 통계표정보'의 자료명과, 주기구분으로 '경기통계시스템 기간정보'의 주기명과 같은 기관 코드끼리 연결해 쓴다.
description_portal: '이 데이터는 경기도 경기통계시스템에서 관리하는 통계표들의 수록 주기와 수록년도에 관한 정보를 포함하며, 각 통계표에 대한 조직번호, 통계표ID, 주기구분(F: 부정기, Y: 연간), 수록 시작 및 종료 연도, 최종변경일 등의 항목으로 구성됩니다. 통계표는 고유의 ID를 통해 구분되며, 수록 주기를 기준으로 데이터 제공의 정기성을 확인할 수 있습니다.※통계표ID에 해당하는 자료명은 "경기도 경기통계시스템 통계표정보"를 참고해 주시기 바랍니다.※주기구분에 해당하는 주기명은 "경기도 경기통계시스템 기간정보"를 참고해 주시기 바랍니다.'
