summary_user: 조달청 글로벌장터에 올라온 물품을 건별로 담은 파일로, 카테고리·물품분류(한글·영문)·물품식별번호·영문 물품설명·영문 업체명과 업체설명·해외조달 인증과 물품인증 목록을 담는다(약 536KB csv). 해외 바이어나 수출을 준비하는 국내 조달기업, 분석가가 '어떤 분류의 한국 조달물품이 어떤 해외 인증을 갖추고 영문으로 소개되는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 물품분류번호·물품식별번호를 나라장터 물품 목록정보 등 조달청 데이터와 코드·이름으로 맞춰 이어 쓴다.
limits: 표준 조인 키가 없어 다른 데이터와는 물품분류·식별번호나 업체명 매칭으로만 연결되며 매칭 품질은 직접 확인해야 한다. 입찰·계약 금액이나 실적은 담지 않으므로 거래 규모 분석에는 나라장터 조달 원장 데이터를 따로 써야 한다.
