summary_user: 충청북도 지역 물가를 구분별 물가지수와 전월 대비·전년 대비 변화, 분기별 지수로 담은 집계형 Open API입니다. 분석가나 행정 담당자가 '충북 물가가 지난달·작년보다 얼마나 올랐나'처럼 지역 생활비 흐름을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 이름 매핑이나 같은 기관 코드로만 연결한다.
