description_portal: 경기도 수원시_e수원뉴스는 수원시 e수원뉴스에서 제공하는 기사의 목록 데이터를 파일 형태로 제공하고 있습니다. 수원시에서 일어나는 시정소식, 행사의 보도자료 및 시민기자가 작성한 수원에서 일어나는 행사나 각종 프로그램의 체험 후기성 기사들의 목록을 제공하고 있습니다. 해당 데이터에서는 e수원뉴스의 카테고리, 보도제목, 보도부제목, 상태, 작성완료일, 보도일자, 미채택일, 데이터기준일자를 포함하고 있습니다. 카테고리를 통해 수원시에서 발행되는 기사의 카테고리 통계를 파악할 수 있고, 보도제목을 통하여 어떤 기사들이 발행되었는지 확인할 수 있습니다. 보도일자를 통해 언제 기사가 보도되었는지 확인할 수 있습니다.
