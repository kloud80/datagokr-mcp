description_portal: 본 데이터는 전라남도 목포시의 23개 행정동을 기준으로 연도별 사망 인구 수를 제공하는 자료입니다. 제공 항목은 2019년도부터 연도별로 집계된 각 동별 사망자 수로 구성되어 있으며, 주민등록 인구 기준에 따라 작성되었습니다. 해당 데이터는 지역 간 사망률 차이를 비교하거나 고령화 추이, 건강 정책 수립, 보건복지 자원 배분 등 다양한 분야의 기초 자료로 활용될 수 있습니다. 또한, 인구 변화 분석이나 지역 보건 지표 평가, 공공의료 서비스 수요 예측 등의 분석에도 유용하게 사용됩니다. 데이터는 지속적으로 갱신되며, 시민과 연구자, 행정기관이 사망 인구 관련 정보를 정확하게 파악하고 정책에 반영할 수 있도록 공공데이터 형식으로 개방됩니다.
