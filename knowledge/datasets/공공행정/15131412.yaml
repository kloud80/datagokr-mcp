description_portal: '"민원처리에 관한 법률" 등에 따라 인천광역시 중구에 설치하여 민원인이 직접 민원문서를 발급받을 수 있도록 하는 전자장비에 대한 정보입니다.민원창구를 방문하지 않고 가까운 무인민원발급기를 이용하여 여러 가지 증명(민원) 발급을 할 수 있도록 편의를 제공하며, 발급 증명서별 수수료는 감면 또는 무료로 제공함.전 구민을 대상으로 하며 신청 절차는 없으며 누구에게나 제공되는 정보입니다. 보안을 위해 모바일신분증 또는 지문확인이 필요한 경우가 있습니다.고령층의 무인발급기 이용률 저조 → 오프라인 창구 유지 필요성 제기무인발급기 해킹 위험 증가 → 공공기기의 보안 시스템 강화 추진외국인 민원인 증가 → 외국어 UI 미흡으로 인한 불편 호소'
