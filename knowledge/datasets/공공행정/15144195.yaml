summary_user: SGIS 오픈플랫폼 '고령화현황보기' 서비스의 노인복지시설 관련 수치를 기준년도·시군구·항목별로 묶은 집계 파일로, 전국을 시군구 단위로 담는다. 지자체 복지 담당자나 분석가가 '우리 시군구의 노인복지시설 인원이 연도별로 어떻게 변했고 다른 시군구와 비교하면 어떤가'를 볼 때 쓴다. 전역 조인 키(행정구역 코드)가 없어 시군구명을 행정구역 코드표에 이름으로 매핑한 뒤 SGIS 경계·인구 통계 등과 이어 쓴다.
limits: 시군구 코드가 없고 시군구명만 있어 다른 데이터와 붙이려면 이름 매핑이 필요하며, 행정구역 개편 시 이름이 달라질 수 있어 주의한다. 시군구 집계이므로 개별 시설 단위나 읍면동 이하 분석에는 쓸 수 없다.
