summary_user: 수입물가지수를 용도별로 나눠 조사년월마다 동태코드별 물가지수와 가중치를 담은 전국 단위 집계 통계 파일이다(CSV 약 575KB). 분석가가 원자재·자본재·소비재 등 용도별 수입 물가의 흐름을 설비투자 동향이나 경기 판단과 함께 살펴볼 때 쓴다. 전역 조인 키가 없으므로 다른 물가·설비투자 지표와는 조사년월을 기준으로 맞추고, 같은 기관의 동태코드 체계로만 연결한다.
description_portal: 설비투자지수 관련 데이터로 수입물가지수(용도별)[조사년월, 동태코드, 물가지수, 가중치]에 대한 정보를 제공합니다*관련참고:- 설비투자지수는 경제통계에서 기업의 설비투자 동향을 보여주는 지표입니다. 국내 기업이 기계·장비, 건물, 운송장비 등 설비에 투자한 금액을 기준으로 산출한 지수로 설비투자의 증감과 경기 동향을 파악하기 위함이며, 통상 기준연도를 100으로 설정하여 지수화합니다. 즉, 기업이 생산설비에 투자한 금액을 기준연도 대비 지수화한 통계로 기계·장비, 운송장비, 건물·구조물 등 설비투자 항목 포함되어 있습니다.
