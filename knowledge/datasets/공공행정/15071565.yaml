description_portal: 서울시 산후조리업 인허가 정보는 서울시에 인허가된 산후조리원(산후조리업소)의 인허가 현황과 시설·인력 규모를 파악할 수 있는 공공데이터입니다. 인허가일자, 인허가취소일자, 영업·휴업·폐업·재개업 등 영업상태 정보를 통해 각 조리원의 행정 이력과 현재 영업 여부를 확인할 수 있습니다. 사업장명, 전화번호, 주소(지번·도로명), 우편번호, 좌표, 소재지면적 등의 항목은 조리원의 위치와 기본 규모를 보여 줍니다. 임산부·영유아 정원수와 임산부실, 영유아실, 모유수유실, 급식시설, 세탁실, 목욕실, 화장실, 사무실 등의 면적 정보는 실제 수용능력과 생활·위생·지원 시설 수준을 파악하는 데 활용됩니다. 또 간호사, 간호조무사, 영양사, 취사부, 미화원, 기타 인원 등 인력 구성과 건물층수(지상·지하)를 함께 제공함으로써 산후조리원의 서비스 제공 역량과 안전·편의성 측면의 규모를 평가하는 데 유용한 인허가 기반 데이터입니다.
