description_portal: '양평군에서 "인명구조함"에 부여한 사물주소 현황입니다.- 관련 근거 : 도로명주소법, 시행령, 시행규칙- 사물주소 : 건물이 아닌 사물(생활 밀접시설물)에 고유한 주소를 부여- 인명구조함 : 인명을 구조하기 위해 필요한 장비를 보관하는 시설이나 장치- 부여 목적 : 공공시설물의 정확한 위치 정보를 제공하여 사고 발생 시 신속한 대응 지원- 활용 예시 1. 구조구급 상황 발생 시 해당 사물주소를 활용하여 정확한 위치정보 확인2. 시설관리자가 사물주소를 관리번호로 활용3. 내 주변 사물주소를 조회하여 활용4. 주소판에 부착된 QR코드를 활용하여 응급 상황 시 빠른 신고- 사물주소 검색 방법 : 도로명주소 안내시스템에 접속하여 사물주소 검색 체크 및 지도 보기로 위치 확인'
