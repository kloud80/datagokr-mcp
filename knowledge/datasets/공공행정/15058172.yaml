summary_user: 법제처 국가법령정보센터의 행정심판 재결례를 건별 목록으로 담으며, 사건명·사건번호·처분청·재결청·처분일자·의결일자·재결구분(인용·기각 등)과 상세 링크를 전국 범위로 제공한다. 행정처분에 불복하려는 국민이나 법률 자문가가 '비슷한 처분에 대해 행정심판에서 어떤 재결이 나왔는가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 행정심판재결례일련번호로 같은 기관의 행정심판례 본문(상세) 조회와 잇고, 다른 데이터와는 처분청·재결청 이름이나 사건명 매핑으로만 연결한다.
description_portal: 국가법령정보센터에서 제공하는 행정심판례정보를 모바일 앱 환경에서 사용할 수 있도록 하는 데이터로  다양한 행정심판 관련 판례를 모바일 환경에서 손쉽게 검색하고 열람할 수 있도록 구성되어 있습니다. 각 사례는 행정심판의 처분명, 사건번호, 심리기관, 판정결과, 결정·재결일 등의 주요 정보를 포함합니다. 이를 통해 이용자는 행정심판의 판례 경향을 분석하고 유사사례를 참고하여 법적 대응 전략을 수립할 수 있습니다. 또한, 모바일 최적화된 인터페이스를 통해 접근성을 높였으며, 법률 전문가뿐만 아니라 일반 국민도 손쉽게 활용할 수 있도록 설계하였습니다. 해당 데이터는 행정법 연구, 법률 자문, 판례 교육 등에 유용하게 활용 가능합니다. 이용자는 장소와 시간에 구애받지 않고 필요한 심판례 정보를 즉시 확인할 수 있습니다
