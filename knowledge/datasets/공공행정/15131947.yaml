description_portal: 서울특별시 서초구 관내 공공주택 하자보수보험증권 현황으로 지번동, 본번, 호, 도로명, 건물번호 본, 부번, 준공년도의  2024년 8월 정보를 제공합니다.주택법 제46조에 따라 공동주택을 건축한 건축주는 사용승인을 신청할 시, 총 공사비의 100분의 3에 해당하는 하자보수보증금을 금융기관에 예치하고, 해당 예치에 대한 증서를 관할 구청에 제출하여야 합니다. 이는 입주 후 발생할 수 있는 하자에 대비하여 보수를 원활히 진행할 수 있도록 하기 위한 제도적 장치입니다. 해당 하자보수보증금 관련 자료에는 건축물의 위치, 예치금액, 예치기관, 예치일자 등의 정보가 포함되며, 구청에서는 이를 바탕으로 사후 하자보수 이행 여부를 점검하고 관리할 수 있습니다.
