description_portal: '본 데이터는 서울특별시 노원구 관내에서 「기계설비법」 및 관련 고시·지침에 따라 기계설비 성능점검 의무(또는 점검 대상)로 관리되는 건축물의 현황을 정리한 행정자료 기반 목록입니다. 건축물의 식별을 위한 기본 정보(예: 건축물명, 주소/소재지, 관리번호 등)와 함께 점검 대상 구분, 관리에 필요한 참고 항목(예: 용도, 규모, 관리 주체 관련 정보 등)을 포함하여, 관내 점검 대상의 분포와 규모를 한눈에 파악할 수 있도록 구성하였습니다. 본 자료는 지자체의 대상 건축물 관리, 점검 안내 및 일정 수립, 민원 대응, 점검 실적 점검, 통계 산출 등 행정업무 효율화를 목적으로 제공되며, 연구·정책 수립·시설 안전 및 유지관리 분야의 공익적 분석에도 활용될 수 있습니다. 다만 데이터는 작성 시점의 기준 정보이므로 건축물의 증·개축, 용도 변경, 소유·관리 주체 변경, 법령·기준 개정 등에 따라 실제 현황과 차이가 발생할 수 있어 활용 시 최신성 확인이 필요합니다. 개인정보는 포함하지 않으며, 주소 표기 및 항목 정의는 기관 내부 관리 기준에 따를 수 있습니다.'
