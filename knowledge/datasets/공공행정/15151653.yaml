summary_user: 경기도 지역화폐 사용 매출을 기준년월·읍면동코드·카드업종 소분류(특급호텔·패스트푸드·편의점 등)별로 집계한 월별 자료로, 매출금액과 순위·비율, 전월 및 전년 동월 대비 증감값·증감률을 담는다. 소상공인 지원 정책 담당자나 상권 분석가가 '우리 동네에서 지역화폐가 어느 업종 매출에 가장 많이 쓰였고 작년보다 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 읍면동코드(emd_cd)와 업종 소분류 코드를 이름·코드 매핑하거나 같은 경기도 자료와만 연결하며, LOCALDATA 인허가 같은 상권 자료와는 행정동×월 격자로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 소분류 업종을 기준으로 지역화폐 사용에 따른 월별 매출 현황을 제공하는 자료입니다. 기준년월, 읍면동코드, 업종중분류 및 소분류 코드, 업종명, 매출금액, 매출금액 순위, 매출비율, 전월 대비 증감값 및 증감률, 전년 동월 대비 증감값 및 증감률 등의 항목으로 구성되어 있습니다. 업종 항목은 ‘특급호텔’, ‘패스트푸드’, ‘의료기기’, ‘편의점’ 등 일상 소비와 밀접한 분야로 세분화되어 있어, 지역 단위의 소비 패턴 분석, 업종별 지역화폐 수혜 정도 평가, 맞춤형 소상공인 지원 정책 수립 등에 활용할 수 있습니다. 이 데이터는 매우 상세한 업종 및 지역 단위 분석이 가능하다는 점에서 지역경제와 유통시장 분석의 기초자료로 적합합니다.
