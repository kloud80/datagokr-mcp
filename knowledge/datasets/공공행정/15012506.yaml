description_portal: '제주특별자치도 내에서 조사한 환경소음측정결과 데이터를 제공합니다.항목: 지역구분, 측정지점, 측정기간, 낮시간대 소음도, 밤시간대 소음도*2024년도 기준, 1~4분기 조사 결과*소음진동기준은 생활환경보전과 국민의 건강을 보호하기 위하여 환경정책의 목표치로서 국제표준화기구(ISO)의 권고안을 참고로 하여 설정한 것으로 사전환경성검토, 환경영향평가 등에 검토기준으로 활용되며, 소음진동기준의 달성정도를 파악하기 위하여 환경소음측정망을 설치운영함 - 출처: 국가소음정보시스템자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1206'
