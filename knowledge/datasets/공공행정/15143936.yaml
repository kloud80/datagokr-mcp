summary_user: 2024년 4월 10일 제22대 국회의원선거의 투표율을 시·도 등 지역별, 성별, 연령대별로 나눠 전체투표율과 사전투표율을 비교한 집계표로, 전국 13,935개 투표구 중 1,505개 투표구(선거인 4,480,811명, 전체의 10.1%)를 체계적 무작위 추출한 표본조사 결과다. 연구자나 정당·언론 분석가가 '20대 여성과 60대 남성의 투표율 차이는 얼마이고 사전투표 참여는 어느 연령대에서 높았나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선거 투표율 분석이나 인구 통계와는 시·도 이름과 연령대 구간을 맞춰 연결해야 한다.
limits: 선거 후 한 번 만들어지고 바뀌지 않는 이벤트성 자료라 다른 선거와의 비교는 회차별 파일을 따로 받아야 한다. 파일이 여러 표를 한 시트에 이어 붙인 형태라 첫 줄 제목 외 컬럼명이 비어 있어(Unnamed) 표 구간과 머리행을 직접 잘라 읽어야 한다. 시·도 단위 이름으로만 연결되며 공통 코드 키는 없다.
