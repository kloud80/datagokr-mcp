description_portal: 해외지재권법령 데이터는 214년 해외지식재산권(IP) 법령 중 미국 지재권 법령 데이터입니다.해당 목록에는 총 320건의 데이터로 구성되 있으며, 특허법과 상표법 두개의 대분류 체계로 정리되어 있습니다.특허법의 경우, 37장 제376조까지 포함되어 있고상표법은 12장 제1141조까지 포함되어 있습니다.해당 데이터 컬럼 구성은 국가, 구분, 조문구분, 제목, 내용으로 구성되어 있으며특히 내용 컬럼에는 해당 조문에 대한 자세한 법조문이 포함되어 있습니다.해외 지재권 법령에 대하여 분석 등에 활용 가능합니다. * 해당 자료는 2014년 기준으로 현행 미국 특허법 및 상표법 개정 사항이 다수 존재하므로    실무 사용 시 반드시 최신 법령과 교차 검증이 필요합니다.
