summary_user: 농식품공공데이터포털에 개방된 귀농귀촌 관련 데이터셋을 데이터(세부 자료) 한 건당 한 행으로 정리한 메타데이터 목록으로, 데이터셋·데이터 식별자, 이름과 설명, 담당기관·담당자, 키워드, 이용허락범위, 업데이트 주기, 제공 형태(파일·오픈API·지도 등)를 담으며 범위는 전국·비공간이다. 귀농귀촌 정책·연구를 하는 분석가가 '귀농귀촌 통계는 어떤 데이터가 있고 어떤 형태로, 어떤 조건으로 받을 수 있나'를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 없어서, 목록의 데이터셋ID·데이터명이나 공공데이터포털URL로 실제 귀농귀촌 통계 데이터셋을 찾아 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방한 귀농귀촌 데이터 목록으로, 이 목록은 귀농 및 귀촌과 관련된 여러 중요한 통계 자료들을 포함하고 있습니다. 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함 유무, 상위분류, 제3자권리, 이용허락범위, 업데이트 주기, 서비스 유형 등의 다양한 정보를 담고 있습니다. 이러한 데이터는 귀농귀촌 정책 수립, 지역 발전 전략 수립, 귀농 및 귀촌 관련 연구 등 다양한 분야에서 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형): 각 데이터셋의 고유 아이디, 데이터셋명(문자형): 데이터셋의 제목을 나타내며, 데이터셋설명(문자형): 데이터셋의 내용에 대한 보다 상세한 정보를 제공합니다. 기관명(문자형): 데이터를 제공하는 기관을 나타내는 필드입니다. 담당자명(문자형): 데이터 관련 담당자의 이름을 포함하고 있으며, 전화번호(숫자형): 담당자의 직접 연락처를 제공합니다. 키워드(문자형): 데이터 주제를 대표하는 핵심 단어들을 나열하고, 등록일(날짜형): 데이터가 등록된 날짜를 포함합니다.'
