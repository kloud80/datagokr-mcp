description_portal: 경기도 양평군의 연간 수의계약 현황입니다. 계약관서, 계약명, 계약금액, 계약일, 계약상대자의 데이터를 제공합니다.수의계약 현황은 지방자치단체나 공공기관이 경쟁입찰 없이 특정 업체와 직접 계약을 체결한 내역을 정리한 자료이다. 일반적으로 소액 공사·용역·물품 구매 등 법령이 허용하는 범위에서 예외적으로 활용되며, 계약금액, 계약상대자, 계약 목적, 계약 기간, 선정 사유 등이 포함된다. 수의계약은 절차가 간소화되어 신속한 업무 처리가 가능하다는 장점이 있지만, 특정 업체와 반복 계약이나 금액 쪼개기 등 부정행위가 발생할 위험도 있어 투명성이 중요하다. 따라서 공공기관은 수의계약 내역을 정기적으로 공개하고, 계약 사유와 기준을 명확히 기록하여 공정성과 책임성을 확보한다.
