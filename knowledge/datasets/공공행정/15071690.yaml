description_portal: 서울시 요양보호사교육기관 인허가 정보는 요양보호사 양성 교육을 실시하는 기관의 인허가 이력과 운영 현황을 담은 공공데이터입니다. 인허가일자, 취소일자, 폐업·휴업·재개업일자, 영업상태·상세영업상태를 통해 기관의 행정 이력과 현재 운영 여부를 파악할 수 있습니다. 지번·도로명주소, 우편번호, 좌표, 사업장명, 전화번호, 소재지면적은 교육기관의 위치와 기본 시설 규모를 보여 줍니다. 업태구분명은 기관의 업종 성격을 나타내며, 보유자격증명 필드는 교육기관이 보유한 관련 자격이나 인증 현황을 확인하는 데 활용됩니다. 국비지원여부는 해당 기관에서 국비 지원 교육이 가능한지 여부를 알려 주어 교육비 부담과 접근성을 분석할 수 있게 합니다. 담당직원내용은 기관 책임자 또는 담당 인력 정보를 담고, 삭제일자는 시스템에서 데이터가 실제로 삭제·말소된 시점을 기록해 이력 관리와 데이터 정합성 확인에 도움을 줍니다.
