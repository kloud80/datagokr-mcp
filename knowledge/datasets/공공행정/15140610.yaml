description_portal: 공공와이파이 서비스란 주민센터, 복지시설, 전통시장, 시내버스 등 주민들이 자주 이용하는 공공장소에서 누구나 무료로 이용 가능한 와이파이(Wi-Fi) 서비스입니다. 서울특별시 강북구 공공와이파이 서비스 위치정보는 서울시와 이동통신3사가 협력, 공동으로 구축하여 제공해 주는 누구나 사용이 가능한 무선인터넷 서비스 지역(AP)에 대한 위치 정보입니다. 데이터의 구성은 관리번호, 자치구명, 와이파이명, 도로명주소, 상세주소, 설치위치, 설치유형, 설치기관, 서비스구분, 망종류, 설치년도, 실내외구분, wifi접속환경, X좌표, Y좌표, 작업일자입니다
