summary_user: 경상남도 남해군 각 읍·면 행정복지센터를 한 행씩 담은 시설 원장 파일로, 기관명·도로명/지번 주소·연락처·건립연도·연면적·부지면적(제곱미터)·위도·경도를 개별 시설 단위로 제공한다. 주민이 가까운 읍면사무소 위치와 연락처를 찾거나, 분석가가 읍면 청사의 노후도(건립연도)와 규모를 비교해 시설 관리·재난 대응 거점 계획을 세우는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경상남도 남해군에 소재한 각 읍·면 행정복지센터의 상세 현황을 나타내는 데이터입니다. 각 읍면별로 순번과 공식 기관명칭, 도로명 및 지번 주소, 대표 연락처, 최초 건축년도 정보가 제공됩니다. 또한, 시설의 규모를 파악할 수 있는 연면적과 부지면적(제곱미터 단위), 그리고 정확한 지리적 위치를 나타내는 위도 및 경도 좌표값까지 포함하고 있습니다. 이러한 종합적인 정보는 남해군 주민들이 행정 서비스를 이용하거나 각 지역 센터의 현황을 파악하는 데 유용하며, 읍면의 시설 관리, 도시 계획, 재난 대응 위치 기반 서비스 개발 및 관련 연구를 위한 중요한 기초 자료로 활용될 수 있습니다.
