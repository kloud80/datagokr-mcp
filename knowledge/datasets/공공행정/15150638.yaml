summary_user: 산림청 산림항공본부의 산림항공 운항 기록에서 비행 건(비행정보번호·비행시간번호)과 조종사 아이디별로 기장·부기장·교관·학생 비행시간을 담는다. 주간·야간 시계비행, 계기비행(실제·모의) 등 비행 조건별 시간이 함께 들어 있다. 산림항공 운영을 분석하는 담당자가 조종사별 비행 경험이나 비행 유형 구성을 따지거나, 산불 대응 헬기 운용 실적을 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 MFIS 계열 데이터와 비행정보번호·조종사 아이디로 맞추는 방식으로만 연결할 수 있다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.-  행정안전부_MFIS_비행시간 데이터는 산림청 산림항공본부에서 제공하는 정보입니다.
