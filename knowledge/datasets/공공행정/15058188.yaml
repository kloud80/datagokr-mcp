summary_user: 지방자치단체별로 회계연도마다 자체재원으로 추진하는 자체사업 예산액, 일반회계 예산액, 그 비율인 자체사업비중을 담은 전국 단위 집계 지표입니다(포털 설명상 2008회계연도부터 제공, 자치단체별은 총계, 광역·전국 평균은 순계 기준). 분석가나 주민이 "우리 시·군·구의 재정 자율성이 광역 평균이나 비슷한 지자체에 비해 어느 수준이고 해마다 어떻게 바뀌었나"를 비교할 때 쓴다. 전역 조인 키는 없고, 회계연도와 자치단체 코드·이름(laf_cd), 상위 광역 코드·이름을 맞춰 같은 지방재정365의 재정자립도·세출 지표와 연결해 쓴다.
description_portal: 지방자치단체의 자체사업비중 지표는 각 지방자치단체별 총 세출예산 중 자치단체가 자체적으로 계획하고 집행하는 사업예산의 비율을 나타냅니다. 자체사업은 국고보조(기초의 경우 광역보조)등 외부 재원이 아닌 지방세, 세외수입 등 자체재원으로 추진되는 사업을 의미합니다. 이 지표는 자치단체의 재정 자율성과 정책 추진력 수준을 평가하는데 활용되며, 자체사업비중이 높을수록 지역 실정에 맞춘 정책추진 가능성이 높다고 볼 수 있습니다.자체사업비중 정보는 2008회계연도부터 제공됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 자체사업예산액, 일반회계예산액, 자체사업비중 항목이 제공됩니다.
