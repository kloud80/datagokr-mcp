description_portal: '강원특별자치도 강릉시의 반려동물 등록 현황을 읍·면·동 단위로 집계한 데이터입니다.행정구역별로 등록 경로(시군구·위탁·기타), 등록 매체(내장형·외장형·인식표), 등록두수와 소유자 관련 지표를 함께 제공하여 지역별 반려동물 등록 상황을 한눈에 파악할 수 있도록 구성되어 있습니다.읍면동 구분: 반려동물이 등록된 행정구역(읍·면·동) 명칭시군구 등록건수: 시·군·구청 등 지자체 직접 창구를 통해 등록된 건수위탁대행업체 등록건수: 동물병원·위탁대행업체 등을 통해 대행 등록된 건수기타 등록건수: 이동등록센터, 캠페인 등 기타 기관·업체를 통해 등록된 건수내장형: 마이크로칩 등 내장형 무선인식장치 방식으로 등록된 두수외장형: RFID 목걸이 등 체외 부착형 장치를 이용해 등록된 두수인식표: 목걸이·태그 형태 인식표로 등록된 반려동물 두수등록품종수: 해당 읍·면·동에서 등록이 완료된 반려동물 품종의 수동물소유자수: 등록된 반려동물을 보유한 소유자(보호자)의 인원 수1인당 등록두수: 동물소유자 1인당 평균 등록 마리 수(총 등록두수 ÷ 동물소유자수)총 등록두수: 해당 지역에서 등록을 완료한 모든 반려동물의 합계 두수관리기관명: 반려동물 등록 업무와 데이터를 관리하는 담당 기관 명칭전화번호: 관리기관 또는 담당 부서의 연락처데이터기준일자: 통계가 산출·갱신된 기준 일자(연·월·일 형식)이 데이터는 읍·면·동별 반려동물 등록 참여 수준, 등록 경로와 방식의 분포, 소유자 구조 등을 종합적으로 분석하는 데 활용할 수 있으며,등록률이 낮은 지역에 대한 집중 홍보·교육 계획 수립, 내장형 등록 확대 정책, 반려동물 관련 생활 인프라(산책로·공원·편의시설) 수요 추정,유기·유실 동물 예방 및 관리 대책 마련 등 반려동물 정책 전반을 설계하는 기초 자료로 사용할 수 있습니다.'
