description_portal: '이 데이터는 울산광역시도시공사에서 설치·관리하고 있는 개방형 공중화장실의 현황 및 시설정보를 체계적으로 관리하기 위한 데이터셋입니다.울산시 관할 구역 내 공공장소, 공원, 주차장, 버스터미널, 산업단지 등 다중이용시설 주변에 조성된 공중화장실의 위치, 구조, 편의시설, 안전설비 정보를 종합적으로 포함하고 있습니다.핵심 항목인 화장실명(FCLTS_NM), 소재지도로명주소(ROAD_NM_ADDR), **소재지지번주소(LOTNO_ADDR)**는 이용자가 위치 기반으로 해당 화장실을 식별할 수 있도록 하며,구분(FCLTS_DIV) 항목을 통해 화장실의 유형(예: 공원형, 관광지형, 공공기관형 등)을 분류할 수 있습니다.'
