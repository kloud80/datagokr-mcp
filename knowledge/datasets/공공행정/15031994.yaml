summary_user: 법제처가 제공하는 자치법규와 상위 법령 간 연계 정보를 조회하는 외부 API로, 전국 지자체의 자치법규를 대상으로 하며 자치법규ID·자치법규명·시행일자·공포일자·제개정구분 같은 항목을 담는다. 지방 입법이 상위 법령과 맞는지 검토하거나 개정을 추적하려는 분석가·법제 연구자가 "이 조례는 어떤 법령 조문과 연결되는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 자치법규ID·자치법규일련번호나 자치법규명으로 같은 법제처 자치법규 데이터와 이름·코드 매핑을 거쳐 이어 쓴다.
description_portal: '법제처가 제공하는 자치법규 연계 정보 데이터는 지방자치단체의 자치법규와 해당 법령 간 연결 관계를 체계적으로 제공합니다. 해당 데이터는 지자체명, 자치법규ID, 자치법규명, 법령ID, 법령명, 연계조문번호, 연계유형(예: 대응, 참조), 연계일자, 연계 대상 조문 개수 및 연계 상태 등 주요 속성을 포함합니다. 사용자는 지자체명, 자치법규명, 법령명, 연계유형, 페이지 및 표시건수 옵션을 통해 특정 법규 간 연계 정보를 맞춤형으로 조회할 수 있습니다. 자치법규와 상위 법령의 조문 매핑, 연계 분석 및 개정 추적에 적합하며 자치법규 조문과 법령 조문 간의 매핑 관계를 일목요연하게 확인할 수 있어 지방 입법의 법적 정합성 검토, 법제 연구 및 정책지원 업무에 유용합니다.'
