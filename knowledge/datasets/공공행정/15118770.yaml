summary_user: 경상남도 진주시에서 허가된 신축 건축물을 건별로 담은 원천 파일로, 대지위치·연면적·허가일·지상/지하 최대층수·주용도·부속용도·시공자사무소명을 필지·건물 단위로 담는다(포털 설명상 2015년 1월 1일~2023년 8월 15일 허가분). 도시계획 담당자나 상권 분석가가 '진주시 어느 지역에서 어떤 용도의 건물이 얼마나 크게 새로 지어졌나'를 연도별로 따져보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치 주소 문자열을 매칭하거나 같은 기관 자료끼리 이어 써야 하며, 상권 분석에서는 LOCALDATA 인허가 자료와 같은 원천 계열로 함께 본다.
description_portal: 신축건축물 인허가정보 자료는 경상남도 진주시 내에서 이루어진 건축허가 현황을 정리한 공공데이터로, 2015년 1월 1일부터 2023년 8월 15일까지의 인허가 정보를 포함하고 있습니다. 건축 인허가 대상 대지의 위치, 건축물의 연면적(㎡), 허가일 등 주요 정보를 제공하여 지역 내 신축 건축물의 규모와 허가 흐름을 파악할 수 있습니다. 본 자료는 건축행정 업무 지원은 물론, 도시개발 계획 수립, 건축물 증가 추세 분석, 지역 내 공간구조 변화 연구 등 다양한 분야에서 활용 가능한 기초자료로 활용될 수 있습니다.
