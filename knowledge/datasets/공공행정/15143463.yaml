description_portal: 본 데이터는 부산광역시 사상구 관내에 설치된 벽보게시대의 현황을 수록한 것으로 연번, 설치동, 설치위치, 게시대 상태, 설치연도, 데이터 기준일에 대한 정보를 포함하고 있습니다. 사상구 내 벽보게시대는 주민들의 다양한 홍보를 위해 운영되고 있는 생활 밀착형 공공시설로 업체홍보, 공연 홍보 등 다양한 목적으로 사용되고 있으며, 아파트 단지, 학교, 지하철역 등 다양한 공간에 설치되어 운영되고 있습니다. 해당 자료를 통해 벽보게시대의 위치를 확인할 수 있으며, 시설별로 설치 유형, 크기, 접근성, 주변 환경 등이 상이하기 때문에 정보 접근성 및 가시성 확보에 중점을 두고 배치되었습니다. 이를 통해 각 지역 여건에 맞는 맞춤형 게시문화 조성 현황을 직관적으로 확인할 수 있습니다. 또한, 해당 자료를 통해 주민 밀착형 생활 인프라로서의 역할을 진단하고, 향후 공공 커뮤니케이션 기반 강화 및 수요자 중심의 정보 전달 정책 수립에 참고자료로 활용될 수 있으며, 나아가 수요자 중심의 게시문화 조성 및 효율적인 커뮤니케이션 체계 구축을 위한 참고자료로 제공됩니다.
