summary_user: 원격탐사응용시스템에서 업무변경 이후 판독한 경지(논·밭·과수 등) 결과를 2015년 이후 취합한 건별 자료로, 경지·필지 단위로 확인면적, 당초·재확인 지목, 면적 증감 사유, 결과 연도를 전국 읍면동 범위로 담는다. 농업 분석가나 통계 담당자가 특정 읍면동이나 필지의 경지 면적이 연도별로 어떻게 바뀌었고 지목이 무엇으로 재확인됐는지를 확인할 때 쓴다. 고유지번(pnu)으로 토지·지적 정보와 필지 단위로 잇고, 경지 코드(rs_farmland_cd)로 같은 경지의 연도별 판독 결과를 이으며, 행정동·법정동 코드로 읍면동 단위 통계와 묶는다.
description_portal: '원격탐사응용시스템에서 관리하는 업무변경후의 경지 판독결과 2015년 이후 취합자료입니다.경지_코드, 조사구_아이디, 행정동_코드, 법정동_코드, 확인면적, 층, 층번호, 재확인지목_코드, 조사구분류 ,대표지번, 고유지번, 축소조사구, 비고에_해당하는_메모 , 통계청재부여_조사구_아이디, 재부여한_행정동코드_7자리, 당초지목_코드, 당초면적 , 증감사유_코드, 결과_년도 정보를 제공합니다.*참고- 원격탐사: 대상 지역이나 물체에 직접 접촉하지 않고, 위성·항공기·드론 등에 장착된 센서로 전자기파(가시광선, 적외선, 마이크로파 등)를 측정하여 정보를 수집·분석하는 기술-원격탐사응용시스템:  통계청이 위성영상 등 원격탐사 자료를 활용하여 농업·산림 등 경지 면적을 조사·분석하는 시스템으로 농업면적조사(특히 논·밭·과수 등 경지 구분)에 원격탐사 기법을 적용하기 위해 2000년대 후반부터 원격탐사 응용시스템을 구축하였습니다.'
