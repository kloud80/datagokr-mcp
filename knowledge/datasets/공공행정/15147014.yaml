description_portal: 한국우편사업진흥원 우편고객센터 인증 내역 공공데이터는 고객센터가 받은 각종 인증과 수상 실적을 종합적으로 제공하는 자료입니다. 대한민국 KS명가 선정, 세계 표준의 날 국무총리 표창, 한국국가표준(KS) 서비스 인증, 콜센터 서비스 품질지수(KS-CQI) 우수콜센터 인증 등 고객 서비스 품질과 관련된 다양한 평가 결과가 포함되어 있습니다. 이를 통해 국민은 공공기관 고객센터의 서비스 품질 수준을 객관적으로 확인할 수 있으며, 기관의 고객만족 경영 성과와 서비스 혁신 노력을 살펴보는 데에도 활용할 수 있습니다.
