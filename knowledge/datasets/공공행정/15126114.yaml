summary_user: 국회에 접수된 청원을 건별로 담으며, 대수(ERACO)·청원번호·청원명·청원인·소개의원·국민동의 수·접수일과 소관위원회의 회부·상정·처리 일자와 처리결과를 함께 기록한 전국 단위 비공간 데이터다. 시민이나 분석가가 '이번 대수에 국민동의 청원이 소관위원회에서 언제 상정되고 어떻게 처리됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 의안·위원회·의원 정보와는 소관위원회명·소개의원명 같은 이름 매핑이나 같은 기관(국회) 코드로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
