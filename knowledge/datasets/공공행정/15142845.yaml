summary_user: SGIS 통계주제도 서비스의 '상권별 부동산 데이터' 주제에서 쓰는 분류 정보를 담은 CSV 파일(약 1MB)로, 주기명·상권명·건물유형·통계항목을 행 단위로 정리한 전국 범위의 비공간 목록이다. 분석가나 상권 조사자가 "어떤 상권에서 어떤 건물유형과 통계항목으로 부동산 지표가 제공되는가"를 확인하고 통계주제도 지표를 고를 때 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 상권명 같은 이름 매핑이나 같은 기관(SGIS) 자료의 코드로만 잇는다.
limits: 행정구역 코드나 좌표가 없는 비공간 자료라 지도 경계나 다른 행정 통계에 바로 붙일 수 없다. 상권명 문자열 매칭에 의존하므로 표기 차이를 확인해야 하고, 실제 거래·임대 동향 수치는 부동산원 자료(주택 부문)를 따로 봐야 한다.
