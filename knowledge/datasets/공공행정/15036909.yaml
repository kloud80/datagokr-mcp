description_portal: 본 데이터는 경기도 광주시에 설치된 현수막 게시대의 위치 정보를 제공합니다. 각종 행사, 캠페인, 공공 안내를 위한 현수막을 합법적으로 게시할 수 있는 지정된 게시대의 정보를 담고 있습니다. 관리번호는 각 게시대를 식별하며, 읍면동은 게시대가 위치한 행정구역을 나타냅니다. 관리기관은 게시대 관할 주체를 표시하고, 게시대 용도는 사용 목적을 나타냅니다. 위치와 주소는 게시대의 설치 장소를 상세히 제공하며, 단수는 게시대의 규모나 게시 가능 면수를 나타냅니다. 경도와 위도는 정확한 지리 좌표를 제공합니다. 본 데이터는 옥외광고물 관리, 도시 미관 개선, 현수막 게시 안내, 불법 게시 단속, 홍보 시설 배치 계획 등에 활용됩니다.
