summary_user: 군산시에 설치된 무인민원발급기를 기기(설치 장소) 단위로 한 줄씩 담은 원장으로, 설치장소·설치위치·도로명 소재지·운영시간·등기부등본과 가족관계 서류 발급 여부·관리기관·전화번호·위도·경도를 포함한다. 군산 시민이 "집 근처에서 주말이나 저녁에 등기부등본을 뗄 수 있는 무인발급기가 어디 있나"를 찾거나, 분석가가 발급기 배치의 공백 지역을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도나 도로명 소재지로 공간·주소를 맞춰 잇고, 다른 시군의 무인민원발급정보와는 같은 항목 이름을 맞춰 합친다.
limits: 실측 컬럼에 표준 기관코드나 시설 ID 같은 전역 조인 키가 없어 다른 데이터와 붙일 때는 이름·주소·좌표 매칭에 의존해야 한다. 범위는 군산시 한 곳의 개별 설치 지점뿐이라 다른 지역이나 전국 현황은 이 파일만으로 볼 수 없다.
