description_portal: 서울시 공공도서관(설립주체별) 통계는 서울시 내 공공도서관의 설립 주체별 및 구별 운영 현황을 나타내는 중요한 통계자료입니다. 이 데이터는 서울시 통계정보시스템에서 제공되며, 서울특별시와 자치구, 기타 기관(학교 도서관, 민간 도서관 등)별로 구분되어 있습니다. 주요 통계 항목으로는 도서관 수, 자료 보유 현황, 이용자 수, 시설 규모 및 직원 수 등이 포함됩니다. 또한, 연간 대출 건수, 도서관 프로그램, 예산 사용 현황 등 심화된 보고 통계도 제공됩니다. 해당 통계는 국가도서관통계시스템(https://www.libsta.go.kr)에서 수집된 자료를 기반으로 하며, 서울시의 도서관 운영 및 정책을 분석하는 데 중요한 역할을 합니다. 이를 통해 시민들의 도서관 이용 패턴을 파악하고, 도서관 서비스 개선에 필요한 데이터를 제공합니다.
