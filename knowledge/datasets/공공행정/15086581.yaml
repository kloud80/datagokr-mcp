summary_user: 국가승인통계 1건당 한 행으로 승인번호·통계명·승인일자·작성기관·계속여부·작성주기·공표예정일을 담은 전국 단위 현황 목록이며, 포털 설명 기준 2025년 8월 25일 현재 1,363개 통계를 수록한 CSV 파일이다. 분석가나 공무원이 '어느 기관이 어떤 주기로 몇 개의 승인통계를 작성하고 언제 공표하는가'를 확인하거나 기관별 통계 작성 수를 셀 때 쓴다. 승인번호(stat_approval_no)로 개별 통계 자료와, 기관코드(kosis_org_cd)로 KOSIS 기관 정보 및 다른 기관 단위 자료와 이어 쓴다.
description_portal: 2025년 8월 25일 현재 전체 국가승인통계(1,363개) 현황 자료. 통계별 승인번호, 승인일자, 작성기관명, 작성주기(월, 분기, 년, 부정기 등), 공표예정일 등을 수록. 기관코드나 기관명으로 구분하면 기관별 통계작성 수도 파악 가능. 신규통계작성이나 기존통계 작성 중지, 승인취소 등으로 국가승인통계 현황은 계속 변경이 가능하므로 정확한 자료는 통계정책관리시스템의 승인통계 현황에서 검색 가능하고, 작성기관별, 작성주기별, 통계부문별(지정/일반통계, 조사/보고/가공통계), 기관구분별(중앙행정기관, 지방자치단체, 금융기관, 공사/공단, 연구기관, 협회/조합, 기타기관)로 파악할 수 있음
