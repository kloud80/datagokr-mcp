summary_user: 대전광역시 서구의 상권별·행정동별로 기준 연월마다 성별·시간대별 유동인구 비율(백분율)을 담은 집계 CSV로, 범위는 서구 한 개 시군구이고 행정단위는 읍면동이다. 상가 창업자나 상권 분석가가 '서구의 어느 상권에 어느 시간대, 어느 성별 유동인구가 몰리는가'를 따져 영업시간이나 입지를 정할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동 코드·명이나 상권명을 이름·코드 매핑해 붙여야 하며 같은 기관의 상권 자료나 지방행정 인허가(LOCALDATA) 같은 점포 원장과 행정동·월 단위로 맞춰 쓴다.
description_portal: 이 CSV 데이터는 대전광역시 서구의 상권별 시간대별 유동인구 현황을 수집한 시공간 기반 인구통계 자료로, 지역 상권의 활동 패턴을 정량적으로 분석할 수 있도록 구성된 데이터입니다. ‘순번’은 데이터의 고유 식별번호를 의미하며, ‘기준년’과 ‘기준월’은 해당 통계가 수집된 시점을 나타냅니다. ‘상권코드’와 ‘상권명’은 행정구역 내 특정 상업권역을 식별하기 위한 기본 단위로, 상권별 인구 흐름을 구분하는 핵심 요소입니다. ‘행정동코드’와 ‘행정동명’은 해당 상권이 속한 행정구역을 구체적으로 표시합니다.‘성별코드’와 ‘성별’은 남녀별 유동인구의 비중을 구분하고, ‘시간대코드’와 ‘시간대’는 하루를 일정 구간으로 나누어 시간대별 인구 이동률을 보여줍니다. ‘비율’은 특정 조건(상권, 시간대, 성별 등)에 해당하는 인구가 전체 유동인구에서 차지하는 비중을 백분율로 나타내며, ‘데이터생성일자’는 자료의 최신 갱신 시점을 의미합니다.이 데이터는 상권별 소비활동 패턴 분석, 상업시설 운영시간 조정, 유동인구 기반 상권 활성화 전략 수립, 도시 내 경제활동 중심지 식별 등에 활용할 수 있는 고해상도 행정데이터입니다.
