description_portal: "서울특별시 광진구_빈집현황 데이터는 광진구 관내에 존재하는 빈집의 위치 및 기본 특성을 제공하는 행정 데이터입니다. 이 데이터는 “주소”, “지목명”, “유형”, “면적”, “용도”, “정비구역 여부”, “데이터기준일” 필드로 구성되어 있습니다. ‘주소’는 빈집의 위치 정보를 나타내며, ‘지목명’은 해당 부동산의 지목을 표시합니다. '현황용도'는 빈집의 분류(예: 단독주택, 다세대주택 등)를 구분하고, ‘면적’은 해당 건축물의 규모를 제공합니다. '용도지역'은 해당 빈집의 용도에 관한 내용이며(예: 준거주지역, 제2종일반주거지역 등) ‘정비구역 여부’는 해당 빈집이 도시 정비구역에 포함되는지 여부를 명시합니다. 또한 ‘데이터기준일’은 정보의 최신화 기준일을 표시합니다. 이 데이터는 도시 재생 사업, 주거환경 개선, 빈집 관리 정책 수립 및 지역 개발 계획의 기초 자료로 활용될 수 있습니다."
