description_portal: '[SGIS 오픈 플랫폼] "업종통계지도" 서비스의 생활업종 시군구 업체 대비 거주인구수 순위 데이터입니다.시도명,시군구명,테마명,업체대비거주인구_순위를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 업종통계지도- 생활업종통계지도: 음식점(11종), 소매업(17종), 생활서비스(13종), 숙박업(4종), 여가생활(6종), 교육(11종), 의료(5종), 공공(4종) 등 국민생활과 밀접한 주요 생활업종에 대한 다양한 통계정보를 조회할 수 있는 서비스- 기술업종통계지도: SGIS+의 활용 사례로, 다양한 기술업종에 관련된 지역별 통계정보를 조회하여 보실 수 있으며, 기술업종 지원시설 및 산업단지에 관련된 정보를 보실 수 있는 서비스'
