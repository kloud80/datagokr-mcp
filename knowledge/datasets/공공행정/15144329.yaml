summary_user: 전국 시군구별로 생활업종 테마(음식점·소매업·생활서비스 등)마다 업체 1곳당 거주인구 수의 순위를 담은 집계 파일로, 시도명·시군구명·테마명·순위 네 항목으로 이루어진다. 창업을 준비하는 사업자나 상권 분석가가 '우리 시군구는 특정 업종의 업체 수에 비해 주민이 많은 편인가'를 비교해 입지 후보를 고르는 데 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 시군구 통계나 경계 자료와는 시도명·시군구명을 이름으로 맞춰 이어 써야 한다.
limits: 행정구역 코드가 없어 다른 데이터와 붙일 때 시군구 이름 표기 차이나 행정구역 개편으로 매칭이 어긋날 수 있다. 시군구 단위의 순위만 담고 있어 업체 수·인구 수 같은 원래 값이나 읍면동 이하 세부 지역은 이 파일로 알 수 없다.
