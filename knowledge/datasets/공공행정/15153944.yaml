description_portal: 이 데이터는 기관에서 운영하는 직원 교육훈련 현황을 ERP 시스템을 통해 집계한 자료입니다.교육명, 과정유형(직무·소양·정보보안 등), 교육대상, 수료일자, 수료인원, 교육시간, 교육기관 등의 항목으로 구성되어 있습니다.국민은 이를 통해 공공기관의 직원 역량 개발 노력을 이해하고, 지속적인 학습문화 조성 현황을 확인할 수 있습니다.정책 담당자와 연구자는 교육과정 운영 데이터를 활용하여 공공인재 양성정책, 직무역량 향상 효과, 교육 투자 효율성 등을 평가할 수 있습니다.기관 내부에서는 직원 역량진단, 연간 교육계획 수립, 교육비 예산 관리 등 인사개발(HRD) 전략 수립에 활용할 수 있습니다.
