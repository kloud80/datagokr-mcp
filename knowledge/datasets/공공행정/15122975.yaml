summary_user: 경기도 경기통계시스템의 통계표를 이루는 차원(시간·지역·항목 등)을 차원 하나당 한 행으로 담은 메타데이터로, 표항목 식별번호·조직번호·통계표ID·최종변경일로 구성되며 통계 수치 자체는 없다. 경기통계 수치를 자동으로 받아 분석하려는 분석가가 "이 통계표는 어떤 차원으로 짜여 있고 각 차원 식별번호는 무엇인가"를 확인할 때 쓴다. 전역 조인 키는 없고, 통계표ID(sttbl_id)로 같은 기관의 '경기도 경기통계시스템 통계표정보'와 맞춰 표 이름을 붙이는 식으로만 연결한다.
description_portal: '이 데이터는 경기도 경기통계시스템의 통계표를 구성하는 차원 정보를 담고 있으며, 표항목인식번호, 조직번호, 통계표ID, 최종변경일 등으로 구성되어 있습니다. 각 표항목인식번호는 특정 통계표 내 개별 차원(예: 시간, 지역, 항목 등)의 고유 식별자 역할을 하며, 통계표ID는 해당 차원이 속한 통계표를 식별하는 데 사용됩니다. 이 데이터는 통계표 구조 정의, 항목 간 연계성 분석, 다차원 통계분석 설계, 통계포털 통계항목 검색 시스템 등에 활용될 수 있으며, 특히 차원별 통계 수치 연결을 위한 메타데이터 기반 분석에 유용하게 사용됩니다.※통계표ID에 해당하는 자료명은 "경기도 경기통계시스템 통계표정보"를 참고해 주시기 바랍니다.'
