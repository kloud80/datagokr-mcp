summary_user: 법제처 국가법령정보센터가 법령조문의 입법목적·주체·객체·법률효과를 나타내는 용어로 선정한 법령용어를 용어 한 건씩, 비고 내용과 등록일시와 함께 담은 전국 단위 파일(CSV)입니다. 법률 문서를 쓰거나 법령을 읽는 실무자·연구자가 '이 낱말이 법령에서 정식 용어로 쓰이는가, 언제 등록됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 법령 데이터와는 용어 이름을 문자열로 맞춰 잇는 방식으로만 연결한다.
description_portal: 해당 법령조문의 입법목적(법령 제/개정사유 참조), 주체, 객체, 법률효과를 상징하는 용어를 법령용어 선정하여 제공하는 데이터입니다. 법령에 사용되는 주요 용어들의 정의와 해석 기준을 명확히 하여 법령 해석의 통일성과 정확성을 도모합니다. 법률용어는 각 법령의 적용 범위와 맥락에 따라 상세히 분류되며, 행정 및 법률 실무에서 일관된 의미 전달을 지원합니다. 또한 용어별 설명과 관련 법령 정보를 포함하여 법률 문서 작성 및 해석에 필요한 기초 자료로 활용됩니다. 이 자료는 법제 및 행정 분야에서 법령의 명확한 이해와 효율적 적용을 위한 중요한 기준 자료입니다.
