summary_user: 증권선물위원회 의결 결과를 결정문 한 건씩 목록으로 담으며, 건마다 안건명, 의결번호, 기관명, 결정문 일련번호, 상세 링크가 들어 있고 범위는 전국이다. 법률가나 연구자가 '특정 회사나 불공정거래 유형에 대해 증선위가 과거에 어떤 의결을 내렸는가'를 안건명이나 본문 검색어로 찾아볼 때 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키는 없고, 결정문 일련번호(결정문일련번호)로 같은 기관의 결정문 본문 조회를 이어 부르거나, 안건명에 나온 회사명을 이름으로 맞춰 연결하는 방식만 쓸 수 있다.
limits: open.law.go.kr의 별도 인증키(OC 파라미터)가 필요하며, 이 키는 포털 활용신청과 별개다. 결정례는 등록된 시점 이후의 것만 의미가 있으므로 최신 의결이 반영됐는지 따로 확인해야 한다.
