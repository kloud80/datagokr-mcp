summary_user: 전북특별자치도 남원시가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 업종 구분·상호·주소·전화번호·착한가격 지정품목·데이터기준일자를 담은 작은 CSV 파일(약 4KB)이다. 남원 시민이나 방문객이 '남원에서 값싸게 이용할 수 있는 음식점·미용실이 어디이고 어떤 품목이 지정됐나'를 찾을 때, 또는 분석가가 지역 물가안정 업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소를 기준으로 맞춰 붙여야 하며, 같은 원천을 공유하는 지방행정 인허가(LOCALDATA) 업소 정보나 다른 시군구 착한가격업소 목록과 이어 쓴다.
description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에서 운영하는 착한가격업소의 상세 현황 정보를 제공합니다. 착한가격업소는 합리적인 가격대로 우수한 품질의 서비스를 제공하여 시민들의 생활비 부담을 완화하는 업소로, 주로 음식점, 미용실, 그리고 기타 생활 서비스 분야의 업소들이 선정됩니다. 이 데이터의 핵심 목적은 물가 안정화 정책을 통해 소비자들이 경제적 부담 없이 필요한 서비스를 이용할 수 있도록 지원하고, 지역 소상공인들의 자발적 참여를 촉진하여 상호 협력적인 지역 경제 생태계를 만드는 것입니다.2. 데이터 항목명- 구분- 상호- 주소- 전화번호- 착한가격지정품목3. 기대효과이 데이터는 시민들이 경제적 부담을 줄이면서도 필요한 생활 서비스를 이용할 수 있게 함으로써 가계 경제 안정에 기여할 것으로 예상됩니다. 또한 투명한 가격 정보 공개를 통해 소비자들의 합리적 소비 문화를 확산시키고, 궁극적으로는 지역 경제 활성화에 긍정적인 영향을 미칠 것으로 기대됩니다.
