summary_user: 서울시에서 인허가된 의료법인을 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·휴폐업 일자·주소·좌표와 의료인수·병상수·입원실수·진료과목 같은 시설·인력 항목을 함께 담는다. 보건 담당자나 연구자가 우리 구에서 지금 영업 중인 의료법인 병원이 어디에 있고 병상 규모가 어느 정도인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 원천인 LOCALDATA 인허가 계열과는 자치단체코드·관리번호(MGTNO)로 맞추고 다른 기관 데이터와는 사업장명·주소나 좌표로 연결한다.
limits: 호출하려면 포털 활용신청과 별개로 data.seoul.go.kr 인증키를 발급받아 경로 파라미터로 넣어야 한다. 전역 조인 키가 없으므로 건강보험·응급의료 등 다른 기관 데이터와 결합하려면 이름·주소 매칭이 필요하고, 이 과정에서 오매칭이 생길 수 있다.
