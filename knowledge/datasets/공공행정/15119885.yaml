summary_user: 경기도 행정심판에 들어온 집행정지 신청을 건별로 담은 자료로, 신청번호, 사건명(음식점 영업정지·공인중개사법 위반 등), 피청구인(주로 시·군 단체장), 인용 여부 같은 신청결과를 기록한다. 행정법 연구자나 처분을 받은 사업자가 '영업정지 처분에 대한 집행정지 신청이 실제로 얼마나 인용되는지'를 사건 유형별·피청구 기관별로 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 피청구인 기관명이나 사건명 문자열을 매핑해서만 이어 쓸 수 있다.
description_portal: 이 데이터는 행정심판 집행정지 신청에 대한 결정 결과 현황을 정리한 자료로, 신청번호명, 사건명, 피청구인명, 신청결과의 네 가지 항목으로 구성되어 있습니다.사건명은 음식점 영업정지나 공인중개사법 위반 등 다양한 행정처분에 대한 집행정지 신청이 포함되어 있습니다. 피청구인명은 주로 시·군·구 단위의 지방자치단체장이고, 신청결과 항목은 해당 신청이 인용되었는지 여부를 기록하고 있습니다. 이 데이터는 행정심판의 실제 사례를 바탕으로 지방자치단체의 행정처분과 그에 대한 시민의 대응 현황을 파악하는 데 유용하며, 행정법 및 지방행정 사례 연구, 집행정지 인용률 분석, 법률정책 개선자료 등으로 활용될 수 있습니다.
