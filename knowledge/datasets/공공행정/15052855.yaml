summary_user: 경기도 포천시 관내에서 식품위생 관련 행정처분을 받은 업소를 건별로 담은 파일로, 업소명·도로명 소재지·행정처분일자·처분구분·처분내용을 기록하며 파일 크기는 약 1.6KB로 작다. 소비자가 포천시 특정 음식점이 위생 위반으로 영업정지나 과태료 처분을 받은 적이 있는지 확인하거나, 담당자가 위반 유형별 점검 대상을 고를 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 소재지 주소나 업소명을 직접 맞춰서만 연결된다.
description_portal: 경기도 포천시에서 제공하는 식품위생위반업소 현황 데이터입니다. 본 데이터는 업소명, 소재지주소, 행정처분일자, 행정처분구분, 처분내용 등 식품위생 관련 행정처분 정보를 제공합니다. 이를 통해 포천시 관내 식품위생위반업소의 행정처분 현황과 위반 유형을 확인할 수 있으며, 식품위생 관리 현황 분석, 식품안전 정책 수립, 위생지도 및 점검 계획 수립, 소비자의 안전한 업소 선택을 위한 기초자료로 활용할 수 있습니다. 또한 소재지주소를 기반으로 행정구역, 식품접객업소, 인구, 생활환경 등 다양한 공공데이터와 연계·분석이 가능하여 지역 식품안전 관리와 정책 연구에 활용할 수 있는 공공데이터입니다.
