summary_user: 지방자치단체별로 일반회계 기준 예산 총액, 사회복지분야 예산, 그 비율(사회복지비중)을 회계연도 단위로 집계해 담으며, 포털 설명상 2008회계연도부터 전국 자치단체를 대상으로 한다. 주민·분석가가 '우리 시·군·구는 예산 중 복지에 몇 퍼센트를 쓰고, 다른 지역이나 과거와 비교하면 어떤가'를 확인하는 데 쓴다. 자치단체 코드(laf_cd)와 상위 광역 코드(wa_laf_cd)·이름이 있으나 실측상 전역 조인 키는 없어, 다른 지방재정365 자료와는 같은 기관 코드나 자치단체명·회계연도로 맞춰 이어 쓴다.
description_portal: 지방자치단체의 사회복지 예산은 기초생활보장, 취약계층 지원, 보육, 노인 및 청소년 복지, 주택 지원 등의 분야로 되어 있으며 지역사회의 복지 향상을 위한 중요한 지표로 작용하고 있습니다. 이 자료는 지방자치단체별 예산 총액 대비 사회복지예산 지출하는 예산의 비율을 분석한 자료입니다. 자치단체별 일반회계 기준으로 2008년 회계연도 자료부터 확인 가능 합니다.사회복지비중 정보는 2008회계연도부터 제공되며 대상회계는 일반회계입니다. 제공되는 세부항목은 자치단체별 예산규모, 사회복지분야예산, 사회복지비율 항목입니다.
