summary_user: 전국 지방자치단체가 한 회계연도에 거둔 세입결산액을 재원 항목별로 나누고, 일반회계·공기업특별회계·기타특별회계별 금액으로 담은 집계 자료다(회계연도·광역/기초 자치단체·재원 항목·계층 단위). 분석가나 주민이 "우리 시·군·구는 작년 세입을 지방세·세외수입·이전재원 중 어디에 얼마나 기대했고, 그 돈이 일반회계와 특별회계에 어떻게 나뉘었나"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 자료와는 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 맞춰 연결해야 한다.
description_portal: 지방자치단체 재원별·회계별 세입결산은 지방자치단체가 하나의 회계연도 동안 확보한 세입을 재원의 성격과 출처에 따라 체계적으로 구분한 문서입니다. 이 결산 자료는 해당 기간 동안의 예산 집행 과정에서 발생한 모든 수입 내역을 일반회계, 특별회계 등 회계 유형별로 나누어 기록하며, 세입의 구성과 흐름을 명확하게 보여줍니다. 와 같은 세입결산은 지방재정의 투명성과 책임성을 확보하는 데 중요한 역할을 하며, 예산이 계획대로 집행되었는지 여부를 점검하고 향후 재정 운용의 방향을 설정하는 데 기초자료로 활용됩니다. 특히 다음 회계연도의 예산 편성과 재정계획 수립에 참고자료로서 가치가 큽니다.
