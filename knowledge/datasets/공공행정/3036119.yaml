summary_user: 전라남도(현 전남광주통합특별시) 양잠 산업 현황을 양잠 산물별로 농가수(호), 사육량(상자), 생산량(킬로그램)으로 정리한 시도 단위 집계표로, CSV 파일 크기가 213바이트에 불과한 소규모 표다. 지역 양잠 농가와 생산 규모를 파악하려는 농업 분석가나 지역 특산물 사업을 검토하는 사업자가 '전남에서 누에·양잠 산물이 얼마나 생산되나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 산물 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: '- 기능성 양잠산업 현황 - 양잠 산물, 농가수(호), 사육량(상자), 생산량(킬로그램) 등- 정보를 제공합니다.- 전라남도의 양잠 산업은 오랜 역사와 전통을 자랑하는 중요한 지역 산업 중 하나로, 특히 고흥, 보성, 장흥, 해남 등 남해안 지역에서 활발히 이루어지고 있습니다. 이 지역들은 기후와 환경이 누에 사육에 적합하여, 양잠 산업의 중심지로 알려져 있습니다.- 전라남도의 양잠 산업은 전통적인 산업이지만, 현대적인 기술과 결합하여 지속 가능한 발전을 추구하고 있습니다. 예를 들어, 친환경 사료의 개발, 자동화된 사육 시스템 도입, 비단 제품의 디자인 혁신 등이 이루어지고 있습니다. 또한, 지역 특산물로서의 브랜드 가치를 높이기 위한 노력도 계속되고 있습니다.'
