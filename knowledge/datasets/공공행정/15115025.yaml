summary_user: 강남구의 부속의원·부속병원·군부대 의무대 등 소속 직원과 그 가족의 건강관리를 위한 부속의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·폐업일·휴업기간·영업상태·주소·좌표·병상 수·의료인 수 등을 포함한다. 분석가가 '강남구에서 현재 운영 중인 사내 부속의원은 어디이고 언제 문을 열거나 닫았나'를 확인하거나, 상권·점포 이력 분석에서 의료 업종 원장으로 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, LOCALDATA 인허가 자료와는 같은 원천을 공유한다.
