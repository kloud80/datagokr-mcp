description_portal: '○ 통계개요* 통계명 : 거소신고인수 현황* 통계종류 : 외국국적동포 거소신고 현황의 보고·일반통계* 작성목적 : 장기체류의 목적의 외국국적동포 국내거소신고를 작성하여 외국인정책 수립및 집행의 기초자료로 활용하기 위함* 조사체계 : 출입국관리사무소 -> 법무부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 외국국적동포 및 거소신고인수○ 용어설명* 재외동포 : 재외국민 및 외국국적동포에 해당하는 자(재외동포의 출입국과 법적지위에 관한 법률)* 외국국적동포 : 대한민국의 국적을 보유하였던 자(대한민국정부 수립 전에 국외로이주한 동포를 포함) 또는 그 직계비속으로서 외국국적을 취득한자* 재외국민 : 대한민국의 국민으로서 외국의 영주권을 취득한 자 또는 영주할 목적으로외국에 거주하고 있는 자* 국내거소신고 : 영주권이나 시민권을 받아 주민등록이 말소된 재외국민과 외국국적동포가 오랜기간 한국에 거주할때 생기는 불편을 덜어주기위해 주민등록과유사한 효과를 가지는 증명서를 발급해주는 제도임."거소"라 함은 30일 이상 거주할 목적으로 체류하는 장소를 말함'
