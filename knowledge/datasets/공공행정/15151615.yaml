summary_user: 경기도 데이터분석센터에서 이용자가 반출을 신청한 내역을 신청 건별로 담으며, 분석신청번호(anls_aply_no)·데이터셋ID·데이터셋명으로 구성된다. 연구·분석 목적으로 유동인구, 성연령별 카드 매출, 이동 목적 OD, 생활인구 같은 데이터 중 어떤 것이 많이 반출되는지 파악하려는 분석가가 데이터 활용 동향과 수요를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 데이터셋명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 데이터분석센터에서 사용자들이 특정 데이터를 반출 요청한 내역을 정리한 자료로, 각 반출 신청 건에 대해 분석신청번호, 데이터셋ID, 데이터셋명으로 구성되어 있습니다. 데이터셋명에는 유동인구, 성연령별 카드 매출, 이동 목적 기반 OD(Origin-Destination) 데이터, 생활인구 등 다양한 주제의 데이터가 포함되어 있으며, 이를 통해 연구 및 분석 목적으로 어떤 데이터가 많이 활용되고 있는지를 파악할 수 있습니다. 본 데이터는 공공데이터 및 민간데이터 활용 동향 분석, 데이터 활용 수요 예측, 반출관리 시스템 개발 등 다양한 분야에서 활용 가능성이 있습니다.
