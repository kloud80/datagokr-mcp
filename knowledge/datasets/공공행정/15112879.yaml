summary_user: 경기도 의왕시 관내 공공건축물을 한 건물씩 명칭·주소·면적(㎡)·취득일로 정리한 목록 파일로, 범위는 시군구 단위이고 위치는 개별 주소로 담는다. 의왕시 공무원이나 지역 분석가가 시내 공공시설의 규모를 비교하거나 오래전에 취득한 건물을 골라 보수·재배치 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 주소를 지번·도로명으로 변환해 건축물대장·국유재산(PNU) 자료와 맞추거나 시설 명칭으로 매칭해야 한다.
description_portal: 이 데이터는 의왕시 관내에 위치한 공공건축물의 현황을 정리한 자료로, 각 건축물의 명칭, 주소, 면적(㎡), 취득일 등 주요 정보를 포함하고 있습니다. 공공건축물은 행정, 복지, 교육, 문화 등 다양한 기능을 수행하는 공공자산으로, 본 데이터는 이러한 시설의 물리적 규모와 위치를 체계적으로 파악할 수 있도록 구성되어 있습니다. 면적 정보는 시설 규모를 비교하거나 활용 가능 공간을 추정하는 데 활용되며, 취득일은 행정 자산의 이력 관리 및 보수 계획 수립 등에 참고할 수 있습니다. 이 자료는 도시계획, 공공시설 재배치, 예산 운용 등 행정적 의사결정을 위한 기초 자료로 활용 가능하며, 시민들에게도 지역 내 공공시설 정보를 제공하는 데 유용한 데이터입니다.
