description_portal: 본 데이터는 매년 시행되는 국민권익위원회 주관 "공공기관 종합청렴도 평가결과" 자료 입니다.항목은 연도, 종합청렴도, 청렴체감도, 청렴노력도로 구성되어 있으며, 종합청렴도는 청렴체감도 평가와 청렴노력도 평가를 종합하여 반영한 결과입니다.  이 데이터를 통해 조직의 반부패 청렴 활동의 효과성, 조직 내부의 청렴 문화 수준, 국민 체감 청렴 수준을 수치로 비교할 수 있습니다. 공공기관의 윤리경영 실천 정도, 공정성 확보 노력, 이해관계자 신뢰 수준 등을 정량적으로 분석할 수 있는 주요 자료로, ESG 중 "거버넌스(G)" 영역 평가에도 활용될 수 있습니다.
