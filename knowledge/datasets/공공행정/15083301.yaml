summary_user: 충청북도에서 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 원장 파일로, 시도·시군구·업종·업소명·도로명주소·연락처와 주요품목 및 그 가격을 담는다(CSV 약 55KB). 주민이나 여행객이 '우리 시군에서 싼 값에 밥을 먹을 수 있는 식당이 어디이고 대표 메뉴 가격이 얼마인지'를 찾거나, 분석가가 시군구·업종별 착한가격업소 분포와 품목 가격을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명·도로명주소 문자열 매칭이나 시군구 이름으로 이어 쓰며, 상권 분석에서는 지방행정 인허가(LOCALDATA) 업소 원장과 주소 기준으로 맞춰 보는 방식이 된다.
description_portal: '착한가격업소”는 소비자에게 합리적이고 적정한 가격으로 상품이나 서비스를 제공하는 업체를 말합니다. 주로 정부나 지방자치단체에서 선정하며, 소비자가 부담 없이 이용할 수 있도록 가격을 낮게 책정하고 품질도 일정 수준 이상을 유지하는 가게들을 뜻합니다.착한가격업소의 주요 특징합리적인 가격: 주변 시세에 비해 저렴하거나 적정한 가격으로 상품·서비스를 제공품질 유지: 가격이 저렴해도 품질과 서비스 수준이 기본 이상으로 유지됨소비자 보호: 소비자들이 믿고 이용할 수 있는 곳으로 선정되어 신뢰성이 높음지역경제 활성화: 지역 내 소비 촉진과 소상공인 보호에 기여'
