summary_user: 지방자치단체별 연도말 최종예산(일반회계) 기준 재정자립도를 회계연도·자치단체 단위로 담은 집계 지표로, 자체수입(개편 전·후), 예산규모, 재정자립도(개편 전·후)를 전국 범위로 제공하며 포털 설명상 2010회계연도부터 있다. 분석가나 주민이 "우리 시·군·구의 재정자립도는 몇 %이고 광역 평균보다 높은가, 해마다 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 자치단체 코드·이름(laf_cd, laf_hg_nm)과 상위 광역 코드·이름을 매핑하거나 같은 지방재정365의 다른 공시 데이터와 기관 코드로 연결해 쓴다.
description_portal: 재정자립도(최종)는 지방자치단체가 편성한 연도말 최종예산을 바탕으로 자체적인 재원을 통해 예산을 얼마나 충당할 수 있는지를 나타내는 지표로, 자치단체의 재정 건전성을 평가하는 중요한 척도입니다. 이는 자치단체의 세입 중 지방세, 세외수입 등 자체수입이 차지하는 비율을 나타내며, 이 비율이 높을수록 중앙정부 의존도가 낮고 자립적인 재정 운영이 가능하다는 의미입니다. 재정자립도는 결산 시 세입 결산액을 기준으로 계산되며, 이 값이 높을수록 자치단체의 재정이 안정적이고 독립적이라고 평가됩니다.재정자립도(최종) 정보는 2010회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 자체수입(개편전), 자체수입(개편후), 자치단체예산규모, 재정자립도(개편전), 재정자립도(개편후) 항목이 제공됩니다.
