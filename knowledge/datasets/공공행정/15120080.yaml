description_portal: '1372소비자상담센터에 접수된 상담 데이터를 기반으로 지역별 소비자 상담 현황을 제공합니다. 이 데이터는 매월 정기적으로 업데이트 되며, 각 지역별 상담건수 뿐만 아니라  전월 및 전년 동월 대비 상담건수의 증감률도 함께 확인할 수 있습니다. 이를통해 지역별 소비자상담의 변화 추이를 체계적으로 분석하는데 유용합니다. 이러한 분석 결과는 소비자 권익을 증진하기 위한 정책 수립과 개선에 활용할 수 있습니다.1372소비자상담센터 : 공정거래위원회가 운영하고 한국소비자단체협의회, 한국소비자원, 광역지자체가 참여하여 상담을 수행하는 전국 단위 소비자 상담 통합 콜센터'
