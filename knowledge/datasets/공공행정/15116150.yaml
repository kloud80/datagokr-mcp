description_portal: 서울시 강남구 공공와이파이 서비스 위치 정보(https://data.seoul.go.kr/dataList/datasetList.do)입니다.강남구의 서울시와 이동통신3사가 협력, 공동으로 구축하여 제공해 주는 누구나 사용이 가능한 무선인터넷 서비스 지역(AP)에 대한 위치 정보입니다와이파이명, 도로명주소, 상세주소, 설치유형, 설치기관(서울시, 국비,자치구 등), 서비스구분(과기부, 공공 등) 망종류(임대망, 자가망 등) 설치년도, 실내외구분등을 포함한 자료입니다.처럼 본 자료는 강남구 내에서 누구나 이용할 수 있는 공공와이파이의 다양한 설치 및 서비스 정보를 집약적으로 제공함으로써, 시민과 관광객의 무선인터넷 접근성 확대와 정보 소외 해소, 그리고 디지털 도시 인프라 구축에 실질적으로 기여하는 데이터입니다.
