summary_user: 경기도 양평군이 관리하는 공공 와이파이 설비를 설치 장소(장비명)·주소·통신사·구입년도·사용 가능 상태까지 한 건씩 담은 시군구 단위 원장 파일이다. 양평군 주민이나 방문객이 근처 무료 와이파이 위치와 현재 사용 가능 여부를 확인하거나, 분석가가 노후 설비 현황을 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 시설명을 맞춰 연결해야 한다.
description_portal: '양평군 내에서 무료로 사용 가능한 공공 와이파이 데이터 입니다.공공 와이파이의 위치정보, 통신사, 구입년도, 상태 정보가 포함됩니다.시민의 편의 제공과 안전한 데이터 제공목적으로 정보를 공개합니다.- 사업자: KT, LGU, SKT 통신사 중 하나로 문제 발생 시 해당 사업자 문의- 장비명: 와이파이가 설치된 시설 정보- 위치정보: 지번, 도로명 혼용 사용- 상태: 정상이면 사용가능하지만 비정상이면 현재 사용 불가능* 해당 정보는 양평군에서 관리하는 설비를 의미하며 양평군 내 모든 와이파이 설비를 의미하지 않습니다.'
