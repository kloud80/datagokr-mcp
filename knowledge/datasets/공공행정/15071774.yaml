summary_user: 서울시 관내 전통사찰의 인허가 기록을 사찰 한 곳당 한 행으로 담은 건별 원천 데이터로, 포털 설명 기준 64건이며 인허가일자·영업상태·지번/도로명 주소·중부원점TM 좌표·유래연혁·창립연대·승려수·신도수·지정취소 여부 등을 수록한다. 관광 안내 서비스나 문화유산 연구자가 '우리 구에 지정된 전통사찰은 어디이고 언제 창건됐으며 지금도 지정이 유지되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 개방자치단체코드(OPNSFTEAMCODE)·관리번호나 주소·사찰명으로 같은 출처의 LOCALDATA 인허가 데이터와 맞춰 연결한다.
description_portal: '불교 신앙의 대상으로서의 형상을 봉안하고 승려가 수행하며, 신도를 교화하기 위한 시설 및 공간 정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.ㅇ 데이터 개요: 서울시 관내 전통사찰의 인허가 현황과 관련된 행정 정보를 제공하는 데이터입니다. 총 64건의 사찰 인허가 기록이 포함되어 있으며, 각 사찰의 위치, 인허가일자, 영업상태, 전통사찰명, 유래 및 연혁, 창립연대, 승려수·신도수 등 세부 정보가 수록되어 있습니다.ㅇ 주요 항목: 개방자치단체코드, 관리번호, 인허가일자, 인허가 상태, 주소(지번·도로명), 좌표(X·Y), 유래연혁, 창립연대, 지정취소 여부, 전화번호 등 총 33개 항목으로 구성되어 있습니다.ㅇ 활용 방법: 전통사찰 현황 분석, 문화유산 보존 정책 수립, 관광 안내 서비스, 행정 인허가 관리, 지도 시각화 등에 활용 가능합니다. 특히 좌표 정보를 이용한 GIS 매핑, 연혁 데이터 분석을 통한 역사·문화 연구 등에 유용합니다.ㅇ 데이터 형식: CSV 형식으로 제공되며, 공공기관이나 연구기관에서 자유롭게 가공 및 분석할 수 있습니다.'
