summary_user: 전국 지방자치단체가 한 해 동안 쓰기로 계획한 예산을 회계연도·광역단체·기초단체별로 집계한 지방재정연감 예산편 자료로, 구분별 계획금액(전체와 연차별 금액)과 비율을 담으며 건별 세부사업 원장은 아니다. 분석가나 지방의원이 '우리 시·군·구의 예산 규모가 다른 자치단체와 비교해 어느 수준인가'를 볼 때 쓴다. 전역 조인 키는 없어서, 자치단체 코드(laf_cd)·광역 코드와 자치단체명을 매핑하거나 같은 지방재정365의 다른 공시 데이터와 같은 기관 코드로만 연결한다.
description_portal: '○ 지방재정연감 예산은 전국의 지방자치단체들이 한 해동안 사용하기로 계획한 예산의 총 규모와 항목별 세부 내역을 집계한 자료집입니다. 행정안전부가 매년 발간하며, 지방재정 관련 통계의 기초자료로 활용됩니다.○ 또한, 정부의 예산 편성 및 국회(지방의회) 심의의 근거가 되는 중요한 자료이며, 지방자치단체 재정 운영의 투명성과 건전성을 평가하는 데 활용됩니다.  - 총괄편 : 전국의 지방자치단체 예산 규모를 연도별, 회계별, 성질별로 총괄하여 분석합니다. 세입예산과 세출예산의 총계 및 순계 규모를 비교하고 재정자립도와 재정자주도 등 주요 재정지표를 예산기준으로 제시합니다. - 상세편 : 특별.광역시도, 도, 시, 군, 자치구 등 각 지방자치단체별 예산 현황을 구체적으로 확인할 수 있습니다.'
