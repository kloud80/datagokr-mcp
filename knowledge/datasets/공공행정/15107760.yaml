description_portal: '서울특별시 마포구의 행정동별 1인 가구 수(세대별 인구현황)에 대한 설명입니다. 이 데이터에는 행정기관과 행정동(아현동, 공덕동, 도화동, 용강동, 대흥동, 염리동, 신수동, 서강동, 서교동, 합정동, 망원제1동, 망원제2동, 연남동, 성산제1동, 성산제2동, 상암동), 그리고 행정동별 1인 가구의 수(단위: 명) 등의 정보가 포함됩니다. 이 데이터를 통해 주민과 행정기관은 지역별 1인 가구 분포와 세대 구성 현황을 쉽게 확인할 수 있으며, 고령자 지원, 청년 주거 정책, 복지 자원 배분 등 다양한 도시 및 사회 정책 수립에 효율적으로 활용할 수 있습니다.※2018년도 기준 자료입니다.'
