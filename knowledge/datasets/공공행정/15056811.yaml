summary_user: 법제처가 회신한 법령해석례를 건별로 모은 목록으로, 해석례마다 안건명·안건번호·회신일자·질의기관·회신기관과 상세 링크를 담는다(전국 범위, 비공간). 공무원이나 법률 실무자가 '특정 법령 조항에 대해 어느 기관이 질의했고 법제처가 언제 어떻게 회신했는지'를 찾을 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 안건번호·법령해석례일련번호나 질의·회신기관 코드 같은 같은 기관 체계의 코드, 또는 기관명 매핑으로만 잇는다.
description_portal: 본 데이터는 법령에 대한 해석례를 모바일 환경에서 조회할 수 있도록 제공하는 목록입니다. 법령의 구체적 적용과 해석에 관한 다양한 사례를 체계적으로 수록하여 법률 해석의 기준과 방향을 제시합니다. 각 사례는 법령조항별로 분류되어 있어 법적 판단의 일관성을 확보하는 데 유용합니다. 이를 통해 행정기관 및 법률 관계자들이 법령 적용에 관한 정확한 정보를 신속하게 확인할 수 있으며, 법령 해석과 관련한 분쟁 예방과 해결에 기여합니다. 또한, 법제 전반에 관한 이해를 높이고 실무에 도움을 주는 자료로 활용됩니다. 본 목록은 법적 안정성과 예측 가능성을 지원하는 중요한 근거 자료입니다.
