description_portal: 본 데이터는 지방세 체납으로 번호판 영치 대상이 된 차량의 통계 정보이다. 영치대상 차량 수, 체납 세액, 체납 건수 등의 세부 내용을 포함한다. 번호판 영치는 지방세를 장기간 체납한 차량 소유자에 대해 차량 운행을 제한하여 자진 납부를 유도하는 징수 활동이다. 해당 자료는 지방세 징수율 향상 정책 수립, 체납 관리 강화, 징수 활동 평가에 활용된다. 체납 현황 분석을 통해 효과적인 징수 전략을 수립하고 체납액 징수 실적을 제고할 수 있다. 또한 세입 확보 및 조세 정의 실현에 기여하며, 성실 납세 문화 확산을 도모한다. 본 정보는 정기적으로 갱신되어 최신 체납 차량 현황을 반영하며, 체납 관리 업무 개선 및 징수 효율성 제고에 활용된다.
