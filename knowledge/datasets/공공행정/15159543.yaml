description_portal: 지방자치단체를 당사자로 하는 계약에 관한 법률 시행령 제124조(계약정보의공개)에 따라 부산광역시 남구에서 집행하고 있는 계약관련 정보를 부산 남구청 홈페이지(부산남구청 홈페이지→열린행정정보공개→계약정보공개시스템)를 통해 공개하고 있습니다. 공개 내용으로는 공사, 용역, 물품 계약의 상세(계약일, 계약상대자, 계약금액, 계약방법 등) 및 발주계획, 입찰정보 등을 제공하고 계약관련 법규와 계약 시 필요한 서식 등을 확인하고 다운로드 받을 수 있습니다. 또한 바로가기를 통하여 나라장터, 법제처, 엔지니어링공제조합, 한국폐기물협회, 서울보증보험 등 누리집으로 바로 접속하여 정보검색도 가능합니다.
