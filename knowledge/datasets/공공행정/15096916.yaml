summary_user: 제주특별자치도 관내 관공서·주요 기관의 수를 연도·시군구·기관 분류(읍면동 사무소, 지역청, 공기업, 공공기관 등)별로 집계한 통계로, 포털 설명상 2012~2020년을 다룬다. 지역 정책 담당자나 연구자가 '제주시와 서귀포시의 공공기관 수가 연도별로 어떻게 달라졌나'처럼 행정 인프라 분포와 변화 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 기관 분류명을 맞춰 연결해야 한다.
description_portal: 제주특별자치도 관내 관공서 및 주요 기관 현황 데이터는 2012년부터 2020년까지 기간 동안 제주특별자치도 지역에 등록된 각종 공공기관 및 주요 기관의 수를 유형별로 집계한 통계자료이다. 이 자료는 읍면동 사무소, 동사무소, 지역청, 공기업, 공공기관 등 여러 기관 유형을 포함하며, 연도별 기관 수 변화를 통해 행정 인프라의 분포 및 변화 추이를 파악할 수 있다. 지방자치단체 및 정책 담당자는 이 데이터를 사용해 기관 분포의 균형성 평가, 공공서비스 제공 체계 점검, 행정 조직 재편 또는 기관 설치‧폐지에 관한 정책 검토를 수행할 수 있다. 또한 연구자와 시민은 지역 행정 인프라의 공간 분포, 기관 밀집도, 공공서비스 접근성 분석 등 다양한 분석을 위해 신뢰할 만한 공공통계 기반 자료로 활용할 수 있다. 자료는 CSV 형식으로 공개되어 누구나 접근 가능하다.
