description_portal: 본 데이터는 2024년 12월 기준 인천광역시의 농림수산물 수출입 실적을 집계한 자료로, 인천항을 중심으로 이루어지는 농산물·수산물·축산물·임산물의 국제 교역 현황을 한눈에 확인할 수 있도록 제공됩니다.세부적으로 살펴보면, 농산물은 수출액 368,903천 달러, 수입액 2,700,186천 달러로 전체 품목 중 가장 큰 비중을 차지하고 있으며, 특히 높은 수입 규모로 인해 무역수지 적자가 크게 발생한 것이 특징입니다.수산물은 수출액 134,495천 달러, 수입액 523,724천 달러로 농산물 다음으로 높은 수출 실적을 보였으나, 수입 규모가 더 크기 때문에 역시 무역수지는 적자 구조를 나타냈습니다.축산물의 경우, 수출액은 84,309천 달러, 수입액은 304,301천 달러로 기록되었으며, 안정적인 교역량을 유지하고 있습니다.임산물은 수출액 12,274천 달러, 수입액 824,370천 달러로, 전체 품목 중 수출액이 가장 낮고 수입 규모가 상대적으로 커 무역 불균형이 가장 두드러지는 품목으로 나타났습니다.
