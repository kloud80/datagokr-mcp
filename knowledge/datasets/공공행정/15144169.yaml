description_portal: 본 데이터는 대구광역시 달성군 관내에 설치된 현수막 게시대 시설에 대한 정보를 제공하는 자료입니다. 게시대 구분, 게시대 위치명, 시도명, 시군구명, 소재지 지번주소, 현수막 규격, 게시 면수, 용도 구분명, 관리기관명, 관리기관 전화번호, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 주민과 사업자는 합법적으로 현수막을 게시할 수 있는 지정 게시대의 위치와 규격, 게시 가능 수량을 손쉽게 확인할 수 있습니다. 또한 옥외광고물의 무단 부착을 줄이고 쾌적한 도시 경관을 조성하며 광고물 게시 질서를 확립하는 데 활용됩니다. 데이터는 데이터 기준일자를 기준으로 작성되며 현장 상황에 따라 실제 정보와 차이가 있을 수 있으므로 게시 전 관리기관에 문의하여 정확한 내용을 확인하시기 바랍니다.
