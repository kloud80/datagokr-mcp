summary_user: 세종특별자치시 안의 과속방지턱을 한 개씩 담은 건별 원천 데이터로, 설치위치·주소·위경도와 재료·형태, 높이·폭·연장길이, 설치도로유형, 규격 충족 여부, 보차분리·연속형 여부, 설치년도, 관리기관을 함께 제공한다. 주민이나 교통안전 분석가가 '우리 동네 어느 도로에 규격에 맞지 않는 과속방지턱이 몇 개 있나'를 확인하거나 어린이보호구역 등 도로 안전시설 현황을 점검하는 데 쓴다. 전역 조인 키는 없으므로 위경도(la, lo)나 주소로 다른 공간 데이터와 위치 기준으로 겹쳐 쓰거나, 관리기관명으로 같은 기관 자료와 연결한다.
limits: 범위가 세종특별자치시 한 곳이라 다른 시도와 비교하려면 별도 데이터가 필요하다. 행정표준코드 같은 공통 키가 없어 다른 데이터와는 이름 매칭이나 좌표 중첩으로만 연결된다. 개발계정은 하루 5,000회 호출 제한이 있다.
