summary_user: 서울시 안의 아이스링크·스케이트장 등 빙상장업 사업장을 한 곳씩 담은 인허가 원장으로, 인허가·취소·휴폐업 일자와 영업상태, 주소·좌표, 공공·민간 구분, 건축물 규모, 지도자 수, 회원모집 인원, 보험가입 여부를 담는다. 체육시설 정책 담당자나 분석가가 "서울에서 지금 영업 중인 빙상장은 어디에 몇 곳이 있고, 공공과 민간 비율과 보험 가입 상태는 어떤가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 사업장명·주소 매칭이나 같은 기관의 관리 코드(개방자치단체코드·관리번호)로만 다른 데이터와 잇고, 같은 원천을 쓰는 LOCALDATA 인허가 자료와 함께 상권·점포 이력 분석에 쓴다.
description_portal: 서울시 빙상장업 인허가 정보는 서울시 내 아이스링크·스케이트장 등 빙상시설의 인허가 및 영업 현황을 보여주는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 각 빙상장이 현재 영업 중인지, 휴업·폐업 상태인지 등 행정 이력을 확인할 수 있습니다. 사업장명, 법인명, 전화번호, 지번·도로명 주소, 우편번호, 좌표정보, 업태구분명, 문화체육업종명, 세부업종명은 빙상장의 위치, 운영 주체, 체육시설 유형을 파악하는 핵심 항목입니다. 공사립구분명은 공공 빙상장인지 민간 빙상장인지 구분하는 데 쓰이고, 건축물동수와 건축물연면적, 소재지면적은 시설 규모와 건물 구성(동 수)을 보여 줍니다. 지도자수는 코치·강사 등 지도 인력 확보 수준을 나타내며, 회원모집총인원은 회원제 운영 규모와 잠재 이용 인원을 가늠하게 해 줍니다. 보험가입여부코드는 안전사고 대비를 위한 보험 가입 상태를 나타내어 안전관리 점검 및 체육시설 관리 정책 수립에 유용하며, 전반적으로 서울시 빙상장 분포, 규모, 운영주체, 인력·안전 현황을 분석하는 데 활용 가능한 데이터입니다.
