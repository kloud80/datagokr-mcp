description_portal: '기본생활필수품 가격 데이터는 부평구 내 유통되는 농산물, 수산물, 공산품 등 주요 생필품의 가격 변동 정보를 주간 단위로 수록한 자료품목별 판매처, 규격 기준 가격, 전주 대비 증감액과 등락률 등으로 구성되며, 시장물가 분석과 생활비 체감도 조사에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 주간 단위 생필품 가격 동향 및 물가 변화 모니터링– 판매처별 가격 비교를 통한 합리적 소비 정보 제공– 품목별 수급 상황에 따른 가격 추이 분석– 물가 안정 정책 수립 및 지역경제 대응 자료 활용주요 항목 설명● 구분: 농산물, 수산물, 공산품 등 품목 성격에 따른 분류● 품목: 조사 대상 생필품의 명칭 (예: 달걀, 고등어, 라면 등)● 규격 및 단위: 가격 조사 기준이 되는 단위 (예: 10개입, 1마리, 1봉지 등)● 판매마트: 해당 품목이 판매된 유통업체명 또는 점포명● 가격: 조사 시점 기준 해당 품목의 실제 판매가격● 전주평균: 직전 주의 평균 판매가격(원)● 금주평균: 이번 주의 평균 판매가격(원)● 증감액: 전주 대비 가격 변동 금액(원)● 등락률: 가격 변화 비율을 백분율로 표시'
