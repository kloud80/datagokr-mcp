description_portal: 여수시 불법주정차 위반 과태료 부과 현황에 대한 연도별 건수 및 부과금액 정보를 시민에게 공개함으로써, 불법주정차 단속 행정의 운영 현황을 투명하게 제공하고 시민의 알권리를 보장하고자 함.본 데이터는 2017년부터 2025년까지 여수시에서 부과한 불법주정차 위반 과태료의 연도별 부과 건수 및 부과금액 현황을 집계한 자료로, 연도별 행정처분 규모와 세외수입 부과 현황 등을 확인할 수 있도록 구성되어 있음.자료에 포함된 부과 건수는 「도로교통법」 등 관계 법령에 따라 불법주정차 위반 사실이 확인되어 과태료가 부과된 건수를 의미하며, 부과금액은 해당 연도 기준 실제 부과 결정된 금액을 기준으로 산정한 자료임. 단속 유형에는 고정형 CCTV, 이동형 단속차량, 주민신고제(안전신문고) 등을 통한 불법주정차 단속 건이 포함될 수 있음.또한 본 자료는 연도별 불법주정차 단속 추이와 과태료 부과 규모를 파악할 수 있는 기초자료로서, 시민의 교통질서 의식 제고 및 주정차 행정에 대한 이해를 돕기 위한 목적으로 제공됨. 아울러 주차질서 확립 정책, 교통안전 대책 수립, 주차환경 개선사업 검토 및 세외수입 운영 현황 분석 등 다양한 행정 분야의 참고자료로 활용 가능함.특히 연도별 부과 현황은 단속 환경 변화, 주민신고제 운영 확대, 교통량 증가, 단속 장비 운영 현황, 법령 및 행정지침 변경 등에 따라 변동될 수 있으며, 특정 연도의 증감은 이러한 행정·사회적 요인이 복합적으로 반영된 결과일 수 있음.제공되는 자료는 내부 행정시스템 및 세외수입 관리자료 등을 기준으로 작성된 통계자료이며, 이후 부과취소·감액·오부과 정정 등의 사유로 일부 수치가 변동될 수 있음. 또한 개인정보 및 개별 위반사항에 관한 세부 내용은 제외한 통계 형태로 제공하여 관련 법령에 따른 개인정보 보호사항을 준수함.5
