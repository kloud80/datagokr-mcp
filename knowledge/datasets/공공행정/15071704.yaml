summary_user: 서울시 관할 원목생산업 사업장의 인허가 정보를 사업장 1곳당 1행으로 담은 건별 목록이다. 포털 설명 기준 총 20건이며, 인허가일자, 영업상태, 지번·도로명 주소, 좌표, 최종수정일자 같은 필드를 포함한다. 서울 안에 영업 중이거나 폐업한 원목생산업체가 어디에 있는지, 인허가 이후 상태가 어떻게 바뀌었는지 확인하려는 행정 담당자와 분석가가 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없다. 따라서 LOCALDATA 인허가 자료와는 개방자치단체코드·관리번호(MGTNO)로, 그 밖의 데이터와는 주소나 좌표로 맞춰 이어 쓴다.
description_portal: 'ㅇ 데이터 개요: 서울시 관할의 원목생산업 인·허가 현황을 정리한 표준형 목록 데이터입니다(파일명 및 ‘개방자치단체코드’ 기준). 총 20건, 32개 필드로 구성되어 있습니다.ㅇ 수집·관리: ‘개방자치단체코드’, ‘관리번호’, ‘인허가일자’, ‘영업상태(코드/명)’, ‘주소(지번/도로명)’, ‘좌표정보(X/Y)’, ‘최종수정일자’ 등 행정 인허가 관리 필드를 포함합니다.ㅇ 기간 범위: 인허가일자 기준 2013-10-29 ~ 2025-07-11 범위를 포함합니다(확인됨).ㅇ 최신성: ‘최종수정일자’의 최댓값은 2025-07-11, ‘데이터갱신구분’은 I·U 값이 혼재하며 ‘데이터갱신일자’는 주로 2024-12-05~12-07 구간에 분포합니다.ㅇ 영업상태 현황(20건): 영업/정상 8건, 폐업 10건, 휴업 1건, 제외/삭제/전출 1건(확인됨).ㅇ 공간 정보: ‘도로명주소’ 결측 0%, 좌표 X/Y 결측 0%로 위치기반 분석·지도 시각화에 적합합니다(좌표계 표기는 미기재).ㅇ 결측/품질: 전화번호 결측 55.0%, 지번주소 결측 40.0%, ‘목재생산업(구분/종류)’ 각 65.0% 결측, ‘업태구분명·휴업/재개업 관련 필드’는 대부분 결측입니다. 필드별 결측치 보완이 필요합니다.ㅇ 활용 예시: ① 인허가 추세 및 상태변화 모니터링 ② 위치기반 점포 분포 분석 ③ 안전·단속/민원 대응을 위한 기반자료 ④ 타 부서(산림·환경·안전) 데이터와의 교차분석.ㅇ 유의사항: 일부 ‘사업장명’ 마스킹(예: ‘***’) 존재, 주소 중 타 시군 표기 사례가 소수 포함되어 행정구역 정합성 점검이 필요합니다. 인력·생산량·자본금 등 경영지표는 결측이 높아 단독 지표 활용은 제한됩니다.ㅇ 개선 제안: ‘목재생산업 구분/종류’ 표준코드 일관화, 연락처·우편번호·업태 보완, 좌표계(EPSG 등) 명시, 상태변경 이력(일자·사유) 정규화 권장.'
