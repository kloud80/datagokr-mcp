description_portal: '[SGIS 오픈 플랫폼] "기업생태분석지도" 서비스의 집계 데이터입니다.기준년도,경계유형,경계명,기업전체수를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 기업생태분석지도  국가데이터처 기업통계등록부(SBR)의 기업체 기준 통계자료를 바탕으로 사용자의 편리한 이용을 위해 8개의 기업생태 테마를 구성했으며, 제공하는 다양한 지표와의 융합을 통해 보다 세밀하고 알기 쉬운 분석 경험을 얻을 수 있도록 구성된 서비스'
