summary_user: SGIS 기업생태분석지도 서비스의 집계값으로, 기준년도별로 경계유형과 경계명(행정구역 등) 단위의 기업 전체 수를 담은 전국 범위 집계 파일(CSV)이다. 지역별 기업 수가 해마다 어떻게 달라졌는지, 어느 시군구·읍면동에 기업이 몰려 있는지를 보려는 분석가나 지자체 담당자가 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 경계명(지역 이름) 매칭이나 같은 기관(국가데이터처) SGIS 자료와의 이름·코드 매핑으로만 잇는다.
limits: 행정구역 코드가 없고 경계 이름만 있으므로 다른 데이터와 붙일 때 이름 매핑이 필요하며, 동명 지역이나 경계 변경에 주의해야 한다. 좌표·경계 도형이 없는 비공간 표 형태라서 지도에 올리려면 별도 경계 파일이 필요하다.
