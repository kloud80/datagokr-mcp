description_portal: 인천광역시 품목별 소비자물가지수 현황(지출목적별(총지수, 식료품, 주류, 의류, 주택 등) 및 연도별)에 대한 정보입니다.이 공공데이터는 인천광역시의 **연도별 소비자물가지수(CPI)**를 지출 목적별로 세분화하여 집계한 통계 자료입니다. 이 자료는 인천 지역 가계의 소비 지출 구조와 물가 변동 추이를 파악하는 데 활용됩니다.<활용 목적>이 자료는 인천시의 경제 상황 및 물가 안정화 정책 수립의 핵심 기초 자료입니다. 특히, 서민 경제 안정 대책 및 임금, 연금 등 각종 경제 지표 산출의 근거 자료로 활용되며, 가계의 소비 행태 및 구매력 변화를 분석하는 데 중요한 정보를 제공합니다.인천시의 경제 분석 및 물가 관리 정책 수립에 필수적인 기반 정보입니다.
