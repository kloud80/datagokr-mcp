summary_user: 국회에서 처리된 법률안을 의안 한 건 단위로 담으며, 의안번호·대수·의안명·제안자와 제안자 구분, 제안일, 소관위원회와 회부일, 위원회·법제사법위원회·본회의 단계별 상정·처리일과 처리결과, 의안 상세 링크를 포함하고 범위는 전국·비공간이다. 입법 동향을 보는 국민·기자·분석가가 '이번 대수에 특정 위원회에서 가결되거나 폐기된 법률안은 무엇이고 제안부터 본회의 처리까지 얼마나 걸렸나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 국회사무처의 다른 의안 데이터와는 의안번호(BILL_NO)·대수 같은 이름·코드 매핑으로만 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
