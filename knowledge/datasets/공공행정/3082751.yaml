description_portal: 전북특별자치도 고창군 통계연보 공공데이터는 고창군의 다양한 행정 및 경제 지표를 제공하는 데이터입니다. 이 데이터에는 토지, 기후, 인구, 사업체, 농림수산업, 광업, 제조업 및 에너지, 전기, 가스, 수도, 주택, 건설, 교통, 관광 및 정보통신, 환경, 교육문화, 공공행정 및 사법 등의 항목이 포함됩니다.데이터는 XLS 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다. 또한, 고창군청 홈페이지 통해 다양한 통계 자료를 시각적으로 확인할 수도 있습니다. 해당 데이터는 고창군 행정지원과에서 관리하며, 연간 업데이트됩니다. 보다 자세한 내용은 공공데이터포털과 고창군청 홈페이지에서 확인할 수 있습니다.
