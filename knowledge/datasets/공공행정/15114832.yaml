summary_user: 2022년 6월 1일 제8회 전국동시지방선거의 투표율을 시·도별, 성별, 연령대별로 나눠 집계한 분석표 파일이며, 전국 14,351개 투표구 중 1,505개 투표구(선거인 약 456만 명, 전체의 10.3%)를 체계적 무작위 추출한 표본조사 결과를 담는다. 연구자나 선거 관계자가 '20대와 60대의 투표율 차이는 얼마이고 사전투표율은 시·도별로 어떻게 다른가' 같은 질문을 확인하고 투표율 제고 방안을 연구하는 데 쓴다. 공통 조인 키가 없어서 다른 회차 선거의 투표율 분석이나 인구 통계와는 시·도명·연령대 이름을 직접 맞춰 이어 써야 한다.
description_portal: '2022년 6월 1일에 실시한 제8회 전국동시지방선거의 투표율을 성별, 연령대별, 지역별로 비교·분석함으로써 각종 선거의 투표율 제고 등 선거관련 제반 연구의 기초적인 자료로 활용하기 위함.※ 조사방법▶ 모집단: 전국 14,351개 투표구 / 선거인 44,383,449명 (증거보전신청 대상 2개 선거구 제외) / 사전투표자 9,133,522명 / 재외국민 76,192명, 외국인 127,623명(강북구, 성주군 제외)▶ 표본수 : 투표구 1,505개 / 선거인 4,560,971명 (전체 선거인의 10.3%)     ▶ 표본추출방법: 체계적 무작위 추출법※ 조사기간: 2022. 8. 8. ∼ 2022. 8. 19.'
