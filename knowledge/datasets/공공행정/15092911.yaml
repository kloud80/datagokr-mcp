description_portal: 대구광역시 서구 TNR(포획, 중성화 수술, 재 방사) 가능한 동물병원 현황 데이터 입니다. 동물병원 이름, 전화번호, 위치 등의 데이터를 포함하고 있습니다.본 데이터는 대구광역시 서구청에서 제공하는 자료로,  중성화 사업 수행이 가능한 관내 동물병원 현황을 수록한 목록이다. 길고양이 개체 수 조절 및 지역 내 동물복지 향상을 위한 중성화 수술이 가능한 의료기관의 명칭, 전화번호, 주소 등의 기본 정보를 포함하고 있으며, 시민들이 TNR 관련 서비스를 신속하고 정확하게 이용할 수 있도록 정보를 정리하였다. 해당 데이터는 TNR 지원 병원을 찾는 시민 및 동물보호단체의 편의를 도모하고, 지역 내 길고양이 문제 해결을 위한 기반 자료로 활용될 수 있다. 본 자료는 길고양이 보호 및 지역사회 동물관리 정책 수립에 참고자료로 제공된다.[용어정리] TNR은 Trap-Neuter-Return(방생) 또는 Trap-Neuter-Release(재방사)의 준말로, 길고양이를 포획해 거세·불임 등을 통해 생식능력을 제거하고 다시 방사하는 조치를 말한다. TNR의 목적은 길고양이의 개체수를 인도적인 방법으로 조절하는 데 있는데 있다.
