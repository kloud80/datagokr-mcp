summary_user: 대전 유성구 관내 행정기관을 기관 한 곳당 한 행으로 담은 파일로, 기관구분·기관명·도로명주소·지번주소·전화번호를 수록한다(CSV 약 3KB 규모의 시군구 단위 자료). 주민이나 민원 담당자가 '유성구 안의 이 관공서는 어디에 있고 전화번호가 무엇인가'를 확인하거나, 관내 행정기관 위치 목록을 만들 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명이나 주소(도로명·지번)를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 유성구 관내의 행정기관을 대상으로 기관구분, 기관명, 도로명주소, 지번주소, 전화번호 등의 정보를 수록한 자료입니다. 각 기관의 위치와 연락처를 확인할 수 있어 주민 민원 응대, 행정업무 협조, 기관 간 문서 송달, 지역 내 공공서비스 접근성 향상 등에 활용될 수 있습니다. 또한 도로명주소와 지번주소를 병기함으로써 다양한 행정업무에서 위치 기반 정보를 유연하게 활용할 수 있으며, 전화번호 정보는 기관별 유선 연락 체계 구축 시 유용합니다. 행정정보 접근성을 높이고, 공공서비스 전달체계의 기반 데이터로 활용될 수 있습니다
