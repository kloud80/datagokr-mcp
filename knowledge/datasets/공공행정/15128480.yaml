description_portal: 전북특별자치도 고창군 상하면의 리 단위 인구통계 공공데이터는 2009년부터 2022년까지의 인구 변화를 기록한 자료입니다. 이 데이터는 행정구역명, 성별, 연령, 인구수 등의 정보를 포함하며, CSV 형식으로 제공됩니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, 오픈 API를 통해 활용할 수도 있습니다. 또한, 2025년 1월 기준 상하면의 총 인구는 2,204명으로, 남성 1,104명, 여성 1,100명으로 구성되어 있습니다. 인구는 최근 1년간 77명 감소(-3.38%)했으며, 노령층(65세 이상)이 전체 인구의 47.64%를 차지하고 있습니다.더 자세한 정보는 공공데이터포털에서 확인할 수 있습니다.
