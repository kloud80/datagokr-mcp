summary_user: 2019년 기준 제주 청년을 연령대별로 나눠 희망하는 일자리 유형과 그 이유를 설문으로 집계한 비율(%) 통계다. 청년 고용 정책 담당자나 연구자가 '제주 20대 후반 청년은 공공 부문과 민간기업 중 어디를 더 원하고, 안정성과 수입 중 무엇을 더 중시하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령대·항목 이름을 맞추거나 같은 제주특별자치도 청년실태조사 항목끼리만 이어 쓴다.
description_portal: '이 데이터는 2019년 기준으로, 제주도 내 청년들이 연령대별로 어떤 유형의 일자리를 희망하는지, 그리고 그 이유를 설문 방식으로 집계한 통계자료이다. 청년들이 선호하는 일자리 형태(예: 정규직, 계약직, 프리랜서, 공공 부문, 민간기업 등) 및 업종, 근무 조건 등에 대한 선호 경향과, 일자리를 선택할 때 중시하는 이유(안정성, 수입, 근무환경, 경력 개발 가능성 등)를 함께 제공한다. 이 정보는 제주 지역 청년층의 고용 기대치와 노동시장 요구를 이해하는 데 중요한 기초자료로, 청년 고용 정책 설계, 지역 일자리 제공 전략, 청년 취업 지원 프로그램 설계, 청년 정주 여건 개선을 위한 행정 및 연구 자료로 폭넓게 활용될 수 있다. 자료 제공기관은 제주특별자치도이며, “공공데이터” 형식으로 CSV 파일이 공개되어 누구나 다운로드 및 분석 가능하다'
