description_portal: 본 데이터는 한국중부발전이 연료 운송을 위해 체결한 장기용선 계약의 세부 현황을 정리한 자료입니다. 항목은 구분, 선박명, 계약번호, 계약선사, 재화중량톤수, 총등록톤수, 계약 시작 연월, 계약 종료 연월로 구성되어 있으며, 톤 단위로 표기된 선박 적재능력 정보를 포함합니다. 해당 데이터는 석탄, LNG 등 발전 연료 수송을 위한 해상운송 계약의 주요 조건과 기간을 파악하는 데 활용 가능합니다. 또한 선복량 확보 수준, 운송계약 구조, 공급 안정성 확보 전략, 계약선사의 운항 규모 분석 등에도 활용 가능합니다.
