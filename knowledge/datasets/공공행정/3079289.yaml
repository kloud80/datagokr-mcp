description_portal: '부산광역시 사하구에서 조사한 주요 생필품 가격 정보 현황에 대한 데이터를 제공합니다.이 데이터는 2025년 9월 10일을 기준으로 쌀, 밀가루, 라면, 설탕 등 주요 생필품의 품목별 단위, 조사업체별 가격을 상세하게 보여줍니다. 시장, 대형 마트등 다양한 유통 채널에서의 가격을 비교할 수 있습니다.*주요 데이터 컬럼별 상세설명○ 품목 → 조사 대상 생필품의 종류 (예: 쌀, 밀가루, 라면, 설탕)○ 단위 → 해당 품목의 측정 단위 및 용량 (예: 정미포장미 20㎏, 신라면 120g 5개 1봉지, 백설표 정백당 1㎏ 등)○ 조사업체 → 가격 조사가 이루어진 유통 업체명 (예: 괴정골목시장, 장림골목시장, 서원유통 탑스토아, 롯데마트(사하점), 홈플러스(장림점))○ 금액 → 해당 품목의 조사업체별 판매 가격○ 비고 → 품목에 대한 추가적인 정보 (예: 메뚜기쌀, 황금메뚜기쌀)'
