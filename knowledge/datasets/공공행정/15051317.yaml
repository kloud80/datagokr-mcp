summary_user: 전북특별자치도 전체를 단위로 월별 전입·전출·순이동 인구를 남녀로 나눠 집계한 통계표로, 연도마다 전입·전출·순이동 열이 옆으로 붙는 형태이며 필드 목록상 2012년부터의 연도가 들어 있습니다(포털 설명은 8년간). 연구자나 정책 담당자가 '전북에서 해마다 어느 달에 순유출이 커지는가, 남녀 차이는 있는가'처럼 지역 인구 증감의 계절 패턴과 장기 추이를 볼 때 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어, 다른 인구·일자리 통계와는 '전북'이라는 지역명과 연·월을 맞춰 붙여야 한다.
description_portal: 8년간 전북특별자치도의 월별 인구 이동 현황을 상세히 집계한 통계 데이터입니다. 이 자료는 매월 전북특별자치도로 전입한 인구와 다른 지역으로 전출한 인구 수를 남녀 성별로 구분하여 보여주며, 이를 통해 순이동 인구(전입-전출)의 변화 추이를 파악할 수 있습니다. 이 데이터는 지역의 인구 증감에 대한 장기적인 흐름과 계절적 패턴을 분석하는 데 중요한 기초 자료입니다. 정책 입안자나 연구자들은 이를 통해 지역의 매력도나 일자리 변동 등 인구 이동에 영향을 미치는 사회경제적 요인을 분석하고, 맞춤형 인구 정책을 수립하는 데 활용할 수 있습니다.
