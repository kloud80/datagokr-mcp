description_portal: 충청남도 하천계획제원 데이터는 도내 하천의 치수·이수 계획 수립과 시설 관리를 위한 기술적 기준 정보를 체계적으로 정리한 자료이다. 본 데이터는 관리번호와 기본계획코드, 측점번호를 기준으로 구간거리와 누가거리, 최심하상고 및 평형하상고, 계획홍수량, 현하폭과 계획하폭, 좌·우안 제방고, 일제관측수위, 계획홍수위, 개수 전 홍수위(10년 빈도) 등으로 구성되어 있다. 이를 통해 하천 구간별 계획·현황 제원을 종합적으로 파악할 수 있으며, 하천 정비사업, 홍수 대응 및 재해 예방, 하천 기본계획 검토와 기술적 의사결정을 지원하는 기초자료로 활용된다.
