status: active
summary_user: 공공기관이 수행하는 주요 사업과 대민서비스를 사업 단위(사업상세일련번호) 건별로 담으며, 기관명·사업명·사업분류·서비스분류·사업기간·이용대상·이용방법·생애주기·안내 사이트를 포함하고 범위는 전국·비공간이다. 국민이나 분석가가 "내 생애주기나 처지에 해당하는 공공기관 지원사업은 무엇이고 어떻게 신청하나" 같은 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않았고, 기관코드나 행정표준기관코드(pbadmsStdInstCd)를 통해 같은 기관의 다른 데이터와 이름·코드 매핑으로만 잇는다.
limits: 좌표나 시설 위치 정보가 없는 비공간 데이터라 시설 단위 지도 분석에는 쓰지 못한다. 전역 조인 키가 없어 다른 데이터와는 기관 코드·이름 매핑으로만 연결된다. 개발계정은 하루 1,000회 호출로 제한된다.
