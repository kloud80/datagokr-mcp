summary_user: 인천광역시 영종구(포털 설명상 옛 중구) 소유 공유재산 가운데 건물을 한 건씩 담은 목록이며, 재산명·소재지 주소·연면적(제곱미터)·데이터기준일자를 기록하고 행정재산과 일반재산을 함께 포함한다. 사업자나 주민이 "구가 가진 건물 중 대부나 매각 대상이 될 만한 일반재산이 어디에 얼마 규모로 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소나 재산명을 매핑하거나 같은 기관 기준으로만 연결하며, 주소를 지번·PNU로 바꾸면 국유·공유재산 토지 자료와 이어 볼 여지가 있다.
description_portal: 인천광역시 중구 소유의 공유재산 중 건물 현황(연번, 재산명, 소재지 주소, 연면적, 데이터 갱신일자 등의 내용)을 제공합니다. 현재 안천광역시 중구청에서 행정 목적으로 사용하고 있는 행정재산과, 행정 목적으로 사용되지 않고 있는 일반재산(매각 및 대부 검토 가능) 건축물이 모두 포함된 자료입니다. 인천광역시 중구청 소유 일반재산 대부 및 매각 문의에 대한 자세한 사항은 인천 중구청 재무과 재산관리팀(☎ 032-760-7202)으로 문의해주시기 바랍니다.(대부료율 및 대부료 산정은 사용 용도에 따라 다름)
