description_portal: 경상남도 거제시의 행정구역 구성을 연도별로 제공하는 데이터입니다. 본 데이터는 거제시의 총 면적(㎢), 전체 행정구역 대비 구성비(%)를 비롯하여, 읍·면·동의 개수와 행정단위별 세부 구성을 포함하고 있습니다. 통, 리(행정리 및 법정리), 반, 동(행정동·법정동) 등 최하위 행정구조까지 파악할 수 있도록 구성되어 있습니다. 각 항목은 특정 연도의 행정 체계 현황을 기준으로 하며, 출장소 유무도 포함되어 있습니다. 행정구역 변화나 지역 단위 행정업무 분석, 인구·면적 대비 행정단위 비교 등에 활용될 수 있습니다. 거제시의 행정 구조를 이해하고, 정책 수립 및 지역 개발에 필요한 기초 자료로 유용한 데이터입니다.
