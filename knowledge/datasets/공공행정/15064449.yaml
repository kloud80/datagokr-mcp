description_portal: '"서울특별시 금천구에서 발생하고 처리되는 각종 의안에 대한 기본 정보를 체계적이고 종합적으로 제공하는 데이터입니다. 주요 항목으로는 의안코드, 의안명, 등록일, 의안구분명, 소관위원회, 회기, 발의구분(의원·위원회·집행부), 철회 여부 등이 있으며, 회부·상정·심사·의결·본회의 처리 등 단계별 진행 이력과 각 단계별 처리일자, 이송일, 공포일, 공포번호까지 상세히 포함합니다. 이를 통해 의안의 생성부터 최종 처리까지의 경로와 현재 상태를 직관적으로 파악할 수 있으며, 의정 활동의 투명성을 높이는 데 기여합니다. 또한 관련 부서명, 참고자료와 첨부파일 존재 여부, 관계 법령·조례, 처리결과(가결·부결·보류 등), 담당자 연락처 등 다양한 메타데이터를 함께 제공하여 행정적 추적성과 자료 신뢰성을 강화하였습니다. 이 데이터는 의회 업무 담당자뿐만 아니라 시민, 연구자, 언론 등 다양한 이용자가 정책 분석과 의정 모니터링에 활용할 수 있도록 설계되었습니다.이용자는 기간·회기·위원회·발의자·의안구분별로 필터링하고, 등록일·처리일·진행단계 등으로 정렬하여 원하는 건을 신속히 찾을 수 있습니다. 의안별 상세 화면에서는 표결 결과 요약, 소요기간, 수정안 여부, 관련 회의록·의사일정 링크를 연계해 맥락을 이해하기 쉽고, 키워드 태그·주제 분류를 통해 유사 의안 묶음 조회가 가능합니다. 정책분석, 학술연구, 보도자료 작성, 시민 감시 활동에 바로 활용할 수 있으며, 회기별 처리율·위원회별 평균 체류일·가결/부결 비율 같은 지표 대시보드로 의정 활동의 성과와 병목을 진단할 수 있습니다."'
