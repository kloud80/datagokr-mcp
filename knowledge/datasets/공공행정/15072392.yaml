description_portal: (데이터 수집목적 및 과정) 경상남도 사회조사통계표(안전환경 평가)데이터는 2022년 기준 안전환경에 대한 평가를 조사한 데이터입니다.(데이터 구성 및 세부항목) 특성별 환경별 안전정도별 2022년의 안전환경에 대한 사회조사 통계표입니다.* 특성은 연령, 학력, 주택유형, 가구의월평균소득, 주거점유형태, 지역, 시군으로 구성합니다.* 환경은 자연재해, 건축물 및 시설물, 교통사고, 화재 등으로 구성합니다.* 안전정도는 매우안전, 비교적안전, 보통, 비교적불안, 매우불안으로 구성합니다.(데이터 현행화 시기) 해당 데이터는 통계DB로 자동갱신됩니다. 해당 링크로 접속하여 데이터를 조회 및 다운로드 할 수 있습니다.
