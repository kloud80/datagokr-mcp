summary_user: 지방자치단체별·회계연도별로 시책추진업무추진비의 기준액, 편성액, 비율을 담은 집계 데이터로, 포털 설명상 2016~2019회계연도의 기금 포함 전체회계 합산 금액을 전국 단위로 제공한다. 주민이나 분석가가 "우리 시·군·구의 단체장 시책추진업무추진비 편성액이 기준액 대비 얼마나 되나"를 비교하는 데 쓴다. 전역 조인 키는 없으며, 자치단체 코드(laf_cd)·자치단체명으로 같은 지방재정365의 다른 공시 데이터와 이어 쓴다.
description_portal: 지방자치단체의 시책추진업무추진비는 지방자치단체장이 주요 시책을 효과적으로 추진하기 위해 사용하는 예산 항목으로, 공식행사, 각종회의 대내외 협력활동 등을 수행하는데 필요한 업무추진경비입니다. 이는 일반업무추진비와 구분되며 지방자치단체장의 정책정 판단과 행정운영에 따라 집행됩니다.시책추진업무추진비 정보는 2016~2019회계연도가 제공되고 있으며, 대상회계는 기금을 포함한 자치단체 전체회계 합산금액 대상입니다. 세부 제공 항목으로는 자치단체별 기준액, 편성액, 시책추진업무추진비율 정보가 제공되고 있습니다.
