summary_user: 서울 강남구에서 지하수 개발·이용이 주변 지역에 미치는 영향을 조사하는 지하수영향조사기관의 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 목록으로, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표 등을 포함한다. 지하수 개발 사업자나 분석가가 강남구에서 현재 영업 중인 지하수영향조사기관이 어디이고 언제 인허가·폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, LOCALDATA 인허가 자료와 같은 원천을 공유한다.
description_portal: 서울시 강남구 지하수영향조사기관 인허가 정보(https://data.seoul.go.kr/dataList/OA-19174/S/1/datasetView.do)서울특별시 강남구의 지하수개발·이용이 주변지역에 미치는 영향을 분석 및 예측하는 영향성조사업무를 수행하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명(영업/정상,폐업), 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
