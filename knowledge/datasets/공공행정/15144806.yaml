description_portal: 경기도 수원시에 있는 다양한 공동체를 수집한 데이터입니다. 본 데이터에는 공동체명과  공동체의 사업내용이 포함되어 있습니다. 마을공동체 현황 목록을 이용하여 지역사회 활성화, 민간 협력 촉진 등 다양한 측면에서 활용할 수 있습니다. 주민들이 자신의 관심 분야에 맞는 공동체를 쉽게 찾을 수 있고, 이웃 간의 유대 강화, 고립 예방, 주민 자율 활동을 촉진할 수 있습니다. 또한 지역 특성에 맞는 맞춤형 정책을 수립하고, 주민 주도의 지속가능한 지역사회 구축을 위한 실천 사례를 살펴보고, 유사 사례 벤치마킹이나 정책 수립의 기초자료로도 활용 할 수 있습니다.
