description_portal: 광주광역시 국제광융합산업전시회 광융합 산업 분야별 참여기업 및 해외 참여국, 국가별 인원수 등에 대한 항목을 제공합니다.매년 김대중컨벤션센터에서 광융합 산업의 최신 기술과 시장 동향을 한자리에서 볼수 있으며, 광융합 8대 산업 분야는 광통신, 광조명, 광의료바이오, 광정밀, 광소재부품, 광영상정보, 광결상정보, 광에너지로  구분된다.전시회는 해외바이어 초청 수출상담회, 광융합기술 학술회의(컨퍼런스), 광융합산업 포럼 등으로 구성된다.해외바이어가 참여하는 수출상담회를 통한 기업 제품을 홍보 및 수출 성과에 기여하고, 관련 포럼을 통한 기업, 연구기관, 학계전문가들 참석을 통한 산업 생태계 활성화와 국제협력 방안 논의도 진행된다.
