summary_user: 서울시에 인허가된 동물약국을 사업장 한 곳씩 담은 인허가 원장으로, 인허가·취소·휴업·폐업·재개업 일자와 영업상태, 사업장명·전화·면적·지번/도로명 주소·좌표(X·Y)를 함께 담는다. 반려동물 보호자나 약국 창업 예정자가 우리 동네에 영업 중인 동물약국이 어디이고 최근 몇 곳이 폐업했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 출처인 LOCALDATA 인허가 자료와 묶어 상권·점포 이력 분석 원료로 쓴다.
description_portal: 서울시 동물약국 인허가 정보는 서울시에 인허가된 동물약국의 행정 이력과 사업장 현황을 파악할 수 있도록 구성된 공공데이터입니다. 이 데이터에는 인허가일자와 인허가취소일자, 폐업일자, 휴업 시작·종료일자, 재개업일자, 영업상태코드 및 영업상태명, 상세영업상태코드·명 등이 포함되어 있어 각 동물약국의 인허가 내역과 영업 상태 변동 이력을 시간의 흐름에 따라 확인할 수 있습니다. 또한 사업장명, 전화번호, 소재지면적, 지번주소와 도로명주소, 우편번호, 좌표정보(X·Y) 등을 통해 동물약국의 위치, 규모, 접근성, 연락처 등 기본적인 공간·연락 정보를 파악할 수 있습니다. 축산업무구분명, 축산물가공업구분명, 축산일련번호, 권리주체일련번호 등의 항목은 해당 사업장이 축산·축산물 관련 행정 체계 안에서 어떤 업무 유형으로 분류되는지와 권리 관계를 식별하는 데 활용되는 정보입니다. 총인원 항목은 동물약국에 근무하는 인력 규모를 나타내어 인력 운영 현황을 파악하는 데 활용될 수 있습니다. 아울러 최종수정일자, 데이터갱신구분, 데이터갱신일자 등의 항목을 통해 데이터의 최신성과 관리 이력을 확인할 수 있어, 이 인허가 정보는 서울시 내 동물약국의 분포, 규모, 영업 상태 및 인력 현황을 분석하고, 동물용 의약품 사용 관리, 동물 보건·방역 정책 및 관련 행정 지도·감독에 활용하기에 적합한 기초 자료입니다.
