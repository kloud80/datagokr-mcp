description_portal: 한국해양수산연수원의 영도본원 내 행정교육관에 위치한 주요 교육시설에 대한 목록입니다. 시설명, 위치, 주요 장비, 개설 교육과정을 표 형식으로 제공하며, GMDSS 훈련시스템, 시뮬레이터, CBT(컴퓨터 기반 교육) 장비 등 특화된 장비를 갖춘 시설이 포함되어 있습니다. 교육 대상은 해기사, 해양종사자, 승선자 등을 중심으로 하며, 실습 기반의 통신, 항해, 선박운항 교육이 중점적으로 운영되며 교육시설 인프라 현황 분석, 정책 수립, 교육 운영계획 수립 시 유용한 자료로 활용될 수 있으며 CSV 포맷으로 제공됩니다.* 교육예약시스템 홈페이지에 기재되어 있습니다.
