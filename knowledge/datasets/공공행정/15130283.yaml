description_portal: '[SGIS 오픈 플랫폼] "일자리 맵" 서비스의 사용자별 맞춤형 서비스를 위한 정보입니다.사용자별 관심분류(기업형태, 모집직종, 고용형태, 학력, 경력, 산업분류 등) 정보가 포함되어 있습니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 일자리맵  고용24와 인크루트와 사람인에서 수집된 구인정보를 이용하여 오늘의구인현황, 일자리보기, 구인현황분석 등 사용자 조건에 맞는 일자리정보 및 현황을 제공하는 서비스'
