description_portal: '이 데이터는 광주광역시 서구에서 제공하는 자연적 인구 변동 및 가족구성 변화 현황을 연도별로 정리한 통계자료로, 수치의 단위는 출생자 수·사망자 수: 명 / 혼인·이혼 건수: 건입니다. 주요 항목은 ▲출생자 수(명), ▲사망자 수(명), ▲혼인 건수(건), ▲이혼 건수(건)로 구성되어 있으며, 주민등록 기준으로 수집됩니다.해당 자료는 서구 지역의 출산율·사망률 변화, 가족 해체 및 형성 비율, 인구 고령화 속도 등을 종합적으로 파악할 수 있는 기초 통계로 활용되며, ▲고령화 대응 정책 수립, ▲출산 장려 정책 기획, ▲보건의료 인프라 확충, ▲가족복지 강화 등 다양한 행정 목적에 기초자료로 사용됩니다.또한 혼인·이혼 추세를 통해 사회적 안정성, 세대 간 가치관 변화, 청년층 인구 유출입과 관련된 지역 특성을 진단할 수 있으며, 청년·고령층을 대상으로 한 맞춤형 복지정책 수립이나 시민참여형 통계 서비스 개발, 학술연구에도 유용한 자료로 평가됩니다.'
