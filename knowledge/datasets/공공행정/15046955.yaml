description_portal: '○ 통계개요* 통계명 : 세대원수별 세대수(동별)* 통계종류 : 서울시 세대수를 행정동별로 제공하는 일반·보고통계* 근거법령 :「주민등록법」에 따른 주민등록표에 등록된 세대* 작성목적 : 지역별 인구 및 세대의 변동상황 및 연령구조를 파악하여 각 지방행정기관의 제반 행정사항의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 시·도 → 행정안전부* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시 및 자치구, 행정동내용 - 서울시 행정동별 세대원수별 세대수○ 기타* 주민등록인구현황의 통계결과는 신고에 따른 것으로 실제 거주형태와차이가 있을 수 있음* 행정동별 현황은 2013년 11월 부터 공표, 2013년 10월 이전 자료 없음* 외국인 세대 및 외국인 제외* 송파구 위례동 신설(2015.07)'
