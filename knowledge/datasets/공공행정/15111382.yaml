summary_user: 선거별로 후보자와 예비후보자의 사퇴·사망·등록무효 현황을 후보자 한 명 단위로 담으며, 정당·기호·성명·생년월일과 함께 해당 일자와 사유를 제공하고 범위는 전국 시도 단위입니다. 유권자나 언론·선거 분석가가 '이번 선거에서 어느 선거구 후보가 언제, 무슨 사유로 사퇴하거나 등록무효가 됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어 선거ID(sgId)·선거유형코드로 같은 기관의 선거코드·후보자 데이터와 묶고, 그 밖에는 시도명·선거구명·성명 같은 이름으로 맞춰 잇는다.
description_portal: 후보자 사퇴/사망/등록무효 현황은 후보자 등록이 무효된 사유 정보를 제공합니다.(선거ID와 선거종류코드, 선거구명, 시도명을 입력하여 (예비)후보자 사퇴/사망/등록무효 현황 정보를 조회할 수 있는 서비스)※ 확인사항 · 예비후보자 등록무효 현황은 후보자등록 개시일부터 조회되지 않음 · 2014년 이후 실시한 선거부터 등록무효인 경우에만 제공
