summary_user: '함평군 1개 읍·8개 면(함평읍·손불면·신광면·엄다면·학교면·대동면·나산면·해보면·월야면)별 면적(㎢)과 행정리 수·반 수를 읍면 단위로 집계한 작은 파일(csv, 233바이트)이다. 함평군 읍면별 면적 대비 행정리·반 규모를 비교해 행정리 통폐합이나 공공서비스 배치를 검토하려는 행정·연구 담당자가 쓴다. 전역 조인 키나 코드 컬럼이 없어, 다른 자료와는 읍면명 이름 매칭으로만 잇는다(예: 읍면별 주민등록 인구와 붙여 인구밀도 계산).'
description_portal: 전라남도 함평군은 지역 행정계획 수립과 효율적인 행정구역 관리를 위해 군 관내 행정구역 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평읍, 손불면, 신광면, 엄다면, 학교면, 대동면, 나산면, 해보면, 월야면 등 1개 읍과 8개 면에 대한 행정정보를 포함하고 있으며, 각 행정구역별 면적(㎢)과 행정리 수(법정리 기준) 등의 항목으로 구성되어 있습니다. 해당 데이터는 지역별 인구밀도 분석, 행정리 통폐합 검토, 공공서비스 배치 계획 수립, 지역개발계획 수립 등에 활용될 수 있으며, 행정구역 단위별 통계 분석, 공간정보 시스템 구축, 정책 대상지역 선정 등 다양한 행정 및 연구 분야에서 실질적인 활용이 가능한 핵심 공공자원입니다.
