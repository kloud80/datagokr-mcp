description_portal: '이 데이터는 광주광역시 서구에서 주민을 대상으로 실시한 정보화 교육의 이수 현황을 기록한 것으로, 2016년부터 2021년까지의 연도별 교육 이수 통계를 포함합니다. 주요 내용은 컴퓨터 기초, 한글, 파워포인트, 스마트폰 활용, 인터넷 관련(쇼핑, 카페, 활용), SNS 및 OA 마스터 과정 등 정보화 역량 강화를 위한 다양한 교육 과정의 수강 내역입니다.각 항목별로는 교육 과정명, 과정별 수강 인원, 과정 분류(예: 초급/중급), 최대 수강 인원, 수강 연령대 등 교육 참여자의 세부 현황이 담겨 있으며, 이를 통해 정보격차 해소 노력의 구체적인 실행 현황을 확인할 수 있습니다. 해당 데이터는 행정통계자료로서, 주민 대상 평생교육, 디지털 역량 강화, 교육정책 기초자료, 향후 정보화 교육 기획 등 지방자치단체의 정책 수립과 성과 분석에 활용됩니다.또한, 정보는 연도별로 구분되어 있어 추세 분석 및 연령별·과정별 수요 예측, 향후 맞춤형 교육 기획 및 대상자 발굴에 효과적으로 사용될 수 있습니다.'
