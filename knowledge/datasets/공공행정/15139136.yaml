description_portal: 경기도 양평군이 소유하고 있는 공유지 현황 데이터로 소유구분, 소유기관, 소재지, 취득일자, 토지지목, 실면적의 데이터를 제공합니다.공유지 현황은 지방자치단체나 공공기관이 보유하고 있는 공용 토지·건물·시설 등 재산의 종류와 상태를 정리한 자료입니다. 주요 내용으로는 공유지의 유형, 보유 면적 및 규모, 용도와 목적, 관리 책임 부서 등이 포함됩니다. 또한 공유지의 이용 현황(임대, 사용, 대부 등)과 임대료 또는 수입도 기록되어 재정적 가치와 활용도를 파악할 수 있습니다. 법적 제약이나 개발 제한 사항도 함께 확인하며, 이를 통해 무단 사용이나 관리 소홀을 방지합니다. 공유지 현황은 향후 효율적인 활용 계획, 개발·보존 정책, 그리고 재정 수입 증대 방안 수립의 기초 자료로 활용되며, 투명한 관리와 공공 책임성을 확보하는 데 중요한 역할을 합니다.
