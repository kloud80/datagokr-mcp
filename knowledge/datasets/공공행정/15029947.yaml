summary_user: 성남시의회 소속 시의원을 한 명당 한 행으로 정리한 명단 파일로, 이름·소속 정당·선거구와 담당 구역·소속 위원회·전화번호·사진 주소·데이터 기준일을 담는다(CSV 약 7KB). 시민이 우리 동네를 맡은 시의원이 누구이고 어느 정당과 위원회에 속하는지 확인하거나, 분석가가 성남시의회의 정당별·위원회별 구성을 살펴보는 데 쓴다. 전역 조인 키가 없어 선거구 이름이나 담당 구역(행정동) 이름으로 선거 결과·행정동 자료와 맞춰 잇거나, 같은 성남시 기관 자료와 이름으로만 연결한다.
description_portal: 성남시 시의원 현황 자료는 성남시의회에 소속된 시의원들의 정보를 정리한 자료입니다. 시원의 이름, 소속 정당, 선거구, 담당 행정동, 소속 위원회, 연락처, 사진등의 항목으로 구성되 있습니다. 해당 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다.해당자료는 정책 분석 등 다양한 분야에서 활용될 수 있으며, 성남시 의정 활동을 파악하는데 중요한 기반이 됩니다.또한, 성남시의회 공식 홈페이지에서 의원별 프로필과 의정활동, 회의록등을 추가로 확인 할 수 있습니다.
