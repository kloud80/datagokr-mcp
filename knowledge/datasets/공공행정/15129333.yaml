summary_user: 경기도가 여는 데이터분석 경진대회를 대회 한 건당 한 행으로 담은 운영 원장으로, 대회번호·대회명·구분, 대회 기간과 신청 기간, 진행 상태, 정원(fnop_cnt)과 신청자 수를 포함하며 범위는 경기도 단위의 비공간 자료다. 분석가나 도 담당자가 연도별로 대회가 언제 얼마나 열렸고 정원 대비 신청자가 얼마나 몰렸는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대회명이나 같은 기관(경기도) 기준으로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도에서 개최하는 데이터분석 경진대회 기본 정보를 정리한 자료입니다. 주요 항목에는 경진대회번호, 경진대회명, 경진대회구분코드, 경진대회 시작일자 및 종료일자, 신청 시작일자 및 종료일자 등이 포함됩니다. 이를 통해 연도별 대회의 개최 현황, 모집 기간, 운영 방식 등을 확인할 수 있습니다. 데이터는 경기도의 공공데이터 활용을 촉진하고, 경진대회의 운영 성과를 분석하는 데 활용할 수 있습니다. 또한 신청자 수와 정원 비교를 통해 대회 참여 수요를 파악하거나, 연도별 만족도 조사 결과와 연계하여 행정 서비스 개선 방향을 모색하는 데 유용합니다.
