description_portal: 국가통계포털시스템*의 통계표 조회 서비스 이용중 시점, 분류 선택 등에 따라 데이터 양이 2만셀이 넘는 경우 실시간 조회 서비스 제공이 불가하여 대용량통계표 파일을 다운로드할 수 있는 서비스를 지원하고 있습니다.이 때 생성된 대용량통계표에 관한 구성정보(기관명,통계표(ID),설명,최종수정일)에 대한 정보를  CSV 파일로 제공합니다.* 국가통계포털시스템(KOSIS, Korean Statistical Information Service)은 통계청에서 운영하는 국가통계 종합 포털입니다.  국가통계포털은 대한민국의 공식 통계 허브로, 국민 누구나 국가승인통계를 손쉽게 검색·활용할 수 있는 공식 통계 데이터 플랫폼입니다.※ 통계표ID는 파일데이터(통계청_통계표 정보) 참조하시기 바랍니다.
