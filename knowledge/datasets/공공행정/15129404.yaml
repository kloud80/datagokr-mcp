summary_user: 경기도 데이터분석시스템에서 분석 데이터셋을 분류하는 유형 코드와 유형명, 등록·수정 이력(등록자·등록일시·수정자·수정일시)을 코드 한 건당 한 행으로 담은 코드표 메타데이터다. 경기도 데이터분석시스템의 데이터셋 목록을 다루는 분석가나 개발자가 '이 분류 코드는 어떤 유형을 뜻하는가'를 확인하고 코드를 사람이 읽는 이름으로 바꿀 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관(경기도 데이터분석시스템)의 데이터셋 목록에 있는 분류 유형 코드(ds_class_type_cd)나 유형명으로 맞춰 붙이는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 사용되는 분석 데이터셋 분류 유형 코드를 정의한 메타데이터입니다. 주요 항목으로는 번호, 데이터셋분류유형코드, 데이터셋분류유형명, 등록자ID, 등록일시, 수정자ID, 수정일시가 포함됩니다. 이 데이터는 데이터셋의 분류 체계를 식별하고, 코드 기반으로 다른 데이터셋과 연계할 수 있도록 지원합니다. 활용 방안으로는 행정기관의 데이터 관리 체계화, 연구기관의 주제별 데이터 접근 용이화, 민간의 데이터 서비스 개발을 위한 코드 매핑 등이 있습니다.
