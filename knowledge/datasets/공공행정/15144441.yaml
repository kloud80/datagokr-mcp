description_portal: 진주시는 관내 행정동별 빈집 현황을 파악하여 데이터를 제공합니다. 주요 항목은 주택유형, 건축년도, 용도지역, 건축물대장 주구조, 연면적, 판정결과, 관리주체 등이며, 해당 데이터는 도시재생사업, 노후 주거지 정비, 주택공급 정책 수립 등에 활용됩니다. 또한 빈집의 분포 특성 분석을 통해 방범 및 안전관리 대책 수립, 인근 지역의 기반시설 정비, 주민 생활환경 개선 등의 행정 계획에도 활용되며, 타 부서 및 유관기관과의 협업 자료로도 제공되어 다각적인 정책 개발의 기초자료로 기능합니다. 나아가 빈집 실태조사를 기반으로 현장 점검 및 정비 우선순위를 설정하고, 공공임대주택 활용 가능성 검토나 민간 활용 연계 방안 수립에도 기여합니다.
