description_portal: '본 데이터는 공공데이터를 실제로 활용하고 있는 기업들을 대상으로 수집한 실태조사 결과로, 공공데이터 활용 현황 및 성과, 만족도, 추가 수요 등을 체계적으로 수록하고 있습니다. 기업이 현재 활용 중인 공공데이터 분야(예: 산업·경제, 행정, 복지 등), 데이터의 정확성·적시성·접근성 등 만족도 평가, 활용을 통해 달성한 성과(비용 절감, 매출 증대, 신규 서비스 개발 등), 그리고 향후 개방을 희망하는 데이터 분야 등의 항목으로 구성되어 있습니다. 이 데이터는 공공데이터의 민간 파급 효과 분석, 정책 성과평가, 수요 기반 개방 전략 수립에 활용됩니다. 시계열 비교를 통해 공공데이터의 민간 활용도 증대 여부도 파악 가능합니다.'
