summary_user: 경기도 데이터분석 포털(data.gg.go.kr)의 분석갤러리 게시물 목록으로, 게시물 한 건마다 제목·링크주소·이미지 정보·노출 여부·노출수·작성/수정 일시를 담는 운영 메타데이터입니다. 유기동물 보호시설, 소비 매출, 코로나19 발생 현황, 장애인 복지지원처럼 경기도가 어떤 주제를 시각화해 공개했는지 찾거나 많이 본 분석 자료를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 게시물 제목의 주제어로 이름을 맞추거나 같은 기관 자료끼리만 연결합니다.
description_portal: 이 데이터는 행정 분야에서 수집된 다양한 사회·경제·환경 관련 현황을 시각화한 자료로, 도민 생활과 밀접한 공공 데이터를 분석 갤러리 형태로 제공합니다. 주요 항목으로는 게시물번호, 게시물제목, 링크주소, 노출여부, 이미지설명, 이미지명, 이미지변환명, 노출수, 생성자아이디, 생성일시, 수정자아이디, 수정일시 등이 있으며, 이를 통해 데이터의 출처 및 시각화 자료를 확인할 수 있습니다. 콘텐츠에는 유기동물 보호시설, 소비 매출, 코로나19 방역 및 발생 현황, 장애인 복지지원 등 다양한 주제가 포함됩니다.
