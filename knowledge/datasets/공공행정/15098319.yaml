description_portal: '공정거래위원회 소비자 민원 학습데이터는 소비자들이 공정거래위원회에 제기한 민원에 대한 정보를 담고 있는 데이터셋입니다. 이 데이터는 주로 소비자 상담 내용, 분쟁 유형, 법령 정보 등을 포함하며, 소비자 정책 및 관련 서비스 개선을 위한 학습 자료로 활용됩니다. 이 데이터는 소비자 민원 에 대한 데이터 중에서 피신청인(사업자)가 자체적으로 민원을 해결한 사업자 정보를 보여주는 데이터 입니다. 이 데이터는 상호명, 주소를 포함하고있습니다.보유근거 : 소비자기본법 제16조, 제28조, 제35조, 제53조부터 제55조, 제57조 및 동법 시행령 제3조'
