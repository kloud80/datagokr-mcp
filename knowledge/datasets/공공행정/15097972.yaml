summary_user: 전국 읍면동(행정동)별로 성별·연령별 주민등록 인구를 집계해 담은 파일 데이터로, 검증 시 3,619행이 2026-08-31 기준 한 시점으로 들어 있다. 지역 분석가나 지자체 담당자가 특정 동네의 연령대별 남녀 인구 구성이 어떤지 확인하는 데 쓴다. 행정기관코드와 시도·시군구·읍면동명 필드로 같은 기관의 다른 주민등록 인구·세대 자료와 이어 쓰며, 전역 조인 키는 없어 다른 기관 자료와는 이름·코드 매핑이 필요하다.
description_portal: 행정동(읍면동)별 성별 연령별 주민등록 인구에 대한 데이터로, 행정동은 주민들이 거주하는 지역을 행정 능률과 주민 편의를 위하여 구분한 행정구역 단위를 말합니다.주민등록 인구 및 세대 등 을 기반으로 선거, 교육, 조세, 복지, 교통, 지역 개발 등 다양한 분야에 적시성 있는 통계를 제공하고 있습니다. 이러한 통계는 국가 행정 및 정책 수립에 필요한 기초 자료로 활용되고 있습니다.주민등록 인구통계는 행정안전부 주민등록 인구통계 홈페이지(https://jumin.mois.go.kr), 공공데이터포털(https://data.go.kr), 국가통계포털(KOSIS) 등에서 확인 및 다운로드가 가능합니다.
