description_portal: 본 데이터는 제9대 안동시의회의 의정활동을 생생하게 확인할 수 있는 "안동시의회 영상회의록 목록"입니다.2024년 2월(제245회)부터 2026년 4월(제265회)까지 개최된 본회의를 비롯해 상임위원회(의회운영·문화복지·경제도시), 각종 특별위원회(예산결산·산불피해대책 등)의 상세 회의 이력을 담고 있습니다.데이터 항목은 대수, 회수, 차수, 회의명, 일자, 영상회의록 URL로 구성되어 있으며, 제공된 URL을 통해 해당 회의 영상을 즉시 시청할 수 있습니다. 안동시의회의 정책 결정 및 예산 심의 과정을 투명하게 공개하여 시민의 알 권리를 보장하고, 의정 모니터링 및 지역 사회 연구를 위한 기초 공공데이터로 유용하게 활용할 수 있습니다.
