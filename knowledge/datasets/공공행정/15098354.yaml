description_portal: 공정거래위원회의 소비자 민원학습에 대한 데이터로, 소비자 민원 상담중 사업자(피신청인) 자율적으로 민원을 해결한 상담 데이터 입니다. 공정거래위원회의 소비자 민원 학습 데이터는 소비자 민원 상담 내역을 담고 있으며, 다양한 유형의 데이터를 포함하고 있습니다. 상담 내역은 주로 한국소비자원에서 상담한 의료, 금융, 자동차 관련 상담 데이터와 온라인 상거래 관련 상담 데이터, 그리고 지역별, 기관별 상담 데이터 등으로 구성됩니다. 또한, 위해위험 관련 정보나 소비자 피해 관련 상담 내역 및 민원 내용도 포함하고 있습니다. 이 데이터는 사건제목, 사건내용을 포함하고 있습니다.
