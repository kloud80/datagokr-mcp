description_portal: 금년에 결정하는 최저임금을 내년에 적용할 때 최저임금 이상을 지급하기 위해 임금 인상이 되어야 할 근로자 수의 비율을 예측치로 제공동일한 시계열 간 자료비교를 위해 경제활동인구부가조사 기준 2003년 이후, 고용형태별근로실태조사는 2009년 이후 자료임.최저임금 영향률은 금년에 결정된 최저임금이 내년에 적용될 때, 최저임금 이상을 지급하기 위해 임금 인상이 되어야 할 근로자 수(내년 최저임금에 영향받을 근로자 수)의 비율에 대한 예측치전년도 임금분포와 당해 명목임금상승률을 통해 내년 임금분포를 추정하여 산출원자료에 따라 두 가지 값(고용형태별근로실태조사, 경제활동인구부가조사)으로 산출하여 심의에 활용함두 조사 모두 최저임금 분석을 목적으로 하는 조사가 아니므로 근로자의 시급 산출, 최저임금 적용제외자·감액적용자의 식별 등의 정확한 분석에 한계가 있음
