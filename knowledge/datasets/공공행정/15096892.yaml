description_portal: '"제주특별자치도 내 맞벌이 가구 현황 데이터를 제공합니다.항목: 연도, 시도, 유배우가구(천가구), 맞벌이가구(천가구), 맞벌이가구(비율) 등* 제주특별자치도의 유배우 가구(배우자가 있는 가구) 수와 그중 맞벌이 가구의 규모, 그리고 전체 유배우 가구 대비 맞벌이 가구가 차지하는 비율을 연도별로 제공하는 통계자료입니다. 자료의 단위는 “천 가구”로 표기되며, 맞벌이 가구의 비율은 퍼센트(%)로 제시되어 있어 수치 비교가 용이합니다. 이 자료를 통해 특정 시기별로 맞벌이 가구 비율이 증가하거나 감소하는 추세를 확인할 수 있으며, 사회·경제적 변화가 가정의 노동 형태에 미친 영향을 분석하는 데 중요한 근거 자료가 됩니다.* 활용 분야 : 가족 정책 및 돌봄 제도 설계, 가구 소득 및 소비 패턴 분석, 여성 고용 및 노동시장 참여 연구 등"'
