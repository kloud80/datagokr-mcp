description_portal: '1. 목록명: 인천광역시_민간개방 화장실 현황2. 키워드: 위생, 공중시설, 개방화장실, 공중화장실, 위생안전, 민간개방인천광역시 관내 민간개방화장실 현황에 대한 데이터(시설명,관할 행정구역, 소재지, 설치연월)를 제공하고 있습니다. 지역내 민간에서 운영중인 공공화장실 중 개방화장실로 지정되어있는 화장실의 현황을 제공하며, 연 1회 업데이트 되는 자료입니다.업데이트 날짜를 기준으로 지정되어있는 민간개방 공중화장실 현황을 공개합니다.파일내 항목별 내용은 붙임 파일을 참고해주시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석전용 소프트웨어를 이용해주시기 바랍니다.민간개방 공중화장실의 시설명, 소재지, 설치연월에 대한 데이터를 제공합니다.'
