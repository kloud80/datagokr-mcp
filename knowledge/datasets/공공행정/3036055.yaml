description_portal: '- 전라남도 가축시장현황 데이터를 통해 조합명, 소재지, 거래일, 거래방법, 시설 등에 관한 정보를 확인하실 수 있습니다.- 전라남도에는 총 15개의 가축시장이 있으며, 최근 구제역 발생으로 인해 일부 시장이 폐쇄되었던 상황이 있었습니다. 그러나 2025년 4월 28일부터 순차적으로 재개장되었습니다.- 거래 품목 : 소, 돼지, 닭, 오리 등 다양한 가축이 거래됩니다.- 운영 시간 : 각 시장의 운영 시간은 시군별로 상이하므로, 방문 전 해당 시장의 운영 시간을 확인하시기 바랍니다.- 방역 수칙 준수 : 방역 조치에 따라 방문 시 개인 위생 관리와 방역 수칙을 철저히 준수해 주시기 바랍니다.'
