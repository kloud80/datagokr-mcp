summary_user: 서울시 관광유흥음식점업(관광식당) 업소를 한 건씩 담은 인허가 원장으로, 업소명·지번/도로명 주소·인허가일과 취소일·영업상태·폐업일과 위치 좌표(X·Y)를 담는다. 관광 안내 지도 제작자나 상권·야간경제 분석가가 '어느 자치구에 영업 중인 관광식당이 몇 곳이고 언제 문을 열고 닫았는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드·관리번호)로 잇고, 같은 원천을 쓰는 LOCALDATA 인허가 자료와 대조한다.
description_portal: 'ㅇ 개요: 서울시의 관광유흥음식점업 인허가 현황을 정리한 자료입니다. 관광객 이용에 적합한 전통 분위기의 시설을 갖추고, 음식 제공과 함께 노래와 춤을 감상하거나 참여할 수 있는 공간을 제공하는 업소의 행정 정보를 담습니다. 업종의 성격과 규제 목적을 반영하여 인허가 기반의 공적 기록으로 구성됩니다.ㅇ 활용 목적: 지역별 업소 분포 파악, 인허가 절차 및 변동 모니터링, 관광 환경 분석, 야간 경제와 문화 소비 연구, 민원 대응 및 안전 관리 정책 수립 등 공공 행정과 정책 평가에 폭넓게 활용할 수 있습니다.ㅇ 수록 내용: 업소명, 소재지 주소, 업종 구분, 인허가 구분과 상태, 관할 기관 등 기본 행정 항목과 입지 좌표가 포함됩니다. 좌표는 중부원점 티엠 좌표계 기준으로 제공되며, 위경도 좌표는 제공되지 않습니다.ㅇ 품질·유의사항: 인허가 변동에 따른 최신성 확인이 필요하며, 좌표 변환 시 투영 좌표 체계에 대한 이해가 요구됩니다. 업소 특성상 청소년 보호, 소음 관리, 영업 질서 등 관련 제도 해석과 이용 목적의 적합성을 함께 검토하는 것이 바람직합니다.ㅇ 활용 예시: 관광 안내 지도 제작, 업종 정책 효과 분석, 도시 야간 활력 지표 구축, 상권 지원 서비스 연계, 민관 협력 기반의 지역 문화 생태 평가 등에 적용할 수 있습니다.'
