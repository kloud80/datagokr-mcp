status: active
summary_user: 한국저작권위원회에 등록된 저작물(포털 설명상 약 78만 건)을 등록 건별로 담으며, 통합 검색과 개별 저작물 상세 조회 두 오퍼레이션으로 등록번호·저작물 제목·저작자·저작물 분류·등록일자·등록사유·등록권리자를 돌려준다. 콘텐츠를 쓰려는 사업자나 창작자가 '이 저작물이 등록돼 있고 권리자가 누구인가'를 확인해 이용 허락 대상과 분쟁 소지를 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 저작자명·저작물 제목 같은 이름 매칭으로만 잇고, 등록번호(REG_ID)는 통합 검색 결과에서 상세 조회로 넘어가는 내부 키로 쓴다.
limits: 다른 기관 데이터와 공통으로 쓰는 조인 키가 없어 이름 매칭에 따른 동명이인·제목 중복 오류에 주의해야 한다. 전국 단위 비공간 자료라 지역별·좌표 기반 분석에는 쓰지 못한다. 개발계정은 일 10,000회 호출 한도가 있다.
