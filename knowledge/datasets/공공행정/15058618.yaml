summary_user: 전국 지방자치단체의 청사 신축사업을 사업 단위로 담은 지방재정365 공시 데이터로, 회계연도·광역/기초 자치단체·사업명·청사 유형과 함께 신축 관련 금액 항목들을 담는다. 주민이나 분석가가 "우리 시·군·구가 새 청사를 짓는 데 얼마를 들였고 다른 지자체와 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 자치단체 코드(laf_cd)와 회계연도로 같은 지방재정365 계열 공시(세출·재정지표 등)와 연결한다.
description_portal: 청사신축원가회계정보는 지방자치단체가 청사를 새로 건축할 때 발생하는 원가와 관련된 회계 정보를 의미합니다.이는 청사 건축에 소요된 총 비용, 자재비, 인건비, 설계 및 시공비, 부대비용 등을 포함한 세부적인 비용 항목을 포함합니다.청사신축원가회계정보는 건축 프로젝트의 예산 관리와 비용 추적을 위한 중요한 자료로, 자치단체가 예산을 효율적으로 운영하고 공공 자금을 관리하는데 중요한 역할을 합니다.또한, 이러한 정보는 추후 청사 운영 및 유지보수에 필요한 재정 계획을 수립하는데도 활용됩니다.
