summary_user: 지방자치단체별 세입예산을 회계연도 단위로 집계해 세입총계와 일반회계·기타특별회계·공기업특별회계·기금 등 회계별 세입액을 담으며, 포털 설명상 2012회계연도부터 전국 자치단체를 대상으로 한다. 분석가나 주민이 "우리 시·군·구의 올해 세입예산은 얼마이고 어느 회계에 얼마가 잡혔나"를 확인하거나 자치단체 간 세입 규모를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 지방재정365의 세출예산 등 다른 자료와는 회계연도(fyr)와 자치단체 코드(laf_cd)·자치단체명을 맞춰 연결한다.
description_portal: 지방자치단체의 세입예산은 특정 회계연도에 예상되는 모든 현금 수입을 의미하며 일반적으로 조세 수입이 가장 큰 부분을 차지하며, 공채, 국유재산 매각, 정부 기업의 수익등도 포함합니다. 세입은 세출의 재원이 되며, 이를 바탕으로 예산이 편성됩니다. 이 자료는 자치단체별 세입예산을 분석한 자료입니다.세입예산 정보는 2012회계연도부터 제공되며 대상회계는 일반회계, 기타특별회계, 공기업특별회계, 기금입니다. 제공되는 세부항목은 자치단체별 세입총계, 일반회계 등 회계별 세입액 항목입니다.
