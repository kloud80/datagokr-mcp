summary_user: 지방자치단체별·회계연도별로 일반회계 예산총액 대비 예비비 편성 비율(rate)을 집계한 지표로, 포털 설명상 2008 회계연도부터 전국 자치단체를 다룬다. 분석가나 주민이 "우리 시·군·구는 예산 중 예비비를 얼마나 잡아두었고, 법정 한도인 1% 이내인가"를 확인하거나 자치단체끼리 비교할 때 쓴다. 회계연도(fyr)와 자치단체 코드·이름(laf_cd·laf_hg_nm, 상위 자치단체 wa_laf_cd)이 있지만 전역 조인 키는 확인되지 않았으므로, 지방재정365의 다른 공시 지표와는 같은 기관 코드나 자치단체명 매핑으로 연결한다.
description_portal: 지방자치단체의 예비비는 특정 회계연도에 예상하지 못한 지출에 대비하여 편성된 예산 항목으로 예측할 수 없는 지출이나 예산 초과 지출에 대응하기 위해 편성 됩니다. 지방재정법 제43조에 명시되어 있으며 일반회계와 교육비 특별회계의 예비비는 각 예산총액의 1% 이내로 편성 되어야 하며 특별회계도 동일한 규정이 적용됩니다. 재해 및 재난 관련 예비비는 별도로 편성할 수 있습니다. 이 자료는 일반회계 기준으로 예산총액 대비 예비비 편성 비율을 분석하여 제공하며, 2008 회계연도 자료부터 제공됩니다.
