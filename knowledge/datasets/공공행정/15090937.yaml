description_portal: '강원도 원주시청 홈페이지에 등록된 시청 홍보영상(예: ‘미리 만나보는 소금산 케이블카 탑승장’)과 해당 영상의 조회수 정보를 제공합니다. 이 데이터는 원주시가 시민에게 제공하는 주요 시정 소식, 관광지 소개, 정책 홍보 콘텐츠 등의 이용 현황을 파악하기 위해 구축된 자료입니다. 각 영상별 제목, 게시일, 조회수와 같은 기본 정보를 기반으로 시민 관심도 변화 분석, 홍보 콘텐츠 효과 측정, 주요 정책·관광 홍보 전략 수립 등에 활용될 수 있습니다. 또한 온라인 홍보 채널 운영 효율성을 평가하거나 공공 미디어 콘텐츠 기획 및 제작 방향을 설정하는 데 도움을 주는 중요한 기초자료로도 활용 가능합니다.'
