summary_user: 법정동·행정동의 통반 단위로 통계년월별 총인구와 남녀·10세 구간별 주민등록 인구수를 담은 집계 API이며, 범위는 전국 읍면동이다. 지역 분석가나 창업 준비자가 특정 동네의 연령대별 남녀 인구 구성을 월별로 비교하는 질문에 쓴다. 법정동코드(stdgCd, 조인 키 bjd_cd)로 다른 법정동 기준 데이터와 이어 쓰고, 행정기관코드(admmCd)로 행정동 단위 자료와 맞춘다.
limits: 집계 인구수만 담고 개인·세대 단위 원천 정보는 없다. 검증 호출에서 수신된 건수는 23행이라, 전체 규모와 최신 통계년월은 호출 조건에 따라 달라 보일 수 있으니 통계년월을 지정해 확인해야 한다.
