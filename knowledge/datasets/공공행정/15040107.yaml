description_portal: 본 데이터는 문경시에서 처리한 민원에 대해 민원인을 대상으로 실시한 만족도 조사 결과를 정리한 자료입니다. 본 조사는 민원 서비스 전반에 대한 시민의 체감 수준을 파악하고, 행정서비스 품질 개선을 위한 기초 자료로 활용하고자 구축되었습니다 조사 결과는 부서별로 구분하여 제공되며, 각 부서별 조사 참여 인원을 표본수로 산정하였습니다. 민원 만족도 평가는 고객만족도, 신속성, 친절성, 전문성, 공정성, 청렴성 등 주요 항목으로 구성하였고, 각 항목은 민원인의 응답을 바탕으로 100점을 만점으로 환산하여 산출하였습니다. 또한 세부 평가 항목을 종합한 종합 만족도 점수를 함께 제공하고 있습니다. 아울러 직전 조사 결과와 비교한 점수의 변화는 증감도로 표시하여 민원 서비스 수준의 변화를 확인할 수 있도록 하였으며, 데이터기준일을 명시하여 조사 결과의 기준 시점을 명확히 하였습니다. 본 데이터는 문경시 민원 행정 서비스의 객관적 분석과 시민 중심 행정 구현을 위한 자료로 활용될 수 있습니다.
