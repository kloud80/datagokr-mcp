summary_user: 법제처 국가법령정보센터의 국토교통부 소관 법령(국토계획법·건축법·주택법·도로법 등) 해석 사례를 해석 건별 목록으로 담으며, 안건명·안건번호·질의기관·해석기관·해석일자와 상세 본문 링크를 포함한다. 지자체 담당자나 건축·개발 사업자가 '이 용도변경·인허가 쟁점에 대해 국토교통부가 예전에 어떻게 해석했나'를 찾을 때 쓴다. 전역 조인 키는 없고, 법령해석일련번호나 상세링크로 같은 기관의 해석 본문 조회와 잇거나 질의기관명·기관코드를 이름 매핑해 다른 데이터와 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 국토교통부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 국토의 계획 및 이용에 관한 법률, 건축법, 주택법, 도로법 등 국토교통부 관련 법령에 대한 해석 요청 목록을 제공하며, 각 사례는 실제 행정 현장에서 제기된 법적 쟁점에 대한 질의 내용을 포함합니다. 데이터 항목에는 해석 일련번호, 안건명, 질의 기관명, 접수일자, 해석일자, 회신 여부, 처리 상태 등이 포함되어 있어 법령 해석 요청의 진행 상황을 종합적으로 파악할 수 있습니다. 목록을 통해 사용자는 개별 법령 해석 사례의 본문으로 연결되며, 각 항목은 구체적인 질의 배경과 법리 검토 내용을 바탕으로 구성됩니다. 본 데이터는 법령 해석의 체계적 관리와 동일·유사 사안에 대한 일관된 법적 판단을 지원하기 위해 설계되었습니다.
