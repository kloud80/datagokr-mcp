description_portal: 이 데이터는 전북특별자치도 내 각 시군에서 진행된 지적재조사사업 현황을 정리한 자료입니다. 지구별로 위치, 필지 수, 총 면적(㎡) 정보를 포함하고 있으며, 토지 경계의 정확성 확보와 토지이용의 효율성 증진을 위한 기초 자료로 활용됩니다. 지적재조사사업은 오래된 종이 지적도를 디지털 지적도로 전환하고, 실제 토지 현황과 불일치하는 지적정보를 정비하는 사업으로, 토지분쟁 해소와 국토의 효율적 관리에 기여합니다. 본 데이터는 행정구역별 사업 규모 비교, 면적 및 필지 수 분석, 도시화 진행 현황 등을 파악하는 데 활용하실 수 있습니다.
