description_portal: 전북특별자치도 진안군의 통계 연보 자료입니다. 이 자료에서는 진안군의 연혁, 토지 및 기후, 인구, 노동, 사업체, 농림수산업, 광업·제조업, 전기·가스·수도, 유통·금융, 주택·건설, 교통·관광, 보건 및 사회보장, 환경, 교육 및 문화, 재정, 공공행정 및 사법, 부록 기본통계 정보를 제공합니다. 이 자료는 2024년 12월 31일 기준으로 작성되었으며, 교육 분야는 2025년 4월 1일 기준으로 작성되었습니다. 부록 분야는 2026년 1월 기준으로 작성되었습니다. 그리고 이 자료는 매년 6월 말에 발간 년도 기준으로 2년 전 자료로 현행화하여 제공합니다.
