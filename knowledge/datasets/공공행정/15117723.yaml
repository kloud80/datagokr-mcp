description_portal: 광주광역시도시공사에 신규 채용된 신입사원의 평균 임금 현황을 정리한 데이터입니다. 본 데이터는 구분(년도), 기본급, 수당, 초과근무수당, 1인당평균임금, 신입직원수, 데이터기준일자 항목으로 구성되어 있습니다. 기본급, 수당, 초과근무수당 항목은 신입사원의 보상 구조를 세분화하여 나타내며, 1인당평균임금은 실질적인 급여 수준을 확인하는 데 유용합니다. 신입직원수는 해당 연도에 채용된 인원 규모를 파악할 수 있는 항목입니다. 데이터기준일자는 정보의 최신성과 적용 시점을 명확히 하기 위한 기준입니다. 본 데이터는 인사관리 정책 수립, 예산 편성, 조직 내 보상 체계 점검 등에 활용될 수 있으며, 공정한 보상 운영을 위한 기초자료로 제공됩니다. 또한, 채용 과정의 투명성 확보 및 인재 유치 전략 수립에 참고자료로 활용이 가능합니다.
