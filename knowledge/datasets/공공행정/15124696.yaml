description_portal: 서울시설공단 공사감독3처는 공원·녹지·가로시설 등 조경 인프라를 중심으로 전기, 기계, 토목, 통신 등 다양한 공종의 공공 건설공사를 감독하는 부서입니다. 본 데이터는 2013년부터 2025년까지 수행된 공사의  착공부터 준공에 이르는 전 과정 이력을 담아, 공공 조경사업이 어떤 절차와 규모로 추진되어 왔는지를 시계열로 보여줍니다. 이를 통해 시민은 거주 지역 인근 공원·녹지 조성사업의 진행 현황과 예산 집행 규모를 직접 확인할 수 있고, 행정 입장에서는 사업 추진 실적을 투명하게 공개함으로써 공공사업에 대한 신뢰도를 높이는 데 활용됩니다. 또한 향후 유사 공사의 예산 산정이나 정책 수립 시 참고자료로도 활용 가치가 있습니다.
