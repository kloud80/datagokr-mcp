summary_user: 인천시가 공공장소에 설치한 무료 와이파이를 설치 지점 한 곳당 한 행으로 담은 원장 파일로, 설치장소·상세장소·시설구분·서비스제공업체·주소와 위도·경도를 포함한다. 시민이 '지금 있는 곳에서 가장 가까운 공공 와이파이존은 어디인가'를 찾거나, 분석가가 군구별·시설유형별 와이파이 설치 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구명·주소 같은 이름 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 인천광역시 인천데이터포털의 무료와이파이 정보를 제공하고 있습니다.인천 시민들을 위한 무료 와이파이 공공데이터는 누구나 편리하게 무선 인터넷을 사용할 수 있도록 돕는 유용한 정보입니다.이 데이터는 인천시가 공공장소에 설치한 무료 와이파이 위치를 한눈에 파악할 수 있게 해줍니다.주요정보1. 설치장소2. 설치상세장소3. 설치시도, 군구명4. 설치시설구분명5. 서비스제공업체명6. 주소7. 위도, 경도이 공공데이터를 활용하여 시민들은 가장 가까운 무료 와이파이존을 쉽게 찾을 수 있습니다.
