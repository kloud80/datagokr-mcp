summary_user: 온비드에 등록된 공매 공고별 입찰 결과 목록을 공고 1건 단위로 담으며, 공고번호·회차·공고유형·재산유형·처분방식(매각/임대)·공고기관·공고일자·개찰일시·집행상태(개찰준비중·개찰중·개찰완료)를 포함하고 범위는 전국이다. 공매 투자자나 분석가가 특정 기간에 개찰된 압류재산·국유재산 공고가 어느 기관에서 몇 건 나왔고 개찰이 끝났는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 온비드 서비스와는 온비드공고번호·공매번호를 이름 그대로 맞추거나 공고기관명으로만 연결한다.
limits: 전역 조인 키가 없어 지번(PNU)이나 행정표준코드로 다른 데이터와 직접 붙일 수 없고, 이름·코드 매핑이 필요하다. 호출할 때 물건유형코드·재산유형코드·개찰 시작·종료일자를 반드시 넣어야 하며, 개발계정은 하루 1,000회로 제한된다.
