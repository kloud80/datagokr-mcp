description_portal: '청년재직자 내일채움공제 가입자 관리 업무를 수행하는 수행기관의 관할 지역본(지)부별 현황(기관명, 주소지) 정보입니다.  * 해당 데이터는 수행기관 변동시 업데이트 될 예정입니다.**청년재직자 내일채움공제에 참여하는 수행기관이 중소벤처기업진흥공단에 제출한 서류상의 내용이며, 2024년 6월 30일 기준 유효한 수행기관의 목록입니다.***  컬럼별 상세설명 - 수행기관명 : 가입자 관리 업무를 수행하는 수행기관의 이름 - 부서명 : 해당 수행기관을 관리하는 중소벤처기업진흥공단의 각 지역본(지)부의 이름입니다. - 사업장 주소 : 가입자 관리 업무를 수행하는 수행기관이 소재한 주소입니다.'
