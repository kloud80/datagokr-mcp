description_portal: 이 자료는 한국해양수산연수원 목포분원에서 발급한 자격증(의료관리자 및 선박조리사)에 대한 연도별 현황을 정리한 것입니다. 2021년부터 2024년까지의 데이터를 포함하며, 각 연도별로 의료관리자와 선박조리사 자격증 발급 건수가 구분되어 수록되어 있습니다. 본 자료는 해양 관련 자격 인력의 양성 추이와 교육성과를 평가하기 위한 기초 통계와 교육 성과분석 등의 분야에 활용될 수 있는 유용한 자료입니다. 기관의 교육 운영 실적 보고나 정책 수립 시 참고 자료로 제공됩니다.* 연도, 의료관리자, 선박조리사에 대한 데이터를 포함하고 있습니다.
