summary_user: 2014년 7월 30일 국회의원 재보궐선거의 개표결과를 담은 xlsx 파일로, 서울 동작구을·수원시을·병·정·순천 등 21개 지역(투표구)의 개표 결과를 담는다. 선거 분석가나 연구자가 '2014년 7·30 재보궐선거에서 지역별로 후보·정당 득표가 어떻게 나뉘었나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선거·인구 데이터와는 시군구·선거구 이름을 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
