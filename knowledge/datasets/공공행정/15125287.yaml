  - 공공기관 연락처
  - 공공기관 지정 현황
summary_user: 공공기관 지정 기관의 기본정보(기관명·유형·분류·주관부처·설립일·지정 여부·대표 연락처·주소)와 각 기관의 지점·지사별 주소·연락처를 기관 1건, 지점 1건 단위로 담는 전국 범위 조회 API다. 특정 공공기관의 소속 부처와 유형을 확인하거나, 내 지역(시도·시군구)에 어떤 공공기관 지사가 있는지 찾는 질문에 쓴다. 두 오퍼레이션은 기관코드(instCd)로 서로 이어지고, 행정표준기관코드·주관부처코드·주소를 통해 다른 데이터와 맞출 수 있으나, 실측에서 전역 조인 키는 확인되지 않아 외부 연계는 이름·코드 매핑에 의존한다.
description_portal: 본 데이터는 공공기관의 주요 정보와 해당 기관의 지점 및 지사에 대한 정보를 종합적으로 제공하는 서비스입니다. 공공기관으로 지정된 기관들의 명칭, 유형, 소속 부처, 지역별 지점 현황 등 다양한 항목을 실시간으로 조회할 수 있습니다. 이를 통해 이용자는 특정 기관의 본부뿐 아니라 각 지역에 설치된 지사 또는 분소의 위치 및 관련 정보를 쉽게 파악할 수 있으며, 정책 수립, 지역 기반 행정서비스 개선, 기관 간 협력 체계 구축 등 다양한 행정 목적에도 활용될 수 있습니다. 또한, 실시간 업데이트를 통해 공공기관 지정 변동 사항이나 신규 기관 정보도 반영되므로 최신 정보 확보에 용이한 자료입니다. 해당 데이터는 국민 누구나 접근 가능하며 공공행정 투명성 제고에 기여합니다.
team:
  dept: 경영관리과
services:
  - op: /brnch
    name: 공공기관 지점 목록조회
    endpoint: https://apis.data.go.kr/1051000/public_inst/brnch
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        desc: '페이지번호 [기본값: 1]'
      - name: numOfRows
        required: false
        desc: '한 페이지 결과 수 [기본값: 10]'
      - name: resultType
        required: false
        desc: '응답형태 [기본값: json]'
      - name: instCd
        required: true
        desc: 기관코드  [행정표준기관코드 가능][공공기관 정보 목록조회 오퍼레이션 활용하여 조회]
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /list
    name: 공공기관 정보 목록조회
    endpoint: https://apis.data.go.kr/1051000/public_inst/list
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: ctpvNm
        required: false
        example: 대전광역시
        desc: 시도명 [문자열포함조건]
      - name: instCd
        required: false
        example: C1051
        desc: 기관코드  [행정표준기관코드 가능][공공기관 정보 조회서비스 오픈API 활용하여 조회]
      - name: instClsf
        required: false
        example: '05'
        desc: 기관분류 [코드정의서 첨부파일 참조]
      - name: instNm
        required: false
        example: 국립부산과학관
        desc: 기관명 [문자열포함조건]
      - name: instType
        required: false
        example: A2005
        desc: 기관유형 [코드정의서 첨부파일 참조]
      - name: numOfRows
        required: false
        example: '10'
        desc: '한 페이지 결과 수 [기본값: 10]'
      - name: pageNo
        required: false
        example: '1'
        desc: '페이지번호 [기본값: 1]'
      - name: resultType
        required: false
        example: json
        desc: '응답형태 [기본값: json]'
      - name: sggNm
        required: false
        example: 유성구
        desc: 시군구명 [문자열포함조건]
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
