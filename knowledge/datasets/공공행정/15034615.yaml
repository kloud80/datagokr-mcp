description_portal: 공정거래위원회의 위해사례 정보는 주로 소비자 상담, 피해구제, 분쟁조정 과정에서 발생하는 위해 사례를 포함합니다. 이러한 정보는 한국소비자원 등 관련 기관에서 수집하며, 개인정보 보호를 위해 비식별화 조치를 거쳐 제공됩니다. 위해 사례 정보는 공공데이터포털 등에서 확인할 수 있습니다. 위해 사례 정보의 내용:소비자 상담, 피해구제, 분쟁조정 등 과정에서 발생한 소비자 피해 사례를 포함하며, 주로 상품이나 서비스의 결함, 부당한 표시・광고, 불공정 거래 행위 등으로 인한 피해를 다룹니다. 제공처:한국소비자원 등 관련 기관에서 수집하고, 공정거래위원회에서 운영하는 공공데이터포털에서 공개합니다. 개인정보 보호:수집된 정보는 개인정보보호법 등 관련 법규에 따라 비식별화 조치를 거쳐 제공됩니다. 활용:소비자들은 이를 통해 유사한 피해를 예방하고, 부당한 피해를 입었을 경우 구제받을 수 있는 정보를 얻을 수 있습니다. 공정거래위원회 역할:공정거래위원회는 이러한 위해 사례 정보를 바탕으로 소비자 피해 예방 및 구제 정책을 수립하고, 불공정 행위에 대한 조사를 진행합니다.
