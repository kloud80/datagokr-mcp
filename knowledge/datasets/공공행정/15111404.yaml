description_portal: 대전광역시 소상공인 기간별 생존율·폐업율 현황 자료는 2020년 코로나19 관련 공공요금 감면 지원을 받은 대전시 내 약 10만여 명 소상공인의 개업년월을 기준으로 2022년 9월까지(또는 10월말 기준) 각 사업체의 영업상태(영업중, 휴업, 폐업, 기타 등) 변동 사항을 반영한 통계 데이터입니다. 정보 오류가 확인된 약 100건의 사업체는 표본에서 제외되었습니다. 이 자료에는 사업자별 개업시점 대비 현재 생존 상태와 폐업 상태 비율, 휴업 사업체 비율 등이 포함되어, 기간 별 소상공인 시장의 실제 생존력과 시장 리스크, 코로나19 위기 이후 공공 지원 효과 등을 분석할 수 있습니다. 본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
