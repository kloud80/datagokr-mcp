description_portal: 국가법령정보센터에서 제공하는 법령 조문 중 한자(漢字)로 표기된 용어를 국민이 보다 쉽게 이해할 수 있도록 한글로 변환하여 관리한 정보를 체계적으로 정리한 자료입니다. 각 조문별로 한자 표기 여부, 한글 대체 표기, 변환 적용 여부 등 세부 속성을 포함하고 있어 법령 내 용어의 난해성을 해소하고, 법령문서의 가독성과 접근성을 높이기 위한 기반 데이터를 제공합니다.법령한글변환정보는 한자 사용률이 높은 법령의 이해도를 높이고, 다양한 법제정보 서비스에서 한글 기반 검색·분석 기능을 강화하는 데 활용됩니다. 또한 중장기 개방계획에 따라 기계판독이 가능한 형식으로 제공됨으로써, AI 기반 법령요약·질의응답, 법령 용어 분석, 자동 변환 시스템 구축 등 여러 분야의 데이터 활용을 촉진할 수 있습니다.
