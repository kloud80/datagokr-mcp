description_portal: 본 공공데이터는 한국장학재단의 수의계약 현황에 관한 데이터로, 재단의 경영 투명성을 높이고 데이터의 공공 활용성을 제고하기 위해 다음과 같은 항목들을 포함하여 데이터를 개방하고 있습니다. 재단이 체결한 직접계약(입찰을 통해 체결된 계약 제외)에 관한 계약명, 계약일, 계약기간, 계약금액, 계약상대자, 계약내용, 수의계약근거(재단 계약사무규칙 등), 수의계약 상세 사유 등의 항목을 확인하실 수 있습니다. 책자 및 안내자료 제작, 건물 유지관리 및 임차 용역, 프로그램 위탁 운영 등의 다양한 계약 내용을 포함하고 있습니다.
