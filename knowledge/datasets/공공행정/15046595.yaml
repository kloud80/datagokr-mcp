description_portal: '○ 통계개요* 통계명 : 청렴도지수(자치단체별)* 통계종류 : 서울시 부패유발요인에 대한 청렴도 지수를 제공하는 일반ㆍ조사통계* 작성목적 : 행정 제반사항에 대한 운영ㆍ점검을 통해 지방행정 수행의 책임성과투명성을 높이고 행정서비스의 질적향상을 위한 정책마련의 기초자료로활용하는 것을 목적으로 함* 조사체계 : 조사기관 → 서울시 및 자치구 → 국가권익위원회* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시본청 및 자치구별 청렴도지수○ 용어설명* 청렴도 : 국민의 입장에서 공직자가 부패행위를 하지 않고, 투명하고 책임있게 업무를처리한 정도를 측정한 것※ 10점 만점 기준이며 수치가 높을수록 청렴도가 높음을 의미○ 기 타* 서울시는 본청의 청렴도지수로 해당 자치구 전체 청렴도지수 현황이 아님'
