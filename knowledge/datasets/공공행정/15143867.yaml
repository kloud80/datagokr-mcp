description_portal: 노사발전재단에서 운영 중인 공식 온라인(SNS) 채널의 목록 데이터입니다.각 사업 구분별 SNS 유형, 주소 등 기본 정보를 포함하고 있으며, 대국민 홍보 및 정책 소통 강화를 위한 주요 디지털 커뮤니케이션 수단에 대한 정보를 제공합니다.ㅇ 블로그, 유튜브, 인스타그램, 페이스북 등 다양한 온라인 채널을 통해 재단의 정책, 사업, 성과를 국민에게 쉽고 친근하게 전달ㅇ 국민 누구나 재단의 디지털 채널을 활용할 수 있도록 채널 현황 정보를 재단 홈페이지에 1차 공개 중임ㅇ 정책 홍보, 콘텐츠 확산, 이용자 참여 유도 등 다양한 디지털 소통 전략을 지원하기 위해 SNS 운영 정보를 공공데이터로 개방ㅇ 본 데이터는 기관의 온라인 홍보 역량 강화 및 국민과의 실시간 소통 기반 마련을 위한 기초자료로, 변경사항 반영을 위해 정기적으로 갱신될 예정ㅇ 이를 통해 재단은 열린 행정 실현과 대국민 서비스 접근성 제고에 기여하고자 함
