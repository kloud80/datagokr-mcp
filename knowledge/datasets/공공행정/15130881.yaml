summary_user: 경기도 「경기민원24」에 등록된 민원행정서비스를 서비스 한 건씩 담은 원천 목록으로, 서비스명·접수방식·접수 시작/종료일·대상자 수·지원 내용·신청 대상 조건·담당 부서와 담당자 연락처를 포함하며 범위는 경기도 단위의 비공간 자료다. 경기도민이 지금 접수 중인 도 지원사업과 신청 조건, 문의할 담당 부서를 확인하거나, 분석가가 도의 민원·지원 서비스 구성과 접수 기간 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 서비스명·담당 기관명 같은 이름 매핑으로만 잇고, 내부적으로는 서비스 일련번호와 상위·부모 서비스 번호(up_servc_sn 등)로 서비스 간 계층을 묶는다.
description_portal: 이 데이터는 경기도가 운영하는 「경기민원24」 시스템을 통해 제공되는 민원행정서비스 상세 정보를 포함하고 있습니다. 주요 항목으로는 서비스명, 접수방식(온라인/오프라인), 신청 가능 기간, 대상자 수, 서비스 내용 및 상세 조건, 지원 내용 등입니다. 각 서비스는 다양한 행정 서비스로 구성되어 있으며, 특정 조건을 충족해야 신청할 수 있는 항목도 포함됩니다. 본 데이터는 다양한 민원 서비스 현황을 관리하고 신청 조건 및 내용을 확인하여 민원 편의를 제공하고, 사용자 맞춤형 지원 제도를 분석하거나 신규 정책 도입의 기초자료로 활용될 수 있습니다.
