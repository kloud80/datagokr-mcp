description_portal: 과학기술정보통신부 대표홈페이지에서 추출한 조직도(부서 및  부서 상세명), 소속·산하·유관기관 정보입니다.소속산하, 유관기관 데이터는 기관일련번호, 기관명, 기관홈페이지 주소로 구성되어 있으며, 조직도 정보는 과기정통부 본부 부서 아이디, 부서명, 부서 상세명으로 구성되어 있습니다.본 데이터는 과학기술정보통신부의 조직 구성과 관련 기관 현황을 체계적으로 정리한 데이터입니다. 과학기술정보통신부 공식 홈페이지에서 추출한 조직도 정보와 소속·산하·유관기관 정보를 포함하고 있으며, 정부 조직의 구조와 관련 기관 네트워크를 파악할 수 있는 중요한 참고자료입니다. 조직도 데이터는 부서아이디, 부서명, 부서상세명으로 구성되어 본부, 실, 국, 과 단위의 계층적 조직 구조를 명확히 보여주며, 소속·산하·유관기관 데이터는 200개 기관의 일련번호, 기관명, 홈페이지 주소를 제공합니다. 여기에는 연구기관, 공공기관, 타 정부부처, 국제협력 기관 등이 포함되어 있습니다. 이 데이터는 과학기술 정책 연구, 정부 조직 분석, 기관 간 협력 네트워크 파악, 공공데이터 활용 서비스 개발 등에 활용될 수 있으며, 과학기술정보통신부와 관련된 기관들의 전체적인 현황을 한눈에 파악할 수 있는 유용한 자료입니다.
