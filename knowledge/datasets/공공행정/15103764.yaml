description_portal: 한국수력원자력(주)의 기간제근로자 수에 대한 데이터를 공개합니다. 이 데이터는 한국수력원자력(주)에서 연도별로 집계한 기간제 근로자의 인원 현황을 제공하는 공공데이터입니다. 이 데이터는 연도별로 성별, 근무 형태(전일제/단시간)별로 기간제 근로자 수를 구분하여 보여줍니다. 이 공개데이터를 통해 한국수력원자력(주)의 연도별 기간제 근로자 규모와 변화 양상을 남녀별, 근무 형태(전일제/단시간)별 근로자를 중심으로 확인할 수 있습니다. 단시간 근로자란 근로기준법에 따라 1주 동안의 소정근로시간이 그 사업장에서 같은 종류의 업무에 종사하는 통상 근로자의 1주 동안의 소정근로시간에 비하여 짧은 근로자를 말합니다.
