description_portal: 법제처 법제연구원에서 제공하는 영문법령 현황은 국내 법령의 영문화 진행 현황 및 결과물을 체계적으로 수록한 자료입니다. 각 법령의 한글 원문과 대응되는 번역문이 포함되며, 번역 완료 여부와 최신 개정 사항 반영 시점, 담당 연구자 및 부서에 관한 정보도 함께 제공됩니다. 또한 번역 품질 보증 절차 및 검토 이력에 대한 기록을 포함하여 신뢰성과 정확성을 확보하도록 구성되었습니다. 이를 통해 외국인, 외국기관 및 국제기구가 우리나라 법령을 이해하고 활용할 수 있는 기반을 마련합니다. 해당 자료는 법률 문서의 국제적 접근성 제고 및 국외 연구자와의 소통을 원활히 하는 데 기여합니다. 법령 영문화 전반에 관한 체계적 관리 및 품질 감독의 기초 자료로 활용됩니다.
