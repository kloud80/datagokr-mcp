summary_user: 한국동서발전이 공공데이터포털에 개방한 파일데이터를 목록별로 한 줄씩 정리한 메타데이터 목록으로, 목록명·최신 데이터명·분류체계·서비스유형·제공주기·등록일·마지막 수정일을 담으며 CSV 파일 한 개(약 43KB)로 받는다. 연구자나 데이터 활용자가 '한국동서발전이 어떤 데이터를 어떤 주기로 공개하고, 각 파일이 언제 마지막으로 갱신됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 목록명·데이터명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
