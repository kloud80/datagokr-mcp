summary_user: 지방자치단체별로 보통교부세 산정 때 세출효율화 자체노력이 얼마나 반영됐는지를 회계연도 단위 집계로 담으며, 2015회계연도부터 전국 자치단체를 대상으로 반영 금액과 반영 비율이 나온다. 지방재정 분석가나 주민이 '우리 시·군·구가 세출효율화 노력으로 교부세 인센티브를 얼마나 받거나 깎였나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 자치단체 코드(laf_cd)와 자치단체명, 회계연도로 같은 지방재정365의 다른 공시 데이터와 이름·코드를 맞춰 잇는다.
description_portal: 지방자치단체의 보통교부세 자체노력 반영현황(세출효율화)은 지방자치단체가 세금을 포함한 모든 자원의 사용을 최대한으로 효율화하여 재정의 낭비를 줄이고 공공서비스의 질을 높이는 과정이며 지역 주민에게 더 나은 서비스를 제공하고, 자원 활용의 최적화를 목표로 합니다. 자치단체의 세출 효율성 개선 노력을 통해 교부세 배분이 조정되며, 세출감소와 재정운영의 효율성 향상으로 인센티브가 제공되며 해당 자료는 자치단체별 인센티브를 분석한 자료입니다.보통교부세자체노력반영현황(세출효율화) 정보는 2015회계연도부터 자료가 제공됩니다.
