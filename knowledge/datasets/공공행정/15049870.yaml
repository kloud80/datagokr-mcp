description_portal: 설비투자지수* 관련 데이터로 수출물가지수(품목)[조사년월,동태코드, 물가지수, 가중치]에 대한 정보를 제공합니다.*관련참고:- 설비투자지수는 경제통계에서 기업의 설비투자 동향을 보여주는 지표입니다. 국내 기업이 기계·장비, 건물, 운송장비 등 설비에 투자한 금액을 기준으로 산출한 지수로 설비투자의 증감과 경기 동향을 파악하기 위함이며, 통상 기준연도를 100으로 설정하여 지수화합니다. 즉, 기업이 생산설비에 투자한 금액을 기준연도 대비 지수화한 통계로 기계·장비, 운송장비, 건물·구조물 등 설비투자 항목 포함되어 있습니다.
