description_portal: 서울특별시 지역내총생산(GRDP) 통계를 기반으로 자치구별 경제활동별 지역내총부가가치 및 요소소득 현황을 제공하는 자료이다. 자치구별·산업별 산출액, 중간소비, 지역내총부가가치, 고정자본소모, 순기타 생산세 등의 경제지표를 연도별로 제공하며, 농림어업, 제조업, 건설업, 도소매업, 금융·보험업, 부동산업, 정보통신업 등 다양한 산업 분야의 경제활동 규모를 파악할 수 있다. 이를 통해 지역별 산업구조와 경제적 특성을 분석할 수 있으며, 지역경제 활성화 정책 수립, 산업 육성 전략 마련, 투자유치, 도시계획 수립 및 지역 간 경제력 비교를 위한 기초자료로 활용할 수 있다.
