summary_user: 2010년 6월 2일 제5회 전국동시지방선거의 개표결과를 시도·구시군·읍면동 단위로 집계해 담은 Excel 파일로, 시·도지사부터 교육의원까지 선거종류 8개가 시트별로 나뉘어 있고 선거인수·투표수·후보자별 득표수·무효투표수·기권수를 담는다. 2010년 지방선거에서 우리 동네(읍면동) 시장·군수 후보별 득표와 투표율이 어땠는지 확인하거나, 지역별 정당 지지 변화를 다른 회차와 비교하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 회차 개표결과나 인구·행정구역 자료와는 시도·구시군·읍면동 이름을 맞춰 연결해야 한다.
description_portal: '2010년 6월 2일에 실시한 전국동시지방선거로  전국 시도, 구시군, 읍면동별 개표정보 입니다.※ 본 데이터는 선거종류별 개표결과가 시트 단위로 구분된 구조로, 통합 Excel 파일(.xlsx) 형식으로 제공됩니다.     총 8개 시트로 구성되며, 시·도지사, 구·시·군의장, 시·도의회의원, 구·시·군의회의원, 광역의원비례대표, 기초의원비례대표, 교육감, 교육의원 개표결과를 포함합니다.・시·도지사, 시·도의회의원, 광역의원비례대표, 교육감, 교육의원: 16개 시도   → 서울, 부산, 대구, 인천, 광주, 대전, 울산, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주・구·시·군의장, 구·시·군의회의원, 기초의원비례대표: 15개 시도   → 제주 제외'
