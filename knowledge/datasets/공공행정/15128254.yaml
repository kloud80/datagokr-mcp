description_portal: '경상남도 통영시  담배소매인 지정 현황에 대한 데이터로 다음과 같이 제공함을 알려드립니다.제공내용: 연번, 사업자명, 업소주소, 지정일자, 소매인구분(일반/구내/자동판매기)이를 통해 특정 업소의 지정번호 및 주소 정보를 확인할 수 있으며, 영업구분(예: 소매업, 판매점)과 관리기관의 명칭 및 연락처를 함께 제공함으로써 행정기관과 업소 간 관리 체계를 명확히 할 수 있습니다. 이 데이터는 담배소매업 허가 및 지정 현황을 공공에게 투명하게 공개하고, 불법 유통 방지 및 판매 관리 정책 수립에 활용될 수 있습니다. 또한, 지역 내 담배소매점의 분포 현황을 분석하여 보건·위생 정책 및 지역 상권 분석에도 중요한 기초자료로 쓰일 수 있습니다.담배소매인의 지정 기준은 담배사업법 시행규칙 제7조의3제4항 및 통영시 담배소매인 지정에 관한 규칙 제3조, 제4조를 참조하시기 바랍니다.※ “담배”란 연초(煙草)의 잎을 원료의 전부 또는 일부로 하여 피우거나, 빨거나, 증기로 흡입하거나, 씹거나, 냄새 맡기에 적합한 상태로 제조한 것을 말합니다. (담배사업법 제2조)'
