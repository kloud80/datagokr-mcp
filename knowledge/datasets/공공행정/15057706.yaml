summary_user: 경기도 내 공공기관이 보유한 관사를 한 건씩 담은 시설 목록으로, 시군명·구분명·면적(㎡)·취득액(천원)과 지번·도로명 주소, WGS84 위도·경도를 함께 담는다. 경기도 재정·자산 담당자나 분석가가 "어느 시군에 관사가 얼마나 있고 취득액과 면적은 어느 정도인가"를 파악해 관사 수급계획이나 공공자산 활용 분석에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 시군명·시군코드(SIGUN_CD)로 시군 단위 통계와 맞추거나 위경도 좌표로 지도·공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 공공기관이 보유한 관사 현황 정보를 제공합니다. 관사는 공무원 및 소방서·경찰서 등 행정기관 소속 직원의 주거복지 지원을 목적으로 제공되는 시설입니다. 데이터에는 시군명, 구분명, 면적(㎡), 취득액(천원), 소재지우편번호, 지번주소, 도로명주소, WGS84 위도·경도 등의 정보가 포함되어 있습니다. 이 데이터는 관사자산의 효율적 관리, 예산편성 및 재정운용, 공공자산 활용현황 분석, 관사 수급계획 수립 등에 활용될 수 있습니다. 또한 관사의 지리적 분포를 파악하여 지역별 공무원 근무환경 및 주거지원 체계 수립에도 활용 가능합니다. 데이터 이용 시 취득 시점, 면적 변경 및 관리 상태 등 최신 정보 확인이 필요합니다.
