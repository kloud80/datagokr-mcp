description_portal: 이 데이터는 한국남부발전의 사업장별 차량 보유 현황을 정리한 자료입니다. 차량 구분은 승용, 승합, 화물, 특수, 기타로 나뉘며, 사용 목적은 주로 업무용으로 기록되어 있습니다. 또한 차량 유형은 친환경차량(전기차, 하이브리드 등)과 내연기관차량으로 구분되어, 각 사업장이 보유한 차량의 친환경 전환 현황을 수치로 확인할 수 있습니다. 이를 통해 공기업의 친환경 교통수단 도입 수준을 파악할 수 있으며, 지속가능한 경영 활동의 일환으로 친환경차 확대가 어떻게 추진되고 있는지 알 수 있습니다. 본 자료는 공공기관의 차량 관리 및 환경정책 이행 현황을 평가하는 데 유용하며, 향후 친환경차 보급 확대와 교통 부문 탄소중립 전략 수립에 기초자료로 활용될 수 있습니다.
