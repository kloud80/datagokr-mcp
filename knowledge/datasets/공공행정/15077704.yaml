summary_user: 경기도 시군별로 월 단위 일일 평균 유동인구를 성별과 연령대(10대~70대 이상)로 나누어 담은 시군구 단위 집계 자료이며, 수치는 SK텔레콤 자료에 시장점유율을 반영해 추정한 값이라 소수점으로 표시된다. 상권 분석가나 창업 준비자가 어느 시군에 어떤 성별·연령층의 유동인구가 많은지, 월별로 어떻게 달라지는지 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 지역명(출발·도착 지역명 필드 등)이나 시군코드 매핑으로 상권·인허가 등 다른 시군구 단위 자료와 이어 써야 한다.
description_portal: '시군별 월 단위 일일 평균 유동인구 데이터입니다. 연령대 별, 성별 유동인구 수 정보를 제공합니다.유동인구의 단위는 (명)이며, 계산에 시장점유율이 반영되어 소수점 단위로 표시됩니다.※ 제공 : SK텔레콤※ 시군구 코드 참고사이트 : https://www.code.go.kr/stdcode/regCodeL.do- 시군코드는 앞 5자리까지만 표기되어 있습니다. 참고사이트 검색시에는 뒤에 00000을 붙여주시기 바랍니다.* 해당데이터는 갱신이 중단되었으니 최신 자료가 필요하신 분은 민간데이터 - 유동인구_시군구 단위 집계 자료를 참고하여 주시기 바랍니다.'
