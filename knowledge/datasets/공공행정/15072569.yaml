summary_user: 통계청과 각 통계작성기관이 수행한 통계조사의 마이크로데이터 항목을 조사명·조사년월·항목명 단위로 나열하고, 항목마다 공공용·원격접근(RAS)·이용센터(RDC)·승인용 등 서비스 유형별 제공 여부와 제공 유의사항을 담은 전국 단위 비공간 목록 파일(CSV, 약 2MB)이다. 연구자나 분석가가 MDIS에 이용 신청을 하기 전에 "이 조사의 이 변수를 공공용 파일로 받을 수 있는지, 아니면 이용센터에 가야 하는지"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 조사명·항목명 같은 이름을 맞춰 연결해야 한다.
description_portal: 통계청 및 통계작성기관에서 수집한 통계조사의 마이크로데이터 데이터 제공항목을 서비스 유형별로 제공 여부를 알 수 있음. 국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다. 이에 통계청은 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 공공기관, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.
