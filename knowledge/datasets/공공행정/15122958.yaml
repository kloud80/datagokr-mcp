summary_user: 경기통계시스템의 통계표가 어떤 주기로 작성되는지를 정의한 코드표로, 주기구분 코드(cycl_div)마다 부정기·월·순기·년 같은 주기명과 영문명을 한 행씩 담는다. 경기도 통계를 내려받아 분석하는 사람이 통계표에 붙은 주기 코드가 월간인지 연간인지 비정기인지 해석하거나, 공표 일정·자동 수집 주기를 설정할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 경기통계시스템의 다른 통계표·메타데이터와는 주기구분 코드값을 이름·코드 매핑으로 맞춰 연결한다.
description_portal: "이 데이터는 경기통계시스템에서 사용되는 통계자료의 주기적 작성 단위를 정의한 자료로, 각 통계표가 생성되는 주기구분(F, M, T, Y)과 이에 따른 주기명(예: 부정기, 월, 순기, 년), 주기영문명이 포함되어 있습니다. 주기구분은 통계자료의 갱신 주기를 체계적으로 관리하고, 사용자에게 통계자료의 생성 간격을 명확히 제공하기 위해 설정됩니다. 예를 들어 'M'은 월간통계, 'Y'는 연간통계를 의미하며, 'F'는 일정치 않은 비정기적 수집 주기를 나타냅니다. 이 데이터는 통계자료 제공 시점 계획 수립, 공표 일정 관리, 통계 시스템 자동화 설정, 메타데이터 설계의 기준자료로 활용됩니다."
