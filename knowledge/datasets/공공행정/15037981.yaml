description_portal: '본 데이터는 광주광역시 광산구의회에서 2025년도에 처리한 의안에 대한 전반적인 정보를 포괄적으로 수록한 공공데이터입니다. 광산구의회에서 연중 수행한 각종 입법 활동과 정책 결정 과정을 데이터로 체계화하여, 지역 주민과 연구자, 정책 관계자 등 다양한 사용자들이 구체적인 의정활동 내역을 확인하고 분석할 수 있도록 구성하였습니다.데이터에는 다음과 같은 세부 항목들이 포함되어 있으며, 이를 통해 각 의안의 제안부터 심의, 최종 처리까지 전 과정을 한눈에 파악할 수 있습니다.※ 소관위원회가 없거나 상인위원회에 상정하지 않는 등의 경우로 인해 공란이 발생할 수 있습니다.1.기준연도: 해당 의안이 처리된 연도2. 의안번호 및 의안명: 고유 식별 번호 및 제목3. 제안일자 및 제안자: 의안을 발의한 날짜와 주체(구청장, 의원 등)4. 소관 상임위원회: 의안 심사를 담당한 위원회(행정자치, 산업도시 등)5. 해당 회기 및 회의 단계: 의안이 상정된 정례회 또는 임시회, 해당 처리 단계6. 본회의 처리 결과: 원안가결, 수정가결, 부결 등 의안에 대한 최종 결정7. 집행부 이송 여부 및 이송일자: 본회의 처리 이후 구청으로의 이송 여부'
