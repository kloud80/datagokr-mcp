description_portal: 본 데이터는 경기도 고양시에서 소상공인 대상으로 지원하는 사업에 대한 정보를 담은 데이터입니다. 2026년도 기준 지원사업에 대한 정보(사업명, 지원대상, 지원내용, 신청 기간, 수탁기관, 전화번호 등)를 제공하고 있습니다. 본 자료를 통해 소상공인의 정책 지원사업 접근성을 높이고, 지원사업 정보의 활용 편의성과 행정서비스의 효율성을 제고하는데 목적이 있습니다. 각 지원사업은 원할한 사업추진을 위하여  사업수탁 기관이 별도로 있으며 문의사항이 있는 경우 해당 기관에 문의하여 주시기 바랍니다.
