description_portal: '이 데이터는 소상공인시장진흥공단에서 제공하는 개방형 공공자원 서비스 현황을 정리한 것으로, 공단이 보유하고 있는 사무용 기기, 공간, 시설 등 공공자원을 외부 기관이나 소상공인에게 개방하여 활용할 수 있도록 지원하는 서비스 목록을 포함하고 있습니다. 자료에는 자원별 고유번호, 기관명, 자원분류(예: 사무기기), 자원구체 항목, 개방형태, 담당자 정보 및 등록일 등이 명시되어 있어, 실제 현장에서의 활용 가능성과 접근성을 높여줍니다. 특히 사무기기에는 프린터, 노트북, 교육용 장비 등이 포함되며, 개방형태는 단순 사용 또는 예약 기반 운영 등 다양한 방식으로 제공됩니다.'
