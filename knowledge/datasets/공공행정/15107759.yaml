description_portal: 부산광역시 기장군에는 기존 장안사계곡과 용소천 계곡이 물놀이 관리지역으로 지정되어 있었으나, 현재 용소천 계곡은 이용 여건 및 관리 효율성 등을 고려해 관리지역 지정이 해제되었습니다. 현재 기장군에서 운영·관리 중인 공식 물놀이 관리지역은 장안사계곡입니다.장안사계곡은 기장군 장안읍 장안사로 105 일원에 위치하고 있으며, 울창한 산림과 맑은 계곡물이 어우러진 자연친화적 휴식 공간입니다. 특히 연중무휴로 무료 개방하고 있어, 가족 단위 방문객이나 산책객 등 누구나 자유롭게 이용할 수 있는 열린 쉼터라는 점이 큰 장점입니다.물놀이 수상 안전 사고관련을 대비하여 인명구조함 및 여름철 물놀이 계절일 경우 안심하고 물놀이를 즐길 수 있도록 철저하게 관리되고 있습니다.수심이 비교적 얕은 구간도 많아 여름철에는 어린이와 함께하는 가족들의 물놀이 장소로 인기가 많으며 많은 이용자들이 방문하고 있습니다.
