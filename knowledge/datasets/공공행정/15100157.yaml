summary_user: 성주군이 보유한 공유재산을 재산 한 건씩 담은 원장 파일로, 재산 종류(토지·건물 등), 소재지, 지목, 면적, 담당 재산관리관을 기록한다. 주민이나 사업자가 '특정 읍면에 군 소유 토지가 있는지, 지목과 면적은 얼마이며 어느 부서가 관리하는지'를 확인할 때 쓰고, 분석가는 군 자산 현황 분석에 쓴다. 전역 조인 키가 없어 소재지 주소를 지번·주소 데이터와 이름으로 맞추거나 같은 성주군 자료끼리만 연결한다.
description_portal: 본 데이터는 성주군이 보유한 공유재산의 관리 현황을 체계적으로 파악하기 위해 구축된 자료이다. 재산의 종류를 명확히 구분하여 토지, 건물 등 자산 유형별 특성을 이해할 수 있도록 구성하였으며, 소재지 정보를 포함하여 위치 기반의 관리 및 활용계획 수립이 가능하도록 하였다. 또한 지목과 면적 정보를 함께 제공하여 재산의 용도, 관리 범위, 활용 가능성을 객관적으로 판단할 수 있는 기반을 마련하였다. 아울러 재산관리관 정보를 포함하여 해당 자산의 관리 책임체계를 명확히 하였으며, 민원 대응, 자산 유지관리, 활용 검토 등 행정업무 전반에 필요한 실무 지원이 가능하도록 하였다. 이러한 자료는 공유재산의 효율적 운영, 정책적 의사결정, 자산 현황 분석 등에 활용될 수 있도록 구성된 기초 행정데이터이다.
