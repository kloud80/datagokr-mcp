summary_user: 농식품공공데이터포털에 개방된 식품산업 데이터셋의 메타데이터 목록으로, 데이터셋·데이터 단위 한 행마다 이름·설명·제공기관·담당자·키워드·등록일·이용허락범위·업데이트주기·제공 형태(그리드·오픈API·파일·지도 등)를 담으며 범위는 전국·비공간이다. 분석가나 사업자가 "식품산업 관련해 어떤 공공데이터가 어떤 형태로, 어떤 이용조건으로 열려 있는가"를 찾아 원하는 데이터의 담당자와 접근 경로를 확인하는 데 쓴다. 전역 조인 키는 없고, 목록의 데이터셋명이나 공공데이터포털URL·링크URL을 따라 개별 데이터셋을 찾아가는 식으로 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방한 식품산업 데이터 목록은 농림축산식품부에서 관리하는 식품산업과 관련된 다양한 정보를 담고 있는 자료입니다. 이 데이터 목록은 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함유무, 상위분류, 제3자권리, 이용허락범위, 업데이트주기, 서비스 유형과 같은 여러 중요한 정보를 포함합니다. 이러한 데이터는 연구, 정책 수립, 그리고 식품산업의 동향 분석 등에 활용될 수 있으며, 관련 기관이나 업체들이 보다 나은 의사결정을 내리는 데 실질적인 도움이 됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(숫자형): 각 데이터셋을 식별하는 고유 아이디, 데이터셋명(문자형): 데이터셋의 주제나 내용을 나타내는 이름, 데이터셋설명(문자형): 데이터셋의 구체적인 내용을 설명하는 항목, 기관명(문자형): 데이터를 제공하는 기관의 이름, 담당자명(문자형): 각 데이터셋에 대한 담당자의 이름, 전화번호(문자형): 담당자의 연락처, 키워드(문자형): 데이터셋과 관련된 주제를 나타내는 태그로 사용됩니다. 이외에도 등록일, 데이터ID, 데이터명, 데이터설명, 그리고 제3자권리 등 다양한 컬럼이 포함되어 보다 심층적인 데이터 활용이 가능하도록 구성되어 있습니다.'
