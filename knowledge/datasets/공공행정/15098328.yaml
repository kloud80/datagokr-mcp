summary_user: 세종특별자치시 안의 공중화장실을 한 곳씩 담은 개별 목록으로, 구분(se), 도로명·지번 주소, 남녀공용 여부, 남성·여성·장애인·어린이용 대변기와 소변기 수, 관리기관명, 전화번호, 개방시간을 담는다. 시민이나 방문객이 '근처에 장애인용 칸이 있고 지금 열려 있는 공중화장실이 어디인가'를 찾을 때, 분석가가 동네별 화장실 시설 분포를 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 도로명·지번 주소를 맞추거나 관리기관명을 매핑해서 잇는다.
description_portal: 세종특별자치시에 있는 공중화장실 명칭, 공중화장실 종류 정보, 공중화장실 위치 및 주소, 소변기 및 대변기 수량 정보 등을 제공합니다.
