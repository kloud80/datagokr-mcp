description_portal: 본 데이터는 국내 산업 및 직업 관련 통계를 작성하는 모든 기관이 표준적으로 사용하는 분류 체계를 등록한 것으로, 통계자료의 일관성과 비교성을 확보하는 데 목적이 있습니다. 데이터 구성은 산업코드(KSIC)와 직업코드(KSCO)로 구분되며, 각 코드값에 대응하는 산업 및 직업 분류 체계의 상세 정의와 설명 정보를 포함하고 있습니다.이 분류 체계는 기술 변화와 경제 구조의 흐름을 반영하여 주기적으로 개정되며, 사용자는 필요에 따라 특정 항목을 분류하여 코드값과 상세 정보를 대조할 수 있습니다. 특히 개정 시 발생하는 신·구 코드 간의 연계 정보를 통해 신설되거나 소멸된 산업 및 직업군을 확인할 수 있으며, 이를 통해 과거와 현재의 데이터를 시계열적으로 분석할 수 있는 표준 가이드라인을 제공합니다. 이는 국가 통계의 정밀한 작성뿐만 아니라 행정 및 민간 분야에서 산업과 고용 데이터를 표준화된 기준으로 관리하는 데 필수적인 기초 자료로 활용됩니다.
