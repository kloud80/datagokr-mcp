description_portal: '음식경연대회 우수업소는 2012년부터 중구를 대표하는 맛집을 발굴하고 먹거리 관광상품 개발 등 외식산업 활성화와 음식문화 발전에 기여하기 위해 시행한 향토·특색음식 발굴 경연대회  수상업소 중 영업을 유지하고 있는 업소입니다.파일명 인천광역시 중구 음식경연대회우수업소 내용 : 업소명, 소재지주소, 영업시간, 휴무, 주차안내, 전화번호 등에 관한 업소 기본정보를 포함하고 있습니다. 인천광역시  중구에서는 연 1회 음식경연대회를 개최하고 있으며 수상업소 중 38개의 업소가 영업 중입니다.'
