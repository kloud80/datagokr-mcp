description_portal: '제주특별자치도에 소재하고 있는 곤충 사육업과 관련한 데이터를 제공합니다.항목: 상호, 소재지, 사육품종, 신고업종*「곤충산업의 육성 및 지원에 관한 법률」- 곤충산업: 곤충과 관련된 재화 또는 용역을 제공하는 업(業)으로서 다음 각 목에 해당하는 것가. 곤충생산업: 판매를 목적으로 곤충을 사육하거나 곤충의 산물 또는 부산물을 생산나. 곤충가공업: 곤충, 곤충의 산물 또는 부산물을 직접 원료 또는 재료로 하여 가공다. 곤충유통업: 곤충, 곤충의 산물 또는 부산물의 도매ㆍ소매 및 이를 경영하기 위한 보관ㆍ배송ㆍ포장과 이와 관련된 정보ㆍ용역의 제공 등라. 그 밖에 곤충과 관련하여 대통령령으로 정하는 영업자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=2214'
