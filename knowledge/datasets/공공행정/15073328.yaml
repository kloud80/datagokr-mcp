summary_user: 공공급식통합플랫폼(급식전자조달 NeaT)의 계약정보를 계약번호·계약차수 단위 건별로 담으며, 계약명·계약체결형태와 방법·계약일자·기간·금액·계약기관·수요기관·대표업체가 포함되고 범위는 전국이다. 학교 등 급식 수요기관이 어떤 업체와 얼마에 식재료 물품 계약을 맺었는지 확인하려는 공급업체나 분석가가 지역·기관별 계약 현황을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수요기관명·계약기관명·대표업체명 같은 이름 매칭으로만 연결한다.
description_portal: '공공급식통합플랫폼은 입찰공고, 계약정보, 낙찰정보, 발주계획 등의 데이터를 제공하고 있습니다.* 공공급식통합플랫폼: 공공급식 수요처와 지역의 급식지원센터, 공급업체가 간편하게 식재료를 거래할 수 있는 시스템으로써, 급식전자조달(NeaT) 및 급식지원센터(SeaT) 서비스를 제공하는 플랫폼* 주요기능 - 식단관리프로그램: 공공급식 식재료 표준코드 기반 급식관리 기능 - 공공급식전자조달: 급식 수요처의 공급업체 선정, 계약관리 등 - 공공급식지원센터: 다양한 유형의 급식지원센터와 수요처간 수발주 관리 등'
team:
