summary_user: 법정동·행정동의 통·반 단위로 세대원수별(1인~10인 이상) 주민등록 세대수와 전체세대수를 통계년월 기준으로 담은 집계 API이다. 분석가나 지자체 담당자가 특정 동네에 1인세대가 얼마나 되는지 같은 질문에 쓴다. 법정동코드(stdgCd, 키 bjd_cd)로 다른 법정동 기반 데이터와 이어 쓰며, 월 시계열과 결합하면 공간 분석의 기본 축이 된다.
limits: 검증 시점 API 전체 건수와 수신 행이 23건뿐이라 전국 전체 통반을 담는지는 이 근거만으로 확인되지 않는다. 개인 단위 원천이 아닌 세대수 집계이므로 개별 세대나 인구 구성(연령·성별)은 알 수 없다. 개발계정은 일 10,000회 호출 제한이 있다.
