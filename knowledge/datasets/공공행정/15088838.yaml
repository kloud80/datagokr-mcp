summary_user: 경기도 시군별로 개발제한구역(그린벨트)의 행정구역 면적, 구역 면적과 비율, 구역 안 주민 수·세대 수, 해제 면적을 한 줄씩 담은 시군 단위 집계 자료다. 도시계획 담당자나 분석가가 어느 시군이 그린벨트 비중이 높고 그 안에 얼마나 많은 주민이 사는지, 해제 면적이 얼마인지를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시군 통계와는 시군명(sigun_nm)을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 시군별 개발제한구역(GB; Green Belt)의 현황을 담고 있으며, 행정구역 전체 면적 대비 GB면적과 그 비율, GB 내 주민 수, 세대 수, GB 해제 면적 등의 정보를 제공합니다. 주요 항목으로는 시군명, 행정구역면적, GB면적, 구역비율, GB주민수, GB세대수, GB해제면적이 포함되며, 도시개발, 환경보존 및 도시계획 수립에 필요한 기초 자료로 활용됩니다. 해당 데이터는 각 시군의 토지 이용 현황과 제한구역 내 인구 밀도를 파악하는 데 유용하며, GB 해제 여부와 그 추이에 따른 정책 평가 및 공간계획에도 활용될 수 있습니다.
