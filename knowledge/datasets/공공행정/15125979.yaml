summary_user: 국회입법조사처가 발간한 연구보고서 가운데 '지표로 보는 이슈' 간행물을 보고서 한 건 단위로 담으며, 보고서명(BOOKNM)과 PDF 파일명·다운로드 주소, 바로보기·뷰어 주소, 구분 코드, 등록일을 제공하는 전국 단위 비공간 목록이다. 정책 분석가나 기자, 국민이 특정 사회·경제 이슈를 국회입법조사처가 어떤 지표로 정리했는지 찾아보고 원문 PDF를 내려받을 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으므로, 국회입법조사처의 다른 보고서 목록과는 보고서명이나 같은 기관 기준으로만 맞춰 이어 쓴다.
