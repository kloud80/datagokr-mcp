description_portal: '평택시 홈페이지의 카드뉴스 관리 데이터는 시정 주요 정책, 행사, 생활정보 등을 시민에게 이해하기 쉽게 전달하기 위해 제작·게시한 카드뉴스의 현황을 관리하고, 대시민 소통의 효과를 분석하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 다양한 정책 정보를 확인할 수 있으며, 민간·연구기관은 홍보 콘텐츠 활용, 공공 커뮤니케이션 분석, 정보 접근성 향상 서비스 개발 등 여러 분야에서 데이터를 활용할 수 있습니다. 본 데이터에는 카드뉴스 제목, 게시일, 조회수 등의 항목이 포함되어 있어 시정 홍보 흐름과 시민 관심도를 분석하는 데 유용한 정보를 제공합니다. 이러한 자료는 행정 홍보의 투명성 강화, 콘텐츠 기반 정책 확산, 민관 협력형 정보서비스 창출 등 공공·민간 모두에 활용할 수 있는 데이터입니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
