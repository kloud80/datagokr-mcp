description_portal: '해당 자료는 거제시 외국인 주민의 체류자격별 분포와 지역별 현황을 종합적으로 파악하기 위한 것입니다. 경상남도 거제시 관내 체류자격별(유학생、 구직자  등) 외국인 주민 현황과 관련한 데이터를 제공합니다. 데이터 기준일자에서 기준 시점을 알 수 있으며, 해당 시점의 외국인 주민 현황을 반영하였습니다 본 자료는 행정업무 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.항목: 체류자격별, 면동별 외국인 주민 수 정보※ 체류자격별 및 면·동별로 분류된 자료로, 세부적인 지역별 현황 파악이 가능합니다.※ 총계가 기술연수 인원만큼 증가된 사항임.(총계에 기술연수는 제외되어함.)'
