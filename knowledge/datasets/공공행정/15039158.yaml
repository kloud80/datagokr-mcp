summary_user: 경상남도 내 관공서(사무소·행정복지센터)를 한 곳당 한 행으로 담은 목록으로, 시도·시군구·읍면동 구분과 우편번호·주소를 담으며 포털 설명상 2022년 12월 기준 305건이다. 주민이나 분석가가 '우리 읍면동을 담당하는 행정복지센터 주소가 어디인가', '시군별 관공서가 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구·읍면동 이름이나 주소 문자열을 맞춰 연결해야 한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 관공서 현황 데이터는 2022년 12월 기준 경상남도 내 관공서(사무소 및 행정복지센터)의 정보를 제공합니다. 기관의 우편번호와 주소의 상세정보를 제공합니다. 관공서의 구분단위를 시도, 시군구, 읍면동으로 구분하여 세부적인 관할 구역에 대한 정보를 파악할 수 있습니다. (데이터 구성 및 세부항목) 관공서 현황데이터는 시도, 시군구, 읍면동, 우편번호, 주소로 구성됩니다. 총 305건입니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다.
