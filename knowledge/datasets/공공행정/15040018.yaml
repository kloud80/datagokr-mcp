summary_user: 전북특별자치도 장수군의회 제9대 의회가 처리한 의안을 한 건씩 담은 파일로, 연도·회기·의안번호·건명·발의자·발의일·소관 위원회·처리 결과·공포일·공포번호를 기록한다. 주민이나 지역 언론·분석가가 '이번 의회에서 누가 어떤 조례안을 발의했고 가결돼 언제 공포됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 건명·의안번호 같은 이름 매칭이나 같은 기관(장수군) 단위로만 이어 쓴다.
description_portal: 전북특별자치도 장수군의 장수군 9대 의안 처리 현황에 대한 데이터를 제공하고자 합니다.데이터의 구성은 연도, 회기, 의안번호, 건명, 발의자, 발의일, 소관, 결과, 공포일, 공포번호에 대한 데이터로 구성되어 있습니다.연도는 제9대 의회의 업무 기간에 따라 2022년 7월부터, 2023년, 2024년, 2025년, 2026년 4월까지의 데이터로 구성되어 있습니다.추가적인 데이터가 필요한 경우 공공데이터포털(data.go.kr) 누리집의 데이터 제공 신청을 통해 신청하여 주시기 바랍니다.
