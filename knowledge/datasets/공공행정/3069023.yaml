summary_user: 경상남도 합천군이 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 원장 파일로, 업소명·소재지·업종·대표품목과 가격·영업시간·배달·주차 가능 여부를 포함한다(CSV 약 3.4KB의 소규모 파일). 합천 주민이나 방문객이 '합천에서 값싸고 주차 되는 식당이 어디인가'를 찾을 때나, 분석가가 지역 물가안정 모범업소의 업종·가격 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·소재지 주소를 매칭해 LOCALDATA 인허가 등 점포 원장과 잇는다.
description_portal: 해당 자료는 경상남도 합천군 착한가격 업소 현황에 관한 자료입니다.본 데이터는 경상남도 합천군의 업소명, 대표자, 소재지, 연락처, 업종, 대표품목, 가격, 영업시작시간, 영업종료시간, 배달가능여부, 주차가능여부 등의 데이터를 포함합니다.착한가격업소는 정부와 지방자치단체가 지정한 물가안정 모범업소로, 착한 가격과 깨끗하고 위생적인환경, 친절한 서비스를 통해 소비자들이 다시 찾고 싶어하는 업소 목록입니다.자세한 사항은 홈페이지를 참고하시기 바랍니다. https://www.goodprice.go.kr/
