description_portal: 본 데이터는 강원특별자치도 속초시 내 원룸 및 다가구주택 현황에 대한 자료이다. 항목에는 대지 위치 주소, 도로명 주소, 주용도 코드명, 기타 용도 내용이 포함되어 있으며, 단독주택, 근린생활시설 등 다양한 용도의 원룸형 및 다가구 주택 정보를 제공한다. 주거밀집지역, 인구분포, 주거환경 개선사업 등과 관련된 공간분석 자료로 활용 가능하며, 원룸 및 다가구주택의 용도 분포 현황을 파악할 수 있다. 주소 정보는 지번과 도로명 모두를 제공하여 공간 식별이 용이하고, 민간 개발 또는 주거정비 관련 정책 수립의 기초 자료로 활용된다. 데이터는 주기적으로 갱신되며, 속초시의 주거유형 파악과 도시관리계획 수립에 기여할 수 있도록 제공된다.
