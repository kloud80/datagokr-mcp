description_portal: 본 데이터는 연도별(2012년~2024년) 흡연 관련 민원과 단속 건수, 그리고 연령대별 흡연 민원 대상자 수를 함께 제공하고 있어 흡연 문제의 연령 분포와 행정 대응 수준을 동시에 파악할 수 있는 자료입니다. 19세 미만부터 70세 이상까지 세분화된 연령 항목을 포함하고 있어 특정 시기마다 어떤 연령층에서 민원이 집중되었는지 추세 분석이 가능합니다. 또한 연도별 민원건수와 단속건수를 비교함으로써 민원 대비 실제 단속 비율을 살펴볼 수 있어 금연 정책의 집행 수준, 현장 대응 강도, 행정적 대응 흐름 등을 이해하는 데 참고자료로 활용될 수 있습니다. 장기적 변화를 통해 흡연 관련 민원이 증가·감소하는 시점도 파악할 수 있어 정책 수립이나 예방 활동 기획 시 의미가 있습니다.
