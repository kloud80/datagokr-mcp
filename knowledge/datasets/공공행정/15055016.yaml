description_portal: '인천광역시가 제공하는 주민등록 전입지별 인구이동 (타시도 -> 인천) 통계는 타 시/도에서 인천광역시로 전입한 인구의 규모를 전입지별로 집계한 연도별 통계 자료입니다. 이 데이터는 인천광역시의 인구 유입 현황과 주요 인구 유입 경로를 파악하여, 도시 계획, 주거 정책, 사회 기반 시설 확충 등의 기초 자료로 활용됩니다.<주요 구성 항목>-연도별: 인구 이동 현황이 2014년부터 2023년까지 매년 집계되었습니다.-전입지별: 인천으로 전입한 인구가 전국 16개 광역 시/도 (서울, 부산, 대구, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주) 별로 구분됩니다.'
