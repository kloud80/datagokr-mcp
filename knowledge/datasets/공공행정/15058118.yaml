summary_user: 지방자치단체별·회계연도별로 주민1인당 자체수입액과 그 구성인 지방세·세외수입, 주민등록 인구수를 담은 집계 지표로, 범위는 전국입니다. 분석가나 주민이 '우리 시·군·구의 1인당 자체수입이 같은 광역 안 다른 지자체보다 얼마나 높은가'처럼 재정 자율성을 비교하는 데 쓴다. 전역 조인 키는 없고, 자치단체 코드(laf_cd)·광역 코드와 자치단체명으로 같은 지방재정365 계열 데이터나 주민등록 인구 통계에 이름·코드 매핑으로 잇는다.
description_portal: 지방자치단체의 주민1인당 자체수입액은 자치단체 재정자립도를 평가하는 핵심지표로, 지방세와 세외수입을 합산한 자체수입 총액을 해당 자치단체의 주민등록 인구수로 나눈 값입니다. 주민1인당 자체수입이 높을수록 중앙정부에 대한 의존도가 낮고, 재정운영의 자율성이 높다는 것을 의미합니다.주민1인당 자체수입액 정보는 2001회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 주민1인당자체수입액, 지방세, 세외수입, 인구수 항목이 제공됩니다.
