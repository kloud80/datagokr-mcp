description_portal: 대구광역시 서구 개인정보제공내역에 대한 데이터입니다. 개인정보파일명, 제공법적근거, 제공 받는 기관 등의 정보가 포함되어 있습니다.본 데이터는 대구광역시 서구청 각 부서에서 개인정보를 제3자에게 제공하거나 위탁한 내역을 기록한 자료이다. 제공 방식은 위탁, 공문서, 파일, CCTV 영상 등 다양하며, 제공 대상 기관은 공공기관, 민간사업자, 사회복지기관 등이다. 개인정보 항목은 성명, 주민등록번호, 주소, 연락처, 차량정보, 과세정보 등이 포함된다. 제공의 목적은 교육, 수사, 과세, 복지서비스 등 공공업무 수행이며, 법적 근거에 따라 제공 시점과 기간이 명시되어 있다. 데이터에는 제공 기관, 개인정보 파일명, 제공 항목, 제공 기간, 제공 사유 및 법적 근거 등이 항목별로 체계적으로 정리되어 있어 활용 기관 및 분야별 개인정보 제공 현황을 종합적으로 파악할 수 있다.
