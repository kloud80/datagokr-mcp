description_portal: 전산보고란 주유소에서 매주 거래상황을 보고하는 방식중 하나로, 판매량을 자동 집계하여 보고할 수 있는 프로그램을 사용합니다.전산보고주유소는 보고 내용의 임의적인 수정이 불가능하여 소비자가 좀 더 믿고 주유할 수 있으며 주유소는 매주하는 거래상황 보고를 편리하게 수행할 수 있습니다. 해당 데이터는 전국 영업주유소 중 전산보고의 방법으로 거래상황을 보고하는 주유소 리스트이며 현재 약 36%의 주유소가 전산보고 방식으로 수급보고를 하고 있으며 석유관리원은 매년 전산보고 지원사업을 수행하여 전산보고 주유소를 확대하고 있습니다.
