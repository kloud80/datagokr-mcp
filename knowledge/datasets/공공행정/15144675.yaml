description_portal: 이 데이터는 의회에서 자주 사용되는 전문용어를 정리한 정보로서, 각 용어의 고유번호, 초성, 명칭, 상세한 설명을 포함합니다. 의회 전문 용어 데이터를 사용함으로써 시민 및 연구자가 의회의 복잡한 절차나 표현을 이해하는 데 도움을 받을 수 있습니다. 이 데이터는 입법과정이나 회의 절차 등과 관련된 용어를 체계적으로 정리해 놓은 자료로, 의회 용어의 표준화를 촉진하는 데 기여합니다. 또한 일반 시민, 학생, 연구자 등이 의회 관련 자료를 해석하거나 학습할 때 참고자료로 활용할 수 있습니다.시간적 범위는 1991년부터 데이터 기준일자까지이나, 데이터 특성상 갱신 빈도가 높지는 않습니다.
