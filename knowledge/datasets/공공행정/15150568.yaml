description_portal: 서울특별시 강북구 구의회 인터넷 방송은 강북구의회 누리집에 수록된 자료입니다. 세부적인 영상은 강북구의회 누리집(https://council.gangbuk.go.kr/) 인터넷방송 다시보기 메뉴를 통해 확인할 수 있습니다.서울특별시 강북구 구의회 인터넷방송 데이터는 고유번호,의회코드,대수,회기,위원회 코드,생방송 시작일시,생방송 종료일시,생방송 채널,생방송 설명,등록일,최종수정일,홈페이지주소로 구성되어 있습니다.회의 동영상을 임의로 저장·편집·배포할 경우 저작권법 제 124조 및 제 136조에 의거하여 처벌 받을 수 있음을 유념하시기 바랍니다.
