description_portal: 진천군에서 생산한 홍보 보도자료 목록으로 온나라 프로그램에 등록된 자료를 추출하여 등록하였습니다.생산 기간은 2016년부터 2024년까지 자료입니다. 해당 자료는 각 부서에서 진천군 홍보미디어실로 보도자료로 배포해 줄 것을 공문으로 시행한 것입니다. 이를 바탕으로 홍보팀은 기사형 문체로 수정하고 부족한 내용을 첨가하여 탈고하게 됩니다. 이후 방송사, 신문사를 포함한 각 언론사에 보도자료 형식으로 제출합니다. 특히, 진천군의 군정성과를 잘 설명할 수 있는 자료의 경우 기획 보도자료로 재작성되어 많은 사람이 지방자치단체에서 진행하고 있는 각종 사업 진행 상황을 정확히 파악할 수 있게 합니다.
