description_portal: '○ 통계개요* 통계명 : 자살률(연령별)* 통계종류 : 서울시 사망인구의 사망원인 중 자살 사망자수를 제공하는 지정ㆍ가공통계* 근거법령 :「가족관계의 등록 등에 관한 법률」제84조에 의한 사망신고와 그 기재사항* 작성목적 : 대한민국 국민의 정확한 사망원인 구조를 파악하여 국민복지 및 보건의료정책수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울시 → 통계청* 공표주기 : 정기(매년, 9월 기준)* 공표범위 : 지역- 서울시 및 자치구내용- 서울시 자살 사망인구의 성별ㆍ연령별 사망자수 및 자살률○ 용어설명* 사망원인 : 사망진단서에 기록되는 사인이란 사망을 유발했거나 사망에 영향을미친 모든 질병, 병태 및 손상과 이러한 손상을 일으킨 모든 사고 또는 폭력의상황을 말함* 연령별 자살률 : (특정연령의 자살사망자수 / 특정연령의 연앙인구)*100,000○ 기 타○ 출 처 : 통계청「사망원인통계」'
