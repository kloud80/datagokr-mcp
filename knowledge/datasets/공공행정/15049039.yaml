description_portal: 본 데이터는 공공사업 수행 중 발생한 잔여지에 대한 보상 현황을 사업정보 형태로 제공한다. 잔여지는 공공사업 부지 경계 밖에 위치한 소규모 토지로, 사업 추진 과정에서 일부가 편입되지 않아 남은 부지를 말한다. 본 데이터에는 사업종류(단지개발, 기반시설 등), 사업명, 사업시행자, 토지 면적(㎡), 토지 보상금액(원), 토지 외 보상 건수와 보상금액이 포함된다.사업시행자는 국토교통부를 비롯한 중앙행정기관, 지방자치단체, 공공기관이 해당되며, 제공되는 자료를 통해 보상 규모와 자산처리 현황을 한눈에 확인할 수 있다.이 데이터는 사업별 잔여지 보상 내역을 체계적으로 파악할 수 있어, 공공부지 정리 실적 관리, 보상 행정의 투명성 확보, 정책 수립, 재정 분석 등 다양한 업무에 활용 가능하다.
