description_portal: 서울특별시 서초구 내 거리가게 현황을 나타낸 것으로, 각 업체의 시설물명, 도로명주소, 지번주소, 위도, 경도, 데이터 기준일자 등의 정보를 포함하고 있습니다. 본 데이터는 서초구 관내 거리가게 시설물 분포를 파악하고, 거리가게 현황을 종합적으로 분석하기 위한 기초 행정자료로 활용됩니다. 이를 통해 지역 내 거리가게의 업종 구성과 공간적 분포, 산업 특성 등을 이해할 수 있으며, 그동안 단속과 규제 위주의 거리가게 관리정책에서 거리가게 운영자가 조건에 맞게 도로점용허가를 신청할 경우 등 해당 정보를 바탕으로 지역 거리가게의 발전 방향을 모색하고, 거리가게에 대한 지원 정책을 수립하는 데에도 유용하게 활용됩니다. 또한 거리가게 가이드라인의 원활한 정착과 시행을 위해서 자치구 조례및 지침 등을 마련하여, 시민및 상인들에게 취지 및 내용을 홍보,부작용과 대안검토 등 긴밀한 업무협의 자료에 사용될 수 있습니다.
