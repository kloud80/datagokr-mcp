description_portal: ○ 전국의 모든 사업체를 대상으로 지역별 사업체의 규모 및 분포를 파악○ 사업체 단위 통계조사의 모집단 명부로 활용조사기준일(또는 조사일) 현재 국내에서 산업활동을 수행하고 있는 종사자 1인 이상 모든 사업체※ 단, 개인 농·림·어가, 군부대, 노점상, 국제·외국기관, 가사서비스업은 제외사업체 조사 데이터는 업종별·규모별·지역별로 등록된 모든 사업체의 위치, 사업자 형태, 종사자 수, 자본금 규모, 개업·폐업 이력, 주요 업종 및 서비스 내용 등을 종합적으로 수집한 자료입니다. 이 데이터는 지역 산업 구조 파악, 고용 여건 및 경제 활성화 분석, 세수 기반 마련, 창업 및 폐업 동향 조사, 민원 대응 및 규제 정책 수립, 공간 기반 산업 육성 전략 수립 등에 활용될 수 있습니다. 또한 GIS 및 통계 분석 도구와 결합하면 업종별 밀집도 지도화, 시계열 업종 변화 분석, 지역경제 정책 효율 평가 등의 기초자료로 활용성이 높습니다.
