description_portal: 온라인쇼핑동향조사는 온라인쇼핑몰을 통한 전자상거래 동향을 분석하여 정부의 정책 수립, 기업의 경영 계획 수립, 연구소 및 각종 협회 등에 필요한 자료 제공을 위해 실시합니다.정보통신 설비 등을 이용하여 재화 및 용역을 거래할 수 있도록 설정된 가상의 영업장(가상의 상점)을 "몰"이라고 지칭하며(전자상거래 표준약관 제2조 1호), 온라인쇼핑동향조사에서는 기업, 소비자간(B2C) 거래를 주로 하는 몰을 별도로 "온라인쇼핑몰"이라고 정의합니다. 결과는 보도자료(통계청 홈페이지), 집계표 자료(KOSIS 국가통계포털)에 게시되며, 온라인쇼핑동향은 월별로, 온라인 해외 직접 판매,구매는 분기별로 공표됩니다.
