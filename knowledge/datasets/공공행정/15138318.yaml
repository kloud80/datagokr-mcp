description_portal: '광주광역시 시민 누구나 대여해서 사용할 수 있는 민속놀이기구 정보와 대여현황입니다. 민속놀이기구정보: 줄넘기, 줄다리기, 투호, 고누판, 승경도판시민 누구나 전통문화를 쉽게 접하고 체험할 수 있도록 민속놀이기구를 대여해 주는 서비스를 운영하고 있습니다. 대여할 수 있는 기구에는 줄넘기, 줄다리기, 투호, 고누판, 승경도판 등이 포함되어 있으며, 시민들은 필요에 따라 신청하여 사용할 수 있습니다.이 서비스는 시민들이 전통놀이를 체험하고 공동체 활동에 활용할 수 있도록 지원하는 데 목적이 있습니다.'
