description_portal: 본 데이터는 교육부 교원소청심사위원회에서 제공하는 연도별 교원소청심사 처리현황에 관한 공식 통계자료입니다. 교원의 징계처분, 불이익 처분, 신분상 불이익 등에 대한 소청심사 업무를 담당하는 교원소청심사위원회의 업무처리 실적을 연도별로 체계적으로 정리한 데이터로, 교육정책 수립과 교원 권익보호 관련 연구에 활용할 수 있는 중요한 기초자료입니다.주요 포함내용으로는 연도별 접수건수, 전년도 이월건수를 포함한 처리대상 건수와 실제 처리결과를 세분화하여 제공합니다. 실제 처리결과는 절차상 하자로 인한 처리, 교원의 주장이 받아들여진 인용사례(취소·변경), 교원의 주장이 받아들여지지 않은 기각사례, 법정 요건을 충족하지 못한 각하사례, 그리고 소청인이 스스로 포기한 취하·이송사례 등으로 구분되어 있습니다.이 통계자료는 교원의 권익보호 제도 운영현황을 객관적으로 파악할 수 있게 해주며, 교육행정의 투명성과 공정성을 검증하는 지표로 활용됩니다. 또한 교원 징계제도의 운영실태 분석, 교원 권익보호 정책의 효과성 평가, 교육행정 분쟁 해결 패턴 연구 등 다양한 교육정책 연구에 중요한 기초자료로 활용되고 있습니다.
