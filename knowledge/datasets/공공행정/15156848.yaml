description_portal: '용인도시공사의 직원 채용정보 현황입니다. 2024년 7월 데이터부터 제공되며 연간 1회 갱신됩니다. 해당 데이터를 통해 용인도시공사의 채용 현황을 파악 및 활용할 수 있습니다.* 용인도시공사_채용정보 현황 컬럼별 상세설명해당 데이터에는 채용공고번호, 채용구분(정규직, 기간제, 인턴), 채용내용, 채용분야(직렬), 채용인원, 공고일자, 접수시작일자, 접수마감일자 정보를 포함하고 있습니다.- 공고번호: 채용공고 식별 번호- 채용구분: 정규직, 기간제, 인턴 채용성격 구분- 채용내용: 채용에 대한 내용- 채용분야: 채용 분야(직렬)에 대한 내용- 재용인원: 해당 채용공고의 각 채용 분야(직렬) 채용 인원- 공고일자: 채용 공고 시행 일자- 접수일자: 채용 접수 시작일자- 접수마감: 채용 접수 마감일자'
