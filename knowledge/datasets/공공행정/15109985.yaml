description_portal: 이 데이터는 한국남부발전 본사 및 각 지역 사업소에서 운영하는 내PC지킴이 보안 프로그램의 월별 점수 현황을 정리한 자료입니다. 본사, 하동, 신인천, 부산, 남제주, 영월, 안동, 삼척, 신세종 등 사업소별로 매월 기록된 보안 점수를 제공하여, 조직 내 사이버 보안 관리 수준을 수치로 확인할 수 있습니다. 이를 통해 각 사업소의 보안 관리 추이를 비교하거나, 특정 시기의 보안 강화 성과를 분석할 수 있으며, 정보보안 정책 수립 및 실행 효과를 평가하는 데 유용합니다. 또한 공공기관 보안 현황 모니터링, 사이버 보안 인식 제고, IT 보안 연구 등 다양한 분야에서 기초 자료로 활용될 수 있습니다.
