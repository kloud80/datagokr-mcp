summary_user: 온비드에 등록된 물건 중 최근 일주일간 관심 저장이 가장 많은 상위 20개를 부동산·동산·자동차 유형별 순위로 담으며, 각 물건의 입찰기간, 감정평가금액, 최저입찰가격, 재산유형(압류재산·국유재산 등), 처분방식(매각·임대)을 함께 담는다. 공매 입찰을 준비하는 개인이나 사업자가 "지금 입찰 중인 자동차 공매 물건 중 사람들이 가장 많이 관심을 두는 것은 무엇이고 감정가 대비 얼마에 나와 있나"를 확인하는 데 쓴다. 전역 조인 키는 없고, 물건관리번호(cltrMngNo)와 공매조건번호를 함께 넣어 온비드 물건 입찰정보 조회로 이어 쓰거나 재산유형·용도분류 코드로 다른 온비드 목록과 맞춰 쓴다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지에 등록된 물건 중 일주일간 가장 많이 관심 저장된 상위 20개 물건 정보입니다. 물건 유형(부동산, 동산, 자동차)에 따라 관심 저장 수를 기준으로 한 물건 순위와 입찰종료일자, 최저입찰가격, 감정평가금액 등 주요 물건 정보를 조회할 수 있습니다. 순위물건은 입찰마감 전인 (입찰 준비중이거나 입찰 진행 중) 물건만 조회됩니다. 순위물건의 순위는 참고용으로만 활용하시기 바랍니다. 필수 입력 조건 : 물건유형구분(cltrDivNm) (부동산|동산|자동차 중 입력)'
team:
  dept: 디지털시스템실
