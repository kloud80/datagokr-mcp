description_portal: 인천도시공사 홈페이지(iH)를 방문하시는 고객들의  접속자수에 대한 자료로 1년치 자료를 제공하고 있습니다. 인천도시공사는  방문자수 현황 (연번, 날짜,  일별 방문자수)으로 구성된 데이터이며, 대표 홈페이지의 원할한 서비스 제공을 위해 방문자 수를 기록하여 접속현황을 파악하기 위해 방문자에 대한 접속자수 현황을 기록하고 제공합니다.데이터 건수에 대해 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.인천도시공사 홈페이지는 https://www.ih.co.kr/ 로 접속하시면 확인하실 수 있습니다.
