description_portal: 반려동물 등록 현황을 정리한 자료로, 등록된 반려동물의 기본 정보와 등록 현황 등 동물 관리 행정에 필요한 주요 정보를 포함하고 있다. 본 자료는 반려동물 등록 현황과 관리 대상 반려동물의 분포 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 반려동물 등록 현황에 대한 체계적인 관리를 통해 반려동물 양육 현황과 등록률을 분석하고, 유실·유기 동물 예방 및 동물 보호 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 반려동물 등록 관리, 동물 보호 및 복지 업무 수행, 민원 대응과 함께 관련 통계 산출 및 보건·동물 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 책임 있는 반려동물 양육 문화 정착과 동물 복지 수준 향상을 위한 관리 체계를 강화하고, 사람과 동물이 공존하는 안전한 생활환경 조성을 위한 정책 추진의 기초자료로 활용되며, 지속적인 동물 보호 및 보건 행정 업무 수행을 지원하는 행정자료로 활용된다.
