description_portal: 경상북도 경주시에서 체결한 공사, 용역, 물품 계약에 대한 이력과 상세 정보를 수록한 데이터이다. 본 데이터는 계약관서, 계약명, 계약유형, 계약방법, 계약일자, 계약금액, 착공일자, 준공일자, 계약상대자, 계약상대자 주소 등 다양한 항목으로 구성되어 있다. 수의계약, 일반입찰, 제한경쟁 등 여러 계약 형태에 대한 구분 정보가 포함되어 있으며, 하도급 업체명과 대표자명, 계약금액, 계약기간 등도 확인 가능하다. 이 데이터는 행정의 투명성을 제고하고 예산집행 내역을 공개함으로써 시민의 알권리 충족과 민간 활용을 촉진하기 위한 목적으로 제공된다. 계약과정 전반의 정보를 포함하며, 경주시 계약정보공개시스템 기반의 파일데이터로 개방된다.
