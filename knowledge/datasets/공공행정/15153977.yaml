description_portal: '본 데이터는 국가통계마이크로데이터통합서비스(MDIS)*시스템 검색조건의 스크랩 및 스크랩항목에 관한 내용입니다. - 검색조건 스크랩: 검색조건을 저장해서 쉽게 저장된 조건으로 검색하도록 하는 테이블입니다. - 검색조건스크랩항목: 저장된 검색조건 항목 설명 테이블입니다. *  국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다.  이에 국가데이터처는 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.'
