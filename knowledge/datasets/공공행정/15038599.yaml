description_portal: 서울특별시 서초구 홈페이지 보도자료에 대한 데이터로 글제목, 등록일, 작성부서 등에 대한 정보 확인이 가능합니다.지방자치단체의 투명한 행정운영과 시민의 알권리 보장을 위한 정보공개 확대 필요성이 증대되고, 시정 소식 및 정책 정보에 대한 시민과 언론의 접근성 향상 요구가 높아지며, 행정 투명성 제고와 효율적인 정보 전달 체계 구축을 위한 체계적인 보도자료 관리 필요성이 증가함에 따라 서울특별시 서초구는 2005년 4월 부터 현재까지 발표한 시정 소식, 정책 발표, 행사 안내 등 다양한 분야의 보도자료 전문과 담당부서 정보를 종합적으로 제공하고 있습니다. 개방 데이터는 2004년 4월 부터의 보도자료 등록일, 글제목, 담당부서,조회수 등 총 4개 항목의 시계열 정보를 포함하고 있습니다.언론사·기자는 시정 관련 보도자료 검색 및 취재 소재 발굴에 활용하고, 시민·시민단체는 시정 현황 파악 및 정책 모니터링, 시민참여 기회 확인에 활용하며, 연구기관·학계는 지방자치단체 정책 동향 분석 및 행정학·정책학 연구 자료로 활용할 수 있습니다.서초구는 구민과 언론에 정확하고 투명한 구정 정보를 제공하기 위해  각종 정책, 사업, 행사, 성과를 담은 보도자료를 상시 공개하고 있습니다. 보도자료 페이지에서는 최신 구정 소식부터 주요 이슈까지한눈에 확인하실 수 있으며, 누구나 자유롭게 열람하실 수 있습니다. 서초구의 다양한 정책과 변화된 모습을 지금 바로 확인하실수 있습니다.
