summary_user: 국회 회의록을 대(代)별로 나눠 그 대수에 열린 위원회와 소위원회의 이름·코드, 회의 구분을 한 줄씩 담은 목록이며, 범위는 전국 단위이고 지역 정보는 없다. 연구자나 시민이 "21대 국회에는 어떤 위원회와 소위원회가 있었고, 각각의 회의록을 찾으려면 어떤 위원회 코드를 써야 하나"를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 같은 국회 open.assembly.go.kr 계열 회의록·의안 데이터와는 대수(TH)와 위원회 코드·이름(CMIT_CD, CMIT_NM)을 맞춰 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다.
