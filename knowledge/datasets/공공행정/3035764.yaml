summary_user: 용인시 소비자 물가를 구분(개인서비스요금·농산물·축산물·수산물 등)·품목·규격 및 단위별로 조사해 처인구·기흥구·수지구 세 구의 가격을 나란히 담은 소규모 표 파일(csv 약 5.8KB)이다. 용인시민이나 분석가가 '같은 품목이 처인구와 수지구에서 얼마나 다른 가격에 팔리는가'처럼 구별 생활물가 차이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명이나 구 이름을 직접 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 경기도 용인시_물가 조사 정보는 용인시의 소비자 물가 동향을 구별·품목별·규격 및 단위별로 조사하여 정리한 데이터다.개인서비스요금, 농산물, 축산물, 수산물 등 다양한 생활필수 품목의 가격 정보를 포함하며, 처인구·기흥구·수지구 등 지역별로 세분화된 가격 현황을 제공한다.이 데이터는 ① 생활물가 추이 및 인플레이션 분석, ② 지역 간 물가 격차 파악, ③ 소비자·가계의 가격 정보 제공, ④ 행정기관의 물가 안정 정책 및 지원 대책 수립 등 다방면에서 활용할 수 있다.정기적으로 갱신되어 최신 가격 동향을 반영하며, 경제 연구, 정책 수립, 시민 생활 안정화 방안 마련에 필요한 기초 자료로 쓰인다.
