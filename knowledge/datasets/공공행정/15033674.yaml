summary_user: 강원특별자치도 시군별 마을회관 1,914건을 시설별 한 행으로 담은 파일 데이터로, 시군명·시설명·마을명·도로명주소·비고를 싣는다. 지자체 담당자나 분석가가 '우리 시군에 마을회관이 어디에 몇 곳 있는가' 같은 질문에 쓴다. 도로명주소(address)를 조인 키로 삼아 주소 기반의 다른 생활 시설 목록과 이어 쓴다.
description_portal: 강원특별자치도 내 시군별 마을회관에 대한 데이터로 시군명,  시설명,  마을명, 소재지 도로명 주소 등의  항목을 제공합니다.데이터에는 연번, 시도명, 시군명, 시설명(마을회관명), 마을명, 소재지(도로명주소), 비고란 등이 포함되어 있으며, 각 마을회관의 위치 정보와 행정구역별 분포를 체계적으로 확인할 수 있습니다.본 자료는 지역 공동체 기반시설 분석, 고령층, 취약계층 이용시설 관리, 지역 커뮤니티 공간 운영 정책 수립 등 다양한 행정 업무에 활용될 수 있는 기초자료로서 가치가 높습니다.또한 도민들에게 지역별 마을회관 정보를 제공하여 지역 주민의 이용 편의성 향상에도 기여합니다.
