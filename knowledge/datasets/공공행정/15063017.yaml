description_portal: '이 데이터는 2026년 6월 19일 기준으로 충청남도 내 건설공사와 관련된 토공(土工) 및 토석 발생 현황을 정리한 자료입니다. 번호는 각 건설공사 건을 구분하기 위한 일련번호이며, 시군명은 공사가 진행되는 지역을 나타냅니다. 토공유형은 토공 작업의 성격을 구분하며, 토석종류는 발생하는 토석의 종류를 보여줍니다. 용도 항목은 발생한 토석의 활용 목적(예: 성토, 매립 등)을 기록합니다. 또한 **잔여량(㎡)**은 공사 현장에서 남아 있는 토석의 양을 수치로 나타냅니다. 공사명은 해당 건설 프로젝트의 이름을 보여주며, 발생예정일은 토석 발생이 예상되는 날짜를 기록합니다. 위치는 공사 현장의 구체적인 지리 정보를 제공하고, 등록일은 데이터가 입력된 날짜를 나타냅니다. 이 데이터는 충청남도의 건설공사 관리, 토석 자원 활용, 지역별 토공 발생 현황을 파악하는 데 활용될 수 있으며, 향후 토공 자원 재활용 및 건설폐기물 관리 정책을 수립하는 데 중요한 근거자료가 됩니다.'
