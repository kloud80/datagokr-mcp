description_portal: '전남광주통합특별시 여수시  장애인 전용 주차구역 위반 과태료 부과 건수 및 부과액 (최근3년, 2023년, 2024년, 2025년) 자료를 공공데이터 등록을 통해 제공합니다. 1. 운영목적 : 보행장애인의 주차 및 이동 편의 도모 2. 법적근거 : 「장애인・노인・임산부 등을 위한 편의증진보장에 관한 법률」 제17조3. 이용 가능 차량 : 장애인 자동차 표지 중 ‘주차가능’ 표지 발급 차량(표지를 부착하고 장애인이 탑승하였거나 직접 운전한 경우만 가능)4. 이용 불가능 차량  - 장애인 자동차 표지가 없거나 ‘주차불가’ 차량, ‘주차가능’차량이지만 장애인이 미탑승한 차량5. 위반시 과태료  - (불법주차) 10만원: 이용 불가능 차량이 장애인주차구역에 주차한 경우  - (주차방해) 50만원: 주차구역 진입로나 앞・뒤・옆 측면, 주차구역 안에 물건을 쌓거나 주차를 방해한 경우  - (부당사용) 200만원: 대여·양도, 위·변조된 표지, 차량번호 상이한 표지, 유효기간 만료 등 부당사용한 경우'
