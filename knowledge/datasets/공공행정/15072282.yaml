description_portal: 본 데이터는 지역 내 옥외광고물의 허가·신고·관리 업무를 수행하기 위해 필요한 법정동 코드, 행정동 코드, 행정구역 명칭 등 기초 행정정보를 체계적으로 정리한 자료입니다.옥외광고물 설치 기준, 관리 대상 구역 구분, 허가구역 판단 등을 위해 필수적으로 활용되는 기본 공간정보를 포함하고 있으며, 구·동 단위의 세부 행정구역 체계와 코드값을 통일된 형식으로 제공합니다.또한 본 데이터는 옥외광고물 관련 행정 절차(허가 검토, 현수막·간판 설치 관리, 행정지도, 위반광고물 정비 등)의 정확성을 높이고 업무 효율화를 지원하기 위해 구축되었으며, 타 행정시스템(도시디자인과, 건축과, 도로점용, 민원행정 등)과 연계하여 사용할 수 있도록 구조화되어 있습니다.행정구역 변경, 코드 개편 등 정기적인 변동 사항을 반영할 수 있는 구조로 설계되어 있어, 옥외광고물의 위치 확인, 설치 가능 여부 판단, 관리대장 작성 등 실무 전반에서 기초 참조자료로 활용됩니다.
