description_portal: 이 데이터는 충청북도 사진자료실에서 제공하는 사진 자료의 메타정보를 정리한 것입니다. 각 사진은 사진 번호, 사진파일명, 파일 크기, 파일 넓이 및 높이, GPS 정보 유무, 위도·경도 값, EXIF 존재 여부, 저장일자로 구성돼 있습니다. 사진파일명은 규칙적인 숫자 조합으로 구성돼 있어 분류와 검색에 활용 가능하며, 전체 데이터는 1884년부터 2025년 11월까지의 사진 정보를 포함하고 있습니다. 이 자료는 사진 보관 현황 관리, 연도별 촬영 자료의 메타데이터 파악 등 행정적 활용을 위해 구조화된 형태로 제공되는 목록입니다.
