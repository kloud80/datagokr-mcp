summary_user: 농식품공공데이터포털에 개방된 산림 분야 데이터셋의 목록을 데이터셋·개별 데이터 단위로 담는 메타데이터 카탈로그로, 데이터셋명·설명·기관·담당자·키워드·등록일·이용허락범위·업데이트주기·제공 형태(오픈API·파일·지도 등)와 링크를 포함하며 범위는 전국·비공간이다. 연구자나 개발자가 '산림 관련 공공데이터로 어떤 것이 있고, API나 파일로 받을 수 있는지, 갱신 주기는 어떤지'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 데이터셋명·기관명 같은 이름 매칭이나 공공데이터포털URL·링크URL로 원본 데이터셋을 찾아가는 방식으로만 잇는다.
description_portal: '농식품 공공데이터 포털에 개방된 산림 데이터 목록은 forest 데이터셋의 구성 요소 및 관련 정보를 포함하고 있습니다. 이 데이터에는 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자 권리 포함 유무, 상위 분류, 제3자권리, 이용허락 범위, 업데이트 주기, 서비스 유형 등의 다양한 정보를 담고 있으며, 이는 연구 및 정책 수립, 환경 보전 등 다양한 분야에서 활용될 수 있습니다. 데이터는 주요 내용을 중심으로 구성되며, 사용자가 필요한 정보를 쉽게 확인할 수 있도록 설계되었습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 데이터셋ID(문자형) : 해당 데이터셋의 고유 식별자, 데이터셋명(문자형) : 데이터셋의 제목, 데이터셋설명(문자형) : 데이터셋에 대한 자세한 설명, 기관명(문자형) : 데이터를 등록한 기관의 이름, 담당자명(문자형) : 담당자의 이름, 전화번호(숫자형) : 담당자의 연락처, 키워드(문자형) : 관련 키워드, 기타 유의사항(문자형) : 추가 설명, 등록일(숫자형) : 데이터가 등록된 날짜, 데이터ID(문자형) : 개별 데이터의 식별자, 데이터명(문자형) : 데이터의 이름, 데이터설명(문자형) : 데이터에 대한 추가적 설명 등으로 구성되어 있습니다.'
