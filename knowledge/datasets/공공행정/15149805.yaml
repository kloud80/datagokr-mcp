description_portal: 이 데이터는 한국수력원자력㈜의 개방시설 목록 자료입니다. 한국수력원자력은 유휴 인프라의 효율적 활용 촉진 및 지역사회와의 상생을 도모하기 위하여, 지역주민, 방문객, 외부 이용자 등이 이용할 수 있는 주차장, 공원, 체육시설, 회의실 등 다양한 개방시설을 운영하고 있습니다. 관련 정보를 쉽게 확인하여 이용자들의 접근성을 높이고 편의성을 증대시키기 위해 해당 데이터를 공개합니다.이 데이터는 연번, 기관명, 지역, 시설명, 시설유형(대), 시설유형(중) 정보를 포함하고 있습니다. 데이터 형식은 CSV 파일 형식입니다. 이 데이터의 개방을 통해 한국수력원자력의 시설 활용도가 높아지고, 지역 주민의 생활 편의 증진에도 기여할 것으로 기대됩니다.
