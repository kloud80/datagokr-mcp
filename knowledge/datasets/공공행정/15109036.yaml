summary_user: 대전광역시 서구의 행정동·상권(가수원상점가, 한민시장 등)별로 연월 단위 유동인구의 성별 분포를 비율로 집계한 통계 파일로, 범위는 서구 한 시군구이고 행정단위는 읍면동입니다. 상권 분석가나 창업 예정자가 '서구의 특정 상권은 달마다 남녀 중 어느 쪽 유동인구 비중이 큰가'를 확인하는 데 쓴다. 전역 조인 키가 없어 행정동코드·행정동명이나 상권명을 이름·코드로 맞춰 같은 서구의 점포·인허가(LOCALDATA) 자료나 다른 행정동 통계와 이어 쓴다.
