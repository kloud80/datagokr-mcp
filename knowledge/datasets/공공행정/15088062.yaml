description_portal: 지방자치단체의 투명한 행정운영과 시민의 알권리 보장을 위한 정보공개 확대 필요성이 증대되고, 시정 소식 및 정책 정보에 대한 시민과 언론의 접근성 향상 요구가 높아지며, 행정 투명성 제고와 효율적인 정보 전달 체계 구축을 위한 체계적인 보도자료 관리 필요성이 증가함에 따라 충청남도 보령시는 2019년 1월 1일부터 현재까지 발표한 시정 소식, 정책 발표, 행사 안내 등 다양한 분야의 보도자료 전문과 담당부서 정보를 종합적으로 제공하고 있습니다.개방 데이터는 2019년 1월 1일부터의 보도자료 등록일, 제목, 보도자료 내용, 담당부서 등 총 4개 항목의 시계열 정보를 포함하고 있습니다.언론사·기자는 시정 관련 보도자료 검색 및 취재 소재 발굴에 활용하고, 시민·시민단체는 시정 현황 파악 및 정책 모니터링, 시민참여 기회 확인에 활용하며, 연구기관·학계는 지방자치단체 정책 동향 분석 및 행정학·정책학 연구 자료로 활용할 수 있습니다.
