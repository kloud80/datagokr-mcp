summary_user: 국가법령정보센터에서 삭제 처리된 법령·행정규칙·자치법규·학칙공단 등의 데이터 목록을 건별로 담으며, 각 건은 일련번호, 구분명, 삭제일자로 식별되고 범위는 전국·비공간이다. 법령 데이터를 동기화하는 개발자나 분석가가 "내가 보관 중인 법령·해석 데이터 중 원천에서 삭제된 건은 무엇이고 언제 삭제됐나"를 확인해 변경을 감지하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 법제처 목록·본문 데이터와는 구분명과 일련번호를 대응시키는 방식으로만 이어 쓴다.
description_portal: 삭제 데이터 목록 조회는 국가법령정보센터에서 제공하는 법령, 행정규칙, 자치법규, 학칙공단의 삭제된 목록 정보를 제공합니다.  본 서비스는 각 부처에서 법령 해석 요청 후 처리되었으나 이후 삭제된 해석 사례들의 목록을 제공합니다. 삭제 사유는 법령 개정, 중복 해석, 질의 철회 등 다양하며, 데이터에는 해석 일련번호, 안건명, 질의 기관, 삭제일자, 삭제 사유 등의 항목이 포함되어 있습니다. 해당 목록은 삭제된 건에 대한 이력 정보를 관리하고, 해석의 변경 또는 폐지 내역을 명확히 확인할 수 있도록 구성되어 있습니다. 사용자는 삭제 처리된 해석 사례의 식별 정보를 통해 기존 해석 내용의 존재 여부와 사유를 파악할 수 있으며, 해석 기록의 정합성과 최신성을 확보하는 데 활용할 수 있습니다.
