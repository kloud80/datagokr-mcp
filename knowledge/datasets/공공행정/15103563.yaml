description_portal: 지방자치제 확산과 지역 간 교류 활성화를 통한 상호 발전과 협력의 중요성이 증대되면서, 자매결연을 통한 도시 간 우호 증진과 공동 발전 모델 구축이 지방자치단체의 주요 정책 과제로 대두되고 있습니다. 글로벌화 시대에 국제 교류와 문화 다양성 확산을 위한 국제 자매도시 관계 확대가 중요해지고 있으며, 지역 특산품 교류, 관광 활성화, 기술 협력 등을 통한 실질적인 경제적 상호 이익 창출의 필요성이 증가하고 있습니다. 시민 차원의 문화 교류와 교육 프로그램 확대를 통한 상호 이해 증진과 국제적 시민 의식 함양이 요구되고 있으며, 자매결연도시 간 재해 대응, 환경 보전, 행정 노하우 공유 등 공동 과제 해결을 위한 협력 체계 구축이 중요해지고 있습니다. 또한 자매결연 관계의 지속적 발전과 실질적 성과 창출을 위한 체계적인 교류 계획 수립과 성과 평가가 필요하며, 시민들의 자매결연도시에 대한 정보 접근성 향상과 교류 참여 기회 확대가 요구되고 있어, 충청남도 보령시는 16개 자매결연도시의 기본 정보, 결연 일자, 연락처 등 지역 간 교류 활성화와 시민 참여 확대에 필요한 종합적인 자매결연도시 현황 정보를 제공하고 있습니다.
