summary_user: 경기도 행정기관이 생산한 비공개 기록물을 일정 기간 뒤 다시 심사한 결과를 문서 건별로 담는다. 문서마다 생산·담당 부서, 철 제목과 건 제목, 생산일자, 기존 공개구분과 재분류 후 공개구분, 비공개 사유 조항과 재분류 의견이 들어 있다. 시민이나 연구자가 '경기도의 어느 부서 문서가 비공개에서 공개·부분공개로 바뀌었고 그 근거가 무엇인가'를 확인하거나, 정보공개청구 전에 대상 문서를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부서명·문서 제목 같은 이름 매핑으로만 이어 쓴다.
description_portal: 경기도의 비공개 기록물 공개 재분류 목록 현황은 도내 행정기관에서 생산된 비공개 문서들을 일정 기간 경과 후 정보공개 가능 여부를 다시 판단하여 그 결과를 정리한 자료로, 각 문서의 생산 부서, 제목, 생성일자, 공개 여부 변경 내용, 비공개 사유 조항 및 그에 대한 의견 등이 포함되어 있습니다. 이는 공공정보의 사후적 재검토를 통해 초기의 비공개 결정이 여전히 타당한지를 판단하고, 필요한 경우 공개 또는 부분공개로 전환함으로써 행정의 투명성과 책임성을 강화하는 데 목적이 있으며, 개인정보, 단체정보, 업체정보 등 비공개 사유가 일부 포함된 경우에는 관련 법률 조항에 따라 제한적으로 공개되기도 합니다.
