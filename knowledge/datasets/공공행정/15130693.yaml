summary_user: 경기도 내 사료 제조·유통 업체에 내려진 행정처분을 업체 한 곳의 처분 한 건씩 담은 건별 자료로, 기준년도·시군·국내/수입 구분·업종(배합·단미·보조사료 등)·업체명·관련 법령·처분내역(과징금, 영업정지 등)을 기록한다. 축산 농가나 사료 유통 사업자가 거래 업체의 처분 이력을 확인하거나, 분석가가 어떤 업종에서 어떤 법령 위반이 자주 일어나는지 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명이나 업체명을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 사료 제조·유통과 관련된 업체들에 대한 행정처분 현황을 기록한 자료입니다. 데이터에는 각 연도별 기준년도, 업체의 소재지인 시군명, 업체 구분(국내/수입), 업종명(배합사료, 단미사료, 보조사료 등), 업체명, 관련 법령, 그리고 구체적인 행정처분내역(과징금, 영업정지 등)이 포함되어 있습니다. 사료관리법 제11조, 제13조, 제14조 등의 법령을 위반한 사례들을 바탕으로, 위반 유형에 따른 행정처분 조치가 명시되어 있습니다. 해당 데이터는 사료업체의 법규 위반 현황을 파악하거나, 축산업 및 사료 유통 관리 정책 수립에 필요한 기초자료로 활용될 수 있습니다. 특히 위반 빈도가 높은 법령과 업종의 상관관계 분석을 통해, 사료안전관리 강화를 위한 제도 개선이나 지도점검 전략 수립에 유용하게 사용될 수 있습니다.
