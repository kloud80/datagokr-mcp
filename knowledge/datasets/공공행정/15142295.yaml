summary_user: 서울특별시 마포구 안의 안경업소(안경원)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·중부원점TM(EPSG:2097) 좌표, 시력표·렌즈절단기 같은 보유 장비 수와 면적이 들어 있다. 주민이나 창업자가 '마포구에서 지금 영업 중인 안경원은 어디에 몇 곳이고 최근 어디서 폐업했나'를 확인하거나, 분석가가 상권별 안경원 개·폐업 이력을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 주소·사업장명으로 맞추거나 같은 기관 코드(개방자치단체코드)로 다른 업종 인허가와 묶어 쓰며, LOCALDATA 인허가와 원천을 공유한다.
description_portal: '서울특별시 마포구의 눈을 보호하거나 시력의 교정을 요하는 대상에게 시력의 교정 및 안경을 판매 또는 수리하는 업소정보입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 안경원의 위치, 서비스 제공 현황 및 운영 상태를 파악하고, 보건·소비자 보호·안경업 정책을 효율적으로 수립할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
