summary_user: 전국 지방자치단체의 한 해 재정 결산 실적을 정리한 지방재정연감(결산) 자료로, 회계연도(fyr)와 자치단체별로 결산 금액 여러 항목과 비율을 담는 집계 통계다. 주민이나 분석가가 "우리 지자체의 결산 규모와 비율이 같은 유형의 다른 지자체와 비교해 어떤가"를 확인하는 데 쓴다. 자치단체 코드(laf_cd)와 자치단체명 필드가 있지만 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 자치단체명·코드 매핑이나 같은 기관(지방재정365) 코드 체계로만 잇는다.
description_portal: '○ 지방재정연감 결산은 전국의 지방자치단체들이 한 해동안 재정 실적을 종합적으로 정리한 통계자료집입니다. 행정안전부가 매년 발간하며, 각 지방자치단체의 결산액을 기반으로 작성됩니다.○ 또한, 지방자치단체의 재정 투명성을 확보하고 주민들의 알권리를 보장하는 데 중요한 역할을 합니다. 연감을 통해 각 지자체의 재정 상태를 객관적으로 비교하고 재정 건전성을 평가할 수 있습니다.  - 상권 : 세입세출 결산, 재무제표 분석, 결산지표 분석 등 전국 지방자치단체 재정 결산에 대한 총괄적인 분석 내용을 확인할 수 있습니다.  - 하권 : 전국 지방자치단체의 결산 자료를 유형별(특광역시도, 도,시,군,자치구)로 나누어 자세하게 수록되어 있습니다.'
