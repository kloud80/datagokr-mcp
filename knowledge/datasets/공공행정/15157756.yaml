summary_user: 온비드에서 낙찰된 부동산 물건을 지역·재산유형(분류코드명)별로 묶어 입찰건수·낙찰건수·낙찰률·경쟁률·감정평가금액·낙찰금액·낙찰가율을 기간 단위(연·월·분기)로 집계한 통계로, 캠코 물건과 이용기관 물건 두 가지 조회를 전국 범위로 제공한다. 공매 투자자나 분석가가 "최근 분기 우리 지역 토지 공매는 감정가 대비 몇 % 수준에서 낙찰되고 경쟁률은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·분류명 같은 이름 매핑이나 같은 기관(한국자산관리공사)의 온비드 데이터로만 이어 쓴다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid)에서 낙찰된 부동산 물건을 기반으로 지역 및 재산 유형별 입찰 통계 정보를 조회할 수 있는 서비스입니다. 보다 신뢰성 높은 통계 제공을 위해 낙찰가율이 200% 이상이거나 25% 미만인 물건은 통계 산정에서 제외되어 데이터의 왜곡을 방지하고 있습니다.조회기간(inqPerd)을 연도별(YYYY), 월별(YYYYMM), 분기별(YYYY-Q)로 조회할 수 있습니다.필수 검색 조건(캠코 물건 지역별 통계) : 재산유형 통계유형코드(statsTypeCd), 조회기간(inqPerd)필수 검색 조건(이용기관 물건 지역별 통계) : 조회기간(inqPerd)'
team:
  dept: 디지털시스템실
