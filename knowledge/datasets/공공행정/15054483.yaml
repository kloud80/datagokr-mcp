summary_user: 한국자산관리공사가 관리하는 국유 일반재산의 연도별 관리건수(건)·관리면적(천㎡)·대장가액(억원)을 전국 단위로 합산한 집계표로, 필지별 원천 자료가 아니라 연도당 한 줄 수준의 작은 csv 파일(540바이트)이다. 연구자나 정책 분석가가 "국유 일반재산의 관리 규모와 장부가액이 연도별로 어떻게 늘거나 줄었나"를 확인할 때 쓴다. 지역 코드나 필지번호(PNU) 같은 조인 키가 없어 다른 데이터와는 연도 기준으로만 나란히 놓고 비교한다.
description_portal: 공공데이터포털에서 제공하는 국유 일반재산 현황 파일데이터는 국가(기획재정부)가 보유하고 한국자산관리공사에서 관리하고 있는 국유일반재산의 전반적인 보유현황_연도_관리건수_관리면적_대장가액 등의 정보를 표준화된 형태로 정리한 자료입니다. 이를 통해 국유재산의 분포와 특성 등의 현황을 정확히 파악하고, 시기별 변화를 비교하는 등 다양한 업무 및 연구에 활용·참고할 수 있도록 구성되어 있습니다. ※ 본 자료는 csv 파일 형식으로 2009년부터 2026년까지의 정보를 제공합니다.
