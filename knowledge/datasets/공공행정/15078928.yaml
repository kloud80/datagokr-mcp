description_portal: 본 데이터는 전북특별자치도 부안군이 지방세법 및 지방세기본법에 근거하여 매년 정기적으로 수집·관리하는 체납 지방세 현황을 체계적으로 정리한 행정 통계자료이다. 지방세 체납은 자치단체 세입에 직접적인 영향을 미치는 주요 항목으로, 체납 규모와 추이를 분석하여 지방재정 건전성을 확보하고 징수 효율을 높이는 데 목적이 있다. 본 자료는 부안군 세무부서가 표준지방세정보시스템을 통해 매년 12월 31일을 기준으로 자동 산출하여 체납액 규모별로 구분·집계한 결과이며, 일정한 검증 절차를 거쳐 공공데이터로 제공된다.데이터 항목은 시도명, 시군구명, 자치단체코드, 과세년도, 체납규모구간, 체납건수, 체납금액으로 구성되어 있으며, 일정 기준에 따라 구간을 나누어 체납액 분포를 분석할 수 있도록 설계되어 있다. 이를 통해 체납자의 규모별 현황을 파악할 수 있어 납세자의 성실도 분석, 징수 우선순위 결정, 체납관리 전략 수립 등에 활용이 가능하다.특히 고액 체납 구간의 체납자 수 변화 및 전체 체납 규모의 추세를 연도별로 비교 분석함으로써 지역의 세수 안정성 평가와 체납 관리 정책 수립에 실질적인 기초자료로 활용된다. 또한 해당 데이터는 외부 연구기관, 시민, 학계에서도 지방세 체납 현황에 대한 정책 평가, 행정 효율성 분석, 사회경제적 요인과의 상관관계 연구 등 다양한 분야에 활용될 수 있다. 행정정보의 투명성을 높이고, 데이터 기반의 과학적 세정 운영을 가능하게 하는 기반자료로서의 역할을 수행한다.
