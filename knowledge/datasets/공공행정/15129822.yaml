description_portal: 'SFTS (중증열성혈소판감소증후군) 환자와 사망자의 연도별/월별/시도별/연령별 발생 건수- 연도: 2013~2025- 월별: 1~12월- 시도별: 전국 17개 시도- 연령별: 10세연령- 월별(1~12월) 환자, 사망자 수 중 해당월에 신고건이 없었던 경우 공란으로 표기됩니다.  3급 SFTS 의 신고범위 - 환자 : 감염병의 병원체가 인체에 침입하여 증상을 나타내는 사람으로서 제 11조 제 6항 의 진단기준에 따라 의사, 치과의사, 또는 한의사의 진단이나                 제 16조 2에 따른 감염병병원체 확인기관의 실험실검사를 통하여 확인된 사람 - 의사환자: 감염병병원체가 인체에 침입한 것으로 의심이 되나 감염병환자로 확인되기 전 단계에 있는 사람'
