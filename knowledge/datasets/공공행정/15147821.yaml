description_portal: 사상구는 지역 내 물가 안정과 서민경제 지원을 위해 저정, 운영 중인 착한가격 업소 현황을 공공데이터로 개방합니다.착한가격업소는 합리적인 가격과 위생적인 서비스, 친절한 경영을 통해 주민 생활 안정과 지역경제 활성화에 기여하는 업소로,구민이 신뢰할 수 있는 소비한경 조성에 중요한 역할을 하고 있습니다.이번에 개방하는 공공데이터에는 업소명, 주소, 전화번호, 주요 판매 품목 및 가격 등 기본 정보가 포함되어 있으며, 누구나 자유롭게열람, 활용할 수 있도록 국가공공데이터 포털 및 사상구 홈페이지를 통해 제공 됩니다.이를 통해 구민은 보다 손쉽게 생활밀착형 가격 정보를 확인 할 수 있고 소상공인은 홍보 효과 및 신규 고객 유치 기회를 얻을 수 있습니다.또한 연구기관, 기업 등에서는 해당 데이터를 활용하여 지역경제 분석, 서비스 개발, 지도 앱 연계 등 다양한 부가가치 창출이 가능 할 것으로 기대됩니다.사상구는 앞으로도 투명하고 개방적인 행정을 바탕으로 주민생활에 도움이 되는 유용한 데이터를 지속적으로 발굴 개방하여, 데이터 기반의 지역사회 혁신과 상생 발전을적극 추진하겠습니다.
