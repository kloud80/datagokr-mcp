summary_user: 수원시에 업무신고를 하고 영업 중인 행정사 사무소를 한 곳씩 담은 건별 원장으로, 사무소명·신고일자·행정사 종류·도로명/지번 주소·위도·경도를 포함하며 범위는 수원시 한 시군구다. 행정 절차나 온라인 민원이 어려운 시민(고령자·외국인 등)이 '우리 동네에서 가까운 행정사 사무소는 어디인가'를 찾을 때, 또는 분석가가 구별 행정사 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소 문자열이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경기도 수원시에 업무신고하고 사업중인 행정사 현황 데이터 행정사사무소명, 신고일자, 행정사사무소 소재지 및 위도 경도)를 제공합니다. 복잡한 행정절차에 대한 상담 접근성을 향상시키고 온라인 민원 처리에 어려움을 겪는 고령자나 외국인도 가까운 행정사에게 직접 방문하여 도움을 받을 수 있습니다. 또한 긴급 민원 상황 대응이나 행정 정책, 관련 제도에 대하여 궁금한 경우에도 지역적으로 가까운 행정사에 연락하시어 상담 프로그램을 이용할 수 있습니다. 본 데이터는 도로명 주소 뿐만 아니라 위도, 경도가 포함되어 있기에 위치기반 GIS로 활용할 수 있습니다.
