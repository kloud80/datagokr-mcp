summary_user: 지방자치단체별 지역통합재정규모 기준 결산상잉여금을 회계연도(fyr)와 자치단체 단위로 담은 전국 범위의 공시 집계 데이터입니다. 지역 주민이나 재정 분석가가 "우리 지자체는 한 해 예산을 집행하고 잉여금이 얼마나 남았고, 다른 지자체와 비교하면 어떤가"를 확인할 때 쓴다. 전역 조인 키는 없어 자치단체 코드(laf_cd)나 자치단체명으로 같은 지방재정365의 다른 공시 데이터와 맞춰 연결한다.
description_portal: 지방자치단체 지역통합재정규모의 결산상잉여금은, 해당 지방자치단체가 한 회계연도 동안의 예산을 집행한 결과, 예상보다 더 많은 수입이 발생하거나 지출이 적게 이루어져 잉여가 발생한 금액을 의미합니다. 이는 해당 지자체의 재정 건전성 및 관리 능력을 나타내는 중요한 지표로 활용되며, 잉여금은 차기년도 예산으로 이월이 되거나 특별한 용도로 사용될 수 있습니다.지역통합재정규모의 결산상잉여금은 해당 자치단체의 재정 자립도와 미래 재정 운요 계획을 수립하는 데 중요한 역할을 합니다.
