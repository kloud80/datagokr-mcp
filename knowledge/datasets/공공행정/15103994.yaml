description_portal: 종교의 자유 보장과 다종교 사회에서의 종교간 상호 이해 및 협력 증진 필요성 증대, 지역사회 내 종교시설의 사회적 역할 확대와 지역공동체 형성에 대한 기여도 증가, 그리고 종교시설의 문화유산적 가치와 관광자원으로서의 활용 가능성 부각에 따라 보령시는 관내 종교시설 현황을 종합적으로 관리하고 있습니다. 기독교, 불교, 천주교 등 주요 종교와 수양관, 기도원 등 다양한 형태의 종교시설들이 지역사회에서 신앙생활 지원뿐만 아니라 문화활동, 사회봉사, 교육사업 등을 통해 지역공동체 발전에 기여하고 있습니다. 각 종교시설의 위치 정보를 체계화하여 종교 간 대화와 협력 사업 추진, 종교문화 관광 프로그램 개발, 재해 시 대피시설 활용 등 다양한 정책 수립에 활용하며, 종교의 자유와 다문화 사회 통합을 위한 기초자료로 활용하고 있습니다.
