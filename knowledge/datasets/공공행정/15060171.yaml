summary_user: 경기도 부서별 예산 편성과 집행 현황을 회계연도·회계구분·부서·세부사업·세출관리세목 단위로 담고, 예산금액·예산현재금액·재배정금액·지출누계금액·집행잔여금액을 제공하는 시도 범위 재정 데이터다. 분석가나 도민이 "경기도 어느 부서의 어떤 세부사업에 예산이 얼마 편성됐고 지금까지 얼마나 집행됐는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 부서명·사업명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: '이 데이터는 경기도 각 부서의 예산 편성과 집행 현황을 기록한 자료로, 세부사업 단위까지 예산 집행의 전 과정을 확인할 수 있는 공공재정 데이터입니다. 회계년도별로 회계구분, 부서구분, 관서명, 세부사업내용, 세출관리세목구분 등의 항목을 포함하며, 예산금액, 예산현재금액, 재배정금액, 지출누계금액, 집행잔여금액 등 재정 운영과 관련된 항목을 제공합니다.* 재배정 등으로 예산을 세운 부서와 지출한 부서가 다를 수 있어 각 항목을 제공합니다.출처 : 지방행정관리시스템(e호조 DB 연계를 통한 자동 갱신 중입니다.)'
