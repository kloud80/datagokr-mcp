description_portal: '부산광역시 서구에서 관리하는 공유재산 현황 데이터입니다.본 데이터는 토지의 소재지, 지목 유형, 면적 등 재산 관리에 필요한 기본 정보를 포함하고 있습니다. 이를 통해 분포 현황, 토지 이용 특성, 동별·지목별 면적 규모 등을 종합적으로 분석할 수 있습니다.예시 데이터에는 동대신동, 서대신동, 부민동, 아미동, 토성동 등 서구 전 지역에 분포한 토지의 주소 정보와 함께, ‘대(대지)’, ‘전(전답)’, ‘임야’, ‘잡종지’ 등 토지지목코드와 개별 필지의 단면적 정보가 수록되어 있습니다.본 데이터는 공유재산의 효율적인 관리 및 활용계획 수립, 중·장기 재산관리계획 수립 등의 행정업무에 활용될 수 있으며, 토지 이용 현황에 대한 기초자료로서 정책적 활용 가치가 높은 데이터입니다.* 항목별 설명재산관리관: 관리·담당하는 부서소재지주소: 상세 주소토지지목코드: 용도 구분 코드(대, 전, 임야, 잡종지 등)단면적: 면적(㎡ 기준)'
