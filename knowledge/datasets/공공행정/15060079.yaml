description_portal: '인천광역시 중구 관내에 위치한 쓰레기종량제봉투 단가에 대한 데이터 입니다.종량제봉투 단가 데이터는 지역별 봉투 가격 책정 및 유통 관리를 위한 기초 자료로 활용됩니다. 주요 항목에는 종량제봉투시스템지역코드, 봉투종류(예: 가정용, 사업장용, 음식물용 등), 봉투규격(5L, 10L 등), 단가(장당 가격), 사용여부(Y/N) 등이 포함됩니다. 이 데이터는 지자체별로 상이한 봉투 가격을 반영하며, 지역코드를 통해 행정구역 단위로 구분됩니다. 또한, 단가 정보를 기반으로 예산 수립, 판매 수입 정산, 시민 안내 등에 활용됩니다. 사용 여부 항목은 해당 봉투가 현재 유통 및 사용 중인지 여부를 나타내며, 폐기되었거나 중단된 봉투는 "N"으로 표시됩니다. 데이터는 지속적으로 갱신되어 정확한 행정 처리를 지원합니다.'
