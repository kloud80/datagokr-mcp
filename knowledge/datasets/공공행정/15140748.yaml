description_portal: 서울특별시 은평구에서 구민에게 제공하는 강좌교육 정보를 홈페이지를 통해 제공합니다. (강의명, 접수기간시작과 종료일시, 교육대상, 교육시작일 등)해당 데이터는 서울특별시 은평구청과 산하 기관(평생학습관, 주민센터, 가족센터, 50플러스재단 등)에서 운영하는 모든 강좌 및 교육 프로그램의 정보를 통합하여 안내하는 게시판 내용입니다. 데이터에는 강좌명, 교육 내용, 모집 기간, 교육 대상, 수강료, 담당 부서 등 구민들이 평생학습에 참여하는 데 필요한 모든 핵심 정보가 포함되어 있습니다.은평구는 '은평배움모아'라는 지역 교육 통합 포털을 중심으로, 정보화 교육(스마트폰 활용), 인문학 강좌, 문화예술(미술, 음악), 직업능력개발(관광통역안내사 양성 등), 가족 관계 증진 프로그램 등 생애주기별로 다양한 주제의 온·오프라인 강좌를 제공하고 있습니다. 이 데이터는 구민 누구나 배움의 기회를 누리고, 자기 계발과 건강한 여가 생활을 통해 삶의 질을 높일 수 있도록 지원하는 은평구의 평생학습 정책을 한눈에 보여주는 중요한 정보입니다.
