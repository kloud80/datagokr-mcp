summary_user: 경기도 데이터분석시스템에서 데이터셋을 주제별로 나누는 분류 코드 체계를 코드 한 건당 한 행으로 담으며, 대분류(1단계)와 세부분류(2단계) 계층을 상위 분류코드로 잇는 코드표입니다. 경기도 데이터분석시스템의 데이터셋이 어떤 주제 영역(가족복지보건, 관광문화체육, 교육취업 등)에 속하는지 해석하거나 분류 체계를 그대로 재현하려는 분석가에게 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 시스템의 데이터셋 목록과 분류코드(ds_class_cd)·분류명으로 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 사용되는 데이터셋 분류 코드 체계를 제공합니다. 주요 항목에는 번호, 데이터셋분류코드, 데이터셋분류코드명, 분류코드레벨, 상위데이터셋분류코드, 데이터셋분류유형코드, 등록자ID, 등록일시, 수정자ID, 수정일시가 포함됩니다. 코드 구조는 1단계(가족복지보건, 관광문화체육, 교육취업 등 대분류)와 2단계(가족, 보건, 복지, 관광, 교육, 경제, 환경, 소방 등 세부분류)로 나뉘며, 이를 통해 행정·경제·복지·교육·산업·재난안전 등 다양한 주제 영역별 데이터를 체계적으로 관리하고 검색할 수 있습니다.
