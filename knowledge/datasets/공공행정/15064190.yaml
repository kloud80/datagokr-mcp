description_portal: 한국토지주택공사의 공지사항 게시판은 새소식 >  공지ㆍ공모 > 공지사항 을 통해 접속이 가능합니다. 국민과 기업, 공공기관 등을 대상으로 주요 알림·공지·채용 정보를 종합하여 제공하는 공식 정보창구입니다. 본 게시판은 지역 선택과 공지 유형을 통해 정보탐색이 가능하며, 구체적으로 임대주택 모집 일정, 하도급 계약현황, 정보공개 서비스 설문조사 등 분양, 입찰, 알림, 기타로 분류되어 있습니다. 일반 국민, 주택 청약자부터 건설·하도급 업계, 채용 희망자까지 폭넓은 수요자에게 최신 정책·채용·주택사업 관련 공식 정보를 신속하고 체계적으로 제공하는  안내 채널입니다.
