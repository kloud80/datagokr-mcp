summary_user: 한국지역난방공사의 열 생산실적을 실적일자·시간대별로, 지사·열공급시설·열원시설 단위로 열 생산량(HT_PRDCTN_AMNT)과 함께 담은 건별 실적 데이터로, 범위는 전국이며 공간 좌표는 없다. 에너지 분석가가 "지역난방 열 생산량이 하루 중 어느 시간대에, 어느 열원시설에서 가장 많은가"를 살피거나 계절·시간대별 열 수요 패턴을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지사·시설 식별자나 이름을 같은 기관(한국지역난방공사)의 다른 데이터와 맞춰야만 이을 수 있다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 한국지역난방공사에서 제공하는 시간대별생산실적 정보입니다.\""
