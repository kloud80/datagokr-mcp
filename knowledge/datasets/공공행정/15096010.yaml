summary_user: 계룡시 관내 유통점에서 조사한 주요 공산품의 품목명·품목 기준·계량단위·조사 개수·조사 연월과 시기·판매 가격을 품목별 조사 건 단위로 담은 시군구 범위 API다. 계룡시 주민이나 지역 물가를 보는 분석가가 "계룡시에서 특정 공산품이 조사 시점에 얼마에 팔렸나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 물가 데이터와는 품목명(PRDLST)이나 조사 연월을 이름·값으로 맞춰 이어 써야 한다.
limits: 표준 지역코드나 점포 식별자가 없어 다른 데이터와 키로 바로 조인할 수 없다. 범위가 계룡시 한 곳이라 다른 시군과 비교하려면 별도 데이터를 품목명으로 맞춰야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
