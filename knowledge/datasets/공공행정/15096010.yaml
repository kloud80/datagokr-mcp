description_portal: 충청남도 계룡시의 '지역물가정보(공산품) API' 데이터는 관내 유통점에서 판매되는 주요 공산품들의 가격 동향을 정기적으로 조사하여 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 공산품 물가 정보를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 조사 대상 품목의 명칭과 품목 기준, 계량단위, 조사 대상 개수, 조사 연월 및 조사 시기, 최종 판매 가격 정보가 포함되어, 공공 경제 정보로 활용됩니다.
