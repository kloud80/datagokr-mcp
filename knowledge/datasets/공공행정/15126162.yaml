description_portal: 구미도시공사는 구미시에 공영유료주차장의 관리운영을 위탁받아 운영하고 있습니다. 주차장은 대분류로 8개소를 운영하며 일일 이용요금과 월정기 이용요금을 징수하여 구미시로 납부합니다. 일일 및 월정기 이용요금은 현금과 카드로 납부할 수 있으며, 주차장 인근 상가, 사무실 등 업소에서는 방문고객의 무료주차 제공을 위하여 상품권을 별도로 구매가능하며, 이 또한 현금과 카드로 납부가 가능합니다. 금오천주차장은 2022년도부터 신용카드전용주차장으로 운영하고 있으나 일부 카드를 소지하지 않은 고객은 별도로 현금징수한 경우도 있어 현금건수가 발생합니다.
