description_portal: '○ 통계개요* 통계명 : 외국인주민(한국국적취득 후 경과기간별)* 작성목적 : 국내 거주 외국인주민에 관한 기본정책 수립, 운영 및 제도개선을 위한기초자료 활용* 조사체계 : 통계청→ 행정안전부* 작성방법 : 인구총조사?주민등록?가족관계?인구변동?외국인등록?거소신고?국적취득 등행정정보를 활용하여 통계 DB 시스템에서 추출ㆍ생성* 조사대상 : 한국국적을 가지지 않은 자 : 국내에 체류하는 외국인 중 90일 이상 체류자한국국적취득자 : 외국인이었으나 한국국적을 취득한 자자녀 : 한국국적을 취득한 자의 미성년자녀 및 한국인과 결혼한 한국국적을가지지 않은 자의 미성년자녀* 작성기준 : 직전년도 11월 1일 0시 기준(통계청 인구주택총조사 기준)* 공표주기 : 매년* 공표범위 : 지역 - 서울시 자치구내용 - 한국국적을 취득한 후 경과기간별 주민수 등'
