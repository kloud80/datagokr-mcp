summary_user: 관보에 게재된 외교부 조약을 건별로 담으며, 게재물마다 제목, 발행 희망일자, 편집구분, 테마구분, 발행기관, 근거법령, 정정 여부와 정정 사유, 원문 PDF 경로를 제공하는 전국 단위 비공간 데이터입니다. 연구자나 실무자가 특정 조약이 언제 관보에 공포됐는지, 공포 뒤 정정된 적이 있는지 확인하고 원문을 받아 볼 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못했으므로, 다른 관보 데이터나 법령 데이터와는 조약 제목이나 근거법령 이름, 발행기관명을 맞춰 이어 쓴다.
description_portal: 관보는 국가가 국민에게 널리 알릴 사항을 수록하여 발행하는 국가의 공식 기관지로 '관보'라는 제호로 발간되는 정기간행물입니다. 관보는 헌법개정, 법률, 조약, 대통령령, 총리령 및 부령의 공포와 헌법개정안, 예산 및 예산 외 국고부담계약의 공고 수단입니다. 또한, 법령 공포, 대통령·국무총리훈령 및 대통령·국무총리 지시사항, 각급 기관의 인사발령 통지 등 정부 기관간의 공문 시행을 대체하는 역할을 합니다.이 데이터는 관보에 게재된 조약(외교부) 목록, 상세정보(제목, 구분, 발행일자, 편집구분, 테마구분, 발행기관, 근거법령, 정정여부 등), 원문에 대한 정보를 제공합니다.
