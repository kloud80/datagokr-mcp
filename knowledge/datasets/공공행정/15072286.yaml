description_portal: 관내 옥외광고물의 설치·허가·관리 업무에 필요한 우편번호(우편코드) 정보를 체계적으로 정리한 자료입니다.옥외광고물은 건물, 도로, 가로시설물 등 다양한 공간에 설치되며, 정확한 장소 식별이 행정업무의 핵심이므로 우편번호 데이터는 설치 위치를 명확하게 파악하고 행정구역 정보와 연계하는 데 필수적으로 활용됩니다.해당 데이터는 광고물 설치 위치의 우편번호, 도로명주소·지번주소와의 매핑 정보, 법정동·행정동 코드와의 연계 값 등을 포함하고 있으며, 광고물 관리대장, 허가 시스템, 위치 기반 행정서비스 등 다양한 행정 플랫폼에서 표준화된 주소정보로 사용될 수 있도록 설계되어 있습니다.
