summary_user: 경기도 시군구별로 하루를 시간대 구간으로 나눈 유동인구수와 그 비율을 기준년월 단위로 집계한 통계로, 전월 대비·전년 동월 대비 증감값과 증감비율을 함께 담는다. 상권 분석가나 창업 예정자가 "우리 시군구에서 유동인구가 가장 몰리는 시간대는 언제이고 작년보다 늘었나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구코드(signgu_cd)를 이름·코드 매핑하거나 같은 기관(경기도) 코드 체계로만 다른 상권·인허가 자료와 잇는다.
description_portal: 이 데이터는 경기도 시군구 단위의 시간대별 유동인구 현황을 기준년월별로 집계한 통계 자료입니다. ‘시간대코드’는 하루를 여러 시간 구간으로 나누어 각 시간대별 유동인구수를 산정한 항목이며, ‘전월대비증감값’, ‘전년동월대비증감값’과 그 비율을 통해 유동인구의 시간적 증감 추이를 파악할 수 있습니다. 데이터 항목에는 ‘기준년월’, ‘시군구코드’, ‘시간대코드’, ‘유동인구수’, ‘유동인구수비율’, ‘전월대비증감값’, ‘전월대비증감비율’, ‘전년동월대비증감값’, ‘전년동월대비증감비율’이 포함되며, 시간대별 유동 인구 패턴을 분석하여 상권의 활성 시간대, 교통혼잡 시간 예측, 행정 서비스 배치 등에 활용될 수 있습니다. 시간대코드를 통해 특정 시간 범위내 일자별 생활 패턴 분석에 유용한 정보를 제공합니다.
