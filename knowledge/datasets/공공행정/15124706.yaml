description_portal: '의정부도시공사에서 운영하는 자동차 번호판제작소 정보(이용요금)입니다. 차량 종류별 번호판 제작, 부착 서비스 등 요금에 대한 세부정보를 제공합니다.자동차 번호판 제작소는 자동차 등록 및 번호판 훼손 등에 따른 자동차 등록 번호판 제작 및 교부 사업을 합니다.따라서 해당정보는 이러한 사유가 발생하여 번호판 제작 및 교부가 필요한 이용자에게 유용할 수 있습니다.의정부시 번호판제작소는 의정부시 자동차관리과 건물 바로 옆에 있습니다.(주소 : 경기 의정부시 체육로90)의정부도시공사 대표 홈페이지에 접속하시면 사업소개>교통사업>자동차 번호판 제작소에서도 해당 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/businessInfo/trafficPage/plate/list.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.'
