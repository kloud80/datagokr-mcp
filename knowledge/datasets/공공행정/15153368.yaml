description_portal: 세종특별자치시시설관리공단은 시민이 자연장지(잔디장·수목장 등) 이용 현황을 명확하게 확인할 수 있도록 자연장 계약 정보를 공공데이터로 제공하고 있습니다.이 데이터는 자연장 이용을 위한 계약 내역을 체계적으로 관리하고, 장사서비스의 투명성과 편의성을 높이기 위해 구축되었습니다.■ 데이터 컬럼 구성자연장계약일자 -자연장 이용 계약이 체결된 날짜자연장계약순번 - 계약 건별 고유 일련번호자연장구분 - 자연장의 유형 구분  - 잔디장  - 수목장 도심형  - 수목장 산림형사용시작일 - 자연장 사용이 실제로 시작되는 날짜사용종료일 - 계약된 자연장 사용 기간의 종료일관내관외구분 - 고인의 주소지 기준 관내 또는 관외 구분■ 데이터 제공 목적자연장 계약 데이터는 다음과 같은 목적을 위해 제공됩니다. - 자연장지 이용 및 계약 현황의 투명한 공개 - 계약 기간 및 유형별 수요 파악을 통한 효율적 시설 운영 지원 - 시민 정보 접근성 향상 및 예측 가능한 장사 서비스 제공 - 정책 수립 및 자연장 문화 확산을 위한 데이터 기반 행정 실현
