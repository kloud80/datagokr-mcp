description_portal: 충청남도 대기질분석모델 정보 데이터는 도내 대기환경 현황을 과학적으로 분석하고 예측하기 위해 활용되는 모델 결과 자료이다. 본 데이터는 FNL 기상모델 결과와 FNL 기여도 대기질모델 결과, UM 기상예보모델 결과 등으로 구성되어 있으며, 기상 조건과 오염물질의 거동을 종합적으로 반영한 분석 정보를 제공한다. 이를 통해 미세먼지 등 대기오염 물질의 농도 변화와 원인 기여도를 파악할 수 있으며, 대기질 예보 정확도 향상, 환경 정책 수립, 오염 저감 대책 마련 및 도민 건강 보호를 위한 과학적 근거 자료로 활용된다.
