summary_user: 경기도 내 산부인과 의료기관을 기관 한 곳당 한 행으로 담은 현황 자료로, 기준연월·시군명·의료기관명·종별(의원·병원·종합병원·여성병원)·지번/도로명 주소·위경도와 정제 주소를 포함한다. 분석가나 정책 담당자가 '우리 시군에서 분만·여성진료를 받을 수 있는 산부인과가 몇 곳이고 어디에 몰려 있는가' 같은 여성의료 접근성 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명이나 경기도 분석용 시군코드(anls_sigun_cd)로 다른 경기도 자료와 맞추거나, 위경도 좌표로 인구·행정경계 자료와 공간 결합해 쓴다.
description_portal: 이 데이터는 경기데이터 분석시스템에서 경기도 산부인과 정보 데이터는 도내 산부인과 의료기관의 현황을 정리한 자료입니다. 주요 항목에는 아이디(고유식별자), 기준연월, 분석시군코드, 시군명, 의료기관명, 종별구분명(의원, 병원, 종합병원, 여성병원), 소재지지번주소·도로명주소·우편번호, 위도·경도 좌표, 정제된 주소 정보, 생성일자 등이 포함됩니다. 이 자료를 통해 산부인과 병원과 의원의 분포를 확인할 수 있으며, 지역별 여성의료 접근성 평가, 산부인과 수요 분석, 출산·여성건강 관련 정책 수립 및 연구 자료등으로 활용 가능합니다.
