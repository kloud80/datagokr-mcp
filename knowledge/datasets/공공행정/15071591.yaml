summary_user: 서울특별시 식품운반업(유산균 음료·어류·조개류처럼 부패·변질되기 쉬운 식품을 운반하는 업소)의 인허가 정보를 업소 한 건씩 담는 원장으로, 인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표·종사자 수·시설 규모 등을 포함한다. 사업자나 상권 분석가가 '서울에서 지금 영업 중인 식품운반업체는 어디에 몰려 있고, 최근 몇 곳이 새로 허가받거나 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·업소명 매핑이나 개방자치단체코드(OPNSFTEAMCODE) 같은 같은 기관 코드로만 연결하며, LOCALDATA 인허가 자료와 같은 원천을 공유한다.
description_portal: '유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
