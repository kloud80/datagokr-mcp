summary_user: 서울 강남구에서 편의점 등 안전상비의약품을 파는 업소의 인허가 원장을 업소 한 건 단위로 담으며, 인허가일·취소일, 영업상태(영업/휴업/폐업), 휴업 기간, 재개업일, 지번·도로명 주소, 사업장명, 좌표(X·Y)를 포함한다. 주민이 집 근처에서 심야에 해열제·소화제를 살 수 있는 영업 중인 편의점을 찾거나, 분석가가 강남구 안에서 상비약 판매처가 언제 늘고 줄었는지 점포 이력을 보는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 같은 원천인 LOCALDATA 인허가 자료와 함께 상권 분석 원료로 쓴다.
