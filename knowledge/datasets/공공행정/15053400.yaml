description_portal: 본 데이터는 2013년 기준 경기도 용인시 내 산업 중분류별, 성별, 읍·면·동별 종사자 현황을 제공한다. 주요 항목은 산업분류, 성별, 읍·면·동, 종사자 수로 구성되어 있으며, 각 산업별로 남성과 여성 종사자 수를 구체적으로 구분하여 기록하였다. 이를 통해 용인시의 산업 구조, 지역별 고용 분포, 성별 노동시장 특성을 종합적으로 파악할 수 있다. 자료는 지역 경제 구조 분석, 산업 특성 연구, 고용정책 수립, 일자리 창출 전략 마련, 학술 연구 및 통계 분석 등 다양한 목적으로 활용 가능하다. 다만, 본 데이터는 단일 연도(2013년)를 기준으로 집계된 통계 자료로 주기적으로 갱신되지 않음을 유의해야 한다. 공공데이터 개방을 통해 지역 고용 구조의 투명성을 높이고, 정책적·연구적 활용도를 제고하며, 용인시 지역경제 발전과 균형 있는 일자리 정책 수립에 기여하는 것을 목표로 한다.
