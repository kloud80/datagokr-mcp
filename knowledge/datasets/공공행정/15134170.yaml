description_portal: 한국노동연구원은 국내 고용 및 기업 구조의 동태를 심층적으로 파악하기 위해 사업체패널조사(Workplace Panel Survey)를 정기적으로 수행하고 있습니다. 이 조사는 다양한 산업 및 규모의 사업체를 추적하며, 고용관계, 임금구조, 인적자원관리, 기업 경영환경 등에 대한 종합적인 데이터를 수집합니다. 이에 따라 기술변화나 인적자원관리 전략, 노사관계 변화 등의 성과를 분석하는 데 핵심적인 자료입니다.이 조사와 관련된 학술행사 및 주요 공지사항은 한국노동연구원 홈페이지를 통해 정기적으로 게시되며, 연구자, 정책담당자, 일반 국민 등 다양한 대상에게 중요한 정보로 활용됩니다. 현재 공개하는 데이터는 사업체패널조사와 관련하여 홈페이지에 게시된 학술대회 공지 데이터를 체계화한 것입니다. 해당 데이터는 행사 정보 중심으로 구성되어 있으며, 주요 항목은 학술대회행사명,  학술대회행사일자, 학술대회행사장소, 행사링크url, 문의처 등 입니다.
