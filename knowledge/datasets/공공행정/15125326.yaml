summary_user: 중앙환경분쟁조정위원회 결정문을 사건 한 건씩 목록으로 담으며, 항목마다 의결번호·결정문일련번호·사건명과 결정문 상세 링크가 있고 범위는 전국입니다. 소음·진동이나 공사 피해 같은 환경분쟁을 겪는 국민이나 연구자가 '비슷한 사건이 어떤 사건명으로 조정·결정됐는가'를 찾아보고 해당 결정문 본문으로 넘어가는 데 쓴다. 실측 컬럼에서 다른 데이터와 묶을 전역 조인 키는 없어, 결정문일련번호로 같은 기관의 결정문 본문 조회와 잇거나 사건명으로 다른 결정례와 맞춰 보는 정도로만 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 중앙환경분쟁조정위원회 결정문 데이터로 위원회 결정문에 대한 목록 정보를 조회하는 서비스입니다.  각 항목에는 사건의 고유 식별번호와 접수일자, 분쟁유형, 조정요청자 및 상대방 등 주요 당사자 정보가 포함되어 있습니다. 또한 심의 진행 상태와 조정 결과 여부, 조정일자 및 결과 요약 등의 핵심적 사건 정보가 포함되어 있습니다. 사용자는 페이지네이션 및 정렬 기능을 통해 특정 기간 또는 분쟁유형별로 사건 목록을 손쉽게 조회할 수 있습니다. 본 목록은 환경 관련 쟁점의 빈도 및 분포를 분석하고, 행정 및 연구 목적으로 활용하기에 적합한 기초 데이터를 제공합니다.
