summary_user: 지방자치단체별·회계연도별 세출예산을 사업 구조(정책사업·행정운영경비·재무활동)와 기능(14개 분야 54개 부문)으로 나눈 집계 예산액을 전국 범위로 담는다. 분석가나 주민이 '우리 시·군·구는 사회복지·교통 등 분야별로 정책사업과 행정운영경비에 각각 얼마를 편성했나'를 보고, 다른 자치단체와 비교하는 데 쓴다. 전역 조인 키는 없으며, 같은 지방재정365 계열 데이터와는 자치단체 코드(laf_cd)·광역 코드, 회계연도, 분야·부문 코드나 이름을 맞춰 연결한다.
description_portal: 지방자치단체의 세출예산은 사업별예산제도에 따라 14개분야, 54개 부문으로 기능적 분류를 하고있으며, 사업의 구조에 따라서는 일반적인 사업을 수행하는 정책사업과 행정운영경비, 재무활동으로 분류합니다. 행정운영경비는 지방자치단체 행정조직 운영을 위한 최소한의 경상비로서 기준인건비제도에 따른 인력운영비와 관서울영을 위한 기본경비로 구분됩니다. 재무활동은 기관내의 회계간 전출입금에 해당하는 내부거래지출과 차입금이자상환 등에 해당하는 보전지출 대상통계목들이 편성됩니다.구조별기능별세출예산은 자치단체의 결산내역을 구조별(정책사업,행정운영경비, 재무활동) 내역을 기능별(14개분야 54개부문)로 분류한 예산액 정보를 제공합니다.
