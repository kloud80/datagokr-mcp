description_portal: '1. 조달기업의 불공정행위신고 : 조달청이 물품·용역을 구매·공급하는 과정에서 공정성을 해치는 아래 6개 유형의 불공정 조달행위를 한 조달업체를 「조달사업에 관한 법률」에 따라 신고할 수 있습니다.신고 유형(거짓서류 제출) 입찰·계약, 납품검사 등 관련 서류 위·변조, 거짓 서류 제출(직접생산 위반) 직접생산기준을 위반하여 납품〈타사 완제품 납품, 전 과정 하청생산 등〉(원산지 위반) 원산지를 거짓으로 표시하여 납품〈라벨갈이 등〉(계약규격 위반) 수요기관 등의 사전 승인 없이 계약규격과 다른 제품을 납품(우대가격 위반) 다수공급자계약(MAS) 체결한 가격보다 계약상품*의 시장거래가격이 낮은 경우* 성능·사양이 계약상품과 동등 이상인 상품 포함(우수제품 부정지정) 우수조달물품 등의 지정을 거짓이나 부정한 방법으로 받음- 해당신고의 년도별 신고건의 조사사건 통계 정보'
