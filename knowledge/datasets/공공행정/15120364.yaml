description_portal: '강원특별자치도 강릉시 관내 공중시설에 대한 코드·분류 체계를 관리하는 데이터로, 각 시설에 대해 다음과 같은 항목을 제공합니다.코드연번: 공중시설 코드 레코드를 구분하기 위한 일련번호관리코드: 공중시설을 내부적으로 식별·관리하기 위한 고유 코드대분류코드, 대분류명칭: 공중시설을 유형별(예: 화장실, 목욕장, 기타 공중편의시설 등)로 구분하기 위한 상위 분류 코드 및 명칭관리코드명: 관리코드에 대응되는 시설 명칭 또는 세부 구분명법정동코드: 해당 공중시설이 위치한 법정동을 나타내는 코드(행정구역 연계용)공중시설구분: 시설의 성격·용도 등을 나타내는 구분값(예: 남녀공용, 남자전용, 여자전용, 민간위탁 등, 지자체 정의에 따라 사용)시설호수: 각 공중시설에 부여된 호수 또는 번호로, 현장·도면·시스템 간 동일 시설을 연결하기 위한 식별자이 데이터는 공중시설을 코드·분류·행정구역·개별 시설 번호로 체계적으로 관리할 수 있도록 설계되어 있어, 공중시설 인벤토리(자산) 관리 및 위치 기반 현황 파악, 대분류·구분별 시설 수량 집계 및 통계 분석, 법정동 단위 시설 분포 분석 및 취약 지역(시설 부족 지역) 발굴, 민원·점검·정비 이력 시스템과의 연계(관리코드·시설호수 기준) 등에 활용할 수 있는 기초 코드·마스터 데이터로 활용됩니다.'
