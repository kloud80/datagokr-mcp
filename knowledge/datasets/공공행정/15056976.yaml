summary_user: 지방자치단체별 중기지방재정계획(다음 회계연도부터 몇 해 앞까지의 수입·지출 전망)을 회계연도·자치단체·계획 구분별로 1차년도~5차년도 계획액과 연평균증가율로 담는 전국 단위 집계 데이터다. 분석가나 지방의원·주민이 '우리 시·군·구는 앞으로 몇 년간 재정 규모를 얼마나 늘리거나 줄일 계획인가'를 확인하거나 자치단체 간 중기 재정 전망을 비교하는 데 쓴다. 전역 조인 키는 없고, 자치단체 코드·이름(laf_cd, laf_hg_nm)과 회계연도를 맞춰 지방재정365의 다른 공시 데이터(예산·결산 등)와 같은 기관 코드 체계로만 연결한다.
description_portal: 지방자치단체의 중기지방재정계획은 지방재정법 제33조에 따라 수립되며, 다음회계연도부터 4년간의 재정수입과 지출을 전망하여 계획하는 다년도 예산입니다. 이 계획은 자치단체의 발전목표와 정책 우선순위를 반영하여 재정의 효율성과 건전성을 확보하고, 단년도 예산의 한계를 보완하기 위해 마련됩니다.중기지방재정계획 정보는 2010 회계연도부터 제공되고 있으며, 대상회계는 일반회계, 기타특별회계, 공기업특별회계, 기금을 대상으로 합니다. 세부제공 항목은 1차년도~ 5차년도까지의 예산액과 연평균증가율 항목이 제공됩니다.
