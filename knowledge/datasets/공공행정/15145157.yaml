summary_user: 2010년 7월 1일 통합 창원시 출범 이후 구와 읍면동의 명칭 변경 이력을 변경 건별로 담은 작은 파일(CSV 818바이트)로, 시행일·변경 내용·세부 내역·비고를 읍면동 단위로 기록한다. 분석가나 공무원이 '2017년·2020년 행정동 통합으로 어느 동이 어느 동에 합쳐졌는가'를 확인하거나, 과거 동 이름으로 된 통계를 현재 행정동 기준으로 맞출 때 쓴다. 전역 조인 키(행정구역 코드 등)가 없어 다른 데이터와는 구·동 이름을 직접 매핑해서만 이어 쓸 수 있다.
description_portal: 2010년  7월 1일 통합 창원시 출범 이후 구 및 읍면동의 명칭 변경 이력입니다. 본 자료는2025년 8월 7일 기준 창원시 행정구역 명칭 변경 시행일과 변경사항(세부내역), 관련 법령 및 조례 정보와 공포일을 제공합니다.이를 통해 창원시 행정구역 변경 현황을 파악하여 향후 행정구역 변경 계획 수립 시 기초자료로 활용할 수 있습니다.*지방자치법 제3조에 따라 도시의 형태를 갖춘 지역에는 동을, 그 밖의 지역에는 읍면을 두되, 자치구가 아닌 구를 둘 경우에는 그 구에 읍면동을 둘 수 있습니다.*법정동과 행정동은 대한민국 행정구역의 공식 명칭과 행정 편의 구분을 위한 개념입니다. 법정동은 법률로 정해진 공식 동명으로, 부동산 등기·주소 표기 등에 사용되며, 행정동은 주민센터 운영 등 행정 효율을 위해 법정동을 분할하거나 통합한 구역입니다.2010년 7월 1일 통합 창원시 출범과 함께 5개 구(의창구, 성산구, 마산합포구, 마산회원구, 진해구)가 설치되었습니다.이후 2017년과 2020년에 소규모 행정동을 통합하여, 현재 5개 구, 55개 읍면동이 설치되어 있습니다.  2017년 1월 1일에는 마산합포구 '반월동'과 '중앙동'이 '반월중앙동'으로, 마산합포구 '오동동', '동서동', '성호동'이 '오동동'으로, 마산회원구 '석전1동', '석전2동'이 '석전동'으로 통합되었습니다. 이어 2020년 1월 1일에는 마산합포구 '교방동'과 '노산동'이 '교방동'으로, 진해구 '중앙동', '태평동', '충무동'이 '충무동'으로 통합되었습니다.이후 도시개발 사업 등에 따라 행정구역 경계를 지속적으로 조정하고 있습니다.현재 행정구역 현황은 창원시 구 및 읍ㆍ면ㆍ동 명칭과 구역획정에 관한 조례 및 창원시청 홈페이지(https://www.changwon.go.kr)에서 확인 가능합니다.
