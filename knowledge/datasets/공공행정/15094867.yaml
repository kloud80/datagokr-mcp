description_portal: '○ 통계개요* 통계명 : 청렴도지수* 통계종류 : 서울시 부패유발요인에 대한 청렴도 지수를 제공하는 일반ㆍ조사통계* 작성목적 : 행정 제반사항에 대한 운영ㆍ점검을 통해 지방행정 수행의 책임성과투명성을 높이고 행정서비스의 질적향상을 위한 정책마련의 기초자료로활용하는 것을 목적으로 함* 조사체계 : 조사기관 → 서울시 및 자치구 → 국가청렴위원회* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 부패유발요인(종합, 위생, 세무, 주택ㆍ건축, 건설공사 등)의청렴도 지수○ 용어설명* 청렴도지수 : 국가청렴위원회에서 공공기관의 주요대민ㆍ대기관을 대상으로 실시하는청렴도 측정결과임. 10점 만점 기준이며 수치가 높을수록 상대적으로 청렴도가 높고,수치가 낮을수록 청렴도가 낮은 것을 의미함(전년도 측정결과 종합청렴도가우수한 기관 (9.0이상)은 당해연도 측정대상에서 제외됨○ 기 타* 자료조사시점 : 매년 8.1~익년 7.31* 자료조사대상 : 종합, 위생, 세무, 주택ㆍ건축 등 민생분야 민원처리- 2009년 농축산물, 식의약품 분야 추가○ 출 처 : 서울특별시 감사담당관'
