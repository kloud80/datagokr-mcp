summary_user: 경기주택도시공사가 2022년 이후 체결한 계약을 한 건씩 담은 파일 데이터로, 계약일·계약 구분(용역·물품·공사)·계약명·계약금액·계약상대방·감독부서·계약방법이 들어 있다. 분석가나 시민이 '공사의 수의계약 비중이 연도별로 어떻게 달라졌나', '어느 업체와 얼마 규모로 계약했나' 같은 질문을 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 계약상대방 업체명이나 기관명을 맞춰 보는 방식으로만 잇는다.
description_portal: 경기주택도시공사에서 2022년 이후 체결한 계약에 대한 이력을 제공하는 데이터로써 계약일, 계약명, 계약금액, 계약상대방, 계약방법 등의 세부 정보가 포함되어 있습니다. 용역계약, 물품구매, 공사 등 계약 구분별 자료를 제공함으로써 계약유형별 분석도 가능하며, 일반경쟁, 수의계약, 조달계약, 제한경쟁 등 계약방법별 분석도 가능합니다. 감독부서 정보도 포함되어 계약의 관리 및 책임소재 파악에 도움을 줍니다. 이를 통해 공사의 연도별 계약집행 규모를 비교하고, 계약투명성 확보 및 집행절차 개선 등의 정책 수립에 활용될 수 있습니다.
