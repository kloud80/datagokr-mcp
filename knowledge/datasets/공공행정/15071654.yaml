summary_user: 서울시에 있는 영화상영업소를 사업장 한 곳당 한 건으로 담은 인허가 원장입니다. 인허가일자, 영업상태, 폐업·휴업 일자, 주소·좌표, 시설면적·건물 층수 같은 항목이 들어 있습니다. 분석가가 '우리 구에 영업 중인 영화관이 몇 곳이고 최근 몇 년 사이 어디서 폐업했나'를 따져 지역별 영화관 분포와 문화 인프라 변화를 볼 때 쓰고, 다른 데이터와 공통으로 묶을 전역 조인 키는 없습니다. 그래서 사업장명·주소 매칭이나 좌표로 이어 붙이고, LOCALDATA 인허가 자료와는 원천이 같습니다.
description_portal: 서울시 영화상영업 인허가 정보는 서울시에 위치한 영화상영업소의 인허가 현황과 기본 특성을 제공하는 공공데이터입니다. 각 사업장에 대해 인허가일자, 영업상태, 폐업 및 휴·재개업 여부 등 행정 인허가 변동 정보를 확인할 수 있으며, 지번·도로명 주소, 우편번호, 좌표정보를 통해 사업장의 위치를 정확하게 파악할 수 있습니다. 또한 사업장명, 업태구분명, 문화체육업종명 등으로 업종 특성과 운영 형태를 간략히 파악할 수 있고, 시설면적과 건물 층수 등 일부 시설 규모 정보도 함께 제공되어 있습니다. 이 데이터는 영화상영업에 대한 인허가 관리, 지역별 영화관 분포 분석, 문화 인프라 현황 파악 등 행정·연구·정책 수립에 활용될 수 있는 기초 자료입니다.
