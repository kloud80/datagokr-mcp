summary_user: 전국 지방자치단체의 일반회계 세입을 회계연도·자치단체·세입일자·세입과목 단위로 담으며, 전일 누계와 당일 수입액, 당일 과오납 반환액 등 일자별 세입 실적을 제공한다(포털 설명상 2016회계연도부터). 분석가나 주민이 "우리 시·군·구의 올해 지방세 수입이 날짜별로 얼마나 들어오고 있나"처럼 자치단체별 세입 진행 상황을 확인하는 데 쓴다. 전역 조인 키는 없고 자치단체 코드·이름(laf_cd 등)과 회계연도로 같은 지방재정365 세출·예산 데이터와 맞춰 이어 쓴다.
description_portal: 지방자치단체의 세입예산은 특정 회계연도에 예상되는 모든 현금 수입을 의미합니다. 일반적으로 조세 수입이 가장 큰 부분을 차지하며, 공채, 국유재산 매각, 정부 기업의 수익 등도 포함합니다. 세입은 세출의 재원이 되며, 이를 바탕으로 예산이 편성됩니다. 이 자료는 자치단체별 세입예산을 분석한 자료입니다.세입현황 정보는 2016회계연도부터 제공되며 대상회계는 일반회계입니다. 제공되는 세부항목은 자치단체별 회계구분, 세입일자, 전일누계, 당일수입액, 당일 과오납반환액 등 세입에 관련된 항목입니다.
