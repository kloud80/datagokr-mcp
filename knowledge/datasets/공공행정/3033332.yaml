summary_user: 구미시 관내 73개 대표 생활품목(농축수산물·가공식품·생필품)의 규격·단위별 평균 가격과 선산읍·고아읍·원평신평·인동진미 등 읍·동 권역별 가격을 기준일자별로 담은 CSV 파일(약 5.6KB) 집계표다. 구미시민이나 지역 유통업자·분석가가 '이번 기준일에 쌀·돼지고기 같은 품목이 구미 어느 권역에서 더 싼가, 시 평균과 얼마나 차이 나는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품목명이나 권역 이름을 직접 맞춰 이어야 하며, 다른 시군의 물가정보 파일과는 품목명 매핑으로 비교한다.
description_portal: 이 데이터는 경상북도 구미시 관내의 물가정보를 제공하는 것으로, 시민들이 일상생활에서 자주 접하는 73가지 대표 품목에 대한 평균 가격과 지역별 가격 정보를 포함하고 있습니다. 품목에는 농산물, 축산물, 수산물, 가공식품, 생필품 등이 포함되어 있으며, 시기별·지역별 가격 변동을 비교하거나 물가 흐름을 파악하는 데 유용합니다. 해당 데이터는 구미시민의 소비생활에 실질적인 도움을 줄 수 있을 뿐만 아니라, 유통업계, 연구기관, 정책 담당자들이 지역 경제와 물가안정 정책을 수립하는 데 활용할 수 있는 중요한 기초자료로 활용됩니다.
