summary_user: 경기도 데이터분석시스템에 등록된 각 데이터셋의 속성(컬럼) 정의를 데이터셋ID·속성순번 단위로 한 행씩 담은 메타데이터로, 한글·영문 속성명, 데이터 유형, 길이, 널 허용·식별자 여부, 등록·수정 이력을 포함한다. 분석가나 시스템 연계 담당자가 '경기도 데이터분석시스템의 특정 데이터셋에는 어떤 컬럼이 어떤 형식으로 들어 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 시스템의 데이터셋 목록 정보와 데이터셋ID(ds_id)를 이름·코드 매핑으로 맞춰 연결하는 정도로만 이어 쓴다.
description_portal: 이 데이터는 경기도 데이터분석시스템 내 데이터셋 속성 정보를 정의한 메타데이터입니다. 주요 항목에는 번호, 데이터셋ID, 속성순번, 속성한글명, 속성영문명, 데이터유형명, 속성길이, 널허용여부, 식별자여부, 주소코드, 등록자ID, 등록일시, 수정자ID, 수정일시가 포함됩니다. 속성 항목은 실제 데이터셋 내 변수들을 설명하는 메타 정보로, 이를 통해 각 데이터셋이 포함하는 속성의 의미와 구조를 파악할 수 있으며 데이터 분석, 행정업무, 연구, 시스템 연계 시 표준화된 데이터 이해를 지원합니다. 특히 속성명은 한글·영문 병기와 데이터 유형 정보를 함께 제공하여 데이터 활용의 정확성과 상호운용성을 높입니다.
