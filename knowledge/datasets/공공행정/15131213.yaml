summary_user: 조달청 벤처나라에 지정된 업체를 지정년도·지정차수·지정순번별로 한 행씩 담은 전국 단위 파일(CSV, 약 72만 바이트)로, 사업자번호·제품명 목록·지역·지청·연락처·확정 여부와 확정일자를 포함한다. 공공기관 구매 담당자나 분석가가 '어느 지역의 어떤 벤처·창업기업이 벤처나라 지정업체로 확정됐고 어떤 제품을 등록했는가'를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았으며, 사업자번호나 업체·제품 이름 매핑으로 나라장터 계약·입찰 등 조달청 데이터와 이어 붙여야 한다.
limits: 표준 조인 키가 없어 다른 조달 데이터와의 연결은 사업자번호·이름 매칭에 의존하므로 매칭 누락에 주의한다. 지정 이후의 실제 계약·납품 실적은 이 파일만으로 알 수 없다.
