description_portal: 2025년도 지방기능경기대회 경기장 현황에 대한 상세한 자료입니다. 이 자료는 2025년 전국 17개 지방에서 개최된 지방기능경기대회와 관련된 경기장 정보를 정리한 것입니다. 각 지방에서는 서로 다른 수의 직종별 경기를 운영하며, 직종별로 서로 다른 경기장에서 개최됩니다. 이 데이터에는 지방대회를 주관한 각 지역(시·도)별로 실제 사용된 경기장의 이름, 각 경기장에서 진행된 직종의 명칭, 해당 지방에서 특정 직종에 출전한 선수들의 인원 수도 함께 기록되어 있어, 지역별·직종별 경기장 갯수와 경기 규모, 참가 현황을 파악할 수 있습니다.
