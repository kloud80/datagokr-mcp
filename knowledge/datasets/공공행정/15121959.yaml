description_portal: 한전KPS에서 현재 진행중인 중소기업 지원사업 정보입니다. 사업연도, 분류, 지원사업명, 지원내용, 지원대상, 지원규모의 등의 정보를 포함하고 있습니다. 해당 정보는 중소기업 지원사업 현황을 정확하게 파악하고, 중소기업의 성장 지원에 대한 효과 분석, 지원사업 예산의 효율성 분석, 중소기업 판로 확대 등에 활용될 수 있습니다.  이러한 정보 개방은 중소기업과의 상생을 위한 산업 생태계 조성에 이바지하고, 중소기업 중심의 산업 활성화와 사회적 가치 실현이라는 공공기관 본연의 역할 수행에도 기여합니다.
