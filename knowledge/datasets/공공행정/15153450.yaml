description_portal: '세종특별자치시시설관리공단은 화장시설 이용을 위해 접수된 예약 현황을 투명하게 공개하고 시민이 화장 절차를 명확히 이해할 수 있도록 화장예약 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 화장 예약일, 배정된 화로 번호, 유해 구분 등의 핵심 정보를 포함하여 화장 절차 관리의 효율성과 공정성을 높이는 데 활용됩니다.■ 데이터 컬럼 구성예약일자 - 화장 예약이 접수된 날짜 - 예약량 및 수요 분석에 활용 가능화로번호 - 예약 단계에서 배정된 화로(화장로) 번호유해구분코드 - 화장 대상의 종류를 나타내는 코드값    예: 시신, 개장유골, 사산아 등확정화로번호 - 화장이 확정될 때 최종적으로 배정된 화로 번호 - 예약 단계의 배정 화로와 비교하여 변화 여부 확인 가능■ 데이터 제공 목적화장예약 데이터는 다음과 같은 목적을 위해 제공됩니다. - 화장 시설 예약 현황의 투명한 공개 - 화로 배정 과정의 일관성 및 공정성 확보 - 유해 구분별 수요 분석을 통한 자원 배분 최적화 - 행정 서비스의 예측 가능성 강화 및 민원 대응 품질 향상세종특별자치시시설관리공단은 시민 편의 증진과 화장시설 운영의 공공성 강화를 위해 화장예약 데이터를 지속적으로 갱신·제공하겠습니다.'
