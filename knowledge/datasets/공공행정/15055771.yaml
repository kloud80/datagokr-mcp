description_portal: '- 부산광역시 대규모점포등록 현황으로 광역자치단체, 기초자치단체, 상호, 업태, 소재지, 매장면적, 판매면적, 용역제공면적, 실제 영업개시일 등의 항목을 제공합니다- 부산 지역 내 대형 유통시설의 위치, 유통산업발전법 상 대규모점포 유형(대형마트, 전문점, 백화점, 쇼핑센터, 복합쇼핑몰, 그 밖의 대규모점포), 운영 현황 등을 확인할 수 있는 행정데이터입니다.- 위 데이터는 부산 소재 대규모점포에 대한 현황 파악에 도움을 줄 수 있으며 부가적으로 지역상권분석, 도시계획 및 유통계획 수립, 소비자 이용행태 및 생활권 분석 등 다양하게 활용 될 수 있습니다. 따라서 위 데이터는 행정, 민간기업, 연구 및 분석 등 여러 분야에서 유용하게 쓰일 수 있습니다.'
