summary_user: 경기도 시군별·연도별 산림 관련 불법행위 단속 실적을 담은 집계 데이터로, 불법 건수와 함께 검찰송치(구속·불구속), 즉심회부, 내사처리, 타기관이송, 미처리 건수를 처리 단계별로 나눠 담는다. 산림행정 담당자나 분석가가 '우리 시군의 산림 불법행위 단속 건수와 송치·미처리 비율이 연도별로 어떻게 변했는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 기준년도와 시군명(sigun_nm)의 이름 매칭으로만 다른 경기도 시군 통계와 이어 쓴다.
description_portal: 이 데이터는 산림자원의 보호와 불법행위 단속을 목적으로 수집된 산림지도단속 집계 현황으로, 연도별·시군별로 산림 관련 불법행위에 대한 단속 실적을 제공합니다.주요 항목으로는 기준년도, 시군명, 불법건수(건), 검찰송치구속수(건), 검찰송치불구속수(건), 즉심회부수(건), 내사처리수(건), 타기관이송수(건), 미처리건수(건) 등이 포함되어 있으며, 이를 통해 산림 관련 법규 위반 행위의 발생과 행정처분 현황을 파악할 수 있습니다. 본 데이터는 산림보호 정책 수립, 산림행정 지도단속 평가, 법규 준수 실태분석, 불법행위 예방대책 마련 등 다양한 정책 및 행정적 목적으로 활용됩니다. 특히 법적 조치 단계별로 세부 통계가 제공되어 제재의 집행 현황을 종합적으로 확인할 수 있습니다.※산불을 제외한 불법건수가 있는 시군 데이터만 제공합니다.
