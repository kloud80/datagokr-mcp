description_portal: '○ 통계개요* 통계명 : 일반회계 세출예산개요* 통계종류 : 서울시 일반회계 세출예산 개요를 제공하는 일반ㆍ보고통계* 근거법령 : 「지방재정법」에 의거하여 운용되는 지방재정 현황* 작성목적 : 지방재정의 계획수립 및 운용 현황을 파악하여, 지방재정의 건전하고 투명한운용과 합리적ㆍ효율적인 관리가 이루어질 수 있도록 기초자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 예산담당관, 행정과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 세출항목별(일반공공행정, 공공질서 및 안전, 교육,문화 및 관광 등) 일반회계 세출예산개요○ 용어설명* 일반회계 : 국가의 가장 기본적인 회계로 국가에서 공공사업, 사회보장, 교육,외교, 방위 등 일반행정을 추진하는데 필요한 경비를 처리하는 회계임. 조세수입,국채발행 등을 재원으로 함* 세출예산 : 의회에서 확정의결된 일반회계 본예산과 추경예산의 세출금액,국고 간주처리된 세출예산을 합한 총 세출예산 현황 및 각 구청에서 수합된구 세출예산임○ 기 타* 자치구 예산포함, 최종예산액.* 2008년부터 일반회계 세출항목 기능별 분류기준 변경* 숫자의 단위미만은 반올림하였으므로, 내용의 계가 일치하지 않을 수 있음○ 출 처 : 서울특별시 예산담당관, 행정과'
