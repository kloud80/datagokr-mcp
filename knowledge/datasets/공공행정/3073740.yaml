description_portal: 성남시는 시민들의 자전거 이용 편의를 높이고 안전한 자전거 이용 환경을 조성하기 위해 자전거 공기주입기를 관내 주요 지점에 설치하고 있다. 공기주입기는 일반적으로 자전거 도로 인근, 자전거 보관대, 공공 체육시설, 공원, 지하철역 주변 등 자전거 이용 수요가 많은 곳에 배치된다. 특히 분당구와 수정구 일대에는 자전거 이용률이 높은 것을 반영해 우선 설치가 이뤄졌으며, 공기주입기는 수동형 또는 자동형으로 구분되어 설치되어 시민 누구나 무료로 이용할 수 있습니다.해당 설비는 타이어 공기압 유지와 안전사고 예방을 위한 자전거 점검의 일환으로 운영됩니다. 또한 시는 주기적인 점검과 유지보수를 통해 공기주입기 사용의 연속성과 신뢰성을 확보하고자 합니다. 성남시는 앞으로도 시민 의견을 반영해 설치 장소를 확대하고, 자전거 친화 도시 조성을 위한 인프라 강화 계획을 지속적으로 추진할 예정입니다.
