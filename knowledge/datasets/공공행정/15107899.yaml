description_portal: 2017년부터 2021년까지 5년간 국민권익위원회에 접수된 행정심판 중 ‘운전사건’ 관련 처리건수를 연도별로 집계한 통계입니다. 운전면허 정지·취소, 벌점부과, 적성검사 관련 처분 등 교통 및 운전에 관한 행정처분에 이의를 제기한 심판청구가 중심이며, 해당 통계를 통해 운전 관련 행정심판의 주요 이슈나 변화 추이를 파악할 수 있습니다. 이 자료는 도로교통 정책 수립, 행정처분의 형평성 검토, 국민 권리 보호의 기초자료로 활용됩니다.연도별 운전사건 처리건수 정보와 행정심판 결과(인용, 기각,각하) 건수를 제공합니다..
