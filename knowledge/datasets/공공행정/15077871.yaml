summary_user: 행정표준코드관리시스템에서 현재 제공 중인 법정동 코드를 전국 범위로 조회하는 API로, 검증 호출에서는 2행을 받았다. 주소를 법정동 코드로 바꾸거나 코드에 해당하는 시·군·구·읍·면·동 이름을 확인하려는 개발자와 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 법정동 이름·코드 값 매핑으로 연결하며, 행정표준코드는 다른 데이터를 잇는 코드 원장으로 쓰인다.
limits: 검증 호출에서는 2행만 받았으므로 이 행 수를 전체 코드 규모로 보면 안 된다. 응답 필드가 head·row 구조로만 확인되어 세부 컬럼 의미는 실제 응답을 보고 판단해야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
