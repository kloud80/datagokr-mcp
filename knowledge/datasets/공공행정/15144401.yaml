summary_user: SGIS 일자리맵 서비스가 구인사이트에서 모은 구인정보를 바탕으로, 전국 읍면동(행정동) 단위의 등록일자별 모집인원을 담은 집계 파일이다(csv 약 157KB). 구직자나 지역 고용 분석가가 '어느 동네에 구인 수요가 몰려 있나', '특정 행정동의 모집인원이 시기별로 어떻게 달라졌나' 같은 질문에 쓴다. 행정동 코드 같은 전역 조인 키가 없어, 다른 읍면동 통계나 SGIS 경계와는 행정동명(행정동명)을 이름으로 맞춰 이어 써야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 행정동명 이름 매핑에 의존하므로, 같은 이름의 동이나 행정구역 변경이 있으면 연결이 어긋날 수 있다. 구인사이트에서 수집된 공고 기반이라 전체 일자리 수요를 그대로 대표한다고 보기 어렵다.
