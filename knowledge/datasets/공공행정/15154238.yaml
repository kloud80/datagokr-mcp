description_portal: '국토안전관리원에서 플랫폼 구축 완료된 "국토안전 빅데이터 플랫폼" 관련 종합정보 데이터를 제공합니다.**국토안전 빅데이터 플랫폼("빅토리", bigTori)**은 국민 생활 안전을 위해 건설/시설 현장의 빅데이터를 기반으로 사고 예방, 시설물 품질 관리 등을 지원하는 개방형 포털 서비스입니다. 국토안전관리원에서 구축 및 운영하고 있습니다. 주요 목적 및 기능사고 예방 및 안전 관리: 건설 현장, 시설물, 지하 공간 등에서 발생하는 다양한 안전 관련 데이터를 수집, 통합, 분석하여 잠재적 위험 요소를 사전에 발굴하고 사고를 예방하는 데 중점을 둡니다.과학적 의사결정 지원: 데이터 기반의 과학적 분석 결과를 바탕으로 더 안전하고 효율적인 국토 안전 관리 정책 수립 및 의사결정을 지원합니다.정보 개방 및 공유: 누구나 쉽게 접근하고 활용할 수 있도록 데이터를 개방하여 공공 및 민간 분야의 데이터 활용을 촉진합니다주로 이용자는 점검및진단전문기관, 데이터 분석 활용자 대부분이 이용하며 국토안전 빅데이터 플랫폼의 개방포털에서 방문 이력을 제공합니다.주로 분석서비스, 통계 이용을 목적으로 이용하고 있으며 빅데이터 플랫폼 고도화를 위한 작업을 진행중입니다.데이터 기준은 23년 1월부터 집계되었음을 알려드립니다.'
