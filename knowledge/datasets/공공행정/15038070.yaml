summary_user: 경상북도 고령군 의회에 접수된 조례안 등 의안을 한 건씩 담은 CSV 파일(약 29만 바이트)로, 의안번호·대수·접수일자·발의자·의안명·의안종류·상정 회수와 차수·상정일·이송일자를 기록한다. 주민이나 분석가가 '고령군 의회 특정 대수에 누가 어떤 조례안을 발의했고, 언제 상정·이송됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의안명·대수 같은 이름 매핑이나 같은 기관(고령군) 기준으로만 이어 쓴다.
description_portal: 이 자료는 경상북도 고령군 의회에서 처리된 의안에 대한 정보를 수록한 것으로, 각 의안의 명칭, 제안일자, 제안자, 소관위원회, 처리회기 등의 세부 항목을 포함하고 있습니다. 본 자료는 지방의회에서 발의된 조례안 및 기타 의안이 접수된 이후, 상임위원회 회부와 심사, 본회의 의결에 이르기까지의 전체 처리 절차를 기록한 것으로, 고령군 의회의 의정활동 내용을 체계적으로 파악할 수 있도록 구성되어 있습니다. 이를 통해 지방의회의 입법 과정에 대한 행정적·정책적 분석이 가능하며, 주민에게 의안 처리 결과를 공개함으로써 의정활동의 투명성을 제고하고, 주민참여를 촉진하는 데에도 활용됩니다. 또한 지방자치법에서 정한 입법 절차가 적정하게 이행되었는지 확인하는 기초 자료로도 기능하며, 향후 조례 개정이나 정책 검토 시 참고할 수 있는 행정 기록물로서의 가치도 갖고 있습니다.
