description_portal: '중소기업제품 구매촉진 및 판로지원에 관한 법률에 따른 중소기업제품 구매실적을 연도, 품목, 구매액을 제공하며 이는 최근 5년 기준 자료를 제공합니다.연도 : 중소기업제품 구매 연도를 의미합니다.품목 : 구매의 주요 품목을 의미합니다.총구매액 : 중소기업제품을 포함한 해당연도 총구매액(대기업, 기타 및 중소기업 제품 구매 총액)을 의미합니다.중소기업제품구매액 : 해당연도 중소기업제품의 구매액을 의미합니다.비율 : 총구매액 대비 중소기업제품 구매액을 비율로 표현합니다.특히 비율은 중소기업제품 구매촉진 및 판로지원에 관한 법률에 따라 50% 이상을 달성하는 것이 의무사항입니다.해당 데이터를 통해 이용자는 기관의 연도별 총구매액과 법상 의무이행 여부를 확인할 수 있습니다.또한 향후 데이터 개방을 통해 연도별 추이 등 통계자료에 확용할 수 있습니다.다만 총구매액, 중소기업제품구매액의 세부내용은 해당 데이터를 통해 확인하기 어렵습니다.'
