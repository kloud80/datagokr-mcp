description_portal: 이 데이터는 지자체의 반려동물 등록비용 지원사업 참여 규모와 지역별 수요를 파악하기 위해 수집·가공된 통계성 자료입니다. 행정구역 체계를 기준으로 상위부터 시도명 → 시군구명 → 법정동 단위로 구분하며, 해당 구역에서 지원을 신청한 신청자수(명)와 신청서에 기재된 반려동물수(마리)를 데이터기준일자(YYYY-MM-DD) 시점으로 집계합니다. 신청자수는 개인 기준의 고유 건수이고, 반려동물수는 개인 1명이 다수 마리를 신청한 경우 합산되어 신청자수 이상이 될 수 있습니다. 자료는 통계적 분석과 예산 배분, 홍보·교육 대상 지역 선정, 정책 효과 측정(전년 대비 증감, 인구·가구 특성 연계 등)에 활용할 수 있으며, 개인정보는 포함하지 않고 법정동 단위의 집계값만 제공합니다. 행정구역 변경이나 지원기준 개편이 있는 경우 시점 간 비교 시 주의가 필요하며, 데이터기준일자에 따라 총량이 달라질 수 있으므로 분석 시 기준일을 병기하는 것을 권장합니다. 필요 시 법정동코드, 지원금액, 지급상태 등의 보조지표를 추가해 활용도를 높일 수 있습니다.
