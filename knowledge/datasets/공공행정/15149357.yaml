summary_user: 한국가스안전공사 본사·부설기관·지역본부·지역지사 등 사업장을 한 행에 하나씩 담은 전국 목록으로, 사업자등록번호·법인등록번호·대표자·주소·전화·팩스·업태/종목을 수록한다(csv 약 5KB 규모의 소량 원장). 가스 사업자나 안전관리자가 '우리 지역 관할 가스안전공사 지사의 주소와 연락처, 세금계산서 발행용 사업자등록번호는 무엇인가'를 확인할 때 쓴다. 사업자등록번호(bizno)와 법인등록번호(corp_rgst_no)가 조인 키라서 국세청 사업자 상태 조회나 법인 등기 정보와 이어 쓰고, 주소로 지역 단위 시설 데이터와 맞춰 볼 수 있다.
description_portal: '한국가스안전공사에서 제공하는 본지사사업장 현황 목록정보입니다.사업자등록번호를 기준으로 한국가스안전공사 본사, 부설기관, 지역본부 및 지역지사에 대한 현황정보를 제공합니다.데이터는 부서별 사업자등록번호, 법인등록번호, 대표자성명, 우편번호, 상세주소, 전화번호, 팩스번호 등 항목이 수록되어 있습니다.가스 업계 안전관리 및 안전관리자 교육 등 현장 업무에 참고자료로 활용하실 수 있습니다.※ 해당 목록은 연간 주기(또는 변동정보 발생 시) 업데이트 예정입니다.※ 데이터기준일 : 2025년 9월 13일'
