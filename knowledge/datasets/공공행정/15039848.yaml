summary_user: 문경시 관내에 주소를 두고 현재 영업 중인 행정사를 한 곳당 한 행으로 담은 원천 목록으로, 업체명·주소·전화번호·신고일·데이터기준일을 담는다(파일 크기 468바이트의 소규모 CSV). 문경 시민이나 사업자가 '인허가·민원 서류 대행을 맡길 행정사가 문경에 어디 있고 연락처는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키나 코드가 없어, 다른 시군의 행정사현황이나 생활 행정시설 데이터와는 주소 문자열이나 업체명으로만 맞춰 이어 쓴다.
description_portal: 경상북도 문경시_행정사현황 데이터는 관내에 주소를 둔 행정사들 중 현재 영업 중인 행정사에 관한 주요 정보를 알아보기 쉽게 체계적으로 담고 있습니다. 이 데이터에는 업체명, 주소, 전화번호와 같은 기본적인 연락처 정보뿐만 아니라, 행정사 신고일과 해당 데이터를 수정한 데이터 기준일까지 포함되어 있어 최신성을 확인할 수 있습니다. 해당 데이터를 제공하는 부서는 문경시 종합민원과이며, 제공되는 통해 시민들은 필요한 행정사를 손쉽게 찾고 연락할 수 있으며, 행정업무 관련 편의를 높일 수 있습니다.
