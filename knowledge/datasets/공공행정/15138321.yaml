description_portal: '광주광역시에서 상생카드를 사용할 수 있는 가맹점을 업종별로 정리한 정보입니다.상세주소도 확인할 수 있습니다.업종: 자동차, 학원, 의류, 마켓, 식품점 등광주광역시는 지역경제 활성화를 위해 상생카드를 운영하고 있으며, 시민들이 카드를 편리하게 사용할 수 있도록 가맹점 정보를 제공하고 있습니다. 가맹점 정보는 업종별로 정리되어 있어 원하는 업종을 쉽게 찾아볼 수 있으며, 업종에는 한식, 자동차, 학원, 의류, 마켓, 식품점 등 다양한 분야가 포함됩니다. 또한 각 가맹점의 상세주소도 함께 확인할 수 있어 실제 이용 시 위치를 파악하는 데 도움이 됩니다.'
