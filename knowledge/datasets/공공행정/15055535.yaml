summary_user: 전북특별자치도가 소유한 토지 가운데 지리산·덕유산 등 국립공원 구역 안에 있는 도유지를 필지 단위로 담은 건별 현황 파일(csv, 약 10KB)로, 소재지·본번·부번, 면적, 공부상·현황 지목, 공시지가와 재산가격, 사용허가면적, 취득일자, 실제 용도를 담는다. 도 재산 담당자나 분석가가 "국립공원 안 도유지 중 행정재산·일반재산은 각각 얼마이고, 주차장 등 실제로 어떻게 쓰이고 있는가"를 확인하는 데 쓴다. 전역 조인 키(법정동코드·PNU 등)는 없으므로, 소재지 주소와 본번·부번을 조합해 토지대장·공시지가 등 필지 데이터와 이름 기준으로 맞춰 이어 쓴다.
description_portal: 전북특별자치도 소유의 토지 중 지리산, 덕유산 등 국립공원 구역 내에 포함된 도유재산(토지)의 상세 현황 데이터입니다. 이 자료는 각 토지 필지의 위치, 면적, 그리고 임야, 전, 답 등 공식적인 지목과 주차장 등 실제 이용 현황을 상세히 보여줍니다. 또한, 해당 자산이 행정재산인지 일반재산인지 구분하고 재산 가격 정보를 포함하여, 공유재산의 관리 상태를 투명하게 파악할 수 있게 합니다. 이 데이터는 국립공원 내 도유지의 체계적인 보전 및 관리 계획을 수립하고, 공공자산의 효율적인 활용 방안을 모색하는 데 필수적인 기초 자료가 됩니다.
