summary_user: 서울 강남구에서 컨벤션센터 등 국제회의를 열 수 있는 시설을 운영하는 업소를 사업장 한 곳당 한 행으로 담은 인허가 목록으로, 인허가·폐업·휴업 일자, 영업상태, 주소, 좌표(X, Y), 시설면적·좌석 수 같은 시설 정보를 포함한다. 상권 분석가나 행사 기획 사업자가 '강남구에서 현재 영업 중인 국제회의시설은 어디이고 규모는 어느 정도인가'를 확인하거나 개업·폐업 이력을 추적하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 원천을 공유하는 LOCALDATA 인허가 자료와 함께 쓴다.
description_portal: 서울시 강남구 국제회의시설업 인허가 정보(https://data.seoul.go.kr/dataList/OA-16989/S/1/datasetView.do)서울특별시 강남구의 컨벤션센터 등 대규모 관광 수요를 유발하는 국제회의를 개최할 수 있는 시설을 설치하여 운영하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
