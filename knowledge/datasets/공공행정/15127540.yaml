description_portal: 포인트가 누적된 광산구 주민에게는 해당 포인트에 따라 다양한 형태의 보상이 지급됩니다. 보상은 온누리상품권, 문화상품권, 또는 계좌 입금 등의 방식으로 제공되며, 주민이 원하는 유형에 따라 선택할 수 있습니다. 포인트 지급은 신청일을 기준으로 다음 달 15일부터 20일 사이에 순차적으로 진행됩니다. 지급 방식 또한 선택한 보상 유형에 따라 달라지는데, 온누리상품권 등 실물 상품권의 경우 직접 방문 수령 또는 등기 발송을 통해 전달되며, 문화상품권은 문자 발송 형태로 지급될 수 있습니다. 계좌 입금은 신청 시 등록된 본인 명의의 계좌로 입금 처리됩니다. 이 포인트 보상 제도는 주민들의 참여를 유도하고 지역 내 자발적인 활동을 장려하는 데 목적이 있으며, 행정 효율성과 주민 만족도를 높이기 위한 수단으로 활용되고 있습니다.
