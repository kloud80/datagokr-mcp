summary_user: 지방자치단체가 거둔 지방세의 지출 현황을 전국 범위로 담은 지방재정365 공시 지표로, 응답 컬럼은 회계연도(fyr), 광역·기초 자치단체 코드와 이름, 금액 3개 항목, 비율로 구성된 자치단체별 집계입니다. 분석가나 주민이 '우리 시·군·구는 지방세 지출 규모와 비율이 다른 지자체와 비교해 어느 수준인가'를 연도별로 확인할 때 쓴다. 전역 조인 키는 없으므로, 같은 지방재정365 계열 데이터와 자치단체 코드(laf_cd, wa_laf_cd)나 자치단체 이름으로 맞춰 이어 쓴다.
description_portal: 지방세 지출현황은 지방자치단체가 세입으로 확보한 지방세를 어떻게 지출하고 있는지에 대한 현황을 나타내는 지표입니다.이는 지방자치단체의 재정 운용의 투명성과 효율성을 평가하는 중요한 기준으로 사용됩니다.지방세 지출현황은 각종 공공서비스, 복지, 교육, 인프라 구축 등 다양한 qsdidp 걸쳐 지출이 이루어짐을 보여줍니다. 지방세 수입이 일정 수준 이상이라면, 이 자원을 어떻게 분배하고 있는지에 대한 관리가 필요합니다.이 지표를 통해 지방자치단체의 재정 운영의 효율성과 공공서비스의 질을 평가할 수 있습니다.
