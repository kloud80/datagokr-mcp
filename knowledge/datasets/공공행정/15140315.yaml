summary_user: 법제처 국가법령정보센터가 제공하는 관세청 법령해석 사례를 해석 한 건당 한 행(안건명, 질의기관, 해석기관, 해석일자, 상세링크)으로 담은 전국 단위 목록이다. 수출입·통관·품목분류·세율 적용을 두고 관세청이 과거에 어떤 해석을 내렸는지 찾으려는 수출입 사업자, 관세사, 법무 담당자가 쓴다. 전역 조인 키는 없고, 해석 일련번호(법령해석일련번호)와 상세링크로 같은 서비스의 본문 조회와 이어 회신 내용을 보며, 다른 데이터와는 질의·해석기관 코드나 기관명 매핑으로만 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 관세청 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 수출입, 통관, 품목분류, 세율 적용 등 관세행정과 관련된 법령 해석 요청 사례들을 목록 형태로 제공합니다. 이용자는 해석 일련번호, 안건명, 질의기관, 해석일자 등의 정보를 기준으로 다양한 해석 사례를 검색할 수 있으며, 각 항목에는 회신 여부, 처리 상태, 접수일자 등의 정보가 포함되어 법령 해석 처리 현황을 확인할 수 있습니다. 목록 정보는 본문 조회 서비스와 연계되어 세부 회신 내용을 확인할 수 있으며, 실제 세관 행정에서 제기된 쟁점들에 대한 법적 판단 사례를 체계적으로 파악할 수 있도록 구성되어 있습니다.
