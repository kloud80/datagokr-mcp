summary_user: 대구광역시 통합예약시스템에 등록된 공공시설의 요금표를 이용기관·시설분류·이용목적별 행으로 담은 파일(csv, 약 30KB)로, 기본 단위와 기본료, 할증 단위와 할증료, 최대 18개의 할인·적용 조건별 금액을 함께 담는다. 대구 시민이 체육관·문화시설을 빌리기 전에 '이 시설을 2시간 쓰면 기본료와 추가요금이 얼마인지'를 확인하거나, 분석가가 시설 유형별 요금 수준을 비교하는 데 쓴다. 전역 조인 키나 시설 코드가 없어서 다른 데이터와는 이용기관명·시설명 같은 이름을 맞춰 붙여야 한다.
description_portal: 대구광역시_통합예약시스템 시설요금정보'는 대구시에서 운영하는 다양한 공공시설의 요금을 통합하여 제공하는 데이터입니다. 이 데이터에는 체육시설, 문화시설, 교육시설 등 각종 공공시설에 대한 시설 구분, 요금 항목, 기준 시간 및 인원, 기본요금, 추가요금 등의 정보가 포함되어 있어, 시민들이 시설을 이용하기 전 요금을 미리 비교하고 확인할 수 있도록 도와줍니다.이 정보는 단순한 가격 안내를 넘어서, 공공시설 운영의 투명성 제고와 시민 편의 증진이라는 중요한 목적을 지니며, 향후 예약 시스템의 기능 고도화, 모바일 기반의 실시간 정보 제공, 연령별·목적별 맞춤형 이용 안내 등 다양한 서비스 개발에도 활용될 수 있습니다. 또한, 요금 체계의 표준화 및 이용 패턴 분석을 통해 보다 효율적인 행정 운영과 정책 수립에도 기여할 수 있습니다.
