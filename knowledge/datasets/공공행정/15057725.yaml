summary_user: 지방자치단체가 회계연도 말 기준으로 보유한 물품(비품·차량·기계류 등)의 현재 가액을 회계연도와 자치단체별로 담은 전국 단위 공시 집계이며, 금액 항목이 두 개(pfa_amt1, pfa_amt2) 있으나 각각의 뜻은 명세에 적혀 있지 않다. 분석가나 주민이 "우리 시·군·구가 보유한 물품 자산 규모는 얼마이고 다른 자치단체와 비교하면 어떤가"를 확인할 때 쓴다. 전역 조인 키는 확인되지 않았으며, 같은 지방재정365 계열 데이터와는 회계연도와 자치단체 코드·이름(광역 wa_laf_cd, 기초 laf_cd)을 맞춰 이어 쓴다.
description_portal: 물품현재액은 지방자치단체가 회계연도 말 기준으로 보유하고 있는 물품 중 현재 사용 중이거나 보관 중인 물품의 총 가액을 의미합니다. 「지방재정법 시행령」 및 관련 규정에 따라 관리되며, 책상, 컴퓨터, 차량 등의 비품뿐 아니라 공구, 기계류, 소모성 자재 등 다양한 자산성 물품이 포함됩니다. 물품현재액은 지방자치단체의 자산 중 하나로 재무제표에 반영되며, 자산 규모를 파악하고 효율적인 물품 관리 및 재정 운영의 투명성을 확보하는 데 중요한 역할을 합니다. 또한, 물품의 분실이나 불용 방지를 위한 관리 기준 마련에도 활용됩니다.
