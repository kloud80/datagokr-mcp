summary_user: SGIS 기업생태분석지도의 업종 집계 데이터로, 경계 유형·경계명별로 업종(대·중분류 이름) 단위의 창업 6년 이하 생존기업률과 평균영업기간을 담은 전국 범위 집계 파일(CSV)이다. 창업을 준비하는 사업자나 지역경제 분석가가 '이 지역에서 이 업종은 창업 후 얼마나 살아남고 평균 몇 년 영업하나'를 비교하는 데 쓴다. 전역 조인 키가 없어 경계명·업종명을 이름으로 매핑해 같은 기관의 SGIS 경계·사업체 통계와 이어 쓴다.
limits: 행정구역 코드나 업종 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름 매칭으로만 연결된다. 좌표나 경계 도형이 없는 비공간 집계표라 지도에 올리려면 별도 경계 데이터가 필요하며, 개별 기업 단위 정보는 담지 않는다.
