description_portal: 성남시는 경기도 중남부에 위치한 대도시로, 3개 구(수정구, 중원구, 분당구)로 구성되어 있으며, 각 구는 다시 여러 개의 행정동과 법정동으로 세분화되어 있다. 총 행정동 수는 50여 개에 이르며, 도시계획에 따라 기능별, 생활권 중심으로 효율적인 행정서비스가 제공되고 있다. 수정구와 중원구는 성남 원도심 지역으로, 재개발 및 도시재생 사업이 활발히 진행 중이며, 분당구는 자족기능을 갖춘 계획도시로서 정보통신 및 바이오 산업 중심지로 성장하였다. 각 행정구역은 주민센터를 기반으로 주민 밀착형 행정서비스를 수행하며, 성남시는 이러한 행정구역 체계를 바탕으로 지역 특성과 수요를 반영한 맞춤형 정책을 추진 중이다.
