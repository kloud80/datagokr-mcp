summary_user: 2017년 제19대 대통령선거를 앞뒤로 세 차례(선거일 29일 전·11일 전·선거일 후, 각 1,500명) 실시한 유권자 의식조사의 응답자별 원자료로, 지역·연령 등 응답자 특성과 선거 관심·투표참여 관련 문항 응답, 가중치(WT1)를 담는다. 선거 연구자나 분석가가 '연령대·지역별로 대선 관심도와 투표 의향이 선거 전후에 어떻게 달랐는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 직접 결합되지 않으며, 다른 선거 회차의 유권자 의식조사와는 문항·지역 코드를 이름이나 코드 매핑으로 맞춰 비교해야 한다.
limits: 문항 컬럼이 Q1·Q2 같은 번호로만 되어 있어 의미는 포털 설명에 안내된 인쇄본 PDF 설문지를 함께 보고 해석해야 한다. 선거 때 한 번 만들어지고 바뀌지 않는 자료이므로 이후 시점의 여론 변화는 담지 않으며, 범위는 전국이고 공간 좌표는 없다.
