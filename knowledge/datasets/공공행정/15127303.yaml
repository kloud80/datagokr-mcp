summary_user: 경기도 담당부서별로 개인정보파일을 제3자에게 제공한 현황을 파일명·수집자·이용목적·제공 항목·보유 및 이용기간과 함께 정리한 기관 운영 목록이며, 연도(sum_yr) 항목을 함께 담는다. 도민이나 개인정보 보호 분석가가 '경기도의 어느 부서가 어떤 목적으로 어떤 개인정보 항목을 제3자에게 넘기고 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부서명·파일명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 개인정보 제3자 제공 현황을 정리한 자료로, 담당부서별로 개인정보파일명, 수집자, 이용목적, 제공 항목 등의 정보를 포함하고 있습니다.개인정보 제공에 대한 투명성 확보와 데이터 거버넌스 평가, 개인정보 보호 정책 수립에 유용하게 활용될 수 있습니다.개인정보 보호법 제 17조 제 1항은 개인정보 처리자는 정보주체의 동의를 받은 경우, 제 15조 제1항 제2호, 제3호 및 제5에 따라 개인정보를 수집한 목적 범위에서 개인정보를 제공하는 경우 등에는 정보주체의 개인정보를 제 3자에게 제공(공유를포함한다, 이하같다) 할 수 있다고 규정하고 있습니다.
