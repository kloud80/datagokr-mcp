description_portal: 주식회사한국중소벤처기업유통원에서는 다양한 지원사업을 운영 및 관리하는 가운데 공공구매종합정보망(SMPP)를 운영중에 있습니다.공공구매종합정보망의 경우 판로지원법에 의거 공공기관 및 중소기업 상호 간에 필요한 정보를 양방향으로 제공하여 공공기관의 공공구매 효율성 제고와 구매 촉진을 지원하는 시스템으로 중소기업의 원활한 공공조달시장 진출을 위한 공공판로 지원 대표 포털 사이트입니다.본 데이터는 공공구매정보망 리츠 관련 공고제품에 대한 데이터를 개방하며 사업명, 현장명, 제품명, 공고방법, 관련제품들, 추정가격합, 세부품목에 대한 번호, 품명 등을 제공합니다.또한 파일데이터로 제공함으로써 엑셀 등 전용 프로그램으로 데이터 작업을 권고드립니다.
