summary_user: 지방자치단체별 일반회계 공유재산의 수량과 현재액을 회계연도 단위로 담은 집계 데이터로, 전국 지자체를 대상으로 하며 포털 설명상 2013 회계연도부터 제공된다. 분석가나 주민이 '우리 지자체가 보유한 공유재산 규모가 다른 지자체에 비해 얼마나 되고 해마다 어떻게 달라졌나'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지방재정365 데이터와는 회계연도(fyr)와 지자체 코드·이름(광역·기초)을 맞춰 연결한다.
description_portal: 공유재산이란 지방자치단체의 예산부담에 의해 취득하거나 기부채납 또는 법령에 따라 지방자치단체가 보유하고 있는 토지, 건물, 입목죽, 공작물, 기계기구, 선박, 항공기, 무체재산, 유가증권, 용익물건 등의 재산을 의미합니다. 공유재산 현재액은 각 회계연도별로 일반회계를 대상으로 지방자치단체별 보유하고 있는 공유재산의 수량과 현재 공유재산전체 현재액 정보를 확인할 수 있습니다. 공유재산 현재액 정보는 2013 회계연도부터 정보가 제공되고 있으며 회계계약제도과에서 관리하고 있습니다.
