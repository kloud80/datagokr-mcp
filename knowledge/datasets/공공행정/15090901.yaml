summary_user: 인천광역시 서해구의 행정동별 면적(제곱킬로미터), 구 전체 대비 구성비, 각 행정동에 속한 법정동 명칭을 담은 읍면동 단위 집계 파일(csv, 755바이트)이다. 서해구 안에서 어느 행정동이 면적이 크고 어떤 법정동을 묶고 있는지 확인하려는 주민·분석가가 도시계획이나 행정통계 분석의 기초 자료로 쓴다. 행정구역 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 행정동·법정동 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 행정동·법정동 코드가 없어 다른 기관 데이터와 붙일 때는 동 이름으로 매칭해야 하며, 이름 표기 차이에 주의해야 한다. 서해구 한 곳의 읍면동 범위만 담으므로 다른 시군구와 비교하려면 별도 자료가 필요하다.
