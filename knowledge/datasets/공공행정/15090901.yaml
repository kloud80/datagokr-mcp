description_portal: 본 공공데이터는 인천광역시 서해구의 행정구역 현황을 동별로 정리한 데이터입니다. 본 공공데이터는 인천광역시 서해구 내 각 행정동의 면적(제곱킬로미터)과 전체 대비 구성비율, 해당 행정동에 포함된 법정동 명칭 등을 포함하고 있습니다. 본 공공데이터를 통해 검암경서동, 연희동, 청라동 등 주요 동별 구성을 확인 할 수 있습니다. 또한 본 데이터를 통해 도시계획, 행정통계 분석 등에 활용할 수 있을것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
