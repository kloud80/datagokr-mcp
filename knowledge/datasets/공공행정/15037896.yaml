summary_user: 인천광역시 계양구의회에 제출된 의안을 한 건씩 담은 원천 목록으로, 의안번호·건명·발의자와 발의일, 위원회 회부·처리일과 결과, 본회의 접수·보고·상정·처리일과 결과를 기록한다(CSV 약 548KB). 구민이나 지방의회 연구자가 '특정 의원이 발의한 조례안이 위원회와 본회의를 거쳐 언제 어떻게 처리됐는가', '발의부터 의결까지 얼마나 걸리는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의안번호·건명·발의자 이름을 맞추거나 같은 기관(계양구) 기준으로만 이어 쓰며, 다른 지방의회 의안정보와 비교할 때도 이름 매핑이 필요하다.
limits: 표준 코드 형태의 조인 키가 없어 회의록·의원 정보 등과 자동으로 연결되지 않고 이름 매칭에 의존한다. 범위는 계양구 한 시군구 의회에 한정되므로 다른 지역 의회나 전국 단위 비교에는 별도 데이터가 필요하다.
