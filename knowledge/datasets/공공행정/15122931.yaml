summary_user: 경기통계시스템의 각 통계조사(통계조사ID)와 그 조사에 포함된 개별 조사항목(조사항목ID)을 짝지어 놓고 항목 특성·적용 방식 설명을 붙인 메타정보 자료로, 건별 통계값이 아니라 조사-항목 관계 목록을 담는다. 통계 설계자나 분석가가 '이 경기도 통계조사에는 어떤 항목들이 들어 있고 연도별로 항목 구성이 어떻게 바뀌었나'를 확인하거나 여러 조사의 항목을 통합·비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 경기통계시스템의 다른 메타·통계 자료와는 통계조사ID·조사항목ID 같은 기관 내부 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템 내 통계조사와 해당 조사에 포함된 개별 조사항목 간의 관계를 정리한 메타정보 자료입니다. ‘통계조사ID’는 각 통계조사를 고유하게 식별할 수 있는 코드이며, ‘조사항목ID’는 조사 내에서 사용되는 세부 항목의 식별자입니다. ‘조사내용설명’은 항목 간 연계 구조나 조사 항목의 특성, 적용 방식 등에 대한 부가 설명을 포함합니다. 통계자료 설계의 구조 파악, 항목 통합 또는 비교분석, 공공데이터 통합 플랫폼 설계 등에 활용될 수 있습니다. 특히 동일 통계조사 내 항목 간 연관성과 연도별 조사 항목 변화 등을 분석하여 데이터의 구조적 일관성과 적합성을 평가하는 데 유용합니다.
