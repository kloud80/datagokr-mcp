description_portal: 이 데이터는 경기도 안산시 내 관내 도로 및 골목길에 설치된 가로등의 상세 설치 현황이 담긴 자료입니다. 안산시 구(區) 및 각 행정동별로 가로등의 위치를 파악할 수 있는 분전함 및 등주 표찰 번호를 포함하고 있습니다. 특히, 각 등주에 설치된 조명의 1등과 2등에 대해 광원 종류(LED, CDM, 나트륨 등)와 소비 전력(와트수)을 구체적으로 구분하여 기록하고 있어 에너지 효율성을 분석하는 데 유용합니다. 향후 도시 조명 환경 개선 사업이나 유지 보수 계획 수립, 그리고 야간 방범 및 보행 안전 대책을 마련하는 데 필수적인 기초 데이터로 활용될 수 있습니다.
