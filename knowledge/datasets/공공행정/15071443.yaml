summary_user: 서울시가 인허가한 국제회의시설업 사업장 6곳을 사업장별로 담은 원천 원장으로, 인허가·폐업일자, 영업상태, 지번·도로명 주소와 좌표, 객실수·건축연면적·좌석수·회의실 동시수용인원·자본금 같은 시설 규모 항목을 포함한다. 관광·MICE 분석가나 행사 기획자가 '서울에서 현재 영업 중인 국제회의시설은 어디이고 동시에 몇 명을 수용하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 사업장명·주소로 맞추거나 같은 출처인 LOCALDATA 인허가 자료와 관리번호(MGTNO)·개방자치단체코드로 연결하고, 좌표(X,Y)로 상권·공간 자료와 겹쳐 본다.
description_portal: ㅇ 데이터 개요서울시에서 인허가한 국제회의시설업 관련 정보를 제공하는 데이터셋으로, 총 6개의 시설 인허가 정보를 포함합니다.ㅇ 주요 항목관리번호, 인허가일자, 영업상태, 상세영업상태, 사업장명, 주소(지번 및 도로명), 좌표(X,Y), 문화체육업종명, 객실수, 건축연면적, 회의실별 동시수용인원, 좌석수, 시설면적, 자본금, 선박정보 등 총 60개 항목으로 구성되어 있습니다.ㅇ 활용 방안서울시 국제회의시설 관리, 관광산업 분석, 신규 허가 정책 수립, 국제행사 유치 전략 및 공간 활용 계획 등에 활용 가능합니다.
