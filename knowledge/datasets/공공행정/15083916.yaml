summary_user: 서울 서대문구 관내에 있는 영업 중인 행정사 사무소를 사무소 한 곳당 한 행으로 담은 목록으로, 행정사 종류·사무소명·소재지·비고를 담는다(파일 약 2.5KB 규모). 서대문구 주민이나 사업자가 '우리 동네에서 인허가 서류 작성이나 행정 상담을 맡길 행정사 사무소가 어디 있나'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소 문자열을 지오코딩하거나 이름으로 매핑해 연결한다.
description_portal: '서울특별시 서대문구 관내에 위치한 행정사 사무소 현황(행정사종류, 사무소명, 소재지, 영업여부)에 대한 데이터를 제공합니다.주요 활동 분야 : 행정사는 주로 행정기관에 제출하는 서류 작성, 권리·의무 관계에 대한 서류 작성, 행정관계 법령 및 제도에 대한 상담 또는 자문 등의 업무를 수행.지역별 분포 : 행정사는 인구 밀집도가 높은 수도권에 약 60%가 집중. 서울, 경기 지역의 행정사 수가 가장 많으며, 이는 행정 수요가 많은 대도시의 특성을 반영한 결과이며 지방의 경우, 지역 특화된 업무(예: 농어촌 관련 서류 작성 등)를 주로 수행.'
