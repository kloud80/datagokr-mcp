summary_user: 전화권유판매사업자의 신고 등록 정보를 사업자 한 곳씩 담은 건별 원천 데이터로, 전국 10,292건(2002-08-22~2023-08-10)에 상호·영업상태·신고기관·소재지·대표자 정보가 있다. 소비자가 전화로 권유해 온 업체가 신고된 사업자이고 지금도 영업 중인지 확인하는 질문에 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)로 같은 공정위 등록·공시 데이터(가맹사업·통신판매·다단계·상조 등)와 잇고, 주소(lctnAddr, rnAddr)는 주소 기준 연결에 쓴다.
description_portal: 사업자 등록번호, 상호명, 영업상태 등을 이용하여 전화권유판매사업자에 대한 방문판매번호, 신고기관명, 영업상태 등의 정보를 조회할 수 있는 서비스
