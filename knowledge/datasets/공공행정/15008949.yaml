description_portal: '이 CSV 데이터는 대전광역시 서구 내에서 반려동물 진료가 가능한 동물병원 현황을 정리한 행정기초 데이터로, 지역 내 동물의료 인프라를 파악하기 위한 목적에 적합한 시설 정보 자료입니다. ‘사업장명’은 각 동물병원의 공식 명칭을 나타내며, ‘소재지전체주소’와 ‘도로명전체주소’는 위치정보를 행정주소와 도로명체계로 구분해 제공함으로써 공간정보 활용도를 높입니다. ‘인허가일자’는 병원이 관할기관으로부터 인허가를 받은 시점을 나타내어 운영 이력을 추적할 수 있습니다. ‘영업상태명’은 현재 운영 중인지, 폐업 또는 휴업 중인지를 구분하고, ‘소재지면적’은 시설의 물리적 규모를 나타냅니다. ‘축산업무구분명’은 해당 시설의 동물 진료 관련 업무 성격(예: 반려동물 전문, 가축 진료 등)을 명시하며, ‘데이터기준일’은 자료의 최신 갱신 시점을 의미합니다. 이 데이터는 반려동물 의료 접근성 분석, 지역별 병원 분포 시각화, 반려동물 복지정책 수립, 공공·민간 협력사업 기획 등에서 객관적 근거 자료로 활용할 수 있습니다.'
