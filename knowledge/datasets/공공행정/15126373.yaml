summary_user: 한국자산관리공사가 관리하는 국유일반재산에 적용하는 부동산공통 이율(고시이자율) 관리내역을 이율관리 일련번호 단위로 담으며, 적용 시작·종료일자, 기준이율, 이율관리일수·기간연수, 승인·등록일자가 들어 있고 범위는 전국·비공간입니다. 국유재산 대부료·매각대금·변상금을 분할납부하는 사업자나 분석가가 "특정 기간에 적용된 기준이율이 몇 %였나"를 확인해 분할납부 이자를 계산하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 국유재산 데이터와는 시작·종료일자 기간을 기준으로 맞추거나 같은 기관 데이터끼리 이름으로 연결해 쓴다.
limits: 필지(PNU)·재산 단위 식별자가 없어 개별 국유재산이나 납부 건과 직접 조인하지 못하고, 기간 매칭으로만 붙일 수 있다. 호출에는 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
