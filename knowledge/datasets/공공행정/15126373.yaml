description_portal: 한국자산관리공사_부동산공통 이율관리내역 조회서비스 API는 국가(기획재정부)가 보유하고 한국자산관리공사에서 관리하는 국유일반재산의  부동산공통 이율관리내역을 제공하는 서비스입니다. 국유일반재산은 대부료, 매각대금, 변상금 분할납부 시  국유재산법 제30조 및 제55조, 제71조 등에 따라 고시이자율을 적용하고 있습니다. 부동산공통 이율관리내역 조회서비스는 시작일자, 종료일자, 기준이율, 이율관리일수,  이율관리기간연수 등의 데이터를 제공합니다. ※ 데이터 포맷은 JSON 및 XML 형태로 제공됩니다.
