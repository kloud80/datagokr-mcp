summary_user: 서울시 액화석유가스(LPG) 용품 제조업체를 업체(관리번호) 한 건씩 담은 인허가 원장으로, 인허가일자·폐업·휴업·재개업일자와 영업상태, 사업장명·주소·좌표, 저장설비 위치·용기저장실·차고지·사무실 면적·취급가스용량 같은 설비 정보를 담는다. 가스안전 담당자나 분석가가 '서울에서 지금 영업 중인 LPG 용품 제조업체는 어디에 있고 취급 용량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)·관리번호로만 잇고, LOCALDATA 지방행정 인허가 데이터와 원천을 공유한다.
description_portal: 서울시 액화석유가스용품제조업체 인허가 정보는 액화석유가스(LPG) 용기, 설비 등 가스용품을 제조·취급하는 업체의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소·폐업·휴업·재개업일자와 영업상태, 상세영업상태를 통해 각 업체의 행정 이력을 확인할 수 있으며, 사업장명, 전화번호, 주소, 좌표, 소재지면적, 업태구분명 등으로 위치와 기본 정보를 파악할 수 있습니다. 또한 저장설비위치, 용기저장실·차고지·사무실 면적, 배관설치장소, 길이변경내용, 취급가스용량, 가스용품종류, 설비명, 물품규격, 면제범위 등의 정보로 설비·안전·취급 규모를 세부적으로 확인할 수 있습니다. 이 데이터는 가스안전 관리 및 점검 대상 파악, 위험도 및 취급 용량 분석, 관련 제조업체 분포와 입지 분석, 가스 관련 정책·규제 수립 및 안전 기준 개선, 민간 지도·정보 서비스와 연계한 안전정보 제공 등 다양한 행정·연구·산업적 활용에 유용한 자료입니다.
