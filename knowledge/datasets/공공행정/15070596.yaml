description_portal: '경상북도 소비자물가지수 월별로 나열하여 정보를 제공합니다.( 제공항목 : 생활물가지수, 품목별 물가지수, 신선식품 물가지수  등)본 데이터는 경상북도 지역의 소비자물가 변동 수준을 파악하기 위한 지표 자료로, 도민의 실질적인 생활비 부담과 물가 동향을 분석할 수 있도록 생활물가지수, 신선식품 물가지수, 품목별 물가지수를 포함하고 있다.소비자물가지수는 기준연도를 100으로 하여 물가의 상대적 변동 정도를 지수화한 통계자료로, 본 데이터는 지역 물가 동향 분석, 경제정책 수립, 민생 경제 현황 파악, 연구분석 자료 등 다양한 목적으로 활용할 수 있다.'
