description_portal: 개인정보보호 및 활용조사는 정보주체(국민)와 개인정보처리자(사업체, 공공기관)의 개인정보 보호 인식 수준, 개인정보 보호 활용 현황 등 개인정보 관리실태 등을 파악하기 위한 목적으로 2022년 정부 승인통계를 구축한 이후 매년 통계조사를 추진하고 있음.ㅇ 본 데이터는 민간기업 개인정보처리자의 개인정보 보호 활용 실태를 파악하여 개인정보 보호에 대한 법령, 정책, 제도 개선 등을 위한 기초 자료임.ㅇ 2022~2024년의 마이크로데이터, 조사표(민간), 항목 및 코드북이 포함되었음.ㅇ 목표 모집단은 조사 기준 시점 종사자 수(대표자 포함) 1인 이상의 기업체이며, 조사 모집단은 조사 직전 해 기업통계등록부(SBR, Statistical Business Registers)에 등록된 기업체 중 목표 모집단에서 정의된 업종에 속한 기업체로 정의하였음.ㅇ 민간부문 표본 크기는 6,000개임.ㅇ 연도별 표본 배분 방법이 상이함에 유의  - 2022년 멱등할당, 2023년 순차적 제곱근 비례배분, 2024년 균등할당
