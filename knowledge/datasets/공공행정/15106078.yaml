summary_user: 2022년 6월 1일 제8회 전국동시지방선거를 두고 선거 전 두 차례(각 약 1,500명)와 선거 후 한 차례(1,520명) 실시한 유권자 의식조사의 응답자 1명당 1행 원자료로, 선거 관심·투표 참여 형태 같은 문항 응답을 전국 범위로 담는다. 연구자나 분석가가 '지방선거 투표 의향과 실제 참여가 선거 전후로 어떻게 달라졌나' 같은 질문을 다룰 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어서, 응답자 ID와 할당지역 코드는 조사 안에서만 쓰고 다른 데이터는 지역 이름 매핑이나 같은 기관 자료로만 연결한다.
description_portal: '2022년 6월 1일에 실시한 제8회 전국동시지방선거에 대한 유권자 의식조사로 선거  관심 및 투표참여 형태 등에 대한 유권자 의식과 태도를 조사하여 향후 선거에 대한 국민의 관심과 참여를 높이고, 선거 관련 제반 연구의 기초자료로 활용하기 위함. ※ 본 조사는 선거일 전 2차례, 선거일 후 1차례 총 3차례 진행됨. ▶ 1차 조사: 2022. 5. 9. ~ 5.10. (선거일 23일 전) 1,512명▶ 2차 조사: 2022. 5.22. ~ 5.23. (선거일 10일 전) 1,505명 ▶ 3차 조사: 2022. 6. 2. ~ 6.22. (선거일 후) 1,520명'
