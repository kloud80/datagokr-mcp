summary_user: 한국수력원자력 각 사업소의 건물·주요 시설물별로 영상정보처리기기(CCTV)의 설치 위치와 촬영범위, 대수, 촬영시간(시간 단위), 영상보관기간(일 단위), 보관장소를 담은 현황 파일이다. 원전 사업소 주변 주민이나 개인정보 담당자가 "특정 사업소에 CCTV가 몇 대, 어디를 비추며 영상을 며칠 보관하는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소 이름을 매핑하거나 같은 기관 코드로만 이어 쓴다.
description_portal: '한국수력원자력은 보안과 안전을 목적으로 각 사업소에 영상정보처리기기를 설치 및 운영하고 있으며 이에 대한 현황 정보를 공개합니다. 제공 정보는 각 사업소의 건물 또는 주요 시설물별로 영상정보처리기기가 설치된 위치 및 촬영범위,대수, 촬영시간, 영상보관기간, 영상보관장소 항목으로 구성되어 있습니다. 대수의 단위는 개수이며 촬영시간은 시간 기준으로 표시되어 있습니다.(예 : 24 = 24시간), 촬영한 영상은 설정된 보관기간 동안 보관장소에 보관됩니다. 보관기관은 일자로 표기됩니다.(예시 : 30 = 30일)'
