summary_user: 경기도 시군구 단위로 기준년월(crtr_ym)마다 성별·연령대(10대~60대 이상)별 유동인구 수와 비율, 전월 대비·전년 동월 대비 증감값과 증감률을 담은 월별 집계 자료다. 상권 분석가나 창업 예정자가 "우리 시군구에서 어느 성별·연령대 유동인구가 많고 최근 늘었는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드(signgu_cd)나 시군구 이름 매핑으로 이어 쓰며, 같은 부문의 LOCALDATA 인허가·점포 원장과 시군구 × 월 기준으로 맞춰 상권 분석에 활용한다.
description_portal: 이 데이터는 경기도 내 각 시군구 단위에서 특정 시점 기준으로 성별 및 연령별 유동인구 현황을 집계한 자료입니다. 주요 항목은 기준년월, 시군구코드, 성연령코드, 코드분류명, 유동인구수, 유동인구수비율, 전월대비증감값 및 증감비율 등으로 구성되어 있으며, 성별과 연령층(10대~60대 이상)을 기준으로 유동인구의 분포와 변화 추이를 확인할 수 있습니다. 이 데이터를 활용하면 특정 시군구에서 어느 연령대와 성별이 주로 유동하는지 분석이 가능하며, 상권 분석, 지역별 생활 인프라 설계, 정책 기반 인구 흐름 추적 등 다양한 방면에 활용할 수 있습니다. 특히 유동인구수비율과 증감비율 항목을 통해 지역별 변화 추이를 직관적으로 파악할 수 있으며, 인구 집중도나 감소 지역에 대한 인사이트 도출이 가능합니다.
