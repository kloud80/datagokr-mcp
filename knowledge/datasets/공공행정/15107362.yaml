summary_user: 행정안전 통계연보에 수록된 주민등록세대 기준 연령별(10대 이하, 20대, 30대, 40대 등) 1인 세대수를 전국 단위로 담은 집계 통계이며, 행정구역별 공간 정보는 없다. 분석가나 정책 담당자가 '1인 가구 중 어느 연령대 비중이 큰가, 연도별로 어떻게 변하는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 주민등록 인구·세대 통계와는 연도·연령대 이름을 맞춰 붙여 써야 한다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '주민등록세대', '연령별 1인세대' 에 관한 통계입니다. 주민등록세대 기준 10대 이하, 20대, 30대, 40대 등 나이를 기준으로 연령별 1인세대 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
