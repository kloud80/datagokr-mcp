summary_user: 국회의원이 발의한 법률안을 의안 한 건 단위로 담으며, 의안번호·대수·법률안명·대표발의자와 공동발의자, 소관위원회, 발의일과 위원회·법제사법위원회·본회의 단계별 회부·상정·처리일과 처리결과를 함께 담는다. 국민·기자·입법 분석가가 "특정 의원이 이번 대수에 대표발의한 법안은 무엇이고 지금 어느 심사 단계에 있는가"를 확인하는 데 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않았으므로, 다른 국회 의안 데이터와는 의안번호(BILL_NO)나 의원 이름 같은 같은 기관 안의 식별자를 맞춰 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
