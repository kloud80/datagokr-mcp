summary_user: 서울 강남구에서 국제회의의 계획·준비·진행 업무를 위탁받아 대행하는 국제회의기획업 업소를 업소별로 담은 인허가 원장으로, 인허가일자·영업상태·폐업·휴업일자·주소·사업장명·좌표 등을 담는다. 강남구에서 지금 영업 중인 국제회의기획업체가 어디에 몇 곳 있고 언제 생기거나 문을 닫았는지 알아보려는 MICE 사업자나 상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(개방자치단체코드 성격의 OPNSFTEAMCODE)로만 잇고, LOCALDATA 인허가 자료와 원천을 공유한다.
