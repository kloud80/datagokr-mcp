description_portal: '○ 통계개요* 통계명 : 자치구별 연령계층별 인구구성비(추계인구)* 통계종류 : 서울시 자치구별 장래 연령계층별 인구구성비를 추계하여 제공하는 일반?가공통계* 작성목적 : 서울시 자치구별 인구추이 분석을 통해, 보건?복지 등 맞춤형 서비스 증진을위한 공공 및 민간분야의 소지역 장래인구에 대한 수요 증가에 부응하고, 이를활용한 다양한 주제별 추계의 기초자료를 제공하는 것을 목적으로 함* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 장래추계(2020-2040) 연령계층별 인구구성비○ 용어설명* 추계인구 : 장래인구추계 시?도편의 결과를 기초로 서울시 자치구 성?연령별 기준인구를 확정하고,자치구별 인구변동요인(출생, 사망, 국내이동 등)을 분석, 출산력?사망력?국내 이동모형 및 장래 변동수준에 대한가정을 설정하여 추계한 인구○ 기 타* 본 자료는 2020년 6월 공표한 서울시 자치구별 장래인구추계(2020-2040) 자료* 인구는 국적에 관계없이 국내에 거주하는 인구임(외국인도 포함)○ 출 처 : 스마트도시담당관 「서울특별시 자치구별 장래인구추계」'
