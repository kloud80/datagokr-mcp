summary_user: 전라남도 무안군에 신고된 행정사 사무소를 한 건씩 담은 신고대장 원천 자료로, 신고일자·행정사 종류·행정사명·사무소명·소재지·전화번호·운영상태를 담으며 파일 크기는 약 3KB로 작다. 무안군에서 서류 작성이나 인허가 신청 대리를 맡길 행정사 사무소가 어디에 있고 지금 운영 중인지 찾는 주민·사업자가 쓴다. 전역 조인 키가 없어 소재지 주소를 기준으로 다른 시군구 행정사 현황이나 생활 행정시설 자료와 이어 쓴다.
description_portal: 전라남도 무안군 행정사업무 신고대장의 일련번호, 신고일, 종류, 성명, 명칭, 소재지, 전화번호 등 데이터입니다. 행정사업무는 행정기관에 제출하는 서류의 작성이나 권리ㆍ의무, 사실증명에 관한 서류의 작성합니다. 행정기관의 업무에 관련된 서류의 번역 제1호부터 제3호까지의 규정에 따라 작성된 서류의 제출 대행, 인가ㆍ허가 및 면허 등을 받기 위하여 행정기관에 하는 신청ㆍ청구 및 신고 등의 대리, 행정 관계 법령 및 행정에 대한 상담 또는 자문에 대한 응답, 법령에 따라 위탁받은 사무의 사실 조사 및 확인합니다.
