description_portal: 본 자료는 대전광역시 특성화고 글로벌 현장학습 지원사업의 운영 현황에 대한 내용을 담고 있습니다. 본 사업은 실무 능력과 글로벌 역량을 두루 갖춘 전문 인재를 양성하는 것을 주요 목적으로 하며, 공정하고 체계적인 선발 과정을 통해 해외 현장학습 수행 능력을 갖춘 학생들을 선발하고 있습니다. 사업은 대전광역시교육청이 주관하여 운영하고 있으며, 글로벌 진출 기반을 다지기 위한 실질적인 직업교육 프로그램으로 구성되어 있습니다. 2023년 기준 총 2억 원의 예산이 지원되었으며, 학생들의 국제적 감각과 실무 경험을 높이기 위한 다양한 활동들이 포함되어 있습니다. 이 사업은 특성화고 학생들의 진로 역량 강화와 글로벌 경쟁력 확보를 위한 핵심 프로그램으로 운영되고 있습니다.
