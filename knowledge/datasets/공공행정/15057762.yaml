summary_user: 지방공기업별·회계연도별로 직원 임금 총액을 기본급, 급여성 복리후생비, 수당, 시간외근무수당, 성과급 등 항목별(천원 단위)로 나누고, 직원수·평균근속년수·1인당 평균임금(남녀 구분 포함)을 함께 담은 전국 단위 경영공시 집계 자료다. 지방공기업 간 임금 수준이나 성별 임금 격차를 비교하려는 분석가·언론·취업준비생이 '특정 공사·공단의 1인당 평균임금은 얼마이고 다른 기관과 어떻게 다른가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 경영공시 자료와는 기관명(ENT_NAME)과 회계연도를 맞춰 이어 쓴다.
limits: 공통 기관 코드가 없어 다른 데이터와 연결할 때 기관명 표기를 직접 맞춰야 한다. 전국 기관 단위 집계라 개별 직원·직급별 임금이나 지역 공간 분석에는 쓸 수 없다.
