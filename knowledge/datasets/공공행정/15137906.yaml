description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 전자 회의록에 포함된 안건 정보를 제공합니다. 시의회에서 심의하고 의결한 안건의 기본 정보를 담고 있으며, 각 회의록에 상정된 안건을 체계적으로 관리합니다. 고유번호는 안건을 식별하는 코드이며, 회의록 고유번호는 해당 안건이 다뤄진 회의록과 연결됩니다. 안건번호는 의회에서 부여한 안건의 공식 번호이고, 안건명은 심의 대상이 되는 안건의 제목입니다. 본 데이터는 의정 활동 기록, 안건 처리 현황 파악, 의사결정 과정 공개, 의회 운영 투명성 확보 등에 활용되며 시민들이 의회의 심의 내용을 쉽게 확인할 수 있도록 지원합니다.
