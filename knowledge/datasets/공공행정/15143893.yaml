description_portal: '[SGIS 오픈 플랫폼] "e지방지표" 서비스에서 제공되는 지표의 설명 데이터입니다.지표명, 행번호, 설명글을 포함하고 있으며, 설명글이 없는 행은 제외하였습니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. e지방지표  SGIS오픈플랫폼의 "e-지방지표"는 국가승인통계 중 국가통계포털(KOSIS)에서 서비스 되고 있는 행정구역단위 통계를 GIS 상에서 제공합니다.'
