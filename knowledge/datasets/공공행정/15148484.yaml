description_portal: 본 데이터는 대구광역시 서구에서 매년 발간하는 통계연보의 인터넷 열람 주소를 연도별로 정리한 자료이다. 2001년부터 2024년까지 총 24개 연도의 통계연보가 포함되어 있으며, 각 연보는 해당 연도의 인구, 경제, 복지, 교육, 환경, 행정 등 다양한 분야에 걸친 서구 지역의 주요 통계 지표를 수록하고 있다. 본 자료를 통해 사용자는 특정 연도의 통계연보를 신속하게 찾아볼 수 있으며, 정책 수립, 연구 분석, 행정 평가 등에 필요한 기초자료로 활용할 수 있다. 연보별 URL을 함께 제공함으로써 정보 접근성을 높였으며, 지역 통계에 기반한 객관적인 행정자료 제공을 통해 공공데이터의 활용도를 제고하고자 한다. 본 데이터는 주민, 연구자, 공무원 등 다양한 수요자에게 유용한 참고자료가 될 수 있다.
