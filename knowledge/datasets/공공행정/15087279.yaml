description_portal: 한국동서발전의 연도별 차량 보유 현황 정보를 제공하는 데이터입니다. 해당 데이터는 차량 종류 및 구분에 따라 2020년부터 2024년까지의 연도별 보유 대수를 나타내며, 기간 내 증감 추이도 함께 제공합니다. 데이터 항목은 차량, 구분, 2020, 2021, 2022, 2023, 2024, 증감으로 구성되어 있으며, 차량의 종류별 증감 흐름과 자산 운용 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 이 데이터는 학계 및 연구기관에서 공공기관의 운송 자산 운영 방식, 연도별 차량 수요 및 정책 변화의 영향을 분석하거나, 환경 정책에 따른 차량 감축 및 친환경 차량 도입 여부 등을 연구하는 데 유용하게 활용될 수 있습니다.
