description_portal: '광주광역시는 정보화 사업의 일환으로 각 행정 부서에서 운영 중인 총 81개의 정보시스템에 대한 상세한 현황 자료를 체계적으로 정리하여 제공하고 있습니다. 이 자료에는 각 정보시스템의 명칭, 주요 서비스 대상(정부 내 내부 업무 지원용 또는 시민을 위한 대국민 서비스용), 시스템 운영 목적(예: 시민에게 필요한 정보를 제공하거나 내부 행정 업무를 효율적으로 처리하기 위한 목적), 실제 시스템을 운영·관리하는 담당 부서, 그리고 해당 시스템이 처음 구축된 연월 등 구체적인 항목들이 포함되어 있습니다. 이러한 정보를 종합적으로 제공함으로써, 광주광역시는 행정서비스의 투명성과 효율성을 높이는 것은 물론, 다른 중앙정부나 지방자치단체, 민간 기업 등에서도 공공데이터로써 유용하게 활용할 수 있도록 데이터를 개방·공유하고자 합니다. 또한 정보시스템 현황에 대한 정기적인 업데이트를 통해 최신 운영 실태를 반영하고, 정보화 정책 수립 및 디지털 행정 혁신 추진에도 기초자료로 활용될 수 있도록 관리하고 있습니다.'
