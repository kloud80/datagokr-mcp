summary_user: 광주광역시(현 전남광주통합특별시) 행정 부서가 운영하는 정보시스템을 시스템 한 건당 한 행으로 정리한 현황 파일(CSV, 약 20KB)로, 시스템 이름·운영부서·서비스대상(내부 업무용/대국민용)·목적·구축연월을 담는다. 정보화 담당자나 분석가가 "시청 어느 부서가 어떤 대국민 시스템을 운영하며, 구축된 지 오래된 시스템은 무엇인가"를 파악하거나 노후 시스템 고도화 대상을 고를 때 쓴다. 전역 조인 키는 없으므로 운영부서 이름이나 시스템 이름을 기준으로 다른 기관의 정보시스템 현황, 행정표준코드(기관·부서 코드)와 이름 매핑해 연결한다.
limits: 표준 기관코드나 시스템 식별코드가 없어 다른 데이터와는 부서명·시스템명 문자열 매칭으로만 이을 수 있다. 공간 정보가 없는 시도 단위 목록이어서 지역별 분석에는 맞지 않고, 예산·이용량·운영 상태 같은 정량 지표는 담지 않는다.
