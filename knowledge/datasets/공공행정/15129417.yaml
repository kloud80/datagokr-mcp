summary_user: 조달청 목록정보시스템의 물품분류 체계를 담은 API로, 8자리 물품분류번호(대·중·소·세분류)와 품명, 10자리 세부품명번호, 생산자·모델별 물품식별번호와 품목명·제조업체·지역을 건별로 제공하며 전체 2,293건 중 검증 때 1,057행을 받았다. 조달 담당자나 사업자가 '납품하려는 물품이 어느 물품분류번호·세부품명에 해당하고 사용·삭제 상태는 어떤가'를 확인할 때 쓴다. 전역 조인 키는 실측되지 않았지만 물품분류번호(prdctClsfcNo) 코드표를 매개로 나라장터 입찰·계약 등 조달청 데이터의 물품 코드와 이름·코드 매핑으로 연결한다.
description_portal: 조달청 목록정보시스템(http://www.g2b.go.kr:8100/index.jsp)에서 제공하는 물품분류정보를 제공하는 서비스조달청 물품분류번호는 대분류(Segment) - 중분류(Family) - 소분류(Class) - 세분류(Commodity) 4단계의 계층구조로 구성되며, 각 단계별 2자리의 코드를 가지고 있는 총 8자리의 번호로 되어 있음(물품분류번호란 물품을 기능, 용도, 성질에 따라 대, 중, 소, 세분류로 나누어 번호를 매긴 것이며, 그 분류의 이름을 품명이라고 합니다.)세부물품분류번호의 경우 물품분류번호 8자리 뒤에 2자리의 숫자코드가 추가되어 총 10자리의 번호로 되어 있음(세부물품분류번호란 물품분류번호를 용도, 재질, 형태 등에 따라 세분화하여 번호를 매긴 것이며, 그 세부분류의 이름을 세부품명이라고 합니다.)물품식별번호란 물품을 생산자와 모델에 따라 고유번호를 매긴 것이며, 그 물품의 이름을 품목명이라고 합니다.
