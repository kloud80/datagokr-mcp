description_portal: 경상남도 거제시 공공데이터의 통계 카테고리는 다양한 분야를 포함하고 있습니다. 위생업소, 노인복지관, 경로당 등 사회복지 및 공중위생 관련 시설 수를 개소 단위로 제공합니다. 인구 및 이동 현황은 남녀 구분과 계층별 인원 수로 명 단위로 구분됩니다. 식품접객업소, 제조업, 농업 등 산업별 사업체 및 종사자 수 역시 개소와 명 단위로 정리되어 있습니다. 토지이용 현황은 전, 답, 임야 등 용도별 면적을 제곱미터(㎡) 단위로 나타냅니다. 축산업 사육 가구와 마리 수, 그리고 문화재 지정 현황은 개소 또는 개 단위로 기록되어 있습니다. 또한, 환경 관련 시설 수, 행정처분 내역 등도 각각 적절한 단위로 분류되어 있습니다.
