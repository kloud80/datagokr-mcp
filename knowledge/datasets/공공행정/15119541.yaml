summary_user: 구미시가 보유한 공유재산 중 토지를 필지 하나씩 소재지·지목·면적으로 담은 건별 목록이며, 범위는 구미시 한 곳이고 위치는 주소 단위로 적혀 있다. 시민이나 분석가가 '우리 동네에 시 소유 땅이 어디에 얼마나 있는지', 사업자가 '민간활용을 검토할 만한 시유지가 있는지'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 소재지 주소를 지번·주소 매핑으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 지적·토지 데이터와 바로 결합할 수 없고, 소재지 문자열을 따로 정제·매핑해야 한다. 범위는 구미시 하나뿐이라 다른 시군구와 비교하려면 각 기관 자료를 따로 모아야 한다.
