description_portal: 대구광역시 북구는 한해동안 추진한 행정업무와 각종 사업 추진결과를 바탕으로 구정발전의 기초로 활용하기 위해 매년 북구 통계연보를 발간하고 있습니다.『북구 통계연보』는 우리지역의 면적, 인구, 재정, 산업경제, 주택·건설·교통, 사회·보건·환경, 교육·문화, 공공행정 등 다양한 자료를 수록하여 쉽게 활용 가능하도록 하였습니다. 또한, 지금까지 발간한 통계 자료를 데이터 베이스로 구축하여 통계자료를 필요로 하는 이용자들이 편리하게 데이터를 얻을 수 있도록 구 홈페이지 ＂북구 데이터 통합플랫폼＂에서 제공하고 있습니다. 『북구 통계연보』는 통계법 제 29조에 의거 작성되었으며, 본 자료는 각 실·과·소 및 관계 주요기관으로부터 제출된 기본적인 통계자료를 수집하여 요약 편집하였습니다.일부 통계수치는 반올림이 되었으므로 합계가 일치하지 않을 수 있습니다.『북구 통계연보』가 우리 구의 나아갈 비전을 제시하고, 구민의 행복한 삶을 이끌 수 있는 나침반 역할을 하기 바라며, 나아가 우리 북구가 신성장 거점도시로 자리매김 할 수 있기를 기대합니다.
