description_portal: 우리군의 인구를 행정리 기준으로 나누어 표시하고 있는 자료로 읍면별, 행정리별로 나누어 세대수, 인구수를 나타낸다.자료는 구분(읍면, 행정리로 표시)를 기준으로 세대수, 남·여 인구, 합계 인구를 표시하고있다.우리군은 1개의 읍, 8개의 면으로 나누어 지고  법정리는 118개이고 행정리는 204개로 법정리는 1개 이상의 행정리로 구성된다. 영덕읍(Yeongdeok-eup)은 17개 법정리와 27개의행정리로구성된다강구면(Ganggu-myeon)은 10개 법정리와 22개의행정리로구성된다남정면(Namjeong-myeon)은 15개 법정리와 22개의행정리로구성된다달산면(Dalsan-myeon)은 11개 법정리와 19개의행정리로구성된다지품면(Jipum-myeon)은 19개 법정리와 24개의행정리로구성된다축산면(Chuksan-myeon)은 10개 법정리와 18개의행정리로구성된다영해면(Yeonghae-myeon)은 9개 법정리와 24개의행정리로구성된다병곡면(Byeonggok-myeon)은 14개 법정리와 25개의행정리로구성된다창수면(Changsu-myeon)은 13개 법정리와 23개의행정리로구성된다
