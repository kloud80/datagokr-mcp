description_portal: 본 데이터는 한국중부발전이 일정 기간 동안 채용한 지역인재 현황을 연도별로 정리한 자료입니다. 항목은 연도, 신규채용 인원, 비수도권 지역인재 수, 이전지역 지역인재 수로 구성되어 있으며, 인원 수의 단위는 ‘명’입니다. 비수도권 지역인재는 채용시점 대학까지의 최종학력이 비수도권 지방학교인 자를 의미하고, 이전지역 지역인재는 채용시점 대학까지의 최종학력이 본사 이전지역 소재 지방학교인 자를 나타냅니다. 이 데이터는 지역인재 채용 의무 이행 수준, 공공기관 지방 이전의 실효성 평가 등과 관련된 정책 분석에 활용될 수 있으며, 채용정책 공시나 사회적 책임 경영 지표 자료로도 유용합니다.
