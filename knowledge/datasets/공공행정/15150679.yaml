summary_user: 전국 소방서 등 소방 관련 시설의 위치정보를 시설 한 곳당 한 행으로 담으며, 소속 소방기관명, 시설명, 지번·도로명 주소, 전화번호, 좌표가 들어 있다. 특정 지역에서 가장 가까운 소방서나 119안전센터가 어디인지 찾을 때나, 시군구별 소방시설 분포를 분석할 때 쓴다. 전역 조인 키는 실측되지 않았으므로 다른 데이터와는 시도·시군구·읍면동 코드(STDG_SGG_CD 등)나 주소·시설명 매핑으로 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 소방서 등 위치정보입니다.
