description_portal: 본 데이터는 국가통계마이크로데이터통합서비스(MDIS)* 시스템의 서비스신청정보에 관한 내용입니다.- 이용신청서정보, 이용신청서 회원 공동 연구자 정보, 이용신청서 비회원 공동 연구자 정보, 신청서 승인 현황, 신청서 결제 결과, 신청서별 반입파일/반출파일 신청 정보 등에 관한 내용을 포함하고 있습니다. * 국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다.이에 국가데이터처는 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.
