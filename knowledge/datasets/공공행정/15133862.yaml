summary_user: 경기도의회 의원의 기본 정보를 대수(asemby_cnt)별로 의원 한 명당 한 행으로 담은 자료로, 선거구·정당·영문 및 한자 이름·선수·사진 식별자 등을 포함한다. 분석가나 연구자가 '특정 대수 경기도의회에서 정당별 의석이 어떻게 나뉘었고 재선 이상 의원은 몇 명인가' 같은 질문에 쓴다. 전역 조인 키는 없으며, 선거구명·정당명 같은 이름이나 기관 자체 코드(선거구 코드, 정당 코드)를 매핑해야 선거 결과나 다른 의정포털 자료와 이어 쓸 수 있다.
description_portal: 경기도의정포털_경기도의원정보대수별 데이터는 경기도의회 의원들의 기본 정보를 대수별로 정리한 자료입니다. 주요 항목에는 도의원대수, 선거구명, 정당명, 의원명(영문·한자), 선수, 선거구명, 의원 사진 등이 포함됩니다. 이를 통해 특정 대수별 의원 구성과 선거구별 정당 분포, 의원별 경력 등을 체계적으로 파악할 수 있습니다. 또한 정당별 의석 분포, 지역구별 대표성, 의원 교체 현황 등을 분석하는 데 활용될 수 있으며, 정치·행정 연구뿐만 아니라 선거제도 분석, 정당별 정책 방향 연구, 지방의회 운영 성과 평가 자료로도 쓰일 수 있습니다.
