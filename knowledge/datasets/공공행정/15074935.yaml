summary_user: 인천광역시 영종구가 운영하는 e음버스(마을버스형 순환 노선)의 정류장을 노선명·권역·정류장명·정류장번호 단위로 한 줄씩 담은 소규모 파일(csv 약 6.6KB)이다. 동인천·율목동·금창동 일대를 다니는 e음버스가 어느 정류장에 서는지 확인하려는 주민이나, 교통소외지역 노선을 살펴보는 분석가가 쓴다. 전역 조인 키가 없어 다른 버스 정류소 데이터와는 정류장명이나 정류장번호(정류장번호)를 직접 대조해서만 이을 수 있다.
description_portal: 기존에 버스가 다니지 않던 율목동과 금창동의 교통 편의를 증진시키는 마을버스의 역할을 담당한다.동인천동, 율목동, 금창동 구간에서는 편도로 순환한다. 반대 방향으로 가야 한다면 인천e음11번을 이용해야 한다.교통소외지역을 경유하고, 많은 고등학교를 경유함에도 불구하고 이용하는 승객이 많이 없다. 빈 차로 다닐때가 많은데, 어디로 가기도 애매한 노선선형과 2대로 다녀서 매우 긴 배차간격, 그리고 그마저도 잘 안지켜서 9~30분으로 심하게 널뛰는 배차간격 때문에 이용하기에 어려움이 크다. 이는 같이 중구에서 운행하는 인천e음11번도 마찬가지.주로 폭이 좁은 도로나 골목길을 운행한다. 특히 기존에 폭이 좁아 버스가 지나가지 않던 홍예문을 경유해 교통사각지대를 해소해서 주민들의 평가는 좋은편이다.송월동동화마을 제2주차장에서 주박한다.협소한 골목을 운행하는 구간이 많아 통행에 어려움이 커서 저상버스 투입 의무화에서 제외되었다.배차간격이 20분이 넘는데도 불구하고 정해진 출발시간이 없이 랜덤으로 운행한다.
