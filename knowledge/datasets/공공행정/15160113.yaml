description_portal: '부산진구에서 등록되어 운영 중인 담배 판매 업소의 명칭, 위치, 영업 상태를 안내하는 데이터입니다.-데이터 구성 항목연번: 등록된 업소 리스트의 순번 업소명: 부산진구에 등록된 가게의 공식 상호 (편의점, 마트, 일반 점포 등)업소 도로명주소: 업소가 실제로 위치한 곳의 도로명 주소지정일자: 담배소매인 지정일자 데이터기준일자: 정상영업 중인 소매인 기준일자-데이터 활용 안내부산진구 관내 상권의 담배 소매점의 분포도와 위치를 확인하실 수 있습니다.신규 창업이나 상권 분석 시 주변 판매점의 영업 현황을 파악하는 용도로 적합합니다.정보 업데이트 주기(1년)에 따라 실제 현장 상황과 차이가 있을 수 있으니 참고용으로 활용하시기 바랍니다.부산진구청 홈페이지에도 동일 목적의 자료가 게시되고 있으니 참고해주시기 바라며, 데이터 기준일에 따라 내용이 달라질 수 있습니다.해당 데이터는 1년 주기로 현행화되어 공개될 예정이며 담배소매인 관련 추가문의는 051-605-4486로 문의하시면 안내 도와드리도록 하겠습니다'
