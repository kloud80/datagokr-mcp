description_portal: '이 데이터는 한국지능정보사회진흥원(NIA)의 스마트워크 자가진단에서 사용되는 설문 문항과 답변 항목에 대한 정보를 정리한 자료입니다.실제 사용자 응답 결과가 아니라, 진단 도구에 포함된 질문 내용과 선택지(답변 항목) 텍스트로 구성되어 있으며, 스마트워크 관련 역량을 진단하기 위한 기준 문항들을 포함합니다.주요 구성은 다음과 같습니다:질문내용: 진단에 사용되는 설문 문항의 텍스트답변항목일련번호: 각 질문에 대한 보기(선택지)를 구분하는 번호답변항목내용: 해당 질문에 제시된 답변 보기의 실제 텍스트이 데이터는 스마트워크 자가진단의 설문 구성 체계를 파악하거나, 문항별 가중치 적용 및 점수화 로직 설계를 위한 기반 자료로 활용됩니다. 또한, 사용자 응답 데이터 또는 점수 데이터와 연계해 분석 시 필요한 참조 자료입니다.'
