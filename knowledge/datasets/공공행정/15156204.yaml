description_portal: 한국남동발전의 정보공개 처리 현황 데이터 입니다.정보공개제도란 공공기관이 직무상 작성 또는 취득하여 관리하고 있는 정보를 수요자인 국민의 청구에 의하여 열람·사본·복제 등의 형태로 청구인에게 공개하거나 공공기관이 자발적으로 또는 법령 등의 규정에 의하여 의무적으로 보유하고 있는 정보를 배포 또는 공표 등의 형태로 제공하는 제도를 말합니다. 전자를 『청구공개』라 한다면, 후자는 『정보제공』이라 할 수 있습니다.절차는 청구 및 접수 > 공개여부 결정 > 공개여부 결정의 통지 순으로 진행됩니다.해당 정보공개 처리 현황으로 한국남동발전에서 정보 공개 방법에 대한 처리건수를 확인할 수 있습니다.
