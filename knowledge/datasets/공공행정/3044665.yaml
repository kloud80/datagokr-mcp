summary_user: 수원시의 구별·동별 법정동 수, 행정동 수, 통 수, 반 수를 읍면동 단위로 정리한 집계 파일로, 2.5KB 남짓한 작은 CSV입니다. 동마다 통·반이 몇 개인지, 구별로 행정동이 어떻게 나뉘는지 확인하려는 주민·공무원·분석가가 지역 비교나 행정서비스 배치 검토에 쓴다. 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 시군명·구명·읍면동명 이름을 맞춰 이어 쓴다.
description_portal: 경계조정 및 통반조정에 따른 수원시 행정구역현황을 제공하는 데이터입니다. 수원시 내 구별/동별 법정동, 행정동, 통, 반 수를 제공하며, 주기는 반기별로 업데이트를 하고자 합니다. 수원시 통·반 설치 조례, 수원시 동의 명칭 및  관할구역에 관한 조례를 근거로 하고 있습니다. 경기도 수원시 읍면동에 따라 법정동 수, 행정동 수, 통수, 반수, 동별 내용이 정리되어 있는 데이터입니다. 다양한 분야, 영역에서 활용하여 주시기를 바랍니다.   이 데이터는 지역별 비교와 행정서비스를 분석하는데 활용 할 수 있습니다. 누구나 열람이 가능하고 활용할 수 있습니다.
