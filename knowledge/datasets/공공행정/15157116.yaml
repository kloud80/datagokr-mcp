summary_user: 경기도 가평군이 보유한 공유재산 가운데 활용되지 않는 유휴부지를 필지별로 담은 원천 목록으로, 읍면동·도로명/지번주소·위경도·지목·부지면적·공시지가·대장가격을 함께 싣는다(CSV 약 1KB의 소규모 파일). 가평군 안에서 매각·임대나 민간 협력 사업에 쓸 만한 군 소유 빈 땅이 어디에 얼마나 있는지 찾는 사업자나, 공유재산 활용 방안을 검토하는 분석가가 쓴다. 전역 조인 키나 필지고유번호(PNU)는 없어서, 다른 데이터와는 지번주소·도로명주소 문자열 매칭이나 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 경기도 가평군이 보유·관리하는 공유재산 중 현재 활용되지 않고 있는 유휴부지의 현황을 체계적으로 제공하는 자료입니다. 읍면동별 위치 정보와 도로명주소 및 지번주소를 포함하여 행정구역 단위별 분포 현황을 확인할 수 있으며, 위도와 경도 좌표를 제공하여 공간정보 기반 분석과 지도 서비스 연계가 가능합니다. 또한 지목명, 부지면적, 공시지가, 대장가격 정보를 포함하고 있어 토지의 법적 성격과 규모, 공적 가치 수준을 파악할 수 있습니다. 해당 자료는 공유재산의 효율적 관리와 활용 방안 검토, 정책 수립 및 민간 협력 사업의 기초자료로 활용될 수 있도록 구성되어 있습니다. 데이터기준일자를 명시하여 정보의 관리 시점을 확인할 수 있으며, 공공자산의 투명한 공개와 데이터 기반 행정 지원을 목적으로 합니다.
