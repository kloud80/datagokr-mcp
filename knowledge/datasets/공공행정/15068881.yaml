description_portal: 국민신문고 국민제안 심사기간 준수현황 데이터는 접수된 제안에 대해 기관별로  심사기간을 얼마나 준수했는지를 보여주는 데이터입니다. 이 현황은 국민제안 처리의 신속성 및 책임성을 측정하는 지표로 활용되며, 해당 분기의 기관별  총 처리 건수, 기간  내처리건수,  초과건수, 처리기간 준수율 등의 정보를 포함하고 있습니다.심사 대상 건수와 심사기간 준수율을 통해 기관별 제안 심사 성과를 비교 분석할 수 있으며, 이를 바탕으로 제안 심사 프로세스의 개선점을 도출할 수 있습니다.​ 과거 분기의 자료는 주기성 과거 데이터에서 확인하시기 바랍니다.
