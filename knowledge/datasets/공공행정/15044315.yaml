description_portal: 본 데이터는 한국도로교통공단이 외국어 응시자의 이해를 돕기 위해 제공하는 운전면허 학과시험 영어 용어 해설 목록이다. 필드는 용어, 순번, 해설이며 규정·신호·차량조작 등 핵심 개념을 영문 표기와 우리말 의미로 제시한다. 표준화된 정의를 통해 문제은행, 안내문, 홈페이지, 교재 번역의 용어 일관성을 확보하고 민원 안내 품질을 높인다. CSV 구조로 제공되어 검색 등 기계처리가 용이하며 식별값을 활용한 참조 연계가 가능하다. 개인정보는 포함하지 않는다. 활용 예로는 응시자 용어집 배포, 번역 검수 체크리스트 작성, 빈도 분석을 통한 안내문 개선이 있다.
