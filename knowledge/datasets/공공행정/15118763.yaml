description_portal: 이 자료는 충청남도개발공사의 유연근무제 운영 현황으로, 연도별 시차출퇴근형·근무시간선택형·집약근무형·재량근무형 등 다양한 제도의 활용 인원과 전체 직원 대비 활용 비율을 제공한다. 단, 개인별 사유나 부서 단위 세부 현황 등은 제공하지 않는다.컬럼별 상세설명○ 연도 → 유연근무제 통계가 산출된 기준 연도를 의미하며, 연도별 제도 운영 현황을 비교할 수 있도록 제공됨○ 시차출퇴근형 → 출퇴근 시간을 개인 상황에 맞추어 조정하는 근무 형태로, 남성과 여성 직원별로 실제 이용 인원 수가 집계되어 제공됨○ 근무시간선택형 → 일정 범위 내에서 근무 시작과 종료 시간을 자율적으로 선택하는 제도로, 성별별 구분 집계가 이루어져 실제 활용 규모를 확인할 수 있음○ 집약근무형 → 주 단위 근무시간 총량은 동일하게 유지하되 특정 요일에 근무시간을 집중 배치하는 방식으로, 성별별로 나누어 실제 적용 인원이 기록됨○ 재량근무형 → 업무 성격상 근로자가 스스로 근무 시간과 방식을 자율적으로 결정할 수 있는 제도로, 남성과 여성별 활용 현황이 구분되어 집계됨○ 유연근무자 합계 → 해당 연도 유연근무제를 활용한 전체 인원을 의미하며, 시차출퇴근형·근무시간선택형·집약근무형·재량근무형 인원을 모두 합산하여 산출됨○ 현원 → 해당 연도 충청남도개발공사 전체 재직 인원을 의미하며, 총계뿐만 아니라 남성과 여성 인원으로 세분화되어 제공됨○ 유연근무율 → 전체 재직 인원 대비 유연근무제를 활용한 인원의 비율을 백분율(%)로 표시한 값으로, 기관 내 제도 활용 수준을 평가할 수 있는 핵심 지표임
