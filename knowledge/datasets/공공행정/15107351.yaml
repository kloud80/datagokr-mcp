summary_user: 행정안전 통계연보 '지방재정' 편에 실린 지방자치단체 통합재정 수지의 회계별 현황을 구분별 금년도·전년도·증감 값으로 담은 전국 단위 집계 통계입니다. 지방재정 분석가나 연구자가 "전국 지자체 통합재정 규모가 회계별로 전년보다 얼마나 늘거나 줄었나"를 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 회계 구분 이름이나 연도 기준으로만 맞춰 이어 써야 합니다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방재정' 중 '지방자치단체 예산', '지방자치단체 통합재정 수지(회계별 현황)'에 관한 통계입니다. 구분, 금년도, 전년도, 증감 등을 기준으로 지방자치단체 통합재정 회계별 현황을 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
