summary_user: 여주시에 설치된 무인민원발급기를 기기 한 대씩 담은 원장 파일로, 발급기명·관리기관·설치 주소와 상세위치·평일/공휴일 운영시간·장애인 편의기능(점자라벨, 음성안내, 휠체어 조작 등)을 담는다. 시민이 "주말에 여주에서 민원서류를 뗄 수 있는 발급기가 어디 있고 몇 시까지 운영하나"를 확인하거나, 분석가가 장애인 편의형 발급기 분포를 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 설치 주소나 도로명 코드(시도코드·도로코드·건물번호), 관리기관명을 이름 매핑해 잇는다.
description_portal: 여주시에서 운영 중인 무인민원발급기 현황에 대한 정보를 제공하는 공공데이터입니다. 본 데이터는 여주시에 설치된 무인민원발급기의 운영 현황을 나타내며 관리번호, 발급기명, 관리기관명, 설치장소 주소, 상세위치. 평일, 공휴일 운영시간, 장애인편의성,  시도코드,  시간  등의 항목으로 구성되어 있습니다. 민원 서류 발급 등 행정 서비스를 간편하게 이용할 수 있도록 지원하는 무인민원발급기는 시민 편의를 높이고, 생활 밀착형 공공서비스 확대에 기여합니다. 본 자료는 연 2회 정기적으로 갱신됩니다.
