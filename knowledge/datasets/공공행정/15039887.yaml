summary_user: 부산광역시 연제구 안의 개별 필지마다 구청장이 결정·공시한 단위면적당 가격(원/m²)을 법정동·본번·부번과 함께 담은 건별 원천 파일입니다. 토지 소유자나 매수 검토자가 연제구 특정 지번의 공시지가가 얼마인지 확인하거나, 분석가가 동별 지가 분포를 비교하는 데 쓴다. 전역 조인 키(필지고유번호 등)가 없어서 다른 토지·건물 데이터와는 법정동명과 본번·부번을 조합한 지번으로 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 개별공시지가는 국토교통부장관이 매년 공시하는 표준지공시지가를 기준으로 구청장이 조사한 개별토지의 특성과 비교표준지의 특성을 비교하여 국토교통부장관이 작성·공급한 「표준지와 지가산정대상토지의 지가형성 요인에 관한 표준적인 비교표(토지가격비준표)」 상의 토지특성 차이에 따른 가격배율을 산출하고 이를 표준지공시지가에 곱하여 산정한 후 감정평가법인등의 검증을 받아 토지소유자 등의 의견수렴과 구 부동산가격공시위원회 심의 등의 절차를 거쳐 구청장이 결정·공시하는 개별토지의 당위면적당 가격(원/m2)을 말합니다.
