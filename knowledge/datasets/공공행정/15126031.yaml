summary_user: 국회사무처가 펴내는 간행물 「예산춘추」의 게시물 목록을 건별로 담으며, 게시번호·등록일·담당 부서·분류·제목·원문 링크·첨부파일명이 한 건의 단위입니다. 국가 예산·재정 이슈를 다룬 국회 측 해설 글을 주제별로 찾아 원문을 열어보려는 연구자나 기자가 '특정 시기에 예산춘추가 다룬 재정 주제는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 국회 간행물·의정활동 데이터와는 제목·부서명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
