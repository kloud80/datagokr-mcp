description_portal: 한국동서발전의 연도 및 사업소별 지역농산물 구매현황 정보는 공공기관이 지역 경제 활성화를 위해 각 사업소에서 구매한 농산물 내역을 기록한 데이터입니다.해당 데이터는 연도, 지역, 사업소, 품목, 구매금액, 비고 등의 항목으로 구성되어 있으며, 특정 사업소가 어느 지역에서 어떤 품목의 농산물을 얼마만큼 구매했는지를 연도별로 확인할 수 있습니다.이 데이터는 공공기관이 지역 농가와의 상생협력, 지역경제 기여, 지역특산물 소비 촉진 등 사회적 가치 실현에 기여한 정도를 정량적으로 평가하는 데 유용합니다.학계 및 연구기관에서는 이 데이터를 기반으로 공공기관의 지역 농산물 구매 트렌드 분석, 품목별 구매 비중 비교, 사업소별 지역경제 기여도 평가, 지역 간 농산물 소비 편차 분석 등을 수행할 수 있습니다.또한 ESG 경영의 ‘S(사회)’ 영역 실천 사례로 활용 가능하며, 공공조달의 지역 순환성 평가, 지역농산물 판로 확대 정책의 실효성 검토, 지역 상생 모델 개발 등의 실증 연구에 필요한 기초자료로서 활용도가 높습니다.기관별 지역사회 연계 활동의 성과 비교나 사회책임 소비 확대를 위한 정책적 제언에도 활용될 수 있습니다.
