summary_user: 경기도 시군별로 시내버스(카드·현금)·중형택시 요금, 도시가스 소비자·도매·소매 단가, 사용량 구간별 상수도·하수도 단가, 20리터 쓰레기봉투 가격 같은 공공요금을 기준연월(SUM_YM)마다 한 행에 담은 집계 자료다. 분석가나 도민이 '우리 시의 수도·가스 요금이 이웃 시군보다 비싼가'처럼 시군 간 생활비와 공공요금 부담을 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명(SIGUN_NM)이나 경기도 시군코드(SIGUN_CD)를 맞춰 이어 쓴다.
description_portal: 이 데이터는 시군별 물가 수준을 파악할 수 있는 자료로, 생활에 밀접한 다양한 공공요금 항목을 포함하고 있습니다. 제공 항목은 시내버스요금(BUS_CHRG_CARD_UNPC, BUS_CHRG_CASH_UNPC), 택시요금(TAXI_CHRG_MDSIZE_UNPC), 도시가스요금(GAS_CONSMR_CHRG_DATA_VL 등 6개 항목), 상수도료(WTRSUPL_1_BL_UNPC 등 9개 항목), 하수도료(SEWERAGE_1_BL_UNPC 등 9개 항목), 그리고 쓰레기봉투료(WST_ENVELP_20_UNPC) 등이 있으며, 가격 단위는 대부분 ㎥ 또는 ㎖ 기준 단가로 표시됩니다.데이터는 생활비 분석, 공공요금 정책평가, 시군 간 비용 비교, 물가상승률 산정 등 경제 및 정책 분야에서 유용하게 활용될 수 있습니다. 도시가스요금은 소비자요금, 도매요금, 소매요금의 원단위 및 환산 단가로 나뉘어 있으며, 상하수도료 역시 사용량 구간별로 구분되어 단가를 제공합니다.지역별 물가차 분석, 저소득층 공공요금 부담 평가, 에너지 및 수도 정책 설계에 기반 자료로 사용될 수 있으며, 다양한 공공서비스의 가격 투명성 제고에도 기여할 수 있습니다.
