summary_user: 나라장터 개찰결과를 입찰공고 건별로 담아 최종낙찰업체·낙찰금액·낙찰률·참가업체수·개찰일시와 개찰완료·재입찰·유찰 목록, 복수예비가격을 제공하며, 검증 시 전국 범위 2026-06-15~2026-09-30 기간에서 443행을 받았다(API 전체 건수 305). 사업자나 분석가가 특정 수요기관 공고의 최종 낙찰업체와 낙찰률이 얼마였는지, 몇 개 업체가 참가했는지 확인하는 데 쓴다. 입찰공고번호·차수로 나라장터 발주계획·사전규격·입찰공고·계약 데이터와 이어 조달 전 과정을 따라가고, 낙찰업체 사업자등록번호(bidwinnrBizno)로 사업자 정보와, 수요기관·공고기관 코드로 기관 코드표와 연결한다.
description_portal: 나라장터 개찰결과를 물품, 공사, 용역, 외자의 업무별로 제공하는 서비스로 각 업무별로 최종낙찰자, 개찰순위, 복수예비가격 및 예비가격 정보를 제공하며 개찰완료목록, 재입찰목록, 유찰목록 또한 제공하는 나라장터 낙찰정보서비스복수예비가격이란?기초금액을 근거로 하여 15개의 예비가격을 작성한 것으로 이중 4개를 추첨하여 예정가격을 결정하는 것입니다. 개찰이 완료되면 예비가격상세목록조회 오퍼레이션으로 복수예비가격을 확인하실 수 있습니다.낙찰률이란? 예정가격에 대한 낙찰금액의 비율을 의미합니다.
