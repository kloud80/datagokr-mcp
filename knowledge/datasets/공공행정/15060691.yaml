description_portal: 이 통계 데이터는 당해년도 1월 1일부터 12월 31일까지 행정부 국가공무원의 파견 현황을 직급별로 산출한 인사통계 자료입니다.파견은 1호(국가적인 사업수행), 2호(타기관 행정지원), 3호(특수업무공동수행), 4호(교육훈련), 5호(교관요원), 6호(국제기구 등 업무수행), 7호(국내연구기관 능력개발 등)로 구성되어 있습니다.해당 통계자료는 일반직공무원 파견, 특정직공무원 파견으로 작성되어 있습니다단, 파견 규정을 적용받지 않는 임기제공무원 및 별정직공무원은 제외되었으며, 세부 파견유형이 구분되지 않는 검사 및 교육공무원은 합계만 표시되어 있습니다.
