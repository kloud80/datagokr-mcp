summary_user: 한국가스기술공사가 2020년 이후 개최한 이사회의 회차·개최일자·안건번호·부의안건명·심의의결 결과를 안건 단위로 담은 건별 CSV 파일(약 15KB)이다. 공공기관 감시에 관심 있는 국민이나 분석가가 '이 공사 이사회에 어떤 안건이 올라와 원안 가결·수정 의결됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 공공기관 이사회 자료와는 기관명이나 같은 기관 코드로만 맞춰 이어 쓴다.
description_portal: 'csv파일에는 한국가스기술공사 2020~현재까지 이사회 운영현황이 포함되어 있으며, 다음과 같은 네 가지 주요 항목으로 구성되어 있습니다.이사회 회차 : 2020~현재 이사회 개최 회차개최일자 : 해당 회차 이사회가 개최된 날짜안건명 : 해당회차에 부의된 안건명개최결과 : 해당 부의안건의 심의·의결 결과이 자료는 한국가스기술공사의 이사회 운영현황을 저리한 것으로, 이사회 회차, 개최일자, 안건명, 개최결과를 포함하고 있습니다.각 회차별 개최일자가 명시되어 있으며 부의안건명과 개최결과를 확인할 수 있습니다.기술공사의 이사회 운영현황을 파악하는데 참고자료로 활용 할 수 있습니다.'
