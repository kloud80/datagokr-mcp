summary_user: 서울시에 인허가된 사료제조업 업소를 한 건씩 담은 인허가 원장으로, 인허가·취소·휴업·폐업·재개업 일자와 영업상태, 사업장명·지번/도로명 주소·좌표·소재지면적, 축산업무·축산물가공 구분을 업소 단위로 담는다. 축산·사료 행정 담당자나 업계 분석가가 '서울에서 현재 영업 중인 사료제조업체는 어디에 몇 곳 있고 언제 폐업이 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호로만 연결하며, LOCALDATA 인허가 자료와 같은 원천을 공유한다.
description_portal: 서울시 사료제조업 인허가 정보는 서울시에 인허가된 사료 제조 관련 업체의 인허가 현황과 기본 특성을 파악할 수 있는 공공데이터입니다. 인허가일자, 인허가취소일자, 영업·휴업·폐업·재개업 등 영업상태 정보로 각 업체의 행정 이력과 현재 영업 여부를 확인할 수 있습니다. 사업장명, 전화번호, 주소(지번·도로명), 우편번호, 소재지면적, 좌표 등의 항목은 업체의 위치와 규모를 보여 줍니다. 또한 축산업무구분명, 축산물가공업구분명, 축산일련번호, 권리주체일련번호 등의 정보로 사료제조업이 축산·축산물 가공 관련 어느 범주에 속하는지 행정적·업종적 특성을 구분할 수 있습니다. 총인원 정보는 업체의 인력 규모를 파악하는 데 활용되며, 전반적으로 축산·사료 관련 행정 관리, 점검 계획 수립, 업계 현황 분석 등에 기초 자료로 활용할 수 있는 인허가 기반 데이터입니다.
