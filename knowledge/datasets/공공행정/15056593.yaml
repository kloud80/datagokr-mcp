summary_user: 지방자치단체별·회계연도별 자산 대비 부채비율을 담은 집계 지표로, 자치단체명과 코드, 두 개의 금액 항목, 비율 값을 함께 제공하며 범위는 전국입니다. 주민이나 분석가가 '우리 시·군·구는 자산에 비해 부채가 많은 편인가, 해마다 나아지고 있나'를 다른 지자체와 비교할 때 쓴다. 전역 조인 키는 없고, 자치단체코드(laf_cd)나 자치단체명을 이용해 같은 지방재정365의 다른 재정 지표와 연결한다.
description_portal: 지자체 자산대비 부채비율은 지방자치단체의 자산과 부채의 관계를 나타내는 재정 건전성 지표입니다.해당 지표의 비율은 자치단체가 보유한 자산이 부채를 얼마나 커버할 수 있는지 보여주며, 비율이 높으면 자치단체의 부채가 자신보다 많아 재정적 위험이 크다는 것을 의미합니다.반대로 비율이 낮으면 자산이 부채를 충분히 상쇄할 수 있어 재정적으로 안정적인 상태를 나타냅니다.이 지표의 비율은 자치단체의 재정 관리를 평가하고 장기적인 재정 건전성 유지 여부를 점검하는데 매우 중요한 역할을 합니다.
