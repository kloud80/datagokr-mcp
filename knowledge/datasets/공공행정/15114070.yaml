description_portal: 광주광역시 연도별(2018~2022) 주민등록인구현황 통계입니다. 주민등록인구는 주민등록신고에 기반한 통계로 매월 말일을 기준으로 집계합니다.광주광역시의 연도별 주민등록 인구현황 데이터는 2018년부터 2022년까지 매년 12월 말 기준으로 집계된 주민등록 인구 통계이며, 총인구, 남자인구, 여자인구, 세대수 등의 항목이 포함되어 있습니다. 이 자료는 광주광역시가 직접 제공하며, 주민등록 신고 기반으로 집계되기 때문에 실제 거주 인구를 반영한 신뢰성 높은 통계입니다
