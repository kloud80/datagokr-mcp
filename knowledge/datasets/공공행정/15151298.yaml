summary_user: 조달청 공사원가통합관리시스템의 표준공사코드 체계에서 표준시장단가를 세부공종 단위로 담은 전국 단위 CSV 파일(약 777KB)로, 세부공종별 품명·규격·단위와 재료비·노무비·경비·합계, 적용조건, 최신발표일자를 담는다. 수요기관 설계 담당자나 건설 분야 분석가가 시설공사 내역서를 작성하거나 검토할 때 특정 세부공종의 표준시장단가가 재료비·노무비·경비로 어떻게 나뉘는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 조달 데이터와는 세부공종코드나 품명·규격을 맞춰 보는 이름·코드 매핑으로만 연결한다.
