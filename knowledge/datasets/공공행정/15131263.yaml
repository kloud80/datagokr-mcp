summary_user: 2024년 4월 10일 제22대 국회의원선거를 두고 선거일 전 2차례(1,500명·1,511명), 선거일 후 1차례(1,639명) 실시한 유권자 의식조사의 응답자별 원자료로, 선거 관심과 투표참여 형태 등 문항 응답을 응답자 한 명당 한 행으로 담는다. 연구자나 분석가가 선거일이 다가올수록 유권자의 선거 관심과 투표 의향이 어떻게 달라졌는지, 어떤 응답자 특성에서 투표참여가 달랐는지를 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없고 문항이 코드형 변수명(Q1, Q2K1 등)으로만 되어 있어, 실제 투표율 같은 선거 통계와는 지역명·항목 이름을 수작업으로 맞춰야 연결된다.
description_portal: '2024년 4월 10일에 실시한 제22대 국회의원선거에 대한 유권자 의식조사로 선거 관심 및 투표참여 형태 등에 대한 유권자 의식과 태도를 조사하여 향후 선거에 대한 국민의 관심과 참여를 높이고, 선거 관련 제반 연구의 기초자료로 활용하기 위함. ※ 본 조사는 선거일 전 2차례, 선거일 후 1차례 총 3차례 진행됨. ▶ 1차 조사: 2024. 3.18. ~ 3.19. (선거일 23일 전) 1,500명▶ 2차 조사: 2024. 3.31. ~ 4. 1. (선거일 10일 전) 1,511명▶ 3차 조사: 2024. 4.11. ~ 5. 1. (선거일 후) 1,639명'
