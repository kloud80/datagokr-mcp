summary_user: 지방자치단체별로 통합회계(일반회계·기타특별회계·공기업특별회계·기금회계) 기준 세출금액, 일반예비비와 그 비율, 재해·재난목적예비비와 그 비율을 회계연도 단위로 집계한 전국 자료로, 포털 설명상 2024 회계연도부터 제공된다. 지방재정 분석가나 주민이 '우리 지자체는 예산 대비 예비비를 몇 % 편성했고 재난 대비 예비비는 따로 얼마나 잡았나'를 다른 지자체와 비교할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 지자체 코드(laf_cd)나 지자체명으로 같은 지방재정365의 다른 공시 자료와 이름·코드 매핑해 잇는다.
description_portal: 지방자치단체의 예비비는 특정 회계연도에 예상하지 못한 지출에 대비하여 편성된 예산 항목으로 예측할 수 없는 지출이나 예산 초과 지출에 대응하기 위해 편성 됩니다. 지방재정법 43조에 명시되어 있으며 일반회계와 교육비 특별회계의 예비비는 각 예산총액의 1% 이내로 편성 되어야 하며 특별회계도 동일한 규정이 적용됩니다. 재해 및 재난 관련 예비비는 별도로 편성할 수 있습니다. 이 자료는 통합회계(일반회계, 기타특별회계, 공기업특별회계, 기금회계) 기준으로 예비비편성 및 예비비 편성 비율를 분석한 자료입니다.해당자료는 2024년 회계연도부터 제공되며 자치단체별 세출금액, 일반예비비, 일반예비비비율등의 정보가 제공됩니다.
