description_portal: '인천광역시가 제공하는 공공체육시설 현황 공공데이터는 시내 군/구별로 다양한 체육 시설의 종류별 개수를 집계한 통계 자료입니다. 이 데이터는 지역 공공 체육 인프라의 규모 및 분포를 파악하고, 시민들의 체육 활동 접근성 분석, 시설 확충 우선순위 결정, 생활 체육 진흥 정책 수립의 기초 자료로 활용됩니다.<주요 구성 항목>-군구별: 데이터는 강화군, 옹진군, 중구, 동구, 미추홀구, 연수구, 남동구, 부평구, 계양구, 서구 등 군/구별로 분류됩니다.-시설 유형: 축구장, 야구장, 육상경기장, 테니스장, 배구장 등과 간이 체육시설(동네 체육시설), 체육관/구기체육관, 게이트볼장, 수영장 등 다양하게 세분됩니다.'
