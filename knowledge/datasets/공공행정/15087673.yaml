description_portal: 전국사업체조사는 우리나라에 소재하는 모든 사업체를 대상으로 사업체의 기본적인 특성을 파악하는 조사통계입니다. 이 조사결과는 정부의 정책입안은 물론 연구소, 민간기업체의 경영계획수립에 필요한 기초자료로 활용되고 있습니다. 아울러 수집된 사업체에 관한 자료는 각종 사업체단위 통계조사의 모집단명부로도 활용됩니다.1994년에 통계청과 행정안전부(구 내무부)의 공동지원 하에 지방자치단체 주관으로 ｢사업체기초통계조사｣를 최초로 실시하였으며, 2009년에 ｢전국사업체조사｣로 명칭을 변경하고 다양한 연간 경제통계조사(연간조사 8종*)와 통합하여 실시하였습니다.* 도소매업조사, 서비스업조사, 전문․과학․기술서비스업조사, 기업활동조사, 건설업조사, 운수업조사, 광업․제조업동향조사, 서비스업동향조사1980년대부터 우리나라의 산업구조는 정보화시대의 도래로 매년 급격하게 변하고 있었으며, 1995년부터 지방자치제가 본격적으로 실시됨에 따라 지역경제활동에 대한 기본적인 통계자료와 지방자치단체의 정책 수립에 필요한 기초자료가 필요하였습니다. 또한, 사업체 관련 각종 표본조사의 정확한 모집단 틀이 필요하고 GDP 및 산업연관표 등 주요 가공·분석 통계작성의 기초자료가 요구되었습니다. 하지만, 기존 5년 주기로 작성되는 총사업체통계조사*는 급변하는 경제환경 변화를 빠르게 파악하기에는 한계가 있어, 이를 보완하고 시의성 있게 경제활동 변동내역을 파악하기 위해 매년 사업체 부문의 통계조사를 실시할 필요성이 제기되었습니다.* 전국의 모든 사업체를 대상으로 1981년 처음으로 「총사업체통계조사」를 실시한 후 5년 주기로 조사 실시(1981년, 1986년, 1991년)이와 같이 전국사업체조사는 지역통계 활성화, 급변하는 경제구조 파악, 각종 표본 조사의 정확한 모집단 틀을 제공하기 위해 1993년부터 개발되어 1994년 최초로 사업체기초조사라는 명칭으로 실시되었습니다.
