summary_user: 대한민국 명장·기능한국인·기능전수자·산업현장교수 같은 우수숙련기술인의 인력정보(이름·지역·구분·분야·직종)와 이들의 작품·제품 정보를 기술인 한 명 단위로 담은 전국 범위 API이다. 특정 직종이나 지역의 명장·기능한국인이 누구인지, 그 사람의 이력과 작품은 무엇인지 찾는 구직자·교육기관·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기술인 이름·직종·지역명 매핑으로만 이을 수 있고, 기술인 번호(meiNo)는 이 API 안에서 인력 목록과 작품·상세 조회를 잇는 데 쓴다.
limits: 필수 파라미터(queryNo)는 다른 조회 결과에서 먼저 받아 넘겨야 하는 코드라서 목록을 먼저 호출한 뒤 상세를 호출해야 한다. 좌표가 없는 비공간 데이터라 지도 표시나 위치 기반 분석에는 쓰지 못한다. 개발계정은 하루 1,000회로 호출이 제한된다.
