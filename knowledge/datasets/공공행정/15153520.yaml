description_portal: '세종특별자치시시설관리공단은 봉안당·봉안담 등 봉안시설의 구역별 납골함 구성과 공간 배치를 정확하게 관리하기 위해 봉안당(담) 구역 생성 관리 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 봉안시설 내 구역별 납골함의 시작·종료 번호, 위치, 맵 크기 정보 등을 포함하여 봉안시설 운영의 체계성과 시민 안내 서비스 향상에 활용됩니다.■ 데이터 컬럼 구성봉안시설구분 - 봉안시설의 종류 구분    예: 봉안당, 봉안담봉안구역구분 - 봉안시설 내 구역을 식별하기 위한 구분 정보    예: 1층, 2층납골함구역위치 - 해당 구역에서 납골함이 위치하는 영역 또는 좌표 정보구역납골함시작번호 - 구역 내 납골함 번호의 시작 번호구역납골함종료번호 - 구역 내 납골함 번호의 마지막 번호사용여부 - 해당 구역 현재 사용 하는지 표시(Y/N)맵크기 - 전체 배치도(맵) 생성 시 활용되는 구역의 크기 정보(단위: m2)가로맵크기 - 맵에서 구역을 배치할 때 기준이 되는 가로 길이(단위: cm)■ 데이터 제공 목적봉안당(담) 구역 생성 관리 데이터는 다음과 같은 목적을 위해 제공됩니다. - 봉안시설 내 구역별 납골함 구조의 체계적 관리 - 봉안당·봉안담 배치도(맵) 생성의 기본 자료 제공 - 구역별 사용 현황 파악 및 공간 운영 효율성 향상 - 납골함 번호 범위 및 위치 정보를 통한 시민 안내 서비스 강화 - 장사시설 운영의 투명성 및 공정성 확대세종특별자치시시설관리공단은 보다 정확한 봉안시설 안내와 효율적 운영을 위해 구역 생성 관리 데이터를 지속적으로 갱신·제공하겠습니다.'
