summary_user: 구미시 버스정보시스템에 등록된 버스정류장을 한 정류장당 한 행으로 담은 원장 파일로, 정류장 식별자, 한글 명칭, 위도·경도 좌표가 들어 있다. 시민이나 분석가가 "우리 동네에서 가장 가까운 버스정류장은 어디인가", "구미시 안에서 정류장이 드문 지역은 어디인가" 같은 질문에 쓰며, 정류장 위치 지도나 접근성 분석의 기초 자료가 된다. 전역 조인 키가 없어 다른 데이터와는 정류장 명칭 매칭이나 좌표 기반 공간 결합으로 잇고, 구미시 버스노선·도착정보 자료와는 같은 기관의 정류장 식별자(정류장서비스식별자)로 맞춰 볼 수 있다.
description_portal: 이 데이터는 경상북도 구미시의 버스정보시스템(DB) 내에서 버스정류장에 대한 정보를 담고 있는 테이블 형식의 자료입니다. 각 정류장을 식별할 수 있는 정류장식별자(ID)를 비롯하여, 정류장 명칭, 위치 좌표(위도 및 경도) 항목이 포함되어 있어, 구미시 대중교통 인프라의 공간적 분포를 파악할 수 있도록 구성되어 있습니다. 이 데이터는 정류장 위치 기반 서비스, 노선 최적화 분석, 교통약자 편의시설 개선, 스마트 교통 시스템 개발 등에 활용될 수 있으며, 시민들이 효율적으로 대중교통을 이용할 수 있도록 지원하는 데 기초 자료로 쓰입니다. 또한 구미시 내 정류장 밀집도 분석, 지역별 교통 접근성 평가, 정류장 신규 설치 검토 등 교통정책 수립 및 운영에도 유용하게 활용됩니다.
