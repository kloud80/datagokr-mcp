description_portal: '○ 통계개요* 통계명 : 청소년인구* 작성목적 : 청소년인구 및 구성비 추세에 따라 청소년보호 및 지원정책을 위한 예산추계,대체정책 수단 도입 등에 기초자료로 활용* 조사체계 : 자치구 → 서울특별시 스마트도시담당관* 공표주기 : 매년* 공표범위 : 지역 - 서울시 및 자치구내용 - 자치구별 청소년인구 및 학령인구 등○ 용어설명* 청소년인구라 함은 청소년기본법 제3조 제1항에서 규정하고 있는 9세이상 24세 이하를말함* 청소년보호법상의 청소년은 19세 미만으로 0~18세 인구를 구분하였음* 학령인구 : 초등학교에서 대학교까지의 인구로 만 6세~만 21세까지의 인구를 의미함(6∼11세는 초등학교, 12∼17세는 중등학교, 18∼21세는 고등교육인구에 해당)○ 기 타* 외국인 제외○ 자 료 : 서울특별시 스마트도시담당관'
