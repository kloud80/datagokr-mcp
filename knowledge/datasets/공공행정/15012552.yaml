summary_user: 제주특별자치도가 관리하는 공유재산 가운데 대부(일반재산 임대) 계약이 끝난 재산을 한 건씩 담은 파일로, 재산종류·소재지·지목·총면적·대부면적·계약종료일·관리부서를 기록한다. 도내 공유지를 새로 빌리려는 주민이나 사업자가 대부 계약이 끝난 땅이 어디에 얼마나 있는지, 어느 부서에 문의할지 확인하는 데 쓴다. 전역 조인 키는 없어 소재지 주소나 지목 이름으로 토지·지적 자료와 맞춰 보거나, 같은 기관이 낸 공유재산 현황 자료와 관리부서명으로 연결한다.
description_portal: '제주특별자치도에서 지정 및 관리하는 대부 종료 공유 재산과 관련한 데이터를 제공합니다.항목: 재산종류, 재산관리부서, 소재지, 지목, 면적 등*공유재산 대부: 법률의 규정에 의하여 국가 또는 지방자치단체가 국가 이외의 자에 대하여 사법상의 계약을 체결하여 사용·수익하게 하는 것. 민법상의 임대차와 유사한 것이며 일반재산의 임대를 말함. (행정재산 임대는 사용· 수익허가라고 함)자세한 사항은 제주도청 분야별 예산/재정/세정 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/finance/wealth/data.htm'
