summary_user: 경기도 시군구별 유동인구를 기준년월·요일(월~일, 7일 평균 'TOT' 포함) 단위로 집계한 통계로, 유동인구수와 비율, 전월·전년동월 대비 증감값과 증감비율을 담는다. 상권 분석가나 자영업자가 '우리 시의 주말 유동인구가 주중보다 얼마나 많고, 작년 같은 달보다 늘었나'를 확인해 영업시간이나 인력 배치를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구코드(signgu_cd)를 이름·코드 매핑하거나 같은 경기도 데이터의 코드로 맞춰 상권·인허가 자료와 기준년월 단위로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군구의 요일별 유동인구 현황을 기준년월을 기준으로 집계한 통계자료입니다. ‘요일코드’는 월요일부터 일요일까지의 요일을 영어 약어(MON, TUE 등)로 나타내며, ‘TOT’는 기준년월별 시군구코드별 요일(7일) 평균치를 의미합니다. 항목으로는 ‘기준년월’, ‘시군구코드’, ‘요일코드’, ‘유동인구수’, ‘유동인구수비율’, ‘전월대비증감값’, ‘전월대비증감비율’, ‘전년동월대비증감값’, ‘전년동월대비증감비율’이 있으며, 이를 통해 주중·주말 유동인구 차이, 요일별 인구 흐름 변화 등을 분석할 수 있습니다. 이 데이터는 상권 운영 시간 최적화, 교통 수요 예측, 공공서비스 제공 계획 수립 등에 활용될 수 있습니다.
