summary_user: 가맹사업자가 부담하는 가입비·교육비·보증금·기타 비용과 그 합계(창업비용지수), 평균 매출액, 매출액 대비 부담률을 연도·업종 대분류별로 묶은 전국 단위 집계 데이터이다. 창업 예정자나 분석가가 '외식·서비스·도소매 중 어느 업종이 매출에 비해 초기 부담금이 큰가'를 연도별로 비교하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 가맹정보 데이터와는 연도와 업종 대분류명을 맞춰 연결해야 한다.
description_portal: 이 API 는 공정거래위원회에서 제공하는 가맹정보_가맹사업자 부담금 대비 매출액 현황 제공 서비스 입니다. 년도, 업종대분류코드를 이용하여 가맹사업자 부담금 대비 매출액 현황에 대한 합계(창업비용지수), 매출액, 매출액 대비 부담률 등의 정보를 조회할 수 있습니다.
