summary_user: 한국동서발전이 보유한 풍향 계측기의 설치 현황을 계측기 단위 목록으로 담은 파일이며, 구분·준공일자·발전원·설비용량(MW)·위치·추진현황 항목으로 구성된 345바이트 규모의 소량 CSV입니다. 풍력 사업을 검토하는 분석가나 연구자가 '동서발전이 어느 지역에 언제 계측기를 세웠고 해당 풍력 사업이 어느 단계까지 진행됐나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 위치(지역명)나 발전원 이름을 직접 맞춰야만 연결된다.
description_portal: 한국동서발전에서 보유하고 있는 풍향 계측기 설치현황 정보 데이터입니다. 본 데이터는 풍력 자원 개발 및 평가를 위한 기초자료로서, 항목에는 구분, 준공일자, 발전원, 설비용량(MW), 위치, 추진현황 등이 포함되어 있습니다. 이를 통해 각 계측기의 설치 시점, 설치 지역, 계측 목적 및 현재 개발 단계 등을 파악할 수 있습니다.풍향 계측기 설치 정보는 풍력발전 가능 지역 발굴, 입지 평가, 계측기 운영 효율성 분석, 풍황 자원 모델링 및 예측 정확도 검증 등의 연구에 활용될 수 있습니다. 또한 풍력발전 설비 개발 전 사전 타당성 조사, 계측자료 기반의 풍력 출력 시뮬레이션 연구, 국내 풍황자원 지도의 정밀도 향상 등에도 기여할 수 있는 유의미한 공공데이터입니다.
