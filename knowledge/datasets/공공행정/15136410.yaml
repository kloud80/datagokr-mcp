summary_user: 경기공유서비스(공유누리)에서 대관하는 공공시설별로 허용되는 대여목적(회의·교육·강의·행사 등)을 기관·시설 단위로 정리한 코드성 목록이며, 목적별 코드와 명칭, 등록일을 담는다. 경기도 공공시설을 빌리려는 주민이나 단체가 "이 시설을 교육·행사 용도로 대관할 수 있는가"를 확인하거나, 분석가가 시설별 대관 용도 구성을 비교하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 같은 경기공유서비스 시설대관 데이터와 기관코드(inst_cd)·시설코드(faclt_cd)를 맞추는 식으로만 이어 쓴다.
description_portal: 이 데이터는 공공시설 대관 시 사용 목적을 분류한 정보로, 각 기관과 시설코드에 따라 해당 시설의 대여목적을 명시하고 있습니다. 주요 항목에는 시설을 구분하는 ‘기관코드’ 및 ‘시설코드’, 목적 유형을 숫자로 분류한 ‘대여목적코드’, 그리고 그에 상응하는 구체적인 ‘대여목적명’이 포함됩니다. 대여목적명은 회의, 교육, 강의, 행사 등 다양한 사용 목적을 나타내며, 시설의 사용 유형을 체계적으로 분류하고 사용자에게 적합한 시설을 안내하는 데 활용됩니다. 등록일 항목은 목적 정보가 시스템에 등록된 날짜를 표시합니다.
