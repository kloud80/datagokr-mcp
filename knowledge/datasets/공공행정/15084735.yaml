summary_user: 경상남도 양산시의 읍면동별 유동인구를 연·월 단위로 집계한 자료로, 지역마다 직장인구·주거인구·방문인구 규모를 담는다. 상권 분석가나 창업 준비자가 '양산시에서 방문인구가 많은 동은 어디이고 월별로 어떻게 변하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 지역 코드(cl_han_code)·지역명으로 행정동 코드나 같은 기관 자료와 이름·코드 매핑해 잇고, 상권 분석에서는 LOCALDATA 인허가 등 점포 자료와 행정동×월 격자로 맞춰 쓴다.
description_portal: '“양산시 읍면동별 유동인구 정보 조회” 기능은 사용자가 지정한 조회 기간을 기반으로, 양산시 전 지역(읍·면·동)의 유동인구 현황을 체계적으로 조회할 수 있도록 제공되는 공공데이터 OpenAPI 서비스입니다.이 API는 양산시가 주기적으로 수집·분석하는 월별 유동인구 통계자료를 활용하여, 특정 시점의 인구 이동 특성을 다차원적으로 파악할 수 있도록 구성되어 있습니다.본 API는 단순한 거주 인구 자료가 아니라, 지역 내 인구의 생활·근무·방문 패턴을 반영한 실제 유동 규모를 제공함으로써, 도시계획, 상권 분석, 인구 흐름 대응 정책, 기반시설 수요 예측 등에 활용할 수 있는 고도화된 기초 데이터를 제공합니다.API 호출 결과에는 다음과 같은 주요 항목이 포함됩니다.연도(Year): 해당 유동인구 통계가 산출된 기준 연도월(Month): 월 단위로 집계된 유동인구 데이터지역명(Administrative Area Name): 읍·면·동 단위의 행정구역명지역코드(Administrative Area Code): 해당 지역을 고유하게 식별하기 위한 코드직장인구(Workplace Population): 해당 지역에서 근무하는 인구 규모주거인구(Residential Population): 해당 지역을 거주지로 둔 인구 규모방문인구(Visitor Population): 구매·이용·이동 등 특정 활동을 위해 해당 지역을 방문한 인구 규모이러한 지표들은 단순 인구 규모를 넘어, 지역별로 유입·유출·체류 패턴을 종합적으로 설명하는 핵심 지표로 활용됩니다. 예를 들어 특정 지역의 상권 활성화 정도 파악, 통근·통학 인구 분석, 주거·상업지구별 시간대별 인구 집중도 분석 등 다양한 정책·연구·민간 서비스에서 활용할 수 있습니다.'
