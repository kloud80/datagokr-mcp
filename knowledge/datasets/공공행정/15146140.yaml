description_portal: 이 데이터는 서울시 가로등의 일별 점·소등 현황을 기록한 자료입니다. 각 항목에는 가로등 일련번호, 점·소등 날짜, 해당 날짜의 서울시 일출·일몰 시각, 실제 소등 시각과 점등 시각, 그리고 예정 시각 대비 차이를 나타내는 소등 편차와 점등 편차가 포함됩니다. 일출·일몰 시각은 기상 자료를 기반으로 제공되며, 실제 점·소등 시각은 현장에서 수집된 값입니다. 편차 값은 가로등 운영 효율성과 제어 시스템의 정확성을 분석하는 지표로 활용됩니다. 이를 통해 계절별·기상조건별 가로등 운영 특성을 파악하고, 에너지 절감 및 안전 확보를 위한 조정 근거로 삼을 수 있습니다.
