summary_user: 지방재정365에 공시되는 국고보조금 자료로, 회계연도(fyr)와 자치단체(laf_cd·자치단체명)별 금액 두 가지와 그 비율을 전국 범위의 비공간 집계 형태로 담는다. 행정안전부가 공표하는 국고보조사업 교부·집행 실적을 바탕으로, 분석가나 주민이 "우리 시·도나 구가 받은 국고보조금 가운데 얼마를 집행했나"를 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 자치단체 코드(laf_cd)나 자치단체명으로 같은 기관(지방재정365)의 다른 공시 자료와 맞춰 잇는다.
description_portal: 지방재정법 제27조의4 국고보조금의관리 규정에 따라 중앙관서의 장은 지방자치단체에 지원한 국고보조금의 교부실적과 해당 지방자치단체의 보조금 집행실적을 익년도 5월31일까지 행정안전부장관에게 통보하여야 하고, 행정안전부장관은 통보된 교부실적과 집행실적을 종합적으로 분석하여 인터넷 홈페이지 등을 통해 공표하여야 합니다. ※ (공표내용)연도별 국고보조사업 교부 및 집행 현황, 사업비 규모별 국보보조사업현황, 분야별 국고보조사업 현황, 시·도별 국고보조사업 현황, 국고보조사업 수행상황 점검 결과 등보조금은 국고보조금 교부 및 집행실적 등 현황과 분석결과 및 자치단체 국고보조금 수행상황 점검결과 등을 게시하고 있습니다.
