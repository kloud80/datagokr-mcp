description_portal: 본 데이터는 공공사업 추진 과정에서 수용재결 절차를 통해 취득한 공공용지 현황을 사업정보 형태로 제공한다. 수용재결은 사업에 필요한 토지의 소유자가 보상금에 동의하지 않는 경우, 법적 절차를 거쳐 보상금액과 면적을 확정하는 과정이다.본 데이터에는 사업종류, 사업명, 사업시행자, 토지 면적(㎡), 토지 보상금액(원) 등이 포함되며, 사업별로 취득된 공공용지의 규모와 금액을 체계적으로 확인할 수 있다. 이를 통해 보상 절차 진행 현황과 재정 집행 규모를 한눈에 파악할 수 있다.이 데이터는 공공용지 확보 과정의 투명성을 높이고 보상 정책 검토, 재정 계획 수립, 사업 평가 등 행정 및 정책 업무에 활용 가능하다.
