description_portal: 한국교통안전공단 통합홈페이지시스템에서 관리하고 있는 안전지원지식 관련 정보입니다. 한국교통안전공단에서 보유하고 있는 교통안전매뉴얼과 교통안전사업 소개서, 항공안전 관련 소식지 등의 정보를 포함하고 있습니다. 해당자료는 교통,항공 부분에 대한 지식, 교통안전사업에 대한 기타정보 (피해자족지원사업 관련 정보) 등에 대한 PDF 및 한글 자료등을 포함하고 있습니다. 교통안전 분야의 경우 교통안전담당자 매뉴얼, 운수교통안전진단결과분석보고서와 같은 운수회사 관리를 위한 정보를 포함하고 있습니다. 항공정보로는 GYRO 매거진 정보를 포함하고 있습니다.
