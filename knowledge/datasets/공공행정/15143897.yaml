description_portal: '[SGIS 오픈 플랫폼] "지역변화분석지도" 서비스의 e지방지표 지표별 년도 데이터입니다.각 지표별로 지역 범위를 구분하고,행정동명과 기준년도를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 지역변화분석지도  이용자가 거주하는 시군구 등의 지역을 중심으로 다양한 통계정보를 한눈에 살펴볼 수 있는 서비스입니다.  KOSIS 및 SGIS의 각종 콘텐츠에서 제공 중인 다양한 통계정보를 사용자가 선택한 시군구 단위로 한눈에 살펴볼 수 있도록 상황판 형태로 제공합니다.'
