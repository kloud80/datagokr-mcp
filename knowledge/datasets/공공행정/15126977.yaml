description_portal: 부산광역시 영도구 주요 관광에 설치된 공공와이파이를 통해 수집한 유동인구 데이터로 일자별로 각 관광지에 방문한 인구 수를 측정하여 데이터로 제공합니다.주요 관광지로는 흰여울문화마을, 봉래물양장, 감지해변이 있습니다.본 데이터 수집은 공공와이파이에 접근한 개별 기기의 MAC 주소를 집계하는 방식으로 이루어졌으며, 이를 통해 각 관광지별로 매일 몇 명의 관광객이 방문했는지를 세밀하게 파악할 수 있습니다.이렇게 축적된 방문자 수 정보는 단순히 인원 집계에 그치지 않고, 관광객의 방문 패턴을 분석하는 데에도 활용될 수 있습니다.또한, 해당 데이터는 관광지 주변 상권의 활성화 정도를 평가하거나 특정 기간 동안의 관광객 변화 추이를 분석하는데에도 활용 가능합니다.
