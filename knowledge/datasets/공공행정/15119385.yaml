description_portal: '한국수력원자력이 제공하는 중기경영목표에 대한 공개 데이터입니다. 한국수력원자력㈜은 친환경 에너지로 삶을 풍요롭게라는 미션과 탄소중립 청정에너지 리더라는 비전을 실현하기 위하여 중기경영목표를 설정하고 이를 달성하기 위해 노력하고 있습니다. 해당 데이터는 한국수력원자력(주)의 최근 5년 간 중기경영목표 지표수, 수립시기, 해당기간, 개정주기, 주관부서에 관한 정보를 포함하고 있습니다. 데이터는 1년을 기준으로 갱신합니다. 제공항목의 기준연도는 대상연도이며, 수립연도는 대상기준을 수립한 연도입니다. 개정주기의 단위는 연 단위입니다.(예시 : 1 -> 1년)'
