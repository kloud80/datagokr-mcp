summary_user: KOSIS에 통합된 국가통계표를 통계표(TBL_ID)·항목·분류값·수록시점별 수치로 돌려주는 집계 통계 조회 API로, 범위는 전국이며 공간 좌표 없이 행정 분류로만 구분한다. 분석가가 특정 통계표의 시점별 수치를 받아 "전국 또는 지역별 지표가 연도마다 어떻게 변했는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 분류값명(지역명 등) 매핑이나 같은 기관코드(ORG_ID)·통계표ID로만 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 행정구역코드 기반 결합이 불가하고 이름·코드 매핑을 직접 해야 한다. 개발계정은 하루 1,000회로 호출이 제한되며, 이 카탈로그에서는 읍면동 유동인구·체류 외국인·시장 물가 용도로 분류해 두었고 주택 거래·주민등록 인구는 다른 부문 데이터를 쓴다.
