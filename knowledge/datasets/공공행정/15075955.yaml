description_portal: 서초구 홈페이지 내 강좌안내 게시판 정보입니다.글제목,링크, 등록일 ,글고유코드, 작성부서,내용 정보를 제공합니다.우리구 내에서 진행이 되는 생활에 바로 도움이 되는 강좌와 우리 개개인의 성장을 돕는 지식및 문화 플랫폼이 모여 있는곳입니다.주민 여러분의 평생학습을 위해 다양한 강좌를 운영하고 있고, 누구나 쉽게, 필요한 강좌를 바로 찾아보실수 있습니다.강좌안내 페이지는 현재 수강 가능한 프로그램부터 향후 걔설 예정 강좌까지 한눈에 확인하실수 있습니다.관심 있는 강좌를 찾아서 새로움 배움과 즐거움을 시작해 보세요.
