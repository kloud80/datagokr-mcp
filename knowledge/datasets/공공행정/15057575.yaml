summary_user: 전국 지방자치단체가 제정·개정·공포한 자치법규의 목록을 법규 단위로 담는 외부 API 데이터로, 명칭·종류·분야·공포일자·시행일자·제개정 구분·지자체명 등을 제공한다. 사업자나 분석가가 "우리 지자체에 이 분야 조례가 언제 공포·시행됐는가" 같은 질문을 확인할 때 쓴다. 전역 조인 키는 확인되지 않아, 자치법규ID·일련번호로 상세 링크를 따라가거나 지자체기관명 같은 이름·기관 코드 매핑으로만 다른 데이터와 잇는다.
description_portal: 법제처_자치법규 목록 조회 데이터는 전국 지방자치단체에서 제정·개정·공포한 자치법규의 체계적 목록 정보를 제공합니다. 본 데이터는 각 자치법규의 명칭, 고시번호, 제정 및 개정 일자, 시행 시작일, 소관 부서, 법령상의 근거 조항, 분류 체계 및 해당 법규의 현재 시행 상태 등을 포함합니다. 이를 통해 행정기관은 자치법규의 전수 현황을 점검하고, 법령에 따른 부속 문서 및 법적 근거를 일괄 확인할 수 있습니다. 또한 기존 자치법규의 중복 여부, 폐지 여부 및 신설 규칙의 체계적 관리 업무에 활용할 수 있습니다. 지방자치법 및 하위 법령과의 연계성을 파악하여 법제 정비 및 자치법규 관리 체계를 강화하는 데 효율적인 지원 자료로 사용됩니다.
