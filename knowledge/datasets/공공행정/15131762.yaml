description_portal: 이 데이터는 경남개발공사 임직원이 취득한 자격 및 면허증의 등록 이력을 수록한 자료로, 자격·면허의 종류, 취득 연도, 발행기관, 등록일자, 인사담당자 확인여부 등의 정보를 포함하고 있습니다.해당 데이터는 임직원들이 보유한 운전면허증(1종·2종 보통, 대형) 및 건축·토목·전기·정보처리·회계 등 국가기술자격증, 그리고 기술사·기능사·기사·산업기사·기능장 등의 직무 관련 전문 자격 현황을 체계적으로 관리하기 위한 목적으로 구축되었습니다.활용 목적으로는:자격자 현황 분석전문 인력 구성 파악교육 및 인력 배치 계획 수립특정 자격증 보유자 통계 제공등에 유용하게 사용될 수 있습니다.개인 식별 정보는 포함되지 않으며, 자격별 보유자 수나 자격 분포 현황 등의 분석 기반 데이터로도 활용이 가능합니다.
