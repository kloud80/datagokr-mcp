description_portal: 해양수산연수원이 운영 중인 임신기 및 육아기 단축 근무제의 연도별 사용 현황을 정리한 공공데이터입니다. 2019년부터 2023년까지의  임신기 단축 근무제와 육아기 단축 근무제 사용자 수가 기재되어 있습니다.CSV 형식으로 제공되는 이 자료는 공공기관의 가족친화적 근로제도 실태 파악, 근로자 복지정책 활용도 분석, 여성 근로자의 일·가정 양립 정책 평가 등에 활용할 수 있습니다. 특히 육아휴직과는 달리 단축 근무제 운영 실적에 초점을 맞추고 있어 실질적인 근무 유연성 확보 수준을 파악할 수 있는 지표로서 유의미합니다.
