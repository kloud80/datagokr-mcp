summary_user: 지방자치단체별로 일반회계·공기업특별회계·기타특별회계·기금에서 발행된 지방채 잔액을 회계별로 나눠 담은 집계 데이터로, 범위는 전국 자치단체다. 지역 재정 분석가나 주민이 '우리 시·군·구의 지방채 잔액은 회계별로 얼마이고 해마다 어떻게 변했나'를 확인하는 데 쓴다. 회계연도(fyr)와 자치단체 코드·이름(laf_cd)이 있지만 전역 조인 키는 실측에서 찾지 못했으므로, 다른 지방재정365 데이터와는 자치단체 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 지방채는 지방자치단체가 자금을 조달하기 위해 발행하는 공공부문의 채권입니다. 주된 발행목적은 사회기반시설에 대한 투자, 재해복구나 긴급자금수요 대응, 재정운영의 균형확보, 지역경제 활성화를 위한 정책재원의 확보 등을 목적으로지방재정법 제11조(지방채의발행), 제12조(지방채 발행의 제한), 제13조(지방채 발행의 절차 및 관리 조항에 따라 관리되고 있습니다.회계별 지방채 잔액 정보는 지방자치단체의 일반회계, 공기업특별회계, 기타특별회계, 기금에서 발행된 지방채잔액 정보를 자치단체별로 제공합니다.
