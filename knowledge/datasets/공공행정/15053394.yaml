description_portal: 본 데이터는 2013년 기준 경기도 용인시 산업 중분류별 대표자의 성별과 읍·면·동별 사업체 수를 집계한 현황을 제공한다. 주요 항목은 산업중분류, 대표자 성별, 읍·면·동, 사업체 수로 구성되어 있으며, 산업별 여성 대표자와 남성 대표자의 분포를 구체적으로 확인할 수 있다. 이를 통해 지역별 성별 창업 경향, 산업별 성별 대표자 비율, 성별에 따른 사업체 운영 현황 등을 종합적으로 파악할 수 있다. 자료는 성평등 정책 수립, 여성 창업 지원, 고용 다양성 확보, 지역별 산업 특성 연구, 창업 트렌드 분석 등 다양한 목적으로 활용 가능하다. 본 데이터는 단일 연도(2013년) 기준으로 제공되며, 주기적으로 갱신되지는 않지만 당시의 지역 산업 구조와 성별 대표자 특성을 이해하는 데 중요한 기초 자료로 쓰일 수 있다. 공공데이터 개방을 통해 성별 기반 산업 구조 분석의 투명성을 높이고, 지역 경제 정책과 창업 지원 전략 수립에 기여하는 것을 목표로 한다.
