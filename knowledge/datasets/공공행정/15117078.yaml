description_portal: 한전KPS의 현재 업무용차량 보유현황이며, 타입 부분을 통해 친환경차 및 내연기관차량으로 구분되어 있습니다. 한전KPS는 저공해자동차 의무구매 임차 대상기관으로서 매년 친환경차 및 저공해차로의 지속적인 전환을 노력하고 있으며, 현재 내연기관차량의 경우에도 차량 추가구매 및 교체사유 발생 시 사업소 업무환경에 적합한 전기차량 모델 출시 모니터링을 통해 적극적인 전기차 전환에 힘쓰고 있습니다. 향후 PV3·PV5 등 전기트럭 및 승합형 모델 출시 가속화에 따른 추가적인 친환경자동차 전환을 기대하고 있습니다.
