summary_user: 관보에 게재된 공직자 등의 병역사항 공개 고시를 게재 건별로 담으며, 각 건에 제목, 발행일자, 편집구분, 테마구분, 발행기관, 근거법령, 정정 여부 등이 붙는다. 특정 기관이 언제 어떤 근거법령으로 소속 공직자의 병역사항을 관보에 공개했는지 확인하려는 기자·분석가·국민이 쓴다. 실측 컬럼에 전역 조인 키가 없어 발행기관명(pblcnInstNm)이나 근거법령명 같은 이름으로만 다른 관보·인사 데이터와 맞춰 쓴다.
description_portal: 관보는 국가가 국민에게 널리 알릴 사항을 수록하여 발행하는 국가의 공식 기관지로 '관보'라는 제호로 발간되는 정기간행물입니다. 관보는 헌법개정, 법률, 조약, 대통령령, 총리령 및 부령의 공포와 헌법개정안, 예산 및 예산 외 국고부담계약의 공고 수단입니다. 또한, 법령 공포, 대통령·국무총리훈령 및 대통령·국무총리 지시사항, 각급 기관의 인사발령 통지 등 정부 기관간의 공문 시행을 대체하는 역할을 합니다.이 데이터는 관보에 게재된 공직자 등의 병역사항 목록, 상세정보(제목, 구분, 발행일자, 편집구분, 테마구분, 발행기관, 근거법령 등)에 대한 정보를 제공합니다.
