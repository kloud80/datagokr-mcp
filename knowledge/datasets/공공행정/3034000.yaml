summary_user: 행정규칙(훈령·예규·고시 등)에 붙은 별표와 서식을 건별로 담으며, 별표명·별표종류·번호와 관련 행정규칙명·소관부처·발령일자, 파일 링크를 함께 제공하고 범위는 전국이다. 행정 실무자나 사업자가 '이 고시에 딸린 신청서 양식이나 기준표 파일을 어디서 받나'를 찾을 때 쓴다. 전역 조인 키는 없어 관련행정규칙명·관련행정규칙일련번호나 소관부처명 같은 이름·코드 매핑으로 법제처 행정규칙 본문 정보와 이어 쓴다.
description_portal: 법제처, 별표,서식(행정규칙)정보, 행정규칙에 포함된 별표 및 서식 정보를 제공하는 공공데이터입니다. 이 데이터는 행정규칙의 부속 문서로서, 규정의 세부 사항을 명확히 하고 행정 절차의 일관성을 확보하는 데 활용됩니다. 별표는 표 형식으로 정리된 목록이나 지침을 포함하며, 서식은 신청서, 보고서 등 행정 업무에 필요한 양식을 제공합니다. 이러한 정보는 행정기관의 업무 수행과 관련된 법령의 해석과 적용에 있어 중요한 참고자료로 활용됩니다. 따라서, 법령의 세부 내용을 이해하고 정확한 행정 절차를 따르는 데 필수적인 자료로 기능합니다. 행정규칙에 포함된 별표 및 서식 정보는 법령의 실질적인 적용을 지원하며, 행정의 투명성과 효율성을 높이는 데 기여합니다.
