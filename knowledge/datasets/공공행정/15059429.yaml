summary_user: 대한민국 법령을 영문으로 번역해 둔 목록을 법령 한 건 단위로 담으며, 한글·영문 법령명, 법령 구분, 소관부처, 공포일자·공포번호, 시행일자, 제·개정 구분, 상세 링크를 함께 제공한다. 외국인 투자자나 번역·국제법무 담당자가 "이 법령의 공식 영문 명칭과 영문 원문은 어디서 보나, 최신 개정 시행일은 언제인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 법제처의 국문 법령 데이터와는 법령ID·법령일련번호나 법령명한글을 맞춰 이어 쓴다.
description_portal: 본 데이터는 대한민국의 법령을 영문으로 목록화하여 제공하는 데이터입니다. 각 법령에 대한 고유번호와 한글·영문 명칭, 법령 유형코드, 공포 및 시행일자를 포함합니다. 또한 최근 개정정보와 원문 접근을 위한 URL, 주요 내용 간략 요약 항목이 포함되어 있습니다. 해당 데이터는 API 또는 파일 형식으로 제공되며, 사용자는 영문 제목과 한글 제목을 동시에 참고하여 법령을 식별할 수 있습니다. 법령의 공포 및 시행 시점과 개정 이력을 확인할 수 있어, 법무·국제법·다국어 법령 번역 등 다양한 분야에서 활용됩니다. 아울러 원문URL을 통해 법제처 웹사이트에 등록된 공식 영문법령 원문으로 직접 연계 조회가 가능합니다. 이 데이터는 법령의 영문화 현황을 통합적으로 파악하고 비교·분석하는 데 유용합니다.
