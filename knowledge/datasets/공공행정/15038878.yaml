summary_user: 법제처가 제공하는 학칙과 공단 규정의 목록을 규정 한 건 단위로 담으며, 규정명·소관 기관·발령일자·시행일자·제개정 구분·현행/연혁 구분과 상세 링크가 들어 있다. 연구자나 기관 담당자가 특정 공단·학교의 내부 규정이 언제 제정·개정되어 언제부터 시행되는지, 현행 규정인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 소관 기관명이나 규정명으로 맞추거나, 규정 고유번호(행정규칙ID·일련번호)와 상세 링크로 법제처 본문 조회에 이어 쓴다.
description_portal: 본 데이터는 각 교육기관 및 공공기관에서 제정한 학칙과 공단 관련 규정의 목록 정보를 제공합니다. 규정명, 소관 기관, 공포일자, 시행일자 등 주요 항목을 포함하며, 기관별 제정 현황과 관련 문서의 체계적인 관리에 활용됩니다. 이를 통해 기관의 규정 현황을 쉽게 파악할 수 있으며, 법적 근거와 제도적 기반을 확인할 수 있습니다. 목록 정보는 내부 규정의 집합체로서 기관 운영과 행정 관리에 중요한 기초 자료 역할을 수행합니다. 본 자료는 자치규칙의 관리 및 비교 분석에 필요한 기초 데이터로 활용되며, 행정의 투명성과 신뢰성 확보에 기여합니다.
