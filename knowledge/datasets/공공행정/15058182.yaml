summary_user: 지방자치단체별로 세입·세출 현황을 공개하는 자치단체 홈페이지 페이지의 링크 정보를 회계연도·자치단체 단위로 담으며, 범위는 전국입니다. 주민이나 분석가가 "우리 구의 세입·세출 현황은 어디서 확인하나"를 찾아 해당 자치단체 공개 페이지로 바로 이동할 때 쓴다. 전역 조인 키는 없어 자치단체명이나 자치단체코드(laf_cd)를 이용한 이름·코드 매핑으로만 다른 지방재정365 데이터와 연결한다.
description_portal: 지방자치단체의 세입·세출 현황 정보공개는 지방재정의 투명성, 책임성, 그리고 주민 참여를 높이기 위한 제도로, 관련 법적 근거에 따라 정기적으로 이루어지고 있습니다. 이 정보는 『지방재정법』 제60조(재정정보의 공개) 및 『지방재정법 시행령』 제68조에 따라 공개되며, 각 지방자치단체의 홈페이지를 통해 주민에게 제공되고 있습니다.우리 지자체의 세입·세출 현황 정보 또한 자치단체 홈페이지 내 관련 페이지를 통해 공개되고 있으며, 주민들은 세입·세출 현황 공개 페이지의 링크 정보를 통해 해당 내용을 쉽게 확인할 수 있습니다. 이러한 정보공개는 주민의 알 권리를 보장함은 물론, 지방재정 운영의 신뢰도를 높이고, 건전한 재정 운용을 유도하는 중요한 수단이 됩니다.
