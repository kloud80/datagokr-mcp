summary_user: 경기도 내 읍·면·동 단위의 행정동 코드와 법정동 코드를 시도명·시군구명·읍면동명·동리명·생성일자와 함께 한 행씩 담은 코드표다. 분석가나 행정 담당자가 행정동 기준으로 집계된 통계와 법정동 기준 주소 데이터를 한 지역 단위로 맞춰 보려 할 때, 어떤 법정동이 어느 행정동에 속하는지 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동코드(admdong_cd)·법정동코드(legaldong_cd)나 시군구·읍면동 이름을 맞춰 매핑하는 방식으로 잇는다.
description_portal: 경기도 행정기관 코드 데이터는 도내 읍·면·동 단위의 행정동 및 법정동 코드표를 제공하는 자료입니다. 주요 항목은 행정동코드, 시도명, 시군구명, 읍면동명, 법정동코드, 동리명, 생성일자로 구성되어 있으며, 각 행정기관 및 법정구역을 식별할 수 있도록 체계화된 코드 정보를 담고 있습니다. 이를 통해 행정구역 단위의 일관된 데이터 관리와 분석이 가능하며, 주민등록·인감 등 행정업무, 지역별 통계 집계, 정책 데이터 매칭, GIS 기반 공간분석 등에 활용할 수 있습니다. 특히 법정동과 행정동 간 코드 매핑은 행정데이터 통합 관리와 기관 간 자료 연계에 필수적인 기능을 수행합니다.
