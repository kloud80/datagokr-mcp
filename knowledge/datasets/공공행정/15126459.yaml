summary_user: 경기도 행정동(읍면동)별로 총세대수와 1인·2인·3인·4인 이상 세대수, 그리고 각 세대 유형의 구성비율을 기준연월 단위로 집계한 주민등록 인구통계이며, 포털 설명상 2017년 기준 자료다. 지자체 정책 담당자나 분석가가 '경기도에서 1인 가구 비율이 높은 동네는 어디인가'처럼 동 단위 세대 구성 특성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 행정동코드(admdong_cd)나 행정동명을 같은 기관 자료나 별도 코드 매핑과 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 행정동을 단위로 세대의 구성 인원수별 세대수를 집계한 주민등록 인구통계 자료입니다. 각 행정동별로 1인세대부터 4인 이상 세대까지의 세대수가 제공되며, 전체 세대수와 함께 세대 구성비율 항목도 포함되어 있어, 지역별 세대구성 특성을 분석할 수 있는 자료입니다. 데이터는 2017년 기준이며, '기준연월', '행정동코드', '행정동명', '총세대수', '1인세대수', '2인세대수', '3인세대수', '4인이상세대수', '1인세대비율', '2인세대비율', '3인세대비율', '4인이상세대비율' 등의 항목으로 구성되어 있습니다.
