summary_user: 지방공기업별·연도별로 자산·부채·자본의 세부 항목(유동·비유동 부채, 자본금·잉여금 등)과 부채비율, 전년 대비 부채 증감액·증감률을 담은 전국 단위 경영공시 집계 데이터다. 분석가나 지방의회·주민이 '우리 지역 도시공사의 부채비율이 전년보다 얼마나 늘었나'처럼 지방공기업의 재무건전성을 비교·점검할 때 쓴다. 전역 조인 키가 없어 다른 경영공시 데이터와는 연도와 기관명(ENT_NAME) 이름 매칭으로만 이어 쓴다.
description_portal: 이 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 통합경영공시를 통해 수집·관리하는 경영정보 중 하나로, 지방공기업의 부채 현황을 집계한 정보입니다. 부채규모 항목은 자산, 부채, 자본의 세부 항목을 포함하여 유동·비유동 부채, 자본금 및 잉여금, 부채비율 등을 산출하며, 전년 대비 증감액 및 증감률도 함께 제공됩니다. 이러한 데이터는 지방공기업의 재무건전성, 재정운영 효율성 평가를 위한 지표로 활용되며, 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 매년 정기적으로 공개되고 있습니다.
