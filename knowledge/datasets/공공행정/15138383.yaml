description_portal: 경상북도개발공사에서 직원복지를 위해 운영 중인 복지동에서 일부 호실을 비상근무자를 위한 임시숙소로 지정하고 사용한 내역 정보(현재 임시숙소 사용 중지, 사유:호실부족). 장거리 출퇴근자 및 신규직원, 야근근무를 위하여 임시숙소 사용신청을 관리하는 정보를 공개합니다. 현재는 공사의 환경으로 운영을 중지 했으나, 조만간 임시숙소를 재도입할 경우 이 데이터를 분석하여 임시숙소 규모 등을 정하는대 활용할 계획입니다. 유사한 환경에 있는 분들을 위해 데이터를 계속 공개하고 있습니다.
