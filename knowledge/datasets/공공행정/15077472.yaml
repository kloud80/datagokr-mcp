description_portal: 국토안전관리원에서 제공하는 건축물시설물시도별종별통계현황 데이터 입니다.시설물안전법에 의거하여 국토안전관리원에서 관리하는 시설물 1종, 2종, 3종별로 전국에 소재된 통계현황 자료입니다.해당 데이터는 매년 현행화를 진행중이며 국가데이터처(통계청)로부터 승인받은 국가승인통계 목록에 해당되는 자료임을 알려드립니다.제1종 시설물은 규모가 가장 크고 구조적 위험성이 높아 가장 엄격한 관리를 받으며, 정밀안전진단이 의무화되어 있습니다.제2종 시설물은 제1종보다는 작지만 재난 발생 위험이 있어 지속적인 안전관리가 필요한 시설물입니다.제3종 시설물은 1, 2종에 해당하지 않는 소규모 시설물 중에서도 안전 관리가 필요하다고 지정된 시설물입니다.전국 1종부터 3종까지 시설물 현황을 파악하여 점검, 진단, 예산 등 점검진단 인력 배분 중점 시도 파악 등 정책자료에 활용을 하고자 합니다.
