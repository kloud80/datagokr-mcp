description_portal: '자치구의 생산활동 수준, 산업구조 등 지역내 경제실태를 파악하여 각종 지역단위 개발계획 수립에 필요한 기초자료 제공법적근거 : 통계법 제18조 일반통계(205008호)일정 기간 동안 한 지역 내에서 생산된 재화와 서비스의 부가가치를 합산한 지표로, 지역 경제의 규모와 성장 수준을 나타냅니다. 국가 전체의 GDP와 달리 지역 단위의 경제활동을 측정하며, 산업 구조 분석과 정책 수립 등에 활용됩니다.추계기준 : 매년(매2년전 기준), 5개 자치구 단위 ※ 2022년도 GRDP는 "25년 상반기 공표 예정'
