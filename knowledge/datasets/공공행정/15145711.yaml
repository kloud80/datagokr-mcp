description_portal: '○ 통계개요* 통계명 : 외국인주민 현황(국적별)* 근거법령 : 통계법 제17조(승인번호 : 제 11025호)* 작성목적 : 국내 거주 외국인주민에 관한 기본정책 수립, 운영 및 제도개선을 위한 기초자료 활용* 조사체계 : 등록외국인 현황 자료(법무부 제공)를 기초로 주민가족관계등록시스템자료와 연계하여 ‘외국인주민현황 조사 시스템’에 입력* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 자치구별 국적별 외국인주민 등○ 용어정의* 외국인주민 수 : 한국국적을 가지지 않은 등록외국인(외국인근로자, 결혼이민자,유학생, 기타) + 한국국적을 가지지 않은 외국국적동포 + 한국국적 취득자 +외국인 주민 자녀* 한국국적을 가지지 않은 자 (* 90일 미만 단기체류자 제외 ; 법무부)- 외국인 근로자, 결혼이민자, 유학생, 외국국적 동포, 기타* 한국국적을 취득한 자- 혼인귀화자 : 외국인 중 한국인과의 ‘혼인’으로 국적을 취득한 자- 기타사유 : 외국인 중 한국인과의 ‘혼인’ 외의 사유로 국적을 취득한 자* 한국인이 국적상실 후 회복한 경우 및 북한이탈주민은 제외* 외국인주민자녀 : 한국국적을 가지지 않은자’ 중 ‘결혼이민자’와 ‘한국국적취득자’의 자녀○ 기 타※ 행정자치부 외국인주민 통계는 우리나라에 90일 초과하여 장기체류하는 ‘등록외국인’(법무부 제공), 한국국적 취득자(혼인귀화자, 기타 사유 취득자), 외국인주민 자녀를대상으로 작성됨.- 법무부의 등록외국인통계는 90일이상 장기체류로 등록된 외국인을 대상으로 작성됨'
