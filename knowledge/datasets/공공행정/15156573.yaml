description_portal: 강릉관광개발공사 온라인 공동활용 화상회의실 개방실적 데이터는 공사가 보유한 온라인 화상회의 인프라를 지역사회 및 유관기관과 공동으로 활용한 현황을 체계적으로 정리한 자료입니다. 본 데이터는 화상회의실의 이용기간별 운영 실적을 기준으로 회의실명, 내부·외부 이용인원, 이용건수 등의 정보를 포함하고 있어 회의실 활용 수준과 개방 성과를 한눈에 파악할 수 있도록 구성되어 있습니다.해당 자료는 공공자원의 개방 및 공유 실적을 투명하게 공개함으로써 공사의 협업 기반 행정 운영과 디지털 업무환경 조성 노력을 확인할 수 있는 기초 자료로 활용됩니다. 또한 화상회의실 이용 현황 분석을 통해 시설 운영의 효율성을 제고하고, 향후 공동활용 확대 및 이용 활성화를 위한 정책 수립과 개선 방안 마련에 참고 자료로 활용될 수 있습니다.
