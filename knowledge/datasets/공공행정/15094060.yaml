description_portal: 불법주정차 위반 과태료의 부과·징수 과정에서 발생하는 과오납, 징수유예, 감액, 체납 등에 관한 현황 정보를 시민에게 공개함으로써 행정의 투명성과 신뢰성을 제고하고, 주정차 과태료 운영 현황에 대한 시민의 알권리를 보장하고자 함.본 데이터는 불법주정차 위반 과태료 업무 처리 과정에서 발생한 과오납 건수 및 금액, 징수유예 건수 및 금액, 감액 건수 및 금액, 체납 건수 및 금액 등에 대한 통계자료로 구성되어 있으며, 연도별·유형별 현황을 확인할 수 있도록 제공함.특히 과오납 현황은 이중납부, 착오납부, 행정처분 변경 등에 따라 발생한 환급 대상 건수를 의미하며, 징수유예 현황은 관계 법령에 따라 일정 기간 징수를 유예한 건에 대한 자료를 포함함. 또한 감액 현황은 의견제출, 자진납부 감경, 직권정정 등으로 감액 처리된 사례를 반영하고 있으며, 체납 현황은 납부기한 경과 후 미납 상태로 관리 중인 과태료 건수 및 금액을 포함하고 있음.아울러 본 자료는 불법주정차 과태료 행정의 운영 실태를 시민에게 공개함으로써 행정서비스의 책임성과 공정성을 높이고, 과태료 부과·징수 제도에 대한 이해를 돕기 위한 기초자료로 활용될 수 있음. 향후 데이터 기반의 교통행정 정책 수립, 세외수입 운영 분석 및 주정차 질서 확립을 위한 참고자료로도 활용 가능함.제공되는 자료는 관련 시스템 및 내부 행정자료를 기준으로 작성되었으며, 기준 시점 이후의 정정·취소·환급 등의 사유로 일부 수치가 변동될 수 있음. 또한 개인정보 및 개별 사건의 상세 내용은 제외한 통계 형태로 제공하여 관련 법령에 따른 개인정보 보호사항을 준수함.
