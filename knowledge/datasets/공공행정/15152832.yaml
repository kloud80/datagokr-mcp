summary_user: 한전KPS 본사와 사업소의 직원 채용공고를 공고 단위로 담는 API로, 소속(사업소)명·공고명·공고예정일·전형유형(직군)을 전국 범위로 제공한다. 구직자가 한전KPS의 어느 사업소에서 정규직이나 정비·사무보조 단기노무원을 언제 뽑는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소속명·공고명 같은 이름 매칭으로만 연결하며, 전형 일정·근무조건·직무기술서 같은 세부 내용은 잡알리오에서 공고명으로 찾아 함께 본다.
description_portal: 사업소명, 공고명 등을 기준으로 한전KPS의 신입사원, 단기노무원 등 본사 및 사업소 별 채용정보를 조회하는 직원 채용정보 조회 서비스입니다. 본사 및 사업소의 정규직, 별정직, 정비보조 및 사무보조 단기노무원 등 다양한 직무의 직원 채용정보를 확인할 수 있습니다. 공공기관 채용정보시스템인 잡알리오(https://job.alio.go.kr)에 접속하시면 채용전형 및 일정, 근무조건, 직무기술서, 입사지원서 등 보다 자세한 채용정보를 확인할 수 있습니다.
