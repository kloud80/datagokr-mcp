description_portal: 제주특별자치도에서 운영하는 제주 120 만덕콜센터의 유형별(일반행정, 교통, 도시건설, 문화체육관광 등) 상담 현황과 관련한 데이터를 제공합니다.*2011년 7월 1일 민간위탁으로 문을 연 제주120만덕콜센터(☏064-120)는 제주도청과 행정시로 분산됐던 전화 민원 창구를 통합해 '원스톱 행정서비스'로 개소 이후 도정시책 안내, 민원절차 안내, 생활불편신고 접수, 생활정보 제공 등 도민과 관광객의 다양한 요구에 응답하며 서비스 영역을 지속적으로 확장함. 2018년에는 '제주안내 120콜센터'에서 김만덕의 나눔과 봉사 정신을 이어받아 '제주120만덕콜센터'로 명칭을 변경, 2020년에는 고객맞춤형 관계관리(PCRM) 시스템을 도입해 종합 민원 해결사로서의 역할을 강화하고 있다.
