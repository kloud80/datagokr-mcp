description_portal: 인천광역시 경제활동별 지역내총부가가치 및 요소소득 공공데이터는 인천 지역의 다양한 경제활동(산업별)별 생산성과 소득 구조를 보여주는 통계자료입니다.해당 자료는 국가통계포털(KOSIS)를 참고하여 업데이트 된 자료입니다.이 데이터는 각 경제활동별로 생산된 산출액, 중간소비, 지역내총부가가치, 고정자본소모, 지역내순부가가치, 기타생산세, 지역내요소소득, 산출액, 지역내총부가가치 등의 정보를 포함하여 인천 경제의 세부적인 모습을 체계적으로 나타냅니다.공공데이터포털과 국가통계포털에서 정보를 확인할 수 있습니다.
