summary_user: 경기도 이천시 안에 있는 관공서를 한 곳씩 담은 개별 시설 목록으로, 구분명·전화번호·도로명/지번 주소·WGS84 위도·경도를 담는다(CSV 약 2.9KB 규모의 소량 파일). 이천시 주민이 가까운 행정기관의 위치와 전화번호를 찾거나, 분석가가 관공서 분포와 접근성을 지도에서 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 좌표로 공간 결합하거나 시군명·기관명을 맞춰 연결하며, 좌표가 있어 주민센터·무인민원발급기 같은 생활 행정시설 데이터와 지도 위에서 함께 쓴다.
description_portal: 경기도 이천시 내에 위치한 각 관공서의 명칭, 주소(도로명 및 지번), 전화번호, 위도·경도 등 정보를 제공하는 데이터입니다. 시민들이 행정기관의 위치를 손쉽게 확인하고 전화 문의 및 방문을 할 수 있도록 지원하며, 응급 대응, 민원 안내, 도시 인프라 분석 등 다양한 행정 서비스의 기반자료로 활용될 수 있습니다. 주소는 도로명주소와 지번주소 모두 포함되며, 위도·경도 정보는 공간분석 및 GIS 시스템과의 연계 활용도 가능합니다. 기관별 분포 현황, 접근성 평가, 생활 SOC 배치 검토 등 행정계획 수립에 활용될 수 있습니다.
