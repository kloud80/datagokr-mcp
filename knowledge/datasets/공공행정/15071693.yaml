summary_user: 서울시 요트장업 사업장별 인허가 원장으로, 업소 한 곳당 한 행에 인허가·취소일자, 영업·상세 상태, 휴업·폐업 기간, 주소·좌표, 지도자 수·회원모집 인원·건축물 동수·연면적·보험가입 여부 등을 담는다. 서울에서 현재 영업 중인 요트장이 어디에 있고 언제 인허가·폐업됐는지, 시설 규모와 보험 가입은 어떤지를 확인하려는 수상레저 안전·체육시설 정책 담당자나 레저 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드, 관리번호)로 연결하며, LOCALDATA 인허가와 같은 원천이라 다른 업종 인허가 데이터와 같은 구조로 묶어 쓴다.
description_portal: 서울시 요트장업 인허가 정보는 요트장 및 관련 수상레저 시설의 인허가 현황과 운영 특성을 제공하는 공공데이터입니다. 인허가일자, 취소일자, 휴업·폐업·재개업 정보는 시설의 행정·운영상 변동을 파악하는 데 활용되며, 전화번호, 주소, 면적, 좌표 등 기본 정보는 위치·규모 분석에 유용합니다. 문화체육업종명과 세부업종명은 해당 요트장의 운영 범위와 업종 특성을 나타내며, 지도자수, 회원모집 총인원 등은 운영 인력과 서비스 제공 규모를 평가하는 지표입니다. 건축물 동수, 연면적 등은 시설 현황을 확인하는 핵심 데이터이며, 보험가입여부와 공사립 구분 등은 안전·관리 체계를 파악하는 데 도움이 됩니다. 이 데이터는 수상레저 안전관리, 체육시설 운영 정책, 지역 관광·레저 산업 분석에 활용되는 주요 행정 자료입니다.
