description_portal: 퇴직공직자에 대한  취업심사대상기관(영리사기업체, 비영리법인, 협회 , 특정분야 등)을 안내합니다. 취업심사대상기관으로 고시된 이후 기관명이 변경된 경우 변경된 기관은 취업심사대상기관에 해당하며, 취업심사대상기관으로 고시된 기관을 양수·합병한 기관은 고시문에 포함되어 있지 않더라도 취업심사대상기관에 해당합니다.취업하고자 하는 기관이 지사(지점)일 경우, 고시에 없더라도 본사가 취업심사대상기관이면 지사(지점)도 취업심사대상기관에 해당합니다.취업심사대상기관의 소속기관(사립대학의 경우 산학협력단 등)도 취업심사대상기관에 해당합니다.취업심사대상 협회는 매년 6월에 고시되며, 취업심사대상 영리사기업체가 회원사 등으로 포함(가입)된 법인·단체는 고시에 없더라도 취업심사대상기관에 해당합니다. 따라서 취업 전에 취업심사대상협회인지 여부를 해당협회와 퇴직 시 소속기관에 다시 한 번 확인하시기 바랍니다.
