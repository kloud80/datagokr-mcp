description_portal: '"정보과학도서관 홈페이지 메뉴" 데이터는 도서관 홈페이지에 구성된 각종 메뉴 정보를 구조적으로 정리한 것으로, 사용자 편의성과 웹사이트 관리의 효율성을 높이기 위한 목적으로 제공됩니다. 이 테이블에는 각 메뉴의 고유식별번호를 비롯해 상위 메뉴와의 관계를 나타내는 상위메뉴고유식별번호, 메뉴가 속한 사이트명, 실제로 사용자에게 표시되는 메뉴명, 그리고 해당 메뉴의 유형 등이 포함되어 있습니다. 또한 자식 탭의 존재 여부, 마이페이지 관련 기능 여부 등의 속성 정보가 있어 홈페이지 내 메뉴 구조와 기능을 직관적으로 파악할 수 있도록 돕습니다. 등록일과 수정일 항목은 메뉴 정보의 생성 및 최신 변경 이력을 확인할 수 있으며, 이를 통해 이용자는 홈페이지의 정보 구조를 명확히 이해하고, 필요한 정보를 보다 쉽게 탐색할 수 있습니다.'
