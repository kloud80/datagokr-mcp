summary_user: 충청남도 당진시의회에 접수된 의안을 한 건씩 담은 파일로, 의안번호·의안명과 함께 접수일·회부일·상정일·처리일 같은 절차별 일자를 기록한다. 시민이나 의정 분석가가 "당진시의회에 어떤 조례안·예산안이 언제 접수돼 언제 처리됐나"를 확인하거나 의안 처리 기간을 따져볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의안명·의안번호를 이름으로 맞추거나 같은 기관(당진시) 자료끼리만 연결한다.
limits: 다른 지방의회·법령 데이터와 바로 붙일 공통 코드가 없어 연계는 이름 매칭에 기대야 한다. 범위는 당진시 한 곳이며, 갱신 주기는 확인되지 않았다(포털 설명상 데이터 기준일자는 2025년 6월 18일).
