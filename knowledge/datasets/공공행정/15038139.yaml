description_portal: '충청남도 당진시의회 의안 접수·처리 현황 안내(데이터 기준일자: 2025년 6월 18일)충청남도 당진시의회는 조례 제·개정, 예산안 심의, 각종 의견청취 등 지방자치단체의 주요 정책 결정 사항을 심의·의결하기 위해 다양한 의안을 접수·처리하고 있습니다.본 자료는 당진시의회에서 접수되어 처리된 의안의 절차별 진행 현황을 정리한 것으로, 다음과 같은 일자 정보를 포함하고 있습니다:접수일회부일상정일처리일본 자료는 의안 심사 절차의 투명성 확보, 의회 운영 이력 관리,시민 알권리 충족, 입법 행정 기록 관리, 정책 분석 및 의정 활동 평가 등에 활용될 수 있습니다.'
