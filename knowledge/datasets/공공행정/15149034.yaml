description_portal: 이 데이터는 경상남도 거제시의 토지 매매 신고 정보를 바탕으로 제공됩니다. 거래금액은 실제 신고된 금액이며, 거래면적은 해당 토지의 실면적(㎡)을 나타냅니다. 계약년도, 계약월, 계약일은 실제 계약이 체결된 날짜 기준으로 기록됩니다. 법정동, 시군구, 지역코드는 행정구역 정보이며, 위치 기반 분석에 활용할 수 있습니다. 용도지역과 지목은 토지의 이용 목적과 지적상 지목을 나타내며, 토지 성격 파악에 유용합니다. 기준년월은 이 데이터가 생성된 시점을 의미하므로, 최신성 여부 확인에 참고하시기 바랍니다. 본 데이터를 활용할 때는 실제 거래와의 차이나 행정구역 개편 여부 등을 함께 고려해 주세요.
