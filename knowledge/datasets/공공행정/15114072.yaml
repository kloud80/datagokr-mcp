description_portal: 광주광역시 연도별(2018~2022년) 출생인구와 사망인구에 관한 데이터입니다. 출생, 사망인구는 발생월별 자료입니다. 통계표의 잠정자료는 반올림한 값으로 전체 수치의 합과 일치하지 않을 수 있습니다.이 통계는 출생자 수와 사망자 수를 비교함으로써 자연증감(출생‑사망)에 따른 인구 변동을 분석할 수 있도록 설계되어 있으며, 연도별 자연증감 추이 및 인구 구조의 변화를 파악하는 데 유용합니다. 예컨대, 최근 몇 년간 출생자 수가 감소하고 사망자 수가 증가하는 추세는 광주지역의 저출산·고령화 문제를 반영하며, 이는 향후 인구정책 수립 및 복지 정책 설계 시 핵심적인 기초자료로 활용됩니다.
