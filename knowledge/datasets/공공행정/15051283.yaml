summary_user: 전북특별자치도 도민 사회조사 중 재활용품을 어떻게 내놓는지(공용 분리수거함, 종량제 봉투에 섞어 버림, 일반봉투에 분리 배출, 기타)에 대한 응답 비율을 성별·연령·학력·직업 등 응답자 특성별로 나눈 집계 통계로, 1KB 남짓의 작은 CSV 파일 한 개입니다. 전북 자원순환 담당자나 분석가가 어느 연령층·직업군에서 재활용품을 종량제 봉투에 섞어 버리는 비율이 높은지 보고 분리배출 홍보·교육 대상을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 응답자 특성 구분(구분) 이름을 맞추거나 같은 기관의 다른 사회조사 표와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 도민의 재활용품 배출 방법에 대한 사회 조사 통계 자료입니다. 공용 분리수거함 이용, 종량제 봉투에 혼합 배출 등 재활용품을 처리하는 방식에 대한 응답을 성별, 연령, 학력, 직업 등 다양한 인구통계학적 특성에 따라 세분화하여 보여주고 있습니다. 이 자료를 통해 각 계층의 분리수거 실천율과 환경 의식 수준을 심층적으로 분석할 수 있습니다. 자원순환 정책의 효과를 평가하고, 특정 집단을 대상으로 하는 맞춤형 홍보 및 교육 캠페인을 기획하는 등 효과적인 폐기물 관리 정책을 수립하기 위한 중요한 기초 데이터로 활용됩니다.
