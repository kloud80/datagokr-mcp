description_portal: 다수인이 제기한 민원에 대한 처리 상황 관련 정보가 담긴 데이터입니다.네 가지 정보가 포함되어 있으며, 각각 연번, 등록번호, 등록일, 추진내역 및 점검의견 항목입니다.한국농어촌공사에 접수되는 다수인민원이 어떤 식으로 처리되었는지 알 수 있습니다.2024.12.31일 기준 주로 수리시설 유지보수, 에너지 사업 등 토목 관련 사업과 관련한 다수인민원이 다수 제기되었습니다.* 처리 내용 중 개인 정보가 드러나거나, 민원인 혹은 민원 단체를 유추할 수 있다고 추정되는 부분은 자체 검열하여 OOO으로 처리하였습니다.
