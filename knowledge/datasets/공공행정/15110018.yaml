summary_user: 고용보험에 가입한 기업 중 한국산업인력공단의 직업능력개발 훈련사업(사업주훈련, 국가인적자원개발컨소시엄, 지역산업맞춤형, 일학습병행 등)에 참여한 기업을 기업 한 곳당 한 건으로 담는 전국 범위 데이터입니다. 기업명, 지번주소, 우편번호, 상시근로자 수, 설립일, 업종 코드·명, 훈련 참여 건수(HRD_CNT) 등이 들어 있습니다. 분석가나 지자체 담당자가 '우리 지역에서 어느 업종 기업이 정부 지원 직업훈련에 많이 참여하는가'를 볼 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 사업체·고용 통계와는 주소·우편번호나 업종명 같은 이름·코드 매핑으로만 이어 씁니다.
limits: 다른 데이터와 바로 붙일 공통 키가 없어 기업 매칭은 이름·주소 기반으로 해야 하고 오차가 생길 수 있습니다. 필드의 명세상 의미가 비어 있어, 각 컬럼의 뜻은 필드명에서 추정한 것입니다. 개발계정 호출은 하루 10,000회로 제한됩니다.
