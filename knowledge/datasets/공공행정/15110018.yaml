description_portal: 한국산업인력공단에서 수행중인 여러 직업능력개발 훈련사업(사업주훈련, 국가인적자원개발컨소시엄, 지역산업맞춤형, 일학습병행 등)과 관련하여 제공하는 훈련사업 참여 통계 관련 정보입니다. 고용보험 가입 기업 중 훈련참여 기업에 관한 기본정보 - 기업명 및 기타 기본적인 정보와,해당 기업이 참여한 훈련참여정보 - 훈련과정명 및 기타 세부정보를 제공하고 있습니다.※ 본 저작물은 '근로복지공단'에서 '2017년 공공데이터 포털을 통해  공공누리 제1유형으로 개방한 '고용/산재보험 현황정보'를 이용하여 제작되었습니다.
