summary_user: 지방공기업별·연도별 금융부채 현황을 담은 경영공시 집계 데이터로, 총자산·총부채와 장기·단기 금융부채, 비금융부채, 금융부채비중, 차입금의존도를 기관 단위로 제공하며 범위는 전국이다. 분석가나 지자체 재정 담당자가 '어느 지방공기업이 총자산 대비 금융부채 비중이나 차입금 의존도가 높은가'처럼 재무구조 안정성을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 경영공시 데이터와는 기관명(ENT_NAME)과 연도를 이름 매핑으로 맞춰 이어 써야 한다.
description_portal: 이 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 통합경영공시를 통해 수집·관리하는 경영정보 중 하나로, 지방공기업의 금융부채 현황을 집계한 정보입니다. 해당 데이터는 총자산 대비 금융부채 비중, 차입금 의존도, 금융부채 구성(장기·단기 구분) 등이 주요 지표로 포함됩니다. 이러한 정보는 지방공기업의 재무구조 안정성  평가, 정부와 지자체의 재정정책 수립, 재정 투명성 검증 등에 폭넓게 활용됩니다. 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 매년 정기적으로 공개되고 있습니다.
