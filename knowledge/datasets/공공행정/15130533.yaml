description_portal: '- 전라남도의회 홈페이지에 게재된 전라남도의회 본희의록 정보(377회~382회 본회의)를 조회하실 수 있습니다.- 전라남도의회 본회의록은 전라남도의회 공식 홈페이지를 통해 열람하실 수 있습니다.- 해당 사이트에서 본회의록을 확인하시려면 다음 단계를 따라주시기 바랍니다. 1. 홈페이지 상단 메뉴에서 "회의록" 또는 "회의록 검색" 메뉴를 클릭합니다.2. 검색 조건을 설정합니다. 예를 들어, **"본회의"**를 선택하고, 원하는 년도와 회기를 입력합니다.3. 검색 버튼을 클릭하면 해당 조건에 맞는 본회의록 목록이 나타납니다.4. 목록에서 원하는 회의록을 선택하여 상세 내용을 확인하실 수 있습니다.- 만약 특정 회의록에 대한 정보나 도움이 필요하시면, 전라남도의회 의사과로 문의하시면 자세한 안내를 받으실 수 있습니다.'
