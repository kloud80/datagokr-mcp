description_portal: 조사데이터 통합시스템(KRD) 기관별 성과조사 및 실태조사 상세 통계 데이터는 번호, 기관명, 전임교원 수, 총 논문 수, SCI급 논문 수, 전임교원 1인당 논문 수, 전임교원 1인당 SCI급 논문 수, 전임교원 1인당 과제 수, 전임교원 1인당 중앙정부 연구비, 특허등록 수 항목으로 구성되어 있습니다. 이 데이터는 대학 및 연구기관별 연구성과와 실태를 종합적으로 파악할 수 있도록 하며, 논문 생산성과 SCI급 논문 비중, 과제 수행 현황, 연구비 수주 규모, 특허 등록 성과 등을 객관적으로 비교 분석하는 데 유용합니다. 또한, 기관별 연구역량과 성과를 정량적으로 평가할 수 있어 정책 수립, 연구지원 전략 개발, 기관별 성과 관리, 연구 인프라 확충, 산학협력 활성화 등 다양한 분야에서 활용 가능합니다. 전임교원 1인당 성과 지표를 통해 기관별 연구 효율성을 평가할 수 있으며, 총 논문 수와 특허 등록 수를 통해 연구성과의 질적·양적 수준을 종합적으로 확인할 수 있습니다.
