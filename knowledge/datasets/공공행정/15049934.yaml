description_portal: 본 데이터는 한국도로교통공단이 제공하는 운전면허 업무별 수수료 현황을 정리한 공개 자료이다. 발급·갱신·재발급·적성검사·국제면허증 등 민원 유형별 금액, 적용 기준, 기준연도, 세부 분류 항목을 CSV로 제공한다. 이용자는 업무 전 예상 비용 확인과 채널별 안내 고지에 활용한다. 기관·지자체는 수수료 정책 검토, 예산 추계, 감면 제도 안내, 민원 시스템 연계에 참고한다. 데이터는 제·개정 사항을 반영해 주기적으로 갱신하며, 파일에는 컬럼 정의·코드값을 포함해 해석의 일관성과 재사용성을 높인다. 2019년 기준 데이터를 포함하며, 민간 개발자는 요금 계산기와 비교 서비스에 활용한다.
