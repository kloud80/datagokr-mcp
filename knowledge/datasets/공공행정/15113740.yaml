summary_user: 대전광역시 유성구 관내 행정기관(관공서)을 한 기관당 한 행으로 담은 목록 파일로, 기관명·도로명주소·지번주소·전화번호를 담는다(CSV 약 3.6KB 규모의 소량 원장). 주민이나 분석가가 '우리 동네에서 가까운 관공서는 어디이고 연락처는 무엇인가', '유성구 안에서 행정기관이 어느 지역에 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소(도로명·지번)를 문자열로 맞춰 이어 써야 하고, 주민센터·무인민원발급기 같은 생활 행정시설 데이터와 함께 볼 때도 이름·주소 매핑이 필요하다.
description_portal: 대전광역시 유성구 관공서 현황 데이터는 대전광역시 유성구 내 행정기관의 위치 및 연락처 정보를 제공합니다. 본 데이터는 시도, 시군구, 기관명, 소재지 도로명주소 및 지번주소, 전화번호 등으로 구성되어 있으며, 각 기관의 위치 파악, 민원 접근성 분석, 행정서비스 수요 예측 등 다양한 행정 활용에 유용합니다. 유성구 관내 행정기관의 분포를 한눈에 파악할 수 있는 기초 데이터로, 주민편의 증진 및 공공서비스 개선을 위한 기초 자료로도 쓰일 수 있습니다.해당 데이터는 정기적으로 현행화하여 공개하고 있습니다.
