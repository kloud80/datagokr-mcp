description_portal: '고객만족도 조사란 주택도시보증공사에서 제공하는 공공서비스에 대한 이용자의 만족도를 체계적으로 측정하고, 이를 바탕으로 전반적인 경영성과를 종합 평가하기 위해 실시하는 조사를 의미함.본 조사는 공사업무를 포함한 다양한 유형의 사업을 대상으로 서비스를 이용한 경험자에 대한 표본조사를 통해 진행됨우리 공사 서비스에 대한 전반적인 인식과 서비스 품질에 대한 평가를 수치로 확인가능한 지표임.수집된 고객의 실제 이용 경험과 평가 결과는 데이터 기반 분석을 거쳐, 각 기관의 서비스 품질 개선과 고객 중심 경영 전략 수립에 활용되며 더 나아가 국민의 체감 행정의 신뢰도를 높이는 중요한 기초자료로 기능함.우리 공사는 고객만족도 전체 조사결과로써 PCSI 점수, 구성모형별 점수, 세부사업별 점수를 측정하였으며, 이에 대한 결과를 공개하고자 함.- 대상 : 공사 전체 서비스- 조사방법 : 공사 서비스를 이용한 고객을 대상으로 설문조사- 표본수 : 1112명- 조사연도 : 2024년도- 만족도 유형 : PCSI, 구성모형별, 세부사업별- 조사 업무(사업) : 전반적 고객만족, 서비스품질, 불일치, 사회적책임, 사업자보증, 분양보증이행, 하자보수보증이행, 임대보증금보증이행, 전세보증금보증반환보증이행, 도시재생기금운용 등- 단위 : 설문조사를 통해 측정한 수치의 평균값- 제공주기 : 수시 제공(1회성)- 종합평균 : 83.89'
