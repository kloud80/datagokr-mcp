description_portal: '○ 통계개요* 통계명 : 중위연령(구별)* 통계종류 : 주민등록인구수를 자치구별로 제공하는 일반·보고통계* 근거법령 : 통계법 제18조에 의한 일반통계(승인번호 : 제20103호)* 작성목적 : 지역별 세대 및 인구, 연령구조 및 외국인 인구 현황과 변화 등을파악하여 정책수립을 위한 기초 자료로 활용* 조사체계 : 행정자치부·법무부 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 중위연령○ 용어설명* 중위연령 : 총인구를 연령 순서로 나열할 때, 중앙에 있게 되는 사람의 연령* 총인구에 외국인도 포함* 등록인구 = 주민등록인구 + 등록외국인* 주민등록인구는 "거주자", "거주불명자", "재외국민"이 포함- 거주자 : 거주지가 분명한 사람- 거주불명자 : 거주사실이 불분명하여 거주불명으로 등록된 사람- 재외국민: 외국의 영주권을 취득한(영주목적으로 외국거주 포함) 대한민국 국민으로주민등록을 한 사람* 등록외국인은 출입국관리법에 의해 91일 이상 장기체류자 중에서 작성기준일 현재외국인 등록표에 등재된 자의 집계결과로 실제로 국내에 거주하고 있는 외국인수와는차이가 있을 수 있음'
