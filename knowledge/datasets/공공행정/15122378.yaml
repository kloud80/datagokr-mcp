description_portal: 서울특별시 서울기록원 기록컬렉션 전거 목록은 기록의 생산 주체와 소장기관, 지명 등과 관련된 전거 정보를 체계적으로 정리한 데이터입니다. 전거식별자와 전거명을 통해 특정 기관이나 지명을 일관되게 식별할 수 있으며, 비채택 명칭을 함께 제공하여 다양한 표기나 변천된 명칭까지 아울러 파악할 수 있습니다. 단체 유형, 지역 유형, 소장처 유형 정보는 전거 주체의 성격과 역할, 위치를 구조적으로 이해하는 데 도움을 줍니다. 전거 설명과 행정적 구조, 지리정보는 해당 기관이나 장소가 어떤 역사적·행정적 맥락 속에 있는지 해석할 수 있는 배경 자료입니다. 이용시간, 이용조건, 열람조건, 복제조건, 연락처 항목은 실제로 관련 소장처를 방문하거나 서비스를 이용하려는 이용자에게 필요한 실무 정보를 제공하여 기록 활용을 지원하는 역할을 합니다.
