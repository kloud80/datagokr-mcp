summary_user: 법제처가 open.law.go.kr를 통해 제공하는 조약 목록을 조약 한 건 단위로 담으며, 조약명·양자/다자 구분·서명일자·발효일자·관보게재일자·조약번호와 상세 링크를 함께 준다. 외교·통상 실무자나 법률 분석가가 '특정 국가와 맺은 조약이 언제 서명되고 발효됐는가' 같은 질문에 답할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 조약일련번호·조약명 같은 이름·번호 매핑이나 법제처의 다른 조약 데이터(상세 링크로 본문 조회)와만 이어 쓴다.
description_portal: 법제처에서 제공하는 모바일 기반 조약 목록 조회 서비스 데이터입니다. 조약의 일련번호, 명칭, 조약구분코드 및 구분명, 서명일자, 발효일자, 관보게재일자, 조약번호 등의 항목을 체계적으로 확인할 수 있습니다. 다양한 검색 파라미터를 통해 조약명 또는 본문을 기준으로 조회할 수 있도록 구성되어 있습니다. 또한 양자·다자 조약 구분 기능이 포함되어 모바일 환경에서 조약 현황을 손쉽게 파악할 수 있습니다. 이 데이터를 활용하여 조약 현황 분석, 외교 및 법제 정책 수립, 규제 정비 등에 유용하게 활용할 수 있습니다. 사용자 측면에서 모바일 앱이나 웹서비스 내 조약 관련 정보 제공, 검색 기능 개선을 위한 기반 자료로 적합합니다.
