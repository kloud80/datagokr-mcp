summary_user: 서울시 치과기공소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소일자, 영업상태와 상세상태(폐업·휴업 기간 포함), 지번·도로명 주소, 전화번호, 좌표, 그리고 기공용 모터·포셀린 로·원심주조기 같은 장비 보유 수량을 함께 담는다. 보건 분야 분석가나 구청 담당자가 '어느 자치구에 영업 중인 치과기공소가 몇 곳이고 설비 수준은 어떤가'를 따지거나, 사업자가 특정 지역 기공소의 개업·폐업 이력을 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주소·업소명 매핑이나 같은 기관의 인허가 관리번호(MGTNO)·개방서비스 코드 체계(LOCALDATA 인허가와 같은 원천)로만 이어 쓴다.
limits: 서울시 열린데이터광장(data.seoul.go.kr) 전용 인증키가 필요하며, 이는 공공데이터포털 활용신청과 별개다. 법정동·행정동 코드 같은 공통 조인 키가 없어 다른 통계와 자동 결합이 어렵고, 주소 문자열이나 좌표로 직접 매핑해야 한다.
