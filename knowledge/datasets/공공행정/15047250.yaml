description_portal: 서울시 주요 공기업 리스트 정보(중국어_간체)는 서울시와 관련된 핵심 공기업들의 기본 현황을 중국어 간체로 제공하는 데이터입니다. 각 공기업을 식별하는 키와 더불어 명칭, 행정 시, 행정 구, 행정 동 정보가 포함되어 있어 기관이 어느 지역에 위치하며 어떤 행정 구역에 속하는지 직관적으로 파악할 수 있습니다. 또한 홈페이지 정보가 함께 제공되어 이용자가 각 공기업의 사업 내용, 공지사항, 채용 정보, 민원 서비스 등을 중국어 환경에서도 직접 확인할 수 있습니다. 이 데이터는 외국인 특히 중국어 사용 시민과 관광객, 투자자 등이 서울시 공기업 정보를 쉽게 이해하고 활용할 수 있도록 돕는 다국어 행정 정보 기반 자료입니다.
