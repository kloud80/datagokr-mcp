summary_user: 이천시의회에 발의된 의안을 건별로 담은 파일로, 대수·회기·의안번호·의안명·의안종류·발의자·소관위원회와 위원회·본회의 상정일·의결일·처리결과, 집행기관 이송일까지 한 의안의 처리 경과를 한 행에 기록한다(CSV 약 733KB). 시민·연구자가 '이번 대수에 어떤 의원이 몇 건을 발의했고 위원회와 본회의에서 원안가결·수정가결·부결 중 어떻게 처리됐나'를 확인하거나 회기별 입법활동을 집계하는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어 기관명이나 의안번호·의안명, 발의자 이름을 기준으로 다른 지방의회 의안 데이터나 자치법규 공포 자료와 맞춰 이어 써야 한다.
description_portal: 이 데이터는 의회에서 발의된 각종 의안의 처리 현황을 정리한 자료로, 발의 기관명, 대수, 회기, 의안번호, 의안명, 의안종류, 발의자 및 공동발의자, 소관위원회, 위원회 및 본회의 처리결과, 회의록 링크 등으로 구성되어 있습니다. 의안의 발의부터 경과를 추적할 수 있으며, 회기별·의원별 입법활동 분석, 특정 주제나 부문별 입법 현황 파악 등 다양한 정책분석에 활용 가능합니다. 특히 본회의 및 위원회별 처리결과 항목은 의회 내 논의 흐름 및 쟁점 도출에 유용하며, 공포번호와 회의록 링크는 입법의 투명성과 행정 연계성을 높입니다. 이 데이터는 입법 통계, 정책 평가, 시민 참여형 의정 모니터링, 지방의회 연구 등 다양한 분야에서 활용될 수 있습니다.
