summary_user: 지방자치단체별로 회계연도마다 일반회계 예산 중 정책사업 예산액과 그 안의 자체사업·보조사업 금액, 일반회계 예산액, 정책사업비중(비율)을 담은 전국 단위 집계 지표다. 지방재정 분석가나 주민이 '우리 시·군·구는 예산 중 정책사업에 얼마나 쓰고, 그중 보조사업 의존도는 어느 정도인가'를 다른 자치단체나 광역·전국 평균과 비교할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 지방재정365 계열 지표(재정자립도 등)와는 회계연도와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 맞춰 연결한다.
description_portal: 지방자치단체의 정책사업비중 지표는 자치단체의 예산 중 정책사업에 투입되는 비율을 나타내는 지표로, 자치단체의 재정운영의 효율성과 정책 우선순위 설정을 평가하는데 활용됩니다. 이 지표는 자치단체의 총 예산 중 정책사업에 해당하는 비율을 계산하여 산출되며, 자치단체의 정책추진 방향과 재정 운용의 투명성을 확인하는데 도움됩니다.정책사업비중 정보는 2008회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 정책사업예산액, 자체사업, 보조사업, 일반회계예산액, 정책사업비중 항목이 제공됩니다.
