summary_user: MDIS(마이크로데이터 통합서비스)가 제공하는 통계조사를 영역별로 나눈 정보를 조사영역 한 건당 한 행으로 담은 메타데이터 목록이며, 전국 단위의 비공간 자료로 CSV 파일(약 84KB)로 제공된다. 분석가가 특정 통계조사의 마이크로데이터가 어떤 영역으로 나뉘어 있고 그 영역이 언제부터 언제까지 적용되며 현재 제공되거나 시계열로 제공되는지 확인할 때 쓴다. 조사영역아이디(mdis_survey_area_id)와 조사아이디(mdis_survey_id)를 키로 MDIS 통계조사 목록·조사표 등 다른 MDIS 메타데이터 테이블과 이어 쓴다.
description_portal: MDIS_통계조사영역마이크로데이터 통합서비스국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다. 이에 통계청은 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.통계조사영역테이블은 MDIS에서 제공하고 있는 통계조사에서 영역별로 구분된 자료에 대한 정보를 제공하는 테이블입니다.
