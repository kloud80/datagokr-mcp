description_portal: 의왕도시공사 2025년 상,하반기 광고게재 현황 데이터입니다. 해당 데이터는 매년 갱신되며 광고게재일자, 광고내용, 광고유형(지면, 배너 등) 컬럼으로 구성되어 있습니다. 광고유형은 신문, 잡지, 사보, 안내책자, 리플릿 등 종이 매체의 인쇄 를 통한 지면광고와 웹사이트, 모바일 앱, 포털, SNS 등의 화면에 노출되는 배너광고로 구분됩니다. 본 데이터를 통해 의왕도시공사에서 실시한 광고 유형, 광고 시기 등 전반적 운영 사항을 확인할 수 있으며, 홍보 정책 수립 및 공공기관 홍보 현황 파악의 기초자료로 활용될 수 있습니다.
