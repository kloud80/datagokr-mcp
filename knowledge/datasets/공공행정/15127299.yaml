summary_user: 인천광역시 미추홀구가 소유한 구유지를 필지별로 담은 파일로, 재산구분·재산관리관·동명·번지·호·지목·면적·실면적을 행정동(읍면동) 단위 위치와 함께 기록한다. 주민이나 사업자가 '우리 동네 이 번지 땅이 구 소유인지, 지목과 면적은 얼마인지'를 확인하거나, 분석가가 동별 구유지 분포와 면적을 집계하는 데 쓴다. 전역 조인 키(필지고유번호 등)가 없어 다른 데이터와는 동명·번지·호를 주소로 맞추거나 지목코드를 지목 코드표와 매핑해서만 이어 쓸 수 있다.
limits: 필지고유번호(PNU) 같은 전역 키가 없어 국유재산·토지대장 데이터와 바로 붙지 않으며, 동명+번지 문자열 매칭에 의존해야 한다. 범위는 미추홀구 한 곳에 한정된다.
