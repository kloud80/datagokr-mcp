summary_user: 조세심판원 행정심판 재결례를 사건 한 건당 한 행으로 담은 목록으로, 사건명·청구번호·처분청·재결청·의결일자·처분일자·재결구분과 본문 상세 링크를 포함하며 범위는 전국이다. 세무 대리인이나 납세자가 '비슷한 과세처분에 대해 조세심판원이 최근 어떻게 결정했는가'를 찾거나, 연구자가 재결 결과의 경향을 살피는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없고, 일련번호(특별행정심판재결례일련번호)로 같은 서비스의 본문 상세 조회와 이어 쓰거나 처분청 이름으로 기관을 맞춰 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 조세심판원 행정심판 재결례 데이터로, 행정심판 재결례에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 납세자와 과세관청 간의 조세 관련 분쟁에 대한 심판 결과 목록을 제공합니다. 각 재결례는 사건번호, 결정일자, 과세유형, 쟁점사항, 심판 결과 등으로 구성되어 있으며, 분류체계에 따라 다양한 항목별 검색이 가능합니다. 이용자는 목록을 통해 관심 있는 사건의 개요와 주요 정보를 확인하고, 해당 재결례 본문으로 연계하여 상세 내용을 파악할 수 있습니다. 본 데이터는 세법 해석과 조세행정의 판단 경향 분석에 활용할 수 있도록 설계되었으며, 정책 수립 및 학술연구 등에도 유용하게 활용할 수 있습니다.
