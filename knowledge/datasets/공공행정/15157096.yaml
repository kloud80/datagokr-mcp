summary_user: 검색어를 넣으면 그 검색어와 연관된 법령 조문과 행정규칙 조문을 조문 단위 목록으로 돌려주는 법제처 지능형 법령검색 연관법령 API로, 범위는 전국·비공간입니다. 사업자나 실무자가 '이 업무 키워드와 관련된 법령·행정규칙 조문이 무엇인가'를 찾을 때 쓰고, 조회된 법령의 기본정보와 상세정보 확인으로 이어집니다. 실측 응답에서 전역 조인 키를 찾지 못해, 다른 데이터와는 법령명 등 이름 매핑이나 같은 기관(법제처) 코드로만 연결합니다.
description_portal: 공동활용센터를 통한 지능형 법령검색 시스템의 연관법령 목록을 XML 데이터로 제공 받으실수 있는 지능형 법령검색 시스템 연관법령 API 조회 서비스입니다. 사용자는 검색 조건으로 검색어를 입력하여 해당 검색어에 대한 검색결과를 법령분류별(법령조문, 행정규칙 조문)로 조회할 수 있도록 구성되어 있습니다. 검색 결과 데이터는 검색어에 연관된 법령 조문이나 행정규칙 조문 단위로 목록이 조회되고 조회된 법령의 기본정보 및 상세정보를 확인할 수 있습니다.
