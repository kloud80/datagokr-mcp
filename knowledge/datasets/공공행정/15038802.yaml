summary_user: 전국 지방자치단체의 통합재정 개요로, 회계연도(fyr)와 자치단체별 예산규모·세입세출 편성 결과, 재정자립도·재정자주도·사회복지비 비중 같은 재정지표, 인건비·기준경비 편성 현황을 담은 비공간 통계 자료다. 분석가나 주민이 '우리 지자체의 재정자립도와 사회복지비 비중은 다른 지자체와 비교해 어느 수준인가' 같은 질문에 쓴다. 전역 조인 키는 없으며, 자치단체 코드(laf_cd)·자치단체명 또는 같은 기관 코드 체계를 맞춰 다른 지방재정·인구 통계와 연결한다.
description_portal: '○ 통합재정개요 : 지방자치단체 예산분석 및 정확한 진단으로 자치단체 재정운영의 건전성 제고 및 실질적 지방재정 규모 및 수지를 나타내는 지표 분석을 통해 재정 통계의 투명성·신뢰성 제고○ 통계·재정지표   - 예산규모(총계, 순계)등 세입·세출예산 편성 결과   - 성인지예산 현황   - 주요 재정지표 : (세입)재정자립도, 재정자주도 등 5개, (세출)사회복지비 비중, 정책사업비중 등 8개○ 예산편성 현황   -  인건비 : 기준인건비 예산액, 기타직 등 인력 예산현황   -  기준경비 : 업무추진비, 지방보조금, 지방의회 관련 경비, 자체기준경비 단가 등'
