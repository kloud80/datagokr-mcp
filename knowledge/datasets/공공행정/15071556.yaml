summary_user: 서울 시내 병원에 부속된 의료기관을 사업장 단위로 담은 인허가 원장으로, 인허가·취소·폐업·휴업 일자와 영업상태, 지번·도로명 주소와 좌표(X·Y), 의료기관종별, 의료인수·입원실수·병상수·총면적, 진료과목을 담는다. 분석가나 정책 담당자가 '우리 구에 영업 중인 부속의료기관이 어디에 몇 곳 있고 병상 규모는 어느 정도인가' 같은 보건의료 자원 분포 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 잇고, 같은 원천을 쓰는 LOCALDATA 인허가 자료와 대조해 쓴다.
description_portal: 서울시 부속의료기관 인허가 정보는 서울 시내 병원에 부속된 의료기관의 인허가 현황과 운영 특성을 제공하는 공공데이터입니다. 인허가일자, 취소일자, 폐업·휴업·재개업일자, 영업상태 및 상세영업상태를 통해 기관의 설립과 운영 변동 이력을 파악할 수 있습니다. 사업장명, 전화번호, 지번·도로명주소, 우편번호, 좌표정보(X·Y), 소재지·총면적 등을 통해 위치와 규모 분석이 가능합니다. 의료기관종별명, 의료인수, 입원실수, 병상수, 허가병상수, 총인원, 구조사수, 구급차 일반·특수 보유 현황 등은 의료 인력·시설·응급 대응 역량을 보여주는 지표입니다. 진료과목내용 및 명칭, 완화의료 지정형태·담당부서, 최초·지정취소일자 등은 진료 기능과 완화의료 서비스 제공 여부를 분석하는 데 활용되며, 보건의료 자원 분포 및 응급·완화의료 정책 수립을 위한 기초 자료로 유용한 데이터입니다.
