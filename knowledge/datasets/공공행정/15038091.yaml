summary_user: 서울 동대문구 안에 설치된 폐건전지·폐형광등 분리수거함을 설치 지점별로 한 행씩 담은 원장으로, 설치 주소와 설치 건물명(동 주민센터 등), 지점별 보유 수량, 관리부서와 연락처를 포함한다. 동대문구 주민이 "우리 동네에서 폐건전지나 폐형광등을 어디에 버리나"를 찾거나, 구 담당자·분석가가 동별 수거함 배치 규모를 점검할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 설치주소를 주소·좌표로 변환하거나 건물명을 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 수거함이 설치된 정확한 설치 주소와 동 주민센터 등 구체적인 설치 건물명을 명시하여 구민들이 실생활에서 배출 장소를 쉽게 찾을 수 있도록 돕습니다. 또한 각 지점별로 배치된 수거함의 보유 수량 정보를 포함하고 있어 시설물의 관리 규모를 쉽게 파악할 수 있으며 . 폐건전지와 폐형광등은 수은이나 망간 등 중금속을 함유하고 있어 일반 쓰레기와 분리 배출하는 것이 매우 중요하며 이 데이터는 효율적인 수거 체계를 구축하고 환경 사각지대를 해소하는 정책적 기초 자료로 활용됩니다.
