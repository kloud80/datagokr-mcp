summary_user: 경기도 행정동별로 기준연월마다 총세대수와 1인부터 10인 이상까지 세대원수별 세대수를 담은 주민등록 집계 자료로, 4인 이상 세대수와 1인·2인·3인·4인 이상 세대 비율도 함께 담는다. 지자체 정책 담당자나 분석가가 '우리 시군에서 1인 세대 비율이 높은 행정동은 어디인가' 같은 질문에 답할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군코드·행정동코드나 시군명·행정동명을 이름·코드 매핑하거나 같은 기관(경기도) 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 각 행정동별 세대원수에 따른 세대수 분포를 보여주는 주민등록 인구통계 자료입니다. 기준연월, 시군코드, 행정동코드, 시군명, 행정동명 등의 구분과 함께 '총세대수', '1인세대수'부터 '10인이상세대수'까지의 세대원수별 세대 수가 제공되며, '4인이상세대수', '1인세대비율', '2인세대비율', '3인세대비율', '4인이상세대비율' 등의 파생 비율 항목도 포함됩니다. 지역별 세대 유형 및 세대 구성 특성을 분석할 수 있어 고령화 사회 대응, 1인 가구 정책 수립, 사회복지 서비스 계획 수립 등에 활용될 수 있습니다.
