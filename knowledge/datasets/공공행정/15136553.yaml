summary_user: KOSIS 국가통계포털에 통계를 작성·제공하는 중앙행정기관·지방자치단체·공공기관·연구기관의 명칭, 기관코드, 상위기관, 기관유형, 설립근거, 주소·홈페이지를 기관(부서) 한 건씩 담은 전국 단위 목록 파일(csv)이다. 통계 분석가나 연구자가 'KOSIS의 이 통계표는 어느 기관이 작성했고, 그 기관이 표준 통계작성기관인지'를 확인할 때 쓴다. 기관코드(kosis_org_cd)를 키로 KOSIS 통계표 목록·메타데이터와 이어 통계표별 출처 기관을 붙이고, 상위기관코드로 기관-부서 계층을 구성한다.
description_portal: 통계청_KOSIS 작성기관 파일데이터는 통계청 국가통계포털(KOSIS)에서 제공하는 각 통계표를 누가 작성했는지를 나타내는 기관 정보를 담고 있다.이 데이터는 통계를 생산한 중앙행정기관, 지방자치단체, 공공기관, 연구기관 등 다양한 작성기관들의 명칭과 코드, 분류체계 정보를 포함하며, 각 통계표의 출처를 명확히 하고 관리 및 활용을 용이하게 해준다.예를 들어, 교육 통계는 교육부, 보건 통계는 보건복지부 등 각 주관 기관이 명시되어 있어, 사용자는 원하는 분야의 통계가 어느 기관에서 생산되었는지를 쉽게 파악할 수 있다.
