summary_user: 경기도 시군구의 행정동(읍면동) 단위로 기준년월·시간대별 유동인구 수와 비율, 전월·전년동월 대비 증감값과 증감률을 담은 월별 집계 통계다. 상권 분석가나 창업 준비자가 "이 행정동은 어느 시간대에 유동인구가 몰리고, 작년 같은 달보다 늘었나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(admdong_cd)나 행정동명을 매핑해 같은 행정동·월 단위의 상권·인허가 자료와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 각 시군구의 행정동 단위로 시간대별 유동인구를 집계한 통계자료입니다. ‘기준년월’과 ‘시간대코드’를 기준으로 특정 행정동에서 발생한 유동인구 규모와 그 비율, 전월 및 전년동월 대비 증감 값을 포함합니다. 주요 항목으로는 ‘기준년월’, ‘시간대코드’, ‘행정동코드’, ‘행정동명’, ‘행정동명_영문’, ‘유동인구수’, ‘유동인구수비율’, ‘전월대비증감값’, ‘전월대비증감비율’, ‘전년동월대비증감값’, ‘전년동월대비증감비율’이 있으며, 이를 통해 시간대별로 인구가 집중되는 행정동을 식별하고, 시계열적인 변화를 분석할 수 있습니다. 해당 데이터는 행정계획 수립, 교통량 분석, 지역 상권 활성화 전략 수립 등 다양한 정책 활용에 적합합니다.
