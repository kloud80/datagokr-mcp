description_portal: '마포구 관내 오피스텔 및 도시형생활주택-원룸형 현황에 대한 정보입니다.이 데이터는 해당 주택들의 도로명 주소및 행정동에 대한 정보를 포함하고 있습니다. 각 주택 유형별 대지면적(단위:㎡)과 건축면적(단위:㎡) 및 연면적(단위:㎡), 주용도(예: 제2종근린생활시설, 업무시설 등), 기타용도(예: 업무시설, 오피스텔 등), 세대수 및 가구수, 허가일과 착공일 및 사용승인일 등과 같은 세부 사항도 제공됩니다. 이를 통해 주민들과 부동산 관계자들은 마포구 내 다양한 주거 형태의 분포와 임대 시장 현황을 한눈에 파악할 수 있으며, 주거 정책 수립 및 지역 개발에 활용할 수 있습니다.'
