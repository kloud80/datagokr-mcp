description_portal: 시흥도시공사에서는 내부 직원, 시흥시민, 그리고 대국민과의 원활한 소통을 강화하기 위해 다양한 설문조사를 체계적으로 추진하고 있으며, 이러한 활동의 현황을 투명하게 공개하는 데이터를 제공합니다. 이 데이터는 공개 데이터는 연도, 설문제목, 시작·종료일, 참여자 수, 만족도 점수, 등록일 등의 컬럼으로 이루어져 있습니다. 개인정보 보호를 위해 참여자 데이터는 익명화 처리되며, 개인정보보호법 준수 원칙을 적용합니다. 이러한 공개를 통해 공사는 시민 참여를 촉진하고, 설문 결과를 바탕으로 서비스 혁신을 지속적으로 추진합니다.
