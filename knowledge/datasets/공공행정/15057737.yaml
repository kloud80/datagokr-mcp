summary_user: 부산 반여농산물도매시장에서 거래된 농산물의 경락 정보를 거래 건별로 담으며, 판매일자·도매법인·품목·품종·단량·등급·산지·물량·경락가격·낙찰시각 등이 들어 있다. 농산물 유통업자나 소비자가 특정 품목의 최근 도매 경락가격과 거래 물량을 확인하고 일별·주간 시세 흐름을 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 도매시장 경락 데이터와는 품목·품종 이름이나 대·중·소 분류 코드(large·mid·small)를 매핑해 이어 써야 한다.
description_portal: 부산광역시 반여농산물도매시장내에서 거래되는 농산품의 실시간 경락정보(날짜, 도매법인, 품목, 품종, 단량, 등급,  반입일자, 물량(kg), 금액(최저가, 최고가, 평균가) 등)실시간 경락정보, 반입물량정보 내 품목별 정보는 7일간의 정보만 제공됩니다. 제공되는 데이터를 통해 거래되는 농산품의 일일가격정보, 주간평균경락가격, 월간평균경락가격 조회가 가능합니다.
