description_portal: '광주광역시 행정구역 현황 중 5개 자치구(동구, 서구, 남구, 북구, 광산구)에 소재하고 있는 96개 행정동의 주민센터(행정복지센터) 현황(우편번호, 도로명주소, 주민센터 전화번호, 관할 자치구 및 연락처 등)입니다.  - 기준일자: 2025. 7. 29. 기준 - 자치구별 행정동 현황 : 동구 13개동, 서구 18개동, 남구 17개동, 북구 27개동, 광산구 21개동     * 2024.1.1. 기준 중흥2, 중흥3동에서 중흥동으로 합동되었음. (97개동 → 96개동으로 변경)※ 「지방자치법」 제9조(사무소의 소재지) 에 따라  읍면동 사무소의 소재지는  해당 기초 자치단체 조례로 정하게 되어 있어 게시된 자료와 일부 상이할 수 있으며 기준일 이후에 발생하는 변동 사항 등은 해당 자치구로 문의하시기 바랍니다.  - 광주광역시 내 해당 자치구의 주민자치센터 설치 및 운영 조례를 참고하시기 바랍니다.'
