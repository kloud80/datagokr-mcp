summary_user: 광주광역시 5개 자치구에 있는 행정동 주민센터(행정복지센터)를 한 곳당 한 행으로 담은 시설 목록으로, 포털 설명 기준 96개 동의 우편번호·도로명주소·전화번호·관할 자치구와 그 연락처를 담는다. 시민이 '우리 동 주민센터 주소와 전화번호가 무엇인가'를 찾거나, 분석가가 자치구별 행정동 주민센터 분포를 정리할 때 쓴다. 전역 조인 키(행정동 코드 등)는 없어 시도·시군구·읍면동 이름이나 도로명주소로 다른 행정동 단위 데이터나 주소 기반 시설 데이터와 맞춰 이어 쓴다.
limits: 행정동 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 동 이름이나 주소를 직접 매핑해야 한다. 주민센터 소재지는 자치구 조례로 정해져 기준일 이후 변동이나 게시 자료와의 차이가 있을 수 있다.
