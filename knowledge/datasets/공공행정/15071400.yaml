summary_user: 서울시 관할 관광극장유흥업 사업장의 인허가 원장을 사업장(관리번호) 단위로 담으며, 인허가·취소·폐업 일자, 영업상태와 상세상태, 지번·도로명 주소, 좌표(X/Y), 무대면적·좌석수 같은 시설 항목을 포함한다. 상권 분석가나 관광·야간경제 정책 담당자가 '어느 자치구에 영업 중인 관광극장유흥업소가 몰려 있고 언제 폐업이 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 원천(LOCALDATA 인허가)의 다른 업종 인허가 자료와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호나 주소·사업장명 매칭으로 잇는다.
description_portal: 'ㅇ 데이터 개요: 「서울시 관광극장유흥업 인허가 정보」는 관광진흥법 등 관련 법령에 따라 서울시 관할 사업장의 인‧허가 현황을 표준 스키마로 정리한 자료입니다. 관리번호, 인허가 일자, 사업장명, 영업상태, 소재지(지번‧도로명), 연락처, 좌표 등 기본 행정·공간 정보를 포함하며, 지속 갱신되는 특성을 가집니다.ㅇ 구조 및 범위: 동일 사업장에 대한 상태 변경(영업‧휴업‧폐업‧취소 등) 이력을 코드로 구분하여 시계열 추적이 가능하도록 구성되어 있습니다. 이력 기반 분석과 현장 점검 이슈의 사후관리 체계를 구축하는 데 유용합니다.ㅇ 주요 필드: 영업상태(및 상세 상태), 업종 구분, 소재지 주소, 좌표(X/Y), 관리기관, 최종수정 주체 등 행정 처리에 필요한 핵심 필드가 포함됩니다. 좌표와 주소는 지도 시각화, 권역별 분포 분석, 접근성 평가 등 공간 분석에 활용할 수 있습니다.ㅇ 정책·현장 활용: 점검·단속 우선순위 도출, 유해환경 관리, 야간경제·관광정책 연계, 민원 및 안전 관련 데이터와의 교차분석 등에 직접 적용 가능합니다. 타 시스템(민원, 재난‧안전, 도시계획, 교통)과 연계하여 위험도 매핑과 취약권역 선제관리에 활용하실 수 있습니다.ㅇ 품질·전처리 유의: 주소 이중 표기(지번/도로명)와 좌표 누락·오류, 코드 불일치 등이 발생할 수 있어 주소 정규화, 좌표 검증, 코드목록 정합성 점검, 결측치 처리 등의 전처리가 권장됩니다. 동일 사업장 판별을 위한 키 정의와 이력 병합 규칙도 사전에 확정하는 것이 좋습니다.ㅇ 추가 항목 가능성(확실하지 않음): 수용인원, 좌석수, 시설 특성 등 업종 특화 필드가 포함될 수 있으나, 제공 스키마에 따라 상이할 수 있어 데이터 사전 확인이 필요합니다.'
