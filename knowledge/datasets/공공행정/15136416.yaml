summary_user: 경기공유서비스(공유누리)에서 대관하는 공공시설별로 요일 구분(평일·토요일·일요일·공휴일 등)마다 운영 시작·종료 시간을 한 행씩 담은 설정 자료이며, 범위는 시도 단위이고 공간 좌표는 없다. 주민이나 단체가 "이 회의실을 토요일 몇 시부터 몇 시까지 빌릴 수 있나"를 확인할 때, 분석가가 요일·시간대별 대관 가능 시간과 가동률을 따질 때 쓴다. 기관코드(inst_cd)와 시설코드(faclt_cd)로 같은 경기공유서비스의 시설 목록·예약 데이터와 이어 쓰지만, 다른 기관 데이터와 붙일 전역 조인 키는 실측에서 찾지 못했다.
description_portal: 이 데이터는 공공시설의 대관 운영시간을 관리하기 위한 자료로, 각 시설별 운영 가능 요일과 시작/종료 시간을 포함하고 있습니다. 주요 항목은 ‘기관코드’, ‘시설코드’를 통해 각 시설을 식별하고, ‘요일구분’은 평일, 주말, 공휴일 등 운영 요일을 코드(SA, SU, WE, HO 등)로 구분합니다. ‘시작시간’과 ‘종료시간’은 해당 요일의 운영 시작과 종료 시점을 시간 형식으로 표시합니다. 이 데이터는 시설예약 시스템 내 운영시간 설정, 요일별 예약 가능시간 안내, 공공자원 가동률 분석 및 시간대별 수요 대응 등에 활용될 수 있습니다.
