summary_user: 경기도 내 경찰서·지구대 등 경찰관서를 한 건씩 담은 시설 목록으로, 관서별 시군명, 관할 경찰서명, 지번·도로명 주소, 우편번호, 위경도 좌표를 포함한다. 도민이 우리 동네 가장 가까운 경찰관서 위치를 찾거나, 분석가가 시군별 치안시설 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소 문자열, 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 경찰관서의 현황을 담고 있으며, 각 경찰관서의 경찰서명, 소재지주소, 우편번호 등의 기본정보를 포함하고 있습니다. 본 데이터는 치안 행정정보 제공을 통해 도민들의 공공안전 정보 접근을 용이하게 하고, 경찰행정 정책 수립 및 공공서비스 개선에 활용될 수 있습니다. 또한 데이터는 경찰청 홈페이지를 원본 시스템으로 하며, 수시로 갱신되며 최신의 기관 정보를 반영하고 있습니다. 사이버경찰청 정보도 함께 제공되어 다양한 경찰 관련 관서 현황을 포괄합니다. API 형식은 XML이며, 경기도 데이터포털을 통해 접근 가능합니다.
