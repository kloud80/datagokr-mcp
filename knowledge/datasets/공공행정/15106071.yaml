summary_user: 2018년 6월 13일 제7회 전국동시지방선거를 두고 선거 전 2차례·선거 후 1차례, 각 1,500명에게 실시한 유권자 의식조사의 응답자 1명당 1행 원자료로, 지역(area)·연령·문항별 응답과 가중치(wt)를 담는다. 연구자나 분석가가 '지방선거에 대한 관심과 투표 참여 의향이 연령·지역별로 어떻게 달랐고 선거 전후로 어떻게 바뀌었나'를 가중치를 적용해 집계할 때 쓴다. 전역 조인 키가 없어 다른 회차 의식조사나 실제 투표율 자료와는 지역 이름·문항 내용을 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: '2018년 6월 13일에 실시한 제7회 전국동시지방선거에 대한 유권자 의식조사로 선거  관심 및 투표참여 형태 등에 대한 유권자 의식과 태도를 조사하여 향후 선거에 대한 국민의 관심과 참여를 높이고, 선거 관련 제반 연구의 기초자료로 활용하기 위함. ※ 본 조사는 선거일 전 2차례, 선거일 후 1차례 총 3차례 진행됨. ▶ 1차 조사: 2018. 5.16. ~ 5.17. (선거일 29일 전) 1,500명▶ 2차 조사: 2018. 6. 3. ~ 6. 4. (선거일 11일 전) 1,500명▶ 3차 조사: 2018. 6.18. ~ 7. 6. (선거일 후) 1,500명※ 해당 조사의 설문지는 인쇄본(PDF)에 포함되어 있습니다.▶ 1차 조사: 제7회 전국동시지방선거 유권자 의식조사(인쇄본).pdf의 p.79~83▶ 2차 조사: p.163~168▶ 3차 조사: p.353~363'
