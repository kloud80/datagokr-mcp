summary_user: 소통24 정책참여 설문조사의 질문을 한 행씩 담은 건별 원천 파일(csv, 약 4.1MB)로, 질문명·질문 방식·선택 최소·최대 수·표시 순서·필수 응답 여부·질문별 투표수·삭제 여부와 등록·수정 일시를 담는다. 정책 설문을 설계하거나 분석하는 연구자·공무원이 '필수 문항과 선택 문항, 복수선택 허용 범위에 따라 질문별 투표수가 어떻게 달라지는가' 같은 응답 행태 질문에 쓴다. 질문아이디(sotong24_question_id)가 실측 조인 키이며 문항아이디도 함께 있어 소통24 설문조사·문항(보기) 데이터와 이어 쓰고, 질문방법·문항 정렬·출력형태 코드는 별도 코드표가 입력에 없어 뜻을 따로 확인해야 한다.
description_portal: 소통24 정책참여에서 실시한 설문조사의 질문 정보를 제공하는 데이터입니다. 각 설문 항목에는 질문명, 질문내용, 문항 선택 최소·최대 수, 질문 표시 순서, 필수 응답 여부, 질문별 투표수 등 세부 속성이 포함되어 있습니다. 이를 통해 설문조사 문항의 구조와 응답 방식, 국민 참여자의 선택 경향을 구체적으로 파악할 수 있으며, 정책 설문 설계 개선, 조사 문항 신뢰도 검증, 응답 행태 분석 등 다양한 연구와 행정 의사결정에 활용할 수 있습니다. 데이터는 정기적으로 갱신되어 최신 설문 결과와 국민 참여 동향을 반영합니다.
