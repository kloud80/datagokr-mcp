summary_user: 시군 단위 지방자치단체의 지방세 수입에서 취득세·재산세·지방소득세 등 개별 세목이 차지하는 금액과 비중을 회계연도·자치단체·세목별로 담은 집계 지표로, 범위는 전국입니다. 분석가나 주민이 '우리 시군은 어떤 세목에 세수를 기대고 있고 취득세 쏠림이 심한가'처럼 세수 구조와 편중 여부를 따질 때 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 자료와는 자치단체 코드·이름(wa_laf_cd)과 회계연도로 맞추거나 같은 기관 코드 체계 안에서만 이어 쓴다.
description_portal: 도시군세 세목별 비중이란 각 지방자치단체, 특히 시군단위의 지방세 수입 중에서 개별 세목(예시:취득세, 등록면허세, 주민세, 재산세, 지방소득세 등) 이 차지하는 비율을 의미합니다.이는 특정 시군의 재정구조에서 어떤 세목이 주된 세수원인지 파악할 수 있도록 해주는 지표로, 자치단체의 재정자립도, 지역경제 구조, 세수 편중 여부 등을 분석하는 데 활용할 수 있습니다.예를 들어 개발사업이 활발한 지역에서는 취득세 비중이 높을 수 있고, 사업시설이 많은 도심 지역은 재산세나 지방소득세 비중이 높을 수 있습니다.
