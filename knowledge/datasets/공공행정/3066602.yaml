description_portal: '충청북도에 소재한 언론기관의 데이터로서, 충청북도 소재 언론기관의  언론사, 대표자, 직위, 주소, 대표전화, 홈페이지 등을 포함하고 있습니다.충청북도의 언론기관 현황은 지역 내 사회, 문화 정치,  경제 전반을 전달하는 중요한 정보 기반 체계로서의 의미가 있습니다.청주를 중심으로 도내 전역에는 일간지, 주간지, 인터넷신문, 방송사, 라디오 등 다양한 형태의 언론사가 분포하고 있습니다. 대표적으로 충청일보, 중부매일, 동양일보 같은 지역신문이 있으며, KBS청주방송총국과 MBC충북, CJB 청주방송 등이 지역방송을 담당합니다.기타유의사항 : 공란(데이터 미집계, 개인정보 등)'
