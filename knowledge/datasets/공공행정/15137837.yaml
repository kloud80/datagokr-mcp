description_portal: 본 데이터는 경기도 광주시의회 홈페이지에서 관리하는 위원회 정보를 제공합니다. 시의회는 효율적인 의정 활동을 위해 분야별 상임위원회와 특별위원회를 구성하여 운영하며, 본 데이터는 각 위원회의 기본 정보를 담고 있습니다. 고유번호는 위원회를 식별하는 코드이며, 대수는 의회의 기수를 나타냅니다. 위원회명과 영문명은 위원회의 명칭을 제공하고, 정렬순서와 홈페이지 사용 여부는 웹사이트 운영을 위한 관리 정보입니다. 본 데이터는 의회 홈페이지 운영, 위원회 활동 공개, 의정 정보 제공, 시민 소통 강화 등에 활용되며 의정 활동의 투명성과 접근성을 높입니다.
