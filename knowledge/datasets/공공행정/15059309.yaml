summary_user: 법령에 첨부된 별표·서식을 한 건씩 담는 목록으로, 별표명·별표종류·별표번호와 관련 법령명·법령ID·소관부처·공포일자·제개정구분, 파일·PDF·상세 링크를 전국 단위로 제공한다. 행정 담당자나 사업자가 '이 법령에 붙은 신청서 서식이나 별표 기준표 파일은 어디서 내려받나'를 찾을 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 법제처 법령 데이터와는 관련법령ID·관련법령명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 법제처가 제공하는 모바일 법령 별표 및 서식 목록 조회 데이터는 각 법령에 첨부된 별표와 서식 파일의 기본 정보를 체계적으로 제공합니다. 해당 데이터는 법령ID, 법령번호, 별표·서식 제목, 파일 고유번호, 파일 URL, 게시일자, 첨부파일 형식 등 주요 속성을 포함합니다. 사용자는 법령번호, 법령ID, 파일 제목, 페이지 및 조회 건수 옵션을 통해 원하는 별표나 서식을 맞춤형으로 조회할 수 있습니다. 법령 체계 내 문서별 상세 구조 및 첨부파일 현황을 분석하고 관리하기에 적합하며 별표와 서식을 문서 단위로 분리하여 관련 정보를 연계 확인할 수 있어 행정업무 지원 및 정책문서의 정확한 활용에 유용합니다.
