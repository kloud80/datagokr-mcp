description_portal: '[SGIS 오픈 플랫폼] "SGIS에듀" 서비스의 "가르치는 지도" 교안 정보를 담고 있습니다학교등급, 교안제목, 교안내용, 교안의 중심 이미지파일명, 조회수 등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. SGIS에듀  사회교과과정 및 관심주제에 따라 관련 콘텐츠에 쉽게 접근할수 있도록 메뉴 구성되었으며,주변생활과 밀접한 통계정보들과 위치 정보들을 결합한 다양한 통계지도들을 제공하는 서비스'
