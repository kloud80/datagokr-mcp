description_portal: 위 자료는 일상생활에서 발생하는 각종 법률문제에 있어 시민의 권리를 보호하고, 시민의 사회활동에 있어 법률적 측면의 지원을 제공하기 위해 전남광주통합특별시에서 운영하는 무료법률상담실에 관한 데이터입니다. 지원근거,상담대상, 운영요일,공휴일 운영여부, 운영시작시각, 운영종료시각, 상담관, 회차별상담관수, 상담방법, 예약전화번호, 상담내용, 상담일정, 주의사항, 담당부서 등이 포함됩니다. 전남광주통합특별시 무료법률상담실은 시민생활에 밀접한 법률문제(부동산, 창업, 상속 등) 및 행정처분과 관련된 법률상담, 각종 법률해석 등을 상담함으로써 시민생활에 중요한 역할을 하고 있습니다.
