summary_user: 대규모기업집단으로 지정된 기업집단의 소속회사별 재무 개요(자산총액·부채총액·자본총액·자본금·매출액·당기순이익, 결산일자)를 회사 단위로 담는 API이며, 검증 호출에서 전국 59행이 수신됐다. 투자자나 언론, 분석가가 특정 기업집단 소속회사의 규모와 수익성이 어떤지 확인하는 질문에 쓴다. 법인등록번호(jurirno)와 사업자등록번호(bizrno)가 조인 키라서, 같은 키로 묶이는 공정위의 다른 기업집단·가맹·특수판매·상조 등록·지정·공시 데이터와 이어 쓴다.
limits: 검증 호출(presentnYear=202105) 기준 수신 기간이 2020-11-30~2021-03-31이므로 이 범위를 넘는 시점의 값은 확인되지 않았고, 데이터 자체의 최신성과는 다를 수 있다. 호출 전에 공개년월 조회 API(publicYmList)로 사용 가능한 년월을 확인해야 하며, 법인등록번호 없이 요청할 때만 제공되는 필드(기업명·대표자명 등)가 있다.
