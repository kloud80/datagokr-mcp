description_portal: 경기도 수원시 공유냉장고 현황으로 공유냉장고명, 공유냉장고 세부위치, 주소, 위도 경도, 운영여부 등에 대한 데이터입니다. 공유냉장고 데이터는 지역사회 복지, 식품 나눔, 도시재생, ESG 행정 등 다양한 분야에서 시민과 행정 모두에게 큰 가치를 줄 수 있는 자원입니다. 공유냉장고 위치를 기반으로 식품 나눔 접근성을 파악하여 자원 순환 참여를 유도 할 수 있습니다. 유통기한 임박 식품, 남은 반찬을 낭비 없이 재분배할 수 있는 지역 네트워크를 구축하여 환경, 사회적 가치를 동시에 창출하는 대표적은 ESG 행정 실천이기도 합니다. 또한 폭염, 한파, 재난 등 긴급상황이나 긴급 도시락으로 취약계층의 복지에도 활용할 수 있습니다.
