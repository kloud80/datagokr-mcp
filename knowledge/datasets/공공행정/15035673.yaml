summary_user: 경상남도 사천시에 있는 행정사 사무소를 사무소 한 곳당 한 행으로 담은 목록으로, 업체명·주소·전화번호·기준일을 담는다(파일 크기 약 1.7KB). 사천시민이나 사업자가 인허가·신고·민원 대행을 맡길 행정사를 찾을 때 "우리 동네 가까운 행정사 사무소 연락처는?" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업체명을 매칭해서 잇거나, 같은 사천시가 낸 생활 행정시설 자료와 나란히 놓고 쓴다.
