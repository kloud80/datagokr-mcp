description_portal: 부산광역시 연제구 지역자활센터 현황(시설명, 운영주체, 대표자명, 소재지, 전화번호, 팩스번호, 홈페이지 주소 등) 정보를 제공합니다.○ 지역자활센터는 근로능력 있는 저소득층에게 집중적이고 체계적인 자활지원서비스를 제공함으로써 자활의욕을 고취시키고 자립능력을 향상시키기 위한 목적으로 설립되었습니다.○ 지역자활센터의 주요 사업으로는 자활의욕 고취를 위한 교육, 자영창업 지원 및 기술경영 지도, 자활기업의 설립 및 운영 지원, 사회서비스지원 사업 등이 있으며 이 외에도 기초수급자 및 차상위계층의 자활 촉진에 필요한 사업을 수행하는 핵심 인프라로서의 역할을 수행하고 있습니다.
