summary_user: 광주광역시 안의 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일 데이터로, 시군구·읍면동, 시설종류(정부지원·지자체·공공용), 용도, 시설명, 도로명·지번 주소, 시설규모(톤), 활용인원, 준공일·운영지정일을 담는다. 주민이나 재난 대응 담당자가 단수·비상 시 우리 동네에서 가장 가까운 급수시설이 어디이고 몇 명이 쓸 수 있는 규모인지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구·읍면동 이름이나 주소 문자열을 맞춰 붙이거나, 주소를 지오코딩해 대피소·인구 데이터와 겹쳐 본다.
description_portal: '광주광역시 내 민방위 비상급수시설 현황입니다. 시설종류, 용도, 시설명, 시설유형, 소재지주소, 급수용량 등의 정보를 제공합니다.○ 정부지원시설 : 정부지원금으로 설치한 시설    * 행정안전부(민방위과)에 의해 비상급수를 목적으로 예산 지원 및 구축이 이루어진 시설○ 지자체시설 : 지방자치단체가 설치한 시설    * 지자체(시도 및 시군구) 민방위 업무 담당부서의 예산이 투입된 시설○ 공공용시설 : 민간 및 정부⋅공공기관 등의 양수시설 중 유사 시 비상급수시설로 전환이 가능한 시설로 소유자⋅관리자 또는 점유자(이하 “시설주”)의 동의를 얻어 주민에게 용수 공급이 가능토록 지정한 시설'
