summary_user: 한국지역난방공사가 운영하는 열원시설(DCS)의 가동 현황을 실적 일자·시간별, 열원시설 ID(HTSCE_FCLT_ID)별로 담은 데이터로, 가동 여부와 가동 시작·정지 값이 함께 들어 있고 범위는 전국이다. 에너지·난방 분석가가 "특정 열원시설이 어느 날 몇 시에 가동·정지했는가"를 시간대별로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설 이름 매핑이나 같은 기관(한국지역난방공사) 데이터의 열원시설 ID로만 이어 쓸 수 있다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국지역난방공사에서 제공하는 정보로 열원시설별 가동시간 등을 제공하고 있습니다.
