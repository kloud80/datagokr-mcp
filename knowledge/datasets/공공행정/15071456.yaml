summary_user: 서울시에 인허가된 담배 수입·판매 업체를 사업장 한 곳당 한 행으로 담은 건별 인허가 원장으로, 인허가일자·영업상태·휴업 기간·사업장명·주소·좌표·취급제품명·담배공급업체명을 포함한다. 분석가나 보건·유통 담당자가 '서울에서 지금 영업 중인 담배수입판매업체는 어디에 있고 어떤 제품을 어느 공급업체에서 받는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 기관 코드나 업체명·주소 매핑으로만 잇고, 같은 원천인 LOCALDATA 인허가 자료와 함께 쓴다.
description_portal: 서울시 담배수입판매업체 인허가 정보는 서울시에 인허가된 담배 수입·판매 업체의 행정 이력과 사업장 현황을 파악할 수 있도록 구성된 공공데이터입니다. 이 데이터에는 인허가일자와 인허가취소일자, 폐업일자, 휴업 시작·종료일자, 재개업일자, 영업상태코드 및 영업상태명, 상세영업상태코드·명 등 인허가 및 영업 상태 변동을 나타내는 항목들이 포함되어 있어 각 업체의 영업 개시, 휴·폐업, 재개업 등의 이력을 시간의 흐름에 따라 추적할 수 있습니다. 또한 사업장명, 전화번호, 소재지면적, 지번주소와 도로명주소, 우편번호, 좌표정보(X·Y) 등을 통해 사업장의 위치, 규모, 접근성, 연락처 등 기본적인 공간·연락 정보를 파악할 수 있습니다. 업태구분명은 해당 사업장이 어떤 업종 형태로 분류되는지를 보여주며, 취급제품명 항목을 통해 각 업체가 수입·판매하는 담배 제품의 종류를 확인할 수 있고, 담배공급업체명 항목은 해당 담배수입판매업체에 제품을 공급하는 상위 공급업체 정보를 제공하여 유통 구조를 파악하는 데 활용될 수 있습니다. 아울러 최종수정일자, 데이터갱신구분, 데이터갱신일자 등의 항목을 통해 데이터의 최신성과 관리 이력을 확인할 수 있어, 이 인허가 정보는 서울시 내 담배수입판매업체의 분포, 규모, 영업 상태 및 제품·공급망 현황을 분석하고, 담배 유통 관리와 금연·보건 정책, 관련 행정 지도·감독에 활용하기에 적합한 기초 자료입니다.
