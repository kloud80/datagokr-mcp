summary_user: 시행일자를 기준으로 법령 목록을 건별로 내려주는 법제처 외부 API로, 법령명·공포번호·공포일자·시행일자·제개정구분·소관부처 등을 담고 범위는 전국이다. 특정 시행일에 효력이 생긴 법령이 무엇인지, 어떤 법령이 개정됐는지 확인하려는 분석가나 업무 담당자가 쓴다. 법령ID와 법령일련번호가 필드에 있어 같은 법제처 법령 본문·상세 조회와 이어 쓰며, 다른 기관 데이터와 바로 맞는 전역 조인 키는 없어 이름이나 코드 매핑이 필요하다.
limits: open.law.go.kr 인증키(query 파라미터 OC)가 필요하며 포털 활용신청과는 별개다. 실측 컬럼에서 전역 조인 키를 찾지 못해 타 기관 데이터와의 연결은 이름·코드 매핑이나 같은 기관 코드에 한정된다. 법령 내용 자체가 아니라 목록과 변경 감지용 원장이므로 조문 본문은 별도 조회가 필요하다.
