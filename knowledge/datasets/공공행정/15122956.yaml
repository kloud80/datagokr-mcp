summary_user: 경기통계시스템에 등록된 기관·부서를 조직 한 건씩 담은 목록으로, 조직번호·상위조직번호·조직명과 부서 여부, 통계 작성 여부, 표준통계 작성기관 여부를 담는다. 분석가나 행정 담당자가 '경기도에서 통계를 작성하는 기관과 부서가 어디이고, 어느 상위조직에 속하는가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 조직번호(orgnzt_no)와 상위조직번호를 이어 조직 위계를 재구성하는 내부 연결만 가능하며, 다른 데이터와는 조직명 매핑으로만 붙인다.
description_portal: 이 데이터는 경기도 경기통계시스템에 등록된 기관 및 부서 정보를 담고 있으며, 각 조직의 고유번호, 상위조직번호, 부서 여부, 조직명, 통계 작성 여부, 표준통계 작성기관 여부 등의 항목으로 구성되어 있습니다. ‘조직번호’와 ‘상위조직번호’를 통해 기관 간 위계 관계를 파악할 수 있고, ‘부서여부’는 해당 항목이 실제 행정부서인지 여부를 구분합니다. 또한 ‘통계작성여부’ 및 ‘표준통계작성기관여부’ 항목은 통계자료를 생산하는 역할을 하는 기관 여부를 명시하여, 통계 생산 기관의 범위와 역할을 확인하는 데 활용됩니다. 이 데이터는 경기도 내 행정조직 구조를 분석하거나, 통계작성기관을 파악하여 정책기획, 행정자료 수집의 기초자료로 활용될 수 있습니다.
