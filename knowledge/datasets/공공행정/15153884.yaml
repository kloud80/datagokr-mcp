description_portal: 서울특별시에서 제정한 조례 및 규칙의 공식 영문 번역본을 제공하는 공공데이터로, 외국인 주민, 해외 투자자, 국제 협력 기관, 학술 연구자 등 국내외 다양한 이용자가 서울시의 법령 체계를 이해할 수 있도록 돕기 위해 제작되었습니다. 데이터에는 조례 및 규칙의 영문 제목, 공포일자, 공포번호, 제·개정 여부 등의 주요 행정 정보가 포함되어 있어, 서울시의 입법 현황을 영문으로 체계적으로 파악할 수 있습니다. 특히 서울시와의 국제적 협력이나 외국인의 민원 처리, 행정 참여에 있어 신뢰성 있는 자료로 활용될 수 있으며, 글로벌 도시 서울의 행정 투명성과 접근성 향상에 기여하고 있습니다.
