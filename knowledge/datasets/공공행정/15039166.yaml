description_portal: 경기도 수원시는 「행정규제기본법」에 따른 규제등록제도를 운영하고 있으며, 이를 통해 시에서 시행 중인 다양한 행정규제 사무를 한눈에 확인할 수 있도록 관리하고 있습니다. 행정규제 등록정보에는 규제의 적용 부문과 유형, 세부유형을 비롯해 규제를 등록하게 된 이유와 규제사무명, 관련 상위법령과 자치법규, 규제 시행일, 사무의 특성, 소관 중앙부처, 담당 부서 등 필요한 세부 정보가 함께 포함되어 있습니다.현재 수원시가 등록해 관리하고 있는 행정규제는 총 242건이며, 이러한 정보는 시민과 기업이 규제 현황을 보다 쉽게 이해하고 활용하는 데 도움이 되고 있습니다.
