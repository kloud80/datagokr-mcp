summary_user: 방문판매사업자의 법 위반 정보를 사업자 건별로 담은 전국 단위 API로, 상호명·사업자유형·주소와 위반항목 및 상세내용, 업체 소명, 시정조치 내용, 담당부서, 대상반기(전반기·후반기)를 제공한다. 소비자가 방문판매 업체와 거래하기 전에 "이 업체가 위반으로 시정조치를 받은 적이 있나"를 확인하거나, 분석가가 반기별 위반 유형과 조치 현황을 살펴보는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 방문판매·다단계 등 다른 특수판매 등록 데이터와는 상호명·주소 매칭으로만 이어 쓴다.
limits: 사업자등록번호·법인등록번호가 응답에 없어 다른 공정위 등록 데이터와 정확히 연결할 수 없고, 상호명 매칭은 동명 업체 오인 위험이 있다. 이용에는 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
