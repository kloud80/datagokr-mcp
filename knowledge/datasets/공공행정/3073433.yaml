description_portal: '경로이동 : 경제일반·경기→  전국사업체조사 → 등록기반 →10차 개정광주광역시 내 종사자 1인 이상 모든 사업체의 구조와 분포, 경영실태 등에 관한 사항을 종합적으로 파악하여 경제정책 수립과 기업의 경영계획 수립 및 평가의 기초자료 제공또한, 각종 정책수립과 민간기업체의 기업경영계획 수립, 학계, 연구소 등의 학술연구를 위한 기초자를 제공한다. 사업체를 대상으로하는 각종 통계조사의 모집단을 파악하며, 표본틀을 제공하는데 목적이 있다. 조사기준일 또는 조사일 현재 우리 시에서 산업활동을 수행하고 있는 모든 사업체를 조사대상으로 한다.사업체명, 사업장 대표자, 소재지, 창설년월, 사업자 등록번호, 조직형태, 사업의 종류, 종사자 수, 연간 매출액을 조사한다.'
