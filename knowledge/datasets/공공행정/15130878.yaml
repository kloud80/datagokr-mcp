summary_user: 경기민원24 검색창의 자동완성에 쓰이는 검색어 목록으로, 검색어 한 건마다 일련번호, 검색 단어, 사용 여부, 생성·수정 일시와 작성자 번호를 담는 운영 원장이다. 경기도 민원 서비스 담당자나 분석가가 "민원 검색창에 어떤 키워드가 자동완성 후보로 등록되어 있고 언제 추가·수정됐는가"를 확인할 때 쓴다. 다른 데이터와 맞물릴 전역 조인 키는 없어서, 검색 단어(srch_word_cont)를 민원 사무명 같은 이름과 텍스트로 대조하는 식으로만 이어 쓴다.
description_portal: 경기도 경기민원 검색어 자동 완성 기능 데이터는 경기민원24 시스템에서 사용자가 검색창에 입력하는 단어를 기반으로 관련 검색어를 자동으로 제안하는 기능과 관련된 정보를 담고 있습니다. 데이터에는 자동완성 일련번호, 검색 단어 내용, 사용 여부, 생성 및 수정 이력 등이 포함되어 있으며, 이러한 자동 완성 기능은 사용자가 민원 관련 키워드를 빠르고 편리하게 찾을 수 있도록 지원합니다. 또한 행정기관은 이를 통해 어떤 키워드가 많이 활용되는지를 분석하여 서비스 품질을 개선하고, 필요한 경우 정책 홍보나 행정서비스 접근성을 강화하는 근거 자료로 활용할 수 있습니다.
