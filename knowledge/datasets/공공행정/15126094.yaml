summary_user: 국회에 접수된 의안을 건별로 담으며, 대수(ERACO)·의안번호·의안명·의안 종류·제안자 구분·제안일·처리 결과·상세 링크를 한 행에 둔다. 법안 동향을 보는 시민·기자·입법 분석가가 "이번 대수에 접수된 특정 분야 법률안이 무엇이고 처리됐는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국회 의안 데이터와는 의안 ID·의안번호 같은 같은 기관 코드나 의안명 매칭으로만 잇는다.
