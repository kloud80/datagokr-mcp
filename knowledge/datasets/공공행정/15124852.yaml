description_portal: 한국남부발전(주)의 연도별 지역인재 채용현황을 기록한 자료입니다. 총 신규채용 인원과 그중 비수도권 지역인재, 이전지역(기관 본사가 이전된 지역) 인재의 채용 인원이 함께 제공됩니다. 예를 들어 2019년에는 총 268.5명의 신규채용 중 183.75명이 비수도권 지역인재였으며, 이 중 103명은 이전지역 출신입니다. 이 데이터를 통해 공공기관이 지역균형발전을 위해 얼마나 지역 인재를 채용하고 있는지를 한눈에 파악할 수 있으며, 정부의 지역인재 채용 정책 이행 여부를 평가하는 데에도 유용합니다. 시민, 연구자, 취업준비생 모두가 공공기관의 채용 경향과 지역 사회 기여 정도를 쉽게 이해할 수 있는 자료로, 지역청년 일자리 창출과 관련 정책 수립에도 중요한 참고자료가 됩니다.
