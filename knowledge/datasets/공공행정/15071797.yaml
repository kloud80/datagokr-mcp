summary_user: 서울 지역 체육도장업 사업장을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소일자, 영업상태와 휴업·폐업 이력, 주소·좌표, 업종명, 공·사립 구분, 지도자 수, 회원 모집 총인원, 보험가입 여부, 건축물 연면적 등을 포함한다. 창업 예정자나 상권 분석가가 '우리 동네에 영업 중인 태권도·유도 등 체육도장이 몇 곳이고 최근 폐업이 늘었는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 원천이 같은 LOCALDATA 인허가 자료와 함께 상권·점포 이력 분석에 쓴다.
description_portal: 서울시 체육도장업 인허가 정보는 서울 지역에서 운영되는 체육도장업체의 인허가 현황과 영업 상태를 체계적으로 확인할 수 있는 공공데이터입니다. 이 데이터는 업체의 인허가일자, 취소일자, 휴업·폐업·재개업 이력 등 행정적 변동 사항을 상세히 제공하여 체육시설의 운영 상황을 명확하게 파악할 수 있습니다. 또한 주소, 우편번호, 전화번호, 면적, 좌표 등 사업장의 위치와 규모 정보를 포함하여 실제 시설 환경을 이해하는 데 도움이 됩니다. 체육 관련 업종명, 공·사립 구분, 지도자 수, 회원 모집 총인원 등 체육도장업 특성을 반영한 정보도 제공되어 시설의 운영 규모와 성격을 분석하는 데 유용합니다. 더불어 보험가입 여부, 건축물 동수 및 연면적, 법인명 등 안전성·시설 구조·운영 주체와 관련된 세부 정보까지 포함하고 있어 행정 관리, 체육시설 안전 점검, 지역 체육 인프라 분석 등 다양한 분야에서 활용 가치가 높은 자료입니다.
