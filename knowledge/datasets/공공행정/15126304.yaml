summary_user: 공정거래위원회에 등록된 방문판매사업자의 변경 내역을 사업자 한 곳 단위로 담는 API로, 전국 1,411건이며 기간은 1996-01-01부터 2023-12-08까지다. 소비자나 거래 상대방이 변경일자 범위를 정해 "이 방문판매업자의 영업상태·폐업 여부·소재지가 바뀌었나" 같은 질문을 확인할 때 쓴다. 법인등록번호(crno)와 사업자등록번호(brno), 주소(lctnAddr·rnAddr)를 키로 같은 공정위의 통신판매·다단계·후원방문·전화권유 등 특수판매 등록 데이터와 이어 쓴다.
description_portal: 이  API는 공저거래위원회에서 제공하는 방문판매사업자 등록변경현황 제공 서비스 입니다. 변경일자(from~to)를 조회조건으로 해당 날짜 범위에서 변경이 발생한 방문판매사업자의 변경내역을 조회 합니다. 시도명, 인허가관리번호, 시군구명, 영업상태명, 법인여부, 상호, 법인등록번호, 사업자등록번호, 사업게시일자, 전화번호, 팩스번호, 사업장소재지, 자산금액, 부채금액, 자본금, 폐업일자, 휴폐업사유, 신고일자, 도로명주소, 관리부서전화번호, 대표자명, 대표자전자우편, 자료변경구분코드, 처리부서명 등의 데이터를 제공 합니다.
