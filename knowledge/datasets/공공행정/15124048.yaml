summary_user: 한국지역난방공사의 열공급시설·난방지역별로 시간 단위 열 공급실적(공급유량·공급열량, 공급·회수 압력과 온도)을 담은 건별 시계열 파일이며, 포털 설명상 2023년 3월~7월 구간만 제공한다. 분석가가 '여의도 같은 특정 난방지역에 시간대별로 열이 얼마나 공급됐고 기온과 어떤 관계가 있나'를 따져 수요 추이 분석이나 예측 모델을 만드는 데 쓴다. 열공급시설ID(heat_facility_id)와 난방지역ID(heating_area_id)를 키로 같은 기관의 시설·지역 자료와 잇고, 일자·시간을 기준으로 기상 실측 자료와 맞춰 쓴다.
