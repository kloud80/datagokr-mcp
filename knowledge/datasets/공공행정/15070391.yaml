summary_user: 통계청 나라통계시스템 모집공고 메뉴에 올라온 통계조사원 채용 게시물을 공고 한 건당 한 행으로 담은 원천 파일로, 포털 설명 기준 총 1,338건이며 제목·게시일자·공고 상태·조회수·채용 구분(도급/기간제) 등을 포함한다. 통계조사원 채용이 연도별로 몇 건이었는지, 도급과 기간제 비중이 어떻게 바뀌었는지를 알아보려는 분석가나 구직자가 쓴다. 이어 쓰는 키는 조사원채용공고번호(앞 4자리가 연도)이며, 원채용공고번호로 재공고와 원공고를 잇는 정도이고 다른 데이터셋과 맞출 공통 코드나 지역 키는 없다.
