summary_user: 전국 지방자치단체별로 각 자치단체 홈페이지에 공개된 세입세출 예산서 페이지의 링크(URL) 정보를 회계연도·자치단체 단위로 담는다. 주민이나 분석가가 "우리 구 올해 예산서 원문은 어디서 보나"를 찾을 때 해당 자치단체 예산서 공개 페이지로 바로 가는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 자치단체 코드(laf_cd)나 자치단체명을 지방재정365의 다른 공시 데이터와 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 지방자치단체의 세입세출예산에 대한 예산서 정보공개는 지방재정의 투명성, 책임성, 주민참여를 높이기 위한 제도로 법적근거에 따라 정기적으로 공개되고 있습니다. 지방재정법 제60조(재정정보의 공개) 및 지방재정법 시행령 제68조에 따라 공개하고 있으며, 개별자치단체의 홈페이지에 공개되고 있습니다.우리 지자체 예산서 정보는 자치단체 홈페이지를 통해 공개되고 있는 자치단체별 예산서 공개 페이지 링크정보를 제공하고 있습니다. 세부 제공항목은 자체단체별 예산서 url 항목입니다.
