description_portal: '[SGIS오픈플랫폼] 성씨분포 서비스에서 제공하는 시군구별 인구 정보입니다.기준년도는 1985년, 2000년, 2015년입니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 성씨분포  우리나라의 성씨와 주요 본관에 대해서 지역별로 인구비율 및 과거로부터의 변화를 비교해볼 수 있는 서비스'
