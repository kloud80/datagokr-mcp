summary_user: SGIS 성씨분포 서비스의 시군구별 인구수를 1985년·2000년·2015년 기준년도별로 담은 전국 단위 집계 파일(CSV, 약 25KB)이다. 분석가가 특정 성씨·본관의 지역별 인구비율을 계산할 때 분모가 되는 시군구 총인구를 확인하거나, 세 시점 사이 시군구 인구 변화를 비교하는 데 쓴다. 전역 조인 키는 없어 같은 성씨분포 서비스의 시군구코드(성씨분포시군구코드)로 성씨분포 데이터와 잇거나, 시도명·시군구명 이름 매칭으로 다른 행정구역 자료와 연결한다.
limits: 표준 행정구역코드와 바로 맞물리는 조인 키가 확인되지 않아, 다른 통계와 결합할 때는 이름 매핑이 필요하고 1985년 이후 시군구 개편분을 따로 맞춰야 한다. 이 파일만으로는 성씨별 인구를 알 수 없고 기준년도 세 시점 외의 연도도 없다.
