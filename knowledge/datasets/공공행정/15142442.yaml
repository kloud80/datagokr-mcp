description_portal: 광주경찰청은 관할 지역 내에서 발생하는 외국인 관련 범죄 사건에 대한 통계를 수시로 제공하고 있습니다. 제공되는 통계는 살인, 성폭력, 절도, 마약, 지능범죄, 교통사고 등 다양한 범죄 유형을 포함하며, 이를 통해 외국인 범죄에 대한 체계적인 분석과 대응이 가능하도록 지원합니다. 이러한 통계는 외국인 밀집 지역의 치안 대책 수립, 범죄 예방 활동, 정책 개발 등에 활용되며, 지역 사회의 안전을 확보하고 외국인 주민과의 공존을 위한 기반 자료로도 사용됩니다. 광주경찰청은 이를 통해 투명하고 신뢰받는 치안 서비스를 실현하고자 노력하고 있습니다.
