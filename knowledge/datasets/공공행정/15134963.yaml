description_portal: 본 데이터는 충청남도 위치기반 증강현실(AR) 플랫폼에서 활용되는 용도별 비율 현황 정보로, 지역별 지역명, 해당 지역에 적용되는 용도명, 그리고 각 용도에 대한 용도별 비율 데이터를 포함하고 있습니다. 용도구분에는 일반공업지역, 준공업지역, 보전녹지지역 등 도시계획 및 국토이용 관리 체계에 따른 다양한 용도지역이 반영되어 있으며, 이를 통해 지역 내 토지 이용 구조와 공간적 특성을 비율로 정량화하여 파악할 수 있습니다. 본 데이터는 AR 기반 시각화 서비스를 통해 이용자가 특정 지역의 토지 이용 현황을 직관적으로 확인할 수 있도록 지원하며, 도시계획 분석, 산업·환경 정책 수립, 개발 가능성 검토, 생활·관광 정보 서비스 등 다양한 스마트 행정 및 민간 활용 분야에서 기초 자료로 활용됩니다.
