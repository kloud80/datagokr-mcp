description_portal: '광주광역시 반려동물 등록 현황 관련규정: 제12조(등록대상동물의 등록 등)① 등록대상동물의 소유자는 동물의 보호와 유실·유기방지 등을 위하여 시장·군수·구청장(자치구의 구청장을 말한다. 이하 같다)·특별자치시장(이하 "시장·군수·구청장"이라 한다)에게 등록대상동물을 등록하여야 한다. 다만, 등록대상동물이 맹견이 아닌 경우로서 농림축산식품부령으로 정하는 바에 따라 시·도의 조례로 정하는 지역에서는 그러하지 아니하다.② 제1항에 따라 등록된 등록대상동물의 소유자는 다음 각 호의 어느 하나에 해당하는 경우에는 해당 각 호의 구분에 따른 기간에 시장·군수·구청장에게 신고하여야 한다. [개정 2013.3.23 제11690호(정부조직법), 2017.3.21] [[시행일 2018.3.22]]1. 등록대상동물을 잃어버린 경우에는 등록대상동물을 잃어버린 날부터 10일 이내2. 등록대상동물에 대하여 농림축산식품부령으로 정하는 사항이 변경된 경우에는 변경 사유 발생일부터 30일 이내③ 제1항에 따른 등록대상동물의 소유권을 이전받은 자 중 제1항에 따른 등록을 실시하는 지역에 거주하는 자는 그 사실을 소유권을 이전받은 날부터 30일 이내에 자신의 주소지를 관할하는 시장·군수·구청장에게 신고하여야 한다.④ 시장·군수·구청장은 농림축산식품부령으로 정하는 자로 하여금 제1항부터 제3항까지의 규정에 따른 업무를 대행하게 할 수 있다. 이 경우 그에 따른 수수료를 지급할 수 있다. [개정 2013.3.23 제11690호(정부조직법)]⑤ 등록대상동물의 등록 사항 및 방법·절차, 변경신고 절차 등에 관한 사항은 농림축산식품부령으로 정하며, 그 밖에 등록에 필요한 사항은 시·도의 조례로 정한다. [개정 2013.3.23 제11690호(정부조직법)] - 2025년도 1월 30일기준 광주광역시 반려동물 등록 현황에 대한 데이터로 시도, 시군구, 읍면동, 동물등록두수 등의 정보를 제공합니다.'
