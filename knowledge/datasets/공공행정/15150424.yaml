summary_user: 경기도 통합홈페이지에 게시된 경비 집행내역을 집행 건별로 담으며, 집행 목적, 사용처, 대상자(부서명 또는 참여 인원), 금액과 등록·수정·삭제 이력을 함께 기록한다. 도민이나 감시·분석가가 '경기도가 어떤 목적으로 어디에 얼마를 썼는가'를 확인하거나 지출 유형을 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사용처·부서 이름 매핑이나 같은 기관 기준으로만 이어 쓰며, 게시판번호·게시물번호(board_no, post_no)는 홈페이지 게시물과의 연결에만 쓰인다.
description_portal: 이 데이터는 경기도 통합홈페이지에 게시된 각종 집행내역 정보를 포함하고 있으며, 공공기관의 경비 지출 투명성을 확보하기 위해 제공됩니다. 각 집행 항목은 일련번호, 게시판번호, 게시물번호와 연계되어 있으며, 집행 목적(집행내역), 사용처, 대상자, 금액 등의 세부 정보를 포함합니다. 집행 대상자는 부서명 또는 참여 인원 정보로 표기되며, 등록일자와 수정일자, 삭제여부 및 삭제자 항목 등을 통해 집행 이력 관리가 가능합니다. 금액 항목을 통해 개별 지출 내역을 확인할 수 있어 예산 운영의 투명성 검토, 회계 감사, 지출 유형 분석 등 다양한 목적으로 활용될 수 있습니다. 공공기관의 재정 운영 현황을 구체적으로 파악할 수 있습니다.
