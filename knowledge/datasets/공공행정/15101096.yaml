description_portal: '신혼부부통계*는 저출산 및 고령화 등 경제․사회 변화에 대응하기 위하여 신혼부부에 대한 결혼, 출산․보육, 경제활동 및 주거실태 등을 파악하여 정책맞춤형 통계정보 제공합니다. (작성기준일 : 11월 1일 기준)데이터에 포함된 항목은 행정구역별, 신혼부부수, 맞벌이 부부수, 맞벌이 비율, 주택소유 신혼부부수, 주택소유율 등 내용이 포함되어있습니다. * 관련통계 참고: (작성대상) 2023년 11월 1일 기준 혼인신고 한 지 5년이 경과되지 않은 부부 중에서 혼인관계를 유지 중이며, 부부 중 1명이상 국내에 거주하고 있는 부부( 대상기간 : ’18. 11. 1.～ ’23. 10. 31. 기간 내 혼인신고), 제외대상 : 이혼, 사별, 국내미거주 부부 등(범위) 신혼부부(가구), 개인(남편, 아내, 자녀)'
