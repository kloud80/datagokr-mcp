summary_user: 서울시 내 비디오 감상실·멀티방 등 비디오물시청제공업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소·폐업·휴업 일자와 영업상태, 주소·좌표, 층수·시설면적·비상구·방음시설 같은 시설 정보를 함께 담는다. 상권 분석가나 청소년 보호·안전 점검 담당자가 '우리 구에 현재 영업 중인 멀티방은 몇 곳이고 비상구·환기 설비는 갖췄나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 주소·사업장명 매칭이나 같은 기관 관리번호(MGTNO)로만 다른 자료와 잇고, 출처가 LOCALDATA 인허가와 같아 그쪽 업종 원장과 나란히 쓴다.
description_portal: 서울시 비디오물 시청 제공업 인허가 정보는 서울시 내 비디오 감상실·멀티방·영상 시청 제공 업소 등의 인허가 및 영업 현황을 보여주는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 업소가 현재 영업 중인지, 휴업·폐업 상태인지 등의 행정 이력을 확인할 수 있습니다. 사업장명, 전화번호, 지번·도로명주소, 우편번호, 좌표정보, 업태구분명, 문화체육업종명, 문화사업자구분명, 지역구분명은 업소의 위치·유형·사업자 성격을 파악하는 핵심 항목입니다. 총층수, 지상·지하층수, 건물용도명, 통로너비, 시설면적, 주변환경명은 업소가 위치한 건축물의 구조 및 안전·이용환경을 나타내며, 비상계단·비상구·소방시설·자동환기 여부 등은 안전관리와 관련된 필수 정보입니다. 조명시설 유무·조도, 특수조명 여부, 방음시설 여부, 음향·편의시설 여부는 이용 환경과 쾌적성, 건전성 정도를 반영하는 항목입니다. 노래방실수, 청소년실수 및 청소년실 여부, 총 게임기수, 제공게임물명, 기존게임업 외 업종명, 공연장형태구분명 등은 비디오 시청 제공 외에 노래방·게임·공연 등 복합 여가 기능과 청소년 이용 가능성, 업소 성격을 세부적으로 나타냅니다. 제작취급품목내용, 품목명, 비디오재생기명은 제공·취급하는 영상물 및 기기의 특성을 설명하며, 최초등록시점과 최종수정일자, 데이터갱신정보는 업소 등록 및 정보 관리 이력을 보여 줍니다. 전반적으로 이 데이터는 비디오 시청 제공업의 분포, 시설·안전·환경·청소년 보호 및 게임·공연 등 부가 기능 현황을 파악해 문화·여가, 청소년 보호, 안전 관리 정책 수립과 단속·점검 계획에 활용될 수 있는 정보입니다.
