summary_user: 최근 국회 본회의에서 처리된 의안을 의안 1건 단위로 담으며, 의안번호·대수·의안명·제안자와 제안자 구분, 제안일, 소관위원회 회부·상정·처리일과 결과, 법제사법위원회 회부·상정·처리일과 결과, 본회의 처리일과 처리결과를 포함한다. 시민·기자·입법 분석가가 "이번 주 본회의를 통과한 법률안은 무엇이고 각각 위원회 심사를 거쳐 언제 처리됐나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 의안번호(BILL_NO)나 의안명 같은 이름·코드 매핑으로만 잇고, 원문 확인은 함께 제공되는 의안 상세 링크로 한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
