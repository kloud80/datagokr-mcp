summary_user: 국회 의원실에 지급되는 지원경비 현황을 연도(YR)와 1·2·3단계 구분 항목별 지급 집행액·지급 방법으로 정리한 전국 단위 비공간 집계 자료이며, 공개 파일명도 함께 담는다. 국민이나 분석가가 "의원실 지원경비가 연도별로 어떤 항목에 얼마나 집행되었나"를 확인할 때 쓴다. 실측 컬럼에서 의원 코드 같은 전역 조인 키를 찾지 못했으므로 다른 의정활동 데이터와는 연도나 항목 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
