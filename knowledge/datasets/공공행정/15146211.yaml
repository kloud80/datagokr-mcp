summary_user: 서울시 주요 장소별로 현재 혼잡도 단계와 안내 문구, 추정 인구 범위(최소·최대), 성별·연령대 비율, 상주·비상주 인구 비율, 기준 시각(PPLTN_TIME)을 장소 한 곳당 한 행으로 담은 실시간 데이터다(검증 시 15개 장소 15행 수신). 시민이나 행사·상권 분석가가 "지금 광화문·덕수궁이나 특정 명소가 얼마나 붐비고 어떤 연령층이 많은가"를 확인하는 데 쓴다. 연결 키는 서울시 주요 장소 코드(AREA_CD)와 장소명뿐이고 행정구역 코드나 좌표가 없으므로, 다른 데이터와 잇으려면 장소별 좌표나 행정동 매핑을 따로 만들어야 한다.
description_portal: 서울시 실시간 도시데이터는 실시간 인구현황, 도로소통현황, 주차장 현황, 지하철 실시간 도착 현황, 버스정류소 현황, 사고통제현황, 따릉이 현황, 날씨 현황, 전기차충전소 현황, 문화행사 현황 정보를 제공합니다.※ 서울시 주요 120장소에 대하여 인구, 교통, 환경, 문화행사 등 각 분야의 공공·민간 실시간 데이터를 융합한 데이터입니다.※ 서울 주요 120장소 목록은 아래 '서울시 주요 120장소명 목록(코드포함).xlsx' 파일에서 확인 가능합니다.※ 샘플key를 통해서는 주요 120장소 중 '광화문·덕수궁' 지역만 조회 가능합니다. 나머지 지역을 조회하기 위해서는 인증키를 발급받아 주시기 바랍니다.※ 서울시 실시간 도시데이터 API는 한 번에 1개 장소씩만 호출 가능합니다.※ 장소명 OR 장소코드 중 택1 하여 호출이 가능합니다.
