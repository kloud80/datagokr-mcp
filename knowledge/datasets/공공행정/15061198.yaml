summary_user: 지방공사·공단이 지방공기업 통합경영공시(클린아이)에 올린 노동조합 협약정보를 연도·지자체·기관별 게시글 단위로 담는 전국 범위 API이며, 제목·내용과 함께 단체협약·임금협약·보충협약·노사협의회 합의사항 등의 첨부파일이 게시된다. 노무 담당자나 연구자가 특정 지방공사·공단이 어느 해에 어떤 단체협약이나 임금협약을 맺었는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 경영공시 데이터와는 지자체명·기관명을 이름으로 맞춰 이어 써야 한다.
limits: 공통 기관 코드 같은 조인 키가 없어 다른 데이터와 연결할 때 이름 매핑에 의존한다. 대상은 지방공사·공단에 한정되며, 이 데이터셋은 지방행정 부문에서 보조 등급으로 분류되어 있다.
