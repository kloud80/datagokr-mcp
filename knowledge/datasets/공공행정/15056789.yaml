summary_user: 부산 엄궁농산물도매시장에 도매법인별로 반입된 버섯·채소·과일 등 농산물의 물량(kg)과 금액(원)을 품목(대분류·품종)과 주 단위 날짜별로 담는다. 산지 출하자나 유통 분석가가 '이번 주 엄궁시장에 어느 법인으로 어떤 품목이 얼마나 들어왔고 금액은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 도매시장 반입·경락 데이터와는 품목명이나 법인명을 맞추는 이름 매핑으로만 이어 쓴다.
