description_portal: 폐쇄말소대장 총괄표제부는 더 이상 사용되지 않거나 말소된 건축물의 기본 정보를 종합적으로 기록한 자료입니다. 이 데이터에는 해당 건축물의 주소, 지번, 도로명, 토지·건축물 면적, 건폐율, 연면적, 용적률, 주용도 및 기타 용도, 가구 수, 세대 수, 동 수, 부속건축물 수와 면적, 주차대수, 승강기 수 등 주요 건축물 현황이 포함됩니다. 또한 허가일, 착공일, 사용승인일 등 인허가와 관련된 일정, 에너지효율등급, 친환경건축물 인증정보 등도 제공될 수 있습니다. 이를 통해 과거 건축물의 규모, 용도, 시설 구성, 부속설비 현황, 용적률과 건폐율, 주차·편의시설 등을 종합적으로 확인할 수 있어, 도시계획 수립, 재개발·재건축 검토, 건축물 이력 관리, 부동산 평가 등 다양한 분야에서 활용됩니다.
