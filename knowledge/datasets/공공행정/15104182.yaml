summary_user: 충청남도 예산군 관내에 설치된 현수막 지정게시대를 게시대 한 곳당 한 행으로 담은 목록으로, 게시대명·지번주소·게시대 형태·규격·게시면 수를 담는다. 소상공인이나 행사 주최자가 예산군에서 현수막을 합법적으로 걸 수 있는 게시대가 어디에 있고 크기와 면수가 어떤지 확인할 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 지번주소를 주소·좌표 변환으로 맞추거나 같은 기관 데이터끼리 이름으로 연결해야 한다.
