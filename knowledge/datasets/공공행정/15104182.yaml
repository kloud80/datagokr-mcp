description_portal: 예산군 관내 옥외 현수막 지정게시대 목록으로 현수막 지정게시대 명칭, 위치(지번 주소), 사용자재, 규격 등의 항목을 제공합니다.이 데이터는 충청남도 예산군 관내에 설치된 ‘현수막 지정게시대’의 위치 및 현황 정보를 제공하는 공공데이터입니다.공공질서 유지와 무분별한 불법 현수막 부착 방지를 위해 행정기관이 설치·운영하는 시설로,본 데이터에는  게시대명, 지번주소, 게시대 형태, 규격, 게시면  항목이 포함됩니다.이 데이터는  소상공인 등 현수막 설치 수요자들이 현수막 게시 가능 위치를 확인하고 신청할 수 있게 하며,지자체의 옥외광고물 행정 관리  등에도 활용될 수 있습니다.
