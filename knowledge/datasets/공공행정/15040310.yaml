summary_user: 서울 성북구 동주민센터(행정복지센터)를 한 곳당 한 행으로 담은 시설 원장 파일(csv, 약 2KB)로, 명칭·주소·전화번호·주차가능대수·행정동·위도·경도·기준일자를 담는다. 주민은 우리 동 주민센터 위치와 주차 가능 여부를 확인하는 데 쓰고, 분석가는 성북구 내 주민센터 분포와 접근성을 지도에서 평가하는 데 쓴다. 전역 조인 키가 없어 행정동 이름이나 위도·경도 좌표로 다른 시설·인구 데이터와 맞춰 이어 쓴다.
description_portal: '이 데이터는 서울특별시 성북구 내 동주민센터(행정복지센터)의 현황을 제공하는 자료입니다.각 주민센터의 명칭, 주소, 전화번호, 주차가능대수, 행정동명, 위도·경도 좌표, 기준일자(2023년 7월 17일) 등의 정보를 포함하고 있습니다.본 자료를 통해 성북구 내 행정복지센터의 위치, 접근성, 주차시설 규모 등 공공행정 인프라 현황을 파악할 수 있으며,주민행정 서비스의 효율화, 지역기반 행정시설 분포 분석, 공공서비스 개선 연구 등에 활용할 수 있습니다.데이터는 위도·경도 기반의 표준화된 공간정보 구조를 사용하고 있어,GIS 행정지도 제작, 공간 분석, 행정서비스 접근성 평가 등에 유용하며,다른 공공시설 데이터(예: 복지센터, 체육시설 등)와의 결합 분석에도 적합합니다.'
