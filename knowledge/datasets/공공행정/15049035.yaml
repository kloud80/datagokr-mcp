description_portal: 본 데이터는 공공사업 추진 과정에서 토지 소유자와의 협의나 재결 절차로도 해결되지 않은 경우, 소송을 통해 취득한 공공용지의 현황을 사업정보 형태로 제공한다. 소송취득은 법원의 판결에 따라 보상금액과 토지 소유권이 확정되는 절차로, 복잡한 권리 관계나 보상 조건에 대한 분쟁이 장기화될 때 주로 발생한다.본 데이터에는 사업종류, 사업명, 사업시행자, 토지 면적(㎡), 토지 보상금액(원) 등이 포함되며, 각 항목은 실제 소송 결과를 반영한다. 사업종류는 수도사업, 단지개발사업 등으로 구분되고, 토지 면적은 소송 판결을 통해 확보한 부지의 실제 규모를 나타내며, 토지 보상금액은 판결에 의해 확정된 지급 금액을 의미한다.이 데이터는 사업별 소송취득 건수와 규모를 체계적으로 파악할 수 있어 보상 정책 수립, 유사 사례 검토, 법적 분쟁 예방 대책 마련, 자산 관리의 투명성 제고 등 다양한 행정·정책 업무에 활용 가능하다. 또한, 소송취득 비율과 다른 취득 절차(협의취득, 수용재결, 이의재결)와의 비교 분석 자료로도 사용할 수 있다.
