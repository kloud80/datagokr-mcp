summary_user: 경기도 각 부서가 일반지출로 집행한 재정 지출 내역을 지급명령 건별로 담으며, 회계연도·회계구분·부서·세부사업·통계목·지출개요·지출금액·지급명령일자·거래처·계약명·계약방법·사업자등록번호 등이 함께 실린다. 분석가나 시민이 '경기도의 특정 사업에 어느 업체로 얼마가, 어떤 계약방법으로 지출됐는가'처럼 예산 집행 흐름과 거래처를 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부서명·사업명 같은 이름 매칭이나 같은 기관 코드로만 잇는다. 거래처는 사업자등록번호(bizregno)를 기준으로 맞춰 볼 여지가 있다.
description_portal: 이 데이터는 경기도의 각 부서에서 일반지출로 처리된 재정 지출 내역을 보여주며, 예산의 실제 집행 흐름을 확인할 수 있습니다. 회계연도, 회계구분, 관서명, 부서명, 경비구분명, 세부사업명, 통계목명, 지출개요, 지급명령일자, 거래처, 계약명, 계약방법, 사업자등록번호 등의 항목으로 구성되어 있으며, 출연금, 민간위탁금, 위탁사업비 등 다양한 용도의 일반지출이 포함됩니다. 구체적인 지출 목적이 상세히 기술되어 있어 행정의 재정 투명성 확보와 정책 효과 분석, 사업 효율성 진단 등에 유용하게 활용될 수 있습니다.
