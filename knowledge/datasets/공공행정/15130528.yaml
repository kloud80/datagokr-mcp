description_portal: '- 전라남도의회 상임위원회 의정방송 생중계시스템의 의정방송 영상회의록을 조회하실 수 있습니다(상임위원회, 본회의, 특별위원회  등)- 전라남도의회(全羅南道議會)는 전라남도(Jeollanam-do)의 입법·감시 기능을 수행하는 지방의회로, 도민의 권익을 대변하고 도정에 대한 견제와 협력을 동시에 담당합니다.- 의원 정원: 전라남도의회는 총 54석(정확한 의원 수는 선거 구역별 차이 있음)으로 구성되며, 의원은 4년 임기입니다.- 의장단: 의장을 비롯하여 부의장, 상임위원장 등이 있으며, 최근 의장은 김태균 의원입니다.- 상임위원회: 정책·기획, 교육, 농수산, 보건복지, 환경산림, 건설교통 등 분야별 전문 위원회가 활동하며, 도정 예산 승인, 조례 제·개정, 행정사무감사 등의 권한을 갖고 있습니다.'
