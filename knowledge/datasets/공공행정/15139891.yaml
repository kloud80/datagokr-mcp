description_portal: 본 기록물 생산접수 페기현황 데이터는 한국중부발전에서 생성 및 접수한 기록물의 생산 및 폐기 현황을 체계적으로 정리한 자료입니다. 주요 항목은 구분, 연도, 분류, 문서 생산 및 폐기 건수로 구성되어 있으며, 분류의 생산의 경우 1년부터 영구까지 있고,  폐기의 경우 종이 혹은 행정정보데이터 세트로 구성되어있습니다. 이를 통해 각급 공공기관의 기록물 관리 실태를 종합적으로 파악하는데 활용할 수 있습니다. 또한, 보존 기간별로 생산, 접수된 기록물 현황과 폐기 기록물 현황을 상세히 확인할 수 있어, 기록물 관리 정책 수립과 운영에 중요한 자료로 활용될 수 있어 이를 통해 효율적인 기록물 관리와 보존을 도모할 수 있습니다.
