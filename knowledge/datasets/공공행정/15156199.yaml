description_portal: 본 데이터는 광주광역시 남구가 체결한 자매도시, 우호도시의 현황에 대한 데이터로, 각 도시별로 도시명, 결연일자, 도시의 면적(㎡), 인구 수, 자매도시별 할인혜택 등 기본 정보를 포함합니다.  해당 데이터를 통하여  도시 간 관계의 맥락을 이해하는 데 도움이 될 것으로 보이며, 도시별 교류 정책 수립, 교류 확대 방안 마련, 관련 보고서 작성 등의 기초자료로 활용될 수 있습니다. 해당 데이터는 광주광역시 남구청 총무과(☎062-607-3773)에서 제공하며, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. 아울러, 자매도시 할인헤택이 존재하는 경우에만 명시하였으니, 데이터 이용 시 참고 부탁드립니다.
