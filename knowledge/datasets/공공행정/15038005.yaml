summary_user: 부산광역시 기장군의회에 제출된 의안을 한 건씩 담은 원천 목록으로, 대수·의안번호·의안명·의안종류·발의자와 함께 위원회 회부·처리 결과, 본회의 상정·의결 결과, 이송·공포일까지 처리 단계별 날짜를 담는다(CSV 파일 약 136KB). 주민이나 지역 의정 분석가가 "기장군의회에서 특정 대수에 어떤 조례안이 누구 발의로 올라와 원안가결·수정가결 등 어떻게 처리됐는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 지방의회 의안 데이터나 자치법규 공포 자료와는 의안명·공포번호·날짜 같은 이름·값 매칭으로만 이어 쓴다.
limits: 기장군 한 곳의 의안만 담아 다른 시군구 의회와 비교하려면 별도 데이터를 같은 형식으로 맞춰야 하고, 표준 코드나 공통 키가 없어 기계적 결합이 어렵다. 파일 다운로드 방식이라 실시간 조회는 되지 않는다.
