summary_user: 지방공기업별·연도별로 시차출퇴근형·근무시간선택형·집약근무형·재량근무형 유연근무자 수와 그 합계, 현원, 유연근무율을 담은 경영공시 집계 데이터로, 범위는 전국이다. 분석가나 기관 담당자가 "어느 지방공기업의 유연근무율이 높고, 어떤 유형의 유연근무를 주로 쓰는가"를 연도별로 비교할 때 쓴다. 전역 조인 키가 없어 다른 경영공시 자료와는 연도와 기관명(ENT_NAME)을 맞춰 이어 쓴다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이며, 유연근무 현황 자료에는 연도, 기관명, 시차출퇴근형, 근무시간선택형, 집약근무형, 재량근무형, 유연근무자합계, 현원, 유연근무율 지표가 포함됩니다.지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
