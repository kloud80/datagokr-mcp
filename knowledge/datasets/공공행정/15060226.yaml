description_portal: 광주광역시에서 2024년에 추진하는 정보화사업 현황에 대한 데이터는 지역의 디지털 전환과 스마트시티 구축을 목표로 다양한 사업을 포함하고 있습니다. 제공되는 주요 항목은 정보화 사업명, 추진부서, 사업형태, 사업비, 사업유형 등으로, 이를 통해 각 사업의 목적과 세부사항을 명확히 파악할 수 있습니다. 정보화 사업명은 각 프로젝트의 고유 명칭으로, 예를 들어 스마트 교통 시스템 구축이나 공공데이터 개방 플랫폼 개발 등이 포함될 수 있습니다. 추진부서는 사업을 주관하는 광주광역시 내 부서를 나타냅니다. 사업형태는 사업이 공공주도, 민간위탁, 또는 민관협력 방식인지 구분하며, 사업비는 각 사업에 투입되는 예산 규모를 의미합니다. 사업유형은 정책지원, 구축(또는 고도화), 위탁운영, 운영(유지관리), 장비구입으로 세분화되어 보여줍니다. 이 데이터는 광주광역시의 정보화 정책 방향과 예산 배분 현황을 투명하게 공개하여 시민들의 이해를 돕고, 지역 정보화 사업의 효율적 추진과 성과 관리를 지원하는 데 목적이 있습니다.
