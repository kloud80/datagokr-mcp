description_portal: 대구광역시 건설기계 등록 현황 중 건설기계대여사업자가 보유한 건설기계에 대한 주요 정보를 제공하는 공공데이터입니다. 건설기계명, 건설기계형식 및 최초 등록일에 관한 데이터로서 국토교통부의 스마트 건설 활성화를 위한 노력의 일환으로 스마트 건설(스마트 건설이란 첨단기술을 중심으로 건설작업을 더욱 효율적으로 수행하고 안전성과 품질을 높이는 것을 목적으로 하는 건설기술임)이 적용되는 건설현장에 정보통신기술(ICT)을 접목하고 건설현장의 자동화와 로봇화 추진 및 3D 모델링, 가상현실(VR) 등의 기술개발 연구의 일환으로 건설기계대여사업자와 연계하여 건설기계를 건설현장에 자동으로 부를 수 있는 서비스를 개발하기 위해 제공된 데이터입니다.
