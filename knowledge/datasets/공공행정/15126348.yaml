summary_user: 전국 선불식할부거래업(상조) 등록 사업자 414곳을 사업자 한 곳당 한 행으로 담은 등록 원천 목록이며, 등록일자는 2010-05-05부터 2026-03-25까지다. 소비자가 가입하려는 상조회사가 공정위에 등록돼 있고 지금도 영업 중인지(운영상태) 확인할 때 쓰며, 대표자·소재지·영업소 주소도 함께 본다. 사업자등록번호(brno)와 법인등록번호(crno)로 가맹사업·특수판매·기업집단 등 다른 공정위 등록 데이터나 사업자 정보와 잇고, 소재지·영업소 주소로 지역 단위 데이터와 연결한다.
description_portal: 이  API는 공정거래위원회에서 소비자에게 선불식할부거래업사업자 현황을 제공하는   공정거래위원회_선불식할부거래업사업자 등록현황 제공 서비스 입니다.  사업자등록번호, 상호명, 운영상태, 허가일자, 영업소, 인허가관리번호 등의 조회 조건으로  개방일련번호, 선불식할부거래업등록일자, 인허가관리번호, 사업자명, 법인등록번호, 사업자등록번호, 소재지주소, 법인이메일주소, 대표자명, 운영상태코드명, 영업소소재지주소 등 선불식할부거래업사업자의 등록 현황을 조회 합니다.
team:
  dept: 정보화담당관실
