summary_user: 국회 상임·특별위원회별로 소속 위원 한 명씩, 위원회명·위원장·간사 같은 직책, 한글·한자 이름, 정당, 선거구, 사무실 전화·이메일·호실, 보좌진 이름을 담은 명단 데이터이며 범위는 전국·비공간이다. 시민이나 기자가 "이 법안을 다루는 위원회에는 어느 정당 의원이 누구누구 있고 위원장은 누구인가"를 확인할 때 쓴다. 전역 조인 키가 없어서 의원 인적사항·표결·의안 데이터와는 의원 이름이나 위원회명을 맞춰서만 연결한다.
