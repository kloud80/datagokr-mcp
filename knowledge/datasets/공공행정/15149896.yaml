description_portal: 서울특별시 서초구에서 제공하는 장애인 편의시설 데이터는 장애인과 교통약자의 시설 접근성을 확인할 수 있는 정보를 포함하고 있습니다. 시설물 구분은 장애인용 주차장, 장애인 화장실,  장애인용 승강기, 휠체어 충전소를 시설물명, 소재지 주소, 행정동  등으로 나누어져 구성되어 있습니다. 이러한 데이터는 장애인뿐만 아니라, 장애인 가족과 교통약자에게도 유용한 생활정보라고 할 수 있습니다.또한, 데이터에 포함된 시설은 무장애가게로 장애인, 고령자, 유아동반 가족등 누구나 편리하게 이용할수 있는 가게라고 보시면 될것 같습니다.이 정보를 바탕으로 이동의 불안감 감소, 불필요한 우회를 하거나 대기 시간이 감소할것입니다.데이터를 통해 장애인과 장애인 가족은 서초구 내에 설치된 편의시설 위치와 접근성 수준을 객관적으로 파악할 수 있습니다.
