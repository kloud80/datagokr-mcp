description_portal: '장애인표준사업장(장애인 고용 의무를 충족한 인증된 사업장)으로부터 구매한 생산품의 세부 내역을 정리한 자료다.장애인 일자리 확대 및 자립 지원을 위한 공공구매 실적 확인에 활용되며, 거래처별 구매금액, 품목, 일자 정보를 제공하여 연도별·기관별 성과 분석이 가능하다.활용 목적 및 특징– 공공기관의 장애인표준사업장 생산품 우선구매 실적 관리– 장애인고용촉진 및 직업재활 정책 효과 분석에 활용– 기관별 예산 집행 내역의 투명성 확보 및 평가 자료로 활용– 예산 편성 및 의무구매율 달성 여부 점검 가능주요 항목 설명● 연번: 각 구매 건의 고유 번호● 구매일자: 생산품을 구매한 날짜● 구매내역: 구매한 물품명 또는 용역 내역● 거래처명: 해당 생산품을 납품한 장애인표준사업장 명칭● 구매금액: 각 구매에 투입된 금액(단위: 원)'
