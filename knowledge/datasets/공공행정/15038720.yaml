description_portal: 인천광역시 중구 특정토양오염 관리대상시설에 관한 정보입니다. 특정토양오염 관리대상시설 현황 데이터는 토양환경보전법 제12조에 따라 토양오염 우려가 큰 시설을 대상으로 자자체가 관리하는 정보를 수록한 자료입니다. 주유소, 유류저장시설 등이 해당되며 각 시설의 명칭, 주소, 업종의 내용을 포함합니다. 이 데이터는 지역 내 토양오염 위험요소를 파악하고, 환경정책 수립 및 토양보전대책 마련에 활용될 수 있으며, 시민들에게도 생활 주변의 환경위험 요소를 인식시키는 데 기여합니다. 또한 타 기관의 토양조사, 환경영향평가, 개발사업 사전검토 등에 기초자료로 제공될 수 있는 공공성이 높은 환경정보입니다.
