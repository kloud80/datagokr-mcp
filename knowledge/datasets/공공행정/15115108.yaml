summary_user: 서울 강남구에서 인터넷컴퓨터게임시설제공업(PC방)과 다른 영업을 한 장소에서 함께 하는 복합유통게임제공업 업소를 업소별 한 행으로 담은 인허가 원장으로, 인허가·취소·폐업·휴업 일자, 영업상태, 주소, 좌표, 시설 면적과 층수 같은 시설 정보를 포함한다. 상권 분석가나 창업 예정자가 강남구 안에서 복합게임업소가 언제 얼마나 문을 열고 닫았는지, 지금 영업 중인 업소는 어디에 있는지를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, LOCALDATA 인허가 자료와 원천을 공유한다.
