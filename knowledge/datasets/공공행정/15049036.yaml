description_portal: 본 데이터는 공공용지의 환매와 대토보상 현황을 확인할 수 있도록 하며 각 사업정보를 기반으로, 사업종류별 환매건수, 환매면적, 환매금액과 대토보상 취득면적, 대토보상금액을 포함한다. 환매는 당초 보상 후 토지가 다시 소유자에게 반환되는 경우를 의미하며 대토보상은 현금 대신 다른 토지로 보상하는 간접보상 방식이다. 이를 통해 보상 후 공공용지의 활용 실태와 보상 이행 과정을 체계적으로 파악할 수 있다.데이터는 사업종류, 사업명, 사업시행자, 당초 보상 면적 및 보상금액, 환매 관련 면적·보상금액, 대토보상 취득면적·보상금액 항목으로 구성된다. 사업별로 정리된 자료를 활용하면 공공기관의 보상 현황, 간접보상 규모, 환매 발생 상황 등을 비교·분석할 수 있다.이 데이터는 보상 및 환매 절차의 투명성을 높이고, 관련 정책 수립, 연구, 사업 계획 수립 등 다양한 분야에서 참고자료로 사용할 수 있다.
