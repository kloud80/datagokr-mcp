summary_user: 서울시 외국인전용유흥음식점업 업소를 한 건씩 담은 인허가 원장으로, 업소별 인허가·취소·폐업일자, 영업상태, 지번·도로명주소와 좌표, 객실·좌석수와 시설면적, 보험기관 등 시설·안전 정보를 담는다. 상권 분석가나 행정 담당자가 '서울에서 현재 영업 중인 외국인전용 유흥음식점은 어디에 몇 곳이며 언제 문을 열고 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 사업장명 매칭, 또는 같은 기관 코드(OPNSFTEAMCODE)로 잇는다. LOCALDATA 인허가 데이터와 원천이 같아 다른 인허가 업종 원장과 함께 업소 이력 분석에 쓴다.
description_portal: 서울시 외국인전용유흥음식점업 인허가 정보는 외국인을 주된 대상으로 하는 유흥·접객 음식점의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소일자, 폐업·휴업·재개업일자와 영업상태·상세영업상태를 통해 업소의 행정 이력과 현재 영업 여부를 파악할 수 있습니다. 지번·도로명주소, 우편번호, 좌표, 사업장명, 전화번호, 소재지면적 등은 위치와 기본 시설 정보를 제공합니다. 문화체육업종명, 문화사업자구분명, 지역구분명, 주변환경명, 건물용도명, 층수·객실수·좌석수, 시설면적·건축연면적, 놀이·방송·발전·의무실·안내소 등 부대시설 정보는 관광·유흥시설의 성격과 규모, 안전·편의 수준을 보여줍니다. 보험기관명, 각종 보험 시작·종료일자, 자본금, 기획여행보험 정보 등은 재정·보험·안전 관리 상태 분석에 활용되며, 영문상호명·영문주소, 선박 관련 항목 등은 외국인 대상 서비스 특성과 특수 형태 업소(선박 이용 등) 파악에 도움을 줍니다.
