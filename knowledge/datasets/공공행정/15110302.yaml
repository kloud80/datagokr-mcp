summary_user: 공정거래위원회가 제공하는 가맹사업 지역별·업종별 평균 매출액 집계 API로, 연도·업종 중분류·지역 단위로 가맹점 수(frcsCnt)와 면적단위 평균매출금액을 담고 전국 범위에 API 전체 374건이다. 창업 예정자나 분석가가 특정 업종이 지역별로 평균 매출이 어느 수준인지 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명·업종명 매핑이나 같은 기관 코드로만 잇고, 사업자등록번호·법인등록번호로 묶이는 공정위 가맹 정보공개서 계열과는 집계 단위가 달라 건별 연결이 되지 않는다.
description_portal: 이 API는 공정거래위원회에서 제공하는 년도, 업종 대분류코드를 이용하여 지역별 업종별 평균 매출액 현황에 대한 지역명, 면적단위평균매출금액, 평균매출금액 등의 정보를 조회할 수 있는 가맹정보_지역별 업종별 평균 매출액 현황 제공 서비스 입니다.
