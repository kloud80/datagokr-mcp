description_portal: 이 데이터는 강원특별자치도 원주시 관내 「기계설비법」 제19조에 따라 유지관리자 선임신고가 필요한 건축물의 현황을 정리한 자료입니다. 해당 건축물의 명칭, 주소, 연면적, 용도, 사용승인일 등이 포함되어 있으며, 주로 연면적이 크고 기계설비가 설치된 판매시설·교육연구시설·공장·공동주택 등으로 구성되어 있습니다.본 자료는 건축물 기계설비 유지관리 정책 수립, 의무관리 대상 시설 모니터링, 설비안전 점검계획 수립, 시설물 위험도 분포 분석 등에 활용될 수 있으며, 민간에서는 시설 유지관리 서비스 대상 파악, 건축설비분야 시장 분석, 에너지 성능개선 대상 발굴 등에서 실효성 있는 기초자료로 활용될 수 있습니다.
