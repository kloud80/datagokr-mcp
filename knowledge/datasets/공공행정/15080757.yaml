summary_user: 주요 온라인 쇼핑몰에서 웹스크래핑으로 자동 수집한 약 120여 개 품목의 상품가격을 일별로 담는 전국 단위·비공간 데이터로, 품목 코드·명칭을 주는 품목리스트조회와 품목 코드·조회 일자로 가격을 주는 가격정보조회 두 오퍼레이션으로 나뉜다. 분석가나 정책 담당자가 "특정 품목의 온라인 판매가격이 최근 몇 주 사이 얼마나 올랐나" 같은 시의성 있는 물가 동향과 가격 추이 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 물가·통계 데이터와는 품목 이름이나 코드를 직접 맞춰야 하고, 내부적으로는 품목리스트의 품목 코드를 가격정보조회의 조회 조건으로 이어 쓴다.
description_portal: 주요 온라인 쇼핑몰에서 거래되는 다양한 온라인 상품의 가격 정보를 웹스크래핑 방식으로 자동 수집하여, 약 120여 개 품목에 대한 상품가격 데이터를 일별로 제공하고 있습니다. 이를 통해 시의성 있는 물가 동향 분석 및 가격 추이 비교 등 다양한 분석 및 정책적 활용이 가능하도록 설계되었습니다. 해당 데이터는 OPEN API 방식으로 제공되며, 통계청_온라인수집가격정보_OPEN-API활용가이드_v2.2 문서를 참고하시기 바랍니다. 전체 품목의 코드와 명칭 정보를 조회할 수 있는 ‘품목리스트조회’ 테이블과, 품목 코드와 조회 일자를 기준으로 가격 정보를 확인할 수 있는 ‘가격정보조회’ 테이블로 구성되어 있습니다.
