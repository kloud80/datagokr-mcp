summary_user: 전국 지방자치단체별로 지역통합재정자금 대비 차입부채 비율을 담은 지방재정365 공시 지표로, 연도(fyr)·자치단체 단위의 두 금액 항목과 비율 값이 들어 있는 집계 데이터입니다. 분석가나 주민이 "우리 시·군·구는 재정자금에 비해 빚에 얼마나 기대고 있고, 같은 시도 안 다른 자치단체와 비교하면 어떤가"를 따져볼 때 쓴다. 전역 조인 키는 없고, 지방재정365의 다른 지표와는 자치단체 코드(laf_cd)나 자치단체명으로 맞춰 연결한다.
description_portal: 지역통합재정자금대비차입부채비율은 지방자치단체의 재정자금과 치입 부채의 관계를 나타내는 지표입니다.해당 비율은 자치단체가 차입한 부채가 재정 자금에 비해 얼마나 많은지를 보여줍니다.지표의 비율이 높을수록 차입 부채의 의존도가 커져 재정적 위험이 증가할 수 있으며, 낮을수록 자치단체가 자주적인 재정 관리를 하고 있다는 의미로 해석됩니다. 이 지표는 자치단체가 차입금 상환 능력을 평가하고, 장기적인 재정 건전성을 유지하기 위해 전략을 수립하는 데 매우 중요한 역할을 합니다.
