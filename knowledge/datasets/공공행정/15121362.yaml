description_portal: 본 데이터는 한국산업기술기획평가원의 ESG(환경·사회·지배구조) 경영과 관련하여 공개된 자율공시 항목 목록을 CSV로 정리한 자료입니다. 공시 항목은 환경(E)·사회(S)·지배구조(G) 범주로 구분되어 제공되며, 각 항목별로 공시 주제와 내용이 함께 수록되어 기관이 어떤 영역에서 어떤 정보를 공개하고 있는지 항목 단위로 확인할 수 있습니다. 또한 각 공시 항목에 대응하는 URL이 포함되어 있어, 이용자가 원문 게시 페이지로 이동해 세부 내용을 직접 확인하거나 추가 자료를 탐색할 수 있습니다.이 자료는 기관의 ESG 관련 공개 내용을 목록화한 형태이므로, 공시 범주별 구성과 공개 주제의 분포를 점검하고, 특정 주제의 공시 여부를 빠르게 확인하는 데 유용합니다. 정책·평가 업무에서는 공공기관 지속가능경영 평가나 대외 보고 시 근거 링크를 정리하는 데 활용할 수 있으며, 연구자·분석가는 공시 주제와 내용 정보를 바탕으로 기관의 ESG 이행 항목을 분류·비교하는 기초 자료로 사용할 수 있습니다. 또한 대국민 정보 제공 측면에서는 ESG 공시 정보를 한 번에 탐색할 수 있는 안내 목록으로 활용되어, 기관 운영의 투명성과 책임경영 관련 정보 접근성을 높이는 데 기여합니다.
