summary_user: 경기도의정포털에서 관리하는 부서 단위 조직 원장으로, 부서코드·부서명·상위부서코드·전체부서명·차수·서열과 전자문서 시스템의 부서ID·부서명, 사용여부·수정일·동기화 결과 같은 관리 속성을 부서마다 한 행씩 담는다. 경기도의회와 관련 기관의 조직 계층을 파악하려는 분석가나 시민이 '특정 부서가 어느 상위 조직에 속하고 아직 운영 중인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 부서명 매핑이나 같은 기관의 부서코드로만 연결하며, 표 안에서는 상위부서코드(up_dept_cd)로 조직 계층을 재구성한다.
description_portal: 「경기도의정포털_조직관리부서정보」 데이터는 경기도 및 산하 기관의 행정조직 관리 현황을 체계적으로 제공하는 자료입니다. 이 데이터에는 각 부서별 부서코드, 부서명, 상위부서코드, 전체부서명, 부서차수, 부서서열과 같은 조직관리 세부 항목이 포함되며, 전자문서 부서ID, 전자문서 부서명, 전자문서 차수, 전자문서 서열 등 전자문서 시스템과 연계된 정보도 제공됩니다. 또한, 부서 설명, 부서 사용여부, 조직관리부서정보 수정일, 등록일자, 동기화 결과와 같은 관리적 속성이 포함되어 있어 부서의 운영 현황과 변경 사항을 확인할 수 있습니다.
