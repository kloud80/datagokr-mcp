description_portal: '○ 통계개요* 통계명 : 주민등록연앙인구(연령별/구별)* 통계종류 : 연말기준 주민등록인구를 기초로 연앙(年央)개념으로 재작성하여 제공하는일반?가공 통계* 작성목적 : 주민등록 연앙인구는 평균인구의 개념으로 출산, 사망, 이동 등 각종인구동태율 산출시 분모인구로 활용함* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 및 자치구의 5세 연령별/성별 연앙인구 수○ 용어설명* 연앙인구 : 年央인 7.1일의 인구를 의미하며, 행정자치부에서 공표하는 연말기준주민등록인구를 기초로, 연초(1.1일)와 연말(12.31) 인구의 산술평균 개념을 사용하여계산된 인구임○ 기 타* 행정자치부 주민등록인구 통계는 http://rcps.egov.go.kr에서 이용 가능함○ 출 처 : 통계청「주민등록연앙인구」'
