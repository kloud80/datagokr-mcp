summary_user: 아산시 안에서 종량제 봉투를 파는 판매소를 한 곳씩 담은 원장으로, 판매소마다 관할동, 판매소명(거래처명), 전화번호, 주소, 데이터기준일자를 적는다. 아산시 주민이 우리 동네 어디서 종량제 봉투를 살 수 있는지 찾을 때, 또는 분석가가 동별 판매소 분포를 보고 생활폐기물 배출 정책을 검토할 때 쓴다. 전역 조인 키는 없어서 관할동 이름이나 주소 문자열을 매칭해 행정동 경계·인구 자료나 다른 생활시설 자료와 잇는다.
description_portal: 아산시 내 종량제 봉투를 판매하는 판매소 현황에 대한 정보입니다.판매소의 관할동, 판매소명, 소재지, 연락처 등의 정보를 제공합니다.종량제 봉투 판매소 분포 현황 분석,생활폐기물 배출 정책 수립 및 판매소 관리 업무에 참고 자료로 활용할 수 있으며,연구기관에서는 생활폐기물 관리 및 환경 정책 연구를 위한 기초자료로 활용할 수 있습니다.
