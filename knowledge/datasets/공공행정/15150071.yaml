description_portal: 해당 데이터는 금산군 용도업종별 전력사용량을 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 합성데이터는 원천데이터와 통계적으로 유사한 패턴을 가진 가상데이터로, 익명화와 통계적 변형 기법을 통해 개인정보를 철저히 보호합니다. 합성 모델(CTGAN, GMM)에 따라 각각 11,434건, 14,720건의 데이터가 수록되어 있습니다. 해당 합성데이터를 활용하여 용도업종(상업·교육·공공 등) 별 계절성·추세를 분석해 부문별 절감 정책을 설계할 수 있습니다. 또한 지역(시군구)×업종 조합의 전력수요 예측 및 피크를 대응하고 업종별 전력사용 비교 인포그래픽 제작용 합성 자료로 사용할 수 있습니다.
