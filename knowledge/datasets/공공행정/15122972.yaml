summary_user: 경기도 경기통계시스템 통계표에 실린 개별 수치를 표항목 식별번호·통계표ID·수록시점(연도) 단위로 담은 시도 범위의 비공간 데이터다. 분석가가 "경기도 특정 통계표의 수치가 연도별로 어떻게 바뀌었나"처럼 지표의 장기 추이를 보거나 정책 효과를 비교할 때 쓴다. 전역 조인 키는 없어 통계표ID(sttbl_id)로 같은 기관의 '경기통계시스템 통계표정보'와 이어 자료명을 붙이는 식으로만 연결한다.
description_portal: 이 데이터는 경기도 경기통계시스템의 통계표에 수록된 실제 수치 정보를 제공하며, 표항목인식번호, 주기구분, 수록시점, 조직번호, 통계표ID, 최종변경일 등의 항목으로 구성되어 있습니다. 표항목인식번호는 각 수치 항목의 고유 식별자이며, 통계표ID는 수치가 속한 통계표를 나타냅니다. 수록시점은 해당 수치가 기록된 연도를 의미하며, 주기구분은 수치가 매년(Y) 수록된 것임을 나타냅니다. 이 데이터는 통계 수치의 연도별 변화를 분석하거나, 통계표별 수치 누적 추이 및 정책 평가, 경기 지표의 장기적 경향성 분석 등에 활용될 수 있으며, 통계 정보 활용의 기초자료로 매우 유용합니다.※통계표ID에 해당하는 자료명은 "경기도 경기통계시스템 통계표정보"를 참고해 주시기 바랍니다.
