description_portal: 본 데이터는 서울특별시에 소재한 영업점을 100으로 환산하여 포스단말기(POS) 사용률과 무인키오스크 설치·운영 비율을 집계한 자료입니다. 포스단말기는 매장에서 상품 판매와 결제, 재고 관리를 지원하는 전자장비로, 소매업과 외식업을 비롯한 다양한 업종에서 보편적으로 활용되고 있습니다. 무인키오스크는 주문, 결제, 발권 등의 절차를 비대면으로 처리할 수 있는 장치로, 최근 비대면 소비문화 확산과 인력 비용 절감 요구에 따라 빠르게 보급되고 있습니다. 데이터는 영업점 단위 비율 산출 방식을 적용하여 시기별·유형별 사용 경향을 객관적으로 비교할 수 있도록 구성되어 있습니다. 이를 통해 서울시 내 상권의 디지털 전환 수준, 무인화 시설 도입 현황, 소비자 이용 패턴 등을 분석할 수 있으며, 행정기관의 정책 수립과 연구자의 시장 분석, 민간 기업의 전략 수립에 기초자료로 활용할 수 있습니다.  본 자료는 통계청 추출자료로서 일부분만을 추출한 샘플데이터임을 말씀드립니다.
