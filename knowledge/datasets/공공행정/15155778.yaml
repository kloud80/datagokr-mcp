description_portal: 서울특별시 서초구 관내 연면적 5,000제곱미터 이상 10,000제곱미터 미만 건축물 현황입니다.연면적 5,000제곱미터 이상 ~ 10,000제곱미터 미만 건축물은 「건축물관리법」 기준에서 관리계획 수립 의무는 없지만, 기본적인 안전관리·점검·유지관리 의무는 모두 적용됩니다.우리구 데이터는 건축물 용도로는 공동주택, 업무시설, 제1종근린생활시설, 교육연구시설, 제2종근린생활시설 등으로 많이 사용되고 있습니다.이외에 자동차관련시설, 판매시설, 종교시설, 의료시설, 운동시설, 문화및집회시설, 숙박시설, 운수시설 등이 사용되고 있습니다.이 자료는 소재지명 도로명주소, 소재지 지번주소, 위도, 경도, 건축물용도, 건축물 구조 형태, 사용승인일자, 연면적등을 제공하고 있습니다.5,000제곱미터 이상 10,000제곱미터 미만 건축물관리자는 3년마다 1회이상 건축물관리점검 전문업체, 건축사, 기술사 등 전문가가 수행하는 구조·마감·기계·전기·소방·외벽 균열·안전 위험요소 등 전반에 걸친 점검을 하여야 하고, 점검보고서를 작성하여 서초구청 건축과에 제출하여야 합니다.또한, 시설물 유지관리업무로는 외벽·구조·설비 점검 및 보수 의무를 하여야 합니다. 소방·전기·가스 등 개별 법령 준수하여 소방점검, 승강기검사 등을 필수로 하여야 합니다.추가적으로 5,000제곱미터 이상 10,000제곱미터 미만 건축물은 2027년 8월 18일부터 정보통신설비 유지보수및 관리제도에 대해서도 일정이상의 자격을 갖춘 전문가를 선임하거나유지보수및 관리업무를 위탁하도록 하는 내용으로 바뀔 예정입니다.우리 구는 앞으로도 주민 여러분께서 오늘이 행복하고 내일이 기다려지는 서초가 될 수 있도록, 정확하고 실용적인 정보를 지속적으로 제공해 나가겠습니다.
