summary_user: 전국 범위로 산업재해와 사망재해에 관한 통계를 담으며, 필드 이름으로 보면 지방관서·지청 관할구역별로 기준연도의 산업재해·사망재해 건수와 등급을 담은 집계 자료입니다. 안전 분야 분석가나 지자체 담당자가 '우리 지역을 관할하는 관서 구역의 사망재해 건수와 등급이 어느 수준인가'를 확인하는 데 씁니다. 실측에서는 전역 조인 키가 확인되지 않았으므로, 시도·시군구 코드로 보이는 필드(STDG_SGG_CD)나 관서명을 다른 지역 통계와 이름·코드로 맞춰 연결해야 합니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 산업 사망재해에 대한 통계 정보입니다.\""
