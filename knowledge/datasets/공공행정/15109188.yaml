summary_user: 제주시에 설치된 무인민원발급기를 기기(설치장소)별로 한 건씩 담은 현황 원장으로, 설치장소명·도로명주소·위도·경도 좌표·운영시간·관리자 전화번호·등록일시를 포함한다. 주민이나 생활정보 서비스 개발자가 "우리 동네에서 지금 운영 중인 가까운 무인민원발급기는 어디인가"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명주소(rnAdres)나 좌표로 공간 매칭하거나 같은 기관 자료끼리 이름으로 연결해야 하며, 다른 지자체 무인민원발급기 표준데이터와 항목을 맞춰 합칠 수 있다.
limits: 범위가 제주시 한 곳에 한정되어 제주도 전체나 다른 시군구 현황은 담지 않는다. 기기를 이어 줄 공통 코드가 없어 다른 시설·행정구역 데이터와 붙이려면 주소·좌표 매칭이 필요하다. 개발계정은 하루 10,000회로 호출이 제한된다.
