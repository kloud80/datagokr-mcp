summary_user: 공정거래위원회 가맹사업 정보 중 매출액 기준 상위 가맹본부의 순위 통계를 연도·업종(대분류·중분류)별로 담으며, 가맹본부명과 자산·자본·부채 총액, 매출액, 영업이익, 당기순이익을 전국 단위로 제공한다. 창업 예정자나 분석가가 "이 업종에서 매출이 큰 가맹본부는 어디이고 재무 상태는 어떤가"를 확인할 때 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 가맹사업 데이터와는 가맹본부명(corpNm)·업종명 매핑으로만 연결한다.
description_portal: 이 API는 공정거래위원회에서 제공하는 가맹정보_매출액 가맹본부 상위 순위 통계 제공 서비스 입니다. 년도, 업종대분류코드 등을 이용하여, 매출액 가맹본부 상위 순위 통계에 대한 자산총금액, 영업이익금액, 자본총금액 등의 정보를 조회할 수 있습니다.
