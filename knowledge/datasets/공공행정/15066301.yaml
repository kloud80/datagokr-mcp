description_portal: 인천광역시가 사회조사를 통해 제공하는 역외 소비활동 및 비중 현황 공공데이터는 시민들이 **타 지역(인천 이외 지역)**에서 소비 활동을 하는 정도와 그 비중을 군/구별, 성별, 연령별, 직업별, 소득별 등 다양한 특성에 따라 집계한 통계 자료입니다. 이 데이터는 지역 상권의 경쟁력, 외부 소비 유출입 규모, 시민들의 소비 패턴 등을 파악하고, 지역 상권 활성화 정책, 소비 증진 방안, 경제 구조 개선 등의 기초 자료로 활용됩니다. 역외 소비활동 여부 및 비중을 나타내는 자료(소비한다, 소비하지 않는다, 소비활동 비중 10% 미만, 소비활동 비중 10% 이상~30% 미만 등)입니다.
