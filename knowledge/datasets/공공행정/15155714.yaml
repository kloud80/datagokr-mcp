description_portal: 알리오플러스(ALIOPlus)에서 제공하는 기관 홍보 영상 및 정책 홍보 영상 정보를 체계적으로 수집하여 제공하는 자료이다. 알리오플러스는 중앙부처, 지방자치단체, 공공기관이 생산한 다양한 공시자료를 한 곳에서 열람할 수 있는 정부 공식 플랫폼으로, 각 기관이 국민과 소통하기 위해 제작한 영상 콘텐츠를 주제별·기관별·유형별로 공개하고 있다.본 데이터는 알리오플러스에 등록된 최신 홍보영상 정보를 기반으로 하며, 제목, 기관명, 동영상주소, 키워드, 등록일 등 영상 조회를 위한 기본 메타데이터로 구성되어 있다. 이를 통해 이용자는 각 공공기관의 주요 사업, 정책 홍보내용, 기관 소개, 대국민 소통 활동을 쉽게 이해할 수 있으며, 여러 기관의 콘텐츠를 한 번에 비교·활용할 수 있는 장점을 제공한다.
