summary_user: 행정동 안의 통·반 단위로 전체·남자·여자 평균연령을 월별(통계년월) 주민등록 기준으로 담은 집계 데이터이며, 검증 호출에서 전국 범위 42행이 수신됐다. 우리 동네 통·반의 연령 구조가 어떤지, 지역별 고령화 수준을 비교하려는 분석가나 사업자가 쓴다. 행정기관코드(admmCd)로 같은 기관의 다른 주민등록 인구·세대 데이터와 이어 쓰며, 전역 조인 키는 없어 그 외에는 시도·시군구·행정동 이름이나 코드 매핑이 필요하다.
description_portal: 행정기관과 통계년월을 기준으로 시도명, 시군구명, 행정동명, 통, 반, 전체평균연령, 남자평균연령, 여자평균연령을 조회하기 위한 서비스입니다.주민등록 데이터는 통계의 기본이 되는 인구 데이터로써, 주민의 신고에 따라 주민등록법 제6조의 규정에 근거하여 개인·세대별 주민등록표를 기반으로 매월 말일 집계하고 있으며 거주자, 거주불명자, 재외국민을 포함하고 있습니다.활용가치가 큰 주민등록 데이터의 제공 단위를 통반 단위, 도로명 등으로 확대하여 오픈API 방식으로 제공함으로써, 주민등록 데이터를 활용한 국가정책수립, 민간·공공서비스 개발, 창업 지원 및 일자리 창출 등 다양한 분야의 디지털 전환 및 국민 삶의 질 향상에 기여할 목적으로 작성되었습니다.
