description_portal: '광주광역시 동구의 제조업은 인쇄업을 중심으로 한 도심형 소규모 업체들이 주를 이루고 있습니다. 전반적으로 대규모 공장보다는 지역 상권과 밀접하게 연관된 업종들이 발달한 것이 특징입니다.#주요 제조업 분야인쇄 및 기록매체 복제업: 동구 제조업의 가장 큰 비중을 차지하는 분야입니다. 특히 **서남동 "인쇄의 거리"**는 호남권 최대 규모의 인쇄 산업 집적지로, 80년의 역사를 자랑합니다. 이곳에는 기획, 디자인, 출력, 인쇄, 후가공에 이르는 다양한 인쇄 관련 업체 330여 개가 밀집해 있습니다. 현재는 인쇄 산업의 변화에 발맞춰 "인쇄소공인 종합지원센터" 건립, 도시재생 뉴딜사업 등을 통해 새로운 활로를 모색하고 있습니다.의복, 의복 액세서리 및 모피제품 제조업: 인쇄업 다음으로 많은 업체가 있는 분야로, 주로 소규모 의류 제조 및 수선 업체들이 포함됩니다.식료품 제조업: 음료, 빵, 과자, 면류 등 다양한 식료품을 생산하는 업체들이 동구에 자리하고 있습니다.기타 제조업: 위 업종 외에도 가구, 금속가공제품, 전자부품, 화학물질 등 다양한 분야의 제조업체들이 소규모로 분포하고 있습니다.요약하자면, 광주광역시 동구의 제조업은 "인쇄의 거리"를 중심으로 한 인쇄업이 핵심적인 역할을 하고 있으며, 이와 함께 의류, 식료품 등 도시 생활과 밀접한 관련이 있는 다양한 업종의 소규모 업체들이 공존하는 형태를 보이고 있습니다.'
