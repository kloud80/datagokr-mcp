description_portal: 경상북도개발공사의 사내에 운영, 관리 중인 도서 리스트고유번호, 도서명, 저자, 출판사 등 도서 리스트관련 데이터 포함하고 있다. 경상북도개발공사에서 관리 중인 도서는 도서 분류체계를 일부 수용하여 비고형식으로 도서를 분류하여 관리하고 있다. 향후 도서가 일정 수준이상 보유하게 되면 도서의 관외 대출도 추진할 예정이다. 고사에서 보유하고 있는 도서는 약 천오백여종이며 경상북도 소재 문인들과 협력하여 인문학적인 도서 보유 및 구매 예정이다. 또한 타 기관과도 도서 대여 등을 추진하여 직원의 교양 확대에도 기여할 계획이다.
