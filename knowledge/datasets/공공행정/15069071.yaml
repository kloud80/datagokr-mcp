description_portal: '남양주시 세외수입 미수납액 과목별 현황 데이터로 재산임대수입, 사용료, 수수료, 사업수입, 징수교부금, 이자수입 등의 항목을 제공합니다. [ 세외수입 세입과목 안내 ]- 연도: 연도- 회계구분: 재무 정보 분류 기준- 재산임대수입: 재화와 자산임대 수입 - 사용료: 사용한 값으로 내는 요금- 수수료: 어떤일을 맟아 처리해준 데 대한 대가로서 주는 요금- 사업수입: 각종 기업이나 지방자치단체가 사업을 운영하여 얻는 총 외형 거래액- 징수교부금수입: 세, 도세, 하천사용료 및 도로사용료 등을 시군이 대신하여 징수할 경우 징수를 위임한 기관에서 나중에 보전해주는 교부금- 이자수입: 이자에 의해 생기는 소득- 재산매각수입: 재화와 자산 매각 수입- 부담금: 국가와 지자체가 사업비의 일부를 부담하는 금액- 과징금 및 과태료: 규약 위반에 대한 징수금 또는 공범에서 의무 이행을 태만히 한 벌로 물게 하는 돈- 기타수입: 그 밖의 또 다른 수입의 금액- 지난년도 수입: 현재 년도의 예산에 포함된 지난연도의 수입- 경상적 세외수입: 공기업이 사업을 운영하여 얻는 총 외형 거래액- 임시적 세외수입: 공기업의 사업 이외 소득'
