description_portal: 본 데이터는 경기도 광주시의회 홈페이지에서 관리하는 회기 정보를 제공합니다. 시의회가 개회하여 운영되는 정례회와 임시회의 기간과 형식을 담고 있어 의회 운영 일정을 파악할 수 있습니다. 고유번호는 각 회기를 식별하는 코드이며, 대수는 의회의 기수를 나타냅니다. 회기는 해당 대수에서 몇 번째 회의인지를 표시하고, 회기 시작일과 종료일은 의회가 개회된 기간을 보여줍니다. 회기 형식 문구는 정례회, 임시회 등 회의 성격을 나타냅니다. 본 데이터는 의회 일정 관리, 의정 활동 기록, 시민 정보 제공, 회의록 검색 등에 활용되며 의회 운영의 체계성과 투명성을 높입니다.
