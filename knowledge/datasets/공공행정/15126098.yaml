summary_user: 국회에 제출된 예산안·결산 관련 의안을 건별로 담으며, 대수(ERACO), 의안번호·의안명, 제안자 구분과 제안일, 예산결산특별위원회 등 소관위원회의 회부·상정·의결 일자와 처리 결과, 원문 링크를 함께 제공한다. 분석가나 기자가 '이번 대수 국회에서 결산안이 언제 상정되어 언제 의결됐고 결과가 무엇이었나'처럼 예결산 심사 일정과 처리 결과를 확인하는 데 쓴다. 전역 조인 키는 없어서 국회 의안정보 같은 다른 국회 데이터와는 의안ID·의안번호나 의안명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
