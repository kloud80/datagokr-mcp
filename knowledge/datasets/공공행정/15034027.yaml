summary_user: 부산광역시에 등록된 구·군 행정사 사무소를 한 곳씩 담은 원장으로, 행정사 종류(일반·해사·외국어번역), 대표자 성명, 사무소명, 도로명·지번 주소, 전화·팩스, 영업여부, 구군, 위도·경도를 포함한다. 시민이 관공서 서류 처리를 맡길 행정사를 찾을 때, 예를 들어 '우리 구에서 영업 중인 해사행정사나 외국어번역행정사는 어디 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 구군 이름이나 주소·좌표를 기준으로 같은 부산 지역의 주민센터·관공서 등 다른 생활 행정시설 데이터와 이어 쓴다.
description_portal: 행정업무에 생소한 시민이 관공서에서 일처리를 할때 대행하여 도움을 받을 수 있는 부산광역시에 등록된 구군 행정사 현황에 대한 데이터를 개방합니다.개방된 데이터에는 행정사 종류(일반, 해사, 외국어번역), 대표자 성명, 사무소명, 도로명 주소, 전화번호, 영업여부, 팩스번호 등의 정보를 포함하고 있습니다.일반행정사 451곳, 해사행정사 10곳, 외국어번역행정사(영어)14곳, 외국어번역행정사(일본어) 5곳, 외국어번역행정사(중국어) 2곳, 외국어번역행정사(독일어) 1곳이 등록되어 있습니다*기준일 2025.5.21 현재
