summary_user: 한국남부발전이 체결한 계약을 건별로 담은 파일 데이터로, 계약 구분(구매입찰정보 등)·사업소(하동·부산·삼척 등)·계약명·계약일자·계약금액을 행 단위로 기록한다. 공기업의 자금 집행을 살피는 국민이나 조달 시장을 보는 사업자가 '남부발전 어느 사업소가 어떤 설비·자재 계약을 얼마에 맺었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명·계약명 같은 이름 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 한국남부발전에서 체결한 계약 현황을 정리한 자료입니다. 각 계약은 구분(구매입찰정보 등), 사업소, 계약명, 계약일자, 계약금액 등의 항목으로 구성되어 있으며, 발전소 운영을 위한 자재 구매, 설비 유지보수, 환경설비 도입 등 다양한 계약 내용을 포함하고 있습니다. 하동, 부산, 삼척 등 주요 사업소별 계약 내역을 확인할 수 있으며, 계약금액을 통해 사업 규모와 재정 집행 현황을 파악할 수 있습니다. 본 자료는 공기업의 계약 체결 과정을 투명하게 공개하여 경영 신뢰도를 높이고, 국민이 공공기관의 자금 집행 및 운영 효율성을 확인할 수 있도록 돕습니다. 또한 발전소 운영 안정성과 공공사업 추진을 위한 계약 구조를 이해하는 데 기초 자료로 활용될 수 있습니다.
