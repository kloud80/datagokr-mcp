summary_user: 국회뉴스ON에 실린 외부 기고문을 글 한 건 단위로 담으며, 제목·원문 링크·게재일·최종 수정일 같은 목록 정보를 전국 범위의 비공간 데이터로 제공한다. 정책 연구자나 언론인이 특정 시기에 국회뉴스ON에 실린 외부 전문가 기고를 찾아 원문으로 들어갈 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 같은 기관(국회사무처)의 다른 국회뉴스ON 데이터와는 제목이나 게재일을 맞춰 보는 방식으로만 연결한다.
