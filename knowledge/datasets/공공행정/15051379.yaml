summary_user: 전국 지방자치단체별 중기지방재정계획을 회계연도(fyr)·자치단체·계획 구분별로 담으며, 총계획액과 1~5차연도 계획액, 비율을 함께 제공하는 집계 데이터다. 분석가나 주민이 '우리 시·군·구가 향후 5년간 어떤 분야에 재정을 얼마나 배분할 계획인가'를 확인하거나 연차별 계획 규모를 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 데이터와는 자치단체 코드·이름(laf_cd, wa_laf_cd 등)과 회계연도를 맞춰 이어 쓴다.
description_portal: 지방자치단체별 중기지방재정계획 (중기재정계획이란 한 회계연도를 대상으로 편성해서 국회승인을 받는 예산과 달리 3~5년 정도의 기간을 대상으로 수립하는 재정계획을 말한다. 중기적 관점에서 현재 수행중인 사업과 새로운 사업이 예산 미치는 영향을 분석하고 예산운용의 우선순위를 설정하여 전략적 자원배분을 유도하고 지출을 통제하고자 하는 예산운용방식이다.지방자치단체의 경우 지방자치단체장은 지방재정을 계획성 있게 운용하기 위하여 매년 다음 회계연도부터 5회계연도 이상의 기간에 대한 중기지방재정계획을 수립하도록 하고 있다.)
