summary_user: 국회 본회의에 부의된 법률안을 의안별로 담은 건별 원천 데이터로, 대수(AGE)·의안번호·의안명과 소관위원회 회부·상정·처리일과 결과, 법제사법위원회 회부·상정·처리일과 결과, 본회의 처리일 등 심사 단계별 일정을 함께 담는다. 분석가나 국민이 '이번 대 국회에서 본회의에 올라간 법안이 소관위원회와 법사위를 거쳐 언제 어떤 결과로 처리됐는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관(국회) 의안 데이터와는 의안ID(BILL_ID)·의안번호나 의안명·위원회명 같은 이름·코드 매핑으로만 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
