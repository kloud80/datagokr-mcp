legal_basis_portal: 본 데이터의 보유 및 제공 근거는 「포항시 담배소매인 지정기준에 관한 규칙」에 따른 것으로, 해당 규칙은 담배사업법 및 관련 법령에 근거하여 포항시장이 관내 담배소매인의 지정, 변경, 취소 및 관리에 필요한 세부 기준과 절차를 정함으로써 공정하고 체계적인 담배 유통질서를 확립하기 위해 제정된 자치법규이다.동 규칙에서는 담배소매인의 지정과 관련하여 영업소의 위치, 시설 기준, 거리 제한, 영업 형태 등 다양한 요건을 규정하고 있으며, 지정 과정에서 신청인의 인적사항 및 업소의 정확한 소재지, 지정일자 등 행정상 관리에 필요한 정보를 확인·기록·관리하도록 하고 있다. 이에 따라 포항시는 담배소매인 지정 및 관리 업무 수행 과정에서 생성·축적되는 관련 데이터를 보유하게 되며, 이는 해당 규칙에 따른 적법한 행정 수행의 결과물이다.또한, 해당 데이터는 담배소매인의 지정 현황을 체계적으로 관리하고, 지역별 분포 및 수급 상황을 분석하여 합리적인 지정 정책을 수립하기 위한 기초자료로 활용되며, 필요 시 관련 법령 및 규정에 위배되지 않는 범위 내에서 공공데이터로 제공될 수 있다.따라서 본 데이터의 보유는 「포항시 담배소매인 지정기준에 관한 규칙」에 근거한 정당한 행정업무 수행의 일환이며, 이를 통해 담배소매인 지정의 공정성·투명성 확보 및 효율적인 관리체계 구축에 기여하고자 한다.
