description_portal: '전북특별자치도 진안군의 진안군의회 홈페이지 전자 회의록 정보 테이블에 대한 공공데이터 자료입니다. 이번 자료에서는 고유번호, 의회 코드, 대수, 회기, 회기 형식 문구, 위원회 코드, 위원회명, 차수, 차수 한글, 회의 날짜, 등록일, 최종 수정일 정보를 제공합니다. 이 자료를 통해 진안군의회 홈페이지의 전자 회의록 정보를 확인할 수 있습니다. 또한 각 대수(의미 : 지방자치단체 의회가 구성 및 운영된 횟수)마다 진행한 회기가 무엇이며 각 회기마다 진행된 위원회가 무엇인지 알아볼 수 있습니다. 그리고 이 자료를 메타데이터 중장기 개방을 위한 데이터입니다. 또 이 자료의 데이터 기준일자는 2025년 9월 16일입니다.'
