summary_user: 전국 시도·시군구·읍면동(행정동)별로 매월 말일 기준 주민등록 인구의 전월·당월 인구수와 증감을 남녀별로 담은 월 단위 집계 데이터이며, 외국인은 제외한다. 지자체 담당자나 분석가가 "우리 동네 행정동 인구가 지난달보다 얼마나 늘거나 줄었고, 남녀 중 어느 쪽 변화가 컸나"를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로 행정기관코드(행정기관코드)나 시도·시군구·읍면동 이름 매핑으로 같은 기관의 다른 주민등록 인구·세대 통계나 행정동 단위 공간 데이터와 기준연월을 맞춰 잇는다.
description_portal: 전국 지자체별(시도/시군구/읍면동별) 인구증감 현황에 관한 데이터로 매월 말일 기준 주민등록지에 신고된 대한민국 국민(단, 외국인은 제외)을 대상으로 집계하고 있습니다. 행정동은 주민들이 거주하는 지역을 행정능률과 주민편의를 위하여 구분한 행정 구역 단위를 말합니다.주민등록 인구 및 세대 등 을 기반으로 선거, 교육, 조세, 복지, 교통, 지역 개발 등 다양한 분야에 적시성 있는 통계를 제공하고 있습니다. 이러한 통계는 국가 행정 및 정책 수립에 필요한 기초 자료로 활용되고 있습니다.주민등록 인구통계는 행정안전부 주민등록 인구통계 홈페이지(https://jumin.mois.go.kr), 공공데이터포털(https://data.go.kr), 국가통계포털(KOSIS) 등에서 확인 및 다운로드가 가능합니다.
