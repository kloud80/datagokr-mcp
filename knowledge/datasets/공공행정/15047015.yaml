description_portal: '○ 통계개요* 통계명 : 귀농어 귀촌인 현황(서울→타지역)* 통계종류 : 귀농 귀촌인통계를 제공하는 일반통계* 작성목적 : 귀농 귀촌인 규모를 파악 제공하여 귀농 귀촌 정책수립에 필요한 기초자료 제공* 조사체계 : (귀농) 행정자료 보유기관의 자료제공 → 통계청 통계작성(귀촌) 시군(읍면) → 시도 → 농림축산식품부 분석 집계* 공표주기 : 정기(매년)* 공표범위 : 내용 - 타지역 귀농 전입 가구수 및 가구원수(연령별), 귀촌 전입 가구수○ 용어설명* 귀농인 : 통계작성 기준일(매년 11월 1일)을 기준으로 1년전(前) 주소가 동(洞)지역이고현(現)주소가 읍 면(邑?面)지역인 자 중에서 농업경영체등록명부의 경영주,축산업등록명부의 종축업자 사육업자 부화업자, 농지원부의 농업인으로 신규 등록한 자* 귀농가구 : 주민등록부상 귀농인이 포함된 세대* 귀촌인 : 전원생활 등을 목적으로 농어촌으로 이주한 자. 단, 회사원, 교사 등 별도직업이 있는 경우는 제외됨'
