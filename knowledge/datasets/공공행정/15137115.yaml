description_portal: 한국산업인력공단에서 제공하는 외국인 노동자 송출국가별 해당 국가 정보(대사관 및 총영사관 등) 및 홍보자료 등에 관한 공공데이터 입니다. ‘외국인 노동자 송출국가 정보’ 공공데이터는 외국인 근로자를 송출한 국가별 입국 및 고용 현황을 체계적으로 정리하여 제공하는 API입니다. 주요 항목에는 송출국 코드(ISO 또는 자체 코드), 송출국명, 가입국 수(입국한 외국인 수), 직종/업종 분포, 비자 유형(E‑9, E‑7 등), 성별, 연령대, 체류기간, 고용상태(구직/취업 중) 등이 포함되어 있으며, 한국산업인력공단에서 제공합니다.
