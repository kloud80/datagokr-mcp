description_portal: 이 데이터는 2024년 8월 19일 기준 충청남도 내 무더위쉼터 현황을 정리한 자료입니다. 각 무더위쉼터는 연번으로 구분되며, 시도명, 시군구명, 읍면동명 등의 행정구역 정보와 법정동코드를 포함해 위치를 세부적으로 확인할 수 있습니다. 쉼터명칭, 상세주소, 소재지지번주소를 통해 개별 쉼터의 위치가 기록되어 있으며, 시설유형과 시설유형명은 쉼터의 운영 형태를 구분합니다. 또한 시설면적과 이용가능인원수는 해당 쉼터의 수용 규모를 나타내며, 선풍기·에어컨 보유대수 같은 항목은 냉방 인프라 수준을 파악할 수 있습니다. 야간연장운영여부, 숙박가능여부, 주말운영여부는 쉼터의 운영 시간 및 특성을 알려주며, 사용여부는 실제 운영 중인지 여부를 구분합니다. 경도·위도는 GIS 기반 공간분석을 가능하게 합니다. 이 자료는 충청남도의 재난 안전 정책, 폭염 대응 전략, 취약계층 보호 대책 수립에 필수적인 기초자료로 활용될 수 있습니다.
