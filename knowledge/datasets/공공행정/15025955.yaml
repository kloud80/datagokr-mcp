summary_user: 국회입법조사처가 여는 토론회·전문가 간담회 같은 행사를 한 건씩 담은 API 데이터로, 행사 유형, 제목, 시작·종료 일시, 장소, 내용, 주관 부서·팀, 공동주최·주최자, 참석자, 첨부파일·이미지 링크, 등록일, 조회수가 들어 있다. 국회 입법정책 토론회 일정을 챙기는 연구자·기자·이해관계자가 "특정 주제로 입법조사처가 언제, 어디서, 누구와 토론회를 열었나"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 국회·법제 데이터와는 부서명·팀명 같은 이름이나 같은 기관 코드로만 맞춰 연결한다.
limits: 공통 조인 키가 없어 법안·보고서 데이터와 정확히 묶기 어렵고, 이름 매핑에 의존해야 한다. 공간 정보가 없는 전국 단위 데이터라서 지역별 분석에는 맞지 않는다. 호출하려면 포털 활용신청으로 serviceKey를 받아야 하며, 개발계정은 하루 10,000회까지 호출된다.
