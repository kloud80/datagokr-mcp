description_portal: 본 데이터는 충청남도 공주시에 행사업무를 부서별로 정리하고 행사일정 게시판 정보를 제공합니다. 충청남도 공주시 행사일정 게시판 정보에 대한 데이터로 행사명, 행사장소, 행사 시작시간, 행사 종료시간, 행사구분, 행사주최, 참가비용 등의 항목을 제공합니다. 행사일정 게시판 정보는 공주시에서 운영하는 스마트소통넷에서 시민에게 알리는 각종 공공, 문화, 관광, 교육, 복지, 체육, 지역행사 일정 정보를 구조한 데이터입니다.  공주시 행사 통합 캘릭더 구축, 행사 성과 분석 기반으로 예산, 기획에 활용될 수 있을 듯 합니다.
