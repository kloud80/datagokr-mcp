status: active
summary_user: 온비드에 등록된 물건 중 전일 기준 로그인 회원 조회수가 높은 상위 20개를 물건유형(부동산·동산·자동차)별로 담으며, 물건마다 순위·입찰기간·감정평가금액·최저입찰가격·재산유형·처분방식(매각·임대) 등을 건별로 제공한다. 공매 참여를 고민하는 국민이나 사업자가 "어제 가장 관심을 많이 받은 입찰 진행 중인 부동산·자동차 공매 물건은 무엇이고 감정가 대비 최저입찰가는 얼마인가"를 확인하는 데 쓴다. 실측상 전역 조인 키는 없으나, 물건관리번호(cltrMngNo)와 공매조건번호를 함께 넘기면 같은 기관의 온비드 물건 입찰정보 조회와 이어 쓸 수 있고, 재산유형·용도분류 코드로 다른 온비드 목록과 맞춰 볼 수 있다.
limits: 조회수 순위는 참고용이며 입찰마감 전 물건만 나오므로 낙찰·유찰 결과나 과거 인기 추이는 이 데이터로 알 수 없다. 물건유형구분(cltrDivNm)은 필수 입력이고 개발계정은 일 1,000회로 제한된다. 공통 행정코드 같은 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다.
