description_portal: "한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지에 등록된 물건 중 전일 기준 클릭수가 가장 많은 상위 20개 물건 정보입니다. 물건 유형(부동산, 동산, 자동차)에 따라 전일(어제)를 기준으로 조회수가 높은 상위 20개의 물건에 대해 입찰종료일자, 최저입찰가격, 감정평가금액 등 주요 물건 정보를 조회할 수 있습니다. 조회수는 '로그인한 회원이 물건을 조회한 횟수'를 의미하며 동일한 물건에 대해 한 명의 회원이 여러 번 물건을 조회하더라도  조회수는 1일 1회만 증가합니다.  순위물건은 입찰마감 전인 (입찰 준비중이거나 입찰 진행 중) 물건만 조회됩니다. 순위물건의 순위는 참고용으로만 활용하시기 바랍니다. 필수 입력 조건 : 물건유형구분(cltrDivNm) (부동산|동산|자동차 중 입력)"
