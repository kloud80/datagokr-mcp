description_portal: '○ 통계개요* 통계명 : 우편시설(구별)* 통계종류 : 서울시 우편시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 작성목적 : 우편관련 시설 및 종사인원 등의 현황을 조사하여 우정사업 정책입안 및계획 수립의 기초자료로 활용하고, 우편서비스 이용고객에 대한 편의를도모하는 것을 목적으로 함* 조사체계 : 일반우체국 → 총괄우체국 → 서울지방우정청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 우편관련 시설(우체국, 우체통, 사서함시설,수송장비 등) 및 종사인원(직원, 집배원) 현황'
