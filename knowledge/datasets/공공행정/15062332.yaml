description_portal: 인천광역시 각 구의 연번 법정동(리)명, 관할 행정 읍·면·동 현황 등이다.이 공공데이터는 인천광역시 관내 군·구별 법정동(리)와 관할 행정 읍면동 현황을 체계적으로 정리한 행정구역 자료입니다. 데이터는 연번을 통해 목록을 구분하며, 군구명은 해당 동·리의 소속 행정구를 나타냅니다. 법정동(리)명은 법적으로 정의된 최소 행정 단위의 명칭을 제공하고, 관할 행정 읍면동은 실제 행정 서비스를 담당하는 기관을 명시하여 법정 주소와 행정 서비스 구역을 연결합니다.해당 데이터는 공공데이터포털에서 제공되며, CSV파일로 확인할 수 있습니다.
