description_portal: '이 공공데이터는 인천광역시가 소유·관리하는 **공유재산(시유지, 시유 건물 등)**에 대해 사용 허가 또는 **대부(유상 임대)**를 해준 내역을 정리하여 제공하는 행정 정보 자료입니다.<활용 목적>공유재산 관리 투명성: 시유 재산의 운영 및 활용 실태를 투명하게 공개하여, 재산 관리의 효율성과 공정성을 높입니다.시민 정보 제공: 시민들이 시유 재산의 활용 현황 및 이용 가능성을 파악하는 데 도움을 주어, 공익적 활용 방안을 모색할 수 있도록 합니다.재정 분석: 시의 비과세 수입(대부료) 발생 현황을 분석하여 지방 재정 확충 및 관리 계획 수립의 기초 자료로 활용됩니다.인천시 공유재산의 효율적인 관리 및 정보 투명성 확보를 위한 핵심 기반 정보입니다.'
