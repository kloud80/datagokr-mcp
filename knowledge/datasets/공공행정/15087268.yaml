summary_user: 경기도가 사전정보공표 제도에 따라 공개하는 행정정보 항목을 한 건씩 정리한 목록으로, 분야·공표내용·공표상세·공표주기·공표시기·URL·담당부서·담당자를 담는다. 도민이나 분석가가 '경기도는 교통·환경·보건 분야에서 어떤 정보를 언제, 얼마나 자주 공표하고 담당부서는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 담당부서명(charge_dept_nm)이나 분야명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 경기도에서 운영하는 사전정보공표 제도에 따라 공개되는 행정 정보 목록을 정리한 자료입니다. 각 항목은 분야, 공표내용, 공표상세내용, 공표주기, 공표시기, URL, 담당부서, 담당자로 구성되며, 공공기관의 투명성 제고와 국민 알권리 보장을 위해 제공됩니다. 공표 주기 및 시기에 따라 정기적 또는 수시로 업데이트되며, 교통, 환경, 보건, 경제, 행정 등 다양한 분야의 정보를 포함하고 있습니다. 본 데이터는 공공데이터 활용 촉진, 민간의 정보 접근성 향상, 정책 모니터링, 지역 행정서비스 분석 등에 유용하게 활용될 수 있습니다. 경기도청 홈페이지(gg.go.kr)의 [정보공개]=>[정보공개 제공]=>[사전정보공표]에서도 확인하실 수 있습니다.
