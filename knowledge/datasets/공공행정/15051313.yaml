summary_user: 전북특별자치도에서 공익사업을 위해 진행된 토지 수용을 사업 단위로 한 행씩 정리한 소규모 파일(약 4KB csv)로, 사업명·사업 시행자와 함께 수용재결 신청과 실제 수용재결의 건수·면적(㎡)·금액을 나란히 담는다. 지역개발 분석가나 정책 담당자가 "어떤 사업에서 신청한 수용 면적·금액과 실제 재결 결과가 얼마나 달랐나"를 비교해 보상 과정을 점검하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 사업명·시행자 이름을 맞춰 붙이거나 같은 기관 자료끼리 이어 써야 한다.
description_portal: 이 데이터는 전북특별자치도 내에서 공익사업 등을 목적으로 진행된 토지 수용에 대한 세부 현황을 담고 있습니다. 각 행은 개별 사업 단위를 기준으로 구성되어 있으며, 사업명, 사업 시행자, 수용재결 신청 및 확정 건수, 면적(㎡), 금액(원) 등을 포함합니다. 수용재결 신청과 실제 수용재결 결과의 차이를 확인할 수 있어, 공공사업의 토지 확보 및 보상 과정의 효율성을 평가하는 데 유용합니다. 특히 지방자치단체, 공공기관, 민간사업자 등이 시행한 도로 확장, 도시개발, 농업용수 개발, 공공시설 건립 등 다양한 사업 유형이 반영되어 있어 정책 수립, 예산 편성, 지역개발 분석 등 다양한 분야에 활용될 수 있습니다. 또한 토지 수용 관련 분쟁 조정, 예측 가능한 보상 기준 마련에도 참고자료로 활용 가능합니다.
