description_portal: 전북특별자치도 내 학생 가구를 대상으로 월평균 사교육비 지출액을 조사한 사회조사 결과 데이터입니다. 본 자료는 미취학 아동부터 대학원생까지, 자녀의 교육 단계별로 지출되는 평균 사교육 비용을 상세히 보여줍니다. 특히 거주지역(시/군), 성별, 소득수준 등 다양한 인구통계학적 특성에 따라 지출액을 교차 분석하여 제공함으로써, 사교육 시장의 규모와 교육비 부담의 사회경제적 격차를 심도 있게 파악할 수 있도록 지원합니다. 이는 교육 불평등 문제를 진단하고 가계 부담 완화를 위한 교육 복지 정책을 수립하는 데 필수적인 기초 자료로 활용될 수 있습니다.
