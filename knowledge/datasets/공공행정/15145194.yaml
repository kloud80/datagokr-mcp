description_portal: 본 데이터는 한국도로공사에서 2019년도 부터 연도별로 집계한 인건비 내역을 제공한다. 항목은 해당년도, 일반직 인건비, 무기계약직 인건비로 구성되며, 직종별 인건비 총액을 기준으로 연도 단위로 정리된다. 일반직은 정규직 인력을, 무기계약직은 무기한 고용계약 근로자를 의미하며, 각각의 인건비 수준을 구분하여 제공한다. 본 데이터는 공공기관의 예산 편성 및 인건비 집행의 투명성을 높이는 데 기여하며, 경영성과 평가, 유사 기관과의 인건비 비교, 재정 운영의 건전성 분석 등 다양한 행정 및 정책 결정의 참고자료로 활용될 수 있다. 아울러 국민의 알 권리를 충족시키는 공공정보로서의 의미를 지닌다.
