summary_user: 공정거래위원회에 등록된 상조(선불식 할부거래)업체를 사업자 한 곳 단위로 담는다. 상호·대표자·등록번호·영업상태·주소와 함께 자본금·자산·부채·선수금 합계·보전비율·보전기관, 주요 판매상품의 가격과 구성이 들어 있고 범위는 전국이다. 소비자가 "가입하려는 상조회사가 정상 영업 중이고 선수금을 제대로 보전하고 있나"를 확인하는 데 쓰고, 분석가는 업체별 지급여력·부채비율 비교에 쓴다. 법인등록번호(crno)와 사업자등록번호(brno)로 가맹사업·특수판매·기업집단 등 다른 공정위 등록·공시 데이터나 사업자 정보와 이어 쓴다.
description_portal: 대표자명, 사업자등록번호, 상호명, 영업상태등을 이용하여 선불식할부거래업사업자에 대한 상호명, 선불식할부거래업등록번호, 사업자등록번호 등의 정보를 조회할 수 있는 서비스
team:
  dept: 정보화담당관실
services:
  - op: /getInstallplanBsIfInfoDetail_2
    name: 선불식할부거래업사업자 정보 상세 제공 조회
    endpoint: https://apis.data.go.kr/1130000/InstallplanBsIfDtl_2Service/getInstallplanBsIfInfoDetail_2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: resultType
        required: false
        example: xml
        desc: 결과형식(xml/json)
      - name: opnSn
        required: true
        example: '285'
        desc: 개방일련번호
      - name: brno
        required: false
        example: '0000000000'
        desc: 사업자등록번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
