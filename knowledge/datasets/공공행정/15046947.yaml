description_portal: '○ 통계개요* 통계명 : 평균연령(동별)* 통계종류 : 서울시 인구의 평균연령을 행정동별로 제공하는 일반·보고통계* 근거법령 :「주민등록법」에 따른 주민등록표에 등록된 서울시민 및 세대* 작성목적 : 지역별 인구의 변동상황 및 연령구조를 파악하여 각 지방행정기관의제반 행정사항의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 시·도 → 행정자치부* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 자치구, 행정동내용 - 서울시 행정동별 인구의 평균연령○ 용어설명* 평균연령 = {각세 연령별 인구×(연령+0.5)}의 총합을 총인구로 나눈 값 (외국인 제외)○ 기타* 출생, 사망, 전입 등의 미신고,지연·허위신고 등에 따라 실제와는 차이가 있을 수있으며, 실제로 국내의 가족과 살고 있지 않더라도 주민등록표에 등재되어 있는경우에는 집계되기 때문에 상주인구 기준의 조사결과와 차이가 있을 수 있음'
