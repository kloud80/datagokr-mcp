summary_user: 경기도의정포털에서 업무별로 지정한 담당자 한 명 한 명을 건별로 기록한 운영 자료로, 권한그룹, 담당자 회원번호·아이디·전화번호, 소속·연계 부서, 지정 상태, 등록·수정 일자를 담는다. 경기도의회 관련 업무를 어느 부서의 어떤 권한그룹 담당자가 맡고 있는지, 언제 지정되거나 바뀌었는지 확인하려는 분석가나 담당 공무원이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부서코드(chrgpsn_dept_cd)나 부서명 같은 기관 내부 코드·이름 매핑으로만 이어 쓴다.
description_portal: 경기도의정포털_담당자지정정보는 경기도 의정 활동과 관련된 행정업무 수행을 위해 특정 담당자를 지정하고 관리하는 과정을 기록한 데이터입니다. 주요 항목으로는 번호, 담당자지정시퀀스번호, 권한그룹정보 코드 및 그룹명, 담당자지정회원 시퀀스번호·아이디·전화번호, 담당자지정 등록 및 수정 관련 정보 등이 포함되어 있습니다. 이를 통해 업무별로 어떤 권한그룹에 속한 담당자가 배정되었는지 확인할 수 있으며, 담당자의 소속 부서와 역할, 지정 상태, 등록 및 수정 이력을 체계적으로 추적할 수 있습니다.
