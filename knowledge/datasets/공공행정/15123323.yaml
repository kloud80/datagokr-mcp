description_portal: 해양환경공단이 보유하고 있는 드론 장비의 현황 정보를 제공합니다. 본 데이터는 해양환경 감시, 해양쓰레기 모니터링, 오염원 조사, 해안선 촬영 등 다양한 환경업무에 활용되는 드론의 기체명, 규격, 용도, 보유기관, 수량, 주요 기능 등의 정보를 포함합니다. 드론은 기존 조사방식의 한계를 보완하고, 접근이 어려운 해역이나 해안지역에 대한 정밀 조사와 실시간 대응 역량을 강화하는 데 기여하고 있습니다. 데이터는 장비유형별, 활용목적별로 구분되어 있으며, 공공기관, 연구기관, 지자체 등에서 해양환경 조사계획 수립, 기술지원, 장비 활용 현황 파악 등의 참고자료로 활용됩니다.
