summary_user: 경기도가 설치·운영하는 각종 협의회·심의회·위원회를 한 건씩 담은 현황 자료로, 협의회명, 담당부서, 구성원 수, 설치 목적 등을 담고 기준연도(SUM_YY)가 함께 붙는다. 도정을 분석하는 연구자나 도민이 '어느 부서가 어떤 목적의 위원회를 몇 명 규모로 운영하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 협의회명·부서명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각종 협의회, 심의회, 위원회의 현황을 정리한 자료로, 협의회명, 설립년도, 담당부서, 구성원 수, 설치 목적 및 설치 근거 등으로 구성되어 있습니다. 각 협의회는 경기도 조례 또는 법령에 근거하여 설치되며, 공공정책 수립, 예산운용, 사업운영, 자문 기능 등을 수행합니다. 이 데이터는 공공기관의 행정 운영 체계, 법적 기반 위원회 구성 현황, 정책 심의 구조 등을 파악하는 데 활용될 수 있으며, 협의회 설치 목적과 근거 조항을 함께 제공하여 법적 타당성과 행정목적성을 분석하는 데 유용한 공공행정자료입니다.
