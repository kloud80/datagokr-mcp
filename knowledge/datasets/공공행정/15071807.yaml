description_portal: 서울시 축산판매업 인허가 정보는 축산물 판매업소의 인허가·영업 현황을 관리하는 데이터입니다. 관리번호를 중심으로 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자를 통해 업소 이력을 파악하고, 영업상태코드·영업상태명·상세영업상태명으로 현재 영업 여부를 확인합니다. 지번·도로명주소, 우편번호, 좌표(X,Y)는 위치·입지 분석과 지도 활용에 쓰이며, 사업장명, 전화번호, 소재지면적은 기본 현황 정보를 제공합니다. 축산업무구분명, 축산물가공업구분명, 축산일련번호, 권리주체일련번호는 축산 관련 업종과 권리 관계를 구분하는 식별 정보이고, 총인원은 인력 규모와 고용 구조 분석에 활용됩니다. 마지막으로 최종수정일자, 데이터갱신구분, 데이터갱신일자는 데이터의 최신성과 관리 이력을 확인하는 기준입니다.
