summary_user: 서울시 축산물 판매업소를 업소(관리번호) 단위로 한 건씩 담은 인허가 원장으로, 인허가·취소·휴폐업·재개업 일자와 영업상태, 지번·도로명 주소, 좌표, 소재지면적, 축산업무 구분을 포함한다. 정육점 같은 축산물 판매점이 어느 동네에 얼마나 새로 생기고 문을 닫았는지 알고 싶은 창업 준비자나 상권 분석가가 점포 이력과 입지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 같은 원천인 LOCALDATA 인허가 자료와 함께 상권 분석 원료로 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 인증키를 공공데이터포털 활용신청과 별도로 받아 호출해야 한다. 공통 식별 키가 없으므로 다른 업종·통계와 붙일 때는 주소나 이름 매칭에 의존해야 한다.
