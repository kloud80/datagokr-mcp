description_portal: '부산광역시 연제구에서 관리하고 있는 공유재산 현황으로 공유재산의 범위에는 지방자치단체 소유 또는 건설 중에 있는 재산으로 부동산, 용익물권, 지식재산권, 유가증권 등을 말하며 용도에 따라 행정재산과 일반재산으로 구분합니다.공유재산의 소재지와 지목, 면적, 관리부서 등의 정보를 제공하며 이미지파일을 통해 현장을 사진으로 확인할 수 있습니다.○행정재산 - 공용재산 : 지방자치단체가 사무용·사업용 또는 공무원의 주거용으로 사용하는 재산. 예) 청사, 시·도립학교, 박물관, 도서관, 시민회관, 관사 등 - 공공용재산 : 지방자치단체가 공공용으로 사용하는 재산. 예)도로, 제방, 하천, 시도립 공원, 구거, 유수지 등(공공시설, 기반시설) - 기업용재산 : 지방자치단체가 경영하는 기업용 또는 그 기업에 종사하는 직원의 거주용으로 사용하는 재산. 예)상·하수도, 건설중인 지하철, 공영개발 사업 등 - 보존용재산 : 지방자치단체가 법령, 조례, 규칙 또는 필요에 의하여 보존하는 재산. 예) 문화재, 보존림, 민속자료 등○일반재산 - 행정목적으로 사용하지 않거나 사용할 계획이 없는 행정재산 이외의 모든 재산. 예)행정재산의 용도폐지된 재산 등'
