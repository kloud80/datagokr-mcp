summary_user: 공정위가 등록한 프랜차이즈 가맹본부의 일반 현황을 본부 단위로 담은 데이터로, 상호·대표자·사업자등록번호·법인등록번호·기업규모·소재지·브랜드 수·계열회사 수를 가맹사업기준년도별로 제공하며 전체 8,652건이다. 창업 예정자가 "이 가맹본부를 믿어도 되나"를 확인하거나 분석가가 본부의 규모와 브랜드 수를 비교할 때 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)로 같은 공정위 가맹·기업집단·특수판매·상조 데이터와 이어 쓰고, 소재지주소(lctnAddr)로 주소 기반 데이터와도 맞춰 볼 수 있다.
description_portal: 이 API는 프랜차이즈 가맹본부의 일반 현황과 기본 정보를 조회할 수 있는 공공데이터 서비스입니다.가맹사업기준년도(필수)와 가맹본부관리번호를 이용하여 프랜차이즈 본사의 업체명, 대표자명, 사업자등록번호, 법인등록번호, 기업규모, 주소, 연락처, 홈페이지, 브랜드 수, 계열회사 수 등의 정보를 제공합니다.또한 지역명, 사업자 등록일자, 법인등기일자 등 가맹사업 운영 현황 정보를 함께 확인할 수 있어 프랜차이즈 기업 분석, 창업 정보 확인, 가맹사업 현황 조사, 가맹본부 분석 및 공공데이터 기반 서비스 개발 등에 활용할 수 있습니다.
