description_portal: 본 데이터는 경기도 광주시의회 홈페이지에서 관리하는 의안 종류 정보를 제공합니다. 시의회에서 심의하는 의안을 조례안, 예산안, 동의안, 건의안, 결의안 등 종류별로 분류한 정보를 담고 있어 의안 관리 체계를 제공합니다. 의안 종류 코드와 명칭은 각 의안의 성격과 처리 절차를 구분하는 기준이 되며, 의정 활동의 투명한 기록과 공개를 지원합니다. 본 데이터는 의회 홈페이지 운영, 의안 통계 분석, 의정 정보 제공, 의안 검색 서비스 등에 활용되며 시민들이 시의회에서 다루는 다양한 의안의 유형을 명확히 이해하고 의정 활동을 효과적으로 모니터링할 수 있도록 지원합니다.
