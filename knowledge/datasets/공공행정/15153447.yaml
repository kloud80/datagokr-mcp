description_portal: 온라인 논문 투고 및 심사 시스템(JAMS) 연도별 접속자 현황 데이터는 시스템명, 구분년도와 접속자 수 항목으로만 구성되어 있으며, 2017년부터 당해년도까지의 기간을 포함합니다. 이 데이터는 학술지 논문 투고 및 심사 시스템의 이용 추세를 연도별로 체계적으로 파악할 수 있도록 하며, 연구자와 심사위원, 학술지 운영기관의 시스템 활용 현황을 분석하는 데 유용합니다. 또한, 접속자 수 변화를 통해 학술 활동의 활성화 정도, 온라인 시스템 이용 편의성, 연구자 참여 규모 등을 객관적으로 확인할 수 있어 학술정책 수립, 연구지원 전략 개발, 시스템 개선 방향 설정, 학술지 운영 효율성 평가 등 다양한 분야에서 활용 가능합니다. 연도별 데이터를 통해 장기적 추세를 분석할 수 있으며, 접속자 수 증감 패턴을 활용하여 학술지 운영의 성장성과 지속 가능성을 평가할 수 있습니다.
