description_portal: 용산구 내 무료 공공와이파이 서비스에 대하여 위치 정보, 와이파이명, 소재지주소,  설치유형, 설치기관, 설치 년도에 대한 정보를 제공합니다. 해당 정보는 용산구 내에서 누구나 편리하게 이용할 수 있는 공공와이파이를 제공하는데 필요한 사항입니다.  “공공와이파이”란 용산구에서 누구나 무료로 이용할 수 있도록 공공목적으로 제공하는 와이파이를 말하며 확충 및 품질개선 사업에 따라 세부내역이 달라질 수 있습니다. 용산구는 주요거리, 주민센터, 전통시장 등 구민 방문이 많은 장소에 공공와이파이를 제공 및 활성화하여 균등한 정보접근권을 보장하고 정보취약계층의 정보통신서비스 이용에 어려움을 해소하고자 하며 미래 스마트도시 구현에 기여하고자 합니다.
