description_portal: '○ 통계개요* 통계명 : 혼인상태별 인구(15세 이상)* 통계종류 : 혼인상태별 인구 (15세 이상)에 대한 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책입안의기초자료 제공하고, 각종 가구관련 경상조사 표본틀(Sampling Frame)의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청(주관기관), 지방자치단체 및 6개 중앙행정기관(실시기관)- 일반조사구 : 시도 ⇔ 시군구 ⇔ 읍면동(총관리자) ⇔ 조사관리자⇔ 조사원* 공표주기 : 정기(5년, 11월1일 0시 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 인구(15세 이상)의 혼인상태별 인구현황 등○ 용어설명* 혼인 : 남편(부)과 아내(처)로 구성된 법적관계임. 법률혼주의 원칙에서 혼인신고수리의 경우와 직권에 의해 가족관계등록부기재에 의한 신고로 이뤄짐(단, 신고에 의한 것이므로 혼전동거, 별거 등 사실혼과는 차이가 있을수 있음)* 이혼 : 법률혼주의 원칙에서 이혼신고 수리에 의한 신고와 재판이혼(조정, 심판혹은 판결)의 경우는 직권에 의하여 가족관계등록부기재에 의한 신고로 이루어짐○ 기타* 외국인은 제외* 남편의 주소지 기준으로 집계한 것임* 혼인상태 : "동거"는 "배우자있음", "별거"는 "이혼"에 포함○ 출 처 : 통계청 조사관리국 인구총조사과'
