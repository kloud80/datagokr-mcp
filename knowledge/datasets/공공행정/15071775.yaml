summary_user: 서울시 전화권유판매업(텔레마케팅 등 전화로 소비자에게 재화 판매를 권유하는 업소)의 인허가 원장을 업소 1건 단위로 담으며, 인허가·취소일, 영업상태, 폐업·휴업일, 지번·도로명 주소, 중부원점TM 좌표, 자산규모·자본금 등을 포함한다. 소비자나 분석가가 특정 전화권유판매 업체가 정식으로 신고돼 지금도 영업 중인지, 서울 어느 자치구에 이런 업체가 몰려 있는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 원천이 같은 LOCALDATA 지방행정 인허가 데이터와 함께 쓰인다.
description_portal: '해당 데이터는 서울시 전화권유판매업 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.텔레마케팅과 같은 전화를 이용하여 소비자에게 권유하거나 전화회신을 유도하는 방법으로 재화 등을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
