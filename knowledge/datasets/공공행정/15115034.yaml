summary_user: 서울 강남구에서 의료업을 주된 목적으로 설립된 의료법인의 인허가 정보를 법인(사업장) 한 건씩 담는 원장 데이터로, 인허가일자·영업상태·폐업·휴업일자, 도로명·지번 주소, 좌표, 병상 수·면적 같은 항목이 들어 있다. 강남구에서 영업 중이거나 폐업한 의료법인이 어디에 있고 언제 문을 열고 닫았는지를 확인하려는 분석가나 의료업 관련 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 이어 쓰며, 같은 원천을 공유하는 LOCALDATA 인허가 데이터와 함께 상권·점포 이력 분석에 쓴다.
description_portal: 서울시 강남구 의료법인 인허가 정보(https://data.seoul.go.kr/dataList/OA-16356/S/1/datasetView.do)서울특별시 강남구 지역에서 의료업을 주된 목적으로 하여 설립된 법인 정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다.데이터 활용시 참고하시기 바랍니다.
