description_portal: 이 자료는 한국가스기술공사의 연간 신규채용현황을 체계적으로 정리한 것으로, 상임임원, 일반정규직, 무기계약직분야의 연간 채용인원을 포괄합니다. 한국가스기술공사의 연간 채용인원을 확인할 수 있습니다. 인원산출 방식은 기획재정부의 알리오 공시 작성기준을 토대로 산출하였으며, 시간선택제 채용인원의 경우 1일 8시간 근무시간을 기준으로 환산하여 반영하였습니다.(예:1일 4시간 근무=0.5명)현재 사회적으로 이슈되는 청년채용과 관련하여 이 파일을 활용 할 수 있으며, 기재부 정원 확정 등 향후 청년채용 정책에도 도움이 될 수 있습니다.
