description_portal: 공공데이터 혁신포털에서 운영하고 있는 기관별 제공 사이트 정보를 체계적으로 정리한 자료로, 중앙부처와 지방자치단체, 공공기관 등이 운영하는 다양한 온라인 사이트 현황을 종합적으로 파악할 수 있도록 구성되어 있다. 데이터에는 기관명과 기관유형, 담당부서, 운영사이트명, URL, 서비스 내용, 운영현황 등이 포함되어 있으며, 공공데이터 제공 및 활용 정책을 추진할 때 각 기관의 사이트 운영 실태를 분석하는 데 유용하게 활용될 수 있다.공공기관이 보유한 온라인 플랫폼과 서비스의 분포를 한눈에 확인할 수 있게 함으로써, 국민에게 제공되는 서비스 채널의 특성을 분석하고 기관 간 운영사이트 현황을 비교하는 데 도움을 준다. 또한 공공서비스 품질을 향상시키기 위한 중복 서비스 점검이나 데이터 기반의 행정혁신 과제 발굴, 기관별 디지털 전환 수준 분석 등 다양한 행정적 목적에 활용될 수 있다.
