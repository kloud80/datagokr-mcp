description_portal: 홈페이지 게시판 목록 데이터는 기관 홈페이지 내에서 운영되고 있는 각 게시판의 전체 목록과 관리 속성을 체계적으로 정리한 자료로, 홈페이지 콘텐츠 관리 체계(CMS)의 구조와 운영 현황을 파악하는 데 사용되는 핵심 관리 데이터입니다. 각 게시판은 고유의 목적과 기능을 가지고 있으며, 데이터에는 게시판 이름, 게시판 생성·등록 일시, 게시판별 파일 업로드 허용/차단 확장자 규칙(파일확장자필터) 등이 포함되어 있습니다.이 자료는 홈페이지 내 게시판 구성의 전체적인 맵(Map)을 제공하며, 신규 게시판 개설, 정보구조(IA) 재편, 게시판 통폐합 검토, 콘텐츠 업로드 정책 검토 등 운영 관리 목적으로 활용될 수 있습니다. 특히 파일확장자필터 항목은 각 게시판에서 업로드될 수 있는 파일 형식(exe, bat 등 위험파일 차단 포함)을 정의함으로써, 보안 정책 관리, 악성파일 유입 차단, 게시물 품질 관리에 중요한 역할을 할 수 있습니다.
