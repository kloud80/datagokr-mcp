description_portal: '오피스텔의 위치와 건축물 정보를 수집한 데이터 입니다.부평역 등 주요 역세권을 중심으로 형성된 오피스텔 공급 현황을 파악하고, 지역별 주거 밀도 분석, 부동산 정책  수립, 민간 기업의 비즈니스 타겟팅 등 다양한 분야에서 기초자료로 활용할 수 있습니다.활용 목적 및 특징– 행정동별 오피스텔 밀집도를 분석하여 지역별 주거 분포 파악– 지역 부동산 시장의 공급 흐름 분석– 오피스텔 밀집 지역의 생활 인프라(주차장, 쓰레기 처리, 치안 등) 확충 근거 마련– 오피스텔 거주 인구를 타겟으로 하는 배달서비스, 편의점, 세탁소 등 근린 생활시설 입지 선정 자료주요 항목 설명● 연번: 데이터의 고유 번호● 지번주소: 지번 체계에 따른 부평구 내 토지 위치● 도로명주소 : 건물에 부여된 공식 도로명 주소● 법정동 : 행정 구역 단위(예: 부평동, 산곡동 등)● 오피스텔명 : 해당 건축물의 공식 명칭● 건물용도 건축물대장상 기재된 용도 구분'
