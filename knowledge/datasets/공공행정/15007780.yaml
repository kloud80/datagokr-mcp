description_portal: '본 데이터는 부산광역시 동래구 내에 위치한 사회적기업들의 현황을 체계적으로 정리한 자료입니다.사회적기업의 주요 정보와 인증 현황을 포함하여, 지역 내 사회적경제 활성화 및 관련 정책 수립에 필요한 기초자료로 활용할 수 있습니다.주요 제공 항목은 다음과 같습니다:기관명: 사회적기업의 공식 명칭사회서비스분야: 해당 사회적기업이 활동하는 사회서비스 분야주된목적: 사회적기업 설립 및 운영의 주요 목적사업내용: 수행하는 사업의 구체적 내용인증여부: 사회적기업 인증 상태(인증/미인증)예비형태: 예비 사회적기업 여부 및 형태인증일자: 사회적기업 인증을 받은 날짜인증번호: 인증서 발급 번호대표자명: 사회적기업 대표자의 이름전화번호: 연락 가능한 대표 전화번호도로명주소: 사회적기업 소재지 도로명 주소지번주소: 사회적기업 소재지 지번 주소데이터기준일자: 해당 데이터가 기준으로 하는 날짜이 데이터는 사회적기업 지원 정책, 네트워크 구축, 지역사회 공헌 사업 기획, 그리고 인증 관리 등에 활용되며,정기적인 갱신을 통해 최신 정보를 유지합니다.추가 정보가 필요하거나 문의사항이 있을 경우 부산광역시 동래구청 일자리경제과에 연락하시기 바랍니다.'
