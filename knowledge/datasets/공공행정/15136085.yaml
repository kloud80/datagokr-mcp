description_portal: 한국사학진흥재단에서 제공하는 "상환계획목록" 데이터는 사립학교 교육환경개선 자금 융자 사업 등 융자금의 현황을 체계적으로 보여주는 자료입니다. 이 데이터는 각 연도별로 학교들이 얼마나 지원을 받았는지, 그에 따른 상환의 규모와 현황, 그리고 남은 융자잔액까지 추적할 수 있도록 상세 항목으로 구성되어 있습니다.이 데이터는 △지원연도 △지원학교수 △연간지급액 △상환액 △융자잔액 등 항목을 포함합니다. - ‘지원연도’는 각 사업별로 융자금이 지급된 연도를 의미합니다. - ‘지원학교수’는 해당 연도 내 융자 지원을 받은 학교의 총 수를 나타냅니다. - ‘연간지급액’은 해당 연도에 실제 지급된 융자금 총액(억 원 단위)을 의미합니다. - ‘상환액’은 그 해에 학교 등 수혜기관이 상환한 원리금(즉, 융자금의 일부 또는 전액 반환 산출액)을 의미합니다. 원금 외에도 이자가 포함되는 경우가 있으며, 실질적인 채무 이행 상황을 알 수 있는 지표입니다. - ‘융자잔액’은 해당 시점 기준으로 아직 상환되지 않은 융자금의 남은 금액(잔존 채무)을 뜻합니다. 이 항목은 미래 상환계획 수립과 재단의 재정 건전성 평가에도 중요한 자료로 활용됩니다
