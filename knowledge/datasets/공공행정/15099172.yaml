description_portal: '서울특별시 강남구_공공조형물 현황도시의 미관 개선, 문화·예술 진흥, 주민의 문화 향유 기회 확대 등을 목적으로 강남구는 관내 주요 장소에 다양한 공공조형물을 설치·관리하고 있습니다. 이에 따라 공공조형물 현황 데이터를 제공하여 도시경관 관리, 문화정책 수립, 공공자산 관리 등에 활용할 수 있도록 하고 있습니다.개방 데이터는 조형물 명칭, 위치, 설치연도, 관리부서, 데이터 기준일자 등의 항목으로 구성되어 있습니다.※ 수집 시점 기준으로 지속적으로 업데이트되며, 일부 정보는 현장조사, 관리기관 보고 등에 따라 갱신됩니다.데이터 활용 기대효과로는 다음과 같습니다.▶ 도시경관 및 공공자산 관리: 도시 미관 개선 및 공공조형물의 체계적 유지·보수 계획 수립에 활용▶ 문화·예술 연구: 학계·연구기관에서 지역 공공예술의 분포, 설치 추이, 조형물 유형 분석 등에 활용▶ 관광·시민 서비스 제공: 시민 및 관광객이 주요 조형물 정보를 활용하여 문화 산책로, 관광코스 등을 설계하는 데 활용 가능▶ 행정업무 지원: 구청 및 유관기관이 공공조형물의 현황을 파악하여 예산 편성, 안전점검, 재배치 검토 등에 활용 가능'
