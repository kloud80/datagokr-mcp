summary_user: 충청북도 보은군이 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 소규모 CSV 파일(약 2.7KB)로, 업종·업소명·주소·연락처와 대표 메뉴 최대 3개 및 그 가격을 담는다. 보은군 주민이나 방문객이 '보은에서 저렴하게 식사하거나 이용할 수 있는 착한가격업소가 어디이고 메뉴 가격은 얼마인가'를 찾을 때 쓰고, 분석가는 지역 물가·소상공인 지원 현황을 볼 때 참고한다. 전역 조인 키가 없어 다른 시군구 착한가격업소 현황이나 지방행정 인허가(LOCALDATA) 자료와는 업소명·주소를 매칭해서만 이어 쓴다.
limits: 사업자등록번호나 인허가 번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 업소명·주소 문자열 매칭에 의존해야 한다. 범위는 보은군 한 곳뿐이고 좌표가 없어 지도 분석에는 주소 지오코딩이 따로 필요하다.
