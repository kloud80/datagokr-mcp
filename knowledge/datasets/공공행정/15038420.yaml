summary_user: 광양시의회에 발의·접수된 의안을 한 건씩 담은 파일로, 대수·의안번호·제안종류·제안일자·제출자·의안명·소관위원회와 위원회·본회의 처리결과, 집행기관 이송일을 포함한다(CSV 약 160KB). 시민이나 연구자가 '이번 대수 광양시의회에서 의원 발의 조례안이 몇 건이고 어느 상임위에서 어떻게 처리됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 의회 데이터(회의록·회기 통계 등)와는 의안번호·의안명·대수 같은 이름·번호 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: '본 자료는 전라남도 광양시의회에서 발의·접수된 의안의 주요 정보를 체계적으로 정리한 공공데이터로, 시민 누구나 의회의 입법 및 정책 활동을 투명하게 확인할 수 있도록 제공됩니다. 해당 데이터는 제안종류, 제안일자, 제출자, 의안명, 소관위원회분류 등의 항목으로 구성되어 있으며, 조례안, 예산안, 승인안, 결의안 등 다양한 형태의 의안 정보를 포함합니다.특히 제안종류와 의안명은 의안의 성격과 목적을 명확히 파악할 수 있도록 하며, 제출자 항목을 통해 발의 의원 또는 집행부 제안 여부를 구분할 수 있어 의정 활동의 책임성과 주체성 분석에 활용됩니다. 또한 소관위원회분류는 해당 안건이 어느 상임위원회에서 심사·논의되는지 파악할 수 있어 시민 의견 제출, 회의 방청, 정책 대응 등에 참고할 수 있습니다.이 데이터는 정기적으로 갱신되며, 광양시의회 홈페이지 및 공공데이터포털 등을 통해 무료로 개방되어 있어, 시민의 알권리 보장, 참여민주주의 확대, 학술연구 및 정책분석 자료로서의 활용도가 높습니다. 특히 의회 회의록, 처리결과, 회기별 통계와 연계할 경우, 지방의회의 의정 성과 평가 및 정책 흐름 분석에도 효과적으로 활용될 수 있습니다.*공란 사유: 해당 의안 부결 및 보류에 따른 미정사항임'
