description_portal: 경기도 하남시립도서관 홈페이지에 게시된 공지,행사,프로그램 정보를 체계적으로 기록한 도서관 게시물 운영현황 자료로, 게시판번호와 게시물번호를 통해 게시물마다의 위치와 구분을 명확하게 식별할 수 있습니다. 게시물제목은 사회적 거리두기 안내, 부분 개관 공지, 문화강좌 안내 등 도서관이 시민에게 제공하는 핵심 서비스 정보의 성격을 드러내며, 조회수는 시민의 관심도와 정보접근도 분석의 주요 지표로 활용됩니다. HTML사용여부는 본문에 링크,표,이미지 등 다양한 웹표현 방식을 적용했는지 판단할 수 있어, 사용자 편의성과 정보 전달력 평가에 중요한 요소입니다. 최초등록일자는 공지 시점, 운영정책 변동 시기, 도서관 서비스 변화 흐름을 파악하는 데 유용하며, 게시물 갱신 주기를 분석하는 근거가 됩니다.
