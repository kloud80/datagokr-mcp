summary_user: 조달청 공사원가통합관리시스템의 표준공사코드 중 순수자원분류 체계를 분류 항목 단위로 담은 코드표 파일(CSV, 약 415KB)로, 물품관리구분·물품분류번호·상위물품분류번호·레벨·분류명·분류설명을 전국 범위로 제공한다. 수요기관 공사 담당자나 원가 분석가가 시설공사 내역서를 작성할 때 자재·노무·장비 같은 자원이 어느 분류에 속하고 상위 분류가 무엇인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 같은 조달청 공사원가 계열 데이터와는 물품분류번호나 분류명을 매핑해 잇고, 상위물품분류번호와 레벨로 분류 계층을 재구성한다.
description_portal: ○ 시설공사 원가계산에 사용하는 자료를 목록화하고, 개방형 설계내역서 자료 호환 양식인 공사원가호환규정을 수립하여, 공사원가계산을 웹에서 처리할 수 있는 시스템을 개발○ 조달청 공사원가통합관리시스템에서 제공하는  표준공사코드의 세부항목을 제공하는 서비스○ 공사원가 산정업무의 효율성과 가격의 객관성을 확보하기 위해 ‘표준공사코드’ 체계를 운영 중○ 시설자재, 노무비, 기계경비, 세부공종 등에 대해 수요기관이 공사내역 작성 시 활용할 수 있도록 표준공사코드를 제공○ 순수자원분류의 물품관리구분, 물품분류번호, 상위물품분류번호, 레벨, 분류명, 분류설명을 조회
