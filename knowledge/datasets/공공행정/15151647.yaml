summary_user: 경기도 시군구별·시간대별·업종(중분류)별 카드매출금액과 비율, 전월·전년동월 대비 증감값과 증감비율을 기준년월 단위로 담은 집계 통계다. 상인·창업자나 상권 분석가가 '우리 시군구에서 이 업종 매출이 몰리는 시간대는 언제인가'를 따져 영업시간이나 마케팅 시점을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 시군구코드(signgu_cd)를 행정구역 코드·이름과 맞추거나 같은 기관(경기도)의 다른 카드매출 집계와 코드로만 이어 쓴다.
description_portal: 이 데이터는 경기도 시군구 단위의 카드매출을 시간대별로 집계한 통계자료입니다. ‘기준년월’과 ‘시군구코드’, ‘시간대코드’를 기준으로 특정 업종(중분류업종코드)에서 발생한 매출금액 및 비율, 전월 및 전년동월 대비 증감값과 증감비율을 포함합니다. ‘시간대코드’는 하루를 여러 시간 구간으로 나누어 매출 발생 시점을 구분하며, 이를 통해 시간대별 소비 활동 패턴을 분석할 수 있습니다. 주요 항목으로는 ‘기준년월’, ‘시군구코드’, ‘시간대코드’, ‘중분류업종코드’, ‘매출금액’, ‘매출금액비율’, ‘전월대비증감값’, ‘전월대비증감비율’, ‘전년동월대비증감값’, ‘전년동월대비증감비율’이 있으며, 유동인구 및 소비자의 시간대별 소비 성향을 파악하여 매장 운영시간 조정, 마케팅 타이밍 전략 수립 등 실무 활용에 적합합니다.
