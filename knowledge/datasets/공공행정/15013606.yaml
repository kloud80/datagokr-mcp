summary_user: 경상남도 거제시에 있는 관공서를 기관 한 곳당 한 행으로 담은 원장 파일로, 면동·기관명·우편번호·주소와 위도·경도 좌표, 연락처·팩스를 포함한다(시군구 범위, csv 약 4KB). 시민이나 사업자가 '우리 동네 면·동에 있는 관공서는 어디이고 전화·팩스 번호는 무엇인가'를 찾을 때, 분석가가 거제시 관공서의 분포를 지도에 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 면동 이름이나 기관명을 맞추거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 경상남도 거제시에 있는 관공서의 현황 정보를 제공합니다. 각 관공서의 면동, 기관명, 우편번호, 주소와 함께 위치 확인이 가능한 위도·경도 정보가 포함되어 있으며, 연락처와 팩스 정보도 제공됩니다. 이를 통해 시민과 기업은 필요한 관공서를 쉽게 찾고 연락할 수 있으며, 행정 서비스 이용이나 업무 협력, 지역 정보 분석 등 다양한 목적으로 활용할 수 있는 유용한 자료입니다. 또한 지역 행정 운영과 정책 수립을 위한 기초자료로도 활용할 수 있습니다. 이 데이터는 거제시 내 관공서의 분포와 특성을 한눈에 파악하는 데에도 도움을 줍니다.
