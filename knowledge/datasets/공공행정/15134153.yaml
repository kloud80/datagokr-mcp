summary_user: 경기도 양평군 안에 설치된 무인민원발급기 26대를 1대당 1행으로 담은 설치 원장으로, 설치장소·운영시간·장애인 편의기능(점자라벨, 음성안내, 휠체어 조작 등)·발급민원 종류·주소·위도와 경도를 담는다. 양평군 주민이나 분석가가 '집 근처에서 주말에 서류를 뗄 수 있고 휠체어로 쓸 수 있는 발급기가 어디 있나'를 찾을 때 쓴다. 전역 조인 키는 없어 다른 지역 무인민원발급기 표준데이터나 연도별 발급현황과는 발급기명·주소 매핑이나 위도·경도 기준의 공간 결합으로 잇는다.
description_portal: 2026년 3월 12일 기준 경기도 양평군 무인민원발급기 설치현황.양평군 내 26개 양평군청, 양평읍사무소, 강상면사무소, 강하면사무소, 용문면사무소를 비롯한 26개 무인민원발급기.민원인의 편의 제공을 위한 무인민원발급기로 각종 민원 서류, 제증명, 증명서 등을 발급 가능.장소, 운영시각, 촉각패드, 휠체어 사용, 음성안내, 이어폰소켓, 발급민원 등  각종 무인민원발급기에 대한정보를 제공.*각 무인민원발급기로 발급 가능한 서류 정보 및 수는 연도별 무인민원발급기 발급현황 데이터로 확인 가능
