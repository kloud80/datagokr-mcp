description_portal: 대구광역시 서구의 외국인토지거래신고 자료 현황입니다. 국적별, 취득용도별,취득원인별 전체 자료의 통계 현황입니다. 당해분기 취득면적, 취득금액, 공시지가금액 등의 내용을 포함합니다.본 데이터는 대구광역시 서구 내에서 이루어진 외국인 토지거래 신고 현황을 집계한 통계자료이다. 주체별, 국적별, 취득원인별 및 취득용도별로 구분하여 당해 분기 동안 취득 및 처분된 토지의 필지 수, 면적, 거래 금액, 공시지가 금액을 상세히 기록하고 있다. 특히 미국교포와 순수외국인의 토지 취득 실적을 비롯하여 계약 및 계약 외 취득 건수를 구분하여 제공함으로써 외국인 토지 거래의 전반적 현황 파악에 유용하다. 본 자료는 토지 정책 수립 및 외국인 투자 현황 분석에 기초 자료로 활용된다.
