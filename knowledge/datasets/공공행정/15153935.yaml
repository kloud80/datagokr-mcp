description_portal: '* 경상북도 울릉군_불법주정차 주민신고제 신고 및 과태료 현황 공공 데이터 자료는 울릉군 내 주민신고제를 통하여 접수된 정보로 구성된 데이터입니다.* 행정 시스템(불법주정차과태료) 이전 및 변경으로 인하여 2024년도 6월 이전 자료는 정보 이관 과정에서 정보가 누락되어, 2024년도 7월 이후부터 집계 된 점 양해부탁드립니다.* 본 데이터는 2024년도 7월 이후 부터 주민신고제(6대불법주정차 금지구역)를 통하여 접수된 불법주정차 데이터를 수집하여 집계 및 등록한 데이터입니다.* 주민신고제(6대불법주정차금지구역) - 1.소화전 5m, 2.교차로 모퉁이 5m, 3.버스정류소 10m, 4.횡단보도, 5.어린이보호구역, 6.인도 * 향후 연간마다 데이터를 업데이트를 할 예정입니다.* 불법주정차 관련 자료  및 궁금한 점이 있을시 경상북도 울릉군 울릉읍 도동2길 66(울릉군청 경제교통정책실 교통지도팀 서형석 주무관 054-790-6274)로 문의하여 주시기 바랍니다.'
