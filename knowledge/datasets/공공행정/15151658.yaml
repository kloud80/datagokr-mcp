summary_user: 경기도 내 행정동을 한 행에 하나씩 담은 기준 목록으로, 행정동코드(admdong_cd)와 시군명·구명·동명·리명을 담고 범위는 경기도, 행정단위는 읍면동이다. 분석가가 지역화폐 결제나 소상공인 매출 같은 주소 기반 자료를 시군·읍면동 단위로 묶어 집계할 때, 행정동 이름과 코드를 맞추는 기준표로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동코드나 시군·동 이름 매핑, 또는 경기도 데이터끼리의 같은 코드 체계로만 연결한다.
description_portal: 이 데이터는 경기도 내 행정동의 지역 정보를 담고 있으며, 각 행정동에 대한 고유 코드(행정동코드), 시군명, 구명, 동명, 리명 등의 항목으로 구성되어 있습니다. 지역 행정단위의 세부 정보를 체계적으로 제공함으로써, 주소 기반 데이터 분석, 지역별 통계 집계, 공공행정 시스템과의 연계 등에 활용될 수 있습니다. 예를 들어, 주소를 기반으로 하는 소상공인 매출 분석, 지역화폐 소비 패턴 분석 등 다양한 지리정보 연계 분석에서 이 데이터는 기준점 역할을 합니다. 특히 동명과 리명이 함께 제공되어, 도시지역과 농촌지역 모두에 대해 상세한 공간 식별이 가능하며, 지역정책 수립 시 행정구역 단위의 분석 자료로 적합합니다.
