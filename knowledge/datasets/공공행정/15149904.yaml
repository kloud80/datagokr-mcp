description_portal: 지표누리는 통계청에서 관리 및 운영하는 6종 지표체계(e-나라지표, 국가발전지표, 한국의 사회지표, 국민 삶의 질 지표, 저출생 통계지표, SDG)를 통합하여 국민들이 한 곳에서 쉽고 편리하게 지표를 이용할 수 있도록 다양한 지표를 제공하는 지표 통합서비스입니다.지표누리 서비스는 각 지표별로 핵심이 되는 정보를 요목조목 설명하고 있어 이해하기 쉽다는데 의의가 있습니다. 지표에 대해 그래프 형태의 시각화된 시계열 정보는 물론 지표의 정의, 해설, 상세 통계표 등도 함께 제공하여 국정운영 상황 및 국가발전, 국민의 웰빙 등 주제별 핵심 정보를 정책결정자, 일반 국민등이 직관적이면서도 깊이 이해될 수 있게 양질의 정보를 선별하여 제공하는데 주안점을 두고 있습니다.해당 데이터는 국민 삶의 질 지표의 지표별 직전 대비 개선, 동일, 악화 여부를 확인할 수 있는 데이터입니다.
