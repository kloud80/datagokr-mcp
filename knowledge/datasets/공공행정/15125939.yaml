summary_user: 국회예산정책처에 들어온 정보공개청구를 건별로 담은 목록으로, 연도(YR)·일련번호별로 청구 사유, 담당 부서, 공개·비공개 결정 구분과 사유, 결정 통지일, 공개일, 공개 방법·형태, 공개 파일명을 담는다. 정보공개를 청구하려는 국민이나 분석가가 "예산정책처는 어떤 청구를 비공개로 결정했고, 그 사유는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했다. 다른 국회 기관의 정보공개 처리현황과는 연도나 부서명 같은 이름 매핑으로만 맞춰 볼 수 있다.
