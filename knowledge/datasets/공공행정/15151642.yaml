summary_user: 경기도에 있는 읍면동 행정구역 하나하나를 행 단위로 담은 목록으로, 읍면동코드·읍면동명·상세주소·등록일자(생성일자)를 담는다. 분석가가 경기도 유동인구나 시군구 단위 자료를 읍면동 단위로 다시 나눠 보려 할 때, 이 지역에 어떤 읍면동이 있고 주소가 어떻게 표기되는지 확인하는 기준표로 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 데이터와는 읍면동명이나 코드를 직접 매핑하거나, 경기데이터분석 시스템의 같은 기관 코드 체계로만 이어 쓴다.
description_portal: 이 데이터는 경기데이터분석 시스템에서 데이터 분석을 위해 경기도에 위치한 읍면동 단위의 행정구역 정보를 담고 있는 리스트 형태의 자료입니다. 각 행정구역은 고유의 ‘읍면동코드’를 가지며, ‘읍면동명’과 함께 ‘상세주소’가 제공되어 실제 지리적 위치를 파악할 수 있도록 구성되어 있습니다. 또한 ‘등록일자’ 항목을 통해 행정구역의 생성일자를 확인할 수 있습니다. 이 데이터는 지역 기반 통계 분석, 행정구역 매핑, 주소 정제 및 데이터 전처리 등에 활용 가능하며, 특히 유동인구 데이터나 각종 시군구 기반 자료와 연계하여 사용 시 읍면동 단위의 정확한 공간적 분석을 지원할 수 있습니다.
