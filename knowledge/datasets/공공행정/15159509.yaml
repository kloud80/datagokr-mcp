description_portal: 수의계약정보 데이터는 제주관광공사에서 추진한 수의계약 관련 게시 정보(2010년 5월 11일부터 2016년 4월 21일까지)를 제공하는 데이터입니다.항목은 순번, 제목, 작성일, 조회수, 첨부파일명, 첨부파일주소, 내용으로 구성되어 있으며, 계약 체결 내역과 관련 자료를 확인할 수 있습니다.해당 데이터는 기관의 계약업무 이력과 행정 운영의 투명성을 확인할 수 있는 기초자료로 활용 가능하며, 시기별 계약 현황 분석 및 공공조달 정책 연구에도 참고자료로 활용될 수 있습니다.단, 2015년 12월 이후 수의계약 정보는 제주관광공사 계약정보공개시스템에서 별도 관리되어 본 데이터의 추가 업데이트는 제공되지 않습니다.
