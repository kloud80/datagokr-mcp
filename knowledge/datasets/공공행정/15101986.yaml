description_portal: 한국수력원자력(주)이 공개하는 원전인근 지진관측소 현황에 대한 데이터 입니다. 한국수력원자력(주)은 원자력발전소의 안전관리를 위해 원전 인근에 지진관측소를 설치하여 운영하고 있습니다. 이 데이터는 고리원자력발전소, 새울원자력발전소, 월성원자력발전소, 한울원자력발전소, 한빛원자력발전소 인그에 설치하여 운영 중인 지진관측소들에 대한 정보로, 지진계와 기록계 종류 및 위치에 대한 정보를 포함하고 있습니다. 해당 관측소에 기록된 지진자료들은 행안부와 기상청에 연계 중에 있으며, 원전 인근 지진발생시 빠른 정보를 제공하고 있습니다.
