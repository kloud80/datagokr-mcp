description_portal: 주민등록증 발급은 신분의 공적 확인, 주민등록체계의 실효성 확보, 국민권리 실현의 기반 등 모든 공적 서비스 접근시 기초자료로 활용됩니다. 주민등록증 재발급은 기존에 발급받은 주민등록증이 분실, 훼손, 주민등록사항 변경 등의 사유로 더 이상 사용이 어려울 경우, 신청인의 요청에 따라 새로운 주민등록증을 다시 발급해주는 행정행위입니다. 다음은 경상남도 창원시 마산회원구 내서읍의 2020, 2021, 2022년도  주민등록증 재발급 시, 행정복지센터 방문하여 재발급 신청한 건수와 인터넷으로 재발급 신청한 건수 현황입니다.
