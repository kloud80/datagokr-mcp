description_portal: 공약사업 데이터는 선거를 통해 당선된 공직자가 제시한 공약의 추진 현황, 예산 사용, 성과 등을 담은 정보입니다. 이 데이터를 개방하면 시민들이 공약 이행 여부를 직접 확인하고 평가할 수 있어 행정의 투명성과 책임성이 높아집니다. 또한 시민, 언론, 연구자 등이 이를 분석해 정책 제안이나 감시 활동에 활용할 수 있어 참여 민주주의 실현과 공공행정의 신뢰 제고에 기여합니다. 이러한 점들과 행정의 투명성과 신뢰성을 높이기 위해 민선7기 대구광역시장 공약사항에 대해서 공약이행 주체, 공약이행시기, 공약이행추진상황, 소요재원현황 등을 공개하여 시민들의 신뢰제고에 기여하도록 합니다.
