description_portal: (데이터 수집목적 및 과정) 경상남도 공공행정 연령별 성별 사유별 전입인구 데이터는 통계청 데이터를 활용하여 연령별 성별 사유별 경상남도에 전입한 인구에 대한 정보를 제공합니다. 2024년 7월 기준 경상남도 인구의 전입에 대한 전입 지역, 연령, 성별, 사유를 파악할 때 활용할 수 있습니다.(데이터 구성 및 세부항목) 데이터는 연도, 기존거주지, 전입시도, 전입사유, 연령, 성별, 인원수로 구성됩니다. 해당 링크를 통해 접속하면 데이터를 조회 및 다운로드 하실 수 있습니다.(데이터 현행화 시기) 해당 데이터는 연간 현행화 데이터입니다. 차기 업데이트 예정일은 2025년 7월 입니다.
