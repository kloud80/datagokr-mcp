description_portal: '경영목표 변경이력은 한국남부발전이 연도별로 수립하고 조정해 온 중장기 경영목표의 변경 이력을 정리한 자료입니다. 각 연도별로 목표연도(예: 2020, 2025), 매출 및 영업이익 목표, 안전문화(예: 글로벌 안전지수 등급), 발전기술 지표(고장정지율 등), 기업문화, 지속가능성, 친환경 성장, 재무관리, 청렴윤리, 탄소중립 등 다양한 항목별 목표 설정 내역이 포함되어 있어 기업의 경영전략 방향과 정책 중점이 어떻게 변화해 왔는지를 한눈에 파악할 수 있습니다. 특히 GWP 신뢰지수, 청렴도, 신재생 발전 비중 등의 내용은 공공기관으로서의 책임경영 실천을 잘 보여주는 지표이며, 친환경성과 투명성, 기술혁신을 추구하는 공기업의 변화를 정량적·정성적으로 살펴볼 수 있습니다. 이 자료는 공공기관 경영전략 수립 사례 분석, ESG 평가 연구, 에너지 공기업 정책 방향 검토 등에 유용하게 활용될 수 있으며, 일반 국민도 공기업이 어떤 가치와 목표를 향해 나아가고 있는지 쉽게 이해할 수 있도록 도와줍니다. 또한 데이터 시각화를 통해 전략 항목별 목표 변화 추세를 쉽게 전달할 수 있습니다.'
