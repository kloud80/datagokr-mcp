description_portal: 해외 IP5의 주요 지식재산권판례 데이터는 2012년부터 2015년까지 미국, 유럽, 일본, 중국 등 IP5 해외 국가의 주요 지식재산권 판례 데이터입니다.법원국가, 사건번호, 원·피고, 판결일, 판결결과를 체계적으로 정리한 자료와 더불어 해당 판례에 대한 본문 URL이 포함되어있습니다.해외 IP5의 주요 지식재산권판례 데이터에는 유럽 380건, 미국 1184건, 일본 354건, 중국 816건의 판례 데이터로 구성되어 있습니다.해당 데이터 항목들을 통하여 해외 진출 전, 글로벌 분쟁 동향과 권리해석, 손해배상 판단 기준 등을 비교 분석 활용함으로써 사전에 분쟁을 예방할 수 있는 기대 효과를 가지고 있습니다.
