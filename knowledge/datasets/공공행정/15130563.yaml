description_portal: '- 전라남도의회 홈페이지에 게재된 전라남도의회 상임위원회별 구성(직책, 이름, 선거구, 정당)에 대해 조회하실 수 있습니다.- 제12대 전라남도의회(2022년 7월 출범): 총 38명(지역구 + 비례)의 도의원이 활동 중이며, 의장단과 상임위원회로 구성돼 있습니다 - 상임위원회: 보건복지환경위, 경제문화관광위, 건설도시위원회, 의회운영위원회 등 다수 설치- ESG, 청년·소상공인, 돌담문화, 주취자 보호 등 다양한 정책적 조례를 발의·처리-조례 제정 및 개정- 예산 심의·승인: 도 예산안에 대한 심의 및 조정, 재정분권 강화 역할 수행.- 행정사무 감사: 집행기관(도청 등)에 대한 감사, 견제 기능 수행.- 민원 해결 및 현장 중심 의정: 도민 요청 수렴, 정책 반영 및 현장 방문 등.'
