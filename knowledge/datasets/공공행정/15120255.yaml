description_portal: 본 데이터는 인천광역시 동구에서 체결된 협상계약에 대한 세부 현황을 항목별로 정리한 자료이다. 계약을 담당한 관서 및 부서를 비롯하여, 사업명과 제안서 접수일, 참여업체 순번, 업체명 등 계약 참여 관련 정보를 포함한다. 아울러 평가위원의 평가 점수, 최고·최저 점수를 제외한 평균, 평가 점수의 합계 및 입찰가격 평가 점수 등 평가 항목에 대한 수치 정보도 함께 제공된다. 또한, 계약 참여 업체의 최종 순위와 경쟁입찰 여부, 정량평가와 정성평가 항목별 점수도 확인할 수 있다. 데이터는 수의계약의 공정성과 투명성을 확보하기 위한 정보 공개의 일환으로, 행정기관의 계약 평가 체계를 이해하고 계약과정의 객관성 확보를 위한 분석자료로 활용할 수 있다.
