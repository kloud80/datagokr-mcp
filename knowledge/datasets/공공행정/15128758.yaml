summary_user: 한국국토정보공사가 조달청 전자조달시스템으로 체결한 계약을 건별로 담은 파일(csv)로, 계약번호·공사명·계약체결일자·총계약금액과 금차계약금액·계약체결방법·근거법률·수요기관과 업체 목록을 한 줄에 담는다. 분석가나 기업이 '한국국토정보공사는 어떤 방법으로 어느 업체와 얼마 규모의 계약을 맺었나'를 확인하거나 예산 집행 흐름을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 계약번호·공고번호나 업체명·기관명 같은 이름 매칭으로만 이어 쓴다.
limits: 표준 기관코드나 사업자번호 같은 공통 키가 없어 다른 조달·기업 데이터와 정확히 결합하기 어렵고, 이름 매칭에 기대야 한다. 범위는 전국이지만 공간 정보가 없어 지역별 분석에는 쓰지 못한다.
