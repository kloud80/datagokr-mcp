summary_user: 법제처 open.law.go.kr에서 법령 한 건마다 법령명·법령ID·법령일련번호·법령구분·공포번호·공포일자·시행일자·소관부처·제개정구분·현행/연혁 여부를 돌려주는 전국 범위의 법령 목록 API다. 행정 담당자나 분석가가 "우리 사업의 근거 법령이 최근 개정됐는지, 언제부터 시행되는지"를 법령ID와 시행일·개정 이력으로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 법령명·법령ID 매핑이나 소관부처코드 같은 기관 코드로만 잇고, 법령상세링크로 본문 조회에 넘어간다.
description_portal: 법제처가 제공하는 모바일 법령 목록 조회 데이터는 모바일 환경에서 활용할 수 있도록 구성된 법령의 기본 정보를 제공합니다. 해당 데이터는 법령명, 법령ID, 법령구분, 공포번호, 공포일자, 시행일자, 소관부처명, 연번, 제개정구분 등 주요 항목으로 구성됩니다. 사용자는 법령명, 공포번호, 소관부처, 페이지 번호 및 조회 건수 등의 조건을 입력하여 원하는 법령 정보를 맞춤형으로 조회할 수 있습니다. 모바일 인터페이스에 적합한 경량 구조로 설계되어 있어 법령 정보의 신속한 접근과 활용이 가능하며 법령의 최신 시행일과 공포일, 법령 상태 등 핵심 사항을 빠르게 확인할 수 있어 법령 관리, 행정 참고 및 모바일 기반의 법제 서비스에 유용합니다.
