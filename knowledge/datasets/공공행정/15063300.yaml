description_portal: '이 파일은 천안도시공사에서 관리하는 체육시설 예약현황 데이터입니다.파일 개요파일명: 천안도시공사_예약현황.csv데이터 형식: CSV (콤마로 구분된 값)총 레코드 수: 53개 시설데이터 구조파일은 4개의 컬럼으로 구성되어 있습니다:위치: 시설이 위치한 장소명장소: 시설의 유형 (테니스장, 배드민턴장, 야구장 등)예약정보: 구체적인 코트/구장 번호 또는 시설명주소: 시설의 정확한 주소포함된 체육시설천안시 내 8개 주요 체육시설의 예약 가능한 세부 시설들이 포함되어 있습니다:테니스 시설 (16개)종합운동장 실외테니스장 (1-12코트)종합운동장 실내테니스장 (1-4코트)배드민턴 시설 (16개)천안실내배드민턴장 (1-16코트)야구 시설 (5개)천안생활체육야구장 (A~D구장, 리틀야구장)축구 시설 (11개)천안축구센터 (인조구장 3개, 풋살장 4개, 세미나실 4개)북부스포츠센터 (축구장 1구장)기타 시설 (5개)한들문화센터 (이벤트홀)유관순파크골프장 (오전/오후)지역 분포시설들은 천안시 서북구와 동남구에 분산되어 있으며, 주요 체육시설들이 체계적으로 관리되고 있음을 보여줍니다.이 데이터는 천안시민들이 체육시설을 예약할 때 활용할 수 있는 기초 정보로, 각 시설의 위치와 예약 가능한 세부 시설들을 한눈에 파악할 수 있도록 정리되어 있습니다.'
