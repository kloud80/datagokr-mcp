description_portal: '부산 남구 국민운동단체(새마을, 바르게, 자유총연맹)의 단체명, 회원수, 대표자명, 소재지, 전화번호 내용입니다▣ 한국자유총연맹 부산 남구지부󰊱 설립근거  ○ 한국자유총연맹 육성에 관한 법률 제2조 및 제3조󰊲 조직현황  1. 창 립 일 : 1989. 4. 8.  2. 설립목적    가. 한국자유총연맹의 지원․육성    나. 대한민국 자유민주주의의 항구적 옹호․발전을 위함    다. 안보․통일 활동의 국민운동화  3. 사무실 : 부산광역시 남구 못골번영로 69(대연동) 3층 ※ 사무실 임대▣ 남구 새마을회󰊱 설립근거   ○ 새마을운동조직육성법 제3조󰊲 조직현황  1. 창 립 일 : 1980. 1. 14.  2. 설립목적 : 새마을운동조직의 지원․육성  3. 사 무 실 : 부산광역시 남구 수영로 155(대연동)󰊳 회의개최  1. 이  사  회 : 부정기적으로 운영  2. 정기총회일 : 년1회 (1~2월중)󰊴 임원구성  1. 임 기 : 3년 (1회 연임 가능)  2. 현 황 : 회장1, 사무국장1, 지도과장1 ,새마을단체 회장단(회장, 부회장, 총무)바르게살기운동 남구협의회◦바르게살기운동 조직 육성법 및 동법 시행령◦우리 사회의 의식개혁 및 균형 있는 사회발전을 실현하기 위한 국민 의식    함양운동을 전개함으로써 조화로운 사회 기틀 마련'
