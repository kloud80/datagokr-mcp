summary_user: 경상북도 김천시 관내 무인민원발급기를 설치장소 한 곳당 한 행으로 담은 시설 목록으로, 도로명주소·위도·경도와 평일·주말 운영시간, 연락처, 신용카드 결제 가능 여부가 들어 있다. 김천시 주민이 "주말이나 퇴근 뒤에 주민등록등본을 뗄 수 있는 가장 가까운 발급기가 어디인가"를 찾거나, 분석가가 읍면동별 비대면 민원 인프라 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 좌표·주소로 공간 결합하거나 설치장소명(주민센터 등)으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경상북도 김천시 관내에 설치된 무인민원발급기의 위치와 운영시간 정보를 정리한 공공행정 데이터로, 시민의 행정서류 접근 편의성 향상 및 24시간 민원행정 기반 마련을 목적으로 제공됩니다.주요 항목에는 설치장소명, 도로명 주소, 평일 운영시간, 주말 및 공휴일 운영시간 등의 정보가 포함되며, 기관(시청, 읍면동 주민센터,공공시설 등)별 설치 장소를 기준으로 정리되어 있습니다.무인민원발급기를 통해 주민등록등·초본, 가족관계등록부, 부동산등기부등본, 토지대장, 국세 및 지방세 제증명 등 총 122종의 민원서류 발급 서비스가 가능하며,본 데이터는 김천시 전역의 비대면 민원처리 인프라 현황을 시각화하고, 시설별 운영 여건에 따라 시간대별 이용 가능 여부를 구분할 수 있도록 설계되어 있습니다.
