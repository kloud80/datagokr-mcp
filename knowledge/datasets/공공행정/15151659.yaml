summary_user: 경기도 내 행정동 하나당 한 행으로 행정동코드·행정동명, 경계 폴리곤과 공간정보, 소속 읍면동·시군구 코드와 명칭을 담은 경계 원장으로, 포털 설명상 2021년 기준이며 범위는 시도, 행정단위는 읍면동이다. 분석가가 지역화폐 소비액이나 사회경제 지표를 행정동별 지도로 그릴 때 경계 레이어로 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동·시군구 이름이나 코드(admdong_cd, signgu_cd)를 대조해 매핑하거나 같은 경기도 데이터의 코드로 잇는다.
description_portal: 이 데이터는 2021년 기준 경기도 내 행정동 단위의 공간적 식별을 위한 자료로, 각 행정동의 코드(행정동코드), 행정동명, 폴리곤 정보, 읍면동 및 시군구 코드와 명칭, 공간정보 항목으로 구성되어 있습니다. 이 데이터는 행정구역 경계를 폴리곤 형태로 포함하고 있어, 지리정보시스템(GIS) 분석에 활용할 수 있으며, 주소 기반 데이터와 결합하여 시각화 및 공간 분석이 가능합니다. 예를 들어, 지역화폐 소비 분석 결과를 행정동별로 시각화하거나, 행정구역별 사회경제적 지표를 지도 형태로 표현할 수 있습니다. 또한, 각종 공공행정 시스템, 지역 정책 수립, 맞춤형 서비스 제공 등에도 활용 가능성이 큽니다.
