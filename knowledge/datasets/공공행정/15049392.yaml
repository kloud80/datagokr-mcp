description_portal: 이 데이터는 국가기록원이 보유한 관보 컬렉션의 기본 정보를 수록한 자료로, 관보ID, 관보유형(시대별), 관보명, 발행일자, 관리번호 등의 항목으로 구성되어 있습니다. 각 관보는 시대에 따라 발행 기관과 내용이 다르며, 이를 체계적으로 분류·관리하기 위해 컬렉션 단위로 정리되었습니다. 본 자료는 정부 간행물의 발행 이력 관리, 행정정보 공개, 기록연구 및 활용 지원 등 다양한 목적으로 활용될 수 있으며, 관보 기록물에 대한 이해를 높이고 디지털 아카이브 품질 향상에 기여하는 기초데이터입니다. 총 26,993건으로 구성되어 있으며 수시 업데이트되는 1회성 데이터입니다.
