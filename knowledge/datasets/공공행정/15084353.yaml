summary_user: 경기도 고양시의 시청·구청·행정복지센터를 청사 한 곳당 한 행으로 정리한 시군구 범위 파일로, 기관 구분명·도로명 주소·지번 주소·대표전화번호와 집계일자를 담는다. 시민이 "우리 동 행정복지센터가 어디이고 전화번호가 무엇인가"를 찾거나, 분석가가 고양시 청사 위치 목록을 지도화할 때 쓴다. 전역 조인 키나 기관 코드가 없으므로, 다른 데이터와는 주소(도로명·지번)나 기관명 문자열을 맞춰 잇는다.
description_portal: 해당 데이터는 지방자치단체인 경기도 고양시의 시청, 구청 및 행정복지센터의 위치와 연락처 정보 등을 정리한 데이터입니다. 주요 내용으로는 기관명, 도로명 주소, 소재지 지번 주소, 대표전화번호를 포함하고 있어 거주지 또는 근무지 인근의 고양시 청사를 찾거나 위치 및 연락처를 조회하는 데 활용할 수 있는 데이터입니다. 참고로 해당 자료는 "지방자치법" 제9조(사무소의 소재지)에 따라 위임되어 시청·구청 및 동행정복지센터의 소재지를 규정하는 목적의 조례인  "고양시 시청·구청  및 동행정복지센터 소재지에 관한 조례" 별표를 기준으로 작성된 자료입니다.
