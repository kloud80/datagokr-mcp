summary_user: 부산광역시 반여농산물도매시장에서 거래된 농산물의 경락가격을 거래일·도매법인·품목·품종·단량·등급별로 최저가·최고가·평균가로 담는 API이며, 포털 설명상 품목별 실시간 경락정보는 최근 7일분만 제공된다. 소매상·식당 운영자나 분석가가 "이번 주 반여시장에서 특정 품목의 등급별 평균 경락가는 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 도매시장·산지 가격 데이터와는 품목명·품종명(goodName 등) 같은 이름 매핑이나 거래일 기준으로만 이어 쓴다.
description_portal: 부산광역시 반여농산물도매시장내에서 거래되는 농산품의 실시간 경락정보(날짜, 도매법인, 품목, 품종, 단량, 등급,  반입일자, 물량(kg), 금액(최저가, 최고가, 평균가) 등)실시간 경락정보, 반입물량정보 내 품목별 정보는 7일간의 정보만 제공됩니다. 제공되는 데이터를 통해 거래되는 농산품의 일일가격정보, 주간평균경락가격, 월간평균경락가격 조회가 가능합니다.
