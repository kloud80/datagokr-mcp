description_portal: 이 데이터는 서산시 관내에 설치된 옥외 광고물 게시시설에 대한 현황 정보를 제공한다. 수록 항목은 업체명, 관리기관, 연락처, 지번주소, 위치 설명, 열수, 수량, 가능매수, 위도, 경도, 데이터기준일로 구성되어 있다. 업체명은 광고물 게시대의 운영 또는 설치를 담당하는 사업체를 나타내며, 관리기관은 시설을 관할하거나 유지 관리하는 행정기관 또는 위탁기관이다. 지번주소와 위치 설명을 통해 설치 장소를 명확히 확인할 수 있고, 열수 및 수량은 게시대의 물리적 구조를 나타낸다. 가능매수는 부착 가능한 광고물의 최대 수량을 의미한다. 위도와 경도는 위치의 공간좌표 정보를 제공하여 지도 기반 활용을 가능하게 하며, 기준일자는 데이터의 최신성을 보여준다. 본 자료는 도시 경관 개선, 광고물 허가 심사, 공공 정보 활용 등 행정 및 민간 목적에 사용된다.
