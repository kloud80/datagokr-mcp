description_portal: 시흥도시공사 전직원의 연간 사회공헌 현황이다. 사랑의 헌혈운동,장애인의 날 특별교통수단 무료운행,교통약자 유권자 콜택시 무료 운행,동물누리 보호센터 활동,시화호 수중정화 및 자연보호 캠페인 활동,경기도 탄탄대로 공동캠페인,기후환경실천 작은자리환경축제 캠페인 활동,재해취약계층 침수피해 예방사업,사회적약자 주거환경 개선활동,취약계층 대상전기안전점검, 어린이날 학용품세트 기부,폐토너 및 폐드럼 기부,공감 36.5 사랑나눔 기부,크리스마스씰 판매액 기부,연말 이불배게세트 기부 등 다양한사회공헌 활동 현황을 공개함니다.
