description_portal: '주민등록인구수를 연령별·구별로 제공하는 일반·보고통계입니다. 서울특별시 연령(5세)별·구별 등록인구 및 등록외국인 수를 제공합니다.* 등록인구 = 주민등록인구 + 등록외국인 * 주민등록인구는 "거주자", "거주불명자", "재외국민"이 포함 - 거주자 : 거주지가 분명한 사람(재외국민 제외) - 거주불명자 : 거주사실이 불분명하여 거주불명으로 등록된 사람(2010년 1월부터 통계에 포함) - 재외국민: 외국의 영주권을 취득한(영주목적으로 외국거주 포함) 대한민국 국민으로 주민등록을 한 사람(2015년 1월부터 통계에 포함)'
