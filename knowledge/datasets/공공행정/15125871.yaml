summary_user: 국회예산정책처(NABO)가 발간한 경제재정수첩 간행물의 목록을 게시물 한 건 단위로 담으며, 제목·등록일·담당부서·분류·원문 링크·첨부파일명 필드로 구성되고 범위는 전국·비공간이다. 국가 재정·경제 지표를 한 권에 정리한 수첩의 발간 이력과 원문 파일을 찾으려는 분석가·연구자가 "최신 경제재정수첩 원문은 어디서 받나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 제목·부서명 같은 이름 매핑이나 같은 기관(국회) 데이터의 맥락으로만 이어 쓴다.
