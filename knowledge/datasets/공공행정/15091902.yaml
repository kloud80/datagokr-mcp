summary_user: 공정거래위원회가 지정한 대규모기업집단의 소속회사별로 대표자명, 참여업종명, 대표상품명을 지정년도·기업집단코드·법인등록번호 기준으로 담은 건별 조회 API이며, 범위는 전국이다. 투자자나 언론이 특정 대기업집단 계열사가 어떤 업종에 진출해 어떤 상품을 주력으로 하는지 확인할 때 쓴다. 사업자등록번호(bizrno)를 키로 기업집단 지분·내부거래 정보나 가맹사업·통신판매·상조 등록 정보 등 다른 공정위 등록·지정·공시 데이터와 이어 쓴다.
limits: 포털 설명상 2023년 자료까지만 제공되고, 당해년도 정보는 5월 정기자료 검토를 거쳐 8~9월에 공개된다. 호출 전 사용 가능한 공개년월을 별도 오퍼레이션(publicYmList)으로 확인해야 하며, 개발계정은 하루 10,000회로 제한된다.
