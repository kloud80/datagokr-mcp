summary_user: 경기도의회의 역대 대수별로 대수번호, 시작일·종료일, 전반기·후반기 시작일, 1기~4기 시작일과 등록·수정일을 한 행씩 담은 기준 자료다. 지방의회 연구자나 의정 관련 분석가가 '제몇 대 경기도의회는 언제부터 언제까지였고, 후반기 의장단 교체는 언제였나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의정포털 자료(회의록·의안 등)와는 대수번호(vcnt_info_no)나 날짜 구간을 맞춰 이름·코드 매핑으로만 잇는다.
description_portal: 「경기도의정포털_대수정보」 데이터는 경기도 의회의 역대 대수별 운영 기간을 기록한 행정자료입니다. 각 대수별로 대수번호, 시작일자, 종료일자, 등록일자, 수정일자와 같은 기본 항목을 포함하며, 일부 항목에서는 전반기 시작일, 후반기 시작일, 1기~4기 시작일을 통해 세부 회기 운영 정보를 제공합니다.이 자료는 경기도 의회가 언제 구성·운영되었는지를 연도별로 체계적으로 확인할 수 있는 기초 데이터로서, 지방의회의 역사적 변천과 제도 운영 변화를 연구하는 데 활용할 수 있습니다. 또한, 특정 대수의 전반기·후반기 구분을 통해 의장단 교체 시점이나 의회 운영 주기를 분석할 수 있습니다.
