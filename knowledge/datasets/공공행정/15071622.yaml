summary_user: 서울시 내 식품판매업(기타) 영업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·폐업일·영업상태 같은 행정 이력과 주소·좌표·면적·종업원수·보증액·월세 등 업소 속성을 함께 담는다. 상권 분석가나 창업 준비자가 '특정 구에서 이 업종 영업소가 언제 생기고 문을 닫았는지, 지금 몇 곳이 영업 중인지' 같은 점포 이력 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 관리번호(MGTNO)로만 이어 쓰며, 같은 원천인 LOCALDATA 인허가 자료와 겹친다.
description_portal: 서울시 식품판매업 기타 인허가 정보는 일반 음식점이나 휴게음식점 등과 달리 특수한 형태로 식품을 판매하는 영업소에 대한 인허가 및 영업 현황을 제공하는 공공데이터입니다. 각 영업소의 인허가일자와 인허가취소일자, 폐업일자, 휴업기간, 재개업일자, 영업상태 및 상세영업상태 정보를 통해 현재 영업 중인지 휴업 또는 폐업 상태인지 등 행정 이력을 체계적으로 파악할 수 있는 자료입니다. 또한 사업장명, 전화번호, 지번주소와 도로명주소, 우편번호, 좌표, 소재지면적, 업태구분명, 위생업태명 등의 항목을 통해 업소의 위치와 규모, 영업 형태 및 위생 관련 분류를 확인할 수 있어 공간 분석과 위생 행정에 모두 활용 가능한 데이터입니다. 남성종사자수, 여성종사자수, 총인원, 본사와 공장 사무직·판매직·생산직 종업원수 정보는 업소별 인력 규모와 성별 분포, 직무별 인력 구조를 파악할 수 있게 해 고용 구조 분석과 노동 정책 수립에 근거 자료로 활용할 수 있는 요소입니다. 영업장주변구분명, 등급구분명, 급수시설구분명, 건물소유구분명, 시설총규모 등은 영업 환경과 시설·위생 수준을 평가하는 데 중요한 지표가 되며, 보증액과 월세액 정보는 업종과 지역별 임대료 수준과 창업 비용을 추정하는 데 유용한 지표입니다. 다중이용업소여부, 전통업소지정번호, 전통업소주된음식, 홈페이지 정보는 안전관리 및 전통업소 육성, 지역 특화 식품 문화 홍보, 온라인 정보 제공 서비스에 기초 자료를 제공하는 항목입니다. 최종수정일자와 데이터갱신구분, 데이터갱신일자는 데이터의 최신성과 관리 이력을 확인하게 해 행정적 신뢰성을 뒷받침하며, 전반적으로 이 데이터는 식품 관련 위생 행정, 상권 및 임대 시장 분석, 고용 구조 연구, 전통 식품산업 및 지역경제 활성화 정책 수립 등 다양한 분야에서 폭넓게 활용될 수 있는 기반 자료입니다.
