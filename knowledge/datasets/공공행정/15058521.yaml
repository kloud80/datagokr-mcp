summary_user: 지방자치단체별로 회계연도마다 지방의회 경비(회의 운영·의정활동 지원·의원 교육연수·사무행정 등)와 그 기준이 되는 예산 결산액, 그리고 둘의 비율을 담은 전국 단위 지방재정 공시 지표다. 주민이나 분석가가 "우리 시·군·구는 예산 가운데 지방의회 운영에 얼마를 쓰고, 다른 지자체와 비교해 비율이 높은가"를 확인할 때 쓴다. 전역 조인 키는 없고, 광역·기초 자치단체 코드와 이름(laf_cd 등) 및 회계연도로 같은 지방재정365의 다른 지표와 맞춰 쓴다.
description_portal: 지방의회경비비율이란, 지방자치단체의 예산 중에서 지방의회를 위한  운영과 관련된 경비가 차지하는 비율을 의미합니다. 이 경비에는 지방의회 회의 운영, 의정 활동 지원, 의원의 교육 및연수, 사무행정 등과 관련된 비용이 포함됩니다. 지방의회경비비율은 지방의회의 활동과 예산 집행을 효율성을 평가하는지표로 활용되며, 과도한 경비 지출이 이루어지지 않도록 관리하는 데 중요한 역할을 합니다. 이를 통해 지방자치단체의 재정 건전성을 유지하고, 지방의회의 공공성 및 투명성을 높일 수 있습니다.
