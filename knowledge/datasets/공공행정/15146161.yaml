description_portal: '①어린이(13세 이하), ②성인(청소년·어른·경로로 3분류), ③외국인으로 나뉘며, 각 군마다 오전/오후/야간이 분리되어 입력됩니다. 군별 소계(소계①=어린이 합, 소계②=성인 합, 소계③=외국인 합)와 전체 총계가 오른쪽에 자동 합산되어 일자별 총 유입량을 한눈에 볼 수 있습니다.자료를 보면 주중보다 주말(토·일)과 공휴일 구간에서 총계가 크게 상승하고, 어린이는 오후·야간에 상대적으로 비중이 높습니다. 성인군은 ‘어른’ 항목이 절대 다수를 차지하며, 야간 활동이 있는 날(예: 7/8, 7/24, 7/30)은 총계가 300400명대로 치솟는 패턴이 보입니다.'
