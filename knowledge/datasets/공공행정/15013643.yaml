summary_user: 전북특별자치도 고창군 내 주민센터·읍면 사무소 등 행정기관을 기관 한 곳당 한 행으로 담은 목록으로, 기관명·도로명주소·우편번호·전화번호·팩스번호를 담는다. 고창군 주민이나 민원인이 '우리 읍·면 사무소 주소와 전화번호가 무엇인가'를 찾거나, 분석가가 군 단위 행정시설 원장을 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소를 문자열로 맞춰 이어 써야 한다.
description_portal: 전북특별자치도 고창군의 행정기관 정보 현황 데이터는 지역 내 행정기관의 기본 정보를 제공합니다. 이 데이터에는 기관명, 도로명 주소, 전화번호, 우편번호, 팩스번호 등의 항목이 포함되어 있으며, 주민센터 및 읍·면·동 사무소 등의 정보를 확인할 수 있습니다. 해당 데이터는 연간 업데이트되며, 차기 등록 예정일은 2026년 8월 12일입니다. 공공데이터포털에서 CSV 파일 형식으로 제공되며, 로그인 없이 다운로드할 수 있습니다. 보다 자세한 내용은 고창군청 홈페이지에서 확인할 수 있습니다.
