summary_user: 지방자치단체별로 예산 대비 공기업·공공기관·민간 등에 출자·출연한 금액의 비율을 회계연도(fyr) 단위로 담은 전국 범위의 집계 지표이며, 출자출연 관련 금액 항목과 비율(rate)이 함께 들어 있다. 분석가나 주민이 "우리 시·군·구는 예산 중 얼마를 외부 기관 출자·출연에 쓰고, 다른 자치단체와 비교하면 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 지표와는 자치단체 코드·이름(laf_cd, laf_hg_nm)과 상위 자치단체 코드(wa_laf_cd)를 맞춰 같은 기관 체계 안에서 연결한다.
description_portal: 출자출연금비율은 지방자치단체가 공기업, 공공기관 또는 민간 기업에 출자하거나 출연한 금액을 비율을 나타내는 지표입니다.이 비율은 자치단체의 예산 중 어느 정도가 외부 기업이나 기관에 투자되었는지를 보여줍니다.출자출연금비율이 높을 경우, 자치단체가 공공 서비스나 경제적 성과를 위한 투자를 많이 하고 있다는 것을 으미할 수 있으며, 반대로 낮은 비율은 상대적으로 자치단체가 내부 사업에 집중하고 있다는 의미로 해석될 수 있습니다. 이 비율은 자치단체의 재정 정책, 투자 성향 및 장기적인 재정 안정성에 대한 평가에 중요한 역할을 합니다.
