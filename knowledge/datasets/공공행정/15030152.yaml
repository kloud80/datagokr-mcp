legal_basis_portal: 행정사법 제14조(사무소의 설치), 행정사법 시행규칙 제10조(합동사무소설치 등)의 법령을 근거로 데이터가 단순 관행이나 임의적 판단에 의해 수집된 정보가 아니라, 관련 법령에 근거하여 행정기관이 반드시 수행해야 하는 법정 사무의 결과물임을 명확히 하기 위해 보유근거 설명의 보완 및 변경이 필요하며, 특히, 행정사 현황 데이터는 국민의 행정서비스 선택권 보장, 행정사 제도의 투명성 제고, 행정사 업무의 신뢰성 확보를 위한 기초자료로 활용 가치가 높으며, 관련 민원 처리, 정책 수립, 제도 개선 및 대국민 정보 제공을 위해 지속적인 최신성 유지가 요구
