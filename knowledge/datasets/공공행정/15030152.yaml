summary_user: 경상북도 상주시에 등록된 행정사를 한 명(사무소)씩 담은 건별 원천 목록으로, 행정사 종류·성명·사무소 명칭·전화번호·도로명주소·영업 여부를 담고 파일 크기가 616바이트에 불과해 수록 건수가 적다. 상주시 주민이나 사업자가 인허가·민원 서류 대행을 맡길 지역 행정사 사무소와 연락처, 현재 영업 여부를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소(소재지도로명주소)나 사무소 명칭을 매칭해 잇거나, 다른 시군의 같은 행정사 현황 파일과 항목을 맞춰 이어 붙여 쓴다.
description_portal: 본 행정사 현황 데이터는 「행정사법」 및 동법 시행령·시행규칙에 따라 행정사 자격의 관리, 행정사의 등록·변동사항 관리, 행정사 제도의 원활한 운영을 목적으로 지속적으로 생성·관리되고 있는 행정정보입니다. 해당 데이터는 행정사 자격 취득, 등록, 휴·폐업, 사무소 개설 및 변경 등 행정업무 수행 과정에서 법령에 근거하여 필수적으로 수집·보유되는 자료로서, 단순 내부 참고자료가 아닌 법정 사무 수행을 위해 체계적으로 관리되는 공공데이터에 해당합니다. 데이터는 행정사 제도의 운영 현황 파악, 행정업무 참고자료 및 대국민 정보 제공을 목적으로 활용하는 것이 적절합니다.
