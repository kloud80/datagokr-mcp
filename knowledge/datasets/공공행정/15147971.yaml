description_portal: 대구광역시 대표홈페이지에서는 금주의 퀴즈를 매주 제공하고 있습니다. 공공데이터에는 회차, 퀴즈 내용, 정답, 참석자 수, 정답자 수, 당첨자 수, 인터넷주소 등으로 구성되어 있습니다. 시민 참여를 통해 지역사회 이슈와 정보 확산을 도모하며, 각 회차별 문제와 통계 데이터를 제공함으로써 행정 정보의 투명성 및 소통 활성화를 높입니다. 이 데이터는 교육, 홍보, 참여 이벤트 분석 등에 폭넓게 활용 가능하며, 엑셀로 제공되어 손쉽게 가공·분석 및 시각화할 수 있습니다. 특히, 웹 주소가 포함되어 있어 외부에서도 지난 회차별 문제와 결과를 쉽게 확인할 수 있습니다.
