description_portal: 한국소비자원이 운영하는 소비자위해감시시스템(CISS)의 데이터를 기반으로 구성된 위해정보신고 어플리케이션 알림 발송 내역에 대한 자료로, 메시지, 등록일 등의 정보를 포함하고 있습니다. 알림 발송을 통해 제품 판매차단과 같은 위해정보 처리속보 등을 안내합니다. "CISS"는 Consumer Injury Surveillance System(소비자위해감시시스템)의 영문 머리글자를 딴 약칭으로, 소비자기본법 제8조(위해의 방지), 제51조 제1항 제1호 및 제52조(위해정보의 수집 및 처리) 및 동법 시행령 제39조(위해정보제출기관의 지정·운영 등)에 의거 병원, 소방서 등을 포함한 위해정보제출기관과 소비자상담센터(www.ccn.go.kr, 전화 국번없이 1372) 을 통해 접수되는 소비자상담, 위해정보신고(080-900-3500) 국내외 언론 등으로부터 위해정보를 수집하고 분석·평가하여 관련 조치를 취할 수 있도록 구축된 소비자 위해상황 상시감시시스템을 말합니다.
