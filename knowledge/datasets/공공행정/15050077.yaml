summary_user: 해남군의회 홈페이지 의회용어사전에 실린 의회 용어를 용어명과 용어뜻으로 한 줄씩 정리한 용어 목록이며, 포털 설명상 2026년 2월 기준 약 1,000개 용어를 가나다순으로 담는다. 주민이나 지방의회 관련 업무 담당자가 회의록·안건에서 본 '재의요구', '정족수' 같은 낯선 의회 용어의 뜻을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용어명을 글자 그대로 맞추는 방식으로만 이어 쓰며, 다른 지방의회 용어사전과 비교하거나 회의록 텍스트의 용어 풀이에 붙여 쓴다.
limits: 파일 다운로드로만 받는 정적 목록이고, 용어명 외에 다른 데이터와 연결할 공통 키가 없다. 해남군의회 기준 풀이이므로 다른 의회나 법령상 정의와 표현이 다를 수 있다.
