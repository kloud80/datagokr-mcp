description_portal: 전라남도 해남군 의회홈페이지 의회용어 사전에 대한 데이터입니다. 이 데이터에는 용어명, 용어뜻 항목을 제공합니다.26년 2월 기준 1,000개 용어에 대한 내용을 가나다 순서로 정리하여 알기쉽게 설명되어 있습니다.의회용어는 해남군의회 홈페이지 - 참여마당 - 의회용어사전에서도 단어를 검색하여 확인할 수 있습니다. 의회용어는 의회라는 특수한 환경에서 사용되는 언어로서 효율적인 의사 진행과 회의의 공정성을 확보하기 위해정확성, 통일성, 간결성, 권위성, 격식, 특수성, 전문성 등의 특징을 지닙니다.
