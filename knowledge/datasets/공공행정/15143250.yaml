description_portal: '이 데이터는 은평구청 데이터광장에서 실시한 공공데이터 설문조사의 각 문항에 대해 제공되는 예시 응답(선택지) 정보를 담고 있습니다. 각 예시는 예시아이디를 통해 고유하게 식별되며, 특정 질문번호에 대해 순서대로 예시제목(예: 예, 아니오, 몰라요 등)과 예시유형이 함께 제공됩니다. 또한 설문ID, 설문명 등 설문 메타정보가 포함되어 있어, 설문별 구조 및 문항별 선택지 구성을 한눈에 파악할 수 있습니다. 이 데이터는 설문 설계 시 응답 항목 구성, 질문 로직 설계, 통계 분석, 신규 설문지 개발, 표준화 등 다양한 목적의 기초자료로 활용될 수 있으며, 생성일자를 통해 데이터 등록 시점도 확인할 수 있습니다. 공공 설문조사의 표준 구조와 실무 활용성을 모두 갖춘 자료입니다.'
