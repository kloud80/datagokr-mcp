summary_user: 정부입법으로 공포된 법령을 공포일자·시행일자, 법령 종류(법률·대통령령·부령 등, 법령구분명), 제정·개정 구분, 소관부처, 공동부령 여부와 함께 담은 전국 단위 CSV 파일(약 13MB)이며, 필드 구성상 집계표보다 법령별 공포 건 목록에 가깝다. 법제 분석가나 행정기관 담당자가 특정 부처가 연도별로 법령을 몇 건 제정·개정했는지, 또는 어떤 법령 종류의 개정이 늘었는지 확인하는 데 쓴다. 전역 조인 키는 없어서 국회 의안이나 다른 법령 데이터와는 법령명이나 소관부처명을 이름으로 맞춰 연결한다.
description_portal: 본 자료는 최근 수년간 정부 및 부처별로 제정·개정된 법령의 수량과 분포를 연도별·부처별로 체계적으로 정리한 통계 자료입니다. 각 법령의 제정연도, 개정횟수, 조문 수, 영향범위를 종합하여 분석 가능하도록 구성합니다. 이를 통해 법제처와 행정 기관이 법령 운영 현황을 진단하고, 입법 업무의 효율성과 법제 정책의 수립을 지원합니다. 또한 입법 추이 및 법령 활용 경향을 파악하여 향후 법제 전략 수립에 활용할 수 있도록 구현하였습니다. 해당 통계는 법제 운영의 객관적 이해를 돕는 기초 자료로 활용됩니다.
