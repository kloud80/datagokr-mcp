description_portal: '(현수막지정게시대 현황)현수막지정게시대 현황 정보에 많을 관심을 가져주셔서 감사합니다현수막지정게시대 현황은 부산광역시 서구 관내 현수막지정게시대의 정보를 제공합니다.옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률 및 같은 법 시행령 등 관련법령에 따라 매년 현황을 조사하여 정비하고 있습니다.현수막 게시 신청은 부산광역시 서구청 홈페이지-분야별정보-현수막게시대 위치 및 신청 메뉴를 통해 신청하실 수 있습니다.현수막지정게시대의 아래 정보자료내용을 포함합니다.1. 행정동(예시: 서대신1동)2. 위치(예시: 대티터널)3. 주소(예시: 부산광역시 서구 낙동대로 10)4. 특징(예시: 탱탱걸이식)5. 규격(예시: 6)6.부착면수(예시: 5)7. 부착제한일: (예시: 10)8.민원수수료:(예시: 10,000)9.점용료:(예시: 1,620)10.관리기관 전화번호 : 051-240-462211. 데이터 기준일자(예시: 2025-06-30)12. 위도(예시: 35.110236)13. 경도(예시:129.010749)등의 정보를 제공합니다.데이터는 매년 1회 현행화하여 갱신하고 있습니다문의사항은 서구청 건축과 광고물계(051-240-4622)로 연락주시기 바랍니다‘'
