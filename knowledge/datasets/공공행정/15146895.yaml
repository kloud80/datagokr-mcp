description_portal: 국민이 필요로 하는 행정자료를 투명하게 제공하기 위해 관리되는 정보공개자료를 말합니다. 정보공개 청구 절차, 처리기한, 공개·부분공개·비공개 결정사유, 담당 부서, 연도별·분기별 청구건수와 처리결과 등이 포함됩니다. 사전공표 대상 정보, 청구서 접수 경로, 불복 절차 안내 등 제도 운영 전반의 정보도 포함되어 국민이 제도를 이해하고 활용할 수 있도록 합니다. 기관은 제도 운영의 효율성을 평가하고 정책 개선 방향을 수립할 수 있으며, 국민은 필요한 자료를 신속하게 확인할 수 있습니다.본 데이터는 청구, 정보목록, 사전정보 등 다양한 정보공개 관련 데이터를 제공합니다.다양한 케이스와 대량 데이터로 인해 일부 데이터만 제공하고 있습니다. 필요시 정보공개포털(https://open.go.kr)을 방문해주시길 바랍니다.
