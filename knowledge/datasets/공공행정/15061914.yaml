summary_user: 포천시의회에 발의된 조례안·결의안 등 의안을 한 건씩 담은 파일로, 의안번호·의안명·발의자·발의일·소관위원회·본회의 의결일과 처리결과를 기록한다(CSV 약 65KB). 시민이나 지역 정책 분석가가 특정 조례가 언제 누구에 의해 발의되어 어느 위원회를 거쳐 가결·부결되었는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 시군 의회 의안 데이터와는 기관명으로 묶거나 의안명·발의자 이름을 맞춰 연결해야 한다.
description_portal: 경기도 포천시에서 제공하는 의회 의안정보 데이터입니다. 본 데이터는 포천시의회에서 발의되고 처리된 의안의 진행 현황을 담고 있으며, 기관명, 의안번호, 의안명, 발의자, 발의일, 소관위원회, 본회의 의결일, 본회의 처리결과, 데이터 기준일 등의 항목으로 구성되어 있습니다.해당 데이터는 시의회에서 다루어진 조례안, 결의안 등의 주요 의안 정보를 확인하는 데 활용될 수 있습니다.  이 데이터를 통해 지역 정책이나 조례가 어떻게 발의되고 처리되었는지 과정을 확인할 수 있으며, 발의자나 소관 위원회를 기준으로 관심 있는 의안의 흐름을 살펴보는 데에도 유용합니다.
