description_portal: 본 데이터는 국가법령정보센터에 접속한 이용자들의 접속 이력 중 URI를 기준으로 분류한 이용실태 정보를 수록한 자료입니다. 각 URI별 접속 빈도, 이용자 수, 조회수 등의 항목을 포함하고 있으며, 이를 통해 이용자가 주로 접근하는 법령 정보의 종류, 이용 패턴, 선호 경로 등을 분석할 수 있도록 구성되어 있습니다. 접속 페이지의 유형, 법령 분류, 시간대별 접속 통계 등이 체계적으로 정리되어 있으며, 데이터는 특정 기간 동안 수집된 실제 접속 로그를 기반으로 가공되었습니다. 이를 통해 다양한 이용자의 정보 탐색 경향을 파악하고, 법령 정보 서비스 제공의 개선 방향을 도출할 수 있는 기초 자료로 활용될 수 있습니다. 데이터는 URI 형태의 접속 정보를 중심으로 하여 구조화되어 있습니다.
