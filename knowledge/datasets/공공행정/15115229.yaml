summary_user: 서울 강남구에서 인허가를 받은 이용업소(이발소 등)를 업소 한 곳당 한 행으로 담은 원천 목록이다. 관리번호, 인허가일자, 영업상태와 상세영업상태, 폐업일자, 도로명·지번주소, 사업장명, 좌표, 건물 층수 등이 들어 있다. 상권 분석가나 창업 예정자가 강남구에 영업 중인 이발소가 몇 곳이고 어디에 몰려 있는지, 언제 문을 열고 닫았는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 주소·사업장명으로 맞추거나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE)로만 이을 수 있고, 같은 원천을 쓰는 LOCALDATA 인허가 자료와 대조하는 용도로 쓴다.
