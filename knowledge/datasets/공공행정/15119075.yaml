summary_user: 한국중부발전이 출자한 SPC(특수목적법인)를 회사 한 곳당 한 행으로 담은 목록으로, 출자회사명·최초출자일·출자 형태(자회사/출자회사/재출자회사)·종속관계(종속기업/관계기업/공정가치측정금융자산)·국가·주요사업·발전원을 담는다(7KB 남짓 CSV). 공기업 출자 구조를 살피는 분석가나 국민이 '중부발전이 해외 어느 나라에서 어떤 발전원 사업에 지분을 갖고 있고, 그중 지배하는 회사는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 출자회사명이나 국가명을 이름으로 맞춰 연결해야 하고, 다른 발전공기업의 출자회사 현황과 나란히 비교하는 식으로 쓴다.
description_portal: 한국중부발전(주)의 SPC(특수목적법인) 사업 현황 정보이며, 목록명은 "구분". "출자회사명", "최초출자일", "지배구조_출자", "지배구조_종속관계", "국가", "주요사업", "발전전원 명"으로 이루어져 있음. 지배구조_출자는 "자회사/출자회사/재출자회사" 로, 지배구조_종속관계는 "종속기업/관계기업/공정가치측정금융자산" 으로 분류됨. 지배구조 출자의 자회사는 모회사가 경영권을 확보한 상태의 지배적 관계의 회사이며, 출자회사는 자본금의 전부 또는 일부를 출자한 회사를 의미합니다. 재출자회사의 경우 중부발전의 출자회사가 자본금의 전부 또는 일부를 출자한 회사를 뜻합니다. 지배구조_종속관계의 경우 지분율이 20% ~ 50% 사이면 관계기업, 지분율이 50% 이상이면 종속기업으로 분류됩니다. 공정가치 측정 금융자산은 기타 지분상품으로 분류됩니다.
