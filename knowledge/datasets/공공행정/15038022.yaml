summary_user: 김해시의회에 제출된 의안을 건별로 담은 원천 파일로, 대수·회기·의안번호·의안명·의안종류와 발의자, 소관위원회, 위원회·본회의 단계별 회부·상정·처리일과 처리결과, 집행기관 이송일·공포번호·공포일까지 한 행에 기록한다. 시민이나 지역 분석가가 '이번 대수 김해시의회에서 특정 의원이 발의한 조례안이 어느 위원회를 거쳐 언제 가결·공포됐는가' 같은 의안 처리 경과를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 지방의회 의안·회의록 데이터와는 대수·회기·의안번호나 의원 이름을 맞춰 연결하고, 공포번호·공포일로 자치법규 자료와 대조한다.
limits: 표준화된 조인 키가 없어 다른 데이터와 연결하려면 이름·번호를 직접 매핑해야 한다. 범위는 김해시 한 곳의 시군구 의회 의안이며 공간 정보는 없다.
