description_portal: '본 데이터는 경기도 가평군 계약정보공개시스템을 통해 공개된 계약사업현황 자료입니다. 항목에는 회계연도, 관서명, 계약종류명, 계약일자, 계약명, 계약방법명, 거래처명, 계약금액, 지급금액, 데이터기준일자 등이 포함되어 있으며, 공공계약의 투명성과 재정 집행의 효율성 제고를 위해 제공됩니다. 연도별 계약 체결 내역과 계약 방식, 거래처 및 지급금액 등을 비교 분석할 수 있으며, 계약방법을 통해 수의계약, 제한경쟁, 일반경쟁 등 계약유형을 확인할 수 있습니다. 계약명과 거래처명을 통해 사업의 성격과 수행 주체를 파악하는 데에도 활용됩니다. 본 데이터는 예산집행 현황을 분석하거나 계약정보의 공개를 통한 행정 책임성 강화에 기초자료로 활용할 수 있습니다.*가평군계약정보공개시스템: https://gyeyak.gp.go.kr/'
