description_portal: 전북특별자치도의 공중화장실 현황 조회 서비스는 지역 내 설치된 공중화장실의 위치와 시설 정보를 종합적으로 제공하여 주민과 방문객의 편의를 높이는 서비스입니다. 구분, 근거, 화장실명, 소재지 도로명·지번주소, 남녀 및 장애인·어린이용 변기·소변기 수, 관리기관명, 전화번호, 개방시간 및 상세 시간, 설치연월일, 위도·경도, 화장실 소유 구분, 오물 처리 방식, 안전관리시설 설치 여부, 비상벨 설치 여부 및 위치, 입구 CCTV 설치 유무, 기저귀 교환대 설치 여부 및 위치, 리모델링 연월 등 세부 항목을 기준으로 데이터를 제공합니다. 이를 통해 이용자는 목적지 주변의 공중화장실 편의시설과 안전 장치를 확인하고, 쾌적하고 안전한 이용 환경을 확보할 수 있습니다.
