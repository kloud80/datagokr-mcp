summary_user: 전북특별자치도 내 공중화장실을 한 곳씩 담은 시설 목록으로, 화장실명·도로명/지번주소·위도경도와 남녀·장애인·어린이용 변기 수, 개방시간, 관리기관, 비상벨·입구 CCTV·기저귀 교환대 설치 여부 같은 시설 정보를 함께 제공한다. 주민이나 관광객이 목적지 주변에서 지금 열려 있고 비상벨이나 기저귀 교환대가 있는 화장실을 찾을 때, 또는 분석가가 시군별 안전시설 설치 현황을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 관리기관명 같은 이름 매칭으로만 이어 쓴다.
limits: 범위가 전북특별자치도에 한정되어 있어 다른 시도의 화장실은 이 API로 조회할 수 없다. 공통 코드 키가 없어 다른 시설 데이터와 연결하려면 주소·좌표 기반의 매칭이 필요하다. 호출에는 포털 활용신청(자동승인) 후 발급받은 serviceKey가 필요하며, 개발계정은 하루 10,000회까지 호출할 수 있다.
