summary_user: 경기도 내 공공기관이 공유누리 형태로 개방하는 행정상담서비스를 서비스 한 건(행정서비스일련번호)씩 담은 목록으로, 상담 분야·이용 대상·상담 방법·운영 요일과 오전/오후 시간·예약과 취소 마감 조건·일별/월별 예약 제한·주소와 위경도를 함께 담는다. 도민이 "우리 동네에서 평일 오후에 예약해 받을 수 있는 무료 법률·세무 상담이 어디 있고 언제까지 취소할 수 있나"를 확인하거나, 분석가가 시군별 상담서비스 분포와 공백을 살피는 데 쓴다. 전역 조인 키는 없어서 기관코드(inst_cd)나 지역코드(region_cd)를 같은 기관 코드 체계나 행정표준코드 원장과 맞춰 잇거나, 주소·위경도로 공간 결합해 쓴다.
description_portal: 이 데이터는 경기도 내 공공기관이 제공하는 행정상담서비스의 정보를 체계적으로 정리한 자료로, 서비스의 분야, 대상, 예약조건, 상담방법 등을 포괄적으로 제공합니다. ‘행정서비스일련번호’, ‘기관코드’, ‘예약분야’, ‘상담분야배열’ 등을 통해 각 서비스의 고유 정보와 상담 주제를 식별합니다. ‘예약취소구분’, ‘당일취소 마감시간’, ‘취소마감전 일자 및 시간’, ‘일별/월별 예약제한코드’ 등은 사용자 예약 및 취소 정책을 정의하며, 이 데이터는 행정서비스의 접근성 향상, 상담 수요 예측, 사용자별 맞춤 서비스 제공, 지역별 서비스 불균형 해소 등을 위한 기반 자료로 활용됩니다.
accrual_periodicity: 수시
team:
  dept: AI미래행정과
