description_portal: 서울특별시 중랑구 전자팩스번호 자료입니다.  1. 항목구성은 연번, 부서, 전자팩스번호로 구성되어 있습니다. 2. 전자팩스란 인터넷을 통해 팩스를 송수신할 수 있는 서비스를 의미합니다. 별도의 팩스기기 없이도 컴퓨터나 모바일 기기에서 문서를 주고받을 수 있습니다. 중랑구에서는 이러한 종이사용을 줄여서 환경보호에 기여할 수 있는 전자팩스를 사용 중입니다. 3. 전자팩스 번호는 490으로 시작합니다.4. 부서 및 동을 합하여 총 66개의 팩스번호를 제공합니다.5. 자세한 정보는 파일을 다운받아서 내용을 확인하여 주시기 바랍니다. 감사합니다.
