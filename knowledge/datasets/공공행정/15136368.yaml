summary_user: 전국 읍면동 단위로 행정동과 법정동의 대응 관계를 담은 연계표로, 시도·시군구·행정동·법정동 이름과 통계청 행정구역분류코드, 행정기관(행정동)코드, 법정동코드를 한 행에 묶은 파일(csv 약 82MB)이다. 법정동코드로 기록된 자료를 행정동이나 통계용 행정구역코드 기준으로 다시 집계하려는 분석가가 "이 법정동은 어느 행정동·통계구역에 속하나"를 확인할 때 쓴다. 법정동코드(bjd_cd)를 키로 법정동 기반 자료(주소·토지·건축물 등)와 이어 붙이고, 행정동코드·행정구역코드를 거쳐 행정동 단위 통계(유동인구·체류 외국인 등)와 맞춘다.
description_portal: 통계청 한국행정구역분류는 통계작성을 목적으로 전국의 행정구역을 일정한 순서에 따라 부호화한 자료입니다. 행정구역분류의 목적은 통계조사 시 지역자료의 분류와 집계, 지역 간 통계자료의 비교성 제고에 있습니다. 2021년 행정구역분류 코드 범위를 변경하였고, 자릿수 확대 등 분류체계 개편을 추진하였습니다.  해당 데이터는 행정동명 및 법정동명과 행정구역분류코드, 행정기관코드 및 법정동코드 정보를 수록한 파일입니다. 분류체계는 대분류(시,도), 중분류(시,군,구), 소분류(읍,면,동)의 3단계 8자리로 구성되어 있습니다.
