description_portal: '세종특별자치시시설관리공단은 자연장지(잔디장·수목장 등)의 이용 접수 현황을 투명하게 공개하고, 시민의 정보 접근성을 높이기 위해 자연장 접수 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 자연장 이용을 신청한 접수 내역을 중심으로, 자연장 계약·구분·구역·관내외 여부 등을 확인할 수 있도록 구성되어 있습니다.■ 데이터 컬럼 구성접수일자 - 자연장 이용이 공식적으로 접수된 날짜자연장계약일자 - 해당 접수 건의 자연장 계약이 체결된 날짜자연장구분 - 자연장의 유형    예: 잔디장, 수목장 도심형, 수목장 산림형 등자연장구역구분 - 해당 자연장이 속한 구역 구분 정보합장구분 - 단독 안치인지, 기존 안치자와 합장되는지 여부    예: 단독, 부부합장 등화장일자 - 고인의 화장이 이루어진 날짜관내관외구분 - 고인의 주소지 기준 구분 - 관내 / 관외■ 데이터 제공 목적자연장 접수 데이터는 다음을 목표로 제공됩니다. - 자연장 접수 현황의 투명한 공개 및 시민 정보 접근성 향상- 자연장 유형·구역·합장 여부 등 이용 특성 분석 지원 - 자연장 운영의 효율성과 공정성 강화 - 장사행정 정책 수립 및 수요 관리의 기초 자료 활용 - 민원 대응 품질 개선 및 예측 가능한 장사 서비스 제공'
