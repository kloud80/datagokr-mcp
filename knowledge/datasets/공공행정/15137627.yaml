description_portal: 경상북도 경주시에서 제공하는 본 데이터는 대표홈페이지 내 주요 메뉴별 이용자 만족도 통계를 포함하고 있으며, 각 메뉴에 대해 5점부터 1점까지의 점수로 구분된 만족도 응답 수치를 수록하였다. 제공 항목은 순번, 메뉴명, 만족도 점수별 응답 수, 데이터 기준일 등으로 구성되어 있으며, 이 데이터를 통해 행정 서비스 품질에 대한 시민 반응을 분석할 수 있다. 분석 결과는 향후 홈페이지 개선 및 시민 맞춤형 콘텐츠 제공을 위한 기초자료로 활용 가능하다. 또한 정보 제공의 투명성과 이용자 중심 행정 실현을 목표로 하며, 웹서비스 운영 현황을 파악하는 데 도움을 준다. 데이터는 파일 형식으로 제공되며, 공공데이터 이용자의 서비스 접근성 향상에 기여한다.
