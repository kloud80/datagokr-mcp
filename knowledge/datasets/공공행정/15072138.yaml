description_portal: 서울시 채용시험 정보 데이터는 서울시 및 산하기관에서 시행하는 각종 공채, 경력채용, 기간제 채용 등의 시험·모집 공고를 체계적으로 제공하기 위한 공공 데이터입니다. 게시물 아이디, 게시물 제목, 작성자 명, 담당기관, 담당부서, 전화번호, 이메일을 통해 채용 정보의 기본 내용과 문의처를 명확히 파악할 수 있습니다. 작성일자, 최종수정일자, 게시 시작일, 게시 종료일은 공고의 게시·수정 이력과 유효 기간을 확인하는 데 활용되며, 채용마감일자는 원서접수 및 지원 가능 기한을 알려주는 핵심 항목입니다. 내용, 태그, 조회수, 트랙백 주소는 채용 시험의 세부 요강, 관련 키워드, 관심도, 외부 서비스 연계 정보를 제공해 수험생의 정보 탐색을 돕습니다. 또한 첨부파일 개수, 첨부파일 아이디, 파일명, 파일크기, 첨부파일 주소를 통해 공고문, 응시원서 양식, 직무설명서 등 관련 자료를 내려받아 활용할 수 있어, 시민과 수험생에게 편리한 채용 정보 접근 환경을 제공합니다.
