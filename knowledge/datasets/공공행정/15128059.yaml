description_portal: 국민신문고는 대한민국 국민이 행정기관, 공공기관, 지방자치단체 등에 대해 민원, 제안, 신고, 정책 참여 등을 온라인으로 통합 신청할 수 있도록 만든 정부 대표 민원 포털입니다.2011년부터 국민신문고에 접수된 민원을 접수 경로별(국민신문고, 부처 홈페이지, 지자체, 이송이첩, 서신, 대통령실)로 구분하여 연도별로 제공합니다. 접수 경로에는 신문고 홈페이지, 부처 홈페이지, 지자체 이송, 서신, 대통령실 등이 포함됩니다. 이를 통해 민원 접수의 주요 경로를 파악하고, 서비스 개선에 활용할 수 있습니다.​
