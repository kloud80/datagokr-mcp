summary_user: 서울시에 인허가된 공연장을 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·폐업·휴업 일자와 영업상태, 주소·좌표, 층수·시설면적 같은 시설 규모를 함께 담는다. 연구자나 정책 담당자가 서울 안에서 현재 영업 중인 공연장이 어디에 얼마나 있고 규모가 어떤지, 언제 문을 열고 닫았는지 파악하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주소·사업장명 매핑이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 잇는다. LOCALDATA 지방행정 인허가와 같은 원천을 공유한다.
description_portal: 서울시 공연장 인허가 정보는 서울시에 인허가된 각종 공연장의 기본 현황과 영업 상태, 시설 규모를 파악하기 위한 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태명과 상세영업상태명 등을 통해 공연장이 현재 영업 중인지, 휴업 또는 폐업 상태인지, 언제부터 어떤 형태로 운영되었는지를 확인할 수 있습니다. 사업장명, 전화번호, 지번주소·도로명주소, 우편번호, 좌표정보, 소재지면적 등은 공연장의 위치와 연락처, 대략적인 부지 규모를 제공하여 현장 조사, 지도 시각화, 관객 안내 등에 활용할 수 있습니다. 업태구분명, 문화체육업종명, 문화사업자구분명, 지역구분명은 해당 시설이 어떤 유형의 문화시설로 분류되는지와 지역적 특성을 보여주는 핵심 정보입니다. 건물용도명, 총층수, 지상·지하층수, 건축연면적, 시설면적, 시설규모, 무대면적, 좌석수, 회의실별 동시수용인원 등은 공연장의 실제 수용 능력과 공간 구성, 공연·이벤트 운영 규모를 파악하는 데 중요한 지표입니다. 또한 방송시설, 발전시설, 의무실, 안내소 유무와 부대시설 내역 정보는 관객 안전, 편의, 운영 지원 수준을 가늠하게 해줍니다. 이와 같은 주요 정보를 통해 서울시 공연장의 분포, 규모, 수용력, 영업 상태를 분석하고 공연 인프라 정책 수립, 안전·서비스 관리, 문화정책 연구에 활용할 수 있는 기초 자료로 쓰일 수 있습니다.
