description_portal: 국민권익위원회는 2018년부터 공공기관의 청렴도 평가 결과를 등급으로 발표하고 있습니다. 평가는 중앙행정기관, 광역자치단체, 기초자치단체, 교육청, 공직유관단체 등 다양한 기관 유형을 대상으로 하며, 종합청렴도, 청렴체감도, 청렴노력도 등 세 가지 영역에서 1등급부터 5등급까지 등급을 부여합니다. 2022년부터는 평가 방식이 일부 변경되어, 종합청렴도, 청렴체감도, 청렴노력도 세 가지 영역으로 구성되어 있습니다. 이러한 등급 발표는 각 기관이 자신의 청렴 수준을 객관적으로 파악하고, 부족한 부분을 개선하는 데 활용됩니다.
