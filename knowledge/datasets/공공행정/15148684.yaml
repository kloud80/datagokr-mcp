description_portal: 본 데이터는 설문지 기반의 응답 현황 및 문항별 이력 관리를 위한 "설문조사 목록"으로, 설문 응답 데이터의 기본 단위를 구성한다. 주요 필드로는 문항답변유무, 설문지ID, 설문문항ID, 설문템플릿ID가 포함되며, 각 문항의 최초 등록 및 최종 수정 시점과 담당자 식별자(최초등록자ID, 최종수정자ID)를 함께 기록한다. 이를 통해 설문지 구성 구조, 응답 여부 파악, 설문 템플릿 적용 현황 및 등록·수정 이력 관리가 가능하다. 데이터는 매년 1회 정기적으로 갱신할 계획이며, 본 자료는 2025년 9월 5일 기준으로 추출되었다. 향후 설문 응답률 분석, 항목별 응답 분포 파악, 템플릿 활용 현황 검토 등 정책 수립 및 설문 운영 개선에 유용하게 활용될 수 있다.
