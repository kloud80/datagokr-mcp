description_portal: 등록된 데이터 현황은 금정구 관내 운행중인 마을버스에 대한 정보로, 마을버스 번호, 마을버스 업체명, 운행구간(시작-경유-종점) 등에 대한 정보를 포함하고 있습니다.이 파일은 2026년 1월 15일 기준, 부산광역시 금정구에서 운행 중인 마을버스 노선별 현황을 "마을버스 관리 카드" 형태로 정리한 자료입니다.각 노선(금정구 1번, 2-1번, 7번 등)별로 운수업체명, 기점, 경유지, 그리고 종점의 구체적인 운행 구간 정보를 상세히 제공합니다.수록된 노선들은 부산외국어대학교, 범어사역, 장전지하철역, 금정구청 등 주요 교통 및 생활 거점과 산성공해마을, 오륜본동 등 지역 곳곳을 연결하고 있습니다.특히, (주)태성여객이 금정구 2-2, 3, 3-1, 3-2 등 가장 많은 노선을 운영하고 있으며, 이 자료는 지역 주민의 대중교통 접근성 및 교통 정책 수립에 활용됩니다.
