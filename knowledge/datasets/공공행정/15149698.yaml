description_portal: (합성데이터) 한국수력원자력의 1992년 7월부터 2024년 12월까지 원자력 관련 자격증 취득현황을 합성데이터 제공드립니다. 제공항목은 취득자,취득일자,자격만료일자,직급명,자격명,발급기관으로 구성되어있으며 취득자 제공항목은 합성되었습니다. 발급기관의 경우 원자력안전위원회, 과학기술부, 교육과학기술부가 있으며 자격명의 PWR은 가압경수로, PHWR은 가압중수로를 의미합니다. 또한 RO는 원자로조종사, SRO는 원자로조종감독자를 의미합니다.※ 본 데이터는 합성데이터로 주기적 제공이 어려운 데이터로 수시성 1회성 데이터로 제공드립니다.
