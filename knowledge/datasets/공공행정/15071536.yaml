description_portal: 서울시 문화예술법인 인허가 정보는 서울시에 인허가된 박물관·미술관 등 문화예술 관련 법인의 행정 이력과 시설·운영 특성을 파악할 수 있는 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자 등 영업상태 관련 항목을 통해 해당 문화예술법인의 인허가 및 운영 변동 이력을 확인할 수 있습니다. 사업장명, 법인명, 전화번호, 지번·도로명 주소, 우편번호, 좌표(X·Y), 소재지면적 등을 통해 법인의 위치와 기본적인 사업장 현황을 파악할 수 있습니다. 문화체육업종명, 박물관·미술관 종류명과 유형명, 설립·운영주체구분명, 법인설립목적, 허가조건 등은 해당 법인의 성격, 운영 주체, 설립 목적과 법적·행정적 조건을 이해하는 데 도움이 됩니다. 준공일자, 개관일자, 폐관일자 및 폐관사유를 통해 시설의 건립·개관·폐관에 이르는 전 과정을 시간 순으로 추적할 수 있습니다. 또한 자본금, 소요자금 등의 항목은 법인의 재무 규모와 설립·운영에 투입된 자금 수준을 가늠하는 자료로 활용될 수 있습니다. 이러한 정보는 서울시 내 문화예술 인프라의 분포, 설립·운영·폐관 현황, 법인 특성 및 재무·시설 규모를 분석·관리하는 데 유용한 인허가 기반 데이터입니다.
