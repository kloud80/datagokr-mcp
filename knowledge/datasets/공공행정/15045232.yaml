description_portal: '이 공공데이터는 인천광역시가 소유·관리하는 토지 및 건물 등의 공유재산에 대한 재산 종류, 면적, 관리 부서 등의 상세 현황을 정리하여 제공하는 행정 정보 자료입니다.<활용 목적>재정 및 자산 관리: 시의 재산 목록을 정확히 파악하여 재정 건전성 및 자산 운영 효율성을 분석하고, 공유재산 관리 계획 수립의 기초 자료로 활용됩니다.정보 공개 및 투명성: 시민들에게 시유 재산의 보유 현황과 관리 주체를 공개함으로써 행정의 투명성을 확보하고, 재산 활용에 대한 의견을 수렴하는 데 기여합니다.도시 계획: 지역별 토지 및 건물 보유 현황을 분석하여 도시 개발 및 시설 배치 계획 수립에 활용됩니다.인천시 공유재산의 효율적이고 투명한 관리를 위한 핵심 기반 정보입니다.'
