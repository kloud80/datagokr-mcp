summary_user: 지방자치단체의 세출 결산액을 회계연도·자치단체·기능 분야(14개 분야 54개 부문)별로 나누고, 구조별로 정책사업비·행정운영경비·재무활동 금액을 따로 담은 전국 단위 집계 데이터다. 주민이나 지방재정 분석가가 "우리 시·군·구가 지난해 사회복지나 교통 분야에 실제로 얼마를 썼고, 그중 인건비 같은 행정운영경비 비중은 얼마인가"를 확인할 때 쓴다. 전역 조인 키는 없으므로 자치단체 코드·이름(laf_cd, laf_hg_nm)과 분야 코드(fld_cd)를 기준으로 지방재정365의 다른 세출·세입 결산 데이터와 이름·코드 매핑으로 잇는다.
description_portal: 지방자치단체의 세출예산은 사업별예산제도에 따라 14개분야, 54개 부문으로 기능적 분류를 하고있으며, 사업의 구조에 따라서는 일반적인 사업을 수행하는 정책사업과 행정운영경비, 재무활동으로 분류합니다. 행정운영경비는 지방자치단체 행정조직 운영을 위한 최소한의 경상비로서 기준인건비제도에 따른 인력운영비와 관서울영을 위한 기본경비로 구분됩니다. 재무활동은 기관내의 회계간 전출입금에 해당하는 내부거래지출과 차입금이자상환 등에 해당하는 보전지출 대상통계목들이 편성됩니다.구조별기능별세출결산은 자치단체의 결산내역을 구조별(정책사업,행정운영경비, 재무활동) 내역을 기능별(14개분야 54개부문)로 분류한 결산액 정보를 제공합니다.
