summary_user: 서울 강남구의 수영장업 인허가 업소를 건별로 담은 원장으로, 업소별 관리번호·인허가일자·영업상태(영업/휴업/폐업)·휴폐업 일자·사업장명·도로명/지번 주소·좌표 등을 포함한다. 상권 분석가나 창업 예정자가 "강남구에서 지금 영업 중인 수영장은 어디이고 최근 폐업한 곳은 어디인가" 같은 점포 이력·입지 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, LOCALDATA 인허가 자료와 원천을 공유한다.
