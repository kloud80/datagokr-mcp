description_portal: 서울시 영화상영관 인허가 정보는 서울시에 위치한 영화상영관을 대상으로 인허가 현황과 기본 특성을 제공하는 공공데이터입니다. 각 영화상영관에 대해 인허가일자, 인허가취소일자, 영업상태와 상세영업상태, 폐업 및 휴·재개업 일자 등의 행정이력을 포함하고 있어, 시간에 따른 영업 변동을 파악하는 데 활용할 수 있습니다. 또한 사업장명, 업태구분명, 문화체육업종명, 문화사업자구분명, 지역구분명 등의 항목을 통해 영화상영관의 업종 특성과 지역적 분포를 확인할 수 있습니다. 지번주소와 도로명주소, 우편번호, 전화번호, 좌표정보(X, Y) 등이 함께 제공되어 각 상영관의 위치 정보를 정확하게 파악할 수 있으며, 소재지면적과 시설면적, 총층수, 지상·지하층수, 건물용도명 등 시설 규모 및 건물 특성 정보도 확인할 수 있습니다. 더불어 비상계단, 비상구, 소방시설, 자동환기, 방음시설, 조명·음향시설, 편의시설 등의 여부는 안전과 관람 환경 수준을 살펴보는 데 유용합니다. 이 데이터는 영화상영관 인허가 관리, 안전점검, 지역별 문화 인프라 분석, 상권 및 입지 분석 등 다양한 행정·연구·정책 수립을 위한 기초 자료로 활용될 수 있습니다.
