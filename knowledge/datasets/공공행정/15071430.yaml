summary_user: 서울시 국제회의기획업 사업장의 인허가 현황을 사업장 1곳당 1행으로 담은 원장으로, 인허가·취소 일자, 영업상태와 상세상태, 지번·도로명 주소와 평면좌표(X, Y), 회의실 동시 수용 인원·시설 면적 같은 시설 정보, 영문 상호·주소, 보험기관 정보를 포함한다. 분석가나 MICE 관련 사업자가 서울 안에서 영업 중인 국제회의기획업체가 어느 지역에 몰려 있고 휴·폐업 흐름이 어떤지 확인하는 데 쓴다. 전역 조인 키는 없고, 같은 원천을 공유하는 LOCALDATA 인허가 자료와는 관리번호(MGTNO)·자치단체코드(OPNSFTEAMCODE)로 맞춰 볼 수 있으며, 그 밖의 자료와는 주소나 이름 매핑으로만 잇는다.
description_portal: 'ㅇ 자료명: 서울시 국제회의기획업 인허가 정보. 국제회의 및 기업행사 기획을 수행하는 사업장의 인허가 현황을 통합 관리하는 행정기록으로, 사업장 식별·위치·상태·시설 정보를 한곳에 모았습니다.ㅇ 기본 항목: 사업장명, 지번·도로명 주소, 지역 구분, 연락처 등 기관·업체 식별과 위치 파악에 필요한 기초 정보를 제공합니다.ㅇ 좌표 정보: 평면좌표 기반의 위치 값이 포함되어 지역 단위 분석, 지도 시각화, 주변 인프라 연계 검토에 활용할 수 있습니다.ㅇ 인허가 이력: 허가, 취소, 휴·폐업, 재개업 등 영업상태와 상세상태를 함께 제공하여 변동 이력과 행정처분 흐름을 추적할 수 있습니다.ㅇ 업종·사업자 구분: 문화·관광 분야 내 국제회의기획업으로 분류되며, 관련 정책 대상군 선별과 업권 특성 비교 분석에 유용합니다.ㅇ 시설·인프라: 회의실 동시 수용 인원, 시설 면적, 건물 용도, 층수, 객실 및 부대시설 보유 여부 등 행사 운영 역량을 가늠할 수 있는 정보를 담고 있습니다.ㅇ 영문 정보: 영문 상호와 영문 주소를 포함해 국제 참가자 안내, 해외 바이어 커뮤니케이션 등 다국어 서비스에 바로 활용 가능합니다.ㅇ 보험·보증: 보험 기관 및 보험·보증 관련 항목이 있어 소비자 보호, 리스크 관리, 행정 점검 시 참고자료로 활용됩니다.ㅇ 데이터 관리: 갱신 구분과 최종 수정 관련 항목을 통해 최신성 점검과 이력 관리가 가능하며, 정책 모니터링과 현황 보고에 적합합니다.ㅇ 활용 예시: MICE 산업 통계 산출, 지역별 사업장 분포 분석, 행사 수용 역량 진단, 안전·민원 대응 기반 자료로 활용할 수 있습니다.'
