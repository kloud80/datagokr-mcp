summary_user: 'SGIS 분석지도의 성씨분포 서비스에 나오는 본관인구를 성씨·본관·시군구별 인구수로 집계한 전국 단위 CSV 파일이다. 특정 성씨와 본관(예: 김해 김씨)이 어느 시군구에 많이 사는지 알고 싶은 종친회, 지역사 연구자, 분석가가 쓴다. 전역 조인 키나 행정구역 코드 없이 시군구명만 있어서, 다른 시군구 통계나 경계와 붙이려면 시군구명을 행정구역 코드에 이름으로 매핑해야 한다.'
description_portal: '[SGIS 오픈 플랫폼] 대메뉴 "분석지도"내의 "성씨분포" 서비스에서 제공하는 본관인구 데이터입니다.성씨별, 본관별, 시군구별 인구수를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 성씨분포우리나라의 성씨와 주요 본관에 대해서 지역별로 인구비율 및 과거로부터의 변화를 비교해볼 수 있는 서비스'
