description_portal: 한국동서발전의 임직원 사회공헌 마일리지 정보는 임직원이 참여한 사회공헌 활동 내역을 시간 단위로 정량화하여 기록한 데이터로, 공공기관의 자발적 사회 기여 활동 수준을 평가할 수 있는 자료입니다.데이터는 참여일, 인정시간, 사회공헌 참여 구분(근무일, 휴무일 등), 사업 구분, 활동 분야, 활동 장소, 활동 내용 등의 항목으로 구성되며, 활동 시간과 유형별 실적을 상세히 확인할 수 있도록 설계되어 있습니다.이 데이터는 임직원 개인의 자원봉사 참여 실적뿐 아니라, 조직 차원의 사회공헌 전략 실행 현황을 파악하는 데 활용할 수 있으며, 공기업의 ESG(환경·사회·지배구조) 경영 실천 수준을 분석하는 데 기초 자료로 활용됩니다.학계 및 연구기관에서는 이 데이터를 활용해 임직원 참여 기반 사회공헌 모델 연구, 활동 분야별 참여도 비교, 참여 시간대별 또는 요일별 활동 분석, 근무일/휴무일 참여 비율 분석 등 다양한 사회적 가치 평가 연구를 수행할 수 있습니다.또한, 사회공헌 마일리지를 조직문화 및 직원 인센티브와 연계한 정책 설계, 자발성 중심의 사회공헌 활성화 방안 도출, 지역 사회 기여도 분석 등에도 활용이 가능하며,공공기관의 사회적 책임 이행 수준과 참여 기반 CSR(기업의 사회적 책임) 활동의 정량화된 성과로서도 중요한 의미를 갖습니다.
