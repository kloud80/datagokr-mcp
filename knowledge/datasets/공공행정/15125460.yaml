summary_user: 가맹사업 기준년도와 가맹본부관리번호로 조회하는 가맹본부 임원 정보로, 임원별 이름·직위와 경력 기간·직위·업무를 임원·경력 일련번호 단위의 건별 행으로 담으며 범위는 전국이다. 가맹점 창업을 앞둔 사람이 "이 가맹본부 경영진이 어떤 사업 경력을 가졌고 믿을 만한가"를 정보공개서 차원에서 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 같은 공정위 가맹정보 계열 데이터와는 가맹본부관리번호와 기준년도로 맞춰 쓰며, 다른 기관 데이터와는 이름 매핑으로만 이을 수 있다.
limits: 사업자등록번호·법인등록번호 같은 전역 조인 키가 응답에 없어 다른 기관의 사업자 데이터와 바로 연결되지 않는다. 기준년도와 가맹본부관리번호를 알아야 조회되므로 관리번호를 먼저 다른 가맹정보 목록에서 확보해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
