description_portal: '세종특별자치시시설관리공단은 장사시설의 이용 내역을 체계적으로 관리하고, 시민이 시설 운영 현황을 투명하게 확인할 수 있도록 시설이용이력 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 장례시설의 계약 및 종료 이력을 포함한 일자별 이용 정보를 담고 있으며, 효율적인 시설 운영과 서비스 품질 향상을 위한 기초자료로 활용됩니다.■ 데이터 컬럼 구성시설구분 - 이용된 시설(장례식장)의 종류 구분시설일별순번 - 해당 이용일자 내에서의 순번(일자별 이용 건 식별용)이용일자 - 시설 이용이 이루어진 날짜업무구분 - 이용 행위의 구분    예: 계약(이용 시작), 종료(이용 완료)■ 데이터 제공 목적시설이용이력 데이터는 다음과 같은 목적을 위해 제공됩니다. - 장사시설 이용 현황의 투명한 공개 및 시민 정보 접근성 향상 - 시설별 계약·종료 등 이용 절차의 체계적 관리 - 이용 패턴 분석을 통한 효율적인 시설 운영 및 정책 수립 지원 - 민원 대응의 정확성 제고 및 이용자 만족도 향상 - 장사행정의 공정성 강화 및 데이터 기반 행정 추진세종특별자치시시설관리공단은 시민이 신뢰할 수 있는 장사서비스 제공을 위해, 시설 이용 관련 데이터를 지속적으로 갱신·공개하겠습니다.'
