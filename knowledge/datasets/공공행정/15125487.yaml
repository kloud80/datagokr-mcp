summary_user: 가맹 브랜드별로 가맹점사업자와 종업원 구분에 따른 교육 기준과 계약·채용 기준 내용을 기준년도 단위로 담은 전국 범위 API입니다. 가맹 창업을 준비하는 사람이 "이 브랜드는 가맹점주와 직원에게 어떤 교육을 요구하고, 채용 계약 조건은 어떤가"를 정보공개서 내용으로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 같은 기관의 가맹정보 서비스와는 브랜드관리번호(brandMnno)·가맹본부관리번호와 기준년도로 맞춰 이어 쓴다.
limits: 사업자등록번호·법인등록번호 같은 전역 조인 키가 실측 컬럼에 없어 다른 기관 데이터와는 이름 매핑이나 공정위 내부 관리번호로만 연결된다. 교육·채용 기준은 서술형 텍스트라 수치 비교·집계에는 별도 가공이 필요하고, 개발계정은 일 10,000회 호출로 제한된다.
