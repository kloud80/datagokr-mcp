summary_user: 국가법령정보센터에 등록된 학칙·공단 규정의 조문 제목, 부칙 내용, 별표 제목을 규정명·발령일자·시행일자와 함께 건별로 담은 전국 단위 파일(CSV, 약 1.5MB)이다. 학교·공단 실무자나 법제 분석가가 특정 학칙·공단 규정이 언제 발령·시행됐고 부칙에 어떤 경과 규정이나 특례가 붙었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 규정명(학칙공단명)이나 일련번호(학칙공단일련번호)를 이름·코드 매핑으로 맞춰 같은 기관의 학칙공단 목록·본문 데이터와 이어 쓴다.
description_portal: 국가법령정보센터 학칙공단 조문부칙별표입니다. 이 자료는 학칙의 본문의 조항과 이를 보충하거나 수정하는 부칙 규정의 조문 번호, 제목, 시행 일자, 적용 대상 및 경과 조치를 정리한 표 형식입니다. 각 부칙 조항이 본 조문과 어떻게 연결되는지 체계적으로 제시합니다. 이를 통해 학칙의 제정·개정 과정에서 발생하는 예외 규정, 경과 규정 및 시행상의 특례 사항 등을 명확히 확인할 수 있습니다. 공공기관, 학교, 단체 등이 관련 규정을 준수하고 혼선을 방지하는 데 기초 자료로 활용됩니다. 아울러 법적 효력 발생 시점과 대상 범위를 일목요연하게 파악할 수 있도록 구성하였습니다.
