description_portal: '"공통표준단어"란 공통표준용어를 구성하기 위하여, 공통적인 단어를 표준으로 정의한 것을 의미합니다. 공통표준단어는 "공통표준단어명", "공통표준단어영문명", "공통표준단어영문약어명" 등으로 구성되어 있으며, 업무용어에 기반한 최소단위의 명사형 단어입니다.공통표준단어는 공공기관이 데이터베이스(DB) 등을 구축할 때 준용하여야 하며, 공통표준 준용과 관련된 상세한 내용은 『공공기관의 데이터베이스 표준화 지침 제11조~제13조』, 『공공데이터베이스 표준화 관리 매뉴얼』을 참고하시면 됩니다.※ 공공데이터 공통표준 8차 제·개정(2025.11월) 기준'
