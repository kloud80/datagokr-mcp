description_portal: 전라남도 해남군 1인 가구 현황에 대한 데이터입니다.이 데이터는 2025년 11월 기준으로 해남군의 읍면별 1인가구 수에 대한 항목을 제공해드립니다.현재 우리군 1인가구 수는 17,752명이며 총 인구수 대비  약 28.5%에 해당합니다. 해남읍이 5,009명으로 가장 많으며, 송지면 1,739명, 황산면 1,315명 등의 순입니다. 1인가구의  증가에 따른 사회적 고립과 주거 불안정 문제를 해결하기 위해  청년 대상으로 주택자금 대출 이자   및 주거비 지원,중장년 대상으로 1인가구 복지 1촌 맺기, 위기가구 발굴 및 맞춤형 사례관리 등으로 다양한 맞춤형 지원정책을 추진하고 있습니다.
