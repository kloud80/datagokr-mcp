summary_user: 경기주택도시공사 홈페이지 방문자 수를 검색엔진·직접 접속·외부 링크 같은 유입 유형별로 나눠 월(접속연월) 단위로 집계한 자료이며, 범위는 시도 단위이고 공간 정보는 없다. 공사 홍보 담당자나 공공 디지털 서비스 분석가가 "어느 경로로 들어온 방문자가 가장 많고 시기별로 어떻게 바뀌었나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 유입채널명·접속연월 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기주택도시공사 홈페이지 방문자의 유입 유형별 현황을 기록한 자료입니다. 검색엔진, 직접 접속, 외부 링크 등 다양한 경로를 통해 홈페이지에 접속한 방문자 수를 구분하여 집계하고 있어, 이용자 접근 방식, 홍보 채널 효과, 온라인 노출도를 분석하는 데 활용할 수 있습니다. 이를 통해 공사는 효율적인 홍보 전략 수립, 정보 제공 경로 최적화, 온라인 서비스 접근성 개선에 참고할 수 있으며, 연구기관이나 정책 담당자는 공공기관 디지털 서비스 이용 특성, 채널별 방문자 기여도, 전자행정 효과 분석의 기초자료로 활용할 수 있습니다. 또한 특정 시기별 유입 경로 변화는 디지털 홍보 성과 평가 및 개선 방향 설정에도 도움이 됩니다.
