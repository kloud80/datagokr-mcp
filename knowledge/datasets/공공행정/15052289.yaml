description_portal: 건설사업정보시스템(CALS)은 도로 건설사업의 기획부터 설계, 시공, 유지관리에 이르는 전 과정에서 발생하는 각종 정보와 문서를 전산망을 통해 교환·공유하는 통합 정보화 시스템입니다. 발주기관과 관련 업체가 온라인으로 협업하여 업무 효율성을 높이고, 공사 현황 및 계약 정보의 체계적인 관리를 통해 발주기관의 신속하고 정확한 의사결정을 지원함으로써 건설사업의 생산성과 투명성을 향상시키는 것을 목표로 합니다. 도로 건설사업의 전 과정에서 발생하는 문서, 도면 등 각종 정보를 발주기관과 건설업체가 온라인으로 공유하고 업무를 처리함으로써, 발주기관의 효율적인 사업 관리와 신속한 의사결정을 지원하는 시스템입니다. 건설사업정보시스템(건설사업관리시스템)에서 작성한 문서중 국토교통부_도로 공사정보 데이터 입니다.
