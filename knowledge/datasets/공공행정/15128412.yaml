description_portal: 경기주택도시공사에서 체결한 2023년 이후 수의계약의 현황을 정리한 데이터로써, 계약의 투명성과 공정성을 확보하기 위하여 공사, 물품, 용역 등의 계약명, 계약일, 계약상대자, 계약금액, 법적 근거, 수의계약 체결 사유 등을 포함하고 있습니다. 수의계약 사유에는 추정가격이 2천만원 이하의 계약, 여성기업, 장애인기업 등 특정 기업에 대한 계약 정보도 확인할 수 있어 공공기관의 우선계약 실적을 파악할 수 있으며, 계약정보공개를 통해 공정한 시장환경 조성과 정책 평가자료로 활용될 수 있습니다. 또한 연도별 계약 추이분석을 통해 예산집행의 효율성 제고와 행정의 책성을 강화하는데 기여합니다.
