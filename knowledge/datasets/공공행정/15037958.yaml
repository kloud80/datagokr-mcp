summary_user: 경상남도 사천시의회에 접수된 의안을 한 건씩 담은 원천 목록 파일(CSV, 약 36만 바이트)로, 대수·접수번호·의안명·제출(발의)자·위원회 회부·상정일, 본회의 의결 결과, 집행부 이송 부서·이송일, 의안종류를 담는다. 사천시민이나 지방의회 분석가가 '특정 조례안이 언제 누가 제출해 어느 위원회를 거쳐 어떻게 처리됐는가', '대수별로 시장 제출안과 의원 발의안이 각각 몇 건인가'를 확인하는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어 의안명·제출자 이름이나 같은 사천시(기관) 기준으로만 다른 지자체 의회 의안 자료나 사천시 조례·회의록 자료와 맞대어 쓴다.
description_portal: '경상남도_사천시_의안정보입니다. 경상남도 사천시 의안에 관한 정보를 제공합니다. (의안명, 제출자, 회부일, 상정일 등에 관한 데이터)공공데이터는 각 의안의 처리 과정을 시간 순서대로 추적할 수 있도록 다음과 같은 핵심 항목들을 포함하고 있습니다.의안명: 의회에 제출된 안건의 정식 명칭으로, 안건의 내용을 간결하게 나타냅니다.제출자: 해당 의안을 발의하거나 제출한 주체 (예: 사천시장, 의원, 위원회)를 명시합니다.회부일: 의안이 소관 상임위원회 또는 의회 본회의에 공식적으로 접수된 날짜입니다.상정일: 의안이 심의를 위해 본회의나 위원회 회의에 공식적으로 논의 안건으로 올라간 날짜입니다.추가 정보: 심사 결과, 처리 상태 (원안가결, 수정가결, 부결 등), 의결일 등의 최종 처리 과정 정보가 포함될 수 있습니다.이 자료를 통해 사천시민들은 시정에 어떤 변화가 논의되고 있는지를 실시간으로 확인할 수 있으며, 관심 있는 정책의 입안부터 최종 결정까지의 전 과정을 추적할 수 있습니다'
