description_portal: 본 데이터는 경기도 안성시의회에서 개최되는 각종 회의의 인터넷 생방송 일정을 체계적으로 관리하고 제공하기 위한 자료이다. 각 레코드에는 회의별 고유 번호, 의회 코드, 대수, 회기, 위원회 코드, 차수 및 차수형식, 생방송 시작 일시, 생방송 종료 일시, 생방송 채널 고유 번호, 생방송 상태, 생방송 설명, 등록일, 최종 수정일 정보가 포함된다. 이를 통해 사용자는 특정 회의의 생방송 예정 시간과 중계 채널을 사전에 확인하여 실시간 시청을 준비할 수 있으며, 이미 종료된 회의의 방송 이력을 조회하여 의정활동 진행 경과를 파악할 수 있다. 해당 데이터는 공개 대상이 아닌 비공개 회의 정보는 포함하지 않는다.
