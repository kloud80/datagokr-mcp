description_portal: '[SGIS오픈플랫폼] 통계주제도 서비스의 지표에 관한 영문 정보입니다.지표별 카테고리명, 제목, 관련통계정보, 설명, 좌표, 조회수 등의 정보를 포함합니다[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 통계주제도  통계와 관련하여 주요주제에 따른 관심사별 통계정보를 손쉽게 확인할 수 있는 서비스'
