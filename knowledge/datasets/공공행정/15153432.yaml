description_portal: '세종특별자치시시설관리공단은 화장 접수 및 배정 과정에서 발생하는 주요 사항을 투명하게 관리하고, 시민이 화장 절차의 진행 상황을 이해할 수 있도록 화장메모 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 접수 정보, 화장 차수, 화로 배정 현황, 상태, 특이사항 등을 기록하여 화장시설 운영의 정확성과 신뢰성을 높이기 위해 구축된 자료입니다.■ 데이터 컬럼 구성일렬번호각 화장메모 건을 식별하기 위한 고유 번호접수일화장이 접수된 날짜화장차수해당 접수 건의 화장 처리 순번예: 1차, 2차 등확정화로번호최종적으로 배정된 화로(화장로) 번호예약시화로번호예약 단계에서 임시로 배정되었던 화로 번호예약과 최종 배정의 차이를 확인할 수 있는 정보상태접수 건의 진행 상태예: 접수완료, 화장대기, 화장완료 등메모해당 접수 건과 관련된 특이사항, 참고내용, 행정 처리 기록 등■ 데이터 제공 목적화장메모 데이터는 다음과 같은 목적을 위해 제공됩니다.화장 접수 및 배정 과정의 투명성 강화화로 배정 변경 및 처리 흐름 확인을 통한 시민 이해도 향상화장시설 운영의 효율성 및 정확성 제고민원 대응 품질 향상 및 행정 신뢰도 확보세종특별자치시시설관리공단은 앞으로도 화장시설 운영 정보를 지속적으로 업데이트하여, 시민에게 더 명확하고 신뢰할 수 있는 서비스를 제공하겠습니다.'
