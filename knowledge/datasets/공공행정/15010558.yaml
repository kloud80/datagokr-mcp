summary_user: 울진군 관내 마을회관을 한 곳씩 담은 시설 원장 파일로, 회관명·도로명/지번 주소·자연부락명과 함께 해당 마을의 가구수·인구수, 연면적·층수·건물구조·건립연도, 자체사용·임대·폐기 여부와 경로당 겸용 같은 용도 구분을 담는다. 주민이나 군 담당자가 '우리 부락 마을회관은 어디에 있고 언제 지어졌으며 경로당으로도 쓰이는가', 분석가가 '노후 회관이 많은 부락은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 자연부락명을 이름으로 맞춰 연결하거나 같은 울진군 자료끼리만 이어 쓴다.
