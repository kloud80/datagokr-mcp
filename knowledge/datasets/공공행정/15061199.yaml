summary_user: 지방공기업 통합경영공시 항목 중 하나로, 지방공기업별 복수노조 교섭단체 단일화 정보(교섭방식, 교섭창구 단일화방식, 대표노조명, 자율과반수 여부, 공동교섭대표단 구성, 노동위 결정 여부, 확정일자)를 연도·기관 단위로 전국 범위에서 담는다. 노무 담당자나 분석가가 "특정 지방공기업은 어떤 방식으로 교섭창구를 단일화했고 대표노조는 누구인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 경영공시 데이터와는 지자체명·기관명 같은 이름 매핑으로만 연결한다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이다. 복수노조 교섭단체 단일화정보에는 연도, 지자체명, 기관명, 교섭방식, 교섭창구 단일화방식, 대표노조명, 자율과반수 여부, 공동교섭대표단 구성내역, 자율노동위 결정여부, 확정일자 지표가 포함된다. 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
