description_portal: '이 데이터는 강원특별자치도 원주시가 시민의 안전신문고 앱을 통해 접수된 불법주정차 신고 내역을 통합하여 공개함으로써, 시민 참여 기반의 교통 질서 유지 실태를 투명하게 공개하고 효과적인 교통 안전 정책 수립을 지원하기 위해 수집되었습니다. 원주시가 2024년 1월부터 12월까지 접수된 신고 자료를 행정처리 후 비식별화 및 품질 검증을 거쳐 구축한 데이터입니다.본 데이터셋은 2024년 원주시에서 안전신문고를 통해 신고된 불법주정차 단속 현황의 전수 정보 및 처리 결과를 담고 있습니다. 주요 세부 항목은 다음과 같습니다.신고일, 신고시간: 불법주정차 신고가 접수된 정확한 일자와 시간 정보신고위치: 신고된 차량의 주정차 위치(읍/면/동 및 지번 주소 포함)과태료부과여부: 실제 단속 및 행정 처분(과태료 부과)이 이루어졌는지 여부이 데이터를 활용하여 시민들은 원주시 내 상습 불법주정차 발생 지역 및 시간대를 파악하여 교통 불편 해소 및 안전 사고 예방을 위한 기초 자료로 활용할 수 있습니다. 원주시는 데이터 분석을 통해 단속 및 계도 활동의 효율성을 높이고, 시민 신고가 집중되는 위치를 중심으로 주차 환경 개선 방안을 모색하는 등 객관적이고 데이터 기반의 의사결정을 지원할 것으로 기대됩니다.'
