summary_user: 국회 일정(본회의·위원회 회의, 행사 등)을 일정 건별로 담으며, 일정 종류·내용·일자·시각·회의 구분·위원회명·회기·차수·행사 주관기관·장소를 함께 제공하는 전국 단위 비공간 데이터다. 시민·기자·의정 분석가가 "이번 주 어느 위원회가 언제 몇 회기 몇 차 회의를 여는가"를 확인하거나 회의 일정을 미리 파악하는 데 쓴다. 전역 조인 키는 없어서, 의안·표결·회의록 데이터와는 위원회명(CMIT_NM)과 회기·차수, 일자를 이름·값으로 맞춰 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
