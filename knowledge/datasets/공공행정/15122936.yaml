summary_user: 경기통계시스템에 올라 있는 통계표의 목록과 메타데이터를 통계표 한 건당 한 행으로 담는다(관리 조직번호, 통계표ID, 표자료명, 소속 통계조사명, 공개구분, 최종변경일, 수집상세정보). 분석가나 시스템 담당자가 '경기도가 어떤 조사로 어떤 통계표를 내고 있고 언제 마지막으로 바뀌었나'를 확인하거나 통계표를 골라 실제 수치를 조회하기 전에 목록을 훑는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 통계표ID·표자료명 같은 이름이나 같은 기관 코드로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템에서 제공하는 통계표의 기본 정보와 메타데이터를 포함하는 자료로, 각 통계 항목의 구조적 특성과 관리 정보를 확인할 수 있습니다. ‘조직번호’는 통계표를 관리하는 주체 조직을 식별하며, ‘통계표ID’는 개별 통계표의 고유 식별자입니다. ‘표자료명’은 해당 통계표가 다루는 내용을 설명하며 ‘통계조사명’은 해당 통계가 소속된 조사 프로그램을 명시하며, ‘수집상세정보’는 데이터 수집 방식이나 관련 내용을 보완적으로 기재할 수 있는 항목입니다. 이 데이터는 통계자료의 출처 및 구조를 명확히 하여 통계 활용 시 정확한 맥락을 제공하고, 통계자료 조회 및 시스템 통합 연계를 위한 기준 정보로 활용될 수 있습니다.
