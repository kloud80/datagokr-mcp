description_portal: '본 데이터는 국립호남권생물자원관이 2026년 2월 10일 기준으로 작성한 임직원 교육과정 현황 자료입니다. 이 자료는 국립호남권생물자원관에서 진행하는 다양한 법정의무교육의 교육과정에 대한 핵심 정보를 담고 있으며, 임직원들의 교육 이수 현황을 체계적으로 관리하고 교육 계획을 수립하는 데 필수적인 역할을 합니다.데이터는 크게 기관코드, 기준연도, 교육유형명, 필수교육여부의 네 가지 주요 항목으로 구성되어 있습니다.기관코드: 국립호남권생물자원관을 고유하게 식별하는 값으로, 여러 기관의 데이터와 통합되거나 분류될 때 오류 없이 정확한 정보를 제공하는 데 활용됩니다.기준연도: 교육이 진행된 특정 연도를 나타내어, 연도별 교육 이수율이나 교육 과정의 변화 추이를 파악하는 데 중요한 기준이 됩니다.교육유형명: 교육의 종류를 구체적으로 명시하는 항목으로, 성희롱 예방 교육, 개인정보보호 교육, 산업안전보건 교육 등 법정의무교육의 세부 명칭을 포함합니다. 이를 통해 어떤 교육이 개설되었는지 명확하게 알 수 있습니다.필수교육여부: 해당 교육이 법적으로 의무화된 필수 교육인지 여부를 "Y"(Yes) 또는 "N"(No)으로 표시하여 임직원들이 반드시 이수해야 하는 교육을 쉽게 구분할 수 있도록 돕습니다.이러한 데이터는 각 임직원이 이수해야 할 교육을 놓치지 않고 확인할 수 있도록 지원하며, 기관 차원에서는 법적 의무를 준수하고 임직원의 역량 강화에 필요한 교육 인프라를 효율적으로 관리하는 데 기여합니다.'
