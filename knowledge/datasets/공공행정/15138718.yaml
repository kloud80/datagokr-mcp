summary_user: 지방자치단체별로 본청(mnof)·의회(asmb)·청사관리 대상 청사의 기준면적, 보유면적, 초과면적을 회계연도 단위로 담은 전국 집계 공시 데이터다. 분석가나 주민이 '우리 자치단체 청사가 기준면적보다 얼마나 넓게 지어졌나'를 다른 자치단체와 비교할 때 쓴다. 전역 조인 키는 없으며, 자치단체 코드(laf_cd)와 자치단체명, 연도(fyr)를 기준으로 같은 지방재정365의 다른 공시 데이터와 이름·코드를 맞춰 잇는다.
description_portal: 청사면적은 지방자치단체가 소유하고 있는 청사의 총 면적을 의미합니다.이는 청사의 건물 면적뿐만 아니라, 부속 건물이나 관련 시설을 포함한 전체 면적을 포함할 수 있습니다.청사면적은 자치단체가 행정 서비스를 제공하기 위한 공간의 크기를 나타내며, 행정 효율성과 조직 구조에 영향을 미칠 수 있습니다.또한, 청사 면적을 관리하고 최적화하는 것은 자치단체의 예산 운영과 시설 관리에 중요한 요소로 작용합니다.청사면적의 적정성은 지방자치단체의 업무 환경과 공공 서비스 제공에 중요한 영향을 미칩니다.
