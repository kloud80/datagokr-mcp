description_portal: 경기도 전역의 법정동코드와 행정동명을 체계적으로 정리한 종량제봉투 통합판매관리시스템의 기초 공간·주소 데이터입니다. 시도명·시군구명·행정동명과 함께 10자리 법정동코드가 매칭되어 있어, 인구·민원·시설물·종량제봉투 거래·배출량 데이터 등을 공통된 공간 단위로 연계하는 기준 코드로 활용할 수 있습니다. 특히 코드생성일자(변경이력) 정보가 포함되어 있어, 1988년부터 2019년까지 행정구역이 신설·조정된 시점을 추적하면서 과거 통계와 현재 행정구역 사이의 차이를 조정할 수 있다는 점이 중요합니다. 하남시의 경우 25개 코드(시 전체 1개 + 24개 동 코드)가 정리되어 있어, 종량제봉투 거래처 정보, 배출량 통계와 결합하면 하남시 행정동 단위의 세밀한 분석이 가능해집니다. 따라서 이 파일은 단순 코드 목록이 아니라, 종량제봉투 행정데이터를 포함한 각종 시정 데이터의 주소·공간 체계를 통일하는 기준 테이블 역할을 합니다.
