description_portal: '○ 통계개요* 통계명 : 인구추이(추계인구_증가율 등)* 통계종류 : 일반통계, 가공통계* 작성목적 : 서울시 인구추이 분석을 통해 연금 및 재정 정책 등 국가중장기 발전계획의효과적 수립을 유용하게 하고, 이를 활용한 다양한 주제별 추계의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 통계청* 공표주기 : 정기(5년, 인구주택총조사 실시 다음 연도에 작성)* 공표범위 : 지역 - 서울시내용 - 서울시 추계 남ㆍ녀 인구수 등○ 용어설명* 추계인구 : 인구주택총조사 결과를 기초로 인구변동요인(출생, 사망, 국제이동 등)을반영하여 매년 7월 1일 현재로 조성법을 이용하여 추계한 인구* 인구증가율은 전년대비 증가율임* 유년 부양비 : (0~14세 인구/15~64세 인구)*100* 노년 부양비 : (65세이상 인구/15~64세 인구)*100* 노령화 지수 : (65세이상 인구/0~14세 인구)*100'
