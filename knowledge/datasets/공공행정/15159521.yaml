description_portal: 대구광역시 달성군에서 운영한 주민 정보화교육 신청내역을 기반으로, 개인정보 보호를 위해 비식별·가명처리 절차를 거쳐 생성한 합성데이터입니다. 본 데이터는 실제 신청 패턴과 통계적 특성을 반영하면서도 개인을 식별할 수 없도록 안전하게 가공되었으며, 연령대, 성별, 거주 읍·면, 과목명, 과목유형, 교육일자, 누적수강횟수, 반복수강여부 등 총 10개 항목, 554건의 데이터(2024년~2026년 4월 기준)로 구성되어 있습니다.특히 디지털 취약계층의 교육 참여 특성, 반복수강 경향, 지역별·연령별 교육 수요 분석, AI 및 디지털 역량 강화 교육 수요 파악 등에 활용 가능하며, 향후 맞춤형 정보화교육 정책 수립과 데이터 기반 행정 추진을 위한 기초자료로 활용될 수 있습니다.
