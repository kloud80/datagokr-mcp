description_portal: 행정사의 구체적인 업무는 다음과 같습니다. 행정사의 경우 서류제출 및 대행할 수 있는 기관이 대한민국의 모든 행정기관으로 범위가 넓은 것이 특징입니다. 그 중 출입국민원의 경우 배타적인 권한을 행정안전부 및 법무부로부터 권한을 수권받아 직무를 수행할 수 있습니다.다.서울특별시 강북구 행정사 사무소 현황 데이터는 연번, 자치구명, 신고일자, 명칭, 행정사종류, 소재지로 구성된 자료입니다.해당자료는 강북구청 홈페이지(https://gangbuk.go.kr) 사전공고메뉴 자료로 올라간것을 연결하고 있습니다.
