summary_user: 서울시 관내에서 식품을 소포장·소분해 판매용으로 공급하는 업소를 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자, 사업장명·주소·좌표, 업태와 종사자 수를 포함한다. 식품소분업 창업을 검토하는 사업자나 분석가가 어느 자치구에 영업 중인 소분업소가 몰려 있고, 최근 폐업이 늘었는지를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 관리번호로 연결하며, 원천을 공유하는 LOCALDATA 인허가 자료 및 상권·행정동 데이터와 주소·좌표 기준으로 겹쳐 쓴다.
description_portal: 서울시 식품소분업 인허가 정보는 서울시 관내에서 식품을 소포장·소분하여 판매용으로 공급하는 업소의 인허가 현황과 기본 특성을 제공하는 공공데이터입니다. 인허가일자와 인허가취소일자, 영업상태, 폐업·휴업·재개업 일자 등의 정보를 통해 각 업소가 언제 허가를 받고, 현재 영업 중인지 또는 폐업·휴업 상태인지 등 행정 상태를 파악할 수 있습니다. 또한 사업장명, 전화번호, 지번 및 도로명 주소, 우편번호, 좌표정보를 포함하고 있어 식품소분업소의 위치를 정확히 확인하고 지역별 분포를 분석하는 데 활용할 수 있습니다. 업태구분명과 위생업태명, 영업장 주변구분명 등은 업종과 위생·입지 특성을 이해하는 데 도움을 주며, 남녀 종사자 수와 총인원 정보는 업소의 인력 규모를 가늠하는 데 유용합니다. 이 데이터는 서울시 내 식품소분업 구조와 분포를 파악하고, 식품위생 관리, 유통 단계의 안전성 점검, 관련 정책·연구의 기초 자료로 활용될 수 있습니다.
