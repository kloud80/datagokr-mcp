summary_user: 지방자치단체(광역·기초)별로 회계연도마다 일반회계 예산편성액과 그중 상급기관 재원을 받아 추진하는 보조사업예산액, 그리고 그 비율(보조사업비중)을 담은 전국 단위 집계 자료다. 지역 주민이나 재정 분석가가 "우리 시·군·구 예산 중 국비·도비 보조사업에 묶인 비중이 다른 자치단체보다 높은가, 해마다 어떻게 변했나"를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 지방재정365 계열 데이터와는 자치단체 코드(laf_cd)·자치단체명·회계연도로 맞춰 잇고, 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
description_portal: 지방자치단체(광역자치단체, 기초자치단체)별 보조사업비중은 주요 정책과 사업에서 보조사업예산이 차지하는 비율을 의미하며, 지방자치단체의 예산편성액(일반회계 기준) 중 보조사업예산(상급기관으로 재원을 보조 받아 추진하는 예산)을 자치단체별로 예산편성액 총액 대비 보조사업예산 비율을 분석한 자료입니다.보조사업비비중 정보는 2008 회계연도부터 정보가 제공되며, 대상 회계는 일반회계 대상입니다. 제공되는 세부항목은 자치단체별 보조사업예산액, 일반회계예산액 항목입니다.
