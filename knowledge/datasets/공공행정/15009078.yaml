summary_user: 서울특별시 양천구 관내 무인민원발급기 한 대마다 설치장소·설치위치·운영시간·발급 가능한 민원 종류·도로명/지번 주소·관리기관·전화번호·위도·경도를 담은 개별 시설 목록 파일(csv, 약 8KB)이다. 양천구 주민이 "집 근처 무인민원발급기가 어디 있고 몇 시까지 운영하며 어떤 증명서를 뗄 수 있나"를 확인하거나, 분석가가 발급기 배치·관리 현황을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 관리기관명으로 연결해 쓰며, 다른 자치구의 무인민원발급기 표준데이터와는 같은 항목 기준으로 이어 붙인다.
description_portal: 본 데이터는 서울특별시 양천구 관내 무인민원 발급기의 설치 현황과 제공 서비스 정보를 체계적으로 정리한 자료이다. 각 무인민원 발급기의 설치장소,설치위치,운영시간,발급민원종류,소재지도로명주소,소재지지번주소,관리기관명,전화번호,위도,경도 등의 정보를 제공하여 주민이 신속하고 편리하게 민원 서비스를 이용할 수 있도록 구성하였다. 해당 자료는 민원 발급 서비스 개선, 무인 단말기 관리 및 유지보수 계획 수립, 행정업무 효율화 등 다양한 목적으로 활용될 수 있으며, 주민 편의 증진과 공공 서비스 제공의 기초 자료로 활용된다. 본 데이터는 주민 중심 행정 서비스를 지원하는 중요한 공공 정보이다.
