description_portal: 경상북도 구미시 수의계약현황 데이터는 공사, 용역, 물품, 기타 등 다양한 유형의 수의계약에 대한 정보를 제공합니다. 주요 항목으로는 계약구분, 계약명, 예정금액(원), 최초계약금액(원), 낙찰율(%), 계약금액(원), 계약일자, 계약기간 시작일과 종료일, 준공일자, 경쟁방법 및 그 상세내용, 계약유형, 사업장 위치, 수의계약 사유 등이 포함되어 있으며, 도급업체 대표자, 도급업체 주소, 면허종류 등의 업체 정보도 함께 제공됩니다. 또한, 계약 집행 과정에서의 자금 흐름을 파악할 수 있도록 선금지급누계액, 기성금지급누계액, 준공금지급액, 노무비지급누계액 등의 지급 내역이 제공되며, 계약관서, 계약부서, 감독부서 등의 행정 관리 정보도 포함되어 있어 계약의 전반적인 이력과 절차를 종합적으로 파악할 수 있습니다. 이 데이터는 구미시의 수의계약 집행의 투명성 확보와 예산 관리, 사업 추진의 합리성 검토 등에 활용될 수 있는 유용한 행정 자료입니다.
