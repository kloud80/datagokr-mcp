description_portal: '세종특별자치시시설관리공단은 자연장지(잔디장·수목장 등)의 안치 위치를 시민이 확인할 수 있도록 자연장 위치 배치 정보를 공공데이터로 제공하고 있습니다.이 데이터는 자연장지 내 열(列)·행(行) 단위의 상세한 배치 정보부터 계약 기간, 연장 이력까지 포함하여 자연장지 운영의 투명성과 편리성을 강화하는 데 활용됩니다.■ 데이터 컬럼 구성자연장구분 - 자연장의 유형 구분   예: 잔디장, 수목장 도심형, 수목장 산림형 등자연장구역구분 - 자연장지 내 구역을 식별하는 코드 또는 구역 구분 값자연장안치구분 - 해당 위치에 적용된 안치 형태(개인형, 부부형 등)열번호 - 자연장지 내 세로 방향(열·Column)에 해당하는 번호행번호 - 자연장지 내 가로 방향(행·Row)에 해당하는 번호자연장계약일자 - 해당 위치에 대한 자연장 이용 계약이 체결된 날짜총사용기간_시작일 - 해당 위치의 사용 기간 시작일총사용기간_종료일 - 해당 위치의 사용 기간 종료일총연장횟수 - 계약이 연장된 총 횟수자연장 이용 기간의 변동과 연장 이력을 파악하는 데 활용■ 데이터 제공 목적자연장 위치 배치 데이터는 다음과 같은 목적을 위해 제공됩니다. - 자연장지 내 위치(열·행) 정보 제공을 통한 시민 편의 증진 - 안치 위치별 계약 기간 및 연장 이력의 투명한 공개 - 구역·블록·좌표 단위의 세부 관리로 시설 운영 효율성 강화 - 자연장지 이용 현황 분석 및 장사행정 정책 수립 지원시민이 자연장 위치를 정확히 확인할 수 있는 정보 접근성 향상'
