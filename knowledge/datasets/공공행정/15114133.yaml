summary_user: 고양시 관내 임시주거시설을 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·도로명주소·상세 시설명·면적·수용인원·담당기관 연락처·내진설계 여부를 시군구 범위에서 개별 주소 단위로 기록한다. 재난으로 집을 잃거나 대피해야 할 때 우리 동네 가까운 임시주거시설이 어디이고 몇 명을 받을 수 있는지, 내진설계가 되어 있는지를 확인하려는 주민·구호기관·방재 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명주소를 주소 매칭(지오코딩)하거나 시설명·시군명으로 맞춰 이어 쓴다.
limits: 표준 코드나 전역 식별자가 없어 다른 시설·재난 데이터와 자동 조인이 되지 않고 주소·이름 매핑이 필요하다. 범위는 고양시 한 곳뿐이어서 다른 시군과 비교하려면 별도 데이터를 모아야 하며, 좌표는 실측 컬럼에 없어 주소로 위치를 구해야 한다.
