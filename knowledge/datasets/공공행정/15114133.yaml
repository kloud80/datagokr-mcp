description_portal: 「재난 및 안전관리 기본법」 제3조제1호에 따른 재난으로 인한 피해를 입은 사람으로서 주거시설의 손실 정도 등 대통령령으로 정하는 기준에 해당되는 재해를 입은 사람 또는 재해가 예상되어 일시 대피한 사람을 대상으로 제공할 수 있는 재해구호법 제4조에 따른 임시주거시설 현황입니다. 이 데이터는 고양시 관내 152개소 임시주거시설 시설명과 주소, 담당자 연락처, 수용 인원, 내진 설계 유무 등의 정보를 담고 있습니다. 재해로 주거시설을 상실하거나 주거가 사실상 불가능한 상황에 처한 이재민등의 구호를 위하여  재해구호법 제4조의2(임시주거시설의 사용 등) 에 따른 임시주거시설을 관리·운영중이며, 재난 시 구호기관에서 활용할 수 있습니다.
