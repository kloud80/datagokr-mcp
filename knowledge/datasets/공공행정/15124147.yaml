description_portal: '전라남도 함평군은 계약 행정의 투명성과 책임성을 강화하기 위해 계약정보 공개시스템 설계변경 데이터를 공공데이터로 제공하고 있습니다. 설계변경 데이터에는 발주사업 수행 과정에서 발생하는 계약 변경 내역을 확인할 수 있도록 계약명, 변경일시, 외차, 증감액, 변경사유, 변경금액, 변경율 등의 컬럼 정보 등을 데이터로 제공하고 있습니다. 함평군의 발주사업 진행과정의 투명한 공개, 사업 품질 향상, 예산 낭비 방지, 지역 건설업체의 공정한 참여 보장 등을 위해 개방되는 데이터 입니다.제공사이트 : 계약정보공개시스템 https://gyeyak.hampyeong.go.kr/'
