summary_user: 전국 지방자치단체의 순자산변동표를 회계연도·자치단체·과목별 금액으로 담은 재무제표 집계 데이터이며, 비공간 데이터로 전국을 범위로 한다. 분석가나 주민이 '우리 시·군·구의 순자산이 지난해보다 얼마나, 어떤 항목에서 늘거나 줄었나'를 확인하고 자치단체끼리 비교하는 데 쓴다. 전역 조인 키는 없어서 같은 지방재정365 계열 데이터와는 자치단체 코드(laf_cd)·과목 코드나 자치단체명 매핑으로만 잇는다.
description_portal: 순자산변동표는 일정 기간 동안 기업이나 조직의 순자산 변화 내역을 보여주는 재무제표 중 하나입니다. 이 표는 자산, 부채, 자본의 변동 사항을 종합적으로 나타내며, 해당 기간 동안 자산의 증가 또는 감소, 부채의 변화, 자본의 증감 등을 상세히 기록합니다.순자산변동표를 통해 사용자는 기업의 재정 상태와 경영 성과를 보다 명확히 파악할 수 있으며, 나아가 기업의 재무 건전성과 자본 구조 변화를 이해하는 데 유용한 자료가 됩니다.이 표는 특히 기업의 재무 정보를 투명하게 공개하고, 외부 이해관계자들에게 신뢰성 있는 정보를 제공하는 데 중요한 역할을 합니다.
