summary_user: 한국자산관리공사가 위탁 관리하며 온비드에 공개하는 전국 국유일반재산을 물건 한 건씩 담고, 소재지 주소, 지목, 토지·건물 면적, 용도 분류, 관리상태, 물건관리기관을 제공한다. 국민이나 사업자가 "우리 시도에서 매각이나 대부 입찰을 검토 중인 국유지가 어디에 있고 면적은 얼마인가"를 찾을 때 쓴다. 명세에는 지번·도로명 PNU 필드가 있어 토지대장·공시지가 같은 필지 데이터와 PNU로 잇는 것이 설계 의도지만, 실측에서는 전역 조인 키가 확인되지 않아 현재는 주소·이름 매핑으로 연결해야 한다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지를 통해 정보 공개중인 정부재산 목록 중 한국자산관리공사가 위탁받아 관리중인 국유일반재산 정보를 조회하는 서비스입니다. 한국자산관리공사에서는 국유일반재산에 대한 상세정보를 국민에게 공개함으로써 국유지 정보접근성을 높여 활용도를 극대화하기위해 정보공개를 하고 있습니다. 국유재산의 물건명, 토지면적, 건물면적, 위치 및 부근현황, 물건관리기관, 관리상태 등의 상세 정보를 조회할 수 있습니다.필수 입력 조건 : 소재지시도명(sdnm)'
