description_portal: 혁신도시 조성 및 발전에 관한 특별법 개정에 따라, 대전 소재 17개 공공기관은 지역인재를 의무적으로 채용해야 합니다. 이 제도는 2020년 6월부터 시행되었으며, 지역 인재의 취업 기회를 확대하고 지역 경제 활성화를 도모하기 위한 목적을 가지고 있습니다. 본 자료는 2022년을 기준으로 각 공공기관별 지역인재 의무채용 현황을 상세히 정리하여, 관련 정책의 추진 현황과 성과를 파악할 수 있도록 구성되어 있습니다. 이를 통해 대전 지역 인재 육성과 공공기관의 사회적 책임 이행을 지원하는 데 중요한 역할을 하고 있습니다.
