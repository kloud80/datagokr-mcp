summary_user: 부안군 내 쓰레기 종량제봉투 지정판매소를 한 곳씩 담은 목록으로, 판매소 코드·사업장 이름·대표자·전화번호·주소를 담는다(csv 약 11KB). 부안군 주민이 집 근처에서 종량제봉투를 파는 가게와 연락처를 찾거나, 군이 읍·면별 판매소 분포를 점검할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장 주소나 이름을 맞춰 연결해야 하고, 지정판매소코드는 같은 기관 자료 안에서만 연결 고리로 쓴다.
description_portal: 전북특별자치도 부안군은 생활폐기물의 효율적 관리와 자원절약을 위하여 종량제봉투 판매정보를 전산으로 관리하고 있다. 본 데이터는 부안군 내 지정판매소별 종량제봉투 판매 현황을 제공하며, 지정판매소코드, 사업장이름, 전화번호 항목으로 구성되어 있다. 이를 통해 주민은 가까운 판매소를 신속히 확인할 수 있고, 행정기관은 판매소 운영현황을 분석하여 봉투 공급 및 유통체계를 효율적으로 관리할 수 있다. 또한 지역 내 폐기물 감량정책 및 환경관리 정책수립의 기초자료로 활용이 가능하다.
