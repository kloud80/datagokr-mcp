description_portal: 아시아법률정보네트워크(ALIN)는 법률정보와 경험, 전문지식을 공유해 지역의 법률문화와 입법환경을 강화하기 위해 아시아 지역 로스쿨, 법률연구소, 정부기관으로 구성된 네트워크입니다.ALIN은 아시아 국가 간 법률 정보 교환을 위한 협업 플랫폼을 제공하고 아시아에서 더 나은 법률을 육성할 수 있는 제도적 역량을 구축하기 위해 2005년에 출범했습니다.한국법제연구원은 2005년 설립 이후 ALIN 사무국을 맡아 다양한 ALIN 활동을 조직하고 ALIN에 대한 행정 지원을 하고 있습니다.본 데이터 ALIN 파트너 기관에서 제공하고 있는 법령정보이며, 아시아법령정보네트웤 기관 뉴스, 뉴스의 원문 주소, 파트너기관명, 파트너기관 국가명, 등록일 등을 포함하고 있습니다.
