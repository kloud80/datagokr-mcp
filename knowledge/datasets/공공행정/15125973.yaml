summary_user: 국회입법조사처가 펴낸 연구보고서 가운데 '외국입법 동향과 분석' 간행물을 보고서 한 건 단위로 담으며, 도서명(BOOKNM)·PDF 파일명과 내려받기 주소·바로보기 및 뷰어 주소·구분 코드·등록일 같은 목록 정보를 제공한다. 입법 실무자나 연구자가 '특정 주제에 대해 외국은 어떻게 입법했는지 분석한 국회 보고서가 있는가'를 찾아 원문 PDF를 바로 열어 볼 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 보고서 제목이나 주제어를 기준으로 다른 국회 의안·법령 데이터와 직접 맞춰 이어 써야 한다.
