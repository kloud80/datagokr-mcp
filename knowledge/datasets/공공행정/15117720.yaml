description_portal: 광주광역시도시공사에서 제정 및 개정한 사규의 변동 내역을 정리한 데이터입니다. 본 데이터는 분류명, 사규명, 최초제정일자, 최종개정일자, 데이터기준일자 항목으로 구성되어 있습니다. 분류명과 사규명 항목을 통해 각 규정의 성격과 명칭을 확인할 수 있으며, 최초 제정일자와 최종 개정일자는 규정의 수립 시점과 최신 개정일을 나타냅니다. 이를 통해 특정 규정이 신설되었는지 또는 개정되었는지를 파악할 수 있으며, 규정 관리의 이력 추적 및 정비 주기 분석이 가능합니다. 데이터기준일자는 해당 정보가 기준이 되는 날짜를 나타내며, 법적 효력이나 적용 시점과의 일치 여부 확인에도 활용됩니다. 본 데이터는 사규 관리의 체계화를 지원하고, 사규 제·개정 현황에 대한 투명한 공개를 통해 조직 운영의 신뢰성과 공정성을 확보하는 데 목적이 있습니다.
