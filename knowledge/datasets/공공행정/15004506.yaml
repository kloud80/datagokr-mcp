summary_user: 전라남도 해남군 14개 읍면의 마을회관을 한 곳씩 담은 목록으로, 읍면동·마을회관명·도로명주소·지번주소를 건별로 담는다(포털 설명 기준 527개소). 주민이나 지역 분석가가 "우리 면에는 마을회관이 어디에 몇 곳 있나", "경로당·대피소 후보로 쓸 마을 공용시설은 어디인가"를 확인하는 데 쓴다. 전역 조인 키나 코드는 없어서, 다른 데이터와는 읍면동 이름이나 주소 문자열을 맞춰 잇거나 주소를 좌표로 바꿔 지도에 겹쳐 쓴다.
limits: 행정코드·시설 고유번호 같은 공통 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 기대야 한다. 범위는 해남군 한 곳뿐이라 다른 시군과 비교하려면 각 지자체 자료를 따로 모아야 한다.
