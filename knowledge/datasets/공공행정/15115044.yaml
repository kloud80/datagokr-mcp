summary_user: 서울 강남구에서 인공 치아를 만들거나 고치는 치과기공소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소·휴업·폐업 일자와 영업상태, 도로명·지번 주소, 좌표, 사업장명, 기공용 장비 보유 수량을 포함한다. 치과기공소를 열려는 사업자나 상권 분석가가 '강남구에서 지금 영업 중인 치과기공소는 몇 곳이고 어느 동네에 몰려 있으며 최근 몇 년간 폐업이 얼마나 있었나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 같은 원천을 공유하는 LOCALDATA 인허가 자료와 함께 점포 이력 원장으로 쓴다.
description_portal: 서울시 강남구 치과기공소 인허가 정보(https://data.seoul.go.kr/dataList/OA-16476/S/1/datasetView.do)서울특별시 강남구 내의 인공 치아를 제작하거나 보수하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다.데이터 활용시 참고하시기 바랍니다.
