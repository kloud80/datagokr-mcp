description_portal: 광주광역시 동구 관내 무인민원발급기 설치 장소 및 운영 시간 등을 제공하고자 합니다.이를 통해 주민들이 구청 및 행정복지센터를 방문하지 않아도 근처에서 민원 서류를 발급할 수 있도록 편의를 제공하고자 합니다.본 자료는 광주광역시 동구 관내 무인민원발급기의 설치 위치, 도로명주소, 지번주소, 운영시간, 발급가능서류 등을 포함하고 있으며,평일과 휴일을 구분하여 운영 시간을 안내하고, 위치도 층수 등을 포함한 세부적인 사항을 안내함으로써민원인의 혼선을 최소화 하고자 하였습니다.또한, 무인민원발급기 이용 시 용지 걸림 등 불편 사항이 발생하면 안내 된 전화번호를 통해 문제를 해결 할 수 있습니다.해당 무인민원발급기에서 등기서류와 가족관계서류 발급할 수 있는지도 안내하여 민원인의 편의를 도모하였습니다. 본 데이터를 통해 민원인들이 쉽게 무인민원발급기를 찾을 수 있어 효율적인 행정 서비스 제공과 민원 분산에 따라 민원 과부하를 방지할 수 있을것으로 판단되며,민원발급기 추가 배치 자료로도 활용 할 수 있을 것입니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다. 본 데이터를 통해 도로명 주소가 익숙하지 않은 주민(어르신)들 또한 지번 주소를 통해 설치 위치를 알 수 있습니다. 본 데이터는 광주광역시 동구에서 본인과 가장 가까운 무인민원발급기를 빠르게 찾을 수 있도록 도와줍니다.
