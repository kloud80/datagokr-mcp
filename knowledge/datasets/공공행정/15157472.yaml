description_portal: 여수시 다가구 및 오피스텔 현황은 여수시 관내 건축물대장에 등록된 건축물 중 다가구주택 및 오피스텔에 해당하는 건축물의 현황을 연도별 기준으로 정리한 통계 자료입니다.본 자료는 해당 건축물의 소재지, 지번 등 기본적인 위치 정보와 함께 건축물별 세부 현황을 포함하고 있으며, 주요 항목으로는 건물명, 가구수(호수), 주용도, 부속용도, 기타 건축물대장상 등재 사항 등이 포함되어 있습니다. 이를 통해 여수시 내 다가구주택 및 오피스텔의 전반적인 분포 현황과 규모 등을 파악할 수 있습니다.자료는 각 연도별 기준 시점에 따라 작성된 것으로, 건축물의 신축·증축·용도변경·말소 등 변동 사항이 발생할 경우 현황 내용은 달라질 수 있습니다. 따라서 활용 시에는 반드시 기준 연도 및 작성 시점을 확인하여 주시기 바랍니다.또한, 파일 내에 사용된 항목별 코드, 용어 정의 및 작성 기준 등에 대한 상세한 설명은 「건축물대장 관련 업무지침」 및 자료 이용 안내서를 참고하시기 바라며, 보다 정확한 해석과 활용을 위해 관련 지침을 함께 확인하여 주시기 바랍니다.파일 내 항목별 코드 및 용어 설명은 「건축물대장 관련 업무지침」 또는 자료 이용 안내서를 참고하여 주시기 바랍니다.
