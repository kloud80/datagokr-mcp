summary_user: 보령시의회 소속 의원을 한 사람당 한 행으로 담은 명단 파일로, 대수·성명·소속정당·선거구·직위·전화번호와 데이터기준일자를 담는다(csv 약 7.5KB). 보령시민이 자기 선거구 시의원이 누구이고 어느 정당 소속인지, 연락처가 무엇인지 확인하거나 언론·시민단체가 의정활동 모니터링 대상 명단을 만드는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 의원 성명이나 선거구 이름을 맞춰 붙이거나 같은 기관(보령시) 자료끼리만 연결한다.
description_portal: 지방자치의 중요성 증대와 주민참여 확대에 따라 시민들의 지역 의정활동에 대한 관심과 정보 공개 요구가 높아지고 있습니다. 이에 보령시의회는 시민의 알권리 보장과 열린 의정 구현을 위해 소속 의원들의 인적사항, 의정활동 현황, 연락처 등의 정보를 제공하고 있습니다. 본 데이터를 통해 자신의 지역구 의원을 확인하고 민원 및 건의사항을 직접 전달할 수 있으며, 언론 및 시민단체는 의정활동 모니터링과 투명성 제고에 활용할 수 있습니다. 또한 학계·연구기관은 지방의회 운영 실태 분석, 의정활동 평가 지표 개발 등 지방자치 연구에 활용하고, 시민참여 플랫폼 운영자는 의원과 시민 간 소통 창구 마련 및 주민참여 민주주의 활성화에 기여할 수 있습니다.보령시의원의 지역구 확인 및 건의사항 전달에  대한 자세한 정보를 원하시는 경우 보령시의회 누리집(http://www.brcouncil.go.kr/kr/member/name.do)을 참고해주시기 바랍니다.
