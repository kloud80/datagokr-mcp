summary_user: 전국 지방자치단체의 세출을 일반공공행정·교육·문화 및 관광·환경·사회복지·보건 등 분야별로 나눠 회계연도·자치단체·회계구분(일반회계·기타특별회계·기금)별 예산현액과 지출액 등 금액으로 담은 집계 자료로, 포털 설명상 2016회계연도부터 제공된다. 주민이나 분석가가 "우리 구는 사회복지와 환경 분야에 예산을 얼마나 배정했고 실제로 얼마를 썼나"를 확인하거나 자치단체끼리 분야별 지출 구성을 비교하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 같은 지방재정365 계열 데이터와는 자치단체 코드(laf_cd)·회계연도·분야 코드를 맞춰 잇고, 다른 기관 데이터와는 자치단체 이름을 매핑해 연결한다.
description_portal: '지방자치단체의 분야별 세출 현황은 각 지방자치단체가 예산을 어떻게 활용하고 있는지를 보여주는 지표로 세출현황은 공공 서비스 제공을 위한 지출을 다양한 분야로 분류하여 관리되고 있습니다. 이러한 세출 현황은 자치단체의 재정 운영의 효율성을 평가하고, 각 분야에서의 재정 지원이 어떻게 이루어지는를 분석한 자료입니다.(분야별 분류 : 일반공공행정, 교육, 문화 및 관광, 환경, 사회복지, 보건등)분야별 세출현황 정보는 2016회계연도부터 제공되며 대상회계는 일반회계, 기타특별회계, 기금입니다.'
