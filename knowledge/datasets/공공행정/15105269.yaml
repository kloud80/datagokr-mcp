description_portal: 본 공공데이터는 인천광역시 서구청의 조직적,행정적 변천 과정을 연대별로 정리한 자료입니다. 인천광역시 서구청은 지방자치제 실시에 따라 서곶출장소 설치(1945년)를 시작으로, 직할시 승격, 북구에서 분구되어 서구로 독립, 자치구 승격 등 주요 행정 단위 변화 시점을 연도별로 기록되어 있습니다. 이를 통해 인천광역시 서구 행정구역의 형성과정, 행정체계 개편의 흐름을 파악할 수 있습니다. 또한 지역 행정의 역사적 배경 이해 자료로 활용할 수 있습니다. 본 공공데이터는 정기적인 갱신이 없는 수시성 데이터입니다.
