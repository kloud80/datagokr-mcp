description_portal: 충청남도 재난안전포털에서 제공하는 재난예방정보 동영상 목록 데이터는 도민의 재난 대응 역량 강화를 위해 제작·공개된 교육영상의 기본 정보를 체계적으로 정리한 자료입니다. 본 데이터에는 동영상 일련번호를 포함해 각 영상 콘텐츠를 고유하게 식별할 수 있는 식별값이 제공되며, 비디오 영문명과 한글명이 함께 수록되어 있어 영상 제목 및 내용을 다국어 기반으로 명확하게 이해할 수 있습니다. 또한 비디오 썸네일 이미지 영문명 정보가 포함되어 있어 포털 시스템 내에서 영상 미리보기, 검색결과 시각적 표시, 콘텐츠 분류 등에 유용하게 활용됩니다.이 데이터는 재난 상황별 행동요령, 생활 속 안전수칙, 자연재난·사회재난 예방 방법 등 다양한 교육 영상 콘텐츠를 포털 이용자가 쉽게 찾고 활용할 수 있도록 지원합니다. 더불어 지자체·교육기관·안전관리 기관은 이 자료를 활용하여 재난예방 교육, 홍보캠페인, 훈련 교재 제작 등에 활용할 수 있어 공공 안전역량 강화에 기여하는 중요한 기반정보입니다.
