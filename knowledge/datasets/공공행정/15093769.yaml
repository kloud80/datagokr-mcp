description_portal: 경상남도 진주시 관내 내국인을 대상으로 법정동 및 행정리(마을) 단위로 구분된 세대수와 인구수를 제공하는 자료입니다. 본 데이터는 지역 내 세대 및 인구 분포를 파악하고, 행정계획이나 정책 수립의 기초자료로 활용됩니다. 기준일자별로 구성되어 시기별 인구 변화를 비교 분석할 수 있으며, 읍면동 및 마을 단위의 인구 변화 추이, 세대 구성, 인구 밀집도 분석 등에 활용됩니다. 또한 지역 간 인구 격차, 고령화, 정주 여건 등 사회적 이슈 진단과 맞춤형 정책 수립에도 기여할 수 있으며, 공공 및 민간 분야에서 다양하게 활용 가능합니다.
