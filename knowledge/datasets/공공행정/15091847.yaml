summary_user: 농식품공공데이터포털에 개방된 농촌복지 데이터셋의 메타데이터 목록으로, 데이터셋·데이터 한 건마다 이름, 설명, 발행기관, 담당자 연락처, 키워드, 등록일, 이용허락 범위, 업데이트 주기, 제공 형태(파일·오픈API·지도 등)를 담으며 범위는 전국·비공간이다. 연구자나 정책 담당자가 "농촌복지 관련해 어떤 공공데이터가 어떤 형태와 이용조건으로 열려 있는가"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 데이터셋명·기관명 같은 이름 매핑이나 포털 URL(공공데이터포털URL)로만 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방한 농촌복지 데이터 목록은 우리 사회의 농촌과 관련된 다양한 복지 현황을 이해하고 활용하는 데 도움을 주기 위한 것입니다. 이 데이터 목록에는 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의 사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자 권리 포함 유무, 상위 분류, 제3자 권리, 이용 허락 범위, 업데이트 주기, 서비스 유형 등의 다양한 정보가 포함되어 있습니다. 이를 통하여 연구자, 정책 입안자, 기업 및 일반 시민들이 농촌복지와 관련된 정책 개발 및 연구, 서비스 기획 등을 효과적으로 수행할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형) : 각 데이터셋을 유일하게 식별하는 아이디, 데이터셋명(문자형) : 각 데이터셋의 이름, 데이터셋설명(문자형) : 데이터셋의 목적이나 내용을 설명하는 항목, 기관명(문자형) : 데이터를 발행한 기관의 이름, 담당자명(문자형) : 데이터 관리 담당자의 이름, 전화번호(숫자형) : 담당자의 연락처, 키워드(문자형) : 데이터와 관련된 주제를 나타내는 단어들, 등록일(숫자형) : 각 데이터셋의 등록 날짜, 데이터ID(문자형) : 내부적으로 데이터셋을 식별하는 용도로 사용, 데이터명(문자형) : 데이터셋의 제목, 데이터설명(문자형) : 데이터에 대한 자세한 설명을 제공하는 부분, 제3자권리 포함유무(문자형) : 데이터의 이용에 대한 제3자 권리의 여부, 상위분류(문자형) : 데이터가 속하는 큰 분류, 이용 허락 범위(문자형) : 데이터 활용에 대한 조건을 명시하는 항목, 업데이트 주기(문자형) : 데이터의 업데이트 주기를 나타냅니다.'
