summary_user: 제주특별자치도의 행정구역 현황을 연도별로 정리한 집계 통계 파일로, 연도·시도·시군구·지역구분·면적·비율 항목을 담고 읍면동 단위까지 다룬다. 지역 분석가나 행정 담당자가 제주 행정구역 구성이 언제 어떻게 바뀌었는지, 시·군·지역별 면적 비중이 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구·읍면동 이름을 직접 맞추는 방식으로만 이어 쓸 수 있다.
description_portal: '제주특별자치도 내 행정구역현황 데이터를 제공합니다.항목: 연도, 시도, 시군구, 지역구분, 면적, 비율* 제주특별자치도의 행정구역 구성 변화 및 시·도별 행정구역의 구분을 연도별로 정리한 행정구역 현황 통계자료이다. 항목으로는 연도, 시도(제주도 전체 혹은 세부 시·군·구), 구분(예: 읍·면·동), 행정구역 단위 등이 포함되어 있으며, 행정구역의 수 및 구조 변화가 기록되어 있다. 본 자료는 제주 지역의 지방자치체계 변화, 행정 단위 조정, 주민 행정 서비스 제공 기반 등을 분석할 수 있게 해주는 기초자료로 활용될 수 있다.* 활용 분야 : 지방자치단체 및 행정구역 개편 시점 분석, 읍·면·동 기준 주민 서비스 접근성 평가 등출처: KOSIS 국가통계포털'
