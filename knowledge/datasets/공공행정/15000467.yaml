summary_user: 대전광역시가 안내하는 공연·행사를 건별로 담으며, 행사 제목·내용, 시작·종료 일시, 장소, 주제·대상·주관 구분, 추천 여부와 조회수 같은 항목이 있다. 시민이나 관광객이 '이번 주말 대전에서 아이와 볼 만한 공연이 있는지'를 확인하거나, 분석가가 주제·장소별 행사 분포를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 장소명·행사명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 공연·관광 데이터와 바로 결합하지 못하고, 이름을 맞춰 연결해야 한다. 범위는 대전 한 시도의 비공간 데이터라 좌표 기반 분석이나 타 지역 비교에는 맞지 않는다. 호출하려면 포털 활용신청 후 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
