summary_user: 지방자치단체별로 지방교부세가 감액된 내역을 연도(fyr)·자치단체 단위로 담으며, 감액총금액·감액금액·감액사유·위반지출내역을 제공하고 범위는 전국입니다. 시민·지방의회·재정 분석가가 "우리 지자체가 어떤 법령 위반이나 부적정 집행으로 교부세를 얼마나 깎였나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방재정365 공시 데이터와는 자치단체명이나 같은 기관의 자치단체코드(laf_cd)로만 맞춰 잇는다.
description_portal: 지방자치단체의 지방교부세는 자치단체의 재정력 격차를 해소하기 위해 국가가 지원하는 재원으로 법령위반이나 예산집행의 부적정 등의 사유로 감액될 수 있습니다. 감액사유에는 공유재산 부적정 매각, 수입징수태만 등이 포함되며, 감액규모는 수억원에서 수십억원에 이를 수 있습니다. 이러한 감액 내역은 지방교부세법 제11조에 따라 공개됩니다.지방교부세감액현황 정보는 2012년 이후 정보가 제공되고 있으며 세부 제공항목으로는 자치단체별 감액총금액, 감액금액, 감액사유, 위반지출내역이 제공됩니다.
