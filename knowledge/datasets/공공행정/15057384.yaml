summary_user: 지방자치단체별·회계연도별 행사축제경비 결산액과 일반회계 세출결산액, 그리고 그 비율을 담은 집계 데이터로, 포털 설명상 2009 회계연도부터 전국 자치단체 일반회계를 대상으로 한다. 주민이나 분석가가 "우리 시·군·구는 세출 중 행사·축제에 얼마나 쓰고 있고 다른 자치단체와 비교하면 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키는 없고, 광역·기초 자치단체 코드와 이름(laf_cd 등) 및 회계연도로 같은 지방재정365의 다른 공시 지표와 맞춰 쓴다.
description_portal: 지방자치단체의 행사축제경비비율 정보는 지방재정법 제60조 및 지방재정법시행령 제68조에 근거하여 재정운영의 투명성과 책임성확보를 목적으로 공개됩니다. 지방자치단체는 연간 행사축제경비 중 인건비, 홍보비, 위탁비, 직접운영비 등 주요 항목별 지출비율을 공개하고 있습니다.행사축제경비비율 정보는 2009 회계연도부터 정보가 제공되고 있으며 자치단체 일반회계를 대상으로 정보가 취합됩니다. 제공되는 세부항목으로는 행사축제경비 결산액과 세출결산액(일반회계)을 비율로 나눈 행사축제경비비율 정보가 제공되고 있습니다.
