summary_user: 행정동 안의 통·반 단위로 통계년월별 총·남·여 출생등록자 수를 집계해 담는 주민등록 API이며, 범위는 전국 읍면동 단위이다. 지역 출생 규모를 동네 단위로 보려는 분석가나 창업·서비스 기획자가 "우리 동네 통·반별로 출생등록이 얼마나 되나" 같은 질문에 쓴다. 이어 쓸 전역 조인 키는 없고, 행정기관코드(admmCd)나 시도·시군구·행정동 이름 매핑으로, 또는 같은 기관의 다른 주민등록 통계와 코드로 연결한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑 작업이 필요하다. 검증 때 API 전체 건수는 10건, 수신은 10행이었으므로 전국 전체 자료를 한 번에 받는다고 가정하지 말고 호출 범위를 확인해야 한다. 개발계정은 일 10,000회 호출로 제한된다.
