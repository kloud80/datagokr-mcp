description_portal: '중장기개방계획에 따른 강원특별자치도 강릉시 의회의 회기(회의 기간) 일정 및 관리 정보 데이터입니다.강원특별자치도 강릉시 의회의 대수별(기수별) 회기 일정 및 현황 통합 데이터입니다.본 데이터는 대수, 시작회기, 종료회기, 설명, 회기, 타입코드, 타입구분, 회차내용, 시작일, 종료일 항목으로 구성되며, 각 항목의 설명은 다음과 같습니다.대수: 의회의 기수 (예: 11, 12)시작회기 / 종료회기: 해당 대수에서 진행된 첫 번째와 마지막 회기 번호설명: 해당 대수의 임기 기간 및 회기 범위 요약 (예: 제12대 의회 2022.07.01~...)회기: 개별 회의의 고유 차수타입코드 / 타입구분: 회의 유형 코드(T/P)와 명칭(임시회/정례회)회차내용: 회의의 정식 명칭 (예: 제315회 제1차정례회)시작일 / 종료일: 해당 회기의 시작 및 종료 날짜 (YYYY-MM-DD)이 자료는 의회의 대수별 임기 정보와 그 안에서 진행된 개별 회기의 상세 일정(시작일~종료일)을 통합적으로 조회하고 이력을 관리하는 데 활용됩니다.'
