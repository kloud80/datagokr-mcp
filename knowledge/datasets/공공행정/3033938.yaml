summary_user: 대한민국 법령을 조문 단위로 중문 번역한 본문을 담으며, 법령명·조문번호·조문명·번역문으로 구성되고 범위는 전국(비공간)이다. 중국어권 사업자나 번역·법률 서비스 담당자가 "이 한국 법령의 특정 조문을 중문으로 어떻게 표현하는가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 한국어 원문이나 영문 법령과는 법령명·조문번호를 이름으로 맞춰 이어 써야 한다.
description_portal: 법제처_법령(중문)정보 데이터는 대한민국 법령의 중문 번역문을 포함하여 제공하는 자료입니다. 이 데이터는 각 법령 조문별로 중문으로 번역된 본문을 포함하며, 법률 전문 용어와 문장 구조를 반영하여 정확성을 높였습니다. 법령명, 조문번호, 조문명, 번역문 등이 포함되어 있어 중문권 사용자나 관련 기관이 법령 내용을 이해하고 활용할 수 있도록 지원합니다. 본 데이터는 국내 법령의 국제적 접근성과 이해를 증진시키기 위한 기본 정보를 제공합니다. 법률 문서의 다국어 번역과 관련된 연구, 정책 개발 및 법률 서비스 제공에 중요한 기초 자료로 활용 가능합니다.
