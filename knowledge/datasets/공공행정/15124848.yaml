description_portal: 이 데이터는 한국남부발전의 내부회계 관리체계 강화를 위해 운영되는 전사수준통제 관리리스트를 정리한 자료입니다. 내부회계의 대분류, 중분류(내부통제 구성요소), 소분류(모범규준 18원칙), 통제활동명으로 구성되어 있으며, 윤리규정 제·개정, 윤리교육 시행, 청렴 서약서 징구 등 구체적인 활동 내용이 포함되어 있습니다. 이를 통해 조직 차원의 도덕성과 윤리적 가치 준수, 회계 투명성 확보, 리스크 관리 체계를 한눈에 파악할 수 있습니다. 또한 공공기관의 내부통제 운영 현황을 확인하고, 기업 내부회계 관리제도와 준법경영 연구, 내부감사 활동 개선 등에 기초자료로 활용될 수 있습니다.
