summary_user: 평택시의회에 발의된 의안을 건별로 정리한 파일로, 의회 대수·의안번호·의안명·발의일·발의자·데이터기준일을 담는다(csv 약 85KB). 시민이나 지역 정책 분석가가 "이번 대수 평택시의회에서 어떤 조례안·예산안이 언제 누구에 의해 발의됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지방의회 의안 데이터나 회의록과는 기관명·대수·의안번호를 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 평택시의회에서 발의된 각종 의안을 정리한 자료로 기관명, 대수, 의안번호, 의안명, 발의일, 발의자, 데이터기준일 등의 데이터를 제공합니다.시의회의안은 지방의회가 심의 및 의결하는 법안, 예산안, 기타 안건 등을 말합니다. 의안은 의원이나 지방자치단체의 장이 제출하며, 의안이 의결되면 관련 정책이나 사업이 실행될 수 있습니다. 시의회의안을 활용하여 지역 사회의 다양한 문제를 해결하고 발전시켜 나갈 수 있습니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.
