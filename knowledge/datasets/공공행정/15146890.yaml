summary_user: 조달청 종합민원센터가 국민신문고 등으로 받은 계약법규·입찰제도 질의와 그 회신을 한 건씩 담은 해석사례 파일로, 사례마다 회신일자·대·중·소분류·제목·질의내용·회신내용·조회수가 들어 있다(전국 범위, 비공간). 계약 실무자나 사업자가 '설계변경이나 물가변동으로 계약금액을 조정할 때 보험료·선금은 어떻게 처리하나' 같은 질문에 대해 조달청의 기존 해석을 찾아보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 나라장터 입찰·계약 데이터와는 번호로 연결되지 않고, 분류명이나 제목·본문의 키워드로만 맞춰 이어 쓴다.
description_portal: '"국민신문고 등을 통해 계약법규 및 입찰제도 등의 질의에 대한 해석사례에 대한 자료이며 대표적인 핵심문답 10종은 아래와 같다.1.설계변경으로 계약금액 조정 시, 보험료 및 산업안전보건관리비 등 계상방법2.협상에 의한 계약 재공고입찰 후 수의계약 시, 기술능력평가 여부3.물가변동 조정신청일의 적용 기준4.보험료(국민건강보험료 및 국민연금보험료 등) 사후정산5.설계변경에 따른 계약금액조정 가능 여부6.물가변동으로 인한 계약금액 조정 방법과 선금급 공제 여부7.공동계약에서 구성원의 중도탈퇴로 인한 공동도급내용 변경8.하수급인의 선금포기 시, 계약상대자(원도급자)의 선금 반환 여부9.추정가격 5천만원 이하 공사계약의 1인 수의계약 가능 여부10.계약담당공무원(계약담당자)의 범위"'
