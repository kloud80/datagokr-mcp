summary_user: 지방자치단체별로 지방세와 세외수입 중 납부되지 않은 체납 누계액을 회계연도(fyr) 단위로 담은 지방재정365 공시 집계 데이터로, 범위는 전국이며 공간 정보는 없다. 분석가나 주민이 "우리 시·군·구의 지방세·세외수입 체납액이 다른 자치단체보다 많은가, 해마다 늘고 있는가"를 비교하는 데 쓴다. 전역 조인 키는 없어 광역·기초 자치단체 코드와 이름(wa_laf_cd, laf_cd 등)을 매핑하거나 같은 지방재정365 계열 데이터와 자치단체 코드로 연결해 쓴다.
description_portal: 지방세 및 세외수입 체납 누계액은 지방자치단체가 부과한 세금과 세외수입에 대해 납부하지 않은 금액의 총합을 의미합니다.이는 지방자치단체의 재정 상태를 평가하는 중요한 지표로, 체납액이 많으면 해당 지방자치단체가 재정적으로 어려움을 겪을 가능성이 높습니다.체납 누계약은 세수 확보에 어려움을 겪고 있다는 신호일 수 있으며, 지방정부는 이를 줄이기 위한 체납 징수 활동을 강화해야 할 필요성이 있습니다.체납액의 증가가 지속되면 지방자치단체의 재정 안정성에 부정적인 영향을 미칠 수 있습니다.
