summary_user: 지방자치단체별 세입예산을 회계연도·자치단체·재원(세입목) 단위로 나눈 집계 자료로, 지방세·세외수입·지방교부세·국고보조금 같은 재원별 예산순계와 예산총계 금액(last_bdg_tott_amt 등)을 담으며 범위는 전국이다. 분석가나 주민이 '우리 시·군·구는 세입예산 중 자체수입과 교부세·보조금 비중이 각각 얼마이고 광역·기초단체끼리 비교하면 어떤가'처럼 재정자립도와 중앙정부 의존도를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 지방재정365의 다른 공시 데이터와는 자치단체 코드·이름(laf_cd, wa_laf_cd)과 회계연도를 맞춰 연결한다.
description_portal: 지방자치단체의 재원별·단체별 세입예산 지표는 각 자치단체가 확보한 세입예산을 재원별(지방세, 세외수입, 지방교부세, 국고보조금 등)로 구분하고 이를 단체 유형별(광역/기초단체)로 나누어 비교할 수 있도록 제공하는 자료입니다. 이 지표를 통해 자치단체의 재정자립도와 중앙정부 의존도, 자체수입 확보노력 등을 분석할 수 있으며, 재정구조의 특성과 안정성을 평가하는데 활용됩니다.재원별·단체별 세입예산 정보는 2001회계연도부터 제공되며 연도별 당초예산기준으로 취합됩니다. 세부 제공항목은 자치단체의 세입목별 예산순계, 예산총계 항목이 제공됩니다.
