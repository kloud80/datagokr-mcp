legal_basis_portal: '*관련 법령 안내건축사법 제23조(건축사사무소개설신고 등): 건축사사무소를 개설하려는 자는 시에 신고하여야하며, 신고 사항이 변경되거나 휴,폐업할 때도 신고의가 발생함.건축사법제28조(건축사사무소 개설신고의 효력상실 및 정지): 행정청은 법규를 위반한 건축사에 대해 업무정지나 자격취소 등의 행정처분을 내릴 권한과 의무가 있으며 과거 이력과 현황을 반드시 보유해야 원활한 관리가 됨.건축사법 제30조의2(공시 등): 건축사의 징계 현황 등을 국민이 알 수 있도록 공개해야 할 의무가 있어, 기초 데이터 관리가 필수적임.건축물은 국민의 행명과 재산에 직결되는 것으로 부실 설계 및 감시 방지로 건축사사무소의 기술 인력 현황과 행정처분 이력을 관리함으로써, 무자격자의 대여 행위나 부실 설계 가능성을 사전에 차단하고 건축물의 하자가 발생될 시 설계 및 감리 사무소의 상태(당시 인력, 정상 영업 여부 등)를 파악하여 법적 책임 소재를 가리는 증거자료가 됨.국가차원에서 건축 서비스 산업의 규모를 파악하고, 수급 조절이나 산업 진흥정책을 세우기 위한 기초 통계 자료로 활용됨.'
