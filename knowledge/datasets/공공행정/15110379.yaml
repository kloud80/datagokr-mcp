summary_user: 연도와 업종(대분류·중분류)별로 평균 창업비용이 높은 가맹 브랜드의 순위를 담은 전국 단위 집계 통계로, 가맹본부명·브랜드명과 함께 가맹금·교육비·보증금·기타비용·합계 금액을 제공한다. 가맹점 창업을 준비하는 사람이 '외식업 치킨 업종에서 초기 창업비용이 가장 많이 드는 브랜드는 어디이고 비용 항목은 어떻게 나뉘나'를 확인하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없어서 다른 가맹사업 데이터(정보공개서·브랜드 목록 등)와는 가맹본부명(corpNm)·브랜드명 이름 매칭이나 업종명으로만 이어 쓴다.
description_portal: 이 API는 공정거래위원회에서 제공하는 가맹정보_업종별 평균 창업비용 상위 순위 통계 제공 서비스 입니다. 년도, 업종대분류코드 등을 이용하여 업종별 평균 창업비용을상위 순위 정보에 대한 가맹금액, 기타금액, 교육금액 등의 정보를 조회할 수 있습니다.
