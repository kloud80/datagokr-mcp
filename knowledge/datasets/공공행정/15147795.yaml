description_portal: 이 데이터셋은 한국학중앙연구원에서 수행한 연구 과제의 세부 성과 정보를 담고 있는 구조화된 표 형식의 데이터이다. 각 행은 개별 연구자 단위로 구성되어 있으며, 주요 컬럼은 연구번호, 연구코드, 연구과제명(국문/영문), 연구책임자, 연구기간, 연구형태, 한글/영문 키워드, 연구자번호, 이름, 소속, 직책·직급 등으로 구성되어 있다.특히 이 데이터는 공동연구 형태의 프로젝트에 여러 연구자가 참여한 정보를 포함하고 있어, 단일 과제 내 복수 연구자 참여 구조를 분석하거나 연구자별 참여 프로젝트 이력을 추적하는 데 유용하다.
