summary_user: 정부광고통합지원시스템에 등록된 인쇄 매체 중 신문 범주의 전국·지역 종이신문을 매체 1건 단위로 담은 목록으로, 포털 설명 기준 약 1,174개 매체·매체사의 매체명, 매체사명, 구분, 분류 정보를 담는다. 정부기관·공공기관 광고 담당자가 정부광고를 의뢰할 때 어떤 전국지·지역지가 등록돼 있는지 확인하거나, 분석가가 지역별·분류별 종이신문 매체 분포를 파악하는 데 쓴다. 매체명·매체사명이 언론사 식별 키(kpf_media_outlet)로 쓰이므로 같은 재단의 다른 매체 현황(방송·인터넷신문 등)이나 정부광고 집행 데이터와 매체명 기준으로 이어 쓴다.
description_portal: 한국언론진흥재단에서는 정부광고법 시행을 위해 정부광고통합지원시스템을 운영하고 있습니다. 정부광고법에 의해 정부/공고기관 등이 유료의 고지 행위를 하는 경우 이를 문화체육관광부 장관 앞으로 의뢰해야합니다. 따라서 시스템 내에는 광고 의뢰를 하는 이용자들이 선택할 수 있도록 다양한 매체/매체사 정보가 등록되어 있습니다. 업로드한 데이터는 이 정보 가운데, 인쇄 매체 중 신문 카테고리의 전국/지역지에 대한 매체/매체사 정보입니다. 약 1,174개의 매체/매체사 정보이며, 광고주와 매체사의 요청에 의해 수정할 수 있습니다.
