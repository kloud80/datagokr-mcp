description_portal: 'O 조사 방법 : 민간기업의 개인정보처리자를 산업군 별 표본을 추출, 설문조사 결과(빈도)를 도출하였음※ 민간기업 5,795명을 대상으로 표본 조사한 자료이므로, 각 산업군 대표하는 결과로는 간주할 수 없음O 설문 내용 : 귀사는 개인정보를 어떠한 경로로 수집하거나 제공받아 처리하셨습니까? 해당하는 사항을 모두 표시해 주십시오O 응답 내용 : 각 항목명이 설문자가 선택한 결과임(설문조사 시 중복응답 허용)O 데이터 값 : 각 산업군 별 조사자 수를 기준으로 설문 항목을 선택한 비율항목설명온라인 : 온라인(웹사이트, 스마트폰 앱 등)에서 개인정보 수집오프라인 : 오프라인(고객명부 등)에서 개인정보 수집타사 수집 : 제3자제공, 업무제휴 등을 통해 타기관(기업)으로부터 수집위탁 제공 : 수탁, 수탁업무 수행을 위해 위탁사로부터 제공받음공개정보 : 언론, 인터넷 등에 공개된 개인정보 수집기타 : 기타가중치 : 조사 대상 수를 기준으로 부여된 가중치(전체 평균 산정 시 가중치 반영 필요)"'
