summary_user: 나우캐스트 포털에 올라가는 속보성 경제 지표(신용카드 이용금액, 전자지급서비스 충전액, 가맹점 카드·현금 매출액, 평균 영업일수, 온라인 채용 모집인원수, 공제금 지급율 등)를 지표구성식별자·날짜·지역·기타 코드별 자료값으로 담은 전국 단위 파일이다. 분석가가 '최근 지역별 카드 소비나 채용 수요가 어떻게 움직였나'처럼 공식 통계 발표 전 경기 흐름을 빠르게 가늠하는 데 쓴다. 지표·지역·업종·성별·연령대 뜻은 함께 제공되는 공통코드값 자료 세 가지(지표 설명, 지역코드 설명, 업종·성별·연령대 코드 설명)와 식별자로 맞춰 읽으며, 다른 기관 데이터와 바로 잇는 전역 조인 키는 없어 지역 이름·코드 매핑으로만 연결한다.
description_portal: '나우캐스트 포털 속보성 지표 제공용 데이터(신용카드이용금액, 전자지급서비스 충전액, 가맹점 카드매출액, 가맹점 현금매출액, 평균 영업일수, 온라인 채용 모집인원수, 공제금 지급율등) 자료입니다.나우캐스트 지표 데이터는 코드사용자료로 공통코드값 자료를 참고해주시길 바랍니다.공통코드값1(지표구성식별자): 지표구성식별자, 지표명, 세부지표명으로 이루어진 데이터로 지표설명 코드자료입니다.공통코드값2(지역공통코드식별자): 지역공통코드식별자, 코드명 데이터로 지역코드 설명 자료입니다.공통코드값3(다른공통코드식별자): 다른공통코드식별자, 코드명, 비고로 이루어진 데이터로 업종, 성별, 연령대 등 코드 설명 자료입니다.'
