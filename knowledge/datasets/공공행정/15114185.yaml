summary_user: 한전KPS에 협력회사로 등록되어 유효기간 안에 있는 업체를 한 행씩 담은 명단 파일로, 공사 분야(기계설비·전기·송변전·비파괴검사·계측제어 등), 전국·지역 협력회사 구분, 업체명, 대표자, 소재지를 전국 범위로 담는다. 발전설비 정비 분야 하도급·협력 참여를 검토하는 사업자가 "우리 지역에 어떤 분야 협력회사가 등록돼 있나"를 확인하거나, 분석가가 분야별·지역별 협력업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞추는 방식으로만 이어 쓴다.
description_portal: 한전KPS 주식회사에 등록된 협력회사 현황 정보입니다. 협력회사 운영지침 제17조(업체선정)에 따라 협력회사 기술평가, 품질평가 및 안전보건활동 수준평가를 통해  선정되고 유효기간 내 협력회사 등록현황 정보입니다. 등록현황은 공사별 업체 분야(기계설비공사, 전기공사, 송전 및 변전공사, 비파괴검사, 열처리공사, 계측제어, 비계 및 구조물해체, 원자력 단위설비, 외부 반출수리 및 제작), 지역별 업체 유형(전국협력회사, 지역협력회사), 업체명, 대표자, 소재지 정보 등의 현황을 포함하고 있습니다.
