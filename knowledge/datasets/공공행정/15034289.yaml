description_portal: '이 데이터는 경상북도 구미시 관내에 등록된 축산농가의 현황을 보여주는 자료로, 각 축산농가의 사육장 명칭, 주요 사육 업종(예: 한우, 돼지 등), 사업장 소재지, 사육두수의 정보를 포함하고 있습니다. 이를 통해 구미시 지역 내 축산업의 규모와 분포, 업종별 사육 현황 등을 한눈에 파악할 수 있어, 축산 관련 정책 수립, 가축 질병 예방·관리, 축산물 유통 계획 수립 등 행정적 활용은 물론, 학술 연구 및 산업 분석 등 민간 분야에서도 다양하게 활용될 수 있는 기초 데이터입니다. 특히 지역 단위의 지속가능한 농축산업 관리와 식품 안전 정책 추진에도 기여할 수 있는 의미 있는 공공데이터입니다.'
