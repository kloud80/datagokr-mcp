summary_user: 지방공기업별·연도별로 유동비율, 부채비율, 자기자본구성비율 같은 안정성 지표와 매출액순이익률·총자산순이익률 같은 수익성 지표, 총자산회전율 같은 활동성 지표, 총수지·경상수지·영업수지비율을 담은 기관 단위 집계 지표이며 범위는 전국입니다. 분석가나 주민이 '우리 지역 도시공사의 부채비율이 몇 년째 오르고 있는가, 다른 지방공기업과 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 경영공시 자료와는 기관명(ENT_NAME)과 연도(AC_YEAR)를 이름 매핑해 이어 쓴다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이며, 주요 경영분석 지표 자료에는 연도, 기관명, 안정성유동비율, 자기자본구성비율, 부채비율, 매출액순이익률, 자기자본순이익률, 매출액영업이익률, 총자산순이익률, 총자산회전율, 총수지비율, 경상수지비율, 영업수지비율 등 지표가 포함됩니다.지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
