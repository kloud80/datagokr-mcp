description_portal: 본 자료는 연도별 해외이주신고자 현황을 국가별로 구분하여 정리한 데이터로, 대한민국 국민의 해외이주 유형 및 이주 흐름을 체계적으로 파악할 수 있도록 구성되어 있습니다. 이주는 크게 연고이주, 무연고이주, 현지이주로 나뉘며, 연고이주는 혼인, 약혼, 친족관계 등을 기반으로 한 이주이고, 무연고이주는 외국기업과의 고용계약, 해외이주알선업체 등을 통한 취업 및 사업 이주를 포함합니다. 현지이주는 외국에 체류 중 영주권이나 장기비자를 취득해 이주하는 경우를 말합니다.이 자료는 국가별 이주 특성과 사회적, 경제적 요인을 분석하는 데 유용하며, 해외 이주 정책 수립, 통계 분석, 학술연구 등 다양한 분야에서 활용될 수 있습니다.
