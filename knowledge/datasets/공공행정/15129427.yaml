description_portal: 나라장터에서 체결된 계약정보목록을 물품, 외자, 공사, 용역의각 업무별로 제공하는 서비스로, 각 업무별 계약상세정보, 계약변경이력정보, 계약삭제이력정보를 제공. 또한, 나라장터 검색조건인 계약체결일자, 확정계약번호, 요청번호, 공고번호, 기관명(계약기관, 수요기관), 품명, 계약방법, 계약참조번호에 따른 계약현황정보를 제공. 변경된 계약정보이력조회. 삭제된 계약정보조회. 나라장터 검색조건에 의한 계약정보 조회※ 업무구분별(물품,외자,공사,용역)로 기본조회와 상세조회가 오퍼레이션별로 구분되어 있으므로 계약 정보 조회 및 처리 시 유의하여 주시기 바랍니다.
