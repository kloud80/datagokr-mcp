description_portal: '이 공공데이터는 석면 함유 가능성이 있어 조사 대상으로 지정된 건축물들의 현황 정보를 제공합니다. 각 건축물의 명칭, 고유 주소, 분류(예: 주택, 공공건물 등), 그리고 소유자 정보 등을 포함하고 있습니다. 또한, 특정 규모 이상의 공공기관 소유·사용 건축물, 어린이집, 유치원 등도 포함될 수 있습니다 . 이 데이터는 석면으로부터 국민의 건강을 보호하고, 건축물 해체·제거 시 안전한 관리 계획을 수립하는 데 필수적인 기초 자료로 활용됩니다 . 투명한 정보 제공을 통해 건축물 안전 관리 및 환경 위해성 평가, 그리고 향후 관련 법규 준수 여부 확인 등에 기여하며, 안전한 생활 환경 조성을 위한 중요한 도구입니다.'
