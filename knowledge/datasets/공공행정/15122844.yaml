description_portal: 이 데이터는 국립중앙과학관의 연도별 관람객 현황을 보여줍니다. 본관, 생물탐구관, 첨단과학관 등 주요 전시관별로 방문자 수가 집계되어 있으며, 전체 관람객 수와 개관일수, 일평균 관람객 수도 함께 제공됩니다. 2013년부터 2022년까지의 변화 추이를 확인할 수 있는데, 2020~2021년에는 코로나19 영향으로 관람객 수가 크게 감소했다가 2022년부터 점차 회복되는 모습을 볼 수 있습니다. 이 자료는 과학관의 이용 현황과 사회적 변화가 관람객 수에 미치는 영향을 이해하는 데 도움을 줍니다.
