description_portal: '○ 통계개요* 통계명 : 지방세 징수(구별)* 통계종류 : 서울시 지방세 징수 규모를 자치구별으로 제공하는 일반ㆍ보고통계* 근거법령 : 「지방세법」에 의거하여 운용되는 지방세 현황* 작성목적 : 지방재정의 계획수립 및 운용 현황을 파악하여, 지방재정의 건전하고 투명한운용과 합리적·효율적인 관리가 이루어질 수 있도록 기초자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 세무과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 각 자치구의 지방세 세목별·세입 단위별(시세·구세) 징수 규모○ 용어설명* 지방세 : 지방자치단체가 징수하는 조세로, 국가의 수권에 의해 주로 지방자치단체가관할하는 지역사회의 복지를 증진시키기 위한 목적에서 징수됨○ 기 타* 2008년부터 보통세 시세에 특별시분 재산세 항목 추가* 2010년부터 보통세 시세에 지방소득세 항목 추가, 구세에 주민세와 지방소득세 항목추가○ 출 처 : 서울특별시 세무과'
