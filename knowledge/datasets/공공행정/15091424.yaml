summary_user: 경상남도 18개 시군에 있는 대규모점포와 준대규모점포를 점포 한 곳당 한 행으로 담은 현황 파일로, 시군명·규모 구분·업태 구분(백화점, 대형마트, 복합쇼핑몰 등)·상호·개설등록일·소재지·매장면적을 담는다. 소상공인 정책 담당자나 상권 분석가가 '우리 시군에 대형마트·백화점이 몇 곳이고 매장면적은 얼마인가', '최근 개설된 대규모점포는 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없으므로, 다른 데이터와는 시군명이나 소재지 주소를 문자열로 맞추어 연결해야 하며 LOCALDATA 인허가 등 점포 원장과 함께 볼 때도 이 방식으로 잇는다.
description_portal: 경남도 내 대규모점포 및 준대규모점포에 대한 데이터로, 기초지자체명, 구분1(규모), 구분2(백화점, 대형마트 등), 상호명, 개설등록일, 소재지, 매장면적에 대한 정보를 제공합니다.※ 구분은 전문점, 쇼핑센터, 복합쇼핑몰, 백화점, 대형마트, 그밖의 대규모점포로 분류경남도 내 18개 시군에  있는 대규모점포 73개의 위치와 매장면적을 제공하므로 대규모 점포 현황을 파악하는 데에 활용합니다.현재 데이터는 2025년 6월말 기준 대규모점포 및 준대규모점포 현황이며, 연간 현행화로 차기 업데이트 예정일은 2026년 11월입니다.데이터에 대한 추가 문의사항은 경상남도 소상공인정책과로 문의 바랍니다.
