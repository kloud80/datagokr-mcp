description_portal: '○ 통계개요* 통계명 : 특별회계 세입ㆍ세출 예산개요(본청)* 통계종류 : 서울시 본청의 특별회계 세입ㆍ세출예산 개요를 제공하는 일반ㆍ보고통계* 근거법령 : 「지방재정법」에 의거하여 운용되는 지방재정 현황* 작성목적 : 지방재정의 계획수립 및 운용 현황을 파악하여, 지방재정의 건전하고 투명한운용과 합리적ㆍ효율적인 관리가 이루어질 수 있도록 기초자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 예산담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 본청 특별회계(공기업ㆍ기타특별회계) 세입ㆍ세출예산 개요○ 용어설명* 특별회계 : 특별회계는 한 국가의 회계 중 특정한 세입으로 특정한 세출을 충당하는 것임○ 기 타* 최종예산액임* 숫자의 단위 미만은 반올림하였으므로, 내용의 계가 일치하지 않을 수도 있음* 2006년부터「지역개발기금」항목추가* 2007년부터 「재정비촉진」「기반시설부담금」항목추가* 성과주의 예산개요 참조'
