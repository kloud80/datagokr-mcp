description_portal: 본 자료는 2020년 코로나19로 인해 대전시에서 공공요금 감면 혜택을 받은 약 10만 명의 소상공인을 대상으로, 2022년 9월 말 기준 이들의 영업 상태를 분석한 현황입니다. 영업 상태는 영업 중, 휴업, 폐업, 조회 불가로 구분되었으며, 이를 통해 소상공인의 사업 지속 여부와 경제적 영향을 파악할 수 있습니다. 데이터는 공공데이터 포털과 국세청 사업자등록번호 진위 여부 서비스를 활용하여 신뢰성을 높였으며, 2022년 공공데이터 기업매칭지원사업의 일환으로 수행되었습니다. 이 현황은 코로나19 팬데믹 이후 소상공인의 경영 상황과 정책 지원 효과를 평가하는 중요한 기초 자료로 활용됩니다.
