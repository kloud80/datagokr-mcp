summary_user: 경상북도 영덕군이 집중호우·태풍 등 수해 때 주민 대피용으로 지정한 대피장소를 시설 한 곳당 한 행으로 담은 파일이며, 명칭·도로명/지번주소·시설유형·면적·이용가능인원·위도/경도를 포함한다(이재민수용시설과 지진해일대피장소는 제외). 영덕군 주민이나 방재 담당자가 "우리 마을에서 가장 가까운 수해 대피소는 어디이고 몇 명까지 들어갈 수 있나"를 확인하거나, 읍면별 대피 수용능력을 점검하는 데 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표를 기준으로 침수위험지역·인구 자료 등과 공간 매칭해 이어 쓴다.
limits: 범위가 영덕군 한 곳이라 다른 시군 대피소와 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 조인 키가 없어 연계는 이름·주소 매핑이나 좌표 기반 매칭에 의존한다.
