description_portal: 재난발생 시 이재민수용시설, 지진해일대피장소를 제외한 수해대피장소의 명칭, 도로명주소, 지번주소, 시설유형, 시설면적, 이용가능인원, 좌표(위도,경도) 데이터를 제공합니다.수해대피장소 데이터는 집중호우나 태풍 등의 수해 발생 시 주민이 안전하게 대피할 수 있도록 지자체가 지정한 대피소 위치와 정보를 체계적으로 정리한 자료입니다. 이 데이터는 침수위험지역과의 거리, 대피소의 접근성, 수용 가능 인원, 건물 구조 등의 요소를 포함합니다.영덕군에 시설은 대부분 공공시설(마을회관, 경로당, 학교 등)이며 사유시설(모텔, 교회 등)도 일부 포함되어 있습니다.
