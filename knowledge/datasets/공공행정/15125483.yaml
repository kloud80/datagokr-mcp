summary_user: 가맹사업 기준년도별로 브랜드마다 가맹점사업자가 영업 중에 부담하는 비용 항목을 건별로 담으며, 비용 구분, 지급 대상, 지급 금액, 지급 기한, 반환 조건과 반환 불가 사유를 전국 범위로 제공한다. 가맹 창업 예정자가 "이 브랜드에 가입하면 영업 중에 누구에게 얼마를 언제까지 내야 하고, 나중에 돌려받을 수 있나"를 확인하거나 브랜드 간 부담 조건을 비교하는 데 쓴다. 브랜드관리번호와 가맹본부관리번호로 같은 공정위 가맹정보의 다른 브랜드·본부 데이터와 잇지만, 실측 컬럼에는 사업자등록번호 같은 전역 조인 키가 없어 외부 데이터와는 이름 매핑으로만 연결한다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 사업자등록번호·법인등록번호 기준으로 다른 기관 데이터와 바로 붙일 수 없다. 조회에는 기준년도와 브랜드관리번호가 필요하고, 금액·기한·반환조건은 서술형 내용 필드라 수치 집계 전에 정제가 필요하다.
