description_portal: 부산광역시 동래구 관내 자원봉사할인가맹정 현황에 대한 데이터로 상호명, 도로명주소, 해당동, 할인(우대)내용, 전화번호 등의 항목을 제공합니다.동래구 자원봉사센터는 사회복지법인 양덕 사회문화원이 동래구로부터 위탁 받아 2001년 7월 2일 동래종합사회복지관 내에 개소하였습니다.자원봉사센터는 자원봉사활동, 개발, 장려, 연계, 협력 등의 사업을 수행하기 위하여 자원봉사활동기본법 제19조에 의해 설치 인증된 기관입니다.현재는 총 7개의 캠프를 개소하여 동래구 곳곳에 봉사활동 기회를 제공하고 있습니다.
