summary_user: 조달청 혁신장터에서 지정된 혁신제품을 지정 건별로 담은 파일(csv 약 397KB)로, 지정증서번호·지정기관·혁신상품 구분·지정일자·유효기간·여성/청년기업 여부·상품식별번호 목록 등을 담는다. 공공기관 구매담당자나 조달 분석가가 '어떤 혁신제품이 현재 유효기간 안에 있어 수의계약 대상인가', '유형별·연도별로 몇 건이 지정됐나'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어, 상품식별번호 목록이나 제품명·지정기관명 매핑으로 나라장터 계약·물품 데이터와 연결해야 한다.
description_portal: '○ 혁신제품 : 공공서비스의 향상과 기술혁신을 위하여 공공성, 혁신성 등 심의를 거쳐 지정  - 각 기관은 ‘혁신장터’(혁신조달플랫폼)에서 지정된 혁신제품 구매 가능  - 혁신제품 지정 후 3년 동안 수의계약 가능(국가계약법 시행령 제26조 및 지방계약법 시행령 제25조)   * 조달청 시범구매사업 참여 가능  - 각 기관의 구매자는 구매면책으로 보호(조달사업에 관한 법률 제27조)  1. 혁신제품 유형    가. 유형1 : 우수연구개발 혁신제품 : 기타 혁신제품 각 부처가 R &D 결과물, 기술인증제품 중 혁신성·공공성 인정 제품을 선정    나. 유형2 : 혁신시제품 조달청이 상용화 전 시제품 중 혁신성·공공성 인정 제품을 선정'
