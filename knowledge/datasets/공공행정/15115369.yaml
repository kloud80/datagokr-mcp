summary_user: 서울 강남구에서 지하수 오염물질을 제거·분해·희석해 수질을 개선하는 지하수정화업체의 인허가 목록을 업소 한 곳당 한 행으로 담으며, 인허가일자·영업상태(영업/폐업)·휴폐업일·주소·좌표·자본금·시설장비 등이 들어 있다. 지하수 정화 공사를 맡길 업체를 찾는 사업자나 강남구 내 환경 관련 업소의 개업·폐업 이력을 보려는 분석가가 '현재 영업 중인 지하수정화업체는 어디인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 같은 원천을 쓰는 LOCALDATA 인허가 자료와 대조해 쓴다.
