description_portal: 제주특별자치도개발공사 내부 직원들이 올바른 가치기준과 행위기준을 정립하고 이를 실천하도록 하며, 부패위험요인에 대한 자율적 통제 역량을 갖추도록 부패방지교육을 운영하고 있습니다. 연간 전체 직원과 신규·승진자를 포함한 일정 인원이 참여하며, 교육 내용에는 청탁금지법·이해충돌방지법 등 반부패 관련 법령 교육 등이 포함됩니다. 집합강의와 실시간 온라인 화상강의, 사이버 및 마이크로러닝을 병행하여 접근성을 높이고, 특히 현장근무자도 교육 기회를 균등하게 제공받을 수 있도록 설계되었습니다. 강사는 주로 국민권익위원회 청렴연수원 등록 전문강사로 운영하고 있으며, 신규 및 승진자에게는 대면 교육을 포함해 연 2시간 이상 필수 이수 시간을 보장합니다(법령상 교육 기준에 부합). 또한 기관은 교육 계획 및 이수 결과(교육일자, 방법, 이수자 명단 등)를 내부 홈페이지 또는 보고서로 공시하고, 다양한 투명성 강화 노력을 병행하고 있습니다. 이러한 교육과 제도적 운영은 청렴한 조직문화 조성, 부패 위험 자율 통제 체계 구축 및 구성원 모두에게 교육 기회 확대를 통해 신뢰성과 책임성 높은 조직 역량 강화에 기여하고 있습니다.
