summary_user: 경산시의회 의원 한 명당 한 행으로 성명·의원구분(지역구·비례대표)·정당·구역·선거구·소속 위원회·전화번호·사진 주소를 담은 의원 명단 파일(csv, 약 3.5KB)이다. 시민이 "우리 동네 선거구 시의원은 누구이고 어느 상임위원회 소속인지, 연락처는 무엇인지"를 확인하거나, 분석가가 시의회의 정당별·위원회별 구성을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 선거구·구역 이름이나 의원 성명을 문자열로 맞춰 이어야 한다.
