summary_user: 서울시 안에서 건강기능식품을 일반 판매하는 업소(유통전문판매업 제외)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·소재지 주소·면적·종사자수·중부원점TM 좌표(X, Y)를 포함한다. 창업 예정자나 상권 분석가가 '우리 동네에 건강기능식품 판매점이 몇 곳 영업 중이고 최근 몇 곳이 폐업했나'처럼 점포 개폐업 이력과 밀집도를 볼 때 쓴다. 전역 조인 키는 없어 주소(지번·도로명)나 업소명, 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)로 이어 붙이며, 같은 원천을 쓰는 LOCALDATA 지방행정 인허가 자료와 함께 상권 분석 원료로 쓴다.
description_portal: '건강기능식품을 판매하는 업소정보(건강기능식품유통전문판매업에 해당되는 업소 제외)* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 인허가일자, 인허가취소일자, 영업상태코드,영업상태명,상세영업상태코드,상세영업상태명,폐업일자,휴업시작일자,휴업종료일자,재개업일자,전화번호,소재지면적,위생업태명,종사자수,등급구분명,다중이용업소여부 등* 원본시스템 :지방행정 인허가 데이터개방* 본 데이터는 3일전 자료를 제공합니다.'
