description_portal: 경기도 수원시의 읍면동 내부에서만 이동한 생활이동인구 데이터로 기준 읍면동명, 연령별, 월별, 시간대별 데이터를 포함합니다.  2021년 기준의 일회성 데이터입니다. 데이터 활용에 참고하여 주시기를 바랍니다.  읍면동 단위로 지역 이동 인구 수를 알 수 있어 생활권 경계와 실제 행정구역의 차이를 알 수 있으며, 인구 유입, 유출이 많은 동네에 교통 및 맞춤형 행정 서비스를 제공하는 근거로 활용 할 수 있습니다. 특정 동네에서 인구가 지속적으로 빠져나가면 생활 환경 개선이나 상권 활성화를 위해 노력할 수 있습니다. 주민등록 인구는 적어도 실제 생활인구가 많은 동네 주민들에게 행정 서비스 확충의 근거로 활용할 수 있습니다.
