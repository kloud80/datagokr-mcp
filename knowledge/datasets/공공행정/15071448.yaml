summary_user: 서울특별시 다단계판매업체를 업체 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태와 상세영업상태·폐업일자·휴업기간·주소·좌표·업종구분·자본금 규모를 포함한다. 소비자나 감독 담당자가 '이 다단계 업체가 정식 등록돼 지금도 영업 중인가, 서울 어느 지역에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없고, LOCALDATA 인허가 자료와 같은 원천이므로 관리번호(MGTNO)·개방자치단체코드로 같은 계열 인허가 자료와 맞추거나 주소·사업장명으로 다른 상권 자료와 연결한다.
description_portal: 'ㅇ 데이터 개요: 서울특별시가 보유한 다단계판매업체의 인허가 및 영업상태 현황을 정리한 표 형식 데이터입니다. ㅇ 주요 필드: 관리번호, 영업상태(코드·명), 상세영업상태(코드·명), 전화번호, 지번/도로명주소, 우편번호, 좌표정보(X/Y), 업종구분명, 자본금의규모, 데이터갱신구분 등으로 구성되어 있습니다.ㅇ 공간 정보: 좌표정보(X/Y) , 지번주소, 도로명주소  존재합니다.ㅇ 활용 예시: 다단계판매업 관리·감독, 소비자 보호 모니터링, 지역별 업체 분포 분석, 위치 기반 점검 우선순위 산정(좌표계 확인 필요) 등에 활용 가능합니다.ㅇ 유의사항: 날짜·좌표계·우편번호 등 메타데이터의 명시 수준이 제한적이며, 일부 필드 결측 및 이상치가 확인됩니다. 분석 전 결측치 처리, 좌표계 식별, 상태코드 사전 정의 확인을'
