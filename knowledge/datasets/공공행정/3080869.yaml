summary_user: 경기도 동두천시에 등록된 행정사 사무소를 한 곳씩 담은 건별 목록으로, 종류·대표자명·상호·도로명/지번 주소·위도·경도·등록일을 담는다(파일 크기 약 3.4KB의 소규모 CSV). 민원인이 서류 작성이나 인허가 대행을 맡길 동두천시 내 행정사를 찾을 때, 또는 분석가가 시군구 단위 행정사 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 다른 시군의 행정사 현황과는 같은 컬럼 이름으로 맞춰 쌓고, 다른 생활 행정시설 데이터와는 주소나 좌표로 공간 결합해 쓴다.
