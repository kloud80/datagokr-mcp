summary_user: 농식품 공공데이터 포털에 개방된 품질관리 데이터셋의 목록을 데이터셋·데이터 단위로 담은 메타데이터로, 데이터셋명·설명·제공기관·담당자 연락처·키워드·등록일·이용허락범위·업데이트주기·제공 형태(그리드·오픈API·파일·지도 등)를 전국 범위·비공간으로 정리한다. 연구자나 농식품 업계 종사자가 '농산물 품질관리 관련해 어떤 데이터가 어느 기관에서 어떤 형태로 열려 있고 담당자는 누구인가'를 찾을 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 데이터셋명·기관명 같은 이름 매칭이나 링크URL·공공데이터포털URL로 원본 데이터셋을 찾아가는 방식으로 연결한다.
description_portal: '농식품 공공데이터 포털에 개방한 품질관리 데이터 목록으로, 이 데이터셋은 농식품 분야의 품질관리에 대한 정보를 제공하고 있습니다. 데이터셋은 데이터셋 ID, 데이터셋명, 데이터셋 설명, 관련 기관 및 담당자의 연락정보, 키워드, 등록일과 같은 다양한 정보를 포함하고 있어 연구자나 업계 종사자들이 농식품 품질 관련 정보를 쉽게 접근하고 활용할 수 있게 합니다. 이 데이터를 활용하여 소비자의 안전과 건강을 증진시키고, 또한 농식품 산업의 품질 개선 및 혁신을 도모하는데 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형): 품질관리 데이터셋을 식별하는 고유한 아이디, 데이터셋명(문자형): 데이터셋의 이름, 데이터셋설명(문자형): 데이터셋에 대한 자세한 설명, 기관명(문자형): 데이터를 제공하는 기관의 이름, 담당자명(문자형): 데이터와 관련된 담당자의 이름, 전화번호(문자형): 담당자의 연락처, 등록일(날짜형): 데이터셋의 등록일, 데이터ID(문자형): 품질관리 데이터셋의 고유 ID, 데이터명(문자형): 데이터셋의 구체적인 이름, 데이터설명(문자형): 데이터셋의 내용에 대한 설명 등이 있습니다. 이 밖에도 제3자 권리 포함 유무 및 업데이트 주기와 같은 중요한 정보들도 포함되어 있습니다.'
