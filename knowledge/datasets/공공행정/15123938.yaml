summary_user: 대전 동구 중앙로 지하 200에 있는 역전지하도상가(대전역 지하상가)의 점포를 한 행에 하나씩 담은 점포 원장 파일로, 점포이름·점포면적·점포주소·건물총면적·점포사용면적·사용여부를 담는다(csv 약 12.7KB). 지하상가 입점을 검토하는 사업자나 상권 분석가가 '이 지하상가에 비어 있는 점포가 몇 개이고 면적은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호·행정코드 같은 전역 조인 키가 없어, 다른 데이터와는 점포이름·주소를 문자열로 맞추거나 같은 공단의 다른 지하도상가 자료와 나란히 놓는 식으로만 연결한다.
description_portal: 대전광역시시설관리공단에서 운영 중인 대전역 지하도상가의 점포상세정보를 제공하고 있습니다. 공단은 체육, 환경, 복지, 기반 4개 분야의 시설을 관리하고 있으며 역전지하도상가는 기반시설에 해당됩니다. 데이터에 표시되는 점포의 수는 점포 계약 및 입찰 결과에 따라 변경될 수 있습니다. 역전지하도상가의 주소는 대전광역시 동구 중앙로 지하 200 이며, 해당 파일에서 제공하는 정보는 일렬번호, 점포이름, 점포면적, 점포주소, 건물총면적, 점포사용면적, 사용여부입니다. 데이터 기준일은 2025년 7월 1일 기준입니다.
