summary_user: 온비드에 등록된 압류재산·국유재산·공유재산 등 공매 물건의 공고를 공고 1건 단위로 담으며, 공고명·공고기관·공고일자·회차·입찰기간·개찰일시·처분방식(매각/임대)·입찰구분(인터넷/현장)을 제공한다. 공매 참여를 검토하는 국민·사업자나 분석가가 '이번 달 개찰하는 국유재산 매각 공고는 어떤 기관이 몇 건 냈나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 공고관리번호·공매번호로 같은 온비드 계열 서비스와 맞추거나 기관명 같은 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지에 등록된 압류재산, 국유재산 등 다양한 공매 물건에 대한 공고 목록 정보를 조회할 수 있는 서비스입니다. 해당 서비스 이용자는 물건유형, 재산유형, 공고일자, 입찰기간,  개찰일자 등을 검색조건으로 활용하여 공고명, 공고기관, 공고일, 회차 등의 정보를 조회할 수 있습니다. 필수 입력 조건 : 물건유형코드(cltrTypeCd), 재산유형코드(prptDivCd), 개찰일_시작일자opbdDtStart), 개찰일 종료일자(opbdDtEnd)'
team:
  dept: 디지털시스템실
