summary_user: 경기도의회에서 처리되는 요구서별로 연락을 받은 담당자(도의원·전문위원실 등 회원구분과 회원명), 연락 전화번호, 문자 발송 여부, 제출 여부, 완료 여부, 등록일자를 한 행씩 담은 건별 운영 기록이며, 범위는 경기도 한 시도이고 위치 정보는 없다. 의회 업무를 분석하는 사람이 '이 요구서는 어느 담당자에게 연락됐고 제출·처리 완료까지 갔는가'를 확인하거나 담당자별 요구서 처리 분담을 살펴볼 때 쓴다. 다른 데이터셋과 공통으로 쓰는 전역 조인 키는 없고, 요구서 번호(dmnd_seq_no)는 같은 의정포털 안의 요구서 자료와 맞출 때만 쓰며, 그 밖에는 회원명 같은 이름 매핑이나 같은 기관 자료끼리만 연결한다.
description_portal: 「경기도의정포털_요구서연락정보」 데이터는 경기도 의회에서 처리되는 요구서 관련 연락 현황을 기록한 자료입니다. 주요 항목으로는 요구서시퀀스번호, 회원구분(도의원·전문위원실 등), 요구서연락정보회원시퀀스번호, 연락 전화번호, 문자여부, 제출여부, 완료여부, 등록일자, 회원명 등이 포함됩니다.이 자료는 요구서 처리 과정에서 어떤 담당자가 연락을 받았는지, 연락 방식(문자 발송 여부), 요구서 제출 및 처리 완료 여부를 확인할 수 있도록 구성되어 있습니다.이 데이터는 의회 요구서 처리 절차 분석, 담당자별 업무 분장 확인 등에 활용 가능합니다.
