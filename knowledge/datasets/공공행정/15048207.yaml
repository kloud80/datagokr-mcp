summary_user: 2014년 6월 4일 실시한 제6회 전국동시지방선거의 개표결과를 시도·구시군·읍면동 단위로 담은 xlsx 파일로, 선거인수·투표수·후보자별 득표수·무효투표수·기권수가 들어 있다. 선거 분석가나 연구자가 '2014년 지방선거에서 우리 동네 읍면동의 투표율과 후보별 득표는 어땠나'처럼 지역별 투표 결과와 득표 분포를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 선거 결과나 인구·행정 통계와는 시도·구시군·읍면동 이름을 맞춰 연결해야 한다.
