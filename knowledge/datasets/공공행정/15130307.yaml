description_portal: '[SGIS 오픈 플랫폼] "SGIS에듀" 서비스의 교사 정보입니다.교사 권한 요청을 위해 등록한 정보이며, 학교등급과 과목을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. SGIS에듀  사회교과과정 및 관심주제에 따라 관련 콘텐츠에 쉽게 접근할수 있도록 메뉴 구성되었으며, 주변생활과 밀접한 통계정보들과 위치 정보들을 결합한 다양한 통계지도들을 제공하는 서비스'
