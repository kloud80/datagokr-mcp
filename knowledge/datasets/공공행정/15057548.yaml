summary_user: 지방자치단체별로 이전연도 최종예산 대비 채무잔액의 비율(예산대비채무비율)을 회계연도 단위로 담은 전국 단위 집계 지표이며, 포털 설명상 2009회계연도부터 일반회계·기타특별회계·공기업특별회계·기금을 대상으로 한다. 주민·분석가가 "우리 시·군·구의 예산 대비 빚 비율이 다른 자치단체보다 높은가, 해마다 늘고 있는가"처럼 재정 건전성을 비교·추적하는 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 자치단체 코드·이름(laf_cd 등)과 회계연도로 같은 기관의 다른 지방재정365 지표(재정자립도 등)와 매핑해 이어 쓴다.
description_portal: 지방자치단체의 예산대비채무비율은 전체 예산에 대한 채무의 비율을 나타내며 재정 건전성을 평가하는 중요한 지표로 사용됩니다. 이 비율은 지방자치단체가 얼마나 많은 채무를 관리하고 있는지를 보여주며, 재정의 지속 가능성, 재정위기 가능성을 예측하는데 중요한 역할을 합니다. 이 자료는 자치단체의 이전연도 최종예산 대비 채무잔액이 차지하는 비율을 분석한 자료입니다.예산대비채무비율 정보는 2009회계연도부터 제공되며 대상회계는 일반회계, 기타특별회계, 공기업특별회계, 기금입니다.
