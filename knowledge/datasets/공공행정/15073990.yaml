description_portal: 2025년 12월  기준 광주광역시 인구 및 세대 현황 자료입니다.  링크 내 첨부파일에서 다운로드 가능합니다. 자치구별 인구수, 구성비, 성비, 세대수, 세대당 인구가 포함되었고 자치구별 연령별 성별 인구현황은 자치구별 인구수 구성비, 성비 자료가 포함되었습니다. 세대원수별 세대수 자료는 자치구별 세대원수별 세대수 자료가 포함되어 있습니다. 전국 인구 및 세대현황은 전국 자치단체별 인구수, 남, 여 인구수, 남, 여, 구성비, 성비, 세대수, 세대당인구 자료가 포함되어 있습니다. 연령별, 성별, 세대별  인구현황 및 전국 인구현황입니다.
