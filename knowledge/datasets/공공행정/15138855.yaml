summary_user: 지방자치단체 세입 가운데 취득세·재산세·자동차세·담배소비세·주민세 같은 지방세 세목별로 해당 연도 실제 수납액과 전년 대비 증감률(%)을 담은 전국 단위 집계 지표입니다. 분석가나 지방재정 담당자가 "올해 취득세 세수가 작년보다 얼마나 늘었거나 줄었나"처럼 세목별 세입 기반의 성장 추세를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 회계연도(fyr)와 세목 코드·이름을 기준으로 같은 지방재정365의 다른 공시 지표와 맞춰 잇는다.
description_portal: 세목별 세수신장률이란 지방자치단체의 세입 중 지방세 항목별로 전년도 대비 세수(실제수납액)가 얼마나 증가하거나 감소했는지를 백분율로 나타낸 지표입니다.여기서 ‘세목별’이란 취득세, 재산세, 자동차세, 담배소비세, 주민세 등 지방세의 각 항목을 의미하고 있으며, ‘세수 신장률’은 전년도 같은 세목의 실제 수납액과 비교하여 해당 연도의 세수 실적이 증가(+) 또는 감소(-)한 정도를 보여주는 수치입니다.이 지표는 자치단체의 재정 자립도 및 세입 기반의 성장 추세를 분석하는데 중요하게 활용할 수 있습니다.
