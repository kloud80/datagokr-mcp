description_portal: 경기도 수원시의 생활이동인구 데이터로 관외에서 관내로 유입된 데이터로 성별, 연령별, 시간대별 데이터를 포함합니다.  2021년 기준의 일회성 데이터입니다. 데이터 활용에 참고하여 주시기를 바랍니다.  단순한 주미등록 인구가 아니라 실제로 해당 지역에 와서 생활(근무, 학업, 소비 등) 하는 인구를 알 수 있어 교통, 교육, 복지, 문화시설을 배치하는데 활용할 수 있습니다. 또한 관내 유입 인구가 많은 경우 인접 지자체와의 교통 환경 인프라 협력하는데 근거가 될 수 있으며,  실제 생활인구에 맞춘 버스 배차, 도로 확충, 상하수도 폐기물 처리 용량 조정하는데에 활용 할 수 있습니다.
