summary_user: 벤처나라에 등록된 상품을 건별로 담은 파일 데이터로, 물품명·업체·단가·규격·원산지·납품조건·유효기간·인증목록을 포함하며 11,411건(전국, 2019-06-21~2027-03-04)이다. 공공조달에 납품하려는 벤처기업의 상품이나 단가를 비교하고 싶은 구매 담당자·분석가가 어떤 업체가 어떤 상품을 얼마에 등록했는지 확인하는 데 쓴다. 업체사업자등록번호(bizno)를 키로 같은 사업자번호를 가진 다른 조달 데이터와 이어 쓰며, 물품식별번호는 조인 키로 지정되어 있지 않다.
