summary_user: 김포시 관할 행정동·법정리 단위의 행정구역 경계를 SHP 공간정보 파일로 담은 원천 데이터로, 범위는 김포시 한 개 시군구이고 행정단위는 읍면동 수준이다. 김포시 생활권이나 행정서비스 범위를 분석하는 연구자·공무원이 '이 시설·인구 통계가 어느 동·리 경계 안에 속하는가'를 지도로 확인할 때 쓴다. 실측 컬럼에는 한글명·영문명·작업일자만 있고 전역 조인 키(행정코드)가 없어, 다른 데이터와는 동·리 이름 매핑이나 공간 결합(좌표가 경계 안에 드는지)으로만 이어 쓴다.
limits: 행정동·법정리 코드가 없어 통계 데이터와 코드로 바로 붙일 수 없고, 이름 표기를 맞춰 매핑해야 한다. 범위가 김포시 한 곳뿐이라 다른 시군구 경계는 담지 않는다.
