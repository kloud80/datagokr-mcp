summary_user: 서울 강동구가 보유·관리하는 공유재산을 필지(소재지) 단위로 한 줄씩 담은 원천 목록으로, 소재지·지목·면적·재산구분·소유자·재산관리관과 데이터기준일자를 담는다. 주민이나 분석가가 '우리 동네에 구가 가진 땅·건물이 어디에 얼마나 있고 어느 부서가 관리하나'를 확인하거나 유휴 공유재산·공공시설 입지 후보를 찾는 데 쓴다. 전역 조인 키(필지고유번호 등)가 없어 다른 데이터와는 소재지 주소를 매칭하거나 같은 기관(강동구) 기준으로만 이어 쓰며, 국유재산처럼 PNU로 바로 연결되지는 않는다.
description_portal: 서울특별시 강동구에서 보유·관리 중인 공유재산 현황을 제공하는 공공데이터입니다. 본 데이터는 강동구 소유 또는 관리 대상 공유재산의 소재지, 지목, 면적, 소유자, 재산구분, 재산관리관 등의 정보를 포함하고 있으며, 관내 공유재산의 보유 현황과 관리 체계를 체계적으로 파악할 수 있도록 구성되어 있습니다.공유재산은 행정 목적 수행, 공공서비스 제공, 지역 기반시설 운영 등에 활용되는 중요한 공공 자산으로, 효율적이고 투명한 관리가 필요합니다. 본 데이터는 공유재산의 위치, 용도, 규모, 관리 주체 등을 확인할 수 있어 행정기관의 재산관리 업무, 유휴재산 발굴, 공공시설 확충 검토, 지역 개발 및 공간 활용 계획 수립을 위한 기초자료로 활용할 수 있습니다.또한 주민과 민간에서는 지역 내 공공자산 현황을 파악하고, 도시계획, 부동산·공간정보 분석, 공공시설 입지 검토, 정책 연구 등 다양한 분야에 활용할 수 있습니다. 이를 통해 공유재산 관리의 투명성을 높이고, 공공자산의 효율적 활용과 지역사회 발전에 기여할 수 있습니다.
