summary_user: 방송통신위원회 결정문을 건별 목록으로 담으며, 각 항목은 안건명·안건번호·의결일자·결정문일련번호와 상세 링크로 구성되고 범위는 전국이다. 방송·통신 사업자 관련 법령 위반 사건이 언제 어떤 안건으로 의결됐는지 확인하려는 사업자·법률 실무자·분석가가 기간별 결정 이력을 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 안건명·안건번호 같은 이름 매핑으로만 잇고, 본문은 결정문일련번호와 상세 링크로 결정문 본문 조회에 넘겨 본다.
description_portal: 법제처 국가법령정보센터에서 제공하는 방송통신위원회 결정문 데이터로, 위원회 결정문에 대한 목록 정보를 조회하는 서비스입니다. 각 목록 항목은 사건번호, 심의일자, 사업자명, 조치유형, 법령위반 내역, 결정사유 등으로 구성되어 있으며, 방송 및 통신 분야의 법령 위반 사례에 대한 조치 현황을 확인할 수 있습니다. 사용자는 특정 조건을 입력하여 기간별 또는 사업자별 사건 현황을 조회할 수 있으며, 목록은 정렬 및 페이지 구분이 가능한 구조로 제공되며, 심의 및 행정조치 이력을 체계적으로 분석하는 데 활용할 수 있습니다.
