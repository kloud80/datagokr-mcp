status: active
summary_user: 공정거래위원회 가맹정보 가운데 연도·업종(중분류명)별로 가맹본부 수, 가맹점 수, 평균 가맹금·교육비·기타비용과 합계 금액을 담은 전국 단위 집계 데이터입니다. 가맹 창업을 준비하는 사람이 '치킨이나 커피 업종으로 창업하면 평균 초기 비용이 얼마나 드나'를 업종끼리 비교하거나, 분석가가 연도별 창업비용 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 기관의 다른 가맹정보 데이터와는 연도와 업종명을 맞춰 붙이는 방식으로만 연결한다.
limits: 업종별 평균을 낸 집계이므로 개별 가맹본부나 브랜드의 창업비용은 알 수 없고, 사업자등록번호 같은 사업자 식별자로 연결할 수 없다. 조회는 연도와 업종대분류코드를 넣어야 하며, 결과는 업종 이름으로만 다른 데이터와 맞춘다.
