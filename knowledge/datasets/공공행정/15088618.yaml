summary_user: 한국동서발전이 직접 또는 간접으로 참여하는 특수목적법인(SPC) 발전사업을 법인 한 곳당 한 행으로 담은 파일로, 법인명·구분·설립일·사업자번호·사업부지·설비용량·연료를 담는다(전국 범위, 비공간, 약 2KB 규모의 작은 CSV). 분석가나 연구자가 '동서발전이 참여한 SPC 가운데 신재생과 화석연료 사업은 각각 어디에 있고 설비 규모는 얼마인가'를 확인하는 데 쓴다. 사업자번호(bizno)를 키로 국세청 사업자 상태 조회나 기업 재무·공시 데이터와 이어 쓴다.
description_portal: 한국동서발전의 SPC(특수목적법인) 사업현황 정보 데이터입니다. 데이터는 특수목적법인(SPC)명, 구분코드, 구분명, 설립일, 사업자번호, 사업부지, 설비용량, 연료 등의 항목으로 구성되어 있습니다. 본 데이터는 동서발전이 직접 또는 간접적으로 참여하는 민간협력형 발전사업 구조를 이해하는 데 유용하며, 각 SPC의 설립 시기, 사업범위, 발전설비 규모 및 사용 연료 등의 세부 정보가 포함되어 있습니다. 학계 및 연구기관에서는 민간협력(PPP) 발전사업 모델 분석, 설비용량 대비 발전효율 추적, 신재생에너지와 화석연료 간 SPC 구성 비교 연구, 사업 구조에 따른 에너지전환 정책 분석 등에 본 데이터를 활용할 수 있습니다.
