description_portal: 부산광역시 동구 계약정보시스템의 계약법규정보 메뉴에 등록된 파일에 대한 정보를 제공합니다. 본 데이터의 칼럼은 제목, 업로드파일명, 등록일자, 수정일자, 삭제여부로 구성되어 있으며, 계약업무와 관련된 법규 목록을 체계적으로 확인할 수 있습니다. 현재 게시 중인 데이터는 부산광역시 동구 계약정보시스템(contract.bsdonggu.go.kr) 내 계약법규 메뉴에서 열람 가능하며, ‘지방자치단체 입찰 및 계약집행기준’(행정안전부 예규) 등 계약업무 수행 시 참고가 필요한 규정 파일들이 포함되어 있습니다. 다만 게시된 파일은 최신 법령과 상이할 수 있으므로 반드시 최신 법령 및 예규를 함께 확인하여 활용하시기 바랍니다.
