description_portal: 1. 하자보증보험증권이란 분양을 목적으로 하는 공동주택을 건축한 사업주체가 공동주택의 하자보수를 위하여 일정금액을 증권의 형식으로 예치하는 것을 말하며, 사업주체는 사용검사(승인) 신청 시 예치증서를 사용검사(승인)권자제출하여야 합니다.2.  하자보수보증금은 공동주택관리법 시행령 43조(하자보수보증금의 용도)으로 정하는 용도로만 사용하여야 하며, 의무관리대상 공동주택의 경우에는 하자보수보증금의 사용 후 30일 이내에 그 사용내역을 시장·군수·구청장에게 신고하여야 합니다. 3. 하자보수보증증권은 사업주체의 하자보수 책임이 종료되는 때까지 금융기관에 예치하여야 하며, 사업주체의 기간별 하자보수 책임이 종료되는 때에는 순착적으로 사업주체에게 반환하여햐 합니다. 다문 이미 사용한 하자보수보증금은 반환하지 아니합니다.4. 공동주택관리법 제38조(하자보수보증금의 예치 및 사용) 및 같은 법 시행령 제41조(하자보수보증금의 예치 및 보관)에 따른 이행(하자)보증보험증권 예치현황(대지위치, 연면적, 세대수, 사용승인일, 보증사) 등의 사상구 하자보증보험증권 예치 현황을 제공합니다.자세한 사항은 사상구 홈페이에서 확인하시기 바랍니다.https://www.sasang.go.kr/index.sasang?menuCd=DOM_000000104001003009
