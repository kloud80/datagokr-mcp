summary_user: 서울시 일반게임제공업(성인게임장·오락실 등) 업소를 한 곳씩 담은 인허가 원장으로, 인허가·취소 일자, 영업상태, 휴업 기간, 소재지 지번·도로명 주소, 중부원점TM 좌표, 시설 면적·층수·조명·음향·비상구 같은 시설 정보를 담는다. 상권 분석가나 창업 예정자가 특정 구·동에서 영업 중이거나 폐업한 게임장이 얼마나 되는지, 언제 생기고 없어졌는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 원천(LOCALDATA 지방행정 인허가)의 다른 업종 데이터와는 관리번호(MGTNO)·주소·업소명으로 맞춰 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 인증키가 따로 필요하며 공공데이터포털 활용신청과는 별개다. 다른 데이터와 바로 붙는 공통 코드가 없어 주소·이름 매핑에 의존해야 한다. 좌표는 중부원점TM(EPSG:2097)이므로 위경도로 쓰려면 좌표 변환이 필요하다.
