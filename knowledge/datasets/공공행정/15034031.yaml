summary_user: 부산광역시 관내 16개 구군청과 행정복지센터, 119안전센터·치안센터·도서관·세무서·우체국·법원·검찰청 등 행정·공공기관을 기관 한 곳당 한 건으로 담으며, 기관명·도로명 주소·전화번호·구군과 위경도 좌표를 제공한다. 부산 시민이나 생활지도 서비스 개발자가 '우리 구에서 가장 가까운 행정복지센터나 세무서는 어디이고 전화번호는 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 구군명·기관명 같은 이름 매핑이나 위경도 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 부산광역시 관내에 운영중인 행정기관 현황 데이터를 개방합니다.개방되는 데이터에는 16개 구군, 206개 행정복지센터, 119안전센터, 치안센터, 도서관, 소방서, 세무서, 우체국, 노동청, 선거관리위원회, 근로복지공단, 식품의약품 안전청, 국민건강보험공단, 국제교류재단, 부산의료원, 부산시의회, 안전보건공단, 농산물품질관리원, 국가기록원 역사기록관, 부산지방법원, 부산고등법원, 부산지방검찰청, 부산고등검찰청 등의 정보를 포함하고 있습니다.행정공공기관명, 도로명 주소, 전화번호에 대한 자료를 제공합니다.
