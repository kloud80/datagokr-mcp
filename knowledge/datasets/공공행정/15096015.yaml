summary_user: 계룡시 관내 시장·유통점에서 조사한 농산물·축산물·수산물의 품목별 판매 가격을 조사 연월·조사 시기 단위로 담은 시군구 범위의 API로, 품목명·품목 기준·계량단위·조사 개수·가격이 함께 나온다. 계룡시 주민이나 지역 상인, 물가 분석가가 '이번 달 계룡시에서 쌀·돼지고기·고등어 같은 품목이 얼마에 팔렸고 이전 조사보다 올랐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 물가 데이터와는 품목명과 조사 연월(EXAMIN_YM)을 이름 맞춤으로만 이어 쓴다.
limits: 품목코드나 행정코드 같은 표준 조인 키가 없어 타 지자체·전국 농축수산물 가격 자료와 비교하려면 품목명·단위를 직접 맞춰야 한다. 범위는 계룡시 한 곳이며 개별 점포 위치 정보는 담지 않는다. 포털 설명의 '2021년 9월 1일자 기준'은 수집 기준일 표기이므로 응답의 최신 조사 연월은 실제 호출로 확인해야 한다.
