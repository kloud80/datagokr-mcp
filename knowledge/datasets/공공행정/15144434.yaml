description_portal: '[SGIS 오픈 플랫폼]"통계갤러리"서비스의 우수디지털컨텐츠 정보를 담고 있습니다. 데이터항목에는 공모전년도, 수상구분, 제목, 내용, 제작자, 썸네일이미지명, 동영상파일명, 공개여부, 등록일시를 포함하고 있습니다.[용어설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 통계갤러리사용자가 SGIS를 이용해서 검색한 다양한 통계정보 또는 사용자가 생성한 통계정보를 공유하며 함께 소통할 수 있는 서비스입니다.4. 우수디지털콘텐츠SGIS 활용 우수 디지털 콘텐츠 공모전 수상작을 만나볼 수 있는 서비스입니다.'
