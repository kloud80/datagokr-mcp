summary_user: 충주시 전통시장에 입점한 점포를 한 건씩 담은 원천 자료로, 시장명·점포명·대표 상품과 가격, 배달·포장 여부, 영업시간, 주소와 좌표를 담는다. 시장 방문객이나 플랫폼 개발자가 '충주 어느 시장에서 배달·포장이 되는 점포가 어디인가'를 찾거나, 분석가가 시장별 취급 품목 구성을 살펴볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시장명·점포명 같은 이름 매칭이나 주소·좌표(road_nm_addr, lat/lng) 기준의 공간 결합으로 이어 붙이며, 지방행정 인허가(LOCALDATA) 점포 원장과 대조하는 데 쓴다.
description_portal: '본 데이터는 충청북도 충주시 전통시장에 입점한 점포의 상품판매 현황과 운영 특성을 기록한 자료로, 시장 활성화 및 상권 분석을 위한 기초 데이터로 활용된다.주요 항목은 다음과 같다:점포명: 전통시장 내 개별 점포의 명칭점포 업종: 식료품, 의류, 잡화 등 점포의 주요 영업 분야배달 여부: 해당 점포에서 배달 서비스를 제공하는지 여부포장 여부: 상품 포장 서비스 제공 여부상품정보: 대표 상품명 또는 주요 취급 품목 정보활용 방안으로는 다음과 같은 항목이 있다:🔸 시장 방문객의 소비 편의성 향상🔸 비대면 소비(배달·포장) 가능 점포 식별🔸 시장별 특화상품 육성 및 마케팅 자료 활용🔸 충주시 전통시장 온라인 플랫폼 구축 기초자료※ 점포 정보는 시장 상인의 자율신고 또는 현장조사 기준으로 수집되며, 실제 운영 현황과 일치하지 않을 수 있으므로 정기적인 갱신이 필요함.'
