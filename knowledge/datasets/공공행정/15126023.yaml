summary_user: 국회 역대 대수별 의안 처리 현황을 집계한 통계로, 제출(접수) 건수와 가결·부결·폐기·철회·반려·보류·임기만료폐기 같은 처리 결과별 건수를 전국 단위로 담는다. 분석가나 기자가 '역대 국회 가운데 임기만료로 폐기된 의안 비율이 가장 높은 대수는 언제인가'처럼 대수 간 입법 성과를 비교하는 데 쓴다. 전역 조인 키는 없으므로, 대수 코드(UNIT_CD)나 대수 이름을 맞춰 같은 국회사무처의 의안·회의록 데이터와 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
