description_portal: 해양수산연수원이 운영한 선원교육의 과정별 수료 인원 통계를 성별 기준으로 집계한 데이터입니다. 기초안전교육, 명덕센터·신승센터 교육, 여객선교육, 여객선 상급 자폐 교육 등 2021~2024년까지 연도별 수료자 수가 교육과정 단위로 정리되어 있으며, 이는 성별 교육 참여 현황 분석 및 교육정책 기획의 기초자료로 활용이 가능하고 교육의 성별 수요 파악과 예측 등에 효과적으로 활용될 수 있습니다. 또한 특정 교육과정에 대한 성별 비중 분석 등에 유용하게 쓰일 수 있습니다.*교육과정명, 연도, 남,여에 대한 데이터를 포함하고 있습니다.
