description_portal: '광주광역시 관내 전체 소방시설 업체 및 소방시설관리업체 현황입니다. 5개 관할소방서별 소방시설설계업, 소방시설공사업, 소방시설감리업, 소방시설관리업 등의 현황을 제공합니다.1. “소방시설업”이란 다음 각 목의 영업을 말한다.가. 소방시설설계업: 소방시설공사에 기본이 되는 공사계획, 설계도면, 설계 설명서, 기술계산서 및 이와 관련된 서류(이하 “설계도서”라 한다)를 작성(이하 “설계”라 한다)하는 영업나. 소방시설공사업: 설계도서에 따라 소방시설을 신설, 증설, 개설, 이전 및 정비(이하 “시공”이라 한다)하는 영업다. 소방공사감리업: 소방시설공사에 관한 발주자의 권한을 대행하여 소방시설공사가 설계도서와 관계 법령에 따라 적법하게 시공되는지를 확인하고, 품질ㆍ시공 관리에 대한 기술지도를 하는(이하 “감리”라 한다) 영업라. 방염처리업: 「소방시설 설치 및 관리에 관한 법률」 제20조제1항에 따른 방염대상물품에 대하여 방염처리(이하 “방염”이라 한다)하는 영업2. “소방시설업자”란 소방시설업을 경영하기 위하여 제4조에 따라 소방시설업을 등록한 자를 말한다.3. 소방시설관리업자: 소방시설등의 점검 및 관리를 업으로 하려는 자 또는 「화재의 예방 및 안전관리에 관한 법률」 제25조에 따른 소방안전관리업무의 대행을 하려는 자는 대통령령으로 정하는 업종별로 시ㆍ도지사에게 소방시설관리업(이하 “관리업”이라 한다) 등록한 자'
