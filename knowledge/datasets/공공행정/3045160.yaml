summary_user: 안양시가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 목록으로, 업소명·행정동·도로명주소·연락처와 대표 품목 두 개의 가격을 포함하며 9,380바이트 규모의 CSV 파일이다. 시민이 내 동네(행정동)에서 저렴한 가격의 식당·업소를 찾거나, 분석가가 안양시 행정동별 착한가격업소 분포와 품목 가격 수준을 비교하는 데 쓴다. 전역 조인 키나 코드 필드가 없어 다른 데이터와는 행정동 이름이나 도로명주소를 문자열로 맞추거나 주소를 좌표로 바꿔 상권·인허가(LOCALDATA) 자료와 이어 쓴다.
