summary_user: 의정부시 빅데이터 공유활용시스템에서 수집한 전국 행정동 코드를 읍면동 단위 행으로 담은 코드표 파일로, 행정동코드와 법정동코드, 시도·시군구·행정동·법정동 이름, 행정기관생성일, 영문 행정동명을 함께 싣는다. 분석가가 주소나 법정동 기준으로 쌓인 데이터를 행정동 단위 인구·통계와 맞춰 보려 할 때 "이 법정동은 어느 행정동에 속하나"를 확인하는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 기준 데이터(토지·건축물·주소 등)와 잇고, 행정동코드로 행정동 단위 통계와 연결한다.
