description_portal: '의정부시에서 자체 운영중인 빅데이터 공유 활용시스템 내에서 수집한 전국 행정동 코드 데이터(행정동코드, 법정동코드,시도명,시군구명,행정구역명,행정동명 등) 입니다.행정동 코드는 대한민국의 행정동(行政洞) 단위를 구분하기 위해 사용하는 표준화된 숫자 코드입니다. 이 코드는 통계청과 행정안전부 등에서 지역 데이터를 정확하게 관리하고 제공하기 위해 사용됩니다.행정동 코드 앞 5자리: 시군구 코드 (예: 11110 → 서울 종로구), 다음 3자리: 행정동 코드 (예: 105 → 청운효자동), 마지막 2자리: 리 단위 (대부분 00으로 끝남)행정동 코드는 주민등록지 관리, 공공 데이터 (통계청 인구 동향), 주소 정제 및 행정 서비스 제공, 지리정보시스템(GIS) 등에 활용됩니다.'
