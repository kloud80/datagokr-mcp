summary_user: 부산교통공사가 체결한 공사·용역·물품 계약을 계약 건별로 담으며, 계약명·예정금액·실제계약금액·계약률·계약일자·착공/준공예정일자·업체명·계약방법과 선금·기성금·노무비·준공금 지급 내역까지 포함한다. 분석가나 사업자가 '부산교통공사의 수의계약 비중은 얼마이고, 특정 업체가 받은 계약과 대금 지급은 어떻게 진행됐는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·계약명 같은 이름 매칭이나 같은 기관 자료로만 이어 붙인다.
description_portal: 부산교통공사가 체결한 공사, 용역, 물품 등의 계약정보를 제공하는 서비스입니다.본 서비스는 계약설명, 계약예정금액, 실제계약금액, 계약일자, 착공일자, 준공예정일자, 계약방법, 선금 지급일자 등의 정보를 제공합니다.해당 자료는 연도별·분류별(공사, 용역, 물품) 분석을 통해 집행 규모, 계약 유형, 지급 패턴 등 다양한 행정적·경영적 분석이 가능하며, 정책 수립, 예산 편성, 계약 관리 개선 등 다방면에 활용될 수 있으며, 재정 집행 현황을 확인할 수 있어 계약 투명성 제고와 공공사업 관리 효율화에 기여합니다.
