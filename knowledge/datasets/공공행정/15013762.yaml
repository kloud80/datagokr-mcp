summary_user: 경상북도 영주시 시청과 읍면동 행정복지센터를 기관 한 곳당 한 행으로 담은 소규모 목록 파일(csv, 약 2.5KB)로, 기관명·도로명주소·지번주소·대표전화·팩스번호와 데이터기준일자를 담는다. 영주시 주민이나 민원인이 '우리 동네 행정복지센터가 어디에 있고 전화번호가 무엇인가'를 확인하거나, 분석가가 시 관할 행정기관의 공간 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명이나 주소 문자열을 맞춰 연결해야 하며, 무인민원발급기·공공시설 개방 같은 생활 행정시설 표준데이터와 주소 기준으로 나란히 놓고 쓴다.
description_portal: 시청 및 읍면동 행정복지센터 현황은 경상북도 영주시 관할 내 행정기관의 위치 및 기본 연락처 정보를 체계적으로 제공하기 위해 구축된 공공데이터입니다.자세한 정보는 영주시 대표 홈페이지(https://www.yeongju.go.kr/) 및 읍면동 홈페이지를 통해 확인 가능합니다.본 데이터는 기관명, 도로명 주소, 지번 주소, 대표 전화번호 등의 항목으로 구성되어 있습니다.이를 통해 각 행정기관의 소재지 및 주요 연락수단을 명확히 파악할 수 있으며, 주민 접근성과 행정 연계성 향상을 위한 기초자료로 활용 가능합니다.아울러 지역 내 공공서비스 제공 기관의 공간 분포를 이해하는 등 실무적 활용 가능성이 높은 기반정보입니다.
