summary_user: 2023년 센서스 가구 통계를 전국 시군구 단위로 집계한 파일로, 시도·시군구별로 재정의한 세대유형과 가구원수에 따른 가구수를 담는다. 지자체 정책 담당자나 분석가가 "우리 시군구에 1인 가구나 특정 세대유형 가구가 얼마나 되는가"를 비교할 때 쓴다. 전역 조인 키(행정구역 코드)가 없어서, 다른 시군구 통계나 SGIS 행정구역 경계와 붙이려면 시도명·시군구명을 이름으로 맞추거나 코드로 매핑해야 한다.
limits: 행정구역 코드 컬럼이 없어 이름 매칭에 의존하므로, 같은 이름의 시군구나 행정구역 개편 지역은 연결할 때 주의해야 한다. 시군구보다 작은 단위(읍면동·집계구)는 분석할 수 없다.
