summary_user: 삼척시에 시민 신고·현장 단속·CCTV 등으로 접수된 불법 주정차 신고를 건별로 담은 파일로, 신고일시·위반구분·위반장소·과태료 부과 일자·과태료 금액이 들어 있다(CSV 약 98만 바이트). 삼척시 안에서 불법 주정차가 반복되는 장소나 위반 유형별 과태료 부과 현황을 알고 싶은 교통정책 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 위반장소 이름을 주소·지명으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
