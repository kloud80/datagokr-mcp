description_portal: '한국남동발전은 투명성과 책임성을 바탕으로 운영되고 있으며 이를 위해 "옴부즈만 제도"를 운영하고 있습니다.이 제도는 회사 내부에서 발생하는 다양한 문제들을 공정하게 조사하여 해결하는 역할을 수행하며 다음과 같은 특징과 목적을 가지고 있습니다.1. 독립성 : 회사의 경영진으로부터 독립적인 지위를 보장받아 객관적이고 공정한 판단을 내립니다.2. 투명성 : 모든 절차와 결과를 공개함으로써 신뢰성을 확보합니다.3. 문제 예방 및 개선 : 발견된 문제를 단순히 처리하는 것을 넘어 근본 원인을 분석하고 재발 방지를 위한 대책을 마련합니다.해당 데이터를 통해 우리회사에 대한 옴부즈만 활동 현황과 실적을 확인 할 수 있습니다.'
