description_portal: '- 전라남도 시군별 전세사기 발생건수 및 피해주택 소재지 현황에 관한 데이터를 제공합니다.- 2023년 6월 부터  2026년 3월 까지의 데이터를 제공합니다. - 전세사기특별법 : 전세 사기 피해 지원을 위한 특별법으로 2023년 5월 25일 국회 본회의를 통과해 같은 해 6월 1일부터 시행됐습니다. 한시법으로 제정돼 시행 후 2년간 적용됩니다. 법안 핵심은 전세 사기 피해자들에게 금융 지원을 확대하고, 정부가 경·공매 대행 서비스를 제공하는 것입니다. 법안에는 피해 보증금 보전과 관련해 정부가 전세 사기 피해자들에게 최우선 변제금만큼 최장 10년간 무이자 대출해주는 내용이 담겼습니다.'
