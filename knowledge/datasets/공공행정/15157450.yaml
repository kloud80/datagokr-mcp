summary_user: 김해시 버스정류장별 하루 이용객수를 이용일자·정류장코드·정류장명과 함께 담은 집계 파일이며, 교통카드 이용 기준으로 집계한다. 김해시 교통 담당자나 분석가가 어느 정류장이 언제 붐비는지, 노선 조정·정류장 시설 개선이 필요한 곳은 어디인지 살피는 데 쓴다. 전역 조인 키는 없어 김해시가 따로 제공하는 정류장 위치·노선 자료와는 정류장코드나 정류장명을 맞춰 연결해야 한다.
limits: 교통카드 기준 집계라 현금 승차는 빠지고 단말기 오류나 누락이 있을 수 있어 실제 이용객 수와 다를 수 있으며, 참고용 통계로만 써야 한다. 정류장 좌표나 노선 정보는 없고, 범위는 김해시 한 곳에 한정된다.
