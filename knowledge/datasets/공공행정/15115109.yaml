summary_user: 서울 강남구의 PC방 등 인터넷컴퓨터게임시설제공업 업소를 한 업소당 한 행으로 담은 인허가 원장으로, 인허가·취소·휴업·폐업 일자, 영업상태, 도로명·지번 주소, 좌표, 시설면적·층수 같은 시설 항목을 포함한다. 강남구에서 PC방이 언제 얼마나 문을 열고 닫았는지, 특정 상권에 지금 영업 중인 PC방이 몇 곳인지를 확인하려는 창업자나 상권 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 잇고, 같은 원천인 LOCALDATA 인허가 자료와 함께 행정동·상권별 점포 이력 분석에 쓴다.
description_portal: 서울시 강남구 인터넷컴퓨터게임시설제공업 인허가 정보(https://data.seoul.go.kr/dataList/OA-16789/S/1/datasetView.do)강남구의 PC방과 같이 컴퓨터 등 게임물을 이용하는데 필요한 기자재를 갖추거나 그 밖의 정보제공물을 이용할 수 있도록 제공하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다.데이터 활용시 참고하시기 바랍니다.
