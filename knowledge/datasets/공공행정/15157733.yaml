summary_user: 한국자산관리공사가 국가보훈부로부터 위탁받아 관리하는 친일귀속재산을 물건 한 건 단위로 담으며, 전국 범위로 지번·도로명 주소, 지목, 토지·건물 면적, 용도 분류, 관리상태(사용 중·매각 검토·대부 검토 등)를 제공한다. 특정 시도에 있는 친일귀속재산 가운데 매각이나 대부 입찰 검토 대상인 땅이 어디에 있는지 확인하려는 국민·사업자, 그리고 귀속재산 활용 수요를 분석하는 사람이 쓴다. 전역 조인 키는 실측에서 확인되지 않았지만, 지번PNU코드(ltnoPnu)와 도로명PNU코드를 매개로 국유재산·토지 정보와 주소 기반으로 이어 쓴다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지를 통해 정보 공개중인 정부재산 목록 중 한국자산관리공사가 위탁받아 관리중인 친일귀속재산 정보를 조회하는 서비스입니다.한국자산관리공사는 국가보훈부로부터 [독립유공자 예우에 관한 법률]에 의한 순국선열 ∙ 애국지사 사업기금에 속한 친일귀속재산을 위탁받아 관리하고 있습니다. 한국자산관리공사에서는 보훈부 친일귀속재산에 대한 상세정보를 국민에게 공개함으로써, 정보 접근성을 높이고 수요를 파악하여 활용가치가 높은 친일 귀속재산을 발굴하기위해 정보공개를 하고 있습니다. 필수 입력 조건 : 소재지시도명(sdnm)'
