description_portal: 역대대통령별 대통령기관 정보를 제공“대통령비서실”은 1948년 7월 24일 출범한 이승만 대통령의 "대통령비서관실"이 효시입니다.1960년 8월 25일 제정된 「대통령비서관 직제」(국무원령 제66호)에 의해 “대통령비서실”이란 명칭이 처음 사용되었습니다. 이후 2008년 2월 29일까지 존속했으며 17대 정부 출범 후 「대통령실과 그 소속기관 직제」에 의해 "대통령실"로 명칭이 변경되었습니다. 2013년 18대 정부가 출범하고 그해 2월 23일에 「대통령비서실직제」가 제정되면서 “대통령비서실”이라는 명칭이 다시 사용되었습니다.
