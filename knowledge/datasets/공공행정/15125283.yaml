summary_user: 중앙토지수용위원회가 의결한 토지수용 재결 사건을 결정문 한 건 단위로 담은 목록 데이터로, 전국을 대상으로 하며 결정문 일련번호·제목·상세 링크를 제공한다. 토지 소유자나 사업시행자, 보상 실무자가 특정 사업지구나 사업시행자와 관련해 어떤 수용 재결이 있었는지 찾아볼 때 쓴다. 실측 컬럼에는 다른 데이터와 맞물리는 전역 조인 키가 없으며, 결정문 일련번호(결정문일련번호)와 상세 링크로 같은 기관의 결정문 본문 조회와 이어 쓰고, 그 밖의 데이터와는 사업지구명·사업시행자 이름을 맞춰서 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 중앙토지수용위원회 결정문 데이터로, 위원회 결정문에 대한 목록 정보를 조회하는 서비스입니다. 본 데이터는 중앙토지수용위원회에서 의결된 토지수용 관련 재결 사건 목록을 조회할 수 있도록 구성되어있고,  각 결정문은 개별 사건의 고유 식별번호, 재결일자, 사업지구명, 사업시행자, 수용 또는 사용의 목적, 결정구분 및 보상 유형 등의 정보로 구성되어 있습니다. 사용자는 재결 목록을 통해 기간별, 지구별 또는 사업시행자별 사건 현황을 확인할 수 있으며, 본 데이터를 활용하여 토지수용 및 보상 관련 행정절차의 통계적 흐름을 파악할 수 있습니다.
