description_portal: 서울시 동물용의약품도매상 인허가 정보는 서울시에 인허가된 동물용 의약품 도매업소의 행정 이력과 사업장 현황을 파악할 수 있도록 구성된 공공데이터입니다. 이 데이터에는 인허가일자와 인허가취소일자, 폐업일자, 휴업 시작·종료일자, 재개업일자, 영업상태코드 및 영업상태명, 상세영업상태코드·명 등이 포함되어 있어 각 도매상의 인허가 내역과 영업 상태 변동 이력을 시간의 흐름에 따라 확인할 수 있습니다. 또한 사업장명, 전화번호, 소재지면적, 지번주소와 도로명주소, 우편번호, 좌표정보(X·Y) 등을 통해 사업장의 위치, 규모, 접근성, 연락처 등 기본적인 공간·연락 정보를 파악할 수 있습니다. 축산업무구분명, 축산물가공업구분명, 축산일련번호, 권리주체일련번호 등의 항목은 해당 업소가 축산·축산물 관련 행정 체계 내에서 어떤 업무 유형과 가공업 구분으로 분류되는지, 그리고 권리 관계를 어떻게 식별하는지를 보여주는 항목입니다. 총인원 항목은 도매상에 종사하는 인력 규모를 나타내어 인력 운영 현황을 파악하는 데 활용될 수 있습니다. 아울러 최종수정일자, 데이터갱신구분, 데이터갱신일자 등의 정보를 통해 데이터의 최신성과 관리 이력을 확인할 수 있어, 이 인허가 정보는 서울시 내 동물용의약품도매상의 분포, 규모, 영업 상태 및 인력 현황을 분석하고 동물 방역, 축산, 동물용 의약품 유통 관리 및 관련 정책 수립에 활용하기에 적합한 기초 자료입니다.
