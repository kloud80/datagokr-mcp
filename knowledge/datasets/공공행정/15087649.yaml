summary_user: 해양환경공단의 지사·사업소 등 소속기관별로 명칭, 우편번호, 주소, 연락처, 팩스번호를 한 행씩 담은 전국 범위의 소규모 목록 파일(csv 약 2.7KB)이다. 해양오염 신고나 업무 문의를 위해 우리 지역을 맡는 해양환경공단 지사의 위치와 전화번호를 찾는 국민·사업자, 또는 공단 조직의 지역 분포를 파악하려는 분석가가 쓴다. 소속기관명(koem_branch)을 키로 공단의 다른 기관별 자료와 잇고, 주소를 지오코딩해 지역 행정구역·해양 관련 시설 자료와 겹쳐 본다.
description_portal: 해양환경공단의 지사, 사업소 등 소속기관의 주소 현황 정보를 제공합니다. 본 데이터는 각 기관의 명칭, 주소, 전화번호, 팩스번호, 등의 정보를 포함하고 있으며, 기관별 업무 관할 구역 및 주요 기능에 대한 간략한 설명도 포함될 수 있습니다. 공단의 조직 체계를 이해하고 지역별 해양환경 관리 체계 접근에 활용할 수 있는 기초자료로 제공됩니다. 데이터는 행정구역, 기관유형, 지역권역 등으로 분류되며 해당 소속기관의 정보들을 제공할 수 있습니다, 공공기관, 연구기관, 일반국민 등이 해양환경공단 관련 업무 및 서비스 이용 시 참고자료로 활용됩니다.
