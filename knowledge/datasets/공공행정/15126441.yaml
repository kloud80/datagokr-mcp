summary_user: 경기도 주민등록인구통계를 바탕으로 기준연월별·시군·행정동(읍면동) 단위 출생자수를 남녀로 나눠 담은 집계 데이터다. 경기도 안에서 어느 읍면동의 출생아 수가 늘거나 줄었는지, 출산 지원 정책 뒤 지역별 출생 추이가 어떻게 달라졌는지 보려는 분석가·지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드·행정동코드나 시군명·행정동명을 매핑해 연결한다.
description_portal: 이 데이터는 경기도 주민등록인구통계에 근거한 읍면동별 출생자수 현황을 담고 있으며, 특정 기간 동안 각 시군·행정동 단위에서 발생한 출생 건수를 남녀 구분과 함께 제시합니다. 주요 항목에는 기준연월, 시군코드, 행정동코드, 시군명, 행정동명, 총인구수, 남성인구수, 여성인구수, 동단위분석시작연월·종료연월, 동단위분석시작년도·종료년도, 마트완료여부, 생성일자가 포함됩니다. 이를 통해 지역별 출산 현황을 세밀하게 분석할 수 있으며, 시군·읍면동 단위에서 인구 구조의 변화를 파악하거나 출산 정책의 효과성을 평가하는 데 활용할 수 있습니다.
