description_portal: 이 CSV 데이터는 대전광역시 서구 관내에 설치된 자전거보관소 및 공기주입기 현황을 체계적으로 정리한 시설 관리 행정데이터입니다. ‘소재지지번주소’는 각 자전거보관소의 구체적인 위치 정보를 제공하며, ‘위도’와 ‘경도’는 GIS(지리정보시스템) 기반의 공간좌표로 활용되어 지도 시각화나 공간분석에 직접 적용할 수 있습니다. ‘보관대수’는 해당 시설이 수용할 수 있는 자전거의 수를 의미하고, ‘설치년도’는 시설의 구축 시점을 나타냅니다. ‘설치형태’는 설치 물리적 구조를 구분하며, ‘차양막설치여부’는 날씨로부터 자전거를 보호하는 시설 유무를 나타냅니다.‘공기주입기비치여부’와 ‘공기주입기유형’은 이용자 편의시설의 제공 수준을 보여주고, ‘수리대설치여부’는 간단한 정비 지원이 가능한지 여부를 나타냅니다. 또한 ‘관리기관명’과 ‘관리기관전화번호’는 시설 유지보수 및 민원응대를 위한 행정 관리정보이며, ‘데이터기준일자’는 자료의 최신성을 확인할 수 있는 기준 시점을 제공합니다. 이 데이터는 서구 지역의 자전거 이용환경 개선, 공공자전거 인프라 확충, 시설 접근성 평가 등 교통복지 정책 수립을 위한 근거자료로 활용될 수 있습니다.
