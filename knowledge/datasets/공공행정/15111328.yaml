summary_user: 법제처 지능형 법령정보 지식베이스에 등록된 법령용어를 용어 한 건 단위로 담은 목록으로, 용어명과 동음이의어 존재 여부, 용어 간·조문 간 관계 링크를 XML로 제공하며 범위는 전국·비공간입니다. 법령 문장에 나온 용어가 어떤 뜻이고 어느 조문과 연결되는지, 비슷한 용어와 어떻게 다른지 확인하려는 법제 실무자·교육자·일반 국민이 씁니다. 실측 컬럼에서 다른 데이터와 공통으로 쓸 전역 조인 키는 찾지 못했으므로, 법령용어명으로 이름을 맞추거나 응답 안의 용어간·조문간 관계 링크를 따라가 다른 법제처 데이터와 이어 씁니다.
description_portal: 지능형 법령정보 지식베이스 법령용어 목록을 XML 데이터로 제공 받으실 수 있는 법령용어 정보 목록 조회 서비스입니다. 개별 법령용어에 대해 명확한 정의, 출처 법령, 관련 조문, 적용 사례 등을 구조적으로 제공하며, 법률 문장 내 용어의 의미를 정확히 파악할 수 있도록 구성되어 있습니다. 또한, 동일하거나 유사한 의미의 용어들을 비교하여 사용할 수 있도록 연계 정보도 함께 제공합니다. 이용자는 특정 용어의 사용 문맥과 법적 의미를 종합적으로 검토할 수 있으며, 법제 실무나 교육 과정에서 참고 자료로 활용할 수 있습니다. 본 데이터는 법령용어의 표준화와 체계적 관리를 지원하며, 법령 해석의 일관성 확보 및 법률 정보 제공의 기반 자료로서 기능합니다.
