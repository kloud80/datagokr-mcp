summary_user: 전북특별자치도 사회조사 중 주민이 선호하는 교육 방법(학교 정규수업, 방과 후 학교, 개인·그룹 과외, 학원, 방문학습지, 방송·인터넷 강의 등)에 대한 응답 비율을 시군·성별·연령 같은 응답자 구분별로 담은 집계표이며, 약 2KB 크기의 작은 CSV 파일이다. 교육 정책 담당자나 연구자가 '전북 주민은 공교육과 사교육 중 어떤 방식을 더 선호하고, 연령·지역별로 어떻게 다른가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 구분·상세구분에 적힌 시군명이나 인구 특성 이름을 맞춰 붙여야 한다.
description_portal: 전북특별자치도 사회조사의 일환으로, 주민들이 선호하는 교육 방식에 대한 인식과 현황을 담은 설문 결과 데이터입니다. 본 자료는 정규수업, 방과 후 학교, 개인 과외, 학원 수강, 인터넷 강의 등 다양한 공교육 및 사교육 방법에 대한 선호도 응답을 백분율로 제공하며, 시군, 성별, 연령 등 인구통계학적 특성별로 상세하게 분류되어 있습니다. 교육 정책 입안자나 연구자들은 이 데이터를 통해 과거 교육 시장의 수요와 특성을 파악하고, 시대의 흐름에 따른 교육 방법 선호도의 변화를 추적하는 기초 자료로 활용할 수 있어 교육 정책의 장기적인 방향성을 설정하는 데 유용합니다.
