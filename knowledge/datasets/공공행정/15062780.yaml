description_portal: 광주광역시도시공사에 접수된 VOC(Voice of Customer) 민원 현황을 연도별로 정리한 데이터입니다. 본 데이터는 구분(년도), 온라인접수건수, 오프라인접수건수, 개발업무민원건수, 분양민원건수, 경영일반민원건수, 임대민원건수, 시설물민원건수, 기타민원건수, 민원해결건수, 향후정책반영건수, 수용불가건수, 민원취하건수, 데이터기준일자 항목으로 구성되어 있습니다. 다양한 접수 경로와 민원 유형별 건수 정보를 제공하여 민원 유형의 흐름과 행정 대응 상황을 종합적으로 파악할 수 있습니다. 특히 민원해결 및 정책 반영 현황은 고객 의견 수렴과 행정 개선의 실질적인 결과를 확인하는 데 활용됩니다. 해당 데이터는 시민과의 소통 현황, 서비스 만족도 분석, 조직의 민원 대응 역량 평가 등 다양한 목적에 따라 활용될 수 있도록 구성되어 있으며, 명확한 구조와 설명을 통해 사용자 이해도를 높였습니다.
