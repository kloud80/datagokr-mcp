summary_user: 2020년 4월 15일 제21대 국회의원선거의 투표율을 시·도 등 지역별, 성별, 연령대별로 나눈 표본조사 집계표로, 전국 12,536개 투표구 중 1,313개 투표구·선거인 3,903,943명(전체의 10.4%)을 체계적 무작위 추출해 분석했다. 연구자나 정책 담당자가 '20대 여성과 60대 남성의 투표율 차이는 얼마인가', '시·도별 사전투표율은 어떻게 달랐나' 같은 질문에 답하거나 투표율 제고 연구의 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선거의 투표율 분석이나 지역 통계와는 시·도명 같은 이름 매핑으로만 이어 쓴다.
description_portal: '2020년 4월 15일 실시한 제21대 국회의원선거의 투표율을 지역별, 성별, 연령대별로 비교·분석함으로써 각종 선거의 투표율 제고 등 선거관련 제반 연구의 기초적인 자료로 활용하기 위함.※ 조사방법▶ 모집단: 전국 12,536개 투표구 / 선거인 37,643,725명 (증거보전신청 대상 등 39개 선거구 제외) / 사전투표자 11,742,677명 / 국외부재자신고인 145,903명(착오신청자 8명 제외) / 재외선거인 26,048명▶ 표본수: 투표구 1,313개 / 선거인 3,903,943명 (전체 선거인의 10.4%)                ▶ 표본추출방법: 체계적 무작위 추출법※ 조사기간: 2020. 7. 20. ∼ 2020. 8. 7.'
