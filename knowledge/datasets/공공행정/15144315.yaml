summary_user: SGIS 살고싶은 우리동네 서비스에 쓰이는 전국 아파트 단지 목록으로, 단지 하나가 한 행이며 주소·단지명칭·면적·도로명을 담은 개별 위치 단위 원천 파일(CSV 약 4.7MB)이다. 주거지를 고르는 국민이나 지역 분석가가 "이 동네에는 어떤 아파트 단지가 있고 규모는 어느 정도인가"를 확인하거나 단지 분포를 지도에 올릴 때 쓴다. 전역 조인 키가 없어 행정구역 코드로 바로 붙일 수 없고, 주소·도로명을 지오코딩하거나 이름으로 매칭해 집계구·행정구역 경계 등 SGIS 통계지리 자료와 잇는다.
description_portal: '[SGIS 오픈 플랫폼] "살고싶은 우리동네" 서비스의 아파트 데이터입니다.주소,아파트단지명칭,면적, 도로명을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 살고싶은 우리동네  - 통계에 기반하여 사용자 조건에 맞는 주거지역을 추천해 주는 서비스입니다.  - 이용자는 자연, 주택, 지역 인구, 안전, 생활 편의 교통, 교육, 복지 문화 등 7개 카테고리 총 51종의 주거지 선정 조건에 해당하는 추천지역리스트 및 통계정보를 제공'
