description_portal: 인천광역시 외국인 등록별 등록현황 공공데이터는 인천에 거주하는 외국인의 국적별 등록 인구 수를 연도별로 제공하는 자료입니다. 이 데이터는 중국, 베트남, 태국, 우즈베키스탄, 미국 등 다양한 국적의 외국인 수를 포함하고 있습니다. 데이터는 인천광역시 가족다문화과에서 관리하며, 연 1회 갱신됩니다. 등록 기준일은 2026년 6월이며, CSV 형식으로 제공되어 활용이 용이합니다. 이 자료는 인천시의 외국인 인구 변화 추이를 분석하거나 다문화 정책수립, 지역사회 통합 전략 마련 등에 활용될 수 있는 중요한 기초자료입니다. 데이터는 공공데이터포털 또는 인천데이터포털에서 무료로 다운로드할 수 있습니다.
