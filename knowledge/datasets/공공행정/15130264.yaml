description_portal: '[통계지리정보서비스(SGIS)] "고령화 현황보기" 서비스의 노인복지시설에 관한 메타데이터 기준정보입니다.항목코드, 상위항목코드, 항목명, 상위항목명을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 고령화 현황보기  고령화가 점점 심화되는 상황에서 고령화와 관련된 다양한 통계를 제공하고, 이를 통해서 고령화 현황, 고령화추세, 복지시설 등을 파악할 수 있도록 하기 위한 서비스'
