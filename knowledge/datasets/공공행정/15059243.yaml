summary_user: 지방자치단체가 제3자의 채무를 보증한 금액이 재정규모 대비 어느 정도인지를 나타내는 보증채무비율을 전국 자치단체 단위로 담은 집계 지표이며, 필드 구성상 연도(fyr), 광역·기초 자치단체 코드와 이름, 금액 두 개, 비율(rate)로 이루어져 있습니다. 분석가나 주민이 '우리 시·군·구가 떠안을 수 있는 보증채무가 재정규모에 비해 얼마나 큰가, 다른 지자체와 비교하면 어떤가'를 확인하는 데 씁니다. 전역 조인 키는 없으므로 다른 지방재정365 공시 데이터와는 자치단체 코드(laf_cd)·이름과 연도를 맞춰 같은 기관 코드 체계 안에서 연결합니다.
description_portal: 지방자치단체에서 말하는 보증채무비율은 지방자치단체가 제3자의 채무를 보증해 준 금액이 해당 자치단체의 재정규모 대비 어느 정도인지 나태내는 지표입니다. 구체적으로는, 지방자치단체가 직접 부담해야 할 가능성이 있는 보증채무의 총액을 기준으로, 일반회계 및 특별회계 세출예산액 총합이나 지방세 수입 등 재정규모와 비교하여 백분율로 산출합니다.이는 지방자치단체의 재정 건정성과 책임성을 평가하는데 중요한 지표 중 하나로, 일정 비율을 초과할 경우 재정위험이 크다고 판단되어 행정안전부의 재정관리 대상에 포함될 수 있습니다.
