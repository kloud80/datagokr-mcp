summary_user: 선불식할부거래업(상조) 사업자 수를 기준년월·갱신년도·시도·시군구·영업상태별로 묶고 자본금 규모 구간(1억원 이하~20억 초과, 정보없음)별로 나눈 월별 집계 통계로, 범위는 전국이며 시군구 단위까지 내려간다. 소비자단체나 분석가가 "우리 지역 상조업체 중 영업 중인 곳은 몇 개이고 자본금이 작은 업체 비중은 얼마나 되나" 같은 질문이나 자본금 규모별 업체 수 추이를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 지역 이름 매핑이나 같은 기관 데이터로만 연결하며, 개별 상조업체 등록정보와는 사업자 단위가 아니라 집계라 직접 잇지 못한다.
description_portal: 선불식할부거래사업자에 대한 월기준의 갱신년도별, 지역별, 자본금규모별, 영업상태별 사업자 수 통계를 제공하는 서비스 통계표 선불식할부거래업사업자 자본금 규모 업체 현황 - 월별, 지역별 작성목적 월별 자본금규모 통계 추이 작성주기 매월 조사대상 선불식할부거래업사업자
