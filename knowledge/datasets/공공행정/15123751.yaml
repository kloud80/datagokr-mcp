summary_user: 법제처가 정리한 국가 식별 코드표로, 국가별 한 행에 국가 코드·영문 국가명·한글 국가명·지역 구분 코드를 담은 작은 CSV 파일(약 8KB)이다. 행정·통계·시스템 개발 담당자가 해외 자료나 조약·법령 정보에 섞여 있는 국가 표기를 하나의 코드로 맞추려 할 때 "이 국가명은 어떤 코드로 적어야 하나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 다른 데이터와는 국가 코드나 국가명(한글·영문)을 문자열로 대조해 매핑하는 방식으로만 이어 쓴다.
limits: 공식 조인 키가 확인되지 않아 다른 데이터셋과 연결할 때 코드 체계나 국가명 표기가 다르면 직접 대조·보정해야 한다. 지역 구분 코드의 의미를 풀어 주는 코드표가 함께 제공되지 않으므로 해석에 주의한다.
