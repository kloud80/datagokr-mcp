summary_user: 서울시 내 위탁급식영업소(학교·기업·병원 등에 급식을 대신 제공하는 업체)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·폐업일·영업상태와 주소·좌표, 종사자수·시설규모 등을 함께 담는다. 상권 분석가나 급식 관련 사업자가 '어느 자치구에 영업 중인 위탁급식업체가 몰려 있고 최근 폐업이 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 인허가·상권 데이터와는 주소·사업장명 매칭이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)·관리번호로 이어 쓰며, LOCALDATA 인허가 자료와 같은 원천을 공유한다.
description_portal: 서울시 위탁급식영업 인허가 정보는 학교, 기업, 병원, 공공기관 등에서 급식을 대신 제공하는 위탁급식업체의 인허가와 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소일자, 폐업·휴업·재개업일자, 영업상태·상세영업상태를 통해 업체의 행정 이력과 현재 영업 여부를 확인할 수 있습니다. 지번·도로명주소, 우편번호, 좌표, 사업장명, 전화번호는 위치와 기본 정보를 제공하여 권역별 위탁급식업 분포 분석에 유용합니다. 업태구분명과 위생업태명, 영업장주변구분명, 등급구분명, 급수시설구분명은 급식시설의 위생·입지·시설 수준을 파악하는 데 활용됩니다. 종사자수, 총인원, 건물소유구분명, 보증액, 월세액, 시설총규모 등은 인력·경제 규모와 시설 규모를 나타내며, 다중이용업소 여부와 전통업소 관련 정보, 홈페이지 보유 여부는 안전관리, 전통급식업체 식별, 온라인 정보 제공 수준 파악 등에 도움을 줍니다.
