summary_user: 선불식할부거래(상조) 사업자의 등록 변경 내역과 영업소 변경 내역을 사업자별 건 단위로 담으며, 전체 207건에 2010-09-29부터 2020-11-21까지 전국 범위다. 소비자가 가입하려는 상조업체의 등록 상태, 예치기관, 자본금 변경 이력을 확인하는 질문에 쓴다. 법인등록번호(crno)와 사업자등록번호(brno)로 공정위의 다른 등록·지정·공시 데이터와 이어 쓰고, 소재지·영업소 주소(address)로 위치 기반 자료와도 맞출 수 있다.
description_portal: 이  API는 공정거래위원회에서 선불식할부거래사업자의 등록변경현황을 소비자에게 제공하기 위해  구축된  공정거래위원회_선불식할부거래업사업자 등록변경현황 제공 서비스 입니다. 변경일from ~ 변경일to 의 조회 조건으로  선불식할부거래업등록일자, 인허가관리번호, 사업자명, 법인등록번호, 사업자등록번호, 소재지주소, 전화번호, 법인이메일주소, 대표자명, 자본규모금액, 예치기관명, 운영상태코드명, 공제계약은행명, 공제계약기타명, 보험회사명, 채무지급보증기관명, 영업소소재지주소, 자료변경구분코드 등 선불식할부거래업사업자의 등록현황 변경내역 및 영업소 변경내역을 조회 한다.
