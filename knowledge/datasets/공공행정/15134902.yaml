description_portal: 서울특별시 서울기록원 디지털아카이브 규정과 지침 데이터는 서울기록원에서 기록관리 업무 과정에서 생산한 각종 규정과 지침 정보를 체계적으로 제공하는 공공데이터입니다. 본 데이터는 홈페이지 운영 기준, 개인정보 보호 관련 지침, 기록관리 절차 등 기관 운영과 관련된 주요 문서를 포함하고 있으며, 이용자의 권리를 보호하고 기록관리 담당자의 업무 수행을 지원하는 것을 목적으로 합니다. 데이터는 규정과지침일련번호, 개정전등록번호, 규정과지침제목, 담당부서, 등록일 등의 항목으로 구성되어 있어 문서의 이력과 관리 정보를 함께 확인할 수 있습니다. 이를 통해 행정 투명성을 높이고, 기록물 관리의 표준화 및 정책 연구, 공공기관 운영 기준 분석 등 다양한 분야에서 활용 가능한 자료입니다.
