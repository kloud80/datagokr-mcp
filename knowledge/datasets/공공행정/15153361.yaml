description_portal: 세종특별자치시시설관리공단은 시민이 유택동산(자연장지) 이용 현황을 명확하게 확인할 수 있도록 유택동산 접수 이력 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 자연장지 이용과 관련된 접수 기록을 체계적으로 관리하고, 장사서비스의 투명성과 편의성을 높이기 위해 구축되었습니다.■ 데이터 컬럼 구성접수일자 - 유택동산 이용이 접수된 날짜유해구분 - 자연장 대상 유해의 종류 구분 - 시신(만 15세 이상) - 시신(만 14세 이하) - 사산아 - 개장유골 등국내해외구분 - 고인의 국적 또는 등록 구분(국내 / 해외)관내외 구분 - 고인의 주소지 기준 관내 또는 관외 구분성별 - 고인의 성별(남성·여성 등)화장여부 - 자연장 접수 건의 화장 실시 여부■ 데이터 제공 목적유택동산 접수 이력 데이터는 다음과 같은 목적을 위해 제공됩니다. - 자연장지 이용 현황의 투명한 공개 - 시민 정보 접근성 제고 및 민원 처리의 명확성 확보 - 연령·유해구분·관내외 등 다양한 이용 특성 분석 지원 - 장사시설 운영 개선 및 정책 수립 기반 마련 - 지속 가능한 자연장 문화 확산을 위한 데이터 기반 행정 실현
