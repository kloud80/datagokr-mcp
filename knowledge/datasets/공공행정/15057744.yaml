summary_user: 지방자치단체별·회계연도별로 예산액, 자체수입(지방세+세외수입), 지방세, 인건비와 총예산·자체수입·지방세 대비 인건비 비율을 담은 집계 지표로, 전국 자치단체를 대상으로 하며 포털 설명상 2001회계연도부터 제공된다. 분석가나 지방의원이 '우리 시는 자체수입으로 공무원 인건비를 얼마나 감당하고 있나, 같은 광역 내 다른 자치단체와 비교하면 어떤가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 기준으로 같은 지방재정365의 다른 공시 지표와 맞춰 잇는다.
description_portal: 지방자치단체의 자체수입대인건비비교 지표는 각 지방자치단체의 인건비 지출규모가 자체수입 대비 어느정도 수준인지를 보여주는 재정운영 건전성 평가 지표입니다. 자체수입은 지방세와 세외수입을 포함하며, 인건비는 공무원급여, 수당, 복리후생비 등을 포함합니다. 이 지표를 통해 자치단체의 인건비 부담능력을 가늠할 수 있으며, 자체수입보다 인건비가 과도하게 높은 경우 재정운영의 경직성 및 지속가능성에 대한 우려가 제기될 수 있습니다.자체수입대인건비비교 정보는 2001회계연도부터 제공됩니다. 자치단체별 금액은 총계예산이며, 광역별평균 및 전국평균은 순계예산규모로 작성됩니다. 세부 제공항목은 자치단체별 예산액, 자체수입, 지방세, 인건비, 총예산대비인건비, 자체수입대비인건비, 지방세수입대비인건비항목이 제공됩니다.
