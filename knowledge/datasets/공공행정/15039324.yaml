summary_user: 전라남도 진도군 7개 읍면에 있는 마을회관 247곳을 시설 한 곳당 한 행으로 담은 목록으로, 주소·위도경도·건립일자·건물면적·관리기관을 함께 싣는다. 주민이나 지역 분석가가 "우리 마을 회관은 어디에 있고 언제 지어졌으며 얼마나 넓은가" 같은 질문에 답하거나, 노후 시설을 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명·지번 주소나 좌표, 시설명으로 맞춰 이어야 한다.
limits: 포털 설명에 따르면 마을회관이 없거나 경로당과 함께 쓰는 곳은 목록에서 빠졌을 수 있어 진도군 전체 공동체 시설 수로 보면 안 된다. 진도군 한 곳만 다루는 파일이고 공통 코드 키가 없어, 다른 시군 자료와는 이름·주소를 맞춰야만 연결된다.
