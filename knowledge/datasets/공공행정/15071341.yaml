description_portal: 'ㅇ 데이터 개요: 「서울시 건물위생관리업 인허가 정보」는 서울시 관내 건물위생관리업(및 기타 분류)의 인허가·변경·폐업 현황을 담은 표준형 행정데이터입니다. 총 11,205건, 47개 필드로 구성되어 있으며 사업장 식별, 주소, 영업상태, 좌표, 시설·인력 현황 등의 항목을 제공합니다.ㅇ 주요 항목: 사업장명, 관리번호, 영업상태(코드·명), 상세영업상태, 전화번호, 지번/도로명주소, 우편번호, 좌표정보(X/Y), 업태구분명·위생업태명, 건물 지상/지하층수, 사용층(시작/끝), 종사자(남/여) 수, 다중이용업소 여부, 조건부허가 사유·기간 등.ㅇ 주소·공간정보: 좌표정보 제공ㅇ 데이터 품질: 시설·인력(예: 세탁기수, 좌석수 등) 일부 필드는 결측이 많아 통계 활용 시 주의가 필요합니다. 인허가·갱신일자 컬럼 값이 거의 없어 시계열 분석·최신성 검증에는 한계가 있습니다.ㅇ 활용 사례: △자치구별 영업 현황·폐업 추세 분석 △불법·무등록 의심 사업장 공간분포 모니터링 △민원 대응 및 현장점검 우선순위 도출 △시설·인력 기준 충족 여부 점검 △공중위생 정책 평가 및 현행화.'
