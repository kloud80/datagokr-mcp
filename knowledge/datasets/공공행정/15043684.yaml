summary_user: 성남시가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 목록이며, 업소명·구(수정구·중원구·분당구)·소재지 주소·전화번호·업종·데이터기준일자를 담는다(CSV 약 8.7KB). 주민이나 상권 분석가가 '분당구에서 가격이 저렴한 외식·이미용·세탁 업소는 어디인가'처럼 구별·업종별로 착한가격업소 분포를 찾는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 업소명·주소를 매칭해 LOCALDATA 인허가 원장이나 지역화폐 가맹점 목록과 잇는다.
description_portal: 성남시 내 착한가격업소에 대한 목록으로 업소명,구별,주소, 전화번호,주요취급품목의 항목으로 구성되어 있습니다. 착한가격업소는 성남시 관내 외식업, 이미용업, 세탁업 등 개인서비업소를 지정대상(가맹사업자-프랜차이즈 업소 제외)으로 하며, 해당 데이터는 업소명, 구별(수정구, 중원구, 분당구), 주소, 전화번호, 업종 항목으로 구성되어 있습니다. 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. * 착한가격업소는 가격수준이 지역평균 가격보다는 낮은 업소, 주방, 매장 내, 화장실 등 영업장이 청결한 업소, 지역화폐가맹점. 지역사회 공헌도 등 정부 및 지자체 시책 호응 업소 등 지정기준에 따라 지정된 업소를 말합니다.
