summary_user: 경기도가 수집·운영하는 통계조사의 목록과 출처를 조사 한 건당 한 행으로 담은 메타데이터로, 통계조사ID·최초실시년도·통계조사명·영문조사명으로 구성되며 범위는 시도 단위의 비공간 자료다. 정책 담당자나 연구자가 '경기도에서 주거·교통 분야 의식조사를 언제 처음 실시했고 비슷한 조사가 이미 있는가'처럼 조사 이력 파악과 중복 확인에 쓴다. 전역 조인 키는 없어 다른 데이터와는 조사명 매핑이나 경기통계포털 안에서 통계조사ID(stats_exmn_id)로만 연결한다.
description_portal: 이 데이터는 경기도에서 수집·운영하는 다양한 통계조사의 목록 및 출처를 정리한 자료로, 통계조사ID, 최초실시년도, 통계조사명, 영문조사명 등의 항목으로 구성되어 있습니다. 조사명은 '주요수입상품의 경쟁력 실태조사', '수입의 파급효과와 기업 대응방안', '고밀주택단지 내 시설배치에 대한 의식조사' 등 경제, 산업, 주거, 교통, 사회문화 전반에 걸쳐 있으며, 일부는 영문조사명도 병기되어 있습니다. 이 데이터는 통계조사의 실시연도 및 주제를 바탕으로 정책 수립에 필요한 조사자료 이력 파악, 유사 분야 간 조사연계 가능성 탐색, 조사 중복 방지 및 개선 방향 수립 등에 활용될 수 있습니다. 특히 통계조사ID는 각 조사를 고유하게 식별할 수 있는 값으로, 경기통계포털에서 연계자료 검색 시에도 유용하게 활용됩니다.
