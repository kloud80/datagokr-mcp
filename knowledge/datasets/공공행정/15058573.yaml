summary_user: 경기도 내 공공자전거를 운영하는 시군별로 사업시작연도, 직영·위탁 운영방식, 스테이션 개소 수, 보유 자전거 대수, 설치사업비와 연간 유지관리비, 무료·유료 등 운영 내용, 전년도 대여 실적을 한 행씩 담은 시군 단위 집계 자료다. 정책 담당자나 분석가가 "어느 시군이 자전거 한 대·대여 한 건당 유지관리비를 가장 많이 쓰는가"처럼 지자체별 예산 투입과 이용 실적을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군명(SIGUN_NM)이나 시군코드 같은 이름·코드 매핑으로만 잇는다.
description_portal: 경기도 내 공공자전거 운영 현황입니다. 공공자전거 운영 시군, 운영 방식, 운영자전거 대수, 자전거보관소 개소수, 설치사업비, 연간유지관리비 등의 정보를 제공합니다.이 데이터는 경기도 내 공공자전거 운영 현황을 시군별로 정리한 자료로, 자전거 인프라 및 서비스의 도입과 운영 실태를 파악할 수 있는 정보를 제공합니다. 항목에는 시군명, 사업시작연도, 운영방식유형(직영/위탁), 스테이션 지역 개소 수, 자전거 보유 수, 설치 사업비 및 연간 유지관리비, 운영방식의 상세 내용(무료, 유료 등), 전년도 대여 실적 건수 등이 포함됩니다. 이를 통해 각 지자체의 자전거 정책 특성, 예산 투입 규모, 이용 실적 등을 비교하고, 교통수단 다변화 및 친환경 이동수단 확산을 위한 정책자료로 활용될 수 있습니다. 또한 서비스 효율성 분석, 향후 인프라 확장 계획 수립에도 도움이 됩니다.
