description_portal: 공직자는 「부패방지 및 국민권익위원회의 설치와 운영에 관한 법률」제81조의2 및 같은 법 시행령 제88조의2에 따라 매년 1회 이상, 연 2시간 이상의 부패방지교육을 이수하여야 하며, 각 공공기관에서는 매년 전년도 부패방지교육 실시결과를 국민권익위원회에 제출하여야 합니다.청렴교육이수율은 국민권익위원회로 제출된 연도별·기관유형별 전체 공직자의 부패방지교육 이수율 실적으로 구성된 데이터입니다.해당 데이터는 2022년도부터 2024년도까지 총 3개년의 부패방지교육 이수율 실적을 포함하고 있고, 연도별로 6개 기관유형별 부패방지교육 이수율 실적이 산출되어 있습니다.6개 기관 유형은 중앙행정기관, 지방자치단체, 지방의회, 교육청, 국공립대학교, 공직유관단체입니다.＊지방자치단체는 광역자치단체 집행부와 기초자치단체 집행부를 의미하고, 지방의회는 광역자치단체 의회와 기초자치단체 의회를 의미하며, 교육청은 시도교육청과 교육지원청을 의미함그리고 마지막 행의 "총계"는 부패방지교육 대상이 되는 공직자 전체의 부패방지교육 이수율 실적을 의미합니다.
