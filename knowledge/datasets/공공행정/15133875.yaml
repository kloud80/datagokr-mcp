summary_user: 경기도의회 위원회마다 어느 행정 부서를 소관 부처로 두는지를 위원회 코드와 부서코드 짝 단위로 담은 설정 원장이며, 등록·수정 일자와 삭제 여부(jursdctn_miryfc_del_yn)도 함께 담는다. 경기도의회 활동을 살피는 시민·연구자·기자가 '기획재정위원회나 농정해양위원회가 어떤 부서를 심사·검토 대상으로 두는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 위원회 코드와 부서코드를 같은 경기도의정포털의 위원회·부서 자료와 이름·코드로 매핑해야 다른 데이터와 이어 쓸 수 있다.
description_portal: '「경기도의정포털_소관부처 설정」 데이터는 경기도 의회의 위원회별 소관 부처 설정 현황을 기록한 자료입니다. 주요 항목으로는 소관부처 설정 시퀀스번호, 위원회 코드, 소관 부처 부서코드, 등록일자, 등록회원SEQ, 수정일자, 수정회원SEQ, 소관부처 삭제여부 등이 포함됩니다.이 자료를 통해 특정 위원회(예: 의회운영위원회, 기획재정위원회, 농정해양위원회 등)가 어떤 행정 부서와 연결되어 있는지 확인할 수 있으며, 위원회별 심사 및 검토 대상 부처를 체계적으로 파악하는데에도 활용할 수 있습니다.'
