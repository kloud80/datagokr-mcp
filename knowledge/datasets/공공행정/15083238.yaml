description_portal: 본 데이터(예금보험공사 파산금융회사 현황)는 과거 저축은행 부실사태로 파산한 저축은행 등을 비롯하여 공사가 파산관재인으로 선임되어 파산절차를 진행중이거나(34개), 파산절차를 완료한(458개) 492개 파산금융회사 목록, 파산관재인 대리인, 파산재단 현황 등 관련 정보를 제공하고 있습니다.※ 파산관재인이란 파산절차의 목적을 달성하기 위해 파산재단에 대한 관리 및 처분권을 가지고 파산절차 전반을 관리하는 자를 말하며, 파산재단은 파산선고 당시 채무자가 가진 모든 자산으로 구성되어 잔여자산 환가 등 파산절차 진행을 위해 운영됩니다.개방 데이터 제공항목은 파산금융기관명, 관할법원, 파산관재인 대리인, 파산선고일, 종결여부, 종결일(파산종결시), 파산재단 주소·전화번호 및 팩스번호, 파산관재인 선임일의 10종, 약 4,800건입니다.
