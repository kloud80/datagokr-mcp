description_portal: '이 데이터는 광주광역시 행정구역 내 일반사업체의 업종별 현황을 제공하기 위한 데이터입니다.광주광역시 관내에 소재한 음식점·주점업, 건설업, 제조업, 보건업 등 주요 산업 분야별 사업체 수 및 종사자 수를 집계하여, 지역경제 구조와 산업 분포를 파악할 수 있도록 구성하였습니다.수록된 주요 내용은 다음과 같습니다.음식점 및 주점업: 음식점, 카페, 주점 등 서비스업에 해당하는 사업체에서 근무하는 종사자 수를 집계하여 지역 상권 및 외식산업의 규모를 파악할 수 있습니다.보관 및 창고업, 운송관련업: 보관·창고, 주차장, 공항, 화물취급 등 물류 및 운송지원 분야로 등록된 사업체 수를 포함하여 지역 내 물류 인프라 및 교통 관련 산업 현황을 제공합니다.건설업: 건축공사업, 토목공사업, 전문건설업 등 건설 관련 업종에 속한 사업체 종사자 수를 포함하여 지역 건설산업의 규모를 나타냅니다.제조업: 식품, 섬유, 금속, 전기·전자 등 제조업 전반에 걸친 사업체 종사자 수를 집계하여 산업기반의 구조적 특성과 생산활동 현황을 파악할 수 있습니다.보건업 및 사회복지 서비스업: 병원, 의원, 보건소, 공중보건의료업, 노인복지시설, 장애인복지시설, 보육시설 등 보건·복지 관련 업종에 속한 사업체 종사자 수를 포함하여 지역 사회서비스 분야의 규모와 인력 현황을 제공합니다.이 데이터는 통계청 전국사업체조사, 지방행정자료, 사업자등록 정보 등을 기반으로 집계·가공되었으며, 광주광역시의 산업별 분포, 고용 구조 분석, 정책 수립 및 지역경제 활성화 연구에 활용할 수 있습니다.또한 공공기관, 학계, 민간기업 등이 지역산업 발전 전략 수립, 일자리 정책, 상권 분석 등 다양한 분야에서 참고자료로 활용할 수 있습니다.'
