summary_user: 경상남도 지방보조금 보조사업을 사업 단위로 담은 파일 데이터로, 보조사업명·총사업비·보조율·융자금액을 행 단위로 기록한다. 경상남도가 어떤 보조사업에 얼마의 사업비를 몇 퍼센트 보조율로 지원하는지 알고 싶은 사업자·분석가가 '내가 지원받을 수 있는 도 보조사업이 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 보조사업명 같은 이름 매칭이나 같은 기관(경상남도) 기준으로만 이어 쓴다.
limits: 사업자번호·사업코드 같은 공통 키가 없어 국세청·공정거래 등 다른 원장과 바로 결합할 수 없고 이름 매칭에 의존해야 한다. 포털 설명에는 회계년도·정책사업명·통계목·예산액이 있다고 되어 있으나 실제 필드는 보조사업명·총사업비·보조율·융자금액 중심이므로 설명과 실제 컬럼을 대조해 쓴다.
