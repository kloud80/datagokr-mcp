summary_user: 국가직무능력표준(NCS)의 능력단위별로 코드·명칭·수준·정의와 대·중·소·세분류명을 담은 전국 단위 비공간 기준 정보로, 과정평가형 자격과 일학습병행 자격 관련 편성기준 수 등도 함께 내려준다. 훈련기관이나 교육 담당자가 '특정 직무 세분류에 속한 능력단위와 그 수준·정의, 최소 교육훈련시간은 무엇인가'를 확인해 훈련과정이나 자격 과정을 설계할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 NCS 분류코드(ncsClCd)나 능력단위코드의 이름·코드 매핑, 또는 같은 기관 자료로만 연결한다.
description_portal: 이 API는 한국산업인력공단에서 제공하는 "NCS 관련 정보" 서비스로, CQ-Net 시스템을 통해 국가직무능력표준(NCS)의 다양한 정보를 조회할 수 있도록 설계되었습니다. 사용자는 페이지 번호, 페이지당 데이터 수, 제공 형식(JSON 또는 XML)을 지정하여 데이터를 요청할 수 있으며, 결과로 능력단위코드, 능력단위명, 능력단위수준, 대·중·소·세분류명, 능력단위 정의 등의 정보를 받아볼 수 있습니다. 이 API는 특히 과정평가형 자격과 일학습병행 자격과 관련된 정보를 제공하며, 직업 교육, 훈련 과정 개발 및 자격제도 설계 시 활용도가 높은 공공 데이터 서비스입니다. 개발자 및 교육 관련 종사자에게 유용한 도구로, NCS 기반 교육 및 자격 관리를 위한 핵심 정보를 자동화된 방식으로 제공받을 수 있습니다.
