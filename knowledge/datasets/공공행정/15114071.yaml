description_portal: 광주광역시 5개년(2018~2022) 관내 전입과 관외 전출 인구 현황 데이터입니다. 전입, 전출인구현황은 주민등록신고에 기반한 자료입니다.광주광역시의 전입전출 인구현황 데이터는 연도별로 광주 내로 전입한 인구 수, 전출한 인구 수, 그리고 이를 통해 추정되는 순이동 인구 등을 기록한 자료입니다. 광주광역시 자치구 홈페이지 및 공공데이터포털을 통해 제공되며, 연도별 인구이동 흐름을 다양한 시점에서 살펴볼 수 있습니다. 이 데이터는 특히 청년층 유출, 지역소멸 위험지역 파악, 광주 내 자치구 간 이동 패턴, 정책 효과 측정, 도시 및 주거정책 기획 등에 유용하며, 연령별 이동자 비율도 통계청 자료를 통해 확인 가능합니다.
