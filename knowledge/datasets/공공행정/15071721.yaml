description_portal: 서울시 음반, 음악영상물배급업 인허가 정보는 음반과 음악영상물을 유통·배급하는 사업장의 행정 이력과 기본 특성을 파악하는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태코드와 영업상태명, 상세영업상태명은 각 배급업체의 인허가 이력과 현재 영업 여부를 확인하는 핵심 정보입니다. 지번주소, 도로명주소, 우편번호, 좌표정보(X, Y), 사업장명, 전화번호, 업태구분명, 문화체육업종명, 문화사업자구분명은 사업장의 위치와 업종, 사업자 유형을 나타내는 주요 정보입니다. 소재지면적, 시설면적, 총층수, 지상층수, 지하층수, 건물용도명은 배급시설 규모와 건물 특성을 보여 줍니다. 제작취급품목내용과 품목명은 어떤 종류의 음반 및 음악영상물을 유통·배급하는지에 대한 핵심 산업 정보입니다. 노래방실수, 청소년실수, 청소년실여부, 방음시설여부, 조명시설유무, 음향시설여부, 소방시설여부 등은 배급 기능과 함께 부가시설을 운영하는 경우 이용 환경과 안전 수준을 파악할 수 있는 지표입니다. 이 데이터는 음반·음악영상물 유통망의 지역별 분포와 규모 파악, 청소년 관련 시설 포함 여부 및 안전시설 점검, 지역별 문화콘텐츠 유통 인프라 분석, 문화산업 및 콘텐츠 유통 정책 수립에 활용할 수 있습니다.
