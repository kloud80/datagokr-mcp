description_portal: 경기도 수원시의 생활이동인구 데이터로 관내에서 관외로 유출된 데이터로 성별, 연령별, 시간대별 데이터를 포함합니다. 2021년 기준의 일회성 데이터입니다. 데이터 활용에 참고하여 주시기를 바랍니다. 주민등록상 거주는 관내지만, 실제 생활(출근, 통학, 소비 등)을 외부에서 하는 인구가 많다면 지역 내 일자리, 교육, 문화 인프라 구축의 근거로 활용할 수 있습니다. 생활권이 겹치는 지자체 간 교통, 환경, 문화시설 공동 활용 정책을 추진하는 근거 자료로 활용이 가능합니다. 또한 주민이 외부에서 소비하는 규모를 파악해 지역 상권 강화 정책을 마련하는 근거로 활용할 수 있습니다.
