description_portal: ㅇ 데이터 개요서울시와 25개 자치구 중 14개 기관이 운영하는 공공 실외 흡연시설 현황을 정리한 자료입니다. 민간 설치 시설은 포함하지 않았습니다.ㅇ 총 시설 수전체 개소 수는 129개이며, 기관별로 설치 현황이 다릅니다.ㅇ 시설 형태별 분포‘부분 개방형’이 45곳(약 35%)으로 가장 많고, ‘완전 폐쇄형’ 30곳, ‘완전 개방형(라인)’ 12곳, ‘완전 개방형(제연)’ 4곳 등 다양한 유형이 있습니다.ㅇ 주요 설치 위치한강공원, 백화점 측면부, 은행 본점 주변, 공원 등 시민 이용이 많은 공공장소에 주로 설치되어 있습니다.ㅇ 활용 목적시민의 간접흡연 피해를 줄이고 쾌적한 생활환경을 조성하기 위한 정책 자료로, 시설 분포 분석 및 신규 설치 계획 수립에 활용할 수 있습니다.
