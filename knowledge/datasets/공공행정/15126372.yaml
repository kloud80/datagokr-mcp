summary_user: 국유일반재산의 대부·매각 업무에 쓰이는 지정 감정평가법인별 운용 현황을 감정기관(지점) 단위로 담으며, 기준연도별 감정의뢰횟수·감정의뢰배분율·전년도 참가여부와 권역 정보를 포함한 전국 범위 데이터입니다. 감정평가업계 종사자나 분석가가 '어느 감정평가법인이 캠코 국유재산 감정을 몇 번, 어떤 비율로 배분받았는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 감정기관명 매칭이나 같은 기관(한국자산관리공사)의 국유재산 데이터와 기준연도로만 느슨하게 연결한다.
limits: 개별 재산(필지·PNU)이나 감정평가 금액은 담지 않아 특정 재산의 감정가 조회에는 쓸 수 없다. 전국·비공간 데이터라 권역일련번호 외에 지역 단위 분석 근거가 없고, 전역 조인 키가 없어 감정기관명 문자열 매칭에 의존해야 한다.
