description_portal: 한국자산관리공사_부동산공통 감정기관정보 조회서비스 API는 국가(기획재정부)가 보유하고 한국자산관리공사에서 관리하는 국유일반재산의  지정 감정평가법인 운용 현황을 제공하는 서비스입니다. 국유일반재산은 대부 및 매각 등의 업무 시  국유재산법 제29조2항 및 제42조 등에 따라 감정평가기관의 평가금액을 활용하고 있습니다. 감정기관정보 조회서비스는 감정기관명, 의뢰횟수, 감정의뢰배분율, 전년도 참가여부 등의 데이터를 제공합니다. ※ 데이터 포맷은 JSON 및 XML 형태로 제공됩니다.
