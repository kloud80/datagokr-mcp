description_portal: '본 자료는 인천광역시 중구 관내의 각 법정동별 토지 현황을 종합적으로 정리한 것으로, 법정지목 28개 항목을 기준으로 각 동별 지목별 면적과 해당 지번 수를 구분하여 수록하였습니다.해당 데이터는 「부동산종합공부시스템(KRAS: Korea Real Estate Administration System)」을 통해 추출한 것으로, 국가공간정보의 신뢰성을 바탕으로 한 공적 장부상의 정보를 기반으로 합니다.각 법정동 단위로 토지의 지목별 분포 현황을 확인할 수 있으며, 이를 통해 도시계획, 개발행위, 행정업무 수행 등 다양한 분야에서의 활용이 가능합니다.또한 본 자료는 인천광역시 중구의 토지 이용 실태를 종합적으로 파악하는 데 기초자료로 활용될 수 있으며, 지적공부에 등재된 필지 기준 면적(㎡)과 지번 수의 통계를 포함하고 있어 행정 및 정책 수립 시 참고자료로 유용합니다.자료 출처: 국토교통부 부동산종합공부시스템(KRAS)'
legal_basis_portal: 부동산종합공부시스템 운영규정에 따라 전산백업과 지적 통계 작성을 하기 위함. 매월말 기준으로 통계작성이 진행중임. 또한 지자체별 백서에 따라 일반현황에 반영하기 위한 기초자료임
