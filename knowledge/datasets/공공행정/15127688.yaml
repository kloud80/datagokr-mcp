description_portal: 한국산업기술시험원이 2018년부터 2025년까지 체결한 사택 관련 계약 현황을 정리한 데이터로, 임직원 주거지 확보를 위해 추진된 임차(전세·월세) 및 매입 계약 내역을 포함하고 있습니다. 각 계약 건별로 계약명, 계약 유형(임차 또는 매입), 계약 체결일자 및 기간, 계약 금액 등의 정보를 제공하여 사택 운영 현황과 자산 관리 흐름을 파악할 수 있습니다. 본 데이터는 기관의 복지 지원 수준과 재무적 운영 특성을 이해하는 데 활용 가능하며, 공공기관의 주거 지원 정책 및 계약 추세 분석에도 유용하게 활용될 수 있습니다.
