summary_user: 한국자산관리공사가 시행하는 국유지 개발 사업(위탁개발·기금개발·공용재산취득위탁개발)의 사업장별 기본 현황을 담으며, 사업관리번호·사업명·시작일자·종료일자·연면적을 사업 단위로 제공하는 전국 범위의 비공간 데이터다. 관심 지역에서 어떤 국유지 개발 사업이 언제 시작해 언제 끝나고 규모(연면적)는 얼마인지 확인하려는 주민·건설 사업자, 또는 사업 규모와 일정을 비교하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없고 주소·지번(PNU)도 없어, 다른 국유재산 데이터와는 사업명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓸 수 있다.
description_portal: 한국자산관리공사에서 시행하는 국유지 개발 사업 현황으로 위탁개발, 기금개발, 공용재산취득위탁개발 사업장에 대한 데이터입니다.이 데이터는 각 사업의 기본 현황을 확인할 수 있도록 사업관리번호, 사업명, 시작일자와 종료일자, 그리고 연면적 정보를 제공합니다. 사업 기간을 통해 추진 일정과 진행 상태를 파악할 수 있으며, 연면적 정보를 활용해 사업 규모를 비교·분석할 수 있습니다.사용자는 지역 개발 계획이나 건축 사업의 규모 및 일정 정보를 손쉽게 조회하여 관심지역의 변화를 미리 예측할 수 있습니다. 기술자는 이 데이터를 활용해 사업 진행 차트, 면적 기준 사업 분포 지도, 일정 기반 알림 시스템 또는 사업 비교 분석 도구 등을 개발할 수 있습니다.
