summary_user: 온비드에서 진행된 공매의 유효입찰참가자 수를 월 단위로 집계한 파일로, 캠코가 진행한 압류·국유·수탁재산 물건과 국가기관·지자체·금융회사 등 이용기관 물건의 참가자 수를 나누고 합계를 함께 담는다. 분석가나 공매 투자자가 "최근 몇 년간 온비드 공매 입찰 참여가 늘었는가, 캠코 물건과 이용기관 물건 중 어디서 변화가 컸는가" 같은 추이를 볼 때 쓴다. 전역 조인 키는 없어 연월(연월)을 기준으로 다른 월별 공매·부동산 통계와 시점만 맞춰 붙여 쓴다.
