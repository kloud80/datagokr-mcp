description_portal: '공매포털 온비드(Onbid)의 월별 입찰참가 현황 분석을 위한 참가자 수 정보를 제공합니다.(2013년부터 2025년까지의 정보 수록)월별로 한국자산관리공사가 공매진행한 압류재산·국유재산 등의 공매물건에 입찰참가한 사람의 수와 이용기관이 보유 또는 관리하며 공매진행한 물건의 입찰에 참가한 사람 수를 구분하였고, 그 합계 정보를 함께 수록하였습니다.이 자료에서 입찰참가자 수는 입찰서를 제출하고 및 보증금을 납부한 "유효입찰참가자"의 수입니다.해당 자료를 통해 월단위로 온비드에서 이루어진 공매 입찰에 대한 추이를 분석할 수 있습니다.* 연월 : 온비드 일반회원이 공매물건을 입찰참가한 기간의 연월을 날짜, 기간 단위로 나타냅니다.* 캠코공매물건 입찰참가자 수 : 한국자산관리공사가 공매진행한 체납압류재산·국유재산·수탁재산 등의 공매물건에 입찰참가한 사람의 수를 나타냅니다.* 이용기관공매물건 입찰참가자 수 : 국가기관, 지방자치단체, 학교, 공공기관, 금융회사 등이 보유·관리하는 공매물건에 입찰참가한 사람의 수를 나타냅니다.* 합계 : "캠코공매물건 입찰참가자 수"와 "이용기관공매물건 입찰참가자 수"를 합한 값으로, 월별 모든 물건에 대한 온비드 입찰참가자 수를 나타냅니다.'
