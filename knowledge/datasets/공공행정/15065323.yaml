summary_user: 한국동서발전이 체결한 공사·용역·물품 계약을 건별로 담은 CSV 파일로, 계약번호·계약명·계약일자·부가세 포함 계약금액과 예정가격·계약방법·조달유형·계약업체와 소재지·담당사업소를 기록한다. 분석가나 지역 업체가 '동서발전이 어느 지역 업체와 수의계약·경쟁입찰로 얼마를 계약했는가', '예정가격 대비 계약금액 비율은 어떤가'를 따질 때 쓴다. 전역 조인 키는 없어 다른 기관 계약현황이나 조달 데이터와는 업체명·소재지 같은 이름 매핑으로만 이어 쓴다.
description_portal: 한국동서발전의 공사, 용역, 물품 계약현황 정보는 공공기관이 체결한 다양한 유형의 계약 정보를 투명하게 공개하기 위해 제공되는 데이터입니다.해당 데이터는 계약번호, 계약명, 계약일자, 계약금액(VAT 포함), 예정가격(VAT 포함), 계약방법(수의계약, 경쟁입찰 등), 조달유형(공사, 용역, 물품), 계약업체, 계약업체 소재지, 담당사업소 등의 항목으로 구성되어 있으며, 각 계약의 기본적인 개요와 금전적 규모, 조달 방식, 계약처 정보를 확인할 수 있습니다.이 데이터는 공공조달의 투명성과 책임성을 평가하거나, 지역별·업체별 계약 분포, 조달 유형별 지출 구조 등을 분석하는 데 활용됩니다.학계 및 연구기관에서는 본 데이터를 기반으로 공기업의 계약 유형별 예산 집행 구조 분석, 조달방식에 따른 예산 효율성 비교, 특정 지역·업체에 대한 계약 집중도 분석 등을 수행할 수 있으며,또한 공공조달 정책 효과 측정, 지역경제 활성화와 공공계약의 연계성 분석, ESG 경영 이행 수준 평가 등 다양한 연구 주제에도 활용 가능합니다.장기적으로는 공공조달의 개선방향 도출, 공정 경쟁 환경 조성, 중소기업 참여 확대를 위한 정책 개발의 실증 자료로도 중요한 역할을 할 수 있습니다.
