summary_user: 경기도 공유서비스(공유누리)에 등록된 공공 캠핑장을 한 곳씩 담은 목록으로, 캠핑장명·주소·위도/경도·분류·이용 정보·홈페이지·전화번호·공개 여부·등록/수정일·조회수를 제공한다. 캠핑객이나 관광 분석가가 '우리 동네 근처 공공 캠핑장은 어디이고 어떤 유형인가'를 찾거나 시군별 캠핑 인프라 분포를 비교하는 데 쓴다. 실측상 전역 조인 키가 없어 지역코드(region_cd)·주소코드(addr_cd)나 주소·좌표를 행정구역 코드표와 매핑하거나 경기도의 다른 공유서비스 목록과 같은 기관 코드로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 공공 캠핑장에 대한 상세 정보를 제공하는 자료로, 캠핑장의 명칭, 주소, 위치좌표(위도 및 경도), 캠핑장 분류, 홈페이지 주소, 공개 여부, 등록일자 및 조회수 등의 항목으로 구성되어 있습니다. 각 캠핑장은 ‘주소코드’ 및 ‘지역코드’를 통해 행정구역별로 구분되며, 상세주소를 통해 정확한 위치 파악이 가능합니다. 해당 데이터는 공공캠핑장 검색 서비스,  캠핑장 보유 시설 현황, 캠핑장 비교분석, 위치기반 추천 서비스 등에 활용될 수 있으며, 지역 관광자원으로서의 가치 분석 및 캠핑 인프라 확충 정책 수립에 기초자료로 활용됩니다.
