description_portal: '경상남도 거창군 읍면별 65세 이상 노인인구 현황에 대한 데이터로 , 거창군 읍면,  거창군 읍면가구수,  거창군 읍면 인구수,  거창군 읍면 남녀별 지표,  거창군 읍면 비율, 데이터기준일 을 제공합니다.높은 고령화율: 거창군의 전체 인구(약 6만 명 선) 중 65세 이상 노인 인구 비율은 약 32%에 달합니다. 유엔(UN) 기준 고령사회(14% 이상)를 넘어 초고령사회 기준인 20%를 훨씬 웃도는 수치입니다.지속적인 증가 추세: 2010년 1만여 명 수준이던 노인 인구는 최근 1만 8,500명을 돌파하며 가파르게 상승해 왔습니다. 면 단위 일부 농촌 지역은 고령화율이 40%를 넘어서기도 합니다.청장년층의 유출과 저출생이 맞물리면서 거창군은 지역 소멸 위기에 직면해 있습니다. 이에 따라 거창군은 WHO "고령친화도시" 인증을 추진하고, AI 스마트팜 활용 및 맞춤형 노인 복지 통계 구축 등 노인 인구의 삶의 질 향상과 초고령사회 맞춤형 인프라 확충에 집중하고 있습니다.'
