summary_user: 경기도뉴스포털에 올라온 경기도 본청과 시군의 보도자료를 건별 목록으로 담으며, 기관명·분류·등록일시·제목·링크 주소로 구성되고 범위는 시도 단위의 비공간 자료다. 도민이나 기자·분석가가 '이번 달 경기도와 각 시군이 어떤 주제로 보도자료를 냈나'를 기관별·날짜별로 훑어보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM) 같은 이름 매칭으로만 이어 쓴다.
description_portal: '경기도뉴스포털에서 제공하는 보도자료 목록으로 기관명, 일자, 제목, 링크 URL 등의 항목으로 구성되어 있습니다.경기도 본청과 시군에서 배포한 보도자료 목록을 제공하며, 본문 내용과 첨부파일은 링크URL로 접속하여 경기도뉴스포털(gnews.gg.go.kr) 사이트에서 확인하실 수 있습니다.※ 유의사항 : 링크URL로 들어가서 보이는 상세 내용에 대한 이용 허락 조건은 각 보도자료별로 상이할 수 있습니다. 보도자료의 상세 내용에 대한 이용허락 조건은 각 보도자료의 하단에 있는 공공누리 유형을 통해 확인하시기 바랍니다.'
