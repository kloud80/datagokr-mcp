summary_user: 한국인터넷진흥원 대표홈페이지의 메뉴 항목을 한 행씩 담은 CSV 파일(약 34KB)로, 메뉴번호·상위 메뉴번호·메뉴명·언어유형·정렬·사용여부·등록일자 같은 운영 속성을 담는다. 웹사이트 개편 담당자나 분석가가 'KISA 홈페이지의 메뉴 계층은 어떻게 짜여 있고 어떤 메뉴가 실제로 노출되는가'를 확인할 때 쓴다. 메뉴번호(kisa_homepage_menu_no)가 고유 키이고 부모번호가 같은 메뉴번호를 가리키므로 파일 안에서 상·하위 메뉴를 이어 트리를 만드는 데 쓰며, 다른 공공데이터와 이어 쓸 공통 키나 코드표는 없다.
description_portal: 한국인터넷진흥원 대표홈페이지 메뉴구성에 대한 정보입니다. 이 데이터는 홈페이지의 정보구조를 구성하는 각 메뉴 항목에 대한 세부 정보를 포함하고 있으며, 메뉴번호는 각 메뉴의 고유 식별자로 사용되어 시스템 내에서 해당 메뉴를 정확히 지정할 수 있도록 합니다. 부모번호는 각 메뉴가 어느 상위 메뉴에 속해 있는지를 나타내는 값으로, 이를 통해 전체 메뉴의 계층구조를 파악하고 상·하위 메뉴 간의 관계를 체계적으로 구성할 수 있습니다. 메뉴명은 사용자에게 해당 메뉴가 어떤 정보를 제공하는지를 명확하게 전달하며, 홈페이지의 정보 탐색 흐름과 사용자 편의성에 직접적인 영향을 줍니다. 또한, 언어유형 정보는 다국어 지원 여부를 확인할 수 있게 해주며, 정렬순서나 노출여부 등의 항목은 각 메뉴가 홈페이지 화면 상에 어떻게 배치되고 운영되는지를 보여줍니다. 등록일자 및 최종 수정일자 정보는 메뉴의 생성 및 변경 이력을 관리하는 데 활용되며, 웹사이트 유지관리와 콘텐츠 최신성 확보에도 기여합니다. 이러한 구성 정보는 향후 홈페이지 개편이나 사용자 경험(UX) 개선, 콘텐츠 접근성 향상 등을 위한 기초 자료로도 사용될 수 있으며, 공공정보 제공 투명성과 체계적인 디지털 행정 운영에도 이바지합니다.
