summary_user: 순천시에서 활동하는 행정사를 한 명(영업소)씩 담은 건별 명단으로, 영업소 명칭·행정사 성명·영업 소재지·연락처를 담은 작은 CSV 파일(약 2.4KB)이다. 순천 시민이 인허가·민원 서류 대행을 맡길 행정사를 동네 근처에서 찾거나, 분석가가 시내 행정사 분포를 볼 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 영업 소재지 주소를 주소 정제·좌표 변환해 이어 붙이거나 같은 순천시 생활 행정시설 자료와 이름으로 맞춰 쓴다.
description_portal: 순천시 행정사 현황 데이터는 순천시 내에서 활동 중인 행정사에 대한 정보를 제공하는 공공데이터입니다. 이 데이터에는 영업소 명칭, 행정사 성명, 영업 소재지, 연락처 항목 등이 포함되어 있습니다. 이를 통해 시민들은 행정 서비스가 필요한 경우, 신뢰할 수 있는 행정사를 쉽게 찾을 수 있으며, 행정 절차에 대한 정확한 도움을 받을 수 있습니다. 또한, 공공기관이나 연구자들은 이 데이터를 활용해 지역 내 행정사 분포나 수요를 분석하고, 행정 서비스 개선 및 정책 수립에 중요한 기초 자료로 활용할 수 있습니다. 데이터는 주기적으로 갱신되며, 누구나 자유롭게 열람하고 사용할 수 있도록 제공됩니다.
