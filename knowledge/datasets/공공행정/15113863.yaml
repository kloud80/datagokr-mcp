description_portal: 세종특별자치시 공공시설 이용요금 즉시감면 현황에 대한 정보를 제공합니다.데이터는 연계 대상, 관리 업체명, 담당부서, 연계정보, 연계현황으로 구성되어 있으며, 국가유공자, 의사상자, 장애인, 국민기초생활수급자, 경차, 친환경차에 대한 공공시설 즉시감면 시스템 현황을 제공합니다. 예시를 들면, 세종시청 주차장 등 모든 관공서 주차장과 전통시장, 공영주차장, BRT 환승센터 등이 해당됩니다.이자료는 세종특별자치시 시설관리공단에서 제공하는 자료이며, 6개월 주기로 업데이트 될 예정입니다. 이 데이터는 세종특별자치시 기획조정실 인공지능디지털담당관이 관리하고 있는 데이터입니다.문의사항은 044-300-2483으로 연락주시기 바랍니다.
