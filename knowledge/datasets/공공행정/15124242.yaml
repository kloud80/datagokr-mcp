description_portal: 2020년 기준 서울특별시 자치구별 연령별 상주(야간) 주간 인구(유입, 유출 인구)에 대한 데이터 자료를 제공합니다.행정구역, 성별, 연령대별 인구가 구분되어 있으며, 상주 인구(야간 거주 인구), 유입 인구(통근·통학 구분), 유출 인구(통근·통학 구분), 그리고 주간 인구 및 주간 인구 지수까지 제공됩니다. 이를 통해 특정 연령층이나 성별이 어느 지역에서 밤에는 거주하고 낮에는 어디로 이동하는지를 알 수 있으며, 지역 간 통근·통학 패턴과 도시 내 인구 흐름을 파악하는 데 유용합니다. 특히 주간 인구 지수는 해당 지역의 활동 인구 밀집도를 보여주어 교통, 상권 분석, 행정 서비스 수요 예측 등에 활용할 수 있습니다. 본 데이터는 서울시 내 자치구별 인구 분포 및 이동 특성을 세밀하게 이해할 수 있는 기초 자료로 정책 수립, 도시계획, 복지 및 교통 정책 설계 등 다양한 분야에 활용될 수 있습니다.
