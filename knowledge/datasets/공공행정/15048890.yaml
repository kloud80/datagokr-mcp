description_portal: 2025년 7월 31일 기준, 충청북도 청주시 상당구 관내에 있는 모든 담배소매인의 지정현황 자료입니다. 담배사업법 및 관련 규정에 따라 상당구 관내 담배소매인 지정현황을 공개하여 행정의 투명성을 확보하고자 합니다.담배소매인은 담배사업법에 따라 판매사업장이 위치한 곳을 관할하는 시장, 군수, 구청장으로부터 소매인의 지정을 받아야 하며, 해당 데이터는 그에 따른 담배소매인 업소명, 업소주소, 지정일자, 소매인 구분 등의 자료를 제공합니다. 본 공공데이터를 활용해 담배소매인 지정신청 등에 활용할 수 있습니다.
