description_portal: ‘연설기록’ 콘텐츠는 제1대 이승만 대통령부터 제19대 문재인 대통령의 동영상 연설기록(236건))의 전문 텍스트 정보와 원본 파일을 제공합니다. 이 콘텐츠에서 제공되는 기록 목록, 전문텍스트 정보 및 원본파일은 정보공개청구를 통해 제공 받으실 수 있습니다. ‘연설기록’은 ‘환영사, 국회연설, 성명/담화문, 신년사, 기념사, 취임사, 기타’로 유형이 분류되어 있습니다. 모든 연설기록은 ‘대통령별, 유형별, 형태별, 연도별, 키워드별’로 검색이 가능합니다. 보다 자세한 정보는 대통령기록관(pa.go.kr)에서 확인하실 수 있습니다.
