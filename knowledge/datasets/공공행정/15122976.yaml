summary_user: 경기도 경기통계시스템의 각 통계표에 속한 항목 구조를 통계표 단위로 나열한 메타데이터 목록으로, 작성 조직 번호(orgnzt_no)·통계표ID·항목 구조 최종변경일을 담고 범위는 시도 단위·비공간이다. 분석가가 경기통계시스템에서 원하는 통계를 추출하기 전에 어떤 통계표가 어느 조직 소관이고 구조가 언제 바뀌었는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 통계표ID를 '경기도 경기통계시스템 통계표정보'의 자료명과 같은 기관 코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템에서 제공하는 각 통계표의 구조 및 항목 정보를 식별하기 위한 목록형 자료입니다. 주요 항목으로는 ‘조직번호’를 통해 통계 데이터를 생성·관리하는 행정 조직을 구분할 수 있으며, ‘통계표ID’는 해당 통계 항목이 소속된 통계표의 고유 식별자로, 데이터 호출 및 추출 시 참조되는 핵심값입니다. ‘최종변경일’은 통계 항목 구조가 마지막으로 변경된 날짜를 나타내며, 데이터 구조 변경 이력을 관리하는 데 유용합니다. ※통계표ID에 해당하는 자료명은 "경기도 경기통계시스템 통계표정보"를 참고해 주시기 바랍니다.
