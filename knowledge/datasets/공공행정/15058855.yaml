summary_user: 지방자치단체 복식부기 재무현황 중 자산(유동·비유동) 금액을 연도별·자치단체별로 담은 집계 데이터로, 범위는 전국이며 지도 좌표는 없다. 분석가나 주민이 '우리 시·군·구가 보유한 자산 규모는 얼마이고 다른 자치단체와 비교하면 어떤가'를 확인할 때 쓴다. 전역 조인 키는 없어서, 같은 지방재정365의 다른 공시 데이터와는 자치단체 코드(laf_cd)·광역 코드나 자치단체 이름을 맞춰 연결한다.
description_portal: 지방자치단체의 복식부기 재무현황에서 ‘자산’이란, 자치단체가 과거의 거래나 사건으로부터 획득하고 현재 통제하고 있는 자원으로, 미래에 경제적 효익이나 공공서비스 제공능력을 창출할 수 있는 것을 말합니다.자산은 유동자산과 비유동자산으로 구분되며, 유동자산에는 현금, 보통예금, 미수금, 선급금 등이 포함되고, 비유동자산에는 건물, 도로, 교량, 장비, 토지, 사회기반시설, 무형자산 등이 해당됩니다.복식부기 기준에서는 자산의 취득, 변동, 감가상각 등을 체계적으로 기록하여, 자산의 현재 가치를 명확히 파악하고 자산관리 책임성을 높일 수 있습니다.
