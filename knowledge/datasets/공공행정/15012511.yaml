summary_user: 수원역전 지하도상가에 입점한 점포를 한 행씩 담은 점포 원장으로, 점포번호·상호·면적(㎡)·업종·데이터기준일자를 담는다(포털 설명 기준 73개 점포, 파일 약 3KB). 지하도상가 상권을 살피는 분석가나 임차를 검토하는 사업자가 '이 지하상가에 어떤 업종이 몇 곳, 어느 정도 면적으로 들어와 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·업종 이름을 맞춰 붙이거나 같은 기관(수원도시공사) 자료끼리만 이어 쓴다.
