summary_user: 경상북도 청도군 관내 행정사 사무소를 사무소 한 곳당 한 행으로 담은 현황 파일로, 업체명·주소·전화번호·개업신고일·데이터기준일자를 담으며 CSV 파일 크기가 140바이트에 불과해 수록 사무소는 극히 적다. 청도군에서 서류 대행이나 인허가 신청을 맡길 행정사 사무소가 어디 있고 연락처가 무엇인지 찾는 주민·사업자가 쓴다. 전역 조인 키가 없어 다른 지역 행정사 현황이나 시설 데이터와는 주소나 업체명을 기준으로 맞춰 이어 써야 한다.
limits: 공통 코드나 식별자 컬럼이 없어 다른 데이터와 정확히 조인되지 않고, 주소 문자열이나 업체명 매칭에 의존해야 한다. 범위는 청도군 한 곳뿐이며, 파일이 140바이트로 매우 작아 통계 분석에는 맞지 않는다.
