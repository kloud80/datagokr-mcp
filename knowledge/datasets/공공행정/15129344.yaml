summary_user: 경기도 데이터분석 분석갤러리에 올라온 게시물의 첨부파일을 한 파일당 한 행으로 담은 목록이며, 게시물번호·첨부파일명·확장자·크기·설명·생성/수정 일자 같은 파일 메타데이터가 들어 있다. 분석가나 공무원이 '경기도가 어떤 분석 결과물이나 발표자료를 어떤 형식으로 공개했는가'를 확인하거나 갤러리 자료의 등록·수정 이력을 살필 때 쓴다. 실측 컬럼에는 다른 데이터와 잇는 전역 조인 키가 없어서, 같은 갤러리의 게시물 목록과 게시물번호(post_no)로 맞추거나 파일명으로 대조하는 정도로만 연결한다.
description_portal: 이 데이터는 경기도에서 운영하는 데이터분석 분석갤러리에 게시된 파일 목록과 관련 메타데이터를 담고 있습니다. 주요 항목으로는 게시물번호, 첨부파일번호, 첨부파일명, 첨부파일확장자명, 첨부파일변환명, 첨부파일크기, 첨부파일설명, 생성자아이디, 생성일자, 수정자아이디, 수정일자 등이 포함됩니다. 이를 통해 각 분석 결과물이나 발표자료 등의 원본 파일 정보를 체계적으로 관리할 수 있습니다. 데이터는 행정 보고, 연구자료 관리, 데이터 기반 정책 활용, 분석사례 공유 등 다양한 목적으로 사용 가능하며, 첨부파일 경로와 메타데이터를 통해 파일 버전 관리, 파일 크기 분석, 자료 이력 관리 등의 활용도 가능합니다.
