summary_user: 행정규칙(훈령·예규·고시 등)에 딸린 별표와 서식을 한 건씩 담은 목록으로, 별표명·별표 종류·번호, 관련 행정규칙명과 일련번호, 소관부처, 발령일자·발령번호, 서식 파일과 상세 링크를 제공하며 범위는 전국·비공간이다. 행정절차에 필요한 신청서·서식을 찾는 사업자나, 특정 부처 고시에 어떤 별표가 붙어 있는지 확인하려는 분석가·서비스 개발자가 '이 행정규칙의 서식 파일은 어디서 받나'라는 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 관련행정규칙일련번호·관련법령ID나 행정규칙명·소관부처명을 법제처 행정규칙 본문·법령 조회 데이터와 이름·코드로 맞춰 잇는다.
description_portal: 법제처에서 제공하는 모바일 기반 행정규칙 부속 자료 조회 서비스 데이터입니다. 행정규칙에 포함된 별표 및 서식의 일련번호, 명칭, 문서유형, 부속서식 여부, 개정일자, 행정규칙 코드 정보 등을 체계적으로 확인할 수 있습니다. 행정규칙 코드, 별표명, 서식명 등을 기준으로 원하는 자료를 조회할 수 있으며 응답에는 총 결과 수, 페이지 정보 및 개별 별표·서식의 상세 링크가 포함되어 있습니다. 이를 통해 행정규칙 부속 문서 현황 파악, 서식 자동 생성, 관련 시스템 연동 등에 활용할 수 있습니다. 모바일 애플리케이션이나 웹서비스에서 행정절차 문서 제공 기능 구현 및 서식 검색 기능 개선을 위한 핵심 데이터입니다.
