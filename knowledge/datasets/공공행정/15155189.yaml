description_portal: 본 데이터는 용인시 통합 홈페이지의 방문 흐름을 시계열 기준으로 분석하기 위해 구축된 통계 자료이다. 도메인명을 중심으로 접속 연월일, 시간, 일, 주, 요일 정보를 세분화하여 방문 패턴을 정밀하게 파악할 수 있도록 구성하였다. 순방문자와 재방문자를 시간·일·주·월 단위로 구분해 제공함으로써 이용자의 행동 특성과 접속 빈도를 체계적으로 분석할 수 있다. 또한 모바일 방문자 현황을 동일한 구조로 포함하여 PC와 모바일 간 이용 차이를 비교할 수 있게 하였으며, 최종 집계시간을 명시하여 데이터의 최신성과 분석 신뢰도를 확보하였다. 본 데이터는 홈페이지 이용 활성화 전략 수립, 콘텐츠 개선, 서비스 품질 향상 등을 지원하는 핵심 통계 자료로 활용된다.
