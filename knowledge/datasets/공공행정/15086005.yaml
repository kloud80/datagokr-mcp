summary_user: 부산광역시 연제구가 접수한 무단방치 자동차를 건별로 담은 파일로, 관리연도·접수일자·방치장소와 자진처리명령·견인·공고·폐차·말소 날짜까지 행정처리 단계별 일자를 기록한다(CSV 약 9KB 규모). 주민이나 분석가가 '연제구에서 방치차량 신고 후 견인·폐차까지 보통 얼마나 걸리나'처럼 처리 기간과 처리 단계 진행 상황을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 방치장소 주소 같은 이름 매핑이나 같은 기관(연제구) 기준으로만 이어 쓴다.
description_portal: 자동차관리법 제26조(자동차의 강제 처리)에 따라 자동차를 일정한 장소에 고정시켜 운행 외의 용도로 사용하는 행위, 자동차를 도로에 계속하여 방치하는 행위, 정당한 사유 없이 자동차를 타인의 토지에 대통령령으로 정하는 기간 이상 방치하는 행위를 무단방치로 보고 잆습니다. 해당 데이터는 부산광역시 연제구에서 관리 및 처리하고 있는 자동차 무단방치 접수 현황 및 행정처리 사항으로, 관리년도, 무단방치 접수일자, 자진처리요청, 자진처리명령, 견인일자, 공고일자, 폐차일자, 말소일자 등의 자료를 포함하고 있습니다.
