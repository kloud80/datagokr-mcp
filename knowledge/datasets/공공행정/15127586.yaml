description_portal: '3년(2022~2024)간 진천군 내 다문화가구에 대한 데이터로 한국인배우자 수, 결혼이민자 수, 귀화자 수, 귀화 및 외국국적의 자녀 수, 국내출생 자녀 수, 기타동거인 수로 구성출처 : 행정안전부 「지방자치단체외국인주민현황」 통계(지방자치단체별로 외국 출신의 이주민에 대한 성별, 국적 등 기본현황을 파악하여 이주민에 대한 인식 제고, 지역사회 커뮤니티 조성 등 지역사회 정착지원 시책의 기초자료)작성대상 범위 : 기준 시점 대한민국 영토 내에 상주(3개월 이상 거주)하는 모든 내･외국인과 이들이 살고 있는 거처□다문화가구  ▸(다문화가구) 귀화·인지의 방법으로 국적을 취득한 자 또는 외국인이 한국인(귀화자 등 포함)과 결혼한 결혼이민자가 존재하는 일반가구(다문화 대상자의 자녀가 있는 가구도 포함)   ※ 다문화가구원은 다문화가구의 구성원으로서, 집단가구의 다문화대상자나 자녀는 포함되지 않음.  ▸(기타동거인) 한국인배우자의 직계존속 또는 외국인배우자의 직계존속 등 다문화가구 구성원이나 한국인배우자, 결혼이민자, 귀화자 등, 미성년 자녀가 아닌 동거인'
