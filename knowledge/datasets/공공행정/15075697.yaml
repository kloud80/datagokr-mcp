summary_user: 경기도 시군별 소방관서마다 전체 정원과 소방준감부터 소방사까지 여덟 계급별 정원수를 관서 단위로 담은 집계표다. 인사·조직 분석가가 "어느 소방서에 상위 계급 정원이 몰려 있고 현장 계급 정원은 얼마나 되는가"처럼 관서별 계급 편중과 인력 집중도를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)이나 관서명을 이름으로 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별 소방관서에 소속된 인력의 계급별 정원 현황을 제공하는 자료입니다.주요 항목으로는 시군명, 관서명, 전체 정원 수와 함께 소방준감, 소방정, 소방령, 소방경, 소방위, 소방장, 소방교, 소방사와 같이 소방공무원의 계급별 정원수가 포함되어 있습니다. 데이터는 소방서별 및 계급별 정원의 편중 여부 등을 분석하는 데 유용하게 활용될 수 있습니다. 또한, 소방 인력 배치를 위한 정책 수립, 인사관리 및 조직 효율화 연구 자료로서의 활용이 가능합니다. 소방괸서별 구조적 특징이나 인력 집중도를 비교하고 분석할 수 있는 기초 통계자료로도 활용됩니다.
