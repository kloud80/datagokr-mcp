summary_user: 부여군의회에 접수된 의안(조례안·동의안·결의안·예산·결산안 등)을 의안 한 건당 한 행으로 담은 CSV 파일(약 51KB)로, 의안번호·의안명·발의자·접수일·소관위원회·처리결과를 포함한다. 주민이나 연구자가 '부여군의회에서 올해 의원 발의 조례안이 몇 건 접수되어 어떻게 처리됐나', '위원회별로 어떤 의안을 심사했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방의회 의안정보와는 의안명·위원회명 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: '본 데이터는 부여군의회에서 접수·처리되는 의안(조례안, 동의안, 결의안, 예산·결산안, 보고안건 등)의 현황을 체계적으로 제공하기 위해 구축된 행정데이터입니다.부여군의회 의안관리 시스템에 등록된 의안을 대상으로, 의안의 고유번호, 의안명, 발의 주체, 접수일, 소관위원회, 처리결과 및 데이터 기준일자를 포함하고 있습니다.해당 자료는 부여군의회에서 발생하는 의정활동을 주민이 쉽게 확인할 수 있도록 공개하는 것을 목적으로 하며, 의안 발의 동향, 위원회별 심사 흐름, 의안 처리 현황, 연도별 의정 성과 분석 등 다양한 행정·정책·연구 분야에서 활용할 수 있는 기초자료입니다.① 의안 기본정보의안명: 의안의 공식 명칭으로, 조례안·결의안·동의안·예산안 등 의안 종류를 포함한 제목입니다.발의자: 의안을 제안한 주체로, 의원 발의(“○○의원 등 ○인”), 의장 발의, 군수 발의 등으로 구분됩니다.접수일: 의회에 의안이 공식 접수된 날짜이며, 의안 심사와 처리 절차가 시작되는 시점입니다.② 의안 처리정보소관위원회: 해당 의안을 심사·검토하는 상임위원회 또는 특별위원회 명칭입니다.의안 성격에 따라 총무위원회, 산업건설위원회, 예산결산특별위원회, 행정사무감사특별위원회, 의회운영위원회 등으로 분류됩니다.절차 안건(회기결정, 서명의원 선출 등) 등 일부 의안은 본회의 직접 처리로 **소관위원회 항목이 공란(N/A)**일 수 있습니다.처리결과: 의안 심사·의결 결과를 나타내며, 의회 처리 단계에 따른 상태값으로 관리됩니다.'
