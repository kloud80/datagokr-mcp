description_portal: '세종특별자치시시설관리공단은 화장시설 예약 취소 현황을 투명하게 관리하고, 시민이 화장 절차의 진행 상태를 명확하게 확인할 수 있도록 화장 예약 취소 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 예약 취소 시점, 취소 사유, 화로(화장로) 배정 내역 등의 정보를 제공하여 화장시설 운영의 공정성과 신뢰성을 높이기 위해 구축되었습니다.■ 데이터 컬럼 구성화장취소일자 - 화장 예약이 취소된 날짜화장일자 - 원래 화장이 예정되어 있던 날짜화로번호 - 해당 예약이 배정되었던 최종 화로(화장로) 번호유해구분 - 화장 대상의 구분    예: 시신, 개장유골, 사산아 등관내관외구분 - 고인의 주소지 기준 - 관내(세종시) / 관외 구분취소사유 - 예약 취소가 발생한 이유    예: 일정 변경, 서류 미비, 이중 예약 등예약화로번호 - 예약 단계에서 임시로 배정되었던 화로 번호 - 최종 배정 화로(화로번호)와 비교하여 배정 과정 파악 가능■ 데이터 제공 목적화장 예약 취소 데이터는 다음과 같은 목적을 위해 제공됩니다. - 화장시설 예약 및 배정 과정의 투명성 확보 - 예약 취소 원인 분석을 통한 운영 개선 및 민원 감소 - 관내·관외 수요 변화 및 예약 패턴 분석 지원 - 정확한 정보 제공을 통한 시민의 예측 가능성 및 서비스 신뢰도 향상세종특별자치시시설관리공단은 앞으로도 화장 일정 관리의 공공성과 신뢰성을 높이기 위해 관련 데이터를 지속적으로 갱신·제공하겠습니다.'
