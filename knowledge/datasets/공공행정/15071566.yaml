summary_user: 서울시 내 주유소·LPG충전소·석유대체연료 판매소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·폐업일자·영업상태와 사업장명·주소·좌표·업태·자본금·거래처를 포함한다. 동네에 영업 중인 주유소·충전소가 어디인지, 최근 폐업하거나 휴업한 곳이 어디인지 확인하려는 주민·사업자, 그리고 석유 판매업소의 분포와 정유사 공급 구조를 보려는 분석가가 쓴다. 실측 컬럼에서 다른 데이터와 바로 붙일 전역 조인 키는 확인되지 않았으므로, LOCALDATA 인허가 자료와는 같은 원천으로 대조하고 다른 자료와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 잇는다.
description_portal: 서울시 석유 및 석유대체연료판매업체 인허가 정보는 서울시 내 주유소·LPG충전소·석유대체연료 판매소 등의 인허가 및 영업 현황을 보여주는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 각 판매업체가 현재 영업 중인지, 휴업·폐업 상태인지 등 행정 이력을 확인할 수 있습니다. 사업장명, 전화번호, 지번·도로명주소, 우편번호, 좌표정보, 소재지면적, 업태구분명은 업체의 위치, 규모, 업종 유형을 파악하는 핵심 항목입니다. 자본금 정보는 해당 업체의 자본 규모를 가늠하는 데 사용되며, 거래처 항목은 석유·연료 공급망(정유사 등) 구조를 분석하는 데 도움이 됩니다. 최종수정일자, 데이터갱신구분, 데이터갱신일자는 정보의 최신성과 관리 이력을 보여 주어, 전반적으로 서울시 석유 및 석유대체연료 판매업체의 분포, 규모, 영업 현황 및 공급망 구조를 파악하고 에너지·안전 정책 수립과 점검계획 마련에 활용 가능한 데이터입니다.
