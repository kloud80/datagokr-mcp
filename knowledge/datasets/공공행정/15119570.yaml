description_portal: 제주에너지공사의 유연근무(시차출퇴근, 근무시간선택, 탄력근무, 재택근무 등) 인원 현황입니다. 본 데이터는 제주에너지공사가 공개하는 유연근무 현황데이터는 임직원들이 일과 삶의 균형을 맞출 수 있도록 근무시간, 근무장소, 근무방식을 자율적으로 선택하게 할 수 있는 제도입니다.  유연근무 형태로는 시차출퇴근형, 근무시간선택형, 집약근무형, 재량근무형이 있습니다.제주에너지공사는 2023년도부터 2024년까지 유연근무제를 이용한 임직원의 인원수를 유연근무형태에 따라 연도별로 집계하고 있으며,  본 자료는 클린아이 연간 공시에서도 확인 가능합니다.
