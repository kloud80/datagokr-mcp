summary_user: '대전 서구 안의 상권(예: 가수원상점가, 한민시장)별로 기준년·기준월과 성별, 행정동 단위로 유동인구 현황을 담은 월별 집계 파일(csv, 약 64KB)이다. 서구에서 창업 입지를 고르는 사업자나 상권 활성화 정책을 검토하는 분석가가 특정 상권의 월별 유동인구와 성별 구성이 어떻게 바뀌었는지 확인하는 데 쓴다. 전역 조인 키는 없어서 행정동코드·행정동명이나 상권명을 이름·코드로 맞춰 같은 서구의 점포·인허가(LOCALDATA) 자료나 행정동 단위 통계와 연결한다.'
description_portal: '대전광역시 서구 상권별 연월별 유동인구 현황(기준년, 기준월, 상권코드, 상권명, 성별코드, 성별, 행정동코드, 해정동, 유동인구수,  시간당 평균 유동인구수) 데이터를 제공합니다.대전광역시 서구 상권별 연월별 유동인구 현황 공공데이터는 서구 내 각 상권별로 월별·연도별 유동인구 수치를 제공하는 통계 자료입니다. 이 데이터는 상권 활성화, 투자 분석, 도시계획 등 다양한 목적으로 활용됩니다. 주요 특징으로는상권별·연월별 구분: 서구 내 주요 상권(예: 가수원상점가, 한민시장 등)별로 월별 또는 연도별 유동인구 수치가 정리되어 있습니다.공공성 및 신뢰성: 정부나 공공기관에서 공식적으로 수집·공개한 데이터로, 상업·업무시설 확충, 도시계획 변화 등과 연계해 분석할 수 있습니다. 활용 예시: 상권 활성화 전략 수립, 창업·투자 인사이트 도출, 상권별 인구 흐름 분석 등에 널리 사용됩니다.위 자료는 공공데이터 포털에서 확인할 수 있습니다.'
