summary_user: 경상남도 양산시 관내 무인민원발급기를 한 대(설치장소)씩 담은 목록으로, 설치 위치·운영시간·발급 가능한 민원 종류·도로명/지번 주소·위도·경도·전화번호를 담는다. 시민이 '집 근처에서 지금 주민등록등본을 뗄 수 있는 무인발급기가 어디 있고 몇 시까지 운영하나'를 찾거나, 분석가가 양산시 내 무인민원 서비스 접근성을 지도로 살피는 데 쓴다. 전역 조인 키는 없어 주소나 위도·경도로 다른 시설·행정구역 데이터와 공간적으로 맞춰 쓰며, 공공시설 개방·무인민원 표준데이터 체계의 다른 시군구 자료와는 같은 컬럼 구성으로 이어 붙인다.
limits: 양산시 한 시군구만 담고 있어 다른 지역은 별도 자료가 필요하다. 기관·행정 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소 매핑이나 좌표로만 연결된다.
