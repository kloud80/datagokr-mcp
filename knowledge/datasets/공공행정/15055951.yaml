description_portal: '광주광역시 광산구에 위치한 현수막 지정게시대에 대한 현황 정보를 제공합니다. 이 데이터는 현수막 게시의 효율성과 공공질서 유지를 목적으로 수집된 것으로, 각 게시대의 용도 구분(예: 상업용, 공공용, 행정용 등), 도로명 주소, 구체적인 설치 위치, 그리고 위도와 경도 좌표 등 공간 정보를 포함하고 있습니다. 게시대는 주요 도로변, 사거리, 행정복지센터 앞, 고가도로 하부 등 유동 인구가 많은 장소에 설치되어 있습니다.이 정보를 통해 광고주, 행정기관, 시민 등 다양한 이용자가 현수막 게시 가능 위치를 사전에 확인하고 활용할 수 있으며, 도시 미관 관리와 공공 커뮤니케이션의 효율성을 높이는 데 기여할 수 있습니다.'
