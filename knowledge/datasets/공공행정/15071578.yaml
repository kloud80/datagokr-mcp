summary_user: 서울시 자치구가 허가·관리하는 식용얼음판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자, 사업장명·주소·좌표, 종사자 수·시설 규모 등을 포함한다. 상권 분석가나 창업 예정자가 "어느 자치구에 영업 중인 식용얼음판매업소가 몇 곳이고, 최근 폐업한 곳은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 코드(개방자치단체코드 OPNSFTEAMCODE 등)로만 이어 붙이며, LOCALDATA 인허가 데이터와 원천을 공유한다.
description_portal: 서울시 식용얼음판매업 인허가 정보는 서울시 관할 자치단체에서 허가·관리하는 식용얼음판매업소를 대상으로 관리번호와 인허가일자, 인허가취소일자, 영업상태 및 상세영업상태, 폐업·휴업·재개업 일자 등 기본 인허가 및 영업 이력을 제공하고, 사업장명, 전화번호, 지번주소·도로명주소, 우편번호, 좌표정보, 소재지면적 등 사업장의 기본 현황과 위치 정보를 포함하며, 위생업태명, 급수시설구분명, 영업장주변구분명, 등급구분명 등 위생·환경 관련 특성을 함께 제시하고, 남성·여성 종사자 수, 총인원, 본사 및 공장 종업원 수(사무직·판매직·생산직) 등 인력 구성 정보를 통해 업소의 규모와 운영 형태를 파악할 수 있도록 하며, 건물소유구분명, 보증액, 월세액, 시설총규모, 다중이용업소여부 등 시설·재정 관련 정보를 제공하여 행정기관의 위생 관리, 안전 점검, 정책 수립에 활용될 뿐 아니라 전통업소지정번호, 전통업소주된음식, 홈페이지 항목 등을 통해 시민들이 신뢰도와 특성을 고려해 식용얼음판매업소를 선택·이용하는 데에도 유용하게 활용할 수 있는 인허가 기반 공공데이터입니다.
