description_portal: 'KOSIS 1인당 개인소득 통계표는 국가데이터처에서 생산하는 [지역소득] 통계 중 "1인당 개인소득"에 관한 상세한 통계 데이터를 제공합니다.□ 정의  - 1인당 개인소득: 가계 및 가계에 봉사하는 비영리단체의 총처분가능소득을 지역 인구수로 나눈 1인당 연간소득  □ 의의  - 각 시·도 내에서 경제활동별로 얼마만큼의 부가가치가 발생되었는가를 나타냄    지역소득의 생산, 분배, 지출 각 측면이나 경제주체간 소득 순환을 파악하여, 지역경제의 실태를 포괄적으로 나타내주어 지역의 재정, 경제시책 수립에 필요한 자료제공 □ 산식  - 1인당 개인소득=개인(사용) 총처분가능소득÷추계 인구 □ 참고사항  - 1인당 지표는 2020년부터 국가데이터처 시도별 장래인구추계결과(2022. 5. 공표)로 산출되었음  - 2012년 세종특별자치시는 과거 행정구역을 기준으로 충북 및 충남에 포함  - "87년 전남에서 광주시 분리, "89년 충남에서 대전시 분리, "98년 경남에서 울산시 분리, "13년 충남북에서 세종시가 분리되었음'
