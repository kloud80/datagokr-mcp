summary_user: 전국 방문판매사업자의 등록 현황을 사업자 건별로 담은 API로, 검증 시 97건이 수신됐고 기간은 2007-10-29부터 2026-07-21까지다. 소비자나 거래 상대방이 "이 방문판매업체가 등록된 사업자이고 영업 중인가"를 확인하는 데 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)로 같은 공정위의 통신판매·다단계·상조 등 다른 등록 데이터와 묶고, 소재지주소·도로명주소(address)로 주소 기반 자료와 이어 쓴다.
description_portal: 이  API는 사업자등록번호, 상호명, 영업상태, 인허가관리번호 등의 조회 조건으로 방문판매사업자의 등록 현황 정보를 조회 합니다. 활용 가능 상세 기능으로 인허가관리번호별 방문판매사업자 등록현황 조회, 방문판매사업자 등록현황 조회, 허가일자별 방문판매사업자 등록현황 조회,  사업자등록번호별 방문판매사업자 등록현황 조회, 상호명별 방문판매사업자 등록현황 조회, 영업상태별 방문판매사업자 등록현황 조회, 지역별 방문판매사업자 등록현황 조회 등이 있습니다.
