description_portal: 투명한 행정 구현과 부패방지를 위한 시민 참여 확산, 공익 보호와 시민 안전 확보를 위한 신고문화 활성화 필요성 증대, 그리고 각종 불법행위와 위법사항에 대한 시민 감시 기능 강화를 통한 깨끗하고 안전한 지역사회 조성 정책 추진에 따라 보령시는 다양한 분야의 신고포상금 제도를 체계적으로 운영하고 있습니다. 부패방지 공익신고 보상/포상금, 지방보조사업 신고포상금, 청소년보호법 위반신고자 포상금, 부정불량식품 신고 보상금 등 4개 분야로 구분하여 각 영역별 특성에 맞는 신고 체계를 구축하고 있습니다. 각 제도별 거주지 제한, 건수 및 금액 제한, 예산 규모, 담당부서 등의 세부 운영 기준을 명확히 하여 시민들이 쉽게 참여할 수 있도록 하며, 공정하고 투명한 포상금 지급을 통해 시민 참여형 감시체계를 강화하고 있습니다.
