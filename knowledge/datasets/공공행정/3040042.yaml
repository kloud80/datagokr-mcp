description_portal: 해당 데이터는 **「경상남도 통영시 통계연보(2019.12.31 기준)」**로, 통영시의 전반적인 행정·사회·경제·환경 현황을 종합적으로 정리한 연감 형식의 통계 자료입니다. 연혁, 토지 및 기후, 인구, 노동·사업체, 농림수산업, 광업·제조업·에너지, 전기·가스·수도, 유통·금융·보험·기타 서비스, 주택·건설·교통·관광·정보통신, 보건·사회보장, 환경, 교육·문화, 재정, 공공행정·사법 등 15개 분야로 구성되어 있으며, 각 항목은 링크를 통해 KOSIS에서 제공하는 상세 통계표와 연결됩니다. 이용자는 분야별 표를 엑셀(XLS) 파일로 내려받아 시계열 분석, 부서별 보고서 작성, 정책 수립을 위한 기초자료 등으로 활용할 수 있습니다. 비록 공공데이터포털에는 1회성으로 등록되어 있지만, 실제 통계 내용은 KOSIS 상에서 수시로 갱신되며, 특히 교육기관 현황은 2020년 4월 1일 기준으로 편집되었다는 점이 명시되어 있어 기준시점과 해석에 유의해야 합니다.
