summary_user: 제주특별자치도 관내 읍·면·동별로 등록된 반려동물 수(마리)를 동물 구분 대분류·소분류에 따라 누계로 집계한 통계로, 건별 등록 원천이 아닌 집계 자료다. 지자체 동물보호 담당자나 연구자가 '제주에서 반려동물 등록이 어느 읍면동에 많고 어떤 동물·유형 위주인가'를 파악해 등록률 관리나 유실·유기 방지 정책을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름을 맞춰 매핑하거나 같은 기관 자료끼리만 연결해 쓴다.
description_portal: '이 데이터셋은 제주특별자치도가 집계·공개한 ‘동물 등록 누계 현황’ 자료로, 제주도 관내 읍·면·동 단위별로 등록된 반려동물을 유형(예: 개, 고양이 등) 및 등록 방식(내장형 칩, 외장형 태그, 인식표 등)별 등록 두수를 집계한 통계 정보를 포함하고 있다. 데이터 형식은 CSV 또는 오픈 포맷으로 제공되며, 등록된 동물의 총수와 등록 방식별 세부 집계는 반려동물 유실·유기 방지, 등록제도 운영 실태 분석, 동물보호 정책 수립, 지역별 등록률 관리 등에 있어 핵심 기초자료로 활용될 수 있다. 특히 본 자료는 반려동물 등록 현황을 통해 지역사회 내 반려동물 분포 및 등록 방식의 채택 현황을 파악함으로써, 등록률 제고를 위한 정책 설계, 등록 방식별 보급 현황 분석, 등록 방식 간 선호도 비교, 지역별 동물 보호 및 복지 계획 수립, 유실/유기동물 발생 억제를 위한 기반 통계 제공 역할을 수행한다. 또한 지자체 행정, 동물보호 단체, 연구자, 시민단체 등이 반려동물 관련 사회적 이슈를 진단하거나 대응 방안을 마련하는 데 있어 객관적이고 구조화된 데이터를 제공하는 공공데이터로서 의미가 크다.'
