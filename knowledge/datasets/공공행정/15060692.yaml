description_portal: 이 통계 데이터는 당해년도 1월 1일부터 12월 31일까지 행정부 국가공무원의 퇴직현황을 직급별로 산출한 인사통계 자료입니다.퇴직은 의원면직과 직권면직, 그리고 당연퇴직, 징계퇴직 기타로 구분됩니다. 당연퇴직은 임용결격사유, 정년퇴직, 사망, 임기만료, 기타로 세분화됩니다. 명예퇴직은 의원면직 및  사망, 임기만료 등과 중복되는 경우가 있어 이를 별도로 표기하였습니다.해당 통계자료는 일반직공무원 퇴직, 특정직공무원 퇴직, 그리고 별정직공무원 퇴직으로 작성되어 있습니다별정직공무원은 정년퇴직이 아닌 "근무상한연령"을 적용합니다.
