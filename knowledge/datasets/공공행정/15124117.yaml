description_portal: 본 데이터는 경기도 광주시의 전출입 및 기초생활수급자 현황 정보를 제공합니다. 광주시의 인구 이동 현황과 기초생활보장제도 수급자 규모를 담고 있어 인구 변동과 복지 수요를 파악할 수 있습니다. 전입인구는 다른 지역에서 광주시로 이주해 온 인구수를 나타내며, 전출인구는 광주시에서 다른 지역으로 이주한 인구수를 표시합니다. 기초생활수급자는 국민기초생활보장제도의 지원을 받는 주민 수를 나타내고, 기준년도는 해당 통계의 집계 연도를 표시합니다. 본 데이터는 인구 정책 수립, 복지 예산 계획, 지역 경제 분석, 주거 정책 수립, 사회복지 계획, 도시 개발 전략 등에 활용됩니다.
