description_portal: '통계기준통합관리시스템으로 접수된 민원인의 민원상담에 대한 정보입니다.1) 연도별(1998~2025) 국민신문고 민원 접수 건수 현황 자료입니다. 2) 연도별 (1998~2025)국민신문고 민원 처리 건수 현황 자료입니다.      * 민원처리 등록일과 민원처리일은 각각 다른 의미를 가집니다.       - 민원처리 등록일: 민원이 시스템에 공식적으로 접수·등록된 날짜      - 민원처리일: 해당 민원에 대한 실제 처리가 완료된 날짜   3) 연도별(2007~2025) 민원상담센터 접수경로별* 처리 건수    * 민원요청경로의 의미로, 국민신문고/전화/이메일/공문 등으로 구분합니다.※ 통계기준통합관리시스템: 통계 작성에 필요한 각종 기준(표준분류, 용어, 코드, 기준시점 등)을 통합 관리·제공하며, 분류 관련 민원에 대한 일부 상담 기능을 수행함'
