summary_user: 서울 성북구 관내에 설치된 흡연시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 1.3KB)로, 시설 구분·개방형/폐쇄형 형태·설치 위치·면적·설치일·설치 주체·관리기관을 기록한다. 주민이나 보건 담당자가 '성북구 어디에 흡연구역이 있고 누가 관리하나'를 확인하거나 금연구역 정책 검토에 쓴다. 전역 조인 키나 좌표 컬럼이 없어, 다른 자치구 흡연구역 자료와는 자치구명·설치 위치 문자열로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 2026년 2월 23일 기준으로 서울특별시 성북구 관내에 설치된 흡연시설의 현황을 체계적으로 정리한 자료입니다. 각 시설의 구분(보건소, 공공청사, 의료기관 등), 형태(개방형·폐쇄형), 위치, 규모(㎡), 설치일, 관리 주체 및 관리기관 등의 정보가 포함되어 있으며, 이를 통해 성북구 내 공공 및 민간시설의 흡연구역 분포와 관리 현황을 한눈에 파악할 수 있습니다. 본 자료는 금연정책 수립, 보건행정 계획, 생활편의시설 관리, GIS 기반 도시 서비스 개발 등 다양한 행정·연구 분야에서 실질적으로 활용될 수 있습니다.
