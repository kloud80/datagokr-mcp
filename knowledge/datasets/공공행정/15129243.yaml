description_portal: '- 전라남도에서 관리하고 있는  공공건축물의 현황(연면적, 공부면적, 건물용도, 재산관리관) 정보를 제공합니다.- 전라남도는 공공건축물의 품격 향상과 지속 가능한 건축 환경 조성을 위해 다양한 정책과 사업을 추진하고 있습니다.- 전라남도는 공공건축물에 대해 "장애물 없는 생활환경 인증(BF)"을 의무화하는 조례를 시행하고 있습니다. 이 조례는 도가 건축주인 건축물, 위탁 운영하는 건축물, 또는 도가 재정을 지원하여 신축·증축·개축하는 건축물에 적용됩니다. 또한, 인증을 받은 민간 건축물에 대해서는 관련 법령에 따른 행정절차를 면제하는 등의 지원도 이루어집니다.- 전라남도는 노후 공공건축물의 에너지 효율을 개선하기 위해 "그린리모델링" 사업을 추진하고 있습니다. 이 사업은 독일 패시브하우스연구소(PHI)의 인증을 받은 디자이너를 총괄기획가로 위촉하여 냉난방 성능 개선과 에너지 절약을 목표로 합니다.'
