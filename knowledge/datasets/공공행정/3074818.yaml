description_portal: 대구광역시 건설기계 등록 현황에 대한 주요 정보를 제공하는 공공데이터입니다. 대구광역시에 등록된 건설기계에 대하여 기종별로 자가용, 영업용, 관용으로 구분하여 등록 대수를 파악할 수 있는 데이터입니다. 연도별로 등록 현황이 등재되어 있어 대구광역시 건설기계의 등록 대수 증감 현황을 파악할 수 있으며, 연도별 건설기계 등록 현황 분석을 통하여 지역의 건설경기 흐름을 분석 할 수 자료입니다. 또한, 건설업체에서는 지역 내 건설공사 시 대구광역시에 등록된 건설기계의 기종별(자가용, 영업용, 관용) 등록 대수 파악을 통하여, 대구광역시에 등록되지 않은 건설기계는 타지역에서 건설기계를 수급하는 등 건설기계 수급 계획 등에 활용할 수 있는 데이터입니다.
