description_portal: 강원특별자치도 마을기업 현황을 제공하는 공공데이터입니다. 본 자료는 마을기업명, 법인명, 소재지 도로명주소, 마을기업 인증연월, 마을기업 주요상품, 관리기관명 등의 항목으로 구성되어 있으며, 도내 마을기업의 기본 현황 정보를 확인할 수 있습니다. 이를 통해 이용자는 지역별 마을기업의 소재 현황과 인증 시기, 기업별 주요 생산품목 및 관리기관 정보를 확인할 수 있습니다. 아울러 지역 주민과 이용자는 마을기업의 위치와 주요상품 정보를 참고하여 지역자원 및 지역 특화상품 현황을 이해하는 데 활용할 수 있습니다.헤당 데이터는 26년 4월 기준 현황 자료이므로 이용 시 참고하시기 바랍니다.
