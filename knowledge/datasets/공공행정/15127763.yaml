summary_user: KOSIS(국가통계포털)에 실린 국내 주요 통계 지표와 북한·국제(G20) 지표에 대해 지표ID·지표명·단위·수록주기·수록 시작/종료 시점·지역구분을 지표 단위로 담은 메타정보 조회 API이며, 통계값 자체가 아니라 지표 목록·설명 정보이고 범위는 전국·비공간이다. 분석가나 개발자가 '물가나 고용 관련 지표가 어떤 주기로 언제부터 언제까지 수록돼 있고 단위는 무엇인가'를 확인해 필요한 지표를 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 지표ID(statJipyoId)·지표명을 이름·코드 매핑으로 같은 기관의 KOSIS 통계값 조회 데이터와 이어 쓴다.
description_portal: "'국가데이터처_KOSIS 지표정보 조회 서비스'는 국가데이터처가 운영하는 KOSIS(국가통계포털)의 방대한 통계 데이터를 외부 시스템 및 사용자가 원활하게 연동·활용할 수 있도록 지원하는 오픈 API(REST 방식) 서비스입니다.본 서비스는 KOSIS에서 엄선한 'KOSIS 100대 지표'를 비롯하여 인구, 가구, 고용, 노동, 경기, 물가, 가계 등 우리 사회의 각 부문에 걸친 국내 주요 통계 지표를 총망라하여 제공합니다. 이뿐만 아니라 북한의 통계 정보 및 국제(G20) 통계 지표까지 폭넓게 아우르고 있어, 국내외 경제·사회 트렌드를 다각도로 분석하는 데 유용합니다.사용자는 오픈 API를 통해 실시간으로 업데이트되는 데이터를 요청하여 JSON 또는 XML 형태로 안전하게 전달받을 수 있습니다. 이를 통해 복잡한 통계 데이터의 구조를 체계적으로 파악할 수 있으며, 공공 및 민간 영역의 개발자와 연구자들은 필요한 핵심 지표만을 효율적으로 선별하고 가공할 수 있습니다.궁극적으로는 해당 데이터를 기반으로 한 맞춤형 웹·앱 서비스 개발, 시각화 대시보드 구축, 학술 연구 및 데이터 기반의 정책 수립 등 다양한 지능형 서비스 및 비즈니스 모델 창출에 적극적으로 활용할 수 있습니다."
