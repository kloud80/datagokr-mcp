description_portal: 한국전력공사에서 제공하는 친환경 제품 구매 실적 데이터입니다.한전에서 일정기간동안 구매한 친환경 제품의 내역과 그 비중을 정리한 자료 입니다.(19년 실적)구분, 총구매금액, 제외승인, 제외후금액, 녹색금액, 구매율 항목으로 구성되어있습니다.해당 데이터를 통해 기관의 친환경 소비 이행 수준을 가늠하는 지표로 활용될 수 있습니다.총 구매금액 대비 녹색구매금액과 구매율을 분석하면 해당연도의 환경경영 실천 정도를 평가할 수 있고 이를 여러 연도의 데이터와 비교하여 기관의 친환경 구매 추세 변화를 파악할 수 있습니다.또한 친환경 제품 의무구매제도 준수 여부를 검토하고 향후 구매 정책을 개선하는데 활용할 수 있습니다.
