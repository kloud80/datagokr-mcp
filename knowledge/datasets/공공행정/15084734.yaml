summary_user: 양산시 관내 관공서별로 연·월 단위 유동인구를 담은 집계 데이터로, 연령대별(20대 이하~60대 이상) 방문인구와 직장인구를 함께 제공합니다. 시청·주민센터 등 관공서의 민원 운영 담당자나 분석가가 "어느 관공서에 어떤 연령대 방문객이 많은가"를 보고 대기 공간·인력 배치를 검토하는 데 쓴다. 전역 조인 키가 없어 관공서명(site_nm)과 연·월을 기준으로 이름을 맞춰 다른 양산시 유동인구·상권 자료와 이어 쓴다.
limits: 행정동·법정동 코드나 좌표 같은 공통 키가 없어 다른 데이터와는 관공서 이름 매칭으로만 연결된다. 범위는 양산시 한 곳의 관공서에 한정되며 시간대별 패턴이나 개인 단위 정보는 담지 않는다.
