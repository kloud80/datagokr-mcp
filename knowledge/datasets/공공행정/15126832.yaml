summary_user: 공공기관 지방이전에 따라 한국자산관리공사가 매입한 종전부동산을 건별로 담으며, 이전공공기관명·읍면동 단위 소재지·용도지역·부지와 건물 면적·매입금액·계약일과 인수일·관리상태를 전국 범위로 제공한다. 지방으로 옮긴 특정 공공기관의 옛 청사가 얼마에 매입됐고 지금 어떤 상태로 관리되는지 확인하려는 연구자나 해당 부지 활용을 검토하는 사업자가 쓴다. 전역 조인 키(필지고유번호 등)가 없어 다른 국유재산·토지 데이터와는 읍면동 주소나 기관명을 이름으로 맞춰 이어 쓴다.
description_portal: 한국자산관리공사에서 공공기관 지방이전 정책 지원을 위해 매입한 종전부동산의 이전공공기관, 부동산소재지, 매입가격 등의 데이터입니다.기준연도를 통해 특정 시기의 자산 현황을 조회할 수 있고, 이전기관명은 소유권 이관 과정을 파악하는 데 활용됩니다. 또한 읍면동 단위까지의 주소 정보를 제공하여 위치 기반 분석이 가능하며, 용도지역 내용을 통해 해당 부지의 개발 가능성이나 규제 조건을 검토할 수 있습니다. 면적 데이터는 부지와 건물을 구분하여 제공되어 활용도가 높고, 매입금액과 계약·인수일자를 통해 실제 거래 과정을 추적할 수 있습니다.
