summary_user: 제주특별자치도에서 적용된 시내버스(성인)·택시 기본요금·도시가스·상하수도·쓰레기봉투 등 생활 공공요금을 기준 연월·시군구·항목별 요금(원)으로 정리한 집계 통계로, 포털 설명상 범위는 2011년 1월부터 2021년 7월까지다. 분석가나 도민이 '제주의 택시 기본요금이나 상수도 요금이 언제 얼마나 올랐나'처럼 공공요금 변동 추세와 생활비 부담을 살필 때 쓴다. 전역 조인 키가 없어 다른 물가·소비 데이터와는 기준 연월과 시군구 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터셋은 2011년 1월부터 2021년 7월까지를 범위로 제주특별자치도 내에서 적용된 공공요금의 변동 내역을 항목별로 체계적으로 집계한 공공 통계자료이다. 포함된 항목은 시내버스 요금(성인), 택시 기본요금, 도시가스, 상·하수도 요금, 쓰레기봉투 요금 등 생활 필수 공공서비스에 대한 요금이다. 이 자료는 도민의 생활비 변화, 공공요금 부담 수준, 민생 안정성과 관련된 정책 분석의 기초 근거가 된다. 지방자치단체나 정책 입안자는 요금 변동 추세를 바탕으로 복지·요금 보조 정책, 물가 안정 대책, 공공서비스 요율 조정 여부 검토 등에 활용할 수 있고, 연구자나 시민은 지역 물가 생활비 실태 분석, 공공요금 변화와 소비 패턴 변화 간의 상관관계 분석 등에 참고 가능한 신뢰성 있는 통계자료이다.
