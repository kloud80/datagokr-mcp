description_portal: '○ 통계개요* 통계명 : 퇴직사유별 공무원(구별)* 통계종류 : 서울시 공무원의 퇴직사유를 구별로 제공하는 일반ㆍ보고통계* 근거법령 :「지방공무원임용령」에 의한 지방공무원 인사에 관한 통계보고* 작성목적 : 서울시 공무원의 전반적인 현황을 파악하여 인사정책의 운영 및 제도개선을위한 기초자료를 수집하고 공직내 인적자원의 주기별 변동사항 기록유지등에 활용하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울특별시 인사과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 각 자치구 공무원의 직류별ㆍ직급별 퇴직사유(의원면직, 정년퇴직 등)○ 용어설명* 정무직 : 선출직 공무원과 같이 담당 업무의 성격이 정치적 판단이나 정책결정을필요로 하는, 중앙정부의 차관급 이상 공무원과 특별시의 행정부시장, 정무부시장 등특수경력직 공무원* 별정직 : 전문위원ㆍ상임위원ㆍ비서 등 공무원법상 특수경력직의 별정직으로규정되어 있거나 다른 법령ㆍ조례에서 별정직으로 지정하는 공무원* 일반직 : 행정일반 또는 기술연구에 대한 업무를 담당하며, 실적과 자격에 의해임용되고 신분이 보장되는 경력직 공무원'
