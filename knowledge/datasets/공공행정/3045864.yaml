summary_user: 부산광역시 강서구에 업무신고한 행정사를 한 곳씩 담은 등록 현황 파일로, 신고날짜·행정사 종류·사무소 명칭·소재지·전화번호·영업여부를 담는다(약 3KB 규모의 CSV). 강서구 주민이나 사업자가 근처에서 영업 중인 행정사 사무소와 연락처를 찾거나, 분석가가 구 내 행정사 종류별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 사무소 명칭을 매칭해 잇거나, 다른 시군구의 같은 이름 행정사 현황 파일과 나란히 붙여 쓴다.
