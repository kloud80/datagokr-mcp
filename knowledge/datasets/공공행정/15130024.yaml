summary_user: 한국국토정보공사가 전자조달 시스템으로 체결한 물품 계약을 계약 한 건당 한 행으로 담은 파일(csv, 약 785KB)로, 계약번호·계약명·체결일자·계약기간·총계약금액·계약체결방법·근거법률 등을 포함한다. 조달 연구자나 사업자가 이 기관이 어떤 물품을 어떤 방식(수의·경쟁 등)과 금액으로 사들였는지, 비슷한 물품의 계약 단가를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 용역·공사 계약현황 등과는 계약기관코드나 계약번호·계약명 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 한국국토정보공사가 전자조달 시스템을 통해 체결한 계약현황 중 물품에 대한 정보를 조회할 수 있도록 구성된 자료입니다. 계약번호, 계약명, 계약일자, 계약금액 등 주요 항목이 포함되어 있으며, 공공조달 과정의 투명성을 높이고 물품 조달의 효율적 관리를 지원합니다. 해당 데이터는 기관 내부의 구매 분석뿐만 아니라 외부 연구, 정책 수립, 유사 물품 비교 등 다양한 분야에서 활용이 가능하며, 공정한 조달문화 조성과 부정방지에도 기여할 수 있습니다. 또한, 지속적인 물품 구매 이력 관리와 조달 패턴 분석을 통해 예산의 합리적 운용과 업무 효율성 향상에도 도움을 줄 수 있습니다.
