description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 영상 회의록 중 발언 내용 정보를 제공합니다. 시의회 본회의와 위원회 회의를 영상으로 기록한 자료에서 각 발언자의 발언 내용을 텍스트로 정리한 정보를 담고 있습니다. 고유번호는 각 발언을 식별하는 코드이며, 영상 회의록 고유번호는 상위 회의록과의 연결 관계를 나타냅니다. 발언자는 해당 발언을 한 의원이나 집행부 인사의 이름을 표시하고, 발언 내용은 실제 발언한 내용을 기록합니다. 영상 키 프레임 사용 여부는 해당 발언 시점의 영상 연결 가능 여부를 나타냅니다. 본 데이터는 의정 활동 기록, 회의 내용 검색, 발언 분석, 의정 투명성 강화 등에 활용됩니다.
