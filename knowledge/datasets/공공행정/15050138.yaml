description_portal: '경기도 하남시 지방세에 관한 수납세목 수납관련 세목 코드 정보입니다. 세목명, 세목코드의 정보가 들어 있으며, 각각의 세목을 통해 어떤 세금 종류가 있는지 확인이 가능 할  것 같습니다. 그리고 각각의 세목이 정확한 명칭으로 되어 있어 해당 세목들을 인터넷 또는 챗GPT를 통해 검색하면 보다 자세하게 그리고 정확한 설명을 받아 볼 수 있습니다. 그리고 CSV파일로 제공되어 다른 공공 데이터와 연계되어 세목들의 종합적인 판단이 가능할 것 같습니다.주요 지방세 현황 정리자동차세: 자동차 또는 건설기계 보유 시 부과재산세: 부동산 소유자에게 부과취득세: 부동산이나 차량 등 취득 시 납부등록면허세: 각종 등록, 면허, 인허가 시 부과지방소득세: 국세 소득세에 연동하여 부과온라인 납부 방법위택스(www.wetax.go.kr)인터넷지로(www.giro.or.kr)지방자치단체 세무포털오프라인 납부 방법은행 창구 (지로 납부서 이용)자동이체 등록 (계좌, 신용카드)CD/ATM 기기기타 납부방법모바일 간편납부 (카카오페이, 네이버페이 등)ARS 납부 (지자체별 번호)'
