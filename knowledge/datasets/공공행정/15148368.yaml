description_portal: 이 데이터는 경남개발공사에서 고객을 대상으로 수행한 만족도 설문조사 결과를 정리한 자료입니다.설문조사는 공사에서 제공하는 다양한 민원 서비스 또는 고객 응대 서비스에 대해 실제 서비스를 이용한 고객이 직접 평가한 결과로,공사의 고객중심 행정서비스 품질을 점검하고 개선하기 위한 목적으로 시행되었습니다.고객의 응답은 주관식과 객관식으로 구성되어 있으며, 객관식의 경우 ‘매우 만족’, ‘만족’, ‘보통’, ‘불만족’, ‘매우 불만족’과 같이 5점 척도로 평가되며,주관식은 고객이 자유롭게 서술한 불만사항 또는 개선 의견 등이 포함됩니다.이 데이터는 응답자 단위가 아닌 설문 문항 단위로 저장되며, 한 명의 응답자가 여러 개의 문항에 응답한 구조로 되어 있습니다.
