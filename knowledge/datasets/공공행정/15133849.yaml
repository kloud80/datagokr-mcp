summary_user: 경기도의회 의정업무에서 자료 요구 등 개별 요청 건마다 담당 실국·부서·담당자를 지정한 단계와 상태, 각 단계 등록일자, 지연 사유·예정일, 협조 요청 내용을 기록한 건별 원천 데이터이며 범위는 경기도 한 곳이다. 분석가나 도민이 '의회 자료 요구가 어느 부서에 배정되고 얼마나 지연되는가'를 따질 때 담당 배정 현황과 부서 간 협조 구조 분석에 쓴다. 전역 조인 키는 없고, 요구 일련번호(dmnd_seq_no)와 부서 코드는 같은 경기도의정포털의 다른 데이터와 이름·코드 매핑으로만 이어 쓴다.
description_portal: 경기도의정포털_담당지정정보는 경기도 의회와 관련된 행정업무에서 특정 사안이나 자료 요구에 대한 담당 실국, 부서, 담당자를 지정하고 그 과정을 기록한 데이터입니다. 주요 항목으로는 번호, 담당지정정보 단계(실국·부서·담당자), 담당지정정보 상태, 담당지정정보 실국/부서/담당자 관련 코드 및 등록일자, 지연 사유 및 지연 예정일자, 협조 요청 관련 항목 등이 포함되어 있습니다. 이 데이터는 특정 의정업무 요청이 어떤 절차를 통해 담당자가 지정되는지, 협조 요청이 어떻게 이루어지는지를 체계적으로 보여주며, 행정 절차의 투명성 제고, 담당 배정 현황 분석, 부서 간 협력 구조 파악에 활용될 수 있습니다.
