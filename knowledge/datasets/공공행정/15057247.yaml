summary_user: 지방자치단체별·회계연도별로 행정운영경비(인건비·사무관리비·공공요금·여비·업무추진비 등) 예산액과 일반회계 전체 예산액, 그 비율을 담은 전국 단위 집계 지표입니다. 주민이나 분석가가 '우리 지자체 일반회계 예산 중 행정운영에 쓰는 몫이 다른 지자체보다 큰가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치단체 코드(laf_cd)·이름 매핑이나 같은 지방재정365 계열 데이터의 기관 코드로만 다른 지방재정 지표와 연결한다.
description_portal: 지방자치단체의 투행정운영경비는 자치단체의 기본적인 행정기능을 수행하기 위해 소요되는 인건비, 사무관리비, 공공요금, 여비, 업무추진비 등 일상적인 운영에 필요한 경비를 말합니다. 이는 주민서비스 제공, 조직유지 및 공무원 활동 지원 등을 위한 필수적인 지출로 각 부서별로 공통적으로 편성되는 경비입니다.행정운영경비비중 정보는 2008 회계연도부터 정보가 제공되고 있습니다. 제공되는 세부항목으로는 헹정운영경비 예산액과 일반회계 전체 예산액을 나눈 비율 정보가 제공됩니다.
