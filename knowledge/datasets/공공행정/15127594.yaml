summary_user: 충청북도 진천군이 관리하는 공유재산 중 일반재산을 재산 한 건씩 담은 원장 파일로, 소유 구분(국유·도유·군유 등), 재산 용도(청사·창고·주차장 등), 소재지 주소, 면적(㎡)을 담는다(CSV 약 142KB, 시군구 범위의 개별 주소 단위). 주민이나 분석가가 '진천군 안에 활용되지 않는 군유 일반재산이 어디에 얼마나 있나'처럼 유휴 공공자산의 위치와 규모를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 이름·코드 매핑으로만 연결한다.
description_portal: 이 데이터는 「공유재산 및 물품관리법」에 따라 충청북도 진천군이 관리하고 있는 공유재산 중 일반재산의 정보를 제공합니다.해당 데이터는 공유재산의 소유 구분(국유, 도유, 군유 등), 재산의 용도 분류(청사, 창고, 주차장 등), 소재지 주소, 면적(㎡) 등을 포함하며, 공공자산의 보유 현황과 분포를 이해하는 데 유용한 자료입니다.지방자치단체의 재산 운영 현황 파악, 공공자산 활용 정책 수립, 유휴 자산 실태 분석, 투명한 자산 공개 등을 목적으로 활용할 수 있으며, 국민의 알권리 충족과 행정정보의 개방 차원에서도 중요한 공공데이터입니다.도시계획, 지역개발, 공공시설 수요분석 등의 분야에서도 참고될 수 있는 기반자료로 활용됩니다.
