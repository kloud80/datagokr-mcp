description_portal: 경상북도개발공사에서 추진하는 개발사업의 토지 이용 계획을 체계적으로 관리하고 대국민에게 투명하게 제공하기 위해 구축된 토지계획용도 데이터입니다. 데이터에는 각 사업을 구분하기 위한 사업코드와 사업명, 해당 사업 내 토지계획을 식별하는 계획일련번호가 포함됩니다. 또한 공급용도번호를 통해 해당 필지의 분류된 용도 정보를 제공하며, 필지면적을 통해 계획된 토지 규모를 확인할 수 있습니다. 입력일시와 수정일시 항목을 포함하여 계획 정보의 최신성, 변경사항, 관리 이력을 명확하게 파악할 수 있도록 구성되었습니다.
