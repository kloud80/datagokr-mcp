summary_user: 서울 동대문구가 운영하는 주민 공구대여소의 목록을 대여소 한 곳당 한 행으로 담은 파일로, 대여소명·도로명 주소·위도·경도와 비치 공구, 대여료, 대여기간, 운영시간, 연락처를 포함한다(CSV 약 7KB). 동대문구 주민이 '우리 동네 가까운 대여소에서 어떤 공구를 언제, 얼마에 빌릴 수 있나'를 찾거나, 분석가가 구 단위 공유시설 분포를 지도에 올리는 데 쓴다. 전역 조인 키나 코드표는 없으므로, 다른 데이터와는 위도·경도나 도로명 주소를 이용한 위치 매칭, 또는 대여소 이름 매핑으로만 연결한다.
limits: 범위가 동대문구 한 곳에 한정되므로 다른 자치구나 서울 전체의 공구대여소를 비교하는 데는 쓸 수 없다. 법정동·시설 코드 같은 공통 키가 없어 다른 데이터와 붙이려면 주소·좌표나 이름을 직접 맞춰야 한다.
