description_portal: 동대문구에서는 생활 속에서 필요한 공구를 주민들이 편리하게 이용할 수 있도록 공구대여소 서비스를 운영하고 있습니다. 공구대여소는 가정에서 일시적으로 필요한 공구를 직접 구매하지 않고도 무료로 빌려 사용할 수 있도록 지원하는 생활밀착형 주민 편의 서비스입니다.해당 서비스의 주요 목적은, 가정에서 사용 빈도가 낮은 공구를 공유하여 자원의 효율적인 활용을 도모하고, 불필요한 소비를 줄이며, 주민들의 생활 편의를 높이고 지역 내 공유 문화를 확산하는 데 있습니다.공구대여소는 동대문구 주민이라면 누구나 이용할 수 있으며, 대여 기간과 이용 방법, 대여 가능 공구 종류 등은 운영 기관 및 시설에 따라 일부 차이가 있을 수 있습니다. 공구 이용을 원하시는 경우에는 사전에 공구대여소 담당자에게 문의하여 대여 가능 여부를 확인하시기 바랍니다.동대문구는 공구대여소 운영을 통해 주민들이 보다 편리하게 생활에 필요한 도구를 이용할 수 있도록 지원하고 있습니다. 주민 여러분의 많은 관심과 이용을 바랍니다.
