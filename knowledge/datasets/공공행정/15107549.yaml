summary_user: 중소벤처기업진흥공단이 기업가치 1,000억 원 이상으로 평가해 K-예비유니콘으로 선정한 기업 명단을 기업 한 곳당 한 행으로 담은 작은 파일(CSV 약 1.3KB)로, 업체명·대표자명·주생산품과 담당 지역본지부를 함께 싣는다. 투자자나 지역 정책 담당자가 어느 지역의 어떤 업종 기업이 예비유니콘으로 뽑혔는지, 특정 기업이 선정 대상인지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 기업 재무·고용·정책자금 지원 이력 같은 다른 기업 단위 데이터와 이어 쓴다.
description_portal: 중소벤처기업진흥공단에서 선정한 K-예비유니콘 기업 명단입니다. 정부의 K-유니콘 프로젝트를 뒷받침하고 지역균형 정책성과를 창출하기 위해 K-예비유니콘을 발굴하고 중점육성하고자 선정하였습니다.기업가치평가를 통해 1,000억 이상의 기업가치를 인정받은 유망기업의 현황입니다.추진배경은 지역 내 유망기업을 선정하고 선정된 후보기업을 대상으로 선별과 집중을 통한 밸류업을 지원하여 효율적인 정책성과를 달성하는데 있습니다.선정은 기업가치 1000억원 이상 15개사의 K-예비유니콘 선정 여부를 심의안건으로 부의하고 선정위원 2/3 이상의 찬성으로 의결하였습니다.
