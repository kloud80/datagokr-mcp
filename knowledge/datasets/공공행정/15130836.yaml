summary_user: 국민권익위원회 민원빅데이터 분석정보 API(2022, 2023)가 제공하는 오퍼레이션 목록을 오퍼레이션 이름, 제공 방식, 기능 설명 단위로 담은 소용량 CSV 파일(3,625바이트)이다. 민원 분석 API를 호출하려는 개발자·분석가가 '지역·기관·키워드·월별 민원 신호를 받으려면 어떤 오퍼레이션을 불러야 하나'를 확인하는 데 쓴다. 파일 자체에는 전역 조인 키가 없어 다른 데이터와 직접 결합하지 않고, 실제 민원 분석 API 응답을 받은 뒤 그 행정구역코드로 인구·실거래·상가 데이터와 잇는 안내서 역할을 한다.
description_portal: 국민권익위원회에서 운영 중인 ‘민원빅데이터 분석정보 API 2022, 2023’의 오퍼레이션(기능 목록)을 제공합니다. 이를 통해 민원 관련 데이터 중 어떤 항목에 접근할 수 있는지, 어떤 방식으로 데이터를 분석하고 활용할 수 있는지를 확인할 수 있습니다. API 사용자는 각 오퍼레이션의 기능을 참고하여 민원 유형별 통계, 지역별 민원 분포, 시기별 민원 발생 추이 등 다양한 분석 정보를 자동화된 방식으로 수집하고 활용할 수 있습니다. 공공정책 개발이나 민원 예측 분석 등에서 활용도가 높습니다.
