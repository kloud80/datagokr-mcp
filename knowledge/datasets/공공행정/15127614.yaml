description_portal: 본 데이터는 공익성과 영리성을 함께 추구하는 사회적기업의 현황 정보를 포함하며, 사회적기업명, 기업 구분, 사회적 목적, 주소(도로명/지번), 인증연월, 대표자 정보, 직원 수, 업종, 목적사업 분야, 관리기관 정보, 기준일자 등의 항목으로 구성되어 있습니다. 사회적기업은 취약계층 고용, 지역사회 문제 해결 등 사회적 가치 실현을 위한 경제주체로, 비영리조직과 영리기업의 중간 형태로 운영됩니다. 해당 데이터는 사회적경제 생태계 분석, 정책지원 대상 선별, 지역별 기업 분포 및 사회적가치 실현 성과 평가 등 다양한 행정·연구·정책 수립에 활용 가능합니다.
