summary_user: 법제처가 제공하는 행정규칙의 목록을 규칙 단위로 담은 외부 API로, 행정규칙명·종류·소관부처·발령일자·시행일자·제개정구분·상세링크 등을 전국 범위로 조회한다. 분석가나 서비스 개발자가 특정 부처의 행정규칙이 언제 발령·개정됐는지, 현재 시행 중인지를 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않아 행정규칙ID·일련번호나 상세링크로 같은 기관의 본문 조회 API와 잇거나, 소관부처명 같은 이름 매핑으로 다른 자료와 연결한다.
description_portal: 법제처에서 제공하는 행정규칙 목록 조회 서비스 데이터입니다. 행정규칙의 일련번호, 규칙명, 소관부처, 제정·개정일자, 시행일자, 규칙코드, 행정분야 구분 등의 항목을 체계적으로 확인할 수 있습니다. 규칙명, 부처명, 규칙코드 등을 파라미터로 지정하여 원하는 목록을 선택적으로 조회할 수 있도록 설계되어 있고 응답에는 총 결과 수와 페이지 정보, 각 규칙의 상세 정보 링크가 포함되어 있습니다. 이 데이터를 활용하여 행정규칙 현황 분석, 규제 정비 현황 점검, 내부 관리 시스템 연동 등에 유용합니다. 또한 모바일 애플리케이션이나 웹서비스에서 최신 규칙 목록 제공, 규칙 검색 기능 강화 등을 위한 핵심 자료로 적합합니다.
