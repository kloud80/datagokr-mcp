summary_user: 국회사무처가 정보공개청구와 관련해 제기된 행정소송의 판결 현황을 건별로 담으며, 연도(YR)·일련번호·사건명·판결일·처분 사유·청구 취지·판결 결과·공개 파일명 같은 항목으로 구성된다. 시민단체·연구자·언론이 국회사무처의 비공개 처분이 소송에서 어떻게 판단됐는지, 어떤 사유의 비공개가 취소됐는지 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 연도나 기관 코드(INST_CD), 사건명 매핑으로만 이어 쓴다.
