description_portal: 대구광역시 자전거 공기주입기 설치는 자전거 보관대 설치사업의 세부사업으로, 구·군으로 예산을 재배정하여 자전거 이용자들에게 필요한 위치에 공기 주입기를 신설하고, 노후화된 시설물 유지보수하여 자전거 이용자의 편의를 증진하기 위한 시설물이며、 각 구·군에서 해당 시설물에 대한 수요를 파악하여 신규설치, 교체 및 수리를 하고 있으며 매년 자전거 보관대 설치사업 정산 시 공기주입기 설치현황 및 설치위치에 대해 정산보고를 하여 데이터를 수집하고 있음。공기주입기는 자전거 이용 활성화를 위한 시설물로 태양광 방식과 전기식 방식이 있으며 시민의 이용 편의를 위하여 도심 곳곳에 설치되어 있으며 상세자료는 현황 데이터로 확인할 수 있음。
