description_portal: 본 데이터는 한국토지주택공사의 자체 연구기관에서 수행하는 연구 프로젝트에 대한 연구 외 성과관리 항목과 그 연구 마일리지 값 현황을 제공합니다. 기본적으로 성과는 연구 성과와 연구외 성과로 구분할 수 있는데 연구 성과는 문자 그대로 연구 프로젝트를 수행한 결과로 평가하는 성과를 말하고 연구외 성과는 연구 프로젝트 외의 다른 활동을 통해 달성하는 성과를 말합니다. 몇가지 사례로는 정부정책 개선 지원, 전문 서적 발간 및 저술, 대외 언론 홍보 및 인터뷰, 지식재산권 등록, 외부 심의 자문위원 참여, 법제도 개선, 원가절감 등이 있습니다. 이러한 연구외 성과 마일리지는  공공기관의 연구활동이 학문적인 영역에만 메몰되는 것을 방지하고 연구자가 다양한 수단과 목적을 통해 사회 발전에 기여하는 것을 목적으로 하고 있습니다.
