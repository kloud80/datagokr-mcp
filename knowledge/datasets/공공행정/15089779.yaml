description_portal: '사회적 취약계층의 권리구제 보호를 위하여 노동위원회에서 처리중인 사건의  노동위원회별(중앙노동위원회, 지방노동위원회 등) 심판사건(부당해고, 부당노동행위) 판정 건수, 화해 건수, 취하건수, 권리구제 건수 등을 제공-2024년 노동위원회 전체 권리구제 건수는 7,712건이며, 그 중 심판 사건 7,648건 및 차별 시정 사건 64건 권리구제* 부당해고 사건(또는 부해 사건): 부당해고등(해고, 휴직, 정직, 전직, 감봉, 그 밖의 징벌)을 당한 근로자가 노동위원회에 부당해고등에 대한 구제를 신청한 사건   부당노동행위 사건(또는 부노 사건): 사용자의 부당노동행위로 권리를 침해당한 근로자 또는 노동조합이 노동위원회에 부당노동행위에 대한 구제를 신청한 사건   차별시정 사건(또는 차별 사건): 차별적 처우를 받은 기간제, 단시간, 파견근로자 및 일학습병행근로자가 노동위원회에 차별적 처우에 대한 시정을 신청하거나, 고용노동부 장관이 노동위원회에 차별적 처우를 통보한 사건'
