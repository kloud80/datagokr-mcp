description_portal: 이 데이터셋은 가변 전광판(VMS) 시설의 운영 및 설치에 대한 상세 정보를 포함하고 있습니다. 2007년 4월 24일부터 2023년 10월 16일까지의 기간 동안 설치된 시설들의 위치명, 설치일, 그리고 연결 도로 아이디와 같은 기본 정보를 제공합니다. 또한, VMS의 모델명(도형식, 측주식, 문형식, 주민밀착형)과 일일 가동 시각 정보도 포함되어 있어, 각 시설의 특성과 운영 현황을 파악하는 데 유용합니다. 이 정보는 도로 교통 정보 제공 시스템을 관리하고 효율적으로 운영하기 위한 중요한 기반 자료로 활용될 수 있습니다.
