description_portal: 이 데이터는 2023년 3월 21일 기준 충청남도의 금연구역 현황을 정리한 자료입니다. 금연구역명은 해당 구역의 이름을, 금연구역범위상세는 흡연이 금지되는 세부 범위를 나타냅니다. 시도명과 시군구명은 행정 구역 단위의 위치 정보를 제공하며, 금연구역구분은 공원, 버스정류장, 학교 주변 등 금연구역의 성격을 구분합니다. 또한, 금연구역지정근거명은 법적 또는 제도적 지정 사유를 설명하고, 금연구역면적은 구역의 크기를 수치로 제공합니다. 위반과태료는 흡연 적발 시 부과되는 벌금을 나타내며, 위반신고전화번호는 주민이나 이용자가 위반 사례를 신고할 수 있는 연락처입니다. 소재지도로명주소와 소재지지번주소는 구체적인 위치 정보를 제공하고, 관리기관명은 해당 금연구역을 관리·감독하는 기관을 나타냅니다. 마지막으로 위도와 경도는 공간정보 분석에 활용될 수 있으며, 데이터기준일자는 데이터의 최신성을 보장합니다. 이 자료는 충청남도의 공중보건 정책 수립, 금연 정책 효과 분석, 지역별 금연구역 분포를 파악하는 데 유용한 기초자료로 활용됩니다.
