summary_user: 가맹사업 브랜드별 연혁을 기준년도와 브랜드관리번호로 조회해 연혁 일련번호 단위로 가맹본부 상호·영업표지명·대표자·본부 주소·가맹사업 경영기간을 담는 건별 원천 데이터이며, 범위는 전국이다. 창업 예정자가 "이 브랜드는 언제부터 가맹사업을 했고 본부 상호나 대표자가 바뀐 적이 있나"를 확인해 가맹본부를 믿어도 되는지 판단하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키는 없어서, 같은 기관 가맹정보 서비스와는 브랜드관리번호·가맹본부관리번호로, 다른 데이터와는 상호명·주소 같은 이름 매핑으로만 잇는다.
description_portal: 이 API는 공정거래위원회에서 제공하는 가맹정보_브랜드 연혁 정보 제공 서비스 입니다.  브랜드 연혁에 대한 기준년도, 브랜드관리번호를 이용하여 가맹사업경영기간내용,  가맹본부주소,  가맹사업기준년도, 브랜드관리번호, 가맹본부관리번호, 연혁일련번호, 가맹본부상호명, 영업표지명, 대표자명 등의 정보 조회 서비스를 제공합니다.
team:
  dept: 정보화담당관실
services:
  - op: /getbrandHistinfo
    name: 브랜드연혁조회
    endpoint: https://apis.data.go.kr/1130000/FftcbrandhistinfoService/getbrandHistinfo
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: resultType
        required: true
        example: json
        desc: 결과형식(xml/json)
      - name: jngBizCrtraYr
        required: true
        example: '2017'
        desc: 가맹사업기준년도
      - name: brandMnno
        required: true
        example: BRD_20080100007
        desc: 브랜드관리번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 100000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
