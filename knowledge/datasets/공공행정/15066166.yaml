description_portal: '인천광역시 중구 금연아파트 지정 현황에 대한 정보입니다. (관리부서 : 인천광역시 중구보건소 건강증진과, 국제도시보건과)금연아파트는 국민건강증진법 제9조제5항에 따라 주택법 제2조제3호에 따른 공동주택의 거주 세대 중 2분의 1 이상이 그 공동주택의 복도, 계단, 엘리베이터 및 지하주차장의 전부 또는 일부를 금연구역으로 지정하여 줄것을 신청하면 그 구역을 금연구역으로 지정한다.  인천광역시 중구_금연아파트 지정 현황입니다. 내용은 연번, 공동주택명(아파트명), 총세대수, 최초지정일, 소재지(도로명 주소), 데이터기준일 항목을 제공합니다.'
