summary_user: 경기도 행정동(읍면동) 단위로 주민등록 기준 총인구수·세대수·세대당 인구수·남녀 인구수와 성비를 기준연월별로 집계한 통계로, 건별 원천이 아닌 집계 자료다. 지자체 담당자나 분석가가 '우리 시 어느 동의 세대당 인구가 가장 적어 1인 세대가 몰려 있는가'처럼 동별 인구 규모와 성별 구성을 비교하는 데 쓴다. 행정동코드(admdong_cd)와 행정동명이 있으나 실측상 전역 조인 키로 확인되지 않아, 다른 데이터와는 코드·이름 매핑이나 같은 기관(경기도) 코드 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 행정동을 단위로 주민등록에 기반한 인구 및 세대 현황을 집계한 통계자료입니다. 2017년 기준으로 작성된 이 데이터는 '기준연월', '행정동코드', '행정동명', '총인구수', '세대수', '세대당인구수', '남성여성비율', '남성비율', '남성인구수', '여성인구수'의 항목으로 구성되어 있으며, 지역별 인구 분포와 성별 구성, 가구 규모 등의 세부 현황을 파악할 수 있습니다. 해당 자료는 지역 사회의 인구 구조를 파악하고, 성비 불균형, 단독세대 증가 등의 사회 변화 추이를 이해하는 데 활용될 수 있으며, 인구 정책, 복지 서비스, 도시 계획 수립에 필요한 기초자료로도 이용될 수 있습니다.
