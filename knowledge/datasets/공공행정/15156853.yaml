summary_user: 국고보조사업을 상세내역사업 단위로 묶어 사업명·목적·규모 설명, 사업기간, 수행기관, 소관, 그리고 국고보조금·지자체부담금·자부담금·기타부담금으로 나눈 재원 구성과 당해연도 사업금액을 담는 건별 원장이며, 범위는 전국이다. 사업자나 국민이 '올해 우리 분야에 신청할 수 있는 국고보조 공모사업이 있고 국비와 자부담 비율은 어떤가'를 확인하거나, 분석가가 소관 부처별 보조사업 재원 구조를 비교하는 데 쓴다. 내역사업ID·상세내역사업ID와 소관코드로 같은 기관의 다른 보조금 데이터와 묶을 수 있으나, 실측 컬럼에서 전역 조인 키는 확인되지 않아 외부 데이터와는 사업명·기관명 매핑으로 연결해야 한다.
description_portal: 국고보조사업의 내역사업, 보조사업, 공모 관련 정보를 종합적으로 제공하는 데이터입니다.사업 목적·규모·지원내용·신청방법·선정기준·재원 구성 등을 한 번에 확인할 수 있습니다.국고보조사업 전반에 대한 이해를 높이고, 정책·분석 목적의 활용을 지원합니다.국고보조사업의 내역사업과 보조사업 간 구조적 연계 관계를 중심으로 사업 목적, 규모, 기간, 수행기관 및 재원 구성 정보를 제공하는 데이터입니다.사업 체계와 재정 구조를 종합적으로 파악할 수 있어 정책 분석과 통계·연구 활용에 적합합니다.
