summary_user: 경기도 내 시·군별 건설엔지니어링 사업자에 대한 행정처분 이력을 처분 건별로 담으며, 시군명·업체명·처분사유·처분내용(영업정지 기간 등)·근거법령·업체 주소와 WGS84 좌표가 들어 있다. 발주기관이나 사업자가 특정 건설엔지니어링 업체가 기술인력 미달 등으로 영업정지를 받은 적이 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 업체명·시군명·주소를 이름으로 맞추거나 좌표로 지도 위에 겹쳐 다른 데이터와 잇는다.
description_portal: 「건설엔지니어링업 행정처분 현황」 데이터는 경기도 내 시·군별 건설엔지니어링 사업자에 대한 행정처분 이력을 제공하는 자료입니다.주요 항목은 시군명, 업체명, 처분사유내용, 처분내용, 근거법령, 업체 주소, 좌표(WGS84 위도·경도) 등으로 구성됩니다. 처분 사유에는 “등록기준(기술인력) 미달”, “법 제60조제2항에 따른 시정명령 불이행” 등이 있으며, 처분 내용은 주로 영업정지 1개월 ~ 3개월과 같은 제재가 기록됩니다.※ 23.01.25. 건설기술진흥법 개정으로 제공 데이터 명칭이 변경되었습니다.감리전문회사 행정처리 현황(기존) → 건설엔지니어링업 행정처분 현황(변경)
