description_portal: '세종특별자치시시설관리공단은 자연장지의 체계적인 운영과 시민 편의를 위해 자연장 블록 설정 정보를 공공데이터로 제공하고 있습니다. 이 데이터는 자연장(잔디장·수목장 등) 내 세부 구역과 블록 구성을 명확하게 확인할 수 있도록 설계되었습니다.■ 데이터 컬럼 구성자연장구분 - 자연장의 유형 구분   예: 잔디장, 수목장 도심형, 수목장 산림형 등자연장구역구분 - 자연장지 내 구역을 식별하기 위한 구역 코드 또는 구분 값자연장블록구분 - 각 구역 내 세부 블록을 식별하기 위한 블록 구분안치구분명 - 블록별로 적용되는 안치 형태 또는 안치 방식 구분   예: 개인형, 부부형, 가족형 등■ 데이터 제공 목적자연장 블록 설정 데이터는 다음과 같은 목적을 위해 제공됩니다. - 자연장지의 구조적 정보 제공을 통한 시민 편의 증대 - 세부 블록 단위의 체계적 관리 및 운영 효율성 강화 - 구역·블록 단위의 이용 현황 분석 및 정책 수립 지원 - 장사시설 운영의 투명성 강화 및 정확한 안내 서비스 제공세종특별자치시시설관리공단은 앞으로도 자연장지 운영의 공공성과 신뢰성을 높이기 위해, 해당 데이터를 지속적으로 갱신하고 서비스 품질 향상에 기여하겠습니다'
