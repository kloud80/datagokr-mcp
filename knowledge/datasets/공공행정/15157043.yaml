description_portal: (데이터 정의) 본 데이터는 신용보증재단중앙회의 무기계약직(업무지원직) 채용 현황을 연도별로 정리한 공개 데이터로, 기관의 인력 채용 규모와 추이를 객관적으로 파악할 수 있도록 제공되는 자료입니다. 공공기관 채용 정보의 투명성 제고를 목적으로 합니다(데이터 내용) 데이터에는 채용 연도, 채용 인원, 직군 또는 직무 구분 등 무기계약직(업무지원직) 채용과 관련된 기본적인 현황 정보가 포함되어 있으며, 연도별 채용 변화와 인력 운영 현황을 확인할 수 있도록 구성되어 있습니다.(데이터 활용방안) 해당 데이터는 취업 준비생이 채용 규모와 경향을 파악하는 데 활용할 수 있으며, 연구기관·정책 담당자는 공공기관 인력 운영 분석, 고용 정책 수립 및 채용 제도 개선을 위한 기초자료로 활용할 수 있습니다.
