summary_user: 향후 실시될 재·보궐선거의 실시 사유를 선거구 건별로 담으며, 선거실시일·선거유형·재/보궐 구분·시도·위원회·선거구와 함께 사유를 남긴 당사자의 정당·성명, 사유 내용, 사유발생일·사유확정일을 기록한다(전국, 시도 단위). 유권자나 언론·정당 관계자가 다가오는 재보궐선거에서 어느 지역 선거구가 왜(당선무효·사직 등) 선거를 치르게 됐는지, 사유가 언제 확정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 선거 데이터와는 선거실시일·선거유형코드(sgTypecode)·시도명·선거구명 같은 이름·코드 매핑이나 같은 기관(중앙선거관리위원회) 코드로만 이어 쓴다.
limits: 선거 등 이벤트 때 생성된 뒤 바뀌지 않는 이벤트 주기 데이터로, 실시일 이후의 예정 상황을 조회하는 구조라 지나간 선거의 이력 조회에는 맞지 않을 수 있다. 공통 조인 키가 없어 후보자·개표 등 다른 데이터와 연결할 때 이름 매칭 오류에 주의해야 하며, 개발계정은 하루 10,000회로 호출이 제한된다.
