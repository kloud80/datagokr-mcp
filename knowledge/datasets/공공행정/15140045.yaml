description_portal: '후보자 통합검색은 성명 기반의 검색으로 후보자 관련 기초정보 및 기호, 정당명,  직업, 학력, 경력, 선거명, 당선여부등의 정보를 조회할 수 있습니다. ※ 검색 결과에 동명이인(同名異人)의 후보자가 포함될 수 있습니다.◆◇◆ 제공 범위 (2026년 기준) ◆◇◆· 대 통 령 선 거 : 제13대 ~ 제21대· 국 회 의 원 선 거 : 제14대 ~ 제22대· 전국동시지방선거: 제3회 ~ 제8회· 재 보 궐 선 거 : 2010년 이후 실시 선거◆◇◆ 후보자 정보조회와 후보자 통합검색 차이점  ◆◇◆【후보자 정보조회】 선거ID와 선거종류코드를 입력받아 특정 선거에 출마한 후보자의 성명, 생년월일, 성별, 선거구, 학력, 경력, 등록상태 등 상세 정보를 제공합니다.　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　【후보자 통합검색】 한글 성명을 입력받아 후보자를 검색할 수 있는 서비스입니다. 동명이인(同名異人)을 포함한 모든 후보자를 통합적으로 조회하며, 특정 선거에 국한되지 않고 여러 선거의 후보자 정보를 확인할 수 있습니다.'
