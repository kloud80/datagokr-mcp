summary_user: 한글 성명으로 검색한 후보자 한 명·한 선거 출마 건마다 선거명, 선거구·시도·구시군, 기호, 정당명, 직업, 학력, 경력, 등록상태, 당선여부를 담는 건별 원천 데이터로, 대통령선거 제13~21대, 국회의원선거 제14~22대, 전국동시지방선거 제3~8회, 2010년 이후 재보궐선거를 전국 범위로 다룬다. 유권자나 기자가 특정 인물이 과거 어떤 선거에 어느 정당으로 나와 당선됐는지 출마 이력을 한 번에 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았고, 응답의 선거ID(sgId)·선거종류코드와 후보자ID를 같은 기관의 후보자 정보조회·선거 결과 데이터와 맞춰 연결한다.
limits: 검색 결과에 동명이인이 섞이므로 생년월일·한자성명 등으로 사람을 구분해야 한다. 선거 때 생성된 뒤 바뀌지 않는 이벤트성 데이터이며, 다른 기관 데이터와는 공통 키가 없어 이름·코드 매핑으로만 이을 수 있다. 개발계정은 하루 10,000회로 호출이 제한된다.
