summary_user: 성남시의 주요 생필품 품목별로 규격과 백화점·대형마트·전통시장 가격, 이번 주와 지난주 가격, 증감률을 담은 집계형 물가표이며, 포털에서 받는 파일은 약 3.7KB 크기의 CSV 한 건이다. 성남 시민이나 분석가가 '이번 주 배추·계란 값이 지난주보다 얼마나 올랐고 전통시장이 대형마트보다 싼가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지역 물가자료와는 품목명을 맞춰 붙이거나 데이터기준일자로 시점을 맞춰 비교해야 한다.
description_portal: 경기도 성남시 장바구니(생필품)관련 물가정보로 품목, 백화점, 대형마트, 전통시장, 금주가격, 이번주가격, 증감률 등의 항목을 제공합니다. ‘경기도 성남시_장바구니 물가정보’ 데이터는 성남시민의 생활과 밀접하게 관련된 주요 생필품의 가격 현황을 파악하기 위해 구축된 자료입니다. 이를 통해 시기별 물가 변동 추이를 분석하고, 전통시장과 대형마트 간의 가격 차이를 비교함으로써 지역 내 유통 구조를 이해하실 수 있습니다. 또한 물가 상승 요인을 파악하고 서민생활 안정을 위한 정책을 수립하는 기초자료로도 활용됩니다. 이 데이터는 시민들이 합리적인 소비를 할 수 있도록 돕고, 지자체가 생활물가 모니터링과 물가안정 대책을 세우는 데 중요한 근거 자료로서 역할을 합니다.
