summary_user: 서울 강남구의 병원·종합병원·치과병원·한방병원 등 30병상 이상 의료기관을 인허가 건별로 담으며, 인허가일·폐업일, 영업상태, 업태, 진료과목, 소재지 주소와 좌표, 병상 수 등의 항목을 포함한다. 강남구에서 지금 영업 중인 치과병원이나 특정 진료과목 병원이 어디 있는지, 또는 최근 문을 닫은 병원이 있는지 확인하려는 주민·사업자·상권 분석가가 쓴다. 전역 조인 키는 없어 관리번호(MGTNO)나 개방자치단체코드, 사업장명·주소 매칭으로 LOCALDATA 인허가 등 같은 출처의 다른 업종 인허가 자료와 이어 쓴다.
description_portal: '서울시 강남구 병원 인허가 정보(https://data.seoul.go.kr/dataList/OA-16181/S/1/datasetView.do)강남구의 병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관 정보입니다.의료기관의 업태를 구분하여, 예를 들어 일반 병원, 진료과목이 다양한 종합병원, 치과치료를 전문으로 하는 치과병원, 전통 한의학을 기반으로 진료하는 한방병원 등이 명시되어 있습니다.진료과목 항목은 해당 병원이 제공하는 주된 진료 서비스 또는 각 병원이 취급하는 의료 분야를 뜻합니다. 예를 들어, 내과, 외과, 정형외과, 치과, 한방내과 등 세부 진료과목이 포함될 수 있습니다.영업상태명은 현재 그 의료기관이 실제로 영업을 하고 있는지, 아니면 운영을 중단한 상태인지(예: 폐업)와 같은 정보를 표시합니다.'
