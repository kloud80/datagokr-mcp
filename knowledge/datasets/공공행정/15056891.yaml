summary_user: 지방자치단체별·회계연도별로 업무 수행 경비 가운데 업무추진비가 차지하는 비율(rate)과 그 산출에 쓰인 두 결산 금액을 담은 전국 범위의 집계 지표이며, 세부사업 단위 원장은 아니다. 주민·지방의원·재정 분석가가 "우리 시·군·구의 업무추진비 비중이 다른 지자체보다 높은가, 해마다 늘고 있는가"를 비교·점검하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고 지자체 코드(laf_cd)·지자체명과 회계연도로 같은 지방재정365의 다른 지표(재정자립도 등)나 세출 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 지역통합업무추진비비율이란, 지방자치단체가 업무를 수행하는데 필요한 경비 중 업무추진비가 차지하는 비율을 의미합니다. 업무추진비는 주로 의사결정, 업무 회의, 출장, 홍보 등의 목적을 위해 지출되는 비용을 포함합니다.이 비율은 지방자치단체가 업무추진비를 얼마나 효율적으로 운용하는지를 평가하는 지표로 사용됩니다. 비율이 과도하게 높을 경우, 불필요한 비용 낭비나 재정 낭비로 간주될 수 있으므로, 이를 적정하게 관리하는 것이 중요합니다. 따라서 지역통합업무추진비비율은 지방자치단체의 쩡 효율성과 투명성을 유지하는 데 중요한 역할을 합니다.
