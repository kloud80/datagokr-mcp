description_portal: 이 데이터는 연도별 도로점용료의 부과 및 징수 현황을 보여주는 행정 통계 자료입니다. 2011년부터 2014년까지의 기록을 담고 있으며, 각 연도별로 부과된 총 건수와 금액, 실제로 징수된 건수와 금액, 그리고 미징수된 건수와 금액을 상세하게 나타냅니다. 또한, 부과된 금액 대비 징수된 금액의 비율을 나타내는 '징수율' 항목을 포함하여 행정 처리의 효율성을 직관적으로 파악할 수 있게 해줍니다. 이 자료는 특정 지역의 도로 관리 및 공공 재정 운영 상태를 분석하고, 시간에 따른 징수 실적의 변화 추이를 파악하는 데 유용하게 사용될 수 있습니다.
