description_portal: 국민권익위원회는 2008년부터 매년 고충민원의 접수 및 처리 현황을 통계자료로 제공하고 있습니다. 고충민원은 행정기관 등의 위법·부당하거나 소극적인 처분 및 불합리한 행정제도로 인해 국민의 권리를 침해하거나 불편을 초래하는 사항에 대한 민원을 말합니다. 이 자료는 연도별로 접수된 고충민원 건수와 처리 건수를 포함하고 있으며, 국민의 권익 보호와 행정의 투명성 확보를 위한 기초자료로 활용됩니다. 또한, 행정기관의 민원 처리 능력을 평가하고 개선하는 데 중요한 지표로 사용됩니다. ​
