description_portal: 2021년부터 2025년 7월까지 부산광역시 동래구에서 단속한 월별 불법주정차 단속 현황을 정리한 자료입니다. 과거에는 단속차량을 통한 단속, CCTV를 통한 단속이 주를 이뤘다면 최근에는 안전신문고 앱 등을 통한 일반 시민들의 불법주정차 신고가 활발히 이루어지고 있습니다. 이에 따라 신고하는 자와 신고 당하는 자 간의 보이지 않는 갈등이 발생하고 있으며, 담당공무원들의 업무피로도는 가중되고 있는 실정입니다. 불법주정차로 단속될 시에 과태료가 부과되며 체납이 지속될 경우 재산 등에 압류가 들어갈 수 있으니 참고하시기 바랍니다.
