description_portal: 본 데이터는 K-ICT 빅데이터센터 홈페이지의 실제 사용자 접속 로그를 개인정보 보호를 위해 합성 처리한 데이터셋입니다. 데이터는 접속메뉴, 접속일시, 접속시간 등의 항목으로 구성되어 있으며, 웹사이트 이용자들의 행동 패턴과 콘텐츠 이용 현황을 파악할 수 있습니다. 합성데이터 기법을 통해 원본 로그의 시계열적 특성과 메뉴별 이용 패턴은 유지하면서 개인 식별 정보는 완전히 제거하였습니다. 본 데이터는 웹사이트 사용성 개선, UI/UX 최적화, 콘텐츠 전략 수립, 트래픽 분석 및 예측 모델 개발 등에 활용 가능합니다. 특히 시간대별 접속 패턴 분석, 인기 메뉴 파악, 사용자 여정 분석, 웹 서비스 개선 전략 수립 등 디지털 서비스 기획자, 데이터 분석가, 웹 개발자, 연구자들이 웹 로그 분석 연구 및 실무에 활용할 수 있는 실증 데이터입니다. 또한 빅데이터 분석 교육 및 데이터 마이닝 실습용 자료로도 유용하게 사용될 수 있습니다.
