summary_user: 무주군의회에서 열린 회의를 회기·차수 단위로 한 건씩 담은 파일로, 연도·대수·회기·차수, 임시회/정례회 구분, 본회의·상임위·특별위원회 같은 회의 종류, 안건 유무와 안건명, 회의 날짜를 담는다. 주민이나 지역 언론·분석가가 "무주군의회가 올해 몇 차례 회의를 열었고 예산결산특별위원회는 언제 어떤 안건을 다뤘나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 시군 의회회의정보와는 연도·대수·회기 같은 값을 이름 기준으로 맞춰 이어 쓴다.
