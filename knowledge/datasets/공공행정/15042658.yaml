description_portal: 전북특별자치도 무주군 의회에서 진행한 회의 현황을 매년 갱신하여 파일데이터로 제공하고 있습니다.년도, 대수, 회기, 차수, 임시회 정례회 구분(임시회,정례회), 안건유무, 회의정보(본회의,행정복지위원회,산업건설위원회,행정사무감사특별위원회,예산결산특별위원회 등), 안건, 회의명, 차수상세, 날짜, 데이터기준일자 등으로 파일 데이터컬럼이 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다.해당 데이터는 전북특별자치도 무주군의회 의회사무과 의사팀에서 관리하고 있으며 자세한 내용은 063-320-2511(의회사무과)로 연락주시면 됩니다.
