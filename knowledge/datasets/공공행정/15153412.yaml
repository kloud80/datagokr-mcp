description_portal: '세종특별자치시시설관리공단은 자연장지 운영의 체계적인 관리를 위해 자연장 종류 설정 정보를 공공데이터로 제공하고 있습니다.본 데이터는 자연장의 유형을 정의하고, 각 유형이 적용되는 시점을 명확히 관리하기 위한 기본 설정 정보로 구성되어 있습니다.■ 데이터 컬럼 구성자연장구분 - 자연장의 종류를 식별하기 위한 코드 값    예: NG(잔디장), TW(수목장 도심형), TR(수목장 산림형) 등자연장구분명칭 - 해당 코드에 대응하는 자연장 종류의 명칭    예: 잔디장, 수목장 도심형, 수목장 산림형적용일자 - 해당 자연장 종류가 실제로 적용되기 시작한 날짜 - 자연장 유형 신설·변경 내역 관리에 활용비고 - 기타 참고 사항 또는 설명 - 특이사항, 운영 변경사항 등 기록■ 데이터 제공 목적자연장 종류 설정 데이터는 다음과 같은 목적을 위해 제공됩니다. - 자연장 유형의 명확한 분류 및 체계적 관리 기반 제공 - 유형별 운영 정책 및 서비스 기준 설정 지원 - 시민에게 자연장 종류를 명확히 안내하여 정보 접근성 향상 - 자연장지 운영의 투명성 강화 및 행정 효율성 제고세종특별자치시시설관리공단은 자연장지 운영의 공공성과 신뢰성을 높이기 위해 관련 정보를 지속적으로 갱신·제공하고 있습니다.'
