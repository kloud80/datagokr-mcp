summary_user: SGIS 업종통계지도의 생활업종 입지계수 종합현황을 전국 시군구 단위로 집계한 파일로, 시도·시군구별 테마(생활업종)마다 사업체비율과 종사자비율을 담는다. 창업 준비자나 지역 상권 분석가가 '우리 시군구에 음식점·소매업 같은 생활업종이 전국 대비 얼마나 몰려 있나'를 비교할 때 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 시군구 통계와는 시도명·시군구명을 이름으로 맞춰 연결해야 한다.
description_portal: '[SGIS 오픈 플랫폼] "업종통계지도" 서비스의 생활업종 입지계수 종합현황 데이터입니다.시도명,시군구명,테마명,사업체비율,종사자비율을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 업종통계지도- 생활업종통계지도: 음식점(11종), 소매업(17종), 생활서비스(13종), 숙박업(4종), 여가생활(6종), 교육(11종), 의료(5종), 공공(4종) 등 국민생활과 밀접한 주요 생활업종에 대한 다양한 통계정보를 조회할 수 있는 서비스- 기술업종통계지도: SGIS+의 활용 사례로, 다양한 기술업종에 관련된 지역별 통계정보를 조회하여 보실 수 있으며, 기술업종 지원시설 및 산업단지에 관련된 정보를 보실 수 있는 서비스'
