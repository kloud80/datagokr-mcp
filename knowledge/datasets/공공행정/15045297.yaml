description_portal: '충청남도 당진시 마을회관·경로당 주소 정보(데이터 기준일자: 2026년 7월 1일)충청남도 당진시는 지역 주민의 소통과 여가, 복지 향상을 위해 각 마을별로 마을회관 및 경로당을 설치·운영하고 있습니다. 본 자료는 당진시 관내 마을회관 및 경로당의 기본 주소 정보를 정리한 것으로, 다음 항목을 포함하고 있습니다:마을회관명: 마을회관 또는 경로당의 명칭소재지: 시설이 위치한 주소우편번호: 소재지 기준 우편번호본 자료는 지역 복지시설의 기본 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 행정업무, 주소 기반 통계, 복지시설 안내자료 제작, 대시민 정보 제공 등에 활용될 수 있습니다.'
