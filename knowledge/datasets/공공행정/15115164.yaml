summary_user: 서울특별시 강남구의 외국인관광도시민박업 업소를 한 건씩 담은 인허가 원장으로, 관리번호·사업장명·인허가일자·영업상태·휴폐업일자·주소·좌표·객실 수 등을 업소 단위로 담는다. 강남구에서 외국인 대상 도시민박이 어디에 몇 곳 영업 중이고 언제 생기거나 문을 닫았는지 보려는 관광·숙박 사업자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 같은 원천인 LOCALDATA 인허가 자료와 함께 쓴다.
description_portal: 서울시 강남구 외국인관광도시민박업 인허가 정보(https://data.seoul.go.kr/dataList/OA-17474/S/1/datasetView.do)입니다. 강남구 관광진흥과에서 관리합니다.서울특별시 강남구의 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
