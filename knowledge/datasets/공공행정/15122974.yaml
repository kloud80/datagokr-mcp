summary_user: 경기도 경기통계시스템의 통계표와 세부 항목에 붙은 주석(부가설명)을 조직번호·테이블아이디·표항목인식번호·최종변경일 단위로 담은 메타데이터다. 경기도 통계를 쓰는 분석가가 "이 통계표 수치를 어떤 정의와 기준으로 읽어야 하나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 같은 시스템의 통계표 목록·수치 데이터와는 테이블아이디(tbl_id)처럼 같은 기관 안의 코드로만 맞춰 붙인다.
description_portal: 이 데이터는 경기도 경기통계시스템에서 제공하는 통계자료의 주석 정보로, 조직번호, 테이블아이디, 표항목인식번호, 최종변경일 등으로 구성되어 있습니다. 주석 정보는 각 통계표 또는 항목에 대한 추가 설명이나 해석을 위한 메타데이터로, 통계 수치의 의미를 명확히 하고 데이터의 정확한 이해를 돕는 데 중요한 역할을 합니다. 테이블아이디는 해당 주석이 연결된 통계표를 식별하며, 표항목인식번호는 세부 항목에 대한 주석이 있는 경우 이를 나타냅니다. 이 데이터는 통계정보의 부가설명 관리, 데이터 이용자 대상 가이드 제공, 통계공표자료의 해석 정확도 제고 등의 용도로 활용될 수 있습니다.
