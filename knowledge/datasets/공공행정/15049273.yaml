description_portal: 'ㅇ 데이터 개요: 본 자료는 「서울시 협상에 의한 계약정보(제안서 평가)」로, 협상계약 대상 사업의 계약명, 계약형태(용역/물품), 평가일시·장소, 평가위원 수, 제안업체 수, 소관 실·본부·국·사업소 및 부서 정보, 입력·수정시간, 평가결과 파일명 등을 수록한 행정 데이터입니다.ㅇ 수록 범위/규모: 총 4,748건ㅇ 평가 지표 요약: 평가위원 수 중앙값은 7명(IQR 78명), 제안업체 수 중앙값은 2개사(IQR 1~3개사)로 확인됩니다. 일부 건은 0값이 존재하여 미입력/오류 가능성이 있으므로 분석 시 결측·이상치 처리 기준을 사전에 설정하시기 바랍니다.ㅇ 데이터 필드(주요): 계약명, 계약형태·명, 평가일시/장소, 평가위원 수, 제안업체 수, 실본부국사업소명·부서명·관서명, 입력시간/수정시간, 평가결과(파일명), 원본파일명 등.ㅇ 활용 방안: ① 부서·사업 유형별 경쟁도(제안업체 수)와 심사 체계(평가위원 수) 모니터링 ② 연도·조직별 협상계약 집중 분야 파악 ③ 평가 일정·장소 관리 체계 점검 ④ 투명성 제고용 공개 지표(평가위원 수 분포, 제안경쟁 수준 등) 작성에 활용 가능합니다.ㅇ 유의사항: ‘평가일시’에 일부 비현실적 미래일자 등 이상값이 관찰됩니다(예: 향후 연도 표기). 또한 ‘평가결과’는 파일명만 포함되어 원문과의 직접 연계 여부는 확인이 필요합니다(확실하지 않음). 분석 시 날짜·정수형 캐스팅, 이상치 제거, 조직명 표준화 처리가 권장됩니다.'
