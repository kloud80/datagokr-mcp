summary_user: 경기도 데이터분석시스템에 등록된 분석 데이터셋마다 어떤 분류코드가 붙었는지, 그 분류가 대표 분류인지, 누가 언제 등록·수정했는지를 한 행씩 담은 메타데이터 목록이다. 경기도 데이터분석시스템의 데이터셋이 주제 영역별로 어떻게 나뉘어 있는지 파악하려는 분석가나 담당자가 쓴다. 예를 들어 특정 분류코드에 속한 데이터셋이 몇 개인지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없다. 같은 시스템의 데이터셋 목록이나 분류코드표와는 데이터셋ID(ds_id)·분류코드 값을 맞춰서만 이을 수 있다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 분석 데이터셋 분류 내역 자료로, 데이터셋의 관리 및 분류 체계를 체계적으로 기록한 메타데이터 성격의 정보입니다. 주요 항목에는 데이터셋ID, 데이터셋분류코드, 대표분류여부, 등록자ID, 등록일시, 수정자ID, 수정일시 등이 포함되어 있으며, 각 데이터셋이 어떠한 주제 영역이나 코드 체계로 분류되는지를 확인할 수 있습니다. 이 데이터는 행정, 정책, 경제, 사회 등 다양한 분석 분야에서 데이터셋의 활용 범위를 파악하는 데 기초 자료로 쓰일 수 있습니다.
