description_portal: 본 데이터는 제9대 안동시의회(2022.07.~2026.04.)의 공식 의정활동을 투명하게 공개하는 "안동시의회 제9대 영상회의록 바로가기(URL) 목록"입니다.제233회부터 제265회까지 개최된 ▲본회의 ▲문화복지위원회 ▲경제도시위원회 ▲예산결산특별위원회의 모든 회의 일자 및 차수 정보를 통합하여 제공합니다. 특히 해당 회의 영상으로 즉시 연결되는 다이렉트 URL 주소가 포함되어 있어, 이용자가 별도의 검색 없이 클릭 한 번으로 회의 영상을 시청할 수 있습니다.안동시민의 알 권리 증진, 의정 모니터링은 물론, 공공데이터 기반의 웹/앱 서비스 개발 및 지역 정책 연구를 위한 기초 자료로 매우 유용하게 활용할 수 있습니다.
