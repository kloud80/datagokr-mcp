summary_user: 공정거래위원회 기업집단포털이 관리하는 대규모기업집단 소속회사의 편입·제외·유예 변경내역을 회사 단위로 담은 API이며, 검증 시 전체 4건이 전국 범위로 수신됐다. 투자자나 언론, 분석가가 "이 기업집단에 어떤 회사가 언제, 어떤 사유(회사설립·지분취득 등)로 계열에 들어오거나 빠졌나"를 확인하는 데 쓴다. 법인등록번호(jurirno, 조인 키 corp_rgst_no)로 같은 번호를 쓰는 공정위의 다른 기업집단·공시 데이터나 법인 정보와 이어 쓴다.
limits: 요청 전에 공개년월 조회 API(publicYmList)로 사용 가능한 년월을 확인해야 하며, 당해년도 정보는 5월 1일 기준으로 제공된다. 검증 시 전체 건수가 4건이어서 이 호출만으로 전체 계열 변동 이력을 파악하기에는 부족할 수 있다. 사업자등록번호가 아닌 법인등록번호가 키이므로 사업자번호 기반 데이터와는 바로 결합되지 않는다.
