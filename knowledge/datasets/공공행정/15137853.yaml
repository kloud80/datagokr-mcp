description_portal: 본 데이터는 경기도 광주시의회 홈페이지에 등록된 의안의 상세 정보를 제공합니다. 시의회에 제출된 의안의 발의부터 의결, 공포까지의 전체 처리 과정을 기록한 정보를 담고 있습니다. 고유번호와 의안번호는 각 의안을 식별하며, 대수와 회기는 의안이 제출된 시기를 나타냅니다. 발의자와 공동 발의자는 의안을 제출한 의원 정보를 제공하고, 의안명은 의안의 제목입니다. 회부일, 위원회 심사 일정, 본회의 일정, 집행부 이송일, 공포일 등은 의안 처리의 각 단계별 날짜를 상세히 기록하여 의안의 진행 상황을 투명하게 공개합니다.
