description_portal: 학술지「지식재산연구」는 한국연구재단 및 DOAJ 등재지로서 지식재산(특허, 상표, 디자인, 저작권 등) 관련 법, 경제·경영,과학·기술 분야를 아우르는 지식재산 대표 융합학술지 입니다. 지식재산과 관련한 참신하고 역량있는 논문을 발굴·소개하여 학문적인 발전을 도모하고자 최선을 다하고 있사오니 관심있는 분들의 많은 투고를 부탁드립니다. 또한 한국연구재단 및 국제색인 데이터베이스 DOAJ 등재 학술지 발간을 통해 국내 지식재산연구 성과 확산 및 학술 교류 활성화에 기여하고 있습니다. 논문 심사의 객관성 및 투명성 강화를 위해 온라인 논문투고시스템(JAMS)을 통해 투고에서 심사까지 모든 절차를 온라인으로 진행하고 있습니다. 해당 정보는 한국지식재산연구원 홈페이지(www.kiip.re.kr)에서 확인 가능합니다.
