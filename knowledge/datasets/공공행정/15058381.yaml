summary_user: 지방자치단체별 맞춤형복지비 비율을 담은 지방재정365 공시 지표로, 회계연도(fyr)와 광역·기초 자치단체 코드·이름별로 금액 두 항목과 비율 값이 들어 있으며 범위는 전국입니다. 분석가나 주민이 '우리 지자체는 예산 중 기초생활보장·장애인·노인·아동 등 대상별 맞춤형 복지에 얼마나 비중을 두는가', '다른 시군구와 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 데이터와는 같은 기관의 자치단체 코드(laf_cd)나 자치단체 이름을 맞춰 연결한다.
description_portal: 맞춤형복지비 비율이란 지방자치단체의 총 세출 예산 또는 복지 관련 예산 중에서 주민 개개인의 특성과 상황에 맞춰 제공하는 맞춤형 복지서비스에 사용된 예산이 차지하는 비율을 의미한다.여기서 맞춤형 복지비는 기초생활보장, 장애인 지원, 노인복지, 아동청소년 복지, 한부모가족 지원, 긴급복지등 다양한 대상자별 수요에 ᄄᆞ라 차별화된 복지서비스를 제공하기 위한 예산으로, 복지 수요자의 생활실태를 반영하여 실질적인 도움을 줄 수 있는 사업에 투입된다.이 비율은 복지 정책의 대상 적합성과 실효성을 판단하는 지표로 활용된다.
