summary_user: 대한민국 법령에 첨부된 별표·서식을 한 건씩 담는 목록으로, 별표명·별표종류(별표/서식 구분)·별표번호와 함께 그 별표가 붙은 관련 법령의 이름·ID·소관부처·공포일자·제개정 구분, 서식 파일·PDF 링크를 전국 범위로 제공한다. 행정 실무자나 사업자가 '이 신청서 서식은 어느 법령 별표에 근거하고 최근 언제 개정됐나'를 확인하거나, 분석가가 특정 부처 소관 법령의 첨부 서식 변경을 추적하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 관련법령ID·관련법령일련번호나 법령명, 소관부처명 같은 이름·코드 매핑으로 법제처 법령 목록·본문 데이터와 이어 쓴다.
limits: 포털 활용신청과 별개로 외부 사이트(open.law.go.kr)의 인증키(OC 파라미터)를 따로 받아야 호출된다. 다른 데이터와 공통으로 묶는 전역 키가 확인되지 않아 연계는 법령명·법령ID 등 이름·코드 매핑에 의존하며, 위치 정보가 없는 비공간 데이터다.
