summary_user: 공정거래위원회에 등록된 후원방문판매사업자를 사업자 단위로 담은 API로, 허가일자·인허가 시도와 지역·영업상태·휴폐업사유·주소·대표자 정보를 제공하며 검증 시 전국 범위 3건이 확인됐다. 소비자나 거래 상대가 "이 후원방문판매 업체가 정식 등록된 사업자인가"를 확인하는 질문에 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)로 가맹·통신판매·상조 등 같은 공정위 등록·공시 데이터와 이어 쓰며, 소재지주소·도로명주소는 주소 키로 연결한다.
limits: API 전체 건수가 3건이라 후원방문판매 업계 전반을 파악하는 용도로는 쓸 수 없다. 오퍼레이션 6개 중 최소 파라미터로 응답을 확인한 것은 1개뿐이고 나머지 5개는 응답이 없었다. 사업자등록번호·영업상태명·법인명·인허가지역명은 필수 파라미터라 다른 데이터에서 먼저 값을 받아 넘겨야 한다.
