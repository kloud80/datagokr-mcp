summary_user: 경기도 시군구별 카드매출을 기준년월·성연령대·중분류 업종 단위로 집계한 자료로, 매출금액과 비율, 전월·전년동월 대비 증감값과 증감률을 담는다. 상권 분석가나 창업 준비자가 '우리 시군구에서 30대 여성의 음식점 매출이 작년보다 늘었나'처럼 성별·연령대별 업종 소비 변화를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시군구코드(signgu_cd)를 이름·코드 매핑하거나 같은 기관(경기도) 데이터의 코드로 맞춰 연결한다.
description_portal: "이 데이터는 경기도 각 시군구 단위에서의 카드매출을 성별·연령별로 집계한 자료입니다. ‘기준년월’ 기준으로 ‘시군구코드’, ‘성연령코드’ 및 ‘중분류업종코드’를 기반으로 매출금액과 그 비율, 전월 및 전년동월 대비 증감값과 증감비율을 제공합니다. '성연령코드'는 성별(F: 여성, M: 남성)과 연령대(10, 20, 30 등)별로 구분되며, 중분류업종코드는 업종을 중간 수준에서 분류하는 산업코드입니다. 이 데이터는 연령대별 소비 특성 분석, 성별 소비 비교, 업종별 매출 구조 파악, 지역별 소비 트렌드 분석에 활용 가능하며, 상권 분석 및 마케팅 전략 수립에 유용합니다."
