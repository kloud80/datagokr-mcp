summary_user: 경기도의회 상임위원회와 특별위원회의 위원회명·구분·상세내용, 활동 시작일과 종료일, 활동·사용 여부를 위원회 한 건당 한 행으로 담은 원장성 자료다. 도민이나 의정 분석가가 '지금 활동 중인 경기도의회 특별위원회는 무엇이고 언제 구성됐는가' 같은 질문에 쓴다. 전역 조인 키는 없고, 위원회코드(commisn_cd)나 위원회명을 같은 경기도의정포털의 다른 자료(의안·회의록 등)와 이름·코드로 맞춰 잇는 방식으로만 연결한다.
description_portal: '「경기도의정포털_위원회정보」 데이터는 경기도 의회의 위원회 구성 및 운영 현황을 기록한 자료입니다. 주요 항목으로는 위원회코드, 전문위원회코드, 위원회구분, 위원회명, 위원회상세내용, 위원회시작일, 위원회종료일, 위원회활동여부, 위원회사용여부, 등록일 및 수정일, 홈페이지위원회코드 등이 포함됩니다.이 자료를 통해 경기도 의회의 **상임위원회(예: 의회운영위원회, 기획재정위원회, 문화체육관광위원회, 보건복지위원회 등)**와 **특별위원회(예: 예산결산특별위원회, 윤리특별위원회, 기후위기대응특별위원회, 혁신추진특별위원회 등)**의 운영 여부와 활동 기간을 확인할 수 있습니다'
