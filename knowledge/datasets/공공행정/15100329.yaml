description_portal: 강원특별자치도 홍천군의 2022년 05월 18일 기준으로 작성된 읍면별1인가구 현황 정보입니다. 총 2개의 엑셀 파일로 구성되어 있습니다. 파일명은 1인가구 현황, 단독세대인구현황(연령별-1세기준)으로 구성되어 있습니다. 단독세대인구현황(연령별-1세기준) 파일의 구성 항목으로는 행정기관, 연령, 남, 여로 구성되어 있습니다. 행정기관 항목으로는 홍천읍, 남면, 내면, 내촌면, 서면, 북방면, 영귀미면 등의 항목으로 구성되어 있고 연령, 남, 여 항목은 숫자 형식으로 나타나 있습니다. 파일명 1인가구 현황 파일의 구성 항목으로는 구분, 2010년, 2015년, 2020년으로 구성되어 있습니다. 각 음면별 2000년대 1인가구 현황을 나타내고 있습니다.
