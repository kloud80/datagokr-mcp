description_portal: 이 자료는 인천광역시 연수구 내 각 행정동별 사업체 수 및 종사자 수 현황을 제공하는 데이터로, 2025년도에 실시한 2024년 기준 사업체조사 결과입니다. 조사 대상은 연수구 내 산업 활동을 수행하는 모든 사업체이며, 총 37,217개의 사업체와 162,913명의 종사자 수가 파악되었습니다. 데이터는 옥련1동부터 송도5동까지 각 동별 사업체 수와 종사자 수로 세분화되어 있어, 지역별 경제 활동 규모와 산업 분포를 파악하는 데 활용될 수 있습니다. 또한 정책 수립, 지역경제 분석, 상권 조사, 창업 입지 분석 등 다양한 행정 및 민간 수요에 유용하게 이용 할 수 있습니다.
