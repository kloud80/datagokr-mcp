description_portal: '본 데이터는 주택도시보증공사에서 제공하는 보증 상품 관련 용어집으로, 보증 업무와 관련하여 자주 사용되는 용어를 체계적으로 정리한 자료입니다.보증업무 과정에서 자주 활용되는 주요 법적 ·  행정적 용어(예: 가등기, 가압류, 근저당권 등)와 함께, 보증상품 운영과 직접적으로 연계되는 주택법, 도시 및 주거환경정비법 등 관계 법령상의 개념을 포함하고 있습니다.본 용어집과 관련한 보증상품별 설명(보증금액, 보증기간, 상품개요, 이용절차 및 제출서류, 약관 등)에 대한 상세한 설명은 주택도시보증공사 홈페이지에서도 확인 가능하니 참고하시기 바랍니다.(참고) https://www.khug.or.kr/hug/web/cg/ov/cgov000001.jsp'
