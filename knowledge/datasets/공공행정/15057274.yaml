summary_user: 지방자치단체별로 보통교부세 산정 때 세입확충 자체노력이 반영된 금액과 비율을 회계연도 단위로 담은 전국 집계 자료이며, 포털 설명상 2015회계연도부터 제공된다. 분석가나 지자체 재정 담당자가 "우리 시·군·구는 세입확충 노력으로 교부세에서 얼마의 인센티브(또는 감액)를 받았나"를 확인하거나 지자체 간 반영액·반영률을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 지방재정365 자료와는 회계연도와 자치단체 코드(laf_cd)·자치단체명으로 맞춰 이어 쓴다.
description_portal: 지방자치단체의 보통교부세 자체노력 반영현황(세출효율화)은 지방자치단체가 세금을 포함한 모든 자원의 사용을 최대한으로 효율화하여 재정의 낭비를 줄이고 공공서비스의 질을 높이는 과정이며 지역 주민에게 더 나은 서비스를 제공하고, 자원 활용의 최적화를 목표로 합니다. 자치단체의 세출 효율성 개선 노력을 통해 교부세 배분이 조정되며, 세출감소와 재정운영의 효율성 향상으로 인센티브가 제공되며 해당 자료는 자치단체별 인센티브를 분석한 자료입니다.보통교부세자체노력반영현황(세입확충) 정보는 2015회계연도부터 자료가 제공됩니다.
