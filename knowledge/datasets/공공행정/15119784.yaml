description_portal: 대전광역시 중구 사업체조사 결과입니다. 결과보고서와 산업세세분류별 총괄 등으로 구성되어 있습니다.본 공공데이터는 데이터 업데이트 주기가 연간 1회로, 데이터 기준일을 확인하여 주시기 바랍니다.조사기준시점은 매년 12월 31일입니다.사업체조사 결과 보고서 한글파일과 기준별 결과 통계표 엑셀파일 9종으로 구성되어 있습니다.산업세세분류별, 산업소분류 및 산업중분류별 종사자, 사업체수 등을 담고 있습니다.본 데이터와 관련하여 문의사항이 있으신 경우 담당 전화번호로 연락주시기 바랍니다.
