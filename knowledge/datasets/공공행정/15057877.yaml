summary_user: 경기도 내 외국인 주민(복지)센터를 센터 한 곳당 한 행으로 담은 시설 목록이며, 시군명·지번/도로명 주소·우편번호·연락처·WGS84 위도·경도를 포함한다. 외국인 주민이나 지원 담당자가 '우리 시군에서 가장 가까운 외국인 복지센터는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시군별 외국인 지원 거점 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 시군명이나 시군 코드(SIGUN_CD)로 다른 경기도 시군 단위 자료와 맞추고, 좌표로 주변 시설과 공간 결합해 쓴다.
description_portal: '이 데이터는 경기도 내 외국인 주민을 위한 복지센터에 대한 현황을 제공하며, 센터의 시군명, 소재지 주소(지번 및 도로명), 우편번호, 연락처, 위치 좌표(WGS84 위도·경도) 등의 정보를 포함합니다. 외국인 복지센터는 지역 내 외국인 주민의 정착 지원, 사회통합, 다문화 서비스 제공 등의 기능을 수행하는 거점 기관입니다. 본 API는 XML 또는 JSON 형식으로 호출 가능하며, 지역별 외국인 복지 인프라 현황 분석, 관련 민원 안내 시스템, 정책 수립 등에 활용할 수 있습니다. - 외국인 주민(복지)센터: 경기도 내 체류 외국인을 대상으로 복지상담, 통번역, 교육, 문화활동 등을 지원하는 공공 또는 민간 위탁기관입니다. 각 센터의 기능과 운영 방식은 지자체별로 차이가 있을 수 있으며, 외국인주민 지원사업의 핵심 거점 역할을 수행합니다.'
