summary_user: 국가 소유 국유일반재산의 매각 내역을 건별로 담으며, 전국 283,916건(2002-05-09~2026-09-30)을 소재지·지목·대장면적·대장금액·처분구분·계약일자 단위로 제공한다. 국민·사업자·분석가가 특정 지역에서 국유재산이 언제 어떤 지목과 면적으로 얼마에 매각됐는지 확인하는 질문에 쓴다. 소재지명(LCTN_NM)이 주소 조인 키여서 주소 기반의 다른 지역·토지 데이터와 이어 쓰며, 별도의 코드표 필드는 없다.
description_portal: 한국자산관리공사_국유부동산 매각현황 조회서비스 API는 국가(기획재정부)에서 소유하고 한국자산관리공사에서 관리하는 국유일반재산의 관리·처분계획에 따른 매각 관련 현황 정보를 제공합니다. 매각재산의 소재지, 지목, 면적, 입찰종류, 계약일자 등의 주요 속성을 포함하여 매각현황에 대한 상세한 데이터를 확인할 수 있습니다. ※ 2014년부터 전월 마지막일까지 국유일반재산 매각 내역을 제공합니다.※ 관련된 내용은 캠코국유재산포털(https://gpminwon.kamco.or.kr)에서도 확인 할 수 있습니다.
