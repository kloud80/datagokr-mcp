summary_user: 경기주택도시공사 홈페이지의 접속일자(cntn_ymd)별 신규·재방문·전체 방문자 수와 페이지 요청 수를 담은 기관 운영 집계 자료다. 공사 홈페이지 이용 규모가 분양·임대 공고 시기 등에 따라 어떻게 달라지는지 보려는 공사 담당자나 공공기관 웹서비스 이용을 분석하는 연구자가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 자료와는 접속일자 같은 날짜 기준으로만 맞춰 볼 수 있다.
description_portal: 이 데이터는 경기주택도시공사 홈페이지 방문자 현황을 기록한 자료입니다. 특정 기간 동안 홈페이지에 접속한 이용자의 수를 집계하여, 온라인 서비스 이용 규모, 사용자 접근 경향, 시기별 변화를 파악할 수 있습니다. 이를 통해 공사는 주택 분양, 임대주택 신청, 도시개발 관련 정보 제공과 같은 주요 서비스의 홍보 효과를 확인할 수 있으며, 방문자 추이를 기반으로 웹사이트 개선, 정보 제공 방식 최적화, 온라인 민원 처리 강화 등에 활용할 수 있습니다. 연구기관이나 정책 담당자는 이 데이터를 통해 공공기관 웹서비스 접근성, 온라인 참여도, 디지털 행정 서비스 효과를 분석할 수 있습니다.
