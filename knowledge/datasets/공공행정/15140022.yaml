description_portal: '본 연료 통관 실적은 한국중부발전이 수입한 발전 연료의 통관 실적을 월별로 정리한 자료입니다. 항목은 연월, 수량, 단위(MT: 미터톤), 연료명으로 구성되어 있으며, 수량의 단위는 별도 항목으로 명시되어 있어 연료 종류별로 기준 단위를 구분하여 관리할 수 있습니다. 연료 통관 실적은 발전소 연료 수급 현황, 수입 물량 추이, 연료별 통관량 분석 등을 위한 기초자료로 활용 가능합니다. 또한 연료별 수입 의존도, 수급 안정성, 발전원가 산정 및 통관 물류 계획 수립 등과 관련된 전략 수립에도 유용하게 활용 가능합니다.'
