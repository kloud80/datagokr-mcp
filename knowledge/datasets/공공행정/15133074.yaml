description_portal: 김천시의회 사무국전화번호 데이터에서는 김천시의회 사무국의  담당소속, 직위, 담당사무, 전화번호 정보를 제공하고 있습니다.김천시의회 사무국은 전문위원실, 의정팀, 의사팀, 홍보운영팀으로 구성되어 있으며, 팀별로 업무 내용이 상이합니다.전문위원실에서는 위원회 별 입법지원 및 의정활동 자료 제공 등의 업무를 하고 있으며, 의정팀에서는 의원 관련 업무 및 사무국 업무 전반을 담당하고, 의사팀은 회의 업무 및 기록관리 전반, 홍보운영팀은 의회홍보 및 시설관리 등의 업무를 수행하고 있습니다.악성민원에 따른 보호조치로 업무별 담당자의 이름은 제공하지 않음을 양해해 주시기 바랍니다.
