description_portal: '주택도시보증공사의 보증상품별 보증실적을 정리한 자료로, 반기 단위로 제공됩니다.보증상품은 분양보증, 임대보증금보증, 하자보수보증, 조합주택시공보증, PF보증, 정비사업대출보증, 기타보증 등으로 구분되며, 각 상품별 보증 건수 및 보증금액(단위: 백만 원)이 포함되어 있습니다. 상품별 보증 실적의 변화를 파악할 수 있도록 반기별로 데이터를 제공하며, 엑셀 형식으로 구성되어 있습니다.-기타보증 : 전세보증금반환보증, 전세자금대출특약보증, 모기지보증, 도심주택특약보증, 인.허가보증, 임대관리보증 등.추가적인 보증상품별 설명(보증금액, 보증기간, 상품개요, 이용절차 및 제출서류, 약관 등)은 주택도시보증공사 홈페이지에서도 확인 가능하니 참고하시기 바랍니다.'
