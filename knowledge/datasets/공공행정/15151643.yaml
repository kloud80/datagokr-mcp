summary_user: 경기도 지역화폐 사용 매출을 기준년월·읍면동·중분류 업종·발행구분별로 집계한 통계로, 매출금액과 그 순위·비율, 전월 대비 증감값·증감률을 담는다. 상권 분석가나 지자체 담당자가 '우리 읍면동에서 지역화폐가 가장 많이 쓰이는 업종은 무엇이고 지난달보다 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 읍면동코드(emd_cd)를 행정동 코드표와 이름·코드로 매핑하거나 같은 기관(경기도) 자료의 코드로만 연결하며, 행정동×월 격자의 상권 자료와 나란히 놓고 본다.
description_portal: 이 데이터는 경기도 지역 내에서 지역화폐를 사용한 업종별 매출 정보를 읍면동 단위로 집계한 통계자료입니다. '기준년월'을 기준으로, 특정 읍면동에서 지역화폐가 사용된 중분류 업종별 매출금액 및 그 순위, 비율 등을 포함하며, 발행구분에 따른 구분도 함께 제공됩니다. 주요 항목으로는 '기준년월', '읍면동코드', '중분류업종코드', '발행구분코드', '매출금액', '매출금액_순위', '매출금액비율' 등이 있으며, 이를 통해 지역 상권 내 소비 트렌드, 업종별 지역화폐 사용 규모, 월별 매출 변화 추이를 파악할 수 있습니다. 데이터는 상권 육성 정책 수립, 업종별 지원 정책 설계, 읍면동 단위 소비 분석 등에 활용될 수 있습니다.
