summary_user: 서울시 내 여행업·숙박업·유원시설·공연장·관광기념품 판매업 등 관광사업자를 사업장 한 곳씩 담은 인허가 원장으로, 인허가·취소·폐업·휴업 일자, 영업상태, 주소·좌표, 시설면적·규모 등을 담는다. 분석가나 사업자가 '우리 구에 지금 영업 중인 관광숙박·여행업체가 어디에 몇 곳 있고 언제 생기고 없어졌나'를 확인하는 상권·관광 인프라 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(개방자치단체코드·관리번호)로만 잇고, LOCALDATA 인허가 데이터와 원천을 공유한다.
description_portal: 서울시 관광사업자 인허가 정보는 서울시 내 여행업, 숙박업, 유원시설, 공연장, 관광기념품 판매업 등 다양한 관광 관련 사업체의 기본 현황과 영업 상태를 파악하기 위한 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업기간, 재개업일자와 같은 항목을 통해 각 사업자가 현재 영업 중인지, 휴업 또는 폐업 상태인지, 언제부터 언제까지 운영되었는지를 확인할 수 있습니다. 영업상태명과 상세영업상태명은 단순히 영업 중/폐업 여부를 넘어 보다 세분화된 상태를 보여주어 행정·통계 분석에 활용할 수 있습니다. 사업장명, 전화번호, 지번주소와 도로명주소, 우편번호, 좌표정보 등은 관광사업자의 위치와 연락처를 제공해 현장 조사, 지도 시각화, 민원·안내 서비스 등에 쓰일 수 있습니다. 업태구분명, 문화체육업종명, 문화사업자구분명, 지역구분명은 해당 사업체가 어떤 관광 분야와 지역 유형에 속하는지를 나타내어, 업종별·지역별 분포 분석에 핵심적인 정보입니다. 더불어 객실수, 회의실별 수용인원, 좌석수, 시설면적, 건축연면적, 시설규모 등은 관광시설의 수용 능력과 규모를 보여주는 주요 지표로, 관광 인프라 수준과 수요 대비 공급 여건을 평가하는 데 중요한 역할을 합니다.
