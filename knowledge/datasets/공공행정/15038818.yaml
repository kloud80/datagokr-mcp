summary_user: 전국 지방자치단체의 지방세외수입 결산 내용을 회계연도별로 담은 통계연감 자료로, 세외수입 징수현황 총괄·자치단체별 징수현황·주요 부과형 세외수입 징수현황 같은 집계 통계로 이루어진다. 분석가나 지자체 재정 담당자가 우리 지자체의 세외수입 징수 실적이 다른 자치단체와 비교해 어느 수준인지 확인하는 데 쓴다. 회계연도(fyr)와 광역·기초 자치단체 코드·이름(wa_laf_cd, laf_cd 등) 열은 있으나 실측에서 전역 조인 키로 확인되지 않아, 다른 지방재정 자료와는 자치단체 이름·코드를 직접 맞춰 이어야 한다.
description_portal: '○ 지방세외수입통계연감게시판에는 회계연도별 지방세외수입 결산개요 내요을 게시하고 있습니다.○  지방세외수입 결산개요 내용   - 지방세외수입 개요 : 세외수입 종류 및 내용, 세외수입 관련제도 변천, 세외수입 규모변화, 세외수입 규모 등   - 통계 : 세외수입 징수현황(총괄), 자치단체별 징수현황, 주요부과형 세외수입 징수현황 등○ 지방세외수입 결산개요 발간 목적 : 전국 지방자치단체 세외수입의 상세한 부과·징수 현황을 토대로 지방세외수입 운영실적 분석·진단을 실시하고 그 결과를 공개, 지자체의 세외수입 확중 노력 지원'
