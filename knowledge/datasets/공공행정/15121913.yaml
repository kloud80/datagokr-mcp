description_portal: 충청남도 하천계획제원 데이터는 도내 하천의 치수·이수 계획 수립과 하천 시설 관리를 위한 기술적 기준 정보를 체계적으로 정리한 자료이다. 본 데이터는 관리번호와 기본계획코드, 측점번호를 기준으로 구간거리와 누가거리, 최심하상고 및 평형하상고, 계획홍수량, 현하폭과 계획하폭, 좌안·우안 제방고, 일제관측수위, 계획홍수위, 개수 전 홍수위(10년 빈도) 등의 세부 항목으로 구성되어 있다. 이를 통해 하천 구간별 물리적 특성과 계획 기준을 종합적으로 파악할 수 있으며, 하천 정비사업 타당성 검토, 홍수 대응 능력 분석, 재해 예방 대책 수립, 하천 기본계획의 수립·변경 및 기술적 의사결정을 지원하는 핵심 기초자료로 활용된다.
