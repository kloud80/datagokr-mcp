summary_user: 법제처가 제공하는 법령용어를 용어 단위로 담아 용어 ID·명칭·사전 구분·법령 종류와 상세 조회 링크를 돌려주는 전국 범위의 외부 API다. 법률 문서를 읽는 국민이나 법률 서비스 개발자가 '이 법령용어의 정의와 관련 조문은 무엇인가'를 찾거나 앱에 용어 풀이 기능을 붙일 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 법제처 데이터와는 법령용어 ID나 용어명 매핑으로만 연결한다.
description_portal: 법제처에서 제공하는 모바일 기반 법률용어 정보 조회 서비스 데이터입니다. 법률용어에 대한 코드, 명칭, 정의문, 관련 법조문, 유의어, 다국어 번역 표현, 변경 이력 등의 항목을 체계적으로 확인할 수 있습니다. 용어 코드, 명칭, 언어 구분 등의 검색 파라미터를 통해 원하는 용어 정보를 선택적으로 조회할 수 있도록 설계되어 있습니다. 응답에는 총 결과 수, 페이지 정보 및 개별 용어 상세 링크가 포함되어 있습니다. 이를 통해 법령 용어 해석, 번역 지원, 법률 정보 검색 품질 향상 등에 활용할 수 있습니다. 모바일 애플리케이션이나 웹서비스에서 법률용어 정의 제공 기능 구현 및 용어 기반 검색 기능 강화 등을 위한 핵심 자료로 적합합니다.
