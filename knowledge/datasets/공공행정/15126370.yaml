summary_user: 국가(기획재정부) 소유로 한국자산관리공사가 관리하는 국유일반재산 중 온비드 입찰에 나온 물건을 건별로 담으며, 전국 81,754건이 2001-11-14부터 2026-10-01까지 걸쳐 있다. 토지·건물면적, 감정평가금액, 최초입찰금액, 공고횟수를 보고 어떤 국유재산이 얼마에 입찰에 나왔는지 알아보려는 국민·사업자·분석가가 쓴다. 전역 조인 키는 확인되지 않아 공고번호·입찰번호 같은 같은 기관 내 코드나 이름·코드 매핑으로만 다른 데이터와 잇는다.
description_portal: 한국자산관리공사_국유일반재산 입찰대상물건내역 조회서비스 API 는 국가(기획재정부)가 보유하고 한국자산관리공사에서 관리하는 국유일반재산에 대한 입찰대상 물건내역을 제공합니다. 온비드(https://www.onbid.co.kr)를 통해 진행되는 일반경쟁 및 지명경쟁 입찰 물건의 토지면적, 건물면적, 최초입찰금액,감정평가금액,공고횟수,공고번호 등 을 제공하는 서비스입니다.※ 관련 내용은 캠코국유재산포털(https://gpminwon.kamco.or.kr)에서도 확인할 수 있습니다.※ 데이터 포맷은 JSON 및 XML 형태로 제공됩니다.
