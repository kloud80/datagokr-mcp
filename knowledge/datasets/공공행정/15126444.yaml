summary_user: 경기도 인구동향조사 혼인 자료로, 혼인신고 한 건마다 신고 연월일, 실제 결혼 연월, 남편·아내 각각의 시도·시군구 코드와 연령·교육·직업·결혼종류·국적 구분을 담은 건별 마트이며, 범위는 시도 단위로 분류된 비공간 자료다. 분석가나 정책 담당자가 '경기도에서 초혼 연령이 어떻게 변해 왔고, 국제결혼 부부의 교육·직업 구성은 어떤가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했다. 다른 데이터와는 시도·시군구 코드나 행정주소 코드(hsbn_administ_addr_cd)를 이름·코드로 매핑하거나, 같은 기관 코드 체계로만 잇는다.
description_portal: 경기도 인구동향조사 혼인분석 데이터는 혼인신고를 기준으로 한 부부의 특성을 분석한 자료입니다. 주요 항목에는 신고년도·월·일, 남편 및 아내의 시도·시군구코드, 실제결혼년도와 월, 직업코드, 교육코드, 결혼종류코드, 연령코드 및 연령내용, 국적구분 및 코드, 행정주소코드 등이 포함됩니다. 이를 통해 혼인 시기별, 연령대별, 교육 및 직업 수준별 혼인 현황을 파악할 수 있으며, 내국인·외국인 간 국제결혼 양상도 분석할 수 있습니다. 본 데이터는 결혼 연령 추세, 직업·교육과 혼인의 관계, 지역별 혼인 특징 등을 연구하는 데 활용될 수 있습니다.
