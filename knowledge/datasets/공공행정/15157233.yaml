summary_user: 온비드에 등록된 공매 물건 중 차량(자동차·운송장비 등)으로 분류되고 현재 입찰 중이거나 입찰 예정인 물건을 건별로 담으며, 물건명·재산유형·입찰방식·입찰기간·감정평가금액·최저입찰가격·유찰횟수·소재지 등을 제공한다. 공매로 나온 중고 차량을 사려는 개인·사업자가 "지금 입찰 중인 압류·불용 차량 중 감정가 대비 최저입찰가가 낮은 것은 무엇인가" 같은 질문에 쓴다. 조회된 물건관리번호(cltrMngNo)와 공매조건번호(pbctCdtnNo)로 온비드 차량 물건상세 조회 서비스와 이어 쓰며, 실측상 전역 조인 키는 없어 다른 데이터와는 소재지 지번·도로명 PNU, 주소명, 기관명으로만 연결한다.
limits: 검증 호출에서 0행이 수신되어 실제 응답 내용과 규모는 확인되지 않았다. 재산유형코드와 수의계약가능여부를 반드시 넣어 호출해야 하며, 개발계정은 하루 1,000회로 제한된다. 2026년 1월 1일 이후 확정된 공고는 차수가 표시되지 않는다.
