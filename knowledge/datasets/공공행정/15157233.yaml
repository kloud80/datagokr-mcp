description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid)에 등록된 공매 물건목록 중 물건유형이 차량(자동차, 운송장비 등)으로 분류되며 현재 입찰 중이거나 입찰예정인 차량 목록을 조회할 수 있는 서비스입니다. 이용자는 제조사, 모델명, 주행거리, 입찰기간 등을 검색조건으로 공매 차량 정보를 조회할 수 있습니다. 본 서비스에서 조회된 물건관리번호(cltrMngNo), 공매조건번호(pbctCdtnNo)로 온비드 차량 물건상세 조회 서비스를 조회하시면 더 상세한 정보를 조회 가능합니다. 필수 검색 조건 : 재산유형코드(prptDivCd), 수의계약가능여부(pvctTrgtYn)'
