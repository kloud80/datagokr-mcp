description_portal: 본 데이터는 전북특별자치도 부안군에서 설치 및 운영하고 있는 전광판 현황 데이터 이다. 데이터에는 전광판구분이 포함되어 멀티전광판과 문자전광판을 구분할 수 있는 정보가 포함되어 있으며, 전광판상세설명을 통해 운영목적 등의 추가적인 정보 또한 포함되어 있다. 전광판 크기는 mm단위로 가로길이, 세로길이 항목으로 구분되어 있으며, 전광판에 화면을 송출하기 위해 전광판과 통신하는 방법인 송출방식과 문자, 그래픽, 영상 등 전광판에 화면을 표출하는 방식인 표출형식, 그리고 설치위치정보(도로명주소, 지번주소, 위도, 경도) 등이 포함되어 있어 부안군 내 전광판 분포, 종류별 현황 파악이 가능하다.본 데이터를 활용하여 전광판 현황 등을 분석하여 신기능 전광판 개발, 시장규모 파악, 국내외 전광판 비교와 같은 연구에 활용이 가능하며, 전광판 관련정책 수립에 활용이 가능하다.
