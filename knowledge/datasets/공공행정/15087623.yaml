summary_user: 제주특별자치도의회가 인터넷으로 중계한 회의 방송을 한 건씩 담은 목록 파일로, 방송일·회의종류·차수·제목 등을 기록한다(약 21KB 규모의 CSV). 도민이나 의정 감시 활동가가 특정 날짜에 어떤 본회의·상임위원회 회의가 중계됐는지 찾아 다시보기 대상을 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 방송일·회의종류·차수 같은 이름과 날짜를 맞춰 도의회 회의록 등과 이어 쓴다.
description_portal: '제주특별자치도 도의회에서 제공하는 인터넷 방송과 관련한 데이터를 제공합니다.항목: 관리번호, 대수, 방송일, 회의종류, 차수, 제목*「제주특별자치도의회 회의규칙」에 의거하여 관리됨- 도의회 의장 또는 위원장은 비공개 대상 이외에는 도의회의 의사를 도의회 인터넷 홈페이지 등 정보통신망을 통하여 중계 방송하여야 함- 중계방송은 본회의·상임위원회의·특별위원회의(공청회·청문회·행정사무감사 및 조사를 포함한다)를 그 대상으로 함자세한 사항은 제주특별자치도의회 홈페이지에서 확인하시기 바랍니다.https://www.council.jeju.kr/broadcast/broad.do'
