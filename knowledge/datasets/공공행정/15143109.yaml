description_portal: '해당 데이터는 경상남도 합천군 관내에 있는 행정사 사무소 현황에 관한 자료를 담고 있습니다.주요 데이터 항목으로는 각 합천군 관애에 있는 행정사 사무소의 업체명, 신고일자, 운영상태, 도로명주소, 사무실 전화번호, 자료의 최신성이 확인가능한 데이터 기준일 등을 제공합니다.이 자료를 통하여 지역 내 행정사 관련 정보 제공을 통해 주민들의 행정 업무 지원 및 법률서비스 접근성을 높이고, 행정사 업무 현황 파악 및 관리에 활용됩니다.  - 행정사 사무소 : 공공기관에 제출하는 서류 작성 등 법률에 기반한 다양한 행정업무를 대행하는 전문 서비스 기관을 뜻합니다.'
