description_portal: '폐쇄말소대장 층별개요 데이터는 폐쇄되거나 말소된 건축물에 대한 층별 정보를 기록한 자료입니다. 이 데이터에는 건축물의 위치 정보(시·군·구, 법정동, 지번), 대지 구분(대지, 도로 등), 도로명 주소, 지상·지하 여부, 층 번호와 층명(예: 1층, B1층), 구조 형식(철근콘크리트구조, 목구조 등), 주 용도(주택, 상가, 공장 등)와 부수 용도, 각 층별 면적(㎡)이 포함됩니다. 또한 주건축물과 부속건축물 여부, 해당 면적이 연면적 산정에서 제외되는지 여부 등의 정보도 제공됩니다. 주로 과거 건축물 이력 관리, 재개발·재건축 사전 조사, 도시계획 수립, 부동산 가치 분석 등에 활용됩니다.'
