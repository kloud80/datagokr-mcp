summary_user: 중앙행정심판위원회가 처리한 행정심판 사례를 사건별 목록으로 담으며, 사건번호·사건명·처분청·재결청·처분일자·의결일자·재결구분 등을 제공하고 범위는 전국이다. 행정처분을 받은 국민이나 사업자, 법률 분석가가 비슷한 처분에 대해 심판에서 어떤 재결이 나왔는지 찾아볼 때 쓴다. 전역에서 통하는 조인 키는 없고 사건번호, 행정심판재결례일련번호, 상세링크로 개별 재결례 본문을 따라가거나 처분청 이름과 코드를 매핑해 다른 자료와 잇는다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있다. 외부 사이트 open.law.go.kr의 인증키(query 파라미터 OC)가 필요하며 포털 활용신청과는 별개다.
