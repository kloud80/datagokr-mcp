description_portal: (합성데이터) 한국남동발전 임직원의 어학자격 취득이력에 대한 합성데이터입니다. 원본데이터 특성을 고려하여 경험적 분포 샘플링, 모수.비모수 통계, 제약 조건 기반 규칙 등을 통해 생성하였으며 식별가능한 정보(사번, 성명, 생년월일, 성별, 소속)는 일정한 형식의 랜덤값으로 생성하였습니다. 해당 데이터는 순번, 사번, 성명, 생년월일, 성별, 소속, 어학시험, 응시일, 유효일, 듣기, 읽기, 총점(듣기,읽기), 말하기, 쓰기 등의 정보를 포함합니다. 시험등급의 경우외국어 말하기 능력을 초급(Novice), 중급(Intermediate), 고급(Advanced)의 3단계로 나누고, 이를 다시 9가지 세부 등급으로 평가하는 시스템으로 9가지 세부 등급은 NL < NM < NH < IL < IM1 < IM2 < IM3 < IH < AL 순으로 구성되어 있습니다. 데이터 활용 시 참고 바랍니다.※ 본 합성데이터는 지속적인 제공이 어려워 주기성 데이터가 아닌 수시성 데이터로 개방됩니다.※ 말하기,쓰기 컬럼의 시스템에서 비공개 처리된 데이터로 향후 데이터 추가 시 반영 예정입니다.
