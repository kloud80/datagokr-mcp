summary_user: 서울시에 있는 유흥주점(클럽·룸살롱 등)을 업소 한 곳당 한 건으로 담은 인허가 원장으로, 인허가·폐업·휴업 일자, 영업상태, 주소와 좌표, 종사자 수, 보증금·월세, 다중이용업소 여부 등을 포함한다. 상권 분석가나 행정 담당자가 '특정 자치구에서 지금 영업 중인 유흥주점은 몇 곳이고 어디에 몰려 있는가'를 확인하거나 업소별 개업·폐업 이력을 추적하는 데 쓴다. 전역 조인 키는 없으므로 개방자치단체코드·관리번호(MGTNO)로 같은 출처인 LOCALDATA 인허가 자료와 맞추고, 주소나 좌표를 기준으로 행정동·상권 단위 자료와 공간으로 이어 쓴다.
description_portal: 서울시 유흥주점영업 인허가 정보는 서울시에 소재한 유흥주점(유흥주점 형태의 술집, 클럽, 룸살롱 등)에 대해 행정기관이 부여한 인허가 및 영업 현황을 체계적으로 관리하기 위한 공공데이터입니다. 이 데이터에는 각 업소마다 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자와 같은 시간 정보가 포함되어 있어, 특정 시점에 어느 업소가 실제로 영업 중인지, 과거에 어떤 행정 변동이 있었는지를 추적할 수 있습니다. 또한 영업상태명, 상세영업상태명 등을 통해 단순히 영업·폐업 여부뿐 아니라 휴업, 취소, 말소 등 보다 세분화된 상태를 구분할 수 있습니다. 위치 관련해서는 지번주소, 도로명주소, 우편번호, 좌표(X, Y) 등이 제공되어 지도 기반 분석, 생활권·상권 분석, 특정 지역 내 유흥주점 밀집도 파악 등에 활용할 수 있습니다. 사업장명, 전화번호는 개별 업소 단위의 식별 및 연락처 확인을 가능하게 합니다. 업태구분명, 위생업태명, 영업장주변구분명, 등급구분명 등은 이 업소가 어떤 유형의 유흥업소인지, 위생·서비스 수준이나 주변 환경 특성이 어떠한지를 나타내어, 행정 지도·단속이나 정책 설계에 참고 자료가 됩니다. 또한 남성종사자수, 여성종사자수, 총인원 등 종사자 정보는 유흥업종이 해당 지역 고용에 어느 정도 기여하는지, 인력 구조가 어떤지를 파악하는 데 유용합니다. 건물소유구분명, 보증액, 월세액 정보는 임대료 수준, 자산 구조, 상권의 경제적 부담 등을 간접적으로 보여 주며, 다중이용업소여부와 시설총규모는 화재·재난 안전 관리, 피난 계획 수립 등 안전정책에 중요한 기초자료로 쓰일 수 있습니다. 전통업소지정번호와 전통업소주된음식은 일반 유흥주점 중에서도 전통문화나 전통음식을 중심으로 하는 특수 업소를 구분할 수 있게 해 주어, 관광·문화정책과 연계한 분석이 가능합니다. 전반적으로 이 데이터는 유흥주점의 분포, 규모, 영업 특성, 안전·위생 수준, 지역 경제 및 고용과의 연관성을 종합적으로 분석하는 데 활용될 수 있는 기반 정보입니다.
