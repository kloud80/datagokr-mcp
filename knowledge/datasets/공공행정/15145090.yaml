summary_user: 전북특별자치도 고창군이 낸 고시·공고를 한 건씩 담은 CSV 파일(약 17MB)로, 공고 번호·제목·담당 부서·구분·일자·게시 기간과 본문 내용(컨텐츠)을 담는다. 고창군 주민이나 사업자가 특정 기간에 어느 부서가 어떤 고시·공고를 냈는지 찾아보거나, 분석가가 부서별·구분별 공고 건수 추이를 살피는 데 쓴다. 다른 데이터와 이을 전역 조인 키는 없어서, 부서명이나 공고 제목 같은 이름 매칭, 또는 같은 고창군 기관 단위로만 연결한다.
description_portal: 전라북도 고창군의 고시공고 데이터를 개방하여 누구나 쉽게 열람하고 활용할 수 있도록 제공합니다. 이를 통해 행정의 투명성과 신뢰성을 높이고, 지역 주민뿐만 아니라 외부 연구기관, 기업, 개발자 등 다양한 주체가 고창군의 행정정보를 기반으로 한 서비스 개발 및 분석에 활용할 수 있습니다. 개방되는 데이터는 최신 고시공고 내용을 포함합니다. 또한 데이터 개방은 주민 참여를 활성화하고 지역사회 소통을 강화하는 데 기여하며, 고창군 행정의 효율성과 정보 접근성을 높이는 중요한 기반이 될 것입니다. 앞으로도 지속적인 데이터 품질 관리와 보완을 통해 더욱 효과적인 정보 공개 체계를 구축할 예정입니다.
