description_portal: 본 데이터는 공공사업 추진과정에서 토지 소유자와의 협의를 통해 공공용지 현황을 사업정보 형태로 제공한다. 협의취득은 토지 수용이나 재결절차와 달리, 보상금액과 조건에 대해 당사자 간 합의를 거쳐 토지를 확보하는 방식으로, 사업 추진 초기 단계에서 신속한 부지 확보와 분쟁 최소화를 위해 활용된다.본 데이터에는 사업종류, 사업명, 토지면적, 토지 보상금액(원) 등이 포함된다. 사업종류는 사업 목적과 성격에 따라 구분되며, 토지 면적은 협의취득을 통해 실제로 확보한 부지의 규모를 나타내며, 보상금액은 이에 대한 재정 집행 내역으로 사업별 예산 집행 현황을 확인할 수 있다.본 데이터는 협의취득 절차를 통해 확보된 공공용지의 규모와 보상 현황을 체계적으로  파악할 수 있고 협의취득 과정의 투명성과 공공사업 부지 확보 실적을 파악하는 데 활용되며, 토지관리, 예산계획, 정책 수립 등 행정적 판단의 참고자료로 제공될 수 있다.
