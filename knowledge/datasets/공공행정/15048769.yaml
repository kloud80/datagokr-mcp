description_portal: 서울특별시 서대문구에서 집행하는 년도별 주민참여예산 재정자립도 현황(년도, 재정자립율)에 대한 데이터를 제공합니다.주민참여 예산제도는 지방자치단체의 재정 건전성 지표인 재정자립도와 상관관계를 가지는 것으로 나타납니다.주민들이 예산 편성 과정에 참여하면서 예산 낭비와 남용을 감시하고, 지역 주민들의 실제 수요에 맞는 사업을 발굴하는 데 기여합니다.데이터는 2017년 부터 2021년까지의 자료입니다.재정자립도는 지방자치단체가 자체적으로 살림을 꾸릴 수 있는 능력(지방세 + 세외수입)을 의미하는 지표입니다.
