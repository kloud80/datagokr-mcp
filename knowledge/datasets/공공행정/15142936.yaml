description_portal: 본 데이터는 구·군별 전세 사기 피해자 결정 건수 정보이다. 자치구별 피해자 수, 지원 결정 건수, 피해 규모, 지원 내용 등의 세부 내용을 포함한다. 전세 사기 피해자 지원 결정은 전세 사기로 인한 주거 불안 및 경제적 피해를 입은 피해자를 구제하기 위한 행정 조치이다. 해당 자료는 전세 사기 예방 정책 수립, 피해자 지원 사업 확대, 주거 안정 대책 마련에 활용된다. 지역별 피해 현황 파악을 통해 전세 사기 취약 지역을 선정하고 집중 관리 방안을 마련할 수 있다. 또한 피해자에 대한 주거 지원, 금융 지원, 법률 지원 등 종합적인 피해 구제 방안을 제공한다. 전세 사기 예방 홍보 및 계약 시 주의 사항 안내를 통해 추가 피해 발생을 방지한다.
