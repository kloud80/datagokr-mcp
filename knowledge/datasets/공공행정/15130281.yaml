description_portal: SGIS오픈플랫폼 개발지원센터의 고객지원 서비스 중 API요청 정보입니다.제목, 내용, 우선표출여부, 파일등록여부 등의 정보를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. OpenAPI(Application Programming Interface)  - 개발자가 통계청의 다양한 오픈API를 이용하여 작게는 운영사이트의 다양한 서비스 활용을 지원하고, 넓게는 창조적이고 다양한 애플리케이션을 개발할 수 있도록 기술과 서비스를 공유하는 프로그램
