description_portal: '세종특별자치시시설관리공단은 봉안당(봉안담) 이용과 관련된 계약 현황을 투명하게 제공하기 위해 봉안당(담) 계약정보 데이터를 공공데이터로 공개하고 있습니다. 본 데이터는 계약 기간, 안치 구분, 사용료 등 주요 정보를 포함하여, 시민이 봉안시설 이용 현황을 쉽게 확인할 수 있도록 구성되어 있습니다.■ 데이터 컬럼 구성데이터는 다음과 같은 항목으로 구성됩니다.안치구분: 개인형·부부형·가족형 등 안치 방식 구분화장시설: 내부 화장시설 이용 여부 또는 외부 화장시설 이용 여부화장접수일: 고인의 화장 접수가 이루어진 날짜국내·해외 구분: 고인의 국적 또는 등록 구분(국내/해외)관내·관외 구분: 주소지 기준 관내 이용자 여부(관내/관외)고인성별: 남성, 여성 등 고인의 성별 정보계약시작일: 봉안당 이용 계약이 시작된 날짜계약종료일: 계약 만료 예정일계약갱신횟수: 기존 계약이 갱신된 횟수사용료합계: 해당 계약에 부과된 총 사용료 금액■ 데이터 제공 목적본 데이터는 봉안시설 이용 현황을 공개함으로써,장사행정의 투명성 강화계약 및 사용료 체계의 공정성 확보봉안시설 수요 분석 및 장기적 운영 계획 수립 지원시민의 정보 접근성 향상 및 예측 가능한 장례 서비스 제공을 목표로 하고 있습니다.세종특별자치시시설관리공단은 앞으로도 시민들이 신뢰할 수 있는 장례·봉안 서비스를 이용할 수 있도록, 관련 정보를 지속적으로 공개하고 서비스 품질을 높여 나가겠습니다.'
