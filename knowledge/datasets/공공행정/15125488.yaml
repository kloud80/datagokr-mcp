summary_user: 가맹 브랜드별로 가맹점 입지를 누가 정하고(입지선정주체명) 어떤 기준으로 정하는지(입지선정기준내용)를 기준년도·브랜드관리번호 단위로 조회하는 전국 범위 API로, 한 브랜드에 기준이 여러 건이면 일련번호로 나뉜다. 창업 예정자가 "이 프랜차이즈는 점포 자리를 본부가 정하나, 내가 고르나, 어떤 조건을 요구하나"를 정보공개서 차원에서 확인하는 데 쓴다. 브랜드관리번호·가맹본부관리번호로 공정위의 다른 가맹정보 API(브랜드·가맹본부 일반정보 등)와 이어 쓰지만, 실측상 전역 조인 키는 없어 기관 밖 데이터와는 이름 매핑으로만 연결된다.
limits: 사업자등록번호 같은 전역 키가 실측 컬럼에 없어 타 기관 데이터와 바로 결합하지 못하고, 공정위 내부 관리번호나 이름으로만 연결된다. 전국·비공간 데이터라 실제 점포 위치나 지역별 분석에는 쓸 수 없고, 기준년도와 브랜드관리번호를 알아야 조회된다.
