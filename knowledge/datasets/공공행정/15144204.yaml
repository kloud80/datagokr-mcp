description_portal: 대표홈페이지에 등록된 갈등관리 전문가POOL은 공공기관, 지자체, 민간 등에서 발생하는 다양한 갈등 사안에 전문적으로 대응하기 위해 구축된 전문가 인력 데이터베이스입니다. 이 POOL에는 갈등예방, 조정, 중재, 진단, 영향분석 등 갈등관리 전 과정에 걸쳐 실무 경험과 전문성을 갖춘 인력들이 포함되어 있으며, 각 전문가의 소속, 직급, 전공, 경력 등의 정보가 체계적으로 정리되어 있습니다. 이를 통해 기관은 갈등 발생 시 상황에 적합한 전문가를 신속하고 효율적으로 매칭할 수 있으며, 갈등관리 정책의 전문성과 대응력 향상에 기여합니다. 전문가POOL은 갈등 해결 역량 강화를 위한 핵심 인프라로, 공공의 신뢰 확보와 정책 추진의 안정성을 높이는 데 중요한 역할을 합니다.
