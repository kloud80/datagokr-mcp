description_portal: 본 데이터는 (주)한국가스기술공사의 2016년부터 2026년 1분기까지의 신규 및 지역인재 채용 현황을 기록한 자료입니다. 일반정규직 총 신규채용 인원과 청년, 여성, 장애인, 비수도권 지역인재 채용 인원이 연도별로 구분되어 있으며, 청년·여성 채용 확대, 장애인 고용 의무 이행, 지역균형 발전을 위한 비수도권 인재 채용 등의 지표를 제공합니다. 예를 들어, 2019년에는 신규채용이 150명, 청년 144명, 여성 5명, 비수도권 지역인재 101명으로 나타나며, 2024년 3분기 기준 총 152명의 신규채용 중 청년 147명, 여성 42명, 비수도권 인재 118명이 포함되어 있습니다. 해당 자료는 연도별 채용정책 효과 분석, 고용 다양성 제고 전략 수립, 정부 고용정책 이행 평가, 향후 인력수급 계획 수립 등에 활용될 수 있습니다.
