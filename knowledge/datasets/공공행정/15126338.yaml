summary_user: 후원방문판매사업자 수를 기준년월·갱신년도·시도·시군구·영업상태별로 묶고, 자본금 규모 구간(1억원 이하부터 20억 초과, 정보없음)별 업체 수와 총사업자 수로 나눠 담은 월별 집계 통계로, 범위는 전국이며 행정단위는 시군구까지다. 정책 분석가나 업계 연구자가 "우리 지역 후원방문판매사업자 중 자본금 1억원 이하 영세 업체 비중이 어떻게 변해 왔나"처럼 지역별·규모별 추이를 볼 때 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어서 개별 사업자 등록정보와는 직접 연결되지 않고, 시도명·시군구명이나 기준년월을 이름으로 맞춰 다른 지역 통계와 붙여 쓴다.
description_portal: 후원방문판매사업자에 대한 월기준의 갱신년도별, 지역별,법인여부별, 자본금규모별, 영업상태별 사업자 수 통계를 제공하는 서비스통계표 후원방문판매사업자 자본금규모 업체 현황 - 월별, 지역별 작성목적 월별 자본금규모 통계 추이 작성주기 매월 조사대상 후원방문판매사업자
