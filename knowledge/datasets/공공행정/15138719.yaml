summary_user: 지방자치단체별 통장·이장·반장 활동보상금의 당초예산 정보를 회계연도 단위로 담은 집계 데이터로, 포털 설명상 2015~2019 회계연도 전국 자치단체의 세출총액과 활동보상금 편성액·비율을 제공한다. 지역 행정 분석가나 주민이 '우리 시·군·구는 통·리·반장 보상금에 예산을 얼마나, 세출 대비 몇 % 편성했나'를 다른 자치단체와 비교할 때 쓴다. 전역 조인 키는 없고, 자치단체 코드(laf_cd)와 자치단체명, 회계연도로 같은 지방재정365의 다른 공시 데이터와 맞춰 잇는다.
description_portal: 지방자치단체의 통장/이장/반장 활동 보상금은 지역행정의 원활한 수행을 지원하기 위해 지급되는 실비성 경비로 지방자치단체 예산편성운영기준 별표4에 따라 예산 범위내에서 월정액으로 지급됩니다.기준액은 통-리장의 경우 기본수당 월400,000원이내, 상여금 연200%, 회의참석수당 월2회지급, 반장수당50,000원입니다.통장이장반장 활동보상금 정보는 2015~2019 회계연도의 정보가 제공되며 대상회계는 자치단체 일반회계, 기타/공기업특별회계 기금을 대상으로 당초예산 정보가 제공됩니다. 세부 제공정보는 세출총액, 편성액, 통장이장반장 활동 정보입니다.
