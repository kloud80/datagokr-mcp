description_portal: '강원특별자치도 주요 산업별(20개 산업)·시군별(18개 시군) 사업체 수와 종사자 수를 2010년부터 2019년까지 제공하는 장기 통계자료입니다.산업 분류는 농업, 광업 등 대분류 체계로 구성되며, 각 산업 아래에 다시 세부 업종으로 계층적 구조를 통해 산업구조를 면밀하게 파악할 수 있습니다. 또한 사업체별 종사자 규모(예: 1~4인, 5~9인, 1000명 이상 등) 기준으로 세분화된 통계를 제공함으로써 지역 내 산업별 고용 규모와 분포를 정밀하게 분석할 수 있습니다.이 자료는 시군 간 산업구조 비교, 특정 산업의 성장·축소 추세 분석, 지역 고용정책 및 산업육성 전략 수립에 활용 가능한 기초 통계자료입니다.'
