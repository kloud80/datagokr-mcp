summary_user: 국회 회의에서 제출된 제안설명서의 목록을 건별로 담고, 회의 식별자(CONF_ID)·대수·회기·차수와 문서 내용, 내려받기 주소를 함께 제공하며 범위는 전국·비공간이다. 입법 분석가나 기자가 특정 회기 회의에서 어떤 제안설명서가 나왔는지 찾아 원문을 내려받는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 국회 회의록·의안 데이터와는 회의 식별자나 대수·회기·차수를 같은 기관 기준으로 맞춰 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
