description_portal: '인천광역시가 사회조사를 통해 제공하는 사용 방수별 가구 통계 현황 공공데이터는 시내의 주택을 대상으로 방의 개수에 따라 가구의 규모 및 특성을 집계한 통계 자료입니다. 이 데이터는 주택의 면적별 분포, 가구당 적정 주거 면적, 주거 환경의 질 등을 파악하고, 주거 환경 개선, 소형 주택 공급, 주거 복지 정책 수립의 기초 자료로 활용됩니다.주요 구성 항목은 다음과 같습니다:-행정구역 단위: 데이터는 중구, 동구, 미추홀구, 연수구, 남동구, 부평구, 계양구, 서구, 강화군, 옹진군 등 군/구별로 분류됩니다.-사용 방수별 가구 수 (개): 주택의 방의 개수에 따라 1개, 2개, 3개, 4개, 5개, 6개 이상으로 구분하여 해당 가구 수(명)를 제공합니다.'
