description_portal: '남해군 내 마을별 인구 현황을 나타내는 공공데이터로, 마을명, 세대수, 총 인구수, 남녀 인구수, 65세 이상 고령자 수 등의 항목으로 구성되어 있습니다.○ 마을별 : 남해읍 관할 행정구역 단위로 구성된 각 마을의 명칭을 포함하고 있습니다.○ 세대수 : 해당 마을에 거주하는 가구의 수를 나타냅니다.○ 인구수 : 전체 주민 등록 인구를 집계한 수치를 포함하고 있습니다.○ 남자인원수/여자인원수 : 인구수 중 성별에 따른 세부 인원수를 구분하여 제공합니다.○ 65세 이상 고령자수 : 고령층 인구 수를 별도로 표시하여 고령화 수준을 파악할 수 있도록 합니다.이 데이터는 지역 인구 구조 분석, 고령화 대응 복지정책 수립, 마을별 의료·돌봄 인프라 계획, 생활SOC 배치, 노인 일자리 사업 설계 등 행정 및 복지분야에서 다양하게 활용될 수 있습니다. 특히 고령자 비율이 높은 마을을 중심으로 정책적 우선순위를 설정하는 데 기반 자료로 유용합니다.'
