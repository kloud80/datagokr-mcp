summary_user: KDI가 KDI FOCUS·연구보고서 내용을 영상으로 풀어 발간한 영상보고서의 목록을 영상 1건당 한 행(채널, 영상 제목, 영상 URL, 등록일)으로 담은 파일이며, 범위는 전국·비공간 자료다. 경제 동향·관세·가계부채 같은 주제를 다룬 KDI 해설 영상을 찾으려는 국민이나 연구자가 '최근 KDI가 어떤 경제 주제로 영상을 냈는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영상 제목·등록일 같은 이름 매칭이나 같은 기관(KDI) 기준으로만 이어 쓴다.
description_portal: 한국개발연구원_KDI VOD 목록은 KDI에서 발간하는 영상보고서입니다. KDI FOCUS, KDI 연구 보고서의 이해를 돕고자 보기 쉽게 영상으로 제작해 발간하고 있습니다. 한국개발연구원_KDI VOD 목록은 순번, 채널, 동영상 제목, 동영상파일경로명, 등록일로 구성되어 있으며, 2025년 9월 경제동향, 태양광, 풍력, 무작정 늘렸다간...대규모 정전 위험까지?, 일단락된 한미 관세협상, 불확실성은 마침표를 찍은 걸까? 2025년 한국경제는?, ‘6억 대출규제‘ 없어도 가계부채가 하락한다면? 우리가 몰랐던 가계부채의 비밀, 대선까지 치뤘겠다...2025년 한국경제는 어떻게 되는걸까?, 우리가 미국 관세 폭탄의 타겟이 될 수 밖에 없는 이유, 올해도 1%대 성장 예상된다는데....이제부터 일본식 장기 불황?, BTS, 블랙핑크, 오징어게임의 성공...실제로 경제에 미친 영향력은? 등 국내외 경제 동향과 전망을 보다 흥미롭게 기획하고 제작하여 제공하는 영상 보고서 목록입니다.
