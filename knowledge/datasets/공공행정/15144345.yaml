description_portal: '이 데이터는 경찰서에서 운용 중인 차량의 차종(승용, 승합, 화물, 특수, 이륜), 차형(대형, 중형, 소형, 다목적형), 그리고 **용도(예: 경호, 순찰차, 범죄수사 등)**를 분류한 정보입니다. 이를 통해 경찰 차량의 운영 실태를 파악하고, 용도별·차형별 분포를 확인할 수 있습니다. 예를 들어, "순찰차(112)"나 "테러진압"과 같은 긴급 대응 차량부터, "업무", "지휘", "물자수송" 등의 내부 행정 및 지원 목적의 차량까지 다양하게 분포되어 있습니다. 특히, 대형과 다목적형 차량은 현장지휘나 테러 대응에 활용되는 반면, 소형 승합차는 과학수사, 사고조사 등 전문 업무에 특화되어 있습니다. 이 데이터는 경찰 장비 운용의 투명성을 높이고, 정책 수립 및 예산 집행 시 참고자료로 활용될 수 있습니다.'
