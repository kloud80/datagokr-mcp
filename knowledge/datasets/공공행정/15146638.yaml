description_portal: 한국에너지공단 신재생에너지센터의 팝업정보를 게시합니다. 공단은 사용자 경험(UX) 측면에서 팝업을 지양하고 있습니다. 디지털 정부서비스 UI·UX 가이드라인 (2024년 2월 배포)에서도 작성된것과 같이 팝업은 화면 흐름을 끊어버리기 때문에 사용자가 작업 중이던 맥락에서 벗어나게 하고,   팝업 차단기가 걸리거나, 브라우저 탭이 여러 개 뜨면 사용자가 혼란스러워집니다. 또한,  모바일 환경에서는 팝업이 화면에 맞게 열리지 않거나, 새 창이 열려서 UX가 더 떨어집니다. 이를 대응하기 위해 모달 다이얼로그(modal dialog), 오버레이 레이어어(레이어 팝업). 사이드 패널 등을 활용하여 UX는 유지하면서도 위 문제들을 피할 수 있습니다. 또한 등록 IP 및 수정 IP는 비식별화 처리하였으니 업무에 참고하여주시기 바랍니다.
