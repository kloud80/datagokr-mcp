description_portal: '강원특별자치도 강릉시 대표 홈페이지와 연계된 패밀리 사이트 현황을 제공하는 데이터로, 시청·산하기관·생활·문화·교육 분야별 주요 웹사이트 정보를 한곳에 정리한 목록입니다.주요 항목은 다음과 같습니다.지역: 사이트가 소속된 지역으로, 강원특별자치도 강릉시를 의미구분: 사이트의 성격·분야 구분 값예: 강릉시(본청·직속기관), 민원생활(민원·생활편의 서비스), 문화관광, 교육시설, 산하기관 등사이트명: 열린시장실, 보건소, 강릉관광, 강릉커피축제, 강릉시립도서관, 강릉관광개발공사 등 각 웹사이트의 명칭링크 주소(URL): 해당 사이트로 직접 접속할 수 있는 웹 주소기준일자: 각 패밀리 사이트 정보(명칭, URL 등)가 확인·관리된 기준 일자이 데이터는 강릉시와 관련된 다양한 행정·민원·생활·문화·교육·산하기관 웹서비스를지역·구분·사이트명·URL·기준일자 기준으로 체계적으로 관리할 수 있도록 해 주며,시 대표 홈페이지의 패밀리사이트 메뉴 구성 및 자동 갱신분야별(민원생활, 문화관광, 교육시설, 산하기관 등) 웹서비스 현황 파악링크 유효성 점검, 중복·폐쇄 사이트 관리 등 웹 자산 관리시민·관광객 대상 통합 서비스 안내 페이지/포털 구축 등에 활용할 수 있는 공공 웹서비스 링크 현황 데이터입니다.'
