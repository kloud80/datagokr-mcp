description_portal: '영등포구 대표 홈페이지에 게시되는 고시공고 정보입니다.제공데이터: 고시공고번호, 제목, 담당부서, 등록일 제공고시공고 정보는 행정기관이나 공공기관이 국민에게 특정한 사실이나 행정 사항을 공식적으로 알리기 위해 제공되는 정보이며, 고시는 법령, 조례, 규칙, 행정계획 등의 내용을 국민에게 널리 알리기 위해 행정기관이 공식적으로 발표합니다.공고는 행정기관이 일반 국민이나 특정 집단에게 어떤 사실이나 절차, 일정등을 알리기 위해 사용하는 수단이며, 공고는 법령에 따른 알림 절차일 수 있고, 단순한 행정편의를 위한 안내일 수도 있습니다.자세한 사항은 영등포구 홈페이지 고시공고를 확인해주시기 바랍니다.https://www.ydp.go.kr/www/selectEminwonList.do?menuFlag=01&key=2851'
