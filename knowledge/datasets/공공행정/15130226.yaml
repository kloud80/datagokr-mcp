description_portal: '[통계지리정보서비스(SGIS)] "통계주제도" 서비스의 대분류 카테고리 정보입니다.각 카테고리의 코드, 코드명, 영문명, 설명등을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 통계주제도  통계와 관련하여 주요주제에 따른 관심사별 통계정보를 손쉽게 확인할 수 있는 서비스'
