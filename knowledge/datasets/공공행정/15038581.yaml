summary_user: 경기도의회와 도 내 시군의회의 의안을 건별로 담으며, 의회명·대수·의안번호·의안명·의안 종류와 발의일·발의자, 소관위원회 회부·의결일, 본회의 상정·의결 결과, 공포일, 원안·수정안 파일과 회의록 링크를 포함한다. 주민이나 분석가가 "우리 시의회에서 이번 대수에 누가 어떤 조례안을 발의했고 본회의에서 어떻게 처리됐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의회명(INST_NM)이나 의원 이름을 기준으로 매핑해 연결해야 한다.
description_portal: 경기도의회 및 시군의회의 의안 정보입니다. 의안번호, 의안명, 발의자 등의 정보를 제공합니다.※ 제공하는 데이터는 경기도 또는 각 시군이 보유한 데이터가 아닌, 경기도의회 및 도 내 각 시군의회에서 보유한 데이터를 각 의회의 협조로 제공하는 것으로 시군별 제공 항목이 상이하니 이용에 참고해주시기 바랍니다.※ 데이터화되어 있지 않은 정보는 제외되어 일부 의회의 경우에는 전부 제공이 불가하거나 일부 데이터만 제공하고 있으니 이용에 착오 없으시기 바랍니다.※ 의안과 관련한 자세한 내용은 각 의회 홈페이지를 통해 확인하시기 바랍니다.
