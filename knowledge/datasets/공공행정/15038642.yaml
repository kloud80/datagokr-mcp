description_portal: 인천광역시 중구 소재 노래연습장 현황에 대한 정보입니다.인천광역시 중구에는 61개소의 노래연습장이 있습니다.[데이터설명]파일명 인천광역시 중구 노래연습장내용 상호, 영업소도로명소재지, 영업소지번소재지 등[노래연습장 설명]방음이 잘 되어있는 방에서 반주기를 통해 노래를 부르는 장소. 유흥업소 허가에 따라 접대부가 있고 술을 파는 유흥주점, 접대부가 없고 술을 파는 단란주점[1], 주류를 일절 판매하지 못하는 일반 노래방 이렇게 세 가지로 분류되며 통상적으로 노래방이라고 하면 주류를 팔지 않는 일반 노래방을 일컫는다. 한국에서의 법적 명칭은 노래연습장. 그런데, 부산에서는 "○○노래방" 간판이 붙어있으면 십중팔구 가요주점이고 조그맣게 유흥주점 표기가 있다. 기존 법적 명칭은 노래방이였으나, 일반적인 청소년 출입시설부터 퇴폐업소 까지 모두 노래방 이름을 달고 있었기 때문에 일반적인 노래방 이미지를 가진 업소는 2001년부터는 무조건 ○○노래연습장으로 끝나야한다. 2001년 이전부터 노래방 명칭을 달고 영업을 하던 업소들의 경우 꼭 바꿔야 한다는 강제성은 없으나 세간의 인식으로 인해 대다수 업소들은 상호명을 노래방에서 노래연습장으로 바꾼지 오래다.
