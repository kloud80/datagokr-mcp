summary_user: 서울 광진구 관내 개방화장실을 시설 한 곳당 한 행으로 담은 파일(csv, 약 21KB)로, 화장실명·도로명/지번 주소·건물 주용도·관리기관·전화번호·데이터기준일자를 포함한다. 주민이나 방문객이 '광진구 안에서 가까운 개방화장실이 어디이고 어느 기관에 문의하면 되나'를 확인하거나, 구 단위 공중위생 편의시설 분포를 살펴보는 데 쓴다. 전역 조인 키는 없으므로 주소(소재지도로명주소·지번주소)를 지오코딩하거나 이름을 맞춰 다른 공중화장실·생활시설 데이터와 연결한다.
description_portal: 서울특별시 광진구_개방화장실 데이터는 광진구 관내에 위치한 개방화장실의 기본 현황과 관리 정보를 제공하는 행정 데이터입니다. 이 데이터는 “화장실명”, “주소”, “건물주용도”, “관리기관명”, “전화번호”, “데이터기준일” 필드로 구성되어 있습니다. ‘화장실명’은 해당 개방화장실의 이름을 나타내며, ‘주소’는 시설의 위치 정보를 제공합니다. ‘건물주용도’는 화장실이 설치된 건물의 주요 용도를 나타내며, ‘관리기관명’은 해당 화장실을 운영·관리하는 기관을 표시합니다. 또한 ‘전화번호’는 시설 이용 문의 및 관리 관련 연락처를 제공합니다. ‘데이터기준일’은 정보의 최신화 기준일을 명시하여 데이터의 시점을 확인할 수 있도록 합니다. 이 데이터는 주민과 방문객에게 개방화장실 위치 정보를 제공하고, 공중위생 관리, 편의시설 운영 현황 분석 및 행정 서비스 개선을 위한 기초 자료로 활용될 수 있습니다.
