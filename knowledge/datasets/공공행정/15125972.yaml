summary_user: 국회입법조사처가 펴낸 연구보고서 중 '국제통계 동향과 분석' 간행물을 보고서 한 건 단위로 담으며, 보고서명(BOOKNM)·PDF 파일명과 내려받기 주소·뷰어 주소·구분 코드·등록일 같은 목록 정보를 전국·비공간 범위로 제공한다. 정책 담당자나 연구자가 특정 국제통계 주제에 대해 입법조사처가 낸 분석 보고서가 있는지 찾고 원문 PDF를 바로 열어 보는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키는 없어, 다른 국회 간행물 목록과는 보고서명이나 같은 기관 구분 코드로만 맞춰 이어 쓴다.
