description_portal: 이 데이터는 서울특별시 양천구에서 부과하는 지방세 중 비과세 및 감면 대상 현황을 체계적으로 정리한 자료이다. 양천구 관내 개인 및 법인을 대상으로 적용된 지방세 비과세와 세액 감면 내역을 세목별, 감면 유형별, 과세기간별로 제공함으로써 지역 세제 운용 구조를 한눈에 파악할 수 있도록 구성하였다. 각 건별로 감면 사유, 법적 근거,  감면액, 과세연도 등 주요 항목을 포함하여 납세자 지원정책의 실제 집행 상황을 확인할 수 있게 한다. 이를 통해 이용자는 양천구의 지방세 감면 정책이 특정 계층·산업·사업유형 등에 어떠한 혜택을 제공하고 있는지 분석할 수 있으며, 제도 개선을 위한 기초자료로 활용할 수 있다. 또한 유사 지자체와의 세정 비교 분석, 지방재정 영향 평가, 재정 건전성 검토 등 정책 수립 과정에서 참고자료로 활용하기에 적합한 데이터이다.
