description_portal: 한국동서발전의 기부실적 정보는 사회적 책임 경영의 일환으로 추진된 기부 내역을 연도별로 기록한 데이터입니다.해당 데이터는 순번, 날짜, 수령인, 자매결연 여부, 기부금액(원), 기부사유 등의 항목으로 구성되며, 기부 대상의 특성이나 목적, 자매결연 여부 등 다양한 정보를 통해 공기업의 사회공헌 활동을 체계적으로 확인할 수 있습니다.이 데이터는 한국동서발전이 어떤 분야나 단체에 기부를 집중하고 있는지를 파악하는 데 유용하며, 기부금의 사용 목적이나 금액 규모, 수혜 대상의 분포 등을 분석함으로써 공기업의 사회적 가치 실현 정도를 정량적으로 평가할 수 있습니다.학계 및 연구기관에서는 본 데이터를 활용하여 연도별 기부 트렌드 분석, 자매결연 유무에 따른 기부 규모 비교, 기부 사유의 유형 분류, 기부 대상의 지역별 분포 분석 등 다양한 연구를 수행할 수 있습니다.또한 공공기관의 사회공헌 전략, ESG 경영지표 중 ‘S(사회)’ 요소의 실질적 이행 평가, 지역사회와의 연계성 강화 정책 등과 관련된 정책 연구나 사례 분석에도 활용도가 높습니다.
