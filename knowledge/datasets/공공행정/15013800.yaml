summary_user: 경상북도 영양군의 군청, 보건소·보건지소·진료소, 농업기술센터, 사업소, 읍·면사무소 등 행정기관을 기관 한 곳당 한 행으로 담은 소규모 목록(약 2.4KB CSV)으로, 기관명·대표 전화번호·도로명주소·위도·경도·데이터 기준일자를 담는다. 영양군 주민이나 민원 안내 서비스 운영자가 "가장 가까운 면사무소나 보건지소가 어디이고 전화번호는 무엇인가"를 확인하거나 기관 위치를 지도에 표시하는 데 쓴다. 공통 기관 코드 같은 전역 조인 키는 없어서, 다른 데이터와는 기관명 매칭이나 도로명주소·좌표 기반의 공간 결합으로만 이어 쓴다.
description_portal: '이 파일은 경상북도 영양군에 있는 주요 행정기관들의 위치와 연락처 정보를 정리한 자료입니다.자료에는 영양군청, 보건소(지소, 진료소 포함), 농업기술센터, 각종 사업소, 읍·면사무소 등, 군민 생활과 밀접한 기관들의 정보가 포함되어 있습니다.각 기관에 대해 행정기관명, 전화번호, 도로명주소, 위도, 경도, 데이터 기준일자로 구성되어 있으며 각 항목은 아래와 같이 정의됩니다:행정기관명: 기관의 이름입니다.전화번호: 대표 연락처로, 기관에 문의할 때 사용할 수 있습니다.도로명주소: 기관이 위치한 주소입니다.위도·경도: 기관의 위치를 지도로 표시할 수 있도록 제공된 정보입니다.데이터 기준일자: 정보가 작성되거나 수정된 날짜입니다.이 자료는 다음과 같은 경우에 유용하게 활용할 수 있습니다:위도와 경도 정보가 있어 각 기관을 지도에 정확히 나타낼 수 있습니다.전화번호가 포함되어 있어 필요한 기관에 쉽게 문의할 수 있습니다.이 자료는 지역 행정기관 안내, 지도 기반 위치 확인, 민원 안내 서비스 등에 활용할 수 있습니다.'
