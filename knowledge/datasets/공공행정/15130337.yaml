description_portal: '[SGIS 오픈 플랫폼] "개발지원센터" 서비스의 dataAPI 메뉴 목록 정보입니다.타입명, 카테고리명, 세부항목명, 링크url 데이터를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  통계청이 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 개발지원센터(SGIS OpenAPI)  - Rest 형식의 서비스를 위한 웹 사이트를 구현하는데 사용할 수 있는 Data API 를 제공하는 서비스  - OpenAPI(Application Programming Interface): 개발자가 통계청의 다양한 오픈API를 이용하여 작게는 운영사이트의 다양한 서비스 활용을 지원하고, 넓게는 창조적이고 다양한 애플리케이션을 개발할 수 있도록 기술과 서비스를 공유하는 프로그램'
