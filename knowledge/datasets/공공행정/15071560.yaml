description_portal: 서울시 비디오물배급업 인허가 정보는 비디오물 유통업체의 인허가 및 영업 현황, 위치, 시설 특성을 종합적으로 제공하는 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자를 통해 영업 상태 변화를 추적할 수 있으며, 사업장명, 전화번호, 지번·도로명주소, 좌표정보로 업체의 정확한 위치와 기본 정보를 파악할 수 있습니다. 또한 시설면적, 건물 총층수와 지상·지하층수, 건물용도, 통로너비, 조명·환기·소방시설, 비상구·비상계단 여부 등으로 안전성과 이용환경을 평가할 수 있습니다. 제작취급품목내용, 품목명, 비디오재생기명은 어떤 유형의 비디오물을 어떤 설비로 다루는지 보여 주며, 문화체육업종명, 문화사업자구분명, 지역구분명으로 문화산업적 성격과 입지 특성을 분석하는 데 활용 가능한 데이터입니다.
