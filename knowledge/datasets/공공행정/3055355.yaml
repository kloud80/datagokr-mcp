description_portal: '대구광역시 동구 관내 다가구주택,다세대주택,숙박시설 공사현황 데이터입니다. 대지위치, 용도, 세대수, 가구수 등의 항목을 포함합니다.해당데이터는 주택 건설 관련 종합 정보를 제공하며  동구 내 주택 공급 현황, 주거 밀집 지역 등을 분석해 기반시설 계획이나 용도 전환 등을 검토할 수 있습니다. 또한 다가구·다세대주택 증가 추세, 세대당 면적 및 거주 환경 개선을 위한 정책 수립에 활용 가능합니다.대지위치: 공사 현장의 지번 또는 도로명 주소로, 해당 공사대지의 명확한 위치를 파악할 수 있습니다.주용도: 해당 부지가 다가구주택, 다세대주택, 숙박시설, 연립주택 등이 주용도로 활용되는지에 대한 분류가 기록됩니다.부속용도: 주차장, 상가, 커뮤니티 시설 등 건물 내 부대·부속 용도(예: 1층 상가 포함 여부)가 포함됩니다.세대수: 해당 공사 현장에서 건립되는 전체 세대 수(각각 구분된 주거세대 수)가 명시되어 있습니다 가구수: 다가구·다세대 주택의 경우, 실제 입주 가능한 가구 수를 나타내며, 세대수와 혼용 사용되기도 합니다.'
