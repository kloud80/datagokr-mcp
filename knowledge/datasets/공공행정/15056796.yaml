summary_user: 지방재정365에서 제공하는 지방자치단체별 사회복지비 비율을 담은 집계 지표로, 회계연도(fyr), 광역·기초 자치단체 코드와 이름, 금액 두 항목(pfa_amt1, pfa_amt9), 비율(rate)로 구성되며 범위는 전국입니다. 주민·분석가가 "우리 시군구는 전체 세출 중 복지에 얼마의 비중을 쓰고, 다른 지자체와 비교하면 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 자치단체 이름이나 지방재정365의 자치단체 코드(laf_cd, wa_laf_cd)를 맞춰 재정자립도 등 같은 기관의 다른 지방재정 지표와 연결한다.
description_portal: 사회복지비율이란 지방자치단체의 전체 예산 또는 총 지출 중 사회복지 분야에 배정된 예산이 차지하는 비중을 의미하며, 해당 자치단체의 복지정책에 대한 재정적 우선순위와 관심도를 가늠할 수 있는 중요한 지표입니다. 사회복지비에는 기초 생활보장, 노인복지, 장애인복지, 아동 및 청소년 복지, 보육, 가족 및 여성 복지, 주거복지, 보건의료 등 다양한 복지 관련 지출이 포합됩니다.이 비율은 일반적으로 전체 세출예산 대비 사회복지 분야 지출액의 백분율로 산정되며, 수치가 높을수록 복지 정책에 더 많은 재정이 투입되고 있다는 것을 나타냅니다.
