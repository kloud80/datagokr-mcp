description_portal: '자치구별 지역내총생산입니다. 서울시 자치구별 지역내총생산 현황을 제공하는 일반‧가공통계입니다. 지역내총생산 분석을 통해, 지역경제의 생산규모 및 지출수준, 소득수준, 산업구조 등을 파악합니다.* 지역내총생산(시장가격) = 지역내총부가가치(기초가격) + 순생산물세 * 당해년가격과 기준년가격 - 당해년가격 : 당해연도의 경상가격으로 평가, 지역경제의 구조변동이나 지역소득을 구성하는 각 요소들의  중요성이 시간의 경과에 따라 어떻게 변동하는가를 분석하고자 할 경우 이용 - 기준년가격 : 어느 특정 년(통상 끝자리 0,5자 연도)도의 가격으로 평가, 장기간에 걸친 물량수준 및 구조변동을  관찰할 경우 이용'
