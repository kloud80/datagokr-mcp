description_portal: '2025. 6. 30. 기준 부산광역시 부산진구 주택관리업자 등록대장에 등록되어 있는 주택관리업자 현황에 관한 데이터입니다주택관리업자는 「공동주택관리법」 제2조제9호에 따라, 공동주택(아파트, 연립, 다세대 등)을 효율적으로 유지·관리하기 위해 입주자 등의 의뢰를 받아 전문적인 관리업무를 수행하는 자를 말합니다. 이들은 일반적으로 위탁관리, 시설물 점검, 청소, 경비, 회계 및 민원처리 등 공동주택 전반의 관리업무를 맡습니다.「공동주택관리법」 제53조 및 시행령 제65조에 따라, 주택관리업자는 시·도지사에게 등록해야 하며, 다음 요건을 갖추어야 합니다:일정 자본금 이상(예: 2억 원 이상)전문 인력 보유(주택관리사 등 일정 수 이상)사무소 설치보험 또는 공제가입 의무교육 이수 등등록 후에는 등록사항 변경신고, 정기보고 등의 의무도 부과됩니다.위탁관리형공동주택의 입주자대표회의와 계약을 체결하여 전반적인 관리업무를 수행하는 방식입니다. 대부분의 의무관리대상 공동주택에서 채택합니다.자치관리형입주자대표회의나 입주자 등으로 구성된 관리조직이 직접 관리업무를 수행하며, 주택관리업자는 컨설팅이나 일부 업무만 위탁받는 경우도 있습니다.겸업형건설사 계열사나 종합관리회사가 건물관리·청소·시설유지보수·소방관리 등 다양한 업무를 패키지로 수행하는 형태도 많습니다.'
