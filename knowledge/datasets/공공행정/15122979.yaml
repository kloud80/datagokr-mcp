summary_user: 경기통계시스템에서 추출한 통계표마다 어느 시점 자료가 어떤 수집방식(조사·행정자료 등)과 공표상태로 수록됐는지를 행 단위로 담은 메타정보 목록으로, 조직번호·통계표 ID·주기구분·수록시점·최종수정일을 가진다. 분석가가 '이 경기도 통계표는 몇 년도까지 수록돼 있고 마지막 갱신은 언제인가'를 확인하거나 통계표별 갱신 시기와 수집방식을 비교할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아 통계표 ID(stats_tbl_id)로 같은 시스템의 통계표 목록과, 주기구분은 '경기도 경기통계시스템 기간정보'와 이름·코드 매핑으로만 잇는다.
description_portal: '이 데이터는 경기도 경기통계시스템에서 추출된 통계표의 수록 시점 및 메타정보를 제공하며, 조직번호, 통계표 테이블 ID, 주기구분, 수록시점, 수집유형, 공표구분, 최종수정일 등의 항목으로 구성됩니다. 각 행은 특정 통계표가 어느 시점에 어떤 방식으로 수록되었는지를 나타내며, 수집유형은 통계 수치의 수집방식(예: 조사, 행정자료 등)을 식별하고, 공표구분은 해당 자료의 공개 상태를 정의합니다. 통계표 테이블 ID를 통해 개별 통계표와의 연계가 가능하며, 주기구분은 데이터가 정기 또는 비정기적으로 수록되었는지를 나타냅니다. 본 데이터는 통계자료의 연도별 수록 현황 파악, 통계자료의 갱신 시기 및 수집방식 분석, 통계표별 메타데이터 설계 등에 활용될 수 있습니다.※주기구분에 해당하는 주기명은 "경기도 경기통계시스템 기간정보"를 참고해 주시기 바랍니다.'
