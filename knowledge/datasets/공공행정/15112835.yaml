description_portal: 서울특별시 강남구 공공건축물 현황 입니다. 기타 사항은 서울특별 강남구 디지털도시과로 주시면 안내해 드리도록 하겠습니다.서울특별시 강남구 내에 위치해 있는 공공건축물에 대한 현황 자료입니다. 이 자료에는 강남구 관내의 주요 공공건축물들의 현황에 관한 정보가 포함되어 있는데, 보다 구체적으로는 각각의 건축물의 명칭인 시설명, 그 시설이 소재하고 있는 도로명주소, 건축물의 바닥 면적을 뜻하는 건축면적(제곱미터 단위), 건물 여러 층을 모두 합친 총 바닥 면적인 연면적(제곱미터 단위) 등의 기본적인 공간 정보가 담겨 있습니다. 또한 각 공공건축물을 담당하거나 관리하는 부서인 관리부서명과, 해당 건축물이 실제로 완공되어 사용이 가능해진 시점을 나타내는 준공일자도 함께 명시되어 있습니다.
