description_portal: 본 데이터는 충청남도 부여군 관내에서 산사태취약지역으로 지정·관리되는 대상지 현황을 정리한 자료입니다. 산사태 및 토석류 등 산림재해 발생 가능성이 상대적으로 높은 구역을 대상으로 하며, 행정기관에서 지정한 취약지역 정보를 체계적으로 제공하는 것을 목적으로 합니다. 각 행은 개별 대상지(필지) 단위로 구성되며, 지번주소를 통해 대상지의 위치를 확인할 수 있습니다. 지적면적은 제곱미터(㎡) 단위로 제공되어 대상지 규모 파악과 관리 우선순위 검토에 활용할 수 있습니다. 또한 **취약지역유형(산사태/토석류)**과 고시번호 정보를 포함하여 지정 구분 및 지정 근거 확인이 가능하도록 구성되어 있습니다. 본 자료는 취약지역의 분포와 관리대상 현황을 파악하여 정기 점검 대상 선정, 예방사업 계획 수립, 재난 대응체계 마련, 주민 안내 자료 작성 등 산림재해 예방 및 안전관리 업무에 활용할 수 있습니다.
