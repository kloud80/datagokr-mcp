summary_user: 서울 강서구가 소유한 공유재산을 필지·재산 단위로 한 건씩 담은 목록으로, 재산종류, 소재지, 지목, 면적(제곱미터), 소유자, 담당부서, 데이터기준일자를 포함한다. 강서구 안에서 공원·체육용지·주차장 같은 구유지가 어디에 얼마나 있는지 확인하려는 주민, 입지나 사업 타당성을 검토하는 사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키(필지고유번호 등)가 없어 다른 데이터와는 소재지 주소나 지목 이름을 맞춰 연결해야 하고, 국유재산 목록과는 주소를 필지번호로 변환한 뒤 대조하는 방식으로 이어 쓴다.
description_portal: 강서구 공유재산목록으로 재산종류, 소재지, 지목(도로,임야,공원,답, 대, 임야, 주차장,체육용지 등), 면적, 소유자, 담당부서, 데이터기준일자가 포함되어있습니다.공유재산이란 지방자치단체 소유 또는 건설 중에 있는 재산(예산부담, 기부채납, 교환 등으로 소유권을 취득한 재산)이며, 공유재산은 그 용도에 따라 행정재산과 일반재산으로 구분하고, 행정재산은 공용재산, 공공용재산, 기업용재산 및 보존재산으로 분류 합니다. 이를 통해 재산의 효율적 관리와 예산 수립에 참고할 수 있으며, 도시계획이나 개발사업 시 기초자료로 활용됩니다. 공원이나 체육용지의 위치와 면적 정보를 통해 주민 편의시설 확충 계획을 세울 수 있고, 도로·주차장 등의 재산은 교통 인프라 개선에 기여합니다. 또한 공공재산의 분포와 활용 현황을 파악하여 지역 자산에 대한 이해를 높이고, 입지 분석이나 사업 타당성 검토에 참고자료로 활용할 수 있습니다.
