description_portal: '○ 통계개요* 통계명 : 인구이동 전입지별(월별)* 통계종류 : 서울시 인구이동 현황을 전입지별로 제공하는 지정ㆍ보고통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국 국민의 지역별 인구이동량 및 이동방향 등을 파악하여 지역간의균형적 국토개발,교통,교육 및 주택 등의 정책수립 자료와 지역별 인구추계에필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 서울시내 및 16개 시도로 구분한 전입지별ㆍ성별ㆍ월별 인구수○ 용어설명* 전입 : 행정 읍면동 경계를 넘어 다른 지역에서 특정 지역으로 이동해 온 경우* 전출 : 행정 읍면동 경계를 넘어 특정 지역에서 다른 지역으로 이동해 간 경우○ 기타* 주민등록 전입신고서를 기초로 집계ㆍ작성된 것으로, 이동사항의 미신고, 지연신고및 위장신고 등으로 사실상의 이동과는 차이가 있을 수 있음'
