summary_user: 한국중부발전이 운영하는 발전소의 보일러 기술 사양을 발전소·호기 단위로 정리한 소규모 파일(csv 775바이트)로, 연소방식·회분제거방식·보일러버너 분사형식을 담는다. 에너지 분석가나 연구자가 "중부발전 각 호기 보일러는 어떤 연소 방식과 재 처리 방식을 쓰는가"처럼 설비 유형을 비교할 때 쓴다. 전역 조인 키는 없어 발전소명·호기 이름을 맞춰 같은 기관의 다른 발전설비 데이터와 이어 쓴다.
description_portal: 본 발전소 보일러 정보 데이터는 한국중부발전이 운영하는 각 발전소의 보일러 기술 사양을 정리한 자료입니다. 항목은 발전소명, 호기, 연소방식, 회분제거방식, 보일러버너 분사형식으로 구성되어 있으며, 보일러의 연료 연소 방식과 재 처리 방식, 연소장치의 분사 형태 등을 확인할 수 있습니다. 이 발전소 보일러 정보 데이터는 발전설비의 연소 효율, 환경오염물질 저감 방식, 설비 유형별 특성 분석에 활용 가능합니다. 또한 보일러 설계·운영 개선, 설비 표준화 계획 수립, 발전소 간 기술 비교 등의 자료로 활용 가능합니다.
