summary_user: 행정안전 통계연보 '지방재정' 편에 실린 지방세 신장 추세 통계로, 연도별 지방세·국세·GDP의 금액과 신장률을 전국 단위 집계로 담는다. 재정 분석가나 연구자가 "지방세가 국세나 경제성장률(GDP)보다 빠르게 늘었나"처럼 지방세수 증가 흐름을 국가 전체 지표와 견줄 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 같은 이름 매핑이나 같은 기관(행정안전부) 통계연보 항목끼리로만 이어 쓴다.
limits: 전국 단위 비공간 집계라 시도·시군구별 지방세나 세목·세출 세부사업 단위 내역은 알 수 없다. 공통 조인 키가 없어 지역 코드로 다른 데이터와 붙일 수 없다. 개발계정은 일 10,000회 호출 제한이 있다.
