description_portal: 인천e음 남성과 여성 성별 거래액,  연령대별 거래액, 구별 거래액 거래액, 월별거래건수, 월별 상위 20위 업종별 거래액에 대해 제공되는 데이터입니다.이 공공데이터는 인천광역시 지역화폐인 인천e음 카드의 이용 현황을 다차원적으로 분석한 통계 자료입니다. 데이터는 성별·연령별·구별 거래액을 통해 인천 시민들의 소비 특성을 파악할 수 있으며, 월별 거래건수는 시기별 이용 추이를 보여줍니다. 또한 업종별 거래액은 카드 사용이 집중되는 산업 분야를 확인할 수 있어 지역 상권 활성화와 정책 효과를 평가하는 데 중요한 근거가 됩니다.
