summary_user: "전북특별자치도 도민의 소비생활 만족도 응답 분포를 '매우 만족'부터 '매우 불만족'까지 5단계로 담은 사회조사 집계표이며, 도시·농촌, 성별, 연령, 학력 같은 구분(구분·상세구분)별로 나뉜 706바이트짜리 작은 CSV 파일입니다. 지역경제나 복지 정책 담당자, 분석가가 \"전북 도민 중 어느 계층이 소비생활에 더 불만족하는가\"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 '구분'·'상세구분'의 이름(예: 성별·연령대)을 직접 맞추거나 같은 기관의 다른 사회조사표와 나란히 놓고 비교하는 방식으로만 이어 쓴다."
description_portal: 본 데이터는 전북특별자치도 도민의 전반적인 소비생활 만족도를 조사한 사회 조사 통계 자료입니다. '매우 만족'부터 '매우 불만족'까지의 응답 분포를 보여주며, 도시와 농촌 등 지역별, 성별, 연령, 학력 등 다양한 인구통계학적 특성에 따라 데이터를 세분화하여 심층적인 분석이 가능하도록 구성되어 있습니다. 이 자료를 통해 각 계층이 체감하는 경제적 삶의 질과 소비 심리를 파악할 수 있으며, 이는 소비자 보호 정책, 지역 경제 활성화 방안, 그리고 계층별 맞춤형 복지 정책을 수립하는 데 중요한 기초 데이터로 활용될 수 있습니다.
