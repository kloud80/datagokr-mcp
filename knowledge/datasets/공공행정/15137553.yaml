description_portal: '본 데이터는 기관 대표홈페이지 및 관련 정보시스템 운영 과정에서 사용자 입력값(댓글, 게시글, 민원 접수 등)에 포함될 수 있는 비속어, 혐오표현, 사회적 비윤리어 등의 사용을 사전에 차단하기 위해 관리되는 금칙어 목록 데이터입니다. 본 데이터셋은 시스템 내 콘텐츠 품질과 이용자 간 건전한 소통 환경을 유지하기 위한 목적으로 구축되었으며, 공공기관 홈페이지, 게시판, 전자민원 창구 등 다양한 온라인 서비스에서의 자동 필터링 로직에 활용될 수 있습니다.데이터는 각 금칙어에 대한 순번, 단어명, 사용여부 항목으로 구성되어 있으며, 순번은 관리 일련번호로 사용되고, 단어는 차단 대상 어휘를, 사용여부는 시스템 내 필터링 적용 여부를 나타냅니다.모든 데이터는 가변문자형(VARCHAR) 형태로 관리되며, 표준화된 항목명 및 도메인 체계를 적용하여 타 시스템과의 연계 시에도 일관성 있게 사용할 수 있도록 구성되어 있습니다.본 데이터는 기관의 **대표홈페이지 운영시스템(DB명: [해당 DB명], Table명: [해당 Table명])**에서 관리되며, 주기적으로 검수 및 업데이트를 통해 신규 금칙어 추가 또는 사용 중단 단어를 반영합니다. 이를 통해 비속어나 차별적 표현으로 인한 민원 발생, 사회적 갈등, 브랜드 신뢰도 하락 등의 리스크를 예방할 수 있습니다.또한, 본 데이터는 공공기관뿐 아니라 민간 웹서비스, 커뮤니티, 챗봇 등에서도 건전한 언어환경 조성을 위한 기준 데이터로 활용될 수 있습니다. 데이터 활용 시 기관별 언어 정책 및 서비스 성격에 따라 금칙어 필터링 로직을 커스터마이징하여 적용할 수 있으며, 타 데이터(예: 사용자 게시글, 댓글 로그 등)와 결합하여 자연어 처리 기반의 부적절 표현 감지 모델 개발에도 활용 가능합니다.데이터 제공의 목적은 공공 웹서비스의 신뢰성 및 품격 있는 커뮤니케이션 환경 조성을 위한 기반을 마련하는 데 있으며, 향후 지속적인 데이터 품질 관리 및 표준화 과정을 통해 보다 정교한 언어 필터링 체계 구축에 기여할 예정입니다.'
