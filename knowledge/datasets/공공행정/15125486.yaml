summary_user: 가맹본부가 정보공개서에 밝힌 브랜드별 가맹점 사업자 보험 내용을 가맹사업 기준년도·브랜드 단위로 담으며, 보험마다 일련번호와 상세 구분 항목명·상세 내용이 행으로 나온다. 가맹 창업 예정자가 '이 브랜드 가맹점이 되면 본부가 어떤 보험을 들게 하거나 제공하는가'를 확인하는 데 쓴다. 브랜드관리번호(brandMnno)와 가맹본부관리번호로 같은 공정위 가맹정보 계열의 브랜드·본부 데이터와 묶어 쓰되, 실측상 전역 조인 키는 없어 다른 기관 데이터와는 이름 매핑으로만 연결된다.
limits: 사업자등록번호 같은 전역 키가 응답에 없어 공정위 가맹정보 계열 밖의 데이터와 바로 조인할 수 없다. 기준년도와 브랜드관리번호를 알아야 조회되므로 브랜드 목록을 먼저 확보해야 하고, 개발계정은 하루 10,000회로 제한된다.
