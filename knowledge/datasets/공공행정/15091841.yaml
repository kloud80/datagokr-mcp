summary_user: 농식품공공데이터포털에 개방된 교육 분야 데이터셋의 메타데이터 목록으로, 데이터셋·데이터 단위로 이름·설명·제공기관·담당자·키워드·이용허락범위·업데이트주기·제공 형태(파일·오픈API·지도 등)를 담으며 범위는 전국·비공간이다. 농식품 교육 관련 연구자나 분석가가 "농업·식품 교육 자료 중 오픈API로 받을 수 있고 제3자 권리 제약이 없는 데이터는 무엇인가"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 데이터셋명·기관명 같은 이름 매핑이나 공공데이터포털URL(링크) 대조로만 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방된 교육 데이터 목록은 농림수산식품교육문화정보원에서 제공하는 다양한 교육 관련 정보를 포함하고 있습니다. 본 데이터는 데이터셋 ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터 ID, 데이터명, 데이터설명, 제3자 권리 포함 유무, 상위 분류, 제3자 권리, 이용허락 범위, 업데이트 주기 및 서비스 유형 등 매우 다양한 항목으로 구성되어 있습니다. 이 데이터는 농업, 식품, 및 수산물 관련 교육의 기초자료로 활용될 수 있으며, 관련 연구 진행 시 필수적인 정보로 작용할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형) : 고유한 데이터셋의 식별자입니다. 데이터셋명(문자형) : 각 데이터셋의 제목을 나타냅니다. 데이터셋설명(문자형) : 각 데이터셋의 내용을 상세히 설명합니다. 기관명(문자형) : 해당 데이터를 제공하는 기관의 이름입니다. 담당자명(문자형) : 데이터를 관리하는 담당자의 이름입니다. 전화번호(숫자형) : 담당자의 전화번호 정보를 포함합니다. 키워드(문자형) : 관련된 주제를 나타내는 키워드입니다. 등록일(날짜형) : 데이터가 등록된 일자를 표현합니다. 데이터ID(문자형) : 식별을 위한 데이터 고유 식별자입니다. 각 컬럼의 특성을 기반으로 데이터는 조직적이고 접근이 용이한 형식으로 제공되어 다양한 목적에 활용될 수 있습니다.'
