summary_user: 서울시 이용원·이발소 등 이용업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·폐업일과 영업 상태, 지번·도로명 주소와 좌표, 건물 층수, 의자 수·종사자 수, 다중이용업소 여부를 담는다. 구청 위생 담당자나 상권 분석가가 '이 동네에 지금 영업 중인 이발소가 몇 곳이고, 최근 몇 년 사이 몇 곳이 폐업했나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 업소명·관리번호(MGTNO)로 맞춰 이어 쓰며, 같은 원천인 LOCALDATA 인허가 자료와 함께 쓰인다.
description_portal: 서울시 이용업 인허가 정보는 이용원 이발소 등 이용업소의 인허가와 영업 상태를 파악하는 데 활용되는 데이터입니다. 인허가일자 취소일자 폐업 휴업 재개업 여부와 영업 상태 정보는 각 업소의 행정 이력을 확인하는 핵심 정보입니다. 지번 주소 도로명 주소 좌표 정보와 사업장명 전화번호 업태 위생업태 건물 지상 지하 층수 및 실제 사용 층수는 업소의 위치와 규모를 나타내는 기본 특성입니다. 한실 수 양실 수 욕실 수 발한실 여부 좌석 수 침대 수 세탁기와 회수 건조기 수 남녀 종사자 수 다중이용업소 여부 등은 위생 안전 수준과 서비스 규모를 판단하는 중요한 지표입니다. 이 데이터는 이용업소 위생 및 안전 점검 계획 수립 다중이용업소에 대한 재난 및 화재 예방 정책 수립 지역별 이용업 밀집도와 상권 분석 종사자 구조를 활용한 노동 고용 정책 설계 등에 활용할 수 있습니다.
