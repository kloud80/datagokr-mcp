description_portal: 통계청 한국행정구역분류는 통계작성을 목적으로 전국의 행정구역을 일정한 순서에 따라 부호화한 자료입니다. 행정구역분류의 목적은 통계조사 시 지역자료의 분류와 집계, 지역 간 통계자료의 비교성 제고에 있습니다. 2021년 행정구역분류 코드 범위를 변경하였고, 자릿수 확대 등 분류체계 개편을 추진하였습니다. 통계청 한국행정구역분류에 대한 데이터로 행정동명 및 행정동코드(최상위행정동코드, 부모행정동코드)와 개정일자 등의 정보들을 수록한 파일입니다. 분류체계는 대분류(시,도), 중분류(시,군,구), 소분류(읍,면,동)의 3단계 8자리로 구성되어 있습니다.
