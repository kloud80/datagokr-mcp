description_portal: 경기도 수원시 노인복시시설의 명칭, 시설구분, 소재지(주소,위경도), 전화번호, 운영주체구분, 관리기관 정보를 포함합니다.  거주지, 친지, 친구들이 있는 지역 근처 요양원을 찾을 수 있어서 사회적 관계가 끊기지 않고 익숙한 환경에서 생활을 할 수 있습니다. 직접 여러 요양원의 위치를 살펴보면서 의사결정 과정에 참여할 수 있어 돌봄 대상자가  아니라 주체적인 생활 설계자로서의 자존감을 높일 수 있습니다. 요양원마다 규모, 프로그램, 환경이 다르기 때문에 위치 정보를 통해 본인 생활권, 선호지역에 맞게 직접 비교, 선택하는데 활용할 수 있습니다.
