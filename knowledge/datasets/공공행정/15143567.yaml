description_portal: 서울시설공단의 2021년부터 2025년까지 의원면직(자발적 퇴사) 현황은 연도별 및 직군별(기술직, 사무직, 사회복지직, 상수도직, 시설관리직, 실무직, 자전거관리직)로 정리되어 있으며, 정년퇴직자는 제외된 자료입니다. 이 데이터는 공공기관의 인력 유출 현황을 파악하거나 조직문화, 업무 만족도, 이직 사유 등 내부적 요인을 분석하는 데 활용될 수 있습니다. 특히 직군별로 의원면직 추이를 비교함으로써 특정 직무군의 인사관리 또는 근무환경의 문제를 진단하는 데 도움이 되며, 노동시장 측면에서는 공공기관에서 민간으로의 인력 이동 흐름을 분석하고 인재 유지 전략 수립에 참고할 수 있는 기초 자료로 활용 가능합니다.
