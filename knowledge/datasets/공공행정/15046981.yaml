description_portal: 서울시 주요 암 사망원인별 사망(성별/구별) 통계는 서울시에서 발생한 주요 암에 의한 사망자 수와 사망률을 성별, 구별로 제공하는 통계 자료입니다. 이 데이터는 악성신생물(암) 전체에 대한 사망 통계뿐만 아니라, 각 암종(폐암, 간암, 위암, 대장암, 췌장암 등)별로도 구체적인 사망자 수와 사망률을 제공하며, 남성과 여성의 구체적인 사망 통계가 구분되어 있습니다. 이 자료는 암 예방 및 치료 정책 수립, 지역별 암 발생률 비교, 보건 행정의 효율성을 높이는 데 중요한 역할을 합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
