description_portal: 'ㅇ 데이터 개요: 본 데이터는 2025년 7월 기준 서울사랑상품권 결제가 가능한 유효 가맹점 정보를 제공합니다. 각 가맹점의 고유번호, 사업자번호, 상호명, 업종, 소재지 주소, 가맹점 등록일, 상태 등의 상세 항목이 포함되어 있습니다.ㅇ 제공 범위: 서울특별시 전역에 위치한 소상공인·자영업자 가맹점으로, 음식점, 소매점, 서비스업 등 다양한 업종이 포함됩니다.ㅇ 활용 목적: 시민·소비자가 서울사랑상품권 사용 가능 매장을 쉽게 찾을 수 있도록 지원하며, 지자체·유관기관이 정책 수립 및 가맹점 관리, 지역경제 활성화 분석 등에 활용할 수 있습니다.ㅇ 데이터 형식: 엑셀(XLSX) 형태로 제공되며, 가맹점별 위치·업종 분석, 지도 매핑, 통계 집계 등 다양한 2차 가공·분석이 가능합니다.ㅇ 특징 및 장점: 최신 등록일자 기준의 ‘정상’ 가맹점만 수록되어 있어, 소비자 신뢰도와 활용도가 높습니다.담당부서 : 노동공정상생정책관 소상공인플랫폼담당관 (02-2133-5139)'
