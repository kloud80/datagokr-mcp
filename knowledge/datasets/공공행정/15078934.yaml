description_portal: '이 데이터는 「전북특별자치도 부안군」이 보유한 지방세 미환급금 현황에 대한 정보를 제공하는 공공데이터입니다.지방세 납세자의 납부 오류, 이중납부, 과오납 등에 따라 환급이 발생할 수 있으나 일정 기간 동안 찾아가지 않거나 반환되지 않은 금액은 미환급금으로 분류되며, 이 데이터를 통해 부안군의 미환급 지방세 현황을 연도별·세목별로 파악할 수 있습니다.데이터는 다음과 같은 주요 항목으로 구성되어 있습니다.시도명, 시군구명, 자치단체코드: 데이터가 소속된 지자체의 명칭 및 코드 정보를 나타냅니다.세목명: 주민세, 재산세, 자동차세 등 각 세목의 명칭을 나타냅니다.과세년도: 미환급이 발생한 해당 과세연도를 나타냅니다.미환급유형: 환급 사유에 따라 구분된 유형(예: 이중납부, 과오납 등)을 의미합니다.납세자유형: 개인, 법인 등 납세자의 구분을 나타냅니다.당해미환급건수, 당해미환급금액: 해당 과세연도 기준으로 현재까지 환급되지 않은 건수 및 금액입니다.누적미환급건수, 누적미환급금액: 해당 세목 및 유형에 대해 누적된 미환급 건수 및 금액을 제공합니다.누적미환급금액증감: 전년도 대비 미환급 금액의 증감 추이를 수치로 나타냅니다.본 데이터는 납세자의 권익 보호 및 지방세 집행의 투명성 확보를 목적으로 공개되며, 향후 환급 안내 행정 및 제도개선의 기초자료로 활용될 수 있습니다. 또한, 미환급금 규모 및 변화 추이를 파악함으로써 정책적 개입 필요성과 개선 방향을 제시하는 데 활용됩니다.지방세 업무 시스템에서 추출된 본 데이터는 매년 정기적으로 갱신되며, 환급 관련 제도 변화나 행정처리 방식 변경이 있을 경우 그 내용이 반영될 수 있습니다. 데이터 활용 시 최신성과 정확성을 확인하는 것이 중요합니다.'
