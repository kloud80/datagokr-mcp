summary_user: 행정안전부 주민등록 자료를 시군구와 통계년월 기준으로 도로명별 총인구·세대수·세대당 인구·남녀 인구와 성비로 집계해 담는다(거주자·거주불명자·재외국민 포함, 범위 전국). 분석가나 사업자가 '이 도로명 주소 일대의 인구와 세대 규모가 월별로 어떻게 바뀌었나'를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시도·시군구명, 도로명, 도로명코드(roadNmCd) 같은 이름·코드 매핑으로 잇고, 월 시계열은 통계년월로 맞춘다.
description_portal: 시군구 행정기관과 통계년월을 기준으로 시도명, 시군구명, 도로명, 총인구수, 세대수, 세대당 인구, 남자인구수, 여자인구수, 남녀비율을 조회하기 위한 서비스입니다.주민등록 데이터는 통계의 기본이 되는 인구 데이터로써, 주민의 신고에 따라 주민등록법 제6조의 규정에 근거하여 개인·세대별 주민등록표를 기반으로 매월 말일 집계하고 있으며 거주자, 거주불명자, 재외국민을 포함하고 있습니다.활용가치가 큰 주민등록 데이터의 제공 단위를 통반 단위, 도로명 등으로 확대하여 오픈API 방식으로 제공함으로써, 주민등록 데이터를 활용한 국가정책수립, 민간·공공서비스 개발, 창업 지원 및 일자리 창출 등 다양한 분야의 디지털 전환 및 국민 삶의 질 향상에 기여할 목적으로 작성되었습니다.
