description_portal: 공무원연금공단에서 제공하는 연도별 국가별 해외 거주 연금수급자 현황 데이터입니다. 본 자료는 2017년부터 기준년도까지 연도별로 주요 국가에 거주하는 공무원연금 수급자의 인원을 국가별로 구분하여 제공합니다. 주요 국가에는 미국, 캐나다, 뉴질랜드, 호주, 일본, 필리핀 등이 포함되며, 기타 국가로 구분된 항목도 함께 제공됩니다. 해당 데이터는 해외 거주 연금수급자의 국가별 분포, 연도별 증가 추이, 특정 국가로의 이주 및 정착 현황 등을 파악하는 데 유용하며, 신상신고 확인, 공적연금 이중수급 방지 등의 기초자료로 활용됩니다.
