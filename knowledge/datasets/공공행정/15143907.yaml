summary_user: SGIS 분석지도의 '성씨분포' 서비스에 쓰이는 데이터로, 전국 시군구별·성씨별 인구수를 담은 집계 파일(CSV)이다. 특정 성씨가 어느 시군구에 많이 사는지, 지역별로 어떤 성씨 비중이 큰지 알고 싶은 연구자나 일반 국민이 쓴다. 전역 조인 키나 행정구역 코드가 없어 시군구명(성씨분포시군구명)을 이름으로 매핑해야 다른 시군구 통계와 이을 수 있다.
description_portal: "[SGIS 오픈 플랫폼] 대메뉴 '분석지도'내의 \"성씨분포\" 서비스에서 제공하는 인구  데이터입니다. 성씨별, 시군구별 인구수를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. 성씨분포   우리나라의 성씨와 주요 본관에 대해서 지역별로 인구비율 및 과거로부터의 변화를 비교해볼 수 있는 서비스"
