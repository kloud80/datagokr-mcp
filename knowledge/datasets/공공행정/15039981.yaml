description_portal: 대전광역시시설관리공단에서 운영 중인 대전역 지하도상가의 점포정보를 제공하고 있습니다. 공단은 체육, 환경, 복지, 기반 4개 분야의 시설을 관리하고 있으며 역전지하도상가는 기반시설에 해당됩니다. 데이터에 표시되는 점포의 수는 점포 계약 및 입찰 결과에 따라 변경될 수 있습니다. 대전역전지하도상가의 주소는 대전광역시 동구 중앙로 지하 200 이며, 해당 파일에서 제공하는 정보는 일련번호, 호수, 성명, 상호명, 종목, 전화번호입니다. 역전지하도상가 점포정보 데이터 기준일은 2025년 7월 1일 기준입니다.
