summary_user: 대전역 지하도상가(대전 동구 중앙로 지하)의 점포를 한 줄씩 담은 점포 원장 파일로, 상가 분류·상가 번호·점포 이름·임대 시작일과 종료일·기준일자를 담는다. 지하도상가 입점을 검토하는 사업자나 상권 분석가가 '역전지하도상가에 어떤 점포가 있고 임대 기간이 언제 끝나는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 점포 이름·주소를 맞추는 방식으로만 이어지며, 지역 인허가(LOCALDATA) 업소 정보와 이름 대조로 함께 볼 수 있다.
