description_portal: '세종특별자치시시설관리공단은 시민과 기관, 기업이 함께 활용할 수 있도록 산학연 클러스터 내 회의실 대관 정보를 공공데이터로 제공하고 있습니다.이 데이터에는 회의실 이용을 원하는 분들이 꼭 알아야 할 주요 내용이 담겨 있습니다.위치: 회의실이 위치한 건물명과 세부 주소를 제공하여, 대관 시 찾아오기 쉽도록 안내합니다.대관 금액: 회의실 사용에 필요한 비용(시간 단위 또는 하루 기준 등)을 명확히 제시하여 합리적인 선택이 가능하도록 합니다.유의사항: 회의실 이용 시 지켜야 할 규정(예약 절차, 사용 가능 시간, 시설물 이용 제한, 환불 규정 등)을 안내하여 편리하고 안전하게 이용할 수 있도록 돕습니다.이 데이터는 회의실 대관을 희망하는 시민·기업·기관이 위치와 비용을 사전에 비교·검토할 수 있게 하여, 보다 효율적으로 공간을 활용할 수 있도록 지원하는 자료입니다.세종특별자치시시설관리공단은 앞으로도 투명하고 편리한 대관 서비스를 제공하기 위해 관련 정보를 지속적으로 공개·갱신해 나갈 예정입니다.'
