description_portal: 한국자산관리공사에서 관리 중인 국유재산(국유부동산) 비축토지 명세에 대한 정보를 제공합니다.(2023년도 이후 데이터 제공)매입연도를 기준으로 특정 연도에 취득된 자산을 필터링할 수 있고, 소재지명을 사용하면 시·군·구 등 행정 구역 단위로 자산 위치를 파악할 수 있습니다. 또한 부동산 종류명으로 아파트, 상가, 토지 등의 유형을 확인하며 면적 정보를 통해 규모를 비교할 수 있습니다. 담당부서를 통해 관리 책임 부서를 파악함으로써 문의나 절차 확인에도 유용합니다.거주지역 주변 자산 현황 탐색이나 관심 있는 구매연도 자산 규모 파악에 활용할 수 있고, 지도 기반 자산 분포 시각화, 통계 분석, 연도별 변화 추세 모델링 등에 응용할 수 있습니다.
