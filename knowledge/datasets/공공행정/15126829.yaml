summary_user: 한국자산관리공사가 관리하는 국유부동산 비축토지를 자산 한 건씩 담은 원천 목록으로, 전국을 대상으로 매입연도·소재지·부동산 종류·면적·담당부서를 제공한다(포털 설명상 2023년도 이후 데이터). 우리 동네 주변에 공사가 비축해 둔 국유 토지·건물이 어디에 얼마나 있는지, 특정 연도에 사들인 자산 규모가 어느 정도인지 알고 싶은 주민·분석가가 쓴다. 전역 조인 키(필지고유번호 등)가 없어 다른 국유재산 데이터와는 소재지명(LCTN_NM)을 주소로 맞추거나 같은 기관 데이터끼리 이름으로 매핑해 연결해야 한다.
limits: 실측 컬럼에 PNU 같은 공통 조인 키가 없어 필지 단위로 토지대장·공시지가 데이터와 바로 붙일 수 없고, 소재지 문자열 매칭에 의존해야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
