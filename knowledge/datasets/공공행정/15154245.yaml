description_portal: '본 데이터는 국가통계마이크로데이터통합서비스(MDIS)* 시스템 이용자 이용서비스 요금제(수수료) 비용정보에 관한 내용입니다.- 비용관리: 시스템 이용자의 이용서비스에 따른 요금제(수수료) 비용정보에 대한 내용입니다. (비용관리번호, 요금제 등)- 비용관리상세: 시스템 이용자의 이용서비스에 따른 요금제(수수료) 비용정보 상세 내역입니다. (구간사용일수, 구간시작용량 등)* 국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다.이에 국가데이터처는 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.'
