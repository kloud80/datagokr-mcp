description_portal: '- 비영리 민간단체란 영리가 아닌 공익활동을 수행하는 것을 목적으로 하는 민간단체로서, 관련법에 따라 등록된 단체로 비영리 민간단체 등록현황을 제공합니다.- 비영리민간단체 지원법 제4조 및 동법 시행령 제3조에 따라, 다음 요건을 모두 충족해야 등록이 가능합니다.- ① 고유 목적 : 공익을 목적으로 하는 민간단체일 것 (정치, 영리 목적 금지)- ② 비영리 : 수익사업은 부차적이며, 수익은 다시 공익활동에 사용해야 함- ③ 설립 기간 : 설립 후 1년 이상 지속적으로 활동한 실적이 있어야 함- ④ 회원 수 : 상근 임원 포함 100명 이상이어야 함- ⑤ 정관 : 목적, 사업, 조직, 운영 등 명시된 정관이 있어야 함- ⑥ 사무소 :독립된 사무소를 보유하고 있을 것- ⑦ 회계 관리 : 회계장부 비치 및 투명한 운영 가능할 것- ⑧ 공공성 입증 : 사업 실적, 행사 자료 등으로 공익성을 증명할 수 있어야 함'
