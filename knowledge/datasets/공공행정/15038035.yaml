summary_user: 구리시의회 제9대 의회에 접수된 의안을 건별로 담은 파일로, 의안번호·의안명·의안종류·발의일·발의자와 소관위원회, 위원회·본회의 의결일과 처리결과(원안가결·수정가결·부결 등)를 기록한다. 시민이나 의정 모니터링 단체가 '특정 조례 개정안이 언제 누구 발의로 올라와 어느 위원회를 거쳐 어떻게 처리됐는가'를 확인하거나 회기별 처리 현황을 집계하는 데 쓴다. 전역 조인 키는 없어 다른 지방의회 의안 데이터와는 기관명·대수·회기 같은 이름 기준으로 맞춰 쓰고, 조례 원문 등과는 의안명으로 대조해야 한다.
description_portal: 본 데이터는 구리시의회의 의정 활동 중 가장 핵심이 되는 **의안(議案)**의 접수부터 의결까지 전 과정을 체계적으로 기록한 정보입니다.구리시민의 실생활과 밀접한 조례 제·개정안을 비롯하여 예산안, 결산안, 동의안, 건의안 등 시의회에서 다루어지는 9대 의회  안건의 상세 내용을 포함하고 있습니다. 구체적으로는 의안번호, 의안명, 제안일자, 제안자(또는 발의의원), 소관 위원회, 심사 결과(원안가결, 수정가결, 부결 등), 그리고 최종 의결일자 등의 항목을 제공합니다.이 데이터를 통해 시민들은 우리 지역의 정책이 어떤 과정을 거쳐 결정되는지 투명하게 확인할 수 있으며, 연구자나 개발자는 구리시의 정책 변화 흐름을 분석하거나 의정 모니터링 서비스를 구축하는 등 다양한 민주주의 가치 실현 및 데이터 기반의 서비스 창출에 활용할 수 있습니다. 구리시의회는 본 데이터를 정기적으로 업데이트하여 최신 의정 정보를 제공함으로써 시민과의 소통을 강화하고 열린 의정을 구현하고자 합니다.더 많은 의안 현황은 https://www.gcc.or.kr/ 구리시의회 사이트에서 확인하실 수 있습니다.
