description_portal: '대구광역시 동구청에서 제공하는 “동구 맛집현황” 공공데이터는  최신화된 관광 및 주민 추천 맛집 정보를 담고 있습니다. 이 데이터는 업소명, 주소, 전화번호, 주메뉴 항목을 포함하고 있으며 약 천여 개 이상의 식당 정보를 연 1회 구조화하여 제공하며, 주민과 관광객이 동구 지역 내 다양한 맛집을 쉽게 검색하고 이용할 수 있도록 지원합니다. 등록 업소: 2026년 4월 기준으로 휴게·관광·맛집 관련 정보가 포괄적으로 수록되어 있습니다맛집현황의 특징: 식당, 칼국수, 장어탕, 한정식, 오리백숙, 쭈꾸미, 족발 등 대표 메뉴와 위치 정보가 상세히 나열되어 있습니다.'
