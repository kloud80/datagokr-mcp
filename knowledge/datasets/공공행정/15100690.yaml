summary_user: 경기도 여주시 관내 관공서를 한 곳씩 담은 목록으로, 기관 구분명·전화번호·도로명 및 지번 주소·위도·경도를 시설 단위로 담는다(CSV 약 1.6KB의 소규모 파일). 여주시민이나 방문객이 특정 관공서의 위치와 연락처를 찾거나, 분석가가 여주시 행정시설을 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명(구분명)이나 주소 문자열 매칭, 또는 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경기도 여주시의 행정기관과 관련된 관공서 현황 데이터를 제공합니다. 이 데이터에는 각 기관을 구분할 수 있는 구분명과 함께, 시민들이 편리하게 연락할 수 있도록 구성된 전화번호 안내 정보가 포함되어 있습니다. 또한, 각 관공서가 실제로 위치한 장소를 보다 명확하게 파악할 수 있도록 하기 위해 소재지의 도로명 주소와 지번 주소가 함께 제공되며, 이를 통해 내비게이션이나 지도 서비스를 활용한 방문이 용이합니다. 더불어 각 관공서의 위치를 정확히 파악할 수 있도록 위도와 경도 좌표 정보도 함께 포함되어 있어, 위치 기반 정보시스템(GIS) 등에서 활용하기에 적합한 데이터입니다. 이러한 정보는 여주시의 행정업무 효율화 및 민원 대응의 신속성 향상, 시민 편의성 제고 등을 위해 유용하게 활용될 수 있습니다.
