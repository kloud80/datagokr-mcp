description_portal: 이 데이터는 청남대 홈페이지에서 제공했던 뉴스 랭킹 정보로, 특정 기간 동안 주목도가 높았던 뉴스 주제를 정리한 자료입니다. 각 항목에는 뉴스의 핵심 주제(토픽), 해당 이슈의 상대적 관심도를 나타내는 토픽랭킹, 뉴스 기사에서 주요하게 사용된 키워드, 그리고 게시된 날짜가 함께 포함되어 있습니다. 예를 들어 코로나19 확진자 발생, 방역 조치, 정부 정책, 경제 동향 등 사회적으로 중요한 이슈들이 어떻게 다뤄졌는지를 시점별로 확인할 수 있어 당시의 사회적 관심도와 이슈 흐름을 분석하는 데 유용합니다. 특히 키워드 구성은 기사 내용의 특징을 간단히 파악할 수 있게 해주며, 행정기관이나 연구기관이 과거 사회 이슈의 변화를 이해하는 데 참고자료로 활용될 수 있습니다.
