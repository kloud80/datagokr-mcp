status: active
summary_user: 국가기술표준원이 관보에 공표한 국가표준 제·개정 고시를 건별로 담으며, 관보제목·발행일자·발행기관·근거법령·정정여부·개정이유 및 주요내용과 관보 PDF 원문 링크, 표준내용 링크를 제공하고 범위는 전국·비공간이다. 사업자나 품질·인증 담당자가 '특정 국가표준(KS)이 언제 어떤 이유로 제정·개정되었고 원문은 어디서 보나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관보제목·근거법령명 같은 이름 매핑이나 발행기관명으로만 연결한다.
limits: 공통 코드 기반의 조인 키가 없어 다른 표준·인증 데이터와 정확히 결합하기 어렵다. 행정안전부 관보 데이터 중 기술표준원 국가표준 제·개정 고시만 다루므로 다른 고시·공고는 별도 관보 API를 써야 한다.
