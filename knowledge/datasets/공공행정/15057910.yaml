summary_user: 전국 지방자치단체의 투자적경비를 회계연도·자치단체·분야별로 집계한 순계분석 자료로, 분야마다 합계와 자본지출, 융자및출자, 보전재원, 내부거래 금액을 담는다. 분석가나 주민이 "우리 지자체는 지역개발시설 같은 자본지출에 실제로 얼마를 쓰고, 그 비중이 다른 지자체와 비교해 어떤가"를 확인할 때 쓴다. 전역 조인 키는 실측에서 찾지 못했으므로, 같은 지방재정365의 다른 공시 데이터와는 회계연도와 자치단체 코드·이름(laf_cd 등)을 맞춰 이어 쓴다.
description_portal: 지방자치단체의 투자적경비 순계분석은 자치단체의 재정 중 투자목적 지출의 실질적인 규모와 비중을 파악하기 위한 분석으로 지방재정공시 항목 중 하나입니다. 총 투자적 경비에서 내부거래나 중복편성된 예산을 제외한 순계지출을 분석하여 지역개발시설 확충 등 자본지출의 효율성과 건정성을 평가할 수 있습니다.투자적경비 순계분석 정보는 2010 회계연도부터 정보가 제공되고 있습니다. 제공되는 세부항목으로는 분야별 자본지출, 융자및출자, 보전재원, 내부거래 항목 정보가 제공됩니다.
