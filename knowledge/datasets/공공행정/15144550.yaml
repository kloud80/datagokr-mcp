description_portal: 해당 데이터는 광주광역시 광산구 빈집 현황으로  법정동,주택유형,구조유형,연면적,건축연도,빈집등급,데이터기준일자 등을 제공합니다주택유형의 경우 대다수의 비율로 단독주택이 가장 많으며 준공연도 30년 이상된  건축물들의 비중이 크고  빈집등급에 따라 우선순위가 정해지며 가장 위험도가 높은 3등급부터 우선시됩니다.주민이 살지않는 빈집이 경과년수가 오래되어 폐가 및 공가애 해당하는 경우 빈집철거 및 정비에 대상이 되며 이는 주민들의 안전성 보장과 주변 의 미관 향상 위해 시행되고있습니다.데이터 분석 결과 광주 광역시 광산구 내에 빈집은 280건이며 이 중 송정동 73개소, 도산동 50개소, 신촌동 41개소,  소촌동 21개소, 신창동 7개소,우산동 3개소, 비아동 3개소,산월동 3개소 등으로 빈집이 분포되어있음을 알 수 있으며빈집 등급에 따라 위험도 및 활용도를 분석하여 추후 계획에 활용됨을 알려드립니다.
legal_basis_portal: 위 파일은 광주광역시 광산구 내 빈집 현황을 조사한 것입니다.
