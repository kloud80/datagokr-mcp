summary_user: 서울시설공단이 제정·개정해 운용 중인 정관, 직제규정, 보수규정 등 내부 사규 86건을 규정 한 건당 한 행으로 담은 목록으로, 분류·사규명·소관부서·제정일자·최종개정일자가 들어 있다(약 6KB CSV 파일). 공단 운영을 들여다보는 시민이나 공공기관 분석가가 "보수규정은 언제 마지막으로 개정됐고 어느 부서 소관인가" 같은 질문을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사규명이나 같은 기관(서울시설공단) 기준으로만 맞춰 이어 쓴다.
description_portal: 서울시설공단에서 제정, 개정하여 운용 중인 내부 사규 현황을 체계적으로 정리한 자료입니다. 서울시설공단 정관, 직제규정, 보수규정 등 총 86건의 규정 및 내규에 대한 정보를 포함하고 있습니다. 해당 데이터를 통해 각 규정에 대한 분류, 사규명, 소관부서, 최종개정일자(년,월,일) 및 제정일자(년,월,일)에 대해 확인할 수 있습니다. 내부 사규 현황에 대한 정보를 투명하게 공개함으로써 기관의 신뢰성을 제고하고 각 규정의 신설 여부 및  제·개정 여부를 확인하여 체계적인 관리 체계를 점검하는 데 목적이 있습니다.
