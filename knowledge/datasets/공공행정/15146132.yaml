description_portal: '이 데이터는 ‘폐쇄말소대장 총괄표제부’ 성격의 자료로, 건축물의 소재지, 지번, 건물구조, 용도, 연면적, 층수, 부속건물 여부, 건축연혁 등 말소된 건축물의 기본 정보를 포함하고 있습니다. 각 <row>는 한 건축물의 개별 기록을 나타내며, 행정구역명(자치구, 법정동), 지번(본번, 부번), 도로명 주소, 건물구분(대지), 건물 용도(예: 단독주택, 근린생활시설), 구조(벽돌구조, 철근콘크리트구조 등), 지붕 형태(평스라브, 기와 등), 대지면적·건축면적·연면적, 용적률, 층수(지상, 지하), 부속건물 현황, 사용승인일, 허가일, 말소일 등이 포함되어 있습니다.이 자료를 통해 건물의 과거 현황을 파악할 수 있어 재개발·재건축 계획 수립, 부동산 가치평가, 도시계획, 안전 점검 이력 관리 등에 활용할 수 있습니다. 특히 말소일과 허가·사용승인일을 비교하면 건물의 사용 기간을 알 수 있으며, 구조·용도·면적 정보를 통해 건물 특성을 분석할 수 있습니다.'
