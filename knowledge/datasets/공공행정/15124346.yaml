description_portal: 이 데이터는 경상북도 구미시의 1톤 트럭 폐차 현황에 대한 정보를 담고 있는 공공데이터로, 노후 경유차 감축 및 교통환경 개선을 위한 기초자료로 활용됩니다. 제공 항목에는 차량의 사용본거지 주소, 최초 등록일, 폐차일, 차명, 차량의 최종 주행거리, 폐차 사유 등이 포함되어 있어, 1톤 트럭의 운행 이력과 말소 시점, 운행 특성 등을 종합적으로 파악할 수 있습니다. 이 자료는 대기환경 정책 수립, 노후차량 교체 지원사업 운영, 도시 교통정책 기획, 차량 수급 현황 분석 등 다양한 행정 및 연구 목적으로 활용될 수 있으며, 구미시의 교통안전과 친환경 차량 전환 정책 추진에도 중요한 참고자료로 기능합니다.
