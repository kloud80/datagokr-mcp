summary_user: 고용노동부 법령해석 사례를 건별 목록으로 담으며, 해석마다 안건명·안건번호·질의기관·해석기관·해석일자와 상세 회신 본문으로 가는 링크(법령해석상세링크)가 붙는다. 노무 담당자나 노동법 분석가가 근로기준법·산업안전보건법 같은 노동 법령의 특정 쟁점에 대해 정부가 어떻게 해석했는지 사례를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 법령해석일련번호로 같은 서비스의 상세 본문 조회와 잇거나 질의기관코드·해석기관코드 같은 기관 코드, 안건명 매칭으로만 다른 데이터와 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 고용노동부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 근로기준법, 산업안전보건법, 고용정책기본법 등 노동 관련 법령에 대해 고용노동부가 법제처에 질의한 사례들을 목록 형태로 제공합니다. 목록 항목에는 해석 일련번호, 안건명, 질의기관, 접수일자, 해석일자, 회신 여부 및 처리 상태 등이 포함되어 있어 해석 요청의 진행 현황을 한눈에 확인할 수 있습니다. 이용자는 해당 목록을 바탕으로 관심 있는 사례를 선택하여 개별 회신 본문으로 연계할 수 있으며, 각 사례는 노동 정책 및 현장 행정에서 실제 쟁점이 된 사안들에 대한 법리적 판단 근거를 제공합니다.
