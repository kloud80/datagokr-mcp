description_portal: 주민참여포인트 현황 데이터는 지방자치단체가 주민참여활동에 대해 부여한 포인트 지급내역을 제공하는 공공데이터이다.각 레코드는 단일지급건을 의미하며 포인트 지급일자,지급사유,비고항목으로 구성된다.포인트값은 참여활동에 대한 보상수준을 나타내고 지급일자를 통해 연도별 월별 참여활성도 변화를 분석할 수 있다.지급사유 항목은 설문참여,행사봉사,정책제안 등 어떤유형의 참여가 많은지 파악하는 근거가 되며 비고에는 지급조정 사유 또는 특이사항을 기록하여 데이터 검증과정에 활용한다.이 데이터는 개별 주민식별정보를 포함하지 않고 지급패턴분석과 참여프로그램 개선정책수립을 위한 기초자료로 사용된다.
