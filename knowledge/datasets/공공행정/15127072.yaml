summary_user: 전국 후원방문판매사업자의 상세 정보를 사업자 한 곳 단위로 담는 API로, 상호·등록번호·대표이사와 그 변동 내용, 본사 주소, 소비자피해보상 가입기관, 매출 상위 품목과 금액, 후원수당 지급 총액·비율, 반품환불 비율, 당기순이익, 신용평가등급을 포함한다. 소비자나 판매원 가입을 고민하는 사람이 "이 후원방문판매 업체가 정식 등록돼 있고 후원수당·환불 실적이 어떤가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키(사업자등록번호·법인등록번호)가 없어, 다른 특수판매·가맹·상조 데이터와는 상호명이나 후원방문판매 등록번호(rgsnoVal) 같은 이름·코드 매칭으로만 잇는다.
