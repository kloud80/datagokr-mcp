summary_user: 부산광역시 해운대구 관내 공중화장실을 한 곳씩 담은 시설 목록으로, 화장실명·주소·관리 담당 연락처·관리기관·위도·경도를 개별 시설 단위로 제공한다. 해운대구 주민이나 관광객, 지도 서비스 개발자가 '해운대 해수욕장 근처에서 가장 가까운 공중화장실이 어디이고 누가 관리하나'를 찾는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어서, 주소 문자열이나 위도·경도 좌표로 공간 매칭하거나 화장실명·관리기관 이름으로 대조해 이어 쓴다.
limits: 범위는 해운대구 한 곳뿐이라 부산 전체나 다른 시군구 화장실은 담지 않으며, 다른 데이터와 연결할 공통 코드가 없어 이름·주소·좌표 매칭에 의존해야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
