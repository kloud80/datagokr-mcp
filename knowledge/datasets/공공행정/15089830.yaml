description_portal: '데이터 개요본 데이터는 2022년 8월 19일 기준 연구개발특구진흥재단의 회의실 정보를 정리한 자료입니다.특구 내 회의실 현황을 한눈에 파악할 수 있도록 회의실명, 수용 인원, 부대시설 등 기본 정보를 포함하고 있습니다.데이터 항목본 데이터가 보유한 주요 칼럼은 다음과 같습니다.구분 : 회의실의 기본 구분 항목특구구분 : 회의실이 위치한 특구의 구분 정보회의실명 : 회의실의 명칭수용인원 : 해당 회의실에 수용 가능한 인원 수부대시설 : 프로젝터, 음향장비 등 회의실 내 설치된 주요 시설 정보현수막 : 현수막 설치 가능 여부 또는 관련 지원 사항활용 방법회의·세미나·행사 기획 시 적정 회의실 선택 및 시설 비교 등에 활용될 수 있습니다.유의 사항본 데이터는 2022년 8월 19일 기준 현황으로, 이후 변경사항은 반영되지 않았을 수 있습니다.'
