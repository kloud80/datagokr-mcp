description_portal: “사전정보공표 목록 및 분류 데이터는 광주광역시 동구가 행정정보의 투명성과 접근성을 높이기 위해 공개하는 사전정보공표 항목을 체계적으로 정리한 공공데이터입니다. 본 데이터는 공표업무명, 공표내용, 공표시기 등 주민이 실제로 필요로 하는 핵심 정보를 중심으로 구성되어 있으며, 각 정보의 성격과 공개 시점을 명확히 이해할 수 있도록 단순하고 표준화된 형태로 제공됩니다. 이를 통해 주민들은 구정 운영 과정에서 생산되는 다양한 정보를 보다 편리하게 확인할 수 있고, 공공기관·연구자·민간 서비스 제공자는 행정정보 분석 및 서비스 개발에 활용할 수 있습니다. 또한 공표주기, 공표형태, 분류체계 등이 함께 제공되어 정보공개의 일관성과 활용성을 높여, 행정의 신뢰성과 시민참여 증진에 기여할 수 있는 기반자료로 활용됩니다.”
