summary_user: 지방공기업 통합경영공시에 올라온 지방공기업별 연도별 경영정보를 기관 단위로 담는 전국 범위 집계 데이터로, 자산·부채·자본, 영업이익·경상이익·당기순이익, 사업예산과 자본예산의 수입·지출을 포함한다. 분석가나 지역 주민이 '우리 지역 도시공사의 부채가 최근 몇 년 사이 얼마나 늘었고 당기순이익은 흑자인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방공기업 공시 데이터와는 기관명(ENT_NAME)과 연도(AC_YEAR)를 맞춰 이름 매핑으로만 이어 쓴다.
limits: 기관 코드 같은 공통 키가 없어 다른 데이터와 붙이려면 기관명 표기를 직접 맞춰야 한다. 행정단위는 전국으로만 구분되고 공간 정보가 없어 지역별 집계나 지도 표시는 기관명으로 지역을 따로 판별해야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
