summary_user: 서울 전역에서 운영 중인 무인점포를 점포 한 곳당 한 행으로 담은 목록으로, 자치구(CGG)·업소명·업종(무인사진관, 무인빨래방, 무인스터디카페 등)을 기록한다. 창업 예정자나 상권 분석가가 '우리 구에는 어떤 무인 업종이 얼마나 몰려 있나'를 자치구별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 상권·인허가 데이터와는 자치구명이나 업소명을 직접 매핑해서만 연결한다.
limits: 좌표나 주소 같은 공간 정보 없이 자치구 단위까지만 위치를 알 수 있고, 공통 코드 키가 없어 다른 데이터와 자동으로 결합되지 않는다. 호출하려면 포털 활용신청과 별도로 서울 열린데이터광장(data.seoul.go.kr) 인증키가 필요하다.
