description_portal: 국민권익위원회와 행정안전부는 행정기관의 민원서비스 품질을 향상시키고, 국민의 만족도를 높이기 위하여, 중앙행정기관, 시도교육청, 광역시도, 기초자치단체를 대상으로 민원서비스 종합평가를 매년 실시합니다. 평가항목은  민원행정 전략 및 체계,  민원제도 운영, 국민신문고 민원처리, 고충민원 처리, 민원만족도로 5개 분야입니다. 평가결과는 기관 유형별로 가~마 등급으로 구분되며, 가등급은  상위 10%, 나등급은 10%초과 30%이하, 다등급은 30%초과 70%이하, 라등급 70%초과 90%이하, 마등급은 90% 초과입니다.
