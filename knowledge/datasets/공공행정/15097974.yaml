summary_user: 행정동(읍면동)별 주민등록 세대수를 세대원 수(1인~10인 이상) 구간별로 나눠 담은 집계 파일이며, 검증 시 전국 3,619행(기준일 2026-08-31)이 내려왔다. 지자체 담당자나 분석가가 "우리 동네에 1인세대가 얼마나 되는가" 같은 질문에 쓴다. 행정기관코드와 시도·시군구·읍면동명 필드가 있지만 전역 조인 키는 확인되지 않아, 같은 기관의 코드나 이름·코드 매핑으로만 다른 주민등록 인구·세대 데이터와 이어 쓴다.
description_portal: 행정동(읍면동)별 주민등록 세대수 현황에 대한 데이터로, 행정동은 주민들이 거주하는 지역을 행정능률과 주민편의를 위하여 구분한 행정구역 단위입니다.주민등록 인구 및 세대 등 을 기반으로 선거, 교육, 조세, 복지, 교통, 지역 개발 등 다양한 분야에 적시성 있는 통계를 제공하고 있습니다. 이러한 통계는 국가 행정 및 정책 수립에 필요한 기초 자료로 활용되고 있습니다.주민등록 인구통계는 행정안전부 주민등록 인구통계 홈페이지(https://jumin.mois.go.kr), 공공데이터포털(https://data.go.kr), 국가통계포털(KOSIS) 등에서 확인 및 다운로드가 가능합니다.
