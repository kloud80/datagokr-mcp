description_portal: 성남시 가로등 분전함의 위치에 대한 현황자료입니다. 분전함 명칭, 분전함 설치주소, 등주수량, 등수 항목을 제공합니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.가로등 분전함 현황은 도로 및 공공장소에 설치된 가로등의 전력 공급과 제어를 담당하는 분전함의 위치, 수량, 등을 집계한 정보를 의미합니다. 분전함은 여러 개의 가로등을 묶어 전력을 분배하고, 점등·소등 제어, 유지관리 작업의 기준점 역할을 합니다.  현황 자료는 지자체나 공공기관이 가로등 시설을 체계적으로 유지·보수하고, 에너지 사용을 효율화하며, 스마트시티 연계 시스템을 구현하는 데 필수적인 인프라 데이터입니다
