summary_user: 경기도 주민등록인구를 기준연월·행정동(읍면동) 단위로 성별·연령대별로 집계한 데이터로, 총인구·남녀 인구, 15~29세·30~49세·50세 이상 인구, 연앙인구(평균인구)와 여성 5세 단위 가임연령대 인구를 담는다. 지자체 정책 담당자나 분석가가 '우리 동의 청년층·중장년층 비중은 얼마이고 가임연령 여성 인구는 어떻게 분포하는가' 같은 질문에 쓴다. 전역 조인 키는 없으며, 행정동코드(admdong_cd)·행정동명을 기준으로 다른 읍면동 단위 경기도 자료와 이름·코드 매핑해 잇는다.
description_portal: 경기도 주민등록인구통계 성·연령별 인구현황 행정동별 집계 데이터는 경기도 각 행정동 단위의 인구 분포를 성별과 연령대별로 집계한 자료입니다. 주요 항목에는 기준연월, 행정동코드, 행정동명, 총인구수, 총남성·여성 인구수, 인구 1529세, 3049세, 50세 이상 인구수, 연앙인구(평균인구) 및 성별·연령별 세부 집계 항목이 포함됩니다. 이를 통해 지역별 세대구성과 성별 인구 구조를 분석할 수 있으며, 청년·중장년·고령 인구 분포를 세밀하게 파악할 수 있습니다. 데이터는 복지·보건·교육·주거 정책 수립, 인구구조 연구, 지역사회 서비스 기획, 인구감소 대응 전략 마련 등 다양한 분야에 활용할 수 있습니다.
