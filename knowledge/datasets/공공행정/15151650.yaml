summary_user: 경기도 행정동(읍면동) 단위로 기준년월별 카드매출 금액을 중분류업종별로 집계한 자료로, 건별 거래가 아닌 집계값(매출금액)을 담는다. 지자체 분석가나 상권을 보는 사업자가 '우리 동네에서 어떤 업종에 소비가 몰리고 월별로 어떻게 변하는가'를 확인하는 데 쓴다. 행정동코드(admdong_cd)로 행정동 경계·인구 자료와 맞춰 볼 수 있으나, 실측 컬럼에서 전역 조인 키는 확인되지 않아 코드·이름 매핑을 거쳐 연결해야 한다.
description_portal: 이 데이터는 특정 기준년월을 기준으로 각 행정동 단위에서 발생한 카드매출 내역을 중분류업종별로 집계한 자료입니다. 주요 항목은 기준년월, 행정동코드, 중분류업종코드, 매출금액으로 구성되어 있으며, 각 업종코드는 특정 산업군(예:숙박업, 유통업, 농업 등)을 나타냅니다. 이 데이터는 소비행태 분석, 지역경제 진단, 상권 분석, 공공정책 수립 등에 활용할 수 있으며, 지역 단위로 세밀한 매출 흐름을 파악하는 데 유용합니다. 행정동코드를 활용하면 공간 데이터와 연계하여 지도 기반의 시각화 및 공간 분석도 가능하며, 중분류업종코드는 업종별 소비 비중을 비교 분석하는 데 효과적입니다.
