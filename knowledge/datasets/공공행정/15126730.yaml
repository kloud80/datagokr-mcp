summary_user: 경기도 내 도시별·연도별로 지출목적 항목에 따른 소비자물가지수 값을 담은 집계 자료이며, 기준연도(crtr_yr), 도시명, 지출목적 코드·이름, 지수값으로 구성된다. 지역 경제 분석가나 정책 담당자가 "경기도 어느 도시에서 식료품·주거 같은 지출 항목의 물가가 더 많이 올랐나" 같은 질문에 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 도시명과 지출목적 코드·이름을 맞춰 매핑하거나 같은 기관 자료끼리 이어 쓴다.
description_portal: 이 데이터는 특정 도시 및 연도 기준으로 다양한 지출목적에 따른 소비자물가지수를 집계한 자료입니다. 소비자물가지수는 일정 시기의 물가 수준을 나타내는 대표적인 경제지표로, 시민들의 생활비 변동과 구매력 변화를 파악하는 데 활용됩니다. 이 데이터는 도시별 또는 항목별 물가 상승률 비교, 생활비 구조 분석, 정책별 물가영향 평가 등 다양한 방면에 사용될 수 있으며, 지역 단위의 경제 동향 분석이나 물가 안정화 정책 수립을 위한 기초자료로도 유용합니다. 특히 경기도 내 여러 도시의 소비자 지출 항목별 변화 추이를 한눈에 파악할 수 있어 지역 맞춤형 물가정책 마련에 기여할 수 있습니다.
