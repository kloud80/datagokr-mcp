summary_user: 경기도 내 각종 위원회의 심의 결과를 안건 단위로 담은 시도 범위 자료로, 집계연도·분기, 위원회명, 담당부서, 심의일자, 안건내용, 심의결과(원안가결·조건부 가결·재심의·기각 등), 위원 참석·불참 인원을 기록한다. 도민이나 정책 분석가가 "특정 위원회가 어떤 안건을 언제 다뤘고 결과가 무엇이었으며 참석률은 어땠나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위원회명·담당부서명 같은 이름 매칭으로만 연결한다.
description_portal: 각종 위원회 심의결과 현황 데이터는 경기도 내에서 운영되는 다양한 위원회의 심의 결과를 집계한 자료로, 집계년도, 집계분기, 위원회명, 담당부서명, 심의일자, 심의안건내용, 심의결과, 의원참석·불참 인원, 향후계획, 비고, 데이터수집일자 등의 항목으로 구성되어 있습니다. 본 데이터는 경기도의 행정·정책 의사결정 과정에서 어떤 안건이 다뤄졌는지, 심의 결과가 어떻게 도출되었는지를 종합적으로 확인할 수 있습니다. 위원회별 심의 결과는 원안가결, 조건부 가결, 재심의, 기각 등으로 기록되어 있어 의사결정의 투명성을 높이고, 정책 실행의 정당성을 뒷받침하는 근거로 활용됩니다. 또한 의원 참석 인원 현황을 통해 위원회의 참여도와 운영 효율성을 평가할 수 있으며, 심의 분야별 담당 부서 정보를 바탕으로 정책 추진 현황을 파악할 수 있습니다. 이 데이터는 도정 운영의 민주성·투명성 확보, 정책 성과 분석, 의사결정 절차 개선 연구에 기초자료로 유용하게 활용될 수 있습니다.
