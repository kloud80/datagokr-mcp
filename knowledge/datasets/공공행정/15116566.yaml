summary_user: 서울 광진구 관내 동주민센터마다 법정동·행정동 이름, 소재지 주소, 대표전화, 위도·경도를 한 행씩 담은 시설 목록으로, 1KB 남짓의 작은 CSV 파일입니다. 주민이 우리 동 주민센터의 위치와 전화번호를 찾거나, 분석가가 광진구 주민센터까지의 거리로 행정서비스 접근성을 따져 볼 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 행정동·법정동 이름을 맞추거나 좌표로 공간 결합해 이어 씁니다.
description_portal: 서울특별시 광진구_동주민센터 현황 데이터는 광진구 관내 동주민센터의 위치 및 기본 정보를 제공하는 행정 데이터입니다. 이 데이터는 “법정동”, “행정동”, “소재지”, “대표번호”, “위도”, “경도”, “데이터기준일” 필드로 구성되어 있습니다. ‘법정동’은 법적으로 지정된 동의 명칭을, ‘행정동’은 행정업무를 담당하는 동의 이름을 나타냅니다. ‘소재지’는 해당 동주민센터의 주소를 제공하며, ‘대표번호’는 행정 서비스 문의 및 민원 접수를 위한 연락처입니다. ‘위도’와 ‘경도’는 지도 기반 위치 확인을 위한 좌표 정보를 제공합니다. 또한 ‘데이터기준일’은 제공되는 정보의 최신화 기준일을 명시합니다. 이 데이터는 행정 서비스 접근성 분석, 위치 기반 행정정보 제공, 주민센터 운영 현황 파악 및 지역 정책 수립의 기초 자료로 활용될 수 있습니다.
