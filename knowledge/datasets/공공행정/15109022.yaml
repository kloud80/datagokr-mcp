summary_user: 대전광역시 서구의 유동인구를 기준연월·행정동·요일·시간대·성별로 나눈 구간별 인구 비중(비율, 백분율)을 담은 집계 CSV로, 범위는 서구 한 시군구이고 단위는 읍면동(행정동)이다. 서구에서 점포 입지를 고르는 사업자나 상권 정책 담당자가 '어느 행정동에 주말 저녁 시간대 유동인구 비중이 높은가'를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 행정동코드·행정동명 이름/코드 매핑으로 같은 서구의 인허가 업소 자료나 행정동 단위 통계와 이어 쓴다.
description_portal: 이 CSV 데이터는 대전광역시 서구의 상권별·연령대별 유동인구 현황을 기준연월 단위로 세분화한 공간통계 자료로, 지역 상권의 시간대별 인구 흐름을 객관적으로 분석할 수 있는 구조로 구성되어 있습니다. ‘순번’은 데이터의 고유 식별번호를, ‘기준년’과 ‘기준월’은 통계 수집 시점을 나타냅니다. ‘행정동코드’와 ‘행정동명’은 유동인구가 관측된 지역의 행정단위를 구분하는 항목입니다.‘요일코드’와 ‘요일’은 주중·주말 등 요일별 인구 활동 패턴을 구분하며, ‘시간대코드’와 ‘시간대’는 하루를 일정 구간으로 나누어 시간대별 인구 분포를 보여줍니다. ‘성별코드’와 ‘성별’은 유동인구의 성별 구성을 구분하고, ‘비율’은 해당 구간의 인구 비중을 백분율로 표현한 값입니다. 마지막으로 ‘데이터생성일자’는 자료의 최신 갱신 시점을 표시합니다.이 데이터는 상권활성화 정책, 상업시설 입지분석, 교통 혼잡도 예측, 특정 시간대 소비 패턴 분석 등 지역경제 및 도시계획 수립에 유용한 근거 자료로 활용될 수 있습니다.
