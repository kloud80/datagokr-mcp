description_portal: '- 통신 데이터*를 활용하여 산출한 모바일 인구의 유입·유출 통계를 제공합니다.* 통신데이터: SK텔레콤 통신가입자의 시간, 위치 및 이동 정보를 활용하여 인공지능(AI) 기반으로 해당 지역(시군구, 행정동)에 체류한 인구를 추정한 데이터 입니다. - 전국, 시도 및 시군구 단위의 지역별 인구이동 현황을 조회할 수 있으며, 성별, 연령별, 입지유형별 등 다양한 조건으로 비교·분석할 수 있습니다. 또한 시계열 그래프와 지도 기반의 시각화 서비스를 제공하여 지역별 인구이동 추이와 특성을 직관적으로 확인할 수 있으며, 그래프의 특정 구간에 마우스를 올리면 해당 구간의 수치를 확인할 수 있습니다.[데이터 작성 개요]  - 작성체계: 국가데이터처가 SK텔레콤으로부터 자료를 수집·가공하여 작성  - 수집자료: 지역별, 성별, 연령별(10세 단위), 입지유형별(상업지역, 관광지, 대형아울렛, 사무지역, 레저·스포츠, 주거지역) 인구이동량  - 갱신주기: 매주   - 제공기간:   유입: 2019년 1월 ~ /유출: 2023년 1월 ~[ 통계기준]- 인구이동량은 실제 거주하는 시군구가 아닌 다른 시군구의 행정동에 30분 이상 체류한 경우를 이동으로 집계합니다.- 시도 단위 이동량은 거주지 시도가 아닌 목적지(방문지) 시도 기준으로 산정됩니다* 원자료 안내 - 관내·관외, 성별, 연령별, 입지유형별 및 행정구역별 상세 원자료는 "알림마당 > 「원자료 다운로드」 " 메뉴에서 제공하고 있습니다.   https://data.kostat.go.kr/nowcast/bigDataDwnOrgDt.do?menuId=6&subMenuId=1&searchDvsn=1* 데이터 이용 시 유의사항*본 통계는 이동통신 데이터를 기반으로 산출한 추정 통계로, 통신 이용 특성 및 산출 기준에 따라 실제 인구 이동과 차이가 있을 수 있습니다. 따라서 지역 간 인구이동의 추이와 특성을 파악하기 위한 참고자료로 활용하시기 바랍니다.'
