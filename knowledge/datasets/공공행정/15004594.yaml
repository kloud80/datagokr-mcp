summary_user: 의정부시 종량제봉투 판매업소를 한 행에 한 곳씩 담은 업소별 목록으로, 업소명·동 이름·주소·판매업소 지정일자를 담으며 활용신청 없이 받는 CSV 파일(약 53KB)이다. 시민이 '우리 동네에서 종량제봉투를 파는 가게가 어디인가'를 찾거나, 분석가가 동별 판매업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 동 이름(동명)이나 주소 문자열로 맞춰 이어야 하며, 지도에 올리려면 주소를 좌표로 변환해야 한다.
description_portal: 의정부시 종량제봉투 판매 업소 리스트에 대한 정보를 제공합니다. 세부정보는 종량제봉투 판매업소의 업소명, 업소가 위치한 동명, 주소, 판매업소 지정일자 등을 제공하고 있습니다.종량제봉투를 이용하고자 하는 시민은 해당 정보를 통하여 인근 봉투 판매업소를 정확하고 신속하게 접근할 수 있습니다.기타 종량제봉투 관련 정보는 의정부도시공사 대표 홈페이지에 접속하시어 사업소개>환경사업>종량제규격봉투 소개에서 확인할 수 있습니다.https://www.uiuc.or.kr/businessInfo/environmentPage/trashbag/list.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.
