description_portal: '이 자료는 당해연도의 행정부 국가공무원에 대한 징계종류별 비위통계를 정리한 자료입니다. 당해연도에 징계 처분받은 인원을 징계종류별로, 비위유형별로 구분하고 있습니다.* "20.4월, 지방 소방공무원이 국가직으로 전환됨에 따라, 해당 통계는 소방공무원 징계인원이 포함된 수치입니다.* 징계종류 : 파면, 해임, 강등, 정직, 감봉, 견책* 비위유형 : 성실의무위반, 복무위반, 직장이탈금지위반, 비밀엄수의무위반, 청렴의무위반, 품위유지의무위반, 영리·겸직금지위반, 정치운동금지위반, 집단행위 금지위반, 기타로 분류'
