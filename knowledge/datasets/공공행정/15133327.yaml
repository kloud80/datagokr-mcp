description_portal: 'O 조사 방법 : 민간기업의 개인정보처리자를 산업군 별 표본을 추출, 설문조사 결과(빈도)를 도출하였음※ 민간기업 5,795명을 대상으로 표본 조사한 자료이므로, 각 산업군 대표하는 결과로는 간주할 수 없음O 설문 내용 : 귀사는 개인정보를 어떠한 목적으로 수집하셨습니까? 해당하는 사항을 모두 표시해 주십시오O 응답 내용 : 각 항목명이 설문자가 선택한 결과임(설문조사 시 중복 응답 허용)O 데이터 값 : 각 산업군 별 조사자 수를 기준으로 설문 항목을 선택한 비율항목설명인사관리 : 채용 및 인사관리(업무, 급여지급, 복지 등)홍보 마케팅 : 홍보, 마케팅, 행사운영 등고객관리 : 고객/회원 관리서비스 제공 : 상품 및 서비스 제공(부동산 계약, 택배 서비스, 행정, 민원 등 포함)회원 가입 : 회원가입 및 서비스 이용 과정에서 본인 여부 확인범죄 정보 : 범죄 경력 및 범죄 행위 파악법적 의무 : 법적 의무 이행기타: 기타가중치 : "조사 대상 수를 기준으로 부여된 가중치(전체 평균 산정 시 가중치 반영 필요)"'
