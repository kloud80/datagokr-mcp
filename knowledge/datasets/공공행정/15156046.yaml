description_portal: '세종특별자치시시설관리공단은 봉안시설의 구조와 안치 위치를 시민이 명확히 확인할 수 있도록 봉안당(담) 위치정보 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 봉안당·봉안담의 구역, 블록, 행·열 정보 등을 체계적으로 관리하여 시설 운영 효율성을 높이고, 이용자의 위치 안내 및 행정 투명성을 강화하기 위해 구축되었습니다.■ 데이터 컬럼 구성봉안시설구분 - 봉안시설의 종류 구분    예: 봉안당, 봉안담 등봉안구역구분 - 봉안시설 내 구역을 식별하는 구분 정보    예: 1층, 2층, A구역 등봉안블럭구분 - 구역 내 세부 블록을 식별하는 구분값(호실)    예: 봉안당01, 봉안당 02, 등 / 봉안당01 = 봉안당 1호실, 봉안당 02 = 봉안당 2호실을 의미봉안블럭 행 - 봉안당(담) 내 가로 방향의 위치(행, Row) 정보봉안블럭 열 -  봉안당(담) 내  세로 방향의 위치(열, Column) 정보사용여부 - 해당 위치의 사용 상태 - 예: Y(사용 중), N(미사용)■ 데이터 제공 목적 - 봉안당(담) 위치정보 데이터는 다음과 같은 목적을 위해 제공됩니다. - 봉안시설 내 안치 위치의 체계적 관리 및 투명한 공개 - 시민이 안치 위치를 명확히 확인할 수 있는 편의성 제공 - 시설별 사용 현황 파악을 통한 공간 효율성 향상 - 봉안시설 안내 시스템 및 공간정보 기반 행정서비스 지원 - 장사시설 운영의 투명성 강화 및 공공성 제고세종특별자치시시설관리공단은 시민 중심의 장사행정 서비스를 위해 봉안시설 정보를 지속적으로 갱신·공개하고 있습니다.'
