description_portal: 본 데이터는 충청북도 충주시의회에서 다루는 의안의 처리 전 과정을 기록한 정보로, 의안종류코드, 의안처리코드, 대수, 의안명, 발의일, 본회의 상정일·보고일·처리일, 의안번호, 회기 및 차수, 위원회 회부일·상정일·보고일·처리일, 위원회 결과, 자구수정 회부 및 처리일, 심사보고 접수일, 위원회 차수, 소관위원회, 집행부 이송일, 발의자 등의 항목으로 구성되어 있음. 본 데이터는 의안의 입안부터 상임위원회 및 본회의 심의, 처리결과, 이송까지의 흐름을 체계적으로 파악할 수 있게 하며, 의정활동의 투명성과 입법 행정의 이력을 관리하는 데 활용됨. 특히 조례 제정·개정 현황 파악, 발의자별 의정활동 분석, 회기별 의안 처리성과 평가 등 정책 수립 및 의정연구 자료로 유용함.
