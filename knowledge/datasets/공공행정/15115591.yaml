summary_user: 서울 양천구 관내 동물판매업(반려동물을 사들여 판매·알선·중개하는 업소) 영업장의 인허가 원장으로, 업소별 사업장명, 인허가일, 휴·폐업일, 영업상태, 지번·도로명 주소, 전화번호, 좌표를 건별로 담는다. 주민이 동네 펫숍이 정식 허가를 받아 지금도 영업 중인지 확인하거나, 분석가가 양천구 반려동물 판매업소의 개업·폐업 이력과 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, LOCALDATA 인허가 자료와 같은 원천을 공유한다.
description_portal: 본 데이터는 서울특별시 양천구 관내 동물판매업 영업장의 인허가 정보를 체계적으로 정리한 자료이다. 각 업소별 사업장명, 인허가날짜, 주소, 전화번호, 영업상태, 업무구분 등의 정보를 제공하여 관련 기관과 주민이 동물판매업 현황을 정확히 파악할 수 있도록 구성하였다. 해당 자료는 영업 관리, 위생 점검, 민원 대응, 지역사회 안전 관리 등 다양한 행정 목적에 활용될 수 있으며, 반려동물 판매 서비스의 안전성과 효율성을 높이는 기초 자료로 사용된다. 본 데이터는 주민 생활 편의 증진과 행정 업무 수행을 지원하는 중요한 공공 정보이다.*동물판매업 - 가정에서 반려의 목적으로 사육하는 동물을 구입하여 판매, 알선 또는 중개하는 업소
