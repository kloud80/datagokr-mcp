summary_user: 경기도 산하 각종 위원회를 위원회 단위로 정리한 자료로, 집계년도·위원회명·담당부서·설치목적·설치근거·구성원수(COMPSTN_MANPWR_CNT)를 담는다. 도정 감시나 행정 분석을 하는 사람이 '경기도에 비슷한 목적의 위원회가 중복 설치돼 있는지, 각 위원회가 어떤 법령에 근거해 몇 명으로 구성돼 있는지'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위원회명·담당부서명 같은 이름 매핑이나 같은 기관(경기도) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 산하 각종 위원회의 설치 목적, 운영 근거 및 구성 현황을 집계한 자료입니다. 주요 항목에는 집계년도, 위원회명, 담당부서명, 설치목적, 설치근거, 구성원수 등이 포함되어 있습니다. 예를 들어, 경기경제자유구역청 건축위원회는 건축 인허가 심의를 위해 설치되었으며 「건축법」과 「경제자유구역의 지정 및 운영에 관한 특별법」을 근거로 운영됩니다. 이 데이터는 위원회별 역할과 법적 근거를 확인할 수 있어 행정 운영의 투명성을 제고하고, 중복 위원회 여부 점검 및 정책 효율화 방안을 마련하는 데 활용될 수 있습니다. 또한 구성원수 현황을 통해 위원회의 대표성·전문성을 평가할 수 있습니다.
