summary_user: 온비드에 등록된 공매 물건 가운데 부동산으로 분류되고 현재 입찰 중이거나 입찰 예정인 물건을 물건·공매조건 단위로 한 건씩 담은 목록이며, 범위는 전국이고 위치는 시도·시군구·읍면동 주소와 PNU로 개별 표시된다. 부동산 공매에 참여하려는 개인이나 사업자가 "우리 지역에서 감정가 대비 최저입찰가가 많이 떨어진 압류·국유재산 중 이번 주에 입찰이 끝나는 물건은 무엇인가"를 찾는 데 쓴다. 물건관리번호와 공매조건번호를 함께 넣어 온비드 부동산 물건상세 조회 서비스와 잇고, 명세상 지번PNU코드(ltnoPnu)로 필지 단위 토지·건물 정보와 연결하며, 재산유형·용도분류·입찰방식은 코드표로 해석한다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid)에 등록된 공매 물건목록 중 물건유형이 부동산으로 분류되며 현재 입찰 중이거나 입찰예정인 부동산 공매물건 목록을 조회할 수 있는 서비스입니다. 서비스를 활용하여 부동산 공매 정보를 한 번에 수집할 수 있으며 입찰 진행 상태(입찰 중 / 입찰 예정)를 기준으로 투자 시점 판단이 가능하고 물건 유형, 지역, 입찰일정 중심의 데이터 기반 분석 및 서비스 개발이 용이합니다. 본 서비스에서 조회된 물건관리번호(cltrMngNo), 공매조건번호(pbctCdtnNo)로 온비드 부동산 물건상세 조회 서비스를 조회하시면 더 상세한 정보를 조회 가능합니다. 필수 검색 조건 : 재산유형코드(prptDivCd), 수의계약가능여부(pvctTrgtYn)'
