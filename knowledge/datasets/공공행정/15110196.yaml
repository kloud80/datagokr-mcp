summary_user: 경상북도 영천시 안의 새마을회관(마을회관)을 시설 한 곳당 한 행으로 담은 파일로, 도로명·지번 주소와 위도·경도, 건립일자, 건물면적, 운영 상태(영업상태명), 관리기관 연락처를 함께 싣는다. 주민이나 지역 활동가가 '우리 마을 회관이 어디 있고 지금 운영 중인가'를 확인하거나, 분석가가 영천시 마을회관의 노후도·면적 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 좌표, 시설명을 기준으로 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 경상북도 영천시의 새마을회관 현황 데이터입니다. 영천시 내에 위치한 각 마을회관 별로 구체적인 주소와 건립일, 건물 면적, 운영 상태, 데이터 기준일자 등을 상세히 제공하여 지역 주민과 관계 기관의 행정 및 지역사회 활동에 유용하게 활용될 수 있도록 구성되어 있습니다. 또한, 영천시의 마을회관 위치를 파악하거나 관련 정책 수립, 지역 커뮤니티 활성화 방안 마련 등에 참고 자료로 활용 할 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 새마을체육과로 연락주시기 바랍니다.
