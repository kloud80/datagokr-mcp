description_portal: 인천광역시 중구의 인쇄소 및 출판사에 대한 정보입니다.인천광역시 중구에는 총 306개소의 출판사 및 인쇄사가 있습니다.[데이터설명]파일명 인천광역시 중구 인쇄소및출판사연번, 업종명, 사업체명칭, 사업체소재지[출판 및 인쇄 설명]출판사(出版社)란 출판을 업(業)으로 하는 인적·물적 시설을 말한다.(출판문화산업 진흥법 제2조 제2호) 흔히 출판업을 전문으로 하는 회사(즉, '출판사의 경영자'인 회사)를 출판사라고 지칭한다.최초의 인쇄술은 목판 인쇄로, 한 장의 종이를 나무로 깎은 판으로 인쇄하는 것이었다. 지금까지 알려진 것 가운데 가장 오래된 목판 인쇄본은 751년경에 신라에서 찍은 무구정광대다라니경이다. 목판 인쇄술은 유럽에도 알려져 성경을 만드는 데 사용하였다. 목판인쇄로는 작은 글씨를 깎기에 어려웠고, 주로 글을 못 읽는 사람을 대상으로 하여 글씨를 현저하게 줄이고 그림 위주로 만든 '가난뱅이의 성경'을 출판했다.
