summary_user: 경기도 통합홈페이지에 게시된 콘텐츠 한 건마다 콘텐츠번호·사이트번호·제목·본문(HTML/에디터 형식)·게시 및 삭제 여부·등록·수정일자·조회수·공공누리 유형·담당부서 등을 담은 건별 메타데이터로, 범위는 경기도 단위이며 위치 정보가 없는 비공간 자료다. 홈페이지 운영 담당자나 분석가가 "어떤 콘텐츠가 많이 조회되고, 모바일·다국어 지원이나 공공누리 표시가 빠진 페이지는 어디인가" 같은 운영 현황 점검에 쓴다. 실측 컬럼에서 다른 데이터와 이어 쓸 전역 조인 키는 없고, 담당부서명이나 제목 같은 이름 매칭으로만 경기도 내 다른 자료와 연결된다.
description_portal: 이 데이터는 경기도 통합홈페이지에 게시된 다양한 콘텐츠 자료의 메타데이터로 구성되어 있습니다. 각 콘텐츠는 고유 식별자인 콘텐츠번호를 통해 관리되며, 사이트번호 및 제목을 통해 콘텐츠의 분류와 주제를 확인할 수 있습니다. 콘텐츠의 내용은 HTML 또는 에디터 형식 등으로 구분해서 제공합니다. 게시여부, 등록일자, 삭제일자 등의 항목은 콘텐츠의 게시 상태와 업데이트 이력을 파악하는 데 활용되며, 조회수 항목을 통해 사용자 접근 빈도도 확인할 수 있습니다. 이 외에도 다국어 체크 여부, 모바일 보기 가능 여부, 공공누리 유형 등 다양한 콘텐츠 속성 정보가 포함되어 있어 공공정보 콘텐츠의 운영 현황을 분석하고, 사용자 맞춤형 서비스 개선, 정보 접근성 향상 등의 목적으로 활용될 수 있습니다.
