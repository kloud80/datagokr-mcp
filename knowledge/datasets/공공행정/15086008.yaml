description_portal: '이 데이터는 광주광역시 서구의 행정동(예: 양동, 농성1동 등) 단위로 구분된 1인 가구 현황으로, 5세 단위 연령대와 성별(남자, 여자)에 따라 세분화되어 있습니다. 주민등록 인구를 기반으로 산출되며, 특정 시점 기준의 통계 자료입니다.본 자료는 고령화, 청년 1인 가구 증가, 고독사 위험, 돌봄 공백, 주거 불안 등 최근 사회적 이슈와 관련된 분석 및 정책 수립에 활용될 수 있으며, 지역 복지 서비스 대상자 파악, 인구 구조 변화 대응, 맞춤형 복지 설계 등 다양한 공공 및 민간 분야에서 참고자료로 활용 가능합니다.* 행정기관 컬럼 내 데이터는 광주광역시 서구의 행정동(18개 동)입니다.** 연령 컬럼 내 데이터는 0세부터 시작하여 5살 단위로 구분한 연령이며, 각 행정동별로 연령대를 기재하였습니다. 행정동 내 해당 연령대에 1인가구 수 합계가 1명 이상인 경우만 연령대를 기재하였습니다.'
