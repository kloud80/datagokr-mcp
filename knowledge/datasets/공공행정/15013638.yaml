summary_user: 인천광역시 본청과 직속기관, 사업소를 기관 한 곳당 한 행으로 기관명·도로명주소·전화번호만 담은 소규모 명단 파일(CSV 약 12.7KB)이다. 시민이나 민원 담당자가 '이 사업소가 어디에 있고 전화번호가 뭔지'를 확인하거나, 인천시 소속 기관 위치를 지도에 표시하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소를 문자열로 맞춰 연결해야 한다.
description_portal: 인천광역시가 제공하는 행정기관 현황 공공데이터는 시 본청과 직속기관, 사업소의 기본 정보를 체계적으로 정리한 자료입니다. 이 데이터는 각 기관의 상호(기관명), 도로명 주소, 연락처를 항목별로 수록하여 시민과 행정기관이 활용할 수 있도록 구성되어 있습니다. 이를 통해 특정 기관의 위치와 연락처를 쉽게 확인할 수 있으며, 민원 처리, 행정 서비스 이용, 기관 간 협업 등 다양한 행정 활동에 활용됩니다.해당 데이터는 공공데이터포털에서 CSV파일을 무료로 다운로드 할 수 있습니다. 참고하시길 바랍니다.
