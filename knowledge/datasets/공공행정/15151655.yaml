summary_user: 경기도 지역화폐 사용 내역을 바탕으로 읍면동별·카드업종 중분류별 월 매출을 집계한 자료로, 기준년월마다 매출금액, 매출 순위, 매출 비율, 전월 대비·전년 동월 대비 증감값과 증감률을 담는다. 지역경제 분석가나 소상공인 정책 담당자가 "우리 동네에서 지역화폐로 어떤 업종 매출이 늘었나"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 읍면동 코드(emd_cd)와 업종명을 이름·코드로 맞춰 같은 기관의 상권·유동인구 자료나 LOCALDATA 인허가 자료와 연결한다.
description_portal: 이 데이터는 지역화폐 사용 내역을 기반으로 경기도 각 읍면동별 중분류 업종에 대한 월별 매출 현황을 보여주는 자료입니다. 기준년월을 중심으로 중분류업종명, 대분류업종코드, 발행구분코드 등의 정보를 포함하며, 각 항목별로 매출금액과 매출금액 순위, 매출금액비율, 전월 대비 및 전년 동월 대비 증감값과 증감비율이 수록되어 있습니다. 이를 통해 특정 지역의 소비 트렌드 분석, 지역화폐의 경제적 영향 평가, 업종별 성장세 분석 등 다양한 정책적·경제적 인사이트 도출이 가능합니다. 특히 중분류업종은 숙박업, 여행업, 문화/취미 등으로 세분화되어 있어, 생활 밀접형 업종의 소비 특성을 지역 단위로 파악하는 데 유용합니다. 해당 데이터는 지역경제 분석, 유통·소비 정책 수립, 소상공인 지원 정책 등에 활용될 수 있습니다.
