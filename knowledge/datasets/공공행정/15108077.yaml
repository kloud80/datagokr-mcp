description_portal: 행정기관과 통계년월을 기준으로 시도명, 시군구명, 행정동명, 통, 반, 총사망말소자수, 남자사망말소자수, 여자사망말소자수, 만0세남자, …, 만110세이상남자, 만0세여자, …, 만110세이상여자 사망말소자수를 조회하기 위한 서비스입니다.주민등록 데이터는 통계의 기본이 되는 인구 데이터로써, 주민의 신고에 따라 주민등록법 제6조의 규정에 근거하여 개인·세대별 주민등록표를 기반으로 매월 말일 집계하고 있으며 거주자, 거주불명자, 재외국민을 포함하고 있습니다.활용가치가 큰 주민등록 데이터의 제공 단위를 통반 단위, 도로명 등으로 확대하여 오픈API 방식으로 제공함으로써, 주민등록 데이터를 활용한 국가정책수립, 민간·공공서비스 개발, 창업 지원 및 일자리 창출 등 다양한 분야의 디지털 전환 및 국민 삶의 질 향상에 기여할 목적으로 작성되었습니다.
team:
  dept: 주민과
services:
  - op: /selectAdmmSexdAgeErsr
    name: 행정동별(통반단위) 성/연령별 사망말소자수 목록 조회
    endpoint: https://apis.data.go.kr/1741000/admmSexdAgeErsr/selectAdmmSexdAgeErsr
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: admmCd
        required: true
        example: '1111054000'
        desc: 행정기관코드 자료확인(행정안전부 홈페이지  https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardList.do?bbsId=BBSMSTR_000000000052 업무안내 > 지방자치분권실 > 주민등록,인감,행정사 > 주민등록,인감,행정사)
      - name: srchFrYm
        required: true
        example: '202210'
        desc: 조회시작년월. 2022.10부터 조회가능
      - name: srchToYm
        required: true
        example: '202210'
        desc: 조회종료년월. 3개월 기간내 설정
      - name: lv
        required: false
        example: '4'
        desc: '조회결과구분. 광역시도 단위 : 1, 시군구 단위 : 2, 읍면동 단위 : 3, 읍면동 통반 단위 : 4, 단일 시도 단위 : 5, 단일 시군구 단위 : 6, 단일 읍면동 단위 : 7 (기본값 : 4)'
      - name: type
        required: false
        example: XML
        desc: '타입. XML, JSON(기본값 : XML)'
      - name: numOfRows
        required: false
        example: '10'
        desc: '페이지 크기. 페이지당 목록 수(1~100)(기본값 : 10)'
      - name: pageNo
        required: false
        example: '1'
        desc: '페이지 번호. 기본값 : 1'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
