description_portal: 본 자료는 2020년 코로나19로 인해 대전광역시에서 공공요금 감면 지원 혜택을 받은 약 10만 명의 소상공인을 대상으로, 2022년 9월까지의 영업 상태 현황을 분석한 내용입니다. 영업 상태는 영업 중, 휴업, 폐업으로 구분되었으며, 구별 및 대분류 업종별로 상세히 정리되어 있습니다. 이를 통해 코로나19 팬데믹 이후 소상공인의 경영 상황과 경제적 영향을 파악할 수 있으며, 지역별·업종별 맞춤형 지원 정책 수립에 중요한 기초 자료로 활용됩니다. 본 조사는 2022년 공공데이터 기업매칭지원사업의 일환으로 수행되어 신뢰도 높은 데이터를 제공합니다.
