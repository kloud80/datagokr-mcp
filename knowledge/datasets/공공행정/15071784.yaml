summary_user: 서울시 지하수영향조사기관(지하수 개발·이용이 주변에 미치는 영향을 조사하는 업소)의 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원장이며, 인허가일·취소일, 영업상태, 지번·도로명 주소, 사업장명, 중부원점TM 좌표를 포함한다. 지하수 개발 사업자가 서울에서 현재 영업 중인 영향조사기관을 찾거나, 분석가가 해당 업종의 개업·폐업 이력을 살펴볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·사업장명 매칭이나 개방기관 코드(OGDP_INST_CD)로만 연결하며, 원본이 같은 LOCALDATA 지방행정 인허가 데이터와 함께 쓴다.
description_portal: '해당 데이터는 서울시 지하수영향조사기관 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.지하수개발·이용이 주변지역에 미치는 영향을 분석 및 예측하는 영향성조사업무를 수행하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
