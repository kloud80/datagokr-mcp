summary_user: 자치단체별·회계연도별로 일반회계와 기타특별회계에 편성된 국외여비 예산액을 담은 집계 데이터로, 국외업무여비와 국제화여비, 그 합계인 국외여비총액이 세출예산총계에서 차지하는 비율을 2015회계연도부터 전국 범위로 제공한다. 주민·언론·분석가가 "우리 시·군·구는 공무원 해외출장 예산을 얼마나, 세출 대비 몇 % 편성했나"를 다른 자치단체와 비교할 때 쓴다. 전역 조인 키는 없고, 회계연도(fyr)와 자치단체 코드(laf_cd)·자치단체명을 기준으로 같은 지방재정365 공시 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: 국외여비는 공무원의 국외출장경비로 국제회의, 국제행사 등 업무수행에 필요한 경비인 국외업무여비와 각종 해외시찰, 자료수집, 국외훈련 등 업무능력 향상에 필요한 국제화여비로 구성됩니다.국외여비 편성현황 정보는 자치단체별로 일반회계와 기타특별회계 대상으로 편성된 국외여비 예산액 정보를 제공합니다. 세부항목으로는 국외업무여비와 국제화여비를 합산한 국외여비총액을 세출예산총계로 나눈 비율정보를 제공되며 2015회계연도 정보부터 제공됩니다. 지방재정통합공개시스템(lofin365.go.kr)에서 보다 자세한 정보를 확인하실 수 있습니다.
