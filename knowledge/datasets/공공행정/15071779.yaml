summary_user: 서울시 종합유원시설업(안전성 검사대상 놀이기구를 6종류 이상 설치·운영하는 놀이공원 등) 업소를 건별로 담은 인허가 원장으로, 인허가·취소일, 영업상태, 소재지 주소, 중부원점TM 좌표, 놀이시설 수, 보험 가입기간 등을 포함한다. 사업자나 분석가가 '서울에서 현재 영업 중인 놀이공원은 어디이고 놀이기구를 몇 개 운영하는가'를 확인하거나 상권·점포 이력 분석의 원료로 쓴다. 전역 조인 키는 확인되지 않아, 지방행정 인허가 데이터개방(LOCALDATA)의 같은 원천 자료와는 관리번호·업소명·주소로 맞춰 잇는다.
description_portal: '해당 데이터는 서울시 종합유원시설업 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.놀이공원 등 안전성 검사대상의 놀이기구를 6종류 이상 설치하여 운영하는 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
