summary_user: 부산광역시 상권별로 집객시설 수와 그 내역(관공서·학교·병원·버스정류장·지하철역·숙박·쇼핑 시설 수 등)을 담은 상권 단위 집계 데이터입니다. 상가 창업을 검토하는 사업자나 상권 분석가가 '부산에서 병원·학교·역 같은 집객시설이 많이 모인 상권은 어디인가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 상권명(comm_nm)·상권구분명의 이름 매칭이나 같은 부산시 상권 데이터의 코드로만 유동인구·점포 이력·인허가 자료와 이어 쓴다.
description_portal: 부산광역시 부산 상권 집객시설현황 정보(상권명, 상권구분명, 집객시설수, 관공서수, 학교시설수, 병원시설수 등)를 제공하는 서비스입니다. 집객시설은 사람들이 자발적으로 찾아오게 만드는 시설, 즉 유동인구를 끌어들이는 시설을 말하며, 이러한 집객시설은 주변 상권 활성화, 유동인구 유입, 지역 가치 상승 등의 효과를 유발합니다. 때문에 집객시설은 상권 분석의 핵심 요소이며, 지역 활성화 및 인프라 구축에도 많은 영향을 미칩니다. 또한 부동산 가치와도 밀접한 관련이 있으며, 정책 기획에도 활용될 수 있습니다.
