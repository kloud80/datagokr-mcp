description_portal: 한국도로교통공단이 운영하는 도서실 장서의 관리 속성을 표준화하여 제공하는 통제 메타데이터이다. 각 레코드는 분류번호, 청구기호, 국가코드, 언어코드, 보존등급, 이용제한 범주, 보관코드·비치위치, 등록번호·관리번호, 입수일자, 대출가능 여부, 상태(파손·분실·정리중)를 포함한다. 이용자는 코딩값과 코드표를 참조하여 서지 데이터와 연계분석, 장서 점검·이관·폐기 기준 수립, 열람정책 개선, 연구자료 인용 관리 등 업무에 활용할 수 있다. 개인정보는 포함하지 않으며, 해석 시 데이터 정의서·컬럼정의서의 코드 체계를 확인하고 원저작자를 명기한다.
