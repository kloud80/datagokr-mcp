description_portal: 한국수력원자력㈜이 공개하는 본사 데이터센터 전기사용량에 대한 데이터입니다. 한국수력원자력 경주본사 데이터센터 2020년도 총 사용량 관련 자료입니다. (데이터 제공 신청번호 77142 관련 이미 개별 데이터 제공이 됐으나 전체 개방을 위해 등록진행하였습니다.) 제공항목은 UPS1, UPS2 ,UPS3, UPS4 데이터센터용 전원,수냉식 항온항습기(1~2호기),수냉식 항온항습기(3~5호기),수냉식 항온항습기(6~8호기),UPS실/배터리실 항온항습기,터보냉동기,월별 합계,일 사용량,시간당 사용량입니다. 이 공개 데이터를 통해 한국수력원자력 데이터센터의 계절별·월별 전력 사용 패턴을 분석할 수 있으며 타 데이터센터와 전력 사용량을 비교해 볼 수 있습니다.
