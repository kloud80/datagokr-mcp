summary_user: 지방공기업의 영업이익을 직영기업·지방공사·공단 같은 유형과 상수도·하수도·공영개발 같은 사업별로 나눠 연도별로 담은 전국 단위 집계 자료다. 분석가나 지방재정 담당자가 "어느 지자체의 어떤 유형 공기업이 해마다 영업이익을 얼마나 냈는가"를 확인해 재무상태 분석이나 경영성과 비교에 쓴다. 전역 조인 키는 없고, 회계연도(fyr)와 광역·기초 자치단체 코드·이름(laf_cd 등)으로 다른 지방재정 자료와 이름·코드 매핑해 잇는다.
description_portal: 이 데이터는 공기업별 영업이익을 직영기업, 지방공사, 공단 등 유형별로 분류해 제공합니다.영업이익에 대한 내용은 상수도, 하수도, 공영개발 등 사업별로 세분화되어 있으며, 연도별 변화도 파악할 수 있습니다.자료 활용은 영업이익을 통해 지방공기업의 재무상태분석, 경영성과평가 등에 쓰입니다. 또한 지방공기업 재정관리의 중요한 기초 자료로 활용됩니다.데이터의 형태는 엑셀이나 PDF형태로 내려받을 수 있습니다.해당자료는 클린아이(지방공기업 경영정보시스템)을 통해 내려받기가 가능합니다.
