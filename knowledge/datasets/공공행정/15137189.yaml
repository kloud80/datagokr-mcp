description_portal: '한국산업인력공단에서 제공하는 외국인노동자의 고용직종(세부업종, 업종정보, 직업 등)에 대한 공공데이터 입니다.외국인 근로자 고용 현황을 직종, 직업, 업종 단위로 세분화하여 API 형태로 수집·제공하는 데이터입니다. 주요 항목에는 직종 코드(예: 제조업, 건설업, 서비스업 등 업종별 분류), 직업 코드(세부 직무 분류), 종사자 수(고용 중/구직 중 외국인 수)관련  다양한 데이터를 제공합니다. 외국인노동자의 직종 등 제공하는 정보를 통해 국내 외국인력 도입 지원을 진행하고 있으며, 직종 및 세부 업종까지 알 수 있는 데이터 입니다.'
