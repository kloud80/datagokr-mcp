summary_user: 대한민국 법령에서 쓰이는 법령용어를 용어 한 건 단위로 담은 목록으로, 용어 이름과 고유 ID, 상세 조회 링크, 법령 종류·사전 구분 코드를 함께 제공한다. 법률 문서를 쓰거나 읽는 실무자와 국민이 "이 법령에 나온 용어가 정확히 무슨 뜻인가"를 찾아볼 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 법령용어 ID로 같은 기관의 용어 상세 조회와 잇거나 용어명을 이름 매칭해 법령 본문 데이터와 연결한다.
description_portal: 법제처_법령 용어 목록 조회 데이터는 대한민국 법령에서 사용되는 주요 법률용어와 그 정의를 체계적으로 수록한 자료입니다. 본 데이터는 법령 내 용어의 정확한 의미와 해석을 제공하며, 법률 해석의 혼란을 방지하기 위해 구성되었습니다. 각 용어는 법령상 위치 및 설명과 함께 상세히 기록되어 있어 법률 문서 작성과 이해에 도움을 줍니다. 이를 통해 법률 관계자 및 일반 국민이 법령 내용을 명확히 파악할 수 있도록 지원합니다. 본 데이터는 법률용어의 통일성과 전문성 확보에 기여하는 중요한 자원입니다.
