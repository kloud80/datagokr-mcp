summary_user: 재정경제부가 추진한 경제발전경험공유사업(KSP)의 2022·2023년도 사업을 사업년도·대상국가·사업명 단위로 나열한 목록 파일(csv, 약 11KB)이다. 개도국 정책자문 협력 현황을 조사하는 분석가나 해외진출을 검토하는 기업이 특정 국가에서 어떤 KSP 사업이 진행됐는지 확인할 때 쓴다. 전역 조인 키가 없어 국가명을 기준으로 다른 국가별 협력·통계 자료와 이름 매핑으로만 연결한다.
description_portal: '우리의 성공적 경제발전 경험을 개도국을 포함한 경제협력 국가와 공유함으로써 협력대상국의 경제·사회적 발전을 지원하고 상호 경제협력을 증진- 특히, 자원부국 등 전략적 경협 필요성이 높은 국가에 대해 경제전반에 대한 포괄 컨설팅을 실시하여 협력대상국과 우호적인 경협기반 구축- (양자정책자문) 한국과 협력국의 전문가(컨설턴트)간 공동 연구를 통해 협력국 경제 발전을 위한 맞춤형 정책대안을 도출하는 사업으로 양국간 경제협력 확대에도 기여- (국제기구 공동컨설팅) 국제기구와 삼각협력 형태로 추진하는 정책자문 사업으로 협력국 경제발전 뿐만 아니라 국제기구 재원을 활용한 후속사업 발굴 및 우리 기업 해외진출 등도 지원경제발전경험공유 사업의 2022/2023년도 사업목록을 제공합니다. 경제발전경험공유사업: 한국의 발전 경험과 지식을 바탕으로 협력대상국의 수요와 여건을 고려한 맞춤형 정책연구·정책자문·역량배양 사업을 통하여 대상국의 경제·사회발전에 기여하고자 하는 지식중심의 사업'
