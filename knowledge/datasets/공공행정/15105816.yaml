description_portal: '- 전라남도에서 전 국민, 공무원 등을 대상으로 제안한 목록 중  선정된 우수제안 목록 정보로 제안별, 제안명, 선정 시기 등의 정보를 포함한 우수제안 정보를 조회할 수  있습니다.- 전라남도 공무원 제안 제도는 도청 및 시군 공무원들이 업무 개선과 정책 혁신을 위한 창의적인 아이디어를 제안하는 시스템입니다. 이 제도는 공무원의 참여를 통해 행정 효율성을 높이고, 도민 중심의 정책을 개발하는 데 기여하고 있습니다.- 전라남도는 도민과 국민이 함께 참여하는 제안 제도를 통해 지역 발전과 행정 혁신을 도모하고 있습니다. 국민 제안 제도는 도민들의 목소리를 직접 반영하여 정책에 반영하는 중요한 채널입니다.- 전라남도의 제안 제도는 도민과 공무원이 함께 참여하여 지역 발전과 행정 혁신을 이루는 중요한 수단입니다. 많은 분들의 적극적인 참여를 통해 더 나은 전라남도를 만들어 가시기 바랍니다.'
