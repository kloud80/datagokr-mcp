description_portal: (데이터 수집목적 및 과정) 경상남도 산업대분류별 사업체총괄 데이터는 2006년부터 2023년까지의 경상남도 산업대분류별 사업체수, 여성대표자사업체수, 종사자수 등에 대한 정보입니다.* 항목은 사업체수, 여성대표자사업체수, 종사자수, 남자종사자수, 여자종사자수로 구분합니다.* 산업대분류는 농업임업및어업, 광업, 제조업, 전기 가스 증기 및 수도사업 등으로 구분합니다.* 조직형태는 개인, 회사법인, 회사이외법인, 비법인으로 구분합니다.* 사업체구분은 단독, 공장지사영업소, 본사본점으로 구분합니다.(데이터 현행화 시기) 해당 데이터는 통계 DB로 자동갱신합니다. 해당 링크로 접속하여 데이터를 조회 및 다운로드 할 수 있습니다.
