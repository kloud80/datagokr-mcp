description_portal: 본 데이터는 관내에 지정된 토지 거래 허가 구역의 현황 정보이다. 지정지역, 지정기간, 지정 면적, 지정위치 등의 세부 내용을 포함한다. 토지 거래 허가 구역은 부동산 투기 과열 지역에서 토지 거래를 허가제로 전환하여 지가 안정 및 투기 억제를 도모하는 제도이다. 해당 자료는 부동산 정책 수립, 지가 안정 대책 마련, 토지 거래 관리에 활용된다. 허가 구역 지정 및 해제 과정에서 부동산 시장 동향 분석 및 정책 효과 평가에 필요한 기초 자료를 제공한다. 토지 소유자 및 매수 희망자가 거래 허가 필요 여부를 사전에 확인하여 거래 절차를 원활하게 진행할 수 있도록 지원한다. 또한 투기 목적 거래를 차단하고 실수요자 중심의 건전한 거래 질서를 확립하는 데 기여한다.
