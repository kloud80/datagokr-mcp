description_portal: 개인정보 보호법 제62조는 개인정보처리자가 개인정보를 처리할 때 개인정보에 관한 권리 또는 이익을 침해받은 사람은 보호위원회에 그 침해 사실을 신고할 수 있고, 보호위원회는 신고의 접수, 처리 등에 관한 업무를 효율적으로 수행하기 위하여 대통령령으로 정하는 바에 따라 전문기관을 지정할 수 있습니다. 이 경우 전문기관은 개인정보침해신고센터를 설치 및 운영하여야 합니다. 개인정보위는 보호법 및 시행령에 따라 한국인터넷진흥원을 전문기관으로 지정하고 한국인터넷진흥원은 개인정보침해신고센터를 운영하고 있으며 개인정보침해신고센터에서는  개인정보 침해에 관해 신고 및 상담을 수행합니다.본 데이터는 분기별로 개인정보 침해 신고 상담 접수유형 분석, 상담건수를 제외한 연도별 침해신고 처리에 관한 내용을 제공합니다.
