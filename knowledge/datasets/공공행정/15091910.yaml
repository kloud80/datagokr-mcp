summary_user: 기업집단포털의 다른 API를 호출할 때 공통 파라미터로 쓰는 요청년월(공개년월·지정년월) 가운데 실제로 사용 가능한 년월 목록을 담는 조회 서비스로, 매년 5월 1일 지정된 기업집단과 지주회사의 공개년월(othbcYm)을 업무 구분(jobSeCode)별로 돌려준다. 기업집단 지분·내부거래 정보를 보려는 분석가·언론·투자자가 "지금 조회할 수 있는 최신 공개년월이 언제인가"를 확인한 뒤 기업집단·지주회사 정보제공 API를 부르는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 데이터와 직접 결합하지 않고, 받은 년월 값을 기업집단포털 다른 API의 요청 파라미터로 넘겨 이어 쓴다.
limits: 년월 목록만 담으며 기업집단·지주회사의 실제 내용(소속회사, 지분, 내부거래)은 들어 있지 않아 다른 기업집단포털 API를 따로 호출해야 한다. 전역 조인 키가 없어 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 개발계정은 하루 10,000회로 호출이 제한된다.
