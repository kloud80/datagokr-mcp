summary_user: 행정안전 통계연보 '지방행정/지역발전' 분야에 실린 공영자전거 운영 현황 통계로, 설치지역·자전거 보유 대수·전년도 대여실적 같은 집계값을 전국 범위로 담는다. 지자체 정책 담당자나 분석가가 "어느 지역이 공영자전거를 몇 대 보유하고, 지난해 대여가 얼마나 있었나"를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역 이름 매핑이나 같은 기관(행정안전부) 통계연보 항목끼리만 연결한다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '자전거 이용 활성화 사업', '공영자전거 운영 현황'에 관한 통계입니다. 운영현황(설치지역, 자전거 보유 대수, 전년도 대여실적) 등 공영자전거 운영 현황을 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
