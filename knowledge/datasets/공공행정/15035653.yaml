summary_user: 대전광역시 중구 구청과 17개 동 행정복지센터를 기관 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 2.6KB)로, 기관명·우편번호·주소·전화번호·팩스번호를 담는다. 중구 주민이나 민원인이 "우리 동 행정복지센터 주소와 전화번호는 무엇인가"를 확인하거나, 분석가가 관내 관공서 위치 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소를 기준으로 이름 매칭해 잇는다.
description_portal: 본 공공데이터는 대전광역시 중구 관내에 위치한 구청 및 동행정복지센터 현황(번호, 자치단체명, 기관명, 우편번호, 주소, 전화번호, 팩스번호 등) 을 제공합니다.데이터 업데이트 주기는 연간 1회로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 자치단체명은 소관 자치단체를 표기하고 있습니다.데이터 컬럼 중 기관명은 구청(중구청) 및 17개동 행정복지센터 정보를 표기하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
