description_portal: 이 데이터는 광주광역시 서구의 빈집 현황 정보를 제공합니다.시도명, 시군구명, 법정동 단위로 구분되며, 각 빈집은 1~3등급으로 등급분류되어 등급별 개수와 전체 빈집 수(소계)를 제공합니다.빈집은 1년 이상 사용되지 않은 주택을 의미하며, 구조 안전성, 위생 상태, 활용 가능성에 따라 등급이 산정됩니다.이 데이터는 도시정비, 주거환경개선, 재개발 정책 수립 및 빈집통계 분석 자료로 활용됩니다.이 데이터는 빈집현황, 등급분류, 빈집통계, 도시정비, 주거환경개선, 법정동기반, 재개발 관련 정보를 포함합니다.
