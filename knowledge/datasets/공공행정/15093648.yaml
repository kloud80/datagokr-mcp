description_portal: 특허상담센터의 온라인상담 데이터는 한국지식재산보호원 공익변리사특허상담센터의 홈페이지 이용자들이 공익 변리사에게 온라인 상담을 신청한 연간 통계를 기록한 데이터입니다.해당 데이터에는 2020년도에 온라인 상담을 신청한 784건의 데이터를 정리한 자료입니다.특허상담센터 온라인상담 데이터에는 다음 정보를 포함하고 있습니다.- 고유번호, 구분번호, 상담분야번호, 지역번호, 신청자격번호, 작성일자로 구성되어 있습니다.신청자격번호는 국가유공자 관련, 등록자 애인, 소기업, 차상위계층, 학생 등으로 구성되어 있으며상담분야번호는 디자인, 상표, 기계 건설분야, 전기 전자분야, 화학 생명분야 등으로 구성되어 있습니다.
