summary_user: 온비드 공매 물건 검색에 쓰이는 용도 코드(카테고리ID·카테고리명과 상위 카테고리)를 계층 목록으로, 온비드에 등록된 물건 소재지를 시도·시군구·읍면동·상세주소 단위로 담는 코드·주소 조회 API이며, 용도 코드 조회와 주소 조회 2개 오퍼레이션으로 구성되고 범위는 전국이다. 온비드 공매 물건을 조회하려는 개발자·분석가가 '토지·주거용 건물 같은 용도로 물건을 걸러 검색하려면 어떤 용도 코드를 넣어야 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 온비드 물건·입찰 정보와는 용도 코드(ctgrId)나 시도·시군구·읍면동 이름을 매핑해 같은 기관 데이터끼리 연결한다.
description_portal: 한국자산관리공사 온비드(Onbid) 홈페이지를 통해 용도별 코드와 온비드에 등록된 주소지를 조회할 수 있는 서비스입니다. 온비드의 코드와 주소 정보를 계층적으로 제공하여 물건 검색과 조건 설정에 필요한 분류 기준을 손쉽게 확인할 수 있도록 지원합니다. 온비드 용도 코드 조회, 온비드 주소 조회 2개의 오퍼레이션으로 구성되며 용도 코드 조회의 경우 공매 물건 검색 시  입력조건으로 사용되는 용도 코드 목록 전체를 다운받을 수 있습니다., 또한 온비드 주소 조회는 온비드에 물건의 소재지를  단순히 조회하는 용도로도 사용할 수 있습니다.
