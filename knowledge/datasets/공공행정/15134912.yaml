description_portal: 영업비밀 보호제도는 타인의 영업비밀을 침해하는 행위를 방지하여 건전한 거래질서 유지를 목적으로 TRIPs 협정에 따라 92.12.15. 도입된 제도로써 미국, 유럽, 일본, 중국 등 주요국에서 모두 도입하고 있는 제도입니다. 특허와 다른 점 하나는 속성상 속지주의를 벗어난다는 점을 들 수 있습니다. 영업비밀은 가장 가치있는 무형자산의 하나로 적절한 관리조치를 취하지 않으면 보호받지를 못합니다. 이러한 제도에 대한 이해를 높이기 위해 국내영업비밀 판례에 대한 기본정보(사건명, 선고일자 등와 판례의 주요쟁점(판결의 핵심 쟁점) 및 내용에 대한 요약본을 제공합니다.
