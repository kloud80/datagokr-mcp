description_portal: 연제구 관내 공개공지 현황 (위치, 면적, 건물명, 사용승인일, 공개공지개소, 공개공지면적 등)에 대한 데이터입니다.공개공지는  도시 환경을 쾌적하게 만들기 위해 일정 규모 이상의 건축물에 일반인이 자유롭게 이용할 수 있도록 설치하며  벤치, 조경 시설 등을 포함하여 시민들의 휴식을 위한 공간을 의미합니다.공개공지를 확보하여야 하는 지역은 일반주거지역, 준주거지역, 상업지역, 준공업지역 등이 있으며. 해당 지역의 건축물은 일반이 사용할 수 있도록 소규모 휴식시설 등의 공개 공지(공터) 또는 공개공간(공개공지 등)을 설치하여야 합니다.
