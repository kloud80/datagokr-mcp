description_portal: '경기도 수원시 관내  시설녹지 현황(완충녹지, 연결녹지, 경관녹지)에 대한 데이터로 녹지등록명, 녹지구분, 녹지위치, 위도, 경도, 면적, 결정일자 정보를 제공합니다. 데이터기준일자는 2025년 7월 21일 입니다. 1. 완충녹지 : 대기오염, 소음, 진동, 악취, 그 밖에 이에 준하는 공해와 각종 사고나 자연재해, 그 밖에 이에 준하는 재해 등의 방지를 위하여 설치하는 녹지2. 경관녹지 : 도시의 자연적 환경을 보전하거나 이를 개선하고 이미 자연이 훼손된 지역을 복원, 개선함으로써 도시경관을 향상시키기 위하여 설치하는 녹지3. 연결녹지 : 도시 안의 공원, 하천, 산지 등을 유기적으로 연결하고 도시민에게 산책공간의 역할을 하는 등 여가 휴식을 제공하는 선형의 녹지** 공공데이터 제공표준 제20차 제·개정에 따라 표준데이터셋 녹지현황에서 확인할 수 있습니다. https://www.data.go.kr/data/15155690/standard.do'
