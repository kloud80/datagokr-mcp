summary_user: SGIS 도시화분석지도 서비스의 주요지표를 도시화지역 단위로 담은 집계 파일로, 전국 시군구 범위에서 도시화지역명·시도명·시군구명과 면적·인구밀도·평균나이를 담는다(CSV 약 128KB). 분석가나 지자체 담당자가 'UN 도시분류 기준으로 본 우리 지역 도시화지역의 인구밀도와 평균나이는 다른 지역과 비교해 어떤가' 같은 질문에 쓴다. 행정구역 코드 같은 전역 조인 키가 없어서, 다른 시군구 통계와는 시도명·시군구명을 이름으로 맞춰 연결해야 한다.
description_portal: '[SGIS 오픈 플랫폼] "도시화분석지도" 서비스의 주요지표 데이터입니다.도시화지역명,시도명,시군구명,면적,인구밀도,평균나이를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 도시화분석지도   ‘UN 도시분류’ 기준을 적용한 인구변화에 따른 도시화 권역의 변화 모습과 격자 통계정보 및 분석 지표를 제공하는 서비스.  - UN의 도시분류 기준의 공식화: 유럽연합, 유엔 인간거주계획, 세계은행 등 6개 국제기구가 도시 기준을 표준화하기 위해 만든 도시 개념을 "20년 UN 통계위원회에서 공식 채택'
