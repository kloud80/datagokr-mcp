description_portal: 국립박물관문화재단의 연도별 신규채용현황 정보입니다.2019년부터 연도별 청년, 여성, 장애인, 비수도권 지역인재, 이전지역 지역인재, 고졸인력에 대한 신규채용 정보입니다.국립박물관문화재단은 ‘박물관 문화유산의 새로운 가치를 창출하는 문화예술 전문기관’을 위하여 박물관 및 미술관 진흥법에 의거 설립된 문화체육관광부 산하 공공기관으로 공연예술사업, 박물관상품사업, 편의서비스사업, 전시운영 및 협력사업, 출판사업 등 국립박물관의 문화유산을 활용하여 다양한 사업 활동들을 펼치고 있습니다.데이터를 통해 연도별 직급별 채용인원 수를 확인할 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
