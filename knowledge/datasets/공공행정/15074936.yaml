summary_user: 인천 영종구(구 중구 관내) 착한가격업소를 업소 한 곳당 한 행으로 담은 소규모 원장 파일로, 업소명·소재지·연락처·데이터기준일자를 담는다(CSV 약 1.3KB). 주민이나 방문객이 동네에서 값싼 외식·세탁·사진관 같은 개인서비스 업소가 어디 있는지 찾거나, 분석가가 구 단위 착한가격업소 분포를 볼 때 쓴다. 전역 조인 키는 없어서 소재지 주소를 지오코딩하거나 업소명·주소를 LOCALDATA 인허가 같은 업소 원장과 이름 매칭해 잇는다.
description_portal: '인천광역시 중구에 위치한 착한가격업소에 대한 데이터로 착한가격업소의 상호명, 소재지, 연락처 등을 제공합니다. 행정안전부에서 2025년도 착한가격업소 활성화 지원사업이 통지됨에 따라 관내 착한가격업소에 인센티브 물품을 지원하여 지역물가   안정 도모 및 물가인상 억제 분위기 확산에 기여하고자 함○ 착한가격업소란 주변 상권보다 저렴한 가격으로 판매하여 물가 안정에 도움을 주며 상권 안정화에 기여하는 업소를 말합니다. ○ 착한가격업소 선정 시 인센티브 제공 : 필요물품, 공공요금 등○지정 시기 : 5월, 10월 (단, 목표한 업소 수 미달 시 상시 접수)○  지정 대상 : 개인사업자, 법인으로서 서민생활과 밀접한 개인서비스요금(통계청 분류)에 해당하는 업종에 대해 시민에게 직접 소매단위로 물품, 서비스 등의 판매행위를 하는 업소○도입 배경 : "11년에 소비자물가 4%까지 급등함에 따라 서민 생활에 영향을 주는 개인서비스요금의 가격 안정 유도○ 추진목적 : 내실 있는 착한가격업소 운영 및 지원을 통해 서민 경제생활 부담 완화 및 물가안정 분위기 확산○지정 규모 : 착한가격업소 지정규모는 시장,군수,구청장이 해당 지차체의 실정을 고려하여 결정하되, 다양한 업종이 분포될 수 있도록 관리○지정 절차  1. 지정 공고 2. 신청 3. 현지 실사평가 4. 지정 여부 심사 5. 결정통보 및 지정 등 교부○ 중구 관내 착한가격업소 종류 : 외식업, 체육교습소, 세탁소, 사진관 등 ○  착한가격업소 홈페이지(https://www.goodprice.go.kr)'
