summary_user: 전북특별자치도의 지역내총생산을 지출 측면에서 최종소비지출, 총자본형성, 재화와 서비스 순이출, 통계상 불일치로 나눠 경상가격으로 담은 집계 통계 파일이며, 범위는 시도 단위다. 지역경제 분석가나 정책 담당자가 '전북 경제는 소비 주도형인가, 투자 중심인가, 역외 이출에 기대는가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도의 같은 지출 통계와 비교하려면 지역 이름이나 항목 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 지역내총생산을 지출 측면에서 분해하여 경제 구조를 심층적으로 분석할 수 있게 하는 핵심 경제 통계입니다. 최종 소비지출, 총자본형성, 그리고 재화와 서비스의 순이출 등 주요 구성 항목별로 경제 활동을 나누어 보여줍니다. 이를 통해 지역 경제가 소비 주도형인지, 투자 중심인지, 혹은 수출에 의존하는지를 명확하게 파악할 수 있습니다. 경기 동향을 분석하고 미래 경제를 예측하며, 효과적인 경제 정책을 수립하는 데 있어 없어서는 안 될 기초 자료로서 매우 높은 활용 가치를 지니고 있습니다.
