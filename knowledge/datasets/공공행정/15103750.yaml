summary_user: 한국동서발전이 국내외에 출자한 법인을 법인 한 곳당 한 행으로 담은 작은 CSV 파일(약 1.8KB)로, 법인명·국가·지역·주요 사업 내용을 담는다. 연구자나 분석가가 "한국동서발전이 어느 나라에서 어떤 에너지 사업(신재생·화력·수소 등)에 출자하고 있는가"를 확인하는 데 쓴다. 다른 데이터와 묶을 공통 키는 없다. 다른 공공기관 출자 현황이나 해외 사업 자료와 비교하려면 법인명·국가 이름을 직접 맞춰 이어야 한다.
description_portal: 한국동서발전의 연도별 출자 현황 정보는 한국동서발전이 국내외에 출자한 법인 및 투자 대상에 대한 연도별 자료를 제공하는 데이터입니다.이 데이터는 법인명, 국가, 지역, 주요 사업 내용 등의 항목으로 구성되어 있으며, 에너지 분야에서의 투자 전략, 해외 진출 현황, 사업 다각화 방향 등을 파악할 수 있는 기초 정보를 포함하고 있습니다.학계 및 연구기관에서는 이 데이터를 활용하여 공기업의 출자 구조 및 글로벌 사업 확장 추이 분석, 국가별 에너지 투자 경향 비교, 신재생에너지·화력·수소 등 주요 사업 분야의 투자 비중 변화를 파악하는 데 사용할 수 있습니다.또한 정부의 에너지 정책 방향과 연계된 공공기관의 자본 운용 전략을 분석하거나, 공공기관의 해외 사업 참여가 지역사회나 산업 생태계에 미치는 영향을 평가하는 연구에도 활용이 가능합니다.
