summary_user: 법제처 국가법령정보센터의 법령해석 사례를 건별 목록으로 담으며, 해석일련번호·안건명·안건번호·질의기관명·해석기관명·해석일자와 상세 해석문 링크를 제공한다. 특정 법령을 어떻게 해석했는지 찾는 국민·사업자·법률 분석가가 안건번호나 해석일자 조건으로 관련 해석례를 추리는 데 쓴다. 전역에서 통하는 조인 키는 없고, 법령해석상세링크로 세부 해석문을 열거나 해석기관코드·질의기관코드로 같은 기관 코드를 쓰는 다른 자료와 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 목록 정보만 담으므로 해석 내용은 상세 링크를 따라 확인해야 한다. 외부 사이트 open.law.go.kr의 인증키(query 파라미터 OC)가 필요하며, 포털 활용신청과는 별개다.
