summary_user: 광주광역시의 민방위 주민대피시설을 시설 한 곳당 한 행으로 담은 원천 목록으로, 자치구·행정동, 시설종류(정부지원·공공용)와 용도, 시설명, 도로명·지번 주소, 확보면적, 대피가능인원, 준공일과 지정연도를 담는다. 주민이 우리 동네 가까운 대피소가 어디이고 몇 명까지 수용하는지 확인하거나, 분석가가 행정동별 인구 대비 대피 가능 인원이 충분한지 따져 보는 데 쓴다. 전역 조인 키는 없어서 주소를 지오코딩하거나 자치구·행정동 이름으로 인구 통계·다른 재난안전 시설 목록과 맞춰 이어 쓴다.
description_portal: '2026년 광주광역시 민방위 주민대피시설 현황입니다. 시설종류, 시설용도, 대피시설명칭, 주소, 확보면적, 안내표지판 및 안전취약계층편의설비 등의 현황을 제공합니다.○ 정부지원 대피시설 : 연평도 포격도발("10.11.23.) 계기, 유사시 주민의 생명을 보호하기 위해 대피를 목적으로 2011년 이후 정부지원 대피시설 구축·관리* 소요면적 : 1인당 1.77미터제곱○ 공공용 대피시설 : 민간 및 정부·지자체·공공기관 등의 지하시설물을 유사 시 대피시설로 전환 운영하기 위해 소유자·관리자 또는 점유자(이하 "시설주")의 동의를 얻어 지정한 시설* 소요면적 : 1인당 1제곱미터'
