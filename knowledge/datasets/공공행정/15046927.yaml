description_portal: '○ 통계개요* 통계명 : 통근ㆍ통학 및 주간인구(12세 이상)* 통계종류 : 서울시 12세 이상인구의 통근ㆍ통학인구 현황을 제공하는 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책 입안의기초자료 제공하고, 각종 가구관련 경상조사 표본틀(Sampling Frame)의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청(주관기관), 지방자치단체 및 6개 중앙행정기관(실시기관)- 일반조사구 : 시도 ⇔ 시군구 ⇔ 읍면동(총관리자) ⇔ 조사관리자 ⇔ 조사원* 공표주기 : 정기(5년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 통근ㆍ통학 인구수 등○ 용어설명* 통근인구: 12세이상인구 중 매일 정기적으로 직장에 근무하러 다니는 자를 말함.* 통학인구: 12세이상인구 중 정규학교(원)뿐만 아니라 입시준비학원, 이ㆍ미용학원,양재학원, 각종 기술학원 및 직업훈련원 등에 다니는 사람을 말함○ 기타* 일반가구 및 집단가구의 12세 이상 인구 기준. 단, 특별조사구, 외국인가구 제외○ 출 처 : 통계청 조사관리국 인구총조사과'
