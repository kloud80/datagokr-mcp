summary_user: 제주특별자치도가 지정·관리하는 온천보호구역을 구역 한 곳당 한 행으로 담은 소규모 CSV 원장(약 1.7KB)으로, 명칭·온천우선 이용권자·지정고시일·온천공 소재지·지구면적(제곱미터)을 담는다. 제주에서 온천 개발이나 토지 이용을 검토하는 사업자·주민이 '이 지역이 온천보호구역으로 언제 지정됐고 우선 이용권자는 누구인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 온천공 소재지 주소나 명칭을 문자열로 맞춰 연결해야 한다.
description_portal: '제주특별자치도 내에서 지정 및 관리하는 온천보호구역 데이터를 제공합니다.항목: 명칭, 온천우선 이용권자, 지정고시일, 온천공 소재지 ,지구면적(제곱미터)*지하로부터 솟아나는 섭씨 25도 이상의 원수로서 성분기준에 적합한 것 [온천법 제2조 제1호]*다음의 성분 기준을 모두 갖춘 경우로서 음용 또는 목욕용으로 사용되어도 인체에 해롭지 아니한 것 [온천법 시행령 제2조] ① 질산성질소는 10㎎/L 이하일 것 ② 테트라클로로에틸렌은 0.01㎎/L이하일 것 ③ 트리클로로에틸렌은 0.03㎎/L이하일 것 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=2219'
