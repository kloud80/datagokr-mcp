description_portal: 지식재산 학술포럼은 특허, 상표, 디자인, 저작권 등 지식재산 전반에 대한 최신 동향과 정책, 법률 및 산업 활용 사례를 공유하는 학술 행사입니다. 이 포럼에서는 연구자, 기업 관계자, 변리사, 법률 전문가, 학생 등이 함께 참여하여 지식재산의 보호와 활용 방안, 기술사업화, 인공지능 시대의 지식재산 이슈 등 다양한 주제를 발표하고 토론합니다. 또한 산학연 협력을 촉진하고 창의적인 아이디어와 기술의 가치를 높일 수 있는 방안을 모색하며, 참가자들에게 전문 지식을 습득하고 네트워크를 구축할 수 있는 기회를 제공하는 의미 있는 학술 교류의 장입니다.
