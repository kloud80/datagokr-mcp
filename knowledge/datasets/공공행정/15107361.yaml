summary_user: 행정안전 통계연보 '지방재정' 편에 실린 지방자치단체 재정자주도 통계를 특별시·광역시·특별자치시, 시도, 군, 자치구 같은 자치단체 유형별 평균과 지역 기준으로 담는다. 실측 범위는 전국이며, 행정단위는 시군구다. 지방재정 분석가나 연구자가 "군과 자치구의 재정자주도 평균은 얼마나 차이 나는가" 같은 자치단체 유형 간 재정 여건 비교에 쓴다. 실측 컬럼에는 공통 조인 키가 없어서, 다른 지방재정 데이터와는 지역명이나 단체 유형 이름을 맞추는 방식으로만 이어 쓴다.
limits: 통계연보에 실린 재정자주도 지표 통계이므로 세출 세부사업 단위 원장("우리 구가 어디에 얼마 썼나")은 이 데이터로 알 수 없다. 행정코드 같은 전역 조인 키가 없어서 다른 데이터와 붙일 때 이름 매핑이 필요하다. 호출에는 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
