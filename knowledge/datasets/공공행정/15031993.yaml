summary_user: 전국 지방자치단체 자치법규에 첨부된 별표·서식을 한 건씩 담고, 별표명·별표 종류·별표번호와 관련 자치법규명, 공포일자·시행일자, 제개정 구분, 서식 파일 링크를 포함한다. 행정 담당자나 민원인이 '우리 시 조례의 신청서 서식은 무엇이고 최신 개정본 파일은 어디서 받나' 같은 질문에 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 관련자치법규 일련번호나 자치법규명·지자체기관명 같은 이름 매핑으로 법제처 자치법규 본문 데이터와 연결한다.
description_portal: 본 데이터는 지방자치단체의 자치법규에 첨부된 별표 및 서식 정보를 제공합니다. 각 항목에는 자치법규 고유번호, 해당 조문과 연계된 서식번호 또는 별표 문서 식별자, 서식 제목, 문서 구분 코드, 발효 및 시행일자와 최신 개정내역이 포함됩니다. 이를 통해 사용자는 자치법규에 따른 서식 및 별표의 구조와 적용 범위를 체계적으로 파악할 수 있습니다. 자치단체의 법령 문서화 업무, 행정 절차 수행, 표준 서식 관리에 유용하며, 법제 운용과 행정 효율성 증진을 지원합니다. 자치법규별 문서의 정확한 구성과 일관성 확보 및 통합적 서식 관리를 위한 기초 자료로 활용하기 적합합니다.
