description_portal: '○ 통계개요* 통계명 : 합계출산율* 통계종류 : 서울시 가임여성의 연령별 출산율의 총합을 제공하는 지정ㆍ가공통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 출생,사망,혼인,이혼에 대한 현황을 파악하여, 국가의 인구ㆍ주택ㆍ보건ㆍ사회복지ㆍ교육ㆍ교통 등에 관한 정책수립 및 민간기업의 경영계획 수립에필요한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 가임여성(15~49세)의 합계출산율 및 모의 연령별 출산율 등○ 용어설명* 합계출산율 : 한 여성이 가임기간(15~49세) 동안 낳을 것으로 예상되는 평균 출생아 수* 모(母)의 연령별출산율 : 특정연도의 15～49세까지 모의 연령별 당해연도의 출생아수를당해연령의 여자인구로 나눈 비율을 1,000분비로 나타낸 것'
