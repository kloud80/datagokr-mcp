description_portal: '이 데이터는 서울주택도시공사(SH공사)가 운영·관리하는 대관 시설의 이용 현황 및 소품별 사용요금 정보를 포함한 자료입니다. 공개 항목에는 각 대관 시설별로 구비된 소품(예: 음향장비, 프로젝터, 조명기기 등)에 대한 기본 사용료, 일정 시간 이상 사용 시 발생하는 추가 사용료, 그리고 시설 이용과 관련된 부가 조건이나 참고 사항 등 추가 자료가 함께 제공됩니다. 이 데이터는 공공시설의 효율적인 운영 및 이용자 안내를 위한 투명한 정보 제공을 목적으로 하며, 대관 비용 비교, 예산 수립, 사용자 맞춤형 행사 기획 등 실무적인 활용이 가능합니다. 특히, 소품별 요금 구조를 분석함으로써 시설 운영의 수익구조 개선 또는 감면 정책 설계에도 참고될 수 있으며, 공공자산의 개방성과 접근성에 대한 모니터링 자료로도 활용됩니다.'
