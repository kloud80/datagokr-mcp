summary_user: 서울 동작구에 있는 안마시술소·안마원(의료유사업) 인허가 업소를 한 곳씩 담은 건별 원장으로, 업소명·인허가일·폐업일·영업상태·지번/도로명 주소·전화번호·중부원점TM 좌표·업태·면적·종업원 수를 담는다. 주민이나 상권 분석가가 '동작구에서 지금 영업 중인 안마원은 어디이고 언제 문을 열거나 닫았나'를 확인하거나 점포 이력을 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 원천인 LOCALDATA 인허가 자료와 함께 본다.
description_portal: '동작구의 안마시술소, 안마원 등 안마를 목적으로 운영하는 업소정보를 제공합니다.서울특별시 동작구 안마원 데이터에는 동작구에 위치한 안마원(의료유사업)의 업소 이름, 신고일자, 도로명주소, 전화번호 등이 기재되어있습니다.영업상태, 전화번호, 우편번호, 주소(지번, 도로명), 사업장명, 좌표정보, 업태구분명, 총면적, 종업원수 등의 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
