description_portal: 제주에너지공사는 투명하고 책임 있는 예산 집행을 위해 연 4회, 분기별로 기관 업무추진비 집행 내역을 공개하고 있습니다. 업무추진비는 유관기관 관계자와의 협의, 직원 및 이사회 격려, 간담회 진행 등을 위한 물품 구매와 식비 등으로 사용됩니다. 집행 목적별 금액과 총합을 함께 공개하며, 월별 집행 내역은 공사 홈페이지(www.jejuenergy.or.kr) 내 사전정보공표 게시판에서 확인하실 수 있습니다. 또한 클린아이(통합경영공시)시스템(www.cleaneye.go.kr)에서도 조회가 가능합니다.
