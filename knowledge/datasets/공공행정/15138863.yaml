summary_user: 지방자치단체별로 기관운영·시책추진 업무추진비의 결산액과 기준액, 기준액 대비 절감률을 회계연도 단위로 담은 전국 집계 데이터이며, 포털 설명상 2015 회계연도부터 제공된다. 주민이나 분석가가 '우리 시·구는 업무추진비를 기준액보다 얼마나 아껴 썼나'를 확인하거나 자치단체 간 절감 정도를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 자치단체 코드(laf_cd)·자치단체명·회계연도를 기준으로 다른 지방재정365 공시 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 지방자치단체 업무추진비는 지방자치단체장이 정책을 추진하거나, 공무원이 직무를 수행하는 과정에서 발생하는 공적인 업무활동을 원활하게 수행하기 위해 사용되는 예산입니다. 업무추진비 절감률 정보는 자치단체 업무추진비 중 기관운영업무추진비(203-01), 시책추진업무추진비(203-03) 예산과목을 대상으로 자치단체별 기준금액 대비 절감정도를 측정한 정보입니다.2015 회계연도부터 정보가 제공되고 있으며, 세부항목으로는업무추진비결산액계, 기관운영업무추진비결산액, 시책추진업무추진비결산액, 업무추진비기준액계 등 정보가 제공됩니다.
