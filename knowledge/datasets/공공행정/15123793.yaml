description_portal: 법제처에서 제공하는 일상용어 데이터는 법령과 정책 문서에서 사용하는 어려운 전문 용어를 국민이 이해하기 쉬운 표현으로 대체하거나 설명한 표준 용어집입니다. 각 용어는 법적 의미를 정확하게 전달하면서도 문장의 가독성을 높이기 위해 평이한 어휘로 재정의되어 있습니다. 정의 대상에는 행정·법률·정책 관련 용어가 포함되며, 그 의미와 사용 맥락을 함께 제공하여 실제 문서 작성 시 혼동을 줄일 수 있도록 구성되어 있습니다. 이를 통해 법률 문서와 행정 안내서의 대국민 소통 효율성을 제고하며, 전문 용어로 인한 이해 장벽 해소에 기여합니다. 해당 자료는 법조계, 행정 실무자, 일반 국민이 모두 일상 언어와 법률 언어 간의 격차를 줄이는 데 활용할 수 있습니다.
