description_portal: '- 전라남도 직접 일자리사업(재정지원) 일모아시스템 등록 현황으로  시군별 등록현황(국비 제외, 도비-시군비) 자체 사업 지원현황입니다.- 전라남도는 도민의 고용안정과 지역경제 활성화를 위해 다양한 직접일자리사업을 운영하고 있습니다. 이러한 사업은 주로 취약계층의 일자리 창출, 지역공공서비스 제공, 사회적 가치 실현 등을 목표로 하며, 매년 사업계획과 참여자 모집 공고를 통해 진행됩니다.- 전라남도는 매년 초 각 시군별로 직접일자리사업의 세부 계획을 수립하고, 이를 바탕으로 참여자 모집을 진행합니다. 모집 공고는 전라남도청 홈페이지 및 각 시군청 홈페이지를 통해 확인할 수 있으며, 지원 자격, 사업 내용, 근무 조건 등 상세한 정보가 안내됩니다.'
