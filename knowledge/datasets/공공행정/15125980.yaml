summary_user: 국회입법조사처가 펴낸 연차보고서의 간행물 목록을 담으며, 책 이름(BOOKNM)·PDF 파일명과 내려받기 주소·뷰어 주소·등록일 등 보고서 한 권 단위의 메타데이터로 구성된 전국 범위의 비공간 데이터다. 입법·정책 연구자나 국민이 "입법조사처가 해마다 어떤 활동을 했는지 연도별 연차보고서 원문을 바로 열어보고 싶다"는 질문에 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 다른 국회 간행물·의정활동 데이터와는 보고서 이름이나 같은 기관 기준으로만 맞춰 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
