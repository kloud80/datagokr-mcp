summary_user: 발주기관이 나라장터에 등록한 공사·물품·용역·외자의 분기별 발주계획을 사업 건별로 담으며, 사업명·발주월·조달방식·계약방법·발주금액·담당부서 연락처 등이 들어 있다(검증 호출 기준 API 전체 814건, 전국, 2015-01-26~2026-09-29). 조달 참여를 준비하는 사업자가 '올해 어느 기관이 어떤 공사·물품을 언제 얼마 규모로 발주할 예정인가'를 미리 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 발주기관코드(orderInsttCd)·세부품명번호 같은 코드표나 기관명·사업명 매핑으로만 사전규격·입찰공고·계약 데이터와 이어 쓴다.
limits: 발주계획이 없어도 사전규격 공개나 입찰공고·계약이 이뤄질 수 있어, 이 데이터만으로 실제 발주 전체를 파악할 수 없다. 최신 행 날짜는 검증 호출 조건(발주년월 2026년 10~12월)에 따른 값이라 데이터 최신성과 다를 수 있고, 개발계정은 일 1,000회로 호출이 제한된다.
