summary_user: 경기통계시스템에서 추출한 통계 수치 자료의 메타 정보를 항목(표항목인식번호) 단위로 담으며, 각 행에 소속 통계표 아이디·수록 주기·수록시점·조직번호·공표구분·최종변경일자가 붙는다. 경기도 통계를 다루는 분석가가 어떤 통계표의 수치가 언제 시점까지 수록되고 공표 상태가 어떤지, 최근 언제 바뀌었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 시스템의 통계표 아이디(tbl_id)나 기간정보(주기구분 이름) 같은 경기통계시스템 내부 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: '이 데이터는 경기도 경기통계시스템에서 제공하는 추출된 통계 수치 자료의 메타 정보로, 표항목인식번호, 주기구분, 수록시점, 조직번호, 테이블아이디, 공표구분, 최종변경일자 등의 항목을 포함합니다. 표항목인식번호는 수치 자료의 항목을 구분하기 위한 고유 식별자이며, 테이블아이디는 해당 수치가 속한 통계표를 식별합니다. 수록시점은 해당 수치가 기록된 시점을 의미하고, 주기구분은 데이터 수록 주기를 나타냅니다(Y: 연간). 이 데이터는 통계 수치의 추출 이력 및 통계표 간의 연계 구조 분석, 수치자료의 공표상태 및 최신 변경사항 추적에 활용될 수 있으며, 통계자료 품질관리를 위한 기초자료로도 중요합니다.※주기구분에 해당하는 주기명은 "경기도 경기통계시스템 기간정보"를 참고해 주시기 바랍니다.'
