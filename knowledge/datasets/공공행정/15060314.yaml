description_portal: 한국토지주택공사에서 관리중인 정보공개 청구 및 처리현황(방법별 공개여부 결정기간별 기타청구처리 건수), 청구방법별 현황, 결정기간별 현황등 정보공개 관련 정보를 제공합니다. 정보공개는 국가기관·지방자치단체 등 공공기관이 업무 수행 중 생산·접수하여 보유· 관리하는 정보를 국민에게 공개함으로써, 국민의 알권리를 보장하고 더 많은 정보를 바탕으로 국정운영에 대한 참여를 유도하기 위한 제도입니다. 매년 12월 총무처에서 이를 갱신하여 공표하고 있으며 19년부터 관련 자료를 공표하고 있습니다. 첨부파일란을 통해 비공개 사유별 현황에 대해 알 수 있습니다.
