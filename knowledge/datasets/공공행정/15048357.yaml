description_portal: 한국동서발전의 연도별 기록물 폐기 현황 정보는 공공기관의 문서 및 기록물 관리 실태를 파악할 수 있도록 구성된 데이터입니다.이 데이터는 생산부서, 생산연도, 종료연도, 기록물철 제목, 보존기간(년) 등의 항목으로 구성되어 있으며, 각 기록물이 언제, 어떤 부서에서 생산되었고, 얼마나 보존된 후 폐기되었는지를 확인할 수 있습니다.기록물은 일정 기간이 지난 후 법적·행정적 기준에 따라 폐기되며, 이 데이터는 문서의 수명주기와 문서관리 정책의 실질적 운영 수준을 보여줍니다.학계 및 연구기관에서는 이 데이터를 활용하여 공공기관의 기록물 관리 체계 분석, 부서별 기록 생산 및 보존 경향 분석, 기록물 보존기간의 적정성 평가 등을 수행할 수 있습니다.또한 정부 및 공공기관의 행정 투명성, 기록물의 조직적 관리 수준, 폐기 기준 일관성 등에 대한 연구와 더불어, 디지털 기록관리 시스템의 필요성과 기록물 보존 전략 수립을 위한 실증 자료로도 활용될 수 있습니다.이 데이터는 정보공개 제도, 행정 책임성 강화, 디지털 전환 시대의 기록물 관리 고도화 연구에도 기초 자료가 됩니다.
