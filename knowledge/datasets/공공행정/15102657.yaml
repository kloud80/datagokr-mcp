summary_user: 한국가스공사가 천연가스 거래 계량을 위해 운영하는 계량설비를 지역본부·관리소·수요처별로 정리한 현황 파일로, 유량계 종류·크기와 유량컴퓨터·가스분석기·온도·압력·차압 계측기 제작사를 담는다(전국 범위, CSV 약 58KB). 에너지 분석가나 발전사·도시가스사 담당자가 "어느 관리소의 수요처에 어떤 유량계와 분석기가 설치돼 있나" 같은 계량 인프라 구성 질문에 쓴다. 관리소(kogas_supply_station)가 실측 조인 키로, 한국가스공사의 다른 관리소 단위 공급 데이터와 이어 쓴다.
description_portal: 한국가스공사에서 천연가스의 공정한 상거래를 위해 운영 중인 계량설비 현황 데이터 입니다.계량설비는 가스 거래량을 정확하게 측정하여 발전사 및 도시가스사와의 공정한 거래를 보장하는 핵심 설비로서, 투명한 상거래 기반 구축에 필수적입니다. 본 데이터는 계량설비 운영 현황 공개 및 거래 투명성 확보를 위해 수집 관리되고 있습니다. 데이터의 세부 항목으로는 부피를 측정하는 유량계 현황, 압력 및 온도 측정용 계측기 현황, 열량 단위(GJ) 거래를 위한 가스성분 분석기 현황 등이 포함되어 있습니다. 본 데이터를 활용하면 계량설비 운영 현황 파악, 계량 인프라 적정성 평가, 설비 도입 및 교체 계획 수립, 발전사·도시가스사와의 거래 투명성 제고에 기초자료로 활용할 수 있어 천연가스 공정 거래 기반 강화와 고객 신뢰 향상에 기여할 것으로 기대됩니다.
