summary_user: 경기도 부천시 관내 시설물(도로·다리·공원 등)의 영조물배상공제 가입 내역을 시설물 한 건씩 담은 파일 데이터로, 회원명·시설물명·업종 등이 들어 있다. 시민이나 분석가가 특정 공공시설에서 사고가 났을 때 그 시설이 배상공제에 등록돼 있는지, 어느 회원(관리 주체) 소관인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설물명 같은 이름 매핑이나 같은 기관(부천시) 기준으로만 이어 쓴다.
description_portal: 영조물배상공제 등록내역 데이터는 지방자치단체 또는 공공기관이 관리하는 각종 영조물(도로, 다리, 공원 등)에 대해 발생할 수 있는 사고나 피해에 대비하여 공제에 가입한 내역을 기록한 자료입니다.해당 데이터는 경기도 부천시 관내 시설물 영조물배상공제 등록 내역으로 등록번호, 등록행번, 회원명, 시설물명, 업종, 도로명 주소 등에 대한 정보를 제공합니다.이를 통해 특정 영조물에 대한 책임소재 파악과 피해 발생 시 신속한 보상 처리가 가능하도록 지원하며, 공공시설물의 안전성과 관리 실태를 간접적으로 확인할 수 있는 기초 자료로도 활용됩니다.
