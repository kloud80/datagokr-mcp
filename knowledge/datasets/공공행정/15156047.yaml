description_portal: “협상에 의한 계약 정보 데이터는 광주광역시 동구에서 추진한 각종 용역·사업에 대해 협상 방식으로 진행된 계약의 주요 정보를 공개하기 위해 정제된 공공데이터입니다. 본 데이터는 계약명, 계약부서, 계약방법, 평가일 등 계약 과정의 핵심 절차를 중심으로 구성되며, 평가위원 수와 평가업체 수 등 협상 평가 관련 기본적인 정량 정보를 포함하고 있습니다. 이 데이터는 협상계약의 절차적 흐름을 이해하고, 사업 추진 현황을 분석하며, 행정의 공정성과 효율성을 높이기 위한 기초자료로 활용될 수 있습니다. 또한 주민·연구자·민간 서비스 제공자 등 다양한 이용자가 공공 구매·예산 집행의 투명성을 파악하는 데 도움이 되는 정보로 제공됩니다.”
