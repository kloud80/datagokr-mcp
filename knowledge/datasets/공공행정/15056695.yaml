status: active
summary_user: 전국 지방공기업의 예산결산을 연도·기관별로 담은 경영공시 자료로, 사업예산 수입(영업수익·이자수익·타회계전입금 등)과 지출(인건비·이자비용 등), 자본예산 수입(자산매각·고정부채차입·잉여금·출연금)과 지출(유형·무형자산, 고정부채상환), 이월재원·이월지출을 담는다. 분석가나 주민이 '우리 지역 공사·공단의 인건비와 이자비용이 해마다 어떻게 변했나', '부채 차입과 상환 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 경영공시 자료와는 연도(AC_YEAR)와 기관명(ENT_NAME)을 맞춰 이어 쓴다.
limits: 기관 코드 같은 공통 조인 키가 없어 다른 데이터와 연결할 때 기관명 표기 차이를 직접 맞춰야 한다. 행정단위가 전국·비공간이라 시군구 단위 공간 분석에는 바로 쓰기 어렵다. 개발계정은 하루 10,000회로 호출이 제한된다.
