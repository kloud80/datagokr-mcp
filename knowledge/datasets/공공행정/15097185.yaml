description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 근무하는 직·간접 감정노동자를 대상으로 실시된 월간 설문조사 결과를 기반으로 구성된 자료입니다. 감정노동자의 심리적, 정서적 상태 및 업무 환경에서의 스트레스 수준을 정기적으로 파악하기 위한 목적으로 설계되었으며, 주요 항목은 아이디, 응답 월을 포함하고, 이후에는 감정 및 스트레스 관련 다양한 문항들이 포함됩니다. 설문 문항은 "예상치 못했던 일 때문에 당황했던 적이 얼마나 있었습니까", "인생에서 중요한 일들을 조절할 수 없다는 느낌을 얼마나 경험하였습니까", "업무에 지쳐 고갈되고 있다고 느낀다", "내가 하는 일은 감정적으로 힘이 든다", "업무 중 타인과의 관계가 피로감을 준다" 등 40개 이상의 문항으로 구성되어 있으며, 대부분 4점 또는 5점 리커트 척도 방식으로 응답하게 되어 있습니다. 이 데이터를 통해 월별 감정노동자의 스트레스 변화 추이, 번아웃 경험 여부, 자율성 인식, 정서적 고갈 수준 등을 분석할 수 있으며, 조직 차원의 정신건강 관리, 감정노동 보호제도 설계, 맞춤형 복지 프로그램 운영 등 실질적인 정책 수립과 조직 내 건강한 근로환경 조성에 활용 가능한 정량 기반의 기초자료로 기능합니다.
