summary_user: SGIS 주제도에 쓰이는 소지역 통계 중 2024년 행정구역 단위 통계와 2025년 기준 행정구역 경계를 csv·shp 파일로 묶은 자료로, 기준연도·행정구역코드·통계항목·통계값의 세로형 구조이며 전국 235,585행이 확인됐다. 분석가나 지자체 담당자가 "우리 시군구·읍면동의 인구·가구·사업체 같은 통계를 경계와 붙여 지도로 그리면 어떤 분포가 나오나" 같은 질문에 쓴다. 전역 조인 키는 확인되지 않아, 같은 묶음의 경계 파일이나 다른 SGIS 자료와는 같은 기관의 행정구역코드(행정구역코드)로, 그 밖의 데이터와는 지역명·코드 매핑을 거쳐 잇는다.
limits: 집계구·격자 단위나 2000~2024년 시계열 통계, 도시화지역·기초단위구 같은 분석용 경계는 이 파일에 없고 SGIS 포털에서 따로 신청해야 한다. 행정구역코드는 SGIS 체계라 다른 기관 코드와 바로 맞지 않을 수 있으니 참고자료 폴더의 코드집을 함께 봐야 하며, 파일은 약 269MB zip이다.
