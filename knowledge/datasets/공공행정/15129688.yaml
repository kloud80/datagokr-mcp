description_portal: · 통계지리정보서비스(SGIS)의 다양한 주제도를 만드는 데에 사용되는 소지역 통계 중 2024년 행정구역 통계와 2025년 기준 경계를 파일형태로 이용할 수 있습니다.· 본 자료는 csv, shp 파일 등을 포함하고 있으며 자료 이용 시 참고자료 폴더 내 코드집, 자료 이용안내 등을 참고하여 이용하시기 바랍니다.※ 행정구역보다 작은 집계구, 격자 단위의 시계열(2000~2024년) 통계와 경계, 도시화지역, 기초단위구 등 분석용 경계는 SGIS 포털(https://sgis.mods.go.kr) → 자료제공 메뉴에서 신청하시면 이용할 수 있습니다.
