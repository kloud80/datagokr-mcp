description_portal: '전주시가 시민의 예식 수요를 지원하기 위해 개방·운영하는 공공예식장 현황 정보를 제공하는 데이터입니다.본 데이터는 전주시 관내 공공예식장의 시설명, 수용 가능 인원, 대관료, 시설유형, 대관 가능 요일 및 피로연 이용정보 등을 포함하고 있으며, 예비부부가 합리적인 비용으로 예식을 진행할 수 있도록 시설 선택 및 이용계획 수립에 활용할 수 있습니다.또한 공공시설의 개방 확대와 건전한 결혼문화 조성을 지원하고, 시민의 공공서비스 접근성 향상을 목적으로 구축된 데이터입니다.제공부서 : 인구정책과(063-281-8434)'
