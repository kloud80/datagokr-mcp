summary_user: 공정위가 지정한 대규모기업집단에 속한 소속회사를 회사 단위로 담는 API로, 기업명·대표자·설립일·집단편입일·업종·상시종업원수를 제공하며 검증 시 전국 59건이 수신됐다. 투자자·언론·분석가가 특정 기업집단에 어떤 계열사가 편입돼 있고 언제 편입됐는지 확인하는 질문에 쓴다. 법인등록번호(jurirno)와 사업자등록번호(bizrno)를 키로 같은 번호 체계를 쓰는 다른 공정위 등록·지정·공시 데이터(가맹사업, 특수판매, 상조)와 이어 쓴다.
description_portal: '대규모기업집단 지정년월과 기업집단코드, 법인등록번호를 기준으로 기업집단에 속한 소속회사의 기업집단명, 소속회사명, 대표자명, 기업설립일, 집단편입일, 업종명, 업종코드 등 지정 기업집단 소속회사의 개요 정보를 조회하는 서비스※ 당해년도 정보 제공 시기 : 당해년도 5월 1일 기준※ 지정된 기업집단의 자료를 제출받아(2월 중 ~ 4월 중) 검토 시기를 거쳐 보도 자료 공개와 함께 당해 5월 1일에 정보 제공※ 요청년월(공개년월 또는 지정년월) : [사용 가능한 공개년월 조회 서비스(publicYmList)] API 를 활용하여 이 서비스(API)를 이용하기 전에 사용 가능한 년월을 확인 후 이용하시기 바랍니다.'
