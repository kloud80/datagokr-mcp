description_portal: 1. "기능분류"란 중앙행정기관(대통령 및 국무총리 소속기관을 포함하며, 이하 "행정기관"이라 한다)의 업무 및 그와 관련된 정보를 체계적으로 관리·활용하기 위하여 행정기관의 업무를 기능 중심으로 분류하는 것을 말한다.2. "기능별 분류체계"란 행정기관이 상시적으로 수행하는 업무를 정책분야·정책영역·대기능·중기능·소기능 및 단위과제 등 그 기능의 수준에 따라 분류한 체계를 말한다.3. "목적별 분류체계"란 행정기관이 정책목적을 달성하기 위하여 그 기관의 업무를 임무·정책목표·성과목표 및 관리과제 등 그 정책의 수준에 따라 분류한 체계를 말한다.4. 목적별 분류는 국무조정실에서 상하반기로 작성되며 데이터는 연1회 작성예정입니다.
legal_basis_portal: 정부기능의 분류 및 관리에 관한 규정 [시행 2008. 1. 28.] [대통령훈령 제209호, 2008. 1. 28., 제정]제8조 (정부기능분류시스템의 구축·운영) ① 행정자치부장관은 행정기관이 기능분류업무를 전자적으로 처리할 수 있도록 지원하고, 연계정보 등의 공동 활용을 확대하기 위한 정보화시스템(이하 `정부기능분류시스템`이라 한다)를 구축·운영하여야 한다. 다만, 행정기관의 장은 해당 기관의 업무 특성 등을 감안하여 필요한 경우에는 행정자치부장관과 협의하여 별도의 정부기능분류시스템을 구축·운영할 수 있다.
