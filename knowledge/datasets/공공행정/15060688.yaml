description_portal: 이 통계 데이터는 당해년도 1월 1일부터 12월 31일까지 행정부 국가공무원의 신규임용 현황을 직급별로 산출한 인사통계 자료입니다. 신규임용은 공개채용과 경력채용으로 구분되며, 경력채용은 1호부터 13까지 분류됩니다. 예를 들면 1호(퇴직자재임용), 2호(자격증소지자), 3호(연구근무경력자), 5호(1급임용), 8호(외국어능통자), 10호(과학기술등 석박사학위소지자) 등 입니다.해당 통계자료는 일반직공무원 신규임용, 특정직공무원 신규임용, 별정직공무원 신규임용으로 구성되어 있으며, 각 통계표는 계급별/성별로 나타나 있습니다.
