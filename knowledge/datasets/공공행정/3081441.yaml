description_portal: 이 데이터는 전북특별자치도 내 국토의 연도별 용도지역별 분포 현황을 나타냅니다. 도시지역, 관리지역, 농림지역, 자연환경보전지역의 면적(㎢)과 해당 면적이 전체 면적에서 차지하는 비율(%)을 2012년부터 2016년까지 연도별로 정리하고 있습니다. 이를 통해 도내 각 용도지역의 변화 추이를 파악할 수 있으며, 도시화 진행, 농림지 보전 상태, 환경보호지역 변화 등의 공간적 특성을 시계열로 분석하는 데 유용합니다. 특히 도시지역은 상대적으로 안정적인 면적을 보이며, 농림지역은 점차 증가하는 경향을 보이고 있습니다. 해당 데이터는 국토계획, 도시개발, 환경보전 정책 수립에 참고자료로 활용될 수 있습니다.
