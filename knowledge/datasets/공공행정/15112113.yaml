description_portal: 서울특별시 용산구  전동킥보드 주차 구역 현황 데이터로 행정동, 설치장소, 상세주소, 설치 형태, 준공일자, 데이터 기준일의 정보를 제공합니다. 전동킥보드를 무단 방치하거나 전동킥보드를 아무렇게나 주차하는데 따른 보행자의 불편이 증가하고,  이에 따라 구민의 안전을 확보하기 위해서 "전동킥보드 전용 주차구역"을 마련하였습니다. 도로 위 보행 안전을 위해 개인형 이동장치는 지정된 구역에 주차하여 주시기 바랍니다. 만약 개인형이동장치 주차장 표시가 없다면, 통행 및 안전에 위해요소가 되지 않도록 가로수, 벤치, 가로등, 전봇대, 환풍구 등 주요 구조물 옆 또는 자전거 거치대 주변에 주차할 수 있습니다. 교통약자 통행에 위협, 사고발생 우려가 큰 차도, 지하철역 입구, 횡단보도, 버스 정류장, 점자블록 구역에서는 견인업체 발견 시 견인 조치될 수 있습니다. 이외에 전동킥보드의 주차가 금지되는 장소 확인은 도로교통법 제33조를 통해 확인하실 수 있으며, 주차 금지에 관한 사항을 위반한 운전자에게는 도로교통법 시행령 별표8 제29호에 따라 범칙금이 부과됩니다.
