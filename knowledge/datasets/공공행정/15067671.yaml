description_portal: '「물가안정에 관한 법률」제3조(가격의 표시) 및「소비자기본법」 제13조(소비자에의 정보제공)부산광역시 연제구 착한가격 업소 현황입니다.※ 착한가격업소: 정부와 지방자치단체가 지정한 물가안정 모범업소착한가격업소의 확대를 통해 소비자물가 안정에 기여하며 개인 서비스 업소의 매출 증대를 통해 서민경제 살리기에 기여하고 있습니다.2011년부터 물가안정을 위해 전국에서 저렴한 가격과 위생적인 서비스를 제공하는 업소를 착한가격업소로 지정하고 있으며, 2025년 11월  7일 기준 연제구에는 53개의 업소(외식업, 이미용업, 세탁업 등)를 착한가격업소로 지정하여 지원하고 있습니다.'
