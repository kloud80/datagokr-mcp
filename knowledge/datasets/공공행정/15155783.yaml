description_portal: 이 데이터는 한전KDN 외부 홈페이지에 게시된 보도자료 정보를 수집하여 정제한 목록형 데이터입니다. 각 게시물의 작성순번, 제목, 내용 요약, 작성일, 작성자, 조회수 항목을 기준으로 구조화했으며, 홈페이지 내 흩어져 제공되던 보도자료를 분석과 검색에 용이하도록 표준 CSV 형태로 재구성했습니다. 수집된 자료는 ESG 자문단 활동, ICT 기반 사업 협약, 국제전시회 참가, 혁신 활동 등 다양한 기관 주요 활동을 포함하며, 각 보도자료의 핵심 내용을 빠르게 파악할 수 있도록 텍스트 정제와 날짜 형식 통일 과정을 거쳤습니다. 이 데이터는 기관 홍보 흐름 분석, 정책·사업 동향 파악, 연구·보도 활용 등 다양한 분야에서 참고 자료로 활용할 수 있습니다.
