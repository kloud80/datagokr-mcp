summary_user: 대구 수성구 관내 행정기관(구청·동 행정복지센터 등)을 기관 한 곳당 한 행으로 정리한 소형 파일(csv 1,515바이트)로, 구분·주소·연락처를 담는다. 수성구 주민이 '우리 동네 행정복지센터가 어디 있고 전화번호가 무엇인가'를 확인하거나, 위치 기반 안내 서비스에 구 단위 행정기관 목록을 넣을 때 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 데이터와는 주소 문자열이나 기관명을 맞춰 연결해야 한다.
description_portal: 본 데이터는 대구광역시 수성구 관내에 설치된 공공 행정기관의 현황을 정리한 자료로, 수성구청 및 동 행정복지센터를 포함한 행정 서비스 제공 기관의 기관명, 소재지 주소, 연락처(전화번호), 업무 담당 부서, 운영시간, 기관 유형(본청, 주민센터 등) 등의 정보를 포함한다. 본 자료는 주민이 가까운 행정기관에 대한 정보를 손쉽게 확인할 수 있도록 구성되어 있으며, 민원 행정, 주민등록, 복지 상담, 각종 인허가 신청 등 행정서비스 접근성 향상에 기여한다. 수성구청은 주민 생활과 밀접한 행정기관의 정보를 정확하게 전달하기 위해 정기적으로 데이터를 갱신하며, 본 정보는 행정 인프라 현황 분석, 주민 서비스 계획 수립, 기관별 민원 통계 분석, 위치 기반 안내 서비스 개발 등에 활용 가능하다. 공공기관 이용 편의 증진과 정보 개방 투명성 확보를 위한 기초 자료로서의 활용 가치가 높다.
