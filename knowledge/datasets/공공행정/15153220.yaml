description_portal: '한국가스안전공사의 부서조직운영 현황정보를 제공합니다.한국가스안전공사는 국민의 가스 사고 등 위해를 방지하고 가스안전 기술 개발 및 산업 증진을 위해 설립된 산업통상부 산하 준정부기관입니다.조직 운영은 현재 본사 4실13처1센터, 2개 부설기관(가스안전교육원, 가스안전연구원), 29개 지역본부 및 지사가 운영되고 있습니다.해당 목록은 행정업무 지원 등 참고용 자료로 활용할 수 있습니다.※ 부서조직은 수시로 변동될 수 있으며 자세한 내용은 공사 홈페이지(www.kgs.or.kr)을 참고 바랍니다.※ 데이터기준일 : 2025년 11월 20일'
