description_portal: 국민권익위원회 고충처리국의 민원조사과는 행정안전, 교육, 국방, 보훈, 경찰, 주택, 수자원, 도로, 교통 등 다양한 분야에서 발생하는 고충민원을 조사하고 처리하는 역할을 수행합니다. 이 부서는 국민의 권익을 보호하고 행정의 투명성을 높이기 위해 민원에 대한 실태조사, 원인 분석, 개선 방안 제시 등의 업무를 담당합니다. 각 분야별 전문성을 바탕으로 민원의 성격과 복잡성에 따라 맞춤형 대응을 제공하며, 이를 통해 국민의 불편을 해소하고 행정 서비스의 질을 향상시키는 데 기여하고 있습니다.​해당 자료는 고충민원 관련하여 담당자를 찾는데 활용 할 수  있습니다.
