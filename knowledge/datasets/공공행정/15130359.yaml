description_portal: '[SGIS 오픈 플랫폼] "My통계로" 서비스의 카탈로그 목록조회 화면에 사용자가 선택한 "추천 키워드" 정보입니다.키워드정보, 통계자료명, 메뉴명, 사용일시 데이터를 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  인구주택 및 사업체 센서스 데이터에 지리학적 공간(geographic space/geospace) 속성, 즉 위치값(경위도나 주소 등), 경계, 지도 등을 부가한 센서스 공간데이터(census spatial data)를 기반으로 합리적 의사결정을 지원하는 유용한 정보를 생성하기 위한 정보시스템, 혹은 그 서비스3. My통계로  개인의 관심 주제에 맞는 공간통계정보를 제공하는 서비스'
