description_portal: 경상남도 거제시에 거주하는 외국인의 국적별·성별 등록현황을 나타낸 자료입니다. 주요 국가로는 일본, 미국, 중국, 영국, 필리핀, 베트남, 인도, 우즈베키스탄 등이 포함되어 있습니다. 각 국적별로 남성과 여성의 인원 수를 구분하여 등록하여 성별 분포도 파악이 가능합니다.지역 내 다문화 구성과 외국인 인구 추세를 분석하는 데 활용할 수 있습니다. ‘기타’ 항목을 통해 특정 국가 외 국적 보유자에 대한 정보도 포함하고 있습니다.거제시의 외국인 인구 정책 수립, 문화교류 계획 등에 참고할 수 있는 기초 자료입니다. 데이터는 CSV 또는 엑셀 형식으로 제공되며, 누구나 자유롭게 활용 가능합니다.
