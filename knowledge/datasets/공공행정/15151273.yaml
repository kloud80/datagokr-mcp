description_portal: ○ 시설공사 원가계산에 사용하는 자료를 목록화하고, 개방형 설계내역서 자료 호환 양식인 공사원가호환규정을 수립하여, 공사원가계산을 웹에서 처리할 수 있는 시스템을 개발○ 조달청 공사원가통합관리시스템(https://npccs.g2b.go.kr)에서 제공하는  표준공사코드의 세부항목을 제공하는 서비스○ 공사원가 산정업무의 효율성과 가격의 객관성을 확보하기 위해 ‘표준공사코드’ 체계를 운영 중○ 시설자재, 노무비, 기계경비, 세부공종 등에 대해 수요기관이 공사내역 작성 시 활용할 수 있도록 표준공사코드를 제공○ 세부공종의 공사구분, 세부공종코드, 품명, 규격, 단위, 설명을 조회
