description_portal: '전북특별자치도 부안군에서 생산하는 본 데이터는 지방세법 및 관련 법령에 근거하여 지방세 납세 편의 제고와 세입 행정의 효율성을 도모하기 위해 구축된 납부 매체별 지방세 납부 현황 자료이다. 해당 자료는 표준지방세정보시스템을 통해 매년 12월 31일 기준으로 자동 수집·정리되며, 부안군 내 주민 및 사업자 등이 납부한 지방세의 납부 방식별 통계를 세부적으로 제공한다.수집 대상은 부안군 관내에서 납세의무가 발생한 지방세로, 주민세, 자동차세, 재산세, 지방소득세, 지역자원시설세 등을 포함하며, 이를 신용카드, 가상계좌, 인터넷지로, CD/ATM, 자동이체 등 다양한 매체를 통해 납부한 이력과 금액을 집계한다. 수집 과정은 지방세정보시스템과 금융결제망, 전자납부시스템 등 연계 시스템을 통해 자동화된 방식으로 이뤄지며, 납부 매체별 건수 및 금액을 기준으로 연간 집계가 완료된다. 이를 통해 부안군은 납부 수단별 이용 현황, 비율, 추세 등을 종합적으로 분석할 수 있다.데이터의 주요 항목은 시도명, 시군구명, 자치단체코드, 과세년도, 납부매체명, 납부건수, 납부금액 등으로 구성되며, 항목 간 비교 및 시계열 분석이 용이하도록 구조화되어 있다. 각 항목은 전산 상 검증 절차를 거쳐 정확성과 신뢰성이 확보되며, 세입 구조를 분석하는 데 필수적인 지표로 활용된다. 특히 납부매체명은 납부 방식(예: 신용카드, 현금, 인터넷뱅킹 등)을 구체적으로 분류함으로써 주민들의 이용 행태를 파악하고, 이에 따른 행정 대응을 수립하는 데 기초자료로 활용된다.본 데이터는 자치단체 내부적으로는 세입관리의 효율성 제고, 납세편의 개선 방안 마련, 재정계획 수립 등의 정책 자료로 활용되며, 외부적으로는 공공기관, 민간 연구기관, 학계 등에서 세금 납부 행태 분석, 지역 간 비교연구, 전자납부 확대 효과 검토 등 다양한 목적으로 활용 가능하다. 또한 납부매체 이용 추이를 기반으로 납세자 맞춤형 서비스 확대 및 납세 홍보 정책 수립에도 유용하다.'
