description_portal: 통계청_KOSIS 복합통계표 정보는 국가통계포털(KOSIS)에서 제공하는 다양한 통계지표를 이용자가 원하는 조건에 따라 복합적으로 구성할 수 있도록 설계된 통계표에 대한 정보를 담고 있는 파일데이터다.복합통계표란 여러 개의 통계 항목을 하나의 화면에서 비교·분석할 수 있도록 사용자 맞춤형으로 구성한 통계표를 말한다.사용자는 시점, 지역, 성별, 연령 등 다양한 분류기준을 선택해 자신에게 필요한 통계를 조합할 수 있다.해당 데이터는 이러한 복합통계표에 포함된 항목, 분류 조건, 분류 코드, 표의 명칭 등을 구조화하여 제공하며, 공공기관이나 연구자, 일반 국민이 복합적인 통계 분석을 손쉽게 수행할 수 있도록 돕는다.*통계표아이디는 파일데이터(통계청_통계표 정보), 기관코드는 파일데이터(통계청_KOSIS 기관정보) 참조
