description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)의 2017년도 정보화사업 추진 현황을 정리한 자료로, 구분, 사업명, 담당부서, 사업연도 등의 항목으로 구성되어 있습니다. 총 8개 부서가 참여했으며, 해당 부서는 정보관리실, 영업처, 홍보협력실, 첨단산업처, 인사총무실, 항공우주박물관처, 면세기획처, 재무회계실로 구성되어 있습니다. 주요 사업에는 알툴즈 연간 라이선스 갱신 구매, 홈페이지 운영 및 유지보수 용역, 정보시스템 개발 및 고도화, 소프트웨어 구매, 시스템 구축, 정보보안 진단, 통합관리체계 수립 등 정보기술 기반의 구매, 계약, 용역, 연구, 개발 사업이 포함되어 있으며, 각 사업은 부서별 업무 특성과 필요에 따라 정보화 역량 강화를 목적으로 추진되었습니다. 이 데이터는 연도별 정보화사업의 추진 범위와 내용을 구체적으로 파악할 수 있는 기초 자료로 활용되며, 각 부서의 디지털 인프라 확충 노력, 예산 집행 흐름, 행정 효율성 향상 전략 등을 종합적으로 분석하는 데 유용합니다. 또한 향후 유사 과제 계획 수립, 시스템 개선 방향 설정, 정보화 정책 연계 등을 위한 실무적 참고자료로서 활용될 수 있습니다.
