summary_user: 김천시의회가 처리한 의안을 한 건씩 담은 파일로, 대수·회기·의안번호·의안명·발의자와 소관위원회 및 본회의의 회부·보고·상정·처리일과 처리결과를 기록한다. 주민이나 연구자가 특정 대수 김천시의회에서 어떤 의안이 누구 발의로 올라와 위원회와 본회의에서 어떻게 처리됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지방의회 의안·회의록 데이터와는 의안번호·의안명이나 같은 기관(김천시) 기준으로 이름을 맞춰 연결한다.
description_portal: 김천시의회 의안정보는 김천시의회에서 처리한 의안에 대한 정보를 제공하는 데이터로  처리한 의안의 의안번호, 의안명, 발의자, 의안의 소관 위원회, 위원회에 회부일, 보고일, 상정일, 처리일, 처리결과와 본회의에 해당 의안 보고일, 상정일, 처리일, 처리결과에 대한 정보를 제공합니다.과거 김천시의회와 금릉군의회 통합 전 데이터와 통합(1995. 1. 1.) 후 데이터가 혼재하고, 자료 등록시 오래된 데이터로 정확도가 떨어질 수 있으며, 데이터 미집계로 인해 공란이 다수 존재하오니 이용 시 참고하시기 바랍니다.
