description_portal: '○ 통계개요* 통계명 : 광업 및 제조업(종사자 규모별)* 통계종류 : 서울시 광업 및 제조업 현황을 종사자 규모별로 제공하는 지정ㆍ조사통계* 근거법령 :「광업제조업조사 규칙」(기획재정부령 제57호)* 작성목적 : 광업 및 제조업부문의 사업체 및 종사자 현황과 생산ㆍ출하ㆍ재고액의 추이를파악하여, 산업활동과 관련된 각종 정책의 수립 및 평가, 기업의 경영계획수립 및 학계, 연구소 등의 학술연구를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 사업체 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 광업 및 제조업의 종사자규모별(5인~500인 이상) 사업체수,종사자수, 연간급여액, 출하액, 주요생산비, 부가가치, 유형자산연말잔액 등○ 용어설명* 연간급여액 : 연간급여액의 합계(상여금 등 각종 수당 포함)는 보험료, 근로조합비 등을공제하기 이전의 급여액이며 퇴직금, 복지후생비를 제외한 급여액임* 출하액 : 1년간의 제품출하액, 부산물ㆍ폐품판매액, 임가공(수탁제조) 및 수리수입액의합계를 말하며 이 기간에 발생한 출하, 수탁제조 및 수리수입액에 대한 미수금을 포함하였음* 주요생산비 : 생산에 사용(소비)된 제 비용인 원재료비, 연료비, 전력비, 용수비,외주가공비, 수선비를 말함* 부가가치 : 생산액에서 원재료비, 연료비, 전력비, 용수비, 외주가공비 및 수선비 등주요 중간투입비를 공제한 것을 말함 (국민계정상의 생산인 부가가치는 광업ㆍ제조업통계의 센서스 부가가치와는 다른 방법으로 추계되고 있어 직접 비교에는 한계가 있을수 있음)* 유형자산연말잔액 : 취득원가에서 조사년까지의 감가상각누계액을 뺀 미상각잔액(연초잔액+ 연간증가액 - 연간감소액 ? 연간감가상각비)○ 기 타* 한국표준산업분류(제9차)에 규정된 산업대분류 [B.광업] 및 [C.제조업] 사업체 기준* 사업체가 2개 이하인 경우 그 사업체의 비밀보호를 위해 그 수치대신 X로'
