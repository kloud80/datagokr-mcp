summary_user: 환경표지·우수재활용(GR) 인증을 받은 녹색제품을 제품 한 건씩 담은 원천 목록으로, 상품명·모델명·규격, 대·중·소분류, 인증번호와 인증 시작·종료일·인증상태, 인증기업명·대표자·주소·전화번호가 들어 있고 범위는 전국입니다. 공공기관 구매 담당자가 "이 품목에 현재 인증이 유효한 녹색제품은 무엇이고, 어느 기업에 연락하면 되나"를 확인할 때 쓴다. 검증된 전역 조인 키는 없어서, 조달 식별번호(prodG2sn)나 인증기업의 사업자등록번호, 제품·기업 이름으로 조달·기업 데이터와 직접 맞춰 이어 쓴다.
description_portal: 본 서비스는 기후위기 대응을 위한 탄소중립 실현의 핵심인 녹색제품 통합 정보를 체계적으로 제공합니다. 「기후위기 대응을 위한 탄소중립 · 녹색성장 기본법」 제66조 제4항에 따른 녹색제품은 제조 및 소비 전 과정에서 에너지와 자원의 투입을 효율화하고 온실가스 및 오염물질 발생을 최소화한 제품을 의미합니다.특히 「녹색제품 구매촉진에 관한 법률」 제2조의2(적용범위)에 의거하여 공공기관 의무구매 대상이 되는 환경표지 및 우수재활용(GR) 인증 품목을 집중적으로 다룹니다. 사용자는 개별 인증제품의 공식 명칭과 조달 관리를 위한 고유 식별코드를 한눈에 확인할 수 있으며, 각 제품이 해당하는 구체적인 인증구분 정보를 명확히 파악할 수 있습니다.또한, 원활한 구매 상담과 비즈니스 매칭을 지원하기 위해 해당 제품을 생산하는 인증기업명과 공식 연락처를 함께 안내합니다. 더불어 각 품목이 충족하는 세부 인증규격 데이터를 통합적으로 제공함으로써 공공 및 민간 영역의 녹색 소비 활성화와 지속 가능한 산업 생태계 구축에 기여하고자 합니다.
