description_portal: 본 데이터는 (주)한국가스기술공사의 내부 시스템 메뉴 및 게시판 관리 정보를 기록한 자료입니다. 각 메뉴별로 메뉴코드, 게시판코드, 상위메뉴코드, 메뉴구분, 메뉴속성, 메뉴명, 대체메뉴, 템플릿 적용 여부, 하위메뉴 타입, 링크유형, 정보제공자, 등록일 등 세부 속성이 포함됩니다. 예를 들어 ‘시스템 관리’, ‘사용자 메뉴 관리’, ‘관리자 권한 관리’ 등의 메뉴가 있으며, 상단노출 여부, 세션노출 여부, 모바일 노출 여부, 콘텐츠 대체메뉴 사용여부 등 운영 정책과 UI·UX 관련 설정 값이 명시되어 있습니다. 해당 자료는 내부 포털 및 정보시스템의 메뉴 구조 설계, 접근 권한 부여, 콘텐츠 연결, 모바일 최적화, 시스템 유지보수 계획 수립 등에 활용될 수 있으며, 메뉴 변경 이력 관리와 사용자 접근성 향상에도 기초 데이터로 사용됩니다.
