summary_user: 중앙부처·광역시도·특례시에 등록된 비영리민간단체를 단체 한 곳당 한 행으로 담은 전국 등록 원장으로, 등록기관·등록번호·유형·단체명·대표자·소재지·주된사업·연락처·등록일·주관과를 포함한다. 시민이나 연구자가 '우리 지역에 등록된 환경 분야 비영리민간단체는 어디이고 언제 등록됐나'를 확인하거나, 등록기관별·사업 분야별 단체 분포를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단체명·소재지 주소 같은 이름 매핑이나 등록기관 단위로만 이어 쓴다.
description_portal: 비영리민간단제 지원법 제4조에 따라 중앙부처와 광역시도, 특례시에 등록된 비영리민간단체 등록 현황(분기별 현황)입니다.해당자료는 npas(npas.mois.go.kr) 홈페이지-비영리단체현황-등록단체 조회(중앙부처, 시도)에서 조회 및 내려받기가 가능합니다.행정안전부 홈페이지 - 업무안내-차관보-민간협력-비영리민간단체 지원 게시판에도 게시되는 자료입니다.* 단체명, 등록기관, 대표자, 소재지, 연락처, 등록일 등 단체 정보를 조회 가능*단체목록 및 현황은 수시로 업데이트하여 일치하지 않을 수 있습니다.비영리민간단체 등록현황 자료는"비영리민간단체 공익활동 지원사업 관리정보시스템" (https://npas.mois.go.kr - 비영리단체현황 메뉴)에서도 조회 가능합니다.
