description_portal: '대구광역시 동구 소재 석면조사 건축물 현황 공공데이터입니다. 이 데이터는 건물명, 위치, 건물용도 등의 항목을 포함합니다. 석면이 사용되었을 가능성이 있는 공공건축물 및 다중 이용시설(예: 어린이집, 학교, 병원, 대합실 등)의 안전관리 및 해체·제거 계획 수립에 활용됩니다. 그리고 건물용도 및 분포에 기반한 지역별 석면 관리 우선순위 설정에 도움을 줄 수 있고 교육기관·의료시설 등 석면 노출 위험이 높은 시설 중심으로 주기적 검사 및 해체·제거 일정 관리를 할 수 있습니다. 건물명: 조사 대상 건축물 이름건물주소(도로명): 해당 건축물의 정밀 위치건물용도: 공공청사, 교육, 다중이용시설, 의료, 업무시설 등 다양한 용도 분류'
