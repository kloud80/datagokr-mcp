description_portal: 본 데이터는 경기도 광주시의 인허가 의사결정 지원 시스템 사용을 위한 도로명 코드 정보를 제공합니다. 도로명주소 체계에 따라 부여된 각 도로의 고유 코드와 명칭, 관할 행정구역 정보를 담고 있어 건축 인허가, 개발 사업 승인 등 행정 업무 처리의 기준이 됩니다. 시군구코드와 도로명번호는 각 도로를 고유하게 식별하는 코드이며, 고시일자와 말소일자는 도로명의 지정 및 변경 이력을 나타냅니다.본 데이터는 건축 인허가 심사, 부동산 정보 관리, 주소 정보 시스템 구축, 행정 업무 효율화 등에 활용되며 정확한 위치 기반 의사결정을 지원합니다.
