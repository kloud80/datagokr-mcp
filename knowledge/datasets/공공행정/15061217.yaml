summary_user: 지방공기업 통합경영공시(클린아이)에서 쓰는 시도코드와 시도명의 대응표를 전국 시도 단위로 담은 코드 목록 API이다. 지방공기업 경영공시 데이터를 다루는 분석가나 개발자가 '이 시도명은 클린아이에서 어떤 코드로 조회해야 하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 같은 기관의 지방공기업 경영공시 API들과 시도코드(SIDO_CD) 또는 시도명 매핑으로만 이어 쓴다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 시도코드 정보입니다. 시도코드 목록의 지방공기업의 자료를 OPEN API를 통해 제공하며, 시도명을 조회 시 시도코드를 확인 할 수 있습니다. 17개 모든 시도가 각각의 시도코드를 부여받아 관리되고 있으며, 지방공공기관 경영정보공개시스템 클린아이(www.cleaneye.go.kr)에서 해당 자료의 기관별 시도코드 기준으로 관리되고 있습니다. 지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
