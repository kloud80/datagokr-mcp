summary_user: 전북특별자치도 진안군의회에 제출된 의안을 한 건씩 담은 파일로, 의안번호·제안일·제안자·의안명·처리한 회의·의안 종류·가결/부결 등 처리 결과를 담는다. 진안군의회가 특정 조례안이나 예산안을 언제 누가 제안했고 어느 회기에서 가결·부결했는지 확인하려는 주민·연구자·기자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방의회 의안·회의록 자료와는 의안명·제안일 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 전북 특별자치도 진안군의 의회 의안 정보에 대한 공공데이터 자료입니다. 이번 자료에서는 의안 번호, 제안 일자, 제안자, 의안 명, 처리결과(어느 회의 때 처리했는지 내용), 의안 종류, 의안 처리결과(가결 또는 부결 등 내용) 정보를 제공합니다. 이 정보는 1991년 4월 자료부터 데이터 기준일자까지의 의안 내용을 확인할 수 있습니다. 또 의안 종류와 의안 처리에서 빈 빈칸은 집계되지 않은 데이터라 데이터값이 존재하지 않습니다. 그리고 이 자료는 매년 12월 초 기준으로 데이터를 현행화해서 제공합니다.
