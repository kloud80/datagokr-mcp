summary_user: 공공기관이 국민에게 개방할 수 있는 시설을 시설 한 곳 단위로 담는 API로, 위치(주소·위도·경도), 시설유형, 수용인원, 유료 여부, 예약 가능 여부와 예약 방법, 요일별 이용시간, 담당자 연락처를 함께 제공하며 범위는 전국입니다. 주민이나 단체가 "우리 동네에서 예약해 빌릴 수 있는 무료 공공기관 회의실·강당이 어디 있나"를 찾거나, 분석가가 지역별 개방시설 분포를 파악할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아 행정표준기관코드(pbadmsStdInstCd)·기관명으로 기관 코드 데이터와 잇고, 시도·시군구명이나 좌표로 지역·공간 데이터와 맞춰 쓴다.
description_portal: 공공기관에서 보유하고 있는 각종 시설물에 대한 정보를 체계적으로 제공하는 서비스입니다. 해당 데이터는 공공기관이 개방 가능한 시설에 대해 관리하는 정보로, 위치, 용도, 제공 가능 자원 등의 세부 정보뿐만 아니라 첨부파일 메타정보도 포함되어 있습니다. 이 서비스는 국민에게 개방된 자원을 쉽게 확인하고 활용할 수 있도록 하며, 지역 사회에서의 공공자원 접근성을 높이는 데 기여합니다. 또한 다양한 공공시설의 이용 가능 여부나 활용 목적을 파악할 수 있어, 효율적인 시설 이용을 위한 기초자료로 활용될 수 있습니다. 시설정보는 공공자산 관리, 공간정보 연계, 행정 효율성 제고 등 다양한 분야에 활용 가능합니다.
