summary_user: 지방자치단체가 관리하는 공공시설물별로 회계연도 단위의 운영현황을 담으며, 관리인력·연간 이용인원·건물과 토지 면적, 취득비용·감가상각·장부가액 같은 자산가치, 연간 운영비용과 운영수익을 함께 제공한다(전국 범위, 2014년부터, 2021 회계연도 제외). 주민이나 분석가가 "우리 지역 공공시설은 이용자에 비해 운영비가 얼마나 들고 수익으로 얼마나 메우나"를 시설 단위로 따져 보는 데 쓴다. 전역 조인 키는 없어서, 자치단체 코드(laf_cd)·자치단체명과 회계연도(fyr)를 기준으로 다른 지방재정365 공시 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 지방자치단체가 관리하고있는 공공시설물에 대한 운영현황에 대한 정보로서 2014년부터 정보가 제공되며, 2021 회계연도는 제외된 정보입니다. 주요항목으로는 시설물명, 해당 시설물의 관리인력, 연간 시설물 이용인원, 건물 및 토지의 면적 등의 기본정보와 시설물 취득비용 및 감감상각액과 현재 장부가액등의 자산가치 정보, 그리고 연간 운영비용과 운영수익정보가 제공됩니다. 운영비용은 인건비, 유지관리비, 기타비용으로 상세정보가 제공되며, 운영수익은 입장료, 대관료, 임대료, 민간위탁료, 기타수익 정보가 제공됩니다.
