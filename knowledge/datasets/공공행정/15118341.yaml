description_portal: 본 데이터는 한국토지주택공사가 용역 계약 방식으로 진행 중에 있는 정보화 사업 현황을 제공합니다. 각 정보화 사업의 사업 유형, 사업명, 사업 내용, 사업비, 사업기간, 담당 부서 정보를 포함하고 있습니다. "정보화 사업"이라 함은 "정보시스템"을 개발, 도입, 운영, 관리하는 모든 사업을 말하며, "정보시스템"이란 정보의 수집, 가공, 저장, 검색, 송신, 수신 및 그 활용과 관련되는 기기와 소프트웨어의 조직화된 체계를 뜻합니다. 한국토지주택공사는 그 업무와 관련된 방대한 데이터를 생성, 수집하고 있으며 이를 효율적으로 관리하기 위한 정보시스템의 질적, 양적 증가 필요에 따라서 정보화 사업 규모 역시 증가하는 추세에 있습니다. 본 데이터는 제공되는 시점에 계약이 기간 중에 있는 정보화 사업을 나열하고 있으며 경우에 따라서는 기존 정보시스템이 통합 또는 폐기됨에 따라 정보화 사업 현황에 변동이 있을 수 있습니다.
