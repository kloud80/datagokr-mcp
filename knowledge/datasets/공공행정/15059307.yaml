summary_user: 지방자치단체별 회계연도(fyr) 세입결산액을 상위 단체·자치단체 코드와 이름, 총액(total)과 세부 금액 항목 4개로 담은 전국 단위 집계 데이터다. 재정 분석가나 주민이 '우리 지자체가 해당 연도에 실제로 거둔 세입이 얼마이고 어떤 재원으로 구성됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어 자치단체 코드(laf_cd)·이름으로 같은 지방재정365의 세출·예산 데이터와 맞춰 잇는다.
description_portal: 세입결산이란 지방자치단체의 회계연도 동안 실제로 수입한 금액을 예산과 비교하여 최종적으로 정리하는 과정입니다.세입결산은 지방세, 세외수입, 국고보조금, 지방교부세 등 다양한 세입 항목을 포함하며, 자치단체가 예산에 계획된 세입 목표를 얼마나 달성했는지를 평가하는 중요한 지표입니다.세입결산은 예산 집행의 실적을 파악하고, 예산과 실제 수입의 차이를 분석하여 향후 예산 편성 시 참고자료로 사용됩니다.이를 통해 자치단체는 세입 구조의 효율성과 자주재원의 확보 정도를 평가하고, 세정 운영의 투명성을 제고할 수 있습니다.
