description_portal: 개인정보보호법 제25조제1항 각 호를 근거로 공공기관(국가행정기관, 학교, 교육청 등 교육기관, 지방자치단체)이 공원, 공공기관과 같이 공개된 장소에서 설치·운영중인 고정형 영상정보처리기기(CCTV)의 설치목적(범죄예방, 시설안전, 교통단속 등), 운영대수 등 다양한 정보를 제공하는 데이터입니다.본 데이터는 매년 3월까지 개인정보보호위원회가 공개된 장소에서 CCTV를 설치/운영하는 공공기관을 대상으로 조사하는 데이터로, 행정안전부의 지역안전지수, 통계청의 자료 등에 사용되는 데이터입니다.
