summary_user: 서울 종로구 안 행정사 사업소를 한 곳당 한 행으로 담은 CSV 파일(약 16KB)로, 사업장명·전화번호·도로명/지번주소·민원종류명·데이터기준일을 담는다. 종로구 주민이나 사업자가 '가까운 행정사 사무소가 어디이고 어떤 민원을 맡는가'를 찾거나, 분석가가 구 안 행정사 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 주소 지오코딩으로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구에서 운영 중인 행정사업소의 현황을 정리한 자료로, 주민 밀착형 공공서비스 제공을 위한 지역 기반 행정조직 정보를 담고 있습니다. 수록 항목에는 사업장명, 전화번호, 지번주소, 도로명주소 등이 포함되어 있으며, 행정서비스 접근성 향상과 지역 주민 편의를 위한 기초자료로 활용됩니다. 해당 자료는 종로구청 소속 각 부서의 외청기관, 출장소, 주민센터, 복지센터 등 다양한 행정사업소의 위치 및 연락처 정보를 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 데이터는 지역 내 공공시설 분포 현황, 행정서비스 균형화, 기관별 민원처리 기반 분석, 지역거점 행정계획 수립 등 행정 효율성을 제고하기 위한 기반자료로 활용됩니다.
