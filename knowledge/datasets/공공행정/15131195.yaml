summary_user: 조달청 벤처나라에서 발생한 주문·물납영수증 등 거래 실적을 건별로 담은 전국 단위 CSV 파일(약 8.6MB)로, 실적일자·수요기관코드·벤처업체·물품식별번호·수량·단가·실적금액이 한 행에 들어 있다. 벤처·창업기업 제품을 어느 공공기관이 얼마나 사들였는지, 특정 벤처업체의 공공 판매 실적이 얼마인지 알아보려는 분석가나 사업자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 수요기관코드·물품식별번호·주문번호 같은 조달청 내부 코드를 같은 기관의 다른 조달 데이터와 맞춰 보는 방식으로만 연결한다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 바로 결합하기 어렵고, 조달청 코드 체계를 같이 쓰는 데이터와만 맞출 수 있다. 행정구역 단위 공간 정보가 없는 전국·비공간 데이터라 지역별 분석에는 수요기관 정보를 따로 붙여야 한다.
