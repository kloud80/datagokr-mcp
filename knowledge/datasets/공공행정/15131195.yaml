description_portal: '1.정의 : 벤처나라에서 발생하는 거래와 관련된 실적정보를 통합관리2.특징 : 거래정의1) 수기판매실적: 벤처나라에서 통하지 않고 조달업체가 납품한 거래실적2) 견적요청: 벤처나라에서 수요기관이 조달업체로 특정 상품에 대한 견적을 요청한 실적3) 물납영수증: 벤처나라 또는 조달청(입찰, 중앙조달, 계약 등)을 통해 판매된 벤처나라 주문건에 대해 물납영수증이 발급된 거래실적4) 주문: 벤처나라에서 직접 주문한 거래실적3.특이사항 : 1) 실적유형코드: 주문, 물납2) 관리항목 : 실적일자,실적순번,물품식별번호,견적요청번호,견적요청상세순번,주문번호,주문변경차수,물품순번,물납영수증번호,물납영수증변경차수,실적요청순번,벤처실적유형코드,벤처구매신청여부,수요기관코드,벤처업체번호,업체명,판매물품수량,물품단가,실적금액,입력일자,삭제여부를 포함한 벤처나라 통합실적'
