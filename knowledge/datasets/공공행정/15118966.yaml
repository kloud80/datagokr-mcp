description_portal: '여권발급 시 발생하는 수수료의 연도별 결제수단(현금, 카드, 온라인)별 수납 내역과 총계를 정리한 자료.행정 수입금의 수납방식별 추이, 무현금 행정 확대, 회계처리의 투명성 제고, 대민 서비스 개선 등을 위한 기초자료로 활용됨.활용 목적 및 특징– 결제수단별 수납 비율 분석을 통한 전자결제 도입 현황 진단– 연도별 총계 추이를 통한 여권발급 수요 및 행정수입 변화 파악– 카드·온라인 수납 확대에 따른 수납체계 효율성 분석– 회계투명성 확보 및 예산 회계자료 근거자료로 활용 가능주요 항목 설명● 구분: 수납 대상 구분(예: 일반, 복수, 영문정정 등)● 연도: 해당 수납 내역이 발생한 연도● 현금 결제(천원): 현금으로 수납된 여권 수수료 금액(천 원 단위)● 카드 결제(천원): 카드로 결제된 수수료 금액● 온라인 결제(천원): 전자결제 방식으로 납부된 수수료 금액● 총계: 결제수단 구분 없이 수납된 전체 수수료 합계'
