summary_user: 경기도 시군구별 읍면동 단위의 행정경계 공간정보로, 읍면동 코드·명칭, 시군구 코드·명칭과 경계 다각형(MULTIPOLYGON) 모양을 담는다. 분석가가 '우리 시 읍면동별로 시설·민원·인구 지표를 지도에 칠하면 어떻게 보이나' 같은 읍면동 단위 지도 시각화와 경계 기준 위치분석에 쓴다. 실측상 전역 조인 키는 없어 읍면동·시군구 코드(emd_cd, signgu_cd)나 명칭을 다른 데이터의 행정구역 코드·이름과 맞춰 연결하고, 좌표 있는 시설 데이터와는 경계 다각형에 포함되는지로 공간 결합한다.
description_portal: 이 데이터는 경기도 내 시군구별로 세분화된 읍면동 단위의 공간경계 정보를 제공하는 자료로, 각 행정단위의 코드와 명칭 정보를 포함합니다. 주요 항목은 읍면동 코드, 읍면동 명, 시군구 코드, 시군구 명, 공간정보(모양)로 구성되어 있으며, 특히 ‘모양’ 항목은 다각형 형식의 공간데이터(MULTIPOLYGON)로서, 각 읍면동의 지리적 경계를 표현하는 데 활용됩니다. 데이터 길이 문제로 시트 탭에서는 제공하지 않으나 파일탭에서 원본을 확인할 수 있습니다, 원본 데이터에서는 지도 시각화, 위치기반 분석, 행정 경계 기준 분석 등 다양한 공간정보 활용에 적합한 구조를 가지고 있습니다. 이를 통해 읍면동 단위의 정밀한 위치기반 분석이 가능하며, 지역 단위 정책 수립 및 행정서비스 제공에 효과적으로 활용될 수 있습니다.
