summary_user: 수원시가 조사한 개인서비스 요금 등 생활 밀접 품목의 가격 동향을 기준일·구분·품목·규격 및 단위별로 담은 시군구 단위 파일(csv, 약 70KB)이다. 수원 시민이나 분석가가 외식비·이미용료 같은 생활 품목 가격이 시점별로 어떻게 변했는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시군의 물가동향 자료와는 품목명·시군구명을 맞춰 이어 붙여야 한다.
description_portal: 경기도 수원시의 물가 동향 데이터로, 개인서비스 요금을 포함한 다양한 생활 밀접 품목의 가격 변화를 조사하여 제공합니다.생활 필수품과 서비스 관련 물가 정보가 포함되어 있으며, 소비자가 일상에서 접하는 여러 상품과 서비스의 가격 현황을 종합적으로 담고 있습니다.이를 통해 가계의 경제적 부담과 관련된 다양한 가격 요소에 대한 전반적인 정보를 확인할 수 있습니다.경기도 수원시 물가동향 데이터는 구분, 품목, 규격 및 단위, 물가동향으로 구성된 데이터입니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.
