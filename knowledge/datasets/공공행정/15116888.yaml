summary_user: 한국중부발전의 일상감사 건별 기록으로, 건마다 접수일자·소관부서·건명·사업비·예산절감금액·감사결과·감사일자·조치확인 여부를 담은 CSV 파일(약 397KB)이다. 공공기관 감사·경영평가 분석가가 "어느 부서의 어떤 사업에서 일상감사로 예산이 얼마나 절감됐는가"를 따질 때 쓴다. 다른 데이터와 잇는 공통 조인 키는 없어, 부서명·건명 같은 이름 매칭이나 같은 기관(한국중부발전) 기준으로만 연결한다.
description_portal: 본 데이터는 한국중부발전의 내부 감사 프로세스 중 일상감사를 통해 도출된 주요 정보를 정리한 자료입니다. 항목은 관리번호, 접수일자, 소관부서명, 건명, 사업비(천원), 예산절감금액(천원), 감사결과, 감사일자, 조치확인으로 구성되어 있습니다. 일상감사는 사업 수행 전 사전 점검 또는 집행 중 문제 발생 시 개선을 유도하는 내부통제 수단으로, 이 데이터는 감사 시점, 대상 부서, 예산 절감 효과 등을 정량적으로 파악할 수 있는 구조입니다. 이를 통해 공공기관의 예산 집행 효율성, 내부 견제 시스템, 사전 리스크 관리 역량 등을 종합적으로 평가할 수 있습니다.
