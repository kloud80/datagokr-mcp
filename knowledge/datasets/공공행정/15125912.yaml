summary_user: 국회도서관이 공표하는 기타 행정정보를 공표 파일 단위로 담은 목록으로, 생산연월·기관명·분류명·공표 파일명과 파일 경로를 함께 제공한다. 국회도서관이 어떤 행정정보를 언제 어떤 분류로 공개했는지 확인하고 해당 공표 파일을 찾으려는 국민이나 연구자가 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했으므로, 기관코드(INST_CD)나 분류코드·이름을 맞춰 같은 국회 기관의 다른 공표 목록과만 연결한다.
