description_portal: '통계활용사례 등록URL 복사목록 이동서울시 민원사무처리현황(2002~2020) 통계○ 통계개요* 통계명 : 민원사무처리현황* 통계종류 : 서울시 자치구별 민원사무처리현황을 제공하는 일반ㆍ보고통계* 근거법령 :「민원사무처리에관한법률시행령」제2조제2항* 작성목적 : 행정 제반사항에 대한 운영ㆍ점검을 통해 지방행정 수행의 책임성과투명성을 높이고 행정서비스의 질적 향상을 위한 정책마련의 기초자료로활용하는 것을 목적으로 함* 조사체계 : 해당기관, 자치구 및 본청 해당부서 → 서울특별시 시민봉사담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 허가ㆍ특허ㆍ면허ㆍ승인ㆍ지정ㆍ인정 등민원(문서)처리 현황○ 용어설명* 민원사무 : 민원인(개인 법인 단체)이 행정기관에 처분등 특정한 처분을요구하는 사항에 관한 사무(문서원칙)○ 기 타* 자치구 관할 동 주민센터 처리건수 포함○ 출 처 : 서울특별시 시민봉사담당관'
