summary_user: 경기도 내 지역별 관리기관이 지정한 전동킥보드 등 개인형 이동장치(PM) 주차구역을 한 곳씩 담은 위치 목록으로, 관리기관명·설치장소·도로명/지번주소·WGS84 위경도·기준일자를 포함한다. 공유 킥보드 이용자가 내 주변 지정 주차구역을 찾거나, 시·군 교통 담당자와 분석가가 주차구역이 어느 지역에 몰리고 어디가 비어 있는지 접근성을 따져 볼 때 쓴다. 전역 조인 키는 없어 관리기관명이나 주소로 시군을 맞추거나, 위경도 좌표로 지하철역·버스정류장 같은 다른 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 이 데이터는 전동킥보드 등 퍼스널모빌리티(PM)의 확산에 따라 지정된 주차구역의 위치 정보를 수록한 자료로, 지역별 관리기관이 설정한 주차장소의 도로명주소, 지번주소, 좌표 정보 등을 포함하고 있습니다. 도시 내 교통 질서 유지와 보행자 안전 확보를 위해 구축된 이 데이터는 공유 킥보드 이용자의 자율적이고 올바른 주차를 유도하고, 무분별한 주차로 인한 민원 및 도시미관 저해 문제를 예방하는 데 활용됩니다. 데이터는 스마트시티 구현, 교통정책 수립, 도시 인프라 관리 등 다양한 분야에서 기반 자료로 활용될 수 있으며, 특히 전동킥보드 주차관리 효율성과 접근성 분석 등에 유용한 정보를 제공합니다.
