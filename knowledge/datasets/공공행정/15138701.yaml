summary_user: 지방자치단체별로 예산 총액 대비 사회보장적수혜금(지방재원) 통계목으로 편성된 예산(현금성 복지비)을 회계연도 단위로 집계한 전국 공시 자료로, 2024회계연도부터 일반회계·기타특별회계를 대상으로 금액과 비율을 담는다. 분석가나 주민이 '우리 시·군·구는 예산 중 현금성 복지에 얼마를, 몇 %를 편성했나'를 다른 자치단체와 비교하는 데 쓴다. 전역 조인 키는 없고 자치단체 코드(laf_cd)·자치단체명으로 같은 지방재정365의 다른 공시 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 지방자치단체의 사회보장적 수혜금은 지역 사회의 복지와 주민의 삶의 질을 향상시키기 위한 재정 지원의 일환이며 지방자치단체는 법령 및 조례에 따라 특정 단체나 개인에게 사업비 또는 운영비 지원을 제공합니다. 지방자치단체의 사회보장적 수혜금은 주민들에게 필요한 서비스를 제공합니다. 이 자료는 예산 총액대비 사회보장적수혜금(지방재원) 통계목으로 편성된 예산을 분석한 자료입니다.사회복장적수혜금(현금성복지비) 정보는 2024회계연도부터 제공되며 대상회계는 일반회계, 기타특별회계입니다.
