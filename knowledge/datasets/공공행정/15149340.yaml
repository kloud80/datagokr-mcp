summary_user: 경기도국민안전체험관 홈페이지에서 운영하는 설문지의 개별 문항을 한 행씩 담은 원천 자료로, 문항 번호·제목·유형·선택지 내용·생성일시가 들어 있다. 체험관 만족도 조사를 설계하거나 분석하는 담당자·연구자가 '체험 시간 적정성, 교관 전문성, 교육 효과를 어떤 문항과 선택지로 묻고 있나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 설문지 식별번호(qsnr_idntfy_no)로 같은 기관의 설문지·응답 자료와 이어 볼 수 있을 뿐이다.
description_portal: 이 데이터는 경기도국민안전체험관 홈페이지에서 운영되는 설문지의 개별 문항 정보를 수록한 자료로, 각 문항의 제목, 번호, 유형, 선택지 내용, 생성일시 등을 포함하고 있습니다. 설문 문항은 체험 시간의 적정성, 방문 계기, 교육 효과, 교관 전문성, 전반적 만족도 등 안전체험관 서비스와 교육의 질을 다각도로 평가할 수 있도록 구성되어 있습니다. 이 데이터는 이용자의 의견을 체계적으로 수집·분석하여 프로그램 개선과 서비스 품질 향상에 기여하며, 안전교육 효과 측정과 정책적 의사결정 지원을 위한 근거 자료로 활용될 수 있습니다.
