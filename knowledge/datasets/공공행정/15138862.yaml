summary_user: 지방자치단체별로 지방의회가 국외 출장·해외 연수 등에 쓴 국외여비와 그 비율을 회계연도(fyr) 단위로 담은 전국 범위의 지방재정 공시 지표다. 주민이나 분석가가 "우리 지역 지방의회의 국외여비 비중이 다른 자치단체보다 높은가"를 확인하고 자치단체 간 비교·연도별 추이를 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 지방재정365 지표와는 자치단체명이나 같은 기관의 자치단체 코드(laf_cd)로 맞춰 이어 쓴다.
description_portal: 지방자치단체 지방의회 국외여비 비율이란, 지방자치단체가 지방의회 활동을 위해 지출한 국외여비(국외 출장, 해외 연수 등)의 비율을 의미합니다. 이는 지방의회가 수행하는 국제적 활동에 소요되는 비용이 전체 예산에서 차지하는 비중을 나타내며, 지방자치단체의 재정 건전성과 외부 활동의 효율성을 평가하는 중요한 지표로 활용됩니다. 이 비율을 통해 국외 여비의 과다 지출 여부를 점검하고, 재정 자원의 효율적 배분을 도모할 수 있습니다.지방재정통합공개시스템(lofin365.go.kr)에서 보다 자세한 정보를 확인하실 수 있습니다.
