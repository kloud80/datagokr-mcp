summary_user: MDIS(마이크로데이터 통합서비스)가 제공하는 통계조사를 조사아이디 단위로 정리한 목록 파일로, 조사명·영문명·상위조사 관계·삭제여부를 담으며 전국 단위의 비공간 메타데이터다. 연구자나 분석가가 'MDIS에서 어떤 통계조사의 마이크로데이터를 받을 수 있고, 어느 상위조사에 속하는가'를 확인할 때 쓴다. 조사아이디(mdis_survey_id)를 키로 MDIS의 다른 테이블과 잇고, 상위조사아이디로 같은 파일 안에서 조사 간 계층을 따라간다.
description_portal: MDIS_통계조사마이크로데이터 통합서비스국가 주요정책 수립, 기업 경영전략 수립, 학술논문 등 심층 연구·분석에 활용되는 마이크로데이터의 수요가 지속적으로 증가하고 있습니다. 이에 통계청은 자체 작성하는 마이크로데이터뿐만 아니라 정부 각 부처, 지자체, 공공기관, 연구기관 등 타 통계작성기관의 마이크로데이터를 한 곳에 모아 MDIS (MicroData Integrated Service)를 통해 국민들이 다양한 통계자료를 편리하게 이용할 수 있도록 서비스하고 있습니다.통계조사 테이블은 MDIS에서 제공하는통계조사를 관리하기 위한 테이블로 아이디로 관리하고 있습니다.
