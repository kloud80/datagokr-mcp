description_portal: '부산광역시 연제구 주민소환투표에 관련된 데이터로  매년 주민소환에 관한 법률 제7조(주민소환투표의 청구)에 따라 주민소환투표에 관련된 선거구명, 행정동, 청구권자 및 서명인수 등의 항목을 제공합니다. 또한 해당 데이터는 주민소환에 관한 법률 제7조 제5항에 따라 지방자치단체의 장은 매년 1월 10일까지 산정한 주민소환투표청구권자 총수를 공표해야하며 이에 따라 연제구청 홈페이지 공고를 통해서도 확인하실 수 있습니다.- 내국인: 19세 이상의 주민(공직선거법 제18조에 따른 선거권 없는 사람 제외)- 외국인: 19세 이상의 주민으로서 출입국관리법 제10조에 따른 영주할 수 있는 체류자격 취득일 후 3년이 경과한 자 중 같은법 제34조의 규정에 따라 당해 지방자치단체 관할구역의 외국인등록대장에 등재된 자'
