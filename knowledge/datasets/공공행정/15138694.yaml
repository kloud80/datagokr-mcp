summary_user: 지방자치단체별·회계연도별로 일반회계·기타특별회계·공기업특별회계·기금을 통합한 당초예산 기준의 공무원 대상인원, 총예산편성액, 공무원 일직비·숙직비 편성액을 담은 전국 단위 집계 데이터로, 2020 회계연도 이후 정보를 제공한다. 분석가나 지역 주민이 "우리 시·군·구는 일·숙직비에 얼마를 편성했고 다른 자치단체와 비교하면 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 지방재정365 데이터와는 자치단체 코드(laf_cd)·자치단체명과 회계연도(fyr)를 맞춰 이름·코드 매핑으로 연결한다.
description_portal: 공무원 일작비·숙직비는 일·숙직자에 대한 실비보상적 경비를 의미합니다. 지방자치단체 별로 편성하는 예산정보 중 일반회계, 기타특별회계, 공기업특별회계, 기금 전체를 통합한 연도별 당초예산을 기준으로 자치단체별 공무원 대상인원과 총예산편성액, 공무원일숙직비 편성액 정보를 제공하고 있습니다. 해당 정보는 2020 회계연도 이후의 공무원 일직비·숙직비 정보가 제공되며, 해당 정보를 통해 자치단체의 년도별 공무원 수와 통합회계에 대한 총예산액 정보도 함께 확인하실 수 있습니다.
