summary_user: 성남시 관내 무인민원발급기에서 뗄 수 있는 민원서류를 업무 분야(주민등록·토지지적건축·차량·지방세·교육제증명 등)별로 나열하고, 서류마다 관내·관외 발급수수료(원)를 담은 작은 목록형 파일(CSV 약 5.7KB)이다. 시민이 '무인발급기에서 주민등록등본이나 건축물대장을 떼면 수수료가 얼마인지', '관외 주소지 서류는 얼마인지'를 미리 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 민원서류 이름으로 매핑하거나, 같은 성남시의 무인민원발급기 위치 자료와 기관 단위로만 이어 쓴다.
description_portal: 경기도 성남시 무인민원발급기 수수료에 대한 데이터로, 경기도 성남시 무인민원 발급기 수수료에 관한 업무, 민원증명, 발급수수료 등의 항목을 제공합니다. 성남시 무인민원발급기 수수료 자료는 성남시 관내 무인민원발급기에서 발급 가능한 민원서류의 종류와 수수료 정보를 정리한 자료입니다. 이 자료는 업무명(주민등록, 토지지적건축, 차량, 지방세, 교육제증명 등), 민원증명(주민등록등본, 초본, 건축물대장, 자동차등록원부, 지방세납세증명, 학교생활기록부 등), 발급수수료(관내, 관외) 항목 등을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 행정서비스 이용에 활용할 수 있습니다.
