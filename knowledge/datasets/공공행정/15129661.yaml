description_portal: 한국수력원자력(주)_육아기 근로시간 단축제 사용현황_2024년연간 육아기 근로시간 단축제 사용인원의 데이터를 제공합니다.한국수력원자력(주)가 공개하는 육아기 근로시간 단축제 사용현황에 관한 데이터입니다. 육아기 근로시간 단축제는 자녀 양육기 근로자가 일정 기간 근로시간을 줄여 일과 육아를 병행할 수 있도록 지원하는 제도입니다. 법령과 단체협약에 따라 신청 대상과 기간, 근무시간 등이 정해져 있으며, 정부의 급여 지원도 받을 수 있습니다. 해당 데이터는 2024년 한국수력원자력(주)에서 육아기 근로시간 단축제를 이용한 임직원의 성명, 성별, 시작일, 종료일, 사용기간(개월), 주당 근무시간에 관한 정보를 포함하고 있습니다. 성명은 비식별 처리 되었습니다.
