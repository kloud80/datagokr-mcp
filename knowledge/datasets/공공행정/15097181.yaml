description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 근무하는 직·간접 감정노동자의 생리적 스트레스 반응을 파악하기 위해 수집된 심박수 정보로, 공공데이터 기업매칭 지원사업의 일환으로 구축된 자료입니다. 각 데이터는 아이디, 측정 일시, 심박수 항목으로 구성되어 있으며, 아이디는 측정 대상자를 식별할 수 있는 익명화된 식별자로 사용됩니다. 측정 일시는 ‘2021-10-30 22:12’, ‘2021-11-11 7:43’, ‘2021-10-19 0:05’와 같이 날짜와 시간이 함께 표기된 형식으로 기록되어 있어, 하루 중 특정 시간대의 심박수 변화를 정밀하게 추적할 수 있습니다. 심박수는 1분당 심장 박동 수(bpm)로 나타나는 수치이며, 실시간 또는 주기적인 측정을 통해 감정노동자의 생리적 반응을 시간대별로 정량적으로 분석할 수 있습니다. 이 데이터는 근무 시간대별 스트레스 추이 분석, 특정 이벤트나 상황과의 심박수 연계 분석, 고위험 시간대 도출, 감정노동자의 건강 모니터링 체계 구축 등에 활용될 수 있으며, 감정노동 보호정책 수립과 근무환경 개선을 위한 과학적 근거자료로 기능합니다.
