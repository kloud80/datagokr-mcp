summary_user: 국회 위원회별로 현재 계류 중인 의안 건수를 의안 종류별로 집계한 통계로, 법률안(의원 발의·정부 제출)과 동의안·결의안·건의안·규칙안 등의 건수와 위원회별 합계를 담으며 범위는 전국 단위의 비공간 데이터다. 분석가나 기자가 '어느 상임위원회에 처리되지 않은 법률안이 가장 많이 쌓여 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 국회 의안 데이터와는 위원회명(CMIT_NM)을 이름 기준으로 맞춰 연결해야 한다.
