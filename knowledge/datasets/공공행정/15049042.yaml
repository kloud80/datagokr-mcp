description_portal: 본 데이터는 수자원 개발, 하천 정비, 수질 개선 등 다양한 사업에서 발생한 간접 보상 현황을 사업정보 형태로 제공한다. 간접 보상은 사업 추진 과정에서 직접적인 토지 매수나 수용 절차를 거치지 않고, 사업 영향에 따라 발생하는 작물 보상, 영업 손실 보전 등 간접적인 방식으로 이루어지는 보상을 의미한다.본 데이터에는 사업종류, 사업명, 사업시행자, 토지 면적(㎡), 토지 금액(원), 토지 외 건수, 토지 외 금액(원) 항목이 포함된다. 여기서 토지 면적과 금액은 사업에서 간접적으로 보상된 토지의 규모와 가치를 나타내며, 토지 외 건수와 금액은 건물, 수목, 영업권 등 비토지 자산에 대한 보상 내역을 보여준다.이 데이터는 사업별·지역별 간접 보상 집행 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 보상 집행의 투명성을 높이는 데 기여한다. 또한 간접 보상 규모와 유형 분석을 통해 수자원 관리 계획 수립, 예산 편성, 재정 집행 관리, 보상 정책 검토 등 다양한 행정·정책 업무에서 참고자료로 활용할 수 있다.
