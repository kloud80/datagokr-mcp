summary_user: 국회 시설물을 한 건씩 담은 목록으로, 필드명으로 보아 시설명(FCLT_NM), 대지·건축 면적, 층 규모, 준공 시기, 비고, 첨부 파일명이 들어 있고 범위는 지역을 나누지 않는 전국·비공간 단위입니다. 국회 방문객이나 연구자가 '국회 안 어떤 건물이 언제 준공됐고 규모가 어느 정도인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시설명을 이름으로 맞추거나 같은 기관(국회사무처) 데이터끼리만 연결한다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
