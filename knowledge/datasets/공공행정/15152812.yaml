summary_user: 하남시립도서관의 휴관일을 날짜별로 한 건씩 기록한 운영 자료로, 휴관일명(정기휴관·공휴일·장서점검 등 사유), 휴관 연도 단위, 휴관일자, 사용 여부, 최초 등록일자를 담은 CSV 파일(약 137KB)이다. 시민이 특정 날짜에 하남시 도서관이 문을 여는지 확인하거나, 분석가가 연도별 휴관 빈도와 사유 패턴을 살펴 휴관 정책을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키나 도서관 코드가 없어 다른 데이터와는 날짜나 도서관 이름을 직접 맞추는 방식으로만 이어 쓸 수 있다.
description_portal: 하남시립도서관의 도서관 휴관일 정보를 체계적으로 기록한 운영관리 자료로, 각 도서관의 정기휴관일, 법정공휴일 휴관, 장서점검·시설점검 등 다양한 휴관 사유를 명확히 구분하여 제공합니다. 날짜별로 휴관사유가 정리되어 있어 시민이 방문 전 운영 여부를 쉽게 확인할 수 있고, 도서관은 이를 기반으로 공지사항·SMS 알림·홈페이지 안내 등 이용자 안내 서비스를 효율적으로 운영할 수 있습니다.또한 정기휴관 패턴을 분석하면 방문객 분산 전략, 휴관일 정책 개선, 특정 도서관의 휴관 빈도 조정 등 도서관 운영정책 결정을 지원할 수 있습니다.
