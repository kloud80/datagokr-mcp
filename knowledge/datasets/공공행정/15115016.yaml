summary_user: 강남구에서 반려 목적 동물을 구입해 판매·알선·중개하는 동물판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·영업상태·폐업·휴업일자·사업장명·주소·좌표를 포함한다. 반려동물 분양을 알아보는 주민이 근처에서 영업 중인 동물판매업소를 확인하거나, 분석가가 강남구 펫숍의 개업·폐업 추이를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OGDP_INST_CD)로 이어 쓰며, 같은 원천인 LOCALDATA 인허가 자료와 겹친다.
