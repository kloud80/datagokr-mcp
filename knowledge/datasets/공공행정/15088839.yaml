description_portal: 한국수력원자력이 보유한 OA 신규등록자산 현황에 대한 데이터를 공개합니다. 한국수력원자력㈜의 경주 본사에서 매년 신규취득 및 등록한 OA장비 (일체형PC, 데스크탑, 노트북, 미니PC, 모니터, 복합기 대형컬러,복합기 대형흑백, 복합기 소형복합기, 복합기 잉크젯, 프린터 컬러레이저A3, 프린터 컬러레이저A4, 프린터 잉크젯, 스캐너, 플로터, 모바일,기타자산) 관련 목록입니다. 이 데이터는 2019년도부터 누적된 데이터 기준일로부터 최근 3개년 신규등록자산 현황입니다. 본 개방데이터의 제공항목의 속성값의수량 단위는 대수입니다.
