summary_user: 전국 지방자치단체별로 회계연도마다 주민1인당 지방세 부담액, 지방세액, 인구수를 담은 집계 공시 데이터이며, 일반회계 지방세 총액을 전년도 말 주민등록 인구로 나눈 값입니다. 주민이나 분석가가 "우리 시·군·구 주민은 다른 지역보다 1인당 지방세를 얼마나 더 내나"를 비교하거나 연도별 세부담 추이를 볼 때 쓴다. 상위 자치단체 코드·이름(wa_laf_cd)과 자치단체 코드·이름(laf_cd)이 있지만 전역 조인 키는 확인되지 않아, 다른 지방재정365 데이터와는 같은 기관 코드로, 그 밖의 데이터와는 자치단체명 매핑으로 잇는다.
description_portal: 지방자치단체의 주민1인당 지방세 부담액 정보는 지방재정법 제60조 및 같은법 시행령 제68조에 따라 매년 공개됩니다. 해당 자치단체의 지방세 총액을 전년도 12월31일 기준 자치단체의 주민등록 인구수로 나눈 값으로 산정되며, 자치단체 재정자립도와 주민의 세금부담수준을 파악하는데 활용될 수 있습니다.주민1인당 지방세부담액정보는 2001회계연도부터 제공되며 일반회계를 대상으로 취합됩니다. 세부 제공항목은 자치단체별 주민1인당지방세부담액, 지방세액, 인구수 항목이 제공됩니다.
