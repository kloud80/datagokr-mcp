description_portal: 이 데이터는 국내에서 외국인 인력의 직무역량 향상과 사회적 정착 지원을 위해 운영되는 각종 교육과정과 공개문항 정보를 통합·제공하기 위한 공공데이터입니다. 한국산업인력공단을 비롯한 관련 교육기관에서 개설한 외국인 대상 교육과정, 강사교육 과목, 강의기관별 교육과목, 그리고 직업능력·언어능력·기초소양 등을 평가하기 위한 공개문항 자료 등을 포함하고 있습니다. 이를 통해 외국인 근로자 및 예비입국자의 학습 이력 관리, 교육수요 분석, 표준화된 교육콘텐츠 개발, 정책적 의사결정 지원 등을 목적으로 활용할 수 있습니다.
