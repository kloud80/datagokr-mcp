description_portal: 본 데이터는 서울특별시 동대문구 관내 주요 정류소 및 가로변의 청결한 환경을 상시 유지하고, 우리 구를 이용하는 구민과 방문객 여러분께 쾌적하고 편리한 보행 환경을 제공함으로써 삶의 질을 높이기 위해  설치·운영 중인 가로 쓰레기통의 세부 현황을 체계적으로 정리한 자료입니다.우리 구 가로 쓰레기통은 깨끗한 거리 환경 조성을 최우선 목적으로 동대문구형과 서울형 쓰레기통과 같이 두 종류로 운영되고 있으나, 설치 이후 해당 지점 주변의 생활 쓰레기 무단투기 발생 추이 분석 결과나 유동 인구의 급격한 변화, 도로 정비 사업 등 물리적 환경 변화 또는 인근 거주 주민들 및 상업 시설 관계자들의 실질적인 위치 조정 요청 등 다양한 행정 수요에 따라 설치 위치가 수시로 변경되거나 탄력적으로 조정될 수 있습니다.이러한 현장의 가변적인 특성으로 인하여, 본 공공데이터에서 제공하는 수치상의 위치 정보와 실제 현장에 배치된 가로쓰레기통의 위치 간에 불가피한 차이가 발생하거나 일부 정보의 차이가 있을 수 있음을 너그러운 마음으로 양해하여 주시기 바랍니다.동대문구 청소행정과에서는 정기적인 현장  점검과 철저한 유지·보수 관리를 통해 데이터의 오차를 최소화하도록 하겠습니다.
