summary_user: 경기도 데이터분석시스템이 공개하는 데이터셋마다 한 행씩, 데이터셋 이름·설명·제공기관과 부서·개방일·최종수정일·갱신주기·이용허락조건·조회수·공개 여부를 담은 메타데이터 목록이다. 분석가나 개발자가 경기도에 어떤 데이터가 어느 기관에서 언제 열렸는지, 공공누리 같은 이용 조건이 무엇인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 데이터셋 이름이나 제공기관 코드(provsn_inst_cd)를 직접 맞춰 이어야 한다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 관리하는 데이터셋 기본 테이블로, 분석센터를 통해 공개되는 각종 데이터셋의 핵심 정보를 정리한 자료입니다. 주요 항목은 데이터셋아이디, 데이터셋명, 제공기관, 데이터개방일자, 사용허가조건코드, 조회수 등이 있으며, 각 데이터셋의 설명, 공개 여부, 활용 조건을 함께 제공합니다. 이를 통해 이용자는 데이터 출처와 신뢰성을 확인할 수 있고, 행정·교통·농업·문화 등 다양한 분야에서 분석, 정책 수립, 서비스 개발에 활용할 수 있습니다. 공공저작물 자유이용허락 조건(공공누리 유형 등)을 반드시 확인해야
