summary_user: 전국 지방자치단체별·회계연도별로 재정자립도, 재정자주도, 사회복지분야 예산비율, 자체사업·보조사업 비율, 세입·세출 총액 같은 재정운용 요약 지표를 담은 집계 자료로, 포털 설명상 2016회계연도부터 일반회계 당초예산 기준으로 취합된다. 주민이나 분석가가 "우리 시·군·구의 재정자립도와 복지예산 비율이 다른 자치단체보다 높은가"처럼 자치단체 간 재정 규모·구조·건전성을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 자치단체 코드(laf_cd)나 자치단체명으로 매핑하거나, 같은 지방재정365 계열 자료와 같은 기관 코드로 연결해 쓴다.
description_portal: 지방자치단체의 재정운용상황 개요 지표는 자치단체의 전체적인 재정 운영 상태를 요약한 자료로 세입/세출총액, 자체수입과 이전재원구성비, 통합재정수지, 재정자립도 및 자주도 등을 포함합니다. 이 지표는 재정규모와 구조, 재정건전성을 종합적으로 파악할 수 있게 하며, 자치단체간 비교 및 주민의 이해를 돕기위한 지표로 활용됩니다.재정운용상황 개요 정보는 2016회계연도부터 제공되며 일반회계를 대상으로 연도별 당초예산기준으로 취합됩니다. 세부 제공항목은 자치단체별 재정자립도, 재정자주도, 사회복지분야예산비율, 자체사업비율, 보조사업비율, 지방세와 세외수입의 총액 등 항목이 제공됩니다.
