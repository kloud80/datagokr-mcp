summary_user: 한국자산관리공사가 위탁개발해 관리하는 공공개발부동산(나라키움 등)의 공실을 임대물건 단위로 담으며, 건물명·소재지주소·층과 호수·계약면적과 전용면적·상세용도·임대보증금과 월 임대료·월 관리비·담당자 연락처를 포함하고 범위는 전국 개별 주소 단위다. 사무실이나 상가를 구하는 사업자가 '우리 지역 국유재산 개발 건물에 비어 있는 호실이 있고 보증금과 월세는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 소재지주소나 건물명을 매칭해 이어야 하고, 국유재산 토지 데이터와 연결하려면 주소를 필지고유번호(PNU)로 변환하는 과정이 필요하다.
description_portal: 한국자산관리공사에서 관리하는 공공개발부동산의 공실정보(면적, 층수, 용도, 임대조건, 내부사진 등)를 제공합니다. 투명한 공실정보 공개이를 통해 임대활성화 기대.정부의 국유지 관리 방향이 보존에서 활용으로 변화함에 따라 캠코는 국유재산의 위탁개발을 통해 국유재산의 가치를 높이고 있습니다. 저활용 행정재산이나 유휴일반재산을 대상으로 국가 필요시설과 민관복합건물을 개발하여 재정건전성을 높이고 정책사업을 효율적으로 지원하고 있습니다.국유재산 개발은 위와 같은 정량적인 재산의 가치증가 뿐만 아니라 국유재산에 대한 인식 전환에도 기여하고 있습니다. 노후화되어 지역 경제 활성화에 저해가 되거나 쓰레기 집단 투하장 등으로 방치되던 국유재산은 주변 환경과 조화되는 새로운 재산으로 탈바꿈되고 있으며, 대국민공모를 통해 선정된 '나라키움'이라는 명칭을 개발 완료 건마다 일체감 있게 부여하여 국유재산 개발의 정성적인 가치 또한 증대시키고 있습니다.
