description_portal: 본 데이터는 전남광주통합특별시 북구 관내 전역(행정동별 주요 상권)을 대상으로 서민 외식 물가 안정을 도모하고 소상공인 경쟁력을 강화하기 위해 구축된 시계열 정형 데이터셋입니다. 2025년 2월부터 2026년 6월까지 총 1년 4개월간 매주 45개 중점관리품목의 가격을 직접 현장 조사하여 누적하였습니다. 해당 데이터는 연번, 조사일시, 행정동, 품목, 조사기준, 업소명, 도로명주소, 위도, 경도, 가격 등의 칼럼으로 세밀하게 구성되어 있습니다. 특히 위·경도 기반의 공간정보가 결합되어 있어, 구체적인 골목길 밀착형 외식 및 생활 품목의 체감 물가 변동 추이를 직접적으로 제공합니다. 이러한 특성 덕분에 취약계층 맞춤형 물가 지도 제작 등 지역·사회 현안을 해결하기 위한 공공 정책 수립의 참고자료로 쓰일 뿐만 아니라, 민간의 상권 분석 솔루션 기획, AI 기반 장바구니 물가 예측 모델 개발 등 다양한 서비스의 핵심 기초자료로 유용하게 활용될 수 있습니다.
