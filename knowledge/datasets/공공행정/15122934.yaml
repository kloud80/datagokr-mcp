summary_user: 경기도 통계포털(경기통계시스템)에 실린 통계표마다 고유 ID, 분류 코드, 작성·관리 조직번호, 최종변경일, 공표 여부, 서비스 여부를 한 행씩 담은 통계표 분류 메타데이터이며, 통계 수치 자체는 들어 있지 않다. 분석가나 데이터 담당자가 '경기도 통계표 중 어느 기관이 관리하고 현재 공표·서비스 중인 표는 무엇인가'를 확인하거나 통계표 목록을 정비할 때 쓴다. 실측상 전역 조인 키는 없으며, 통계표 ID(stats_tbl_id)를 '경기도 경기통계시스템 통계표정보'의 통계표명과 맞추는 식으로 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도에서 제공하는 통계포털의 내부 통계표 분류 체계를 정리한 자료로, 각 통계표에 대한 고유 ID, 통계표 명, 통계표 분류 코드, 조직번호, 최종변경일, 공표구분, 서비스구분 등으로 구성되어 있습니다. 데이터는 각 통계표가 어느 기관에서 작성되고 관리되는지를 나타내는 조직 정보와, 해당 통계표의 시스템 내 분류 상태, 서비스 여부, 공표 상태 등을 포함하여 통계 행정자료의 관리 및 유통 구조를 파악하는 데 유용합니다. 이 데이터는 통계 자료의 체계적 분류, 메타데이터 기반 통계서비스 구축, 통계 항목 중복 관리 방지, 표준화된 통계관리 체계 구축 등에 활용될 수 있으며, 통계 행정의 정보 구조 파악 및 내부 데이터 정비의 기초 자료로 기능합니다.※통계표ID에 해당하는 자료명은 "경기도 경기통계시스템 통계표정보"를 참고해 주시기 바랍니다.
