summary_user: 2019년 기준 제주특별자치도 청년사회경제실태조사 결과 가운데 청년이 바라는 일자리 유형과 그 이유를 시군구별·항목별 비율(%)로 정리한 집계 통계다. 제주시와 서귀포시 청년이 어떤 일자리를 선호하는지, 그 이유로 안정성·임금을 꼽는지 근무환경을 꼽는지 비교하려는 지자체 청년정책 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구 이름을 맞춰 연결하거나 같은 기관(제주특별자치도)의 청년 실태조사 자료와 묶어 쓴다.
description_portal: 이 데이터셋은 2019년 기준 제주특별자치도 내 시군구 단위에서 청년들이 선호하는 일자리 유형과 그 선택 이유를 조사하여 정리한 공공 통계자료이다. 정규직·계약직·공공기관·민간기업·창업 등 다양한 일자리 형태에 대한 지역별 선호도와 함께, 선택 이유로 제시된 안정성, 임금 수준, 근무환경, 경력 개발 가능성, 지역 정주성 등의 요인이 포함되어 있다. 시군구별로 청년들의 고용 인식 차이와 지역별 노동시장 여건을 입체적으로 파악할 수 있어, 지방자치단체의 청년정책 수립, 지역 맞춤형 일자리 사업 설계, 취업 지원 프로그램 기획, 지역 정착 지원 정책 개발 등에 필요한 기초 자료로 활용될 수 있다. 제공 기관은 제주특별자치도이며, 데이터는 CSV 형식으로 공개되어 누구나 분석 가능하다.
