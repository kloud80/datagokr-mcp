description_portal: 충청북도 충주시청 공식 홈페이지의 전체 메뉴 구조 정보를 제공하는 데이터입니다.메뉴번호, 메뉴레벨, 메뉴명, 메뉴URL, 상위메뉴번호, 링크대상, 링크URL, 하위메뉴 수, 메뉴 생성일 등으로 구성되어 있으며, 웹사이트 콘텐츠 구조 분석 및 행정정보 접근성 개선 등에 활용됩니다.메뉴레벨은 계층 구조를 나타내며, 0은 최상위 메뉴를 의미하고 숫자가 증가할수록 하위 메뉴를 뜻합니다.메뉴번호와 상위메뉴번호는 메뉴 간 계층 관계를 표현하며, 트리형 구조로 콘텐츠 맵을 구성할 수 있습니다.메뉴URL 및 링크URL 항목은 실제 웹페이지 연결 경로이며, _self, _blank 등 링크대상은 열람 방식(현재창/새창)을 설정합니다.하위메뉴 수는 해당 메뉴에 종속된 서브 메뉴의 개수를 의미하며, 웹 콘텐츠 구조 및 페이지 수요 예측에 활용됩니다.본 데이터는 홈페이지 정보 구조 개편, 사용자 접근성 향상, 콘텐츠 운영 관리, 민원/정책 정보 노출 최적화 등에 유용하게 쓰일 수 있습니다.※ 일부 메뉴는 관리자 페이지, 외부연계 시스템, 비공개 영역 등과 연결될 수 있으며, 공개된 URL 구조는 충주시청 웹관리 시스템을 기준으로 정리된 것입니다.
