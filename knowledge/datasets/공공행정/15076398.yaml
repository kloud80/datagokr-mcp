description_portal: 관악구 관내 의류수거함의 상세한 위치정보를 제공하여 쉽게 찾을수 있도록 안내1회서 데이터 등록 요청이며현재 관악구 홈페이지에서 관내 의류수거함 조회가 가능함. 본 데이터는 관악구 관내에 설치된 의류수거함의 위치 정보를 정리한 현황 데이터입니다. 각 의류수거함별로 관리번호(의류수거함 명칭), 도로명주소 형태의 위치, 위도·경도 좌표가 포함되어 있으며, 동 단위·도로 단위의 세부 위치 파악이 가능하도록 구성되어 있습니다. 이 데이터는 지도 기반 위치 시각화, 생활권 내 의류수거함 분포 및 접근성 분석, 수거함 간 거리 및 밀집도 분석 등에 활용할 수 있으며, 자원순환 정책 수립, 불법 투기 취약지역 관리, 수거함 추가 설치 또는 이전 대상지 검토 등 환경·청소·자원순환 행정의 기초자료로 활용될 수 있습니다.(본데이터는 2021년 기준 데이터 입니다.)
