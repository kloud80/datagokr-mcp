summary_user: 농식품공공데이터포털에 개방된 유통 분야 데이터의 목록을 데이터셋·데이터 단위로 담은 메타데이터 목록으로, 데이터셋명·설명·담당 기관과 담당자·키워드·제3자권리·이용허락범위·업데이트주기·제공 형태(오픈API·파일·지도 등)를 담으며 범위는 전국·비공간이다. 농식품 유통 분석가나 개발자가 '농산물 유통 관련 데이터 중 오픈API로 받을 수 있고 상업 이용이 허락된 것은 무엇인가'를 찾을 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 데이터셋명·데이터ID 같은 이름 매핑이나 공공데이터포털URL로 원 데이터셋을 찾아 연결하는 방식으로만 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방한 유통 데이터 목록은 농림수산식품교육문화정보원에서 제공하는 다양한 정보를 포함하고 있습니다. 이 데이터셋은 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함유무, 상위분류, 제3자권리, 이용허락범위, 업데이트주기, 서비스 유형 등 다양한 정보를 포함하고 있는 자료입니다. 이러한 데이터는 농식품 산업의 유통 현황을 파악하고, 관련 정책 수립 및 연구에 기여할 수 있는 중요한 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있으며, 각 컬럼은 특정한 속성을 가지고 있습니다. 데이터셋ID(문자형) : 고유 동번호로 데이터셋을 식별합니다. 데이터셋명(문자형) : 데이터셋의 이름을 명시하니다. 데이터셋설명(문자형) : 데이터셋의 내용을 설명합니다. 기관명(문자형) : 데이터 제공 기관의 이름입니다. 담당자명(문자형) : 데이터 관련 담당자의 이름을 나타냅니다. 전화번호(숫자형) : 연락 가능한 전화번호입니다. 키워드(문자형) : 데이터와 관련된 키워드를 나열합니다. 기타유의사항(문자형) : 데이터 사용 시 주의사항을 기재합니다.'
