description_portal: 인천광역시 중구 영화관에 대한 정보입니다.인천광역시 중구에는 총 3개소의 영화관이 있습니다.[데이터 설명]파일명 인천광역시 중구 영화관내용 영화관명, 영화관 주소, 상영관수, 좌석수[영화관 설명]영화관(映畵館)은 영화를 상영하기 위해 만들어진 시설을 말한다. 종종 극장과 혼용해서 부르기도 하는데 이는 과거에 본래 영화만 전문으로 상영하지 않거나, 영화 상영 사이에 공연도 했기 때문이다. 그러나 점차 영화만 전문적으로 보여주는 경향이 강해졌으며 극장이 연극 등 다양한 공연도 볼 수 있는 공간이라면, 영화관은 오직 영화 상영만을 위한 전문 시설이라는 인식이 강하다. 여기에 최근에는 쇼핑몰과 오락 시설이 함께 입점한 경우가 많다.
