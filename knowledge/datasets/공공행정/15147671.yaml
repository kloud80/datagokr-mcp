summary_user: 정부조직관리시스템의 정부기관 기구정보를 조직개편(법령 제·개정) 일자별로 담은 파일로, 기관마다 근거 법령(법령명·제정일자), 기관 전체명·약어·영문명, 상위·최상위 기관코드, 기관간 차수와 서열, 등록·종료일자를 행 단위로 기록한다. 분석가가 "특정 시점에 어느 부처 아래 어떤 기구가 있었고, 어떤 법령 개정으로 신설·폐지됐는가" 같은 정부조직 변천을 추적하는 데 쓴다. 기관코드(instt_cd)로 code.go.kr 행정표준기관코드 등 다른 기관 단위 데이터와, 법령아이디(law_id)로 법령정보와 잇고, 상위기관코드로 자기 참조해 조직 계층을 구성한다.
description_portal: 정부조직관리시스에서 사용하는 정부기관의 중분류에 대한 데이터입니다. code.go.kr 등 기관코드와 함께 데이터를 가공해서 쓰시면 됩니다.정부조직도 조직개편일자 기구정보  법령아이디 법령명, 법령제정일자, 기관전체명, 기관약어, 기관영문, 기관영문약어 기관간차수 등의 레이블을 가지고 있으므로 데이터를 참조하시여 필요에 맞게 수정하시기 바랍니다. 해당 데이터는 연에 한번씩 현행화 할 예정이며 테이블 형식도 필요에 따라 변경될 수 있으니 데이터 활용시 업무에 참고하시기 바랍니다.
