summary_user: 한국남부발전이 생산한 문서를 한 건씩 담은 목록으로, 문서제목·담당자명·생산일자·문서번호·보존기간·공개여부를 담는다(CSV 약 11MB, 전국·비공간). 정보공개청구를 준비하는 국민이나 공공기관 투명성을 보는 분석가가 '이 문서가 존재하는지, 공개·부분공개·비공개 중 무엇인지, 보존기간은 얼마인지'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명이나 문서제목 같은 이름 매칭으로만 잇는다.
description_portal: 이 데이터는 한국남부발전의 문서정보 목록을 정리한 자료입니다. 각 문서의 제목, 담당자명, 생산일자, 문서번호, 보존기간, 공개여부 등의 항목으로 구성되어 있으며, 영구·30년·10년 등 보존기간에 따라 문서 관리 체계를 구분하고 있습니다. 또한 공개, 부분공개, 비공개 여부를 통해 대국민 정보 접근 가능성을 확인할 수 있습니다. 자료에는 육아휴직, 보건경영 추진계획, 기자재 구매계약 등 다양한 행정·경영 관련 문서가 포함되어 있어 공기업의 의사결정 및 업무 추진 과정을 파악할 수 있습니다. 본 데이터는 문서관리와 기록물 보존정책을 이해하는 데 도움이 되며, 공공기관의 정보공개 제도 운영과 행정 투명성을 평가하는 데 기초 자료로 활용될 수 있습니다.
