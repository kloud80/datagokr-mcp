description_portal: 이 데이터는 기술보증기금이 보유한 부동산 자산의 관리 현황을 정리한 자료로, 전국 지점 사무소 및 직원용 합숙소로 활용 중인 자산의 정보를 포함하고 있습니다. 각 항목에는 관리 지점명, 자산 식별번호, 자산명(소재지), 취득일자, 취득가액, 잔존가액이 포함되어 있으며, 자산별 위치와 회계상 가치 정보를 확인할 수 있도록 구성되어 있습니다.해당 부동산은 기금의 영업점 운영 기반을 확보하기 위한 사무공간 또는 격지 근무자의 숙소 및 복지 목적으로 취득한 자산으로, 업무 수행 및 내부 운영 편의를 위한 용도로 활용되고 있습니다.취득일자와 함께 기록된 취득가액 및 잔존가액은 각 자산의 취득 시점과 현재 회계상 평가 가치를 나타내며, 자산의 회계적 관리 및 유지 상태를 수치로 확인할 수 있습니다.
