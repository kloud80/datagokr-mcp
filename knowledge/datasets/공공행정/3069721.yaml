summary_user: 조달청이 총사업비관리대상사업의 실시설계 도서를 검토한 사례를 구분·현재설계내용·검토내용·증감액 단위로 정리한 전국 범위 파일(zip, 약 118MB)이다. 공공 건설사업 발주기관이나 설계사가 '설계적정성 검토에서 어떤 설계 항목이 어떤 이유로 얼마나 증감 조정됐나'를 찾아 비슷한 사업의 설계 개선에 참고할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 나라장터 입찰·계약 데이터와는 사업명 같은 이름 매핑으로만 이어 쓸 수 있다.
limits: 파일 컬럼이 '2. 실시설계 도서 검토'와 이름 없는 열들로 파싱되어 머리행이 여러 줄로 된 문서형 표로 보이므로, 쓰기 전에 열 이름을 다시 정리해야 한다. 공통 사업번호나 통합 조달번호가 없어 나라장터 발주·계약 원장과 직접 결합할 수 없다.
