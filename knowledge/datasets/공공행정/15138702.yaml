summary_user: 지방자치단체가 편성한 성인지예산이 회계연도 종료 후 어떻게 집행됐는지를 담은 전국 단위 결산 현황입니다. 필드 구성상 회계연도·자치단체(광역 소속 포함)별 금액 두 가지와 비율을 담은 집계로 보이며, 포털 설명의 사업별 성과지표·성별 수혜자 통계까지 응답에 있는지는 확인되지 않았습니다. 분석가나 주민이 "우리 지자체가 성인지예산을 얼마나 결산했고 비율은 어떤가"를 연도·지자체별로 비교할 때 쓰며, 전역 조인 키는 없어 지방재정365의 다른 공시와 자치단체 코드(laf_cd)나 이름으로 맞춰 잇습니다.
description_portal: 성인지결산현황이란 지방자치단체가 성인지예산을 편성한 이후, 해당 예산이 실제로 성평등 목표 다성에 어떻게 기여했는지를 회계연도 종료 후 평가, 분석하여 보고하는 자료입니다.성인지예산은 정책이나 사업이 남성과 여성에게 미치는 영향을 고려하여 예산을 편성하는 방식으로, 성인지결산은 이 예산이 계획대로 집행되었는지, 성평등에 기여했는지를 확인하는 절차입니다.성인지결산현황에는 각 사업의 집행결과, 성과지표 달성 여부, 성별 수혜자 통계, 사업의 성평등 기여 분석 등이 포함되며, 이를 통해 사업의 효과성과 성평등 관점 반영 여부를 종합적으로 평가할 수 있습니다.
