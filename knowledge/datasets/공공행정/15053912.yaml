description_portal: 본 데이터는 대구도시개발공사에서 추진하는 주거환경개선사업의 세부 추진 현황을 체계적으로 관리하고 공개하기 위해 구축된 공공데이터입니다. 사업지구, 위치, 면적, 사업비, 건립규모(동), 건립규모(층), 건립규모(세대), 분양, 공공임대, 공사시작일, 공사종료일, 비고의 항목으로 구성됩니다. 이를 통해 도시 내 노후 주거지 개선, 주거복지 향상, 생활 인프라 확충 등의 추진 실태를 확인할 수 있습니다. 또한 지역 간 개발 격차 해소, 균형 있는 도시발전과 주거복지 정책 평가를 위한 주요 근거 자료로 활용될 수 있는 유용한 데이터입니다.
