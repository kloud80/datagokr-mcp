summary_user: SGIS '살고싶은 우리동네' 서비스에 쓰이는 학교별 학생수와 교원1인당 학생수를 학교 한 곳당 한 행으로 담은 전국 단위 CSV 파일(약 74만 바이트)로, 위치 좌표나 행정구역 코드는 없다. 이사할 동네를 고르는 사람이나 교육 여건을 비교하는 분석가가 '이 학교는 학생 규모가 어느 정도이고 교사 한 명이 맡는 학생이 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 학교·지역 데이터와는 학교명(학교명)을 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: '[SGIS 오픈 플랫폼] "살고싶은 우리동네" 서비스의 학교별 학생수 및 교원1인당 학생수 데이터입니다.학교명,학생수,교원1인당학생수을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 살고싶은 우리동네  - 통계에 기반하여 사용자 조건에 맞는 주거지역을 추천해 주는 서비스입니다.  - 이용자는 자연, 주택, 지역 인구, 안전, 생활 편의 교통, 교육, 복지 문화 등 7개 카테고리 총 51종의 주거지 선정 조건에 해당하는 추천지역리스트 및 통계정보를 제공'
