description_portal: '대구광역시 남구의 남구의회 의원정보를 제공하고 있습니다.  2025년도 당해년도 각 의원 별 선거 차수, 의원 별 직위, 9대차수의 각 의원 명단,  의원 별  소속정당, 의원 별 현재 본인이 소속되어 있는 각 상임 위원회 종류에 따른 직위를 구분하여 제공하고 있으며, 2022년도 제9대 선거에서 각 의원별 지역구(가, 나, 다, 비례)를 해당지역에 맞게 선거구 내용을 제공하고 있습니다,  각 선거구의 지역은 가선거구: 이천동, 봉덕 1,2,3동, 대명2,5동의 지역, 나선거구: 대명 1, 3, 4, 10동의 지역, 다선거구: 대명 6, 9, 11동 지역으로 구분되어 해당 의원의 각 정보를 제공하고 있습니다.'
