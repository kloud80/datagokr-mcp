description_portal: '원격탐사응용시스템에서 관리하는 업무변경전의 경지 판독결과 2015년 이전 취합자료입니다.시군구, 경지_코드, 출처, 면적, 기타, 기타추가, 결과_년도 정보를 제공합니다.*참고- 원격탐사: 대상 지역이나 물체에 직접 접촉하지 않고, 위성·항공기·드론 등에 장착된 센서로 전자기파(가시광선, 적외선, 마이크로파 등)를 측정하여 정보를 수집·분석하는 기술-원격탐사응용시스템:  통계청이 위성영상 등 원격탐사 자료를 활용하여 농업·산림 등 경지 면적을 조사·분석하는 시스템으로 농업면적조사(특히 논·밭·과수 등 경지 구분)에 원격탐사 기법을 적용하기 위해 2000년대 후반부터 원격탐사 응용시스템을 구축하였습니다.'
