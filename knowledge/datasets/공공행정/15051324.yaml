summary_user: 전북특별자치도 시군별로 전입·전출 인구를 남녀로 나누고, 도 안의 시군구간 이동과 다른 시도와의 시도간 이동, 순이동(전입-전출)을 함께 담은 시군구 단위 집계 통계다(약 1.3KB의 작은 CSV 파일). 지역 정책 담당자나 분석가가 "어느 시군에서 인구가 타 시도로 가장 많이 빠져나가는가" 같은 인구 유출·입 패턴을 확인하는 데 쓴다. 표준 행정코드 같은 전역 조인 키가 없어, 다른 인구·주택·일자리 통계와는 시군 이름을 행정코드로 매핑해서만 이어 쓴다.
limits: 시군 이름만 있고 행정구역 코드가 없어 다른 데이터와 바로 조인되지 않으므로 이름-코드 매핑이 필요하다. 범위는 전북특별자치도 내 시군구 단위 집계라 읍면동이나 개인 단위 이동 분석에는 쓸 수 없다.
