description_portal: 금정구 관내 행정공공기관현황 (행정공공기관명, 전화번호, 도로명주소, 우편번호, 위도, 경도, 구군명 등)이 기록되어 있는 데이터 입니다.이 데이터는 2025년 12월 23일 기준, 부산광역시 금정구 내에 소재하는 행정 및 공공기관의 목록을 총 60개 이상의 레코드로 상세히 기록한 자료입니다.각 기관에 대해 기관명, 전화번호, 도로명 주소, 우편번호, 그리고 위도 및 경도 좌표를 제공하여 지리적 위치 파악 및 지도 기반 분석이 가능합니다.수록된 기관은 금정구청, 보건소, 도서관, 문화회관 등 주요 시설은 물론, 경찰 지구대 및 치안센터, 행정복지센터까지 포함하여 지역 공공 서비스 인프라의 전반적인 현황을 보여줍니다.
