summary_user: 소방청이 집계한 화재 한 건마다 발생 일시, 시도·시군구, 화재유형, 발화열원·발화요인·최초착화물(대·소분류), 장소(대·중·소분류), 사망·부상 인원과 재산피해를 담은 전국 단위 연간 화재 자료로, CSV 파일(약 6.3MB) 한 개로 받는다. 지자체 안전 담당자나 분석가가 "우리 시군구에서는 어떤 장소에서 어떤 발화요인으로 난 화재가 인명피해를 많이 냈나"를 따지는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 행정구역 코드에 맞춰 붙이는 식으로만 이어 쓴다.
description_portal: 해당 데이터는  각 시도본부별 화재발생 위치, 발화 유형, 발화요인, 최초착화물 종류, 각 화재별  인명 피해자 및 재산 손해에 대해 연간 통계 자료입니다.구성 항목으로는 1. 화재 발생일2. 화재 발생 시도3. 화재 발생 시군구4. 화재유형(건축-구조물, 선박_항공기, 자동차_철도차량, 위험물 가스제도 등)5. 발화 요인 유형(담뱃불, 라이터불, 불꽃, 불티, 작동기기, 폭발물, 폭죽, 마찰, 전도, 복사, 미상, 기타, 화학적 발화열, 자연적 발화열)6. 최초착화물  유형7. 인명 피해 8. 재산피해9. 화재장소 구분(자동차,철도차량, 주거, 의료,복지시설, 산업시설, 선박,항공기, 생활서비스, 임야, 교육시설, 기타서비스, 운수자동차시설, 판매,업무시설, 집합시설, 위험물,가스제조소, 문화재시설) 등이 있습니다.
