description_portal: 본 데이터는 전라남도 보성군에서 담배를 소매로 판매할 수 있도록 지정된 사업장의 현황을 정리한 자료이다. 주요 항목은 소매인 상호, 소재지 등으로 구성되어 있으며, 담배소매인 지정에 따른 관리 및 관련 행정업무의 기초자료로 활용된다. 이 자료는 담배사업법에 따라 정해진 절차에 따라 담배소매인으로 지정된 업체 정보를 체계적으로 제공함으로써, 허가된 유통망의 현황을 지역 주민 및 관련 기관에 명확하게 전달하는 데 목적이 있다. 또한, 담배 유통의 공정성과 유통 질서 유지를 위한 정책 수립 및 집행, 민원 대응 등의 행정 효율성을 높이는 데 기여한다. 정기적인 데이터 갱신을 통해 정확성과 신뢰성을 확보하며, 지역 유통관리의 투명성을 제고하는 데 활용된다.
