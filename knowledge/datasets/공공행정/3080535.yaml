description_portal: 사용전검사는 정보통신공사에서 시공된 설비가 정보통신기술(ICT) 관련 법령과 기술기준에 적합하게 설치되었는지 확인하는 제도입니다. 즉, 건축물이나 시설에서 ICT 기반 통신설비를 사용하기 전에 반드시 품질과 안전성을 검증하는 절차입니다. 구내통신선로 설비 및 방송공동수신설비, 이동통신구내선로 설비 또한 사용전검사 시행시 검증합니다.연면적 150㎡ 이상 건축물에 적용되며, 감리 대상 공사는 제외됩니다현 자료는 부산광역시 남구 관내에서 시행된  사용전검사 현황(건물위치, 교부일자, 공사의종류) 입니다.
