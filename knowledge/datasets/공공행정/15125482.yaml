summary_user: 가맹사업 기준년도와 브랜드관리번호별로 가맹금을 맡긴 예치기관의 상호명, 담당 지점·부서, 주소, 전화번호를 담는 브랜드 단위 원천 데이터로, 범위는 전국입니다. 창업 예정자가 "이 브랜드에 낸 가맹금이 어느 은행·기관에 예치되는지"를 확인하고 해당 지점에 문의할 때 쓴다. 브랜드관리번호와 가맹본부관리번호로 같은 공정위 가맹정보(정보공개서·브랜드·가맹본부) 데이터와 잇지만, 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 기관 데이터와는 이름 매핑으로만 연결한다.
limits: 사업자등록번호·법인등록번호 같은 전역 키가 없어 외부 데이터와 바로 결합하기 어렵다. 조회에는 기준년도와 브랜드관리번호가 필요하고, 개발계정은 일 10,000회로 호출이 제한된다.
