description_portal: 본 데이터는 2022년 12월 31일 기준으로 공공기관에서 운영 중인 폐쇄회로 텔레비전(CCTV) 설치 현황을 집계한 자료입니다. 각 공공기관이 자체 점검을 통해 운영 수량을 확인하고, 이를 개인정보보호 종합지원시스템에 등록한 결과를 기반으로 작성되었습니다. 공개된 장소에 설치되어 일반 국민이 이용하는 시설이나 구역에서 운영되는 CCTV만을 대상으로 하며, 보안상 민감하여 일반인이 접근하기 어려운 비공개 장소에 설치된 CCTV는 제외됩니다. 이 데이터는 공공기관의 설치 목적별 CCTV 운영 현황을 파악하고, 향후 안전 관리 정책과 개인정보 보호 제도 개선을 위한 기초자료로 활용될 수 있습니다. 해당 데이터는 수시(1회성) 데이터입니다.
