description_portal: 공중화장실은 사람들이 자유롭게 이용할 수 있도록 공공장소에 설치된 화장실입니다. 일반적으로 도심, 공원, 지하철역, 고속도로 휴게소, 해수욕장 등 다양한 공공장소에 위치해 있으며, 위생 관리와 접근성이 중요하게 여겨집니다. 공공기관의 공중화장실은 국민 누구나 이용할 수 있도록 설치된 화장실로, 편의성과 접근성을 갖추고 있어야 합니다. 창녕군시설관리공단은 공중화장실 등에 관한 법률에 따라  군립공원, 생태체험장, 추모공원 등 관광시설이나 다중이용시설 및 공공장소에  공중화장실을 설치하고 있으며, 남성용 대변기, 남성용  소변기, 남여공용 화장실, 여성용 대변기수, 여성용 장애인화장실 남성용 장애인화장실, 어린이용 대변기 등 창녕군시설관리공단의 공중화장실 설치현황 데이터를 제공합니다.
