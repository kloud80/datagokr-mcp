description_portal: '남양주시 민원콜센터에 문의하는 시정업무 및 민원 등 상담내용을 유형별로 분류하여 건수 산정한 데이터입니다. 시에서 하는 업무를 크게 기획경제, 복지, 문화교육, 교통차량, 도시기반, 환경위생, 보건행정, 민원행정, 상하수도, 세무행정, 녹지공원, 기타의 12개 분야로 나누어 분류하였습니다.- 기획경제: 일반행정, 예산, 정보통신, 지역경제, 일자리정책, 전략산업, 농업 등- 복지: 복지정책, 노인복지, 장애인복지, 여성아동, 보육정책 등- 문화교육: 문화예술, 미래교육, 청년정책, 문화관광, 체육, 도서관 등- 교통차량: 교통정책, 대중교통, 주차관리, 자동차관리, 도로건설 등- 도시기반: 도로관리, 도시정책, 건축, 토지정보, 기반조성, 도시재생 등- 환경위생: 위생, 환경정책, 기후에너지, 자원순환 등- 보건행정: 보건정책, 건강증진, 정신건강 등- 민원행정: 시민소통, 시민안전, 홍보, 감사, 민원, 의회법무 등- 상하수도: 수도요금, 상수도, 하수도 등- 세무행정: 재산세, 자동차세, 지방소득세, 취득세, 체납, 세외수입 등- 녹지공원: 생태하천, 산림녹지, 공원, 하천공원, 휴양시설 등- 기타: 기타 종료'
