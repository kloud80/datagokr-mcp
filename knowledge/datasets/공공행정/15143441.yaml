description_portal: '해당 데이터는 전라남도 고흥군청에서 운영 및 관리하고 있는 각 부서별 팩스 현황에 대한 기본정보를 제공합니다.각 부서는 군 본청과 직속기관(실단과소) 및 읍면사무소를 의미하며, 전체 부서 수는 총 40개소(실단과소 24개소,  읍면사무소 16개소)입니다.전체 팩스 수량은 총 134대로 실단과소 100대, 읍면사무소 34대입니다해당 공공데이터가 제공하는 기본정보에는 부서명, 팀명(각 부서의 팀, 보건소의 경우 보건지소  등), 팩스번호, 비고(그 외 기타사항)에 대한 내용이 포함되어 있습니다.* (참고1) 읍면사무소의 인구행정팀은 기존 총무팀에서 명칭이 변경된 팀명입니다.* (참고2) 같은 팀이라 하더라도 설치 장소가 다른 경우(예시: 우주발사전망대와 관광안내소) 해당 사항을 비고란에 표시 해두었습니다.'
