summary_user: 지방자치단체별·회계연도별로 공무원 관련 세출예산통계목(보수·기타직보수·공무직근로자보수, 연금부담금·국민건강보험금·공무직 보험료부담금 등)에 편성된 예산액을 일반회계·기타특별회계·공기업특별회계로 나눠 담은 전국 단위 예산 집계 데이터다. 주민이나 분석가가 "우리 시·군·구는 공무원 인건비와 연금·보험 부담금에 예산을 얼마나 편성했나"를 자치단체 간이나 연도별로 비교할 때 쓴다. 전역 조인 키는 확인되지 않았고, 자치단체 코드(laf_cd)·자치단체명과 회계연도(fyr)를 기준으로 같은 지방재정365의 다른 예산·결산 공시 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 지방자치단체가 편성하는 예산정보 중 공무원 관련 경비에 대한 정보입니다. 해당 정보는 자치단체의 일반회계, 기타특별회계 및 공기업특별회계 별로 공무원 관련 세출예산통계목으로 편성된 예산액을 확인할 수 있습니다. 대상 통계목은 인건비에서는 보수(111-01), 기타직보수(111-02), 공무직(무기계약)근로자보수(111-03) 3개 통계목이 제공됩니다, 연금부담금 목에서는 연금부담금(304-01), 국민건강보험금(304-02), 공무직(무기계약)근로자 보험료부담금 등(304-04) 통계목 정보가 제공됩니다.
