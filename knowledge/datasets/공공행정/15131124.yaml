description_portal: 국민신문고는 대한민국 국민이 행정기관, 공공기관, 지방자치단체 등에 대해 민원, 제안, 신고, 정책 참여 등을 온라인으로 통합 신청할 수 있도록 만든 정부 대표 민원 포털입니다.2023년 부터 국민신문고에 접수된 민원을 월별로 구분하고, 각 월의 접수 경로별 현황을 제공합니다. 월별 접수 경로별( 신문고 홈페이지, 부처 홈페이지, 지자체 등 이송이첩, 서신 대통령실) 통계자료입니다.해당 자료를 통해 월별로 어떠한 경로로 민원이 접수되고 있는지 추이을 분석하여 행정정책 수립이나 민원연구에 활용 할 수  있습니다.
