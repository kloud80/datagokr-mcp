summary_user: 서울 강남구에서 키즈카페처럼 안전성 검사 대상이 아닌 유기시설·유기기구를 설치해 운영하는 일반유원시설업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소일자, 영업상태와 폐업·휴업 일자, 주소, 좌표, 시설 면적과 유기시설 수 등을 포함한다. 학부모나 창업자, 상권 분석가가 '강남구에서 지금 영업 중인 키즈카페형 유원시설은 어디이고 최근 몇 곳이 폐업했나'와 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 사업장명·주소를 매칭하거나 같은 출처인 LOCALDATA 인허가 자료의 관리번호(MGTNO)·개방자치단체코드로 연결하고, 좌표(X, Y)를 써서 공간적으로 겹쳐 본다.
description_portal: 서울시 강남구 일반유원시설업 인허가 정보(https://data.seoul.go.kr/dataList/OA-17064/S/1/datasetView.do) 서울특별시 강남구의 키즈카페 등 안전성 검사 대상이 아닌 유기시설 또는 유기기구를 설치하여 운영하는 업소정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
