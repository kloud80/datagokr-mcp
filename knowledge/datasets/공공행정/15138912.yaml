summary_user: 중앙행정기관이 제정·개정한 행정규칙마다 신·구 조문 비교 자료가 있는 규칙을 한 건씩 담은 목록이며, 규칙명·소관부처·발령번호·발령일자·시행일자·제개정 구분을 전국 범위로 제공한다. 분석가나 사업자가 '특정 부처 고시가 최근 언제 개정됐고 신구 조문 비교 자료는 어디서 보나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 신구법ID·신구법일련번호로 같은 기관의 신구법 본문(상세) 조회와 잇고 소관부처코드·규칙명 매핑으로 다른 법제 데이터와 연결한다.
description_portal: 법제처 국가법령정보센터에서 서비스하는 행정규칙 신구법 비교(목록) 정보를 제공하는 데이터  입니다. 본 서비스는 중앙행정기관에서 제정하거나 개정한 행정규칙에 대해 신·구 조문을 비교한 자료의 목록을 제공합니다. 데이터는 행정규칙명, 소관 부처, 고시 번호, 고시 일자, 시행 일자, 비교 대상 여부 등의 항목으로 구성되어 있으며, 이용자는 목록을 통해 각 행정규칙의 본문 비교 자료로 연결할 수 있습니다. 목록에 포함된 정보는 규칙의 개정 이력을 체계적으로 확인할 수 있도록 정리되어 있으며, 규정 간 문구 수정, 조문 삭제, 신설 여부 등 주요 변경사항을 파악하는 데 유용합니다. 본 데이터는 행정규칙의 변동 추이를 명확히 하고, 법제업무의 일관성 있는 운영과 규정 적용의 정확성을 지원하기 위해 활용됩니다.
