description_portal: '생활밀착형 개인서비스 품목별 요금 현황을 수록한 데이터.품목명, 규격 및 단위, 전월 및 금월 평균 요금, 차액, 그리고 행정동별 세부 요금을 포함하여 지역별 생활비 변동을 파악할 수 있다.지역 주민의 생활물가 안정 관리, 동별 비교 분석, 물가 모니터링 및 행정 정책 수립 자료로 활용 가능하다.활용 목적 및 특징– 품목별 개인서비스 요금의 변동 추이 분석– 전월·금월 평균 요금 비교를 통한 물가 변화 파악– 행정동별 요금 차이를 고려한 지역별 특성 분석– 생활물가 안정화 및 소비자 정책 수립 자료 활용주요 항목 설명● 구분: 개인서비스 항목의 대분류 구분● 품목명: 서비스의 세부 품목명● 규격 및 단위: 요금 산정 기준이 되는 규격과 단위● 전월평균/금월평균: 전월 및 금월 평균 요금● 차액: 전월 대비 요금 증감액● 행정동별 요금: 부평1동~십정2동 등 세부 행정동별 서비스 요금'
