description_portal: 부산광역시 남구 인구 현황에 대한 데이터 입니다.매월 말일 기준 각 행정동별 세대수, 인구수(남자,여자),18세 이상의 인구수(남자,여자), 65세 이상의 인구수(남자,여자)에 대한 정보와행정동별 통,반 및 면적에 대한 항목을 제공합니다.포함되는 인구수에는  거주자와 거주불명자, 재외국민이 있으며 외국인과  말소자는 제외되었습니다. 2026년 7월 말 기준 부산 남구는 121,987세대,  인구수 254,774명으로  전월 대비 255세대, 361명 증가했습니다. 인구증가율 최고동은 문현4동, 인구감소율 최고동은 대연5동입니다.
