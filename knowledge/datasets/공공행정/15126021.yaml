summary_user: 역대 국회의 대수(UNIT_CD·UNIT_NM)별로 국회의장·부의장 등 의장단의 성명, 선출 연도, 비고를 담은 목록형 데이터로, 범위는 전국·비공간이다. 국회사를 정리하는 연구자나 기자가 '제몇 대 국회의 의장과 부의장은 누구였고 언제 선출됐나'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 국회 대수 코드나 의원 이름을 매개로 같은 기관의 다른 국회 의정활동 데이터와 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
