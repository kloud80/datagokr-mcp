description_portal: 공공기관의 정보공개 의무 강화 및 행정 투명성에 대한 시민적 요구가 높아지는 가운데, 충청남도 보령시는 누리집을 통해 제공하고 있는 사전정보공표목록을 파일데이터로 제공합니다. 본 데이터는 공표목록, 공표항목, 공표시기, 등록일, 데이터기준일자 항목으로 구성되어 있으며, 보령시가 자발적으로 공개하는 행정정보의 종류와 공표 일정을 한눈에 파악할 수 있도록 정리되어 있습니다. 지자체 및 행정 관련 기관은 본 데이터를 통해 사전정보공표 항목의 현황을 분석하고, 정보공개 범위 확대 및 공표 체계 개선 방안 수립에 활용할 수 있습니다. 또한 연구기관 및 시민단체에서는 공표 항목과 시기 데이터를 바탕으로 지자체 행정 투명성 수준 평가 및 정보공개 제도 개선 연구에 기여할 수 있으며, 시민과 언론에서는 보령시의 공개 행정정보 현황 파악 및 알권리 보장 모니터링에 본 데이터를 활용할 수 있습니다. 보다 자세한 정보는 보령시 누리집(https://www.brcn.go.kr/prog/openInformation/advanceInformation/kor/sub01_01_03/list.do)을 이용하시기 바랍니다.
