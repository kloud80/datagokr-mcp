summary_user: 경기도 용인시 안의 착한가격업소를 업소 한 곳당 한 줄로 담은 원장 파일로, 업소명·주소·전화번호·주요 취급품목·가격(원)·데이터기준일자를 담는다(CSV 약 12KB, 시군구 범위의 개별 업소 단위). 시민이 '우리 동네에서 싼 가격에 식사·이용할 수 있는 착한가격업소는 어디이고 대표 품목 가격은 얼마인가'를 찾거나, 분석가가 용인시 착한가격업소의 분포와 품목별 가격 수준을 비교하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소·업소명 매칭으로만 이으며, 같은 성격의 LOCALDATA 인허가 업소 원장과 주소·상호 기준으로 대조해 상권 분석 원료로 쓴다.
description_portal: 본 데이터는 경기도 용인시 내 착한가격업소의 현황 정보를 제공한다. 착한가격업소란 합리적인 가격과 우수한 서비스로 지역사회에 기여하는 업소를 의미하며, 본 데이터는 업소명, 주소, 전화번호, 주요 취급품목, 가격 등으로 구성된다. 이를 통해 용인시 전역의 착한가격업소 분포와 업소별 제공 품목, 가격 현황을 한눈에 파악할 수 있다. 데이터는 소비자와 지역주민에게 합리적인 소비처를 안내하고, 소상공인 지원 정책 수립, 지역 경제 활성화, 가격 비교 분석 등 다양한 목적으로 활용할 수 있다. 또한, 행정기관 및 정책 담당자, 연구자, 일반 시민의 정보 접근성을 높이기 위해 정기적으로 갱신된다. 공공데이터 개방을 통해 정보의 신뢰성과 투명성을 강화하고, 지역 내 건전한 가격 질서 확립과 소비자 보호, 지역경제 활성화에 기여하는 것을 목표로 한다.
