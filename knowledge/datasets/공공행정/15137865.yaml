description_portal: 본 데이터는 경기도 광주시의회 홈페이지에서 관리하는 정당 정보를 제공합니다. 시의회 의원들이 소속된 정당의 기본 정보를 체계적으로 관리하는 자료를 담고 있습니다. 고유번호는 각 정당을 식별하는 코드이며, 정당 코드는 시스템에서 사용하는 관리 코드를 나타냅니다. 정당명은 한글 명칭을 제공하고, 영문 정당명과 중문 정당명은 다국어 서비스를 위한 정보입니다. 정렬순서는 홈페이지에 정당 정보를 표시할 때의 순서를 결정합니다. 본 데이터는 의원 프로필 관리, 의회 구성 현황 제공, 교섭단체 정보 관리, 의정 통계 분석 등에 활용됩니다.
