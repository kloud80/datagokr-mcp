summary_user: 경기도 행정동(읍면동) 단위로 기준년월·중분류 업종별 지역화폐 매출금액과 활성화비율을 담은 월별 집계 자료다. 지역경제 분석가나 정책 담당자가 "우리 시의 어느 동, 어떤 업종에서 지역화폐 소비가 늘거나 줄었나"를 따져 소비 활성화 대상 지역을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(admdong_cd)와 업종코드를 이름·코드 매핑하거나 같은 기관의 상권·인허가 자료와 코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 행정동 단위의 지역화폐 사용 현황을 월별로 기록한 자료로, 소비 활성화 정책 수립 및 지역경제 분석을 위한 기초 데이터를 제공합니다. 주요 항목에는 기준년월, 행정동코드, 중분류업종코드, 매출금액, 활성화비율 등이 포함되어 있으며, 각 항목은 특정 시점의 지역별·업종별 소비 활동을 수치로 나타냅니다. 중분류업종코드 업종군 식별자로, 산업별 소비 트렌드 분석에 유용합니다. 이 데이터를 통해 행정동 단위의 소비 분포를 파악하고 지역화폐의 경제적 파급효과를 평가할 수 있습니다. 데이터 활용 시에는 기준년월을 기준으로 시계열 분석을 수행하거나, 활성화비율을 바탕으로 정책 대상 지역을 선별할 수 있습니다.
