description_portal: 관보는 국가가 국민에게 널리 알릴 사항을 수록하여 발행하는 국가의 공식 기관지로 '관보'라는 제호로 발간되는 정기간행물입니다. 관보는 헌법개정, 법률, 조약, 대통령령, 총리령 및 부령의 공포와 헌법개정안, 예산 및 예산 외 국고부담계약의 공고 수단입니다. 또한, 법령 공포, 대통령·국무총리훈령 및 대통령·국무총리 지시사항, 각급 기관의 인사발령 통지 등 정부 기관간의 공문 시행을 대체하는 역할을 합니다.이 데이터는 발행된 관보를 다양하게 분석한 결과를 제공합니다. 편찬구분별 현황, 발행기관별 현황, 키워드 분석, 주간 키워드 동향 정보를 제공하여 관보 발행 동향을 종합적으로 파악할 수 있습니다. 분석 결과는 PDF로 내려받아 활용하실 수 있습니다.
