description_portal: 본 데이터는 공공기관 경영실적에 대한 정부의 평가 결과 중 한국중부발전의 연도별 종합 등급 현황을 정리한 자료입니다. 항목은 연도, 상대종합등급, 절대종합등급으로 구성되어 있으며, 상대등급은 타 기관과의 성과 비교를 바탕으로 평가한 등급이고, 절대등급은 자체 성과 목표 달성도를 기준으로 평가한 등급입니다. 이 자료는 경영성과의 연도별 변화 추이, 성과 개선 수준, 타 공공기관 대비 위치 등을 파악하는 데 활용 가능합니다. 또한 기관의 내부 경영 진단, 외부 감사 대응, 공공기관 평가체계 분석의 기초 자료로도 활용 가능합니다.
