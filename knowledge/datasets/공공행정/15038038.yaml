summary_user: 인천광역시의회에 제출된 의안을 건별로 담은 파일로, 대수·회기·의안번호·의안명·의안종류와 발의자, 소관위원회 회부·상정·의결일, 본회의 처리결과, 집행부 이송·공포일자 등 처리 경과를 행마다 기록한다(CSV 약 28만 바이트). 시민이나 분석가가 '특정 조례안이 언제 누구에 의해 발의돼 어느 위원회를 거쳐 가결·공포됐는가' 또는 '회기별로 어떤 종류의 의안이 얼마나 처리됐는가'를 확인하는 데 쓴다. 다른 데이터와 바로 붙일 전역 조인 키는 없으므로, 의안명·공포번호·공포일자로 인천광역시 자치법규나 다른 지방의회 의안 데이터와 이름·번호를 맞춰 연결한다.
limits: 인천광역시의회 한 곳의 의안만 담고 있어 다른 시도 의회와 비교하려면 별도 데이터를 모아 이름·코드를 맞춰야 한다. 공통 코드 체계의 조인 키가 없어 자치법규·예산 데이터와의 연결은 의안명이나 공포번호 매칭에 의존한다.
