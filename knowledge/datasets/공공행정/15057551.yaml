summary_user: 경기도청·시청·군청과 읍면동 단위 출장소 등 경기도 내 청사를 한 건씩 담은 원장으로, 시군명·구분명(도청·시청·군청 등)·전화번호·도로명/지번 주소·우편번호·WGS84 위경도를 행정기관 개별 단위로 제공한다. 주민이 가장 가까운 시청·출장소의 위치와 연락처를 찾거나, 분석가가 시군별 관공서 분포와 접근성을 지도에서 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명 매핑이나 주소·좌표 기반 공간 결합으로 이어 써야 하며, 주민센터·무인민원발급기 등 좌표가 있는 다른 생활 행정시설 데이터와 함께 겹쳐 보는 용도에 맞다.
description_portal: 본 데이터는 경기도를 포함한 시군구 및 읍면동 단위의 청사와 출장소 현황을 제공하는 자료입니다. 데이터에는 시군명, 구분명(도청, 시청, 군청 등), 전화번호안내, 소재지(도로명 및 지번주소), 우편번호, 위도·경도 좌표(WGS84 기준) 등이 포함되어 있으며, 각 항목은 공공기관 위치 확인, 민원안내 시스템 구축, 행정서비스 접근성 분석 등 다양한 행정업무 및 공간정보 서비스 개발에 활용될 수 있습니다. 수집 기준일(집계일자)은 기관별로 상이할 수 있으며, 데이터는 수시로 갱신되며 Open API 형태로도 제공됩니다. 특히 위경도 정보는 행정기관의 위치 기반 서비스 및 GIS 연계에 유용하며, 공공기관의 분포를 시각화하거나 시민 접근성 개선을 위한 기초자료로 활용할 수 있습니다.
