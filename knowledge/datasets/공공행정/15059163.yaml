summary_user: 부산광역시 반여농산물도매시장에 반입된 농산물의 물량과 금액을 도매법인(cmpName)·품목(midName)·거래일자(saledate)별로 담은 API 데이터로, 포털 설명상 품목별 정보는 최근 7일분만 제공된다. 산지 출하자나 유통업자가 최근 일주일 동안 반여시장에 어떤 품목이 얼마나 들어왔고 거래금액은 얼마였는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 도매시장 경락·반입 데이터와는 품목명·법인명과 날짜를 맞춰 이어 써야 한다.
description_portal: 부산광역시 반여농산물도매시장내에서 거래되는 농산품의 실시간 경락정보(날짜, 도매법인, 품목, 품종, 단량, 등급,  반입일자, 물량(kg), 금액(최저가, 최고가, 평균가) 등)실시간 경락정보, 반입물량정보 내 품목별 정보는 7일간의 정보만 제공됩니다. 제공되는 데이터를 통해 거래되는 농산품의 일일가격정보, 주간평균경락가격, 월간평균경락가격 조회가 가능합니다.
