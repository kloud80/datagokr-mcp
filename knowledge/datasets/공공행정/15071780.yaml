summary_user: 서울시 종합체육시설업 사업장을 한 건씩 담은 인허가 원장으로, 사업장명·인허가일자·인허가취소일자·영업상태와 상세상태·폐업일자·휴업 기간·지번과 도로명 주소·전화번호·좌표(X, Y)·최종수정 시점을 담는다. 체육 인프라를 분석하는 사람이나 창업을 검토하는 사업자가 '우리 구에서 영업 중인 종합체육시설은 어디이고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE)로만 연결하며, LOCALDATA 인허가 자료와 같은 원천이다.
limits: data.seoul.go.kr 외부 사이트에서 별도 인증키(KEY)를 받아 호출해야 하며 공공데이터포털 활용신청과는 별개다. 공통 조인 키가 없어 행정동·상권 단위 통계와 붙이려면 주소나 좌표로 직접 매핑해야 한다.
