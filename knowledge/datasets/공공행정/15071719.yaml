summary_user: 서울시 유통전문판매업소를 업소(관리번호) 한 건씩 담은 인허가 원장으로, 인허가일자·폐업일자, 영업상태·상세영업상태, 지번·도로명주소와 좌표, 업태, 종사자 수, 보증금·월세, 시설 규모 등을 함께 담는다. 상권 분석가나 창업 준비자가 "특정 지역에서 영업 중인 유통전문판매업소가 몇 곳이고 언제 문을 열고 닫았는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 잇고, 같은 원천을 공유하는 LOCALDATA 인허가 자료와 함께 상권·점포 이력 분석 원료로 쓴다.
description_portal: 서울시 유통전문판매업 인허가 정보는 통신판매, 방문판매 등 유통을 전문으로 하는 판매업소에 대한 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소일자, 폐업·휴업·재개업일자와 영업상태·상세영업상태를 통해 업소의 행정 이력과 현재 영업 여부를 파악할 수 있습니다. 지번·도로명주소, 우편번호, 좌표, 사업장명, 전화번호로 위치와 기본 정보를 제공하며, 업태구분명, 위생업태명, 주변환경, 등급, 급수시설 등은 업종·입지·위생 특성을 보여 줍니다. 종사자수, 총인원, 건물소유형태, 보증금·월세, 시설총규모 등은 고용 구조와 경제 규모, 시설 규모 분석에 활용할 수 있고, 다중이용업소 여부와 전통업소 관련 정보, 홈페이지 보유 여부 등은 안전관리, 전통상권 육성, 온라인·오프라인 유통 특성 파악에 도움을 줍니다.
