description_portal: '중장기 개방계획에 따른 강원특별자치도 강릉시가 시민의 알 권리 보장을 위해 사전에 공표하는 행정 정보 목록 데이터입니다.본 데이터는 공표목록, 분류, 담당부서, 공표주기, 공표시기, 공표형태, 등록일, 링크주소 항목으로 구성되며, 각 항목의 설명은 다음과 같습니다.공표목록: "관용차량 운영현황", "공동주택 현황" 등 공표하는 정보의 명칭(제목)분류: "일반공공행정", "지역개발" 등 정보의 분야담당부서: 해당 정보를 관리하고 공개하는 부서명공표주기 / 공표시기: 정보가 공개되는 빈도(예: 매년)와 시점(예: 연말)공표형태: 정보 제공 방식 (예: 게시판, 링크)등록일: 데이터가 등록된 날짜링크주소: 해당 정보 페이지로 이동할 수 있는 URL이 자료는 강릉시가 생산·보유한 주요 정보를 시민들이 청구하기 전에 미리 파악할 수 있도록 정보 목록과 공표 시기, 접속 경로(링크주소)를 제공하여 행정의 투명성을 높이는 데 활용됩니다.'
