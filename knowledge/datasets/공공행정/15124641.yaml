summary_user: 경기도 오산시에서 기계설비법에 따라 성능점검 보고서를 제출해야 하는 건축물(연면적 1만㎡ 이상 일반건축물, 500세대 이상 공동주택, 중앙집중난방 300~500세대 공동주택)을 건물 단위로 담은 목록이며, 건물명·지번·도로명주소·연면적·주용도·세대수·성능점검 여부·기준일자를 포함한 약 21KB 규모의 CSV 파일입니다. 오산시 건물 관리자나 기계설비 유지관리 사업자가 '우리 건물이 성능점검 대상인지, 점검 현황이 어떤지'를 확인하거나, 분석가가 시 안의 점검 대상 건축물 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지번·도로명주소 같은 주소 문자열을 매칭해 건축물대장 등과 연결해야 한다.
description_portal: 기계설비법 제17조(기계설비 유지관리에 대한 점검 및 확인 등)에 의거하여 기계설비의 점검일자, 점검대상설비유형, 점검항목별 결과 및 개선조치등이 담긴 보고서를 제출 받음으로써 기계설비의 안전하고 효율적인 유지관리를 위하여 국가경제의 발전과 국민의 안전 및 공공복리 증진에 이바지함을 목적으로 함. 해당 데이터는 이러한 보고서 제출이 필요한 건축물(연면적 1만제곱미터 이상의 일반건축물, 500세대 이상의 공동주택, 중앙집중(지역)난방 방식을 취하는 300~500세대 공동주택) 현황을 나타냄.
