summary_user: 행정동 단위로 통·반별 총인구수, 세대수, 세대당 인구, 남녀 인구와 남녀비율을 월별로 담은 주민등록 집계 데이터이다(검증 시 전국 42행 수신). 지자체 담당자나 분석가가 특정 행정동의 통·반별 인구와 세대 규모가 어떻게 분포하는지 확인하는 데 쓴다. 행정기관코드(admmCd)와 통계년월(statsYm)로 같은 기관 코드 체계의 다른 행정동·월 단위 자료와 이어 쓰며, 시도명·시군구명·행정동명은 이름 매핑에 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있다. 건별 개인 정보가 아니라 통·반 단위 집계이므로 그보다 세밀한 분석은 할 수 없다. 개발계정은 일 10,000회까지 호출할 수 있다.
