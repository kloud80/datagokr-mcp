description_portal: 2017년부터 2020년까지의 플러그인 사용 및 미사용 웹사이트 수를 분석한 통계 자료입니다. 본 자료는 특히 2020년 기준 민간 500대 웹사이트를 대상으로 수행한 플러그인 사용 현황 조사를 중심으로 작성되었습니다. 조사 결과에 따르면, 2017년 말 대비 ActiveX의 사용은 91.0% 감소하여 810개에서 73개로 줄었고, 전체 플러그인 수 역시 89.0% 감소하여 2,266개에서 248개로 줄어드는 등 전반적인 사용량이 크게 감소한 것으로 나타났습니다. 이러한 변화는 간편결제나 앱카드와 같은 대안 서비스를 함께 제공함으로써 사용자 접근성과 호환성을 개선하려는 민간 부문의 지속적인 노력에 기인한 것으로 분석됩니다. 이 결과, 조사 대상 웹사이트의 약 80.4%는 더 이상 플러그인을 요구하지 않는 ‘플러그인 제로(No Plugin)’ 환경으로 전환된 것으로 나타났습니다. 이 통계는 국내 웹 환경의 변화 추세를 보여주는 중요한 지표로 활용됩니다.
