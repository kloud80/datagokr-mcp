summary_user: 전주시 관내 버스정류장을 한 곳씩 적은 건별 목록으로, 정류장명·정류장번호·위도·경도를 담고 전체 3,114건이 시군구 범위로 수록되어 있다. 시민이나 개발자가 특정 지역 주변에 어떤 정류장이 있는지 지도에서 찾거나 대중교통 접근성을 따져볼 때 쓴다. 위도·경도(좌표 키)로 다른 좌표 데이터와 공간 결합할 수 있고, 정류장번호는 노선·교통정보와 잇는 용도로 설명되어 있으나 실측된 조인 키는 좌표뿐이다.
limits: 실측으로 확인된 조인 키는 위도·경도뿐이라 정류장번호를 이용한 노선 데이터 연계는 이 자료만으로 검증되지 않았다. 노선·배차·도착 정보는 담지 않으며, 포털 파일(CSV) 형태로 받는 자료다.
