summary_user: 경기도 내 읍면동 단위로 지역화폐 분석용 소지역을 나눈 지도형 공간 데이터로, 기준년도·지역화폐소지역ID·읍면동코드와 함께 다각형 경계(MULTIPOLYGON) 형상을 담는다. 분석가나 지자체 담당자가 "우리 시 지역화폐 결제가 어느 동네에 몰리는가"처럼 지역화폐 매출·이용 현황을 지도 위에 그려 볼 때 경계 레이어로 쓴다. 실측상 전역 조인 키는 없어 읍면동코드(emd_cd)나 지역화폐소지역ID로 같은 경기데이터분석포털의 지역화폐 집계 자료와 이름·코드 매핑해 잇는다.
description_portal: 이 데이터는 경기데이터분석포털에서 지역화폐 분석을 위한 경기도 내 읍면동 단위의 지도형 공간 정보를 포함한 자료입니다. 각 지역은 고유의 ‘지역화폐소지역ID’와 ‘읍면동코드’를 기준으로 식별되며, ‘위치정보’ 항목에는 공간 분석용 좌표계 기반 다각형 형상 정보(MULTIPOLYGON)가 저장되어 있어 GIS(지리정보시스템) 분석에 활용될 수 있습니다. '기준년도'를 포함하여 시점별 공간 정보를 분석할 수 있으며, 상권 분석, 지역별 매출 현황 시각화, 정책 효과 공간 모니터링 등에 활용 가능합니다. 이 데이터는 일반적인 표 형식의 통계자료와 달리, 지도 위 시각화가 가능한 지오메트리 데이터를 포함한 것이 특징입니다.
