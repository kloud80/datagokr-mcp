summary_user: 법령의 조문 하나하나를 기준으로, 그 조문에 연계된 자치법규 수를 전체 건수와 17개 시·도 및 교육청별 건수로 나누어 담은 전국 범위의 비공간 데이터다. 지자체 법무담당자나 정책 분석가가 특정 법령 조문의 위임을 받아 조례·규칙을 둔 시·도가 어디이고 몇 건인지 확인할 때 쓴다. 전역 조인 키는 없으므로 같은 기관인 법제처의 법령 데이터와 법령ID·소관부처코드로 잇거나, 법령명·조문번호로 맞춰 연결한다.
description_portal: 법제처_법령‑자치법규 연계현황 조회 데이터는 법령과 지방자치단체 자치법규 간 위임 관계에 대한 연계 정보를 제공합니다. 본 데이터는 개별 법령이 어떤 자치법규와 연관되어 있는지 파악할 수 있도록 구성되어 있으며, 관련된 자치법규의 명칭, 공포일자, 시행일자, 제‧개정 구분 및 법령과의 연계 구조 등을 포함합니다. 이를 통해 법령과 자치법규의 계층적·논리적 연계를 시각화하고, 법제 행정 및 정책 수립 시 상위 법령의 위임 범위와 자치법규의 대응성을 분석할 수 있습니다. 또한 법령정보시스템과 자치법규정보시스템 간 데이터 정합성을 검증하고, 법령 정비 및 자치법규 개선 업무에 유용하게 활용될 수 있습니다.
team:
  dept: 법제처
