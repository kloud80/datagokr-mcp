description_portal: '부산광역시 서구에 소속된 행정기관 정보에 대한 데이터로서 구청 및 13개 동 주민센터, 보건소 등의 항목을 제공합니다.데이터에는 기관명, 도로명주소, 전화번호, 위도·경도 좌표, 우편번호, 데이터 기준일자 등의 항목이 포함되어 있으며, 이를 통해 행정동별 공공기관 분포 현황, 지역별 생활 SOC 접근성, 공공서비스 제공 범위 등을 종합적으로 확인할 수 있습니다.본 데이터는 공공기관 위치 기반 서비스 개발, 행정 서비스 접근성 분석 등 다양한 분야에서 활용될 수 있습니다.** 항목별 설명행정공공기관명: 해당 기관의 명칭(예: 서구청, 동 주민센터 등)도로명주소: 기관의 위치를 나타내는 도로명 기반 공식 주소전화번호: 기관의 대표 연락처위도·경도: 지도 기반 위치 확인을 위한 좌표값우편번호: 기관 소재지의 우편번호'
