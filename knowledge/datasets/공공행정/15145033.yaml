description_portal: 해당 데이터는 2025 글로벌 데이터 해커톤 대회(DIVE 2025)에 데이터 제공을 목적으로 정리된 인사 채용 데이터 입니다.2020 ~ 2024년 채용(일반직, 공무직, 청년인턴)에 대한 정보, 신규 채용현황, 채용경쟁률 현황을 나타냅니다.채용 정보에는 공고명, 접수시작일, 접수방법, 채용인원, 채용방법, 임용조건 등의 데이터가 있으며,신규 채용현황에는 2020 ~ 2024년간 채용된 인원 수를 나타냅니다.채용경쟁률 현황에서는 전형, 직렬별 선발인원 및 지원인원, 경쟁률, 필기 합격선의 정보 등을 제공합니다
