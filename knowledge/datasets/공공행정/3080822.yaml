description_portal: "전북특별자치도 내에서 지역 주민들이 주도하여 운영하는 '마을기업'의 현황을 정리한 데이터입니다. 이 자료는 각 시군에 위치한 마을기업의 명칭과 주요 업종(제조, 서비스, 농업 등), 그리고 지역 자원을 활용해 생산하는 핵심 품목(예: 청국장, 모주, 공예품, 농촌체험)을 상세히 보여줍니다. 이 데이터는 지역 주민들의 자발적인 참여를 통해 일자리를 창출하고 지역 경제에 활력을 불어넣는 사회적경제 조직의 현황을 파악하는 데 유용합니다. 또한, 윤리적 소비나 공정 여행에 관심 있는 소비자에게는 지역의 가치를 담은 상품과 서비스를 제공하는 업체를 찾는 좋은 안내서가 될 수 있습니다."
