summary_user: 경기도 경기통계시스템의 통계표별 차원 구조를 담은 메타정보로, 한 행이 통계표 하나의 특정 차원·지표 단위이며 통계표 ID(stats_tbl_id)·생산 조직번호·공표구분·최종수정일을 담는다. 경기도 통계를 다루는 분석가나 개발자가 '이 통계표는 어느 조직이 만들었고, 공표 범위는 어떻고, 언제 마지막으로 고쳐졌나'를 확인하거나 통계표 간 차원 연결 구조를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 경기통계시스템의 다른 메타·통계 자료와 통계표 ID나 조직번호로만 맞춰 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템의 통계표별 차원 구조를 나타내며, 각 통계표의 식별을 위한 테이블 ID, 통계 생산 조직을 나타내는 조직번호, 공표구분 코드, 최종수정일 등을 포함합니다. 테이블 ID는 개별 통계표를 고유하게 구분하기 위한 코드로, 동일한 통계표 내에서 다양한 차원의 자료가 포함될 수 있음을 보여줍니다. 각 행은 통계표의 특정 차원이나 지표 단위 정보를 나타내며, 공표구분은 통계자료의 공개 여부나 범위를 명시합니다. 이 데이터는 통계표의 설계 구조 분석, 통계표 간의 차원 연결성 파악, 통계포털 설계 및 데이터베이스 설계에 활용될 수 있으며, 통계 행정자료의 메타정보 체계를 이해하는 데 기초 자료로 제공됩니다.
