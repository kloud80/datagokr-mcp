description_portal: '○ 통계개요* 통계명 : 우편물 취급(구별)* 통계종류 : 서울시 우편물취급 현황을 자치구별로 제공하는 일반ㆍ보고통계* 작성목적 : 우편물 종류별 접수, 배달 등의 물량 및 요금을 조사하여 우정사업 정책입안및 계획 수립의 기초자료로 활용하고, 우편서비스 이용고객에 대한 편의를도모하는 것을 목적으로 함* 조사체계 : 일반우체국 → 총괄우체국 → 서울지방우정청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 우편물(일반, 특수, 소포) 접수 및 배달, 요금수입 현황○ 기 타* 용산구 서울우편집중국, 광진구 동서울우편집중국, 동서울물류센터 포함* 국제우편 중 특수우편에 EMS(특수통상) 포함* 숫자의 단위미만은 반올림하였으므로, 내용의 계가 일치하지 않을 수 있음'
