summary_user: SGIS 통계주제도 서비스에 쓰인 지진 발생 위치를 건별로 담은 파일 데이터로, 기준년도·시도명·주소로 전국의 개별 발생 지점을 나타낸다. 연구자나 지역 주민이 어느 시도에서 해마다 지진이 얼마나 자주 발생했는지 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키는 없어서 시도명이나 주소를 행정구역 이름에 맞춰 SGIS 행정구역 경계나 지역 통계와 붙여 쓴다.
