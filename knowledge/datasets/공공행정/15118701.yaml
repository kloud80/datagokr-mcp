description_portal: 2021년부터 2025년까지 최근 5년간 광주광역시 행정심판위원회에 접수된 행정심판 청구 사건을 대상으로, 연도별 제기 건수와 처리 현황을 종합적으로 분석한 자료입니다. 본 현황에는 각 연도별로 접수된 청구 건수와 함께 위원회의 심리를 거쳐 판단이 이루어진 처리 건수를 포함하고 있으며, 처리 결과에 따라 인용, 기각, 각하 등 결정 유형별 통계 정보를 제공합니다. 이를 통해 광주광역시 행정심판위원회의 운영 실태와 사건 처리 추이를 객관적으로 파악할 수 있으며 이월되는 비율도 확인할 수 있습니다.
