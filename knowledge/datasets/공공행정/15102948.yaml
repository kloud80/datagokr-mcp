description_portal: 이 데이터는 대구광역시 동구 관내 마을기업 현황을 제공하는 공공데이터입니다. 마을기업은 지역 주민들이 주도하여 설립한 사회적 기업으로, 지역 자원을 활용해 일자리 창출과 공동체 활성화를 도모하며, 사회적 가치 실현에 기여합니다. 주요 사업으로는 지역농산물 생산 및 판매, 도시락·반찬 판매, 전통체험 프로그램 운영 등 다양한 활동이 포함됩니다. 데이터 주요 항목으로는 업체명, 사업내용, 소재지, 전화번호 등이 제공되며, 각 마을기업의 활동 범위와 연락처 정보를 확인할 수 있습니다. 이를 통해 주민들은 지역 마을기업 정보를 쉽게 파악하고, 상품 구매나 체험 프로그램 참여 등으로 지역 경제와 공동체 활성화에 기여할 수 있습니다. 또한 행정기관은 마을기업 운영 현황 관리, 지원 정책 수립, 사회적 경제 활성화 전략 수립 등에 활용할 수 있으며, 연구자나 시민단체는 지역 사회 경제 분석, 사회적 가치 평가, 일자리 창출 효과 분석 등 다양한 목적으로 데이터를 활용할 수 있습니다.
