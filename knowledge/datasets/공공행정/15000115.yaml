summary_user: 법률·대통령령·총리령·부령 등 법령을 한 건씩 담은 목록으로, 법령ID·법령명·공포일자와 공포번호·시행일자·제개정 구분·소관부처를 법령 단위로 제공하며, 검증 호출에서는 1987-10-29부터 2026-09-15까지의 11행을 받았다. 행정 실무자나 분석가가 "이 사업의 법적 근거 법령이 언제 개정되어 언제부터 시행되는가"를 확인하고, 시행일과 개정 이력으로 법령 변경을 감지하는 데 쓴다. 법령ID와 소관부처코드(부처 코드표)로 같은 기관의 법령 데이터와 잇고, 실측에서 전역 조인 키는 없었으므로 다른 기관 데이터와는 법령명이나 부처명을 매핑해 연결한다.
description_portal: 법제처에서는 국가법령정보 공유서비스를 통해 법률, 대통령령, 총리령, 부령 등 다양한 법령의 조문 원문과 메타데이터를 제공하는 기능을 운영합니다. 이 서비스는 각 법령의 조문 내용, 조문 번호, 시행일자, 개정 이력, 소관 부처와 같은 핵심 정보를 구조화된 형태로 포함합니다. 이용자는 최신 법령과 과거 조문을 비교하거나, 법령의 체계적 분류와 계층 구조를 쉽게 파악할 수 있습니다. 또한 영문화된 조문이나 부속서류 등 부가 자료를 함께 확인할 수 있어 국제적 활용과 다국어 법률 검토에도 유용합니다. 본 데이터는 법제 연구, 행정 실무, 판례 분석, 교육 자료 개발 및 법률정보 시스템 구축 등에 폭넓게 활용됩니다.
