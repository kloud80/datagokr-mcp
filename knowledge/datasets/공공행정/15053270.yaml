description_portal: '본 자료는 전북특별자치도 전주시 관내에 위치한 동물약국의 기본 정보를 체계적으로 정리한 것입니다. 각 동물약국의 명칭과 주소, 그리고 전화번호가 포함되어 있어 반려동물을 기르시는 주민 여러분께서 필요하실 때 신속하게 약국을 찾고 연락하실 수 있도록 지원하고자 마련하였습니다. 반려동물의 건강 관리와 치료에 있어 적절한 의약품 구입은 매우 중요합니다. 이 자료를 활용하시면 가까운 동물약국을 쉽게 확인하여 응급 상황이나 정기적인 건강 관리 시에 편리하게 방문하실 수 있습니다. 전북특별자치도 전주시 내 동물약국을 제공하며 사업장명, 인허가일자, 영업상태명 등을 제공합니다.항목 : 사업장명칭, 인허가일자, 영업상태명, 소재지전화번호, 도로명주소, 지번주소, 위도, 경도 등제공부서 : 동물정책과'
