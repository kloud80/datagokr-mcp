description_portal: '서울특별시 스마트 불편신고에서 제공하는 년도별/월별 스마트 불편신고건수 통계 정보입니다.- 제공자료 : 2025년 3월~7월- 갱신주기: 비정기(수시, 자료변경시)*용어설명 : 서울스마트 불편신고는 스마트폰으로 불법주정차, 보도블록 파손, 무단 쓰레기 투기 등 서울시의 생활 불편사항을 신고할 수 있는 앱으로 신고된 민원은 120 다산콜센터를 통해 접수되고, 이어 해당 부서 공무원이 처리하며, 앱으로 처리 과정 및 결과를 실시간 확인할 수 있음※ 제공부서 : 서울특별시 디지털도시국 공간정보과(02-2133-2857)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
