description_portal: 김천시의회 의원정당정보 데이터에서는 김천시의회 의원들의 소속 정당 정보를 제공하고 있습니다.정당은 정치적인 주의나 주장이 같은 사람들이 정권을 잡고 정치적 이상을 실현하기 위하여 조직한 단체로서 국내 주요 정당으로는 더불어민주당, 국민의힘, 조국혁신당, 개혁신당, 새로운미래, 진보당 등이 있습니다.김천시의회 의원은 전체 18명으로 이중 국민의힘 소속이 16명,  더불어민주당 소속이 1명, 무소속이 1명으로 구성되어 있습니다.국민의힘 소속 16명 중 2명은 비례대표 입니다.
