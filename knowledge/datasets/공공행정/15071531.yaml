summary_user: 서울시에 인허가된 무도장업 사업장을 한 곳씩 담은 건별 원천 데이터로, 인허가·취소·휴폐업일자, 영업상태, 지번·도로명 주소, 좌표, 면적, 지도자수, 회원모집인원, 보험가입여부를 담는다. 분석가나 창업 예정자가 '어느 자치구에 영업 중인 무도장이 몰려 있고 최근 몇 곳이 폐업했는가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 키는 없어서, 같은 원천인 LOCALDATA 인허가 자료와는 관리번호(MGTNO)·자치단체코드로, 상권·행정동 자료와는 주소나 좌표로 맞춰 잇는다.
description_portal: 서울시 무도장업 인허가 정보는 서울시에 인허가된 무도장(격투기 체육관, 도장, 체력단련 무도 시설 등)의 행정 이력과 시설·운영 특성을 파악할 수 있는 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자와 영업상태 관련 항목을 통해 각 무도장의 인허가 및 운영 변동 이력을 확인할 수 있습니다. 사업장명, 법인명, 전화번호, 지번·도로명 주소, 우편번호, 좌표(X·Y), 소재지면적 등의 정보를 통해 무도장의 위치와 기본적인 사업장 현황을 파악할 수 있습니다. 문화체육업종명, 세부업종명, 공사립구분명은 해당 무도장이 어떤 종목·형태의 무도 시설인지, 공립 또는 사립 등 어떤 성격을 가지는지 구분하는 데 활용됩니다. 지도자수, 건축물동수, 건축물연면적, 회원모집총인원 등의 항목은 시설 규모, 지도 인력 수준, 수용 가능 인원 등을 가늠할 수 있는 지표로 활용될 수 있습니다. 또한 보험가입여부코드는 안전·사고 대응을 위해 해당 무도장이 관련 보험에 가입되어 있는지를 보여 주어, 이용자 안전 측면을 분석하는 데 유용한 정보입니다. 이러한 인허가 정보는 서울시 내 무도장 분포, 규모, 운영 현황, 업종 특성 및 안전 관리 수준 등을 파악하고, 체육·여가·안전 관련 정책 수립과 관리에 활용할 수 있는 데이터입니다.
