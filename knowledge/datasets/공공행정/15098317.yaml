summary_user: 소비자 민원 상담 데이터에 쓰이는 품목을 대·중·소로 나눈 품목코드표로, 품목코드·품목명·등록일자를 한 행씩 담은 전국 단위 코드 파일(CSV 약 46KB)이다. 소비자 민원 학습데이터를 다루는 분석가가 상담 내역에 찍힌 품목코드가 어떤 품목을 뜻하는지 확인할 때 쓴다. 품목코드(ITEM_CODE)를 키로 같은 기관의 소비자 민원 상담 데이터와 이어 붙여 품목명을 해석한다.
description_portal: 공정거래위원회의 소비자 민원 학습 데이터는 소비자 민원 상담 내역을 담고 있으며, 다양한 유형의 데이터를 포함하고 있습니다. 상담 내역은 주로 한국소비자원에서 상담한 의료, 금융, 자동차 관련 상담 데이터와 온라인 상거래 관련 상담 데이터, 그리고 지역별, 기관별 상담 데이터 등으로 구성됩니다. 또한, 위해위험 관련 정보나 소비자 피해 관련 상담 내역 및 민원 내용도 포함하고 있습니다. 소비자들의 민원에 대한 상담 데이터에 대하여 품목코드를 대, 중, 소 로 구분하여 관리하고 이를 보여주는 데이터 입니다. 이 데이터는 품목코드, 품목명을 포함하고 있습니다.
