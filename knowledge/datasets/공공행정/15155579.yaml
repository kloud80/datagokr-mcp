description_portal: 경북개발공사는 공사에서 추진 중인 사업지구에 대한 토지분양현황 정보를 관리하고 있으며,  토지 분양 현황을 국민에게 투명하게 제공하게 제공하고 있습니다. 본 데이터에는 사업지구명, 용도, 블록·로트 등 필지 식별 정보와 함께 면적(㎡ 및 평), 공급단가, 총 공급금액, 공급방법 등 분양 조건이 포함되어 있습니다. 또한 각 정보의 입력일시를 제공하여 최신성 및 변경 이력을 확인할 수 있습니다.이 데이터는 토지 분양을 검토하는 개인 및 기업의 의사결정 지원, 공공기관의 분양 현황 모니터링 등 다양한 행정·연구 목적에 활용될 수 있습니다.
