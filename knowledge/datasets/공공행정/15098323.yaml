summary_user: 세종특별자치시 안의 공공하수처리시설을 시설 한 곳당 한 건씩 담는 시설 목록으로, 시설명·주소·하루 처리 용량(prcsCpcty)·처리공법·운영방식을 제공한다. 지역 주민이나 환경·도시계획 분석가가 '내 동네 하수는 어느 처리장에서 어떤 공법으로 하루 얼마나 처리되나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 주소를 맞춰 붙이거나 같은 기관(세종시) 자료끼리만 이어 쓴다.
limits: 표준 코드형 조인 키가 없어 다른 하수·환경 데이터와 자동으로 결합하기 어렵고, 주소 문자열이나 시설명 매칭에 의존해야 한다. 범위는 세종특별자치시 한 곳이며, 개발계정은 하루 5,000회 호출로 제한된다.
