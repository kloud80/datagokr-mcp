description_portal: '본 데이터는 대구도시개발공사가 추진하는 공영주택 건립 사업의 진행 현황 및 세부 정보를 제공하는 공공데이터입니다.이 데이터는 각 사업별 주요 내용을 체계적으로 담고 있으며, 대구광역시 내 공영주택 건설 사업에 대한 투명성을 높이고 관련 정보 접근성을 향상시키는 데 기여합니다.제공되는 주요 정보 항목은 다음과 같습니다.- 사업지구: 사업지구명- 위치: 사업이 진행되는 정확한 위치 정보- 면적: 사업 부지의 총 면적- 총사업비: 해당 사업에 투입되는 총 사업 예산 규모- 건축물 현황(동수, 층수, 총세대수): 건립될 건축물의 규모 및 공급될 총 세대 수- 사업 기간(공사시작일, 공사종료일): 공사의 시작일과 종료일이 데이터는 공영주택 공급 계획 수립, 주택 시장 분석, 도시 개발 연구 등 다양한 목적으로 활용될 수 있습니다.'
