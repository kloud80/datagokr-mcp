description_portal: 경기도 수원시 국제자매우호도시 현황입니다. 국가명, 자매도시구분, 도시명, 인구, 면적, 주요산업, 결연목적 등의 정보를 포함합니다. 국제자매우호도시란 지방자치단체(도시,군,구 등)끼리 국경을 넘어 맺은 우호 협력 관계입니다. 주로 문화 교류, 경제 협력, 교육, 행정 교류 등을 목적으로 체결되며, 자매도시, 우호도시, 교류도시 등의 명칭으로도 불립니다. 국제자매우호도시 현황 데이터를 공공데이터로 활용하면 외교, 경제, 교육, 관광, 도시 홍보 등 다양한 정책적, 행정적 가치 창출이 가능합니다. 시각화 콘텐츠 제작 및 시민 참여 유도 및  지역 기업 해외 진출 전략 수립 등 활용이 가능합니다.
