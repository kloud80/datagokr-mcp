description_portal: '건축법 제43조에 따라 일반주거지역, 준주거지역, 상업지역, 준공업지역 등에 해당하는 지역의 환경을 쾌적하게 조성하기 위하여 대통령령으로 정하는 용도와 규모의 건축물은 일반이 사용할 수 있도록 대통령령으로 정하는 기준에 따라 소규모 휴식시설 등의 공개 공지(空地: 공터) 또는 공개 공간(이하 “공개공지등”이라 한다)을 설치하여야 합니다.공개공지는 쾌적한 도시환경 조성을 위해 일정 용도와 규모의 건축물에 일반인이 사용할 수 있도록 설치한 소규모 휴식시설을 뜻합니다.공적공간이란 공중 (公衆)이 이용하도록 제공된 공간입니다. 건축법과 국토계획법에 따라 설치된 공개공지나 공개공간, 도로 및 건축물 사이의 공지를 비롯해 사유지 안에도 관계법령에 따라 공중을 위해 제공된 장소가 모두 공적공간에 해당됩니다.'
