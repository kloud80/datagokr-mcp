description_portal: '한국동서발전의 연도별 RPS 고정가격계약 현황 및 이행현황 정보는 신재생에너지 공급의무화 제도(RPS: Renewable Portfolio Standard) 이행을 위한 고정가격계약 실적과 이행 성과를 정리한 데이터입니다.해당 데이터는 연도, 총 계약건수, 총 계약용량(MW), 의무공급량(REC), 이행량(REC), 이행률(%) 등의 항목으로 구성되어 있으며, 각 연도별로 신재생에너지 공급의무 이행을 위한 고정가격 계약 체결 실적과 실제 이행 실적을 수치화하여 제공합니다.이 데이터는 발전공기업의 RPS 이행 수준, 고정가격 계약을 통한 REC(신재생에너지 공급 인증서) 확보 현황, 계획 대비 실제 이행 성과 등을 분석할 수 있는 핵심 자료로 활용됩니다.학계 및 연구기관에서는 이 데이터를 활용하여 RPS 제도의 실효성 분석, 공급의무 이행률 변화 추이, 고정가격 계약이 REC 시장 안정성에 미치는 영향 평가, 계약용량 대비 실적 분석 등을 수행할 수 있습니다.또한 탄소중립 이행 속도, 신재생에너지 정책 효과 검토, 전력공기업의 재생에너지 확대 전략 수립을 위한 실증적 기초자료로도 활용 가능하며,정부의 에너지 전환정책 및 재생에너지 보급 목표 달성 여부를 평가하는 데도 중요한 참고자료가 될 수 있습니다.'
