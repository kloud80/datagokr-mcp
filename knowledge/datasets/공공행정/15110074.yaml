description_portal: 정부혁신어벤져스 소통책자 제작을 위한 설문 결과는 2020년 범정부 기관의 주니어, 시니어 공무원 3,006명을 대상으로 공직사회의 조직문화를 주제로 한 설문조사를 시행한 결과 데이터입니다.정부혁신어벤져스는 중앙행정기관에서 자율적으로 운영 중인 혁신모임(주니어보드 등)을 타 부처에 확산하여 이들 혁신모임을 상호 연결한 범정부 네트워크로서, 구성원 간 네트워크 구축을 통해 소속감을 공유하고 혁신에 대한 공무원들의 다양한 제언을 자유롭게 나누는 역할을 하고 있으며, 해당자료를 바탕으로 2020년 11월 18일, 공직사회에서 함께 일하는 여러 세대 간의 간극을 줄이고 서로에 대한 이해를 높이기 위한 소통책자 "90년생 공무원이 왔다"를 제작했습니다.해당자료는 공공데이터포털 누리집에서 키워드 검색을 통해 내려받기가 가능합니다.
