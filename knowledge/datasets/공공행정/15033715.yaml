summary_user: 경상북도 구미시에 신고된 행정사 사무소를 한 곳당 한 행으로 담은 원장으로, 신고일자·사무소 명칭·운영상태·도로명 주소·전화번호를 담는다(csv 약 3.4KB의 소규모 파일). 행정업무 대행이 필요한 구미 시민이 "우리 동네 가까운 곳에 영업 중인 행정사 사무소가 어디인가"를 찾거나, 분석가가 시내 행정 지원 인프라 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 도로명 주소를 지오코딩하거나 사무소명·주소 문자열을 맞춰 연결해야 한다.
description_portal: 이 데이터는 경상북도 구미시에 등록된 행정사 사무실 현황을 담고 있는 공공데이터로, 지역 내 행정사의 분포와 기본 정보를 확인할 수 있도록 구성되어 있습니다. 제공 항목에는 신고일, 사무소 명칭, 소재지, 전화번호 등의 정보가 포함되어 있으며, 행정업무 대행 서비스를 필요로 하는 시민들이 위치 기반으로 가까운 행정사 사무소를 찾거나, 상담 및 민원 처리를 위한 기본 정보를 확보하는 데 유용합니다. 또한 이 데이터는 행정기관의 등록·관리 업무, 행정서비스 접근성 분석, 지역 내 법률·행정 지원 인프라 현황 파악 등 다양한 정책 및 민원 대응 업무에도 활용될 수 있는 기초자료입니다.
