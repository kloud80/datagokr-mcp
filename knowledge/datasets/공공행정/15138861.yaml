summary_user: 지방재정365에서 제공하는 지방세 수입의 증감 추이(신장추세)를 회계연도(fyr)별 징수 누계액과 증감률 지표로 담은 전국 단위 집계 데이터이다. 분석가나 정책 담당자가 최근 몇 년간 지방세 수입이 늘었는지 줄었는지, 그 증가율이 어떻게 변했는지를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 회계연도나 이름 매핑 또는 같은 기관(지방재정365) 코드로만 이어 쓴다.
description_portal: 지방세 신장추세는 일정 기간 동안 지방세 수입의 증가 또는 감소 추이를 나타내는 지표입니다.이는 지방자치단체의 재정 건정성을 평가하는 중요한 요소로, 지방세 수입이 증가하면 지방자치단체가 안정적인 재정 상태를 유지하고 있다는 것을 의미합니다. 반대로 지방세 수입이 감소하는 추세가 지속되면, 지방자치단체는 재정적 어려움을 겪을 가능성이 높아지고, 이에 따라 세수 확보를 위한 다양한 정책을 시행할 필요성이 커집니다. 지방세 신장추세는 경제 상황이나 지방 정부의 세수 정책에 따ᄅᆞ 영향을 받을 수 있습니다.
