description_portal: 수요기관 또는 지방청으로부터 나라장터를 통하여 받은 조달요청 정보를 제공하는 서비스로 물품, 공사, 용역, 외자 등 업무 구분별로 조달요청번호, 계약체결형태명, 대표납품장소, 발주기관 내역 정보를 제공하는 나라장터 조달요청서비스입니다. 조달요청이란 수요기관이 수요물자 또는 공사와 관련한 수요가 발생하여 관련 계약을 체결하고자 할때, 조달청에 계약체결을 요청하는 것을 의미합니다. 관련 법령에 따라 수요기관이 조달청에 조달요청하지 않고 자체적으로 계약을 체결하는 경우가 발생할 수 있으므로, 모든 입찰 또는 계약 건에 대하여 조달요청 정보가 반드시 존재하는 것은 아닐 수 있습니다.
