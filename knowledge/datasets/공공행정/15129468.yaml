summary_user: 수요기관이나 지방청이 나라장터로 조달청에 넣은 조달요청을 건별로 담으며, 물품·공사·용역·외자 업무 구분별로 조달요청번호, 계약체결형태, 대표품명·단가·수량·금액, 예산금액, 대표납품장소, 발주·수요기관을 제공한다(검증 시 전국 범위, 2026-09-22~2026-09-30 구간 81행 수신, API 전체 건수 58). 조달업체나 분석가가 '어느 기관이 어떤 물품·공사를 얼마 예산으로 조달 요청했는가'를 입찰 공고 전에 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 발주기관코드·수요기관코드(기관 코드표)나 조달요청번호·초년도통합계약식별번호로 같은 조달청 나라장터 계열(발주계획·사전규격·입찰·계약) 데이터와 맞춰 이어 쓴다.
limits: 수요기관이 조달청을 거치지 않고 자체 계약하는 경우가 있어 모든 입찰·계약 건에 조달요청 정보가 있지는 않다. 외자 상세 오퍼레이션(/getPrcrmntReqInfoListFrgcptDetail)은 최소 파라미터로 호출하면 응답이 없었다. 개발계정은 하루 1,000회로 호출이 제한된다.
