summary_user: 인사혁신처가 운영하는 국가인재데이터베이스의 수록 인원을 연도별 기준일(12월 31일)마다 총계·공무원·비공무원 인원수로 집계한 전국 단위 통계 파일입니다. 공공인사 분석가나 연구자가 "정부 인재풀에 등록된 인원이 해마다 얼마나 늘었고 공무원과 민간(비공무원) 비중은 어떻게 바뀌었나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 공무원·인사 통계와는 기준 연도를 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 신분별 연도 합계만 담고 있어 개인별·분야별·기관별·지역별 구성은 알 수 없다. 공통 코드나 조인 키가 없으므로 다른 데이터와는 연도 기준으로만 맞춰 써야 한다.
