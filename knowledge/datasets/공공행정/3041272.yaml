summary_user: 전국 산업단지 현황을 시도별, 단지 유형별(국가·일반·도시첨단·농공), 단지별로 집계한 통계표 파일로, 부록에 신규지정·해제단지, 자유무역·외국인투자지역·스마트그린산단 자료를 담는다(파일 첫 시트는 2026년 2분기 요약). 지자체·정책 담당자나 기업이 "우리 시도에 어떤 유형의 산업단지가 몇 곳 있고 규모는 어떤가", "공장 입지 후보 단지는 어디인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명·단지명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 전국산업단지현황통계(시도별, 전국산업단지, 국가, 일반, 도시첨단, 농공, 신규지정 및 해제현황, 자유무역, 외국인 투자지역 등) 전체 통계표 입니다. 통계법 제 18조에 의한 국가승인통계로 승인번호 제 399003호 입니다.  통계표에는 전체 통계 요약, 시도별, 전국산업단지별, 국가산업단지별, 일반산업단지별, 도시첨단 산업단지별, 농공산업단지별 통계가 포함되어 있으며 부록으로 신규지정 및 해제단지, 자유무역 산업단지, 외국인 투자지역 산업단지, 스마트그린산단 산업단지 자료를 공표하고 있습니다. 통계 자료를 통해 정부와 지방자치단체의 산업정책 수립, 공장입지 선정 등 기업의 경영계획 수립, 연구기관의 연구활동에 필요한 참고자료로 활용되고 있습니다.
