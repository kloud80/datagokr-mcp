summary_user: 경기통계시스템 안의 통계표끼리 어떤 표가 어떤 표와 연계되는지를, 기준 통계표(조직번호·통계표ID)와 연계 대상 통계표(연계 조직번호·연계 통계표ID)의 쌍 단위로 담은 메타데이터이다. 통계 담당자나 분석가가 "이 경기도 통계표와 내용이 겹치거나 구조가 비슷한 표는 무엇인가"를 찾아 비교분석하거나 중복 통계를 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 경기통계시스템의 다른 통계표 목록·메타데이터와 조직번호·통계표ID 값을 맞춰 같은 기관 안에서만 이어 쓴다.
description_portal: 이 데이터는 경기도 통계시스템 내 통계표 간 연계를 나타내는 정보로, 조직번호와 테이블ID, 이와 연계되는 조직 및 통계표 ID로 구성되어 있습니다. 이는 서로 다른 통계표 간 내용 중복 여부나 구조적 유사성을 식별하고, 데이터 일관성 확보 및 통합관리를 위한 기준 자료로 활용됩니다. 통계표 간 비교분석, 메타데이터 기반 검색, 유사 통계 자동 연결, 통계시스템 표준화 작업 등에 기초자료로 사용할 수 있으며, 연계 구조가 많아질수록 통계표 간 유기적 활용도가 높아집니다. 또한 이러한 연계정보는 유사 통계표 간 데이터 통합 또는 비교분석 기능을 지원합니다.
