description_portal: 여수시에서 운영 중인 불법주정차 단속장비별 단속 실적 정보를 시민에게 공개함으로써, 불법주정차 단속 행정의 운영 현황을 투명하게 제공하고 시민의 알권리를 보장하고자 함.본 데이터는 2017년부터 2025년까지 여수시에서 보유·운영한 불법주정차 단속장비를 활용하여 적발된 단속 건수에 대한 통계자료로, 장비 유형별 및 연도별 단속 현황을 확인할 수 있도록 구성되어 있음.자료에 포함되는 단속장비는 고정형 CCTV, 이동형 단속차량, 차량탑재형 CCTV, 주민신고제(안전신문고) 연계 단속자료 등 불법주정차 단속을 위하여 활용되는 장비 및 시스템을 포함할 수 있으며, 각 장비를 통해 확인된 위반 사항 중 실제 단속 처리된 건수를 기준으로 집계한 자료임.또한 본 자료는 연도별 단속장비 운영 현황과 단속 실적 추이를 확인할 수 있는 기초자료로서, 시민의 교통질서 의식 제고와 불법주정차 단속 행정에 대한 이해를 돕기 위한 목적으로 제공됨. 아울러 주정차 민원 다발지역 분석, 단속장비 운영 효율성 검토, 교통안전 정책 수립 및 주차질서 확립 대책 마련 등을 위한 행정 참고자료로 활용 가능함.특히 연도별 단속건수는 단속장비 설치 확대, 주민신고제 운영 변화, 교통량 증가, 단속시간 조정, 단속기준 변경, 행정 여건 및 사회적 환경 변화 등에 따라 차이가 발생할 수 있으며, 특정 연도의 증감은 이러한 요소들이 복합적으로 반영된 결과일 수 있음.제공되는 자료는 내부 단속시스템 및 세외수입·교통행정 관련 자료를 기준으로 작성된 통계자료이며, 이후 부과취소, 감액, 오부과 정정 등의 사유로 일부 수치가 변경될 수 있음. 또한 개인정보 및 개별 위반차량에 관한 세부 내용은 제외한 통계 형태로 제공하여 관련 법령에 따른 개인정보 보호사항을 준수함.
