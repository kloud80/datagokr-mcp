description_portal: '○ 통계개요* 통계명 : 지방세 부담* 통계종류 : 서울시 거주 인구의 지방세 부담규모를 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 : 「지방재정법」에 의거하여 운용되는 지방재정 현황* 작성목적 : 지방재정의 계획수립 및 운용 현황을 파악하여, 지방재정의 건전하고 투명한운용과 합리적ㆍ효율적인 관리가 이루어질 수 있도록 기초자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 세무과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 각 자치구의 지방세 세입결산액을 주민수 및 세대수로 나눈규모(부담액)○ 용어설명* 지방세 : 지방자치단체가 징수하는 조세로, 국가의 수권에 의해 주로 지방자치단체가관할하는 지역사회의 복지를 증진시키기 위한 목적에서 징수됨○ 기 타* 숫자의 단위미만은 반올림하였으므로, 내용의 계가 일치하지 않을 수 있음○ 출 처 : 서울특별시 세무과'
