description_portal: '인천광역시의 경기종합지수 공공데이터는 인천 지역의 전반적인 경기 상황을 파악하기 위해 여러 주요 경제 지표를 종합하여 만든 통계입니다. 이 데이터는 경기 변동의 방향, 속도, 그리고 전환점을 예측하는 데 활용됩니다.인천 광역시의 선행종합지수, 순환변동치, 동행종합지수. 전월비, 전월차 등의 정보를 제공하는 데이터로 구성되어 있습니다.-선행종합지수 : 실제 경기 변동에 앞서 움직이는 지표들을 종합한 것으로, 미래의 경기 동향을 예측하는 데 사용됩니다.-동행종합지수 : 현재의 경기 상황을 나타내는 지표들로 구성되어, 현재 경기의 순환 국면을 파악하는 데 사용됩니다.이 데이터는 인천시의 경제 정책 수립, 기업 투자 결정, 그리고 학술 연구 등 다양한 분야에서 중요한 기초 자료로 활용됩니다.'
