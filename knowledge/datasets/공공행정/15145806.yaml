description_portal: '○ 통계개요* 통계명 : 주요 인구지표(성비, 인구성장률, 인구구조, 부양비 등)* 통계종류 : 서울시 자치구별 장래인구를 추계하여 제공하는 일반ㆍ가공통계* 작성목적 : 서울시 자치구별 인구추이 분석을 통해, 보건ㆍ복지 등 맞춤형 서비스 증진을위한 공공 및 민간분야의 소지역 장래인구에 대한 수요 증가에 부응하고,이를 활용한 다양한 주제별 추계의 기초자료를 제공하는 것을 목적으로 함* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 주요 추계인구 지표(성비, 인구성장률, 인구구조, 부양비 등)○ 용어설명* 추계인구 : 장래인구추계 시ㆍ도편의 결과를 기초로 서울시 자치구 성?연령별 기준인구을 확정하고,자치구별 인구변동요인(출생, 사망, 국내이동 등)을 분석, 출산력ㆍ사망력ㆍ국내 이동모형 및 장래 변동수준에 대한가정을 설정하여 추계한 인구○ 기 타* 인구는 국적에 관계없이 국내에 거주하는 인구임(외국인도 포함)○ 출 처 : 디지털정책관「서울특별시 자치구별 장래인구추계」'
