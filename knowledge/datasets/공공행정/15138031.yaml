description_portal: 이 데이터는 대구공공시설관리공단에서 운영 중인 각종 체육시설(수영장, 헬스장, 테니스장 등)의 감면 적용 관련 정보를 담고 있습니다. 시설별로 적용되는 부서 코드, 증명 코드, 회원 할인 여부 등의 항목이 포함되어 있으며, 감면 대상자에 대한 세부 조건을 시스템적으로 관리하기 위한 기초 자료로 활용됩니다. 감면은 국가유공자, 장애인, 경로우대자 등 사회적 배려계층에 대한 할인 또는 무료 이용 혜택으로 구성되며, 이 데이터를 통해 각 시설의 할인 기준과 적용 대상, 증명자료 종류 등을 확인할 수 있습니다. 해당 정보는 시민의 이용 편의성을 높이고, 감면 정책의 투명한 운영을 지원하기 위해 주기적으로 관리되고 있습니다.
