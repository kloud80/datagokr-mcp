description_portal: 본 데이터는 경상북도 김천시 혁신도시에 이전한 13개 공공기관의 기관별 현황을 정리한 자료입니다. 이들 기관은 국가의 공공기관 지방이전 정책에 따라 김천 혁신도시에 입지하게 되었으며, 지역 균형 발전, 지역 고용 창출, 행정 중심 기능 강화에 기여하고 있습니다.데이터에는 기관의 공식 명칭, 현재 인원(현원), 주요 업무 내용, 기관 주소, 그리고 위도·경도 좌표를 포함한 공간정보가 제공됩니다. 이를 통해 사용자는 각 기관의 위치 기반 정보와 행정 기능을 동시에 확인할 수 있으며, 지역별 행정자원 분석, 공공기관 분포 지도화, 도시계획 및 지역행정 연계 정책 수립 등의 목적으로 활용할 수 있습니다.
