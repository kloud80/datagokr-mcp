description_portal: 본 데이터는 한국도로교통공단이 민원·연구기관 등에 제공하는 통계용 자료 서비스의 수수료 기준을 정리한 목록이다. 표의 기본 항목은 업무명, 세부항목, 단위, 금액(원), 산정기준, 적용범위, 감면조건, 근거규정 등으로 구성된다. 각 항목은 요청 유형별 청구 금액과 계산 방식을 명확히 파악하는 데 쓰인다. 이용자는 단위당 요금을 확인해 견적 산출과 예산 편성, 내부 규정 준수 점검에 활용할 수 있다. 개인정보는 포함하지 않으며 금액은 숫자값으로 표준화되어 기계처리에 적합하다. 목록은 통계 목적의 자료 제공과 관련된 수수료 정보를 한눈에 비교·검색할 수 있도록 체계화하였다.
