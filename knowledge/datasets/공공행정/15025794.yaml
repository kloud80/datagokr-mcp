description_portal: 부산광역시 강서구 관내에서 영업 중인 주택임대사업자와 민간등록임대주택의 등록 현황을 체계적으로 제공함으로써 임대사업자 등록 및 사후 관리에 도움을 주고자 한다. 이를 통해 임대사업자에게는 법적 절차와 관리 현황을 명확히 안내하고, 임차인에게는 신뢰할 수 있는 정보를 제공하여 안정적인 임대차 계약이 이루어지도록 지원하는 것이 목적이다. 특히 「민간임대주택에 관한 특별법」에 근거하여 사업자 등록번호, 사업자 구분, 임대주택 구분, 도로명주소 및 임시주소, 주택 유형 등의 주요 정보를 담아 등록 민간임대제도를 원활하게 이용할 수 있도록 참고자료로 활용할 수 있다.
