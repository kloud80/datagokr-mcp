summary_user: 전산실·통신실 면적 합계가 500㎡ 이상인 행정·공공기관 정보시스템 운영시설을 시설 한 곳당 한 행으로 정리한 전국 목록 CSV(5,023바이트)입니다. 각 행에는 기관유형(중앙행정기관·지방자치단체·지방교육자치단체·공공기관), 상위기관명, 기관명, 운영시설명, 시도-시군구 단위 위치가 담겨 있습니다. 분석가나 정책 담당자가 "어느 시도에 공공부문 대형 전산시설이 몰려 있고 어떤 기관이 운영하는가"를 확인할 때 씁니다. 전역 조인 키가 없어서 다른 데이터와는 기관명을 행정표준코드 같은 기관 코드 원장에 맞추거나 시도·시군구 이름을 매핑해 이어 붙입니다.
description_portal: '[행정·공공기관 정보시스템 운영시설 현황 데이터]전자정부법에 따라 행정·공공기관의 정보시스템을 운영·관리하고 있는전산실, 통신실 면적 합계 조사 결과 500 평방미터 이상의 공공부문 운영시설에 대한 목록 csv 파일 데이터입니다.본 데이터는 (기관유형, 상위기관명, 기관명, 운영시설명, 운영시설 위치) 데이터로 구성되어 있습니다.기관유형은 중앙행정기관, 지방자치단체, 지방교육자치단체, 공공기관으로 분류됩니다.운영시설 위치는 광역자치단체명(시도) - 기초자치단체명(시군구) 값을 가지고 있습니다.'
