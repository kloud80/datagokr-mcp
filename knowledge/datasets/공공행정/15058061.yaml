summary_user: 지방자치단체별 수의계약비율을 회계연도(fyr) 단위로 담은 집계 공시 데이터로, 광역·기초 자치단체 코드와 이름, 금액 두 항목(pfa_amt1, pfa_amt2), 비율(rate)이 전국 범위로 들어 있다. 주민이나 분석가가 "우리 시·군·구는 경쟁입찰 없이 맺은 계약 비중이 다른 지자체보다 높은가"를 연도별로 비교하는 데 쓴다. 전역 조인 키는 없고, 자치단체 코드(laf_cd)·이름을 매개로 같은 지방재정365의 다른 공시 지표와 맞춰 쓴다.
description_portal: 지방자치단체 수의계약비율이란, 지방자치단체가 공공사업이나 서비스 제공을 위해 계약을 체결할 때 경쟁 입찰을 거치지 않고, 특정 업체와 직접 계약을 체결한 비율을 의미합니다. 수의계약은 일반적으로 길급하거나 특별한 사유가 있을 때 사용됩니다.이 비율이 높다는 것은 지방자치단체가 경쟁 입찰을 거치지 않고 직접 계약을 체결하는 경우가 많다는 것을 의미하며, 이는 투명성 부족이나 경쟁의 제한을 초래할 수 있습니다.이에 따라 정부는 수의계약을 최소화하고, 공정한 경쟁을 촉진하기 위해 관련 법률과 규제를 강화하고 있습니다.
