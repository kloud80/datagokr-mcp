summary_user: 국회사무처가 제공하는 NABO Focus 간행물 목록을 건별로 담으며, 한 건마다 등록일, 담당 부서, 분류, 제목, 원문 링크, 첨부파일명이 있고 범위는 전국·비공간이다. 연구자나 정책 분석가가 특정 재정·정책 주제를 다룬 NABO Focus 보고서가 언제 어느 부서에서 나왔는지 찾고 원문으로 바로 가는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 제목·부서명 같은 이름 매칭이나 같은 국회 기관의 다른 데이터를 통해서만 잇는다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
