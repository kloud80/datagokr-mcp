description_portal: 한전KDN의 기록관 운영현황에 대한 정보를 담고 있습니다. 기록관은 공공기록물의 체계적 관리와 효율적 운영을 위해 설치되었으며, 기록관장과 기록관리부장은 기록물의 보존, 분류, 이관 등 전반적인 기록관리 업무를 총괄합니다. 전문요원은 관련 법령에 따라 기록물의 분류·정리·평가 등의 실무를 수행하며, 기록물의 가치 판단 및 보존 여부 결정을 위한 기록물평가심의위원회가 운영됩니다. 위원회는 내부 전문가뿐만 아니라 외부 전문가가 함께 참여하여 기록물의 공공성과 역사적 가치를 객관적으로 평가합니다. 이 데이터는 기록물의 책임 있는 관리 체계와 투명한 운영 절차를 보여주며, 공공기관의 정보자산 관리 역량을 대내외에 입증하는 자료로 활용될 수 있습니다.
