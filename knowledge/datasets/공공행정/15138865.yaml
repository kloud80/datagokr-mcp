summary_user: 전국 지방자치단체별로 지방의회 경비(의원국외여비·의정운영공통경비·의회운영업무추진비)의 결산액과 편성기준액, 그 비율인 절감률을 회계연도 단위로 담은 집계 자료이며, 포털 설명상 일반회계만 대상으로 2015 회계연도부터 제공된다. 주민이나 분석가가 "우리 지역 의회는 기준액 대비 경비를 얼마나 아껴 썼나", "다른 자치단체와 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 확인되지 않았으므로 회계연도(fyr)와 자치단체 코드·명(laf_cd, laf_hg_nm)을 기준으로, 같은 지방재정365의 다른 공시 자료와 이름·코드를 맞춰 연결한다.
description_portal: 지방자치단체는 지방의회 경비를 의원국외여비(205-04), 의정운영공통경비(205-05), 의회운영업무추진비(205-06) 3개 통계목으로 관리하고 있습니다.자치단체 지방의회경비 절감률 정보는 자치단체의 지방의회에서 집행한 경비의 절감률을 측정하는 자료로서 자치단체별 지방의회경비결산액과 세부 통계목별(의원국외여비, 의정운영공통경비, 의회운영업무추진비) 정보와 자치단체별 편성기준액 정보의 비율이 제공됩니다.대상회계는 일반회계만 대상이며 2015 회계연도부터 정보가 제공되고 있습니다.
