summary_user: 경기도 각 부서가 미리 교부받아 쓰는 일상경비(여비·사무관리비·업무추진비·수당 등)의 지출을 건별로 담으며, 건마다 회계연도·부서·세부사업명·통계목·지출개요·지출금액·거래처·지급일자·사업자등록번호가 붙는다. 시민이나 분석가가 "경기도 어느 부서가 어떤 거래처에 업무추진비를 얼마나 썼는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부서명·세부사업명 같은 이름 매칭이나 거래처 사업자등록번호(bizregno)로만 이어 붙이며, 일반지출 집행현황에 포함된 금액의 상세 내역이므로 그 데이터와 함께 본다.
description_portal: '이 데이터는 경기도의 각 부서에서 일상적으로 사용되는 경비의 지출 집행 내역을 나타냅니다. 여비, 사무관리비, 업무추진비, 수당 등과 같은 항목이 포함되며, 각 지출 건은 회계연도, 부서, 세부사업명, 통계목명, 지출개요, 지출금액, 거래처, 지급일자, 사업자등록번호 등의 세부 항목으로 구성되어 있습니다.일상경비 : 일상적으로 사용하는 관서운영 경비로서 미리 자금을 부서별로 교부(일반지출)하여 부서별로 지급케 하는 경비.지출집행현황(일반지출)에 포함되어 있는 금액으로 일상경비 관련 상세 지출내역임'
