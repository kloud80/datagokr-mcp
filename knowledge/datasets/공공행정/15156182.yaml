description_portal: '평택시 기부업체 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 지역사회 내에서 다양한 형태의 기부와 사회공헌 활동에 참여하는 기부자 내역을 체계적으로 파악하고, 복지정책 수립과 민관 협력 기반을 강화하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 기부 참여자와 기부 유형, 기부 규모 등을 확인할 수 있으며, 민간·연구기관은 지역사회공헌 분석, 비영리기관 협력체계 구축, 사회적 가치 창출 연구 등 다양한 분야에서 활용할 수 있습니다. 본 데이터에는 업체 또는 개인명, 기부내역 등의 항목이 포함되어 있어 지역사회 내 나눔 활동의 구조와 흐름을 객관적으로 이해하는 데 도움이 됩니다. 이러한 자료는 복지 사각지대 해소, 지역사회 연대 강화, 사회공헌 활동 확산, 공공·민간 협력사업 기획 등 다양한 공공 목적을 지원을 확인할 수 있는 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
