description_portal: 국민신문고와 지자체 민원 창구 등에서 수집된 민원 데이터를 종합적으로 분석하여 제공합니다. 급증 키워드 정보, 핵심 키워드 정보, 민원분석 분류체계 정보, 맞춤형통계 정보, 키워드 트렌드 정보, 유사사례 정보,연관어 분석 정보, 오늘의 민원 이슈,민원발생 기관 순위, 민원발생 지역 순위, 키워드 기반 민원 건수 정보,지역 인구수 대비 민원 현황 정보, 최다 민원 키워드 정보, 분석보고서 정보, 키워드 기반 성별 정보, 키워드 기반 연령 정보 등의 데이터를 조회할 수 있습니다. 이를 통해 민원의 유형과 추이를 파악하고, 정책 수립 및 행정 서비스 개선에 활용할 수 있습니다.
