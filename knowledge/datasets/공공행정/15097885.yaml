summary_user: 경기도 화성시가 시민에게 개방하는 공공시설(회의실·강당·운동장 등)을 시설 한 곳씩 담은 목록으로, 시설명·개방장소·유형·휴관일·평일/주말 운영시각·유료 여부·주소·위도경도·관리기관을 포함한다. 화성시 주민이나 단체가 "우리 동네에서 주말에 무료로 빌릴 수 있는 강당이나 회의실이 어디이고 몇 시까지 여는가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소나 위도·경도로 지도·행정구역 데이터와 공간 결합하거나, 관리기관명으로 같은 기관 자료와 이름 기준으로 맞춰 쓴다.
limits: 표준 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소·좌표 매칭으로만 연결된다. 범위는 화성시 한 곳이며, 예약 가능 여부나 실시간 이용 현황은 담지 않는다.
