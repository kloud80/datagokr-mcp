summary_user: 전국 지방자치단체가 수행한 일정 규모 이상 행사·축제별로 총비용, 사업수익, 순원가와 행사 시작·종료일, 사업내용을 회계연도(fyr)·자치단체 단위로 담은 원가회계 공시 데이터다. 주민이나 분석가가 "우리 구가 연 축제에 얼마를 쓰고 얼마를 벌었나", "순원가가 큰 행사는 어디인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치단체명·자치단체 코드(laf_cd)나 같은 기관(지방재정365)의 코드로 맞춰 이어 써야 한다.
description_portal: 지방자치단체의 행사축제원가회계정보의 공개는 행사 예산의 효율성과 투명성을 높이기 위한 제도로 지방재정법 제60조에 근거하여 공개하고 있습니다.자치단체가 수행하는 광역기준 5억이상예산, 기초단체 3어이상 예산이 투입되는 행사를 대상으로 총사업비 세부집행내역과 수입과지출 구조 등을 원계회계 방식으로 정리해 공개하고 있습니다.행사축제원가회계정보는 2012 회계연도부터 정보가 제공되고 있으며, 제공되는 세부항목으로는 행사축제명, 사업내용, 총비용, 사업수익, 순원가, 시작일자, 종료일자 정보가 제공되고 있습니다.
