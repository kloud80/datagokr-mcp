description_portal: 부산광역시 금정구의 관내 홈페이지현황입니다. 금정구청, 금정문화회관, 금정도서관, 금정구의회, 금정국민체육센터, 금정구평생학습관, 금정구 보건소, 금샘도서관의 웹사이트 주소가 있습니다.이 데이터는 부산광역시 금정구에서 운영하는 주요 웹사이트 및 홈페이지의 목록을 총 22개 기관/시설에 대해 기록한 자료입니다.각 웹사이트에 대해 웹사이트명, 웹사이트 주소(URL), 그리고 해당 사이트를 관리하는 담당 부서의 3가지 핵심 정보를 제공합니다.이 자료는 구청 대표 홈페이지를 포함하여 금정문화회관, 도서관, 체육센터, 보건소 및 16개 동(洞) 행정복지센터까지 다양한 분야의 온라인 채널 정보를 망라합니다.
