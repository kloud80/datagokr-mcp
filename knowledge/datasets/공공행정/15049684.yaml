summary_user: 지방공기업 유형별 부채규모를 회계연도·광역/기초 자치단체·공기업 유형·회계별로 부채액과 자본(또는 자산)액, 부채비율로 정리한 전국 단위 집계 데이터로, 재무제표 결산 기준(발생주의)으로 작성된다. 지역 공기업의 부채가 자본 대비 얼마나 큰지, 유형(상수도·하수도·공사·공단 등)별로 재정건전성이 어떻게 다른지를 비교하려는 분석가나 주민이 쓴다. 전역 조인 키는 없어 자치단체 코드·이름(laf_cd 등)이나 연도 기준으로 지방재정 공시나 지방공기업 경영공시 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 공기업 부채규모는 지방공기업이 가진 총 부채의 금액을 말합니다. 여기에는 모든 외부부채가 포함됩니다. 부채비율은 부채가 자본 대비 어느정도인지를 나타내는 지표로 이 비율이 높을 수록 공기업이 외부자금에 더 많이 의존하고 있다는 의미이며, 지방공기업의 재정건전성을 평가하는 데 중요한 기준입니다. 공공부문 부채는 발생주의 기준을 따릅니다. 지방공기업 부채데이터는 각 기관에서 작성한 재무제표상의 부채총액과 자본을 바탕으로 하며, 지방공기업 결산을 통해 부채현황을 파악할 수 있습니다.
