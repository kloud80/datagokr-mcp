summary_user: 부산진구의회에 제출된 의안을 건별로 담은 파일(CSV, 약 54만 바이트)로, 대수·회기·의안번호별로 의안명·종류, 발의일·발의자, 소관위원회 회부·의결일과 처리결과, 본회의 상정·의결일과 처리결과, 공포일·공포번호를 기록한다. 주민이나 분석가가 "이번 대 부산진구의회에서 구청장 발의와 의원 발의 의안이 각각 몇 건이고, 위원회와 본회의에서 원안가결·수정가결·부결이 어떻게 갈렸나"를 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어서, 다른 구의회 의안 데이터와는 대수·회기·의안명 같은 이름을 맞춰 연결하고, 조례 공포 정보와는 공포번호를 대조해 이어 쓴다.
description_portal: 부산진구 지방의회 의안정보(회기별 의안명, 의안정보, 발의일, 발의자 정보, 각 위원회 처리결과, 본회의 공개일자 등)부산진구 지방의회에서 처리된 의안 정보를 정리한 데이터로, 회기별로 상정된 다양한 의안의 진행 과정을 투명하게 확인할 수 있도록 구성된 자료입니다. 이 데이터에는 각 의안을 식별할 수 있는 의안명, 구체적인 내용을 담은 의안정보, 그리고 의안이 공식적으로 제출된 발의일과 발의자 정보가 포함되어 있습니다. 또한 의안이 각 상임위원회에서 어떤 절차를 거쳐 처리되었는지 알 수 있는 위원회별 처리결과, 이후 본회의에서의 최종 심의 과정을 확인할 수 있는 본회의 공개일자 등의 정보도 함께 제공됩니다. 이러한 자료는 주민들이 지방의회의 입법·심의 활동을 쉽게 이해할 수 있도록 돕고, 행정기관에는 의안 처리 흐름을 체계적으로 관리하는 데 중요한 기반이 됩니다.
