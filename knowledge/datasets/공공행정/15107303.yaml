summary_user: 행정안전 통계연보 '지방행정/지역발전' 편에 실린 지역별 주민등록인구 통계를 오픈API로 담으며, 지역별 인구수 합계·세대수·남녀 인구수를 담은 전국 범위의 집계표다. 지역 간 인구 규모와 세대 수, 성별 구성을 연보 기준으로 비교하려는 분석가나 행정 담당자가 '어느 시도의 인구와 세대가 가장 많은가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름을 매핑하거나 같은 기관(행정안전부) 통계끼리만 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '인구', '지역별 주민등록인구' 에 관한 통계입니다. 지역, 인구수 계, 세대수, 남자 인구 수, 여자 인구 수 지역별 주민등록인구 등 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
