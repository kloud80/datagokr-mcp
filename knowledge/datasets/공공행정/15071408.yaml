summary_user: 서울특별시 관광유람선·크루즈 사업장을 한 곳씩 담은 인허가 원장으로, 사업장명·주소·영업상태와 인허가·휴폐업 일자, 선박 톤수·척수·좌석수 같은 시설 정보를 함께 담는다. 관광사업자나 분석가가 '서울에서 지금 영업 중인 유람선 사업장은 어디이고 수용 규모는 얼마인가'를 확인하거나 영업상태 변화를 추적하는 데 쓴다. 전역 조인 키는 없어서 자치단체 코드(OPNSFTEAMCODE)와 관리번호, 사업장명·주소로 LOCALDATA 기반의 다른 업종 인허가 자료와 이어 쓴다.
description_portal: 'ㅇ 데이터 개요: 서울특별시에서 관광객 대상 유람선·크루즈 서비스를 제공하는 사업장의 인허가 현황을 정리한 자료입니다. 사업장 식별, 인허가 진행 단계, 영업상태 변화와 같은 행정 이력을 한눈에 파악할 수 있도록 구성되어 있으며, 관광 관련 업태·업종 분류와 문화관광 분야 속성을 함께 제공합니다.ㅇ 주요 수록 항목: 사업장명, 업태·업종, 지번·도로명 주소, 전화, 영업상태명과 상세영업상태, 인허가·휴폐업 이력, 데이터 갱신 구분, 문화체육업종명·문화사업자구분명, 지역 구분, 주변환경명 등 행정·업무 관리에 필요한 핵심 메타데이터가 포함됩니다.ㅇ 시설·선박 정보: 선박총톤수, 선박척수, 선박제원, 좌석수, 무대·시설 면적, 회의실 동시수용 인원, 놀이시설·방송시설 등 고객 수용능력과 안전·편의 관련 지표를 제공하여 현장 점검과 서비스 수준 분석에 활용할 수 있습니다.ㅇ 부지·건축 정보: 소재지 면적, 건축연면적, 건물용도명, 총층수와 지상·지하층수, 객실수 등 사업장 규모와 용도 파악을 지원하여 공간 계획, 환경·안전 기준 검토, 민원 대응 자료로 활용 가능합니다.ㅇ 보험·준법 정보: 보험기관명, 보험 기간 항목, 기획여행보험 항목, 자본금, 부대시설 내역 등 리스크 관리와 법정 의무 이행 점검에 필요한 항목이 함께 제공됩니다.ㅇ 공간정보 특성: 좌표는 중부원점TM 좌표계의 X·Y 필드로 제공되며, 위경도는 제공되지 않습니다. 지도 서비스나 분석 도구에서 활용하려면 좌표계 변환 절차가 필요합니다.ㅇ 활용 예시: 인허가 심사와 사후 관리, 영업상태 모니터링, 수용능력 기반 안전 점검 계획, 관광자원 분포 분석, 환경·교통 영향 검토, 민원·사고 대응을 위한 현행화 자료로 활용할 수 있습니다. 좌표 변환을 거치면 관광 동선 분석과 주변 자원 연계에도 유용합니다.'
