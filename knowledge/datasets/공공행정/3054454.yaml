description_portal: 대구 서구 관내 최근 1년 간의 행정처분업소에 대한 데이터로 처분확정일자, 업종명, 업소명, 소재지 및 처분사항등의 항목을 제공합니다.본 데이터는 대구광역시 서구 관내에서 각종 위반 행위로 인해 행정처분을 받은 업소의 정보를 포함한 현황 자료이다. 수록 항목은 처분일자, 업종명, 업소명, 소재지, 처분명으로 구성되어 있으며, 영업정지, 과징금부과, 등록취소, 시정명령, 직권말소 등 다양한 제재 유형이 포함된다. 업종 범위는 일반음식점, 노래연습장, PC방, 숙박업, 제과점, 단란주점, 유흥주점 등 다수의 서비스업종에 걸쳐 있으며, 행정처분의 이력 확인 및 업소 관리 정책 수립 등에 활용될 수 있다. 본 자료는 소비자 보호, 공공안전 확보, 위생관리 강화 등의 행정적 목적 외에도 시민의 알권리 충족을 위한 정보 공개 차원에서 제공된다.현재까지 진행된 내역을 확인하고 싶다면 https://eminwon.dgs.go.kr/emwp/gov/mogaha/ntis/web/caf/mwwd/action/CafMwWdOpenAction.do?method=selectListAdmm&menu_id=CAFOPNWebAdmmOpenL&jndinm=CafMwWdOpenEJB&methodnm=selectListAdmm&context=NTIS 홈페이지 사이트에서 조회가 가능하다.
