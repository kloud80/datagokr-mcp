description_portal: 본 데이터는 경기도 광주시의회 홈페이지의 영상 회의록에 포함된 안건 정보를 제공합니다. 시의회 회의를 영상으로 기록한 자료에서 각 안건별 심의 내용과 영상 재생 시간 정보를 담고 있습니다. 고유번호는 각 안건을 식별하는 코드이며, 영상 회의록 고유번호는 해당 안건이 다뤄진 회의 영상과 연결됩니다. 안건명은 심의 대상 안건의 제목을 나타내고, 재생 시간은 영상에서 해당 안건이 논의되는 시작 시점을 표시하여 이용자가 원하는 안건 부분을 바로 시청할 수 있게 합니다. 본 데이터는 의정 영상 검색, 안건별 심의 내용 확인, 회의 기록 관리, 의정 투명성 강화 등에 활용됩니다.
