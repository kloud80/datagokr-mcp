summary_user: 국회 의안이 날짜별로 어느 처리 단계를 거쳤는지를 건별로 담으며, 필드 이름상 대수(AGE)·일자·의안 종류·의안번호와 의안명·단계와 세부 단계·소관 위원회·처리 상태·관련 링크가 들어 있고, 범위는 전국 단위의 비공간 데이터다. 특정 날짜에 어떤 법안이 위원회 심사나 본회의 의결 단계로 넘어갔는지 확인하려는 국민·기자·입법 분석가가 쓴다. 전역 조인 키는 없으므로, 같은 국회사무처의 의안·표결 데이터와는 의안ID(BILL_ID)나 의안번호 같은 기관 내부 코드로 이어 붙여 '누가 무엇을' 처리했는지를 본다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
