summary_user: 경기공유서비스에 등록된 공공시설의 대관 요금을 요금 일련번호 단위로 담으며, 기관·시설·대관목적 코드별로 기본요금과 주말·공휴일·야간·전일 요금, 각 요금의 적용 여부(Y/N), 야간 시작·종료 시각을 담는다. 시설을 빌리려는 주민이나 단체가 '이 시설을 주말 야간에 빌리면 얼마인가'를 미리 확인하거나, 분석가가 기관·시설별 요금 체계를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 경기공유서비스의 시설·기관 정보와는 기관코드(inst_cd)·시설코드(faclt_cd)로만 연결한다.
description_portal: 이 데이터는 공공시설의 대관 시 적용되는 요금 정보를 담고 있으며, 각 기관 및 시설에 따라 기본요금과 주말, 공휴일, 야간, 전일 요금이 구분되어 있습니다. 주요 항목으로는 시설과 기관을 식별하는 ‘기관코드’, ‘시설코드’, ‘대관목적 코드’, 그리고 요금 조건에 따른 ‘기본요금’, ‘주말요금’, ‘공휴일요금’, ‘야간요금’, ‘전일요금’ 등이 포함됩니다. ‘주말요금적용’, ‘공휴일요금적용’ 등의 항목은 각 요금 항목의 적용 여부를 Y/N으로 표시합니다. 해당 데이터는 공공시설 이용자에게 예상 요금을 사전에 안내하거나, 기관의 요금 체계 분석 및 정책 수립 시 활용될 수 있습니다. 또한, 시설별 요금 정책을 비교하거나 합리적인 요금 조정의 근거 자료로도 활용 가능합니다.
