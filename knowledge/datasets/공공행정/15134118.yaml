description_portal: 한국법제연구원은 국내 유일의 법제 전문 국책연구기관으로서, 국가의 입법정책을 지원하고 법률문화 향상에 기여하고 있습니다. 연간 300여종의 입법 관련 연구보고서를 발간하여, 정책 현안에 대한 입법대안을 제시하고 더 나은 법제 기반을 구축하는 등 국가 입법정책을 선도하고 있습니다.한국법제연구원 연도별 연구계획서 목록 데이터는 한국법제연구원에서 매년 국가 예산을 이용하여 수행하는 연구사업 및 관련 사업들의 연도별  연도별 연구사업계획서 목록, 연구사업의 분류, 연구기간의 데이터 파일입니다.
