description_portal: 공사계약현황은 경기도 하남시에서 2022년부터 2026년까지 체결한 공사 관련 계약 정보를 기반으로 구성된 데이터입니다. 해당 자료는 계약 체결 전후의 절차와 이행 내용을 종합적으로 확인할 수 있도록, 계약관서, 계약부서, 계약연도, 계약명, 계약방법, 계약상대자 등 다양한 항목으로 구성되어 있습니다.계약상대자는 공동수급체 계약일 경우 대표사를 기준으로 정리하였으며, 계약금액은 최초 계약 체결 이후 계약 변경 및 증감 내역을 반영한 최종 금액 기준으로 제공됩니다.해당 자료는 지방재정통합시스템(e-호조)을 통해 추출된 공공기록물로서, 계약의 이행현황을 종합적으로 파악하고, 향후 유사 공사 추진 시 참고자료로 활용할 수 있도록 제공되는 것입니다. 또한, 의회 보고, 내부 감사, 외부 감사 대응, 정보공개 청구 등 다양한 행정 목적에 활용될 수 있습니다.계약종류, 계약방법 등 주요 항목의 정의와 해석은 ‘지방자치단체 입찰 및 계약 집행기준’, ‘지방재정관리기준 사용자 매뉴얼’ 등을 참고해주시기 바랍니다.자료의 건수가 많아 Excel이나 메모장 등 범용 소프트웨어에서 전체 표출이 어려울 수 있으므로, R,  SAS, STAT 등 통계분석 전용 프로그램을 사용하는 것을 권장드립니다.
