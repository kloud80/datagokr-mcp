summary_user: 지방자치단체가 운영하는 지방공기업의 부채가 자산에서 차지하는 비율을 회계연도(fyr)와 자치단체(광역·기초 코드와 이름) 단위로 담은 전국 집계 지표로, 금액 두 항목과 비율 값으로 구성된다. 분석가나 주민이 '우리 시·도의 지방공기업 부채비율이 다른 지자체보다 높은가, 해마다 늘고 있는가'를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 지방재정365의 다른 공시 지표와는 자치단체 코드(laf_cd)나 자치단체 이름을 맞춰서만 이어 쓴다.
description_portal: 지방자치단체 지방공기업 부채비율은 지방자치단체가 운영하는 지방공기업의 부채가 자산에 대해 어느 정도 비율을 차지하는지를 나타내는 지표입니다. 이 비율은 지방공기업이 자산을 운영하기 위해 어느 정도 외부 자금을 의존하고 있는지를 평가하는 데 중요한 역할을 합니다. 부채비율이 높으면 해당 지방공기업이 부채 상환에 어려움을 겪을 가능성이 커져 지방자치단체의 재정 건전성에 부정적인 영향을 미칠 수 있습니다.이 비율을 통해 지방자치단체는 부채 관리 및 재정 운영의 효율성을 점검할 수 있습니다.
