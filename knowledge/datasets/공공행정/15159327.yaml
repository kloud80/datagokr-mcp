description_portal: 본 데이터는 전북특별자치도 부안군의 세정업무 투명성 제고 및 세입 분석을 위해 작성되는 지방세 비과세 감면 현황 자료이다. 표준지방세정보시스템을 통해 수집된 비과세 현황 통계를 기반으로 작성되었으며, 이 데이터는 2013년부터 비과세 감면 현황자료가 존재하는 과세연도까지 세목과 감면근거별 감면건수 및 감면 세액을 모두 파악할 수 있도록 한 파일로 작성되었다. 데이터 주요 항목은 과세연도, 세목구분, 감면근거, 건수, 감면세액으로 구성되어 있으며, 비과세 및 감면 추이 분석, 세목별 감면 편중 여부 확인 등 데이터분석을 통해 다양한 세정 분석 자료로 활용 가능하다.
