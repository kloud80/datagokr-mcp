summary_user: 전북특별자치도 사회조사에서 학생 자녀가 있는 가구의 월평균 공교육비를 미취학·초등·중학·고등·대학(원) 교육 단계별로 정리한 집계표로, 시군·성별·연령·소득수준 같은 구분(구분별·상세구분)마다 한 행씩 담긴 756바이트 규모의 작은 CSV 파일이다. 교육복지 담당자나 분석가가 "전북에서 소득수준이나 시군에 따라 고등학생 자녀 공교육비 부담이 얼마나 다른가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 이름을 맞추거나 같은 기관 자료끼리만 이어 쓸 수 있으며, 다른 시도나 사교육비 통계와 비교하려면 구분 이름을 직접 대조해야 한다.
description_portal: 전북특별자치도 내 학생이 있는 가구를 대상으로 자녀의 교육 단계에 따른 월평균 공교육비 지출액을 조사한 사회조사 결과 데이터입니다. 이 자료는 미취학 아동부터 대학원생까지 각 교육 과정에 속한 자녀를 위해 가구가 지출하는 평균 비용을 상세히 보여줍니다. 또한, 시군, 성별, 연령, 소득수준 등 다양한 인구통계학적 특성별로 지출액을 교차 분석하여 제공함으로써 교육비 부담의 사회경제적 격차를 파악할 수 있게 합니다. 이는 교육 복지 정책을 수립하거나 가계 부담을 완화하기 위한 지원책을 마련하는 데 있어 중요한 기초 통계로 활용될 수 있는 가치 있는 정보입니다.
