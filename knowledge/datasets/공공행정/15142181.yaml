description_portal: 정부합동민원센터를 통해 접수된 온라인 상담 민원의 월별 및 분야별 통계를 분석하여 발표하였습니다.국민신문고 온라인상담으로 접수된 민원을 매월 처리한 민원상담사례를 바탕으로 분야별 지역별 상담처리 현황, 빈발민원 유형 등 통계산출에서부터 상담결과에 대한 국민만족도, 국민불편사항 해소 등을 분석하여 국민의 민원 유형과 빈도를 파악하고, 이를 바탕으로 민원 처리 시스템의 개선과 정책 수립에 활용됩니다. 분석 결과, 특정 분야에서의 민원 접수 빈도가 높았으며, 이는 해당 분야에 대한 국민의 관심과 불편 사항이 많음을 나타냅니다.
