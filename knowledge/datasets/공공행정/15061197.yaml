summary_user: 지방공기업 통합경영공시에 공개되는 지방공기업별 노동조합 현황을 연도·지자체·기관·노조 단위로 담으며, 노조 설립일·가입범위·조합원수·전임자수·상급노조·근로시간면제 한도 등을 포함하고 범위는 전국이다. 노무 담당자나 분석가가 특정 지방공기업의 노조 가입률이나 전임자·근로시간면제 운영 수준을 다른 기관과 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 경영공시 자료와는 기관명·지자체명을 맞추는 방식으로만 이어 쓴다.
limits: 공통 기관 코드 같은 조인 키가 확인되지 않아 다른 데이터와 연결할 때 이름 매칭에 의존해야 한다. 활용신청 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
