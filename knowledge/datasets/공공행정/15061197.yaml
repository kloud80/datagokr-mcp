description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리, 공개하는 지방공기업의 경영정보 중 하나이다. 노동조합현황 자료에는 연도, 지자체명, 기관명, 노조명, 노조설립일, 노조가입범위, 현원, 가입대상수, 노조원수, 유급전임자수, 무급전임자수, 상급노조, 법정시간한도, 법정인원한도, 체결시간한도, 풀타임인원한도, 파트타임인원한도 지표가 포함된다. 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목 자료입니다.  지방공기업의 주요 경영정보를 공시함으로써 국민의 알권리를 충족하고, 지방공기업의 정책 수립 등 기초 자료로 활용됩니다.
