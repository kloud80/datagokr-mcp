summary_user: 충청남도 공공시설 감면서비스 통합시스템에 등록된 도내 공공시설을 시설 한 곳당 한 행으로 담은 원장 파일로, 시설유형·지역·담당부서 코드, 시설명·주소·우편번호, 홈페이지와 운영시간·휴무일, 예약시스템 보유 여부와 주소, 현장·온라인·전화 예약 가능 여부, 삭제 여부와 수정일자를 기록한다. 도민이 '우리 지역 공공시설 중 온라인으로 예약할 수 있는 곳은 어디이고 예약 페이지는 무엇인가'를 찾거나, 분석가가 시군별 공공시설 예약 방식 현황을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 매칭이나 같은 기관의 시설코드·담당부서 코드로만 연결하며, 공공시설 개방 표준데이터와 묶어 볼 때도 이름·주소 대조가 필요하다.
description_portal: 충청남도 공공시설 감면서비스 통합시스템 시설정보 데이터는 도내 공공시설의 기본 현황과 운영 정보를 체계적으로 관리하기 위한 자료이다. 본 데이터는 시설코드, 시설유형, 시설지역, 담당부서 코드, 시설명, 주소 및 우편번호, 시설 홈페이지 정보와 예약시스템 보유 여부 및 URL, 시설 운영시간과 휴무일, 현장·온라인·전화 예약 여부, 내부 예약 사용 여부, 삭제 여부, 수정일자 등으로 구성되어 있다. 이를 통해 공공시설의 위치와 운영 특성을 종합적으로 파악할 수 있으며, 감면서비스 연계, 시설 이용 안내, 예약 관리, 행정업무 지원 및 이용자 편의성 제고를 위한 기초자료로 활용된다.
