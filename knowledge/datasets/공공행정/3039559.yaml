summary_user: 청주시 소재 단독·다가구 주택의 개별주택가격(공시가격)을 필지·건물 단위로 담은 파일로, 법정동·지번별 기준연도·기준월, 토지대장면적·산정대지면적, 건물 연면적과 주택가격을 행 단위로 제공한다. 청주시에 단독주택을 가진 국민이나 부동산 분석가가 특정 지번 주택의 공시가격이 해마다 어떻게 바뀌었는지, 동네별 단독주택 공시가격 수준이 어떤지 확인하는 데 쓴다. 법정동코드(bjd_cd)를 키로 행정구역 코드표나 다른 법정동 단위 통계와 잇고, 법정동코드·특수지구분·지번을 조합하면 필지 단위(PNU 체계) 토지·건축물 자료와 맞춰 볼 여지가 있다.
limits: 범위는 청주시 한 곳뿐이라 다른 시군구와 비교하려면 해당 지자체 자료를 따로 받아야 한다. 단독·다가구 주택만 대상이며 공동주택 가격은 담지 않는다. 필지 단위로 이을 때는 실측으로 확인된 키가 법정동코드뿐이므로 지번·특수지구분 조합은 직접 맞춰 검증해야 한다.
