description_portal: 개별주택가격은 매년 1월 1일 기준 청주시 소재 단독 및 다가구 주택에 대한 공시가격 현황 데이터입니다.제공되는 항목은 총 18개 항목으로 아래와 같습니다.(1)법정동코드   (2)법정동명   (3)특수지구분코드   (4)특수지구분명   (5)지번   (6)기준년도   (7)기준월   (8)토지대장면적   (9)산정대지변적   (10)건물전체연면적   (11)건물산정연면적   (12)주택가격   (13)데이터기준일자개별주택가격공시는 매년 1월 1일, 6월 1일기준으로 공시되며, 청주시 개별주택가격열람은 홈페이지(http://house.cheongju.go.kr/index.cj)에서 열람, 도면검색 등 다양한 정보를 제공하고 있으니 참고하시기 바랍니다.
