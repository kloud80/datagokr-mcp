description_portal: '제주특별자치도에서 관리하고 있는 의용소방대조직현황과 관련한 데이터를 제공합니다.항목: 관서구분, 구분별 인원, ,지역대, 전담대, 다문화대 등*재난현장에서 화재진압, 구조ㆍ구급 등의 활동과 화재예방활동에 관한 업무를 보조하기 위하여 의용소방대를 설치할 수 있음*의용소방대원 임명: 그 지역에 거주 또는 상주하는 주민 가운데 희망하는 사람1. 관할 구역 내에서 안정된 사업장에 근무하는 사람2. 신체가 건강하고 협동정신이 강한 사람3. 희생정신과 봉사정신이 투철하다고 인정되는 사람4. 「소방시설공사업법」 제28조에 따른 소방기술 관련 자격ㆍ학력 또는 경력이 있는 사람5. 의사ㆍ간호사 또는 응급구조사 자격을 가진 사람6. 기타 의용소방대의 활동에 필요한 기술과 재능을 보유한 사람자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1238'
