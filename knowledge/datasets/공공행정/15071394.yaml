summary_user: 서울시에 인허가된 골프장을 사업장 한 곳씩 담은 건별 원장으로, 인허가·취소·휴폐업 일자와 영업상태, 지번·도로명 주소와 좌표, 공사립 구분, 보험 가입 여부, 지도자 수, 건축물 동수·연면적, 회원모집 총인원, 법인명을 담는다. 분석가나 행정 담당자가 '서울에서 지금 영업 중인 골프장은 어디이고 언제 문을 열거나 닫았나'를 확인하거나 회원제·퍼블릭 골프장 분포를 지도로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 사업장명 매칭으로 잇고, LOCALDATA 인허가 자료와 같은 원천을 공유한다.
description_portal: 서울시 골프장 인허가 정보는 서울시에 인허가된 골프장의 기본 현황과 영업 상태, 시설·운영 특성을 파악하기 위한 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태명과 상세영업상태명 등을 통해 각 골프장이 현재 영업 중인지, 휴업 또는 폐업 상태인지, 언제부터 어떤 이력을 거쳤는지 확인할 수 있습니다. 사업장명, 전화번호, 지번주소·도로명주소, 우편번호, 좌표정보, 소재지면적 등은 골프장의 위치, 부지 규모, 연락처 정보를 제공하여 지도 분석, 이용자 안내, 현장 점검 등에 활용됩니다. 업태구분명과 문화체육업종명, 세부업종명은 해당 시설이 어떤 형태의 골프장(퍼블릭, 회원제 등)인지와 체육시설 내 세부 분류를 나타냅니다. 공사립구분명은 공공 골프장인지 민간 골프장인지 구분하게 해주며, 보험가입여부코드는 안전사고 대비를 위한 보험 가입 상태를 보여줍니다. 지도자수는 프로 및 지도 인력 규모를, 건축물동수와 건축물연면적은 클럽하우스 등 건축 시설 규모를, 회원모집총인원은 회원제 골프장의 허용 회원 수를 파악하는 데 중요한 지표입니다. 법인명은 법인 운영 골프장일 경우 운영 주체를 식별할 수 있게 하여, 정책 분석과 행정 관리에 유용한 기초 정보를 제공합니다.
