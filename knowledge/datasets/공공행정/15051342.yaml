summary_user: 익산시 전체와 행정동별로 2019년 기준 10세 단위 연령대(0~9세부터 100세 이상까지)의 남녀 인구수를 담은 집계 통계 파일로, 약 4KB 규모의 CSV 한 건이다. 도시계획 담당자나 연구자가 '익산의 어느 동이 고령 인구 비율이 높고 유소년 인구가 적은가'처럼 동네별 인구 구조를 비교하는 데 쓴다. 실측 컬럼에 행정동 코드 같은 전역 조인 키가 없어, 다른 데이터와는 행정구역 이름을 행정표준코드 등에 매핑해 연결해야 한다.
limits: 수록 시점이 2019년 한 해로 컬럼에 고정돼 있어 연도별 추이나 최신 인구는 이 파일만으로 알 수 없다. 행정구역이 코드 없이 이름으로만 있어 다른 데이터와 붙이려면 이름-코드 매핑이 필요하다.
