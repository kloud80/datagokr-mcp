summary_user: 대구 달서구 각 행정복지센터에 설치된 폐형광등·폐건전지 분리수거함을 한 곳씩 담은 원천 목록으로, 위도·경도, 설치 주소, 세부위치, 동명, 설치유형, 담당부서, 기준일자를 담는다. 달서구 주민이 집 근처 어느 동 행정복지센터에 폐건전지나 폐형광등을 버릴 수거함이 있는지 찾을 때, 또는 분석가가 수거함 위치를 지도에 표시할 때 쓴다. 전역 조인 키는 없어 동명이나 설치 주소로 이름 매칭하거나 좌표로 다른 생활 시설 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 대구광역시 달서구 각 행정복지센터 내 위치한  폐형광등 및 폐건전지 분리수거함 현항 데이터를 1년마다 주기에 따라 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 설치 주소, 세부위치, 동명, 설치유형, 담당부서, 기준일자 등으로 구성되어있습니다.재활용품 교환사업 안내사항(동 행정복지센터에서 교환)은 달서구청 홈페이지(www.dalseo.daegu.kr)를 통해 분야별정보 > 환경/위생/맛집 > 청소 > 재활용품 분리배출(무인회수기 포함)에서 확인 가능합니다.해당 현황을 파악하여 폐건전지, 폐형광등 등 관련 재활용품을 올바르게 분리,배출하는 등 재활용하여 자원 낭비를 줄이고 환경 오염을 예방할 수 있습니다.
