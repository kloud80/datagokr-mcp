description_portal: 공공서비스 품질 향상 및 시민 중심의 행정 구현에 대한 요구가 높아지는 가운데, 충청남도 보령시는 모바일민원만족도조사시스템의 메타정보를 기반으로 민원만족도조사 설문현황 데이터를 제공합니다. 본 데이터는 5개 테이블의 자료를 각각의 CSV 파일로 구분하여 제공하며, 압축 해제 후 활용할 수 있습니다. 지자체 및 행정서비스 관련 기관은 본 데이터를 통해 민원 처리에 대한 시민 만족도 현황을 분석하고, 민원 서비스 개선 및 행정 품질 제고를 위한 정책 수립에 활용할 수 있습니다. 또한 공공행정 연구기관에서는 설문 응답 데이터를 바탕으로 민원 유형별·부서별 만족도 비교 분석 및 행정서비스 개선 방안 연구에 기여할 수 있으며, 스마트행정 분야에서는 모바일 기반 민원만족도 조사 시스템의 운영 현황 분석을 통해 디지털 행정서비스 고도화 방안 마련에 본 데이터를 활용할 수 있습니다.
