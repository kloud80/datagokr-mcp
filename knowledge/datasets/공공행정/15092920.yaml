summary_user: 세계법제정보센터가 수집한 각국 정부의 부처·부서와 그 소관 법령을 법령 한 건씩 정리한 목록 파일(CSV, 약 1MB)로, 국가명·주제분류·법령분류·법령명·법령 링크를 담는다. 정책 기획자나 법제 담당자가 "특정 국가의 어느 부처가 어떤 법령을 소관하고, 그 법령은 어떤 분류에 속하는가"를 확인해 타국 조직·법제 체계를 비교할 때 쓴다. 전역 조인 키는 없고, 파일 안에서 법령일련번호·상위법령일련번호로 법령 간 상하 관계를, 부서일련번호로 부서별 묶음을 짓는 정도이며 다른 데이터와는 국가명·법령명 같은 이름 매칭으로만 잇는다.
limits: 다른 데이터셋과 공유하는 공통 코드가 없어 외부 연계는 국가명·법령명 문자열 매칭에 의존해야 한다. 활용신청 없이 내려받는 파일 형태라 실시간 조회용 API로는 쓸 수 없다.
