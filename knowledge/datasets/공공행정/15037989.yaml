summary_user: 부산광역시 북구의회에 제출된 의안을 건별로 담은 파일로, 대수·회기·의안번호·안건명·발의자·소관위원회와 위원회·본회의 처리일 및 결과, 이송·공포일까지 의안 처리 경과를 기록한다(CSV 약 50만 바이트). 주민이나 연구자가 '북구의회 의원별로 몇 건을 발의했고 그중 본회의에서 가결된 비율은 얼마인가' 같은 의정활동 참여율·처리 실적을 따져볼 때 쓴다. 다른 데이터와 바로 붙는 전역 조인 키는 없어서, 같은 북구의회의 회의록·의원 정보 등과는 대수·회기나 의원 이름을 맞춰 연결해야 한다.
description_portal: 부산광역시 북구 기초자치의회의 의정활동 참여율 분석을 위해 제공되는 의안정보 데이터입니다. 이 데이터는 지방의회 초대부터 현재까지의 의안 관련 세부 내역을 포함하며, 대수, 회기, 의안번호, 의안종류, 안건명, 발의(제출)자, 발의(기타), 발의일, 본회의보고일, 소관위원회, 발의의원, 위원회회부일, 위원회처리일, 의원회 결과, 위원회 회차수, 심사보고접수일, 본회의 상정일, 본회의처리일, 본회의 결과, 본회의 회차수, 이송일, 공포일 등의 항목으로 구성되어 있습니다. 이를 통해 의회 활동 전반에 대한 투명한 정보 제공과 정책 연구 및 분석에 활용됩니다.
