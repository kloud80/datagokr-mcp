summary_user: 경기도 동두천시 안의 버스정류장 356곳을 한 곳당 한 행으로 담은 위치 원장으로, 관리번호·정류장번호·정류장명과 위도·경도 좌표, 데이터기준일로 구성된다. 시민이나 분석가가 "우리 동네에서 가장 가까운 버스정류장은 어디인가" 또는 "정류장이 부족한 지역은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 정류장명·정류장번호 매핑이나 위도·경도 좌표 기반 공간 결합으로 잇는다.
limits: 동두천시 한 개 시 범위만 담아 다른 시군 정류장이나 노선·배차·도착 정보는 이 파일로 알 수 없다. 공통 조인 키가 없으므로 버스 노선·정류소 API와 연결할 때는 정류장번호나 이름이 같은 체계인지 먼저 확인해야 한다.
