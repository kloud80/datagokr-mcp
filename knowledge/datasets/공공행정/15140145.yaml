description_portal: 국가데이터처의 "가계금융복지조사"를 기반으로 대한민국 가구의 재정 상태를 연령, 가구유형, 소득분위 등 다양한 가구 특성별로 분석할 수 있도록 자산과 부채 현황 등 핵심 데이터를 제공합니다.제공되는 데이터는 단순히 총 자산 및 부채액을 넘어, 가구의 소득, 지출, 원리금 상환액 등 가계의 경제적 흐름까지 포괄적으로 파악할 수 있게 합니다.이를 통해 특정 계층이나 유형의 가구가 겪는 재정적 어려움이나 부의 불균형 등을 정확하게 진단할 수 있으며, 정부 및 연구기관에서는 취약 가구 지원, 자산 형성 지원, 부채 경감 등 맞춤형 정책을 수립하는 데 필수적인 기초 자료로 활용할 수 있습니다.
