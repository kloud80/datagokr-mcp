description_portal: 이 데이터는 기관이 추진한 사회공헌 활동 현황을 홈페이지를 통해 공개한 자료입니다.사회공헌활동, 백서, 나눔게시판 등으로 구성되어 있으며, 사회적 가치 실현을 위한 기관의 참여 노력을 확인할 수 있습니다.국민은 이를 통해 공공기관이 지역사회와 상생하기 위해 수행하는 사회공헌 사업의 내용을 이해하고, 사회적 책임 이행 수준을 확인할 수 있습니다.정책 담당자와 연구자는 공공부문 사회공헌 정책의 실효성, ESG(환경·사회·지배구조) 경영 확산 정도, 지역사회 공헌 사례를 연구할 수 있습니다.기관 내부에서는 봉사활동 기획, 사회공헌 프로그램 개선, 참여율 제고 전략 수립 등 실무에 활용할 수 있습니다.
