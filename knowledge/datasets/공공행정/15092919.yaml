summary_user: 세계법제정보센터가 제공하는 각국 법령과 관련 콘텐츠의 목록을 담은 엑셀 파일로, 국가(ISO 국가코드·한글명·영어명), 법령의 제정·공포·시행·최종개정일과 정보출처 링크, 콘텐츠 제목·관련 사이트 주소, 상하위 분류 체계가 함께 들어 있다. 법제 연구자나 개발자가 '특정 국가의 어떤 법령이 언제 시행·개정됐고 원문 출처는 어디인가'를 확인하거나 외국 법령 탐색 서비스를 만들 때 쓴다. 실측상 전역 조인 키는 없어 다른 데이터와는 ISO 국가코드나 국가명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 세계법제정보센터에서 제공하는 각국 법령 및 관련 콘텐츠의 구조적·속성적 정보를 체계적으로 정리한 목록입니다. 법령의 고유 식별 코드, 제정·개정 일자, 발행 기관, 문서 형식 및 언어별 지원 현황 등이 포함되어 있습니다. 또한 웹 기반 콘텐츠 연결 링크, 데이터 분류 체계, 주제어 매핑 정보를 함께 제공하여 자동화된 법령 탐색과 시스템 연계 활용을 지원합니다. 이를 통해 법제 관련 연구·개발 환경에서 법령의 관리 효율성과 검색 기능이 강화되며, 플랫폼 간 상호 운용성과 국제 비교 분석의 기반을 마련합니다. 본 자료는 법제 시스템 구축자, 정책 연구자 및 개발자들이 글로벌 법령 데이터를 통합·운영하는 실무적 지침서로서 기능합니다.
