summary_user: 법제처 국가법령정보센터가 제공하는 행정안전부 법령해석 사례를 건별 목록으로 담으며, 해석 일련번호·안건명·안건번호·질의기관·해석기관·해석일자와 상세 본문 링크를 포함하고 범위는 전국·비공간이다. 지방자치·주민등록·재난안전·공무원 인사 등 실무 담당자나 분석가가 '이 쟁점에 대해 행정안전부가 과거에 어떻게 해석했나'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 법령해석일련번호로 본문 조회 서비스와 잇거나 질의기관·해석기관 코드와 이름으로 같은 기관 데이터와 맞춰 쓴다.
description_portal: 법제처 국가법령정보센터에서 제공하는 행정안전부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 지방자치, 주민등록, 재난안전, 공무원 인사 및 조직 운영 등과 관련된 법령에 대해 행정기관이 요청한 해석 사례들을 목록 형식으로 제공합니다. 이용자는 해석 일련번호, 안건명, 질의기관, 해석일자, 접수일자 등의 정보를 바탕으로 해석 요청 건들을 검색할 수 있으며, 회신 여부 및 처리상태를 통해 법령 해석 진행 현황을 확인할 수 있습니다. 목록은 본문 조회 서비스와 연계되어 있으며, 각 해석 건별 세부 회신 내용을 확인할 수 있는 기능도 제공합니다.
