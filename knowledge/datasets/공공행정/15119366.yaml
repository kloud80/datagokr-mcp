description_portal: '본 자료는 민간기업이 설치·운영하고 있는 CCTV에 대한 실태를 파악하기 위한 데이터로, 일반 국민이나 관련 당사자들이 해당 CCTV 영상의 열람을 요청한 사례와 이에 대한 수락 또는 거절 여부, 거절된 경우의 구체적인 사유(예: 개인정보 침해 우려, 저장 기간 경과 등)를 포함하고 있습니다. 이를 통해 민간 영역에서의 영상정보 접근권 보장 수준과 운영의 투명성, 법적 기준의 준수 현황을 진단할 수 있으며, 향후 제도 개선이나 정책 수립을 위한 참고 자료로 활용됩니다. 또한, 이 자료는 국민의 알권리 보장과 함께 민간 기업의 책임 있는 영상정보 관리 실태를 평가하는 데에도 기초 자료로 활용될 수 있습니다.'
