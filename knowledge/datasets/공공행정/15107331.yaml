summary_user: 행정안전 통계연보 '지방행정/지역발전 > 인구' 편에 실린 연도별 지방자치단체 외국인 주민 수를 서울·부산 등 시도 단위로 정리한 집계 통계로, 범위는 전국이며 공간 정보는 담지 않습니다. 지역정책 담당자나 분석가가 "우리 시도의 외국인 주민이 해마다 얼마나 늘었나"를 확인하고 지역 간 비교를 하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 주민등록 인구 등 다른 데이터와는 시도 이름을 맞춰 매핑해 이어 써야 합니다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '인구', '연도별 지방자치단체 외국인 주민' 에 관한 통계입니다. 서울, 부산, 대구, 인천, 대전, 세종, 충북, 충남 등 연도별 지방자치단체 외국인 주민 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
