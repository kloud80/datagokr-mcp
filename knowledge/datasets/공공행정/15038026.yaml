description_portal: 경상남도 창원시 초대부터 현재 까지의 의안정보(의안번호, 의안명, 제안회기, 제안자, 소관위위원호, 본회의 상정일 등) 입니다.지방의회 의안정보 데이터는 각 지방의회에서 발의된 조례·규칙·동의안 등의 의안번호, 의안명, 제안회기, 제안자, 소관 위원회 회부일, 본회의 상정일 및 처리 결과, 집행기관 이송일 등을 포함한 기록을 연대별·회기별로 체계적으로 정리한 자료입니다. 해당 데이터는 입법 활동 모니터링, 조례 검토, 의회 의제 발굴, 정책안 평가, 민원 관련 법률 지원, 행정 감시 체계 강화 등에 활용되며, GIS와 연계한 시공간 분석이나 회기별 처리율 시계열 비교를 통해 지방자치 투명성과 입법 효율성 강화의 기초 자료 역할을 합니다
