description_portal: “공단에서 운영중인 나드리콜 운영 서비스에 관한 정보”는 교통약자의 이동 편의를 위해 공단에서 운영 중인 나드리콜 서비스의 연도별 이용 현황을 제공하는 데이터입니다. 이 데이터는 뇌병변, 지체, 시각, 신장, 지적, 자폐성 장애인, 노약자, 국가유공자, 기타 교통약자 등 다양한 이용자 유형별 통계를 포함하고 있으며, 이용 건수 및 변화 추이를 통해 교통복지 서비스 수요를 파악하고 정책 수립에 활용될 수 있습니다. 본 데이터는 교통약자 이동권 보장 및 맞춤형 이동지원 서비스 개선을 위한 기초자료로 제공됩니다.
