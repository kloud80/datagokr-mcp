description_portal: '○ 통계개요* 통계명 : 최저주거수준 미달가구* 통계종류 : 인구주택총조사 자료를 바탕으로 최저주거수준 미달가구 현황을 제공하는일반·가공통계* 근거법령 :「서울시 주택조례」에 의거 모든 가구가 확보하여야 할 주거수준인 최저주거기준 미달가구* 작성목적 : 아파트의 주거기준 준수여부를 파악하여 아파트 건설 및 효율적인 관리를위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 서울연구원* 공표주기 : 부정기(5년 주기) * 2000년 생산종료* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 유형별(침실수기준ㆍ시설기준ㆍ중복 미달) 최저주거기준미달가구 현황○ 용어설명* 최저주거기준 : 국민이 쾌적하고 살기 좋은 생활을 영위하기 위하여 가구구성별 최소주거면적, 용도별 방의개수, 안정성, 쾌적성 등을 고려한 주택의 구조, 성능 및 환경 기준○ 기타* 5년 단위 조사인 통계청 인구주택총조사 원자료를 활용* 2005년부터 관련지표 생산안됨○ 출 처 : 서울연구원'
