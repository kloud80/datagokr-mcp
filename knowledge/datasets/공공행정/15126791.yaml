description_portal: '국가데이터처는 조사.분석 결과 및 통계자료를 정리하여 간행물 형태로 제공하고 있습니다. 주제별.명칭별.기획형 등으로 다양한 종류가 있으며, 통계도서관 검색창을 통해 원하는 간행물을 찾을 수 있습니다. 국가데이터처에서 발간하고 통계도서관에서 소장중인 2025년 통계청 발간 간행물 목록으로 단행본 및 연속간행물 목록입니다.제공항목은 다음과 같습니다. 1) 단행본 목록 :  순번, 도서명, 저자, 출판사, 출판연도2) 연속간행물 :  순번, 발행일, 책등권차, 도서명주요 간행물 예시: (연속간행물) 한국통계월보:대한민국통계월보, 통계의 창, (SRI)통계플러스 등                                  (단행본)2026년도 통계조정업무 매뉴얼, 통계데이터센터 활용사례집 등'
