summary_user: 경기도 시군별 불법광고물 단속 실적을 집계년도·분기 단위로 모은 집계 자료로, 현수막·입간판·벽보·전단·기타 유형별 단속 수량을 담는다. 지자체 담당자나 분석가가 "어느 시군에서 어떤 유형의 불법광고물 단속이 분기별로 많은가"를 비교하고 단속·정비 정책을 검토하는 데 쓴다. 전역 조인 키는 없고 시군명(sigun_nm)과 연도·분기를 기준으로 다른 경기도 시군 통계와 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 불법광고물의 단속 실적을 집계년도 및 분기별로 기록한 자료로, 단속 대상 광고물의 유형별 수량(현수막, 입간판, 벽보, 전단, 기타)으로 구성되어 있습니다. 각 광고물 유형별 단속 건수를 통해 시군별 불법광고물 발생 양상과 집중 단속 필요 구간을 분석할 수 있으며, 광고물 설치 행태에 따른 관리정책 수립, 거리미관 개선 및 도시경관 향상을 위한 기초자료로 활용됩니다. 이 데이터는 공공질서 유지, 옥외광고물 규제 정책, 민원 대응 현황 분석, 예산 투입의 효과성 검토 등 실무 및 정책 전반에 걸쳐 활용 가치가 높습니다.
