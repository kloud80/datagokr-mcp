summary_user: 물품·용역·외자·공사 업무별로 나라장터에 공개된 사전규격을 건별로 담으며, 사전규격등록번호·품명·발주기관·배정예산금액·의견등록마감일시·규격문서 파일과 업체가 낸 규격서 의견을 포함한다(검증 시 API 전체 218건, 전국, 2026-09-18~2026-10-11 범위). 입찰 참여를 준비하는 사업자가 '입찰공고 전에 우리 품목의 규격이 어떻게 잡혔고, 의견 마감이 언제인가'를 확인하는 데 쓴다. 사전규격등록번호(bfSpecRgstNo)로 목록과 규격서 의견·답변을 잇고, 입찰공고번호목록으로 이후 입찰공고와 대조하는 데 쓰지만, 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 기관명·품명 매핑으로 연결해야 한다.
description_portal: 물품, 용역, 외자, 공사 업무별로 나라장터에 공개된 사전규격정보를 제공하는 서비스로 업무별 사전규격 전체목록 및 기관별, 품목별로 사전규격을 조회할 수 있으며 사전규격등록번호, 품명(사업명), 배정예산액, 관련규격서파일, 규격서 의견 등을 제공하는 나라장터 사전규격정보서비스사전규격공개란? 국가계약법(정부입찰계약집행기준) 및 지방계약법에 따라 입찰에 부치는 경우 입찰공고를 등록하기 이전에 미리 물품 또는 용역에 대한 규격을 사전 공개하고 관련 업체가 의견을 제시할 수 있게 하는 절차
