summary_user: 국가통계포털(KOSIS)에 실린 통계표마다 자료 주기(연·분기·월 등)와 수록 시작·종료 기간, 공표 구분, 최종 변경일 같은 메타정보를 통계표 한 건당 한 행으로 담은 전국 단위 비공간 파일(csv)이다. 분석가가 'KOSIS의 이 통계표는 몇 년부터 어떤 주기로 쌓였고 최신 시점은 언제인가'를 미리 확인해 시계열 분석에 쓸 통계표를 고를 때 쓴다. 통계표 아이디(kosis_tbl_id)로 같은 기관의 통계표 정보 파일과 이어 통계표 이름·분류를 붙이고, 같은 키로 KOSIS 통계 수치 조회와 연결한다.
description_portal: 통계청_통계표 수록기간 정보는 통계청 국가통계포털(KOSIS)에 수록된 각 통계표가 언제부터 언제까지의 자료를 포함하고 있는지를 나타낸 파일데이터이다.이 정보는 통계표별로 최초 수록연도, 최신 수록연도, 그리고 수록 단위(연도별, 분기별, 월별 등)를 포함하고 있어 시계열 분석이나 장기적인 추세 비교에 유용하다.이 데이터를 통해 특정 통계표가 다루는 기간 범위를 명확히 파악할 수 있으며, 분석에 적합한 통계자료를 사전에 선별할 수 있다.*통계표아이디는 파일데이터(통계청_통계표 정보) 참조
