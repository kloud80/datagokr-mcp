summary_user: 충청남도 계룡시가 착한가격업소로 지정한 관내 업소를 업소 한 곳당 한 건으로 담으며, 업소명·대표 품목·가격·도로명주소·연락처·비고를 제공한다(포털 설명상 2021년 9월 1일 기준 현황). 계룡시 주민이나 방문객이 '계룡시에서 저렴한 가격으로 이용할 수 있는 지정 업소가 어디이고 대표 메뉴 가격은 얼마인가'를 확인하거나, 분석가가 지역 착한가격업소 분포를 상권 분석 원료로 살피는 데 쓴다. 전역 조인 키가 없어 업소명이나 도로명주소(RDNMADR)를 기준으로 LOCALDATA 인허가 등 다른 업소 원장과 이름·주소 매칭으로만 이어 쓴다.
description_portal: 충청남도 계룡시의 '착한가격업소 API' 데이터는 저렴한 가격으로 양질의 서비스를 제공하는 착한가격업소로 지정된 관내 업소들의 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 착한가격업소 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 지정된 업소 명, 해당 업소의 대표 품목과 가격 정보, 업소의 정확한 도로명주소, 그리고 문의를 위한 연락처가 포함됩니다. 또한, 추가 정보를 제공하는 비고 항목도 있습니다.
