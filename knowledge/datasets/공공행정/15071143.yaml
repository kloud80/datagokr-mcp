description_portal: 부산광역시 영도구 옥외광고물 허가·관리와 관련된 정보입니다. 본 데이터는 관내에 설치된 옥외광고물의 현황을 체계적으로 관리하기 위해 수집된 정보로서, 광고물의 업종명, 업태, 주소(읍·면·동, 도로명, 건물번호1·2), 건물명 등 기본 위치 정보를 포함하고 있습니다. 또한 광고물의 종류, 형식, 규격, 표시기준 준수 여부, 허가·신고 정보, 안전점검 내역 등 행정관리 업무에 필요한 주요 항목이 포함되어 있어 영도구 내 옥외광고물의 허가·신고 관리, 유지관리, 불법광고물 단속, 정비계획 수립 등에 활용될 수 있습니다.본 자료는 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」 및 같은 법 시행령, 그리고 영도구 옥외광고물 조례에 따른 관리·점검·정비 의무를 이행하기 위해 구축된 것으로, 옥외광고물의 안전성 확보, 도시 미관 개선, 합법 광고물 관리 강화 등 정책 수립의 기초자료로 제공됩니다.
