summary_user: 경기도 행정동 단위로 집계한 주민등록 인구·세대 현황 통계로, 기준연월별 총인구수·세대수·세대당 인구수·남녀 인구수와 성비를 담는다(포털 설명상 2018년 10월 기준). 지자체 담당자나 분석가가 '경기도 어느 행정동이 세대당 인구가 적어 1인 가구 비중이 높을 것으로 보이는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군코드·행정동코드나 시군명·행정동명을 다른 행정동 단위 자료와 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 행정동 단위로 집계된 2018년 10월 기준 주민등록 인구 및 세대 현황 통계입니다. 항목은 '기준연월', '시군코드', '행정동코드', '시군명', '행정동명'과 함께 '총인구수', '세대수', '세대당인구수', '남성인구수', '여성인구수', '남성여성비율'로 구성되어 있으며, 일부 항목에는 분석 연월 및 생성일자 정보도 포함됩니다. 각 행정동의 인구 구성 및 세대 구조를 세밀하게 파악할 수 있어 도시계획 수립, 지역별 복지 수요 예측, 지역 균형발전 전략 수립 등에 활용될 수 있습니다. 성비 및 세대당 인구수 등의 지표는 고령화, 1인 가구 증가 등 사회변화 양상을 분석하는 데에도 활용 가능합니다.
