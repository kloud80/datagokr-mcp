summary_user: 법률별 공포일자·시행일자와 제개정 구분, 법령 구분, 소관부처, 게재 발행명을 건별로 담은 전국 단위 파일(CSV 약 7.4MB) 데이터다. 정책 분석가나 사업자가 '특정 부처 소관 법률 중 최근 공포됐거나 곧 시행되는 개정 법률은 무엇인가'처럼 법률 변경 시점을 확인하는 데 쓴다. 실측 컬럼에 법령ID 같은 전역 조인 키가 없어 다른 법령 데이터와는 법령명·소관부처명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 법률에 대한 공포일자, 시행일자를 관리하는 데이터로, 게재발행명, 소관부처명, 공포일자 및 시행일자, 제개정 구분명, 법령구분명의 항목을 제공합니다. 해당 데이터는 법률의 제정과 공포 일자, 발효 상태 및 관련 절차를 포함하며, 이를 통해 입법 현황을 명확히 파악할 수 있도록 구성되어 있습니다. 또한 법령의 등록정보와 개정 이력 등을 포함하여, 법령 운영의 투명성을 높이고 법률 정보의 효율적 관리에 기여합니다. 본 자료는 입법 기관 및 관계 기관에서 법률 현황을 신속하게 확인하는 데 활용되며, 법률 연구 및 정책 분석의 기초 자료로도 활용됩니다. 법률의 체계적 관리와 정확한 정보를 제공하는 데 중점을 둔 중요한 데이터입니다.
