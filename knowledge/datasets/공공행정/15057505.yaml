summary_user: 법령별 3단 비교(법률·시행령·시행규칙 등 위임·인용 조문을 나란히 놓은 비교) 목록을 법령 단위로 담으며, 각 행에 법령명·법령구분·소관부처·공포일자·공포번호·시행일자·제개정구분과 위임조문·인용조문 3단 비교 상세 링크가 붙는다. 법령을 찾는 분석가나 실무자가 "이 법률의 위임 조문이 하위 시행령·시행규칙 어디로 이어지고 언제 시행됐나"를 확인하고 상세 비교 화면으로 넘어갈 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 법령ID·법령명이나 같은 기관 코드(소관부처코드)로 법제처의 다른 법령 목록·본문 데이터와 이어 쓴다.
description_portal: 본 데이터는 법령의 개정 전·후 내용을 구조적으로 비교할 수 있도록 제공하는 자료입니다. 각 조문에 대해 구법, 현행법, 신법의 세 가지 단계로 나누어 내용을 제시하며, 조문번호, 조문명, 조문별 비교 내용 등이 포함되어 있습니다. 또한 개정일자, 시행일자, 법령명칭 및 소관 부처 등의 부가 정보도 함께 제공되어 법령의 변화 경과를 명확히 파악할 수 있도록 구성되어 있습니다. 조문별 개정 전후의 차이를 병렬적으로 비교할 수 있어 법령 개정의 취지와 내용을 직관적으로 확인할 수 있습니다. 해당 정보는 조문 단위로 정리되어 법령 해석 및 적용 시 정확한 법적 판단을 지원하며, 법령의 연혁과 변동 사항을 분석하는 데 유용한 기초 자료로 활용됩니다.
