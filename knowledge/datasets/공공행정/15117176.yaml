summary_user: 대구광역시 달서구가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·상호·도로명/지번 주소·위도·경도·전화번호·대표메뉴와 그 가격을 포함한다. 주민이나 방문객이 '달서구에서 대표메뉴를 저렴하게 파는 착한가격업소가 어디 있나'를 찾거나, 행정·상권 분석가가 지역 내 착한가격업소 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 상호를 맞추거나 좌표로 공간 결합해 이어 쓰며, 같은 상권 부문의 지방행정 인허가(LOCALDATA) 업소 원장과 대조하는 용도가 대표적이다.
description_portal: 매해 저렴한 가격으로 양질의 서비스를 제공하는 착한가격업소를 달서구에서 지정한 업소에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.업종, 상호, 소재지도로명주소, 소재지지번주소, 위도, 경도, 전화번호, 대표메뉴, 대표메뉴가격, 데이터기준일자 등으로 구성되어있으며 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 착한가업소를 파악하는데 유용하게 참고자료로 쓸수 있으며  행정업무에 쓰는데 활용 가능합니다.
