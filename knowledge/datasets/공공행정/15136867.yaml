summary_user: 대학재정알리미의 국공사립대학 기숙사 운영현황을 연도·학교·캠퍼스별로 집계한 파일로, 재학생 수·수용가능인원·기숙사수용률·지원자 수·입사경쟁률을 설립구분·학교급·학종·지역 구분과 함께 전국 범위로 담는다. 수험생·학부모가 지원할 대학 캠퍼스의 기숙사 수용률과 입사경쟁률을 비교하거나, 분석가가 지역·설립구분별 기숙사 공급 수준을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 대학 데이터와는 학교명·캠퍼스명과 연도를 기준으로 이름을 맞춰 연결해야 한다.
description_portal: 한국사학진흥재단_대학재정알리미 기숙사 수용현황은 한국사학진흥재단의 국공사립대학 캠퍼스별 기숙사 운영현황 집계를 통해 산출된 자료로, 대학의 캠퍼스별 수용 현황을 확인할 수 있습니다.대학재정알리미 기숙사 수용현황 데이터는를 통해 국공사립대학의 재학생수, 수용가능인원, 기숙사수용률 등의 정보를 학교별, 캠퍼스별, 설립구분별, 학급별, 학종별, 지역별로  확인 할 수 있습니다.해당 내용은 한국사학진흥재단 대학재정알리미 시스템(https://uniarlimi.kasfo.or.kr/main/)을 통해서도 확인할 수 있습니다.
