summary_user: 중앙해양안전심판원 행정심판 재결례를 사건 한 건당 한 행의 목록으로 담으며, 사건명·재결번호·처분청·재결청·처분일자·의결일자·재결구분과 상세 재결문 링크를 포함하고 범위는 전국·비공간이다. 해기사·선박 운항자나 법률 실무자가 '비슷한 해양사고 처분에 대해 행정심판에서 어떤 재결이 났는가'를 찾거나, 연구자가 처분 유형별 판단 경향을 볼 때 쓴다. 전역 조인 키는 없으며, 재결례 일련번호(특별행정심판재결례일련번호)나 상세 링크로 같은 기관의 재결례 본문 조회와 잇고, 다른 데이터와는 처분청 이름 매핑으로만 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 중앙해양안전심판원 행정심판 재결례 데이터로, 행정심판 재결례에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 해양사고 및 선박운항과 관련된 행정심판의 재결례 목록을 제공하며, 각 사례의 사고 유형, 결정일자, 심판 결과 및 처분 내용을 체계적으로 확인할 수 있습니다. 이용자는 분류체계에 따라 사고유형, 심판연도, 처분 종류 등을 기준으로 원하는 사례를 효율적으로 검색할 수 있으며, 목록 정보를 기반으로 개별 재결문 본문 접근을 지원합니다. 이 서비스는 해양 안전 규정의 적용 현황과 판단 경향을 분석하는 데 유용하며, 연구자 및 정책실무자가 신속하게 자료를 확보하고 종합적으로 검토할 수 있도록 설계되었습니다.
