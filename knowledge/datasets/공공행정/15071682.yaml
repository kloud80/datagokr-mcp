summary_user: 서울시 외국인관광도시민박업(게스트하우스·홈스테이 등) 업소를 한 곳씩 담은 건별 인허가 원장으로, 인허가·취소·폐업·휴업 일자와 영업상태, 주소·좌표, 객실수·층수·면적 같은 시설 정보를 담는다. 관광·숙박 분석가나 창업 예정자가 '우리 구에 영업 중인 외국인 대상 민박이 몇 곳이고 최근 폐업이 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 원천인 LOCALDATA 인허가 자료와는 관리번호(MGTNO)·사업장명·주소 매칭으로, 상권·행정동 격자 자료와는 좌표나 주소를 거쳐 잇는다.
description_portal: 서울시 외국인관광도시민박업 인허가 정보는 외국인을 대상으로 하는 도시형 민박(게스트하우스, 홈스테이 등)의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 취소일자, 폐업·휴업·재개업일자, 영업상태·상세영업상태로 각 민박업소의 행정 이력과 현재 영업 여부를 파악할 수 있습니다. 지번·도로명주소, 우편번호, 좌표, 사업장명, 전화번호, 소재지면적은 입지와 기본 시설 정보를 제공하며, 문화체육업종명, 문화사업자구분명, 지역구분명, 주변환경명, 건물용도명 등은 관광·숙박시설로서의 성격과 입지 특성을 보여줍니다. 객실수, 층수, 건축연면적, 시설면적, 시설규모, 부대시설내역, 기념품 종류, 회의실 동시수용인원, 방송·발전·의무실·안내소 여부 등은 숙박 및 관광서비스 제공 수준을 분석하는 데 활용됩니다. 보험기관명, 각종 보험기간, 기획여행보험 정보, 자본금 등은 안전·재정·보험 관리 상태를 확인할 수 있게 하고, 영문상호명·영문주소, 선박 관련 항목은 외국인 대상 서비스 특성과 특수 형태 숙박업(선박 활용 등) 파악에 도움을 줍니다.
