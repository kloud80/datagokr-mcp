description_portal: '한국해양수산연수원의 정규직 직원에 대한 연도별 평균 보수 현황을 수록하고 있으며, 2019년부터 2025년까지의 기본급, 공제수당, 실적수당, 복리후생비, 성과급 및 평균보수 총액 등을 포함합니다. 성별 보수 차이도 함께 제공되어 남성과 여성 직원 간 연봉 수준 및 격차를 파악할 수 있습니다. 특히, 평균보수 대비 남성 보수 비율 지표는 조직 내 성별 임금 격차 개선 여부를 분석하는 데 활용 가능하며, 연도별 인건비 추이를 통해 예산 계획 및 인사 정책 수립의 기초자료로 활용될 수 있습니다. * 데이터 기준일 : 25.09.11'
