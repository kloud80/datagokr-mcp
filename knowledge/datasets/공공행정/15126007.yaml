summary_user: 국회 본회의 회의록을 회의 단위로 담으며, 대수(DAE_NUM)·회의일자·회의 구분·회차·안건(부제) 정보와 영상·회의록·PDF 링크를 함께 제공하는 전국 범위의 비공간 데이터이다. 시민이나 의정 분석가가 "특정 날짜 본회의에서 어떤 안건이 다뤄졌고 회의록 원문은 어디서 볼 수 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 의안·표결 데이터와는 대수·회의일자·안건명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
