description_portal: 비축물자 경제용어를 한글명, 영문명으로 제공하고 용어설명 제공.○ 비축제도의 의의자원의 유한성, 지역적 편재, 그리고 생산 및 판매 Cartel화 경향과 수요측면에서 인구의 증가, GNP 증가, 산업의 고도화에 따른 수요 확대 등으로 기본적으로 수급양면에서 불균형의 요인과 국제정치적 요인이 더욱 자원문제를 복잡하게 합니다.이러한 이유로 국제원자재 시장은 파동가능성이 상존하고 있으며, 실제로 가격의 등락이 심하게 나타나는 상황하에서 소요자원의 안정적 확보를 위하여 채택하고 있는 방법이 비축제도입니다.즉, 가격이 안정되었을 때 원자재를 비축해 두었다가 가격 상승 시 이를 방출함으로써 수급 및 가격안정을 도모하는 것입니다.○ 비축품목의 선정비축대상물자는 다음의 기준에 해당하는 물자로서 기획재정부장관이 관계중앙행정기관의 장과 협의하여 고시하는 물자를 말한다.(조달사업에 관한 법률 시행령 제3조)- 해외의존도가 높은 물자- 국민생활 안정에 매우 중요한 물자- 방위산업물자의 안정적 생산을 위해 필요한 물자- 그 밖에 물가안정과 수급조절, 재난·국가위기 등 비상시 대비를 위해 긴급히 대처할 필요가 있는 물자- 비축대상물자 고시(기획재정부고시 제2014-6호)알루미늄, 구리류, 아연류, 연류, 주석류, 니켈류, 희소금속류(실리콘, 망간, 코발트, 바나듐, 인듐, 리튬, 탄탈럼, 스트론튬, 비스무스), 방산물자용원자재, 재활용원자재, 긴급수급조절물자
