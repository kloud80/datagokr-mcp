summary_user: 지방자치단체별·회계연도별 지방보조금 당초예산 편성 현황을 담은 집계 데이터로, 2021 회계연도 이후 일반회계와 기타특별회계를 대상으로 총액한도, 예산편성액, 한도내·한도외 편성액, 총액한도 대비 편성액 비율을 전국 단위로 제공한다. 분석가나 주민이 "우리 시·군·구는 지방보조금 총액한도를 얼마나 채워 편성했고 한도외 편성은 얼마인가"를 지자체끼리 비교할 때 쓴다. 전역 조인 키는 확인되지 않아 회계연도(fyr)와 자치단체 코드(laf_cd)·자치단체명으로 같은 지방재정365 공시 데이터와 이름·코드 매핑하여 연결한다.
description_portal: 지방자치단체의 지방보조금은 법령 또는 조례에 따라 지방자치단체가 다른 지방자치단체, 법인, 단체 또는 개인 등이 수행하는 사무나 사업을 조성하거나 이를 지원하기 위해 교부하는 재정지원금입니다. 지방자치단체보조금관리에 관한 법률과 지방보조금관리기준에 따라 운영되며, 지방자치단체의 장은 매년 보조사업에 대한 성과평가를 실시하고 있습니다.지방보조금 정보는 2021 회계연도 이후 정보가 제공되며 일반회계와 기타특별회계를 대상으로 당초예산편성정보가 취합됩니다. 세부 제공 항목으로는 총액한도, 예산편성액, 한도내편성액, 한도외편성액, 총액한도대비편성액비율 정보가 제공됩니다.
