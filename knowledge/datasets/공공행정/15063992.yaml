description_portal: 창원시 사업체분석을 위한 행정구역코드, 사업체구분이름,사업체분류코드, 사업체구분이름 등에 대한 데이터이다.사업체 코드 정보 데이터는 통계청 및 관계 기관이 산업 활동을 파악하기 위해 각 사업체에 부여한 고유 식별 코드 및 업종 분류 체계를 정리한 자료입니다. 주요 구성 항목으로는 산업 분류(대분류, 중분류, 소분류, 세세분류)별 코드, 표준산업분류(KSIC) 체계상 코드 명칭, 코드 사용 기간, 폐지 여부, 연계 산업군 등이 있으며, 이 데이터는 사업체 조사, 지역 산업 구조 분석, 정책별 산업군 매핑, 세제 및 보조금 대상 추출, 지역경제 통계 정제 및 정렬, 경제 센서스 기반 공간 시각화 분석 등에 활용됩니다. 다양한 행정자료 및 기업체 정보와 연계될 수 있어, 정부·공공기관·지자체의 정책 설계와 민간의 시장 조사에 핵심 기준 자료로 기능합니다.
