summary_user: 대구광역시 군위군의회가 2018·2019년에 다룬 의안을 의안 한 건당 한 행으로 담은 CSV 파일(약 15KB)로, 의안번호·건명·발의자, 위원회와 본회의의 회부·상정·처리일과 결과, 집행부 이송일·공포일·공포번호를 포함한다. 주민이나 의정 분석가가 '군위군의회에서 특정 조례안이 언제 발의돼 어느 위원회를 거쳐 언제 가결·공포됐는가'를 확인하거나 처리 기간을 따지는 데 쓴다. 전역 조인 키는 없어서 다른 지자체 의회 의안 자료나 자치법규 자료와는 건명·공포번호를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 대구광역시 군위군의회에서 관리하고 있는 2018년, 2019년 의안정보현황에 대한 데이터로 의안번호, 건명, 발의자 제출자, 발의일 제출일, 간담회, 위원회(위원회명, 회부일, 보고일, 상정일, 처리일, 결과), 본회의(보고일, 상정일, 처리일, 결과), 집행부 이송일, 공포일, 공포번호, 처리회기의 항목을 제공합니다. 국회 또는 지방의회에서 처리되는 법률안, 결의안, 동의안, 예산안 등 각종 의안의 제안부터 처리까지 전 과정에 대한 정보를 체계적으로 기록한 데이터입니다. 주로 입법 모니터링, 정책 분석, 의정 활동 평가 등에 활용됩니다.
