summary_user: 국회입법조사처가 입법·정책과제를 조사·분석해 펴낸 연구보고서 발간물을 건별로 담으며, 발간물 제목·구분·등록일과 PDF 파일·뷰어 주소를 제공한다(전국 단위·비공간). 입법 동향이나 특정 정책 쟁점에 대해 국회 차원의 조사·분석 보고서가 나왔는지 찾아 원문 PDF를 확인하려는 연구자·보좌진·기자의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 법제 데이터와는 발간물 제목·주제어 같은 이름 매핑이나 같은 기관(국회) 기준으로만 이어 쓴다.
limits: 다른 데이터셋과 직접 결합할 공통 키가 없어 법령·의안 데이터와의 연결은 제목·키워드 매칭에 의존한다. 보고서 본문은 PDF 링크로만 제공되므로 내용 분석은 파일을 따로 내려받아 처리해야 한다.
