summary_user: 경상북도 김천시의 읍·면·동별 행정구역 구성을 한 행씩 담은 소규모 파일(csv 약 3.9KB)로, 행정복지센터 소재지 도로명주소와 위도·경도, 통·행정리·반 수, 대응하는 법정동·법정리명을 함께 담는다. 김천시 각 읍면동 행정복지센터가 어디에 있고 그 아래 통·리·반이 몇 개인지 확인하거나, 읍면동 단위 위치기반 행정서비스 지도를 만들 때 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 데이터와는 읍면동 이름이나 법정동·법정리명을 맞춰 연결하고, 좌표(위도·경도)로 공간 결합한다.
description_portal: 이 데이터는 경상북도 김천시의 행정구역 체계 전반을 구조화하여 제공하는 공공 데이터셋으로,읍·면·동 단위의 행정구역 구성, 행정복지센터 위치 정보, 법정구역 분포, 그리고 세부 통계 단위인 통·리·반 수 등을 포괄하고 있습니다.김천시는 시 단위 행정 체계 안에서 총 1개 읍, 14개 면, 7개 행정동으로 구성되어 있으며,각 읍면동은 법정동·법정리와 대응되는 공간 단위로, 도로명주소·지번주소·위도·경도 정보와 함께 제공됩니다.이 데이터는 행정계층구조분석, 위치기반 행정서비스, 주민편의 증진정책 수립 등에 유용하게 활용 될 수 있습니다.
