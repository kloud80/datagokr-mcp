description_portal: 한국토지주택공사는 토지, 건물의 경제적 가치를 산출하기 위해 감정평가 법인을 선정합니다.이를 위해 한국토지주택공사에서 공고한 감정평가 공고 현황(감정평가공고번호, 공고명, 공고시작일자, 공고종료일자) 정보를 제공합니다. 공고명을 통해 단독주택용지, 사택매각, 전세임대, 법인 감정 평가, 대토보상, 도시지원용지 등의 선정계획을 알 수 있습니다.감정평가공고번호는 공고를올린시점, 순번을 조합해 구성되며 공고시작일자와 공고종료일자를 공시하여 해당 공고의 모집 혹은 시행 기간에 대한 정보를 제공합니다.
