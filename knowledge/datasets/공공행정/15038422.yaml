description_portal: 「디지털정보격차 실태조사 통계자료」는 국민의 디지털 접근성과 활용 능력, 역량 등을 종합적으로 파악하기 위해 시행되는 조사로, 디지털 포용 정책의 기초자료로 활용됩니다. 주요 항목으로는 스마트폰이나 태블릿 등 모바일기기 보유율과, 디지털기기나 PC를 얼마나 능숙하게 사용하는지를 측정하는 디지털기기 이용능력 및 PC 이용능력이 포함됩니다. 또한 정보검색, 온라인 민원 처리 등 전반적인 역량을 종합한 디지털역량 지수와, 디지털기기 사용의 빈도·목적 등을 파악하는 디지털기기 이용현황, 사용자가 스스로 느끼는 자신감 수준인 디지털기기 이용 효능감도 조사 항목에 포함됩니다. 마지막으로 디지털 교육에 대한 국민의 수요와 선호 형태를 파악하기 위한 정보화교육 수요 항목이 포함되어 있으며, 계층·지역 간 격차 해소 정책 수립에 활용됩니다.
