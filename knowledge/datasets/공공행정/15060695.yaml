description_portal: 이 자료는 행정부 국가공무원 중 일반직공무원을 대상으로 한 재직기간 통계 데이터입니다. 두 개의 통계표로 구성되어 있는데, 현재 계급에서의 재직기간, 그리고 공직에서의 재직연수 자료입니다.해당 자료는 세부직종별/계급별/성별로 구분되어 있으며, 현재 계급에서의 재직연수는 3년미만, 3년, 4년, 5년, 6년, 7년, 8년, 9년, 10~11년, 12년이상으로 구분되어 있고, 평균연수를 연.월.로 작성하고 있습니다.공직에서의 재직연수는 공무원으로 처음 입직한 날로부터 기준일(매년 12월 31일)까지의  기간을 산정한 것입니다.해당 통계에는 지방에 두는 국가공무원, 전문경력관, 시간선택제, 전담직위, 임기제공무원은 제외되었습니다.
