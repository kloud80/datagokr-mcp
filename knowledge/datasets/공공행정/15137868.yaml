summary_user: 경기도 광주시의회 홈페이지가 관리하는 의원 지역구 목록으로, 의회 기수(대수)별 선거구 코드·선거구명·지역명과 영문 명칭, 홈페이지 표시 순서를 지역구 한 건씩 담은 작은 원천 파일(csv 약 4KB)이다. 광주시민이나 분석가가 "우리 동네는 몇 대 의회에서 어느 선거구에 속하고, 그 선거구 의원은 누구인가"를 확인할 때 의원 명단과 맞춰 본다. 전역 조인 키는 없어서 같은 의회 홈페이지의 의원 정보와는 선거구 코드·선거구명으로, 선거 데이터와는 선거구명·지역명 문자열 매칭으로만 잇는다.
limits: 선거구 코드는 의회 홈페이지의 시스템 관리용 코드로, 표준 행정구역 코드나 선관위 코드와 바로 연결되지 않는다. 범위는 광주시 한 곳의 비공간 목록이라 경계 좌표가 없고, 다른 시군 의회와 비교하려면 이름 기준 매핑이 필요하다.
