description_portal: 본 데이터는 경기도 광주시의회 홈페이지에서 관리하는 의원 지역구 정보를 제공합니다. 지역구 의원이 대표하는 선거구의 구분과 명칭 정보를 담고 있습니다. 고유번호는 각 지역구를 식별하는 코드이며, 대수는 해당 지역구가 적용되는 의회 기수를 나타냅니다. 선거구 코드는 시스템 관리용 코드이고, 선거구명과 지역명은 각각 공식 선거구 명칭과 지역 명칭을 제공합니다. 영문 선거구명과 영문 지역명은 다국어 서비스를 위한 정보이며, 정렬순서는 홈페이지 표시 순서를 결정합니다. 본 데이터는 의원 프로필 관리, 지역 대표성 표시, 선거구별 의정 활동 분류, 지역 민원 연결 등에 활용됩니다.
