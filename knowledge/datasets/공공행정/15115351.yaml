summary_user: 서울 강남구에 있는 유흥주점(룸살롱·스탠드바·노래클럽 등) 영업 인허가 업소를 한 건씩 담은 원장이다. 인허가일자, 영업상태(영업·폐업), 휴·폐업일자, 주소, 업태, 좌표가 함께 실려 있다. 상권 분석가나 창업 예정자가 "강남구 특정 지역에서 유흥주점 개·폐업이 언제 얼마나 있었나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 잇고, 원천을 공유하는 LOCALDATA 인허가 자료와 대조해 쓴다.
description_portal: 서울시 강남구 유흥주점영업 인허가 정보(https://data.seoul.go.kr/dataList/OA-18574/S/1/datasetView.do)서울특별시 강남구 지역에 위치해 있는 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소정보관리번호, 인허가일자. 영업상태명, 상세영업상태명(영업/정상,폐업), 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소, 위생업태명, 사업장명 등으로 구성된 목록입니다.데이터 활용시 참고하시기 바랍니다.
