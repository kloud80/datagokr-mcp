description_portal: 인사혁신처 데이터 분석 실무 가이드(중급편) 목적은 누구나 자신의 업무에 스스로 데이터 분석을 활용할 수 있도록 돕는 것입니다. Power BI Desktop 데이터 분석 도구로 사용자가 데이터를 쉽게 가공하고 시각화하여, 의사결정에 필요한 인사이트를 발견할 수 있을 것입니다. 분석 도구에 대한 거부감 없이 업무에 바로 적용할 수 있도록 다양한 시각화, 분석 예제를 제공하여 데이터 분석에 더욱 친숙해지도록 구성하였습니다.목차는 아래와 같습니다.1 기본적인 Power BI 개념 학습하기2 처음으로 Power BI Desktop 시작하기3 다양한 형식의 데이터 가져오기4 분석 목적에 맞게 데이터 가공하기5 데이터 연결을 위한 데이터 모델링하기6 빠른 정보 전달 위한 데이터 시각화하기7 (부록) 실무에 참조할 수 있는 데이터 분석사례
