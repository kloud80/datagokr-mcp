description_portal: '서울특별시 영등포구 관내 이면도로에 설치된 제설함 위치 등 현황입니다제공내용: 관리번호, 소재지도로명주소, 상세위치, 제설함규격, 염화칼슘주머니수, 염화칼슘배치량, 모래주머니수, 관리기관명, 데이터기준일자제설함(염화칼슘보관의집) - 제설대책 기간(11.15.~3.15.)기간 중 이면도로 취약지점에 염화칼슘 보관의 집을 선정 비치하여 강설시 활요함 - 염화칼슘 지원: 염화칼슘은 원칙상 개인 및 사업장에 지원 불가(염화칼슘보관의집 비치 제설제는 누구나 이용가능), 시민의 강력한 지원요청 특이사항의 경우 담당자에게 유선 전달 및 연결, 공공기관은 공공의 목적에 한해서 협조가 필요할 경우 담당자 확인 후 안내, 공동 주택 지원 불가, 개인 및 사업장 지원 불가 - 염화칼슘보관의집 및 제설함 위치: 서울안전누리(safecity.seoul.go.kr)→재난안전시설→재설시설물→제설함&염화칼슘 보관함 선택 * 염화칼슘보관의집: 이면도로 및 골목길 설치 , 제설함: 간선도로변 설치 - 염화칼슘 살포기준:  기온 영하 0도 이하에 살포하며, 적설량 3cm미만의 경우 염화칼슘을 0.02~0.03kg/m2 살포, 적설량 3cm~10cm의 경우 제설삽날 이용 밀어내기, 염화칼슘을 0.04~0.05kg/m2살포, 적설량 10cm 이상의 경우 밀기 작업후 염화칼슘을 0.02~0.03kg/m2 반복살포 및 밀어내기 - 참고사항: 염화칼슘이 주위 수분을 흡수하여 융해 시 융해열 발산, 눈이 쌓이기 전(강설초기) 살포가 효과적, 결빙전 살포가 효과적이며, 결빙 이후 염화칼슘을 살포하면 결빙전보다 10배 이상 소요됨, 염화칼슘 살포시 모래와 혼합 사용하면 융해 효과가 크고, 미끄럼을 방지 하므로, 혼합 사용하는 것이 좋음, 염화칼슘은 조해성이 강하므로, 개봉 후 방치해두면 쉽게 녹기 대문에 밀봉하여 보관하여야 함, 염화칼슘은 직사광선을  피하고, 통풍이 잘 되는 곳에 보관하고, 안전상 20단 이상 적치하지 않아야 한다.'
