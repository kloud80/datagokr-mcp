description_portal: '통계청_KOSIS 통계표 파일정보는 통계청의 국가통계포털 KOSIS에 수록된 통계표와 관련된 첨부 파일에 대한 상세 정보를 제공하는 서비스입니다.KOSIS는 방대한 통계 데이터를 통계표 형태로 제공하는데, 이 통계표들 중에는 그래프, 지도, 설명 자료 등 별도의 첨부 파일이 함께 제공되는 경우가 많습니다.이 API는 이러한 첨부 파일들의 메타데이터를 제공하여 사용자가 원하는 파일을 효율적으로 찾아 활용할 수 있도록 지원합니다.-파일 번호: 각 첨부 파일을 식별하는 고유 번호-기관 코드: 해당 통계표를 작성하고 공표한 기관의 코드-주기 구분: 해당 통계의 주기(예: 연간, 분기, 월간 등)-수록 시점: 통계 자료가 수록된 시점 또는 기준 시점-서비스명: 파일이 제공되는 서비스의 이름-파일 유형: 첨부 파일의 형식(예: PDF, HWP, JPG 등)*기관코드는 파일데이터(통계청_KOSIS 기관정보) 참조'
