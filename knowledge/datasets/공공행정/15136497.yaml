description_portal: 통계청_KOSIS 복합통계표 항목 및 자료코드는 국가통계포털(KOSIS)에서 제공하는 복합통계표의 세부 항목과 자료코드 정보를 포함한 파일데이터다.이 데이터는 통계표를 구성하는 다양한 지표나 분류 항목의 고유 코드, 명칭, 분류 체계 등의 정보를 담고 있으며, 각 항목이 어떤 통계표에 포함되는지를 구조적으로 파악할 수 있도록 설계되어 있다.예를 들어 인구, 고용, 물가 등 다양한 분야의 통계 항목들이 어떤 분류로 묶여 있으며, 각각 어떤 의미를 가지는지에 대한 정의와 식별 코드가 포함된다.*통계표아이디는 파일데이터(통계청_통계표 정보), 기관코드는 파일데이터(통계청_KOSIS 기관정보) 참조
