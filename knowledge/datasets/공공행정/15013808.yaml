summary_user: 진주시 관내 읍·면·동 행정복지센터(주민센터)와 현장민원실 등 행정·공공기관을 기관별 한 행으로 담은 원장 파일로, 읍면동명·기관명·소재지·건축년도·전체면적·전화번호를 담는다(2,889바이트 규모의 작은 CSV). 진주시민이나 민원인이 "우리 동 행정복지센터는 어디에 있고 전화번호는 무엇인가"를 방문 전에 확인하는 데 쓰고, 분석가는 기관 청사의 건립연도와 규모를 비교하는 데 쓴다. 전역 조인 키나 기관 코드는 없어서, 다른 데이터와는 읍면동명이나 소재지 주소 문자열을 맞춰 연결해야 한다.
description_portal: 경상남도 진주시는 시민들의 편리하고 효율적인 민원 처리를 위해 진주시 관내에 위치한 각종 행정기관 및 공공기관의 정보를 체계적으로 제공하고자 합니다. 이는 민원인이 기관 방문 전 사전에 해당 기관의 위치, 연락처, 건축 규모, 건립연도 등을 확인함으로써 보다 신속하고 정확한 행정 서비스를 이용할 수 있도록 돕기 위한 목적입니다.진주시청을 비롯한 읍·면·동 행정복지센터, 그리고 기타 공공기관은 시민들의 일상생활과 밀접하게 연결된 다양한 행정 서비스를 제공하고 있습니다. 그러나 민원인이 각 기관의 구체적인 소재지나 연락처, 담당 업무 등을 미리 알지 못해 불필요한 시간과 노력을 들이는 경우가 많습니다. 특히, 연로한 어르신이나 정보 접근이 어려운 계층의 경우, 정확한 기관 정보를 미리 알 수 있다면 행정기관을 효율적으로 이용하는 데 큰 도움이 됩니다.
