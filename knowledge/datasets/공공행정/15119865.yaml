summary_user: 경기도 출자·출연기관의 업무추진비 사용 내역을 건별로 담으며, 기관명·추진비 구분·사용목적·사용자·사용일자·사용처·대상·금액 등을 기록한다. 도민이나 감시 단체, 분석가가 '특정 출자출연기관 임원이 언제 어디에 얼마를 업무추진비로 썼나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(inst_nm) 같은 이름 매칭으로만 이어 쓴다.
description_portal: '경기도 내의 출자출연기관 업무추진비 사용내역(임원 등) 현황입니다. 출자·출연기관은 지역사회의 경제진흥 · 문화체육 · 복지 등 자치단체별 정책수요를 전문적·효율적으로 추진하기 위해 설립되었습니다. 기관명, 추진비구분명, 사용목적내용 등의 정보를 제공합니다.각 기관 홈페이지에서 공개 중인 자료로 2024년부터 경기도 취합이 중단되며 갱신이 중단된 데이터입니다.출자출연기관 업무추진비 사용 내역이 필요하신 경우, 경기도청 사전정보공표에 게시된 각 기관 홈페이지 바로가기 링크를 활용해주시기 바랍니다.출자출연기관 업무추진비 : https://www.gg.go.kr/opendata/openDataBoard.do?decIdx=5001&searchText='
