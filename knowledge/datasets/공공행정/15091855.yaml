description_portal: '농식품 공공데이터 포털에 개방된 식품안전 데이터 목록은 건강하고 안전한 먹거리를 제공하기 위한 중요한 자료입니다. 본 데이터 목록에는 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자권리 포함유무, 상위분류, 제3자권리, 이용허락범위, 업데이트주기, 서비스 유형 등 다각적인 정보가 포함되어 있습니다. 이 데이터는 연구자, 기업, 정부 기관 등이 다양한 방법으로 활용할 수 있으며, 안전한 식품관리, 소비자 보호, 농식품 정책 개발 등에서 중요하게 사용됩니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(숫자형) : 식별번호, 데이터셋명(문자형) : 데이터의 제목, 데이터셋설명(문자형) : 데이터의 상세 설명, 기관명(문자형) : 해당 데이터를 제공하는 기관의 이름, 담당자명(문자형) : 데이터 담당자의 이름, 전화번호(숫자형) : 담당자의 연락처, 기타유의사항(문자형) : 추가 정보, 등록일(날짜형) : 데이터의 등록 날짜, 데이터ID(숫자형) : 데이터의 고유 ID, 데이터명(문자형) : 데이터의 명칭, 데이터설명(문자형) : 데이터의 설명, 제3자권리 포함유무(문자형) : 권리 포함 여부, 상위분류(문자형) : 상위 데이터의 분류, 제3자권리(문자형) : 권리 소유 사항, 이용허락범위(문자형) : 이용 가능 범위, 업데이트주기(문자형) : 데이터 업데이트 주기 및 서비스 유형(문자형) 등이 포함되어 있어 체계적이고 신뢰성 있는 정보 제공이 가능합니다.'
