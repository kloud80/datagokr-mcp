description_portal: 폐쇄말소대장 지역지구구역 데이터는 이미 말소되었거나 효력이 종료된 부동산 대장의 기록 중, 해당 토지가 속했던 지역·지구·구역의 지정 내역을 보관하는 자료입니다. 이 데이터는 행정구역, 지번, 도로명 등의 위치 정보와 함께 당시 부지에 적용되었던 용도지역, 용도지구, 용도구역의 구분 정보를 포함합니다. 용도지역은 주거, 상업, 공업, 녹지 등 토지 활용의 기본 방향을 나타내고, 용도지구는 경관·방재·교통·환경보호 등 특정 목적을 위한 구역 지정 사항을 담습니다. 용도구역은 개발제한구역, 보전녹지구역 등 세부 규제 정보를 나타냅니다. 이 자료는 과거 도시계획 변천사 분석, 역사적 토지이용 연구, 재개발·재건축 사업의 사전 검토, 과거 규제 영향 분석 등에 활용할 수 있으며, 법적·행정적 증빙자료로서 가치가 높습니다.
