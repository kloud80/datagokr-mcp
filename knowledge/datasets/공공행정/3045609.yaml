description_portal: 이 데이터는 「공공기관의 운영에 관한 법률」에 따라 지정된 370개 공공기관(부설기관 포함)의 시간선택제 근로자, 여성, 장애인, 비수도권 인재 및 지역인재 등에 대한 신규채용 실적을 집계한 자료입니다. 재정경제부가 운영하는 ‘알리오(ALIO)’ 시스템을 통해 공시되며, 연도별·기관별로 다양성 및 포용성을 고려한 채용 현황을 확인할 수 있도록 구성되어 있습니다.해당 데이터는 공공기관의 사회적 책임 이행 수준을 보여주는 중요한 지표로, 취약계층의 고용 기회 확대와 지역 균형 발전, 일‧가정 양립 지원 등의 정책 성과를 객관적으로 평가하는 데 활용됩니다. 채용 인원의 수뿐 아니라 전체 채용 대비 비율 등도 함께 제공되어, 각 기관의 채용 다양성 정책 추진 실적을 비교·분석하는 데 유용합니다.
