summary_user: 충청남도의회에 제출된 조례안·규칙안·건의안·결의안 등 의안을 한 건씩 담은 파일로, 대수·회기·의안번호·의안명·제안자 구분·공동 발의의원·처리결과를 기록한다. 도민이나 연구자가 "이번 대 의회에서 의원 발의 조례안이 몇 건이고 그중 몇 건이 가결됐나"처럼 발의 주체별·회기별 의안 처리 현황을 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지방의회 데이터와는 대수·회기·의안명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 제12대 충청남도의회 홈페이지에서 제공되는 의안정보 데이터는 도의회에서 발의되고 심의·처리되는 각종 의안의 전반적인 현황을 체계적으로 제공하기 위한 공공데이터이다. 본 데이터에는 의안번호, 의안명, 제안자구분, 제안회기 등 핵심 항목이 포함되어 있으며, 회기별로 제출된 조례안·규칙안·건의안·결의안 등의 기본 정보를 확인할 수 있다. 이를 통해 도민과 이용자는 의안의 발의 주체, 회기별 제출 현황, 의정 활동의 흐름을 보다 쉽게 파악할 수 있다. 또한 의회 운영의 투명성과 책임성을 높이고, 지방의회 입법 활동에 대한 이해 증진, 정책 연구 및 행정·학술 자료로 폭넓게 활용될 수 있는 기초자료로 제공된다.
