description_portal: '- 전라남도의회 홈페이지에 게재된 2024년 주요 의안별 처리상황 통계(의안명, 제안일자, 제안자, 소관위원회, 본회의 처리, 공포번호 등)를 조회하실 수 있습니다.- 전라남도의회는 도민 대표기관으로서 입법·예산 심의, 행정 견제, 민원 해결 등의 역할을 수행하고 있습니다.- 제12대 전라남도의회(2022년 7월 출범): 총 38명(지역구 + 비례)의 도의원이 활동 중이며, 의장단과 상임위원회로 구성돼 있습니다.- 상임위원회 : 보건복지환경위, 경제문화관광위, 건설도시위원회, 의회운영위원회 등 다수 설치. ESG, 청년·소상공인, 돌담문화, 주취자 보호 등 다양한 정책적 조례를 발의·처리'
