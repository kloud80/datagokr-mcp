description_portal: 본 데이터는 경기도 광주시의회 홈페이지에 공개된 영상 회의록의 기본 정보를 제공합니다. 시의회 본회의와 위원회 회의를 영상으로 녹화하여 기록한 자료의 관리 정보를 담고 있습니다. 고유번호는 각 영상 회의록을 식별하는 코드이며, 대수, 회기, 차수는 회의가 열린 시기와 순서를 나타냅니다. 회의일은 실제 회의가 개최된 날짜를 표시하고, 영상 파일명은 저장된 영상 파일의 이름을 나타냅니다. 발언 회의록 표시 여부는 영상과 연계된 텍스트 발언록 제공 여부를 표시합니다. 본 데이터는 의정 영상 자료 관리, 회의 기록 검색, 의정 활동 공개, 의회 투명성 확보 등에 활용됩니다.
