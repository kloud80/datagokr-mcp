description_portal: 경기도 과천시의 과천시의회에서 진행했던 회의를 전자회의록으로 기록하여 제공하는 정보입니다. 연번, 회의록고유번호, 위원회 정보(대수), 회기, 회기형식, 위원회명, 의원명(발언의원명), 안건정보, 회의록 내용, 내용 정렬 순서를 일괄 제공합니다. 과천시 지방행정에 대한 행정사무감사, 본회의, 결산 및 조례 심사, 인사청문특별위원회 등 의회에서 진행한 모든 회의에 대한 회의록으로 구성되어 있습니다.시간적 기준은 2022년 6월부터 현재까지이며, 과천시의회 홈페이지 접속 시 회의록 원문 및 임시회의록을 조회하고 다운로드할 수 있습니다.
