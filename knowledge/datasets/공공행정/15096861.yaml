summary_user: 제주특별자치도 전역에서 유기견·유실동물·길고양이 등이 구조·포획된 마리 수를 기준 연월, 동물 구분, 조치 형태(TNR 포함)별로 집계한 통계로, 건별 원천이 아닌 집계 자료다. 지자체 담당자나 동물보호 단체가 '제주에서 해마다 구조·포획되는 유기동물이 몇 마리이고, 그중 중성화 후 방사(TNR) 비중은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준 연월이나 동물 구분 이름을 맞춰 연결하거나 같은 기관의 자료끼리만 이어 쓴다.
description_portal: 이 데이터셋은 2021년을 기준으로 제주특별자치도가 집계·공개한 ‘유기·유실 동물 구조 포획 현황’ 정보로서, 제주도 전체 지역을 대상으로 유기견, 유실동물, 길고양이 등에 대해 구조되거나 포획된 건수 및 조치 형태(TNR 포함) 등을 체계적으로 기록하고 있다. 데이터 형식은 CSV이며, 제공기관은 제주특별자치도 디지털혁신과이다. 이 자료는 반려동물 유실·유기 문제의 규모 측정, 구조‧포획‧중성화(Trap-Neuter-Return, TNR) 실행 현황 파악, 동물보호 정책 수립의 기초통계로서 활용될 수 있다. 또한, 유기동물 대응 및 복지, 공중보건, 지역사회 안전, 생태 보호 관점에서 동물 구조와 관리의 현황을 객관적으로 보여주는 공공데이터라는 의미가 있다. 특히 동물보호 단체, 지자체 행정, 연구자, 시민단체 등이 유기동물 문제의 심각성을 평가하고 대응 방안을 모색하는 데 중요한 기초자료로 기능할 수 있다.
