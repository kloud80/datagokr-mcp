description_portal: 광주광역시 시민광장 광주온 시스템을 통해 운영하는 시민참여예산 관련 소관부서명, 등록일자 등의 정보를 포함합니다.광주광역시는 시민광장 ‘광주온’ 시스템을 운영하고 있습니다. 이 시스템에서는 시민참여예산과 관련된 다양한 제안과 검토 과정을 확인할 수 있으며, 각 사업 정보에는 소관부서명과 등록일자 등이 함께 제공됩니다. 소관부서명은 해당 사업을 담당하는 부서가 어디인지 알 수 있도록 하고, 등록일자는 자료가 언제 게시되었는지를 확인할 수 있도록 합니다. 이를 통해 시민들은 사업 제안과 검토가 어떤 부서에서 언제 이루어졌는지를 명확히 확인할 수 있어, 예산 과정 전반에 대한 이해와 투명성을 높일 수 있습니다.
