summary_user: SGIS '살고싶은 우리동네' 서비스의 주거지 선정 지표를 전국 읍면동 단위로 기준년도별 값과 함께 담은 집계 시계열 파일이다. 주거지를 고르려는 국민이나 지역 분석가가 "우리 동네의 교통·교육·안전 같은 생활 지표가 해마다 어떻게 달라졌나"를 비교하는 데 쓴다. 전역 조인 키(행정구역 코드)가 없어 시도명·시군구명·읍면동명 이름을 행정구역 코드로 매핑한 뒤 다른 읍면동 통계나 SGIS 경계와 이어 쓴다.
description_portal: '[SGIS 오픈 플랫폼] "살고싶은 우리동네" 서비스의 읍면동별지표 시계열 데이터입니다.대분류지표명,중분류지표명,기준년도,시도명,시군구명,읍면동명,값을 포함합니다.[용어 설명]1. 지리정보시스템 [GIS,Geographic Information System]  지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]  국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 살고싶은 우리동네  - 통계에 기반하여 사용자 조건에 맞는 주거지역을 추천해 주는 서비스입니다.  - 이용자는 자연, 주택, 지역 인구, 안전, 생활 편의 교통, 교육, 복지 문화 등 7개 카테고리 총 51종의 주거지 선정 조건에 해당하는 추천지역리스트 및 통계정보를 제공'
