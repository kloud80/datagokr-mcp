summary_user: 한국동서발전 사업소에서 쓰는 화학제품을 제품·물질 단위로 나열하고, 각 물질의 노출수준·유해성·위험성·감소대책·안전등급을 담은 위험성평가 목록 파일(csv, 약 18KB)이다. 발전소 작업장에서 어떤 화학물질을 어떤 용도로 쓰며 위험성이 높은 물질에 어떤 감소대책을 두었는지 확인하려는 안전관리 담당자나 연구자가 쓴다. CAS번호(cas_no)를 키로 다른 화학물질 유해성·규제 정보나 타 기관의 화학물질 목록과 이어 쓴다.
description_portal: 한국동서발전의 화학물질 위험성평가 리스트 정보 데이터입니다. 해당 데이터는 사업장에서 사용하는 각종 화학물질에 대한 안전관리를 위해 구축된 자료로, 항목은 승인번호, 사업소, 제품명, CAS번호, 물질명, 노출수준, 유해성, 위험성, 감소대책, 용도, 개정일, 안전등급, 안전보건관리 확인사항으로 구성되어 있습니다. 이 데이터는 사업장에서 사용 중인 화학물질의 물리적·화학적 특성과 잠재적 위험 요인을 정량·정성적으로 파악하고, 이에 따른 노출 수준 및 안전조치 수준을 확인하는 데 활용됩니다. 학계 및 연구기관에서는 이 데이터를 바탕으로 산업현장의 화학물질 관리 실태를 분석하거나, 노출 수준에 따른 건강영향 평가, 화학물질 관련 정책 수립을 위한 근거자료로 활용할 수 있습니다. 특히 유해화학물질의 사용량 및 노출 경로에 따른 리스크 평가 모델 수립, 작업장 환경개선 방안 제안 등 다양한 연구 분야에서 중요한 기초자료가 됩니다.
