description_portal: 경기주택도시공사에서 진행 중인 사업지구별 2016년 이후의 민원 발생 건수를 연도별 및 월별로 집계한 데이터로써 사업지구명, 발생건수 등의 정보가 포함되어 있습니다. 도시재생사업, 대규모 택지개발사업, 주택건설, 산업단지 조성, 임대주택 건설, 행복주택 건설 등 경기주택도시공사에서 시행 중인 공공사업 수행 과정에서 나타나는 주민 불편 사항, 의견 및 요청사항 등을 정량적으로 파악할 수 있습니다. 월별 발생한 민원 건수 통계를 바탕으로 민원관리체계 개선, 주민참여 기반 정책설계, 지역 갈등 해소 전략 수립 등에 활용할 수 있는 중요한 자료입니다.
