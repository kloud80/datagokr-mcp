summary_user: 광양시 착한가격 모범업소를 업소 한 곳당 한 행으로 담은 파일 목록으로, 업소명·주소·연락처와 대표 품목·가격이 들어 있다(CSV 약 6.7KB). 광양 주민이나 방문객이 '근처에서 싸고 괜찮은 식당·미용실이 어디고 대표 메뉴가 얼마인가'를 찾거나, 분석가가 지역 물가 안정 업소 분포를 보는 데 쓴다. 전역 조인 키가 없어 주소를 지오코딩하거나 업소명·주소 문자열로 LOCALDATA 인허가 같은 업소 원장과 맞춰 이어 쓴다.
description_portal: 이 데이터는 착한가격 모범업소의 현황을 제공하는 자료로, 업소명, 주소, 연락처, 주요 품목 및 가격 정보를 포함하고 있습니다. 착한가격 모범업소는 합리적인 가격과 양질의 서비스를 제공하여 지역 물가 안정과 소비자 편익 증진에 기여하는 업소를 의미합니다. 본 데이터를 통해 소비자는 신뢰할 수 있는 가격 정보를 확인할 수 있으며, 행정기관은 지역 내 물가 관리 및 서민 생활 안정 정책 수립의 기초 자료로 활용할 수 있습니다. 또한 업소별 특성과 가격 정보를 제공함으로써 지역 상권 활성화와 건전한 소비문화 확산에도 기여할 수 있습니다. 데이터 기준일이 명시되어 있어 최신성과 공신력을 확보하고, 공공데이터 활용 가치를 높이고 있습니다.
