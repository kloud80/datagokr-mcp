description_portal: 본 데이터는 한국가스공사의 최근 3개년 작업시간에 관한 정보를 제공합니다. 가스시설 운영 및 정비작업의 체계적 관리와 안전관리 강화를 목적으로 수집되었습니다. 데이터의 세부 항목으로는 작업일자, 작업시간, 순번, 작업유형, 작업지역, 작업내용, 투입인력, 작업완료여부 등이 포함되어 있습니다. 본 데이터는 안전관리 담당자, 재난·안전 연구기관, 노동시간 분석 연구자, 인력운영 담당자, 작업계획 수립기관, 고용노동부가 작업 패턴 분석 및 안전예방 대책 수립에 유용하게 활용할 수 있습니다. 가스시설 안전관리 강화와 효율적인 작업계획 수립에 기여하며, 재난·안전 예방 연구의 기초자료로 활용될 것으로 기대됩니다.
