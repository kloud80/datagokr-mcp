description_portal: 본 데이터는 인천광역시 미추홀구 주민참여예산제 운영 조례에 따라 구성된 주민참여예산위원회의 연도별 운영 현황을 수록한 자료입니다. 해당 위원회는 지역 주민의 의견을 예산 편성에 반영하고 지역의 재정민주주의 실현을 위해 설치되었으며, 공개모집을 통해 선정된 일반 주민과 동별 지역대표 등으로 구성됩니다. 주요 기능은 주민 의견의 수렴·집약, 지역 추천사업 및 부서 자체사업에 대한 검토와 심의, 내년도 예산사업의 우선순위 결정, 예산학교 교육 이수 및 주민참여 홍보 활동 등입니다. 데이터에는 연도별 위원 수, 당연직 및 성별 위촉직 인원, 위원 임기, 위촉기간, 기준일 등의 항목이 포함되어 있어 위원회의 구성과 운영 주기를 체계적으로 파악할 수 있습니다. 본 자료는 참여예산제도 활성화 및 지역 거버넌스 강화를 위한 기초정보로 활용되며, 주민과 행정 간 소통을 통해 실질적 예산 참여를 실현하는 데 기여합니다. 데이터는 연 1회 갱신됩니다.
