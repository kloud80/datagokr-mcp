description_portal: 지방자치단체의 순세계잉여금은 한 회계연도가 끝난 후, 예산을 집행하고 남은 실제 잔액에서 차년도에 이월하여 사용할 금액이나 반납해야 할 금액 등을 제외하고, 자유롭게 사용할 수 있는 순수한 잉여 재원을 말합니다. 정부는 순세계잉여금의 적정 수준 유지와 투명한 관리, 그리고 다음 연도 재정계획과의 연계를 강조하고 있습니다. 특히, 반복적으로 발생하는 잉여금은 중기재정계획 수립 시 반영하여 불필요한 예산 편성을 줄이고, 주민의 눈높이에 맞는 예산 집행이 이루어지도록 유도하고 있습니다.- 지방자치단체별 순세계 잉여금 예산 정보 (자치단체, 순세계잉여금 예산액(일반회계))
