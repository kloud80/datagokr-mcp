summary_user: 지방자치단체별 결산 기준 재정자주도(세입 중 이전수입을 뺀 자체 재원의 비율)를 회계연도(fyr)·자치단체 단위로 담은 전국 집계 지표다. 분석가나 주민이 "우리 시·군·구는 중앙정부 지원 없이 예산을 얼마나 자주적으로 운영하나, 다른 자치단체와 비교하면 어떤가"를 확인할 때 쓴다. 전역 조인 키는 없고, 자치단체 코드(laf_cd)나 자치단체명으로 같은 지방재정365의 다른 공시 지표와 맞춰 이어 쓴다.
description_portal: 재정자주도(결산) 지표는 지방자치단체가 자체적으로 안정적인 재원을 통해 예산을 얼마나 자주적으로 운영할 수 있는지를 나타내는 지표입니다.해당 지표는 지방자치단체의 세입 중 중앙정부나 다른 기관에서 지원받는 이전수입을 제외한 지방자치단체의 자체적인 세입이 차지하는 비율을 의미합니다. 재정자주도가 높을수록 자치단체가 중앙정부의 재정적 지원에 의존하지 않고 자체적으로 재정을 운영하는 능력이 뛰어나며, 이는 자치단체의 재정 독립성과 안정성을 평가하는 중요한 기준으로 활용됩니다.
