summary_user: 지방공기업 통합경영공시에 올라온 지방공기업별·연도별 인원현황을 담은 전국 단위 비공간 API로, 일반정규직·무기계약직 정원과 일반정규직 남녀 현원을 기관 단위로 제공한다. 분석가나 기자가 '특정 지방공사·공단의 정규직 정원 대비 현원과 여성 비율이 연도별로 어떻게 바뀌었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 경영공시·지방공기업 목록과는 기관명(ENT_NAME)과 연도를 이름 매핑해 이어 쓴다.
description_portal: 해당 자료는 지방공기업법 제46조 등에 근거하여 행정안전부가 지방공기업 통합경영공시를 통해 관리·공개하는 지방공기업의 경영정보 중 인원현황에 관한 자료입니다. 지방공기업의 연도별 인원규모를 파악할 수 있으며, 주요 지표로는 연도, 일반정규직 정원, 무기계약직 정원, 일반정규직 남성 직원수 현원, 일반정규직 여성 직원수 현원 등이 포함됩니다. 해당 자료는 지방공공기관 경영정보공개시스템(www.cleaneye.go.kr)을 통해 공시되는 항목으로, 지방공기업의 인력 운영 현황을 투명하게 공개함으로써 국민의 알권리를 충족하고, 인력 운용 계획 수립 및 정책 분석을 위한 기초 자료로 활용됩니다.
