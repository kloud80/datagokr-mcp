description_portal: '본 데이터는 제주특별자치도 제주시 관내에 설치되어 있는 시민게시판(홍보용)의 설치 및 운영 현황을 수록한 자료입니다. 시민게시판은 지역 주민과 방문객을 위한 공공 홍보 수단으로 활용되며, 제주시에서 직접 설치 및 관리하는 시설물입니다. 본 데이터는 도시 환경 정비, 공공홍보 효율성 제고, 생활정보 전달 기반 마련 등을 위한 기초자료로 활용됩니다.주요 항목연번 / 일련번호: 게시판 식별을 위한 관리 번호유형: 게시판의 설치 형태 또는 종류(예: 일반형, 복합형 등)주소 / 위치: 게시판이 설치된 행정구역별 도로명 주소 및 세부 위치 정보전단함개수: 게시판에 부착된 전단함(전단지 보관용)의 개수수거함개수: 사용된 전단지, 안내물 등을 수거하는 수거함 개수데이터기준일: 데이터가 최종 집계되거나 갱신된 기준일활용 목적이 데이터는 공공시설물 현황 파악, 도시미관 개선 사업, 불법광고물 예방, 홍보매체 관리 효율화 등의 정책 수립에 활용되며, 시민 편의 증진 및 행정자료의 투명한 공개를 위한 기반 정보로 제공됩니다. 제주시에서 지속적으로 유지·관리하며, 자료는 정기적으로 갱신됩니다'
