summary_user: 지방교육재정(시도교육청 등)별로 한 해 동안 편성된 교육관련 지원 예산을 지원 대상 항목별 예산액으로 담은 집계 데이터로, 교육경비보조금(교육시설 개선, 교육과정 운영, 교육정보화, 공공도서관 운영지원 등)과 법정·비법정 전출금, 고교무상교육비, 학교급식보조비, 학교용지매입비 등을 구분하며 범위는 전국입니다. 지역 주민이나 분석가가 '우리 시도나 시군구가 올해 학교급식·교육경비보조금에 예산을 얼마나 편성했나'를 확인하고 지역 간에 비교하는 데 씁니다. 전역 조인 키는 없어서, 회계연도(fyr)와 자치단체 코드·이름(laf_cd, laf_hg_nm)을 기준으로 같은 지방재정365의 다른 세출·예산 공시 데이터와 이름·코드 매핑으로 연결합니다.
description_portal: 교육관련지원예산현황은 특별시, 광역시, 도에 설치된 지방교육정별로 한해동안 편성된 교육관련 예산의 편성현황을 지원 대상별로 편성된 예산액 정보를 제공합니다. 교육지원대상구분은 교육경비보조금으로 교육시설걔선사업비, 교육과정운영, 교육정보화, 지역주민교과과정, 지역체육문화공간시설, 공공도서관운영지원, 기타 항목별 예산액을 확인할 수 있습니다. 그 외 고교무상교육비, 시도법정전출금, 시도비법정전출금, 시군구교육비특별회계법정전출금, 시군군교육비특별회계비법정전출금, 지방세법에 의한 지방이양사업비, 학교급식보조비, 학교용지매입비 등의 항목에 대한 예산액을 확인할 수 있습니다.
