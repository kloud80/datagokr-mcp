description_portal: 본 자료는 대전광역시 찾아가는 현장 상담실 운영 현황에 관한 내용으로, 일자리 센터 방문이 어려운 시민과 구인 기업을 대상으로 이동형 취업 상담 서비스를 제공하는 사업입니다. 구직자를 위해서는 이동 취업 상담실을 운영하여 구직 서류 작성법, 면접 기법, 직업 상담, 최신 취업 정보 제공 및 구직 알선 등 실질적인 취업 컨설팅을 지원합니다. 한편, 구인 기업을 대상으로는 기업의 인재 요구 사항을 파악하여 취업 서류 접수 대행 및 기업 맞춤형 인재 추천을 실시하여 구인·구직 간의 효과적인 매칭을 도모합니다. 이를 통해 지역 내 취업 활성화와 원활한 인력 수급에 기여하고 있습니다.
