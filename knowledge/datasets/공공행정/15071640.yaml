summary_user: 서울시 관내에서 해열제·소화제·감기약 같은 안전상비의약품을 파는 편의점·마트 등의 판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장이다. 인허가일자, 영업상태와 상세영업상태, 폐업·휴업·재개업 일자, 주소, 좌표(X, Y), 판매점 영업면적이 들어 있다. 주민이나 분석가가 "우리 동네에서 심야나 휴일에 상비약을 살 수 있는 곳이 어디이고, 최근 몇 년 사이 판매점이 늘었나 줄었나"를 확인하는 데 쓰며, 다른 데이터와 묶을 전역 조인 키는 없어 주소·좌표나 업소명, 같은 기관의 관리번호 체계로 LOCALDATA 인허가 계열과 상권 자료에 맞춰 연결한다.
description_portal: 서울시 안전상비의약품 판매업소 인허가 정보는 서울시 관내에서 해열제, 소화제, 감기약 등 안전상비의약품을 판매하는 편의점·마트 등의 판매업소에 대한 인허가 현황을 제공하는 공공데이터입니다. 각 업소별로 인허가일자와 인허가취소일자, 영업상태 및 상세영업상태, 폐업 및 휴업·재개업 일자 등의 행정이력이 포함되어 있어, 시간에 따른 영업 변동과 판매업소 운영 현황을 파악하는 데 활용할 수 있습니다. 또한 사업장명, 업태구분명, 전화번호, 지번주소와 도로명주소, 우편번호, 좌표정보(X, Y) 등이 제공되어 판매업소의 위치와 기본 정보를 정확하게 확인할 수 있습니다. 소재지면적과 판매점영업면적 정보를 통해 매장의 규모를 가늠할 수 있으며, 최종수정일자, 데이터갱신구분, 데이터갱신일자 등을 통해 데이터의 최신성 및 갱신 이력을 확인할 수 있습니다. 이 데이터는 지역별 안전상비의약품 접근성 분석, 심야·휴일 의약품 구입 가능 지역 파악, 보건·의약 정책 수립, 상권 및 입지 분석 등 다양한 행정·연구·정책 분야에서 기초 자료로 활용될 수 있습니다.
