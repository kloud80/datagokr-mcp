description_portal: 본 데이터는 인천광역시 미추홀구에서 추진하는 방문보건사업 현황을 수록한 자료입니다. 본 사업은 빈곤, 질병, 장애, 고령 등 건강위험요인이 큰 취약계층의 건강격차 해소와 건강형평성 확보를 위해 운영되며, 정기적인 방문건강관리서비스를 통해 자가 건강관리능력 향상과 건강수명 연장을 도모합니다. 사업은 연중 실시되며, 기초생활수급자 및 차상위계층 중 건강위험군·질환군을 1·2순위 대상으로 하고, 다문화가족, 북한이탈주민, 독거노인, 지역아동센터 이용 아동 등도 지원 범위에 포함됩니다. 주요 서비스에는 건강행태 개선, 만성질환 및 합병증 예방, 임산부·신생아·영유아 관리, 노인 허약예방, 다문화 가족 관리, 복지서비스 연계 등이 포함됩니다. 등록은 기초생활수급자 및 차상위 계층 명단을 바탕으로 유선 상담이나 직접 방문을 통해 진행됩니다. 본 자료는 지역 내 방문보건사업 운영 현황을 파악하고, 건강취약계층을 지원하기 위한 정책 수립과 행정 관리에 기초자료로 활용됩니다. 데이터는 정기적으로 갱신되어 최신 현황을 반영합니다.
