summary_user: 관보에 실린 상훈 관련 게재 건(훈장·포장 서훈, 대통령표창·국무총리표창)을 건별로 담으며, 게재 제목·발행기관·근거법령·관보 호수·발행 희망일·원문 PDF 경로 같은 정보를 함께 제공하고 범위는 전국이다. 특정 인물이나 기관이 언제 어떤 훈장·표창을 받았는지 관보 원문으로 확인하려는 국민·기자·연구자가 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못해, 같은 기관명이나 근거법령명 같은 이름 매핑으로만 다른 관보 데이터와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터셋과 정확히 결합하기 어렵다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
