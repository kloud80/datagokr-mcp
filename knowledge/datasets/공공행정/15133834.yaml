description_portal: 경기도의정포털_행정사무감사 자료요구분배정보는 경기도 의회 각 상임위원회에서 행정사무감사 과정 중 요청한 자료가 해당 실국 및 산하기관에 어떻게 배부되는지를 정리한 데이터입니다. 주요 항목으로는 번호, 배부 요구서시퀀스번호, 배부 실국코드, 배부 산하기관명, 요구자료배부 내용, 배부 시퀀스번호, 배부일자, 배부시퀀스번호 PK가 포함되어 있습니다. 이 데이터는 감사위원회별 자료 요구 현황과 실국·산하기관별 대응 분배 과정을 파악할 수 있도록 구성되어 있어 행정사무감사의 투명성과 효율성을 제고하는 데 활용될 수 있습니다.
