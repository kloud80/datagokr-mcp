summary_user: 지방자치단체별 세출결산액을 회계연도 단위로 일반회계·기타특별회계·공기업특별회계로 나누어 담은 결산 집계 데이터이며, 범위는 전국이고 포털 설명상 2010회계연도 자료부터 제공된다. 지역 재정 분석가나 주민이 "우리 시·군·구가 지난해 일반회계와 특별회계로 실제 얼마를 썼나"를 단체별로 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 자치단체 코드(laf_cd)·단체명과 회계연도(fyr)를 기준으로 같은 지방재정365 계열 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 회계별 단체별 세출결산은 지방자치단체의 세출결산정보를 회계별로 구분하여 정보를 제공합니다. 제공되는 정보의 대상회계는 일반회계, 기타특별회계와 공기업특별회계로 구분하여 제공됩니다. 제공되는 정보의 기준은 각 지방자치단체의 회계연도 결산이 끝난 후 결산통계정보로 작성되는 재정연감(자치단체 결산개요) 정보를 활용하여 제공하고 있습니다.회계별 단체별 세출결산 정보는 2010년도 회계연도 자료부터 제공되고 있으며, 행정안전부의 회계계약제도과에서 관리하고 있습니다.
