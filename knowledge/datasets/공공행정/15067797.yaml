description_portal: '충북혁신도시 이전 공공기관인 한국소비자원, 한국고용정보원, 한국가스안전공사에서 제공하는 충북지역 착한기업 데이터입니다.-CCM(소비자중심경영) 인증 업체 : 기업이 수행하는 모든 활동을 소비자 관점에서 소비자 중심으로 구성하고 관련 경영활동을 지속적으로 개선하고 있는지를 심사하여 인증된 업체-청년친화강소기업 : 강소기업 중에서 임금, 일생활균형, 고용안정이 우수하여 청년들이 근무할만한 중소기업-안전관리 우수판매 업체 : LP가스판매사업자를 대상으로 안전관리, 시설, 고객서비스 등을 종합적으로 평가하여 국민의 가스안전을 책임지는 안전관리 우수판매업체'
