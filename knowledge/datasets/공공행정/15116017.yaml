summary_user: 서울 강남구 안의 태권도·검도 등 체육도장 업소를 한 곳씩 담은 인허가 원장으로, 인허가일·취소일, 영업상태(영업·휴업·폐업)와 폐업·휴업 일자, 사업장명, 도로명·지번 주소, 좌표, 지도자 수·회원 모집 인원 같은 업소 속성을 담는다. 학원·상권 분석가나 창업을 검토하는 사업자가 '강남구에서 현재 영업 중인 태권도장은 어디에 몇 곳이고, 최근 몇 년간 개업·폐업이 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 잇고, 원천이 같은 LOCALDATA 인허가 자료와 대조해 쓴다.
