description_portal: 한국언론진흥재단은 국내 언론 산업 발전과 언론의 공익적 기능 강화를 위해 설립된 공공기관으로, 다양한 언론 지원 사업을 통해 건전한 뉴스 생태계 조성에 기여하고 있습니다.재단은 정기적으로 보도자료를 배포하여 언론계와 국민들에게 주요 정책과 사업 현황을 투명하게 공개하며, 이를 통해 언론 발전을 위한 다양한 지원 프로그램과 정책적 노력을 알리고 있으며 특히 디지털 전환 시대에 맞춰 언론사의 경쟁력 강화와 저널리즘의 품질 향상을 위한 교육, 연구, 기술 지원 등의 사업홍보에 적극적으로 나서고 있습니다.이 데이터는 재단과 관련된 주요 보도자료들이 어떠한 것이 있는가에 대한 정보를 가지고 있으며 제목, 일자, 조회수, SNS 카운트 수 총 4가지의 컬럼으로 이루어져 있습니다.각 뉴스보도에 대한 상세 내용은 한국언론진흥재단 누리집에서 확인이 가능합니다.
