summary_user: 농식품공공데이터포털에 개방된 곤충 관련 데이터의 목록(메타데이터)을 데이터셋·개별 데이터 단위로 담으며, 데이터셋명·설명·제공기관·담당자·키워드·등록일·이용허락범위·업데이트 주기·제공 형태(오픈API·파일·링크 등)를 포함하고 범위는 전국·비공간이다. 곤충자원을 연구하는 연구자나 곤충 산업 종사자가 '곤충 관련으로 어떤 공공데이터가 어느 기관에서 어떤 형식으로 열려 있나'를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 데이터셋명·기관명 같은 이름 매칭이나 링크URL·공공데이터포털URL을 따라가 원 데이터를 찾는 방식으로 이어 쓴다.
description_portal: '농식품 공공데이터 포털에 개방한 곤충 데이터 목록은 다양한 곤충 관련 정보를 제공하는 데이터셋으로 구성되어 있습니다. 이 데이터는 연구자, 학계, 관련 산업 종사자들이 곤충자원에 대한 정보를 분석하고 활용할 수 있도록 지원합니다. 데이터셋은 데이터셋ID, 데이터셋명, 데이터셋설명, 기관명, 담당자명, 전화번호, 키워드, 기타 유의사항, 등록일, 데이터ID, 데이터명, 데이터설명, 제3자 권리 포함 유무, 상위 분류, 제3자 권리, 이용 허락 범위, 업데이트 주기, 서비스 유형 등 다양한 정보를 포함하고 있습니다. 이 데이터는 곤충 관련 연구 및 개발, 생태계 연구, 농업 및 환경 관련 정책 수립에 유용하게 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 데이터셋ID(문자형): 각 곤충 데이터셋의 유일한 식별자, 데이터셋명(문자형): 데이터셋의 이름, 데이터셋설명(문자형): 데이터셋에 대한 설명, 기관명(문자형): 데이터 제공 기관의 이름, 담당자명(문자형): 데이터 관리자의 이름, 전화번호(문자형): 담당자의 연락처, 키워드(문자형): 관련 키워드, 기타 유의사항(문자형): 데이터 사용 시 주의사항, 등록일(날짜형): 데이터 등록 날짜, 데이터ID(문자형): 개별 데이터의 식별 번호, 데이터명(문자형): 개별 데이터의 명칭, 데이터설명(문자형): 개별 데이터에 대한 설명, 제3자 권리 포함 유무(문자형): 데이터의 저작권 정보, 상위 분류(문자형): 데이터의 분류 정보, 제3자 권리(문자형): 저작권 관련 정보, 이용 허락 범위(문자형): 데이터 이용 제한 사항, 업데이트 주기(문자형): 데이터의 갱신 주기, 서비스 유형(문자형): 데이터의 서비스 형식(오픈API, 파일 등)을 나타냅니다.'
