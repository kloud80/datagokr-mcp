description_portal: '의정부시 빅데이터 분석공유활용시스템에서 수집한 시군구 코드 자료입니다. 시군구 코드번호와 시군구명으로 구성된 데이터 입니다.시군구 코드는 대한민국에서 행정구역을 구분하기 위해 사용하는 표준화된 숫자 코드입니다. 주로 행정업무, 통계, 데이터 처리 등에서 사용되며, 각 시(市), 군(郡), 구(區) 단위에 고유한 코드가 부여됩니다.시군구 코드는 일반적으로 5자리 숫자로 구성됩니다. 앞의 2자리: 시·도 코드 (예: 서울특별시 = 11), 뒤의 3자리: 시군구 코드 (예: 종로구 = 110 → 합치면 11110)시군구 코드의 용도는 통계청 자료 분류 (인구, 산업 등), 행정안전부 행정구역 관리, GIS 시스템, 부동산 등 데이터 처리, 공공기관 API에서 지역 식별 등에 활용됩니다.'
