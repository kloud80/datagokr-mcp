summary_user: 경기도 광주시가 관리하는 공공건축물을 건물 한 건씩 명칭·주소·면적·취득일로 담은 시군구 단위 목록 파일(CSV)입니다. 시민이나 분석가가 광주시 안에 어떤 공공건축물이 어디에 있고 규모와 취득 시점이 어떤지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 건물 명칭을 맞춰 연결하고, 국유·공유재산 데이터와는 주소를 필지 고유번호(PNU)로 바꿔 이어 쓰는 방식이 필요하다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 공공건축물 현황 자료입니다. 주요 제공 항목은 건축물의 명칭, 건축물의 주소, 건축물 면적, 취득일 등으로 구성되어 있으며, 광주시 내 공공건축물의 위치와 규모, 취득 시점 등 핵심 정보를 알 수 있습니다. 해당 데이터는 자산의 효율적 관리와 행정업무의 투명성 제고를 목적으로 제공되며, 도시계획 수립과 정책 결정 과정에 활용될 수 있습니다. 또한, 시민과 관계 기관이 공공건축물 정보를 쉽게 확인할 수 있도록 정기적으로 최신 자료로 갱신되어 공개하고 있습니다.
