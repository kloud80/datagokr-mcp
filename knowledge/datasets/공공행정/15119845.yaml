description_portal: '인천광역시 공공기관 현황 공공데이터는 인천시 내에 위치한 공공기관들의 기본 정보를 제공하는 데이터셋입니다.주요내용1. 기관명 : 각 공공기관의 공식 명칭을 포함합니다.2. 기관주소 : 기관이 위치한 정학한 주소를 알려줍니다.3. 전화번호 : 기관에 직접 연락할 수 있는 전화번호를 제공합니다.4. 기관 유형 : 공사, 공단 ,협회 등 기관의 성격을 구분합니다.이 데이터는 인천 시민들이 필요한 공공기간 정보를 쉽게 찾고, 연구자들이 지역 정책 분석에 활용하는 등 다양하게 이용될 수 있도록 합니다.인천시 재정담단관실에서 관리하며 공공데이터포털에서 CSV파일로 무료로 다운로드 받을 수 있습니다.'
