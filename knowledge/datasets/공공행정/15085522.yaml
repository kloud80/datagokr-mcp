description_portal: '○ 통계개요* 통계명 : 소비자체감경기지수(CSI:Consumer Sentiment Index)* 통계종류 : 서울시 소비자체감경기지수를 제공하는 조사통계* 작성목적 : 서울 시민의 체감경기를 조사하고 진단하여 서울지역의 경기상황과 민생경제 현황을 신속하고 정확하게 판단하기 위해 작성* 조사 대상: 서울지역 표본 1,200가구를 대상으로 매 분기 조사한 결과* 조사 내용: 소비자태도지수(현재생활형편지수, 미래생활형편지수, 현재경기판단지수, 미래경기판단지수, 내구재구입태도지수), 현재소비지출지수, 미래소비지출지수,주택구입태도지수, 순자산지수, 물가예상지수, 고용상황전망지수 등)* 조사체계 : 서울연구원* 공표주기 : 매분기* 공표범위 : 지역 - 서울시내용 – 소비자태도지수, 생활형태지수, 경기판단지수, 구입태도지수 등○ 용어설명* 소비자체감경기지수 : 서울지역 소비자들이 체감하는 현재의 경기상황을 신속하게 판단할 수 있는 속보성 경기지표* 경기 : 서울지역의 전체적인 경제활동 수준으로 소비자들이 느끼는 전반적인 경제상황을 말함* 생활형편 : 소득수준과 소비지출을 고려하여 가계생활을 해나가는 수준으로 살림살이가 좋아지거나 나빠지는 것을 말함* 소비지출 : 가계가 소비활동을 하면서 지출한 비용이며, 구체적으로 식료품비, 의류비, 주거비, 교통통신비, 교육비, 문화오락비 등를 말함○ 기 타* CSI 산출 : (매우나쁨 응답빈도×0 + 다소나쁨 응답빈도×50 + 동일 응답빈도×100 + 다소좋음 응답빈도×150 + 매우좋음 응답빈도×200) / 전체응답빈도수* CSI 범위 : 0≤CSI≤200(100초과: 1년전(후)보다 호전(긍정), 100미만: 1년전(후)보다 악화(부정), 100: 1년전(후) 보합 수준, 단 물가는 100 초과와 100 미만을 반대로 해석)'
