summary_user: 2020 회계연도 지방자치단체별 지방보조금 당초예산 편성정보를 일반회계와 기타특별회계 대상으로 담으며, 자치단체(laf_cd)마다 총액한도, 예산편성액, 총액한도 대비 편성비율을 제공하는 전국 단위 집계 데이터입니다. 분석가나 주민이 '우리 시·군·구가 2020년에 지방보조금을 한도 대비 얼마나 편성했나'를 확인하고 자치단체 사이를 비교하는 데 쓴다. 전역 조인 키는 없어 자치단체 코드(laf_cd)나 광역·기초 자치단체명으로 같은 지방재정365의 다른 공시 데이터와 이름·코드 매핑으로 잇는다.
description_portal: 지방자치단체의 지방보조금은 법령 또는 조례에 따라 지방자치단체가 다른 지방자치단체, 법인, 단체 또는 개인 등이 수행하는 사무나 사업을 조성하거나 이를 지원하기 위해 교부하는 재정지원금입니다. 지방자치단체보조금관리에 관한 법률과 지방보조금관리기준에 따라 운영되며, 지방자치단체의 장은 매년 보조사업에 대한 성과평가를 실시하고 있습니다.지방보조금 정보는 2020 회계연도의 정보가 제공되며 일반회계와 기타특별회계를 대상으로 당초예산편성정보가 취합됩니다. 세부 제공항목으로는 총액한도, 예산편성액, 총액한도대비편성비율 정보가 제공됩니다.
