description_portal: 광주경찰청은 영어, 중국어, 일본어, 베트남어, 몽골어, 타이어, 타갈로그어, 러시아어, 크메르어, 인도네시아어, 우즈베크어 등 다양한 언어에 능통한 민간 통역인과 경찰관을 확보하여 외국인 주민과 관광객을 위한 통역 서비스를 제공하고 있습니다. 범죄 피해 신고, 교통사고 처리, 법률 상담, 체포·수사 과정 등에서 원활한 의사소통을 지원하며, 다문화 가족과 외국인 근로자의 권익 보호 및 민원 해결을 돕고 있습니다. 이를 통해 광주경찰청은 다문화 사회에 맞춘 맞춤형 치안 서비스를 강화하고, 지역 사회의 신뢰를 높이는 데 기여하고 있습니다.
