summary_user: SGIS 통계주제도 서비스에서 시도별 부동산 데이터를 어떤 주기·시도·건물유형·통계항목으로 나눠 보여주는지 정리한 카테고리 목록 파일로, 전국을 시도 단위로 다룬다(CSV 약 97KB). 분석가나 개발자가 통계주제도의 부동산 주제에서 시도별로 어떤 건물유형과 통계항목을 조회할 수 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명 같은 이름을 행정구역 코드로 매핑하거나 같은 기관(국가데이터처 SGIS)의 코드로만 연결한다.
description_portal: '[SGIS 오픈 플랫폼]"통계주제도"서비스의 시도별부동산데이터카테고리 정보를 담고 있습니다.주기명, 시도명, 건물유형, 통계항목을 포함합니다.[용어설명]1. 지리정보시스템 [GIS,Geographic Information System]지리공간데이터(geographic or geospatial data)를 기반으로 유용한 정보를 생성하는 정보시스템2. 통계지리정보시스템/서비스 [SGIS,Statistical Geographic Information System]국가데이터처가 보유한 인구·가구·주택·사업체 등의 센서스데이터와 공공 및 민간 자료와 연계∙융합할 수 있는 위치기반 개방형 서비스 플랫폼3. 통계주제도통계와 관련하여 주요 주제에 따른 관심사별 통계정보를 손쉽게 확인할 수 있는 서비스'
