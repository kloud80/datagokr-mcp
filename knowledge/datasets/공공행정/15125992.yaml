summary_user: 국회 위원회가 직접 제안한 위원회안과 여러 법률안을 묶은 대안을 의안 한 건 단위로 담으며, 의안번호·대수·의안명·제안자, 소관위원회와 회부·상정·처리일, 위원회 처리 결과, 법사위 회부·상정일을 포함하고 범위는 전국(비공간)이다. 입법 동향을 보는 분석가나 사업자가 "이번 대수에 특정 위원회가 낸 대안이 언제 처리됐고 법사위로 넘어갔는가"를 확인하는 데 쓴다. 전역 조인 키는 실측되지 않아, 국회의 다른 의안 데이터와는 의안번호(BILL_NO)·대수·의안명을 같은 기관 코드로 맞춰 연결한다.
