summary_user: 공정거래위원회가 지정한 대규모기업집단의 소속회사를 회사 단위로 담으며, 회사마다 소속회사명·법인등록번호·사업자등록번호·대표자·설립일·계열편입일이 들어 있다(검증 호출에서 전국 범위 59행 수신). 투자자·언론·분석가가 "이 회사가 어느 대기업집단 계열이고 언제 편입됐나"를 확인하는 데 쓴다. 법인등록번호(jurirno)와 사업자등록번호(bizrno)가 조인 키라서, 가맹사업·특수판매·상조 등 공정위의 다른 등록·공시 데이터나 법인 정보와 회사 단위로 이어 쓴다.
limits: 지정년월과 기업집단코드를 기준으로 조회하는 구조라서, 먼저 사용 가능한 공개년월 조회 서비스(publicYmList)로 요청 가능한 연월을 확인해야 한다. 당해년도 정보는 5월 1일 기준으로 공개되므로 그 전에는 전년도 지정 결과만 나온다. 검증 호출 한 번에 받은 59행은 특정 호출 조건의 결과이며, 전체 기업집단 규모로 보면 안 된다.
