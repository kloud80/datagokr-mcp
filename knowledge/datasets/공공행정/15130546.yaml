description_portal: '- 전라남도 소통인전남 홈페이지에 게재된 설문광장 내용(설문제목, 항목내용, 답변수, 결과)에 대해 조회하실 수 있습니다.- 전라남도의 소통인전남 설문광장은 도민의 의견을 수렴하여 정책에 반영하는 온라인 참여 플랫폼입니다. 이곳에서는 다양한 분야의 설문조사에 참여할 수 있으며, 참여자에게는 소정의 선물이 제공되는 이벤트도 진행됩니다.- 접속 방법 : 소통인전남 설문광장 바로가기- 로그인 : 전라남도청 누리집 또는 SNS(네이버, 카카오) 계정으로 로그인합니다.- 설문 참여 : 진행 중인 설문조사 목록에서 참여하고자 하는 설문을 선택하여 응답합니다.- 참여 인증 : 설문 참여 후, MY페이지에서 참여 내역을 확인하고, 해당 화면을 캡처하여 이벤트 게시판에 인증 파일을 첨부합니다.'
