summary_user: 창원시가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·대표자·도로명주소·연락처와 대표 품목 최대 4개의 가격을 함께 싣는다. 시민이 내 동네에서 값싼 식당·이미용업소를 찾거나, 분석가가 창원시 착한가격업소가 어느 업종과 지역에 몰려 있고 품목 가격 수준이 어떤지 살피는 데 쓴다. 전역 조인 키나 코드표는 없어서, 도로명주소를 지오코딩하거나 업소명·주소를 LOCALDATA 인허가 자료와 이름으로 맞춰 이어 써야 한다.
limits: 행정구역 코드나 사업자번호 같은 공통 키가 없어 다른 데이터와 자동으로 결합되지 않는다. 좌표 없이 도로명주소만 있어 지도 분석에는 주소 변환이 먼저 필요하다. 범위는 창원시 한 곳의 개별 업소로, 다른 시군과 비교하려면 별도 파일을 모아야 한다.
