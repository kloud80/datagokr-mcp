description_portal: '한국해양수산연수원의 교육예약 홈페이지에 신규로 가입한 사용자 수를 연도별로 정리한 자료입니다. 2013년부터 2025년까지의 가입자 수를 포함하고 있으며, 교육수요 증가와 함께 온라인 플랫폼 이용 추이를 파악할 수 있는 기초 지표로 활용됩니다. 데이터는 CSV 형식으로 제공되며, 총 13개의 연도별 통계가 수록되어 있습니다. 본 자료는 연수원의 디지털 기반 교육 시스템 운영 성과를 정량적으로 평가하고, 향후 사용자 중심의 교육서비스 개선 및 온라인 접근성 확대 전략 수립에 기여할 수 있습니다. 데이터 기준일 : 25.09.30'
