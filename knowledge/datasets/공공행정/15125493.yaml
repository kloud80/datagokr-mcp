summary_user: 공정거래위원회 가맹사업 정보공개 자료 중 브랜드별 직영점 운영 현황을 기준년도·브랜드관리번호 단위로 담으며, 업종 대·중분류, 직영점 수, 직영점 평균 운영기간, 직영점 연간 평균매출을 제공한다(범위 전국). 가맹 창업 예정자가 '이 브랜드는 본부가 직영점을 실제로 몇 개, 얼마나 오래 운영하며 매출은 어느 정도인가'를 확인해 본부의 사업 신뢰도를 가늠하는 데 쓴다. 브랜드관리번호(brandMnno)·가맹본부관리번호(jnghdqrtrsMnno)로 같은 기관의 다른 가맹정보 API와 이어 쓰며, 실측상 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다.
limits: 실측 컬럼에서 사업자등록번호 같은 전역 조인 키를 찾지 못해 공정위 외부 데이터와 직접 결합하기 어렵다. 행정구역 정보가 없는 전국·비공간 자료라 지역별 직영점 분포는 알 수 없다. 개발계정은 하루 10,000회 호출로 제한된다.
