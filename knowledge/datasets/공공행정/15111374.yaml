summary_user: 대전광역시 인허가 업소를 2022년 10월 기준으로 소재지 구, 대·중·소분류 업종, 창업년월, 영업상태(영업·폐업)별로 묶어 영업업체 수를 센 집계 파일(CSV, 약 6.7MB)이다. 대전 어느 구에서 어떤 업종이 언제 창업했고 그중 얼마나 폐업했는지 알고 싶은 창업 준비자나 상권 분석가가 업종별 생존·폐업 경향을 비교하는 데 쓴다. 전역 조인 키는 없어 구 이름이나 업종명을 매핑해 같은 대전시 상권 자료나 LOCALDATA 지방행정 인허가 자료와 맞춰 쓴다.
description_portal: 본 자료는 2022년 10월 기준 대전광역시의 구별 및 업종별 인허가 업소들의 영업상태 현황을 체계적으로 정리한 것입니다. 영업상태는 영업 중인 업체와 폐업한 업체로 구분되어 있으며, 각 업소의 창업년월 단위별 영업업체 수를 상세히 나타내고 있습니다. 이를 통해 지역별 및 업종별 사업 활성화 정도와 변화 추이를 파악할 수 있으며, 경제 동향 분석과 정책 수립에 중요한 기초자료로 활용됩니다. 본 조사는 2022년 공공데이터 기업매칭지원사업의 일환으로 수행되어 신뢰성 높은 데이터를 제공하고 있습니다.
