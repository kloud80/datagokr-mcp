description_portal: 2025년부터 연천군의 군정소식문자발송에 동의한 민원인들에게 발송한 경기도 연천군의 군정 소식 문자 발송 내역을 담고 있습니다. 전송일시(문자가 발송된 날짜와 시간) 전송내용(발송된 문자 메세지의 실제 내용)을 포함하고 있습니다. 연천군의 군정소식문자는 군정홍보, 행사안내, 강연, 복지서비스 등과 관련 내용을 담고 있습니다.1.모집·채용·공모 안내 정책 참여단 (생활공감정책, 청년정책서포터즈 등) 및 농업·청소년·도서관 강사 등 각종 주민 참여단과 강사 모집공무원·공공기관 직원 공개채용(청소년육성재단, 마을 코디네이터 등)공모전·서포터즈2. 보건·의료 안내보건의료원 휴진일자 및 진료 일정 변경 공지 반복(소아청소년과, 일반외과, 피부비뇨기과 등)예방접종 안내(인플루엔자, 대상포진, 폐렴구균)건강증진, 금연클리닉, 모바일헬스케어, 심폐소생술 교육, 꿈나무 건강교실 등 건강서비스 제공 안내3. 교육·자격증 과정농업·귀농인 대상 교육(청년농업인, 농업대학, 기초영농기술, 신규농업인)직업기술 교육(조경·중장비·화훼·산림 기능사, 전산회계, 식품가공 기능사, 드론 자격증, 디지털 문해 교육 등)창업 및 직무능력 교육(창업로드맵, 회계·유튜브·사회복지사 실무, ITQ·캔바·쇼핑몰 창업, 부업대학생 등)청년 역량 지원(어학/자격시험 응시료 지원, 일자리·창업 관련 원데이 클래스)4. 주민·생활 지원사업청년 농업인 정착 바우처, 농어민 기회소득 지원, LPG 저장탱크 보조, 수도관 개량 지원, 공동주택 보조사업 등 각종 생활·경제 지원학생 지원(경기도 대학생 학자금 대출이자 지원, 여성청소년 생리용품 보편지원, 청소년 생활장학금)5. 문화·평생교육도서관 프로그램(겨울·상반기 독서교실, 인문학 강연 시리즈, 그림책 강연)평생교육원 강좌(정규·특강·마을배움터, 테마 과정)오픈 행사, 미술 문화행사
