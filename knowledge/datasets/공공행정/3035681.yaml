summary_user: 예금보험공사가 파산관재인으로 선임된 파산금융회사 492곳(2025년 12월 말 기준 진행 중 33곳, 종결 459곳)의 회사명, 관할법원, 파산관재인 대리인, 파산선고일, 종결 여부·종결일, 파산재단 주소·전화·팩스를 담은 건별 목록이며, 포털 설명상 약 4,800건이고 전국 범위입니다. 2011년 부실사태로 문을 닫은 저축은행의 예금자나 채권자가 해당 회사의 파산절차가 끝났는지, 남은 업무는 어느 파산재단에 연락해야 하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 파산금융회사명(bkrpFnccmpNm) 같은 이름 매칭이나 파산재단 주소·우편번호로만 연결한다.
