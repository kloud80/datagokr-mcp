summary_user: 서울시 관할 유흥주점영업 업소를 한 행씩 담은 인허가 원장으로, 인허가·취소일, 영업상태와 상세상태, 폐업일·휴업기간, 지번·도로명 주소, 중부원점TM 좌표(X, Y), 층수·객실·좌석·무대 면적 같은 시설 정보를 담는다. 구청 담당자나 분석가가 특정 지역에서 영업 중인 유흥주점과 최근 폐업·휴업한 곳을 찾을 때, 그리고 야간 상권의 변화를 추적할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)로만 잇고, 같은 원천을 공유하는 LOCALDATA 인허가 자료나 행정동·상권 단위 상권 분석 자료와 함께 쓴다.
description_portal: ㅇ 본 데이터는 서울시 관할의 관광·유흥·음식점업 가운데 특히 유흥주점영업 인허가 정보를 통합 제공하는 자료입니다. 인허가, 취소, 휴업, 재개업 등 행정 처리 단계와 업소 식별 정보가 정규화되어 있어 현장 관리와 정책 수립에 활용도가 높습니다.ㅇ 유흥주점영업의 정의에 따라 관광객 이용에 적합한 한국 전통분위기의 시설을 갖춘 업소를 대상으로 하며, 음식 제공과 함께 노래·춤을 감상하거나 직접 춤을 출 수 있는 공간 제공 여부 등 업태 특성이 반영됩니다.ㅇ 항목은 사업장명, 업종·업태 분류, 주소 체계, 연락처 등 기본 메타데이터와 시설 규모, 층수, 좌석·객실 구성, 무대 유무, 부대시설, 안전 관련 정보 등으로 구성되어 위생·안전 점검과 행정 심사에 바로 연계할 수 있습니다.ㅇ 공간 정보는 중부원점TM 좌표계로 제공되며 위경도 좌표는 포함되지 않습니다. 지도 서비스나 다른 자료와의 결합이 필요한 경우 좌표 변환 절차와 기준 일관성 확보가 중요합니다.ㅇ 영업상태와 상세 상태를 통해 상태 변화 이력이 관리되므로 재개업 모니터링, 민원 연계 점검, 취약 지역 예방 지도, 야간 경제·관광 정책 분석 등에 활용 가능합니다.ㅇ 표준화된 분류와 코드 체계를 바탕으로 타 부서 인허가, 위생 점검, 소방 점검, 민원·신고 기록과의 교차 검증이 가능하며, 개인정보 비식별과 공공목적 범위 내 활용 원칙을 준수해야 합니다.
