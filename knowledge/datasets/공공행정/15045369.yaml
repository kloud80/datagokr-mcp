description_portal: 제주보건소 관할 지역 내 등록·관리 중인 금연아파트 지정 현황을 제공하는 데이터입니다. 본 데이터는 공동주택명, 주소, 지정일, 데이터기준일자 정보를 포함하고 있으며, 제주시 제주보건소 관할 지역 내 금연아파트의 지정 현황과 위치 정보를 확인할 수 있도록 구성되어 있습니다. 이를 통해 금연아파트 지정 공동주택의 기본 현황 파악, 지역 내 금연 환경 조성 현황 확인, 금연문화 확산 관련 사업 관리, 건강증진 및 금연지원 정책 검토, 보건행정 업무 수행을 위한 기초자료로 활용할 수 있습니다. 또한 공동주택 단위의 금연구역 운영 및 관리 현황을 체계적으로 파악함으로써 지역사회 금연 실천 환경 조성과 주민 건강증진 지원에 활용할 수 있습니다.
