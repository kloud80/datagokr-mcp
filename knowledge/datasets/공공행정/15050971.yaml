description_portal: 역대 지방기능경기대회 개최 현황에 대한 종합적인 통계자료입니다. 본 자료는 1966년부터 2026년까지 개최된 지방기능경기대회의 상세한 개최 현황을 정리한 것입니다. 이 데이터에는 각 연도별 지방기능경기대회의 개최 기간, 해당 연도에 대회를 개최한 지역의 수, 해당 대회에서 경기가 진행된 전체 직종의 수, 그리고 각 대회에 참가한 선수들의 총 인원 수,각 대회별 금메달, 은메달, 동메달을 수상한 입상자 수와, 메달 입상자에는 포함되지 않는 우수상 및 장려상 수상자의 수가 포함되어 있습니다.
