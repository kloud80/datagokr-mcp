summary_user: 해양수산부가 내놓은 법령해석 사례를 건별 목록으로 담으며, 안건명·안건번호·질의기관·해석기관·해석일자와 상세 회신 링크를 전국 단위로 제공한다. 어업인·수산업 사업자나 지자체 담당자가 '이 어업 규제 조항을 해수부가 어떻게 해석했는지' 같은 선례를 찾을 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없으며, 법령해석 일련번호로 같은 서비스의 상세 본문을 조회하거나 질의기관 코드·이름, 해석기관 코드로만 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 해양수산부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 해양, 어업, 수산 관련 분야에서 법령 해석을 요청한 사례들을 목록 형태로 제공하며, 이용자는 해석 일련번호, 안건명, 질의기관, 해석일자 등의 정보를 기준으로 다양한 해석사례를 검색할 수 있습니다. 각 항목은 해당 법령 질의에 대한 회신 여부와 처리 현황을 포함하고 있어 해석 진행 과정을 확인할 수 있으며, 목록 정보를 통해 개별 회신 본문에 접근할 수 있습니다. 본 데이터는 수산행정, 어업규제, 해양시설 등 다양한 법령 적용 분야에 대한 정책 판단 및 법적 기준을 이해하는 데 유용합니다.
