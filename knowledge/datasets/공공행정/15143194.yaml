description_portal: 제주관광공사는 2008년부터 2026년 3월까지 수행된 다양한 감사결과를 바탕으로 공공데이터를 제공합니다. 이 데이터는 임직원 행동강령 이행실태, 복무감사, 공직기강 감찰, 재고자산 및 외부회계감사, 행정사무감사, 특정 및 종합감사 등으로 구분되며, 감사 주체와 목적, 지적사항 및 처리결과를 포함합니다. 연도별 감사유형 및 조치결과가 체계적으로 정리되어 있어 지방공기업의 운영 투명성, 공직윤리, 행정책임 등을 진단하고 평가하는 데 활용될 수 있습니다. 해당 자료는 정책 수립, 제도 개선, 시민감시 및 학술 연구 등에 유용하며, 공공기관의 책무성과 신뢰성을 높이는 데 기여합니다.
