summary_user: 전북특별자치도가 관리하는 국공유재산을 재산 한 건씩 기록한 대장으로, 소재지·공부상 지목·면적·재산가격·관리부서·취득일자와 대부(임대) 면적·목적을 담는다. 도 소유·관리 토지가 어디에 얼마나 있고 경작 등으로 대부 중인지 확인하려는 주민·사업자나 공공자산 활용 실태를 보는 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 재산 소재지 주소나 지목 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 전북특별자치도가 관리하는 국유재산의 현황을 상세하게 기록한 재산 대장입니다. 각 재산의 소재지, 지목(임야, 전, 답 등), 면적, 평가 가격과 같은 기본 정보뿐만 아니라, 관리 책임이 있는 부서, 재산 취득일 등 행정적 정보까지 포함하고 있습니다. 특히, 해당 재산이 대부(임대) 중인 경우 대부 면적과 경작 등 그 목적을 명시하여 현재 자산이 어떻게 활용되고 있는지를 명확히 보여줍니다. 이 자료는 국가 자산의 투명하고 효율적인 관리를 위한 핵심적인 데이터이며, 공공자산의 현황과 이용 실태를 파악하는 데 중요한 근거가 됩니다
