description_portal: '중장기 개방계획에 따른  강원특별자치도 강릉시의 구전 설화(전설)를 기록한 자료로, 설화의 제목, 상세 내용, 등록일로 구성되어 있습니다. 설화 내용에는 강릉 지역의 고유한 방언(사투리) 표현이 포함되어 있어, 단순한 이야기 기록을 넘어 지역 언어 연구 및 보존의 기초 자료로 활용됩니다.본 데이터는 총 4개의 항목으로 구성되어 있으며, 각 항목의 정의는 다음과 같습니다. 번호: 설화 자료의 고유 번호(순번을 나타냅니다.)제목: 설화의 명칭(예: 안선달, 발락고개와 죽일, 안목의 칡뿌리)내용: 설화의 구체적인 이야기 전문.등록일:자료가 등록된 날짜.이 자료는 강릉의 역사적 지명이나 인물에 얽힌 이야기를 통해 지역의 문화와 정서를 이해하는 데 도움을 줍니다. 또한, 사투리의 생생한 구어적 표현을 보존하고, 사투리 사전 편찬 및 교육 자료 등 지역 언어학적 연구에 활용됩니다.https://www.gn.go.kr/www/selectDialectTaleWebList.do?key=768'
