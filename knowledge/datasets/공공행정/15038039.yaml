summary_user: 가평군의회에 발의된 의안을 한 건씩 담은 파일로, 의회 대수·의안번호·의안명·발의일·발의자를 기록하며 포털 설명상 기준일 전년도에 발의된 예산안·조례안·결의안·청원 등이 대상입니다. 주민이나 분석가가 "지난해 가평군의회에서 누가 어떤 조례안을 언제 발의했나"를 확인하거나 의원별 발의 활동을 세는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어, 다른 시군 의회 의안 데이터와는 기관명·의안명 같은 이름으로 맞추거나 같은 기관 기준으로만 이어 붙입니다.
limits: 의안의 처리 결과나 상세 내용은 이 파일에 없어 의회 홈페이지에서 따로 봐야 하며, 행정코드 등 공통 키가 없어 다른 데이터와 자동 결합이 어렵습니다. 범위는 가평군 한 곳이고 위치 정보가 없는 비공간 자료입니다.
