summary_user: 전북특별자치도가 지정한 착한가격업소를 업소 한 곳씩 담은 목록으로, 업종·업소명·주요 품목과 가격·전화번호·주소와 주차·포장·배달·예약·단체 이용·무선인터넷·유아시설 같은 편의시설 여부, 이미지 주소, 등록일을 제공한다. 주민이나 여행객이 '전주 근처에서 주차되고 포장 가능한 저렴한 식당이 어디인가'를 찾거나, 분석가가 시군별 착한가격업소 분포를 살펴보는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 주소나 업소명 매칭으로 잇는다. LOCALDATA 인허가 같은 점포 원장이 그 예다.
limits: 전역 조인 키가 없어 인허가·상권 데이터와 붙일 때 이름·주소 매칭의 오차를 감안해야 한다. 범위는 전북특별자치도 한 시도로 한정된다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
