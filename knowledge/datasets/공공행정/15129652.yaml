description_portal: 정보공개제도란 업무 수행 중 생산, 접수하여 보유 및 관리하는 정보를 공개함으로써, 국민의 알권리를 보장하고 더 많은 정보를 바탕으로 국정운영에 대한 참여를 유도하기 위한 제도입니다.서울시설공단에 청구된 정보공개 요청건들에 대한 연간 처리현황 자료입니다. 2021년부터 전체 청구건수, 처리결과(공개여부), 기타 처리결과(취하, 이송, 부존재 등)에 대한 내용입니다.서울시설공단 정보공개는 정보공개포털을 통해 이루어지고 있으며, 청구된 정보공개건에 대하여 각 담당 부서 처리자들이 공개여부를 검토 후 공개하고 있습니다. 비공개 건의 경우 이의신청 등 절차를 통해 재 청구요청을 할 수 있습니다.
