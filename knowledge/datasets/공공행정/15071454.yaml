description_portal: 서울시 담배도매업 인허가 정보는 서울시 관내 담배 도·소매 유통을 담당하는 도매업체의 인허가 현황과 운영 특성을 제공하는 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업·휴업·재개업일자, 영업상태 및 상세영업상태를 통해 업체의 설립과 영업 변동 이력을 파악할 수 있습니다. 사업장명, 전화번호, 소재지면적, 지번·도로명주소, 우편번호, 좌표(X·Y) 정보를 활용해 사업장의 위치와 규모, 입지 특성을 분석할 수 있습니다. 취급제품명과 담배공급업체명 항목을 통해 어떤 담배 제품을 어떤 공급업체로부터 유통하는지 파악할 수 있어 유통 구조 및 관리 정책 수립에 참고자료로 활용됩니다. 관리번호, 데이터갱신구분·갱신일자, 최종수정일자는 개별 사업장 식별과 정보 최신성 검증을 위한 메타데이터입니다.
