summary_user: 지방자치단체가 보유한 토지·건물·시설물 같은 유형자산과 소프트웨어·특허 같은 무형자산의 규모를 전국 범위로 집계한 현황으로, 필드 구성으로 보아 회계연도(fyr)와 광역·기초 자치단체별로 총액과 네 개 세부 금액을 담는 집계 자료다. 분석가나 주민이 '우리 시·군·구가 가진 자산 규모가 비슷한 다른 자치단체와 비교해 어느 정도인가'를 살피거나, 자산 매각·활용 여지를 검토하는 데 쓴다. 전역 조인 키는 없어서 자치단체 이름이나 지방재정365 안의 자치단체 코드(laf_cd)를 맞춰 같은 기관의 세입·세출 공시 자료와 잇는다.
description_portal: 지역통합자산현황이란, 지방자치단체가 보유한 자산의 현황을 종합적으로 나타내는 지표입니다.이는 지방정부가 소유하고 있는 모든 유형 자산(토지, 건물, 시설물 등)과 무형 자산(소프트웨어, 특허 등)의 규모와 상태를 포함합니다.자산현황은 지방자치단체의 재정 상태를 파악하는데 중요한 역할을 하며, 자산의 효율적인 관리와 활용도를 평가하는 데 사용됩니다.또한, 지방자치단체가 향후 재정 게획을 수립할 때 자산을 매각하거나 활용할 수 있는 가능성을 고려하는 데 중요한 정보를 제공합니다.이를 통해 지방정부의 자산관리가 효율적으로 이루어지고 있는지 점검할 수 있습니다.
