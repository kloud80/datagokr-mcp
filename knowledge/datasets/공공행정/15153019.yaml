description_portal: '본 데이터는 대한민국 기초자치단체의 행정구조를 시도 → 시·군·구 → 행정동 체계에 따라 정리한 자료입니다. 행 단위로 각 지역의 ‘시도구분명’, ‘시군구구분명’, ‘행정동’ 정보를 제공하며, 행정 계층 구조를 명확하게 표현하기 위해 상위 단계에 해당하는 항목 외의 값은 공란으로 처리한 것이 특징입니다.예를 들어, 서울특별시가 시도 단위로 표기되는 경우,시도구분명 = 서울특별시시군구구분명 = (공란)행정동 = (공란)과 같은 형태로 기록되며, 하위 행정구역(예: ○○구)이 등장하는 행에서만 시군구구분명에 값이 입력됩니다. 동일하게, 행정동 단위가 기록되는 행에서는 시도·시군구 정보가 상위 기준에 따라 매칭되어 표시됩니다.이 데이터는 행정구역 체계 모형 구축, 지역별 정책수립, 공간데이터 매핑, 공공서비스 행정단위 구분 등 다양한 행정·통계 업무에 활용될 수 있습니다.'
