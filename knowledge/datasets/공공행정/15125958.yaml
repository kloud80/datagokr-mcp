summary_user: 국회의원 한 명당 한 행으로 한글·한자·영문 이름, 생년월일, 소속 정당, 선거구, 소속 위원회, 당선 횟수(초선·재선 구분), 성별, 의원회관 연락처·이메일·홈페이지, 보좌관·비서 명단을 담은 전국 단위 인적사항 원천 데이터입니다. 유권자나 기자가 '우리 지역구 의원은 어느 정당·위원회 소속이고 몇 선이며 어떻게 연락하나'를 확인하거나, 분석가가 정당·성별·선수별 의원 구성을 집계하는 데 쓴다. 전역 조인 키가 없어 표결·의안·회의 데이터와는 의원 이름(HG_NM)이나 정당·위원회명으로 맞춰 이어야 하며, 의안과 결합하면 '누가 무엇을 발의·표결했나'를 볼 수 있다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
