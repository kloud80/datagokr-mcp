summary_user: 경기도 의정부시가 착한가격업소로 지정한 업소를 한 행에 한 곳씩 담은 업소 단위 원천 목록으로, 업종 구분·업소명·도로명 주소·전화번호와 대표 품목 두 가지의 가격을 담는다(csv 약 9.9KB). 의정부 주민이나 소비자가 '우리 동네에서 값싼 음식점·미용실은 어디이고 대표 메뉴가 얼마인가'를 찾을 때, 또는 분석가가 업종별 대표 품목 가격을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소로 맞춰 붙여야 하며, 지방행정 인허가(LOCALDATA) 업소 원장과 주소·상호 매칭으로 이어 쓰는 것이 현실적인 연결 방법이다.
description_portal: 이 데이터는 경기도 의정부시 관내에서 ‘착한가격업소’로 지정된 업소들의 현황을 체계적으로 정리한 자료입니다. 데이터 항목은 업소의 구분, 업소명, 소재지 도로명 주소, 전화번호, 품목1과 가격1, 품목2와 가격2, 위도와 경도, 관리기관명, 관리부서명, 관리부서, 관리기관 전화번호, 데이터 기준일자 등으로 구성되어 있습니다. 이를 통해 각 업소가 제공하는 대표 품목과 가격 정보를 확인할 수 있으며, 소비자 입장에서 합리적 가격으로 운영되는 업소를 한눈에 파악할 수 있습니다. 위치 정보인 위도와 경도는 지리적 분석이나 지도 시각화에 활용할 수 있어, 특정 지역 내 착한가격업소 분포를 분석하거나 이용자가 접근하기 쉬운 경로를 안내하는 데 도움을 줍니다. 또한 관리기관명과 관리부서 정보는 행정적 책임 주체를 확인하고 정책 점검, 관리 및 지원 활동을 수행하는 데 유용하며, 업소별 전화번호를 포함하여 소비자가 직접 연락하거나 문의할 수 있는 실무적 편의도 제공합니다. 품목과 가격 정보를 통해 업종별, 품목별 가격 비교 및 분석이 가능하며, 연도별 데이터와 비교하면 가격 안정성, 정책 효과, 소비자 혜택 수준을 평가할 수 있습니다. 이러한 데이터는 지방자치단체, 연구자, 소비자 단체 등 다양한 주체가 활용할 수 있으며, 지역 내 합리적 가격 제공 업소 현황 파악과 가격 정책 모니터링, 착한가격업소 운영 성과 분석 및 홍보 자료 제작 등 다양한 목적에 활용될 수 있습니다. 데이터 기준일자를 통해 최신성 확인이 가능하며, 지역 경제 활성화와 소비자 보호, 합리적 소비 촉진을 위한 기초 자료로 활용할 수 있습니다.
