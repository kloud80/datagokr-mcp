description_portal: 본 데이터는 제주특별자치도 제주시에서 관리·운영하고 있는 공용차량 보유 현황을 제공하는 공공데이터입니다. 제주시 행정업무 수행, 현장 민원 처리, 시설 관리, 재난·재해 대응, 각종 공공서비스 제공 등에 활용되는 공용차량을 차량의 용도와 형태에 따라 분류하여 관리 현황을 확인할 수 있도록 구성되어 있습니다.제공 항목은 공용차량의 분류, 구분, 대수로 구성되어 있으며, 차량 분류는 승용차, 승합차, 화물차, 특수차 등으로 구분됩니다. 이를 통해 제주시가 보유하고 있는 공용차량의 유형별 규모와 운영 현황을 파악할 수 있으며, 행정기관의 차량 자산 관리 현황을 이해하는 데 활용할 수 있습니다.
