description_portal: 지적공부(地籍公簿)는 토지의 소재. 지번. 지목. 경계 또는 좌표와 면접 등 지적에 관한 내용을 등록하여 공적으로 증명하는 장부로서 크게 대장. 도면. 및 경계점 좌표 등록부로 구성되어 있으며 정보 처리 시스템을 통하여 기록 저장된 것을 포함합니다. 이러한 지적 공부는 국가기관인 지적소 관청이 지적 서고에 갖춰 두어 보관하고 이를 영구히 보존해야 합니다. 지적공부의 종류로는 7가지가 있습니다. 토지대장, 임야대장, 공유지연명부, 대지권등록부, 지적도, 임야도 및 경계점좌표등록부 등이 있습니다.  지적공부등록지 현황에는 28개의 지목에따라 나누어 각 면적과 지번수가 기재되어있습니다. 28개 지목에는 전,답,과수원,목장용지,임야,광천지,염전,대지,공장용지,학교용지,주차장,주유소용지,창고용지,도로,철도용지,제방,하천,구거,유지,양어장,수도용지,공원,체육용지,유원지,종교용지,사적지,묘지,잡종지가 있습니다.
