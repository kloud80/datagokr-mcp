summary_user: 여주시가 소유한 공유재산을 필지 단위로 소재지·대장구분·토지지목코드·면적·관리기관명과 함께 담은 파일 데이터로, 범위는 여주시 한 개 시군구이고 개별 주소 단위로 기록된다. 시민이나 분석가가 여주시 안의 공공청사·도로·공원 부지를 확인하거나 유휴 공유재산이 어느 지목에 얼마나 있는지 따져볼 때 쓴다. 실측 컬럼에는 필지고유번호(PNU) 같은 전역 조인 키가 없어서, 다른 데이터와는 소재지 주소를 매칭하거나 같은 기관(여주시) 기준으로만 이어 쓴다.
description_portal: 본 데이터는 여주시가 소유한 공유재산의 관리 현황을 수록한 자료로, 자치단체가 보유한 부동산 자원의 위치 및 이용 상태를 파악할 수 있도록 구성되어 있습니다. 포함된 항목은 공유재산의 소재지, 토지지목코드, 면적 등으로, 각 필지는 「공유재산 및 물품 관리법」에 따라 등록되어 있으며 재산 관리대장을 기반으로 작성됩니다. 해당 데이터는 공공청사, 도로, 공원 등 다양한 용도의 공공시설 부지를 포함하고 있으며, 자산의 활용 가능성, 유휴 재산의 파악, 효율적 자산 운용을 위한 기초자료로 활용됩니다. 또한 시민의 재산에 대한 관리 투명성을 높이고, 지역개발 및 공공사업의 공간적 계획 수립에도 참고될 수 있는 행정기초자료로 제공됩니다. 본 자료는 여주시의 공유재산 관련 부서에서 주기적으로 점검 및 갱신하여 공공데이터로 개방되고 있습니다.
