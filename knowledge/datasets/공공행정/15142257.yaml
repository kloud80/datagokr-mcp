summary_user: 서울 마포구에서 편의점 등 안전상비의약품을 파는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표를 포함한다. 주민이 집 근처 심야에 상비약을 살 수 있는 편의점을 찾거나, 분석가가 마포구 내 상비약 판매업소의 개업·폐업 추이와 분포를 상권 단위로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 개방자치단체코드(OPNSFTEAMCODE)나 주소·사업장명 매칭으로만 다른 지역 인허가 데이터(LOCALDATA 계열)와 연결한다.
description_portal: '서울특별시 마포구의 편의점 등 안전상비의약품으로 지정된 의약품을 판매하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 판매업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 안전상비의약품 판매업소의 위치 및 취급 품목 현황을 파악하고, 공공보건·소비자 보호 정책을 효율적으로 수립할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
