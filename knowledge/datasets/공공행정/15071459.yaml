summary_user: 서울시에 인허가된 당구장업소를 업소 한 곳당 한 행으로 담은 건별 인허가 원장으로, 인허가·취소·휴업·폐업·재개업 일자와 영업상태, 사업장명·주소·좌표, 소재지면적·건축물 연면적, 지도자수·회원모집 인원·보험가입 여부 등을 포함한다. 창업 예정자나 상권 분석가가 '우리 동네에 영업 중인 당구장이 몇 곳이고 최근 폐업이 늘었는가'처럼 업소 분포와 개·폐업 추이를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 주소·좌표나 업소명으로 맞추거나 같은 출처인 LOCALDATA 인허가 자료의 관리번호(MGTNO)·기관 코드로 연결한다.
description_portal: 서울시 당구장업 인허가 정보는 서울시에 인허가된 당구장업소의 행정 이력과 시설·운영 현황을 종합적으로 파악할 수 있도록 구성된 공공데이터입니다. 이 데이터에는 인허가일자와 인허가취소일자, 폐업일자, 휴업 시작·종료일자, 재개업일자, 영업상태코드 및 영업상태명, 상세영업상태코드·명 등이 포함되어 있어 각 당구장의 인허가 내역과 영업 상태 변동 이력을 시간의 흐름에 따라 추적할 수 있습니다. 또한 사업장명, 전화번호, 소재지면적, 지번주소와 도로명주소, 우편번호, 좌표정보(X·Y) 등을 통해 각 당구장의 위치, 규모, 접근성, 연락처 등 기본적인 공간·연락 정보를 확인할 수 있습니다. 문화체육업종명과 세부업종명은 당구장이 어떤 문화·체육 업종 체계 내에서 어떠한 세부 유형으로 분류되는지를 보여주며, 공사립구분명은 당구장이 공공 시설인지, 민간(사립) 시설인지를 구분하는 데 활용되는 항목입니다. 보험가입여부코드는 영업과 관련된 각종 사고나 책임에 대비해 해당 당구장이 관련 보험에 가입되어 있는지를 나타내며, 지도자수는 당구장 내 전문 지도 인력(코치, 강사 등)의 규모를 파악할 수 있는 지표입니다. 건축물동수와 건축물연면적은 시설이 위치한 건축물의 구조와 전체 면적을 보여 주어 시설 규모와 수용 가능 인원을 유추하는 데 활용될 수 있고, 회원모집총인원 항목은 회원제를 운영하는 당구장의 경우 모집 허용 인원 규모를 나타내는 정보입니다. 더불어 법인명 정보는 법인 사업장의 경우 사업자의 법인 명칭을 확인할 수 있게 하며, 최종수정일자, 데이터갱신구분, 데이터갱신일자 항목을 통해 데이터의 최신성과 관리 이력을 확인할 수 있어, 이 인허가 정보는 서울시 내 당구장업소의 분포, 규모, 시설 특성, 인력·회원 운영 및 영업 상태를 분석하고, 문화·체육 시설 정책 수립과 안전·위생 관리, 체육 진흥 및 관련 행정 지도·감독에 활용하기에 적합한 기초 자료입니다.
