description_portal: 서울특별시 월별 인구추이(주민등록인구)에 대한 통계자료입니다. 성별로 서울시 내국인, 외국인 수를 제공합니다.이 자료는 서울특별시의 세대 및 인구 현황을 나타낸 통계로, 특정 시점별로 정리되어 있습니다. 크게 세 가지 축으로 구성됩니다.세대 현황서울시 전체 세대 수를 집계하여 가구 단위의 변화를 파악할 수 있습니다.세대 수 증감은 도시 내 주거 형태 변화와 가족 구조의 변화를 보여주는 중요한 지표입니다.인구 현황전체 인구를 성별로 구분해 제시하며, 남녀 인구 분포와 비율을 확인할 수 있습니다.장기적으로는 인구 증가·감소 추세와 성비 변화를 비교할 수 있습니다.국적별 인구 구분한국인과 외국인 인구를 구분하여 집계하며, 각각 남성과 여자로 다시 나뉩니다.이를 통해 서울시 거주 내·외국인 구성 비율과 변화 추세를 파악할 수 있습니다.
