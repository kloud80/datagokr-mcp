summary_user: 경기도 행정상담서비스의 운영 일정을 일정 한 건(행정서비스일정일련번호) 단위로 담으며, 기관코드·예약분야·상담분야·상담일자·요일·회차순서와 예약 시 부여되는 예약번호를 포함한다. 경기도 행정상담을 받으려는 도민이나 운영 현황을 보는 분석가가 '어느 날짜·회차에 어떤 분야 상담이 열리고 이미 예약됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 경기공유서비스의 행정서비스 목록과는 행정서비스일련번호·기관코드로만 맞춰 보는 수준으로 연결한다.
description_portal: 이 데이터는 경기도 행정상담서비스의 실제 운영 일정을 관리하기 위한 자료로, 상담 가능한 날짜와 시간대, 회차 정보 등을 포함합니다. 주요 항목으로는 각 일정의 고유 식별자인 ‘행정서비스일정일련번호’, 제공기관을 나타내는 ‘기관코드’, ‘행정서비스일련번호’, 그리고 서비스 분야 및 상담 주제를 정의하는 ‘예약분야’, ‘상담분야’가 있습니다. 또한, 상담이 이루어지는 ‘상담일자’, 해당 요일의 약어로 표기된 ‘요일구분’, 시간 순서를 표시하는 ‘회차순서’ 등의 항목이 포함됩니다. 상담이 예약된 경우 ‘예약번호’가 부여되어, 일정 예약 현황 파악도 가능합니다.
