summary_user: 시도별로 회계연도(fyr)마다 지방세 부과(징수결정)액 합계, 실제 수납액 합계, 그 비율인 징수율을 담은 전국 단위 집계 데이터다. 분석가나 지역 주민이 '우리 시도는 부과한 지방세를 얼마나 거둬들이고 있으며 다른 시도와 비교해 체납 문제가 심한가'를 확인할 때 쓴다. 전역 조인 키는 없어서 자치단체 코드(wa_laf_cd)나 시도명으로 매핑해, 같은 지방재정365의 재정자립도 등 다른 시도별 지표와 연도 기준으로 이어 쓴다.
description_portal: 시도별 징수율은 각 지방자치단체가 부과한 세액 중 실제로 징수된 세액을 비율을 나타내는 지표입니다. 이는 지방세의 부과액에 대비해 징수된 금액이 얼마나 되는지를 백분율로 표시한 것으로, 징수율이 높으면 지방자치단체가 세금을 효율적으로 징수하고 있다는 의미입니다. 반면 징수율이 낮으면 세금 징수의 효율성 부족이나 세금 체납 문제가 있을 가능성을 나타냅니다. 시도별 징수율은 지방자치단체의 재정 건전성을 평가하고, 세수 확보를 위한 정책적 개선이 필요한지를 판단하는 데 중요한 자료로 활용됩니다.
