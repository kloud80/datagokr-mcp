summary_user: 전북특별자치도 내 주요 농수산물 도매시장(전주청과·이리청과·전주수산 등)과 공판장(익산원협·군산수협 등)의 유통 실적을 연도·상하반기별로 청과와 수산물의 물량(톤)과 거래금액(천원)으로 정리한 집계표이며, 시장이 행이 아니라 열로 펼쳐진 771바이트 규모의 작은 CSV 파일입니다. 지역 농업·수산 정책 담당자나 연구자가 '전북에서 어느 도매시장·공판장이 거래 규모가 가장 크고, 상반기와 하반기 사이 물량·금액이 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시장 이름이나 연도를 손으로 맞춰 이어야 하며, 시도 단위 자료라 다른 지역 도매시장 통계와 연도 기준으로 나란히 비교하는 방식이 현실적이다.
description_portal: 본 데이터는 전북특별자치도 내 주요 농수산물 도매시장 및 공판장의 유통 실적을 보여주는 통계 자료입니다. 각 시장별로 상반기와 하반기로 나누어, 청과(농산물)와 수산물의 유통 물량(톤)과 거래 금액(천원)을 상세히 기록하고 있습니다. 이 자료를 통해 지역 농수산물 유통의 중심이 되는 각 시장의 규모와 거래 현황을 파악할 수 있으며, 시기별 유통량 변화와 가격 동향을 분석하는 데 유용합니다. 농업 및 해양수산 정책 수립, 물가 안정 대책 마련, 그리고 유통 구조 개선을 위한 연구에 있어 중요한 기초 데이터로 활용될 수 있습니다.
