description_portal: 본 데이터는 전북특별자치도 익산시 관내에 설치되어 운영 중인 공공전광판의 일반 현황을 체계적으로 정리하여 제공하는 자료이다. 익산시가 관리하는 전광판에 대한 정보를 공개하여 시민의 정보 접근성을 높이고, 공공 시설물 관리의 효율성을 도모하는 데 목적이 있다. 데이터의 주요 구성 항목으로는 전광판의 용도별 구분, 설치 시점, 시스템별 송출 방식, 화면 규격, 표출 형식 등이 상세하게 포함되어 있다. 특히 사용자의 편의를 위해 각 전광판이 위치한 지점의 명칭과 함께 위도 및 경도 좌표를 포함하고 있어, 지도 기반의 분포 현황 파악이나 지리정보 분석에 즉시 활용할 수 있도록 구성하였다. 본 자료는 공공데이터 포털을 통해 정기적으로 현행화되어 최신 정보의 신뢰성을 보장하며, 데이터의 일관성을 유지하기 위해 표준화된 형식을 준수한다.
