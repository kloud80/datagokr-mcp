summary_user: 한국인터넷진흥원 대표홈페이지에 올라온 게시물을 한 건씩 담은 파일로, 메뉴·게시판 번호와 언어유형, 제목, 조회수, 상단공지 여부, 등록일자를 담는다(CSV 약 17KB). 기관 공지·입찰·채용·보도자료 게시 이력을 모아 보거나, 어떤 게시물의 조회수가 높았는지 확인하려는 분석가나 구직자·사업자가 쓴다. 메뉴번호(kisa_homepage_menu_no)와 게시판번호(kisa_homepage_board_no)가 키여서 같은 기관 홈페이지의 메뉴·게시판 관련 데이터와 이어 쓰고, 다른 기관 데이터와 맞출 공통 키는 없다.
description_portal: 한국인터넷진흥원 대표홈페이지에 게시된 게시물에 관한 데이터입니다. 이 데이터는 공지사항, 입찰정보, 채용정보, 보도자료 등 다양한 유형의 게시물을 포함하고 있으며, 각 게시물의 제목, 작성일, 작성자, 조회수 등의 세부 정보가 함께 제공됩니다. 이를 통해 방문자는 최신 소식과 공지사항, 정부 및 기관의 입찰 관련 정보, 채용 공고 및 관련 소식을 한눈에 확인할 수 있습니다. 또한 보도자료를 통해 기관의 주요 활동 및 정책 소식을 투명하게 접할 수 있도록 구성되어 있어, 사용자들이 필요한 정보를 편리하게 찾아볼 수 있도록 돕습니다. 이 데이터는 홈페이지 운영과 정보 제공의 효율성을 높이는 데 중요한 역할을 하며, 다양한 분야의 정보가 체계적으로 관리되고 있어 이용자들이 신뢰할 수 있는 정보를 제공합니다.
