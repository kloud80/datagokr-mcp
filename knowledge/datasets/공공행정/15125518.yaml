summary_user: 가맹본부 브랜드의 정보공개서 등록취소 건을 브랜드 단위로 담은 목록으로, 등록취소유형·사유·완료일시를 제공하며 전국 기준 전체 1,486건, 2019-12-30~2023-08-04 범위다. 창업 예정자가 관심 있는 가맹 브랜드가 등록취소된 적이 있는지, 그 사유가 무엇인지 확인하는 질문에 쓴다. 법인등록번호(corp_rgst_no)로 공정위 가맹사업 등 다른 등록·공시 데이터와 이어 쓰며, 네 체인 모두 사업자등록번호·법인등록번호로 묶인다.
limits: 검증 호출이 기준년도 2023 조건이라 최신 행 날짜(2023-08-04)가 데이터 자체의 최신성과 다를 수 있다. 검증 때 수신한 것은 1,000행으로 전체 1,486건보다 적으므로 전체를 보려면 페이지 단위 호출이 필요하다. 집계 통계나 결정문 같은 사건·문서 단위 자료는 이 데이터로 연계할 수 없다.
