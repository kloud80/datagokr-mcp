summary_user: 곡성군 공유재산관리시스템(KAIS)의 건물군 테이블을 옮긴 파일로, 건물군 하나마다 건물군일련번호와 공간데이터(도형 정보), 읍면동, 작업일시, 데이터기준일자를 담은 건별 원천 자료이며 범위는 곡성군 한 곳이고 위치는 읍면동 단위로 나뉜다(CSV 약 6MB). 공유재산 담당자나 분석가가 곡성군 소유 건물이 어느 읍면동에 어떤 모양으로 놓여 있는지 지도로 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 읍면동 이름을 맞추거나 같은 곡성군의 다른 공유재산 KAIS 테이블과 건물군일련번호로 대조하는 정도로만 잇는다.
