description_portal: 울산광역시 울산대곡박물관은 울산 시민의 식수원 확보를 위한 대곡댐 건설로 인해 건립된 박물관입니다. 울산광역시 울주군 두동면 천전리의 대곡댐 아래에 위치하고 있으며, 국보 "울주 천전리 명문과 암각화"와 1km 거리에 있습니다. 울산 서부 지역의 역사와 문화를 소개합니다. 매년 울산 지역사를 조명하는 특별전과 학술회의를 개최하고 있으며, 전시도록과 학술자료집을 발간하고 있습니다. 울산대곡박물관 안내(주소, 전화번호)와 특별기획전 운영 현황(전시시작일, 전시종료일, 교육/전시행사 대상) 정보를 제공하고 있습니다.
