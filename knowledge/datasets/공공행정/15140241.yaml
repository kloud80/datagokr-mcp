summary_user: 법제처 국가법령정보센터가 제공하는 환경부 법령해석 사례를 건별 목록으로 담으며, 안건명·안건번호·질의기관·해석기관·해석일자와 상세 본문 링크를 포함하고 범위는 전국·비공간입니다. 사업자나 지자체 담당자가 '폐기물·수질·대기 관련 규정을 환경부가 어떻게 해석해 왔는지'를 안건명으로 찾아볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 법령해석일련번호와 상세링크(법령해석상세링크)로 같은 서비스의 본문 조회와 잇고, 다른 데이터와는 질의기관코드·해석기관코드나 기관명 매핑으로만 연결한다.
description_portal: 법제처 국가법령정보센터에서 제공하는 환경부 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 환경 관련 법령에 대한 해석 요청 및 회신 정보를 목록 형태로 제공합니다. 목록에는 해석 일련번호, 안건명, 질의기관, 접수일자, 해석일자, 회신 여부 등의 정보가 포함되어 있으며, 이를 통해 다양한 환경 분야에서 제기된 법률적 질의와 그 처리 현황을 확인할 수 있습니다. 제공되는 데이터는 대기질, 수질, 폐기물, 화학물질 관리 등 주요 환경 정책과 관련된 행정 해석 사례를 포괄하고 있습니다. 각 항목은 본문 조회 서비스와 연계되어 있으며, 해석 요청에 대한 상세 회신 내용을 확인할 수 있는 구조로 설계되어 있습니다.
