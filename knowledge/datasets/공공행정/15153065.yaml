description_portal: 이 데이터는 충청북도 빅데이터허브플랫폼에서 주소 기반 데이터를 자동으로 좌표화(지오코딩) 할 때 사용하는 필터링 단어 목록입니다. 민원 위치, 재난 발생 위치, 특정 시설의 주소 등에서 흔히 사용되는 표현 중, 정확한 위치 파악을 어렵게 만드는 단어를 사전에 제거하기 위해 활용됩니다.예를 들어, “○○아파트 부근”, “△△건물 맞은편”, “□□삼거리 쪽”, “○○학교 후문”과 같은 표현은 지도에서 특정 지점을 고정하기 어렵습니다. 이러한 단어를 필터링하면 주소 텍스트를 표준화할 수 있어, 지오코딩 과정에서 위치 오류를 줄이고 좌표 변환의 정확도를 높일 수 있습니다.또한 숫자 조합, 특정 방향 표현, 불필요한 괄호 문구 등을 제거하기 위한 정규표현식 필터 규칙도 포함되어 있어, 복잡한 형태의 텍스트 주소 정제에도 활용됩니다.이 자료는 빅데이터 기반 위치 분석, 이동 패턴 분석, 행정·재난 대응 위치 확인 등 실제 행정업무에 적용되는 주소 데이터를 정제할 때 사용할 수 있습니다.충청북도 빅데이터허브플랫폼에서 사용하는 지오코딩 필터링 단어 목록을 제공함으로써 민간에서 지오코딩 분석 사용 시 참고할 수 있습니다.
