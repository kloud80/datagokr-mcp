summary_user: 경기아트센터가 연도별로 구매한 전체 금액과 그중 장애인기업 생산제품 구매액, 전체 대비 구매비율(%)을 담은 기관 단위 연도별 집계 자료다. 경기아트센터가 해마다 장애인기업 제품 구매 비중을 얼마나 유지했는지 확인하려는 정책 평가 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기관의 같은 구매 현황 자료와는 연도(yr)와 기관명으로만 맞대어 쓴다.
description_portal: 이 데이터는 경기아트센터에서 장애인기업이 생산한 제품을 구매한 내역을 연도별로 정리한 통계 자료입니다. ‘연도’는 구매가 이루어진 연도를 나타내며, ‘전체 구매액’은 해당 연도 동안 경기아트센터가 구매한 전체 금액을 의미합니다. ‘장애인기업 생산제품 구매액’은 이 중 장애인기업으로부터 구매한 제품에 해당하는 금액을 나타내며, ‘구매비율’은 전체 구매액 대비 장애인기업 제품이 차지하는 비중(%)을 산출한 항목입니다. 이 데이터는 공공기관의 사회적 가치 실현과 장애인기업 지원정책 이행 정도를 평가하는 데 활용될 수 있습니다.
