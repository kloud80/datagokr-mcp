description_portal: 본 데이터는 구군별 의료 및 위생 관련 단체 현황을 제공한다. 식품위생, 공중위생, 의료 분야에서 활동하는 협회나 조합의 정보를 포함한다. 단체명, 소재지, 전화번호, 팩스번호 등의 항목을 수록한다. 단체명은 식품위생협회, 의사회 등 각 단체의 명칭이며, 소재지는 사무소 주소이다. 전화번호는 단체 연락처이고, 팩스번호는 문서 전송 연락처이다. 식품위생 단체는 식품 관련 업소의 위생 관리를 지원하며, 공중위생 단체는 이미용업, 목욕업 등 공중이용시설의 위생 향상을 도모한다. 의료 단체는 의료인 권익 보호와 서비스 질 향상을 위해 활동한다. 본 데이터로 지역별 단체 현황을 파악할 수 있으며, 업종별 문의 및 협력 기초 자료로 활용된다.
