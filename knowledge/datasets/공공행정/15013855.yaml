summary_user: 전북특별자치도 무주군 안의 행정기관·마을회관·노인회관·마을시설 등을 시설 한 곳씩 소속, 도로명·지번 주소, 위도·경도, 전화번호와 함께 담은 시군구 범위의 개별 시설 목록이다. 주민이나 분석가가 '무주군 우리 마을 근처 마을회관·노인회관은 어디이고 연락처는 무엇인가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·시설명 매칭이나 위도·경도 좌표 기반 공간 결합으로만 잇는다.
description_portal: 전북특별자치도 무주군의 행정기관 현황을 매년 갱신하여 파일데이터로 제공하고 있습니다.소속(행정기관, 마을회관, 노인회관, 마을시설 등), 소재지도로명주소, 소재지지번주소, 위도, 경도, 전화번호, 데이터기준일자 등으로 파일 데이터컬럼이 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다.매년 8월 기준으로 운영중인 기관을 현행화하여 자료를 제공하므로 폐쇄된 시설은 데이터 갱신 후에 삭제됩니다. 참고바랍니다.해당 데이터는 전북특별자치도 무주군 행정복지국 자치행정과 행정팀에서 관리하고 있으며 자세한 내용은 063-320-2141(자치행정과)로 연락주시면 됩니다.
