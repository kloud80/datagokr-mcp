description_portal: 서울시 공유 기업 정보 데이터는 서울시에서 공유경제 활성화를 위해 지정한 공유기업들의 기본 현황을 정리한 자료입니다. 중분류 코드와 중분류, 그룹레벨 코드와 그룹레벨 정보를 통해 기업을 업종과 유형별로 분류하여 한눈에 파악할 수 있으며, 기업명과 지정기간 시작일·종료일을 통해 어떤 기업이 언제부터 언제까지 공유기업으로 지정되어 활동하는지 확인할 수 있습니다. 기업 웹사이트 주소와 기업 요약소개는 시민과 이용자, 연구자, 실무 담당자가 각 기업의 서비스 모델과 주요 활동 내용을 자세히 살펴보는 데 활용할 수 있습니다. 상세주소, 위치(위도·경도) 정보는 기업의 실제 거점 위치를 지도 기반으로 분석하거나 방문·현장조사 등에 활용하기에 유용합니다. 생성일시는 데이터 등록 시점을 나타내어 기업 정보의 관리 이력과 최신성을 파악할 수 있으며, 이 데이터는 공유경제 정책 기획, 공유기업 육성, 지역별 공유서비스 분포 분석, 민간 협력 파트너 발굴 등 다양한 행정·연구·비즈니스 목적에 활용 가능한 기초 자료입니다.
