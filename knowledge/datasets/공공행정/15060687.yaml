description_portal: 이 자료는 행정부 국가공무원 중 고위공무원단의 현원을 나타낸 인사통계 데이터로 부처별, 직종별, 성별로 구성되어 있습니다.해당 데이터에서 고위공무원단은 일반직, 특정직, 별정직 3개 직종으로 구분되며, 각 직종별로 여성고위공무원 인원이 나타나 있습니다.해당 통계의 산출기준일은 매년 12월 31일이며, 단위는 "명 " 입니다. 그리고 부, 처, 청, 위원회의 정부 조직별로 고위공무원 현황이 나타나 있습니다. 일반직은 연구직 고위공무원과 지도직 고위공무원을 포함하고 있으며, 특정직공무원은 외무공무원을 나타냅니다.
