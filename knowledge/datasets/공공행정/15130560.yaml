description_portal: "- 전라남도 시험정보 홈페이지에 게재된 공무원 공개, 경력, 경쟁임용 시험정보(제목, 등록일시, 내용URL)를 조회하실 수 있습니다.- 전라남도 지방공무원 임용시험은 전라남도청과 각 시군청에서 주관하며, 매년 정기적으로 시행됩니다. 시험 일정, 자격 요건, 선발 인원 등은 해당 기관의 공식 채용 공고를 통해 확인하실 수 있습니다.1. 시험 일정 및 공고 확인- 전라남도청 : 전라남도청 공식 홈페이지의 '채용정보' 또는 '알림마당' 섹션에서 임용시험 공고를 확인하실 수 있습니다.- 각 시군청 : 목포시청, 여수시청 등 각 시군청의 공식 홈페이지에서도 해당 지역의 지방공무원 임용시험 공고를 확인하실 수 있습니다.2. 시험 과목 및 선발 분야- 시험 과목 : 일반적으로 국어, 영어, 한국사 등의 필수 과목과 전공 과목이 포함됩니다.- 선발 분야 : 행정, 기술, 연구, 보건, 환경 등 다양한 분야에서 선발이 이루어집니다."
