description_portal: 이 데이터는 2022년 1월 ~ 2025년 8월까지 키워드 "안산"이 들어있는 여러 언론사의 기사를 체계적으로 분석한 자료입니다. 각 기사의 날짜, 언론사, 제목, 원문 링크와 같은 기본 정보는 물론, 기사의 논조를 긍정, 부정, 중립으로 분류한 감성 분석 결과를 포함하고 있습니다. 더 나아가 분류에 대한 구체적인 사유, 기사에 등장하는 핵심 인물, 주요 동사, 관련 지역명까지 추출하여 사건의 맥락을 깊이 있게 이해할 수 있도록 돕습니다. 골판지 공장의 안타까운 인명 사고부터 다문화 거리의 활기찬 모습, 도시재생 사업의 희망적인 소식까지 다양한 지역 이슈를 다각도로 조명하고 있습니다.해당 데이터는 라벨링이 되어있어 AI학습에 용이합니다.
