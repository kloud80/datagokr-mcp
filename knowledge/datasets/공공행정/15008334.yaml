summary_user: 대전광역시 중구가 조사한 생활물가를 품목별로 담은 파일로, 공산품·농산물·수산물·축산물 구분과 품목, 가격 단위(조사기준), 평균가(원), 그리고 문화동 홈플러스·안영동 하나로마트·문창시장·산성시장·유천시장·태평시장·오류시장·부사시장 등 8개 조사지점별 가격을 한 행에 담은 집계표입니다. 중구 주민이나 소상공인이 '같은 품목이 대형마트와 전통시장 중 어디가 싼가', '이 품목의 중구 평균가는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 물가 자료와는 품목명·조사지점 이름을 맞춰 연결해야 하며, 같은 기관(대전 중구)의 상권·착한가격업소 자료와 지역 단위로 함께 본다.
description_portal: 본 공공데이터는 대전광역시 중구 물가동향 정보로 구분, 품목, 조사기준, 평균가, 물가조사지역, 관리기관, 연락처 등을 담고 있습니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 구분은 공산품, 농산물, 수산물, 축산물로 구분되어 있습니다.데이터 컬럼 중 조사기준은 품목에서 표기된 내용의 가격 표기를 위한 단위를 표시하고 있습니다.데이터 컬럼 중 5번째 열부터 12번째 열까지는 조사지역별 물가를 표기하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
