summary_user: 대전광역시가 관리하는 공유재산(토지·건물)을 필지·건물 단위로 한 건씩 담은 목록으로, 재산번호·소재지(시군구·읍면동·본번·부번)·지목·면적·재산가격·행정재산 구분·취득·처분 상태·대부 여부·유휴시설 여부 등을 포함한다. 시민·연구자·공무원이 "대전시 소유 토지 중 유휴시설로 분류되었거나 대부 중인 재산은 어디에 얼마나 있는가" 같은 질문에 답하거나 행정재산과 수익재산의 비중을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 소재지의 시군구·읍면동·본번·부번을 지번 주소로 맞추는 이름·주소 매핑으로만 이어 쓴다.
description_portal: 대전광역시 공유재산 목록 데이터는 대전시가 관리하고 있는 모든 공유재산(토지·건물)에 대한 상세 현황을 제공합니다. 본 자료에는 행정·공공용·수익용 등 용도별 공유재산의 구분, 소유자, 위치, 면적, 재산구분(토지/건물), 가치평가 등 주요 속성이 포함되어 있습니다. 매년 12월 31일 기준으로 정기적으로 갱신·공개되며, 재산 별 정확한 관리 현황과 활용 가능성, 재산 보유 구조, 행정 재산과 수익 재산의 비중 파악 등이 가능합니다. 해당 데이터는 도시계획 및 공공자산 운영, 공공재산의 효율적 배분과 활용 정책, 시설 확충 및 매각 대상 선정, 기관 별 자산 관리 투명성 확보 등 다양한 행정적·정책적 연구 및 실무 의사결정에서 활용할 수 있습니다.
