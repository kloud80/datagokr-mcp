summary_user: 국가법령정보센터의 공포법령을 시행일자 기준으로 조(條) 단위로 나눈 파일 데이터로, 한 행이 법령 일련번호에 딸린 조문 하나(조문번호·가지번호·조문제목)를 담는다. 리걸테크 개발자나 법제 분석가가 특정 법령의 어떤 조문이 언제 시행·개정되어 바뀌었는지 추적하거나, 조문 단위로 판례·해석례를 붙일 기준표가 필요할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 법령·판례 데이터와는 법령 일련번호·조문번호 같은 법제처 내부 식별자나 법령명 매핑으로만 잇는다.
description_portal: 국가법령정보센터에서 제공하는 공포법령 정보를 공포일 및 시행일을 기준으로 조(條) 단위로 구조화하여 관리한 데이터입니다. 각 법령의 기본속성(공포번호, 공포일자, 시행일자 등)과 더불어 조문 단위의 고유 식별체계를 포함하고 있어 법령의 체계, 조문 구성, 개정 이력 등을 체계적으로 파악할 수 있습니다. 특히 공포법령을 조 단위로 제공함으로써 법령정보를 보다 정밀하게 분석·활용할 수 있으며, 법령 개정 추이 분석, 조문별 영향도 평가, 법령-판례-해석례 연계 등 다양한 AI 기반 법제 연구와 리걸테크 서비스 개발에 활용이 가능합니다.
