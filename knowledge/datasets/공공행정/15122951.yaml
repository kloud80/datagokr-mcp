summary_user: 경기통계시스템에 등록된 통계조사와 그 조사를 담당하는 조직의 관계를 한 행씩 담은 메타정보 자료로, 조사별관리ID·통계조사ID·조직번호 세 항목으로 구성된다. 경기도 통계 담당자나 연구자가 '특정 부서·기관이 관리하는 통계조사는 무엇인가'를 확인하거나 조사별 관리 주체를 정리할 때 쓴다. 포털 설명상 통계조사ID(stats_exmn_id)로 같은 시스템의 통계표·간행물 메타정보와 이어 쓰고 조직번호로 조직 정보와 맞출 수 있으나, 실측에서는 전역 조인 키가 확인되지 않아 같은 기관(경기통계시스템) 자료끼리의 코드 매핑으로만 연결된다.
description_portal: 이 데이터는 경기도에서 수행한 통계조사와 그 조사들을 담당한 조직 간의 관계를 나타내는 메타정보 자료로, 각 통계조사가 어떤 조직에 의해 관리되고 있는지를 정리합니다. 주요 항목은 조사별관리ID, 통계조사ID, 조직번호로 구성되어 있으며, 이를 통해 특정 조직이 수행한 통계조사 목록을 추적할 수 있습니다. 해당 데이터는 통계조사의 관리 주체 파악, 기관 간 역할 분담 분석, 통계 연계관리 및 메타데이터 체계화 등 다양한 행정 및 정책 연구 목적으로 활용될 수 있습니다. 통계조사ID는 앞서 수록된 통계표 및 간행물과 연계 가능한 고유값이며, 조직번호는 경기통계시스템 상 등록된 행정 또는 조사 기관을 식별하는 데 사용됩니다.
