summary_user: 광주 동구에서 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 목록 파일(약 4KB CSV)로, 업종·업소명·주요품목과 가격·전화번호·도로명주소가 들어 있다. 동구 주민이나 방문객이 '동구에서 싸게 먹을 수 있는 식당이나 미용실이 어디이고 대표 메뉴가 얼마인가'를 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소(소재지도로명주소)나 업소명을 맞춰 붙이거나, 같은 기관 코드로만 연결한다. 주소를 지오코딩하면 LOCALDATA 인허가 같은 업소 원장과도 대조할 수 있다.
description_portal: 광주광역시 동구의 착한가격업소 공공데이터는 행정안전부가 지정한, 물가 안정과 서민 생활 부담 완화를 위해 합리적인 가격으로 서비스를 제공하는 업소들의 정보를 모아둔 자료입니다. 이 데이터는 주민들이 가성비 좋은 업소를 쉽게 찾을 수 있도록 돕고, 지역 내 건전한 소비 문화를 확산하는 데 목적이 있습니다.제공되는 정보에는 각 착한가격업소의 업소명이 포함되어 있으며, 이를 통해 어떤 가게가 착한가격업소로 지정되었는지 확인할 수 있습니다. 또한 주요품목과 가격 정보는 해당 업소가 어떤 메뉴나 상품을 어떤 가격 수준으로 제공하는지를 보여 주어, 소비자가 직접 비교하고 선택할 수 있도록 돕습니다.전화 문의가 필요한 경우를 위해 전화번호가 제공되며, 소재지 도로명주소는 업소의 정확한 위치를 안내하여 실제 방문 시 편의를 높입니다.이 데이터는 단순한 업소 목록을 넘어, 지역경제 활성화와 물가 안정 정책을 함께 실현하기 위한 중요한 행정자료로 활용되며, 주민들에게는 알뜰 소비 정보를 제공하는 유용한 생활 공공데이터입니다.
