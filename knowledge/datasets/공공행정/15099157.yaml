summary_user: 전국 행정동(읍면동)별 주민등록 평균연령을 전체·남자·여자로 나눠 담은 집계 파일로, 검증 시 3,619행이 수신됐고 기준일은 2026-08-31 한 시점이다. 지역 주민의 연령 구조를 비교하려는 분석가나 지자체 담당자가 "우리 동네 평균연령이 다른 동보다 높은가" 같은 질문에 쓴다. 전역 조인 키는 확인되지 않아 행정기관코드나 시도·시군구·읍면동 이름을 매핑하거나 같은 기관의 다른 주민등록 통계와 코드로 이어 쓰며, 행정동·법정동·통반 단위 공간 결합의 기본 축이 된다.
