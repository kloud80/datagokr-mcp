description_portal: 행정동(읍면동) 성별 주민등록 평균연령에 대한 데이터로, 행정동은 주민들이 거주하는 지역을 행정능률과 주민편의를 위하여 구분한 행정 구역 단위를 말합니다.주민등록 인구 및 세대 등 을 기반으로 선거, 교육, 조세, 복지, 교통, 지역 개발 등 다양한 분야에 적시성 있는 통계를 제공하고 있습니다. 이러한 통계는 국가 행정 및 정책 수립에 필요한 기초 자료로 활용되고 있습니다.주민등록 인구통계는 행정안전부 주민등록 인구통계 홈페이지(https://jumin.mois.go.kr), 공공데이터포털(https://data.go.kr), 국가통계포털(KOSIS) 등에서 확인 및 다운로드가 가능합니다.
