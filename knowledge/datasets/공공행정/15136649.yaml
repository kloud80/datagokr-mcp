description_portal: 본 데이터는 서울특별시 관악구에서 제공하는 다양한 민원 서식 정보를 체계적으로 정리한 자료입니다. 본 데이터는 민원사무명, 민원사무내용, 처리절차, 구비서류, 관계법령의 항목으로 구성되며, 개별 민원 유형별로 필요한 신청 절차와 관련 법적 근거, 제출해야 하는 서류 목록을 한눈에 확인할 수 있도록 정리되어 있습니다. 또한 본 데이터는 이륜자동차 검사 연장 신청, 전세사기피해자 결정신청, 직업소개사업 등록, 장애인 지원 신청, 부동산 관련 신고, 지방세 신고 등 폭넓은 행정 분야를 포괄하고 있어 민원인이 준비해야 할 핵심 정보를 보다 명확하게 파악할 수 있게 해주는 행정 안내 기반자료로 활용될 수 있습니다.
