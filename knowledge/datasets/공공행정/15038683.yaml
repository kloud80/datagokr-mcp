description_portal: 인천광역시 중구 관내에 위치한 석면조사 대상 건축물 현황에 대한 데이터입니다.석면조사는 해당 건축물에 쓰인 자재에 석면이 함유되어 있는지 여부, 석면건축자재의 위치 및 물량, 석면의 종류 및 함유량 등에 대해 조사하는 것입니다.석면조사의 목적은 건축물 및 설비, 시설물 등의 석면 사용 실태를 파악하고, 석면 함유 물질의 사용 현황을 조사하여 위해성 평가를 실시하는 데 있습니다.이를 토대로 건축물 석면 지도에 반영하여 적정 관리 방안을 수립할 수 있으며, 관련 정보는 환경부 석면관리 종합정보망에서도 확인할 수 있습니다.파일명 인천광역시 중구 석면조사대상 건축물 현황내용 연번, 구분, 건축물명, 동명, 주소, 석면건축물 여부 등
