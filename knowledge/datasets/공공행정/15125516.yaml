summary_user: 가맹사업 브랜드별로 가맹본부가 가맹점에 제공하는 경영지원 정책의 이름·내용·조건·기간을 기준년도와 브랜드관리번호 단위로 조회하는 전국 범위의 API입니다. 가맹점 창업 예정자가 '이 브랜드 본부는 가맹점에 어떤 경영지원을 어떤 조건으로 해 주나'를 비교·확인하는 데 쓴다. 브랜드관리번호·가맹본부관리번호로 같은 기관의 가맹정보 서비스(브랜드·본부 정보)와 이어 쓰지만, 실측 컬럼에서 사업자등록번호 같은 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름 매핑으로만 연결된다.
limits: 사업자등록번호·법인등록번호 등 전역 조인 키가 실측 컬럼에 없어 다른 공정거래 체인이나 외부 데이터와 직접 결합하기 어렵다. 조회에는 기준년도와 브랜드관리번호가 필요하며, 개발계정은 하루 10,000회로 호출이 제한된다.
