summary_user: 광주 북구가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 원장형 파일로, 업종구분·업소명·주소·대표메뉴와 그 가격·전화번호·지정연도를 담는다. 주민이나 방문객이 '북구에서 싼 값에 밥 먹을 수 있는 동네 식당이 어디고 대표메뉴가 얼마인가'를 찾거나, 분석가가 착한가격업소의 업종 분포와 지정연도별 추이를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 업소명을 맞춰 붙여야 하며, 지방 인허가(LOCALDATA) 업소 원장과 이름·주소로 대조해 상권 분석 원료로 이어 쓴다.
description_portal: 광주광역시 북구에 위치한 착한가격업소 현황 데이터입니다.업종구분, 업소명, 주소, 대표메뉴, 대표메뉴 가격, 전화번호, 지정연도 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 착한가격업소 - 물가안정에 기여한 업소 중 가격, 위생, 서비스 품질 등의 기준에 따른 평가를 거쳐 자치구가 지정한 업소 - 광주광역시 북구 착한가격업소 정보는 북구 대표 홈페이지 분야별정보 > 경제정보 > 착한가격업소(https://bukgu.gwangju.kr/goodStore.es?mid=a10409020000) 에서도 확인하실 수 있습니다.
