description_portal: '이 데이터는 우체국금융개발원에서 공고하는 채용현황을 제공하는 데이터 입니다. 신규채용에 따른 일반정규직, 무기계약직, 청년, 여성, 장애인, 비수도권 지역인재, 이전지역인재, 고졸인재, 현지채용 등을 통해 우체국금융개발원에서 필요로 하는 인재를 파악하고, 구직자는 자신에게 맞는 채용 공고를 찾고 지원을 할 수 있습니다. 더 자세한 채용공고는 알리오(ALIO)에서 확인할 수 있습니다.해당 데이터가 보유한 컬럼정보는 다음과 같습니다.컬럼정보 : 상임인원 채용 수, 일반정규직ㆍ무기계약직 각각 총 신규채용 수, 청년 채용 수, 여성 채용 수, 장애인 채용 수, 비수도권 지역인재 채용 수, 이전지역 지역인재 채용 수, 고졸 인력 채용 수, 현지 채용 수'
