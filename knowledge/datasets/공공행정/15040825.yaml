description_portal: 청주시 차량등록사업소에서 관리하고 있는 자가용화물자동차 현황입니다해당 데이터는 신고연월일, 차종, 차고지 종류, 소유형태, 관할기관 등 총 5개 항목의 정보를 제공합니다.자가용화물차 차고지 사용신고 제도는 자가용화물차의 경우 무단 주차방지, 도심 혼잡, 환경오염 예방, 안전한 차량 관리 등을 위하여화물차를 주차하고 정비, 보관 등을 할 수 있는 차고지를 등록하는 제도입니다.청주시에서는 차량등록사업소에서 자가용화물차 차고지 사용신고 업무를 하고 있으며,신고대상, 필요 서류, 서식 등에 대해서는 청주시 홈페이지(https://www.cheongju.go.kr/car/contents.do?key=23841)에서상세하고 설명하고 있으니, 참고하시면 됩니다.
