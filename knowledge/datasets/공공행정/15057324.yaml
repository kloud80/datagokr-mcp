summary_user: 지방자치단체별·회계연도별로 지방교부세 인센티브 금액을 인센티브 합계와 지방재정혁신, 지방세 체납액 축소, 신속집행 이자보전, 재정공시, 지방세외수입 등 항목별로 나눠 담는 전국 단위 집계 데이터이며, 포털 설명상 2012년 이후 정보를 제공한다. 지방재정 분석가나 지방의원·주민이 '우리 지자체가 재정운영 성과로 보통교부세 인센티브를 얼마나, 어떤 항목에서 받았나'를 연도별로 확인하고 다른 지자체와 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 지방재정365 데이터와는 연도(fyr)와 자치단체 코드·이름(laf_cd, 자치단체명)을 같은 기관 코드체계나 이름 매핑으로 맞춰 잇는다.
description_portal: 지방자치단체의 지방교부세는 자치단체의 재정력 격차를 해소하기 위해 국가가 지원하는 재원으로 지방교부세 인센티브는 자치단체의 재정운영성과를 장려하기 위해 마련된 제도로 지방교부세법 및 시행규칙에 근거하여 운영됩니다. 이는 자치단체가 세입확충, 세출절감, 일자리창출, 지역경제활성화 등에서 우수한 성과를 거둘 경우 보통교부세 산정 시 추가 재정을 지원받는 방식입니다.지방교부세인센티브현황 정보는 2012년 이후 정보가 제공되고 있으며 세부 제공항목으로는 자치단체별 인센티브계, 재방재정혁신, 공기업혁신 재정분석, 지방세체납액축소, 신속집행이자보전, 재정공시, 지방재정대상, 지방상하수도, 지방세외수입 항목별 인센티브 금액 정보가 제공됩니다.
