description_portal: '○ 통계개요* 통계명 : 교육비 특별회계 세출결산* 통계종류 : 서울시 교육비 특별회계 세출결산 현황을 제공하는 일반ㆍ보고통계* 근거법령 : 「지방재정법」에 의거하여 운용되는 지방재정 현황* 작성목적 : 지방재정의 계획수립 및 운용 현황을 파악하여, 지방재정의 건전하고 투명한운용과 합리적ㆍ효율적인 관리가 이루어질 수 있도록 기초자료를 제공하는것을 목적으로 함* 조사체계 : 서울특별시 교육청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 해당교육청내용 - 서울시 교육비 특별회계 세출항목별(유아및초등교육, 평생직업교육,교육일반 등) 세출결산현황(예산액, 징수결정액, 수납액, 불납결손액,미수납액)○ 용어설명* 특별회계 : 특별회계는 한 국가의 회계 중 특정한 세입으로 특정한 세출을 충당하는 것임○ 기 타○ 출 처 : 서울특별시 교육청'
