description_portal: 한국산업인력공단에서 제공하는 외국인노동자 고용 행위(구직정보, 기업회원 업종종보, 자격증명 이력증명 등)에 대한 공공데이터 입니다.한국산업인력공단(HRD Korea)에서 제공하는 ‘외국인 노동자·구직자 정보’ 공공데이터는 외국인 취업 희망자와 실제 고용 현황을 체계적으로 수집·제공하는 공공 API입니다. 주요 항목은 비자 유형(E‑9, E‑7 등), 출신 국가, 직종, 취업 상태(구직, 취업 중), 체류 기간 등으로 구성되어 있어, 외국인 근로자 고용 사업자 및 연구자, 정부기관 등이 노동시장 분석과 정책 수립, 맞춤형 취업 지원 등에 활용할 수 있습니다.
