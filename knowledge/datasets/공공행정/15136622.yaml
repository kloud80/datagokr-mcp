summary_user: 법제처 국가법령정보센터의 규제 정보를 규제 항목별로 정리한 CSV 파일로, 규제명과 일몰 시작·종료 일자, 국가법령정보센터 상세 페이지 주소를 담는 전국 단위 목록이다. 정책 담당자나 기업이 특정 규제가 언제 일몰되는지, 또는 일몰 기한이 다가오는 규제가 무엇인지 확인할 때 쓴다. 실측 컬럼에 법령ID 같은 전역 조인 키가 없어 다른 법령·규제 데이터와는 규제명 문자열 매칭이나 상세 URL을 통해서만 이어 쓸 수 있다.
description_portal: 다양한 규제 제도의 법적 근거와 적용 범위, 절차, 대상, 형식, 규제 강도 등을 체계적으로 정리한 데이터입니다. 각 규제 항목은 법령에 명시된 유형별로 구분되어 있으며, 해당 규제를 시행하는 행정 절차와 예상 영향, 평가 기준이 포함되어 있습니다. 또한 규제 도입 일자 및 수정 이력, 평가 결과 등을 항목별로 제공하여 규제 현황을 종합적으로 파악할 수 있도록 구성하였습니다. 이를 통해 행정기관과 정책 담당자는 규제 운영의 법적 기반과 절차를 명확히 이해하고, 국민과 기업은 적용 대상과 영향 범위를 투명하게 확인할 수 있습니다. 아울러 규제 개선과정에서 나타난 평가 결과를 한눈에 확인하여 제도 개편을 위한 기초 자료로 활용할 수 있습니다.
