summary_user: 전국 유휴 국유일반재산 중 수소차·전기차 충전소 부지, 촬영장소, 청년 적합재산 등 특정 용도에 맞는 재산을 건별로 담은 CSV 파일로, 검증 시 246행을 받았다. 충전소 부지나 촬영 장소를 찾는 사업자·개인이 소재지, 면적, 접면도로, 인근 주거지역과의 거리 같은 조건으로 활용 가능한 국유재산을 고르는 질문에 쓴다. 소재지 주소(address)와 법정동코드(bjd_cd)를 키로 다른 국유재산·지역 데이터와 이어 쓰며, 포털 설명상 상세 정보는 캠코국유재산포털에서 확인한다.
description_portal: 전국 유휴 국유일반재산 중 수소차 충전소 부지, 전기차 충전소 부지, 촬영장소, 청년 적합재산 등 특정 용도로 활용할 수 있는 국유일반재산 정보를 제공합니다. "맞춤형 재산정보 현황" 데이터는 국유일반재산의 소재지, 용도, 면적, 도로 인접여부, 지상층수, 지하 존재여부, 주차장소, 접면도로, 인근 주거지역과의 거리, 기타 현황 등에 대한 정보에 대해 CSV 파일형태로 제공합니다.관련 국유재산 상세정보는 캠코국유재산포털(https://gpminwon.kamco.or.kr)에서 확인 가능합니다.
