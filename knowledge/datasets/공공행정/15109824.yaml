summary_user: '연도별·업종(대분류, 중분류)별로 가맹점 증가 수·증가율, 신규 가맹점 등록 수·비율, 등록취소 가맹점 수·비율을 담은 전국 단위 집계 데이터입니다. 창업 예정자나 분석가가 특정 업종(예: 외식·서비스·도소매)의 가맹점이 해마다 늘고 있는지, 신규 개점 대비 등록취소가 많은지 비교하는 데 쓴다. 사업자등록번호 같은 전역 조인 키가 없으므로, 같은 기관의 가맹정보 데이터와는 연도와 업종명(대분류명·중분류명)을 맞춰서만 이어 쓴다.'
description_portal: 년도, 업종 대분류코드를 가맹점증가수, 가맹점증가율, 업종대분류코드, 업종대분류명, 신규가맹점등록수, 신규가맹점율, 등록취소가맹점율, 등록취소가맹점수 등의 정보를 조회할 수 있는 서비스
