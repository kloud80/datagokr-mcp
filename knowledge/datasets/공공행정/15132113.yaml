summary_user: 역대 대통령이 외국 주요 인사에게서 받은 선물을 한 점씩 담은 건별 목록으로, 대통령·선물명·증정인·증정국가·증정일을 담는다(포털 설명상 소장 약 1.6만 점 중 온라인 공개 4,071건 기준). 연구자나 기자가 특정 대통령 재임기에 어느 나라에서 어떤 선물을 받았는지, 국가별 선물 교류가 어떻게 분포하는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대통령 이름이나 증정국가명을 문자열로 맞춰 이어 써야 한다.
description_portal: ‘대통령 선물·행정박물’ 콘텐츠는 역대 대통령이 세계 각국의 주요 인사들로부터 받은 선물을 일반에 온라인 공개하기 위해 개발된 메뉴입니다. 대통령기록관은 약 1.6만점의 선물을 소장하고 있으며, 그 중 4,071건의 선물을 온라인 공개하고 있습니다. 선물명, 증정인, 증정국가와 증정일 외에 수령 경위, 규격, 특징 등의 상세정보가 선물이미지와 함께 제공됩니다.https://pa.go.kr/portal/contents/stroll/giftgallery/giftgalleryList.do
