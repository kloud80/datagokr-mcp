summary_user: 경기도 하남시의 차량등록대수를 행정동(읍면동)과 차종(승용·승합·화물·특수)별로, 비사업용·사업용과 경형·소형·중형·대형 규모로 나눠 담은 집계표이며, 포털 설명상 2025년 11월 기준이고 파일 크기는 약 3KB(csv)입니다. 하남시 행정 담당자나 지역 분석가가 '어느 동에 화물차·사업용 차량 등록이 많은가' 같은 동별 차량 보유 구조를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 시군구·읍면동 이름을 매핑해서만 이어 쓸 수 있다.
description_portal: 경기도 하남시 행정동별 , 차종별 차량등록대수 현황에 관련된 정보로 비사업용, 사업용 별 차량등록대수 현황에 관한 정보를 제공합니다. 2025년 11월 기준 데이터입니다. 실제 데이터는 행정동 기준의 정형표라기보다는 차종별 등록대수를 중심으로 구성되어 있으며, 승용·승합·화물·특수 등 각 차종에 대한 등록 차량 수가 여러 구간에 반복적으로 제시되어 있습니다.  이러한 비정형 구조는 통계 보고서용 원자료 형태로 판단되며, 행정에서 자동차 등록현황 분석 참고자료로 활용될 수 있습니다.
