description_portal: '제주특별자치도의회의 의안처리현황과 관련한 데이터를 제공합니다.항목: 구분, 접수, 처리, 가결, 폐기, 철회, 불채택, 미처리, 관리부서*의안처리절차: 의안에는 근거 법규, 발의자와 찬성자의 서명, 제안 이유와 주요골자, 조문대비(조례의 경우) 등의 요건을 갖추어 의장에게 제출한다. 상임위원회에서는 제안자의 취지설명, 전문위원의 검토 보고, 질의,토론,축조심사의 순서를 거쳐 의결한 다음 본회의에 부의한다. 본회의에 부의된 안건은 소관 상임위원회 위원장의 심사보고를 듣고 질의, 토론을 거쳐 의결한다.자세한 사항은 제주특별자치도의회 홈페이지에서 확인하시기 바랍니다.https://www.council.jeju.kr/activity/bill/state.do'
