description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 고객센터의 상담 내용을 기반으로 정리된 상담 데이터로, 고객 응대 과정에서 발생한 다양한 유형의 응대 상황 및 스트레스 요인을 체계적으로 기록한 자료입니다. 각 데이터는 통화 아이디, 통화 일자, 고객상담 여부를 포함하며, 통화가 이루어진 시점과 상담의 유무를 확인할 수 있습니다. 또한 스트레스 발생 여부를 중심으로 언어폭력 발생 여부, 반복 질문 발생 여부, 고집 발생 여부, 반말 발생 여부, 갑질 발생 여부, 짜증난 어투 발생 여부 등 고객의 부정적 응대 행동에 대한 세부 항목이 포함되어 있으며, 이는 모두 상담 직원의 스트레스 유발 요인을 정량적으로 분석하기 위해 구성되어 있습니다. 직원 측면에서는 직원 실수 제기 발생 여부, 직원 불친절 제기 발생 여부 등 응대 품질에 대한 고객의 반응이 포함되어 있으며, 기타 스트레스 발생 사유 항목은 특정 범주로 분류되지 않는 특이 사례나 비정형 상황을 기록할 수 있도록 설계되어 있습니다. 이 데이터는 고객 응대 시 발생하는 감정노동 유형과 빈도, 상담의 질 관리, 직원 보호 방안 마련, 내부 교육 콘텐츠 설계, 조직 내 감정노동 리스크 대응 전략 수립 등에 활용될 수 있으며, 지속적인 데이터 수집을 통해 상담 품질 향상과 감정노동 관리의 정량적 기반을 제공하는 중요한 자료로 기능합니다.
