summary_user: 홍성군의회에서 처리된 의안을 한 건씩 담은 파일로, 의안 번호·제목·제안자·제안일과 위원회 심사 결과, 본회의 결과, 최종 처리 결과를 함께 싣는다. 군민이나 지방의정 분석가가 '이번 회기에 집행부와 의원 중 누가 낸 조례안이 몇 건이고 그중 몇 건이 원안 가결됐나'처럼 제안 주체별 처리 결과를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키는 없어서, 같은 홍성군의 다른 의회 자료와 제목이나 제안자 이름, 기관 내부 코드(제안자코드·의안처리코드)를 맞춰 대조해야 한다.
description_portal: 본 데이터는 홍성군의회에서 처리된 의안에 대한 전반적인 관리 정보를 포함하고 있습니다. 각 의안에는 고유 법안코드가 부여되며, 제목, 제안자 정보, 제안일, 소관 위원회 및 본회의 심사 결과, 최종 법안 처리 결과 등이 포함되어 있습니다. 이를 통해 의안의 입안부터 의결까지의 절차와 결과를 투명하게 확인할 수 있으며, 의정활동의 추적 및 통계 분석 자료로 활용 가능합니다.
