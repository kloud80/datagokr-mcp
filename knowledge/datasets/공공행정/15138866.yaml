summary_user: 지방자치단체별·회계연도별 통합유동부채비율과 그 구성 금액(자치단체·지방공사공단·출자출연기관의 유동부채와 유동자산 소계·세부)을 담은 전국 단위 집계 지표이며, 포털 설명상 2015 회계연도부터 제공된다. 지방재정 분석가나 주민이 "우리 시·군·구는 1년 안에 갚아야 할 빚이 단기 현금화 가능 자산보다 얼마나 많고, 그 부담이 본청과 산하 공사·출연기관 중 어디에 몰려 있나"를 따져 볼 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 회계연도(fyr)와 자치단체 코드·이름(laf_cd, 상위단체 wa_laf_cd)을 기준으로 같은 지방재정365의 다른 지표(재정자립도 등)와 이름·코드 매핑으로만 잇는다.
description_portal: 지방자치단체의 통합유동부채비율은 자치단체의 재정건전성을 평가하는 지표 중 하나로 유동부채가 유동자산에 비해 얼마나 많은지를 나타냅니다. 유동부채는 1년 이내 상환해야 할 채무(예:미지급금, 단기차입금 등)을 의미하며, 유동자산은 1년 이내 현금화가 가능한 자산(예:현금, 단기예금 등)입니다. 이 비율이 높을수록 단기 재정 부담이 크다는 의미이며, 재정운영의 유연성이 낮다고 해석할 수 있습니다.통합유동부채비율 정보는 2015 회계연도부터 정보가 제공되고 있으며, 대상회계는 자치단체(일반회계, 기타/공기업특별회계, 기금)+지방공사.공단 + 출자출연기관을 합한 금액으로 제공됩니다. 세부 제공정보는 유동부채소계, 자치단체유동부채, 지방공사공단 유동부채, 출자출연기관 유동부채와 유동자산소계, 자치단체, 지방공사공단 및 출자출연기관의 유동자산 정보가 제공됩니다.
