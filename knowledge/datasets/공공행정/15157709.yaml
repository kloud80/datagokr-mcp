summary_user: 온비드에 등록된 입찰마감 전 물건 중 감정평가금액 또는 최초 최저입찰가격 대비 최저입찰가격이 가장 많이 내려간 상위 20개를 부동산·동산·자동차 유형별로 순위를 매겨 담은 목록이며, 물건별 감정가·최저입찰가·저감 비율·입찰기간·재산유형(압류·국유·공유재산 등)이 들어 있고 범위는 전국이다. 공매 투자자나 일반 국민이 '지금 입찰 가능한 물건 중 감정가 대비 가장 싸게 나온 부동산이나 차량은 무엇인가'를 빠르게 훑어볼 때 쓴다. 전역 조인 키는 없지만, 물건관리번호(cltrMngNo)와 공매조건번호를 함께 써서 같은 기관의 온비드 물건·입찰정보 서비스와 이어 상세 조회하고, 용도 분류 코드와 재산유형 코드는 온비드 코드표로 맞춘다.
description_portal: '한국자산관리공사에서 운영하는 온비드(Onbid) 홈페이지에 등록된 물건 중 최저입찰금액이 감정평가금액 또는 최초입찰가격 대비 가장 많이 저감된 상위 20개 물건 정보입니다. 물건 유형(부동산, 동산, 자동차)에 따라 저감률이 가장 높은 물건의 순위와 입찰종료일자, 최저입찰가격, 감정평가금액 등 주요 물건 정보를 조회할 수 있습니다. 순위물건은 입찰마감 전인 (입찰 준비중이거나 입찰 진행 중) 물건만 조회됩니다. 순위물건의 순위는 참고용으로만 활용하시기 바랍니다. 필수 입력 조건 : 물건유형구분(cltrDivNm) (부동산|동산|자동차 중 입력)'
team:
  dept: 디지털시스템실
