description_portal: 정선군시설관리공단이 관리운영하는 주요 관광지 12개소에 관한 최근 3개년(2023년~2025년) 연도별 이용객 수 현황입니다.본 데이터는 관광시설(화암동굴, 화암동굴 모노레일, 화암카트체험장, 벅스랜드, 가리왕산케이블카, 타임캡슐공원), 휴양캠핑시설(화암약수, 도사곡휴양림, 회동솔향캠핑장, 생태체험학습장 펫 캠핑장), 체험시설(정선목재문화체험장) 등 시설 유형별 방문객 집계자료를 포함하고 있습니다.이용객 수는 각 시설의 임장권 발권자료, 예약시스템, 현장 집계자료를 기준으로 연간 합산한 수치이며, 중복 방문은 각 1인으로 산정됩니다.본 자료는 관광수요 분석, 지역경제 영향 분석, 시설 운영 효율성 진단 등 관광정책 수립 및 ai 기반 관광수요 예측모델 개발 등의 기초자료로 활용될 수 있습니다.
