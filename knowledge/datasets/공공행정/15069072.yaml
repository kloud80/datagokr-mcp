description_portal: 남양주시 개별주택 조사대상 현황 데이터로 동리별로 단독, 다가구, 다중, 주상용, 기타 등의 항목과 건수를 제공합니다.개별주택가격을 산정하기 위해 조사하는 대상 주택 목록의 상세 정보입니다.주택 가격 공시제도의 근간을 이루며, 부동산 세금 부과 및 도시 계획의 기초 자료로 활용됩니다.매년 개별주택가격을 산정하고 공시하는 기초 자료가 되며, 이는 재산세, 종합부동산세, 취득세, 상속세 등의 과세 표준으로 사용됩니다. 데이터의 정확성은 조세 형평성 확보에 필수적입니다.공시가격의 시장가치 반영률(현실화율)을 높이는 정책을 추진할 때, 주택별 물리적 특성을 고려하여 가격 조사 대상을 정밀하게 관리하는 데 사용됩니다.
