description_portal: '제주특별자치도 내 온천지구 이용 현황과 관련한 데이터를 제공합니다.항목: 지구명, 온천공위치(공수), 이용시설위치, 허가(지정)일, 성분, 온도, 심도 등*지하로부터 솟아나는 섭씨 25도 이상의 원수로서 성분기준에 적합한 것 [온천법 제2조 제1호]*다음의 성분 기준을 모두 갖춘 경우로서 음용 또는 목욕용으로 사용되어도 인체에 해롭지 아니한 것 [온천법 시행령 제2조] ① 질산성질소는 10㎎/L 이하일 것 ② 테트라클로로에틸렌은 0.01㎎/L이하일 것 ③ 트리클로로에틸렌은 0.03㎎/L이하일 것 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=2219'
