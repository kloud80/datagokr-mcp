description_portal: 본 데이터는 서울특별시 구로구에서 운영하는 영유아 장난감 대여 시설 ‘장난감나라’의 지점별 정보를 제공합니다. 장난감나라는 양육 가정의 부담을 줄이고 놀이 환경을 돕기 위한 공공서비스입니다. 데이터는 지점명, 주소, 전화번호, 운영 시간, 휴관일, 대여 대상, 가입 방법, 보유 장난감 수량 등으로 구성됩니다. 이용자께서는 자료를 통해 가까운 지점을 찾고 운영 일정을 확인하실 수 있습니다. 정책 담당자와 연구자께서는 시설 분포를 분석해 육아 정책에 활용하실 수 있습니다. 표 형식의 데이터는 구로구청에서 정기적으로 갱신하며 최신 정보를 제공합니다.
