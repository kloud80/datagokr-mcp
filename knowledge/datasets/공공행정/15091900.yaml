summary_user: 대규모기업집단에 지정된 소속회사별 주주 현황을 주주 단위로 담은 조회 API로, 주주구분·주주명·보통주/우선주 수와 지분율을 제공하며 검증 시 전체 44건을 모두 받았다. 투자자나 언론이 "이 기업집단 계열사의 지분은 누가 얼마나 갖고 있나"를 확인할 때 쓴다. 사업자등록번호(bizrno, 키 bizno)로 같은 공정위 등록·지정·공시 체인의 다른 데이터와 이어 쓰며, 사업자·법인등록번호로 묶인다는 점이 기업집단 데이터 연계의 기준이다.
limits: 포털 설명상 당해년도 정보는 5월 1일 기준으로 공개되므로 호출 전에 사용 가능한 공개년월 조회 API(publicYmList)로 요청 가능한 년월을 확인해야 한다. 집계가 아닌 주주 단위 현황이며, 하도급 실태조사·상담통계·기업결합 같은 집계나 결정문·리콜 같은 사건·문서 데이터와는 직접 연계되지 않는다.
