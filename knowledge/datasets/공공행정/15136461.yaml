description_portal: '해양수산연수원이 운영 중인 공식 홈페이지(seaman.or.kr)에 등록된 홍보용 배너와 링크 정보를 수록한 목록입니다. 해당 자료는 총 72개 항목으로 구성되어 있으며, 각 배너의 제목, 연결 링크, 관련 설명 등을 포함하고 있습니다. ‘나에게 필요한 공공서비스’, ‘청렴도 측정 결과’, ‘안전한 대한민국 만들기’와 같은 캠페인 및 공공 정보 안내 배너들이 포함되어 있으며, 공공기관의 온라인 홍보 전략과 정보 전달 체계 분석에 활용할 수 있는 데이터입니다. 링크 유효성, 등록 주체, 목적 등을 기준으로 분류 및 관리되고 있습니다. 공란 설명  > 내용 : 홍보,배너 시 내용은 포함하지 않고 프로모션명과 링크만 연결했던 경우가 있기에 데이터가 없을 수 있습니다. > 시작일과 종료일 : 일시적인 배너가 아닌 경우 데이터가 없을 수 있습니다.'
