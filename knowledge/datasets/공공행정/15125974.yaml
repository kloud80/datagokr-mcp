summary_user: 국회입법조사처가 펴낸 외국입법·정책 분석 연구보고서를 보고서 한 건 단위로 담으며, 보고서명(BOOKNM), 구분, 등록일, PDF 파일과 뷰어 주소를 함께 제공하는 전국 범위의 비공간 목록이다. 연구자·입법 실무자가 특정 국가의 제도나 정책을 다룬 국회입법조사처 분석 보고서가 있는지 찾아 원문 PDF를 바로 내려받을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 국회 의정활동 데이터와는 보고서명·구분명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
