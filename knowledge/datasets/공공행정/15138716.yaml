summary_user: 전국 지방자치단체가 부과한 지방세 중 실제로 걷힌 금액을 회계연도(fyr)와 자치단체 단위로 정리한 집계 지표로, 여러 금액 항목과 비율(rate)이 함께 들어 있습니다. 분석가나 주민이 "우리 시·군·구의 지방세 징수 실적이 다른 자치단체보다 낮은가, 체납 문제가 있는가"처럼 세수 확보능력을 비교하는 데 씁니다. 전역 조인 키는 없어서, 자치단체 코드(laf_cd)나 자치단체명을 매핑하여 같은 지방재정365의 다른 공시 데이터(세출 세부사업 등)와 연결합니다.
description_portal: 지방세 징수실적은 지방자치단체가 부과한 지방세 중 실제로 징수된 금액을 나타내는 지표입니다. 이는 지방자치단체의 세수 확보능력을 평가하는 중요한 기준으로, 징수 실적이 높으묜 해당 지방자치단체가 세금을 잘 징수하고 있다는 것을 의미합니다. 반대로 징수 실적이 낮으면 체납이 많거나 징수 과정에 문제가 있을 가능성이 있으며, 이는 지방정부의 재정 안정성에 부정적인 영향을 미칠 수 있습니다.징수실적은 지방세 부과 후 실제 세금을 납부한 금액을 기반으로 하므로, 세무관리의 효율성을 판단할 수 있는 중요한 지표입니다.
