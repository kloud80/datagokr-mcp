summary_user: 서울 주요 120개 장소별 실시간 인구 현황(영문)을 장소 1곳 단위로 담으며, 혼잡도 단계와 안내 문구, 추정 인구 범위(최소·최대), 성별·연령대·거주/비거주 비율, 인구 예측값을 함께 준다. 지금 광화문·덕수궁 같은 장소가 얼마나 붐비는지 확인하려는 시민·관광객, 그리고 장소별 방문 인구 구성을 보려는 분석가가 쓴다. 전역 조인 키는 없어서 장소명(AREA_NM)이나 장소코드(AREA_CD)를 서울시가 제공하는 120장소 목록 또는 같은 기관의 실시간 도시데이터와 이름·코드로 맞춰 잇는다.
description_portal: 서울시 실시간 인구데이터는 실시간 인구현황 정보(영문)를 제공합니다.※ 서울시 주요 120장소에 대한 실시간 도시데이터 중, 실시간 인구 항목만 제공하는 데이터입니다.※ 서울 주요 120장소 목록은 아래 '120 service locations code list.xlsx' 파일에서 확인 가능합니다.※ 샘플key를 통해서는 주요 120장소 중 '광화문·덕수궁' 지역만 조회 가능합니다. 나머지 지역을 조회하기 위해서는 인증키를 발급받아 주시기 바랍니다.※ 서울시 실시간 인구데이터 API는 한 번에 1개 장소씩만 호출 가능합니다.※ 장소명 OR 장소코드 중 택1 하여 호출이 가능합니다.
