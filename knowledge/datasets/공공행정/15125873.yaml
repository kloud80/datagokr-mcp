summary_user: 국회예산정책처(NABO)가 낸 경제전망 간행물을 한 건씩 담은 목록으로, 등록일·담당 부서·분류·제목·원문 링크·첨부파일명을 제공하며 범위는 전국·비공간이다. 분석가나 기자가 NABO가 언제 어떤 경제전망 보고서를 냈는지 찾아 원문을 내려받을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·부서명 같은 이름 매핑이나 같은 기관의 다른 간행물 목록과 맞춰서만 이어 쓴다.
