description_portal: 한국서부발전은 안정적인 전력 공급을 위해 사업소별 비즈니스연속성경영시스템(BCMS) 인증을 추진하고 있습니다. 각 사업소는 ISO 22301 등 국제적으로 인정받는 인증 규격을 바탕으로 자체적인 기준을 설정, 운영 중입니다.인증 현황을 살펴보면, 사업소마다 각기 다른 인증 규격과 기준을 적용하고 있으며, 유효기간 또한 다양하게 설정되어 있습니다. 이는 각 사업소의 특성과 위험 요소를 고려한 결과로 이해할 수 있습니다.제공되는 데이터는 사업소별 인증규격, 인증기준, 유효기간시작일, 유효기간종료일의 항목으로 구성됩니다.
