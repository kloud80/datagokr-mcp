summary_user: 가맹본부별로 기준년도에 신고된 인수합병 내역(인수합병 여부, 상대 기업명·영업표지(브랜드)명, 인수합병일자, 상대 기업 주소·대표자명)을 건별로 담으며, 범위는 전국이다. 가맹 창업 예정자나 분석가가 "이 가맹본부가 다른 회사와 인수합병된 적이 있고, 그 상대 기업과 브랜드는 무엇인가"를 확인할 때 쓴다. 실측 컬럼에는 사업자등록번호 같은 전역 조인 키가 없어서, 같은 기관 가맹정보 데이터와는 가맹본부관리번호(jnghdqrtrsMnno)와 기준년도로 잇고, 그 밖의 데이터와는 기업명·브랜드명 매핑으로만 잇는다.
limits: 사업자등록번호·법인등록번호가 응답에 없어 다른 기관 사업자 데이터와 키로 바로 붙일 수 없고, 이름 매칭에 의존해야 한다. 조회할 때 기준년도와 가맹본부관리번호가 필요하므로, 관리번호는 다른 가맹정보 API에서 먼저 얻어야 한다. 개발계정 호출 한도는 하루 10,000회다.
