description_portal: '강원특별자치도 강릉시 관내 지정 문화재 현황을 제공하는 데이터로, 각 문화재에 대해 기본 식별정보, 위치정보, 지정정보를 함께 제공합니다.주요 항목은 다음과 같습니다.번호: 강릉시 문화재 목록 내에서 각 문화재를 구분하기 위한 일련번호종별: 문화재의 종류·분류(예: 국보, 보물, 도지정문화재, 유형문화재, 무형문화재 등)지정번호: 관계 법령 및 지정 고시에 따라 부여된 공식 문화재 지정번호명칭: 문화재의 정식 명칭소재지: 문화재가 위치한 주소(읍·면·동 및 도로명 등 일반 주소)지번주소: 지번 기준의 상세 주소(대지·필지 단위 정보)위도, 경도: 문화재 위치를 나타내는 좌표 정보(위·경도, 지도/GIS 연계용)지정일자: 해당 문화재가 지정된 날짜(YYYY-MM-DD 형식)비고: 문화재에 대한 추가 설명, 관리 특이사항, 지정 사유 요약 등 자유기술형 메모데이터기준일자: 문화재 현황 정보가 갱신·확인된 기준 일자(YYYY-MM-DD)이 데이터는 강릉시 문화재를 종별–지정번호–명칭–주소–좌표 기준으로 통합 관리할 수 있도록 구조화되어 있어,지도(GIS) 기반 문화재 분포 현황 시각화문화재 인근 개발·공사 시 영향 검토 및 인허가 참고자료문화재 보호구역 관리, 안전점검·정비 계획 수립문화관광 코스 설계, 문화유산 교육·홍보 자료 구축등에 활용할 수 있는 강릉시 문화재 관리 및 활용용 공공데이터입니다.'
