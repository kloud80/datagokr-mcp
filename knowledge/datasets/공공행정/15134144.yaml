description_portal: 양평군 관내 인구 현황 데이터는 매월 말 기준으로 읍·면별 내국인 및 등록외국인 인구수를 성별로 구분하여 제공하는 통계 자료입니다.각 지역의 세대수, 전체 인구수 변화뿐만 아니라 전년도 말 및 전월 대비 인구 증감 현황도 함께 포함되어 있어 지역 인구 흐름을 분석하는 데 활용할 수 있습니다. 또한 매월 동일 기준으로 작성되어 시간에 따른 인구 구조의 변화를 비교·모니터링하기에 적합합니다.* 내국인 인구는 행정안전부, 주민등록시스템 에서 등록외국인 인구는 법무부, 외국인정보공동이용시스템에서 추출
