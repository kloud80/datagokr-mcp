summary_user: 헌법재판소가 선고한 결정례를 건별로 담은 목록으로, 사건번호·사건명·종국일자·결정례 일련번호와 상세 링크를 전국 범위(비공간)로 제공한다. 법률 실무자나 일반인이 '특정 사건번호나 종국일자 기준으로 어떤 헌재 결정이 나왔는지'를 찾아 상세 결정문으로 넘어가는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 사건번호·사건명 같은 이름 매핑이나 결정례 일련번호(헌재결정례일련번호)로 같은 기관의 헌재결정례 본문 조회와 이어 쓴다.
description_portal: 법제처에서 제공하는 모바일 헌재결정례 목록 조회 데이터는 헌법재판소가 선고한 다양한 결정례의 주요 정보를 모바일 환경에서 확인할 수 있도록 구성되어 있습니다. 이 데이터는 사건번호, 선고일자, 심판유형, 결정요지, 재판부 등의 항목을 포함하며, 헌법재판 관련 사건의 개요를 체계적으로 제공합니다. 사용자는 특정 사건이나 날짜를 기준으로 원하는 결정례를 효율적으로 검색할 수 있으며, 모바일 기기에 적합한 형태로 제공됩니다. 본 데이터는 법률 전문가 및 일반인 모두가 헌법재판소의 결정 내용을 신속히 이해하고 활용할 수 있도록 지원합니다.
