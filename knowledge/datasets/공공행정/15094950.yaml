description_portal: '○ 통계개요* 통계명 : 시내주요기관(기타)* 통계종류 : 서울시내 자치구별 기타기관 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시내 기타기관 현황을 파악하여 대국민서비스 강화와 국민의 삶의질향상을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구ㆍ해당기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 해당기관내용 - 자치구별 기타기관(보훈청, 교육청, 우체국 관서 등)의 개소수 등○ 용어설명○ 기 타* 우체국 관서에 우편취급소 포함* 전화국에 과천전화국 포함* 방송사는 지상파 방송 및 라디오 방송사* 신문사는 일간신문사 중 경제일간신문, 외국어일간신문, 전국일간신문 등 주요 종합일간신문 기준* 기관명칭변경 : 농업기반공사(2000) → 한국농촌공사(2005) → 한국농어촌공사(2008)○ 출 처 : 각 기관, 서울특별시 스마트도시담당관'
