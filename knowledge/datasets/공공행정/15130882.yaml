summary_user: 경기도 「경기민원24」에 등록된 민원행정서비스를 서비스 한 건당 한 행으로 담은 목록이다. 서비스명·담당기관명·게시 여부·서비스 내용·등록 일시·사업 유형이 들어 있다. 분석가가 "경기도에서 어떤 기관이 어떤 유형의 민원 서비스를 몇 개나 운영하는가"를 파악하거나 민원제도 현황 기초자료를 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 담당기관명 같은 이름 매핑이나 같은 기관 코드(법인단체코드, corp_grp_cd)로만 잇는다.
description_portal: 이 데이터는 경기도가 운영하는 「경기민원24」 시스템에 등록된 민원행정서비스의 기본 정보를 요약하여 제공합니다. 각 민원 서비스는 서비스 일련번호, 명칭, 담당자 식별 번호, 담당기관명, 법인단체코드, 게시 여부, 서비스 내용, 등록자 번호, 등록 일시, 사업 유형 등으로 구성되어 있으며, 서비스 제공기관의 행정처리 구조와 정보를 체계적으로 확인할 수 있습니다. 이 데이터는 전체 민원 서비스를 정리한 메타 수준의 정보로, 민원제도 파악, 행정업무 효율화 분석, 관련 정책 기초자료로 활용할 수 있습니다.
