summary_user: 국회 전원위원회의 회의 일정을 회의 건별로 담으며, 대수(UNIT_NM), 회의일자·시간, 회기·차수, 회의 제목, 관련 링크와 계획·결과 파일 다운로드 주소가 들어 있다. 국민이나 의정 분석가가 '언제 어떤 안건으로 전원위원회가 열렸고 결과 자료는 어디서 받나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 대수 코드(UNIT_CD)·회기·차수나 회의 제목을 이름 매칭해 같은 기관의 의안·회의록 데이터와 이어 쓴다.
description_portal: 국회 의정활동 정보는 국회가 보유·관리하는 각종 정보와 국회 회의록을 체계적·효과적으로 등록·공개·제공을 통해 국민의 알권리 및 국회 정보 이용권을 보장하기 위한 정보입니다
