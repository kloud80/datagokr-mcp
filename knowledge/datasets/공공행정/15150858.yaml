summary_user: 경기도 3D 스마트화재감시시스템의 기반정보로, 건물 단위 도로명주소(도로명·건물본번·부번·건물명)와 법정동·행정동·지번·우편번호·공동주택 여부·사용 여부를 한 행씩 담은 주소 원장이다. 소방·방재 분석가가 '이 건물의 도로명주소에 해당하는 행정동·지번·우편번호는 무엇인가'처럼 화재감시 대상 건물의 위치를 행정구역과 맞춰 보는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 데이터와는 도로명주소코드·법정동코드·행정동코드 같은 코드 값이나 주소 문자열을 매칭해 잇는다.
description_portal: 이 데이터는 3D 스마트화재감시시스템 구축을 위한 기반정보로, 도로명주소를 중심으로 위치 정보를 제공합니다. 주요 항목으로는 도로명주소코드, 법정동번호, 시군구명, 건물본번 및 부번, 건물명, 공동주택 여부, 사용여부, 최종수정일시 등이 있으며, 이를 통해 주소 기반의 공간정보를 체계적으로 파악할 수 있습니다. 각 건물의 도로명주소와 행정동, 지번주소, 우편번호 등의 정보가 포함되어 있어 지리정보시스템(GIS), 도시계획, 방재시스템 구축, 소방행정 서비스에 활용될 수 있습니다. 데이터는 도로명주소와 관련된 행정구역 구분을 정보를 제공하고 있습니다.
