summary_user: 광주광역시 2026년도 민방위대 편성 현황을 시·도와 시·군·구(자치구) 단위로 집계한 파일로, 통리대 수와 규모별 분포, 비상급수·장비관리 분대, 대원 수와 연령·연차별 인원, 의무·지원대원, 편성제외자 수를 담는다. 자치구 재난안전 담당자나 분석가가 '어느 자치구의 민방위 대원 수와 편성제외 비율이 상대적으로 높고, 비상급수 분대는 어떻게 배치돼 있는가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시·군·구 이름을 매핑해 자치구별 인구·재난 통계 등과 이어 써야 한다.
description_portal: 광주광역시 2026년도 민방위대 편성현황에 대한 데이터를 제공함으로써, 자치구별로 구성된 통리대, 기술지원대, 직장민방위대, 지원민방위대 등 다양한 유형의 민방위 조직 현황을 체계적으로 파악할 수 있도록 하고, 각 민방위대의 인원 규모, 구성 특성, 주요 역할 및 운영 실태 등에 관한 종합적인 정보를 제공하는 것을 목적으로 한다.또한 본 데이터는 자치구별 민방위대의 분포와 편성 구조를 비교·분석할 수 있는 기반을 마련하여, 지역 간 대응 역량의 균형 여부를 진단하고 취약 요소를 식별하는 데 기여한다. 이를 통해 재난 및 비상사태 발생 시 보다 신속하고 효율적인 대응 체계를 구축할 수 있도록 지원하며, 민방위 자원의 효율적 배분과 운영 개선을 위한 정책 수립의 기초자료로 활용될 수 있다.아울러 공공데이터 개방을 통해 행정의 투명성과 신뢰성을 제고하고, 연구기관, 민간기업 및 시민이 해당 데이터를 다양한 형태로 활용할 수 있도록 함으로써 재난안전 분야의 데이터 기반 의사결정과 민관 협력 활성화에도 기여하고자 한다.
