description_portal: ‘대통령 지시사항 기록’ 콘텐츠는 역대 대통령의 『의명지시사항』, 『각하 지시사항』, 『의명지시 공문서』, 『대통령 지시사항』 등의 기록물을 참고하여 대통령별 · 분야별 · 일자별 · 지시명, 지시계기, 주관기관 등을 데이터화하여 DB형태로 구축하고, 원문이미지와 함께 제공하는 메뉴입니다. 대통령기록관이 소장하고 있는 대통령 지시사항 관련 기록물은 약 6,000여 건이며 이승만 대통령부터 박근혜 대통령까지 비교적 고르게 분포되어 있습니다. 윤보선・최규하 대통령은 재임기간이 짧아 지시사항 관련 기록이 없거나 소량 존재합니다. 대부분의 지시사항은 공개 또는 부분공개이지만, 일부 지시사항은 비공개로 관리되고 있습니다.
