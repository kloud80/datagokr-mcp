summary_user: 세종특별자치시 대형마트에서 거래되는 농축수산물의 품종·품목·거래 단위별 판매가격을 조치원·중촌동·어진동·가람동 등 지역별 대형마트 가격 열(ntslAmt1~4)로 나누어 담은 시 단위 물가 조회 API입니다. 세종시 주민이나 분석가가 "같은 품목이 조치원과 신도심(중촌·어진·가람동) 대형마트 중 어디서 더 싼가"처럼 지역 간 장바구니 가격을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 물가·시장 데이터와는 품목명·단위 문자열을 맞추는 방식으로만 이어 쓴다.
limits: 품목 코드나 지역 코드 같은 공통 키가 없어 다른 기관 물가 데이터와 기계적으로 결합하기 어렵다. 범위가 세종시 한 곳이고 공간 좌표가 없는 비공간 데이터라 지도 분석이나 타 시도 비교에는 맞지 않는다. 필드 명세에 의미 설명이 비어 있어 가격 열 4개가 어느 지역 마트인지는 포털 설명 순서를 근거로 추정해야 한다.
