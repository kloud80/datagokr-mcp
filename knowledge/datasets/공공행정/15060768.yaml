description_portal: 본 데이터는 인천광역시 미추홀구 내 축산물 관련 판매업소의 현황을 정리한 공공데이터입니다. 2025년 6월 18일을 기준으로 하여 축산물운반업, 식육즉석판매가공업, 식육판매업, 축산물유통전문판매업, 식육부산물판매업, 식용란수집판매업, 우유류판매업, 식육포장처리업 등의 현황을 현행화하였습니다. 2024년과 비교해보았을 때 신규 등록건은 약 40건에 해당하며 폐업건은 약 8건에 해당합니다. 데이터에는 업소의 판매업 구분, 사업장명칭, 영업상태, 지번 및 도로명 주소 정보가 포함되어 있어 업소 유형별 현황 파악과 공간적 분포 분석에 용이합니다. 정상 영업 여부와 함께 도로명주소가 병기되어 있어 실질적인 행정 활용도와 대민 서비스 전달력이 높습니다. 본 자료는 식품위생 관리, 업소 지도 제작, 허가관리 및 위생 점검 대상 선정 등의 정책 수립과 민원 대응에 활용될 수 있습니다.
