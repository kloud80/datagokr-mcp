summary_user: 경기도 양주시에 신고된 행정사 사무소를 한 곳씩 담은 건별 목록으로, 행정사 종류·자격증번호·상호명·신고일자·운영상태·도로명 소재지 주소·관리기관을 포함한다. 시민이 양주시에서 인허가나 민원서류 작성을 맡길 수 있는 영업 중인 행정사 사무소를 찾을 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명이나 도로명주소 같은 이름·주소 매칭으로만 이어 쓴다.
description_portal: 경기도 양주시 행정사 현황에 관한 데이터로 상호명, 신고일자, 소재지 주소, 전화번호, 관리기관, 관리기관 전화번호 등의 내용을 포함하고 있습니다.시민들이 각종 인허가, 민원서류 대행 등 행정 서비스를 쉽게 이용할 수 있도록 돕습니다.정보 접근성을 높여 사설 브로커 이용을 줄이고, 행정 투명성을 강화합니다.공공데이터를 통해 시민의 권익 보호와 민원처리의 공정성을 제고합니다.
