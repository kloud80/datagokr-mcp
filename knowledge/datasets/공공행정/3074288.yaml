summary_user: 서울 관악구 안 주민센터와 자치회관의 건축 현황을 시설 한 곳당 한 행으로 담은 파일(약 3KB)이며, 동명·시설 구분·도로명/지번 주소·준공일·연면적·층수·엘리베이터 유무를 포함한다. 주민이나 분석가가 '우리 동 주민센터는 언제 지어졌고 엘리베이터가 있는가', '노후·저층 행정시설이 어느 동에 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 동명이나 도로명주소를 문자열로 맞춰 행정동 경계·건축물대장 등과 이어 쓴다.
description_portal: 본 데이터는 서울특별시 관악구 내 주민센터 및 자치회관의 건축 현황을 정리한 자료로, 동명, 시설 구분, 도로명·지번 주소, 준공일, 연면적, 층수, 엘리베이터 설치 여부, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 각 행정시설의 위치, 규모, 건축 시기, 편의시설 현황 등을 체계적으로 파악할 수 있으며, 시설별 기본정보 비교, 공공건축물 관리대장 정비, 생활SOC 현황 조사, 행정서비스 접근성 분석 등 행정업무 전반에서 기초자료로 활용할 수 있습니다. 또한 지역별 공공시설의 분포와 건축 특성을 정리함으로써 공간계획과 시설 운영에 필요한 정보를 시민·연구자·행정기관이 손쉽게 확인할 수 있는 기반을 제공합니다.
