description_portal: '한국소비자원에서 제공하는 품목별 소비자상담 표준답변 자료로 품목명, 질문, 표준답변 등의 정보를 포함하고 있습니다.(50개 품목 및 6개 법령 관련 총 1,332개 답변)소비자상담은 사업자가 제공하는 물품(용역)을 소비생활을 위하여 사용하거나 이용하는 과정에서 발생한 소비자의 불만 및 피해에 대하여 1372소비자상담센터*가 제공하는 상담을 의미합니다.* 1372소비자상담센터 : 공정거래위원회가 운영하고 한국소비자단체협의회, 한국소비자원, 광역지자체가 참여하여 상담을 수행하는 전국 단위 소비자 상담 통합 콜센터(발신자부담)※ 주의 : 답변 데이터는 답변 일자의 법령이나 판례, 조정례 등에 의거한 것으로 변동사항이 발생할 수 있기 때문에 구체적인 사안에 대해서는 반드시 1372소비자상담센터(국번 없이 1372)를 통해 다시 한 번 확인하시기 바랍니다.'
