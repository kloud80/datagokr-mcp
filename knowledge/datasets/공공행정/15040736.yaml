description_portal: 모두가 편안한 무장애도시 진주시를 만들기 위하여 BF인증 제도를 적극 활용하고 있습니다.  진주시 무장애도시 홈페이지에서 사용하는 시설정보(BF인증시설 현황자료(2025.9.25.기준)에 대한 정보 총 54건을 제공합니다.  진주시 BF인증시설은  본인증을 받은  기관임.  예비인증을 받은 시설은 명단에서 제외함.(본인증 시 명단에 기재할 예정임.) 예비인증과 본인증과 다르며,  예비인증의 단계를 거쳐 최종적으로 본인증의 단계가 되면 해당자료에 등록됨.  해당 자료는 본인증을 받은 기관까지 알리고 있음.
