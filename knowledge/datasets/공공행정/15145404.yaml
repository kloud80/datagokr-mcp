description_portal: 메타관리시스템 기반 중장기(2023~25년) 개방계획의 2025년 개방계획에 따라 개방한 광주광역시 북구 GIS 기반 빅데이터 플랫폼에 등록된 지리 데이터 4대주요상권 정보입니다.광주광역시 북구에 위치한 4대 주요상권의 각 구역별 고유아이디, 아이디, 주소, 가게수, 지오로케이션 항목에 대한 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.해당 공공데이터에서 구분한 상권의 각 구역은 GIS 기반 빅데이터 플랫폼에서 시각화 구현을 위해 분할한 구획으로, 시스템 내에서만 사용되는 구분입니다.
