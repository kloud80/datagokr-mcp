description_portal: '세종특별자치시시설관리공단은 화장시설 이용을 신청한 내역을 투명하게 공개하고, 시민이 화장 절차의 진행 상황을 쉽게 확인할 수 있도록 화장 접수 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 화장 일정, 비용, 화로 배정 정보 등 주요 접수 내역을 포함하여 화장시설 운영의 효율성과 신뢰성을 높이기 위한 기초 자료로 활용됩니다.■ 데이터 컬럼 구성화장일자 - 화장이 실제로 이루어지는 날짜화장순번 - 화장이 처리되는 순번유해구분 - 화장 대상의 구분    예: 시신, 개장유골, 사산아 등예약일자 - 해당 화장 건이 예약된 날짜화장비용 - 해당 화장 건에 부과된 비용화로번호 - 해당 건이 배정된 화로(화장로) 번호■ 데이터 제공 목적화장 접수 데이터는 다음과 같은 목적을 위해 제공됩니다. - 화장 접수 및 처리 현황의 투명한 공개 - 화장 일정 및 화로 배정 운영의 효율성 강화 - 유해 구분·비용·예약일자 등 주요 항목의 통계 분석 지원 - 시민의 정보 접근성 향상 및 민원 대응 품질 개선 - 화장시설 운영 정책 수립 및 수요 예측 자료로 활용세종특별자치시시설관리공단은 앞으로도 정확하고 신뢰할 수 있는 화장시설 정보를 지속적으로 제공하여, 시민 중심의 장사행정을 실현해 나가겠습니다.'
