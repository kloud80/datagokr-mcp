summary_user: 대한민국이 체결하거나 가입한 조약을 한 건씩 담은 목록으로, 조약명·서명일자·발효일자·조약번호·양자/다자 등 조약 구분·상대 국가 번호·상세 링크를 전국 범위의 비공간 데이터로 담는다. 법률 실무자나 연구자가 "특정 국가와 맺은 조약이 언제 서명되고 발효됐는가"를 확인하거나 조약 체결 이력을 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 조약일련번호·조약상세링크로 같은 법제처 조약 본문 조회와 잇거나 국가번호·조약명을 이름·코드 매핑으로 다른 데이터에 붙여 쓴다.
description_portal: 본 데이터는 대한민국이 체결하거나 가입한 조약에 대한 목록 정보를 제공합니다. 각 조약별로 조약명, 체결일자, 발효일자, 비준일자, 체결국가 및 조약종류 등의 항목이 포함되어 있습니다. 또한 조약의 법적 효력 구분, 공포일자, 공포번호, 등록번호 등 관련 정보가 함께 수록되어 있어 조약의 입법적 지위와 행정적 이력을 확인할 수 있습니다. 데이터는 다수의 국제 조약 및 양자 간 또는 다자 간 협정에 대해 구조화된 형태로 제공되며, 각 조약의 성격과 적용범위를 체계적으로 파악할 수 있도록 구성되어 있습니다. 해당 정보는 조약의 법적 유효성과 국제적 협력 관계 분석, 관련 법률 적용 시 기초 자료로 활용됩니다.
