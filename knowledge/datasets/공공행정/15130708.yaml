summary_user: 경상남도 거제시에 설치된 무인민원발급기를 한 대씩 기록한 시설 목록으로, 발급기명·도로명/지번주소·위도·경도·상세위치·이용시간·도입연도와 가족관계·등기부 발급 여부, 365코너·주말 운영 여부를 담는다(CSV 약 8KB, 시군구 범위). 거제 시민이 '주말이나 밤에 등기부등본을 뽑을 수 있는 가까운 발급기가 어디인가'를 찾거나, 분석가가 발급기 분포와 운영시간을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 위치를 맞춰 잇거나, 다른 지자체의 무인민원발급기 표준데이터와 항목 이름을 맞춰 합쳐 쓴다.
limits: 공통 코드나 기관 코드 같은 조인 키가 없어 다른 데이터와 붙일 때는 주소·좌표·이름 매칭에 기대야 한다. 범위는 거제시 한 곳이며, 발급 건수 같은 이용 실적은 담지 않는다.
