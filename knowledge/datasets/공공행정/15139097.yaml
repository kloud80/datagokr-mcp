description_portal: 본 데이터는 경기도 양평군이 각 부서별 행정성과를 체계적으로 관리하고, 정책 추진의 효과성을 객관적으로 측정하기 위해 구축한 성과관리 시행계획 기반 성과지표 현황 자료이다. 양평군은 군정 비전과 분야별 중장기 종합계획을 중심으로 매년 다음 연도의 성과관리 시행계획을 수립하며, 모든 부서는 해당 계획을 매년 10월 말까지 성과관리부서에 제출하도록 되어 있다. 이 계획은 단순 실행목록이 아니라, 향후사업의 방향성과 자원배분 원칙을 체계적으로 뒷받침하는 행정운영 근거로 활용되며, 특히 성과관리 지표는 예산과 성과가 연계되는 구조로 설계되어 정책효과의 실질적 검증을 가능하게 한다.성과지표는 부서의 임무와 전략목표를 기반으로 도출되며, 해당 부서가 연도별 성과목표를 달성하기 위해 수행해야 하는 핵심과제를 수치화한 평가기준을 포함하고 있다. 지표 설정 시 객관적·정량적 측정이 가능하도록 구성하는 것을 기본 방향으로 하고 있으며, 단위, 산식, 목표 수치 등의 요소가 함께 정의되어 정책효과를 명확하게 해석할 수 있도록 하고 있다. 특히 지표 도출 과정에서는 군정 방향, 주요업무 추진 항목, 민선 공약, 지시사항, 환경·안전·문화 등 부문별 정책사업, 그리고 지역대표 전략사업인 매력그린 프로젝트 등 군 전체 정책을 포괄적으로 반영하였다. 본 데이터는 각 부서별 성과지표를 ① 부서명 ② 성과지표명 ③ 부여된 가중치 ④ 산식 ⑤ 목표값 항목으로 제공하며, 지표별 가중치는 정책성과의 중요도 및 핵심정책 반영 수준을 수치화한 값으로, 성과평가·예산편성·정책관리 과정에서 활용된다. 사용자는 이 자료를 통해 부서별 정책성과의 방향성을 직접 확인할 수 있고, 군정 운영에서 어떤 지표가 우선순위를 갖는지 한눈에 파악할 수 있다. 본 데이터는 양평군 행정성과의 현주소를 명확히 이해할 수 있는 구조화된 지표자료이며, 정책실행 과정의 효율성과 책임성을 높이는 기반자료로 활용될 것으로 기대된다.
