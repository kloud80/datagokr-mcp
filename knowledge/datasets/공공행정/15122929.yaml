summary_user: 경기통계시스템에 수록된 통계표마다 조직번호·통계표ID별로 공표 주기(연간 등), 최초 수록시점, 최종변경일을 한 행씩 기록한 메타데이터로, 통계값 자체가 아니라 통계표의 주기·이력 정보를 담는다. 분석가가 '이 경기도 통계표는 몇 년부터 어떤 간격으로 공표되고 언제 마지막으로 바뀌었나'를 확인해 연구에 맞는 통계를 고르거나 시계열 연속성을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관 데이터인 경기통계시스템 기간정보(주기구분 뜻)나 통계표 목록과 통계표ID(sttbl_id)·조직번호 같은 기관 내부 코드로만 맞춰 쓴다.
description_portal: 이 데이터는 경기도 경기통계시스템에 수록된 통계자료들의 주기와 수록시점을 기록한 자료로, 통계자료의 시계열 연속성과 업데이트 이력을 파악할 수 있습니다. 주요 항목은 조직번호, 통계표ID, 주기구분, 수록시점, 최종변경일 등으로 구성되어 있으며, '주기구분'은 연간(Y) 등으로 표시되어 통계자료의 공표 간격을 나타냅니다. '수록시점'은 해당 통계표가 수록된 최초 연도, '최종변경일'은 데이터 구조나 값 변경 시점으로 활용됩니다. 이 데이터는 각 통계표의 생성·수정 흐름을 파악하거나, 정책·연구 목적에 적합한 통계자료 선택 시 활용되며, 통계 간 연계 시 시점 정합성 확보를 위한 기초정보로도 유용합니다.※주기구분 의미는  "경기도_경기통계시스템 기간정보" 데이터를 참고하여 주시기 바랍니다.
