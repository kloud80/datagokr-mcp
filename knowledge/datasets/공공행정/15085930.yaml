description_portal: 서울특별시 지역내총생산(GRDP) 통계를 기반으로 자치구별 1인당 지역내총생산 및 수준지수를 제공하는 자료이다. 자치구별 지역내총생산, 구성비, 인구(추계인구), 1인당 지역내총생산(천 원), 수준지수(서울시=100 기준) 등의 정보를 연도별로 제공한다. 지역내총생산은 일정 기간 동안 해당 지역에서 생산된 재화와 서비스의 부가가치를 나타내는 경제지표로, 지역 경제 규모와 생산성을 파악하는 데 활용된다. 본 자료는 자치구별 경제력 비교, 지역균형발전 정책 수립, 산업구조 분석, 투자유치 전략 마련, 도시계획 수립 및 경제활동 특성 연구를 위한 기초자료로 활용할 수 있으며, 지역 간 경제 격차와 성장 추이를 분석하는 데 유용하다.
