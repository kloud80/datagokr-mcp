summary_user: 서울시 지하수정화업체(지하수의 오염물질을 제거·분해·희석해 수질을 개선하는 업소)의 인허가 원장을 업소 단위로 담으며, 인허가일·취소일, 영업상태, 지번·도로명 주소, 중부원점TM 좌표, 자본금·시설장비 등을 포함한다. 지하수 오염 정화를 맡길 업체를 찾는 사업자나, 서울 안 정화업체의 영업·폐업 현황과 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·업소명 매칭이나 개방기관 코드(OGDP_INST_CD)로만 이어 쓰며, 원천이 같은 지방행정 인허가(LOCALDATA) 자료와 함께 본다.
description_portal: '해당 데이터는 지하수정화업체 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.지하수에 함유된 오염물질을 제거·분해 또는 희석하여 지하수의 수질을 개선하는 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
