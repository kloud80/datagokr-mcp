summary_user: 전북특별자치도가 소유한 건물 중 지리산·덕유산 등 국립공원 구역 안에 있는 도유재산을 건물 한 동씩 담은 파일(csv, 약 6KB)로, 공원명·소재지(시군·읍면·리동·지번)·용도·구조·건축면적·사용허가면적(무상·유상)·감정단가·평가액·대장가액·사용료를 담는다. 도 재산관리 담당자나 분석가가 '국립공원 안 도유 건물 중 유상으로 사용허가된 것은 어디이고 사용료와 평가액은 얼마인가' 같은 질문에 쓴다. 전역 조인 키는 없어 시군·읍면·리동·지번 같은 소재지 이름을 맞춰 토지대장·건축물대장이나 같은 기관의 공유재산 자료와 이어 쓴다.
description_portal: 전북특별자치도 소유의 건물 중 지리산, 덕유산 등 국립공원 구역 내에 포함된 도유재산(건물)의 상세 현황 데이터입니다. 이 자료는 각 건물의 공원 내 위치, 화장실이나 사무실 등 구체적인 용도, 건축 구조 및 면적, 그리고 자산으로서의 평가 가액 등 상세한 정보를 담고 있습니다. 이 데이터는 국립공원 내에 산재한 공공자산을 체계적으로 관리하고, 시설물의 노후도 파악 및 유지보수 계획을 수립하는 데 필수적인 기초 자료입니다. 또한, 탐방객 편의 시설의 현황을 파악하여 공공 서비스의 질을 높이는 등 효율적인 자산 관리 및 운영을 위한 중요한 정보를 제공합니다.
