description_portal: 창원시 빅데이터시스템의   민원통계분석용 긍정, 부정 등 키워드 목록입니다.  항목은 연번, 키워드, 구분(불용어, 긍정) 의 목록입니다. 민원통계분석은 다양한 민원 데이터를 유형별, 공간별, 시간대별로 분류하고 처리현황, 반복빈도, 반려율 등 행정 반응과의 관계를 분석하여 주민의 생활불편 요인을 파악하고 행정 효율성을 향상시키는 데 목적이 있습니다. 이 데이터는 민원 접수 경로, 발생 위치, 처리 기간, 민원인 특성 등 다양한 변수를 기반으로 활용되며, 이를 통해 주요 생활불편 사안의 빈도 및 분포를 파악하고, 민원이 집중되는 시기나 장소, 특정 유형의 민원 증가 패턴 등을 도출할 수 있습니다. 특히 지역 맞춤형 정책 수립, 행정서비스 개선, 반복 민원 예방 대책 수립, 민원 감축 전략 마련 등의 실무적 활용도가 높으며, 시계열 분석, GIS 기반 공간 시각화, 처리기관별 성과 비교 등 다양한 분석에 기반이 됩니다.
