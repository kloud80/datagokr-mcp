summary_user: 법제처 국가법령정보센터가 제공하는 식품의약품안전처 소관 법령에 대한 법령해석 사례를 건별 목록으로 담으며, 안건명·안건번호·해석일자·질의기관·해석기관과 상세 해석문 링크가 한 건씩 들어 있다. 식품·의약품 사업자나 법무 담당자가 "특정 식품 표시 기준에 대해 식약처가 과거에 어떻게 해석했는가"를 안건명이나 해석일자로 찾아볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 법령해석일련번호로 상세 해석문을 조회하거나 질의기관코드·해석기관코드 같은 기관 코드를 맞춰 다른 법령해석 목록과 이어 볼 수 있다.
description_portal: 법제처 국가법령정보센터에서 제공하는 식품의약품안전처 법령해석 데이터로, 법령해석에 대한 목록 정보를 조회하는 서비스입니다. 본 서비스는 식품의약품안전처 소관 법령 질의 및 해석 사례를 목록 형태로 제공하며, 해석일련번호, 안건명, 해석기관명, 해석일자 등의 기본 정보가 포함됩니다. 사용자는 안건번호, 해석일자 등의 조건 검색을 통해 필요한 해석 사례를 확인할 수 있으며, 각 항목은 링크를 통해 세부 해석문으로 연결됩니다. 본 데이터는 식품의약품안전처 법령해석의 체계적 관리와 일관된 법적 판단을 지원하기 위해 제공됩니다. 또한 법령해석 정보를 기반으로 한 검색·조회 서비스, 법령 기반 지식산업 개발, 자동화된 법률 정보 제공 도구 등 다양한 서비스 구현에 활용될 수 있습니다.
