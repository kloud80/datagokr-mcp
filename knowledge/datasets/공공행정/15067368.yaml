summary_user: 남양주시 의회 회의록 목록을 회의 한 건 단위로 담은 파일(CSV)로, 연도·대수·회기·차수·회의날짜·회의구분·회의명·안건유무 등을 담는다. 시민이나 지역 정책 분석가가 '특정 연도에 남양주시의회가 어떤 본회의·위원회를 몇 차례 열었고 안건이 있었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 회의날짜·회의명 같은 이름 매칭이나 같은 기관(남양주시) 기준으로만 이어 쓴다.
description_portal: 남양주시 의회 회의록 목록에 대한 데이터로 년도, 대수, 회수, 차수, 회의날짜, 회의구분, 회의명, 회의정보 등의 항목을 제공합니다.의회 회의의 전 과정을 속기 및 녹취하여 기록한 자료입니다. 이는 해당 의회의 활동, 결정, 논의 과정을 투명하게 공개하고 기록하는 핵심적인 공공 기록물입니다.정치적 투명성 확보, 정책 분석, 공공 기록 연구 등 민주주의 시스템의 핵심 요소를 이해하는 데 사용됩니다.정치적 투명성 및 책임성 강화, 정책 및 법률 제정 분석,지역 현안 분석, 연구 및 학술 활용등 다양하게 활용될 수 있습니다.
