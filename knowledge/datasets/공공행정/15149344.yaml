summary_user: 경기도국민안전체험관 홈페이지 콘텐츠관리시스템(CMS)에서 쓰는 이미지의 고유번호, 파일 경로, 순번, 링크 여부, 파일 유형 같은 속성을 이미지별로 기록한 운영 자료다. 체험관 홈페이지를 유지보수하거나 기관 웹 자원 현황을 점검하는 담당자가 "어떤 이미지가 어느 경로에 어떤 형식으로 올라가 있는가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 데이터와는 이미지 고유번호(image_idntfy_no)나 같은 기관의 다른 CMS 자료와 이름으로 맞춰 보는 정도로만 이을 수 있다.
description_portal: 이 데이터는 경기도국민안전체험관 홈페이지 콘텐츠관리시스템(CMS)에서 사용되는 이미지 정보를 기록한 자료로, 이미지 고유번호, 파일 경로, 순번, 링크 여부, 파일 유형 등의 항목을 포함하고 있습니다. 해당 데이터는 홈페이지 내 시각 자료를 체계적으로 관리하여 콘텐츠의 일관성과 접근성을 높이는 데 활용되며, 이미지 자원의 위치와 속성을 통해 웹 서비스 품질과 이용자 경험을 향상시키는 역할을 합니다. 또한 관리 시스템에서 이미지 변경이나 업데이트 시 참고 자료로 활용될 수 있어, 효율적인 홈페이지 운영과 유지보수에 기여합니다.
