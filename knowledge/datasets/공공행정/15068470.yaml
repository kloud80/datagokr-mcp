legal_basis_portal: 공공기관의 계약현황 데이터 보유 근거는 「국가계약법」 및 「지방계약법」과 같은 계약 관련 법령, 「전자정부법」에 따른 행정정보 관리 의무, 그리고 「공공기록물 관리에 관한 법률」에 따른 기록물 생성·보존 의무에 기반한다. 또한 「공공기관의 정보공개에 관한 법률」에 따라 계약 정보의 투명한 공개와 관리가 요구되며, 내부 규정인 계약업무 처리지침 및 회계규정 등에 따라 체계적으로 수집·관리된다
