description_portal: '데이터설명(항목명 반영 보완안)강원특별자치도 강릉시의 흡연단속 위반자에 대한 벌금(과태료) 감액·할인 기준을 관리하는 코드성 데이터입니다. 각 할인 유형을 코드로 체계화하여 단속 시스템, 민원 시스템 등에서 일관된 과태료 산정이 가능하도록 설계되어 있습니다.주요 항목은 다음과 같습니다.감액코드: 벌금 감액 유형을 식별하기 위한 고유 코드(시스템 상 연계·계산용 코드)할인명칭: 조기납부, 자진신고, 특정 캠페인 연계 할인 등 감액 사유를 사람이 알아보기 쉽게 표현한 명칭할인구분: 할인 방식 또는 구분(예: 정액감액, 정률감액, 1차 위반자, 캠페인 기간 한정 등 지자체 내부 기준에 따른 구분값)할인값: 감액 기준 값으로, 정책에 따라 감액 금액(원) 또는 감액 비율(%) 등을 표현이 데이터는 흡연단속 시스템에서 위반 유형·상황에 따른 실제 납부금액 자동 계산, 과태료 고지서 발부 시 감액 사유 표기, 감액 제도 변경 이력 관리 등에 활용할 수 있으며 흡연단속 관련 과태료 부과 기준의 투명성 확보, 조기 납부 유도 등 행정제재 정책 효과 분석, 시민 안내용 웹/모바일 서비스에서 “할인 조건별 예상 과태료 계산기” 구현 등에 활용 가능한 흡연단속 벌금 감액 기준 공공데이터입니다.'
