description_portal: 본 데이터는 경상남도 합천군 인구증가시책 지원 조례에 따라 지급한 출산장려금에 대한 내역을 제공합니다.해당 시책은 경상남도 합천군 출산율 저하 문제에 대응하기 위해 시행된 시책으로 일정 자격 요건을 충족한 가정에 출산장려금으로 지급된 현황에 관한 자료가 제공되고 있습니다.출산장려 상품권은 출산(입양)가정의 초기 양육비 부담을 경감하는 역할을 하고 있으며, 해당 데이터는 출생아 고유번호, 지급당시 출생순위, 지급연도 지급월, 지급일, 지급금액, 지급회차, 지급내역수정여부, 소급연도, 소급월, 행정동, 기존데이터구분, 만기연도, 만기월, 출산장려금 만기구분, 양육비지원금 만기구분, 학습비지원금 만기구분, 다자녀지원금 만기구분, 결혼장려금 만기여부, 만기지급회차, 만기지급금 지급당시 행정동 데이터를 포함합니다.
