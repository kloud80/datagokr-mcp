summary_user: 부산광역시 연제구가 국토부로부터 통보받아 관내에서 접수·관리하는 무보험 운행(자동차손해배상보장법 위반) 사건을 건별로 담은 파일(csv, 약 29KB)로, 관리연도·접수일자·위반일자·위반장소를 기록한다. 연제구 안에서 무보험 차량 운행 적발이 언제, 어느 장소에서 많이 일어나는지 살펴보려는 분석가나 행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위반장소 이름이나 날짜를 기준으로 맞추거나 같은 기관의 자료끼리만 연결할 수 있다.
description_portal: 자동차 의무보험 미가입 자동차(무보험 운행 자동차) 운행자는 자동차손해배상보장법 제8조 및 동법 제46조 제3항의 규정에 의하여 1년이하의 징역 또는 1천만원 이하의 벌금이나, 동법 제50조 및 제51조의 규정에 의한 범칙금이 통고됩니다. 해당 자료는 국토부에서  연제구로 통보되며, 관내에서 접수 및 관리하고 있는 자동차손해배상법위반 (무보험 운행) 사건 현황으로  관리연도, 접수일자, 위반일자, 위반장소를 포함한 관리현황입니다. 해당 자료는 공소시효에 따라 5년 동안 관리됩니다.
