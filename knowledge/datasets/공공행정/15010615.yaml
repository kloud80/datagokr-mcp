description_portal: '제주특별자치도 내 주민자치센터 운영시설현황 데이터를 제공합니다.항목: 전화번호, 주소, 주요시설현황, 개방시간*교통통신의 발달과 생활권의 확대 등으로 읍·면·동의 행정기능은 약화되어 작고 생산적인 지방 행정체제 구축의 필요하게 됨에 따라 읍·면·동사무소의 기능·인력을 축소하고, 여유공간에 주민의 자치의식 함양과 지역공동체 의식 향상을 제고하기 위하여 ’98년도부터 읍·면·동에 주민자치센터를 설치·운영하는『읍·면·동 기능전환』을 추진함 자세한 사항은 제주특별자치도 사이버주민자치센터 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jumin/present/jejusi/jeju01/greet.htm'
