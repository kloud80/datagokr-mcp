summary_user: 가맹 브랜드별로 가맹본부가 가격 결정을 제한하는 상품·용역의 이름, 권장가격, 가격을 알리는 방법을 기준년도와 브랜드관리번호 단위로 담은 전국 범위의 API다. 창업 예정자가 "이 브랜드는 어떤 메뉴나 상품의 판매가를 본부가 정하고, 권장가격은 얼마인가"를 가맹 계약 전에 확인하는 데 쓴다. 브랜드관리번호와 가맹본부관리번호(jnghdqrtrsMnno)로 같은 공정위 가맹정보 서비스(브랜드·가맹본부 정보)와 잇지만, 실측 컬럼에서 사업자등록번호 같은 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름 매핑으로만 연결된다.
limits: 사업자등록번호·법인등록번호 같은 전역 키가 응답에 없어 기업집단·특수판매 등 다른 공정위 체인이나 외부 데이터와 바로 묶을 수 없다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
