description_portal: 본 데이터는 한국중부발전이 추진한 대규모 신규투자 및 자본출자 사업에 대해 실시한 예비타당성 조사 현황을 정리한 자료입니다. 항목은 연도, 사업명, 전체사업비, 공공기관사업비, 중부사업비, 예비타당성결과로 구성되어 있으며, 사업비 단위는 억 원입니다. 예비타당성 조사는 총사업비 2,000억 원 이상, 그 중 국가재정지원 및 공공기관 부담금의 합이 1,000억 원 이상인 경우에 실시되며, 제출 시점을 기준으로 한 예산값이 반영됩니다. 이 데이터는 사업 추진의 경제성, 정책성, 재무 타당성 여부를 판단하는 핵심 정보로, 공공기관의 투자계획 평가, 재정지출 타당성 검토, 대규모 사업의 우선순위 조정 등에 활용 가능합니다. 또한 ESG 공시, 경영계획 수립, 국회 및 감사 대응 자료로도 활용될 수 있습니다.
