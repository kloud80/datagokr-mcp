description_portal: 경상북도 시군별 전세사기피해자접수 및 인정현황은 각 시군에서 연도별로 접수된 전세사기 피해 신고 건수와 피해 인정 건수를 구분하여 정리한 통계자료입니다. 주요 항목에는 구분(연도 및 접수·인정 구분), 포항, 경주, 김천, 안동, 구미, 영주, 영천, 상주, 경산 등 시군별 수치가 포함되어 있으며, 피해 접수 현황과 인정 현황을 함께 비교할 수 있도록 구성되었습니다. 이 자료는 전세사기 피해 규모와 지역별 분포를 파악하여 주거 취약계층 보호 및 피해자 지원 정책 수립에 활용되며, 행정기관의 정책 근거자료로도 사용됩니다. 데이터는 표 형식으로 제공되어 통계 분석 및 정책 연구에 용이하게 활용될 수 있습니다. 자료 관련 문의는  054-880-4022로 하시기 바랍니다.
