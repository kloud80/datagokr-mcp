description_portal: 청렴포털에서는 반부패 신고 모범사례를 조회할 수 있는 서비스를 제공하고 있습니다. 이 서비스는 신고유형, 사례구분(신고례/처리례), 신고제목, 신고내용 등의 세부 정보를 검색할 수 있어, 공직자 및 일반 국민이 부패행위에 대한 이해를 높이고, 유사한 상황에서의 대응 방안을 마련하는 데 도움이 됩니다. ​(청렴포털-청렴자료실-공개정보-신고일반사례)예시)상담내용- 늘봄학교 귀가 자원봉사자를 늘봄팀장의 자녀로 위촉하여 교통비를 주고 활동할 경우 이해충돌방지제도 가족채용 제한 위반 여부 및 가족 채용 제한 여부 확인서 징구대상인지?상담결과-채용 계약서를 쓰지 않고 위촉하였다면 가족 채용 제한에 해당하지 않는다고 보이므로 가족 채용 제한 여부 확인서 징구대상은 아님다만, 늘봄팀장은 자원봉사자의 위촉 및 운영 업무 담당자로서 법 제11조 제2호에 해당하여 채용계약서를 쓰지 않는 봉사 위촉직이라 하더라도 가족채용 제한에 해당하므로 자녀의 봉사위촉직 위촉은 바람직하지 않음.
