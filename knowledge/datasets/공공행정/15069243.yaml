summary_user: 부처별 민원사무를 사무 한 건씩 정리한 목록으로, 사무명·분류번호·사무개요·신청유형(승인·신고·허가·등록 등)·신청자 자격·수수료·접수방법·근거법령·신청서·구비서류·소관부처와 담당부서를 담는 전국 단위 비공간 파일(xlsx, 약 1.9MB)이다. 국민이나 사업자가 '이 허가를 받으려면 어느 부처에 어떤 서류와 수수료를 내고 어떤 방법으로 접수하나'를 확인하거나, 분석가가 부처별·신청유형별 민원사무 분포와 근거 법령을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소관부처·담당부서 이름이나 근거법령 이름을 매핑해 잇거나, 같은 기관의 코드로만 연결한다.
limits: 표준 기관코드 같은 공통 조인 키가 없어 다른 데이터와 붙이려면 소관부처·법령 이름을 직접 맞춰야 한다. 지역 구분이 없는 전국·비공간 목록이라 지역별 민원 처리 현황이나 실제 신청·처리 건수는 알 수 없다.
