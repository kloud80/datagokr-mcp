description_portal: 본 데이터는 관할 구역 내 장기간 거주·사용되지 않아 방치된 ‘빈집’의 현황을 종합적으로 파악하고 관리하기 위해 구축된 자료입니다. 관내 주택 유형별 빈집 호수에 관련된 내용을 포함하며, 빈집으로 인한 안전사고 예방, 범죄 방지, 도시미관 개선, 도시재생사업 기획 등 다양한 정책 수립의 기초자료로 활용됩니다. 해당 데이터는 「빈집 및 소규모주택 정비에 관한 특례법」 등 관련 법령에 따라 정기적으로 조사·갱신하여 신뢰성을 확보하고 있습니다.활용범위·빈집 발생 원인 분석 및 통계 작성·안전사고 예방 및 범죄 방지 대책 수립·도시미관 개선 및 환경정비 계획·도시재생·주거복지·지역경제 활성화 사업 기획
