summary_user: 서울시설공단이 관리하는 서울시 시영 공영주차장을 주차장 한 곳당 한 행으로 담은 현황 파일로, 운영방식·주차구획수·주소·주차장 종류·자동화정산 여부를 담는다. 시민이나 분석가가 "어느 시영주차장이 몇 면이고 자동 정산이 되는가"를 확인하거나 자치구별 공영주차 공급을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 주차장·교통 데이터와는 주차장명이나 주소(주소)를 매칭해 이어 쓴다.
description_portal: 서울시설공단에서 관리하고 있는 서울시 내 시영주차장의 현황을 제공하는 데이터입니다. 해당 데이터는 서울시설공단이 관리하는 시영주차장을 대상으로 하며, 각 주차장의 운영방식과 주차 가능한 구획수, 주차장이 위치한 주소, 주차장의 종류, 자동화정산 여부에 관한 내용을 제공하고 있습니다. 이를 통해 서울시 내 시영주차장별 운영방식, 구획수, 주소, 종류 및 자동화정산 여부를 확인할 수 있으며, 각 시영주차장의 현황을 항목별로 파악할 수 있도록 구성된 데이터입니다. 2026년 7월 20일 기준으로 작성되었습니다.
