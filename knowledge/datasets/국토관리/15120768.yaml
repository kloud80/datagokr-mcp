description_portal: 해당 자료는 경상남도 합천군 미준공 신축 건축물 현황에 관한 자료입니다.본 데이터는 경상남도 합천군의 미준공 건축물 데이터 건축구분, 허가일 착공처리일, 준공예정일(사용승인예정일), 착공연기일, 대지위치, 연면적, 최대지상층수 최대지하층수, 주용도, 부속용도, 총주차대수, 세대수, 가구수 등의 데이터를 포함합니다.데이터 대상 기준으로 주용도 숙박시설, 공동주택, 운동시설, 제2종근린생활시설 미준공 신축 등에 대한 데이터로, 데이터 기준일자는 2024년 7월 25일 입니다.해당 자료를 통하여 도시계획, 건축안전, 정책 자료 등에 활용할 수 있습니다.
