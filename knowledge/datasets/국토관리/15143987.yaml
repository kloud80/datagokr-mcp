summary_user: 한국산업기술시험원이 2024년 8~9월 식물공장 컨테이너 2개 동에서 측정한 평균 역률을 측정 시점(측정일)별로 담은 실측 원천 파일이며, 동별 메인값과 에어컨·공조기·양액기·조명·LED 같은 설비별 값이 열로 나뉘어 있다(CSV 약 50MB). 스마트팜 운영자나 에너지 분석가가 "식물공장에서 어떤 설비가 역률을 떨어뜨려 전력 효율을 낮추는가"를 진단하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 측정일 같은 시간축이나 같은 기관 자료로만 맞춰 붙일 수 있다.
description_portal: 본 데이터는 한국산업기술시험원이 2024년 8월부터 9월까지 식물공장에서 수집한 평균 역률(Power Factor, PF) 데이터입니다. 역률은 전기설비가 사용한 유효전력(kW)과 공급된 전체 피상전력(kVA) 간의 비율을 의미하며, 전체 공급 전력 중 실제로 유용한 일을 한 전력의 비율을 나타냅니다. 역률이 100%에 가까울수록 공급받은 전력을 효율적으로 사용하고 있음을 의미합니다. 반대로 역률이 낮을 경우 전력 손실이 크고 전기요금 증가 및 설비 과부하 위험이 높아질 수 있습니다. 평균 역률은 주로 % 단위로 표시되며, 에너지 효율 분석, 설비 운전 최적화, 대기전력 절감 방안 수립 등 다양한 전력 관리 분야에 활용됩니다. 본 데이터는 스마트팜 설비의 에너지 사용 효율을 진단하고 전력 품질을 개선하는 데 활용할 수 있으며, 나아가 지속가능한 농업 실현을 위한 지능형 전력제어 기술 개발에도 기여할 수 있는 유용한 자료입니다.* 원천 데이터 생산이 중단됨에 따라 기존 연간 단위로 수행되던 데이터 업데이트가 수시 업데이트 체계로 전환되었습니다.
