description_portal: 'K-water의 온실가스 배출허용량 및 배출량, 이행률 입니다. 본 데이터에는 배출허용량(할당량, tCO2), 배출량(tCO2), 의무이행량(tCO2), 이행률(%) 등 핵심 지표가 포함되어 있으며, 연도별로 변화르 확인할 수 있습니다.* 의무이행량 : 온실가스 배출권 차입, 이월, 구매, 판매 및 국가할당조정량을 포함한 전체 총량* 이행율 : 배출허용량/(배출량-의무이행량)*100배출권거래제(ETS)→ 정부가 기업에 배출허용량을 할당하고, 초과 배출량은 시장에서 배출권 거래 등을 통해 관리하는 제도배출허용량(할당량, Allowance)→ 정부가 기업에 사전 할당한 연간 최대 배출 가능량의무이행량→ K-water가 해당 연도 배출을 상쇄하기 위해 실제 사용한 배출권 총량(구성요소: 차입, 이월, 구매, 국가조정량 등)이행률→ 배출허용량 대비 실제 법적 이행 성과 평가 지표이행률이 100% 이상이면 법적 의무를 충족한 상태'
legal_basis_portal: 국가 온실가스 감축목표(NDC) 이행 관리대한민국 정부는 **2030 국가 온실가스 감축목표(NDC)**를 설정하고 있으며,이를 위해 배출권거래제를 통해 기업별 감축 기여도를 관리하고 있습니다.K-water의 ETS 이행 데이터는 정부의 NDC 이행 실적 집계에 포함되는 중요 데이터입니다.
