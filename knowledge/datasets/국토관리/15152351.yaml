summary_user: 강우레이더 기반 예측강우량을 행정구역별·예측 시간별로 담은 파일로, 기준시간과 예측시간마다 행정구역코드별 강수량이 한 행씩 들어 있으며 포털에는 전국 범위 자료 중 샘플 100건(csv 약 4.6KB)만 올라와 있습니다. 홍수 대응 담당자나 분석가가 '앞으로 몇 시간 동안 어느 행정구역에 비가 집중될 것인가'를 미리 가늠하고 집중호우 위험 지역을 조기에 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 행정구역코드를 법정동·행정동 코드표와 맞춰 보거나 같은 기관(한강홍수통제소)의 홍수 예보·관측 자료와 코드·이름 매핑으로 연결해 쓴다.
description_portal: '단기 예측 알람은 강우레이더 자료를 기반으로 예측강우량을 기반으로 행정구역별 및 예측 시간별 강우량과 누적 강우 정보를 제공하며, 각 행정구역별 강우 변화와 집중 호우 가능성을 분석하여 일별·누적 강우량을 예측하고 실시간으로 제공합니다. 이를 통해 예측 추세와 지역별 특성을 고려해 위험 증가 요인을 조기에 감지한다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
