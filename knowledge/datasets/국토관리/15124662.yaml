summary_user: "광주광역시 안의 공공하수처리시설(광주제1·제2하수처리장, 효천하수처리장 등)과 마을 단위 소규모 하수처리시설을 시설 하나당 한 행으로 담은 목록 파일로, 시설명·행정동·소재지 상세주소·데이터기준일자만 있으며 파일 크기는 약 1.6KB입니다. 주민이나 분석가가 '우리 동네(예: 대촌동·본량동) 하수는 어느 처리시설이 맡고 그 시설은 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 하수도 데이터(처리장 원장, 방류수 수질 등)와는 시설명이나 행정동 이름을 맞춰서만 이어 쓴다."
description_portal: 본 데이터는 광주광역시의 공공하수처리시설 및 소규모 마을하수처리시설의 현황을 정리한 자료로, 시설명, 행정동, 소재지 상세주소, 데이터기준일자 항목으로 구성되어 있습니다. 광주제1·제2하수처리장과 효천하수처리장을 비롯하여 서창동, 대촌동, 석곡동, 삼도동, 본량동, 임곡동, 평동, 동곡동 등 여러 지역의 소규모 공공하수처리시설이 포함되어 있습니다.신용마을, 용두마을, 칠석도금, 양과복수, 지석삼정, 승촌, 화암마을, 금곡마을 등 다양한 마을 단위의 하수처리시설이 상세주소와 함께 제공되어 있습니다
