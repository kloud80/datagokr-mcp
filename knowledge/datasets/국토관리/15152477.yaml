description_portal: 대전광역시(상수도사업본부)에서는 도시 전체의 상수도 공급 체계를 보다 효율적이고 안정적으로 운영하기 위해 관망을 블록 단위로 구분하여 관리하고 있습니다. 본 자료는 이러한 각 블록에서 계측된 월별 일일 평균 유량을 분석한 것으로, 지역별 수요 특성 파악과 관망 운영 효율성 평가에 활용됩니다.대전광역시는 동구, 중구, 서구, 유성구, 대덕구의 5개 자치구로 구성되어 있으며, 각 구는 다음과 같은 수의 블록으로 나뉘어 관리되고 있습니다. 동구는 50개, 중구는 54개, 서구는 64개, 유성구는 세종시 1·2단계 및 계룡시 지역을 포함하여 56개, 대덕구는 31개의 블록으로 구성되어 있습니다. 이들 블록별 월별 유량값은 유량계의 고장이나 유지보수, 계측 오류 등의 사유로 인해 일부 구간에서는 보정된 값이 적용되거나 데이터가 제공되지 않는 경우가 있으며, 분석 시 이러한 점을 함께 고려해야 합니다.본 자료에 제시된 모든 유량 값의 단위는 톤(t)이며, 이는 블록 단위의 수돗물 공급량을 비교·평가하는 기준으로 활용됩니다.
