description_portal: 'ㅁ 개요 : 한국수자원공사 국가가뭄정보센터에서 제공하는 가뭄시 비상용수공급 자원 파악을 위한 수원시설 제원 정보입니다.본 데이터는 다목적댐, 발전용댐, 용수댐, 홍수조절댐, 농업용댐, 지자체저수지, 하구둑, 다기능보 등의 속성을 포함합니다.각 속성 기준 순번,댐명,주소,시설관리기관,부서,연락처,연락처 비고,총저수용량(백만m3)등의 정보를 포함합니다.본 자료는 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어 사회 전반의 혁신과 가치 창출에 도움이 됩니다.'
