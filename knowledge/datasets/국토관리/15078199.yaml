summary_user: 부산광역시 상수도사업본부와 지역별 사업소의 이름, 대표전화, 도로명·지번 주소를 사업소 한 곳당 한 행으로 담은 작은 파일(CSV 약 1.3KB)이다. 시민이나 상담원이 '우리 동네 수도요금·누수·단수·계량기 문의는 어느 사업소에 전화해야 하나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 상수도 데이터와는 사업소명이나 주소 문자열로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 부산 지역 상수도 관련 민원 상담 과정에서 필요한 지역별 담당 사업소의 연락처 및 위치 정보를 체계적으로 정리한 자료입니다.주로 수도요금 문의, 단수 신고, 누수 신고, 급수 관련 민원, 계량기 관련 문의 등의 상담을 처리할 때 해당 관할 사업소를 안내하기 위한 참고 데이터로 활용됩니다.-사업소명:부산시 상수도 행정을 담당하는 각 지역별 사업소의 공식 명칭을 나타냅니다.-대표전화:해당 사업소에서 운영하는 대표 문의 전화번호를 의미합니다.-주소:각 사업소 건물의 실제 위치 주소를 나타냅니다. 주소는 일반적으로 도로명 주소와 괄호 안의 지번 주소가 함께 표기되어 있어 위치 확인이 용이합니다.
