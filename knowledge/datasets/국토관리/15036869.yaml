summary_user: 인천광역시 영종구(옛 중구 자료)가 개발행위를 허가한 건을 한 줄씩 담은 건별 원천 파일로, 해당년도·허가일자·허가위치·용도지역·지목·허가면적·협의면적·개발행위 목적이 들어 있습니다(CSV 약 57KB). 토지 매입이나 개발을 검토하는 사업자나 분석가가 "이 지역에서 어떤 용도지역·지목에 어떤 목적의 개발행위가 언제 얼마나 허가됐나"를 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 허가위치(주소)나 용도지역·지목 이름을 맞추는 방식으로만 이어 쓰며, 같은 기관의 다른 인허가 자료와 비교하는 정도로 활용합니다.
description_portal: 인천광역시 중구에서 조사한 개발행위허가현황에 대한 데이터 입니다.파일명 인천광역시_중구_개발행위허가현황파일내용 해당년도, 허가일자, 위치, 용도지역 등 국토의 계획 및 이용에 관한 법률 제56조(개발행위 허가) 및 인천시 도시계획 조례 및 개발행위허가 운영지침과 인천시 중구 성장관리계획 시행지침을 기초로 하여중구에서 개발행위 허가를 부여한 사항을 데이터로 추출하였습니다.허가기간과 허가목적 허가일자 등을 수록하였으며, 정기적으로 업데이트 할 예정입니다. 개발행위 허가는 건축물의 건축, 토지형질변경, 공작물 설치 등으로 구성되어 있습니다.
