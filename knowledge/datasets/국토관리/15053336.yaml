summary_user: 전국 시군구(행정구역) 단위로 총인구·총면적과 수계·중권역·소권역 등 유역 정보, 하수처리구역 안팎의 처리방식별 인구(물리적·생물학적·고도처리, 정화조·오수처리·미처리)와 하수도 보급률·고도처리인구 보급률·하수도설치율을 담은 집계 파일(CSV)이다. 분석가나 지자체 담당자가 '우리 시군구 인구 중 공공하수처리를 받는 비율은 얼마이고 정화조에 의존하는 인구는 얼마인가', '어느 수계·소권역에 미처리 인구가 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(행정코드 등)가 없어 다른 데이터와는 시도·시군구·행정구역명 같은 이름 매칭이나 수계·권역명으로 하수처리장·방류수 수질 자료와 이어 쓴다.
limits: 표준 행정구역코드 같은 전역 조인 키가 없어 다른 통계와 결합하려면 시군구 이름을 직접 매핑해야 한다. 행정단위가 시군구이므로 읍면동이나 개별 하수처리장 단위 분석에는 쓰지 못한다.
