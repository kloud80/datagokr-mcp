description_portal: 본 데이터는 국립공원공단 시설관리시스템(FMS)을 기반으로 관리되는 기타 구축물 중 오수물 처리와 관련된 시설 정보를 포함하고 있으며, 국립공원 내 위생환경 개선과 수질 보전을 위한 기초 자료로 활용됩니다. 주요 항목에는 시설명, 국립공원명, 위치(주소 및 위·경도 좌표), 시설유형(정화조, 침전조, 오수탱크 등), 설치연도, 재질 및 구조, 관리 주체, 사용 여부, 유지관리 주기, 처리용량 등이 포함됩니다. 이 데이터는 국립공원 내 화장실, 야영장, 숙박시설 등에서 발생하는 오수의 적정 처리를 위한 기반시설 현황을 제공하며, 시설 유지관리, 환경영향평가, 위생 인프라 개선, 공공시설물 관리정책 수립 등에 다양하게 활용됩니다. CSV 포맷으로 제공되며, GIS 기반 시스템이나 정비계획 수립 도구와의 연계도 용이합니다.
