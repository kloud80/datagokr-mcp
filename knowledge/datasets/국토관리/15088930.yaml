summary_user: 팩토리온(공장설립온라인지원시스템)에 등록된 공장을 건별로 담아 회사명·소재 시도·시군구·산업단지명·공장구분·입주형태 등 기본정보와 남자·여자·외국인 남녀별 종업원수, 종업원합계를 담은 전국 단위 파일(xlsx)이며, 포털 설명상 2021년 7월말 기준 집계다. 지역별·산업단지별 제조업 고용 규모나 외국인 근로자 비중을 파악하려는 분석가·지자체 담당자가 '어느 시군구·단지의 공장에 외국인 종업원이 많은가' 같은 질문에 쓴다. 실측 컬럼에 사업자번호·공장관리번호 같은 전역 조인 키가 없어, 다른 팩토리온 공장등록·생산정보 데이터와는 회사명·시도·시군구·단지명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 공장설립온라인지원시스템(factoryon)에 등록된 공장들의 공장  등을 제공합니다.해당 공공데이터는 산업단지 내 입주기업의 현황을 체계적으로 관리하기 위한 행정 기반자료로,`21년 7월말 기준으로 집계된 공장설립온라인지원시스템(factoryon)에 등록된 공장들의 기본정보(회사명, 주소 등), 공장 규모, 공장 관리번호를 기반으로 종업원수(남자, 여자, 외국인남자, 외국인여자)를 집계한 데이터입니다.데이터 건수가 많아 일반적인 엑셀, 메모장 등에서는 전체 내용이 표출되지 않을 수 있으므로,전용 데이터 분석 소프트웨어(R, Python, SPSS, Stata 등)를 활용하여 분석하시기 바랍니다.
