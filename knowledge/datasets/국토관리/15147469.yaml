summary_user: 「국토의 계획 및 이용에 관한 법률」에 따른 도시계획 현황 중 보행자와 차량이 함께 쓰는 통로(보차혼용통로)의 결정 현황을 담는다. 지방자치단체가 구축해 국토교통부가 전국 범위로 취합한 자료이며, 브이월드에서 시도별 엑셀 파일로 받는다. 도시계획 분석가나 개발 검토자가 "우리 지역에 보차혼용통로로 결정된 곳이 어디이고 어떤 계획이 고시됐나"를 확인해 개발 가능성을 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 도시계획시설·용도지역 자료와는 지자체명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: vworld.kr에 로그인해 공간정보 다운로드 페이지에서 시도별 XLSX를 받는 방식이며, 포털 활용신청이나 인증키로 호출하는 API가 아니다. 갱신은 명세상 수시·이벤트 주기이고, 받은 파일의 컬럼명이 '테이블정의서', 'Unnamed' 등으로 읽혀 머리글 행을 따로 정리해야 한다.
