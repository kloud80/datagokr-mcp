summary_user: 경상남도 거창군 안의 산업단지를 단지 한 곳당 한 행으로 정리한 현황 파일로, 단지명·위치·유형·지정(승인)일자·조성완료일자·지정면적(제곱미터)·유치업종을 담으며 파일 크기는 약 2.4KB 수준의 소규모 목록이다. 거창군에 어떤 산업단지가 언제 지정·조성됐고 면적과 유치업종이 무엇인지 확인하려는 입주 검토 사업자나 지역 산업입지 분석가가 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어, 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황과는 단지명칭(산업단지명칭) 이름 매칭으로만 이어 쓴다.
description_portal: '경상남도 거창군의 산업단지 현황에 대한 데이터로 경상남도 거창군의 산업단지 산업단지명칭, 경상남도 거창군의 산업단지 위치, 경상남도 거창군의 산업단지 유형, 경상남도 거창군의 산업단지 지정일자(승인일자), 경상남도 거창군의 산업단지 조성완료일자, 경상남도 거창군의 산업단지 지정면적(제곱미터) 유치업종(유치업종코드)를 제공합니다.○ 데이터 기준일 : 2025. 09. 01.○ 산업단지(産業團地)는 산업 활동을 위해 특정 지역을 종합적으로 계획하여 개발하고 관리하는 토지를 말하며, 공장, 연구 시설, 유통 시설 등 산업 관련 시설과 더불어 주거, 문화, 의료, 교육, 상업, 유통 등 다양한 지원 및 기능 향상 시설이 집약된 복합 공간입니다. 과거에는 주로 공장 밀집 지역을 의미하는 공업단지(공단)라고 불렸으나, 1990년대 이후 산업의 다양성과 복합 개발의 필요성을 반영하여 산업단지로 명칭이 변경되었습니다.'
