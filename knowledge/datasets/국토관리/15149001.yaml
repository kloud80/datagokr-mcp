summary_user: 충청북도 단양군에 있는 제조업체 81곳을 업체 한 곳당 한 행으로 담은 명부로, 업체명·업종·산업분류코드·소재지·전화·팩스·고용인원 수를 담는다(포털 설명상 기준일 2025년 9월 9일). 단양군에 어떤 업종의 제조업체가 어디에 몇 명 규모로 있는지 파악하려는 지역 산업 분석가·연구자나, 거래처·협력업체를 찾는 사업자가 쓴다. 전역 조인 키는 없어 산업분류코드(업종번호)로 업종 통계와, 소재지 주소로 지오코딩·공장등록 자료와 이름·주소 매칭으로만 이어 쓴다.
description_portal: '충청북도 단양군에 위치한 제조업체 총 81곳의 현황을 정리한 데이터입니다. 각 업체별로 업체명, 업종, 업종번호(분류코드), 소재지, 전화번호, 팩스번호, 고용인원 수의 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 지역 산업 현황 파악, 분석 및 연구자료로 매우 유용하게 활용 될 수 있습니다. 데이터기준일자는 2025년 9월 9일입니다.제공데이터: 업체명, 업종구분, 산업분류코드, 소재지, 전화번호, 팩스번호, 고용인원수, 데이터기준일자담당부서: 단양군청 관광건설국 경제과'
