summary_user: 서귀포시 관내 자동차 매매업체를 업체별로 한 행씩 담은 원천 목록으로, 업체명·소재지·연락처·위도·경도·데이터기준일자를 담는다(파일 크기 약 1.2KB의 소규모 CSV). 중고차를 사려는 주민이 거래하려는 서귀포시 매매업체가 목록에 있는지, 어디에 있고 연락처가 무엇인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 위도·경도 좌표로만 이어 쓰며, 좌표로 지도나 다른 시군구 매매업 현황과 겹쳐 본다.
description_portal: 이 데이터는 서귀포시 관내에서 등록·운영 중인 자동차 매매업체의 현황을 정리한 자료입니다.업체명, 대표자, 사업자등록번호, 등록번호, 소재지 주소, 연락처, 등록일자, 인허가 상태(정상, 휴업, 폐업) 등이 포함됩니다.자동차 매매업체는 신차 및 중고차의 거래를 중개하거나 직접 판매하는 역할을 하며, 이 데이터는 합법적으로 등록된 업체 여부를 확인할 수 있는 중요한 기준이 됩니다.이를 통해 지역 내 자동차 거래 시장의 규모와 분포를 파악하고, 특정 지역의 자동차 매매업 집중도나 거래 편중 현상을 분석할 수 있습니다.또한 소비자 입장에서는 자동차 구매 또는 매매 시 해당 업체의 등록 여부를 사전에 확인해 불법 거래나 사기 피해를 예방할 수 있습니다.행정기관은 해당 데이터를 활용해 자동차 매매업 관리·감독 정책을 수립하고, 허위 매물, 미등록 영업, 불법 중개 행위 단속 근거 자료로 활용할 수 있습니다.
