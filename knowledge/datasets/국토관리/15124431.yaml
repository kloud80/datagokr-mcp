description_portal: '- 광주전남 혁신도시(빛가람혁신도시) 내 이전한 공공기관 현황에 대한 정보를 조회하실 수 있습니다.- 공공기관명, 이전인원, 부지면적, 청사규모, 업무개시일, 홈페이지, 주요기능 등에 대한 데이터를 제공합니다.- 빛가람 혁신도시는 전라남도 나주시 빛가람동에 위치한 국가균형발전의 핵심 거점으로, 다양한 공공기관들이 모여 있는 복합 행정·경제 중심지입니다. 이곳은 행정안전부의 혁신도시 시즌2 정책에 따라 공공기관 이전과 함께 발전을 거듭하고 있습니다.- 빛가람 혁신도시는 공공기관의 이전과 함께 다양한 산업과 연구기관들이 입주하여 지역 경제와 일자리 창출에 기여하고 있습니다.'
