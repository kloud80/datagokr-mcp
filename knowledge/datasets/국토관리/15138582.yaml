summary_user: 경상남도 하천관리시스템에서 관리하는 하천 지적 정보를 필지 단위로 담은 파일로, 하천관리코드와 주소코드·본번·부번·지번, 하천 공간정보 코드로 구성된다. 하천 인접 토지를 매입하거나 개발하려는 사업자·분석가가 특정 필지가 경상남도 관리 하천에 걸려 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 주소코드·지번을 이용한 이름·코드 매핑이나 같은 기관의 하천관리코드로만 다른 하천 데이터와 연결한다.
description_portal: (데이터 수집목적 및 과정)경상남도 하천관리 지적데이터는 분야는 지역개발-수자원이며 경상남도 하천관리시스템 내 관리하는 지적데이터입니다.(데이터 구성 및 세부사항) 경상남도 하천관리 지적데이터는 하천을 관리하는 코드, 해당 주소(본번, 부번, 지번)과 하천 공간정보 코드로 구성되어 있으며 총 49건으로 이는 샘플데이터입니다. 제공하는 데이터는 샘플데이터로 제공신청 시 데이터 전체를 제공할 수 있습니다.(데이터 현행화 시기) 경상남도 하천관리 지적데이터는 연간데이터로 연간 현행화를 진행하며 차기 업데이트 예정일은 2025년 10월입니다.
