summary_user: 수도권 주택공급정책에 따라 추진되는 지구를 한 행에 하나씩 담은 현황 자료로, 사업차수·지구명·위치·면적·공급 호수·사업시행자·지구지정일과 지구 유형(중소규모·신도시 등) 비고를 기록한다. 정책 분석가나 사업자가 수도권에서 어느 지구가 몇 호 규모로, 어떤 시행자(LH·지자체·도시공사)에 의해 언제 지정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 주택공급·인허가 데이터와는 지구명이나 위치 문구를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 수도권 주택공급정책에 따라 추진되는 지구별 사업현황을 수록한 자료입니다. 주요 항목으로 사업차수, 지구명, 위치, 면적, 호수, 사업시행자, 지구지정, 비고 등이 포함되어 있으며, 각 지구의 사업 단계별 차수, 대상 위치, 개발 면적 및 공급 예정 호수, 시행기관, 지구 지정일 등이 기록되어 있습니다. 사업시행자 항목에는 한국토지주택공사(LH), 지방자치단체 및 도시공사 등이 포함되며, 비고에는 지구 유형(중소규모, 신도시 등)이 표기됩니다. 본 데이터는 수도권 주택공급 정책 분석, 신규 택지개발 수요예측, 신도시 개발계획 수립, 정책 모니터링 등에 활용될 수 있으며, 활용 시 사업계획 변동 및 단계별 승인 현황을 함께 고려하는 것이 필요합니다.
