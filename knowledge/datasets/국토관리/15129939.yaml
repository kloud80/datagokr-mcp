summary_user: 평택시 도시계획정보시스템(UPIS)에 등록된 개발행위허가 필지 도형을 한 건씩 담은 시군구 단위 원천 현황으로, 도형 관리번호·허가 계획관리번호·라벨명·도형 면적을 담는다. 토지 소유자나 개발 사업자, 도시계획 분석가가 평택시에서 개발행위허가가 난 필지가 어디이고 면적이 얼마인지 확인하는 데 쓴다. 전국 공통 조인 키는 없어 시군구코드로 같은 기관의 다른 UPIS 현황과 맞추거나, 허가 계획관리번호·라벨명을 이름 매핑해 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 개발행위허가제한지역현황으로 현황도형 관리번호, 시군구코드, 면적, 길이 등의 항목을 제공합니다.개발행위허가필지도현황은 토지 이용 계획 및 개발 행위에 대한 허가 정보를 시각적으로 보여주는 지도입니다. 여기에는 건축물의 건축, 토지 형질 변경, 토석 채취, 토지 분할, 물건 적치 등 개발행위 허가와 관련된 다양한 정보가 포함되어 있습니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
