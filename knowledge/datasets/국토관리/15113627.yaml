summary_user: 경기도 양주시의 개별공시지가를 필지(지번) 단위로 담은 건별 파일로, 가격기준년도·토지소재지·본번·부번·공시지가·기준일자·공시일자를 포함하며 포털 설명상 152,816행 규모입니다. 토지 소유자나 매수 예정자가 '양주시 이 지번의 올해 공시지가는 얼마이고 예년보다 얼마나 올랐나'를 확인하거나, 분석가가 연도별 필지 지가 추세를 볼 때 쓴다. 법정동코드나 PNU 같은 전역 조인 키가 없어, 다른 데이터와는 토지소재지 이름과 본번·부번을 맞춰 연결해야 한다.
description_portal: 경기도 양주시_개별공시지가 데이터는 토지 단위별로 산정된 개별공시지가 현황을 제공하는 자료다. 총 152,816행으로 구성되어 있으며, 가격기준년도, 토지소재지, 본번, 부번, 개별공시지가, 기준일자, 공시일자 등의 항목을 포함한다. 이를 통해 양주시 내 각 필지별 토지의 가격 수준을 확인할 수 있으며, 연도별 지가 변동 추세를 분석할 수 있다. 특히 지번 단위의 세밀한 정보가 제공되므로 토지 거래, 개발 계획 수립, 재산세 부과 등 다양한 행정 및 민간 활용이 가능하다. 또한 개별공시지가는 부동산 시장 안정과 투명성 확보에 중요한 역할을 하며, 공시지가를 기초로 한 각종 세금 및 부담금 산정의 기준이 된다. 이 데이터는 토지 자산 가치를 평가하고, 도시 개발 및 관리 정책 수립, 부동산 시장 분석 등 다방면에서 활용될 수 있는 기초 자료로서 의의가 크다.
