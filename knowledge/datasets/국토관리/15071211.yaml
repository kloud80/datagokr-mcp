summary_user: 서울특별시 공동주택통합마당의 아파트 단지 기본정보를 단지 한 건씩 담으며, 단지명·지번/도로명 주소·동수·세대수·건설사·시행사·사용승인일·연면적·관리비부과면적·전용면적 구간별 세대 현황·난방과 관리 방식 등을 포함한다. 집을 알아보는 시민이나 주택 분석가가 '이 구에서 2000년 이전에 준공된 500세대 이상 단지는 어디이고 난방방식은 무엇인가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 실거래·공시가격·청약 데이터와는 아파트코드(APT_CD)·단지명·주소를 매핑해서 잇는다.
limits: 외부 사이트(data.seoul.go.kr) 인증키를 경로 파라미터로 넣어야 하며, 이 키는 포털 활용신청과 별개로 받는다. 표준 조인 키가 없어 다른 데이터와 연결하려면 단지명·주소 매칭에 기대야 하므로 매칭 오류에 주의한다.
