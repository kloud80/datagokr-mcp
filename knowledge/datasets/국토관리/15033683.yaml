summary_user: 강원특별자치도 내 등록 공장을 한 건씩 담은 명부로, 시군구·회사명·도로명 공장대표주소·업종명·전화번호·단지명·생산품을 담는다(포털 설명상 공장설립관리망 추출, 기준일 2025년 5월 9일). 강원도에서 특정 업종이나 생산품을 만드는 공장이 어느 시군구·산업단지에 있는지 찾으려는 사업자·분석가가 거래처 탐색이나 지역 제조업 분포 파악에 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키는 없어, 다른 데이터와는 시군구명·단지명·회사명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 강원특별자치도 기업체(공장) 정보(회사명, 공장대표주소, 업종명, 전화번호, 단지명, 생산품) 현황데이터를 제공합니다.○ 순번, 회사의 명칭, 공장대표주소, 공장의 업종명, 공장 전화번호, 생산품 데이터를 포함하고 있으며, 데이터 기준일은 2025년 5월 9일입니다.○ 회사명이 중복된 항목이 있을 수 있으며, 전화번호, 팩스번호가 없는 항목이 존재합니다.○ 개인정보가 포함된 전화번호는 삭제처리하여 등록합니다.○ 데이터가 미집계 되거나 없는 경우 공란으로 표기합니다.○ 공장설립관리망에서 추출된 자료이며, 미등록된 데이터는 제공이 불가합니다.
