summary_user: 강진군 관내 오피스텔을 건물 한 동씩 담은 목록으로, 오피스텔 명칭과 등록 세대(호)수, 지번주소, 위도·경도를 포함하며 파일 크기가 190바이트에 불과해 수록 건물은 극소수다. 강진군에서 오피스텔을 구하려는 주민이나 지역 주택 공급을 살피는 분석가가 '군내 오피스텔이 어디에 몇 세대 규모로 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 건물명·지번주소로 건축물대장 등과 맞추거나 위도·경도로 지도 위에서 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 자료는 전라남도 강진군 내에 위치한 오피스텔 건축물에 대한 기본 현황 정보를 제공합니다.보유한 행정 시스템을 통해 "오피스텔"이라는 키워드로 검색하여 추출된 데이터로, **건물명(오피스텔명)**과 **세대수(입주 가능 세대 수)**를 포함하고 있습니다.다만, 아래와 같은 특이사항 및 유의사항을 반드시 참고하여 활용하시기 바랍니다.오피스텔명 (건물명)강진군 관내 등록된 오피스텔의 공식 건물 명칭등기부 등본 또는 행정 시스템에 등록된 이름 기준세대수해당 오피스텔에 등록된 세대(호수) 수실입주 가능 호수 기준이나, 일부 건물은 실제 사용 호수와 차이가 있을 수 있음
