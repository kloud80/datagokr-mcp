description_portal: 본 데이터는 전북특별자치도 익산시 내 일반산업단지 데이터 분석 결과 데이터셋이다. 전북특별자치도 익산시 일반산업단지 내 입주 기업체별 건물 단위를 중심으로 화재 위험 등급을 4단계로 산출한 결과를 파일 형태로 구축하여 개방한 자료이다. 이 데이터는 익산시 및 관계 기관에서 화재 위험 분석과 산업안전 정책 수립, 대응 체계 구축에 기초 자료로 활용할 수 있도록 제공되며, 실효성 높은 안전 관리 방안을 마련하는 데 중요한 역할을 수행한다. 해당 데이터의 인코딩 방식은 UTF-8로 설정되어 UTF-8 포맷으로 실행해야 하며 QGIS, ArcGIS 등 공간정보 소프트웨어를 이용하여야 한다.
