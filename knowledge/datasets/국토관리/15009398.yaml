summary_user: SH공사가 공급하는 상가·공장 등 비주거시설의 분양·임대 공급계획을 단지 단위로 담은 작은 CSV 파일(654바이트)로, 구분·지역·단지명·공급호수·공급 연월·비고를 담는다. 소상공인이나 중소기업이 언제, 어느 지역에서 SH 상가·공장 물량이 몇 호 나오는지 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 지역명·단지명을 다른 데이터의 이름과 직접 맞춰 이어 써야 한다.
description_portal: 이 데이터는 서울특별시 서울주택도시개발공사(SH공사)가 시행하는 상가 및 공장 등 비주거용 부동산의 분양 및 임대 공급정보를 포함하고 있습니다. 제공 항목에는 지구명, 단지명, 공급호수, 공급시기, 비고(임대 조건, 특이사항 등)가 포함되어 있으며, 이를 통해 SH공사가 도시개발 사업과 연계하여 상업·산업 기능을 지원하기 위해 어떤 지역에, 어느 규모의 비주거시설을 공급하고 있는지를 확인할 수 있습니다. 이 데이터는 소상공인 및 중소기업의 입주 기회를 파악하거나 지역 내 상업 활성화 정책과의 연계성을 분석하는 데 활용될 수 있습니다. 공급시기는 예정 단계일 수 있으며, 사업 여건이나 수요 변화에 따라 조정될 수 있으므로, 투자 검토나 입주 계획 수립 시 참고자료로 활용해야 합니다.
