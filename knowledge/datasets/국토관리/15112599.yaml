summary_user: 경기주택도시공사가 공급하는 공공임대주택·경기행복주택 등 아파트 단지 내 상가의 분양·임대 공고를 공고 한 건 단위로 담은 파일(csv, 약 69KB)로, 공고명과 공고 시작·종료·등록일, 기타 유의사항이 들어 있다. 단지 내 상가 임대를 알아보는 사업자가 '지금 경기도 공공임대 단지에서 모집 중인 상가 공고와 접수 기간'을 확인하거나, 분석가가 공사의 상가 공급 공고 이력을 시기별로 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고명에 들어 있는 단지명·지역명을 이름으로 맞추거나 같은 기관(경기주택도시공사) 데이터끼리만 연결한다.
description_portal: 경기주택도시공사에서 공급 중인 공공임대주택, 경기행복주택 등의 아파트 단지 내 상가에 대한 분양 및 임대공고 현황 정보 데이터로써 공고명, 공고시작일, 종료일, 등록일 등 세부 일정 정보가 포함되어 있으며, 공급 방식에 따른 유형 구분도 가능합니다. 분양 또는 임대 대상의 위치와 면적, 가격 등의 주요 정보도 제공되어 실수요자 및 투자자에게 유용한 자료입니다. 공사의 상가 공급 정책 흐름 파악이나 지역별 수요 분석, 공급 조정 정책 수립 시 근거자료로 활용할 수 있습니다. 다양한 공고 이력 데이터를 통해 공사의 사업전개 방향을 추론할 수 있습니다.
