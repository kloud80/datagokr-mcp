summary_user: 대구광역시 서구 무인민원발급기에서 뽑을 수 있는 민원을 분야(주민등록·지적·세무 등 14개 분야), 민원명, 종수, 관내·관외 발급수수료 단위로 담은 목록이며, 포털 설명상 출력 가능한 민원은 총 88종입니다. 주민이 '서구 무인발급기에서 이 증명서를 뽑을 수 있고, 다른 지역 주민이면 수수료가 얼마인가'를 확인하거나, 분석가가 지자체별 무인발급 민원 범위와 수수료를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 민원명·분야 이름을 맞추거나 같은 기관(대구 서구) 기준으로만 이어 쓴다.
description_portal: '입력 파라미터를 이용하여 대구광역시 서구_무인민원발급기 민원종류 및 발급수수료의 분야, 민원 명, 종 수, 관 내, 관 외 항목을 제공하는 서비스[용어정의]무인민원 발급기는 시민들이 다양한 민원서를 자동으로 발급할 수 있는 편리한 서비스입니다. [데이터 상세설명] * 분야: 14개분야(건강보험국민연금, 건축, 경제, 고용노동부, 교육, 교통, 국세청, 대법원, 병무, 복지, 세무, 외교부, 주민등록, 지적) * 민원명: 발급할 수 있는 민원 업무명* 종수: 발급받을 수 있는 종류로 총 88종의 민원이 출력 가능 * 관내:거주지 관할에 속하는 행정구역에서 발급을 받는 경우 발급 금액 * 관외: 다른 지역에서 발급을 요청하는 경우 발급 금액'
