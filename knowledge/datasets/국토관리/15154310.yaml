description_portal: 「행정포털 주택재건축 정보」는 행정포털 내부의 재건축 관련 9개 테이블(기본정보, 민원, 조치, 첨부파일 등)을 정비구역 단위로 통합하여 비식별·정제한 공공데이터입니다. 각 정비구역의 기본현황(면적·용적률·추진단계), 민원·조치 건수, 첨부파일 현황, 도시계획·법무 관련 자료의 건수 및 통계 등 재건축 행정 흐름을 구조화했습니다. 개인정보·파일명·경로 등 민감정보는 모두 제거하여 안전하게 개방할 수 있으며, 도시계획 연구·정비구역 관리·주민 정보 접근성 향상·정책 개발 등 다양한 공공 목적에 활용 가치가 높습니다.
