summary_user: 부산시가 운영하는 10개 하수처리사업소(수영·중앙·남부·녹산 등)별로 처리 후 방류하는 물의 일일 수질(BOD·COD·총질소·총인·부유물질)과 하수처리량을 날짜(연·월·일) 단위로 담는 API 데이터다. 지역 주민이나 환경 분석가가 "우리 동네 하수처리장 방류수가 기준 안에서 깨끗하게 나가고 있나, 사업소별로 수질 차이가 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 하수처리장 원장이나 방류수 원격감시(TMS) 자료와는 사업소명(shop)을 이름으로 맞춰 연결해야 한다.
description_portal: 부산시에서 운영하는 하수처리시설에서 처리한 후 방류하는 수질현황 데이터를 개방합니다.개방된 데이터는 하수처리사업소명, 등록일, 처리한 날짜, 방류수에 포함되어 있는 BOD(생물학적산소요구량), COD(화학적산소요구량), tn(총질소), tp(총인), SS(부유물질), 하수처리량의 데이터를 포함합니다.수영사업소, 중앙사업소, 정관사업소, 강변사업소, 기장사업소(기장), 기장사업소(문오성), 해운대사업소, 남부사업소, 녹산사업소(녹산), 서부사업소 등 10개의 사업소에서처리한 방류 수질정보를 제공하고 있습니다.
