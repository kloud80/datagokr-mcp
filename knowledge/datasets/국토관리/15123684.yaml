summary_user: 경상남도와 시군의 아파트 거래 면적과 거래 호수를 행정동 단위로 모은 통계청 출처 집계 파일(zip, 약 78KB)로, 건별 실거래 신고 자료가 아니다. 지역 분석가가 경남 읍면동별 아파트 거래 규모가 어디에 몰렸는지 비교할 때 쓴다. 실측 파일에는 행정동코드와 시도·시군구·읍면동명, 코드의 생성·말소일자가 있지만 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동코드나 지역명 매핑으로만 잇는다.
description_portal: (데이터 수집목적 및 과정) 경상남도 아파트거래정보 데이터는 경남빅데이터허브플랫폼 DB 내에서 관리하고있는 경상남도 및 시군의 아파트거래정보에 대한 정보입니다. 출처는 통계청이며 정제하여 플랫폼에 제공하고 있습니다.(데이터 구성 및 세부항목) 아파트거래정보 데이터는 행정동코드, 데이터기준일, 아파트거래면적, 아파트거래호수로 구성됩니다. 행정동코드에 대한 설명은 코드북을 활용하여 주시기 바랍니다.(데이터 현행화 시기) 해당 데이터는  1회성 데이터며 현행화 하지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼-데이터분석-경남도정현황을 참고하여 주시기 바랍니다.
