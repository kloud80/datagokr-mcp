summary_user: 광주광역시 도시 및 주거환경정비기본계획(2025) 보고서를 hwpx 파일 한 건(약 194MB)으로 담은 문서형 자료로, 건별 원천 데이터나 집계표가 아니라 정비사업의 목표, 기본방향, 부문별 계획을 서술한다. 광주 지역 재개발·재건축·주거환경개선 사업을 검토하는 주민, 사업자, 분석가가 '이 구역의 정비 방향과 시의 정비 목표는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구역명·지명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
limits: 파일은 목차 중심의 문서여서 정비구역별 추진 단계(추진위, 조합, 사업시행, 관리처분, 준공)나 수치를 표 형태로 바로 뽑아 쓰기 어렵다. 명세상 수시·이벤트 주기로, 계획 수립 때 만들어진 뒤 바뀌지 않으므로 이후 변경 계획이나 사업 진행 현황은 따로 확인해야 한다. 공간 좌표 정보가 없다.
