summary_user: 전주시 도로 노선(구·노선명·시점종점) 단위로 가로수 총 그루수와 은행나무·느티·왕벚나무 등 40여 개 수종별 그루수를 담은 집계 파일(CSV)이다. 시민이나 도시녹지 분석가가 '어느 구, 어느 도로에 어떤 수종의 가로수가 몇 그루 심겨 있는가'를 확인하거나 수종 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구 이름·노선명 같은 이름 매칭으로만 이어 쓴다.
description_portal: '전북특별자치도 전주시 가로수의 종류와 식재위치를 제공하며, 연번, 구, 노선명, 시점종점, 가로수 그루수, 나무종별 그루수 등을 제공합니다.항목 : 연번, 구, 노선명, 시점종점, 가로수그루수, 은행나무, 느티, 왕벚나무 등(나무종별 그루수) 자료: 녹지정원과“본 데이터는 전주시 도심 가로수의 건강 상태와 관리 현황을 기록한 자료로, 도시 열섬 완화, 미세먼지 저감, 폭염 대응, 경관 개선 등 다양한 환경적·사회적 가치 창출에 활용될 수 있습니다.”“전주시 주요 도로변 가로수의 생육 상태, 수종별 분포, 병해충 발생 여부 등을 진단한 데이터로, 도시 녹지 관리와 도로 안전 확보를 위한 기초 자료입니다.”'
