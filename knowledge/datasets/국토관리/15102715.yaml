description_portal: 이 데이터는 경기도 양평군 내 토지의 용도별 면적분포를 체계적으로 정리한 자료입니다.‘지목(地目)’이란 토지가 실제로 어떻게 사용되고 있는지를 나타내는 분류 기준으로, 예를 들어 농사를 짓는 땅은 ‘전(田)’이나 ‘답(畓)’, 나무를 심은 땅은 ‘임야(林野)’, 건물이 들어선 곳은 ‘대(宅地)’ 등으로 구분됩니다.  지목(전,답,과수원,목장용지,임야,광천지,염전,대,공장용지,학교용지,주차장,주유소용지,창고용지,도로,철도용지,제방,하천,구거,유지,양어장 등) 총28종의 지목별로 구분하여 제공합니다.이 데이터는 도시계획 및 공간정책 수립, 농업산립 정책 지원, 환경영향평가 및 생태계 보전, 재난재해 대응 및 예방, 부동산 및 토지이용 분석, 공공입지선정, 지역간 비교 통계분석에 활용할 수 있습니다. 이처럼 지목별 면적현황 데이터는 양평군의 공간 구조를 이해하고, 미래를 설계하는 데 꼭 필요한 기초자료입니다.
