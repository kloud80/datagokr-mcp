summary_user: 울산광역시도시공사가 조성한 청량율리보금자리주택의 단지별 현황을 한 행씩 담은 소규모 파일(csv 851바이트)로, 단지명·도로명주소·공급유형·사업비·준공일자·연면적·건폐율·용적률·주차대수·발코니 확장 여부와 전용면적대별(46~84제곱미터) 건설호수, 입주자격 관련 법령을 담는다. 울산 공공주택 입주를 고려하는 시민이나 분석가가 '청량율리 보금자리 단지별로 어떤 공급유형에 어떤 평형이 몇 호 지어졌는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지명이나 도로명주소를 이름·주소 매칭으로 이어야 하며, 공급유형과 입주자격 법령은 공공주택 관련 법령 맥락에서 해석한다.
description_portal: 이 데이터는 울산광역시도시공사에서 조성한 청량율리보금자리주택의 단지별 분양 및 임대 현황을 종합적으로 관리하기 위한 데이터셋입니다.보금자리주택은 울산시민의 주거안정과 공공임대 확대를 위해 추진된 대표적인 공공주택사업으로, 본 데이터는 각 단지의 물리적 특성, 공급유형, 세대규모, 사업비, 법적근거 등을 통합적으로 기록하여 관리하는 데 목적이 있습니다.핵심 항목으로는 **단지명(CNBD_NM)**과 **도로명주소(ROAD_NM_ADDR)**가 있으며, 단지별 위치정보를 기반으로 한 주택공급 현황을 파악할 수 있습니다.또한 공급유형(TYPE) 항목을 통해 공공임대, 분양전환형, 영구임대 등 공급방식을 구분하며, 사업비(TPCO) 및 준공일자(CMCN_YMD) 항목은 각 단지의 사업비 규모와 사업완료 시점을 나타냅니다.주택의 물리적 특성과 규모를 나타내는 주요 지표로는 연면적(GFA), 건폐율(BDCVRT), 용적률(FART), 주차대수(PARK_CNT) 등이 있으며, 이는 건축물의 효율성, 대지 활용도, 주거편의시설 수준을 평가하는 데 활용됩니다.또한 발코니 확장실시여부(BALC_EXP_INS) 항목을 통해 세대별 발코니 확장 여부를 파악할 수 있어, 실입주환경 분석에도 유용합니다.
