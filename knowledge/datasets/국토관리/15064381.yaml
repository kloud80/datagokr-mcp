summary_user: 수도권매립지로 반입되는 서울·경기·인천의 폐기물 반입량을 마감년월, 광역지자체, 폐기물 종류별로 담은 파일 데이터로, 검증 수신 9,299행 전체를 받았다. 지자체 폐기물 담당자나 분석가가 광역지자체별로 어떤 종류의 폐기물이 월별로 얼마나 반입되는지 살펴볼 때 쓴다. 조인 키는 소재지(address)뿐이며 코드표는 없어, 다른 데이터와는 지자체 주소 문자열을 맞춰 이어 쓴다.
description_portal: 수도권매립지로 반입되는 서울시, 경기도, 인천시의 폐기물 반입량 정보입니다. 개방항목으로 마감년월, 광역지자체명, 폐기물명, 반입량(kg) 항목을 제공합니다.수도권매립지관리공사로 반입되는 지자체별 반입량 정보는 통계연감이나 폐기물고객센터 등에서 확인할 수 있습니다. 각 지자체의 생활폐기물, 사업장폐기물, 건설폐기물 등 세부 종류별 반입량도 연도별로 공개되어 있으며, 2020년부터는 생활폐기물 반입총량제가 시행되어 반입량 실시간 모니터링 및 총량 대비 반입 비율 등도 함께 제공하고 있습니다.
