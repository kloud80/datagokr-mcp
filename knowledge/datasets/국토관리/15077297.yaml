summary_user: 대전광역시 재정비촉진지구를 지구별로 정리한 소규모 현황 표(CSV 614바이트)로, 자치구·지구명·면적(천㎡)·유형·최초지정일·계획결정일·최종계획변경일·촉진구역 수를 담는다. 대전에서 어느 구에 어떤 재정비촉진지구가 언제 지정되고 계획이 언제 바뀌었는지 확인하려는 주민·부동산 분석가·정비사업 관계자가 쓴다. 전역 조인 키(법정동 코드 등)가 없어 자치구명·지구명을 기준으로 다른 정비사업·부동산 자료와 이름 매핑해 이어 쓴다.
description_portal: 대전광역시 도시재정비촉진사업 현황은 대전시에서 추진 중인 도시재정비촉진사업과 관련된 지역별 지정 정보와 사업 진행 상태를 종합적으로 정리한 자료입니다. 이 자료는 지역명, 면적, 지정일, 자치구별 분포, 지구명, 최초지정일, 계획결정일, 최종계획변경일, 촉진구역 등 주요 항목을 포함하고 있어 각 촉진사업의 행정적 이력과 공간적 범위를 명확히 파악할 수 있도록 구성되어 있습니다. 해당 자료는 재정비촉진지구 내 정비계획 수립, 도시환경 개선, 노후지역 정비 등의 정책 결정과 사업 추진을 위한 기초 자료로 활용됩니다. 또한 사업별 지정 및 변경 이력을 분석함으로써 향후 도시개발 방향 설정과 계획 수립에 참고할 수 있는 핵심 정보입니다.
