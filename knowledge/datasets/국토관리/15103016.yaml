description_portal: '인천광역시 토지거래허가구역 지정 데이터를 제공합니다.(허가구역명, 위치, 면적(㎢), 최초 지정일, 최종 지정기간, 작성기준일 등)  1. 구월2 공공주택지구 및 인근지역 지정현황 상세설명     - 근거법률: 부동산거래신고법 제10조 및 시행령 제7조제1항제3호     - 지정공고: 2024. 7. 26.     - 지정기간: 2024. 9. 21.~2025. 9. 20.(1년간)     - 지정규모: 연수구 선학동, 남동구 구월·남촌·수산동 일원  5.43㎢     - 지정권자: 인천광역시장     - 토지거래계약에 관한 허가를 받아야 하는 면적(도시지역) : 주거지역 60㎡ 초과, 상업지역 150㎡ 초과, 공업지역 150㎡ 초과, 녹지지역 100㎡ 초과, 용도지역이 지정이 없는 구역 60㎡ 초과     - 토지이용에 관한 의무: 주거용 2년, 주민복지·편의시설 2년, 농업 등 2년     - 토지거래계약 미리 관할 구청장 허가 필요함  2. 외국인 등 토지거래허가구역 지정현황 상세설명     - 근거법률: 부동산거래신고법 제10조 및 같은 법 시행령 제7조제2항     - 지정공고: 2025. 8. 21.     - 지정기간: 2025. 8. 26.~2026. 8. 25.(1년간)     - 지정범위: 중구, 미추홀구, 연수구, 남동구, 부평구, 계양구, 서구 등 7개 구 477.91㎢     - 지정권자: 국토교통부장관     - 허가대상자: 외국인 등(부동산 거래신고법 제2조제4호)        * 개인, 외국 법인 및 단체 등    - 허가대상 용도: 건축법 시행령 별표 1에 따른 단독주택, 다가구주택, 아파트, 연립주택, 다세대주택     - 토지거래계약에 관한 허가를 받아야 하는 면적(도시지역): 주거지역 6㎡ 초과, 상업지역 15㎡ 초과, 공업지역 15㎡ 초과, 녹지지역 20㎡ 초과, 용도지역이 지정이 없는 구역 6㎡ 초과     - 토지취득계약 미리 관할 구청장 등 허가 필요하며 실거주 2년 의무 발생함.'
