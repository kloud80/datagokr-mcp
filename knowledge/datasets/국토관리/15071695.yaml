summary_user: 서울시 전역의 도시계획 생활권 중심지를 한 곳씩 담은 공간 데이터로, 중심지별 분류·명칭, 관련 조서·고시 식별자와 고시일자, GRS80 좌표계 X·Y 좌표를 담는다. 도시계획 분석가나 부동산·입지 검토자가 '우리 동네 주변에 어떤 유형의 생활권 중심지가 지정돼 있고 언제 고시됐나'를 지도 위에서 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 바로 맞물리는 전역 조인 키는 찾지 못했다. 그래서 다른 데이터와는 좌표 기반 공간 결합이나 중심지 명칭·도시계획코드(CTY_PLAN_CD) 매핑으로만 이어 쓴다.
description_portal: 서울시 도시계획 생활권 중심지 정보는 서울시 전역에 분포한 생활권 중심지를 도시계획 관점에서 체계적으로 관리하기 위한 공간 데이터입니다. 순번과 ID는 각 중심지를 구분하는 식별자 역할을 하며, 도시계획코드는 해당 중심지가 어떤 도시계획 체계와 연계되어 있는지 나타냅니다. 분류명과 라벨명은 중심지의 유형과 명칭을 제공하여 지역의 성격과 기능을 이해하는 데 도움을 줍니다. 조서ID와 고시ID, 고시일자는 관련 도시계획 조서와 행정 고시와의 연계를 통해 법적·행정적 근거와 시점을 확인할 수 있게 합니다. X좌표와 Y좌표는 GRS80 좌표계를 기준으로 생활권 중심지의 정확한 공간 위치를 나타내어, 지도서비스, 공간분석, 도시계획 시뮬레이션 등에서 활용할 수 있는 핵심 정보를 제공합니다.
