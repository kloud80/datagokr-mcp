summary_user: 경기도 이천시의 도시지역 용도지역 도형을 한 건씩 담은 파일로, 도형마다 관리번호·라벨명·도형 면적·길이 기준 면적·생성일을 기록하며 파일 크기는 약 2.4KB로 작다. 도시계획 담당자나 분석가가 이천시 도시지역이 어떤 단위로 나뉘고 각각 면적이 얼마인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(이천시) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 도시계획 수립 및 공간정보 분석을 위한 기초 자료로, 각 도시지역에 대한 현황도형 관리번호, 도형 라벨명, 면적(도형 기준), 면적(길이 기준), 현황도형 생성일 등의 항목으로 구성되어 있습니다. 도형 기반의 공간 단위에 식별 번호와 속성정보를 부여하여 도시관리계획 수립, 지형도면 제작, 토지이용현황 분석 등에 활용할 수 있으며, 면적 정보는 면적 계산 및 행정구역 경계 설정 시 근거자료로 사용됩니다. GIS 시스템과 연계하여 공간데이터 시각화 및 지역별 분석이 가능하며, 생성일 항목은 현황 도형의 갱신 주기 및 데이터 최신성 검토에 활용됩니다. 국토계획, 도시계획, 건축허가, 재개발 검토 등 다양한 공공업무의 기초자료로 활용됩니다.
