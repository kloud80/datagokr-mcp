summary_user: 대전광역시 대덕구 관내 도시공원별로 공원명·공원종류·행정동·지번주소·위도·경도와 공원 안 야외등(잔디등 포함) 개수를 한 행씩 담은 시군구 범위의 파일 데이터다(CSV 약 7.5KB). 구청 공원·안전 담당자나 분석가가 '야외등이 적어 야간 범죄 예방이 취약한 공원은 어디인가'를 확인하거나, 주민이 밤에 이용할 공원을 고를 때 쓴다. 전역 조인 키가 없어 다른 공원·보안등 데이터와는 공원명·행정동 같은 이름 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 대전광역시 대덕구에 등록된 관내 도시공원 조명시설 현황을 제공하는 공공데이터입니다.해당 데이터에는 관내 도시공원의 지번, 위치가 표기되어 있으며, 공원별 조명 시설 개수(잔디등 포함)가 포함되어 있습니다.해당 자료는 관내 도시공원의 위치 및 조명 시설의 현황을 파악하고 범죄 예방과 관련하여 미흡 사항을 분석하는데 활용되며, 공원 내 조명 시설 설치에 관한 업무의 기초 자료로 사용됩니다.민간 분야에서는 공원 시설 이용에 활용할 수 있으며, 입찰 참여 시에는 사업 계획 수립, 시장 조사 등의 용도로 활용할 수 있습니다.정기적으로 갱신 되는 본 데이터는 최신 정보를 반영 및 제공하여 행정의 투명성과 효율성을 높이는 데 기여합니다.
