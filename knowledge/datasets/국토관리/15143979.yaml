summary_user: 한국산업기술시험원이 컨테이너형 식물공장 2개 동에서 측정한 무효전력을 측정일시별로 담은 측정 원천 파일(csv, 약 54MB)로, 동별 메인 계통과 에어컨·공조기·양액기(양액 컨트롤러)·조명·LED 등 설비별 값이 열로 나뉜다. 스마트팜 전력 분석가나 연구자가 '식물공장에서 어떤 설비가 무효전력을 많이 만들어 역률 보정이나 전기요금 절감이 필요한가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 측정일 기준으로 같은 기관의 식물공장 전력 데이터(유효전력 등)와 맞춰 보는 정도로만 이어 쓴다.
description_portal: 본 데이터는 한국산업기술시험원이 식물공장에서 수집한 무효전력(Reactive Power)에 대한 정보입니다. 무효전력은 전력계통에서 실제 유효한 일을 하지 않으며, 열이나 빛을 생성하지 않는 전력으로, 주로 인덕터(코일)나 커패시터(축전기)와 같은 저장소자에 의해 발생합니다. 이 전력은 전기 설비 내부에서 에너지가 저장되었다가 다시 방출되는 과정을 반 주기마다 반복하며 나타나는 현상으로, 전력 품질과 설비 운전 효율성에 큰 영향을 미칩니다. 본 데이터는 스마트팜의 전력 사용 구조 분석, 대기전력 진단 및 절감 모델 구축, 전력 손실 최소화 전략 수립, 고조파 및 역률 보정 기술 연구 등 다양한 연구 및 산업적 활용이 가능하며, 전기요금 절감을 위한 기준 설정에도 활용될 수 있습니다. 또한, 전력계통의 안정성 확보 및 에너지 효율화 설계에 필요한 핵심 데이터로서 가치가 높습니다.
