description_portal: 전북특별자치도 임실군 도시계획정보시스템 지구단위 및 용도 테이블 정보로  도면번호(DRAWING_NO), 위치명(LOCATION_NAME), 지역명(ZONE_NAME), 면적기정(AREA_PREV) 등이 포함된 메타데이터 입니다. 임실군 전역의 토지를 대상으로 한 도시계획상의 세부 관리 단위로, 용도지역·지구·구역 지정 현황과 관련 정보를 포함하고 있습니다. 주요 항목에는 토지의 이용 목적, 지정일자, 세부 용도구분, 지구단위계획 구역 범위 등이 있으며, 임실군의 균형 잡힌 도시발전과 효율적인 토지이용을 위해 활용됩니다. 이 자료는 건축허가, 개발행위심의, 도시관리계획 수립 등 다양한 행정 업무에 필수적으로 사용되며, GIS 공간정보 형태로 연계하여 시각적 분석 및 정책 의사결정을 지원합니다. 또한 민간 부문에서도 부동산 개발, 입지 분석, 환경평가 등의 기초자료로 활용할 수 있습니다.
