summary_user: 서울특별시에서 사업장폐기물 배출자 신고를 한 사업장의 현황을 사업장 단위로 담으며, 사업장명·업종·주소가 들어 있다. 사업자나 분석가가 "서울에서 어떤 업종의 사업장이 어디서 사업장폐기물 배출자로 신고돼 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명이나 주소(ADDR)를 이름·주소 매칭하는 방식으로만 이을 수 있다.
description_portal: 폐기물이 발생하면 일반 가정에서는 종량제봉투를 구매 사용하여 배출 시 관할 지자체에서 공공 수거해 가고 있습니다. 그러나, 일정 규모 사업장의 경우, 폐기물관리법 제17조, 동법 제18조, 동칙 제18조에 의거 폐기물 배출량이 일 평균 300킬로그램 이상 배출 또는 건설공사 및 일련의 공사 또는 작업 등으로 인하여 폐기물을 5톤 이상 배출하는 경우, 사업장폐기물 배출자 신고를 해당 지자체에 신고하고 사업장에서 발생하는 폐기물을 스스로 처리하거나 폐기물처리업의 허가를 받은 자, 폐기물처리 신고자, 폐기물처리시설을 설치ㆍ운영하는 자에게 위탁하여 처리하여야 합니다. 본 데이터는 사업장폐기물 배출자 신고를 한 사업장의 현황 자료입니다.
