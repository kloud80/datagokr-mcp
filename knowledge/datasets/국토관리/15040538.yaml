summary_user: 서울 동작구 관내 등록 임대주택을 임대물건지 주소 단위로 한 건씩 담은 파일로, 영업구분·사업자구분·임대주택 종류(민간임대 8년 등)·주택 유형(다세대·아파트 등)을 포함한다. 전월세 계약을 앞둔 세입자나 분석가가 "동작구에서 등록임대주택이 어느 동네에 어떤 주택 유형으로 몰려 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소 문자열 매칭으로만 연결되며, 전월세 실거래와 주소 기준으로 함께 보는 것이 자연스럽다.
description_portal: 이 데이터는 서울특별시 동작구 관내에 있는 임대주택현황에 관한 것입니다. 이 데이터에는 영업구분,사업자구분, 주소, 임대주택 구분 등이 포함되어 있습니다.사업자구분(임대사업자 등) 항목을 통해 사업자의 유형을 확인할 수 있습니다.임대주택 종류(민간임대주택 8년 등) 항목을 통해 임대 기간 및 유형을 확인할 수 있습니다.임대물건지 주소 항목을 통해 임대주택의 위치 정보를 확인할 수 있습니다.임대주택 유형(다세대주택, 아파트 등) 항목에는 주택의 형태 정보가 포함됩니다.이를 통해 주택 유형별 임대 현황을 분석할 수 있습니다.
