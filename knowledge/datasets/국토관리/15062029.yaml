description_portal: '지하차도 공공데이터는 도로와 철도 등 주요 기반 시설을 지나는 지하차도(언더패스)에 대한 정보를 담고 있는 데이터입니다. 이 데이터는 도로교통 안전, 침수 예방, 도시계획, 재난 대응 등 다양한 목적에 활용됩니다. <데이터 활용 사례>1.재난 대응 및 침수 예방: 지하차도는 침수에 취약하므로, 집중호우 시 통제 또는 우회 안내에 필수2.내비게이션 및 경로 안내: 높이 제한 정보 활용해 화물차·버스 등 운행 경로 최적화3.도시계획 및 교통 정책 수립: 도심 교통 흐름 개선, 보행자 안전 고려한 설계에 활용4.공공 안전 시스템 연계: 기상 정보와 연계한 침수 예·경보 시스템 구축 가능'
