summary_user: '경기도 행정동별 카드매출을 기준년월·성연령(예: 40대 남성)·중분류 업종 단위로 나눈 집계 자료로, 매출금액과 비율·등급, 전월 및 전년 동월 대비 증감값·증감비율을 담는다. 창업 예정자나 상권 분석가가 특정 행정동에서 어떤 성별·연령대가 어느 업종에 돈을 많이 쓰고 그 매출이 전년보다 늘었는지 확인하는 데 쓴다. 행정동코드(admdong_cd)와 기준년월이 있으나 실측상 전역 조인 키로 확인되지 않아, 다른 데이터와는 행정동 이름·코드 매핑이나 같은 경기도 데이터의 코드로 연결한다.'
description_portal: 이 데이터는 경기도 내 특정 행정동에서 발생한 카드매출을 성별과 연령대별로 구분하여 제공하는 자료입니다. 기준년월을 기준으로 행정동코드, 성연령코드(M40, F30 등), 중분류업종코드(B0, C1 등), 매출금액, 매출금액비율, 매출금액등급(상대적 순위), 전월 대비 증감값 및 증감비율, 전년 동월 대비 증감값 및 증감비율, 그리고 전년동월대비증감비율등급 등이 포함됩니다. ‘성연령코드’는 성별(M=남성, F=여성)과 연령대를 조합한 코드로 소비자의 특성을 반영하며, ‘중분류업종코드’는 카드매출이 발생한 업종을 중분류 수준으로 구분한 코드입니다.
