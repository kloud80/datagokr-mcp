description_portal: BMA는 총 4개 분과에 263개 회원사가 참여하고 있으며, 분과구분은 MICE 전문시설 분과(컨벤션센터, 호텔, 유니크베뉴 등), MICE 기획운영 분과(PCO, 여행사 등), MICE 지원분과(수송, 체험, 미팅테크놀로지 등), 주최자 분과(UIA 국제기구 등록업체 등)로 구성되어 있으며, 회원사 대상 MICE 포럼, 워크숍 등을 개최하여 지역 MICE 성장 및 공동마케팅을 위한 기반을 마련하고 있으며, 해외 MICE전시회 공동참가, 국제회의 현장답사 지원 등을 통해 부산에 MICE 유치를 위한 다양한 공동 협력사업을 전개하고 있습니다.이러한 회원사 정보 중 주요 유니크 베뉴 (약 80여곳)의 주요 시설 정보(분과, 소분과, 시설명, 주소, 연락처, 홈페이지  등)  데이터를  한글과 영문으로 제공하고 있습니다.
