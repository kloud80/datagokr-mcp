summary_user: 경상북도 관할 시군에서 지정정비사업자로 지정된 자동차 정비업체를 사업장 한 곳당 한 행으로 담은 건별 목록이며, 시군·지정일자·업체명·지번/도로명 주소·전화·팩스를 담는다(CSV 파일 약 16.7KB, 활용신청 없이 내려받음). 차량 소유자가 '우리 시군에서 지정정비사업자로 지정된 정비업체는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 시군별 지정 업체 분포를 집계하는 데 쓴다. 전역 조인 키는 없어서 시군명이나 사업장 주소를 행정구역 코드나 좌표로 매핑해야 다른 데이터와 이어 쓸 수 있다.
description_portal: 경상북도 자동차 지정정비사업자 지정 현황 자료는 경상북도 관할 각 시군에 위치한 자동차 정비업체 중 관계 법령에 따라 지정정비사업자로 지정된 사업장의 기본 현황을 정리한 자료입니다. 이 자료에는 시군 구분, 지정일자, 업체명, 사업장 주소, 도로명 주소, 전화번호, 팩스번호 등의 항목이 포함되어 있습니다. 본 자료는 행정기관이 지정정비사업자 현황을 체계적으로 관리하고 점검·관리 업무를 수행하기 위한 기초 자료로 활용될 수 있으며, 민원 처리 과정에서 해당 업체 정보를 확인하는 참고 자료로도 활용될 수 있습니다. 또한 지역별 지정정비사업자 분포 현황을 파악하고 관련 행정 통계를 산출하기 위한 기초 자료로 활용할 수 있는 관리 목적의 데이터입니다.  자료 관련 문의는 054-880-2667로 하시기 바랍니다.
