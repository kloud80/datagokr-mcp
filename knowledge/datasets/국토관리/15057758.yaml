summary_user: 공동주택별 수의계약 정보를 계약 건 단위로 담는 API로, 계약명·계약업체·계약일자·계약금액·계약사유 등을 제공하며 범위는 전국이다. 입주민이나 관리 분석가가 우리 단지에서 어떤 업체와 얼마에 수의계약을 맺었는지 확인하는 질문에 쓴다. 단지코드(kaptCode, apt_complex_cd)로 K-apt의 다른 단지 정보나 실거래·공시·청약 단지와 잇고, 업체주소(companyAddr, address)도 조인 키로 쓴다.
description_portal: (공동주택 수의계약정보)「공동주택관리법 시행령 」 및 「주택관리업자 및 사업자 선정 지침」에 따라 실시하는  의무관리대상공동주택의 공사 및 용역 등 사업자를 선정하는 경우 전자입찰 방식으로 사업자를 선정할 수 있으며, 공동주택관리정보시스템으로 제공되는 전자입찰시스템을 이용할 수 있음. 다만  「주택관리업자 및 사업자 선정 지침」에 따라 해당되는 경우 '수의계약'으로 할 수  있으며 이에 따라 공동주택관리시스템에 축적된 공동주택별 공동주택 위탁관리, 공사, 용역, 물품, 기타에 관한 '수의계약' 관련 정보 제공
