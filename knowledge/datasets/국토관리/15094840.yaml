description_portal: 대구광역시 상수도사업본부 산하 정수장의 시설용량 및 연간 생산실적을 제공합니다. 산하정수장에는 매곡정수장, 고산정수장, 문산정수장, 가창정수장, 공산정수장, 죽곡정수장, 군위정수장이 있습니다(두류정수장은 2009년 8월부터 가동 중지 되었으며, 2009년 11월에 폐쇄되었음 ) 참고로 각 정수장의 연간 생산 실적은 시설 용량과 수요에 따라 변동됩니다. 예를 들어, 매곡정수장은 대구시에서 가장 큰 정수장으로, 연간 생산량이 가장 높습니다. 반면, 군위정수장과 같은 소규모 정수장은 지역 수요에 맞춰 운영되며, 생산량이 상대적으로 적습니다.
