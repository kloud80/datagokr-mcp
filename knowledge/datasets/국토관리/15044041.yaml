description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주영어교육도시의 2014년 11월 말 기준 토지공급 현황에 대한 데이터입니다. 이 데이터는 도시 내 주요 시설 유형별 토지 분양 진행 상황을 수치로 정리한 것으로, 각 구성 항목에는 구분, 전체 면적(㎡), 전체 필지수, 분양 면적(㎡), 분양 필지수, 분양율 면적(㎡), 분양율 필지수 등이 포함되어 있습니다. 구분 항목은 단독주택, 공동주택, 근린생활시설, 상업시설, 업무시설, 국제학교 등으로 세분화되어 있으며, 각 유형별로 실제 공급된 토지 면적과 필지 수, 그중 분양이 완료된 면적과 필지 수, 그리고 분양율을 면적과 필지 수 기준으로 나누어 확인할 수 있습니다. 이 정보는 영어교육도시 내 각 시설 유형별 개발 및 투자 진척 상황을 파악하고, 향후 도시계획 수립과 부지 활용 전략 수립에 있어 중요한 기초자료로 활용될 수 있습니다.
