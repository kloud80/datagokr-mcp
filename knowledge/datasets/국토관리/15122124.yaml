summary_user: 2023년도 서울주택도시공사가 공급했거나 공급할 재개발임대주택 신규 단지를 단지별 한 행으로 정리한 소규모 파일(csv, 905바이트)로, 단지명·소재지·전용면적 구간별(35㎡ 이하, 36~45㎡, 46~60㎡) 공급예정 세대수와 합계, 준공(예정)월, 철거민 특별공급 예정월, 현재상태를 담는다. 재개발 구역 철거민이나 임대주택 입주 희망자가 '어느 동네 재개발 단지에서 몇 ㎡형 임대가 언제 나오는가'를 확인하거나, 분석가가 서울 재개발임대 공급 물량을 면적대·지역별로 집계하는 데 쓴다. 전역 조인 키가 없어 소재지 주소를 행정구역 코드로 직접 매핑하거나 단지명으로 정비사업 현황·입주자 모집 공고 같은 다른 SH공사 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 2023년도 서울주택도시공사(SH공사)에서 공급했거나 공급을 예정하고 있는 재개발임대주택의 신규 단지 공급계획을 정리한 자료입니다. 항목에는 공급 단지명, 소재지(주소 또는 행정구역), 전용면적별 공급 예정 물량(세대수) 등이 포함되어 있으며, 이를 통해 서울시 내 재개발사업을 통해 신규 조성된 임대주택이 언제, 어디에서, 어느 규모로 공급되는지를 확인할 수 있습니다. 전용면적 구분은 40㎡ 이하, 50㎡대, 60㎡ 이상 등 다양한 면적대별 수요 대응 여부를 판단하는 데 활용될 수 있으며, 주거 취약계층의 주거 안정성을 위한 공공임대 확대 정책의 실행 현황을 분석하는 데에도 유용합니다. 또한 공급 예정 정보는 지역 기반 정책 수립, 인근 기반시설 수요 예측, 입주 수요 분석 등 다양한 도시계획 및 주거복지 분야에서 활용 가능합니다.
