summary_user: 구리시에 등록된 전문건설사업자를 업체 한 곳당 한 행으로 담은 파일(csv 약 23KB)로, 상호·주력분야·영업소재지 도로명주소를 담는다. 구리시 안에서 지반조성·포장·실내건축 같은 특정 주력분야 시공 업체를 찾으려는 발주자나 주민, 지역 건설업체 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 상호 이름 매칭이나 도로명주소(영업소재지) 기반 주소·좌표 매칭으로만 잇는다.
description_portal: '본 데이터는 구리시에서 관리하는 전문건설업체의 등록 현황 정보를 제공합니다. 건설산업기본법에 따라 각 시·군·구에 등록된 업종별 전문건설사업자의 상호, 주력분야, 영업소재지 등의  내역을 포함하고 있습니다."* 항목별 상세설명 - 상호 : 건설업 면허를 보유한 법인 또는 개인사업자의 공직명칭입니다.- 주력분야 : 2022년 건설업 대업종화 시행 이후 도입된 개념으로, 해당업체가 실제로 시공할 수 있는 세무 전문 공증을 의미합니다.  (예 지반조성, 포장, 실내건축, 금속창호, 지붕건축물조립 등)- 영업소재지 : 사업자등록증상 등록된 사무실의 소재지 입니다.'
