summary_user: 성주군 관내 제조업체를 업체 한 곳당 한 행으로 정리한 목록 파일(CSV, 약 84KB)이며, 회사명·대표자명·전화번호·공장 대표주소·업종명·데이터기준일자를 담는다. 지역 사업자나 분석가가 "성주군에 어떤 업종의 제조공장이 어디에 몰려 있나"를 확인하거나, 행정 담당자가 지원사업 안내 대상 업체를 추릴 때 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없으므로, 팩토리온 공장등록 정보나 다른 시군구 공장 현황과 이으려면 회사명·주소 문자열을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 성주군 관내 제조업체의 현황을 체계적으로 파악하기 위해 구축된 자료이다. 회사명과 대표자명을 포함하여 기업의 기본 정보와 경영 주체를 명확히 확인할 수 있도록 구성하였다. 또한 전화번호와 공장 대표주소 정보를 제공하여 행정 민원 처리, 기업 관리, 지원사업 안내 등 다양한 업무 수행에 활용 가능하도록 하였다. 업종명을 포함함으로써 산업별 기업 분포와 특성을 분석할 수 있으며, 데이터기준일자를 명시하여 시점별 변동 사항을 추적하고 최신 정보를 유지할 수 있도록 하였다. 본 자료는 제조업체 관리, 산업 정책 수립, 지역 경제 분석 등 행정 및 통계 목적으로 활용 가능한 기초 데이터로 설계되었다.
