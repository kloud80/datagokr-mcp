summary_user: 경기도 시군별로 집계연도마다 총인구·급수인구·상수도 보급률과 광역·지방·타시도 상수도 시설용량(㎥/일)을 정리한 집계 통계다. 도·시군 담당자나 분석가가 '우리 시군의 수돗물 보급률이 경기도 다른 시군보다 낮은가, 광역상수도 의존도는 얼마나 되는가' 같은 질문에 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)과 집계연도를 이름 매칭해 인구·정수장 등 다른 시군 단위 자료와 잇는다.
description_portal: 이 데이터는 특정 집계연도를 기준으로 경기도 내 각 시군의 상수도 보급 현황을 정리한 자료로, 수돗물 공급 상태를 다각도로 분석할 수 있는 통계정보를 제공합니다. 주요 항목으로는 집계년도, 시군명, 총인구수, 급수인구수, 보급률(%), 광역상수도시설용량, 지방상수도시설용량, 타시도 시설용량 등이 포함되어 있으며, 각 항목은 하루 처리 가능한 수돗물 용량(㎥/일) 단위로 명시됩니다. 상수도 보급률은 총인구수 대비 급수인구수로 계산되어, 해당 지역의 수돗물 공급 비율을 나타내며, 이를 통해 지역 간 물 복지 격차와 상수도 인프라 구축 수준을 비교·분석할 수 있습니다. 데이터는 경기도의 물관리 정책 수립, 취약지역 인프라 개선, 환경 관련 보고서 작성 및 공공 서비스 기획에 활용될 수 있으며, 특히 지역사회 개발 및 지속가능한 수자원 관리에 필요한 기초자료로 유용합니다. 사용자는 시설용량 수치 해석 시 단위(㎥/일)에 유의해야 하며, 급수인구수와 총인구수 기준의 통계 정의 차이에 따라 보급률 해석 시 주의가 요구됩니다. 관련 법령으로는 「수도법」이 있으며, 경기도 물관리 종합계획 및 환경부 관련 지침이 참조될 수 있습니다.
