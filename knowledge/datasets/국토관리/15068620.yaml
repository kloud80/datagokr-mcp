summary_user: 안산시 관내 주요 민간단체를 단체 한 곳당 한 행으로 정리한 목록으로, 소관 부서, 단체명, 소재지, 대표 연락처, 데이터 기준일자를 담은 약 4.6KB 크기의 CSV 파일이다. 시민이나 사업자가 안산시에서 특정 분야 단체의 위치와 연락처, 담당 부서를 찾을 때 쓰고, 분석가는 단체 지원사업이나 지역 시민사회 네트워크를 파악할 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 단체명을 맞추거나 소재지 주소를 주소·좌표로 바꿔야 연결된다.
