summary_user: 전라남도 나주시 도시계획정보시스템(UPIS)에 등록된 개발행위허가 제한지역을 도형 단위로 담은 시군구 범위의 파일 데이터로, 도형 관리번호·분류코드·결정고시관리코드와 함께 각 도형의 면적과 길이를 담는다(파일 크기 757바이트의 소규모 자료). 나주시에서 토지 개발이나 건축을 검토하는 사업자·분석가가 '나주시에 개발행위허가가 제한된 지역이 어디이고 면적이 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드나 결정고시관리코드, 라벨명 같은 이름·코드 매핑으로만 이어 쓴다.
limits: 전역 조인 키가 없어 필지·지번 단위 토지 정보와 바로 연결되지 않고, 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 명세상 연간·이벤트 주기로 생성 후 바뀌지 않는 자료로 표기되어 있어, 최신 제한 현황인지는 별도로 확인해야 한다.
