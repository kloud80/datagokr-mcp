summary_user: 경상북도개발공사가 경북도청이전신도시 B-7BL에 공급한 10년 공공임대 단지(코오롱하늘채)의 주택타입별 정보를 담은 작은 CSV 파일로, 타입별 수용세대·전용/공용면적·주소·최초입주시기·분양전환시기를 행으로 담는다. 경북도청 신도시 공공임대 입주를 검토하는 사람이나 분석가가 "이 단지의 타입별 전용면적과 세대수는 얼마이고 분양전환은 언제부터인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 도로명·지번주소나 단지명을 이름 매핑해 전월세 실거래 등 다른 주택 데이터와 연결한다.
description_portal: 경상북도개발공사 경북도청 신도시 공공임대주택정보(주택타입, 수용세대, 면적, 주소, 분양전환시기 등)입니다. 공사에서 추진 중인 임대주택의 단지명은 코오롱하늘채이며, 10년 공공임대 형태입니다. 분양전환시기는 최초 입주 지정기간 종료일이 속하는 월의 다음달 1일부터 10년 이후로 모두 동일합니다. 사업 지구명은 경북도청이전신도시 B-7BL이며 최초입주시기는 2020년7월입니다. 주택타입은 60A 부터 총 11개 타입으로 구성되어 있으며, 수용세대는 총869세대입니다.
