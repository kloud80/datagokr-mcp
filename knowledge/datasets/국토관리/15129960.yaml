summary_user: 평택시 도시계획정보시스템(UPIS)에서 뽑은 보존지구 현황을 도형 단위로 담은 CSV 파일로, 도형 관리번호·결정고시관리코드·라벨명·도형 면적과 길이 등을 담으며 파일 크기가 687바이트에 그쳐 건수가 매우 적다. 평택시 안에서 보존지구가 어디에 어느 면적으로 지정돼 있는지 확인하려는 토지 소유자나 도시계획 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 시군구코드나 결정고시관리코드 같은 기관 내부 코드로 같은 평택시 UPIS 용도지역·지구 데이터와 맞춰 쓰는 정도만 가능하다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 보존지구현황으로 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다. 보존지구란 토지의 이용 및 건축물의 용도, 건폐율, 용적률, 높이 등에 대한 용도지역의 제한을 강화하거나 완화하여 적용함으로써 용도지역의 기능을 증진시키고 미관, 경관, 안전 등을 도모하기 위해 도시·군관리계획으로 결정하는 지역을 말합니다데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
