summary_user: 도시관리계획으로 결정된 용도지구 중 고도지구(건축물 높이를 제한하는 지구)를 전국 범위로 제공하는 외부 API(vworld.kr)이며, 지구 명칭(uname), 연도(dyear), 번호(dnum), 시도명·시군구명을 담는다. 특정 지역에 건물 높이 제한 지구가 지정돼 있는지 확인하려는 국민·사업자나 토지이용규제를 분석하는 사람이 쓴다. 국토계획법상 용도지역·지구·구역 체계의 다른 용도지구 데이터와 시도명·시군구명 같은 이름 기준으로 연결하며, 전역 조인 키는 확인되지 않는다.
description_portal: '#. 용도지역토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등을 제한함으로써 토지를 경제적·효율적으로 이용하고 공공복리의 증진을 도모하기 위하여 서로 중복되지 않게 도시관리계획으로 결정하는 지역으로  도시지역, 관리지역, 농림지역, 자연환경보전지역으로 구분#용도지구토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역의 제한을 강화 또는 완화하여 적용함으로써 용도지역의 기능을 증진시키고 미관·경관·안전 등을 도모하기 위하여 도시관리계획으로 결정하는 지역으로 경관지구, 미관지구, 방화지구, 방재지구, 고도지구, 보존지구, 시설보호지구, 취락지구, 개발진흥지구, 특정용도제한지구로 구분 #. 용도구역토지의 이용과 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역 및 용도지구의 제한을 강화 또는 완화하여 따로 정함으로써 시가지의 무질서한 확산방지, 계획적이고 단계적인 토지이용 도모, 토지이용의 종합적 조정·관리 등을 위하여 도시관리계획으로 결정하는 지역으로 개발제한구역, 시가화조정구역, 도시자연공원구역, 수산자원보호구역으로 구분 RestAPI로 호출하면 json/xml로 데이터를 반환합니다'
