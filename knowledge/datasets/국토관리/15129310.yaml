description_portal: 본 데이터는 경남개발공사가 청년층의 주거안정을 지원하기 위해 시행하는 청년매입임대주택 입주자 모집 시 평가기준 및 배점 현황을 정리한 것입니다. 입주자를 선정하기 위한 정량적 평가 기준에 따라 항목별 점수 배점, 해당 조건 충족 여부(선택 여부), 선택 점수 등이 포함되어 있으며, 평가 항목에는 주거형태, 장애여부, 수급자 여부, 소득 수준, 부모 무주택 여부 등 사회경제적 조건이 반영됩니다.이 데이터는 실제 평가 점수 산정 방식의 투명성을 확보하고, 입주자 선발의 공정성 제고 및 향후 평가 기준 개선을 위한 기초자료로 활용될 수 있습니다. 또한, 청년 주거복지 정책 수립, 지역 맞춤형 임대주택 정책 연구, 사회 취약계층 지원 방안 마련 등에 활용이 가능합니다.데이터는 항목별 점수 기준, 평가 점수, 선택 여부, 선택 점수, 등록일시 등을 포함하고 있으며, 특정 개인을 식별할 수 있는 정보는 포함되어 있지 않아 공개에 제한이 없습니다. 이 데이터는 2025년 기준 입주자 모집 평가 기준을 중심으로 일회성 수록된 정보입니다.
