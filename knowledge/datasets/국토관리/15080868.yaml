summary_user: 인천광역시 추정분담금정보시스템에 등록된 정비사업 조합별로 구·구역명·위치·면적(제곱미터)·사업유형·추진단계·국공유지·사유지·토지 필지 수·용도지역을 한 행씩 담은 구역 단위 토지현황 파일(CSV, 약 5.8KB)이다. 정비사업 조합원이나 사업성 분석가가 "이 구역은 사유지 비중이 얼마이고 용도지역이 무엇이어서 보상 규모와 개발 규모가 어느 정도일까"를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 정비구역 데이터와는 구 이름·구역명칭을 문자로 맞춰 이어 쓴다.
description_portal: 인천광역시 추정분담금정보시스템 등록된 조합에 대한 토지정보(구명, 구역명칭, 위치,면적,사업유형,추진단계, 사업시행자, 국공유지, 사유지, 토지 필수지(필지), 용도지역 등)에 대한 정보<활용 목적>이 자료는 정비사업의 사업성 분석 및 재정 계획 수립의 핵심 기초 자료입니다. 국공유지 및 사유지 비율 분석을 통해 토지 확보 난이도 및 보상 규모를 예측하고, 용도 지역을 통해 최대 개발 가능 용적률 및 사업 규모를 파정하는 데 중요하게 사용됩니다.인천시 정비사업의 토지 자산 현황 파악 및 효율적인 사업성 분석을 위한 핵심 기반 정보입니다.
