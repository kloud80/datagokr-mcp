summary_user: 전북특별자치도 안에서 추진 중인 재건축 구역을 한 행씩 담은 작은 CSV 파일(약 2.5KB)로, 구역명·지역·기존/신축 세대수·시공사와 정비구역지정부터 추진위 승인, 조합설립, 사업시행, 관리처분, 착공, 준공까지의 단계별 날짜를 담는다. 부동산 투자자나 지역 주민이 "전주의 어느 재건축 구역이 관리처분인가를 받았고 착공은 언제였나"처럼 구역별 진행 단계와 신규 공급 세대수를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명·구역명 같은 이름을 맞춰 붙여야 한다.
description_portal: 본 데이터는 전북특별자치도 내에서 추진 중인 재건축 사업의 현황을 상세히 담고 있는 자료입니다. 각 재건축 구역의 명칭, 기존 및 신축 세대수, 시공사 등 기본적인 정보와 함께, 정비구역 지정부터 조합설립인가, 사업시행인가, 착공 및 준공에 이르기까지 사업의 전체 진행 단계를 날짜별로 추적하고 있습니다. 이 자료는 노후 공동주택의 정비 현황과 신규 주택 공급 계획을 명확하게 파악할 수 있게 해주며, 부동산 개발, 건설, 그리고 도시 계획 분야의 관계자들이 사업의 진척 상황을 모니터링하는 데 필수적인 정보를 제공합니다.
