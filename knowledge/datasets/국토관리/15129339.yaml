summary_user: 경기도 아파트 매매 실거래를 거래 건별 원천 수준으로 담으며, 단지명·지번·전용면적·계약연월일·거래금액·층·건축년도와 정제된 도로명·지번 주소, 우편번호, WGS84 경위도 좌표를 포함한다. 분석가나 실수요자가 "경기도 특정 단지·동네의 같은 면적 아파트가 최근 얼마에 거래됐고 가격이 어떻게 움직였나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지번·도로명 주소나 단지명 매칭, 또는 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 아파트 매매 실거래가 정보를 원천 수준에서 수집한 기본자료입니다. 주요 항목으로는 주소, 지번주소, 지번본번, 지번부번, 단지명, 전용면적, 계약연월, 계약일, 거래금액, 층명, 건축년도, 도로명 등이 포함됩니다. 이 데이터는 특정 시점과 지역에서의 거래가격, 면적, 건축연도, 위치좌표 등을 기반으로 주택 가격 변동을 추적하고, 지역별 부동산 시장 동향을 파악하는 데 활용할 수 있습니다. 또한 부동산 가치평가, 주거정책 수립, 도시개발 계획 수립, 금융기관의 담보평가, 연구기관의 주거환경 분석 등에 유용하게 사용될 수 있습니다.
