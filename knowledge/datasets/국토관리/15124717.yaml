summary_user: 시흥시 관내 기계설비 성능점검 대상 건축물을 건물 한 동씩 담은 목록으로, 용도·건물명·소유자명·지번 및 도로명 주소·연면적·데이터 기준일을 담는다(CSV 파일 약 42KB). 시설 관리자나 점검업체가 '우리 건물이 성능점검 대상인지, 시흥시에 연면적 기준을 넘는 대상 건물이 어디에 몇 곳 있는지'를 확인하거나 점검 계획을 세울 때 쓴다. 전역 조인 키(건축물대장 고유번호 등)는 없으므로, 건축물대장이나 다른 건물 데이터와는 지번·도로명 주소나 건물명을 맞춰서 이어 쓴다.
description_portal: 본 데이터는 시흥시 관내 기계설비 성능점검 대상 건축물의 현황 정보를 제공합니다. 제공 항목에는 건물의 용도, 건물명, 소재지, 도로명 주소, 연면적, 데이터 기준일 등이 포함되어 있습니다. 이 데이터는 기계설비의 유지관리 및 안전 확보를 위한 기초 자료로 활용될 수 있으며, 법정 점검 대상 건축물의 관리 현황을 파악하는 데 도움을 줍니다. 연면적에 따라 점검 대상이 되는 시설을 구분할 수 있어 관련 기관의 점검 계획 수립이나 민간업체의 기술진단 업무 등에도 유용하게 사용될 수 있습니다. 또한 설비 노후화에 따른 안전관리 사각지대를 줄이고, 도시 내 건축물의 설비 안전성 향상과 관리 효율성 제고를 위한 정책 수립의 기반 자료로 활용 가능합니다.
