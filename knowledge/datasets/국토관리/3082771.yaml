summary_user: 제주시 관내 농공단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일로, 회사명·단지명·전화번호·생산품·주소와 데이터기준일자를 담는다. 제주시 농공단지에 어떤 업체가 무엇을 만들고 있는지 확인해 거래처·협력업체를 찾거나 구직·영업 대상을 고르려는 사업자와 구직자가 쓴다. 전역 조인 키(사업자번호 등)가 없어 공장 등록 자료 등과는 회사명·주소 같은 이름 매칭이나 단지명 기준으로만 이어 쓴다.
description_portal: 제주특별자치도 제주시 관내 농공단지 입주기업 현황 데이터는 제주시 지역 농공단지에 입주한 기업의 기본 정보를 제공하는 공공데이터입니다. 회사명, 단지명, 전화번호, 생산품, 주소 등의 항목으로 구성되어 있으며, 기업별 입주 단지와 주요 생산품, 소재지 및 연락처를 확인할 수 있습니다. 본 데이터는 농공단지별 입주기업 분포 파악, 지역 제조업 및 가공산업 현황 분석, 거래처·협력업체 발굴, 기업 지원정책 수립, 산업단지 관리, 지역경제 활성화, 공공데이터 기반 기업 검색 및 지도 서비스 구축 등에 활용할 수 있습니다.
