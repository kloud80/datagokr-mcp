description_portal: '강원특별자치도 동해시 수도급수공사 대행업체 현황 공공데이터는 업체명, 대표자명, 전화번호, 도로명주소, 지정시작일, 지정종료일로 이루어져 있습니다.이 공공데이터의 활용 분야는 다음과 같습니다.○ 급수설비 시공·복구 관리 : 누수, 계량기 설치, 급수관 인입공사 등 시공 시 지정된 적격 대행업체 조회 및 선정○ 민원·서비스 제공 : 시민이 수도공사 진행시 믿을 수 있는 업체 조회 민원인이 “대행업체 허가 여부”를 쉽게 확인○ 산업·시장 분석:　지역별 급수공사 업체 분포 및 공급력 분석하여 상수도 시공 시장 규모 파악○ 투명한 공사관리: 무등록 업체의 불법 공사 방지, 공사 책임 소재 명확화 및 부정 행위 예방'
