summary_user: 강릉시 성남동 중앙시장 안 상점을 한 곳씩 담은 목록으로, 상호명·운영시간·업종구분·도로명/지번주소·전화번호·위도·경도와 전자도면(SHP)을 담는다. 시장 상권을 분석하는 연구자나 관광 안내·지도 서비스를 만드는 사업자가 '중앙시장에 어떤 업종 가게가 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 주소나 위도·경도로 다른 공간 데이터와 겹쳐 보거나, 강릉시의 다른 전통시장 데이터와 상호명·시장명(전통시장명)으로 맞춰 쓴다.
description_portal: 강원특별자치도 강릉시 성남동에 위치한 중앙시장 관련 데이터는 시장 내 상점의 상호명, 운영시간, 업종구분, 도로명주소, 지번주소, 전화번호, 위도·경도, 그리고 전자도면(SHP) 정보를 제공합니다.본 데이터는 2021년 기업매칭 지원사업으로 구축되었으며, 시장 상권 분석, 상점 위치 기반 서비스, GIS 지도 시각화, 지역경제 연구, 관광 안내, 편의 서비스 개발 등 행정·연구·산업 분야에서 활용 가능합니다.제공되는 SHP 파일은 QGIS, ArcGIS 등 GIS 소프트웨어에서 사용 가능하며, 지도 제작, 상점 분포 분석, 공간 기반 정책 수립 등 시각화와 공간 분석에 유용합니다.
