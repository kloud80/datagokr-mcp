description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 방재시설 현황 정보를 제공합니다. 하천, 유수지, 저수지, 방화설비, 방풍설비, 방수설비, 사방설비, 방조설비 등 재난과 재해를 예방하고 피해를 최소화하기 위한 시설의 위치와 규모 정보를 담고 있습니다. 현황도형 관리번호는 각 시설을 고유하게 식별하며, 라벨명은 시설의 명칭을 나타냅니다. 면적은 시설이 차지하는 부지 면적을 제공하고, 길이는 선형 시설의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 재난 관리, 방재 계획 수립, 재해 예방 정책, 안전 시설 관리, 도시 안전 계획 등에 활용됩니다.
