summary_user: 대규모 택지개발지구 지정 등에 따라 투기와 난개발을 막으려고 한시적으로 지정한 개발행위허가제한지역을 전국 범위로 담은 외부 API(vworld.kr) 데이터이다. 토지 소유자나 개발 사업자, 분석가가 어떤 지역이 개발행위허가 제한 대상인지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명이나 같은 기관 코드를 매핑해서만 이어 쓰며, 개발행위허가를 다루는 국토계획법 체계(개발행위허가 §56~§65)의 맥락에서 본다.
description_portal: 대규모 택지개발지구지정 등으로 인해 인접한 지역에 부동산 투기 및 난개발을 방지 등을 하기 위하여 한시적으로 개발행위제한지역을 지정함RestAPI로 호출하면 json/xml로 데이터를 반환합니다.
