summary_user: 경기도 구리시 일반건축물의 시가표준액을 필지·건물(동·호) 단위로 담은 파일로, 법정동·특수지·본번·부번과 해당년도, 연면적, 시가표준예상액(원)을 건물별로 기록한다. 구리시 건물 소유자나 세무·부동산 분석가가 특정 건물의 재산세 과세 기준 가액이 얼마인지, 공시가격과 비교해 어느 수준인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 법정동코드와 본번·부번을 조합한 지번 매칭이나 같은 기관 자료와의 이름 매핑으로만 건축물대장·공시지가 등 다른 자료와 연결한다.
