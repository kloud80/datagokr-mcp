description_portal: '홍수 예측을 위해 한강홍수통제소에서 관측하는 예보유역 별 수리학적홍수예측정보입니다. 구간코드, 지류코드, 단면코드, 단면명칭을 적용기간 별로 제공합니다.수리학족 홍수예측모형인 FLDWAV의 입력정보 중 하나인 내부경계조건 정보로 구성됩니다.1. 내부경계조건의 정의 및 역할  - 수치해석 시 하천 중간에 댐이나 보 같은 구조물이 있으면 흐름이 급격히 변하여 일반적인 미분 방정식만으로는 계산이 불가능해집니다.   이때 해당 지점에서 유량($Q$)과 수위($H$)의 관계를 별도로 설정해주는 것이 내부경계조건입니다.2. 주요 내부경계조건의 종류FLDWAV에서 주로 다루는 내부경계조건은 다음과 같습니다.  - 댐(Dams): 댐의 수문 방류량,   - 오버플로(Overflow), 또는 댐 붕괴 시의 유출량을 계산하기 위한 조건입니다.  - 교량 및 암거(Bridges and Culverts): 교각에 의한 손실이나 수중 오리피스 흐름 등을 반영합니다.  - 보(Weirs) 및 폭포: 낙하하는 흐름에 의한 수위 변화를 정의합니다.  - 지류의 합류(Confluence): 본류와 지류가 만나는 지점에서 유량의 합계와 수위의 일치를 계산합니다.  - 수문(Gates): 수문의 개폐 정도에 따른 유량 조절을 반영합니다.'
