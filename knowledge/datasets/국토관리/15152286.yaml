description_portal: 영덕군 관내 수도급수공사 대행업체현황자료입니다. 공공데이터 제공신청에 따라 제공 되는 자료로 업체명, 대표자, 주소, 연락처, 계약기간 정보를 포함하고 있습니다.현재 수도급수공사 대행업체 계약기간은 2년으로 2024년부터 2025년까지가 계약기간으로 되어 있으며 내년부터는 다시 대행 업체가 지정됩니다.수도급수공사대행업체 란,지자체(시청·군청 등)나 수도사업자가 수도 관련 공사(수도 계량기, 급수관, 인입공사 등)를 직접 하지 않고 민간 업체에 위탁하여 수행하게 한 경우, 그 공사를 대행할 수 있도록 지정된 업체를 말합니다.
