summary_user: 부산광역시 상수도사업본부 수용가정보시스템의 요금 고지 결과를 고지년월·사업소·구·동별로 상하수도 구분, 상수도 업종, 계량기 구경에 따라 고지 전수(건수)로 집계한 파일(CSV)이며, 범위는 시군구, 행정단위는 읍면동이다. 분석가가 "부산 각 구·동에서 업종별·구경별로 매달 몇 건의 수도요금이 고지되는가"처럼 지역별 급수 수용가 규모와 추이를 살필 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 구명·동명 같은 이름 매핑이나 같은 기관의 사업소·구·동 코드로만 이어 쓴다.
limits: 집계 자료라 개별 수용가나 고지 금액은 담지 않는다. 전국 공통 행정코드 같은 조인 키가 확인되지 않아, 타 기관 데이터와 붙일 때는 이름 기반 매핑이 필요하다.
