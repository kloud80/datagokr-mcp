summary_user: 경기도 과천시 상수도 요금표를 업종·사용량 단계별로 세제곱미터당 단가(원)로 담은 작은 CSV 파일(1,743바이트)로, 건별 사용 기록이 아닌 요금 기준표입니다. 과천시에서 가정·영업용 등 업종별로 물을 일정량 쓸 때 요금이 얼마인지 확인하거나 다른 지자체와 수도 단가를 비교하는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체 요금표와는 업종·단계 이름을 맞춰 붙이거나 관리기관(과천시) 기준으로만 연결한다.
description_portal: 공공데이터 포털에 등록되어있는 경기도 과천시의 상수도 요금에 관한 데이터로 , 키워드로는   상수도 단가, 상수도 업종별 요금, 상수도 사용량 요금, 상수도, 수도세 총 5개의 키워드로 구성되어있습니다. 제공되는  항목으로는 업종, 단계, 사용량(세제곱미터기준), 상수도 단가(세제곱미터 기준), 관리기관, 연락처 , 데이터 기준일자 등으로 구성되어 있습니다.  지역별 수도요금 차이 분석, 정책 비교, 산업용수 비용 예측, 환경 및 에너지 연구, 도시개발 계획 수립, 기업 입지선정 등의 업무 활용에 사용할 수 있습니다.
