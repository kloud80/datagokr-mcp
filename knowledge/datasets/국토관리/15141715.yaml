summary_user: 한강홍수통제소 도시침수 지도를 바탕으로, 재현빈도(30·50·80·100년)별로 침수심 5개 구간(0.5m 이하부터 5.0m 초과까지)의 침수면적(km²)을 전국 단위로 집계한 통계를 담는다. 방재 담당자나 분석가가 '100년 빈도 집중호우 때 전국에서 1m 넘게 잠기는 도시 면적이 얼마인가'처럼 빈도별 도시침수 규모를 가늠하는 데 쓴다. 실측 컬럼에 지역코드 같은 전역 조인 키가 없고 빈도 구분(fldlvFreq)만 있어, 같은 기관의 다른 홍수위험지도 자료와 빈도 값으로 맞춰 비교하는 정도로만 이어 쓴다.
description_portal: 환경부 한강홍수통제소에서 제공하는 홍수위험지도 중 도시침수 지도를 기반으로 장마철 갑작스럽게 내리는 국지적 집중호우·돌발호우 등으로 유발되는 도시침수 결과의 5단계로 이루어진 침수심별(0.5m 이하, 0.5~1.0m, 1.0~2.0m, 2.0~5.0m, 5.0m 이상) 침수면적(km² 단위) 통계 데이터를 전국단위, 빈도별(30년, 50년, 80년, 100년)로 구분하여 침수면적 통계 데이터를 조회할 수 있는 서비스 입니다. 사용자는 이러한 침수면적 통계 데이터를 통해 해당 지역의 도시침수로 인한 침수 규모의 정도를 판단할 수 있습니다.
