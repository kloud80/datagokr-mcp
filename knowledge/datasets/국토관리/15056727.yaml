summary_user: 경기도 시군별 하수관로 설치 현황을 연도 단위로 집계한 자료로, 총계획연장·총시설연장, 합류식·오수관·우수관별 연장과 관로 보급률(%)을 담는다. 지자체 담당자나 분석가가 '우리 시군의 하수관로 보급률이 도내 다른 시군보다 낮은지, 아직 합류식 관로 비중이 큰지'를 비교해 하수도 확충계획이나 수질관리 정책을 검토할 때 쓴다. 전역 조인 키는 실측되지 않았으므로 시군명(SIGUN_NM)이나 시군코드를 이름·코드 매핑으로 맞춰 하수처리장·처리구역·방류수 수질 같은 다른 하수도 자료와 이어 쓴다.
description_portal: '이 데이터는 경기도 내 하수관로의 설치 및 보급 현황을 시군 단위로 집계한 자료로, 각 지역별 하수관로 총계획연장, 총시설연장, 관로유형별(오수관, 우수관, 합류식) 연장길이, 그리고 전체 관로 보급률(%)을 포함하고 있습니다. 하수관로는 생활하수나 우수(빗물) 등을 위생적이고 효율적으로 처리하기 위한 필수 기반시설로, 본 데이터는 지역의 수질관리 정책, 하수처리 기반시설 확충계획 수립, 환경 영향 분석 등에 활용될 수 있습니다. 데이터는 XML 및 JSON 형식으로 제공됩니다.- 오수관: 생활하수(변기, 세면대 등에서 발생하는 오염된 물)를 수거하여 하수처리장으로 보내는 하수관입니다.- 우수관: 빗물이나 지하수 등 비교적 오염이 덜한 물을 모아 자연방류하거나 처리하는 하수관입니다.- 합류식 하수관: 오수와 우수를 하나의 관로에서 함께 수송하는 방식으로, 초기 도시계획 시 주로 사용된 방식입니다.- 하수관로 보급률: 해당 지역 내 하수관로가 설치된 비율을 의미하며, 수질 환경 관리와 공공위생의 지표로 활용됩니다.'
