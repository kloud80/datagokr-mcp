summary_user: 경기도 과천시의 주거용을 제외한 일반·집합 건축물 시가표준액을 과세연도별로 담은 파일로, 일반건축물은 동별, 집합건축물은 호별로 합산한 금액이 법정동·본번·부번·동·호 단위로 기록된다. 과천시 안의 상가·사무실 같은 비주거 건물 소유자나 분석가가 특정 건물의 취득세·재산세 과세표준 기준이 되는 가액이 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치단체코드와 법정동·본번·부번 같은 지번 정보를 이름·코드로 맞춰 건축물대장이나 다른 시군구의 같은 데이터와 연결해야 한다.
description_portal: '경기도 과천시 일반 및 집합 건축물시가표준액(주거용 건물 제외)에 관한 내용으로 시도 및 시군구 정보, 자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 건물형태,  시가표준액, 등의 정보를 제공합니다.일반 건축물 동별 기준으로 시가표준액 합산, 집합건축물 호별  기준 시가표준액 합산합니다.● 시가표준액: 시가 그 자체는 아니지만 취득세, 재산세 등 세목별 과세표준의 기준이 되는 물건의 적정가액으로 지방자치단체의 장이 결정 고시한 가액(지방세 시가표준액 조사 산정 기준 제2조 제1호)'
