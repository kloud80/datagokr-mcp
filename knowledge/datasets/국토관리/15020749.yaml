description_portal: 해당 데이터는 경기도 부천시의 지식산업센터(구 아파트형공장) 건물에 대한 기본적인 정보입니다.지식산업센터의 명칭, 소재지(도로명 및 지번 주소), 위도와 경도, 면적(공장시설, 지원시설, 부지면적), 용도지역, 유치가능업체수, 공장동수 및 층수, 분양형태,  착공 및 준공연도, 사용승인일 등으로 구성되어 있습니다.현재 부천시에는 53개소, 9,588개 호실의 지식산업센터가 있습니다.관리실 전화번호는 사용 승인시 제출해야하는  필수 사항이 아니므로 정보가 부존재함을 양해하여 주시기 바랍니다.
