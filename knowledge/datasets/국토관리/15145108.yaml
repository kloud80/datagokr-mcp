description_portal: '이 자료는 부산광역시 부산진구에 등록되어 있는 조경업체들의 기본 정보를 체계적으로 정리한 것입니다. 조경업체의 전반적인 현황을 파악할 수 있도록 구성되어 있으며, 각 업체의 상호명, 현재 영업 상태(예: 운영 중, 폐업 등), 업종 분류, 주요 사업 분야(예: 조경설계, 시공, 관리 등), 우편번호, 도로명 주소, 전화번호 등의 항목을 포함하고 있습니다. 이를 통해 부산진구 내 조경업계의 현황을 한눈에 파악하고, 필요한 경우 업체별로 상세 정보를 쉽게 확인할 수 있도록 하였습니다.또한 본 자료는 기후변화 대응, 도시 녹지 확대, 탄소중립, 생태복원, 스마트시티 구축, ESG(환경·사회·지배구조) 경영 등 최근 사회적 관심이 집중되고 있는 이슈들과 조경업의 연관성을 고려하여, 관련 데이터 활용에 도움이 될 수 있도록 정리하였습니다.'
