summary_user: 충청남도 도시계획정보(UPIS)에 등록된 지구단위계획구역을 구역 도형 하나당 한 행으로 담은 파일로, 도형 관리번호·라벨명·면적(제곱미터)·경계 길이(미터)가 들어 있다. 도시계획 담당자나 개발사업 검토자가 충남 안에서 어떤 지구단위계획구역이 얼마나 넓게 지정돼 있는지 구역별 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 라벨명(구역 이름)을 맞추거나 같은 기관의 UPIS 자료끼리만 이어 쓴다.
limits: 구역의 좌표나 경계 도형 자체는 없고 면적·길이 수치만 있어 지도 위에 구역을 표시할 수 없다. 시군 코드 같은 공통 키가 없으므로 다른 데이터와 연결하려면 이름 매칭에 의존해야 한다.
