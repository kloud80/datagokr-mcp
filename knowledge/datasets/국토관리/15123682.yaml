summary_user: 경기도 건축물의 표제부 정보를 건물(동) 단위로 담는다. 대지·건축·연면적, 건폐율·용적률, 구조·용도, 층수·승강기, 허가·착공·사용승인일, 내진설계 적용 여부, 오수정화시설, 지역지구구역이 들어 있다. 범위는 경기도이고 행정단위는 필지·건물이다. 분석가나 지자체 담당자가 "우리 시군에서 사용승인 30년이 넘었는데 내진설계가 적용되지 않은 건물은 어디인가" 같은 노후·안전 정비 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않았다. 그래서 토지식별번호(land_idntfy_no)나 소재지명·건물번호로 맞추는 이름·코드 매핑, 또는 같은 경기도 부동산포털 자료와만 이어 쓴다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 건물 표제부 자료로, 개별 건축물의 물리적 특성 및 건축 이력, 위생설비, 내진설계 적용 여부 등 다양한 항목을 포함한 건축물 기본정보를 제공합니다. 주요 항목으로는 '건물번호', '토지소재지', '건물명', '건축물대장종류', '건축면적', '연면적', '건폐율', '용적률', '대지면적', '허가일', '착공일', '사용승인일', '오수정화시설_형식', '오수정화시설_용량', '내진설계적용여부', '지역지구구역' 등이 있으며, 실제 건축물의 규모, 용도, 안전성, 환경설비 상태를 파악할 수 있는 기반 자료입니다. 이 데이터는 건축물 에너지 성능 분석, 도시계획 수립, 재난안전계획 검토, 위생설비 설계, 건축 연혁 확인, 노후 건물 정비 우선순위 설정 등 다양한 공공정책 및 연구 분야에 활용 가능합니다.
