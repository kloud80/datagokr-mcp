summary_user: 마이홈포털의 공공임대주택 단지 정보를 단지 단위 건별로 담으며, 현재 검증 수신 기준 전국 42건이 2006-04-06부터 2024-08-20 범위로 들어 있다. 임대주택을 찾는 국민이나 분석가가 지역별로 어떤 단지가 있는지, 공급 유형과 임대보증금·월임대료 조건이 어떤지 확인하는 질문에 쓴다. 도로명주소(rnAdres)와 필지고유번호(pnu)가 조인 키라서 주소·필지 기준의 다른 주택 데이터나 전월세 실거래 자료와 이어 쓴다.
description_portal: 국토교통부에서 제공하는 마이홈포털 공공임대주택 단지정보 조회 서비스입니다. 오퍼레이션 파라미터를 기준으로 공공임대주택 단지정보 조회하는 서비스 (유의)조회하는 시점에 따라 ‘응답 메시지’가 달라질 수 있습니다. API는 활용신청을 통해 받은 인증키를 사용하여 접속할 수 있습니다. 데이터는 시도 등의 지역 정보를 포함하고 있으며, 공공임대주택 정보를 제공하고 있습니다. 공공임대주택으로는 국민임대, 영구임대, 행복주택 등의 유형을 구분하여 제공중입니다. 자세한 파라미터는 참고문서 파일을 참고해주십시오.
