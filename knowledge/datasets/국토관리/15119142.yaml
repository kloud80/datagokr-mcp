summary_user: 전북 진안군 도시계획정보시스템(UPIS) 건축물 주제도에서 건물별 공간정보관리번호, 바운딩박스 좌표(X·Y 최소·최대값), 건물군관리번호, 필지고유번호(PNU), 건축 구조와 구조명을 건 단위로 담은 파일(CSV 약 0.9MB)이다. 진안군 안의 특정 필지에 있는 건물이 철근콘크리트조인지 목조인지 같은 구조 유형을 확인하거나, 지역 건축물 구조 분포를 보려는 분석가·사업자가 쓴다. 실측상 전역 조인 키로 확인된 컬럼은 없어, 필지고유번호(PNU)나 같은 기관의 다른 UPIS 주제도와 이름·코드 매핑으로 이어 쓴다.
description_portal: '전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 건축물 주제도 구조에 대한 공공데이터 자료입니다. 이번 자료에서는 공간정보 관리 번호, X 좌표 최솟값, Y 좌표 최솟값, X 좌표 최댓값, Y 좌표 최댓값, 건물 군 관리 번호, 필지 고유번호(PNU 의미: 토지에 부여되는 고유한 19자), 구조, 구조 명 정보를 제공합니다. 이 자료를 통해 공간정보 관리 번호에 해당하는 필지 고유번호가 무엇인지 알 수 있으며, 구조가 어떤 식으로 되어 있는지도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.'
