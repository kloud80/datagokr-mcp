summary_user: 인천광역시에 등록된 공장을 공장 한 곳당 한 행으로 담은 건별 명부로, 소속 단지명·회사명·시군구·도로명 주소·전화번호·종업원수·최초등록일·업종번호와 업종명·생산품을 포함한다(CSV 파일 약 2.5MB). 분석가나 투자·입지 검토자가 '인천 남동구 산업단지에 어떤 업종의 공장이 몇 곳 있고 종업원 규모는 어느 정도인가' 같은 지역별·업종별 제조업 분포를 파악하는 데 쓴다. 사업자번호나 필지 고유번호(PNU) 같은 전역 조인 키는 없으므로, 다른 데이터와는 회사명·주소·시군구 이름 매칭이나 업종번호(업종 분류 코드) 기준으로 붙여 쓴다.
description_portal: '인천광역시 공장등록 현황 공공데이터는 인천에 등록된 공장들의 상세 정보를 담고 있습니다. 이 데이터에는 공장 명칭, 소재지, 생산품목, 종업원 수 등 다양한 정보가 포함되어 있어 인천시의 제조업 현황을 한눈에 파악할 수 있는 핵심 자료입니다.<활용 가치>정책 수립: 정부는 이 데이터를 활용하여 특정 지역이나 업종에 대한 맞춤형 산업 육성 정책을 수립하고, 산업단지의 효율적인 관리를 위한 기초 자료로 활용합니다.경제 분석 및 연구: 경제 연구 기관이나 학계는 지역 경제의 규모와 동향을 파악하고, 고용 구조 및 제조업 관련 연구를 진행하는 데 이 데이터를 활용합니다.해당 데이터는 인천시 홈페이지의 경제,투자 부문 > 기업정보와 공공데이터포털에서 확인할 수 있습니다.'
