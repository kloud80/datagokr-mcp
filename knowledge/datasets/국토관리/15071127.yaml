description_portal: 2020~2024년 5년간 국민신문고, 공사 홈페이지, 우편 등을 통해 주택도시보증공사에 접수된 민원 내역을 제공합니다.년도별 접수된 민원을 분양보증, 전세보증, 구입자금보증, 임대보증, 기타보증, 기금업무, 도시재생, 기타로 분류한 자료입니다.(보증의 경우 보증 가입, 관리, 이행 등에 대한 문의 민원이 포함되어 있습니다.)(기금업무의 경우 수요자대출(버팀목,디딤돌 등), 사업자대출 등에 대한 문의 민원이 포함되어 있습니다.)(기타의 경우 보증 및 기금, 도시재생 업무 외 민원이 포함되어 있습니다.)(상품에 대한 자세한 설명은 주택도시보증공사 홈페이지(www.khug.or.kr)를 참고하여 주시기 바랍니다.)
