description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시 내 빈집의 전체적인 상황을 체계적으로 파악하고 관리하기 위해 마련되었습니다. 인구 감소와 도시화로 인해 증가하는 빈집 문제에 선제적으로 대응하고, 위험 건축물과 리모델링이 가능한 주택을 명확히 구분하여 관리합니다. 특히 고독사 예방과 같은 사회적 과제 해결, 노후 건축물의 안전 관리를 통해 주민 안전을 보장하고, 유령하우스화를 막아 지역 환경 개선에 기여하고자 합니다.2. 데이터 항목명- 소재지 도로명주소- 소재지 지번주소- 연면적- 건축면적- 대지면적- 주택유형- 담당기관- 담당자 연락처3. 기대 효과빈집 관리를 통해 주거환경을 개선하고 안전사고를 예방함으로써 지역 주민의 삶의 질을 높일 수 있습니다. 또한 이 데이터를 정책 수립과 예산 배정의 근거 자료로 활용하여 보다 효율적인 도시 관리 정책을 추진할 수 있습니다.
