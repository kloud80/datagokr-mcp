summary_user: 경기도 광주시 내 하수종말처리장을 처리장별 한 행으로 담은 원천 현황 파일로, 처리장명·위치·시설용량·차집관거·처리방법·사업비(백만원)·사업기간·데이터기준일자를 수록한다(csv 약 3KB의 작은 파일). 광주시 주민이나 환경·인프라 분석가가 "우리 동네 하수는 어느 처리장에서 어떤 방법으로 처리되고, 그 시설 규모와 투입 사업비는 얼마인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 시군구의 하수처리장 현황이나 방류수 수질(TMS) 자료와는 처리장명·위치를 기준으로 이름을 맞춰 연결한다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 하수종말처리장 현황 자료입니다. 주요 제공 항목은 처리장명, 위치, 시설용량, 차집관거, 처리방법, 사업비(백만원), 사업기간, 데이터기준일자로 구성되어 있으며, 광주시 내 가동 중인 하수종말 처리장들의 세부 현황 정보를 체계적으로 수록하고 있습니다. 해당 데이터는 하수처리 시설의 규모와 운영 현황을 명확히 파악할 수 있도록 하여, 환경 관리 및 도시 인프라 운영의 투명성과 효율성을 높이는데 기여합니다. 또한, 처리방법과 사업비, 사업기간 정보는 관련 행정 및 정책 수립에 중요한 기초자료로 활용됩니다.
