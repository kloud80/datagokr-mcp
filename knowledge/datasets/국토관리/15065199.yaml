description_portal: 본 데이터는 관내 용도지역별 도시 계획 현황 정보이다. 주거지역, 상업지역, 공업지역, 녹지지역 등 용도지역별 면적, 지정 목적, 건축 제한 사항 등의 세부 내용을 포함한다. 용도지역 지정은 토지의 경제적·효율적 이용과 공공 복리 증진을 위해 토지 용도를 체계적으로 관리하는 도시 계획 제도이다. 해당 자료는 도시 기본 계획 수립, 토지 이용 관리, 개발 행위 허가에 활용된다. 용도지역별 현황 분석을 통해 도시 공간 구조의 적정성을 평가하고 도시 계획 변경 필요성을 검토할 수 있다. 또한 부동산 개발 및 투자 계획 수립 시 토지 용도 제한 사항을 확인하는 데 필요한 기초 정보를 제공한다. 시민들이 거주 지역의 용도지역을 확인하고 건축 가능 여부를 판단하는 데 유용하다.
