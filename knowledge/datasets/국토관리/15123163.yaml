summary_user: 경기도 광주시 도시계획정보시스템에 등록된 도시지역(용도지역)의 도형을 한 건씩 담은 파일로, 도형마다 관리번호·라벨명·면적·경계 길이·등록 일시가 붙어 있으며 범위는 광주시 한 시군구다. 광주시의 어느 구역이 도시지역으로 지정돼 있고 그 면적이 얼마인지 확인하려는 개발 사업자나 도시계획 분석가가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군구코드나 라벨명 같은 이름·코드 매칭으로 같은 광주시의 관리지역·농림지역 등 다른 용도지역 현황과 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 도시지역 현황 정보를 제공합니다. 인구와 산업이 밀집되어 있거나 밀집이 예상되는 지역으로 지정된 도시지역의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지역을 고유하게 식별하며, 라벨명은 도시지역의 명칭이나 구분을 나타냅니다. 면적은 도시지역이 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 용도지역 관리, 도시 개발 계획, 토지 이용 규제, 건축 인허가 심사, 도시 성장 관리 등에 활용됩니다.
