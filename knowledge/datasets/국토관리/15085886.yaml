description_portal: 일반산업단지 현황을 나타내는 통계표 입니다. “일반산업단지”는 「산업집적활성화 및 공장설립에 관한 법률(산업집적법)」에 따라 지정·조성되는 산업단지 유형 중 하나로, 산업 및 관련 시설의 집단적 입지를 통해 산업 경쟁력을 높이고 지역경제를 활성화하기 위해 계획적으로 조성되는 산업단지입니다. 통계항목에는 단지명, 지정면적, 관리면적,  입주업체 수, 가동업체 수 등이 포함되어 있습니다. 가동업체 수가 2개 이하인 산업단지는 가동업체, 고용인원, 생산액, 수출액을 X 표시하여 공표하고 있습니다.
