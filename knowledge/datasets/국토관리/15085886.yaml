summary_user: 전국 일반산업단지를 단지별 한 행으로 정리한 통계표로, 시도·시군·단지명·조성상태와 지정·관리면적, 산업시설구역 분양·미분양 면적과 분양률, 입주업체·가동업체 수를 담는다(CSV 약 53KB). 지역 산업정책 분석가나 입지를 찾는 사업자가 "우리 시군의 일반산업단지는 어디이고 분양률과 가동업체 수는 어느 정도인가"를 확인하는 데 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어서, 단지 원장이나 산업동향·공장등록 통계와는 시도·시군·단지명을 이름으로 맞춰 연결해야 한다.
