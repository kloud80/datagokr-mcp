description_portal: 주택도시보증공사가 운영하는 보증상품으로, 임대차 계약을 체결한 임차인이 임대인에게 매월 지급하기로 약정한 임차료에 대하여 책임지는 보증입니다. 즉, 해당 상품의 보증사고는 임대인의 보증금 지급 채무 불이행이 아닌 임차인의 임차료 지급 채무 불이행이며, 임대인을 위한 보증상품입니다.해당 데이터는 상품의 보증실적, 보증사고액 등 상품의 판매 관련 통계가 아닌 보증상품 자체에 대한 정보를 담고 있음을 유의하시기 바랍니다. 해당 상품의 전체 보증 내 구성비중 등 보증상품의 판매 실적에 대한 정보는 타 공공데이터(주택도시보증공사_보증 구성비중)나 통계연보를 참고하시기 바랍니다.자세한 상품 정보는 https://khug.or.kr/hug/web/ig/pr/igpr000001.jsp 링크를 참고하시기 바랍니다.현재 업데이트되고 있지 않은 일회성 데이터입니다.
