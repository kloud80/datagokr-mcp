summary_user: 한국농어촌공사가 원천인 전국 농업용 저수지의 10분 단위 계측값을 저수지별·계측일시별 건별로 담으며, 저수위·방수로수위·저수량·저수율·유입량·공급량과 수문·여수로 등 방류 구분값이 포함된다. 가뭄철에 특정 저수지의 저수율이 얼마나 떨어졌는지, 홍수철에 유입량과 방류량이 어떻게 변하는지 확인하려는 지자체·농업인·분석가가 쓴다. 저수지코드(RSRVR_CD)로 같은 기관의 저수지 제원 자료와 이을 수 있으나, 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 이름·코드 매핑으로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 10분저수지수위 정보로 데이터 제공 원천기관은 한국농어촌공사입니다. 계측일시, 저수위, 방수로수위, 저수량, 저수율, 유입량, 공급량 등을 제공하고 있습니다. 데이터의 갱신주기는 1시간입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
