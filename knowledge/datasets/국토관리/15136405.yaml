summary_user: 경기도 분석시스템을 바탕으로 기준년월·행정동(읍면동)·성연령대·중분류업종별 지역화폐 매출액과 비중, 전월 대비·전년 동월 대비 증감을 집계한 자료다. 지자체 담당자나 상권 분석가가 "우리 동네에서 20대 남성이 어떤 업종에 지역화폐를 많이 쓰고, 작년보다 늘었는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 행정동코드(admdong_cd)를 행정구역 코드표와 이름·코드로 매핑하거나 같은 기관(경기도 분석) 데이터셋의 코드로만 연결한다.
description_portal: '이 데이터는 경기도 분석시스템을 기반으로 행정동 단위에서 성별 및 연령대별 지역화폐 매출을 집계한 자료입니다. 각 데이터는 ‘기준년월’에 따라 수집되며, 매출 발생 행정동을 식별하는 ‘행정동코드’, 소비자의 특성을 나타내는 ‘성연령코드’(예: F60O, M20O 등), ‘중분류업종코드’(G1, H0 등)를 기준으로 지역화폐 사용 현황을 분류합니다. - 대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.- 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.'
