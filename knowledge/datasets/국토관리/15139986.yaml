summary_user: 청주시에 허가 또는 신고된 가축분뇨배출시설 중 돼지농장을 농장 한 곳당 한 행으로 담은 파일로, 상호·설치주소(지번)·처리시설명·축종·사육두수를 담는다. 주민이나 분석가가 "우리 동네 근처 돼지농장은 어디이고 몇 마리를 키우며 분뇨를 어떤 시설로 처리하나"를 확인하거나 악취·수질 민원 대응 범위를 가늠할 때 쓴다. 전역 조인 키가 없어서, 다른 데이터와는 지번 주소를 지오코딩하거나 상호·주소를 이름으로 맞춰 연결해야 한다.
description_portal: 청주시에 허가 또는 신고된 가축분뇨배출시설 중 돼지사육 농장에 대한 데이터로, 정보 중 사육농장 상호, 설치주소(지번), 처리시설명, 축종, 사육두수 항목으로 이루어져 있습니다.가축분뇨 배출시설을 설치하기 위해서는 가축분뇨의 관리 및 이용에 관한 법률에 따라 일정 규모 이상의 가축을 사육하는 경우 허가 또는 신고를 받아야 하며, 돼지 사육시설의 경우 허가 대상은 면적 1,000㎡이상(수질보전특별대책지역 등에 서는 500㎡이상)이며, 신고 대상은 면적 50㎡ 이상 1,000㎡미만(수질보전특별대책지역 등에서는 면적 50㎡ 이상 500㎡미만)입니다.
