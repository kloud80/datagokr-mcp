summary_user: 충청남도 지방하천 통합관리 기본계획에 따라 정리한 시설관리대장으로, 댐저류지·배수펌프장·제방·지하하천 방수로·하구둑·호안 같은 치수 시설물을 한 건씩 시설물명·측점 위치·규격·설치년도·좌표로 담은 파일(zip 약 346KB)이다. 도·시군 하천 담당자나 분석가가 '우리 지역 하천의 어느 측점에 어떤 제방·호안이 언제 설치됐고 규모는 어떤가'를 확인해 정비사업과 유지보수 우선순위를 검토하는 데 쓴다. 전역 조인 키가 없어 다른 하천 데이터와는 시설물명·위치 이름 매핑이나 좌표(X·Y, 경도)를 이용한 공간 대조로만 이어 쓴다.
limits: 하천코드 같은 공통 조인 키가 실측 컬럼에 없어 하천 목록·구역 데이터와 바로 결합되지 않고 이름이나 좌표로 맞춰야 한다. 범위는 충청남도 한 시도의 지방하천 시설에 한정된다.
