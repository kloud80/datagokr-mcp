summary_user: 경상북도 봉화군에 설치된 스마트워터(원격검침) 미터기를 한 대씩 도로명 주소와 위도·경도 좌표로 담은 개별 위치 자료로, 기준일은 2026년 7월 15일이다. 상수도 담당자나 분석가가 봉화군 안에서 원격검침 미터기가 어느 지역에 몰려 있고 어디가 비어 있는지 지도에 찍어 보는 데 쓴다. 전역 조인 키는 없으므로, 다른 자료와는 도로명 주소나 좌표를 기준으로 공간 매칭하거나 같은 봉화군 상수도 자료와 기관 단위로 이어 쓴다.
description_portal: '이 데이터는 경상북도 봉화군에 설치된 스마트워터 미터기의 위치 정보를 정리한 자료입니다. 스마트워터 미터기는 원격검침 시스템을 통해 수돗물 사용량을 실시간으로 파악할 수 있는 장치로, 봉화군 내 설치 현황을 주소 및 좌표 정보와 함께 제공합니다. 데이터는 설치 위치, 위도·경도 좌표, 미터기 구분 등 총 6개 컬럼으로 구성되어 있으며, 기준일은 2026년 7월 15일입니다.순번: 데이터에 기록된 미터기의 일련번호로, 각 행을 구분하기 위해 부여된 고유 번호입니다.구분: 미터기의 구분 정보를 나타내며, ‘원격검침’ 등으로 표기됩니다.설치위치: 미터기가 설치된 장소의 도로명 주소입니다.위도: 미터기 설치 위치의 위도 좌표를 나타냅니다.경도: 미터기 설치 위치의 경도 좌표를 나타냅니다.데이터기준일: 데이터가 집계된 기준일로, 2026년 7월 15일로 명시되어 있습니다.'
