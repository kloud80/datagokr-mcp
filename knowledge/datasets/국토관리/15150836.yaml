description_portal: 해당 데이터는 매년 공시되는 개별공시지가업무 추진에 대한 일정표입니다.개별공시지가는 매년 1.1 기준, 7.1.기준 총 2번 정해지며, 관련 내용에 대한 이의신청 가능 날짜 및 확정일자 등에 대한 내용을 확인 할수 있습니다.개별공시지가 추진 단계는 아래와 같이 구성 돼있습니다.1. 조사계획 수립 및 조사대상필지파악 > 2. 토지특성 조사 > 3. 지가산정 > 4. 산정지가 검증 > 5. 지가열람 및 의견제출 > 6. 의견제출지가검증 > 7. 부동산가격공시위원회 심의 및 의견제출 > 8. 지가결정/공시 > 9. 이의신청 > 10. 이의신청지가 검증 및 처리 > 11. 지가 조정 공사위 일정은 매년 상이하며, 자세한 일정은 창원시청 홈페이지를 통해 확인하능하며, 이의신청도 창원시 홈페이지를 통해 신청 가능합니다.https://www.changwon.go.kr/cwportal/10309/10332/10335.web
