summary_user: 경기도 양주시 관내에서 시공 중인 공동주택(아파트) 공사를 건별로 담은 파일로, 공사명·공사 시작일과 완료(예정)일·지번 주소·시공사명과 전화번호·세대수·입주예정일을 담는다(약 3KB 규모의 CSV). 양주시에서 아파트 입주를 기다리는 시민이나 부동산 분석가가 '어느 단지가 언제 준공·입주하고 시공사는 누구인가'를 확인하는 데 쓴다. 단지코드 같은 전역 조인 키가 없어 K-apt 단지 정보나 실거래·청약 데이터와는 공사명(단지명)이나 지번 주소를 직접 맞춰 이어 써야 한다.
