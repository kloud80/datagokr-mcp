summary_user: 경상북도 안동시에 개별입지로 등록된 제조업 공장을 한 줄에 한 곳씩 담은 등록 명부로, 회사명·전화·팩스·공장 대표주소·업종명·생산품과 데이터기준일자가 들어 있다. 안동시 안에서 특정 업종이나 생산품의 공장이 어디에 있는지 찾거나, 지역 제조업 분포를 파악하려는 사업자·분석가가 쓴다. 실측 컬럼에 사업자번호·산업분류코드·필지번호 같은 전역 조인 키가 없어, 다른 데이터와는 주소나 회사명·업종명을 이름으로 맞춰 이어야 한다.
description_portal: 이 데이터는 경상북도 안동시에 위치한 제조업체의 현황을 정리 하였으며, 산업집적활성화 및 공장설립에 관한 법률  및 한국표준산업분류(제조업)에 따른 공장등록(개별입지) 내역입니다.데이터에는 회사명, 전화번호, 팩스번호, 공장대표주소, 업종명, 생산품 등이 6가지가 기재 되어 있습니다."공장:이란 건축물 또는 공작물, 물품제조공정을 형성하는 기계 장치 등 제조시설과 그 부대시설을 갖추고 대통령령으로 정하는 제조업을 하가 위한 사업장"이 자료를 기반으로 안동시에  어떤 업종의 공장이 어디에 위치해 있는지 쉽게 알 수 있습니다.예를 들어, 안동시의 제조업 현황을 파악하거나, 공장 위치를 확인하거나, 산업 트렌드를 분석하는 데 사용할 수 있습니다.이 데이터는 행정업무, 연구, 산업 동향 분석, 정책 수립, 기업 지원 등 다양한 목적으로 이용할 수 있습니다.본 데이터는 연마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
