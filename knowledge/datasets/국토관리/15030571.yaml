summary_user: 경기도 광주시 안에서 시공 중이거나 시공된 공동주택 공사를 공사 단위로 담은 파일로, 공사명·공사 기간·시공사·세대수·입주예정일·지번주소·위도·경도를 수록한다(CSV 1,081바이트의 소규모 파일). 광주시에서 언제, 어디에, 몇 세대 규모의 공동주택 입주가 예정되어 있는지 확인하려는 주민·분석가가 쓴다. 전역 조인 키가 없어 K-apt 단지코드나 실거래 단지명과는 직접 이어지지 않고, 단지명·지번주소를 이름으로 맞추거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 공동주택시공현황 자료입니다. 주요 제공 항목은 시군명, 공사명, 공사시작일, 공사완료일, 시공사명, 시공사전화번호, 세대수, 입주예정일, 우편번호, 시공위치지번주소, 위도, 경도로 구성되어 있습니다. 해당 데이터는 광주시 내 공동주택 건설 현황과 시공사 정보를 체계적으로 수록하며, 공사 기간과 위치, 세대 수 등 상세 정보를 포함하여 건설 사업 관리 및 주택 공급 현황 파악에 활용됩니다. 또한 입주 예정일 등 주택 수요 및 공급 관리를 위한 기초자료로서 주민 및 행정기관이 효과적으로 활용할 수 있도록 지원하며, 도시계획과 주거 정책 수립에 기여합니다.
