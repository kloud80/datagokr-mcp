summary_user: 대전광역시에서 접수된 안전신문고 신고 건수를 비교 연월과 기준 연월로 나란히 놓고 증감 건수·증감률을 함께 담은 집계 파일로, 포털 설명상 2015년 2월 안전신문고 개통 이후 2023년 9월 30일까지를 대상으로 한다(파일 크기 약 3KB의 소규모 CSV). 대전 시민·분석가가 "대전의 안전신문고 신고가 이전 시점보다 얼마나 늘었거나 줄었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 안전신고 통계나 대전시 안전 관련 자료와는 연월 기준으로 맞춰 보거나 기관명으로만 연결한다.
description_portal: 대전광역시 안전신문고 신고건수 자료는 2015년 2월 6일 안전신문고 개통 이후 2023년 9월 30일까지 대전지역에서 접수된 안전신문고 신고 건수를 집계한 자료입니다. 이 자료는 시민들이 생활 속에서 발견한 각종 안전 위험요소를 신고한 내역을 기반으로 하며, 연도별·지역별 신고 건수 변화, 신고 유형별 분포, 주요 신고 사례 등 다양한 정보를 포함하고 있습니다. 자료는 안전정책 수립, 지역별 안전 취약점 분석, 시민 안전의식 제고, 행정기관의 신속한 대응체계 마련 등 여러 목적에 활용될 수 있습니다.
