summary_user: 경상남도에 등록된 종합건설업 업체를 한 업체당 한 행으로 담은 명부 파일로, 업종·상호·전화번호·영업소재지(도로명주소)를 담는다(CSV 약 159KB). 경남에서 토목·건축·토목건축·산업환경설비·조경 등 원하는 업종의 종합건설업체를 찾아 연락처와 소재지를 확인하려는 발주자나 사업자가 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 상호(업체명)나 도로명주소를 매칭해 잇는다.
description_portal: 경상남도에 등록되어있는 종합건설업 업체현황입니다. 이 데이터에서는 경상남도 종합건설업 업체의  업종, 업체명, 전화번호, 주소의 정보를 제공합니다.종합공사를 시공하는 업종 종류는 토목공사업, 건축공사업, 토목건축공사업, 산업환경설비공사업, 조경공사업 이렇게 5개의 업종이 있습니다. 각 업종마다 건설업의 등록기준(자본금, 기술인력)이 다르며, 공사를 할 수있는 종류, 규모가 다릅니다.당신이 찾으시고자 하는 요건에 맞는 종합공사를 시공하는 건설업체를 검색 하여  쉽게 찾을 수 있습니다.
