summary_user: 전라남도 영암군 안의 원룸과 오피스텔을 건물 한 곳당 한 행으로 담은 파일로, 주소·주용도·기타용도·세대수를 기록한다(CSV 약 5KB, 시군구 범위의 개별 주소 단위). 영암군에서 집을 구하는 사람이나 임대 사업자, 지역 분석가가 '영암군 어느 동네에 원룸·오피스텔이 몰려 있고 세대 규모는 얼마인가'를 확인하는 데 쓴다. 전국 공통 조인 키(법정동코드·건물관리번호 등)는 없으므로 주소 문자열을 정제해 건축물대장이나 주소·좌표 데이터와 맞추거나, 같은 기관(영암군)이 낸 다른 주택 자료와 이름 기준으로 이어 쓴다.
limits: 표준 코드 키가 없어 다른 데이터와 붙이려면 주소를 직접 매칭해야 한다. 영암군 한 곳만 다루므로 다른 시군과 비교하려면 별도 자료가 필요하다. 임대료·거래가격·준공연도 같은 정보는 들어 있지 않다.
