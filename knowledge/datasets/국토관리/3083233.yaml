summary_user: 경상남도 안에 있는 온천을 한 곳씩 담은 파일로, 시군·온천명·소재지와 함께 성분, 온도(도씨), 심도(미터), 온천원 보호지구·온천공 보호구역 면적(천제곱미터), 적정양수량(톤/일)을 기록한다. 경남 어느 시군에 어떤 성분과 수온의 온천이 있는지, 보호구역 규모와 하루 적정양수량은 얼마인지 알아보려는 관광·개발 사업자나 지역 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군 이름이나 소재지 주소를 매핑해 이어 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 온천현황 데이터는 경상남도 내 위치하는 온천에 대한 정보로 이름, 위치, 온도, 심도 등의 세부정보를 포함합니다. (데이터 구성 및 세부항목) 해당 데이터는 시군, 온천명, 소재지, 성분, 온도, 심도, 온천원 보호지구면적, 온천공 보호구역면적, 적정양수량으로 구성됩니다.* 온도 단위는 도씨입니다.* 심도 단위는 미터입니다.* 온천원 보호지구면적, 온천공 보호구역면적 단위는 천제곱미터입니다.(데이터 현행화 시기) 해당 데이터는 연간 데이터입니다. 차기 업데이트 예정일은 2025년 9월입니다.
