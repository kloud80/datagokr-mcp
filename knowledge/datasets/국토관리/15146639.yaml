summary_user: 전국 지방자치단체가 도시관리계획으로 결정한 고도보존 용도지구의 구역 정보를 국토교통부가 모아 vworld에서 시도별 공간 파일(SHP)로 제공하는 원천 자료로, 국토계획법의 용도지역·지구 규정에 근거한다. 토지 매입자나 건축 사업자, 도시계획 분석가가 특정 지역이 문화유산 경관 보존을 위한 고도보존지구에 들어가 건축물 높이 제한을 받는지 확인할 때 쓴다. 전국 단위로 통하는 조인 키는 없으므로 행정구역 구분 값(COL_ADM_SE)이나 지역명을 매핑하거나, 같은 기관의 다른 용도지역·지구 연속주제 자료와 공간 중첩으로 이어 쓴다.
