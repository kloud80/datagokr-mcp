summary_user: 천안시 도시계획정보시스템(UPIS)의 지구단위계획 결정조서를 결정 항목별로 담은 파일(csv, 약 19만 바이트)로, 도면번호·위치명·지역명과 기정 면적, 증감 구분, 변경 면적, 변경 후 면적을 기록한다. 천안시에서 특정 지구단위계획구역의 면적이 결정 변경으로 얼마나 늘거나 줄었는지 확인하려는 토지 소유자·개발 사업자·도시계획 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위치명·지역명 같은 이름 매핑이나 같은 기관(천안시) UPIS 자료끼리로만 이어 쓴다.
description_portal: 충청남도 천안시 도시계획정보시스템(UPIS)의 지구단위계획 결정조서 현황으로 도면번호, 위치명, 지역명, 면적 기정, 면적 증감코드, 면적 변경, 면적 변경후, 비고의 항목을 제공합니다.도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 지구단위계획 결정조서 테이블을 데이터 개방하였습니다.
