summary_user: 나주시 안의 원룸·오피스텔 건물을 한 건씩 담은 파일로, 구분·소재지 지번주소·주용도·가구수·사용승인년도를 건물 단위로 기록한다. 나주시에서 혁신도시나 대학 인근 등 특정 지역에 소형 임대주거가 얼마나 몰려 있고 언제 지어졌는지를 알고 싶은 임대사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 이름 매칭하거나 주소를 좌표로 바꾼 뒤 이어 써야 한다.
description_portal: 이 데이터는 지역 내 원룸·오피스텔 형태의 소형 주거시설 분포와 공급 현황을 체계적으로 파악하기 위한 기초자료로 구성되어 있으며, 구분, 소재지 지번주소, 주용도, 가구수, 사용승인년도와 같은 주요 항목을 포함합니다. 이를 통해 특정 지역의 단독형 소형주거 공급 비중, 준공시기별 노후도, 가구수 대비 주거밀도, 생활편의시설과의 입지 조건 등을 정밀하게 분석할 수 있다. 또한 대학, 산업단지, 교통거점 인근의 임대수요 예측, 1~2인 가구 증가에 따른 소형 주택 수급 평가, 청년·신혼부부를 위한 공공임대 공급 검토 등 정책 수립의 기반이 될 수 있습니다.
