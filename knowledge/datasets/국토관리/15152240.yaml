summary_user: 공무원연금공단이 공무원에게 직접 배정하는 공무원임대주택의 정기공고를 공고·단지(사업명)·주택형(전용면적)별로 정리한 파일 데이터로, 신청 가능 세대수와 심사대상자 배수·심사대상자 수를 담는다(전국 범위, 수시·임의공고 제외). 공무원이 다음 정기공고에서 어느 단지·평형이 몇 세대 나오고 심사대상자가 몇 명인지 가늠하거나, 분석가가 시기·단지별 공무원임대주택 정기 공급 물량을 집계하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키는 없어 사업명(아파트 단지명)이나 공고일자로 이름·날짜를 맞춰 연결해야 한다.
limits: 수시공고·임의공고 등 정기공고 외 건은 빠져 있어 전체 배정 물량으로 보면 안 된다. 실측 컬럼에 표준 조인 키가 없어 LH·마이홈 공고나 주소 기반 데이터와 붙이려면 단지명 매칭이 필요하다. 명세상 연간 단위로 공고 시점에 생성된 뒤 바뀌지 않는 이벤트성 데이터다.
