summary_user: 행정안전 통계연보의 지방재정 편 중 지방출자·출연기관(일부 지방공기업 포함) 통계를 지역·출자기관·출연기관 구분으로 담은 연보 수록용 집계 통계이며, 범위는 전국입니다. 지역별로 지방출자·출연기관이 몇 곳이고 출자기관과 출연기관이 어떻게 나뉘는지 알고 싶은 연구자·지방재정 분석가가 쓴다. 실측 컬럼에서 공통 조인 키가 확인되지 않아 다른 데이터와는 지역명 등 이름 매핑으로만 이어 쓴다.
