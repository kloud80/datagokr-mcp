summary_user: 세종특별자치시의 개발제한구역 지정 현황을 위치·면적·가구수·인구수·지정일·데이터기준일로 담은 소규모 집계 파일(116바이트 CSV)이며, 포털 설명상 금남면 일대 40.8㎢, 55가구·94명, 1973년 6월 27일 지정 건을 담는다. 토지 매입이나 개발을 검토하는 국민·사업자가 '세종시에서 개발제한구역은 어디에 얼마나 있고 언제 지정됐나'를 확인하거나, 분석가가 시도별 개발제한구역 비중을 비교할 때 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어, 다른 데이터와는 위치(읍면 이름) 매칭이나 같은 기관 자료로만 연결한다.
description_portal: 세종특별자치시 내에 있는 개발제한구역지정현황 및 개발제한구역 해제취락지역 현황을 제공하는 파일입니다.위치, 면적, 가구수, 인구수, 지정일, 비고, 데이터기준일로 구성되어있습니다. 세종시 금남면에 위치해 있으며 면적은 40.8 제곱 킬로미터입니다.가구수는 55가구이며 인구수는 94명입니다.개발제한구역 지정일은 1973년 6월 27일이며 세종시 면적 대비 8.8%입니다.현재 데이터는 2025년 12월 10일을 기준으로하며 업데이트 주기는 연간으로 다음 업데이트는 2026년 12월에 업데이트 될 예정입니다.이 데이터는 세종특별자치시 도시주택국 도시과에서 관리하고 있습니다.
