summary_user: 경기주택도시공사가 시행한 택지·상업용지 입찰공고와 개찰결과를 공고 용지별로 담은 건별 현황이며, 사업지구명·공고명·접수기간·개찰일·토지용도·가지번·면적·공급예정가액·입찰금액·낙찰률(partcptn_rt)을 포함한다. 분석가나 사업자가 '경기도 공공택지에서 어떤 용도의 땅이 예정가 대비 얼마에 낙찰됐는가'처럼 공급 성과와 낙찰가 수준을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구명이나 지번 같은 이름 매칭, 또는 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 경기주택도시공사에서 시행한 택지 및 상업용지의 입찰공고와 개찰결과 현황을 담고 있으며, 각 사업지구별 용지공급 이력 및 입찰 성과를 확인할 수 있습니다. 주요 항목은 사업지구명, 공고명, 공급방법(입찰), 모집공고일, 공고접수기간, 개찰일자, 토지용도, 가지번, 면적, 공급예정가액 등으로 구성되어 있으며, 공급 대상 용지의 면적과 예상 가격, 실제 입찰금액 및 낙찰률 등을 비교 분석할 수 있도록 되어 있습니다. 이 자료는 토지공급 성과 평가, 낙찰가 대비 시세분석, 민간 참여율 예측, 도시개발계획 검토, 공공택지 시장 동향 파악 등에 활용됩니다. 특히 미낙찰 용지나 높은 낙찰률을 보이는 용지는 부동산 투자 및 개발 타당성 분석에도 유용합니다.
