description_portal: '지적재조사 사업이 완료된 지구 중, 복수의 소유자가 존재하는 공유지에 대한 상세 정보를 담은 자료입니다. 각 필지에 대한 소유자의 지분, 변동 원인, 변동 일자 등이 포함되어 있어 공유관계 현황을 확인할 수 있습니다.1. 형식: CSV2. 내용 요약■ 시도코드: 사업지구가 속한 광역지자체 코드 (예: 11000 = 서울특별시)■ 시도명: 광역지자체 이름■ 시군구코드: 기초자치단체 코드■ 시군구명: 기초자치단체 이름■ 사업지구일련번호: 고유 식별 번호■ 사업지구명: 지적재조사가 완료된 지구 이름■ 필지고유번호: 공유지 필지의 고유 번호■ 공유순번: 동일 필지 내 소유자 순번■ 지분: 해당 공유자의 소유 지분 (예: 1/2, 1/3 등)■ 변동원인코드: 소유권 변동의 사유를 나타내는 코드■ 변동원인명: 변동 사유의 명칭 (예: 소유권이전)■ 변동일자: 소유권 변동이 발생한 날짜3. 활용 예제■ 공유지 필지에 대한 지분 구조 분석 및 소유자 수 파악■ 소유권 변동 이력 기반의 소유자 변경 추이 연구■ 지역별 공유 필지 수에 따른 관리 정책 수립■ 공간정보 시스템(GIS)과 연계하여 공유지 위치 및 현황 시각화'
