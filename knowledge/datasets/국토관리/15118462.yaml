summary_user: 최근 5년간 지적재조사 사업이 끝난 지구에서 소유자가 여럿인 공유지 필지의 공유자별 지분·소유권 변동 원인·변동 일자를 공유자 한 명당 한 행으로 담은 전국 단위 CSV 파일(약 23MB)이다. 지적재조사 완료 지구에서 공유 필지가 어느 지역에 얼마나 몰려 있고 필지당 공유자가 몇 명인지 파악하려는 지자체 담당자나 연구자가 쓴다. 필지고유번호(PNU)를 키로 토지대장·연속지적도 같은 필지 단위 데이터와 이어 쓰고, 시도·시군구 코드로 지역별 집계에도 쓴다.
limits: 지적재조사가 완료된 지구의 공유지만 담으므로 전국 공유지 전체 현황으로 볼 수 없다. 소유자 개인 정보는 없고 공유 순번과 지분만 있어 공유자 신원은 알 수 없다.
