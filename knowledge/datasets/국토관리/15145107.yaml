description_portal: 본 데이터는 경상북도 경주시 관내에서 조경 관련 사업을 수행하는 업체들의 현황을 정리한 파일데이터이다. 포함된 정보는 업체명, 사업장 주소, 대표자명, 연락처, 사업자등록번호, 업종 분류, 등록일자 등으로 구성되어 있으며, 조경시설물 설치, 조경식재공사, 조경설계 및 시공 등 다양한 조경 업무를 수행하는 업체의 기본 정보를 담고 있다. 본 자료는 경주시의 조경 관련 행정업무, 민원 처리, 도시계획 및 녹지조성 사업 등에 유용하게 활용될 수 있다. 또한 시민, 민간기업, 연구기관 등 다양한 수요자가 경주시 내 조경업체 분포와 특성을 파악하고, 관련 정보를 참고자료로 활용하는 데 기여할 수 있다.
