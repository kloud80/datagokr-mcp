summary_user: 구례군 안에 있는 건축사사무소를 한 곳당 한 행으로 사무소명·대표자·주소·연락처와 데이터 제공일자를 담은 시군구 단위 목록 파일입니다(CSV 471바이트의 작은 파일). 구례에서 집을 짓거나 고치려는 주민이 설계를 맡길 지역 건축사사무소와 연락처를 찾는 데 쓰고, 지역 건축 업계 규모를 가늠하는 데도 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사무소명이나 주소 같은 이름 매칭으로만 잇습니다. 주소를 지오코딩하면 같은 군의 건축 인허가 자료와 위치로 견줘 볼 수 있습니다.
description_portal: '"건축사사무소 현황" 공공데이터는 구례 지역 내에 존재하는 건축사사무소에 관한 정보를 제공합니다. 이 데이터는 주로 건축 설계 및 관련 서비스를 제공하는 건축사사무소들의 현황과 관련된 정보를 포함합니다.이를 통해 지역 주민들은 필요한 건축 및 설계 서비스를 제공하는 사무소를 찾을 수 있으며, 건축 프로젝트를 계획하고 추진하는 데 도움을 받을 수 있습니다. 또한, 이 데이터는 건축 관련 업계의 현황을 파악하고, 지역 건축 활동의 촉진을 위한 정책 수립에 활용될 수 있습니다.'
