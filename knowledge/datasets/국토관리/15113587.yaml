summary_user: LH 전세임대 공급 내역을 계약 건별로 담은 원천 파일로, 전국 332,197행에 지역본부·지자체·주택유형·면적·세대원수·계약일자·전세금·전세지원금·월임대료가 들어 있다. 전세임대 호수가 어느 지역에 어떤 주택유형·금액 조건으로 공급됐는지 알아보려는 분석가나 임대차 시장 연구자가 쓴다. 주소(address)를 조인 키로 삼아 주소 기준의 다른 자료와 잇고, 전월세 실거래와 병합해 보는 관계로 분류돼 있다.
description_portal: 한국토지주택공사가 전세임대로 제공하는 호수에 대한 공급현황 정보(지역본부, 지자체,  유형, 주택유형,  방갯수, 계약면적, 전용면적, 세대원수, 계약일자, 전세금, 전세지원금, 월임대료)를 제공합니다. 여기서 전세임대란 입주희망자가 선택한 주택의 임대인과 한국토지주택공사가 전세계약을 체결하고 이를 입주희망자에게 재임대하는 형태의 임대주택을 말합니다. 전세임대 입주자 모집 공고, 입주자격, 입주절차, 임대조건 등 세부정보는 LH 청약플러스(https://apply.lh.or.kr)에서  확인하실 수 있습니다.
