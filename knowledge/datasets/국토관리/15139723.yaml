summary_user: 재난안전데이터 공유플랫폼이 제공하는 시군구별 저수지 저수 현황을 대상일자 단위로 담은 집계 데이터로, 시군구마다 저수지 수, 수혜면적, 유효저수량, 현재저수량, 현재저수율(NOW_WRERATES)을 담고 전국 범위다. 지자체 가뭄 담당자나 농업 분석가가 "우리 시군의 저수지 저수율이 지금 얼마이며 가뭄 대응이 필요한가"를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 시군구코드(SGG_CD)·시군구명을 행정구역 코드표나 다른 시군구 단위 통계와 이름·코드 매핑으로 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 시군저수지 저수 정보로, 대상일자, 시군구코드, 시군구명, 저수지수, 수해면적, 유효저수량, 현재저수량, 현재저수율 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
