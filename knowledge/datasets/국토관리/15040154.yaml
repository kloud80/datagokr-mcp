summary_user: 충청북도 단양군 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일로, 기업명·단지명·생산품·종업원수와 데이터기준일자를 담는다(csv 약 1.8KB 규모). 단양군 산업단지에 어떤 업체가 무엇을 만들며 몇 명을 고용하는지 알고 싶은 구직자·영업 담당자·지역 분석가가 단지별 입주 현황을 확인하는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어 다른 공장 등록·산단 통계 자료와는 기업명·단지명 이름 매칭으로만 이어 쓴다.
