summary_user: 경상남도 하천관리시스템에 등록된 홍수범람구역을 구역별 한 행으로 담은 파일로, 하천관리코드·홍수범람구역명·빈도와 공간정보 컬럼을 포함하며 CSV 한 개(약 54MB)로 받는다. 경남 지역 개발사업자나 지자체 담당자가 '이 하천 주변의 어느 구역이 몇 년 빈도 홍수에 범람 위험이 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 하천관리코드나 구역명 같은 이름·코드 매핑, 또는 같은 경상남도 하천관리 데이터와의 기관 내부 코드로만 잇는다.
limits: 전국 공통 조인 키가 없어 WAMIS 하천코드나 국가공간정보포털 하천 데이터와 바로 붙지 않고, 이름·코드 매핑을 따로 해야 한다. 명세상 갱신은 월간·이벤트 주기로 적혀 있어 실제 갱신 시점은 확인이 필요하며, 범위는 경상남도에 한정된다.
