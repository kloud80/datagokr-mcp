summary_user: 행복도시(세종시 행정중심복합도시)의 토지이용계획을 대분류(주택·상업·공원녹지·공공시설 등), 중분류(저밀·중밀·고밀 등 밀도), 소분류 단위로 나눠 당초 계획 면적(기정)과 조정된 계획 면적(변경안)을 ㎡로 담은 집계 파일이며, 크기는 2,305바이트의 작은 CSV이다. 도시계획 연구자나 분석가가 '행복도시 주택용지의 고밀·저밀 비중과 공원녹지 면적이 계획 변경으로 얼마나 바뀌었나'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용지 분류 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 토지이용계획의 세부 현황과 변경 내역을 제공합니다. 토지는 대분류(주택용지, 상업용지, 공원녹지, 공공시설 등), 중분류(저밀·중밀·고밀 등 밀도 구분), 소분류 단위로 구체적으로 구분되며, 각 구역별 기정(당초 계획 면적)과 변경안(조정된 계획 면적)이 ㎡ 단위로 기록되어 있습니다.본 데이터를 통해 행복도시 내 토지이용 구조의 변화와 도시개발 전략을 한눈에 파악할 수 있습니다. 예를 들어, 주택용지의 저밀·중밀·고밀 비중 조정은 인구수요와 주거 밀도의 변화를 반영하며, 상업·공원녹지·공공시설 등의 면적 조정은 도시기능 배분과 환경·생활 인프라의 균형을 의미합니다.따라서 이 데이터는 도시계획 수립과 조정, 토지 관리 정책, 생활권별 기반시설 계획, 학술 연구 및 도시개발 평가 등 다양한 영역에서 활용 가치가 높습니다.
