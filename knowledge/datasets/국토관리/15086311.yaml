summary_user: 기상청 초단기 레이더 강수 예측 모델(MAPLE)을 바탕으로 한강홍수통제소가 표준유역별로 산출한 강우량을 10분 단위 시각마다 담은 파일이며, 한 행에 관측 우량과 10분 뒤부터 6시간 뒤까지 10분 간격 예측우량이 열로 붙어 있습니다(포털 설명상 2021년 7월분, CSV 약 121MB). 홍수 예보 분석가나 연구자가 '2021년 7월 집중호우 때 특정 표준유역의 레이더 예측우량이 실제 우량과 얼마나 맞았나'를 따지는 데 쓴다. 전역 조인 키가 없어 대권역명·표준유역명 이름을 매핑해 같은 기관의 수위·유량 관측이나 표준유역 경계 자료와 붙여 써야 합니다.
description_portal: 한강홍수통제소에서 기상청으로부터 수집한 MAPLE 데이터를 기반으로 예측한 표준유역별 MAPLE 강우량 데이터입니다.MAPLE은 기상청에서 운영하는 초단기 레이더 강수량 예측 모델로, 국지성 집중호우 등 기상 변화에 신속하게 대응하기 위해 개발되었습니다.대권역명,표준유역명,년월일시분,우량,예측우량으로 구성되어 있습니다.표준유역별 예측우량은 10분 예측부터 360분 이후 예측까지 10분 간격마다 칼럼으로 구분하여 값을 제공하고 있습니다.'21년 7월 데이터를 제공합니다.
