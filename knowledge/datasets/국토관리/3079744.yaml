summary_user: 고양시 안을 흐르는 하천을 하천 한 줄씩 담은 목록 파일(약 6KB CSV)로, 하천구분(국가·지방·소하천), 하천명, 시점·종점 위치, 유로연장과 고시연장을 담는다. 고양시에 어떤 국가·지방하천이 있고 각 하천이 어디서 시작해 어디서 끝나며 얼마나 긴지를 확인하려는 시민·하천 업무 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키(하천코드 등)가 없어 다른 하천 데이터와는 하천명으로 맞추거나 같은 기관(고양시) 자료끼리만 이어 쓴다.
