description_portal: 성남시의 건축착공신고는 「건축법」 제25조 및 같은 법 시행령 제15조에 따라, 건축허가를 받은 후 실제 공사를 시작하기 전에 반드시 제출해야 하는 법정 행정절차입니다. 이는 행정기관이 해당 건축물의 공사 개시 여부를 확인하고, 감리자 및 시공자 배치 상태, 안전 및 공정 관리 준비 여부를 사전에 검토하기 위한 제도입니다.신고서에는 건축물의 위치, 시공자 정보,착공신고허가일 등이 포함됩니다. 성남시는 최근 건축행정 통합정보시스템을 활용한 전산처리 강화와 함께, 위반사항 사전 예방을 위한 이행점검제도도 병행하고 있습니다. 이로 인해 착공 전후 일정에 대한 철저한 관리가 가능해졌으며, 건축주 및 감리자에게는 착공 이후 발생할 수 있는 안전사고 및 불법시공 리스크를 줄이는 데 기여하고 있습니다.
