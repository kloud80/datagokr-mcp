summary_user: 성남시에 접수된 건축착공신고를 건별로 담은 파일(CSV, 약 25KB)로, 신고일·지번주소·착공 용도·설계사무소·시공자를 담는다. 건축사무소나 개발 동향을 보는 분석가가 '성남시에서 최근 어느 동네에 어떤 용도의 건물 공사가 시작됐나'를 확인하는 데 쓰며, 착공은 지역 개발 흐름의 선행 지표로 본다. 전역 조인 키가 없어 지번주소(착공신고지지번주소)를 주소·지번 기준으로 맞추거나 시군명으로 다른 성남시 건축 인허가 데이터와 이어 쓴다.
limits: 표준 코드(건축물대장 PNU·관리번호 등)가 없어 건축허가·사용승인 데이터와 정확히 1:1로 연결하기 어렵고 주소 문자열 매칭에 의존한다. 범위는 성남시 한 곳뿐이라 다른 시군구와의 비교에는 별도 데이터가 필요하다.
