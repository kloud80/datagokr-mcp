summary_user: 전라남도 영암군의 개별주택가격을 주택 한 건(소재지·동번호)마다 담은 파일로, 대지면적·건물연면적과 가격 산정에 쓴 면적, 용도지역, 주건물 용도·구조, 공시가격(가격), 일단지 여부를 함께 싣는다. 영암군 단독주택 소유자나 분석가가 특정 주택의 공시가격을 확인하거나 보유세·건강보험료·복지 기준 산정의 바탕 값을 살피는 데 쓴다. 필드에 필지고유번호(PNU) 같은 전역 조인 키가 없어, 다른 데이터와는 소재지 주소 문자열을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
