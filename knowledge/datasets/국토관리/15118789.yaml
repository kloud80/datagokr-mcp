summary_user: 인천광역시 부평구 관내 다중이용시설을 시설 한 곳당 한 행으로 담은 파일로, 연번·시설명·주소(도로명 또는 지번)만으로 구성된 개별 시설 목록이다(CSV 약 10KB). 구청·보건소 담당자나 분석가가 '부평구에서 재난·감염병 대응이나 방역소독·안전점검 대상이 될 다중이용시설은 어디에 몰려 있나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 주소를 지오코딩하거나 행정동 이름으로 맞춰 인구·시설 통계 등 다른 데이터와 이어 쓴다.
description_portal: '관내 다중이용시설에 대한 현황 자료로, 시설명과 주소 정보로 구성되어 있다.해당 시설은 일반 주민이 자주 출입하거나 특정 집단이 집합하는 장소로, 공공안전·방역·재난관리·복지서비스 등 다양한 정책의 기초 자료로 활용될 수 있다.활용 목적 및 특징– 화재, 지진, 감염병 등 재난 발생 시 대응 대상 시설 목록으로 활용– 공공서비스(안전점검, 방역소독 등) 우선순위 설정– 고위험군 대상 예방접종 및 보건소 방문서비스 기획 기초– 행정동별 다중이용시설 분포 파악 및 인구밀집도 연계 분석 가능주요 항목 설명● 연번: 각 시설의 고유 번호● 시설명: 등록된 다중이용시설의 명칭● 주소: 도로명 또는 지번 주소 (행정동 기준 공간분석 가능)'
