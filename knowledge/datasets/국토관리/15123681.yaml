summary_user: 경기도 토지의 고유번호가 행정구역 개편·지번 정비·경지정리 등으로 바뀐 이력을 필지 단위로 담은 건별 데이터로, 토지고유번호·현재 소재지·이전 소재지·변동 사유 코드·토지이동일자를 기록한다. 분석가나 토지정보 서비스 개발자가 '과거 문서에 적힌 옛 지번이 지금 어느 필지인지, 언제 무슨 사유로 바뀌었는지'를 추적할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 토지고유번호(land_idntfy_no)나 소재지 이름을 맞춰 보는 방식으로만 연결한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 토지 고유번호의 변동연혁에 관한 정보로, 행정구역 개편, 지번 정비, 경지정리 등의 사유로 발생하는 토지 고유번호 변경 이력을 기록하고 있습니다. 주요 항목에는 토지고유번호, 현재 토지소재지, 구토지소재지, 토지이용사유코드, 토지이동일자 등이 포함됩니다. ‘토지고유번호’는 토지를 식별하는 고유한 번호이며, ‘토지이동일자’는 변경이 발생한 날짜를 의미합니다. ‘토지이용사유코드’는 경지정리(토지대장), 구획정리(임야대장) 등 고유번호 변동의 원인을 명시하고 있으며, ‘구토지소재지’ 항목은 이전의 행정주소 또는 지번정보를 제공합니다. 이 데이터는 토지 소유권 관리, 부동산 개발 이력 추적, 행정구역 분석, 과거 이력 기반 토지정보 서비스 설계 등에 활용될 수 있습니다.
