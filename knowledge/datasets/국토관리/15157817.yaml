summary_user: 영천시에 있는 면직물 생산공장을 공장 한 곳당 한 행으로 담은 시군구 단위 현황으로, 회사명·전화번호·생산품(원단·타포린·타올 등)·용지면적·건축면적·지번 대표주소·대표업종번호와 업종명을 싣는다. 섬유업 거래처를 찾는 사업자나 지역 산업 분석가가 "영천시 안에서 타포린이나 타올을 만드는 공장은 어디이고 규모는 어느 정도인가"를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 필지코드 같은 전역 조인 키가 없어, 다른 공장등록 데이터와는 회사명·지번주소 문자열이나 업종번호(indutyNo)를 맞춰서만 이어 쓸 수 있다.
limits: 전역 조인 키가 없어 기업·토지 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 영천시 한 곳뿐이라 다른 시군과 비교하려면 별도 데이터가 필요하다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
