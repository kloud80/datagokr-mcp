summary_user: 지방자치단체가 구축해 국토교통부가 취합한 국토계획법상 지구단위계획 관련 특별계획구역 현황을 시도별 XLSX 파일로 담는다(범위 전국, 행정단위 기준·비공간). 도시계획 분석가나 개발사업자가 특정 지역에 특별계획구역이 지정돼 있는지, 지구단위계획 규제를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 용도지역·지구 자료와는 지역 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
limits: 포털 API가 아닌 vworld.kr 로그인 후 공간정보 다운로드 페이지에서 시도별 파일로 받는다(인증키 불필요, 포털 활용신청과 별개). 명세상 갱신은 수시·이벤트 주기라 정기 갱신을 기대하기 어렵고, 공통 조인 키가 없어 다른 데이터와 붙일 때 이름·코드 매핑이 필요하다.
