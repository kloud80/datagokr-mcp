summary_user: 광주 동구 관내 건물별 도로명주소를 한 건물(주소) 단위로 담은 파일로, 읍면동·도로명·기초번호(본번·부번)·건축물대장 건물명·건물용도·고시일자를 수록하며 범위는 시군구 한 곳의 필지·건물이다. 동구 안에서 특정 도로나 동에 어떤 용도의 건물이 있는지, 주소가 언제 고시됐는지를 확인하려는 민원 담당자나 위치 분석가가 쓴다. 전역 조인 키가 실측 컬럼에 없어 건축물대장 등 다른 데이터와는 도로명·기초번호·건물명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 광주광역시 동구 관내 건물 및 도로명주소 정보를 체계적으로 수록한 공공데이터로, 행정구역(시군구명, 읍면동명), 도로명, 건물번호, 건물명, 건물용도(대분류·소분류), 우편번호, 지번(본번/부번), 고시일자, 도로관리기관 등 다양한 속성 정보를 포함하고 있습니다. 도로명주소 기반의 공간정보를 제공하며, 주로 행정업무, 민원응대, 위치기반 서비스, 공간 분석, 건축 인허가 검토, 스마트시티 정책 등 다방면에 활용됩니다.특히 도로명 주소 + 건물번호 + 상세주소 체계를 통해 위치의 식별이 가능하며, 주소 기준의 유관 데이터(건축물대장, 안전점검대상, 부동산 정보 등)와 연계 시 활용도가 높습니다. 단일 주소단위로 구성되어 있으며, 고시일 기준 최신정보를 반영하여 주기적으로 업데이트되고, 실물주소와의 일치 여부는 별도 확인이 필요합니다. 해당 데이터는 행정구역 변경, 신규 건축물 발생, 주소 고시 변경 등에도 신속하게 반영되는 점에서 정책적·공공적 가치가 높습니다.
