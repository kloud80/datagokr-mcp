description_portal: '인천광역시가 사회조사를 통해 제공하는 이 데이터는 인천 시민들이 현재 거주하는 지역을 선택한 주된 이유를 군/구별, 성별, 연령별 등 다양한 인구사회학적 특성에 따라 세분화하여 집계한 통계 자료입니다. 이 데이터는 지역 정주(定住) 환경의 강점 및 약점을 파악하고, 인구 유입/유출 방지 정책, 도시 계획, 주거 환경 개선 정책 수립의 기초 자료로 활용됩니다.<주요 구성 항목>-특성별 분류: 데이터는 군/구별 (예: 중구, 동구, 연수구), 성별, 연령별 (13~19세부터 60세 이상), 학력별, 직업별, 월평균 가구소득별, 현재 주택 형태별, 가구원수별로 세분화됩니다.-주요 선택 이유별 비율: 거주지를 선택한 주요 이유를 구분하고 그 비율(%)을 제공합니다. 직장/학교와의 거리, 교통 편리성, 교육 환경, 자연 환경, 집값/전월세 가격, 편의시설, 주택 규모, 고향/연고지 등 여러 항목으로 분류됩니다.'
