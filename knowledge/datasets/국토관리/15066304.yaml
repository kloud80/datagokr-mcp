summary_user: 인천광역시 사회조사 결과 중 시민이 현재 거주지를 고른 이유를 군·구, 성별, 연령, 학력, 직업, 가구소득, 주택 형태, 가구원수 같은 특성별로 나눈 비율(%) 집계표이며, 1순위 응답과 1·2순위 복수 응답을 따로 담는다(CSV 약 6KB). 인천시나 군·구의 정책 담당자와 분석가가 '어느 구 주민이 교통이나 경제적 여건 때문에 그 지역을 골랐는가' 같은 정주 요인을 파악하는 데 쓴다. 전역 조인 키는 없고 특성 분류 열(특성별(1)·(2))의 군·구 이름이 유일한 연결 고리이므로, 다른 인천 통계와는 군·구 이름을 직접 맞춰 붙여야 한다.
limits: 개인 응답 원자료가 아니라 특성별 비율만 담은 집계표라서 교차 분석이나 표본 수 확인이 어렵다. 행정코드 같은 조인 키가 없어 다른 데이터와 붙이려면 군·구 이름을 직접 매핑해야 한다. 1순위 비율과 1·2순위 복수 응답 비율은 기준이 다르므로 서로 더하거나 비교하면 안 된다.
