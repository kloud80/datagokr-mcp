summary_user: 경기도 평택시에 있는 공공하수처리시설을 시설 한 곳당 한 행으로 담은 작은 CSV 파일(4,785바이트)로, 시설명·소재지주소·시설용량·처리방법·가동일·위탁업체와 위탁기간·방류수 소독방법·방류수역·재생에너지 이용 여부를 담는다. 평택시 주민이나 하수도 분석가가 '우리 동네 하수처리장은 하루 얼마를 어떤 방식으로 처리하고, 어느 수역으로 방류하며, 누가 위탁 운영하는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 시설명·주소를 맞추거나 같은 기관(평택시) 데이터끼리만 이어 쓴다.
limits: 범위가 평택시 한 곳의 시설 목록에 그쳐 다른 시군과 바로 비교할 수 없다. 방류수 수질(TMS) 같은 운영 실적은 들어 있지 않다. 표준 시설 코드가 없어 다른 하수처리장 원장이나 수질 데이터와는 이름·주소 매칭으로만 연결된다.
