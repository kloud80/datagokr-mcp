summary_user: 경상북도 안의 산업단지와 농공단지를 단지 한 곳당 한 행으로 정리한 현황 파일로, 단지명·유형·시군구와 지정면적·분양대상면적·분양공고면적·분양·미분양 면적, 미분양률을 담는다(csv 약 12KB). 지자체 담당자나 입지를 찾는 사업자가 '경북 어느 시군의 농공단지에 미분양 용지가 많이 남아 있나'를 확인하는 데 쓴다. 전역 조인 키나 산업단지코드가 없어서 전국산업단지 표준데이터나 국토부 산업단지 일반현황과는 단지명·시군구 이름을 맞춰서 연결해야 한다.
description_portal: 경상북도 산업단지 및 농공단지 현황 자료는 도내에서 운영 중인 각 산업단지와 농공단지의 기본 정보와 조성 규모, 지정 면적, 분양 현황 등 주요 운영 실태를 한눈에 파악할 수 있도록 정리한 데이터입니다. 이 자료는 개별 단지의 특성, 위치, 면적 구성과 같은 기초 정보를 구조화하여 제공함으로써 지역 산업 기반의 분포와 조성 현황을 이해하는 데 도움을 줍니다. 또한 분양 가능 구역과 조성 단계 등의 항목을 포함하고 있어 행정계획 수립과 산업단지 관리 업무에도 활용도가 높습니다. 데이터는 표준화된 형태로 구성되어 있어 직접 비교나 분석이 용이하며, 향후 관련 보고서나 공공데이터 연계 작업에서도 안정적으로 활용될 수 있는 형태입니다. 자료 관련 문의는 054-880-4923으로 하시기 바랍니다.
