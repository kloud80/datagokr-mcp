summary_user: 울산광역시 하수도 요금 단가를 업종별·사용량(세제곱미터) 구간별로 정리한 소규모 요금표 파일(csv 780바이트)로, 2020년 2월·2021년 1월·2022년 1월 검침분부터 적용되는 세제곱미터당 요금을 나란히 담는다. 시민이나 사업자가 '우리 업종이 이만큼 쓰면 하수도 요금 단가가 얼마이고 개정 때마다 얼마나 올랐나'를 확인하거나, 분석가가 연도별 요금 인상 폭을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 하수도 요금표나 상수도 요금 데이터와는 업종명·사용량 구간 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 관내 하수도 사용에 대한 요금 체계 정보이다. 용도별 요금 단가, 구간별 누진 요금, 요금 산정 기준, 감면 대상, 부과 방식, 요금 개정 이력 등의 상세 내용을 포함한다. 가정용, 업무용, 영업용, 공업용 등 사용 용도에 따라 요금이 구분되어 있으며, 사용량 구간별 요금 단가가 명시되어 있다. 본 정보는 하수도 요금 관리, 상하수도 정책 수립, 시민 부담 분석, 환경 기초 시설 운영 재원 확보 등에 활용되며, 합리적인 요금 체계 유지를 위한 기초 자료로 제공된다. 하수도 요금 현황 분석을 통해 적정 요금 수준을 평가하고, 하수 처리 시설의 안정적 운영과 환경 보호를 위한 재원 확보 방안을 수립하며, 공정하고 투명한 요금 제도 운영에 기여한다.
