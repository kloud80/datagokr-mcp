summary_user: 전국 영구임대주택 단지 935건을 단지·형명 단위로 담은 CSV 파일로, 지역, 세대수, 주택유형, 임대사업자, 준공일자(1987-05-11~2025-11-30), 공급면적, 임대보증금·월임대료·전환보증금을 싣는다. 영구임대 입주를 알아보는 사람이나 지역별 공공임대 공급·임대료 수준을 비교하는 분석가가 특정 지역의 단지와 임대 조건을 찾는 질문에 쓴다. 도로명주소(address)가 조인 키라서 같은 주소 기준의 다른 주택·건물 데이터나 전월세 실거래 데이터와 이어 쓰며, 코드표를 가진 필드는 없다.
description_portal: 한국토지주택공사에서 위탁관리중인 마이홈포털의 영구임대 주택 정보로서 광역시도 및 시군구, 단지명, 세대수, 주택유형, 임대사업자, 공급면적(전용, 공용), 준공일자, 난방방식, 주차대수, 승강기 설치여부, 임대보증금, 월임대료, 전환보증금 등의 정보를 제공합니다. 영구임대 주택이란 입주자격 기준에 부합하면 2년마다 계약 갱신을 하여 계속 거주할 수 있는 임대주택 공급 유형을 말합니다. 입주자격, 입주절차, 임대조건 등 세부사항은 단지마다 차이가 있을 수 있으므로 LH 청약플러스(https://apply.lh.or.kr)에서 확인하시는 것을 권장드립니다. 본 데이터는 공급주체가 한국토지주택공사가 아닌 위탁 관리 중인 주택 정보를 포함하고 있으므로 유의하시기 바랍니다.
