summary_user: 광주 서구에 있는 제조업체를 업체 한 곳당 한 행으로 담은 명부 파일(CSV, 약 57KB)이다. 회사명, 공장 도로명주소, 연락처, 업종명과 산업분류코드, 생산품, 종업원수가 들어 있다. 지역경제 분석가나 구청 기업지원 담당자가 "서구에는 어떤 업종의 제조업체가 어디에 얼마나 몰려 있고 고용 규모는 어느 정도인가"를 볼 때 쓴다. 전역 조인 키는 없으므로 업종번호(산업분류코드)로 업종 통계에 붙이거나, 도로명주소나 회사명으로 팩토리온 공장등록·산업단지 입주기업 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 광주광역시 서구에 소재한 제조업체의 현황을 정리한 자료로, 업체별 고유번호, 회사명, 대표자명, 주소, 전화번호, 팩스번호, 업종명, 주요 생산품 등의 항목으로 구성되어 있습니다. 서구 지역 내 제조업 기반의 산업 분포와 중소기업 활동 현황을 파악하는 데 유용한 정보로, 지역경제 분석, 기업지원 정책 수립, 산업유치 전략 마련, 상권 분석 및 관련 행정자료로 활용 가능합니다. 데이터는 연도 기준으로 연 1회 업데이트되며, CSV 형태로 제공되어 다양한 분석도구와 연계해 활용할 수 있습니다.
