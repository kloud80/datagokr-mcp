summary_user: 경기도 시군구 간 이동을 출발지·도착지 시군구 쌍(OD)별로 성별·연령대·이동수단·평일 구분에 따라 나눈 이동 인구수(popltn_cnt)를 기준연월 단위로 담은 집계 자료다. 교통 분석가나 지자체 담당자가 '특정 시군에서 다른 시군으로 출근하는 20~30대는 주로 어떤 교통수단을 쓰는가' 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았고, 출발·도착 시군구 코드와 이름, 중심 좌표를 행정구역 코드표나 같은 기관(경기도) 데이터와 이름·코드로 맞춰 연결하며, 코드값 설명은 경기도 민간데이터 규격서 데이터셋을 참조한다.
description_portal: 이 데이터는 경기도 시군구 간 이동을 성별·연령별·이동 수단별로 구분한 OD(Origin–Destination) 자료입니다. 출발지와 도착지 간 이동 규모를 성별·연령대별로 세분화하고, 교통수단에 따라 나누어 제공하여, 인구 특성별 이동행태와 교통수단 선택 경향을 분석할 수 있습니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
