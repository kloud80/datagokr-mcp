description_portal: '경기도 양주시_도시계획정보시스템(UPIS) 농지역 현황 데이터는 양주시 내 도시계획 용도지역 중 농지역에 해당하는 공간 정보를 제공한다. 주요 항목은 행정동별 관리번호, 라벨명, 면적(㎡), 길이(도형), 생성일 등으로 구성되어 있으며 총 123개의 데이터가 수록되어 있다. 예시로는 농지 구역별 면적이 최소 수㎡부터 최대 수백만㎡까지 다양하게 기록되어 있으며, 도형 길이와 면적값을 통해 해당 농지역의 공간적 범위를 확인할 수 있다. 라벨명은 대부분 "농지역"으로 표시되어 있어 도시 내 농업활동이 이루어지는 지역을 구분할 수 있도록 지원한다. 이 데이터는 도시계획, 토지 관리, 농업정책 수립 등에 활용할 수 있으며, 특히 농지 면적과 분포를 파악하여 합리적인 토지이용계획을 수립하는 데 중요한 기초 자료로 제공된다. 또한 다른 공간 데이터(예: 공원, 주거지역, 상업지역 등)와 연계하면 양주시의 토지 활용 현황을 종합적으로 분석할 수 있다.'
