summary_user: 경기도 광주시 도시계획정보시스템에 등록된 개발진흥지구를 지구 한 건(현황도형 관리번호)마다 명칭·면적·경계 길이·등록일시로 담은 시군구 단위 현황 파일이다(CSV 약 6.7KB). 사업자나 분석가가 '광주시에 어떤 개발진흥지구가 있고 각각 면적이 얼마인가'를 확인하거나 건축 인허가·투자 검토 때 지구 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 시군구코드로 같은 지역의 다른 용도지구·도시계획 현황 데이터와 묶거나 지구 명칭(라벨명)으로 대조해 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 개발진흥지구 현황 정보를 제공합니다. 주거기능, 공업기능, 유통물류기능, 관광휴양기능, 복합기능 등을 집중적으로 개발하고 진흥시키기 위해 지정된 지구의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지구를 고유하게 식별하며, 라벨명은 개발진흥지구의 명칭을 나타냅니다. 면적은 지구가 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 산업 육성 정책, 지역 개발 계획, 건축 인허가 심사, 투자 유치, 용도지구 관리 등에 활용됩니다.
