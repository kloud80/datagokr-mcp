summary_user: 인천광역시 서구(서해구)의 등록 임대사업자 수와 등록 임대주택(임대물건) 수를 기준연도·분기·소재지별로 정리한 집계 파일이며, 범위는 시군구 단위이고 파일 크기는 약 2KB로 작다. 분석가나 주택 정책 담당자가 '서구 안에서 어느 지역에 등록 민간임대 사업자와 임대주택이 많이 몰려 있고, 분기별로 어떻게 늘거나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 소재지 이름과 기준연도·분기를 맞춰 붙여야 하고, 전월세 실거래 같은 임대차 데이터와는 이 방식으로 나란히 비교한다.
limits: 표준 행정코드 같은 조인 키가 없어서 다른 데이터와 연결할 때는 소재지 이름을 직접 맞춰야 한다. 사업자·물건별 원천 목록이 아니라 지역별 건수 집계이므로 개별 임대주택이나 임대 조건은 알 수 없다.
