description_portal: 이 데이터는 한국수자원공사가 전국 수도사업자를 대상으로 배수 블록 시스템 구축 현황을 정리한 것이다. 배수 블록 시스템은 누수 방지 및 수돗물의 효율적 관리를 위해 배수구역을 대블록, 중블록, 소블록 단위로 구분하여 운영하는 체계이다. 본 데이터는 각 연도별 수도사업자의 계획 블록 수와 실제 운영 중인 블록 수를 구분하여 제공하며, 지역별 블록 시스템 구축 수준과 운영 실태를 파악하는 데 활용된다. 주요 항목은 순번, 연도, 수도사업자명, 계획 및 운영 대·중·소 블록 개수로 구성되어 있다. 이 데이터는 물 관리 정책 수립, 누수 저감 대책 마련, 수도 서비스 품질 개선 등 다양한 정책적 활용이 가능하다.
