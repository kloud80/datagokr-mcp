description_portal: 이 자료는 서울두드림길이라는 서울시 내 둘레길의 **점형 위치정보(개별 지점 좌표)**를 WGS84 위경도 좌표계로 제공한 공간 데이터입니다.  각 지점은 쉼터, 이정표, 도보 종착지점 등 둘레길 경험에 중요한 포인트로 구성될 수 있으며, 총 117개 지점이 포함되어 있다고 명시되어 있습니다.  제공 파일은 CSV 또는 쉐이프파일 형식이며, 좌표정보(위도·경도)가 포함되어 있어 GIS 분석, 모바일 애플리케이션 경로 기능, 관광 및 레크리에이션 인프라 설계 등에 활용가능합니다. 예컨대 둘레길 접근성 평가, 주차장·대중교통 연계 분석, 주변 녹지·공원·상권 분석 등에 유용합니다. 셰이프파일의 인코딩은 UTF-8로 설정되어 있으며, 제공기관은 서울특별시 푸른도시여가국 자연생태과입니다.  데이터 라이선스는 ‘출처표시 + 상업적 이용금지 + 변경금지’ 형태로 제공됩니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
