summary_user: 환경부가 제공하는 댐 제원을 댐 한 곳당 한 행으로 담은 데이터로, 댐 코드·이름·형식, 높이·길이·체적, 하천과 유역, 유역면적·평균강우량, 계획홍수위·상시만수위·저수위별 저수용량, 홍수조절용량, 유효저수용량, 설계홍수량 같은 항목을 전국 범위로 담는다. 재난·수자원 분석가가 가뭄이나 홍수철에 "이 댐의 유효저수용량과 홍수조절용량은 얼마이고 어느 하천·유역에 있나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 댐 운영·수위·방류 자료와는 댐 코드(DAM_CD)나 댐 이름 매핑으로, 하천 자료와는 하천 코드·이름으로 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털(www.data.go.kr)에서 연계하여 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 댐제원에 대한 관련 정보입니다.\""
