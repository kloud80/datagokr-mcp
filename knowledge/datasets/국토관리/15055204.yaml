summary_user: 인천광역시 군·구별 주택 매매·전세 가격지수와 변동률을 종합주택과 아파트로 나눠 집계한 통계 파일로, 포털 설명상 2024년 6월 기준 값을 담은 738바이트 분량의 작은 CSV입니다. 인천에서 이사나 전세 계약을 앞둔 시민이나 분석가가 "최근 어느 군·구의 아파트 전세가격이 가장 많이 올랐나"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 군·구 이름(행정구역별 시군구)을 행정구역 코드로 매핑해 이어 쓰고, 최신 주간 지수는 한국부동산원 R-ONE 같은 원천 통계와 함께 본다.
description_portal: 인천광역시 주택가격 현황(주택매매가격지수, 주택전세가격지수)등의  지수 정보(2024년 6월 기준)입니다.이 공공데이터는 인천광역시의 군·구별 주택 가격에 대한 매매 및 전세 가격 지수와 변동률을 집계하여 제공하는 통계 자료입니다. 이 자료는 지역 부동산 시장의 동향을 파악하는 데 활용됩니다.이 자료는 인천 지역 부동산 시장의 동향 및 안정성을 분석하고, 주거 정책 및 주택 공급 계획 수립의 기초 자료로 활용됩니다. 또한, 일반 시민들이 지역별 부동산 투자 및 주거 이동을 결정하는 데 중요한 참고 정보를 제공합니다.인천시 주거 복지 및 부동산 시장 관리를 위한 핵심 기반 정보입니다
