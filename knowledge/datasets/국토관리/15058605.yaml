summary_user: 경기도 시군별로 하수도 요금의 연간 부과량·부과액·평균단가와 총괄원가·처리원가·현실화율을 연도(SUM_YY) 단위로 담은 집계 자료다. 지자체 재정 분석가나 시민이 '우리 시군의 하수도 요금은 원가 대비 몇 퍼센트 수준이고 다른 시군보다 높은가'를 비교할 때 쓴다. 전역 조인 키는 없고 시군명·시군코드(SIGUN_CD)로 같은 경기도 시군 단위 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 이 데이터는 각 시군별 하수도 요금 관련 정보를 제공하는 자료로, 지역 간 하수도 운영 실태와 요금 정책을 비교하거나 분석하는 데 활용됩니다. 주요 항목으로는 연간부과량(FYR_LEVY_QTY), 부과액(LEVY_AMT), 평균단가(AVG_UNPC), 총괄원가(SUMRIZE_PCOST), 처리원가(PROC_PCOST), 현실화율(ACTULZTN_RT) 등이 있으며, 하수도 서비스 제공에 따른 재정 운영의 효율성을 확인할 수 있도록 설계되어 있습니다. 이를 통해 지방자치단체의 공공요금 책정 기준, 요금 현실화 수준 및 재정 부담 정도를 파악할 수 있으며, 요금 체계의 개선이나 정책 수립을 위한 기초자료로 사용됩니다. 또한 하수도 운영의 투명성을 확보하고, 환경기초시설의 지속가능한 운영을 위한 재정 계획 수립 시에도 유용하게 쓰일 수 있습니다. 이 데이터는 API를 통해 외부 시스템과 연계가 가능하며, 상하수과에서 관리하고 있습니다.
