description_portal: '전북특별자치도 전주시 토지소재지 기준의 토지 이용현황을 지목별로 분류하여 집계한 공공기반 자료로, 총계 항목을 포함해 전, 답, 과수원, 임야, 대, 공장용지, 주차장 등 총 28개 지목으로 구성되어 있습니다. 이를 통해 지역별 토지이용 구조를 파악하고, 농지·임야 비율, 도시화 정도, 공공시설 비중 등을 정량적으로 분석할 수 있습니다. 행정계획, 부동산정책, 개발제한구역 설정, 난개발 방지, 국토균형발전 등의 정책 수립과 공간정보 분석에 기초자료로 활용되며, 기후위기 대응과 탄소흡수원 확보를 위한 임야 보호, 수변지 관리 등 환경계획에도 중요한 역할을 합니다.항목 : 전, 답, 과수원, 목장용지, 임야, 광천지, 염전, 대, 공장용지, 학교용지, 주차장, 주요소용지, 창고용지, 도로, 철도용지, 제방, 하천, 구거, 유지, 양어장, 수도용지, 공원, 체육용지, 유원지, 종교용지, 사적지, 묘지, 잡종지'
