description_portal: "공동체주택 정보를 볼 수 있도록 제공하는 서비스입니다.- 주요내용 : 첨부파일id, 타이틀, 컨텐츠, 등록자, 등록날짜, 수정자, 수정날짜, 등 <용어설명>*공동체 주택(Community Housing)은 입주민이 일정한 공동의 가치나 생활양식을 공유하면서, 개인 공간(각 세대의 방, 주방 등)과 함께 공용 공간(거실, 공유부엌, 커뮤니티룸, 정원 등)을 함께 사용하는 주택 유형제공부서는 서울특별시 주택실 주택정책관 임대주택과(02-2133-9591)입니다.\"해당 데이터의 원본시스템은 '공동체주택홈페이지(https://soco.seoul.go.kr/coHouse/main/main.do) 입니다.\"※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다."
