summary_user: 경상북도개발공사가 진행한 물품·용역·공사 입찰을 공고 한 건씩 담은 CSV 파일로, 입찰공고명·계약방법·입찰방법·입찰개시·입찰마감·개찰일자를 포함한다(약 11KB 규모). 지역 사업자가 이 공사의 최근 입찰 일정과 계약 방식(일반경쟁·제한경쟁·협상에 의한 계약 등)을 확인해 참여 여부를 판단하는 데 쓴다. 전역 조인 키는 없고, 조달청 공고번호(조달청공고번호)를 나라장터 입찰공고 정보와 맞춰 보는 식으로 이어 쓴다.
