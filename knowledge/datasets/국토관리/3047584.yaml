description_portal: 경상북도개발공사의 최근 입찰정보입니다. 입찰공고명, 계약방법, 입찰방법, 입찰개시, 입찰마감, 개찰일자 등이 포함되어 있습니다. 경상북도개발공사는 물품, 용역 등의 조달업무를 국가종합전자조달시스템인 나라장터를 이용하여 조달업무를 진행하고 있으면, 공사의 홈페이지에서도 입찰정보를 확인할 수 있습니다. 입찰업무는 물품, 용역, 공사업무로 진행하고 있으며, 계약방법은 협상에의한계약, 일반경쟁, 제한경쟁 등으로 진행하고 있습니다. 공사의 입찰정보는 2020년 이후의 입찰정보를 공개하고 있습니다.
