description_portal: 본 데이터는 광주광역시의 시군구별 민간분양 미분양주택 현황을 전용면적 구간에 따라 구분하여 제공하는 자료입니다. 총괄, 준공후, 미준공 현황으로 구성되어 있으며, 전용 40㎡이하, 40~60㎡, 60~85㎡, 85㎡초과 등 면적대별 미분양 수를 함께 제시하고 있습니다. 광주광역시 전체를 비롯하여 동구, 서구, 남구, 북구, 광산구의 미분양 규모와 15일 전 대비 증감 현황이 표로 정리되어 있으며, 매월 기준 미분양 수치를 비교하여 확인하실 수 있도록 구성되어 있습니다. 각 구별 미분양 규모와 면적대별 현황이 모두 포함된 자료입니다.
