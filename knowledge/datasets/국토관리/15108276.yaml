summary_user: 서울 구로구 안에서 진행 중이거나 끝난 민간 건축공사장을 현장 한 곳당 한 행으로 담은 파일로, 건축구분·대지위치·연면적·구조·허가일·착공처리일·지상/지하 최대층수·주용도·감리사무소·시공사가 들어 있다(CSV 약 5KB 규모의 소량 원천 목록). 주민이 우리 동네 공사 현장이 언제 착공했고 어느 시공사·감리사가 맡았는지 확인하거나, 분석가가 구로구 신축·리모델링 동향과 용도 구성을 살펴볼 때 쓴다. 전역 조인 키(법정동코드·PNU 등)가 없어 대지위치 주소를 지오코딩하거나 주소 문자열로 건축인허가·건축물대장 데이터와 맞춰 이어 써야 한다.
description_portal: 본 데이터는 서울특별시 구로구에서 진행 중이거나 완료된 민간공사장 현황 정보를 제공합니다.민간공사장은 주택, 상가, 오피스텔 등에서 건축 또는 리모델링을 목적으로 하는 공사 현장을 의미하며, 도시 환경과 생활에 영향을 줍니다.데이터에는 건축구분, 대지위치, 연면적, 구조, 허가일, 착공일, 지상층수, 지하층수, 주용도, 감리사무소명, 시공사명, 기준일 등이 포함되어 있습니다.이 정보는 주민 여러분께서 공사 현황을 확인하거나 행정기관의 민원 처리 및 도시계획 수립에 참고하실 수 있습니다.또한 건축물 동향을 파악하거나 통계 자료로도 활용 가능합니다.데이터는 정기적으로 갱신되며, 공공데이터포털에서 자유롭게 조회하고 이용하실 수 있습니다.
