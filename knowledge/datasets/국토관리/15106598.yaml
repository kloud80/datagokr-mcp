summary_user: 충청북도 괴산군에 조성된 산업단지별 입주기업 현황을 기업 한 곳당 한 행으로 담은 파일로, 단지명·회사명·공장 주소·전화번호를 2022년 9월 13일 기준으로 정리했다. 괴산군 산업단지에 어떤 기업이 입주해 있는지, 특정 단지의 입주업체 연락처가 무엇인지 확인하려는 구직자·사업자·지역 분석가가 쓴다. 산업단지코드 같은 전역 조인 키가 없으므로, 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황과는 단지명(단지명)이나 공장 주소를 이름·주소 매칭으로 이어 쓴다.
