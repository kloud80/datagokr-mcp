description_portal: 이 데이터는 부산광역시 기장군 건축허가 및 신고 현황 데이터입니다. 이 데이터는 부산광역시 기장군 건축과에서 현행화 관리되고 있습니다.부산광역시 기장군 내 건축허가(신고), 착공신고, 사용승인(허가,신고) 현황 정보를 제공하며, 세부사항으로는 건축물의 대지위치, 구조, 연면적, 용적률, 건폐율, 허가일, 주용도 등의 정보를 제공합니다.또한, 「공공기관의 정보공개에 관한 법률」 규정에 따라 공공기관이 보유·관리하는 정보에 대한 국민의 공개 청구 및 공공기관의 공개 의무에 관한 사항, 제9조에 따라 비공개 대상 정보는 비공개 후 제공합니다.
