description_portal: 본 데이터는 대구광역시 수성구 관내에서 시행된 옥상녹화사업 조성 현황을 정리한 자료로, 건물명, 주소(도로명), 녹화 면적(㎡), 설치 연도, 녹화 유형(식생 매트, 텃밭형, 휴식형 등), 시공 주체(공공·민간), 데이터 기준일자 등의 항목으로 구성된다. 옥상녹화는 도심 열섬 완화, 미세먼지 저감, 우수 저류, 경관 개선 등을 목적으로 추진되며, 본 자료는 각 건물의 녹화 유형 및 면적, 설치 시기와 시공 주체 정보를 통해 사업 분포와 효과를 분석하는 데 활용된다. 수성구청은 공공시설뿐 아니라 민간 건물까지 포함하여 사업지를 확대하고 있으며, 본 데이터는 도시 녹지 정책, 기후환경 개선, 도시재생 계획, 에너지·물 관리, 공간 환경 분석, 정책 평가, 시민 홍보 자료 제작 등에 유용한 기초정보로 제공된다. 사업 효과 모니터링 및 확대 방향 수립을 위해 정기적으로 갱신된다.
