summary_user: 대구광역시 수성구에서 시행한 옥상녹화사업을 건물 한 곳당 한 행으로 담은 소규모 원천 목록(CSV 919바이트)으로, 건물명·소재지·조성연도·녹화 면적(㎡)을 담는다. 구 주민이나 도시녹지·기후환경 분석가가 "수성구에서 어느 해에 어떤 건물 옥상이 얼마나 녹화됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 소재지 주소를 주소 정제·지오코딩해 건축물·녹지 자료와 맞추거나 같은 기관의 다른 자료와 이름으로 맞춰 이어 쓴다.
