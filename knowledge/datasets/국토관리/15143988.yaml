summary_user: 한국산업기술시험원이 2024년 8~9월 식물공장 컨테이너 2개 동에서 측정한 피상전력(VA)을 측정일 기준으로 담은 건별 계측 데이터이며, 동별 메인값과 에어컨·공조기·양액기·조명·LED 등 설비별 값이 열로 나뉜다(CSV 약 50MB). 스마트팜 연구자나 설비 설계자가 '컨테이너형 식물공장에서 LED와 냉방 설비가 전체 부하 중 얼마를 차지하고, 변압기·배전반 용량은 얼마로 잡아야 하나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 측정일 기준 시간 정렬이나 같은 기관이 낸 식물공장 전력 데이터와의 이름 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 한국산업기술시험원이 2024년 8월부터 9월까지 식물공장에서 수집한 전체 유효전력(active power)과 무효전력(reactive power)의 벡터 합으로 구성된 피상전력(apparent power) 데이터입니다. 피상전력은 전기설비에 공급되는 전체 전력량을 의미하며, 실제 일을 수행하는 유효전력과 전력계통 내 전자기장 형성 등을 위해 사용되는 무효전력이 직각을 이루며 결합된 물리량입니다. 피상전력은 VA(Volt-Ampere) 단위로 표시되며, 전력계통의 총 부하 특성과 설비 용량을 산정할 때 매우 중요한 지표로 활용됩니다. 특히 스마트팜의 전력 설비(변압기, 배전반, 전력기기 등)를 설계하거나 운전 효율을 분석할 때 필수적인 데이터입니다. 또한 본 데이터는 에너지 소비 특성 분석, 전력 품질 진단, 전기요금 절감 방안 마련, 대기전력 최소화 모델 개발 등 다양한 스마트 온실 전력 관리 및 제어 기술 연구에 활용될 수 있습니다.
