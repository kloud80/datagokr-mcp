summary_user: 전국 수도꼭지에서 매월 채수한 수돗물의 법정 수질검사 결과를 채수 지점(수도꼭지 위치)별 건으로 담으며, 일반세균·총대장균군·대장균·암모니아성질소·동·아연·염소이온·철·망간·잔류염소 값과 검사월·채수일자·수도사업자·공급정수장이 함께 들어 있다. 시민이나 지자체 상수도 담당자가 "우리 동네 정수장에서 공급한 수돗물이 수도꼭지 단계에서 기준에 맞는가"를 확인하거나 정수장별 월별 수질 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 정수장 관련 다른 데이터와는 공급정수장·수도사업자 이름을 맞춰 연결해야 한다.
