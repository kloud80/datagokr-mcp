description_portal: '본 데이터는 매월 전국 수도꼭지에서 채취한 먹는물 법정 수질검사 결과입니다. 검사 항목은 수도법 기준을 따르며 국민이 사용하는 수돗물의 안전성을 확인하기 위해 시행된 결과입니다. 이를 통해 공급 구간의 위생 상태와 품질을 점검하고 관리 대책을 마련할 수 있습니다. 본 자료는 가정과 공공시설 수돗물의 신뢰성을 높이고 음용수 관리 체계를 강화하는 데 기여합니다.제공항목 : 지자체, 급수방식, 수질검사결과 등을 포함(일반세균 단위 : CFU/mL, 암모니아성질소/동/아연/염소이온/철/망간/잔류염소 단위 : mg/L)'
