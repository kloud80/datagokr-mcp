summary_user: 서울시 건축인허가 건의 동(건물)별 개요를 담는다. 대지위치·시군구·법정동·번지, 건물명, 주·부속 구분, 주용도, 구조·지붕, 건축면적·연면적·용적률산정연면적, 호수·가구수·세대수, 승강기 수가 한 동 단위 행으로 기록된다. 분석가가 서울 특정 자치구·동에서 인허가된 건물의 용도·규모·세대수 구성을 살펴보고, 인허가를 지역 개발 흐름의 선행 지표로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구·법정동 이름과 본번·부번(MN_LOTNO, SUB_LOTNO) 같은 지번 매핑으로만 이어 쓴다.
description_portal: 부속건축물 현황을 상세히 정리한 것입니다. 포함된 부속건축물은 MDF실, 경비실 1·2, 지하주차장, 펌프실 등으로, 각 시설별 용도, 구조, 지붕 형태, 바닥면적, 연면적, 지하·지상층 수, 층고, 천장 높이, 외벽 두께 등의 물리적 특성이 기록되어 있습니다. 또한 공공임대, 민간임대, 분양 여부와 관련된 세대 수 정보가 포함되어 있어 주거 형태나 시설 활용 현황 파악이 가능합니다. 이 데이터는 공동주택 관리, 시설 안전 점검, 유지보수 계획 수립, 건축물 구조 분석, 재난 대비 설비 점검 등 다양한 행정 및 기술적 목적으로 활용될 수 있습니다.
