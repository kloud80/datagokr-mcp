description_portal: 이 데이터는 영구임대 계약자의 연령대, 성별, 주택소재지, 가족수, 주거급여 수급 여부와 보증금·월임대료 정보를 포함하는 합성데이터입니다. 개인식별자를 제거하였고, 합성데이터 모델을 활용해 실제 계약정보를 통계적,구조적으로 반영하면서도 개인정보 침해 위험이 없는 데이터를 생성하였습니다. 이를 개방함으로써 기관은 임대료 산정 기준과 지원정책을 검토할 수 있고 민간은 주거 안정성 연구와 임대료 수준 분석에 활용 가능합니다.또한 계약자의 배경 특성과 임대조건 간 관계를 분석해 소득수준별 부담 가능성을 연구할 수 있습니다. 이는 공공임대 제도의 지속가능성을 평가하는 근거가 되며, 민간의 경우 장기거주자의 임대 안정성을 모델링해 금융상품 설계에도 참고할 수 있습니다. 나아가 학술 연구에서는 임대계약 조건과 사회적 계층 구조 간 상관관계를 탐구하는 데 유용합니다.
