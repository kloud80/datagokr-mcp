summary_user: 경상북도 관내에서 가동 중인 가축분뇨 공공처리시설을 시설 1곳당 1행으로 정리한 작은 파일(csv 약 1KB)로, 시군·소재지 주소·일일 처리용량(㎥/일)·처리방법·가동일자를 담는다. 축산 폐수 처리 기반을 살피는 지자체 담당자나 분석가가 '경북 어느 시군에 가축분뇨 공공처리시설이 있고 하루 처리용량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명이나 소재지 주소를 이름으로 맞춰 하수처리장·분뇨 관련 현황과 이어 쓴다.
