summary_user: 광주 광산구 관내 아파트 단지별로 단지명·동·지번·주소, 세대수, 난방방식, 경과년수, 사업주체, 관리방법, 관리직원 수, 승강기 유무와 대수를 한 행씩 담은 단지 단위 현황 파일이다(약 25KB CSV, 포털 설명상 2016년 자료만 존재). 분석가나 공무원이 '2016년 당시 광산구 노후·소규모 단지가 어느 동에 몰려 있었고 관리 인력·승강기 여건은 어땠나' 같은 공동체 정책 기초 질문에 쓴다. 전역 조인 키(K-apt 단지코드 등)가 없어 다른 공동주택·실거래 데이터와는 단지명·지번·주소를 맞춰 이어 붙여야 한다.
description_portal: 광주광역시 광산구는 아파트 공동체 자원 일반 현황에 대한 정보를 제공합니다. 이 자료에는 각 아파트 단지의 단지명, 주소, 세대수, 난방방식, 경과년수, 사업주체, 관리직원수, 승강기 유무 등 다양한 항목이 포함되어 있습니다. 광산구 정책 분석을 목적으로 한시적으로 수집된 자료로, 2016년 자료만 존재합니다. 따라서 현재 시점에서는 최신 정보가 반영되어 있지 않으며, 2016년 당시의 아파트 공동체 자원 일반 현황을 파악하는 데 유용한 자료로 활용될 수 있습니다. 이러한 정보는 지역사회 공동체의 활성화 및 정책 수립에 중요한 기초 자료로 활용됩니다.
