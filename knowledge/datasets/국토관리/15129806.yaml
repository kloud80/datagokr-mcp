summary_user: 한국토지주택공사가 추첨 방식으로 공급하는 토지를 필지 단위로 담은 파일로, 블록명·가분할면적·확정면적·확정(예정) 본번·부번·소재지역명·공급예정금액·분양신청예약금액·공동신청 가능 여부 등을 전국 범위로 제공한다(CSV 약 10.7MB). 추첨 분양 토지를 찾는 개인이나 사업자가 "어느 지역 블록 필지가 얼마에 공급되고, 공동으로 신청할 수 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 소재지역명과 본번·부번을 주소·지번으로 맞춰 지적·공시지가 데이터와 연결하거나, 같은 기관의 공고 데이터와 이름으로 이어 쓴다.
limits: 표준 행정코드나 PNU 같은 조인 키가 없어 다른 데이터와는 소재지역명·지번 문자열 매칭으로만 연결된다. 필지별 상세 조건은 이 파일에 없으므로 각 추첨 공고의 공고문을 따로 확인해야 한다.
