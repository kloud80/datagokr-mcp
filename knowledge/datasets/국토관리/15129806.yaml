description_portal: 한국토지주택공사에서 추첨을 통해 공급하는 추첨공고 토지에 대하여 블록명, 가분할면적, 확정면적, 확정(예정)본번, 확정(예정)부번, 소재지역명, 공급예정금액, 분양신청예약금액, 공동신청가능여부, 공동신청최소인원수 등 정보를 제공합니다. 각 필지에 대한 상세한 정보는 각 추첨 공고의 공고문을 확인하시기 바랍니다. 한국토지주택공사가 공급하는 토지는 경쟁입찰, 추첨, 수의계약 등의 방식으로 공급하며 그 근거는 공공주택 특별법 시행령 제24조에 두고 있습니다. 특히 토지를 추첨의 방법으로 공급할 때에는 가격을 미리 정해야 하고 그 가격은 서민의 주거안정과 도시의 발전 등을 위하여 용도별ㆍ지역별ㆍ공급대상자별로 달리 정할 수 있도록 하고 있습니다.
