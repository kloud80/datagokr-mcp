summary_user: 대전광역시 중구에서 추진 중인 재개발사업의 구역별 조합 정보를 구역 한 건당 한 행으로 담은 작은 CSV 파일(약 2KB)로, 구역명·구역 위치(지번)·조합 사무실 주소·조합 연락처를 담는다. 중구 재개발구역 주민이나 투자 검토자가 '우리 동네 재개발 조합 사무실은 어디이고 전화번호는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 정비사업 데이터와는 구역명이나 지번 주소를 이름·주소 매칭으로 맞춰 이어 써야 한다.
description_portal: 본 공공데이터는 대전광역시 중구내에서 추진중인 재개발사업 구역별 조합의 연락처 현황으로 재개발구역명, 재개발구역위치, 재개발조합연락처, 재개발조합사무실위치 정보를 제공합니다데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 위치는 재개발사업 구역의 지번 주소를 기준으로 작성되어 있습니다.데이터 컬럼 중 조합 사무실 주소는 도로명 및 지번이 혼재되어 있으니 참고하시기 바랍니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
