summary_user: 부산 동래구 관내에서 추진 중인 재개발·재건축 정비구역을 구역 한 건씩 담은 파일로, 기준연도·사업 구분·구역명·위치·구역면적(제곱미터)·진행단계를 담는다. 주민·토지등소유자나 부동산 분석가가 '동래구의 어느 정비구역이 지금 어느 단계(추진위·조합·사업시행·관리처분 등)까지 왔는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 구역명·위치 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 재개발·재건축 사업은 노후·불량 건축물이 밀집한 지역의 주거환경을 개선하고 도시 기능을 회복하기 위해 시행하는 정비사업입니다.재개발사업은 노후·불량 건축물이 밀집한 지역의 주거환경을 종합적으로 개선하기 위해 기존 건축물을 철거하고 새로 주택을 건설하는 사업입니다.재건축사업은 기존 공동주택(아파트 등)이 노후화된 경우 이를 철거하고 동일 부지에 다시 건설하는 사업입니다.해당 사업을 통해 노후·위험 건축물 정비, 주거환경 개선, 도시 미관 향상, 기반시설 확충,주택 공급 확대 등을 이룰 수 있습니다.관내에서 추진 중인 재개발·재건축 정비사업의 추진 현황을 국민에게 투명하게 공개하고자 합니다.정비사업과 관련한 주요 절차 진행 여부 및 현황을 한눈에 확인할 수 있도록 정리하였으며,주민·토지등소유자·이해관계인의 정보 접근성을 높이고 행정의 투명성을 제고하는 것을 목적으로 합니다.이후 인가·변경·취소 등 행정처분이 이루어진 경우 실제 현황과 차이가 있을 수 있습니다.
