summary_user: 울산시설공단이 운영하는 하늘공원(장사시설)의 사용료를 시설·구분·사용 목적별로 정리한 요금표로, 단위(구)·사용기간(년)과 함께 관내·관외·관외(양산) 요금, 삼동 주민 적용 여부, 연락처, 기준일자를 담은 1KB 남짓의 작은 CSV 파일이다. 울산 시민이나 양산 등 인근 주민이 하늘공원을 이용할 때 자기 거주지에 따라 요금이 얼마인지 미리 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키나 코드표가 없어, 다른 장사시설·공원 요금 자료와는 시설명 같은 이름을 맞추거나 같은 기관 자료끼리만 이어 볼 수 있다.
description_portal: 울산시설공단 하늘공원 사용료 정보는 시민들이 공원을 효율적으로 이용할 수 있도록 상세한 항목별 데이터를 제공합니다. 이 데이터는 다양한 사용 목적에 따라 구분되어 있으며, 제공 항목에는 시설, 구분, 사용 구분, 단위(구), 기간(년), 관내 사용료, 관외 사용료, 관외(양산) 사용료, 삼동 주민 할인 여부, 비고, 연락처, 기준일자 등이 포함됩니다. 이를 통해 이용자는 자신의 거주 지역이나 사용 목적에 맞는 요금 정보를 쉽게 확인할 수 있으며, 하늘공원 이용 시 필요한 절차나 요금을 사전에 파악할 수 있습니다. 특히, 관내외 구분이나 양산 등 인근 지역 거주자에 대한 요금 차이, 삼동 주민에게 제공되는 혜택 등도 명확히 안내되어 있어 투명하고 공정한 시설 운영에 기여하고 있습니다.
