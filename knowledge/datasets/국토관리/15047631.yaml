description_portal: 본 데이터는 관내에 등록된 종합건설업체의 현황 정보이다. 업체별 명칭, 대표자, 소재지, 업종 등의 세부 내용을 포함한다. 종합건설업은 토목공사, 건축공사, 산업·환경설비공사 등 건설 공사를 종합적으로 수행하는 건설업이다. 해당 자료는 건설 산업 육성 정책 수립, 건설 시장 관리, 공사 발주 관리에 활용된다. 업체별 면허 등급 및 시공 능력 평가 자료를 통해 적정 업체 선정 및 입찰 자격 심사를 지원한다. 또한 건설 공사 품질 관리 및 업체 관리 감독 업무에 활용되어 건설 공사의 안전성과 품질을 확보한다. 발주기관 및 시민들이 신뢰할 수 있는 건설업체를 선택하는 데 필요한 정보를 제공한다. 본 정보는 정기적으로 업데이트된다.
