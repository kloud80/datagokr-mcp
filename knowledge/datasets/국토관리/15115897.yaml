summary_user: 경기도 양주시 도시계획정보시스템(UPIS)에 올라온 도시계획 결정·변경 고시를 건별로 담은 파일로, 고시일자·제목·내용·진행상태를 양주시 전역 범위로 제공한다. 시민이나 투자·개발 검토자가 "우리 동네 땅에 어떤 도시관리계획 결정이 언제 고시됐나"를 확인해 개발 가능성의 선행 신호를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 고시 제목·내용 속 지명이나 같은 기관(양주시) 기준으로만 이어 붙인다.
description_portal: 경기도 양주시 도시계획정보시스템(UPIS) 고시현황 데이터는 고시일자, 고시 제목, 고시 내용, 고시 진행상태 등의 항목으로 구성되어 있으며, 양주시 전역에서 이루어지는 각종 도시계획 결정과 변경 사항을 체계적으로 제공합니다. 본 데이터는 개별 개발사업의 추진 여부, 토지 이용의 변화 흐름, 기반시설 조성 및 정비 현황을 파악하는 데 활용되며, 도시계획 행정의 투명성과 예측 가능성을 높이는 핵심 자료입니다.또한 최근의 사회적 이슈인 부동산 시장 변동성 확대, 난개발 방지 정책 강화, 생활권 기반시설 부족 문제, 기후위기 대응을 위한 재해·안전 중심의 도시계획 필요성, 스마트도시 전환 가속화, 주거안전 및 공공성 강화 요구 증가 등과 밀접하게 연관되어 있어, 시민들의 생활환경 이해는 물론, 기업·학계·연구기관의 정책 연구·투자 검토·공간분석 등 다양한 분야에서 중요한 의사결정 자료로 활용됩니다. 본 데이터는 향후 도시의 지속가능한 발전과 균형 잡힌 토지 이용 계획 수립에도 기여할 수 있는 기반 정보입니다.
