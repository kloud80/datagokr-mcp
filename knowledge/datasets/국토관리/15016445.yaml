summary_user: 경상남도 고성군 관내 골재채취업체를 업체 한 곳당 한 행으로 담은 목록으로, 업종·업체명·주소·전화번호와 기준일자를 담는다(CSV 파일 559바이트 규모의 소규모 원천 목록). 고성군에서 골재채취업을 하는 업체가 어디에 있고 연락처가 무엇인지 확인하려는 주민·건설사업자, 또는 관내 골재채취 사업장 분포를 살피는 행정·환경 분석가가 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·법정동코드 등)가 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 같은 기관(고성군) 단위로만 이어 쓴다.
