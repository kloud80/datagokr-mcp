summary_user: 정선군 내 원룸·다가구주택을 건축물 한 건씩 담은 원천 목록으로, 허가년도·법정동 단위 대지위치·주용도·지상층수·가구수·대지·건축·연면적·건축허가일자·사용승인일자를 담고 범위는 시군구, 위치는 읍면동 수준이다. 정선군에서 읍면동별로 원룸·다가구주택이 얼마나, 언제 허가·사용승인되어 몇 가구가 공급됐는지 파악하려는 주택 공급 분석가나 임대사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 법정동 이름 매핑이나 같은 기관(정선군) 기준으로만 이어 쓴다.
description_portal: 공공데이터 목록 요청으로 인해 정선군 내 원룸 및 다가구주택 현황에 대한 데이터를 제공합니다.[데이터 제공 목록]1. 허가년도2. 대지위치3. 대지면적 4. 건축면적 5. 건축물 용도6. 가구수7. 건물 층수8. 건축허가일자9. 사용승인일자크게 위와 같이 9가지 항목에 대한 정선군 내 원룸 및 다가구주택 항목의  내용을 포함하고 있습니다.*공공기관의 정보공개에 관한 법률 제9조에 의거 상세주소 미입력자세한 사항은 정선군청 홈페이지 및 정선군 도시과로 문의주시기 바랍니다.(https://www.jeongseon.go.kr/portal/admininfo/statistics/annualreport)
