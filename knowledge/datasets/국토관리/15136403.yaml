summary_user: 경기도 광명시의 유동인구를 시군구 단위로 시간대(0~23시), 내외국인 구분, 성별·5세 단위 연령대(0~9세부터 65~69세까지)별로 나눠 담은 집계 통계로, 기지국 단위로 수집한 인구를 주변 50m×50m 셀에 나눠 배분한 값이어서 소수점이 있다. 상권 분석가나 창업 준비자가 광명시에서 어느 시간대에 어떤 성별·연령층 유동인구가 많은지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시군구 코드·이름(signgu_cd) 매핑이나 같은 기관 코드로만 잇는다.
description_portal: '이 데이터는 경기도 광명시의 유동인구를 시간대별, 성별, 연령대별로 세분화한 통계자료로, 외국인과 내국인의 구분을 통해 다양한 인구 특성을 파악할 수 있도록 구성되어 있습니다.1. 시간코드는 00~23까지의 1단위로 있고 각 시간대를 의미합니다.예) 0 : 00:00~00:59 1 : 01:00~01:592. 남자0009수와 같은 컬럼은 연령대별 유동인구수를 나타냅니다.* 소수점이 발생하는 이유는 기지국단위로 수집된 인구를 주변셀(50*50)으로 나누어 배분하면서 소수점이 발생될 수 있습니다.'
