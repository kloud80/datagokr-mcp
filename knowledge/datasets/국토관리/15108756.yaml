summary_user: 양평군에 등록된 개인하수처리시설 설계시공업·관리업 업체를 한 행에 한 업체씩 담은 건별 명부로, 업체명·대표자·도로명/지번 주소·위도·경도·사무실 전화번호·업종을 담는다. 개인하수처리시설(정화조 등)을 새로 놓거나 관리를 맡길 주민·건축주가 '양평에서 설계시공이나 관리를 맡길 수 있는 업체가 어디 있고 연락처는 무엇인가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 위도·경도 좌표로 지도·공간 데이터에 겹쳐 쓰는 방식으로만 잇는다.
description_portal: 2025년 양평군에 등록되어 있는 개인하수처리시설을 업체명과 대표자, 소재지(도로명주소 및 지번), 위도 및 경도, 전화번호, 업종으로 세분화하여 데이터를 제공합니다.또한 2024년과 비교하여 폐업한 업체같은 경우 해당 데이터에서 삭제 시켜 현행화를 완료하도록 하였습니다.업종은 크게 두종류로 나뉘며 설계시공/관리업으로 나뉠 수 있습니다.설계시공의 같은경우 개인하수처리시설을 설계하고 시공하는 업체이며, 관리업은 개인하수처리시설의 전반적인 관리를 진행하는 업체라고 말 할 수 있습니다.아울러, 양평군의 개인하수처리시설 업체의 경우 대부분이 양평읍에 위치하고 있는 것을 알 수 있습니다.
