summary_user: 경남개발공사가 시행한 공공사업(도로, 하천, 택지개발, 산업단지 등) 지구 안의 경작지를 경작 단위별로 조사해 영농면적, 경작물명, 실소득 여부, 보상 제외 여부, 보상예정금액을 담은 원천 조사 파일이다(CSV 약 97KB). 보상 담당자나 분석가가 '사업지구별로 어떤 작물이 얼마나 경작됐고, 작물·면적에 따라 영농손실 보상금이 어떻게 달라지는가'를 비교하는 데 쓴다. 전역 조인 키가 없고 사업은 기관 내부의 사업 구분 코드로만 구분되므로, 다른 데이터와는 사업명이나 작물명을 맞춰 연결해야 한다.
description_portal: '이 데이터는 경남개발공사에서 수행하는 공공사업(도로, 하천, 택지개발, 산업단지 등)의 시행과정에서 농지에 대한 영농 보상을 목적으로 산출한 자료로, 사업지구별 개별 경작지에 대한 영농현황을 기반으로 합니다. 각 필지 또는 경작 단위별로 영농면적(m²), 경작 작물의 명칭, 실소득 여부, 보상 제외 여부, 단위당 보상금 및 총 보상예정금액 등이 정리되어 있으며, 보상금 산정의 기초자료로 활용됩니다.주요 항목에는 사업구분코드(사업명), 영농면적, 경작작물명, 실소득 여부(예: 시설딸기, 깻잎 등), 보상금액, 보상제외 여부 등이 포함되어 있으며, 작물 종류는 벼, 콩, 고추, 채소류, 수목류, 과수류 등 다양합니다. 특히 수익작물뿐 아니라 수목류, 묘목, 묵전(경작 불가지) 등도 포함되어 보상기준의 현실성과 정책 타당성 확보를 위한 자료로도 중요합니다.이 데이터는 공공개발에 따른 농업피해 분석, 영농 보상정책 개선, 공공사업 이해관계자 보상기준의 객관성 확보 등을 위해 활용 가능하며, 작물별·면적별·사업별 보상금 비교 및 통계분석, 농업 분야 공간정보 구축, 주민 의견수렴 시 기초자료로도 활용될 수 있습니다.'
