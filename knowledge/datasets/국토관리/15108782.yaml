summary_user: 천안시 동남구 사직로7 일원 천안중앙시장의 점포를 한 건씩 담은 데이터로, 상호·업종·운영시간·도로명/지번 주소·전화번호·위경도 좌표를 제공한다. 시장을 찾는 시민이나 상권 분석가가 '중앙시장 안에 어떤 업종 점포가 어디에 있고 몇 시까지 여는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 위경도 좌표, 상호 이름 매칭으로 이어 붙인다.
limits: 표준 코드형 조인 키가 없어 다른 공공데이터와의 연계는 주소·좌표·이름 매칭에 의존한다. 범위는 천안중앙시장 한 곳의 점포에 한정되며 시 전체 상권을 대표하지 않는다.
