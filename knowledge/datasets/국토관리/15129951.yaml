summary_user: 평택시 도시계획정보시스템(UPIS)에서 뽑은 경관지구 도형별 현황으로, 도형 관리번호·결정고시관리코드·면적·길이·도면번호·라벨명을 시군구 단위로 담은 669바이트 규모의 작은 CSV 파일이다. 평택시에서 토지나 건축을 검토하는 사업자·주민이 대상지 주변에 어떤 경관지구가 얼마나 넓게 지정돼 있는지 확인할 때 쓴다. 전역 조인 키는 실측되지 않았으며, 시군구코드나 결정고시관리코드를 같은 기관의 다른 UPIS 용도지역·지구 현황 및 결정고시 자료와 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 경관지구현황으로 현황 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 면적_도형, 길이_도형, 시군구코드, 라벨명 등의 항목을 제공합니다.경관지구는 도시의 미관을 유지하고 관리하기 위해 지정하는 용도지구의 일종입니다. 자연경관지구, 시가지경관지구, 특화경관지구 (역사문화, 조망가로, 수변특화) 등으로 구분되며, 각 지구별로 건축물의 건폐율, 높이, 용도 등에 제한이 있을 수 있습니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
