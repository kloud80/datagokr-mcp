summary_user: 광주 광산구에서 도시·군계획시설로 결정됐지만 오래 집행되지 않은 교통시설을 시설 한 건씩 담은 시군구 단위 CSV 파일이다(약 64KB). 시설종류·시설명·결정일자·고시번호·결정위치와 결정·집행·미집행 면적(국공유지·사유지 구분), 보상비·사업비·공사비를 담는다. 구 도시계획 담당자나 분석가가 '광산구에서 사유지 보상이 남은 미집행 도로·교통시설이 어디이고 보상비 규모는 얼마인가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·결정위치 같은 이름 매칭이나 같은 기관 자료(다른 시설 분야의 장기미집행 현황 등)와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 광주광역시 광산구의 장기미집행 국토계획 중 교통시설에 대한 현황은 입니다. 이 데이터는 시설종류, 시설명, 결정일자, 결정위치, 결정면적, 보상비 등의 정보를 포함하고 있습니다.광산구 내 교통시설에 대한 상세한 정보를 제공하여, 도시계획 및 교통 인프라 분석에 유용하게 활용될 수 있습니다. 특히, 장기미집행 상태인 교통시설의 현황을 파악하고, 향후 보상 및 집행 계획 수립에 참고할 수 있습니다. 또한, 교통시설의 결정일자, 위치, 면적, 보상비 등의 정보는 지역 개발 및 교통 정책 수립에 중요한 기초 자료로 활용될 수 있습니다.이 데이터는 CSV 형식으로 제공되며, 연간 업데이트됩니다.
