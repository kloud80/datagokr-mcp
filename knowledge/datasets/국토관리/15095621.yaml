description_portal: 도시경관 기록화 사업은 지난 과거의 모습을 확인하고, 현재를 객관적으로 기록하면서, 미래 도시경관의 변화과정을 확보하는 도시 정체성 유지를 위한 작업입니다. 도시경관을 체계적·지속적으로 기록하여 지역의 역사 및 도시구조 등의 연구를 위한 체계적이고 지속적인 기초자료 구축을 위한 데이터입니다.책자(도서)로 제작되어 특정소수에게만 제공되는 1,2차 화보집(울산의 도시형태와 경관)를 통합검색엔진을 통한 검색이 가능하도록 색인데이터화한 데이터입니다.자세한 사항은 울산광역시 도시경관아카이브에서 확인하시기 바랍니다.https://www.ulsan.go.kr/archive
