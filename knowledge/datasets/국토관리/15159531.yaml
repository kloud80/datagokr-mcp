summary_user: 경남개발공사가 수행 중이거나 수행한 공공주택·산업단지·도시개발·하천재해예방·도로·도시재생 등 사업을 한 행에 하나씩 담은 사업 목록 파일로, 사업별 개발·보상·토지분양·주택분양·임대 여부와 사업유형·공급유형·사업기간을 담는다(CSV 약 23KB, 활용신청 없이 내려받음). 경남 지역 공공개발 사업이 유형별로 몇 건이고 언제 시작·종료(예정)되는지, 분양·임대가 걸린 사업이 무엇인지 파악하려는 분석가나 주민이 쓴다. 전역 조인 키는 없어 사업명이나 같은 기관이 쓰는 사업지구코드·사업구분코드로 경남개발공사의 분양·임대·보상 관련 다른 데이터와 맞춰 이어 쓴다.
description_portal: 경남개발공사에서 수행 중이거나 수행한 개발사업, 보상사업, 토지·주택 분양사업, 임대사업 등의 사업 현황 정보를 제공하는 데이터입니다. 데이터 항목은 사업구분코드, 사업명, 개발사업 여부, 보상사업 여부, 토지분양사업 여부, 주택분양사업 여부, 임대사업 여부, 사업약어명, 사업지구코드, 공급유형코드, 사업유형코드, 자금계정구분코드, 사업 시작일자, 사업 종료일자(예정), 공급대상분류코드 등으로 구성되어 있습니다.본 데이터는 경상남도 내 공공주택 건립사업, 산업단지 조성사업, 도시개발사업, 하천재해예방사업, 도로건설공사, 도시재생사업 등 경남개발공사에서 추진하는 다양한 사업의 유형 및 추진 현황을 체계적으로 관리하기 위해 작성된 자료입니다. 사업별 개발·보상·분양·임대 여부와 사업유형, 공급유형, 사업기간 등의 정보를 확인할 수 있으며, 동일 유형의 사업이 다수 포함될 수 있습니다.해당 데이터는 공공개발사업 현황 분석, 지역개발 정책 참고자료, 사업유형별 통계 분석, 공공주택 및 산업단지 공급 현황 파악 등 다양한 행정 및 정책 활용 목적으로 활용할 수 있습니다.
