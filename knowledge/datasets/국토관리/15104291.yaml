description_portal: '요약 : 농산어촌 지역개발사업중 전국 또는 시도, 시군구 법정동코드를 기준으로 지역별 농촌마을 기본정보와 마을아이디를 기준으로 각 농촌마을의 자원정보를 제공하는 서비스 1. 전국 농촌마을 유례, 인구, 주택수 등의 기본정보 조회 - 연령별 인구수, 성별 인구수 - 빈집, 슬레이트 주택 수 - 마을 유례 및 마을 명 2. 마을아이디를 기준으로 전국 농촌마을 자원정보 조회 2.1. 마을의 자연자원 - 기후 토양 자원, 광물자원, 수자원, 동물식물자원, 자영경관 자원 2.2. 마을의 경제자원 - 농림축수산물, 음식 및 식품, 특산물자원, 농업관련시설, 관광 및 휴양시설, 산업시설'
