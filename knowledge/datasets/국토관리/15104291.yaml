summary_user: 전국 농촌마을별로 마을명·유래, 성별·연령대별 인구수, 전체·빈집·슬레이트 주택 수와 건축연도별 주택 수를 담은 건별 기본정보로, 검증 시 전국 범위 읍면동 단위 215행을 받았다. 귀농·귀촌 희망자나 지역개발 분석가가 '이 읍면동 마을의 고령 인구 비중과 빈집·슬레이트 주택 규모가 어느 정도인가'를 확인하는 데 쓴다. 시도명(sidoNm)이 행정구역 조인 키로 실측됐고 법정동코드(legalCode)·시군구·읍면동명도 함께 있어 다른 지역 통계와 붙이며, 마을아이디(villId)는 자원정보 조회의 입력값으로 쓴다.
limits: 마을 자원정보 오퍼레이션(/resourceVill)은 필수 파라미터인 마을아이디를 기본정보 조회에서 먼저 받아 넘겨야 하며, 검증 때 최소 파라미터로는 응답이 없어 두 오퍼레이션 중 하나만 호출에 성공했다. 개발계정은 하루 10,000회로 제한된다.
