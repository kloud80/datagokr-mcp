summary_user: 경기도 이천시에서 기계설비 성능점검 대상이 되는 건축물을 건물 한 동씩 담은 파일로, 건축물용도·건물명(소유자명)·도로명주소·우편번호·연면적(제곱미터)·데이터기준일자를 담는다. 시청 담당자나 건물 관리자가 '우리 건물이 이천시 성능점검 대상에 들어 있는가', '용도별로 대상 건물 규모가 어느 정도인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 도로명주소나 건물명을 맞춰 보는 방식으로만 연결한다.
description_portal: 해당 데이터는 경기도 이천시 내 기계설비가 설치된 건축물의 성능점검 대상 현황을 정리한 자료입니다. 각 건축물에 대해 연번, 건축물용도, 명칭, 도로명주소, 우편번호, 연면적 등의 항목이 포함되며, 점검기준일자를 기준으로 관리됩니다. 주거용, 상업용 등 다양한 용도의 건축물에 대한 연면적 정보를 통해 기계설비 관리 대상의 규모를 파악할 수 있고, 주소 및 우편번호 정보는 행정구역 단위 점검계획 수립 및 현장 점검 업무의 기초자료로 활용됩니다. 해당 정보는 기계설비법에 따른 법정 점검체계 수립, 건물별 성능관리 이력 분석, 안전점검 우선순위 도출 등에 활용될 수 있습니다.
