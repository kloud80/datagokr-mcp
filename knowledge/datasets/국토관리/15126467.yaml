summary_user: 신고된 연립·다세대 주택 매매 실거래를 건별로 담은 API로, 시군구 지역코드(앞 5자리)와 계약년월을 지정해 거래금액(만원)·전용면적·층·건축년도·법정동·거래유형 등을 조회한다. 내 동네 연립·다세대가 최근 얼마에 거래됐는지 확인하려는 국민이나 지역별 가격 흐름을 보려는 분석가가 쓴다. 지역코드(sggCd, 조인 키 sgg_cd)로 같은 시군구 단위의 다른 실거래 유형이나 법정동 코드 기반 자료와 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월 6자리(예시 : 201801)로 해당 지역, 해당 기간의 연립다세대 매매 실거래가 상세자료를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 연립다세대 매매 자료를 제공하는 연립다세대 매매 실거래가 상세 자료 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 연립다세대 매매의 층정보만 제공됩니다.'
