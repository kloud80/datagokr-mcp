description_portal: 본 데이터는 연천군 축산시설의 축산폐수 발생 및 처리 현황을 체계적으로 파악하기 위해 구축된 행정 기초자료이다. 각 행은 개별 축산사업장을 단위로 하며, 상호명, 대상구분, 일일 축산폐수 배출량(톤), 처리내역으로 구성되어 있다. 대상구분은 허가대상과 신고대상으로 구분되어 시설 규모 및 관리 기준의 차이를 반영한다. 일일 축산폐수 배출량은 사업장별 평균 발생량을 톤 단위로 산정한 값으로, 지역 내 오염부하 분석과 관리 우선순위 설정에 활용될 수 있다. 처리내역은 위탁처리와 자체처리(정화방류)로 구분되며, 이는 축산폐수의 처리 방식과 환경관리 수준을 파악하는 핵심 지표이다. 본 자료는 축산환경 정책 수립, 폐수 처리 인프라 계획, 지도·점검 대상 선정, 환경 영향 분석 등 다양한 행정·연구 목적으로 활용 가능한 공공데이터이다.
