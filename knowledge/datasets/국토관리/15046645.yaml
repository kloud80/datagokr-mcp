description_portal: '○ 통계개요* 통계명 : 광업 및 제조업 현황* 통계종류 : 서울시 광업 및 제조업 현황을 제공하는 지정ㆍ조사통계* 근거법령 :「광업제조업조사 규칙」(기획재정부령 제57호)* 작성목적 : 광업 및 제조업부문의 사업체 및 종사자 현황과 생산ㆍ출하ㆍ재고액의 추이를파악하여, 산업활동과 관련된 각종 정책의 수립 및 평가, 기업의 경영 계획 수립및 학계, 연구소 등의 학술연구를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 사업체 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 광업 및 제조업의 각 자치구 동별 사업체수, 종사자수, 연간급여액,생산ㆍ출하ㆍ재고액, 주요생산비, 부가가치, 유형자산연말잔액 등'
