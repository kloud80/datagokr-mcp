description_portal: '이 데이터는 서울 도심 재개발 구역 중 하나인 세운지구의 계획 기반 시설에 대한 토지 이용계획을 정리한 자료로, 도시기반시설의 확보 및 배치 현황을 면적 단위로 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 연번, 지역(세운지구 내 구획명 또는 블록명), 구분(시설유형: 도로, 공원, 주차장 등), 면적(㎡), 비고, 비율(전체 면적 대비 구성 비율) 등이 포함됩니다. 이 데이터를 통해 각 기반시설이 차지하는 면적과 도시기반시설 간의 비중을 파악할 수 있으며, 세운지구 내 공공기반시설 확보 수준과 공간계획의 균형성 등을 분석하는 데 활용할 수 있습니다. 계획 내용은 사업 추진 여건, 도시계획 변경 등에 따라 수시로 조정될 수 있으므로, 참고 시점의 자료로 해석하는 것이 바람직합니다. 도시재생, 기반시설 투자 전략, 공공성 확보 평가 등에 기초자료로 활용될 수 있습니다.'
