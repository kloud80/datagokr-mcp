description_portal: 이 데이터는 전라남도 강진군의 빈집 현황을 정리한 자료입니다. 주요 항목은 행정구역(시도, 시군, 읍면동, 리)과 도로명주소, 조사년도, 빈집유형, 주택유형, 철거 또는 활용 동의 여부, 슬레이트 지붕 여부 등입니다. 빈집유형은 철거형과 활용형으로 구분되며, 주택유형은 대부분 단독주택이 차지합니다. 또한 주민의 동의 여부와 지붕 자재 특성을 통해 향후 정비나 활용 가능성을 가늠할 수 있습니다. 이 자료는 강진군의 빈집 관리와 정책 수립을 위한 기초 데이터로 활용될 수 있으며, 지역 개발과 안전 관리 측면에서도 중요한 의미를 갖습니다.
