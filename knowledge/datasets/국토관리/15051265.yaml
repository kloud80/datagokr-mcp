summary_user: 광주광역시 주요 산업단지(본촌·송암·하남·소촌·평동·첨단·진곡 등)별 업체수, 고용인원, 생산액(억원), 수출액(백만달러)을 단지 단위로 정리한 집계 파일(CSV, 415바이트)이다. 지역 산업 분석가나 정책 담당자가 '광주의 어느 산업단지가 생산·수출·고용 규모가 가장 큰가'를 비교할 때 쓴다. 전역 조인 키가 없어 산업단지명(산업단지명)으로 산업단지 원장이나 산단공 산업동향 통계와 이름 매칭해 이어 쓴다.
description_portal: 본 데이터는 광주광역시 주요 산업단지별 업체수, 고용인원, 생산액, 수출액 현황을 정리한 자료로, 산업단지의 경제 규모와 생산 구조를 한눈에 확인하실 수 있습니다. 본촌산단, 송암산단, 하남산단, 소촌산단, 소촌농공단지, 평동 일반산단, 평동 월전외투, 첨단산단 1단계와 2단계, 진곡산단을 포함하여 각 단지의 기업 수와 고용 규모를 제공하며, 생산액과 수출액을 통해 산업단지별 경제활동 수준을 비교하실 수 있습니다. 산업단지별 산업현황을 파악하고 정책 수립 및 지역 산업 분석에 활용하실 수 있는 자료입니다.
