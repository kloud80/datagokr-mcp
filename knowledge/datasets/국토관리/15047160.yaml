description_portal: '○ 통계개요* 통계명 : 토지현황(지목별/법정동별)* 통계종류 : 서울시 자치구별 토지현황을 지목별, 법정동별로 제공하는 일반ㆍ보고통계* 근거법령 :「지적법」에서 정한 토지의 지목별 현황* 작성목적 : 서울시 토지에 관한 정보와 연간 토지허가 및 거래 현황을 파악하여, 공정한부동산관련 정책 수립과 연구ㆍ분석을 위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 지목별(전, 답, 과수원, 목장용지, 임야 등) 면적 현황 등○ 용어설명* 지목 : 토지의 주된 용도에 따라 토지의 종류를 구분한 것으로, 대표적인 지목으로는대(垈), 전(田), 답(畓), 임야, 도로 등이 있음'
