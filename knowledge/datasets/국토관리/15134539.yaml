summary_user: 서울시 비오톱(생물군집 서식지) 유형별 공간 경계와 함께 유형 분류, 주요·일반 서식지, 면적·희귀성, 유형 평가값과 평가등급(EVL_GRD) 등을 폴리곤 단위로 담는 공간정보 파일이다. 도시계획·환경 분석가나 개발 사업자가 특정 부지가 비오톱 평가에서 몇 등급인지, 보전 가치가 높은 서식지가 어디에 분포하는지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않아, 다른 공간 레이어와는 좌표(EPSG:5174) 기반 공간 중첩이나 이름·코드 매핑으로 연결해야 한다.
description_portal: 비오톱(biotope)이란 그리스어로 생명을 의미하는 비오스(bios)와 땅 또는 영역이라는 의미의 토포스(topos)가 결합된 용어로 특정한 식물과 동물이 하나의 생활공동체, 즉 군집을 이루어 지표상에서 다른 곳과 명확히 구분되는 하나의 서식지를 말하며, 협의적으로는 도시개발과정에서 최소한의 자연 생태계를 유지할 수 있는 생물군집 서식지의 공간적 경계를 말한다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.
