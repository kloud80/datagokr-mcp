summary_user: 서울특별시 서초구 푸른도시과가 관리하는 공원·녹지의 야외운동기구를 공원명·주소·운동기구명·수량·관리번호 단위로 담은 서초구 범위의 현황 파일(CSV, 약 91KB)이다. 주민이나 분석가가 '우리 동네 어느 공원에 어떤 운동기구가 몇 개 있는가'를 확인하거나 공원별 운동기구 분포와 배치 효율을 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 공원명·주소를 이름 매칭하거나 같은 서초구 데이터끼리 묶어 쓴다.
description_portal: 서울특별시 서초구 푸른도시과에서 관리하는 야외운동기구 현황(위치, 운동기구명, 수량, 관리자번호 등)을 종합적으로 제공하는 데이터입니다. 공원명과 주소를 비롯해 운동기구명으로 공중걷기, 파도타기, 허리돌리기, 상체근육풀기, 달리기, 역기올리기 등 다양한 운동기구 종류별 설치 현황과 세부 정보를 포함하고 있습니다. 이를 통해 지역 주민의 건강 증진과 생활체육 활성화에 필요한 기초 자료로 활용할 수 있으며, 공공체육시설 관리, 시설 배치 효율화, 운동기구 분포 분석 등에도 폭넓게 쓰일 수 있습니다. 또한 공원 이용 활성화, 체육 정책 수립, 시설 유지보수 계획 마련, 지역 사회의 건강 인프라 개선 방안 연구 등 실질적인 행정 및 연구 목적으로 가치가 높은 공공 데이터입니다.
