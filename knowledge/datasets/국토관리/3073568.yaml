summary_user: 충청남도 홍성군 내 아파트 단지를 단지 한 건씩 담은 목록으로, 단지명·도로명 주소·사업승인일·준공일·동수·세대수·연면적·관리사무소 연락처를 담는다(CSV 약 4.7KB의 소규모 파일). 홍성군에서 아파트를 알아보는 주민이나 지역 주택시장을 보는 분석가가 '홍성군에 준공 몇 년 된 몇 세대 규모 단지가 어디에 있나'를 확인하는 데 쓴다. 공통 조인 키(K-apt 단지코드 등)가 없으므로 실거래·공시가격·K-apt 관리정보와는 아파트명이나 도로명 주소를 맞춰 이어 써야 한다.
limits: 단지코드 같은 전역 키가 없어 다른 주택 데이터와의 연결은 이름·주소 매칭에 의존하므로 표기 차이로 누락·오매칭이 생길 수 있다. 범위는 홍성군 한 곳의 단지 현황뿐이며 관리비·거래가격 같은 정보는 들어 있지 않다.
