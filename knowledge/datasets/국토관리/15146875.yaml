summary_user: 지방자치단체가 구축해 국토교통부가 취합한 건축한계선 현황 자료로, 국토계획법에 따른 용도지역·지구·구역·도시계획시설·지구단위계획 현황 가운데 건축한계선 부분을 전국 범위로 담으며 브이월드에서 시도별 XLSX 파일로 내려받는다. 건축 설계자나 토지 소유자, 도시계획 분석가가 '이 지역의 지구단위계획에 건축한계선이 지정돼 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 내려받은 파일은 비공간 형태로 확인돼 이 파일만으로 필지 경계 위에 한계선을 그리는 공간 분석은 어렵고, 공통 조인 키가 없어 건축물대장 등과 바로 연결되지 않는다. 브이월드 로그인 후 시도별로 받아야 하며 포털 활용신청과는 별개 절차다.
