description_portal: 경기도 수원시 지역화폐 결제 정보로 지역별(시군구, 읍면동), 업종별, 성별, 연령대별 지역화폐 결제 정보(건수, 금액)를 포함합니다. 지역화폐 결제 정보를 통해서 시민이 지역화폐 정책이 실제로 효과있게 사용하는지 여부를 파악하고, 어느 업종에서 실제로 매출 증대 효과가 있는지 데이터 기반으로 파악하는데 활용할 수 있습니다. 또한 지역화폐 발행, 사용규모, 업종별 사용현황 등을 확인해 지역경제 활성화 효과를 검증할 수 있습니다. 결제 데이터로 동네 상권의 소비 패턴을 볼 수 있어, 소상공인 스타트업에 활용도 가능합니다.
