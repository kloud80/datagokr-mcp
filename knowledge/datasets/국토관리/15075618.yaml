summary_user: 경기도 수원시 지역화폐 결제 내역을 기준년월별로 시군구·읍면동, 업종, 성별, 연령대에 따라 묶은 결제건수와 결제금액 집계 파일로, 행정단위는 읍면동까지 내려간다. 수원시 정책 담당자나 상권 분석가가 '어느 동네, 어느 업종에서 지역화폐가 많이 쓰이고 어떤 연령·성별이 주로 쓰는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 시군구명·읍면동명·업종명 같은 이름을 매핑해서만 이어 쓸 수 있다.
limits: 행정구역 코드가 없어 다른 통계와 붙이려면 읍면동명·업종명을 직접 맞춰야 하며, 명칭 변경이나 표기 차이에 주의해야 한다. 건별 결제가 아닌 집계값이므로 개별 가맹점이나 개인 단위 분석에는 쓸 수 없다.
