description_portal: '○ 통계개요* 통계명 : 사무실 임대료* 통계종류 : 서울시 오피스빌딩의 사무실 임대료 현황을 제공하는 일반ㆍ보고통계* 작성목적 : "오피스ㆍ매장용빌딩 임대료조사 및 투자수익률 추계결과 보고서"에 근거한오피스빌딩의 임대료 현황을 파악하여 부동산 및 건설정책 마련의기초자료를 제공하는 것을 목적으로 함* 조사체계 : 한국부동산연구원* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 평균, 도심, 여의도/마포, 강남, 기타지역의 사무실 임대료 현황○ 기 타# 통계작성양식 변경으로 "오피스빌딩 임대로 및 수익률" 및 "매장용빌딩 임대료 및수익률"로 대체* 3층이상 오피스빌딩 지역별 월세전환 임대료 기준임* 도심: 종로구, 중구 / 여의도ㆍ마포: 영등포구, 마포구 / 강남: 강남구, 서초구'
