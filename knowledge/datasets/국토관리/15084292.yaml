summary_user: 광산구가 내준 도로굴착 허가를 건별로 담은 파일로, 굴착 장소(동·지번), 허가일, 허가번호, 시행처, 굴착길이, 복구주체, 착공일 기준 허가기간을 필지·건물 단위로 기록한다. 주민이나 사업자가 '우리 집 앞 도로는 언제, 누가, 얼마나 길게 파헤치고 누가 복구하나'를 확인하거나, 분석가가 구 안의 굴착 공사 빈도와 규모를 동별로 따져 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 동·지번 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 광주광역시 광산구에서는 「도로법」 제61조 및 「도로법 시행령」 제54조에 따라, 도로 굴착 허가 현황 데이터를 체계적으로 관리하고 있습니다. 도로굴착허가현황 데이터는 지번, 허가일, 허가번호, 시행처, 굴착길이, 허가기간 등을 제공합니다.이 데이터는 굴착이 이루어진 장소를 특정하는 지번 정보를 포함하고 있어, 어느 토지 또는 건물 인근에서 굴착이 진행되었는지 명확히 파악할 수 있습니다. 또한 허가일 항목을 통해 언제 허가가 이루어졌는지를 확인할 수 있으며, 허가번호는 해당 건별 고유 식별자로서 허가 관련 문서와 후속 절차를 연결하는 데 활용됩니다. 굴착길이는 실제 굴착된 도로의 총 연장으로, 작업 규모와 영향을 분석하는 데 중요한 물리적 지표가 됩니다.이 데이터는 도로 유지·관리 계획, 공사 영향 구간에 대한 주민 안내, 민원 대응, 공공 인프라의 안전성과 효율성을 확보하기 위한 중요한 기초 자료로 폭넓게 활용될 수 있습니다.
