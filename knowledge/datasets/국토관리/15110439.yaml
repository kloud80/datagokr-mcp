summary_user: 대구광역시 서구 관내 지적기준점(주로 도근점)을 점 하나당 한 건으로 담으며, 기준점 명칭·종류·X/Y 좌표·원점(구암원점 지역좌표계, 동부원점 세계좌표계)·좌표계 구분을 수록한다. 지적측량 실무자나 공간정보 분석가가 '서구 특정 지역 주변에 어떤 기준점이 있고 그 좌표는 무엇인가'를 확인하거나 지역좌표와 세계좌표 간 변환을 점검할 때 쓴다. 실측 컬럼에 PNU 같은 전역 조인 키가 없어, 다른 지적·공간 데이터와는 기준점 명칭 매핑이나 좌표 기반 공간 결합으로만 연결한다.
limits: 범위가 대구 서구 한 시군구에 한정되어 다른 지역 기준점은 없다. 전역 조인 키가 없어 필지(PNU) 단위 데이터와 바로 붙일 수 없으며, 같은 점이라도 원점(좌표계)에 따라 좌표가 다르므로 구분 항목을 확인하고 써야 한다.
