summary_user: 서울 영등포구에서 나간 건축허가를 건별로 담은 파일로, 건축구분·대지위치·연면적·허가일·주용도·부속용도를 한 행에 기록한다. 지역 개발 흐름을 먼저 살피려는 분석가나 사업자가 '영등포구에서 최근 어떤 용도의 건물이 어디에 얼마나 허가됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)를 이름 매칭하거나 같은 기관 자료로만 이어 쓴다.
description_portal: '안녕하십니까.서울특별시 영등포구 건축허가 현황 자료입니다.데이터는 건축구분, 대지위치, 면적, 허가일, 주용도, 부속용도 등이 포함되어 있습니다.영등포구청 홈페이지(https://www.ydp.go.kr/)에 건축 허가 신고 현황, 착공 현황, 사용승인 현황을 월 별로 게시하고 있습니다.(홈페이지-투명행정-정보공개-부서자료실(기타))기타 문의 사항은 영등포구청 건축과(연락처: 02-2670-3060)로 연락하시거나 정보공개포탈(https://www.open.go.kr/)에서 정보공개청구하시기 바랍니다.'
