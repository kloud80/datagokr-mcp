summary_user: 전국 산업단지 안에 지정된 자유무역지역을 단지별 한 행으로 정리한 집계 파일로, 시도·시군·단지명·조성상태와 지정·관리면적, 산업시설구역의 분양·미분양 면적과 분양률, 입주업체 수와 가동업체 수를 담는다(CSV 732바이트의 소규모 파일). 투자 입지를 검토하는 사업자나 정책 분석가가 "어느 자유무역지역에 기업이 얼마나 입주해 가동 중이고 분양 여력은 얼마나 남았나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 산업단지코드가 없어, 다른 산단 현황·통계와는 단지명과 시도·시군 이름을 맞춰 연결해야 한다.
description_portal: 본 통계는 **전국에 지정된 산업단지 내 자유무역지역(Free Trade Zone, FTZ)**을 대상으로, 자유무역지역의 공간적 분포와 입주 현황을 체계적으로 파악하기 위해 작성된 자료입니다. 산업단지 내 자유무역지역은 수출 촉진을 목적으로 국가가 지정한 특수 구역으로, 일반 산업단지와는 차별화된 제도적 지원과 관리 체계를 적용받고 있습니다.본 통계에 포함된 항목은 자유무역지역명, 시도, 시군구 등 행정구역 정보와 함께, 입주업체 수 등 자유무역지역의 기본적인 운영 현황을 나타내는 지표로 구성되어 있습니다. 이를 통해 자유무역지역별 입주 기업의 분포와 집적 수준을 파악할 수 있도록 하였습니다.자유무역지역은 관세, 조세, 외환, 고용 등 기업 활동과 관련된 각종 행정·제도적 규제를 완화하거나 특례를 부여함으로써, 기업의 안정적인 경영 활동과 투자 환경 조성을 지원하는 제도적 장치입니다. 본 통계는 이러한 제도의 적용 대상이 되는 자유무역지역의 입주 현황을 중심으로 객관적인 정보를 제공하는 데 목적이 있습니다.본 자료는 산업단지 내 자유무역지역의 입지 및 입주 구조를 이해하기 위한 기초 통계 자료로서, 자유무역지역 정책의 현황 파악, 산업단지 내 특수 구역 운영 실태 점검, 투자 환경 분석 등의 참고자료로 활용될 수 있습니다.한편, 마산자유무역지역국가산업단지는 2024년 3분기부터 국가산업단지로 지정되었으며, 본 통계는 해당 지정 변경 사항을 반영하여 작성되었습니다. 이에 따라 시계열 분석이나 과거 자료와의 비교 시에는 지정 시점에 따른 분류 기준 변화를 고려하여 해석할 필요가 있습니다.
