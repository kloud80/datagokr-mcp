summary_user: 포항시 공공하수처리시설에서 하천·해역으로 내보내는 방류수의 수질을 월(연월) 단위로 기록한 파일로, BOD·COD 또는 TOC·부유물질·총질소·총인(mg/L)과 대장균군수(개/ml)를 담으며 csv 한 개(약 5.9KB) 규모다. 주민이나 환경 분석가가 "포항 하수처리장 방류수의 BOD·총인 농도가 해마다 어떻게 변했나"처럼 처리 수준의 추이를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월이나 시설·기관 이름을 맞춰 붙이는 방식으로만 연결한다.
description_portal: '본 데이터는포항시 내에서 운영 중인 공공하수처리시설로부터 정화되어 인근 하천 및 해역으로 배출되는 방류수의 수질 상태를 기록한 환경 공공데이터입니다.하수처리 프로세스의 투명한 정보 공개를 통해 공공기관의 신뢰성을 확보하고, 지역 사회와 함께 수생태계의 건강성을 감시·보존하는 것을 목적으로 합니다. 주민의 알 권리 충족은 물론, 환경 오염 예방을 위한 선제적 대응 체계를 구축하는 데 기여하고 있습니다.주요 수질 오염 지표 (단위: mg/L):BOD (생물학적 산소요구량): 미생물이 유기물을 분해할 때 소비하는 산소량으로, 수질 오염 정도를 나타내는 대표적 지표입니다.COD (화학적 산소요구량): 화학적 산화제를 통해 유기물을 분해할 때 소비되는 산소량입니다.SS (부유물질량): 물속에 용해되지 않고 뜨고 가라앉는 고형 물질의 양입니다.T-N (총질소) 및 T-P (총인): 하천 부영양화 및 녹조 발생의 주요 원인이 되는 물질의 농도입니다. 단위 : mg/l, 대장균군수 단위  : 개/ml화학적산소요구량 및 총유기탄소량  - 2020. 12. 31. 까지 : 화학적 산소요구량(COD)  - 2021. 01. 01. 부터 : 총유기탄소량(TOC)'
