summary_user: 서울주택도시공사(SH공사)가 추진하는 공공재개발·공공재건축 구역을 한 행에 한 구역씩 담은 작은 파일(약 2.9KB CSV)로, 자치구·구역명·위치·용도지역·구역면적·전체 및 임대 세대수·건폐율·용적률·추진현황을 담는다. 분석가나 실수요자가 '우리 구에서 SH가 공공정비로 추진하는 구역은 어디이고, 임대를 포함해 몇 세대를 어느 밀도로 공급하며 지금 어느 단계인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 정비사업·인허가 데이터와는 자치구 이름이나 구역명·주소를 매핑해 이어 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 추진 중인 공공재개발 및 공공재건축 사업의 현황 정보를 포함하고 있으며, 자치구별 사업 위치 및 구역 특성을 체계적으로 확인할 수 있습니다. 주요 항목에는 자치구, 정비구역명, 위치(주소), 토지의 용도, 구역면적(㎡), 공급 예정 세대수, 건폐율(%), 용적률(%) 등이 포함되어 있습니다. 이를 통해 SH공사가 도시 정비사업을 통해 어떤 지역에서 어느 정도 규모의 주택 공급을 계획하고 있는지 확인할 수 있으며, 주거 밀도, 용도 변화, 도시개발 방향성 등을 파악하는 데에도 유용합니다. 특히 용적률과 건폐율은 개발 가능성과 밀도를 가늠하는 핵심 지표로서, 정책 수립, 투자 분석, 지역별 도시계획 평가 등에 폭넓게 활용될 수 있습니다.
