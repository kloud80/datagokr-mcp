summary_user: 한국농어촌공사가 관리하는 저수지 4곳(보은 백록, 순창 난계, 구례 백련, 경산·청도 남성현)의 2023년 수위(해발 m)와 저수율(%)을 시설명·관측일시별로 시간 단위로 담은 CSV 파일(약 530KB)이다. 농업용수 관리자나 분석가가 "2023년 가뭄·홍수철에 이 저수지의 수위와 저수율이 시간대별로 어떻게 바뀌었나"를 확인하는 데 쓴다. 실측 컬럼에 저수지코드 같은 전역 조인 키가 없어서, 다른 저수지 제원·저수율 데이터와는 시설명(저수지 이름)을 맞추는 방식으로만 이어 쓴다.
