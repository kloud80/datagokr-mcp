description_portal: 오천일반산업단지는 수산물 가공업의 집단화로 쾌적한 도시환경 조성과 협동화 사업을 통한 기업의 경쟁력 강화를 위해 1980년 여수시 오천동과 만흥동 일대에 조성된 일반산업단지 입니다. 화양농공단지 관리권자는 여수시장이며, 관리기관은 입주기업들로 이루어진 여수식품가공사업협동조합입니다. 전 제조업 공장 입주 가능하며 주로 수산물 및 음식료품 제조업이 입주해 있습니다.개방 데이터는 입주기업체명과 주소이며 해당 데이터를 통해 오천일반산업단지 내 입주기업 현황을 확인할 수 있습니다.
