summary_user: 서울시 고시원 5,180건을 업소별 한 행으로 담은 건별 원천 파일로, 정상·휴업 상태, 관할 소방서, 상호, 지번·도로명 주소, 영업장 면적, 설치신고일, 지하·지상 구분을 싣고 설치신고일은 1992-10-13부터 2025-12-22까지다. 주거 취약계층 정책 담당자나 소방 안전 분석가가 어느 지역에 고시원이 몰려 있고 지금 운영 중인지 가리는 질문에 쓴다. 지번 주소와 도로명 주소(address)를 조인 키로 삼아 주소 기반의 다른 건물·시설·지역 데이터와 이어 쓰며, 좌표나 별도 코드표는 필드에 없다.
description_portal: 「서울특별시 고시원 정보」 데이터는 서울시에 소재한 고시원의 운영 현황과 시설 관련 기본 정보를 종합적으로 제공하는 자료입니다. 각 고시원별로 연번을 기준으로 정상 및 휴업 여부, 관할 소방서, 상호명, 지번 주소와 도로명 주소, 영업장 면적, 업종, 설치신고일, 지하 및 지상 구분 정보가 수록되어 있습니다. 본 데이터는 고시원 분포 현황과 운영 실태를 파악하는 데 활용할 수 있으며, 주거 취약계층 정책 수립, 소방 안전 관리, 도시 주거 환경 분석 등 행정 및 연구 분야에서 유용하게 활용될 수 있습니다. 또한 고시원 관련 민원 대응과 현장 관리 기준 마련을 위한 기초 자료로도 활용 가능합니다.
