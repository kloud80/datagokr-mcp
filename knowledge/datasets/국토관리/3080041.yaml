summary_user: 경기도 양주시의 공공놀이터를 한 곳당 한 행으로 담은 원천 목록으로, 읍면동·놀이터명·위치·설치일자·검사일·관리기관과 전화번호를 담는다. 시민이 "우리 동네 가까운 놀이터가 어디이고 언제 안전검사를 받았는가"를 확인하거나, 분석가가 읍면동별 놀이터 분포와 노후도(설치일자)를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 읍면동 이름이나 위치(주소) 문자열을 맞춰 연결해야 한다.
limits: 범위는 양주시 한 곳이고 읍면동 단위까지만 구분되어 다른 시군과 바로 비교하거나 합칠 표준 코드가 없다. 법정동·행정동 코드 같은 공통 키가 없어 이름·주소 매핑으로만 다른 데이터와 이을 수 있다.
