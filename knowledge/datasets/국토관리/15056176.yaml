summary_user: 광주광역시 도시 및 주거환경정비기금 운용 심의위원회의 위원 명단을 위원 한 명당 한 행으로 담은 작은 파일(CSV 약 1KB)로, 위원구분·자격·직업·성별·소속·직위·위촉 기간·임기·선정방식·연임횟수를 담는다. 정비사업 자금을 지원하는 기금의 운용을 누가 심의하는지, 외부 전문가와 공무원 비율이나 위원 임기가 언제 끝나는지 확인하려는 시민·조합 관계자·분석가가 쓴다. 전역 조인 키가 없어 다른 위원회 명단이나 정비사업 현황 데이터와는 위원명·소속 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: '▶ 설치근거: 광주광역시 도시 및 주거환경정비조례 제74조 ▶ 설치목적: 도시정비사업에 필요한 자금 확보‧지원 ▶ 설치일자: 2004. 3. 25. ▶ 재원조성  - 지방세법 제69조에 따라 부과․징수되는 지방소비세 및 같은 법 제112조 규정에 따라 부과․징수되는 재산세 중 대통령령이 정하는 일정비율 이상의 금액(지방소비세의 3%, 재산세의 10%)  - 「개발이익환수에 관한 법률」 및 「재건축초과이익 환수에 관한 법률」에 의한 부담금 중 지방자치단체 귀속분의 50%  - 시․도 조례로 정하는 재원(정비사업 관련 교부금, 융자금회수 및 이자수입, 수탁사업수입 등) ▶ 지원범위: 정비계획의 수립비용, 안전진단 및 정비사업 추진위원회 사용비용 보조, 그 밖에 법과 시 조례로 정하는 사항 등'
