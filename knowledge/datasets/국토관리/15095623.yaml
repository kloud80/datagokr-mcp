summary_user: 군산시 내 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단으로, 단지명·회사명·공장 지번 주소·업종명·전화번호를 담는다(csv 약 177KB). 구직자나 영업·협력사를 찾는 사업자가 '군산 특정 산업단지에 어떤 업종의 회사가 입주해 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 산업단지 현황·공장 등록 자료와는 단지명·회사명 같은 이름 매칭이나 주소 기반으로만 이어 쓴다.
description_portal: 전북특별자치도 군산시에 위치한 산업단지에 대한 현황 정보로, 각 산업단지의 명칭(산업단지명),  해당 단지 내 입주한 개별 회사명, 공장이 위치한 지번 주소. 업종명, 그리고 업체 연락처인 전화번호를 포함하고 있습니다. 이러한 체계적인 정보는 군산시의 산업 구조와 핵심 업종, 기업 분포를 입체적으로 파악하는 데 핵심적인 기초 자료로 활용될 수 있습니다. 더 나아가, 정책 입안자에게는 지역 경제 활성화 및 고용 창출 전략 수립의 근거를 제공하고, 연구자에게는 산업 클러스터 분석 및 기업 생태계 연구의 토대를 마련해 줍니다. 또한, 잠재적 투자자나 협력사를 발굴하려는 기업에게는 귀중한 시장 정보가 될 것이며, 구직자들에게는 지역 내 유망 기업을 탐색하는 데 유용한 가이드가 될 수 있습니다. 이처럼 본 데이터는 군산시의 산업 경쟁력을 이해하고 다양한 경제 주체들의 의사결정을 지원하는 데 사용될 수 있습니다.
