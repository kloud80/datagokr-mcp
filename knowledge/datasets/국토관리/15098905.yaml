summary_user: 청약홈의 청약접수 경쟁률과 특별공급 신청현황을 주택형별로 담은 API로, APT·오피스텔/도시형/민간임대·공공지원 민간임대·잔여세대 등의 분양 단위 경쟁률(CMPET_RATE)과 접수건수(REQ_CNT)를 제공한다. 청약 대기자나 분석가가 특정 단지의 주택형별 경쟁률이나 특별공급 유형별 신청 건수를 확인하는 데 쓴다. 공고번호(PBLANC_NO)와 주택관리번호(HOUSE_MANAGE_NO)로 같은 기관의 청약 분양정보와 이어 쓸 수 있지만, 전역 조인 키는 없어 다른 기관 데이터와는 이름·코드 매핑이 필요하다.
limits: 은행 전산 상황에 따라 접수건수가 추후 변동될 수 있어 청약홈 최종 정보와 다를 수 있다. 검증 시 API 전체 건수는 100, 수신은 600행이었고 범위는 전국이며, 실측 컬럼에서 전역 조인 키는 확인되지 않았다.
