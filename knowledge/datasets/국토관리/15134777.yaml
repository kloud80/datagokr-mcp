description_portal: '이 데이터는 광주광역시 서구청 홈페이지에서 제공하는 자료로, 서구 관내에서 건축허가가 승인된 건축물의 총 연면적 및 건축물 수를 연도별로 집계한 공공데이터입니다. 항목에는 연도, 허가된 건축물의 연면적(㎡), 허가 건축물의 동수 등 단순하면서도 핵심적인 지표들이 포함되어 있으며, 연면적은 건축물의 규모와 밀도, 도시 확장 속도를 판단할 수 있는 주요 통계지표입니다.이 데이터를 통해 연도별 건축활동 규모를 파악할 수 있으며, 지역 개발 동향, 부동산시장 변화, 주거 및 상업시설 증가 추세 등 다양한 정책수립 및 민간 분석에 활용 가능합니다. 특히 단순한 건축허가 건수보다도 연면적은 실제 건축의 물리적 규모를 나타내므로, 인프라 수요 예측, 교통계획, 환경영향평가 등의 행정적 의사결정에 필수적인 기초자료로 활용됩니다.또한 이 데이터는 **서구 대표 홈페이지 내 정보시스템(DB명: 서구홈페이지DB)**에서 관리되며, 매년 1회 이상 갱신되는 최신 자료입니다.'
