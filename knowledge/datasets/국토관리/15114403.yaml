summary_user: 부산광역시 내 지역주택조합을 조합 한 곳당 한 행으로 담은 파일(csv, 약 25KB)로, 소재지·사업예정지·조합원수·대지면적·연면적·총세대수와 조합원모집신고일부터 조합설립인가일·사업계획승인일·착공신고일·사용검사일(예정일)까지 단계별 날짜를 담는다. 조합 가입을 고민하는 시민이 '우리 동네 이 지역주택조합은 설립인가를 받았는지, 사업계획승인까지 진행됐는지'를 확인하거나, 분석가가 부산 지역주택조합의 진행 단계별 분포와 공급 예정 세대수를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 주택 공급·인허가 데이터와는 조합명이나 사업예정지 주소를 문자열로 맞추거나 담당기관(구·군) 단위로만 이어 쓴다.
description_portal: 부산광역시 내 지역주택조합의 현황으로 연번, 소재지, 조합명, 조합사무실 주소, 조합원수, 사업예정지, 대지면적(제곱미터), 연면적(제곱미트), 총세대수, 조합원설립인가일, 사업계획승인일, 사용검사일, 담당기관과 전화번호 등의 정보를 제공하고 있습니다.「주택법」에 따른 지역주택조합은 다수의 구성원이 주택을 마련하기 위하여 결성하는 조합으로, 일반분양제도에 대한 예외적인 제도로 조합원 자격을 엄격하게 제한하고 있습니다.지역주택조합은 발기인의 사업기본계획 수립, 조합원 모집신고, 창립총회, 주택조합 설립인가, 사업계획승인, 착공 및 분양, 사용검사 및 입주, 조합 해산의 절차를 거치며,해당 자료로 현재 부산광역시의 지역주택조합의 진행현황이 파악 가능합니다.
