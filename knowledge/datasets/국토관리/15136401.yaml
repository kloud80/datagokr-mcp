summary_user: 경기도의 기준년월·행정동별로 지역화폐 중분류 업종과 일반 카드 중분류 업종 조합마다 두 소비 패턴의 상관계수(-1~1)를 담은 분석 집계 자료다. 정책 분석가가 "우리 동네에서 지역화폐 소비가 카드 소비와 비슷하게 움직이는 업종은 어디인가"처럼 지역화폐 유도 효과나 업종별 소비행태 차이를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 행정동코드(admdong_cd)나 업종 코드를 이름·코드 매핑으로 맞추거나 같은 기관 자료와 연결해 쓴다.
description_portal: 이 데이터는 경기도의 지역화폐 사용 패턴과 일반 카드 사용 패턴 간의 상관관계를 행정동 및 업종 단위로 분석한 자료입니다. 각 행은 특정 ‘기준년월’과 ‘행정동코드’를 기반으로, ‘지역화폐중분류업종코드’와 ‘카드중분류업종코드’ 조합에 대한 ‘상관계수값’을 제공합니다. 상관계수는 -1부터 1 사이의 값을 가집니다. 업종 코드는 코드값 파일을 통해 해석이 가능하며, 특정 업종에서 지역화폐와 카드 소비 행태가 얼마나 유사한지를 정량적으로 평가할 수 있습니다. 이 데이터는 업종별 소비행태 비교, 정책적 지역화폐 유도 효과 분석, 민간 소비 패턴과의 연계 분석 등에 활용됩니다.
