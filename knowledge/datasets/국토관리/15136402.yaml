summary_user: 경기도 시군별로 발행된 지역화폐의 매출금액과 전체 대비 비율(%)을 기준년월·발행구분(일반발행·정책발행·전체발행)별로 집계한 자료입니다. 분석가나 지자체 담당자가 "우리 시군에서 정책발행 지역화폐가 매출의 몇 %를 차지하고, 월별로 어떻게 변하는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군코드(sigun_cd)를 시군명으로 매핑하거나 같은 기관(경기도) 데이터의 코드로만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 각 시군에서 발행된 지역화폐의 매출 현황을 발행구분별로 집계한 자료입니다. 데이터는 ‘기준년월’을 기준으로 하며, ‘시군코드’를 통해 지역별 구분이 가능하고, ‘발행구분코드’는 발행 형태를 숫자코드로 표현합니다. ‘매출금액’은 해당 시군 및 발행유형에서 발생한 지역화폐 사용 금액을 나타내며, ‘매출금액비율’은 전체 대비 해당 항목이 차지하는 비율(%)을 의미합니다.* 발행구분코드 값은 0 : 일반발행, 1 : 정책발행, 9 : 전체발행 입니다.* 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.'
