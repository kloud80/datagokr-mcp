description_portal: '"물이용부담금"은 깨끗한 수돗물을 공급받는 하류 지역 주민들이, 상수원 수질 개선 및 상류 지역 주민 지원을 위해 징수비용(수도요금)과 별도로 부담하는 돈입니다.한강, 낙동강 등 4대강 수계관리기금을 조성하여 수질보전, 환경기초시설 설치 및 운영, 오염총량관리, 주민지원 사업에 사용됩니다.이는 상류 지역의 재산권 행사 제한에 대한 보상이자, 수질개선 서비스에 대한 보상이라는 윈윈(Win-Win) 개념의 제도입니다.수도요금 통합고지서에 포함되어 부과되며, 결과적으로 수질개선 및 상하류 주민 간의 공동 노력에 기여합니다'
