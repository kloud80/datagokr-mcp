summary_user: 경기도 내 개별주택의 공시가격을 필지·건물 단위로 담은 건별 자료로, 토지소재지·공시년도·기준월과 함께 주택공시가격, 토지대장면적, 토지산정면적, 연면적, 주거용도면적을 기록한다. 주택 소유자나 분석가가 '이 단독주택의 올해 공시가격이 얼마이고 보유세·건보료·복지 기준 산정에 어떻게 반영되는가', '시군별 개별주택가격이 어떻게 변했는가'를 확인하는 데 쓴다. 토지고유번호(land_idntfy_no) 필드가 있으나 실측에서 전역 조인 키로 확인되지 않아, 실거래가·표준주택가격 등 다른 데이터와는 소재지 이름이나 코드 매핑으로 이어 쓴다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 개별주택가격 관련 정보로, 경기도 내 개별 주택에 대한 토지소재지별 공시가격, 연면적, 토지대장면적 등 주택의 가치를 산정하는 데 필요한 항목들이 포함되어 있습니다. 항목에는 '토지고유번호', '토지소재지', '동일련번호', '공시년도', '기준월', '주택공시가격', '토지대장면적', '토지산정면적', '연면적', '주거용도면적'이 있으며, 해당 연도 기준으로 주택별 공시지가를 기반으로 한 주택 세금 부과, 주택자산 평가, 부동산 거래 시 가치 판단 등에 활용됩니다. 연면적 및 주거용도면적 항목은 건축물의 실제 사용공간을 나타내며, '공시년도'와 '기준월'은 해당 가격의 기준 시점을 나타냅니다. 이는 지역별 주택가격 변화 분석, 주거밀도 파악, 부동산 정책 수립 및 통계자료 작성에 기초 자료로 활용됩니다.
