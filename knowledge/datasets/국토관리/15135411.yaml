description_portal: '부산광역시 도시재생종합정보관리시스템의 데이터로 도시재생활성화 및 지원에 관한 특별법에 따라 수립되는 "도시재생 활성화계획", "도시재생인정사업", "도시재생혁신지구"의 사업관리번호,주소,사업유형명,활성화구역명,면적,활성화계획수립여부,도시재생비젼,사업목적,사업기간,소요예산 총액,소요예산 국비,소요예산 지방비,소요예산 민간,사업주체,수정일자,사업계획 등의 정보를 제공합니다.- 도시재생전략계획 : 부산광역시의 도시재생 추진목표 및 전략을 수립하는 10년 단위의 계획으로 도시재생사업을 추진할 수 있는 "도시재생활성화구역" 정보를 수록하고 있음- 도시재생활성화구역 및 계획 : 국토교통부 도시재생 공모사업에 선정된 지역으로 실질적인 도시재생사업이 추진되는 지역을 말함- 도시재생인정사업 : 도시재생활성화지역 외의 소규모 쇠퇴지역에서 도시재생활성화계획 수립 없이도 신속하게 도시재생사업을 시행할 수 있도록 인정받아 지원하는 사업- 도시재생혁신지구 : 도시재생을 촉진하기 위하여 공공주도로 쇠퇴지역 내 산업·상업·주거·복지·행정 등 기능이 집적된 지역거점을 조성하는 지구단위 사업- 우리동네살리기 : 인구유출, 건물노후화 등 활력을 상실한 소규모 주거지역에 생활밀착형 공공시설 등을 신속히 공급·지원하여 노후 주거환경을 개선하는 사업'
