summary_user: 경기주택도시공사가 토지분양시스템을 통해 청약홈페이지에 올린 토지(업무·산업시설용지, 단독주택용지, 준주거·숙박·종교용지 등) 분양공고를 공고 한 건당 한 행으로 담은 파일 데이터(CSV 약 174KB)로, 공고명·모집공고일·접수 시작·마감일·게시여부·공고 HTML 파일명을 포함한다. 토지 매입을 검토하는 사업자나 분석가가 'GH가 언제 어떤 용지를 공고했고 접수 기간은 언제였나'를 확인하거나 공고 일정을 시기별로 정리하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고명이나 같은 기관 내부 코드(공고일련번호)로만 맞춰 이어 쓸 수 있다.
limits: 공고 일정과 파일명만 담겨 있어 분양 가격, 면적, 경쟁률, 낙찰 결과는 알 수 없다. 명세상 연간·이벤트 주기로 갱신되는 파일이라 최신 공고가 바로 반영된다고 보기 어렵다. 다른 청약·분양 데이터와 공통 키가 없어 공고명으로 맞춰야 한다.
