summary_user: 경기주택도시공사가 판매 중인 토지를 필지(가지번) 단위로 한 줄씩 담은 파일로, 2023년부터의 공급연도·사업명·소재지·지목·면적·공급용도·용도지역과 최고건폐율·최고용적률·최고층수 같은 건축 제한 정보를 포함한다. 토지 매입을 검토하는 사업자나 투자자가 '경기주택도시공사 사업지구에서 근린생활시설 용지로 나온 필지의 면적과 허용 용적률은 얼마인가' 같은 질문에 쓴다. 실측된 조인 키는 사업지구 내 임시 번호인 가지번(gh_provisional_lot_no)뿐이라 같은 공사의 다른 토지·분양 자료와 맞추는 데 쓰며, 실거래가·공시지가 등 외부 자료와는 확정지번이나 소재지 주소를 별도로 정제해 이어야 한다.
description_portal: 경기주택도시공사에서 판매 중인 토지의 2023년부터의 현황 정보를 제공하는 데이터로써 공급연도, 사업명, 가지번, 확정지번, 소재지, 지목, 면적, 공급용도, 용도지역, 최고건폐율, 최고용적률, 최고층수 등의 세부 정보를 포함합니다. 사업별 용지의 지목 및 공급용도, 면적 등을 제공하는 이 데이터를 통해 주거, 상업, 근린생활시설 등 다양한 용도의 토지에 대한 정보를 확인할 수 있으며, 투자자 및 수요자에게 유용한 기초자료로 활용될 수 있습니다. 대지, 공장용지, 주차장 용지, 학교용지 등 사업별 지목에 따른 면적 등을 참고하여 부동산 개발, 토지 매입 전략, 지역개발 분석 등에 활용도가 높을 것으로 기대됩니다.
