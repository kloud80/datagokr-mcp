description_portal: '이 데이터는 경상북도 봉화군의 상수도 및 하수도 요금 정보를 정리한 자료입니다. 각 업종별, 사용량 구간별 요금 단가와 관리기관 등의 항목으로 구성되어 있으며, 봉화군민의 상하수도 요금을 한눈에 확인할 수 있도록 제공합니다. 데이터는 총 8개 컬럼으로 구성되어 있으며, 기준일은 2025년 7월 14일입니다.구분: 상수도 또는 하수도 여부를 구분합니다.업종: 요금이 적용되는 업종 구분으로, ‘가정용’, ‘일반용’ 등으로 표시됩니다.단계: 사용량에 따른 요금 단계 구분입니다.사용량(제곱미터): 요금이 적용되는 사용량 범위를 제곱미터 단위로 나타냅니다.금액(원_제곱미터): 1제곱미터당 부과되는 요금을 원화로 표기합니다.관리기관: 상하수도 요금을 관리하는 기관의 명칭입니다. 예: K-water 봉화수도지사.연락처: 관리기관의 대표 전화번호입니다.데이터기준일자: 데이터가 집계된 기준일로, 2025년 7월 14일로 명시되어 있습니다.'
