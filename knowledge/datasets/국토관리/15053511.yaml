summary_user: 충청남도개발공사가 맡은 내포신도시 구간의 용지 분양 현황을 공급용도별로 집계해, 전체·매각·미매각 필지수와 면적(제곱미터), 분양률을 담은 2021년 기준 소형 CSV 파일(894바이트)이다. 내포신도시에서 주거·상업 등 어느 용도의 용지가 아직 팔리지 않고 남아 있는지 확인하려는 사업자·투자자나 공공개발 공급 실태를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 공급용도 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 2021년 기준, 충청남도개발공사가 담당한 내포신도시 구간의 용지 분양 현황 정보를 제공합니다.제공되는 정보는 아래와 같습니다.1. 공급용도2. 전체 필지수3. 면적(제곱미터)4. 매각 필지수5. 매각 필지 면적(제곱미터)6. 미매각 필지수7. 미매각 필지수 면적(제곱미터)8. 분양률* 본 데이터는 공공개발사업의 공급 실태 파악, 주거 및 생활 기반시설 확충 상황 분석, 민간 투자 활성화를 위한 입지 정보 제공 등 정책 수립과 시민 참여를 위한 기초자료로서의 가치를 지닌 정보이며, 지역 균형 발전, 공공자산의 투명한 활용 등을 지원하는 정보입니다 *
