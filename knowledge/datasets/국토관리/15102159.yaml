description_portal: 본 공공데이터는 구청에서 여권 발급 시 부과되는 수수료 정보를 포함하고 있습니다. 본 자료는 여권의 구분, 수수료 항목으로 정리 되어 있습니다. 여권의 종류별 수수료 금액이 명시되어 있어 여권 신청 시 필요한 비용을 사전에 파악하는데 활용될 것으로 판단이 됩니다. 또한 시민의 행정 편의를 높이고 투명한 민원 행정 운영에 기여하며, 여권 업무 처리와 관련된 공공서비스 안내 자료로 활용할수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영을 하고 있습니다.
