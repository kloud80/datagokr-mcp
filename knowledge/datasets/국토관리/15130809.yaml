summary_user: 경기도 내 업무용·상업용 부동산의 실거래를 거래 건별로 담으며, 시군구·읍면동, 용도지역, 계약일, 전용면적·대지권면적, 층, 거래금액, 건축년도, 해제사유, 중개구분, 매도·매수 주체 정보를 포함한다. 분석가나 사업자가 '경기도 특정 시군에서 상가·사무실의 면적당 거래금액이 어떻게 변했고 직거래 비중은 얼마인가' 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 시군구코드·읍면동코드(signgu_cd, emd_cd)나 시군구·읍면동 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 업무용 및 상업용 부동산의 실거래 정보를 제공하며, 계약일 기준으로 실제 거래금액과 거래 형태를 파악할 수 있습니다. 주요 항목에는 시군구코드, 접수년도, 접수번호, 물건번호, 읍면동코드, 용도지역명, 건물구분, 계약일, 전용면적, 대지권면적, 층수, 지분거래구분, 거래금액, 건축년도, 건물주용도명, 해제여부 및 해제사유, 중개구분, 매도자·매수자 거래주체정보, 신고번호 등이 포함됩니다. 이를 통해 지역별 상업용·업무용 건물의 거래 특성을 분석하거나, 중개거래와 직거래 비중, 전용면적 대비 거래금액 추세, 계약 해제 사유 발생 현황 등을 파악할 수 있습니다.
