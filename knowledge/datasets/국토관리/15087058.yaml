summary_user: 인천광역시 미추홀구 안의 재래시장(전통시장)을 시장 한 곳당 한 행으로 담은 목록 파일로, 시장명·도로명주소·전화번호·위도·경도를 담는다(약 1.4KB 규모의 CSV). 주민이나 상권 분석가가 '미추홀구에 어떤 전통시장이 어디에 있고 연락처는 무엇인가'를 확인하거나 시장 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없으며, 도로명주소나 위경도 좌표를 이용해 다른 위치 데이터와 공간적으로 맞추거나 시장명으로 이름 매칭해 잇는다.
description_portal: 본 데이터는 인천광역시 미추홀구의 재래시장 정보를 담고 있습니다. 연번, 시장명, 도로명주소, 전화번호, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 재래시장의 위치와 연락처를 파악할 수 있으며, 신기시장, 용현시장, 석바위시장, 토지금고시장, 용남시장, 제일시장, 도화종합시장, 인천남부종합시장, 용일시장, 제물포시장, 통일종합시장, 숭의평화시장, 공단시장, 주안자유시장, 학익시장 등 다양한 전통시장이 분포되어 있습니다. 각 시장의 위경도 좌표를 통해 정확한 위치를 확인할 수 있으며, 지역 주민들의 생활 밀착형 상권을 형성하고 있습니다. 이 데이터는 지역 내 전통시장 분포 현황 파악, 재래시장 활성화 정책 분석, 지역 상권 구조 연구 등에 활용될 수 있습니다.
