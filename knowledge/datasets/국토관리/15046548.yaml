description_portal: '○ 통계개요* 통계명 : 용도지역 현황* 통계종류 : 서울시 자치구별 용도지역 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「국토의 계획 및 이용에 관한 법률」에 따른 도시계획에 의해 지정ㆍ변경되는 용도지역 면적* 작성목적 : 서울시 토지에 관한 정보와 연간 토지허가 및 거래 현황을 파악하여,공정한 부동산관련 정책 수립과 연구ㆍ분석을 위한 기초자료로 활용하는것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 용도지역별(주거, 상업, 공업, 녹지) 면적 현황 등○ 용어설명* 토지 용도지역구분 : 국토의 계획 및 이용에 관한 법률에 의거 도시지역(주거, 상업,공업, 녹지), 관리지역, 농림지역 등으로 구분함- 주거지역 : 제1종ㆍ제2종 전용주거지역, 제1종ㆍ2종ㆍ3종 일반주거지역, 준주거지역- 상업지역 : 중심상업지역, 일반상업지역, 근린상업지역, 유통상업지역- 공업지역 : 전용공업지역, 일반공업지역, 준공업지역- 녹지지역 : 보전녹지지역, 생산녹지지역, 자연녹지지역'
