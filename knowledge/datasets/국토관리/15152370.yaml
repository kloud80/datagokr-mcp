description_portal: '한강홍수통제소 단기 예측 기반 침수위험은 강우레이더 자료를 기반으로 각 행정구역 별 강우량 정보를 제공 한다. 각 행정구역별의 강우 변화를 실시간으로 분석하여 강우 상황을 명확하게 파악할 수 있다. 이를 통해 집중호우와 같은 기상 위험에 대비하고, 안전한 대응 전략 수립에 기여하며, 예측 정보를 지속적으로 업데이트 한다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
