summary_user: 청약홈에 공고된 APT 분양 단지의 주택형별 공급 정보(공급면적, 일반·특별공급 세대수, 분양최고금액)를 담은 전국 단위 파일로, 검증 시 13,210행을 받았다. 청약을 준비하는 국민이나 분석가가 특정 주택형의 공급 세대수와 분양 최고가가 얼마인지 확인하는 데 쓴다. 주택명·공급위치 등 기본정보는 포털 설명대로 '주택관리번호'로 한국부동산원 청약홈 APT 분양정보 파일과 매핑해 잇고, 그 밖의 전역 조인 키는 실측에서 확인되지 않았다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있다. 주택명·공급위치 같은 기본정보는 이 파일에 없으므로 분양정보 파일과 함께 봐야 한다. 갱신 주기는 명세상 연간·이벤트 주기로 적혀 있다.
