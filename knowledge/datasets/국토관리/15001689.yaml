summary_user: 전남광주통합특별시의 국가기초구역 번호 배정 현황을 담은 460바이트 규모의 작은 집계 CSV 파일로, 번호 구간의 시작·끝, 할당·설정 번호, 예비번호 수와 비율, 폐지번호 수, 지역유형, 기초구역군 수를 구분별로 정리했다. 주소·우편 업무 담당자나 분석가가 이 지역에 기초구역 번호(우편번호 5자리)가 얼마나 설정됐고 예비·폐지 번호가 얼마나 남았는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 구분명이나 번호 구간을 이름·코드로 맞춰 연결해야 한다.
description_portal: 국가기초구역은 전국 토지를 효율적으로 관리하고 우편·행정·산업활동의 기반이 되는 최소 단위 구역체계로, 도로명주소를 기반으로 설정됩니다. 5자리 숫자로 구성되어, 우편번호·통계·재난대응 등 다양한 분야에서 활용됩니다. 기초구역은 행정경계와 생활권, 교통망 등을 종합 고려해 구획되며, 국가공간정보시스템과 연계되어 공공·민간 부문에서 위치정보 활용의 표준 참조체계로 쓰입니다. 이를 통해 주소정보의 정확성과 행정서비스 효율성을 높이고, 국민 생활 편익 증진과 데이터 기반 정책 수립에 기여합니다. (2026년 현황 자료입니다.)
