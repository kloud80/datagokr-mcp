summary_user: 고양시 재정비촉진사업의 사업장별 현황을 한 행씩 담은 작은 파일(csv 약 2.5KB)로, 사업구분(주택재개발·도시환경정비), 사업장명(원당·능곡·일산 등), 진행단계(조합설립인가·사업시행계획인가·관리처분계획인가·착공·정비구역해제 등), 시 홈페이지 안내 주소를 담는다. 고양시 재개발 구역에 집을 사거나 투자하려는 사람이 '이 구역이 지금 관리처분 단계인지, 구역이 해제됐는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 정비사업·부동산 데이터와는 사업장명이나 고양시라는 기관 단위로만 맞춰 이어 써야 한다.
description_portal: 경기도 고양시 재정비촉진사업현황 데이터는 사업유형, 사업구분, 사업장명, 진행단계, URL 등의 항목을 제공합니다. 사업유형은 재정비촉진사업, 사업구분은 주택재개발, 도시환경정비입니다. 사업장은 원당, 능곡, 일산을 포함하는 데이터이며, 진행단계는 착공, 사업시행계획인가, 정비구역해제, 준공인가 전 사용허가, 관리처분계획인가, 조합설립인가 등의 단계를 포함합니다. 인터넷주소는 고양시 대표홈페이지에서 재정비촉진사업 소개, 추진절차, 재정비촉진지구, 계획, 사업시행, 절차도 등의 정보를 개방하는 사이트입니다.
