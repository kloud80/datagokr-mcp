description_portal: '서울특별시 중구에서 운영 중인 분뇨수집운반업체의 인허가 정보를 제공하는 데이터입니다. 본 데이터는 해당 업종에 종사하는 업체의 소재지, 허가일자,  좌표 정보 등을 포함하고 있습니다. 좌표는 중부원점 기준 좌표계(EPSG:5174)를 사용하여 공간 분석에 활용할 수 있습니다. 이 정보는 지역 내 공공위생 수준을 파악하고 환경관리 정책 수립에 필요한 기초자료로 활용됩니다. 또한, 업체별 운영현황을 확인함으로써 행정기관의 관리 효율성을 높이고, 시민의 알권리를 보장하는 데 기여합니다. 처리시설의 종류와 위치 정보는 환경오염 예방 및 자원 재활용 정책 수립에 있어 중요한 참고자료로 사용됩니다. 본 데이터는 서울시 공공데이터포털을 통해 누구나 자유롭게 열람 및 활용할 수 있으며, 지역사회 위생관리와 환경정책의 실효성을 높이는 데 도움이 됩니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
