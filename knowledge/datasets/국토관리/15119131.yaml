description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 공고에 대한 공공데이터 자료입니다. 이번 자료에서는 공고 번호, 공고 제목, 공고 일자, 열람 시작 일자, 열람 종료 일자 정보를 제공합니다. 이 자료를 통해 공고 번호에 해당하는 도시계획 공고 제목이 무엇인지 확인할 수 있습니다. 또한 해당 공고가 언제부터인지 알 수 있으며, 열람을 할 수 있는 시작 일자와 종료 일자가 언제부터 언제까지인지도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.
