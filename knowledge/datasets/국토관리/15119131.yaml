summary_user: 진안군 도시계획정보시스템(UPIS)에 올라온 도시계획 공고를 공고 한 건당 한 행으로 담은 원천 목록이며, 공고번호·제목·공고일자와 열람 시작·종료일자를 담는다(파일 약 12KB). 주민이나 개발 관심 사업자가 '진안군에서 어떤 도시·군관리계획 공고가 언제 났고 열람 기간이 언제까지였나'를 확인하거나, 관리계획 결정을 개발 가능성의 선행 신호로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공고 제목 속 지명·사업명을 이름으로 맞추거나 같은 기관(진안군) 기준으로만 이어 쓴다.
limits: 공고의 위치·면적·결정 내용 같은 세부 정보는 없고 제목과 날짜만 있어, 구체적 계획 내용은 원문 고시를 따로 확인해야 한다. 명세상 수시·이벤트 주기로 생성되는 자료이며, 범위는 진안군 한 시군구로 공간 좌표가 없다.
