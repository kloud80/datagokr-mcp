description_portal: 총 818행으로 구성된 냄새·맛 라이브러리 입니다.132종의 냄새 묘사어(국문·영문)를 사용해 알콜냄새, 바나나냄새, 썩은 달걀냄새, 곰팡이냄새, 바이올렛냄새 등 다양한 냄새를 분류하고,이 냄새를 일으키는 주요 기원(하·폐수, 플라스틱 배관 재질(HDPE, PEX, PVC 등), 맥주, 저수지·호수·강의 조류(Cyanobacteria, Green algae, Diatoms 등), 방선균)과 구체적인 화학물질(총 238종, 대표적으로 Geosmin, 2-MIB, Dimethyl sulfide, β-Ionone, Hydrogen sulfide, Indole, n-Butanol 등)을 매칭.각 항목은 냄새명 → 영문명 → 기원 → 상세기원 → 원인물질 → 출처 논문·보고서로 체계적으로 정리되어 있으며,하수·정수 처리, 먹는샘물·수돗물 이취미 관리, 맥주 풍미 분석, 조류 대발생 시 냄새 진단 등 환경·식수·식품 분야에서 실무적으로 활용 가능한 종합 냄새 라이브러리입니다.
