description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 건축한계선현황으로 규제관리번호, 현황도형 관리번호, 길이_도형 등의 항목을 제공합니다.건축한계선은 건축물의 지상 부분을 도로면으로부터 일정 거리 후퇴시켜 건축하도록 하는 선을 말합니다. 이는 보행자의 안전과 편의를 확보하고, 가로 공간의 개방감을 유지하기 위해 지정됩니다. 건축한계선은 도시계획시설, 지구단위계획 등에서 정해지며, 해당 지역의 특성에 따라 다르게 설정될 수 있습니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
