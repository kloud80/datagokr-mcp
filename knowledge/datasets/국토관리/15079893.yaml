summary_user: 경상북도 청송군 일반건축물의 시가표준액을 건물별로 담은 파일로, 과세년도·물건지·연면적·결정일자와 함께 지방세 과세 기준 금액을 기록한다(CSV 약 1.2MB). 청송군 내 특정 건물의 재산세·취득세 산정 기준이 되는 시가표준액이 얼마인지 확인하려는 군민·세무 실무자, 지역 건축물 가치 분포를 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장 등 다른 데이터와는 물건지 주소 문자열이나 자치단체코드로만 맞춰 이어야 한다.
description_portal: '경상북도 청송군 일반건축물 시가표준액 공공데이터는 각 건축물의 시가표준액에 대한 정보를 포함하고 있습니다. 이는 부동산 관련 과세 및 공공행정에 활용되는 중요한 지표입니다. 시가표준액은 지방세 부과를 위하여 행정안전부·지방자치단체장이 일반건축물의 거래가격을 기준으로 종류·구조·용도·경과연수 등을  고려하여 평가한 금액으로, 주로 세금 부과 기준이나 행정 목적(예: 건강보험료 산정, 재산세, 취득세 등)에 사용됩니다. 또한 공공데이터포털에서 누구나 상세 현황 파일을 다운로드하거나 API로 이용할 수 있어, 실무자는 물론 군민들도 손쉽게 현황을 확인할 수 있습니다.'
