summary_user: 경기도 행정동 간 유입 인구를 기준일·도착 시간대·도착 행정동별로 이동수단·성별·연령대로 나눠 인구수를 담은 집계 자료로, 범위는 시도, 행정단위는 읍면동이다. 지자체 교통·도시계획 담당자나 분석가가 '특정 행정동에 출근 시간대에 어떤 연령대가 대중교통으로 얼마나 들어오는가'를 파악하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못해, 도착 행정동 코드·이름(dest_admdong_cd)이나 시도·시군구명 매핑, 중심 좌표로 다른 행정동 단위 통계와 이어 붙여야 한다.
description_portal: 이 데이터는 행정동 간 유입 인구를 이동수단별·성별·연령대별·시간대 기준으로 집계한 자료입니다. 도착지(행정동)와 해당 시점의 유입 규모가 함께 제시되어, 어떤 집단이 어떤 수단을 통해 언제 유입되는지까지 세분화된 이동 행태를 파악할 수 있습니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
