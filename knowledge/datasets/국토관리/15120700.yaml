summary_user: 경기도 하남시에 지정된 용도구역을 종류(구분)별로 개소와 면적으로 묶어 담은 집계표이며, 건별 지정 원천이 아닌 198바이트 규모의 작은 CSV 파일이다. 포털 설명에 따르면 2025년 12월 31일 기준 개발제한구역 1개소(66,354,892㎡)만 지정돼 있다. 하남시 개발제한구역 면적이 얼마인지, 시가화조정구역 같은 다른 용도구역이 있는지 확인하려는 도시계획 담당자나 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 구역 종류 이름이나 같은 기관(하남시) 기준으로만 맞춰 붙인다.
description_portal: 경기도 하남시 내 용도구역 지정 현황을 나타내며, 2025년 12월 31일 기준으로 개발제한구역 1개소, 면적 66,354,892㎡가 지정되어 있습니다. 하남시 전체 면적의 약 71퍼센트가 개발제한구역으로, 개발제한구역 지정 비율이 높은편입니다.  수도권 과밀억제 정책의 1차 대상지였고, 자연·수자원 보호 필요성이 높으며, 도시화가 늦게 진행된 탓에 대규모 미개발지를 장기적으로 그린벨트로 지정해온 결과입니다.    시가화조정구역, 수산자원보호구역, 도시자원공원구역, 기타 용도구역은 현재 지정되지 않았습니다. 해당 데이터는 도시의 환경보전, 난개발 방지, 계획적‧체계적 도시계획 수립을 위한 기초자료로 활용됩니다.
