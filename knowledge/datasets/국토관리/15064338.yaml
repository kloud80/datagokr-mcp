summary_user: 경상남도 창원시 관내 건축물대장(일반)에 등록된 건축물을 개별 건별로 담아 대지위치 주소, 건축면적(제곱미터), 옥내·옥외 기계식·자주식 주차대수와 총주차대수를 기록한 파일 데이터다. 창원시 건축물의 주차 공급 수준이나 건축면적 분포를 지역별로 살펴보려는 분석가·도시계획 담당자가 '어느 동네 건물들이 면적 대비 주차대수가 부족한가' 같은 질문에 쓴다. 실측 컬럼에 건축물관리번호나 법정동코드 같은 전역 조인 키가 없어, 다른 건축물대장·공간 데이터와는 대지위치 주소 문자열을 매칭해야만 이어 쓸 수 있다.
description_portal: 경상남도 창원시 관내 등록된 건축물대장(일반)에 관한 데이터로 건축물 주소, 건축 면적, 주차 면수의 정보를 제공합니다.건축물대장 정보 데이터는 개별 건축물의 주소,건축면적, 주차대수 등을 통합 기록한 자료입니다. 이 데이터는 도시 계획 수립, 건축 인허가 검토, 세금·공공요금 부과 기준 마련, 재난 안전 점검, 민원 및 소송 대응, 부동산 시장 분석 등에 폭넓게 활용될 수 있습니다. 특히 GIS 기반 공간 시각화와 결합하면 건축 밀집도, 용도 혼합 패턴, 리모델링 추이 등을 시각적으로 파악하는 데 유용한 기초자료가 됩니다.
