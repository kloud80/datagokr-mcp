summary_user: 시군구·변환지구별로 지역측지계(동부·중부·서부·망산 등 원점)에서 세계측지계로 바꾼 변환계수 성과(공통점수, X·Y 이동거리, 축척 변화량, 회전량)와 지구의 면적·도곽수·진행상태를 한 행씩 담은 전국 단위 파일(CSV 약 10MB)이다. 지적측량 실무자나 공간정보 분석가가 특정 시군구 변환지구에 어떤 헬머트 변환계수가 적용됐는지, 불부합지·수정필지가 얼마나 되는지 확인할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군구코드·시군구명을 행정구역 코드표와 맞추거나 같은 기관의 지적 데이터와 이름·코드로 연결해 쓴다.
description_portal: 시군구 및 변환지구별 세계측지계 변환계수 성과 (공통점수, x거리, Y거리, 축척, 회전량) 관한 데이터가 있습니다.지역별 지리적 특성과 측량 관습에 맞춰진 다양한 지역측좌표계(동부, 중부, 서부, 망산, 계양, 조본, 가리 등)를 전 세계 공통기준좌표(wgs84)로 변환되었습니다.세계측지계 변환은 지역좌표와 세계좌표 성과를 가진 기준점으로 변환계수(3변환, 4변환)를 생성하고, 수치 및 도해지역을 구분하여 변환계수를 통해 수학적 모델인 헬머트 변환(2차 평면상 이동,축척, 회전을 이용한 도형 좌표 변환 모델)으로 좌표를 변환합니다.
