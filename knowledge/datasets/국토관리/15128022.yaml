summary_user: 안성시 관내 산업단지·농공단지를 단지 한 곳당 한 행으로 정리한 현황 파일로, 단지명·위치·주요업종과 내국인·외국인·합계 인원을 담으며 파일 크기는 약 2.9KB입니다. 기업 입지 담당자나 지역경제 분석가가 '안성시 어느 산업단지에 어떤 업종이 모여 있고, 외국인 인력 비중은 얼마인가'를 확인하는 데 씁니다. 공통 조인 키가 없어 산업단지명을 기준으로 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황(산업단지코드 원장)에 이름 매핑해 연결합니다.
description_portal: 본 데이터는 경기도 안성시 관내에 조성된 각종 산업단지 및 농공단지의 기본 현황을 제공하는 자료이다. 산업단지명, 소재지, 준공일자, 단지별 면적, 입주업체 수 등 기초 정보를 구조화하여 수록함으로써 지역 산업입지 현황을 한눈에 파악할 수 있도록 구성되어 있다. 이용자는 본 데이터를 통해 산업단지별 개발 규모와 입주 여건을 비교·분석할 수 있으며, 기업입지 검토, 투자계획 수립, 산업정책 연구 등 다양한 행정·민간 활용에 참고자료로 활용할 수 있다. 또한 시기별 현황 갱신을 통해 산업단지 조성 진척과 입주 추이를 점검할 수 있어, 안성시 지역경제 동향과 산업 기반 변화를 이해하는 데에도 유용한 공공데이터이다.​
