summary_user: 운영 중인 부동산투자회사(리츠)별 기본현황(리츠명·자산관리회사·인가일·리츠유형·대표투자대상·자산총계·배당수익률·상장일 등)과 공모 정보(모집가액·청약일정·청약·배정 주식수량과 비율 등)를 리츠 단위로 담는 전국 범위 API다. 투자자나 금융 플랫폼 사업자가 '지금 공모 중인 리츠의 모집 규모와 청약 일정, 해당 리츠의 배당수익률은 얼마인가'를 확인하는 데 쓴다. 리츠번호(reitsNo)와 자산관리회사번호가 서비스 안의 연결 고리이며, 다른 데이터셋과 공유하는 전역 조인 키는 없어 리츠명·자산관리회사명 같은 이름 매칭으로만 외부 데이터와 이어 쓴다.
limits: 4개 오퍼레이션 중 2개만 실호출에 성공했고, 투자대상 목록과 공시 목록(/getReitsInvtTrgtList, /getReitsPblntfList)은 최소 파라미터로는 응답이 없었다. 상세 조회에는 필수 파라미터 리츠번호(reitsNo)가 필요하므로 목록 조회로 먼저 번호를 받아 넘겨야 한다. 개발계정은 하루 1,000회로 호출이 제한된다.
