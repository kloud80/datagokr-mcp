description_portal: 리츠정보시스템에서 관리하는 리츠 관련정보 중 운영중인 부동산투자회사(리츠) 공시사항, 공모정보, 수탁리츠 목록 등의 정보를 제공합니다. 본 서비스는 국토교통부가 제공하는 공공 API로서 운영 중인 부동산투자회사에 대한 기본현황과 공시자료, 공모 진행상황 및 수탁 관련 정보를 표준화된 REST 방식의 JSON 형식으로 제공한다. 제공되는 데이터는 투자자, 금융·부동산 플랫폼 사업자, 시장 모니터링 시스템 운영자, 학계 연구자 및 정책 담당자 등이 리츠의 운용 현황, 공모 일정·규모, 공시 내역을 확인하고 수익성·리스크 분석, 상품 추천, 시장 감시 및 정책 수립·평가 등에 활용할 수 있다. 출력 결과의 주요 항목으로는 리츠 고유식별자, 리츠명, 등기·운영상태, 설정일자, 운용회사명, 수탁회사명, 투자대상(자산유형 및 상세내역), 공시일자 및 공시유형, 공모시작·종료일자, 공모총액 및 모집현황, 최근공시요약, 수익률 지표, 조회일자 및 데이터 갱신시각 등이 포함된다. 이 외에도 페이징(pagination) 정보와 정렬(sort) 옵션을 제공하여 대량 데이터 조회를 지원하며, 출력 항목은 서비스 개선 및 법령·제도 변경에 따라 변경될 수 있다.
