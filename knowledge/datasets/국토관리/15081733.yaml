description_portal: '이 데이터는 대전광역시가 시민들에게 볼거리와 휴식 공간을 제공하고 아름다운 하천 경관을 연출하기 위해 조성한 3대 하천(갑천, 유등천, 대전천) 주변의 계절 꽃(봄·가을) 단지에 대한 조성 현황을 담고 있습니다. 각 하천 별 꽃 단지 위치, 조성 면적, 식재된 주요 꽃 종(예: 코스모스, 유채꽃, 백일홍 등), 조성 시기 등 다양한 정보가 포함되어 있어 시민 열람 뿐 아니라 도시 녹지 환경의 기획 및 유지 관리에도 활용될 수 있습니다. 이 자료는 시민 체류형 친환경 공간 조성, 하천 경관 개선 사업, 계절 별 지역 축제 연계, 도시 생태 관광 자원 구성 등 다양한 정책 및 홍보 자료의 기초 자료로 활용 가능하며, 환경·조경·관광 관련 연구 및 행정 계획에도 폭넓게 사용될 수 있습니다.'
