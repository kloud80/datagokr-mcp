summary_user: 경상북도 구미시 일반건축물의 지방세 과세 기준인 시가표준액을 건물(동·호) 단위로 담은 파일로, 과세년도·법정동리·본번·부번 같은 위치 정보와 시가표준액·연면적·기준일자를 함께 싣는다. 구미시 소유 건물의 재산세 기준 가액이 얼마인지 확인하려는 소유자나, 읍면동별 건축물 가액 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없으므로 다른 건축물·토지 자료와는 법정동·리 이름과 본번·부번(지번)을 맞춰 연결하고, 같은 기관 자료와는 자치단체코드로 묶는다.
description_portal: 경상북도 구미시의 일반건축물에 대한 지방세 부과 기준인 시가표준액 자료로, 자치단체코드, 과세년도, 법정동·법정리, 특수지 여부, 본번·부번, 동·호 등 건축물의 위치를 나타내는 정보와 물건지 세부 사항을 포함하고 있습니다. 또한 해당 건축물의 시가표준액, 연면적, 기준일자 등 과세 산정에 필요한 핵심 데이터도 함께 제공합니다. 이 자료는 구미시 내 일반건축물의 가치를 공정하게 평가하고, 재산세 등 지방세를 정확하게 부과하기 위한 기초 자료로 활용될 수 있습니다. 더불어 건축물의 위치와 가액 분포를 분석하여 지역별 과세 현황을 파악하거나 부동산 관련 정책 수립, 도시계획 연구에도 참고할 수 있는 유용한 데이터입니다.
