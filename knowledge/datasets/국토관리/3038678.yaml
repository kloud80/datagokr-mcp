description_portal: '경기도 구리시 상수도요금현황은 경기도 구리시의 모든 상하수도요금정보를 용도로 구분하여 현황정보(업종별, 단계별, 상수도요금, 하수도, 물이용부담금 등)을 제공합니다.안내되어있는 모든 금액은 (단위 : m³/원)으로 부과되는 금액입니다.업종별 요금 요율표는 구리시 수도급수 조례 제24조의 별표1을 근거로 합니다.〈가  정  용〉○ 전용 또는 공용 급수전으로 가사용을 급수하는 것○ 담배, 연탄, 양곡, 문방구, 지물포, 철물, 과일판매 등의 소매업 및 부동산 중개업, 인장업, 행정서사업, 수예점, 만화가게, 구멍가게 등의 10㎡ 미만의 소규모 가게○ 고아원·영아원·양로원·탁아소 등 사회복지시설〈일  반  용〉  ○ 타 업종에 속하지 않는 모든 급수〈욕  탕  용〉○ 일반목욕장업업종별 구분은 구리시 수도급수조례 제25의 별표2를 근거로 합니다.요금에 대한 자세한 설명은 구리시청 수도과로 문의하여 주시기 바랍니다.'
