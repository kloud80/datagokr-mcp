summary_user: 경기도 개발제한구역 안의 위법행위를 집계년도·시군 단위로 묶은 통계로, 적발·조치·미조치 건수와 이행강제금의 부과·징수·미징수 건수와 금액을 담는다. 연구자나 지자체 담당자가 어느 시군이 적발한 위반을 실제로 얼마나 조치했는지, 이행강제금을 부과하고도 얼마나 걷지 못했는지 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명(sigun_nm)과 집계년도를 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 개발제한구역 내 위반 사례에 대한 시군별, 연도별 통계를 제공하며, 주요 항목으로는 위법행위 적발건수, 조치건수, 미조치건수, 이행강제 부과 및 징수 관련 건수와 금액 등이 포함되어 있습니다. 집계년도와 시군명을 기준으로 각 지자체의 단속 및 행정조치 실적을 파악할 수 있으며, 위법행위에 대해 실제로 얼마나 조치가 이루어졌는지, 이행강제금이 얼마나 부과·징수되었는지를 수치로 비교할 수 있습니다. 이 데이터는 지역별 개발제한구역 관리 실태를 평가하고, 위법행위 대응의 효율성 및 미징수에 따른 재정적 영향을 분석하는 데 활용될 수 있습니다.
