summary_user: 경기도 내 하천을 하천 한 건 단위로 담은 목록으로, 하천명·하천등급·기점과 종점 위치·본류와 지류명·지정일과 고시 내역·유로연장·유역면적·제방 정비 완료와 보강·신설 필요 구간 연장·하천미수립구간 연장을 포함한다. 경기도 하천 담당자나 분석가가 특정 하천의 등급과 상하류 위치, 제방 보강이 필요한 구간 길이를 확인할 때 쓰고, 개발 사업자는 사업지 인근 하천의 지정 현황을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 하천 데이터와는 하천명이나 하천코드(RIVERSTRM_CD_NO)를 이름·코드 매핑하는 방식으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 하천의 기점, 종점 및 지류에 대한 현황 정보를 제공합니다. 데이터에는 하천명, 하천등급, 기점위치 및 경계위치, 종점위치 및 경계위치, 하천지정일자, 하천고시일내역, 본류 및 지류명, 유로연장(km), 유역면적(㎢), 제방 정비·보강·신설 필요 구간 연장(km), 하천미수립구간 연장 등이 포함되어 있습니다. 경기도 하천의 관리와 유지보수, 하천 정비계획 수립, 수질관리, 홍수 예방 및 재해 대응, 수자원 개발 등에 활용할 수 있는 중요한 기초자료입니다. 또한 국가하천, 지방하천 등 하천등급에 따른 관리 체계 파악과 생태환경 보전, 도시개발 및 환경영향평가 자료로도 활용 가능합니다. 데이터 활용 시 최신 고시일, 지정근거 등 행정적 변경 사항을 반영하는 것이 필요합니다.
