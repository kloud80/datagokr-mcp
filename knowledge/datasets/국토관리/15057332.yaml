status: active
summary_user: 공동주택관리정보시스템(K-apt)에 가입한 공동주택 단지의 목록을 단지 한 곳당 한 행으로 담으며, 단지코드·단지명·시도~리 주소·법정동코드·도로명주소를 제공하고 전국 22,318건 규모다. 분석가가 '이 법정동(또는 시군구)에 있는 아파트 단지는 무엇이고 각 단지코드는 무엇인가'를 확인해 관리비·장기수선·입찰 같은 K-apt 단지별 정보를 조회하기 전에 대상 단지를 고를 때 쓴다. 단지코드(kaptCode)는 실거래 단지명·공시가격 동호·청약 단지를 잇는 매핑 마스터 역할을 하고, 법정동코드(bjdCode, 10자리)로 법정동 기준의 다른 주택·부동산 데이터와 연결한다.
limits: 필수 파라미터인 법정동코드·시도코드는 이 API가 주지 않으므로 법정동코드 데이터에서 먼저 받아 넘겨야 하며, 시도별·법정동별 목록 오퍼레이션 2개는 최소 파라미터로는 응답이 없었다(실호출 성공 3/5). 검증 때는 22,318건 중 1,048행만 받았으므로 전량 수집하려면 페이지를 23회 이상 반복 호출해야 하고, 개발계정은 하루 5,000회로 제한된다.
