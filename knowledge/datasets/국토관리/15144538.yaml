summary_user: 지방자치단체가 국토이용정보통합플랫폼(KLIP)에서 작성해 토지이음으로 전송한 인터넷 주민의견청취 공고를 게시물 단위로 담은 전국·시군구 단위 목록 파일(약 14KB CSV)로, 공고제목·내용·공고일자·열람 시작·종료일·문의처·첨부파일명을 포함한다. 주민이나 개발사업자가 '우리 시군구에서 지금 열람 중인 도시계획 관련 주민의견청취 공고가 무엇이고 언제까지 의견을 낼 수 있는가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없으며, 시군구코드(행정표준코드 법정동 코드)를 법정동 코드표와 매핑하거나 지역명으로 다른 지역 데이터와 연결한다.
description_portal: 『국토의 계획 및 이용에 관한 법률』 제28조, 같은법 시행령 제22조 등에 따라 국토이용정보체계를 통해 주민의견청취를 진행하는 경우에 관한 사항입니다. 각 지방자치단체가 국토이용정보통합플랫폼(KLIP)을 통해 작성한 자료를 국토이용정보체계 토지이음으로 전송하여 서비스를 제공하고 있는 인터넷 주민의견청취 공고 게시물에 한정하여, 해당 자료에 대한 제목 및 내용, 공고일자, 열람의 시작일 및 종료일, 열람장소와 문의처, 그 밖에 첨부파일 관련 정보 등 해당 공고 게시물의 목록 정보를 제공하고 있습니다.* 공고코드는 키 값으로서 단순히 자료를 구분하는 데 사용됩니다. ** 시군구코드는 행정표준코드관리시스템(https://www.code.go.kr)에서 관리하는 표준코드를 그대로 따르므로, 해당 웹페이지 > 법정동 > 법정동 코드에서 조회하여 법정동명을 확인하여 주시기 바랍니다.
