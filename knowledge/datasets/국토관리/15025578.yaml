summary_user: 전남광주통합특별시 광주지역(5개구)의 용도지역을 주거·상업·공업·녹지·관리·농림지역과 그 세분별로 나눠 지정면적(제곱킬로미터), 구성비, 시행령·조례상 건폐율과 용적률을 담은 집계표로, 필지나 건물 단위 원천자료가 아니라 약 1KB 분량의 작은 CSV 파일이다. 도시계획 담당자나 분석가가 '광주지역에서 제2종일반주거지역이 차지하는 면적과 비율은 얼마이고, 조례 용적률은 시행령 상한과 얼마나 다른가' 같은 질문에 답하거나 통합 도시계획의 기초 현황을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 용도지역 이름을 기준으로 맞춰 이어 써야 하며, 다른 지역 용도지역 현황이나 토지이용규제 자료와 비교할 때도 같은 방식으로 이름을 대조한다.
