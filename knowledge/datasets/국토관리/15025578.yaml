description_portal: 「국토의 계획 및 이용에 관한 법률」 제36조 및 같은법 시행령 제30조의 규정에 따라 결정된 전남광주통합특별시 광주지역(5개구)의 용도지역별 지정 현황 자료이다.본 데이터는 ｢2025 광주광역시 도시관리계획 재정비｣ 용도지역 자료와 이후 도시관리계획 결정(변경) 고시자료 및 도시계획통계현황 자료 등을 반영하여 작성하였으며, 주거지역ㆍ상업지역ㆍ공업지역ㆍ녹지지역ㆍ관리지역ㆍ농림지역별 지정면적과 구성비, 건폐율 및 용적률 등의 정보를 제공한다.용도지역 현황은 토지이용규제 확인, 도시공간구조 및 시가지 변화 분석, 주택공급과 산업입지 검토, 도시계획사업 입지 분석, 생활권 및 기반시설 계획, 전남ㆍ광주 행정통합에 따른 균형발전과 통합 도시계획 수립 등을 위한 기초자료로 활용될 수 있다.광주지역은 용도지역 전체 면적 중 도시지역은 95.8%, 비도시지역은 4.2%를 차지하며, 자연환경보전지역은 지정되어 있지 않다. 본 자료는 도시관리계획 결정(변경) 고시사항을 반영하여 장기적으로 현행화할 예정이다.
