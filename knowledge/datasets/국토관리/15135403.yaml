summary_user: 부산광역시 도시재생종합정보관리시스템에서 뽑은 도시활력증진개발사업과 16개 자치구군 자체 도시재생사업을 사업 한 건당 한 행으로 담은 CSV 파일(약 42KB)로, 사업관리번호·주소·사업개요와 국비·시비·구비별 소요예산, 사업주체·담당부서를 담는다. 연구자나 주민이 '우리 동네에서 어떤 도시재생사업이 어떤 예산 구성으로 추진됐나'를 확인하거나 자치구별 재생사업 예산 분담을 비교하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 주소를 행정구역명이나 좌표로 바꾸거나 사업주체(자치구명)를 이름으로 맞춰 다른 도시재생·행정구역 데이터와 잇는다.
description_portal: '부산광역시 도시재생종합정보관리시스템의 데이터로 도시활력증진개발사업 및 16개 자치구군에서 추진한 도시재생사업의 사업관리번호,주소,사업개등의 정보를 제공합니다.- 도시활력증진개발사업 : 지역발전정책에 따라 지자체 스스로의 발전을 유도하기 위해 도시활력증진지역에 해당하는 지자체에 국가가 예산을 포괄적으로 지원하여 시행하는 사업으로 도시생활환경 개선과 지역역량강화사업으로 구분하여 추진되었음. 현재는 우리동네살리기사업으로 추진되고 있음- 지자체 자체사업 : 부산광역시 16개 지방자치단체가 도시 및 지역재생을 위해 추진한 다양한 사업'
