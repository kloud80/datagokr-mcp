legal_basis_portal: 본 데이터는 「한국수자원공사법」 제9조(사업) 제1항 제2호 및 제5호에 따라, 한국수자원공사가 수행하는 국토의 효율적 개발 및 공공용지 공급과 관련된 사업 수행 과정에서 생성·관리되는 업무 정보이다.특히, 토지의 분양 및 임대 업무는 공사의 핵심 사업 중 하나로, 해당 업무의 원활한 수행과 대국민 서비스를 위한 행정정보로서 각 사업지구별 담당자 현황을 체계적으로 관리하고 있다.
