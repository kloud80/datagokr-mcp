summary_user: 한국수자원공사가 관리하는 수변·산업단지 사업지구별로 토지·잔지 분양과 산업단지 임대관리를 맡은 담당 부서, 담당업무, 사업지구명, 전화번호를 담은 소규모 명단 파일(CSV 약 1.8KB)이다. 특정 사업지구의 토지 분양이나 분양계약 상담을 문의하려는 사업자·국민이 '이 지구 분양은 어느 부서 누구에게 전화하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 분양 공고 데이터와는 사업지구 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국수자원공사가 관리하는 수변(단지) 사업지구별 토지 및 잔지 분양, 산업단지 임대관리 업무 담당자 정보를 정리한 자료이다. 소속 부서, 담당업무, 사업지구명, 연락처 항목으로 구성되어 있으며, 토지 분양 관련 민원 응대, 분양계약상담 등 대국민 서비스를 위한 참고 자료로 활용된다. 이용자는 특정 사업지구의 분양 관련 문의 시 담당자 정보를 신속히 확인할 수 있으며, 기관 간 협업 및 외부 행정업무에도 활용 가능하다. 해당 정보는 조직 개편 또는 인사 변동에 따라 수시로 변경될 수 있으므로, 최신 정보 확인을 권장한다. 데이터는 표준화된 CSV 형식으로 제공되며, 분양정보 제공 시스템(온라인청약시스템), 민원처리 포털 등 다양한 정보서비스와의 연계 활용도 가능하다.
