summary_user: 홍수특보가 발령되는 수위관측소별로 영향을 받는 전국 읍·면·동 단위 행정구역을 짝지어 담은 고정 매핑 파일이며, 포털에는 전체가 아닌 샘플 100건만 올라 있다. 재난 담당자나 분석가가 "이 수위관측소에 홍수특보가 나면 어느 동네가 영향권인가"를 확인하는 데 쓴다. 필드는 순번·수위관측소 이름·영향지역 세 개뿐이고 행정구역 코드나 관측소 코드 같은 전역 조인 키가 없으므로, 홍수특보 발령 정보나 수위관측소 제원과는 관측소 이름으로, 행정구역 자료와는 읍·면·동 이름 매핑으로 이어 쓴다.
description_portal: '기후에너지 환경부 한강홍수통제소의 AI 홍수예보시스템에서 홍수특보가 발령된 수위관측소를 기준으로 영향받는 전국 읍·면·동 단위 행정구역별 정보를 관리하는 데이터 항목이다.각 지점정보와 행정구역 정보를 포함하여 홍수특보지점 적용 범위를 체계적으로 제공하며, 홍수 대응, 재난 관리 활용된다. 이를 통해 지역별 홍수 위험 상황을 정확히 파악한다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
