summary_user: 대전광역시 개별주택가격을 100m 격자 단위로 집계해 구별로 묶은 집계 자료로, 기준 시점(년월)·격자코드·구·개별주택가격금액을 담은 CSV 파일(약 5.9MB)이다. 분석가가 대전시 안에서 개별주택가격이 어느 격자·구에 높게 또는 낮게 분포하는지, 지역 간 가격 격차가 어떤지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 100m 격자 체계를 쓰는 다른 격자 자료와는 격자코드로, 구 단위 통계와는 구 이름·구코드 매핑으로만 잇는다.
description_portal: 대전광역시 개별주택가격 격자단위 자료는 2021년 1월, 6월, 2022년 1월 기준으로 대전시 내 개별주택가격을 100m 격자 단위로 집계하여 구별로 통합한 자료입니다. 이 자료는 단독, 다가구 등 다양한 주택유형별로 가격 변동 현황을 포함하고 있으며, 각 격자별로 주택 수, 가격 수준, 지역별 분포 등 주요 정보를 제공합니다. 2022년 공공데이터 기업매칭지원사업을 통해 구축된 이 데이터는 주택가격의 공간적 분포와 지역별 격차, 가격대별 주택 분포 현황을 분석하는 데 활용될 수 있습니다.
