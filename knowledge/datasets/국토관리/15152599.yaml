summary_user: 안산맛집 홈페이지의 바고찌 게시판 글을 게시글 한 건 단위로 모은 파일로, 가게 이름과 동(게시글명), 조회수, 작성·수정일, 연락처, 주소, 업종(가게종류)을 담으며 범위는 안산시 한 곳이고 파일 크기는 약 1.5KB로 작습니다. 안산 주민이나 방문객이 '고잔동 근처에 조회수 많은 횟집이 어디인가'처럼 동네·업종별 식당을 찾을 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 가게 이름을 맞춰 보는 방식으로만 이어 쓴다. 예를 들어 일반음식점 인허가 자료와 주소로 대조하는 식이다.
limits: 조인 키가 없어서 다른 데이터와 연결하려면 가게 이름이나 주소를 직접 맞춰야 한다. 파일이 약 1.5KB로 작아 안산시 식당 전체를 대표하지 않는다. 조회수는 홈페이지 안에서의 관심도일 뿐 실제 방문이나 매출을 뜻하지 않는다.
