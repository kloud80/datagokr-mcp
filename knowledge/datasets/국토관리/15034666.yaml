description_portal: 부산광역시에 소재한 건축사사무소의 현황에 대한 데이터 입니다. 이 데이터는 2026년 6월 기준으로 수집된 것으로, 각 건축사사무소의 명칭, 소재지(도로명주소), 대표건축사, 신고번호 등의 기본 정보를 포함하고 있습니다. 건축사사무소는 건축 설계와 공사 감리 업무를 주로 수행하며,  건축 관련 법규 검토, 인허가 절차, 현장 관리 등 다양한 업무를 수행합니다. 일부 건축사사무소의 소재지 주소, 전화번호 등은 변경되어 최신 정보와의 차이가 있을 수 있으니 참고하시기 바랍니다. 본 자료는 부산시 내 건축사사무소 현황 파악 및 건축 관련 업무 진행 시 참고용으로 활용될 수 있습니다.
