summary_user: 제주특별자치도 도내 읍·면·동 아래 리·통 사무소(마을회관 등)를 한 곳씩 담은 목록으로, 읍면동·마을명과 주소·전화번호·팩스번호를 담는다. 주민이 우리 마을 리사무소 연락처와 위치를 찾거나, 분석가가 제주 지역 마을 단위 행정 거점 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 읍면동·마을명 이름 매칭이나 주소 지오코딩으로 이어 쓴다.
description_portal: 이 데이터셋은 2021년을 기준으로 제주특별자치도가 도내 읍·면·동 단위 아래 ‘리·통’ 사무소들의 주소와 전화번호를 정리하여 공개한 공공데이터이다. 제공기관은 제주도청 디지털혁신과이며, 데이터 형식은 CSV이다. 이 자료는 주민 행정 서비스의 최일선 거점에 대한 정보로서, 지역 주민의 행정 접근성 파악, 지자체 서비스망 점검, 커뮤니티 기반 정책 설계, 비상연락망 구축, GIS 행정지도 제작, 행정 서비스 분포 분석 등 다양한 행정 및 지역 계획 목적에 활용될 수 있다. 또한 민관 협력, 주민소통 채널 정비, 재난 대비 체계 설계, 지방행정 투명성 확보 등 지방자치 운영의 기초 인프라 정보를 제공한다.
