summary_user: 서울특별시 건축물대장에 딸린 오수정화시설 정보를 시설 한 건 단위로 담으며, 대지위치·자치구·법정동·지번·도로명주소와 처리 형식(부패탱크방법, 하수종말처리장연결 등), 1인당 처리용량과 총용량을 기록한다. 건축·환경 분석가나 구청 담당자가 "이 동네 건물 중 하수종말처리장에 연결되지 않고 정화조에 의존하는 곳은 어디이고 용량은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 건축물대장 데이터와는 대지위치·자치구·법정동·본번·부번 같은 주소 이름이나 건축물대장 일련번호(BDRG_SN)를 맞춰 이어야 한다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 인증키가 따로 필요하며 공공데이터포털 활용신청과는 별개다. 표준 코드형 조인 키가 없어 주소 문자열 매칭에 의존하므로 다른 데이터와 연결할 때 불일치가 생길 수 있다. 포털 설명에 따르면 일부 레코드는 1인당 처리용량이 비어 있고 총용량만 기록되어 있다.
