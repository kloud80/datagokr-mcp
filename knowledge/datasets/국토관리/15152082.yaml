description_portal: 이 데이터는 충청남도 천안시 관할 행정동별로 구분된 지목별 토지면적 현황을 체계적으로 수집·정리한 자료입니다.토지의 이용 목적에 따라 세분화된 지목(전, 답, 과수원, 목장용지, 임야, 광천지, 대지, 공장용지, 학교용지 등)에 대한 면적 정보를 포함하고 있으며, 2020년 1분기부터 2025년 3분기까지의 시계열 데이터를 제공합니다.데이터는 천안시 각 행정동별로 주기적으로 갱신된 정보를 집계하여,지목별 토지 이용 구조를 분석하거나 토지정책, 도시계획, 환경·농업 정책 수립에 활용할 수 있도록 구성되었습니다. 또한 AI 학습용 데이터셋으로 활용 가능한 수준의 데이터량과 구조적 일관성을 갖추고 있습니다.이 데이터는 행정동명(천안시 관할 내 행정동 단위 구분), 분기(데이터 수집 시점 구분), 지목(전, 답, 과수원, 목장용지, 임야, 광천지 등), 면적(㎡ 제곱미터 단위) 등의 내용을 담고 있습니다.
