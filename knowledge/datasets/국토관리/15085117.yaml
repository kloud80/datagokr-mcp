description_portal: '○ 통계개요* 통계명 : 1인당 거주면적* 통계종류 : 서울시 인구 1인당 거주면적을 제공하는 일반ㆍ가공통계* 작성목적 : 서울시 자치구별 주택평균 면적과 평균 가구원수 산출을 통해 1인당 거주면적을 파악, 주택관련 정책수립의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년) ※ 2007년 조사종료* 공표범위 : 지역 - 서울시 및 자치구, 내용 - 서울시 1인당 거주면적 등○ 기 타* 2008년부터 조사 항목에서 제외함제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4368)입니다.※ 바로가기 클릭 시 서울특별 열린데이터광장 개방 데이터로 이동합니다.'
