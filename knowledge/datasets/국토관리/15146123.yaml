summary_user: 서울특별시 건축허가·사용승인 과정에서 제출된 도면·신청서를 바탕으로 건축물의 층별 정보(지상·지하 구분, 층번호, 구조, 주용도, 층별 면적 등)를 층 단위 건별로 담는다. 개발사업자나 분석가가 특정 지번에 인허가된 건물의 층별 용도와 면적 구성을 확인하거나, 지역별 인허가 동향을 개발 흐름의 선행 지표로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 대지위치·시군구명·법정동명·본번·부번 같은 이름·지번 매핑이나 같은 기관의 인허가 대장 일련번호(PRMSN_LDGR_SN)로만 잇는다.
description_portal: 건축인허가 층별개요 데이터는 건축허가나 사용승인 과정에서 제출되는 도면 및 신청서 내용을 기반으로, 건축물의 각 층별 정보를 세부적으로 기록한 자료입니다. 여기에는 건축물의 주소, 지번, 지상·지하 구분, 층수와 층명, 해당 층의 구조 형식, 주용도 및 부수 용도, 층별 연면적 등이 포함됩니다. 이를 통해 건축 계획 단계에서 각 층이 어떤 용도로 쓰일지, 면적은 얼마나 되는지, 구조 안전성 확보를 위해 어떤 구조 방식을 채택했는지를 확인할 수 있습니다. 또한 주건축물과 부속건축물 구분, 면적 산정에서 제외되는 시설 여부 등 법적 검토와 설계 적합성 판단에 필요한 근거 자료로 활용됩니다. 도시계획, 용도변경 심사, 건축물의 인허가 절차 관리, 건물 규모 검토, 부동산 개발 및 사업성 분석에 있어 필수적인 기초 데이터입니다.
