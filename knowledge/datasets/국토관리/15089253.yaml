summary_user: 인천 부평구 안의 민방위 비상급수 음용수 시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 1KB)로, 행정동·시설종류(정부지원·지자체·공공용)·용도·주민 개방 여부·시설명·도로명/지번 주소를 담는다. 주민이나 구청 담당자가 단수·재난 때 우리 동네에서 주민에게 개방된 가장 가까운 비상 식수 시설이 어디인지 확인하는 데 쓴다. 공통 조인 키나 코드가 없어서, 다른 데이터와는 행정동 이름이나 주소를 지오코딩·문자열로 맞춰 연결해야 한다.
description_portal: '비상시 활용 가능한 음용수 공급 시설의 행정동, 시설종류, 용도, 개방 여부, 시설명, 주소 등을 수록한 데이터.정부지원·지자체·공공용으로 구분된 시설 현황을 파악하여 재난·재해 발생 시 안전한 음용수 공급 기반을 확보하고, 민방위 관리 및 생활안전 정책 수립에 활용 가능하다.활용 목적 및 특징– 행정동별 비상 음용수시설 분포 현황 분석– 시설종류별 운영 특성 파악– 용도 및 개방여부 기반 시설 활용도 평가– 도로명·지번주소를 통한 위치 확인 및 접근성 분석– 재난 대응, 민방위 관리, 안전한 생활용수 공급 정책 자료 활용주요 항목 설명● 연번: 데이터의 고유 번호● 행정동: 시설이 위치한 행정동 명칭● 시설종류: 시설 구분(정부지원, 지자체, 공공용)● 용도: 음용수 공급 목적 및 사용 용도● 개방유무: 주민 개방 여부● 민방위 비상급수시설명: 지정된 시설의 공식 명칭● 도로명주소: 시설의 도로명 주소● 지번주소: 시설의 지번 주소'
