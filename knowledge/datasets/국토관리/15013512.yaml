summary_user: 인천광역시 서구(서해구) 안 개별 단독주택의 공시가격을 주택 한 채 단위로 담은 파일로, 소재지·동번호·대지면적·건물연면적·산정면적과 결정가격, 기준일자를 담는다. 주택 소유자나 분석가가 "우리 집 단독주택의 올해 공시가격이 얼마이고 재산세·건보료 산정 기준이 무엇인가"를 확인하거나 구 내 단독주택 가격 분포를 볼 때 쓴다. 실측 컬럼에 필지고유번호(PNU) 같은 전역 조인 키가 없어, 다른 데이터와는 소재지 주소 문자열 매핑으로만 이어 써야 한다.
description_portal: 본 공공데이터는 인천광역시 서구에 위치한 개별 단독주택의 공시가격 정보를 담은 자료입니다. 본 자료는 주택소재지, 공시가격, 공시기준일 등으로 구성되어 있습니다. 본 공공데이터는 재산세, 종합부동산세 등 각종 지방세 및 국세 산정의 기준 자료로 활용될 수 있으며, 주택 소유자와 행정기관 모두 실질적인 부동산 관련 행정자료로 제공될 수 있을것으로 판단됩니다. 또한 공시가격 열람을 통해 권리 보호 등 다양한 도움이 될것으로 판단됩니다. 본 데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
