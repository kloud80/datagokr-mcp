description_portal: 성남시 토지지목별 현황에 대한 데이터로, 소재지 및 토지지목(전,답,과수먹,목장용지,임야,광천,염전,대, 공장용지 등등) 항목으로 구성되어 있습니다. 시 전체 또는 행정동 단위로 구분된 토지의 지목(지적 목적상 토지의 용도 구분)별 면적 및 필지 수 등을 집계한 자료이다. 주요 지목으로는 전(밭), 답(논), 대(건축물 부지), 임야, 도로, 하천, 공장용지 등이 있으며, 도시계획 수립, 개발행위 심의, 보상계획 수립 등에서 기초 자료로 활용된다. 이 데이터는 성남시의 도시화 수준, 녹지율, 주거 및 상업용지 분포 등을 간접적으로 파악할 수 있게 해주며, 토지이용 정책 수립, 환경 관리, 재정 기반 확보를 위한 지방세 과세자료로도 중요하다.
