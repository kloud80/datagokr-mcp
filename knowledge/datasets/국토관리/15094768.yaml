summary_user: 제주특별자치도 내 외식업 이용자 수와 이용금액(백만 원 단위로 보이는 use_cost_by_million)을 기준연월·성별·연령대별로 묶은 집계 통계로, 포털 설명상 기간은 2019년 1월부터 2020년 12월까지다. 외식업 창업자나 지역경제 분석가가 '제주에서 어느 성별·연령대가 외식에 돈을 가장 많이 쓰고, 2019년과 2020년 사이 월별로 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월·성별·연령대 같은 이름 매핑이나 제주특별자치도의 다른 데이터로만 이어 쓴다.
description_portal: 이 데이터셋은 2019년 1월 1일부터 2020년 12월 31일까지 기간 동안 제주특별자치도 내 외식업체의 이용자 수와 이용금액을 성별 및 연령대 구분으로 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 자료는 CSV 형식으로 공개되어 있어 누구나 무료로 다운로드 가능하며, 외식 소비 규모 파악, 연령대 및 성별에 따른 소비 성향 분석, 지역 외식업 시장 구조 이해, 관광객 및 도민 소비 비교, 외식업계 매출 및 이용자 분석, 지역 경제/소비 패턴 연구 등에 활용될 수 있습니다. 다만, 집계 기간이 2019–2020년으로 제한되어 있고 이후 소비 트렌드 변화나 업종 구조 변화는 반영되어 있지 않을 수 있다는 점을 유의해야 합니다.
