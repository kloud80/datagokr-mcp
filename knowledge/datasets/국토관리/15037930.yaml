summary_user: 경기도 이천시 안의 지식산업센터를 건물(센터) 한 곳당 한 행으로 담은 파일로, 지번·도로명 주소와 위도·경도, 용도지역, 부지·건축·공장시설면적, 층수, 유치 가능·입주 업체 수, 공사진행상황과 허가·착공·사용승인 일자를 포함한다. 이천에서 입주할 지식산업센터를 찾는 사업자나 산업입지를 검토하는 담당자가 '어느 센터가 준공됐고 입주 여유가 얼마나 남았는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 센터명·주소 매칭이나 좌표로 이어 쓰며, 건축물대장과 붙이려면 주소로 건물을 찾아 연결해야 한다.
description_portal: 경기도 이천시 내 지식산업센터의 입지, 공간 구성, 입주 현황 등을 정리한 데이터입니다. 항목은 센터명, 주소(지번·도로명), 위도·경도, 용도지역, 부지면적, 건축면적, 층수, 공장시설면적, 입주·유치 가능 업체 수, 공장동수, 공사진행상황, 허가일자, 착공일자, 사용승인일, 기준일자 등으로 구성됩니다. 본 데이터는 산업입지 정책 수립, 입주 수요 분석, 건축물 용도 분석, 산업시설 개발계획 수립, 기업지원 시설 현황 조사 등 다양한 공간·산업 행정업무에 활용됩니다. 특히 공간정보와 허가일정 정보는 입지 조건 평가, 사업 승인 절차 관리, 입주 기업 유치 전략 수립에 기초자료로 활용됩니다.
