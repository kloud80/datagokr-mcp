summary_user: 서울특별시가 2015~2017년에 고시한 부동산 시가표준액표를 게시물 단위(제목·등록일·첨부 링크·내용)로 담은 외부 파일 목록이며, 선박·항공기·회원권 시가표준액표도 포함한다. 납세자나 세무 담당자가 해당 연도의 지방세 과세 기준이 된 건물·기타 물건의 시가표준액표를 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·물건 이름을 직접 맞춰 연결해야 한다.
description_portal: '2015~2017년 부동산 시가표준액표 제공 (선박,항공기,회원권 포함)2018년 이후 데이터는 서울시청 홈페이지>행정>자료실>세금>시가표준액표(건물,기타)에서 제공(http://news.seoul.go.kr/gov/statutory_standard_price#list/1)용어설명 : 부동산 시가표준액은 국세·지방세 등을 부과할 때 기준이 되는 정부가 고시한 부동산의 가격을 말합니다. 실제 거래가(시가)가 아니라 세금 부과 목적으로 정한 ‘공적 가격’입니다제공부서는 서울특별시 재무국 세제과(02-2133-3377) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
