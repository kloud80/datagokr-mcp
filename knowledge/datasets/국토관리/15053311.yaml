summary_user: 부여군 관내 농공단지(은산·임천·장암·홍산 등)에 입주한 기업을 한 행에 한 곳씩 담은 건별 명단으로, 소속 단지명·기업명·도로명/지번 주소·설립일자·종업원수·전화번호를 담는다(시군구 범위, 약 8KB CSV 파일). 구직자나 영업 담당자가 '부여군 어느 농공단지에 어떤 기업이 있고 고용 규모가 큰 곳은 어디인가'를 확인하거나, 분석가가 단지별 기업 업력·고용 분포를 볼 때 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어, 공장 등록 현황이나 산단 통계와는 기업명·단지명·주소를 맞춰 이어야 한다.
