summary_user: 경상북도 성주군이 허가한 태양광 발전사업을 발전소 한 곳당 한 행으로 담은 파일로, 발전소명·설치장소(도로명·지번 주소)·허가용량·허가일·사업개시일을 담는다(CSV 약 23KB). 성주군 안에서 어느 읍면에 태양광 발전소가 얼마나 허가됐고 실제로 사업을 시작했는지 확인하려는 주민·사업자·에너지 분석가가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 주소를 지오코딩하거나 발전소명·지역명을 맞춰 붙이는 방식으로 이어 쓴다.
limits: 표준 코드(법정동코드, 사업자번호 등)가 없어 다른 데이터셋과 바로 조인할 수 없고, 주소나 이름을 맞추는 작업이 필요하다. 범위는 성주군 한 곳뿐이므로 다른 시군과 비교하려면 각 지자체 자료를 따로 모아야 한다.
