summary_user: 경상남도 합천군에 조성된 산업 농공단지를 단지 한 곳당 한 행으로 정리한 소규모 현황표(CSV 652바이트)로, 위치·면적·입주업체 수·업종·분양 상태와 특정수질 유해물질 배출업체 유무(비고)를 담는다. 합천군에 공장 입지를 찾는 중소 제조업체나 지역 산업 분석가가 "합천의 어느 농공단지에 어떤 업종이 몇 곳 입주해 있고 분양 여지가 있는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황·경계도면과는 단지명 매칭으로만 이어 쓴다.
description_portal: '본 데이터는 합천군이 농어촌지역의 재정자립과 지역주민의 현지 취업을 도모하기 위해 조성된 산업 농공단지에 대해 각 농공 단지의 위치, 면적, 입주업체 수, 입주 업종, 분양 상태, 비고(특정수질 유해물질 배출업체 존재 유무) 등에 대한 정보를 제공하고 있습니다.산업농공단지 : 산업농공단지는 농촌 지역 또는 중소도시 인근에 조성된 중소기업 중심의 산업단지로, 지역 경제 활성화와 균형 발전을 목적으로 구축된 특수 목적 단지로 농촌지역의 인구 유입과 고용 창출, 농촌 산업 기반 강화, 중소 제조업체의 육성을 목표로 두고 운영'
