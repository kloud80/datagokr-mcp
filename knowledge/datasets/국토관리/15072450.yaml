description_portal: 한국토지주택공사 판매 및 분양정보 중  2018~2021년 가정어린이집 공고 내역 (지역본부, 공고명, 사업지구, 공급용도, 공급예정금액 등) 의 데이터를 제공합니다. 모집공고기준일과 청약센터공고게시일은 같은 데이터값을 가지는게 일반적이며, 계약기간개시일과 계약기간종료일은 일반적으로 같은 데이터값을 가지나 공고에 따라 1~2달 정도의 차이값을 가지게 됩니다. 관련 공고에서 계약금은 임대보증금의 20%에 해당하는 값을 가지며 월임대료는 40~70 사이의 값을 납부합니다. 시흥장현B1 지역이 7세대로 가장 많은 어린이집 공급을 진행하였습니다.
