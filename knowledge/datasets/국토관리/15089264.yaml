summary_user: 서울시 하천수위관측소에서 송신한 보정 전 원시 수위값을 수신 시각별 한 행에 관측 지점(계성교·고덕천·도림교·탄천2교 등 30여 개 지점)을 열로 늘어놓은 와이드형 시계열 파일로 담고, 포털 설명상 지점별 최초 관측 시기부터 2023년까지의 수방기간(5월 15일~10월 15일) 자료입니다. 분석가나 방재 담당자가 '집중호우 때 도림천·탄천 등 서울 소하천 수위가 몇 시에 얼마나 올랐나'처럼 과거 홍수 사례의 지점별 수위 변화를 되짚는 데 쓴다. 실측 컬럼에 관측소코드 같은 전역 조인 키가 없어, WAMIS·홍수통제소 관측 자료나 강수 자료와는 지점명(교량·하천명)을 손으로 매핑하고 수신 시각으로 맞춰 이어 쓴다.
description_portal: '해당 데이터는 서울시 하천 수위 관측 자료입니다.ㅇ 서울시 하천수위 : 20개소ㅇ 제공기간 : 지점별 최초관측시기~2023년 (5월15일~10월15일)ㅇ 참고사항 : 본 자료는 홍수, 태풍 등 기상현상에 따른 자연재해를 막기 위한 목적으로 하천수위관측소에서 송신한 원시자료로써 보정하지 않은 자료입니다. 측정기기의 오작동, 자치구 운영환경 등으로 인해 자료에 오차가 있을 수 있으며, 특히 수방기간(5.15~10.15) 이외에는 시설 점검 및 내부공사 등으로 자료 수집이 부정확할 수 있습니다. 해당 자료 사용 시 이 점을 참고하시기 바랍니다.'
