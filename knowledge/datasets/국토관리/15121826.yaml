description_portal: '이 데이터는 침수 방지 및 도시 배수 기능을 위한 배수펌프장의 시설 현황을 정리한 자료입니다. 각 펌프장은 설치 구분(기존/신설), 위치, 수전설비 및 발전설비의 전압과 용량, 계약전력, 배수능력, 안전관리 인력 현황 등을 포함하고 있으며, 도시 인프라의 방재 및 배수관리 체계를 평가하고 계획하는 데 활용됩니다. 특히 전력 관련 설비 정보와 전기안전관리자 배치 현황이 함께 수록되어 있어 유지관리 체계 점검 및 재해 대응계획 수립에도 유용합니다. 데이터는 총 13개 컬럼으로 구성되어 있으며, 기준일은 2025년 8월 18일입니다.번호: 데이터에 기록된 배수펌프장의 일련번호입니다.시설명: 해당 펌프장의 명칭입니다.위치: 펌프장이 설치된 주소입니다.설치구분: 기존 설치 여부 또는 신설 여부를 나타냅니다.설치년도: 해당 펌프장이 설치된 연도입니다.수전전압(V): 외부 전원을 공급받는 전압 수치입니다.수전설비 용량(KW): 수전 설비의 최대 전력 용량입니다.발전전압(V): 자체 발전설비의 전압입니다.발전설비 용량(KW): 자체 발전설비의 최대 출력 용량입니다.계약 전력합계(KW): 계약된 총 전력 사용량입니다.용량: 펌프의 배수 능력 또는 물 처리량입니다.전기안전관리자: 해당 시설의 전기안전관리 책임자 구분입니다.비고: 기타 특이사항이 기재된 항목입니다.'
