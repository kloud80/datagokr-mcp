summary_user: 대전광역시 서구에서 분뇨를 수집·운반하는 허가 업소를 업소별로 한 줄씩 담은 목록으로, 업소명·도로명/지번 주소·허가일·영업상태·기준일자를 담는다(파일 크기 435바이트의 소규모 CSV). 서구 주민이나 건물 관리자가 '우리 동네 정화조 청소를 맡길 수 있는 영업 중인 분뇨수거 업체가 어디인가'를 확인하거나, 분석가가 지역 분뇨수집운반업 허가 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소 문자열을 매핑하는 방식으로만 이어 쓴다.
description_portal: 대전광역시 서구 관내에서 분뇨를 수집·운반하는 업소에 대한 정보는 개인하수처리시설 및 분류식 하수관로 중 오수가 흐르는 하수관로의 내부청소를 포함한 분뇨 수집·운반업 영위 업소를 대상으로 하며, 이와 관련된 주요 항목으로는 업소명(사업자 등록상 상호), 도로명주소(「도로명주소법」에 따른 표준 주소), 지번주소(구주소 체계의 번지 주소), 허가일자(관할 행정기관으로부터 영업허가를 받은 일자), 영업상태(현재 영업 중, 폐업, 휴업 등 행정상 등록 상태)가 포함됩니다. 이 정보는 공중위생관리 및 환경정책 수립, 민원 대응, 공공데이터 활용 등을 목적으로 수집·활용될 수 있으며, 정기적인 갱신 및 행정기관 확인을 통해 정확성이 확보되어야 합니다. 분뇨수집운반업은 화장실, 정화조, 오수처리시설 등에서 발생하는 분뇨를 수집하고, 이를 처리시설까지 운반하는 사업으로 환경, 위생과 직결되는 업종이며 지방자치단체의 허가를 받아야 합니다.
