summary_user: 경기도 광주시 도시계획정보시스템에 등록된 지구단위계획구역을 구역(도형) 한 건씩 담은 파일로, 구역 명칭(라벨명), 면적, 경계 길이, 등록 일시를 시군구 단위로 제공한다. 광주시 안에서 특정 지역이 지구단위계획구역에 들어가는지, 어떤 구역이 얼마나 넓은지 확인하려는 주민·개발사업자·도시계획 분석가가 쓴다. 전역 조인 키는 없으며, 시군구코드나 구역 명칭으로 같은 기관의 다른 도시계획 데이터(결정조서·획지 등)와 맞춰 잇는다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 지구단위계획구역 현황 정보를 제공합니다. 토지 이용을 합리화하고 도시 기능을 증진시키기 위해 건축물과 그 밖의 시설을 체계적으로 관리하는 지구단위계획이 수립된 구역의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 구역을 고유하게 식별하며, 라벨명은 지구단위계획구역의 명칭을 나타냅니다. 면적은 구역이 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다.
