summary_user: 신고된 아파트 매매 거래를 건별로 담은 원천 데이터로, 계약일·거래금액(만원)·전용면적·층·단지명·매수자와 매도자 구분·해제 여부 등을 필드로 갖는다. 지역코드(법정동 앞 5자리)와 계약년월을 넣어 조회하며, 내 동네 아파트가 최근 얼마에 거래됐는지 알려는 국민이나 지역별 시세를 보는 분석가가 쓴다. 시군구 코드(sggCd, 키 sgg_cd)로 같은 키를 쓰는 다른 실거래·행정구역 데이터와 이어 쓰고, 단지명·법정동·지번은 키가 아니라 명세상 텍스트 필드다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월 6자리(예시 : 201801)로 해당 지역, 해당 기간의 아파트 매매 신고정보를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 아파트 매매 실거래가 자료를 제공하는 아파트 매매 실거래가 정보 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 아파트의 층정보만 제공되며, 소유권 이전등기 완료된 건에 한하여 동정보가 추가적으로 공개됩니다.'
