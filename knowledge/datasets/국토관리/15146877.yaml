summary_user: 민간임대주택에 관한 특별법에 따라 도시관리계획으로 결정된 용도지역지구 구역을 각 지방자치단체가 구축하고 국토교통부가 취합한 전국 범위의 공간 자료로, vworld에서 시도별 SHP 파일로 내려받는다. 사업자나 분석가가 특정 지역이 민간임대주택 관련 지구로 지정됐는지, 언제 고시됐는지(NTFDATE)를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정구역 코드(COL_ADM_SE)나 이름 매핑으로만 연결하며, 공간 중첩으로 필지·토지이용규제 자료와 겹쳐 본다.
limits: vworld 로그인 후 시도별 파일을 직접 내려받아야 하며 공공데이터포털 활용신청이나 API 인증키로는 받을 수 없다. 전역 조인 키가 없어 다른 데이터와 붙이려면 이름·코드를 따로 매핑해야 한다. 성격상 주택 시장 데이터보다 토지이용규제 데이터에 가까워 분류 이동이 제안된 상태다.
