summary_user: 경기도 화성시가 적용하는 상수도 요금 중 수도계량기 구경별로 사용량과 무관하게 고정 부과되는 정액요금(원)을 구경 구분과 기준일자와 함께 담은 작은 요율표 파일(CSV 339바이트)이다. 화성시 시민이나 사업자가 자기 계량기 구경에 매달 얼마의 기본요금이 붙는지 확인하거나, 분석가가 다른 지자체와 상수도 기본요금 체계를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 계량기 구경 이름을 맞추거나 같은 기관(화성시) 상수도 자료끼리만 이어 쓴다.
limits: 요율표만 담고 있어 실제 가구·사업장별 부과액이나 사용량별 요금은 알 수 없다. 공통 코드가 없어 타 지자체 요금표와 비교할 때는 구경 표기를 직접 맞춰야 한다.
