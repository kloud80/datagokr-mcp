description_portal: '전북특별자치도 전주시 내 부동산 중개업소 현황입니다. 등록번호, 상호, 소재지, 등록일자 등을 제공합니다.항목 : 등록번호, 상호, 소재시, 등록일자, 보증일자제공부서 : 도시계획과, 구청 민원봉사실전주시 내 부동산 중개업소 분포 현황을 파악 가능하며「공인중개사법」에 따라 등록된 부동산 중개업소의 운영 현황을 제공하는 데이터입니다.신뢰할 수 있는 중개업소를 확인하고 안전한 부동산 거래를 할 수 있도록 지원합니다.또한 지역별 부동산 중개업소 분포 분석과 부동산 행정 및 정책 수립을 위한 기초자료로 활용됩니다.'
