summary_user: 경상남도와 도내 시군의 주택전세가격지수를 연월별로 담은 집계 파일이며, 포털 설명에 따르면 통계청 자료를 정제했고 행정동코드·연월·지수로 구성된다. 전세를 구하거나 임대 사업을 하는 사람, 분석가가 경남 특정 시군의 전셋값이 기간에 따라 어떻게 오르내렸는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고 행정동 코드북(시도·시군구·읍면동명, 생성·말소일자)이 함께 오므로, 다른 데이터와는 지역명 매핑으로 연결한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 주택전세가격지수 데이터는 경남빅데이터허브플랫폼 DB 내에서 관리하고있는 경상남도 및 시군의  주택전세가격지수에 대한 정보입니다. 출처는 통계청이며 정제하여 플랫폼에 제공하고 있습니다.(데이터 구성 및 세부항목)  주택전세가격지수 데이터는 행정동코드, 연월, 주택전세가격지수로 구성됩니다. 행정동코드에 대한 설명은 코드북을 활용하여 주시기 바랍니다.(데이터 현행화 시기) 해당 데이터는  1회성 데이터며 현행화 하지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼-데이터분석-경남도정현황을 참고하여 주시기 바랍니다.
