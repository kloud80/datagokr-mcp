summary_user: 전국 국가·일반·도시첨단산업단지와 농공단지의 위치와 경계를 단지별 다각형 도형(SHP)으로 담은 공간 원천 자료로, 단지 식별번호·단지명·단지 유형·고시 정보 등의 속성이 함께 들어 있다. 기업이나 분석가가 '후보 부지 주변에 어떤 산업단지가 있고 경계가 어디까지인가'를 지도 위에서 확인하거나 산업단지 입지 특성을 공간분석할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 전국산업단지 표준데이터나 산업단지 일반현황과는 단지명 매칭이나 같은 기관의 단지 코드(DAN_ID)를 대조하는 방식으로 이어 쓴다.
limits: 포털 활용신청이나 API가 아니라 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 SHP 파일을 직접 받아야 한다. 전역 조인 키가 없어 다른 산업단지 자료와 붙일 때는 이름이나 코드 매핑을 직접 검증해야 한다.
