summary_user: 부산광역시 도시계획정보시스템(UPIS)의 용도지역 승인·결정조서 내역으로, 용도지역별 기정 면적, 증감 구분, 변경 면적, 변경 후 면적, 구성비율, 비고를 담는다. 도시계획 분석가나 부동산 사업자가 부산시 용도지역 결정·변경으로 면적이 얼마나 늘거나 줄었고 전체에서 차지하는 비율이 어떻게 바뀌었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용도지역 이름 매핑이나 같은 기관(부산광역시) 기준으로만 이어 쓴다.
description_portal: 도시계획이란 도시의 바람직한 미래상을 정립하고, 이를 시행하려는 일련의 과정을 말합니다. 우리나라는 급속한 산업화와 도시화로 경제성장을 이루었지만, 인구의 도시집중에 따른 과밀화와 도시의 무질서한 확산 등 각종 도시문제가 발생하였습니다.도시의 장래 수준을 예측하여 바람직한 미래상을 설정하여 여기에 맞게 규제나 유도정책 혹은 정비수단 등을 통하여 도시를 건전하고 적정하게 관리해나가는 수단입니다.이를 위한 부산광역시 도시계획정보시스템(UPIS) 용도지역 승인 및 결정조서 내역을 제공하는 데이터로 면적기정값, 면적변경값, 구성비율 등의 자료를 제공합니다.
