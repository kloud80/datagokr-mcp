summary_user: 스마트공장을 구축한 중소·중견기업 가운데 청년구직자 일자리 체험단에 참여한 기업을 기업 한 곳당 한 행으로 담은 전국 단위 CSV 파일(약 20KB)로, 참여연도·기업명·대표자·사업자번호·주소·업종·협약인원이 들어 있다. 청년구직자나 취업지원 담당자가 "우리 지역에서 스마트공장 체험을 받아 준 기업은 어디이고 몇 명을 받았나"를 확인하거나, 분석가가 업종별·연도별 협약인원 분포를 볼 때 쓴다. 실측상 전역 조인 키로 확인된 컬럼은 없어서, 공장등록·기업 정보와는 사업자번호나 기업명을 직접 맞춰 연결해야 한다.
description_portal: 스마트공장 보급확산사업의 실효성을 높이고 청년구직자에게 실무경험을 제공하기 위한 사업으로 청년구직자를 대상으로 일자리 체험 기회를 제공한 스마트공장 구축 기업의  업종과 협약인원수에 대한 정보를 제공(기업명, 사업자번호, 참여인원)스마트공장 보급확산사업은 특히 청년 실업률 증가와 지역 일자리 불균형 같은 사회적  문제를 해소하는 데 중요한 역할을 합니다. 참여기업은 스마트공장을 구축한 중소 중견기업으로, 업종 특성에 맞는 다양한 직무경형을 제공합니다. 이를 통해 청년들은 AI 빅데이터 기반 제조혁신과 같은 최신기술을 현장에서 직접 배우게 됩니다. 기업입장에서는 청년 인재와의 협업을 통해 인력난 해소와 혁신 역량 강화라는 효과를 얻습니다.
