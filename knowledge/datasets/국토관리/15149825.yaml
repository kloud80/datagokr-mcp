description_portal: 주택도시보증공사의 임대보증금보증(사용검사 후_법인)(임대사업자가 임대차게약에 따른 임대보증금을 임차인에게 반환하지 않았을 때 공사가 임대차보증금의 반환을 책임지는 상품으로, 임대사업자는 「민간임대주택에 관한 특별법」 제49조에 따라 의무 가입하여야 함)에 대한 데이터로, 해당 상품에 대한 발급세대수와 발급금액 데이터를 포함하고 있습니다.데이터 세부내역의 경우 2020년 이후 연도별 발급실적을 포함하고 있으며, 향후 연도별로 현행화하여 제공할 예정입니다.해당 상품과 관련된 자세한 사항(보증개요, 보증요건, 신청서류 양식 등)은 HUG 홈페이지(https://www.khug.or.kr/index_hug_in.jsp) > ‘임대보증금보증 소개’를 통해 확인하여 주시기 바랍니다.
