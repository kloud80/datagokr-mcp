summary_user: 제주특별자치도 안의 가축분뇨 처리시설을 시설 한 곳당 한 행으로 담은 작은 파일(약 1.2KB CSV)로, 구분·행정시·업체명·소재지·시설용량(톤)·준공년도를 담는다. 축산 민원이나 환경 정책을 보는 분석가가 "제주시와 서귀포시에 공공·자원화 분뇨처리시설이 어디에 있고 처리용량은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 행정시 이름이나 소재지 주소를 맞춰 이어 쓴다.
description_portal: '제주특별자치도 내에 소재 하고 있는 분뇨처리시설과 관련한 데이터를 제공합니다.항목: 구분, 소재지, 시설용량 등*「가축분뇨의 관리 및 이용에 관한 법률」에 의거하여 관리됨- 처리시설: 가축분뇨를 자원화 또는 정화하는 자원화시설 또는 정화시설- 공공처리시설가. 지방자치단체의 장이 설치하는 처리시설나. 「농업협동조합법」 제2조에 따른 조합 및 중앙회가 설치하는 자원화시설 자세한 사항은 제주상하수도본부 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jejuwater/square/open-reference.htm'
