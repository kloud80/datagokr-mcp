description_portal: '공무원연금공단이 관리하는 공무원임대주택 입주자가 임대보증금과 월임대료 비율을 선택할 수 있도록(임대보증금 전환 제도) 마련된 임대료 조견표입니다.본 데이터는 관할 지부, 지역, 단지명, 전용면적(㎡)을 기준으로, 임대보증금 구분(%) 비율에 따라 달라지는 임대보증금과 월임대료를 상세히 안내합니다.입주자는 전세(보증금 100%, 월임대료 0원) 형태부터 보증금을 낮추고 월임대료를 납부하는 형태까지 다양한 임대 조건을 선택할 수 있습니다.공무원 입주자가 본인의 자금 계획에 맞게 임대 조건을 설정하는 데 활용할 수 있으며, 자세한 내용은 입주공고에서 확인할 수 있습니다.(금액단위 : 천원)'
