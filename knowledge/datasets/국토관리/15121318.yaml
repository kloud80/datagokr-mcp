description_portal: 음성군 도시계획 시설 관련 엑셀데이터는 도시계획 시설 정보를 체계적으로 관리하기 위해 구성된 자료입니다. 연번은 데이터의 순서를 나타내며, 시스템명은 해당 데이터가 속한 관리 시스템을 구분합니다. 논리데이터베이스명은 데이터 구조상 논리적 구분을 의미하고, 물리데이터베이스명은 실제 저장되는 물리적 데이터베이스를 지칭합니다. 영문테이블명과 한글테이블명은 각각 테이블의 영문 및 한글 명칭을 기록하여 국내외 활용을 지원합니다. 영문 컬럼명과 한글 컬럼명은 테이블 내 세부 항목을 영문과 한글로 병기하여 데이터 이해도를 높입니다. 공개여부는 해당 데이터가 외부에 공개 가능한지 여부를 표시하며, 데이터기준일자는 자료의 최신성과 기준 시점을 확인하는 데 활용됩니다. 이 데이터는 도시계획 시설의 투명한 관리와 효율적 운영을 지원하는 핵심 자료입니다.
