summary_user: 원주시가 도시계획위원회 심의·결정에 따라 낸 도시계획 고시를 고시 한 건씩 담은 파일로, 고시번호·고시일자·고시제목·고시내용이 들어 있다(csv 약 433KB). 원주시에서 토지를 사거나 개발을 검토하는 시민·사업자가 '이 지역에 용도지역 변경이나 지구 지정, 개발행위 제한 같은 관리계획 결정이 언제 고시됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 고시제목 속 지명·사업명을 이름으로 맞추거나 같은 원주시 데이터끼리 연결해야 한다.
description_portal: 이 데이터는 강원특별자치도 원주시의 도시 계획 관련 고시 정보를 투명하게 공개하여, 시민들에게 토지 이용 및 부동산 개발에 관한 공적 정보를 제공하고 예측 가능한 도시 관리를 지원하기 위해 구축되었습니다. 해당 기관에서 도시계획위원회 심의 및 결정에 따른 고시 정보를 공적 자료를 통해 수집하고 정제했습니다. 이 정보는 토지의 용도 변경, 지구 지정, 개발 행위 제한 등 시민의 재산권에 영향을 미치는 주요 행정 사항을 명확히 파악하는 데 필수적입니다. 모든 정보는 고시 발생 시점에 맞춰 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있습니다.
