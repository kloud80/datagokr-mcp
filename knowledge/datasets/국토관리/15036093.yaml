summary_user: 충청북도 증평군이 「국토의 계획 및 이용에 관한 법률」에 따라 허가한 개발행위(토지형질 변경, 건축물 설치 등)를 필지 단위 건별로 담은 파일로, 소재지(도·군·리·번지), 지목, 지적·허가 면적, 용도지역, 개발행위명과 목적을 기록한다. 증평군의 어느 리에서 어떤 용도지역 토지에 어떤 목적의 개발행위가 얼마나 허가됐는지를 보려는 도시계획 담당자나 난개발 여부를 점검하는 분석가, 인근 토지 개발 동향을 확인하려는 주민·사업자가 쓴다. 표준 조인 키(법정동코드·PNU 등)가 없어 다른 토지·건축 데이터와는 리 이름과 번지를 맞추거나 같은 기관(증평군) 단위로만 이어 쓴다.
limits: 전역 조인 키가 없어 필지 단위 결합은 리·번지 문자열 매핑에 의존하므로 표기 차이로 누락이 생길 수 있다. 범위는 증평군 한 시군구에 한정되며, 명세상 연간·이벤트 주기라 수시 허가 현황을 실시간으로 반영하지 않는다.
