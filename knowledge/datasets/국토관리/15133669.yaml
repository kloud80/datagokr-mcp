summary_user: 경기주택도시공사가 분양하는 업무·산업시설용지, 단독주택용지, 준주거·숙박·종교용지 등 공급 토지를 필지 단위로 정리한 원천 목록 파일이다. 개발지구, 토지구분·용도, 주소와 본지번·가지번별 면적, 총면적, 개발 준공 예정일과 준공일을 담는다. 청약자나 사업자는 "경기도시공사가 분양하는 특정 개발지구의 단독주택용지는 어디에 있고, 면적과 준공 시점은 언제인가" 같은 실수요 검토에 쓰고, 분석가는 용도별 공급 토지 규모를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·지번 문자열을 매칭하거나 같은 기관 데이터의 개발지구번호로만 연결한다.
description_portal: 업무시설용지, 산업시설용지, 단독주택용지, 준주거용지, 숙박시설용지, 종교용지 등 경기주택도시공사에서 공급하는 토지의 분양을 위한 경기주택도시공사 토지분양시스템의 메타데이터 기반 공급 토지에 대해 분양을 위한 기본 정보를 제공하는 데이터로써 개발지구번호, 토지구분, 토지용도, 주소, 본지번, 본지번면적, 가지번, 가지번면적, 총면적, 개발준공예정일, 개발준공일 등의 정보를 포함하고 있습니다. 각 토지의 위치와 크기, 용도 등 기초정보를 체계적으로 정리하여 분양공고나 분양심사 시 기초자료로 활용됩니다. 또한 청약자의 실수요 검토와 공사 내부의 공급계획 수립 및 사업 분석에도 활용됩니다.
