summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)에 등록된 농림지역 용도지역 도형을 한 건씩 담은 파일로, 도형마다 공간정보관리번호, 영역 좌표 최솟값·최댓값, 라벨명, 면적·길이, 현황도형관리번호가 들어 있다(데이터 기준일 2024년 7월 19일, 범위는 진안군 한 곳). 진안군에서 어느 구역이 농림지역으로 지정돼 있고 그 면적이 얼마인지 확인하려는 토지 소유자·사업자·분석가가 쓴다. 실측 컬럼에 다른 데이터와 묶을 전역 조인 키가 없어, 같은 기관의 다른 용도지역 현황 파일과는 라벨명이나 관리번호를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 농림지역 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 라벨 명, 면적(도형), 길이(도형), 현황 도형 관리 번호 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.
