description_portal: '데이터는 건축사법 제23조(건축사사무소개설신고 등) 및 동법 시행령에 근거하여, 전북특별자치도 내 14개 시·군(전주시, 군산시, 익산시 등)에서 정식 신고 후 운영 중인 건축사사무소의 전수 현황을 신규 제공합니다. 도민의 알 권리를 보장하고 건축 행정의 신뢰도를 제고하기 위해 작성되었습니다.주요 항목으로는 전북특별자치도 내 사무소의 명칭(사무소명), 위치 확인을 위한 소재지 주소, 연락 가능한 전화번호, 그리고 해당 사무소를 책임지고 운영하는 신고 건축사 정보가 포함되어 있습니다. 도내 건축 행정의 투명성을 높이고, 건축 설계 및 감리 업무를 필요로 하는 도민들이 신뢰할 수 있는 전문가 정보를 쉽게 찾을 수 있도록 돕고자 제작되었습니다. 도민들에게 검증된 건축 전문가 정보를 제공하여 건축 설계 및 감리 서비스의 접근성을 높이고, 지역별 건축사 분포 분석을 통한 행정 정책 수립 기초 자료로 활용될 수 있습니다. 기준일자 2026.04.06 입니다. 제공형식 CSV 입니다.  주의사항: 건축사사무소의 신규 개설, 이전, 폐업, 휴업 등의 신고가 수시로 발생하므로, 시스템 반영 시차에 따라 실제 현황과 일부 차이가 있을 수 있습니다. 본 자료는 참고용으로만 제공되며, 인허가 신청이나 계약 등 법적 효력이 필요한 중요 사안은 반드시 해당 전북특별자치도청 주택건축과(063-280-4390)에 유선 확인을 거치시기 바랍니다.'
