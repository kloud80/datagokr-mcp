summary_user: 한전KDN 본사와 전국 각 지역본부 청사를 한 행씩 담은 건별 목록으로, 주소·지상층·지하층·승강기 수량·주차 대수·연면적(제곱미터)을 담는다(csv 742바이트의 소규모 파일). 공공기관 시설을 조사하는 분석가나 방문객이 '한전KDN 각 지역본부 청사는 어디에 있고 주차는 몇 대 가능한가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 청사 이름(구분)을 매핑하거나 같은 기관 데이터끼리만 연결한다.
