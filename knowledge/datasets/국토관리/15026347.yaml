summary_user: 부산광역시 중구 관내 가로수를 도로 노선별 한 행으로 정리한 집계 표로, 노선·도로명 주소·구간 시점과 종점·식재 간격(m)과 왕벚나무·은행나무·팽나무 등 수종별 주수를 담는다. 구청 녹지 담당자나 도시계획 분석가가 '중구의 어느 도로에 어떤 수종이 몇 그루 심겨 있는가'를 확인하고 유지관리·신규 식재 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 노선명이나 도로명 주소를 이름으로 맞춰 연결해야 한다.
description_portal: 부산광역시 중구 가로수 현황에 대한 데이터로, 가로수의 위치정보, 노선별 구간시점 및 구간종점, 식재간격, 수종, 주수 등 가로수 관리에 필요한 기본 정보를 제공합니다.본 데이터는 중구 관내 도로별 가로수 관리 현황을 파악하고 체계적인 유지관리 및 신규 식재 계획 수립에 활용하기 위해 구축되었으며, 노선별 수종 구성 및 주수 현황을 기준으로 작성되었습니다.또한 2024년 신규 조성된 북항 재개발 1단계 구역 가로수 식재 내용이 반영되어 최신 현황으로 정비되었으며, 해당 구역 가로수 이관에 따라 팽나무 등 405주가 추가되었습니다.2026년 2월 기준 중구 가로수는 총 16개 노선, 2,126주이며, 주요 수종은 은행나무입니다.본 데이터는 향후 가로수 식재 및 이관, 제거 등 변동 사항 발생 시 정기적으로 갱신됩니다.
