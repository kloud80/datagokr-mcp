legal_basis_portal: 「자연재해대책법」 제16조 및 시행령 제25조에 따라, 지자체는 수해 예방을 위한 방재시설(배수펌프장 등)의 설치·관리 현황을 지속적으로 파악해야 하며, 해당 정보는 「재난 및 안전관리 기본법」 제29조에 따른 지역 재난대응계획 수립 및 재난자원 관리의 기초자료로 활용됨.또한 국가재난정보관리시스템(NDMS) 및 통합방재시스템 등과 연계되어, 침수 등 재난 발생 시 신속한 대응과 자원 배치, 피해 최소화를 위한 기반자료로 활용되고 있음.이에 따라 본 데이터는 법적 근거와 행정 수요에 의해 상시 보유·관리됨.
