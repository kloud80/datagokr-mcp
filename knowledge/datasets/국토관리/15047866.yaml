summary_user: 창원시 5개 구에 설치된 재난대응용 배수펌프장 10곳을 시설 1곳당 1행으로 담은 현황 파일(csv, 약 1.3KB)로, 펌프장명·주소·설치년도·설치목적과 모터·엔진 펌프 규모, 한전 전원공급방식, 비상발전기, 계약전력, 연간 사용전력량·전기요금을 기록한다. 호우·태풍 때 창원 도심의 어느 배수펌프장이 2회선 전원이나 비상발전기를 갖춰 정전에도 가동할 수 있는지, 시설별 연간 전기요금이 얼마인지 따지는 방재 담당자·분석가가 쓴다. 전역 조인 키가 없어 하천코드나 다른 하천·방재 데이터와는 펌프장명·주소를 이름 매칭하거나 같은 기관(창원시) 단위로만 이어 쓴다.
description_portal: 본 데이터는 경상남도 창원시 내 5개 구(의창구, 성산구, 마산합포구, 마산회원구, 진해구)에 설치된 총 10개 재난대응용 배수펌프장 시설의 상세 현황을 체계적으로 기록한 자료입니다.해당 데이터는 펌프장 명칭, 위치, 설치 목적, 펌프 규모, 전원 공급 방식, 비상발전기 설치 여부, 한전 계약전력, 사용 전력량, 월평균 전기요금 등 다양한 항목을 포함하여, 각 펌프장의 운영 실태를 다각도로 파악할 수 있도록 구성되어 있습니다.경상남도와 창원시는 이 자료를 기반으로 호우, 태풍 등 자연재난 발생 시 도심 내 우수 및 해수 역류로 인한 침수를 예방하기 위한 신속하고 효율적인 재난 대응체계를 구축하고 있습니다.특히, 재난 상황 발생 시 현장의 배수펌프장 가동 여부를 신속히 판단하고 자원 배치를 최적화하는 데 이 데이터가 핵심 역할을 하며, 전력 사용량과 운영 비용 분석을 통해 효율적인 시설 관리와 예산 편성에도 활용됩니다.또한, 정기적인 점검과 자료 갱신을 통해 최신의 정확한 정보 유지에 힘쓰고 있으며, 창원시와 유사한 지리·환경 조건을 가진 타 지자체의 배수펌프장 설치 및 관리 참고자료로도 사용됩니다.본 데이터는 재난 대응 관련 부서 및 관계기관 간 원활한 정보 공유와 협력을 촉진하고, 통합방재시스템과 연계되어 재난관리의 실효성을 높이는 데 기여하고 있습니다.
