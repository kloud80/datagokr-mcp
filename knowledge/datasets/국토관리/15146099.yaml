summary_user: 서울시 건축 인허가 정보를 필지 단위 한 행으로 담은 건별 원천 자료로, 대지 위치·시군구·법정동·지번과 대지면적·건축면적·연면적·건폐율·용적률·동 수·주용도·세대수, 그리고 건축허가일·착공 예정일·실제 착공일·사용승인일을 담는다. 분석가가 '최근 어느 자치구에서 공동주택 허가와 착공이 늘었는가'처럼 지역 개발 흐름을 앞서 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·법정동명·주부번 지번 같은 이름과 지번을 맞춰 연결해야 한다.
description_portal: 서울시 건축 인허가 호별 등록 정보를 행 단위로 정리한 자료입니다. 각 행은 하나의 필지를 나타내며, 대지 위치, 시군구명, 법정동, 대지구분, 주·부지번, 호별명세 일련번호 등 기본 식별정보와 건물 용도, 구조, 동 수, 연면적, 총세대수 등의 건축 세부정보를 담고 있습니다. 또한 승인일, 착공일, 사용승인일 및 해당 날짜의 사전 공고일 정보가 포함되어 건축 진행 단계의 흐름을 파악할 수 있습니다. 이 데이터는 지역별 개발 현황 분석, 인허가 절차 추적, 도시계획과 주거정책 수립을 위한 기초 자료로 활용할 수 있습니다.
