summary_user: 경기도 시군구별로 기준년월마다 주민등록 기준 총세대수와 1인·2인·3인·4인 이상 세대수 및 각 비율을 담은 집계 데이터다. 지자체 정책 담당자나 분석가가 '우리 시군의 1인 세대 비중이 다른 시군보다 얼마나 높고, 해마다 어떻게 늘고 있나' 같은 질문에 쓴다. 전역 조인 키는 없어서 시군코드(sigun_cd)·시군명으로 같은 경기도 시군 단위 자료와 이름·코드 매핑을 거쳐 이어 쓴다.
description_portal: 이 데이터는 경기도데이터분석포털 시스템이 보유한 경기도의 시군구별 주민등록 기준 세대 구성 현황을 담고 있으며, 기준년월을 기준으로 총세대수, 1인세대수, 2인세대수, 3인세대수, 4인 이상 세대수 등을 포함합니다. 시군코드와 시군명 항목을 통해 지역 단위 비교가 가능하며, 세대 구성 변화나 1인 가구 증가 추세, 4인 이상 세대의 비중 변화 등을 분석할 수 있습니다. 본 자료는 고령화, 청년 1인가구, 다자녀 정책 등의 사회적 이슈를 반영한 인구구조 분석 및 맞춤형 지역 정책 수립, 행정 서비스 수요 예측 등에 활용될 수 있습니다.
