summary_user: 진안군 도시계획정보시스템(UPIS) 건축물 주제도에서 건물(군)별 건폐율과 그 공간 범위(X·Y 좌표 최소·최대값), 필지고유번호(PNU)를 담은 건별 파일로, 범위는 진안군 한 개 시군구의 필지·건물 단위다(CSV 약 898KB). 도시계획 분석가나 건축·개발 사업자가 '진안군에서 어느 필지의 건물이 대지를 얼마나 덮고 있는가'를 확인해 과밀·여유 부지를 가늠하는 데 쓴다. 필지고유번호(PNU) 열이 있어 토지·건축물대장 자료와 맞춰 볼 여지는 있으나, 실측에서는 전역 조인 키로 확인되지 않아 이름·코드 매핑이나 같은 기관 자료로만 연결한다.
limits: 진안군 한 곳의 필지·건물만 담아 다른 시군과의 비교에는 따로 자료가 필요하다. 명세상 이벤트 때 만들어진 뒤 바뀌지 않는 수시 자료로 포털 기준일은 2023년 8월 18일이므로, 이후 신축·증축은 반영되지 않았을 수 있다.
