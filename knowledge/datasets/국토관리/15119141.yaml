description_portal: '전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 건축물 주제도 건폐율별에 대한 공공데이터 자료입니다. 이번 자료에서는 공간정보 관리 번호, X 좌표 최솟값, Y 좌표 최솟값, X 좌표 최댓값, Y 좌표 최댓값, 건폐율(의미: 건설 대지에서 건축물이 차지하는 땅의 비율), 건물 군 관리 번호, 필지 고유번호(PNU 의미: 토지에 부여되는 고유한 19자) 정보를 제공합니다. 이 자료를 통해 공간정보 관리 번호에 해당하는 필지 고유번호를 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.'
