summary_user: 대구도시개발공사가 매입해 임대로 운영하는 주택을 호실 단위로 한 줄씩 담은 건별 원천 파일(CSV, 약 252KB)이며, 임대주택명·동·호와 방구조, 전용·공용면적, 등록·수정일시를 담는다. 주거지원 분석가나 입주 희망자가 '대구 매입임대주택에 어떤 면적·방구조의 호실이 얼마나 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 임대주택명 같은 이름 매핑이나 같은 기관의 다른 매입임대 데이터로만 잇는다.
description_portal: 이 데이터는 대구도시개발공사에서 제공하는 매입임대주택 관련 세대별 정보를 담고 있으며, 공사의 임대주택 관리 및 정책적 활용을 위해 구축된 공공데이터입니다. 매입임대사업은 주거 취약계층의 주거 안정을 목적으로 대구도시개발공사가 매입한 주택에 대해 임대 운영을 수행하는 사업으로, 본 데이터는 해당 주택에 입주한 세대의 현황을 체계적으로 관리하기 위해 생성되었습니다, 임대주택명, 동, 호, 방구조, 전용면적, 공용면적, 등록일시, 수정일시의 항목으로 구성됩니다. 이를 통해 세대별 주거 특성 및 수요를 파악하고, 주거지원 대상자의 유형 분석 및 정책 기획에 활용할 수 있습니다. 특히, 취약계층의 안정적 거주 지원을 위한 근거 자료로 유용하게 쓰일 수 있습니다.
