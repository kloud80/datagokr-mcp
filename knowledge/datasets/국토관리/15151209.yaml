summary_user: 전국 승강기를 건물 소재지 기준으로 조회하는 API로, 승강기 목록·상세정보(종류·형식·설치일·관리주체·보수업체)와 검사이력(최종검사일·종류·결과)을 승강기 단위로 담는다. 건물 관리자나 입주민, 분석가가 특정 건물의 승강기가 언제 어떤 검사를 받았고 결과가 어땠는지 확인하는 질문에 쓴다. 소재지(address1·address2)가 조인 키라서 주소 기반의 다른 건물·지역 데이터와 이어 쓰며, 필수 파라미터인 건물명·승강기번호·시도 값은 다른 데이터에서 먼저 받아 넘겨야 한다.
limits: 호출에 필요한 건물명(buld_nm), 승강기번호(elevator_no), 시도(sido) 값은 이 API만으로 알 수 없어 다른 데이터에서 먼저 받아야 한다. 검증 때 수신된 것은 3행뿐이라 전체 규모나 갱신 주기는 확인되지 않았다. 개발계정은 일 10,000회까지 호출할 수 있다.
