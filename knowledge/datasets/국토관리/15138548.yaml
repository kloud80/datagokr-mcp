summary_user: 경기도 이천시 도시계획정보시스템(UPIS)에 등록된 '배치' 현황 도형을 도형 1건당 한 행으로 담은 CSV 파일(약 7KB)로, 각 행은 관리번호·구분 코드·용도 설명·비고로 구성된다. 이천시 도시계획 담당자나 공간계획 분석가가 '이천시에 배치로 등록된 도시계획 도형이 어떤 용도·계획 목적을 갖는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 현황도형 관리번호나 구분 코드를 기준으로 같은 이천시 UPIS의 다른 파일이나 도형 데이터와 이름·코드를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경기도 이천시 도시계획정보시스템(UPIS)에 등록된 배치 현황 정보를 수록한 자료로, 각 도시계획 도형의 관리번호, 구분 코드, 용도 설명, 비고 항목 등으로 구성되어 있습니다. 도형별로 도시계획상의 용도지구 또는 관리구역 등의 특성을 식별할 수 있도록 체계적으로 분류되며, 도시관리계획 수립, 지구단위계획 검토, 공간계획 분석 등에 활용됩니다. 구분코드는 토지 이용의 성격 또는 계획구역의 분류 기준을 나타내며, 용도 설명 항목은 해당 도형이 담고 있는 계획 목적을 구체적으로 표현합니다. 본 데이터는 공간정보시스템(GIS)과 연계 시 행정구역별 도시계획 시각화, 용도지역별 통계 분석, 계획 이행 점검 등 다양한 행정업무에서 기초자료로 활용됩니다.
