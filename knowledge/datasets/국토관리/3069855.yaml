summary_user: 한국산업표준(KS)에 따른 연도별 전국 KS 인증품목수, 인증을 받은 공장수, 인증공장이 받은 전체 인증건수(인증서)를 담은 연 단위 전국 집계 파일로, 포털 설명상 2015~2024년을 다루며 2024년은 인증품목 680개, 인증공장 8,652개, 인증건수 15,430건입니다. 분석가나 정책 담당자가 'KS 인증을 받은 공장과 인증건수가 최근 10년간 늘었는가'처럼 표준 인증 규모의 연도별 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없고 연도만 있어, 다른 연도별 제조업·공장등록 통계와는 연도 기준으로만 나란히 놓고 볼 수 있다.
description_portal: 한국산업표준통계_KS 인증 품목수 및 공장수 현황 데이터는 한국산업표준에 따른 2015년부터 2024년까지 년도별 KS 인증품목수 및 KS인증기관으로부터 인증을 획득한 전체 KS인증 받은 공장수, KS인증을 획득한 공장에서 발행한 전체 인증건수(인증서)를 보여주는 데이터로, 현재 데이터는 2024년 데이터가 추가되었으며, 2024년에는 인증품목수는 680개, 인증공장수는 8652개, 전체 인증건수는 15430개로 2023년 대비 증가하는 추세를 보였습니다.
