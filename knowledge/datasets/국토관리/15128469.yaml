summary_user: 경기도 행정동을 출발지로 하는 유출인구를 기준일·출발 시간대·이동 목적·성별·연령대별로 묶은 집계 데이터로, 읍면동 단위이며 출발지 행정동 코드·이름과 중심 좌표를 함께 담는다. 교통·도시계획 분석가가 '이 행정동에서 출근 시간대에 어떤 연령·성별이 어떤 목적으로 많이 빠져나가는가' 같은 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 행정동 코드(dppl_admdong_cd)나 시도·시군구·행정동 이름 매핑, 또는 같은 경기도 데이터의 코드로만 다른 자료와 잇는다.
description_portal: 이 데이터는 경기도 행정동 간 유출인구를 이동 목적별·성별·연령대별로 구분한 자료입니다. 특정 기준일과 시간대에 출발지 행정동에서 다른 지역으로 이동한 인구를 집계합니다.이를 통해 생활권 기반 이동 패턴, 연령·성별에 따른 교통 및 생활 수요 차이, 행정동별 유출 특성을 파악할 수 있습니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
