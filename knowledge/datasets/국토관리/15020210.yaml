summary_user: 울산광역시 관내에서 분뇨를 수집·운반하는 허가 업체 목록으로, 업체별 한 행에 업체명·대표자·소재지(주소)·전화번호를 담은 작은 CSV 파일(1,772바이트)이다. 울산 시민이 정화조 청소를 맡길 업체를 찾거나, 담당자·분석가가 관내 분뇨 수거 업체가 어디에 있는지 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 주소를 이름 매칭하거나 같은 기관(울산광역시) 자료끼리 묶는 방식으로만 이어 쓴다.
