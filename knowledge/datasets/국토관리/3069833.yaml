summary_user: 전국 산업단지 안의 구역을 산업시설·지원시설·공공시설·주거시설·녹지·유보지·도로·하천 같은 용도별 시설용지(YOJ_ID 코드)로 나눠 표시한 도면 자료이며, 시도별 파일로 내려받는다. 분석가나 지자체 담당자가 특정 산업단지에서 산업시설용지와 녹지·공공시설용지가 어디에 어떻게 배치되어 있는지 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 산업단지 일반현황이나 경계도면 같은 산업단지 원장 자료와는 단지 이름이나 코드 매핑으로만 연결한다.
