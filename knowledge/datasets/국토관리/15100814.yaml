summary_user: 경기도 테크노밸리 입주기업을 기업 한 곳당 한 행으로 담은 명단으로, 입주 시군·컨소시엄, 업체명, 업종·표준산업분류, 기업 규모·유형, 주소, 설립연도, 사업자등록번호, 임대면적, 위경도를 담는다. 구직자·영업 담당자나 정책 분석가가 '경기바이오센터 등 각 거점에 어떤 업종의 어떤 규모 기업이 입주해 있나'를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았고, 사업자등록번호(bizregno)로 공장 등록 자료와 겹쳐 검증하거나 표준산업분류·시군명으로 이름·코드 매핑해 잇는다.
description_portal: 이 데이터는 경기도경제과학진흥원이 운영하는 테크노밸리 내 입주기업의 현황을 정리한 자료로, 경기도의 기술 창업 및 첨단산업 육성 현황을 파악하는 데 활용됩니다. 입주지는 경기R&DB센터, 경기바이오센터, 경기벤처창업보육센터, 경기도경제과학진흥원 등 다양한 혁신 거점으로 구성되어 있으며, ‘시군명’, ‘컨소시엄명’을 통해 기업의 입주 위치 및 지원기관 유형을 확인할 수 있습니다. 이 데이터는 테크노밸리 혁신기업군 분석, 산업 클러스터별 분포 파악, 정책 수혜기업 추적, 공간 기반 기술 창업 정책 설계 등에 활용될 수 있습니다.
