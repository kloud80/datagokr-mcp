description_portal: 본 데이터는 한국토지주택공사의 토지은행 공공비축토지 현황을 제공합니다. 공공비축토지는 향후 토지 공급과 수요의 안정을 위하여 토지은행이 사전에 비축해 두었다가 필요할 때 공급하기 위하여 보유하는 토지를 말합니다. 은행에 돈을 예금하고 정해진 이자율로 이자를 받는 것과 마찬가지로 토지은행에서도 비축해 둔 토지를 임대하는 방법 등으로 일정한 수익을 발생 시킵니다. 원사업자가 한국토지주택공사가 아닌 지자체, 공공기관 등인 경우에도 비축토지사업을 위탁받아 공공비축토지를 보유하는 경우가 있으니 참고하시기 바랍니다.
