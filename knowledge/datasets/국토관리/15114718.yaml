summary_user: 경기도 평택시 안의 개발 지구별로 주택공급 예정량을 담은 1회성 파일(csv, 약 1.3KB)로, 지구명·민간/공공 구분·준공(예정) 시기·수용인구수·전체세대수·담당부서를 지구 단위로 담는다. 평택에 앞으로 어느 지구에서 몇 세대가 언제쯤 들어서는지 알고 싶은 실수요자·부동산 분석가·정책 담당자가 지역 공급 물량을 가늠하는 데 쓴다. 전역 조인 키는 없어서, 다른 주택 통계와는 지구명 같은 이름을 맞추거나 시군구(평택시) 단위로만 이어 쓴다.
limits: 시군구 범위의 평택시 자료만 담아 다른 지역과 비교하는 데는 쓸 수 없다. 공통 코드 키가 없으므로 다른 데이터와 붙일 때는 지구명 등 이름을 직접 맞춰야 한다. 포털 설명상 1회성 데이터라 최신화가 필요하면 기관에 따로 요청해야 한다.
