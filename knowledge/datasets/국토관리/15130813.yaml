summary_user: 경기도 안에서 진행 중이거나 끝난 재건축 등 도시개발·정비사업을 정비구역(사업) 한 건씩 담은 현황으로, 사업단계·유형, 위치·면적, 기존주택과 신축계획(분양·임대 세대수, 용적률 변화), 토지소유자·조합원 수, 시행자, 정비구역 지정부터 준공·이전고시까지의 행정절차 일자를 담는다. 정책 분석가나 주민은 이 데이터로 우리 시군의 노후 주거지 재건축이 조합설립·사업시행·준공 중 어느 단계에 있는지, 정비 후 용적률과 세대수가 얼마나 늘었는지 확인하는 데 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않아, 다른 데이터와는 시군명, 시군구 코드(signgu_cd), 필지번호(pnu_no) 같은 이름·코드를 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 진행 중이거나 완료된 도시개발 및 정비사업 현황을 담고 있으며, 재건축 등 도시정비사업의 전 과정을 추적할 수 있습니다. 주요 항목에는 사업단계(예정구역, 조합설립, 사업시행, 준공 등), 사업유형, 정비구역명, 위치 및 면적, 기존주택 현황(동수, 합계, 준공연도), 신축계획(분양·임대 세대수, 용적률 변화), 토지소유자·조합원 수, 시행자 구분, 각종 인허가 및 행정절차 일자 등이 포함됩니다. 지역별 노후 주거지 재건축 현황, 조합원 참여도, 용적률 상향 효과, 준공 시점 비교 등 도시계획 및 정책 수립에 유용하게 활용할 수 있습니다.
