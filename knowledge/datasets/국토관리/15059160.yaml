summary_user: 공동주택 단지별 장기수선충당금 정보(월 부과액·월 사용액·충당금 잔액·적립요율)를 단지코드(kaptCode) 기준으로 내려주는 API이며, 검증 호출에서는 전국 범위의 4행이 수신되었다. 입주민이나 분석가가 우리 단지의 장기수선충당금이 얼마나 쌓였고 매달 얼마나 부과·사용되는지 확인하는 질문에 쓴다. 단지코드(apt_complex_cd)가 K-apt 단지 기본정보·관리비·입찰 등 다른 데이터와 실거래 단지명·공시 동호·청약 단지를 잇는 매핑 키가 되며, 필수 파라미터 kaptCode는 다른 데이터에서 먼저 받아 넘겨야 한다.
limits: kaptCode를 직접 조회하는 API가 아니므로 단지코드를 다른 데이터에서 먼저 확보해야 하며, 단지 목록 탐색만으로는 호출할 수 없다. 검증 수신은 4행에 그쳐 전국 단지 전체의 규모나 갱신 주기는 확인되지 않는다. 개발계정은 일 5,000회까지 호출할 수 있다.
