summary_user: 경상남도 합천군에서 허가된 개발행위를 건별로 담은 파일로, 허가일자·지번주소·지목·면적·용도지역·허가목적을 기록하며 데이터 기준일은 2020년 12월 30일이다. 합천군 안에서 언제, 어느 지번에, 어떤 용도지역의 땅이 어떤 목적으로 개발 허가를 받았는지 확인하거나 개발 현황을 모니터링하려는 토지 소유자·사업자·분석가가 쓴다. 전역 조인 키는 없어서 지번주소를 다른 토지 자료와 이름으로 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: 해당 자료는 경상남도 합천군 개발행위 허가 정보에 관한 데이터로 개발 현황 분석과 토지 관리에 기초적인 자료입니다.본 데이터는 경상남도 합천군의 허가일자, 지번주소, 지목, 면적, 용도지역, 허가목적 등의 데이터를 포함하고 있어, 허가된 개발행위의 시기와 위치, 토지의 특성 및 개발 목적을 구체적으로 파악할 수 있습니다.이를 통하여 합천군 내 토지 개발 현황 모니터링, 공간적 분석 자료 활용, 토지 용도 구분, 개발 허가 기준 마련, 향후 토지 관련 정책 수립에 있어 활용할 수 있습니다.데이터 기준일은 2020년 12월 30일 입니다.
