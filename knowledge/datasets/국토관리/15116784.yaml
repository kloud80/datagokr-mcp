description_portal: 남구 관내 광고를 위한 현수막 게첩을 할 수 있는 지정게시대 데이터로, 위치, 수수료, 게첩가능한 현수막 규격 등의 항목을 제공합니다. 해당 데이터는 광주광역시 남구청 도시계획과(☎062-607-3933)에서 제공합니다. 현재 전국현수막게시대시설표준데이터(https://www.data.go.kr/data/15129434/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 현수막 지정게시대는 불법 현수막 난립을 방지하고 쾌적한 도시 미관을 유지하기 위해 지자체가 설치·운영합니다. 주민, 단체, 상공인 등이 합법적으로 현수막을 부착할 수 있도록 지정된 위치와 구조물로, 주로 주요 도로변, 광장, 공공시설 주변에 설치됩니다. 해당 데이터는 주민과 업체가 합법적으로 홍보 활동을 할 수 있도록 지원합니다. 지자체는 이를 통해 옥외광고 질서를 확립하고, 도시 미관을 개선하며, 불법 광고물 단속 효율성을 높일 수 있습니다. 민간에서는 행사 홍보, 지역 상권 광고, 시민단체 캠페인 등 다양한 분야에서 활용할 수 있으며, 결과적으로 합법적 홍보 문화 확산과 도시 경관 개선에 기여합니다.
