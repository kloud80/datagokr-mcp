summary_user: 전북특별자치도가 목욕시설이 부족한 농촌 지역에 설치한 작은목욕탕을 시군·읍면별로 한 곳씩 담은 목록으로, 위치(면사무소·복지회관 등), 신축·리모델링 유형, 시작 연도, 준공·개장·운영 상황을 담는다. 지자체 복지 담당자나 분석가가 어느 시군 읍면에 작은목욕탕이 있고 실제 운영 중인지 확인하거나 농촌 생활복지 인프라 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군·읍면 이름을 행정구역 코드에 매핑해 연결해야 한다.
description_portal: "전북특별자치도가 농촌 등 목욕시설이 부족한 지역의 주민들을 위해 추진한 '작은목욕탕' 사업의 현황을 정리한 데이터입니다. 이 자료는 각 시군의 읍면 단위에 설치된 작은목욕탕의 위치(예: 면사무소, 복지회관)와 신축 또는 리모델링 여부, 그리고 운영 상태 등 상세한 정보를 담고 있습니다. 이 데이터는 어르신 등 교통 약자들이 멀리 나가지 않고도 편리하게 목욕 시설을 이용할 수 있도록 지원하는 생활 밀착형 복지 정책의 성과를 보여줍니다. 또한, 지역별 복지 인프라의 분포를 파악하고, 주민들의 기초 생활 편의 증진을 위한 정책을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다."
