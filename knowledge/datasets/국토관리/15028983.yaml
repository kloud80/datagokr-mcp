summary_user: 충청남도 홍성군 안 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일이며, 단지명·회사명·업종명·도로명/지번 주소·위도·경도를 포함합니다(CSV 약 24KB). 기업 유치 담당자나 영업·구직자가 '홍성군 어느 산업단지에 어떤 업종 기업이 모여 있나'를 확인하거나, 단지별 업종 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 회사명·주소 문자열 매칭이나 위경도 좌표로만 이어 쓰며, 공장 등록 현황이나 산단 통계와 겹쳐 볼 때도 이름 대조가 필요하다.
