description_portal: 본 데이터는 전라남도 장성군 관내 수돗물을 사용하는 개별 가정, 상가, 공장 등(수용가)에 설치된  '상수도 스마트 원격검침기의 정확한 공간 위치(위도·경도)와 주소 정보'를 제공하는 공간 데이터입니다.과거 검침원이 일일이 가정을 방문하여 계량기를 확인하던 대면 방식에서 벗어나, 장성군은 사물인터넷(IoT) 기술을 활용해 물 사용량을 실시간으로 무선 전송하는 원격검침기(스마트 미터기) 보급을 확대하고 있습니다. 본 데이터는 이러한 원격검침 단말기가 설치된 지역적 분포와 정확한 물리적 위치 좌표를 담고 있습니다.이 데이터는 지자체의 스마트 상수도 관망 관리 시스템 구축, 누수 의심 지역의 신속한 위치 파악 및 유지보수 동선 최적화를 위한 지리정보시스템(GIS) 매핑의 핵심 기초 자료로 활용됩니다. 또한, 일정 기간 물 사용량이 없는 가구(수용가)의 위치 좌표를 추출하여 독거노인 등 취약계층의 위험 상황(고독사 등)을 조기에 발견하는 복지 사각지대 발굴 시스템 등 스마트시티 융합 서비스 개발에도 유용하게 쓰일 수 있습니다.[이용 시 유의사항]- 본 데이터는 원격검침 인프라의 '물리적 위치(공간정보)'만을 제공하며, 수용가(시민)의 이름, 연락처, 실제 수도 사용량 및 요금 정보 등 개인정보는 철저히 배제되어 있습니다.- 제공되는 위도와 경도 좌표는 GPS 측위 환경이나 지오코딩(주소-좌표 변환) 과정에 따라 실제 계량기가 묻혀 있는 맨홀이나 벽면의 정확한 위치와 수 미터(m) 내외의 미세한 오차가 발생할 수 있습니다.
