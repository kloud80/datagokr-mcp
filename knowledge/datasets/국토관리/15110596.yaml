summary_user: 장성군 관내 가정·상가·공장 등 수용가에 설치된 상수도 스마트 원격검침기 한 대마다 도로명주소·지번주소와 위도·경도를 담은 건별 위치 데이터로, 범위는 장성군 한 개 시군구다. 지자체 상수도 담당자나 분석가가 누수 의심 지역의 검침기 위치를 지도에 찍거나 원격검침기 보급이 어느 지역에 몰려 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(도로명·지번) 매칭이나 좌표 기반 공간 결합으로만 잇는다.
limits: 검침기의 물리적 위치만 담고 수용가 정보·물 사용량·요금은 없어, 사용량 기반 분석(무사용 가구 탐지 등)은 이 파일만으로 하지 못한다. 좌표는 측위·지오코딩 과정에서 실제 계량기 위치와 수 미터 오차가 있을 수 있고, 다른 데이터와 붙일 공통 코드가 없어 주소 문자열 매칭에 의존해야 한다.
