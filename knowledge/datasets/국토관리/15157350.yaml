summary_user: 경기도 31개 시군별 전세사기 피해 발생 건수를 연도별(2023~2025년 등)로 집계한 통계로, 시군구 단위 집계값을 담는다. 경기도 주거·민생 담당자나 연구자가 '최근 몇 년 사이 전세사기 피해가 어느 시군에서 늘고 줄었는가'를 비교할 때 쓴다. 실측 컬럼에 행정구역 코드 같은 공통 조인 키가 없어, 시군명(sigun_nm)과 연도를 기준으로 이름 매핑해야 다른 시군별 통계와 이을 수 있다.
description_portal: 「경기도_시군별_전세사기_발생현황」 데이터는 경기도 내 31개 시군에서 발생하는 전세사기 피해의 정확한 규모와 연도별 추이를 파악하기 위해 수집·관리되는 통계 자료입니다. 본 데이터셋의 주요 항목으로는 행정구역을 나타내는 구분(시군명) 과 해당 지역의 전세사기 피해 발생 건수를 나타내는 2023년, 2024년, 2025년 등의 연도별 수치 데이터가 포함되어 있습니다. 특히 경기도의 각 주요 도시의 피해 급증 및 감소 추세를 직관적으로 비교할 수 있도록 구성되어 있습니다.이러한 통계 데이터들은 지역별 피해 집중도를 정량적으로 모니터링하고, 특정 시기나 지역에 따라 변화하는 피해 확산 양상을 객관적으로 분석하여 실효성 있는 대응책을 마련하는 데 필수적으로 사용됩니다. 이 자료는 향후 전세사기 예방을 위한 맞춤형 정책 수립, 피해자 구제를 위한 효율적인 행정력 및 예산 배분, 그리고 투명하고 안전한 주거 부동산 시장 환경 조성을 위한 기초 지표로서 공공기관 및 연구자들에게 폭넓게 활용 가능합니다
