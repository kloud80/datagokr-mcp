description_portal: 대구광역시 상수도사업본부에서 2016년부터 2024년까지 수도 사용량이 다량인 급수전을 선정한 전수를 제공합니다. 대구광역시의 상수도 다량급수전은 일정량 이상의 수돗물을 지속적으로 사용하는 시설이나 가정을 효율적으로 관리하고자 마련된 제도입니다. 이는 수돗물을 대량으로 사용하는 급수전들을 별도로 구분하여 관리함으로써, 보다 안정적인 급수 운영과 수요 예측, 설비 점검, 누수 관리 등을 체계적으로 수행하기 위한 목적에서 도입되었습니다. 이와 같은 다량급수전 제도는 수돗물 자원의 효율적 이용과 공급 안정성 확보를 위한 중요한 관리 장치로서, 대형 시설의 수돗물 사용 실태를 체계적으로 파악하고 관리하는 데 기여하고 있습니다.
