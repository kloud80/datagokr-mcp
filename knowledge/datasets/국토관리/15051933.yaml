summary_user: 서울특별시 하천기본계획에 포함된 홍수관리구역 정보를 담는 파일로, 하천기본계획 사업명·수립연도·하천명·지정일자·하천연장·면적 등을 구역 단위 행으로 제공한다. 홍수 시 침수 위험이 큰 구역이 어느 하천에 얼마나 지정돼 있는지 확인하려는 분석가나, 개발 예정지가 홍수관리구역에 걸리는지 알아보려는 사업자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 하천명(RVR_NM)이나 하천기본계획 코드 같은 이름·기관 내부 코드로 서울시의 다른 하천 데이터와 맞춰 쓴다.
description_portal: '하천기본계획은 하천의 이용 및 관리에 필요한 기본적인 사항 등을 내용으로 하며 유역의 강우, 하천의 유량, 하도특성 및 이용현황 등을 조사 분석하여 하천의 종합적인 정비, 보전, 이용에 대한 계획을 수립합니다. 하천기본계획의 내용중 홍수관리구역의 정보를 조회할 수 있습니다.*용어설명정의: 홍수로 인한 피해가 우려되는 지역을 체계적으로 관리하기 위해 지정하는 구역. 홍수 시 침수 위험이 큰 지역에 건축·토지이용을 합리적으로 제한·관리합니다.법적 근거: 하천법(홍수관리구역), 자연재해대책법(침수우려구역·재해위험개선지구 등)과 연계.목적: 인명·재산 피해 예방, 개발행위의 사전 조정, 방재 인프라 투자 우선순위 설정.※ 제공부서 : 서울특별시 물순환안전국 치수안전과(02-2133-3886)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
