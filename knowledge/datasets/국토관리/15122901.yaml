summary_user: 지적재조사 사업에서 확정측량이 끝난 지구를 한 건씩 담은 파일로, 지구별 일련번호·사업지구명·위치·면적(m²)·도곽 수·기준년도·등록일시를 전국 시군구 단위로 정리한다. 지자체 담당자나 분석가가 "우리 시군구에서 확정측량을 마친 지적재조사 지구는 몇 곳이고 면적 규모는 어느 정도인가"를 확인하거나 지역별 사업량을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 시군구코드·시군구명을 행정구역 코드표와 맞춰 다른 시군구 단위 통계와 잇는 방식으로 연결한다.
description_portal: '지적재조사 사업 중 확정측량이 완료된 지구에 대한 정보를 행정구역 단위로 관리하는 자료로, 해당 지구의 위치, 면적, 도곽 수, 등록일 등을 포함합니다.1. 형식: CSV2. 내용 요약■ 사업지구일련번호: 지구별 고유 식별번호■ 시군구코드: 행정구역별 코드 (예: 11140 = 서울 중구)■ 시군구명: 사업지구가 속한 행정구역 명칭■ 기준년도: 사업 기준 연도 (예: 2022-12-31)■ 사업지구명: 지적확정측량이 실시된 지구의 명칭■ 위치: 측량이 이루어진 필지의 상세 위치 주소■ 면적: 해당 지구의 총 면적 (단위: m²)■ 도곽수: 도면 상의 도곽(블록) 수(2021년도 시군구 기준으로  500,600,1000,1200,2400,3000,6000 의 합)■ 등록일시: 사업지구가 시스템에 등록된 날짜3. 활용 예제■ 지자체별 지적재조사 확정측량 진행 현황 파악 및 통계 분석■ 지역별 면적 기반 사업 규모 비교 및 도곽 수 기반 업무량 예측■ 위치 정보를 활용한 공간정보 시스템(GIS) 연계 시각화 자료 구축■ 등록일자와 기준년도 분석을 통한 사업 진행 시기 추이 파악'
