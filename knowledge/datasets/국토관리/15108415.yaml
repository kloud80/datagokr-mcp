summary_user: 대구광역시 수도사용량을 상수도 업종(가정용·일반용·욕탕용·공업용), 건축물 주용도, 연·월, 읍면동(법정동) 단위로 집계한 파일 데이터로, 약 44MB 분량의 CSV로 받는다. 대구 동네별·건물 용도별로 물을 얼마나 쓰는지, 계절에 따라 사용량이 어떻게 달라지는지를 보려는 상수도 수요 분석가나 지역 상권·에너지 연구자가 쓴다. 법정동코드(bjd_cd)로 행정구역 경계, 인구·건축물 통계 등 법정동 단위 데이터와 이어 붙이고, 건축물주용도코드로 건축물대장 용도 분류와 맞춰 쓴다.
description_portal: '대구광역시 수도사용량을 업종별, 건물 용도별, 월별로 집계한 데이터(데이터 기준일 : 2022.09.01.) ※ 상수도업종 : 가정용, 일반용, 욕탕용, 공업용(원인자부담/원인자미부담 : 동일한 공업용이나 요금부과 요율에 따라 나눠짐) - 가정용 : 가사용, 사용량 10㎥미만의 소규모 업소, 사회복지시설 또는 유공자 단체, - 일반용 : 타 업종에 속하지 않는 모든 업태, 공장등록된 제조업체 및 학교, 운반급수, 수도관 파손에 의한 누수량, - 욕탕용 : 목욕장업, - 공업용 : 별도의 배급수관에 의하여 공업용으로 공급되는 용수, ※ 2022년 공공데이터 기업 매칭 지원사업 결과물(사업명 : 공간정보데이터 융·복합을 통한 대구 수용가 데이터 품질 개선)'
