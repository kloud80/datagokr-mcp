description_portal: 경기주택도시공사에서 시행 중인 택지 및 공동주택 분양 공고에 관한 2006년 이후의 현황 데이터로써 공고명, 공고시작일, 공고종료일, 공고등록일 등의 정보가 포함됩니다. 개발 택지의 주차장용지, 근린생활시설용지, 방송시설용지, 상업용지, 업무시설용지, 단독주택용지, 종교시설용지, 점포겸용 단독주택용지, 주거전용 단독주택용지, 자족시설용지, 숙박용지 등 다양한 용지별 공급현황을 확인할 수 있으며, 분양지역, 분양대상, 공급방식 등의 정보도 포함되어 수요자에게 실시간 분양 일정을 안내하는 데 유용합니다. 택지공급 계획 수립, 주거 수요 대응, 분양 시기 조정 등과 관련한 정책 분석과 실무 기획에 폭넓게 활용될 수 있습니다.
