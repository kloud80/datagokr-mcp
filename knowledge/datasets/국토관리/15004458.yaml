summary_user: 경기주택도시공사가 2006년 이후 낸 택지·공동주택 분양 공고를 공고 한 건씩 담은 파일(csv, 약 42KB)로, 공고명과 공고 시작일·종료일·등록일을 기록한다. 청약 대기자나 용지 매입을 검토하는 사업자가 "경기도시공사가 언제 어떤 분양 공고를 냈고 접수 기간이 언제까지인가"를 확인하거나, 분석가가 연도별 공고 시기 흐름을 살피는 데 쓴다. 공통 조인 키가 없어 다른 청약·분양 데이터(마이홈, LH 공고 등)와는 공고명이나 날짜를 기준으로 직접 맞춰 이어야 한다.
