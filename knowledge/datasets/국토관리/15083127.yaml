summary_user: 서귀포시 관내에서 착공허가가 처리된 건축물을 건별로 담은 파일 데이터로, 건축구분(신축·증축 등), 지번 기반 대지위치, 지목, 주용도, 대지·건축·연면적, 건폐율·용적률, 구조, 착공처리일을 필지·건물 단위로 담는다. 분석가나 사업자가 '서귀포시에서 최근 어떤 용도의 건물이 어느 지역에 얼마나 착공되고 있나'처럼 지역 개발 흐름의 선행 지표를 확인할 때 쓴다. 전역 조인 키는 없어 대지위치(지번 주소)를 주소·지번 매핑으로 건축물대장이나 공간정보와 맞추거나, 같은 서귀포시의 허가·사용승인 자료와 이름으로 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘건축물 착공허가현황’ 데이터는 서귀포시 관내에서 착공허가가 처리된 건축물의 세부 내역을 분기 단위로 수집한 공공자료입니다.주요 항목으로는 건축구분(신축, 증축 등), 지번 기반의 대지위치, 주된 용도, 대지·건축·연면적(㎡), 건폐율·용적률(%), 구조, 착공처리일, 데이터 기준일자 등이 포함되어 있습니다 이 자료는 토지이용 계획, 건축 인허가 현황 파악, 도시 개발 및 재정 정책 수립, 연면적 기반 세외수입 예상, 환경 영향 평가, GIS 기반 건축 현황 지도 제작, 재난 대응 및 안전 점검 기준 마련 등에 활용할 수 있는 실무 핵심 데이터입니다.
