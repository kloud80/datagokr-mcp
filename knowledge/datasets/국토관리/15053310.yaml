summary_user: 충청남도 부여군에 등록된 제조업체(공장)를 업체 한 곳당 한 행으로 담은 파일로, 회사명·대표자명·연락처·도로명/지번 주소·업종명·생산품과 정상·휴업·폐업 여부(운영구분)를 기록한다. 부여군에서 실제로 가동 중인 식품 가공·레미콘·금속 가공 공장이 어디에 몇 곳 있는지 확인하려는 지역 분석가나 거래처를 찾는 사업자가 쓴다. 사업자번호·산업분류코드·필지번호 같은 전역 조인 키가 없어서, 다른 데이터와는 주소나 회사명을 맞춰 연결해야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 팩토리온 공장등록이나 기업 데이터와 바로 붙일 수 없고, 주소·회사명 매핑에 의존한다. 범위는 부여군 한 곳뿐이라 다른 시군과 비교하려면 각 시군 자료를 따로 모아야 한다.
