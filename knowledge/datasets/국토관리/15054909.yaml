summary_user: 경상남도 창녕군 내 산업단지별 입주업체 명단을 업체 한 곳당 한 행으로 담은 CSV 파일(약 24KB)로, 산업단지명·회사명·분양면적(제곱미터)·위치(구주소)·업종·주 생산품을 포함한다. 구직자나 영업 담당자가 '창녕군 어느 산업단지에 어떤 업종·생산품의 업체가 입주해 있는가'를 확인하거나, 분석가가 단지별 업종 구성을 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 산업단지명·회사명 같은 이름 매칭으로만 이어 쓸 수 있고, 사업자번호가 없어 공장 등록 자료와의 대조도 이름 기준으로 해야 한다.
