summary_user: 신고된 상업업무용 부동산(일반건축물·집합건물) 매매 실거래를 건별로 담는 원천 데이터로, 지역코드(법정동 앞 5자리)와 계약년월로 조회하며 범위는 전국이다. 사업자나 분석가가 특정 시군구의 상가·오피스 거래금액(만원)과 건물면적·용도지역이 어느 수준인지 확인하는 질문에 쓴다. 지역코드(sggCd, 조인 키 sgg_cd)로 같은 시군구 단위의 다른 실거래 종류(전월세·토지·공장창고 등)나 지역 통계와 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월(예시 : 201801)로 해당 지역, 해당 기간의 상업업무용 부동산 매매 실거래가 정보를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 상업업무용 부동산 매매 실거래가 자료를 제공하는 상업업무용 부동산 매매 실거래가 정보 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 상업업무용 부동산 중 일반건축물의 지번정보는 일부만 제공합니다.'
