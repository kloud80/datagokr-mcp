summary_user: 경기도 이천시 관내 토석채취 허가를 업소 한 건씩 담은 파일로, 허가업소명·소재지와 허가지 주소, 허가면적·허가량, 채취용도, 허가 시작일자를 담는다(csv 약 1.5KB로 건수가 적다). 이천시에서 어느 업체가 어디서 얼마나 넓은 면적과 물량으로 토석채취 허가를 받았는지 확인하려는 주민·연구자·행정 담당자가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 허가지 지번·도로명주소나 업소명을 맞춰 연결하거나 같은 기관 자료끼리 이어 쓴다.
description_portal: 경기도 이천시의 토석채취 허가 현황 데이터는 관내 허가업소명, 시도·시군구, 소재지 도로명·지번주소, 전화번호, 허가면적, 허가량, 채취용도, 허가지 주소, 허가 시작일자, 대표자명, 사무실 연락처, 데이터 기준일자 등 주요 항목으로 구성됩니다. 본 데이터는 토석자원 개발 과정의 합법적 관리와 채취 규모 파악, 행정기관의 허가사항 이행 점검에 활용될 수 있으며, 허가량 대비 채취 실적 분석이나 허가기간 관리 등 행정업무 효율화를 지원합니다. 또한 환경·도시계획 연구기관은 토지이용 영향, 자원 수급 현황, 지역별 개발 압력 등을 종합적으로 분석하는 데 기초자료로 활용할 수 있으며, 공공기관은 해당 정보를 기반으로 불법 채취 예방, 허가 관리 체계 강화, 지역 환경보전 정책 수립 등 정책적 의사결정에 참고할 수 있습니다.
