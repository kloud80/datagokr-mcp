summary_user: 인천 미추홀구 주택재개발 구역별로 구역명·위치·면적·건폐율·용적률·토지등소유자 수·예상세대수와 정비구역지정, 추진위원회 승인, 조합인가, 사업시행인가, 관리처분계획인가 날짜, 시공자, 현 추진사항을 한 행씩 담은 작은 현황표 파일(CSV 약 2.5KB)이다. 미추홀구 재개발 구역에 집을 가졌거나 매수를 검토하는 사람, 시세를 보는 분석가가 '이 구역이 추진위·조합·사업시행·관리처분 중 어느 단계에 있고 시공사는 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 구역명·구역위치(동 이름) 같은 텍스트로 맞춰 붙여야 한다.
description_portal: 본 데이터는 인천광역시 미추홀구의 주택재개발사업 추진 현황 정보를 담고 있습니다. 연번, 구역명, 구역위치, 구역면적, 건폐율, 용적률, 토지등소유자수, 예상세대수, 정비구역지정일, 추진위원회승인일, 조합인가일, 시공자선정, 사업시행인가일, 관리처분계획인가일, 현추진사항 등의 데이터를 포함하고 있습니다. 미추홀구 내 주택재개발구역의 위치와 추진 단계를 파악할 수 있으며, 학익동, 주안동, 숭의동, 도화동, 용현동 등 다양한 지역에서 재개발사업이 진행되고 있습니다. 조합설립부터 준공까지 각 사업의 진행 상황, 시공사, 예상 세대수 등을 확인할 수 있습니다. 노후 주거지역 재정비를 통해 주거환경을 개선하고 도시 기능을 회복합니다. 이 데이터는 도시재생 사업 추진 현황 파악, 재개발 정책 분석, 주거환경 개선 효과 연구 등에 활용될 수 있습니다.
