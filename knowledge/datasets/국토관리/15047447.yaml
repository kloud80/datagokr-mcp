summary_user: 전북특별자치도 농어촌 빈집 정비 사업의 실적을 시군별로 집계해 배정물량, 추진 중 건수, 완료 건수를 담은 268바이트 크기의 작은 CSV 파일입니다. 도정 담당자나 지역 분석가가 '어느 시군이 배정받은 빈집 정비 물량 대비 완료율이 높고 낮은가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 시군 이름을 맞춰 연결해야 한다.
description_portal: 전북특별자치도 내 농어촌 지역의 쾌적한 주거환경 조성을 위해 추진된 '빈집 정비 사업'의 실적 데이터입니다. 이 자료는 각 시군별로 정비 대상으로 배정된 빈집의 총 물량과 함께, 사업이 진행 중이거나 이미 완료된 건수를 각각 보여주어 정책의 추진 현황을 명확하게 파악할 수 있도록 합니다. 이 데이터는 농촌 지역의 미관을 저해하고 안전을 위협하는 빈집 문제를 해결하기 위한 지자체의 노력을 보여주는 중요한 지표입니다. 이를 통해 지역별 사업 추진 성과를 비교하고, 향후 농촌 주거 환경 개선 사업의 계획을 수립하는 데 활용될 수 있습니다.
