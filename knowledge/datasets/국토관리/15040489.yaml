description_portal: 부산시에서 건축된 공동주택의 미분양 현황 데이터를 개방합니다.개방된 데이터에는 시군구, 읍면동, 주소, 시공사, 시행사, 민가/공공, 임대/분양, 전용면적, 총분양가구, 미분양가구, 청약일, 계약마감일, 입주예정일, 준공여부, 택지종류(민간/공공) 등의 데이터가 있습니다.좇문양 가구수 31,919호 중 3,928호가 미분양상태입니다.서구 417호 중 24호, 동구 688호 중 41호, 영도구 68호 중 22호,  부산진구 4,594호 중 439호, 동래구 3,179호 중 234호, 남구 1,468호 중 42호, 북구 519호 중 123호, 해운대구 4,800호 중 201호, 사하구 1,921호 중 428호, 금정구 1,811호 중333호, 강서구 7,082호 중 11호, 연제구 518호 중 57호, 수영구 404호 중 355호, 사상구 1,720호 중 422, 기장군 2,730호 중 826호가 미분양 주택입니다*기준일 2025.5.21 현재
