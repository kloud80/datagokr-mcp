summary_user: 천안시 동남구 병천면 병천시장에 있는 점포를 한 건씩 담는 데이터로, 점포마다 상호, 업종, 운영시간, 도로명·지번 주소, 전화번호, 위도·경도를 제공한다. 주민이나 방문객이 병천시장에서 특정 업종 점포가 어디 있고 몇 시까지 여는지 확인할 때 쓰고, 상권 분석가가 시장 내 업종 구성과 점포 위치를 지도에 그릴 때 쓴다. 다른 데이터와 바로 묶을 공통 코드 키는 없어서, 주소나 위도·경도로 위치를 맞추거나 상호·시장명을 이름으로 대조해 연결한다.
limits: 전역 조인 키가 없어 사업자등록·인허가 등 다른 데이터와 코드로 정확히 연결하기 어렵고, 주소·좌표·이름 매칭에 기대야 한다. 범위는 천안시 병천시장 한 곳의 점포로 한정되며, 호출에는 포털 활용신청 후 받은 serviceKey가 필요하다(개발계정 일 10,000회).
