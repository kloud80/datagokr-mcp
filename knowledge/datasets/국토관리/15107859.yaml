summary_user: 강원특별자치도 태백시에 등록된 인터넷컴퓨터게임시설제공업(PC방)을 업소 한 곳당 한 행으로 담은 행정 파일로, 상호·도로명 및 지번 주소·업종명·영업상태를 포함하며 파일 크기는 1,302바이트의 소규모 CSV다. 태백시에서 PC방 창업을 검토하는 사업자가 관내에 어떤 PC방이 어디에 영업 중인지 확인하거나, 청소년 유해환경을 점검하는 담당자가 업소 위치를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(도로명·지번)를 지오코딩하거나 상호명으로 맞춰 잇고, 같은 태백시의 다른 업종 인허가 현황과는 기관 단위로 묶어 쓴다.
description_portal: '데이터 명: 강원특별자치도 태백시_인터넷컴퓨터게임시설제공업(PC방) 현황제공 항목: 연번, 상호명, 도로명주소, 지번주소, 영업상태, 성인PC방 유무본 데이터는 「게임산업진흥에 관한 법률」 재26조에 의거하여 강원특별자치도 태백시청 문화관광과에서 인허가 및 관리를 담당하는 인터넷컴퓨터게임시설제공업(PC방)의 행정데이터입니다.조회 기준일일 2026년 4월 21일 현재 태백시 관내에서 정식 등록되어 영업 중인 업소를 대상으로 하며, 데이터의 정확성을 기하기 위해 내부행정망에서 추출한 자료입니다.주요 포함 항목으로는 관리 효율성을 위한 연번을 시작으로, 개별 업소의 식별을 위한 상호명, 위치 기반 서비스를 지원할 수 있는 도로명주소 및 지번 주소가 포함되어 있습니다. 또한 이용자의 편의를 위해 해당업소의 실시간 영업상태를 명시하였으며, 특히 「청소년 보호법」 및 「게임산업법」 에 따른 성인PC방(청소년 출입 금지 업소) 여부를 구분값으로 제공하여 공공데이터로서의 활용도와 정보의 투명성을 높였습니다.이 데이터는 태백시 내 게임산업의 상권 분석, 소상공인 창업 지원 기초 자료, 청소년 유해 환경 모니터링 시스템 구축 등 다양한 공익적 목적으로 활용될 수 있으며, 공공기관의 투명한 행정 서비스 구현과 민간 데이터 경제 활성화에 기여하고자 합니다.'
