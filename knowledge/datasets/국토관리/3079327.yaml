summary_user: 거제시 관내에 설치된 현수막 게시대를 한 곳씩 담은 목록으로, 게시대마다 설치장소·지번주소·면동, 열·단·면 구성, 규격(가로×세로), 비고를 기록한다. 시민이나 광고 사업자가 "우리 동네 어느 게시대에 현수막을 몇 장, 어떤 크기로 걸 수 있나"를 확인하거나, 담당 부서가 게시 가능 수량과 공공홍보 게시 계획을 세우는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군구·면동 이름이나 지번주소를 맞춰서만 이어 쓸 수 있다.
description_portal: 거제시 관내에 설치된 현수막 게시대에 대한 정보를 제공합니다. 각 게시대의 설치 위치(주소), 열·단·면 구성, 규격(가로×세로), 공공용/상업용 구분 등의 상세 항목을 포함하며, 지역 내 옥외광고물의 합리적 관리와 민간 활용을 위한 기초자료로 활용됩니다. 행정홍보 게시물 신청 또는 상업용 광고 게시 가능 여부 확인에 참고자료로 활용할 수 있으며, CSV 형식으로 제공되어 시스템 연계 및 분석이 용이합니다. 또한 게시대 위치별 면수 및 규격 정보를 통해 게시 가능 현수막 수량을 파악할 수 있고, 광고물 설치 민원 처리, 공공홍보 계획 수립 등 행정 업무에 참고자료로 활용될 수 있습니다.
