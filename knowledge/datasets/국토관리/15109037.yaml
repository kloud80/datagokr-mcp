summary_user: 서울특별시 성북구 관내 민간 건축공사를 공사(필지·건물) 한 건씩 담은 파일로, 건축구분(신축·증축 등), 대지위치, 지목, 대지·건축·연면적, 허가일·착공처리일·공사종료일, 주용도를 담는다. 성북구에서 어느 동네에 어떤 용도의 건물이 언제 허가·착공됐는지 궁금한 주민·부동산 분석가가 지역 개발 동향과 공사 진행 단계를 볼 때 쓴다. 전역 조인 키(PNU·법정동코드 등)가 없어서 다른 데이터와는 대지위치 주소를 문자열로 맞추거나 같은 성북구 자료끼리 이어 써야 한다.
description_portal: 이 데이터는 2022년 10월 18일 기준으로 서울특별시 성북구 관내에서 진행된 민간 건축공사 현황을 정리한 자료입니다.각 공사별로 건축구분(신축, 증축 등), 대지위치, 대지면적, 건축면적, 연면적, 허가일, 착공일, 공사종료일, 주용도 등의 정보를 포함하고 있으며, 성북구 내 민간 건축물의 개발 현황과 도시 공간 변화 흐름을 파악할 수 있도록 구성되어 있습니다.이 자료는 민간건축 허가 및 착공 현황 관리, 건축행정 업무 지원, 도시계획 수립, 지역 개발동향 분석, 부동산 통계연구 등 다양한 공공 및 민간 분야에서 활용될 수 있습니다.특히 건축물의 용도와 면적, 공사 진행단계별 데이터를 통해 성북구 내 민간개발 규모와 시기별 변화를 체계적으로 분석하는 데 유용한 기초 자료입니다.
