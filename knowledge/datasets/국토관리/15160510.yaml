description_portal: 「빈집 및 소규모주택 정비에 관한 특례법」에 따른 제2기 부산광역시 해운대구 빈집정비계획 수립을 위해 실시한 빈집 실태조사 결과로 해운대구 각 행정동별 빈집의 개수를 제공합니다. 빈집실태조사 대상은 1년이상 거주·사용하지 않은 주택입니다.(단, 공공임대주택, 사용승인 또는 사용검사를 받은 후 5년이 경과하지 아니한 주택, 준주택(단, 주거용 오피스텔 제외), 별장 등 일시적 거주사용을 목적으로 하는 주택은 제외됩니다.) 빈집 실태조사 상 빈집의 수와 실제 빈집의 수는 신규빈집발생, 철거, 자가정비 등으로 상이할 수 있습니다. 빈집 실태조사 후 재개발 등 도시정비사업을 고려하여 빈집정비계획수립 대상을 설정 후 2026년 2월 25일 제2기 해운대구 빈집정비계획이 수립,고시 되었으며, 「빈집 및 소규모주택 정비에 관한 특례법」 제4조 및 제2조에 따라 제3기 부산광역시 해운대구 빈집실태조사 및 빈집정비계획은 2031년 실시·수립될 예정입니다.
