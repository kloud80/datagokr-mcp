summary_user: 국토교통부가 사전정보공개로 올린 건설분야 공개자료의 목록을 건별로 담으며, 자료마다 제목·카테고리·키워드·제공기관·원본등록일·제공페이지 URL·첨부파일명·다운로드 URL을 준다. 건설 관련 정책자료나 공개문서를 찾는 국민·분석가가 "특정 검색어나 등록일 기준으로 국토부가 공개한 건설분야 자료와 첨부파일은 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·키워드 같은 이름 매핑이나 제공기관명으로만 느슨하게 연결한다.
limits: 자료의 본문이나 수치를 담지 않고 목록과 링크만 주므로 실제 내용은 다운로드 URL로 따로 받아야 한다. 범위는 전국이며 지역 단위로 나눌 공간 정보가 없다. 개발계정 호출은 일 1,000회로 제한된다.
