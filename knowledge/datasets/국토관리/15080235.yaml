summary_user: 전라남도 장성군 내 일반건축물의 지방세 과세 기준인 시가표준액을 건물(필지)별로 담은 파일로, 과세년도·법정동·법정리·본번·부번 등 물건지 정보와 시가표준액, 연면적, 기준일자를 포함한다. 주민이 내 건물의 재산세 등 지방세가 어떤 가액을 기준으로 매겨졌는지 확인하거나, 분석가가 장성군 내 건축물 과세 가액과 규모를 지역별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법정동·법정리·본번·부번으로 만든 지번이나 자치단체코드 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 전라남도 장성군 내 일반건축물에 대해 지방세 부과 기준으로 활용되는 시가표준액 정보를 제공하는 공공데이터입니다. 제공 범위는 2025년도 기준이며, 주요 항목에는 법정동, 법정리, 본번, 부번 등 건물의 물건지 정보와 시가표준액, 건축물의 연면적, 기준일자 등이 포함되어 있습니다. 이를 통해 기간별 건축물의 과세 기준 가액과 규모를 체계적으로 확인할 수 있어 지방세 부과 및 세정업무의 기초 자료로 활용됩니다. 행정기관은 세원 관리와 건축물 자산 가치 평가에 활용할 수 있으며, 연구기관이나 관련 단체는 부동산 시장 분석, 건축물 가치 변동 추세 연구에 참고할 수 있습니다. 또한 주민들에게는 지역 건축물의 시가표준액 정보를 확인할 수 있는 자료로서, 세금 부과 근거 이해와 재산권 관리에도 도움이 됩니다. 나아가 건축 정책과 세제 운영의 신뢰성을 높이는 데 중요한 기반 데이터입니다.
