summary_user: 한국수력원자력이 원자력 시설별로 부담하는 원자력안전관리부담금과 원자력안전관리비용을 구분·시설명·운영단계·금액(원) 단위로 담은 작은 CSV 파일(약 2KB)로, 전국 범위의 비공간 집계 자료다. 연구자나 정책 담당자가 원전 시설·운영단계별로 안전 규제 비용이 얼마나 부과되는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국수력원자력㈜이 공개한 원자력안전관리부담금 및 관리비용 현황 데이터는 원자력안전위원회의 업무 수행을 지원하기 위해 부과·징수되는 부담금과 관련 비용의 구체적인 내역을 담고 있습니다. 해당 자료는 구분(원자력안전관리부담금/원자력안전관리비용), 시설명, 운영단계, 부담금(원) 항목으로 구성되어 있어, 원자력안전 규제 이행에 따른 비용 구조를 명확히 확인할 수 있습니다. 원자력안전법은 원자력 안전 규제 기관의 업무를 원활하게 수행하기 위해 원자력안전관리부담금을 부과할 수 있도록 규정하고 있으며, 세부 기준과 항목은 관련 규정에 의해 정해져 있습니다. 이 데이터는 한국수력원자력㈜이 실제로 부담하는 안전관리 비용의 규모와 항목별 세부 내용을 투명하게 보여줌으로써, 국민과 이해관계자들에게 원자력 안전 규제 이행의 재정적 책임을 명확히 알리는 데 목적이 있습니다. 또한 연구자나 정책 담당자에게는 원자력 안전 관련 제도 운영의 효율성과 개선 방안을 검토하는 데 기초 자료로 활용될 수 있습니다. 나아가 공기업의 투명성 제고와 사회적 신뢰 형성에도 기여하는 의미 있는 공개 정보라 할 수 있습니다.
