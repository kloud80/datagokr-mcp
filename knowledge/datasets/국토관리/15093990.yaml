summary_user: 한국수자원공사가 광역·지방 상수도 정수장에서 하천복류수를 원수로 쓰는 취수장을 대상으로 분기마다 실시한 법정 수질검사 결과를 취수장·측정지점·채수일자별 한 행으로 담은 원천 파일이다. 각 행에는 불소·질산성질소·철·망간·중금속·휘발성유기화합물 등 항목별 측정값이 함께 실린다. 수도 사업자나 지역 주민, 분석가가 "우리 지역 정수장이 쓰는 복류수 원수에서 중금속이나 유기물질이 어느 수준으로 검출됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 취수장명·정수장명·측정지점주소 같은 이름이나 주소로 맞춰 정수장 목록이나 다른 수질 데이터와 연결해야 한다.
description_portal: 본 데이터는 한국수자원공사에서 광역지방 상수도 정수장의 하천복류수를 원수로 사용하는 경우, 분기별로 실시한 법정 수질검사 결과를 제공합니다. 자료에는 취수장명, 측정지점주소, 검사 및 채수일자, 항목명, 기준값, 측정값 등이 포함됩니다. 주요 항목은 탁도, 색도, 대장균군, 일반세균, 전기전도도 등입니다.본 자료는 2024년 3분기부터 2024년 4분기까지의 결과를 포함하며,수원지 수질평가, 담수화 운영, 상수도 위생 점검 등 다양한 분야에 활용됩니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData
