summary_user: 경기도 구리시의 건축 인허가 건을 한 줄씩 담은 파일 데이터로, 건축구분·대지위치·연면적·증축연면적·허가일·착공처리일·사용승인일·주용도를 기록하며 범위는 구리시 한 개 시군구의 필지·건물 단위입니다. 구리시에서 어떤 용도의 건물이 언제 허가·착공·사용승인됐는지를 보고 지역 개발 흐름을 앞서 가늠하려는 분석가나 부동산·건설 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)를 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
limits: 표준 코드(법정동코드·건물관리번호 등) 같은 공통 키가 없어 건축물대장·공시지가 등과 바로 결합되지 않고, 주소 문자열 매칭이 필요하다. 구리시 한 곳만 다루므로 다른 시군구와의 비교에는 각 지자체 자료를 따로 모아야 한다.
