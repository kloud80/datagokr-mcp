description_portal: 구리시에서는 건축행정의 투명성 확보 및 시민 편의 증진은 물론, 최근 사회적으로 중요성이 강조되고 있는 건축안전, 친환경·탄소중립, 스마트건축 등 정책 흐름을 반영하기 위하여 건축 인허가 및 착공 관련 자료를 아래와 같이 제공합니다.제공되는 자료는 건축구분, 대지위치, 연면적, 허가일, 착공처리일, 사용승인일, 주용도 등으로 구성되어 있으며, 건축행정 절차 전반에 대한 이해를 돕는 동시에 도시 안전관리, 생활환경 개선, 지속가능한 도시조성(ESG) 등 다양한 정책 분석과 활용을 위한 기초자료로 활용 가능합니다.아울러, 해당 자료는 관련 법령에 따라 공개 가능한 범위 내에서 제공되며, 개인정보 보호를 위하여 일부 정보는 비공개 또는 비식별 처리될 수 있음을 안내드립니다.
