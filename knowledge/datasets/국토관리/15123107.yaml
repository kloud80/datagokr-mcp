summary_user: 경기도 시군별로 등록 외국인 수를 연도(yr) 단위로 집계한 통계로, 총 인원·남녀 인원·20~30대 여성 인원을 담는다. 지자체 담당자나 분석가가 "우리 시군의 등록 외국인과 청년 외국인 여성은 몇 명이고 다른 시군과 비교해 어떤가"처럼 다문화·정주지원·보육수요 정책의 기초 규모를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 시군 단위 통계와는 시군 코드(sigun_cd)나 시군명을 직접 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군에 등록된 외국인 인구에 대한 연도별 통계 자료로, 외국인의 총 수, 남녀 성별 구분, 특히 20~30대 외국인 여성의 수를 포함하고 있습니다. 시군별로 외국인 인구의 구성 및 분포를 파악할 수 있으며, 이는 다문화가정 정책, 외국인 정주지원, 지역사회 통합정책 수립 등에 활용할 수 있습니다. 또한 청년 외국인 여성 인구 데이터를 통해 노동시장 참여, 보육수요, 지역 커뮤니티 변화 등에 대한 분석 자료로도 활용될 수 있습니다. 이 통계는 이민정책, 지방자치단체의 거주 외국인 서비스 기획, 사회통합 정책 수립 등에 기초자료로서 유의미합니다.
