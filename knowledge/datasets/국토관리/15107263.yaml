summary_user: 행정안전 통계연보 '재난관리' 분야에 실린 전국 단위 소하천 정비 현황을 연도별 집계로 담는다(정비대상, 총연장, 기정비 연장, 미정비 연장, 정비율). 연도에 따라 전국 소하천 정비율이 어떻게 달라졌는지, 미정비 구간이 얼마나 남았는지 보려는 정책 분석가·연구자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 연도·항목 이름으로 맞추거나 같은 기관(행정안전부) 통계끼리만 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '재난관리' 중 '소하천 정비', '연도별 소하천 정비'에 관한 통계입니다. 정비대상, 미정비연장, 총연장, 기 정비, 정비율 등 연도별 '소하천 정비법’에 따른 소하천 정비 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
