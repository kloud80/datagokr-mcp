summary_user: 경상남도 밀양시의 지역화폐인 밀양사랑카드(미르카드) 가맹점을 한 업소당 한 행으로 담은 파일로, 가맹점명·업종·주소·가맹점 번호가 들어 있고 범위는 밀양시 한 곳이다. 시민이 "우리 동네에서 밀양사랑카드를 쓸 수 있는 음식점이 어디인가"를 찾거나, 분석가가 업종별·지역별 가맹점 분포를 살펴 신규 가맹점 확대 대상을 고르는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키나 코드표가 없어, 주소를 지오코딩하거나 가맹점명·업종 이름을 맞춰 상가·소상공인 데이터와 연결해야 한다.
description_portal: 경상남도 밀양시 밀양사랑카드(미르카드) 가맹점 현황 데이터로, 가맹점명, 업종, 주소, 전화번호 등 지역 내 상품권 사용이 가능한 업소 정보를 제공합니다.해당 데이터는 시민이 가맹점을 손쉽게 조회할 수 있도록 지원하며, 지역 골목상권 이용 활성화, 소상공인 매출 분석, 정책 홍보, 지역경제 모니터링 등 다양한 분야에서 활용될 수 있습니다. 또한 행정기관의 가맹점 관리, 신규 가맹점 확대 전략 수립, 지역화폐 이용 패턴 분석 등 데이터 기반의 지역경제 정책 설계에도 유용하게 사용될수있습니다.
