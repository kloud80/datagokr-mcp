status: active
summary_user: 충청남도 각 지역의 건설자재(공사 현장에서 나오는 토석 등) 정보를 공사 건별로 담으며, 공사명·위치·발주처·시공사·자재 종류와 용도·반출량과 반출 시기, 좌표와 사진·첨부파일 주소를 함께 제공한다(건설자원정보공유시스템에서 받아온 자료). 공사 현장에서 나오는 흙이나 돌을 재활용하거나 사급으로 받으려는 건설사업자가 '우리 현장 가까운 충남 공사장 중 쓸 만한 토석을 반출하는 곳이 어디인가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 좌표(X_COORDINATES, Y_COORDINATES)를 이용한 위치 매칭, 또는 공사명·기관명 같은 이름 매칭으로만 연결한다.
limits: 다른 데이터셋과 바로 붙일 공통 코드가 없어 연결은 이름·주소·좌표 매핑에 의존한다. 범위는 충청남도 한 시도에 한정된다. 호출에는 포털 활용신청으로 받는 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
