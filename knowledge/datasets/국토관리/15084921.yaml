description_portal: '○ 통계개요* 통계명 : 5년이내 이사계획* 통계종류 : 서울시민 5년이내 이사계획 유무 정보를 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을제시하는데 목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별ㆍ연령별ㆍ지역별 등)의 5년이내 이사계획 유무○ 기 타* 문항 : 귀하(댁)은 5년 이내 이사하실 계획을 가지고 있습니까? 이사를 계획하고 있는지역은 어디입니까? 이사 시 주거 점유 형태는 어떻게 하실 생각입니까?* 해당연도가 없는 것은 그해 조사항목에서 제외된 것임'
