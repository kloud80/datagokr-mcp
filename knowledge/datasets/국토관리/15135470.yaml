summary_user: 경기도 행정동별·시간대별·중분류업종별 카드매출을 기준년월 단위로 집계한 자료로, 매출금액과 비율·등급, 전월 및 전년 동월 대비 증감값·증감비율을 담는다. 상권 분석가나 창업 예정자가 특정 동네에서 어느 시간대에 어떤 업종 매출이 몰리는지, 작년보다 늘었는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 행정동코드(admdong_cd)를 이름·코드 매핑으로 행정구역 자료와 맞추거나 같은 기관의 다른 카드매출 자료와 이어 쓰며, 시간대·업종 코드의 뜻은 파일에 함께 제공되는 코드정보 압축파일로 풀어야 한다.
description_portal: 이 데이터는 경기도 내 특정 행정동에서 시간대별로 발생한 카드매출 정보를 제공하는 자료로, 기준년월을 기준으로 행정동코드, 시간대코드(TZ09, TZ10 등), 중분류업종코드(A0, L1 등), 매출금액, 매출금액비율, 매출금액등급, 전월 및 전년 동월 대비 증감값과 증감비율, 전년동월대비증감비율등급 등의 항목으로 구성되어 있습니다.- 대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.- 코드에 대한 정보는 파일 시트의 코드정보 압축파일에서 확인하실 수 있습니다.
