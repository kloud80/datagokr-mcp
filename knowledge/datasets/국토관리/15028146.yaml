summary_user: 울산광역시 중구 관내 배수펌프장을 시설별로 한 행씩 담은 소규모 현황표(CSV 약 1.2KB)로, 펌프장명·주소·설치일자·설치목적과 모터·엔진 펌프 규모, 한전 전원 공급 방식, 비상발전기 용량을 담는다. 구청 방재 담당자나 주민·분석가가 '집중호우 때 우리 동네 저지대 배수장은 펌프 용량과 비상전원을 얼마나 갖췄나'를 확인하고 배수장끼리 비교하는 데 쓴다. 전역 조인 키가 없어 다른 하천·침수 데이터와는 펌프장명이나 주소를 직접 맞춰 붙여야 한다.
