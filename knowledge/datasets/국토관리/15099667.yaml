summary_user: 광주광역시 상수도사업본부가 상수도 사용료·하수도 사용료·물이용부담금을 산정하는 데 쓰는 요율표로, 부과 구분과 업종(가정용·일반용·욕탕용·산업용), 사용량 구간별 세제곱미터당 단가를 담은 529바이트 분량의 작은 CSV 파일입니다. 광주 시민이나 사업자가 "우리 가게가 한 달에 물을 이만큼 쓰면 상하수도 요금이 얼마쯤 나오나"를 계산하거나, 분석가가 업종별 누진 구간을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종 이름이나 같은 기관 기준으로만 맞춰 이어 쓰며, 다른 지자체 요율표와 단가를 비교하는 용도가 대표적입니다.
description_portal: 광주광역시 상하수사업본부의 요금 및 물이용부담금 산정의 기준이 되는 세부 요율표 데이터입니다. 요금 부과 항목은 크게 상수도 사용료, 하수도 사용료, 물이용부담금으로 구성됩니다.사용 용도에 따라 가정용, 일반용, 욕탕용, 산업용으로 구분되며, 가정용은 단일 요율을 적용하나 일반용 등은 사용량 구간에 따라 단가가 상승하는 누진제 체계를 적용하고 있음을 보여줍니다. 이는 투명한 요금 행정을 구현하고, 수용가가 자신의 물 사용량에 따른 예상 요금을 확인하는 데 필수적인 기초 자료입니다.
