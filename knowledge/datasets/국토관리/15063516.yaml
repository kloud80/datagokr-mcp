summary_user: 전국 창업보육센터에 입주한 창업기업과 예비창업 기업을 한 행씩 담은 명단 파일로, 기업마다 지역·센터·기업명·업종·기업상태를 기록한다. 창업 지원 분석가나 투자·영업 담당자가 '우리 지역 보육센터에는 어떤 업종의 스타트업이 입주해 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 기업명·센터명·지역명을 이름으로 맞춰서만 연결하며, 사업자번호가 없으므로 공장 등록 자료와 바로 겹쳐 검증할 수는 없다.
description_portal: 창업보육센터 입주기업은 창업보육센터 내에서 사무공간과 각종 지원을 받으며 사업을 운영 중인 창업기업(중소기업을 창업하여 사업을 개시한 날부터 7년이 지나지 아니한 기업)  및 예비창업 기업들을 말합니다. 이 데이터는 입주기업의 지역, 센터, 기업명, 업종, 기업상태 등 다양한 정보를 포함하고 있어 창업 생태계의 현황을 파악하는 데 유용합니다. 특히, 지역별 산업 특성과 연계한 기업 분포나 성장 가능성 있는 스타트업을 식별하는 데 활용될 수 있으며, 창업 정책 개발, 투자 연계, 연구 분석 등 다양한 분야에 기초 자료로 제공됩니다.
