summary_user: 부산광역시 동구 안의 재개발·재건축 등 도시정비사업을 구역 단위로 한 줄씩 정리한 파일(CSV 약 2KB)로, 구역명·위치·개발유형·구역면적(㎡)·구역지정·조합설립·사업시행인가 여부와 사업방식·지정권자·시행자를 담는다. 동구에서 집을 사거나 투자하려는 사람이나 지역 분석가가 "이 동네 정비구역이 지금 조합설립 단계인지, 사업시행인가까지 갔는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(법정동코드·구역 코드 등)가 없어, 다른 구의 정비사업 현황이나 건축물대장과는 구역명·위치(행정동) 이름을 맞춰 연결해야 한다.
limits: 구역 이름과 행정동 수준 위치만 있어 좌표나 코드로 바로 붙일 수 없고, 범위는 동구 한 곳뿐이다. 명세상 연간 또는 이벤트 시점에 생성되는 자료라 관리처분·착공 같은 최신 단계 변화가 실시간으로 반영된다고 보면 안 된다.
