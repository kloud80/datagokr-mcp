description_portal: '부산광역시 동구 도시정비사업 현황 데이터 제공 안내본 자료는 부산광역시 동구 지역에서 추진 중이거나 완료된 도시정비사업의 전반적인 현황을 종합적으로 정리한 데이터입니다. 도시정비사업은 노후·불량 건축물의 정비와 주거환경 개선을 목적으로 하며, 재개발사업, 재건축사업 등 다양한 유형으로 구분됩니다. 이 데이터는 동구 내 정비사업의 추진 실태를 한눈에 파악할 수 있도록 구성되어 있으며, 다음과 같은 주요 정보를 포함하고 있습니다. 포함된 주요 정보 항목- 정비사업 유형: 재개발사업, 재건축사업 등 정비사업의 종류별 구분- 추진주체: 조합, 지자체, 민간사업자 등 사업을 주도하는 주체 정보- 정비구역 지정 여부: 해당 구역이 법적으로 정비구역으로 지정되었는지 여부- 사업시행계획 인가 여부: 사업 추진을 위한 행정 절차의 진행 단계- 사업단계별 현황: 정비계획 수립, 조합설립인가, 사업시행인가, 관리처분계획인가, 착공, 준공 등- 구역별 면적 및 위치: 각 정비사업 구역의 면적(㎡)과 행정동 기준의 대략적인 위치 정보- 사업 완료 여부: 해당 사업이 완료되었는지, 진행 중인지, 계획 단계인지에 대한 상태 정보'
