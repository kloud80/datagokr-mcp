summary_user: 경상북도개발공사가 청년에게 공급한 매입임대주택을 호(실) 단위로 담은 목록으로, 공급연도·지역명·주택명·주소·전용면적·방수·주택유형과 순위별(1순위, 2·3순위) 임대보증금·월임대료를 담는다. 경북(구미·포항·경산 등)에서 공공임대 거처를 찾는 청년이 "내 순위로 이 지역 원룸형 주택에 들어가면 보증금과 월세가 얼마인가"를 확인하거나, 분석가가 공공 매입임대 임대료를 주변 시세와 비교하는 데 쓴다. 전역 조인 키가 없어 주소나 지역명을 기준으로 전월세 실거래 등 다른 임대차 데이터와 이름·주소 매칭으로 이어 써야 한다.
limits: 실측 컬럼에 공통 조인 키(법정동코드·단지코드 등)가 없어 다른 데이터와 자동 결합되지 않고 주소·지역명 문자열 매칭이 필요하다. 신규 공급 때 현행화되는 공급 목록일 뿐 입주 현황·공실·모집 일정은 담지 않는다.
