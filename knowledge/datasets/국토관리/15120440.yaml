description_portal: 경상북도개발공사의 주거복지 사업인 매입임대주택 사업 중 청년들을 위해 공급하고 있는 매입임대주택 목록입니다. 지역명, 주택명, 전용면적, 임대보증금, 월 임대료 등으로 구성되어 있으며, 신규 임대주택 발생 시 해당 데이터를 현행화하여 개방하고 있습니다. 현재까지 구미, 포항, 경산 등의 지역을 대상으로 공급 완료하였으며, 전용면적의 경우 약 30m2 수준 입니다. 청년 1순위와 2,3순위를 별도로 구분하여, 임대보증금, 월임대료에 차등을 두었습니다. 다가구 주택, 원룸형 등의 주택유형으로 공급 중입니다.
