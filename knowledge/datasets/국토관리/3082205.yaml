summary_user: 부산 연제구 관내에 설치된 벽보게시판을 한 곳씩 담은 목록으로, 행정동·명칭·주소·게시대유형·벽보 가로·세로 규격과 위도·경도를 함께 담는다(약 4KB 분량의 CSV 파일). 주민이나 단체가 우리 동네 어디에 홍보물을 붙일 게시판이 있는지, 어떤 크기의 벽보가 들어가는지 확인할 때 쓴다. 전역 조인 키는 없어 행정동 이름이나 주소로 다른 자료와 맞추거나 위도·경도로 지도·공간 데이터에 겹쳐 쓴다.
description_portal: 본 데이터는 부산광역시 연제구에서 개방하고 있는 공공데이터 개방 목록 중의 하나로 관내 행정동별로 설치된 벽보게시판의 명칭, 설치위치, 주소, 게시대유형, 면수, 규격 등에 대한 정보를 포함하고 있습니다. 연제구 벽보게시판은 아파트 단지, 학교, 지하철역 등 다양한 공간에 설치하여 주민들의 다양한 홍보를 위해 운영되고 있는 생활밀착형 공공시설입니다. 이를 통해 각 지역 여건에 맞는 맞춤형 게시문화 조성 현황을 직관적으로 확인할 수 있습니다. 또한, 해당 자료를 통해 주민 밀착형 생활 인프라로서의 역할을 진단하고, 향후 공공 커뮤니케이션 기반 강화 및 수요자 중심의 정보 전달 정책 수립에 참고자료로 활용될 수 있으며, 나아가 수요자 중심의 게시문화 조성 및 효율적인 커뮤니케이션 체계 구축을 위한 참고자료로 제공됩니다.
