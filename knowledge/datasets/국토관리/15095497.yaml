summary_user: 경기도 의정부시 관내 가로수를 한 그루씩 관리번호 단위로 담은 건별 원천 파일로, 수종·식재일·위경도·도로명주소, 수고·수관폭·흉고직경 같은 생육 치수, 보호덮개·보호틀·지장물 여부 등 관리 상태를 담는다(CSV 약 5.9MB). 시 공원녹지 담당자나 도시환경 분석가가 '어느 도로·행정동에 어떤 수종이 얼마나 심겨 있고, 보도폭 대비 식재 간격이나 지장물 간섭이 문제인 구간은 어디인가'를 파악하는 데 쓴다. 전역 조인 키는 없어서 수목 위도·경도로 좌표 기반 공간 결합을 하거나 도로명·도로명주소·행정동 이름을 맞춰 다른 도로·행정구역 데이터와 이어 쓴다.
description_portal: '경기도 의정부시 관내 가로수정보 데이터로 관리번호, 수목명, 수목구분, 수목유형, 식재일, 관리기관전화번호, 관리기관명, 도로명, 도로종류, 도로시작점, 도로종료점, 수목위치, 수목위도, 수목경도, 도로명주소, 지번주소, 행정동, 수고, 수관폭, 흉고직경, 근원직경, 식재간격, 도로폭, 보도폭, 보호덮개, 보호틀, 통기_관수, 식재제한지역, 지장물여부, 데이타기준일자, 수목전경사진명, 보호덮개사진명 등의 항목으로 구성되어 있습니다.<데이터 활용성>1. 도시 환경 및 미세먼지 저감 관리:가로수 수종, 수량, 위치 데이터를 분석하여 미세먼지 저감, 대기 질 개선 효과를 과학적으로 평가,미세먼지 취약 지역을 대상으로 가로수 식재 최적화 및 보강 계획 수립 가능2. 열섬 현상 완화 및 기후 대응:가로수의 일사 차단 효과, 그늘 면적 데이터를 통해 도시 열섬 현상 완화 전략 수립, 수목 성장 데이터 기반으로 도시 기후 레질리언스(회복력) 설계 가능3. 교통 및 보행환경 개선: 가로수와 도로, 보도 간의 간섭 정보 제공으로 안전한 보행로 및 자전거 도로 설계에 활용 등'
