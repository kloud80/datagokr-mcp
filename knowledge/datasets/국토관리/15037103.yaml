summary_user: 충청북도 보은군에서 허가·협의된 개발행위를 건별로 담은 파일(csv)로, 읍면·리·번지로 표시한 위치, 용도지역, 행위 종류와 형질변경 여부, 허가면적, 허가일, 준공 예정일을 담는다. 토지 매입이나 인허가를 검토하는 사업자·주민이 '보은군 특정 읍면에서 어떤 용도지역에 어떤 개발행위가 얼마나 허가됐나'를 확인하는 데 쓴다. 전역 조인 키(법정동코드·PNU 등)가 없어 다른 데이터와는 읍면·리·번지 이름을 주소·지번 매핑으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 번지가 행정코드나 필지고유번호(PNU)로 정리돼 있지 않아 지적·공간 데이터와 바로 결합할 수 없고, 좌표가 없는 비공간 자료다. 명세상 연간 단위로 생성되는 자료여서 최신 허가 건이 바로 반영된다고 보기 어렵다.
