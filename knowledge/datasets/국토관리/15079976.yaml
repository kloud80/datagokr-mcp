summary_user: 전라남도 신안군의 2017~2019년 일반건축물 시가표준액을 건물(동·호) 단위로 담은 파일로, 과세연도별 물건지 주소(법정동·리·본번·부번), 시가표준액, 연면적, 기준일자를 행마다 담는다. 신안군에 건물을 가진 납세자나 세무·부동산 분석가가 특정 건물의 연도별 지방세 과세 기준 금액이 얼마였는지, 면적 대비 시가표준액이 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 건축물대장 등 다른 국토 정보와는 법정동·법정리·본번·부번으로 만든 주소 매칭이나 자치단체코드(같은 기관 코드)로만 이어 쓴다.
