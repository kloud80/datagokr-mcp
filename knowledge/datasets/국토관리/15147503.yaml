summary_user: 지방자치단체가 구축해 국토교통부가 취합한 「국토의 계획 및 이용에 관한 법률」상 용도지역·지구 현황 중 벽면지정선 자료를 전국 범위에서 시도별 파일(XLSX)로 담는다. 도시계획 실무자나 건축·부동산 사업자가 특정 지역에 건축물 벽면 위치를 제한하는 벽면지정선이 지정돼 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 용도지역지구 자료와는 지역 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
limits: 파일은 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별로 받으며, 포털 활용신청과는 별개다. 공통 조인 키가 없어 필지·건축물 데이터와 바로 결합하기 어렵다. 받은 파일의 컬럼명이 '테이블정의서', 'Unnamed' 등으로 읽혀 항목 의미를 따로 확인해야 한다.
