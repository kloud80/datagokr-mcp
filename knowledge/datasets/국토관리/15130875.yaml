summary_user: 경기도 민원 서비스 플랫폼 경기민원24의 민원 콘텐츠에 붙은 키워드를 건별로 담으며, 각 행은 키워드 일련번호(sn), 연결된 서비스 일련번호(servc_sn), 키워드 내용(kywd_info)으로 구성된다. 민원 주제별 분류·검색을 개선하려는 개발자나, 어떤 민원 서비스에 어떤 키워드가 달려 있는지 보고 민원 유형별 관심사를 살피려는 분석가가 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않아, 같은 경기민원24 계열 데이터와 서비스 일련번호나 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도의 민원 서비스 플랫폼인 경기민원24에서 제공하는 키워드 상세 정보를 담고 있으며, 민원 콘텐츠와 연계된 다양한 키워드와 그 식별 번호를 포함하고 있습니다. 각 키워드는 특정 서비스 일련번호와 연결되어 있어 행정 서비스 내에서 민원 주제별 분류와 검색 기능을 강화하는 데 활용될 수 있습니다. 이를 통해 민원인이 보다 쉽게 원하는 정보를 찾을 수 있도록 지원하며, 행정기관은 키워드 데이터를 기반으로 민원 유형별 관심사와 수요를 분석할 수 있고 데이터 분석 및 행정 혁신 연구에 적용될 수 있습니다.
