description_portal: '부산광역시 서구 내의 부동산거래 현황에 대한 데이터입니다.데이터에는 행정구역, 물건수, 토지면적, 건축물면적, 금액 등의 항목이 포함되어 있으며, 이를 통해 행정동별 부동산 거래량, 거래 면적, 거래 금액 규모, 동별 부동산 시장 특성을 확인할 수 있습니다.예시 데이터에는 동대신동, 서대신동, 부민동, 남부민동, 암남동 등 서구 주요 행정동별 부동산 거래 내역과 거래 총액, 면적 정보가 포함되어 있습니다.본 데이터는 지역별 부동산 시장 분석 등 다양한 분야에서 활용될 수 있습니다.** 항목별 설명행정구역: 행정상의 구역 단위 명칭물건수: 거래 건수량토지면적(㎡): 거래된 토지의 면적건축물면적(㎡): 거래된 건축물의 면적금액(백만원): 거래된 부동산의 총 금액 (단위: 백만원)'
