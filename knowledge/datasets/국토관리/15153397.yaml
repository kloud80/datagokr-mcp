summary_user: K-water 조사정보시스템에 수집된 전국 수위·유량 관측소의 시간 단위 관측값(수위 m, 표고수위 EL.m, 유량)을 관측소명별로 담은 건별 시계열 파일이며, 포털 설명상 2025년 1월~10월분을 다룬다. 하천·댐 관리 담당자나 수문 분석가가 특정 관측소에서 홍수기 동안 시간별 수위와 유량이 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 관측소코드가 아닌 관측소명으로 WAMIS 등 다른 수문 관측 자료와 이름 매핑해 이어 써야 한다.
