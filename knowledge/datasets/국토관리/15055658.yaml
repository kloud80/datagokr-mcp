summary_user: 전북특별자치도 14개 시·군(전주·군산·익산 등)별로 정부·지자체 지원 동네 소형 슈퍼마켓인 나들가게의 연도별 개점 수를 2010~2019년 기간에 대해 집계한 표로, 행은 연도(구분)이고 열은 시·군인 약 500바이트짜리 CSV 파일입니다. 골목상권 정책 담당자나 분석가가 '나들가게 개점이 어느 해에 몰렸고 이후 시·군별로 얼마나 줄었나'처럼 정책 시기별 효과와 도시·농촌 간 개점 추이를 비교하는 데 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어서, 다른 데이터와 이으려면 시·군 이름을 행정구역 코드에 직접 맞춰 매핑해야 한다.
description_portal: 이 데이터는 2010년부터 2019년까지 전북특별자치도 내 각 시·군별 나들가게의 연도별 개점 현황을 나타낸 자료입니다. 나들가게는 골목상권 활성화를 위해 정부와 지자체가 지원하여 개점한 동네 소형 슈퍼마켓 형태의 소매점입니다. 전주, 군산, 익산 등 14개 시·군을 대상으로 하며, 연도별 개점 수가 구체적으로 기록되어 있어 시기별 정책 효과나 상권 변화 추이를 파악하는 데 활용될 수 있습니다. 예를 들어, 2012년은 대부분의 지역에서 개점 수가 가장 많아 당시의 정책 강화 여부를 유추할 수 있으며, 이후 개점 수의 급감은 정책 변화나 자생력 변화 등을 분석하는 근거 자료로 활용 가능합니다. 본 데이터는 골목상권 정책 평가, 지역 소매업 변화 분석, 도시-농촌 간 소매점 분포 비교 등에 유용하게 활용될 수 있습니다. 시계열 분석을 통해 특정 연도의 정책 효과를 비교하거나, 특정 지역의 성장률 및 쇠퇴 양상을 분석할 수 있어 정책 수립 시 근거자료로도 매우 유용합니다.
