summary_user: LH 분양임대공고 중 사전청약 공고 한 건을 공고아이디로 지정해 그 공고의 공급 정보(지구명, 사전청약 세대수, 주택형, 블록명 등)를 조회하는 API로, 범위는 전국이며 공간 좌표는 없다. 사전청약을 준비하는 국민이나 분석가가 '이 사전청약 공고에서 어느 지구·블록에 어떤 주택형이 몇 세대 나오는가'를 확인하는 데 쓴다. 공고아이디는 분양임대공고문 조회 서비스(사전청약)에서 받아 넣는 구조이므로 그 서비스와 이어 쓰며, 실측 컬럼에는 다른 데이터와 묶을 전역 조인 키가 없어 지구명·블록명 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
description_portal: 분양임대공고문 조회 서비스(사전청약)에서 제공하는 공고아이디(PAN_ID)를 이용하여, 특정 공고의 사전청약 공급 정보(지구명, 사전청약 세대수, 주택형, 블록명 등)를 조회할 수 있는 서비스입니다.
