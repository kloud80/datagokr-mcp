summary_user: 서울특별시 양천구 도시공원 안에 설치된 세부시설(운동기구·놀이대·정자·화장실 등)을 시설 한 건씩 담은 원천 목록으로, 공원명·시설 구분·시설 종류·행정동·위도·경도·데이터 기준일자를 함께 제공한다. 양천구 주민이나 분석가가 '우리 동네 어느 공원에 화장실이나 운동기구가 있는가'를 찾거나, 행정동별 공원 시설 분포를 비교해 시설 확충이 필요한 곳을 가리는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 공원명·행정동명 같은 이름 매칭이나 위도·경도 좌표로 공간 결합해 잇고, 공원아이디(parkid)는 같은 기관 데이터 안에서만 연결 고리로 쓴다.
description_portal: 이 데이터는 서울특별시 양천구 공원에 설치된 세부 시설의 현황을 정리한 공공데이터이다. 주민의 여가, 운동, 휴식, 놀이 등을 위한 공원 시설 정보를 제공하며, 도시녹지 관리와 공공공간 개선 정책 수립을 위한 기초자료로 활용된다. 주요 항목은 공원명, 시설유형, 위치, 설치연도, 관리 주체, 규모, 이용 가능 여부 등이 있으며, 운동기구, 놀이대, 정자, 벤치, 화장실, 음수대, 산책로 등 다양한 시설의 분포와 특성을 확인할 수 있다. 이를 통해 실외공간 활용도 분석, 공원 서비스 개선, 인프라 확충계획 수립 등에 유용하다. 본 데이터는 양천구청에서 관리하며, 현황 점검과 정기적인 정보 갱신을 통해 데이터의 최신성과 정확성을 유지한다.
