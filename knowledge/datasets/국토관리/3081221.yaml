description_portal: '강원특별자치도 18개 시군의 월별 강수량 자료를 제공합니다. - 제공데이터 : 시군별, 연도별, 월별(1월~12월) 강수량 통계자료■ 강수량 개념° 강수량: 비나 눈, 우박 등과 같이 구름으로부터 땅에 떨어져 내린 강수의 양° 어느 기간 동안에 내린 강수가 땅 위를 흘러가거나 스며들지 않고, 땅 표면에 괴어 있다는 가정 아래 그 괸 물의 깊이를 측정- 눈·싸락눈 등 강수가 얼음인 경우에는 이것을 녹인 물의 깊이를 측정- 비의 경우에는 우량 또는 강우량이라고도 하며, 단위는 ㎜로 표시■ 강수량 통계° 강수량 값은 1973년 이후 기상청 관측지점 수가 급증하여 안정적으로 연속관측을 수행한 62개 지점의 통계값을 사용° 연값은 당해년(1월~12월)으로 하였음° 계절구분은 봄(3-5월), 여름(6-8월), 가을(9-11월), 겨울(당해년12-다음해1,2월)로 하였음° 강수량은 기간동안의 강수량 합계로 계산됨■ 의의 및 활용도° 이 통계는 전국평균 데이터이며, 전국평균값은 전문자료로 사용하기보다는 참고용으로 사용하는 값임° 10년간의 계절별 강수량 변화 현황을 통해 기후변화 경향을 파악할 수 있음'
