summary_user: 대구광역시 북구에 설치된 화분대를 노선·구간·행정동 단위로 담은 현황 데이터로, 조성 연도, 설치 수, 폭·연장·면적, 식재 수종과 교목·관목 본수를 함께 담는다. 구청 조경 담당자나 분석가가 '북구 어느 노선·행정동에 화분대가 얼마나 있고 어떤 수종이 심겨 있는가'를 확인해 유지보수 계획이나 민원 응대에 쓴다. 전역 조인 키가 없어 행정동 이름이나 노선명을 기준으로 다른 북구 가로녹지·도로 데이터와 이름 매핑으로만 이어 쓴다.
description_portal: 이 서비스는 사용자가 지정한 입력 파라미터를 기반으로 대구광역시 북구 지역 내 설치된 화분대의 세부적인 현황을 조회할 수 있도록 제공합니다. 노선 명, 구간, 행정동과 같은 위치 기반 정보뿐만 아니라, 조성 연도, 설치 수량, 폭, 연장 거리, 면적 등의 공간적 특성, 그리고 식재된 수종 명, 교목·관목·초본 등의 상세 식물 분포 현황을 포함하여 화분대의 다양한 구조 및 조경 정보를 종합적으로 조회할 수 있습니다. 이를 통해 도시 조경 유지보수 및 계획 수립에 필요한 정확한 자료는 물론 보고서 작성, 정책 평가, 민원 응대 등에 활용 가능한 통합 데이터를 제공할 수 있습니다.
