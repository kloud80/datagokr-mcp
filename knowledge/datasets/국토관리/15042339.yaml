summary_user: 춘천시 산업단지·농공단지 등에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일로, 단지명·회사명·업종명·전화·팩스번호·종업원수·생산품·주원자재·데이터 기준일자를 담는다. 구직자나 영업 담당자가 '춘천의 어느 단지에 어떤 업종의 기업이 몇 명을 고용하고 있나'를 확인하거나, 분석가가 단지별 업종·생산품 분포를 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 산업단지 현황이나 공장 등록 자료와는 단지명·회사명 같은 이름을 맞춰 연결해야 한다.
limits: 실측 컬럼에서 사업자등록번호 같은 조인 키가 확인되지 않았다. 따라서 공장 등록과 사업자번호로 대조해 검증하려면 이름 매핑에 의존해야 한다. 이 데이터에는 용지 분양·임대·미분양이나 개발·조성 정보가 들어 있지 않다.
