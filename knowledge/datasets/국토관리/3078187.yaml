summary_user: 인천광역시 남동구에서 이루어진 건축신고·건축허가를 건별로 담은 파일로, 건축구분·대지위치·지목·대지·건축·연면적·구조·허가(신고)일·착공처리일·지상·지하 층수·주용도·설계·감리·시공 사무소명을 기록하며 파일 크기는 약 2KB(1956 bytes)로 작다. 지역 개발 흐름의 선행 지표로서 남동구에서 최근 어떤 용도·규모의 건물이 허가되고 착공됐는지를 살피는 분석가나 주민이 쓴다. 실측 컬럼에 전역 조인 키(건물·필지 고유번호 등)가 없어 다른 건축물대장·인허가 데이터와는 대지위치(주소) 문자열 매칭으로만 이어 쓴다.
description_portal: 이 공공데이터는 인천광역시 남동구에서 이루어지는 건축신고 및 건축허가 관련 정보를 종합적으로 제공하는 데이터입니다. 해당 자료는 지역 내 건축 활동의 현황을 파악할 수 있도록 구성되어 있으며, 세부 항목은 건축구분, 대지위치, 지목, 대지면적(㎡), 건축면적(㎡), 연면적(㎡), 구조, 허가일(신고), 착공처리일, 최대지상층수, 최대지하층수, 주용도, 부속용도, 설계사무소명, 감리사무소명, 시공자사무소명으로 구성되어 있습니다. 이 데이터는 건축 추세 분석, 도시계획 수립, 안전관리 강화 등 다양한 행정 및 연구 목적에 활용될 수 있으며, 지역 건축환경을 투명하게 공개하는 데에도 기여합니다.
