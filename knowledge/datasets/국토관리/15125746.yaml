summary_user: 서울특별시 조사지점별 조류 출현 현황을 개별 위치(주소·좌표) 단위로 담은 공간정보로, 출현 종수·전체 종수, 서울시 보호종·멸종위기종·천연기념물·고유종 수, 둥지·먹이 활동 유형(수관층·관목층·지표 등), 식생·토지 유형, 자치구명, 조사연도 등을 포함한다. 생태 분석가나 도시계획 담당자가 '서울에서 보호종 조류가 많이 출현하는 지역은 어디이고, 그곳의 식생·토지 유형은 무엇인가'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없어 자치구명(ATNM_DSTC_NM)이나 좌표를 기준으로 다른 서울시 생태·토지이용 공간정보와 이름·위치 매칭으로 이어 쓴다.
