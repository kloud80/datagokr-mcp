summary_user: 성남시 관내 주택건설사업계획 승인 건별로 사업구분, 승인일, 대지위치, 사업주체, 대지·건축·연면적, 동수, 세대수, 착공일, 준공예정일을 담은 시군구 범위의 파일 데이터입니다. 성남에서 언제 어느 위치에 몇 세대 규모의 주택 공급이 승인됐고 언제 준공될 예정인지 확인하려는 주민·사업자·주거정책 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치 주소나 사업주체 이름을 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: '성남시내 주택건설사업계획 승인에 대한 자료이며 사업구분,승인일,대지위치,사업주체,대지면적,건축면적,연면적,동수,세대,착공일, 준공예정일의 항목으로 구성되어 있습니다.  관내에서 추진되는 주택건설사업에 대해 인허가된 사항들을 체계적으로 정리한 행정 자료입니다. 이 데이터는 「주택법」 제15조에 따라 일정 규모 이상(예: 30세대 이상)의 주택을 건설하려는 사업자가 지자체장 또는 국토교통부장관에게 제출한 사업계획에 대해 행정기관이 승인한 내역을 포함합니다. 이 데이터는 성남시의 주거정책 수립, 인구유입 대응 전략, 도시계획 조정, 기반시설 수요 예측 등에 중요한 기초 자료로 활용됩니다.'
