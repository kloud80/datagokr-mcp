summary_user: 부산광역시 남구 관할 공동주택의 하자보수보증금 증권 예치 현황을 건물 한 건씩 담은 파일로, 지번주소·건물명·건축주·세대수·증권금액·보증보험회사·사용승인일·반환여부를 기록한다. 입주예정자나 관리주체가 특정 단지의 하자보수 보증 증권이 어느 보험사에 얼마로 예치돼 있고 이미 반환됐는지 확인할 때 쓴다. 전역 조인 키가 없어 K-apt 단지 정보나 실거래 자료와는 건물명·지번주소를 맞춰 이어 써야 한다.
description_portal: 주택법 제46조에 따라 공동주택을 건축한 건축주는 사용승인을 신청할 시, 총 공사비의 100분의 3에 해당하는 하자보수보증금을 금융기관에 예치하고, 해당 예치에 대한 증서를 관할 구청에 제출하여야 합니다. 이는 입주 후 발생할 수 있는 하자에 대비하여 보수를 원활히 진행할 수 있도록 하기 위한 제도적 장치입니다. 해당 하자보수보증금 관련 자료에는 건축물의 위치, 예치금액, 예치기관, 예치일자 등의 정보가 포함되며, 구청에서는 이를 바탕으로 사후 하자보수 이행 여부를 점검하고 관리할 수 있습니다.
