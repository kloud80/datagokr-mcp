summary_user: 제주국제자유도시개발센터가 운영하는 제주국제학교 브랭섬홀 아시아(BHA)의 2017-2018학년도 학생현황을 주니어 준비·주니어·시니어와 1~12학년별로 정리한 집계 파일이며, 승인정원·운영학급수·남녀 학생 수·내외국인 학생 수를 담는다(csv 473바이트 규모). 국제학교 진학을 알아보는 학부모나 영어교육도시·국제학교 정책을 보는 분석가가 학년별 정원 대비 학급 운영 상황과 내국인·외국인 학생 비율을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 국제학교 학생현황 파일과는 학년 이름이나 같은 기관 기준으로 맞춰 비교한다.
description_portal: '제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주국제학교 중 하나인 브랭섬홀 아시아(BHA)의 2017-2018학년도 기준 학생현황 정보입니다. 이 데이터는 BHA의 학년별 학생 분포와 학교 운영 현황을 확인할 수 있는 자료로, 각 항목은 구분(2017-2018학년도), 과정, 승인정원, 운영학급수, 성별(남), 성별(여), 국적별(외국인), 국적별(내국인)으로 구성되어 있습니다. 구분 항목에는 주니어 준비, 주니어, 시니어를 포함하여 1학년부터 12학년까지의 전체 학년 체계가 포함되어 있으며, 과정 항목은 해당 학년이 포함된 교육 단계(예: 유치, 초등, 중등, 고등 등)를 나타냅니다. 승인정원은 해당 학년별 최대 수용 인원 수를 의미하고, 운영학급수는 실제로 운영 중인 학급 수를 나타냅니다. 또한 성별 및 국적별 분류를 통해 남학생과 여학생, 외국인 학생과 내국인 학생의 비율을 확인할 수 있어, 브랭섬홀 아시아의 국제학교로서의 특성과 학급 운영 현황을 종합적으로 분석하는 데 유용한 정보를 제공합니다.'
