description_portal: '해당 자료는 부산광역시 사상구 3년간 미준공 착공신고현황(허가구분, 허가번호, 대지면적, 건축면적, 연면적, 건폐율, 용적률 등) 항목을 제공합니다.데이터 기준일: 2026. 04. 09.미준공 착공신고현황이란 착공 후 공사가 완료되지 않아 아직 사용승인(준공검사)을 받지 못한 상태의 건축물을 말합니다. 이후 준공 후 사용승인을 받아야 정식 건축물로 등록되고 법적 권리 행사가 가능합니다. 아울러, 사용승인을 받지 않고 건축물을 사용하게 될 경우 건축법 위반에 따라 이행강제금이 부과될 수 있습니다.'
