summary_user: 제주도 읍면동·업종·성별·연월 단위로 카드 이용자수와 이용금액을 집계하고, 같은 단위의 거주·근무·방문 유동인구 연월 합계를 붙인 매쉬업 결과 파일이다(CSV 약 9.5MB). 상권 분석가나 창업 준비자가 '어느 읍면동에서 방문인구가 늘 때 어떤 업종의 카드 매출이 함께 늘었나'를 살펴보는 데 쓴다. 실측 컬럼에 행정동 코드 같은 전역 조인 키가 없어, 다른 데이터와는 읍면동명·업종명·연월을 이름으로 맞춰 이어 쓴다.
limits: 표준 행정코드가 없어 다른 데이터와 붙일 때는 읍면동명 이름 매핑이 필요하고 표기 차이에 주의해야 한다. 유동인구는 매시 정각 측정값을 머문 시간 비율로 환산해 연월별로 합한 값이라 실제 방문자 수와 같지 않다. 카드 매출과 유동인구를 결합한 집계값이므로 개별 점포·개별 거래 단위 분석은 할 수 없다.
