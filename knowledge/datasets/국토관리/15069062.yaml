summary_user: 주택관리공단이 관리하는 임대주택 단지 내 임대상가의 입점자(예비입주자) 모집 공고를 공고 건별로 담은 전국 단위 파일로, 관리소명·공고일·신청접수 기간·당첨자 발표일·전용면적·모집호수·계약금·잔금·월임대료가 들어 있다. 공공임대단지 상가에 입점하려는 소상공인이 어느 관리소에서 어떤 면적의 상가를 얼마의 보증금과 월임대료로 모집했는지 확인하거나, 분석가가 임대상가 임대료 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리소명·단지명 같은 이름 매핑으로만 연결한다.
limits: 공통 코드나 키가 없어 단지 정보나 주소 데이터와 정확히 조인하려면 관리소명을 수작업으로 매핑해야 한다. 명세상 연간·이벤트 주기로 생성되는 파일이므로 현재 진행 중인 모집 공고를 실시간으로 확인하는 용도에는 맞지 않는다.
