summary_user: 부산광역시 구·군별 공개공지(건축주가 용적률 등 혜택을 받는 대신 대중에게 휴게공간으로 내놓은 땅)를 한 곳씩 담은 건별 데이터로, 해당 건물명·도로명/지번 주소·위도·경도·공개공지 면적·위치·편의시설, 건물의 연면적·층수·용도·허가일·사용승인일을 포함한다. 시민이 '우리 동네나 나들이 가는 곳 근처에 쉴 수 있는 공개공지가 어디 있고 어떤 시설이 있나'를 찾거나, 분석가가 구·군별 공개공지 분포와 면적을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 구군명(gugun)으로 매칭해 이어 쓴다.
description_portal: '부산광역시_구군 공개공지 현황데이터입니다. 공개공지는 의자, 표지판, 조명등, 조형물, 조경, 파고라, 미술장식품 등이 설치되어 있는 시민들이 편하게 쉴 수 있는 공간입니다. 도심 녹지가 없어지고 건축물들이 많아지는 상황에서 공개공지의 존재는 삶에 지치거나 힘든 시민들 또 나들이 중 잠시라도 쉴수 있어 시민들의 삶의 질 향상에 도움이 될것입니다. 본 데이터에는 공개공지의 주소, 면적, 해당건물의 명칭 및 규모, 위도, 경도용도, 공개공지의 위치, 등이 포함되어 있습니다. 강서구 11, 금정구 66, 남구 44, 동구 134, 동래구 70, 수영구 70, 부산진구 200, 북구 30, 사상구 57, 사하구 34, 서구 37, 연제구 94, 영도구 41, 중구 55, 해운대구 219  등 부산시 전체 1,162개의 공개공지가 있습니다.* 공개공지: 건축법에 규정된 개념으로 도심에서 건물을 짓는 건축주가 용적률 등 혜택을 받는 대신 땅 일부를 대중에게 휴게공간 등으로 제공*기준일 2025.5.17 현재'
