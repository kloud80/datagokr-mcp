description_portal: 서울시 생활권계획 시설(버퍼) 공간정보 데이터는 생활권계획에 따라 주요 시설 주변의 영향 범위를 버퍼 형태로 표현한 GIS 공간데이터입니다. 파일 형식은 cpg, dbf, shp, shx로 구성된 쉐이프파일이며, 좌표계는 Bessel 1841 타원체 기반의 TM 직각좌표계인 EPSG:5174를 사용하고 있습니다. 인코딩 방식은 windows-949입니다. 이 데이터를 활용하면 생활권 내 공원, 문화, 복지, 교육 등 각종 생활편의시설의 서비스 권역과 접근성을 공간적으로 분석할 수 있습니다. 또한 도시계획, 생활SOC 확충, 시설 입지 적정성 검토 등 시민 생활환경 개선을 위한 정책 수립의 기초 자료로 활용할 수 있는 유용한 정보입니다.
