summary_user: 충청남도 홍성군 갈산전통시장의 시장명·상점명·상점 유형·판매품목·영업시간·주소와 위도·경도 등을 상점 단위로 담은 개별 원천 데이터이며, 범위는 홍성군 한 개 시군구입니다. 시장을 찾는 주민이나 방문객이 '갈산전통시장에서 어떤 가게가 무엇을 팔고 언제 문을 여는지, 주차장·공중화장실이 있는지'를 확인하거나, 분석가가 지역 전통시장 점포 구성을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시장명·주소 같은 이름 매칭이나 위도·경도(lat, lot) 좌표로만 이어 쓴다.
limits: 공통 코드나 전역 식별자가 없어 다른 시장·상권 데이터와 자동으로 연결되지 않고 이름·주소·좌표로 직접 맞춰야 한다. 범위가 홍성군 갈산전통시장에 한정되어 다른 시장이나 지역과의 비교에는 별도 데이터가 필요하다. 호출은 포털 활용신청(자동승인) 후 serviceKey가 필요하며 개발계정은 하루 8,000회로 제한된다.
