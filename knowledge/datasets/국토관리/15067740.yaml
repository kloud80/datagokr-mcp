summary_user: 울산시설공단 하늘공원 화장시설의 회차별 시작·종료시간, 이용대상, 화장구분과 대인(14세 이상)·소인(13세 이하)·사산아·개장유골별 사용료를 기준일자와 함께 담은 소규모 운영 안내 파일(csv, 약 1.7KB)이다. 장례를 준비하는 유족이 하늘공원에서 화장할 때 어느 회차를 고를 수 있고 고인의 연령·유형에 따라 사용료가 얼마인지 미리 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(울산시설공단)이나 화장구분·이용대상 같은 이름 매핑으로만 이어 쓴다.
description_portal: '울산시설공단 하늘공원은 시민들의 장례 절차를 원활하게 진행할 수 있도록 화장시설 운영에 대한 상세 정보를 제공합니다. 제공되는 화장정보 데이터는 회차, 시작시간, 종료시간, 이용대상, 화장구분, 사용료(대인: 14세 이상), 사용료(소인: 13세 이하), 사용료(사산아), 사용료(개장 유골), 기준일자 등 다양한 항목으로 구성되어 있어, 이용자는 본인의 상황에 맞는 회차와 시간대를 선택하고, 요금 정보를 사전에 파악할 수 있습니다. 특히 연령별, 사망 유형별, 유골 개장 여부에 따른 요금 구분이 명확하게 되어 있어 투명한 비용 안내가 가능하며, 효율적인 장례 절차 준비에 큰 도움이 됩니다. 기준일자 항목을 통해 요금 적용 시점을 확인할 수 있어 최신 정보를 바탕으로 한 이용이 가능하고, 체계적인 화장 시설 운영을 통해 시민들의 편의와 신뢰를 동시에 제공하고 있습니다.'
