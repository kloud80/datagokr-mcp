summary_user: 국토교통부 지구단위계획 도형과 속성 정보를 외부 API(vworld)로 조회하는 데이터로, 전국 범위에서 구역 단위의 도형·분류·명칭 정보(대·중·소분류, 시군구명, 면적·길이 등)를 담는다. 국민이나 분석가가 특정 지역이 지구단위계획구역에 해당하는지, 어떤 분류의 계획이 결정돼 있는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시군구명(sig_nam) 같은 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
