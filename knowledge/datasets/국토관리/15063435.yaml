description_portal: 한국토지주택공사에서 제공한 서울시 각 자치구의 공공임대주택 유형별 주택 수를 2017년부터 2019년까지 정리한 통계입니다. 공급유형에는 공공임대(10년), 국민임대, 장기전세, 영구임대, 매입임대, 행복주택 등이 포함되어 있으며, 총 52건의 자료가 수록되어 있습니다. 이 데이터는 구별 공급 규모와 유형 변화를 비교하거나 정책 분석, 공급 편중 여부 등을 파악하는 데 유용하게 활용하실 수 있습니다. 다만 기준 시점이 2019년 말이므로 현재와는 차이가 있을 수 있습니다. 본 데이터는 1회성 데이터로서 정해진 업데이트 주기가 없습니다.
