summary_user: 서울시 자치구별·공급유형별(공공임대 10년, 국민임대, 장기전세, 영구임대, 매입임대, 행복주택 등) 공공임대주택 수를 2017~2019년 연도별 열로 정리한 집계 통계이며, 52행의 작은 CSV 파일이다. 정책 분석가나 연구자가 '서울에서 공공임대주택이 어느 자치구에 몰려 있고, 2017~2019년 사이 유형별 공급이 어떻게 달라졌나'를 비교하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없으므로, 자치구 이름(구)을 행정구역 코드에 매핑해야 인구·전월세 실거래 같은 다른 구별 통계와 이을 수 있다.
limits: 기준 시점이 2019년 말인 1회성 자료로 정해진 갱신 주기가 없으므로, 현재 재고 파악에는 쓰지 못한다. 단지 단위가 아닌 구·유형별 합계라 개별 단지나 동 단위 분석은 할 수 없다. 메타데이터 범위는 전국으로 표기돼 있지만, 실제 내용은 서울시 자치구에 한정된다.
