description_portal: '○ 통계개요* 통계명 : 물재생센터 하수처리(2006이후)* 통계종류 : 서울시 물재생센터 시설 및 하수처리 현황 등을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 하수관련 현황을 조사ㆍ분석하여 시설의 적정 설치 및 관리를 위한정책수립의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 시도 → 환경부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당시설 및 자치구내용 - 서울시 물재생센터 시설용량 및 하수처리량, 연계처리량, 방류수역 등○ 용어설명* 시설용량 : 1일 처리가능한 용량(고정된 수치)* 처리량 : 1일 처리량(연평균)- 물리적(1차) : 침전만 시키는 수준- 생물학적(2차) : 약품처리- 고도(3차) : 질소, 인을 뽑아내어 방류수질을 높여주는 것○ 기 타* 2001년 가양하수처리장 → 서남물재생센터로 변경○ 출 처 : 서울특별시 물재생계획과'
