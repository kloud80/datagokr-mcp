summary_user: 경기도 고양시에 하수도법에 따라 등록된 개인하수처리시설 관련 영업자(설계시공업·관리업·분뇨수집운반업)를 업체 한 곳당 한 행으로 담은 명단으로, 업체명·업종·등록일·주소·전화번호가 들어 있는 3KB 남짓의 작은 CSV 파일이다. 고양시 시민이나 건물주가 정화조 청소나 개인하수처리시설 설치·관리를 맡길 등록 업체를 찾을 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 주소나 업체명을 맞춰 보는 방식으로만 이을 수 있다.
description_portal: '본 데이터는 하수도법에 따라 경기도 고양시에 등록된 개인하수처리시설 관련 영업자 현황(업체명, 업종, 등록일, 주소, 전화번호 등)에 대한 공공데이터로 개인하수처리시설관련 업체명, 등록일, 주소, 전화번호 등을 알 수 있습니다.시민들에게 신뢰할 수 있는 영업자 정보를 제공하여 개인하수처리시설의 적정 설치 및 유지관리를 통한 공공수역의 수질 개선을 목적으로 함.- 개인하수처리시설 설계시공업: 개인하수처리시설을 설계, 시공하는 영업자- 개인하수처리시설 관리업: 개인하수처리시설을  관리하는 영업자- 분뇨수집운반업: 분뇨를 수집, 운반하는 영업자'
