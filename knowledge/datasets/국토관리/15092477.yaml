summary_user: 대구광역시 서구 관할에서 추진 중이거나 준공된 공동주택 건설사업(주로 재개발·재건축 정비사업)을 사업구역 한 건당 한 행으로 정리한 소규모 목록 파일(CSV 956바이트)이다. 각 행에는 구역명, 위치, 총세대수, 시공사, 착공(예정)일, 준공(예정)일, 비고가 들어 있다. 서구 주민이나 부동산 분석가가 "평리동·내당동·비산동 일대에 언제 몇 세대가 준공되고 시공사는 어디인가"를 확인하는 데 쓰고, 지역 주택공급 일정을 가늠하는 데에도 쓴다. 전역 조인 키가 없으므로 K-apt 단지정보, 실거래가, 분양·청약 자료와는 구역명·위치·시공사 이름을 직접 맞춰서 잇는다.
description_portal: 대구광역시 서구 내 공동주택 시공 현황에 대한 자료입니다. 데이터 등록일 기준 시공중인 공동주택들의 목록과 위치, 완료 예상 시기 등의 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 관할 지역 내 추진 중이거나 완료된 공동주택 건설사업의 시공 현황을 종합적으로 정리한 자료이다. 주요 항목으로는 구역명, 위치, 총세대수, 시공사, 착공일 및 준공예정일, 비고 등이 포함되어 있으며, 재개발 및 재건축 정비사업을 중심으로 공동주택 건립 진행 상황을 확인할 수 있다. 평리동, 내당동, 원대동, 비산동 등 각 사업구역별 위치와 세대 규모, 공사 일정 및 시공사의 정보를 제공함으로써 해당 지역 내 주택공급 계획과 개발 진행 상황에 대한 이해를 돕는다. 특히, 준공 여부나 부분준공 등 사업의 단계별 상태가 명시되어 있어 향후 주거정책 수립, 지역개발계획 수립, 인구유입 분석 등 행정적 활용 가치가 높다. 민간 및 공공부문의 주택개발 현황을 파악하는 데 필요한 기초자료로 활용될 수 있다.
