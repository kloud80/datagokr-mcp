summary_user: 경상남도 18개 시군의 지가변동률을 시군구 단위로 정리한 집계 파일로, 포털 설명상 2013년부터의 값을 담으며 내려받은 CSV는 744바이트의 작은 표다. 경남에서 토지 거래나 개발사업을 검토하는 사업자·분석가가 "어느 시군의 땅값이 최근 많이 올랐나"를 비교하는 데 쓴다. 표준 행정구역 코드 같은 조인 키가 없어서, 다른 시군구 단위 통계(인구·개발사업·공시지가 등)와 이어 쓰려면 시군구 이름을 직접 맞춰야 한다.
