description_portal: 경상남도 토지 공시지가 변동률(2026년 기준)에 대한 데이터로 2013년부터 도내 18개 시군의 지가변동률 데이터 입니다.한국부동산원이 고시하는 지가변동률은 전국 토지의 가격 수준이 일정 기간 동안 어떻게 변동했는지를 나타내는 토지가치 증감 비율입니다. 용도지역, 지목, 이용상황, 주변 개발·교통여건 등을 종합적으로 조사하여 표본토지를 평가한 뒤 산정합니다. 이 지표는 토지시장 경기 판단, 개발사업 타당성 검토, 공공부문 재정·세제 운용, 지가관리 및 각종 행정계획 수립의 기초자료로 활용되며, 지방자치단체의 행정결정에도 중요한 참고값이 됩니다.
