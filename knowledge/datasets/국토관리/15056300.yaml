description_portal: 이 데이터셋은 경상남도 내 정보화마을 조성 현황을 제공하며, 각 마을의 명칭, 전화번호, 공식 홈페이지 주소, 특산물 쇼핑 품목, 주변 관광지 등의 정보를 포함하고 있습니다. 정보화마을은 지역 주민의 정보 활용 능력 향상과 지역경제 활성화를 목적으로 조성된 공동체 기반 마을로, 해당 자료는 경남 각 지역의 정보화 추진 현황, 지역 특산물 유통, 관광 자원 연계 등을 종합적으로 파악하는 데 활용될 수 있습니다. 행정기관의 정책 자료뿐 아니라, 지역경제 분석, 관광자원 조사, 디지털 지역격차 해소 연구 등 다양한 목적에 활용이 가능합니다.
