summary_user: 경기도 행정동(읍면동) 단위로 카드 매출을 기준년월·요일·중분류업종별로 집계한 자료로, 매출금액과 업종별 상대 비중인 활성화비율을 담는다. 소상공인이나 상권 분석가가 '우리 동네에서 어떤 업종이 무슨 요일에 매출이 많은가'를 확인하거나, 지자체가 업종별 지원 근거를 마련할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(admdong_cd)나 업종코드를 다른 자료의 이름·코드와 직접 맞추거나 같은 기관의 경기도 카드매출 분석 자료와 같은 코드로 연결해 쓴다.
description_portal: 이 데이터는 경기도 행정동 단위에서 카드 매출을 요일별·업종별로 집계한 자료로, 특정 시점의 지역 소비 패턴을 분석할 수 있도록 구성되어 있습니다. 주요 항목으로는 ‘기준년월’을 통한 시계열 구분, ‘행정동코드’를 통한 공간적 구분, ‘중분류업종코드’를 통한 업종별 소비 구분이 있으며, ‘매출금액’과 ‘활성화비율’은 각 업종의 소비 규모와 상대적 활성도를 보여줍니다. ‘활성화비율’은 업종별 소비의 상대적 비중을 나타내는 지표로, 상권 활성화 진단이나 업종별 소비 특성 파악에 활용됩니다. 이 데이터는 지역경제 동향 분석, 요일별 소비행태 연구, 업종별 정책 지원 근거 마련, 소상공인 맞춤형 마케팅 전략 수립 등에서 유용하게 사용될 수 있습니다.
