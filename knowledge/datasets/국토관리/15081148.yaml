summary_user: 대전광역시 상수도사업본부의 2024년 노후관 개량공사와 블록구축 정비사업을 사업 건별로 담은 파일로, 담당 부서(수도시설관리사업소·동부·중부·서부·유성·대덕사업소)별 사업명, 관구경과 연장으로 표기한 사업량, 추진실적 연장을 담는다. 대전 시민이나 분석가가 "우리 구를 맡은 사업소가 올해 노후 상수도관을 얼마나 교체했나"처럼 사업소별 공사 건수와 정비 연장을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소 이름 매핑이나 같은 기관(대전 상수도사업본부)의 다른 자료와 이름으로 맞춰 이어 써야 한다.
description_portal: 대전광역시 상수도사업본부의 2024년 노후관 개량공사 및 블록구축 정비사업(공사)에 대한 추진실적 자료입니다. 해당사업을 담당하는 부서는 수도시설관리사업소, 동부사업소, 중부사업소, 서부사업소, 유성사업소, 대덕사업소가 있으며 각 부서에서 담당하고 있는 사업명과 사업량(관구경과 연장)을 표기하였으며 연장을 따로 추진실적으로 구분하여 추가 표기하였습니다. 수도시설관리사업소에서는 7건, 동부사업소 8건, 중부사업소 6건, 서부사업소 5건, 유성사업소 6건, 대덕사업소 6건의 공사를 수행하였습니다.
