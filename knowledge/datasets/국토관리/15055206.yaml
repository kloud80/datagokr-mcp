description_portal: '인천광역시의 지가변동률 현황 공공데이터는 시내 **행정구역별(군/구별)**로 토지 가격이 변동된 비율을 집계한 통계 자료입니다. 이 데이터는 지역 부동산 시장의 동향과 토지 투자의 활성화 정도를 파악하며, 지역 개발 정책 등의 기초 자료로 활용됩니다.-용도지역별 변동률: 녹지, 농림, 자연환경보전, 보전관리, 생산관리, 계획관리 등-용도상황별 변동률: 전, 답, 주거용대지, 상업용대지, 임야, 공장 등해당 데이터는 국가통계포털(KOSIS)에서 참고하였으며, 공공데이터포털에서  CSV파일로 무료로 다운로드가 가능합니다.'
