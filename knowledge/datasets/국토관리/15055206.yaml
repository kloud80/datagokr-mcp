summary_user: 인천광역시 군·구별로 토지 가격이 변동된 비율을 집계한 통계 파일로, 평균 변동률과 용도지역별(주거·상업·공업·녹지·관리지역 등)·이용상황별(전·답·주거용대지·상업용대지·임야·공장) 변동률을 담으며 CSV 파일 크기는 1,109바이트로 작다. 부동산 분석가나 투자자가 인천 안에서 어느 군·구의 어떤 용도 토지가 가격이 많이 올랐는지 비교할 때 쓴다. 표준 행정구역코드 같은 공통 조인 키가 없어, 다른 데이터와는 군·구 이름을 맞춰 연결해야 한다.
