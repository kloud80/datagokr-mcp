description_portal: 본 데이터는 남양주시 개발행위허가현황 데이터로, 허가일자, 읍면동, 지목, 대장면적, 신청면적, 건축부지, 도로부지, 용도지역, 허가목적 등의 항목을 포함하고 있습니다. 개발행위허가는  국토의 계획 및 이용에 관한 법률에 따라 토지의 형질변경, 건축물의 건축·증축, 공작물 설치, 토석 채취, 토지 분할, 물건 적치 등 “토지 이용 상태를 실질적으로 변경하는 행위”를 하기 전에 지자체장의 사전 허가를 받는 제도입니다. 해당 제도의 목적은 무분별한 개발과 난개발을 방지하고, 용도지역·지구·구역의 계획에 맞게 토지를 합리적으로 이용하도록 관리하기 위함입니다.
