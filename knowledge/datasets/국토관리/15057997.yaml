summary_user: 전북개발공사가 관리하는 임대주택의 임대료 산정 기준 정보를 담는 API로, 임대 구분(rentcode)·적용일·면적 코드별로 기본 계약금·잔금·월 임대료와 단계별 계약금·잔금·임대료 금액을 제공한다. 전북개발공사 공공임대·국민임대·행복주택 입주를 검토하는 사람이나 분석가가 "이 단지 유형의 보증금과 월 임대료 기준은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 임대 식별자·면적 코드 같은 이름·코드 매핑이나 같은 기관(전북개발공사)의 다른 임대단지 정보로만 연결한다.
limits: 표준 조인 키가 없어 전월세 실거래 등 다른 데이터와 바로 결합할 수 없고, 이름·코드를 직접 맞춰야 한다. 필드 명세에 의미 설명이 비어 있어 단계별 금액 필드(3·4·5 접미)와 코드의 뜻은 실제 응답을 보고 해석해야 한다.
