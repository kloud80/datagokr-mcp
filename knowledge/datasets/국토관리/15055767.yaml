summary_user: 전북특별자치도 시군구별로 개발제한구역·시가화조정구역·수자원보호구역·도시자연공원구역·입지규제최소구역의 지정 개소와 면적(제곱미터)을 담은 집계표로, 439바이트 크기의 CSV 파일 한 개다. 도시계획가나 개발 사업자가 '전북에서 개발제한구역이나 시가화조정구역이 넓게 묶인 시군은 어디인가'처럼 지역별 토지이용 규제 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 시군구 통계와는 시군구 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 전북특별자치도 내에 「국토의 계획 및 이용에 관한 법률」에 따라 지정된 용도구역의 현황을 정리한 데이터입니다. 이 자료는 도시의 무질서한 확산을 방지하는 개발제한구역(그린벨트), 상수원을 보호하기 위한 수자원보호구역, 그리고 시민의 여가 공간인 도시자연공원구역 등 주요 용도구역의 지정 개소와 총면적을 시군별로 보여줍니다. 이 데이터는 지역의 거시적인 토지 이용 규제 현황을 파악하는 데 필수적입니다. 도시 계획가나 부동산 개발업자는 이를 통해 개발이 엄격히 제한되는 지역을 확인할 수 있으며, 이는 지속가능한 국토 발전을 위한 중요한 기초 자료가 됩니다.
