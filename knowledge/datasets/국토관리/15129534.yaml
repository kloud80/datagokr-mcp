description_portal: '- 전라남도 시군별 빈집 현황 자료입니다. 2020년~2024년 데이터를 제공합니다.- 전라남도의 빈집 문제는 지속적인 인구 감소와 도시화로 인해 심각한 상황에 있습니다. 빈집은 지역 경제와 환경에 부정적인 영향을 미치며, 특히 농촌 지역에서 더욱 두드러집니다.- 빈집 비율: 전남의 빈집률은 전국 평균보다 높으며, 특히 농촌 지역에서 빈집 비율이 높습니다.- 주요 원인: 인구 감소, 고령화, 도시로의 인구 이동 등이 주요 원인으로 지목됩니다.- 영향: 빈집은 지역의 경관을 해치고, 범죄의 온상이 될 수 있으며, 지역 경제에 부정적인 영향을 미칩니다.'
