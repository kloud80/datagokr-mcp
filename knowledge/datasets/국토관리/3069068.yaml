summary_user: 전주시에 소재한 개별주택의 공시가격을 필지·건물 단위로 담은 파일로, 법정동·지번(본번·부번)·기준연도와 토지대장면적·산정대지면적·건물연면적·주택가격이 한 행에 들어 있다. 주택 소유자나 분석가가 "우리 동네 단독주택의 올해 공시가격은 얼마이고 대지·연면적 대비 어느 수준인가"를 확인하거나, 보유세·건보료·복지 기준 산정의 참고값을 볼 때 쓴다. 실측 조인 키는 법정동코드(bjd_cd)이며, 법정동코드와 특수지구분·본번·부번을 조합해 필지 단위로 토지·건축물 데이터나 실거래 데이터와 이어 쓴다.
limits: 범위가 전주시 한 곳으로 한정돼 다른 시군구와 비교하려면 해당 지자체 자료를 따로 모아야 한다. 공시가격이라 실제 거래 시세와는 다르며, 공동주택(아파트 등) 가격은 이 파일 범위가 아니다.
