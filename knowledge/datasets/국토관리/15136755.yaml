summary_user: 수원시 시군구(signgu_cd·signgu_nm) 단위로 날짜별·시간대(0~23시)별 유동인구를 남녀와 5세 구간 연령대(0~69세), 내국인·외국인 구분으로 나눠 담은 집계 자료이며, 통신 기지국 기반 수치를 50x50m 셀로 재분배해 소수점 값이 들어갈 수 있다. 상권 분석가나 도시·교통 담당자가 '수원시 어느 구에 몇 시에 20대 여성 유동인구가 가장 많은가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군구 코드·이름 매핑이나 같은 경기도 기관 데이터의 코드로만 연결한다.
description_portal: 이 데이터는 수원시 내 각 행정구역별 시간대별 유동인구 분포를 성별 및 연령대, 외국인 구분에 따라 나타낸 자료입니다. ‘시간코드’는 0시부터 23시까지의 시간대를 나타내며, ‘남자0009수’, ‘여자2529수’ 등은 해당 성별과 연령대의 시간대별 유동인구 수를 의미합니다. 데이터는 통신 기지국을 기반으로 수집되며, 셀 단위(50x50m)로 재분배되어 소수점 단위 수치가 포함될 수 있습니다. ‘외국인구분’ 항목은 내국인과 외국인을 구분하여 유동인구를 파악할 수 있게 하며, ‘연도_월_일’ 항목을 통해 수집 날짜를 확인할 수 있습니다. 이 자료는 도시계획, 상권 분석, 교통 및 치안 정책 수립 등 다양한 분야에서 활용될 수 있습니다.
