summary_user: K-water가 관리하는 수위관측소의 관측일시별 수위·유량 관측값을 건별로 담은 전국 단위 파일 데이터로, 포털 설명상 우량관측소의 우량·누적우량도 제공 항목에 포함된다. 하천·댐 관리자나 분석가가 특정 수위관측소에서 홍수기 동안 수위와 유량이 시간대별로 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 관측소 운영정보나 댐 자료와는 수위관측소코드·댐코드를 이름·코드 매핑해 연결한다.
description_portal: 'ㅁ 사용방법 : 검색창에서 ""우량수위 관측소 운영정보"" 검색 -> ""Sheet"" 또는 ""API"" 라벨 메뉴 선택 -> 서비스목록에서 ""우량수위 관측정보(DATA 조회)"" 항목 선택ㅁ 개     요 : K-water에서 관리중인 우량관측소 및 수위관측소의 관측정보ㅁ 제공항목  ① 우량관측소 : 우량[mm], 누적우량[mm]   * 시강우량(hourly rainfall) : 단위 시간당 강우량   * 누가강수량(cumulative rainfall) : 금년 누적 강우량 ② 수위관측소 : 수위[m], 유량[㎥/s]   * 수위(water level) : 어느 기준면으로부터 측정한 하천이나 호수, 지하수 등 수면의 높이. 기준면을 특별히 지정하지 않으면 통상 평균 해수면을 기준면으로 함   * 유량(Quantity, flow rate, discharge) : 단위 시간당 특정 단면을 통과하는 물의 양(부피)'
