summary_user: 경상남도 사천시 관할 전통시장을 시장 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.2KB)로, 읍면동·지번/도로명 주소·개설연도·상설/정기 여부·장날·시장면적·상인회 사무실 전화번호를 담는다. 사천시 주민이나 방문객이 '근처 전통시장의 장날이 언제이고 어디에 있는지'를 확인하거나, 분석가가 시군구 단위 전통시장 분포와 규모를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시장 이름이나 주소(지번·도로명)를 맞춰 붙이거나 같은 기관의 다른 자료와 지역명으로 연결한다.
description_portal: '공공데이터는 경상남도 사천시 관할 구역 내에 등록된 전통시장의 최신 현황 정보를 제공하는 자료입니다. 제공되는 주요 데이터 항목은 다음과 같습니다.시장: 전통시장의 공식적인 이름을 명시합니다.주소(지번): 전통시장의 공식 지번입니다.주소(도로명): 전통시장의 공식 도로명 주소이니다.개설연도: 해당 전통시장이 개설된 연도입니다.개설주기: 상설 시장 여부와 정기 시장 여부장날: 장날이 열리는 일자시장면적: 시장의 면적을 표시합니다.상인회 사무실: 전통시장 상인회 사무실 전화번호입니다.'
