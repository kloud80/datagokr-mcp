summary_user: 서울특별시 건축물대장 기본개요를 필지·건물 단위 행으로 담은 원천 자료로, 대지 위치·시군구·법정동·주부지번·도로명주소 요소와 대장 구분·종류, 건물명, 작업일시(WORK_DTTM) 등을 포함하며 범위는 서울 시도 단위다. 분석가나 사업자가 "특정 구·동에서 어떤 대장 종류(표제부·총괄 등)의 건축물이 어떤 지번에 등록돼 있는가"를 확인하거나 지역별 건축물 등록 현황을 집계할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 건축물대장·공시지가·지적 자료와는 시군구명·법정동명·주부지번 같은 이름·지번 매핑으로만 연결한다.
description_portal: 서울특별시 건축물대장 등록 정보를 행 단위로 정리한 자료입니다. 각 행은 하나의 필지를 나타내며, 대지 위치, 시군구명, 법정동, 대지구분, 주·부지번, 호별명세 일련번호 등 기본 식별정보와 건물 용도, 구조, 동 수, 연면적, 총세대수 등의 건축 세부정보를 담고 있습니다. 또한 승인일, 착공일, 사용승인일 및 해당 날짜의 사전 공고일 정보가 포함되어 건축 진행 단계의 흐름을 파악할 수 있습니다. 이 데이터는 지역별 개발 현황 분석, 인허가 절차 추적, 도시계획과 주거정책 수립을 위한 기초 자료로 활용할 수 있습니다.
