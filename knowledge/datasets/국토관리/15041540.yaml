summary_user: 청주시 상수도요금을 지역·업종(가정용·일반용·대중탕용·전용공업용 등)별로 묶어 사용량과 요금을 담은 집계 통계 파일로, 2023년 8월 고지 납기일 기준 한 시점 자료이며 하수도요금과 물이용부담금은 빠져 있다. 청주시 안에서 어느 지역·업종이 수돗물을 얼마나 쓰고 요금을 얼마나 내는지 비교하려는 분석가나 사업자의 질문에 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 지역 이름을 맞추거나 같은 기관(청주시) 자료끼리만 이어 쓴다.
description_portal: 청주시 수도급수 조례에 의하면 수도요금은 상수도요금과 하수도요금 및 물이용부담금으로 이루어집니다. 이 공공데이터에서는 상수도요금에 대한 자료를 제공합니다. 상수도요금은 계량기 구경별 기본요금 및 가정용, 일반용, 대중탕용, 전용공업용 등 4개 업종 및 혼합용에 따른 누진체계의 사용요금을 합하여 부과하며, 가정용은 누진체계가 적용되지 않습니다. 본 파일은 2023년 8월 고지납기일을 기준으로 하여 제공하는 지역별 사용량과 요금에 대한 통계이오니 데이터 사용 시 참고하시기 바랍니다.
