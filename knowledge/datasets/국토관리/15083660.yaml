summary_user: 부산광역시 상수도사업본부가 부과한 수도요금을 시민이 간단e납부로 낸 뒤, 그 수납 변동 정보를 연계 시스템으로 보낸 결과를 생성일자·전송처리순번 단위로 담은 파일(CSV 약 63MB)이다. 상수도 요금 수납 연계가 날짜별로 몇 건, 얼마의 수납금액으로 처리됐는지(총건수·총수납금액)와 처리 결과 메시지를 확인하려는 분석가나 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 생성일자 같은 날짜나 같은 기관(부산 상수도사업본부)의 다른 수용가정보시스템 연계 자료와 이름으로만 맞춰 쓴다.
