summary_user: 공무원연금공단이 관리하는 공무원 임대주택의 세대수와 장부가를 평형(전용면적 18.87~85.95㎡, 유사 면적은 범위로 묶음)별 행과 시도별 열로 교차 집계한 작은 표(CSV 874바이트)이며, 건별 주택 원천이 아니다. 공무원이 특정 시도에서 어떤 면적대의 임대주택이 몇 세대 있는지 확인하거나, 분석가가 시도별 공무원 임대주택 공급 규모를 인근 공공임대 물량과 비교하는 데 쓴다. 전역 조인 키가 없어 시도명(서울·부산 등 열 이름)을 다른 시도 단위 주택 통계의 지역명과 이름으로 맞춰 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 공무원 임대주택(지역별, 평형별) 세대수와 장부가 등을 제공하고 있습니다. 전용면적을 기준으로 18.87제곱미터에서 85.95제곱미터까지 구분하고 있으며, 면적이 유사한 평형은 집계의 용이성을 위해 범위로 구분하여 세대수를 집계하였습니다.해당 데이터를 활용하여 임대주택 입주시 소요비용 등을 예상할 수 있으며, 인근 지역의 비슷한 면적의 임대주택과 비교하는데 활용할 수 있습니다.장부가는 2012년말까지는 취득원가(역사적원가) 기준이고, 2013년부터는 국가회계기준을 따른 자산재평가금액으로 반영하고 있습니다.
