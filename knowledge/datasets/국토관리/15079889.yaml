summary_user: 경상북도 봉화군의 일반건축물 시가표준액을 법정동·법정리·본번·부번·동·호 단위 건물별로 담은 파일 데이터로, 과세년도·연면적·시가표준액이 함께 들어 있다. 봉화군 건물 소유자나 매입을 검토하는 사람이 특정 건물의 재산세 등 과세 기준이 되는 시가표준액이 얼마인지 확인하거나, 분석가가 지역별 건물 가치 분포를 볼 때 쓴다. 전역 조인 키(법정동코드·건물관리번호 등)가 없어 건축물대장·공시지가 같은 다른 데이터와는 법정동·법정리 이름과 본번·부번 지번을 맞춰 연결해야 한다.
description_portal: '이 데이터는 시가표준액에 대한 정보를 제공하는 자료로, 각 지역의 부동산 시세 및 세금을 산정하기 위한 기준을 마련합니다. 시가표준액은 주택 및 건물의 가치를 평가하고 세금 부과의 기초 자료로 활용됩니다. 본 데이터에는 법정동, 법정리, 동, 호 등의 주소 정보를 비롯하여, 본번과 부번에 대한 세부 항목, 연면적, 시가표준액 등의 정보를 포함하여 시세 분석 및 세수 계획에 도움을 줍니다. 특히 각 항목에 대해 연도별 데이터가 포함되어 있어 변화 추이 분석이 가능하며, 2024년 과세년도 기준으로 제공됩니다. 데이터는 총 13개 컬럼으로 구성되어 있습니다.시도명: 해당 데이터가 속한 시·도의 명칭입니다.시군구명: 해당 데이터가 속한 기초 지자체의 명칭입니다.과세년도: 시가표준액이 적용된 과세 연도입니다.법정동: 부동산이 속한 법정동의 명칭입니다.법정리: 법정동 내의 구체적인 지역 구분입니다.특수지: 특수한 지목이 지정된 토지에 대한 정보입니다.본번: 건물의 본번 주소입니다.부번: 건물의 부번 주소입니다.동: 건물의 동호수를 나타내며, 세부 주소를 구분합니다.호: 건물의 세부 호수를 나타냅니다.시가표준액: 해당 건물의 표준시가액입니다.연면적: 건물의 전체 면적입니다.'
