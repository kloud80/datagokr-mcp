summary_user: 청주시 개별입지 제조업체를 제조업 중분류(25개 업종)별로 묶어 사업체수·종사자수·기준년도를 담은 집계 파일입니다(포털 설명 기준 2024년 말 2,787개사, 종사자 29,306명). 분석가나 기업 영업·구인 담당자가 '청주시 개별입지에서 어떤 제조 업종에 사업체와 고용이 몰려 있나'를 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 통계와는 제조업 중분류 이름을 표준산업분류 업종명에 맞추거나 같은 기관(청주시) 자료끼리만 이어 쓴다.
description_portal: 청주시 개별입지 제조업체에 대한 데이터로 중분류별 분류하여 사업체수, 종사자수, 기준년도 등의 항목을 제공하고 25항목의 업종별 분류 정보를 제공합니다.2024년 말 기준 청주시 개별입지 제조업 중분류별 사업체수는 2,787개사 이며 이들 기업에 종사하는 종사자수는 29,306명으로 집계됩니다. 본 데이터를 적극적으로 활용하여 학술자료, 기업영업, 구인구직 등에 활용하시기 바랍니다.아울러, 본 공공데이터는 청주시 기본통계자료에 의거 작성되었으며, 통계청 사이트에서도 검색 가능합니다.
