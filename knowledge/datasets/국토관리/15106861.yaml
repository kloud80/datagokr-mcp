summary_user: 한국부동산원이 공시가격 대상 공동주택(아파트·연립·다세대)을 단지 단위로 묶어 단지고유번호, 필지고유번호, 주소, 공시가격·건축물대장·도로명주소 기준 단지명, 동수, 세대수, 사용승인일을 담은 전국 307,834행의 기본정보 파일이다. 분석가가 실거래가나 공시가격 자료의 단지명·주소를 하나의 단지로 묶어 '이 거래 건이 어느 단지의 몇 세대 규모 아파트에 속하는가'를 확인할 때 쓴다. 단지고유번호(reb_complex_id)로 한국부동산원의 다른 단지 식별정보와 잇고, 필지고유번호(pnu)로 토지·건축물 자료와 잇고, 지번·도로명주소로 실거래·청약 자료와 이어 쓴다.
description_portal: '한국부동산원(구.한국감정원)에서 제공하는 공동주택 단지 식별정보 중 기본정보 데이터입니다. - (기본정보) 단지고유번호, 필지고유번호, 주소, 단지명, 단지종류(1: 아파트, 2: 연립, 3: 다세대), 동수, 세대수, 사용승인일※ 해당년도 데이터는 전년도 사용승인된 공시대상 공동주택 기준(ex. 25년 제공 데이터는 24년 사용승인된 공시대상 공동주택 기준)※ 유의사항 - 공시가격DB와 타 DB(건축물대장 등) 간 기준시점 차이 등으로 인해 매칭이 되지 않거나, 타 DB 내 단지명/동명이 기재되지 않은 경우 공개 데이터 내 일부 컬럼이 공란으로 표기될 수 있음'
