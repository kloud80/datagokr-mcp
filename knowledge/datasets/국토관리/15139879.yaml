description_portal: 경상남도 창녕군에 위치한 돈사(돼지축사) 가축분뇨 처리 현황입니다. 1. 연번, 돈사의 상호, 지역, 가축분뇨 정화처리 여부, 처리공법 데이터를 포함하고 있습니다.2. 데이터 기준일은 2025년 9월 1일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 전화번호는 개인정보로 포함되어 있지 않으며, 가축분뇨 처리를 하지 않는 돈사도 존재합니다.4. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 관광환경국 환경위생과 수질관리팀 055-530-1614로 문의 주시기 바랍니다.
