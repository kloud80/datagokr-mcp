summary_user: 전북특별자치도 농어촌 지역의 하루 처리용량 500톤 미만 마을하수도 시설을 한 행에 한 시설씩 담은 목록 파일(csv, 약 6.8KB)로, 시군·시설명(마을명)·시설용량(톤)을 기록한다. 시군별로 소규모 공공하수처리시설이 몇 곳이고 처리 규모가 어느 정도인지 확인하려는 지자체 담당자나 지역 환경 분석가가 쓴다. 전역 조인 키가 없어 다른 하수도·인구 자료와는 시군 이름을 맞춰 붙여야 한다.
description_portal: 전북특별자치도 내 농어촌 지역에 설치된 500톤 미만 규모의 마을하수도 시설 현황을 정리한 데이터입니다. 이 자료는 대규모 하수종말처리장으로 연결되지 않는 농어촌 마을에서 발생하는 생활하수를 위생적으로 처리하기 위해 설치된 소규모 공공하수처리시설의 목록입니다. 각 시설의 위치(시군 및 마을명)와 하루에 처리할 수 있는 용량(톤)을 포함하고 있어, 지역별 환경기초시설의 분포와 규모를 파악하는 데 유용합니다. 이 데이터는 농어촌 지역의 주거 환경 개선과 하천의 수질을 보전하기 위한 정책의 이행 현황을 보여주는 중요한 기초 자료입니다.
