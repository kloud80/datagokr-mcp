summary_user: 충청북도 단양군 도시계획정보시스템(UPIS)에 등록된 관리지역 현황 도형을 건별로 담은 314바이트 크기의 작은 CSV 파일로, 도형 관리번호·라벨명·면적·길이·생성일시를 포함한다. 단양군 안에서 관리지역으로 지정된 구역이 어디이고 면적이 얼마인지 확인하려는 토지 소유자·사업자나 용도지역 구성을 분석하는 연구자가 쓴다. 전역 조인 키는 없어 시군구코드나 라벨명으로 단양군의 다른 UPIS 용도지역(도시·농림·자연환경보전) 현황 파일과 이름·코드 매핑으로 이어 쓴다.
description_portal: 충청북도 단양군의 도시계획정보시스템(UPIS) 내 보유중인 관리지역 현황 데이터로 현황도면 관리번호, 라벨명, 면적_도형,면적_길이, 현황도형 생성일시 등의 항목을 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 도시계획정보시스템(UPIS) 교통시설 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2022년 12월 21일입니다. 담당부서는 단양군 관광건설국 균형개발과이며 문의주시면 최신의 충청북도 단양군 도시계획정보시스템(UPIS) 교통시설 현황을 열람하실 수 있게 도와드립니다.
