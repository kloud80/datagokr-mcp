summary_user: '경기도 시군별·기준년월별로 카드매출을 성별·연령대 조합 집단(예: 40대 남성, 50대 여성)으로 나눠 매출금액과 전체 대비 비율을 담은 집계 자료입니다. 상권 분석가나 창업 예정자가 특정 시군에서 어느 성별·연령층의 카드 소비 비중이 큰지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 기관(경기도 분석시스템)의 다른 집계와 시군코드(sigun_cd)·기준년월로 맞춰 잇거나 시군 이름 매핑을 거쳐 연결한다.'
description_portal: '이 데이터는 경기도 내 각 시군에서 발생한 카드매출을 성별과 연령대별로 집계한 자료로, 기준년월을 기준으로 성연령코드(M40, F50 등)에 따른 매출금액 및 매출금액비율 정보를 포함하고 있습니다. 시군코드는 지역을 구분하기 위한 코드이며, 성연령코드는 성별(M: 남성, F: 여성)과 연령대를 조합한 항목입니다. 매출금액은 해당 집단의 카드 사용 총액을 나타내며, 매출금액비율은 전체 매출 대비 해당 성연령 그룹의 기여도를 백분율로 표현한 값입니다. 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.'
