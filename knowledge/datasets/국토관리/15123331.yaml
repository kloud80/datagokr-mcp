description_portal: 하천수 사용시설은 하천에서 물을 취수하여 다양한 용도로 사용하는 시설을 의미합니다. 이러한 시설은 하천법과 관련 규정에 따라 엄격하게 관리되고 있습니다. 하천수 사용시설 정보는 다음과 같은 내용이 포함됩니다. 시설물명, 소유자명, 시설물 주소, 시설물 주소 나머지, 공작물시설용량, 몽리면적, 표준유역코드, 하천코드, 원상회복여부, 변경신청이유, 공작물구조형식_수집방법, 위도, 경도, 사용목적.하천수는 공공의 자원으로서, 국가와 지방자치단체는 이를 공공의 이익을 증진하는 방향으로 적절히 관리해야 합니다.
