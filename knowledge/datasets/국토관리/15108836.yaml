summary_user: 광주 서구 관내 위반건축물을 건물별 관리번호 단위로 정리한 건별 목록으로, 대지 위치·위반용도·위반면적·위반구조·위반내용을 담는다(CSV 약 139KB, 범위는 시군구, 단위는 필지·건물). 구청 건축행정 담당자나 분석가가 '서구에서 무단 증축·용도 변경 같은 위반이 어느 지역에 어떤 유형으로 몰려 있나'를 파악하는 데 쓴다. 전역 조인 키는 없어서 대지위치(주소)를 주소·지번 매핑으로 건축물대장이나 인허가 데이터에 붙이거나, 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 광주광역시 서구 관내 위반건축물에 대한 관리 현황을 정리한 자료로, 각 건축물별로 부여된 고유 관리번호를 중심으로 위반건축물의 대지 위치, 위반용도, 위반면적, 위반구조, 위반내용 등에 대한 정보를 제공합니다. 위반건축물의 특성과 위반 유형을 파악함으로써 건축행정의 효율적인 관리 및 단속 근거자료로 활용될 수 있으며, 도시계획 수립 시 위반건축물의 분포 특성을 반영하는 데에도 도움이 됩니다. 특히, 용도 변경, 무단 증축 등 위반사례 유형별 데이터가 상세하게 제공되어, 지역 내 불법 건축행위 모니터링 및 정책 수립에 활용도가 높습니다. 데이터는 CSV 형식으로 연 1회 정기 갱신되며, 공공저작물로 자유롭게 활용 가능합니다.
