summary_user: 음성군 산업단지에 입주한 기업을 한 행에 한 곳씩 담은 건별 명단으로, 산업단지명·회사명·대표업종·회사주소·좌표·계획종업원수를 시군구 범위에서 개별 주소·좌표 단위로 수록한다. 구직자나 영업 담당자가 음성군 특정 산업단지에 어떤 업종의 기업이 얼마나 고용할 계획으로 입주해 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 공장 등록 등 다른 자료와는 회사명·주소 같은 이름 매핑이나 좌표로만 이어 쓴다.
description_portal: '이 데이터는 음성군 산업단지에 입주한 기업들의 기본 정보를 수록한 자료로 산업단지 운영 및 기업 지원 정책 수립에 활용될 수 있습니다. 각 행은 하나의 입주 기업을 나타내며 다음과 같은 항목으로 구성되어 있습니다:- 연번: 데이터의 순번을 나타내는 고유 번호입니다.- 산업단지명: 해당 기업이 입주한 산업단지의 명칭입니다.- 회사명: 입주 기업의 공식 명칭입니다.- 대표업종: 기업이 주력으로 영위하는 산업 또는 업종을 나타냅니다.- 회사주소: 기업의 사업장 주소로 산업단지 내 위치를 포함합니다.- X좌표 / Y좌표: 기업의 위치를 나타내는 공간 좌표 (GIS 활용 가능)로, 지도 기반 분석에 활용됩니다.- 계획종업원수: 기업이 계획한 종업원 수로 고용 규모 예측에 활용됩니다.- 데이터기준일자: 해당 정보가 수집된 기준 날짜로 데이터의 최신성 판단에 사용됩니다.이 데이터는 산업단지별 기업 분포, 업종별 입주 현황, 고용 계획 분석 등 다양한 정책적·행정적 목적에 활용될 수 있으며 위치 기반 서비스나 지역 경제 분석에도 유용합니다.'
