summary_user: 부산광역시 도시계획정보시스템(UPIS)의 도시·군관리계획 입안·결정 계획 건별로 계획관리명, 계획작성일자, 내용, 사용여부와 생성·수정 일시를 담는 API 데이터다. 부산에서 어떤 도시관리계획이 언제 입안·결정됐는지 확인해 해당 지역의 개발 가능성을 미리 가늠하려는 부동산 사업자나 도시계획 분석가가 쓴다. 실측 컬럼에 지번·행정코드 같은 전역 조인 키가 없어, 다른 고시·결정조서 데이터와는 계획관리명 등 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 도시계획이란 도시의 바람직한 미래상을 정립하고, 이를 시행하려는 일련의 과정을 말합니다. 우리나라는 급속한 산업화와 도시화로 경제성장을 이루었지만, 인구의 도시집중에 따른 과밀화와 도시의 무질서한 확산 등 각종 도시문제가 발생하였습니다.도시의 장래 수준을 예측하여 바람직한 미래상을 설정하여 여기에 맞게 규제나 유도정책 혹은 정비수단 등을 통하여 도시를 건전하고 적정하게 관리해나가는 수단입니다.이를 위한 부산광역시 도시계획정보시스템에서 제공하는 입안결정 계획 데이터로서 계획관리명, 계획작성일자, 내용 등의 자료를 제공합니다.
