summary_user: 대구광역시 북구 관내 대형마트와 기업형 슈퍼마켓(SSM)을 점포 한 곳당 한 행으로, 구분(대형마트/SSM)·상호명·도로명주소·데이터 기준일자를 담은 작은 CSV 파일(약 1KB)이다. 북구에서 상권을 분석하거나 신규 점포 입지를 검토하는 사업자·분석가가 '북구 어디에 대형마트와 SSM이 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어, 도로명주소를 지오코딩하거나 상호명으로 다른 상권·소상공인 데이터와 맞춰 이어 쓴다.
description_portal: 본 데이터는 대구광역시 북구 관내에 위치한 대형마트와 기업형 슈퍼마켓(SSM)의 현황을 제공하는 공공데이터입니다.주요 제공 항목으로는 점포별 구분(대형마트/기업형 슈퍼마켓), 상호명, 도로명 주소,  데이터 기준일자 등의 정보를 포함하고 있습니다.본 데이터를 통해 대구광역시 북구 지역의 종합소매업 분포 현황을 직관적으로 파악할 수 있으며, 이를 기반으로 유통 상권 분석, 지역 경제 동향 연구, 신규 점포 입지 선정 및 소상공인 경쟁력 강화 등 다양한 시각화 및 분석 분야에서 유용하게 활용할 수 있습니다.데이터는 범용적인 텍스트 형식의 CSV 파일로 제공되어 누구나 제약 없이 무료로 다운로드하여 가공 및 활용할 수 있습니다.
