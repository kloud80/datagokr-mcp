summary_user: K-water가 관리하는 다목적댐의 댐용수(광역상수도·생공용수 등) 공급계획과 실제 공급실적을 월 단위로 천톤 기준으로 담은 집계 파일로, 포털 설명상 작성기간은 2019년~2025년이며 계획량과 실적량 두 수치가 구분 항목별로 나란히 들어 있다. 수자원 정책 분석가나 지자체 담당자가 "올해 댐용수가 계획 대비 얼마나 실제로 공급됐는가"처럼 수급 불균형이나 운영 효율을 따질 때 쓴다. 실측 컬럼에 전역 조인 키나 댐코드가 없어, 다른 댐 운영·수위 자료와는 구분 항목의 이름을 맞추거나 같은 기관(K-water) 자료끼리만 이어 쓴다.
description_portal: 'K-water가 관리하고 있는 다목적댐의 월별 댐용수 공급계획과 실제 공급 실적을 제공하는 자료입니다.댐용수는 K-water의 광역상수도와 지자체·기업이 사용하는 생공용수 등의 목적으로 공급하고 있으며, 이를 통해 수자원 운영 현황을 파악하고, 수급 불균형 대응, 효율적 댐 운영 전략 수립, 물이용 정책 검토 등에 활용할 수 있습니다.해당 데이터의 세부항목 단위는 아래와 같습니다. - 공급통계 기간단위 : 월 - 작성기간 : 2019년~2025년 - 공급량 단위 : 천톤*운영현황에 따라 변경사항이 발생할 수 있습니다.'
