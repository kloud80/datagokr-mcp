summary_user: 경기도 구리시에서 접수된 건축 착공신고를 신고 건별로 담은 파일로, 착공 위치의 지번·도로명 주소, 설계를 맡은 건축사 사무소명, 신고일을 담는다(파일 크기 약 5.5KB). 지역 개발 흐름의 선행 지표인 착공 동향을 보려는 분석가나 사업자가 '구리시 어느 동네에서 최근 착공이 몰리고, 어떤 설계사무소가 많이 맡았나' 같은 질문에 쓴다. 전역 조인 키는 없어 주소(지번·도로명)나 사무소명을 문자열로 맞춰 건축물대장·건축 인허가 데이터 등과 이어 써야 한다.
