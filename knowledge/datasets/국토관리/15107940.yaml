description_portal: 해당데이터는 경기도 구리시 내에서 진행되는 건축공사의 시작을 알리는 착공신고현황 자료입니다. 주요내용으로는 공사가 진행되는 위치의 지번주소와 도로명주소, 해당프로젝트의 설계를 담당한사무소 명칭, 행정기관에 서류를접수한신고일자 등이포함되어있습니다. 이는건축법제21조에 의거하여 수집된 정보로 지역별 신축동향파악과 건축행정관리 및 공공데이터 활용을 위한 기초자료로 사용됩니다.*착공신고지 도로명주소의 공란은 지번주소를 참고 해주시기 바랍니다.
