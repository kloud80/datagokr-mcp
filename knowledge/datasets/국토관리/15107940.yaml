legal_basis_portal: 해당데이터의 보유근거는 건축법제21조(건축공사의착공신고등)와 건축법시행규칙 제14조에 명시된 법적절차에기초합니다.건축주는 허가를 받거나 신고를 한 건축물의 공사를 착공하려는 경우 허가권자(구리시장)에게 공사계획을 신고해야 할 법적의무가 있으며,이과정에서 제출된 착공신고서상의 정보가 본데이터의 원천이됩니다. 또한 공공기관의 정보공개에 관한법률 및 공공데이터의 제공 및 이용 활용에 관한 법률에 따라 국민의 알권리 보장과 데이터 활용촉진을 위해 비공개 대상정보를 제외한 건축행정시스템(세움터)내의 착공현황을 취합하여 보유및관리하고 있는것입니다.따라서 본 자료는 적법한 행정절차에 따라 수집된 공식적인 통계자료로써의 공신력을 가집니다.
