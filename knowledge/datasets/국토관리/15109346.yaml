services:
  - op: /getNtnCtyFldList
    name: 국토도시분야 사전정보공개 데이터 목록조회
    endpoint: https://apis.data.go.kr/1613000/ntnCtyFldPriorInfoDsc/getNtnCtyFldList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: dclsfCd
        required: true
        example: D01
        desc: 데이터의 상세분류 코드 (D00 ~ D05  *참고자료 참조)
      - name: viewType
        required: false
        example: json
        desc: 응답타입구분 (xml or json)
      - name: startDate
        required: false
        example: '2022-08-01'
        desc: 작성일 기준 검색 시 검색범위의 시작일 (YYYY-MM-DD)
      - name: endDate
        required: false
        example: '2022-09-01'
        desc: 작성일 기준 검색 시 검색범위의 종료일 (YYYY-MM-DD)
      - name: srchWord
        required: false
        example: 김해
        desc: 대상의 제목/키워드에 포함되어 있을 단어
      - name: stdgCd
        required: false
        example: '4825033000'
        desc: 검색할 내용의 지역정보에 해당하는 법정동코드 10자리 (상세분류 코드가 D01, D02, D03, D04, D05인 경우)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
