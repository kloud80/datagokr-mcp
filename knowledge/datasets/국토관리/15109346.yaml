summary_user: 국토교통부가 사전정보공개로 내놓은 국토도시 분야 공개자료의 목록을 건별로 담으며, 자료마다 제목·카테고리·키워드·제공기관·원본등록일·제공 페이지 주소·첨부파일명과 내려받기 주소, 관련 법정동 코드와 이름이 붙는다. 범위는 전국이고 행정단위는 읍면동이다. 시민이나 분석가가 특정 동네(법정동)나 검색어, 등록일 기준으로 국토도시 분야에서 국토교통부가 공개한 문서와 첨부파일을 찾아 원문을 내려받을 때 쓴다. 측정된 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못했고, 법정동 코드(stdgCd)나 법정동 이름을 맞추는 방식으로만 다른 지역 데이터와 이어 쓸 수 있다.
limits: 공개 문서의 목록과 링크만 담는다. 문서 안의 수치나 내용 자체는 담지 않는다. 다른 데이터와 공통으로 쓰는 조인 키가 없어서 법정동 코드·이름 매핑이나 같은 기관 코드로만 연결된다. 호출에는 활용신청 후 받는 serviceKey가 필요하고, 개발계정은 하루 1,000회로 제한된다.
