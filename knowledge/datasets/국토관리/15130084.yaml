summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 환경기초시설 도형을 건별로 담은 파일로, 도형마다 공간정보관리번호·현황도형관리번호, 좌표 범위(X·Y 최솟값·최댓값), 라벨명, 면적·길이를 담는다(csv 407바이트의 소규모 파일). 진안군 안에서 하수·폐기물 처리 같은 환경기초시설이 어디에 어느 면적으로 도시계획시설로 잡혀 있는지 확인하려는 주민·사업자·도시계획 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(진안군)의 다른 UPIS 도시계획정보 파일과 좌표 범위를 맞춰 이어 쓴다.
