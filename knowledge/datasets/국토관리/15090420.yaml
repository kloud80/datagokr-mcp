description_portal: 한국토지주택공사 렌트홈 홈페이지 내 민간임대등록 제도, 임대사업자 등록절차, 임대차계약 신고 등에 관한 자료 및 서식 데이터를 제공합니다. 렌트홈은 국민의 주거복지와 직결된 임대차시장의 정보 인프라를 확충하고, 임대사업자의 편익 증진과 임차인의 권리를 보호하고자 만들어진 민간임대 민원 One-Stop처리 대국민 서비스입니다. 2018년부터 관련 자료를 제공하고 있으며 가장 많은 조회수를 기록한 게시물은 `임대차계약 자진신고서 양식 `입니다. 이외에도 국세청 관련 신고 안내, 부기등기 주요 Q&A를 통해 렌트홈 서비스 관련 불편사항을 해소하고 있습니다.
