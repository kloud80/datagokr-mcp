summary_user: 인천 동구(현 제물포구) 관내 다세대주택을 건물·동 단위로 한 행씩 담은 파일로, 위치(법정동명·본번·부번)와 건물명·동명칭, 세대수, 지하·지상 층수, 승용·비상용 승강기 수, 사용승인일을 담는다. 구청 담당자나 연구자가 '관내에서 승강기 없는 노후 다세대주택이 어느 동에 몰려 있나'처럼 주거환경 개선·안전점검 대상을 추릴 때 쓴다. 전역 조인 키는 없어 법정동명과 본번·부번을 지번 주소로 맞춰 건축물대장 등 다른 필지·건물 자료와 이어 써야 한다.
limits: 실측 컬럼에 법정동코드나 건물 고유번호 같은 전역 조인 키가 없어 다른 데이터와는 이름·지번 매칭으로만 연결된다. 범위는 동구 한 시군구에 한정되며, 기관명이 제물포구로 바뀌어 같은 지역의 자료가 기관명이 다르게 등록돼 있을 수 있다.
