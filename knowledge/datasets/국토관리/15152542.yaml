summary_user: AI 홍수예측에 쓰는 수위관측소와 인근 예보유역의 매칭 관계를 담은 고정 참조자료로, 관측소 한 곳과 인근 예보유역 한 곳을 한 행으로 두며 유역 면적과 주하천 길이를 함께 싣는다. 홍수 예보 분석가가 특정 수위관측소의 인근 예보유역은 어디이고 유역 특성이 얼마나 비슷한지 비교할 때 쓴다. 수위관측소주소(address)와 경도·위도(coord) 키로 다른 관측소·지점 위치 자료와 이어 쓰고, 관측소·유역 코드 필드도 있으나 조인 키로 확인된 것은 아니다.
description_portal: 'AI 홍수예보 시스템에서 AI홍수예측을 위한 인근 예보유역 정보를 관리하고 홍수특보지점과 예보유역 매칭 관계를 제공하는 데이터 항목으로, 관측소와 지점 정보를 포함하여 각 예보유역의 유사 특성과 연결 관계를 체계적으로 관리한다. 이를 통해 예보유역 간 유역평균 강우량 등 특성비교 및 다양한 업무에  활용 할수있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
