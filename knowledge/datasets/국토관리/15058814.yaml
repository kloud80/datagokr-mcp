summary_user: 국토교통부가 vworld 공간정보 RestAPI로 제공하는 행정구역도 데이터로, 광역시도를 중심으로 시군구·읍면동·리 단위 경계 정보를 json/xml로 돌려준다. 지도 서비스나 분석 담당자가 특정 광역시도의 행정구역 경계와 이름(국문·영문)을 지도에 표시하거나 확인할 때 쓴다. 광역시도 코드(ctprvn_cd)가 있으나 전역 조인 키는 확인되지 않아, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
limits: vworld.kr 인증키(query 파라미터 key)가 따로 필요하며 포털 활용신청과는 별개다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터셋과 바로 결합되지 않는다. 범위는 전국이며 행정단위는 읍면동까지 확인되었다.
