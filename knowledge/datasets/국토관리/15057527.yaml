summary_user: 경기도 내 관람석 1천석 이상 실내체육관으로 등록된 공중이용시설을 사업장 한 곳당 한 행으로 담은 인허가·운영 현황 원천 목록이다. 시군명, 인허가일자, 영업상태, 폐업일자, 다중이용업소 여부, 주소와 위경도가 들어 있다. 위생·체육 행정 담당자나 분석가가 '우리 시군에서 지금 영업 중인 대형 실내체육관은 어디이고 실내공기질 점검 대상은 몇 곳인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·위경도를 맞춰 붙여 쓴다.
description_portal: 공중의 이용으로 인해 건강 및 공중위생에 영향을 미칠 수 있는 관람석1천석이상의 실내체육관에해당되는 경기도 내 공중이용시설(실내체육관) 현황입니다.이 데이터는 경기도 내 ‘공중이용시설’로 등록된 실내체육관의 인허가 및 운영 현황을 정리한 자료로, 다중이용시설로서의 공공 체육시설의 위생 및 안전 관리 현황을 포함하고 있습니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 다중이용업소여부, 위생업종명, 위생업태명, 도로명주소 및 지번주소, 우편번호, WGS84 위도 및 경도 좌표 등으로 구성되어 있습니다. 특히 실내체육관은 대규모 인원이 밀집하여 운동하는 장소로, 실내공기질 및 위생 상태가 건강에 직접적인 영향을 미칠 수 있는 공간으로 분류되며, 「공중위생관리법」 및 「실내공기질관리법」의 적용을 받습니다.이 데이터는 지역별 체육시설 분포 분석, 체육 복지 인프라 개선, 다중이용시설 위생점검 대상 파악, 감염병 대응 정책 수립, 실내 환경 개선 우선순위 설정 등의 용도로 활용할 수 있으며, 위경도 좌표는 공간정보 기반의 체육 인프라 분석에도 유용합니다. 본 자료는 경기도 및 각 시군 위생·체육 행정 부서에서 수집한 공공데이터입니다.
