summary_user: 인천광역시 연수구에 등록된 공장을 한 건씩 담은 시군구 단위 명부 파일로, 회사명·도로명 공장 주소·업종명·전화번호·생산품을 담는다(CSV 약 66KB). 연수구에 어떤 업종의 제조공장이 어디에 있고 무엇을 생산하는지 찾는 기업·투자자·지역 산업 분석가가 협력처 발굴이나 입지 검토에 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명이나 도로명 주소를 맞춰 붙이거나 주소를 지오코딩해 이어 써야 한다.
description_portal: '인천광역시 연수구의 공장등록 현황 자료는 해당 지역 내 제조업 기반 현황을 파악하고, 산업별 입지 및 특화 업종을 이해하는 데 유용한 정보를 제공합니다. 이 자료는 공장명, 도로명 주소, 업종명(예: 전기회로, 기계부품 등), 전화번호, 주요 생산품(예: 음향기기, 전자부품 등)으로 구성되어 있어, 지역 산업 구조 분석, 기업 간 협업 기회 발굴, 투자 및 입주 희망 기업의 입지 선정, 산업 정책 수립 등에 활용할 수 있습니다. 또한, 연수구의 산업 특성과 기업 네트워크 파악에 도움을 주며, 수요자 맞춤형 비즈니스 전략 수립이나 마케팅 기획, 연구 개발 협력에도 유익한 기초 데이터를 제공합니다.'
