summary_user: 충청남도 논산시에서 시공 중인 공동주택을 단지 한 건씩 담은 원천 목록으로, 아파트명·시공사·세대수·행정동·도로명/지번 주소·사업계획 승인일·착공일·사용검사 예정일을 담는다(CSV 파일 260바이트로 매우 작은 규모). 논산에서 어느 아파트가 언제 착공해 언제쯤 입주(사용검사) 예정인지, 어느 건설사가 몇 세대를 짓는지 확인하려는 주민·실수요자·지역 주택공급 분석가가 쓴다. 전역 조인 키(K-apt 단지코드 등)는 없어서 다른 데이터와는 아파트명이나 소재지 주소를 문자열로 맞춰 실거래·분양·K-apt 단지정보와 이어 써야 한다.
limits: 단지코드 같은 공통 키가 없어 다른 주택 데이터와 연결할 때 단지명·주소 매칭에 의존해야 하고, 표기 차이로 누락이 생길 수 있다. 범위는 논산시 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하다.
