summary_user: 경상남도 합천군에서 인허가를 받은 신축 건축물을 건별로 담은 파일로, 건축구분·대지위치·연면적·지상/지하 층수·주용도·부속용도·시공자 사무소명을 기록한다. 지역 분석가나 건설·부동산 사업자가 합천군에서 최근 어떤 용도·규모의 건물이 어디에 새로 지어지는지 보고 지역 개발 흐름을 앞서 읽는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)나 용도 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 해당 자료는 경상남도 합천군 신축 건축물 인허가 현황에 관한 자료입니다.본 데이터는 경상남도 합천군의 신축 건축물 인허가 건축구분, 대지위치, 연면적(제곱미터), 최대지상층수, 최대지하층수, 주용도, 부속용도, 시공자사무소명 등의 데이터를 포함합니다.자료를 통해서 건축물 인허가 진행 상황을 종합적으로 확인할 수 있으며, 해당 자료를 통하여 합천군의 도시 개발, 주거지 공급, 경제 분석 그리고 정책 개발 등의 자료로 활용할 수 있습니다.해당 데이터의 생성 기준일은 2023년 8월 9일 입니다.
