summary_user: 중앙토지수용위원회가 재결업무 참고용으로 재결정보시스템에 등록한 대법원 판례를 판례 한 건 단위로 담으며, 제목·판결문 내용·판례등록일·삭제여부 등이 들어 있다. 토지수용 재결이나 보상금 이의를 준비하는 토지소유자·사업시행자·법률 실무자가 '비슷한 수용·보상 쟁점에서 대법원은 어떻게 판단했나'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 재결 데이터와는 제목·내용 속 사건번호나 키워드를 맞춰 보거나 같은 기관(중앙토지수용위원회) 데이터끼리만 이어 쓴다.
description_portal: 재결업무 관련 판결문을 신속하고 간편하게 참고하고자 재결정보시스템에 등록시킨 대법원 판례로써 법원사건번호, 판결문 등의 내용이 포함되어있습니다.중앙토지수용위원회는 국민의 알권리 보장과 국정에 대한 국민 참여, 국정운영의 투명성을 확보하기 위해 중앙토지수용위원회에서 보유/관리하고있는 행정정보를 공개하고 있습니다.공공데이터 제공기관, 제공범위, 활용가능 분야 등을 안내하고 공공데이터를 활용한 창업과 사업화 방법에 대한 자문 등 공공데이터 개방(공공부문)과 이용 활성화(민간부문) 전반을 지원하기 위하여 제공하는 데이터 입니다.
