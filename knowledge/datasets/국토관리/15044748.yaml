summary_user: 대구도시개발공사가 시행한 택지개발사업을 사업지구 한 곳당 한 행으로 정리한 현황 파일로, 위치·면적(제곱미터)·사업비(백만원)·수용세대·사업 시작일과 종료일을 담는다(csv 987바이트 규모의 작은 목록). 대구 지역에 어떤 택지지구가 언제, 얼마의 사업비로 몇 세대 규모로 조성됐는지 확인하려는 시민·주택정책 담당자·부동산 분석가가 쓴다. 다른 데이터와 공통으로 쓰는 조인 키나 코드가 없어 사업지구명이나 위치 문자열을 다른 택지·도시개발 자료와 직접 맞춰 이어 써야 한다.
description_portal: '본 데이터는 대구도시개발공사(구 대구도시공사)에서 수행하는 택지개발사업의 현황을 상세히 제공하는 공공데이터입니다.택지개발사업은 쾌적하고 효율적인 도시 환경 조성을 위해 주택 건설 용지를 계획적으로 개발하고 공급하는 사업입니다.이 데이터는 각 사업지구별 주요 정보를 투명하게 공개하여 시민들이 대구 지역의 택지 공급 및 도시 개발 현황을 정확히 파악할 수 있도록 지원합니다.데이터에서 확인 가능한 주요 항목은 다음과 같습니다.- 사업지구명: 해당 택지개발사업의 고유 명칭- 위치: 사업이 진행되는 행정구역 상의 상세 위치- 면적: 개발 대상 부지의 총 면적 (단위: 제곱미터 등)- 사업비: 해당 사업에 투입되는 총 사업 예산 규모- 수용 세대: 해당 택지개발을 통해 공급될 주택의 총 세대 수- 사업 기간: 사업의 시작일과 종료일이 데이터는 도시 계획, 주택 정책 수립, 부동산 시장 분석, 학술 연구 등 다양한 분야에서 유용한 기초 자료로 활용될 수 있습니다.'
