summary_user: 전라남도 강진군 안에서 운영되는 전통시장을 시장 한 곳당 한 행으로 담은 파일(CSV 778바이트)로, 시장유형·개설주기·주소와 위경도·점포수·취급품목·사용 가능 상품권·주차장과 공중화장실 보유 여부 등을 수록한다. 주민이나 방문객이 "강진에서 5일장이 서는 시장은 어디이고 주차가 되는가"를 확인하거나, 분석가가 군 단위 전통시장 분포와 규모를 파악하는 데 쓴다. 공통 조인 키는 없어 시장명이나 주소·좌표를 기준으로 다른 시군의 전통시장 현황이나 상권·지도 데이터와 맞춰 이어 쓴다.
description_portal: '강진군 전통시장 현황에 관한 데이터는 강진군 내에서 운영되고 있는 각 전통시장의 구조적, 지리적, 상업적 정보를 종합적으로 담고 있는 자료로서, 지역 경제 분석, 전통시장 활성화 정책 수립, 상권 개발 등에 활용되는 중요한 기초 데이터입니다. 이 데이터는 시장명, 시장유형, 주소, 시장개설주기, 위도와 경도 등 시장의 위치 정보를 포함하며, 시장의 규모를 가늠할 수 있는 점포 수, 주요 취급 품목, 그리고 방문객 편의를 위한 주차장 보유 여부 등의 항목을 상세히 수록하고 있습니다. 시장명은 각 시장을 식별하는 고유 명칭으로 사용되며, 시장유형은 상설시장, 정기시장, 복합시장 등 운영 형태를 구분합니다. 주소는 정확한 위치 파악을 위한 행정 주소로 제공되며, 시장개설주기는 해당 시장이 운영되는 날짜나 주기(예: 매일, 5일장 등)를 의미합니다. 위도와 경도는 지도 상의 좌표 정보로 활용되며, 점포 수는 해당 시장 내 영업 중인 점포의 수를 나타냅니다. 취급 품목은 농산물, 수산물, 정육, 잡화, 의류 등 시장의 주요 거래 품목을 나타내고, 주차장 보유 여부는 차량 이용 고객의 접근성을 판단할 수 있는 중요한 항목입니다. 이와 같은 항목들은 전통시장 운영 실태를 파악하고, 지역 상권 분석 및 관광 자원화 등을 위한 정책적 의사결정에 매우 유용한 자료로 활용될 수 있습니다.'
