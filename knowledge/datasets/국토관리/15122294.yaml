description_portal: '지적재조사 사업절차에 따라 경계가 확정된 후 토지소유자 및 이해관계인에게 통지되는 지적확정예정통지서, 경계결정 통지서, 조정금조서 등에 대하여 이의 및 의견이 제출 되는 경우,해당 내용의 의견서를 위원회에 제출하고 의결된 내용을 관리합니다.(측량, 경계 확정, 지적도 작성 등이 이루어지는데, 토지 소유자나 이해관계자는 사업 진행 중 또는 완료 후 측량 결과나 경계 확정에 대해 이의가 있을 경우 이의신청을 할 수 있습니다.)지적재조사 사업의 필지별 지적확정예정에 대한 의견 제출, 경계결정에 관한 이의신청, 산정된 조정금에 대한 이의신청 접수 및 답변 상태, 등록일자를 조회 할 수 있습니다.사업지구 정보와 연관지어 사용하시면 됩니다.의견방법코드: 1=의견접수, 2=답변, 3=의견답변토지고유코드: PNU 19자리(예: 시도2+시군구3+읍면동3+리2+본번4+부번4+산구분1)등록일자: YYYY-MM-DD'
