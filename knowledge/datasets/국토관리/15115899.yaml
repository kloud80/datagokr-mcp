summary_user: 경기도 양주시 도시계획정보시스템(UPIS)에 등록된 지구단위계획구역과 개발제한구역의 현황도형을 도형 1건당 1행으로 담은 파일로, 관리번호·구역 이름(라벨명)·도형 면적과 경계 길이·도면번호·도형 생성일이 들어 있으며 포털 설명 기준 98행이다. 양주시에서 개발이나 토지 매입을 검토하는 사업자나 분석가가 '신읍동지구·봉양지구 같은 지구단위계획구역이 어디 있고 면적은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 법정동코드·PNU 같은 전역 조인 키가 없어서, 다른 데이터와는 구역 이름(라벨명)이나 도면번호를 같은 기관의 다른 UPIS 자료와 맞춰 보는 식으로만 이어 쓴다.
description_portal: 경기도 양주시_도시계획정보시스템(UPIS) 지구단위계획구역 및 개발제한구역 현황 데이터는 도시계획 및 토지이용 관리의 핵심적인 정보를 담고 있다. 데이터는 행정동별 관리번호, 라벨명, 면적(도형), 길이(도형), 도면번호, 현황도형 생성일 등의 항목으로 구성되며 총 98행이 수록되어 있다. 제공되는 라벨명에는 신읍동지구, 봉양지구, 회정지구, 상준지구, 제2종지구단위계획구역 등 다양한 지구단위계획구역과 개발제한구역이 포함된다. 특히 면적과 경계선 길이 정보가 함께 제공되어 해당 구역의 규모와 경계 특성을 명확히 파악할 수 있으며, 이는 도시개발 정책, 토지 관리, 주거 및 상업시설 개발 검토 시 중요한 기초자료로 활용된다. 또한 도면번호와 생성일이 포함되어 있어 최신 데이터 관리 및 도시계획 업무의 신뢰성을 높여준다. 이 데이터는 도시계획 수립, 연구기관의 공간분석, 공공정책 수립 등에 폭넓게 활용 가능하다.
