summary_user: 의성군 지역화폐인 의성사랑상품권을 쓸 수 있는 가맹점을 한 곳씩 담은 건별 목록으로, 가맹점번호·가맹점명·소재지·상세주소·가맹점 유형·수정일을 포함하며 범위는 의성군 한 시군구입니다(CSV 약 157KB). 군민이 '우리 동네에서 의성사랑상품권을 받는 가게가 어디인가'를 확인하거나, 분석가가 업종별·지역별 가맹점 분포를 살피는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 주소(소재지)나 가맹점 이름을 매칭하는 방식으로만 다른 상가·사업자 자료와 이어 쓴다.
