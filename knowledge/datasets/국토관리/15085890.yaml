summary_user: 주요 국가산업단지별 고용 인원을 분기 단위로 집계한 파일로, 단지별로 당분기 전체·남성·여성 고용 인원과 전분기 인원, 전분기 대비 증감률을 담는다(약 40개 행, 7개 열). 분석가나 지역 정책 담당자가 "이번 분기 어느 국가산단에서 고용이 늘거나 줄었는가"처럼 지역 제조업 고용 경기를 살펴볼 때 쓴다. 실측 컬럼에 산업단지코드 같은 공통 조인 키가 없어서, 산업단지 원장이나 같은 기관의 생산·수출·가동률 통계와는 산업단지 이름을 맞춰 연결해야 한다.
limits: 전역 조인 키가 없으므로 다른 데이터와 붙일 때는 단지명 매핑이 필요하다. 전국 단위의 비공간 집계 자료라서 위치 좌표나 개별 기업 단위 고용은 담지 않는다.
