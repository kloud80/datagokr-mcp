summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)에 등록된 공간시설 현황을 도형 단위로 담은 파일로, 도형마다 공간정보관리번호, 좌표 범위(X·Y 최솟값·최댓값), 라벨명, 면적·길이, 현황도형관리번호를 기록한다(CSV 약 4KB, 데이터 기준일 2024년 7월 19일). 진안군의 광장·공원·녹지 같은 공간시설이 어디에 얼마 크기로 있는지 확인하려는 분석가나 주민이 시설 위치와 규모를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(진안군) 데이터끼리만 이어 쓰며, 좌표 범위로 지도 위 다른 공간자료와 겹쳐 보는 방식이 가능하다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 공간시설 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 라벨 명, 면적(도형), 길이(도형), 현황 도형 관리 번호 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.
