summary_user: 전라남도 진도군의 주택을 제외한 일반건축물에 대해 지번(법정동·법정리·본번·부번)과 동별로 연면적과 시가표준액을 한 건씩 담은 시군구 단위 파일(csv, 약 79만 바이트)입니다. 진도군 상가·창고 같은 건물의 소유자나 매수 검토자, 세무 분석가가 '이 건물의 과세 기준 가액은 얼마이고 제곱미터당 얼마로 매겨졌나'를 확인하는 데 씁니다. 전역 조인 키는 없어서, 법정동·법정리 이름과 본번·부번을 법정동코드로 바꿔 필지 단위 자료(건축물대장, 공시지가 등)와 맞춰 잇습니다.
description_portal: 전라남도 진도군의 2024년 기준의 일반 건축물 시가표준액으로, 물건지의 지번별로 시가표준액과 연면적이 표시됩니다. 주택을 제외한 일반건축물에 대한 정보를 나타내고 있으며, 물건지별 동별, 호별로 알아볼 수 있습니다. 시가표준액은 위택스에서 지방세정보탭에서 정보공개에서 "시가표준액 조회"라는 메뉴에서도 확인할 수 있습니다. 시가표준액을 통해 자산가액을 유추해볼 수 있으며 연면적으로 나누어 제곱미터당 얼마에 산정되었는지 유추해볼 수 있습니다. 진도군 내의 여러가지 건물에 대한 정보를 확인할 수 있는 자료입니다.
