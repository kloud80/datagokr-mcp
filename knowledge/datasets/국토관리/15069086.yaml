summary_user: 경상남도 사천시 관내 필지별 개별공시지가를 필지 한 건씩(법정동·행정동·리·구분·본번·부번) 담은 원천 파일로, 결정지가는 제곱미터당 공시가격이며 포털 설명상 2016년 1월 1일 기준 자료다. 토지 소유자나 분석가가 사천시 특정 지번 토지의 공시지가를 확인하거나, 재산세 등 토지 관련 세금·부담금 산정의 기준가를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키(PNU 등)가 없어 다른 토지·건축물 데이터와는 법정동·리 이름과 본번·부번을 맞춰 지번 단위로 이어 써야 한다.
description_portal: '이 공공데이터는 2016년 1월 1일을 기준으로 경상남도 사천시의 개별공시지가를 수록한 자료입니다. 개별공시지가는 국가 및 지방자치단체가 토지 관련 조세(재산세, 종합부동산세 등)와 각종 부담금을 산정하는 데 활용하는 토지 가격의 기준이 되는 중요한 공시 자료입니다.데이터셋은 사천시 관내 모든 개별 필지에 대해 다음과 같은 핵심 정보를 포함하고 있습니다:읍면동, 리: 개별 토지의 행정 구역 위치를 상세히 구분합니다.토지구분: 해당 토지의 지목등 토지 이용 현황 관련 정보를 나타냅니다.본번, 부번: 토지를 식별하는 고유 지번정보결정지가: 해당 필지에 대해 공시된 제곱미터당 가격을 명시합니다. 이는 부동산 시장의 투명성을 확보하고, 공평 과세를 실현하는 데 가장 중요한 지표입니다.'
