summary_user: 광주 동구의 용도지역별 면적(제곱킬로미터)과 도시·비도시지역 인구를 연도 단위로 묶은 시군구 집계표이며, 상업·공업·주거·녹지 지역과 그 세부 종류, 관리·농림·자연환경보전 지역 면적을 한 행에 담는다(파일 크기 1,168바이트). 동구 전체 면적 가운데 녹지·주거·상업지역이 각각 얼마나 차지하는지, 공업지역이나 비도시지역이 있는지를 확인하려는 도시계획 분석가나 주민의 질문에 쓴다. 실측 컬럼에 법정동코드 같은 공통 조인 키가 없어, 다른 자치구 용도지역 현황과는 연도와 용도지역 항목 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 2005년 기준, 광주광역시 동구의 용도지역 현황은 도시의 중심부로서의 정체성과 자연환경의 조화라는 두 가지 큰 특징을 명확하게 보여줍니다. 당시 동구의 행정구역 전체 면적인 48.87km²는 모두 "도시지역"으로 지정되어 있었으며, 이는 동구가 비도시지역 없이 완전히 도시화된 공간임을 의미합니다.가장 눈에 띄는 점은 전체 면적의 약 81.3%에 해당하는 39.75km²가 "녹지지역"이라는 사실입니다. 이는 대부분 무등산 국립공원과 인접한 "자연녹지지역"(38.62km²)으로 구성되어 있어, 동구가 광주의 중심지임과 동시에 중요한 자연 보전 공간을 품고 있음을 보여줍니다.실질적인 도시 기능은 나머지 약 19%의 면적에 집중되어 있습니다. 시민들의 주요 생활 터전인 "주거지역"은 전체의 14.9%(7.28km²)를 차지했으며, 중·저층 주택 중심의 제2종 일반주거지역이 가장 넓은 비중을 차지했습니다.한편, 동구의 핵심적인 역할을 보여주는 "상업지역"은 전체 면적의 3.8%(1.84km²)에 불과했지만, 금남로와 충장로 일대를 포함하는 "중심상업지역"이 절반 이상을 차지하며 광주의 역사적·경제적 심장부로서의 기능을 수행했음을 알 수 있습니다. 반면, "공업지역"은 전혀 지정되지 않아 동구가 행정, 상업, 주거 중심의 도시 기능을 가진 지역임을 명확히 합니다.결론적으로 2005년 동구는 무등산이라는 거대한 자연녹지와 고밀도의 상업 및 주거 기능이 공존하는 독특한 용도지역 구조를 통해, 광주의 역사 깊은 원도심이자 자연과 함께하는 도시 공간으로서의 복합적인 성격을 띠고 있었습니다.
