summary_user: 전국 승강기의 안전검사 이력을 검사 건별로 담으며, 승강기고유번호·건물명·주소·시도·시군구와 함께 승강기 형식·운행층수·정격속도·제조업체, 검사실시일자·검사종류·판정결과·검사유효기간·검사기관을 준다. 건물 관리자나 이용자가 "우리 건물 승강기가 최근 검사에서 합격했는지, 검사 유효기간이 언제까지인지"를 확인하거나, 분석가가 지역별 불합격·부적합 현황을 살피는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 다른 데이터와는 승강기고유번호나 건물명·주소·시도·시군구 이름 매칭으로 잇고, 부적합 상세는 응답의 부적합내역조회코드(failCd)를 같은 기관의 부적합 내역 데이터에 넘겨 조회한다.
limits: 부적합 상세 조회에 필요한 필수 파라미터 fail_cd는 이 응답 등 다른 데이터에서 먼저 받아 넘겨야 한다. 포털 설명상 조회는 종료일 기준 최대 30일 구간으로 제한되므로 장기 이력은 기간을 나눠 반복 호출해야 하고, 개발계정은 일 10,000회 한도가 있다.
