summary_user: 경상북도 영천시에 있는 제조업체를 업체 한 곳당 한 행으로 담은 공장 현황 파일로, 회사명·소재지 주소·대표업종과 업종명·전화·팩스·종업원 수를 담는다. 영천시에 어떤 업종의 공장이 어디에 몰려 있고 고용 규모가 얼마인지 알아보려는 기업유치 담당자나 지역 산업 분석가, 협력업체를 찾는 사업자가 쓴다. 사업자번호·산업분류코드·필지번호 같은 전역 조인 키가 없어서, 다른 공장등록·기업 데이터와는 회사명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시 소재 제조업체 현황을 상세하게 기록한 자료입니다. 영천시 내에 위치한 다양한 산업체들의 기업명, 대표자명, 공장 주소, 업종, 고용인원 수  등 핵심 정보를 포함하고 있으며, 지역 산업구조와 기업 분포를 파악하는 데 유용한 자료입니다. 본 데이터는 자동차 부품, 플라스틱, 금속, 석재, 섬유, 식품 등 다양한 업종의 공장 정보를 포괄하고 있으며, 각 기업별 상세 주소와 생산품, 생산 규모, 면적 등을 구체적으로 제공하여 지역 산업의 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 개인정보 보호를 위하여 대표자명과, 전화번호의 경우 데이터의 일부분을 기호 처리하거나 공란처리 하였습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 기업유치과로 연락주시기 바랍니다.
