summary_user: 강릉시 여객자동차터미널을 터미널 한 곳당 한 행으로 정리한 건별 현황 파일로, 고속·시외 구분, 도로명 주소와 위경도, 준공년도·내진설계 여부, 연면적·대합실 면적, 운행노선 수와 이용 운송사업자 수, 승차권 판매방식, 관리부서를 담는다(CSV 721바이트의 소규모 파일). 시민이나 교통 분석가가 강릉시 터미널이 어디에 있고 얼마나 오래됐으며 내진설계가 됐는지, 노선이 몇 개인지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 터미널명칭·주소로 맞추거나 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: '강원특별자치도 강릉시 여객자동차터미널의 위치·시설·운영 현황을 정리한 데이터로, 터미널별 기본 정보와 규모, 노선 수, 안전·관리 정보를 한 번에 확인할 수 있도록 구성된 자료입니다.연번: 강릉시 여객자동차터미널을 구분하기 위한 일련번호시군구: 터미널이 위치한 시·군·구 명칭(강릉시 등)상세구분: 고속·시외·고속+시외 등 터미널 기능에 따른 구분터미널명칭: 각 여객자동차터미널의 공식 명칭주소: 터미널 건물의 도로명 주소위도: 터미널 위치의 위도 좌표(WGS84 기준)경도: 터미널 위치의 경도 좌표(WGS84 기준)준공년도: 해당 터미널 건물이 준공된 연도(YYYY 형식)내진설계여부: 내진 설계 적용 여부(예/아니오 등 코드값)유형: 터미널 시설의 유형(예: 일반터미널, 복합시설 등 지자체 분류)전체연면적(제곱미터): 터미널 각 층 바닥 면적을 합한 건축 연면적대합실면적(제곱미터): 승객 대기공간(대합실)의 전용 면적운행노선수: 해당 터미널에서 출·도착하는 노선의 개수터미널이용운송사업자수: 터미널을 이용하는 운송업체(버스회사) 수승차권 판매방식: 승차권 판매 방식(창구, 인터넷, 혼합 등)관리부서: 터미널 관리·감독을 담당하는 강릉시 내부 부서 명칭관리기관전화번호: 터미널 관리기관(또는 담당부서)의 대표 전화번호데이터기준일자: 여객자동차터미널 현황 정보가 확인·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 여객자동차터미널의 위치·규모·노선·안전성·관리체계를 파악하고, 대중교통 인프라 확충 및 시설개선 계획, 노선 조정·환승체계 정비, 재난·안전 관리, 이용객 안내 서비스·교통정보 시스템 구축 등에 활용할 수 있는 공공데이터입니다.'
