summary_user: 경기주택도시공사 기존주택 전세임대 사업의 공급호수를 경기도 31개 시군별, 연도(구분)별로 집계한 1,880바이트 규모의 작은 CSV 파일로, 시군이 열로 펼쳐진 표 형태입니다. 주거복지 분석가나 지자체 담당자가 '우리 시군에 해마다 전세임대가 몇 호씩 공급됐고 다른 시군과 비교하면 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없으므로 다른 주택·임대 데이터와는 시군 이름을 시군구 코드로 직접 매핑해 붙여야 한다.
description_portal: 경기주택도시공사에서 도시 저소득 계층의 주거안정과 자활을 위하여 다가구주택 등을 매입하여 개보수 후 시중 전세가의 30퍼센트 수준으로 저렴하게 임대하는 기존주택 전세임대 사업의 시군별 공급 현황 데이터로써 수원시, 성남시, 구리시, 군포시, 고양시, 과천시, 광명시, 남양주시, 연천군, 의정부시 등 경기도 내 31개 시군의 연도별 공급호수 등의 정보를 포함하고 있습니다. 주거복지 정책의 실효성 분석, 지역별, 연도별 수요 대응력 파악, 공급의 형평성 평가 등에 활용될 수 있으며, 정부와 지자체의 주택복지 확대 전략 수립 시 필수적인 참고자료입니다.
