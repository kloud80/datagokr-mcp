summary_user: 경기도 양주시의 상수도 사용 현황을 검침년월별 한 행에 읍면동(은현면·남면·광적면·백석읍·장흥면·양주1·2동·회천1~4동 등 11개)마다 건수·가구수·사용량·조정량을 열로 펼쳐 담은 집계 파일이며, 사용량은 가정용·일반용·전용공업용·욕탕용을 합친 값입니다. 분석가나 시 담당자가 '양주시 어느 동의 월별 수돗물 사용량이 늘고 있나, 가구당 사용량은 지역별로 어떻게 다른가' 같은 질문에 쓴다. 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 검침년월과 읍면동 이름을 맞춰 인구·세대 통계 등과 이어 써야 합니다.
description_portal: '경기도_양주시_읍면동별, 월별 상수도 사용 현황에 관한 데이터로 건수, 가구수, 사용량, 조정량의 내용을 포함하고 있습니다.상수도 사용량 : 가정용, 일반용, 전용공업용, 욕탕용의 사용량을 종합한 값가구수와 건수의 차이 : 아파트의 경우 가구수는 고지서의 건수로 나타내며 건수는 세대수로 나타내기에 값에 차이가 있습니다.'
