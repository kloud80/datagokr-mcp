summary_user: 한국토지주택공사가 조성 중인 남양주왕숙 공공주택지구의 토지이용계획을 용도별(주택건설용지, 단독·공동주택용지, 공원녹지, 도로 등) 면적(제곱미터)과 구성비(퍼센트)로 정리한 소규모 집계표(CSV 약 1.4KB)다. 지구 안에서 공원녹지나 공동주택용지가 얼마나 차지하는지 확인하려는 주민·부동산 분석가·사업자가 '남양주왕숙 지구는 주거와 기반시설에 땅을 어떻게 배분했나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 지구명·용도명을 이름으로 맞추거나 같은 기관(LH)의 다른 지구 토지이용계획표와 나란히 비교하는 방식으로만 잇는다.
description_portal: 한국토지주택공사에서 개발 조성중인 남양주왕숙 지구 토지이용계획표로 전체 토지이용계획의 면적, 구성비 및 주택건설용지, 단독주택, 공동주택등 부분별 면적, 구성비 정보 제공합니다. 토지이용계획표는 특정 토지의 이용 목적과 규제 사항을 한눈에 확인할 수 있도록 표 형태로 정리한 정보입니다. 면적(제곱미터)별로 살펴볼 때 공원녹지 58.2만(24.3%), 공동주택용지 52.3만(22%), 도로 40.8만(17.1%)를 차지합니다. 남양주왕숙 지구는 주택 6만호, 인구 15.1만명을 목표로 「수도권 주택공급 확대방안」 일환으로 수도권 주택시장 및 서민 주거 안정을 위해 계획한 공공주택지구입니다.
