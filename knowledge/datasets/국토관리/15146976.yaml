summary_user: 충청북도 옥천군 내 경로당을 한 곳당 한 행으로 정리한 목록 파일로, 읍면·행정리·경로당명·우편번호·회원수·소유자를 담는다(범위는 옥천군 한 시군구, 행정단위는 읍면동). 옥천군 주민이나 복지 담당자가 '우리 읍면에 경로당이 몇 곳 있고 회원 규모는 어떤가'를 확인하거나 읍면별 노인 여가시설 분포를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면·행정리 이름이나 우편번호를 매핑해 붙여야 한다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 이름 매칭으로만 연결되므로 표기 차이에 주의해야 한다. 범위가 옥천군 한 곳뿐이라 다른 시군과의 비교에는 별도 데이터가 필요하다.
