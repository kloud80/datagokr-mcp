summary_user: 경상남도 거제시에서 신고된 아파트 매매를 거래 건별로 담은 원천 파일로, 거래금액(만원)·계약 연월일·아파트명·법정동·전용면적(㎡)·층·건축년도가 들어 있다. 거제시 아파트를 사거나 팔려는 사람과 분석가가 "이 단지의 같은 면적대가 최근 얼마에 거래됐나"나 동별 가격 흐름을 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 지역코드·법정동 이름이나 아파트명을 맞춰 붙여야 하며 같은 기관의 다른 실거래 파일과 함께 쓰는 것이 현실적이다.
description_portal: 이 데이터는 경상남도 거제시에서 실제로 이루어진 아파트 매매 거래 내역을 기록한 공공데이터입니다. 거래 건별로 거래금액(만원), 계약일자(연·월·일), 아파트명, 법정동 주소 등이 포함되어 있어, 부동산 가격 동향이나 지역별 거래 특성을 분석하는 데 활용됩니다. 또한 건축년도와 전용면적(m²), 층수, 지역코드, 기준년월 등의 정보도 함께 제공되어 상세한 시장 분석이 가능합니다.거래금액은 만원 단위, 전용면적은 제곱미터(㎡) 단위이며, 날짜 정보는 계약 기준입니다. 이 데이터는 실거래를 기반으로 하므로, 허위 매물이나 시세와는 차이가 있을 수 있습니다.
