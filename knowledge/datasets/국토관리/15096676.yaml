summary_user: 제주특별자치도 안에서 농촌융복합산업(6차 산업) 인증을 받은 사업자를 경영체 한 곳당 한 행으로 담은 현황 목록이며, 기준 연월·시군구·경영체명·주요 생산 품목·유형을 포함한다. 제주에서 어떤 품목으로 6차 산업 인증을 받은 경영체가 어느 시군구에 몰려 있는지 확인하려는 농업인·지자체 정책 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군구 이름이나 경영체명을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터셋은 2021년 기준으로 제주6차산업지원센터에서 집계하여 공개한, 농촌융복합산업 인증제 인증을 받은 제주특별자치도 내 사업자들의 현황 자료이다. 경영체명과 이들이 생산하거나 가공하는 주요 품목 정보가 포함되어 있으며, CSV 형식으로 누구나 무료로 열람‧활용할 수 있다. 이 자료는 제주 지역 농촌 융복합 산업의 분포와 구성 현황을 객관적으로 보여주는 기본 통계로, 농산물 가공, 유통, 체험·관광, 농촌경제 활성화, 지역 특화 산업 개발, 지역 농가의 부가가치 창출과 일자리 확대 가능성을 분석하는 데 유용하다. 또한 인증 사업자의 지역 분포와 품목 정보를 활용하여 지역별 산업 다양성, 생산 역량, 농촌자원 활용 현황을 진단하고, 지자체나 정책 입안자가 6차 산업 전략을 설계하거나 지원 우선순위를 설정할 때 근거자료로 삼을 수 있다.
