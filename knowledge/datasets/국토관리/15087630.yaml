summary_user: 제주특별자치도 상하수도본부가 다루는 상수도·하수도 민원(누수신고, 수도계량기 검사, 급수공사, 단독정화조 설치 등)을 민원 한 건당 한 행으로 정리한 안내 목록으로, 구분·민원명·접수처·접수방법·소요시간·수수료를 담은 약 1.9KB 크기의 작은 CSV 파일이다. 제주 주민이나 시공 사업자가 '수도 누수 신고나 급수공사 신청은 어디에 어떻게 접수하고, 수수료와 처리 기간은 얼마인가'를 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 다른 상하수도 데이터와는 민원명이나 같은 기관(제주시·서귀포시 상하수도과) 기준으로만 맞춰 쓴다.
