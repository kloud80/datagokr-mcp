summary_user: 충청남도 보령시 전통시장의 상점별 상품 정보를 담은 API로, 시장명·상점명·취급 품목 수·카테고리·상품 설명·이미지 목록과 상품권 사용 여부로 보이는 항목(USE_GCCT)을 건별로 제공한다. 보령시 주민이나 방문객이 '어느 전통시장의 어느 점포에서 이 품목을 파는가'를 찾거나, 지역 상권 분석가가 시장별 취급 품목 구성을 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 전통시장·상권 데이터와는 시장명(MRKT_NM)·상점명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
limits: 공통 코드나 표준 식별자가 없어 다른 데이터와 결합할 때 이름 기반 매칭에 의존해야 한다. 범위는 보령시 한 개 시군구이고 좌표가 없는 비공간 데이터라 지도 위 위치 분석에는 바로 쓰기 어렵다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며, 개발계정은 하루 8,000회로 제한된다.
