summary_user: 지적재조사 사업지구 하나를 한 행으로 두고 시군구·기준년도·사업지구명·사업시행자·위치·면적·필지수·소유자동의율·면적동의율·진행상태 이력 수 등을 관리카드 형식으로 담은 전국 범위 CSV 파일(약 1MB)이다. 지자체 담당자나 분석가가 "우리 시군구의 지적재조사 지구는 어디이고 토지소유자 동의율과 진행 단계는 어떤가"를 확인하거나 연차별 사업 현황을 정리하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 시군구코드·시군구명으로 행정구역 단위 통계와 맞추거나 사업지구명·사업위치를 이름으로 대조해 연속지적도 등 필지 데이터와 이어 쓴다.
description_portal: '지적재조사 사업지구 단위로 사업개요, 추진현황, 위치정보 등 다양한 행정 데이터를 종합해 기록한 관리카드 형식의 자료입니다. 사업의 이력관리와 실무자 참고용으로 활용됩니다.1. 형식: CSV2. 내용 요약■ 사업지구코드: 고유 식별 번호로 사용되는 지구 코드■ 사업지구명: 지적재조사 대상 지역의 명칭■ 시도/시군구: 해당 사업지구의 행정구역■ 사업년도: 사업이 추진된 연도■ 총필지수: 해당 지구 내 총 필지 수■ 사업면적(㎡): 지적재조사 대상 지역의 면적■ 경계결정필지수: 경계가 확정된 필지 수■ 측량완료필지수: 측량작업이 완료된 필지 수■ 사업완료여부: 완료, 진행 중 등의 상태 표시■ 비고: 기타 특이사항 기재란3. 활용 예시■ 전국 지적재조사 사업지구의 진행상태 파악■ 지역별 사업성과 정리 및 이력 확인■ 행정기관의 연차별 사업평가 및 보고서 작성■ 사업 대상 필지에 대한 민원 대응 근거자료 활용'
