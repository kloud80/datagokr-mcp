summary_user: 경기도 의정부시의 개별공시지가를 필지 단위로 담은 파일로, 소재지·법정동·구분·본번·부번으로 필지를 가리키고 결정지가(㎡당 원)와 공시기준일을 함께 담는다. 토지 소유자나 매수 검토자가 의정부시 특정 지번의 ㎡당 공시지가가 얼마인지, 동별로 지가 수준이 어떻게 다른지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(PNU 같은 필지 고유번호)가 없어, 다른 토지·건축물 자료와는 법정동명과 본번·부번을 조합해 이름 매핑으로 이어야 한다.
limits: 필지 고유번호 같은 전역 조인 키가 없어 다른 데이터와 연결할 때 법정동 이름과 지번을 직접 맞춰야 하며 표기 차이로 매칭이 어긋날 수 있다. 범위는 의정부시 한 곳으로, 다른 시군구 지가와 비교하려면 별도 자료가 필요하다.
