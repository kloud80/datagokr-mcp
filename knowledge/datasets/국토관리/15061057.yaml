summary_user: 주택분양보증을 받아 분양한 전국 민간 신규아파트의 ㎡당 분양가격(천원)을 지역·전용면적 규모·연월별로 집계한 파일로, 검증 시 11,050행을 받았다. 분양을 앞둔 수요자나 분석가가 "우리 지역 85㎡ 이하 신규 아파트의 ㎡당 분양가가 최근 몇 년간 얼마나 올랐나"를 확인하는 데 쓰며, ㎡당 가격에 공급면적을 곱하면 대략의 평형별 분양가를 낸다. 전역 조인 키는 없어 지역명·연월을 이름으로 맞춰 부동산원 가격 동향 등 다른 주택 통계와 이어 쓴다.
description_portal: '주택분양보증을 받아 분양한 전체 민간 신규아파트 분양가격 동향으로 지역별, 면적별 분양가격 등의 자료를 제공합니다.*신규아파트를 소비자에게 분양할 때의 분양가격으로, 주택공급에 관한 규칙 제3장 제1절에 의하여 승인받은 입주자모집공고상 가격을 기준으로 함*㎡당 분양가격을 평형별 분양가로 환산하기 위해 해당 기초금액에 환산 공급면적을 적용하면 대략적 분양가격 산정이 가능(1㎡=0.3025평)*규모별 ㎡당 분양가격은 지역별 ㎡당 분양가격을 전용면적 기준 규모별로 데이터를 구분하여 산출하였으나 평균 분양가격 산정방식은 동일함*규모별 ㎡당 분양가격 구분기준   · 규모1 : 전용면적 60㎡이하   · 규모2 : 전용면적 60㎡초과 85㎡이하   · 규모3 : 전용면적 85㎡초과 102㎡이하   · 규모4 : 전용면적 102㎡초과해당 데이터는 주택도시보증공사 홈페이지 및 통계청 KOSIS에서도 확인가능하오니 참고하시기 바랍니다.'
