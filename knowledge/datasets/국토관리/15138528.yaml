summary_user: 경기도 이천시가 발행한 고시를 한 건씩 담은 원천 파일로, 고시관리코드·고시일자·고시번호·제목·내용을 담으며 범위는 이천시 한 시군구다. 지역 주민이나 개발 사업자가 '이천시에서 특정 지역의 도시관리계획 결정이나 개발행위 관련 고시가 언제 나왔는가'를 확인하고, 분석가가 고시 이력을 연도별로 추적하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 고시번호·제목 속 지명이나 사업명을 이름으로 맞추거나 같은 기관(이천시) 기준으로만 연결한다.
limits: 표준 행정코드나 필지번호 같은 공통 키가 없어 토지·용도지역 데이터와 자동으로 결합할 수 없고, 비공간 데이터라 고시 대상의 위치를 지도에 바로 올릴 수 없다. 갱신은 정해진 주기 없이 수시로 이루어진다.
