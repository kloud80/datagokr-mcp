summary_user: 전북특별자치도 도내 시군에 있는 농업용 저수지를 저수지 한 곳당 한 행으로 담은 제원 현황 파일로, 소재지(시군·읍면·리동), 설치년도, 수혜면적·유역면적, 총저수량·유효저수량, 제당 높이·길이를 담는다. 농업용수 담당자나 분석가가 '우리 군에서 오래된 저수지 중 저수량이 큰 곳은 어디인가'처럼 노후도와 규모를 함께 볼 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 시군·읍면·리동 이름이나 저수지명을 맞춰 연결해야 하고, 시설별 상세 정보나 저수율은 한국농어촌공사 농촌용수종합정보시스템 자료와 저수지명으로 대조해 이어 쓴다.
description_portal: 전북특별자치도 도내 시군에 있는 저수지 현황을 개방하여 데이터 활용 수요자에게 제공하고자 합니다. 데이터개방 항목은 시군별, 저수지명, 읍면,  리동, 설치년도, 수혜면적(ha), 유역면적(ha), 총저수량(천㎥), 유효저수량(천㎥), 제당높이(m), 제당길이(m)로 구성되어 있습니다.  자세한 사항은 농촌사회활력과(063-280-2636)로 연락하여 주시기 바랍니다.또한, 저수지 및 양수장, 배수장 등 농업생산기반시설에 대한 보다 구체적인 정보는 한국농어촌공사 농촌용수종합정보시스템(https://rims.ekr.or.kr/selectFacList.do)을 참고하시기 바랍니다.  ※ 본 자료는 작성 시점의 정보를 기반으로 하며, 실제 현황과 일부 차이가 있을 수 있습니다.
