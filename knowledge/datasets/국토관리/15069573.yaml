summary_user: 중앙토지수용위원회 토지재결정보시스템(LTIS)에 가입해 쓰는 사업 인허가권자 목록을 기관·담당자 단위로 담은 전국 범위 파일로, 소속기관명·기관 전화번호·담당부서명·담당자명이 들어 있다. 공익성 협의 자료 제출과 관련해 특정 개발사업 인허가 기관의 담당 부서와 연락처를 찾으려는 사업시행자나 실무자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명을 이름으로 맞추거나 같은 기관 코드로만 연결한다.
