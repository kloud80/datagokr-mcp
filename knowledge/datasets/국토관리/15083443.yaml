description_portal: 부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 세입 집계정보(세입월집계_분류코드별) 자료입니다.상하수도 세입집계는 지방공기업 특별회계 내 경상적세외수입 등으로 분류되며, 크게 사용료, 수수료, 부담금 등으로 세분화됩니다. 주요 항목으로 상수도 사용료(가정용/일반용/산업용)와 하수도 사용료가 있으며, 이는 ㎥당 사용량에 따라 징수됩니다. 또한 수도계량기 구경별 정액 요금인 '계량기 구경별 요금'과 지하수 사용에 따른 요금도 포함됩니다. 시설 설치 시 부과되는 하수도원인자부담금과 과년도 미납분인 과년도 수입 등도 중요한 세입 항목입니다. 이러한 분류코드는 세입예산 사업명세서에 따라 명확히 구분되어, 상수도사업본부 등의 수입으로 집계됩니다
