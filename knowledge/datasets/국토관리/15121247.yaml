summary_user: 인천 서구 안 도시개발사업 지구별로 보유한 체비지를 필지 단위로 정리한 파일로, 지구명·동명·지번·지목·면적(제곱미터)을 담는 소규모 CSV(약 2.3KB)다. 체비지 매각·활용을 검토하는 사업자나 공공자산을 관리하는 담당자가 "어느 지구에 어떤 지목의 체비지가 얼마나 남아 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 동명과 지번을 주소 문자열로 맞춰 토지대장·공시지가 같은 필지 단위 데이터와 연결해야 한다.
