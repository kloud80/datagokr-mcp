summary_user: 제주 신도포구(돌고래소공원) 무장애 관광지를 기준으로 주변 시설의 종류·명칭·관광지로부터의 반경(m)·주소·연락처·이용정보를 시설 한 곳당 한 행씩 담은 소규모 CSV 파일(766바이트)이다. 휠체어·유모차 이용자나 고령 여행자가 신도포구 방문 전에 근처 음식점·숙박 등 편의시설이 어디에 있고 어떻게 연락하는지 알아보거나, 무장애 여행 코스를 짜는 담당자가 주변 시설을 확인하는 데 쓴다. 전역 조인 키가 없어 같은 기관의 다른 무장애여행 관광지 주변정보 파일과는 관광지명 같은 이름으로, 다른 시설 데이터와는 주소 텍스트 매칭으로만 이어 쓴다.
description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 신도포구(돌고래소공원)은 제주 서귀포시 대정읍 인근 해안에 위치한 해안 공원 및 포구 지역으로, 바다 전망 해안 산책로와 포구 경관, 공원 시설이 결합된 여유로운 관광 공간이며 장애인 전용 주차장, 무단차 출입구, 포장된 보행로 및 장애인 화장실 등 무장애 편의시설이 확보되어 휠체어나 유모차 이용자, 고령자, 교통약자 등도 바다 경관과 해안 산책을 부담 없이 즐길 수 있는 열린 관광지로 설계되어 있어 관광 안내, 무장애 여행 코스 설계, 관광 콘텐츠 개발 및 공공 관광 정책 수립 등에 기초 자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
