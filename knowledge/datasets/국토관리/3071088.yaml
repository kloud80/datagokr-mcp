description_portal: 성남시 수도요금 부과내역현황 자료는 성남시에서 월별로 부과한 수도요금 정보를 정리한 자료입니다. 상수도요금, 하수도요금, 물부담금 등 항목별 요금내역을 포함하며, 부과년월, 부과건수, 총부과액등의 항목으로 구성되어 있습니다. 해당 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다. 해당자료는 수도요금 변동 추이분석, 물 사용 현황 연구, 정책수립 등 다양한 분야에서 활용 가능하며, 성남시 상하수도요금 조회납부 사이버창구에서 직접 확인할 수 있습니다.
