description_portal: '본 데이터는 K-water가 관리하는 정수장 및 공급과정의 실시간 유량정보를 1시간 단위로 제공하는 자료입니다.ㅁ 제공지점 : 취수장, 정수장, 가압장ㅁ 제공항목 : 시설별 유량[㎥ 또는 ㎥/h], 관리번호, 태그SN, 태그설명, 데이터항목구분(M,A, D, F)  * 관리번호, 태그SN, 태그설명 : 측정항목의 고유값(내부관리용)  * M : 순시값, 정시기준 측정된 실시간 유량[㎥/h]  * A : 적산값, 1분마다 측정한 값이 계속 누적[㎥]  * D : 적산차값, 적산의 매시간 차이를 계산한 결과[㎥]  * F : 순시적산, 적산계가 없을경우 순시(1분)의 값을 누적하여 적산처럼 사용[㎥/h]'
