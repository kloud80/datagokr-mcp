description_portal: 서울특별시 광진구_저수조청소업 인허가 정보는 광진구 관내 건축물 및 시설물의 급수설비 중 저수조를 위생적으로 유지·관리하기 위해 청소 서비스를 제공하는 업소들의 인허가 현황을 담은 데이터입니다. 저수조청소업은 수돗물 공급의 위생적 유지를 위한 법적 의무사항에 따라 정기적으로 수행되며, 이 업소들은 수도법에 따라 등록된 전문 업체로 구성되어 있습니다. 본 데이터에는 업소명, 사업장 주소, 인허가 일자, 업종 구분, 운영 상태 등의 항목이 포함되어 있으며, 저수조 위생 관리 실태 파악 및 민원 대응, 관련 정책 수립에 활용 가능합니다. 제공되는 좌표 정보는 중부원점TM(EPSG:2097) 좌표계 기준이며, 위경도 좌표는 포함되어 있지 않습니다. 데이터는 3일 전 기준 최신 정보를 반영하여 제공됩니다.
