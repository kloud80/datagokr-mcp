description_portal: 광주광역시도시공사에서 시행하는 임대주택 모집 관련 정보를 정리한 데이터입니다. 본 데이터는 주택명, 모집공고일, 모집대상, 모집기간, 모집인원, 데이터기준일자 항목으로 구성되어 있습니다. 주택명 항목을 통해 해당 모집이 이루어지는 임대주택의 명칭을 확인할 수 있으며, 모집공고일과 모집기간 항목은 신청 일정과 시기를 파악하는 데 활용됩니다. 모집대상은 공급 대상자의 자격 요건을 나타내며, 모집인원은 해당 회차에 공급 예정인 세대 수를 제공합니다. 데이터기준일자는 정보의 최신성과 행정 처리 시점을 확인하는 기준이 됩니다. 본 데이터는 시민의 임대주택 신청 편의 향상, 수요 기반의 공급 정책 수립, 모집 계획의 투명한 공개를 통해 공공주택 운영의 공정성과 효율성을 제고하는 데 목적이 있습니다. 주택복지 실현을 위한 기초자료로 활용될 수 있습니다.
