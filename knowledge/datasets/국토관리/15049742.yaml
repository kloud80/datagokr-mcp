summary_user: 한국주택금융공사가 발행한 유동화증권(MBS 등)을 트랜치 단위로 정리한 원장 파일로, 트랜치마다 발행금액·발행일자·만기일자·표면금리를 담는다(전국·비공간, csv 약 20만 바이트). 채권 투자자나 주택금융 분석가가 특정 유동화 발행분의 트랜치별 만기 구조와 표면금리 분포를 확인할 때 쓴다. 유동화계획코드(hf_liqd_plan_cd)로 같은 공사의 유동화계획 단위 정보와 묶고, 트랜치코드(hf_tranche_cd)로 트랜치별 상환·잔액 등 다른 원장 자료와 이어 쓴다.
description_portal: 한국주택금융공사_유동화증권 원장정보(트랜치정보) 데이터는 한국주택금융공사의 유동화증권 원장정보(트랜치정보) (트랜치코드, 유동화계획코드, 발행금액 등)이 포함되어있습니다.. 이 시계열 자료는 연도별 통계 지표를 체계적으로 정리하여 장기적 변화를 명확히 파악할 수 있도록 구성되었습니다. 연도별 일반가구 통계표와 이용가구 통계표를 통해 주요 지표의 흐름을 종합 분석할 수 있습니다. 대출 규모, 보금자리론 가입 현황, 이용 비율, 상환 방식, 평균 금리 등 핵심 데이터를 포괄적으로 제공합니다. 이 자료는 정책 효과 평가와 시장 수요 예측, 리스크 관리 방안 수립 등 다양한 연구 및 실무적 분석 목적에 활용하기 적합합니다. 공공데이터 포털 사용자는 세부 지표 비교를 통해 정교한 정책 대응과 시장 동향 분석을 수행할 수 있습니다. 특히, 주택 금융 정책 수립과 집값 안정화 전략 마련을 위한 기초 자료로서의 가치를 갖습니다.
