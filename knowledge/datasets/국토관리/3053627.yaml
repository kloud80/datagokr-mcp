summary_user: 개별형 외국인투자지역으로 지정된 기업별로 기업명·위치·면적(천㎡)·최초지정일을 한 행씩 담은 전국 단위 목록 파일(csv, 약 5.5KB)이다. 외국인 투자기업이나 입지 정책 분석가가 "개별형 외국인투자지역으로 지정된 기업은 어디에 있고 언제 지정됐는가"를 확인하는 데 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어, 산업단지 원장이나 단지형 외국인투자지역·경제자유구역 자료와는 기업명·위치 텍스트를 맞춰 이어 써야 한다.
description_portal: 본 데이터는 개별형 외국인투자지역에 대한 통계 데이터로 외국인이 국내에 투자 시 입지 현황에 대한 기본적인 정보를 제공하며,개별형 외국인투자지역 입주 시 일반 산업단지, 단지형 산업단지와 다른 혜택이 주어지기에 참고로 사용하기 적절하며다른 지역인 단지형 외국인투자지역 및 기타 특구지역(자유무역지역, 경제자유구역청)에 대한 정보가 기 제공 됨에 따라 개별형 외국인투자지역에 대한 정보만 추출(고시를 통해 공개된 정보를 취합)하여 제공하고자 함. 전국산업단지의 현황에 대한 체계적인 조사를 통해 정부의 효율적인 산업입지 정책수립의 기초 통계자료 활용 및 잠재투자기업에게 입지수요 정보 제공- 개별형 외국인투자지역 현황으로 연번, 기업명, 위치 등을 제공
