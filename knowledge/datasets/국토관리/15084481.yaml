summary_user: 충주시 도시재생 전략계획·활성화계획 구역 안에서 창업해 운영 중인 업소를 한 곳씩 담은 건별 목록으로, 업종·업소명·도로명/지번 주소·사회적기업 여부·기준일을 담는다(CSV 약 7KB의 소규모 파일). 도시재생 담당자나 분석가가 '충주 도시재생지 안에 어떤 업종의 창업이 얼마나 모였고 그중 사회적기업은 몇 곳인가'를 확인하고 창업 밀도·유휴공간 활용 성과를 점검하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 주소를 지오코딩하거나 업소명·주소를 문자 그대로 맞춰 이어 쓴다.
description_portal: 충청북도 충주시 도시재생사업 대상지 내에서 창업한 업체의 현황 정보를 제공하는 데이터입니다.업종명, 업소명, 소재지(도로명 및 지번), 사회적기업 여부, 데이터 기준일 등의 항목으로 구성되어 있으며, 지역 기반 창업지원 및 도시재생 성과 관리에 활용됩니다.대상 지역은 충주시 도시재생 전략계획 및 활성화계획에 포함된 구역 기준으로 설정되며, 사업지 내 실제 운영 중인 창업 업소를 기준으로 작성됩니다.업종명은 자율 기재 또는 사업계획서 기준 분류이며, 문화·예술·공방·임대업·식음료 등 다양하게 포함됩니다.사회적기업 여부는 고용노동부 인증 현황 또는 자치단체 등록 기준으로 구분되며, "부"는 비사회적기업을 의미합니다.본 데이터는 도시재생 유휴공간 활용 실태 분석, 창업 밀도 분석, 청년·소상공인 지원정책 설계, 지역경제 활성화 모니터링 등에 행정 및 민간 활용이 가능합니다.※ 실제 영업 여부, 폐업 여부, 사업 유형 변경 등은 주기적인 현장 조사 및 관계기관 확인을 통해 갱신되며, 활용 시 기준일자를 반드시 확인하시기 바랍니다.
