summary_user: 포천시의 유동인구를 00시~23시 1시간 단위(hr_cd)로 성별·5세 연령대(0~69세)와 외국인 여부별로 나눠 담은 집계 자료로, 이동통신 기지국 데이터를 50m×50m 셀에 분배해 산출하므로 소수점 값이 나온다. 상권 분석가나 포천시 정책 담당자가 "포천에서 저녁 시간대 20~30대 여성 유동인구가 얼마나 되나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 코드·이름(signgu_cd, signgu_nm) 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 포천시 지역을 대상으로 시간대별 유동인구 정보를 제공하는 자료로, 00시부터 23시까지 1시간 단위로 수집된 정보를 포함하고 있습니다. 유동인구는 성별 및 연령대(0~69세)를 기준으로 세분화되어 있으며, 남자0009수 또는 여자2529수와 같은 항목을 통해 각 연령층의 인구수를 파악할 수 있습니다. 또한 외국인 여부도 ‘외국인구분’ 항목을 통해 구분됩니다. 유동인구 수치는 이동통신 기지국 데이터를 기반으로 하며, 인근 50m×50m 셀 단위로 분배됨에 따라 소수점 값이 발생할 수 있습니다.
