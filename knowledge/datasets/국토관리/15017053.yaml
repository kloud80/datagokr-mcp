summary_user: 경기도 광명시 소재 지식산업센터 10곳을 건물 단위로 담은 파일 데이터로, 입주업체수·부지면적·건축연면적·허가·착공·준공·사용승인 일자와 소재지를 싣고 있으며 1992-07-20부터 2023-09-15까지의 날짜가 들어 있다. 시 공무원이나 기업 지원 담당자, 분석가가 광명시에 지식산업센터가 어디에 얼마 규모로 들어서 있고 입주업체가 몇 곳인지 확인하는 데 쓴다. 소재지 우편번호·지번주소·도로명주소와 위경도 좌표를 키로 다른 주소·좌표 데이터와 이어 쓰며, 건물관리번호가 있으면 건축물대장과 연결할 수 있다는 검토 메모가 있으나 이 파일에는 해당 필드가 없다.
description_portal: 경기도 광명시 소재 지식산업센터에 대한 데이터로 지식산업센터의 입주업체수, 부지면적, 건축연면적, 허가일, 착공일, 준공일자, 사용승인, 소재지 등의 정보를 제공합니다.데이터는 연간주기로 업데이트 되며 해당자료는 지역 내 지식산업센터의 기본 정보와 주요 시설 규모를 표준화된 형식으로 기록하여 행정, 산업 정책 및 기업 지원 계획 수립을 파악하는 자료로 활용될 수 있습니다. 이 데이터와 관련된 세부정보는 광명시청(https://www.gm.go.kr/) 분야별정보(지식산업센터 현황 및 관리)를 참고하여 주시기 바랍니다.
