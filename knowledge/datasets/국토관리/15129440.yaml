description_portal: 지적도근점은 토지의 수평위치를 측정할 때 기준이 되는 지적기준점입니다. 설치간격은 약 50~300m로 도근점 보통 직경 10cm 내외의 둥근 쇳덩이로 되어 있으며, 아스팔트 포장 도로나 인도, 공공기관 주변 지상에 설치되어있습니다. 지적도근점은 정확한 경계측량을 가능하게 해주며, 분쟁 발생시에도 기준점을 근거로 법적 판단이 이루어질 수 있습니다. 지자체, 국토부, 한국국토정보공사 등은 도시계획, 도로 정비, 지적재조사 등에서 지적도근점 데이터를 주요 자료로 사용하고 있습니다. 진주시는 지적측량의 기준이 되는 도근점에 대한 데이터를 1년 주기로 갱신하여 제공하고자 합니다. 기준점의 종류, 기준점명, 좌표계구분, 토지소재지, 설치일자를 제공하고자 합니다.지적도근점은 국토의 정확한 측량과 경계설정, 그리고 법적 근거로 기능하는 아주 중요한 요소이므로 설치된 시설물을 보호하여야 하며 만약  훼손되었거나 찾기 어려울 경우 진주시청이나 한국국토정보공사 진주지사에 문의하시면 도움을 드립니다.
