summary_user: 경상북도 문경시 제조업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 계획입지(산업단지 내)·개별입지 구분, 업체명, 업종, 산업분류코드, 소재지, 연락처, 고용인원을 담는다(포털 설명상 2025년 9월 11일 기준). 지역 기업 지원 담당자나 구직자·분석가가 '문경시 산업단지 안팎에 어떤 업종의 제조업체가 있고 고용 규모는 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 필지번호 같은 전역 조인 키가 없어, 다른 공장등록·기업 데이터와는 업체명·소재지 주소 매칭이나 산업분류코드(KSIC) 기준 집계로만 이어 쓴다.
description_portal: 경상북도 문경시 제조업체 현황은 경상북도 문경시의 제조업체 현황을 정리한 공공데이터로, 2025년 9월 11일 기준 정보를 포함하고 있습니다. 1차적으로 구분을 계획입지(국가나 지자체가 체계적으로 개발한 산업단지 내에 조성된 입지), 개별입지(기업이 산업단지 외 개별적으로 공장을 설립한 입지)로 하였고, 각 업체의 기본 정보(업체명, 업종, 소재지), 산업분류코드, 고용 인원 등 주요 경영 현황을 담고 있어 문경시 제조업체에 관련하여 참고하기 유용합니다. 해당 정보는 문경시청(일자리경제과)에서 관리되고 있습니다. 공란으로 되어있는 자료는 우리시에서 관리하는 대장에 누락되어 있는 자료입니다.
