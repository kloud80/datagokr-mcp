description_portal: 경상남도 창녕군 내 제조업공장 허가 현황 데이터입니다.1. 순번, 입주한 산업단지명, 회사의 명칭, 공장대표주소, 공장의 업종명, 공장 전화번호, 공장 팩스번호, 생산품 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 11일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 창녕군에서 허가를 받은 업체 정보로 회사명이 중복된 항목이 있을 수 있으며, 전화번호, 팩스번호가 없는 항목이 존재합니다.4. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 건설산업국 일자리경제과 기업유치팀 055-530-1695로 문의 주시기 바랍니다.
