summary_user: 경상남도 창녕군에서 허가를 받은 제조업 공장을 한 줄에 한 곳씩 담은 군 단위 명부로, 입주 산업단지명·회사명·도로명/지번 주소·업종명·연락처·생산품을 담는다. 창녕군에 입지할 협력업체나 납품처를 찾는 사업자, 또는 군내 산업단지별 업종 구성을 파악하려는 분석가가 '이 단지에 어떤 업종 공장이 모여 있나'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호·업종코드·필지코드 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·주소·단지명을 이름으로 맞춰 이어 써야 한다.
limits: 사업자번호나 표준 업종·필지 코드가 없어 기업정보·토지 데이터와 정확히 조인되지 않고, 주소·회사명 문자열 매칭에 의존해야 한다. 범위는 창녕군 한 곳에 한정된다.
