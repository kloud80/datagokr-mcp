description_portal: 강원특별자치도 내에서 추진 중인 정비사업(재개발 및 재건축)의 현황을 제공하는 안내 데이터입니다. 주요 제공 항목으로는 각 정비구역의 명칭, 정확한 소재지 위치, 사업유형(재개발/재건축), 사업시행 주체(조합 등)가 포함되어 있습니다. 또한, 정비사업의 핵심 행정 절차인 정비구역 지정일, 조합설립 인가일, 사업시행인가일, 관리처분계획인가일을 비롯하여 실제 공사의 시작과 끝을 알리는 착공일, 준공일, 이전고시일까지의 날짜 데이터를 상세히 수록하여 사업별 추진 속도와 단계를 한눈에 파악할 수 있습니다.
