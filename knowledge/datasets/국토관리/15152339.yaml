summary_user: 단기 침수위험 예측을 관리하는 기준이 되는 읍·면·동 목록을 담은 고정자료로, 읍면동별 행정구역코드·명칭, 시군구코드, 대표 좌표(X·Y)를 한 행씩 담는다(범위는 전국 행정단위 개별, 포털 파일은 샘플 100건). 홍수 예보·침수위험 정보를 지도에 올리려는 분석가나 앱 개발자가 '예측 결과의 읍면동 코드가 어느 지역이고 지도 어디에 찍히는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 단기 침수예측 결과 등 다른 자료와는 읍면동명·행정구역코드 매핑이나 같은 기관(한강홍수통제소) 코드 체계로만 잇는다.
description_portal: '단기 예측 기반 침수위험 정보는 행정구역인 읍·면·동 단위, 읍명동 코드, 읍면동 명칭, 읍면동 좌표(POINT X, POINT Y) 으로 관리되며, 지도정보와 연계해 각 지역의 위험도를 시각적으로 확인할 수 있다. 단기 변화 예측을 반영하여 침수 가능성을 세밀하게 분석하고, 신속하게 대응할 수 있도록 지원한다. 지도 기반 알림으로 위치별 위험 파악과 대비가 용이하다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
