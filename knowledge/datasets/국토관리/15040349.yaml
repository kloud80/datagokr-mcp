summary_user: 서울 성동구에 공식 등록된 반려동물 수를 법정동 단위로 집계한 작은 파일(CSV 454바이트)로, 법정동·등록 마리 수·데이터 기준일자를 담는다. 성동구 주민이나 반려동물 서비스 사업자가 '성동구 안에서 등록 반려동물이 가장 많은 동은 어디인가'를 확인하거나, 구청이 동물등록·복지 시설 배치를 검토할 때 기초자료로 쓴다. 실측 컬럼에 전역 조인 키(법정동 코드 등)가 없어 다른 데이터와는 법정동 이름을 매핑해 인구·면적 같은 동별 통계와 이어 써야 한다.
