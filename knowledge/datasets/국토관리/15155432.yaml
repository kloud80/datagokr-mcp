description_portal: '본 데이터는 한국토지주택공사의 사업지구별로 적용되는 법적·행정적 공법제한사항을 정리한 현황표 입니다. 유형명에는 지구단위계획구역, 토지거래허가구역, 공공주택지구, 개발제한구역, 도시관리계획, 건축제한 등 다양한 규제 항목이 포함되며, 사업지구별로 복수의 제한이 중첩 적용되는 사례가 많아 규제 강도와 개발 가능성을 파악하는 데 중요한 자료입니다. 공법제한사항 칼럼에는 지정일, 세부 조건(예: 외국인 대상 허가구역 한정, 특정 용도만 허용 등)이 기록되어 있어 규제의 범위와 성격을 구체적으로 확인할 수 있습니다. 이러한 데이터는 사업 추진 타당성 검토, 토지조사·보상 업무, 인허가 전략 수립, 규제 해소 검토 등에서 핵심 참고자료로 활용되며, 특히 초기 단계에서 사업지구의 법적 리스크를 진단하는 데에 필수적입니다.'
