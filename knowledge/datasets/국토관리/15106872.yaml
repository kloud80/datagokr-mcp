description_portal: '정보제공 신청을 통해 요청한 ""댐용수 공급계획 및 공급실적"" 자료입니다.댐용수는 K-water의 광역상수도와 지자체·기업이 사용하는 생공용수 등의 목적으로 공급하고 있으며, 해당 자료는 광역상수도 운영관리, 수요 예측, 설비 운영 효율화, 물 수급 안정성 확보 등에 활용될 수 있습니다. 이를 통해 수자원 운영 현황을 파악하고, 수급 불균형 대응 효율적 댐 운영 전략 수립, 물이용 정책 검토 등에 활용할 수 있습니다.해당 데이터의 세부항목 단위는 아래와 같습니다. - 공급통계 기간단위 : 월 - 작성기간 : 2019년~2021년 - 공급량 단위 : 천톤 * 학술연구용으로 요청에 의한 자료 등록 입니다.'
