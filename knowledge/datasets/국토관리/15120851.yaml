summary_user: 구로구에서 신고된 부동산 거래를 필지·건물 단위로 한 건씩 담은 CSV 파일(약 12.7MB)로, 법정동·지번(본번·부번), 건물용도·건물명, 계약일, 층, 건물·토지면적, 건축년도, 물건금액(만원)을 기록한다. 구로구 안에서 특정 동이나 건물 유형의 거래금액이 계약 시점·면적·건축연도에 따라 어떻게 달랐는지 알고 싶은 주민·중개사·분석가가 쓴다. 전역 조인 키는 없으므로 법정동명과 본번·부번을 이름·지번으로 맞춰 국토교통부 실거래가나 건축물대장 등 다른 지번 기반 자료와 연결한다.
description_portal: 행정동별 부동산 실거래가 데이터는 구로구에서 실제로 거래 신고된 아파트·연립·오피스텔·단독주택 등의 매매·전월세 거래금액, 계약일, 면적, 층수, 건축연도, 용도지역 등 핵심 부동산 정보를 체계적으로 기록한 시장 기반 통계자료이다. 이는 지역 부동산 시장의 가격 구조, 주택 수요·공급 흐름, 자산 형성 환경을 분석하는 데 가장 신뢰도 높은 1차 자료로 활용된다.행정동 단위로 제공되는 구조 덕분에, 특정 지역의 가격 급등·급락 요인 분석, 생활권별 시장 격차, 주거환경 수준, 개발 영향 평가 등을 정밀하게 수행할 수 있다. 면적·건축연도·층수 등 세부 속성과 거래금액을 결합하면 실질적인 주택가격 결정 요인을 모델링할 수 있으며, 정책 효과(대출규제·세제정책 등)의 변화를 평가하는 데 중요한 지표가 된다.또한 이 자료는 구로구의 도시계획·주거복지 정책·지역균형 발전 전략 수립 등 모든 부동산 관련 행정의 기반자료로 활용되며, 시장 과열 지역 식별, 개발사업 타당성 검토, 주거 취약지 분석 등 고차원적 분석도 가능하게 한다.
