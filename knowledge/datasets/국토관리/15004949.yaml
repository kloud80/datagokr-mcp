summary_user: 동대문구에서 건축 허가·착공을 신청한 건축물을 건별로 담은 파일로, 대지위치·건축구분·주용도·연면적·지상/지하 층수·세대수·호수·가구수와 시공업체·설계사무소·감리사무소 이름을 함께 싣는다(CSV 약 22KB). 지역 주민이나 분석가가 "우리 동네에서 최근 착공한 공동주택의 시공사와 세대수는 어떻게 되나" 같은 질문을 확인할 때 쓴다. 전역 조인 키가 없으므로 다른 건축물·필지 데이터와는 대지위치(주소) 문자열을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 건설현장시공정보는 오래전부터 최근까지 동대문구에서 건축물 허가, 착공을 신청했었던 각 연도별 시공사, 설계자 명에 대한기본정보와 세대수, 호수, 가구수, 층수 등으로 구성된 데이터를 제공합니다.동대문구에서는 열린 소통으로 구민분들에게 최신 데이터를 보여줍니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.
