summary_user: 안산시 관내에 등록된 공장을 한 곳씩 담은 건별 명부로, 시군구·회사명·도로명주소·데이터 기준일자 네 항목으로 구성된다(CSV 파일, 활용신청 없이 내려받음). 지역 산업시설 분포를 보려는 분석가나 공장 부지·물류 거점을 찾는 사업자가 '안산시 어느 도로·동네에 제조공장이 몰려 있나'를 확인하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어 회사명이나 도로명주소를 문자열로 맞추거나 주소를 지오코딩해 팩토리온 공장등록 정보·산업단지 현황 등과 이어야 한다.
description_portal: 이 정보는 안산시 관내에 등록된 공장 현황을 수록한 자료입니다. 총 440개의 공장 데이터가 포함되어 있으며, 항목으로는 시군구, 회사명, 도로명 주소, 데이터 기준일자로 구성되어 있습니다. 각 공장의 주소는 도로명 주소 체계로 제공되며, 실제 사업장 위치 확인에 용이합니다. 회사명은 등기된 명칭 그대로 제공되어 기업 식별 및 관련 행정 자료와의 연계가 가능합니다. 데이터 기준일자는 2024년 2월 13일로, 최신 기준으로 정리된 공장 등록 현황입니다. 이 정보는 공장 입지 현황 파악, 지역별 산업시설 분포 분석, 산업단지 조성 또는 정비계획 수립, 환경영향평가 기초자료, 공장 등록관리 행정업무 등에서 활용 가능하며, 공공기관뿐만 아니라 부동산 산업, 물류, 산업분석 등 다양한 민간 분야에서도 유용하게 활용하실 수 있습니다.
