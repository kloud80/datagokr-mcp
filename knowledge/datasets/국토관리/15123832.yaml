summary_user: 충청남도 천안시 도시계획정보시스템(UPIS)의 '배치' 현황을 현황도형 관리번호별로 구분 코드와 변경 부분 설명을 담아 제공하는 시군구 단위 CSV 파일(약 19만 바이트)이다. 천안시 도시계획 도면의 배치 현황과 그 변경 내용을 확인하려는 분석가나 사업자가 '특정 현황도형에 어떤 변경이 있었나'를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 천안시 UPIS 데이터와 현황도형 관리번호나 이름·코드 매핑으로만 연결한다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 기관 데이터와 바로 결합하기 어렵다. 행정단위상 비공간 데이터로 분류돼 좌표나 도형 정보는 이 파일만으로 확인되지 않고, 구분 코드의 의미를 풀 코드표도 제공되지 않는다.
