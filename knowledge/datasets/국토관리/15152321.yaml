description_portal: 이 데이터는 충청남도 논산시 관내에 수도급수공사 대행업을 허가받은 업체들에 대한 정보를 포함하고 있습니다. 급수공사대행업체들의 업체명, 대표자, 소재지, 최초 허가일, 허가번호, 허가기간, 연락처, 사업자번호가 수록되어 있습니다.현재 논산시 관내 수도급수공사대행업을 허가받아 사업중인 업체의 현황이 수록되어 있으며 도로법 시행규칙 제27조(표지등의 설치)에 의거 수도급수공사 대행 업체와 협업하여 재난, 안전사고 예방에 활용할 수 있습니다. 대행업체 파악 간 허가기간을 반드시 확인하여 의사결정에 반영하시기 바라며 허가번호 또한 확인 해주시기 바랍니다.수도급수공사는 급수설비의 신설, 개조, 수선, 철거 또는 개량하는 공사를 의미 합니다.
