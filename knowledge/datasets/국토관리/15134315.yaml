description_portal: 충청남도개발공사는 토지 매각 계획에 대한 상세 정보를 제공합니다. 이 데이터는 공공자원의 효율적 활용과 시민 참여 강화를 위한 자료로, 시민들의 알 권리 보장과 공정한 토지 매각을 지원합니다. 제공되는 정보는 아래와 같습니다.1. 지구명2. 용지명3. 면적4. 가격 조건5. 공급 방식6. 용적률7. 건폐율8. 허용 용도9. 공고 시기* 본 데이터는 향후 정보 통합 시스템이나 앱 개발 시, 시민들이 실시간으로 매각 정보를 확인하고 매각 과정에 대한 의견을 제시할 수 있도록 함으로써 참여와 소통을 촉진하는 기회 및 정보를 제공합니다 *
