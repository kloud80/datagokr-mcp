description_portal: "- 전라남도 공간정보 통합 플랫폼에 게재된 미세먼지 정보(미세먼지 및 측정소, 시군구별  및 시도별 평균정보, 확산간격 등)에 대해 조회하실 수 있습니다.- 전라남도의 미세먼지 현황은 지역별로 다를 수 있으며, 실시간 정보는 다음의 공식 사이트를 통해 확인하실 수 있습니다. - 국립환경과학원에서는 전국의 대기질 예보를 제공하며, 전라남도 지역의 미세먼지 농도 예보도 확인할 수 있습니다. 시간대별, 지역별 미세먼지 농도 예보를 제공하여 외출 계획에 참고할 수 있습니다.- 스마트폰 사용자라면 '에어코리아' 모바일 앱을 통해 실시간 대기질 정보를 손쉽게 확인할 수 있습니다. 앱에서는 미세먼지 농도, 오존 농도, 예보 정보 등을 제공하며, 알림 기능을 통해 대기질 변화에 대응할 수 있습니다."
