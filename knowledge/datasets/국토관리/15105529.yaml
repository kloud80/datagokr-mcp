summary_user: 전북개발공사가 관리하는 공공임대주택 가운데 지금 계약할 수 있는 세대를 동·호수 단위로 담는 건별 목록으로, 건물명·면적 유형·임대·전용·공용·기타 면적·방 개수·퇴거일자를 함께 준다. 전북 지역에서 공공임대 입주를 알아보는 청년·신혼부부가 "지금 비어 있는 세대 중 방 2개 이상, 전용면적이 넉넉한 곳은 어디인가"를 확인하거나, 분석가가 미입주 세대 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 건물명·면적명 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 전북개발공사가 관리하는 공공임대주택 중 계약 가능한 세대 정보를 조회할 수 있는 서비스입니다.해당 서비스를 통해 건물명, 면적명, 임대면적, 전용면적, 공용면적, 기타면적, 방 개수, 동·호수, 퇴거일자 등 주요 정보를 실시간으로 확인할 수 있습니다.본 서비스는 공공임대주택의 공급현황을 효율적으로 파악하고 미입주 세대의 관리 및 신규 임대계획 수립에 활용될 수 있습니다. 또한 청년·신혼부부 등 주거취약계층을 위한 주거복지 정책 수립과 공공주택 수요 분석 등 다양한 행정 및 연구 분야에서도 활용 가치가 높습니다.
