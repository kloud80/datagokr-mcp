summary_user: 충청남도 금산군이 관리하는 하천(소하천)을 하천 한 곳당 한 행으로 담은 목록 파일로, 하천 구분·하천명·연장(m)·구간 시작/종료 위치·관리기관명·데이터 기준일자를 수록하며 포털 설명상 2025년 12월 기준 143개 하천이 들어 있다. 금산군 하천 정비 사업이나 재해예방 계획을 세우는 공무원·분석가가 "우리 마을 앞 소하천의 길이와 시점·종점은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에 하천코드 같은 전역 조인 키가 없어, 다른 하천 원장이나 공간정보와는 하천명·위치 문자열 매칭이나 같은 기관 자료끼리만 이어 쓴다.
limits: 구간 시작·종료 위치는 좌표가 아닌 문자열로 보이며 공간 데이터로 분류되지 않아, 지도 분석을 하려면 별도의 위치 매칭이 필요하다. 범위는 금산군 한 시군구에 한정되며, 하천구역 경계·제방·수문 같은 시설 정보는 담지 않는다.
