summary_user: 부산광역시 남구의 건축허가·착공 건을 한 줄씩 담은 건별 원천 파일로, 대지위치·지목·대지면적·건축면적·연면적·건폐율·용적률·구조·주용도·층수·세대수와 허가일·착공처리일, 설계·감리·시공자 사무소명을 담는다(7,349바이트 CSV). 건축업계·부동산 분석가가 '남구에서 최근 어떤 용도·규모의 건물이 허가되고 실제로 착공됐는가'를 확인하는 데 쓰며, 인허가·착공은 지역 개발 흐름의 선행 지표로 쓰인다. 전역 조인 키(건축물대장 고유번호·PNU 등)가 없어 다른 데이터와는 대지위치 주소나 용도지역 이름을 맞춰 연결해야 한다.
