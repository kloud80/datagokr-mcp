summary_user: 전북특별자치도에 지정된 착한가격업소를 업소 한 곳당 한 행으로 담은 건별 목록으로, 업종·업소명·시군구·도로명주소·대표품목과 가격·영업시간·배달·주차 가능 여부·홍보 문구를 포함한다(CSV 약 45KB). 주민이나 관광객이 '전주시에서 주차 가능한 저렴한 한식당이 어디인가'를 찾을 때, 또는 분석가가 시군구·업종별 착한가격업소 분포를 볼 때 쓴다. 전역 조인 키는 없어 시·군·구 이름이나 도로명주소를 기준으로 행정구역 자료나 주소 기반 위치 데이터와 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 내에 지정된 '착한가격업소'의 현황을 상세히 담고 있는 생활 밀착형 정보입니다. 한식, 중식, 미용업 등 다양한 업종별로 나누어 각 업소의 상호명, 대표 품목과 가격, 영업시간, 주차 및 배달 가능 여부 등 실용적인 정보를 제공합니다. 특히, 각 업소의 자랑거리 등 홍보 문구를 포함하여 사용자의 선택을 돕고 있습니다. 이 자료는 지역 주민과 관광객이 저렴하고 질 좋은 서비스를 제공하는 업소를 찾는 데 실질적인 도움을 주며, 물가 안정 및 소상공인 지원 정책의 현황을 파악하는 데 중요한 기초 데이터로 활용됩니다.
