description_portal: 본 공공데이터는 인천광역시 서구 내 부동산중개보수 기준을 거래유형과 금액 구간에 따라 정리한 자료입니다. 본 자료는 주택 매매,교환, 임대차 거래별로 요율 상한과 보수 한도액을 수록하고 있습니다. 부동산중개보수는 거래 금액에 따라 차등 저굥ㅇ되는 요율 기준이 있으며 중개업자의 합리적 보수 요구와 소비자의 비용 예측에 도움이 되며, 과도한 중개보수를 방지하는데 활용 될 수 있습니다. 또한 본 자료를 통해 부동산 거래의 투명성을 확보할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
