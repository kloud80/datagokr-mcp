summary_user: 경기주택도시공사가 조성·공급하는 임대아파트를 사업 단위로 담은 파일로, 임대방식(국민·영구·공공임대 등), 사업명, 공사위치, 공급세대, 사업 시작·종료(예정) 연월을 담으며 원본 CSV는 약 1.4KB로 사업 수가 적다. 경기도 내 공공임대 입주를 알아보는 주민이나 정책 분석가가 '경기주택도시공사가 어느 지역에 어떤 유형의 임대주택을 몇 세대 공급하고 언제 완료되나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명·공사위치 같은 이름 매칭으로만 이어 쓰며, 전월세 실거래 등 임대차 데이터와 지역 단위로 나란히 비교하는 정도로 쓴다.
limits: 행정구역 코드나 단지 식별자가 없어 다른 데이터와 정확히 조인하기 어렵고, 주소 문자열(공사위치)로 수작업 매칭해야 한다. 파일 크기가 매우 작아 일부 사업만 담고 있을 수 있으며, 개별 세대의 임대료·입주자 모집 정보는 없다.
