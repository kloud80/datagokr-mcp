summary_user: 평택시 도시계획정보시스템(UPIS)에서 도시지역 현황 도형마다 관리번호, 라벨명, 도형 기준 면적과 길이를 담은 건별 도형 속성 파일(csv, 약 55KB)이다. 평택시 도시지역으로 지정된 구역이 어디이고 각 구역의 면적이 얼마인지 확인하려는 도시계획 담당자나 분석가가 용도지역 현황 파악이나 토지이용 분석에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(평택시) 기준으로만 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) 도시지역 현황으로 도시계획 수립 및 공간정보 분석을 위한 기초 자료입니다. 각 도시지역에 대한 현황도형 관리번호, 도형 라벨명, 면적(도형 기준), 면적(길이 기준)등의 항목으로 구성되어 있습니다. 도형 기반의 공간 단위에 식별 번호와 속성정보를 부여하여 도시관리계획 수립, 지형도면 제작, 토지이용현황 분석 등에 활용할 수 있으며, 면적 정보는 면적 계산 및 행정구역 경계 설정 시 근거자료로 사용됩니다. GIS 시스템과 연계하여 공간데이터 시각화 및 지역별 분석이 가능합니다. 국토계획, 도시계획, 건축허가, 재개발 검토 등 다양한 공공업무의 기초자료로 활용됩니다.* 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
