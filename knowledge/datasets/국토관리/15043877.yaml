summary_user: 전남광주통합특별시의 자치구별 지가수준을 행정구역 단위로 집계한 통계 파일로, 총필지수·지가합·면적합, 단순·가중 평균지가, 최고·최저지가와 그 표준지번호·토지용도를 담는다(파일 크기 994바이트의 소규모 표). 시민이나 분석가가 "어느 구의 평균 땅값이 가장 높고, 가장 비싼 필지는 어떤 용도인가"처럼 구별 토지가격 수준을 비교할 때 쓴다. 전역 조인 키는 없어 행정구역 이름을 매핑하거나 표준지번호로 표준지공시지가 자료와 대조하는 방식으로만 이어 쓴다.
description_portal: ‘자치구별 지가수준 현황’ 자료는 각 자치구의 토지 가격과 관련된 다양한 정보를 한눈에 볼 수 있도록 정리한 통계입니다. 먼저 각 구별로 조사된 전체 필지 수와 개별공시지가가 산정된 필지 수를 제공합니다. 개별공시지가는 정부가 매년 토지의 가치를 평가해 발표하는 가격으로, 토지세 부과나 거래 시 기준이 됩니다. 자료에는 각 구의 전체 토지가격을 모두 합한 금액(지가합, 공시총액)과 전체 토지 면적을 합한 값(면적합, 공시면적)도 포함되어 있습니다. 평균 지가는 모든 필지를 동일하게 계산한 ‘단순 평균’과, 필지의 크기나 가치를 반영해 계산한 ‘가중 평균’ 두 가지 방식으로 제공되어 보다 정확한 비교가 가능합니다. 또한 각 구에서 가장 비싼 토지(최고지가)와 가장 저렴한 토지(최저지가)에 대한 정보도 확인할 수 있습니다. 이때 해당 필지의 표준지 번호, 위치, 그리고 토지 용도(주거·상업·공업 등)까지 함께 제공되어 가격 차이를 구체적으로 이해할 수 있습니다. 이 자료는 부동산 가격 변화를 살펴보거나 투자·개발 계획, 정책 수립에 참고할 수 있으며, 시민들도 관심 있는 지역의 토지 가격 수준을 쉽게 확인하고 비교하는 데 도움을 받을 수 있습니다.
