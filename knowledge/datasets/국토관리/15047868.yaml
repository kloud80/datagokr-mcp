summary_user: 창원시 배수펌프장 9개소를 시설 1곳당 1행으로 담은 소규모 파일(csv, 약 1.3KB)로, 펌프장명·주소·설치년도·설치목적·모터 펌프 규모·비상발전기·한전 전원공급방식과 계약전력·월평균 전기요금·근무형태를 담는다. 창원시 각 구의 침수 대비 배수 시설이 어디에 몇 대 규모로 있고 정전 시 비상발전기를 갖췄는지를 확인하려는 주민·방재 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 하천·침수 데이터와는 주소나 펌프장명을 매핑하거나 같은 기관(창원시) 자료끼리만 이어 쓴다.
description_portal: 'ㅇ 창원시 배수펌프장 시설 현황 : 9개소- 팔용배수장(의창구), 남천로배수장(성산구), 구항펌프장(마산합포구), 서항1펌프장(마산합포구), 서항2펌프장(마산합포구), 양덕배수장(마산회원구), 양덕하류펌프장(마산회원구), 봉암펌프장(마산회원구), 용원배수장(진해구)홍수 및 도시 침수 대비를 위한 배수·방수 인프라인 배수펌프장의 위치와 운영 현황을 정리한 자료입니다. 이 데이터는 펌프장 분포, 배수용량, 운영 주체 및 상태 점검 정보를 통해 상습 침수 지역 분석, 재난 대비 계획, 유지보수 관리, 민원 대응 등에 활용될 수 있습니다.데이터가 많을 경우 엑셀 등 일반 뷰어에서 일부만 확인될 수 있으므로, R, Python, GIS 등 분석 전용 도구로 시공간적 분석 및 시각화를 권장합니다.펌프 용량, 설치 시기, 자동화 여부, 점검 주기 등 세부 정보는 제공기관의 메타데이터나 기술문서를 참고해 주세요.'
