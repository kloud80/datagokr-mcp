summary_user: 경상남도 사천시 관내 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일(csv, 약 42KB)로, 단지명·회사명·전화번호·주소·업종명·생산품을 담는다. 구직자나 영업 담당자가 "사천 어느 산업단지에 항공기 부품을 만드는 업체가 있고 연락처는 무엇인가"를 찾을 때 쓰고, 분석가는 업종·생산품별로 걸러 지역 산업 구성을 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 공장 등록 등 다른 데이터와는 회사명·주소 문자열 매칭이나 단지명 기준으로만 이어 쓴다.
description_portal: '제공되는 데이터는 경상남도 사천시 관내 산업단지에 입주한 기업들의 상세 현황을 담고 있습니다. 이 자료는 사천시의 산업 구조와 기업 활동을 이해하는 데 핵심적인 정보를 제공합니다.연번: 자료 내 항목의 순차적인 번호를 나타냅니다.단지명: 해당 기업이 속한 산업단지의 이름을 명시합니다.회사명: 산업단지에 입주한 기업의 정식 명칭입니다.전화번호: 기업과 연락할 수 있는 유선 연락처 정보를 포함합니다.주소: 기업의 소재지를 나타내는 상세 주소 정보입니다.업종명: 해당 기업이 영위하고 있는 주된 사업 분야의 명칭입니다. (예: 항공기 제조, 금속 가공, 기계 부품 등)생산품: 해당 기업에서 주력으로 생산하는 제품의 이름 또는 종류를 명시합니다.이 자료는 사천시의 지역 경제 분석, 투자 유치 전략 수립, 그리고 기업 간 비즈니스 협력 기회 발굴 등에 유용하게 활용될 수 있습니다. 특히, 항공우주 산업이 발달한 사천시의 특성상, 특정 업종이나 생산품을 기준으로 기업 정보를 필터링하여 관련 생태계를 파악하는 데 큰 도움이 됩니다. 공공기관이나 연구기관은 이를 통해 사천시 산업단지의 고용 현황 및 경제 활력도를 측정하고, 잠재적인 성장 동력을 모색하는 기초 자료로 사용할 수 있습니다.'
