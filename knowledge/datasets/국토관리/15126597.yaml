summary_user: 고창군 안의 원룸과 오피스텔을 한 건물씩 담은 개별 목록으로, 지번주소·주거 용도·사용승인일자를 담는다(CSV 약 16.6KB). 고창군에서 원룸·오피스텔이 어느 읍면에 있고 언제 사용승인을 받았는지 살펴보려는 주민이나 임대 사업자, 지역 주거 현황을 파악하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소 정제·매핑해 잇는 방식으로만 연결한다.
description_portal: 전북특별자치도 고창군 원룸 및 오피스텔 현황 공공데이터는 고창군 내 원룸 및 오피스텔의 위치와 주거 용도를 제공하는 데이터입니다. 이 데이터에는 지번주소, 주거 용도, 사용승인 일자 등의 정보가 포함되며, 지역 내 주거 시설 현황을 파악하는 데 유용합니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다. 또한, 오픈 API를 통해 JSON/XML 형식으로 활용할 수도 있습니다. 해당 데이터는 고창군 행정지원과에서 관리하며, 수시로 업데이트됩니다. 보다 자세한 내용은 공공데이터포털에서 확인할 수 있습니다
