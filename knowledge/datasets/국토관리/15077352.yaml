summary_user: 2014년 '아름다운 경기건축'으로 선정된 경기도 현대건축명소를 명소 한 곳당 한 행으로 담은 목록으로, 시군명·명소명·유형(건축물/공간환경)·용도와 정제된 도로명·지번 주소, 우편번호, WGS84 위도·경도를 포함한다. 관광객이나 문화콘텐츠 기획자가 '우리 시군 근처에 둘러볼 만한 현대건축 명소가 어디 있고 어떤 용도인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키는 없으므로 다른 데이터와는 시군명이나 주소를 이름으로 맞추거나 위도·경도로 지도에 겹쳐 연결한다.
description_portal: 이 데이터는 경기도 지역의 아름다운 경기건축으로 선정된(2014년) 경기도 현대건축명소 현황 정보를 수록한 자료로, 건축물 및 공간환경 유형으로 나뉘며 최근 건축 경향을 반영한 다양한 용도의 건축물들을 포함합니다. 주요 항목은 시군명, 명소명, 유형, 용도, 정제도로명주소, 정제지번주소, 정제우편번호, 정제WGS84 위도·경도 등으로 구성되어 있으며, 주거시설, 문화시설, 상업시설, 전시장, 출판단지 등 다양한 현대 건축 자산의 용도와 위치 정보를 제공합니다. 이 데이터는 건축디자인 분석, 도시공간 기획, 관광자원 활용, 문화콘텐츠 개발, 지역 건축 유산 홍보 등에 활용될 수 있습니다.
