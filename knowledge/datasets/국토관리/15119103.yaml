summary_user: 전라남도 영암군 도시계획정보시스템(UPIS)에서 관리하는 도시자연공원구역 도형을 한 건씩 담은 파일로, 도형 관리번호·분류코드·라벨명·결정고시관리코드와 도형 면적·길이를 포함하며 범위는 영암군 한 개 시군구다(CSV 628바이트의 소규모 자료). 영암군에 지정된 도시자연공원구역이 어디이고 면적이 얼마인지 확인하려는 주민·토지 소유자나 공원녹지 계획 분석가가 쓴다. 전역 조인 키는 없어 시군구코드로 같은 지역의 다른 UPIS 도시계획 현황과 묶거나, 결정고시관리코드·라벨명을 이름·코드 매핑해 결정고시 자료와 맞춰 쓴다.
