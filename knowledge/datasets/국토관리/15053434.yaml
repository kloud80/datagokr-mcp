summary_user: 국토안전관리원이 관리하는 하천시설물 수를 시설 종별(행)과 17개 시도(열)로 교차 집계한 통계표로, 2025년 12월 31일 기준 전국 범위의 352바이트짜리 작은 CSV 파일입니다. 지자체 담당자나 분석가가 '우리 시도에는 제방·수문·보 같은 하천시설물이 종류별로 몇 개 있나'를 비교할 때 쓴다. 전역 조인 키는 없고, 시도명을 이름으로 맞춰 다른 시도별 통계(인구·하천 연장·홍수 피해 등)와 이어 쓴다.
description_portal: '국토안전관리원에서 제공하는 데이터이며 하천시설물, 시도별, 종별 통계현황의 CSV형식의 파일데이터를 제공합니다. 25년 12월 31일 기준임을 알려드립니다.하천시설물이란 하천의 기능을 보전하고 효용을 증진하며 홍수 피해를 줄이기 위해 설치하는 시설을 의미합니다.여기에는 제방, 댐, 보, 수문, 교량, 하수관로 등 하천을 관리하고 유수나 홍수로부터 보호하기 위한 다양한 구조물이 포함됩니다. 주요 하천시설물 예시하천의 흐름을 조절하는 시설: 댐, 보, 수문, 홍수조절지, 방수로 등하천을 보호하는 시설: 제방, 호안하천을 활용하거나 통과하는 시설: 교량, 수로터널, 갑문 등기타: 하천실험장, 수표시설 등 법에 따라 설치된 시설'
