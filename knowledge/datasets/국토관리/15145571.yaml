description_portal: '○ 통계개요* 통계명 : 주택현황 및 보급률(새로운산정방식)* 통계종류 : 서울시 주택현황 및 보급률을 제공하는 일반ㆍ가공통계* 작성목적 : 생활을 같이하는 가구가 거주하는 공간으로써 주택의 보급 정도를파악하여 주택관련 정책수립의 기초 자료로 활용하는 것을목적으로 함* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 주택현황(종류별 주택수) 및 보급률○ 용어설명* 주택보급률 : 특정국가 또는 특정지역의 주택재고의 과부족을 총체적으로 나타내주는지표. 일반적으로 주택수를 가구수로 나누어 산정(총 주택수/일반가구수)하고 있음* 연립주택 : 한 건물내에 여러가구가 살 수 있도록 건축된 4층이하의 영구건물로서건축당시 연립주택으로 허가받은 주택을 말함* 다세대주택 : 한 건물내에 여러 가구가 살 수 있도록 건축된 4층 이하의 영구건물로서건물의 연면적이 200평 이하이면서 건축당시 다세대 주택으로 허가받은 주택을 말함* 비거주용건물내 주택 : 영업용 목적으로 건축된 건물내에 사람이 거주할 수 있도록구획된 부분으로서 주택의 요건을 갖추고 있는 것을 말함. 단, 사람이 살고 있으나주택의 요건을 갖추지 못한 거처는 주택이외의 거처로서 주택에서 제외함○ 기 타* 2015년 인구주택총조사부터 방문조사가 아닌 행정자료를 활용한 등록센서스로 조사를수행함에 따라 일부 변동이 존재하여 기존 2010년~2014년 주택보급률을 재산정* 영업겸용이란 주거용과 영업용 부분이 함께 있는 건물 중 주거부분이 50%이상인 주택을 말함(구분이 어려운 경우 단독기타로 처리)* 신 주택보급률 산정기준 : 주택수의 경우 다가구 주택 구분거처를 반영(1동->00호),가구수의 경우 1인가구 및 5인 이하 비혈연가구를 포함'
