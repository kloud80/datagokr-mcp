description_portal: '대전광역시의 수돗믈 생산량 및 유수율 분석 자료입니다. 2023년도와 2024년도의 생산량과 유수율을 분석한 자료이며 2023년도 유수율은 약 96%, 2024년도 유수율은 약 94%입니다. * 유수율 : 유수수량(요금수량,분수량)/총생산량* 총생산량 : 정수장 배수유량계를 통과한 유량 합계* 유효수량 : 사용상 유효하다고 인정되는 수량* 유수수량 : 수도요금으로 징수되는  수량* 무효수량 : 사용상 무효라고 인정되는 수량* 분수량 :  타 수도사업자에게 공급하는 수량* 수도사업용수량 : 정수장,배수지에서 사용하는 수량과 세관,드레인 수량이나 병입수 등 수도사업자가 사용하는 수량* 공공수량 : 운반급수 등으로 요금수입이 없는 수량* 무수수량 : 유효수량중 수입이 없는 수량'
