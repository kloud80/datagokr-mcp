summary_user: 서울 중구 내 지식산업센터를 건물(허가 건)별로 한 행씩 담은 파일로, 대지위치·대지·건축·연면적, 건폐율·용적률, 층수·높이, 주차대수, 허가일·착공일·사용승인일, 설계·감리·시공자 정보를 담는다(CSV 약 1.9KB의 소규모 파일). 중구에서 창업·이전할 공간을 찾는 사업자나 지역 산업시설 공급을 보는 분석가가 '중구 지식산업센터는 어디에 있고 규모와 준공 시기는 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 대지위치(주소)나 허가번호로 건축물대장 등과 이름·주소 매칭으로 이어 쓰며, 다른 시군구의 같은 종류 파일과는 컬럼을 맞춰 합친다.
description_portal: 서울특별시 중구 내 지식산업센터의 현황을 제공하는 데이터입니다.지식산업센터는 제조업, 정보통신업, 연구개발업 등 다양한 산업 분야의 기업이 입주할 수 있는 복합 업무시설로, 중소기업과 창업 기업의 경영 지원을 위해 조성됩니다.본 데이터는 중구 지역 내 위치한 지식산업센터의 명칭, 주소, 입주 업종 및 주요 시설 정보를 포함하며, 기업 유치 및 창업 지원 정책 수립에 활용될 수 있습니다.또한, 지식산업센터의 부동산 정보와 입주 현황을 분석함으로써 지역 경제 활성화 및 산업 발전을 위한 기초 자료로 활용됩니다.데이터는 정기적으로 업데이트되며, 산업 동향 분석과 경제활동 평가에 유용하게 쓰일 수 있습니다.
