summary_user: 경기도 고양시 관내 계량기 업체(제조·수리·수입·증명업 등)를 업체 한 곳당 한 행으로 담은 목록 파일로, 업종 구분·상호·주소·전화번호·취급 계량기 종류를 담는다(csv 약 4KB 규모). 고양시에서 수도·가스·저울 같은 계량기를 수리하거나 검정·증명받을 업체를 찾는 시민·사업자, 지역 계량기 산업 분포를 보는 담당자가 "우리 동네에 이 계량기를 다루는 업체가 어디 있나"를 확인하는 데 쓴다. 공통 조인 키나 코드가 없어 다른 데이터와는 업체명이나 주소를 문자열로 맞춰 이어야 하며, 주소를 지오코딩해 지도에 올리거나 사업자 정보와 대조하는 식으로 쓴다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 자동으로 연결되지 않고, 상호·주소 매핑으로만 붙일 수 있다. 범위는 고양시 한 곳이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
