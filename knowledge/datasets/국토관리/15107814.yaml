summary_user: 보령시 전통시장 주변의 교통시설(주차장 등)을 시장명·시설명·시설 분류와 위도·경도 좌표로 한 건씩 담은 시군구 단위 개별 시설 데이터다. 장보러 가는 시민이나 상권 분석가가 '보령 ○○시장 근처에 어떤 교통시설이 어디 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시장명(MRKT_NM)으로 이름을 맞추거나 좌표로 다른 시설·상권 데이터와 공간적으로 겹쳐 쓴다.
limits: 표준 코드형 조인 키가 없어 다른 데이터와는 이름 매핑이나 좌표 기반으로만 연결된다. 보령시 범위만 담으며, 개발계정은 일 8,000회 호출 제한이 있다.
