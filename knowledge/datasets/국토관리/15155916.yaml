description_portal: 이 데이터는 전라북도 고창군의 강우 현황을 1분 간격으로 지속적으로 수집한 공공 기상관측 자료입니다. 각 관측값에는 강우를 계측하는 측정장비명, 장비 고유번호, 측정 시각, 그리고 해당 시점의 강우량 값이 포함되어 있어 장비별 강우 특성을 정밀하게 파악할 수 있습니다. 본 데이터는 지역 기상 변화 감시, 침수·홍수 등 재해 예측, 수문·환경 연구, 행정 의사결정 지원 등 다양한 분야에서 활용될 수 있도록 개방되었습니다. 고해상도 시간 단위의 자료 제공을 통해 보다 정확한 기상 분석과 공공서비스 개선에 기여하는 것을 목표로 합니다.
