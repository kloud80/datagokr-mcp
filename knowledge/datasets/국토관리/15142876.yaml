summary_user: 서울 재개발사업으로 공급된 재개발임대주택 호수를 자치구별 행, 2020~2024년 연도별 열과 합계로 정리한 집계 파일(CSV, 677바이트)이다. 분석가나 정책 담당자가 '최근 5년간 어느 자치구에 재개발임대주택이 많이 또는 적게 공급됐는가'를 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 자치구 단위 통계와는 자치구 이름을 맞춰 연결한다.
description_portal: 이 데이터는 서울시 내 재개발사업에 따라 공급된 재개발임대주택의 연도별 및 자치구별 수급 현황을 정리한 자료로, 2020년부터 2024년까지의 기간 동안의 공급 내역을 확인할 수 있습니다. 자치구별로 재개발임대주택이 몇 호씩 공급되었는지를 확인할 수 있어, 지역별 재개발 진척 상황과 임대주택 공급 편차를 분석하는 데 유용합니다. 재개발임대주택은 주거환경이 열악한 지역을 정비하면서도 저소득층 세대의 주거 안정을 도모하기 위한 공공임대주택 유형으로, 본 데이터는 서울시의 균형적인 주거복지 실현 및 도시재생 정책 성과를 평가하는 데 기초자료로 활용될 수 있습니다. 또한 공급 집중 지역이나 부족 지역을 파악하여 향후 정책 보완 방향을 모색하는 데에도 도움이 됩니다.
