description_portal: '향후 2년간(’26년 1월 ~ ’27년 12월) 공동주택 입주예정물량입니다.ㅇ 공동주택 입주예정물량은 주택건설 실적정보, 입주자모집공고 정보, 정비사업 추진실적, 부동산R114 자료 등을 활용하여 산정함ㅇ 해당 자료는 정확성 제고를 위해 전국 지차체 검증, 공사 중단·일정 변경 등 변동 사항을 반영하였으며 산정 특성상 기준 시점 이후에 발생하는 변경 정보는 반영되지 않음 ㅇ 향후 건설사업계획 변경 및 추가 입주자모집공고 물량 등에 따라 예측치는 변동될 가능성이 있음ㅇ 공개된 입주예정물량은 30세대 이상 공동주택 기준ㅇ 기준 시점 : 2025년 12월 말'
