summary_user: 전라남도 화순군 관내 등록 공장을 한 행에 한 곳씩 담은 시군구 단위 목록으로, 회사명·대표자·도로명 주소·전화번호·생산품과 입주 단지 구분을 담는다(CSV 약 75KB). 화순군에서 특정 품목을 만드는 공장이 어느 산업단지에 몰려 있는지 찾거나, 협력업체·거래처 후보를 고르는 사업자·지역경제 분석가가 쓴다. 전역 조인 키(사업자번호·업종코드·필지코드)가 없어 다른 데이터와는 도로명 주소나 회사명을 맞춰 붙이거나 팩토리온 공장등록 정보와 이름으로 대조해 쓴다.
description_portal: 본 데이터는 전라남도 화순군 관내에 위치한 공장의 등록 현황을 종합적으로 제공한다. 수록 항목에는 공장명,  소재지 주소, 대표자, 공장, 입주 산업단지 명칭, 생산품 등 각종 세부 정보가 포함되어 있다. 데이터는 화순군의 제조업 기반 현황 파악, 산업 입지 계획, 신규 공장 설립 심의, 지역경제 분석, 정책 수립과 산업단지 관리 등 다방면에 활용된다. 특히 지역별 공장 분포와 성장 동향, 가동률 및 업종별 특성을 분석해 투자유치나 중소기업 지원 정책 마련의 기초자료로 활용 가치가 크다. 또한 입지 조건, 공장 규모와 유형, 행정지원 내역 등 다양한 정보를 체계적으로 제공하여 관련 기관, 기업, 연구자, 주민 등에게 경제활동과 지역발전을 위한 신뢰성 높은 정보를 제공한다.
