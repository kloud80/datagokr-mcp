description_portal: 국민임대주택은 국가나 지방자치단체의 재정이나 「주택도시기금법」에 따른 주택도시기금(이하 “주택도시기금”이라 한다)의 자금을 지원받아 저소득 서민의 주거안정을 위하여 30년 이상 장기간 임대를 목적으로 공급하는 공공임대주택입니다. 위 목적에 따라 국민임대주택에 입주할 수 있는 입주자 자격이 있으며 일반적으로 1. 주택이 공급하는 계층에 해당할 것, 2. 해당 세대원이 주택을 소유하고 있지 않을 것, 3. 해당 세대원의 월평균소득 합계가 전년도 도시근로자 가구당 월평균 소득의 일정 비율 이하일 것, 4. 해당 세대원의 총자산 합계가 일정 기준 이하일 것, 5. 해당 세대원의 자동차 중 가장 비싼 자동차가액이 일정 기준 이하일 것. 이 다섯가지 자격에 부합하여야 합니다.
