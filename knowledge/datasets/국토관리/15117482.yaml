summary_user: 한국산업단지공단이 관할하는 전국 산업단지를 시도·시군구·읍면동과 주번지·부번지 단위의 지번별로 나눠, 각 지번이 속한 산업단지명과 관할조직(본부·지사)을 담은 건별 목록 파일이다. 특정 공장 부지 지번이 어느 산업단지에 속하고 공단의 어느 조직이 관할하는지 확인하려는 입주기업·사업자, 지역별 산단 관할 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없어서 행정구역명·지번 주소 매칭이나 산업단지명 매핑으로 전국산업단지및공장정보표준데이터·국토부 산업단지 일반현황 같은 산업단지코드 원장과 이어 쓰고, 관할조직코드는 같은 기관의 다른 데이터와 연결할 때만 쓴다.
limits: 표준 산업단지코드나 법정동코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되며, 표기 차이로 매칭이 어긋날 수 있다. 공단 관할 단지만 담고 있으므로 전국 모든 산업단지 목록으로 보면 안 된다.
