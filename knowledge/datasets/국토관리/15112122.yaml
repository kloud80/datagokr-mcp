summary_user: 청주시 산업단지 밖 개별입지 공장의 등록현황을 공장 한 곳당 한 행으로 담은 파일로, 회사명·도로명/지번 대표주소·업종명·생산품·종업원수와 부지·제조시설·부대시설·건축 면적(㎡)을 싣는다. 청주시 산업단지 외 지역에 어떤 업종 공장이 어디에 얼마나 몰려 있고 근로자가 몇 명인지 파악하려는 지역 산업 분석가나 입지를 검토하는 사업자가 쓴다. 사업자번호·업종코드·필지고유번호(PNU) 같은 전역 조인 키가 없어서, 다른 데이터와는 주소를 지오코딩하거나 회사명·업종명을 이름으로 맞춰 연결해야 한다.
description_portal: 2024. 12. 30. 기준, 청주시 개별입지 공장 등록현황 정보입니다. 개별입지 공장은 산업단지(국가산업단지, 일반산업단지, 도시첨단산업단지, 농공단지) 외에 위치한 공장을 의미하며, 여기서는 업체명, 공장대표주소(지번 및 도로명주소), 업종명, 생산품, 종업원수, 부지면적(제곱미터), 제조시설면적(제곱미터), 부대시설면적(제곱미터), 건축면적(제곱미터) 등의 공장 현황자료를 제공합니다.이 데이터를 활용하여 청주시 산업단지 외 공장 분포 및 근로자 수 등을 알 수 있습니다. ※ 팩토리온 기준 자료(한국산업단지관리공단)
