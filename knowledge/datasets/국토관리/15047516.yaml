summary_user: 창원시가 관리하는 일반산업단지 안 지식산업센터를 건물 한 곳당 한 행으로 정리한 소규모 현황 파일(csv, 약 4KB)로, 시설건물명·소재지·완공 여부·입주 가능 업종·세제지원과 금융지원 내용을 담는다. 창원에서 지식산업센터 입주를 검토하는 창업자·중소기업이 '어느 센터에 내 업종이 들어갈 수 있고 어떤 세제·금융 지원을 받는가'를 확인하거나, 분석가가 시내 센터 분포와 완공 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장이나 산업단지 통계와는 건물명·소재지 주소를 매칭해 이어 써야 한다.
description_portal: 창원시에서 관리하는  일반산업단지 내 지식산업센터 현황(시설건물명, 소 재지, 입주가능업종, 세제지원 내용 등) 자료이오니 업무에 참고하시길 바랍니다.첨단 기술·벤처기업 등을 위한 업무·생산 공간인 지식산업센터의 위치, 운영 현황 및 활용 현황을 포함한 자료입니다. 이 데이터는 센터의 지역 분포, 입주 기업 수, 활용 유형, 공공지원 현황 등을 파악하여 산업 정책 수립, 창업 지원, 지역경제 활성화, 공간 계획 등에 활용될 수 있습니다.본 자료는 데이터 양이 많을 경우 일반 뷰어(엑셀, 메모장 등)에서 일부만 표시될 수 있으므로 R, Python, GIS 등 분석 도구 사용을 권장합니다.센터 규모, 개소 연도, 주요 입주 업종 등 세부 정보는 제공기관의 메타데이터나 기술문서를 참고해 주세요.
