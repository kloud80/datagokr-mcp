summary_user: 경기도 내 시군별로 진행 중인 공공건축물 공사를 사업 한 건씩 담으며, 시군명·공사명·건물 규모(면적·지하/지상 층수)·현재 공정률·공사기간·총사업비(백만원)를 기록한다. 지역 분석가나 도민이 '우리 시군에서 진행 중인 공공건축 공사는 무엇이고 공정률과 사업비는 얼마인가'를 확인하거나, 유사 사업의 예산·일정을 잡을 때 참고하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm) 같은 이름 매핑으로만 이을 수 있다.
description_portal: 이 데이터는 경기도 내 공공건축물에 대한 공사 추진 현황을 나타내며, 시군별로 수행 중인 주요 건축사업에 대한 정보가 포함되어 있습니다. 항목은 시군명, 공사명, 건물규모정보, 공정내용, 공사기간, 총사업비(백만원)으로 구성되어 있으며, 건물 규모는 면적(㎡), 층수(지하 및 지상), 공정내용은 현재 공정률(%)로 표현됩니다.총사업비는 백만원 단위로 표기되어 사업 규모를 파악할 수 있습니다. 본 데이터는 공공건축 사업의 진행상황을 모니터링하거나 지역별 건축 투자 규모를 분석하고, 향후 유사 사업의 예산 산정 및 일정 계획에 참고자료로 활용될 수 있습니다.
