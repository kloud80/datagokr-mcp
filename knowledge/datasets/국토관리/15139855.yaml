summary_user: 한국토지주택공사가 2024~2025년에 낸 5년·10년 분양전환 공공임대주택 공고의 임대납부조건을 공고·사업지구·블록·주택형 단위로 담은 파일로, 세대수·주소·공급/전용면적과 임대보증금(계약금·중도금·잔금)·월임대료가 함께 들어 있다. 입주를 검토하는 국민이나 임대시장 분석가가 '이 지구의 이 평형은 보증금과 월세가 얼마이고 계약금·중도금·잔금은 어떻게 나뉘나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구명·주소 같은 이름·주소 매핑으로만 잇고, 전월세 실거래 등 임대차 데이터와 나란히 비교하는 용도로 쓴다.
description_portal: 한국토지주택공사 분양전환임대주택(5년 및 10년 공공임대주택)의 2024~2025년도 공고의 임대납부조건(공고명, 사업지구명, 주소 및 상세주소, 공급면적, 전용면적, 임대보증금, 월임대료 등)에 대한 정보를 제공합니다. 공급면적은 전용면적과 주거공용면적의 합으로서 보통 주택 분양 시 흔하게 사용하는 면적입니다. 전용면적은 각 세대에서 독점적으로 사용할 수 있는 침실, 거실, 주방, 화장실 등의 면적을 의미하고 여기에 발코니 면적은 포함되지 않습니다. 주거공용면적은 공용 계단, 복도, 엘레베이터 등 모든 입주자가 공용으로 사용하는 공간의 면적을 의미합니다. 임대납부조건은 임대보증금(계약금+중도금+잔금) + 월임대료로 구성되며 주택별로 임대보증금과 월임대료 사이에 전환이 가능한 경우가 있으니 각 공고문을 참고하시기 바랍니다. 다만, 해당 주택의 분양전환 가격은 분양전환 시점에 감정평가를 통하여 결정되고 임대납부조건과는 관련이 없는 점 유의하시기 바랍니다.
