summary_user: 산업단지 안의 일부 지원시설을 시설 단위(지원시설관리번호)로 담은 파일로, 시설이 속한 산업단지코드·산업단지명과 최초등록·최종수정 일시를 포함하며 범위는 전국이다. 산업단지 입지를 검토하는 사업자나 분석가가 특정 산업단지에 어떤 지원 인프라가 등록되어 있는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 산업단지코드·산업단지명을 산업단지코드 원장 역할을 하는 전국산업단지및공장정보표준데이터 등과 이름·코드로 맞춰 연결해야 한다.
description_portal: 본 데이터는 산업단지 내 일부 지원시설을 식별하기 위한 지원시설관리번호, 각 시설이 속한 산업단지코드, 데이터가 시스템에 최초로 등록된 시점, 이후 변경 또는 업데이트된 시점을 나타내는 최초등록일시·최종수정일시 등으로 구성되어 있습니다.산업단지 내 다양한 지원 인프라의 존재 여부를 확인할 수 있으며, 각 시트별 지원시설의  정보, 업종, 위치정보가 포함되어 있습니다. * 본 데이터는 2020년 시범적으로 축적한 데이터로, 본 데이터 전후 시점의 데이터는 보유하고 있지 않습니다. * 지원시설은 산업집적법상 필수 등록대상이 아니므로 대부분의 시설의 정보가 없을 수 있습니다.
