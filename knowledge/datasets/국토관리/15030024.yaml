summary_user: 대전광역시 서구의 용도지역(주거·상업·공업·녹지지역, 개발제한구역 등)을 대구분·소구분별로 나누어 지정목적과 면적(제곱미터)을 담은 시군구 단위 집계 파일이며, 1천 바이트 남짓의 작은 CSV입니다. 도시계획 분석가나 주민이 서구 전체 면적 가운데 주거지역과 녹지지역이 각각 얼마나 되는지 비교하거나 비율을 계산할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역의 용도지역 면적 자료와는 도시명·용도지역 이름을 맞춰 연결해야 한다.
limits: 필지나 구역 단위의 위치 정보가 없는 비공간 집계이므로 지도 위에 용도지역 경계를 그리거나 특정 토지의 용도지역을 확인하는 데는 쓰지 못한다. 공통 코드 키가 없어 다른 데이터와는 이름 매핑으로만 붙일 수 있다.
