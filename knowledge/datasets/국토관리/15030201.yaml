summary_user: 시흥시 관내에 등록된 공장을 한 건씩 담은 등록 현황 파일로, 포털 설명 기준 약 11,125건이며 단지명·회사명·업종명·생산품·주원자재·종업원수·용지면적·건축면적 등을 공장 단위로 담는다. 분석가나 기업지원 담당자가 '시흥시 산업단지별로 어떤 업종의 공장이 몇 곳이고 고용 규모는 어떤가' 같은 질문에 쓴다. 사업자번호·업종코드·필지고유번호(PNU) 같은 전역 조인 키는 없어서, 다른 데이터와는 공장대표주소(도로명·지번)나 회사명·업종명 문자열 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 시흥시 관내 공장 등록 현황에 대한 정보를 제공합니다. 총 11,125건으로 구성된 본 데이터는 단지명, 회사명, 설립구분, 공장대표주소 등 기본 정보와 함께 종업원 수, 생산품, 업종명, 공장 규모를 나타내는 용지면적, 건축면적 등의 항목을 포함하고 있습니다. 해당 데이터는 시흥시 산업 구조 파악, 제조업체 분포 분석, 고용현황 조사, 산업단지 계획 수립, 기업 지원정책 개발 등의 기초자료로 활용할 수 있습니다. 특히 업종별·지역별 기업군을 분류하거나 입지 특성 분석, 산업 클러스터 연구 등에 필요한 기반 정보를 제공합니다. 공공기관뿐 아니라 기업, 연구기관 등에서도 지역 산업 생태계 이해 및 정책 수립을 위한 유용한 자료로 사용할 수 있습니다.
