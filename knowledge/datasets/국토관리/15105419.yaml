summary_user: SH공사가 보유한 장기전세주택 자산을 자치구별로 합산한 집계 파일로, 재산세 부과 대상 호수, 토지·건물별 취득가액과 장부가액(억 원), 토지·건물 합산 공시가격을 담는다(CSV 775바이트 규모의 소량 표). 분석가나 시민이 '어느 자치구에 SH 장기전세 자산이 많이 몰려 있고, 취득 당시 금액 대비 현재 장부가와 공시가격은 어떤가'를 비교하는 데 쓴다. 전역 조인 키는 없으므로 자치구명을 시군구 코드로 이름 매핑해 공시가격·전월세 실거래 같은 시군구 단위 주택 데이터와 붙여 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 보유하고 있는 장기전세주택 관련 자산 내역을 자치구별로 정리한 공공데이터입니다. 항목에는 자치구명, 재산세 부과 대상 호수, 취득가액(토지 및 건물 각각, 억 원 단위), 장부가액(토지 및 건물, 억 원 단위), 공시가격(토지 및 건물 합산) 등이 포함되어 있습니다. 취득가액은 공사가 해당 자산을 취득한 시점의 실제 지출 금액이며, 장부가액은 회계상 현재 자산으로 계상된 금액을 의미합니다. 공시가격은 과세 및 공공기준 평가에 활용되는 정부 산정 가격으로, 시장가와는 차이가 있을 수 있습니다. 이 데이터를 통해 장기전세 자산의 회계상 가치, 자치구별 보유 규모, 부동산 자산 건전성 등을 분석할 수 있으며, 공공주택 자산운영의 투명성 확보, 재무분석, 재산세 부과 기준 검토 등에 활용될 수 있는 중요한 자료입니다.
