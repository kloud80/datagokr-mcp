description_portal: 한국국토정보공사의 정보시스템 현황 데이터는 2024년 현재 공사에서 운영 중인 정보시스템들을 체계적으로 정리한 자료입니다. 시스템별로 현행정보시스템명, 서비스 대상(내부직원, 국민, 민간기업 등), 시스템 목적, 구축년도 등의 항목으로 정보자원의 체계적 관리와 시스템 현황 분석, 향후 정보화 전략 수립 등에 활용할 수 있도록 공개하고, 정보시스템의 중복 투자 방지, 유지관리 계획 수립, IT 자원 통합 등 전략정 정보화 추진을 위한 기반 자료로 활용되는 데이터입니다. 이를 통해 연구기관, 기업, 공공기관 등은 LX의 정보화 자원을 이해하고, 시스템 간 연계·활용 가능성을 탐색할 수 있으며, 나아가 공공데이터 기반의 혁신 서비스 개발 및 정책 연구에도 기여할 수 있습니다.
