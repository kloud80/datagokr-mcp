summary_user: 부산광역시 16개 구군별로 완충녹지·경관녹지·연결녹지의 개소수와 면적(제곱미터)을 정리한 2009년 기준 집계 파일이다. 도시계획·환경 분석가가 '어느 구에 완충녹지가 많고 연결녹지가 부족한가'처럼 구군 간 녹지 유형별 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 구군 이름(구군별)을 기준으로 다른 부산 구군 단위 통계(인구·공원 현황 등)와 이름 매핑으로 이어 쓴다.
description_portal: 2009년 부산광역시 녹지에 대한 데이터로 구군별 녹지 면적현황에 대한  정보를 제공합니다.녹지는 도시지역에서 자연환경을 보전하고 개선하며, 공해와 재해를 막아 도시경관을 좋게 만들고자 도시·군관리계획으로 지정된 땅을 말합니다. 이는 단순히 나무나 풀이 있는 공간을 넘어 도시의 중요한 인프라 역할을 합니다.녹지는  대기오염, 소음, 진동, 악취 등의 공해나 각종 재해를 막기 위해 설치하는 녹지입니다. 공장, 철도, 도로 등과 주거지역을 분리하는 역할을 하는 완충녹지도시의 자연 환경을 보전하거나 훼손된 지역을 복원해 도시 경관을 좋게 만들고자 설치하는 경관녹지도시 내 공원, 하천, 산지 등을 유기적으로 연결하여 시민들에게 산책 공간을 제공하는 선형의 연결녹지로 나눕니다.개방되는 데이터는 16개 구군의 녹지면적을 제공합니다.
