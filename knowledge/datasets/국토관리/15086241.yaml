summary_user: 경상북도 도내 시군에서 추진 중인 도시개발사업을 사업 한 건씩 담은 작은 목록 파일(csv 약 3.6KB)이며, 사업명·읍면·리동·면적(천㎡)·사업비(억원)·수용호수·지구지정일·시행자·비고로 구성된다. 도시계획 담당자나 연구자, 부동산 관심 주민이 "경북에서 어느 지역에 어떤 규모의 도시개발구역이 언제 지정됐고 누가 시행하는가"를 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 읍면·리동 이름이나 사업명을 문자열로 맞춰서만 이어 쓸 수 있다.
description_portal: 경상북도의 도시개발사업 추진 현황 데이터는 도내 각 시군의 주요 개발사업에 대한 사업명, 읍면동, 면적, 사업비, 수용호수, 지구지정일, 시행자, 진행상태 등 핵심정보를 구조적으로 제공합니다. 공공 및 민간 주체가 수행한 사업들의 추진단계와 현황을 파악할 수 있어, 정책 수립, 도시계획, 연구, 행정 등 다양한 분야에서 활용 가능합니다. 데이터는 각 사업의 세부정보를 구체적으로 기록하여, 이용자가 도시개발 현황을 신속히 분석하고 활용할 수 있도록 설계되었습니다. 자료 관련 문의는 054-880-3923으로 하시기 바랍니다.
