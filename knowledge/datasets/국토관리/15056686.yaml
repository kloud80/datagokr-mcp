summary_user: 경기도 내 지식산업센터를 건물 단위로 담은 현황 데이터로, 시군명·건물명·층수·대지·건축면적, 공장·지원시설 면적, 입주가능·입주 업체 수, 공사 진행 상황, 준공연도·사용승인일, 위경도 좌표를 담는다. 창업자나 중소 제조업체가 '우리 시군에 입주할 수 있는 지식산업센터가 어디 있고 얼마나 차 있나'를 알아보거나, 분석가가 시군별 도시형 공장 집적 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명이나 건물명 매칭으로 다른 시군 통계·건축물대장과 잇고, 좌표로 지도에 올려 산업단지 위치와 겹쳐 본다.
description_portal: 경기도 내의 지식산업센터 현황입니다.지식산업센터란 동일 건축물에 제조업, 지식산업 및 정보통신사업을 영위하는 자가와 지원시설이 복합적으로 입주할 수 있는 다층형(3층 이상) 집합건축물로서 6개 이상의 공장이 입주할 수 있는 건축물을 말합니다.지식산업센터에 입주할 수 있는 시설첫째, 제조업, 지식기반산업, 정보통신산업, 그 밖에 특정 산업의 집단화와 지역경제의 발전을 위하여 산업단지관리기관 또는 시장, 군수, 구청장이 인정하는 사업을 운영하기 위한 시설둘째, 벤처기업을 운영하기 위한 시설셋째, 그 밖에 입주업체의 생산 활동을 지원하기 위한 시설로서 금융, 보험업 시설, 기숙사, 근린생활시설 등의 시설입니다.
