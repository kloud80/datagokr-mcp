summary_user: 지방자치단체가 구축해 국토교통부가 취합한 도시·군관리계획 결정 정보 중 공공문화체육시설 부분을 시도별 파일(SHP)로 담은 전국 범위 자료이며, 필드로 시군구 식별값·관리번호·명칭(별칭)·비고·고시일자 등이 있다. 도시계획 분석가나 부동산·개발 사업자가 어느 지역에 공공문화체육시설이 도시계획으로 결정·고시되어 있는지, 언제 고시되었는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군구 이름·코드 매핑이나 같은 기관(국토교통부 연속주제도) 코드로만 연결한다.
limits: 포털 API가 아니라 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일을 받아야 하며, 포털 활용신청과는 별개다. 공통 조인 키가 없어 지적·건축물 등 다른 데이터와 바로 결합되지 않는다.
