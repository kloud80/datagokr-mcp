summary_user: 대구광역시 달성군에서 기계설비 성능점검 대상이 되는 건축물을 건물 단위로 정리한 파일로, 건물명·도로명 주소·법정동·연면적·위도·경도와 데이터기준일자를 담는다(CSV 약 16KB). 주민이나 시설관리 사업자가 달성군에서 어느 건물이 성능점검 대상이고 어디에 몰려 있는지 확인하는 데 쓴다. 전역 조인 키는 없으므로, 도로명 주소나 위도·경도로 건축물대장·지도 데이터와 공간·주소 매칭을 하거나 법정동 이름으로 지역 통계와 묶어 쓴다.
description_portal: 건축물에 설치된 기계설비의 성능점검 현황을 정리한 자료로, 점검 대상 설비의 위치, 용도, 점검 결과 등 기계설비 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 기계설비 성능점검 대상 시설의 분포 현황과 관리 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 기계설비 성능점검 결과에 대한 체계적인 관리를 통해 설비의 안전성과 효율성을 분석하고, 시설물 유지관리 및 안전 관리 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 기계설비에 대한 행정 관리, 점검 이행 여부 확인, 개선 조치 관리 업무 수행과 함께 관련 통계 산출 및 시설 관리 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 기계설비의 안정적인 운영과 사고 예방을 위한 관리 체계를 강화하고, 건축물 안전 확보 및 쾌적한 이용 환경 조성을 위한 정책 추진의 기초자료로 활용되며, 지속적인 시설 관리 및 안전 행정 업무 수행을 지원하는 행정자료로 활용된다.
