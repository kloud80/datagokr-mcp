summary_user: 경기도 의정부시 지역화폐 카드의 월별 신규 발행 수량, 충전액, 관내 가맹점 사용액(금액 단위 천 원)을 기준년월별로 담은 시군구 단위 집계 파일(csv, 약 3.6KB)이다. 정책 담당자나 지역경제 분석가가 '의정부 지역화폐 충전액 대비 실제 사용액이 월별로 어떻게 변했나'처럼 지역화폐 정책 효과와 사용 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명과 기준년월을 이름·기간으로 맞춰 경기도 다른 시군의 지역화폐 현황이나 월별 지역 통계와 이어 쓴다.
description_portal: '경기도 의정부시의 지역화폐 발행 금액 및 사용 현황 데이터로 시군명, 기준년월, 월별 카드발행수량, 월별 카드충전액, 월별 카드사용액, 데이터기준일 등으로 구성되어 있습니다. 이 데이터는 의정부시의 지역화폐가 지역 경제 활성화에 기여하는 정도를 파악하고, 지역화폐 사용 패턴을 분석하는 데 활용될 수 있습니다. 특히, 월별로 발행된 카드 수량, 충전액, 사용액을 종합적으로 분석함으로써 지역화폐 정책의 효과를 정량적으로 평가하고 향후 정책 수립의 기초 자료로 활용할 수 있습니다.* 월별 카드발행수량: "새롭게 발급된 지역화폐 카드의 월별 수량을 의미합니다. 이 지표를 통해 의정부 지역화폐에 대한 시민들의 신규 참여도를 파악할 수 있습니다."* 월별 카드충전액: "매월 의정부 지역화폐 카드에 충전된 총 금액을 나타냅니다. 이는 시민들의 지역화폐에 대한 관심도와 사용 의지를 반영하는 중요한 지표입니다."* 월별 카드사용액: "매월 의정부시 관내 가맹점에서 지역화폐 카드를 통해 실제로 결제된 총 금액입니다. 이 데이터는 지역 내 소비 촉진 효과를 측정하는 핵심 지표로 활용됩니다."'
