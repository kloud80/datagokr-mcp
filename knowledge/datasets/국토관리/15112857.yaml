summary_user: 서울 양천구 관내 공동주택 단지별 주차장 허가 현황을 건물명, 도로명·지번주소, 허가면수(면) 단위로 담은 단지별 개별 목록 파일(csv)이다. 주민이나 분석가가 '우리 동네 아파트 단지는 주차면이 몇 면으로 허가됐는가'를 확인하거나, 구 단위 주거단지 주차 관리 계획을 세울 때 쓴다. 전역 조인 키나 K-apt 단지코드가 없어 다른 공동주택 데이터와는 건물명·주소 문자열 매칭으로만 이어 쓴다.
limits: 단지코드 같은 공통 키가 없어 K-apt 단지 정보나 실거래 자료와 붙이려면 이름·주소 매핑을 직접 해야 한다. 범위는 양천구 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
