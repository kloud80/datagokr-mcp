summary_user: 대구광역시 서구 관내 어린이공원을 공원별 한 행으로 정리한 현황 파일로, 공원명·행정동 기준 소재지·조성면적(제곱미터)·조합놀이대 등 공원시설·조성연도를 담는다(포털 설명상 17개 공원, csv 약 1KB). 보호자가 "우리 동네 근처에 놀이시설이 있는 어린이공원은 어디이고 얼마나 넓은가"를 확인하거나, 분석가가 서구 내 동별 어린이공원 분포와 조성 시기를 비교하는 데 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어 다른 공원·인구 데이터와는 소재지(행정동) 이름이나 공원명으로 직접 맞춰 이어 써야 한다.
description_portal: 대구광역시 서구 어린이공원 현황 데이터 입니다. 공원유원지명, 소재지, 조성면적, 공원시설, 조성연도 등을 포함하고 있습니다.대구광역시 서구 관내에 조성된 어린이공원의 현황을 정리한 데이터이다. 본 자료에는 공원의 명칭, 소재지, 조성면적, 주요 시설, 조성연도 등이 포함되어 있다. 조합놀이대, 로프놀이시설 등 어린이 이용에 적합한 시설물 현황을 확인할 수 있으며, 각 공원별 위치 정보는 행정동 기준으로 표기하였다. 총 17개 공원에 대한 정보가 수록되어 있으며, 면적과 시설 종류, 조성 시기를 비교함으로써 지역 내 공원 기반 시설의 분포와 특성을 파악할 수 있다. 본 데이터는 지역 내 공공시설 활용 현황 분석, 도시계획 자료, 생활권 중심 여가공간 확보 등의 목적에 활용될 수 있다. 또한 어린이 이용자와 보호자에게 공원 선택 정보를 제공하는 기초자료로 활용 가능하다.
