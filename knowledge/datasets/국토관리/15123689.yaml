summary_user: 경기도 내 토지에 지어진 일반건축물의 층별 현황을 층 한 개 단위로 담으며, 토지고유번호·건물번호·소재지·건축물대장 종류·층 구분(지상·지하·옥탑)·구조·층별 용도·면적을 포함한다. 분석가나 부동산 실무자가 특정 필지 건물의 지하층 면적이나 층마다 어떤 용도로 쓰이는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않았으므로 다른 데이터와는 토지고유번호(land_idntfy_no)나 소재지 이름을 맞춰 보는 방식으로 이어 써야 하며, 건축물대장·공시지가 등 국토 정보 원장 계열 데이터가 연결 대상이다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 건물 층별 현황 정보로, 경기도 내 특정 토지에 건축된 건물의 층수, 구조, 용도, 면적 등에 대한 상세 정보를 포함합니다. 항목에는 토지고유번호, 건물번호, 토지소재지, 건축물대장종류, 층번호명, 구조코드, 기타용도, 면적 등이 포함되며, 건축물은 일반건축물 기준으로 분류되어 있습니다. ‘층번호명’은 지상·지하·옥탑 등 층의 위치를 구분하며, ‘기타용도’는 해당 층의 기능을 설명합니다. * 데이터가 많아 시트에서는 전체 데이터의 다운로드나 조회가 불가능합니다. file 서비스를 이용 부탁드립니다.
