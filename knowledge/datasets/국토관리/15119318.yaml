summary_user: 한국토지주택공사가 공급하는 상가를 호(점포) 단위로 담은 파일로, 사업지구·블록·상가명과 층·호수, 전용·공용·공유대지·확장대지 면적, 근린생활시설 1·2종 공급용도, 공급여부, 계약장소 주소, 수의계약 개시일시를 전국 범위로 수록한다. 창업 준비자나 상가 투자자가 특정 LH 사업지구에서 아직 공급 중인 점포와 그 면적·용도, 수의계약 시작 시점을 확인하는 데 쓴다. 사업지구코드(lh_project_district_cd)를 키로 LH의 다른 사업지구·주택 공급 데이터와 잇고, 주택건설블록코드로 같은 블록의 주택 정보와 맞춰 볼 수 있다.
description_portal: '한국토지주택공사가 공급하는 상가에 대한 사업지구명, 상가명, 면적, 상가공급용도명, 공급여부 등의 상가 정보를 제공합니다."계약장소소재지주소"가 주소를 다 표현한 경우 "계약장소소재지상세주소"가 비어있을 수 있습니다.사업지구명 : 도시 개발 사업, 공공 주택 사업, 교육 사업 등 다양한 분야에서 사용되는 지구명공유대지면적 : 여러 사람이 공동으로 소유한 토지의 면적을 의미확장대지면적 : 기존 대지에 추가로 확보한 토지의 면적을 의미상가공급용도 : 근린생활시설로 「건축법 시행령」에 따라 제1종과 제2종으로 구분되며 제1종은 필수시설 제2종은 필수시설 외 시설'
