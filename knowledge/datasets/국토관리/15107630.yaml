description_portal: 공공데이터의 제공 및 이용 활성화에 관한 법률 제18조 규정에 의거 주택보급현황을 제공합니다.정선군 주택보급현황은 강원특별자치도 정선군 내 관리 중인 주택보급에 대한 목록입니다.데이터는 크게 세대수, 단독주택, 다가구주택(동, 가구 포함), 다세대, 연립, 아파트, 주상복합의 현황 및보급률에 대한 정보를 포함 하고 있으며 별도로 공가(농촌,일반공가,공동주택) 정보도 함께 구성되어 있습니다.자세한 사항은 정선군청 홈페이지 및 정선군 도시과로 문의주시기 바랍니다.(https://www.jeongseon.go.kr/portal/admininfo/statistics/annualreport)
