summary_user: 임실군 전역에 설치된 태양광 등 전기사업 발전소를 발전소 한 곳당 한 행으로 담은 파일 데이터로, 발전소명·설치 주소·설비용량(kW)·발전사업 허가일자·사업개시일을 포함한다. 에너지 정책 담당자나 태양광 입지를 검토하는 사업자가 '임실군 어느 읍·면에 어느 규모의 발전소가 언제 허가·가동됐는가'를 확인하는 데 쓴다. 다른 데이터와 직접 이을 공통 키는 없으므로 설치장소 주소를 지오코딩하거나 행정구역명으로 맞춰 연결해야 한다.
limits: 실측 컬럼에서 전국 단위 조인 키가 확인되지 않아 다른 시군 발전소 목록이나 발전량 통계와는 주소·이름 매칭으로만 연결된다. 범위가 임실군 한 곳이라 광역·전국 비교에는 다른 시군 자료가 따로 필요하다.
