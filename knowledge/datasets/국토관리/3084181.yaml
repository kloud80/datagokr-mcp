summary_user: 제주특별자치도 안에 있는 비지정 천연동굴을 동굴 한 곳당 한 행으로 담은 현황 목록으로, 동굴명·소재지역·관련부서·데이터기준일자가 들어 있다(CSV 약 15KB). 천연기념물이나 도지정 문화재로 지정되지 않은 동굴이 어디에 있는지 확인하려는 연구자·지자체 담당자·탐방객이 "내 지역 인근에 보존 대상 비지정 동굴이 있는가"를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지역 이름이나 동굴명으로 직접 맞춰 이어야 한다.
description_portal: '"제주특별자치도 내 소재하는 비지정 동굴 현황데이터를 제공합니다.항목: 동굴명, 소재지역 등*천연동굴: 지하 암체 내 천연으로 만들어진 공동(空洞)으로 국가유산청의 천연동굴 보존·관리 지침에 따라 도지정문화재와 비지정문화재로 나눠 관리되고 있음*천연기념물이나 시·도지정문화재적 가치는 없으나 동굴 내부에 동굴생성물과 미지형이 발달하여 보존할 필요가 있는 동굴 등으로 구분자세한 사항은 제주통계포털 홈페이지의 주요행정통계를 확인하시기 바랍니다.https://www.jeju.go.kr/stats/mdis/report/administration.htm?act=view&seq=1508325"'
