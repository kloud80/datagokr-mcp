description_portal: 전북특별자치도 진안군의 숙박업소 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 시군명, 숙박업 업체 상호명, 연락처, 관광객이 쉴 수 있는 객실 수, 숙박업 구분 등 정보를 제공합니다. 데이터 중 연락처 부분의 공란은 휴대폰 전화번호로 개인정보에 해당 되어 제외하였습니다. 그리고 홈페이지 열과 이메일 열도 각 숙박업 업체에서 운영하지 않아 제외 처리를 하여 빈 칸으로 두었습니다. 이 자료로 관광객이 진안을 여행할 때 숙박업 업체에 전화를 걸어 빈 객실을 확인하는 절차에 활용할 수 있습니다.
