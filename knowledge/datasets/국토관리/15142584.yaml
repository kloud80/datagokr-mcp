summary_user: 전북특별자치도 진안군에 있는 숙박업소를 업소 한 곳당 한 행으로 담은 목록으로, 상호명·연락처·객실수·숙박업 구분과 데이터기준일자를 담는다(CSV 727바이트 규모의 작은 파일). 진안을 여행하려는 관광객이 "진안에 객실이 몇 개인 숙소가 어디 있고 어디로 전화하면 되나"를 확인하거나, 분석가가 군 단위 숙박 공급 규모를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 시군 이름으로 맞춰 이어 써야 한다.
limits: 범위가 진안군 한 시군구로 한정되어 다른 지역과의 비교는 따로 모아야 한다. 업소 코드나 주소 같은 공통 키가 없어 인허가·관광 데이터와 정확히 연결하기 어렵다. 포털 설명상 휴대폰 번호인 연락처와 홈페이지·이메일 열은 비어 있고, 빈 객실 여부 같은 실시간 정보는 담지 않는다.
