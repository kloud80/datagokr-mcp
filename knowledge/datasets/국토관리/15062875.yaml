summary_user: 2025년에 공고·공급된 서울 역세권 청년안심주택을 공고회차·자치구·공급유형·평면유형·신청자격별로 나눠 임대보증금과 월임대료(원)를 담은 파일(csv, 약 23KB)이다. 청년이나 신혼부부가 '어느 자치구의 어떤 평면유형이 보증금·월세가 얼마인가'를 비교하거나, 분석가가 지역별 임대 조건과 보증금 대비 월세 비중을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구 이름 매핑이나 같은 기관(서울주택도시개발공사) 자료로만 연결한다.
description_portal: 이 데이터는 역세권 청년안심주택 공급사업의 일환으로 확보한 청년임대주택중 2025년에 공고하여 공급한 주택들에 대한 정보를 담고 있습니다. 해당 자료에는 각 주택의 공급회차(공고회차), 위치(자치구), 보증금, 월임대료 등 실거주에 필요한 실질 비용이 포함되어 있어 청년층이 주거 선택 시 참고할 수 있는 실용적 자료입니다. 특히 역세권에 위치한 청년주택은 교통 접근성이 높고, 민간과 공공이 협력하여 시세 대비 낮은 임대료로 공급되는 특징이 있어 주거 취약 청년 및 신혼부부계층의 부담 완화에 크게 기여합니다. 빈집 활용형의 경우 리모델링을 통해 공급되며, 지역별 공급 방식, 임대 조건 비교, 정책 효과 분석 등에 활용될 수 있습니다. 또한 보증금 대비 월세 비중등 비용 구조 분석을 통해 실거주자 중심의 맞춤형 정책 설계에도 유용한 자료입니다.
