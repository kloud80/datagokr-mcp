description_portal: 서울특별시 양천구 내 공공 도서시설의 위치와 운영 현황 등을 정리한 공공데이터이다. 주민의 독서활동과 정보 접근을 지원하는 도서관, 작은 도서관 등 시설 정보를 포함하며, 생활권 내 학습 환경 조성과 문화 기반 확충을 위한 기초자료로 활용된다. 주요 항목은 시설명, 주소, 운영 주체, 개관일, 운영시간, 장서 수, 열람석 수 등이며, 시설 접근성과 이용 편의성을 파악할 수 있도록 구성되어 있다. 어린이·청소년 특화 공간, 디지털 자료 제공 여부, 문화 프로그램 운영 등도 수록되어 있어 도서서비스 수요 대응에 유용하다. 본 데이터는 양천구청에서 관리하며, 도서정책 수립 및 정보서비스 확대를 위한 참고자료로 정기적으로 조사·갱신된다.
