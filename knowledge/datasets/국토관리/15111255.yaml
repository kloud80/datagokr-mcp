status: active
summary_user: 서울특별시 양천구 내 도서관·작은도서관 등 도서시설을 시설 단위로 담은 API로, 전체 25건이며 위치(좌표·도로명주소), 운영시간, 휴관일, 열람 좌석수, 자료수(도서·비도서·연속간행물), 대출 가능권수·일수를 포함한다. 주민이 집 근처에 열람석이 있고 늦게까지 여는 도서관이 어디인지 찾거나, 구 담당자가 생활권별 도서시설 분포를 점검할 때 쓴다. 위도·경도(coord)와 도로명주소(rdnmadr, address)를 키로 다른 지역 시설·인구·교통 데이터와 이어 쓴다.
limits: 실측 최신 행 날짜는 2022-11-14이고 수록 기간이 2022-11-10~2022-11-14에 그쳐, 현재 운영 상태를 반영하는지는 확인되지 않는다. 범위는 양천구 25건이라 다른 지역 비교에는 쓸 수 없고, 이 데이터에는 이용자 수나 대출 실적이 없다. 호출에는 포털 활용신청 후 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
