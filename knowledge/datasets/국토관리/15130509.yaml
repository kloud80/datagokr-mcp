description_portal: 대구광역시 상수도사업본부의 과오납금에 대한 환급 시 이자율을 제공하고 있습니다. 과오납 환급금 이자율은 국세기본법 시행규칙 제19조3(국세환급가산금의 이율)을 따릅니다. 참고로 대구광역시의 상수도요금 환불은 요금이 이중으로 납부되었거나, 사용 기간에 비해 과다하게 부과된 경우, 또는 해지 후 잔액이 남았을 때 등 특정 사유가 있을 경우 신청할 수 있는 제도입니다. 이 환불 절차는 상수도 사용자의 권익 보호와 공정한 요금 부과를 위한 중요한 행정 서비스 중 하나입니다. 상수도요금 환불이 발생하는 대표적인 사례는 다음과 같습니다. 첫째, 자동이체나 카드 결제 과정에서 같은 달 요금이 중복으로 납부된 경우입니다. 둘째, 중간정산이나 해지를 한 이후 계량기 사용량과 정산 기준일 사이에 요금이 과다 납부된 경우가 있으며, 셋째는 수도 요금 감면 대상임에도 감면 혜택이 반영되지 않아 요금이 초과 청구된 경우입니다.
