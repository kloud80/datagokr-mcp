summary_user: 천안시 도시계획정보시스템(UPIS)의 경관지구 현황을 도형 단위로 담은 파일로, 현황도형 관리번호·라벨명·도면번호와 면적·길이 값을 제공하며 파일 크기는 약 1KB(1078 bytes)로 작다. 천안시 안에서 어느 곳이 경관지구로 지정돼 있고 그 면적이 얼마인지 확인하려는 토지 소유자·사업자나 도시계획 분석가가 쓴다. 전역 조인 키가 없어 라벨명 같은 이름이나 같은 기관(천안시)의 다른 UPIS 용도지구 현황과 이름 기준으로만 맞춰 쓴다.
description_portal: 충청남도 천안시 도시계획정보시스템(UPIS)의 경관지구 현황으로 현황도형 관리번호, 라벨명, 도면번호, 면적 도형, 길이 도형의 항목을 제공합니다.도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 경관지구 현황 테이블을 데이터 개방하였습니다.
