description_portal: 논산시 주민참여예산제 운영 현황을 담은 "주민참여예산사업_부서별" 데이터입니다. 주민참여예산제는 시민이 직접 사업을 제안하고 예산 편성과정에 참여하여 재정 운영의 투명성과 민주성을 높이는 제도입니다.본 데이터는 사업연도, 사업이 시행되는 행정동, 구체적인 사업명, 주관 부서명, 배정된 사업금액과 관리기관 등 사업 전반에 대한 상세 정보를 제공합니다. 특히 담당 부서별로 사업 내역이 정리되어 있어, 논산시 각 부서의 주민 제안 사업 추진 현황을 비교 분석하고, 예산 집행의 책임성을 확인하는 데 유용하게 활용될 수 있습니다.
