summary_user: 경기도가 지정한 안심식당을 업소 한 곳당 한 행으로 담은 건별 목록으로, 시군명·업소명·도로명/지번 주소·업종·전화번호·선정 여부·취소일자·위경도(WGS84)를 포함한다. 주민이 "우리 동네에서 지금도 안심식당으로 유지되는 음식점은 어디인가"를 찾거나, 분석가가 시군별 안심식당 분포와 지정 취소 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 위경도 기반 공간 결합으로 이어 써야 한다.
description_portal: '이 데이터는 경기도 내 ‘안심식당’으로 선정된 음식점 정보를 포함하고 있으며, 식당명, 주소(도로명 및 지번), 업종, 상세업종, 전화번호, 선정 여부, 취소일자, 위경도 좌표(WGS84), 우편번호 등을 제공합니다. 안심식당은 위생수칙을 준수하며 감염병 예방에 기여하는 외식업소를 지자체가 지정한 것으로, 선정여부를 통해 현재 운영 상태도 확인할 수 있습니다. 본 데이터는 지역 주민의 안전한 외식 환경 제공, 위생적 음식문화 조성, 방역 관련 정책 수립 및 모니터링 등에 활용될 수 있습니다.※ 안심식당 : 일반음식점 중 식사문화 개선 과제 및 생활방역 수칙을 준수하는 업소'
