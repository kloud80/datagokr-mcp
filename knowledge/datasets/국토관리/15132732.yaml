summary_user: 보령시 평생학습 프로그램인 만세보령아카데미에서 운영된 강좌를 강좌 안내 한 건당 한 행으로 담은 파일(csv, 약 55KB)로, 강의 주제·회차·일시·강사명과 경력·등록일자·조회수가 들어 있다. 보령시 주민이나 평생교육 담당자가 "어떤 주제의 강좌가 언제 어떤 강사로 열렸고 조회가 많았던 강좌는 무엇인가"를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 강사명이나 강의주제 같은 이름으로 맞추거나 같은 보령시 자료끼리 묶어서 본다.
description_portal: 지역 주민의 평생학습 역량 강화 및 지역 특화 교육 프로그램에 대한 수요가 증가하는 가운데, 충청남도 보령시는 누리집 메타데이터를 기반으로 만세보령아카데미 강좌목록 데이터를 제공합니다. 본 데이터는 강의안내번호, 강의주제, 횟수, 강의일시, 강사명, 경력, 추가정보, 원본파일명, 시스템파일명, 등록일자, 삭제여부, 조회수 항목으로 구성되어 있으며, 만세보령아카데미에서 운영된 강좌의 세부 현황을 체계적으로 파악할 수 있도록 정리되어 있습니다. 지자체 및 평생교육 관련 기관은 본 데이터를 통해 강의 주제별·강사별 운영 현황과 강좌 조회수를 분석하고, 시민 수요가 높은 분야의 강좌 확대 및 아카데미 운영 개선 계획 수립에 활용할 수 있습니다. 또한 평생교육 연구기관에서는 강의 주제 및 운영 이력 데이터를 바탕으로 지역 맞춤형 교육 프로그램 개발 및 강사 풀 구성 방안 연구에 기여할 수 있으며, 문화·관광 분야에서는 지역 특화 강좌 현황을 활용하여 보령시의 교육 브랜드 가치 제고에 본 데이터를 활용할 수 있습니다.
