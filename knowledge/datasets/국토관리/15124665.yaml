description_portal: 본 데이터는 공공데이터 제공 신청에 따라 공개하는 연천군 내 기계설비 성능점검 대상 건축물 현황 자료이다. 「기계설비법」에 따른 성능점검 의무 대상 건축물을 중심으로 건축물용도, 건물명, 도로명주소, 우편번호, 건축물 연면적(㎡) 등의 정보를 체계적으로 정리하였다. 이를 통해 관내 건축물의 규모와 용도별 분포를 파악할 수 있으며, 기계설비 유지관리 및 안전 점검 대상 현황을 한눈에 확인할 수 있도록 구성하였다.해당 자료는 건축물의 공조·냉난방·위생설비 등 주요 기계설비의 성능 유지와 안전 확보를 위한 행정 관리의 기초자료로 활용될 수 있다. 또한 건축 관계자와 관리주체는 점검 대상 여부와 건축물 규모를 사전에 확인하여 법정 점검 이행에 참고할 수 있으며, 관련 부서는 정책 수립과 지도·점검 업무의 효율성을 높이는 데 활용할 수 있다.본 공공데이터는 건축물 안전관리의 투명성을 제고하고 군민의 알 권리를 보장하기 위해 공개되었다. 이를 통해 기계설비 성능점검 제도의 안정적 운영을 지원하고, 쾌적하고 안전한 건축물 환경 조성에 기여하고자 한다.
