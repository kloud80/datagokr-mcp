summary_user: 평택항의 연도별 물동량을 총화물량(천톤), 컨테이너 수(천TEU), 자동차 대수(천대), 여객 인원(천명)으로 집계한 연 단위 통계로, 건별 원천이 아닌 항만 단위 집계 자료입니다. 물류 분석가나 정책 담당자가 '평택항의 자동차·컨테이너 처리량이 해마다 어떻게 변했나'처럼 항만 물류·여객 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 집계연도(SUM_YY)를 기준으로 다른 항만 통계나 연도별 경제지표와 이름·연도 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 평택항의 연도별 물동량 집계 현황을 제공합니다. 물동량은 항만을 통해 이동하는 물자의 양을 의미하며, 해당 데이터는 ‘총화물량(천톤)’, ‘컨테이너수(천TEU)’, ‘자동차대수(천대)’, ‘여객인원수(천명)’와 같은 항목을 포함합니다. 이를 통해 평택항의 물류 처리 능력, 수출입 구조, 자동차 물류 중심지로서의 역할, 여객 수송 현황 등을 종합적으로 파악할 수 있습니다. 데이터는 연도별로 제공되므로 시계열 분석을 통해 경기 변동, 물류 수요 변화, 국제 교역량 증가 여부 등을 살펴볼 수 있으며, 항만정책 수립, 물류산업 투자, 교통·해운 계획 마련 등에 활용 가능합니다. 또한 다른 항만(인천항, 부산항 등)과 비교 분석 시 평택항의 위상을 평가하는 근거자료로 활용할 수 있습니다.
