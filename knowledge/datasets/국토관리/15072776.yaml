summary_user: 인천광역시 군·구별 소규모주택정비사업(가로주택정비, 소규모재건축·재개발, 자율주택 등)을 구역 한 건당 한 행으로 담은 CSV 파일(약 15KB)로, 위치·면적·추진단계·조합원 및 토지등소유자 수와 주민합의체 구성, 건축심의, 사업시행계획인가, 관리처분계획인가, 착공 일자를 담는다. 인천에서 집을 사거나 투자를 검토하는 사람이나 정비사업 분석가가 '내가 보는 구역이 지금 조합설립·사업시행인가·관리처분 중 어느 단계까지 왔는가'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 구청 이름이나 구역명·위치(주소) 문자열을 매핑해 다른 정비사업 현황이나 주소 기반 데이터와 이어 쓴다.
description_portal: '1. 목록명 : 인천광역시_소규모주택정비추진현황2. 키워드 : 가로주택, 구역, 정비사업, 소규모재건축, 소규모재개발, 자율주택3. 데이터 설명인천광역시의 소규모주택정비추진현황 데이터는 노후·불량 주택이 밀집된 지역의 주거환경을 개선하고 도시재생을 촉진하기 위한 정비사업의 추진 현황을 담고 있습니다. 이 데이터는 군구별 사업유형(예: 가로주택정비사업, 소규모재건축 등), 구역명, 위치, 면적, 추진단계, 조합원 수, 토지 등 소유자 수, 주민합의체 구성일, 건축심의일, 사업시행계획인가일, 관리처분계획인가일, 착공일 등 다양한 정보를 포함하고 있습니다 . 이를 통해 각 정비사업의 진행 상황을 한눈에 파악할 수 있으며, 도시계획 수립, 정책 분석, 부동산 개발 등 다양한 분야에서 활용될 수 있습니다. 데이터는 매월 업데이트되며, 공공데이터포털에서 CSV 형식으로 다운로드 할 수 있습니다.'
