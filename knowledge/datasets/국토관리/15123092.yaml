description_portal: 사회의 균형 있는 발전과 나아가 국민 삶의 질 향상을 위해 지역 내 유사·중복 시설이 없는 사각 지역에 생활SOC 복합화 사업을 진행하도록 유도하고 있다. 따라서 지자체 별 적정한 입지 후보(유사한 사업이 중복되지 않는 사각 지역)를 도출할 수 있도록 구축한 표준분석모델을 소개하고, 각 요소에 대한 개념 설명 및 핵심 과정 도식화를 통해 모델을 이해하고 사용할 수 있게 지원하는 데에 목적을 두고 있다.체육시설군은 운동에 필요한 물적인 조건을 갖춘 스포츠센터 및 부대시설을 설립할 구역을 뜻한다. 체력 증진 및 여가 선용 등 생활체육의 목적을 효율적으로 달성할 수 있도록 환경을 조성하고, 안전하고 쾌적하게 이용할 수 있도록 관리하여 이용 주민의 삶의 질을 향상시키는 등 사회 복지적 의의가 있다. 아무리 좋은 기구를 갖춘 체육 시설이라 해도 생활권 내에 위치해 있지 않으면 이용 빈도가 하락하여 효율이 낮다. 빅데이터를 통한 입지 선정으로 적정 위치에 적절한 규모로 설치하도록 하여 진정한 주민체육활동에 기여할 수 있도록 한다.시설별 거리와 연면적을 통해 유인력을 도출하고 인구밀도와 중첩하여 수요도를 도출.
