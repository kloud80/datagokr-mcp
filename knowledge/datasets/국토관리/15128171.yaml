summary_user: 청약홈에 공고된 오피스텔·도시형생활주택·민간임대·생활숙박시설의 분양 정보를 공고별 주택형(모델·타입) 단위로 담은 파일이며, 전용면적·공급세대수·공급금액·청약신청금을 함께 담는다(전국 범위, CSV 약 169KB). 청약 대기자나 분석가가 "이 오피스텔 공고의 타입별 분양가와 공급세대수는 얼마인가"를 확인하거나 면적당 분양가를 비교하는 데 쓴다. 전역 조인 키는 없고, 같은 기관 청약홈 데이터와는 주택관리번호·공고번호로 공고 단위 매칭을 해 이어 쓴다.
