summary_user: 경기도 내 공중화장실을 한 곳씩 담은 건별 현황 데이터로, 화장실마다 도로명·지번 주소와 위경도, 남녀공용 여부, 남녀·장애인·어린이용 대변기와 소변기 수, 관리기관과 연락처, 개방시간, 설치연월, 비상벨과 기저귀교환대 설치 여부를 기록한다. 시민이 "근처에 비상벨이나 장애인용 변기가 있는 공중화장실은 어디인가"를 찾거나, 분석가가 시군별 안전설비·편의설비 설치 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 주소나 위경도(REFINE_WGS84_LAT·LOGT), 관리기관명을 이름으로 맞추어 연결한다.
description_portal: 이 데이터는 경기도 내에 설치된 공중화장실의 현황 정보를 제공합니다. 각 화장실의 위치정보(소재지도로명주소, 지번주소, 경도, 위도), 남녀 구분 및 남녀공용 여부, 남성용 대변기·소변기, 여성용 대변기, 장애인용 및 어린이용 변기 수, 관리기관명, 설치연월, 오물처리방식, 비상벨 설치여부, 기저귀교환대 설치여부 등 상세한 정보를 포함합니다. 이 데이터를 활용하여 도시계획, 공공시설 관리, 장애인 및 영유아 동반 이용자 편의시설 확충, 안전설비 구축 등에 활용할 수 있습니다. 또한 시민의 공중화장실 접근성을 향상시키고, 안전하고 위생적인 공공환경 조성에 기여할 수 있는 기초자료로 활용됩니다.
