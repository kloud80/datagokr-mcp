summary_user: 연속수치지형도의 건물 공간정보와 세움터 건축물대장 속성(건물명·지상/지하 층수·건축면적·연면적·높이·구조·용도·건폐율·용적률·사용승인일 등)을 건물 단위로 합친 전국 범위 GIS 데이터로, 시도별 SHP 파일로 제공된다. 분석가나 사업자가 특정 지역 건물들의 위치와 노후도·규모·용도를 지도 위에서 한꺼번에 보려 할 때, 예를 들어 '이 구역에서 사용승인 30년이 넘은 건물은 어디에 몰려 있나'를 따질 때 쓴다. 필지고유번호(PNU)로 토지대장·공시지가 등 필지 단위 데이터와 잇고, 건축물대장 키(BLDRGST_PK)·건물관리번호(BD_MGT_SN)도 들어 있어 건축물대장 표제부 등과 맞춰 볼 여지가 있다.
description_portal: 각 지방자치단체에서 구축되어 국토교통부를 통해 취합되어 제공되는 자료연속수치지형도(수치지형도2.0의 건물레이어)의 건물공간정보와 건축행정시스템(세움터)의 건축물대장 속성정보를 건물단위로 통합하여 구축한 공간(토지)기반의 건물통합정보
