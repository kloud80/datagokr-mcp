summary_user: 전북특별자치도 각 시군에서 열리는 정기시장(5일장)의 시군명·시장명·소재지 주소를 시장 한 곳당 한 행으로 담은 작은 목록 파일(CSV 약 1.4KB)이다. 여행객이나 주민이 '이 시군에는 어떤 5일장이 있고 어디서 열리나'를 찾거나, 분석가가 도내 정기시장 분포를 훑어볼 때 쓴다. 공통 조인 키는 없어 다른 시장·상권 데이터와는 시군명이나 주소 문자열을 맞춰서 연결해야 한다.
description_portal: 전북특별자치도 내 각 시군에서 정기적으로 열리는 '5일장(정기시장)'의 현황을 정리한 데이터입니다. 이 자료는 특정 날짜에만 열리는 전통적인 시골 장터의 명칭과 상세 주소 정보를 포함하고 있어, 지역 고유의 문화와 정취를 느끼고 싶은 관광객이나 신선한 현지 농산물을 구매하려는 소비자에게 유용한 정보를 제공합니다. 이 데이터는 대형마트와는 다른 매력을 가진 지역 상권의 중요한 축인 정기시장의 현황을 보여주며, 이를 통해 지역 경제 활성화 및 전통시장 지원 정책을 수립하는 데 기초 자료로 활용될 수 있습니다.
