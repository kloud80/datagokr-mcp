description_portal: '경상남도 거창군의  2018년 ~ 2023년 까지의 미준공 신축 건축물에 대한 데이터로 허가일, 착공일, 준공일, 대지위치, 연면적, 지상층수, 지하층수, 주용도, 부속용도, 총주차대수, 세대수, 가구수, 공사명(사업계획명), 시행사사무소명, 시공사사무소명 정보를 제공합니다.○ 데이터 기준일 : 2023. 08. 31. (일회성 데이터)○ 미준공 신축 건축물이란 건축 공사가 완료되지 않아 아직 사용승인(준공검사)을 받지 못한 상태의 건축물을 말합니다. 이러한 건물은 외형상 거의 완공된 것처럼 보일 수 있으나, 법적으로는 건축물로 인정받지 못한 상태이기 때문에 소유권 이전 등기나 입주가 불가능합니다. 주로 분양 단계에서 계약이 이루어지며, 향후 준공 후 사용승인을 받아야만 정식 건축물로 등록되고 법적 권리 행사가 가능합니다.'
