summary_user: 관악구 관내 민간 공사장의 신축·증축·대수선 등 건축 행위를 건별로 담은 파일로, 건축구분·대지위치·대지/건축면적·지상/지하 최대층수·허가신고일·착공처리일·주용도와 부속용도를 필지·건물 단위로 싣는다. 주민이나 분석가가 "우리 동네에 어떤 용도의 건물이 얼마나 지어지고 있고, 허가에서 착공까지 얼마나 걸리나"를 확인하거나, 오피스텔·도시형생활주택 공급 동향과 개발밀도를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)를 주소·지번 매핑으로 바꾸거나 같은 관악구 자료와 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 관악구 민간 공사장의 허가·신축·증축·대수선 등 주요 건축 행위 현황을 정리한 자료입니다.본 데이터는 건축구분, 대지위치, 대지·건축면적, 지상·지하층수, 허가·착공 일자, 주용도와 부속용도, 데이터기준일의 항목을 포함합니다.이 자료는 관내에서 이루어지는 다양한 민간 건축사업의 규모와 성격을 파악하는 데 활용됩니다. 특히 근린생활시설·단독주택·공동주택·업무시설 등 건축 목적별 동향 분석, 도시형생활주택 및 오피스텔 공급 추세 파악, 대지면적 대비 건축면적 및 층수 분석을 통한 지역 내 개발밀도 검토, 허가 이후 착공까지의 행정 진행 속도 점검, 증축·대수선 등 기존 건축물 활용 흐름 분석 등 도시계획 및 건축행정 업무 전반에 참고자료로 사용됩니다.또한 민간 개발이 집중되는 지역을 선별하거나, 향후 기반시설 수요 예측, 교통·환경영향 검토 등의 정책적 판단에도 유용하게 활용할 수 있는 기초 데이터입니다.
