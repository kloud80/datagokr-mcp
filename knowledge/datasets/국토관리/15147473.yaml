summary_user: 국토교통부가 지방자치단체에서 취합한 국토계획법상 도시계획정보 가운데 보행자우선도로 현황을 시도별 파일(XLSX)로 담으며, 범위는 전국입니다. 분석가나 사업자가 '우리 지역에 보행자우선도로로 지정된 구간이 어디인가'를 확인하거나, 도시·군관리계획 결정 현황을 개발 가능성의 선행 지표로 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 도시계획·용도지역 데이터와는 지역 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 포털 활용신청과 별개로 vworld.kr에 로그인해 시도별 파일을 내려받아야 하며 API 호출 방식이 아니다. 명세상 갱신은 수시·이벤트 주기이고, 공개된 필드 정의가 '테이블정의서'와 이름 없는 열로만 되어 있어 컬럼 의미를 파일에서 직접 확인해야 한다. 공통 조인 키가 없어 다른 데이터와의 결합은 이름·코드 매핑에 의존한다.
