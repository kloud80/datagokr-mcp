summary_user: 대전광역시 서구에 등록된 공장을 한 줄에 한 곳씩 담은 시군구 단위 명부로, 회사명·도로명 대표주소·업종명·전화번호·종업원 수·생산품을 담는다(csv 약 28KB). 서구에서 특정 업종이나 생산품을 다루는 제조 공장이 어디에 몇 곳 있고 규모가 어느 정도인지 알아보려는 사업자·분석가가 쓴다. 사업자번호나 표준산업분류 코드, 필지번호 같은 전역 조인 키가 없어서, 다른 데이터와는 회사명·도로명 주소를 맞춰 보거나 팩토리온 공장등록 정보와 이름으로 대조해 이어 쓴다.
description_portal: ○ 대전광역시 서구에 등록된 공장 현황 데이터입니다.○ 해당 데이터에는 공장명(회사명), 공장 대표주소(도로명 주소), 업종명과 공장 전화번호, 종업원 수와 해당 공장에서 생산하는 생산품목에 대한 데이터를 제공하고 있습니다.○ 데이터 업데이트일 기준 등록된 전체 공장에 대한 정보를 포함하고 있으나, 이용하는 날짜에 따라 변경, 신규 등록, 폐업에 대한 정보가 현재 최신의 정보가 아닐 수 있습니다. 데이터에 대한 추가 문의 또는 최신 데이터에 대한 문의가 있으시면 담당부서(대전광역시 서구 전략사업과)에 문의하시기 바랍니다.
