summary_user: 부산 북구 관내 행복마을 거점공간과 주민 커뮤니티 공간을 한 곳당 한 행으로 담은 소규모 파일(csv 526바이트)로, 구분·명칭·위치·대지면적·건물연면적·주요시설·개관시기와 위도·경도를 담는다. 북구 주민이나 지역 활동가가 "우리 동네 가까운 마을 커뮤니티 공간은 어디이고 어떤 시설이 있나"를 확인하거나, 분석가가 커뮤니티 공간 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위도·경도나 주소(위치)를 기준으로 공간 결합하거나 명칭으로 맞춰 이어 쓴다.
description_portal: 부산광역시 북구_행복마을 현황 데이터는 부산광역시 북구 관내에 위치한 행복마을 거점공간과 주민 커뮤니티 공간의 현황을 상세히 제공하는 자료입니다. 각 공간의 위치, 주요 시설, 개관 시기 등의 정보를 포함하고 있어 지역 주민들이 이용할 수 있는 커뮤니티 자원의 분포와 특성을 한눈에 파악할 수 있습니다. 이 데이터는 지역사회 활성화와 주민 참여를 촉진하기 위한 기반 자료로 활용되며, 주민들의 소통과 교류를 지원하는 공간들의 현황을 체계적으로 관리하는 데 도움을 줍니다. 또한, 향후 공간 운영 및 개발 계획 수립 시 중요한 참고자료로 활용될 수 있습니다.
