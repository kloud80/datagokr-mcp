summary_user: 한국산업기술시험원이 2024년 8~9월 식물공장 컨테이너 2개 동에서 측정한 유효전력량(실제 소비 전력량)을 측정일시별로 담은 건별 계측 파일로, 동별 전체값과 에어컨·공조기·양액기·조명·LED 등 설비별 값이 함께 들어 있다(CSV 약 41.7MB). 스마트팜 연구자나 운영자가 '컨테이너형 식물공장에서 LED와 냉방 설비가 전체 전력 소비의 몇 %를 차지하고 하루 중 언제 몰리는가'를 분석해 에너지 비용 절감·전력 수요 예측 모델을 만드는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와 직접 결합되지 않으며, 기상 자료 등과 이을 때는 측정일 시각을 기준으로 맞춰야 한다.
description_portal: 본 데이터는 한국산업기술시험원이 2024년 8월부터 9월까지 식물공장에서 수집한 유효전력량(Active Energy) 정보입니다. 유효전력량은 일정 시간 동안 실제로 소비된 전기의 양을 의미하며, 한국전력공사(한전)의 전기요금 산정 시 기준이 되는 전력사용량과 동일합니다. 본 데이터는 식물공장 내 온실 설비의 전력 소비량을 정량적으로 분석하고, 효율적인 에너지 사용 전략을 수립하는 데 중요한 기초자료로 활용될 수 있습니다. 또한 대기전력 절감 모델 개발, 에너지 비용 최적화 방안 마련, 스마트팜 전력 수요 예측 및 전력 사용 패턴 분석 등 다양한 연구와 산업적 목적에 적용될 수 있습니다. 특히, 온실 설비의 에너지 효율 진단과 함께, 지속 가능한 농업을 위한 에너지 절약형 운영 모델 개발에 실질적인 도움을 줄 수 있는 공공데이터입니다.* 원천 데이터 생산이 중단됨에 따라 기존 연간 단위로 수행되던 데이터 업데이트가 수시 업데이트 체계로 전환되었습니다.
