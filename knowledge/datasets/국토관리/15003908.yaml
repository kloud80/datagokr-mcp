summary_user: 한국국토정보공사 전국 지역본부·지사별 주소정보 안내소의 본부명·지사명·주소·우편번호·전화번호를 기관 단위 목록으로 담은 CSV 파일(약 20KB)이다. 도로명주소 관련 민원으로 방문하거나 문의하려는 국민이 '우리 지역 담당 지사는 어디이고 전화번호는 무엇인가'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소 문자열이나 본부·지사 이름으로 매핑해 연결해야 한다.
description_portal: 주소정보 안내소 데이터는 국민 누구나 도로명주소를 쉽고 편리하게 이용할 수 있도록 지원하는 공공 인프라 정보입니다. 한국국토정보공사는 행정안전부로부터 위탁받아 분기별 1회 시군구·읍면동·통리 단위의 전국 주소정보 안내도를 제작하고, 주소정보활용지원센터 누리집을 통해 이를 공개·제공하고 있습니다.본 데이터에는 전국 지역본부 및 지사의 위치·연락처 정보가 포함되어 있어, 주소 관련 민원 방문 또는 문의 시 즉시 활용할 수 있습니다. 도로명주소는 긴급 구조·재난 대응 시 정확한 위치 파악을 위한 핵심 인프라로, 스마트시티·디지털트윈·위치기반서비스(LBS) 등 다양한 공간정보 서비스의 기반 데이터로 활용됩니다. 정확한 주소 체계는 택배·물류, 내비게이션, 공공행정 서비스의 품질을 좌우하는 생활밀착형 공공데이터입니다.주소정보 관련 세부 문의는 주소정보활용지원센터로 연락하시기 바랍니다.
