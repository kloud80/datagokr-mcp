summary_user: 대전광역시가 추진한 도시 취약지역 생활여건 개조(새뜰마을) 사업을 사업지구별로 연도·선정지역·사업명·사업내용·사업기간·비고로 정리한 494바이트짜리 소규모 CSV 파일로, 포털 설명상 2015년 대덕구 장동 욕골지구와 2019년 동구 정동 사업이 담겨 있다. 지역 정책 담당자나 연구자가 '대전에서 새뜰마을사업이 어느 지구에서 언제 진행됐고, 어떤 사업이 왜 중단됐는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 선정지역의 구·동 이름을 매핑하거나 같은 기관(대전광역시) 자료끼리만 이어 쓴다.
description_portal: 대전광역시 도시 취약지역 생활여건 개조사업 현황 자료는 대전시 내 취약지역 주민들의 기본적인 생활수준 보장을 위해 추진된 다양한 사업의 현황을 담고 있습니다. 해당 자료에는 안전과 위생 등 생활 인프라 확충, 주거환경 개선, 주민 역량 강화 등 다양한 지원 내역이 포함되어 있습니다. 특히, 국비와 지방비가 70:30 비율로 매칭되어 추진되는 국비지원 사업의 구조와 예산 배분 방식, 그리고 실제로 선정되어 진행된 사업지구별 세부 내용이 상세히 기록되어 있습니다. 2015년 선정된 대덕구 장동 욕골지구 새뜰마을사업의 추진기간 및 주요 개선사항, 2019년 선정된 동구 정동 새뜰마을사업의 추진 경과와 중단 사유 등도 확인할 수 있습니다. 이 데이터는 도시 내 취약지역의 생활환경 개선 현황을 파악하고, 향후 유사사업의 기획 및 정책 수립, 지역 간 균형발전 전략 마련 등에 매우 유용하게 활용될 수 있습니다.
