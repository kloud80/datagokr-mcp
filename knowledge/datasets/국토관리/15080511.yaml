summary_user: 광주 광산구 일반건축물의 지방세 부과기준인 시가표준액을 물건지(주소)별로 담은 건별 파일로, 납부년도·연면적(제곱미터)·결정일자가 함께 들어 있고 범위는 광산구 한 시군구의 필지·건물 단위다. 광산구에 건물을 가진 소유자나 세무·자산 평가 담당자가 특정 건물의 과세 기준 금액이 연도별로 얼마로 결정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장·공시지가 등과는 물건지 주소 문자열 매칭이나 자치단체코드(같은 기관 코드)로만 이어 쓴다.
description_portal: 광주광역시 광산구의 일반건축물에 대한 지방세 부과기준인 시가표준액을 물건지 및 금액으로 제공하는 자료입니다.일반건축물에 대한 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 연면적, 기준일자, 시가표준액 등의 정보는 건축물 및 부동산 관련 행정 업무나 등기, 세금 부과, 자산 평가 등에 사용되는 데이터입니다. 법정동과 법정리는 행정구역을 구분하는 기본 단위로, 건축물이 위치한 지역을 명확히 식별할 수 있게 해 줍니다. 특수지는 토지 이용 목적이나 지형적 특성을 반영하는 항목이며, 본번과 부번, 동, 호는 건축물 내 세부 위치를 나타내는 상세 주소 체계입니다. 물건지는 건축물이나 토지의 고유 식별 정보로, 연면적은 건축물의 총 바닥 면적을 의미합니다. 기준일자는 해당 정보가 유효한 시점을 나타내며, 시가표준액은 과세나 평가 기준이 되는 표준 시가를 의미합니다. 이 모든 정보는 부동산 거래, 평가, 관리, 세무처리 등 다양한 분야에서 활용됩니다.(물건지, 시가표준금액, 연면적, 결정일자 등 포함되어 있음)
