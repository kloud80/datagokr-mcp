summary_user: 경기도 양주시 관내에 등록된 정화조 청소업체를 업체 한 곳당 한 행으로 담은 소규모 목록 파일(csv 499바이트)로, 상호·사업장 전화번호·도로명/지번 주소·관리기관명·데이터 기준일자가 들어 있다. 양주시 주민이 "우리 지역에 등록된 정화조 청소업체는 어디이고 연락처는 무엇인가"를 확인하거나, 행정·분석가가 관내 업체 분포를 파악할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호명이나 주소 문자열 매칭, 또는 같은 기관(양주시) 기준으로만 이어 쓴다.
limits: 양주시 한 시군구만 다루므로 다른 지역 업체나 전국 현황은 이 파일로 알 수 없다. 업체 코드·사업자번호 같은 공통 키가 없어 다른 데이터와 연계할 때는 주소·상호 매칭에 의존해야 한다.
