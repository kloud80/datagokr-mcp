summary_user: 경기도 시군별 카드매출을 기준년월마다 시간대 구간별로 묶은 집계 자료로, 시간대별 매출 총액(sls_amt)과 그 시간대가 전체 매출에서 차지하는 비율을 담는다. 지역 상권 분석가나 창업 예정자가 "우리 시는 몇 시대에 카드 소비가 가장 몰리는가"를 확인하고 시군 간 소비 시간 패턴을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군코드(sigun_cd)를 이름·코드 매핑으로 바꾸거나 같은 기관의 다른 분석시스템 집계와 시군코드·기준년월로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 각 시군에서 발생한 카드매출을 시간대별로 집계한 자료로, 기준년월을 기준으로 시군코드와 시간대코드(TZ10 등), 매출금액 및 매출금액비율로 구성되어 있습니다. 시간대코드는 특정 시간 구간을 나타내는 코드입니다. 시군코드는 행정 단위별 구분을 위한 코드로, 지역별 소비 차이를 확인하는 데 활용됩니다. 매출금액은 해당 시간대에 발생한 카드매출 총액을 나타내며, 매출금액비율은 전체 매출 중 해당 시간대의 비중을 백분율로 나타냅니다. 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.
