summary_user: 인천광역시 영종구(포털 설명상 옛 중구 관할) 정화조 청소업체를 업체 한 곳당 한 줄로 업체명·전화번호·소재지·데이터기준일을 담은 목록이며, 파일 크기는 465바이트 CSV로 몇 개 업체 수준의 소규모 현황이다. 주민이나 건물 관리자가 '우리 건물 정화조 정기 청소를 맡길 지역 업체가 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 주소를 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 인천광역시 중구 정화조 청소업체에 관한 정보입니다.개인하수처리시설의 청소 및 유지관리는 「하수도법 시행규칙」 제33조 제1항에 따라 연 1회 이상 실시해야 합니다. 해당 규정에 따르면, 오수처리시설 및 정화조는 그 기능이 정상적으로 유지될 수 있도록 내부청소를 해야 하며, 침전 찌꺼기와 부유물질을 제거하고 여재를 깨끗한 물로 세척해야 합니다. 특히 1일 처리용량이 50세제곱미터 이상인 시설은 연 1회ㅣ 이상 청소가 필수이며, 관광숙박업, 식품접객업, 숙박업 등 특정 업종에 설치된 정화조는 6개월마다 1회 이상 청소해야 합니다. 이를 위반할 경우 과태료가 부과될 수 있으며, 방류수 수질기준을 초과하거나 시설을 비정상적으로 운영할 경우에는 벌금 또는 징역형에 처해질 수 있습니다.
