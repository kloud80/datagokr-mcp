summary_user: 전북특별자치도 안에 조성됐거나 조성 중인 국가·일반·도시첨단·농공단지를 단지 한 곳당 한 행으로 정리한 현황표로, 단지 유형(구분), 시군, 단지명, 조성 상태, 관리 면적, 입주업체 수를 담는다(CSV 약 3.5KB 규모). 공장 부지를 찾는 기업이나 지역 산업 구조를 보는 분석가가 '전북 어느 시군에 어떤 산업단지가 있고 입주업체는 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키(산업단지코드 등)가 없어 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황과는 단지명·시군명을 맞춰 이어 써야 한다.
description_portal: 전북특별자치도 내에 조성되었거나 조성 중인 국가, 일반, 도시첨단 및 농공단지의 현황을 정리한 데이터입니다. 이 자료는 각 산업단지의 유형과 명칭, 위치, 그리고 조성 완료 또는 조성 중 등 사업의 진행 상태를 상세히 보여줍니다. 또한, 각 단지의 총 관리 면적과 현재 입주해 있는 업체 수를 포함하고 있어, 지역별 산업 인프라의 규모와 가동 현황을 한눈에 파악할 수 있습니다. 이 데이터는 공장 부지를 찾고 있는 기업이나 투자자에게 중요한 정보를 제공하며, 지역의 산업 구조를 분석하고 경제 개발 계획을 수립하는 데 필수적인 기초 자료입니다.
