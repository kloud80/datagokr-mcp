summary_user: 경상남도와 시군의 토지거래 필지수·면적을 행정동코드 단위로 집계한 파일로, 출처는 통계청이며 경남빅데이터허브플랫폼에서 정제해 제공한다. 분석가가 경남의 어느 시군·읍면동에서 토지거래가 많았는지 비교하는 데 쓴다. 행정동코드와 시도·시군구·읍면동명, 생성·말소일자 필드가 있으나 전역 조인 키로는 확인되지 않아, 다른 데이터와는 행정동 이름·코드 매핑으로만 연결한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 토지거래  데이터는 경남빅데이터허브플랫폼 DB 내에서 관리하고있는 경상남도 및 시군의 토지거래에 대한 정보입니다. 출처는 통계청이며 정제하여 플랫폼에 제공하고 있습니다.(데이터 구성 및 세부항목) 토지거래 데이터는 행정동코드, 데이터기준일, 토지거래필지수, 토지거래면적으로 구성됩니다. 행정동코드에 대한 설명은 코드북을 활용하여 주시기 바랍니다.(데이터 현행화 시기) 해당 데이터는  1회성 데이터며 현행화 하지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼-데이터분석-경남도정현황을 참고하여 주시기 바랍니다.
