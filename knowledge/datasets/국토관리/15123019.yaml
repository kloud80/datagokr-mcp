summary_user: 지적재조사 사업지구별로 유관기관 연계를 통해 요청한 필지 수와 토지소유자정보·토지현황조사·건축물·토지이용 등 항목별 연계 건수를 담은 집계 파일이며, 전국을 시군구 단위로 다룬다. 지적재조사 실시계획을 세우거나 점검하는 담당자·분석가가 '어느 시군구의 어느 사업지구에서 기초조사용 연계 자료가 얼마나 요청·구축됐는가'를 확인하는 데 쓴다. 실측 컬럼에 필지고유번호(PNU) 같은 전역 조인 키는 없어, 시군구코드나 시군구명·사업지구명을 매핑해 같은 기관의 지적·건축물 데이터와 연결한다.
description_portal: 지적재조사 실시계획 수립을 위한 사업지구 및 필지에 대한 위치와 면적, 건축물, 용도별 분포, 토지 소유현황, 개별공시지가 현황, 토지 이용현황 등이 조사 되어야 하며,지적재조사에 대한 기초조사는 공간정보 및 국토정보화사업의 추진에 따라 토지이용, 건축물 등에 대한 전산화된 자료와 각종 문헌이나 통계자료를 충분히 활용합니다.해당 정보는 지적도 및 지형도, 건축물대장, 토지이용계획자료, 토지(임야)대장, 지가자료 등을 보유한 유관기관과의 연계기능을 통해 데이터를 구축합니다.지적재조사 사업지구별 요청필지, 항목 건수에 관한 데이터 파일입니다.
