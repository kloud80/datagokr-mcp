description_portal: 대구광역시 상수도사업본부에서 부과하는 수시분(중간정산, 폐전수시분 등)에 대해 2020년 1월부터 2024년 12월까지 발행된 가상계좌 건수를 은행별, 월별로 집계한 내역입니다. 참고로 대구광역시 상수도사업본부에서는 이사, 주택 매매 등으로 인해 수도요금의 중간 정산이 필요한 경우, 온라인을 통해 간편하게 신청할 수 있는 서비스를 제공하고 있습니다. 수도요금 중간정산은 이사나 부동산 매매 등으로 인해 수도 사용자가 변경될 때, 최종 검침일부터 이사 시점까지의 사용량을 기준으로 요금을 일할 계산하여 정산하는 제도입니다. 이는 기존 사용자와 신규 사용자 간의 요금 정산을 명확히 하여 불필요한 분쟁을 예방하는 데 도움이 됩니다.
