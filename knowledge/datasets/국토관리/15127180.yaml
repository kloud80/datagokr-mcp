summary_user: 경기도 고양시에서 연면적 2000㎡ 이상으로 건축허가를 받은 건축물 중 2024년 1월 이후 착공신고가 처리된 건을 한 건씩 담은 원천 목록으로, 설계사무소명·시공사명·착공 용도와 착공 신고지의 도로명·지번 주소, WGS84 위도·경도를 포함한다. 건축 분야 사업자나 지역 분석가가 고양시에서 어느 설계사무소·시공사가 어떤 용도의 대형 건축물을 어디에 착공했는지 살펴, 지역 개발 흐름의 선행 지표로 볼 때 쓴다. 전역 조인 키는 없어서 주소 문자열이나 위도·경도 좌표를 기준으로 건축물대장·인허가 자료나 지도 데이터와 맞춰 이어 써야 한다.
description_portal: 경기도 고양시 관내에 연면적 2000㎡이상인 건축물에 대해 건축 허가가 처리된 건 중 2024년 1월부터 현재까지의 착공신고 처리 현황 데이터로 시군명, 설계사무소명, 신고일, 착공 신고지 도로명주소, 착공 신고지 지번주소, 시공자명, 착공용도, 위도, 경도 등의 항목으로 구성되어 있습니다. 건축물의 용도는 제1종 및 2종 근린생활시설, 종교시설, 공동주택, 판매시설 문화 및 집회시설, 교육연구시설, 창고시설, 공장,노유자시설, 방송통신시설, 자동차관련시설, 의료시설, 등으로 구성되어 있으며 이는 건축행정, 지역기반 시설 수요 분석 등 다양한 분야에서 활용 가능한 자료입니다.
