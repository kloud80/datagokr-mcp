summary_user: 전북특별자치도에서 운영되는 로컬푸드 체험학습장을 생산자(농장·마을)별로 한 줄씩 정리한 목록으로, 체험 프로그램·연락처·체험 가능 시기를 담은 소규모 CSV 파일(544바이트)이다. 가족이나 학교가 "이번 달에 전북에서 수확이나 두부·쌀빵 만들기 체험을 할 수 있는 농장이 어디고 어디로 연락하면 되나"를 찾을 때 쓴다. 지역 코드나 주소 같은 전역 조인 키가 없어 다른 데이터와는 생산자(마을명)를 이름으로 맞추는 방식으로만 이어 쓸 수 있다.
description_portal: 전북특별자치도 내에서 운영되는 로컬푸드 관련 체험학습장의 현황을 정리한 데이터입니다. 이 자료는 완주, 김제 등지에 위치한 농장과 마을에서 제공하는 다채로운 체험 프로그램의 목록을 담고 있으며, 참나물 수확과 같은 농작물 수확 체험부터 쌀빵이나 두부를 직접 만들어보는 음식 만들기 체험까지 포함하고 있습니다. 각 체험장의 연락처와 체험 가능 시기 정보가 함께 제공되어, 가족 단위 방문객이나 학생들이 우리 지역 농산물을 직접 만지고 맛보며 농업의 가치를 배우는 유익한 나들이를 계획하는 데 도움을 줍니다.
