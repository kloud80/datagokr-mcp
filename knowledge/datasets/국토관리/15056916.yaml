summary_user: "경기도 광교테크노밸리에 입주한 업체를 한 건씩 담은 명단으로, 관리기관명(예: 한국나노기술원)·업체명·임대면적(㎡)을 담는다. 구직자나 영업 담당자가 '광교테크노밸리 안 어느 관리기관 건물에 어떤 기업이 얼마만큼의 공간을 쓰고 있나'를 확인하거나, 분석가가 기관별 기업 유치 규모를 비교하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 공장 등록이나 다른 입주기업 데이터와는 업체명을 직접 맞추는 방식으로만 이어 쓴다."
description_portal: 경기도가 광교에 조성한 광교테크노벨리(IT, BT, CT, NT가 융합된 차세대 첨단산업의 허브로 다수의 국내기업과 외국투자기업이 입주하고 있으며, 아주대, 경희대, 서울대 등의 대학연구소가 있는 세계적인 과학기술의 중심지)에 입주한 입주업체의 현황입니다. 관리기관명, 업체명, 임대면적 등의 정보를 제공합니다.이 데이터는 경기도 광교테크노벨리 내에 입주한 각 업체의 현황을 정리한 자료입니다. 주요 항목은 관리기관명, 업체명, 임대면적(㎡)으로 구성되어 있으며, 예를 들어 한국나노기술원 소속의 다양한 기업이 실제 사용 중인 공간 면적 정보를 확인할 수 있습니다. 이를 통해 각 기업의 입주 규모, 산업공간 활용 현황, 기관별 기업 유치 현황 등을 분석할 수 있으며, 나노기술과 같은 첨단 산업 중심지로서의 광교테크노벨리의 기능과 입지 특성을 이해하는 데에도 활용 가능합니다. 지역산업정책, 연구기관의 기업 지원 전략 수립, 공간 자원 배분 등의 자료로도 유용하게 사용될 수 있습니다.
