summary_user: 충청남도 당진시 관내 건축물대장을 건물·층·호 단위로 담은 파일로, 대지위치·도로명주소·건물명·동명칭, 주용도와 구조, 건축면적·대지면적·연면적, 허가일·착공일·사용승인일, 지상·지하 층수와 층별 용도까지 들어 있다. 당진시의 특정 주소에 있는 건물이 언제 사용승인을 받았고 어떤 용도·구조인지 확인하거나, 지역 내 건물의 노후도와 용도 분포를 분석하려는 사람이 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 주소(대지위치·도로명주소)나 이름을 매핑하는 방식으로만 이어 쓴다.
limits: 범위는 당진시 한 곳(시군구)이라 다른 지역이나 전국 비교에는 다른 시군구 파일을 따로 모아야 한다. 고유번호를 포함해 표준 조인 키가 확인되지 않아, 공시지가·인허가 등 다른 국토 데이터와 연결하려면 주소 정규화 같은 매핑 작업이 필요하다.
