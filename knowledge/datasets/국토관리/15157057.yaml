summary_user: 사회복지시설의 면적과 주변 인구 등을 공간분석해 시설 확충이 필요한 지역을 도출한 '10분동네 프로젝트' 정책지도 결과를 전국 범위로 담으며, 브이월드(vworld.kr)에서 시도별 엑셀 파일로 내려받는다. 지자체·도시계획 분석가가 '우리 시도에서 생활권 안에 복지시설이 부족해 우선 확충해야 할 지역은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역 이름·코드를 직접 매핑해야 이어 쓸 수 있다.
limits: 내려받으려면 브이월드에 로그인해야 하며 인증키 방식이 아니고 공공데이터포털 활용신청과도 별개다. 공통 조인 키가 없어 행정구역 통계 등과 붙이려면 이름·코드 매핑 작업이 필요하다.
