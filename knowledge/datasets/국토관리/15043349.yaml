summary_user: 경기도 이천시에 등록된 반려동물을 읍면동 단위로 집계한 파일로, 등록 동물 수를 등록 주체(시군구·대행업체·기타)와 등록 방식(내장형·외장형 칩, 인식표)별로 나누고 품종 수, 소유자 수, 소유자 1인당 마리 수, 동별 등록 대행업체 수를 담는다. 지자체 담당자나 분석가가 "이천시 어느 읍면동에서 반려동물 등록이 많고, 내장형 칩 비율이나 대행업체 의존도가 어떤가"를 확인해 유기동물 예방·반려동물 복지 정책을 세우는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명·읍면동명(읍면동명) 이름을 맞춰 연결해야 하며, 같은 기관의 다른 읍면동 통계와 이어 쓰는 방식이 현실적이다.
description_portal: 이 데이터는 경기도 이천시에 등록된 반려동물 현황을 집계한 자료로, 시군구 등록, 대행업체 등록, 기타 등록 구분에 따른 총 반려동물 수 및 등록 방식별 정보(RFID 내장형, 외장형, 인식표)를 포함합니다. 또한 등록 동물의 품종 수, 소유자 수, 1인당 등록 마리 수, 등록 대행업체 수 등의 항목으로 구성되어 있으며, 동물등록제도 운영 현황을 파악하는 데 유용합니다. 해당 데이터는 지자체의 유기동물 예방정책 수립, 반려동물 복지 서비스 제공, 동물병원 지정 평가, 반려동물 보호 문화 정착을 위한 기반 자료로 활용됩니다.
