summary_user: 비무장지대(DMZ)와 그 인접 지역의 영화관을 한 곳당 한 행으로 담은 건별 목록으로, 이름·주소·전화번호·위도·경도를 담는다(포털 설명 기준 91건, CSV 약 13KB). 접경지역을 찾는 방문객이나 관광 안내·지역 소개 자료를 만드는 담당자가 "이 접경 지역 근처에 영화관이 어디 있고 연락처는 무엇인가"를 확인하는 데 쓴다. 법정동코드(bjd_cd)가 조인 키로 확인돼 같은 코드를 가진 행정구역·인구·관광 데이터와 이어 쓰고, 좌표로 지도 서비스나 다른 DMZ 인근 시설 데이터와 겹쳐 본다.
description_portal: '통일부에서 제공하는 ‘통일부_DMZ 인근 지역 영화관 정보 데이터’는 비무장지대(DMZ) 및 그 인접 지역에 위치한 영화관에 대한 상세 정보를 정리한 공공데이터입니다. 본 데이터는 총 91건으로, 각 영화관의 이름, 주소, 전화번호, 위도, 경도 항목을 포함하고 있습니다.- 이름: 영화관의 공식 명칭을 표기하여, 사용자가 원하는 영화관을 쉽게 식별할 수 있도록 합니다.- 주소: 영화관의 실제 위치 정보를 상세히 제공하여, 내비게이션이나 지도 서비스와 연계할 수 있도록 합니다.- 전화번호: 영화관에 대한 문의 및 예약을 위한 연락처를 제공합니다.- 위도/경도: 영화관의 정확한 위치를 지도 기반 서비스(예: 네이버 지도, 카카오맵 등)와 연계하여 확인할 수 있도록 위도와 경도 정보를 함께 제공합니다.단, 운영시간 및 전화번호 컬럼의 경우, 데이터 미집계, 개인정보 보호 등의 사유로 일부 정보가 누락될 수 있습니다.방문객, 지역 주민, 연구자 등 다양한 이용자들이 DMZ 인근 영화관 정보를 한눈에 파악하고, 위치 기반 서비스, 관광 안내, 지역 소개 자료 등 다양한 목적에 활용할 수 있습니다.'
