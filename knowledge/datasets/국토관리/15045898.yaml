summary_user: 도시관리계획에 따라 결정된 용도지역·용도지구를 전국 범위의 필지·건물 단위 공간정보(SHP)로 담은 원천 데이터로, vworld 공간정보 다운로드에서 시도별 파일로 받는다. 개발·매입을 검토하는 사업자나 도시계획 분석가가 특정 필지가 어떤 용도지역·용도지구에 지정돼 있고 언제 바뀌었는지 확인하는 데 쓴다. 실측 컬럼(A0~A11)에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 국토교통부 일별용도지역지구정보는 토지를 경제적이고 효율적으로 이용하며, 토지이용을 종합적으로 조정·관리하기 위하여 도시관리계획에 따라 결정된 용도지역·용도지구에 관한 공간정보이다. 해당 데이터는 전국 단위로 월간 갱신되며, 변동 사항은 일 단위로 반영된다. 이를 통해 특정 필지의 용도지역·용도지구 지정 현황과 변동 내역을 확인할 수 있으며, 도시계획 수립, 개발행위 관리, 토지이용 분석 등 다양한 분야에서 기초자료로 활용된다.
