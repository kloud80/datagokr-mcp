summary_user: '경기민원24 시스템의 민원 콘텐츠를 키워드 단위로 정리한 목록으로, 키워드마다 일련번호와 콘텐츠 구분값이 붙어 있으며 범위는 경기도(시도) 단위의 비공간 자료다. 경기도 민원 담당자나 분석가가 "도민이 민원 검색에서 어떤 주제(예: 여성, 지역, 금액)를 자주 찾는가"처럼 반복·집중 민원의 관심사를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 키워드 문자열이나 콘텐츠 구분값을 이름으로 맞추는 방식으로만 연결한다.'
description_portal: 경기도 경기민원 키워드 정보 데이터는 경기민원24 시스템에서 제공되는 민원 콘텐츠를 키워드 단위로 정리하여 관리하는 자료로, 각 키워드에 일련번호와 콘텐츠 구분값이 부여되어 있습니다. 일부 항목은 단순 코드 형태로 나타나지만, 특정 항목에서는 “여성, 지역, 금액”과 같은 실질적인 분석 가능 키워드가 포함되어 있어 민원 수요와 사회적 관심사를 반영합니다. 이 데이터는 행정기관이 민원 검색 효율성을 높이고, 키워드 기반으로 반복적·집중적 민원을 분석하여 정책 수립에 활용할 수 있는 중요한 기반이 됩니다.
