summary_user: 충청남도 보령시가 관내에서 처리한 건축허가·신고를 건별로 담은 파일(csv, 약 18KB)로, 건축구분·허가번호·대지위치·지목·면적·건폐율·용적률·허가일·착공처리일·사용승인일·용도지역 등 25개 항목을 필지·건물 단위로 기록한다. 지역 개발 흐름을 보려는 분석가나 사업자가 '보령시에서 최근 어떤 용도·규모의 건축이 어느 용도지역에 허가되고 착공됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열 매핑이나 같은 기관(보령시) 단위로만 이어 쓰며, 건축물대장 등 다른 건축 데이터와 결합하려면 주소 정규화가 필요하다.
