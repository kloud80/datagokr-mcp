summary_user: 충청북도 제천시의 「국토의 계획 및 이용에 관한 법률」에 따른 용도지역(주거·상업·공업·녹지·관리·농림·자연환경보전) 현황을 시군구 단위로 담은 파일로, 지역지구 명칭·지정권자·고시년도·관리번호·등재면적을 건별로 담는다. 제천시 안에서 어떤 용도지역이 언제 누구에 의해 지정됐고 면적이 얼마인지 확인하려는 토지 투자자·도시계획 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역지구 명칭이나 관리번호를 이름·코드로 맞춰 잇거나 같은 기관(제천시) 자료끼리만 연결한다.
description_portal: 이 자료는 충청북도 제천시에서 작성한 「국토의 계획 및 이용에 관한 법률」에 따른 용도지역 현황자료로 충청북도 제천시의 구군별 용도지역(주거지역, 상업지역, 공업지역, 녹지지역, 관리지역, 농림지역, 자연환경보전지역)의 면적을 제공합니다.“용도지역”이란 토지의 이용 및 건축물의 용도, 건폐율, 용적률, 높이 등을 제한함으로써 토지를 경제적·효율적으로 이용하고 무분별한 개발을 방지하며 공공복리의 증진을 도모하기 위하여 서로 중복되지 아니하게 도시·군관리계획으로 결정하는 지역을 말합니다.해당 데이터는 충청북도 제천시의 도시디자인과에서 담당합니다.
