summary_user: 광주 광산구에 있는 공동주택(아파트)을 단지 한 건씩 담은 원천 목록이다. 단지명, 행정동, 도로명주소, 세대수·동수·층수, 사업승인일과 사용검사일, 관리사무소 전화번호, 위도·경도가 들어 있다. 주민이나 분석가가 "광산구 어느 동에 몇 세대 규모의 아파트가 언제 준공됐는가"를 확인하거나 단지 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소·단지명 매칭이나 위도·경도 좌표로 잇는다.
description_portal: 광주광역시 광산구에 위치한 공동주택에 대한 데이터로 아파트의 명칭, 행정동, 소재지 도로명주소 등 다양한 항목이 포함되어 있습니다. 또한 세대 수, 동 수, 층 수와 같은 물리적 규모와 구조를 알 수 있으며, 사업 승인일과 사용 검사일에 대한 정보도 포함되어 있습니다.이를 통해 지역 내 공동주택의 분포와 특성을 파악할 수 있으며, 주거 환경 개선 및 정책 수립에 유용한 기초 자료로 활용될 수 있습니다.지역 내 주택 정책을 수립하거나, 주거 환경을 개선하는 데 중요한 기초 자료로 활용되며, 부동산 시장 분석이나 도시 계획에도 큰 도움이 됩니다.※ 공란(연락처) - 데이터 미집계(비의무 단지 공동주택 및 준공 년도 오래된 공동주택의 경우 관리사무소 전화번호 확인이 어려움)     공란(사용검사일자) - 시공중인 아파트로 아직 준공되지 않은 상태임
