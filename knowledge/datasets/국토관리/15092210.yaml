summary_user: 2019년 기준 전국 17개 시도별로 임대사업자 유형과 주택 유형(건설임대·매입임대·전세임대 등)에 따른 사업자 수와 임대주택 호수를 담은 시도 단위 집계 파일이다. 정책 분석가나 연구자가 '어느 시도에 등록 임대주택과 임대사업자가 얼마나 몰려 있고, 매입임대와 건설임대 비중은 어떤가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 시도 단위 통계(전월세 실거래 등)와는 지역명(시도명)을 직접 맞춰 이어 쓴다.
description_portal: 2019년 전국 광역자치단체 단위  유형별 임대사업자 수와 그에 따른 건설임대 매입임대 전세임대 등 임대주택호수 통계 데이터를 제공합니다. 17개의 도 각 16개씩(5.88%)의 데이터를 나타내고 있습니다. 매입임대 102건(37.5%), 건설임대 102건(37.5%)로 주택 유형의 대다수를 차지하고 있으며  총 임대호수는 304만 호 이며 지역별로 경기도 85.8만건(28.2%), 서울특별시 73.1만건(24%), 부산광역시 16.5만건(5.4%) 로 나타납니다. 주택유형별로 사업자 수는 매입임대, 매입임대사업자 합쳐 30만건(95.2%)을 보입니다.
