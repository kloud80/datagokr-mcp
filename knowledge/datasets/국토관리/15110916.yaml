summary_user: 영주시가 보유한 건물 형태 공유재산을 재산 한 건(등록번호)별로 담으며, 소재지·도로명주소, 주구조와 지붕구조, 연면적·취득면적이 들어 있고 범위는 영주시 한 개 시군구다. 영주시 안에 시가 가진 공공건물이 어디에 있고 규모·구조가 어떤지 확인하려는 주민, 공공건축물 리모델링·에너지 개선 사업을 검토하는 설계·건설 업체, 자산 현황을 분석하는 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 도로명주소·소재지 문자열을 맞춰 건축물대장 등과 붙이거나 같은 기관 데이터끼리만 연결한다.
description_portal: 본 API는 영주시가 보유하고 있는 건축물 형태의 공공자산에 대한 정보를 체계적으로 제공하는 공공데이터입니다. 등록번호, 건물의 소재지, 도로명주소, 주구조 코드, 지붕 구조 코드, 연면적, 취득 면적 등의 상세한 항목을 포함하고 있어 지자체가 관리하는 공유재산의 물리적·관리적 특성을 파악할 수 있습니다.공공기관의 경우, 본 API는 지방자치단체의 자산 관리 효율화를 위한 기초 자료로 활용됩니다. 각종 건물 재산의 취득면적, 연면적, 구조 코드 등 정보를 통해 시설의 적정성 및 활용도를 분석할 수 있으며, 장기적인 공유재산 관리계획 및 유지보수 예산 계획 수립에 기반자료로 사용됩니다. 또한 행정안전부의 ‘지방재정공시’ 및 ‘공유재산 관리 종합대장’ 작성 시 주요한 참조자료가 됩니다.지역 내 공공건축물의 위치, 규모, 구조 등을 확인함으로써 지역자산의 분포와 활용 현황을 간접적으로 파악할 수 있으며, 특히 공공시설의 접근성이나 활용 실태에 대한 관심이 높은 주민참여형 도시계획 수립 과정에서 참고자료로 활용될 수 있습니다.기업 및 민간분야에서는, 이 데이터를 기반으로 건축 설계, 시설 리모델링, 공공건축물 에너지진단 등과 관련한 B2G 사업 분석에 유용하게 사용할 수 있습니다. 예를 들어, 에너지 성능 개선사업, 스마트시티 기반시설 구축, 공공건축물 리모델링 등과 같은 공공사업에 참여하고자 하는 건설사, 건축사무소, 설계사무소, ICT 기업에게는 입지 분석 및 현황 파악에 중요한 기초자료입니다.
