description_portal: 본 데이터는 한국수자원공사가 전국 수도사업자를 대상으로 도수관 관련 시설의 설치 및 개량 현황을 집계하여 제공한 자료이다. 연도별로 관로의 신설, 교체, 철거 및 개량에 따른 연장(m) 정보를 포함하고 있으며, 도수관의 신설률, 교체율, 개량률 등의 지표도 함께 수록되어 있다. 본 데이터는 노후 상수도 시설 개선, 유지보수 계획 수립 등 다양한 정책 수립에 활용될 수 있다. 또한 갱생 연장 및 세관 연장과 같은 세부 항목을 포함함으로써 물관리 인프라의 현황을 정밀하게 파악할 수 있도록 구성되었다. 수도관 유지관리 및 인프라 개선에 관심 있는 공공기관, 연구자, 민간기업 등 다양한 이해관계자에게 유용한 기초자료로 활용 가능하다.
