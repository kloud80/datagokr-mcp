summary_user: 주택분양보증을 받아 분양한 민간 신규아파트의 일반 분양세대수(상가·오피스텔·조합원분 제외)를 전국 시도별·분기별로 집계한 표이며, 시도가 행이고 2021년 1분기부터 2026년 2분기까지 분기가 열로 놓인 넓은 형태의 CSV 파일이다. 지역별 민간 아파트 신규 공급 물량이 분기마다 어떻게 늘고 줄었는지를 보려는 분석가나 수요자가 '우리 시도에 최근 몇 분기 동안 분양 물량이 얼마나 나왔나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시도 이름을 기준으로 미분양·인허가·청약 등 다른 시도 단위 주택 통계와 이름 매칭으로 이어 쓴다.
limits: 시도 단위 분기 합계만 담겨 시군구·단지·평형별 분양 내역은 알 수 없다. 표준 코드 없이 시도 이름으로만 다른 데이터와 연결해야 하므로 명칭 표기 차이를 맞춰야 하고, 분기가 열로 펼쳐져 있어 시계열 분석 전에 행 형태로 바꿔야 한다.
