description_portal: '- 전라남도 공간정보 통합 플랫폼에 게재된 드론 운영 정보(드론 3d리스트, 드론운영관리시스템 결재리스트 정보)에 대해 조회하실 수 있습니다.- 전라남도 공간정보통합플랫폼은 도내 공간정보를 통합하여 제공하는 온라인 시스템으로, 지리정보시스템(GIS)을 활용하여 다양한 공간 데이터를 시각화하고 분석할 수 있는 서비스를 제공합니다. 이를 통해 공공기관, 기업, 연구기관, 일반 시민 등이 공간 정보를 효율적으로 활용할 수 있습니다.- 전라남도 공간정보통합플랫폼은 공간 데이터를 효율적으로 활용하여 다양한 분야에서 의사결정을 지원하고 있습니다. 공공기관뿐만 아니라 일반 시민들도 쉽게 접근하여 활용할 수 있는 시스템으로, 공간 정보의 활용도를 높이고 있습니다.'
