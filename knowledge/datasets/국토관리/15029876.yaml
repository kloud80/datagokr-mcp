summary_user: 경기도 가평군 안의 공동주택 건설 공사를 공사 한 건 단위로 담은 파일(csv, 약 4KB)로, 공사명·공사 시작일과 완료일·시공사와 연락처·세대수·도로명/지번 주소·위도와 경도를 담는다. 가평군에서 어느 단지가 언제 몇 세대 규모로 지어지고 시공사가 누구인지 확인하려는 주민·분양 수요자, 지역 주택 공급과 인구 유입을 살피는 분석가가 쓴다. 전역 조인 키는 없으므로 시공위치 주소나 위도·경도를 써서 공간·주소 기준으로 붙이거나, 공사명(단지명)을 이름 매칭으로 K-apt 단지정보·실거래 자료와 잇는다.
