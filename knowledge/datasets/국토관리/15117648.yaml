summary_user: 한강홍수통제소가 매년 발행하는 수문연보의 대상이 되는 전국 수위관측소의 목록으로, 관측소 한 곳마다 관측소코드·한글/영문 명칭·하천명·주소·경위도·영점표고·유역면적·관측개시일 같은 제원을 연도별로 담는 파일(csv 약 65KB)이다. 수문 분석가나 하천 관리 담당자가 '특정 하천에 어떤 수위관측소가 어디에 있고 기준 표고와 유역면적은 얼마인가'를 확인하거나 관측소 위치를 지도에 올릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 수위관측소코드(WAMIS 표준 관측소코드 체계)나 관측소명으로 매핑해 홍수통제소·WAMIS의 수위·유량 시계열 자료와 이어 쓴다.
description_portal: 한강홍수통제소에서는 매년 수문연보를 작성하여 연중 발행하며 그 해 수문연보는 전년도 자료를 기준으로 작성됩니다. 이 데이터는 수문연보 생성 대상이 되는 수위관측소의 정보입니다. 수위관측소의 행정주소, 한글 및 영문명칭(영문명칭은 한글명칭의 독음을 영문자로 표기한 것이며 한글 로마자표기법을 따릅니다.), 관측소코드, 설치된 하천명 등으로 구성되어 있습니다. 수위관측소 코드는 관측소가 설치된 지점의 행정권역 및 하천 수계별 분류에 따라 부여되며 자릿수와 각 자리별 값에 따라 관측소 종류과 설지된 지역이 구분됩니다.
