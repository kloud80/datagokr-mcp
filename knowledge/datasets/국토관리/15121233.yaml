summary_user: 인천 서구(파일명은 서해구) 관내에 등록된 임대주택을 한 건씩 담은 원천 목록으로, 등록번호·사업자 구분·임대물건지 주소·임대주택 구분·종류·유형을 주소 단위로 기록한다. 주거복지 담당자나 분석가가 '서구 안에서 어떤 유형의 등록임대주택이 어느 동네에 몰려 있는가'를 확인하는 데 쓰고, 세입자는 거주(예정) 주택이 등록임대인지 가늠하는 데 참고한다. 실측 컬럼에 전역 조인 키가 없어, 임대물건지 주소를 지오코딩하거나 주소·지번을 매핑해 전월세 실거래 등 다른 주택 데이터와 이어 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 등록된 임대주택의 현황을 정리한 데이터입니다. 본 공공데이터는 임대사업자의 유형, 임대주택 주소, 주택의 구분, 종류, 유형 등의 항목으로 구성되어 있습니다.본 자료는 인천광역시 서구의 임대주택 공급 실태를 파악하고, 주거복지 정책 수립, 주택공급 전략 마련 등에 활용될것으로 판단됩니다. 또한 임대주택 유형별 분포를 통해 서구 내 주거안정성 확보 및 수요 기반 정책 수립의 기초자료로도 활용될것으로 판단됩니다. 본 데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
