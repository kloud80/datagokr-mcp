summary_user: 부천시 관내에서 맛·위생·서비스 평가와 외식업소 육성위원회 심의를 거쳐 선정된 맛집 29곳을 업소 단위로 담은 파일 데이터이다(업소명, 도로명·지번주소, 전화번호, 총좌석수). 부천에서 믿을 만한 지역 음식점을 찾는 시민이나 상권·음식점 현황을 살피는 분석가가 쓴다. 소재지 도로명주소와 지번주소가 주소(address) 조인 키라서 다른 주소 기반 데이터와 이어 쓰며, 별도의 업소 고유 ID 키는 없다.
description_portal: 시민들의 여가 생활과 소상공인의 발전을 위하여 부천시 맛집데이터를 제공하고 있습니다.부천시 관내 위치한 맛집(업소명, 소재지도로명주소, 소재지지번주소, 전화번호, 총좌석수, 데이터기준일자)에 관한 데이터 입니다.부천 맛집이란 맛, 위생,서비스가 우수한 지역 특색 음식점으로 일반 음식점, 휴게 음식점, 제과점을 지정 대상으로 하였으며,지정 대상의 위생, 맛, 서비스 평가 후 "부천시 외식업소 육성위원회" 심의, 의결 후 부천 맛집으로 선정하였습니다.데이터 미보유 및 미등록 값은 공란으로 작성하였으니 이 점 유의 바랍니다.-해당 데이터에 관한 사항은 식품위생과에 문의 부탁드립니다.
