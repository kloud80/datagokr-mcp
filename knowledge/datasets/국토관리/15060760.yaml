summary_user: 한국농어촌공사가 관리하는 저수지·양수장 등 농업기반시설에서 홍수기나 집중호우 때 실시한 홍수조절 방류를 재해 건과 시설별로 기록한 전국 단위 파일로, 재해명·기간, 시설명, 수혜면적, 만수위·홍수위, 수문 개폐 시작·종료 시간을 담는다. 분석가나 지자체 방재 담당자가 "특정 태풍·호우 때 우리 지역 저수지가 언제부터 언제까지 방류했는가"를 확인하거나 방류 이력을 바탕으로 지역별 홍수 위험을 분석하는 데 쓴다. 전역 조인 키는 없어 같은 기관의 표준시설코드(표준시설코드)나 시설명으로 농어촌공사 저수지 제원·수위 데이터와 맞추고, 재해명·재해기간으로 기상특보 등 다른 재난 데이터와 이어 쓴다.
description_portal: 이 데이터는 농업기반시설(저수지, 양수장 등)에서 홍수기나 집중호우 시 실시되는 홍수조절 방류 현황을 제공합니다.재난, 재해 등 비상상황 발생시  한국농어촌공사 관리시설의 홍수조절 방류 현황 정보(재해현황, 시설코드, 시설명, 작성일, 수혜면적, 만수위, 홍수위, 개폐시작시간, 개폐종료시간)를 제공하고 있습니다.해당데이터는 아래와같은 분야에 활용할 수 있습니다.- 홍수기 저수지 방류 이력 관리 및 안전 모니터링- 재난 대응 및 수해 예방 정책 수립- 수자원 관리 및 지역별 홍수 위험 분석- 학술 연구(기후변화, 수문학, 농업재해 대응 등)
