description_portal: 경기도 수원시의 옥외광고물 현황으로 전수조사번호, 업소명, 소재지주소, 위경도, 광고물종류, 사이즈, 규격, 내용, 조명 등을 포함합니다. 규격별 허용 범위를 알면 광고 제작 전부터 적절한 크기와 디자인을설계할 수 있어 시간과 비용을 절감할 수 있습니다. 규격대로 옥외광고물을 설치함으로써 무분별한 대형광고물이나 불법 설치를 예방할 수 있어 깔끔한 거리 환경을 조성할 수 있습니다. 상점 간판, 현수막, 전단형 광고 등 어떤 유형이 가능한지 쉽게 파악할 수 있어 효율적인 홍보 방법에 활용할 수 있습니다.
