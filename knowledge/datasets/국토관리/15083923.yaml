summary_user: 대전광역시 서구의 주택 외 일반건축물에 대해 과세년도별로 법정동·본번·부번·동·호 단위 물건지와 연면적, 시가표준액을 건별로 담은 파일(CSV 약 10MB)이다. 서구에 상가·사무실 등 비주거 건물을 가진 사람이나 분석가가 "이 건물의 재산세·취득세 과세 기준가액이 얼마인가", "연면적 대비 시가표준액이 동별로 어떻게 다른가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 자치단체코드·법정동명과 본번·부번(지번) 조합을 맞추는 방식으로만 건축물대장·공시지가 등에 이어 쓴다.
description_portal: '주택을 제외한 일반건축물에 대한 지방세 부과기준인 시가표준액을 제공시도명/시군구명/지방자치단체코드/과세년도/세목명/부과금액 등일반건축물 시가표준액”**은 지방세(재산세, 취득세 등) 과세의 기초가 되는 건축물의 과세표준 산정 기준가액을 말합니다. 개념「지방세법」 제4조에 따라 건축물의 가액은 시가표준액으로 함.일반건축물 시가표준액은 국토교통부 장관이 매년 정하여 고시하며, 건축물의 구조·용도·위치·규모 등에 따라 m²당 금액으로 산정됨.개별 건축물의 시가표준액 = (건물 면적 × m²당 시가표준액) × 구조·용도별 보정계수 산정 방식기본단가: 건축물의 주 구조(철근콘크리트, 조적조, 목조 등)와 용도(주거, 상업, 공업 등)에 따라 정한 m²당 기준가액보정계수: 건축 연도, 층수, 위치, 내구연한 등을 반영최종 시가표준액 = (건물 연면적 × 구조·용도별 기준 시가표준액) × 보정계수활용재산세 과세표준 산출취득세 부과 (취득가액이 불분명한 경우 적용)등록면허세·지역자원시설세 등 관련 세목 기초자료 확인 방법행정안전부에서 매년 고시하는 「건축물 시가표준액 조정기준」 참조지방자치단체 세무부서 또는 위택스(Wetax) / 정부24에서 본인 건축물의 시가표준액 열람 가능'
