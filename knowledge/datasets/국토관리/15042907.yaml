summary_user: 경상북도 청도군 관내 토석채취허가와 채석신고를 건별로 담은 파일로, 허가·신고 구분, 수허가자 상호, 허가지 주소, 채취 용도, 허가면적(㎡)·허가량(㎥), 허가 시작·종료일을 담는다(파일 크기 292바이트로 건수는 적다). 주민이나 건설업체가 청도군 어느 곳에서 어떤 업체가 언제까지 토석을 채취하도록 허가받았는지 확인하거나, 행정·분석가가 관내 채석장 현황과 허가 기간을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 허가지 주소나 업체 상호를 기준으로 맞추거나 같은 기관 자료끼리만 연결한다.
