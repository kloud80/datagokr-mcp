summary_user: 경기도 데이터분석시스템의 행정동 단위 전입 기본정보로, 기준년도별로 전입 시군구·행정동, 전입유형, 연령, 성별에 따른 인구수와 전출 시군구·행정동을 담은 집계 자료이며 범위는 시도, 행정단위는 읍면동입니다. 지자체 정책 담당자나 분석가가 '어느 행정동에서 어느 행정동으로 어떤 연령·성별의 인구가 옮겨 왔는가'처럼 지역 간 주거 이동 패턴을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 시군구·행정동 코드(mvin_admdong_cd 등)나 이름을 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 행정동 단위 전입 기본정보로, 특정 시군구 및 행정동 간 인구 이동 현황을 분석할 수 있도록 구성된 자료입니다. 주요 항목에는 기준년도, 전입시군구코드, 전입시군구명, 전입행정동코드, 전입행정동명, 전입유형코드, 연령내용, 성별코드, 인구수, 전출시군구코드 등이 포함됩니다. 이를 통해 연령대별·성별 인구 이동 특성을 확인할 수 있으며, 지역 간 주거 이동 패턴과 생활 기반의 변화를 분석하는 데 활용됩니다. 대용량 데이터로 현재 SHEET와 API에서는 2017년도의 데이터만 개방하고 있습니다.
