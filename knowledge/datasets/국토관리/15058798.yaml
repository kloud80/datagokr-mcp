summary_user: 온천법에 따라 지정된 온천지구를 전국 범위로 제공하는 외부 API(vworld.kr) 데이터로, 필드는 지구명, 지정 연도·번호, 시도명, 시군구명, 비고로 구성된다. 온천지구가 어느 시도·시군구에 지정돼 있는지 확인하려는 국민·사업자·분석가가 토지이용규제 검토에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 시도명·시군구명 같은 이름 매핑이나 같은 기관 코드로만 다른 데이터와 잇는다.
