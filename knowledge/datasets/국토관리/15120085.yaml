summary_user: 새만금 간척으로 조성된 토지의 행정구역 결정 현황을 구분별로 나눠 합계 면적(제곱미터)과 군산시·김제시·부안군별 면적을 담은 집계 파일로, 원천 파일 크기는 490바이트의 작은 표입니다. 새만금 매립지 가운데 어느 시·군에 얼마만큼의 면적이 귀속됐는지 확인하려는 지역 개발 계획 담당자나 연구자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 군산시·김제시·부안군 같은 시군 이름을 매핑하거나 새만금개발청의 다른 자료와 대조해 이어 쓴다.
