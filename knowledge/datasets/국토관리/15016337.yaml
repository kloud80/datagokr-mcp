summary_user: 경기주택도시공사가 시행한 공공주택 사업(분양·공공임대·국민임대·전원주택 등)을 사업 단위로 한 행씩 담은 소규모 파일(csv 약 4KB)로, 사업명·진행현황·공사위치·사업시행자·면적·수용세대·사업 시작·종료(예정) 연월을 담는다. 정책 분석가나 주택 수요자가 '경기도 어느 지역에서 언제, 몇 세대 규모의 공공주택 사업이 진행됐거나 예정인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명이나 공사위치 주소를 이름 매칭해 잇거나, 같은 기관의 다른 데이터와 연결한다.
