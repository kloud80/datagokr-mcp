description_portal: '1. 기관 소개 및 비전기관 개요: 광주도시관리공사의 설립 목적, 주요 업무, 연혁, 조직도 등의 정보.비전 및 미션: 공사의 중장기적인 목표와 비전, 사회적 책임 및 환경적 책임을 다하는 목표.2. 서비스 관련 데이터도시 관리 서비스: 도시 관리와 관련된 다양한 서비스 정보, 예를 들어 청소, 공원 관리, 교통 서비스 등.시설 관리: 공공시설 관리 현황, 시설물의 상태나 유지보수 관련 데이터.교통/주차 서비스: 주차장 운영 현황, 교통 관리 방안 및 서비스 제공 상태 등.3. 사업 현황 및 통계사업별 현황: 광주도시관리공사가 진행 중인 다양한 사업(예: 공공건물의 관리, 도시 정비 등)의 진행 상황이나 성과를 보여주는 데이터.통계 자료: 광주의 도시 관리와 관련된 다양한 통계(예: 주차장 수, 청소 활동 실적, 공원 조성 면적 등).4. 예산 및 재정 데이터예산 공개: 광주도시관리공사의 예산 배분, 지출 항목, 사업별 예산 등에 관한 데이터.재정 운영: 공사의 재정 상태와 투명한 운영을 위한 예산 및 지출 내역.'
