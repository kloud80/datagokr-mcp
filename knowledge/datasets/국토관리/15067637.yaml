summary_user: 전국 수치표고모델(DEM)의 1:5000 도엽별 성과정보를 한 행씩 담은 파일로, 도엽번호·도엽명, 좌하단·우상단 평면좌표, 좌표계, 격자간격, 보간방법, 표고기준, 최고·최저표고, 정확도와 원시자료 획득방법, 부속 보고서 보유 여부를 담는다. 공간분석가나 측량·설계 실무자가 '이 지역 도엽의 DEM은 어떤 격자간격과 정확도로, 어떤 원시자료로 만들어졌나'를 확인하고 필요한 도엽을 고르는 데 쓴다. 전역 조인 키는 없어 1:5000 도엽번호(도엽번호5000)나 도엽 모서리 좌표로 같은 기관의 항공사진·정사영상·수치지도 도엽 성과와 맞춰 쓴다.
