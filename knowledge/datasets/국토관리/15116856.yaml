summary_user: 서울시 상수도 수용가를 주소 단위 건별로 나열하고, 각 수용가의 원격검침 적용 여부와 관할 사업소를 담은 CSV 파일(약 19MB)입니다. 분석가나 연구기관이 '서울 어느 사업소 관할, 어느 지역에 원격검침이 얼마나 보급됐나'를 집계해 스마트 상수도 보급 현황을 볼 때 쓴다. 전역 조인 키가 없어 주소를 행정구역이나 좌표로 매칭하거나 사업소 이름으로 다른 상수도 자료와 연결해야 합니다.
description_portal: 해당 공공데이터는 수도계량기 검침 업무의 효율성을 높이기 위해 도입된 원격검침 시스템이 적용된 서울특별시 상수도 원격검침 수용가 현황을 담고 있는 자료입니다. 해당 자료는 원격검침을 통해 수작업 없이 자동으로 수도검침이 가능한 서울특별시 상수도 원격검침 수용가에 대한 정보를 포함하고 있습니다. 주요 항목으로는 수용가의  주소, 원격검침 적용 여부 등이 있으며, 이를 통해 서울특별시의 스마트 상수도 인프라 보급 현황을 파악할 수 있습니다.기존의 수동 검침 방식에서 벗어나 무선 통신 기술을 활용하여 실시간으로 데이터를 수집, 관리하는 목록을 체계적으로 정리한 자료 입니다. 원격검침은 수도검침의 효율성을 높이고 검침 인력의 부담을 줄이며, 누수 등 이상징후를 신속히 파악함으로써 선제적으로 대응할 수 있도록 하는 데 주요 목적이 있습니다. 해당 자료를 공공데이터 포털에 공개함으로써 공기업, 학계, 연구기관 등 다양한 분야에서의 활용이 가능할 것입니다. 해당 자료는 개인정보는 포함되지 않으며, 정기적으로 업데이트 될 예정이오니 많은 참고 부탁드립니다.
