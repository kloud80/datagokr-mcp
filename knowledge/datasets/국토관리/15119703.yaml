summary_user: DMZ와 그 인근 지역 식당을 한 곳씩 담은 건별 목록 파일로, 식당 이름·주소·전화번호·위도·경도·법정동코드를 담는다. 관광객이나 지역 관광·상권 분석가가 'DMZ 접경 특정 읍면동에 식당이 몇 곳이고 어디에 몰려 있나'를 지도 위에서 확인하는 데 쓴다. 법정동코드(bjd_cd)를 키로 행정구역 경계·인구·관광 통계 등 법정동 단위 데이터와 잇고, 위도·경도로 다른 관광지·숙박 좌표 데이터와 거리 기준으로 겹쳐 쓴다.
description_portal: '통일부에서 제공하는 ‘DMZ 인근 지역 식당 정보 데이터’는 비무장지대(DMZ)와 그 인근 지역에 위치한 다양한 식당의 주요 정보를 정리한 데이터입니다.데이터는 총 16,262건으로, 이름, 주소, 전화번호, 위도, 경도 항목으로 구성되어 있습니다.- 이름: 식당의 공식 명칭을 표기하여, 사용자가 원하는 식당을 쉽게 식별할 수 있도록 합니다.- 주소: 식당의 실제 위치 정보를 상세히 제공하여, 내비게이션이나 지도 서비스와 연계할 수 있도록 합니다.- 전화번호: 식당에 대한 문의 및 예약을 위한 연락처를 제공합니다.- 위도/경도: 식당의 정확한 위치를 지도 기반 서비스(예: 네이버 지도, 카카오맵 등)와 연계하여 확인할 수 있도록 위도와 경도 정보를 함께 제공합니다.단, 전화번호 컬럼의 경우, 데이터 미집계, 개인정보 보호 등의 사유로 일부 정보가 누락될 수 있습니다.이 데이터는 DMZ 인근 지역 식당의 분포와 운영 현황을 한눈에 파악할 수 있을 뿐만 아니라, 지역 관광 활성화 및 지역 경제 분석 등 다양한 목적에 활용될 수 있습니다. 특히, 지리적 정보(위도, 경도)가 포함되어 있어, 위치 기반 서비스와의 연계가 용이하며, DMZ 인근을 방문하는 관광객들에게 실질적인 정보를 제공할 수 있습니다.'
