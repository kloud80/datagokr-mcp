description_portal: 공공데이터포털에서 제공하는 '대전광역시 서구_행정동 및 상권 현황' 데이터는 서구의 각 행정동별 상권 정보를 제공합니다. 주요 내용은 24개 동별 상권명을 포함하고 있습니다.세부 상권으로는 도마큰시장 롯데백화점 한민시장 이마트트레이더스 가수원상점가 대주프라자 마치광장골목형상점가 대전시청역 갤러리아백화점 사학연금회관 이마트둔산점 서구보건소 둔산3동상점가 상권 등이 있습니다.주요 공공데이터 활용 예시로는 상권분석 지원 및 지역경제 활성화 지원 방안 등으로 활용 될 수 있습니다.기타 자세한 사항은 공공데이터 제공부서로 문의하여 주시기 바랍니다.
