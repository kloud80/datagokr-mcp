summary_user: 충청북도 단양군에 있는 공동주택을 단지별로 한 행씩 담은 파일로, 단지명·도로명/지번 주소·세대수·층수·동수·전용면적 구간별(60㎡ 이하부터 135㎡ 초과까지) 세대수·준공연도·관리실 전화번호를 담는다(약 7.6KB CSV). 단양군으로 이사하거나 주택 수요를 분석하는 사람이 '단양군에 중소형(85㎡ 이하) 세대가 많은 오래된 아파트 단지는 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지명이나 주소를 직접 맞춰 이어야 하며, 건축물대장·공동주택 관리 정보 같은 주소 기반 데이터와 이렇게 대조해 쓴다.
description_portal: 충청북도 단양군 소재 공동주택 현황으로 공동주택명, 도로명주소, 지번주소, 세대수, 층수, 동수, 면적별 세대수, 준공연도, 관리사무실 전화번호 및 데이터기준일자 등의 항목으로 구성되어 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 공동주택 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 12일입니다. 담당부서는 단양군 행정복지국 민원과이며 문의주시면 최신의 충청북도 단양군 공동주택 현황을 열람하실 수 있게 도와드립니다.
