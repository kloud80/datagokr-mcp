summary_user: 경상남도 창녕군에서 허가를 받은 전문건설업체를 업체 한 곳당 한 행으로 담은 파일(CSV 약 46KB)로, 업체명·대표자·등록일자·업체상태·업종·주력분야·영업소재지 도로명주소·전화번호를 담는다. 창녕군 안에서 특정 업종이나 주력분야의 전문건설업체를 찾는 발주처·주민, 또는 지역 전문건설업체의 업종 분포를 보려는 분석가가 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 업체명이나 도로명주소를 기준으로 맞추거나 같은 기관의 다른 데이터와 이름 단위로만 이어 쓴다.
description_portal: 경상남도 창녕군에서 허가를 받은 전문건설업체 현황 정보입니다.1. 자료에는 순번, 전문건설업체명, 업체의 대표자명, 업종, 주력분야, 영업소재지 도로명주소, 전화번호, 데이터 기준일을 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 전화번호가 휴대전화번호인 경우 개인정보로 데이터가 없습니다.4. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 건설산업국 건설교통과 건설지원팀 055-530-1744로 문의 주시기 바랍니다.
