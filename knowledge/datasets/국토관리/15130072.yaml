summary_user: 진안군 도시계획정보시스템(UPIS)의 도시지역 현황을 도형 단위로 담은 파일로, 도형마다 관리번호·라벨명·면적·길이와 범위 좌표(X·Y 최소·최대값)를 담는다. 진안군 안에서 어느 구역이 도시지역으로 지정돼 있고 그 면적이 얼마인지 확인하려는 토지 소유자·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매칭이나 좌표 범위 중첩으로만 이어 쓴다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 도시지역 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 라벨 명, 면적(도형), 길이(도형), 현황 도형 관리 번호 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.
