summary_user: 토지 소유자의 연령별 현황을 시도·시군구·읍면동리 단위로 집계한 전국 통계 파일로, 기준연월과 법정동별 지번수·토지면적을 담는다. 지역 분석가나 정책 담당자가 특정 시군구나 읍면동의 토지를 어느 연령대가 얼마나 소유하는지 비교할 때 쓴다. 법정동코드(bjd_cd)를 키로 다른 법정동 단위 토지·인구 통계나 행정구역 경계 자료와 이어 쓴다.
limits: 비공간 집계 통계여서 필지별 소유 정보나 위치는 알 수 없다. 파일은 포털 활용신청과 별개로 vworld.kr에 로그인한 뒤 시도별 CSV로 받는다. 필드 목록에는 연령 구분 대신 변경 전·후 지목 항목이 있으므로, 실제 파일의 열 구성을 확인한 뒤 해석해야 한다.
