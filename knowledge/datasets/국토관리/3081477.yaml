summary_user: 전통식품 기능 보유자를 한 사람당 한 행으로 담은 명단 파일(csv, 약 4KB)로, 지정번호·성명·보유기능(식품 종류)·지정일·소재지를 담는다. 지역 전통식품 산업이나 관광 콘텐츠를 준비하는 사람이 '순창·완주 등 어느 지역에 어떤 전통식품 보유자가 언제 지정됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 소재지 주소나 보유기능 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 전북특별자치도를 포함한 전국 각지에서 지정된 전통식품 보유자의 명단과 해당 전통식품의 종류, 지정일자 및 소재지 정보를 포괄적으로 수록하고 있습니다. 지정번호와 성명을 통해 개인별 전통기능 보유자를 구분하며, 주로 주류(소주, 막걸리, 전통주 등), 식품(김치, 된장, 한과 등), 장류(고추장, 된장 등), 엿류, 육류가공품 등 다양한 전통식품 유형이 포함되어 있습니다. 특히 전북 완주, 전주, 정읍, 순창 등 지역별 전통식품의 분포와 역사성을 확인할 수 있습니다. 지정일자는 전통기능 보유자 인정 시점을 나타내며, 이 데이터는 전통식품 문화유산의 보존과 전승 현황을 체계적으로 관리하는 데 중요한 기초 자료로 활용됩니다. 이 자료는 전통식품 산업 발전, 지역별 전통문화 활성화, 기능 보유자의 관리 및 후계자 양성 정책 수립에 기여할 수 있으며, 전통식품의 다양성과 지역 특산물에 대한 이해를 돕습니다. 또한, 농림축산식품부 및 관련 기관의 정책 수립 및 연구, 관광 및 교육 콘텐츠 개발 등 다양한 분야에서 활용도가 높은 데이터입니다.
