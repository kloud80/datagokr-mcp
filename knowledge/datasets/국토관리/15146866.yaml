summary_user: 전국 지방자치단체가 도시관리계획으로 결정한 재개발구역(용도지역지구 중 도시재개발 구역)을 국토교통부가 취합한 공간 경계 자료로, vworld에서 시도별 SHP 파일로 받는다. 특정 동네나 매물이 재개발구역 안에 드는지, 구역이 언제 고시됐는지(고시일자 필드)를 확인하려는 주민·투자자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구 코드나 구역 이름으로 매핑해야 하며, 다른 정비사업 데이터와는 공간 중첩이나 이름 대조로 잇는다.
