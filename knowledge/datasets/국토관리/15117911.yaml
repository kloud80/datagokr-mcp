summary_user: 경기도 공동주택 단지별로 단지명·주소·세대수·동수·사용승인일·관리방식·난방방식과 월별 장기수선충당금 사용·부과액을 담는 데이터로, 국토교통부의 단지 목록·기본정보·관리비(장기수선충당금) 서비스를 결합했다(포털 설명상 2023년 1월부터, 당월 3개월 전까지 제공). 입주민이나 분석가가 '우리 단지의 장기수선충당금 부과·사용액이 비슷한 규모·준공연도 단지와 비교해 어떤가'를 확인하는 데 쓴다. 단지코드(HSCOMPLEX_CD)와 법정동코드 필드가 있어 K-apt 단지코드 기반의 실거래·공시가격·청약 데이터와의 매핑에 쓸 여지가 있으나, 실측에서 전역 조인 키로 확인되지 않아 단지명·코드 매핑을 거쳐 이어 쓴다.
description_portal: 공공데이터 포털(data.go.kr)의 1) 국토교통부 공동주택 단지 목록 제공 서비스, 2) 공동주택관리비(장기수선충당금) 정보서비스, 3) 국토교통부 공동주택 기본 정보제공 서비스를 결합한 데이터입니다.* 23년도 1월부터의 데이터로 23년도 이전 데이터는 공공데이터포털에서 직접 활용 가능합니다.* 당월 기준 3개월 전까지의 데이터를 제공합니다.* 충당금 값이 0인 경우, 데이터 수집일 기준 국토부 API에 충당금 값이 미입력된 경우입니다.(수집일 이후 데이터가 등록되었을 수 있으니 해당 값이 필요하신 경우, '국토교통부 공동주택관리비(장기수선충당금) 정보서비스'를 확인해주시기 바랍니다.)
