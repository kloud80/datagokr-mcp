summary_user: 광주지역 5개구 개발제한구역(그린벨트)의 해제·변경 건을 한 행씩 담은 작은 CSV 파일로, 위치별 기정면적·증감면적·변경 후 면적(제곱미터)과 변경사유를 기록한다. 개발제한구역이 어디서 얼마나 왜 해제됐는지 확인하려는 도시계획 분석가나 사업자가 공공사업·취락 정비 등 사유별 해제 규모를 살펴보는 데 쓴다. 실측 컬럼에 법정동코드나 필지번호 같은 전역 조인 키가 없어서, 다른 토지이용규제·용도구역 데이터와는 위치 이름을 직접 맞춰야 이어 쓸 수 있다.
description_portal: '「개발제한구역의 지정 및 관리에 관한 특별조치법」 제3조부터 제9조에 따라 지정된 전남광주통합특별시 광주지역(5개구)의 개발제한구역(그린벨트) 지정 및해제 현황 자료이다.본 데이터는 광주광역권 광역도시계획, 개발제한구역 변경 및해제 고시자료 등을 반영하여 작성하였으며, 최초 지정면적, 해제지역의 위치, 해제면적, 변경면적, 변경사유 등의 정보를 제공한다.개발제한구역 현황은 지속가능한 국토관리와 토지이용규제, 주택공급 정책, 공공사업 추진, 산업단지 및 첨단산업 입지 검토, 기후위기 대응과 탄소중립, 국가균형발전 및 광역도시계획 수립 등 국가 및 지방자치단체의 정책 수립을 위한 기초자료로 활용할 수 있다. - 최초 지정면적 : 267.66제곱킬로미터(2020 광주권 광역도시계획을 통해 지정) - 그간 해제면적 : 24.09제곱킬로미터(공공사업, 집단취락지, 단절토지, 관통대지) - 현재 지정면적 : 243.57제곱킬로미터본 자료는 개발제한구역 변경 및 해제 고시사항을 반영하여 정기적으로 현행화한다.'
legal_basis_portal: 광주광역권 광역도시계획, 개발제한구역 변경 및 해제 고시자료 등
