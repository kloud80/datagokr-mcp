summary_user: 충청북도 시군·읍면 단위로 재해위험지구별 정비사업의 지구명, 사업 개요, 총사업비, 연도별 사업비, 비고를 담은 지구 단위 현황 데이터입니다. 지역 주민이나 재난안전 분석가가 '우리 시군의 재해위험지구 정비에 연도별로 얼마가 투입됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군·읍면 이름을 행정구역 코드에 이름으로 매핑하거나 지구명으로 다른 재해·방재 데이터와 맞춰 잇는다.
limits: 표준 행정코드 등 전역 조인 키가 없어 다른 데이터와는 시군·읍면·지구명 문자열 매핑으로만 연결된다. 범위는 충청북도 시군구 단위로 한정되며, 이벤트성 생성 후 갱신되지 않는 데이터로 분류돼 최신 사업 진행상황 반영 여부는 따로 확인해야 한다.
