description_portal: 이 자료는 서울시 내 ‘둘레길’ 경로의 **선형 공간정보(라인 형태)**를 제공하며, 좌표계는 WGS 84(위도·경도)로 설정되어 있습니다.  쉐이프파일 형태로 제공되며, 서울시 전역에 걸친 보행용 둘레길의 경로를 GIS 등에서 시각화하고 분석할 수 있게 설계되어 있습니다. 경로별로 위치, 궤적, 연결구간 등을 파악할 수 있어 도보·관광·레크리에이션 인프라 분석, 주변 시설 연계성 평가, 접근성 개선 및 스마트 관광 기획 등에 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
