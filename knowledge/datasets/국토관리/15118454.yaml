description_portal: 이 데이터는 전국 하수처리장의 주민친화적 활용 수준을 확인할 수 있는 환경 인프라 정보입니다. 도시 공간 내 하수처리장은 일반적으로 혐오시설로 여겨지지만 최근에는 친환경·복합문화공간으로 탈바꿈하는 사례가 늘어나고 있으며 본 데이터는 그 변화의 실태를 면적 단위로 보여주고 있습니다.향후 도시계획, 환경정책, 지역사회 커뮤니티 시설 확충, 공공인프라 개선에 중요한 근거 자료로 활용될 수 있습니다. 특히 환경시설의 사회적 수용성 향상 및 지역 공존 모델 개발에 있어 유용한 데이터입니다.
