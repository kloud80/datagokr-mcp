summary_user: 전국 하수처리장별로 처리장 면적과 그 안의 주민친화시설 면적(휴게시설·어린이놀이공간·체력단련·운동시설·주차장·교육문화시설·생태습지·기타)을 시도·시군구 단위로 담은 처리장 단위 현황 파일이다. 지자체 도시계획·환경정책 담당자나 분석가가 "우리 지역 하수처리장 부지 중 주민이 쓰는 공간 비율은 다른 시군구에 비해 어떤가"를 따질 때 쓴다. 전역 조인 키가 없어서 다른 하수처리장 원장이나 방류수 수질 자료와는 시도·시군구명과 처리장명을 맞춰 이어 써야 한다.
