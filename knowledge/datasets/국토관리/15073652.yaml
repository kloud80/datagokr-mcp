summary_user: 대전광역시에서 사업이 끝난 도시개발사업 지구를 지구별 한 행으로 담은 목록 파일(csv, 약 3KB)로, 지구명·위치·면적(천㎡)·환지방법·감보율·사업비(억원)·시행 인가일·환지계획 인가일·환지 처분일·시행자를 담는다. 대전에서 어느 지구가 어떤 환지 방식과 감보율로 개발됐는지, 사업비 규모와 인가부터 환지 처분까지 걸린 기간이 어떠했는지를 따져보는 분석가나 토지 소유자에게 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어, 다른 데이터와는 지구명이나 위치 주소를 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 대전광역시 도시개발사업 완료지구 현황은 대전시 내에서 완료된 도시개발사업 지구에 관한 상세 정보를 제공하는 자료입니다. 이 자료는 각 지구의 명칭, 위치, 면적과 함께 환지방법, 감보율, 사업비, 시행인가일, 시행자 등의 주요 항목을 포함하고 있습니다. 이러한 정보를 통해 토지 구획 정리와 도시계획 사업의 진행 상황을 정확히 파악할 수 있으며, 지역 개발 현황과 사업비 집행 내역에 대한 체계적인 관리가 가능합니다. 또한 도시 재개발 및 재정비 과정에서 발생하는 토지 이용의 효율성 증대와 사업 추진의 투명성을 확보하는 데 중요한 근거 자료로 활용됩니다.
