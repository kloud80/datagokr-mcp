summary_user: 경기도 하남시 전체 토지를 도시지역(주거·상업·공업·녹지)·비도시지역·미지정지역 등 용도지역 구분별로 나눠 면적을 담은 집계 파일로, 366바이트 크기의 작은 CSV입니다. 도시계획 실무자나 분석가가 '하남시에서 주거지역과 녹지지역이 각각 얼마나 되는가'처럼 용도지역별 면적 규모와 비중을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용도지역 구분 이름(구분1·구분2)을 맞추거나 같은 하남시 자료끼리만 연결한다.
description_portal: 경기도 하남시 전체 토지에 대해 도시지역, 비도시지역, 미지정지역으로 분류하고, 각 용도지역별 면적 정보를 제공하는 공공데이터입니다. 도시지역은 주거지역, 상업지역, 공업지역, 녹지지역으로 세분되며, 각 지역의 면적 규모와 분포를 통해 도시개발, 주택정책, 산업입지, 녹지계획 등 다양한 정책 분야에 활용될 수 있습니다. 특히 토지이용계획 수립, 용도지역 변경 심의, 개발행위허가 검토 등 도시계획 실무에 직접 활용되며, 장기적인 도시 공간 구조 분석과 공간자산 평가의 기초자료로도 유용합니다. 하남시의 도시관리계획 수립, 개발제한구역 검토, 환경영향평가 등 법정계획 수립의 사전 분석자료로 제공될 수 있습니다.
