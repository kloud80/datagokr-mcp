summary_user: 지적재조사 실시계획에 대해 토지소유자·이해관계인·지역 주민을 대상으로 여는 주민설명회의 상세 일정을 사업지구별로 담은 전국 범위 파일로, 개최일자·개최장소와 사업지구명·사업위치·사업기간·사업시행자·사업비 추산액, 공람공고 내용을 함께 담는다. 내 땅이 들어간 지적재조사지구의 설명회가 언제 어디서 열리는지 확인하려는 토지소유자나, 지역별 지적재조사 사업 규모와 시행 시기를 살피려는 분석가가 쓴다. 전역 조인 키가 없어 다른 지적·필지 데이터와는 사업지구명이나 사업위치 같은 이름·주소 매칭으로만 잇고, 같은 사업지구 안에서는 공람공고 일련번호(사업지구기준공람공고 일련번호)로 공고 단위를 구분한다.
limits: 필지고유번호(PNU)나 법정동코드 같은 전역 조인 키가 없어 필지 단위 지적 데이터와 바로 결합할 수 없고, 이름·위치 문자열 매칭에 의존해야 한다. 파일 형태로 내려받는 데이터라서 설명회 개최 결과나 주민 의견은 이 파일로 알 수 없다.
