description_portal: '* 이 데이터는 광주광역시 상수도사업본부 동북수도사업소 및 서남광산수도사업소 관할 지역에서 진행되는 수도급수공사 시공업체 현황을 정리한 자료입니다.2025년 11월 4일 기준으로 최신 정보로 업데이트(현행화)된 내용입니다.수도사업자가 일반의 수요자에게 원수 또는 정수를 공급하기 위해 다른 급수관으로부터 분기하여 설치한 급수관, 그 밖의 급수를 위하여 필요한 기구의 신설, 개조, 수선 및 철거 등의 공사를 시행하는 업체의 데이터를 보여줍니다.* 신청인께서  제공 요청하신 "수도급수공사 대행 업체 현황"은 과거와 달리, 수도급수공사 대행 업체를 지정하지 않고 연초 공개입찰로 업체를 선정하기 때문에 "2025년 급수공사 시공업체 현황" 데이터를 제공합니다. * 데이터 구성 항목 설명- 구역(District) 광주광역시를 크게 나눈 행정 구역 단위입니다. (동구·서구·남구·북구·광산구)시공업체가 어느 지역을 맡는지 구분하는 가장 큰 기준입니다.- 권역(Zone) 각 구역(예: 동구, 서구) 안에서 다시 나눈 세부 관리 구역입니다.예를 들어, 한 구역에 여러 권역(1권역, 2권역 등)이 있으며, 권역 단위로 공사와 민원이 배정되고 관리됩니다.- 동(Neighborhood) 실제로 공사가 이루어지는 ‘행정동’ 이름입니다.여러 개의 동이 하나의 권역에 묶여 있고, 공사 대상 지역을 가장 정확하게 나타내는 위치 정보입니다.- 공사계약업체(Contracted Construction Company)각 지역에서 급수공사를 맡아 수행하는 시공업체 이름입니다.신청인의 목적을 수행하는 데 적합한 자료로, 권역별로 어떤 시공업체가 어떤 동에서 공사를 담당하는지를 확인 할 수 있습니다. * 비고- 공공데이터 제공 표준 기준, 광주광역시 상수도사업본부에서 관리하는 급수공사 시공업체 정보를 취합하였습니다. - 해당 데이터 법령 소관기관 및 문의처 : 자치단체별 급수조례 / 해당 자치단체에 문의'
