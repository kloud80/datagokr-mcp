summary_user: 2025년 1월 1일 기준 전국 공동주택(아파트·연립·다세대)의 호별 공시가격을 담은 건별 원천 파일로, 포털 설명상 15,580,435건이며 법정동·지번·단지·동·호·전용면적과 공시가격이 함께 들어 있다. 보유세나 건강보험료, 복지 수급 기준을 따지는 국민·분석가가 "우리 집(특정 동·호)의 올해 공시가격은 얼마인가" 또는 지역별 공시가격 분포를 확인하는 데 쓴다. 법정동코드(bjd_cd)로 행정구역·실거래 자료와 묶고, 법정동코드·특수지코드·본번·부번으로 필지 단위 자료와 맞추며, 건축물대장PK로 집합건축물대장(전유부)과 호 단위로 연계한다.
description_portal: '국토교통부에서 제공하는 25.1.1.기준 공동주택가격(공시가격) 데이터입니다. [공동주택가격 개요] 「부동산 가격공시에 관한 법률」 의 규정에 의한 절차에 따라 국토교통부장관이 공동주택(아파트·연립·다세대)에 대하여 매년 공시기준일 현재 적정가격을 조사·산정하여 공시한 공동주택의 가격을 말함 ("적정가격"이라 함은 해당 주택에 대하여 통상적인 시장에서 정상적인 거래가 이루어지는 경우 성립될 가능성이 가장 높다고 인정되는 가격을 말함)   [파일데이터 개요]25.1.1.기준 공동주택 호별 공시가격 데이터입니다.데이터(csv), 샘플데이터(csv), 레이아웃참고자료(xlsx,png)가 압축파일 형태로 제공됩니다.본 데이터는 1,500만 건을 초과하는 대용량 파일이므로 Excel 등의 스프레드시트 프로그램으로는 정상적으로 로딩이 되지 않을 수 있습니다.따라서 대용량 csv 파일을 처리할 수 있는 전용 리더 프로그램을 통해 활용하시기 바랍니다.   [csv 데이터파일 정보] - 파일 인코딩 : UTF-8- 행 구분자 : 개행(CRLF)- 열 구분자 : ,(쉼표)- 각 열 데이터는 "(큰따옴표)로 둘러싸여 있음(text-qualifier)  * 단지명 등의 텍스트 데이터 내 ", 개행(CRLF) 문자가 포함되지는 않으므로 이에 대해 별도의 escape 처리를 하실 필요는 없습니다.- 첫 번째 행에는 헤더정보가 있음- 자료건수 : 15,580,435건 (헤더를 포함하여 15,580,436행)- 파일 해시값(SHA-256) : BBADCB0E85787F3DB157B199A6B9DF1601E995228A3976106EC5440C2CD8935C    [건축물대장 연계정보 개방] 24년도부터 본 공동주택 가격자료와 국토교통부 건축HUB에서 공개하는 집합건축물대장(전유부) 자료를 서로 연계할 수 있도록 KEY(관리건축물대장PK)를 제공해드립니다.감사합니다.'
