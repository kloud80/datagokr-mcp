description_portal: 부산도시공사 소유의 사업부지 잔여지 데이터를 공개하여 매수를 희망하는 시민들에게 정보를 제공합니다.잔여지란 공익사업 등으로 토지의 일부가 수용되거나 사용된 후에 남게 되는 토지를 말합니다. 최근 개발사업 등이 진행된 구역에 남아있는 토지이기에, 활용 방법에 따라 경제적 가치나 활용상 이점을 얻을 여지가 있습니다. 해당 내용은 소재 구, 동, 지번, 지목, 면적을 제공하여 시민들의 잔여지에 대한 접근성을 높이고, 해당 토지를 활용할 가능성을 높임으로써 공익적 가치를 실현하고자 합니다.
