summary_user: 경기도 이천시에 접수된 건축 착공 신고를 건별로 담은 원천 파일로, 신고일·설계사무소·시공사·착공 용도와 착공지의 도로명·지번 주소, 위도·경도를 담는다. 지역 분석가나 사업자가 '이천시에서 어떤 용도의 건축물 착공이 언제 어디서 늘고 있는가'처럼 지역 개발 흐름의 선행 지표를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표를 기준으로 공간 매칭하거나, 같은 이천시의 건축허가·사용승인 자료와 주소로 맞춰 이어 쓴다.
description_portal: 경기도 이천시에서 접수된 건축 착공 신고의 세부 현황을 제공하는 데이터입니다. 항목은 설계사무소명, 신고일, 도로명주소 및 지번주소, 시공사명, 착공 용도, 위도·경도 등으로 구성되어 있으며, 각 착공 건축물의 위치, 설계·시공 주체, 공사의 목적 등을 확인할 수 있습니다. 본 데이터는 지역 건축행정 관리, 개발행위 모니터링, 도시계획 수립, 건축허가 이행 확인, 공사 착공 추이 분석, 재난방재 연계자료 구축 등에 활용됩니다. 특히 착공용도 및 신고일 정보는 건축 유형별 증가 흐름을 분석하거나 허가 후 착공까지의 시차를 평가하는 데 유용하게 사용됩니다.
