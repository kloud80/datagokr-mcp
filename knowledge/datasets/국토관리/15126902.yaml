summary_user: 경기도 남양주시 산업단지 안에 입주해 운영 중인 기업을 한 업체씩 담은 명단으로, 산업단지명·업체명·업종·종업원 수·도로명/지번 주소·전화번호·생산품·관리기관을 담는다. 구직자나 영업 담당자가 남양주 어느 산업단지에 어떤 업종의 기업이 몇 명 규모로 있는지 찾거나, 분석가가 시 단위 산업단지 업종 구성을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 산업단지명·업체명·주소를 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓰며, 사업자번호가 없어 공장 등록 자료와 겹쳐 볼 때도 이름·주소 매칭에 의존한다.
description_portal: 경기도 남양주시의 산업단지 내 입주기업체 현황 데이터로 산업단지명, 업체명, 업종명, 종업원 수, 소재지주소, 전화번호, 생산품, 관리기관명에 대한 정보를 제공합니다.산업통상자원부 및 한국산업단지공단 등에서 관련 법령에 따라 산업단지 관리 기본계획 수립 및 입주 기업 관리 목적으로 수집하는 정보입니다. 「산업집적활성화 및 공장설립에 관한 법률」에 따라 지정된 산업단지(국가, 일반, 도시첨단 산업단지 등) 안에 실제로 입주하여 운영 중인 기업체(공장, 사업장)의 기본 정보와 운영 상태를 담고 있는 공공데이터입니다. 이 자료는 지역 산업 구조 분석, 산업 정책 수립, 그리고 산업단지 관리 효율화에 필수적인 기반 정보를 제공합니다.
