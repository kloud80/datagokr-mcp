summary_user: 광주광역시 서구 내 토지를 필지(지번) 단위로 소재지 지번, ㎡당 공시지가, 기준일자, 공시일자를 담은 개별공시지가 건별 원천 파일이다. 토지 소유자나 분석가가 서구의 특정 지번 땅값이 ㎡당 얼마로 공시됐는지, 해마다 어떻게 변했는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키(필지고유번호 등)가 없어, 다른 데이터와는 소재지 지번 문자열 매칭이나 같은 기관 데이터끼리만 이어 쓴다.
