description_portal: 이 데이터는 「부동산 가격공시에 관한 법률」에 따라 광주광역시 서구에서 매년 1월 1일 기준으로 개별 토지에 대해 조사·산정한 개별공시지가 현황을 수록한 것입니다.데이터에는 서구 내 토지의 소재지 지번, 공시지가(원/㎡), 기준일자, 공시일자 등이 포함되어 있으며, 각 필지는 고유번호를 통해 식별할 수 있도록 구성되어 있습니다.공시지가는 토지와 관련된 세금 부과 기준(재산세, 종합부동산세, 양도소득세 등), 개발부담금 산정, 보상평가, 공공기관의 감정평가 참고자료 등 다양한 행정·정책적 목적에 활용됩니다.또한 해당 데이터는 지번 단위의 공간 단위 식별자와 가격 정보의 시계열 변화 분석에도 유용하며, 향후 부동산 정책 수립, 지역별 지가 변동 추이 분석, 도시계획 수립 등에 핵심 자료로 활용될 수 있습니다.표준지 여부도 포함되어 있어 비교 표준지 제도와 연계된 가격 산정 체계를 파악하는 데에도 기초자료가 됩니다.
