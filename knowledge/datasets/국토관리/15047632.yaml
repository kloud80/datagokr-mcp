summary_user: 울산광역시에 등록된 전문건설업체를 업체 단위로 담은 파일 데이터로, 업체명·대표자·업종·등록번호·등록일자·업종상태·도로명주소를 포함하며 2,399행이 있다. 발주기관이나 원도급업체가 하도급 계약 전에 울산 관내 어떤 전문건설업체가 등록되어 있고 업종상태가 어떤지 확인하는 질문에 쓴다. 도로명주소(address)를 키로 다른 주소 기반 데이터와 이어 쓰며, 등록번호 필드가 있으나 조인 키로 확인된 것은 주소뿐이다.
description_portal: 본 데이터는 관내에 등록된 전문건설업체의 현황 정보이다. 업체별 명칭, 대표자, 소재지,  업종 등의 세부 내용을 포함한다. 전문건설업은 철근·콘크리트공사, 철골공사, 조적공사, 전기공사, 설비공사 등 특정 공종을 전문적으로 수행하는 건설업이다. 해당 자료는 건설 산업 정책 수립, 전문건설 시장 관리, 하도급 관리에 활용된다. 업체별 전문 공종 및 시공 능력을 파악하여 적정 업체 선정 및 하도급 계약 관리를 지원한다. 또한 전문건설 공사 품질 관리 및 업체 관리 감독에 활용되어 건설 공사의 전문성과 품질을 확보한다. 발주기관 및 원도급업체가 신뢰할 수 있는 전문건설업체를 선택하는 데 필요한 정보를 제공한다.
