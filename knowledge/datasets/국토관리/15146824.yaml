summary_user: 울산광역시도시공사가 지은 임대주택 율동위드유 아파트 단지 내 상가를 호실 단위로 한 줄씩 담은 건별 계약 현황 파일(약 1.2KB CSV)로, 위치·층·호·면적과 분양예정가격·입찰가격·계약금·중도금·잔금 및 각 납부일자, 소유권 변동일자를 담는다. 상가 입찰을 검토하는 사업자나 공공자산 관리를 살피는 분석가가 '율동위드유 상가 각 호실이 얼마에 분양·낙찰됐고 대금은 언제 납부됐나'를 확인하는 데 쓴다. 전역 조인 키는 없어 지번·도로명 주소 같은 주소 문자열이나 같은 기관(관리기관명) 기준으로만 다른 건물·토지 데이터와 이어 쓴다.
description_portal: 본 데이터는 울산광역시도시공사가 건축한 임대주택 ‘율동위드유 아파트’의 상가 계약 현황을 담고 있는 자료입니다. 데이터에는 아파트명, 행정구역(시·군·구·동), 지번, 도로명 주소와 같은 기본 위치 정보와 함께 층, 호, 공급면적, 전유부 면적, 공용부 면적 등 상가의 세부 물리적 정보가 포함되어 있습니다. 또한 분양예정가격과 분양 여부, 계약자 종류, 입찰가격, 계약금, 중도금, 잔금 등 분양 및 계약 관련 주요 재무 정보와 각 납부일자(계약금·중도금·잔금 납부일자)가 기록되어 있습니다. 더불어 소유권 변동일자, 관리기관명, 담당부서명, 안내 전화번호 등이 포함되어 있어 상가 계약의 체결 및 관리 현황을 종합적으로 확인할 수 있습니다.해당 자료는 울산도시공사가 추진하는 공공임대주택 단지 내 상가의 계약 과정을 투명하게 공개함으로써 시민과 이해관계자에게 공공자산 관리의 신뢰성을 높이고, 분양 및 계약 절차의 객관성을 확보하는 데 목적이 있습니다. 또한 잠재적인 계약자나 입주 희망자에게는 상가의 입지, 계약 조건, 납부 일정 등 실질적인 의사결정에 필요한 정보를 제공하며, 연구자와 정책 담당자에게는 공공임대주택 상가 운영 및 자산 관리 정책 수립을 위한 기초 자료로 활용될 수 있습니다.
