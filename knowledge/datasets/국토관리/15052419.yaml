summary_user: 서울특별시 부동산 실거래 신고 내용을 필지·건물 단위 건별로 담으며, 자치구·법정동·지번, 건물명, 계약일, 물건금액, 건물·대지권면적, 층, 건축년도, 건물 용도, 해제일 등을 포함한다. 서울에서 집을 사려는 시민이나 시장 분석가가 '특정 동의 아파트가 최근 얼마에 거래됐는가'처럼 지역·건물별 거래가격 흐름을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으므로, 자치구 코드(CGG_CD)·법정동 코드(STDG_CD)와 본번·부번 같은 지번 정보를 이름·코드 매핑해 같은 기관의 다른 데이터나 건축물·공시가격 자료와 연결한다.
description_portal: 서울특별시 부동산 실거래가 정보로 자치구, 법정동, 신고년도, 업무구분, 물건구분, 대지권면적, 관리구분, 건물면적, 건물주용도, 물건금액, 건물명, 건축년도  등의 실거래가 정보를 제공합니다.※ 미리보기에서 필드명 신고년도로 필터선택 후 연도별로 조회 및 내려받기 하여주시기 바랍니다.제공부서는 서울특별시 도시공간본부 토지관리과(02-2133-4672)입니다."해당 데이터의 원본시스템은 '서울부동산정보광장 입니다."※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
