description_portal: 해당 데이터는 녹색자금통합관리시스템에서 사업관리 목적에 따라 등록된 증빙 서류 등에 대해 변경 또는 보완 요청된 정보를 체계적으로 정리한 데이터입니다. 주요 항목으로는 변경 요청 아이디, 제안서 아이디, 변경 요청 차수, 변경 요청 내용, 첨부 파일 마스터 아이디, 변경 일시, 사용 여부, 등록 일시, 수정 일시 등이 포함되어 있습니다. 이 데이터는 사업 집행의 투명성과 행정 효율성을 높이는 데 중요한 역할을 하며, 녹색자금 지원 사업의 사후관리 및 평가 과정에서 참고 자료로도 활용될 수 있습니다. 특히 변경 요청 사항은 HTML 형식으로 작성되어 있으며, 이를 통해 다양한 형식의 요청 내용을 시각적으로 확인하거나 시스템 상에서 쉽게 처리할 수 있도록 구성되어 있습니다.
