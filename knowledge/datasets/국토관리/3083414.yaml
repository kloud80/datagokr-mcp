summary_user: 제주시 관내 등록 민간 임대사업자 수를 연도별로 보유 주택 호수 규모와 사업자 유형(주택건설·건축법허가자·매입임대·기업형·일반형)별로 나눠 담은 집계표이며, 파일 크기가 380바이트에 불과한 소규모 통계다. 제주시의 임대주택 공급이 소규모 생계형 사업자 중심인지 대규모 기업형 사업자 중심인지 확인하려는 분석가나 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 임대차·전월세 데이터와는 연도와 시군구 이름(제주시)을 맞춰 붙여 쓴다.
description_portal: 본 데이터는 제주특별자치도 제주시 관내에 정식으로 등록되어 활동 중인 민간 임대사업자의 규모와 유형별 세부 등록 현황을 종합적으로 제공하는 공공 통계 자료입니다.해당 데이터셋은 임대사업자가 실제로 등록 및 운용하고 있는 임대 주택의 호수 규모에 따라 사업자 분포를 세분화하여 보여줍니다. 이를 통해 제주시 내 소규모 생계형 임대사업자와 대규모 기업형 임대사업자의 비율 등 사적 임대 시장의 공급 주체 규모를 파악할 수 있습니다.또한, 관련 법령과 사업 등록 방식에 따른 세부적인 임대사업자 유형 통계를 수록하고 있습니다. 직접 주택을 건설하여 임대하는 "주택건설사업자" 및 "건축법허가자사업자"부터 기존 주택을 사들여 임대하는 "매입임대사업자", 그리고 등록 기준에 따른 "기업형임대사업자" 및 "일반형임대사업자" 등으로 세밀하게 분류되어 있습니다. 이 데이터는 제주시 지역 내 민간 임대주택의 공급 구조를 진단하고, 부동산 임대 시장의 법적·제도적 기반이 어떻게 구성되어 있는지 분석하는 데 사용될 수 있습니다.
