summary_user: 경기도 수원시에 한국토지주택공사 등이 공급한 공공임대주택을 단지(아파트) 한 건씩 담은 파일로, 단지명·도로명/지번 주소·위도·경도·세대수·사용검사일·동수·층수를 포함하며 범위는 수원시 한 개 시군구다(csv 약 3.4KB). 수원시에서 공공임대 단지가 어디에 몇 세대 규모로 있고 언제 준공됐는지 알아보려는 주민이나, 지역별 공공임대 공급 분포를 지도로 살피려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소(도로명·지번)나 단지명 매칭, 또는 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 경기도 수원시의 공공임대주택 현황을 제공하며 한국토지주택공사 등에서 수원시에 공급하는 임대주택을 알아볼수 있도록 관련 데이터를 제공합니다. 데이터 포함사항은 아파트명(단지명), 소재지 도로명 주소, 소재지 지번주소, 위도, 경도, 세대수, 사용검사일(준공일 등), 동수, 층수, 데이터 기준일자 등을 포함합니다.다만 본 데이터는 LH에서 진행중인 모든 사항을 포함할수 없는 바, 보다 상세한 내용은 한국토지주택공사에 문의하여 주시기 바라며 분양전환사항 및 분양계약 관련사항 등도한국토지주택공사에 문의하여 주시기 바랍니다.
