summary_user: 충청남도 홍성군 내 공동주택을 단지 한 건씩 담은 목록 파일(csv, 약 8.6KB)로, 단지명·법정동 주소·위경도·연면적·동수·세대수·사용승인일과 전용면적 구간별(60㎡ 이하~135㎡ 초과) 세대 수를 담는다. 홍성군에서 소형·중형 평형 위주 단지가 어디에 몰려 있는지, 오래된 단지가 얼마나 되는지 살피려는 주민·중개업자·정책 담당자가 쓴다. 전역 조인 키(K-apt 단지코드 등)는 없어서 실거래·공시가격·K-apt 관리비 데이터와는 단지명과 법정동 주소를 맞춰 잇고, 위경도로 지도 위에 겹쳐 쓴다.
limits: K-apt 단지코드 같은 공통 키가 없어 다른 주택 데이터와 연결할 때 단지명 표기 차이로 매칭이 어긋날 수 있다. 범위가 홍성군 한 곳이어서 다른 시군과 비교하려면 해당 시군의 자료를 따로 모아야 한다.
