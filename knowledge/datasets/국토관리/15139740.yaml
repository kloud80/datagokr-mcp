summary_user: 재난안전데이터 공유플랫폼(safetydata.go.kr)이 제공하는 전국 취수장·정수장 시설 목록으로, 시설 한 곳마다 GIS 관리번호·일련번호, 주소, 전화번호, 취득일자를 담는 건별 원천 데이터다. 지자체 상수도 담당자나 분석가가 '우리 지역 수돗물을 만드는 취·정수장은 어디에 있고 연락처는 무엇인가'를 확인하거나, 상수도 시설 현황을 지도·목록으로 정리할 때 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙일 전역 조인 키가 없어서, 정수장별 수질검사 등 다른 상수도 데이터와는 주소나 시설명을 매핑하거나 같은 기관 코드로만 잇는다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 취정수장 정보로, GIS관리번호, GIS일련번호, 주소, 전화번호, 취득일자 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
