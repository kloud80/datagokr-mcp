summary_user: 리츠정보시스템에 등록된 리츠 관련 투자자문회사를 회사 한 곳당 한 건으로 담으며, 회사번호·회사명·대표이사명·대표전화번호·설립일·회사현황·승인진행 상태를 제공하고 범위는 전국이다. 리츠 시장을 분석하거나 실사자료를 쓰는 사람이 '지금 운영 중인 리츠 투자자문회사는 어디이고 대표자와 연락처는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 회사명 매칭이나 국토교통부 리츠정보 내 회사번호(icbNo)로만 이어 쓴다.
description_portal: 리츠정보시스템에서 관리하는 리츠 관련정보 중 운영중인 투자자문회사 정보 (대표이사, 회사 전화번호, 설립일 등)를 제공합니다. 해당 데이터는 리츠 관련 자문사의 기본 프로필을 조회할 수 있도록 구성되어 있으며, 정책 수립, 시장현황 분석, 투자자·임차인 등의 실사자료 작성, 행정업무 및 민간 서비스 연계용 연락처·기업목록 구축 등에 활용할 수 있다. 본 서비스는 REST(HTTP) 기반 호출 방식을 통해 JSON 형식으로 응답을 제공하며, 시스템에 등록되거나 수정된 사항을 기준으로 주기적으로 갱신된다. 데이터 연계 시에는 동일 법인을 정확히 식별하기 위하여 회사명과 사업자등록번호를 키로 사용하는 것을 권장한다. 출력 결과는 투자자문회사명, 대표이사명, 회사전화번호, 설립일, 사업자등록번호, 소재지(주소), 이메일, 홈페이지, 등록상태, 등록일 등으로 제공된다.
