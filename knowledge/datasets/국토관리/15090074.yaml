description_portal: 경기도 여주시 건축사사무소 공공데이터입니다. 여주시민이 건축사사무소의 개설신고 여부를 확인할 수 있도록 건축사법」 제23조 및 같은 법시행령 제24조에 따라허가등록된 업체를 확인할 수 있는 자료를 제공하는 것으로 양질의 건축서비스를 제공하기 위하여 공개되는 자료 입니다.지료의 구성은 여주시 내 건축사 사무소의 신고 현황에 대한 데이터로 사무소명, 소재지도로명주소, 관리기관명, 전화번호 등과 같은 정보를 제공합니다.자료제공은 연간 제공할 예정입니다. 이 데이터를 활용하여 지역별 건축사사무소의 분포와 규모를 파악하고, 건축 관련 업무의 원활한 처리를 위한 정책을 수립할 수 있습니다.
