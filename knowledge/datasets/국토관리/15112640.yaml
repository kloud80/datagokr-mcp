summary_user: 강원특별자치도 안의 지역주택조합을 조합 한 곳당 한 행으로 담고, 조합명·사업지 위치·세대수와 모집신고·설립인가·사업계획승인·착공·준공·해산 날짜를 기록한 작은 파일(약 1.3KB CSV)이다. 지역주택조합 가입을 검토하는 도민이나 주택 공급을 보는 분석가가 '이 조합은 설립인가 뒤 착공까지 갔는가, 시군별로 몇 세대가 공급 예정인가'를 확인하는 데 쓴다. 실측 컬럼에 법정동코드 같은 공통 조인 키가 없어, 다른 주택 인허가·분양 데이터와는 조합명이나 사업지 위치 문자열을 맞춰 이어야 한다.
description_portal: 강원특별자치도 내 지역 주택조합 사업 현황1. 개요  - 조합명  - 모집신고일자  - 설립인가일자  - 사업지위치  - 세대수  - 사업계획승인일  - 착공일  - 준공일  - 해산일2.1 사업 추진 현황모집신고일부터 준공일까지 사업 진행 기간이 조합별로 상이3.2 공급 규모 분석지역별 세대수 분포를 통해 각 시군별 공급 규모 파악 가능3.3 사업 진행 상태3.4 시기별 사업 계획모집신고일과 착공일을 통해 사업 시작 시점과 추진 속도 파악 가능4. 활용 방안 - 조합별 사업 진행 상황 모니터링 및 지연 사업 관리 - 시군별 아파트 공급 규모와 시기 분석을 통한 부동산 정책 및 인프라 계획 수립 - 대규모 공급 단지 중심으로 주택 수요 예측 및 분양 전략 수립 지원* 지역주택조합 관련 법 개정 전후 등록된 자료 양식의 차이로 일부 값이 공란으로 제공됩니다* 일부값은 행정절차 이행 등의 사유로 공란으로 제공됩니다
