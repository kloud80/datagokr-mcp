description_portal: '이 데이터는 서울주택도시공사(SH공사)가 관리하는 임대주택 단지의 현황을 정리한 자료로, 서울시 각 자치구에 위치한 임대주택의 공급 실태를 한눈에 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 자치구, 단지명, 임대유형(예: 영구임대, 행복주택), 주소, 전체 세대수, 임대 세대수, 사용승인일이 포함되어 있으며, 이를 통해 단지별 공급 규모, 공공임대 비율, 준공 시기 등을 종합적으로 확인할 수 있습니다. 특히 임대유형별로 공급 방식과 입주 대상이 상이하기 때문에, 유형별로 주거복지정책의 적용 범위와 실효성을 분석하는 데 활용도가 높습니다. 또한 사용승인일을 기준으로 연차별 공급 추이를 분석하거나, 자치구별 임대주택 밀집 현황을 파악하는 데 유용한 기초자료로 활용될 수 있습니다.'
