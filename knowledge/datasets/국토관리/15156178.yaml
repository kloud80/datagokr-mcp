summary_user: 서울특별시 서초구 관내 위반건축물을 건물관리번호별로 한 건씩 정리한 파일 데이터로, 적발일자·발생년도·등록일과 도로명·지번 주소를 담는다(범위는 서초구 한 시군구, 단위는 필지·건물). 부동산 거래 전 매수 예정자나 중개사가 "이 주소의 건물이 위반건축물로 적발된 적이 있는가"를 확인하거나, 분석가가 구 안의 위반건축물 분포를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 건축물대장 등 다른 데이터와는 도로명주소·지번주소 같은 주소 문자열을 맞추는 방식으로 이어 쓴다.
description_portal: 이 데이터는 서울특별시 서초구 관내 위반건축물에 대한 관리 현황을 정리한 자료로, 각 건축물별로 부여된 고유 관리번호를 중심으로 위반건축물의 대지 위치 정보를 제공합니다. 위반건축물의 특성과 위반 유형을 파악함으로써 건축행정의 효율적인 관리 및 단속 근거자료로 활용될 수 있으며, 도시계획 수립 시 위반건축물의 분포 특성을 반영하는 데에도 도움이 됩니다.관내 건축물 위반 유형으로는 1층과 옥상에서 많이 나타나고 있습니다. 1층인 경우에는 무단으로 용도변경을 하여 음식점이나 사무실로 사용하거나 필로티나 공개공지를 무단으로 점유하여 창고로 사용하거나 카페 테라스로 사용한는 경우가 가장 많습니다. 그리고, 소상공인 점포에서는 불법간판이나 차양으로 인한 위반 형태가 보이고, 주차공간을 폐쇄하거나 전용으로 사용하는 경우도 나타나고 있습니다. 음식점 같은 곳에서는 배기및 기계설비를 불법으로 설치하는 경우도 있습니다. 옥상인 경우에는 판넬과 철골을 이용한 무단 증축을 하여 불법 옥탑방이나 창고로 사용하는 경우가 많습니다. 옥상을 불법으로 용도변경을 하여 루프탑 영업을 하거나 불법으로 난간이나 가벽을 설치하여 안전문제가 일어날수 있습니다. 카페나 식당같은 경우에는 불법으로 데크나 파고라등 시설물 설치나 실외기나 배기구등의 설비 시설물을 무단설치하여 안전문제가 일어날수 있습니다. 첨부 데이터는 행정·안전·도시관리·민원 대응 등 다양한 분야에서 매우 유용하게 활용되는 핵심 데이터입니다.특히 건축이나 도시계획·안전 분야에서 업무 효율을 크게 높일 수 있고, 지역 내 불법 건축행위 모니터링 및 정책 수립에 활용도가 높을거로 예상하고 있습니다.부동산 거래 전 거래 위험(용도제한, 이행강제금)을 사전에 예방할수 있습니다.
