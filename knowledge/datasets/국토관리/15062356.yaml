summary_user: 인천광역시 계양구 관내 계량기 제조업체를 업체 한 곳당 한 줄로 회사명·도로명 주소·전화번호를 담은 명부 파일로, 크기 714바이트의 작은 CSV다. 계량기 부품 조달이나 협력 업체를 찾는 사업자, 지역 제조업 분포를 확인하려는 구청 담당자가 '계양구에 계량기를 만드는 업체가 어디에 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 공장등록·기업 데이터와는 회사명이나 주소를 직접 맞춰 이어야 한다.
description_portal: 이 데이터파일은 인천광역시 계양구 관내 계량기 제조업체 현황을 체계적으로 정리한 자료입니다. 주요 항목으로는 각 업체의 회사명, 위치를 확인할 수 있는 도로명 주소, 그리고 연락처인 전화번호가 포함되어 있습니다. 본 데이터는 지역 내 계량기 제조업체의 분포와 현황을 파악하는 데 활용되며, 관련 산업 지원과 정책 수립에 중요한 기초 자료로 활용됩니다. 제조업체 정보 확인 및 협력, 행정 업무에 유용한 자료입니다.추가 문의사항은 **인천광역시 계양구 일자리정책과(032-450-5764)**로 연락해 주시기 바랍니다.
