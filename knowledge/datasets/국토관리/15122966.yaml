summary_user: 지적불부합지로 선정된 지적재조사 대상지구의 등록·삭제 등 변경 이력을 지구 단위로 담은 전국 범위 파일(CSV 약 2.4MB)로, 지구명·기준년도·사업예정년도·사업위치·필지수·대장면적과 추가·삭제 필지수, 수정이력수를 함께 담는다. 지자체 담당자나 분석가가 어느 지역의 재조사 대상지구가 언제 지정·변경됐고 필지가 얼마나 늘거나 줄었는지 확인하는 데 쓴다. 실측 컬럼에서 필지고유번호(PNU) 같은 전역 조인 키는 확인되지 않아, 다른 지적 데이터와는 사업위치·지구명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
