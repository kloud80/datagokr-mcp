description_portal: '지적불부합지 지정 및 변경 등에 대한 조사, 관리에 대하여 불부합지로 선정된 지구의 변경(등록,삭제) 데이터 파일입니다.- 지적불부합지 : 지적공부 관리 소홀, 무분별한 토지사용, 지적측량 오류 등으로 인해 지적공부 등록사항이 올바르지않아 일관성 있는 지적측량 성과를 기대할 수 없음에 따른 토지소유자의재산권 행사에 제약이 우려되는 토지)지적불부합지구 현황을 통해 우선순위(시급성)를 선정하여 국고보조금 신청을 통해 재조사사업을 추진합니다.연차별 사업추진 우선순위1.지적불부합 정도가 심하여 토지소유자 등이 사업추진을 적극적으로 요구하는 지역2.지적불부합 정도가 심하여 경계분쟁 소지가 높아 우선적으로 사업이 추진되어야 하는 지구3.측량 및 경계분쟁 빈도가 낮으나 지적재조사 사업이 추진되어야 하는 지역4.민원, 분쟁, 효과가 상대적으로 낮기는 하나 지적재조사사업에 따라 법정기간 내에 추진해야 되는 지역5.지적불부합이 존재하나 시급성이 적은 경우 비율 외'
