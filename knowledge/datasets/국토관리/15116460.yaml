summary_user: 광주 서구 관내에서 진행 중인 건설현장을 현장 한 곳당 한 행으로 담은 CSV 파일로, 현장명·대지위치·착공처리일·사용승인예정일을 기록한다(파일 크기 약 4KB의 소규모 목록). 주민이 우리 동네 공사가 언제 시작돼 언제 끝날 예정인지 확인하거나, 분석가가 구 단위 신축 완공 일정을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소를 지오코딩·주소 매칭하거나 같은 기관(서구) 데이터와 이름으로 맞춰 이어 써야 한다.
description_portal: 해당 데이터는 광주광역시 서구 관내에서 운영되고 있는 건설현장에 대한 정보를 수록한 자료로, 각 건설현장의 연번, 명칭, 위치, 착공일자, 사용승인예정일 등 기본 정보를 포함하고 있습니다. 이를 통해 지역 내 건설사업의 현황을 체계적으로 파악할 수 있으며, 향후 건축물의 완공 및 승인 일정에 따른 행정적 대응과 인허가 관리, 도시계획 수립, 건설 안전 점검 등에 유용하게 활용될 수 있습니다. 특히 착공일 및 사용승인 예정일 정보는 일정 관리뿐 아니라 도시 인프라 구축 속도나 생활환경 변화 예측에도 참고자료로 제공될 수 있습니다. 해당 데이터는 CSV 형태로 제공되며, 연 1회 수시로 갱신되며, 누구나 무료로 열람이 가능합니다.
