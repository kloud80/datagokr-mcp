summary_user: 충청남도 도시계획정보(UPIS)에 등록된 기타기반시설(교통·환경·유통공급 등 주요 분류에 들지 않는 도시계획시설)의 도형별 현황을 담은 파일로, 도형 관리번호·라벨명·도형 면적(제곱미터)·도형 길이(미터)를 행 단위로 담는다. 도시계획 담당자나 분석가가 충남의 기타기반시설이 어느 정도 면적과 연장을 차지하는지 파악하거나 시설 정비·개발사업 검토의 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(충청남도) 자료로만 이어 쓴다.
description_portal: 본 데이터는 충청남도 도시계획정보(UPIS) 시스템에서 관리·제공하는 기타기반시설 현황 정보로, 도시계획시설 중 교통·환경·유통공급시설 등 주요 분류에 포함되지 않는 기타 기반시설에 대한 공간적 현황을 체계적으로 정리한 자료입니다. 주요 항목으로는 현황도형관리번호, 면적_도형, 길이_도형 등이 포함되어 있어 각 시설을 지도상에서 고유하게 식별하고 시설의 규모와 공간적 형태를 정량적으로 파악할 수 있습니다. 현황도형관리번호는 시설별 공간 객체를 관리하기 위한 고유 식별값이며, 면적과 길이 정보는 시설의 점유 범위와 연장 규모 분석에 활용됩니다. 본 데이터는 도시기반시설 관리 현황 파악, 시설 확충 및 정비 계획 수립, 개발사업 검토, 도시관리계획 수립 등 공간 기반 행정 의사결정을 지원하는 기초 자료로 활용됩니다.
