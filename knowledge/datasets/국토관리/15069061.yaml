summary_user: 주택관리공단이 관리하는 임대주택 단지의 예비입주자 모집 공고를 공고·전용면적 단위로 담은 전국 범위 파일(CSV 약 1.9MB)로, 모집구분·관리소·접수기간·당첨자 발표일·모집호수와 계약금·잔금·월임대료를 담는다. 임대주택 입주를 기다리는 국민이 어느 관리소에서 어떤 면적의 예비입주자를 언제까지 모집하고 보증금과 월임대료가 얼마인지 확인하거나, 분석가가 지역·면적별 공공임대 임대료 수준과 모집 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청약·임대 데이터와는 관리소명·단지명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 주택관리공단 예비입주자 모집(임대주택)에 대한 데이터로 모집구분, 관리소, 모집공고일, 당첨자발표일, 문의전화, 전용면적, 모집호수, 계약금, 잔금, 월임대료 등의 항목을 제공합니다.예비입주자 모집을 위해 작성된 게시글을 확인하는 방법은 주택관리공단 대표 홈페이지(https://www.kohom.or.kr/web/main/index.do) 와 단지내 게시물을 통해서 확인이 가능하며,더 상세한 내용은 예비입주자 모집 내용을 작성한 관리소로 방문해서 문의하거나 전화로 문의하시면 됩니다.
