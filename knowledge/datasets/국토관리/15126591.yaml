summary_user: 경기도 의왕시 관내 공장을 한 곳씩 담은 등록 현황 파일로, 회사명·공장 대표주소(도로명·지번)·업종명·연락처·종업원수·생산품·주원자재를 공장 단위로 수록한다. 지역 분석가나 기업 유치 담당자가 '의왕시에 어떤 업종의 제조공장이 어디에 몇 명 규모로 있고 무엇을 만드는가'를 파악하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 주소를 지오코딩하거나 회사명·업종명을 이름으로 맞춰 이어야 한다.
description_portal: 이 데이터는 의왕시 관내 공장의 기본 현황을 수록한 자료로, 회사명, 공장 대표주소(도로명 및 지번), 업종명, 전화번호, 팩스번호, 종업원수, 생산품, 주원자재 등으로 구성되어 있습니다. 해당 정보는 지역 내 제조업체의 산업분포와 운영규모를 파악하는 데 유용하며, 기업별 주요 생산품과 원자재 현황까지 포함되어 있어 산업 구조 분석에도 활용됩니다. 또한 종업원 수 데이터를 통해 고용 규모를 파악할 수 있어 지역 일자리 현황 분석에도 참고가 됩니다. 공장별 연락처 정보는 유관기관 또는 민간 기업 간의 협력 및 문의에 필요한 기초자료로 제공되며, 산업 입지 분석, 기업 유치 정책 수립, 산업 기반 조성 등의 행정 업무에도 활용 가능합니다. 본 데이터는 의왕시 산업 현황을 정량적으로 이해하는 데 필수적인 기초자료입니다.
