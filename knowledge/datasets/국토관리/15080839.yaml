summary_user: 포항시 관내에서 현재 시공 중인 건축공사 현장을 건별로 담은 파일(csv, 약 10KB)로, 대지위치·주용도·착공예정일과 착공처리일·설계·감리·시공 사무소명을 기록한다. 시민이 내 집 주변에서 어떤 건물이 언제 착공해 어느 시공사가 짓고 있는지 확인하거나, 분석가가 포항 지역 건설현장의 용도별 분포와 참여 업체를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 건축 인허가·건축물대장 데이터와는 대지위치(주소) 문자열이나 업체명 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 포항시청 도시안전주택국 건축디자인과에서 관리하는 자료로, 포항 관내에서 진행 중인 주요 건축물의 건설현장 시공 정보를 투명하게 제공하는 것을 목적으로 합니다.제공 범위는 시민들의 주거 안정을 위한 공동주택을 비롯하여, 일상생활과 밀접한 제1·2종 근린생활시설, 지역 경제 활성화의 기반이 되는 창고·공장·업무시설, 그리고 자동차 관련 시설, 운동시설, 노유자시설 등 다양한 용도의 건축 공사 현장을 포함합니다.데이터의 세부 항목으로는 각 공사 현장의 명칭, 위치, 시설 용도, 시공사 정보 및 현재 공정 상태 등이 상세히 기록되어 있습니다. 이를 통해 시민들에게는 내 집 주변의 공사 현황에 대한 알 권리를 보장하고, 관련 기업 및 연구 기관에는 지역 건설 산업 분석을 위한 기초 자료로 활용될 수 있도록 구성하였습니다. 포항시는 앞으로도 안전하고 체계적인 건축 행정 서비스를 위해 데이터 최신성을 지속적으로 유지할 계획입니다.
