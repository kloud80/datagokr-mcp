description_portal: '- 전라남도 공간정보 통합 플랫폼에 게재된 습지 및 도서정보(습지 및 도서의 좌표 정보 등)에 대해 조회하실 수 있습니다.- 전라남도는 섬의 고장으로 불릴 만큼 수많은 섬들이 분포해 있으며, 각 섬은 고유한 자연경관과 문화유산을 지니고 있습니다. 전라남도의 섬들은 관광, 생태, 어업, 문화 등 다양한 분야에서 중요한 역할을 하고 있습니다.- 전라남도는 풍부한 자연환경과 다양한 생태계를 보유한 지역으로, 습지 생태계의 보존과 복원을 통해 생물 다양성 유지와 지역 환경 관리를 적극적으로 추진하고 있습니다. 전라남도는 습지의 생태적 가치를 인정하고, 이를 보전하기 위한 다양한 사업을 추진하고 있습니다.'
