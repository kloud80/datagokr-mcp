description_portal: '본 데이터는 경남개발공사에서 시행한 중리, 삼계 등지의 공동주택 및 상가 분양사업에 대한 공급 내역 자료로, 분양대상 사업명, 블록 코드, 분양 구분(예: 아파트, 상가 등), 약정 금액, 건물 공급가액, 부가가치세 및 등록일시 등의 정보를 포함하고 있습니다. 이 데이터는 각 분양 건별로 건물 또는 상가의 공급가격을 확인할 수 있으며, 총 분양 약정 금액과 실제 공급가액 간의 비교 분석, 사업지구별 공급 현황, 유형별 분양금액 집계 등에 유용하게 활용될 수 있습니다. 특히 건물만 공급된 사례에 초점을 맞추어 토지공급가액이 0원으로 나타나고 있으며, 공급 시점과 공급 구분의 코드값을 함께 제공하여 공공주택 정책 분석이나 지역 개발사업 성과 분석에 활용할 수 있습니다. 부가세 표시 항목도 포함되어 있어 회계정보 기반의 분양가 총액 검토에도 활용 가능합니다.'
