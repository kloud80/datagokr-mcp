description_portal: 강원특별자치도 인제군의 원룸 및 다가구주택 현황입니다.다가구주택이란 주택으로 쓰이는 층수(지하층 제외)가 3개 층 이하이고, 1개 동의 주택으로 쓰는 바닥면적(지하주차장 면적 제외)의 합계가 660m2 이하이며, 19세대 이하가 거주할 수 있는 주택을 말한다.다만, 다가구주택의 층수를 산정함에 있어서 1층의 전부 또는 일부를 필로티 구조로 하여 주차장으로 사용하고 나머지 부분을 주택 외의 용도로 쓰는 경우에는 해당 층을 주택의 층수에서 제외한다.다가구주택은 「건축법」에 의한 용도별 건축물의 종류상 단독주택에 해당한다.
