summary_user: 행복도시(세종시 행정중심복합도시) 안의 임대주택 착공 세대수를 연도별로, 통합공공임대·영구임대·국민임대·행복주택·5년임대·10년임대·공공지원 유형별 열로 나눠 담은 집계 파일이다(csv 약 521바이트의 소규모 표). 연구자나 정책 담당자가 '행복도시에서 어느 해에 어떤 유형의 공공임대가 얼마나 착공됐나'를 확인하고 유형별 공급 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(연도)를 기준으로 맞추거나 같은 기관의 행복도시 주택 공급 자료와 이름으로 대조해 이어 쓴다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 임대주택 착공 현황을 연도별·유형별로 제공합니다. 통합공공임대, 영구임대, 국민임대, 행복주택, 5년임대, 10년임대, 공공지원 등 다양한 임대 형태별 착공 세대수를 포함하고 있어, 시기별 공급 규모와 유형별 차이를 비교할 수 있습니다.이를 통해 행복도시 내 공공임대주택 공급 추이와 주거복지 정책 추진 상황을 종합적으로 파악할 수 있으며, 청년·신혼부부·저소득층 등 계층별 수요 대응 정책 수립, 주택시장 분석, 연구기관의 통계 자료 등으로 활용 가능합니다.
