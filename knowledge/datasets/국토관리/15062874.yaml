summary_user: SH공사가 공급한 역세권 청년주택 중 밀집 지역에 해당하는 단지를 단지 한 건씩 유형·자치구·단지명·세대수·공급년월일로 정리한 작은 파일(CSV 635바이트)이다. 청년 주거정책 분석가나 자치구 담당자가 어느 구에 언제 몇 세대의 역세권 청년주택이 몰려 공급됐는지 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 자치구 이름이나 단지명을 맞춰 붙여야 한다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 추진한 역세권 청년주택의 공급 현황 중 특히 밀집 지역에 해당하는 단지 정보를 정리한 자료입니다. 항목으로는 주택 유형(임대 또는 분양 등), 지역(자치구), 단지명, 세대수, 공급 연월일 등이 포함되어 있어, 특정 시기와 지역에 어느 규모의 청년주택이 공급되었는지를 구체적으로 확인할 수 있습니다. 역세권 청년주택은 교통 접근성이 우수한 지역에 청년층을 위한 주거공간을 확보하는 정책 사업으로, 본 데이터는 공급 밀집 지역의 특징 분석, 주거 수요 대응력 평가, 정책 수혜 지역 식별 등 다양한 도시계획 및 청년복지 분석에 활용될 수 있습니다. 특히 자치구별 분포나 공급 시기별 추이를 통해 청년 인구 밀집도와의 상관관계도 검토 가능합니다.
