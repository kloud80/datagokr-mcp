description_portal: 하천수 사용허가 절차를 통해 허가를 받은 시설물은  하천법 제15조, 시행령 제55조, 동법시행규칙 제8조 및 제27조에 따라 수문조사시설 관리대장과 하천수 사용허가 대장에 등재하여 관리합니다.본 데이터는 4개 홍수통제소별 사용허가 및 시설물 현황에 대한 데이터를 제공하며 허가번호, 시설물명, 허가량, 용도(생활, 공업, 농업), 허가종료일 등의 정보를 제공합니다.또한 시설물별 하천수 사용계획 및 실적 등을 보고합니다.(참고) 보고대상 시설물 생활 5천m3/일, 공업 1천m3/일, 농업 8천m3/일
