summary_user: 전국 승강기의 사고·고장 이력을 건별로 담으며, 사고날짜·사고번호·고장/사고 구분·사고유형·원인·결과와 소재지·건물명을 함께 제공한다. 승강기고유번호를 넣어 특정 승강기가 과거에 어떤 고장이나 사고를 겪었는지 확인하려는 건물 관리자·입주민·안전 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 승강기관리번호(elvtrMgtNo1·2)나 주소·건물명을 매핑해 같은 기관의 다른 승강기 데이터와 연결한다.
limits: 승강기고유번호를 필수로 넣어 조회하는 구조라 전국 사고 현황을 한 번에 내려받는 용도에는 맞지 않는다. 다른 데이터와 공통 코드로 바로 붙지 않아 주소·건물명 같은 이름 매칭이나 같은 기관 번호 체계로만 연결된다. 개발계정은 하루 10,000회로 호출이 제한된다.
