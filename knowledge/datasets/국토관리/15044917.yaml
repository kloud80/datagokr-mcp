summary_user: 경상남도 거창군에 등록된 제조업 공장을 한 곳씩 담은 명부로, 회사명·대표자명·전화·팩스·도로명/지번 소재지·생산품을 공장 단위로 담는다(시군구 범위, 개별 주소 단위). 거창군에서 특정 품목을 만드는 제조업체를 찾거나 지역 내 공장 분포를 파악하려는 사업자·분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어 다른 데이터와는 회사명·주소 문자열을 매칭하거나 같은 기관 데이터로만 이어 쓴다.
