summary_user: 경기부동산포털이 제공하는 경기도 내 아파트 단지별 현황을 한 단지 한 행으로 담으며, 분양형태·난방방식·동수·세대수·사용승인일·관리비 부과면적·관리방식·관리사무소 연락처와 전용면적 구간(60㎡ 이하~135㎡ 초과)별 세대수를 포함한다. 입주 예정자나 분석가가 "우리 동네 단지들의 관리방식·난방방식·면적 구성이 어떻게 다른가"를 비교하거나 단지 관리 특성을 정리할 때 쓴다. 아파트코드(apt_cd)와 법정동코드·주소가 있어 K-apt 단지코드를 매개로 실거래·공시가격·청약 단지 정보와 잇는 데 쓰지만, 실측상 전역 조인 키로 확인되지는 않아 단지명·코드 매핑으로 연결해야 한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 경기도 내 아파트 단지별 관리비 관련 정보입니다. 각 단지의 아파트코드, 아파트명, 주소, 분양형태, 난방방식, 건축물대장상 연면적, 동수·세대수와 같은 기본 현황을 포함합니다. 또한 시공사·시행사, 관리사무소 연락처, 관리방식, 홈페이지 주소 등의 관리운영 정보를 제공하며, 사용승인일과 관리비 부과면적을 기준으로 세대 면적 구간(60㎡ 이하, 60㎡~85㎡ 이하, 85㎡~135㎡ 이하, 135㎡ 초과)별 세대 분포를 보여줍니다. 이를 통해 단지별 관리 특성과 비용 구조를 비교할 수 있습니다.
