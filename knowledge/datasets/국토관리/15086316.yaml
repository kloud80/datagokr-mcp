summary_user: 한강홍수통제소가 홍수예보용 수문모형에 반영한 시설물(댐·저수지 등 관측소를 모델화한 것)별로 예보유역명·하도명·관측소코드와 총저수량·유효저수량·홍수조절용량, 계획홍수위·상시만수위·홍수기제한수위, 일류부 표고·길이, 무피해·최대가능방류량 같은 제원을 담은 시설물 목록 파일(csv, 약 50KB)이다. 홍수 예보·하천 분석가가 특정 예보유역의 댐이 홍수기에 얼마나 조절용량을 갖고 피해 없이 얼마까지 방류할 수 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 관측소코드나 시설물명칭·관리기관명을 이름·코드 매핑해 같은 기관의 수위·방류량 관측 데이터나 댐 방류 예고와 연결한다.
description_portal: 한강홍수통제소에서는 하천의 표준 유역별로 수문 관측소를 설치하여 수문 관측소에서 저수용량 등의 수문 데이터를 수집하고 관측하고 있습니다. 이 데이터는 관측용으로 운영중인 수문 관측소를 모델화한 수문모형 시설물의 명칭 및 관측정보 등의 정보입니다. 운영중인 수문 관측소를 모델화한 수문모형 시설물의 명칭 및 시설물이 설치된 지점의 예보유역명, 하도명, 저수량 등의  데이터가 포함되어 있습니다. 이 데이터에서는 수문 관측소가 설치된 지점의 예보유역명, 하도명, 총저수량, 유효저수량, 저수용량 등의 정보를 제공하고 있습니다.
