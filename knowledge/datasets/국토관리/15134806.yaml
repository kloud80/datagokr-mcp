summary_user: 충청남도 도시계획정보(UPIS)에서 관리하는 교통시설(도로·교차로·철도·교량 등)의 현황도형을 도형 관리번호별로 담고, 시설 유형을 나타내는 라벨명과 도형의 면적(제곱미터)·길이(미터)를 함께 기록한 CSV 파일(약 35KB)이다. 도시계획·교통 담당자나 분석가가 충청남도 안 교통시설 부지 면적과 도로·철도 연장이 시설 유형별로 얼마인지 집계할 때 쓴다. 실측 컬럼에는 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(충청남도 UPIS)의 다른 도시계획시설 현황 파일과 맞춰 보는 방식으로만 이어 쓴다.
