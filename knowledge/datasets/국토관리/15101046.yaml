summary_user: 청약홈에 공고된 아파트 분양 단지를 한 행씩 담은 건별 파일로, 전국 2,594건이 2020-02-03부터 2026-04-10까지 들어 있다. 청약 대기자나 분석가가 어느 지역에서 언제 모집공고가 나고 접수·당첨자 발표·계약 일정이 어떻게 되는지, 시공사·시행사가 누구인지 확인하는 데 쓴다. 같은 기관의 'APT 주택형별 분양정보'와는 포털 설명상 주택관리번호로 매핑해 잇고, 홈페이지주소(address)는 조인 키로 실측됐으나 주택 단지 간 연결용 코드표는 명세에 없다.
description_portal: "한국부동산원(구.한국감정원)의 청약홈에서 제공하는 APT(아파트) 분양정보 데이터로 공고번호, 주택명, 공급지역명, 공급위치, 모집공고일 등의 데이터를 제공합니다.□ 주택의 종류ㅇ 국민주택  - 국가, 지방자치단체, LH 및 지방공사가 건설하는 주거전용면적 85m² 이하의 주택  - 국가나 지방자치단체의 재정 또는 주택도시기금(구 국민주택기금)을 지원받아 건설ㆍ개량하는 주거전용면적 85m²이하의 주택  * 국민주택규모 : 주거전용면적 85m² 이하. 단, 수도권 및 도시지역이 아닌 읍ㆍ면 지역은 주거전용면적 100m² 이하ㅇ 민영주택 : 국민주택을 제외한 주택※ 청약홈 APT 주택형별 분양정보 확인이 필요하신 경우, 아래 파일데이터의 '주택관리번호'와 매핑하여 활용하시기 바랍니다. - 한국부동산원_청약홈_APT 주택형별 분양정보(https://www.data.go.kr/data/15101047/fileData.do)"
