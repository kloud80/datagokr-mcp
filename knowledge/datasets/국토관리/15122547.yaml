summary_user: 전북특별자치도 시군구별로 30년 이상 지난 노후주택 수를 단독·다중·다가구·공동·아파트·연립·다세대 주택 유형별로 집계하고 합계를 담은 830바이트 크기의 CSV 파일이다. 지자체 주택정책 담당자나 분석가가 '전북 어느 시군에 30년 넘은 단독주택이나 아파트가 많아 주거환경 개선·안전점검이 먼저 필요한가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 주택·인구 통계와는 시군구 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 전북특별자치도 내 각 시군구별 30년 이상 경과한 노후주택 현황을 유형별로 상세히 기록한 자료입니다. 단독주택, 다중주택, 다가구주택, 공동주택, 아파트, 연립주택, 다세대주택 등 주택 종류별로 노후 건축물의 수량을 집계하여, 총합을 포함하고 있습니다. 이를 통해 지역별 주택 노후화 정도와 주거환경 개선 필요성을 파악할 수 있으며, 주택 정책 수립과 주거 복지 향상, 안전진단 및 재개발 계획 수립에 필수적인 기초자료가 됩니다. 특히 노후 주택 비율이 높은 지역을 중심으로 주거환경 개선 사업, 안전점검, 리모델링 지원 정책 마련에 효과적으로 활용할 수 있습니다.
