summary_user: 부산광역시 동구에 등록된 공장을 한 곳당 한 행으로 담은 파일(csv, 약 10KB)로, 회사명·공장 주소·업종명·생산품과 남녀·외국인 종업원 수를 담는다. 동구에 어떤 업종의 공장이 어디에 몰려 있고 고용 규모가 어느 정도인지 확인하려는 구청 산업 담당자나 입지를 검토하는 사업자가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명이나 공장 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 2026년도 기준으로 부산광역시 동구 안에 있는 공장들의 등록 현황을 정리한 것입니다. 생산업체명, 주소, 업종 등 기본적인 정보가 포함되어 있습니다. 이 자료를 통해 부산 동구 지역에 어떤 공장들이 어디에 위치해 있고, 어떤 업종을 주로 운영하는지 한눈에 파악할 수 있습니다. 최근에는 스마트공장 도입, 친환경 산업 전환, 노후 공업지역 재정비와 같은 변화도 활발히 이루어지고 있습니다. 이 데이터는 이런 변화에 대응하고, 지역 산업을 효율적으로 관리하고 발전시키는데 필요한 기초 자료입니다. 특히 정책 수립, 산업 지원 계획, 입지 분석, 통계 보고 등에 이 자료를 활용할 수 있으며, 지역 산업 환경을 이해하거나 사업 타당성을 검토하는 데 유용합니다.
