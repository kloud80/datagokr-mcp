summary_user: 대구광역시가 제작·갱신한 1/1,000 수치지형도의 도엽(지도 한 장)별 제작 정보를 담은 파일로, 제작일·도엽번호·도엽명·파일 정보·사업명·고시번호 등을 행 단위로 기록한다. 측량·설계 업체나 공공공사 담당자가 "우리 사업 구간의 수치지형도는 언제 어떤 사업으로 만들어졌고 고시번호는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 도엽번호·도엽명 같은 이름·코드 매핑이나 같은 기관(대구광역시) 자료끼리로만 연결한다.
description_portal: 1/1,000 수치지형도(수치지도, 고정밀 전자지도) 사업관련 정보로 제작일, 도엽번호, 도엽명, 사업명, 사업설명, 고시번호, 기타설명 등의 항목을 포함합니다.수치지형도의 데이터는 교통, 수계, 해양, 건물 및 시설물, 문화 및 시설, 식생, 지형, 경계, 주기 등 9개 대분류로 이루어져 있으며 건물, 도로, 지형지물 등을 지도에 정밀하게 표시해 공공공사 도면 제작, 재난시설 설치 등에 활용하는 전자지도로 1/1,000 축척의 고정밀로 제작되어 있습니다.대구시 9개 구·군에 걸쳐서 제작되며 예산범위 내에서 제작연도가 오래된 구간위주로 갱신하고 있습니다.
