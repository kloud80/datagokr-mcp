description_portal: 인천광역시 부동산 거래 현황 공공데이터는 지역 내 토지와 건축물, 주택 거래의 세부 흐름을 종합적으로 보여주는 자료입니다. 주요 항목은 토지거래 필지수와 면적, 토지매매거래 필지수와 면적, 순수토지거래 필지수와 면적을 포함하여 토지 시장의 규모와 변화를 파악할 수 있도록 구성되어 있습니다. 또한 건축물거래 동·호수와 면적, 주택거래 동·호수와 면적, 주택매매거래, 아파트 매매거래 등 건축물과 주택 거래 현황도 함께 제공되어 주거 시장의 동향을 분석하는 데 유용합니다.해당 데이터는 부동산통계정보(R-one)에서 참고하였으며 공공데이터포털에서도 무료로 확인할 수 있습니다.
