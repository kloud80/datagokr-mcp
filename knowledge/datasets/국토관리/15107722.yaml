description_portal: 경상북도 안동시에 위치한 주택보급률에 관한 데이터셋입니다. 경상북도 안동시에 위치한 주택보급률의 구분, 주택수, 가구수, 보급률에 관한 정보를 포함하고 있습니다.주택보급률이란 전체 가구 수에 대한 주택 수의 비율로 집이 필요한 가구 수 만큼 집이 얼마나 지어져 있는지를 나타내는 지표입니다.  여기서 가구수란주거와 생계를 같이하는 사람들의 집단을 세는 단위로, 매년 7월말~8월초에 통계청에서 공시한 가구수를 활용합니다.   또한 주택수란 다가구주택을 포함한 단독주택, 아파트, 연립주택, 다세대 주택 등의 수를 나타냅니다.
