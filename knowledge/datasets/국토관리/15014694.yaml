limits: 표준 조인 키(법정동코드·PNU 등)가 없어 다른 공간·건축 데이터와 바로 결합되지 않는다. 범위가 부산진구 한 시군구에 한정되어 다른 지역과 비교하려면 기관별 파일을 따로 모아야 한다.
