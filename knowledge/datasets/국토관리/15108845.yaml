summary_user: LH가 관리하는 전국 임대주택단지의 에너지 정보를 건물(단지) 단위로 담으며, 건물명으로 검색해 단지 식별번호·단지명·도로명주소와 함께 조회하는 API다. LH 임대주택 입주를 고려하는 국민이나 공공임대 에너지 효율을 비교하는 분석가가 '이 단지의 에너지 정보는 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지명이나 도로명주소(ronm_adr)를 이름 매칭하거나 같은 기관(LH) 단지 코드로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 전월세 실거래·건축물대장 등과 연결하려면 단지명·주소 문자열 매칭이 필요하다. 개발계정은 하루 10,000회로 호출이 제한되며, 필드의 명세상 의미가 비어 있어 에너지 항목 해석은 실제 응답을 확인해야 한다.
