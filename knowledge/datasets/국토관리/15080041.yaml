summary_user: 강원특별자치도 영월군 내 일반건축물의 시가표준액을 과세년도별로 담은 파일 데이터로, 법정동·리, 본번·부번, 동·호 단위로 물건지와 연면적, 시가표준액이 건별로 기록돼 있다. 영월군에 건물을 가진 납세자가 "내 건물의 재산세·취득세 과세 기준 가격이 얼마이고 해마다 어떻게 바뀌었나"를 확인할 때 쓰고, 분석가는 지역 내 건축물 과세가액 분포를 볼 때 쓴다. 전역 조인 키는 없어 법정동·법정리·본번·부번(지번)과 자치단체코드를 이름·코드로 맞춰 건축물대장이나 공시지가 같은 지번 기반 데이터와 연결해야 한다.
description_portal: 이 공공데이터는 일반 건축물에 대한 지방세 부과 기준이 되는 "시가표준액" 정보를 제공합니다. 시가표준액은 「지방세법」 및 「지방세법 시행령」에 따라 건축물에 부과되는 재산세, 취득세, 등록면허세 등 각종 지방세의 과세 표준을 결정하는 기준 가격을 의미합니다. 이는 실제로 거래된 가격인 실거래가와는 다르게, 부동산 시장 상황과 건축물의 구조, 용도, 경과 연수 등 다양한 특성을 고려하여 지방자치단체장이 결정하는 가격입니다. 납세자들은 이 데이터를 통해 자신이 소유한 건축물의 재산 가액을 스스로 확인하고, 연도별 변동 추이를 파악하여 합리적인 세금 납부를 준비할 수 있습니다. 또한, 지방자치단체는 이 시가표준액을 기반으로 건축물 관련 세금을 공정하고 투명하게 부과하며, 물건별 재산가액을 명확히 제시하여 유용한 정보를 제공합니다. 스마트 위택스 등 공공 서비스를 통해 시가표준액을 조회할 수도 있습니다.
