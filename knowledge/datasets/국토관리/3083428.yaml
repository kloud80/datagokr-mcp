summary_user: 제주시 관내 골재채취업체를 업체 한 곳당 한 행으로 담은 목록으로, 업종·상호·소재지·전화번호와 데이터기준일자를 기록한다. 시군구 범위의 작은 CSV 파일(약 3.7KB)이다. 건설·토목 사업자나 주민이 '제주시에서 골재를 공급하거나 채취하는 업체가 어디에 있고 연락처가 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 소재지 주소를 기준으로 맞춰 붙여야 하며, 주소를 지오코딩해 지도나 행정구역 데이터와 겹쳐 쓰는 방식이 현실적이다.
