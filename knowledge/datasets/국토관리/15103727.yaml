summary_user: 제주특별자치도개발공사가 준공해 공급한 국민임대주택 단지별 현황을 주소·준공일·전용면적·세대수·공급유형·공급형태·공급연도 단위로 담은 작은 파일(CSV 811바이트)이다. 제주에서 국민임대주택을 찾는 무주택자가 어느 단지가 언제 준공됐고 어떤 면적으로 몇 세대 공급됐는지 확인하거나, 분석가가 지역 공공임대 공급 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 임대주택·전월세 데이터와는 주소를 이용한 이름 매핑이나 같은 기관 데이터로만 연결한다.
description_portal: 제주특별자치도개발공사에서 준공하여 무주택 서민들의 주거 안정을 위해 시행하고 있는 공공임대주택사업 중 저렴한 임대료로 장기간 임대하는  국민임대주택 현황입니다. 본데이터는 해당주택의  주소, 준공일, 전용면적, 세대수, 공급유형, 공급형태, 공급연도 등  국민임대주택 현황 정보 를 포함하는 데이터입니다. 본데이터를 기반으로 하여 주거복지에 관한 정책수립, 주거복지, 연구분석 등에 활용할 수 있으며 주거가 필요한  국민들에게 국민임대주택에 대한 정보를 제공하며 주거 선택에 도움을 드립니다.
