summary_user: 울산광역시에 등록된 측량업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 업종·등록번호·업체명·영업 여부·소재지·등록일을 담는다(약 5.6KB 규모의 CSV). 공공 측량 발주 담당자나 토지 거래·건축을 앞둔 시민이 '울산에서 지금 영업 중인 측량업체는 어디이고 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명·등록번호(업등록번호)나 소재지 주소를 이름 매칭하는 방식으로만 잇는다.
description_portal: 본 데이터는 관내에 등록된 측량업체의 현황 정보이다. 업체별 명칭, 소재지, 등록 번호 등의 세부 내용을 포함한다. 측량업은 토지 및 건축물의 위치, 형상, 면적 등을 정밀하게 측정하는 기술 서비스업이다. 해당 자료는 측량 산업 육성 정책 수립, 측량업 관리, 공공 측량 발주에 활용된다. 업체별 기술 능력 및 장비 보유 현황을 파악하여 적합한 측량업체 선정을 지원한다. 토지 거래, 건축 공사, 지적 정리 등에 필요한 측량 서비스를 제공하는 업체 정보를 시민들이 쉽게 확인할 수 있도록 한다. 또한 측량업 관리 감독 및 기술 인력 관리에 활용되어 측량 서비스 품질 향상에 기여한다. 본 정보는 정기적으로 업데이트되어 최신 업체 현황을 반영한다.
