summary_user: 강원특별자치도 원주시의 착한가격업소 118곳을 업소 단위로 담은 파일 데이터로, 업종·업소명·주소·연락처·데이터기준일자를 싣는다. 원주시민이나 지역 분석가가 우리 동네에서 가격이 저렴한 외식업소·미용실이 어디인지 찾는 질문에 쓴다. 주소(address)를 조인 키로 삼아 지도 좌표 변환이나 상권·생활서비스 자료와 이어 쓴다.
description_portal: 이 데이터는 강원특별자치도 원주시에서 운영 중인 착한가격업소 등록 현황을 정리한 자료로, 서민 생활비 부담 완화, 지역 물가안정, 착한 소비문화 확산 등을 위한 정책 자료로 활용됩니다.구성 항목은 업종, 업소명, 주소, 연락처, 데이터 기준일자로 이루어져 있으며, 외식업과 미용실 등 생활밀착형 서비스업소 중 가격이 저렴하고 서비스 품질이 우수한 업소들을 대상으로 합니다.이 데이터는 지역 경제 안정화 정책 수립, 생활물가 모니터링 기반 구축, 착한소비 캠페인 기획, 지도 기반 착한가게 위치 서비스 개발 등에 활용 가능하며, 민간에서는 지역정보 플랫폼, 생활지원 앱, 소비자 정보 서비스 등의 기반 자료로도 널리 활용될 수 있습니다.
