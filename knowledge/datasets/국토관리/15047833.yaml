description_portal: 지구단위계획구역 정보는 도시·군계획 수립 대상지역의 일부에 대하여 토지 이용을 합리화하고 그 기능을 증진시키며 미관을 개선하고 양호한 환경을 확보하며,그 지역을 체계적·계획적으로 관리하기 위하여 「국토의 계획 및 이용에 관한 법률」 에 따라 도시·군관리계획으로 결정·고시된 구역 정보입니다.지구단위계획구역의 지정은 도시·군관리계획에서 계획한 지역 또는 시·군안에서 특별한 문제점이나 잠재력이 있는 곳으로서지구단위계획을 통한 체계적·계획적 개발 또는 관리가 필요한 지역을 대상으로 함을 원칙으로 하며,도시ㆍ군 관리계획으로 결정된 지구단위계획구역의 현황 도형/속성정보 및 토지이용, 건축인허가 등의상세 규제정보로서, 각 항목별로 도형(SHP) 및 텍스트(CSV) 파일로 제공하는 정보입니다.또한, 지구단위계획은 광역도시계획 및 도시기본계획 등의 상위계획의 내용과 취지를 반영하도록 하며 독립적으로 수립하거나 도시개발법, 택지개발촉진법등 개별사업법으로 지정된 사업구역에 대한 개발계획 또는 실시계획과 함께 수립하여 당해사업구역의 계획적 관리를 도모하도록 합니다.
