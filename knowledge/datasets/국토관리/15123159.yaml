summary_user: 경기도 광주시 도시계획정보시스템에 등록된 도서관·체육관·운동장·공연장 같은 공공문화체육시설을 도형 단위로 한 건씩 담고, 시설 명칭(라벨명)과 부지 면적, 선형 시설의 길이, 등록 일시를 함께 싣는다. 시 전체를 범위로 하는 작은 CSV 파일(약 12KB)이다. 광주시 안에서 공공 문화·체육시설이 어디에 얼마 규모로 있는지 보고 여가 인프라가 부족한 곳을 가늠하려는 도시계획 담당자나 분석가가 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으므로, 시군구코드나 시설 명칭을 맞춰 광주시의 다른 도시계획시설 현황과 나란히 보는 정도로 연결한다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 공공문화체육시설 현황 정보를 제공합니다. 도서관, 미술관, 체육관, 운동장, 공연장 등 주민의 문화·체육 활동을 지원하는 공공시설의 위치와 규모 정보를 담고 있습니다. 현황도형 관리번호는 각 시설을 고유하게 식별하며, 라벨명은 시설의 명칭을 나타냅니다. 면적은 시설이 차지하는 부지 면적을 제공하고, 길이는 선형 시설의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 문화체육 시설 관리, 여가 인프라 계획, 문화 정책 수립, 주민 복지 계획, 도시 기반시설 계획 등에 활용됩니다.
