summary_user: 대전광역시 동구 관내에 등록된 옥외광고업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·영업장 도로명주소·영업 내용이 들어 있다(csv 약 7KB 규모). 동구에서 간판·광고물 업체를 찾는 주민이나, 특정 지역에 옥외광고업을 창업하려는 사업자가 '동구 안에 어떤 광고업소가 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업소명이나 도로명주소를 문자열로 맞추거나 주소를 좌표로 바꿔 이어 써야 한다.
description_portal: 대전광역시 동구 관내 옥외광고업소 등록현황을 포함한 체계적인 데이터로 순번, 업소명, 영업장도로명주소, 영업내용 등 다양한 정보를 제공하고 있습니다. 이 데이터는 도시 경관 관리와 불법 광고물 정비, 간판 디자인 개선 등 도시환경 개선을 위한 기초 자료로 활용됩니다. 또한 광고업계 관계자와 창업자들은 상권 내 경쟁 현황 파악 및 시장 분석에 활용할 수 있어 사업 전략 수립에 도움을 받습니다. 이를 통해 쾌적한 도시환경 조성과 지역경제 활성화에 중요한 역할을 하며, 주민 생활 환경 개선에도 기여합니다.
