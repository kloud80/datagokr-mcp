summary_user: 서울 서대문구에 등록된 공장을 한 곳씩 담은 명부 파일로, 회사명·도로명/지번 주소·업종번호와 업종명·생산품·주원자재·관할조직을 담는다(CSV 약 7KB의 소규모 파일). 지역 분석가나 창업 준비자가 '서대문구에는 어떤 업종의 제조공장이 어디에 있고 무엇을 생산하나'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호·필지번호(PNU) 같은 전역 조인 키가 없으므로, 다른 데이터와는 주소를 지오코딩하거나 회사명·업종번호(업종 분류 코드로 보임)를 이름·코드 매칭해 이어 쓴다.
description_portal: 공장등록 현황 데이터는 공장의 설립 및 운영 현황을 파악하는 데 사용됩니다. 이 데이터는 기업의 기본 정보를 상세하게 담고 있습니다.주요 항목으로는 회사명, 공장 소재지 등의 기업 식별 정보가 포함됩니다. 업종명, 주요 생산품 등 공장의 규모와 생산 활동을 포괄적으로 나타내는 항목들이 있습니다. 이 데이터는 산업분석, 지역경제 평가, 산업정책 수립, 그리고 기업 유치 전략 마련 등 다양한 분야에 활용됩니다. 또한, 공장의 신규 설립, 휴업, 폐업, 가동 상태 등을 파악하여 지역 산업의 동향을 분석하는 데 기초 자료가 됩니다.
