description_portal: 부산광역시 사하구의 U-옥외광고물통합관리시스템 내 행정처분정보에 대한 데이터를 제공합니다. 이 데이터는 불법 옥외광고물 등의 행정처분과 관련하여 계고장 발송 내역과 전수조사 결과를 담고 있습니다. * 주소 등 개인정보가 있는 관계로 행정동으로 표시함* 주요 데이터 컬럼별 상세설명○ 계고장발송일자 → 해당 건에 대해 계고장이 실제로 발송된 날짜○ 전수조사일 → 불법 광고물 설치 여부 등을 확인하기 위한 현장 전수조사 실시일○ 시도 / 구군 / 읍면동 → 행정구역(부산광역시 사하구 등) 및 해당 위치 정보○ 전수조사건수 → 해당 날짜에 조사된 광고물 건수○ 계고장발송횟수 → 특정 건에 대해 계고장이 발송된 누적 횟수
