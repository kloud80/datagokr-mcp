summary_user: 전국 승강기의 사고·고장 이력을 건별로 담고, 승강기마다 고유번호·건물명·주소·시도/시군구, 승강기 형식·종류·정격속도·적재하중·최대정원·제조업체·설치일자와 함께 발생일자와 사고내용 및 응급조치를 제공한다. 건물 관리자나 분석가가 "우리 건물 승강기에 어떤 고장·사고가 언제 있었고 어떻게 조치됐나", "특정 제조업체나 형식의 승강기에서 사고가 잦은가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 승강기 데이터와는 승강기고유번호(elevatorNo)나 건물명·주소·시군구명 같은 이름 매핑, 또는 같은 기관 데이터의 코드로만 연결한다.
limits: 전역 조인 키가 확인되지 않아 다른 기관 데이터와 붙일 때 주소·건물명 매칭에 의존해야 한다. 조회는 자료생성일자 또는 승강기고유번호 조건으로만 가능하며, serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
