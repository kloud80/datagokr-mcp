summary_user: 전국 홍수통제소 수위관측소의 수위를 10분 간격으로 담은 관측 데이터로, 관측소 코드(WALE_OBSVTR_CD)와 관측 일시마다 수위값이 한 건씩 기록되며 범위는 전국이고 공간 좌표는 없다. 장마·태풍철에 주민이나 방송·재난 담당자가 '우리 동네 하천 수위가 지금 얼마나 올라왔고 10분 사이 얼마나 변했나'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 바로 이어 붙일 공통 조인 키가 없어서, 관측소 코드를 같은 기관의 관측소 정보와 이름·코드로 맞춰 위치·하천과 연결해야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하고 있는 홍수통제소 수위 관련 정보 데이터입니다.
