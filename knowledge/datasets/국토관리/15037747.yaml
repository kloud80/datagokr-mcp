description_portal: 부동산 거래 증가와 토지 이용에 대한 시민들의 정보 접근 필요성이 높아지고 있습니다. 부동산 정보의 투명성 확보와 민원 처리 효율화를 위한 디지털 서비스 확대 요구가 증대되었습니다. 시민들의 편의성 향상과 언제든지 부동산 정보를 확인할 수 있는 접근성 개선 필요성이 대두되고 있습니다. 부동산 중개업체와 시민들의 업무 효율성 향상을 위한 원스톱 정보 제공 서비스 확대가 필요하게 되었습니다. 공공 서비스의 디지털 전환과 스마트 행정 구현을 위한 무인 정보 제공 시스템 도입이 확산되고 있습니다. 이에 따라 충청남도 보령시는 관내 주요 지점에 설치된 원터치부동산열람시스템의 위치, 운영시간, 제공 서비스 등 시민들이 지적도면, 토지대장, 토지이용계획, 개별공시지가, 개별주택가격 등 다양한 부동산 정보를 편리하게 조회할 수 있는 종합적인 시스템 정보를 제공하고 있습니다.개방 데이터는 원터치부동산열람시스템의 설치장소, 설치위치, 운영시간, 열람정보, 소재지도로명주소, 소재지지번주소, 전화번호, 위경도 등 총 8개 항목 18건의 상세 정보를 포함하고 있습니다.부동산 중개업체·공인중개사는 인근 열람시스템 위치 파악을 통해 업무 효율성 향상 및 고객 서비스 개선에 활용하고, 시민·토지소유자는 가까운 열람시스템 이용을 통해 부동산 정보 확인 및 각종 민원 업무 처리에 활용하며, 지방자치단체·정보화 담당기관은 무인 서비스 운영 현황 분석 및 디지털 행정 서비스 개선 계획 수립에 활용할 수 있습니다.
