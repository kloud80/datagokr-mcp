summary_user: 제주국제자유도시개발센터가 운영하는 제주국제학교 브랭섬홀 아시아(BHA)의 2016-2017학년도 학생 구성을 유치원 준비과정(JK Prep)·JK·SK부터 1~12학년까지 과정별로 집계한 432바이트짜리 CSV 파일이다. 교육 연구자나 학부모가 'BHA의 학년별 학급 수·정원 대비 남녀 학생 수와 외국인·내국인 학생 비율이 어떠했는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 연도 BHA 학생현황이나 다른 제주국제학교 학생현황 파일과는 과정·학년 이름을 맞춰 붙여 쓴다.
description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주국제학교 중 브랭섬홀 아시아(BHA)의 2016년 기준 학생현황 데이터입니다. 이 자료는 2016-2017학년도 기준으로 각 과정별 학생 구성 현황을 상세히 나타내고 있으며, 주요 항목은 과정, 학급 수, 정원, 성별(남자, 여자), 국적별(외국인, 내국인)로 구성되어 있습니다. 과정 항목은 유치원 준비 과정인 JK Prep, JK 과정, SK 과정을 포함해 1학년부터 12학년까지의 전 학년을 포함하고 있어 다양한 교육 단계별 학생 현황을 파악할 수 있습니다. 학급 수와 정원은 해당 학년 및 과정별로 운영되는 학급 수와 정원 수를 의미하며, 성별 항목은 남학생과 여학생의 수를 나타내어 학교 내 성비 균형 상태를 확인할 수 있게 합니다. 국적별 항목은 외국인 학생과 내국인 학생 수를 구분하여 국제학교 특유의 학생 구성 비율을 보여줍니다. 이 데이터는 브랭섬홀 아시아의 교육 운영 현황을 체계적으로 분석하고, 학사 운영 계획, 학생 구성 관리, 국제학생 비율 조정 등에 중요한 기초자료로 활용될 수 있습니다.
