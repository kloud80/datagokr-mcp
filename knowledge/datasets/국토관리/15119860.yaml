summary_user: 경기도 내 지방하천과 소하천의 수해 피해와 복구 현황을 집계년도·하천구분별로 정리한 집계 통계로, 피해·복구 개소수, 피해·복구 물량(km), 피해·복구 금액(백만원)을 담는다. 도청 재난·하천 담당자나 분석가가 '최근 몇 년 사이 소하천과 지방하천 중 어느 쪽의 수해 피해액이 더 늘었고 복구비는 얼마나 들었나'를 확인하는 데 쓴다. 실측 컬럼에 하천코드 같은 전역 조인 키가 없으므로, 다른 하천 데이터와는 집계년도와 하천구분명(riverstrm_div_nm) 이름 매칭이나 같은 기관(경기도) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 지방하천 및 소하천의 수해 발생에 따른 피해와 복구 현황을 연도별로 정리한 자료로, 각 연도의 하천유형별 피해 규모와 복구 내역을 수치화한 통계를 포함하고 있습니다. 주요 항목은 집계년도, 하천구분명, 피해 및 복구 개소수, 피해물량(킬로미터), 피해금액(백만원), 복구물량(킬로미터), 복구금액(백만원) 등으로 구성되어 있으며, 일부 연도는 피해물량과 복구물량이 비어 있는 경우도 있습니다. 이 데이터는 연도별 수해 발생 경향 분석, 지방 및 소하천의 관리 우선순위 결정, 예산 수립, 기후변화 대응 재난관리 정책 수립 등에 활용할 수 있으며, 하천 유형별 피해 및 복구 금액의 변동 추이를 분석함으로써 재난 대응 정책의 효과성을 평가할 수도 있습니다.
