summary_user: 대구광역시 북구가 도시공원과 녹지에서 내준 점용허가를 허가 건별로 담은 목록이다. 건마다 점용 유형, 명칭, 소재지, 면적, 허가 기간, 공시지가, 점용 비용이 들어 있다. 북구 공원·녹지의 어느 위치를 무엇이 얼마의 비용으로 언제까지 점용하는지 알아보려는 주민·사업자·분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 소재지나 명칭 같은 텍스트로 맞추거나, 같은 기관(대구 북구) 데이터끼리 묶어 쓴다.
limits: 표준 조인 키가 없어 다른 공원·토지 데이터와 자동으로 연결되지 않고, 소재지·명칭 문자열을 직접 대조해야 한다. 범위는 대구 북구 한 곳뿐이어서 다른 시군구와 비교하려면 별도 데이터가 필요하다.
