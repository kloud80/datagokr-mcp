summary_user: 김해시 내 준공된 산업단지의 입주업체를 업체 한 곳당 한 행으로 담은 파일(CSV, 약 26만 바이트)로, 단지명·회사명·생산품·공장 주소(도로명·지번)·위도·경도를 담는다. 구직자나 영업 담당자가 김해시의 특정 산업단지에 어떤 회사가 무엇을 생산하며 입주해 있는지 명단을 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지명·회사명 같은 이름 매칭이나 공장 주소·좌표 기준으로 이어 쓴다. 공장 등록 현황이나 산업단지 통계가 이어 쓸 대상이다.
limits: 사업자번호나 표준 코드가 없어 공장 등록 데이터와의 대조는 이름·주소 매칭에 의존한다. 범위는 김해시 한 곳으로 한정된다. 포털 설명에 따르면 개인정보 보호와 미집계 때문에 공란이 많다.
