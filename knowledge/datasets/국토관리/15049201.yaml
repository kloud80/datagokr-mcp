summary_user: 중앙토지수용위원회가 재결서 정본을 우정사업본부와 연계해 송달할 때 쓰는 전국 읍면동 단위 법정동 코드표로, 시도·시군구·읍면·동 이름과 동코드, 이전 코드·이전 동명, 사용 여부, 수정일자, 우편번호를 담는다(CSV 약 2.6MB). 토지수용 재결 업무 담당자나 분석가가 "송달 대상 주소의 법정동이 바뀌기 전 코드는 무엇이고 현재 사용 중인 코드인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시도·시군구·동 이름 매핑이나 같은 기관의 코드(토지재결정보시스템 내부 코드)로만 이어 쓴다.
limits: 표준 법정동코드 등 전역 키와 바로 맞물리는지 확인되지 않았으므로 다른 행정구역 데이터와 붙일 때는 이름 기준 매핑을 거쳐야 한다. 토지수용 재결 건이나 보상 내역 자체는 담지 않는 보조 코드표다.
