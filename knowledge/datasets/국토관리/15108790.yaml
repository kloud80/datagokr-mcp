summary_user: 충청남도 천안시 전통시장 5곳(중앙시장, 역전시장, 성정시장, 병천시장, 성환이화시장)에 입점한 점포를 한 건씩 담은 파일로, 시장명·상호·운영시간·업종·도로명/지번주소·전화번호·위도·경도·기준일자를 제공한다. 천안 시민이나 방문객이 '성정시장에서 지금 문을 연 반찬가게는 어디인가'처럼 시장별 점포의 업종·영업시간·위치를 찾을 때, 또는 분석가가 시장별 업종 구성을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소·지번주소를 주소 매핑하거나 위도·경도로 공간 결합하는 방식으로 이어 쓴다.
