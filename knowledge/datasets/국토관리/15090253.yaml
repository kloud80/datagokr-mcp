summary_user: 포천시에서 지류형 지역화폐(포천사랑상품권)를 받는 가맹점을 한 곳씩 담은 건별 목록으로, 지정번호·상호·주소·업태·종목·읍면동명이 들어 있고 범위는 포천시 한 곳이다. 주민이나 방문객이 '우리 동네에서 종이 포천사랑상품권을 쓸 수 있는 식당·가게가 어디인가'를 찾을 때, 분석가가 읍면동·업종별 가맹점 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 주소·읍면동명·상호 같은 이름 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 사업자등록·인허가 데이터와 바로 붙일 수 없고, 주소나 상호 문자열을 맞춰야 한다. 포천시 한 곳의 지류형 가맹점만 담고 있으므로 다른 시군이나 카드·모바일형 가맹점은 이 데이터로 확인할 수 없다.
