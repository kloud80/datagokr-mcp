summary_user: 세종특별자치시 일반건축물의 과세년도별 시가표준액을 건물 동·호 단위 개별 행으로 담으며, 법정동·리 코드, 본번·부번, 물건지 주소, 연면적, 작성 기준일자를 함께 제공하고 API 전체 건수는 47,689건이다. 세종시에 건물을 가진 사람이나 재산세·취득세를 따져 보는 분석가가 특정 번지 건물 호실의 해당 연도 시가표준액이 얼마인지 확인하는 데 쓴다. 법정동코드(stdgCd, bjd_cd)를 키로 법정동코드 코드표나 같은 코드를 쓰는 건축물대장·공시지가 등 다른 부동산 데이터와 이어 쓰며, 본번·부번·동·호로 개별 건물을 맞춘다.
