summary_user: WAMIS(국가수자원관리종합정보시스템)의 자연재해 관련 자료를 한 묶음(zip 약 15MB)으로 담은 파일로, 홍수기 시우량·시수위, 고시홍수량, 재해위험지구, 수해상습지, 과거홍수피해액, 피해복구비, 치수사업투자비, 가뭄피해 등을 행정구역·유역별 현황 단위로 담고, 범위는 전국이다. 지자체·방재 분석가가 '우리 지역(유역)에 지정된 재해위험지구는 어디이고 위험등급·사업비·인명보호 세대는 얼마인가' 같은 질문에 쓴다. 단위유역코드·행정구역코드·유역명·행정구역명 필드가 있으나 실측상 전역 조인 키는 확인되지 않아, 다른 수문·재해 데이터와는 행정구역명·유역명 같은 이름이나 코드 매핑으로 이어 붙인다.
