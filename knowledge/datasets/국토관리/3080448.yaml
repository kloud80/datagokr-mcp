summary_user: 군산시가 조사한 생필품·농축수산물 등 품목별 가격을 규격단위와 함께 이마트·화진마트·홈마트 등 마트와 공설시장·주공시장별로 담고, 11월 셋째 주와 12월 셋째 주 가격 및 등락률을 정리한 소형 집계 파일(CSV, 약 2KB)이다. 군산 시민이나 지역 물가 담당자가 "같은 품목을 군산의 마트와 전통시장 중 어디서 더 싸게 살 수 있고, 한 달 새 얼마나 올랐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지역 물가 자료와는 품목명·규격을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: 이 데이터는 전북특별자치도 군산시에서 정기적으로 실시하는 물가조사 현황을 정리한 자료로, 품목별 가격, 규격 및 단위, 유통처(마트 및 전통시장 등), 등락률 등의 항목으로 구성되어 있다. 주요 생필품 및 농축수산물, 공산품 등의 가격 변동을 체계적으로 모니터링하여 시민들에게 물가 정보를 제공하고, 지역경제 안정화 및 생활물가 관리 정책 수립에 활용된다. 마트와 시장 등 유통 경로별 가격 비교를 통해 유통 구조를 분석하고 소비자 선택에 도움을 줄 수 있으며, 등락률 항목은 가격 변동 추이를 파악해 인플레이션 경향과 공급 불안정 요인 등을 진단하는 데 유용하다. 이 데이터는 군산시의 물가 안정 대책 수립, 물가정보공시, 정책 모니터링 등 공공 행정과 시민 편익을 위한 기반 자료로 기능한다.
