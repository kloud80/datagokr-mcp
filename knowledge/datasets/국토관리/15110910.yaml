description_portal: 관내 용도지구에 대한 공간적 분포와 세부 용도, 면적 등의 정보를 제공하는 API입니다.용도지구란 건축 행위나 토지의 용도에 제한을 두는 법적 지정 구역으로 방재지구, 고도지구, 경관지구 등이 포함됩니다.부동산 매입이나 건축 계획 시 본 API를 활용하면 해당 토지의 규제 여부와 개발 가능성을 사전에 파악할 수 있습니다. 공공기관에서는 도시계획, 개발사업, 각종 인허가 행정업무의 기초자료로 활용할 수 있으며 기타 기업에서는 계획 지역의 개발 가능성 분석, 사업 타당성 평가 등 다양한 영역의 분석 시 활용할 수 있습니다.본 API는 REST방식과 JSON포맷으로 제공됩니다.
