summary_user: 서귀포시 관내 종합건설업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 13KB)로, 업체명·업종·도로명주소·전화번호·데이터기준일자가 들어 있다. 주민이나 사업자가 '우리 동네에서 조경이나 토목 공사를 맡길 종합건설업체는 어디인가'를 찾을 때 쓰고, 분석가는 업종별·지역별 업체 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명이나 도로명주소를 맞춰 붙이거나, 주소를 좌표로 바꿔 지도 데이터와 겹쳐 쓴다.
description_portal: 이 자료는 서귀포시 관내 종합건설업체의 기본 정보를 망라한 것으로, 업체명, 건설업종 종류, 도로명 주소, 연락처, 그리고 데이터 기준일자 등이 포함돼 있습니다. 이를 통해 행정에서는 업체 분포의 지역적 편차, 건축·토목·조경 등 업종별 분포, 접근성 및 주소 기반 인프라 연계성을 판단할 수 있어요. 건설 허가 절차, 지역 개발 계획, 도시계획 및 조경 시설 설치, 도로 및 기반시설 공사 예정지 선정 등에 유용하며, 주민이나 기업은 가까운 건설 업체를 찾거나 견적 및 서비스 가능 업종 여부를 비교하는 데에도 도움이 됩니다. 또한 시각화 자료 제작(지도 기반 업체 밀도 지도 등)과 업종별 경쟁력 및 시장 구조 분석, 정책 입안 시 지역 건설업 성장 가능성 평가 등에 기초자료로 사용 가능해요.
