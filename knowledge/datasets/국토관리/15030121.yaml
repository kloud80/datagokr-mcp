summary_user: 대전광역시 동구 관내 담배소매인 지정 업소를 업소별로 담은 CSV 파일(약 55KB)로, 업소명·지번주소·지정일자와 데이터 기준일자를 수록한다. 신규 담배소매인 지정을 검토하는 사업자나 담당 공무원이 특정 위치 주변에 이미 지정된 소매점이 있는지, 동구 내 소매점 분포가 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소 매칭하거나 같은 기관 자료와 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 대전광역시 동구 관내 담배소매인 지정 현황을 체계적으로 수록한 자료로, 업소명, 주소, 소매인 구분, 지정일자 등 주요 정보를 포함하고 있습니다. 담배소매인 지정은 관련 법령에 따라 거리 제한, 학교 주변 규제 등의 기준이 엄격히 적용되며, 이를 통해 업소의 입지 적정성 평가와 신규 담배소매인 신청 가능 지역 검토에 활용할 수 있습니다. 또한 지역 내 담배 판매 및 유통 현황을 정확히 파악하여 효과적인 유통 점검과 관리 정책 수립에 중요한 기초 자료로 활용됩니다. 이 데이터는 공공보건 향상과 청소년 보호를 위한 정책 수립에도 크게 기여할 수 있으며, 담배 유통 질서 확립 및 합법적 판매 환경 조성에 필수적인 역할을 수행합니다.
