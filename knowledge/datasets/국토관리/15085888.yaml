summary_user: 주요 국가산업단지별로 기업 규모(50인 미만, 50~300인 미만, 300인 이상)에 따른 가동률(%)과 가동업체 수를 정리한 분기 산업동향 집계 파일이며, 10개 열·40개 행 규모의 전국 단위 비공간 자료다. 분석가나 지자체 담당자가 "어느 국가산단에서 중소기업 가동률이 대기업보다 크게 낮은가"처럼 단지별·규모별 제조업 경기를 비교하는 데 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어, 단지 원장이나 생산·수출·고용 통계와는 산업단지 이름(산업단지)을 맞춰 연결해야 한다.
