description_portal: 「서울특별시 자치구별 전세사기 발생건수」 데이터는 2023년부터 2025년까지 서울특별시 관할 자치구별 전세사기 피해자 등 가결 건수를 연도별로 집계한 자료입니다. "전세사기 피해자 등"이란 국토교통부가 「전세사기피해자 지원 및 주거안정에 관한 특별법」에 따라 전세사기피해자등으로 인정하기로 가결한 건수를 의미합니다. 연도와 자치구를 기준으로 구성되어 있어 시기별·지역별 전세사기 발생 추이를 비교·분석할 수 있습니다. 이를 통해 특정 자치구에서 전세사기가 집중적으로 발생하는 양상이나 연도별 증감 흐름을 파악할 수 있으며, 주거 취약 지역 분석, 전세사기 예방 정책 수립 및 행정 대응 방향 설정을 위한 기초자료로 활용할 수 있습니다. 또한 전세 관련 피해 규모를 장기적으로 모니터링함으로써 시민 주거 안정성 강화와 선제적 위험 관리 체계 마련에 기여합니다.
