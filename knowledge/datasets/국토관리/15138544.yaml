summary_user: 경기도 이천시 도로를 현황도형 단위로 한 건씩 담은 파일로, 관리번호·라벨명·도형 기준 면적·길이 기준 면적·생성일을 담는다(CSV 약 53KB). 지자체 담당자나 분석가가 이천시 도로 구간별 면적·길이 규모를 파악해 도로 자산 현황이나 유지관리 대상을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(이천시) 기준으로만 이어 쓴다.
description_portal: 해당 데이터는 도로의 공간정보 및 속성정보를 포함한 현황도형 자료로, 각 도로 객체의 관리번호, 라벨명, 면적(도형 기준 및 길이 기준), 생성일자 등의 항목으로 구성되어 있습니다. 도형 정보는 도로의 위치 및 형상을 표현하며, 각 도로 구간에 대한 식별과 관리를 위해 활용됩니다. 이 데이터는 지자체의 도로 유지관리, 공공시설물 관리, 공간분석 등 다양한 행정업무에 활용될 수 있습니다. 특히, 면적 및 길이 정보를 기반으로 도로 자산 현황을 파악하거나 예산 수립, 도시계획 수립 시 참고자료로 활용 가능합니다.
