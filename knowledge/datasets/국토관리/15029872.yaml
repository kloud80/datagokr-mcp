summary_user: 가평군 관내에 접수된 건축착공신고를 신고 건별로 담은 파일(csv, 약 2.2MB)이며, 신고일자·도로명/지번 주소·착공용도·위도·경도를 포함한다. 분석가나 사업자가 '최근 가평군 어느 읍·면에서 어떤 용도의 건물 착공이 늘고 있나'처럼 지역 개발 흐름을 앞서 살피는 데 쓴다. 전역 조인 키는 없어서 주소 문자열이나 위도·경도 좌표로 건축물대장·인허가·공간정보 자료와 공간 결합하거나, 같은 기관(가평군) 기준으로 다른 건축 인허가 데이터와 나란히 본다.
