summary_user: 아산시 내 아파트·연립주택·상가 같은 집합건축물을 세대가 아닌 건물 전체 단위로 한 줄씩 담은 파일(csv, 약 324KB)로, 위치(법정동·지번), 대지·건축·연면적, 건폐율·용적률, 주용도, 세대수·가구수, 지상·지하 층수, 사용승인일자를 담는다. 아산시에서 집을 알아보는 시민이나 부동산 분석가가 '이 단지는 언제 사용승인을 받았고 몇 세대, 몇 층인가' 같은 질문에 쓴다. 전역 조인 키(건물관리번호·법정동코드 등)가 없어 다른 건축물대장·공시지가 자료와는 법정동명과 본번·부번 지번을 맞춰 이어 써야 한다.
description_portal: 집합건축물대장은 「건축법」과 「집합건물의 소유 및 관리에 관한 법률」에 근거하여 작성되는 자료로, 아파트·연립주택·상가 등 여러 세대나 가구가 집합된 건축물의 현황을 관리하기 위해 운영된다. 아산시 집합건축물대장은 개별 세대가 아닌 건축물 전체 단위에서 제공되며, 위치, 대지면적, 건축면적, 연면적, 건폐율, 용적률, 주용도, 세대수·가구수, 층수, 최초 사용승인일자 등 주요 정보를 포함한다.집합건축물대장은 행정적으로 공동주택 관리, 안전 점검, 도시계획 및 재난 대응에 활용되며, 산업적으로는 부동산 분석이나 도시개발 자료로 쓰인다. 연구 분야에서는 공동주택 특성이나 도시화 과정 연구에 기초 자료가 되고, 시민에게는 승인일자·세대수·층수 등 생활과 밀접한 정보를 제공해 주거 관련 의사결정에 도움을 준다.즉, 집합건축물대장은 공동주택 등 집합 건축물의 현황을 종합적으로 기록·제공하는 공공데이터로서 행정, 산업, 연구, 시민서비스 등 다양한 분야에서 활용 가치가 높은 핵심 데이터이다.
