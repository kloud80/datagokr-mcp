summary_user: 전국 우량관측소의 10분 단위 관측 기록을 관측소별로 담은 건별 원천 파일로, 관측시간·관측소코드·관측소명·우량·누적우량이 들어 있으며 포털 설명상 629개 관측소를 대상으로 한다. 홍수 대응이나 댐·보 운영을 검토하는 분석가가 '집중호우 기간에 특정 유역 관측소의 누적 강우가 얼마였나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 수문 관측 자료와는 우량관측소코드나 관측소명을 이름·코드 매핑으로 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 행정구역이나 다른 기관 자료와 바로 붙일 수 없고, 관측소코드·이름 매핑을 따로 만들어야 한다. 파일에 이름 없는 빈 열(Unnamed)이 여러 개 섞여 있어 파싱할 때 정리가 필요하다. 행정단위가 비공간으로 분류되어 관측소 위치 좌표는 이 파일만으로 얻을 수 없다.
