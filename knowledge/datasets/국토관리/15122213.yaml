summary_user: 임실군 도시계획정보시스템에서 개발행위허가를 받은 필지를 도형 단위로 담은 파일로, 도형마다 관리번호·허가계획관리번호·라벨명·도형 면적과 길이가 들어 있다(csv 약 186KB, 시군구 범위). 부동산 개발 검토자나 분석가가 "임실군 안에서 어느 필지에 개발행위허가가 났고 그 면적은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드나 허가계획관리번호 같은 같은 기관 내부 코드·이름 매칭으로만 잇는다.
description_portal: 전북특별자치도 임실군 도시계획정보시스템 개발행위허가필지도현황으로 도형 속성코드, 현황도형, 면적_도형, 길이_도형이 포함된 메타데이터입니다. 해당 자료에는 개발행위 허가를 받은 토지의 위치, 필지 번호, 허가 면적, 허가 목적, 허가일자 등 주요 행정 정보가 포함되어 있습니다. 이는 도시관리계획의 효율적 집행과 토지이용의 합리화를 지원하기 위해 구축된 핵심 공간데이터입니다. 행정기관에서는 인허가 절차의 투명성을 높이고, 중복 개발이나 무분별한 토지 훼손을 예방하는 데 활용합니다. 또한 민간 부문에서는 부동산 개발 분석, 토지 가치 평가, GIS 기반 도시계획 시뮬레이션 등에 활용 가치가 높습니다. 임실군의 지속가능한 발전과 체계적 공간 관리의 기초 자료로서 중요한 역할을 합니다.
