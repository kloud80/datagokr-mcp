description_portal: '자원환경_급수공사대행업 데이터는 수도사업자가 일반의 수요자에게 원수 또는 정수를 공급하기 위하여 배수관이나 다른 급수관으로부터 분기하여 설치한 급수관, 그 밖의 급수를 위하여 필요한 기구의 신설, 개조, 수선 및 철거 등의 공사를 대행하는 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소, 종업원 수 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 급수공사대행업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 지자체별 급수조례 / 해당 지자체에 문의  * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
