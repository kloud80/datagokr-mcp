summary_user: 경기도에서 소방시설을 갖춘 다중이용업소 가운데 고시원을 업소 한 곳당 한 행씩 담은 현황 목록으로, 업체명, 지번·도로명 주소, 정제된 위도·경도, 데이터 기준일자를 담는다. 소방·도시계획 담당자나 분석가가 '경기도 안에서 고시원이 몰려 있는 동네는 어디인가'를 지도에서 확인하고 소방안전 점검이나 주거취약계층 정책 대상 지역을 고르는 데 쓴다. 공통 코드 같은 전역 조인 키는 없어서, 다른 데이터와는 주소 문자열이나 좌표로 공간 매칭하거나 업체명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 「다중이용업소의 안전관리에 관한 특별법」에 따라 소방시설이 설치된 다중이용업소 중 고시원에 해당하는 업소의 현황을 제공하며, 자율업종인 고시원은 별도의 인허가 절차 없이 운영되기 때문에 관련 업무를 수행하는 전담 부서는 존재하지 않습니다. 데이터에는 고시원의 업체명, 소재지의 지번 및 도로명 주소, 정제된 위도·경도 좌표, 데이터 기준일자 등이 포함됩니다. 본 자료는 고시원 밀집 지역 파악, 소방안전 관리, 도시계획 및 주거취약계층 보호 정책 수립에 활용될 수 있는 공간 기반 정보입니다.
