summary_user: 경상북도 영양군 일반건축물의 지방세 부과기준인 시가표준액을 건물(호) 단위로 담은 파일 데이터로, 과세년도·법정동·법정리·본번·부번·동·호와 연면적, 기준일자를 함께 제공한다(CSV 약 69만 바이트). 영양군에 건물을 가진 주민이나 세무·부동산 실무자가 특정 건물의 재산세 과세표준이 되는 시가표준액이 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 법정동·법정리·본번·부번 같은 주소 항목이나 자치단체코드를 이름·코드로 맞춰 건축물대장·공시지가 자료와 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영양군 일반건축물에 대한 지방세 부과기준인 시가표준액에 대한 데이터로 물건지, 시가표준 금액, 연면적,기준일자, 법정동, 법정리, 특수지, 본번, 부번, 호 등의 항목을 제공합니다.법정동과 법정리는 행정구역을 구분하는 기본 단위로, 건축물이 위치한 지역을 명확히 식별할 수 있게 해 줍니다. 특수지는 토지 이용 목적이나 지형적 특성을 반영하는 항목이며, 본번과 부번, 동, 호는 건축물 내 세부 위치를 나타내는 상세 주소 체계입니다. 물건지는 건축물이나 토지의 고유 식별 정보로,연면적은 건축물의 총 바닥 면적을 의미합니다. 기준일자는 해당 정보가 유효한 시점을 나타내며, 시가표준액은 과세나 평가 기준이 되는 표준 시가를 의미합니다. 이 모든 정보는 부동산 거래, 평가, 관리, 세무처리 등 다양한 분야에서 활용됩니다.
