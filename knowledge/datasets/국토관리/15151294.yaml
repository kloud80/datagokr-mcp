summary_user: 승강기 한 대(호기) 단위로 검사 신청·접수 내용, 승강기 형식·종류·제조업체, 검사일자와 판정결과·확인검사 결과, 검사유효기간과 보완기간을 담는 건별 원천 데이터이며, 범위는 전국이고 위치는 건물 주소 단위로 나온다. 승강기 설치·유지관리 업체나 건물 관리자가 '우리 현장 승강기의 검사 판정이 무엇이고 유효기간이 언제까지인가'를 신청업체 현장관리코드나 승강기관리코드로 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 승강기고유번호(elvtrUniqueNo)나 건물주소·건물명 같은 이름 매핑으로, 또는 같은 기관(한국승강기안전공단)의 다른 승강기 데이터와만 이어 쓴다.
description_portal: 승강기검사신철결고정보 조회 서비스는 검사신청업체가 관리하는 현장관리코드 또는 승강기관리코드로 신청정보, 접수정보, 승강기정보, 업체정보, 검사결과 등을 확인할 수 있습니다.
team:
  dept: 디지털총괄실
services:
  - op: /getInspectResultListV1
    name: 승강기 검사신청결과정보
    endpoint: https://apis.data.go.kr/B553664/ElevatorInspectResultService/getInspectResultListV1
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: elvtrmngno_mngno
        required: true
        example: 71~74
        desc: 신청업체 현장관리코드/ 신청업체 승강기관리코드
      - name: _type
        required: false
        example: xml
        desc: '요청자료형식(xml/json) Default: xml'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
