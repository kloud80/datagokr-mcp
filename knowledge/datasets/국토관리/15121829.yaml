description_portal: 통합회원관리시스템 할인대상 회원에 대한 시설코드, 회원종류코드, 할인대상자여부, 할인대상승인여부, 등록일, 변경일 등 정보를 제공합니다.인천시설공단은 인천시민과 함께 행복한 도시를 실현하는 전문공기업으로 시민의 일상에 밀접한 공공시설문과 도심 인프라를 관리 운영하며 인천 시민 행복에 기여하고 있습니다.인천가족공원, 노인종합문화회관 등의 복지시설부터, 청소년수련관, 어린이과학광 등의 문화시설과 아시아드주경기장, 삼산월드체육관등의 체육시설, 송도 영종 청라의 공원시설, 지하도상가, 도시기반등의 생활시설까지 다양한 분야에서 전문성과 기술력을 바탕으로 시민들의 편익과 복리증진을 위한 공공서비스를 제공하고 있습니다.
