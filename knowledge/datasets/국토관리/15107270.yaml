summary_user: 행정안전 통계연보 '재난관리' 분야에 수록된 재해위험저수지 지정·해제 개수를 담은 전국 단위 집계 통계로, 지방자치단체가 재해위험성이 높다고 판단해 지정 고시한 저수지의 지정·해제 현황을 제공한다. 방재 정책 분석가나 연구자가 재해위험저수지가 해마다 얼마나 새로 지정되고 해제되는지 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 이름·코드 매핑이나 같은 행정안전부 통계연보 계열 통계와 나란히 놓는 방식으로만 이어 쓴다.
limits: 전국·비공간 집계라 개별 저수지 위치나 시군구별 상세는 이 데이터로 확인하지 않는다. 조인 키가 없어 다른 저수지·재난 데이터와 직접 결합하기 어렵다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
