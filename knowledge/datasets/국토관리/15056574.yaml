summary_user: 국가·지자체 재정과 국민주택기금 지원으로 30년 이상 임대할 목적으로 건설·매입하는 국민임대주택 정보를 전국 범위로 담는다. 명칭(uname), 연도·번호(dyear·dnum), 시도·시군구명, 비고 필드가 있으나 명세상 의미가 비어 있어 한 행이 무엇을 뜻하는지는 실제 응답으로 확인해야 하며, 공공임대 수요를 살피는 분석가가 '우리 시군구에는 국민임대주택 관련 기록이 몇 건이나 있나' 같은 질문에 쓴다. 전역 조인 키가 없어 시도·시군구 이름을 매핑해 전월세 실거래 등 임대차 데이터와 이어 쓴다.
