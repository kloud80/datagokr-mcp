summary_user: 전주시 상하수도 요금 산정 기준을 담은 파일로, 요금 계산법·구경별 정액요금·상수도와 하수도의 업종별 요율·물이용부담금을 구분·부과방법·사용량단위별로 정리한 기준표이며 건별 부과 내역이 아니다. 전주시 시민이나 사업자가 "우리 업종과 계량기 구경이면 사용량에 따라 수도요금이 어떻게 계산되나"를 확인하거나, 민원 대응과 요금 정책 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체 요금표나 사용량 통계와는 업종명·구경 같은 이름 매핑으로만 맞춰 쓴다.
limits: 전주시 한 곳(시군구 단위)의 요금 기준표라서 다른 지역 요금이나 실제 가구·사업장별 부과액은 담지 않는다. 다른 데이터와 공통 코드가 없어 연결하려면 이름을 직접 맞춰야 한다.
