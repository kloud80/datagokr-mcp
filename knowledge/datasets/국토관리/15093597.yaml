description_portal: 전주시 상하수도 요금정보는 시민이 부담하는 상수도요금 및 하수도요금의 산정 기준, 적용 요율, 구경별 정액요금 등 상하수도 요금 부과 체계 전반에 대한 정보를 투명하게 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 상하수도 요금 계산법, 상하수도 공통 구경별 정액요금, 상수도 업종별 요율, 하수도 업종별 요율 및 물이용부담금으로 구성되어 있으며, 전주시 상하수도 요금 산정 기준을 체계적으로 확인할 수 있도록 제공됩니다.특히 업종별 요율 적용 기준과 요금 계산 방식, 구경별 정액요금 및 물이용부담금 부과 기준 등 실제 요금 산정 과정에 반영되는 세부 기준 정보를 포함하고 있어, 시민이 상하수도 요금 부과 내역을 이해하고 요금 산정 결과를 확인하는 데 활용할 수 있으며, 민원 대응, 행정 업무 참고, 정책 검토 및 연구·분석 자료로도 활용이 가능합니다.전주시는 본 데이터를 통해 상하수도 요금 운영의 투명성과 신뢰성을 제고하고, 시민 중심의 정보 접근성을 강화하는 것을 목표로 하며, 관련 조례 개정, 요율 변경 등 정책 변동 사항을 반영하여 데이터를 지속적으로 최신화할 예정입니다. 본 데이터는 전주시 수도행정과에서 제공·관리합니다.
