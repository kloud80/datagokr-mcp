summary_user: 한국토지주택공사가 관리하는 3기 신도시 인천계양지구의 토지이용계획표로, 주택건설용지·공공시설용지·공원녹지 같은 용도별 계획 면적(천㎡)과 구성비를 담은 지구 단위 집계표이며 포털 설명상 전체 면적은 849만㎡이고 CSV 파일 크기는 786바이트입니다. 인천계양 신도시에 주택용지와 공원·공공시설 부지가 각각 얼마나, 어떤 비율로 계획됐는지 확인하려는 주민·실수요자·분석가가 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 3기 신도시 토지이용계획표와는 용도 이름(토지이용계획)을 맞춰 나란히 비교하는 방식으로만 이어 씁니다.
description_portal: 한국토지주택공사에서 관리중인 3기신도시 토지이용계획표로 전체 토지이용계획의 면적, 구성비 및 주택건설용지, 단독주택, 공동주택등 부분별 면적, 구성비 정보를 제공하고 있습니다. 인천계양지역의 토지이용계획상 전체 이용 면적은 849만 제곱미터로 공공시설용지로 계획된 부지가 267.2만(31.48%) 제곱미터, 공원녹지로 계획된 부지가 90만(10.61%)부지 입니다. 인천계양지역은 김포공항, 마곡지구 인근에 위치하며 1호선, 공항철도, 수도권제1순환고속도로와 인접하여 광역교통여건이 우수한 부지입니다.
