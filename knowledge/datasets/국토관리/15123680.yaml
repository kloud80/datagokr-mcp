summary_user: 경기부동산포털의 건물 총괄표제부 자료로, 지번 단위 건물마다 위치·건물명, 대지면적·건축면적·연면적, 건폐율·용적률, 주용도, 주건축물·부속건축물 수, 총주차수, 허가·착공·사용승인일을 담는다. 개발 분석가나 사업자가 특정 지번 건물의 규모와 용적률, 주차 대수, 사용승인 시점을 확인할 때 쓰고, 도시계획·주차 수급 검토에도 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않아 다른 데이터와는 토지고유번호(land_idntfy_no)·지번 소재지 같은 이름·코드 매핑이나 같은 기관 코드로 연결한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 건물 총괄표제부 자료로, 각 건물의 위치, 건축규모, 용도, 건축일정 및 주차 정보 등을 종합적으로 수록하고 있습니다. 주요 항목에는 '토지고유번호', '건물번호', '토지소재지', '건물명', '대지면적', '건축면적', '연면적', '건폐율', '용적율', '주용도코드', '주건축물수', '부속건축물수', '총주차수', '허가일', '착공일', '사용승인일' 등이 포함되어 있으며, 이는 개별 건물의 물리적 특성부터 행정 절차까지 전반적인 정보를 담고 있어 부동산 개발 분석, 도시계획 수립, 주차 수급 평가, 건축물 에너지 효율 분석 등 다양한 분야에서 활용될 수 있습니다※ 총괄은 해당 지번에 있는 모든 건축물을 표시한 것이고, 표제부는 해당 지번에 있는 동을 표시한 건축물대장입니다.
