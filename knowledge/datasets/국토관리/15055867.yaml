description_portal: '인천광역시 소음도 현황(일반지역, 도로변지역)에 대한 정보를 제공합니다.  (단위 : dB(A))1) 인천광역시 소음측정망(수동) : 45개소(일반지역 27, 도로변지역 18)2) 국가측정망의 경우 수동측정망 50개소, 자동측정망 5개소 별도운영 중<활용 목적>이 자료는 인천시의 정주 환경 소음 실태를 객관적으로 파악하고, 환경 소음 기준 초과 여부를 감시하는 데 사용됩니다. 행정적으로는 소음 취약 지역을 특정하여 소음 저감 대책 (방음벽 설치, 소음 규제 강화)을 수립하고, 시민들의 쾌적한 생활 환경 조성을 위한 정책의 기초 자료로 활용됩니다.인천시의 환경 보전 및 소음 관리 정책 수립을 위한 핵심 기반 정보입니다.'
