summary_user: 인천광역시 소음측정망 결과를 시점별로 일반지역(가~라 지역 구분)과 도로변지역(가-나·다·라 구분)의 낮·밤 소음도(dB(A))로 정리한 집계 파일로, 측정지점별 건별 값이 아니라 지역 구분별 평균 형태이며 파일 크기는 452바이트로 작다. 시민이나 환경 정책 담당자가 '인천의 주거지역·도로변 밤 소음이 해마다 어떻게 변했고 환경기준을 넘는가'를 볼 때 쓴다. 측정소 코드나 행정구역 코드 같은 전역 조인 키가 없어 다른 데이터와는 시점과 지역 구분 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
limits: 측정지점·구·동 단위 값이나 좌표가 없는 비공간 집계라 지점별 소음 비교나 지도화에는 쓸 수 없다. 조인 키가 없어 국가 소음측정망 등 다른 소음 자료와 결합할 때는 시점과 지역 구분을 직접 맞춰야 한다.
