summary_user: 경기도 동두천시의 문화유통업(노래연습장업, 게임제공업, 음반·비디오물 제작업 등) 업소를 업종·상호명·주소·좌표·전화번호 단위로 한 줄씩 담은 개별 업소 목록으로, 128행 규모의 시군구 범위 파일이다. 시민이나 분석가가 동두천시 안에서 노래연습장 같은 문화유통업 업소가 어디에 몇 곳 있는지 찾는 질문에 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)가 조인 키라서 주소 기반 데이터나 지도 좌표 데이터와 이어 쓴다.
description_portal: 경기도 동두천시의 문화유통업 현황을 민원인에게 제공하고자 합니다.공공데이터의 제공항목으로는 업종, 상호명, 소재지 도로명주소, 소재지 지번주소, 위도, 경도, 전화번호, 관리기관명, 관리기관 전화번호의 정보입니다.개임물제작업, 노래연습장업, 복합유통게임제공업, 비디오물제작업, 음반음악영상물제작업, 인터넷컴퓨터게임시설제공업, 청소년게임제공업 등의 업종현황을 제공합니다.데이터 기준일자는 2026년 6월 15일입니다. 데이터에 대하여 추가적인 문의사항이 있을경우 동두천시청 문화예술과 문화예술팀 031-860-2063으로 문의주시기 바랍니다.
