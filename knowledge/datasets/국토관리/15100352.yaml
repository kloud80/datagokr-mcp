summary_user: 부산광역시 상수도사업본부 수용가정보시스템에서 수도요금 전자고지(문자·이메일) 신청 민원을 건별로 담은 파일 데이터로, 사업소, 신청구분, 전자고지 방식, 신청일자 항목으로 이루어진다. 분석가가 사업소별·기간별로 종이 고지서 대신 문자나 이메일 고지를 신청한 건수가 어떻게 변하는지 볼 때 쓴다. 전역 조인 키는 없어 사업소코드·사업소명으로 같은 본부의 다른 수용가정보시스템 자료와 맞춰 잇는 정도로만 연결한다.
description_portal: 부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 민원 신청 정보(전자고지) 자료입니다.이고지서가 불필요한 민원이 휴대전화(문자) 또는 전자우편(이메일)로 전자고지를 신청하면고지건당 200원을 할인 받을 수 있는 민원사무임전자정부법 제11조지방세기본법제30조제7항부산광역시 수도 급수 조례 제38조○ 해당 납부 월 20일까지 신청한 휴대전화 또는 전자우편으로 전자고지 받지 못한 경우 상수도콜센터(☎ 120) 또는 지역사업소로 문의하여야 합니다.○ 이사(전출) 등으로 요금 납부자가 변경되거나, 휴대전화 번호 변경, 전자우편 주소 변경 등 개인정보 변동 사항이 발생하면 즉시 변경 및 해지 신청을 해야 합니다.○ 매월 13일 이내 신청 시 당월고지서 적용
