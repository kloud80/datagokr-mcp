summary_user: 서울특별시 지구단위계획구역 안에 지정된 특별계획구역을 도형 단위로 담은 공간정보로, 도형마다 시군구 코드(SGG_CD), 결정고시 관리코드, 라벨명, 면적·둘레 길이, 도형 작성일자를 담는다. 개발사업자나 도시계획 분석가가 특정 부지가 서울시 특별계획구역에 걸쳐 있는지, 구역 면적이 어느 정도인지 확인하는 데 쓰며, 근거 법령은 국토계획법의 지구단위계획 규정(§49~§55)이다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 시군구 코드나 결정고시 관리코드처럼 같은 기관 체계의 코드, 또는 공간 중첩으로 서울시 지구단위계획 구역·결정조서·획지 자료와 이어 쓴다.
limits: 포털 설명상 법적 효력이 없는 참고자료여서 행위제한 판단의 근거로 쓸 수 없다. 서울 열린데이터광장(data.seoul.go.kr)의 별도 인증키가 필요하며 포털 활용신청과는 별개다. 좌표계는 EPSG:5174(Bessel TM), 인코딩은 windows-949이므로 다른 공간자료와 겹칠 때 좌표 변환과 문자셋 처리가 필요하다.
