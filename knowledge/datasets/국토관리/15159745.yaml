summary_user: 경상북도 안동시 관내 토지의 개별공시지가를 필지(지번 주소) 단위 건별로 담은 파일 데이터로, 소재지·결정지가·기준일자·공시일자·표준지 여부가 들어 있다. 안동시의 특정 지번 땅값이 얼마로 공시됐는지, 읍면동별 지가 분포가 어떤지를 확인하려는 토지 소유자·부동산 분석가·과세 담당자가 쓴다. 실측 컬럼에 법정동코드·PNU 같은 전역 조인 키가 없어, 다른 데이터와는 소재지 지번 주소를 문자열로 맞추거나 같은 안동시 자료끼리만 연결한다.
description_portal: 본 데이터는 경상북도 안동시 관내 토지에 대한 개별공시지가 현황을 제공하는 핵심 통계 자료입니다. 주요 항목으로는 고유 식별 일련번호, 정식 지번 주소인 소재지, 최종 확정된 땅값인 결정지가, 지가 산정의 행정적 시점인 기준일자, 최종 심의를 거쳐 대외적으로 선포된 공시일자 및 표준지 활용 여부를 구별하는 표준지여부 정보가 수록되어 있습니다. 조사 기준시점(기준일자)과 최종 행정 처리가 완료되어 효력이 발생한 시점(공시일자)의 차이는 부동산공시법에 의거한 정상적인 절차입니다. 본 자료는 안동시 전역의 토지 자원 변동 분석, 공정한 지방세 과세 표준 산정, 부동산 정책 수립 및 민간 프롭테크 서비스 개발 등 다양한 행정·상업적 목적의 기초 통계 지표로 유용하게 활용됩니다. (393자)
