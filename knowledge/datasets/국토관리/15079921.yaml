summary_user: 광양시 관내 일반건축물의 시가표준액을 지번(법정동·법정리·본번·부번) 단위로 담은 파일 데이터로, 필지·건물별 연도 시가표준액과 특수지 구분을 포함한다. 광양시에 건물을 가진 시민이나 세무·부동산 분석가가 '이 지번 건물의 올해 재산세·취득세 과세 기준 금액이 얼마인가'를 확인하는 데 쓴다. 전역 조인 키(법정동코드·건물관리번호 등)는 없어서, 건축물대장이나 공시지가 같은 다른 데이터와는 법정동명·본번·부번 같은 주소 문자열을 맞춰서만 이어 쓴다.
description_portal: '본 자료는 전라남도 광양시 관내 일반건축물에 대한 시가표준액 현황을 정리한 공공데이터로, 건축물별 위치 정보(지번) 및 연도별 시가표준액을 포함하고 있습니다. 시가표준액은 「지방세법」 및 「건축물 시가표준액 조정기준」 등에 따라 산정되며, 재산세, 취득세, 등록세 등 지방세 과세의 기준이 되는 중요 지표입니다.자료는 시도명, 시군구명, 법정동, 법정리, 본번, 부번 등 건축물 위치를 식별할 수 있는 주소 체계를 제공하며 또한 특수지 항목을 통해 일반적인 건축물과 군사시설 등 특수한 건축물을 구분할 수 있도록 구성되어 있어, 행정기관의 재산관리, 개발계획 수립, 건축행정 민원 대응 등 다양한 업무에 실질적인 기초 자료가 됩니다.시가표준액은 매년 국토교통부의 기준과 지방자치단체의 실거래 자료 등을 반영하여 결정되며, 본 데이터는 해당 정보를 정기적으로 갱신한 것으로, 국민 누구나 건축물 가격정보를 확인하고 활용할 수 있도록 공개된 자료입니다.* 공란사유-법정리 : 해당 법정 단위까지 주소가 존재하지 않음-본번, 부번, 동, 호수 : 해당 단위까지 주소가 존재하지 않음-전년도 시가표준액 : 신규 데이터 생성으로 인함'
