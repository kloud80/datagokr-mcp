summary_user: 울산광역시 관내 하수처리장을 시설 한 곳당 한 행으로 담은 시설 목록으로, 시설명·소재지·위도·경도·처리능력·전화·팩스·견학대상을 포함하며 파일 크기는 약 1.5KB로 작다. 시민이나 교사가 '울산에서 학생 단체로 견학할 수 있는 하수처리장은 어디이고 어디로 문의하나'를 확인하거나, 분석가가 처리장별 처리능력과 위치를 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명 매칭이나 위도·경도 기반 공간 결합으로만 이어 쓴다.
