summary_user: 부산광역시 강서구에 등록된 공장을 한 곳씩 담은 건별 명부로, 회사명·공장주소·전화번호·대표업종번호와 업종명·종업원수·생산품을 담는다(시군구 범위, CSV 약 736KB). 강서구에서 특정 업종이나 생산품을 다루는 공장이 어디에 몇 곳 있고 규모가 어느 정도인지 알아보려는 사업자·분석가·행정 담당자가 쓴다. 전역 조인 키가 없어 공장주소를 주소 매칭하거나 대표업종번호를 업종분류와 대조하는 방식으로 다른 공장등록·산업단지 데이터와 이어 쓴다.
description_portal: 부산광역시 강서구에 소재한 다양한 제조업 및 산업 관련 사업장을 대상으로 한 공장등록 현황 데이터를 종합적으로 제공하고, 여기에는 각 공장 업체의 공식 회사명과 정확한 지번·도로명 주소, 연락 가능한 업체 전화번호가 포함됩니다. 또한 업종 형태와 주요 생산 품목, 종업원 수 규모 등 기업의 기본 현황을 파악할 수 있는 핵심 정보 데이터가 상세히 기재되어 있어, 부산광역시 강서구 지역 산업 구조 분석이나 기업 현황 조사와 행정 업무 참고 자료 등으로 활용하기에 충분한 내용을 포함하고 있습니다.
