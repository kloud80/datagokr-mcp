description_portal: 본 데이터는 2025년 경상남도 18개 시군에서 진행한 건축허가를 건축종별로 분류하였습니다.(시군별, 건축종별(신축,증축·개축·이전·대수선,용도변경), 면적, 건 수, 동 수)건축허가는 건축구조 및 구조안전의 적정성을 판단하여 진행합니다.허가통계 기간은 2025년 1월 1일부터 2025년 12월 31일까지입니다. 지역은 경상남도 18개 시군을 대상으로 지정하였으며 통계 기준은 건수, 동수, 연면적(㎡)으로 구분됩니다.건축종별 기준은 신축, 증축, 개축, 재축, 이전, 대수선, 용도변경으로 분류되며, 세부 기준은 건축구조별로 철근콘크리트, 철골, 조적, 철골철근, 나무, 기타로 6가지로 되어있습니다.
