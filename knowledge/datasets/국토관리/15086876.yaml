summary_user: 인천 중구(영종구) 관내에서 영업 중인 카페·커피숍을 업소 1곳당 한 행으로 담은 현황 파일로, 업종명·업태명·업소명·도로명 소재지·전화번호·데이터기준일자를 개별 주소 단위로 담는다. 창업 예정자나 상권 분석가가 '영종도나 원도심 특정 도로 주변에 카페가 얼마나 몰려 있나'처럼 지역별 카페 밀집도와 입지를 따질 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: '카페 및 커피숍에 대한 데이터는 인천광역시 중구에서 운영 중인 카페 업소의 현황을 파악할 수 있는 자료로, 업소명, 소재지 등의 정보를 포함합니다. 이 데이터는 커피 산업의 트렌드 분석, 상권 내 업소 분포 파악, 창업 입지 선정, 프랜차이즈와 개인카페의 비율 분석 등 다양한 정책적·산업적 목적에 활용됩니다. 또한, 소비자 접근성, 지역별 카페 밀집도, 청년 창업 지원 등에도 중요한 기초 자료로 활용될 수 있습니다.전화번호 항목은 개인정보 포함 및 미등록 정보로 일부 데이터값을 공란처리하였습니다.담당부서: 인천광역시 중구청 위생환경과(1청사 원도심), 친환경위생과(2청사 영종)'
