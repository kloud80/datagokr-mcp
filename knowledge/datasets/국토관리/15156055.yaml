summary_user: 평택시 내 담장·펜스 등 경계 구조물을 담장 한 건 단위로 담은 GIS 원천 자료로, 담장 종류(분류부호·분류명)와 소재 행정동·법정동을 함께 기록하며 범위는 시군구, 행정단위는 읍면동이다. 도시계획·시설물 관리 담당자나 지도·부동산 서비스 개발자가 특정 동에 어떤 종류의 담장이 얼마나 분포하는지 파악하는 데 쓴다. 전역 조인 키는 없어서 행정동·법정동 부호나 동 이름으로 다른 읍면동 단위 통계와 맞춰 쓴다.
