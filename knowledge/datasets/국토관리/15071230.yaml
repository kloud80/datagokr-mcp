summary_user: 서울특별시 개발제한구역을 도형(폴리곤) 단위로 담은 공간정보 파일로, 도형별 관리번호·분류코드·결정고시 관리코드·시군구코드·면적·길이 등을 담는다(좌표계 EPSG:5174, 인코딩 windows-949). 서울 시내 특정 땅이나 지역이 개발제한구역에 걸리는지, 자치구별로 개발제한구역 면적이 얼마나 되는지를 살펴보는 도시계획 분석가·부동산 실무자·시민이 참고자료로 쓴다. 전역 조인 키는 실측에서 확인되지 않았으며, 시군구코드(SGG_CD)나 결정고시 관리코드처럼 같은 기관 코드 체계 또는 이름 매핑으로만 다른 서울시 용도지역·지구 공간정보와 이어 쓴다.
description_portal: '도시의 무질서한 확산을 방지하고 도시주변의 자연환경을 보전하여 도시민의 건전한 생활환경 확보를 목적으로 도시 주변에 설정하는 「국토의 계획 및 이용에 관한 법률」에 의한 용도구역의 하나이다. [좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계) [인코딩] windows-949 ※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다. ※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.문의 : 도시계획과(02-2133-8339)'
