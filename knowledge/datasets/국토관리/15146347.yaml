summary_user: 서울시 내 공공·학교 체육시설을 시설 한 곳당 한 행으로 담은 목록으로, 소재 자치구(AR_CD_NAME)·시설명·분류·주소·면적·운영기관·평일/주말 운영시간·대관 여부·이용 요금·주차·운영 상태·부대시설 등을 포함한다. 시민이 "우리 구에서 주말에 대관 가능한 체육관이나 수영장은 어디이고 요금은 얼마인가"를 찾거나, 분석가가 자치구별 체육시설 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명·주소·시설명 같은 이름 매핑으로만 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 별도 인증키가 필요하며 공공데이터포털 활용신청과는 별개다. 법정동·행정코드 같은 공통 키가 없어 다른 통계와 결합할 때는 이름·주소 기반 매핑이 필요하다.
