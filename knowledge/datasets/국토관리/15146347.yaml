description_portal: 해당 데이터는 서울특별시 내 공공 및 학교 체육시설 정보를 알 수 있는 공공체육시설 정보 데이터입니다. 각 시설별로 고유 ID, 소재 행정구, 시설명, 분류, 주소, 우편번호, 면적, 운영기관, 연락처, 평일 및 주말 운영시간, 추가 운영 안내, 대관 가능 여부, 이용 요금, 주차 안내, 홈페이지 주소, 세부 시설 종류, 운영 상태, 부대시설, 비고 등의 상세 정보가 포함되어 있습니다. 예를 들어 수영장, 축구장, 야구장, 체육관, 운동장 등 다양한 유형의 체육시설이 수록되어 있으며, 각 시설의 규모, 운영 시간, 요금 정책, 주차 가능 여부까지 확인할 수 있어 서울시 체육 인프라 현황 파악 및 이용 계획 수립에 유용합니다.
