description_portal: 이 데이터는 광주광역시 서구 관내에서 허가된 건축물의 용도별 연도별 건축허가 현황을 제공하는 자료로, 주거용·상업용·농수산물·공업용·공공용·교육시설용 등 다양한 용도에 따른 건축허가 건수 및 면적 정보를 포함하고 있습니다.각 연도별로 용도에 따라 허가된 건축물의 동수(건물 수)와 연면적(㎡)이 구분되어 수록되어 있어, 건축 수요 추이, 도시공간 용도 비율 분석, 용도별 개발 집중도 평가 등에 활용할 수 있습니다. 특히 주거용 허가 동수 및 면적 정보는 인구유입 대비 주택공급 수급 분석, 공업용 면적은 산업단지 조성 및 지역경제 계획, 교육시설 용도는 교육 인프라 확충 정책 수립 등에 활용될 수 있습니다.데이터는 매년 정기적으로 갱신되며, 용도별 건축행정 통계 분석, 도시계획 수립, 인허가 정책 평가, 환경영향 분석 등 행정적‧정책적 활용가치가 매우 높은 자료입니다.
