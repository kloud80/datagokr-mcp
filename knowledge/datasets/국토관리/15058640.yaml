summary_user: 경기지역화폐를 쓸 수 있는 가맹점을 점포별로 담은 목록으로, 상호·업종·지번/도로명 주소·우편번호·위경도·시군명·사업자등록번호·휴폐업 상태와 폐업일을 함께 담는다. 주민이 우리 동네에서 지역화폐를 받는 음식점이나 가게를 찾거나, 분석가가 시군·업종별 가맹점 분포와 휴폐업 비율을 살피는 데 쓴다. 실측상 전역 조인 키는 확인되지 않아 시군명이나 주소 같은 이름 매핑으로 다른 데이터와 잇고, 사업자등록번호(BIZREGNO)와 위경도는 다른 사업자·공간 자료와 대조하는 단서로 쓴다.
description_portal: '지역화폐 가맹점은 재난기본소득 사용처와 일부 차이가 있을 수 있습니다.- 경기지역화폐가 아닌 타 신용카드로 재난기본소득을 이용하는 경우 각 신용카드 홈페이지에서 사용처를 확인해주시기 바랍니다.- 백화점, 대형마트, 기업형 슈퍼마켓(SSM), 프렌차이즈 직영점 및 유흥 사행업소는 사용이 제한되며, 연 매출 12억 이하인 소상공인 점포에서만 사용 가능합니다.※ 소유 점포가 여러 개일 경우, 합산 매출 12억 이하인 소상공인 점포에서만 사용 가능※ 휴폐업상태(코드) 01 : 계속사업자, 02 : 휴업자, 03 : 폐업자※ 경기지역화폐 가맹점 : https://www.gmoney.or.kr/base/main/view'
