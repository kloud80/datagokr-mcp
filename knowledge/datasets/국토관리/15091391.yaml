description_portal: 이 자료는 충청남도개발공사의 1천만원 이상 공사·용역 발주계획으로, 사업명·설계금액·공종·발주시기·계약방법 등 주요 정보를 제공한다. 단, 세부 공정별 내역이나 업체 선정 사유 등은 포함되지 않는다.키워드별 상세설명○ 발주계획 → 공사나 용역을 수행하기 위해 사전에 수립된 발주 일정과 주요 조건을 의미하며, 기관의 연간 조달계획 수립 근거로 활용됨○ 사업명 → 발주 대상이 되는 공사나 용역의 명칭으로, 사업 목적과 범위를 간략히 나타내는 항목임○ 설계금액 → 사업에 필요한 비용을 사전에 산출하여 표시한 금액으로, 실제 계약금액과 차이가 발생할 수 있음○ 공종 → 해당 발주가 건축·토목·설비·용역 등 어떤 종류의 사업에 속하는지를 나타내는 분류항목임○ 발주시기 → 발주가 실제로 이루어질 예정일을 의미하며, 계획 일정에 따라 변경될 수 있음○ 계약방법 → 해당 사업의 계약 체결 방식으로, 조달계약·수의계약·설계공모 등 다양한 절차가 적용됨○ 발주부서 → 발주 업무를 담당하는 내부 부서를 의미하며, 사업의 관리 책임 부서를 확인할 수 있음○ 공공조달 → 발주계획 전반은 공공조달 체계 하에 운영되며, 투명성 확보와 효율적 사업 집행을 목적으로 제공되는 정보임
