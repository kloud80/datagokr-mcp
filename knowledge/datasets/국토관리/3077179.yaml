description_portal: 충청북도 충주시 내 산업단지에 입주한 기업의 현황 정보를 제공하는 데이터입니다.산업단지명, 회사명, 소재지 주소, 부지 면적(㎡), 종업원 수, 주요 생산품, 기준일자 등의 항목으로 구성되어 있으며, 기업의 입지 현황 및 산업 구조 분석에 활용할 수 있습니다.산업단지 구분은 시에서 관리하는 공식 명칭 기준이며, 신규 단지나 변경 단지 정보는 반영 시점에 따라 다를 수 있습니다.생산품 항목은 통계청 한국표준산업분류(KSIC)를 기준으로 업체가 제출한 주요 품목명을 기반으로 기재되어 있습니다.종업원 수는 사업체 신고 또는 통계 작성 시점 기준으로 작성되었으며, 실제 인원과 차이가 있을 수 있습니다.본 데이터는 산업입지 분석, 기업 유치 전략 수립, 지역 경제 현황 파악, 고용 및 산업구조 연구 등 다양한 공공 및 민간 목적에 활용할 수 있습니다.※ 등록 정보는 수시로 변경될 수 있으며, 상세 사항은 충주시청 기업지원부서 또는 해당 산업단지 관리기관에 문의 바랍니다.
