summary_user: 부산 도시공간정보시스템에서 관리하는 하수 맨홀을 한 개씩 기록한 시설물 원장 파일로, 등록 구·행정동별 설치일자, 최종 준설일자, 우수·오수 구분, 뚜껑 형태·재질, 맨홀 종류·형식, 불량 여부, 측량일자를 담는다. 구청 하수도 담당자나 분석가가 '우리 동네 하수 맨홀 중 불량이거나 오래 준설하지 않은 것은 어디인가' 같은 유지관리·침수 대비 점검 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 등록구·행정동 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 부산광역시 및 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있습니다.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 시설물인   하수 맨홀 정보로 등록구, 설치일자, 최종준설일자, 오우수구분, 뚜껑형태 및 재질, 행정동, 불량여부, 맨홀 종류 및 형식, 측량일자 등을 제공하고 있으며, 각종 공사 등으로 변경되는 자료를 수시로 현행화 하고 있습니다.
