summary_user: 부안군 상하수도요금DB에서 뽑은 요금 요율표로, 업종(가정용·일반용·공공용·산업용·욕탕용 등)과 적용 기간별로 최대 6단계 누진 구간의 시작·종료 사용량과 단계별 요금을 담은 작은 파일(약 6.9KB CSV)이다. 부안군 주민이나 사업자가 자기 업종과 사용량에 적용되는 상수도·하수도 단가를 확인하거나, 분석가가 다른 지자체와 누진 요율 구조를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명이나 적용일자 같은 이름·값 매칭, 또는 같은 기관(부안군) 기준으로만 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 부안군의 상하수도요금DB에서 추출한 자료로, 부안군 관내 상하수도요금에 대한 상세한 요율정보를 제공한다.요율정보는 상수도와 하수도로 구분되며, 기본요금, 사용량에 따른 단가, 업종 및 수용가 유형별 차등요율 등의 항목으로 구성되어 있다.주요 수용가 구분은 가정용, 일반용, 공공용, 산업용, 욕탕용 등으로 다양하며, 각 구분에 따라 적용되는 요율이 상이하게 책정되어 있다.또한, 급수구경, 적용 기준일자, 요율 산정 방식 등 요금 부과에 영향을 주는 다양한 항목이 포함되어 있어 부안군 상하수도요금 체계를 종합적으로 이해하는 데 도움이 된다.이 데이터는 부안군 상하수도요금DB를 기반으로 하며, 요율 변경이나 조례 개정 시 최신 기준에 맞게 정기적으로 갱신된다.해당 정보는 군민의 요금 확인, 타 지자체와의 비교 분석, 공공요금 정책 수립, 민원 대응, 연구 및 통계 분석 등 다양한 행정적 활용에 기여할 수 있다.
