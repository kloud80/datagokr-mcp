description_portal: 한국산업기술기획평가원에서 운영하는 국가균형발전종합정보시스템(NABIS)에 게시된 지역균형발전 관련 사업 중, 중앙부처 및 지자체의 교육 일정 정보를 체계적으로 정리한 데이터입니다. 본 데이터는 다음과 같은 구조로 구성되어 있습니다.  데이터 조회 또는 목록 화면 내 고유 식별자 번호, 지표구분 및 부문, 지표 ,단위, 시도, 시군구, 연도별 발표 데이터 기준년을 정보를 제공합니다. 이 정보는 중앙부처 및 지자체가 지역균형발전 정책의 일환으로 시행하는 교육 프로그램의 규모와 범위, 시기적 분포를 시계열로 파악하고 비교분석할 수 있도록 설계되었습니다. 이를 통해 지역별 교육 자원 배치의 적절성, 교육 프로그램의 활용도, 교육 참여의 지역적 격차 등을 객관적으로 살펴볼 수 있으며, 향후 교육 기획, 예산 편성, 정책 설계 시 중요한 기초자료로 활용될 수 있습니다.
