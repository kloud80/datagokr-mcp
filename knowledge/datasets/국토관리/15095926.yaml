summary_user: 대구광역시 북구의 도로구간을 도로명 단위로 담은 조서로, 도로 종류·상위 도로명·시작 주소와 종료 주소·총 길이·크기(도로 폭 등 규격)를 건별로 제공한다. 분석가나 도시계획 담당자가 '북구의 특정 도로명이 어디서 어디까지 이어지고 길이가 얼마인가'를 확인하거나 도로 현황 기초자료를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 도로명(RN)이나 시작·종료 주소 같은 이름 매핑, 또는 같은 기관 코드로만 연결한다.
limits: 대구 북구 한 시군구만 담고 있어 다른 구·시와 비교하려면 별도 데이터가 필요하다. 표준 코드 형태의 조인 키가 없어 도로명주소 DB 등과 붙일 때 이름 매칭 오차를 감안해야 한다.
