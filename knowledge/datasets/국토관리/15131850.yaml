summary_user: 전북개발공사가 건설한 공공임대주택을 임대대상(건물)·모집회차·면적코드별로 나눠 공급호수, 계약금액, 잔금, 총 보증금(계약금액+잔금), 임대료를 담은 건별 임대조건 데이터입니다. 전북개발공사 임대주택 청약을 준비하는 사람이 '이 단지의 이 면적형에 들어가려면 보증금과 월 임대료가 얼마인가'를 확인하는 데 쓰고, 분석가는 단지·면적별 임대조건 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청약·임대 데이터와는 임대대상명(rentname) 같은 이름 매핑이나 같은 기관 데이터로만 이어 쓴다.
description_portal: 전북개발공사에서 건설한 지역별 공공임대주택의 청약 면적 대비 계약금액 정보를 조회할 수 있는 OpenAPI 서비스입니다.이 API를 통해 건물명, 모집회차, 면적코드, 공급호수, 계약금액, 잔금, 총 보증금, 임대료 등의 항목을 조회할 수 있으며 지역별 임대 조건과 세부 계약 정보를 비교·분석할 수 있습니다.본 서비스는 공공임대주택의 분양 및 임대 현황을 효율적으로 파악하고 주거복지 정책 수립과 임대료 산정, 공급 계획 수립 등에 활용될 수 있습니다. 또한 연구기관, 지자체, 민간사업자 등은 이 데이터를 통해 지역별 임대시장 분석과 공공주택 공급 효율화를 위한 기초자료로 사용할 수 있습니다.
team:
  dept: 디지털전략처
services:
  - op: /getareapricing
    name: 지역별 임대주택 청약 면적 대비 계약 금액 조회
    endpoint: https://apis.data.go.kr/B551971/areapricing/getareapricing
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: rentCode
        required: true
        example: '11'
        desc: 임대대상코드
      - name: rentId
        required: true
        example: '1'
        desc: 단지ID
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
