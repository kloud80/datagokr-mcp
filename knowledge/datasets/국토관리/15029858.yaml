summary_user: 강원특별자치도 동해시가 소유한 시유지를 필지별로 한 줄씩 담은 원천 목록으로, 소재지 주소와 위도·경도, 토지 지목, 면적, 대부 가능 여부, 관리기관과 연락처, 기준일자를 담는다(CSV 약 157KB). 동해시에서 빌려 쓸 수 있는 시유지가 어디에 어떤 지목·면적으로 있는지, 어느 부서에 문의해야 하는지 확인하려는 주민·사업자, 그리고 시 소유 토지의 분포를 보려는 도시계획 분석가가 쓴다. 전역 조인 키(필지 고유번호 등)는 없으므로 다른 토지·건축 데이터와는 소재지 주소 매칭이나 위도·경도 좌표를 이용한 공간 결합으로만 이어 쓴다.
description_portal: '강원특별자치도 동해시의 시유지 현황에 대한 데이터로 소재지, 위도, 경도, 대부가능여부, 토지지목명, 면적, 관리기관명, 관리기관전화번호 등의 데이터를 제공합니다.○ 데이터 활용분야- 도시 계획 및 개발 사업: 시유지의 위치와 용도 등을 파악하여 효율적인 도시 계획 수립 및 개발 사업 추진에 기여합니다.- 행정 정책 수립: 시유지의 효율적인 관리 및 활용 방안을 모색하고, 관련 행정 정책을 수립하는 데 기초 자료로 활용됩니다.- 재산 관리:  공공재산의 현황을 체계적으로 파악하여 공유 재산의 효율적인 관리 및 운영에 기여합니다.- 부동산 정보 분석: 특정 지역의 시유지 현황을 분석하여 부동산 시장 동향 파악 및 투자 의사 결정에 참고할 수 있습니다.'
