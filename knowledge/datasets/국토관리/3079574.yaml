summary_user: 광양시의 공장설립 승인 건을 공장 한 곳당 한 행으로 담은 CSV 파일로, 회사명·시도·시군구·공장 도로명/지번 주소·전화번호·업종명·생산품·데이터기준일을 기록한다. 광양에 어떤 업종의 공장이 어디에 승인됐는지, 특정 생산품을 만드는 지역 업체가 있는지 알고 싶은 사업자·지역산업 분석가가 쓴다. 전역 조인 키는 없어 공장 주소를 지오코딩해 좌표로 붙이거나 회사명·업종명을 이름으로 맞춰 다른 공장등록·산업단지 자료와 연결한다.
