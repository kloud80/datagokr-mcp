description_portal: '이 데이터는 광양시를 포함한 지역의 공장 설립 승인 현황을 기록한 자료입니다. 회사명, 시도 및 시군구 위치, 공장 대표 주소(도로명/지번), 전화번호, 업종명, 생산품 등 주요 정보를 포함하고 있으며, 공장 설립과 관련된 기본적인 현황을 체계적으로 제공합니다. 이를 통해 지역별 산업 분포와 주요 업종별 생산 구조를 파악할 수 있으며, 기업 활동 현황과 산업 기반을 분석하는데 중요한 기초자료로 활용됩니다. 또한 승인된 공장의 위치 정보는 향후 도시계획, 교통망 구축, 지역경제 활성화 정책 수립에 유용하며, 생산품 데이터는 지역 산업 특성과 특화 업종을 확인하는 데 도움을 줍니다. 특히, 데이터기준일을 통해 최신 승인 현황을 관리할 수 있어 행정업무와 민간 산업분석 모두에 중요한 참고 자료로 활용됩니다.* 공란사유: 정보 미보유'
