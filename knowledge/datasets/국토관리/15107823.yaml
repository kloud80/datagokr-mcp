summary_user: 충청남도 보령시 전통시장 안의 편의시설을 시설 한 곳씩 담는 건별 데이터로, 시장명·시설명·시설 분류·시설 설명·점포 번호·이미지 목록과 위도·경도 좌표가 들어 있다. 시민이나 방문객이 '보령 전통시장에서 화장실·주차장 같은 편의시설이 어디에 있나'를 확인하거나, 분석가가 시장별 편의시설 구성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시장명(MRKT_NM) 이름 매칭이나 좌표 기반 위치 결합으로만 이어 쓴다.
limits: 범위가 보령시 한 곳의 전통시장에 한정되어 다른 시군구와 바로 비교하기 어렵고, 공통 코드 키가 없어 연계 시 이름 표기 차이에 주의해야 한다. 호출은 포털 활용신청 후 serviceKey가 필요하며 개발계정은 일 8,000회로 제한된다.
