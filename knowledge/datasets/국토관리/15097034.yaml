description_portal: 이 데이터셋은 제주특별자치도 내 시군별로 가축 분뇨의 처리 형태별 처리량 현황을 정리한 공공데이터입니다. 분뇨처리 방식으로는 공공처리시설을 통한 처리, 액비화, 퇴비화, 재활용신고자 처리 등 다양한 처리 경로가 구분되어 있으며, 각 처리 방식마다 연도 또는 집계 시점 기준으로 처리된 분뇨량이 수치로 기록되어 있습니다. 이를 통해 어느 지역에서 어떤 처리 방식이 많이 이용되고 있는지, 처리 방식별 비중 분포, 지역 간 처리량 차이 및 분뇨 관리 실태를 파악할 수 있으며, 환경정책 수립, 농가 분뇨 관리 정책, 악취 및 수질 오염 저감 계획, 축산-환경 균형 관리 등 환경 행정 및 연구 분야에서 중요한 기초 자료로 활용될 수 있습니다. 데이터는 CSV 형식으로 누구나 무료로 이용 가능하며, 공공데이터포털을 통해 다운로드할 수 있습니다.
