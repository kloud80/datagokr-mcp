summary_user: 광주환경공단이 운영하는 제1하수처리장(광주사업소)·제2하수처리장(송대사업소)·효천하수처리장의 처리수질을 처리장과 측정항목(BOD·TOC·SS·T-N·T-P 등)별로 1~12월 월별 값으로 담은 집계 파일(약 1.4KB CSV)이다. 광주 시민이나 환경 분석가가 "우리 지역 하수처리장 방류수가 달마다 수질 기준을 지키고 있는가, 어느 처리장의 총질소·총인이 높은가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 하수처리장 원장이나 방류수 수질(TMS) 자료와는 처리장명을 이름으로 맞춰 이어 쓴다.
