summary_user: 전국 지방자치단체가 구축해 국토교통부가 취합한 기업도시개발 용도구역 정보를 vworld에서 시도별 SHP 파일로 내려받는 연속주제도 데이터로, 구역별 도면 객체와 고시일자(NTFDATE)·비고 등 속성을 담는다. 사업자나 분석가가 특정 지역 토지가 기업도시개발구역에 들어가는지, 언제 고시됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정구역 코드(COL_ADM_SE)나 이름 매핑, 같은 기관 코드로만 이어 쓴다.
limits: 포털 API가 아니라 vworld 로그인 후 시도별 파일을 직접 내려받는 방식이며 인증키는 필요 없지만 포털 활용신청과는 별개다. 전역 조인 키가 없어 필지·건축물 데이터와 바로 키로 결합할 수 없다.
