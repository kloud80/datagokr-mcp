summary_user: 인천광역시가 「건설기술 진흥법」에 따라 등록을 수리하고 등록번호를 부여한 건설엔지니어링 업체를 업체 한 곳당 한 행으로 담은 명부 파일(CSV)로, 업체명·전문분야·세부분야·소재지를 담는다. 발주처나 사업자가 '인천에 등록된 특정 전문분야 건설엔지니어링 업체가 어디에 있는가'를 확인하거나, 분석가가 지역 내 분야별 업체 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 「건설기술 진흥법」제26조(건설엔지니어링업의 등록 등) 에 따라 한국건설엔지니어링협회로부터 건설엔지니어링 등록 신고 검토결과 적격으로 통보된 업체에 대하여 인천광역시에서 수리하고 등록번호를 부여한 건설엔지니어링 업체에 대한 기본 정보(업체명, 대표자, 업종 등)를 나타냅니다.이 공공데이터는 단순한 명부를 넘어, 건설 산업 내의 기술 생태계를 파악하고 정책 수립이나 시장 분석을 위한 기초 자료로 유용하게 사용됩니다.해당 데이터는 인천시 사전정보공개 또는 공공데이터포털에서 확인할 수 있습니다.
