description_portal: 본 데이터는 한국토지주택공사의 최근 5년간 주택 및 토지에 적용되는 이자율의 변동 내역을 제공합니다. 제공하는 이자율의 종류는 할부이자율, 연체이자율, 선납이자율 세가지입니다. 각 이자율에는 적용시작일자와 적용종료일자가 있는데 이는 해당 이자율이 처음 적용된 시점과 적용이 종료된 시점을 말합니다. 적용종료일자가 9999-12-31로 표기된 이자율은 현재 적용중이고 종료일자가 정해지지 않은 이자율을 말합니다. 할부이자율은 토지 또는 주택 대금을 할부로 납부하는 경우에 적용되는 이자율 입니다. 할부이자율은 시작월수 0, 종료월수 9999로 표시되어 있는데 이는 할부기간 내내 이자율이 변경되지 않음을 뜻합니다. 연체이자율은 대금 납부기한까지 미납한 경우 그 미납액에 대하여 납부기한 익일부터 적용되는 연체금의 이자율을 말합니다. 연체이자율은 그 연체 기간에 따라 달라질 수 있기 때문에 시작월수와 종료월수를 관리하고 있습니다. 선납이자율은 대금을 약정일보다 일찍 납부할 경우 적용되는 할인율을 말합니다. 할부이자율과 마찬가지로 선납이자율도 선납기간에 따른 이자율의 변동이 없기 때문에 시작월수 0, 종료월수 9999로 표기되어 있습니다. 모든 이자율은 연이율이며 단위는 %입니다.
