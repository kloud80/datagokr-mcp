summary_user: 한국농어촌공사가 지사별로 관리하는 농업용 저수지의 시설 정보(시설구분, 시설명, 표준코드, 본부·지사명, 소재지, 대표지번, 관리자, 관리자주소)를 저수지 한 곳당 한 행으로 담은 전국 3,420건의 파일 데이터다. 우리 동네 저수지를 어느 지사가 관리하는지, 관리자는 누구인지 확인하려는 주민이나 유지관리·안전점검·재해예방 담당자가 쓴다. 소재지와 관리자주소(address)가 조인 키라서 주소 기준으로 다른 자료와 이어 쓰며, 표준코드는 저수지 식별 용도로 보이나 코드표는 따로 주어지지 않았다.
description_portal: '한국농어촌공사 농업기반시설제원 지사별 관리중인 저수지에 대한  시설제원 정보입니다.- 농업용 저수지는 농업용수를 확보하기 위해 빗물이나 하천수 등을 모아 저장하는 인공저수시설입니다.- 본데이터는 저수지에 대한 정보(시설구분, 시설명, 표준코드, 본부명, 지사명, 소재지, 대표지번, 관리자, 관리자주소)을 제공합니다.- 해당 데이터는 저수지의 유지관리, 안전점검, 재해예방 등에 활용될 수 있으며,- 해당 데이터의 각 단위는 아래 내용을 참고하시기 바랍니다.<단위> 면적: (ha)빈도: (년)체적: (m2)길이: (m)저수량: (천m3)홍수위: (EL.m)'
