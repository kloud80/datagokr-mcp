summary_user: 제주특별자치도에 소재한 지적측량업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업종·등록번호·등록일자·상호·소재지·전화번호와 관련 부서 연락처가 들어 있다(CSV 341바이트의 소규모 파일). 제주 토지의 경계 복원이나 분할 측량을 맡길 지역 지적측량업체를 찾는 토지 소유자나, 도내 측량업 등록 현황을 살피는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호·소재지 주소를 맞추거나 같은 기관(제주특별자치도) 자료끼리만 연결한다.
description_portal: '제주특별자치도 내 소재하는 지적측량업체 데이터를 제공합니다.항목: 업종, 등록번호, 상호, 소재지, 전화번호 등*지적: 국토를 필지 단위로 구획화하여 토지에 대한 현황을 등록·관리함*지적측량: 토지를 지적공부에 등록하거나 지적공부에 등록된 경계를 복원할 목적으로 소관청이 직권 또는 이해관계인의 신청에 의해서 각 필지의 경계 또는 좌표와 면적을 정함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1226'
