summary_user: 제주 서귀포시 JDC 산하 국제학교 브랭섬홀 아시아(BHA)의 2018년 6월 기준 학생 현황을 과정·학년별 한 행씩 담은 소규모 집계 파일(csv, 423바이트)로, 학급 수·정원·남녀 학생 수·외국인과 내국인 학생 수를 담는다. 교육 행정 담당자나 분석가가 '이 국제학교의 학년별 내국인 대비 외국인 학생 비중과 성비는 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과정명이나 같은 기관(JDC)의 다른 국제학교 학생 수 자료와 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도 서귀포시에 위치한 제주국제자유도시개발센터(JDC) 산하 국제학교인 브랭섬홀 아시아(BHA)의 2018년 6월 기준 학생 현황을 정리한 자료입니다. 각 데이터 항목은 과정명, 학급 수, 남학생 수, 여학생 수, 국적(외국인) 수, 국적(내국인) 수 순으로 구성되어 있으며, 과목명에는 주니어 준비 과정, 주니어 과정, 시니어 과정을 포함해 1학년부터 12학년까지의 학년별 구분이 포함되어 있습니다. 이를 통해 전체 학급 규모, 성별 구성 비율, 외국인과 내국인 학생 수의 분포를 학년별로 확인할 수 있으며, 학령 단계별 국제 학생 유입 현황과 국내 학생의 참여 비중 등을 종합적으로 파악할 수 있습니다. 특히 BHA가 운영하는 다양한 교육과정이 국제학교의 특성을 반영하여 구성되어 있다는 점에서, 해당 데이터는 다문화 교육환경 조성, 학생 구성 다양성, 외국인 유학생 비율 분석 등 다양한 교육 행정 및 정책 수립에 필요한 기초자료로 활용될 수 있습니다. 또한 학년별 학생 수 증감 추세, 과정별 수요 변화, 성비 분석 등 교육과정 운영의 효율성과 미래 수요 예측에도 유의미한 참고자료로 기능합니다.
