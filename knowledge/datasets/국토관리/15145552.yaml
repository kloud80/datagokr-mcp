summary_user: 인천 연수구 선학동에서 직장인 할인 행사 '맛잇데이'에 참여하는 음식점을 업소별로 정리한 소규모 CSV 파일(약 2.7KB)로, 업종·업소명·소재지·전화번호·베스트메뉴·혜택·할인 조건을 담는다. 선학동 인근 직장인이 '점심에 할인받을 수 있는 근처 식당과 조건이 무엇인가'를 찾을 때나, 구청·상권 분석가가 참여 업소 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·소재지 주소를 이름 매칭하거나 같은 연수구의 다른 동 맛잇데이 파일과 나란히 붙여 쓴다.
