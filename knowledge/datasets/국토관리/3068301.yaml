summary_user: 경상북도 영덕군 9개 읍면과 특정지역 2곳(영해대리, 창수보림) 등 11개 지역의 월별 강우량을 지역 1행·월 1열(2025년 1~12월) 형태로 담은 집계 파일이며, 파일 크기는 약 1KB(1,056바이트)이다. 영덕군 농업인·주민이나 지역 재해 담당자가 "올해 우리 면에 월별로 비가 얼마나 왔고 어느 달에 집중됐나"를 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키(관측소코드·행정코드)가 없어 지역 이름(지역)을 읍면 행정구역명과 맞춰 붙여야 하며, WAMIS 관측소 기준 시계열과도 이름 매핑으로만 연결된다.
description_portal: 경상북도 영덕군에 발생한 9개 읍면(영덕읍, 강구면, 남정면, 달산면, 지품면, 축산면, 영해면, 병곡면, 창수면)별 및 특정지역(영해대리, 창수보림) 포함 총 11개 지역에서 발생하는 월별 강우량 정보를 아래와 같이 제공하고자 합니다.강우량(降雨量)이란?강우량은 일정 시간 동안 특정 지점에 내린 비의 양을 의미합니다.단위는 주로 **밀리미터(mm)**로 표시되며, 이는 1㎡ 면적에 내린 빗물의 높이를 나타냅니다.예를 들어, 강우량 10mm는 1㎡ 면적에 10리터의 빗물이 쌓였다는 뜻입니다.강우량은 기상 예보, 농업, 수자원 관리, 재해 예방(홍수, 가뭄) 등 다양한 분야에서 중요한 지표로 활용됩니다.
