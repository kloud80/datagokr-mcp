summary_user: 서울특별시에 조성된 실내형 공개공간(건축물 내부에 만든 공개공지)의 현황을 한 곳씩 담은 목록으로, 일련번호·자치구·주소·비고 정도의 항목으로 구성되며 포털 설명상 2026년 6월 기준 한 곳입니다. 시민이나 도시·건축 분석가가 '서울에서 날씨와 상관없이 누구나 이용할 수 있는 건물 내부 휴식공간이 어디에 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치구 이름이나 주소 문자열을 매칭해 다른 건축물·공개공지 데이터와 연결해야 한다.
description_portal: 본 데이터는 서울특별시 건축조례 제26조제2항제7호에 따라 서울특별시에 조성된 실내형 공개공간 현황에 대한 데이터셋입니다.공개공지(공개공간)는 건축법 제43조에 따라 지역의 환경을 쾌적하게 조성하기 위하여 일정 용도와 규모를 갖춘 건축물에 조성되는 공간으로 일반인 누구나 사용할 수 있는 소규모 휴식시설입니다.그 중 실내형 공개공간은 기후 여건 등을 고려해 건축물 내부공간을 활용하여 조성되는 공개공지(공개공간)로 전국 지자체 최초로 도입하였습니다.※ 2026년 6월 기준 한 곳입니다.
