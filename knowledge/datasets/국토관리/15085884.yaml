summary_user: 전국 산업단지를 국가·일반·도시첨단·농공단지 유형별로 나눠 지정면적, 산업시설구역 면적·분양·미분양·분양률, 입주업체 수와 가동업체 수를 정리한 요약 통계 파일(CSV, 1,827바이트)입니다. 외국인 투자자나 투자 유치 담당자가 유형별 산업단지의 남은 분양 여력과 입주 대비 가동 비율을 비교해 입지 후보를 좁힐 때 씁니다. 전역 조인 키나 산업단지코드가 없어 다른 산단 통계나 단지 원장과는 시도·시군·단지명 같은 이름 매핑으로만 이어 쓸 수 있습니다.
description_portal: 본 통계는 외국인 투자자 및 해외 이해관계자가 대한민국의 산업 인프라와 산업단지 운영 현황을 종합적으로 이해할 수 있도록, 전국 산업단지의 주요 현황을 유형별로 정리한 요약 통계 자료입니다. 산업단지는 관련 법령에 따른 분류 기준에 따라 국가산업단지, 일반산업단지, 도시첨단산업단지, 농공단지의 네 가지 유형으로 구분하여 집계하였습니다.본 시트에는 산업단지 유형별로 지정면적, 산업시설구역 전체면적, 산업시설구역 분양면적, 입주업체 수, 가동업체 수 등 산업단지의 규모, 토지 이용 현황, 기업 활동 수준을 파악할 수 있는 핵심 지표가 포함되어 있습니다. 이를 통해 산업단지의 물리적 조성 규모와 함께 실제 기업 입주 및 가동 현황을 종합적으로 파악할 수 있도록 구성하였습니다.지정면적은 산업단지로 공식 지정된 전체 면적을 의미하며, 산업시설구역 전체면적은 이 중 제조·산업 활동을 목적으로 계획된 산업시설용지의 총면적을 나타냅니다. 또한 산업시설구역 분양면적은 산업시설구역 가운데 기업에 공급 가능한 면적으로, 산업단지의 개발 여력과 투자 수용 가능성을 판단하는 주요 지표로 활용됩니다.기업 활동과 관련된 지표로는 입주업체 수와 가동업체 수가 포함되어 있습니다. 입주업체 수는 산업단지 내 산업시설용지에 대해 입주 계약을 체결한 업체 수를 의미하며, 가동업체 수는 실제로 생산 또는 사업 활동을 수행 중인 업체 수를 나타냅니다. 두 지표는 산업단지의 입주 진행 수준과 실질적인 운영 현황을 비교·분석하는 데 중요한 기준이 됩니다.본 전국 산업단지 현황통계(외국인 시트)는 외국인 투자 유치, 산업단지 입지 검토, 산업 정책 및 투자 환경 분석을 위한 기초 참고자료로서 활용되며, 산업단지 유형별 특성과 운영 실태를 체계적으로 비교·이해할 수 있도록 지원합니다.
