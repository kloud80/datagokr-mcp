summary_user: 경기도에 등록된 공장을 한 곳씩 담은 건별 명부로, 회사명·관할 행정기관·설립구분·용지 및 건축면적·종업원 수·공장규모·등록일·업종·생산품·용도지역·지목·주소·위경도를 담는다. 분석가나 지자체 담당자가 '어느 시군에 어떤 업종 공장이 얼마나 몰려 있고 규모는 어떤가'처럼 지역 제조업 분포와 밀집도를 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 다른 자료와는 지번·도로명 주소나 위경도로 위치를 맞추거나 업종코드(INDUTYPE_CD_INFO)와 업종명을 산업분류에 이름·코드 매핑해 이어 쓴다.
description_portal: 경기도 내 공장등록 현황입니다. 개인정보 제외한 업체명, 공장주소, 대표연락처, 주요생산품, 업종명 등으로 구분하여 공장등록 정보를 제공합니다.이 데이터는 경기도 내 산업단지에 등록된 공장의 기본 정보를 정리한 자료로, 각 공장의 회사명, 행정기관명, 설립구분, 용지면적 및 건축면적, 종업원 수, 공장규모, 등록일, 업종 및 생산품 정보 등을 포함합니다. 또한 지목 및 용도지역명, 전화번호, 주소(지번 및 도로명), WGS84 기준 위도·경도 좌표까지 포함되어 있어 공장의 위치와 행정 정보, 산업분류를 종합적으로 파악할 수 있습니다. 이 데이터는 지역 산업 기반 분석, 공장 밀집도 조사, 산업단지 개발계획 수립, 환경관리 및 규제 정책 설계 등에 활용될 수 있습니다.
