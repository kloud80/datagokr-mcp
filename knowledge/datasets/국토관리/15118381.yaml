description_portal: 본 데이터는 한국수자원공사에서 관측한 토양 수분량 자료로, 용담시험유역 6개 지점(주천, 부귀, 상전, 안천, 천천, 계북)의 토심별 일별 수분량을 포함한다. 부귀·주천은 10, 20, 40, 60cm 정보를, 나머지 4개소는 80cm까지 5개 심도 정보를 제공한다. 측정지는 진안군과 장수군으로, 각각 주양리, 황금리, 주평리, 신괴리, 장판리, 원촌리에 해당한다. 자료는 mm 단위로 기록되며, 일자별 시계열 형식으로 구성된다. 사용자는 수분 추이를 분석해 가뭄 모니터링, 재배 시기 결정, 품종 선택, 물 공급 전략 등 정밀농업 및 수자원 관리에 활용할 수 있다. 본 자료는 수문조사연보와 일부 상이할 수 있으며, 공인 자료와 병행해 참고하는 것이 바람직하다.
