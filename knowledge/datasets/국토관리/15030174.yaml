summary_user: 경주시 관내 배수펌프장을 시설 한 곳당 한 행으로 담은 파일로, 시설물명·주소·준공일·종별·하천명·하천계획홍수위·펌프가동수위·펌프용량(분당 세제곱미터)·관리주체를 담는다(CSV 약 1.5KB의 소규모 목록). 시민이나 방재 담당자가 "우리 동네 하천 옆 배수펌프장은 어디 있고 용량은 얼마이며, 몇 미터 수위에서 가동되나"를 확인하는 데 쓴다. 전역 조인 키가 없어 하천명이나 주소를 문자열로 맞춰 하천 목록·침수 관련 데이터와 이어 써야 한다.
description_portal: 본 데이터는 경상북도 경주시 관내에 설치된 배수펌프장의 시설 현황을 정리한 파일 형태의 공공데이터이다. 배수펌프장은 집중호우나 지하수, 생활하수 등의 배수를 원활하게 하기 위해 설치된 시설로, 지역의 침수 예방과 도시 안전 확보에 중요한 역할을 수행한다. 데이터에는 펌프장명, 위치, 설치일자, 펌프 용량, 운영 현황, 관리 주체 등의 정보가 포함되어 있으며, 도시 방재 계획과 시설 유지보수, 운영 효율화 등의 행정 업무에 활용 가능하다. 또한 재난 대응 체계 구축, 환경관리, 인프라 현황 분석, 정책 수립 및 연구 목적으로도 활용될 수 있다. 경주시는 해당 데이터를 정기적으로 갱신하여 최신 정보를 제공하고 있다.
