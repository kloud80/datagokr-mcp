summary_user: 충청남도 계룡시 관내에 등록된 제조업체를 업체 한 곳씩 담은 목록으로, 업체명·소재지·주요 생산품·전화번호·공장 등록 여부를 제공하며 포털 설명상 2021년 9월 1일 기준으로 수집된 자료다. 계룡시에서 어떤 품목을 만드는 공장이 어디에 있는지 찾으려는 사업자나, 지역 제조업 분포를 살피려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 팩토리온 공장등록 정보 등 다른 데이터와는 업체명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 조인 키가 없어 다른 기업·토지 데이터와 자동으로 연결되지 않고, 업체명·주소 매칭에 기대야 한다. 범위는 계룡시 한 곳뿐이어서 다른 시군과 비교하려면 별도 자료가 필요하다. 개발계정은 하루 10,000회까지 호출할 수 있다.
