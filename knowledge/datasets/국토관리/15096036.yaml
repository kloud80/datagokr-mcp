description_portal: 충청남도 계룡시의 '제조업체 현황 API' 데이터는 관내에 등록되어 운영 중인 제조업체들의 기본 정보를 실시간으로 제공하는 산업 행정 정보 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 제조업체 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 해당 시설의 공식 명칭인 기업체 명과 정확한 소재지, 생산 활동의 핵심 품목인 주요 생산품, 그리고 연락을 위한 전화 번호가 포함됩니다. 또한, 업체의 공식적인 등록 상태를 나타내는 공장 등록 정보도 제공됩니다.
