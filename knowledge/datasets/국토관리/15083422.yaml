description_portal: 부산광역시에서 상하수도 요금 계산을 위해  사용되는 요금 납부 정보 자료입니다. 지방세법, 부산광역시 수도요금 등 부과·징수 사무처리 규정  등취소원부터 가정 수도꼭지까지 꼼꼼한 수질 관리최적은 상수도 관망환경 조성수도사업 시스템 선진화로 미래기반조성고품질의 서비스 제공 및 복지 행정 추진배수지등 상수도 공급시설 확충안전한 물 공급이 목표입니다.물은 생명의 시작이며 인간의 생명을 유지하기 위한 가장 기본적인 필수 요소입니다.소중한 자원인 물을 깨끗하고 안전하게 지켜 후세에 돌려주는 것은 현재를 살아가는 우리에게 주어진 책임이자 의무입니다.
