summary_user: 서울시 정수센터 6곳(강북·광암·구의·뚝도·암사·영등포)의 일일 취수·송수량과 수도사업소 8곳의 일일 공급량을 사업소·일자별 측정값(MSRMT_VL)으로 담는 일별 집계 자료다. 상수도 분석가나 시민이 '특정 정수센터의 하루 취수량과 송수량이 계절·기간에 따라 어떻게 변하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 일자(YMD)와 사업소 코드·이름으로만 같은 기관의 다른 상수도 자료와 맞춰 쓴다.
description_portal: 서울특별시 6곳의 정수센터(강북, 광암, 구의, 뚝도, 암사, 영등포)의 일일 취수/송수 통계 현황 과 8곳의 수도사업소(중부, 서부, 동부, 북부, 강서, 남부, 강남, 강동)의 공급량 일일 통계 현황 서비스입니다. 최근 일자의 통계에 대해서는 각 사업소별 유량계(측정 지점)의 보정 데이터가 반영되지 않을 수도 있으므로 4~7일 이상의 이전의 데이터를 유효한 데이터로 판단할 수 있는 정보입니다.제공부서는 서울특별시 상수도사업본부 시설부 공간정보과(02-3146-1513) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
