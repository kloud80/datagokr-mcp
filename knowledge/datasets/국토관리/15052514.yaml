summary_user: 새만금 유역 가력도 지점의 수위를 연·월·일·시 행마다 10분 간격(00~50분) 계측값과 시간별 최대·최소·평균으로 담은 단일 관측 지점의 시계열 파일(CSV, 약 68만 바이트)입니다. 새만금 담수호 수위 변동을 확인하려는 분석가나 홍수·재해 대응 담당자가 "특정 기간 가력도 수위가 시간대별로 얼마나 오르내렸나" 같은 질문에 쓴다. 실측 컬럼에 관측소코드 같은 전역 조인 키가 없어, 다른 수문 자료와는 날짜·시각과 지점명(가력도)을 맞추거나 같은 기관의 다른 새만금 수위 파일과 이어 쓴다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 새만금 유역 내 가력도에 대한 수위 데이터 입니다.- 신시도는 전라북도 부안군 변산면에 속한 섬으로 새만금 방조제 서쪽 끝에 위치하며 새만금 내측 담수호와 외측 해수의 수문 및 배수관리의 거점지 입니다.- 본 데이터는 가력도 수위 계측 정보로 월별, 10분단위, 최대, 최소, 평균값을 제공하고 있으며- 계측자료가 없는 일자(시간)데이터는  계측장비의 정비, 점검, 통신이상 등의 현장 사정에 따라 누락 될 수 있습니다.- 수위계측 자료는 홍수 및 재해 대응에 활용 가능하며- 새만금 수자원 관리, 환경 모니터링, 정책 수립 등에 활용 가능합니다.'
