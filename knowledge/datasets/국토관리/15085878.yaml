description_portal: 농공산업단지 현황을 보여주는 통계표입니다. “농공산업단지”는 농촌 지역의 산업 기반을 육성하고 농촌 주민의 소득을 증대하기 위해 조성된 소규모 산업단지입니다. 도시 대규모 산업단지와 달리, 지역 농산물 가공업이나 중소 제조업 중심으로 구성되어 있으며, 농촌의 고용 창출과 지역경제 활성화를 주된 목적으로 하고 있습니다. 통계표를 활용하여 통계항목에는 단지명, 지정면적, 입주업체, 가동업체, 생산액, 수출액 등이 있습니다. 가동업체 2개 이하인 산업단지는 통계자료를 모두 X로 표시하여 공표하고 있습니다.
