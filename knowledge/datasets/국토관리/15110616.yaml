summary_user: 경상북도 영천시가 허가한 공원·녹지 점용 건을 허가번호별 한 줄로 담은 원천 목록으로, 허가 유형, 지번주소, 토지면적, 허가 시작·종료일, 공시지가, 점용료를 포함하며 범위는 영천시 한 곳이다(CSV 약 4KB). 시민·사업자나 분석가가 '영천시 공원·녹지에서 어떤 유형의 점용이 어느 지번에 언제까지 허가됐고 점용료는 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 이름·주소 매칭으로 맞추거나 같은 기관(영천시) 자료끼리만 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시의 공원 및 녹지 점용 허가 데이터입니다. 본 데이터는 영천시 내에서 허가된 공원과 녹지 공간의 점용 내역을 체계적으로 기록한 자료로서, 허가번호, 허가 유형, 지번주소, 토지면적, 허가 시작일과 종료일, 공시지가, 점용료, 데이터 기준일자 등의 정보를 포함하고 있습니다. 이를 통해 영천시의 녹지 및 공원 공간 활용 현황과 허가 현황을 파악할 수 있으며, 도시계획, 환경관리, 정책 수립 등 다양한 분야에서 활용이 가능합니다. 데이터는 허가된 토지의 위치와 면적, 허가 기간, 관련 비용 등을 상세히 제공하여, 관련 기관이나 시민들이 영천시의 녹지 공간 이용 현황을 쉽게 이해하고 분석할 수 있도록 구성되어 있습니다. 미집계된 데이터의 경우 공란데이터로 제공하였습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 공원관리사업소로 연락주시기 바랍니다.
