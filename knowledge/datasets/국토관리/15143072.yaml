description_portal: 도시계획이란 도시의 바람직한 미래상을 정립하고, 이를 시행하려는 일련의 과정을 말합니다. 우리나라는 급속한 산업화와 도시화로 경제성장을 이루었지만, 인구의 도시집중에 따른 과밀화와 도시의 무질서한 확산 등 각종 도시문제가 발생하였습니다.도시의 장래 수준을 예측하여 바람직한 미래상을 설정하여 여기에 맞게 규제나 유도정책 혹은 정비수단 등을 통하여 도시를 건전하고 적정하게 관리해나가는 수단입니다.이를 위한 부산광역시 도시계획정보시스템 실시계획 인가 내역 데이터로서 계획관리명, 계획작성일자 등의 자료를 제공합니다.
