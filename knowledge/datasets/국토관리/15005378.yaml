summary_user: 대구광역시 전체와 구·군별(중구~달성군, 군위군 포함)로 주거·상업·공업·녹지·관리·농림·자연환경보전 등 용도지역의 면적(㎡)을 담은 집계표이며, 필지 단위 원천이 아닌 1.8KB 남짓의 작은 CSV 파일입니다. 도시계획 분석가나 연구자가 '대구에서 어느 구·군에 공업지역이나 녹지지역이 얼마나 지정돼 있나'를 비교할 때 쓴다. 전역 조인 키가 없어 행정구역 이름(구·군명 열)을 다른 구·군별 통계와 이름 매핑해 이어 쓰고, 개별 토지의 용도지역은 토지이음에서 따로 확인한다.
description_portal: 이 자료는 「국토의 계획 및 이용에 관한 법률」에 따른 용도지역 현황자료로 대구광역시 구군별 용도지역(주거지역, 상업지역, 공업지역, 녹지지역, 관리지역, 농림지역, 자연환경보전지역)의 면적을 제공합니다.“용도지역”이란 토지의 이용 및 건축물의 용도, 건폐율, 용적률, 높이 등을 제한함으로써 토지를 경제적·효율적으로 이용하고 무분별한 개발을 방지하며 공공복리의 증진을 도모하기 위하여 서로 중복되지 아니하게 도시·군관리계획으로 결정하는 지역을 말합니다.토지별 용도지역은 토지이음(https://www.eum.go.kr/)에서 확인이 가능합니다.
