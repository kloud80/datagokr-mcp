summary_user: 의무관리대상 공동주택의 공용부분 시설 교체·유지보수·하자보수 이력을 시설별로 담은 API로, 공사종별·수선방법·수선주기·공사완료일·공사비용·경과/잔여기간을 제공하며 범위는 전국이다. 입주민이나 관리사무소, 분석가가 특정 단지의 어떤 시설을 언제 어떤 방법으로 수선했고 다음 수선까지 얼마나 남았는지 확인하는 데 쓴다. 필수 파라미터 단지코드(kaptCode)는 같은 K-apt 계열의 다른 데이터에서 먼저 받아 넘겨야 하며, 이 단지코드로 실거래 단지명·공시·청약 단지와 이름·코드 매핑을 거쳐 이을 수 있다.
description_portal: (공동주택 유지관리이력정보) 「 공동주택관리법 시행령」제32조에 따라 의무관리대상 공동주택의 관리주체는 공용부분에 관한 시설의 교체, 유지보수 및 하자보수 등을 한 경우에는 그 실적을 시설별로 이력관리 하여야 하며, 공동주택관리정보시스템에도 등록하여야 함. 이에 따라 시스템에 축적된 공동주택 유지관리 이력 (건물외부,건물내부,전기/소화/승강기 등, 난방 및 급탕 설비 외 부대설비) 데이터 제공
