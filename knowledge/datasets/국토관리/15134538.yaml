summary_user: 서울시 생태현황도 중 개별비오톱 평가도를 담은 공간정보로, 비오톱(생물서식공간) 단위 도형마다 비오톱 유형·면적·평가 항목·개별평가 등급 같은 속성을 가진다(좌표계 EPSG:5174, 인코딩 windows-949). 도시계획·환경 분석가가 '이 개발 예정지 주변 비오톱의 생태적 평가 등급이 얼마나 높은가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 공간 중첩(지도 위 겹치기)이나 이름·코드 매핑으로만 연결한다.
description_portal: 서울시 개별비오톱평가 공간정보 입니다.비오톱 (생태서식공간, biotope)이란? 특정한 식물과 동물이 하나의 생활공동체를 이루어 지표상에서 다른 곳과 명확히 구분되는 생물서식지를 말합니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
