summary_user: SH공사가 공급한 청년매입임대주택의 주택별 당첨자·예비자 커트라인(신청순위와 가점총점)을 자치구·주택명·주소지·성별 구분과 함께 담은 집계 파일로, 약 8KB 규모의 CSV입니다. 청년 신청자가 "내가 원하는 자치구 매입임대에 당첨되려면 몇 순위·몇 점이 필요했나"를 가늠하거나, 분석가가 지역별 경쟁 강도와 가점제 운영을 평가하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명·주택명 같은 이름 매핑이나 같은 기관(SH공사) 공고 자료로만 이어 쓴다.
description_portal: '이 데이터는 서울주택도시공사(SH공사)가 공급하는 청년매입임대주택과 관련하여, 공고별 당첨자 및 예비자 현황을 정리한 자료입니다. 주요 항목에는 자치구, 주택형(예: 원룸, 투룸), 주소지(동 단위 또는 상세 주소), 성별, 당첨자 커트라인 신청순위 및 가점총점, 예비자 커트라인 신청순위 및 가점총점 등이 포함되어 있어, 주택 유형별 경쟁률과 선발 기준을 종합적으로 파악할 수 있습니다. 신청순위는 우선공급 조건에 따른 신청자 유형을 나타내며, 가점총점은 소득, 거주기간, 무주택기간 등 신청자의 조건을 수치화한 점수입니다. 이 데이터를 통해 지역별 경쟁 강도, 당첨자 특성, 예비자 진입 기준 등을 정량적으로 분석할 수 있으며, 향후 청년임대 정책 설계, 가점제도 운영 평가, 수요-공급 조정 등에 활용도가 높습니다.'
