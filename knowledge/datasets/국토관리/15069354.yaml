summary_user: 중소벤처기업진흥공단이 운영하는 자산거래중개장터(중고 기계설비·자산 중개 사이트)에 매물로 등록된 공장을 한 건씩 담은 목록으로, 공장명·소재지·용지면적·연면적·준공년도·용도지역·기계 포함 여부·진행상태 등을 전국 범위로 담는다(CSV 약 14KB 규모). 공장을 사거나 빌리려는 중소기업이 특정 지역에서 기계까지 포함해 거래되는 공장 매물의 면적과 준공 시점을 비교할 때 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 공장등록 데이터와는 소재지 주소나 공장명을 맞춰 보는 방식으로만 연결한다.
description_portal: '자산거래중개장터 등록 공장 목록은 중소벤처기업진흥공단에서 운영중인 자산거래중개장터에 등록된 공장 데이터입니다. 데이터가 발생된 시점부터 추출했습니다.(제공 데이터 : 공장명, 소재지, 용지면적, 연면적, 가격협의가능, 공장등록여부, 준공년도, 용도지역, 기계포함여부, 게시기간, 메인노출여부, 진행상태, 개인_기업구분 등)자산거래중개장터(www.joonggomall.or.kr)는 중소기업에서 사용하는 기계설비의 신속한 거래중개 정보를 제공하는 온라인 종합 중개장터입니다.'
