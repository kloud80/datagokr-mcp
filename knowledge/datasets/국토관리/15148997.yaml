description_portal: '지적재조사 시스템 내 공지·자료실·FAQ 등 게시판에 게시된 글의 메타데이터를 제공하는 셋입니다. 지적재조사와 관련된 게시글의 정보는 제목, 분류, 등록·수정일시, 공지 여부, 조회량, 첨부 유무, 외부 링크 등 접근에 필요한 핵심 속성을 담고 있습니다. 이용자는 최신 공지, 배포 자료, 업무 가이드의 위치를 쉽고 체계적으로 파악할 수 있으며, 시스템 운영 측면에서는 콘텐츠 현행화와 공개성 점검에 활용됩니다. 개인정보·저작권 이슈를 고려해 본문 전문은 비공개(또는 요약)로 관리하는 방침을 전제로 합니다.게시글분류코드는 다음과 같습니다. 001 : 공지사항, 002 : 지적재조사뉴스, 003 : 자료실, 004 : 지적재조사사례, 005 : 지적재조사홍보자료101. 9999, 9999:   내부게시글'
