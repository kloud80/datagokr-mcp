description_portal: '○ 통계개요1998년~2006년 통계 데이터* 통계명 : 광업 및 제조업 현황* 통계종류 : 서울시 광업 및 제조업 현황을 제공하는 지정ㆍ조사통계* 근거법령 :「광업제조업조사 규칙」(기획재정부령 제57호)* 작성목적 : 광업 및 제조업부문의 사업체 및 종사자 현황과 생산ㆍ출하ㆍ재고액의 추이를파악하여, 산업활동과 관련된 각종 정책의 수립 및 평가, 기업의 경영 계획 수립및 학계, 연구소 등의 학술연구를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 사업체 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 광업 및 제조업의 각 자치구 동별 사업체수, 종사자수, 연간급여액,생산ㆍ출하ㆍ재고액, 주요생산비, 부가가치, 유형자산연말잔액 등○ 용어설명* 연간급여액 : 연간급여액의 합계(상여금 등 각종 수당 포함)는 보험료, 근로조합비 등을공제하기 이전의 급여액이며 퇴직금, 복지후생비를 제외한 급여액임* 생산액 : 제품출하액, 부산물ㆍ폐품, 임가공(수탁제조) 및 수리수입액의 합계에서재고액의 완제품과 반제품 및 재공품의 연초, 연말재고액의 증감액을 가감한 것을 말함* 출하액 : 1년간의 제품출하액, 부산물ㆍ폐품판매액, 임가공(수탁제조) 및 수리수입액의합계를 말하며 이 기간에 발생한 출하, 수탁제조 및 수리수입액에 대한 미수금을 포함하였음* 재고액 : 연초재고액은 1월1일 기준, 연말재고액은 12월31일 기준으로 재고대상물의 사업장내 실재 여부를 불문하고 그 사업체의 소유에 속하는 제품(완제품과 반제품 및 재공품),원재료 및 연료의 재고액을 말함* 주요생산비 : 생산에 사용(소비)된 제 비용인 원재료비, 연료비, 전력비, 용수비, 외주가공비, 수선비를 말함'
