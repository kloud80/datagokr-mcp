description_portal: 해당 자료는 경상남도 통영시 상하수도인구현황 자료로서, 경상남도 통영시 읍면동 별 상수도 및 하수도를 사용하는 인구 현황을 나타낸 자료입니다.해당 자료는 2025년 시행된 자료조사를 기준으로 한 자료로, 조사기준일은 2025년 12월 31일입니다.해당 자료의 표시 행정구역은 산양읍,용남면,도산면,광도면,욕지면,한산면,사량면,도천동,명정동,중앙동,정량동,북신동,무전동,미수동,봉평동으로 총 15개 읍면동 입니다.본 자료는 경상남도 통영시 상하수도과에서 제공하고 있습니다. 자세한 설명이 필요한 경우 통영시청 상하수도과(055-650-6410)로 문의하실 수 있습니다.
