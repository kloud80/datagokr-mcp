description_portal: '경상북도 영천시 빈집 현황 데이터는 항목을 포함하고 있습니다. 이 데이터는 지역별(도시,농어촌), 용도지역, 시군구, 행정동, 법정동, 빈집판정일, 등급선정일, 등급판정결과를 제공합니다.※ 1등급 : 양호한 집, 2등급 : 일반빈집, 3등급 : 불량빈집, 4등급 : 철거대상이 데이터를 통해 빈집의 위치, 건축 규모, 사용 시기 및 활용 가능성을 분석할 수 있으며, 도시재생, 주거복지, 부동산 투자, 정책 수립 등 다양한 분야에서 유용하게 활용될 수 있습니다. 특히 빈집 정비사업 또는 활용방안 모색에 필요한 기초자료로 적합하며, 영천시 내 도시환경 개선 및 주거 안정화 전략 수립에도 기여할 수 있습니다.'
