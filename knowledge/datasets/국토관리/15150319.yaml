summary_user: 창원시 관내 하천 수위관측소(중앙동·북면·명곡동·연덕교 등 지역코드로 구분된 8곳)의 하천 수위를 관측소·날짜별 한 행에 1시~24시 시간대별 값으로 담은 CSV 파일(약 0.9MB)이다. 방재 담당자나 분석가가 집중호우·태풍 때 특정 관측소의 시간대별 수위가 어떻게 올랐는지 확인하거나 강수량 자료와 맞춰 보는 데 쓴다. 전역 조인 키가 없어 관측소 지역코드·지역명을 WAMIS 표준 관측소코드나 창원시 강수량 자료에 이름 기준으로 직접 매핑해야 이어 쓸 수 있다.
limits: WAMIS 표준 관측소코드가 아닌 시 자체 지역코드(1~8, 50)만 있어 전국 수문 자료와 바로 결합되지 않는다. 범위는 창원시 한 곳뿐이고, 파일 내려받기 형태라 실시간 경보용 호출 자료로 쓰기 어렵다.
