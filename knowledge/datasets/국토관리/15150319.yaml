description_portal: '이 데이터는 창원시 관내 주요 하천 및 지류에 설치된 수위관측소에서 측정된 시간대별 하천 수위 정보를 제공합니다. 수위 정보는 재해 예방 및 수자원 관리, 하천 유지관리 등 다양한 행정 및 민간 목적에 활용될 수 있으며, 특히 홍수, 집중호우, 태풍 등 자연재해 발생 시 실시간 대응 및 사전 경보체계 구축을 위한 기초 자료로 매우 중요합니다. 관측 시점별 수위, 관측소 명칭, 하천명, 행정구역 정보 등이 포함되어 있으며, 방재업무, 도시계획, 시민안전정보 제공 등의 정책 자료로도 사용 가능합니다.※ 수위는 실시간 또는 일별, 시간별로 제공되며, 강수량 데이터와 연계 분석 시 활용도가 더욱 높습니다.지역코드 설명 : 1(중앙동),2(국방연구소), 3(북면), 4(명곡동), 6(성산구청), 7(웅남동), 8(차룡8교), 50(연덕교)'
