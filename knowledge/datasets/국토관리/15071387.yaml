description_portal: (데이터 수집목적 및 과정) 경상남도 건축허가 통계(시군 및 용도별) 데이터는 2000년 부터 2023년까지 경상남도 및 18개 시군에 대한 건축용도별 건축허가 현황입니다. 경상남도뿐만 아니라 시군의 건축허가 통계를 확인할 떄 활용할 수 있습니다. (데이터 구성 및 세부항목) 건축허가 통계(시군 및 용도별) 데이터는 시군별 건축용도별 건축허가 통계로 구성됩니다.* 건축용도는 주거, 상업, 농수산, 공업, 문교, 사회, 공공, 교육및사회, 기타로 분류됩니다.(데이터 현행화 시기) 해당 데이터는 통계DB에 자동갱신됩니다. 해당 링크를 통해 접속하면 데이터를 조회 및 다운로드 하실 수 있습니다.
