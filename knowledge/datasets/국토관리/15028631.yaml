summary_user: 아산시 관내 공동주택(아파트) 단지별 시공현황을 담은 파일로, 단지마다 아파트명칭·대지위치·사업기간·시공자와 시공자 전화번호·세대수를 한 행씩 기록한다(csv 약 2KB 규모의 소규모 목록). 아산시에서 어떤 아파트가 어느 시공사로 언제까지 지어지고 몇 세대가 공급되는지 확인하려는 주민·입주예정자나 지역 주택공급을 살피는 분석가가 쓴다. 전역 조인 키가 없어 K-apt 단지 정보나 실거래·청약 자료와는 아파트명칭과 대지위치(주소)를 이름 매칭해 이어 써야 한다.
