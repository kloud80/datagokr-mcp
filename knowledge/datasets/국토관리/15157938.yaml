summary_user: 남양주시 관련 기업(사업체)의 지역 간 이전 현황을 기준연월별로 전출지·전입지(시도·시군구·행정동)와 기업 수로 집계한 통계 파일로, 건별 원천이 아닌 집계 자료이며 행정단위는 읍면동까지 내려간다. 지역 분석가나 시 담당자가 '최근 어느 지역에서 남양주의 어느 동으로 기업이 들어오고, 어디로 빠져나가는가' 같은 기업 유출입 흐름과 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 시도·시군구·행정동 이름을 매핑해 이어 써야 한다.
description_portal: 본 데이터는 국내 기업(사업체)의 지역 간 이전 현황을 집계한 통계자료로, 기준연월, 전출시도, 전출시군구, 전출행정동, 전입시도, 전입시군구, 전입행정동, 기업 수 등의 항목을 포함하고 있습니다. 기업의 전출 및 전입 흐름을 기반으로 지역 간 경제 활동 변화와 산업 재배치 경향을 파악할 수 있도록 구축되었습니다. 또한 시계열 형태로 구성되어 있어 기간별 기업 이동 추이를 일관된 기준으로 확인할 수 있으며, 행정구역 단위의 세분화된 정보 제공을 통해 지역 간 이동 구조를 보다 정밀하게 분석할 수 있도록 구성되어 있습니다.
