summary_user: 인천 미추홀구 안의 소규모재건축 구역을 구역 하나당 한 행으로 담은 현황표이며, 구역명·위치·면적·추진단계·토지등소유자 수와 조합(주민합의체) 설립일·사업시행계획인가일·관리처분계획인가일을 기록한다(CSV 약 1.3KB의 작은 파일). 주안동·용현동·도화동·숭의동 등의 노후 소규모 아파트 소유자나 투자·분석가가 '이 단지의 재건축이 지금 어느 단계까지 왔는가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어서, 다른 데이터와는 구역명이나 구역위치(주소)를 이름 매칭하는 방식으로만 이어 쓴다.
