description_portal: 이 데이터는 일반정비사업 추진현황을 정비유형(재개발, 재건축 등), 사업단계(예정구역, 조합설립, 착공, 준공 등)별로 정리한 자료입니다. 주요 항목으로는 시군명, 정비구역명, 위치, 구역면적, 기존주택 현황(준공연도, 동수, 세대수), 사업추진일정(조합설립인가, 사업시행인가, 착공, 준공일자 등), 현추진상황, 담당자 정보 등이 포함됩니다. 재건축이나 재개발과 같은 도시정비사업의 전반적인 진행 단계와 물리적 현황을 확인할 수 있어 주거환경 개선 사업의 진척도를 지역별로 비교·분석할 수 있으며, 도시계획, 주거환경 개선 정책, 인허가 일정 관리, 주민협의 절차 분석, 사업성과 평가 등 다양한 용도로 활용 가능합니다.
