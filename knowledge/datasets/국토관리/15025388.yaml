description_portal: 본 데이터는  2026년 5월 기준 전국의  시도별 배수펌프장 현황 정보에 대한 데이터로 , 지역, 및 소관(지방자치단체, 농어촌공사) 에 따른 배수펌프장 개소를  제공한 것입니다.전년도 대비 59개소 늘어난 2,575개소로 이중 지방자치딘체  소관이 1,487개소, 한국농어촌공사 소관이 1,088개소 입니다. 지역별로는 경남이 718 개소로 가장 많고 다음이 전남,충남 순입니다.이는 2026년 3월~4월 지자체 및 한국농어촌공사로 부터 제공받은 자료를 근거로 하고 있으며 자료는  년1회 갱신됩니다.해당자료는 행정안전부 누리집의 정책자료 > 통계 > 통계연보 주제별 통계 에서 내려받기가 가능합니다.
