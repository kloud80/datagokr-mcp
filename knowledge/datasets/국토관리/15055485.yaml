description_portal: '서울특별시 마포구 수방용 배수펌프에 현황에 대한 정보입니다. 이 데이터는 집중호우, 태풍, 침수 등 자연재해 발생 시 침수 지역의 빗물이나 오수를 신속히 배출하기 위해 설치된 배수펌프 시설의 현황을 제공합니다. 주요 항목에는 행정 구역 정보(예: 시도명, 시군구명, 행정동명)가 포함되어 있습니다. 또한 펌프장명과 설치년도, 유역면적(단위:ha), 모터펌프(단위:HPX대X㎥X분), 펌프용량(단위:HP),토출량(단위:㎥/분), 저수용량(단위:㎥) 등의  정보가 포함됩니다.이 데이터를 통해 지자체는 침수 위험 지역에 대한 사전 대응과 신속한 배수 조치를 실행할 수 있으며, 시민들은 침수로 인한 피해를 줄일 수 있는 기반을 확보할 수 있습니다.'
