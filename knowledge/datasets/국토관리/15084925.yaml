summary_user: 마이홈포털의 기존 50년임대 주택 단지를 단지·주택형 단위로 나열한 목록으로, 전국 916행(준공일자 1991-11-30~2026-03-30)에 지역, 세대수, 주택유형, 임대사업자, 공급면적, 임대보증금·월임대료·전환보증금 등을 담는다. 50년임대 주택에 장기 거주하려는 국민이나 지역별 임대 조건을 비교하는 분석가가 '내 지역에 어떤 50년임대 단지가 있고 보증금과 월임대료는 얼마인가'를 확인하는 데 쓴다. 도로명주소(address)를 조인 키로 삼아 주소 기반의 전월세 실거래나 다른 임대주택 단지 데이터와 이어 쓴다.
description_portal: 한국토지주택공사에서 위탁관리중인 마이홈포털의 기존 50년임대 주택 정보로서 광역시도 및 시군구, 단지명, 세대수, 주택유형, 임대사업자, 공급면적(전용, 공용), 준공일자, 난방방식, 주차대수, 승강기 설치여부, 임대보증금, 월임대료, 전환보증금 등의 정보를 제공합니다. 50년임대 주택은 입주자격 기준을 충족하면 2년마다 계약 갱신하여 장기 거주할 수 있는 임대 주택으로서 입주자에게 분양 전환 되는 주택이 아닙니다. 입주 자격, 입주 방법, 임대 조건 등 세부적인 사항은 LH 청약플러스(https://apply.lh.or.kr)에서 확인하시기 바랍니다. 본 데이터는 공급 주체가 한국토지주택공사가 아닌 위탁 관리 중인 주택 정보까지 포함하고 있으므로 유의하시기 바랍니다.
