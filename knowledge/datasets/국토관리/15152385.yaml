description_portal: '행정구역 시군구 관리정보_고정자료는 시·군·구 단위 행정구역 정보를 제공하는 서비스로, 각 지역의 위치와 범위를 기반으로 기상, 재난, 강우량 등 다양한 데이터를 연계하여 분석할 수 있다. 또한 지도와 결합된 정보 제공을 통해 효율적인 행정 업무 수행과 안전 관리가 가능하다. 주기적으로 데이터 업데이트와 통합 분석으로 신속한 의사결정을 지원한다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
