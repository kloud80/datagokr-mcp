summary_user: 충청남도 홍성군 명동상가에 입점한 상점을 한 곳씩 담은 건별 데이터로, 시장명·상점명·상점 유형과 함께 도로명·지번 주소와 위도·경도(lat, lot), 영업시간, 취급 상품, 배달·주차·공중화장실 여부 등을 담는다. 홍성 명동상가를 찾는 주민·방문객이나 지역 상권을 살피는 분석가가 '명동상가에 어떤 업종의 가게가 있고, 어디서 몇 시까지 영업하며 배달이나 주차가 되는가'를 확인하는 데 쓴다. 다른 데이터와 바로 맞물리는 공통 코드 키는 없어서, 주소나 좌표로 위치 기반 데이터와 맞추거나 상점명·시장명을 이름으로 대조해 잇는다.
limits: 전역 조인 키가 없어 다른 상가·사업자 데이터와 코드로 바로 연결되지 않고, 이름·주소·좌표 매칭에 의존한다. 범위는 홍성군 명동상가 한 곳에 한정되므로 군 전체나 다른 시장의 상권을 볼 수 없다. 호출에는 포털 활용신청(자동승인) 후 받은 서비스키가 필요하며, 개발계정은 하루 8,000회까지 호출할 수 있다.
