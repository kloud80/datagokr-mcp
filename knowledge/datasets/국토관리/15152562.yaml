description_portal: '기우에너지 환경부 한강홍수통제소 AI홍수예보플랫폼에서 도시침수 예측과 관리를 위해 하수관로와 맨홀 정보를 연결하여 매핑하는 데이터 항목으로, 도림천 등 대상 지역의 하수 인프라 정보를 체계적으로 관리한다. 이를 통해 하수관망 기반 침수 위험 분석, 예측 모형 운영, 홍수 대응 계획 수립, 배수 체계 개선 등 다양한 도시 침수 관리 업무에 활용 할수 있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
