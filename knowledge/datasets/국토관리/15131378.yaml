summary_user: 한국수자원공사가 관리하는 전국 취수장을 시설 한 곳당 한 행으로 담은 현황 파일로, 행정구역·취수장명·위치·수원·가동상태·준공연도·광역구분·수계명·하루 시설용량(㎥)을 담는다. 분석가나 지자체 담당자가 "어느 수계·수원에 어떤 용량의 취수장이 있고, 그중 오래됐거나 가동하지 않는 곳은 어디인가"를 확인할 때 쓴다. 공통 조인 키가 없어 다른 상수도 데이터(정수장 현황, 수질검사 등)와는 취수장명·행정구역·수계명을 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국수자원공사의 상수도 시설 현황(취수)입니다. 취수 시설은 하천, 호소, 지하수 등 수원을 확보해 정수장으로 공급하는 기반으로, 행정구역, 가압장명, 가압장위치, 가동상태, 준공연도, 시설용량(㎥/일), 감시제어유무, 비상발전유형의 정보를 제공합니다. 이를 통해 취수원 분포와 상태를 파악하고 관리 계획을 세울 수 있습니다. 본 데이터는 안정적인 원수 공급을 지원해 수돗물 생산과 주민 생활 편익에 기여합니다. 시설 정보는 신규 사업 검토, 수자원 평가, 정책 수립에 활용됩니다. 국민은 생활과 밀접한 시설 현황을 확인해 공공데이터 서비스 신뢰를 높일 수 있습니다.
