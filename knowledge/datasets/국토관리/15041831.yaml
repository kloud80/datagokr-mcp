summary_user: 인천광역시 군·구별로 개별주택가격 공시주택수(호)와 전년 대비 변동률(%)을 담은 집계 파일이며, 주택 한 채씩의 가격은 들어 있지 않다(파일 크기 237바이트). 분석가나 시민이 '올해 인천 어느 군·구에서 개별주택 공시가격이 많이 올랐나'처럼 지역별 공시가격 변동 폭과 공시 규모를 비교하는 데 쓴다. 전역 조인 키는 없어 군·구 이름(구분)을 행정구역 코드에 맞춰 붙이는 방식으로만 다른 주택·부동산 통계와 잇는다.
description_portal: 인천광역시 개별주택가격 공시 현황 공공데이터는 단독주택, 다가구주택 등 개별 주택에 대해 정부가 산정한 공식 가격을 담고 있습니다.  이 가격은 매년 1월 1일을 기준으로 조사·산정되어 공시되며, 주로 재산세, 종합부동산세, 상속세, 증여세 등 각종 조세의 부과 기준으로 활용됩니다. 시민들이 자신의 주택에 대한 공시가격을 확인하고, 정부의 투명한 조세 행정 운영을 검증하는 데 중요한 기초 자료가 됩니다.부동산 가격공시에 관한 법률 제17조에 따른 인천광역시 군‧구별 개별주택가격의 공시주택수, 변동률을 제공합니다<참고>"국토교통부와 한국부동산원에서 운영하는 부동산공시가격알리미(www.realtyprice.kr) 사이트에서소재지번으로 개별주택가격 조회 가틍"  상세url https://www.realtyprice.kr/notice/hpindividual/search.htm
