summary_user: 경기도 연립·빌라의 전세·월세 실거래를 계약 한 건씩 담은 원천 자료로, 주소·지번, 단지명, 전월세 구분, 전용면적, 계약연월·일, 보증금, 월세, 층, 건축년도, 도로명을 필지·건물 단위로 싣는다. 세입자나 분석가가 "우리 동네 연립빌라 전세 보증금이 면적당 얼마이고, 최근 월세 비중이 늘었나"를 확인하거나 시기별 임대료 변동을 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·지번(본번·부번)이나 단지명 같은 이름 매핑으로만 잇고, 같은 경기도 실거래 계열 자료(매매 등)와 주소 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 연립빌라 전월세 실거래가 원천 기본정보로, 실제 계약된 전세·월세 거래 내역을 정리한 자료입니다. 주요 항목에는 주소, 단지명, 전월세 구분, 전용면적, 계약연월, 보증금액, 월세금액, 층명, 건축년도, 도로명 등이 포함됩니다. 이를 활용하면 경기도 연립빌라 임대차 시장의 거래 흐름과 가격 수준을 분석할 수 있으며, 전세·월세 비중 비교, 면적 대비 임대료 산정, 시기별 가격 변동 추적 등 다양한 분석이 가능합니다. 주거정책 수립, 부동산 시장 예측, 투자전략 마련 및 학술 연구 등에 기초자료로 활용될 수 있습니다.
