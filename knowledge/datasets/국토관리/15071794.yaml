summary_user: 서울시에 있는 한옥을 한 채씩 등록번호(HANOKNUM) 단위로 담은 건별 등록 자료로, 주소·대지면적·연면적·지상 층수·지하 층수를 담는다. 한옥 보전 정책 담당자나 도시·건축 연구자가 특정 동네에 등록 한옥이 얼마나 있고 규모가 어떤지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소 문자열 매핑으로만 이어 쓴다.
description_portal: 서울시 한옥등록 정보는 서울시에 존재하는 한옥에 대해 행정적으로 관리하기 위해 구축된 자료로, 개별 한옥의 기본 현황과 규모를 파악할 수 있는 항목들로 구성되어 있습니다. 한옥등록번호는 각 한옥을 구분하기 위한 고유 식별값이며, 주소 항목을 통해 한옥의 위치를 정확히 확인할 수 있습니다. 대지면적은 한옥이 자리한 토지의 전체 면적을 의미하며, 연면적은 건물 내부 공간의 총면적을 나타내어 한옥의 규모와 활용도를 파악하는 데 활용됩니다. 지상 층 정보는 건물이 지상에 몇 개의 층을 가지고 있는지를 보여주며, 지하 층 항목은 지하 공간 유무와 규모를 판단할 수 있는 자료입니다. 이 정보는 한옥 보존 정책 수립, 문화자산 관리, 도시계획, 건축 연구 등 다양한 분야에서 활용될 수 있으며, 특히 한옥 밀집지역의 변화 분석이나 보전 필요성 평가에 중요한 근거가 됩니다.
