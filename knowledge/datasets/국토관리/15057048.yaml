summary_user: 경기도 31개 시군의 인허가 자료를 바탕으로, 액화석유가스(LPG) 용품 제조업체를 사업장 단위로 담은 건별 현황이며 사업장명, 인허가일자, 영업상태, 폐업일자, 지번·도로명 주소, 좌표, 용기저장면적, 취급가스용량 등을 포함한다. 가스 안전 관리 담당자나 업계 분석가가 '우리 시군에서 지금 영업 중인 LPG 용품 제조업체는 어디이고 저장 설비 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)로 같은 기관의 다른 경기도 인허가 데이터와 잇거나, 사업장명·주소를 매칭해 공장 등록 자료와 연결한다.
description_portal: '액화석유가스 또는 연료용 가스를 사용하기 위한 기기를 제조하는 경기도 내 액화석유가스용품 제조업체 현황입니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 대한민국 내 액화석유가스(LPG) 용품을 제조하는 업체의 현황을 제공하며, 각 업체의 위치, 인허가 정보, 영업 상태, 제조 용품 종류 및 기타 설비 관련 정보를 포함하고 있습니다. 데이터 항목에는 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지정보, 설비명, 가스용품종류명, 취급가스용량, 용기저장면적 등 총 29개의 세부 항목이 포함되어 있으며, 이들 정보는 에너지 관련 행정 관리, 안전 관리 감독, 정책 수립 및 LPG 제조업체 실태 파악에 활용됩니다. 특히, 인허가일자 및 영업상태를 통해 업체의 운영 여부를 파악할 수 있으며, 설비 및 용품정보는 제품의 기술적 특성과 안전성 검토에 유용하게 사용될 수 있습니다.액화석유가스(LPG) : 석유를 정제하거나 천연가스를 처리할 때 나오는 프로판, 부탄 등을 압축해 액체 상태로 만든 연료. 주로 난방, 취사, 차량 연료 등으로 사용됨.(출처: 한국가스안전공사 https://www.kgs.or.kr)가스용품종류명 : 제조업체가 생산하는 LPG 관련 제품의 종류를 나타내는 항목으로, 예를 들어 밸브, 조정기, 연소기 등이 포함될 수 있음.(출처: 가스용품의 안전관리 및 품질보증에 관한 법률 시행규칙)'
