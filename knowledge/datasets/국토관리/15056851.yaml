summary_user: 경기도 내 건축 착공 신고를 건축사 사무소별로 정리한 데이터로, 시군명·시군코드, 신고일자, 설계·시공 사무소 정보, 착공 위치의 위도·경도, 주소가 없는 착공지의 위치 설명(비고)을 담는다. 분석가나 지자체 담당자가 '최근 어느 시군에서 어떤 건축사 사무소가 착공 신고를 많이 냈는가'처럼 지역 개발 흐름과 사무소별 활동 규모를 살피는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)로 같은 경기도 시군 단위 데이터와 맞추거나 위도·경도로 공간 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내에서 건축이 실제로 시작되기 전, 신고된 착공 정보를 건축사 사무소별로 집계한 현황입니다.설계사무소명(설계 담당), 시공사명(시공 담당), 착공 용도, 신고일자, 착공 위치의 위도·경도 정보 등이 포함되어 있어, 건설사업의 지역 분포와 흐름을 파악하거나 건축 트렌드 분석, 건축사무소별 활동 규모 분석 등에 활용할 수 있습니다.착공 신고는 건축법에 따라 건축주가 건축공사를 시작하기 전에 지자체에 의무적으로 신고해야 하는 절차이며, 이는 행정기관의 건축행위 모니터링 및 통계작성의 기초 자료로 사용됩니다.※ 착공지는 아직 주소가 부여되지 않은 경우가 있어 ‘비고’란에 별도로 위치 설명이 제공됩니다.
