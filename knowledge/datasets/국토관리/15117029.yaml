description_portal: 지식산업센터는 제조업, 지식기반산업, 정보통신산업, 벤처기업을 영위하기 위한 시설  등이 입주가능한 아파트형 공장으로 경기도 하남시 지식산업센터 현황[지식산업센터의 명칭, 소재지(도로명, 지번 주소), 관리지원센터 전화번호, 면적, 준공연도 등]입니다. 지식산업센터 내 입주업종은 제한이 있음으로 사전에 확인과정을 거쳐 피해 예방이 필요합니다.  경기도 하남시 지식산업센터는 산업단지 밖에 지식산업센터로 산업단지 내 지식산업센터와 입주가능 업종, 관리하는 관리기관 등 상이합니다.  입주불가 업종 입주시 처벌대상입니다.
