summary_user: 천안시에 등록된 제조업 공장을 한 행에 한 곳씩 담은 파일로, 회사명·공장 형태(공장구분)·생산품·업종명·전화번호·도로명 대표주소를 시군구 단위로 제공한다(CSV 약 671KB). 천안에서 특정 품목을 만드는 업체나 업종별 공장 분포를 찾는 분석가·기업지원 담당자·거래처를 찾는 사업자가 쓴다. 전역 조인 키(사업자번호·업종코드·필지번호)가 없어 회사명·주소 문자열 매칭으로 팩토리온 공장등록 정보나 다른 시군구 공장 현황과 이어 붙인다.
description_portal: 충청남도 천안시 제조업체 현황 데이터는 지역 내 제조업 기반 현황을 파악한 데이터입니다. 시도와 시군구는 행정구역별 제조업체 분포를 확인하는 기본 항목이며, 회사명과 공장구분은 기업의 식별과 공장 형태를 파악하는 데 사용됩니다. 전화번호는 기업 문의 및 행정 대응에 활용되며, 생산품과 업종명은 해당 제조업체의 주력 산업 분야와 생산 특성을 이해하는 핵심 정보입니다. 공장대표주소는 사업장의 물리적 위치를 명확히 제공하여 산업단지 배치, 지역 경제 활성화 정책, 기업 지원 행정 등에 활용될 수 있습니다. 본 데이터는 지역 제조업 현황 파악, 산업정책 수립, 기업지원센터 운영, 산업 기반 시설 분석 등 다양한 행정·경제 업무를 지원하는 기초자료입니다.
