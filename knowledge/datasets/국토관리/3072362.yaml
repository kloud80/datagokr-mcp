description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주첨단과학기술단지의 2017년 12월 기준 입주기업 현황에 대한 정보를 담고 있습니다. 각 항목은 업종과 입주 구분, 도내 업체 수, 도내 근로자 수, 도외 업체 수, 도외 근로자 수, 신설 업체 수, 신설 근로자 수, 합계 업체 수, 합계 근로자 수로 구성되어 있어 입주 기업들의 지역 분포 및 고용 현황을 종합적으로 파악할 수 있도록 되어 있습니다. 업종에는 IT, 바이오, 콘텐츠 등 다양한 기술 산업 분야가 포함되며, 입주 구분에는 'IT 분야 입주사 내 입주', '외부 입주', '창업보육센터 입주' 등의 구체적 유형이 명시되어 있습니다. 도내·도외 기업 수와 근로자 수는 제주도 지역 내외 기업들의 입주 현황을 비교 분석할 수 있게 해주며, 신설 업체 및 근로자 수 항목은 신규 창업 및 고용창출 규모를 파악하는 데 활용됩니다. 이 데이터는 지역 산업 육성과 고용 활성화, 기업 유치 전략 수립 등에 기초 자료로 활용될 수 있습니다.
