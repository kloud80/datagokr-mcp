summary_user: 동두천시 하천 교량 지점(동광교·신천교)의 월별 평균 수위를 연도별 한 행으로 정리한 집계 파일로, 2015년부터의 자료를 담은 3KB 남짓한 CSV다. 시민이나 분석가가 '신천교 부근 수위가 여름철에 해마다 얼마나 올라갔나'처럼 지점별 계절·연도 추이를 비교하는 데 쓴다. 전역 조인 키나 관측소코드가 없어 WAMIS 등 다른 수문 자료와는 교량명(위치별)이나 연도 같은 이름·값을 맞춰서만 이어 쓸 수 있다.
description_portal: 경기도 동두천시의 수위 정보를 민원인에게 제공하고자 합니다.데이터는 연도별, 위치별,  월별 평균 수위, 관리기관명, 관리기관전화번호, 데이터기준일자로 구성된 데이터입니다.위치는 교량명(동광교, 신천교)으로 작성되었고 2015년부터의 데이터로 작성되었습니다.데이터의 기준일자는 2025년 8월 11일입니다.제공된 데이터에 대하여 추가적인 문의사항이 있거나 궁금하신점이 있으실 경우 동두천시청 안전총괄과 안전총괄팀(031-860-2166)으로 문의주시기 바랍니다.
