description_portal: 한강홍수통제소에서 홍수예측 등 활용하기 위해 사용하는 강수량인근관측소정보입니다.이 정보는 강수량 관측소의 실시간 강수량 자료를 보정하기 위한 정보입니다.강수량 자료 보정 방법 중 하나인 RDS(Ratio of Differences Squared)법은관측소에서 결측치(데이터 공백)가 발생했을 때, 주변 관측소들의 데이터를 활용하여해당 값을 추정하는 가중치 부여 기법 중 하나입니다.일반적으로 많이 쓰이는 산술평균법이나 정상연강수량비법(Normal Ratio Method)보다 주변 관측소와의 상관성을 더 정교하게 반영하려는 목적을 가지고 있습니다.이 정보에는 사분면, 1순위관측소, 1순위관측소거리, 2순위관측소, 2순위관측소거리 정보로 구성됩니다.
