summary_user: 서울 중랑구에 공장등록을 한 제조업 공장을 한 곳씩 담은 목록으로, 회사명·도로명 대표주소·업종명·생산품을 담는다(CSV 파일 약 66KB). 중랑구에서 의류·모자·텐트 같은 품목을 만드는 제조공장이 어디에 있는지 찾는 사업자나, 구 안의 업종 분포를 보려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없으므로 다른 데이터와는 회사명이나 도로명주소를 맞춰 잇고, 주소를 좌표로 바꾸면 지도·상권 데이터와 겹쳐 볼 수 있다.
description_portal: 서울특별시 중랑구에 위치한 제조업을 영위하는 공장 정보를 제공합니다. 주요 제공항목은 제조공장의 회사명, 주소, 업종, 생산품이 있습니다. 업종명은 천막, 텐트, 의복, 건강기능식품, 모자, 유선통신장비 등이 있습니다. 생산품은 의류, 복사용지, 조명기구, 모자 등이 있습니다.* 공장등록은 공장건축면적 500제곱미터 이상인 경우 의무등록, 500제곱미터 미만인 경우 임의등록 대상입니다. 또한 등록신청을 하지 않은 제조업소는 포함되지 않으니, 정보 이용에 참고하시여 주시기 바랍니다. 감사합니다.
