summary_user: 부동산종합공부와 대법원 연계 과정의 필지·건물 고유번호가 바뀐 이력을 건별로 담으며, 변동 전후의 시군구·법정동·대장구분·본번·부번과 변동 사유·변동 일자를 기록한 전국 범위 데이터다. 행정기관이나 부동산 서비스 사업자가 '예전 지번(고유번호)이 지금은 어떤 번호로 바뀌었나'를 추적해 과거 대장·등기 자료를 현재 필지와 맞출 때 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로, 변동 전후 코드를 조합한 19자리 필지고유번호나 법정동코드 매핑으로 다른 필지·건물 데이터와 연결한다.
description_portal: 국토교통부 고유번호변동연혁은 부동산종합공부와 대법원 간 연계 과정에서 관리되는 등기고유번호의 변동내역을 제공하는 데이터이다. 시군구코드, 법정동코드, 대장구분, 본번, 부번 등 필지고유번호 19자리 체계를 기반으로 변동이 발생한 이력을 기록하고 있으며, 이를 통해 토지·건물 등기 및 대장 관리 과정에서의 고유번호 변동 사항을 추적할 수 있다. 이 데이터는 행정기관의 이력 관리, 부동산 관련 민원 처리, 연구 및 정책 수립 과정에서 기초자료로 활용될 수 있다.이 데이터는 TXT 형식으로 제공되며, 행 단위의 텍스트 구조로 구성되어 있어 대용량 데이터를 효율적으로 처리하기에 적합하다. 기본적인 편집 프로그램으로 열람이 가능하지만, 실제 활용에서는 데이터베이스, GIS, R·Python 등의 분석 환경에 적재하여 가공·분석하는 방식이 효과적이다. 전국 단위의 고유번호 변동 이력을 일괄적으로 확인할 수 있어 행정업무 지원과 연구·민간 서비스 개발 등 다양한 분야에서 활용이 가능하다.
