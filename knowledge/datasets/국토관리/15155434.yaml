description_portal: 본 데이터는 한국토지주택공사에서 공급하는 공공분양 주택 중에 선착순(수의) 계약의 방식으로 공급하는 주택의 상세 정보를 제공하고 있습니다. 일반적으로 공공분양 주택은 최초 공고시 청약의 방법을 통해 추첨으로 당첨자 및 동호를 결정하게 되지만, 본 데이터에 나열된 주택은 미분양, 부적격 당첨취소, 계약포기 등 여러가지 사유로 인하여 선착순의 방식으로 계약자를 결정하는 방식으로 공급됩니다. 그리고 일반적인 청약을 통한 계약보다 계약금이 적거나 할부조건 등의 계약조건이 유리하게 변경된 경우가 많으므로 실수요자에게는 내집마련의 좋은 기회가 될 수 있으니 주기적으로 확인하시는 것을 권장합니다. 자세한 사항은 본 데이터에 제공 중인 분양 문의처에 문의하시면 확인하실 수 있습니다. 다만 본 데이터는 매월 초에 업데이트 되므로 선착순에 의해 이미 계약이 완료된 주택이 포함되어 있을 수 있다는 점 유의하시기 바랍니다.
