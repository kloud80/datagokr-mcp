summary_user: 광산구 관내 공사현장(건축·도로·상하수도 등)을 현장 한 건씩 공사명, 주소, 공사 시작·종료일과 함께 담은 파일 데이터로, 포털 설명상 2019년부터 2023년 6월까지를 다룬다. 주민이 우리 동네 주변에서 언제까지 공사가 진행되는지 확인하거나, 분석가가 광산구 내 공사 분포와 시기별 추이를 살펴보는 데 쓴다. 전역 조인 키는 없으므로 주소를 지오코딩하거나 행정동 이름으로 매핑해 다른 광산구·광주 지역 데이터와 이어 쓴다.
description_portal: 2019년부터 2023년 6월까지 관내에서 이루어진 건설, 건축, 시설물 설치, 도로 포장, 상하수도 공사 등 다양한 공사 현장과 관련된 건설 허가 및 신고 현황에 대한 자료를 제공합니다. 이 자료는 광산구 내에서 진행된 각종 공사의 규모와 종류, 허가 및 신고 일자, 현장 위치 등 세부 정보를 포함하고 있습니다.지역 내 건설 활동의 전반적인 흐름과 동향을 파악하는 데 유용하며, 도시 개발 및 인프라 확충과 관련된 자료로 사용할 수 있습니다.공공기관의 도시 계획 및 안전 관리, 민간 기업의 사업 전략 수립, 연구기관의 학술 연구 등 다양한 분야에서 참고할 수 있습니다.
