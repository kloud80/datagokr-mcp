summary_user: 국토계획법상 도시관리계획으로 결정된 용도지역 가운데 도시지역의 범위를 전국에 걸쳐 담은 연속주제도 자료로, vworld에서 시도별 SHP 파일로 내려받는다. 토지 분석가나 사업자가 특정 지역이 도시지역에 속하는지 확인하거나, 도시지역 분포를 다른 토지이용 정보와 겹쳐 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정구역 이름·코드 매핑이나 같은 기관(국토교통부) 코드로만 이어 쓴다.
limits: 공공데이터포털 활용신청과는 별개로 vworld.kr에 로그인해 시도별 파일을 직접 받아야 하며, 인증키 API 호출 방식이 아니다. 전역 조인 키가 없어 필지·건물 등 다른 데이터와 바로 결합하기 어렵다.
