summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 공간시설(도시·군계획시설 중 공간시설) 집행 현황 도형을 건별로 담은 파일로, 도형마다 관리번호·라벨명·면적·길이·좌표 범위(최소·최대 X·Y)·생성일시가 들어 있다(약 4.5KB의 작은 csv). 진안군 안에서 공원·녹지 같은 공간시설이 어디에 얼마 면적으로 집행되었는지 확인하려는 분석가나 주민이 쓴다. 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매칭이나 좌표 범위로 위치를 겹쳐 보는 방식, 또는 같은 진안군 UPIS 자료끼리 관리번호로만 연결한다.
