summary_user: 경상북도개발공사가 택지·필지를 공급·판매하기 위해 낸 토지 공고를 공고 한 건씩 담은 파일로, 사업코드·사업명·공고번호·공고명·모집공고일자·공고유의내용 등을 포함한다(CSV 약 6KB 규모). 택지나 산업단지 필지 분양을 알아보는 국민·사업자가 '공사가 어떤 사업으로 언제 토지 모집공고를 냈는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 공사 내부 사업코드나 사업명으로 같은 기관의 다른 데이터나 다른 지방개발공사 공고 데이터와 이름 매핑으로만 이어 쓴다.
description_portal: 경상북도개발공사에서 택지, 필지를 공급, 판매 하기 위한 공고 관련 데이터사업명, 공고명, 모집공고일자, 문의기관명 등 토지 공고 관련 데이터 포함. 공사에서 추진 중인 건설사업, 택지개발사업, 사업단지 조성사업 등의 각종 개발사업에 대하여 사업의 투명성 확보 차원에서 공고한 공고명, 모집공고일자, 공고유의사항을 개방한다. 특히 사업추진시 부여한 사업코드를 공고함으로써 공개 데이터를 활용함에 있어 추가적인 정보가 필요할 경우를 대비하여 정보를 공개한다. 본 데이터를 지방개발공사의 유사 데이터와 함꼐 하면 좋은 정보를 얻을수 있을거로 예상된다.
