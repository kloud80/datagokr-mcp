description_portal: 한국토지주택공사의 이용안내 - 개인정보처리방침을 통해 접속이 가능합니다. 개인정보 보호법 제30조에 따라 정보주체에게 개인정보 처리에 관한 절차 및 기준을 안내하고, 이와 관련한 고충을 신속하고 원활하게 처리할 수 있도록 한국토지주택공사 홈페이지에서 제공하는 자료입니다. 주요 개인정보는 일반 개인정보, 고유식별정보, 보유기간, 처리 목적, 개인정보 제공, 고충처리부서를 통해 이루어지며 제 1조는 보유기간, 2조는 항목에 대한 사항, 3조는 3자제공에 대한 내용, 4조는 추가 이용 판단기준에 대해 알리고 있습니다.
