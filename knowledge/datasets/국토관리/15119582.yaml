summary_user: 수치지형도의 건물 공간정보와 세움터 건축물대장 속성정보를 건물 단위로 통합한 전국 범위의 건별 원천 데이터로, vworld에서 시도별 TXT 파일로 받는다. 분석가가 "지도상의 이 건물 윤곽이 건축물대장의 어느 건물이고 허가·사용승인 정보는 무엇인가"처럼 건물 형상과 대장 정보를 한 번에 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 건축물대장·지적 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 포털 활용신청이나 인증키 호출로는 받을 수 없고, vworld 로그인 후 공간정보 다운로드 페이지에서 시도별 파일을 직접 받아야 한다. 실측상 전역 조인 키가 없어 다른 데이터와의 연결은 별도 매핑에 의존한다.
