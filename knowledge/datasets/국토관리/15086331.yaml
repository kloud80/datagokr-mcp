summary_user: 부산광역시 연제구가 허가·관리하는 옥외광고물을 건별로 담은 파일로, 업소명·광고물 종류·광고 내용·수량·조명 여부·허가일자·표시 시작·종료일자와 지번·도로명 주소를 읍면동 단위까지 기록한다. 구민이나 사업자가 '우리 동네 이 간판이 허가된 광고물인지, 표시기간이 언제까지인지'를 확인하거나, 분석가가 동별 광고물 종류 분포와 표시기간 만료 현황을 살펴보는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시도·시군구·읍면동 이름이나 도로명·건물번호 같은 주소 문자열을 맞춰 붙여 쓴다.
description_portal: 부산광역시 연제구 U-옥외광고물통합관리시스템의 데이터로 옥외광고물 관련 정보(업소명, 종류, 위치, 규격 등)를 제공합니다. U-옥외광고물통합관리시스템은 옥외광고물의 효율적 관리를 위한 통합 플랫폼입니다. 이 시스템은 옥외광고물의 등록, 변경, 폐기 등 전산화하여 관리할 수 있도록 지원합니다. 광고물의 위치, 종류, 크기, 설치 기간 등의 정보를 체계적으로 수집·분석하며, 불법 광고물 단속과 민원 처리를 신속하게 수행합니다. 이를 통해 옥외광고물의 안전성 확보와 도시 미관 개선, 행정업무의 투명성 증진에 기여할 수 있습니다.
