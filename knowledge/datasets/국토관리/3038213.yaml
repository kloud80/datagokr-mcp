description_portal: '수돗물 수질검사 결과에 대한 데이터로 측정일, 구분(청계통합정수장, 포일정수장), 맛, 냄새, 색도 , pH, 탁도, 잔류염소 등에 관한 데이터입니다.수돗물 수질검사 데이터는 매우 중요한 정보입니다. 일반적으로 이러한 데이터는 수돗물의 안전성과 품질을 확인하는 데 사용되며, 일정한 기준을 충족해야 합니다.수질 검사의 주요 항목 - 구분: 정수장별(청계통합정수장, 포일정수장 등) - 맛과 냄새: 이상 여부 확인  - 색도: 수돗물의 맑기와 색상 -수소이온: 산성 또는 알칼리성 여부, 단위(pH) - 탁도: 물의 투명도(불순물 함량), 단위(NTU) - 잔류염소: 소독을 위한 염소 농도, 단위(mg/L) - 측정일: 검사 날짜'
