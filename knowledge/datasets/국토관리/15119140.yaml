summary_user: 진안군 도시계획정보시스템(UPIS) 건축물 주제도를 건물 단위로 담은 CSV 파일(약 0.97MB)이며, 각 건물의 공간정보 관리번호, 위치 범위 좌표(최소·최대 X·Y), 건폐율, 용적률, 층수, 건축년도, 필지고유번호를 담는다. 진안군 안에서 특정 필지나 구역의 건물이 몇 층이고 언제 지어졌으며 건폐율·용적률이 얼마인지 확인하려는 주민·사업자·도시계획 분석가가 쓴다. 필지고유번호(PNU) 컬럼이 있어 토지·지적 자료와 필지 단위로 맞춰 볼 여지가 있으나, 실측 점검에서는 전역 조인 키로 확인되지 않아 같은 기관 자료나 이름·코드 매핑으로 잇는 것이 기본이다.
description_portal: '전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 건축물 주제도에 대한 공공데이터 자료입니다. 이번 자료에서는 공간정보 관리 번호, X 좌표 최솟값, Y 좌표 최솟값, X 좌표 최댓값, Y 좌표 최댓값, 건폐율(의미: 건설 대지에서 건축물이 차지하는 땅의 비율), 층수, 건물 군 관리 번호, 필지 고유번호(PNU 의미: 토지에 부여되는 고유한 19자), 건축 년도, 용적률(의미: 전체 대지면적에 대한 건물 연면적의 비율) 정보를 제공합니다. 이 자료를 통해 공간정보 관리 번호에 해당하는 필지 고유번호와 층수, 건축 년도가 무엇인지와 건페율, 용적율이 얼마인지 알 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.'
