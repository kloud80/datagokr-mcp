summary_user: 서울 마곡지구 1~3지구, 각 지구 1~3공구별 도시기반시설용지(도로·공원·광장·주차장·녹지 등)의 면적(제곱미터)과 마곡지구 전체 대비 구성비(퍼센트)를 시설 구분별로 정리한 집계표로, 약 1KB 분량의 작은 CSV 파일이다. 도시계획 분석가나 연구자가 '마곡지구 공구별로 공원·도로 같은 기반시설 부지가 얼마나 확보되어 있는가'를 비교하거나 기반시설 확충 수준을 평가할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설 구분 이름이나 지구·공구 명칭을 맞춰 연결해야 하며, 같은 기관의 마곡지구 토지이용계획 자료와 함께 보는 방식이 현실적이다.
limits: 필지·지번이나 행정코드 같은 조인 키가 없어 개별 필지나 공간 데이터와 바로 결합할 수 없다. 메타데이터상 범위가 전국·필지 단위로 표기되어 있으나 실제 내용은 마곡지구 공구별 면적 집계이므로 그대로 받아들이지 않는다.
