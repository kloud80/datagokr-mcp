summary_user: 전라남도 강진군에 등록된 제조공장을 공장 한 곳당 한 행으로 담은 시군구 단위 파일(csv, 약 19KB)로, 단지명(산업단지 또는 개별입지), 회사명, 공장 대표 주소, 업종명, 데이터 기준일자를 담는다. 지역 분석가나 창업 준비자가 "강진군에서 식품·수산물 가공 공장이 어느 단지에 얼마나 모여 있나"처럼 지역 제조업 구성과 입지를 확인할 때 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어 다른 데이터와는 회사명·주소 문자열 매칭이나 같은 기관(강진군) 기준으로만 연결하며, 다른 공장등록 데이터와 이으려면 주소를 지오코딩하거나 이름을 맞춰야 한다.
description_portal: 이 데이터는 전라남도 강진군 제조공장 등록 현황을 담고 있습니다. 주요 항목으로는 단지명, 회사명, 공장 대표 주소, 업종명, 데이터 기준일자가 포함되어 있습니다. 단지명은 공장이 위치한 산업단지 또는 개별입지를 구분하고, 회사명은 해당 제조업체의 명칭을 나타냅니다. 공장 대표 주소는 사업체의 위치를 구체적으로 제공하며, 업종명은 각 공장에서 영위하는 주요 제조업 분야를 설명합니다. 데이터에는 식품 가공업, 전기·기계 제조업, 비금속광물 가공업, 곡물 및 수산물 가공업 등 다양한 업종이 포함되어 있어 지역 산업 구조와 특성을 파악하는 데 활용할 수 있습니다.
