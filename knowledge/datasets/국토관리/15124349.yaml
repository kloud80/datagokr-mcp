summary_user: 안산시 관내 도로 노선별로 행정동, 식재 구간(출발지~도착지), 구간 길이(미터), 수종, 가로수 본수를 담은 구간 단위 현황 파일이며, 범위는 시군구 하나이고 행정동(읍면동) 단위로 구분된다. 조경·도시계획 담당자나 연구자가 "안산시 어느 노선·동에 어떤 수종이 몇 그루, 구간 길이 대비 얼마나 촘촘히 심겨 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 노선명을 이름 매칭해서만 이을 수 있다.
description_portal: 이 정보는 안산시 관내 도로 노선별 가로수 현황을 정리한 자료입니다. 노선명, 행정동, 가로수 식재 구간, 구간 길이(미터), 수종, 가로수 본수, 비고, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 식재 구간은 출발지와 도착지를 기준으로 상세 주소로 표기되어 있으며, 노선명 및 행정동을 통해 지역별 분포 파악이 가능합니다. 수종 항목에는 소나무, 단풍나무, 목백합 등 다양한 수종이 명시되어 있어 도시 녹지 다양성 및 조경 계획 수립 시 유용하게 활용될 수 있습니다. 구간 길이와 가로수 본수 정보를 통해 구간별 밀도나 가로수 관리 현황을 파악할 수 있으며, 도시 환경 정비, 조경시설 유지관리, 녹색도시 조성 정책 수립 등 행정적 활용뿐 아니라, 민간에서도 위치기반 조경 분석, 생태적 도시계획 연구 등에 참고 자료로 활용하실 수 있습니다.
