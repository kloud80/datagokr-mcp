summary_user: 경기도 포천시 관내 토지를 필지 단위로 읍면동·리·구분·본번·부번 위치와 기준년도·기준월별 결정지가, 공시일자를 담은 건별 파일이다(csv 약 13.7MB). 토지 소유자나 매수 예정자가 특정 번지의 연도별 개별공시지가와 변동을 확인하거나, 분석가가 포천시 지가 추이를 볼 때 쓴다. 전역 조인 키(법정동코드·PNU 등)가 없어 다른 데이터와는 읍면동·리 이름과 본번·부번을 조합해 맞추는 방식으로만 이어 쓴다.
description_portal: 경기도 포천시에서 제공하는 개별공시지가 현황 데이터입니다. 본 데이터는 포천시 관내 개별 토지의 공시지가 정보를 정리한 자료로, 읍면동, 리, 구분, 본번, 부번, 기준년도, 결정지가, 기준월, 공시일자 등의 항목으로 구성되어 있습니다.해당 데이터는 토지의 위치별 공시가격을 확인하고, 연도별 변동 현황을 분석하는 데 활용할 수 있습니다. 재산세 및 각종 세금 산정 근거, 개발사업 타당성 검토, 토지 활용계획 수립 등 다양한 분야에서 기초자료로 활용될 수 있습니다. 본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
