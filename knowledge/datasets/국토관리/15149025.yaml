summary_user: 전국의 건물·필지 단위로 행정구역(시도–시군구–읍면동–리), 지번, 도로명과 우편번호(새 우편번호 포함)를 짝지어 담은 원천 매핑 파일로, CSV 한 개(약 164MB)로 제공된다. 지자체나 지적재조사 담당자가 "공람공고 안내문을 보낼 대상 필지의 우편번호를 어떻게 일괄로 붙이나" 같은 대량 우편 발송·반송 분석 질문에 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 지적·토지 데이터와 잇고, 도로명코드·건물관리번호 필드로 도로명주소 체계와 맞춰 쓴다.
