description_portal: 전북 특별자치도 진안군의 녹지 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 연번, 시군 명, 시설 종류, 위치, 면적(제곱미터), 최종결정일, 데이터기준일자 정보를 제공합니다. 국토의 계획 및 이용에 관한 법률 제34조에 따라 군 관리 계획 재정비를 통해 결정된 진안군 내 녹지지역 결정 내용을 제공합니다. 이 자료를 통해 결정된 진안군의 녹지가 무엇인지 알 수 있으며, 또한 해당 녹지가 있는 장소 또한 확인할 수 있습니다. 그리고 각 녹지의 면적도 파악할 수 있으며, 해당 결정이 언제 되었는지도 알 수 있습니다.
