summary_user: 청주시에서 개발행위 허가를 받아 사업이 진행 중인 허가지를 건별로 담은 파일 데이터로, 구·읍면동·리 위치, 허가일자, 준공 예정일, 지목, 용도지역, 허가목적, 허가·부지·도로 면적(㎡)을 담는다. 청주시의 어느 읍면동에서 어떤 용도지역과 목적으로 개발행위가 허가되어 진행 중인지 확인하려는 주민·사업자·도시계획 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 데이터와는 읍면동·리 이름이나 용도지역 명칭을 매핑해서만 이어 쓴다.
limits: 법정동 코드나 지번 같은 공통 키가 없어 필지 단위 토지·건축 데이터와 바로 결합되지 않고, 이름 매핑이 필요하다. 범위는 청주시 한 곳의 읍면동 단위이며, 명세상 갱신 주기는 연간·이벤트성으로 표기되어 있다.
