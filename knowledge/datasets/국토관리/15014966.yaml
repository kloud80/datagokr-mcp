description_portal: 개발행위 허가는 국토의 계획 및 이용에 관한 법률에 따라 토지 이용과 관련된 개발 행위 중 도시계획 차원에서 검토가 필요하거나 관리하는 것이 타당하다고 판단되는 경우 특별시장, 광역시장, 시장 또는 군수의 허가를 받는 제도입니다.본 데이터는 청주시 내의 개발행위 허가를 득하여 사업이 진행 중인 허가지 현황에 대한 데이터로, (1)위치(구, 읍면동 등) (2)허가일자 (3)준공 예정일 (4)용도지역  (5)허가목적  (6)허가면적(㎡)  (7)부지면적(㎡)  (8)도로면적(㎡) 항목을 제공합니다.참고로 청주시에서는 개발행위허가는 각 구청별 건설과에서 업무를 추진하고 있습니다.
