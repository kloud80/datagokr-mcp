description_portal: 이 데이터는 경상남도에서 운영 또는 위탁 관리 중인 공공자산 및 공공시설에 대한 주요 현황 정보를 담고 있습니다. 진주가좌올리움아파트는 서민 주거 안정을 위한 국민임대주택 단지로, 공급형별 세대 수, 임대보증금 및 월임대료 등의 임대 조건과 신청 자격 요건이 포함되어 있습니다.경상남도보훈회관은 보훈단체 및 일반 임대 사용자들을 위한 다층 업무시설로, 입주 현황, 위탁관리 기간, 관리인력 및 사용면적에 대한 정보가 제공됩니다.또한, 도립기숙사인 남명학사 서울관 및 창원관에 대해서는 위치, 규모, 정원, 현재 입사자 수, 입사생 모집 일정 등의 관리·운영 정보가 포함되어 있어 지역 인재 육성과 주거복지 정책 추진 현황을 파악하는 데 활용될 수 있습니다.해당 데이터는 공공임대, 시설 위수탁, 기숙사 운영 등 다양한 공공자산 관리 분야의 정책 수립 및 평가에 활용 가능한 기초 자료로서 의미가 있습니다.
