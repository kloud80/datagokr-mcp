summary_user: 공장설립온라인지원시스템 민원 데이터를 바탕으로 공장등록 현황을 시도별·업종별로 집계한 CSV로, 년월과 등록현황 구분 행마다 시도별 값이 열로 나뉜 넓은 표 형태이며 파일 크기는 2,670바이트로 작습니다. 지역 제조업 경기를 보는 분석가가 '특정 업종의 등록 공장이 어느 시도에 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 업종은 한국표준산업분류(10차, 5자리) 기준이고 시도는 열 이름으로만 있어 다른 시도 단위 통계나 산업단지 원장과는 시도명 매핑으로 이어 쓴다.
description_portal: 공장등록현황통계의 시도별 업종별 현황 csv 파일로, 한국의 17개 시도에 대한 업종현황을 데이터 기준일자로 제공하고 있습니다.업종코드의 경우 통계청에서 고시하고 있는 한국표준산업분류코드(5자리)를 기준으로 작성하였으며, 현재 10차 기준으로 제공하고 있습니다.17시도의 경우 광역시도에 대한 기준으로 서울, 인천, 경기, 강원, 충북, 충남, 대전, 전남, 전북, 광주, 경북, 대구, 경남, 부산, 울산, 제주, 세종 등으로 구분되어 있습니다.해당 데이터는 공장설립온라인지원시스템(www.factoryon.go.kr)의 민원 데이터를 토대로 작성하였습니다.
