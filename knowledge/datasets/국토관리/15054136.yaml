summary_user: 한국수자원공사가 다목적댐·하굿둑에서 공급하는 댐용수의 연도별 요금단가(원/㎥)를 담은 전국 단위 소형 집계 파일로, 포털 설명상 2007~2024년을 다룬다. 용수를 공급받는 지자체·사업자나 분석가가 "댐용수 단가가 연도별로 얼마나 올랐나"를 확인하거나 용수 비용을 추정해 사업 계획을 세울 때 쓴다. 연결용 조인 키는 없고 연도 컬럼만 있어, 다른 수자원 요금·물가 자료와는 연도를 기준으로 맞춰 붙여 쓴다.
description_portal: 'K-water가 관련법령 등에 따라 환경부장관의 사용허가 또는 사용승인을 받은 다목적댐 및 하굿둑에서 공급하는 물(""댐용수"")의 요금단가 입니다.댐용수 요금단가는 관련법령 등에 따라 환경부장관이 기획재정부장관과 협의하여 승인한 단가로 결정되며, 연도별 댐용수 요금단가는 아래와 같습니다.해당 데이터는 용수 요금 분석 및 관련 사업 계획 수립에 활용되며,  댐 용수 공급의 투명성과 효율성을 제고하고, 합리적인 요금 체계 운영에 기여합니다.(* 요금단가는 연중 변경될 수 있습니다.)- 작성기간 : 2007년~2024년- 단위 : ㎥/원"'
