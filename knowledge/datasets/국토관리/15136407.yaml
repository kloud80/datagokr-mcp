summary_user: 경기도 분석시스템이 모은 지역화폐 매출을 기준년월·매출 발생 행정동·유출지 행정동·중분류 업종별로 집계한 자료로, 시도 범위를 읍면동 단위로 담는다. 각 행에는 매출액과 순위·비율, 전월·전년 동월 대비 증감이 들어 있다. 지자체 정책 담당자나 지역경제 분석가가 "우리 동 주민의 지역화폐 소비가 어느 동, 어느 업종으로 빠져나가는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와 잇는 것은 행정동코드(admdong_cd, outflwdstn_admdong_cd)의 이름·코드 매핑이나 같은 기관의 업종 코드값 파일을 거쳐야 한다.
description_portal: '이 데이터는 경기도 분석시스템에서 수집한 지역화폐 매출의 유출지 집계정보로, 특정 행정동에서 발생한 지역화폐 매출이 타 행정동으로 유출된 내역을 집계한 자료입니다. 각 행은 ‘기준년월’을 기준으로 ‘행정동코드’(매출 발생지)와 ‘유출지행정동코드’(매출 유출지)의 관계를 나타내며, 업종 유형은 ‘중분류업종코드’로 분류됩니다. - 대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.- 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.* 유출지 데이터 : A라는 메인 지역(행정동코드)에서 다른 지역(유출지행정동코드)으로 매출이 나간 경우의 매출정보'
