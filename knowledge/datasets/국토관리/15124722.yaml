description_portal: 본 데이터는 경기도 광주시의 기계설비 성능점검 대상 건축물 현황 정보를 제공합니다. 일정 규모 이상의 건축물에 설치된 냉난방, 환기, 급배수 등 기계설비의 성능점검 대상 건물 정보를 담고 있습니다. 건축물 용도는 공동주택, 업무시설, 판매시설 등 건물의 사용 목적을 나타내며, 건물명과 도로명주소는 시설의 명칭과 위치를 제공합니다. 공동주택 세대수는 아파트 등 공동주택의 규모를 나타냅니다. 건축물 연면적은 건물의 전체 면적을 제곱미터 단위로 제공합니다. 본 데이터는 건축물 설비 관리, 성능점검 계획 수립, 에너지 효율 관리, 시설 안전 점검, 건축 행정 업무 등에 활용됩니다.
