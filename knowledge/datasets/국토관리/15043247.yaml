summary_user: 경기도 시군별 하수도 청소차(준설차) 등록 대수를 전체·관용·자가용·영업용으로 나눠 담은 시군 단위 집계 데이터이며, 시군마다 데이터기준일자(dat_crtr_ymd)가 따로 붙는다. 지자체 하수도 담당자나 분석가가 "우리 시군의 하수관로 준설 장비가 이웃 시군보다 부족한가, 민간 영업용 차량에 얼마나 기대고 있는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(sigun_nm)을 이름으로 맞춰 하수도 보급·관로 통계나 인구 자료와 연결해야 한다.
description_portal: 경기도 하수도 청소차량(준설차량) 등록 현황입니다. 관용, 영업용, 자가용 등록 대수 정보를 제공합니다.주요 항목으로 시군명, 전체수(대), 관용자동차수(대), 자가용수(대), 영업용자동차수(대) 및 데이터 기준일자인 데이터기준일자가 포함되어 있습니다.하수도 청소 자동차는 자동차등록규칙 제5조에 의거 특수용도형 화물자동차에 해당됩니다.이 데이터를 통해 각 시군의 하수도 청소자원 보유 현황을 파악할 수 있습니다.제공신청을 통해 시군 취합된 데이터로 시군별 갱신여부 및 기준일자가 상이하니 이용에 참고부탁드립니다.
