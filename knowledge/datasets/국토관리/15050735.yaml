summary_user: 전라남도 해남군에 등록된 공장을 업체 한 곳당 한 행으로 담은 파일로, 회사명·도로명 공장주소·생산품·주원자재를 담으며 포털 설명 기준으로 2026년 4월 시점 482개 업체가 들어 있다. 해남군에서 절임배추·김·아스콘 같은 특정 품목을 만드는 공장이 어디에 몇 곳 있는지 찾으려는 사업자나 지역 산업 분석가가 쓴다. 전역 조인 키가 없어 도로명 주소를 읍면이나 좌표로 바꾸거나 회사명을 맞춰 다른 공장등록·기업 데이터와 이어 쓴다.
description_portal: 전라남도 해남군 공장등록 업체에 대한 데이터입니다.이 데이터에는  회사명, 대표자명, 공장주소, 생산품, 주원자재 등의  항목을 제공합니다.26년 4월 기준 데이터이며, 해남군에는 총 482개의 공장업체가 있습니다. 송지면에 해남에서 가장 많은 128개의 공장이 있으며 옥천면 61개, 화산면 51개, 마산면 37개 등의 순입니다.공장 중 농산물은(절임배추, 김치, 쌀, 고구마 등), 해산물(마름김, 김자반 등), 그외(아스콘, 선박재료, 각종 농기계, 가로등, 퇴비 비료 등) 다양한 분야의 생산품을 생산하고 있습니다.
