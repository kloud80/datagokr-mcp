description_portal: 대한민국 경상남도 양산시 빈집 현황에 대한 기본정보빈집의 소재지, 건축물 구조, 연면적, 빈집등급, 관리기관 전화번호 등으로 구성된 데이터입니다. * 빈집이란?    특별자치장·특별자치도지사·시장·군수 등이 거주 또는 사용 여부를 확인한 날로부터 1년 이상 아무도 거주 또는 사용하지 않은 주택을 말합니다. * 빈집제외(빈집 및 소규모 주택정비에 관한 특례법 제2조)    1. 공공임대주택    2. 미분양주택으로서 사용검사를 받은 후 5년이 경과하지 아니한 주택    3. 준주택. 다만, 주거용 오피스텔은 제외    4. 별장 등 일시적 거주 또는 사용을 목적으로 하는 주택인구 고령화·저출산 등으로 인한 주택수요 공급의 불균형으로 빈집이 계속해서 증가하고 있으며, 이에 따른 안전사고, 범죄발생, 주거환경장애 등 빈집문제에 대한 쳬계적인 관리가 필요함에 따라 국민이 전국 빈집 현황을 쉽게 확인하고 활용 방안을 공유할 수 있도록 빈집 데이터를 개방합니다.
