summary_user: 부산광역시 상수도사업본부 수용가정보시스템의 과오납 처리 내역을 건별로 담은 CSV 파일(약 7.5MB)로, 고지년월·통지일자와 함께 상수도·하수도·물이용부담금별 과오납 금액과 이자, 정산·충당·환불 처리 금액, 사업소명을 기록한다. 분석가나 수도 행정 담당자가 사업소별·월별로 수도요금 과오납이 얼마나 생기고 어떻게 정산·환불되는지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소명이나 고지년월 같은 이름·기간 기준으로만 맞춰 써야 한다.
description_portal: 부산광역시 상수도사업본부_수용가정보시스템_수납정보_과오수납처리정보상수도 과오수납은 부과 착오, 이중 납부, 감액 사유 등으로 수도요금을 더 냈을 때 발생하는 민원입니다. 해당 수용가는 관할 수도사업소 방문, 전화, 또는 인터넷을 통해 '과오납금 환부 신청'을 할 수 있습니다. 신청 시 과오납금 반환청구서, 신분증, 통장 사본 등이 필요하며 정당한 청구권자인지 확인 절차를 거칩니다. 환급금은 신청 후 보통 즉시 또는 신속하게 본인 계좌로 입금 처리되지만, 정산하지 않을 경우 다음 달 요금에서 차감될 수 있습니다
