description_portal: '부산광역시 연제구 내에 있는 가로등 현수기(배너)의 위치와 현황에 대한 정보를 제공합니다. 관내 가로등 현수기는 공공용(행정용)으로만 제공합니다. 주요 설치 구간으로는 -시청-연산교차로-연산교차로-SK 거제주유소 앞(구 송월타월)-연산교차로-사직동경계-거제초교 앞-이사벨고교 앞-연산교차로-연안교등이 있습니다. 부착가능한 일수는 15일 이내 입니다. 설치규격은 가로 60㎝ 이내, 세로 1.7m 이내(※ 후원업소 명칭 : 가로 60cm이내, 세로 5cm이내)며높이는 지면으로부터 현수기 밑부분까지 2m이상 설치하여야 합니다. 현수기 설치 시에는 튼튼한 재질로 안전하게 설치하고, 강풍 등 기상 특보시 반드시 철거 조치하여야 합니다.홍보용 가로등 현수기 설치 시 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」 및 같은 법 시행령 제29조 제5항의 조건에 적합하게 설치하시고, 규격, 높이 미준수 및 가로등 이외의 장소(도로표지판 등)에 설치 시 수거처리 되니 승인사항을 준수하여 설치기간 만료일에 즉시 철거하여 주시기 바랍니다.'
