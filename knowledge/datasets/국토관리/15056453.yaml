description_portal: '제주특별자치도 내 의무관리 공동주택 현황 데이터를 제공합니다.항목: 주택명, 소재지, 담당부서 등*「공동주택관리법」에 의거해당 공동주택을 전문적으로 관리하는 자를 두고 자치 의결기구를 의무적으로 구성하여야 하는 등 일정한 의무가 부과되는 공동주택*범위1. 300세대 이상의 공동주택2. 150세대 이상으로서 승강기가 설치된 공동주택3. 150세대 이상으로서 중앙집중식 난방방식(지역난방방식을 포함한다)의 공동주택4. 「건축법」 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 건축한 건축물로서 주택이 150세대 이상인 건축물5. 가목부터 라목까지에 해당하지 아니하는 공동주택 중 입주자등이 대통령령으로 정하는 기준에 따라 동의하여 정하는 공동주택'
