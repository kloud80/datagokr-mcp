summary_user: 구리시에서 건축 현장조사·검사 업무를 대행하는 건축사와 건축사무소 명단을 사무소별로 담은 파일(csv, 약 22KB)이며, 건축사명·사무소명·소재지·전화·팩스 번호와 데이터 기준일을 담는다. 구리시에서 건축 중인 건축주나 시공사가 현장조사·검사를 맡는 대행 건축사무소가 어디이고 연락처가 무엇인지 확인할 때 쓴다. 전역 조인 키가 없어서 다른 건축사무소 자료와는 사무소명이나 소재지 주소를 맞춰 보는 방식으로만 잇는다.
