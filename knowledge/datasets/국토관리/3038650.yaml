description_portal: '본 데이터는 경기도 구리시에서 건축행정 업무를 수행하기 위해 필요한 ‘현장조사·검사 대행 건축사무소’의 업무현황을 종합적으로 정리한 자료입니다.구리시에서는 건축물의 안전과 적법한 시공을 확인하기 위해 다양한 현장조사·검사 절차를 운영하고 있으며, 일부 업무는 법령에 따라 민간 건축사무소가 대행할 수 있습니다. 이 데이터는 그러한 대행 건축사무소의 활동을 한눈에 파악할 수 있도록 구성되어 있습니다.데이터에는 다음과 같은 정보가 포함됩니다.건축사무소 기본 정보: 사무소명, 대표자, 소재지 주소, 연락처대행 업무 내용: 현장조사 또는 검사 업무의 수행 유형업무 처리 현황: 연도별·사안별 처리 건수, 현재 진행 중인 업무, 완료된 업무 내역관련 행정정보: 담당자 정보, 대행 승인 여부, 대행 업무 범위기타 참고 정보: 최근 활동 이력, 행정업무 지원에 필요한 부가 정보 등이 데이터는 「건축법」 제27조에서 규정한 현장조사·검사 및 확인업무의 대행 절차에 따라 수집·관리되는 자료이며, 구리시 건축행정 전반의 정확성·공정성·투명성을 확보하기 위한 기반자료로 활용됩니다.행정기관은 이 데이터를 통해 대행 건축사무소의 업무 처리 적정성을 확인하고,특정 사무소가 수행한 현장조사·검사 내역을 신속히 파악하고,민원 대응이나 정책 수립 시 객관적인 근거자료로 활용할 수 있습니다.또한 시민과 민간업체가 건축 관련 정보를 이해하는 데에도 도움이 되는 공개 가능한 행정정보로서의 가치를 갖습니다.'
