summary_user: 경상북도개발공사가 공급했거나 추진 중인 신규 공공임대주택을 단지(주택) 하나당 한 행으로 담은 작은 파일(약 651바이트)로, 주택명·지역명·상세주소·규모·세대수·준공일을 담는다. 경북에서 공공임대주택을 찾는 주민이나 지역 주거 공급을 살피는 분석가가 '봉화·포항·영양·칠곡 등 어느 지역에 몇 세대 규모의 공사 임대주택이 언제 준공됐나'를 확인하는 데 쓴다. 공통 조인 키나 코드표가 없어 다른 임대주택·전월세 데이터와는 지역명이나 주소 문자열을 맞춰 이어 써야 한다.
limits: 실측 컬럼에 표준 조인 키가 없어 행정구역 코드나 단지 코드로 바로 결합할 수 없고, 지역명·주소 매칭에 기대야 한다. 포털 설명상 경북도청 신도시 코오롱하늘채는 빠져 있고 공급 예정분은 사업이 진행될 때 반영되므로, 공사의 전체 임대주택 현황으로 보면 안 된다.
