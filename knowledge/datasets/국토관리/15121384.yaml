description_portal: 경상북도개발공사의 신규 임대주택 정보입니다. 경북도청 신도시 내 코오롱 하늘채를 제외하고, 경상북도 전역에 분포되어 있는 임대주택 정보이며, 주택명, 지역명, 상세주소 등으로 구성되어 있습니다. 또한, 신규로 추진하고 있는 공공임대주택 사업 발생 시, 해당 데이터를 현행화하여 개방하고 있습니다. 현재까지 봉화, 포항, 영양, 칠곡을 대상으로 임대주택 공급 완료하였으며, 2028년 하반기 경 경북도청신도시 내 추가 공공임대주택 727세대를 공급할 예정입니다. 전체 공급 세대수는 총 876세대이며, 공급 예정인 727세대를 제외할 경우, 현재까지 149세대를 공급 완료하였으며, 해당수치 내에는 이미 공급 완료된 경북도청신도시 코오롱하늘채 공급 세대수는 제외되어 있습니다. 이보다 더 자세한 내용은 우리 공사 홈페이지의 주요사업 부분 참고 부탁드립니다.또한, 임대주택 뿐만 아니라, 2031년까지 지역밀착형 약정형 매입임대주택을 공급할 예정이며, 실제 전수 공급 완료 후 데이터 내 내용 추가로 반영하여 개방할 예정입니다.
