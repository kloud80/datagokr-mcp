description_portal: 빈집 및 소규모주택 정비에 관한 특별법시행령 제7조 및 농어촌 시행령 제59조의5에 의하여 경상북도 의성군내 소재중인 빈집 의심 주택에 대하여 빈집 조사를 실시하였으며,  빈집 실태조사는 사전조사,소유자정보요청, 조사계획고시,현장확인,소유자 의견조사, 등급산정조사, 검수, 확인점검의 과정을 거쳤으며  빈집의심 주택 2365중 1636의 빈집을 추정하였으며, 빈집 실태조사방법은 빈집 의심 주택의 외관 관리 형태, 전기계랑기 사용여부(최근 12개월 동안 전기사용량의 합계가 120kwh이하인 경우), 상하수도 사용여부, 기타에너지 사용량, 폐공가 현황자료등을 활용하여 조사하였으며,  전기,상수도등 자료는 12개월이상의 결과를 토대로 하였습니다.또한 주변 주민들의 의견을 참고하여 빈집판정시 종합적인 판단으로 빈집을 추정하였습니다. 또한 빈집 소유자와 연락을 취하여 빈집 활용여부나 철거여부등을 전화 조사를 실시하였습니다. 빈집 등급 판정 기준은 빈집 1등급은 개보수 없이 또는 개보수 후에 거주 또는 활용이 가능한 빈집이며,  2등급 빈집의 판정 여부는 안전조치 또는 이에 준하는 정비가 필요한 빈집입니다. 3등급빈집은 철거 또는 이에 준하는 정비가 필요한 빈집으로 판정하였습니다. 그결과를 토대로  빈집 실태 조사 현황(연번,소재지(읍면리),건축물의 용도, 건축물을 이루고 있는 주구조, 연면적,데이터 기준일(빈집실태조사 빈집확정일자), 빈집관리 기관, 빈집 관리 담당자 등) 자료를 제공합니다.
