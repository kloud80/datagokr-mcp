description_portal: 도시 쇠퇴와 지역 경제 침체에 대응하기 위한 도시재생사업이 국가적 정책으로 추진되면서, 낙후된 지역의 활력 회복과 지속가능한 발전을 위한 체계적인 접근이 필요하게 되었습니다. 도시재생사업 추진 과정에서 기존 지역 업체들의 보호와 신규 업체 유치를 통한 지역경제 활성화 효과 분석이 중요해지고 있으며, 사회적 기업과 협동조합 등 사회적 경제 조직의 역할 확대로 지역 공동체 중심의 지속가능한 발전 모델 구축이 요구되고 있습니다. 도시재생사업의 성과 측정과 효과적인 사업 추진을 위해서는 사업지 내 업체 현황과 변화 과정에 대한 체계적인 모니터링이 필요하며, 지역 주민들의 일자리 창출과 소득 증대를 위한 지역 업체 정보 제공의 중요성이 증대되고 있습니다. 이에 따라 충청남도 보령시는 관내 도시재생사업지에 위치한 업체들의 사업 유형, 업종, 사회적 기업 여부 등 도시재생사업 성과 분석과 지역경제 활성화 모니터링에 필요한 종합적인 업체 현황 정보를 제공하고 있습니다.개방 데이터는 도시재생사업지 업체현황의 도시재생사업명, 유형, 업체명, 업종, 소재지, 전화번호, 대표자, 사회적 기업여부, 설립인가일, 데이터기준일자 등 총 10개 항목 6건의 상세 정보를 포함하고 있습니다.지역 주민·창업희망자는 도시재생사업지 내 업체 현황 파악을 통해 취업 기회 발굴 및 창업 아이템 모색에 활용하고, 도시재생 관련 기관·연구자는 사업 성과 분석 및 지역경제 파급효과 연구에 활용하며, 지방자치단체·도시계획기관은 도시재생사업 효과 측정 및 향후 사업 계획 수립, 지역경제 활성화 정책 개발에 활용할 수 있습니다.
