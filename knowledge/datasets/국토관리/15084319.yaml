summary_user: 충청남도 보령시 도시재생사업지 안에 있는 업체를 한 줄에 한 곳씩 담은 건별 목록으로, 사업명·유형·업종·도로명 소재지·대표자·사회적 기업 여부·설립인가일을 기록하며 포털 설명상 6건 규모의 작은 CSV 파일이다. 보령시 도시재생 구역에서 어떤 사회적 기업·협동조합이 어떤 업종으로 활동하는지 확인하려는 주민·창업희망자나 사업 성과를 점검하는 연구자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 소재지 주소나 업체명·사업명을 이름으로 맞춰 이어야 한다.
