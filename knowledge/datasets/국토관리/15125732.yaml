summary_user: 서울시의 기타 용도구역을 도형 단위로 담은 공간정보 파일로, 도형마다 분류 코드, 결정고시 관리 코드, 라벨명, 시군구 코드, 면적·길이 같은 속성이 붙어 있습니다. 국토계획법의 용도지역·지구·구역 체계(§36~§42) 아래에서, 분석가나 사업자가 특정 지역이 어떤 용도구역에 걸리는지 지도 위에서 참고로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 시군구 코드(SGG_CD)나 같은 기관의 다른 용도지역·지구 공간정보와 코드·이름을 맞춰 연결한다.
limits: 포털 설명상 법적 효력이 없는 참고자료이며, 좌표계는 EPSG:5174(Bessel TM)이고 인코딩은 windows-949라서 변환에 주의해야 한다. 서울 열린데이터광장(data.seoul.go.kr)의 별도 인증키(KEY)가 필요하며, 이 키는 포털 활용신청과 별개다. 다른 데이터와 바로 이어 붙일 전역 조인 키는 없다.
