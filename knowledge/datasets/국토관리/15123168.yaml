summary_user: 경기도 광주시 도시계획정보시스템에 등록된 취락지구를 지구(도형) 한 건씩 담은 파일로, 관리번호·명칭(라벨명)·면적·경계 길이·등록일시를 시군구 단위로 제공한다. 녹지·관리·농림지역 안 집단 마을이 취락지구로 묶여 있는지, 그 지구의 면적이 얼마인지를 건축 인허가 검토나 농촌 취락 정비 계획 때 확인하는 데 쓴다. 전역 조인 키는 없어 시군구코드나 지구 명칭으로 광주시의 다른 용도지역·지구 현황과 맞대어 쓰며, 이 파일만으로는 필지 단위 연결이 되지 않는다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 취락지구 현황 정보를 제공합니다. 녹지지역, 관리지역, 농림지역 등 비도시지역 내에서 주민들이 집단으로 거주하는 마을 지역을 관리하기 위해 지정된 취락지구의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지구를 고유하게 식별하며, 라벨명은 취락지구의 명칭을 나타냅니다. 면적은 지구가 차지하는 면적을 제공하고, 길이는 선형 경계의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 농촌 마을 관리, 취락 정비 계획, 건축 인허가 심사, 토지 이용 계획, 농촌 개발 정책 수립 등에 활용됩니다.
