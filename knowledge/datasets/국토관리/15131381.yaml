summary_user: 한국수자원공사가 관리하는 정수장을 한 행에 한 곳씩 담은 시설 목록 파일(csv, 약 70KB)로, 전국 범위이며 행정구역·정수장명·위치·수원·가동상태·정수처리방식·준공연도·광역 구분·소독제·시설용량을 담는다. 분석가나 지자체 담당자가 "우리 지역 수돗물을 만드는 정수장은 어디이고, 어떤 수원과 처리방식·소독제를 쓰며, 얼마나 오래되고 용량은 얼마인가"를 확인하거나 노후 시설과 용량 분포를 살피는 데 쓴다. 전역 조인 키가 없어 정수장명이나 행정구역 이름을 맞춰 수질검사·취수장·급수구역 데이터와 잇는다.
description_portal: 본 데이터는 한국수자원공사의 상수도 시설 현황(정수)입니다. 정수 시설은 원수를 정화해 수돗물을 생산하는 기반으로, 행정구역, 가압장명, 가압장위치, 가동상태, 준공연도, 설계용량, 감시제어유무, 비상발전유형의 정보를 제공합니다. 이를 통해 시설 분포와 상태를 파악하고 관리 계획을 세울 수 있습니다. 본 데이터는 안전한 음용수 공급을 지원하며 주민 생활 편익과 공공서비스 향상에 기여합니다. 시설 정보는 신규 사업 검토, 공급망 평가, 정책 수립에 활용됩니다. 국민은 생활과 밀접한 시설 현황을 확인하여 공공데이터 서비스 신뢰를 높일 수 있습니다.
