summary_user: 천안역전시장(동남구 공설시장1길 2 일원) 안의 점포를 한 건씩 담은 데이터로, 상호·업종·운영시간·도로명/지번 주소·위도경도·전화번호·기준일자를 점포 단위로 제공한다. 시장을 찾는 시민이나 상권을 보는 분석가가 '역전시장에 어떤 업종 점포가 몇 시까지 문을 여는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 상호 이름 매칭, 또는 천안시 같은 기관 데이터로만 이어 쓴다.
description_portal: 천안역전시장 점포에 대한 데이터로 상호, 운영시간, 주소, 전화번호, 위치 등을 제공하는 서비스입니다. 동남구 공설시장1길 2 일원
