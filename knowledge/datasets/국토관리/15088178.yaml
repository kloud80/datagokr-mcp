description_portal: 이 데이터는 서울주택도시공사(SH공사)에서 공급하는 전세임대주택 중 ‘기존주택 유형’에 해당하는 공급계획 정보를 포함하고 있습니다. 기존주택 전세임대는 입주 대상자가 시중의 기존 주택을 선택하면 SH공사가 해당 주택을 전세로 확보하여 임대해주는 방식으로, 신속한 주거 지원이 가능하다는 장점이 있습니다. 공급계획에는 지역, 호수, 면적, 공급 시기 등의 정보가 포함되며, 계획은 예산 및 수요 상황 등에 따라 언제든 변경될 수 있습니다. 또한 전세금이 지원 한도액을 초과할 경우 초과분은 입주자가 부담해야 하며, 전세금은 원칙적으로 호당 대출한도의 250% 이내여야 합니다. 다만, 세대원 수가 5인 이상인 경우에는 예외 적용이 가능합니다. 이 데이터는 저소득층 및 주거취약계층을 위한 주거복지 실현 현황을 분석하거나, 지역별 수요-공급 격차를 파악하는 데 유용한 기초자료로 활용될 수 있습니다.※ 2025년부터는 "서울주택도시개발공사_전세임대주택 공급계획" 으로 통합하여 정보 제공됩니다.
