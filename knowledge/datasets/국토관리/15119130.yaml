summary_user: 진안군 도시계획정보시스템(UPIS)에 올라온 도시계획 공고를 누가 언제 열람했는지를 열람 건마다 한 줄로 담은 파일(csv, 약 14KB)이며, 공고관리번호·열람일련번호·지자체관리코드·공고 제목·열람자·생성일시를 담는다. 진안군 도시·군관리계획 공고가 어떤 제목으로 나갔고 언제 얼마나 열람됐는지 살펴보려는 분석가나 지역 개발 동향을 보는 사업자가 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으며, 지자체관리코드(진안군 법정동코드)나 공고 제목·번호를 같은 기관의 UPIS 고시·결정 자료와 맞춰 이어 쓴다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 공고 열람 결과에 대한 공공데이터 자료입니다. 이번 자료에서는 공고 관리 번호, 열람 일련번호, 지자체 관리 코드, 제목, 생성일시 정보를 제공합니다. 이 자료를 통해 공고 관리 번호에 해당하는 공고 제목이 무엇인지 확인할 수 있으며, 열람자 또한 누구인지 알아볼 수 있습니다. 그리고 이 내용이 언제 생성되었는지도 파악할 수 있습니다. 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.
