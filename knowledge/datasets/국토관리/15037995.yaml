summary_user: 의정부시의회에 제안된 의안을 한 건씩 담은 원천 목록으로, 의안번호·의안명·종류·소관위원회·제안자(대표·공동발의)와 위원회 회부·의결, 본회의 처리, 이송·공포, 철회·폐기 일자까지 처리 이력을 담는다(CSV 약 0.9MB). 시민이나 연구자가 '특정 의원이 대표발의한 조례안이 본회의에서 어떻게 처리되고 언제 공포됐나'나 위원회별 처리 현황·발의 동향을 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 의안명·의원 이름이나 공포번호 같은 값을 직접 맞춰 잇는다.
description_portal: 경기도 의정부시의회 발의 의안 정보 데이터는 시의회의 입법 활동과 정책적 의사결정을 종합적으로 확인할 수 있는 중요한 행정자료입니다. 이 데이터는 의안번호, 의안명, 의안종류, 소관위원회, 제안일, 제안자, 제안회기 등 기본적인 의안의 개요부터 시작해, 위원회 회부일, 상정일, 의결일, 처리결과 등 심의 과정 전반에 걸친 상세한 이력을 포함하고 있습니다. 또한 본회의 보고일, 상정일, 처리일, 처리결과를 통해 의안이 최종적으로 어떤 결론에 도달했는지 추적할 수 있으며, 이송일과 공포번호, 공포일 항목은 해당 의안이 행정적으로 확정되어 집행 단계에 이르는 과정을 명확히 보여줍니다. 만약 의안이 도중에 철회되거나 폐기되는 경우, 철회일과 폐기일을 통해 그 사유와 시점을 기록하여 정책적 논의의 흐름을 이해하는 데 도움을 줍니다. 이처럼 다양한 항목으로 구성된 의안 정보는 시민들이 의정 활동을 투명하게 파악하고, 대표 발의 의원 및 발의 과정의 책임성을 확인하는 데 기여합니다. 또한 연구자나 행정기관은 데이터를 활용해 의안 발의 동향, 특정 위원회별 처리 현황, 정책 분야별 입법 활동의 변화를 분석할 수 있으며, 의회의 의사결정 과정의 효율성과 투명성을 높이는 기반으로도 활용할 수 있습니다. 나아가 본 데이터는 정책 수립 및 평가, 의정활동의 성과 관리, 시민 참여 확대를 위한 자료로 가치가 크며, 의정부시 의회의 입법적 기능과 행정적 집행 과정을 전반적으로 조망할 수 있는 체계적인 정보 제공을 목표로 하고 있습니다.
