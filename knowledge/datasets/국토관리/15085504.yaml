summary_user: 공장설립온라인지원시스템에 지자체·관리기관이 등록한 공장설립 민원을 바탕으로, 17개 시도별 등록 공장 수를 소기업·중기업·중견기업·대기업 규모로 나눠 기준 연월(년월) 단위로 집계한 446바이트짜리 소형 CSV 파일이다. 지역 제조업 분석가나 지자체 담당자가 "우리 시도의 등록 공장 중 대기업·중견기업 비중이 다른 시도와 비교해 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키는 없고 시도가 행이 아니라 열 이름으로 들어 있어, 다른 시도 단위 통계나 산업단지 원장과는 시도 이름을 행정코드에 직접 매핑해 연결해야 한다.
limits: 집계 단위가 시도이므로 시군구별·산업단지별·개별 공장별 현황은 알 수 없다. 표준 행정코드나 산업단지코드 같은 조인 키가 없어, 다른 데이터와 결합하려면 시도명을 직접 매핑해야 한다.
