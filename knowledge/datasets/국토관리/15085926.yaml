summary_user: 한강홍수통제소가 한국수자원공사·한국수력원자력의 요청을 받아 승인한 댐 방류 내역을 승인 건별로 담은 원천 기록 파일이며, 2010년 7월 이후 승인분의 댐 관측소, 승인 일시, 방류 시작 시각, 접수 방류량(CMS), 비고(초기방류·수문전폐·방류량 증감 등)를 담는다. 하천 인근 주민이나 재난 분석가가 '특정 장마·태풍 때 어느 댐이 언제 얼마나 방류를 승인받았나'를 되짚는 데 쓴다. 전역 조인 키는 없어서, 댐 관측소 코드(관측소코드)나 관측소명을 같은 기관의 댐 수문 관측·방류 자료와 맞춰 이어 쓴다.
description_portal: '한강홍수통제소에서 한국수자원공사와 한국수력원자력의  방류승인 요청을 받아 승인 진행을 완료한 댐 방류 승인 내역 데이터입니다.순차번호, 댐 관측소 코드, 댐 관측소 명,  승인일자, 방류 시작시간(년월일시분), 접수 방류량(단위 : CMS), 접수일자, 비고 데이터를 제공합니다.비고 데이터는 초기방류 사항 및 수문전폐(발전방류만 시행 등) 사항, 방류시간 변경사항, 이전 방류와 비교하여 증가 및 감소하는 방류량 등 특이사항을 기록합니다.댐방류 승인 데이터는 2010년 7월 이후 승인된 데이터를 제공합니다.'
