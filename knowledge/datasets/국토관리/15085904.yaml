summary_user: 한강홍수통제소가 대권역·표준유역 관측 강수량으로 계산한 표준유역별 유역평균강수량을 10분 단위로 담은 파일이며, 포털 설명상 2021년 6월 1일부터 8월 3일까지의 기간을 다룬다. 홍수 예측 모형을 검토하거나 2021년 장마철에 특정 표준유역에 10분마다 비가 얼마나 내렸는지 되짚어 보려는 수문 분석가가 쓴다. 전역 조인 키가 없어 다른 수문·홍수 데이터와는 대권역명·표준유역명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
