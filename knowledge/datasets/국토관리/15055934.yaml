summary_user: 인천 연수구에서 외국인이 이용하기 편리한 음식점을 업소 한 곳당 한 행으로 담은 파일 데이터로, 업소명·도로명주소·전화번호·업태·주메뉴가 들어 있고 파일 크기는 936바이트에 불과한 소규모 목록이다. 연수구에 머무는 외국인 관광객·거주자나 이들을 안내하는 관광·지역 단체가 "연수구에서 외국인이 편하게 갈 수 있는 식당이 어디이며 주메뉴는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 문자열로 맞추어 이어 써야 하며, 예를 들어 음식점 인허가 현황과 업소명·주소로 대조하는 방식이다.
limits: 업소 코드나 좌표 같은 공통 키가 없어 다른 데이터와의 연결은 업소명·주소 매칭에 의존한다. 범위가 연수구 한 곳에 한정되므로 인천 전체나 다른 구의 외국인 편리음식점은 이 파일로 알 수 없다.
