summary_user: 인천광역시 전체를 단위로 경관·고도·방화·보호·취락·개발진흥·복합용도·문화지구 등 용도지구 유형별 지정 면적(천제곱미터)을 시점별로 집계한 표이며, 파일 크기는 463바이트에 불과한 소규모 비공간 자료입니다. 도시계획 분석가나 연구자가 '인천시에서 경관지구나 취락지구가 얼마나 지정돼 있는가'를 확인하거나 유형별 비중을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시점과 시도명(인천광역시)을 기준으로 수작업으로 맞춰 이어 써야 한다.
description_portal: 인천광역시 용도지구 현황 공고데이터는 도시계획 및 지역 개발을 위한 핵심 정보를 담고 있는 자료입니다. 이 데이터는 인천광역시 내 다양한 용도지구의 지정 현황을 포함하고 있으며, 경관지구, 고도지구, 방화지구, 보호지구, 취락지구, 개발진흥지구 , 복합용도지구, 문화지구 등 총 8개 유형의 지구로 분류되어 있습니다. 각 지구는 도시의 기능적 배치를 조정하고, 환경 보호 및 안전 확보, 문화적 가치 보존 등 다양하게 설정됩니다. 해당 데이터는 2025년 7월을 기준으로 작성되었으며, 연간 단위로 업데이트됩니다.
