summary_user: 김포시 관내 학교에 조성된 학교숲을 학교별로 한 행씩 담은 파일(csv, 약 2.5KB)로, 조성년도·학교명·도로명주소·면적(㎡)·조성현황·기준일자를 담는다(제목은 도시숲이지만 실제 항목은 학교숲이다). 교육·녹지 담당자나 분석가가 '김포시 어느 학교에 언제, 얼마나 넓은 숲이 조성됐는가'를 확인하고 학교 간 녹지 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 학교명이나 도로명주소를 매개로 학교 기본정보, 주소 기반 위치 데이터와 이어 쓴다.
description_portal: 경기도 김포시_학교숲 데이터는 관내 각 학교에 조성된 녹지공간의 규모와 조성 특성을 체계적으로 제공하는 공공데이터입니다. 주요 항목은 조성년도, 학교명, 소재지도로명주소, 면적(㎡), 조성현황, 데이터 기준일자로 구성되어 있으며, 학교별 녹지 환경과 조성 수준을 한눈에 파악할 수 있습니다. 이 자료는 학생들의 정서 안정, 휴식 공간 확충, 미세먼지 저감 등 교육환경 개선 정책 수립에 활용되며, 학교숲의 면적과 조성 특성을 분석해 생태교육 프로그램 개발, 녹지 관리 계획 수립, 지역 녹지 인프라 평가에 기초 자료로 제공됩니다. 또한 김포시 전체 학교숲 분포를 비교함으로써 아동·청소년 친화 환경 조성과 도시녹지 확충 전략 마련에도 활용될 수 있습니다.
