summary_user: 전산화된 지적도·임야도의 필지 경계를 이어 붙인 연속지적 도형(폴리곤)을 시도 단위 SHP 파일로 담으며, 범위는 전국 필지이고 좌표계는 EPSG:5186(GRS80)이다. 도시계획·토지관리 분석가가 "이 지역 필지들의 경계와 위치가 어떻게 분포하는가"를 지도 위에서 확인하거나 행정구역·토지이용 자료와 겹쳐 분석할 때 쓴다. 실측 컬럼(A0~A9)에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 공간 중첩으로 연결해야 한다.
description_portal: 국토교통부 일별연속지적도형정보는 전산화된 지적도 및 임야도의 도면상 경계점을 연결하여 연속된 형태로 작성한 도면 정보로, 시도 단위로 제공되며 좌표계는 EPSG:5186(GRS80)을 사용한다. 해당 데이터는 실제 측량자료로 활용할 수 있는 법적 효력이 있는 도면이 아니라, 지적도와 임야도를 공간적으로 연속 표현하기 위한 참조용 도면정보에 해당한다.이를 통해 개별 필지 단위의 경계와 위치를 파악하거나, 행정구역·토지이용 관련 자료와 결합하여 분석할 수 있으며, 토지관리·도시계획·공간분석 등 다양한 분야에서 기초 공간자료로 활용할 수 있다.
