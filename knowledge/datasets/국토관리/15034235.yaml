summary_user: 충청북도에 공장 등록된 가동 중인 제조업체를 업체별로 한 행씩 담은 명부로, 소재 시군·회사명·공장 도로명 주소·전화번호·주생산품을 담는다(2025년 12월말 공장설립온라인지원시스템 기준, 시군별 조사 자료). 도내 제조업체 제품의 판로개척·홍보 목적으로, 예컨대 구매 담당자나 사업자가 '충북 ○○시군에서 특정 품목을 만드는 공장이 어디인가'를 찾는 데 쓴다. 전역 조인 키(사업자번호·업종코드·필지번호 등)가 없어 다른 공장등록·기업 데이터와는 회사명이나 주소 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 충청북도 제조업체 현황가동 중인 충청북도 제조업체 테이터를 제공합니다.(소재 시군, 업체명, 공장대표주소, 전화번호, 주생산품)2025년 제조업체 현황은 공장 등록된 제조업체(공장설립온라인지원시스템 참조/2025년 12월말) 기준으로 작성되었으며,각 시군별 조사를 통해 생성된 자료입니다.본 자료는 도내 소재 제조업체 생산제품 판로개척 및 홍보를 위해 제공하는 자료이며,대외적인 공식 통계자료로는 활용할 수 없습니다.자세한 사항은 충청북도홈페이지에서 확인하시기 바랍니다.https://www.chungbuk.go.kr/www/contents.do?key=5382
