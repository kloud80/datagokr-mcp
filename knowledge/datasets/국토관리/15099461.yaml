summary_user: 대구광역시 달서구에서 내준 개발행위허가를 건별로 담은 CSV 파일(약 34KB)이며, 허가일·대지위치·지목·허가면적·용도지역·개발행위구분·허가목적과 위도·경도를 함께 담는다. 주민이나 부동산·개발 사업자가 '우리 동네 어느 필지에서 어떤 목적의 개발행위가 언제 허가됐는가'를 확인하거나, 분석가가 용도지역별 개발 허가 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 대지위치(지번 주소)나 위도·경도 좌표로 공간·주소 매칭해 이어 쓴다.
limits: 달서구 한 개 시군구만 다루므로 대구 전역이나 다른 지역과 비교하려면 구별 파일을 따로 모아야 한다. 명세상 연간 갱신이라 최근 허가가 바로 반영되지 않을 수 있다. 필지번호(PNU) 같은 공통 키가 없어 토지·건축물 데이터와 연결할 때 주소·좌표 매칭 오차에 주의해야 한다.
