description_portal: '한국표준산업분류의 대분류 중 광업, 제조업 중 어느 하나에 해당하는 사업체를 대상으로 구조와 지역별 분포, 사업체수, 종사자수, 급여액, 출하액, 부가가치, 주요생산비 등 13개 항목을 종합적으로 조사하여 정부 및 지방자치단체의 경제정책 수립과 기업의 경영계획 수립, 관련 학계 등의 산업연구·분석에 필요한 기초자료 제공하고자 조사한 데이터임. <용어해설>1) 종사자 수 : 상용근로자, 임시 및 일용근로자, 자영업자, 무급가족종사자, 기타종사자, 다른 사업체로부터 받은 종사자를 종사상 지위별로 연말 기준 각각 해당 사업체의 종사자 수를 조사2) 제품출하액 : 사업체에서 직접 생산한 완제품과 원재료 또는 중간제품을 타사업체에 공급하여 위탁 제조한 완제품의 1년간 출하액을 말함3) 부가가치 : 생산액에서 원재료비, 연료비, 전력비, 용수비, 외주가공비 및 수선비 등 주요 생산비를 공제한 것을 말하며, 국민계정 상의 부가가치와는 산출 방법의 차이로 인해 일치하지 않음.'
