description_portal: 세종특별자치시에 위치한 상수도 기반시설 현황에 관한 자료입니다. 데이터는 구분, 기반시설명, 시설주소, 설치년도, 가압능력, 용량, 비고로 구성되어 있습니다세종특별자치시가 관리하는 가압장은 98개소(도담동, 연기면, 금남면, 부강면, 소정면 등), 배수지는 18개소(고운동, 반곡동, 금남면,  소정면 등)입니다.가압장은 대부분 배수가압시설이며, 배수지는 콘크리트 구조 10개소, 물탱크 구조 7개소, 콘크리트와 물탱크 혼합구조 1개소입니다.이자료는 세종특별자치시 상하수도사업소에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.
