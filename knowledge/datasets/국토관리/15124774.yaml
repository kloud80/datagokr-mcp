summary_user: 한국토지주택공사가 공고한 공공임대 상가의 입점자 모집 공고별·호실별 임대 조건을 담은 건별 파일로, 공고명·공고일자·주소·단지명·동·호·층, 전용·공용·계약면적, 건축물용도, 임대보증금, 임대료, 공급예정금액을 포함하며 범위는 전국이다. 창업 준비자나 소상공인이 특정 지역 LH 단지 상가의 면적 대비 보증금·월 임대료 수준을 비교하거나, 분석가가 지역별 공공임대 상가 공급 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·우편번호나 단지명을 이름으로 맞춰 연결해야 한다.
description_portal: 한국토지주택공사가 임대하는 공공임대상가의 공고별 임대료 내역 자료(공고명, 주소, 면적, 임대보증금, 우편번호, 임대료 등)를 제공합니다. 이 파일은 한국토지주택공사에서 제공한 공공임대 상가의 입점자 모집 공고별 임대료 내역으로, 공고명, 주소, 단지명, 층, 전용면적, 계약면적, 건축물용도, 임대보증금, 임대료, 공급예정금액 등의 항목으로 구성되어 있습니다. 입찰 또는 공모심사 방식의 공고 유형과 각 상가의 세부 조건이 포함되며, 공공임대 상가의 지역별 공급 정보와 상가별 면적 및 임대금액 수준을 파악하는 데 활용될 수 있다. 공공자산의 활용 실태와 상업시설 공급 현황 분석에 유용한 데이터입니다.
