summary_user: 광주광역시 동구(전남광주통합특별시 동구) 단독주택의 개별주택가격을 필지·건물 단위로 담은 건별 파일로, 소재지(읍면동코드·토지구분·본번·부번·건물번호), 대지면적과 건물연면적(전체·산정), 공시가격(원)을 함께 싣는다. 동구에 단독주택을 가진 주민이나 분석가가 "우리 집 공시가격이 얼마이고, 같은 동네 비슷한 면적의 주택과 비교하면 어떤가"를 확인하거나 보유세 부담을 가늠하는 데 쓴다. 전역 조인 키(PNU 등)는 컬럼에 없어서, 읍면동코드·토지구분·본번·부번을 이어 붙여 필지 식별값을 만든 뒤 토지·건축물 데이터와 연결해야 한다.
description_portal: 광주광역시 동구의 개별주택가격 데이터는 지역에 위치한 단독주택의 가치를 산정하기 위해 마련된 기초 정보로, 주택이 자리한 시군구와 읍면동 같은 행정구역 정보부터 토지의 구분, 주택이 위치한 본번과 부번, 건물번호 같은 세부 식별 정보까지 모두 포함하고 있습니다. 또한 주택이 자리한 대지의 면적과 건물의 연면적처럼 주택의 규모와 특성을 파악할 수 있는 요소도 함께 담고 있어, 실제 가격 산정이나 재산세·취득세와 같은 과세 업무에 중요한 자료로 활용됩니다. 이러한 정보들은 지역의 주택 상황을 보다 정확하게 이해할 수 있도록 돕고, 행정기관이 주거정책을 세우거나 부동산 변동을 분석하는 과정에서도 기본 자료로 쓰입니다. 주민들에게는 공시가격의 근거가 되는 데이터로서 신뢰도를 높여주며, 지역 부동산의 투명한 관리 기반을 마련하는 데에도 의미가 있습니다.
