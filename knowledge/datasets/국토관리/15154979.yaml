summary_user: 전국 지자체가 관리하는 분뇨수집운반업 인허가 업소를 건별로 담은 원천 데이터로, 사업장명·인허가일자·영업상태·주소·좌표를 싣고 전체 2,528건, 2001-03-22부터 2026-09-24까지의 범위를 가진다. 우리 동네에서 영업 중인 분뇨 수집·운반 업체가 어디에 있는지 찾으려는 국민·사업자·분석가가 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 조인 키로 삼아 같은 주소 키를 가진 다른 데이터와 이어 쓴다.
description_portal: '자원환경_분뇨수집운반업 데이터는 분뇨를 수집·운반(개인하수처리시설 및 분류식하수관로 중 오수가 흐르는 하수관로의 내부청소를 포함)하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 분뇨수집운반업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 기후에너지환경부 생활하수과 / 044-201-7033 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
