summary_user: '경상북도 청송군에서 내준 개발행위허가를 건별로 담은 파일로, 대지위치·지목·허가면적(제곱미터)·허가구분·허가일자·개발행위 목적을 기록한다. 청송군 안에서 특정 지역이나 지목(예: 임야·전)에 어떤 목적의 개발행위가 언제, 얼마나 넓게 허가됐는지 확인하려는 토지 매수 예정자나 지역 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(주소)·지목 같은 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.'
limits: 청송군 한 개 시군구 범위의 비공간 자료로, 좌표가 없어 지도 분석에는 주소를 따로 변환해야 하고 다른 시군과 비교하려면 지역별 파일을 모아야 한다. 명세상 연간 단위로 만들어지는 파일이라 최근 허가 건은 빠져 있을 수 있다.
