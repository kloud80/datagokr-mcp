summary_user: 성남시 안 지식산업센터를 건물 한 곳당 한 행으로 정리한 파일로, 명칭·지번/도로명 주소·용도지역·건축연면적·입주업체 수를 담는다. 창업이나 사업장 이전을 검토하는 사업자, 지역 산업 집적을 보는 분석가가 '성남시 어느 지역에 어떤 규모의 지식산업센터가 몰려 있고 입주업체는 얼마나 되나'를 확인할 때 쓴다. 실측 컬럼에 건물관리번호 같은 전역 조인 키가 없어 건축물대장이나 다른 시군구 지식산업센터 파일과는 주소·명칭을 맞춰서 이어 써야 한다.
description_portal: 성남시 지식산업센터 현황 자료는 성남시 내 지식산업센터의 위치, 규모, 입주업체 수 등을 체계적으로 정리한 자료입니다. 지식산업센터 명칭, 주소, 용도지역(근린상업, 준공업지역, 일반공업 등), 건축연면적, 입주업체수 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 지식산업센터의 규모와 산업 밀집도를 파악하여 창업. 이전등의 기초자료로 활용할 수 있습니다.
