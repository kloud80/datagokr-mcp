summary_user: 경기도 지역화폐 매출을 메인 지역 행정동(admdong_cd)과 매출이 들어온 유입지 행정동, 업종 중분류, 기준연월 단위로 집계한 자료로, 매출금액·순위·비중과 전월 및 전년 동월 대비 증감을 담는다. 상권 분석가나 지자체 담당자가 "우리 동 가맹점 매출은 어느 동 주민에게서 주로 들어오는가"를 확인해 상권 경쟁력을 비교하거나 정책 대상 지역을 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드를 행정구역 코드표와 이름·코드로 매핑하거나 같은 기관(경기도 분석시스템)의 다른 집계와 코드로 이어 쓴다.
description_portal: '이 데이터는 경기도 내 지역화폐 매출의 유입지를 기준으로 집계한 자료로, 메인 지역에서 타 지역으로 유입된 매출 정보를 제공합니다.- 대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.- 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.* 유입지 데이터 : A라는 메인 지역(행정동코드)에서 다른 지역(유입지행정동코드)으로 매출이 들어온 경우의 매출정보- 활용 방안으로는 상권별 경쟁력 분석, 지역화폐 소비 경향 파악, 정책 대상 지역 선정 등이 있습니다.'
