description_portal: 시민 의견 수렴 및 참여 행정 구현에 대한 사회적 요구가 높아지는 가운데, 충청남도 보령시는 누리집 메타데이터를 기반으로 설문조사 현황 데이터를 제공합니다. 본 데이터는 제목, 시작일, 종료일, 문항 개수, 항목 개수, 결과 공개 여부, 등록일, 수정일, 데이터기준일자 항목으로 구성되어 있으며, 보령시 누리집을 통해 운영된 설문조사의 현황을 체계적으로 파악할 수 있도록 정리되어 있습니다. 지자체 및 행정 관련 기관은 본 데이터를 통해 설문조사 운영 현황과 주제별 조사 빈도를 분석하고, 시민 의견 수렴 체계 개선 및 참여 행정 활성화 방안 수립에 활용할 수 있습니다. 또한 공공행정 연구기관에서는 설문 운영 기간 및 문항 구성 데이터를 바탕으로 온라인 시민 참여 실태 분석 및 디지털 소통 채널 개선 방안 연구에 기여할 수 있으며, 데이터 분야에서는 결과 공개 여부 현황을 활용하여 공공 설문 데이터의 투명성 제고 및 개방 확대 방안 마련에 본 데이터를 활용할 수 있습니다.
