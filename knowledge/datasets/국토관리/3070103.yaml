summary_user: 부산광역시 영도구가 관리하는 공동주택을 단지 한 곳당 한 행으로 담은 목록 파일로, 단지명·소재지·층수·동수·세대수·연면적(제곱미터)·준공일자(사용검사일)·사업계획 승인일자를 담는다(CSV 약 16.8KB). 주민이나 부동산·주거 분석가가 '영도구에서 준공 30년이 넘은 대단지 아파트는 어디이고 세대수는 얼마인가' 같은 질문에 쓴다. 실측 컬럼에 단지코드 같은 전역 조인 키가 없어서, K-apt 관리비·실거래·공시가격 자료와는 단지명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
