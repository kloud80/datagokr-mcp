summary_user: 대구 달성군 내 공동주택(아파트) 단지별로 단지명, 도로명주소, 동수, 층수, 세대수, 준공년도를 한 줄씩 담은 기초 현황 파일이다(csv 약 11KB, 범위는 달성군 한 곳). 달성군에 어떤 아파트가 어디에 몇 세대 규모로 언제 지어졌는지, 예컨대 준공 20년이 넘은 대단지가 어디에 몰려 있는지를 확인하려는 주민·분석가·행정 담당자가 쓴다. 전역 조인 키나 K-apt 단지코드가 없어, 실거래·공시가격·K-apt 관리비 자료와는 단지명이나 도로명주소를 맞춰 이어야 한다.
description_portal: 공동주택(아파트)의 기본 현황 정보를 정리한 자료로, 단지 명칭, 위치, 세대 수, 건축 연도 등 주택 행정 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 공동주택의 분포 현황과 주거시설 현황을 종합적으로 파악하기 위한 기초자료로 활용된다.또한 공동주택 현황에 대한 체계적인 관리를 통해 주거 환경 실태를 분석하고, 주택 정책 수립 및 주거 환경 개선을 위한 행정적 의사결정을 지원한다. 본 자료는 공동주택 관리 행정, 관련 민원 대응, 주택 관련 통계 산출 및 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 주거 환경의 안정적 관리와 주택 공급·관리 정책 추진을 위한 기초자료로 활용되며, 공동주택 관리 및 주거 복지 향상을 위한 행정 업무 수행을 지원하는 행정자료로 활용된다.
