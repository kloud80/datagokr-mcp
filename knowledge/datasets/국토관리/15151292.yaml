summary_user: 건물별 승강기의 고유번호·건물명·주소·종류·형식·검사유효기간(시작·종료일)·유지관리업체 등을 승강기 단위로 담은 조회 API이며, 범위는 전국이다. 건물주와 관리자, 분석가가 특정 건물 승강기의 검사 유효기간이 언제까지인지, 어떤 업체가 유지관리하는지 확인하는 데 쓴다. 건물주소(address1·address2)와 시도명(sido, 행정구역코드 키)으로 건축물·주소 계열 데이터와 이어 쓰고, 승강기고유번호(elevatorNo)로 승강기 단위 조회를 한다.
limits: 검증 호출에서는 API 전체 건수 1, 수신 1행만 확인되어 실제 수록 규모는 이 근거로 알 수 없다. 포털 활용신청 후 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다. 승강기고유번호는 조인 키로 확인된 바 없고, 확인된 조인 키는 주소와 시도뿐이다.
