summary_user: 경기도 가평군 관내 공동주택별로 사용연도, 단지명, 도로명·지번 주소와 1~12월 월별 상수도 사용량(톤)을 한 행에 담은 단지 단위 연간 집계 파일이며, 파일 크기는 약 5KB(csv)로 작다. 가평군의 특정 아파트 단지에서 여름철과 겨울철 물 사용량이 어떻게 달라지는지, 단지 사이 사용량을 비교하려는 분석가나 급수 계획 담당자가 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 주소(소재지도로명주소·지번주소)나 공동주택명을 이름 매칭해서 이어 써야 한다.
limits: 표준 코드형 조인 키가 없어 주택·건축물 데이터와 연결하려면 주소나 단지명을 직접 맞춰야 한다. 범위는 가평군 한 곳의 공동주택에 한정되며, 세대별·계량기별 사용량이나 요금은 담지 않는다.
