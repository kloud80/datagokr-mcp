summary_user: 공장설립온라인지원시스템에 등록된 강원특별자치도 내 건축분야 제조업체를 업체 한 곳당 한 행으로 담은 명부로, 회사명·공장 도로명주소·대표업종번호와 업종명·생산품·전화번호를 2024년 2월 8일 기준으로 담는다. 건축자재 납품처를 찾는 사업자나 도내 건축 관련 제조업의 업종별·지역별 분포를 보려는 분석가가 '강원도에서 이 자재를 만드는 공장은 어디에 있나'를 확인하는 데 쓴다. 사업자번호나 필지 코드 같은 전역 조인 키는 없어서, 다른 공장등록·기업 데이터와는 회사명·주소 문자열 매칭이나 대표업종번호(업종 분류 코드) 기준으로만 이어 쓴다.
limits: 전역 조인 키가 없어 기업·토지 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 2024년 2월 8일 기준의 한 시점 자료라 이후의 신규 등록·폐업은 반영되지 않는다.
