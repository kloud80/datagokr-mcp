summary_user: 충청남도 청양군 관내 도시계획정보 시스템의 공동개발 현황을 현황도형 관리번호·규제관리번호 단위로 담은 시군구 범위의 파일 데이터로, 약 1.5KB 규모의 작은 CSV입니다. 청양군의 공동개발 관련 도시계획 현황도형이 어떤 규제관리번호와 묶여 언제 생성됐는지 확인하려는 도시계획 분석가나 지역 정책 담당자가 쓴다. 실측상 전역 조인 키는 없으며, 시군구코드나 규제관리번호를 통해 같은 기관의 다른 도시계획 자료와 이름·코드 매핑으로만 연결한다.
description_portal: 해당 데이터는 충청남도 청양군 관내에 소재하는 도시계획정보 시스템의 공동개발 현황을 나타내는 자료로,도시계획정보 시스템의 공동개발 현황 활용 수요 증가에 따라 주목받고 있는 도시계획정보 시스템의 공동개발 현황의 상세 정보를 제공합니다.데이터 항목에는 현황도형  관리번호, 규제관리번호 등이 포함되어 있으며,이를 통해 각 도시계획정보 시스템의 공동개발 현황의 상세 정보를 파악할 수 있고, 관련 자원 연계에도 활용할 수 있습니다.이 자료는 지역 활성화 정책 수립, 도시계획정보 시스템의 공동개발 현황 개발 등의 기초 자료로 활용될 수 있으며,도시와 농촌 간의 교류를 확대하고 도시계획정보 시스템의 공동개발 현황 이용 활성화를 도모하는 데 기여할 수 있습니다.청양군의 도시계획정보 시스템의 공동개발 현황을 한눈에 파악할 수 있는 유용한 자료입니다.
