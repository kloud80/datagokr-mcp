summary_user: 경기도 내에서 자연환경이 잘 보전되었거나 주민 활동으로 생태가 복원된 마을로 지정된 생태우수마을·생태복원우수마을을 마을 1건씩 담은 현황 목록으로, 시군명·마을명·지정구분·지정사유·지정기간·주소·위경도를 포함한다. 생태관광이나 환경교육 대상지를 찾는 주민·지자체 담당자가 '우리 시군에 어떤 생태우수마을이 있고 왜 지정됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군명·주소 같은 이름 매칭이나 위경도(refine_wgs84_lat/logt) 기반 공간 결합으로 다른 행정·환경 데이터와 잇는다.
description_portal: 자연생태우수마을 이란 자연환경이 잘 보전되어 있거나 주민의 적극적인 환경보전활동으로 생태환경이 우수한 마을로본 데이터는 경기도 내 자연환경 보전과 생태 복원이 우수한 마을을 대상으로 지정된 생태우수마을 및 생태복원우수마을의 현황을 수록한 자료입니다. 주요 항목으로 시군명, 마을명, 지정구분명, 지정사유, 지정기간, 소재지지번주소, 소재지도로명주소, WGS84위도, WGS84경도 등이 포함되어 있습니다. 지정사유 항목을 통해 해당 마을의 생태환경 관리상태 및 복원 노력 사항이 설명되어 있습니다.2018년 이후 자연생태 우수마을 지정이 중단되며 갱신이 중단된 데이터 입니다.
