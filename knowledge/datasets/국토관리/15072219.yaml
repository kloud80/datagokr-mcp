description_portal: '이 자료는 서울특별시에서 공익사업을 위해 토지 등을 취득하거나 사용해야 할 경우 발생하는 수용재결 절차 및 사업진행 단계의 정보를 정리한 데이터입니다. 주요 항목으로는 사업시행자, 사업명, 사업차수, 수용재결 일정 등이 포함되어 있어, 사업의 진척 상황이나 수용절차의 상태를 분석할 수 있게 설계되어 있습니다. 이 데이터는 도시계획·토지관리 측면에서 활용되며, 사업구역 내 토지소유자 피해보상 또는 절차부존재 여부 등을 검토하는 데 유용합니다. 또한 GIS 데이터와 결합해 수용사업이 집중된 공간을 분석하거나, 자치구별 수용재결 사업의 분포·패턴을 파악할 수 있는 기초자료로 활용될 수 있습니다.수용재결 사업의 단계적 진행 정보로 사업시행자, 사업명, 사업차수, 수용재결일정 등으로 구성되어있습니다.※ 수용재결 : 공익사업에 필요한 토지등을 취득하거나 사용하기 위해 토지소유자 등이 입은 손실에 대하여 사업시행자와 토지소유자등 사이에 협의가 성립되지 않을경우 법률에 의해 소유권등을 취득하고 손실을 보상하는것.'
