summary_user: 전라남도 함평군 관내 배수펌프장을 시설 한 곳당 한 행으로 담은 소규모 CSV 파일(약 2KB)로, 시설명·위치·준공년도·펌프·계약용량·처리능력·유수지용량·수문 정보를 담는다. 함평군 주민이나 방재 담당자가 "우리 동네 저지대 침수를 막는 배수펌프장이 어디에 있고, 처리능력과 유수지 규모는 얼마인가"를 확인하는 데 쓴다. 하천코드 같은 전역 조인 키가 없어서, 다른 하천·수문 데이터와는 시설명이나 위치 주소를 직접 맞춰 보거나 같은 함평군 자료끼리만 이어 쓴다.
description_portal: 기후변화로 인한 집중호우 및 국지성 강우의 빈도 증가에 따라 저지대 침수 피해 방지를 위한 배수시설의 중요성이 커지고 있습니다. 전라남도 함평군은 침수 예방 및 신속한 배수 체계를 구축하기 위해 관내 배수펌프장의 운영 현황을 체계적으로 관리하고 있으며, 해당 정보를 공공 데이터로 제공합니다. 개방 데이터는 시설명, 위치(주소 또는 좌표), 설치연도, 펌프 용량(m³/min), 펌프 수량, 관리기관 등으로 수집 범위는  전라남도 함평군 관내 전체 행정구역 입니다.
