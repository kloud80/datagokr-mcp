summary_user: 경상남도 사천시 관내 일반건축물의 시가표준액을 납부년도별로 물건지·연면적·결정일자와 함께 담은 파일로, 포털 설명상 2018~2021년 현황이며 범위는 사천시 한 곳(시군구 단위)이다. 사천시 건물 소유자나 분석가가 "이 건물의 재산세·취득세 과세 기준이 되는 시가표준액이 연도별로 얼마였나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 물건지(주소) 이름 매칭이나 자치단체코드 같은 기관 코드로만 연결하며, 같은 형식의 다른 시군구 시가표준액 파일과 이어 붙여 비교할 때 쓴다.
description_portal: 경상남도 사천시의 일반건축물 시가표준액 데이터를 2018년부터 2021년까지의 연도별 현황으로 공공에 제공합니다.이 데이터는 사천시 관내 일반건축물에 대한 지방세(재산세, 취득세 등) 부과의 기준이 되는 시가표준액 정보를 담고 있습니다. 시가표준액은 지방세법에 따라 매년 산정되며, 건물의 구조, 용도, 위치, 경과 연수 등을 종합적으로 고려하여 결정된 금액입니다.공개되는 자료에는 건물 소재지, 용도, 면적, 산정된 시가표준액 등이 포함되어 있으며, 납세자의 세금 산정 근거를 투명하게 공개하고, 부동산 시장 및 재정 연구의 기초 자료로 활용됩니다. 이로써 지방세 행정의 공정성과 신뢰성을 높이는 데 기여합니다.
