summary_user: 제주 어영소공원에서 용두암(비행기 이착륙 포토스팟)까지 이어지는 해안도로 코스의 무장애 여행 정보를 구분·유형·추천여부·비고 항목으로 담은 안내 자료로, 포털 설명상 주차장·화장실 같은 편의시설, 코스 경로, 휴무일·관람료 등이 들어 있다. 휠체어 이용자나 고령 관광객이 "이 코스에 장애인 화장실과 주차장이 있고 휠체어로 다닐 만한가"를 확인하거나, 관광 부서가 무장애 관광 인프라 개선 대상을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설 이름이나 같은 기관(제주특별자치도) 기준으로만 맞춰 이어 쓴다.
description_portal: '제주특별자치도 내 어영소공원~용두암(비행기이착륙포토스팟)_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도 어영소공원 ~ 용두암(비행기 이착륙 포토스팟) 무장애여행관광정보」로, 제주특별자치도 디지털혁신과에서 제공하는 무장애 관광 안내 자료이다. 해당 코스는 어영소공원부터 용두암까지 이어지는 해안도로 구간으로, 특히 비행기의 이착륙 모습을 볼 수 있는 포토스팟이 포함됨으로써 관광적 매력이 크다. 본 자료에는 코스 개요, 위치 및 주소, 주차장·화장실 등 편의시설 현황, 코스 경로, 휴무일 및 관람료 등의 기본 정보뿐 아니라 각 포인트별 사진 이미지 등이 포함된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
