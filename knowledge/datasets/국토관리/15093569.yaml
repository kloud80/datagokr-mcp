status: active
summary_user: 경상남도 하천관리시스템의 하천개황을 하천 한 건당 한 행으로 담은 원천 목록으로, 하천명·수계와 본류~5차 지류 계통, 하천 지정일과 고시번호, 관리청, 시점·종점 위치, 계획홍수량·계획홍수위·계획하폭, 하천연장을 포함한다(CSV 약 185KB). 하천 정비·인허가 담당자나 분석가가 경남의 특정 하천이 어느 수계에 속하고 누가 관리하며 계획홍수위와 계획하폭이 얼마인지 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 하천명·수계명 같은 이름 매핑이나 같은 기관의 하천관리코드로 잇고, 시점·종점의 동코드는 법정동 단위 행정구역과 맞춰 보는 데 쓸 수 있다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 하천코드(WAMIS) 기반의 국가 하천 원장과 바로 결합되지 않고, 이름이나 기관 내부 코드로만 연결된다. 범위는 경상남도에 한정된 비공간 표 자료로 하천구역 경계 도형은 없으며, 하천구역 안팎의 건축 규제를 판단하려면 국가공간정보포털 등 공간 자료가 따로 필요하다.
