summary_user: 부산광역시 연제구의 일반건축물 시가표준액을 필지·건물 단위로 담은 건별 파일로, 과세년도·법정동·본번·부번·동·호·연면적·기준일자와 시가표준액을 담는다(csv 약 3.4MB). 연제구에 건물을 가진 사람이나 세무·자산평가 분석가가 "이 건물의 과세 기준이 되는 시가표준액이 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 건축물·토지 데이터와는 법정동명과 본번·부번(지번)을 맞추거나 자치단체코드로 같은 기관 자료끼리만 이어 쓴다.
description_portal: 부산광역시 연제구에서 제공하는 ‘일반건축물시가표준액’ 데이터는 일반건축물에 대한 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 연면적, 기준일자, 시가표준액 등의 항목으로 구성되어 있습니다. 이 데이터는 건축물 및 부동산 관련 행정 업무나 등기, 세금 부과, 자산 평가 등에 사용됩니다. 법정동과 법정리는 행정구역을 구분하는 기본 단위로, 건축물이 위치한 지역을 명확히 식별할 수 있게 해 줍니다. 특수지는 토지 이용 목적이나 지형적 특성을 반영하는 항목이며, 본번과 부번, 동, 호는 건축물 내 세부 위치를 나타내는 상세 주소 체계입니다. 물건지는 건축물이나 토지의 고유 식별 정보로, 연면적은 건축물의 총 바닥 면적을 의미합니다. 기준일자는 해당 정보가 유효한 시점을 나타내며, 시가표준액은 과세나 평가 기준이 되는 표준 시가를 의미합니다. 이 모든 정보는 부동산 거래, 평가, 관리, 세무처리 등 다양한 분야에서 활용됩니다.
