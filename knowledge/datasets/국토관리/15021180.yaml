summary_user: 경상남도 하동군에서 지정한 담배소매인을 업소 한 곳당 한 행으로 담은 파일로, 대표자명·업소명·업소 도로명주소를 포함하며 범위는 하동군 한 개 시군구입니다. 하동군 안에서 담배를 파는 가게가 어디에 있는지 확인하려는 주민이나, 새로 담배소매점을 내려는 사업자가 주변 기존 소매인 위치를 살펴볼 때 쓴다. 공통 조인 키나 코드표가 없어서, 다른 데이터와 이으려면 업소명이나 도로명주소를 문자열로 맞추거나 주소를 좌표로 바꿔 연결해야 합니다.
limits: 전역 조인 키가 없어 사업자등록·인허가 등 다른 데이터와 바로 붙일 수 없고, 이름이나 주소를 직접 맞춰야 합니다. 범위는 하동군에 한정되므로 다른 시군과 비교하려면 각 기관의 파일을 따로 모아야 합니다.
