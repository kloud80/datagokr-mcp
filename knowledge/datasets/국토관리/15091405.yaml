summary_user: 충청남도개발공사가 추진한 산업단지·신도시·지구개발 등 주요 사업지구별로 소재지, 사업규모(제곱미터), 사업기간, 분양 진행 상태(분양중·분양완료 등)를 한 행씩 담은 작은 목록 파일(csv, 659바이트)이다. 충남 지역 산업용지나 신도시 부지 입주를 검토하는 사업자가 '어느 사업지구가 아직 분양 중인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구명이나 소재지(시·군·읍·면) 이름을 맞춰 연결해야 한다.
description_portal: 이 자료는 충청남도개발공사의 사업별 분양현황으로, 주요 개발사업의 소재지·규모·사업기간 및 분양진행 상태를 제공한다. 단, 개별 필지별 분양가격이나 세부 계약 조건은 미제공된다.키워드별 상세설명○ 분양현황 → 각 사업지구별 분양 진행 상태를 나타내며, 분양중·분양완료 등으로 구분됨○ 개발사업 → 충청남도개발공사가 추진한 주요 사업 단위를 의미하며, 산업단지·신도시·지구개발 등이 포함됨○ 산업단지 → 공업·제조업 기반의 산업용지를 개발하여 분양하는 사업을 의미하며, 지역경제 활성화 목적을 가짐○ 신도시 → 대규모 주거·상업·공공시설을 포함한 신도시 개발사업을 의미하며, 장기간에 걸쳐 추진됨○ 사업규모 → 해당 사업의 총 개발면적을 제곱미터 단위로 표시하여 사업의 물리적 규모를 파악할 수 있도록 제공됨○ 사업기간 → 사업이 착수된 날부터 준공 및 종료 시점까지의 기간을 의미하며, 장기 사업일 경우 수년에 걸쳐 진행됨○ 소재지 → 각 사업이 진행되는 행정구역상의 위치를 의미하며, 시·군·읍·면 단위로 기재됨○ 분양진행상황 → 사업지구별 현재 분양 상태를 의미하며, 분양중·분양완료 등으로 표시되어 진행 현황을 확인할 수 있음
