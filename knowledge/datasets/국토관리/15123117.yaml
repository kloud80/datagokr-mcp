summary_user: 경기도에서 접수된 혼인신고를 한 건씩(순번 기준) 담은 원천 자료로, 신고 연월일과 실제 혼인 연월, 남편·아내 각각의 주소 시도·시군구 코드, 직업·학력·혼인종류·연령·국적 코드, 신고 접수 시군구 이름과 코드를 담는다. 가족정책 담당자나 인구 연구자가 '경기도 시군별로 국제결혼이나 재혼 비중, 부부 연령·학력 조합이 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시군구 코드·이름(signgu_cd)을 행정구역 코드표와 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도에서 발생한 혼인 신고에 대한 정보를 담은 자료로, 신고년도와 월, 일뿐만 아니라 실제 결혼이 이루어진 시점, 배우자 각각의 시도 및 시군구 코드, 직업 및 학력 코드, 결혼 종류 코드, 연령 코드, 국적 코드 등 혼인 관련 주요 정보를 포함하고 있습니다. 각 건은 순번을 기준으로 기록되며, 최종적으로 혼인신고가 접수된 시군구의 명칭 및 코드를 포함하여 상세한 지역 정보를 제공합니다. 이 데이터는 결혼 시기의 추세 분석, 지역별 결혼 특성 파악, 연령 및 학력에 따른 혼인 양상 분석 등에 활용될 수 있으며, 경기도 내 인구 사회학적 연구, 가족 정책 수립, 결혼 지원 정책 설계 등에도 유의미하게 사용될 수 있습니다.
