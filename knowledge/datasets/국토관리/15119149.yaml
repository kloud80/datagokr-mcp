summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)에 담긴 건축물대장 총괄표제부를 건물 단위로 정리한 파일로, 건축물대장 고유번호별 건축면적·연면적과 기타 용도를 담는다(CSV 약 35KB, 진안군 범위). 진안군 안 특정 건물의 바닥면적과 전체 층 면적, 쓰임새를 확인하려는 분석가나 사업자가 '이 건물의 연면적과 용도는 무엇인가'를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 건축물대장 고유번호나 이름 매칭, 같은 기관 코드로만 이어 쓴다.
description_portal: '전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 건축물대장 총괄표제부에 대한 공공데이터 자료입니다. 이번 자료에서는 건축물대장 고유번호, 건축면적(의미: 건물이 지면과 맞닿는 바닥면적), 연 면적(의미: 모든 층의 바닥면적을 합산한 면적), 기타 용도 정보를 제공합니다. 이 자료를 통해 건축물대장 고유번호에 맞은 건축물에 대한 건축면적과 연 면적이 각각 얼마인지 알아볼 수 있습니다. 또한 기타 용도 정보를 통해 각 건축물이 어떤 용도로 사용하는지도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다.'
