summary_user: 경기도 데이터분석시스템이 제공하는 업체별 건별 자료로, 시군구 단위로 업체명·법인등록번호·사업자등록번호·도로명주소·업종명·등록일자·업종상태(정상, 폐업, 등록말소 등)·위도·경도를 기준연월과 함께 담는다. 지역경제 분석가나 행정 담당자가 '우리 시군에서 특정 업종의 정상 영업 업체는 몇 곳이고 어디에 몰려 있는가' 같은 업체 분포·영업 상태 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군구코드·시군구명이나 사업자등록번호를 이름·코드로 맞춰 보는 방식으로만 잇는다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 지역별 업체상태 내역 정보로, 각 시군구 단위의 업체별 등록 및 영업 현황을 정리한 자료입니다. 주요 항목은 시군구코드, 업체명, 법인등록번호, 도로명주소, 업종명, 등록일자, 업종상태명, 위도·경도 등이며, 업체의 위치, 업종 구분, 사업자 등록 및 영업 상태(정상, 폐업, 등록말소 등)를 확인할 수 있습니다. 이 데이터는 지역별 산업 구조 파악, 업체 분포 분석, 경제 활동 현황 모니터링에 활용할 수 있으며, 행정계획 수립, 기업 활동 지원, 지역경제 연구 기반자료로 쓰일 수 있습니다.
