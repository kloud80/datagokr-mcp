description_portal: 본 데이터는 인천광역시 동구 관내 법정동별 토지 지목별 면적 및 필지 수 정보를 제공하는 공공데이터이다. 지목은 전, 답, 과수원, 임야, 공장용지, 학교용지, 철도용지, 하천, 유지 등 다양한 용도로 구분되며, 각 지목별로 공시된 면적과 해당 필지 개수가 포함되어 있다. 본 자료는 토지이용계획 수립, 개발사업 기획, 도시계획 수립 등 다양한 행정 및 민간 분야에서 활용 가능하다. 특히 지목별 용도 분포를 통해 도시 구조와 토지 활용 특성을 파악할 수 있으며, 지역 간 개발 현황이나 녹지·공공시설 비율 등 정책 수립 시 참고자료로 사용된다. 또한 공장용지나 주차장, 묘지 등 특수 지목에 대한 정보도 포함되어 있어 상세한 지역 토지 특성 분석이 가능하다. 데이터는 주기적으로 갱신되며, 행정 및 연구 목적으로 폭넓게 활용된다.
