description_portal: 이 데이터는 서울특별시 및 서울주택도시공사(SH공사)가 소유한 **공공한옥 10채(총 19동)**에 대해 3차원(3D) 실측을 수행한 후, 이를 기반으로 가공한 3D 프린팅용 파일 데이터입니다. 원본 실측 데이터는 한옥 건축물의 구조적 특성과 세부 형태를 정밀하게 디지털로 복원한 자료이며, 본 파일은 이를 후처리하여 **3D 프린터로 출력이 가능한 형식(STL, OBJ 등)**으로 변환한 것입니다. 이를 통해 전통 한옥의 실물 축소 모형 제작, 교육용 입체 자료 활용, 문화재 복원 시뮬레이션, 디지털 아카이빙 등 다양한 목적에 활용될 수 있습니다. 특히 목재 구조, 지붕 형상, 처마 곡선 등 한옥 고유의 미세한 조형 요소가 고해상도로 구현되어 있어, 건축문화유산의 보존 및 확산에 기여하는 디지털 자산으로 높은 가치를 지닙니다.
