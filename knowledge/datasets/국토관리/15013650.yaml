summary_user: 인천광역시 강화군의 2016년 기준 개별주택가격을 필지(지번) 단위로 담은 파일로, 시군구·읍면동·리 코드와 토지구분·본번·부번, 주택공시가격이 들어 있다. 강화군 단독주택 소유자나 분석가가 '2016년 이 지번 주택의 공시가격이 얼마였나'를 확인하거나 읍면별 공시가격 분포를 볼 때 쓴다. 전역 조인 키는 없으므로, 다른 데이터와 이으려면 시군구·읍면동·리 코드와 토지구분·본번·부번을 조합해 지번(필지고유번호 형태)을 만들어 붙여야 한다.
limits: 민원 요청에 따른 1회성 제공 자료로 2016년 기준만 있고 이후 연도는 갱신되지 않는다. 강화군 한 개 시군구만 다루며, 실측 컬럼에 표준 조인 키가 없어 코드 조합이나 이름 매핑으로만 연결된다.
