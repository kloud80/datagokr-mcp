description_portal: '이 자료는 공동주택의 실태를 파악하고, 주거환경 개선, 도시계획, 주택정책 수립 등 다양한 행정 업무에 활용할 수 있는 기초 자료로서의 의미를 가집니다.1. 데이터 기본 구성자료는 크게 기본정보와 주택단지 세부 현황으로 나누어져 있으며, 각 항목은 다음과 같이 구성되어 있습니다.(1) 기본정보순번: 데이터상에서 공동주택 단지를 구분하기 위한 일련번호입니다.공동주택명: 단지 명칭을 기록하며, 통상적으로 분양 당시의 아파트명이나 현재 사용 중인 단지명이 기재됩니다.위치: 단지가 속한 지역이나 행정구역을 간략히 나타냅니다.지번주소: 토지 지번을 기준으로 한 전통적 주소 체계입니다. 행정업무나 등기 관련 절차에 여전히 활용됩니다.도로명주소: 현재 공식적으로 사용되는 주소 체계로, 도로와 건물번호를 기준으로 표시됩니다.(2) 행정구역 정보행정동명 / 행정동코드: 주민센터 및 행정업무 처리를 담당하는 행정동 단위와 고유 코드입니다.법정동명 / 법정동코드: 법률적으로 지정된 동 단위와 코드로, 행정동과는 다소 차이가 있을 수 있습니다.이 정보는 공동주택 단지가 어느 구역에 속하는지를 정확히 확인하는 기준이 됩니다.(3) 단지 규모 및 건축 현황층수: 단지 내 건물 중 최고 높이의 층수를 의미합니다. 이를 통해 주거 형태(저층·중층·고층 아파트 등)를 파악할 수 있습니다.동수: 단지를 구성하는 건물(동)의 총 개수를 나타냅니다. 단지의 규모를 직관적으로 보여주는 지표입니다.세대수: 단지 내 전체 가구 수를 의미하며, 거주 인구 규모를 추정할 수 있는 기초 자료가 됩니다.사용승인일: 건축물이 준공되어 입주가 가능하도록 행정기관으로부터 승인을 받은 날짜입니다. 이를 통해 단지의 건축 시기와 노후도를 파악할 수 있습니다.'
