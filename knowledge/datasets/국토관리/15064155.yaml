summary_user: 세종시 행복도시 안 공동주택의 준공계획을 생활권·블록 단위로 담은 파일로, 블록마다 사업자, 주택유형, 입주시기, 세대수를 적는다. 분석가나 실수요자가 앞으로 어느 생활권에 어떤 유형의 주택이 몇 세대 입주하는지, LH와 민간 건설사 물량은 얼마인지 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 생활권·블록 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 공동주택 준공계획 현황을 제공합니다. 생활권 및 블록 단위로 사업자, 주택유형, 입주시기, 세대수 등의 정보를 포함하고 있어, 공공기관(LH)과 민간 건설사의 공급 주체별 주거공급 현황을 확인할 수 있습니다.이를 통해 행복도시 내 주택 공급 규모와 유형별 분포를 파악할 수 있으며, 예정 입주시기와 세대수를 기준으로 향후 입주 물량 추세를 분석할 수 있습니다. 본 데이터는 주거정책 수립, 인구 이동·수요 예측, 주택시장 분석, 생활권별 기반시설 계획 등에 활용될 수 있습니다.
