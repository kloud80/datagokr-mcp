summary_user: 광주 지역에서 분뇨 수거를 맡은 업체별로 업체명·연락처·소재지, 총·현장 종사자 수, 차량별 적재량(톤)을 기준연도·자치구 단위로 담은 현황 파일(CSV)이다. 주민이나 행정 담당자가 우리 자치구의 분뇨 수거 업체가 어디이고 연락처는 무엇인지, 업체별 인력과 차량 수거능력이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어 자치구명이나 업체명·소재지 같은 이름을 매핑해 하수처리장·정화조 등 다른 하수도 데이터와 연결해야 한다.
