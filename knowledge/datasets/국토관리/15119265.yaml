summary_user: 경기주택도시공사 기금관리시스템에서 나온 기존주택 전세임대 자료로, 사업연도·공급지역(수원·고양·성남 등 경기도 시군)별 계획·지원·계약·해약 호수와 이율 적용 정보, 권역별 담당 법무법인 연락처를 한 파일(CSV, 약 51KB)에 담는다. 경기도 내 어느 시군에 연도별로 전세임대가 몇 호 계획되고 실제 계약됐는지 확인하려는 정책 분석가나 지역 임대사업 계획 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 공급지역 이름(시군명)이나 사업연도를 맞춰 연결하며, 전월세 실거래 같은 임대차 데이터와 지역 단위로 함께 본다.
description_portal: 경기주택도시공사의 주택임대사업과 관련 주택도시보증공사의 전세임대기금 관리를 위한 경기주택도시공사 기금관리시스템의 메타데이터 기반 기존주택 전세임대정보 데이터로써 사업연도, 공급지역, 계획호수, 지원호수, 계약호수, 해약호수, 이율명, 적용일, 적용금액, 적용이율, 절삭단위, 권역명, 전화번호, 약어, 권역주소(담당법무법인) 등의 정보를 포함하고 있습니다. 수원시, 과천시, 고양시, 광명시, 남양주시, 성남시, 평택시, 하남시, 화성시 등 경기도 내 공급지역별 연도별 기존주택 전세임대 공급 호수를 제공함으로써 지역별 임대사업 현황 파악 및 관련 사업계획의 기초자료로 활용될 수 있습니다.
