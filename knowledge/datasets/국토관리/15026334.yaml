summary_user: 부산광역시 동래구에 등록된 정화조 청소업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·소재지·대표자와 작업·사무 종사원 수, 탱크 용량별(5kl 이하~20kl 초과) 차량 대수를 담으며 파일 크기는 261바이트로 업체 수가 몇 곳 안 되는 소규모 목록이다. 동래구 주민이나 건물 관리자가 관내에서 정화조 청소를 맡길 업체와 그 업체의 인력·차량 규모를 확인할 때 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 잇거나 같은 동래구 자료끼리만 묶어 쓴다.
description_portal: 동래구를 소재로  등록되어 있는 정화조 청소업체 현황을 제공합니다.데이터의 구성은 업체명, 소재지, 대표자, 종사원(작업인원)종사원(사무원)차량(5kl 이하)차량(10kl 이하)차량(20kl 이하)차량(20kl 초과)데이터 항목 설명 1.업체명, 2.소재지, 3.대표자, 4.종사원(작업인원)5.종사원(사무원) 6.차량(5kl 이하) 7.차량(10kl 이하) 8.차량(20kl 이하) 9.차량(20kl 초과)본 파일 데이터는 부산광역시 동래구 관내에서 영업 중인 정화조 청소업체 현황으로 사정에 따라 데이터 항목이 변경되거나 삭제됨에 유의하시길 바랍니다.사정 상 직접 확인이 어려우신 경우에는 부산광역시 동래구 자원순환과 담당자(☎ 051 550 4442)에게 직접 문의 하시길 바랍니다.감사합니다
