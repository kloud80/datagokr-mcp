description_portal: 상수도요금 자동이체수납건수란 특정기간동안 상수도 요금이 자동이체(신용카드, 계좌) 방식으로 납부된 건수를 의미하며, 본 자료는 대구광역시 상수도사업본부에서 2020년 1월부터 2025년 9월까지 상수도 요금이 자동이체로 수납된 월별건수를 포함하고 있습니다.부가적인 관련 설명은 상수도요금은 집이나 사업장에서 사용하는 수돗물 요금을 의미합니다.  자동이체는 상수도요금 수납방법중 은행계좌나 신용카드에서 정해진 날짜에 자동으로 빠져나가는 방식을 말합니다.  수납건수는 상수도요금 자동이체로 성공적으로 요금이 납부된 횟수를 뜻합니다. 참고로 대구시 상수도요금 자동이체일은 계좌(21일, 말일), 카드(23일)입니다.
