summary_user: 경기도 시군별·연도별로 상수도 요금을 업종(가정용·상업용·산업용 등)으로 나눠 부과액·부과량·평균단가·최초 1㎥ 요금을 담은 집계 자료이며, 건별 고지 내역은 들어 있지 않다. 분석가나 지자체 담당자가 "우리 시의 산업용 수도요금 평균단가가 다른 시군보다 얼마나 높은가"처럼 업종 간·시군 간 요금 부담을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군명이나 경기도 시군코드(SIGUN_CD)를 이름·코드로 맞춰 연결한다.
description_portal: 이 데이터는 각 업종별로 상수도 사용에 따른 요금 부과 현황을 집계한 자료로, 산업·상업·가정용 등 다양한 업종을 기준으로 수도요금이 어떻게 부과되는지 상세하게 보여줍니다. 주요 항목으로는 집계년도(SUM_YY), 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 업종구분명(INDUTYPE_DIV_NM), 부과액(LEVY_AMT), 부과량(LEVY_QTY), 평균단가(AVG_UNPC), 최초1㎥요금(FIRST_CM1_CHRG)이 있으며, 이를 통해 업종 간 수도요금 차이를 비교하고 분석할 수 있습니다. 해당 데이터는 요금 정책 수립, 수자원 관리, 산업별 물 사용 효율성 평가 등 공공 및 민간 부문에서 폭넓게 활용될 수 있습니다. 특히 물 사용량이 많은 산업체의 요금 부담 분석, 요금 체계 개선, 지역별 수도요금 불균형 해소 등 정책 설계에도 기초 자료로 활용될 수 있는 유의미한 경제 관련 데이터입니다. API 제공을 통해 외부 시스템 연계 및 분석 자동화도 지원합니다.
