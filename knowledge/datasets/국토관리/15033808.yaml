description_portal: '인천광역시 부평구의 소재지 및 지목별 (전, 답, 과수원, 목장, 임야, 광천, 염전, 대, 공장, 학교, 주차장, 주유소, 창고, 도로, 철도, 제방, 하천, 구거, 유지, 양어장, 수도, 공원, 체육, 유원지, 종교, 사적지, 묘지, 잡종지) 현황(면적, 지번수) 데이터를 제공합니다. 소재지 (Location): 해당 토지가 위치한 지역 또는 지번 정보입니다. 부평구 내 각 동이나 구역을 기준으로 토지 위치가 구분됩니다.전 (Paddy Field): 농업용지로 벼를 재배하는 데 사용됩니다.답 (Dry Field): 주로 농업용지로 사용되며, 밭에서 다양한 농작물이 재배됩니다.과수원 (Orchard): 과일나무를 재배하는 농업용지로 활용됩니다.목장용지 (Pasture Land): 가축을 기르기 위한 용지로, 면적과 지번 수를 제공합니다.임야 (Forest Land): 임야는 산림 및 숲을 포함하는 토지로, 면적과 지번 수를 통해 산지 보호와 관련된 정보를 파악할 수 있습니다.광천 (Hot Spring Area): 온천 지역에 관련된 토지 염전 (Salt Field): 주로 소금 생산을 위한 토지대 (Urban Land): 대지(도시 건설용지)로, 주택이나 상업시설을 건설하기 위해 지정된 토지의 면적과 지번 수를 제공공장용지 (Industrial Land): 공장, 창고 등 산업 시설을 위한 토지입니다구거용지 (Drainage Canal Land): 배수로(구거) 용도로 사용되는 토지의 면적과 지번 수입니다.유지용지 (Preservation Land): 유지(보호구역)로 사용되는 토지, 환경 보존을 위한 토지입니다.양어장용지 (Fish Farm Land): 양어장(어류 양식장)으로 사용되는 토지사적지용지 (Historical Site Land): 사적지(역사적 유적지)로 사용되는 토지잡종지용지 (Miscellaneous Land): 잡종지(기타 용도)로 사용되는 토지'
