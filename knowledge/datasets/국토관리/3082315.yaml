description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘공장등록현황’ 공공데이터는 산업집적 및 공장설립 관련 법률 제13조·제16조에 따라 등록된 관내 공장 정보를 체계적으로 수집한 자료입니다. 항목으로는 회사명, 업종명, 공장 대표 주소(도로명 및 지번), 전화번호, 위도·경도, 데이터 기준일자 등이 포함되어 있어, 제조업 분포 분석과 산업 인프라 현황 파악에 유용합니다. 총 약 181건이 수록되어 있으며, 연간 주기로 갱신되므로 시기별 변동 추이를 이해할 수 있습니다 . 이 데이터는 지역 산업 정책 수립, 공장 입지 분석, 제조업 클러스터 개발, 환경·교통 영향 평가, 산업 통계 연구 등 다양한 공공·민간 분야에서 폭넓게 활용될 수 있습니다.
