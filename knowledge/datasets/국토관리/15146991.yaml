summary_user: 산업집적활성화 및 공장설립 관련 용도구역의 지정 구역을 시도별 SHP 파일로 담은 연속주제도 공간정보로, 각 지방자치단체가 구축해 국토교통부가 취합한 전국 범위 자료다. 공장 입지를 검토하는 사업자나 토지이용 분석가가 특정 필지·지역이 산업집적 관련 용도구역에 걸치는지, 언제 고시됐는지(NTFDATE) 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 공간 중첩(지오메트리)이나 행정구역 이름·코드 매핑, 같은 기관 코드로만 이어 쓴다.
