summary_user: 마이홈포털에 등록된 기존 국민임대주택을 단지·주택형 단위로 담은 파일 데이터로, 전국 4,417행에 지역, 단지명, 세대수, 준공일자, 공급면적, 임대보증금, 월임대료, 전환보증금 등이 들어 있다. 입주를 고려하는 국민이나 분석가가 특정 지역에 국민임대 단지가 어디에 있고 임대료 수준이 어떤지 알아볼 때 쓴다. 도로명주소(address)를 조인 키로 삼아 다른 주소 기반 주택 자료나 전월세 실거래 자료와 이어 쓴다.
description_portal: 한국토지주택공사에서 위탁관리중인 마이홈포털의 기존 국민임대 주택 정보로서 광역시도 및 시군구, 단지명, 세대수, 주택유형, 임대사업자, 공급면적(전용, 공용), 준공일자, 난방방식, 주차대수, 승강기 설치여부, 임대보증금, 월임대료, 전환보증금 등의 정보를 제공합니다. 국민임대 주택은 일반적으로 한국토지주택공사가 건설하여 공급하는 국민주택 면적(85㎡) 이하의 임대주택입니다. 입주자격 기준을 충족하면 2년마다 계약 갱신하여 거주할 수 있습니다. 입주자격, 입주절차, 임대조건 등 세부사항은 단지마다 차이가 있을 수 있으므로 LH 청약플러스(https://apply.lh.or.kr)에서 확인하시는 것을 권장드립니다. 본 데이터는 공급주체가 한국토지주택공사가 아닌 위탁 관리 중인 주택 정보를 포함하고 있으므로 유의하시기 바랍니다.
