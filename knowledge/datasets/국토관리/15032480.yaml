description_portal: 성남시내 주택의 종류의 구청별 수량 집계자료(아파트,연립,다세대,단독 등)입니다. 개별 주택정보가 제공되는 공동주택현황과 다른 자료입니다. 성남시는 경기도 내 대표적인 대도시로, 서울과 인접한 지리적 특성 때문에 주택 수요와 공급, 가격 변동, 주거형태 등이 다양합니다. 또한 주택 자가보유율은 전국 평균보다 낮고, 전·월세 거주 비율이 높아 청년 및 중산층의 주거 안정성이 중요한 정책 이슈로 대두되고 있습니다. 1인 가구, 고령 가구의 증가로 인해 소형 주택에 대한 수요도 꾸준히 증가하고 있으며, 노후주택 비율은 분당·판교를 제외한 구도심(중원·수정구)을 중심으로 높게 나타나 재개발·재건축 사업에 대한 수요가 지속되고 있습니다.
