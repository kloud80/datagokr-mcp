summary_user: 서울시에서 조사된 어류의 종별 출현 지점을 담은 공간정보로, 지점마다 종명·과명, 서울시 보호종·천연기념물·고유종·교란종·외래종 여부, 조사 지역·연도·출처와 좌표(XCRD·YCRD, EPSG:5174)를 담는 건별 원천 데이터다. 하천 생태를 분석하는 연구자나 환경단체가 '서울 어느 하천에 보호종이나 교란종 어류가 출현했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치구명(ATNM_DSTC_NM)이나 종명 같은 이름 매핑, 또는 좌표를 이용한 공간 중첩으로만 다른 데이터와 잇는다.
description_portal: 서울특별시 어류개별종분포 공간정보 입니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
