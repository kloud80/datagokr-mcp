summary_user: 창원시 행정구·읍면동별로 총인구, 급수인구, 미급수인구, 상수도보급률을 담은 집계 파일이며, 포털 설명 기준으로는 2025년 3월 31일 시점 시 전체 보급률 98.96% 등의 현황이다. 시민이나 지역 정책 분석가가 "창원시에서 상수도가 아직 들어오지 않은 읍면동은 어디이고 미급수 인구는 몇 명인가"를 확인하는 데 쓴다. 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 읍면동 이름을 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: 2025년 3월 31일 기준으로 집계된 창원시 상수도 보급 현황에 따르면, 전체 인구 1,018,209명 중 1,007,657명이 상수도 서비스를 이용하고 있으며, **상수도 보급률은 98.96%**에 달한다. 이는 대부분의 시민들이 안정적으로 상수도를 공급받고 있다는 점을 보여주지만, 여전히 일부 지역에서는 상수도 미보급 문제가 남아 있는 것으로 나타났다.창원시를 행정구별로 나누어 살펴보면, 의창구는 보급률이 98.4%로 비교적 낮은 편이며, 3,482명의 미급수인구가 존재한다. 특히 동읍과 북면 지역에 미급수가 집중되어 있는 것으로 파악된다. 성산구는 99.6%의 보급률을 보이고 있으며, 880명의 미급수인구가 존재하는데, 주로 성주동과 웅남동에 일부 분포되어 있다.한편, 마산합포구는 보급률이 97.3%로 상대적으로 낮은 편이다. 전체 미급수 인구는 4,826명으로, 시 전체에서 가장 많은 미급수 인구를 가진 구이다. 특히 진북면과 진전면이 미급수 비율이 높아 상수도 보급의 사각지대로 남아 있는 실정이다. 마산회원구와 진해구는 모두 99.6%의 높은 보급률을 기록하고 있으나, 각각 654명과 710명의 미급수 인구가 존재하며, 내서읍, 회성동(회원구) 및 풍호동, 웅천동(진해구) 등에 일부 분포되어 있다.특히 상수도 보급률이 낮은 읍면 지역을 보면 문제의 심각성이 보다 뚜렷해진다. 진북면의 보급률은 56.0%, **진전면은 43.1%**로, 두 지역 모두 절반 이하의 상수도 보급률을 기록하고 있다. 진북면에서는 1,565명의 인구가 상수도 서비스를 받지 못하고 있으며, 이 중 대부분인 1,369명은 소규모급수시설을 통해 물을 공급받고 있는 것으로 나타났다. 진전면 역시 2,154명의 미급수인구 중 1,181명이 소규모급수시설에 의존하고 있다. 이는 해당 지역에 대한 조속한 상수도 인프라 개선이 시급하다는 점을 시사한다.
